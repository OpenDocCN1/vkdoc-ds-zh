- '# 1. 图形语法


  数据可视化一直是统计学中非常重要的一部分。它为统计学家提供了一种以简洁且相对易于理解的方式与他人分享发现的方法。鉴于 R 是一种由统计学家为统计学家构建的编程语言，R
  社区做出了相当大的努力，以确保 R 用户能够有效地创建可视化，帮助他们讲述数据故事。


  可以说，最流行的 R 数据可视化包是 `ggplot2` 包。这个包由 Hadley Wickham¹ 创建，基于*图层化图形语法*的概念。*图层化图形语法*按以下方式定义了一个图形：


  -   一个默认数据集和一组从变量到美学的映射

  -   一个或多个图层，每个图层由一个几何对象、一个统计变换、一个位置调整以及可选的数据集和美学映射组成

  -   每个美学映射对应一个标度

  -   一个坐标系

  -   分面规范


  上述定义是作者对*图层化图形语法*的简洁而透彻的解释。您将学习如何使用上述概念，在 Power BI 中利用 `ggplot2` 包构建精美的可视化。


  尽管 Power BI 允许您使用 Python 和 R 中的多个库和包来创建视觉对象，但本书将特别关注 `ggplot2` 包以及一些辅助包。与 R 和 Python
  中的其他选项相比，`ggplot2` 包自成一类。`ggplot2` 所基于的*图层化图形语法*缩短了将数据可视化构思转化为代码所需的时间。该包功能丰富，因此您大部分的数据可视化需求都可以通过
  `ggplot2` 及其辅助包来满足。


  ## 在 Power BI 中构建 R 自定义视觉对象的步骤


  本节概述了您在 Power BI 中创建 R 视觉对象时将使用的工作流程。无论您创建的是哪种类型的 R 视觉对象，这些步骤都是一致的。步骤如下。


  ### 步骤 1：配置 Power BI


  您已在本书的引言中获得了有关如何在 Power BI 中配置 R 的信息。请务必按照这些说明中概述的步骤进行操作，以确保 Power BI 已配置为可以使用 R。


  ### 步骤 2：将“R 自定义视觉对象”图标拖到 Power BI 画布上


  现在，您将可以访问一个*R 自定义视觉对象*图标。要将 R 可视化添加到 Power BI，您首先需要将 R 视觉对象图标从*可视化窗格*拖到*报表画布*上。R
  视觉对象的图标是一个大写字母 *R*，在图 1-1 的图像中已突出显示。


  ![../images/480677_1_En_1_Chapter/480677_1_En_1_Fig1_HTML.jpg](img/480677_1_En_1_Fig1_HTML.jpg)


  **图 1-1** 用于在 Power BI 中创建 R 视觉对象的 R 图标


  R 视觉对象是 Power BI 中可用的默认视觉对象之一。您可以像处理任何其他 Power BI 视觉对象一样调整其大小和位置。




  ### 步骤 3：定义数据集


  与其他可视化对象一样，你需要定义该可视化所基于的数据集。你可以通过从数据模型添加字段以及可选的度量值到 *值* 窗格来构建数据集。生成的数据集将在 R 中作为一个称为
  *数据框* 的对象暴露出来。你可以将数据框视为一个 *Excel 表格*，但它拥有更多便于数据分析的功能。


  在创建 R 可视化对象时，你需要了解的数据框特性之一是，数据框中的行必须是唯一的。因此，当在 R 中创建数据框时，R 会采取措施确保行是唯一的。你需要确保传递给
  R 的数据集具有唯一的行。


  ### 步骤 4：在默认的 R IDE 中开发可视化对象


  现在你已经定义了数据集，就可以在你偏好的 IDE 中使用该数据集来开发所需的 R 可视化对象。你在 Power BI 中配置 R 时所做的其中一件事就是指定了你偏好的
  R IDE。该功能使你能够在功能丰富的 IDE（如 *R Studio*）中开发创建 R 可视化对象的代码，而不是在 Power BI 的 R 脚本编辑器中进行开发。


  R 可视化对象的代码位于 *R 脚本编辑器* 中。当你在报表画布上选择 R 可视化对象的图标时，Power BI 会显示该编辑器。R 脚本编辑器如图 1-2 所示。


  ![../images/480677_1_En_1_Chapter/480677_1_En_1_Fig2_HTML.jpg](img/480677_1_En_1_Fig2_HTML.jpg)


  图 1-2


  Power BI 中的 R 脚本编辑器


  如你所见，这并不是开发 R 代码的理想场所。这里没有智能感知，没有控制台，而且可用于开发代码的空间也很有限。幸运的是，Power BI 允许你将为自定义 R 可视化对象定义的数据集移植到你选择的
  R IDE 中。R 的推荐 IDE 是 *R Studio*，如果你按照本书引言中的说明操作，这里将使用它。


  要将可视化对象的数据集移植到 *R Studio* 中供 R 使用，请在报表画布中选择该 R 可视化对象，然后点击指向右上方 45 度角的箭头。该操作将启动 *R
  Studio*，并创建一个 R 脚本的开头部分，其中包含基于传递给 Power BI 中可视化对象的数据生成名为 *dataset* 的数据框的代码。该操作还会包含脚本中与该可视化对象相关的任何
  R 代码。微软没有试图重新发明轮子，而是决定让你能够在像 *R Studio* 这样的 IDE 中进行开发。因此，我强烈建议你在 *R Studio* 中完成所有代码开发，而不是使用
  Power BI 中那个狭小的 R 编辑器。


  ### 步骤 5：使用以下模板开发你的可视化对象


  在 Power BI 中开发 R 可视化对象时，R 脚本应使用清单 1-1 中的以下模板：


  ```

  if () {

  #

  } else {

  plot.new()

  title(main = "")

  }

  ```


  此模板用于测试数据集，以确保其满足所需 R 可视化对象的要求。如果满足，它将开始创建可视化；否则，它将生成一个带有消息的空白图表。使用以下代码创建带有预定义消息的空白图表：


  ```

  plot.new()

  title(main = "  ")

  ```


  第一行创建一个新的空白图表，第二行为图表添加一个标题，其中包含你想要显示给报表用户的消息。


  ### 步骤 6：使脚本功能完善


  一旦 R 脚本功能完善，将完整的脚本复制到 R 编辑器中。包含除创建名为 *dataset* 的数据框那一行之外的所有代码。*dataset* 数据框是在 Power
  BI 中自动生成的。请注意，Power BI 中生成的 R 可视化对象与其他可视化对象一样，完全响应外部筛选器和切片器。你将在下一章中看到几个示例。然而，你失去的一个功能是双向筛选。外部可视化对象会传播到
  Power BI 中的 R 可视化对象，但你无法直接从 R 可视化对象筛选其他 Power BI 图表项。


  ## 使用 ggplot2 创建 R 可视化对象的推荐步骤


  上一节说明了在定义 R 可视化对象的整体 R 脚本时应使用的总体模板。它包含了测试数据集的代码以及错误处理的代码。在本节中，我们将专门关注在测试数据集之后用于
  R 可视化对象的推荐模板。具体来说，我们讨论的是在以下清单中 `#<"Code for R Visual">` 位置放置的代码。


  ```

  if () {

  #

  } else {

  plot.new()

  title(main = "")

  }

  清单 1-1

  Power BI 的 R 可视化对象模板

  ```


  将通过开发图 1-3 中所示的图表来描述开发该模板的步骤。


  ![../images/480677_1_En_1_Chapter/480677_1_En_1_Fig3_HTML.jpg](img/480677_1_En_1_Fig3_HTML.jpg)


  图 1-3


  用于描述在 Power BI 中开发 R 可视化对象时应使用的模板的可视化对象


  上述 R 可视化对象使用钻石数据集绘制了颜色为 *D* 的钻石样本，以显示钻石价格与克拉大小的关系。这是一个很好的示例，因为它提供了一种相对简单的方法来说明开发
  R 可视化对象时模板中的每个步骤。让我们从步骤 1 开始。


  ### 步骤 1：加载脚本所需的包


  对于此示例，你将使用清单 1-2 中的以下代码来加载脚本所需的两个包。


  ```

  library(tidyverse)

  library(scales)

  清单 1-2

  导入语句

  ```


  你使用了来自 `tidyverse` 元包的 `ggplot2` 和 `dplyr`。


  `tidyverse` 元包是一组协同工作的包的集合，旨在使在 R 中进行数据科学工作更加容易。`tidyverse` 元包使你能够通过加载 `tidyverse`
  一次调用来导入核心包，而不必单独加载每个核心包。


  `ggplot2` 将用于创建可视化，`dplyr` 将用于执行一些数据整理任务。`scales` 包将用于帮助处理一些数字格式化任务。


  ### 步骤 2：对数据集进行必要的调整


  通常，在将数据框传递给 `ggplot2` 之前，需要对其进行调整。此示例中用于调整数据框的代码在清单 1-3 中。


  ```

  plot.data %

  filter(color == "D") %>%

  sample_n(200)

  清单 1-3

  可视化对象的数据准备

  ```


  传递给 R 的数据集包含可视化对象不需要的记录。因此，你需要使用 `dplyr` 包来移除不需要的数据。你想要创建一个基于颜色类型 *D* 的可视化。要获得具有所需颜色类型的数据框，你需要筛选原始的
  `diamonds` 数据框，仅包含那些颜色。你在上面的第三行中执行了此操作。


  该筛选操作只保留了颜色为 *D* 的钻石。结果数据框中的总记录数为 6775 条，这对于散点图可视化来说数量较多。在散点图中绘制过多的观测值可能会导致称为过度绘制的问题。为了尽量减少过度绘制，你可以对数据进行随机抽样，并绘制抽样后的数据。抽样数据将具有与原始数据相似的分布，这将使其绘制效果相似，但能最大限度地减少数据重叠。上述代码通过
  `dplyr` 中的 `sample_n()` 函数进行了内联抽样。结果是一个包含 200 条记录的随机样本，其绘制效果要好得多。




  ### 步骤 3：使用 `ggplot()` 函数启动可视化创建


  你通过 `ggplot()` 函数在 `ggplot2` 中启动图表的创建。当你调用 `ggplot()` 函数时，需要向其传递参数，这些参数将应用于图表的所有图层。在本示例中，你将
  `plot.data` 数据框设置为 `data` 参数，并将 `carat` 字段和 `price` 字段分别设置为 `aes()` 函数中的 `x` 和 `y`
  参数，如代码清单 1-4 所示。


  ```

  ggplot(data = plot.data, aes(x = carat, y = price))

  代码清单 1-4

  启动 ggplot() 函数

  ```


  了解 `aes()` 函数是什么以及如何使用它非常重要。`aes()` 函数描述了如何将数据映射到视觉属性。常用的美学属性包括：


  -   你所绘制的几何形状的 `x` 坐标和 `y` 坐标

  -   你所绘制的几何形状的颜色

  -   你所绘制的几何形状的大小

  -   你所绘制的几何形状的填充色


  上述 `aes()` 函数用于描述如何映射将要绘制的几何形状的 `x` 和 `y` 坐标。`aes()` 函数可以在 `ggplot()` 函数中定义，也可以在下一步将要学习的
  `geom` 函数中定义。如果在 `ggplot()` 函数中定义，则它将应用于图表的所有图层；但如果在 `geom` 函数中定义，则它仅在该函数定义的图层中可用。你将在下一章中看到这两种情况的示例。


  ### 步骤 4：添加所需的几何对象


  你可以使用代码清单 1-5 中的代码来实现。


  ```

  ggplot(plot.data, aes(x = carat, y = price)) +

  geom_point()

  代码清单 1-5

  添加几何对象

  ```


  当你在上一步中启动 `ggplot()` 函数时，可视化图形没有任何图层，因此没有内容可以显示。用于向 `ggplot` 可视化图形添加图层的机制是 `geoms`。在
  `ggplot` 中用于创建散点图的几何对象是 `geom_point()`。在上述代码中，`geom_point()` 继承了其前面的 `ggplot()`
  函数，因此你应该注意到，无需显式定义数据源以及定义 `x` 和 `y` 坐标所需的美学属性。生成的图表如图 1-4 所示。


  ![../images/480677_1_En_1_Chapter/480677_1_En_1_Fig4_HTML.jpg](img/480677_1_En_1_Fig4_HTML.jpg)


  图 1-4


  基础散点图


  你希望添加一个额外的细节图层。你想识别散点图中每个点的 `clarity`（净度）。为此，你可以在 `geom_point()` 几何对象中将 `color`
  的美学属性设置为 `clarity`，如代码清单 1-6 所示。


  ```

  ggplot(plot.data, aes(x = carat, y = price)) +

  geom_point(aes(color = clarity))

  代码清单 1-6

  为颜色添加美学属性

  ```


  你在 `geom_point()` 几何对象中设置此美学属性，是因为该美学属性仅在该图层中需要。


  请务必记住，当你在 `ggplot()` 函数中设置数据源或美学属性时，它们将应用于可视化图形的所有图层；但当你将它们设置在单个几何对象中时，它们仅在与该几何对象关联的图层中可用。


  识别出每个点净度的代码输出结果如图 1-5 所示。


