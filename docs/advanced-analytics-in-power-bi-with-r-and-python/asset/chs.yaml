  df_read <- sqlQuery(channel = conn, query = sql)

  datestamp <- now()

  num_records <- nrow(df_read)

  list_insert <- list(

  "DATESTAMP" = datestamp,

  "TABLENAME" = table_name,

  "NUM_RECORDS" = num_records)

  df_insert <- as_data_frame(list_insert)

  sqlSave(

  channel = conn,

  dat = df_insert,

  tablename = "LoadHistoryLog",

  append = TRUE,

  rownames=FALSE)

  odbcClose(conn)

  ```


  ### 步骤 15：基于 `ReadLog_DimDate.R` 脚本创建加载 `DimPromotion` 的脚本


  创建 `ReadLog_DimDate.R` 脚本的副本，并将 `table_name` 变量的值从 `DimDate` 改为 `DimPromotion`。接下来，执行步骤
