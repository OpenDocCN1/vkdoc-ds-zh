  W`。


  ### 闭环系统节流 (`CLST`)


  在为系统配置和计划运行的工作负载恰到好处地选择合适的电源时，必须考虑系统可靠性。如果系统出现某些异常情况（例如运行更高功耗的工作负载），系统不能因系统电源过载而关闭。许多运行英特尔节点管理器和`PMBus`电源的系统都具备一项称为闭环系统节流
  (`CLST`) 的保护功能。当电源检测到过载警告条件时，此功能将限制系统功耗/性能。这种快速的负载降低将保护电源免于关闭。因此，`CLST` 可针对意外的高系统功耗提供保护。这使您在采用较低额定功率电源时也能获得维持良好系统可靠性所需的保护。这种节流非常激进，可能导致显著的性能损失。因此，在电源选型时必须预留足够的余量，以补偿服务器生命周期内可能出现的功耗需求增长（例如，软件更新导致功耗增加、温度升高等）。



  ### 冗余电源中的损耗


  在考虑冗余电源时，请记住系统电源将分担系统负载，这会改变系统中的总体电源损耗。图 4-16 展示了一个 750 W 电源在非冗余单`PSU`配置与冗余 1+1
  `PSU`配置下的电源损耗示例。图中的 x 轴代表系统中所有电源的总负载。您可以再次看到，对于负载较重的系统（在此示例中 > ~500 W），采用两个电源的冗余
  1+1 系统在电源中的损耗更低。而对于负载较轻的系统（< ~500 W），冗余电源系统的电源损耗高于由单个电源供电的系统。


  ![A978-1-4302-6638-9_4_Fig16_HTML.gif](img/A978-1-4302-6638-9_4_Fig16_HTML.gif)


  图 4-16.


  带冗余电源的示例 `PSU` 损耗。


  > **注意：** 对于服务器客户来说，系统的可用性和可靠性通常是高优先级目标。与冗余电源相关的效率损失通常被视为可接受的成本，因此许多系统都采用了冗余电源。


  冗余电源与单电源的相对效率取决于具体电源的特性，如下面两个示例所示：一个展示了更高效的单电源，另一个则列出了更高效的冗余电源。


  -   **示例 1：** 在系统负载为 200 W 时，单个 750 W 电源的损耗为 14.0 W，而 1+1 电源的总损耗为 21.1 W，采用单电源的系统损耗节省了
  7.1 W。

  -   **示例 2：** 在系统负载为 650 W 时，单个 750 W 电源的损耗为 49.3 W，而 1+1 电源的总损耗为 41.1 W，采用 1+1
  配置的系统损耗节省了 8.2 W。


  ### 电源冷冗余


  从前面的电源冗余损耗示例中可以看出，为了在所有情况下都能实现最佳电源效率，最好能采用类似于前面讨论过的主板`VR`相位脱落功能的设计。因此，在轻负载时，系统由一个电源供电（同时仍保持冗余），而在重负载时，系统则由两个电源以负载分担模式运行。这可以通过当今许多服务器系统所支持的一项功能实现，该功能有时被称为冷冗余。在这种情况下，一个电源会在轻负载时自动关闭，进入冷待机状态。冷待机状态仍允许该电源在主用电源发生故障时快速启动。这维持了系统的电源冗余特性。然后，在重负载时，冷待机电源会自动启动，以分担负载并维持电源中尽可能低的损耗。


  ### 热管理


  数据中心中典型的服务器消耗大量电能，并将其转化为热量。将这些热量从数据中心排出需要消耗整个数据中心相当大量的电能。随着时间的推移，冷却效率已显著提高，减少了其对电力的总体贡献。然而，它仍然是能源消耗的一个主要因素。


  服务器冷却系统必须确保每一个组件都符合其规格。大多数组件都有损坏、功能和可靠性温度规格，如图 4-17 所示。一个设计良好的热管理方案必须确保符合这些规格，同时又不导致过度冷却和浪费功耗。在大多数情况下，设计一个能够处理所有极端条件组合下所有可能工作负载的系统是不切实际的，这些条件包括风扇故障、机房环境温度过高和海拔高度。


  ![A978-1-4302-6638-9_4_Fig17_HTML.jpg](img/A978-1-4302-6638-9_4_Fig17_HTML.jpg)


  图 4-17.


  组件温度规格与热管理。


  功能极限通常与系统最大利用率相对应，此时服务器处于其设计所允许的环境等级（温度、海拔、湿度）范围的最坏情况边界。在较低的利用率下，系统会维持在较低的温度，以减少因长时间维持较高温度（处于或接近功能极限）可能导致的组件磨损。


  设计良好的服务器会具备热管理功能，以确保直接通过冷却设计实施，或结合热管理系统来满足这些规格。在风冷系统中，组件温度由表 4-25 中定义的三个因素决定：系统环境温度、空气加热和自发热。这些因素在图
  4-18 中进行了说明。表 4-26 提供了一些用于传热的常用术语。


  表 4-26.


  常见传热术语


  | 类型 | 描述 |

  | --- | --- |

  | 传导 | 相邻粒子在分子层面上的热传递。来自芯片的热量通过周围的封装进行传导，直到传递到传热表面（例如散热器）。 |

  | 对流 | 通过流体（或空气）的无规则分子运动和宏观移动进行的热传递。服务器中的气流是对流的一个示例。 |

  | 辐射 | 通过电磁波进行的热传递；由于强制对流的支配地位，辐射在服务器热传递中通常可忽略不计。 |


  ![A978-1-4302-6638-9_4_Fig18_HTML.jpg](img/A978-1-4302-6638-9_4_Fig18_HTML.jpg)


  图 4-18.


  第二个插槽的本地环境温度、空气加热和自发热。


  表 4-25.


  加热类型


  | 类型 | 描述 |

  | --- | --- |

  | 系统环境温度⁹ | 系统的进风温度。这包括任何机架效应，这些效应可能会增加输送到平台节点的温度。 |

  | 空气加热 | 由于平台中的上游热源导致的空气温度升高。这受组件布局、上游组件功耗、空气移动装置和局部送风的影响。 |

  | 自发热 | 由于所关注设备上散发的热量导致的组件温度高于本地环境温度的升高。这由组件封装、功耗和散热解决方案（例如散热器）决定。 |




  大部分服务器处理器裸片连接到由 FR4（一种玻璃纤维增强环氧层压板）制成的基板上，通过插座实现简单集成，便于处理器的拆卸和更换。为了便于安装散热器，封装顶部附有一个集成式均热片（IHS）。元件热量通过传导传递到均热片，并通过强制对流排出。


  在元件上使用散热器时，需要一种导热界面材料（TIM）来填充元件与散热器之间的空气间隙。`TIM`的热导率远高于空气。


  图 4-19 展示了带有集成式均热片（`IHS`）的典型处理器封装。`IHS`的作用是保护裸片、扩散热量并为散热器提供安装表面。热量主要通过第一层导热界面材料（`TIM
  1`）传导至`IHS`，然后通过第二层导热界面材料（`TIM 2`）传导至散热器。CPU 封装与散热器之间的导热膏就是`TIM 2`的一个例子。大多数服务器使用风扇产生的强制对流来提供更高的局部风速，从而增强散热器的对流传热。


  ![A978-1-4302-6638-9_4_Fig19_HTML.gif](img/A978-1-4302-6638-9_4_Fig19_HTML.gif)


  **图 4-19. CPU 封装散热术语**


  在设计风冷系统时，散热工程师必须考虑诸多影响元件温度的因素。通过对关键元件、其规格和布局要求的仔细理解，散热工程师可以优化布局，以最低成本、最高效率和最佳性能来维持解决方案。所谓的元件“遮蔽效应”会显著增加散热难度并降低散热能力。“遮蔽”意味着在以下元件温度方程式中，空气加热量会相对较高，从而导致成本高昂的散热方案和高风扇功耗。


  具有高功率密度（功率/面积）的元件需要散热增强，例如使用散热器或均热片。这些器件将热量扩散到更大的表面积，从而显著改善对流传热。


  以下方程式描述了功率、空气加热量和环境温度如何影响封装暴露的温度。实际的硅裸片（及晶体管）承受的温度甚至比`T-case`更高。


  `T[C]` = `Ψ[CA]` x `Power` + `System Pre-heating` + `External Ambient`


  其中：


  *   `T[C]`（`T-case`）是元件的表面温度。

  *   `Ψ[CA]`（`psi-CA`）是散热器从表面（`C`）到环境（`A`）测得的散热特性，单位为`°C/W`。`Ψ[CA]`值越低，散热解决方案的散热性能越好，因为在给定功耗下，元件（表面）温度将更接近环境温度。

  *   `Power`是元件所消耗的功率。


  元件和散热器的对流传热性能与气流的倒数成正比，如图 4-20 所示的示例特性曲线。这意味着散热效率（`Ψ[CA]`）随气流增加而显著提高，直至达到某一点（在图中大致为`10`到`15
  CFM`之间）。超过该点后，即使大幅增加气流（以高功耗为代价）也只能带来微小的实际散热提升。风扇功耗与气流（及风扇转速）的立方成正比。在散热器的热传导主导区域运行，会显著增加系统的功耗（和低效性）。


  ![A978-1-4302-6638-9_4_Fig20_HTML.gif](img/A978-1-4302-6638-9_4_Fig20_HTML.gif)


  **图 4-20. 示例散热器性能**


  注意：散热效率与气流是非线性关系。一旦散热器达到其最大能力，大幅提高风扇转速（和风扇功率）可能仅带来散热效果的微小改善。


  ### 系统考量


  平台设计团队必须仔细考量元件、配置、使用模式、环境条件以及系统级、机架级和机房级的气流协议，才能实现最优的散热解决方案。必须根据解决方案的成本、性能和能效目标来评估这些设计考量。


  注意：在较高温度下运行系统会增加 CPU（以及平台中其他器件）的漏电流功耗。然而，降低冷却所带来的功耗节省通常远远超过器件漏电流的增加。


  元件选择与布局细节将决定设计方向，因此是设计阶段最需要仔细考量的要素。一个例子是选择要支持的内存技术。为支持最高容量和频率内存而设计的入门级服务器，可能会因配备昂贵但大多数客户从未需要的风扇而加重系统设计负担。所有组件都必须进行类似的考量，包括它们必须在其下工作的功率范围。


  注意：由高温引起的 CPU 漏电流功耗增加会降低睿频性能。然而，对平台过度冷却所带来的性能回报通常并不大，且成本可能过高。将温度降低`20°C`可能仅带来几个百分点的性能提升（甚至没有）。


  在许多平台设计中，元件布局主要受电气布线考量驱动。必须最小化关键元件之间的走线长度，以确保信号完整性并满足时序要求。散热考量在布局时固然重要，但并非首要驱动因素。散热工程师必须为电路板设计团队提供指导，以便在不必达到散热最优的情况下，设计出有较大成功可能性的解决方案。图
  4-21 展示了散热难度各异的系统示例，其中左侧系统中的内存和处理器存在散热遮蔽，而右侧系统则没有。“散热遮蔽”指的是某个元件在气流方向上位于另一个元件的下游。在这种设计中，被遮蔽的元件会暴露在更高的温度下。


  ![A978-1-4302-6638-9_4_Fig21_HTML.jpg](img/A978-1-4302-6638-9_4_Fig21_HTML.jpg)


  **图 4-21. 示例电路板布局**


  热遮蔽在密集型多路平台设计中很常见。由于第一个处理器会加热流向后一个处理器的空气，因此后一个处理器的环境温度更高。散热解决方案必须补偿环境温度的升高。这通常会导致使用更昂贵的散热器和更高的风扇转速，从而增加采购成本和功耗。更高密度带来的散热需求是以功率/性能效率为代价的。


  注意：位于其他高功耗元件热遮蔽下游的元件，通常工作在更高温度下，因此会消耗更多漏电流功耗。对于 CPU，这种功耗增加可能导致：如果两个插槽分配了相等的功率，则它们达到的睿频级别会不同。


  设计工程师必须透彻理解预期的气流路径，并据此优化气流输送，以最大化散热子系统的能效。空气移动器件的选型和使用必须与服务器设计相匹配。必须在空气移动器和散热器设计之间进行权衡，以找到两者的最佳设计点。散热性能、功耗、噪音特性、风扇可靠性和冗余功能都是影响整体解决方案的重要特性。




  ### 组件热管理功能


  电源管理功能用于执行功耗性能限制，使组件能够保持在温度限制范围内。传感器可创建触发电源管理所需的数据。处理器、内存及部分芯片组组件包含复杂的热管理功能，将在以下章节讨论。


  #### 处理器


  处理器具有三个高级温度节点，如表 4-27 所示。这些温度值因不同产品而异，表中数值仅为典型值示例。


  **表 4-27.** 处理器关键温度等级


  | 等级 | 描述 | 典型温度 |

  | --- | --- | --- |

  | `TCONTROL` | 高于此温度时，风扇应全速运行以确保处理器长期可靠性。 | 约低于`PROCHOT` 5°C–10°C |

  | | 在`TCONTROL`与`PROCHOT`之间时，所有风扇将全速运行。这种情况通常发生在处理器满载运行且环境温度较高时。 | |

  | `PROCHOT`（`DTSMAX`） | 处理器功能得到保证的最高温度。处理器内部的自主热管理算法（参见第 2 章）将确保不超过此温度值。 | 约 80°C–100°C
  |

  | | 在`PROCHOT`与`THERMTRIP`之间时，处理器功能无法保证。可能出现数据损坏（静默或可检测）或系统死机。 | |

  | `THERMTRIP` | 灾难性关机温度。超过此温度，处理器可能发生不可逆的物理损坏。此保护机制由处理器与平台共同实现。 | 约 125°C |


  ### 内存


  与处理器类似，电源管理功能用于管理内存模组（DIMM）可能出现的超温异常。由于内存控制器现已集成在处理器中，由处理器判断内存热状态并激活电源管理功能。处理器可访问
  DIMM 上的热传感器，并根据需要激活内存流量调节。


  DIMM 所用 DRAM 器件的数据保持时间与温度相关。提高内存刷新率可支持在更高温度下运行，这种高温运行模式称为扩展温度范围（`ETR`），并得到大多数主流
  DRAM 制造商的支持。通过支持更高温度运行，可降低平台冷却成本。这确实会因额外刷新操作导致内存功耗小幅增加，并带来少量性能损失，但由此节省的风扇功耗意味着平台级能效提升。当内存温度超过`ETR`阈值时，CPU
  中的内存热节流功能将启动。更多详情请参阅第 3 章。


  ### 平台热管理


  热控制能根据使用模式、配置、散热能力和环境因素优化系统性能。这种优化的基础在于并行运用风扇转速控制和电源管理，以满足客户需求。部分客户可能追求极致性能且不考虑冷却成本，而另一些客户则可能愿意在特定场景下牺牲少量性能以实现更佳能效（及更低冷却成本）。


  组件及其规格是服务器热设计（例如散热器、风扇选型及气流管理）的主要驱动因素。热设计工程师可以打造卓越的热设计，但如果没有热管理系统提供实时优化，该设计可能在声学方面不可接受或效率极低。真正的优越性往往体现在热管理方案及其精准提供所需性能、满足组件规格的同时实现最低功耗的能力上。


  平台热管理在以下四个方面实现优化：


  - 在组件热限值内运行

  - 性能最大化

  - 声学输出最小化

  - 整机功耗最小化


  所有服务器组件均设计为可承受数千次热循环，这是由于工作负载需求导致的自然温度变化所致。服务器每天可能多次从空闲状态切换至高负载状态，并须能在这种变化下运行多年，导致组件经历大幅温度波动。


  热管理（`TM`）系统通过两种主要机制管理组件温度、性能、功耗和声学表现：


  - 风扇转速控制（冷却输送）

  - 组件功率限制功能（例如`P-states`和内存节流）


  在某些服务器中，启动阶段的初始设置允许最终用户配置系统，以优先优化声学表现、能效或性能。



  #### 热控制输入——传感器


  传感器为控制方案提供输入。表 4-28 概述了用于平台热管理的一些传感器类型。


  **表 4-28.** 用于热管理的传感器类型


  | 传感器类型 | 描述 |

  | --- | --- |

  | 直接温度 | 位于处理器、内存、硬盘驱动器 (HDD)、芯片组、GPGPU 等组件上的片上传感器。 |

  | 间接温度 | 位于组件外的分立传感器，用于直接测量空气或主板温度。该信息可与未配备传感器的组件相关联。 |

  | 功率或活动 | 功率可用于估算平台不同组件的温度（结合平台特性分析和其他温度传感器）。算法也可利用功率来优化整体平台功耗。 |

  | 风扇转速 | 用于确保风扇在设计参数范围内运行。 |

  | 风扇在位 | 用于检测风扇是否已安装（例如，冗余配置）。 |


  平台中的不同组件使用不同类型的传感器来监测温度（见表 4-29）。


  **表 4-29.** 平台组件传感器类型


  | 组件 | 传感器描述 |

  | --- | --- |

  | 处理器 | 服务器处理器拥有许多热传感器，但仅向平台热管理暴露最高温度。多个传感器被策略性地布置，以便处理器的自身电源管理特性能够在必要时启动，从而确保硅晶温度不超过处理器鉴定和测试的极限点，同时消除确定实际芯片热点温度时的不准确性。
  |

  | 内存 | 大多数服务器 DIMM 都有一个位于 PCB（印刷电路板）上的分立式热传感器。热传感器温度与 DRAM 温度高度相关，因此单个传感器即可覆盖 DIMM
  上的所有组件。某些 DIMM 带有缓冲器，该缓冲器也可能有一个可单独访问的热传感器。 |

  | 芯片组（及其他硅器件） | 许多硅器件都有一个可供热管理使用的传感器。这些器件上可能提供有限的本机热管理功能，但主要用途是风扇转速控制和灾难性保护。 |

  | 硬盘驱动器 | 硬盘驱动器包含可通过驱动器或 RAID（廉价磁盘冗余阵列）控制器访问的热传感器。 |

  | 电压调节器 | 几乎所有高功率电压调节器都配有本地热传感器，以保护 VR 区域内的组件。历史上这主要用于高温保护。 |

  | PCIe 卡 | 在某些情况下，PCIe 卡支持传感器功能，服务器可将其用于热管理。但这并不常见，因此必须根据可能安装的任何卡来设计冷却能力。有时会使用间接传感器来推断
  PCIe 温度。 |

  | 电源 | 大多数电源都有其自身的冷却系统（内部风扇）并自主管理冷却，无需系统干预。 |


  图 4-22 举例说明了热传感器在平台上的分布情况。


  ![A978-1-4302-6638-9_4_Fig22_HTML.jpg](img/A978-1-4302-6638-9_4_Fig22_HTML.jpg)


  **图 4-22.** 示例平台热传感器布局


  ## 电压调节器


  电压调节器 (VR) 可由主板上的多个分立元件构成，热传感器通常放置在预期温度最高的元件附近。过去，该传感器主要提供功能保护，很少用于风扇转速控制。更精细的热管理实现方案能够利用
  VR 传感器参与风扇转速控制算法。VR 可以支持：


  -   `OTP`（过温保护），导致立即关闭

  -   `Prochot`，连接到平台的 `Prochot` 信号，当 VR 温度过高时，使 CPU 进行强力的频率调节

  -   `VRHOT`，通过 `SVID` 发出的警报，通知 CPU 进行频率调节


  ## 电源


  电源拥有自己的热传感器和风扇，用于自主热管理。它们具有温度保护机制，当检测到灾难性情况时可以关闭系统。在某些条件下，电源的风扇可以补充服务器的冷却能力。因此，平台热管理系统有时可以覆盖电源风扇控制，以便在需要时为冷却系统组件驱动更高的风扇转速。


  ### 风扇转速控制与设计


  优化系统中风扇的转速可以显著提高能效。简单地将风扇以最高转速运行是一种易于确保系统在其规格内运行并提供最大性能的方法，但这会带来巨大的能源成本。


  系统设计人员在其 BMC 中运行专有的风扇转速控制算法；这些算法试图在保持组件规格范围内的情况下，将风扇转速降至最低。可以同时使用多种算法，并通过比较这些算法的结果来确定最终的风扇转速。


  算法中会使用多个（例如数十个）传感器，并根据那些裕量最小的组件来设定所需的风扇转速。算法必须确保不会出现不可接受的风扇振荡，即使在低风扇转速下也是如此。这种振荡对客户来说，可能和持续的巨大噪音一样令人讨厌。


  > **注意：** 系统有可能在微秒内从低功耗和相应的低风扇转速状态转换到高功耗工作负载状态。虽然 CPU 芯片不会因功耗增加而瞬间升温，但其升温速度可能快于风扇转速控制子系统提升风扇转速的速度，从而导致短时间的
  CPU 热频率调节。那些为能效进行了高度优化的风扇转速控制算法，更容易受到此类行为的影响。


  风扇或冷却区域常用于精确调整特定风扇，以满足与该风扇耦合最紧密的组件需求。冷却区域可以基于邻近性，也可以是物理上分隔的。在设计通过冷却区域划分的冷却分区时，会权衡优化程度与成本。采用风扇区域实现方案可以最小化总风扇功耗和噪音。处于低压力区域的风扇可以比高压力区域所需的风扇以更低的转速运行。压力区域意味着该区域内至少有一个组件正接近其温度极限。图
  4-23 展示了映射到两种设计用于 1U 机箱的不同主板的风扇区域示例。


  ![A978-1-4302-6638-9_4_Fig23_HTML.jpg](img/A978-1-4302-6638-9_4_Fig23_HTML.jpg)


  **图 4-23.** 风扇区域映射


  每个传感器根据其与风扇区域的热连接关系映射到相应区域。单个传感器可能影响单个或多个区域，具体取决于传感器位置和风道设计。通过将特定组件映射到特定风扇区域，可以在风扇控制中获得更精细的粒度，从而降低总风扇功耗。


  通常使用比例-积分-微分 (PID) 控制器的变体来进行风扇转速控制。对于每个热传感器或热传感器组，都会运行一个独立的 PID 算法。在每个时间步长，PID 控制器根据每个传感器的温度值计算出新的风扇转速设定值。管理控制器根据所有同时运行的
  PID 算法计算出的最大风扇转速设定值，来确定实际的风扇转速设定值。


  风扇转速设定值通常设有一个下限，以防止风扇转速低于冷却那些无传感器（其实时温度未知）组件所需的最低水平。




