- '# 总结


  有多种功能强大的工具可用于监控系统，以了解其功耗和性能特征。不同类型的监控能力，包括硬件监控、管理控制器监控和软件监控，都具有独特的优势和用途，有助于理解系统行为。


  可以使用简单的指标将原始监控数据转换为更适合分析的格式，并且有许多软件工具可以帮助进行可视化。本章末尾概述的常见监控工具、使用实例以及输出示例，提供了一份快速上手的监控指南。第
  8 章 将继续讨论可用于指导优化决策的监控技术，并附上具体的调优示例。


