- '# 摘要


  每个 CPU 都需要大量的支持硬件才能完成其任务。数据中心通常由大量机架组成。每个机架包含多个独立的平台（或机箱），每个平台提供一个（或少量）计算节点。除了 CPU
  之外，一个平台还包括使其中的少量 CPU 能够运行所需的内存、驱动器、网络、供电、散热等硬件。类似的问题和任务也必须在机架甚至跨数据中心的更大规模上进行管理。例如，每个平台可能都有专用的散热硬件以及热监控和管理功能。然而，还需要额外的散热设备来将热量从机架中排出，并最终从数据中心排出。本主题将在第
  9 章中讨论。


  平台设计种类繁多，针对不同用途有不同的优化点。存储平台可能包含大量驱动器，全部连接到一个双路（DP）节点上。计算节点可能只有一个高速网络连接，没有驱动器，并且内存容量是根据在该节点上运行的工作负载类型来选择的。大型
  EX 平台通常具有较高的 CPU TDP 功耗。然而，它们的支持硬件成本（包括功耗和采购成本）也往往较高，这使得额外功耗的成本得以分摊，从而变得非常经济。同样，如果不需要高性能，低功耗方案也能非常有效。


  CPU 的功耗/性能效率在很大程度上取决于其周围的平台以及平台上所讨论的工作负载的需求。由于许多平台组件都会贡献功耗，因此仅根据 CPU 的 TDP 瓦特来衡量每瓦性能可能是一个极具误导性的指标。如果所需的任务受限于驱动器，那么增加计算性能（并增加功耗）将是低效的。类似地，如果一个平台在
  CPU 之外有显著的功耗，并且增加 CPU 功耗能带来整个平台性能的提升，那么即使 CPU 每瓦性能下降，从平台角度来看，增加 CPU 功耗可能更具能效。构建一个高能效平台需要平衡计算需求与支持平台设备的能力。


  ## 脚注


  1. 一致性是一种机制，允许在不同 CPU 上运行的不同软件线程共享一大块物理内存，而无需进行软件管理。

  2. 该设备包含一个 10GBASE-T 连接的介质，增加了 TDP 功耗。列出的其他控制器必须与单独的连接介质配对。

  3. EEE 在 IEEE Std 802.3az-2010 中有详细描述。

  4. [ATA8-ACS 标准。 [`www.sata-io.org/sites/default/files/images/SATAPowerManagement_articleFINAL_4-3-12_1.pdf`](http://www.sata-io.org/sites/default/files/images/SATAPowerManagement_articleFINAL_4-3-12_1.pdf)
  。](#A978-1-4302-6638-9_4_Chapter.html#Fn4_source)

