- '# 总结


  在本章中，我们证明了最大化数据中心效率最终归结为最大化服务器和数据中心基础设施的能源效率。配电在管理整体数据中心效率中扮演着重要角色。尽管交流电在目前的数据中心供电设计和配电中占主导地位，但直流电以更少的电源转换次数提供了同等的效率。随着数据中心转向像太阳能和燃料电池这类天生提供直流电的替代电源，我们可以预期直流电将在数据中心设计中占据更重要的地位。


  最后，我们展示了总拥有成本在优化整体数据中心设计时提供了一套复杂的权衡方案，其中服务器性能和效率提升是整体优化中最有力的变量之一。这种优化归结为最大化“每美元每瓦性能”，以实现最大的成本效益。


