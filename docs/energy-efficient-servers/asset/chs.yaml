  在典型使用中，局域网组件并非在其热设计功耗下运行。一些局域网设备包含热敏二极管以及管理接口，使其他平台组件能够查询组件的热状态并调整风扇转速。在实践中，许多这类平台方法需要对热传感器进行额外校准，如果未进行校准，可能会限制风扇转速算法的有效性。


  ## 连接介质


  大多数局域网适配器可以与多种不同类型的互连类型配对，这些互连提供了局域网适配器和网络交换机之间的实际连接。这些被称为连接介质。


  服务端局域网实现比客户端系统拥有更多种类的介质类型。虽然大多数人将以太网等同于无处不在的 RJ-45 连接器和 `10BASE-T` (10 Mbps)、`100BASE-TX`
  (快速以太网，或 100 Mbps) 及 `1000BASE-T` (1 Gbps 千兆以太网)，但服务端平台使用了表 4-12 中总结的几种介质类型。


  **表 4-12.** 连接介质的类型


  | 类型 | 最大距离 | 功耗 | 延迟 |

  | --- | --- | --- | --- |

  | 多模短距离 (SR) 光纤 | ∼400 m | ∼1 W | 略有增加 |

  | 单模长距离 (LR) 光纤 | ∼10 km | ∼1 W | 略有增加 |

  | KX/KX4/KR 背板 (铜缆) | 服务器背板 | 数百 mW | 最低 |

  | 直接连接 (DA) | 3–10 m | 数百 mW | 最低 |

  | BASE-T | 100+ m | 2–3 W | 增加约 1 微秒 |


  > **注意：** 成本和距离通常是选择连接介质时的决定性因素。延迟对一部分客户很重要。


  这些介质解决方案中的每一个都在线缆成本、功耗、距离甚至传播速度（光纤比铜基连接略慢）之间进行权衡。由于这种多样性，许多服务端局域网连接都配有 SFP 或 SFP+
  笼，可以接受各种介质类型的可插拔模块。


  ## 局域网电源管理特性


  许多常见特性用于降低局域网设备和 CPU 的功耗。除此之外，高端服务端局域网适配器还实现了多个队列和在多个 CPU 内核之间平衡网络流量的方法。因此，CPU 内核可以以较低的频率运行并节省功耗。




  ### 介质速率


  某些介质类型（例如 BASE-T 和背板）支持以低于最大可能速率的介质速率建立链路——例如，一个 1 Gbps 的适配器以 100 Mbps 的速率链接。降低已建立的链路速率通常会降低组件功耗，有时可降低多达
  50%。随着链路速度下降，内部同步的介质时钟频率也会降低，从而导致动态功耗降低。另一个影响与有效数据包速率有关，因为局域网组件的功耗随数据包速率的变化比随数据包大小的变化更大。对于每个数据包，局域网控制器都会对数据包头执行各种查找操作。降低介质速率同样会降低数据包速率，从而再次降低动态功耗。


  在实践中，更改介质速率不适用于大多数服务器使用模型。转换延迟较慢，而且降低的速率会导致峰值吞吐量显著下降，并可能增加延迟。尽管从局域网控制器的角度来看，这可以节省可观的功耗，但通常作为整个平台功耗的百分比来看，其节省效果并不那么显著。


  ### 高能效以太网


  BASE-T 和背板介质也支持高能效以太网³ (EEE)。这常被简称为“三 E”。EEE 设备在空闲期间进入低功耗模式，定期发送空闲序列以保持链路激活状态，并在需要重新激活链路时向对端发送唤醒符号。根据介质的不同，链路从空闲到激活的转换时间通常小于
  16 微秒。对于 1000BASE-T，BASE-T 设备可将其 PHY 空闲功耗降低多达 400 mW；对于 10GBASE-T，则可降低 2 W。


  EEE 由网卡驱动程序管理，并且可以在运行时进行控制。它通常是默认启用的。在许多使用模型中，EEE 的延迟成本并不明显，但其功耗节省也并非特别显著。对延迟敏感的用户可能希望尝试禁用此功能。


  ### 网络唤醒


  网络唤醒 (WoL) 是服务器局域网适配器上常见的功能。它与其说是一个省电功能，不如说是一种将系统从 S 状态唤醒的机制。


  如果平台支持从软关机模式挂起或唤醒，则 WoL 允许远程管理员使用一种简单的方法来远程激活服务器平台。通常，局域网接口在进入此状态时会自动降低链路速度以最小化功耗，并等待接收唤醒模式。常用的一种模式是“魔术数据包”模式。收到后，局域网控制器会向平台发送一个信号，使系统退出低功耗状态。


  ### 活动状态电源管理 (ASPM)


  独立的局域网控制器通过 PCIe 连接。因此，可以使用 PCIe 活动状态电源管理来管理局域网控制器上的功耗。PCIe 电源管理在第 3 章中讨论。


  网卡 ASPM L1 经常在服务器部署中被禁用。这通常可以在系统 BIOS 中执行。其带来的延迟影响通常不值得换来那一点点功耗节省。ASPM L1 的一个常见问题是它会阻塞驱动程序（在
  CPU 上运行）和网卡设备之间的通信。当需要进行通信时，内核就会被暂停。这最终会浪费 CPU 功耗，从而侵蚀了本来就不多的从 L1 状态节省的功耗。


  ### 中断调节


  中断调节是局域网控制器的另一个常见功能。它限制了传递给主机 CPU 的中断信号的速率。这通常会在对带宽几乎没有可观察影响的情况下降低 CPU 利用率。中断调节对网卡功耗影响不大，但降低的
  CPU 利用率可以显著改善 CPU 功耗。它还可以为其他进程释放额外的 CPU 周期，从而提高节点的吞吐量。通过限制中断速率，CPU 被通知的频率降低，从而导致延迟和响应时间增加。延迟影响的程度可以在网卡驱动程序中调整，通常配置在
  100–200 微秒的量级。此功能通常是默认启用的，并且可以在网卡驱动程序配置中禁用（或配置）。


  中断调节可能对系统中的功耗和延迟产生显著影响，但经常被忽视。对于任何关心延迟和响应时间的人来说，调整此功能应作为优先事项。


  DMA 合并是一个相关功能，它试图在网卡内部将数据传输排队，然后将其突发传输到 CPU。此功能的目的是允许 CPU 在活动突发之间进入低功耗空闲状态。在实践中，此功能在服务器环境中表现出效果甚微，同时还会显著增加网络延迟。它默认不启用。


  ## USB


  USB 连接由服务器 PCH 提供。许多大规模数据中心在正常运行时不连接设备到 USB，但这些平台上包含 USB 端口是常见情况。“应急手推车”支持是一种常见的使用模型，其中
  USB 被定期用于连接键盘/鼠标进行本地调试，或连接 USB 驱动器以用于类似目的。USB 也可用于一些低端存储系统以连接 USB 存储。由于这些有限的使用模型，USB
  的电源管理在节省功耗方面可以非常有效，且几乎没有或完全没有功耗成本。


  ### 链路电源状态


  最初的 USB 电源管理能力非常粗粒度。挂起/恢复方案提供了两个级别——实际上是“开”和“关”。这些状态转换需要毫秒级的时间，使得它们对于许多高能效使用模型来说是不充分的。USB
  设备在消费类使用模型中很常见，在这些模型中，实现极低的空闲功耗对于获得长电池续航时间至关重要。因此，USB 一直是这些环境中电源优化的重点。这些能力中的大部分在服务器使用模型中是不必要的。


  USB 2.0 最初只支持这两个级别，但后来增加了对 L 状态的支持，作为对挂起状态的补充。在 USB 2.0 上，链路的状态与设备的电源状态相关联。这些状态总结在表
  4-13 中。对于没有延迟敏感性的状态（例如 S3/S4），仍然可以使用挂起。


  表 4-13.

  USB 2.0 电源状态


  | 状态 | 名称 | 链路节能 | 设备节能 | 退出延迟 |

  | --- | --- | --- | --- | --- |

  | L0 | 开启 | -- | -- | -- |

  | L1 | 睡眠 | 约 100 mW | 设备特定 | 微秒 |

  | L2 | 挂起 | 约 125 mW | 设备几乎不消耗功率 | 毫秒 |

  | L3 | 关闭/断开 | 约 140 mW | 设备断电 | 毫秒 |


  注意：功耗节省取决于设计。这些数字仅供参考。


  在 USB 3.0 上，设备电源状态与链路电源状态解耦。定义了 U 状态，仅用于控制链路的电源状态。表 4-14 概述了四个 USB 3.0 链路电源状态。


  表 4-14.

  USB 3.0 链路电源状态


  | 状态 | 名称 | 链路节能 | 退出延迟 |

  | --- | --- | --- | --- |

  | U0 | 链路激活 | -- | -- |

  | U1 | 链路关闭 | 每通道约 100 mW | 微秒 |

  | U2 | 链路关闭 | 每通道约 125 mW | 毫秒 |

  | U3 | 链路关闭 | 每通道约 140 mW | 毫秒 |


  注意：功耗节省取决于设计。这些数字仅供参考。




  #### 链路频率/电压


  USB 已经历了三代发展。每一代都有其特定的运行频率（见表 4-15）。不支持多个电压/频率点。较新一代的设备（按规定）都向后兼容前一代的频率。


  **表 4-15.** USB 代际


  | 代际 | 频率 | 双工模式 | 理论带宽 |

  | --- | --- | --- | --- |

  | USB 1.x | 12 MHz | 半双工 | 1.5 MB/s |

  | USB 2.0 | 480 MHz | 半双工 | 35 MB/s |

  | USB 3.0 | 5 GHz | 全双工 | 500 MB/s (每方向) |


  USB 3.0 采用了全双工设计，有效为双向通信提供了独立的通道，从而在数据同时双向传输时提高了峰值吞吐量。这要求增加两对差分信号线，类似于 PCIe 单通道或
  SATA 连接。


  ### 存储


  许多现代数据中心以多种不同方式部署存储。一些计算节点没有本地存储，完全依赖网络提供对远程存储的访问。另一种常见情况是计算节点配备单个驱动器（通常是 SSD），提供高性能本地存储。其他节点可专门用作存储节点，并提供对大量驱动器的访问。这些节点通过高性能互连与计算服务器相连，以提供大型共享存储池。


  传统上，驱动器通过基于 PCIe 的控制器连接。这些控制器存在两种标准接口：SATA 和 SAS。串行高级技术附件（SATA）成本较低，但其峰值性能也较低。SATA
  可用于消费级和服务器级使用场景。串行连接 SCSI（SAS）通常价格更高、性能更强，主要面向企业级使用场景。SATA 驱动器可以连接到 SAS 基础设施，但 SAS
  驱动器不能连接到 SATA 控制器。SATA 和 SAS 都支持 SSD（固态硬盘）和 HDD（机械硬盘）。除了提供更高的峰值性能外，SAS 还支持将大量驱动器连接到一个控制器上，使其在高容量部署中非常流行。


  近年来，SSD 开始直接连接到 PCIe 上。非易失性内存快速通道（NVMe）是实现这种直连的规范。NVMe 提供了比 SAS 和 SATA 更低的延迟和更高的性能。这对于需要本地存储的高性能计算节点尤其适用。NVMe
  SSD 的功耗特性与 SATA 和 SAS SSD 相似。其更高的性能潜力也意味着更高的功耗。


  在传统计算服务器中，存储功耗通常不是节点总功耗的主要部分。然而，存储节点上驱动器的功耗可能远超节点上的其他组件。在低功耗、低性能的服务器中，存储功耗也更为显著，因为驱动器的功耗无法由高功耗的
  CPU 节点来摊薄。


  ### 存储服务器与电源管理


  在典型的存储服务器中，CPU 集群管理着数十到数千个驱动器。存储服务器可以混合使用 SSD 和 HDD，具体混合比例由性能需求决定。SSD 采购成本较高，但能提供更优的性能。存储服务器中相当一部分功耗由驱动器消耗。为高密度存储集群散热也会消耗可观的电力。


  在不影响性能的前提下管理存储设备消耗的功率，变得日益关键。根据应用的性能要求，可以采用不同的电源管理方案。在冷存储系统中，数据量庞大但访问频率极低，且对性能和延迟要求不高，可以采用激进的电源管理策略来降低成本。相反，在性能和延迟要求苛刻的存储部署中，只能进行有限的节能。在这种环境中激进的节能策略不仅会损害性能，还可能导致计算节点因等待数据时间变长而降低整个数据中心的能效（在此过程中浪费了电能）。


  节能机会存在于驱动器内部以及驱动器与其控制器之间的通信层。存储电源管理方案已针对服务器使用场景和消费级使用场景开发出来。在消费级使用场景中，极低的待机功耗对于电池续航至关重要，并且已开发出相应技术来解决这些问题。这些相同的技术可能也存在于服务器领域，但效果可能不佳。如果节省几百毫瓦的功耗可能导致响应时间增加几毫秒，这通常是一个得不偿失的权衡。


  ### 机械硬盘与固态硬盘


  与传统 HDD 相比，SSD 通常提供更高的带宽和更低的延迟；然而，这通常以更高的功耗和每容量成本为代价。实际功耗取决于具体的驱动器型号，范围可能从几瓦到超过
  10 瓦。


  传统上，3.5 英寸 HDD 在数据中心和其他服务器应用中被广泛使用。由于其更大的盘片，它们能提供最佳的每 GB 成本。同等容量下，2.5 英寸 HDD 的功耗通常低于
  3.5 英寸驱动器，但这一优势往往被其在同代技术中总体最大容量较低的事实所掩盖。


  HDD 处理的数据流量对其功耗影响极小。相反，驱动器的工作状态（是否在旋转？磁头是否加载？）是 HDD 功耗的主要决定因素。另一方面，SSD 的功耗动态范围与带宽密切相关。对存储单元进行读取和写入操作本身就会消耗驱动器功耗的很大一部分。SSD
  的功耗似乎也随容量增加而上升。这并非因为存储单元本身消耗大量电力，而是因为这些高容量驱动器的峰值性能通常更高，从而有更大的功耗潜力。


  HDD 在启动过程中的功耗通常是其所有不同工作状态中最高的，可能远超正常运行时的功耗。在拥有大量 HDD 的存储服务器中，可以采用交错启动（staggered
  spin-up）来防止启动时过高的功耗，避免因此导致的电力短缺。交错启动每次只启动一个驱动器，要么等待该驱动器发出就绪信号，要么等待一段预设时间后再启动下一个驱动器。许多数据中心设计人员关心每个节点、机架等的规划功率。这是系统必须设计能提供的功率量，通常小于系统中每个单独子组件的极限功耗之和。当采用交错启动时，平台供电设计无需为多个驱动器同时达到这种高峰功耗做准备，这意味着既可以降低成本，又有可能提高计算密度。然而，这种设计的代价是，当驱动器为了节能而降速停转时，可能会引入额外的延迟。



  ### SATA 和 SAS 硬盘电源管理


  硬盘的电源管理可分为两大类：在硬盘本体上节能，以及在互连通道（PHY）上节能。SAS 和 SATA 在电源管理方法和术语上存在许多相似之处。硬盘本身的电源管理远比
  PHY 电源管理重要得多。


  SATA 设备（硬盘）支持四种电源状态，如表 4-16 所示。这些状态可以显著节约能耗。休眠（Sleep）状态在服务器上很少使用。在可能有活动的计算服务器上，您可能不希望让
  HDD 进入待机（Standby）状态，但在大型存储阵列上可以谨慎使用。


  **表 4-16.** SATA 设备电源节能状态⁴


  | 操作 | 描述 | 接收命令 | HDD | 唤醒延迟 |

  | --- | --- | --- | --- | --- |

  | 工作（活动） | 正常运行，全功率供电。 | 是 | 盘片旋转 | 不适用 |

  | 空闲 | 主动节能。响应命令可能变慢。 | 是 | 盘片旋转 | 毫秒级 |

  | 待机 | 设备仍响应常规命令，但响应时间可能较长。 | 是 | 盘片停转 | <= 30 秒 |

  | 休眠 | 设备进入休眠状态，需明确唤醒。 | 否 | 盘片停转 | <= 30 秒 |


  SAS 电源管理在概念上与 SATA 非常相似。其 PHY 支持部分休眠（Partial）和深度休眠（Slumber）两种状态，且特性相同。在 T10 SAS
  标准中，还定义了额外的状态。虽然 ATA8-ACS SATA 标准仅要求了表 4-16 中列举的四种状态，但 SATA 硬盘也可能支持与 SAS 类似的状态。表
  4-17 总结了这些状态及其大致节能估算。请注意，显著的 HDD 节能只有在接受较大的退出延迟代价时才能实现。因此，这些节能模式通常仅在经过较长的空闲时段后才会启用（如果启用的话）。


  **表 4-17.** SAS/SATA HDD 电源节能模式


  | 状态 | 盘片旋转 | 磁头 | 节能比例 | 退出延迟 |

  | --- | --- | --- | --- | --- |

  | 活动 | 全速 | 加载 | 基准 | 不适用 |

  | 空闲 A | 全速 | 加载 | ∼10％ | ∼100 毫秒 |

  | 空闲 B | 全速 | 卸载 | ∼20％ | ∼200–400 毫秒 |

  | 空闲 C | 降速 | 卸载 | ∼50％ | 秒级 |

  | 待机 Y（SAS） | 盘片停转 | 卸载 | ∼90％ | 秒级 |

  | 待机 Z（SAS） 待机（SATA） | 盘片停转 | 卸载 | ∼90％ | 秒级 |


  对于 PHY 而言，SAS 和 SATA 都支持两种低功耗模式：部分休眠（Partial）和深度休眠（Slumber）（见表 4-18）。在预设的空闲时间后，主机或设备可以向
  PHY 发送信号，使其进入低功耗状态。PHY 电源管理具有中等长度的唤醒延迟，限制了精细节能的能力。深度休眠（Slumber）的唤醒延迟相当长，因此无法用于某些服务器使用模型。部分休眠（Partial）也能达到约
  ∼100 mW 的空闲功耗，因此以延迟为代价进一步节能，在平台层面上（除了深度空闲平台状态之外）可能适得其反。设备休眠（DevSleep）主要用于消费类设备电源状态。


  **表 4-18.** PHY 电源状态⁵


  | 操作 | 唤醒延迟 |

  | --- | --- |

  | 活动（SAS）/ PHY 就绪（SATA） | 不适用 |

  | 部分休眠 | <10 微秒 |

  | 深度休眠 | <10 毫秒 |

  | 设备休眠（SATA） | ∼1 秒 |


  SSD 在消费级和企业级环境中都很常见。然而，这些硬盘具有不同的特性和优化重点。低功耗运行和空闲功耗优化在消费级领域至关重要，并且硬盘已针对这些场景进行了优化。另一方面，在许多企业级硬盘中，这一点并非重点。与
  HDD 不同，企业级 SSD 在活动空闲状态下（并保持快速响应时间）运行时，其功耗可能仅为峰值读取带宽功耗的 25%（或更低）。传统上，企业级 SSD 的采购成本远高于电力成本，用户不太可能将
  SSD 部署到可能经历长时间空闲的环境中。随着时间的推移，SSD 每 GB 成本正在下降。这将使 SSD 能够与传统 HDD 的典型使用模式竞争，并且预计将使电源管理更加受到关注。


  #### 频率/电压


  SATA 和 SAS 都通过提高频率来提供更高带宽，从而不断演进。表 4-19 说明了这几代技术的演进过程。较新一代的设备（按规定）支持与上一代频率向后兼容，并且工作电压保持恒定。


  **表 4-19.** SATA 和 SAS 各代技术


  | SATA 代际 | SAS 代际 | 链路频率 | 理论峰值带宽 |

  | --- | --- | --- | --- |

  | SATA 1.x | SAS 1.0 | 1.5 GHz | 150 MB/s |

  | SATA 2.x | SAS 1.0 | 3 GHz | 300 MB/s |

  | SATA 3.x | SAS 2.0 | 6 GHz | 600 MB/s |

  | - | SAS 3.0 | 12 GHz | 1200 MB/s |


  SATA 和 SAS 传统上采用串行数据传输（一次 1 比特数据）并使用 8b/10b⁶ 编码，这种编码消耗了 20% 的数据带宽以支持高速传输。


  ```

  80% * (1.5 GHz / 8 bits per byte) = 150 MB/s

  ```


  SATA 3.2 包含对 PCIe 连接设备的支持，可以利用 PCIe 的并行特性实现更高的吞吐量。它包含了用于传统 SATA 连接的 SATA 3 功能（带宽相同）。


  ### NVMe 硬盘电源管理


  NVMe 提供了电源管理功能，允许以降低吞吐量和增加延迟为代价来降低功耗。如表 4-20 所示，共定义了七种不同的状态（编号 0 至 6）。


  **表 4-20.** NVMe 电源状态


  | 状态 | 可操作 | 退出延迟 | 性能 |

  | --- | --- | --- | --- |

  | 0 | 是 | -- | 峰值 |

  | 1 至 4 | 是 | 微秒级 | 吞吐量和延迟随退出延迟增加而下降 |

  | 5 | 否 | ∼50 毫秒 |   |

  | 6 | 否 | ∼500 毫秒 |   |


  NVMe 允许主机进行静态或动态电源管理，以补充 NVMe 硬盘执行的自主电源管理。当静态管理电源时，主机预先确定分配给 NVMe 硬盘的功率，并设置每个硬盘的
  NVMe 电源状态。当主机动态管理电源时，每个设备的 NVMe 电源状态会定期更新，以适应主机不断变化的性能和功耗需求。


  > **注意：** NVMe 常用于需要峰值性能的计算服务器。因此，激进的电源管理（尤其是状态 5 和 6）可能并不合适。


  NVMe 是一项相对较新的技术。对于许多用户或设计而言，企业级 NVMe 硬盘的电源管理并非当务之急。许多初期的企业级产品并未实现这些电源管理状态。




  '
- '# 电源供电


  服务器平台包含大量组件，每个组件都需要电力来执行其必要功能。系统中的不同组件对接收的电源类型有着不同要求。有些需要高电压，有些则需要低电压。有些对在特定电压下工作非常敏感，而另一些则能容忍一定范围的电压。


  由于输入服务器系统的电源类型与家用墙壁插座提供的电源类似，因此系统包含许多电源转换器，用于将这种交流（AC）电压转换为所有组件所需的多种特定直流（DC）电压。将交流电压转换为所需的直流电压会消耗功率，这被称为转换器损耗。衡量电源转换器损耗的典型指标是效率。效率表示为输出功率与输入功率之比。由于输入功率等于输出功率加上转换器的功率损耗，因此效率可用以下公式表示：


  ![A978-1-4302-6638-9_4_Figa_HTML.jpg](img/A978-1-4302-6638-9_4_Figa_HTML.jpg)


  这些电源转换器将较高电压转换为负载所需的较低电压的效率，对系统的整体效率至关重要。即使在采用最佳转换器效率的系统中，这些损耗也可能占到系统功耗的 10%–20%。在系统低利用率情况下，它们所占的功耗比例甚至更高。本节概述了这些电源转换器的损耗、系统中使用的不同类型转换器的基础知识、导致损耗的各种电源转换环节，以及有助于减少这些电源转换器损耗的特殊功能。


