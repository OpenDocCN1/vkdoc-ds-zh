  #### 内存功耗与性能


  Xeon E5/E7 CPU 上的每个内存控制器通道都包含多个非核性能监控计数器和一个用于计数`DCLK`周期的固定计数器。在最近的处理器代中，内存控制器时钟在深度封装状态下被门控，性能监视器将在此状态下停止计数。表
  7-7 列出了系统上可用的关键内存功耗和性能统计信息。


  **表 7-7. 内存功耗与性能统计信息**


  | 统计项 | 类型 | 描述 |

  | --- | --- | --- |

  | 带宽 | 非核性能监视器 | CAS 命令（详见第 2 章）指的是发往 DRAM 的读取和写入命令。通过计数 CAS 命令，可以测量内存带宽。`![A978-1-4302-6638-9_7_Figw_HTML.jpg](img/A978-1-4302-6638-9_7_Figw_HTML.jpg)`
  |

  | 时钟门控时间 | 非核性能监视器 | 每当时钟未被门控时，内存控制器中的固定性能监控周期计数器就会递增。通过结合使用`RDTSC`和固定周期计数器测量样本之间的时间，您可以计算出时钟门控的时间。`![A978-1-4302-6638-9_7_Figx_HTML.jpg](img/A978-1-4302-6638-9_7_Figx_HTML.jpg)`
  |

  | CKE | 非核性能监视器 | CKE 按秩进行控制。内存控制器有一个事件，用于计数 CKE 信号为高电平（且功耗为高）时花费的时间。可以从总时钟数中减去该时间，以确定
  CKE 为低电平的时间。当内存控制器时钟被门控时，CKE 始终为低电平。`![A978-1-4302-6638-9_7_Figy_HTML.jpg](img/A978-1-4302-6638-9_7_Figy_HTML.jpg)`
  |

  | 自刷新 | 非核性能监视器 | 内存在通道级别应用自刷新。当一个通道完全进行时钟门控时，它也处于自刷新状态。因此，当计算实际处于自刷新的时间时，应将处于时钟门控状态的百分比时间始终添加到性能监视器计算出的总数中。自刷新主要用于空闲状态。即使在低利用率下，观察到处于自刷新状态和时钟门控状态的时间都非常少，这也是很常见的。`![A978-1-4302-6638-9_7_Figz_HTML.jpg](img/A978-1-4302-6638-9_7_Figz_HTML.jpg)`
  |


  内存带宽直接影响内存功耗。在构建系统时，所需的内存带宽也会显著影响采购决策。


