  ## 管理控制器监控


  系统中的管理控制器，包括基板管理控制器（BMC）和 PCH 中的管理引擎（ME），提供了更广泛的平台级监控功能。BMC 连接到系统中的各种总线、传感器和组件，使其能够充当覆盖大量不同系统组件的集中式监控资源。BMC
  还可以将监控功能与阈值配对以生成事件，例如指示某个组件温度已超过安全级别。


  管理控制器监控补充了 CPU 和操作系统提供的监控功能。BMC 和 ME 提供了对许多无法在其他地方监控的独特监控事件的访问，例如风扇转速、电源、电压以及常规平台健康状况。它还允许在系统启动、断电或无响应时进行监控。如第
  5 章所述，管理控制器的监控功能通过 IPMI 进行访问。


  ### 组件功耗传感器


  了解单个组件的功耗以及各个组件如何累加形成平台总功耗，可以获得极大的洞察力。在理想的监控解决方案中，平台功耗（扣除 PSU 效率损失后）应等于所有单独测量组件的功耗总和。然而，大多数服务器只能测量
  CPU 和内存功耗，这留下了不完整的图景。


  **注意**


  一个常见的问题是“系统中的功耗是如何分解的？”一种工程方法是识别出消耗功率最多的几个组件，并将优化工作重点放在这些组件上。系统中功耗的分解在不同服务器之间差异很大，并且系统中的许多单个组件仅占总功耗的一小部分。


  可以向基板添加额外的传感器来测量这些缺失的组件，报告功率或电流和电压。在电路板设计期间，添加这些计算组件功率所必需的增强型传感器的成本相对较小，例如，添加通过
  SMBus 接口暴露读数的 VR，或添加可通过 I2C 访问的电流传感器。这些额外的传感器允许节点管理器（NM）固件计算平台中所有组件的能耗，以确定未说明的功耗来自何处。例如，NM
  可以暴露 PCH、LAN、风扇和 BMC 的单独能耗测量值。当前一代的节点管理器支持多达 32 个额外的监控设备，因此可以以精细的粒度监控组件能耗。


  与使用 CPU 能耗事件类似，NM 能耗事件与时间戳相关联，因此用户可以定期读取传感器，以在所需的时间窗口内计算功耗。


  ### 合成传感器


  为了公开更多关于平台的信息，节点管理器为那些不易测量的平台特性添加了新的合成传感器。节点管理器 3.0 增加了报告体积气流和出风口温度的能力。这些值是基于服务器机箱特性化过程以及来自风扇转速传感器、平台消耗的能耗和进风口空气温度的当前读数计算得出的。外部管理软件可以根据数据中心内服务器的物理位置信息和报告的出风口温度创建热图。此信息可用于提高数据中心效率，例如，动态管理冷却设定点、识别热点或优化工作负载放置决策。




  ### 传感器与事件


  BMC 与 ME 之间提供了大量用于监控的传感器、事件和指标。表 7-10 举例说明了用于表征服务器能效的主要事件。对各种传感器的支持及其具体名称可能因平台而异，因此表中使用通用或典型名称。许多不同类型的传感器，例如错误指示、硬盘状态或故障和活动
  LED 状态，被有意排除在表外，以便专注于那些与功耗最相关的传感器。


