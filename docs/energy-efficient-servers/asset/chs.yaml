  ##### 多相电压调节器损耗


  多相`VR`通常用于主板上的较重负载，例如内存`DIMM`和处理器核心。如果我们考虑同样的 12V 转 1.7V 降压转换器，但将其扩展为三相以支持高达 90A
  的电流，我们会看到与单相转换器不同的损耗曲线。图 4-11 显示，三相转换器的损耗高于单相转换器。这是由于额外相位带来的附加固定损耗以及额外相位增加的开关损耗。


  ![A978-1-4302-6638-9_4_Fig11_HTML.gif](img/A978-1-4302-6638-9_4_Fig11_HTML.gif)

