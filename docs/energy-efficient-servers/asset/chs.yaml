- "# 平台电源管理\n\n数据中心中的每个 CPU 都需要大量支持硬件。这些包含在服务器机箱内的支持硬件通常被称为平台。多年来，越来越多的平台组件已被集成到 CPU\
  \ 中，例如内存控制器和`PCIe`连接。然而，数据中心整体功耗的很大一部分仍然由 CPU 和内存之外的支持基础设施消耗。存储（驱动器）、网络、电源输送和冷却都会显著增加数据中心的总成本。其中一些组件（如风扇）拥有复杂的算法来管理其功耗，而其他组件（如驱动器）则倾向于采用最低限度的电源管理技术。\n\
  \n## 平台概述\n\n从概念上讲，平台是 CPU 运行所需的一切（包括 CPU 本身）。它包括电源输送（将电网的电能转换为不同平台组件可用的形式）、冷却（风扇、散热器等），以及连接到\
  \ CPU 插槽的内存、驱动器和网络。\n\n### 常见平台组件\n\n单个平台通常被称为一个节点，一般包含 1 到 8 个通过一致性协议连接的 CPU。¹\
  \ 可用的平台设计种类繁多。然而，几乎任何平台设计都包含一些标准构建模块（见表 4-1）。本章将探讨这些不同平台组件的部分电源管理特性。\n\n**表 4-1.**\
  \ 常见平台组件\n\n| 组件 | 描述 |\n| --- | --- |\n| CPU | 这些处理器提供用户工作负载的计算和执行。参见第 2 章。 |\n\
  | 内存 | 内存为 CPU 正在使用的数据提供临时存储。参见第 3 章。 |\n| 存储 | 存储（驱动器）提供数据的大容量存储。`SAS`（串行连接 SCSI）和`SATA`（串行\
  \ ATA）是将驱动器连接到存储控制器的两种常见协议。 |\n| 网络 | 网络提供多个节点之间的通信。`以太网`和`InfiniBand`（IB）是常见的网络接口。`NIC`（网络接口卡）提供\
  \ CPU 与`以太网`/`IB`网络之间的连接。 |\n| 电源输送 | 系统中的不同组件需要不同的电压和电流类型（交流/直流）。`VR`（电压调节器）是直流到直流的转换器，它将输入电压降低到更低的工作电压。`PSU`（电源供应器）将交流电转换为直流电。\
  \ |\n| 冷却 | 当服务器消耗电力时，它会转化为热量。风扇和其他冷却设备用于将热量从平台中排出，以维持安全的工作温度。 |\n\n业界使用了多种平台设计。一些设计提供大量数据存储并连接大量驱动器。另一些可能完全无驱动器，并利用网络将数据引入节点。图\
  \ 4-1 展示了一个带有两个 CPU 插槽的潜在平台节点示例。\n\n![A978-1-4302-6638-9_4_Fig1_HTML.gif](img/A978-1-4302-6638-9_4_Fig1_HTML.gif)\n\
  \n**图 4-1.** 双插槽平台节点示例\n\n### 整合\n\n随着时间的推移，越来越多的平台组件已被整合到更少的独立芯片中。这可以在某些情况下节省成本、功耗，甚至提升性能。\n\
  \n\n\n#### CPU 集成\n\n多年来，CPU 芯片的唯一作用是提供一个（或几个）核心以及相应的缓存层级结构。这些核心通过系统总线（在 Intel 系统中为前端总线\
  \ FSB）连接到芯片组，而芯片组则提供内存控制器和 PCI 连接，用于支持磁盘和网络控制器等设备。这些总线消耗功率、限制带宽并增加延迟。因此，越来越多的芯片组功能开始被集成到\
  \ CPU 自身中，这既能降低平台功耗，又能提升性能。表 4-2 概述了至强处理器历代产品中的一些关键集成里程碑。\n\n**表 4-2.** Intel EP\
  \ 系列 CPU 的集成历程\n\n| 代际 | 集成特性 |\n| --- | --- |\n| Nehalem | 内存控制器 |\n| Jasper Forest（Nehalem\
  \ 衍生版） | PCIe 2.0（最多 16 条通道） |\n| Sandy Bridge | PCIe 3.0（最多 40 条通道），可与核心共享 L3 缓存\
  \ |\n| Haswell | 电压调节模块 |\n\n尽管这种集成可以节省功耗（减少了驱动它们的平台总线和 I/O）并提升性能（片上总线相比片外互连具有更高带宽和更低延迟），但它并非没有代价。CPU\
  \ 的面积必须增加以容纳这些额外的组件。CPU 封装可能需要容纳更多引脚（这会增加成本）。这种集成还将原本消耗在平台中的功耗转移到了距离传统 CPU 组件更近的物理位置。这要么要求为\
  \ CPU 提供更多的功率（和冷却），要么意味着可供核心使用的功率会减少。\n\nCPU 通常采用能提供最佳能效的最新制造工艺技术构建。平台中的其他设备通常采用较旧的技术制造。当它们被集成到\
  \ CPU 中时，由于制造工艺的改进，这些功能的能效会立即得到提升。\n\n#### 芯片组集成\n\n在 Nehalem 和 Sandy Bridge 代际中，CPU\
  \ 从芯片组那里吸收了内存控制器和部分 PCIe 连接功能。然而，芯片组也开始集成平台的其他组件。存储和网络控制器现在已成为服务器芯片组的标准配置。PCIe 仍然提供，但其性能通常低于\
  \ CPU 的链接，并且侧重于低带宽连接。本章后面将更详细地讨论芯片组。\n\n#### 微型服务器与服务器 SoC\n\n服务器片上系统（SoC）组件正变得越来越普遍。在这些设计中，芯片组和\
  \ CPU 被集成到单个芯片中，或作为多芯片封装（MCP）存在。其主要目标是降低部署单个 CPU 节点的成本。微型服务器的概念是，在数据中心大规模部署这些低成本设备，以在降低成本的条件下提供足够的性能。尽管微型服务器近年来得到了大量媒体报道，但将这些低成本、高能效、高度集成的设备部署到嵌入式市场，或许更具吸引力。\n\
  \n### 平台可管理性\n\n运行大型数据中心需要具备监控和管理数据中心各种组件的能力。控制风扇、重启崩溃的节点、监控功耗以及许多其他任务，对于管理典型数据中心都至关重要。这些概念将在第\
  \ 5 章和第 9 章中讨论。许多服务器平台传统上并非通过在 CPU 核心上运行软件来提供这些能力，而是部署专用的管理芯片。这些芯片通常被称为基板管理控制器（BMC）。\n\
  \n服务器 BMC 是 OEM 专有设备，其核心是一个小型微控制器。它们拥有遍布整个平台的“触角”，以便监控和控制各个子系统。平台环境控制接口（PECI）是用于\
  \ BMC 与 CPU 之间交互的标准。系统管理总线（SMBus）协议也常用于将平台设备（如电源等）的遥测信息提供给 BMC。智能平台管理接口（IPMI）是一种接口，用于软件与\
  \ BMC 交互，以提取 BMC 所知晓的大量信息（示例请参见第 7 章）。一个包含 N 个一致性 CPU 插座的平台通常搭配一个 BMC，但这并非严格必要。\n\
  \nBMC 本身并不消耗大量功率，但由于它们控制着与给定平台节点相关的风扇，因此会对系统的整体功耗产生显著影响。本章后面将讨论热管理。为了降低功耗和节省集成成本，业界曾研究过不带\
  \ BMC 的服务器，但迄今为止，这类设计尚未流行起来。\n\n\n\n## CPU 插槽\n\n现代 CPU 节点可以支持不同数量的 CPU 插槽。单处理器（`UP`）和双处理器（`DP`）服务器构成了当今销售的服务器处理器节点的主体。\n\
  \n多处理器（`MP`）节点通常由四个或八个处理器组成，但其他拓扑结构也是可能的。`MP` 平台的采购成本较高，常用于需要大型单节点性能或内存容量的场景。通过增加每个节点的\
  \ CPU 处理器数量，某些平台组件的成本可以得到分摊。例如，如果每个节点都需要一个启动 SSD 和一个网络连接，那么从 `UP` 平台转向 `DP` 平台，理论上可以将所需的\
  \ SSD 和网络连接数量减少一半。\n\n> **注意**  \n> 由于 `MP` 系统相关的采购成本和使用模式较高，能效和节能通常不是最终用户的首要优先事项。\n\
  \n`DP` 平台在成本与性能之间提供了一个极佳的平衡点。`MP` 平台通常要求每个 CPU 的整体价格更高，而 `UP` 平台在分摊其他平台成本（电力和采购）方面效果不佳。`DP`\
  \ 平台对于许多工作负载也表现出强劲的性能扩展能力。\n\n`UP` 服务器系统传统上被局限于那些根本不需要 `DP` 或 `MP` 系统性能的场景。它们并非部署在数据中心，而是用于其他低端服务器设备，例如小型企业\
  \ NAS（网络附加存储）。随着单节点性能的持续提升，`UP` 系统的成本分摊情况正在改善。如果一个 `DP` 系统需要两个网络连接才能提供足够的数据来饱和内核的能力，那么扩展到两个插槽并不会带来额外的节省。集成了网络等功能的服务器\
  \ SoC（例如微服务器）也有助于降低多插槽系统的电力和采购分摊优势。\n\n直接将两到八个处理器彼此保持一致（coherent）连接的平台被称为*无粘合（glueless）*平台。多年来，已经开发出多种无粘合拓扑结构。图\
  \ 4-2 展示了一些来自英特尔近期处理器系列的示例。请注意，在这些示例中，每个插槽与平台上其他插槽之间的“跳数”要么是一跳，要么是两跳。在一致（coherent）网络中连接更多处理器也是可能的，但这通常需要称为节点控制器的特殊硬件（或粘合胶）。如果所有处理器都通过点对点链路直接相互连接，则该平台被称为*全连接（fully\
  \ connected）*平台。全连接平台通常具有更低的延迟、更高的带宽以及比非全连接平台更好的性能扩展。额外的连接性会带来很小的电力成本，但对于大多数使用模型来说，投资回报（性能）是非常值得的。\n\
  \n![A978-1-4302-6638-9_4_Fig2_HTML.gif](img/A978-1-4302-6638-9_4_Fig2_HTML.gif)\n\
  \n**图 4-2.** 示例无粘合一致（coherent）平台拓扑结构\n\n### 节点控制器\n\n尽管大多数平台将一致（coherent）CPU 的数量限制在最多八个，但使用节点控制器（`xNC`）构建更大的一致系统是可能的。节点控制器通常是独立的芯片，通过专有结构将一、两个或四个\
  \ CPU 连接到其他节点控制器（见图 4-3）。这些系统常用于构建超级计算机，可以将数百个处理器和数千个内核连接到一个运行单一操作系统的单一一致域中。请注意，也可以通过网络以非一致方式连接大量节点来构建大型超级计算机，而无需节点控制器。这些设计之间的差异超出了本书的讨论范围。\n\
  \n![A978-1-4302-6638-9_4_Fig3_HTML.gif](img/A978-1-4302-6638-9_4_Fig3_HTML.gif)\n\
  \n**图 4-3.** 节点控制器示例\n\n## 内存提升卡与内存缓冲芯片\n\n某些高端服务器需要非常大的内存容量。数据库是最常见的例子。每个 CPU 插槽能够直接连接的\
  \ DDR 内存数量通常是有限的。插槽上的 DDR 通道数量受到封装和芯片成本的限制。通道上的 DIMM 数量受到电气负载限制的约束。LR-DIMM 试图解决其中一些问题，但能力有限。为了扩展内存以突破\
  \ CPU 插槽带来的限制，一些高端服务器采用了内存提升卡和内存缓冲芯片。CPU 并非直接连接到内存，而是与平台中的独立芯片通信，该芯片随后能够与实际 DDR\
  \ 内存通信。在这些平台中，内存连接在独立的提升卡上，其中一组 DIMM 连接到一张卡上，然后该卡再连接到主板。多年来，这些技术存在多种变体。英特尔在历史上曾将其内存缓冲技术作为其\
  \ EX 平台的一部分进行产品化（称为可扩展内存缓冲器 [SMB]），其他 OEM 厂商也部署了自己的专有技术来提供类似功能。这些缓冲芯片确实会消耗可测量的电力（通常是几瓦），但在此类平台中，与其他功耗（包括它们提供连接的内存）相比，往往相形见绌。\n\
  \n\n\n"
- '# 服务器芯片组


  许多服务器平台采用与 CPU 相连的独立芯片组。这些设备提供启动平台所需的关键传统功能、可管理性能力，并集成了许多原本需要独立控制器（如存储、网络和 USB 控制器）的功能。部分
  SoC 通过 MCP 将芯片组功能集成到封装中，而其他方案（如 Avoton）则将整个芯片组集成到与 CPU 相同的芯片上。英特尔至强服务器设计中使用的独立芯片组被称为
  PCH（平台控制器中心）。PCH 通过专有的 DMI（直接媒体接口）链路连接至 CPU，为平台提供启动、可管理性及 I/O 服务。


  自 Nehalem/Tylersburg 时代起，PCH 便成为双芯片至强英特尔架构的南桥，是 CPU 的配套组件。这一架构取代了此前采用三芯片方案的英特尔集线器架构。历代
  PCH 不断推进 IA 平台的 I/O 能力，Wellsburg 已支持 Gen2 PCIe、Gen3 SATA 及 Gen3 USB。基于微控制器的电源管理控制器（PMC）和管理引擎（ME）被添加到
  PCH 中，以支持传统电源管理功能及多项扩展特性。


  芯片组在平台中承担多种职能。表 4-3 对部分关键能力进行了高层面总结。图 4-4 展示了此类系统的示例框图。表 4-4 列举了现代 PCH 的部分集成功能。


  表 4-4.


  PCH 主要组件


  | 组件 | 描述 |

  | --- | --- |

  | 片内互连 | PCH 上存在通常被称为片内或片上互连的互联结构。这些互连在概念上与 CPU 中的类似，但不应与数据中心层面连接多个 CPU 的互连结构相混淆。
  |

  | DMI | `DMI`提供一种将 PCH 及其下游组件连接至 CPU 的机制。其运作方式与`PCIe`非常相似。 |

  | PCIe | `PCIe`连接可同时集成到 CPU 和 PCH 中，并共享相同的基本电源管理能力。PCH 适用于高扇出、低带宽的连接场景。 |

  | SATA | 部分 PCH 集成了存储连接功能，详见本章"存储"部分。 |

  | USB | `USB`主要面向消费类使用模式，但也存在于服务器中（尤其适用于调试场景）。本章后续将进行讨论。 |

  | 以太网 | PCH 也集成了以太网功能。网络电源管理详见本章"网络"部分。 |

  | SPI/LPC（传统 I/O） | 串行外设接口（`SPI`）和低引脚数接口（`LPC`）为平台启动设备提供连接点，这些设备包含 BIOS/UEFI 镜像及其他
  PCH 组件（如 ME、以太网）的固件。 |

  | ME | PCH 上的管理引擎（`ME`）提供平台管理服务、密钥管理及加密服务。 |

  | SMBus | `SMBus`提供一种传统机制，用于与平台外设通信，处理系统与电源管理相关任务。 |


  ![A978-1-4302-6638-9_4_Fig4_HTML.gif](img/A978-1-4302-6638-9_4_Fig4_HTML.gif)


  图 4-4.


  典型的服务器 PCH 架构框图


  表 4-3.


  PCH 高层能力


  | 能力 | 描述 |

  | --- | --- |

  | 高性能 I/O 连接 | 包括`PCIe`、存储（`SATA`和/或`SAS`）、网络等。这些能力仅在 CPU 激活且系统处于`S0`状态时可用。 |

  | 唤醒/启动 | PCH 既能检测唤醒事件（如局域网唤醒），也能控制平台在电源状态之间转换。PCH 还提供对 BIOS 闪存的访问。 |

  | 可管理性 | 提供数据中心监控和管理节点的接口，例如读取温度。 |

  | 实时时钟（RTC） | 维护跟踪时钟时间的系统时钟。即使拔掉台式机电源，时间和日期也不会丢失，因为它们由 RTC 维护。服务器 PCH 也具备相同能力。 |

  | 传统 I/O 连接 | 提供对系统运行通常所需的低性能平台连接的访问。 |


  传统上，PCH 一直是访问各种高速 I/O（SATA、以太网、PCIe、USB）的组件，尽管这些能力正越来越多地被集成到 CPU 中以形成 SoC 组件。SATA/PCIe/以太网/USB
  接口提供对外通信的访问，包括磁盘/固态存储、网络、USB 端口及可管理性。在平台内两个设备之间以更高性能传输数据会消耗可观的功耗，而集成是显著改善整体平台功耗的有效途径。


  在内部，PCH 架构由模拟与数字组件混合构成。与 CPU 非核心区类似，模拟设计用于片外通信（如 PCIe/SATA/USB 物理接口）和片内存储器（SRAM），而剩余系统的大部分则由同步数字逻辑构建。与传统服务器
  CPU 不同，芯片组功耗的很大一部分消耗在模拟 I/O 电路（通常称为物理层或 PHY）上，而非数字逻辑。




  ### PCH 与平台电源管理


  `PCH`负责协调第 2 章中介绍的许多平台电源状态。除此之外，它还负责管理自身的电源状态。表 4-5 概述了`PCH`参与的电源管理状态。


  **表 4-5. 服务器 PCH 支持的电源状态**


  | 状态 | 描述 |

  | --- | --- |

  | `C-states` | `PCH` I/O 的低功耗状态。有关 CPU `C-states` 的详细信息，请参见第 2 章。`PCH` 不支持所有传统的
  CPU `C-states`，但在 CPU 不活动时，它会将其 I/O 置于低功耗状态。•`C0` 是活动状态，此时 `PCH` 逻辑和 I/O 功能正常。•`Cx`
  是时钟/电源门控状态，在此期间 `PCH` I/O 会转换到功耗更低的受管状态。 |

  | `S-states` | 关闭 CPU 封装（休眠状态）。有关 `S-states` 的详细信息，请参见第 2 章。`PCH` I/O 被关闭（`S0` 除外），但
  `PCH` 核心逻辑在所有 `S-states` 中保持活动。`PCH` 可以根据平台信号将 CPU 从 `S3/S4/S5` 状态唤醒。从 `S3` 状态唤醒需要数秒，而从
  `S5` 状态唤醒需要进行完整系统启动，可能需要数分钟。 |

  | `M-states` | 关闭管理引擎。这些状态与管理引擎相关。•`M0`：活动状态，当平台处于 `S0` 状态时。•`M3`：活动状态，当平台处于 `S3/S4/S5`
  状态时，用于带外平台管理和诊断。•`MOff`：管理引擎在 `Sx` 状态中关闭。 |

  | `G-states` | 全局状态。有关详细信息，请参见第 2 章。`PCH` 在 `G0` 到 `G2` 状态下处于活动状态，仅在 `G3` 状态（机械关闭）下关闭。
  |


  由于 `PCH` 控制平台电源轨和时钟，即使在 CPU 断电的状态下（`G-` 和 `S-states`），它也需要保持供电。这一目标是通过使用平台电源轨实现的，这些电源轨会根据系统状态依次断电。`PCH`
  提供一系列高级功能，这些功能会在较低电源状态下被依次禁用。表 4-4 概述了这些功能，而表 4-6 则展示了这些功能在每个电源状态下如何被禁用。


  **表 4-6. PCH 电源状态及功能示例**


  | `G-State` | `M-State` | `S-States` | 电源轨 | 可管理性 | 唤醒能力 |

  | --- | --- | --- | --- | --- | --- |

  | `G0` | `M0` | `S0` | 全部可用 | 可用 | 无（已唤醒） |

  | `G0` | `M3` | `S3/S4/S5` | 唤醒 + 可管理性 + RTC | 可用 | 是 |

  | `G2` | `MOff` | `S4/S5` | 唤醒 + RTC | 禁用 | 是 |

  | `G3` | `MOff` | `S4/S5` | RTC | 禁用 | 无 |


  当平台重新供电时，系统会自动从 `G3` 状态转换到 `G2` 状态。从那里开始，可以使用各种唤醒事件，根据需要将状态转换到更高功率的运行模式。因此，`G3`
  状态对用户是隐藏的。


  ### PCH 电源管理


  `PCH` 消耗节点总功率的一小部分。由于 `PCH` 的大部分功耗存在于 I/O PHY 中，因此负载下的典型功耗在很大程度上取决于所连接设备的数量。当所有高速
  I/O 端口都连接时（完全满载），`Patsburg`（与 `Sandy Bridge` 和 `Ivy Bridge E5` 处理器配合使用的芯片组）的 `TDP`
  功率为 8 W 到 12 W。当完全满载时，`Wellsburg`（与 `Haswell E5` 配对）的 `TDP` 功耗为 7 W。如果某些 I/O 未被使用，则可以节省显著的功率。表
  4-7 概述了 `PCH` 的四种不同使用配置以及这些配置对应的 `TDP` 功率。


  **表 4-7. 不同 I/O 端口配置下的 PCH TDP 功耗 (W)**


  | | 工作站 | 服务器 | 低功耗 | 仅引导 |

  | --- | --- | --- | --- | --- |

  | USB2 端口 | 14 | 6 | 2（检测） | 0 |

  | USB3 端口 | 4 | 4 | 1（检测） | 0 |

  | SATA3 端口 | 8 | 5 | 2 | 0 |

  | SATA2 端口 | 2 | 1 | 1 | 0 |

  | PCIe 通道 | 8 | 4 | 2 | 0 |

  | TDP (W) | 6.5 | 5 | 3.2 | 1 |


  与 `Haswell Server CPU` 一同推出的 `Wellsburg PCH`，采用低漏电工艺制造，并未采用电压-频率缩放或电源门控等技术来降低运行时的功耗。不支持
  Turbo 模式。为了节省功耗，会对已禁用或当前未使用的逻辑功能模块实施时钟门控。由于 `PCH` 以 I/O 为主，其功耗的相当一部分来自于为平台提供物理接口的电路。这些接口的电压通常是静态的（由行业标准规范定义）。为了根据运行状态机会性地降低功耗，为链路定义了若干电源管理状态，如下节所述。


  如果某个逻辑功能模块整体未被使用，则驱动该模块的 `PLL`（锁相环）可以断电。例如，如果用户构建的计算节点没有任何本地驱动器，那么 `PCH` 中的存储子系统可以完全断电。


  ### 芯片组中的 PCIe


  在 `Sandy Bridge` 和 `Jasper Forest` 之前，芯片组负责提供平台上的 `PCIe` 连接。当 `Sandy Bridge` 将 `PCIe`
  集成到 CPU 中时，芯片组继续提供这项能力。如今，在配备独立 `PCH` 设备的平台中，`PCIe` 连接同时存在于 CPU 芯片和 `PCH` 上。`PCH`
  中的 `PCIe` 提供了第 3 章中描述的相同节电功能（`L1`、`DLW`）。


  CPU 上的 `PCIe` 提供高性能和（相对）低延迟的连接，但代价是扇出方面的限制（小于 `x4` 的设备会消耗四个通道）。而 `PCH` 提供较低的带宽和较长的延迟，但可以分叉至
  `x1`，使其成为低带宽设备的绝佳选择。


  ### PCH 热管理


  `PCH` 包含热传感器，用于监控温度，并帮助确保 `PCH` 不会达到可能导致可靠性降低或损坏的危险温度。`PCH` 可能会自行降频以保持在目标温度以下，甚至可能在温度超过灾难性阈值时立即启动关机。与
  CPU 类似，`PCH` 的规格包含一个用于设计散热方案的 `TDP` 额定值，以及一个用于确定电压调节器尺寸以向电源轨供电的 `ICCMAX` 额定值。它们还包含类似的热保护机制，例如在检测到灾难性温度时关闭平台。平台热管理将在本章后面详细讨论。




  '
- '# 网络


  网络接口——包括本地局域网适配器以及网络基础设施设备——是服务器平台与外界通信的网关。网络活动在多个尺度上表现出数据包到达时间的不可预测分布。作为副作用，网络接口从未完全断电。局域网适配器贡献了平台总功耗约
  5 至 10 瓦。在部署了高功率 CPU 和大容量内存的典型服务器平台中，这部分功耗并非主要贡献者。尽管局域网适配器本身不直接贡献平台功耗的显著比例，但其行为和配置会对
  CPU 的功耗（进而影响平台整体功耗）产生巨大影响。


  > **注意：** 虽然网卡本身不直接贡献平台功耗的显著百分比，但其配置和行为会对 CPU 功耗（进而影响平台功耗）产生重大影响。


  在典型使用中，局域网组件的功耗主要由五个因素驱动。表 4-8 提供了这些因素的高级概述（在后续页面中将详细讨论）。


  **表 4-8.** 局域网控制器功耗的主要因素


  | 因素 | 描述 |

  | --- | --- |

  | 环境温度 | 局域网设备传统上采用高漏电工艺技术制造，导致在较高温度下功耗显著增加。 |

  | 连接介质 | 连接类型（光纤、铜缆等）对功耗有中等程度的影响。 |

  | 配置速度 | 局域网控制器可通过软件配置以较低频率运行。这可以节省可观的功耗。 |

  | 电源管理特性 | 有多种电源管理选项可供选择，可以通过权衡性能（延迟）来节省功耗。 |

  | 带宽 | 每秒数据包数对网卡功耗影响最大（而非原始带宽）。然而，在近期的高性能网络设备上，对带宽的敏感度并不显著。 |


  ## 环境温度、TDP 和热管理


  许多局域网供应商在其数据手册中列出了典型功耗数值。然而，对于什么是典型使用，业界并无统一惯例，尽管许多人假定环境空气温度为 25°C 和标称电压。温度从 25°C
  升高到 70°C，仅因漏电（其本身是用于制造设备的硅工艺的函数）就可使组件功耗增加 50% 至 100%。随着局域网控制器转向更低漏电的工艺，或集成到低漏电的片上系统设计中，对温度的敏感度将会降低。


  与 CPU 设计类似，局域网控制器的最大标称功耗是在假设最坏情况（包括高温，约 70°C 环境温度）下测量的。服务器平台的热管理——例如风扇尺寸和转速——设计用于冷却至这个最大组件热设计功耗。局域网控制器通常设计为假设被动散热，并且这些设备通常存在于气流受限的区域。主动散热（如风扇）因服务器平台可靠性问题而不被鼓励。最终结果是，无论提供何种功能或介质，服务器局域网组件的热设计功耗必须为
  10 瓦或更低（除非在平台层面做出特殊设计安排以增加额外的风扇散热）。表 4-9、4-10 和 4-11 显示了一些关于英特尔局域网适配器热设计功耗的历史信息。


