  \n```\nTable.AddRankColumn(\n    table as table,\n    newColumnName as text,\n \
  \   comparisonCriteria as any,\n    optional options as nullable record\n) as table\n\
  ```\n\n**第 8 章 表格**\n\n根据函数语法，它需要四个输入。\n\n1. 在第一个输入中，输入引用表格。\n2. 在第二个输入中，确定新列的标题。\n\
  3. 在此输入中指定行的比较标准。在最简单的情况下，可以在此输入中以文本形式输入列标题作为排名标准。\n4. 该函数的第四个输入表示与排名相关的设置。此输入是可选的，你可以使用以下选项：`RankKind.Competition`（相当于数字\
  \ 0）、`RankKind.Dense`（相当于数字 1）和 `RankKind.Ordinal`（相当于数字 2）。`RankKind.Competition`\
  \ 是默认值，它确定具有相同值的行获得相同排名，并且它们的排名与下一个值的排名之间会产生间隙（例如，有两个排名为 1 的行，下一行排名为 3，没有排名为 2 的行）。在\
  \ `RankKind.Dense` 中，具有相同值的行获得相同的排名，并且它们的排名与下一个值的排名之间没有间隙（例如，创建了两个排名为 1 的行，下一行的排名为\
  \ 2）。在 `RankKind.Ordinal` 状态下，所有行（即使是具有相同值的行）都会获得一个唯一的排名。\n\n根据函数说明，以下公式的结果等于表 8-79：\n\
  \n**第 8 章 表格**\n\n```\n= Table.AddRankColumn(\n    TableC,\n    \"rank\",\n    \"\
