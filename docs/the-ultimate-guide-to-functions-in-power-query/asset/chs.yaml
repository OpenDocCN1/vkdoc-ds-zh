  \ 和 `C` 归集到名为 `Product Name` 的列下，其销量显示在名为 `Quantity` 的列中。同样，`Table.UnpivotOtherColumns`\
  \ 函数可用于逆透视数据，但在此函数的第二个参数中，无需输入要逆透视的列标题列表，而是输入要保持不变的列名列表。因此，上述函数可修改如下：\n\n```\n=\
  \ Table.UnpivotOtherColumns(\nTableF,\n{\"Date\"},\n\"Attribute\",\n\"Value\")\n\
  ```\n\n## 第 8 章 表\n\n### `Table.Group`\n\n`Table.Group` 是 Power Query 中最重要的函数之一，可用于汇总表中的值。例如，通过此函数可以轻松地从大量历史销售数据库中提取出每年每种产品的销售额。Power\
  \ Query 中的 `Table.Group` 函数定义如下：\n\n```\nTable.Group(\n   table as table,\n   key\
  \ as any,\n   aggregatedColumns as list,\n   optional groupKind as nullable number,\n\
  \   optional comparer as nullable function\n) as table\n```\n\n此函数有五个参数。\n\n1. 第一个参数中输入参考表。\n\
  2. 在此参数中输入您希望基于其创建报表的列名。要提供每年的销售额，在此参数中输入包含年份值的列名；要提供每种产品每年的销售额，则在此参数中以列表形式输入包含年份值和产品名称的列名。\n\
  3. 在第三个参数中，以列表形式输入要应用计算的列名以及计算函数。\n4. 此函数的第四个参数为可选参数，可将分组方法定义为 `GroupKind.Local`（仅对相邻值进行分组）或\
  \ `GroupKind.Global`（对整个表中的所有值进行分组）。\n5. 此函数的第五个参数为可选参数，可以是 `Comparers.Equals`、`Comparer.FromCulture`、`Comparer.Ordinal`\
  \ 和 `Comparer.OrdinalIgnoreCase` 中的任意一个。\n\n基于函数说明并参考 `TableC`，此函数的结果如下所示。\n\n以下公式的结果为按产品划分的销售额：\n\
  \n```\n= Table.Group(\nTableC,\n\"Product Name\",\n{\"Total\",each List.Sum([Quantity])})\n\
  ```\n\n此公式的结果见 表 8-95。\n\n***表 8-95.** `Table.Group` 的结果*\n\n| **产品名称** | **总计**\
  \ |\n|--------------|----------|\n| a            |          |\n| C            |\
  \          |\n| b            |          |\n\n在上述公式中，由于未为此函数的第四个参数输入任何值，因此分组类型被视为\
  \ `GroupKind.Global`。\n\n但是，如果您在函数的第四个参数中输入分组类型为 `GroupKind.Local`，则会根据相邻的产品名称进行分组。结果如\
  \ 表 8-96 所示。\n\n```\n= Table.Group(\nTableC,\n\"Product Name\",\n{\"Total\",each\
  \ List.Sum([Quantity])},\nGroupKind.Local)\n```\n\n***表 8-96.** `Table.Group` 的结果*\n\
