  \ **columns** as any\n) as table`\n\n根据函数语法，它需要两个输入参数。\n\n1.  第一个输入参数中，输入引用表格。\n\
  2.  该函数的第二个输入参数是可选的，用于确定输出表格中列的名称。\n\n**第 8 章 表格**\n\n例如，将表格 8-99 视为 `TableS`。\n\
