  \ b | |\n| 2/4/2023 | a | |\n| 2/6/2023 | C | |\n\n以下公式的结果等同于表 8-64。\n\n`= Table.RemoveColumns(TableC,\
  \ {\"Row\", \"Quantity\"})`\n\n**表 8-64.** `Table.RemoveColumns` 的结果\n\n| **Date**\
