  ## `Table.SplitColumn`\n\n`Table.SplitColumn` 可用于根据特定标准将表某一列的值分割到多个列中。该函数在 Power\
  \ Query 中的定义如下：\n\n```\nTable.SplitColumn(\n    table as table,\n    sourceColumn\
  \ as text,\n    splitter as function,\n    optional columnNamesOrNumber as any,\n\
  \    optional default as any,\n    optional extraColumns as any\n) as table\n```\n\
  \n根据函数语法，它接收六个输入参数：\n\n1.  第一个输入是引用表。\n2.  第二个输入是要分割成多个列的列名。\n3.  第三个输入是分割函数。在此输入中，可以使用以下函数之一：\n\
  \    -   `Splitter.SplitByNothing`\n    -   `Splitter.SplitTextByCharacterTransition`\n\
  \    -   `Splitter.SplitTextByAnyDelimiter`\n    -   `Splitter.SplitTextByDelimiter`\n\
  \    -   `Splitter.SplitTextByEachDelimiter`\n    -   `Splitter.SplitTextByLengths`\n\
  \    -   `Splitter.SplitTextByPositions`\n    -   `Splitter.SplitTextByRanges`\n\
  \    -   `Splitter.SplitTextByRepeatedLengths`\n    -   `Splitter.SplitTextByWhitespace`\n\
  4.  该函数的第四个输入指定了新列的名称或数量。\n5.  函数的第五个输入是可选的，用于确定函数的默认值。通常情况下，函数的默认值是 `null`。分割后，在没有值的列中会显示\
  \ `null`。使用此输入时，可以用另一个词来代替 `null` 一词。\n6.  函数的第六个输入也是可选的。\n\n基于以上说明，考虑 `TableC`\
  \ 并假设日期列中的信息为文本格式，以下公式表示日期列中的信息应根据 `/` 分割到多个列中，并显示在名为 `Date.1`、`Date.2` 和 `Date.3`\
  \ 的三个列中：\n\n```\n= Table.SplitColumn(\n    TableC,\n    \"Date\",\n    Splitter.SplitTextByDelimiter(\"\
  /\"),\n    {\"Date.1\", \"Date.2\", \"Date.3\"})\n```\n\n因此，此公式的结果等同于表 8-82。\n\n\
  ### `Table.SplitColumn` 的结果（三列）\n\n**行** | **Date.1** | **Date.2** | **Date.3**\
