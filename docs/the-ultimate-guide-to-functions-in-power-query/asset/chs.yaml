  AW\",5)` | `“   aW”` |\n| `= Text.PadStart(\"AW\",1,\"X\")` | `“aW”` |\n\n### `Text.Replace`\n\
  \n使用此函数，可以用新字符替换文本中的子字符串，如下所示：\n\n`Text.Replace(`  \n`    text` as nullable text,\
