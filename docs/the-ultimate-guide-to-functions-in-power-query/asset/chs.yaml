  \ 示例\n\n| 公式 | 结果 |\n| --- | --- |\n| `= Text.Replace(\"XNW-11-181/MN\",\"-\",\"\
  /\")` | `“xnW/11/181/Mn”` |\n| `= Text.Replace(\"XNW-11-181/MN\",\"/\",\"-\")` |\
