  通过使用 `Table.Pivot`，可以将表中某一列中的值显示为更宽表格中的单独列。此函数在 Power Query 中定义如下：\n\n```\nTable.Pivot(\n\
  \    table as table,\n    pivotValues as list,\n    attributeColumn as text,\n \
  \   valueColumn as text,\n```\n\n\n```plaintext\n可选的 `aggregationFunction`，类型为可为空的函数\n\
  \n) as table\n\n## 第 8 章 表格\n\n例如，在使用此函数时，不必像在 TableC 中那样将产品名称写在一列中，而是可以将不同的产品名称输入到不同的列中，并在其下方显示相应的销售数据，如表\
  \ 8-91 所示。\n\n***表 8-91.** Table.Pivot 示例*\n\n| **日期** | **A** | **C** | **B** |\n\
  |----------|-------|-------|-------|\n| 2023/1/30 | null | Null | |\n| 2023/1/31\
  \ | null | Null | |\n| 2023/2/1 | | | |\n| 2023/2/2 | null | | |\n| 2023/2/3 | null\
  \ | Null | |\n| 2023/2/4 | null | | |\n| 2023/2/6 | null | null | |\n\n此函数接收五个输入。\n\
  \n1. 在第一个输入中，指定引用表。\n2. 在此输入中，以列表形式输入新列的名称，例如 `{\"A\", \"B\", \"C\"}`。\n3. 此输入为文本格式，并以文本格式输入包含新列值（在第二个输入中输入）的列名称。\n\
  4. 在此输入中以文本形式输入列名称，其值应在新表的新列下方进行汇总。\n5. 此输入为可选参数，它通过使用 `List.Sum` 或 `List.Average`\
  \ 等函数来确定如何汇总这些值。\n\n根据函数说明并考虑 TableE（TableE 等同于 TableC 移除 `Row` 列后的结果），以下公式的结果等于表\
  \ 8-92：\n\n```\n= Table.Pivot(TableE, {\"A\", \"B\", \"C\"}, \"Product Name\", \"\
  Quantity\", List.Sum)\n```\n\n***表 8-92.** TableE 定义*\n\n| **日期** | **A** | **B**\
  \ | **C** |\n|----------|-------|-------|-------|\n| 2023/1/30 | null | null | |\n\
  | 2023/1/31 | null | null | |\n| 2023/2/1 | | | |\n| 2023/2/2 | null | | |\n| 2023/2/3\
  \ | null | null | |\n| 2023/2/4 | null | | |\n| 2023/2/6 | null | null | |\n\n此公式的问题是，如果产品列表中添加了一个新产品名称（例如\
  \ D），它将不会自动添加到结果表中。因此，此函数的第二个输入修改如下：\n\n```\n= List.Distinct(TableE[Product Name])\n\
  ```\n\n该函数的输出等于所有产品名称的列表，因此通过以下公式，如果新产品添加到 TableE 中，它们会被自动考虑：\n\n```\n= Table.Pivot(\n\
  \    TableE,\n    List.Distinct(TableE[Product Name]),\n    \"Product Name\",\n\
  \    \"Quantity\",\n    List.Sum\n)\n```\n\n#### Table.Unpivot\n\n此函数具有以下语法，用于逆透视列，这意味着将某些列标题转换为一个列，并将其值转换为它们前面的另一个列（将两列或多列中输入的值显示在两列中，上下排列）：\n\
  \n```\nTable.Unpivot(\n    table as table,\n    pivotColumns as list,\n    attributeColumn\
  \ as text,\n    valueColumn as text\n) as table\n```\n\n根据函数语法，它需要四个输入：\n\n1. 第一个输入定义引用表。\n\
  2. 在第二个输入中，以列表形式输入要将其值放置在两列下的列标题。\n3. 在此函数的第三个输入中，输入第一个新列（包含先前列的标题）的名称。\n4. 在此函数的第四个输入中，输入第二个新列（包含先前列的值）的名称。\n\
  \n例如，如果与不同产品销售相关的值存储在 TableF 中，如表 8-93 所示，为了将它们的值上下显示，而不是将每种产品的销售显示在单独的列中，可以如下使用此函数：\n\
