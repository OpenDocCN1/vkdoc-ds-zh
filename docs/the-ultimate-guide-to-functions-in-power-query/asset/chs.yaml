  这些函数接受两个参数，如下所示：\n\n1.  第一个参数中应输入一个参考列表。\n2.  第二个输入决定了应从参考列表的开头或结尾移除多少个值。\n\n###\
  \ `List.RemoveRange`\n\n`List.RemoveRange` 用于移除列表中的值，其语法如下：\n\n`List.RemoveRange(`\n\
