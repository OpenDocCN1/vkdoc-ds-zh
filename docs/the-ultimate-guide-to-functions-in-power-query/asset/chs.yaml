  \ 年 2 月 1 日\n\na\n\n### 检查所有行中的条件\n\nPower Query 中有几个函数用于评估表格列中的条件。\n\n### `Table.IsDistinct`\n\
  \n若要检查表中是否存在重复行，可按如下方式使用 `Table.IsDistinct`：\n\n```\nTable.IsDistinct(\n   table\
  \ as table,\n   optional comparisonCriteria as any\n) as logical\n```\n\n该函数接受两个输入。如果根据第二个输入中指定的列，在引用表中存在重复行，则结果为\
  \ false；否则结果为 true。\n\n1. 第一个输入中输入引用表。\n2. 此输入为可选，用于定义比较值的条件。例如，在列表中输入列名，表示在指定列上搜索重复行。\n\
  \n以 `TableC` 为例，该函数在不同公式下的结果如下。\n\n以下公式的结果为 True，因为 `TableC` 中没有任何两行在其所有列中具有相同的数据：\n\
  \n`= Table.IsDistinct(TableC)`\n\n但是，如果按如下方式定义此函数，则结果为 False，因为 `Product Name` 列包含重复的名称：\n\
  \n`= Table.IsDistinct(TableC,\"Product Name\")`\n\n但如果在以下公式的比较中也考虑日期，则公式的结果为 True：\n\
  \n`= Table.IsDistinct(TableC,{\"Date\",\"Product Name\"})`\n\n### `Table.MatchesAllRows`\n\
  \n使用 `Table.MatchesAllRows`，可以对表中的所有行检查某个条件。如果定义的条件对所有行都为真，则函数结果为 true；如果定义的条件至少对一行不为真，则结果为\
  \ false。\n\n该函数在 Power Query 中定义如下：\n\n```\nTable.MatchesAllRows(\n   table as table,\n\
  \   condition as function\n) as logical\n```\n\n根据函数语法，它接受两个输入：\n\n1. 第一个输入是引用表。\n\
  2. 第二个输入指定所需的条件。\n\n因此，以下公式的结果为 true，因为 `Quantity` 列中的所有数据均为正数：\n\n`= Table.MatchesAllRows(TableC,each\
  \ [Quantity]>0)`\n\n类似地，以下公式的结果为 true，因为 `Product Name` 列中存在“A”、“B”或“C”这三种状态之一：\n\
  \n```\n= Table.MatchesAllRows(\n   TableC,\n   each [Product Name]=\"A\" or [Product\
  \ Name]=\"B\" or [Product Name]=\"C\")\n```\n\n并且，由于所有产品名称都不等于 X，因此以下公式的结果也为 true：\n\
  \n`= Table.MatchesAllRows(TableC,each [Product Name]<>\"X\")`\n\n然而，以下公式的结果均为 false：\n\
  \n`= Table.MatchesAllRows(TableC,each [Product Name]=\"A\")`\n\n`= Table.MatchesAllRows(TableC,each\
  \ [Quantity]>10)`\n\n`= Table.MatchesAllRows(TableC,each Number.Mod([Quantity],2)=0)`\n\
  \n### `Table.MatchesAnyRows`\n\n`Table.MatchesAnyRows` 与 `Table.MatchesAllRows`\
  \ 函数类似，不同之处在于，此函数的结果仅当表中至少有一行满足定义的条件时才为 true。`Table.MatchesAnyRows` 的语法如下：\n\n```\n\
  Table.MatchesAnyRows(\n   table as table,\n   condition as function\n) as logical\n\
  ```\n\n该函数接受两个输入：\n\n1. 第一个输入中输入引用表。\n2. 在第二个输入中定义所需的条件。\n\n根据函数说明，以下公式的结果为 True，因为在\
  \ `TableC` 中至少有一行的产品名称记录为 A。\n\n```\n= Table.MatchesAnyRows(\n   TableC,\n   each\
  \ [Product Name]=\"A\")\n```\n\n类似地，以下公式的结果为 True，因为在表中至少有一行的 `Quantity` 列中输入的值等于\
  \ 10：\n\n```\n= Table.MatchesAnyRows(\n   TableC,\n   each [Quantity]=10)\n```\n\
  \n以下公式的结果为 True，因为在表的一行中，产品 A 的销量为 6：\n\n```\n= Table.MatchesAnyRows(\n   TableC,\n\
  \   each [Product Name]=\"A\" and [Quantity]=6)\n```\n\n但以下公式的结果为 false，因为在表的任何一行中，产品\
  \ A 的销量均未达到 10 个单位：\n\n\n\n= `Table.MatchesAnyRows(TableC, each [Product Name]=\"\
  A\" and [Quantity]=10)`\n\n并且，由于产品名称列不包含值`x`，以下公式的结果为`false`：\n\n= `Table.MatchesAnyRows(TableC,\
  \ each [Product Name]=\"X\")`\n\n### `Table.Contains`\n\n要检查表中是否存在某个值，可以使用`Table.Contains`，其用法如下：\n\
  \n`Table.Contains(table as table, row as record, optional equationCriteria as any)\
  \ as logical`\n\n该函数接收三个输入：\n\n1.  第一个输入是引用表。\n2.  第二个输入中，要搜索的值以及用于搜索的列名以记录（record）的形式指定。\n\
  3.  第三个输入是可选的，允许用户指定用于比较值的自定义条件。\n\n结合上述说明，以下公式的结果为`True`，因为在`TableC`的至少一行中，`Quantity`列输入了值`18`：\n\
  \n= `Table.Contains(TableC, [Quantity=18])`\n\n以下公式的结果为`False`，因为表中不存在这样一行：在产品名称列为`B`且`Quantity`值为`18`：\n\
  \n= `Table.Contains(TableC, [Product Name=\"B\", Quantity=18])`\n\n但是，如果在第三个输入中注册了值`\"\
  Quantity\"`，意味着只有`Quantity`列被纳入比较基准，那么以下公式的结果为`True`：\n\n= `Table.Contains(TableC,\
  \ [Product Name=\"B\", Quantity=18], \"Quantity\")`\n\n### `Table.ContainsAll` 和\
  \ `Table.ContainsAny`\n\n这两个函数与`Table.Contains`类似，区别在于`Table.ContainsAll`和`Table.ContainsAny`函数可以同时检查一列中是否存在两个或更多值。这些函数在\
  \ Power Query 中的定义如下：仅当第二个输入中指定的所有值都存在于引用表中时，`Table.ContainsAll`函数的结果才为`True`；但在`Table.ContainsAny`函数中，只要其中一个值存在于引用表中，函数的结果即为`True`。\n\
  \n`Table.ContainsAll(table as table, rows as list, optional equationCriteria as\
  \ any) as logical`\n\n`Table.ContainsAny(table as table, rows as list, optional\
  \ equationCriteria as any) as logical`\n\n这两个函数均接收三个输入：\n\n1.  第一个输入定义了引用表。\n2.\
  \  第二个输入中，输入一个值列表，用于检查这些值在列中是否存在。这些值应以列表内的不同记录（record）形式输入。\n3.  第三个输入是可选的，允许你指定用于比较值的自定义条件。\n\
  \n考虑`TableC`，以下公式的结果为`True`，因为数字`18`和`10`都存在于引用表的`Quantity`列中：\n\n= `Table.ContainsAll(TableC,\
  \ {[Quantity=18],[Quantity=10]})`\n\n但由于引用表的`Quantity`列不包含`12`，以下公式的结果为`False`：\n\
  \n= `Table.ContainsAll(TableC, {[Quantity=18],[Quantity=10],[Quantity=12]})`\n\n\
  在上面公式中使用`Table.ContainsAny`替代`Table.ContainsAll`，由于值`18`、`10`或`12`中至少有一个在引用表的`Quantity`列中注册过，因此结果为`True`。因此，以下公式的结果为`True`：\n\
  \n= `Table.ContainsAny(TableC, {[Quantity=18],[Quantity=10],[Quantity=12]})`\n\n\
  ### `Table.SingleRow`\n\n`Table.SingleRow`接收一个表格式的输入。如果该表只有一行，此函数会在输出中将该行的结果显示为一条记录；否则，该函数的结果是一个错误。此函数在\
  \ Power Query 中的定义如下：\n\n`Table.SingleRow(table as table) as record`\n\n#### 列名\n\
  \n要提取列名列表并进行更改，有以下不同的函数，将在本节中讨论。为简化示例，不同公式中将使用`TableC`。\n\n#### `Table.ColumnNames`\n\
  \n\n\n# 使用 `Table.ColumnNames` 提取列名\n\n通过以下语法使用此函数，可以提取表的列名：\n\n`Table.ColumnNames(**table**\
  \ as table) as list`\n\n此函数接收一个表作为输入，并在输出中将其列标题显示为一个列表。因此，公式`Table.ColumnNames(TableC)`的结果等于以下列表：\n\
  \n`{\"Row\",\"Date\",\"Product Name\",\"Quantity\"}`\n\n## `Table.DemoteHeaders`\n\
  \n如果表的第一行被错误地识别为列标题，可以使用`Table.DemoteHeaders`将列标题返回到表的第一行。此函数接收一个表作为输入，然后将表的列标题添加为第一行，并将表的列命名为`Column1`、`Column2`等。\n\
  \n`Table.DemoteHeaders(**table** as table) as table`\n\n因此，公式`Table.DemoteHeaders(TableC)`的结果如表\
  \ 8-56 所示。\n\n**表 8-56.** `Table.DemoteHeaders(TableC)`的结果\n\n| **Column1** | **Column2**\
  \ | **Column3** | **Column4** |\n| --- | --- | --- | --- |\n| row | Date | product\
  \ Name | Quantity |\n| 1/30/2023 | a | | |\n| 1/31/2023 | a | | |\n| 2/1/2023 |\
  \ C | | |\n| 2/1/2023 | a | | |\n| 2/1/2023 | b | | |\n| 2/2/2023 | b | | |\n| 2/2/2023\
  \ | a | | |\n| 2/3/2023 | C | | |\n| 2/4/2023 | b | | |\n| 2/4/2023 | a | | |\n\
  | 2/6/2023 | C | | |\n\n## `Table.PromoteHeaders`\n\n使用`Table.PromoteHeaders`，可以将输入表的第一行值提升为标题。此函数在\
  \ Power Query 中定义如下：\n\n```\nTable.PromoteHeaders(\n    **table** as table,\n  \
  \  optional **options** as nullable record\n) as table\n```\n\n此函数接收两个输入：\n\n1.\
  \ 第一个输入是引用表。\n2. 第二个输入用于将日期或时间格式的值添加为标题。在默认模式下，只有文本和数字格式的值可以用作列标题；日期或时间格式的值不能用作列标题。为解决此问题，在此输入中输入`[PromoteAllScalars\
  \ = true, Culture = \"en-US\"]`，即可将日期也注册到标题列。\n\n因此，`= Table.PromoteHeaders(TableC)`的结果如表\
  \ 8-57 所示。\n\n**表 8-57.** `Table.PromoteHeaders(TableC)`的结果\n\n| Column2 |\n| ---\
  \ |\n| a |\n| 1/31/2023 |\n| a |\n| 2/1/2023 |\n| C |\n| 2/1/2023 |\n| a |\n| 2/1/2023\
  \ |\n| b |\n| 2/2/2023 |\n| b |\n| 2/2/2023 |\n| a |\n| 2/3/2023 |\n| C |\n| 2/4/2023\
  \ |\n| b |\n| 2/4/2023 |\n| a |\n| 2/6/2023 |\n| C |\n\n以下公式的结果如表 8-58 所示：\n\n`=\
  \ Table.PromoteHeaders(TableC, [PromoteAllScalars = true, Culture = \"en-US\"])`\n\
  \n**表 8-58.** `Table.PromoteHeaders`的结果\n\n| 1/30/2023 |\n| --- |\n| a |\n| 1/31/2023\
  \ |\n| a |\n| 2/1/2023 |\n| C |\n| 2/1/2023 |\n| a |\n| 2/1/2023 |\n| b |\n| 2/2/2023\
  \ |\n| b |\n| 2/2/2023 |\n| a |\n| 2/3/2023 |\n| C |\n| 2/4/2023 |\n| b |\n| 2/4/2023\
  \ |\n| a |\n| 2/6/2023 |\n| C |\n\n## `Table.HasColumns`\n\n要评估表中是否存在一个或多个列（基于列标题），可以按如下方式使用`Table.HasColumns`：\n\
  \n`Table.HasColumns(**table** as table, **columns** as any) as logical`\n\n此函数接收两个输入：\n\
  \n1. 在第一个输入中，输入引用表。\n2. 在第二个输入中，以文本或列表形式插入要在引用表中搜索的列名。\n\n此函数的应用如表 8-59 所示。\n\n\
  **表 8-59.** `Table.HasColumns`的结果\n\n| **公式** | **结果** |\n| --- | --- |\n| `= Table.HasColumns(TableC,\"\
  Product Name\")` | `true` |\n| `= Table.HasColumns(TableC,\"Tax\")` | `False` |\n\
  | `= Table.HasColumns(TableC,{\"Product Name\",\"Quantity\"})` | `true` |\n\n##\
  \ `Table.ColumnsOfType`\n\n要提取具有特定值格式的列名，可以按如下方式使用`Table.ColumnsOfType`：\n\n`Table.ColumnsOfType(**table**\
  \ as table, **listOfTypes** as list) as list`\n\n根据函数语法，它接收两个输入：\n\n1. 第一个输入定义引用表。\n\
  2. 第二个输入以列表形式定义所需的值格式。\n\n此函数的输出是一个列表，包含搜索格式的表的列标题。因此，根据上述说明，以下公式的结果等于所有值格式为“any”的列名，即等于`{\"\
  Row\", \"Date\", \"Product Name\", \"Quantity\"}`：\n\n`= Table.ColumnsOfType(TableC,{type\
  \ any})`\n\n## `Table.PrefixColumns`\n\n\n\n此函数在 Power Query 中用于在所有列名称前添加前缀，如下所示：\n\
  \n```\nTable.PrefixColumns(\n   table as table,\n   prefix as text\n) as table\n\
  ```\n\n`Table.PrefixColumns` 接受两个参数。\n\n1. 第一个参数是引用表。\n2. 第二个参数以文本格式输入前缀。\n\n此函数的输出是一个类似于引用表的表，不同之处在于所有列的标题前都已添加了前缀。\n\
  \n例如，公式 `= Table.PrefixColumns(TableC, \"New\")` 的结果如表 8-60 所示。\n\n**表 8-60.** `Table.PrefixColumns`\
  \ 的结果\n\n| **New.Row** | **New.Date** | **New.Product Name** | **New.Quantity**\
  \ |\n| :--- | :--- | :--- | :--- |\n| 1/30/2023 | a | | |\n| 1/31/2023 | a | | |\n\
  | 2/1/2023 | C | | |\n| 2/1/2023 | a | | |\n| 2/1/2023 | b | | |\n| 2/2/2023 | b\
  \ | | |\n| 2/2/2023 | a | | |\n| 2/3/2023 | C | | |\n| 2/4/2023 | b | | |\n| 2/4/2023\
  \ | a | | |\n| 2/6/2023 | C | | |\n\n## `Table.RenameColumns`\n\n顾名思义，`Table.RenameColumns`\
  \ 用于重命名表中的列标题，如下所示：\n\n```\nTable.RenameColumns(\n   table as table,\n   renames\
  \ as list,\n   optional missingField as nullable number\n) as table\n```\n\n`Table.RenameColumns`\
  \ 接受三个输入。\n\n1. 第一个输入是引用表。\n2. 此函数的第二个输入包含一个新旧名称列表。要重命名一列，可以向此输入中输入一个类似 `{\"新名称\"\
  , \"旧名称\"}` 的列表；但要重命名多列，则必须将相应的列表定义为 `{{\"新名称 2\", \"旧名称 2\"}, {\"新名称 1\", \"旧名称\
  \ 1\"}}`。\n3. 此输入为可选参数。如果引用表不包含第二个输入中提到的某个名称的列，则可通过输入 `MissingField.Error`（或数字 `0`）、`MissingField.Ignore`（或数字\
  \ `1`）和 `MissingField.UseNull`（或数字 `2`）来应用此参数。\n\n请考虑以下公式及其结果（表 8-61 和 8-62）：\n\n\
  `= Table.RenameColumns(TableC, {\"Product Name\", \"P_Name\"})`\n\n**表 8-61.** `Table.RenameColumns`\
  \ 的结果\n\n| **Row** | **Date** | **P_Name** | **Quantity** |\n| :--- | :--- | :---\
