  ## 第 2 章 数据类型


  ### Null


  在 Power Query 中，`null` 值用于表示缺失值，其定义为 `null`。可以对 `null` 值执行某些数学运算。假设变量 `x` 等于 `null`，`y`
  是非 `null` 值，各种数学运算及其结果如表 2-3 所示。


  **表 2-3.** 对 `null` 值的运算


  **公式** | **结果**

  --- | ---

  `x > y` | null

  `x >= y` | null

  `x < y` | null

  `x <= y` | null

  `x = y` | null

  `x <> y` | null

  `x ?? y` | `y`

  `y ?? x` | `y`


  ### 逻辑值


  逻辑值数据类型，符号为


  ，包含两种状态：


  `true` 或 `false`。为了比较此组中的值，可以将 `true` 视为等同于数字 `1`，将 `false` 视为等同于数字 `0`。


  通常，逻辑值是通过将一个值与另一个值进行比较（例如 `2>3`）或通过信息函数（如 `Number.IsOdd`）的输出获得的。


  ## 第 2 章 数据类型


  如果 `x` 和 `y` 等于逻辑值，则使用数学运算符以及逻辑运算符（包括 `and`、`or` 和 `not`），如 `x` and `y`、`x` or `y`
  和 `not x`，是对这些值的主要运算。


  ### 数字


  数字类型包含大量的数值（整数和小数）。除了数字之外，还有两个值，名为 `#infinity`（正数除以零得到）和 `#-infinity`（负数除以零得到），它们分别代表正无穷大（可能的最大数）和负无穷大（可能的最小数），也包含在此组数据中。




