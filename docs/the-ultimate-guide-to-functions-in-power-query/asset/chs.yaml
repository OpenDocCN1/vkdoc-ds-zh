  \ 表格\n\n#### Table.Join\n\n要合并表格（将一个表格的列作为新列添加到另一个表格），可以使用 `Table.Join`。为了匹配表格中的行，两个表格都应包含一个格式相同且值共有的公共列（例如产品\
  \ ID 或客户 ID）。此函数的用法如下：\n\n```\nTable.Join(\n   table1 as table,\n   key1 as any,\n\
  \   table2 as table,\n   key2 as any,\n   optional joinKind as nullable number,\n\
  \   optional joinAlgorithm as nullable number,\n   optional keyEqualityComparers\
  \ as nullable list\n) as table\n```\n\n根据函数语法，它接受以下输入：\n\n1.  第一个输入指定将要添加新列的参照表（表\
  \ A）。\n2.  第二个输入以文本值形式输入参照表中公共列的名称。\n3.  第三个输入输入第二个表（表 B）的名称，将从该表中提取值。\n4.  第四个输入输入第二个表中公共列的名称。\n\
  5.  第五个输入，即 `joinKind`，通过输入以下值之一来确定合并模式：\n    - `JoinKind.Inner`\n    - `JoinKind.LeftOuter`\n\
  \    - `JoinKind.RightOuter`\n    - `JoinKind.FullOuter`\n    - `JoinKind.LeftAnti`\n\
  \    - `JoinKind.RightAnti`\n6.  第六个输入是可选的，用于确定计算算法，可以是表 8-108 中的值之一。\n\n**表 8-108.**\
  \ *连接算法类型*\n\n| 算法 | 值 |\n| --- | --- |\n| `JoinAlgorithm.Dynamic` | |\n| `JoinAlgorithm.PairwiseHash`\
  \ | |\n| `JoinAlgorithm.SortMerge` | |\n| `JoinAlgorithm.LeftHash` | |\n| `JoinAlgorithm.RightHash`\
  \ | |\n| `JoinAlgorithm.LeftIndex` | |\n| `JoinAlgorithm.RightIndex` | |\n\n7. \
  \ 该函数的第七个输入也是可选的，通过输入以下值之一来确定比较标准：\n    - `Comparer.Equals`\n    - `Comparer.FromCulture`\n\
  \    - `Comparer.Ordinal`\n    - `Comparer.OrdinalIgnoreCase`\n\n例如，将 `TableP` 视为表\
  \ 8-109. 中所示。\n\n**表 8-109.** *TableP 的定义*\n\n| 日期 | 产品 | 数量 |\n| --- | --- | ---\
