  | 2/1/2023 | a | | |\n| 2/1/2023 | b | | |\n| 2/2/2023 | b | | |\n| 2/2/2023 | a\
  \ | | |\n| 2/3/2023 | C | | |\n| 2/4/2023 | b | | |\n| 2/4/2023 | a | | |\n| 2/6/2023\
  \ | C | | |\n\n`= Table.RenameColumns(TableC, {{\"Product Name\", \"P_Name\"}, {\"\
  Quantity\", \"Amount\"}})`\n\n**表 8-62.** `Table.RenameColumns` 的结果\n\n| **Row**\
  \ | **Date** | **P_Name** | **Amount** |\n| :--- | :--- | :--- | :--- |\n| 1/30/2023\
