  \ 接收四个输入。\n\n1. 第一个输入中，输入参考列表。\n2. 第二个输入中，输入要搜索其位置的值列表。\n3. 该函数的第三个输入是可选的，当搜索的值在参考列表中多次重复出现时使用。在此输入中，输入\
  \ `Occurrence.First` 表示函数返回第一次出现的位置，输入 `Occurrence.Last` 表示返回最后一次出现的位置。若要确定所有出现的位置，可以在该函数中使用\
  \ `Occurrence.All`。\n4. 该函数的第四个输入是可选的，允许你为值比较指定自定义条件。\n\n表 6-28 中提供了该函数的各种示例。\n\n\
  **第 6 章 列表函数**\n\n**表 6-28.** `List.PositionOfAny` 示例\n\n| 公式 | 结果 |\n| --- | ---\
  \ |\n| `= List.PositionOfAny({1..10},5)` | `4` |\n| `= List.PositionOfAny({4,5,3,5,2},5)`\
  \ | `1` |\n| `= List.PositionOfAny({4,5,3,5,2},{5,3},Occurrence.First)` | `1` |\n\
  | `= List.PositionOfAny({4,5,3,5,2},{3},Occurrence.Last)` | `3` |\n| `= List.PositionOfAny({4,5,3,5,2},{5,3},Occurrence.All)`\
  \ | `{1,2,3}` |\n| `= List.PositionOfAny({\"a\",\"b\",\"A\",\"A\"},{\"a\",\"A\"\
  })` | `0` |\n\n### 替换和转换值\n\nPower Query 中有些函数允许你用新值替换列表中的值。\n\n### `List.ReplaceValue`\n\
  \n使用 `List.ReplaceValue` 意味着可以将列表中的值替换为新值，如下所示：\n\n```\nList.ReplaceValue(\nlist\
  \ as list,\noldValue as any,\nnewValue as any,\nreplacer as function\n) as list\n\
  ```\n\n**第 6 章 列表函数**\n\n该函数接收四个输入。\n\n1. 第一个输入中输入参考列表。\n2. 第二个输入代表你想要用新值替换的旧值。\n\
  3. 第三个输入中输入新值。\n4. 该函数的第四个输入代表替换类型，其定义为一个函数。在此输入中，可以使用两种模式：`Replacer.ReplaceValue`\
  \ 和 `Replacer.ReplaceText`，分别用于替换数字和文本。\n\n根据函数说明，该函数在不同模式下的结果如表 6-29 所示。\n\n**表\
  \ 6-29.** `List.ReplaceValue` 示例\n\n| 公式 | 结果 |\n| --- | --- |\n| `= List.ReplaceValue({1..4},4,3,Replacer.ReplaceValue)`\
  \ | `{1,2,3,3}` |\n| `= List.ReplaceValue({1..4},4,3,Replacer.ReplaceText)` | `{1,2,3,4}`\
  \ |\n| `= List.ReplaceValue({\"a\",\"b\",\"B\"},\"b\",\"B\",Replacer.ReplaceText)`\
  \ | `{\"a\",\"B\",\"B\"}` |\n\n### `List.ReplaceMatchingItems`\n\n`List.ReplaceMatchingItems`\
  \ 类似于 `List.ReplaceItems`，但 `List.ReplaceItems` 只能将列表中的一个值替换为新值，而 `List.ReplaceMatchingItems`\
  \ 可用于将列表中的多个值替换为新值。该函数的定义如下：\n\n```\nList.ReplaceMatchingItems(\nlist as list,\n\
  replacements as list,\noptional equationCriteria as any\n) as list\n```\n\n**第 6\
  \ 章 列表函数**\n\n该函数接收三个输入。\n\n1. 第一个输入定义了参考列表。\n2. 第二个输入定义为一个列表的列表，其中每个内部列表包含两个值。第一个值表示旧值，第二个值表示新值。因此，要将列表中的\
  \ `1` 替换为 `-1`，并将 `4` 替换为 `-4`，此输入应定义为 `{{1,-1},{4,-4}}`。\n3. 该函数的第三个输入是可选的，允许你为值比较指定自定义条件。\n\
  \n根据函数说明，该函数在不同示例中的结果如表 6-30 所示。\n\n**表 6-30.** `List.ReplaceMatchingItems` 示例\n\
  \n| 公式 | 结果 |\n| --- | --- |\n| `= List.ReplaceMatchingItems({1..5},{{1,5}})` |\
  \ `{5,2,3,4,5}` |\n| `= List.ReplaceMatchingItems({1..5},{{1,5},{2,6}})` | `{5,6,3,4,5}`\
  \ |\n\n\n\n"
- '# 第 6 章 列表函数


  ## `List.ReplaceRange`


  若要基于位置（例如，从第 5 个到第 12 个值）用新值替换列表的一部分，可按如下方式使用 `List.ReplaceRange`：


  `List.ReplaceRange(`

  `list` as list,

  `index` as number,

  `count` as number,

  `replaceWith` as list

  `) as list`


  此函数接受四个输入。


  1. 第一个输入表示参考列表。

  2. 在此函数的第二个输入中，指定了从列表中删除值的起始位置。（编号从 0 开始）。

  3. 应在第三个输入中确定需要删除值的数量。

  4. 在第四个输入中，输入应替换已删除值的值列表。


  基于此函数的输入，表 6-31 中提供了该函数的多个示例。


  **表 6-31.** `List.ReplaceRange` 示例


  | 公式 | 结果 |

  | --- | --- |

  | `= List.ReplaceRange({1..10},3,6,{5})` | `{1,2,3,5,10}` |

  | `= List.ReplaceRange({1..10},0,6,{5})` | `{5,7,8,9,10}` |

  | `= List.ReplaceRange({1..10},1,8,{5,6})` | `{1,5,6,10}` |


  ---


  '
- '# 第 6 章 列表函数


  ## `List.Transform`


  `List.Transform` 可用于通过特定逻辑或运算更改列表中的值。例如，使用此函数，可以将所有值加 1，或乘 2，可以将英文字母转换为大写或小写，或者可以移除多余空格。该函数的定义如下：


  `List.Transform(`

  `list` as list,

  `transform` as function

  `) as list`


  此函数接收两个输入。


  1. 此函数的第一个输入定义了参考列表。

  2. 此函数的第二个输入采用函数形式，并确定转换逻辑。


  有多种方式定义第二个输入，但最简单的方法之一是在此输入的开头输入单词 `each`。然后，`_` 确定列表中的值，因此 `each _+2` 可用于将所有值加
  2，或 `each Number.Abs(_)` 可用于移除值的符号。


  另一种方式是，不提及 `each` 然后使用 `_` 表示列表中的值，而是可以在括号中使用一个特定变量（例如 `x`），然后在 `=>` 之后确定运算。因此，可以在第二个输入中使用
  `(x) => x+1` 以将列表中的所有值加 1。


  基于以上解释，表 6-32 中提供了该函数的各种示例。


  ---


  '
- '# 第 6 章 列表函数


  **表 6-32.** `List.Transform` 示例


  | 公式 | 结果 |

  | --- | --- |

  | `= List.Transform({1..5},each _+ 2)` | `{3,4,5,6,7}` |

  | `= List.Transform({1..5},each Number.Factorial(_))` | `{1,2,6,24,120}` |

  | `= List.Transform({1..5},each Number.Round(Number.Exp(_)))` | `{3,7,20,55,148}`
  |

  | `= List.Transform({"abc","DEF","mNg"}, each Text.Proper(_))` | `{"abc","Def","Mng"}`
  |


