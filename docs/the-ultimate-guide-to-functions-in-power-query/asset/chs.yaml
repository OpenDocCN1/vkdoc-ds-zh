  \   TableC,\n   {\"Product Name\",\"Row\",\"Quantity\"}\n)\n```\n\n### 第 8 章 表格\n\
  \n**表 8-67.** `Table.SelectColumns` 的结果\n\n| 产品名称 | 行号 | 数量 |\n|---------|-----|------|\n\
