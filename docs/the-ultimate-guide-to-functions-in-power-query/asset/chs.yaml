- "# 第 6 章 列表函数\n\n在以下公式中，参考列表（`x`）是 `{1,2,3}`，并且基于第二个输入中定义的函数，第二个列表（`y`）是 `{2,4,6}`。\n\
  \n考虑到这两个列表，公式的结果是 `{\"1-2\",\"2-4\",\"3-6\"}`。\n\n```\n= List.TransformMany(\n \
  \ {1,2,3},\n  (x) => {2*x},\n  (x,y) => (Text.From(x) & \"-\" & Text.From(y))\n\
  )\n```\n\n---\n\n### 其他函数\n\n除上述函数外，Power Query 中还有其他用于修改列表的函数。\n\n### `List.Single`\n\
  \n\n\n该函数接收一个列表形式的输入。如果列表中只有一个值，则将该值作为输出显示。否则，该函数的结果将是一个错误。该函数的定义如下：\n\n`List.Single(**list**\
  \ as list) as any`\n\n因此，公式 `List.Single({1})` 的结果是数字 `1`，而公式 `List.Single({1..4})`\
  \ 的结果是一个错误。同样，公式 `List.Single({ })` 的结果是 `null`。\n\n### `List.SingleOrDefault`\n\
  \n此函数类似于 `List.Single` 函数，但在本函数中，可以指定一个值作为输出显示，以替代错误。\n\n该函数在 Power Query 中的定义如下：\n\
  \n```\nList.SingleOrDefault(\n   **list** as list,\n   optional **default** as any\n\
  ) as any\n```\n\n此函数接收两个输入。\n\n1.  第一个输入定义了参考列表。\n2.  此函数的第二个输入是可选的，如果函数的结果是错误，则在此输入中输入的值将替代错误显示。\n\
  \n因此，公式 `List.SingleOrDefault({1})` 的结果等于数字 `1`，公式 `List.SingleOrDefault({1..4})`\
  \ 的结果是一个错误，但公式 `List.SingleOrDefault({1..4}, -1)` 的结果等于 `-1`。\n\n### `List.Repeat`\n\
  \n使用 `List.Repeat`，可以按照指定的次数重复列表中的值，如下所示：\n\n```\nList.Repeat(\n   **list** as list,\n\
  \   **count** as number\n) as list\n```\n\n此函数接收两个输入。\n\n1.  第一个输入表示参考列表。\n2.  列表中的值重复的次数由此输入决定。\n\
  \n根据函数说明，此函数在不同条件下的结果如表 6-33 所示。\n\n***表 6-33.** `List.Repeat` 示例*\n\n| 公式 | 结果\
  \ |\n| :--- | :--- |\n| `=List.Repeat({1,2},2)` | `{1,2,1,2}` |\n| `=List.Repeat({1..3},2)`\
  \ | `{1,2,3,1,2,3}` |\n| `=List.Repeat({1,2},3)` | `{1,2,1,2,1,2}` |\n\n### `List.Split`\n\
  \n通过使用具有以下语法的此函数，可以将一个大列表转换为多个较小的列表：\n\n```\nList.Split(\n   **list** as list,\n\
  \   **pageSize** as number\n) as list\n```\n\n此函数接收两个输入。\n\n1.  第一个输入定义了参考列表。\n\
  2.  第二个输入决定了子集列表的长度。例如，在此输入中输入 `2`，参考列表将被分割成多个长度为 `2` 的列表。\n\n根据函数说明，此函数的结果通过表 6-34\
  \ 中的几个示例提供。\n\n***表 6-34.** `List.Split` 示例*\n\n| 公式 | 结果 |\n| :--- | :--- |\n|\
  \ `=List.Split({1..5},2)` | `{{1,2},{3,4},{5}}` |\n| `=List.Split({1..5},3)` | `{{1,2,3},{4,5}}`\
  \ |\n| `=List.Split({1..5},4)` | `{{1,2,3,4},{5}}` |\n\n### 总结\n\n在本章中，你开始探索 Power\
  \ Query 中多功能且动态的列表函数世界。列表作为数据点的集合，在理解数据关系和依赖关系方面扮演着关键角色，掌握其操作技巧为复杂的数据转换打开了大门。\n\n\
  你的旅程始于理解列表的基本性质、其有序结构以及容纳异构数据类型的能力。你学习了如何手动创建列表以及通过计算表达式动态生成列表，这为高级列表操作奠定了基础。\n\n\
  随着深入探索，你发现了 Power Query 提供的列表函数的强大功能。这些函数使你能够重塑数据集合，从过滤和排序元素到合并列表以创建内聚的数据结构。这种多功能性使你能够精确地应对复杂的数据处理挑战。\n\
  \n此外，你还探索了嵌套列表的领域，其中列表内的列表创建了反映现实世界关系的层次结构。在处理多维数据结构并应对其复杂性时，这项技能非常宝贵。\n\n你此次旅程的核心是聚合和汇总的概念。你发现了列表函数将广泛数据集提炼为简洁洞察的潜力。计算总计、平均值和识别趋势的技术使你能够从海量数据点中提取有意义的信息。\n\
  \n在下一章中，你将熟悉与修改记录相关的函数，包括从记录中提取特定值、合并列表以及修改记录属性。\n\n## 第 7 章 - 记录\n\n在数据操作的交响乐中，零散的信息片段常常和谐地奏出更完整的旋律。记录就是这样一种多功能且动态的数据结构，它允许我们封装并理解实体各属性之间的相互作用。本章深入探讨\
  \ Power Query 中的记录函数世界，通过利用结构化关系的力量，揭示将原始数据转化为有意义见解的艺术。\n\n本章的旅程从记录的基础探索开始：它们的结构、属性以及容纳混合数据类型的能力。有了这种理解，你将深入记录的创建领域，学习如何手动以及通过计算表达式来构建这些动态容器。\n\
  \n### 定义记录\n\n记录是一组值，每个值都有一个特定的标题，并且每个标题只能输入一个值。为简单起见，可以将记录视为表中的一行。要定义记录，需要首先提及标题（类似于表中的列标题），然后在\
  \ `[ ]` 之间显示一个等号及其值，如下所示以及图 7-1 中所示：\n\n`=[A=123,B=81,C=\"XYZ\"]`\n\n**图 7-1.**\
  \ 在 Power Query 中定义记录\n\n在记录中，一个字段的值可以基于其他字段计算。因此，使用记录，可以通过定义变量在多步中执行高级计算。请考虑以下示例以及图\
  \ 7-2：\n\n`= [A=5,B=A+3,C=A+B]`\n\n**图 7-2.** 定义记录\n\n记录的每个字段可以是一个值、一个列表、另一个记录或一个表。在以下公式和图\
  \ 7-3 中，字段 `A` 等于一个数字，字段 `B` 和 `D` 是列表，字段 `C` 本身等于另一个记录：\n\n`= [A=5,B={1..3},C=[A=1,B=3],D={2}]`\n\
  \n**图 7-3.** 包含另一个记录的记录\n\n如前所述，记录可以看作是表中的一行，因此通过包含表名以及 `{ }` 内所需的行号，结果是一个记录，其字段标题与表中的列标题相同，字段值等于所选行的值。例如，考虑表\
  \ 7-1 中所示的 `TableA`。\n\n***表 7-1.** `TableA`*\n\n| 产品 | 价格 | 材料 |\n| :--- | :---\
  \ | :--- |\n| W11 | 100 | 金属 |\n| s06 | 150 | 木材 |\n| r08 | 125 | 玻璃 |\n\n`TableA{0}`\
  \ 的值等于以下记录：\n\n`[Product=\"W11\", Price=100, Material=\"Metal\"]`\n\n`TableA{2}`\
  \ 的值等于以下记录：\n\n`[Product=\"R08\", Price=125, Material=\"Glass\"]`\n\n由于记录的性质，在 Power\
  \ Query 中不能使用运算符执行数学运算（加法、乘法、除法和减法），但可以使用 `&` 运算符合并两个记录。\n\n\n\n"
- "# 记录操作\n\n在此情况下，如果两个记录具有相同字段，则最后一条记录中该字段的值将作为该字段的结果显示，而不同的字段将在输出中并排显示。因此，以下公式的结果为`[A=2,\
  \ B=3, C=4]`。参见图 7-4。\n\n```\n= [A=5,B=3]&[A=2,C=4]\n```\n\n![图 7-4 插图](img/index-181_1.jpg)\n\
  \n**图 7-4.** 记录的合并\n\n除了合并记录外，Power Query 中还有其他修改记录的函数，本节未全部介绍。\n\n### 记录属性\n\n\
  要提取记录中的字段数量及其名称和值，可使用以下函数。\n\n### `Record.FieldCount`\n\n要计算记录中的字段数量，使用`Record.FieldCount`如下：\n\
  \n```\nRecord.FieldCount(record as record) as number\n```\n\n该函数的结果始终是一个数字，显示输入记录中的字段数量。因此，以下公式的结果等于\
  \ 1：\n\n```\n= Record.FieldCount([A=5])\n```\n\n以下公式的结果等于 2：\n\n```\n= Record.FieldCount([A=5,b=2])\n\
  ```\n\n以下公式的结果等于 4：\n\n```\n= Record.FieldCount([A=5,B={1..3},C=[A=1,B=3],D={2}])\n\
  ```\n\n### `Record.FieldNames`\n\n`Record.FieldNames`用于提取记录中的字段标题，如下所示：\n\n```\n\
  Record.FieldNames(record as record) as list\n```\n\n此函数接收一个记录作为输入，并返回其字段名称列表作为输出。因此，以下公式的结果为`{\"\
  A\", \"B\"}`：\n\n```\n= Record.FieldNames([A=5,B=2])\n```\n\n以下公式的结果为`{\"Name\"\
  , \"Family\"}`：\n\n```\n= Record.FieldNames([Name=\"Omid\",Family=\"Motamedi\"])\n\
  ```\n\n### `Record.FieldValues`\n\n`Record.FieldValues`类似于`Record.FieldNames`，但它返回的是引用记录中的值，而非标题。其定义如下：\n\
  \n```\nRecord.FieldValues(record as record) as list\n```\n\n此函数接收一个记录作为输入，其结果等于一个值列表。因此，以下公式的结果等于`{5,2}`：\n\
  \n```\n= Record.FieldValues([A=5,B=2])\n```\n\n以下公式的结果等于`{\"Omid\", \"Motamedi\"\
  }`：\n\n```\n= Record.FieldValues([Name=\"Omid\",Family=\"Motamedi\"])\n```\n\n###\
  \ `Record.ToList`\n\n`Record.ToList`用于将记录转换为列表，如下所示。此函数接收一个记录类型的输入，并输出其字段值作为列表。\n\
  \n```\nRecord.ToList(record as record) as list\n```\n\n使用此函数的不同示例如表 7-2 所示。\n\n\
  **表 7-2.** `Record.ToList` 示例\n\n| 公式 | 结果 |\n|------|------|\n| `= Record.ToList([A=5,B=2,C=10])`\
  \ | `{5,2,10}` |\n| `= Record.ToList([A=5,B={1..3},C=10])` | `{5,{1,2,3},10}` |\n\
  \n### `Record.Field`\n\n`Record.Field`用于提取记录中某个字段的值，如下所示：\n\n```\nRecord.Field(\n\
  \    record as record,\n    field as text\n) as any\n```\n\n此函数接收两个输入：\n\n1. 第一个输入是引用记录。\n\
  2. 第二个输入以文本形式指定所需字段的名称。\n\n根据函数说明，以下公式的结果等于 5：\n\n```\n= Record.Field([A=5,B=2],\"\
  A\")\n```\n\n以下公式的结果等于 Omid：\n\n```\n= Record.Field([Name=\"Omid\",Family=\"Motamedi\"\
  ],\"Name\")\n```\n\n但由于以下公式中定义的记录不包含字段 C，其结果会报错，如图 7-5 所示：\n\n```\n= Record.Field([A=5,B=2],\"\
  C\")\n```\n\n**图 7-5.** 计算错误\n\n### `Record.FieldOrDefault`\n\n此函数在 Power Query\
  \ 中的定义如下：\n\n```\nRecord.FieldOrDefault(\n    record as nullable record,\n    field\
  \ as text,\n    optional defaultValue as any\n)\n```\n\n此函数类似于`Record.Field`。区别在于，使用此函数时，用户可以在第三个输入中定义一个值，如果引用记录不包含第二个输入中定义的字段，则显示该值而不是错误。\n\
  \n\n\n因此，在以下示例中，由于定义的记录不包含字段 C，以下公式的结果将是一个错误：\n\n```\n= Record.Field([A=5,B=2],\"\
  C\")\n```\n\n而以下公式的结果等于 null：\n\n```\n= Record.FieldOrDefault([A=5,B=2],\"C\")\n\
  ```\n\n并且以下公式的输出值等于 -1：\n\n```\n= Record.FieldOrDefault([A=5,B=2],\"C\",-1)\n```\n\
  \n## `Record.HasFields`\n\n要检查记录是否包含特定字段，可以按如下方式使用 `Record.HasFields`：\n\n```\n\
  Record.HasFields(\n  record as record,\n  fields as any\n) as logical\n```\n\n此函数接收两个输入，如果引用记录包含第二个输入中定义的所有字段，则其输出始终为\
  \ `true`；如果定义的记录不包含第二个输入中输入的至少一个字段名，则其输出为 `false`。\n\n1. 第一个输入是引用记录。\n2. 第二个输入中输入字段名称列表。要搜索单个字段，其名称可以直接以文本格式输入，但要搜索多个字段，则应以列表形式输入其名称。\n\
  \n表 7-3 展示了此函数的不同应用。\n\n***表 7-3.** Record.HasFields 示例*\n\n| 公式 | 结果 |\n| --- |\
  \ --- |\n| `= Record.HasFields([A=5,B=2,C={1..4}],\"C\")` | `true` |\n| `= Record.HasFields([A=5,B=2,C={1..4}],\"\
  D\")` | `false` |\n| `= Record.HasFields([A=5,B=2,C={1..4}],{\"A\",\"C\"})` | `true`\
  \ |\n| `= Record.HasFields([A=5,B=2,C={1..4}],{\"A\",\"D\"})` | `false` |\n\n###\
  \ 记录修正\n\n本节将介绍用于修改记录的函数。\n\n### `Record.AddField`\n\n要向引用记录添加字段，可以使用具有以下语法的 `Record.AddField`：\n\
  \n```\nRecord.AddField(\n  record as record,\n  fieldName as text,\n  value as any,\n\
  \  optional delayed as nullable logical\n) as record\n```\n\n此函数接收以下四个输入：\n\n1.\
  \ 第一个输入中输入引用记录。\n2. 第二个输入中以文本格式输入新字段的名称。\n3. 第三个输入中输入新字段的值。\n4. 此函数的第四个输入是可选的，以\
  \ `true` 或 `false` 形式输入。\n\n根据函数说明，要向包含名为 A 和 B 的两个字段的记录中添加一个名为 C 且值为 10 的新字段，可以使用以下公式：\n\
  \n```\n= Record.AddField([A=5,B=2],\"C\",10)\n```\n\n在这种情况下，结果是一个包含所有字段（A、B 和 C）的记录，即\
  \ `[A=5,B=2,C=10]`。\n\n### `Record.Combine`\n\n要同时向一个记录添加多个字段，或者将多个记录合并在一起，可以按如下方式使用\
  \ `Record.Combine`：\n\n```\nRecord.Combine(records as list) as record\n```\n\n要合并多个记录，应将这些记录全部放入一个列表中，作为此函数的第一个输入。在这种情况下，结果等于合并所有记录后得到的记录。\n\
  \n例如，要合并两个记录，可以使用以下公式，结果得到 `[A=5,B=2,C=10]`：\n\n```\n= Record.Combine({[A=5,B=2],[C=10]})\n\
  ```\n\n类似地，以下公式的结果等于 `[A=5,B=2,C=10,D=2*C,E=1]`：\n\n```\n= Record.Combine({[A=5,B=2],[C=10,D=2*C,E=1]})\n\
  ```\n\n### `Record.SelectFields`\n\n`Record.SelectFields` 用于提取引用记录的子集，用法如下：\n\n\
  ```\nRecord.SelectFields(\n  record as record,\n  fields as any,\n  optional missingField\
  \ as nullable number\n) as record\n```\n\n此函数接收以下三个输入：\n\n1. 第一个输入定义了引用记录。\n2. 第二个输入是您正在查找其值的字段列表。\n\
  3. 此输入是可选的，当引用列表不包含第二个输入中提到的至少一个字段名时使用。在此输入中输入数字 `0` 将导致错误。输入数字 `1` 将得到一个记录，其中缺失的字段已被移除。输入数字\
  \ `2` 时，不匹配的字段会显示在输出中，但其值为 `null`。\n\n根据以上解释，以下公式的结果等于 `[A=5,C=10]`：\n\n```\n= Record.SelectFields([A=5,B=2,C=10],\
  \ {\"A\",\"C\"})\n```\n\n\n\n"
