  \ URL，或从长篇叙述中提取日期。\n\n\n\n### 文本函数\n\n随着深入探索，你将发现文本函数在清洗和标准化数据方面的潜力。从删除多余空格和标点符号，到转换大小写格式，这些操作是进行一致且可靠的文本分析的基础。\n\
  \n这些函数分为以下五组：\n\n- 提取文本的一部分\n- 删除、替换和组合文本\n- 文本修正\n- 在参考文本中搜索字符\n- 文本转换\n\n© Omid\
