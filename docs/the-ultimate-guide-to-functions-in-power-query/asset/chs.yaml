- "# 第 1 章 Power Query 简介\n\n随着你深入学习，你将掌握数据转换的精髓。\n\n`Power Query` 使你能够根据需要塑造数据，从清理、合并到筛选和聚合。这些转换构成了深入分析的基石，将数据从一团谜题转变为清晰的图景。\n\
  \n此外，`Power Query` 充当着不同数据源之间的桥梁。无论你是处理 Excel 工作表、数据库、Web API 还是 CSV 文件，`Power Query`\
  \ 都提供了一个统一的界面来访问、转换和整合这些数据源，形成连贯的叙述。\n\n那么，让我们一同踏上这段穿越 `Power Query` 世界的旅程吧。\n\n\
  当你阅读完后续章节后，你将掌握将 `Power Query` 作为变革性工具的能力，超越数据挑战，揭示出能让你做出更好、更明智决策的洞察。\n\n## Power\
  \ Query 简介\n\n`Power Query` 是一个在 Excel 和 Power BI 中精炼和清理数据的强大工具。它涵盖了 ETL（提取、转换、加载）的三个主要任务：提取、清理和加载表格。这些任务包括：\n\
  \n-   从各种数据库中提取数据，包括\n    SQL、Access、Microsoft Azure，以及其他来源，如\n    网站、Excel 文件、文本文件等\n\
  -   通过移除多余列、更改\n    值格式、添加新列、合并表等操作来清理数据\n-   加载数据（到 Excel、Power Pivot 或 Power BI）\n\
  \n该工具最初作为 Excel 2010 及后续 2013 版本的加载项引入。\n\n在这些版本中，通过安装加载项，Excel 中会新增一个名为 `Power\
  \ Query` 的选项卡，如图 1-1 和 1-2 所示。\n\n![Figure 1-1](img/index-24_1.jpg)\n![Figure 1-2](img/index-24_2.jpg)\n\
  ![Figure 1-3](img/index-24_3.jpg)\n![Figure 1-4](img/index-24_4.jpg)\n\n**图 1-1.**\
  \ *Excel 2010 中的 Power Query 选项卡*\n\n**图 1-2.** *Excel 2013 中的 Power Query 选项卡*\n\
  \n在 Excel 2016 及更高版本中，此工具被添加到了 `数据` 选项卡下的 Excel 主命令中。在 Excel 2021 以及 365 中，与 `Power\
  \ Query` 相关的命令位于 `数据` 选项卡下的 `获取和转换数据` 组中，用户可以使用这些命令执行数据提取、修改和加载过程（图 1-3）。\n\n**图\
  \ 1-3.** *Excel 365 中的 Power Query*\n\n在 Power BI 中，与 `Power Query` 相关的命令位于 `主页`\
  \ 选项卡的 `数据` 部分，如图 1-4 所示。\n\n**图 1-4.** *Power BI 中的 Power Query*\n\n![Figure 1-5](img/index-25_1.jpg)\n\
  \n## Excel 中的 Power Query\n\n在 Excel 中，要从其他 Excel 文件等不同来源提取值，只需选择 `数据` 选项卡 `获取和转换数据`\
  \ 部分中的 `获取数据` 命令（图 1-5）。\n\n**图 1-5.** *从 Excel 文件中提取数据*\n\n![Figure 1-6](img/index-26_1.jpg)\n\
  \n如图 1-5 所示，提供了从不同数据源提取表格的各种选项。要从另一个 Excel 文件提取值，请选择 `来自文件`，然后选择 `来自 Excel 工作簿`。将出现如图\
  \ 1-6 所示的窗口，你可以在此浏览并选择所需的 Excel 文件。\n\n**图 1-6.** *指定 Excel 文件*\n\n通过指定所需的 Excel\
  \ 文件（在此示例中为 `06-Inventory.xlsx`）并单击 `打开`，将打开一个新窗口，如图 1-7 所示。\n\n![Figure 1-7](img/index-27_1.jpg)\n\
  \n**图 1-7.** *表选择窗口*\n\n你将在该窗口的左侧看到所选 Excel 文件中所有表格和工作表的列表。根据用户需求，可以选择一个或多个表格并在\
  \ `Power Query` 中调用以进行清理过程。在此示例中，通过选择 `05-Inventory` 表并单击 `转换数据` 按钮，数据将被加载到 `Power\
  \ Query` 中，如图 1-8 所示。（至此，数据提取过程完成。）\n\n![Figure 1-8 (a)](img/index-28_1.jpg)\n![Figure\
  \ 1-8 (b)](img/index-28_2.png)\n\n**图 1-8.** *在 Power Query 中提取数据*\n\n现在，你可以通过各种命令执行清理过程。例如，要移除表的第一行（空行），只需从\
  \ `主页` 选项卡的 `减少行` 部分中选择 `删除前几行` 命令。将出现如图 1-9 所示的窗口，用于确定要从表顶部移除的行数。\n\n**图 1-9.**\
