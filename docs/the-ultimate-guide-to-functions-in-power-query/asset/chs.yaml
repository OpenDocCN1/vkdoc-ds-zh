  Name\",\"Family\",\"Age\"})` 的结果如表 8-101 所示。\n\n***表 8-101.** Table.Transpose 的结果*\n\
  \n| **Name** | **Family** | **Age** |\n| --- | --- | --- |\n| 名字 | 姓氏 | 年龄 |\n|\
  \ 莎拉 | 萨尼 | |\n| 奥米德 | 莫塔梅迪 | |\n| 穆罕默德 | 阿贝德 | |\n\n**第 8 章 表格**\n\n### 合并表格\n\n\
  合并表格有两种方法。第一种方法称为追加，即将两个表格的值上下堆叠放置。\n\n例如，表一是 2019 年的销售额值，表二是 2020 年的销售额值。通过追加这两个表，会创建一个包含\
  \ 2019 年和 2020 年两年销售额值的新表。\n\n然而，有时需要将表 A 某一列的值提取出来，并显示在表 B 的新列中。例如，如果产品价格的值在表 A\
  \ 中，而表 B 包含历史销量，为了计算以美元计的总销售额，就需要从表 A 中调取价格并显示在表 B 中。这种合并表格的方法（最终会在引用表中添加新列）称为合并。\n\
  \n本节将讨论与这两种表格合并方法相关的函数。\n\n#### Table.Combine\n\n`Table.Combine` 用于在 Power Query\
  \ 中追加两个或多个表，语法如下：\n\n`Table.Combine(\n**tables** as list,\noptional **columns**\
  \ as any\n) as table`\n\n**第 8 章 表格**\n\n该函数接收两个输入。\n\n1.  第一个输入中，将你想要追加的表作为列表的各个值提及。\n\
  2.  在该函数的第二个输入中，定义了你希望在输出表中显示的列名列表。此输入是可选的；如果未输入任何值，表中所有列（共有列和非共有列）都会在输出中显示。\n\n\
  在本例中，考虑 `TableH`、`TableI` 和 `TableJ`（分别如表 8-102、8-103 和 8-104 所示）。\n\n***表 8-102.**\
