  \ 日 | C | |\n\n## `Table.SelectColumns`\n\n为了移除表中大部分列，可以不使用 `Table.RemoveColumn`\
  \ 逐一指定要删除的列名，而是使用语法如下的 `Table.SelectColumns`。在这种情况下，应在第二个输入中指定希望在输出中显示的列名。\n\n```\n\
  Table.SelectColumns(\n   table as table,\n   columns as any,\n   optional missingField\
  \ as nullable number\n) as table\n```\n\n### 第 8 章 表格\n\n该函数接收三个输入。\n\n1.  第一个输入中输入引用表。\n\
  2.  第二个输入中输入要选择的列名。若要查找某一列，可在此输入中直接输入列名；但若要查找多列，则需要以列表形式输入列名。\n3.  此输入为可选，用于设置当第二个输入中输入的列名在引用表的列标题中不存在时的处理方式。此输入为可选，包含三种状态：`MissingField.Error`（或数字\
  \ 0）、`MissingField.Ignore`（或数字 1）和 `MissingField.UseNull`（或数字 2）。\n\n根据函数说明，该函数不同状态下的结果如表\
  \ 8-66 所示：\n\n```\n= Table.SelectColumns(TableC,\"Date\")\n```\n\n### 第 8 章 表格\n\
  \n**表 8-66.** `Table.SelectColumns` 的结果\n\n| 日期 |\n|------|\n| 2023 年 1 月 30 日 |\n\
