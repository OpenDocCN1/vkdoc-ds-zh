  ..\"z\"},\"M\")` | `{ }` |\n| `= List.FindText({\"abc\",\"bcf\",\"deg\",\"z\"},\"\
  b\")` | `{\"abc\",\"bcf\"}` |\n\n### 移除列表中的值\n\n在 Power Query 中，有许多用于从列表中移除值的函数，本节将对这些函数进行介绍。\n\
