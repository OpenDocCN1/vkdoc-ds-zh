  ## `List.Select`\n\n`List.Select` 是 Power Query 中最重要且最强大的函数之一，用于根据自定义条件从列表中提取值，其语法如下：\n\
  \n```\nList.Select(\n    list as list,\n    selection as function\n) as list\n```\n\
  \n该函数接收两个输入，其输出始终是一个列表。\n\n1.  第一个输入是参考列表。\n2.  第二个输入以一个函数的形式定义从参考列表中选择值的条件。该输入可以定义多种场景，下面将进行讨论。\n\
  \n让我们从一个示例开始。在公式 `List.Select({1..10}, each _>5)` 中，参考列表是一个从 1 到 10 的数字列表，条件定义为\
  \ `each _>5`，这意味着应提取参考列表中大于 5 的数字并在输出中显示。\n\n因此，此公式的结果等于列表 `{6,7,8,9,10}`。\n\n该函数的不同示例如表\
  \ 6-14 所示。\n\n***表 6-14.** `List.Select` 示例*\n\n| 函数 | 结果 |\n|---|---|\n| `=List.Select({1..10},each\
  \ _>5)` | `{6,7,8,9,10}` |\n| `=List.Select({1..10},each _>5 and _<8)` | `{6,7}`\
  \ |\n| `=List.Select({1..10},each Number.IsOdd(_))` | `{1,3,5,7,9}` |\n| `=List.Select({1..10},each\
  \ Number.Mod(_,3)=0)` | `{3,6,9}` |\n| `=List.Select({1,\"a\",3,\"x\",\"n\"},each\
  \ Value.Is(_,type number))` | `{1,3}` |\n\n在前面的示例中，条件 `each Number.IsOdd(_)` 表示只应从参考列表中提取奇数，条件\
  \ `each Number.Mod(_,3)=0` 表示只应从列表中提取 3 的倍数，最后，条件 `each Value.Is(_,type number)`\
  \ 表示只应从参考列表中提取数字类型的值。\n\n## `List.FindText`\n\n要从列表中提取包含特定字符或文本的文本值，可以使用以下语法的 `List.FindText`：\n\
  \n```\nList.FindText(\n```\n\n好的，作为一名高级文档工程师和翻译员，我将严格按照您提供的注意事项和示例，将给定的英文文本翻译成中文。\n\
  \n\n"
- "# 第 6 章 列表函数\n\n`**list** as list`,\n\n`**text** as text`\n\n) as list\n\n此函数包含两个输入：\n\
