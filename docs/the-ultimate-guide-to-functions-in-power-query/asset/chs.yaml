  ```


  ## `Text.Split`


  `Text.Split` 用于基于分隔符将参考文本分割成多个文本。例如，可以通过此函数将“X-12-M81”分割成 `{"X", "12", "M81"}`（在本例中，分隔符是“-”）：


  ```

  Text.Split(

  text as text,

  separator as text

  ) as list

  ```


  该函数接收以下两个参数，并返回一个由分割后的文本组成的列表：


  1.  第一个参数中输入参考文本。

  2.  第二个参数表示作为分割文本的分隔符的字符或字符序列。在此输入中输入“-”意味着参考文本中“-”之后的部分应该被分割。


  此函数的各种示例如下 `表 [4-7]` 所示。


