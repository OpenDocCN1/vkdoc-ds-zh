  \ list) as list`\n\n此函数仅接受一个列表形式的输入，在移除该列表中的空值后，结果将显示在输出中。\n\n根据以上说明，以下公式的结果等于 `{1,2,\"\
  \",3,\"null\"}`：\n\n`= List.RemoveNulls({1,null,2,null,\"\",3,\"null\"})`\n\n如您所见，此公式的输出也包含了值\
  \ `\"null\"`，因为单词 `null` 被输入在双引号内，视为文本值，此函数不会将其视为空值。\n\n### `List.Distinct`\n\n\
  `List.Distinct` 用于移除列表中的重复值，其结果始终是一个包含唯一值的列表。\n\n`List.Distinct(`\n\n`**list** as\
