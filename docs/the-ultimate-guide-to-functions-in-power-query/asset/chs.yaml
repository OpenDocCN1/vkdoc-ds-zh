  O. Motamedisedeh, *《Power Query 函数终极指南》*,


  [`doi.org/10.1007/978-1-4842-9754-4_2`](https://doi.org/10.1007/978-1-4842-9754-4_2#DOI)


  ## 第 2 章 数据类型


  **表 2-1.** `Text.Start` 示例


  **公式** | **结果**

  --- | ---

  `=Text.Start("Hello",3)` | `"Hel"`

  `=Text.Start("1232",2)` | `"12"`

  `=Text.Start(1232,2)` | 错误


  因此，了解数据的格式以及如何在不同数据格式之间进行转换非常重要。表 2-2 显示了 Power Query 中的数据类型及其定义。


  **表 2-2.** Power Query 数据类型


  **定义** | **数据类型**

  --- | ---

  null | `Null`

  true/false | `Logical`

  0 1 -1 1.5 2.3e-5 | `Number`

  `#time(09,15,00)` | `Time`

  `#date(2013,02,26)` | `Date`

  `#datetime(2013,02,26, 09,15,00)` | `DateTime`

  `#datetimezone(2013,02,26, 09,15,00, 09,00)` | `DateTimeZone`

  `#duration(0,1,30,0)` | `Duration`

  "hello" | `Text`

  `#binary("AQID")` | `Binary`

  `{1, 2, 3}` | `List`

  `[ A = 1, B = 2 ]` | `Record`

  `#table({"X","Y"},{{0,1},{1,0}})` | `Table`

  `(x) => x + 1` | `Function`

  `type { number } type table [ A = any, B = text ]` | `Type`


