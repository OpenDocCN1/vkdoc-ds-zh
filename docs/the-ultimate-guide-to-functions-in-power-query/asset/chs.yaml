  | 2/1/2023 | b | | |\n| 2/2/2023 | b | | |\n| 2/2/2023 | a | | |\n| 2/3/2023 | C\
  \ | | |\n| 2/4/2023 | b | | |\n| 2/4/2023 | a | | |\n| 2/6/2023 | C | | |\n\n###\
  \ 修改列\n\nPower Query 中有几个用于修改列的函数，包括添加、删除或重新排序列，本节将对此进行描述。为简化示例，本部分示例中均使用 `TableC`。\n\
  \n### `Table.RemoveColumns`\n\n使用 `Table.RemoveColumns` 可以删除表中的多余列，如下所示：\n\n```\n\
  Table.RemoveColumns(\n   table as table,\n   columns as any,\n   optional missingField\
  \ as nullable number\n) as table\n```\n\n此函数接收三个输入。\n\n1. 第一个输入指定引用表。\n2. 此输入决定了应删除的列的名称。要删除一列，可以将该列名称直接作为文本插入此输入中；但要删除多列，则可以将它们的名称输入到一个列表中。\n\
  3. 此输入为可选参数，适用于引用表不包含第二个输入中提到的名称的列的情况。此输入可使用 `MissingField.Error`（或数字 `0`）、`MissingField.Ignore`（或数字\
  \ `1`）和 `MissingField.UseNull`（或数字 `2`）这三个不同的值。\n\n基于此说明，`= Table.RemoveColumns(TableC,\
  \ \"Row\")` 的结果等同于表 8-63。\n\n**表 8-63.** `Table.RemoveColumns` 的结果\n\n| **Date**\
