  \ 7-9。\n\n\n\n### 排版后内容\n\n**图 7-9.** 将记录转换为表格\n\n**总结**\n\n本章全面探讨了 Power Query\
  \ 中的记录函数，深入剖析了如何利用结构化关系的力量，将原始数据转化为有意义的见解。\n\n旅程始于对记录作为动态数据结构的基础理解。你了解到它们能够封装实体的各种属性，类似于为数据表示创建多维画布。通过这一过程，你掌握了手动创建记录以及通过计算表达式生成记录的方法。\n\
  \n当你揭示记录函数在数据转换和丰富方面的能力时，其真正精髓得以显现。你探索了多种函数，这些函数使你能够剖析、合并和重塑记录。从筛选属性、提取值，到合并记录以创建完整的数据快照，你学会了精确地塑造数据。\n\
  \n在下一章中，你将通过学习与表相关的函数来继续你的旅程，因为表是 Power Query 中最重要的数据类型。你将学习如何合并多个独立表格中的值，以及如何追加或修改单个表格。\n\
  \n## 第 8 章：表\n\n在数据探索与分析的广阔领域中，表是结构与连贯性的基石。它们将混乱的数据组织起来，提供上下文，并通过以逻辑且易于理解的格式呈现数据来促进洞察。欢迎来到本章，我们将深入探讨\
  \ Power Query 中的表函数世界，引导你掌握将原始信息转化为有序、可操作知识的艺术。\n\n表是数据故事展开的画布。想象一下，客户订单被整齐分类、项目任务被细致追踪，或是调查回复被整理以待分析。在一个数据点分散的世界中，表是将信息凝聚在一起的粘合剂，促进无缝的探索与理解。\n\
  \n你对本章的探索始于对表的基本理解：它们的结构、列和行数据。你将了解 Power Query 如何将表视为能够容纳多种数据类型和关系的动态结构。掌握了这些知识后，你将踏上手动创建和通过计算表达式创建表的旅程。\n\
  \n然而，表并非静态实体；它们是通往转换与启发的路径。探索 Power Query 提供的众多表函数，这些函数使你能够精确地筛选、排序、重塑和聚合数据。从删除列到筛选行，这些函数使你能够创建符合分析目标的表。\n\
