- '# 第 2 章 数据类型




  与其他软件一样，Power Query 支持不同的数据类型（格式），并提供了大量根据类型修改值的函数。Power Query 支持简单的数据类型，如数字、文本和时间/日期，也支持复杂的数据类型，如列表、表格和二进制。本章重点介绍
  Power Query 中使用的基本数据类型及其特性，以及类型转换的处理。学完本章后，你将扎实掌握如何在 Power Query 中有效管理和操作不同类型的数据，为后续章节更高级的数据转换和分析奠定基础。


  ## Power Query 中的数据类型


  由于 Power Query 中的每个函数都只能应用于特定数据格式的值，因此数据类型在该软件中非常重要。


  为了说明数据类型的重要性，我们考虑一个简单的函数 `Text.Start`。它用于提取文本的前几个字符。如果第一个输入是文本，则该函数的输出将等于该文本的前几个字符；但如果第一个输入不是文本格式，则输出将是一个错误。因此，根据输入的类型，该函数的结果会有所不同，甚至可能导致错误，如表
  2-1 所示。


