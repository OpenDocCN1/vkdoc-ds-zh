  \ 日 | b |\n| 2023 年 2 月 4 日 | a |\n| 2023 年 2 月 6 日 | C |\n\n在另一种情况下，如果第二个输入中错误地输入了列名（例如，输入的是\"\
  Quantity2\"而不是\"Quantity\"），则公式结果会出错：\n\n```\n=Table.RemoveColumns(TableC,{\"Row\"\
  ,\"Quantity2\"})\n```\n\n此时，可以使用该函数的第三个输入，如下所示：\n\n```\n=Table.RemoveColumns(\n\
  \   TableC,\n   {\"Row\",\"Quantity2\"},\n   MissingField.UseNull\n)\n```\n\n结果如表\
