  \ 19，表示该日期属于该年的第 19 周：\n\n```\n= Date.WeekOfYear(#date(2022,5,3))\n```\n\n## `Date.WeekOfYear`\n\
  \n要确定某个日期的周序号（从年初开始），可按如下方式使用此函数：\n\n```\nDate.WeekOfYear(\n    dateTime as any,\n\
  \    optional firstDayOfWeek as nullable number\n) as nullable number\n```\n\n基于函数语法，它接受两个输入。第一个输入为日期类型，在第二个输入中，输入诸如`Day.Sunday`或`Day.Monday`的值，可指定一周的第一天是哪一天。\n\
  \n根据函数说明，以下公式的结果等于 19，表示该日期属于该年的第 19 周：\n\n```\n= Date.WeekOfYear(#date(2022,5,3))\n\
  ```\n\n## `Date.Month`\n\n此函数在 Power Query 中的定义如下，它接收一个日期类型的输入，并指定所输入日期的月份数字：\n\n\
  ```\nDate.Month(dateTime as any) as nullable number\n```\n\n换句话说，该函数在输出中显示输入日期的月份部分。因此，以下公式的结果等于\
  \ 5：\n\n```\n= Date.Month(#date(2022,5,3))\n```\n\n## `Date.MonthName`\n\n此函数与`Date.Month`函数类似，但输出结果将显示月份名称而非月份数字。该函数在\
  \ Power Query 中的定义如下：\n\n```\nDate.MonthName(\n    date as any,\n    optional culture\
  \ as nullable text\n) as nullable text\n```\n\n该函数的第一个输入代表参考日期，在第二个可选输入中，你可以通过输入如`\"\
  en-US\"`的表达式来定义月份命名的规则。以下公式的结果等于 May（五月）：\n\n```\n= Date.MonthName(#date(2022,5,3))\n\
  ```\n\n## `Date.DayOfYear`\n\n此函数在 Power Query 中的定义如下，它接收一个日期类型的输入，并在输出中指定所输入日期自年初以来的天数：\n\
  \n```\nDate.DayOfYear(dateTime as any) as nullable number\n```\n\n因此，以下公式的结果是 123，表示该日期属于该年的第\
  \ 123 天：\n\n```\n= Date.DayOfYear(#date(2022,5,3))\n```\n\n## `Date.Year`\n\n此函数在\
  \ Power Query 中的定义如下。它接收一个日期类型的输入，并在输出中确定输入日期的年份值。\n\n```\nDate.Year(dateTime as\
  \ any) as nullable number\n```\n\n换句话说，该函数在输出中显示输入日期的年份部分。因此，以下公式的结果等于 2022：\n\n\
  ```\n= Date.Year(#date(2022,5,3))\n```\n\n### 总结\n\n在本章中，你开启了一段掌握 Power Query 中日期和时间函数复杂性的旅程。在数据分析领域，时间是一个关键维度，需要精确和技巧才能有效驾驭。\n\
  \n\n\n"
- "# 第 6 章  \n"
- "# 列表函数\n\n你的旅程始于对基础概念的深入探索，例如日期编码、时区和算术运算的细微差别。掌握这些知识后，你进一步探索了日期和时间函数在将原始时间戳转换为可理解且有意义的**信息**中的强大作用。\n\
  \n随着深入学习，你发现了这些函数如何助力提取星期模式、计算重要事件之间的持续时间，以及标准化时间数据格式。这为有效的时间分析奠定了基础。\n\n在下一章中，你将探索一系列用于操作列表值的函数。基于这些函数，你可以轻松生成不同的列表、过滤和排序列表中的值、从列表中提取特定值，或合并列表。\n\
  \n在浩瀚的数据处理领域中，单个数据点往往交织在一起，构成更大的叙事脉络。这正是列表的用武之地。从销售交易集合到调查响应数组，列表捕捉了数据关系与依赖关系的本质。欢迎来到专为探索\
  \ Power Query 中列表函数领域而设的章节。这些函数是你解开复杂数据结构、释放互联信息真正潜能的**关键**。\n\n列表是编织数据故事脉络的线索。想象一下，将一份订单拆解为其组成产品、跟踪项目多步骤工作流，或理解客户偏好的动态变化。这些场景都需要掌握列表函数，这些工具使数据专业人士能够以前所未有的方式操作、剖析和重组数据，而过去这些操作曾是复杂的挑战。\n\
  \n本章的旅程始于对列表作为多功能数据结构的**基础理解**。你将探索其独特属性，从有序特性到容纳异构数据类型的能力。掌握这些知识后，你将深入列表创建的世界，从手动组合元素到通过计算表达式动态生成。\n\
  \n但列表并非孤立存在；它们相互作用、转换并适应变化。你将探索 Power Query 提供的列表函数库，以精确规格重塑数据集合。无论是基于特定条件过滤元素、排序以揭示模式，还是合并列表以拼接碎片化信息，你都将对数据处理的艺术产生全新的认知。\n\
  \n© Omid Motamedisedeh 2024  \nO. Motamedisedeh 著，*The Ultimate Guide to Functions\
  \ in Power Query*（Power Query 函数终极指南），  \n[`doi.org/10.1007/978-1-4842-9754-4_6`](https://doi.org/10.1007/978-1-4842-9754-4_6)\n\
  \n### 在 Power Query 中定义列表\n\n要创建列表，你可以轻松地将值插入 `{ }` 之间，并用逗号分隔，或使用相关函数。要定义从 1 到 5\
  \ 的数字列表，只需在公式栏中输入以下表达式。结果如图 6-1 所示。\n\n```\n={1,2,3,4,5}\n```\n\n**图 6-1.** 从 1\
  \ 到 5 的数字列表\n\n要定义字符列表，可以使用以下公式。结果如图 6-2 所示。\n\n```\n={\"a\",\"b\",\"c\"}\n```\n\
  \n**图 6-2.** 字符列表的定义\n\n要创建数字列表（例如数字 1 到 100），无需在 `{ }` 中注册所有数字，只需输入起始数字，后跟两个点号和结束数字即可。在这种情况下，相应列表中的整个数字集将被定义。见图\
  \ 6-3。\n\n```\n={1..100}\n```\n\n**图 6-3.** 数字 1 到 100 的定义\n\n此方法不仅适用于数字。字符 `c`\
  \ 到 `n` 之间的内容可以轻松定义如下，结果如图 6-4 所示：\n\n```\n={\"c\"..\"n\"}\n```\n\n\n\n"
- "# 第 6 章 列表函数\n\n`= {\"c\"..\"n\"}`\n\n![](img/index-121_1.jpg)\n\n**图 6-4.** 定义包含从\
  \ c 到 n 之间所有字符的列表\n\n一些公式见表 6-1。\n\n**表 6-1.** 定义列表\n\n| **公式** | **结果** |\n|-------------|------------|\n\
  | `= {3..9}` | `{3,4,5,6,7,8,9}` |\n| `= {\"w\",\"z\"}` | `{“w”,“z”}` |\n| `= {\"\
  w\"..\"z\"}` | `{“w”,“x”,“y”,“z”}` |\n| `= {\"W\"..\"Z\"}` | `{“W”,“X”,“Y”,“Z”}`\
  \ |\n| `= {\"#\"..\"&\"}` | `{“#”,“^”,“%”,“&”}` |\n\n除了直接定义列表外，还可以从表格的列中提取值来创建列表。实际上，表格的每一列都代表一个值列表（数字、文本等）。要将表格的某一列提取为列表，只需在方括号\
  \ `[]` 中输入表名和列名即可。例如，考虑 `TableA`（见表 6-2）。\n\n**表 6-2.** `TableA`\n\n| **产品** | **价格**\
  \ | **材料** |\n|-------------|-----------|--------------|\n| W11 | 100 | 金属 |\n|\
  \ s06 | 75 | 木材 |\n| r08 | 12 | 玻璃 |\n\n公式 `TableA[Price]` 的结果等于一个列表，包含 `{100,75,12}`；而公式\
  \ `TableA[Product]` 的结果等于产品名称列表，形式为 `{“W11”,“S06”,“R08”}`。\n\n此外，要创建列表，也可以使用 `List.Numbers`、`List.Generate`\
  \ 以及其他函数，如下所示。\n\n### List.Numbers\n\n`List.Numbers` 的使用方法如下，用于生成包含特定间隔数字序列的列表：\n\
  \n```\nList.Numbers(\n  start as number,\n  count as number,\n  optional increment\
  \ as nullable number\n) as list\n```\n\n如上所示，该函数接收三个数值参数，并始终返回一个数字列表。\n\n1. 第一个输入表示列表的起始数字。\n\
  2. 列表的长度在第二个输入中确定。\n3. 第三个输入表示列表中数字之间的间隔。如果未输入，则此输入默认为数字 1。\n\n根据函数说明，该函数的结果见表 6-3。\n\
  \n**表 6-3.** `List.Numbers` 示例\n\n| **公式** | **结果** |\n|-------------|------------|\n\
  | `= List.Numbers(3,4)` | `{3,4,5,6}` |\n| `= List.Numbers(3,4,-1)` | `{3,2,1,0}`\
  \ |\n| `= List.Numbers(3,4,6)` | `{3,9,15,21}` |\n\n### List.Generate\n\n`List.Generate`\
  \ 的使用方法如下，用于创建列表（包含数字、文本、记录或表格）：\n\n```\nList.Generate(\n  initial as function,\n\
  \  condition as function,\n  next as function,\n  optional selector as nullable\
  \ function\n) as list\n```\n\n`List.Generate` 接收四个参数。它们都是函数，最后一个参数是可选的。\n\n1. 第一个参数表示列表的起始数字（函数类型）。\n\
  2. 列表中生成值的停止条件在第二个参数中定义（函数类型）。\n\n![](img/index-124_1.png)\n\n3. 在此参数中，确定生成列表中新值的公式（函数类型）。\n\
  4. 此输入是可选的，称为选择器。利用此输入，可以修改函数的结果。\n\n让我们从一个简单的示例开始，该示例表示一个小于 10 的偶数列表。该函数可以定义如下：\n\
  \n`= List.Generate(()=>0, (x)=>x<10, (x)=>x+2)`\n\n在第一个输入中，第一个值是 `0`。根据第二个输入，列表中的所有值都应小于\
  \ `10`（列表中的值生成将持续到达到大于或等于 `10` 的值为止）。在第三个输入中，每次迭代时，列表的新值都是基于前一个值加上 `2` 生成的。此输入是一个函数，它接收\
  \ `x` 作为输入，并将 `x+2` 作为输出，其中 `=>` 是函数符号。\n\n基于上述示例，所需列表从数字 `0` 开始，每一步都将前一个数字加上 `2`，此过程一直持续到达到大于或等于\
  \ `10` 的数字为止。\n\n因此，此公式的结果是 `{0,2,4,6,8}`。见图 6-5。\n\n**图 6-5.** 使用 `List.Generate`\
  \ 创建偶数\n\n\n\n在前一个示例中，变量`x`可以被`_`替换，因此公式将变为如下形式：\n\n`= List.Generate(()=>0, (_)=>_<\
  \ 10, (_)=>_+2)`在这种情况下，`(_)=>`可以被替换为每个表达式，如下所示：\n\n`= List.Generate(() =>0, each\
  \ _ < 10, each _+2)`\n\n此函数的输入本身也是函数类型，其说明如表 6-4。\n\n***表 6-4.** `List.Generate`的参数*\n\
  \n`() =>0`，\n\n在该输入中，指定列表从数字 0 开始。\n\n`each < 10`，还指定列表中的数字必须小于 10。\n\n`each _+2`\n\
  \n此外，指定列表中的每个数字等于前一个数字加 2。\n\n在另一个示例中，可以使用以下公式创建一个列表，其中包含 1 到 5 的阶乘值：\n\n`= List.Generate(()=>\
  \ 1, each _<6, each _+1, each Number.Factorial(_))`\n\n此函数的输入如表 6-5 所示。\n\n***表\
  \ 6-5.** `List.Generate`的参数*\n\n`()=> 1`，\n\n所需的变量从 1 开始。\n\n`each _<6`，\n\n列表会持续生成，直到变量小于\
  \ 6。\n\n`each _+1`，\n\n每一步中变量的值等于其前一步的值加 1。\n\n`each Number.Factorial(_))`，\n\n\
  每个变量的阶乘值应显示在输出中。\n\n第六章 列表函数\n\n根据函数说明，此公式的值等于`{1,2,6,24,120}`，其中第一个值等于 1 的阶乘，第三个值等于\
  \ 3 的阶乘。\n\n在另一个示例中，以下公式的结果为`{2,4,8,16,32,64,128,256,512}`：\n\n`= List.Generate(()=>\
  \ 2, each _<1000, each _*2)`\n\n此公式的输入如表 6-6。\n\n***表 6-6.** `List.Generate`的参数*\n\
  \n`()=> 2`，\n\n变量从 2 开始。\n\n`each _<1000`，\n\n此过程会重复执行，直到变量小于 1000。\n\n`each _*2`\n\
  \n在每一步中，变量的值等于其前一个值乘以 2。\n\n根据上述说明，此公式的值等于一个数字序列，其中每一步的数字都是由前一个数字乘以 2 得到的，并且此过程重复执行，直到数字小于\
  \ 1000。因此，结果等于`{2,4,8,16,32,64,128,256,512}`。\n\n另一个使用`List.Generate`的示例由以下公式给出。此公式用于通过两个变量`x`和`y`创建小于\
  \ 10 的斐波那契数列。（斐波那契数列是`{0, 1, 1, 2, 3, 5, 8, 13, ...}`，该数列中的每个数字都是前两个数字之和。）\n\n`=\
  \ List.Generate(() => [x = 0, y = 1], each [x] < 10, each [x = [y], y = [x]+[y]],\
  \ each [x])`\n\n第六章 列表函数\n\n此函数的不同输入如表 6-7。\n\n***表 6-7.** `List.Generate`的参数*\n\
  \n`() => [x = 0, y = 1]`，最初，变量`x`和`y`的值分别为 0 和 1。\n\n`each [x] < 10`，\n\n列表数字的创建过程会持续进行，直到变量`x`达到一个大于或等于\
  \ 10 的数字。\n\n`each [x = [y], y = [x]+[y]]`，\n\n在每个阶段，`x`的值等于前一阶段`y`的值，而`y`的值等于前一阶段`x`和`y`值的和。\n\
  \n`each [x]`\n\n最后，`x`变量的值显示在输出中。\n\n根据函数说明，公式的结果等于`{0,1,1,2,3,5,8}`。\n\n在前一个示例中，在第四个参数中使用`each\
  \ [y]`代替`each [x]`意味着在输出中显示变量`y`的值，结果变为`{1,1,2,3,5,8,13}`；将第四个参数替换为`each [x]+[y]`意味着将在输出中显示变量`x`和`y`的和，因此结果将是`{1,2,3,5,8,13,21}`。\n\
  \n**`List.Times`**\n\n`List.Times`的使用方式如下，用于创建一个由时间格式值组成的列表：\n\n```\nList.Times(\n\
  \    start as time,\n    count as number,\n```\n\n\n"
- "# 列表函数\n\n## `List.Times`\n\n```\nList.Times(\n    start as time,\n    count as\
  \ number,\n    step as duration\n) as list\n```\n\n`List.Times` 函数接受三个输入，如下所示：\n\
  \n1.  第一个输入为时间格式，表示列表的第一个值。通常使用`#time`函数创建此输入。\n2.  第二个输入为数字格式，指定输出列表的长度。\n3.  第三个输入为持续时间格式，指定列表中每个时间与其前一个时间之间的差值。由于所需列表中的值为时间格式，其差值应为持续时间类型，因此通常使用`#duration`函数创建此输入。\n\
  \n根据函数说明，以下公式的结果是列表`{#time(1,10,0), #time(2,20,0), #time(3,30,0), #time(4,40,0)}`：\n\
  \n```\nList.Times(#time(1,10,0), 4, #duration(0,1,10,0))\n```\n\n## `List.Dates`\n\
  \n`List.Dates` 用于创建一个包含日期格式值的列表，使用方式如下：\n\n```\nList.Dates(\n    start as date,\n\
  \    count as number,\n    step as duration\n) as list\n```\n\n此函数接受三个参数，如下所示：\n\
  \n1.  第一个参数指定列表的初始数据，通常使用`#date()`函数定义。\n2.  第二个输入指定列表包含的数据数量。\n3.  第三个输入被视为列表中的步长，指定列表中每个数据与其前一个数据之间的差值。由于列表中的数据类型为日期，其差值应为持续时间类型，通常使用`#duration()`函数定义。\n\
  \n基于以上说明，以下公式的结果等于这三个日期：`{#date(2021, 1, 12), #date(2021, 1, 13), #date(2021, 1,\
  \ 14)}`\n\n```\nList.Dates(#date(2021, 1, 12), 3, #duration(1, 0, 0, 0))\n```\n\n\
  ## `List.DateTimes`\n\n与用于创建时间或日期格式值列表的`List.Times`和`List.Dates`函数类似，`List.DateTimes`函数也用于创建列表，但输出列表同时包含日期和时间值。该函数定义如下：\n\
  \n```\nList.DateTimes(\n    start as datetime,\n    count as number,\n    step as\
  \ duration\n) as list\n```\n\n此函数接受三个输入，如下所示：\n\n1.  在第一个输入中，指定所需列表的初始日期和时间。由于此函数的输出列表包含日期和时间类型的值，通常在其第一个输入中使用`#datetime()`函数。\n\
  2.  输出列表中的成员数量在第二个输入中指定。\n3.  在第三个输入（即步长）中，指定最终列表中每个值与其前一个值之间的差值。此输入中输入的数据必须为持续时间格式，通常使用`#duration()`函数创建。\n\
  \n根据函数说明，以下公式的结果等于三个日期和时间：\n\n```\n{#datetime(2021, 1, 12,1,0,0), #datetime(2021,\
  \ 1, 13,3,0,0), #datetime(2021, 1, 14,5,0,0)}\n```\n\n```\nList.Dates(#datetime(2021,\
  \ 1, 12,1,0,0), 3, #duration(1, 2, 0, 0))\n```\n\n## `List.Random`\n\n`List.Random`\
  \ 用于创建一个包含 0 到 1 之间随机数字的列表，使用方式如下：\n\n```\nList.Random(\n    count as number,\n\
  \    optional seed as nullable number\n) as list\n```\n\n此函数接受两个参数，如下所示：\n\n1. \
  \ 在第一个参数中，通过输入一个整数来确定列表的长度。\n2.  第二个参数是可选的，表示与随机数生成相关的种子。\n\n根据函数说明，公式`List.Random(3)`的结果等于一个包含三个\
  \ 0 到 1 范围内随机数字的列表。\n\n### 排序列表中的值\n\n如前所述，Power Query 中的列表包含一组具有特定顺序的值。要更改列表内值的顺序，可以使用`List.Reverse`和`List.Sort`。\n\
  \n## `List.Reverse`\n\n\n\n"
- "# 第 6 章 列表函数\n\n## `List.Reverse`\n\n`List.Reverse` 在 Power Query 中是一个非常简单的函数，用于反转列表中值的顺序。该函数接受一个\
  \ `list` 格式的参数，并在输出中显示反转后的列表，其形式如下：`List.Reverse(**list** as list) as list`\n\n\
  为阐明此函数的用法，表 6-8 中提供了一些相关示例。\n\n**表 6-8** `List.Reverse` 示例\n\n| 公式 | 结果 |\n|---------|--------|\n\
  | `= List.Reverse({1..4})` | `{4,3,2,1}` |\n| `= List.Reverse({\"a\",1,\"b\",10})`\
  \ | `{10,\"b\",1,\"a\"}` |\n| `= List.Reverse({3,8,1})` | `{1,8,3}` |\n\n## `List.Sort`\n\
  \n通过使用 `List.Sort`，可以对列表中的值进行升序和降序、按字母顺序、按数字顺序或任何其他逻辑进行排序。此函数的定义如下：\n\n```\nList.Sort(\n\
  \   **list** as list,\n   optional **comparisonCriteria** as any\n) as list\n```\n\
  \n因此，该函数接受以下两个参数：\n\n1.  第一个参数中定义了参考列表。\n2.  在此函数的第二个参数中，指定了排序逻辑。此输入是可选的；如果不输入，列表中的值将按升序排序。但是，可以在该输入中输入\
  \ `Order.Descending` 以降序对值进行排序。在高级情况下，可以通过函数定义自定义排序逻辑。\n\n该函数的一些基本示例在表 6-9 中给出。\n\
  \n**表 6-9** `List.Sort` 示例\n\n| 公式 | 结果 |\n|---------|--------|\n| `=List.Sort({1,5,-2,-3})`\
  \ | `{-3,-2,1,5}` |\n| `= List.Sort({1,5,2,3},Order.Descending)` | `{5,3,2,1}` |\n\
  | `= List.Sort({\"a\",\"x\",\"b\",\"c\"})` | `{\"a\",\"b\",\"c\",\"x\"}` |\n| `=\
  \ List.Sort({\"a\",\"x\",\"b\",\"c\"},Order.Descending)` | `{\"x\",\"c\",\"b\",\"\
  a\"}` |\n\n如前几个示例所示，以下公式的结果等于 `{-3, -2, 1, 5}`：\n\n```\n= List.Sort({1, 5, -2, -3})\n\
  ```\n\n这是因为 `-3` 小于 `1`，所以被列在开头。但是，如果不考虑数字的符号进行比较，可以使用以下公式：\n\n```\n= List.Sort({1,\
  \ 5, -2, -3}, (x) => Number.Abs(x))\n```\n\n在此公式中，您通过考虑值的绝对值（而非原始值）对列表中的值进行排序。因此，上述公式的结果等于\
  \ `{1, -2, -3, 5}`。\n\n也可以使用以下公式对列表进行排序，而不考虑值的符号，并从大到小排列：\n\n```\n= List.Sort({1,\
  \ 5, -2, -3}, {(x) => Number.Abs(x),Order.Descending})\n= List.Sort({1, 5, -2, -3},\
  \ {(x) => Number.Abs(x),1})\n= List.Sort({1, 5, -2, -3}, {each Number.Abs(_),1})\n\
  ```\n\n在另一个示例中，通过使用以下公式，偶数在输出中优先列出，其次是奇数：\n\n```\n= List.Sort({1, 2, 5, 4, 3}, (x)\
  \ => Number.IsOdd(x))\n```\n\n上述公式的输出等于 `{4, 2, 3, 1, 5}`，其中所有偶数排在前面，后面跟着奇数。要将奇数和偶数在其组内从小到大排序，可以使用以下公式：\n\
  \n```\n= List.Sort({1, 2, 5, 4, 3}, {{each Number.IsOdd(_)},{each _}})\n```\n\n\
  上述公式中定义了两步排序。首先，根据 `{each Number.IsOdd(_)}` 对值进行排序。然后，如果此公式的结果对于多个值相同，则根据 `{each\
  \ _}` 条件（从小到大）对其进行排序。因此，结果为 `{2,4,1,3,5}`。\n\n在另一个示例中，以下公式不使用第一个字符（左侧字符）对列表中的文本进行排序，而是使用最后一个字符（右侧字符）作为排序依据：\n\
  \n```\n= List.Sort({\"AXY\", \"XYA\", \"WND\", \"ACC\"}, each Text.End(_, 1))\n\
  ```\n\n上述公式的结果等于 `{\"XYA\", \"ACC\", \"WND\", \"AXY\"}`。\n\n### 从列表中提取\n\n在 Power\
  \ Query 中，有许多用于从列表中提取值的函数，本节将对这些函数进行探讨。\n\n### `List.First` 和 `List.Last`\n\n`List.First`\
  \ 用于提取列表中的第一个值，`List.Last` 用于提取列表中的最后一个值，如下所示：\n\n```\nList.First(\n   **list**\
  \ as list,\n   optional **defaultValue** as any\n) as any\n\nList.Last(\n   **list**\
  \ as list,\n   optional **defaultValue** as any\n) as any\n```\n\n\n\n"
- "# 第 6 章 列表函数\n\n这两个函数都接受以下参数：\n\n1.  第一个参数中输入引用列表。\n2.  这些函数的第二个参数是可选的，如果引用列表为空，则该参数会显示在输出中。\n\
  \n根据函数说明，以下公式的结果等于 1：\n\n`= List.First({1..10})`\n\n而以下公式的结果等于 -1：\n\n`= List.First({\
  \ },-1)`\n\n#### List.FirstN 和 List.LastN\n\n这两个函数彼此相似，区别在于 `List.FirstN` 用于从列表开头提取特定数量的值，而\
  \ `List.LastN` 用于从列表末尾提取特定数量的值。两者的定义如下：\n\n```\nList.FirstN(\n  list as list,\n\
  \  countOrCondition as any\n) as any\n```\n\n```\nList.LastN(\n  list as list,\n\
  \  optional countOrCondition as any\n) as any\n```\n\n这两个函数接受两个输入，其中第一个输入是列表格式，第二个输入是数值格式。\n\
  \n1.  第一个输入中输入引用列表。\n2.  在此输入中，输入要从列表开头（或末尾）提取值的数量。在此输入中，也可以定义筛选条件来代替具体数字。在这种情况下，将从列表开头（或末尾）显示满足相关条件的最大一组值作为输出。换句话说，将从列表开头（或末尾）提取值，直到遇到第一个不符合条件的实例。\n\
  \n根据函数说明，这些函数在不同示例中的输出如表 6-10 所示。\n\n**表 6-10.** `List.FirstN` 的示例\n\n| 公式 | 结果\
  \ |\n| :--- | :--- |\n| `= List.FirstN({1..10},3)` | `{1,2,3}` |\n| `= List.FirstN({1..10},5)`\
  \ | `{1,2,3,4,5}` |\n| `= List.FirstN({1..10},each _<5)` | `{1,2,3,4}` |\n| `= List.FirstN({5,\
  \ 4,1, 2, 6, 1}, each _>3)` | `{5.4}` |\n| `= List.LastN({1..10},3)` | `{8,9,10}`\
  \ |\n| `= List.LastN({1..10},5)` | `{6,7,8,9,10}` |\n| `= List.LastN({1..10},each\
  \ _<5)` | `{1,2,3,4}` |\n| `= List.LastN({5, 4,1, 2, 6, 1}, each _<3)` | `{1}` |\n\
  \n在示例 `List.LastN({5, 4,1, 2, 6, 1}, each _<3)` 中，说明列表末尾小于 3 的值应显示在输出中。如您所见，引用列表中也包含数字\
  \ 2（它小于 3 并满足条件），但输出仅包含数字 1。原因是，只有在满足条件时，列表末尾的值才会显示在输出中，一旦遇到不满足条件的值，搜索操作就会停止，并且不再检查后续的值。因此，在此示例中，由于数字\
  \ 6（倒数第二个数据）大于 3，因此不会检查数字 6 之前的数据。\n\n#### List.Range\n\n此函数用于从列表的不同部分提取值，定义如下：\n\
  \n```\nList.Range(\n  list as list,\n  offset as number,\n  optional count as nullable\
  \ number\n) as list\n```\n\n此函数接受以下三个输入：\n\n1.  在此函数的第一个输入中，输入引用列表。\n2.  在此输入中，通过输入数字来确定提取值的起始点。\n\
  3.  此函数的第三个输入指示要从列表中提取的值的数量。\n\n此函数的不同示例如表 6-11 所示。\n\n**表 6-11.** `List.Range`\
  \ 的示例\n\n| 公式 | 结果 |\n| :--- | :--- |\n| `= List.Range({1..10},5,3)` | `{6,7,8}`\
  \ |\n| `= List.Range({1..10},1,3)` | `{2,3,4}` |\n| `= List.Range({1..10},3,1)`\
  \ | `{4}` |\n\n#### List.Max 和 List.Min\n\n`List.Max` 和 `List.Min` 用于提取列表中的最大值和最小值，定义如下：\n\
  \n```\nList.Max(\n  list as list,\n  optional default as any,\n  optional comparisonCriteria\
  \ as any,\n  optional includeNulls as nullable logical\n) as any\n```\n\n```\nList.Min(\n\
  \  list as list,\n  optional default as any,\n  optional comparisonCriteria as any,\n\
  \  optional includeNulls as nullable logical\n) as any\n```\n\n\n\n"
