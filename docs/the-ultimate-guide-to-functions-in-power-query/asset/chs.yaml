  ### 在表格中查找值\n\n本节介绍与确定表格中值的位置相关的函数。\n\n### `Table.FindText`\n\n此函数用于从表格中提取包含特定文本的行。该函数在\
  \ Power Query 中的定义如下：\n\n```\nTable.FindText(\n  table as table,\n  text as text\n\
  ) as table\n```\n\n# 第 8 章 表格\n\n`Table.FindText` 接收两个输入。\n\n1.  该函数的第一个输入是引用表格。\n\
  2.  第二个输入中输入你要搜索的文本。\n\n函数的输出是引用表格中包含搜索文本的行。因此，公式 `= Table.FindText(TableC, \"A\"\
  )` 的结果等于表 8-137。\n\n***表 8-137.** `Table.FindText` 的结果*\n\n| **行** | **日期** | **产品名称**\
  \ | **数量** |\n|---------|----------|------------------|--------------|\n| 2023/1/30\
  \ | | a | |\n| 2023/1/31 | | a | |\n| 2023/2/1 | | a | |\n| 2023/2/2 | | a | |\n\
  | 2023/2/4 | | a | |\n\n### `Table.PositionOf`\n\n`Table.PositionOf` 用于提取包含特定值的行号，如下所示：\n\
  \n```\nTable.PositionOf(\n  table as table,\n  row as record,\n  optional occurrence\
  \ as any,\n  optional equationCriteria as any\n) as any\n```\n\n# 第 8 章 表格\n\n此函数接收四个输入，如下所示：\n\
  \n1.  该函数的第一个输入是引用表格。\n2.  第二个输入定义为一个记录，并指定你要搜索的行。例如，如果你要搜索名为 `a` 的列中值为 `1` 的行数，则输入\
  \ `[a=1]`。\n3.  此输入是可选的，通过 `Occurrence.First`、`Occurrence.Last`、`Occurrence.All`、`Occurrence.Optional`、`Occurrence.Required`\
  \ 或 `Occurrence.Repeating` 指定应将哪个出现项显示为输出。\n4.  此输入是可选的，允许你指定用于比较值的自定义条件。\n\n此函数的结果始终是一个数字，表示满足所需条件的行号。如果未找到所需行，则此函数的输出为\
  \ `-1`。\n\n考虑 `TableT`（如表 8-138 所示）。\n\n# 第 8 章 表格\n\n***表 8-138.** `TableT` 的定义*\n\
  \n| **产品名称** | **数量** |\n|------------------|--------------|\n| a | |\n| b | |\n\
  | a | |\n| b | |\n| a | |\n| C | |\n| a | |\n| C | |\n| b | |\n\n在以下公式中，此函数的结果等于数字\
  \ `6`，这意味着产品名称等于 `C` 且数量为 `1` 的行位于表格的第七行：\n\n```\n= Table.PositionOf(TableT,[Product\
  \ Name=\"C\",Quantity=1])\n```\n\n类似地，以下公式的结果等于 `2`。产品名称 `A` 确实注册在第三行，其`数量`列为 `2`，但由于未在第三个输入中指定需要哪个出现项，因此输出中显示第一个出现项。\n\
  \n```\n= Table.PositionOf(\n  TableT,\n  [Product Name=\"A\",Quantity=2])\n```\n\
  \n# 第 8 章 表格\n\n如果你希望在输出中显示所有出现项，请使用以下公式：\n\n```\n= Table.PositionOf(\n  TableT,\n\
  \  [Product Name=\"A\",Quantity=2]\n  ,Occurrence.All)\n```\n\n### `Table.PositionOfAny`\n\
  \n`Table.PositionOfAny` 与 `Table.PositionOf` 函数类似，区别在于此函数的第二个输入中可以定义多个条件，例如 `{[Product\
  \ Name=\"A\",Quantity=2], [Product Name=\"C\",Quantity=1]}`。\n\n此函数在 Power Query\
  \ 中的定义如下：\n\n```\nTable.PositionOfAny(\n  table as table,\n  rows as list,\n  optional\
  \ occurrence as nullable number,\n  optional equationCriteria as any\n) as any\n\
  ```\n\n\n\n```markdown\n根据函数说明，以下公式的结果等于形式为`{2,4,5,6}`的列表：\n\n```\n= Table.PositionOfAny(\n\
  \    TableT,\n    {\n        [Product Name=\"A\",Quantity=2],\n        [Product\
  \ Name=\"C\",Quantity=1]\n    },\n    Occurrence.All)\n```\n\n### 总结\n\n本章深入探讨了\
  \ Power Query 中表格函数的复杂领域，全面理解了表格如何作为结构化数据分析和操作的基础。\n\n本章首先对表格作为动态数据容器进行了基础性探索。您掌握了列和行的本质，理解了\
  \ Power Query 如何将表格视为能够容纳多种数据类型和关系的多功能结构。通过这部分内容，您学会了手动创建表格以及通过计算表达式生成表格。\n\n随着深入学习，您发现了表格函数的变革性力量。这些函数使您能够精确地过滤、排序、重塑和聚合表格中的数据。根据分析目标构建表格的艺术已变得得心应手，从而增强了您的数据处理能力。\n\
  \n本章还带领您进入了表格关系的领域，数据之间的联系得以展现。您探索了联接、合并和关联表格的技术，将来自不同来源的数据整合在一起，编织出连贯的叙述。这项技能使您能够发现跨越多个数据集的见解。\n\
  \n此外，您还深入研究了数据丰富和汇总的世界。当您发现如何将复杂数据集提炼成简洁而有洞察力的摘要时，这些函数的潜力便显现出来。这项技能使您能够识别隐藏在数据中的趋势、模式和异常。\n\
  \n本章贯穿始终地融入了实际示例，以说明表格函数在真实世界中的应用。在结束本章时，您已经具备了将原始数据转化为有组织的知识叙述的能力。您新掌握的表格操作技巧可以重新定义您处理数据分析的方式，让您更深入地理解关系、趋势和机遇。\n\
  \n在下一章中，将介绍从不同数据源提取值和表格的函数。您将学习如何将 Power Query 连接到不同的数据源，并从这些数据源中提取所需的信息。\n\n##\
  \ 第 9 章 从数据源提取\n\n在数据驱动决策的动态环境中，信息存在于数字世界的各个角落。无论是隐藏在电子表格中、驻留在数据库中，还是从 API 流式传输，从这些源中提取、统一和分析数据的能力至关重要。欢迎来到致力于掌握\
  \ Power Query 数据源函数的章节，这些函数是您无缝访问和利用来自各种来源的信息的通行证，将其转化为驱动明智决策的燃料。\n\n数据以其多种形式，为现代商业和研究引擎提供动力。但数据通常分散在多个平台上，每个平台都有自己的结构、语言和规则。Power\
  \ Query 的数据源函数应运而生，成为连接这些信息孤岛的桥梁，为统一分析铺平了道路。\n\n您在本章的旅程从对数据源函数的基础性探索开始：这些工具使 Power\
  \ Query 能够与不同的数据源进行通信。您将深入研究连接器的世界，每个连接器都旨在解释特定数据源的语言。\n\n© Omid Motamedisedeh 2024\n\
  \nO. Motamedisedeh, *The Ultimate Guide to Functions in Power Query*,\n\n[`doi.org/10.1007/978-1-4842-9754-4_9`](https://doi.org/10.1007/978-1-4842-9754-4_9#DOI)\n\
  \n### `Folder.Contents`\n\n使用`Folder.Contents`，可以存储各种格式文件中的值（例如\n```\n\n\n\n文件夹中的\
  \ `.xlsx`、`.accdb`、`.txt` 和 `.csv` 文件可通过如下方式调用：`Folder.Contents(path as text, optional\
  \ options as nullable record) as table`。根据上述说明，该函数接收两个输入：\n\n1.  该函数的第一个输入为文件夹路径。\n\
  2.  第二个输入为可选参数，以记录（record）形式用于设置。\n\n基于上述说明，如果各种文件存储在特定路径（例如 `C:\\Users\\omid_\\\
  OneDrive\\Desktop\\Data`）中，如图 9-1 所示，则以下公式的结果将等同于图 9-2：\n\n```\n= Folder.Contents(\"\
  C:\\Users\\omid_\\OneDrive\\Desktop\\Data\")\n```\n\n**图 9-1.** 文件夹内容\n\n![](img/index-368_1.jpg)\n\
  \n**图 9-2.** 从特定地址调用的数据\n\n在该函数的输出中，`Content` 列最为重要。它包含所输入地址中相关文件中存储的值。通过使用本章后续讲解的函数，可以提取这些值。\n\
  \n### `Csv.Document`\n\n使用 `Folder.Contents` 从特定路径加载文本或 CSV 文件中的值时，信息将以二进制格式显示在名为“content”的列中。要提取此类值，可如下使用\
  \ `CSV.Document`：\n\n`Csv.Document(source as any, optional columns as any, optional\
  \ delimiter as any, optional extraValues as nullable number, optional encoding as\
  \ nullable number) as table`\n\n该函数接收五个输入：\n\n1.  第一个输入为二进制值，包含 CSV 或文本文件中的值。\n\
  2.  第二个输入为可选参数，可在此输入列名。\n3.  第三个输入为可选参数，用于指定值分隔符。\n4.  此输入指定 CSV 文件中使用的文本编码。\n5.\
  \  最后一个输入允许用户通过输入 0、1 或 2 来指定 Power Query 如何处理 CSV 文件中包含多于或少于已定义列的行。\n\n根据函数说明，并参照之前的示例——在删除除\
  \ `Content`、`Name` 和 `Extension` 之外的所有列，并将其结果命名为 `#\"Removed Other Columns\"` 之后，按如下方式使用\
  \ `CSV.Document`：\n\n```\n= Table.AddColumn(#\"Removed Other Columns\", \"Custom\"\
  , each CSV.Document([Content]))\n```\n\n得出的信息如图 9-3 所示。\n\n**图 9-3.** `CSV.Document`\
  \ 函数结果\n\n![](img/index-370_1.jpg)\n\n可以看到，所有行的新列中都显示了单词 Table。通过选择 CSV 或文本文件（第\
  \ 1、2、4、5 行）对应行中该列的值，该文件内部的值将正确显示，如图 9-4 所示。\n\n**图 9-4.** 针对 CSV 表的函数结果\n\n![](img/index-371_1.jpg)\n\
  \n但是，通过选择数据格式为 XLSX（Excel 文件）的行中该列的值，结果将显示为乱序，如图 9-5 所示。\n\n**图 9-5.** 针对 Excel\
  \ 表的函数结果\n\n![](img/index-372_1.jpg)\n\n对于 PDF 文件的行，选择该列的 Table 会显示相同的结果。参见图 9-6。\n\
  \n**图 9-6.** 针对 PDF 文件的函数结果\n\n**Excel.Workbook**\n\n承接前面的示例，在通过 `Folder.Content`\
  \ 将存储在特定路径的 Excel 文件作为二进制值调用后，为从二进制值中提取 Excel 文件中的表格，可如下使用 `Excel.Workbook`：\n\n\
  `Excel.Workbook(workbook as binary, optional useHeaders as any, optional delayTypes\
  \ as nullable logical) as table`\n\n![](img/index-373_1.jpg)\n\n\n\n# 排版后的内容\n\n\
  基于此函数的语法，它接受三个参数：\n1. 第一个参数中，输入二进制文件的名称或地址。\n2. 第二个参数是可选的，可以设置为`True`或`False`，用于设置标题。\n\
  3. 此函数的第三个参数也是可选的，用于确定列中值的格式，输入`True`或`False`。\n\n在上一个示例中，输入以下公式代替`Csv.Document`将得到如图[9-7]所示的结果：\n\
  \n```\n= Table.AddColumn(#\"Removed Other Columns\",\n\"Custom\",\neach Excel.Workbook([Content]))\n\
  ```\n\n***图 9-7.** `Excel.Workbook` 的结果*\n\n如您所见，对于扩展名为 XLSX 的二进制文件，此函数的结果是一个包含该文件值的新表；对于其他文件格式，此函数的结果是一个错误。\n\
  \n**`Pdf.Tables`**\n\n在上一个示例中，通过如下方式使用`Pdf.Tables`代替`Excel.Workbook`，可以提取 PDF 文件中的值：\n\
  \n```\nPdf.Tables(\n    pdf as binary,\n    optional options as nullable record\n\
  ) as table\n```\n\n基于此函数的语法，它接受两个输入：\n1. 第一个输入中，输入 PDF 二进制文件的名称或地址。\n2. 此函数的第二个输入是可选的，用于输入与提取值相关的设置。\n\
  \n根据函数说明，在上一个示例中，使用以下公式代替`Excel.Workbook`，可以提取 PDF 文件中的值：\n\n```\n= Table.AddColumn(#\"\
  Removed Other Columns\",\n\"Custom\", each Excel.Workbook([Content]))\n```\n\n结果如图[9-8]所示。对于扩展名为.pdf\
  \ 的二进制文件，此函数的结果等于一个包含 PDF 文件中存储值的新表。对于其他文件类型，此函数的结果是一个错误。\n\n***图 9-8.** 从 PDF 文件中提取数据*\n\
  \n**`Sql.Database`**\n\n`Sql.Database`在 Power Query 中定义，用于从 SQL 数据库调用表，如下所示：\n\n\
  ```\nSql.Database(\n    server as text,\n    database as text,\n    optional options\
  \ as nullable record\n) as table\n```\n\n基于此函数的语法，它接受三个输入：\n1. 第一个输入中，以文本值形式输入服务器的名称。\n\
  2. 第二个输入中，以文本值形式输入数据库的名称。\n3. 此函数的第三个输入是可选的，可以输入`CreateNavigationProperties`、`NavigationPropertyNameGenerator`、`MaxDegreeOfParallelism`、`CommandTimeout`、`ConnectionTimeout`、`HierarchicalNavigation`、`MultiSubnetFailover`、`UnsafeTypeConversions`、`OmitSRID`和`ssDatabaseFolding`。\n\
  \n**`Excel.CurrentWorkbook`**\n\n`Excel.CurrentWorkbook`可以在 Excel 中用于将当前工作簿中的所有表调用到\
  \ Power Query 中，如下所示：\n\n```\nExcel.CurrentWorkbook() as table\n```\n\n`Excel.CurrentWorkbook`函数仅在\
  \ Excel 的 Power Query 中使用。`Excel.CurrentWorkbook()`不接受任何输入，并且始终返回 Power Query 所在同个\
  \ Excel 文件的不同工作表中存储的表。\n\n**总结**\n\n在本章中，您踏上了使用 Power Query 数据源函数进行数据提取的全面旅程。本章强调了从不同来源访问和统一数据以支持明智决策的重要性。\n\
  \n本章从探索数据源函数的基本概念开始。您了解了这些函数如何使 Power Query 与一系列数据源（从电子表格和数据库到结构化文件）进行通信。这一基础理解为进一步深入研究数据提取技术奠定了基础。\n\
  \n在下一章（即最后一章）中，将介绍一些用于处理错误、条件以及组合函数的其他函数。\n\n**第十章**\n\n**其他函数**\n\n\n\n尽管 Power\
  \ Query 的基础函数能够帮助你导航、重塑和聚合数据，但在某些情况下，你的数据转换需要更高层次的复杂性。这时，高级函数便应运而生。它们能够帮助你做出细微的决策、优雅地处理异常，并编写满足特定需求的自定义表达式。\n\
  \n在本章的学习中，你将从探索条件逻辑开始，这是一门向数据提问的艺术。\n\n像 `IF` 这样的函数为你的数据转换引入了决策能力。无论是基于特定条件筛选数据，还是根据输入动态更改计算，这些函数都能让你构建出自定义的、上下文感知的数据流。\n\
  \n但数据并非总是完美的，错误可能会意外出现。\n\n此时，像 `TRY`、`OTHERWISE` 和 `ERROR` 这样的函数就派上了用场。\n\n你将深入错误处理的世界，学习如何优雅地管理异常、替换缺失值，并确保你的数据转换即使在面对不可预见的挑战时也能继续进行。\n\
  \n随着本章学习的深入，你将揭示 `LET` 函数的潜力。这个函数看似简单，却掌握着简化复杂表达式的关键。了解 `LET` 函数如何通过将复杂的数据转换分解成更易于理解的部分，从而提高代码的可读性和可维护性。\n\
