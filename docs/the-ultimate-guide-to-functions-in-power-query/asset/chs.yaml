- '# 类型转换


  Power Query 中有多个函数用于将不同的数据格式转换为另一种格式，但在了解这些函数之前，需要注意的是，并非所有数据格式都可以转换为其他格式。例如，你无法使用任何函数将文本格式
  `"Hello"` 转换为数字。


  Power Query 中不同数据格式之间相互转换的可能性如图 2-1 所示。


  - 转换是可能的，但会从原始数据中删除一个值。

  - 转换是可能的，但会向原始数据中添加一个值。

  - 转换没有限制。

  - 转换是不可能的。


  ***图 2-1.** Power Query 中的数据转换*


  Power Query 中有多个函数用于将不同的数据格式相互转换，本章其余部分将提供其中最重要的函数。


