  \ | `\"aW\"`        |\n\n## `Text.PadStart`\n\n`Text.PadStart`函数与`Text.PadEnd`函数类似。其区别在于，此函数中所需的字符将放置在引用文本的开头。换句话说，通过使用`Text.PadStart`，可以通过在文本开头重复新字符来增加文本的长度。此函数的定义如下：\n\
