  ` 的参考列表中的值；输入 `\"ab\"`，表示输出中将显示包含字母 `\"ab\"` 的参考列表中的值。\n\n基于函数说明，表 6-15. 提供了此函数应用的一些示例。\n\
  \n***表 6-15.** `List.FindText` 的示例*\n\n| **公式** | **结果** |\n| --- | --- |\n| `=\
