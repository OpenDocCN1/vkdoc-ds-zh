  **总结**\n\n本章向您介绍了在 Power Query 中处理数字的函数。这些函数可分为以下六组。\n\n- 常量值包括所有结果为一个通用数字的函数，例如圆周率\
  \ Pi。\n- 信息函数包括用于确定数字类型的函数，例如检查一个数字是奇数还是偶数。\n- 舍入数字函数包括用于舍入运算的函数。\n- 数学运算函数用于指数、对数、三角等计算。\n\
  - 随机生成函数包括用于通过适当的舍入策略确保计算和结果准确的函数。\n- 三角函数，如 `Number.Sin`、`Number.Cos` 和 `Number.Tan`，用于三角计算。\n\
  \n为了完整地学习操作基本数据类型的函数，您将在下一章中探索操作文本值的函数，例如合并文本或提取文本的特定部分。\n\n## 第四章 文本函数\n\n在数据转换和处理的领域中，文本数据是一个基础构建块。无论是处理客户名称、产品描述、日志条目还是任何其他文本内容，提取、清理和转换文本的能力变得至关重要。这正是\
  \ Power Query 的强大之处。在本章中，您将深入探讨如何在 Power Query 中运用文本函数的艺术，揭示一套能够赋能数据专业人员攻克非结构化与半结构化文本数据复杂性的工具集。\n\
