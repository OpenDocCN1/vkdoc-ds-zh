  \  TableC,\n   {\"Date\",\"Quantity2\"},\n   MissingField.Ignore\n)\n```\n\n###\
  \ 第 8 章 表格\n\n**表 8-68.** `Table.SelectColumns` 的结果\n\n| 日期 |\n|------|\n| 2023\
  \ 年 1 月 30 日 |\n| 2023 年 1 月 31 日 |\n| 2023 年 2 月 1 日 |\n| 2023 年 2 月 1 日 |\n| 2023\
  \ 年 2 月 1 日 |\n| 2023 年 2 月 2 日 |\n| 2023 年 2 月 2 日 |\n| 2023 年 2 月 3 日 |\n| 2023\
  \ 年 2 月 4 日 |\n| 2023 年 2 月 4 日 |\n| 2023 年 2 月 6 日 |\n\n## `Table.DuplicateColumn`\n\
  \n通过此函数，可以创建表中列的副本。该函数在 Power Query 中的语法如下：\n\n```\nTable.DuplicateColumn(\n   table\
  \ as table,\n   columnName as text,\n   newColumnName as text,\n   optional columnType\
