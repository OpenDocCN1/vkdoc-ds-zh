  \n1.  第一个参数中应输入参考列表。\n2.  此函数的第二个参数是可选的，允许您指定比较值的自定义条件。\n\n基于以上说明，此函数在不同示例下的结果如表\
  \ 6-16 所示。\n\n***表 6-16.** `List.Distinct` 的示例*\n\n| **公式** | **结果** |\n| --- |\
  \ --- |\n| `= List.Distinct({1,3,2,1,2,5,1})` | `{1,3,2,5}` |\n| `= List.Distinct({1,1,1,1,1,1,1})`\
  \ | `{1}` |\n| `= List.Distinct({\"a\",\"A\",\"b\",\"a\"})` | `{\"a\",\"a\",\"b\"\
  }` |\n| `= List.Distinct({\"a\",\"A\",\"b\",\"a\"},Comparer.OrdinalIgnoreCase)`\
  \ | `{\"a\",\"b\"}` |\n| `= List.Distinct({1..10},each Number.IsOdd(_))` | `{1,2}`\
  \ |\n\n### `List.RemoveFirstN` 和 `List.RemoveLastN`\n\n`List.RemoveFirstN` 和 `List.RemoveLastN`\
  \ 用于从列表的开头或结尾移除指定数量的值，其语法如下：\n\n`List.RemoveFirstN(`\n\n`**list** as list,`\n\n\
  `optional **countOrCondition** as any`\n\n`) as list`\n\n`List.RemoveLastN(`\n\n\
