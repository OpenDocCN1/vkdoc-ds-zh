  \ | a | |\n| 2023/2/1 | C | |\n\n#### 第 8 章表\n\n### `Table.AggregateTableColumn`\n\
  \n不必从 `Info` 列中的表提取值，可以通过使用 `Table.AggregateTableColumn` 提取值的汇总。可以按如下方式使用此函数：\n\n\
  ```\nTable.AggregateTableColumn(\n    table as table,\n    column as text,\n   \
  \ aggregations as list\n) as table\n```\n\n根据函数语法，它需要三个输入。\n\n1. 在第一个输入中，指定参考表。\n\
  2. 在此输入中传入包含表格格式值的列的名称。\n3. 在此输入中，您列出三个值：要汇总的列的名称、汇总值的操作以及结果表中新列的名称。因此 `{{\"A\"\
  , List.Sum, \"X\"}}` 表示通过使用 `List.Sum` 函数，从列 A 中提取值，并将它们的求和结果放入一个名为 X 的新列中。\n\n\
  若要检查此函数的性能，请使用 `TableO`。在此情况下，此函数在不同公式下的结果如表 8-127 和 8-128 所示。\n\n```\n= Table.AggregateTableColumn(\n\
  \    TableO,\n    \"Info\",\n    {{\"Quantity\", List.Sum, \"Sum of Quantity\"}}\n\
  )\n```\n\n#### 第 8 章表\n\n### **表 8-127.** `Table.AggregateTableColumn` 的结果\n\n|\
  \ 日期 | 数量总和 |\n|------|-----------------|\n| 2023/1/30 | |\n| 2023/1/31 | |\n| 2023/2/1\
