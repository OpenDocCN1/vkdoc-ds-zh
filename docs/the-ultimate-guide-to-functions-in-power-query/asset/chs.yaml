  \ `False`。\n\n### 列表中的位置\n\n本节解释与提取列表中值位置相关的函数。\n\n### `List.Positions`\n\n`List.Positions`\
  \ 函数在 Power Query 中的定义非常简单，如下所示：\n\n```\nList.Positions(list as list) as list\n\
