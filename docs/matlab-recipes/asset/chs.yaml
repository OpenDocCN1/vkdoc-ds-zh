  #### 引言


  编写软件几乎已成为每位专业工程师和工科学生工作描述的一部分。虽然市面上有许多优秀的预制工程软件，但几乎每个人都能从为自己问题编写定制软件中受益。


  MATLAB® 正是源于这一原因。需要进行矩阵运算的科学家们曾使用 FORTRAN 编写的数值软件。当时，使用计算机语言需要用户经历编写、编译、链接和执行的流程，既耗时又容易出错。MATLAB
  提供了一种脚本语言，用户只需编写几行脚本即可瞬时解决许多问题。MATLAB 内置的可视化工具帮助用户更好地理解结果。编写 MATLAB 代码比编写 FORTRAN
  代码高效且有趣得多。


  自诞生以来，MATLAB 已有了巨大的发展。基础 MATLAB 软件的功能大幅增强，如今已有数百个 MATLAB 库可供使用，既有商业版也有开源版。MATLAB
  非常复杂精深，大多数新用户仅使用了其功能的一小部分。


  《MATLAB 编程实例》的目标是帮助所有用户充分利用 MATLAB 的强大功能。本书分为两部分。第一部分（第 1 章至第 5 章）提供了一个框架，供您编写高质量
  MATLAB 代码，这些代码可供您、您的同事乃至您的客户使用。我们以问题-解决方案的格式涵盖了编码实践、图形、调试及其他主题。您可以通读这些章节，也可以只浏览感兴趣的实例，并将其应用于您最新的
  MATLAB 代码中。


  本书第二部分（第 6 章至第 12 章）展示了围绕动态系统控制与仿真的完整 MATLAB 应用。每章都提供了相应主题的技术背景、如何编写简单控制系统的思路，以及如何仿真该系统的示例。每个系统均通过一个
  MATLAB 脚本来实现，并由多个 MATLAB 函数支持。每章还会重点介绍一个通用 MATLAB 主题，例如图形处理或图形用户界面（GUI）的编写。我们特意将控制系统设计得简单易懂，这样读者无需学习控制理论课程也能获得成果。控制专家则可以轻松地利用脚本实现自己的想法。我们涵盖了从化学过程到卫星的多个领域——如果我们未能为您的兴趣领域编写示例，在此表示歉意！


  本书适合所有读者——从 MATLAB 新手到商业 MATLAB 包的作者。在撰写本书的过程中，我们自己也学到了新东西！希望您喜欢本书，并期待看到它激发您创作的软件。




