  \n**图 4-1.** 旋转立方体的动画\n\n\n\n### 工作原理\n\n首先，创建一个包含上一章三维盒子的图形。然后在一个循环中更新它。如果能为现有图形对象分配新数据，这将是最高效的方式。这可以更改对象的颜色、样式或物理位置。另一种方法是先删除对象，再在当前坐标系中重新创建。在这两种情况下，你都需要存储图形句柄以便进行更新。\n\
  \n在本例中，你通过乘以旋转矩阵 `b` 来更新顶点。然后，通过句柄使用 `set(p, 'vertices', vK)` 将顶点传递到补片（patch）对象中。请注意转置的使用，因为顶点存储在一个\
  \ n×3 的数组中。一个光照对象能让最终的动画更有趣。你将补片对象的 `'linestyle'` 设置为 `'none'`，以消除三角形之间的线条。\n\n\
  ```\n%% 使用补片（patch）制作立方体动画\n\n% 创建一个图形并在其中绘制一个立方体。顶点和面直接指定。\n% 我们仅更新顶点以得到流畅的动画。\n\
  \n%% 盒子设计\n\nx = 3;\ny = 2;\nz = 1;\n\n% 面\nf = [2 3 6;3 7 6;3 4 8;3 8 7;4 5 8;4\
  \ 1 5;2 6 5;2 5 1;1 3 2;1 4 3;5 6 7;5 7 8];\n\n% 顶点\nv = [-x x x -x -x x x -x;...\n\
  \    -y -y y y -y -y y y;...\n    -z -z -z -z z z z z]'/2;\n\n%% 绘制对象\n\nh = figure('name','Box');\n\
  p = patch('vertices',v,'faces',f,'facecolor',[0.5 0.5 0.5],...\n    'linestyle','none','facelighting','gouraud');\n\
  ax = gca;\nset(ax,'DataAspectRatio',[1 1 1],'DataAspectRatioMode','manual')\naxis([-3\
  \ 3 -3 3 -3 3])\ngrid on\nxlabel('x')\nylabel('y')\nzlabel('z')\nview(3)\nrotate3d\
  \ on\nlight('position',[0 0 1])\n\n%% 动画\n\n% 我们使用 tic 和 toc 来计时动画。Pause 配合小于一秒的输入用以减慢动画。\n\
  \ntic\nn = 10000;\na = linspace(0,8*pi,n);\nc = cos(a);\ns = sin(a);\nfor k = 1:n\n\
  \    b = [c(k) 0 s(k);0 1 0;-s(k) 0 c(k)];\n    vK = (b*v')';\n    set(p,'vertices',vK);\n\
  \    pause(0.001);\nend\ntoc\n```\n\n在一台 MacBook Pro 笔记本电脑上，完整旋转四次的动画大约需要 16 秒。其中预计约\
  \ 10 秒来自 `pause` 命令，即 10000 步乘以 0.001 秒。使用 `pause` 可以减慢动画速度，否则动画可能过快而失去实用价值。请记住，可以使用\
  \ `pause off` 临时禁用 `pause` 命令；这在测试使用了 `pause` 的图形函数时非常有用。\n\n**提示**：根据需要，使用 `pause`\
  \ 来减慢动画速度。测试时，请记得使用 `pause off` 来禁用暂停，以全速运行。\n\n检查你电脑上的执行时间！运行脚本两次，第二次时关闭 pause。\n\
  \n```\n>> pause on\n>> PatchAnimation;\nElapsed time is 15.641664 seconds.\n\n>>\
