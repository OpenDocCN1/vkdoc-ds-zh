  如果你想要更炫酷的效果，可以在图形前方绘制对象并为其设置透明度，但这些对象必须是填充或面片对象；文本无法设置透明度。


  ## 总结


  本章回顾了 MATLAB 可视化的关键特性，从基础绘图到 3D 可视化，包括对象和光照。我们演示了如何获取图形和坐标轴的句柄、以编程方式设置属性，以及使用图形交互工具。创建实用的可视化程序是任何工具箱的关键组成部分。MATLAB
  提供了出色的数据管理程序，包括能够管理大型数据网格的程序，以及多种着色选项。表 3-1 列出了本章中开发的代码。


  ### 表 3-1. 章节代码清单


