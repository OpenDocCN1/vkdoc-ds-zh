- "# 第六章 双积分器\n\n电子补充材料：本章在线版本 (doi: [10.1007/978-1-4842-0559-4_6](http://dx.doi.org/10.1007/978-1-4842-0559-4_6))\
  \ 包含补充材料，仅供授权用户使用。\n\n双积分器是多种物理系统的动力学模型。这包括一维运动的质量块和绕轴旋转的物体。它代表了一类具有两个状态的广泛系统。在本章中，你将学习如何对双积分器进行建模以及如何控制它。在此过程中，你将创建一些非常重要的函数，用于实现控制系统、绘制图形以及执行数值积分。这将为后续章节中更复杂的系统提供一个跳板。\n\
  \n## 6.1 为双积分器模型编写方程\n\n### 问题\n\n双积分器是一个二阶模型，具有二阶导数，且该导数独立于状态。该模型出现在许多工程学科中。\n\n\
  ### 解决方案\n\n你将编写模型动力学的方程，并在一个函数中实现它们。\n\n### 工作原理\n\n一维线性运动可以用以下微分方程建模：\n\n![ $$\
  \ \\dot{r}=\\upsilon $$ ](img/A335353_1_En_6_Chapter_Equ1.gif)\n\n(6.1)\n\n![ $$\
  \ m\\overset{.}{\\upsilon }=F $$ ](img/A335353_1_En_6_Chapter_Equ2.gif)\n\n(6.2)\
  \ `r` 和 `υ` 是状态；`m` 即质量，是一个参数；`F` 即力，是一个输入。状态向量为\n\n![ $$ x=\\left[\\begin{array}{r}\\\
  hfill r\\\\ {}\\hfill \\upsilon \\end{array}\\right] $$ ](A335353_1_En_6_Chapter_Equ3.gif)\n\
  \n(6.3)\n\n变量 `x` 表示为一个 MATLAB 的两行×一列数组。该数组的第一个元素是 `r`，第二个是 `υ`。\n\n**提示：** 此方程同样适用于旋转运动。只需将\
  \ `m` 替换为惯性矩 `I`，将 `r` 替换为角度 `θ`，将 `υ` 替换为角速度 `ω`，并将 `F` 替换为扭矩 `T`。\n\n为了编写导数的函数，将方程两边除以\
  \ `m`，以将导数隔离在方程左侧。右侧的项就是你将在所谓 `RHS` 函数中计算的内容。\n\n![ $$ \\dot{r}=\\upsilon $$ ](img/A335353_1_En_6_Chapter_Equ4.gif)\n\
  \n(6.4)\n\n![ $$ \\overset{.}{\\upsilon }=\\frac{F}{m}\\equiv a $$ ](img/A335353_1_En_6_Chapter_Equ5.gif)\n\
  \n(6.5)\n\n用向量符号写出这些方程，得到\n\n![ $$ \\dot{x}=\\left[\\begin{array}{r}\\hfill \\upsilon\
  \ \\\\ {}\\hfill a\\end{array}\\right] $$ ](A335353_1_En_6_Chapter_Equ6.gif)\n\n\
  (6.6)\n\n现在，你可以为状态向量 `x` 的导数编写函数 `RHSDoubleIntegrator`。注意名称中的 `RHS` 前缀，这是用来标识所有可被积分的函数。速度项是状态\
  \ `x` 的第二个元素，并作为位置状态 `r` 的导数传递。速度状态的导数则是加速度 `a`。`RHS` 函数对于第一个参数有一个占位符 `∼`，积分器会将时间\
  \ `t` 传递至此，但该函数并不需要它。\n\n```\nfunction xDot = RHSDoubleIntegrator(∼, x, a)\nxDot\
  \ = [x(2);a];\n```\n\n## 6.2 创建定步长数值积分器\n\n### 问题\n\n在仿真中，你需要使用数值积分来演化系统的状态。\n\n\
  ### 解决方案\n\n你将回顾四阶龙格-库塔积分器的方程，并开发一个函数来执行定步长积分。\n\n\n\n### 工作原理\n\n让我们看一个直线运动的简单模型。你需要将方程转化为状态方程形式，这是一组将导数项置于左侧的一阶微分方程。例如，来自配方\
  \ 6-1 的一维运动模型，其中`r`和`υ`的导数项位于方程左侧。\n\n![ $$ \\frac{dr}{dt}=\\upsilon $$ ](img/A335353_1_En_6_Chapter_Equ7.gif)\n\
  \n(6.7)\n\n![ $$ \\frac{d\\upsilon }{dt}=\\frac{F}{m} $$ ](img/A335353_1_En_6_Chapter_Equ8.gif)\n\
  \n(6.8)\n\n两边同时乘以`dt`。\n\n![ $$ dr=\\upsilon dt $$ ](img/A335353_1_En_6_Chapter_Equ9.gif)\n\
  \n(6.9)\n\n![ $$ d\\upsilon =\\frac{F}{m}dt $$ ](img/A335353_1_En_6_Chapter_Equ10.gif)\n\
  \n(6.10)\n\n将`dt`替换为固定时间间隔`h`。现在你可以写出最简单的数值积分器，用于从第`k`步的状态计算第`k + 1`步的状态。\n\n![\
  \ $$ {r}_{k+1}={r}_k+{\\upsilon}_kh $$ ](img/A335353_1_En_6_Chapter_Equ11.gif)\n\
  \n(6.11)\n\n![ $$ {\\upsilon}_{k+1}={\\upsilon}_k+\\frac{F_k}{m}h $$ ](img/A335353_1_En_6_Chapter_Equ12.gif)\n\
  \n(6.12)\n\n第`k`步位于时间`t[k]`，第`k + 1`步位于时间`t[k+1]`，其中`t[k+1] = t[k] + h`。\n\n这种简单的积分器称为欧拉积分。它假设力`F[k]`在时间间隔`h`内是恒定的。欧拉积分对于像上述这样的简单系统效果相当不错。例如，对于一个弹簧系统：\n\
  \n![ $$ \\ddot{r}+{\\omega}²r=a $$ ](img/A335353_1_En_6_Chapter_Equ13.gif)\n\n(6.13)\
  \ 其振荡的固有频率为`ω`。如果时间步长大于振荡周期`2π/ω`的一半，数值积分将无法捕捉到动力学特性。实践中，时间步长`h`必须远小于一半。\n\n由于其精度有限，欧拉积分在工程中很少使用。控制系统仿真中最常用的方法之一是四阶龙格-库塔法。其方程如下：\n\
  \n![ $$ \\begin{array}{l}{k}_1=f\\left(x,u(t),t\\right)\\\\ {}{k}_2=f\\left(x+\\\
  frac{h}{2}{k}_1,u(t)+\\frac{h}{2},t+\\frac{h}{2}\\right)\\\\ {}{k}_3=f\\left(x+\\\
  frac{h}{2}{k}_2,u(t)+\\frac{h}{2},t+\\frac{h}{2}\\right)\\\\ {}{k}_4=\\left(x+h{k}_3,u\\\
  left(t+h-\\varepsilon \\right),t+h\\right)\\\\ {}x=x+\\frac{h}{6}\\left({k}_1+2\\\
  left({k}_2+{k}_3\\right)+{k}_4\\right)+O\\left({h}⁴\\right)\\end{array} $$ ](img/A335353_1_En_6_Chapter_Equ14.gif)\n\
  \n(6.14) `f(x, u, t)` 是微分方程的右侧部分。`O(h⁴)` 表示因积分阶次产生的截断误差与时间步长的四次方成正比。这意味着如果将时间步长减半，误差将降至较大步长误差的\
  \ 0.0625。在上述系统中，右侧函数在四个不同点进行计算：在`h/2`处计算两次，在`t`和`t + h`处各计算一次。\n\n![ $$ f\\left(x,F,t\\\
  right)=\\left[\\begin{array}{l}\\upsilon \\hfill \\\\ {}\\frac{F}{m}\\hfill \\end{array}\\\
  right] $$ ](A335353_1_En_6_Chapter_Equ15.gif)\n\n(6.15)\n\n**注意**  \n存在其他具有不同系数的四阶龙格-库塔法。\n\
  \nMATLAB 提供了许多数值积分器。它们被设计用于在任何区间上进行积分。一些积分器，例如 `ode113`，会在期望区间内调整步长和积分阶次（欧拉为一阶，前述龙格-库塔为四阶）。对于数字控制，你需要根据数字控制器的步长进行积分。你可以为此使用\
  \ `ode113`，但通常四阶龙格-库塔法就足够了。本书中的所有示例均采用此方法。\n\n接下来，你将查看实现方程 6.14 的 `RungeKutta` 函数。请注意在以下代码中使用\
  \ `feval` 来评估右侧函数。\n\n```\nfunction x = RungeKutta( Fun, t, x, h, varargin )\nhO2\
  \ = 0.5*h;\ntPHO2 = t + hO2;\nk1 = feval( Fun, t, x, varargin{:} );\nk2 = feval(\
  \ Fun, tPHO2, x + hO2*k1, varargin{:} );\nk3 = feval( Fun, tPHO2, x + hO2*k2, varargin{:}\
  \ );\nk4 = feval( Fun, t+h, x + h*k3, varargin{:} );\nx = x + h*(k1 + 2*(k2+k3)\
  \ + k4)/6;\n```\n\n`Fun` 是指向右侧函数的指针。`varargin` 被传递给该函数，这使得动力学模型可以拥有任意数量的参数。本书中的所有示例均使用此\
  \ `RungeKutta` 函数。你会预先计算所有需多次使用的值，例如 `t + h/2`。这对于被反复调用的函数尤为重要。\n\n你向该函数传递一个指向右侧函数\
  \ `RHSDoubleIntegrator` 的句柄，该函数实现了方程 6.1。\n\n**提示**  \n在函数调用中，用波浪线 `~` 替换未使用的变量。\n\
  \n为了将模型向前积分一步，你调用：\n\n```\nxNew = RungeKutta( @RHSDoubleIntegrator, ∼, x, h, a )\n\
  ```\n\n我们的 `RungeKutta` 函数以及所有 MATLAB 积分器，都将自变量放在首位，本例中为 `t`。由于此处未使用它，你可以用波浪线替换它。MATLAB\
  \ 的代码分析器会建议你这样操作，以提高代码中所有未使用的函数输入和输出的效率。\n\n## 6.3 实现离散比例-微分控制器\n\n### 问题\n\n你需要能够控制双积分器系统及其他动力学系统的数字控制软件。\n\
  \n### 解决方案\n\n你将推导时域中有阻尼的二阶系统的方程，然后创建一个采样数据版本，并在 MATLAB 函数中实现它。\n\n\n\n### 工作原理\n\
  \n如果向系统施加一个**恒定力** `F`，质量 `m` 将会加速，其位置随时间呈平方变化。两个状态 `r` 和 `υ` 的解析解为：\n\n![ $$ r(t)=r(0)+\\\
  upsilon (0)\\left(t-t(0)\\right)+\\frac{1}{2}\\frac{F}{m}{\\left(t-t(0)\\right)}²\
  \ $$ ](img/A335353_1_En_6_Chapter_Equ16.gif)\n\n(6.16)\n\n![ $$ \\upsilon (t)=\\\
  upsilon (0)+\\frac{F}{m}\\left(t-t(0)\\right) $$ ](img/A335353_1_En_6_Chapter_Equ17.gif)\n\
  \n(6.17)\n\n如果你希望质量的位置保持在零附近，可以使用一种称为**调节器**的控制系统。你将使用比例-微分调节器。该调节器测量位置，并施加一个与位置误差和位置误差导数成比例的控制力。我们来看一种特别简单的控制形式：\n\
  \n![ $$ {F}_c=-{k}_rr-{k}_{\\upsilon}\\upsilon $$ ](img/A335353_1_En_6_Chapter_Equ18.gif)\n\
  \n(6.18)\n\n`F[c]` 是控制力。要使此系统工作，你不需要能够测量干扰力 `F`。如果将动态系统写成二阶系统的形式，选择增益 `k[r]` 和 `k[υ]`\
  \ 就很容易：\n\n![ $$ m\\ddot{r}={F}_c+F $$ ](img/A335353_1_En_6_Chapter_Equ19.gif)\n\
  \n(6.19)\n\n![ $$ m\\ddot{r}=F-{k}_rr-{k}_{\\upsilon}\\upsilon $$ ](img/A335353_1_En_6_Chapter_Equ20.gif)\n\
  \n(6.20)\n\n![ $$ m\\ddot{r}+{k}_{\\upsilon}\\dot{r}+{k}_rr=F $$ ](img/A335353_1_En_6_Chapter_Equ21.gif)\n\
  \n(6.21)\n\n被控系统是一个**阻尼二阶振荡器**。你可以将所需的微分方程写成：\n\n![ $$ \\ddot{r}+2\\zeta \\sigma\
  \ \\dot{r}+{\\sigma}²r=\\frac{F}{m} $$ ](img/A335353_1_En_6_Chapter_Equ22.gif)\n\
  \n(6.22) 其中增益为：\n\n![ $$ {k}_r=m{\\sigma}² $$ ](img/A335353_1_En_6_Chapter_Equ23.gif)\n\
  \n(6.23)\n\n![ $$ {k}_{\\upsilon }=m\\zeta \\sigma $$ ](img/A335353_1_En_6_Chapter_Equ24.gif)\n\
  \n(6.24) `σ` 是**无阻尼自然频率**，`ζ` 是**阻尼比**。只要增益为正，该系统就始终稳定。如果 `F` 是恒定的，位置最终会稳定在一个偏移量上。这个偏移量为：\n\
  \n![ $$ r=\\frac{F}{m{\\sigma}²} $$ ](img/A335353_1_En_6_Chapter_Equ25.gif)\n\n\
  (6.25)\n\n这种控制设计方法被称为**“极点配置”**。\n\n几乎所有控制系统都是在数字计算机上实现的，因此你必须将此控制器转换为**数字形式**。假设你只测量位置。第一步是将控制部分组合成**连续时间状态空间形式**。在本实现中，你将为\
  \ PD 控制器添加一个**速率滤波器**。\n\n![ $$ \\omega ={\\omega}_r+2\\zeta {\\omega}_n $$ ](img/A335353_1_En_6_Chapter_Equ26.gif)\n\
  \n(6.26)\n\n![ $$ k={\\omega}_r{\\omega}_n²*m/w $$ ](img/A335353_1_En_6_Chapter_Equ27.gif)\n\
  \n(6.27)\n\n![ $$ \\tau =\\left(\\frac{m}{k}{\\omega}_n\\left({\\omega}_n+2\\zeta\
  \ {\\omega}_r\\right)-1\\right)/\\omega $$ ](img/A335353_1_En_6_Chapter_Equ28.gif)\n\
  \n(6.28)\n\n![ $$ a=-\\omega $$ ](img/A335353_1_En_6_Chapter_Equ29.gif)\n\n(6.29)\n\
  \n![ $$ b=\\omega $$ ](img/A335353_1_En_6_Chapter_Equ30.gif)\n\n(6.30)\n\n![ $$\
  \ c=-k\\omega \\tau $$ ](img/A335353_1_En_6_Chapter_Equ31.gif)\n\n(6.31)\n\n![ $$\
  \ d=k*\\left(\\tau \\omega +1\\right) $$ ](img/A335353_1_En_6_Chapter_Equ32.gif)\n\
  \n(6.32) 其中 `ω[r]` 是速率项上一阶滤波器的**截止频率**；`ω[n]` 是控制器的**无阻尼自然频率**；`ζ` 是控制器的**阻尼比**。`m`\
  \ 是**“质量”**或惯性。你通常可以将其设为 1，然后缩放控制输出。无阻尼自然频率给出了控制器的**带宽**。带宽越高，其对误差的响应越快。带宽越高，由恒定输入引起的偏移误差就越小。\n\
  \n![ $$ \\dot{x}= ax+bu $$ ](img/A335353_1_En_6_Chapter_Equ33.gif)\n\n(6.33)\n\n\
  ![ $$ y=-cx-du $$ ](img/A335353_1_En_6_Chapter_Equ34.gif)\n\n(6.34) `x` 是控制器状态，`u`\
  \ 是位置测量值。状态空间形式便于计算，但仍然假设你在**连续采样**。有许多方法可以将其转换为数字形式。你将使用**零阶保持器**，这意味着你将在每个采样周期计算控制量，并在该采样周期内保持该值。你可以使用\
  \ MATLAB 中的矩阵指数函数 `expm` 进行转换。如果 `T` 是采样周期，你可以构建矩阵：\n\n![ $$ \\sigma =\\left[\\\
  begin{array}{ll}aT\\hfill & bT\\hfill \\\\ {}0\\hfill & 0\\hfill \\end{array}\\\
  right] $$ ](A335353_1_En_6_Chapter_Equ35.gif)\n\n(6.35)\n\n`a` 和 `b` 的离散时间形式为：\n\
  \n![ $$ \\left[\\begin{array}{r}\\hfill {a}_d\\\\ {}\\hfill {b}_d\\end{array}\\\
  right]={e}^{\\sigma } $$ ](A335353_1_En_6_Chapter_Equ36.gif)\n\n(6.36)\n\n数字控制器现在为：\n\
  \n![ $$ {x}_{k+1}={a}_d{x}_k+{b}_d{u}_k $$ ](img/A335353_1_En_6_Chapter_Equ37.gif)\n\
  \n(6.37)\n\n![ $$ {y}_k=-c{x}_k-d{u}_k $$ ](img/A335353_1_En_6_Chapter_Equ38.gif)\n\
  \n(6.38)\n\n现在让我们看看 `PDControl`。该函数设计并实现了公式 6.26 中推导出的控制系统。其名称代表“比例-微分控制”。它有几个子函数。函数头如下所示。它包含一个指向其中一个子函数帮助文档的链接，当函数头在命令行显示时，该链接是活动的。你需要列出输入和输出的每个数据结构字段。\n\
  \n```\n%% PDCONTROL 设计和实现一个采样时间下的 PD 控制器。\n\n%% 形式\n\n% d = PDControl( 'struct'\
  \ )\n\n% d = PDControl( 'initialize', d )\n\n% [ y, d ] = PDControl( 'update', u,\
  \ d )\n\n%\n\n%% 描述\n\n% 设计一个 PD 控制器并以离散形式实现。\n\n%\n\n% y = -c*x - d*u\n\n% x =\
  \ a*x + b*u\n\n%\n\n% 其中 u 是输入，y 是输出。该控制器在微分项上具有一阶速率滤波器。\n\n%\n\n% 将模式设置为 initialize\
  \ 来为控制器创建状态空间矩阵。\n\n% 将模式设置为 update 来更新控制器并获取新的输出。\n\n%\n\n% 利用子函数 C2DZOH 进行离散化，参见\
  \ <a href=\"matlab: help PDControl> CToDZOH\">CToDZOH 帮助文档</a>\n\n%\n\n%% 输入\n\n\
  % mode (1,1) 'initialize' 或 'update'\n\n% u (1,1) 测量值\n\n% d (.) 数据结构\n\n% .m (1,1)\
  \ 质量\n\n% .zeta (1,1) 阻尼比\n\n% .wN (1,1) 无阻尼自然频率\n\n% .wD (1,1) 微分项滤波器截止频率\n\n%\
  \ .tSamp (1,1) 采样周期*\n\n% .x (1,1) 控制器状态\n\n%\n\n%% 输出\n\n% y (1,1) 控制量\n\n% d (.)\
  \ 数据结构的补充字段\n\n% .a (1,1) 状态转移矩阵\n\n% .b (1,1) 输入矩阵\n\n% .c (1,1) 状态输出矩阵\n\n% .d\
  \ (1,1) 前馈矩阵\n\n% .x (1,1) 更新后的控制器状态\n```\n\n接下来是函数体。注意其中的 `switch` 语句以及底部的两个子函数\
  \ `CToDZOH` 和 `DefaultStruct`。\n\n```\nfunction [y, d] = PDControl( mode, u, d )\n\
  \n% 演示\n\nif ( nargin < 1 )\n\ndisp('使用默认结构体进行 PDControl 演示')\n\nd = PDControl('struct');\n\
  \nd = PDControl('initialize',d);\n\ndisp(d)\n\nreturn\n\nend\n\nswitch lower (mode)\n\
  \ncase 'initialize'\n\nd = u;\n\nw = d.wD + 2*d.zeta*d.wN;\n\nk = d.wD*d.wNˆ2*d.m/w;\n\
  \ntau = ((d.m/k)*d.wN*(d.wN + 2*d.zeta*d.wD) - 1 )/w;\n\nd.a = -w;\n\nd.b = w;\n\
  \nd.c = -k*w*tau;\n\nd.d = k*(tau*w + 1);\n\n[d.a, d.b] = CToDZOH(d.a,d.b,d.tSamp);\n\
  \ny = d;\n\ncase 'update'\n\ny = -d.c*d.x - d.d*u;\n\nd.x = d.a*d.x + d.b*u;\n\n\
  case 'struct'\n\ny = DefaultStruct;\n\notherwise\n\nerror('%s 不是一个有效的模式',mode);\n\
  \nend\n\nfunction [f, g] = CToDZOH( a, b, T )\n\n%% CToDZOH\n\n% 使用零阶保持器进行连续到离散的变换。使用矩阵指数进行离散化，<\
  \ matlab:doc ('expm') expm >。\n\n%\n\n% [f, g] = C2DZOH( a, b, T )\n\n%\n\n% * 输入\
  \ *\n\n%\n\n% a (1,1) 连续系统矩阵\n\n% b (1,1) 输入矩阵\n\n% T (1,1) 时间步长\n\n%\n\n% * 输出\
  \ *\n\n%\n\n% f (1,1) 离散系统矩阵\n\n% g (1,1) 离散输入矩阵\n\n%\n\n% 另请参阅\n\n% expm\n\nq =\
  \ expm ([a*T b*T; zeros (1,2)]);\n\nf = q(1,1);\n\ng = q(1,2);\n\nfunction d = DefaultStruct\n\
  \nd.m = 1.0;\n\nd.zeta = 0.7;\n\nd.wN = 0.1;\n\nd.wD = 0.5;\n\nd.tSamp = 1.0;\n\n\
  d.x = 0.0;\n\nd.a = [];\n\nd.b = [];\n\nd.c = [];\n\nd.d = [];\n```\n\n这是我们工程函数的标准格式。以下是其重要特性：\n\
  \n-   它将设计和实现结合在一个函数中。\n-   它返回其所使用的默认数据结构。\n-   它具有多种模式。\n-   它具有内置演示。\n-   它包含嵌套函数。\n\
  \n内置演示使用了默认值。这些默认值让用户了解函数的合理参数。该内置演示生成状态空间矩阵，在本例中这些矩阵是标量。\n\n```\n使用默认结构体进行 PDControl\
  \ 演示\n\nm: 1\n\nzeta: 0.7000\n\nwN: 0.1000\n\nwD: 0.5000\n\ntSamp: 1\n\nx: 0\n\n\
  a: 0.5273\n\nb: 0.4727\n\nc: -0.0722\n\nd: 0.0800\n```\n\n本可以添加一个包含仿真的更复杂的演示。内置演示非常有用，因为它们向用户展示了如何使用该函数的简单示例。同时也有助于开发该函数，因为你只需在命令行中键入函数名即可测试该函数。\n\
  \n第一个参数是模式变量，它指示函数应该执行 `switch` 语句中的哪个`case`。必须先运行“initialize”模式。初始化会修改数据结构，该数据结构用作函数的内存。你也可以将持久变量用于函数内存。使用输出可以更方便地以编程方式检查内存内容。“update”模式用于在接收到新输入时更新控制器。`switch`\
  \ 语句包含一个“otherwise”情况，用于警告用户模式错误。这会抛出一个错误，停止脚本的执行。你可能并不总是希望这样做，而可能只使用警告来提醒用户。\n\n\
  嵌套函数 `CToDZOH` 使用公式 6.35 将连续控制系统转换为采样数据控制系统。其名称代表“连续到离散零阶保持器”（Continuous to Discrete\
  \ Zero-Order Hold）。非控制专家可能无法立即理解这个缩写，但展开后的名称又太长，不适合作为有用的函数名。\n\n**提示：** 使函数名称格式一致，并使用你所在领域的标准术语。请记住，并非所有代码读者都以英语为母语！\n\
  \n如果你正在构建一个工具箱，`CToDZOH` 函数很可能会是一个单独的文件。但对于本书而言，它仅由 `PDControl` 使用，因此你将其放入该函数文件中。\n\
  \n\n\n### 6.4 使用数字控制模拟双积分器\n\n#### 问题\n您希望模拟双积分器模型的数字控制。\n\n#### 解决方案\n您将编写一个脚本，在循环中顺序调用控制函数和积分函数，并绘制结果图。\n\
  \n#### 工作原理\n表 6-1 列出了您将在双积分器模拟中使用的控制参数的标称值。\n\n表 6-1. 控制参数\n\n| `Zeta` | 阻尼比 |\
  \ 1.0 |\n| --- | --- | --- |\n| `wN` | 无阻尼固有频率 | 0.1 弧度/秒 |\n| `wD` | 微分项滤波器截止频率\
  \ | 1.0 弧度/秒 |\n| `dT` | 时间步长 | 0.1 秒 |\n\n模拟脚本在 `DoubleIntegratorSim.m` 中实现。请注意，使用单元格分隔符将脚本划分为可以独立运行的部分。“另请参阅”部分列出了所使用的函数，当通过命令行帮助显示标头时，这些函数会显示为链接。\n\
  \n```\n%% 双积分器演示\n% 演示双积分器的控制。\n%% 另请参阅\n% PDControl, RungeKutta, RHSDoubleIntegrator,\
  \ TimeLabel\n%% 初始化\ntEnd = 100; % 模拟结束时间（秒）\ndT = 0.1; % 时间步长（秒）\naD = 1.0; % 扰动加速度（米/秒²）\n\
  controlIsOn = false; % 如果使用控制器，则为 true\nx = [0;0]; % [位置；速度]\n% 控制器参数\nd = PDControl(\
  \ 'struct' );\nd.zeta = 1.0;\nd.wN = 0.1;\nd.wD = 1.0;\nd.tSamp = dT;\nd = PDControl(\
  \ 'initialize', d );\n%% 模拟\nnSim = tEnd/dT+1;\nxPlot = zeros(3,nSim);\nfor k =\
  \ 1:nSim\n    if ( controlIsOn )\n        [u, d] = PDControl('update',x(1),d);\n\
  \    else\n        u = 0;\n    end\n    xPlot(:,k) = [x;u];\n    x = RungeKutta(\
  \ 'RHSDoubleIntegrator', 0, x, dT, aD+u );\nend\n%% 绘制结果\nyL = {'r (m)' 'v (m/s)'\
  \ 'u (m/s²)'};\n[t,tL] = TimeLabel(dT*(0:(nSim-1)));\nPlotSet( t, xPlot, 'x label',\
  \ tL, 'y label', yL );\n```\n\n第一个代码块设置了用户可以更改的模拟参数。如果希望使用控制器，则将 `controlIsOn` 变量设置为\
  \ `true`。这使得在不使用控制器的情况下测试脚本变得容易。当控制器被禁用时，您将得到“开环”响应。在测试控制器之前，确保开环响应合理是一个好习惯。\n\n\
  **提示：** 将所有用户可以更改的参数放置在脚本的开头。\n\n第二个代码块设置了控制器。回想一下，`PDControl` 有三个参数：`'struct'`、`'initialize'`、`'update'`。第一个参数返回函数所需的数据结构。在该语句之后的行中，您使用为问题选择的值填充结构体字段。在此代码块末尾，您初始化了控制器。这将把控制器状态设置为零，并创建采样时间状态空间矩阵，在本例中为四个标量。\n\
  \n第三个代码块是模拟过程，其中包含检查控制器是否开启的语句。请注意控制函数之后紧接着积分器的顺序使用。这是离散控制，因为控制量 `u` 在积分时间步长内是恒定的。最后一个代码块绘制了结果。\n\
  \n图 6-1 展示了通过将 `controlIsOn` 标志设置为 `false` 并执行 `DoubleIntegratorSim` 所获得的开环响应。速度呈线性增加，位置随时间平方增加，符合预期。输出结果与公式\
  \ 6.16 中的解析解一致。图 6-2 展示了将 `controlIsOn` 设置为 `true` 时的闭环响应。速度降至零，位置达到一个常数（非零）。控制加速度\
  \ `u` 精确匹配扰动加速度 `a`。您本可以使用比例积分微分（PID）控制器来消除位置偏移。\n\n![A335353_1_En_6_Fig2_HTML.gif](img/A335353_1_En_6_Fig2_HTML.gif)\n\
  图 6-2. 在 1 米/秒² 恒定扰动加速度下的闭环响应\n\n![A335353_1_En_6_Fig1_HTML.gif](img/A335353_1_En_6_Fig1_HTML.gif)\n\
  图 6-1. 在 1 米/秒² 恒定扰动加速度下的开环响应\n\n这两个示例表明，模拟在没有控制的情况下也能工作，并且控制按预期执行。此脚本是对标头中列出的所有函数的集成测试。它在测试这些函数的功能方面表现良好。然而，一次测试不足以理解控制器。让我们通过将域\
  \ `d.zeta` 中的 ζ 设置为 0.2 来使控制器欠阻尼。现在响应开始振荡（见图 6-3）。您将 `tEnd` 设置为 300 以显示其阻尼过程。\n\n\
  ![A335353_1_En_6_Fig3_HTML.gif](img/A335353_1_En_6_Fig3_HTML.gif)\n图 6-3. 在 1 米/秒²\
  \ 恒定扰动加速度且 ζ 等于 0.2 时的闭环响应\n\n另一件可以尝试的事情是将带宽设置得非常高。将域 `d.wN` 中的 ω[n] 设置为 8，将速率滤波器带宽\
  \ `d.wD` 设置为 50。结果如图 6-4 所示。控制器变得不稳定，因为带宽远高于采样率所允许的值。\n\n![A335353_1_En_6_Fig4_HTML.gif](img/A335353_1_En_6_Fig4_HTML.gif)\n\
  图 6-4. 使用过高的带宽进行采样时的闭环响应\n\n您的带宽必须小于采样带宽的一半，采样带宽为\n\n![$$ {\\omega}_s=\\frac{2\\\
  pi }{T} $$](img/A335353_1_En_6_Chapter_Equ39.gif) (6.39)\n\n所有结果均为预期行为。最后一种情况是所谓的边缘或极端情况，表明预期的失稳确实会发生。对于这个公认的简单控制系统示例，这四种情况构成了最小化的测试集。\n\
  \n### 6.5 使用合理的时间单位创建时间轴\n\n#### 问题\n您希望时间轴具有易于读取的单位，而不仅仅是秒。\n\n#### 解决方案\n您将创建一个函数，检查时间跨度并将秒转换为分钟、小时、天或年。\n\
  \n#### 工作原理\n您检查时间数组中的最大时间，并将其缩放到更大的时间单位。实现的时间单位包括秒、分钟、小时、天和年。您返回缩放后的时间向量、标签字符串和单位字符串，因为这些信息可能有用。\n\
  \n```\nfunction [t, c, s] = TimeLabel( t )\nsecInYear = 365.25*86400;\nsecInDay\
  \ = 86400;\nsecInHour = 3600;\nsecInMinute = 60;\ntMax = max(t);\nif ( tMax > secInYear\
  \ )\n    c = 'Time (years)';\n    s = 'years';\n    t = t/secInYear;\nelseif ( tMax\
  \ > 3*secInDay )\n    c = 'Time (days)';\n    t = t/secInDay;\n    s = 'days';\n\
  elseif ( tMax > 3*secInHour )\n    c = 'Time (hours)';\n    t = t/secInHour;\n \
  \   s = 'hours';\nelseif ( tMax > 3*secInMinute )\n    c = 'Time (min)';\n    t\
  \ = t/secInMinute;\n    s = 'min';\nelse\n    c = 'Time (sec)';\n    s = 'sec';\n\
  end\n```\n\n### 6.6 创建具有多个子图的图形\n\n#### 问题\n在控制分析过程中，您经常需要生成具有多个子图的图形，这会导致每个脚本底部出现大量重复代码块。\n\
  \n#### 解决方案\n您创建一个函数，可以轻松地用一行代码生成子图。\n\n\n\n"
- "# 工作原理\n\n您将编写一个函数，该函数使用参数对，在单次函数调用中灵活地创建子图图形。`y` 输入可以有多个行，而 `x` 输入可以有一行，或者与 `y`\
  \ 相同的行数。您提供默认标签，以便只需两个输入即可调用该函数。\n\n此版本支持的参数仅有各种标签和绘图类型——标准 `plot`、`semilogx`、`semilogy`\
  \ 和 `loglog`——但您可以轻松地添加线条粗细、绘图标记、阴影等功能。您使用一个 `for` 循环，在 `switch` 语句中检查 `varargin`\
  \ 的每隔一个分量。请记住，`varargin` 提供了一个元胞数组参数。\n\n请注意使用了一个内置演示，展示了函数的两个主要分支，分别用于一个 `x` 序列和两个序列的情况。\n\
  \n绘图代码根据 `x` 和 `y` 的行数，在图形中为每个图创建子图。该函数假设子图排成单列，但您可以扩展逻辑以创建多列或任何适合您应用的子图排列。网格是开启的。\n\
  \n```\nfunction PlotSet( x, y, varargin )\n\n% 演示\n%-----\nif ( nargin < 1 )\n \
  \   x = linspace(1,1000);\n    y = [ sin(0.01*x); cos(0.01*x)];\n    disp('PlotSet:\
  \ 一个 x 和两个 y 行')\n    PlotSet( x, y )\n    disp('PlotSet: 两个 x 和两个 y 行')\n    PlotSet(\
  \ [x;y(1,:)], y )\n    return ;\nend\n\n% 默认值\nnCol = 1;\nn = size(x,1);\nm = size(y,1);\n\
  yLabel = cell (1,m);\nxLabel = cell (1,n);\nplotTitle = cell (1,n);\nfor k = 1:m\n\
  \    yLabel{k} = 'y';\nend\nfor k = 1:n\n    xLabel{k} = 'x';\n    plotTitle{k}\
  \ = 'y vs. x';\nend\nfigTitle = 'PlotSet';\nplotType = 'plot';\n\n% 处理输入参数\nfor\
  \ k = 1:2:length(varargin)\n    switch lower( varargin{k} )\n        case 'x label'\n\
  \            for j = 1:n\n                xLabel{j} = varargin{k+1};\n         \
  \   end\n        case 'y label'\n            temp = varargin{k+1};\n           \
  \ if ( ischar(temp) )\n                yLabel{1} = temp;\n            else\n   \
  \             yLabel = temp;\n            end\n        case 'plot title'\n     \
  \       plotTitle{1} = varargin{k+1};\n        case 'figure title'\n           \
  \ figTitle = varargin{k+1};\n        case 'plot type'\n            plotType = varargin{k+1};\n\
  \        otherwise\n            fprintf(1,'%s 不是允许的参数\\n',varargin{k});\n    end\n\
  end\n\nh = figure ;\nset( h,'Name',figTitle );\n\n% 第一种路径：x 只有一行\nif ( n == 1 )\n\
  \    for k = 1:m\n        subplot( m,nCol,k );\n        plotXY(x,y(k,:),plotType);\n\
  \        xlabel( xLabel{1} );\n        ylabel( yLabel{k} );\n        if ( k == 1\
  \ )\n            title( plotTitle{1} )\n        end\n        grid on\n    end\n\
  else\n    for k = 1:n\n        subplot( n,nCol,k );\n        plotXY(x(k,:),y(k,:),plotType);\n\
  \        xlabel( xLabel{k} );\n        ylabel( yLabel{k} );\n        title( plotTitle{k}\
  \ )\n        grid on\n    end\nend\n\n%% 实现不同的绘图类型\nfunction plotXY(x,y, type )\n\
  \    switch type\n        case 'plot'\n            plot( x,y );\n        case {'log'\
  \ 'loglog' 'log log'}\n            loglog( x,y );\n        case {'xlog' 'semilogx'\
  \ 'x log'}\n            semilogx( x,y );\n        case {'ylog' 'semilogy' 'y log'}\n\
  \            semilogy( x,y );\n        otherwise\n            error( '%s 不是可用的绘图类型',\
  \ type );\n    end\n```\n\n该函数允许 `DoubleIntegratorSim.m` 用一行代码生成其图形。\n\n"
- '# 总结


  双积分器是开发控制系统时一个非常有用的模型，因为它代表了许多系统的理想版本，例如附在质量块上的弹簧。在本章中，您建立了双积分器的数学模型，并在一个右侧函数中编写了动力学方程。您了解了数值积分，并编写了
  `Runge-Kutta` 积分器，该积分器将用于本书后续的应用中。控制函数的配方结合了设计和实现，包含一个内置演示，并定义了一个在调用之间用于存储的数据结构。第一个演示脚本展示了如何初始化一个用于双积分器的控制器，进行仿真，并绘制结果。表
  6-2 列出了本章中开发的代码。这几乎是您在 MATLAB 中进行任何数学或控制分析的基础！


  **表 6-2. 章节代码清单**


  | 文件 | 描述 |

  | --- | --- |

  | `RHSDoubleIntegrator` | 双积分器的动力学模型。 |

  | `RungeKutta` | 四阶龙格-库塔积分器。 |

  | `PDControl` | 比例-微分控制器。 |

  | `DoubleIntegratorSim` | 使用离散控制的双积分器仿真。 |

  | `PlotSet` | 从数据集创建二维图形。 |

  | `TimeLabel` | 生成时间标签和缩放后的时间向量。 |


