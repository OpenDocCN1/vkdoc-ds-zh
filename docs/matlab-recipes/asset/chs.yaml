- "# 4. 交互式图形\n\n电子补充材料：本章的在线版本 (doi: [10.1007/978-1-4842-0559-4_4](http://dx.doi.org/10.1007/978-1-4842-0559-4_4))\
  \ 包含补充材料，供授权用户使用。\n\n上一章介绍了静态图形的生成。本章提供了生成动态图形的方案。这包括线条和面片对象的动画；在图形中使用 `uicontrol`\
  \ 对象；使用 GUIDE 开发环境设计 GUI；以及将 GUI 部署为 MATLAB 应用程序。我们还提供了一些技巧，以最大限度地提高动态图形函数的性能。\n\
  \n## 4.1 创建简单动画\n\n### 问题\n\n你需要一种随时间变化的可视化效果，而不希望生成数百个不同的图形。\n\n### 解决方案\n\n你可以通过在循环中连续更新图形中的面片对象来创建动画。图\
