- "# 10.3 控制排放 pH 值\n\n## 问题\n\n当酸或碱的流量发生变化时，您想要控制混合罐中的 pH 水平。\n\n## 解决方案\n\n您将改变碱流\
  \ `i = 3` 的流量，以维持 pH 值。这意味着使用比例积分控制器来改变 `q[3]` 的值。这使得您能够处理阶跃扰动。\n\n## 工作原理\n\n比例积分控制器的形式为\n\
  \n![ $$ u=K\\left(1+\\frac{1}{\\tau }{\\displaystyle \\int}\\right)y $$ ](img/A335353_1_En_10_Chapter_Equ10.gif)\n\
  \n(10.10) 其中 `u` 是控制量，`y` 是被测量，`τ` 是积分器时间常数，`K` 是前向（比例）增益。控制量为 `u = q[3]`，被测量为 `y\
  \ = pH`。这里有一个控制量 `q[3]` 和一个输出量 `pH`，这构成了一个单输入/单输出过程。然而，`q[3]` 与 `pH` 之间的关联涉及三个动态状态：`h`、`Wa[4]`\
  \ 和 `Wb[4]`。这些状态与 `pH` 之间的关系是非线性的。另一个问题是 `q[3]` 不能为负；也就是说，您不能从罐中抽取碱液。如果平衡状态下的 `q[3]`\
  \ 足够高，这通常不会构成问题。\n\n尽管存在这些潜在问题，但这个非常简单的控制器对于相当大范围的扰动仍然有效。平衡值通过一个包含比例项和积分项的扰动输入。积分项使用简单的欧拉积分法。完整脚本将在下一个方案中描述；此处重点关注实现控制功能的几行代码。\n\
  \n控制变量定义如下。pH 设定值为中性；即 pH 值为 7。`kF` 是前向增益，`tau` 是来自方程 10.10 的时间常数，分别设置为 2 和 60 秒。`q3Set`\
  \ 是碱液流量额定设定点，取自参考文献。\n\n```\n%% 控制设计\npHSet = 7.0;\ntau = 60.0;  % (秒)\nkF = 2.0;\
  \    % 前向增益\nq3Set = 15.6; % (毫升/秒)\n```\n\n以下代码片段展示了在循环中实现的逻辑。误差计算为模型计算的 pH 测量值与\
  \ pH 设定值之间的差值。注意欧拉积分法，其中 `intErr` 通过简单地使用时间步长乘以误差来更新。同时注意有一个标志位 `controlIsOn`，它允许您在开环（不施加控制）状态下运行脚本。\n\
  \n```\n% 比例积分控制\nerr = pH - pHSet;\nif controlIsOn\n    d.q3 = q3Set - kF*(err +\
  \ intErr/tau);\n    intErr = intErr + dT*err;\nelse\n    d.q3 = q3Set;\nend\n```\n\
  \n为了严格确定此问题的前向增益和时间常数，您需要将工作点处的仿真右侧函数线性化，并进行严格的单输入/单输出控制设计，这涉及伯德图、根轨迹图和其他技术。这超出了本书的范围。目前，只需选择能产生合理响应的值即可。\n\
  \n"
- "# 10.4 模拟带控制的 pH 过程\n\n## 问题\n\n您想要模拟搅拌罐，混合三种流（酸、缓冲液和碱），以演示对 pH 水平的控制。碱流是对缓冲液和酸流扰动的控制变量。\n\
  \n## 解决方案\n\n编写一个包含控制器的脚本 `PHProcessSim`，并从平衡状态开始仿真。使用前一个方案中推导的比例积分控制器。脚本的结构允许您在酸流和/或缓冲液流中插入脉冲。\n\
  \n## 工作原理\n\n扰动 `d` 是 `q[1]` 和 `q[2]` 的偏差，\n\n![ $$ d=\\left[\\begin{array}{r}\\\
  hfill {q}_1\\\\ {}\\hfill {q}_2\\end{array}\\right] $$ ](A335353_1_En_10_Chapter_Equ11.gif)\n\
  \n(10.11) 它们分别是酸流和缓冲液流。碱流是 `q[3]`，混合排放物的反应不变量是 `Wa[4]` 和 `Wb[4]`。\n\n首先指定脚本的用户输入。您将其置于平衡状态，并将研究稳态附近的小扰动。有一个标志位\
  \ `controlIsOn` 用于打开或关闭控制系统。时间步长和持续时间通过迭代几个值来确定。\n\n```\n%% 用户输入\n% 时间 (秒)\ntEnd\
  \ = 60*60;\ndT = 1.0;\n\n% 状态\nwA4 = -4.32e-4;  % 排放流反应不变量 A (M)\nwB4 = 5.28e-4;\
  \   % 排放流反应不变量 B (M)\nh = 14.0;        % 液位 (厘米)\n\n% 闭环或开环\ncontrolIsOn = true;\n\
  ```\n\n扰动被建模为作用于 `d.q1` 和 `d.q2` 的脉冲。用户参数是脉冲的大小和开始/停止时间。这种设置允许您运行与参考文献类似的案例。\n\n\
  ```\n% 扰动\n% 脉冲将根据 tPulse 的开始和结束时间施加：\n% q1 = q10 + deltaQ1; and q2 = q20 + deltaQ2;\n\
  % 小脉冲：q2 中 0.65 毫升/秒\n% 大脉冲：2.0 毫升/秒\n% 非常大脉冲：8.0 毫升/秒\ndeltaQ1 = 8.0;   % +/- 1.5\n\
  deltaQ2 = 0.0;   % 0.65 1.45 0.45 - 0.55 % 来自参考文献的值\ntPulse1 = [5 15]*60;\n```\n\
  \n在脚本的其余部分，您获取前几个方案中定义的数据结构，指定控制参数，并创建仿真循环。假设不变量测量值是精确的；在实际应用中，它们需要被估计。然而，您应该始终先在理想条件下测试控制器，以了解其行为，避免复杂化。pH\
  \ 测量使用来自方案 10-2 的 `PHSensor` 进行建模。过程的右侧函数在方案 10-1 中定义。积分使用第 6 章定义的 `RungeKutta`\
  \ 函数执行。\n\n```\n%% 数据格式\ndSensor = PHSensor('struct');\nd = RHSpH;\n\n%% 控制设计\n\
  pHSet = 7.0;\ntau = 60.0;   % (秒)\nkF = 2.0;     % 前向增益\nq3Set = 15.6; % (毫升/秒)\n\
  q10 = d.q1;\nq20 = d.q2;\n\n%% 运行仿真\n% 仿真步数\nn = ceil(tEnd/dT);\n% 绘图数组\nxP = zeros(7,n);\n\
  t = (0:n-1)*dT;\n% 初始状态\nx = [wA4;wB4;h];\nintErr = 0;\n\nfor k = 1:n\n    % 测量\n\
  \    dSensor.wA4 = x(1);\n    dSensor.wB4 = x(2);\n    pH = PHSensor( x, dSensor\
  \ );\n    \n    % 比例积分控制\n    err = pH - pHSet;\n    if controlIsOn\n        d.q3\
  \ = q3Set - kF*(err + intErr/tau);\n        intErr = intErr + dT*err;\n    else\n\
  \        d.q3 = q3Set;\n    end\n    \n    % 扰动\n    if ( t(k) > tPulse1(1) && t(k)\
  \ < tPulse1(2) )\n        d.q1 = q10 + deltaQ1;\n    else\n        d.q1 = q10;\n\
  \    end\n    \n    if ( t(k) > tPulse2(1) && t(k) < tPulse2(2) )\n        d.q2\
  \ = q20 + deltaQ2;\n    else\n        d.q2 = q20;\n    end\n    \n    % 存储数据供绘图\n\
  \    xP(:,k) = [x;pH;d.q1;d.q2;d.q3];\n    \n    % 积分一步\n    x = RungeKutta( @RHSpH,\
  \ 0, x, dT, d );\nend\n\n%% 绘图\n[t,tL] = TimeLabel(t);\nyL = {'W_{a4}' 'W_{b4}'\
  \ 'h' 'pH' 'q_1' 'q_2' 'q_3'};\ntTL = 'pH 过程控制';\nif ~controlIsOn\n    tTL = [tTL\
  \ ' - 开环'];\nend\nPlotSet( t, xP,'x label',tL,'y label',yL,'plot title',tTL,'figure\
  \ title',tTL)\nPlotSet( t, xP([4 7],:),'x label',tL,'y label',yL([4 7]),'plot title',tTL,'figure\
  \ title',tTL)\n```\n\n现在，您将给出使用不同脉冲运行此脚本的结果。标准图会显示所有三个状态：测量的 pH 值、酸、碱和缓冲液的流量。一个更紧凑的图只显示\
  \ pH 值和 `q[3]` 的命令值。我们在绘图代码中添加了一行，用于修改开环响应时的图标题，这样如果您重复运行脚本，可以更容易地识别图表。\n\n**提示**：使用您的控制标志和字符串变量来自定义您的图名称。\n\
  \n\n\n图 10-4 展示了在完全没有扰动的情况下运行 30 分钟仿真后的闭环响应。可以看到，参考值并未产生精确的平衡，但所达到的数值非常接近。反应不变量\
  \ `W[b4]` 的变化小于 `0.005 × 10^(−4)`，液位 `h` 变化小于 `0.1 cm`，而碱液流量 `q[3]` 的变化约为 `0.05\
  \ ml/s`。这相当于一个非常小的阶跃响应。请注意，稳定时间约为 5 分钟。这些结果让您有信心确信代码编写正确。您将在接下来的仿真中（在施加扰动之前）看到这一初始响应。\n\
  \n![A335353_1_En_10_Fig4_HTML.gif](img/A335353_1_En_10_Fig4_HTML.gif)\n\n**图 10-4.**\
  \ 无扰动的闭环响应\n\n接下来，图 10-5 展示了缓冲流中加入一个从 20 分钟开始、40 分钟结束的 `0.65 ml/s` 脉冲时的开环响应。请注意，pH\
  \ 值上升至接近 7.4，而 `q[3]` 实际上保持在设定值不变。图 10-6 展示了 pH 值和碱液流量 `q[3]` 的闭环暂态过程。pH 值的上升被限制在\
  \ 7.2 以下，并且 pH 值和碱液流量在脉冲开始和结束后的约 10 分钟内达到平衡。这与参考资料中对比自适应和非自适应非线性控制方案的图表相比，结果令人满意。\n\
  \n![A335353_1_En_10_Fig6_HTML.gif](img/A335353_1_En_10_Fig6_HTML.gif)\n\n**图 10-6.**\
  \ 在`q2` 中加入 `0.65 ml/s` 脉冲时控制器的性能\n\n![A335353_1_En_10_Fig5_HTML.gif](img/A335353_1_En_10_Fig5_HTML.gif)\n\
  \n**图 10-5.** 在`q2` 中加入 `0.65 ml/s` 脉冲时的开环响应\n\n图 10-7 展示了在 `q[1]` 和 `q[2]` 中分别施加\
  \ `2 ml/s` 的较大偏移量扰动时的暂态过程。`q[1]` 的脉冲从 5 分钟持续到 15 分钟，`q[2]` 的脉冲从 25 分钟持续到 40 分钟。图\
  \ 10-8 仅绘制了 pH 值和控制流量 `q[3]` 的图。\n\n![A335353_1_En_10_Fig8_HTML.gif](img/A335353_1_En_10_Fig8_HTML.gif)\n\
  \n**图 10-8.** `q1` /`q2` 扰动结果的放大图\n\n![A335353_1_En_10_Fig7_HTML.gif](img/A335353_1_En_10_Fig7_HTML.gif)\n\
  \n**图 10-7.** 在`q1` 和 `q2` 中加入 `2 ml/s` 的大扰动时控制器的性能\n\n图 10-9 展示了在 `q[2]` 中加入一个从\
  \ 5 分钟到 35 分钟、幅值为 `8 ml/s` 的极大扰动时的暂态过程。控制器的工作效果不再理想，其稳定时间比之前的示例长得多，并且在脉冲结束时碱液流量\
  \ `q[3]` 仍在下落。一个 `10 ml/s` 的脉冲值会导致仿真“失控”或产生虚数。始终有必要了解非线性系统中控制性能的极限。\n\n![A335353_1_En_10_Fig9_HTML.gif](img/A335353_1_En_10_Fig9_HTML.gif)\n\
  \n**图 10-9.** 在`q[2]` 中加入极大扰动 (8 `ml/s`) 时控制器的性能\n\n最后，由于您使用的是数值优化例程，因此对仿真进行分析，以确定花在\
  \ `fzero` 上的执行时间比例是很有启发性的。可以通过命令窗口中名为“运行并计时”的按钮访问探查器。运行 pH 仿真后的摘要如图 10-10 所示。在仿真花费的近\
  \ 19 秒中，有整整 12.6 秒用在了 `fzero` 本身内部。积分仅花费了 4.4 秒，其中 3.4 秒用于右侧函数。该摘要包含指向各个函数的超链接，这些函数已按行计时。图\
  \ 10-11 显示了在 `fzero` 内部花费的时间，除了绝对时间外，还计算了百分比。目标函数 `PHSensor` > `Fun` 被调用了 56,131\
  \ 次，仅耗时 1.27 秒（占执行时间的 10%）。相当多的时间花费在了 `sprintf` 和 `optimget` 上。\n\n![A335353_1_En_10_Fig11_HTML.gif](img/A335353_1_En_10_Fig11_HTML.gif)\n\
  \n**图 10-11.** `fzero` 的探查器结果\n\n![A335353_1_En_10_Fig10_HTML.gif](img/A335353_1_En_10_Fig10_HTML.gif)\n\
  \n**图 10-10.** 仿真的探查器摘要\n\n**提示**  \n在实现数值搜索或优化例程时，请务必使用探查器运行一次。这能让您深入了解使用的迭代次数以及代码中任何未发现的错误。\n\
  \n在此例中，没有太多可以优化的地方，因为大部分时间都花费在 `fzero` 本身，而不是目标函数上，但如果不进行分析，您不会知道这一点。每当您使用数值工具，并且脚本或函数运行时间超过一两秒时，就有必要使用探查器进行分析。\n\
  \n## 总结\n\n本章演示了如何为化学过程编写动力学方程并实现一个简单的控制律。该过程是高度非线性的，但您可以通过一个简单的比例积分控制器来控制该过程。pH\
  \ 传感器没有闭式解，您需要使用 MATLAB 的 `fzero` 函数从不变式中找到 pH 值。本章还演示了如何使用 MATLAB 绘图函数 `mesh` 和\
  \ `surf` 来显示三维数据。您使用了一个仿真脚本来评估控制器在各种条件下的性能，并在探查器中运行该脚本以分析花在数值例程上的时间。表 10-1 列出了本章开发的代码。\n\
  \n**表 10-1.** 章节代码列表\n\n| 文件 | 描述 |\n| --- | --- |\n| `PHSensor` | 模拟混合过程的 pH 值测量。\
  \ |\n| `PHProcessSim` | pH 中和过程的仿真。 |\n| `RHSpH` | 化学混合过程的动力学。 |\n| `SensorTest`\
  \ | 用于测试传感器算法的脚本。 |\n\n**脚注**\n\n1 Henson, M. A. 和 D. E. Seborg, *《非线性过程控制》*, Prentice-Hall,\
  \ 1997 年。\n\n2 Henson, M. 和 D. Seborg, “pH 中和过程的自适应非线性控制”，《IEEE 控制系统技术汇刊》，第 2 卷，第\
  \ 3 期，1994 年 8 月。\n\n"
- "# 11. 飞机\n\n电子补充材料：本章的在线版本 (doi:[10.1007/978-1-4842-0559-4_11](http://dx.doi.org/10.1007/978-1-4842-0559-4_11))\
  \ 包含授权用户可获取的补充材料。\n\n我们的飞机模型是一个三维质点。该模型仅模拟三个维度上的平动动力学。平动是指在 x、y 和 z 方向上的运动。飞机通过改变其相对于风向的姿态（倾斜和迎角）以及改变其发动机产生的推力来控制其运动。在我们的模型中，我们假设飞机能够为了控制目的而瞬间改变其姿态和推力。这简化了我们的模型，但同时也使我们能够模拟大多数飞机操作，例如起飞、水平飞行和着陆。我们还假设飞机的质量不随时间变化。\n\
  \n## 11.1 创建飞机的动态模型\n\n### 问题\n\n您需要一个数值模型来模拟飞机在大气中的三维轨迹。该模型应允许您演示从起飞到着陆的飞机控制过程。\n\
  \n### 解决方案\n\n您将使用飞行路径坐标构建一个六状态模型。控制量将是滚转角、迎角和推力。您不会模拟飞机的姿态动力学。如果您想模拟飞机改变迎角和滚转角所需的时间，那么姿态动力学是必需的。在我们的模型中，您假设飞机可以瞬间改变迎角、滚转角和推力。\n\
  \n\n\n### 工作原理\n\n我们的飞行器将具有六个状态量，用于在三维空间中模拟速度和位置，以及三个控制量。这三个控制量分别是滚转角 `φ`、攻角 `α`\
  \ 和推力 `T`。你不会将笛卡尔坐标及其时间导数（即速度）用作状态量；相反，你将使用航迹坐标。图 11-1 展示了二维情况下的航迹坐标。滚转角 `φ` 是绕\
  \ x 轴的旋转，航向角 `ψ` 垂直于纸面。阻力 `D` 与速度矢量方向相反。\n\n![A335353_1_En_11_Fig1_HTML.jpg](img/A335353_1_En_11_Fig1_HTML.jpg)\n\
  \n**图 11-1.** 二维航迹坐标\n\n攻角 `α` 用于调节升力 `L` 和阻力。推力矢量 `T` 与机体 x 轴对齐。航迹角 `γ` 是 x 轴与速度矢量\
  \ `V` 之间的夹角。状态矢量 `s` 为：\n\n![ $$ s=\\left[\\begin{array}{r}\\hfill v\\\\ {}\\hfill\
  \ \\gamma \\\\ {}\\hfill \\psi \\\\ {}\\hfill x\\\\ {}\\hfill y\\\\ {}\\hfill h\\\
  end{array}\\right] $$ ](A335353_1_En_11_Chapter_Equ1.gif)\n\n(11.1) 其中 `v` 是速度大小；`γ`\
  \ 是 xz 平面内的航迹角；`ψ` 是 xy 平面内的航向角；`x`、`y`、`h` 是笛卡尔坐标。`h` 是高度，即 z 坐标。动力学方程为：\n\n![\
  \ $$ \\left[\\begin{array}{r}\\hfill \\dot{v}\\\\ {}\\hfill \\dot{\\gamma}\\\\ {}\\\
  hfill \\dot{\\psi}\\\\ {}\\hfill \\dot{x}\\\\ {}\\hfill \\dot{y}\\\\ {}\\hfill \\\
  dot{h}\\end{array}\\right]=\\left[\\begin{array}{l}\\frac{T \\cos \\alpha -D}{m}-g\
  \ \\cos \\gamma \\hfill \\\\ {}\\frac{\\left(L+T \\sin \\alpha \\right) \\cos \\\
  phi - mg \\cos \\gamma }{mv}\\hfill \\\\ {}\\frac{\\left(L+T \\sin \\alpha \\right)\
  \ \\sin \\phi }{mv \\cos \\gamma}\\hfill \\\\ {}v \\cos \\gamma \\cos \\psi \\hfill\
  \ \\\\ {}v \\cos \\gamma \\sin \\psi \\hfill \\\\ {}v \\sin \\gamma \\hfill \\end{array}\\\
  right] $$ ](A335353_1_En_11_Chapter_Equ2.gif)\n\n(11.2) 其中 `g` 是重力加速度，`m` 是质量，`D`\
  \ 是阻力，`L` 是升力。定义动压为：\n\n![ $$ q=\\frac{1}{2}\\rho {v}² $$ ](img/A335353_1_En_11_Chapter_Equ3.gif)\n\
  \n(11.3) 其中 `ρ` 是大气密度。我们简单的升力和阻力模型为：\n\n![ $$ D=q\\left({C}_{D_0}+k{C}_L²\\right)\
  \ $$ ](img/A335353_1_En_11_Chapter_Equ4.gif)\n\n(11.4)\n\n![ $$ L=q{C}_L $$ ](img/A335353_1_En_11_Chapter_Equ5.gif)\n\
  \n(11.5)\n\n![ $$ {C}_L={C}_{L_{\\alpha }}\\alpha $$ ](img/A335353_1_En_11_Chapter_Equ6.gif)\n\
  \n(11.6)\n\n第一个方程称为阻力极线。`C_D0` 是零升力时的阻力。`k` 是升力-阻力耦合系数。`s` 是浸润面积。此升力模型仅适用于小攻角 `α`，因为它未考虑失速——失速是指气流从机翼分离，升力迅速降至零的情况。\n\
  \n实现这些方程的函数是我们的 `RHS` 函数，名为 `RHSAircraft`。请注意，当方程 11.2 中 `v = 0` 时，这些方程存在奇点。函数头提供了关于该奇点的警告。\n\
  \n```\n%% RHSAIRCRAFT 六自由度质点飞行器模型。\n%% 格式：\n% d = RHSAircraft;\n% [sDot, D, LStar]\
  \ = RHSAircraft( t, s, d )\n%% 描述\n% 计算质点飞行器的右侧函数。若调用时不带任何参数，则返回默认数据结构。\n% 当 v =\
  \ 0 时， sDot(2) 和 sDot(3) 将为无穷大。默认的大气模型是\n% AtmosphericDensity，该模型使用指数大气模型。\n%\n\
  %% 输入\n% t (1,1) 时间（未使用）\n% s (6,1) 状态矢量 [v;gamma;psi;x;y;h]\n% d (.) 数据结构\n% .m\
  \ (1,1) 飞行器质量\n% .g (1,1) 重力加速度\n% .thrust (1,1) 推力\n% .alpha (1,1) 攻角\n% .phi (1,1)\
  \ 滚转角\n% .s (1,1) 表面积\n% .cD0 (1,1) 零升力阻力\n% .k (1,1) 升力-阻力耦合项\n% .cLAlpha (1,1)\
  \ 升力系数\n% .density (1,1) 指向大气密度函数的函数句柄\n%\n%% 输出\n% sDot (6,1) 状态矢量导数 d[v;gamma;psi;x;y;h]/dt\n\
  % D (1,1) 阻力\n% LStar (1,1) 升力/攻角\n```\n\n接下来是函数体。由于各项比较简单，将状态导数 `sDot` 组装成一个数组。为了提高可读性，每个元素单独一行。返回\
  \ `D` 和 `LStar` 作为辅助输出，供平衡计算使用。\n\n```\nfunction [sDot, D, LStar] = RHSAircraft(\
  \ ~, s, d )\n\n% 默认数据结构\nif ( nargin == 0 )\n    sDot = struct('m',5000, 'g', 9.806,\
  \ 'thrust',0,'alpha',0, 'phi',0,...\n        'cLAlpha',2*pi,'cD0',0.006,'k',0.06,'s',20,'density',...\n\
  \        @AtmosphericDensity);\n    return\nend\n\n% 保存为局部变量\nV = s(1);\ngamma =\
  \ s(2);\npsi = s(3);\nh = s(6);\n\n% 三角函数\ncG = cos(gamma);\nsG = sin(gamma);\n\
  cPsi = cos(psi);\nsPsi = sin(psi);\ncB = cos(d.phi);\nsB = sin(d.phi);\n\n% 指数大气模型\n\
  rho = feval(d.density,h);\n\n% 升力和阻力\nqS = 0.5*rho*d.s*v²;   % 动压\ncL = d.cLAlpha*d.alpha;\n\
  cD = d.cD0 + d.k*cL²;\nLStar = qS*d.cLAlpha;\nL = qS*cL;\nD = qS*cD;\n\n% 速度导数\n\
  % sDot 是 d[v;gamma;psi;x;y;h]/dt\nlT = L + d.thrust*sin(d.alpha);\nsDot = [ (d.thrust*cos(d.alpha)\
  \ - D)/d.m - d.g*sG;...\n         (lT*cB - d.m*d.g*cG)/(d.m*v);...\n         lT*sB/(d.m*v*cG);...\n\
  \         v*cPsi*cG;...\n         v*sPsi*cG;...\n         v*sG];\n```\n\n更复杂的右侧函数会为阻力和升力计算传入函数句柄，从而允许用户使用自己的模型。我们为大气密度计算传入了一个函数句柄，以允许用户选择自己的密度函数。我们本可以对气动模型也采用同样的做法。这将使\
  \ `RHSAircraft` 更加灵活。\n\n请注意，我们必须编写一个大気密度模型 `AtmosphericDensity`，作为 `RHS` 函数的默认值。该模型使用指数方程计算密度，这是最简单的表示形式。该函数自带一个模型演示，绘图时使用了对数刻度。\n\
  \n```\n%% AtmosphericDensity 基于指数模型的大气密度。\n% 使用指数模型计算给定高度的大气密度。提供最高海拔 100 公里的演示图。\n\
  %% 格式：\n% rho = AtmosphericDensity( h )\n%\n%% 输入\n% h (1,:) 海拔高度 (m)\n%\n%% 输出\n\
  % rho (1,:) 密度 (kg/m³)\n\nfunction rho = AtmosphericDensity( h )\n\n% 演示\nif ( nargin\
  \ < 1 )\n    h = linspace(0,100000);\n    AtmosphericDensity( h );\n    return\n\
  end\n\n% 密度\nrho = 1.225*exp(-2.9e-05*h.¹.15);\n\n% 若无输出请求则绘图\nif ( nargout < 1\
  \ )\n    PlotSet(h,rho,'x label','h (m)','y label','Density (kg/m³)',...\n     \
  \   'figure title','Exponential Atmosphere',...\n        'plot title','Exponential\
  \ Atmosphere',...\n        'plot type','y log');\n    clear rho\nend\n```\n\n##\
  \ 11.2 使用数值搜索寻找飞行器的平衡控制量\n\n### 问题\n\n你希望找到使速度、航迹角和倾斜角状态（滚转角）导数为零的滚转角、推力和攻角。这就是一个平衡点。\n\
  \n### 解决方案\n\n你将使用下山单纯形法，通过 MATLAB 函数 `fminsearch` 来寻找平衡角度。\n\n\n\n### 工作原理\n\n\
  第一步是找到能够产生所需平衡状态（即设定点）的控制量。将设定点定义为向量\n\n![$$ \\left[\\begin{array}{l}{v}_s\\\\ {}{\\\
  gamma}_s\\\\ {}{\\psi}_s\\end{array}\\right] $$](A335353_1_En_11_Chapter_Equ7.gif)\n\
  \n(11.7) 其中包含速度 `${v}_s`、航向角 `${\\psi}_s$` 和飞行路径角 `${\\gamma}_s$` 的设定值。将这些值代入方程\
  \ 11.2 中的前三个动力学方程，并将等号左侧设为零。\n\n![$$ 0=\\left[\\begin{array}{l}T \\cos \\alpha -D\\\
  left({v}_s,\\alpha \\right)- mg \\cos {\\gamma}_s\\\\ {}\\left(L\\left({v}_s,\\\
  alpha \\right)+T \\sin \\alpha \\right) \\cos \\phi - mg \\cos {\\gamma}_s\\\\ {}\\\
  left(L\\left({v}_s,\\alpha \\right)+T \\sin \\alpha \\right) \\sin \\phi \\end{array}\\\
  right] $$](A335353_1_En_11_Chapter_Equ8.gif)\n\n(11.8)\n\n控制量为攻角 `$\\alpha$`、滚转角\
  \ `$\\phi$` 和推力 `$T$`。由于三个方程对应三个未知数，因此可以得到唯一解。求解平衡控制量最简单的方法是使用 `fminsearch`。该程序会找到能使三个方程归零的三个控制量。\n\
  \n函数 `EquilibriumControl.m` 在循环中使用 `fminsearch` 来处理多个状态。在循环内部，你需要计算控制量的初始猜测值。推力需要平衡阻力，因此你在零攻角下进行计算。升力必须平衡重力，因此你根据这一关系计算攻角。如果没有合理的初始猜测值，算法可能无法收敛，或者收敛到局部最小值。代价函数嵌套在控制函数内部。\n\
  \n```\nfunction [u, c] = EquilibriumControl( x, d, tol )\nn = size(x,2);\nu = zeros(3,n);\n\
  c = zeros(1,n);\np = optimset('TolFun',tol);\n% additional options during testing:\n\
  % 'PlotFcns',{@optimplotfval,@PlotIteration},'Display','iter','MaxIter',50);\nfor\
  \ k = 1:n\n[˜,D,LStar] = RHSAircraft(0,x(:,k),d);\nalpha = d.m*d.g/LStar;\nu0 =\
  \ [D;alpha;0];\n[umin,cval,exitflag,output] = fminsearch( @Cost, u0, p, x(:,k),\
  \ d );\nu(:,k) = umin;\nc(k) = Cost( u(:,k), x(:,k), d );\nend\n```\n\n默认输出是绘制结果。\n\
  \n```\n% Plot if no outputs are specified\nif ( nargout == 0 )\nyL = {'T (N)', '\\\
  alpha (rad)', '\\phi (rad)' 'Cost'};\ns = 'Equilibrium Control:Controls';\nPlotSet(1:n,[u;c],'x\
  \ label','set','y label',yL, ...\n'plot title',s, 'figure title',s);\nyL = {'v'\
  \ '\\gamma' '\\psi' 'h'};\ns = 'Equilibrium Control:States';\nPlotSet(1:n,x([1:3\
  \ 6],:),'x label','set','y label',yL, ...\n'plot title',s,'figure title',s);\nclear\
  \ u\nend\n```\n\n接下来展示代价函数。使用一个二次代价函数，即状态导数平方的无权重和。\n\n```\n%% Find the cost of\
  \ a given control\nfunction c = Cost( u, x, d )\nd.thrust = u(1);\nd.alpha = u(2);\n\
  d.phi = u(3);\nxDot = RHSAircraft(0,x,d);\ny = xDot(1:3);\nc = sqrt(y'*y);\n```\n\
  \n该函数内置了一个演示，考察在恒定速度下，从 0 到 10 km 高度递增时的推力和攻角变化。\n\n```\nif( nargin < 1 )\nx = [200*ones(1,101);...\n\
  zeros(4,101);...\nlinspace(0,10000,101)];\nd = RHSAircraft;\nEquilibriumControl(\
  \ x, d )\nreturn;\nend\n```\n\n图 11-2 显示了在默认演示中计算控制量所对应的状态。图 11-3 显示了最终得到的控制量。正如预期，攻角随高度增加而增大，但推力却随高度增加而减小。空气密度降低会减小阻力和升力，因此你需要减小推力，同时增大攻角以产生更多升力。滚转角几乎为零。\n\
  \n![A335353_1_En_11_Fig3_HTML.jpg](img/A335353_1_En_11_Fig3_HTML.jpg)\n\n**图 11-3.**\
  \ 演示中的控制量。推力随高度增加而减小，攻角随高度增加而增大\n\n![A335353_1_En_11_Fig2_HTML.jpg](img/A335353_1_En_11_Fig2_HTML.jpg)\n\
  \n**图 11-2.** 演示中的状态。仅有高度（h）在变化\n\n图 11-3 还绘制了代价函数。如果函数按预期工作，代价应几乎为零。\n\n在调试过程中，编写需要优化的函数时，对数值搜索过程有更多了解可能会很有帮助。虽然你只需要\
  \ `umin`，但在此函数调用的版本中，可以考虑 `fminsearch` 提供的其他输出。\n\n```\n[umin,cval,exitflag,output]\
  \ = fminsearch( @Cost, u0, p, x(:,k), d )\n```\n\n输出结构中包含迭代次数，而退出标志指示函数的退出条件：是否达到容差（1）、是否超过最大允许迭代次数（0），或者用户提供的输出函数是否终止了搜索（-1）。我们在脚本中设置断点来检查这些输出。对于\
  \ k = 4 时 v = 200 且 h = 300 的状态，输出为：\n\n```\n>> u0\nu0 =\n2880.4\n0.016255\n0\n\
  >> [umin,cval,exitflag,output] = fminsearch( @Cost, u0, p, x(:,k), d );\numin =\n\
  3180.7\n0.016237\n3.459e-08\ncval =\n3.2473e-09\nexitflag =\n1\noutput =\niterations:\
  \ 141\nfuncCount: 260\nalgorithm: 'Nelder-Mead simplex direct search'\nmessage:\
  \ 'Optimization terminated: the current x satisfies the termination criteria usin...'\n\
  ```\n\n因此你可以看到，搜索需要 141 次迭代，并且推力从我们初始猜测的 2880 N 增加到 3180 N。最终代价为 `3e^(-9)`。获取更多信息的另一种方法是将\
  \ `fminsearch` 的 `Display` 选项设置为 `iter` 或 `final`，默认值为 `notify`。在这种情况下，选项如下所示：\n\
  \n```\np = optimset('TolFun',tol,'Display','iter');\n```\n\n并且以下类型的输出会打印到命令窗口中：\n\
  \n```\n>> d = RHSAircraft;\n>> x = [200;0;0.5;0;0;5000];\n>> EquilibriumControl(\
  \ x, d )\nIteration Func-count min f(x) Procedure\n0 1 0.0991747\n1 4 0.0817065\
  \ initial simplex\n2 6 0.0630496 expand\n3 7 0.0630496 reflect\n4 9 0.0133862 expand\n\
  5 10 0.0133862 reflect\n6 11 0.0133862 reflect\n7 13 0.0133862 contract outside\n\
  8 15 0.0133862 contract inside\n...\n49 87 2.1869e-05 contract inside\n50 89 2.1869e-05\
  \ contract outside\nExiting: Maximum number of iterations has been exceeded\n- increase\
  \ MaxIter option.\nCurrent function value: 0.000022\n```\n\n为了更深入了解，你可以添加一个在每次迭代时调用的绘图函数。MATLAB\
  \ 提供了一些默认的绘图函数；例如，`optimplotfval` 会在每次迭代时绘制代价函数值。你实际上需要在编辑器中打开 `optimplotfval` 才能了解所需的语法。我们像这样将函数添加到优化选项中：\n\
  \n```\np = optimset('TolFun',tol,'PlotFcns',@optimplotfval);\n```\n\n图 11-4 是根据演示的第一次迭代生成的。\n\
  \n![A335353_1_En_11_Fig4_HTML.jpg](img/A335353_1_En_11_Fig4_HTML.jpg)\n\n**图 11-4.**\
  \ 使用 `optimplotfval` 绘制的函数值图\n\n你可以看到，在此图中，代价函数值在最后 100 次迭代中几乎保持不变。你可以使用 `PlotFcns`\
  \ 的元胞数组添加更多绘图，MATLAB 会自动为每个绘图分配其自己的子图坐标轴。对于棘手的数值问题，你可能希望生成一个曲面并追踪优化的迭代过程。对于我们的问题，我们添加了自定义绘图函数\
  \ `PlotIteration`，结果如图 11-5 所示。\n\n![A335353_1_En_11_Fig5_HTML.jpg](img/A335353_1_En_11_Fig5_HTML.jpg)\n\
  \n**图 11-5.** 使用曲面的自定义优化绘图函数\n\n```\np = optimset('TolFun',tol,'PlotFcns',{@optimplotfval,@PlotIteration});\n\
  ```\n\n我们编写了两个函数：一个用于生成曲面，另一个用于绘制迭代步骤。MATLAB 在初始化时将迭代值设为零，因此在这种情况下，你需要根据给定的初始状态生成曲面。对于所有其他迭代值，你在曲面上用星号绘制代价函数值。\n\
  \n```\n% Plot an iteration of the numerical search\nfunction stop = PlotIteration\
  \ (u0,optimValues,state,varargin)\nstop = false;\nx0 = varargin{1};\nd = varargin{2};\n\
  switch state\ncase 'iter'\nif optimValues.iteration == 0\na = PlotSurf( x0, u0,\
  \ d );\nend\nplot3 (u0(1),u0(2),optimValues.fval,'k*');\nend\n\n% Plot a surface\
  \ using the given initial state for a range of controls.\n% MATLAB will already\
  \ have an empty axis available for plotting.\nfunction a = PlotSurf( x0, u0, d )\n\
  u1 = linspace( max(u0(1)-1000,0),u0(1)+1000);\nu2 = linspace(0, max(2*u0(2),0.1));\n\
  u3 = u0(3);\ncvals = zeros(100,100);\nfor m = 1:100\nfor l = 1:100\ncvals(l,m) =\
  \ Cost( [u1(m);u2(l);u3], x0, d );\nend\nend\ns = surf(u1,u2,cvals);\nset(s,'edgecolor','none');\n\
  a = gca;\nset(a,'Tag','equilibriumcontrol');\nhold on;\nxlabel('Thrust')\nylabel('Angle\
  \ of Attack')\n```\n\n最后，请注意，要查看 MATLAB 用于 `fminsearch` 的默认选项集，请使用优化函数的名称调用 `optimiset`。\n\
  \n```\n>> options = optimset('fminsearch')\noptions =\nDisplay: 'notify'\nMaxFunEvals:\
  \ '200*numberofvariables'\nMaxIter: '200*numberofvariables'\nTolFun: 0.0001\nTolX:\
  \ 0.0001\nFunValCheck: 'off'\nOutputFcn: []\nPlotFcns: []\n```\n\n你可以看到，默认容差相等，均为\
  \ 0.0001，而函数评估次数和迭代次数取决于输入状态 `x` 中的变量数量。\n\n\n\n"
- '# 11.3 为飞行器设计控制系统


  ## 问题


  你需要为一架飞行器设计一个控制系统，使其能够控制飞行轨迹并实现三维运动。


  ## 解决方案


  你将采用动态被控对象逆推法前馈飞行器的期望控制量。使用比例控制器分别控制推力、迎角和滚转角，以修正标称控制量从而抵消阵风等扰动的影响。*不*对航向角 `ψ` 采用滚转角反馈控制，此部分留作练习。


  ## 工作原理


  回顾配方 11-1 中的动力学模型，飞行器的状态为：


  ![ $$ \left[\begin{array}{cccccc}\hfill v\hfill & \hfill \gamma \hfill & \hfill
  \psi \hfill & \hfill x\hfill & \hfill y\hfill & \hfill h\hfill \end{array}\right]
  $$ ](A335353_1_En_11_Chapter_Equ9.gif)


  (11.9) 其中 `v` 为速度，`γ` 为航迹角，`ψ` 为航向角，`x` 和 `y` 为飞行平面内的坐标，`h` 为高度。控制变量为滚转角 `φ`、迎角
  `α` 和推力 `T`。


  控制器形式如下：


  ![ $$ T={T}_s+{k}_T\left({v}_s-v\right) $$ ](img/A335353_1_En_11_Chapter_Equ10.gif)


  (11.10)


  ![ $$ \alpha ={\alpha}_s+{k}_{\alpha}\left({\gamma}_s-\gamma \right) $$ ](img/A335353_1_En_11_Chapter_Equ11.gif)


  (11.11)


  若状态处于 `s`，则控制量应取对应平衡点处的控制值 `T[s]`、`α[s]`、`φ[s]`。增益 `k[T]` 和 `k[a]` 用于将状态推向正确方向，其值取决于飞行工况。你需要展开公式
  11.2 中的前两个动力学方程。


  ![ $$ \left[\begin{array}{c}\hfill \dot{v}\hfill \\ {}\hfill \dot{\gamma}\hfill
  \end{array}\right]=\left[\begin{array}{c}\hfill \frac{T \cos \alpha -q\left({C}_{D_0}+k{\left({C}_{L_{\alpha
  }}\alpha \right)}²\right)}{m}-g \cos \gamma \hfill \\ {}\hfill \frac{\left(q{C}_{L_{\alpha
  }}\alpha +T \sin \alpha \right) \cos \phi - mg \cos \gamma }{mv}\hfill \end{array}\right]
  $$ ](A335353_1_En_11_Chapter_Equ12.gif)


  (11.12)


  对方程进行线性化处理，并省略与控制量无关的项。


  ![ $$ \left[\begin{array}{c}\hfill \dot{v}\hfill \\ {}\hfill \dot{\gamma}\hfill
  \end{array}\right]=\left[\begin{array}{c}\hfill \frac{T}{m}\hfill \\ {}\hfill \frac{q
  \cos \phi {C}_{L_{\alpha }}\alpha }{mv}\hfill \end{array}\right] $$ ](A335353_1_En_11_Chapter_Equ13.gif)


  (11.13)


  你希望引入时间常数 `τ[γ]` 和 `τ[v]`，使方程变为：


  ![ $$ \left[\begin{array}{c}\hfill \dot{v}\hfill \\ {}\hfill \dot{\gamma}\hfill
  \end{array}\right]=\left[\begin{array}{c}\hfill -\frac{v}{\tau_v}\hfill \\ {}\hfill
  -\frac{\gamma }{\tau_{\gamma }}\hfill \end{array}\right] $$ ](A335353_1_En_11_Chapter_Equ14.gif)


  (11.14)


  因此：


  ![ $$ {k}_T=\frac{m}{\tau_v} $$ ](img/A335353_1_En_11_Chapter_Equ15.gif)


  (11.15)


  ![ $$ {k}_{\alpha }=\frac{mv}{q \cos \phi {C}_{L_{\alpha }}{\tau}_{\gamma }} $$
  ](img/A335353_1_En_11_Chapter_Equ16.gif)


  (11.16)


  控制系统在函数 `AircraftControl` 中实现。


  ```

  function [T, alpha] = AircraftControl( s, d, tauGamma, tauV, vSet, gammaSet )

  u = EquilibriumControl( s, d );

  v = s(1);

  gamma = s(2);

  h = s(6);

  rho = feval( d.density, h );

  qS = 0.5 * d.s * rho * vˆ2;

  kV = d.m / tauV;

  kGamma = ( d.m * v ) / ( qS * cos( d.phi ) * d.cLAlpha * tauGamma );

  T = u(1) + kV * ( vSet - v );

  alpha = u(2) + kGamma * ( gammaSet - gamma );

  ```


  该控制系统的性能在仿真配方(11-5)中展示。该函数需要获取飞行工况信息，包含大气密度。它首先通过 `EquilibriumControl` 计算出当前状态 `s`
  所需的控制量。飞行器数据结构也是必需的输入。额外输入还包括控制器的时间常数和设定值。在函数内部，通过 `feval` 和输入函数句柄来计算大气密度。该计算应与
  `RHSAircraft` 中的计算方式保持一致。


  '
- "# 11.4 绘制飞行器三维轨迹\n\n## 问题\n\n你需要用三维方式绘制飞行器的轨迹，并沿轨迹显示飞行器坐标轴和时间信息。\n\n## 解决方案\n\n\
  你将使用 MATLAB 的 `plot3` 函数，并结合自定义代码在轨迹的选定点绘制飞行器坐标轴和时间标记。最终生成的图形如图 11-6 所示。\n\n![A335353_1_En_11_Fig6_HTML.jpg](img/A335353_1_En_11_Fig6_HTML.jpg)\n\
  \n图 11-6. 飞行器轨迹函数演示\n\n\n\n### 工作原理\n\n使用 `plot3` 绘制 3D 显示。`Plot3DTrajectory.m`\
  \ 函数允许通过 `varargin` 输入参数对。\n\n```\n%% PLOT3DTRAJECTORY 在三维空间中绘制飞行器的轨迹。\n%% 格式：\n\
  % Plot3DTrajectory( x, varargin )\n%% 描述\n% 绘制带有时间标签和局部坐标轴的飞行器三维轨迹。\n% \n%% 输入参数\n\
  % x (6,:) 状态向量 [v;gamma;phi;x;y;h]\n% varargin {:} 参数\n% \n```\n\n此处暂不展示演示代码，先给出绘图代码。这部分代码与\
  \ 2D 绘图函数 `PlotSet` 有相似之处。我们使用 `text` 插入时间标签，并使用图形对象绘出地面。\n\n```\n% 绘制图形\nh = figure;\n\
  set(h,'Name',figTitle);\nplot3(x(4,:),x(5,:),x(6,:));\nxlabel(xLabel);\nylabel(yLabel);\n\
  zlabel(zLabel);\n\n% 绘制时间与坐标轴\nif( ~isempty(t) && ~isempty(tIndex) )\n  [t,~,tL]\
  \ = TimeLabel(t);\n  for k = 1:length(t)\n    s = sprintf('t = %3.0f (%s)',t(k),\
  \ tL);\n    i = tIndex(k);\n    text(x(4,i),x(5,i),x(6,i),s);\n    DrawAxes(x(:,i),alpha(1,i),phi(1,i));\n\
  \  end\nend\n\n% 添加地面\nxL = get(gca,'xlim');\nyL = get(gca,'ylim');\nv = [xL(1)\
  \ yL(1) 0;...\n     xL(2) yL(1) 0;...\n     xL(2) yL(2) 0;...\n     xL(1) yL(2)\
  \ 0];\npatch('vertices',v,'faces',[1 2 3 4],'facecolor',[0.65 0.5 0.0],'edgecolor',[0.65\
  \ 0.5 0.0]);\ngrid on\nrotate3d on\naxis image\nzL = get(gca,'zlim');\nset(gca,'zlim',[0\
  \ zL(2)],'ZLimMode','manual');\n```\n\n绘图命令很直观。如果输入了时间数组，该函数会使用 `sprintf` 和 `text`\
  \ 沿轨迹绘制时间标签。我们通过 `TimeLabel` 获取合理的单位。此外，它还会使用嵌套函数 `DrawAxes` 绘制飞行器的坐标轴。\n\n```\n\
  %%% Plot3DTrajectory>DrawAxes 子函数\n%% DrawAxes\nfunction DrawAxes( x, alpha, phi\
  \ )\ngamma = x(2);\npsi = x(3);\n\n% 飞行器坐标系：x 轴向前，y 轴指向右翼，z 轴向下\nu0 = [1 0 0;0 1\
  \ 0;0 0 -1];\n\ncG = cos(gamma+alpha);\nsG = sin(gamma+alpha);\ncP = cos(psi);\n\
  sP = sin(psi);\ncR = cos(phi);\nsR = sin(phi);\n\nu = [cP -sP 0;sP cP 0; 0 0 1]...\n\
  \  *[cG 0 -sG; 0 1 0;sG 0 cG]...\n  *[1 0 0;0 cR sR; 0 -sR cR]*u0;\n\n% 计算坐标轴缩放长度\n\
  xL = get(gca,'xlim');\nyL = get(gca,'ylim');\nzL = get(gca,'zlim');\nl = sqrt((xL(2)-xL(1))²\
  \ + (yL(2)-yL(1))² + (zL(2)-zL(1))²)/20;\nx0 = x(4:6);\nfor k = 1:3\n  x1 = x0 +\
  \ u(:,k)*l;\n  c = [0 0 0];\n  c(k) = 1;\n  line([x0(1);x1(1)],[x0(2);x1(2)],[x0(3);x1(3)],'color',c);\n\
  end\n```\n\n该函数绘制了飞行器的坐标系：x 轴指向机头，y 轴指向右翼，z 轴向下。它使用状态向量，因此需要将 γ 和 ψ 转换为旋转矩阵。该坐标系基于风轴系。\n\
  \n函数通过参数对让用户自定义绘图。参数对在此处处理：\n\n```\nxLabel = 'x (m)';\nyLabel = 'y (m)';\nzLabel\
  \ = 'z (m)';\nfigTitle = 'Trajectory';\nt = [];\ntIndex = [];\nalpha = 0.02*ones(1,size(x,2));\n\
  phi = 0.25*pi*ones(1,size(x,2));\nfor k = 1:2:length(varargin)\n  switch lower(varargin{k})\n\
  \    case 'x label'\n      xLabel = varargin{k+1};\n    case 'y label'\n      yLabel\
  \ = varargin{k+1};\n    case 'z label'\n      zLabel = varargin{k+1};\n    case\
  \ 'figure title'\n      figTitle = varargin{k+1};\n    case 'time'\n      t = varargin{k+1};\n\
  \    case 'time index'\n      tIndex = varargin{k+1};\n    case 'alpha'\n      alpha\
  \ = varargin{k+1};\n    case 'phi'\n      phi = varargin{k+1};\n    otherwise\n\
  \      error('%s 不是有效的参数',varargin{k});\n  end\nend\n```\n\n我们在 `switch` 语句中使用 `lower`\
  \ 函数，以便用户输入大写字母时无需担心大小写问题。大部分参数都很直观。时间输入有多种实现方式，我们选择允许用户为时间标签指定具体时间。同时，用户需要输入状态向量对应的索引。\n\
  \n该函数包含一个演示。输入 `Plot3DTrajectory` 即可生成图 11-6 所示的示例轨迹。对于图形函数而言，演示能直观展示图形效果，并提供函数使用示例。\n\
  \n```\n% 演示\nif( nargin < 1 )\n  l = linspace(0,1e5);\n  x = [200*ones(1,100);...\n\
  \       (pi/4)*ones(1,100);...\n       (pi/4)*ones(1,100);l;l;l];\n  t = [200 300\
  \ 400 500 600];\n  k = [20 40 60 80 100];\n  Plot3DTrajectory( x, 'time', t, 'time\
  \ index', k, 'alpha',0.01*ones(1,100) )\n  return;\nend\n```\n\n## 11.5 模拟受控飞行器\n\
  \n### 问题\n\n你希望模拟飞行器在轨迹控制下的运动。\n\n### 解决方案\n\n创建一个包含控制系统和飞行动力学的脚本。动力学使用 `RungeKutta`\
  \ 方法进行传播。这是一个四阶方法，意味着截断误差与时间步长的四次方成正比。考虑到飞行控制系统典型的采样时间，四阶精度足以满足飞行仿真需求。我们将使用上一节描述的\
  \ 3D 绘图函数 `Plot3DTrajectory` 来显示结果。\n\n\n\n### 工作原理\n\n仿真脚本 `AircraftSim.m` 读取 `RHSAircraft`\
  \ 的数据结构，并修改参数以匹配 F-35 战斗机。该模型仅涉及推力和阻力，且即使这两部分也采用了非常简单的模型。初始飞行路径角和速度已设定。我们开启控制功能，并为速度和飞行路径角状态设定设定值和时间常数。输出方面，我们绘制状态图、控制图以及三维轨迹图。\n\
  \n```\n%% 某 F-35 飞行器的轨迹控制仿真\n% 模拟一个质点飞行器的动力学特性。\n%% 另请参阅\n% RungeKutta, RHSAircraft,\
  \ PDControl, EquilibriumControl\n```\n\n脚本从 `RHS` 函数获取默认数据结构开始。\n\n```\n%% 用于右侧函数的数据结构\n\
  d = RHSAircraft;\n\n%% 用户初始化\nd.m = 13300.00; % 千克\nd.s = 204.00; % 平方米\nv = 200;\
  \ % 米/秒\nfPA = pi/6; % 弧度\n% 初始化持续时间和时间步长\ntEnd = 40;\ndT = 0.1;\n\n% 控制器\ncontrolIsOn\
  \ = true;\ntauV = 1;\ntauGamma = 1;\nd.phi = 0;\nvSet = 220;\ngammaSet = pi/8;\n\
  \n%% 仿真\n% 状态向量\nx = [v;fPA;0;0;0;0];\n% 绘图设置与步数\nn = ceil(tEnd/dT);\nxP = zeros(length(x)+2,n);\n\
  % 寻找非反馈设定值\n[˜,D,LStar] = RHSAircraft(0,x,d);\nthrust0 = D;\nalpha0 = d.m*d.g/LStar;\n\
  \n% 运行仿真\nfor k = 1:n\n    if ( controlIsOn )\n        [d.thrust, d.alpha] = AircraftControl(\
  \ x, d, tauGamma, tauV, vSet, gammaSet );\n    else\n        d.thrust = thrust0;\n\
  \        d.alpha = alpha0;\n    end\n    % 绘图存储\n    xP(:,k) = [x;d.thrust;d.alpha];\n\
  \    % 右侧函数\n    x = RungeKutta(@RHSAircraft,0,x,dT,d);\nend\n\n%% 绘图\n[t,tL] =\
  \ TimeLabel((0:(n-1))*dT);\nyL = {'T (N)', '\\alpha (rad)'};\ns = '飞行器仿真：控制量';\n\
  PlotSet(t,xP(7:8,:),'x label',tL,'y label',yL,'plot title',s, 'figure title',s);\n\
  yL = {'v' '\\gamma' '\\psi' 'x' 'y' 'h'};\ns = '飞行器仿真：状态量';\nPlotSet(t,xP(1:6,:),'x\
  \ label',tL,'y label',yL,'plot title',s,'figure title',s);\nk = floor(linspace(2,n,8));\n\
  t = t(k);\nPlot3DTrajectory( xP, 'time', t, 'time index', k, 'alpha', xP(8,:) );\n\
  ```\n\n如果关闭控制，则将推力和攻角设置为常数值，以平衡阻力和重力。速度和飞行路径角的设定值与初始条件略有不同。这使你能够展示控制器的瞬态响应。\n\n\
  图 11-7 显示了各状态量。速度和飞行路径角收敛至其设定值。\n\n![A335353_1_En_11_Fig7_HTML.jpg](img/A335353_1_En_11_Fig7_HTML.jpg)\n\
  \n图 11-7. 速度和飞行路径角收敛至期望值\n\n图 11-8 显示了控制量。控制量达到其稳态值。随着飞机爬升，推力和攻角发生变化。推力下降是因为阻力下降，而攻角增加是为了维持升力与重力的平衡。\n\
  \n![A335353_1_En_11_Fig8_HTML.jpg](img/A335353_1_En_11_Fig8_HTML.jpg)\n\n图 11-8.\
  \ 控制量收敛至稳态值，随后缓慢变化以适应飞机爬升时大气密度的降低\n\n三维轨迹如图 11-9 所示。如预期，它以近乎恒定的角度和速度爬升。\n\n![A335353_1_En_11_Fig9_HTML.jpg](img/A335353_1_En_11_Fig9_HTML.jpg)\n\
  \n图 11-9. 轨迹图\n\n### 总结\n\n本章演示了如何编写质点飞行器的动力学模型。你学习到了如何使用搜索算法寻找平衡控制状态。这包括利用 MATLAB\
  \ 为其优化算法提供的调试输出，并为每次搜索迭代添加自定义绘图。你学习到了如何设计一个控制系统来维持期望的速度、倾斜角和飞行路径角。你学习到了如何制作带有文本注释和其他绘图对象的三维图。你还学习到了如何将函数句柄传递给其他函数，以使函数更具通用性。表\
  \ 11-1 列出了本章开发的代码。\n\n**表 11-1.** 本章代码清单\n\n| 文件 | 说明 |\n| --- | --- |\n| `RHSAircraft`\
  \ | 质点飞行器的六自由度右侧函数。 |\n| `AtmosphericDensity` | 基于指数模型的大气密度随高度变化函数。 |\n| `EquilibriumControl`\
  \ | 寻找质点飞行器的平衡控制。 |\n| `AircraftControl` | 计算三维质点飞行器的攻角和推力。 |\n| `Plot3DTrajectory`\
  \ | 绘制带时间点和局部坐标轴的飞行器三维轨迹。 |\n| `AircraftSim` | 飞行器轨迹控制仿真。 |\n\n"
- "# 12. 航天器\n\n电子补充材料：本章在线版本（doi: [10.1007/978-1-4842-0559-4_12](http://dx.doi.org/10.1007/978-1-4842-0559-4_12)）包含补充材料，仅供授权用户使用。\n\
  \n航天器指向控制是所有机器人及载人航天器的一项关键技术。控制系统由传感、执行以及航天器本身的动力学组成。航天器控制系统种类繁多，但本章仅涉及三轴指向问题。采用反作用轮作为执行机构。\n\
  \n反作用轮通过角动量守恒来实现控制。作用在反作用轮上的力矩使其向一个方向旋转，而航天器则向相反方向旋转。从航天器移除的动量被轮子吸收。反作用轮被归类为动量交换装置。你可以仅使用轮子而无需任何外部力矩来重新定向航天器。在反作用轮问世之前，常使用推进器进行姿态控制。这会消耗推进剂，这是不可取的，因为一旦推进剂耗尽，航天器将无法继续使用。\n\
  \n除绕正交（垂直）轴旋转的三个反作用轮外，航天器被建模为刚体。连接在轮子转子上的电机轴与航天器相连。施加在轮子与航天器之间的扭矩会导致轮子和航天器向相反的角度方向运动。我们假设拥有用于测量航天器姿态的姿态传感器。我们还假设轮子是理想的，只存在粘性阻尼摩擦。\n\
  \n## 12.1 创建航天器动力学模型\n\n### 问题\n\n航天器是一个带有三个轮子的刚体。每个轮子都与航天器相连，如图 12-1 所示。\n\n![A335353_1_En_12_Fig1_HTML.gif](img/A335353_1_En_12_Fig1_HTML.gif)\n\
  \n图 12-1. 反作用轮。反作用轮盘向一个方向旋转，航天器则向相反方向旋转\n\n### 解决方案\n\n运动方程利用角动量守恒原理写出。这产生了一个动力学模型，即在标准欧拉方程的基础上增加了旋转轮子的效应。这有时被称为陀螺体模型。\n\
  \n\n\n### 工作原理\n\n航天器模型可分为动力学部分（包括反作用轮的动力学）和运动学部分。若假设飞轮完全对称、与三轴对齐且具有对角线惯性矩阵，则可通过以下耦合一阶微分方程对航天器动力学建模。\n\
  \n![ $$ I\\dot{\\omega}+{\\omega}^{\\times}\\left(I\\omega +{I}_w\\left({\\omega}_w+\\\
  omega \\right)\\right)+{I}_w\\left({\\dot{\\omega}}_w+\\dot{\\omega}\\right)=T $$\
  \ ](img/A335353_1_En_12_Chapter_Equ1.gif)\n\n(12.1)\n\n![ $$ {I}_w\\left({\\dot{\\\
  omega}}_w+\\dot{\\omega}\\right)={T}_w $$ ](img/A335353_1_En_12_Chapter_Equ2.gif)\n\
  \n(12.2)\n\n`I` 是 3 × 3 惯性矩阵，不包含飞轮的惯性。\n\n![ $$ I=\\left[\\begin{array}{lll}{I}_{xx}\\\
  hfill & {I}_{xy}\\hfill & {I}_{xz}\\hfill \\\\ {}{I}_{yx}\\hfill & {I}_{yy}\\hfill\
  \ & {I}_{yz}\\hfill \\\\ {}{I}_{zx}\\hfill & {I}_{zy}\\hfill & {I}_{zz}\\hfill \\\
  end{array}\\right] $$ ](A335353_1_En_12_Chapter_Equ3.gif)\n\n(12.3)\n\n该矩阵是对称的，因此\
  \ `I_xy = I_yx`，`I_xz = I_zx`，`I_zy = I_yz`。`ω` 是在航天器坐标系中观测到的航天器角速度矢量。\n\n![ $$\
  \ \\omega =\\left[\\begin{array}{l}{\\omega}_x\\hfill \\\\ {}{\\omega}_y\\hfill\
  \ \\\\ {}{\\omega}_z\\hfill \\end{array}\\right] $$ ](A335353_1_En_12_Chapter_Equ4.gif)\n\
  \n(12.4) `ω_w` 是飞轮 1、2、3 的角速度。\n\n![ $$ {\\omega}_w=\\left[\\begin{array}{l}{\\\
  omega}_1\\hfill \\\\ {}{\\omega}_2\\hfill \\\\ {}{\\omega}_3\\hfill \\end{array}\\\
  right] $$ ](A335353_1_En_12_Chapter_Equ5.gif)\n\n(12.5)\n\n1 与 x 轴对齐，2 与 y 轴对齐，3\
  \ 与 z 轴对齐。这样，反作用轮组成了一个正交系统，可用于三轴控制。`T` 是作用在航天器上的外部力矩，可包括太阳光压、空气阻力等外部扰动，以及推力器或磁力矩器线圈的力矩。`T_w`\
  \ 是作用在飞轮上的内部力矩。`I_w` 是飞轮的标量惯性（假设所有飞轮具有相同的惯性）。可将第二个方程代入第一个方程以简化表达式。\n\n![ $$ I\\\
  dot{\\omega}+{\\omega}^{\\times}\\left(I\\omega +{I}_w\\left({\\omega}_w+\\omega\
  \ \\right)\\right)+{T}_w=T $$ ](img/A335353_1_En_12_Chapter_Equ6.gif)\n\n(12.6)\n\
  \n![ $$ {I}_w\\left({\\dot{\\omega}}_w+\\dot{\\omega}\\right)={T}_w $$ ](img/A335353_1_En_12_Chapter_Equ7.gif)\n\
  \n(12.7)\n\n此项\n\n![ $$ {T}_e={\\omega}^{\\times}\\left(I\\omega +{I}_w\\left({\\\
  omega}_w+\\omega \\right)\\right)\\equiv \\omega \\times h $$ ](img/A335353_1_En_12_Chapter_Equ8.gif)\n\
  \n(12.8) 称为欧拉力矩。若角速率较小，可将此项设为零，方程简化为\n\n![ $$ I\\dot{\\omega}+{T}_w=T $$ ](img/A335353_1_En_12_Chapter_Equ9.gif)\n\
  \n(12.9)\n\n![ $$ {I}_w\\left({\\dot{\\omega}}_w+\\dot{\\omega}\\right)={T}_w $$\
  \ ](img/A335353_1_En_12_Chapter_Equ10.gif)\n\n(12.10)\n\n对于运动学部分，我们使用四元数。四元数是用四个参数描述航天器相对于惯性坐标系姿态的方式。虽然理论上用角度表达即可，因为仅需三个状态变量即可描述姿态。但角度存在奇异性问题——即在某些特定姿态下某个角度无法定义，因此不适合用于仿真。从惯性系到本体系的四元数导数为\n\
  \n![ $$ \\dot{q}=\\frac{1}{2}\\left[\\begin{array}{rr}\\hfill 0& \\hfill {\\omega}^T\\\
  \\ {}\\hfill -\\omega & \\hfill {\\omega}^{\\times}\\end{array}\\right] $$ ](A335353_1_En_12_Chapter_Equ11.gif)\n\
  \n(12.11)\n\n`ω^×` 表示斜对称矩阵，等效于叉积运算，其形式为\n\n![ $$ {\\omega}^{\\times }=\\left[\\\
  begin{array}{rrr}\\hfill 0& \\hfill -{\\omega}_z& \\hfill {\\omega}_y\\\\ {}\\hfill\
  \ {\\omega}_z& \\hfill 0& \\hfill -{\\omega}_x\\\\ {}\\hfill -{\\omega}_y& \\hfill\
  \ {\\omega}_x& \\hfill 0\\end{array}\\right] $$ ](A335353_1_En_12_Chapter_Equ12.gif)\n\
  \n(12.12)\n\n飞轮力矩由摩擦力矩和控制力矩组成。反作用轮通常由直流电机驱动，电机电子器件通过电流反馈抵消反电动势。因此，总的反作用轮力矩为\n\n\
  ![ $$ {T}_w={T}_c+{T}_f $$ ](img/A335353_1_En_12_Chapter_Equ13.gif)\n\n(12.13) 其中\
  \ `T_c` 是指令的反作用轮力矩，`T_f` 是摩擦力矩。一个简单的摩擦模型为\n\n![ $$ {T}_f=-{k}_d{\\omega}_k $$ ](img/A335353_1_En_12_Chapter_Equ14.gif)\n\
  \n(12.14) `k_d` 是阻尼系数，`ω_k` 是第 k 个飞轮的角速度。若 `k_d` 较大，可能需将其前馈至控制器。这需要对飞轮进行仔细标定以确定阻尼系数。\n\
  \n首先，定义动力学右端函数无输入时返回的数据结构。该函数名为 `RHSSpacecraftWithRWA.m`。RWA 代表反作用轮组件。之所以称为“组件”，是因为反作用轮由轴承、轮体、转轴、支撑结构以及电力电子器件装配而成。航天器正是由各类组件构成的。\n\
  \n飞轮的默认单位矢量沿正交轴线（如 x、y、z 轴）。默认惯性矩阵为单位矩阵，使航天器等效为球体。默认的反作用轮惯量为 0.001。所有飞轮的非旋转部件均被归并至惯性矩阵中。\n\
  \n```\n% Default data structure\nif ( nargin == 0 )\n  xDot = struct('inr', eye\
  \ (3), 'torque',[0;0;0],'inrRWA', 0.001*[1;1;1],...\n    'torqueRWA',[0;0;0],'uRWA',\
  \ eye (3), 'damping',[0;0;0]);\n  return\nend\n```\n\n航天器的动力学方程在以下代码行中给出。需要计算总飞轮力矩，因为它同时作用于航天器和飞轮。我们使用反斜杠运算符将方程乘以惯性矩阵的逆。惯性矩阵是正定对称矩阵，因此可使用特定例程加速计算。最好避免直接计算逆矩阵，因为可能存在病态问题——即矩阵中的微小误差可能导致逆矩阵的较大误差。\n\
  \n将状态向量元素保存为具有明确意义的局部变量，以便于代码阅读。这也可避免不必要的子矩阵重复提取。\n\n你会注意到，`omegaRWA` 变量使用 `end`\
  \ 关键字从向量的第 8 个元素读取至末尾。这使代码能处理任意数量的反作用轮。你可能只需要用一个轮子控制单轴，或者使用超过三个轮子以增加冗余。请确保 `d` 中的输入与轮子数量匹配。同时，由于我们输入了单位矢量，轮子不必与\
  \ x、y、z 轴对齐。注意使用反斜杠运算符求解 `omegaDotCore` 的线性方程组。\n\n```\n% Save as local variables\n\
  q = x(1:4);\nomega = x(5:7);\nomegaRWA = x(8:end);\n\n% Total body fixed angular\
  \ momentum\nh = d.inr*omega + d.uRWA*(d.inrRWA.*(omegaRWA + d.uRWA'*omega));\n\n\
  % Total wheel torque\ntRWA = d.torqueRWA - d.damping.*omegaRWA;\n\n% Core angular\
  \ acceleration\nomegaDotCore = d.inr\\(d.torque - d.uRWA*tRWA - Cross(omega,h));\n\
  ```\n\n请注意，`uRWA` 是反作用轮单位矢量（即自旋矢量）的数组。在计算 `h` 时，需使用 `uRWA` 的转置将 `ω` 变换至轮坐标系，然后变换回本体坐标系，再将轮系分量添加到核心分量\
  \ `Iω` 中。飞轮动力学由以下代码行给出。\n\n```\n% Wheel angular acceleration\nomegaDotWheel = tRWA./d.inrRWA\
  \ - d.uRWA'*omegaDotCore;\n```\n\n总状态导数由以下代码行表示：\n\n```\n% State derivative\nsW\
  \ = [ 0 -omega(3) omega(2);...\n       omega(3) 0 -omega(1);...\n      -omega(2)\
  \ omega(1) 0]; % skew symmetric matrix\nqD = 0.5*[0, omega';-omega,-sW];\nxDot =\
  \ [qD*q;omegaDotCore;omegaDotWheel];\n```\n\n总惯性角动量是辅助输出。在没有外力矩的情况下，该值应守恒，因此它是检验动力学的良好指标。检验角动量守恒的一个简单方法是：用所有状态的角速率运行一次仿真，然后用更小的时间步长重新运行。角动量的变化应随着时间步长的减小而减小。\n\
  \n```\n% Output the inertial angular momentum\nif ( nargout > 1 )\n  hECI = QTForm(\
  \ q, h );\nend\n```\n\n\n\n"
- "# 12.2 从四元数计算角度误差\n\n## 问题描述\n你需要利用三个反作用轮将航天器指向新的目标姿态（指向），或在外力矩作用于航天器时维持当前姿态。\n\
  \n## 解决方案\n构建三个 PD 控制器，每轴各一个。你需要一个函数，用于接收两个四元数并计算它们之间的小角度偏差，作为这些控制器的输入。\n\n## 工作原理\n\
  若你正指向一个惯性目标并希望围绕该姿态进行控制，可通过将 `ω` 近似为 `θ̇` 来简化速率方程。该近似在小角度情况下有效，此时旋转顺序无关紧要，欧拉角可被视为一个矢量。\n\
  \n```\nθ̇ = ω\n```\n\n(12.15)\n\n此外，你还需将欧拉方程（见方程 12.9）两边乘以 `I⁻¹`，以求解导数。注意，来自飞轮的扭矩\
  \ `T[w]` 等效于 `I * a[w]`，其中 `a` 是加速度。于是系统方程变为：\n\n```\nθ̈ + a_w = a\n```\n\n(12.16)\n\
  \n```\nI_w(ω̇_w + ω̇) = -T_w\n```\n\n(12.17)\n\n第一个方程现在变为三个解耦的二阶方程，这与第 6 章的情况相同。你可以通过标准的\
  \ PD 控制器来稳定该系统。\n\n你需要姿态角作为 PD 控制器的输入，以计算控制扭矩。本示例仅针对标称姿态下的小角度位移。你可以向控制代码传递一个目标四元数，它会自动计算\
  \ `Δ` 角度；或者你也可以施加一个小的扰动力矩。\n\n在这些情况下，姿态可被视为一个矢量，旋转顺序无关紧要。由小角度推导出的四元数为：\n\n```\n\
  q_Δ ≈ [1; θ₁/2; θ₂/2; θ₃/2]\n```\n\n(12.18)\n\n你需要通过将目标四元数 `q[T]` 与当前四元数的转置相乘，来求得所需的误差四元数\
  \ `q[Δ]`：\n\n```\nq_Δ = q^T * q_T\n```\n\n(12.19)\n\n计算该角度的算法由以下代码实现。四元数乘法被封装为一个子函数，这使得代码更清晰，也更易看出其与算法的对应关系。`QMult`\
  \ 函数被设计为可一次性处理多个四元数，因此易于向量化。`QPose` 用于求四元数的转置。通常这两个函数应作为独立的函数存在，但本章中它们仅与误差计算代码相关，因此放在了同一个文件中。\n\
  \n```\nfunction deltaAngle = ErrorFromQuaternion( q, qTarget )\n    deltaQ = QMult(\
  \ QPose(q), qTarget );\n    deltaAngle = -2.0*deltaQ(2:4);\nend\n\n%% 两个四元数相乘。\n\
  % Q2 将坐标系从 A 变换到 B，Q1 将坐标系从 B 变换到 C，\n% 因此 Q3 将坐标系从 A 变换到 C。\nfunction Q3 = QMult(\
  \ Q2,Q1 )\n    Q3 = [Q1(1,:).*Q2(1,:) - Q1(2,:).*Q2(2,:) - Q1(3,:).*Q2(3,:) - Q1(4,:).*Q2(4,:);...\n\
  \          Q1(2,:).*Q2(1,:) + Q1(1,:).*Q2(2,:) - Q1(4,:).*Q2(3,:) + Q1(3,:).*Q2(4,:);...\n\
  \          Q1(3,:).*Q2(1,:) + Q1(4,:).*Q2(2,:) + Q1(1,:).*Q2(3,:) - Q1(2,:).*Q2(4,:);...\n\
  \          Q1(4,:).*Q2(1,:) - Q1(3,:).*Q2(2,:) + Q1(2,:).*Q2(3,:) + Q1(1,:).*Q2(4,:)];\n\
  end\n\n%% 四元数的转置\n% 转置需要改变角度项的符号。\nfunction q = QPose(q)\n    q(2:4,:) = -q(2:4,:);\n\
  end\n```\n\n控制系统通过以下代码在仿真循环中实现。\n\n```\n% 计算角度误差\nangleError = ErrorFromQuaternion(\
  \ x(1:4), qTarget );\n\nif (controlIsOn)\n    u = [0;0;0];\n    for j = 1:3\n  \
  \      [u(j), dC(j)] = PDControl('update', angleError(j), dC(j));\n    end\nelse\n\
  \    u = [0;0;0];\nend\n```\n\n"
- "# 12.3 模拟受控航天器\n\n## 问题描述\n你想测试姿态控制器并观察其性能表现。\n\n## 解决方案\n解决方案是构建一个 MATLAB 脚本，在脚本中设计\
  \ PD 控制器的矩阵，然后在循环中模拟该控制器，施加计算出的扭矩，直至达到期望的四元数或抵消扰动力矩为止。\n\n\n\n### 工作原理\n\n为控制器 `SpacecraftSim`\
  \ 构建一个仿真脚本。该脚本首先要做的事情是检查角动量守恒，方法是分别以 0.1 秒和 1 秒的时间步长运行仿真 300 秒，并比较两种测试情况下角动量的大小。通过将\
  \ `controlIsOn` 标志设为 false 来关闭控制。在没有外部力矩的情况下，如果我们的方程编写正确，动量应保持恒定。然而，你会看到由于数值积分误差导致的动量增长。第一种情况下的增长应远低于第二种情况，因为较小的时间步长能使积分更精确。请注意，我们为航天器在\
  \ `omega` 和 `omegaRWA` 中设定了随机初始速率以及一个非球形的惯性张量，以帮助捕捉动力学代码中的任何错误。\n\n```\ntEnd = 300;\n\
  dT = 0.1;\ncontrolIsOn = false;\nqECIToBody = [1;0;0;0];\nomega = [0.01;0.02;-0.03];\
  \ % 弧度/秒\nomegaRWA = [5;-3;2]; % 弧度/秒\nd.inr = [3 0 0;0 10 0;0 0 5]; % 千克·米²\n```\n\
  \n图 12-2 显示了测试结果。在时间步长为 0.1 秒的测试中，动量增长低了四个数量级，这表明动力学方程如预期那样守恒角动量。增长的形态不会改变，并且将取决于各种角速度的相对大小。\n\
  \n![A335353_1_En_12_Fig2_HTML.gif](img/A335353_1_En_12_Fig2_HTML.gif)\n\n图 12-2.\
  \ 1 秒和 0.1 秒时间步长下的角动量守恒。在 0.1 秒的测试中，增长降低了四个数量级，从 ![ $$ {\\mathrm{le}}^{-9} $$ ](img/A335353_1_En_12_Chapter_IEq7.gif)\
  \ 降至 ![ $$ {\\mathrm{le}}^{-13} $$ ](img/A335353_1_En_12_Chapter_IEq6.gif)\n\n你通过使用\
  \ `RHS` 函数的数据结构特性来初始化脚本。下面展示了启用控制系统运行时的参数。此时速率初始化为零，你使用 1 秒的时间步长，该步长在前面的测试中显示出足够小的动量增长。\n\
  \n```\n%% 右侧数据结构\nd = RHSSpacecraftWithRWA;\n\n%% 用户初始化\n% 初始化持续时间、时间步长、状态和惯性张量\n\
  tEnd = 600;\ndT = 1;\ncontrolIsOn = true;\nqECIToBody = [1;0;0;0];\nomega = [0;0;0];\
  \ % 弧度/秒\nomegaRWA = [0;0;0]; % 弧度/秒\nd.inr = [3 0 0;0 10 0;0 0 5]; % 千克·米²\nqTarget\
  \ = QUnit([1;0.004;0.0;0]); % 归一化\nd.torque = [0;0;0]; % 干扰力矩\n```\n\n控制系统在此设计。请注意\
  \ `wN` 的小数值以及单位阻尼比。航天器上干扰的频率相当低，而且飞轮有转矩限制，这导致 `wN` 比机器人示例中小得多。三个控制器完全相同。\n\n```\n\
  %% 控制设计\n% 设计一个 PD 控制器\ndC = PDControl( 'struct' );\ndC(1).zeta = 1;\ndC(1).wN =\
  \ 0.02;\ndC(1).wD = 5*dC(1).wN;\ndC(1).tSamp = dT;\ndC(1) = PDControl( 'initialize',\
  \ dC(1) );\n\n% 使所有三个轴控制器相同\ndC(2) = dC(1);\ndC(3) = dC(1);\n```\n\n接下来是仿真循环。一如既往，先用零初始化绘图数组。循环中的第一步是找出当前状态与目标姿态之间的角度误差。接着，根据控制标志的值计算控制加速度或将其设为零。控制转矩通过将控制加速度乘以航天器惯性张量来计算。为绘图目的计算动量，最后，积分一个时间步长。\n\
  \n```\n%% 仿真\n% 状态向量\nx = [qECIToBody;omega;omegaRWA];\n\n% 绘图和步数\nn = ceil(tEnd/dT);\n\
  xP = zeros(length(x)+7,n);\n\n% 计算初始角动量\n[˜,hECI0] = RHSSpacecraftWithRWA(0,x,d);\n\
  \n% 运行仿真\nfor k = 1:n\n    % 计算角度误差\n    angleError = ErrorFromQuaternion( x(1:4),\
  \ qTarget );\n    if (controlIsOn )\n        u = [0;0;0];\n        for j = 1:3\n\
  \            [u(j), dC(j)] = PDControl('update',angleError(j),dC(j));\n        end\n\
  \    else\n        u = [0;0;0];\n    end\n    % 飞轮转矩在等式左侧\n    d.torqueRWA = d.inr*u;\n\
  \    % 计算角动量增量\n    [˜,hECI] = RHSSpacecraftWithRWA(0,x,d);\n    dHECI = hECI -\
  \ hECI0;\n    hMag = sqrt(dHECI'*dHECI);\n    % 存储绘图数据\n    xP(:,k) = [x;d.torqueRWA;hMag;angleError];\n\
  \    % 右侧计算\n    x = RungeKutta(@RHSSpacecraftWithRWA,0,x,dT,d);\nend\n```\n\n输出完全是二维图。我们将它们分页显示，每页包含一到三个图。这使得在大多数电脑显示器上易于阅读。\n\
  \n```\n%% 绘图\n[t,tL] = TimeLabl((0:(n-1))*dT);\nyL = {'q_s', 'q_x', 'q_y', 'q_z'};\n\
  PlotSet( t, xP(1:4,:), 'x⊔label', tL, 'y⊔label', yL,...\n    'plot⊔title', '姿态',\
  \ 'figure⊔title', '姿态');\nyL = {'\\omega_x', '\\omega_y', '\\omega_z'};\nPlotSet(t,\
  \ xP(5:7,:), 'x⊔label', tL, 'y⊔label', yL,...\n    'plot⊔title', '本体速率', 'figure⊔title',\
  \ '本体速率');\nyL = {'\\omega_1', '\\omega_2', '\\omega_3'};\nPlotSet( t, xP(8:10,:),\
  \ 'x⊔label', tL, 'y⊔label', yL,...\n    'plot⊔title', '反作用飞轮速率', 'figure⊔title',\
  \ '反作用飞轮速率');\nyL = {'T_x⊔(Nm)', 'T_y⊔(Nm)', 'T_z⊔(Nm)'};\nPlotSet( t, xP(11:13,:),\
  \ 'x⊔label', tL, 'y⊔label', yL,...\n    'plot⊔title', '控制转矩', 'figure⊔title', '控制转矩');\n\
  yL = {'\\Delta⊔H⊔(Nms)'};\nPlotSet( t, xP(14,:), 'x⊔label', tL, 'y⊔label', yL,...\n\
  \    'plot⊔title', '惯性角动量', 'figure⊔title', '惯性角动量');\nyL = {'\\theta_x⊔(rad)',\
  \ '\\theta_y⊔(rad)', '\\theta_z⊔(rad)'};\nPlotSet( t, xP(15:17,:), 'x⊔label', tL,\
  \ 'y⊔label', yL,...\n    'plot⊔title', '角度误差', 'figure⊔title', '角度误差');\n```\n\n\
  注意，`PlotSet` 使绘图的设置比使用 MATLAB 内置的 `plot` 和辅助函数更加容易，代码也更具可读性。你确实会失去一些灵活性。y 轴标签使用\
  \ LaTeX 表示法。这提供有限的 LaTeX 语法。你可以将绘图设置为完整的 LaTeX 模式，以访问所有 LaTeX 命令。\n\n请注意，我们直接从目标四元数和真实四元数计算角度误差。这代表了我们的姿态传感器。在真实的航天器中，姿态估计相当复杂。使用多种传感器，如磁力计、GPS、地球和太阳传感器的组合，并且通常使用速率积分陀螺仪来平滑测量数据。星敏感器或星跟踪器常用于三轴姿态感知，需要将相机中的图像转换为姿态估计。你不能单独使用陀螺仪，因为它们无法提供相对于惯性系的初始方位。\n\
  \n运行两个测试。第一个测试显示我们的控制器能够补偿一个本体固定的干扰力矩。第二个测试显示控制器能够重新定向航天器。\n\n以下是干扰力矩测试的初始化代码。初始姿态和目标姿态相同，均为单位四元数，但\
  \ `d.torque` 中有一个小的干扰力矩。\n\n```\n% 初始化持续时间、时间步长、状态和惯性张量\ntEnd = 600;\ndT = 1;\n\
  controlIsOn = true;\nqECIToBody = [1;0;0;0];\nomega = [0;0;0]; % 弧度/秒\nomegaRWA\
  \ = [0;0;0]; % 弧度/秒\nd.inr = [3 0 0;0 10 0;0 0 5]; % 千克·米²\nqTarget = QUnit([1;0;0.0;0]);\n\
  d.torque = [0;0.0001;0]; % 干扰力矩 (N)\n```\n\n我们将仿真运行到 600 秒，以便观察过渡过程稳定下来。干扰力矩非常小，这符合航天器的典型情况。我们使力矩为单轴，以使响应更清晰。图\
  \ 12-3 显示了完整的输出图集。\n\n![A335353_1_En_12_Fig3_HTML.gif](img/A335353_1_En_12_Fig3_HTML.gif)\n\
  \n图 12-3. 控制一个突然施加的外部力矩\n\n干扰导致围绕 y 轴的姿态发生变化。这种偏移在使用 PD 控制器时是预料之中的。控制转矩最终与干扰匹配，角度误差达到最大值。\n\
  \ny 轴飞轮速率线性增长，因为它必须吸收由力矩产生的所有动量。我们并未限制最大飞轮速率。在真实的航天器中，飞轮很快就会饱和，达到其允许的最大速度。我们的控制系统需要其他执行器来对飞轮进行消饱和处理。惯性角动量也随着恒定外部力矩的出现而线性增长，这是预期的。\n\
  \n现在，我们进行一个围绕 x 轴的姿态校正。以下是初始化代码。\n\n```\n% 初始化持续时间、时间步长、状态和惯性张量\ntEnd = 600;\ndT\
  \ = 1;\ncontrolIsOn = true;\nqECIToBody = [1;0;0;0];\nomega = [0;0;0]; % 弧度/秒\n\
  omegaRWA = [0;0;0]; % 弧度/秒\nd.inr = [3 0 0;0 10 0;0 0 5]; % 千克·米²\nqTarget = QUnit([1;0.004;0.0;0]);\
  \ % 归一化\nd.torque = [0;0;0]; % 干扰力矩\n```\n\n我们指令一个围绕 x 轴的小姿态偏移，这通过改变四元数中的第二个元素来实现。我们对四元数进行单位化以防止数值问题。图\
  \ 12-4 显示了输出图。\n\n![A335353_1_En_12_Fig4_HTML.gif](img/A335353_1_En_12_Fig4_HTML.gif)\n\
  \n图 12-4. 指令一个关于 x 轴的小姿态偏移\n\n在这种情况下，围绕 x 轴的角度误差被减小到零。惯性角动量保持“恒定”，尽管由于数值积分中的截断误差会有一些微小波动。这是预料之中的，并且在控制系统运行时持续检查角动量是良好的做法。如果它不保持近似恒定，则仿真存在问题。内部力矩不会改变惯性角动量。这就是为什么反作用飞轮被称为动量交换装置。它们与航天器本体交换动量，但不会计入惯性角动量总量。\n\
  \n在两种情况下，姿态速率都保持较小，因此欧拉耦合力矩很小。这证明了我们先前将航天器视为三个双积分器的决定是合理的。同时也证明了我们使用四元数误差到小角度近似的合理性。\n\
  \n\n\n"
- "# 12.4 批量执行仿真运行\n\n## 问题\n\n你已经使用仿真脚本验证了动量守恒并测试了控制器，但请注意，你需要为每种情况手动修改脚本顶部的行。这对于开发阶段来说没问题，但这会使结果难以复现；你无法得知生成特定图表的初始条件。你可能需要针对一整套输入运行仿真，并进行蒙特卡洛分析。\n\
  \n## 解决方案\n\n基于该脚本创建一个新的函数，并将关键参数作为输入。一个新的数据结构将同时存储输入和输出，这样你就可以将每次运行的结果保存为 `.mat`\
  \ 文件。这使得将来可以重新绘制任何一次运行的结果，或者根据存储的输入重新运行；例如，当你发现并修复了控制器中的一个错误时。\n\n## 工作原理\n\n首先将仿真脚本复制到一个新文件中。添加一个函数签名。用输入结构替换初始化变量。执行仿真，然后保存输入结构以及生成的输出。生成的函数头如下所示。`input`\
  \ 结构包含 RHS 数据、控制器数据和仿真时序数据。\n\n```\n%% SpacecraftSimFunction 航天器反作用轮仿真函数\n% 根据给定的初始状态，对带有反作用轮的航天器进行仿真。\n\
  %% 格式\n% d = SpacecraftSimFunction( x0, qTarget, input )\n%% 输入\n% x0 (7+n,1) 初始状态\n\
  % qTarget (4,1) 目标四元数\n% input (.) 数据结构\n%   .rhs (.) RHS 数据\n%   .pd (:) 控制器\n\
  %   .dT (1,1) 时间步长\n%   .tEnd (1,1) 仿真时长\n%   .controlIsOn 控制开关标志\n%% 输出\n% d (.)\
  \ 数据结构\n%   .input\n%   .x0\n%   .qTarget\n%   .xPlot\n%   .dPlot\n%   .tPlot\n\
  %   .yLabel\n%   .dLabel\n%   .tLabel\n```\n\n现在，你可以编写一个循环调用仿真函数的脚本。可能性是无限的：你可以测试不同的目标，为蒙特卡洛仿真改变初始条件，或者施加不同的干扰力矩。你可以对结果进行统计分析，或者根据某些条件识别并绘制单次运行的结果。在本示例中，你将找出每次运行中施加的最大控制力矩。\n\
  \n```\n%% 航天器仿真多次运行\n% 在循环中执行 SpacecraftSimBatch 多次运行，并改变初始条件。\n% 找出每种情况下施加的最大控制力矩。\n\
  %% 另请参阅\n% SpacecraftSimFunction\n\nsim = struct;\n\n%% 控制器设计\n% 设计一个 PD 控制器\ndC\
  \ = PDControl( 'struct' );\ndC(1).zeta = 1;\ndC(1).wN = 0.02;\ndC(1).wD = 5*dC(1).wN;\n\
  dC(1).tSamp = dT;\ndC(1) = PDControl( 'initialize', dC(1) );\n% 使三个轴的控制器完全相同\ndC(2)\
  \ = dC(1);\ndC(3) = dC(1);\nsim.pd = dC;\n\n%% 航天器模型\n% 设置航天器为非球形；无干扰\nrhs = RHSSpacecraftWithRWA;\n\
  rhs.inr = [3 0 0;0 10 0;0 0 5]; % kg-m²\nrhs.torque = [0;0;0]; % 干扰力矩\nsim.rhs =\
  \ rhs;\n\n%% 初始化\n% 初始化仿真时长、时间步长、状态和惯量\nsim.tEnd = 600;\nsim.dT = 1;\nsim.controlIsOn\
  \ = true;\n\n% 航天器状态\nqECIToBody = [1;0;0;0];\nomega = [0;0;0]; % rad/sec\nomegaRWA\
  \ = [0;0;0]; % rad/sec\nx0 = [qECIToBody;omega;omegaRWA];\n\n% 目标四元数\nqTarget =\
  \ QUnit([1;0.004;0.0;0]); % 归一化\n\n%% 仿真循环\nclear d;\nfor k = 1:10;\n    % 改变初始条件中的某个参数并进行仿真\n\
  \    x0(5) = 1e-3*k;\n    thisD = SpacecraftSimFunction( x0, qTarget, sim );\n \
  \   % 将运行结果保存为 .mat 文件\n    thisDir = fileparts(mfilename('fullpath'));\n    fileName\
  \ = fullfile(thisDir,'Output', sprintf('Run%d',k));\n    save( fileName, '-struct',\
  \ 'thisD' );\n    % 存储运行输出\n    d(k) = thisD;\nend\n\n%% 对结果进行统计分析\n% ... 按需进行\n\
  for k = 1:length(d)\n    tMax(k) = max( max( d(k).dPlot(2:4,:) ) );\nend\n\nfigure;\n\
  plot(1:length(d), tMax);\nxlabel('运行次数')\nylabel('力矩 (Nm)')\ntitle('最大控制力矩');\n\n\
  % 绘制单次运行结果\nkPlot = 4;\nPlotSpacecraftSim( d(4) );\n```\n\n图 12-5 显示了最大力矩的结果。\n\n\
  ![A335353_1_En_12_Fig5_HTML.gif](img/A335353_1_En_12_Fig5_HTML.gif)\n\n**图 12-5.**\
  \ 10 次仿真运行中的最大控制力矩\n\n某次运行的输出结果如下所示。\n\n```\n>> d(1)\n\nans =\n\n      input: [1x1\
  \ struct]\n         x0: [10x1 double]\n    qTarget: [4x1 double]\n      xPlot: [10x600\
  \ double]\n      dPlot: [7x600 double]\n      tPlot: [1x600 double]\n     tLabel:\
  \ '时间 (分钟)'\n     yLabel: {1x10 cell}\n     dLabel: {1x7 cell}\n```\n\n\n\n作为一个有趣示例，你可以为航天器设定更高的初始速率，观察控制器如何响应。在命令行中，将围绕`x`轴的初始速率改为`0.2\
  \ rad/sec`，然后调用仿真函数（不返回任何输出），以便生成全套图表。你会看到响应耗时很长（超过 20 分钟），但速率最终会衰减至零。\n\n![A335353_1_En_12_Fig6_HTML.gif](img/A335353_1_En_12_Fig6_HTML.gif)\n\
  \n**图 12-6:** 对`x`轴大速率的控制响应。最终速率确实被抑制了！\n\n完整的仿真函数如下所示。内置演示程序对默认航天器模型执行无控制的开环仿真，这与前面配方中进行的动量守恒测试（图\
  \ 12-2）一致。\n\n```matlab\nfunction d = SpacecraftSimFunction( x0, qTarget, input\
  \ )\n\n%% Handle inputs\nif nargin == 0\n    % perform an open loop simulation\n\
  \    input = struct;\n    input.rhs = RHSSpacecraftWithRWA;\n    input.pd = [];\n\
  \    input.dT = 1; % sec\n    input.tEnd = 600; % sec\n    input.controlIsOn = false;\n\
  \    x0 = [1;0;0;0;1e-3*randn(6,1)];\n    SpacecraftSimFunction( x0, [], input );\n\
  \    return;\nend\n\nif isempty(x0)\n    qECIToBody = [1;0;0;0];\n    omega = [0;0;0];\
  \ % rad/sec\n    omegaRWA = [0;0;0]; % rad/sec\n    x0 = [qECIToBody;omega;omegaRWA];\n\
  end\n\nif isempty(qTarget)\n    qTarget = x0(1:4);\nend\n\n%% Simulation\n% State\
  \ vector\nx = x0;\nnWheels = length(x0)-7;\n\n% Plotting and number of steps\nn\
  \ = ceil(input.tEnd/input.dT);\nxP = zeros(length(x),n);\ndP = zeros(7,n);\n\n%\
  \ Find the initial angular momentum\nd = input.rhs;\n[˜,hECI0] = RHSSpacecraftWithRWA(0,x,d);\n\
  \n% Run the simulation\nfor k = 1:n\n    % Control\n    u = [0;0;0];\n    angleError\
  \ = [0;0;0];\n    if (input.controlIsOn )\n        % Find the angle error\n    \
  \    angleError = ErrorFromQuaternion( x(1:4), qTarget );\n        % Update the\
  \ controllers individually\n        for j = 1:nWheels\n            [u(j), input.pd(j)]\
  \ = PDControl('update',angleError(j), input.pd(j));\n        end\n    end\n\n  \
  \  % Wheel torque\n    d.torqueRWA = d.inr*u;\n\n    % Get the delta angular momentum\n\
  \    [˜,hECI] = RHSSpacecraftWithRWA(0,x,d);\n    dHECI = hECI - hECI0;\n    hMag\
  \ = sqrt(dHECI'*dHECI);\n\n    % Plot storage\n    xP(:,k) = x;\n    dP(:,k) = [hMag;d.torqueRWA;angleError];\n\
  \n    % Right hand side\n    x = RungeKutta(@RHSSpacecraftWithRWA,0,x,input.dT,d);\n\
  end\n\n[t,tL] = TimeLabl((0:(n-1))*input.dT);\n\n%% Store data\n% Record initial\
  \ conditions\nd = struct;\nd.input = input;\nd.x0 = x0;\nd.qTarget = qTarget;\n\
  d.xPlot = xP;\nd.dPlot = dP;\nd.tPlot = t;\nd.tLabel = tL;\n\ny = cell(1,nWheels);\n\
  for k = 1:nWheels\n    y{k} = sprintf('\\\\omega_%d',k);\nend\nd.yLabel = {'q_s','q_x','q_y','q_z','\\\
  omega_x','\\omega_y','\\omega_z',y{:}};\nd.dLabel = {'\\Delta⊔H⊔(Nms)','T_x⊔(Nm)',\
  \ 'T_y⊔(Nm)', 'T_z⊔(Nm)', ...\n            '\\theta_x⊔(rad)', '\\theta_y⊔(rad)',\
  \ '\\theta_z⊔(rad)'};\n\nif nargout == 0\n    PlotSpacecraftSim( d );\nend\n```\n\
  \n绘图代码被封装到一个独立的函数中，该函数接受输出数据结构。在仿真函数中创建并保存绘图标签，这允许你重新绘制任何已保存的输出。添加一个语句，在创建控制和角度误差图之前检查非零角度误差，因为开环仿真不需要这些图。\n\
  \n> **提示：** 使用结构体中的字段进行绘图，无需在本地重命名变量，这样在运行仿真后，你可以直接将单个绘图复制粘贴到命令行。\n\n```matlab\n\
  %% PlotSpacecraftSim Plot the spacecraft simulation output\n%% Form\n% PlotSpacecraftSim(\
  \ d )\n\n%% Inputs\n% d (.) Simulation data structure\n\n%% Copyright\n% Copyright\
  \ (c) 2015 Princeton Satellite Systems, Inc.\n% All rights reserved.\n\nfunction\
  \ PlotSpacecraftSim( d )\n\nt = d.tPlot;\nyL = d.yLabel(1:4);\nPlotSet( d.tPlot,\
  \ d.xPlot(1:4,:), 'x⊔label', d.tLabel, 'y⊔label', yL,...\n         'plot⊔title',\
  \ 'Attitude', 'figure⊔title', 'Attitude');\n\nyL = d.yLabel(5:7);\nPlotSet(d.tPlot,\
  \ d.xPlot(5:7,:), 'x⊔label', d.tLabel, 'y⊔label', yL,...\n        'plot⊔title',\
  \ 'Body⊔Rates', 'figure⊔title', 'Body⊔Rates');\n\nyL = d.yLabel(8:end);\nPlotSet(\
  \ t, d.xPlot(8:end,:), 'x⊔label', d.tLabel, 'y⊔label', yL,...\n         'plot⊔title',\
  \ 'RWA⊔Rates', 'figure⊔title', 'RWA⊔Rates');\n\nyL = d.dLabel(1);\nPlotSet( d.tPlot,\
  \ d.dPlot(1,:), 'x⊔label', d.tLabel, 'y⊔label', yL,...\n         'plot⊔title', 'Inertial⊔Angular⊔Momentum',...\n\
  \         'figure⊔title', 'Inertial⊔Angular⊔Momentum');\n\nif any(d.dPlot(5:end,:)˜=0)\n\
  \    yL = d.dLabel(2:4);\n    PlotSet( d.tPlot, d.dPlot(2:4,:), 'x⊔label', d.tLabel,\
  \ 'y⊔label', yL,...\n             'plot⊔title', 'Control⊔Torque', 'figure⊔title',\
  \ 'Control⊔Torque');\n\n    yL = d.dLabel(5:end);\n    PlotSet( d.tPlot, d.dPlot(5:end,:),\
  \ 'x⊔label', d.tLabel, 'y⊔label', yL,...\n             'plot⊔title', 'Angular⊔Errors',\
  \ 'figure⊔title', 'Angular⊔Errors');\nend\n```\n\n一个有趣的练习是：将固定的干扰输入`d.torque`替换为一个函数句柄，该句柄调用一个干扰函数。这构成了我们航天器控制工具箱中航天器仿真的基础。在该工具箱中，干扰是根据航天器几何形状、空间环境以及航天器沿轨道旋转和运动的情况计算得出的。\n\
  \n## 总结\n\n本章演示了如何编写动力学方程，并为带有反作用轮的航天器实现一个简单的控制律。我们的控制系统仅适用于小角度变化，如果航天器的角速率变大，它将无法正常工作。此外，我们未考虑反作用轮的力矩或动量限制。你还学习了四元数以及如何使用四元数实现刚体运动学。我们展示了如何从两个四元数中获取角度误差。表\
  \ 12-1 列出了本章开发的代码。\n\n**表 12-1: 本章代码清单**\n\n| 文件 | 描述 |\n| --- | --- |\n| `RHSSpacecraftWithRWA`\
  \ | 带反作用轮的航天器的右端函数。 |\n| `ErrorFromQuaternion` | 航天器仿真脚本。 |\n| `SpacecraftSim` |\
  \ 航天器仿真脚本。 |\n| `SpacecraftSimBatch` | 航天器仿真函数。 |\n| `BatchSimRuns` | 多次运行航天器仿真。\
  \ |\n| `PlotSpacecraftSim` | 绘制仿真结果。 |\n| `QTForm` | 沿四元数相反方向变换向量。 |\n| `QUnit`\
  \ | 归一化四元数。 |\n\n\n\n好的，以下是按照您的要求进行排版后的 Markdown 文档。\n\n---\n\n"
