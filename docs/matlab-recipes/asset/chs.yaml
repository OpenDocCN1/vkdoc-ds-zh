  \ 会刷新系统图形队列，将更新后的补片绘制到屏幕上。当 `pause` 关闭时，图形不会更新，你只能在窗口中看到初始帧。另外请注意，由暂停和图形更新引起的实际时间增加了将近\
  \ 15 秒。要强制更新图形而不使用 `pause`，请使用 `drawnow`。\n\n此脚本利用代码段（cells）允许独立运行各个部分。这意味着你可以通过重新执行该代码段来重新运行动画，而无需重新创建图形。这可以通过工具栏中的“运行节”按钮或键盘命令（例如\
  \ Mac 上的 Command-Enter）来完成。\n\n假设你想向动画中添加一个显示旋转角度的文本项。你可以轻松地使用 `title` 来实现：\n\n\
