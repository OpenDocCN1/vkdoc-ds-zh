- "# 9. 故障检测\n\n**电子补充材料：** 本章的在线版本（doi: [10.1007/978-1-4842-0559-4_9](http://dx.doi.org/10.1007/978-1-4842-0559-4_9)）包含补充材料，仅供授权用户使用。\n\
  \n#### 引言\n\n故障检测是在动态系统中检测失效（也称为故障）的过程。对于需要在无人监督情况下运行的系统来说，这是一个重要的领域。检测失效的方法有很多种。最简单的是使用布尔逻辑对照固定阈值进行检查。例如，您可以检查汽车的速度是否超过限速。其他方法包括模糊逻辑、参数估计、专家系统、统计分析和奇偶空间方法。本章实现了一种类型的故障检测系统——检测滤波器。其基于线性滤波。检测滤波器是一种状态估计器，被调谐用于检测特定的故障。您将为空气涡轮机设计一个检测滤波器系统。您还将学习如何构建一个图形用户界面\
  \ (GUI) 作为故障检测仿真的前端。\n\n### 9.1 为空气涡轮机建模\n\n#### 问题\n您需要一个空气涡轮机的数值模型来演示检测滤波器。\n\n\
  #### 解决方案\n写出空气涡轮机的运动方程。您将使用空气涡轮机的线性模型以简化模型和检测滤波器的设计。这将允许您使用状态空间模型对该系统进行建模。\n\n\n\
  \n### 工作原理\n\n图 9-1 展示了一个空气涡轮机。¹ 它有一个恒压气源。您可以通过控制气源的阀门（即调压阀）来调节涡轮机的转速。空气流经涡轮叶片使其旋转。控制系统需要调节气压以应对负载变化。您需要测量阀门下游的气压\
  \ `p`，并通过转速计测量涡轮机的转速 `ω`。\n\n![A335353_1_En_9_Fig1_HTML.jpg](img/A335353_1_En_9_Fig1_HTML.jpg)\n\
  \n图 9-1. 空气涡轮机。箭头表示气流方向。空气流过涡轮叶片顶端，使其旋转。\n\n空气涡轮机的动力学模型如下：\n\n![ $$ \\left[\\begin{array}{l}\\\
  dot{p}\\hfill \\\\ {}\\dot{\\omega}\\hfill \\end{array}\\right]=\\left[\\begin{array}{rr}\\\
  hfill -\\frac{1}{\\tau_p}& \\hfill 0\\\\ {}\\hfill \\frac{K_t}{\\tau_t}& \\hfill\
  \ -\\frac{1}{\\tau_t}\\end{array}\\right]\\left[\\begin{array}{l}p\\hfill \\\\ {}\\\
  omega \\hfill \\end{array}\\right]+\\left[\\begin{array}{l}\\frac{K_p}{\\tau_p}\\\
  hfill \\\\ {}0\\hfill \\end{array}\\right]u $$ ](A335353_1_En_9_Chapter_Equ1.gif)\n\
  \n(9.1)\n\n这是一个状态空间系统：\n\n![ $$ \\dot{x}= ax+bu $$ ](img/A335353_1_En_9_Chapter_Equ2.gif)\n\
  \n(9.2)\n\n其中：\n\n![ $$ a=\\left[\\begin{array}{rr}\\hfill -\\frac{1}{\\tau_p}&\
  \ \\hfill 0\\\\ {}\\hfill \\frac{K_t}{\\tau_t}& \\hfill -\\frac{1}{\\tau_t}\\end{array}\\\
  right] $$ ](A335353_1_En_9_Chapter_Equ3.gif)\n\n(9.3)\n\n![ $$ b=\\left[\\begin{array}{l}\\\
  frac{K_p}{\\tau_p}\\hfill \\\\ {}0\\hfill \\end{array}\\right] $$ ](A335353_1_En_9_Chapter_Equ4.gif)\n\
  \n(9.4)\n\n状态向量为：\n\n![ $$ \\left[\\begin{array}{l}p\\hfill \\\\ {}\\omega \\hfill\
  \ \\end{array}\\right] $$ ](A335353_1_En_9_Chapter_Equ5.gif)\n\n(9.5)\n\n当系统处于平衡状态时，调压阀下游的压力等于\
  \ `K[p] * u`。`τ[p]` 是调压阀的时间常数，`τ[t]` 是涡轮机的时间常数。当系统处于平衡状态时，涡轮机转速为 `K[t] * p`。转速计测量\
  \ `ω`，压力传感器测量 `p`。负载的影响被纳入涡轮机的时间常数中。\n\n动力学方程右侧的代码如下所示。其中只有一行代码是右侧项，其余部分用于返回默认的数据结构。该模型的简洁性得益于它采用状态空间模型。状态的数量可能很大，但代码结构保持不变。\n\
  \n```\nfunction xDot = RHSAirTurbine( ˜, x, d )\n% 默认数据结构\nif ( nargin < 1 )\n \
  \ kP = 1;\n  kT = 2;\n  tauP = 10;\n  tauT = 40;\n  c = eye(2);\n  b = [kP/tauP;0];\n\
  \  a = [-1/tauP 0; kT/tauT -1/tauT];\n  xDot = struct('a',a,'b',b,'c',c,'u',0);\n\
  \  return\nend\n% 导数\nxDot = d.a*x + d.b*d.u;\n```\n\n系统对 `u` 的阶跃输入的响应如图 9-2 所示。压力比涡轮机更快地达到稳定状态。这是由于涡轮机的时间常数以及气压变化的滞后所致。残差非常小，因为没有故障发生。\n\
  \n![A335353_1_En_9_Fig2_HTML.jpg](img/A335353_1_En_9_Fig2_HTML.jpg)\n\n图 9-2. 空气涡轮机对调压阀阶跃输入的响应\n\
  \n## 9.2 构建检测滤波器\n\n### 问题\n\n您希望利用上一节中建立的线性模型，构建一个系统来检测空气涡轮机中的故障。\n\n### 解决方案\n\
  \n您将构建一个能够检测调压阀故障和转速计故障的检测滤波器。我们的被控对象模型（即连续时间状态空间矩阵 `a`、`b` 和 `c`）将作为滤波器构建函数的输入。\n\
  \n\n\n### 工作原理\n\n该检测滤波器是一个带有特定增益矩阵的估计器，该矩阵对残差进行乘法运算。\n\n![ $$ \\left[\\begin{array}{l}\\\
  dot{\\widehat{p}}\\hfill \\\\ {}\\dot{\\widehat{\\omega}}\\hfill \\end{array}\\\
  right]=\\left[\\begin{array}{rr}\\hfill -\\frac{1}{\\tau_p}& \\hfill 0\\\\ {}\\\
  hfill \\frac{K_t}{\\tau_t}& \\hfill -\\frac{1}{\\tau_t}\\end{array}\\right]\\left[\\\
  begin{array}{l}\\widehat{p}\\hfill \\\\ {}\\widehat{\\omega}\\hfill \\end{array}\\\
  right]+\\left[\\begin{array}{l}\\frac{K_p}{\\tau_p}\\hfill \\\\ {}0\\hfill \\end{array}\\\
  right]u+\\left[\\begin{array}{rr}\\hfill {d}_{11}& \\hfill {d}_{12}\\\\ {}\\hfill\
  \ {d}_{21}& \\hfill {d}_{22}\\end{array}\\right]\\left[\\begin{array}{l}p-\\widehat{p}\\\
  hfill \\\\ \\omega -\\widehat{\\omega}\\hfill \\end{array}\\right] $$ ](A335353_1_En_9_Chapter_Equ6.gif)\n\
  \n（9.6）其中 `$$ \\widehat{p} $$` 是估计压力，`$$ \\widehat{\\omega} $$` 是涡轮的估计角速率。`D` 矩阵是检测滤波器的增益矩阵。这些增益将残差（即测量状态与估计状态之间的差值）反馈到检测滤波器中。残差向量为\n\
  \n![ $$ r=\\left[\\begin{array}{l}p-\\widehat{p}\\hfill \\\\ \\omega -\\widehat{\\\
  omega}\\hfill \\end{array}\\right] $$ ](A335353_1_En_9_Chapter_Equ7.gif)\n\n（9.7）\n\
  \n需要选择 `D` 矩阵，使得该向量能够告知您故障的性质。应选择增益，使得：\n\n*   滤波器保持稳定。\n*   如果调压器发生故障，第一个残差 `$$\
  \ p-\\widehat{p} $$` 不为零，但第二个残差保持为零。\n*   如果涡轮发生故障，第二个残差 `$$ \\omega -\\widehat{\\\
  omega} $$` 不为零，但第一个残差保持为零。\n\n增益矩阵为\n\n![ $$ D=a+\\left[\\begin{array}{rr}\\hfill\
  \ \\frac{1}{\\tau_1}& \\hfill 0\\\\ {}\\hfill 0& \\hfill \\frac{1}{\\tau_2}\\end{array}\\\
  right] $$ ](A335353_1_En_9_Chapter_Equ8.gif)\n\n（9.8）\n\n时间常数 `τ[1]` 是压力残差时间常数。时间常数\
  \ `τ[2]` 是转速计残差时间常数。实际上，您抵消了被控对象的动态特性，并用去耦的检测滤波器动态特性替代它们。这些时间常数应比动力学模型中的时间常数更短，以便能够快速检测到故障。然而，为了避免数值不稳定性，它们至少应该是采样周期的两倍长。\n\
  \n编写一个具有三种操作模式的函数：初始化（initialize）、更新（update）和重置（reset）。使用 `varargin` 允许三种模式具有不同的输入列表。函数签名为\n\
  \n```\nfunction d = DetectionFilter( action, varargin )\n```\n\n`DetectionFilter`\
  \ 的标头和语法如下所示。使用一些 LaTeX 方程来描述该函数。\n\n```\n%% DetectionFilter 构建并更新一个线性检测滤波器。\n%\
  \  检测滤波器增益矩阵 d 在初始化操作期间设计。\n%  然后使用内部函数 CToDZOH 将连续矩阵离散化。\n%  估计状态和残差向量被初始化为由 a\
  \ 决定的维度。\n%  在更新操作期间，计算残差和新的估计状态，并存储在数据结构 d 中。\n%\n%  残差计算公式为\n%\n%  $$r = y - c\\\
  hat{x}$$\n%\n%  使用检测滤波器增益计算出的估计状态为\n%\n%  $$\\hat{x}_{k+1} = a*\\hat{x} + b*u +\
  \ d*r$$\n%\n%% 语法\n%  d = DetectionFilter( 'initialize', d, tau, dT );\n%  d = DetectionFilter(\
  \ 'update', u, y, d );\n%  d = DetectionFilter( 'reset', d );\n%\n%% 输入参数\n%  action\
  \ (1,:) 'initialize' 或 'update'\n%  d (.) 数据结构\n%      .a (:,:) 状态空间连续 a 矩阵\n% \
  \     .b (:,1) 状态空间连续 b 矩阵\n%      .c (:,:) 状态空间连续 c 矩阵\n%  tau (:,1) 时间常数向量\n%\
  \  dT (1,1) 时间步长\n%  u (:,1) 执行器输入\n%  y (:,1) 测量向量\n%\n%% 输出参数\n%  d (.) 更新后的数据结构\n\
  %      .a (:,:) 状态空间离散 a 矩阵\n%      .b (:,1) 状态空间离散 b 矩阵\n%      .c (:,:) 状态空间离散\
  \ c 矩阵\n%      .d (:,:) 检测滤波器增益矩阵\n%      .x (:,1) 估计状态\n%      .r (:,1) 残差向量\n\
  ```\n\n以下 `DetectionFilter` 中的代码构建并初始化了该滤波器。被控对象的连续状态空间模型（在此例中为我们的线性空气涡轮模型）作为一个输入。所选的时间常数\
  \ `τ` 也是一个输入，它们被添加到被控对象模型中，如公式 9.8 所示。该函数对被控对象的 `a` 和 `b` 矩阵以及计算出的检测滤波器增益矩阵 `d`\
  \ 进行离散化。\n\n```\nswitch lower(action)\n    case 'initialize'\n        d   = varargin{1};\n\
  \        tau = varargin{2};\n        dT  = varargin{3};\n\n        % 设计检测滤波器\n \
  \       d.d = d.a + diag(1./tau);\n\n        % 对两者进行离散化\n        d.d    = CToDZOH(\
  \ d.d, d.b, dT );\n        [d.a, d.b] = CToDZOH( d.a, d.b, dT );\n\n        % 初始化状态\n\
  \        m   = size(d.a,1);\n        d.x = zeros(m,1);\n        d.r = zeros(m,1);\n\
  ```\n\n检测滤波器的更新位于同一个函数中。注意这些方程是按照标头中的描述实现的。\n\n```\n    case 'update'\n        u\
  \ = varargin{1};\n        y = varargin{2};\n        d = varargin{3};\n\n       \
  \ r   = y - d.c * d.x;\n        d.x = d.a * d.x + d.b * u + d.d * r;\n        d.r\
  \ = r;\n```\n\n最后，创建一个重置操作，允许您在仿真之间重置滤波器的残差和状态值。\n\n```\n    case 'reset'\n    \
  \    d = varargin{1};\n        m = size(d.a,1);\n        d.x = zeros(m,1);\n   \
  \     d.r = zeros(m,1);\nend\n```\n\n## 9.3 仿真故障检测系统\n\n### 问题\n\n您希望仿真被控对象中的故障，并演示故障检测的性能。\n\
  \n### 解决方案\n\n您将构建一个 MATLAB 脚本，该脚本使用上一节中的函数设计检测滤波器，然后通过用户可选择的调压器或转速计故障对其进行仿真。该故障可以是完全故障或部分故障。\n\
  \n\n\n"
- "# 工作原理\n\n该脚本利用前一教程中的 `DetectionFilter` 设计了一个检测滤波器，并通过循环实现其功能。龙格-库塔积分法用于传播空气涡轮机的连续域右侧函数\
  \ `RHSAirTurbine`。检测滤波器是离散时间的。\n\n该脚本包含两个比例因子 `uF` 和 `tachF`，它们分别乘以调节器输入和转速计输出以模拟故障。将比例因子设置为零表示完全故障，设置为\
  \ 1 表示设备正常工作。如果其中一个发生故障，其对应的残差将不为零，而另一个残差将保持为零。\n\n```\n%% 检测滤波器仿真\n\n% 仿真空气涡轮机的故障检测。\n\
  \n% 空气涡轮机具有一个恒压空气源，空气通过管道驱动涡轮叶片。\n% 涡轮机连接到一个负载上。\n\n% 空气涡轮机模型是线性的。通过将调节器输入和转速计输出乘以一个常数来模拟故障。\n\
  % 常数为 0 表示完全故障，1 表示正常工作。\n\n%% 用户输入\n\n% 故障参数。可设置为任意数值。0 表示完全故障，1 表示正常工作。\n% uF\
  \ 缩放执行器输入 u。tachF 缩放速率测量值。\nuF = 1;\ntachF = 0;\n\n% 故障检测的时间常数\ntau1 = 0.3; % 秒\n\
  tau2 = 0.3; % 秒\n\n% 结束时间\ntEnd = 1000; % 秒\n\n% 状态空间系统\nd = RHSAirTurbine;\n\n\
  %% 初始化\n\ndT = 0.02; % 秒\nn = ceil(tEnd/dT);\n\n% 初始状态\nx = [0;0];\n\n%% 检测滤波器设计\n\
  \ndF = DetectionFilter('initialize',d,[tau1;tau2],dT);\n\n%% 运行仿真\n\n% 控制输入。这是调节器输入。\n\
  u = 100;\n\n% 绘图数组\nxP = zeros(4,n);\nt = (0:n-1)*dT;\n\nfor k = 1:n\n\n    % 包含测量故障的测量向量\n\
  \    y = [x(1);tachF*x(2)]; % 传感器故障\n\n    xP(:,k) = [x;dF.r];\n\n    % 更新检测滤波器\n\
  \    dF = DetectionFilter('update',u,y,dF);\n\n    % 积分一步\n    d.u = uF*u; % 执行器故障\n\
  \    x = RungeKutta( @RHSAirTurbine, t(k), x, dT, d );\n\nend\n\n%% 绘制状态和残差\n\n\
  [t,tL] = TimeLabel(t);\nyL = {'p' '\\omega' '残差 P' '残差 \\omega' };\ntTL = '检测滤波器仿真';\n\
  PlotSet( t, xP,'x label',tL,'y label',yL,'plot title',tTL,'figure title',tTL)\n\
  ```\n\n在图 9-3 中，调节器发生故障，其残差不为零。在图 9-4 中，转速计发生故障，其残差不为零。残差清晰地显示了故障所在。简单的布尔逻辑（例如 if\
  \ end 语句）就足以实现此功能。\n\n![A335353_1_En_9_Fig4_HTML.jpg](img/A335353_1_En_9_Fig4_HTML.jpg)\n\
  \n图 9-4. 空气涡轮机对转速计故障的响应\n\n![A335353_1_En_9_Fig3_HTML.jpg](img/A335353_1_En_9_Fig3_HTML.jpg)\n\
  \n图 9-3. 空气涡轮机对调节器故障的响应\n\n"
- '# 9.4 为检测滤波器仿真构建图形用户界面


  ## 问题


  你需要一个图形用户界面（GUI）来为故障检测仿真提供图形化接口，以便评估滤波器的性能。


  ## 解决方案


  你将使用 MATLAB 的 GUIDE 工具构建一个 GUI，该 GUI 允许你：


  - 设置残差时间常数。

  - 设置仿真的结束时间。

  - 设置压力调节器输入。

  - 随时引入压力调节器或转速计故障。

  - 在图表中显示状态和残差。


  ## 工作原理


  MATLAB 的 GUI 构建系统 GUIDE 通过在命令行输入 `guide` 来启动。有几种 GUI 模板选项，也可以选择空白 GUI；你将从一个包含 `uicontrols`
  的 GUI 开始。首先，根据你期望的功能列表，列出所需的控件：


  - 用于输入仿真持续时间、残差时间常数 τ[1] 和 τ[2]、压力调节器设定值 `u` 的编辑框

  - 用于输入压力调节器和转速计故障参数的编辑框，并带有按钮，用于将新设定的值发送到仿真程序

  - 用于显示计算出的检测滤波器增益的文本框

  - 用于启动仿真的运行按钮

  - 绘图坐标轴


  为了在仿真运行期间更改故障参数，你需要循环检查一个可由 GUI 外部设置的变量。你可以使用全局变量来实现这一点。


  GUI 控件的模板提供了几个带标签的编辑框、一组单选按钮以及“计算”和“重置”两个操作按钮。你将使用编辑框来实现控件列表中的前两项，并使用带有单选按钮的区域来处理故障参数。图
  9-5 显示了你进行任何修改之前在 GUIDE 中的模板 GUI。


  ![A335353_1_En_9_Fig5_HTML.jpg](img/A335353_1_En_9_Fig5_HTML.jpg)


  图 9-5. 包含 uicontrols 的 GUI 模板


  只需在 GUIDE 的模板 GUI 中双击某个项目，即可打开检查器并编辑该项目的文本、字体大小等属性。对于文本项目，更改该项目检查器中的 `String` 字段。对于框架项目（如
  `Measures` 框架），更改 `Title` 字段。对于编辑框，更改 `Tag` 字段。对左侧的控件集进行以下修改：


  1.  将 `Density(D)` 标签的 `String` 改为“Duration”。

  2.  将 `Volume(V)` 标签的 `String` 改为“Input”。

  3.  将标签字体大小增加到 10 磅。

  4.  将密度编辑框的 `Tag` 改为 `duration`。

  5.  将体积编辑框的 `Tag` 改为 `input`。

  6.  将质量文本框的 `Tag` 改为 `gains`。

  7.  将 `Measures` 框架的 `Title` 改为“Parameters”。


  完成这些修改后，点击绿色三角形按钮保存并运行 GUI。MATLAB 会将 `.fig` 文件以你指定的名称保存，并生成相应的 `.m` 文件。我们将 GUI 命名为
  `DetectionFilterGUI`。生成的初始 GUI 如图 9-6 所示。


  ![A335353_1_En_9_Fig6_HTML.jpg](img/A335353_1_En_9_Fig6_HTML.jpg)


  图 9-6. 初步修改后的 GUI 快照


  至此，你可以开始编写 GUI 代码本身了。模板 GUI 将其数据（根据用户在编辑框中输入的数据计算得出）存储在一个名为 `metricdata` 的字段中。你可以在整个
  m 文件中执行查找/替换操作，将此字段改为 `filterdata`。类似地，你可以将 `density` 替换为 `duration`，将 `volume`
  替换为 `input`。更改编辑框的 Tag 会改变回调函数的名称（例如，从 `density_Callback` 变为 `duration_Callback`），但不会改变函数体内变量的名称。查找/替换的步骤如图
  9-7 所示。


  ![A335353_1_En_9_Fig7_HTML.jpg](img/A335353_1_En_9_Fig7_HTML.jpg)


  图 9-7. 查找/替换 `metricdata` 字段名


  更新后的 `duration_Callback` 函数如下所示。你可以保留确保输入为合法数字的错误检查代码。请注意，MATLAB 提供了关于如何将图形对象内容从字符串转换为双精度浮点数，或如何将其保留为字符串的最佳方法的良好提示。`guidata`
  函数使用图形句柄将更改后的参数的新值存储在图形本身中。


  ```

  function duration_Callback(hObject, eventdata, handles)

  % hObject 指向 duration 的句柄（参见 GCBO）

  % eventdata 保留 - 将在 MATLAB 的未来版本中定义

  % handles 包含句柄和用户数据的结构体（参见 GUIDATA）

  ```




