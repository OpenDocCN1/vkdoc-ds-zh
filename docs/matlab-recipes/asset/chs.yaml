  \ H1 行。MATLAB 在为你文件夹生成 `Contents.m` 文件以及执行 `lookfor` 函数（该函数在路径中搜索文件中的关键字）时，会自动使用此总结。\n\
  \n使用节标题分别记录输入和输出。指明变量类型或大小，并提供描述。在注释符号 `%` 和该行之间使用两个空格，以便为输入和输出列表生成等宽文本。使用以下键来指明变量类型和大小：\n\
