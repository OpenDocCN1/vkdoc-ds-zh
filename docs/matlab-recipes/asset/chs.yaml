  \n要运行 GUI，可以执行 m 文件，或使用 GUIDE 图形编辑器中的“运行”按钮。带有绘图窗口的 GUI 将打开，如图 4-10 所示。\n\n![A335353_1_En_4_Fig10_HTML.jpg](img/A335353_1_En_4_Fig10_HTML.jpg)\n\
