- "# 编码手册\n\n电子补充材料：本章的在线版本 (doi: [10.1007/978-1-4842-0559-4_1](http://dx.doi.org/10.1007/978-1-4842-0559-4_1))\
  \ 包含补充材料，可供授权用户使用。\n\n本章旨在概述 MATLAB 语法和编程，重点介绍许多用户可能未充分利用的功能，并指出 MATLAB 与其他编程语言和集成开发环境\
  \ (IDE) 之间的重要区别。您还应熟悉帮助浏览器中 MathWorks 提供的非常详细的文档。MathWorks 网站的“语言基础”部分描述了输入命令、运算符和数据类型。\n\
  \n在过去的二十年里，MATLAB 从其作为线性代数包的起源已经成熟了很多。最初，所有变量都是双精度矩阵。如今，MATLAB 提供了不同的变量类型，例如整数、数据结构、面向对象编程和类以及与\
  \ Java 的集成。MATLAB 应用程序是一个完整的 IDE，具有集成的编辑器、调试器、命令历史记录和代码分析器，并提供报告功能。使用 MATLAB 多年的工程师可能会发现自己没有充分利用现在提供的全部功能。在本文中，我们希望能重点介绍更有用的新功能。\n\
  \n本章的第一部分概述了最常用的 MATLAB 类型和构造。然后，我们将提供一些使用这些构造的实践方案，向您展示现代 MATLAB 的一些实际应用。\n\n####\
  \ MATLAB 语言入门\n\n##### MATLAB 简介\n\nMATLAB 既是一个应用程序，也是一种编程语言。它主要针对数值计算而开发，在学术界和工业界得到广泛应用。MATLAB\
  \ 最初由一位大学教授在 20 世纪 70 年代开发，旨在提供对线性代数库的便捷访问。MathWorks 成立于 1984 年，以继续开发该产品。其名称源于 MATrix\
  \ LABoratory（矩阵实验室）。如今，MATLAB 使用 LAPACK（线性代数包）库进行底层矩阵运算。有多种工具箱可用于不同的工程学科；本书侧重于基本\
  \ MATLAB 应用程序中可用的功能。\n\nMATLAB 应用程序是 MATLAB 语言的丰富开发环境。它提供了编辑器、命令终端、调试器、绘图功能、图形用户界面的创建以及最近安装第三方应用程序的功能。MATLAB\
  \ 可以与其他语言交互，包括 Fortran、C、C++、Java 和 Python。内置了代码分析器和性能分析器。广泛的在线社区提供了用于共享代码和提问的论坛。\n\
  \n以下是 MATLAB 应用程序的主要组件：\n\n*   **命令窗口** 用于输入命令和对基础工作空间中的变量进行操作的终端。MATLAB 提示符是 `>>`。\n\
  *   **命令历史记录** 先前执行过的命令的列表。\n*   **工作空间显示** 列出当前工作空间（应用程序内存）中的变量及其值。变量一旦创建就会保留在内存中，直到您显式清除它们或关闭\
  \ MATLAB。\n*   **当前文件夹** 文件浏览器，显示当前文件夹的内容并提供文件系统导航。最新版本的 MATLAB 还可以显示受配置管理文件的 SVN\
  \ 状态。\n*   **文件详细信息** 一个面板，显示在“当前文件夹”面板中选择的文件的信息。\n*   **编辑器** 用于编辑 m 文件的编辑器，具有语法着色和内置调试器。它还可以显示任何类型的文本文件，并识别其他语言（包括\
  \ Java、C/C++ 和 XML/HTML）并对其进行适当的着色。\n*   **变量编辑器** 用于工作空间变量的电子表格式图形编辑器。\n*   **GUIDE**\
  \ 图形界面开发窗口。\n*   **帮助浏览器** 可搜索的帮助文档，涵盖所有 MATLAB 产品以及您已安装的第三方产品。\n*   **性能分析器** 用于对正在运行的代码进行计时的工具。\n\
  \n这些组件可以停靠在各种配置中。主应用程序窗口或桌面的默认布局包含列出的前五个组件，如图 1-1 所示。命令窗口位于中心。左上方面板显示了一个文件浏览器，其中包含“当前文件夹”的内容。其下方是文件信息显示。右侧是工作空间显示和命令历史记录面板。基础工作空间是当前应用程序内存中的所有变量。历史记录中的命令可以双击或拖放到命令行上执行。广泛的工具栏包括用于运行代码分析器、打开代码分析器和帮助窗口的按钮，以及典型的文件和数据操作按钮。请注意工具栏上方的\
  \ PLOTS 和 APPS 选项卡。PLOTS 选项卡允许从工作空间浏览器中选择的数据以图形方式创建和管理绘图。APPS 选项卡允许您访问和管理您安装的第三方应用程序。\n\
  \n![A335353_1_En_1_Fig1_HTML.jpg](img/A335353_1_En_1_Fig1_HTML.jpg)\n\n图 1-1. 带有命令窗口的\
  \ MATLAB 桌面\n\n带有默认语法着色的编辑器如图 1-2 所示（您可以看到本章的一个文件）。水平线显示了使用双百分号将代码划分为“单元”，这可用于代码的顺序执行以及在发布时创建文本部分。单元标题在编辑器中以粗体显示。MATLAB\
  \ 关键字以蓝色高亮显示，注释以绿色高亮显示，字符串以粉红色高亮显示。工具栏包括用于注释代码、缩进以及运行或调试代码的按钮。转到弹出菜单允许访问大型文件中的子函数。请注意带有附加功能的\
  \ PUBLISH 和 VIEW 选项卡（涉及发布，将在下一章介绍）以及编辑器视图的选项。\n\n![A335353_1_En_1_Fig2_HTML.jpg](img/A335353_1_En_1_Fig2_HTML.jpg)\n\
  \n图 1-2. MATLAB 文件编辑器\n\n帮助浏览器如图 1-3 所示。MATLAB 提供广泛的帮助，包括示例以及指向在线视频和教程的链接。第三方工具箱也可以在此浏览器中安装帮助。与任何浏览器一样，您可以打开多个选项卡；有一个搜索工具；并且您可以标记收藏的主题。本书通篇都会提及帮助浏览器中可用的主题。\n\
  \n![A335353_1_En_1_Fig3_HTML.jpg](img/A335353_1_En_1_Fig3_HTML.jpg)\n\n图 1-3. MATLAB\
  \ 帮助窗口\n\n### 一切都是矩阵\n\n默认情况下，MATLAB 中的所有变量都是双精度矩阵。您无需为这些变量声明类型。矩阵可以是多维的，并使用基于 1\
  \ 的索引通过圆括号进行访问。您可以使用单个索引（按列获取）或每个维度一个索引来寻址矩阵的元素。要创建矩阵变量，只需为其赋值，就像这样创建一个 2 × 2 矩阵\
  \ `a`：\n\n```matlab\n>> a = [1 2; 3 4];\n>> a(1,1)\n1\n>> a(3)\n2\n```\n\n您可以使用无需特殊语法即可对矩阵进行加、减、乘、除。矩阵必须具有适合所请求的线性代数运算的大小。转置使用单引号后缀\
  \ `'` 表示，矩阵幂使用运算符 `^`。\n\n```matlab\n>> b = a'*a;\n>> c = a²;\n>> d = b + c;\n```\n\
  \n默认情况下，每个变量都是数值变量。您可以使用 `zeros`、`ones`、`eye` 或 `rand` 函数将矩阵初始化为给定大小，这些函数分别生成全零矩阵、全一矩阵、单位矩阵（对角线元素为\
  \ 1）和随机数矩阵。使用 `isnumeric` 来识别数值变量。表 1-1 显示了一些关键的矩阵函数。\n\n表 1-1. 矩阵的关键函数\n\n| 函数\
  \ | 目的 |\n| --- | --- |\n| `zeros` | 将矩阵初始化为零 |\n| `ones` | 将矩阵初始化为全一 |\n| `eye`\
  \ | 初始化一个单位矩阵 |\n| `rand`, `randn` | 初始化一个随机数矩阵 |\n| `isnumeric` | 识别矩阵或标量数值 |\n\
  | `isscalar` | 识别标量值（一个 1 × 1 矩阵） |\n| `size` | 返回矩阵的大小 |\n\n### 字符串很简单\n\n字符串和字符变量使用单引号定义。可以使用与矩阵相同的语法（即方括号）进行连接。它们的索引方式与矩阵相同。以下是一个字符串操作的简短示例：\n\
  \n```matlab\n>> s = 'Hello World' ;\n>> msg = [s 'more string'];\n>> hello = msg(1:5)\n\
  hello =\nHello\n```\n\n使用 `ischar` 来识别字符串变量。另请注意，`isempty` 对空字符串返回 true；即 `''`。\n\
  \n有关字符串语法的描述，请在 MATLAB 命令行输入 `help strings`，要获取字符串函数的完整列表，请输入 `help strfun`。表 1-2\
  \ 显示了一些关键的字符串函数。\n\n表 1-2. 字符串的关键函数\n\n| 函数 | 目的 |\n| --- | --- |\n| `ischar` |\
  \ 识别一个字符串 |\n| `char` | 将整数代码或元胞数组转换为字符串 |\n| `sprintf` | 将格式化数据写入字符串 |\n| `strcmp`,\
  \ `strncmp` | 比较字符串 |\n| `strfind` | 在一个字符串中查找另一个字符串 |\n| `num2str`, `mat2str` |\
  \ 将数字或矩阵转换为字符串 |\n| `lower` | 将字符串转换为小写 |\n\n##### 使用严格的数据结构\n\nMATLAB 中的数据结构非常灵活，由用户自行在字段和类型上强制执行一致性。您无需在分配字段之前初始化数据结构，但这样做是个好主意，尤其是在脚本中，以避免变量冲突。\n\
  \n替换\n\n```matlab\nd.fieldName = 0;\n```\n\n为\n\n```matlab\nd = struct;\nd.fieldName\
  \ = 0;\n```\n\n事实上，我们发现，通常最好创建一个特殊的函数来初始化在一组函数中使用的大型结构。这类似于创建类定义。从函数生成数据结构，而不是在脚本中键入字段，意味着您总是从正确的字段开始。拥有一个初始化函数还允许您指定变量的类型并提供示例或默认数据。请记住，由于\
  \ MATLAB 不要求您声明变量类型，因此使用默认数据自行声明会使您的代码更加清晰。\n\n> **提示** 为数据结构创建初始化函数。\n\n只需分配一个额外的副本即可将数据结构转换为数组。字段必须按相同顺序排列，这也是使用函数初始化结构的另一个原因。您可以嵌套数据结构，深度不受限制。\n\
  \n```matlab\nd = MyStruct;\nd(2) = MyStruct;\n\nfunction d = MyStruct\nd = struct;\n\
  d.a = 1.0;\nd.b = 'string';\n```\n\nMATLAB 现在允许使用变量实现动态字段名；例如，`structName.(dynamicExpression)`。这比将字段名作为字符串传递的\
  \ `getfield` 提供了更好的性能。这允许各种创造性的结构编程。以上一个代码片段中的数据结构数组为例，使用动态字段名获取字段 a 的值；这些值以元胞数组形式返回。\n\
  \n```matlab\n>> field = 'a';\n>> values = {d.(field)}\nvalues =\n[1] [1]\n```\n\n\
  使用 `isstruct` 来识别结构变量，使用 `isfield` 来检查字段是否存在。请注意，对于使用 `struct` 初始化的结构，即使它没有字段，`isempty`\
  \ 也会返回 false。表 1-3 显示了一些关键的结构体函数。\n\n表 1-3. 结构体的关键函数\n\n| 函数 | 目的 |\n| --- | ---\
  \ |\n| `struct` | 初始化一个带或不带字段的结构体 |\n| `isstruct` | 识别一个结构体 |\n| `isfield` | 确定结构体中是否存在某个字段\
  \ |\n| `fieldnames` | 以元胞数组形式获取结构体的字段 |\n| `rmfield` | 从结构体中删除一个字段 |\n| `deal` |\
  \ 将结构体中的字段设置为特定值 |\n\n### 元胞数组容纳一切\n\nMATLAB 特有的一种变量类型是元胞数组。这实际上是一个列表容器，您可以在元胞数组的元素中存储任何类型的变量。元胞数组可以像矩阵一样是多维的，并且在许多情况下非常有用。\n\
  \n元胞数组用花括号 `{}` 表示。它们可以是任何维度，并包含任何数据，包括字符串、结构体和对象。您可以使用 `cell` 函数初始化它们，使用 `celldisp`\
  \ 以递归方式显示内容，并使用圆括号访问子集，就像矩阵一样。以下是一个简短示例。\n\n```matlab\n>> c = cell(3,1);\n>> c{1}\
  \ = 'string';\n>> c{2} = false;\n>> c{3} = [1 2; 3 4];\n>> b = c(1:2);\n>> celldisp(b)\n\
  b{1} =\nstring\nb{2} =\n0\n```\n\n使用花括号访问会返回底层类型的元素数据。当您使用圆括号访问元胞数组的元素时，返回的内容是另一个元胞数组，而不是元胞内容。MATLAB\
  \ 帮助中有一个专门的“逗号分隔列表”部分，重点介绍了元胞数组作为列表的用法。代码分析器也建议使用元胞数组的有效方法。例如，请看下面。\n\n替换\n\n```matlab\n\
  a = {b{:} c};\n```\n\n为\n\n```matlab\na = [b {c}];\n```\n\n元胞数组对于字符串集合特别有用，许多 MATLAB\
  \ 的字符串搜索函数（例如 `strcmp`）都针对元胞数组进行了优化。\n\n使用 `iscell` 来识别元胞数组变量。使用 `deal` 来操作结构数组和元胞数组的内容。表\
  \ 1-4 显示了一些关键的元胞数组函数。\n\n表 1-4. 元胞数组的关键函数\n\n| 函数 | 目的 |\n| --- | --- |\n| `cell`\
  \ | 初始化一个元胞数组 |\n| `cellstr` | 从字符数组创建元胞数组 |\n| `iscell` | 识别一个元胞数组 |\n| `iscellstr`\
  \ | 识别一个仅包含字符串的元胞数组 |\n| `celldisp` | 递归显示元胞数组的内容 |\n\n### 使用逻辑数组优化代码\n\n逻辑数组仅由\
  \ 1 和 0 组成。您可以使用 `true` 和 `false` 函数初始化逻辑矩阵，并且可以使用 `islogical` 函数测试矩阵是否为逻辑矩阵。逻辑数组是许多内置函数（如\
  \ `isnan`）的输出，并且代码分析器通常建议将其作为操作数组索引的更快替代方案。例如，您可能需要将数组中的任何负值设置为零。\n\n替换\n\n```matlab\n\
  k = find(x<0);\nx(k) = 0;\n```\n\n为\n\n```matlab\nx(x<0) = 0;\n```\n\n其中 `x<0` 生成一个逻辑数组，当\
  \ `x` 的值为负时，该数组的元素为 1，其他位置为 0。\n\nMATLAB 既提供传统的关系运算符（例如 `&&` 表示 AND，`||` 表示 OR），也提供独特的逐元素运算符。这些逐元素运算符（例如单个\
  \ `&` 和 `|`）会比较相同大小的矩阵并返回逻辑数组。\n\n### 使用持久和全局作用域最小化数据传递\n\n通常，在函数中定义的变量具有局部作用域，仅在该函数内可用。在脚本中定义的变量在工作空间中可用，因此也可以从命令行使用。\n\
  \nMATLAB 具有全局作用域，与其他任何语言相同，适用于基础工作空间，并在整个 MATLAB 会话期间保持变量的值。全局变量在声明后为空，直到被初始化。`clear`\
  \ 和 `clearvars` 函数都有用于仅删除全局变量的标志。\n\n```matlab\n>> global MY_GLOBAL_VAR; % variable\
  \ is empty\n>> MY_GLOBAL_VAR = 1.0;\n>> whos\n  Name               Size        \
  \ Bytes  Class      Attributes\n  MY_GLOBAL_VAR      1x1             8  double \
  \    global\n>> clearvars -GLOBAL\n```\n\n表 1-5 显示了一些用于逻辑运算的关键函数。\n\n表 1-5. 逻辑运算的关键函数\n\
  \n| 函数 | 目的 |\n| --- | --- |\n| `logical` | 将数值转换为逻辑值 |\n| `islogical` | 识别一个逻辑数组（由\
  \ 1 和 0 组成） |\n| `true` | 返回真值 (1) 或数组 (M,N) |\n| `false` | 返回假值 (0) 或数组 (M,N) |\n\
  | `any` | 如果数组中有任何非零数，则返回 true |\n| `all` | 如果数组中没有一个值为 0，则返回 true |\n| `and`, `or`\
  \ | 逐元素运算符 `&` 和 `&#124;` 的函数形式 |\n| `isnan`, `isinf`, `isfinite` | 返回逻辑数组的值测试函数\
  \ |\n\nMATLAB 有一个独特的作用域，它适用于单个函数：`persistent`（持久）。这对于初始化需要大量数据或计算的函数，然后保存该数据以供后续调用使用非常有用。可以使用\
  \ `clear` 命令对函数重置该变量，例如 `clear functionName`。这也可能是错误的来源，因此务必在函数的帮助注释中注明持久变量的使用，以免在切换模型时得到意外结果。\n\
  \n> **提示** 使用持久变量存储后续函数调用的初始化数据。\n\n如果适当使用了 `end` 关键字，则对于在单个文件中定义的多个函数，变量也可以处于作用域内。通常，您可以省略函数的最后一个\
  \ `end`，但如果您使用它来包装内部函数，则这些函数将成为嵌套函数，并且可以访问在父函数中定义的变量。这允许子例程共享数据而无需传递大量参数。编辑器会高亮显示这样定义的变量。\n\
  \n在以下示例中，`constant` 变量可用于父函数内部的嵌套函数。\n\n```matlab\nfunction y = parentFunction(\
  \ x )\n  constant = 3.0;\n  y = nestedFunction( x );\n  \n  function z = nestedFunction(\
  \ x )\n    z = constant *x;\n  end\nend\n```\n\n表 1-6 显示了一些作用域函数。\n\n表 1-6. 作用域操作的关键函数\n\
  \n| 函数 | 目的 |\n| --- | --- |\n| `persistent` | 为函数中的变量指定持久作用域 |\n| `global` | 为变量指定全局作用域\
  \ |\n| `clear` | 清除一个函数或变量 |\n| `who`, `whos` | 列出一个工作空间中的变量 |\n| `mlock`, `munlock`\
  \ | 锁定（和解锁）一个函数或 MEX 文件，以防止其被清除 |\n\n### 理解独特的 MATLAB 运算符和关键字\n\n在 MATLAB 中，一些常见的运算符具有特殊功能，我们在此提请注意。\n\
  \n#### 冒号\n\n用于在数组中创建索引列表的冒号运算符是 MATLAB 独有的。单独使用的冒号寻址该给定维度中的所有元素；在整数对之间使用的冒号创建一个列表。\n\
  \n```matlab\n>> a(1,1:2)\nans =\n1 2\n>> a(:,1)\nans =\n1\n3\n```\n\n当访问数组元素时，冒号运算符适用于所有变量类型：元胞数组、字符串和数据结构数组。\n\
  \n冒号运算符还可用于使用间隔创建数组，作为 `linspace` 的简写形式。间隔和端点可以是双精度数。将其用于矩阵索引实际上是使用默认间隔 1 的一种边界情况。例如，`0.1:0.2:0.5`\
  \ 生成 `0.1 0.3 0.5`。\n\n```matlab\n>> a = 0.1:0.2:0.5\na =\n0.1 0.3 0.5\n```\n\n\
  #### 波浪号\n\n波浪号 (`~`) 是 MATLAB 中的逻辑“非”运算符。输出是一个与输入大小相同的逻辑矩阵，如果输入值为零，则输出值为 1，否则输出值为\
  \ 0。\n\n```matlab\n>> a = [0 -1; 1 0];\n>> ~a\nans =\n1 0\n0 1\n```\n\n在较新的版本中，它还可以用于忽略函数的输入或输出；代码分析器经常建议这样做，而不是使用虚拟变量。\n\
  \n```matlab\n[~,b] = MyFunction(x,y);\n```\n\n#### 点号\n\n这里的点号是指将句点与标准算术运算符一起使用，例如\
  \ `.*` 或 `.\\` 或 `.^`。这是 MATLAB 中的特殊语法，用于对矩阵逐个元素地应用运算符，而不是执行原本暗示的线性代数运算。这也称为数组运算，而不是矩阵运算。由于矩阵和数组运算对于加法和减法来说是相同的，因此不需要点号。\n\
  \n```matlab\ny = a.*b;\n```\n\nMATLAB 针对数组运算进行了优化。使用此语法是在 MATLAB 代码中减少 `for` 循环并使其运行更快的关键方法。考虑传统的替代代码。\n\
  \n```matlab\na = rand(1,1000);\nb = rand(1,1000);\ny = zeros(1,1000);\nfor k = 1:1000\n\
  \  y(k) = a(k)*b(k);\nend\n```\n\n即使这个简单的示例，其运行时间也是所示向量化版本的两到三倍。\n\n#### `end`\n\
  \n`end` 关键字在 MATLAB 中有多种用途。它用于终止 `for`、`while`、`switch`、`try` 和 `if` 语句，而不是像其他语言那样使用花括号。它还可用于表示变量在给定维度中的最后一个索引。适当使用\
  \ `end` 可以使您的代码对将来数据大小的变化更加健壮。\n\n```matlab\n>> a = [1 2 3; 4 5 6; 7 8 9];\n>> b\
  \ = a(1:end-1,2:end)\nb =\n2 3\n5 6\n```\n\n### 利用多输入和多输出的强大功能\n\n独特的是，MATLAB 函数可以有多个输出。它们与输入一样，以逗号分隔列表的形式指定。此外，您不需要指定输入或输出的数据类型，并且可以通过将任何数据分配给变量来静默覆盖输出类型。因此，一个函数可以在单个文件中定义无限数量的语法。输出必须分配有签名中给出的名称；您不能将变量传递给\
  \ `return` 关键字。\n\nMATLAB 提供了用于指定可变数量输入或输出的辅助函数，即 `varargin` 和 `varargout`。这些变量是元胞数组，您可以使用花括号访问和分配元素。以下是一个示例函数定义：\n\
  \n```matlab\nfunction [y,varargout] = varargFunction(x,varargin)\n  y = varargin{1};\n\
  \  varargout{1} = size(x,1);\n  varargout{2} = size(x,2);\n```\n\n以下示例演示了输出被正确分配。\n\
  \n```matlab\n>> [y,a,b] = varargFunction( rand(3,2),1.0)\ny =\n1\na =\n3\nb =\n\
  2\n```\n\n这允许您在函数中接受无限数量的参数或参数对。您需要为函数创建一致的格式，并在帮助注释中清晰地记录它们。\n\n您还可以使用 `nargin`\
  \ 和 `nargout` 计算对函数特定调用的输入和输出参数数量，并将其与逻辑语句或 `switch` 语句结合使用来处理多种情况。\n\n如果您需要非常复杂的输入处理，MATLAB\
  \ 现在提供了一个 `inputParser` 类，它允许您解析和验证输入方案。您可以定义函数来验证输入、可选参数并预定义参数对。\n\n### 使用函数句柄提高效率\n\
  \n函数句柄是指向函数的指针。它们与匿名函数密切相关，匿名函数允许您内联定义一个简短的函数，并返回函数句柄。当您创建句柄时，您可以更改输入方案并为某些输入（例如参数）提供值。将句柄作为输入传递给积分器和类似例程比传递函数名字符串变量要快得多。\n\
  \n在以下代码片段中，我们为 `myFunction` 创建了一个匿名函数句柄，具有不同的签名和 `a` 的特定值。请注意与号的使用，它表示一个函数句柄。该句柄可以像常规函数一样使用输入进行评估。\n\
  \n```matlab\nfunction y = myFunction(a, b, c)\n  ...\nend\n\na = 2;\nh = @(c,b)\
  \ myFunction(a,b,c);\ny = h(c,b);\n```\n\n句柄 `h` 可以传递给一个函数，例如一个期望只具有两个变量的签名的积分器。您还会经常使用函数句柄来为积分器或类似工具指定事件函数，以及在主要步骤之间调用的输出函数。输出函数可以将信息打印到屏幕或图形上；例如，`odeplot`\
  \ 和 `odeprint`。\n\n为了测试一个变量是否是函数句柄，您需要使用 `isa` 和函数句柄的类名，例如：\n\n```matlab\nisa(f,'function_handle')\n\
  ```\n\n`ishandle` 仅适用于图形句柄。有关更多信息，请参阅 `function_handle` 的帮助文档。表 1-7 提供了处理函数句柄的几个关键函数。\n\
  \n表 1-7. 句柄的关键函数\n\n| 函数 | 目的 |\n| --- | --- |\n| `feval` | 从句柄或字符串执行函数 |\n| `func2str`\
  \ | 从函数句柄构造字符串 |\n| `str2func` | 从函数名字符串构造句柄 |\n| `isa` | 测试是否为函数句柄 |\n\n##### 高级数据类型\n\
  \n到目前为止讨论的数据类型对于大多数工程编程来说已经足够。然而，对于专门的应用程序，还有额外的数据类型选项，包括以下内容。\n\n*   **类** 可以使用\
  \ `classdef` 关键字在 m 文件中定义具有属性和方法的类，类似于编写函数。另请参阅 `properties`、`methods` 和 `events`\
  \ 关键字。\n*   **表格** 表格是 MATLAB R2013 版本中的新功能，允许将表格数据及其元数据存储在一个变量中。这是一种存储和处理可能放在电子表格中的数据并与之交互的有效方法。表格列可以命名、分配单位和描述，并且可以像数据结构的字段一样访问，例如\
  \ `T.DataName`。有关从文件创建表格，请参阅函数 `readtable`。\n*   **分类数组** 来自离散类别集（枚举）的数据数组可以存储在这种特殊类型中，与元胞数组的元素相比，它提供了更高效的搜索。请参阅\
  \ `categorical` 和 `categories`。\n*   **时间序列** `timeseries` 对象及其相关的 `tscollection`\
  \ 对象提供了将数据样本与时间戳相关联的方法。绘制 `timeseries` 对象会自动使用存储的时间向量。\n*   **映射容器** 映射容器允许您使用可能非数值的键来存储和查找数据。这是一个通过\
  \ `containers.Map` 实例化的对象。\n\n如果您发现这些数据类型对您的应用程序有利，那么 MATLAB 文档是相当详尽的。\n\n## 入门实践方案\n\
  \n本章的下一部分提供了一些现代 MATLAB 中常见任务的实践方案，例如向函数添加帮助、加载二进制数据、写入文本文件、创建 MEX 文件以及将函数解析为“pcode”。\n\
  \n\n\n"
- '# 1.1 创建函数帮助


  ## 问题描述

  你需要为函数编写文档，以便他人能够使用它们，也方便你日后回忆其工作原理。


  ## 解决方案

  将文档放置在正确的位置后，MATLAB 提供了一种机制，让你能够通过 `help` 命令在命令行中访问函数或脚本的相关文档。


  ## 实现原理

  你在函数文件顶部添加的注释（称为**头部注释**）会成为函数的帮助文本。在命令行中输入 `help MyFunction` 即可显示该帮助文本。虽然注释的风格和格式将在下一章讨论，但此处需要你关注其功能。


  帮助注释可以放在函数声明行的上方或下方。如果在注释中包含“see also”字样，后跟其他函数的名称，MATLAB 会自动为这些函数提供帮助链接。所有注释内容会一直打印到遇到第一个空行为止。


  以下是一个计算点积的函数的帮助示例。第一行应为函数的单句描述，供 `lookfor` 命令使用。如果在注释中以全大写形式插入函数名，MATLAB 在打印帮助时会自动将其转换为正确的大小写形式。你的注释可能如下所示：


  ```

  function d = Dot( w, y )


  %% DOT 两个数组的点积。


  %% 形式


  % d = Dot( w, y )


  % d = Dot( w )


  %


  %% 描述


  % 支持数组的点积。w 和 y 的列数可以是：


  %


  % * 两者均大于 1 且相等


  % * 其中一个只有一列，另一个有任意列数


  %


  % 如果只有一个输入，则计算该输入与自身的点积。


  %


  %% 另请参阅


  % Cross

  ```


  当打印到命令行时，MATLAB 会移除百分号，仅显示文本内容，如下所示：


  ```

  >> help Dot


  Dot 两个数组的点积。


  % 形式


  d = Dot( w, y )


  d = Dot( w )


  % 描述


  支持数组的点积。w 和 y 的列数可以是：


  * 两者均大于 1 且相等

  * 其中一个只有一列，另一个有任意列数


  如果只有一个输入，则计算该输入与自身的点积。


  % 另请参阅


  Cross

  ```


  你还可以链接到文件中子函数附带的额外帮助文档。这对于提供更详细的示例或算法描述非常有用。为此，你需要在帮助注释中嵌入一个 HTML 链接。例如：


  ```

  % 更详细的帮助请参阅<a href="matlab: help foo>extended_help">扩展帮助</a>。


  function extended_help


  %EXTENDED_HELP 额外的技术细节和示例


  %


  % 描述算法的额外细节或提供示例。


  error (''此函数仅为帮助文本而设的占位函数'');

  ```


  这种格式在命令窗口中的显示效果为：


  更详细的信息请参阅扩展帮助。


  MATLAB 还允许你为函数创建 HTML 帮助，使其显示在帮助浏览器中。这需要创建 XML 文件来提供目录层次结构。请参阅 MATLAB 帮助主题“显示自定义文档”以及下一章的相关方法。


  你还可以运行帮助报告，以识别缺少帮助或缺少某些帮助部分（如版权声明）的函数。要了解如何在你的操作系统上启动此报告，请参阅 MathWorks 的帮助主题“检查哪些程序具有帮助”。


  '
- '# 1.2 定位数据存储的目录


  ## 问题描述

  工具箱中的各种演示和函数会生成数据文件，这些文件最终会散落在整个文件系统中。你不能在计算机上使用绝对路径，因为代码需要在多位工程师之间共享。


  ## 解决方案

  使用 `mfilename` 将文件保存在生成文件的同一位置，或者定位一个相对于文件位置的专用数据目录。


  ## 实现原理

  在脚本中随意使用 `save` 命令，或者将图形输出为图像文件，很容易导致文件散落在整个文件系统中。MATLAB 提供了一个便捷的函数 `mfilename`，它可以返回当前执行的
  m 文件所在文件夹的路径。你可以利用该函数定位专门用于例程输入或输出文件的数据文件夹。这需要使用 MATLAB 的 `fileparts` 和 `fullfile`
  函数。


  例如，将输出的 mat 文件保存到函数或脚本所在的同一位置：


  ```

  thisPath = mfilename(''fullpath'');


  thisDir = fileparts(thisPath);


  save ( fullfile(thisDir,''fileName''),x,y);

  ```


  要将输出保存到专用目录，只需额外调用一次 `fileparts` 即可。在本例中，该目录名为 `DataDir`。


  ```

  thisPath = mfilename(''fullpath'');


  prevDir = fileparts(fileparts(thisPath));


  dataDir = fullfile(prevDir,''DataDir'',''fileName'');


  save ( fullfile(dataDir,''fileName''),x,y);

  ```


  如果你正在输出图像，可以像使用 `save` 那样使用 `print` 的函数形式，或者更改路径到目标目录。你应该保存当前目录，并在脚本完成后返回该目录。


  ```

  thisPath = mfilename(''fullpath'');


  cd0 = cd;


  cd ( fileparts(thisPath));


  print -dpng MyFigure


  cd (cd0)

  ```


  表 1-8 显示了路径操作的关键函数。


  **表 1-8.** 路径操作的关键函数


  | 函数 | 目的 |

  | --- | --- |

  | `mfilename` | 返回当前执行的 m 文件的名称，并可选择返回其完整路径 |

  | `fileparts` | 将路径分割成几个部分（目录、文件名、扩展名） |

  | `fullfile` | 根据各部分构建系统相关的文件名 |

  | `cd` | 获取或更改当前目录 |

  | `path` | 获取或设置当前 MATLAB 路径 |


  '
- "# 1.3 从文件加载二进制数据\n\n## 问题描述\n你需要将数据存储到二进制文件中，例如用于输入到其他软件程序。\n\n## 解决方案\nMATLAB\
  \ 提供了用于创建和写入二进制文件的底层工具，包括指定字节序的功能。\n\n\n\n```markdown\n### 工作原理\n\n读取和写入二进制数据会引入一些文本文件所没有的复杂性。我们以\
  \ MATLAB 中创建幻方二进制文件的示例开始。这演示了 `fopen`、`fwrite` 和 `fread` 的使用。`fread` 的帮助文档中指定了精度选项。例如，32\
  \ 位整数可以用 MATLAB 风格的字符串 `'int32'` 或 C 风格的字符串 `'integer*4'` 来指定。\n\n```\n>> magic(4)\n\
  \nans =\n\n16 2 3 13\n5 11 10 8\n9 7 6 12\n4 14 15 1\n\n>> fid = fopen('magic4.bin','wb');\n\
  \n>> fwrite(fid,magic(4),'integer*4');\n\n>> fclose(fid);\n```\n\n现在，让我们尝试读回这个数据文件。由于数据是以\
  \ 32 位整数存储的，你必须指定相同的精度才能正确读取数据。\n\n```\n>> fid = fopen('magic4.bin','rb');\n\n>>\
  \ c = fread(fid,inf,'integer*4')\n\nc =\n\n16\n5\n9\n4\n2\n11\n7\n14\n3\n10\n6\n\
  15\n13\n8\n12\n1\n```\n\n矩阵的形状并未被保留，但你可以看到数据是按列顺序写入文件的。要完整恢复数据，你需要对矩阵进行重塑。\n\n```\n\
  >> data = reshape(c,5,5)\n\ndata =\n\n16 2 3 13\n5 11 10 8\n9 7 6 12\n4 14 15 1\n\
  ```\n\n如果你需要指定数据的字节序，可以在 `fopen` 和 `fread` 中进行设置。默认使用本地机器的格式，但你可以指定采用小端字节序的 IEEE\
  \ 浮点数、采用大端字节序的相同格式，以及采用 64 位长数据类型的格式。如果你使用来自在线来源的二进制数据或在嵌入式处理器上使用数据，这一点可能很重要。\n\n\
  例如，要以大端格式写入相同的数据，只需添加 `'ieee-be'` 参数。\n\n```\n>> fid = fopen('magic5.bin','wb','ieee-be');\n\
  \n>> fwrite(fid,magic(5),'integer*4');\n\n>> fclose(fid);\n```\n\n表 1-9 列出了与二进制数据交互的关键函数。\n\
  \n**表 1-9.** 二进制数据的关键函数\n\n| 函数 | 用途 |\n| --- | --- |\n| `fopen` | 以文本或二进制模式打开文件\
  \ |\n| `fwrite` | 写入文件 |\n| `fread` | 读取文件内容 |\n| `fclose` | 关闭文件 |\n\n## 1.4 命令行文件交互\n\
  \n### 问题\n\n当尝试运行 MATLAB 脚本时，你遇到了意外行为，怀疑不同工具箱之间存在函数冲突。\n\n### 解决方案\n\nMATLAB 提供了用于从命令行定位和管理文件及路径的函数。\n\
  \n### 工作原理\n\nMATLAB 的命令窗口内建了文件浏览器，但熟悉从命令行定位和管理文件的命令仍然很有帮助。特别是，如果你的路径中有很多工具箱和文件，你可能需要识别名称冲突。\n\
  \n例如，如果你从一个函数中得到错误行为或奇怪错误，并且你最近更改了路径，那么可能有一个文件在你的路径中掩盖了它。要检查函数名称的重复副本，请使用带有 `-all`\
  \ 选项的 `which` 命令。被掩盖的函数版本会被标记。`which` 可以接受部分路径名。\n\n```\n>> which DemoPSS –all\n\
  \n/Users/.../Toolboxes/Missions/Demos/DemoPSS.m\n/Users/.../Toolboxes/Math/Demos/DemoPSS.m\
  \ % 被掩盖\n/Users/.../Toolboxes/Imaging/Demos/DemoPSS.m % 被掩盖\n/Users/.../Toolboxes/Common/Demos/DemoPSS.m\
  \ % 被掩盖\n```\n\n要在命令行显示文件的内容（当你需要查看文件中的内容但不需要打开文件进行编辑时，这会很有帮助），可以使用 `type` 命令，类似于\
  \ Unix 系统。\n\n要列出目录的内容，请使用 `what`。如果路径中有多个同名的目录，可以使用部分路径。指定输出参数会以数据结构数组的形式返回结果。MATLAB\
  \ 会识别哪些文件是代码文件、MAT 文件、P 文件等。`what` 是递归的，会返回路径中任意位置所有具有给定名称的目录——当你为函数和演示程序使用相同的目录名称时非常有用，如下所示。\n\
  \n```\n>> what Database\n\n在文件夹中的 MATLAB 代码文件 /Users/Shared/svn/Toolboxes/SourceCode/Core/Common/Demos/\n\
  Database\nContents TConstant\n\n在文件夹中的 MATLAB 代码文件 /Users/Shared/svn/Toolboxes/SourceCode/Core/Common/\n\
  Database\nBuildConstant Contents MergeConstantDB\nConstant Database\n```\n\n使用 `exist`\
  \ 来判断路径或工作区中是否存在某个函数或变量。代码分析器会提示你使用带有第二个参数的语法来指定所需类型，例如 `'var'`、`'file'` 或 `'dir'`。输出是一个数值代码，表示找到的文件或变量类型。\n\
  \n使用 `edit` 从命令行在编辑器中打开文件。\n\n使用 `load` 加载 MAT 文件或 ASCII 文件。指定输出参数可将数据存储在变量中，否则数据将直接加载到工作区。对于\
  \ MAT 文件，你还可以指定要加载的特定变量。\n\n```\nd = load('MyMatFile','var1','var2');\n```\n\n最后介绍的命令行函数是\
  \ `lookfor`。此函数在 MATLAB 路径上的所有帮助文档中搜索关键词。关键词必须出现在帮助文档的第一行，例如单行帮助注释或 H1 行。打印结果看起来像一个内容文件，并包含指向找到函数的帮助文档的链接。以下是关于关键词\
  \ `integration` 的示例。\n\n```\n>> lookfor integration\n\nIntegrationAccuracyDemo -\
  \ Integration Accuracy for PropagateOrbitPlugin.\nPropagatorComparison - Integration\
  \ accuracy study comparing RK4, RK45, and ode113.\nlotkademo - Numerical Integration\
  \ of Differential Equations\ncumtrapz - Cumulative trapezoidal numerical integration.\n\
  trapz - Trapezoidal numerical integration.\n```\n\n表 1-10 列出了在命令行使用的关键函数。\n\n**表\
  \ 1-10.** 命令行交互的关键函数\n\n| 函数 | 用途 |\n| --- | --- |\n| `which` | 函数在路径中的位置 |\n| `what`\
  \ | 列出目录中 MATLAB 特定的文件 |\n| `type` | 显示文件的内容 |\n| `dbtype` | 显示文件内容并附带行号 |\n| `exist`\
  \ | 判断函数或变量是否存在 |\n| `edit` | 在编辑器中打开文件 |\n| `load` | 将 MAT 文件加载到工作区 |\n| `lookfor`\
  \ | 在路径中的帮助注释中搜索关键词 |\n\n## 1.5 使用 MEX 文件链接到外部库\n\n### 问题\n\n有一个外部 C++ 库需要用于某个应用。你希望在\
  \ MATLAB 中进行分析。\n\n### 解决方案\n\n你可以使用 C/C++ 矩阵 API 在 MATLAB 中编写并编译一个特殊函数，该函数允许你通过\
  \ MATLAB 函数调用外部库函数。这称为 MEX 文件。\n```\n\n\n### 工作原理\n\n一个`mex`函数实际上是一个从 C/C++或 Fortran\
  \ 源代码编译而来的共享库，并且可以从 MATLAB 中调用。它可用于链接到外部库，如`GLPK`、`BLAS`和`LAPACK`。在编写`mex`函数时，你需要在代码中提供一个网关例程`mexFunction`，并使用\
  \ MATLAB 的 C/C++矩阵库 API。你的机器上必须安装有 MATLAB 支持的编译器。\n\n```\n#include \"mex.h\"\n```\n\
  \n```\nvoid mexFunction( int nlhs, mxArray *plhs[], int nrhs, const mxArray *prhs[])\n\
  ```\n\n你可以看到，与常规的 MATLAB 函数一样，你可以提供多个输入和多个输出。`mxArray`是一种 C 语言类型，实际上是 MATLAB 中所有矩阵的基本数据类型，由\
  \ MATLAB API 提供。\n\n你使用`mex`函数将你的 C、C++或 Fortran 函数编译成二进制文件。传递详细标志`-v`会提供 C 程序员熟悉的详细输出。根据你的系统由`mexext`确定的扩展名（例如`'mexmaci64'`）会被追加，然后你就可以像调用任何其他\
  \ m 文件一样从 MATLAB 调用该函数。例如，在 Mac 上，当编译内置示例之一`yprime.c`时，MATLAB 会自动检测并使用 Xcode。该函数用于解决简单的三体轨道问题。首先，你需要将示例复制到本地工作目录。\n\
  \n```\n>> copyfile(fullfile(matlabroot,'extern','examples','mex','yprime.c'),'.','f');\n\
  ```\n\n以下是详细编译过程的摘录。\n\n```\n>> mex -v -compatibleArrayDims yprime.c\nVerbose mode\
  \ is on.\nNo MEX options file identified; looking for an implicit selection.\n...\
  \ Looking for compiler 'Xcode with Clang' ...\n... Looking for environment variable\
  \ 'DEVELOPER_DIR' ...No.\n... Executing command 'xcode-select -print-path' ...Yes\
  \ ('/Applications/Xcode.app/\nContents/Developer').\n... Looking for folder '/Applications/Xcode.app/Contents/Developer'\
  \ ...Yes.\n... Executing command 'which xcrun' ...Yes ('/usr/bin/xcrun').\n... Looking\
