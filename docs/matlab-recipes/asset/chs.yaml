  \ | Park 变换矩阵。 |\n| `PMMachineDemo` | 永磁电机演示。 |\n| `RHSPMMachine` | 永磁无刷三相电机的右侧函数。\
  \ |\n| `SVPWM` | 实现空间矢量脉宽调制。 |\n| `SwitchToVoltage` | 将开关状态转换为电压。 |\n| `TorqueControl`\
  \ | 比例积分扭矩控制器。 |\n\n**脚注**\n1 Lyshevski, S. E. *Electromechanical Systems, Electric\
