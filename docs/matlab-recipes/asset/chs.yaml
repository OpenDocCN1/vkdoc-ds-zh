  \ 步设置 | 20.218774 秒 |\n\n## 4.2 播放动画\n\n### 问题\n\n你想要存储并播放一段动画。\n\n### 解决方案\n\n\
  使用 `VideoWriter` 类将动画的每一帧保存到一个 AVI 文件中。\n\n### 工作原理\n\n在下面的代码清单中，你使用 `VideoWriter`\
  \ 保存动画并将其读入一个 AVI 文件。这行代码打开一个 AVI 文件：\n\n```\nvObj = VideoWriter('RotatingBox.avi');\n\
  ```\n\n该脚本名为 `PatchAnimationStorage.m`。创建盒子和图形的部分未显示，因为它们与上一个示例相同。在这个例子中，你仅使用 100\
  \ 个点来完成四次旋转；在暂停关闭的情况下，执行时间（包括保存影片）约为 4 秒。在分析器（Profiler）中运行此脚本显示，近 90% 的执行时间花费在 `writeVideo`\
  \ 命令上。\n\n```\n%% 使用补片（patch）制作立方体动画并存储为 AVI 文件\n\n% 图形和盒子的创建方式与 PatchAnimation\
  \ 相同。这次我们使用\n% VideoWriter 将帧存储到影片中。\n\n%% 动画\n\nn = 100;\na = linspace(0,8*pi,n);\n\
  c = cos(a);\ns = sin(a);\n\n% 创建视频文件\nvObj = VideoWriter('RotatingBox.avi');\nopen(vObj);\n\
  tic\nfor k = 1:n\n    pause(0.01);\n    b = [c(k) 0 s(k);0 1 0;-s(k) 0 c(k)];\n\
  \    vK = (b*v')';\n    set(p,'vertices',vK);\n    writeVideo(vObj, getframe(h));\n\
  end\ntoc\nclose(h)\nclose(vObj)\n```\n\n然后你可以在任何视频播放器中播放动画，如图 4-3 所示。\n\n![A335353_1_En_4_Fig3_HTML.jpg](img/A335353_1_En_4_Fig3_HTML.jpg)\n\
  \n图 4-3. 在视频播放器中回放的影片文件\n\n## 4.3 线条对象动画\n\n### 问题\n\n你希望在循环中更新一个包含线条对象的绘图。\n\n\
  ### 解决方案\n\n这与示例 4-1 类似，但你需要更新图形对象的不同属性。你将使用第 3 章的四边形图，并添加一个沿轨迹移动的标记动画。这还将演示如何使用\
  \ `uimenu` 向图形添加菜单。\n\n\n\n### 工作原理\n\n从 `QuadPlot.m` 函数开始。该函数创建四个子图以查看轨迹：一个三维视图和三个来自不同方向的二维视图（参见图\
  \ 4-4）。要添加一个可制作动画的标记，你需要执行以下几步：\n\n![A335353_1_En_4_Fig4_HTML.jpg](img/A335353_1_En_4_Fig4_HTML.jpg)\n\
  \n图 4-4. 四象限图动画的一帧\n\n1. 添加时间输入。\n2. 在每个子图中添加标记并保存句柄。\n3. 添加一个文本 `uicontrol` 控件，用于在动画进行时显示当前时间。\n\
  4. 将轨迹数据和句柄存储在图形对象的 `UserData` 中。\n5. 关闭常规图形菜单，并添加一个包含 `Start` 函数的动画菜单。\n\n你使用一个\
  \ `nargin` 检查来判断是通过 `t` 和 `x` 数据创建图形，还是通过输入 `'update'` 进入回调函数。另一种替代方案是将回调函数放在一个单独的函数中；执行回调的图形可以通过\
  \ `Tag` 属性或此处使用的 `gcbf` 来识别。\n\n```\n%% QUADANIMATOR Create a quad plot page with\
  \ animation.\n% This creates a 3D view and three 2D views of a trajectory in one\
  \ figure. A\n% menu is provided to animate the trajectory over time.\n\n%% Form\n\
  % QuadAnimator( t, x )\n\n%% Input\n% t (1,:) Time data\n% x (3,:) Trajectory data\n\
  %\n%% Output\n% None.\n\nfunction QuadAnimator(t,x)\n\nif nargin == 0\n   disp('Demo\
  \ of QuadAnimator');\n   t = linspace(0,4*pi,101);\n   th = logspace(0,log10(4*pi),101);\n\
  \   in = logspace(-1,0,101);\n   x = [sin(th).*cos(in); cos(th).*cos(in); sin(in)];\n\
  \   QuadAnimator(t,x);\n   return;\nend\n\nif nargin == 2\n   h = figure('Name','QuadAnimator');\n\
  \   set(h,'InvertHardcopy','off','menubar','none')\n   ma = uimenu(h,'Label','Animate');\n\
  \   ms = uimenu(ma,'Label','Start','Callback','QuadAnimator(''update'')');\n   m\
  \ = Plot(x);\n   p = get(h,'position');\n   ut = uicontrol('Style','text','String','Time:\
  \ 0.0 s',...\n                  'Position',[0 0 p(3) 20]);\n   d.t = t;\n   d.x\
  \ = x;\n   d.m = m;\n   d.ut = ut;\n   set(h,'UserData',d);\nelse\n   h = gcbf;\n\
  \   d = get(h,'UserData');\n   Animate(d);\nend\n\nfunction m = Plot(x)\n% Use subplot\
  \ to create four plots of a trajectory\nsubplot(2,2,3)\nplot3(x(1,:),x(2,:),x(3,:));\n\
  hold on\nm(3) = plot3(x(1,1),x(2,1),x(3,1),'o');\nhold off\nxlabel('X')\nylabel('Y')\n\
  zlabel('Z')\ngrid on\ntitle('Trajectory')\n\nsubplot(2,2,1)\nplot(x(1,:),x(2,:));\n\
  hold on\nm(1) = plot(x(1,1),x(2,1),'o');\nhold off\nxlabel('X')\nylabel('Y')\ngrid\
  \ on\ntitle('Along Z')\n\nsubplot(2,2,2)\nplot(x(2,:),x(3,:));\nhold on\nm(2) =\
  \ plot(x(2,1),x(3,1),'o');\nhold off\nxlabel('Y')\nylabel('Z')\ngrid on\ntitle('Along\
  \ X')\n\nsubplot(2,2,4)\nplot(x(1,:),x(3,:));\nhold on\nm(4) = plot(x(1,1),x(3,1),'o');\n\
  hold off\nxlabel('X')\nylabel('Z')\ngrid on\ntitle('Along Y')\n\nfunction Animate(\
  \ d )\n% Animate the markers on the subplots over time\nfor k = 1:length(d.t)\n\
  \   x = d.x(:,k);\n   set(d.m(3),'XData',x(1),'YData',x(2),'ZData',x(3));\n   set(d.m(1),'XData',x(1),'YData',x(2));\n\
  \   set(d.m(2),'XData',x(2),'YData',x(3));\n   set(d.m(4),'XData',x(1),'YData',x(3));\n\
  \   set(d.ut,'string',sprintf('Time: %f s',d.t(k)));\n   drawnow;\nend\n```\n\n\
  可以看到，两个子函数分别实现了绘图和动画功能。动画部分设置当前时间下标记的 `XData`、`YData` 和 `ZData`，并更新文本控件。我们使用了 `drawnow`\
  \ 来刷新事件队列。该动画在不使用 `pause` 命令的情况下以良好的速度运行，但你的计算机上可能有所不同，请做好实验的准备！\n\n## 4.4 uicontrol\
  \ 按钮的实现\n\n### 问题\n\n你想在对话框中使用一个按钮来在脚本运行时停止它。\n\n### 解决方案\n\n使用 `uicontrol` 和 `figure`\
  \ 创建一个带有控件的弹出窗口，如图 4-5 所示。\n\n![A335353_1_En_4_Fig5_HTML.jpg](img/A335353_1_En_4_Fig5_HTML.jpg)\n\
  \n图 4-5. UIControlDemo 窗口\n\n\n\n### 工作原理\n\n使用脚本`UIControlDemo.m`中的两个`uicontrol`调用。第一个在窗口中放置一个文本框。第二个在窗口中放置一个按钮。您不必为按钮指定样式，因为这是默认样式，但为了清晰起见，您可以指定它。按钮控件有一个回调。回调可以是任何\
  \ MATLAB 代码或函数句柄。在这种情况下，只需将全局`stop`设为`true`以停止循环。请注意，为了清晰起见，我们使用`true`和`false`作为全局布尔值，尽管`1`和`0`也可以工作。\n\
  \n```\n%% Demonstrate the use of a uicontrol button with a callback\n\n% Create\
  \ a window with a button that interacts with a global variable in the script.\n\n\
  %% Build the GUI\n\n% This is a global to communicate the button push from the GUI\n\
  global stop;\nstop = false;\n\n% Build the GUI\nset (0,'units','pixels')\np = get\
  \ (0,'screensize');\nbottom = p(4) - 190;\nfig = figure ('name','UIControlDemo','position',[340\
  \ bottom 298 90],...\n    'NumberTitle','off','menubar','none',...\n    'resize','off');\n\
  \n% The display text\nspeed = uicontrol ( 'Parent', fig, 'position', [ 20 40 280\
  \ 15],...\n    'style', 'text','string','Waiting to start.');\n\n% This has a callback\
  \ setting stop to 1\nstep = uicontrol ( 'parent', fig, 'position',[ 40 40 40 20],...\n\
  \    'string','Stop', 'callback','stop = true;');\n\n%% Run the GUI\nfor k = 1:1000\n\
  \    pause (0.01)\n    set ( speed, 'String', k );\n    if ( stop )\n        break\
  \ ; %#ok<UNRCH>\n    end\n    %drawnow % alternative to pause\nend\n```\n\n位置`input`定义为`[left\
  \ bottom width height]`。获取计算机屏幕尺寸的目的是通过将底部位置参数设置为屏幕尺寸减去图形尺寸（90 像素高）再加上 100 像素边距，即`p(4)\
  \ − 190`，将窗口放置在屏幕顶部附近。\n\nMATLAB 的代码分析器在包含`break`的行上放置一个警报，提示当`stop`为`false`时该行不可达。事实确实如此，但您有`uicontrol`来更改该参数。MATLAB\
  \ 无法确定这一点，因此您可以添加`%#ok<UNRCH>`注释来抑制该警告。如果您右键单击带有警告的行并在弹出菜单中选择“抑制此语句...”，此注释可以由 MATLAB\
  \ 自动添加（即自动修复）。\n\n**提示**：抑制仅在您的布尔逻辑更改后才可到达的代码行上的警告。\n\n让我们检查执行时间。使用`tic`和`toc`运行脚本两次，第二次关闭`pause`。\n\
  \n```\n>> tic; UIControlDemo; toc\nElapsed time is 11.601678 seconds.\n>> pause\
  \ off\n>> tic; UIControlDemo; toc\nElapsed time is 0.147663 seconds.\n```\n\n如果您希望动画持续超过或少于\
  \ 11 秒，可以调整`pause`时间。您可以看到，即使更新了 1000 次，仅图形循环本身也只占用了一小部分秒！这是因为关闭`pause`后，图形不会在循环的每一步强制更新。MATLAB\
  \ 仅在脚本结束时刷新图形，除非您有刷新系统队列的命令，例如`pause`、`drawnow`或`getframe`。如果您不想或不需要`pause`，请使用`drawnow`来强制在循环的每一步进行图形更新。表\
  \ 4-2 显示了在`pause`开启或关闭以及使用`drawnow`时的执行时间。这些是单次在参考 MacBook 上运行的时间，并非平均值；预计运行时间可能会有高达\
  \ 10%的差异。\n\n**表 4-2.** `PatchAnimation`的执行时间\n\n| `pause off` | 0.147663 秒 |\n\
  | `pause on` (0.01 秒) | 11.601678 秒 |\n| `drawnow` | 2.642504 秒 |\n| `pause` AND\
  \ `drawnow` | 13.785564 秒 |\n\n## 4.5 显示正在运行的模拟或循环的状态\n\n### 问题\n\n您希望在循环中显示耗时任务剩余的运行时间。\n\
  \n### 解决方案\n\n创建一个包含文本`uicontrol`的窗口以显示剩余时间（见图 4-6）。\n\n![A335353_1_En_4_Fig6_HTML.jpg](img/A335353_1_En_4_Fig6_HTML.jpg)\n\
  \n**图 4-6.** 时间显示窗口\n\n\n\n### 工作原理\n\n`TimeDisplayGUI` 实现了时间窗口。它使用了三个带有 `varargin`\
  \ 的动作。一个持久变量 `hGUI` 存储了步骤数，并在每次更新调用时自动递增。以下是在此函数中需要注意的一些事项：\n\n- 使用 MATLAB 函数 `now`\
  \ 来获取当前日期，以进行计时。\n- 已完成的步骤数存储在 `hGUI.stepsDone` 中。\n- GUI 每半秒钟更新一次文本字符串。\n- 假设所有步骤耗时相同，它会计算脚本完成前的预估剩余时间。\n\
  - 内置演示使用了 `pause`。\n\n```\nfunction TimeDisplayGUI( action, varargin )\n```\n\n\
  ```\n%% TimeDisplayGUI 在循环中显示预计剩余时间\n% 每次步骤调用 TimeDisplayGUI('update')；步骤计数器通过持久变量自动递增。\n\
  % 每 0.5 秒间隔更新一次。\n%\n% TimeDisplayGUI('initialize', nameOfGUI, totalSteps )\n% TimeDisplayGUI('update')\n\
  % TimeDisplayGUI('close')\n%\n% 一次只能运行一个 TimeDisplayGUI。内置演示使用 pause 运行约 5 秒。\n\
  ```\n\n```\n%% 格式：\n% TimeDisplay( action, varargin )\n```\n\n```\n%% 输入\n% action\
  \ (1,:) 'initialize', 'update' 或 'close'\n% nameOfGUI (1,:) 要显示的名称\n% totalSteps\
  \ (1,1) 总步骤数\n%\n%% 输出\n% 无\n```\n\n```\npersistent hGUI\nif nargin == 0\n   % 演示\n\
  \   disp('正在初始化包含 100 步的演示窗口。')\n   TimeDisplayGUI( 'initialize', 'TimeDisplay Demo',\
  \ 100 );\n   for k = 1:100\n      pause(0.05)\n      TimeDisplayGUI( 'update' );\n\
  \   end\n   return;\nend\n\nswitch action\n   case 'initialize'\n      hGUI = BuildGUI(\
  \ varargin{1} );\n      hGUI.totalSteps = varargin{2};\n      hGUI.stepsDone = 0;\n\
  \      hGUI.date0 = now;\n      hGUI.lastDate = now;\n   case 'update'\n      if(\
  \ isempty( hGUI ) )\n         return\n      end\n      hGUI.stepsDone = hGUI.stepsDone\
  \ + 1;\n      hGUI = Update( hGUI );\n   case 'close'\n      if ~isempty(hGUI) &&\
  \ ishandle(hGUI.fig)\n         delete( hGUI.fig );\n      else\n         delete(\
  \ gcf )\n      end\n      hGUI = [];\nend\n```\n\n```\nfunction hGUI = Update( hGUI\
  \ )\n% 更新显示\nthisDate = now;\ndTReal = thisDate - hGUI.lastDate; % 天数\nif( dTReal\
  \ > 0.5/86400 )\n   % 每 0.5 秒递增一次\n   stepPer = hGUI.stepsDone/(thisDate - hGUI.date0);\n\
  \   stepsToGo = hGUI.totalSteps - hGUI.stepsDone;\n   tToGo = stepsToGo/stepPer;\n\
  \   datev = datevec(tToGo);\n   str = FormatString( hGUI.stepsDone/hGUI.totalSteps,\
  \ datev );\n   set( hGUI.percent, 'String', str );\n   drawnow;\n   hGUI.lastDate\
  \ = thisDate;\nend\n```\n\n```\nfunction h = BuildGUI( name )\n% 初始化 GUI\nset(0,'units','pixels')\n\
  p = get(0,'screensize');\nbottom = p(4) - 190;\nh.fig = figure('name',name,'Position',[340\
  \ bottom 298 90],'NumberTitle','off',...\n   'menubar','none','resize','off','closerequestfcn',...\n\
  \   'TimeDisplayGUI(''close'')');\nv = {'Parent',h.fig,'Units','pixels','fontunits','pixels'};\n\
  str = FormatString( 0, [0 0 0 0 0 0] );\nh.percent = uicontrol( v{:}, 'Position',[\
  \ 20 35 260 20], 'Style','text',...\n   'fontsize',12,'string',str,'Tag','StaticText2');\n\
  drawnow;\n```\n\n```\nfunction str = FormatString( fSteps, date )\n% 格式化倒计时时间字符串\n\
  str = sprintf('%4.2f%% 已完成，剩余 %2.2i:%2.2i:%5.2f',...\n   100*fSteps, date(4), date(5),\
  \ date(6));\n```\n\n下面的脚本 `TimeDisplayDemo` 演示了如何使用此函数。图 4-6 展示了结果窗口。\n\n```\n%%\
  \ 演示一个显示进程剩余时间的 GUI\n\n%% 另请参阅\n% TimeDisplayGUI\n\n%% 脚本常量\nn = 10000;\ndT = 0.1;\n\
  a = rand(10,10);\n\n%% 初始化时间显示\nTimeDisplayGUI( 'initialize', 'SVD', n )\n\n%% 循环\n\
  for j = 1:n\n   % 执行一些耗时的操作\n   for k = 1:100\n      svd(a);\n   end\n   % 显示状态消息\n\
  \   TimeDisplayGUI( 'update' );\nend\n\n%% 结束\nTimeDisplayGUI( 'close' );\n```\n\
  \n## 4.6 使用 GUIDE 创建自定义 GUI\n\n### 问题\n\n你有一个重复性的工作流程，并且希望构建一个 GUI，以避免反复在脚本中更改参数。例如，让我们采用配方\
  \ 4-1 中的旋转立方体动画，并将其放入 GUI 中，这样你就可以轻松查看不同暂停时长的影响。\n\n### 解决方案\n\n你将使用 GUI 设计环境 (GUIDE)\
  \ 来创建 GUI，从一个空白图形窗口开始。你需要一个用于输入暂停时长的编辑框，以及用于交互的按钮。\n\n\n\n### 工作原理\n\n输入 `guide`\
  \ 启动 GUIDE 快速入门窗口。在“创建新 GUI”选项卡中，选择“空白 GUI”。这将在编辑器中打开一个名为 `untitled1.fig` 的空白图形，如图\
  \ 4-7 所示。\n\n![A335353_1_En_4_Fig7_HTML.jpg](img/A335353_1_En_4_Fig7_HTML.jpg)\n\
  \n**图 4-7.** GUIDE 编辑器中的空白 GUI\n\n使用左侧的按钮在 GUI 中创建以下项目：\n\n- 用于输入暂停时间的编辑框\n- 文本框的文本标签\n\
  - 启动动画的按钮\n\n从文本标签开始，它看起来像一个包含 TXT 的方框。单击该按钮，然后用鼠标拖拽，直到拉出一个大小合适的方框。其中会填充“Static\
  \ Text”字样。双击文本框打开控件检查器。在这里，可以更改文本的样式和内容。将“String”更改为“Pause Duration (s)”，然后按 Tab\
  \ 键离开该字段或按 Enter 键。\n\n接下来，添加编辑框。此按钮看起来像一个包含 EDIT 的方框。在文本标签的右侧为编辑框拖拽出一个方框。双击它以打开检查器。将“String”更改为“0.01”，即默认暂停持续时间。请注意，“String”字段下方有一个“Tag”字段。默认情况下，它类似于“edit1”。它是\
  \ GUI 代码中此编辑框句柄的标识符。将其更改为 `pauseDur`。\n\n最后，添加按钮。它看起来像一个带有 OK 字母的按钮。将按钮放在文本和编辑框的下方。默认情况下，它显示为“Push\
  \ Button”。在检查器中，将其更改为“Start”。将“Tag”更改为 `startButton`。\n\n您还可以通过双击控件外部（背景）来更改图形本身的参数。将“Color”更改为您选择的背景色。取消选中“InvertHardcopy”复选框，这样在打印图形时背景色才能显示出来。在更改后的背景色下，您添加的控件会更容易看清。\n\
  \n有多种实现动画的选项。您可以直接在 GUI 中添加坐标轴，或者为动画维护一个单独的窗口，使其与之前的外观一致。现在，我们将为动画使用一个单独的图形窗口。\n\
  \n根据需要，将图形缩小。使用**工具** ➤ **对齐对象...** 对齐控件，然后保存新的图形。您的图形现在应类似于图 4-8。\n\n![A335353_1_En_4_Fig8_HTML.jpg](img/A335353_1_En_4_Fig8_HTML.jpg)\n\
  \n**图 4-8.** 新保存的 GUI\n\n此时，MATLAB 会创建一个 m 文件来控制该图形。FIG 文件维护您在检查器中看到的几何、样式和标签数据。m\
  \ 文件处理控件回调的执行。图 4-9 显示了新 m 文件中的函数列表，这些函数使用了您在编辑控件时指定的标签名称。\n\n![A335353_1_En_4_Fig9_HTML.jpg](img/A335353_1_En_4_Fig9_HTML.jpg)\n\
  \n**图 4-9.** 新保存的 GUI m 文件中的函数\n\n主函数 `BoxAnimationGUI` 包含一段标有“请勿编辑”的初始化代码。您可以在此段代码之后添加额外的初始化代码，或者添加到\
  \ `OpeningFcn` 中，在那里您可以访问 handles 数据。编辑框（您用于输入暂停持续时间的控件）有两个相关函数：`callback` 和 `create`\
  \ 函数。启动按钮只有一个回调函数。\n\n您需要在代码中执行以下操作：\n\n1. 在 `BoxAnimationGUI_OpeningFcn` 中创建图形窗口并绘制立方体，存储用于访问顶点数据的\
  \ patch 对象句柄。\n2. 将编辑框中的字符串转换为数字并存储。\n3. 在 `startButton_Callback` 中运行动画。将编辑框内容字符串转换为数字有两种选择。您可以在编辑框回调中执行此操作（当用户按\
  \ Tab 键离开该框或在该框处于活动状态时按 Enter 键时触发），也可以等到用户按下“启动”按钮时才转换数据。这是一个架构决策，在较大的 GUI 中，可能会受到用户可能输入的不同参数之间关系的影响。在这个简单案例中，影响不大，我们将在编辑框回调中进行转换。然而，这确实带来了数据初始化的问题：您必须在初始化期间将暂停持续时间的默认字符串转换为双精度浮点数，否则用户必须首先激活回调才能运行动画。因此，您需要在编码任务列表中添加以下步骤：\n\
  4. 在 `pauseDur_CreateFcn` 中初始化暂停持续时间值。最后，您正在使用 GUI 创建一个外部图形。使用这组默认函数，当主窗口关闭时，无法关闭额外的\
  \ GUI。但是，可以添加一个关闭函数来处理这个清理步骤。在 FIG 窗口的图形检查器中，默认的 CloseRequestFcn 是 `closereq`。如果您单击它左侧的小按钮，MATLAB\
  \ 会创建一个关闭函数并将其添加到您的 m 文件中。这是您在 GUI 中的最后一段编码：\n5. 在 `figure1_CloseRequestFcn` 中关闭额外的图形窗口。\n\
  \n完整的 GUI 函数如下所示。请注意，添加到 handles 数据结构中的自定义数据字段被分组到一个名为 `data` 的子结构中，以避免与 `uicontrol`\
  \ 句柄发生名称冲突。因无意中将控件对象和相关参数使用相同的名称而引入错误是非常容易的。\n\n```\nfunction varargout = BoxAnimationGUI(varargin)\n\
  % BOXANIMATIONGUI MATLAB code for BoxAnimationGUI.fig\n%      BOXANIMATIONGUI, by\
  \ itself, creates a new BOXANIMATIONGUI or raises the existing singleton*.\n%\n\
  %      H = BOXANIMATIONGUI returns the handle to a new BOXANIMATIONGUI or the handle\
  \ to\n%      the existing singleton*.\n%\n%      BOXANIMATIONGUI('CALLBACK',hObject,eventData,handles,...)\
  \ calls the local\n%      function named CALLBACK in BOXANIMATIONGUI.M with the\
  \ given input arguments.\n%\n%      BOXANIMATIONGUI('Property','Value',...) creates\
  \ a new BOXANIMATIONGUI or raises the\n%      existing singleton*. Starting from\
  \ the left, property value pairs are\n%      applied to the GUI before BoxAnimationGUI_OpeningFcn\
  \ gets called. An\n%      unrecognized property name or invalid value makes property\
  \ application\n%      stop. All inputs are passed to BoxAnimationGUI_OpeningFcn\
  \ via varargin.\n%\n%      *See GUI Options on GUIDE's Tools menu. Choose \"GUI\
  \ allows only one\n%      instance to run (singleton)\".\n%\n% See also: GUIDE,\
  \ GUIDATA, GUIHANDLES\n\n% Edit the above text to modify the response to help BoxAnimationGUI\n\
  % Last Modified by GUIDE v2.5 25-Aug-2015 15:10:40\n\n% Begin initialization code\
  \ - DO NOT EDIT\ngui_Singleton = 1;\ngui_State = struct('gui_Name',       mfilename,\
  \ ...\n                   'gui_Singleton',  gui_Singleton, ...\n               \
  \    'gui_OpeningFcn', @BoxAnimationGUI_OpeningFcn, ...\n                   'gui_OutputFcn',\
  \  @BoxAnimationGUI_OutputFcn, ...\n                   'gui_LayoutFcn',  [] , ...\n\
  \                   'gui_Callback',   []);\nif nargin && ischar(varargin{1})\n \
  \   gui_State.gui_Callback = str2func(varargin{1});\nend\n\nif nargout\n    [varargout{1:nargout}]\
  \ = gui_mainfcn(gui_State, varargin{:});\nelse\n    gui_mainfcn(gui_State, varargin{:});\n\
  end\n% End initialization code - DO NOT EDIT\n\n% --- Executes just before BoxAnimationGUI\
  \ is made visible.\nfunction BoxAnimationGUI_OpeningFcn(hObject, eventdata, handles,\
  \ varargin)\n% This function has no output args, see OutputFcn.\n% hObject    handle\
  \ to figure\n% eventdata  reserved - to be defined in a future version of MATLAB\n\
  % handles    structure with handles and user data (see GUIDATA)\n% varargin   command\
  \ line arguments to BoxAnimationGUI (see VARARGIN)\n\n% ADDED CUSTOM CODE FOR RECIPE\n\
  % Design the box\nx = 3;\ny = 2;\nz = 1;\nf = [2 3 6;3 7 6;3 4 8;3 8 7;4 5 8;4 1\
  \ 5;2 6 5;2 5 1;1 3 2;1 4 3;5 6 7;5 7 8];\nv = [−x x x −x −x x x −x;...\n     −y\
  \ −y y y −y −y y y;...\n     −z −z −z −z z z z z]'/2;\n\n% Create the figure\nh\
  \ = figure('name','Box');\np = patch('vertices',v,'faces',f,'facecolor',[0.5 0.5\
  \ 0.5],...\n          'linestyle','none','facelighting','gouraud');\nax = gca;\n\
  set(ax,'DataAspectRatio',[1 1 1],'DataAspectRatioMode','manual')\ngrid on\naxis([−3\
  \ 3 −3 3 −3 3])\nxlabel('x')\nylabel('y')\nzlabel('z')\nview(3)\nlight('position',[0\
  \ 0 1]);\n\n% Choose default command line output for BoxAnimationGUI\nhandles.output\
  \ = hObject;\n\n% Additional variables required\nhandles.data.box = p;\nhandles.data.vertices\
  \ = v;\nhandles.data.axis = ax;\nhandles.data.figure = h;\n% END CUSTOM CODE\n\n\
  % Update handles structure\nguidata(hObject, handles);\n\n% UIWAIT makes BoxAnimationGUI\
  \ wait for user response (see UIRESUME)\n% uiwait(handles.figure1);\n\n% --- Outputs\
  \ from this function are returned to the command line.\nfunction varargout = BoxAnimationGUI_OutputFcn(hObject,\
  \ eventdata, handles)\n% varargout  cell array for returning output args (see VARARGOUT);\n\
  % hObject    handle to figure\n% eventdata  reserved - to be defined in a future\
  \ version of MATLAB\n% handles    structure with handles and user data (see GUIDATA)\n\
  \n% Get default command line output from handles structure\nvarargout{1} = handles.output;\n\
