  \ (:,:) 向量数组`\n\n`% y (:,:) 向量数组`\n\n`%% 输出`\n\n`% d (1,:) w 和 y 的点积`\n\n`%% 另请参见`\n\
  \n`% Cross`\n\n`%% 版权`\n\n`% Copyright (c) 2015 Princeton Satellite Systems, Inc.`\n\
  \n`% All Rights Reserved.`\n\n发布到 HTML 时，除了已生成的 Contents 部分外，显示效果如下：\n\n## DOT 两个数组的点积。\n\
  \n### 形式\n\n`d = Dot( w, y )`\n\n`d = Dot( w )`\n\n### 描述\n\n支持数组的点积。`w` 和 `y` 的列数可以是：\n\
  \n* 两者都大于 1 且相等\n* 其中一个可以是单列，另一个有任意数量的列\n\n如果只有一个输入，则点积将针对自身进行。\n\n### 输入\n\n`w\
