- "# 排版结果\n\n`% 提示：get(hObject, 'String') 以文本形式返回 duration 的内容`\n\n`% str2double(get(hObject,\
  \ 'String')) 以双精度浮点数形式返回 duration 的内容`\n\n```\nduration = str2double(get(hObject,\
  \ 'String'));\nif isnan(filterdata)\n    set(hObject, 'String', 0);\n    errordlg('Input\
  \ must be a number','Error');\nend\n```\n\n`% 保存新的 duration 值`\n\n```\nhandles.filterdata.duration\
  \ = duration;\nguidata(hObject,handles)\n```\n\n与 `uicontrols` 控件一起存储的回调字符串，可以通过双击控件在检查器中查看，如图\
  \ 9-8 所示，对应 \"duration\" 编辑框。\n\n![A335353_1_En_9_Fig8_HTML.jpg](img/A335353_1_En_9_Fig8_HTML.jpg)\n\
  \n图 9-8. `uicontrol` 的回调字符串\n\nGUI 中编辑框右侧的单位，是由单位单选按钮调用的函数控制的。首先，移除整个 Units 面板；如果现在尝试运行\
  \ GUI，由于缺少英制和公制单位的字段，将会抛出错误。接下来，在 GUI 的 m 文件中移除与此 \"unitgroup\" 相关的代码。你还可以移除设置单位字段的代码，因为你可以将这些字符串硬编码；在模板中，它们被标记为\
  \ \"text4\"、\"text5\" 和 \"text6\"。移除 `initialize_gui` 中的代码行，并删除整个 `unitgroup_SelectionChangedFcn`\
  \ 函数。\n\n在 `initialize_gui()` 中移除：\n\n```\nset(handles.unitgroup, 'SelectedObject',\
  \ handles.english);\nset(handles.text4, 'String', 'lb/cu.in');\nset(handles.text5,\
  \ 'String', 'cu.in');\nset(handles.text6, 'String', 'lb');\n```\n\n将 \"duration\"\
  \ 和输入变量的初始值设置为仿真脚本中的值：\n\n```\nhandles.filterdata.duration = 1000;\nhandles.filterdata.input\
  \ = 100;\n```\n\n现在，GUI 可以运行了。由于已经移除了设置单位字符串的函数，你现在可以在检查器中更改 Duration、Input 和 Gains\
  \ 的单位字符串。你可以为图形窗口指定一个新名称：检测滤波器 GUI（点击图形背景，而非某个控件）。\n\n下一步是在 GUI 右侧添加一个新面板，其中包含用于故障参数\
  \ `uF` 和 `tachF` 的编辑框和按钮。每个项目需要一个静态文本 `uicontrol`、一个编辑框和一个按钮。添加了这些项目的框架如图 9-9 所示。\n\
  \n![A335353_1_En_9_Fig9_HTML.jpg](img/A335353_1_En_9_Fig9_HTML.jpg)\n\n图 9-9. 带有编辑框和按钮\
  \ `uicontrols` 的面板\n\n然后，你可以将 GUI 和右侧面板放大；插入用于时间常数 τ [1] 和 τ [2] 的框；并添加两个绘图坐标轴。你需要在坐标轴左侧为轴标签留出大量空间。将上方坐标轴的\
  \ Tag 改为 `states`，下方坐标轴的 Tag 改为 `residuals`。带有全部 `uicontrols` 的最终 GUI 如图 9-10 所示。请注意，坐标轴上显示了标签。\n\
  \n![A335353_1_En_9_Fig10_HTML.jpg](img/A335353_1_En_9_Fig10_HTML.jpg)\n\n图 9-10.\
  \ 在 GUIDE 中显示的已完成 GUI\n\n现在，你需要为 GUI 添加相当多的代码。检测滤波器仿真放在 Calculate 回调中。你必须添加代码，将新的编辑框项转换为双精度浮点数，即\
  \ `tachF`、`uF`、`tau1` 和 `tau2`，就像在 `duration_Callback` 中一样。你需要向 `initialize_gui`\
  \ 函数中添加代码来设置所有字段的值。最后，你需要为故障参数上的 Send 按钮添加全局变量的处理。\n\n首先，确保初始化函数定义了所有必需的变量，然后修复编辑框回调。你需要定义用于故障的两个全局变量。\n\
  \n```\n% ---------------------------------------------------------\nfunction initialize_gui(fig_handle,\
  \ handles, isreset)\nglobal tachFSent\nglobal inputFSent\n% 如果 filterdata 字段存在且重置标志为\
  \ false，则表示\n% 我们只是通过命令行调用 GUI 来重新初始化它\n```\n\n\n\n```matlab\n% while it is up.\
  \ So, bail out as we dont want to reset the data.\nif isfield(handles, 'filterdata')\
  \ && ~isreset\n    return;\nend\n\nhandles.filterdata.duration = 1000;\nhandles.filterdata.input\
  \ = 100;\nhandles.filterdata.tau1 = 0.3;\nhandles.filterdata.tau2 = 0.3;\nhandles.filterdata.tachF\
  \ = 1.0;\nhandles.filterdata.uF = 1.0;\nhandles.filterdata.dT = 0.1; % sec\nhandles.filterdata.dF\
  \ = [];\n\nset(handles.duration, 'String', handles.filterdata.duration);\nset(handles.input,\
  \ 'String', handles.filterdata.input);\nset(handles.tau1, 'String', handles.filterdata.tau1);\n\
  set(handles.tau2, 'String', handles.filterdata.tau2);\nset(handles.uF, 'String',\
  \ handles.filterdata.uF);\nset(handles.tachF, 'String', handles.filterdata.tachF);\n\
  set(handles.gains, 'String', '[]');\n\ntachFSent = false;\ninputFSent = false;\n\
  \n% Update handles structure\nguidata(handles.figure1, handles);\nUpdateGains(handles.figure1,\
  \ [], handles);\n```\n\n重置功能来源于模板 GUI；你会保留它，因为当用户将滤波器调整到不稳定状态时，它允许用户将所有字段恢复为标称值。注意，你在此处添加了一个\
  \ `dT` 字段和一个变量 `dF`，后者用于存储检测滤波器数据结构。在通过 handles 设置 GUI 数据后，你添加了对函数 `UpdateGains`\
  \ 的调用；当 `tau1` 或 `tau2` 字段被更改时，此函数会更新存储的检测滤波器。这让你能够在 `gains` 文本框中显示它们，并避免每次进行仿真时都重新计算滤波器矩阵。你使用\
  \ `num2str` 来显示增益矩阵，并采用最大精度位数，以使矩阵能够在分配的空间中完整显示。`UpdateGains` 函数如下所示。\n\n```matlab\n\
  function UpdateGains(hObject, eventdata, handles)\ntau1 = handles.filterdata.tau1;\n\
  tau2 = handles.filterdata.tau2;\ndT = handles.filterdata.dT;\nd = RHSAirTurbine;\n\
  dF = DetectionFilter('initialize',d,[tau1;tau2],dT);\nhandles.filterdata.dF = dF;\n\
  set(handles.gains, 'String', num2str(dF.d,3));\nguidata(hObject,handles)\n```\n\n\
  现在你可以更新 `tau1` 和 `tau2` 的回调函数。在通过 handles 设置值之后，你需要调用新的更新函数，就像在初始化函数中所做的那样。接下来展示\
  \ `tau1` 的函数；`tau2` 必须进行相同的更改。\n\n```matlab\nfunction tau1_Callback(hObject, eventdata,\
  \ handles)\n% hObject handle to tau1 (see GCBO)\n% eventdata reserved - to be defined\
  \ in a future version of MATLAB\n% handles structure with handles and user data\
  \ (see GUIDATA)\ntau1 = str2double(get(hObject, 'String'));\nif isnan(tau1)\n  \
  \  set(hObject, 'String', 0);\n    errordlg('Input must be a number','Error');\n\
  end\n% Save the new duration value\nhandles.filterdata.tau1 = tau1;\nguidata(hObject,handles)\n\
  UpdateGains(hObject,[],handles);\n```\n\n现在，你需要设置发送按钮的回调函数以设置全局变量。发送按钮的标签分别设置为 `sendTach`\
  \ 和 `sendInput`。回调函数中唯一需要的代码是声明全局变量并将其设置为 `true`。接下来展示 `sendInput` 的函数；`sendTach`\
  \ 必须进行相同的更改，但要使用 `tachFSent` 全局变量。\n\n```matlab\n% --- Executes on button press\
  \ in sendInput.\nfunction sendInput_Callback(hObject, eventdata, handles)\n% hObject\
  \ handle to sendInput (see GCBO)\n% eventdata reserved 2013 to be defined in a future\
  \ version of MATLAB\n% handles structure with handles and user data (see GUIDATA)\n\
  global inputFSent\ninputFSent = true;\n```\n\n现在，可以添加计算函数了。它基于之前配方中的仿真脚本。你添加了对全局变量的处理，以便在仿真循环中更改故障参数。你还添加了实时绘图更新，以便向用户提供残差的即时反馈。在仿真循环开始之前，使用\
  \ `TimeLabel` 函数根据时长字段获取时间标签的比例因子。\n\n你通过 `floor` 计算一个参数 `dP`，表示两次绘图之间的步数。基本上，你会在仿真过程中更新绘图\
  \ 100 次。在循环中，如果当前步 `k` 除以 `dP` 的余数为零，则绘制当前状态和残差的点。在循环中使用 `drawnow` 或通过选择坐标轴来更新图形可能非常缓慢，因此这是一种限制图形计算时间的简单方法。\n\
  \n**提示：** 如果每一步都绘图太慢，可以在循环中使用带有 `rem` 的内部 `if` 语句来实现间歇性图形更新。\n\n还要注意，你使用了可以传入坐标轴句柄的\
  \ `plot` 形式，以避免使用 `axes` 将坐标轴设为当前坐标轴。MATLAB 会警告你这样做可能非常缓慢。但是，一旦循环结束，在创建图例时，没有理由不这样做。\n\
  \n```matlab\n% --- Executes on button press in calculate.\nfunction calculate_Callback(hObject,\
  \ eventdata, handles)\n% hObject handle to calculate (see GCBO)\n% eventdata reserved\
  \ – to be defined in a future version of MATLAB\n% handles structure with handles\
  \ and user data (see GUIDATA)\nglobal inputFSent\nglobal tachFSent\n\n% get the\
  \ data from the handles\nu = handles.filterdata.input;\nduration = handles.filterdata.duration;\n\
  tachF = handles.filterdata.tachF;\nuF = handles.filterdata.uF;\ndT = handles.filterdata.dT;\n\
  \n% initialize the simulation states and arrays\nn = ceil(duration/dT);\nx = [0;0];\n\
  d = RHSAirTurbine;\ndF = handles.filterdata.dF;\ndF = DetectionFilter('reset',dF);\n\
  xP = zeros(4,n);\nt = (0:n-1)*dT;\ndP = floor(n/100);\n\n% prepare for plotting\
  \ during the simulation\n[tt,tL] = TimeLabel(duration);\ntF = tt/duration;\naxes(handles.states)\n\
  cla\nhold on\naxes(handles.residuals)\ncla\nhold on\nxlabel(tL)\n\nfor k = 1:n\n\
  \    if inputFSent\n        inputFSent = false;\n        data = guidata(hObject);\n\
  \        uF = data.filterdata.uF;\n    end\n    if tachFSent\n        tachFSent\
  \ = false;\n        data = guidata(hObject);\n        tachF = data.filterdata.tachF;\n\
  \    end\n    y = [x(1);tachF*x(2)]; % Sensor failure\n    xP(:,k) = [x;dF.r];\n\
  \    dF = DetectionFilter('update',u,y,dF);\n    d.u = uF*u; % Actuator failure\n\
  \    x = RungeKutta( @RHSAirTurbine, t(k), x, dT, d );\n    if rem(k,dP)==0\n  \
  \      plot(handles.states,tF*t(k), xP(1,k),'b.' );\n        plot(handles.states,tF*t(k),\
  \ xP(2,k),'r.' );\n        plot(handles.residuals,tF*t(k), xP(3,k), 'b.' );\n  \
  \      plot(handles.residuals,tF*t(k), xP(4,k), 'r.' );\n        drawnow\n    end\n\
  end\n\n% Plot the states and residuals\naxes(handles.states)\nplot(tF*t, xP(1:2,:)\
  \ )\nlegend('p','\\omega')\naxes(handles.residuals)\nplot(tF*t, xP(3:4,:) )\nlegend('r_p','r_{\\\
  omega}')\n```\n\n现在，你有了一个功能完备的 GUI，可以绘制仿真进度，并允许你随时注入故障。图 9-11 显示了一次无故障仿真的结果。\n\n\
  ![A335353_1_En_9_Fig11_HTML.jpg](img/A335353_1_En_9_Fig11_HTML.jpg)\n\n**图 9-11.**\
  \ 无故障运行的 GUI\n\n你现在已经构建了一个工具，可以在不生成数十个绘图窗口的情况下探索模型的参数空间。请注意，添加几个工具栏按钮可以让用户放大或从绘图中获取数据点。可以添加的其他功能包括菜单项，例如保存和重新加载特定案例，或将运行结果导出到工作区、mat\
  \ 文件或文本文件。图 9-12 显示了一次在仿真中途注入输入故障的运行。这会影响状态和残差。为了复现这样的运行，你需要随时间记录 `tachF` 和 `uF`\
  \ 的值以及初始条件。\n\n![A335353_1_En_9_Fig12_HTML.jpg](img/A335353_1_En_9_Fig12_HTML.jpg)\n\
  \n**图 9-12.** 注入输入故障的 GUI 运行\n\n总结\n\n\n\n本章演示了如何设计用于检测动态系统中故障的检测滤波器。该系统通过一台可能经历压力调节器故障和转速计故障的涡轮机进行演示。此外，您还学习了使用`GUIDE`设计图形用户界面来自动化滤波器仿真。该图形用户界面展示了实时绘图以及在持续仿真循环中注入故障的功能。表\
  \ 9-1 列出了本章开发的代码。\n\n表 9-1. 章节代码清单\n\n| 文件 | 描述 |\n| --- | --- |\n| `RHSAirTurbine`\
  \ | 连续状态空间形式的涡轮机动力学模型。 |\n| `DetectionFilter` | 构建并更新一个线性检测滤波器。 |\n| `DetectionFilterSim`\
  \ | 检测滤波器的仿真程序。 |\n| `DetectionFilterGUI` | 通过图形用户界面运行检测滤波器仿真。 |\n| `DetectionFilterGUI.fig`\
  \ | 供`GUIDE`使用的图形用户界面布局。 |\n\n脚注 1\n\nJere Schenck Meserole 的博士论文，“用于涡扇发动机容错控制的检测滤波器”，麻省理工学院航空航天系，1981\
  \ 年。\n\n"
- "# 10. 化学过程\n\n电子补充材料：本章的在线版本（doi: [10.​1007/​978-1-4842-0559-4_​10](http://dx.doi.org/10.1007/978-1-4842-0559-4_10)）包含补充材料，仅供授权用户使用。\n\
  \n在化学工程中，需要对化学品生产进行建模并控制生产过程。我们的示例是一个需要控制混合溶液 pH 值的简单过程。这个问题很有趣，因为该过程高度非线性，且传感器模型没有\
  \ pH 测量的显式解。对传感器进行建模需要使用数值求解器`fzero`。\n\n您将研究的具体化学过程包括一股酸（`HNO[3]`）流、一股缓冲液（`NaHCO[3]`）流和一股碱（`NaOH`）流，它们在搅拌罐中混合。¹\
  \ 这基于加州大学圣塔芭芭拉分校（UCSB）为研究化学过程控制而开发的实验室规模实验。² 图 10-1 展示了该系统的示意图，有三股输入流`q1`、`q2`和`q3`，以及一个通向输出流`q4`的阀门，您将在其中测量\
  \ pH 值。目标是实现中性 pH 值。\n\n![A335353_1_En_10_Fig1_HTML.gif](img/A335353_1_En_10_Fig1_HTML.gif)\n\
  \n图 10-1. 化学混合问题\n\n## 10.1 对化学混合过程进行建模\n\n### 问题\n\n您希望对化学过程进行建模，该过程由在搅拌罐中混合的一股酸流、一股缓冲液流和一股碱流组成。\n\
  \n### 解决方案\n\n通过为每路输入流添加两个反应不变量来对化学平衡进行建模，并使用这些不变量写出动力学方程。这些方程被编码在一个右侧函数中，该函数还定义了模型的数据结构。\n\
  \n\n\n### 工作原理\n\n反应不变量是指在反应过程中数值不发生变化的量。每个不变量都是一组化学成分的组合，其值保持不变。输入物料为硝酸（`HNO[3]`）、碳酸氢钠（`NaHCO[3]`）以及氢氧化钠（`NaOH`）。每个输入流\
  \ `i` 都有一对不变量。两个反应不变量 `W[a]` 和 `W[b]` 分别为：\n\n![ $$ {W}_{ai}={\\left[{\\mathrm{H}}^{+}\\\
  right]}_i-{\\left[{\\mathrm{OH}}^{-}\\right]}_i-{\\left[{\\mathrm{H}\\mathrm{CO}}_3^{-}\\\
  right]}_i-2{\\left[{\\mathrm{CO}}_3^{=}\\right]}_i $$ ](A335353_1_En_10_Chapter_Equ1.gif)\n\
  \n(10.1)\n\n![ $$ {W}_{bi}={\\left[{\\mathrm{H}}_2{\\mathrm{CO}}_3\\right]}_i+{\\\
  left[{\\mathrm{H}\\mathrm{CO}}_3^{-}\\right]}_i+{\\left[{\\mathrm{CO}}_3^{=}\\right]}_i\
  \ $$ ](A335353_1_En_10_Chapter_Equ2.gif)\n\n(10.2)\n\n其中，`I = 1` 代表酸流，`I = 2` 代表缓冲液流，`i\
  \ = 3` 代表碱液流，`i = 4` 代表混合后的出流。通过质量平衡推导，出流不变量的动力学方程如下：\n\n![ $$ {\\dot{W}}_{a4}=\\\
  frac{1}{Ah}\\left({W}_{a1}-{W}_{a4}\\right){q}_1+\\frac{1}{Ah}\\left({W}_{a2}-{W}_{a4}\\\
  right){q}_2+\\frac{1}{Ah}\\left({W}_{a3}-{W}_{a4}\\right){q}_3 $$ ](img/A335353_1_En_10_Chapter_Equ3.gif)\n\
  \n(10.3)\n\n![ $$ {\\dot{W}}_{b4}=\\frac{1}{Ah}\\left({W}_{b1}-{W}_{b4}\\right){q}_1+\\\
  frac{1}{Ah}\\left({W}_{b2}-{W}_{b4}\\right){q}_2+\\frac{1}{Ah}\\left({W}_{b3}-{W}_{b4}\\\
  right){q}_3 $$ ](img/A335353_1_En_10_Chapter_Equ4.gif)\n\n(10.4) 其中，`q[i]` 是第 `i^(th)`\
  \ 股液流的体积流量，`A` 是混合罐的横截面积，`h` 是液位高度。液位高度由以下微分方程控制：\n\n![ $$ \\dot{h}=\\frac{1}{A}\\\
  left[{q}_1+{q}_2+{q}_3-{C}_v{\\left(h+z\\right)}^n\\right] $$ ](A335353_1_En_10_Chapter_Equ5.gif)\n\
  \n(10.5) 其中，`C[v]` 是阀门系数，`n` 是阀门指数，`z` 是混合罐底部到出流口之间的垂直距离。你可以测量 `h` 的值。通常，你需要估计反应不变量，但在此问题中，我们将假设这些值可直接测量。上述方程均为一阶方程，因此构成了该系统的状态方程。流量与各状态变量相乘，这意味着它们对导数的影由状态变量与液流的乘积决定。当\
  \ `h = 0` 时，出流不变量的微分方程会出现奇异。这是因为如果罐体为空，则流量必须为零。\n\n由此得到的右端函数 `RHSpH` 如下所示。它符合 `RungeKutta`\
  \ 积分器（参见配方 6-2）所需的格式，即 `RHS(t,x,d)`，并用波浪号 `˜` 代替第一个输入，因为该动力学方程与时间无关。请注意，当没有输入时，会定义并返回一个数据结构。该模型包含相当多的参数，这些参数在注释头部中已做说明。\n\
  \n```\n%% RHSpH 化学混合过程的动力学模型。\n% 该过程包括一股酸（HNO3）液流、一股缓冲液（NaHCO3）液流\n% 和一股碱（NaOH）液流，它们在搅拌罐中混合。混合后的出流\n\
  % 通过一个阀门离开罐体。化学平衡通过为每个入口液流引入\n% 两个反应不变量来建模。i = 1 代表酸，i = 2 代表缓冲液，\n% i = 3 代表碱，i\
  \ = 4 代表出流。\n%\n% + - - =\n% wAi = [H ]i - [OH ]i - [HCO3 ]i - 2[CO3 ]i\n% - =\n\
  % wBi = [H2CO3]i + [HCO3 ]i + 2[CO3 ]i\n%\n%% 形式\n% d = RHSpH\n% xDot = RHSpH( t,\
  \ x, d )\n%\n%% 输入\n% t (1,1) 时间，未使用\n% x (3,1) 状态 [wA4;wB4;h]\n% d (.) 数据结构\n%\
  \ .wA1 (1,1) 酸的不变量 A, (M)\n% .wA2 (1,1) 缓冲液的不变量 A, (M)\n% .wA3 (1,1) 碱的不变量 A, (M)\n\
  % .wB1 (1,1) 酸的不变量 B, (M)\n% .wB2 (1,1) 缓冲液的不变量 B, (M)\n% .wB3 (1,1) 碱的不变量 B, (M)\n\
  % .a (1,1) 混合罐的横截面积 (cm2)\n% .cV (1,1) 阀门系数\n% .n (1,1) 阀门指数\n% .z (1,1) 罐底到出流口的垂直距离\
  \ (cm)\n% .q1 (1,1) HNO3 的体积流量 (ml/s)\n% .q2 (1,1) NaHCO3 的体积流量 (ml/s)\n% .q3 (1,1)\
  \ NaOH 的体积流量 (ml/s)\n%\n%% 输出\n% xDot (3,1) 状态导数\n%\n%% 参考文献\n% Henson, M. A. and\
  \ D. E. Seborg. (1997.) Nonlinear Process\n% Control, Prentice-Hall. pp. 207-210.\n\
  \nfunction xDot = RHSpH( ˜, x, d )\nif ( nargin < 1 )\n% 注意：原始文献中省略了 Cv；我们根据罐内恒定液位\
  \ 14 cm 计算了该值。\nd = struct('wA1',0.003,'wA2',−0.03,'wA3',−3.05e−3,...\n'wB1',0.0,\
  \ 'wB2', 0.03,'wB3', 5.0e−5,...\n'a',207,'cV',4.5860777,'n',0.607,'z',11.5,...\n\
  'q1',16.6,'q2',0.55,'q3',15.6);\nxDot = d;\nreturn ;\nend\nwA4 = x(1);\nwB4 = x(2);\n\
  h = x(3);\nhA = 1/(h*d.a);\nxDot = [hA*( (d.wA1 − wA4)*d.q1 + (d.wA2 − wA4)*d.q2\
  \ + (d.wA3 − wA4)*d.q3 );...\nhA*( (d.wB1 − wB4)*d.q1 + (d.wB2 − wB4)*d.q2 + (d.wB3\
  \ − wB4)*d.q3 );...\nd.q1 + d.q2 + d.q3 − d.cV*(h + d.z)ˆd.n];\n```\n\n数据结构中的默认值源自参考文献中的数据，但\
  \ `C[v]` 除外；该参数在参考文献中被忽略了，因此我们根据平衡罐液位计算了一个值。\n\n```\nans =\nwA1: 0.003\nwA2: −0.03\n\
  wA3: −0.00305\nwB1: 0\nwB2: 0.03\nwB3: 5e − 05\na: 207\ncV: 4.5861\nn: 0.607\nz:\
  \ 11.5\nq1: 16.6\nq2: 0.55\nq3: 15.6\n```\n\n本章的目标是设计一个平衡点控制器。我们可以将方程重写为线性方程，每个状态和输入都被替换为，例如：\n\
  \n![ $$ {q}_3={q}_{30}+\\delta {q}_3 $$ ](img/A335353_1_En_10_Chapter_Equ6.gif)\n\
  \n(10.6)\n\n![ $$ h={h}_0+\\delta h $$ ](img/A335353_1_En_10_Chapter_Equ7.gif)\n\
  \n(10.7) 其中 `δq[3]` 是一个小量。然后我们可以正式推导出线性控制系统。不过，我们将把这个任务留给感兴趣的读者，直接继续实现一个线性控制系统。\n\
  \n## 10.2 感知化学过程中的 pH 值\n\n### 问题\n\npH 传感器由一个非线性方程建模，该方程无法显式求解出 pH 值。\n\n### 解决方案\n\
  \n使用 MATLAB 的 `fzero` 函数来求解 pH 值。\n\n\n\n### 工作原理\n\npH 值的方程如下：\n\n![ $$ 0={W}_{a4}+{10}^{\\\
  left(\\mathrm{p}\\mathrm{H}-14\\right)}-{10}^{-\\mathrm{p}\\mathrm{H}}+{W}_{b4}\\\
  frac{1+2\\times {10}^{\\left(\\mathrm{p}\\mathrm{H}-p{K}_2\\right)}}{1+{10}^{\\\
  left(p{K}_1-\\mathrm{p}\\mathrm{H}\\right)}+{10}^{\\left(\\mathrm{p}\\mathrm{H}-p{K}_2\\\
  right)}} $$ ](img/A335353_1_En_10_Chapter_Equ8.gif)\n\n(10.8)\n\n回顾一下，`W[a4]` 和\
  \ `W[b4]` 是配方 10-1 中定义的混合流出物的反应不变量。`pK[1]` 和 `pK[2]` 分别是 `H[2]CO[3]` 和 ![ $$ {\\\
  mathrm{HCO}}_3^{-} $$ ](img/A335353_1_En_10_Chapter_IEq1.gif) 解离常数的以 10 为底的对数。\n\
  \n![ $$ p{K}_a=-{\\displaystyle { \\log}_{10}}{K}_a $$ ](img/A335353_1_En_10_Chapter_Equa.gif)\n\
  \n生成该测量值的函数是 `PHSensor`。\n\n```\n%% PHSensor Model pH measurement of a mixing process\n\
  % Compute pH as a function of wA4 and wB4 and also the slope of pH with\n% respect\
  \ to those states. Requires the use of fzero.\n%\n%% Forms\n% pH = PHSensor( x,\
  \ d )\n% d = PHSensor( 'struct' )\n%\n%% Inputs\n% x (2,:) State [wA4;wB4]\n% d\
  \ (.) Data structure\n% .pK1 (1,1) Base 10 log of a disassociation constant (H2CO3)\n\
  % .pK2 (1,1) Base 10 log of a disassociation constant (HCO3-)\n%\n%% Outputs\n%\
  \ pH (:,:) pH of the solution\n%\n%% Reference\n% Henson, M. A. and D. E. Seborg.\
  \ Nonlinear Process control, Prentice–Hall,\n% 1997. pp. 207–210.\n```\n\n`PHSensor`\
  \ 的主体部分调用 `fzero` 来计算 pH 值。这需要一个目标函数，系统将在输入点附近搜索该函数的零点。使用中性的 pH 值 7.0 作为优化的初始条件。该函数已向量化以处理多个输入状态，计算出一个包含\
  \ `W[a4]` 和 `W[b4]` 组合的 pH 值方阵。\n\n```\n% Compute the pH starting from neutral\n\
  n = size(x,2);\npH = zeros(n,n);\npH0 = 7.0;\nfor k = 1:n\n    for j = 1:n\n   \
  \     d.wA4 = x(1,k);\n        d.wB4 = x(2,j);\n        pH(k,j) = fzero( @Fun, pH0,\
  \ [], d );\n    end\nend\n```\n\n**提示：** 使用 `fzero` 求解复杂单方程的零点。对于需要最小化函数的多个值的方程组，请使用\
  \ `fminzero`。\n\n请注意，按照我们的常规模式，我们定义了一个数据结构 `d` 用于将数据传递给传感器模型。我们的两个参数是 `pK[1]` 和\
  \ `pK[2]`。\n\n```\nif ( ischar(x) )\n    pH = struct('pK1',-log10(4.47e-7),'pK2',-log10(5.62e-11));\n\
  \    return\nend\n```\n\n方程 10.8 体现在子函数 `Fun` 中，该函数被传递给 `fzero`。\n\n```\nfunction\
  \ y = Fun( pH, d )\n%%% PHSensor>Fun Function to be zeroed via fzero\n% y = Fun(\
  \ pH, d )\ny = d.wA4 + 10ˆ(pH − 14) − 10ˆ(−pH) ...\n    + d.wB4*(1 + 2*10ˆ(pH −\
  \ d.pK2))/(1 + 10ˆ(d.pK1 − pH) + 10ˆ(pH − d.pK2));\n```\n\n该函数中包含一个演示，正如风格配方中描述的最佳实践所建议的那样。该演示基于参考文献中的数值，为状态（即不变量）指定了数值范围。\n\
  \n```\n% Demo\nif ( nargin < 1 )\n    x(1,:) = linspace(−9e−4,0);\n    x(2,:) =\
  \ linspace(0,1e−3);\n    d = PHSensor('struct');\n    PHSensor( x, d );\n    return\n\
  end\n```\n\n结果在主函数的末尾绘制成图。\n\n```\nif ( nargout == 0 )\n    h = figure ;\n    set\
  \ (h,'Name','pH Sensor');\n    mesh (pH)\n    xlabel ('WB4');\n    ylabel ('WA4');\n\
  \    zlabel ('pH')\n    grid on\n    rotate3d on\n    clear pH\nend\n```\n\n绘图使用了\
  \ `mesh` 函数。请务必记住，`p` 的行对应于 `Wa[4]`，列对应于 `W[b4]`。在 `mesh` 图中，列是 x 轴，行是 y 轴。图 10-2\
  \ 显示了 `mesh` 图以及另一种 `surf` 图（其 `'edgecolor'` 设置为 `'none'`）。请注意这两个 MATLAB 命令：\n\n\
  ![A335353_1_En_10_Fig2_HTML.gif](img/A335353_1_En_10_Fig2_HTML.gif)\n\n**图 10-2.**\
  \ pH 传感器输出的 `surf` 和 `mesh` 图\n\n```\ngrid on\nrotate3d on\n```\n\n始终使用 `on` 以确保命令被执行而非切换；否则，如果你刚刚运行了另一个包含这些命令的脚本或函数，可能会得到意想不到的结果。\n\
  \n请注意，pH 值与反应不变量之间的关系是高度非线性的。理想情况下，你可能希望得到如下关系式：\n\n![ $$ pH=c\\left[\\begin{array}{l}{W}_{a4}\\\
  hfill \\\\ {}{W}_{b4}\\hfill \\end{array}\\right] $$ ](A335353_1_En_10_Chapter_Equ9.gif)\n\
  \n(10.9) 其中 `c` 是一个具有常系数的 2 × 2 矩阵。这在平坦区域可能是成立的，但在“瀑布”区域则不成立。\n\n在模拟中使用此函数时，需要它尽可能快地运行，而无需安装\
  \ `fzero` 的诊断程序。然而，在调试期间，你可能需要额外的信息。通过设置 `Display` 选项，`fzero` 可以显示每次迭代的信息。例如，使用\
  \ `'iter'` 设置，它将打印每次迭代的信息。更新后的 `fzero` 调用如下：\n\n```\npH(k,j) = fzero( @Fun, pH0,\
  \ optimset('Display','iter'), d );\n```\n\n以下是单个状态的结果：\n\n```\n>> d = PHSensor('struct')\n\
  d = \n    pK1: 6.3497\n    pK2: 10.25\n>> pH = PHSensor( [−4.32e−4;5.28e−4], d )\n\
  Search for an interval around 7 containing a sign change:\n Func-count    a    \
  \      f(a)             b          f(b)        Procedure\n 1            7      \
  \   −2.39821e−07     7         −2.39821e−07   initial interval\n 3        6.80201\
  \    −4.16536e−05     7.19799    3.09792e−05     search\nSearch for a zero in the\
  \ interval [6.80201, 7.19799]:\n Func-count    x          f(x)             Procedure\n\
  \ 3        7.19799    3.09792e−05        initial\n 4        7.0291     4.96758e−06\
  \        interpolation\n 5        7.00028   −1.88684e−07        interpolation\n\
  \ 6        7.00133    3.84365e−09        interpolation\n 7        7.00131    2.86799e−12\
  \        interpolation\n 8        7.00131    0                  interpolation\n\
  Zero found in the interval [6.80201, 7.19799]\npH =\n    7.0013\n```\n\n这是一个非常快速的求解过程，因为它非常接近起始点\
  \ 7.0。请注意，`fzero` 首先找到了一个包含符号变化的区间，然后搜索零点。`fzero` 也可以在完成后输出诊断信息，而不是在运行期间打印。例如，如果调用如下：\n\
  \n```\n[pH(k,j),fval,exitflag,output] = fzero( @Fun, pH0, [], d );\n```\n\n那么输出的结构体是可用的，例如：\n\
  \n```\noutput = \n  intervaliterations: 1\n          iterations: 5\n           funcCount:\
  \ 8\n            algorithm: 'bisection, interpolation'\n              message: 'Zero\
  \ found in the interval [6.80201, 7.19799]'\n```\n\n请注意，所使用的算法（二分法）会与迭代总数和函数求值次数一起列出。考虑对输入状态稍作修改，将\
  \ `W[b4]` 降低到 4e^(–4) M。迭代次数会显著增加。\n\n```\n>> pH = PHSensor( [−4.32e−4;4e−4], d\
  \ )\noutput = \n  intervaliterations: 8\n          iterations: 7\n           funcCount:\
  \ 24\n            algorithm: 'bisection, interpolation'\n              message:\
  \ 'Zero found in the interval [4.76, 9.24]'\npH =\n    9.022\n```\n\n特别需要注意的是，查看问题的诊断信息有助于确认你的容差是否合适。考虑上一案例的最后几次迭代。\n\
  \n```\nSearch for a zero in the interval [4.76, 9.24]:\n Func-count    x       \
  \   f(x)             Procedure\n 17       9.24      2.04571e−05        initial\n\
  \ 18       9.04068   1.42294e−06        interpolation\n 19       9.02583   2.87604e−07\
  \        interpolation\n 20       9.02207   5.59178e−09        interpolation\n 21\
  \       9.02199   2.25694e−11        interpolation\n 22       9.02199   1.7808e−15\
  \         interpolation\n 23       9.02199   5.42101e−20        interpolation\n\
  \ 24       9.02199   5.42101e−20        interpolation\n```\n\n搜索将函数值一直推到了 5.4e −\
  \ 20，这可能比需要的限制更严格。可以通过使用 `optimset` 获取默认选项结构来查看默认容差。\n\n```\n>> options = optimset('fzero')\n\
  options = \n        Display: 'notify'\n    MaxFunEvals: []\n        MaxIter: []\n\
  \         TolFun: []\n           TolX: 2.2204e−16\n    FunValCheck: 'off'\n    \
  \   OutputFcn: []\n       PlotFcns: []\n```\n\n函数值的默认容差 `TolX` 是 2.2204e-16。请注意，你将所选优化例程的名称\
  \ `fzero` 传递给了 `optimiset`。`fminbnd` 和 `fminsearch` 也可以同样处理。\n\n**提示：** 使用 `optimset`\
  \ 并传入优化函数的名称，以获取默认选项结构。\n\n现在考虑你希望评估 `fzero` 在一系列输入上的表现。假设你为 `Fun` 创建一个单独的函数，并编写一个脚本来记录运行期间\
  \ `output` 中的额外数据。图 10-3 显示了使用 `pcolor` 绘制的记录到的函数求值次数图。你可以看到由于模型的非线性而导致的快速变化。最大函数求值次数不超过\
  \ 35。\n\n![A335353_1_En_10_Fig3_HTML.gif](img/A335353_1_En_10_Fig3_HTML.gif)\n\n\
  **图 10-3.** `PHSensor` 算法的函数求值次数\n\n以下是创建该图的增强代码。\n\n```\n%% Script for debugging\
  \ PHSensor algorithm\n% Nominal operating conditions from the reference\nx10 = −4.32e−4;\n\
  x20 = 5.28e−4;\nx = [];\nx(1,:) = linspace(2*x10,0);\nx(2,:) = linspace(0,2*x20);\n\
  d = PHSensor('struct');\n\n% Compute the pH starting from neutral\nn = size(x,2);\n\
  pH = zeros(n,n);\nfEvals = zeros(n,n);\npH0 = 7.0;\nfor k = 1:n\n    for j = 1:n\n\
  \        d.wA4 = x(1,k);\n        d.wB4 = x(2,j);\n        % Options: TolX, Display,\
  \ FunValCheck\n        % ( 'TolX' ,1e − 10);\n        % ( 'Display' , 'iter' )\n\
  \        % ( 'FunValCheck' , 'on' ) % no errors found for demo\n        options\
  \ = optimset('FunValCheck','on');\n        [pH(k,j),fval,exitflag,output] = fzero(\
  \ @Fun, pH0, options, d );\n        fEvals(k,j) = output.funcCount;\n    end\nend\n\
  \nfigure ('Name','pH Sensor');\nsurf (pH,'edgecolor','none')\nxlabel ('WB4');\n\
  ylabel ('WA4');\nzlabel ('pH')\ngrid on\nrotate3d on\n\nfigure ('Name','Evaluations')\n\
  s = pcolor (x(2,:),x(1,:),fEvals);\nset (s,'edgecolor','none')\nxlabel ('WB4');\n\
  ylabel ('WA4');\ncolormap jet\ntitle ('Function Evaluations by fzero')\n```\n\n\n\
