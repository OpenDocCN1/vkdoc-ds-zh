  \n> **提示**\n> 为你的 MEX 文件提供一个单独的 m 文件，其中包含帮助注释，并可选择调用该 MEX 文件。\n\n请参阅 MATLAB 中的帮助文章，包括“MEX\
  \ 文件组件”，以及编写 MEX 文件的众多示例。对于 GLPK（GNU 线性规划工具包），GNU 公共许可证下提供了一个优秀的 MEX 文件。它由 Nicolo\
  \ Giorgetti 编写，并由 Niels Klitgord 维护。现在可以在 SourceForge 上获取，网址为[`http://glpkmex.sourceforge.net`](http://glpkmex.sourceforge.net/)。\n\
  \n## 1.6 使用解析文件保护您的知识产权\n\n### 问题\n\n您希望与客户或协作者共享文件，同时不泄露源代码中的知识产权。\n\n### 解决方案\n\
  \n使用 MATLAB 的`pcode`函数创建受保护的函数版本。创建一个包含帮助注释的单独文件，以便用户可以访问文档。\n\n\n\n### 工作原理\n\n\
  `pcode` 函数提供了一种将 m 文件解析为可执行文件并隐藏内容的能力。这可用于在保护知识产权的同时分发软件。路径中带有“p”扩展名的 p 代码文件，其优先级高于同名\
  \ m 文件。解析 m 文件非常简单：\n\n```\n>> pcode Dot\n```\n\n可用的唯一参数是 `-INPLACE` 标志，用于将 p 文件存储在源\
  \ m 文件所在的同一目录中；否则，它将保存到当前目录。\n\n你可能会遇到的一个困难是，一旦你解析了函数并将它们移动到新文件夹中，就不再能访问你创建的函数帮助。p\
  \ 代码文件未实现命令行帮助，输入 `help MyFunction` 不再有效。与 MEX 文件类似，你必须创建一个包含帮助注释的单独 m 文件。你可以编写一个函数来从\
  \ m 文件中提取头部信息并将其保存。你将使用 `fprintf` 来实现此目的，因此头部信息绝不能包含任何特殊字符（如反斜杠）非常重要。\n\n```\nfunction\
  \ ParseAndSaveHeader( readFromFile, writeToFile )\nfilePath = which (readFromFile);\n\
  [pathStr,name,ext] = fileparts(filePath);\ncopyfile (filePath, fullfile(pathStr,[name,'_orig',ext]));\n\
  fid = fopen (filePath,'rt');\nt = fgetl (fid);\nhlp = \"\";\nwhile ( ~isempty (t)\
  \ && strcmp (t(1),'%') )\n    if length (t)>1 && strcmp (t(2),'%')\n        t =\
  \ ['%' t];\n    end\n    hlp = [hlp,'\\n%',t];\n    t = fgetl (fid);\n    if ( ~ischar(t)\
  \ )\n        break ;\n    end\nend\nhlp = [hlp,'\\n%%\\n%% This function was parsed\
  \ on ', date ,'\\n\\n'];\nfclose (fid);\nif ischar(writeToFile)\n    fid = fopen\
  \ (writeToFile,'wt');\nelse\n    fid = writeToFile;\nend\nfprintf (fid,hlp);\nif\
  \ ischar(writeToFile)\n    fclose (fid);\nend\npcode(filePath);\n```\n\n你会保存一份带有\
  \ `_orig` 后缀的 m 文件副本，以防止因文件被删除而导致不愉快的意外。请注意，你在末尾添加了一条最终注释，其中包含函数被解析时的日期。\n\n#####\
  \ 写入文本文件\n\n### 问题\n\n你需要将 MATLAB 中的一些信息写入文本文件。一个示例是按照首选格式为新函数创建模板。\n\n### 解决方案\n\
  \n你使用 `fopen`、`fprintf` 和 `fclose` 打开一个新的文本文件，将所需行打印到其中，然后将其关闭。使用 `input` 函数允许用户输入函数的单行摘要。\n\
  \n### 工作原理\n\nMATLAB 拥有一整套用于输入和输出的函数，包括写入文件。有关详细列表，请参阅 `help iofun`。你可以写入文本文件、电子表格、二进制文件、XML、图像或\
  \ zip 文件。\n\n一个有用的示例是为你的公司创建新函数的模板，遵循你首选的头部格式。这需要使用 `fopen`、`fclose` 和 `fprintf`\
  \ 将行打印到文件中。第一个输入是新函数的所需名称。请注意，如果给定文件标识符 1，`fprintf` 将打印到命令行。你可以选择通过第二个输入（一个布尔标志）来实现此目的。你使用\
  \ `date` 函数获取版权声明的当前年份，该函数返回一个格式为 'dd-mmm-yyyy' 的字符串；你使用字符串函数 `strsplit` 将字符串拆分为标记。使用字符串索引是一种替代方法。此外，这演示了使用\
  \ `input` 向用户提示输入字符串，即新函数的一行描述。\n\n```\n%% NEWBOOKFILE Create a new function with\
  \ the default header style.\n% Pass in a file name and the header template will\
  \ be printed to that file\n% in the current directory. You will be asked to enter\
  \ a one-line summary.\n%% Forms\n% NewBookFile( fName, outputIsFile )\n%% Input\n\
  % fName (1,1) File name\n% outputIsFile (1,1) True if a file is created, otherwise\
  \ header is\n%                    printed to the command line.\n%% Output\n% None.\n\
  function NewBookFile( fName, outputIsFile )\nif ( nargin < 2)\n    outputIsFile\
  \ = false;\nend\nif ( nargin == 0 || isempty (fName))\n    fName = input ('Function\
  \ name: ','s');\nend\n% Check if the filename is valid and if such a function already\
  \ exists.\nif (~isvarname(fName))\n    error ('Book:error','invalid name');\nend\n\
  if (outputIsFile && exist (fName,'file'))\n    error ('Book:error','file %s already\
  \ exists',fName);\nend\n% Get a one-line description (H1 line) from the user.\n\
  comment = input ('One-line description: ','s');\n% Open the file or specify command\
  \ line output.\nif (outputIsFile)\n    fid = fopen ([fName '.m'],'wt');\n    c =\
  \ onCleanup(@() fclose (fid));\nelse\n    fid = 1;\n    fprintf (fid,'\\n');\nend\n\
  % Write the header to the file. Use the current year for the copyright\n% notice.\n\
  fprintf (fid,'%%%% %s %s\\n', upper (fName),comment);\nfprintf (fid,'%% Description.\\\
  n');\nfprintf (fid,'%%%% Forms\\n');\nfprintf (fid,'%%   y = %s( x )\\n',fName);\n\
  fprintf (fid,'%%%% Input\\n');\nfprintf (fid,'%%   x   (1,1)    Description\\n%%\\\
  n');\nfprintf (fid,'%%%% Output\\n');\nfprintf (fid,'%%   y   (1,1)    Description\\\
  n%%\\n');\nfprintf (fid,'%%%% Reference\\n');\nfprintf (fid,'%% Insert the reference.\\\
  n');\nfprintf (fid,'%%%% See also\\n');\nfprintf (fid,'%% List pertinent functions.\\\
  n\\n');\ntoday = strsplit(date,'-');\nyear = today{ end };\nfprintf (fid,'%%%% Copyright\\\
  n');\nfprintf (fid,'%% Copyright (c) %s Princeton Satellite Systems, Inc.\\n%% All\
  \ rights reserved.\\n',year);\nfprintf (fid,'\\nfunction y = %s(x)\\n',fName);\n\
  if outputIsFile\n    edit (fName);\nend\n```\n\n请注意，此函数检查两种错误：函数名称无效和路径中已存在同名函数。你使用\
  \ `error` 的双输入形式，其中第一个输入是消息标识符。如果从 `catch` 块返回错误，则消息标识符非常有用。可以使用 `lasterr` 验证消息标识符。例如，如果你在提示时未能输入有效的函数名称，你可以看到第一个错误的结果。\n\
  \n```\n>> NewBookFile([])\nFunction name:\nError using NewBookFile (line 29)\ninvalid\
  \ name\n>> [LASTMSG, LASTID] = lasterr\nLASTMSG =\nError using NewBookFile (line\
  \ 29)\ninvalid name\nLASTID =\nBook:error\n```\n\n\n\n该函数能够将页眉打印至命令窗口，而非生成文件。这一功能在测试时尤为有用，或者当你已从空白文件开始操作，事后需要添加页眉时也同样适用。通过将文件标识符设为`1`即可实现此功能。页眉的样式如下：\n\
  \n```\n>> NewBookFile('Test')\nOne-line description: This is a test function.\n\
  %% TEST This is a test function.\n% Description.\n%% Forms\n% y = Test( x )\n%%\
  \ Input\n% x (1,1) Description\n%\n%% Output\n% y (1,1) Description\n%\n%% Reference\n\
  % Insert the reference.\n%% See also\n% List pertinent functions.\n%% Copyright\n\
  % Copyright (c) 2015 Princeton Satellite Systems, Inc.\n% All rights reserved.\n\
  function y = Test(x)\n```\n\n表 1-11 汇总了用于交互文本文件的一些关键函数。\n\n**表 1-11.** 交互文本文件的关键函数\n\
  \n| 函数 | 用途 |\n| --- | --- |\n| `fprintf` | 将格式化文本打印至文件 |\n| `strsplit` | 使用分隔符将字符串拆分为标记\
  \ |\n| `fgetl` | 获取文件中的一行（直至遇到换行符） |\n| `input` | 通过命令行从用户处获取字符串输入 |\n\n**摘要**\n\
  \n本章回顾了 MATLAB 编程的基本语法。在语言入门部分，它重点介绍了 MATLAB 与 C、C++ 等类似语言之间的差异。各小节提供了高效使用关键特性（包括写入二进制文件和文本文件）的技巧。每节末尾的表格列出了您应熟练掌握的关键函数。\n\
  \n本章未涉及使用 MATLAB 计算工具（如积分和数值搜索）的相关信息，这些内容将在应用章节中介绍。与 MATLAB 图形交互的内容也将在后续章节中说明。\n\
  \n"
- '# 2. MATLAB 风格


  电子补充材料：本章的在线版本（doi: [10.1007/978-1-4842-0559-4_2](http://dx.doi.org/10.1007/978-1-4842-0559-4_2)）包含仅供授权用户使用的补充材料。


  本章提供了关于建议风格元素的指南和技巧，旨在使您的代码和工具更易于理解和使用。


  在构建函数时，我们有具体的指导原则。注释应清晰且具有描述性，并遵循您所在机构设定的格式指南。命名约定也应如此。此外，我们建议提供“内置”输入和输出；即示例参数，使得函数无需用户输入即可完整执行。这些额外的演示形式应与您为函数创建的不同语法一起列出。


  对代码进行文档化处理不仅仅是在代码中添加页眉和一些注释。MATLAB 现在允许您将 HTML 帮助集成到工具箱中，该帮助会与 MATLAB 文档一起在浏览器中显示。您还可以使用发布工具来创建综合性的技术报告。从一开始就将这些特性纳入您的风格指南中，将为您在日后向他人发布工具箱时节省大量工作。


  ## 2.1 制定您自己的 MATLAB 风格指南


  ### 问题


  您团队中的每位工程师都偏好各自喜爱的命名和空白样式。当大家协作处理彼此代码时，最终会形成一种混杂的风格，导致代码更难阅读。


  ### 解决方案


  制定并发布您自己的风格指南。MATLAB 可以在首选项设置中帮助强制执行某些指南，例如制表符大小。




  ### 工作原理


  我们推荐经典书籍 *《MATLAB 风格要素》*（Richard K. Johnson 著，剑桥大学出版社，2010 年）作为制定个人风格指南的起点。其中许多建议适用于跨编程语言的通用良好编码实践，另一些则针对
  MATLAB 特有内容，例如在注释中使用发布标记语法。该书涵盖了格式化、命名、文档和编程等方面。


  我们在某些方面与书中的建议略有不同。例如，我们更倾向于将函数名首字母大写。这样做能在脚本中区分自定义函数与 MATLAB 内置函数。我们还倾向于对结构体使用单字母变量，而非冗长的驼峰式名称。然而，编写清晰
  MATLAB 代码的关键——该书也强调了这一点——在于将 MATLAB 代码视为编译型代码来对待。要注意变量类型，即使 MATLAB 未明确要求也要使用括号，并编写充足的注释。


  例如，当变量值为双精度浮点数时，通过添加小数点来表明这一点可避免混淆该参数可能为整数。


  将


  `length = 1;`


  替换为


  `length = 1.0;`


  在 `if` 语句中，始终使用括号。若将来计划将代码移植到其他语言，这能节省时间，并且能使代码对掌握多种语言的程序员而言更清晰易读。


  将


  `if thisIsTrue && thatIsTrue`


  替换为


  `if (thisIsTrue && thatIsTrue)`


  应始终避免在代码中使用“魔法数字”——这些数字在快速编写函数测试概念时很容易被使用。它们是指直接键入到逻辑语句等处的数值，而非赋值给变量。应花时间定义一个命名得当的变量，并添加注释说明该数字的来源。


  将


  `if (value > 2.0 || value < 0.0)`


  替换为


  `if (value > minValue || value < maxValue)`


  随着彩色编码集成开发环境（如 MATLAB 编辑器）的出现，在风格指南中通过大量空白来划分代码段的做法已不再流行。通常，代码块之间留一行空行即可。我们建议在函数结束与子函数开始之间额外添加一行空白。紧密相关的代码行之间不应添加空白。


  有些程序员喜欢让代码块在等号处对齐。这在某些情况下很有帮助，特别是编码来自参考文献的方程组时。然而，当代码处于活跃开发阶段时，维护这种对齐可能很繁琐。若喜欢此风格，建议等到函数通过内部代码审查并准备发布时，再添加对齐空格。在我们的代码中，通常只在注释或空白分隔的小型代码块内进行等号对齐。


  请考虑以下代码：


  ```

  % 初始化

  myVar1 = linspace(0,1);

  b = 1.0;


  % 计算

  [result1, result2] = MyFunction(myVar1,b);

  plotH = plot(myVar1,result2);

  ```


  这可以通过多种方式对齐，例如：


  ```

  % 初始化

  myVar1 = linspace(0,1);

  b    = 1.0;


  % 计算

  [result1, result2] = MyFunction(myVar1,b);

  plotH             = plot(myVar1,result2);

  ```


  或者，若跨块对齐，可写为：


  ```

  % 初始化

  myVar1            = linspace(0,1);

  b                 = 1.0;


  % 计算

  [result1, result2] = MyFunction(myVar1,b);

  plotH              = plot(myVar1,result2);

  ```


  在本书的代码中，您将看到前面那种按块对齐的风格。


  关于空白的另一个考虑是制表符大小。某些指南建议使用四个或八个空格的较大制表符，理由是 MATLAB 代码很少深度嵌套。我们经常编写大量深度嵌套的代码，因此内部指南是使用两个空格。在
  MATLAB 首选项中设置制表符大小，并设置为用空格代替制表符后，便可使用智能缩进功能轻松高亮并更新代码块。图 2-1 显示了 Mac 上 MATLAB R2014b
  的制表符首选项窗格。


  ![A335353_1_En_2_Fig1_HTML.jpg](img/A335353_1_En_2_Fig1_HTML.jpg)


  **图 2-1.** 大小为 2 且选中“使用空格”选项的制表符首选项


  我们倾向于对函数名使用大写字母（例如 `MyFunction`），特别是为了将它们与 MATLAB 内置函数的小写函数名区分开来。此外，我们对变量使用驼峰式命名（例如
  `myVariableName`）；对结构体常用单字母或极短的名称。对于索引变量，我们倾向于使用 `k`，以避免与虚数相关的变量 `i` 和 `j` 混淆。我们遵循常量名大写的标准惯例；例如，地球引力常数为
  `MU_EARTH`。


  换句话说，您需要为以下项制定命名规范：


  *   函数名

  *   变量名

  *   结构体名

  *   索引变量

  *   常量


  额外的命名规范可能包括对特定类型文件或变量使用标准前缀或后缀。例如，在提供积分动力学的函数名中使用字母“RHS”（方程右侧，当导数位于左侧时）；在演示特定函数或功能的脚本名中使用“Demo”一词很有帮助。变量名元素的顺序应保持一致。例如，如果
  `r` 表示半径，第二个元素是行星名称，则使用 `R_EARTH` 和 `R_MOON`，而不要将第二个变量命名为 `MOON_R`。在整个代码库中，顺序应保持一致。


  其他规则可能涉及布尔变量的名称或在函数名中使用动词。最重要的步骤是：为您的组织创建并记录一套命名约定，或创建一些函数模板，以便工程师编写出风格一致的代码。


  本书通篇使用了以下指南：


  *   **命名：** 命名指南。

  *   **函数名：** 函数名使用首字母大写的驼峰式。第一个单词最好为动作动词或“RHS”。

  *   **脚本名：** 若脚本是特定函数或函数集的演示，则在名称后追加“Demo”。

  *   **变量名：** 变量名使用首字母小写的驼峰式。

  *   **常量：** 使用大写字母标识常量。

  *   **变量名长度：** 大多数变量名应至少包含三个字符。例外情况包括常用的数据结构、索引变量，以及复制方程式中使用单字母变量名（该领域人员易于识别）的情况。

  *   **索引变量：** 使用单个索引变量时，用 `k`；使用两个索引变量时，用 `j` 和 `k`；更多变量时，用 `l`, `m`。

  *   **双精度浮点数：** 在写出双精度浮点数值时，始终使用小数点。

  *   **魔法数字：** 避免在代码中使用魔法数字；应优先使用变量来指定数字。

  *   **注释：** 对于代码中硬编码的数字，始终添加注释说明其来源或理由。

  *   **If 语句：** 始终在 IF 语句的条件部分使用括号。

  *   **制表符：** 使用两个空格的制表符大小，并将 MATLAB 设置为用空格代替制表符。在提交文件前，使用智能缩进确保制表符一致性。

  *   **空行：** 大多数代码段之间使用一个空行，子函数之间使用两个空行。

  *   **对齐：** 仅在代码块内部（按空行分隔的块）于等号处对齐代码。


  关于函数头的指南将在下一个技巧中介绍。


  ## 2.2 编写良好的函数帮助




  '
