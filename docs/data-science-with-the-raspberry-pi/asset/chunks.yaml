    Similarly, there are other read functions such as `read_excel`, `read_sql`, `read_html`,
    etc., to read files in other formats, and every one of these read functions comes
    with their corresponding write functions like `to_csv`, `to_excel`, `to_sql`,
    `to_html`, etc., that allows you to write the Pandas dataframe to different formats.


    Most of the real-time data gathered from sensors is in the form of time-series
    data, which is a series of data indexed in time order. Let’s consider a dataset
    that consists of the minimum daily temperatures in degrees Celsius over 10 years
    (1981 to 1990) in Melbourne, Australia. The source of the data is the Australian
    Bureau of Meteorology. Even though this is also a CSV file, it is time-series
    data unlike the `DataFrame` in the previous illustration. Listing [2-24](#496535_1_En_2_Chapter.xhtml#PC34)
    shows the different ways to explore the time-series data.


