    针对这九个时域特征的所有公式，其 Python 代码被编写成一个函数，该函数后续在主程序中被调用。这个函数接收大脑情绪活动峰值期间 15 秒的 EEG 信号及对应的时间样本，具体实现如下：


    ```

    def eegfeat(ynew,tnew):

    from scipy.stats import kurtosis

    # latency to amplitude ratio

    smax=max(ynew)

    locmax=np.where(ynew==smax)

    tsmax=tnew[locmax]

    lar1=tsmax/smax

    lar=lar1[0]

    # peak to peak signal value

    smin=min(ynew)

    locmin=np.where(ynew==smax)

    tsmin=tnew[locmin]

    spp=smax-smin

    # peak to peak time window.

    tpp1=tsmax+tsmin

    tpp=tpp1[0]

    # peak to peak slope

    spps=spp/tpp

    # mean value of signal

    m=np.mean(ynew)

    # kurtosis

    k=kurtosis(ynew)

    # mobility and complexity

    n=ynew.shape[0]

    dynew=np.diff(ynew)

    ddynew=np.diff(dynew)

    mx2=np.mean(np.power(ynew,2))

    mdx2=np.mean(np.power(dynew,2))

    mddx2=np.mean(np.power(ddynew,2))

    mob=mdx2/mx2

    complexity=np.sqrt(mddx2/(mdx2-mob))

    mobility=np.sqrt(mob)

    # signal power

    tt=np.power(ynew,2)

    s=0

    for i in np.arange(0,tt.shape[0]):

    s=s+tt[i]

    signalpower=s/ynew.shape[0]

    feat = [lar, spp, tpp, spps, m, k, complexity, mobility, signalpower]

    return feat

    ```


    ## 非结构化数据到结构化数据集


    现在我们有了从 EEG 信号中提取特征的函数，下一步是开发代码以获取结构化数据集。首先，使用`for`循环内的`pd.read_csv`函数，逐一加载所有
    15 名参与者对应三种不同情绪的 EEG 信号。在 EEG 信号作为数据框加载后，首先移除时间戳，然后将剩余列中的幅值转换为 NumPy 数组。每次迭代得到的数组被堆叠到一个新变量中，从而得到一个由
    45 列组成的最终数组，对应 45 个不同的 EEG 信号。然后，将该数组的每一列传递给之前创建的`eegfeat`函数，该函数为每一列（每个信号）提供九个特征，从而得到一个大小为
    9×45 的最终特征数组。该数据集如表 9-1 所示，并保存为 Excel 表格中的`emotion_data1.xls`。最后，使用`sklearns`模块中的`StandardScaler`和`fit`函数对特征进行缩放。这种缩放的工作原理是：首先计算所有
    45 个信号中每个特征的均值和标准差，然后从所有值中减去均值，并将此差值除以标准差。以下代码说明了特征提取过程：


