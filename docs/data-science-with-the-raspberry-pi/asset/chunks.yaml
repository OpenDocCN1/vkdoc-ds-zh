- fmt: "### Data Transmission Between an Arduino and the Raspberry Pi\n\nWhen connecting\
    \ the Arduino to the Raspberry Pi via a USB cable, run the command `ls /dev/tty*`\
    \ in the Raspberry Pi terminal window to find the name of the Arduino device.\
    \ It should return something like `/dev/ttyACM0` or `/dev/ttyUSB0`.\n\nThe `pySerial`\
    \ Python library is used to make a serial interface with Python and encapsulates\
    \ the access for the serial port.\n\nThe following code can be used to make bidirectional\
    \ communication between the Arduino and the Raspberry Pi.\n\n#### Arduino Code\n\
    \nHere is the Arduino code:\n\n```cpp\nvoid setup() {\n  Serial.begin(9600);\n\
    }\n\nvoid loop() {\n  if (Serial.available() > 0) {\n    String data = Serial.readStringUntil('\\\
    n');\n    Serial.print(\"Received Data: \");\n    Serial.println(data);\n  }\n\
    }\n```\n\n`Serial.available()` will give you the number of bytes that have already\
    \ arrived and are stored in the receive buffer. This can be used to check if the\
    \ Arduino has received data.\n\nIf some data has arrived, `Serial.readStringUntil()`\
    \ is used with the newline character `\\n` to get the next line. All the bytes\
    \ received until the newline character `\\n` are automatically converted and added\
    \ in an Arduino `String` object.\n\nThen, we just return the string containing\
    \ the received data with some additional text.\n\n#### Raspberry Pi Python Code\n\
    \nHere is the Raspberry Pi Python code to display the serial data:\n\n```python\n\
    #!/usr/bin/env python3\nimport serial\nimport time\n\nif __name__ == '__main__':\n\
    \    ser = serial.Serial('/dev/ttyACM0', 9600, timeout=1)\n    ser.flush()\n \
    \   while True:\n        ser.write(b\"Data from Raspberry Pi!\\n\")\n        line\
    \ = ser.readline().decode('utf-8').rstrip()\n        print(line)\n        time.sleep(1)\n\
    ```\n\nThe `pySerial` function `write()` is used to send data to the Arduino.\
    \ Before sending the string, it will encode from string to bytes, as you can only\
    \ send bytes through `Serial`. Any data that is not a byte or byte array must\
    \ be converted before being sent through `Serial`.\n\nAlso, we add a newline character\
    \ `\\n` as the Arduino expects it at the end of the string while it’s reading\
    \ with `Serial.readStringUntil('\\n')`.\n\nThen we read a line from `Serial`,\
    \ decode it into a string, and finally print the received string and wait for\
    \ one second before sending the next string over `Serial`.\n\n## Time-Series Data\n\
    \nA *time series* is a series of data points indexed in time order. Most commonly,\
    \ it is a sequence taken at successive equally spaced points in time. Thus, a\
    \ time series can be defined as a sequence of discrete-time data. In time-series\
    \ data, time is often the independent variable, and the goal is generally to make\
    \ a forecast for the future.\n\nTime series are frequently plotted via line charts.\
    \ Time series are used in statistics, signal processing, communications engineering,\
    \ pattern recognition, weather forecasting, earthquake prediction, control engineering,\
    \ astronomy, etc.\n\n### Time-Series Analysis and Forecasting\n\n*Time-series\
    \ analysis* comprises methods for analyzing time-series data to extract meaningful\
    \ statistics and other characteristics of the data. The time-series analysis also\
    \ includes forecasting the series for the future, extracting hidden signals in\
    \ noisy data, discovering the data generation mechanism, etc. *Time-series forecasting*\
    \ is the use of a model to predict future values based on historical data.\n\n\
    ## Memory Requirements\n\nThis section talks about the memory requirements.\n\n\
    ### More Storage\n\nSometimes the memory from the microSD card might not be sufficient,\
    \ and more memory might be needed. More storage space can be highly beneficial\
    \ to store the collected data and heavy models. To increase the storage capacity,\
    \ external hard disk drives can be connected to the Raspberry Pi.\n\n### More\
    \ RAM\n\nRAM is another important factor for data science projects. The larger\
    \ the RAM, the higher the amount of data it can handle, which results in faster\
    \ processing. Although the base variant of 1GB RAM can do the job, the 4GB RAM\
    \ version of the Raspberry Pi is recommended for most deep learning tasks.\n\n\
    ## Case Study: Gathering the Real-Time Industry Data\n\nLet’s look at a case study.\n\
    \n### Storing Collected Data Using Pandas\n\nThe collected data can also be saved\
    \ for later use. Pandas is an open source data analysis and manipulation tool\
    \ built in Python. We will use Pandas to convert the collected data into a structured\
    \ data format. The Pandas library can be installed via `pip` using the following\
    \ command:\n\n```\npip install pandas\n```\n\n### Dataframes\n\nA *dataframe*\
    \ is a two-dimensional data structure. Data is aligned in a tabular fashion in\
    \ rows and columns, and it is generally the most commonly used Pandas object.\
    \ Once we convert our data into dataframes, we can easily manipulate and export\
    \ the data to other formats such as CSV and Microsoft Excel.\n\n### Saving Data\
    \ as a CSV File\n\nA comma-separated values file is a delimited text file that\
    \ uses a comma to separate values. Each line of the file is a data record. Each\
    \ record consists of one or more fields, separated by commas. A Pandas dataframe’s\
    \ `to_csv()` function exports the dataframe to CSV format.\n\n```python\ndf.to_csv('file\
    \ path\\File Name.csv')\n```\n\n### Saving as an Excel File\n\nTo write a single\
    \ object to an Excel `.xlsx` file, it is only necessary to specify a target filename.\
    \ To write multiple sheets, it is necessary to create an `ExcelWriter` object\
    \ with a target filename and specify a sheet in the file to write to. The Pandas\
    \ dataframe’s `to_excel()` function exports the dataframe to `.xlsx` format.\n\
    \n```python\ndf.to_excel(\"output.xlsx\")\n```\n\n### Reading Saved Data Files\n\
    \nOnce the data is saved, it can be read using the `read_csv()` or `read_excel()`\
    \ function. The `read_excel()` function reads an Excel file into a Pandas dataframe,\
    \ and it supports the `.xls`, `.xlsx`, `.xlsm`, `.xlsb`, and `.odf` file extensions\
    \ read from a local filesystem or URL. It has an option to read a single sheet\
    \ or a list of sheets. The `read_csv()` function reads a CSV file into a dataframe\
    \ and also supports optionally iterating or breaking of the file into chunks.\n\
    \n### Adding the Date and Time to the Real-Time Data\n\nWhile collecting the data,\
    \ we can also add the data and time to the data. We will use the `datetime` Python\
    \ library. `datetime.datetime.now()` can be used to get the current date and time.\n\
    \n```python\nfrom datetime import datetime\nnow = datetime.now()\nprint(\"now\
    \ =\", now)\n# dd/mm/YY H:M:S\ndt_string = now.strftime(\"%d/%m/%Y %H:%M:%S\"\
    )\nprint(\"date and time =\", dt_string)\n```\n\n### Industry Data from the Temperature\
    \ and Humidity Sensor\n\nWe will use the temperature and humidity sensor to measure\
    \ the temperature and humidity. Connect the DHT 11/22 sensor module to the Raspberry\
    \ Pi as shown in Chapter [3](#496535_1_En_3_Chapter.xhtml).\n\nThe following code\
    \ collects the temperature and humidity values for 100 seconds and stores the\
    \ collected data as a CSV file:\n\n```python\nimport Adafruit_DHT\nimport time\n\
    from datetime import datetime\n\nDHT_SENSOR = Adafruit_DHT.DHT11\nDHT_PIN = 17\n\
    \ndata = []\nwhile _ in range(100):\n    humidity, temperature = Adafruit_DHT.read(DHT_SENSOR,\
    \ DHT_PIN)\n    if humidity is not None and temperature is not None:\n       \
    \ now = datetime.now()\n        dt_string = now.strftime(\"%d/%m/%Y %H:%M:%S\"\
    )\n        data.append(dt_string, humidity, temperature)\n    time.sleep(60*5)\n\
    \ndf = pd.DataFrame(data)\ndf.to_csv('data.csv',index=None,header=None)\n```\n\
    \nThe CSV file will look as follows:\n\n| 17/05/2020 01:05:14 | 26.24 | 69.91\
    \ |\n|----------------------|-------|-------|\n| 17/05/2020 01:10:14 | 26.24 |\
    \ 70.65 |\n| 17/05/2020 01:15:14 | 26.22 | 68.87 |\n| 17/05/2020 01:20:14 | 26.15\
    \ | 70.11 |\n| 17/05/2020 01:25:14 | 26.11 | 69.02 |\n\n# 5. Preparing the Data\n\
    \nThe most important step in data science is to prepare the data. Data preparation\
    \ is the process of cleaning, processing, and transforming the raw data for analysis.\
    \ From this stage, the errors in the data can be effectively handled by cleaning,\
    \ identifying the missing values, handling outliers, etc. Hence, this chapter\
    \ discusses the methodologies used to prepare the data using the Pandas package\
    \ in Python."
  raw: '### Data Transmission Between an Arduino and the Raspberry Pi


    When connecting the Arduino to the Raspberry Pi via a USB cable, run the command
    `ls /dev/tty*` in the Raspberry Pi terminal window to find the name of the Arduino
    device. It should return something like `/dev/ttyACM0` or `/dev/ttyUSB0`.


    The `pySerial` Python library is used to make a serial interface with Python and
    encapsulates the access for the serial port.


    The following code can be used to make bidirectional communication between the
    Arduino and the Raspberry Pi.


    #### Arduino Code


    Here is the Arduino code:


    ```

    void setup() {

    Serial.begin(9600);

    }

    void loop() {

    if (Serial.available() > 0) {

    String data = Serial.readStringUntil(''\n'');

    Serial.print("Received Data: ");

    Serial.println(data);

    }

    }

    ```


    `Serial.available()` will give you the number of bytes that have already arrived
    and are stored in the receive buffer. This can be used to check if the Arduino
    has received data.


    If some data has arrived, `Serial.readStringUntil()` is used with the newline
    character `\n` to get the next line. All the bytes received until the newline
    character `\n` are automatically converted and added in an Arduino `String` object.


    Then, we just return the string containing the received data with some additional
    text.


    #### Raspberry Pi Python Code


    Here is the Raspberry Pi Python code to display the serial data:


    ```

    #!/usr/bin/env python3

    import serial

    import time

    if __name__ == ''__main__'':

    ser = serial.Serial(''/dev/ttyACM0'', 9600, timeout=1)

    ser.flush()

    while True:

    ser.write(b"Data from Raspberry Pi!\n")

    line = ser.readline().decode(''utf-8'').rstrip()

    print(line)

    time.sleep(1)

    ```


    The `pySerial` function `write()` is used to send data to the Arduino. Before
    sending the string, It will encode from string to bytes, as you can only send
    bytes through `Serial`. Any data that is not a byte or byte array must be converted
    before being sent through `Serial`.


    Also, we add a newline character `\n` as the Arduino expects it at the end of
    the string while it’s reading with `Serial.readStringUntil(''\n'')`.


    Then we read a line from `Serial`, decode it into a string, and finally print
    the received string and wait for one second before sending the next string over
    `Serial`.


    ## Time-Series Data


    A *time series* is a series of data points indexed in time order. Most commonly,
    it is a sequence taken at successive equally spaced points in time. Thus, a time
    series can be defined as a sequence of discrete-time data. In time-series data,
    time is often the independent variable, and the goal is generally to make a forecast
    for the future.


    Time series are frequently plotted via line charts. Time series are used in statistics,
    signal processing, communications engineering, pattern recognition, weather forecasting,
    earthquake prediction, control engineering, astronomy, etc.


    ### Time-Series Analysis and Forecasting


    *Time-series analysis* comprises methods for analyzing time-series data to extract
    meaningful statistics and other characteristics of the data. The time-series analysis
    also includes forecasting the series for the future, extracting hidden signals
    in noisy data, discovering the data generation mechanism, etc. *Time-series forecasting*
    is the use of a model to predict future values based on historical data.


    ## Memory Requirements


    This section talks about the memory requirements.


    ### More Storage


    Sometimes the memory from the microSD card might not be sufficient, and more memory
    might be needed. More storage space can be highly beneficial to store the collected
    data and heavy models. To increase the storage capacity, external hard disk drives
    can be connected to the Raspberry Pi.


    ### More RAM


    RAM is another important factor for data science projects. The larger the RAM,
    the higher the amount of data it can handle, which results in faster processing.
    Although the base variant of 1GB RAM can do the job, the 4GB RAM version of the
    Raspberry Pi is recommended for most deep learning tasks.


    ## Case Study: Gathering the Real-Time Industry Data


    Let’s look at a case study.


    ### Storing Collected Data Using Pandas


    The collected data can also be saved for later use. Pandas is an open source data
    analysis and manipulation tool built in Python. We will use Pandas to convert
    the collected data into a structured data format. The Pandas library can be installed
    via `pip` using the following command:


    ```

    pip install pandas

    ```


    ### Dataframes


    A *dataframe* is a two-dimensional data structure. Data is aligned in a tabular
    fashion in rows and columns, and it is generally the most commonly used Pandas
    object. Once we convert our data into dataframes, we can easily manipulate and
    export the data to other formats such as CSV and Microsoft Excel.


    ### Saving Data as a CSV File


    A comma-separated values file is a delimited text file that uses a comma to separate
    values. Each line of the file is a data record. Each record consists of one or
    more fields, separated by commas. A Pandas dataframe’s `to_csv()` function exports
    the dataframe to CSV format.


    ```

    df.to_csv(''file path\File Name.csv'')

    ```


    ### Saving as an Excel File


    To write a single object to an Excel `.xlsx` file , it is only necessary to specify
    a target filename. To write multiple sheets, it is necessary to create an `ExcelWriter`
    object with a target filename and specify a sheet in the file to write to. The
    Pandas dataframe’s `to_excel()` function exports the dataframe to `.xlsx` format.


    ```

    df.to_excel("output.xlsx")

    ```


    ### Reading Saved Data Files


    Once the data is saved, it can be read using the `read_csv()` or `read_excel()`
    function. The `read_excel()` function reads an Excel file into a Pandas dataframe,
    and it supports the `.xls`, `.xlsx`, `.xlsm`, `.xlsb`, and `.odf` file extensions
    read from a local filesystem or URL. It has an option to read a single sheet or
    a list of sheets. The `read_csv()` function reads a CSV file into a dataframe
    and also supports optionally iterating or breaking of the file into chunks.


    ### Adding the Date and Time to the Real-Time Data


    While collecting the data, we can also add the data and time to the data. We will
    use the `datetime` Python library. `datetime.datetime.now()` can be used to get
    the current date and time.


    ```

    from datetime import datetime

    now = datetime.now()

    print("now =", now)

    # dd/mm/YY H:M:S

    dt_string = now.strftime("%d/%m/%Y %H:%M:%S")

    print("date and time =", dt_string)

    ```


    ### Industry Data from the Temperature and Humidity Sensor


    We will use the temperature and humidity sensor to measure the temperature and
    humidity. Connect the DHT 11/22 sensor module to the Raspberry Pi as shown in
    Chapter [3](#496535_1_En_3_Chapter.xhtml).


    The following code collects the temperature and humidity values for 100 seconds
    and stores the collected data as a CSV file:


    ```

    import Adafruit_DHT

    import time

    from datetime import datetime

    DHT_SENSOR = Adafruit_DHT.DHT11

    DHT_PIN = 17

    data = []

    while _ in range(100):

    humidity, temperature = Adafruit_DHT.read(DHT_SENSOR, DHT_PIN)

    if humidity is not None and temperature is not None:

    now = datetime.now()

    dt_string = now.strftime("%d/%m/%Y %H:%M:%S")

    data.append(dt_string,humidity,temperature)

    time.sleep(60*5)

    df = pd.DataFrame(data)

    df.to_csv(''data.csv'',index=None,header=None)

    ```


    The CSV file will look as follows:


    | 17/05/2020 01:05:14 | 26.24 | 69.91 |

    | 17/05/2020 01:10:14 | 26.24 | 70.65 |

    | 17/05/2020 01:15:14 | 26.22 | 68.87 |

    | 17/05/2020 01:20:14 | 26.15 | 70.11 |

    | 17/05/2020 01:25:14 | 26.11 | 69.02 |


    # 5. Preparing the Data


    The most important step in data science is to prepare the data. Data preparation
    is the process of cleaning, processing, and transforming the raw data for analysis.
    From this stage, the errors in the data can be effectively handled by cleaning,
    identifying the missing values, handling outliers, etc. Hence, this chapter discusses
    the methodologies used to prepare the data using the Pandas package in Python.'
