    ### 直方图

    直方图通过将变量中的数据划分为不同的区间（称为*箱*）来绘制图形；然后统计每个箱内的数据点数量，并将其绘制为垂直条柱。这类图表能够很好地展示数值数据的近似分布。箱的宽度（即每个箱中数值的范围）是一个重要参数，需要通过尝试不同的值来选取最适合数据的宽度。


    为了演示直方图，我们考虑 Scikit-Learn 库中提供的加利福尼亚房价数据集。该数据集源于 1990 年美国人口普查，每行对应一个普查街区组。街区组是美国人口普查局发布样本数据的最小地理单位（一个街区组通常有
    600 到 3000 人）。该数据集包含 8 个参数，如街区收入中位数、街区房龄中位数、平均房间数等，以及一个目标属性——加利福尼亚各地区的房价中位数。数据中总共有
    20,640 个数据点（行）。以下代码绘制了一个直方图，展示了基于街区内房龄中位数的街区分布情况。图 6-4 显示了该直方图。数值较低通常意味着建筑物较新。


    ![../images/496535_1_En_6_Chapter/496535_1_En_6_Fig4_HTML.jpg](img/496535_1_En_6_Fig4_HTML.jpg)


    **图 6-4** – 基于街区房龄中位数的街区分布图


    ```

    import matplotlib.pyplot as plt

    from sklearn.datasets import fetch_california_housing

    import pandas as pd

    dataset = fetch_california_housing()

    df=pd.DataFrame(dataset.data,columns=dataset.feature_names)

    print(df.head())

    Output:

    MedInc  HouseAge    AveRooms  ...  AveOccup  Latitude  Longitude

    0    8.3252      41.0    6.984127  ...  2.555556     37.88    -122.23

    1    8.3014      21.0    6.238137  ...  2.109842     37.86    -122.22

    2    7.2574      52.0    8.288136  ...  2.802260     37.85    -122.24

    3    5.6431      52.0    5.817352  ...  2.547945     37.85    -122.25

