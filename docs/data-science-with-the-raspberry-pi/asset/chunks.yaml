    ### 正态分布


    正态分布，也称为高斯分布，通常呈钟形曲线，以均值为中心，此处概率最大，且随着我们远离均值，概率会逐渐减小。这意味着接近均值的值出现频率更高，而远离均值的值出现频率更低。该分布依赖于两个参数：数据的均值（μ）和标准差（σ）。正态分布的概率密度函数（`pdf`）可以表示如下：


    ![$$ f\left(x;\mu, \sigma \right)=\frac{1}{\sqrt{2{\pi \sigma}²}}\;{e}^{-\frac{{\left(x-\mu
    \right)}²}{2{\sigma}²}} $$](img/496535_1_En_7_Chapter_TeX_Equa.png)


    为了说明`pdf`函数，请考虑以下代码。创建了一个包含 100 个值、范围在-10 到 10 之间的数组`x`，并使用`scipy`包的`stats`模块中的`norm.pdf`函数计算了`x`的`pdf`函数。通过`for`循环，针对四个不同的均值（0、2.5、5
    和 7.5）计算了`pdf`函数。如果未提供均值，`norm.pdf`函数会取默认值零。


    ```

    from scipy.stats import norm

    import matplotlib.pyplot as plt

    import numpy as np

    mean=[0.0,2.5,5,7.5] # 正态分布的均值

    x=np.linspace(-10,10,100) # 在-10 到 10 范围内包含 100 个数字的数组

    for m in mean:

    y=norm.pdf(x,loc=m)

    plt.plot(x,y,label=''mean= %.1f'' %m)

    plt.xlabel(''x'')

    plt.ylabel(''pdf(x)'')

    plt.legend(frameon=True)

    plt.show()

    ```


    图 7-3 展示了正态分布会生成一条以均值为中心的钟形曲线。也就是说，曲线在均值点处达到最大值，并且随着我们从均值向两侧移动，曲线开始下降。请注意，我们尚未指定标准差的值。在这种情况下，`norm.pdf`函数会采用默认值
    1。


    ![../images/496535_1_En_7_Chapter/496535_1_En_7_Fig3_HTML.jpg](img/496535_1_En_7_Fig3_HTML.jpg)


    图 7-3


    不同均值下的正态分布图


    类似地，让我们保持均值不变，使用以下代码绘制不同标准差下的分布图：


    ```

    from scipy.stats import norm

    import matplotlib.pyplot as plt

    import numpy as np

    stdev=[1.0,2.0,3.0,4.0] # 正态分布的标准差值

    x=np.linspace(-10,10,100)

    for s in stdev:

    y=norm.pdf(x,scale=s)

    plt.plot(x,y,label=''stdev= %.1f'' %s)

    plt.xlabel(''x'')

    plt.ylabel(''pdf(x)'')

    plt.legend(frameon=True)

    plt.show()

    ```


    从图 7-4 中，我们可以看到所有四条曲线都以默认均值零为中心。随着标准差σ值的增加，密度分布在一个更广的范围内。换句话说，随着标准差值增加，数据分布更加分散于均值周围，并且有更高的可能性出现更多远离均值的观测值。


    ![../images/496535_1_En_7_Chapter/496535_1_En_7_Fig4_HTML.jpg](img/496535_1_En_7_Fig4_HTML.jpg)


    图 7-4


    不同标准差下的正态分布图


    正态分布的一个使其对数据科学家而言成为重要统计分布的重要性质是*经验法则*。根据该法则，如果我们在 x 轴上将观测范围按标准差划分，那么大约 68.3%的值落在距均值一个标准差的范围内，95.5%的值落在两个标准差的范围内，99.7%的值落在三个标准差的范围内。如果数据符合正态分布，这个经验法则可用于识别数据中的异常值。我们在前面第
    5 章讨论过的用于异常检测的 Z 分数就应用了这一原理。


    ## 波士顿房价数据集的统计分析


    我们以波士顿房价数据集为例，尝试根据特征的统计属性，识别出可用于建模的最佳特征。正如我们已经讨论过的，波士顿数据集包含 506 个案例（506 × 13）的
    13 个不同特征。除了这些特征外，用变量`MEDV`表示的业主自住房中位数价值（以千计）被确定为预测目标。也就是说，给定 13 个不同的特征，需要估算房屋的中位数价值。首先使用
    Pandas 包将数据集中的特征转换为一个 DataFrame。然后将目标变量添加到此 DataFrame 的最后一列，使其维度变为 506 × 14。以下代码对此进行了说明：


    ```

    import matplotlib.pyplot as plt

    import numpy as np

    import pandas as pd

    from sklearn.datasets import load_boston

    import matplotlib.pyplot as plt

    dataset = load_boston()

    boston_data=pd.DataFrame(dataset.data,columns=dataset.feature_names)

    boston_data[''MEDV''] = dataset[''target'']

    print(boston_data.head())

    CRIM     ZN    INDUS  CHAS  NOX   ...  TAX    PTRATIO  B    LSTAT  MEDV

    0  0.00632  18.0  2.31   0.0  0.538  ...  296.0  15.3  396.90  4.98   24.0

    1  0.02731  0.0   7.07   0.0  0.469  ...  242.0  17.8  396.90  9.14   21.6

