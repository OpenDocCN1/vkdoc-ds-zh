- fmt: '# Pandas and Data Structures


    Pandas is a software library written for the Python programming language that
    is used mainly for data manipulation and analysis.


    In a nutshell, Pandas is like Excel for Python, with tables (which in Pandas are
    called *dataframes*) made of rows and columns (which in Pandas are called *series*).
    Pandas has many functionalities that make it an awesome library for data processing,
    inspection, and manipulation.


    ## Installing and Using Pandas


    Installing Pandas on your system requires NumPy to be installed, and if building
    the library from source, it requires the appropriate tools to compile the C and
    Cython sources on which Pandas is built.


    You can find details about this installation in the Pandas documentation. Pandas
    can be installed using `pip` function as: `pip install pandas`. Once Pandas is
    installed, you can import it and check the version, as shown here:


    ```

    import pandas

    pandas.__version__

    ```


    Just as we generally import NumPy under the alias `np`, we will import Pandas
    under the alias `pd`, and this import convention will be used throughout the remainder
    of this book.


    ```

    import pandas as pd

    ```


    ## Pandas Data Structures


    A data structure is a data organization, management, and storage format that enables
    efficient access and modification. More precisely, a data structure is a collection
    of data values, the relationships among them, and the functions or operations
    that can be applied to the data. Pandas introduces two new data structures to
    Python, `Series` and `DataFrame`, both of which are built on top of NumPy (which
    means they are fast).


    ## Series


    A *series* is a one-dimensional object similar to an array, list, or column in
    a table. It will assign a labeled index to each item in the series. By default,
    each item will receive an index label from 0 to N, where N is the length of the
    series minus 1, as illustrated here:


    ```

    s = pd.Series([1, ''Raspberry Pi'', 3.14, -500, ''Data''])

    print(s)

    Output:

    0          1

    1   Raspberry Pi

    2    3.14

    3    -500

    4    Data

    dtype: object

    ```


    Instead of providing the default index, we can specify an index to be used for
    each entry while creating the series, as illustrated here:


    ```

    s = pd.Series([1, ''Raspberry Pi'', 3.14, -500, ''Data''],

    index=[''M'', ''A'', ''X'', ''I'', ''E''])

    print(s)

    Output:

    M          1

    A   Raspberry Pi

    X    3.14

    I    -500

    E    Data

    dtype: object

    ```


    The `Series` constructor can convert a dictionary into a series as well, using
    the keys of the dictionary as its index, as illustrated here:


    ```

    d = {''English'': 95, ''Math'': 100, ''Science'': 98, ''Social Science'': 93}

    marks = pd.Series(d)

    print(marks)

    Output:

    English           95

    Math             100

    Science           98

    Social Science    93

    dtype: float64

    ```


    The index can be used to select specific items from the series. For instance,
    the marks for math can be selected by specifying the index `Math`. Similarly,
    a group of items can be printed by providing their corresponding indices separated
    by commas in a list, as illustrated here:


    ```

    print (marks[''Math''])

    print(marks[[''English'', ''Science'', ''Social Science'']])

    Output :

    100.0

    English           95

    Science           98

    Social Science    93

    dtype: float64

    ```


    Boolean indexing for filtering values can also be used. For example, using the
    index `marks < 96` returns a series of Boolean values, which we then pass to our
    series `marks`, returning the corresponding `True` items, as illustrated here:


    ```

    marks[marks < 96]

    Output:

    Math             100

    Science           98

    dtype: float64

    ```


    The value of a particular item in the series can be changed on the go by accessing
    the corresponding index of the item, as illustrated here:


    ```

    print(''Old value:'', marks[''Math''])

    marks[''Math''] = 99

    print(''New value:'', marks[''Math''])

    Output:

    (''Old value:'', 100.0)

    (''New value:'', 99.0)

    ```


    We can also check whether an item exists in the series or not using the following
    code:


    ```

    print(''Math'' in marks)

    print(''French'' in marks)

    Output:

    True

    False

    ```


    Mathematical operations can also be done on a series of numerical values, as illustrated
    here:


    ```

    marks * 10

    Output:

    English           950

    Math              990

    Science           980

    Social Science    930

    dtype: float64

    np.square(marks)

    Output:

    English           9025

    Math              9801

    Science           9604

    Social Science    8649

    dtype: float64

    ```


    ## DataFrame


    The tabular `DataFrame` data structure is composed of rows and columns, similar
    to a spreadsheet or a database table. You can also think of a `DataFrame` as a
    group of `Series` objects that share an index (the column names).


    ### Reading Data


    To create a `DataFrame` data structure out of common Python data structures, we
    can pass a dictionary of lists to the `DataFrame` constructor.


    ```

    a={''Name'':[''Augustus'', ''Hazel'', ''Esther'', ''Cavas''],

    ''Gender'':[''Male'',''Female'',''Female'',''Male''],

    ''Age'':[19, 18, 22, 21]}

    b=pd.DataFrame.from_dict(a)

    print(b)

    Output:

    Name      Gender   Age

    0  Augustus    Male   19

    1     Hazel  Female   18

    2    Esther  Female   22

    3     Cavas    Male   21

    ```


    ### Reading CSV Data


    Reading a CSV file is as simple as calling the `read_csv` function. By default,
    the `read_csv` function expects the column separator to be a comma, but you can
    change that using the `sep` parameter. The following code shows the syntax to
    read a CSV file into a `DataFrame` `df` and print the first five rows of `df`
    using the `head()` function:


    ```

    df = pd.read_csv(''data.csv'')

    print(df.head())

    ```


    There’s also a set of writer functions for writing the `DataFrame` object to a
    variety of formats such as CSV files, HTML tables, JSON, etc. The following line
    of code shows the syntax to write a `DataFrame` object to a CSV file:


    ```

    df.to_csv(''path_to_file.csv'')

    ```


    ### Reading Excel Data


    Pandas allows us to read and write Excel files, so we can easily read from Excel,
    in Python, and then write the data back out to Excel. Reading Excel files requires
    the `xlrd` library, which can be installed using the `pip` command, as shown here:


    ```

    pip install xlrd.

    ```


    The following code illustrates the syntax used to read a sheet from an Excel file
    into a `DataFrame` `df`. Replace `data.xlsx` with the path/filename of your Excel
    file to run the code.


    ```

    df = pd.read_excel(''data.xlsx'', ''Sheet1'')

    print(df.head())

    ```


    Similarly, the data from a `DataFrame` object can be written to an Excel file,
    as shown here:


    ```

    dataframe.to_excel(''path_to_file.xlsx'', index=False)

    ```


    ### Reading URL Data


    The `read_table` function can be used to read directly from a URL. The following
    code illustrates a `DataFrame` created using raw data from a given URL:


    ```

    url = ''https://raw.github.com/gjreda/best-sandwiches/master/data/best-sandwiches-geocode.tsv''

    from_url = pd.read_table(url, sep=''\t'')

    from_url.head(3)

    Output:

    rank         sandwich  ...   lat        lng

    0     1                 BLT  ...   41.895734  -87.679960

    1     2       Fried Bologna  ...   41.884672  -87.647754

    2     3   Woodland Mushroom  ...   41.890602  -87.630925

    ```


    ### Cleaning the Data


    In most of the data analytics projects, the available data is not always perfect.
    The raw data always tends to be messy with corrupt or inaccurate data in addition
    to the useful data. It is therefore essential for the data scientists to treat
    these messy data samples so as to convert the raw data to a form which can work,
    and they spend a considerably long time doing so.


    Data cleaning is the process of identifying inaccurate, incorrect, or incomplete
    parts of the data and treating them by replacing, deleting, or modifying the data.
    In other words, it is the process of preparing the data for analysis by treating
    all the irregularities in the raw data. In the following sections, we will discuss
    how to handle missing values and outliers, fill in the inappropriate values, and
    remove duplicate entries.'
  raw: '## Pandas and Data Structures


    Pandas is a software library written for the Python programming language that
    is used mainly for data manipulation and analysis.


    In a nutshell, Pandas is like Excel for Python, with tables (which in Pandas are
    called *dataframes*) made of rows and columns (which in Pandas are called *series*).
    Pandas has many functionalities that make it an awesome library for data processing,
    inspection, and manipulation.


    ### Installing and Using Pandas


    Installing Pandas on your system requires NumPy to be installed, and if building
    the library from source, it requires the appropriate tools to compile the C and
    Cython sources on which Pandas is built.


    You can find details about this installation in the Pandas documentation. Pandas
    can be installed using pip function as: pip install pandas. Once Pandas is installed,
    you can import it and check the version, as shown here:


    ```

    import pandas

    pandas.__version__

    ```


    Just as we generally import NumPy under the alias `np`, we will import Pandas
    under the alias `pd`, and this import convention will be used throughout the remainder
    of this book.


    ```

    import pandas as pd

    ```


    ### Pandas Data Structures


    A data structure is a data organization, management, and storage format that enables
    efficient access and modification. More precisely, a data structure is a collection
    of data values, the relationships among them, and the functions or operations
    that can be applied to the data. Pandas introduces two new data structures to
    Python, `Series` and `DataFrame`, both of which are built on top of NumPy (which
    means they are fast).


    ## Series


    A *series* is a one-dimensional object similar to an array, list, or column in
    a table. It will assign a labeled index to each item in the series. By default,
    each item will receive an index label from 0 to N, where N is the length of the
    series minus 1, as illustrated here:


    ```

    s = pd.Series([1, ''Raspberry Pi'', 3.14, -500, ''Data''])

    print(s)

    Output:

    0          1

    1   Raspberry Pi

    2    3.14

    3    -500

    4    Data

    dtype: object

    ```


    Instead of providing the default index, we can specify an index to be used for
    each entry while creating the series, as illustrated here:


    ```

    s = pd.Series([1, ''Raspberry Pi'', 3.14, -500, ''Data''],

    index=[''M'', ''A'', ''X'', ''I'', ''E''])

    print(s)

    Output:

    M          1

    A   Raspberry Pi

    X    3.14

    I    -500

    E    Data

    dtype: object

    ```


    The `Series` constructor can convert a dictionary into a series as well, using
    the keys of the dictionary as its index, as illustrated here:


    ```

    d = {''English'': 95, ''Math'': 100, ''Science'': 98, ''Social Science'': 93}

    marks = pd.Series(d)

    print(marks)

    Output:

    English           95

    Math             100

    Science           98

    Social Science    93

    dtype: float64

    ```


    The index can be used to select specific items from the series. For instance,
    the marks for math can be selected by specifying the index `Math`. Similarly,
    a group of items can be printed by providing their corresponding indices separated
    by commas in a list, as illustrated here:


    ```

    print (marks[''Math''])

    print(marks[[''English'', ''Science'', ''Social Science'']])

    Output :

    100.0

    English           95

    Science           98

    Social Science    93

    dtype: float64

    ```


    Boolean indexing for filtering values can also be used. For example, using the
    index `marks < 96` returns a series of Boolean values, which we then pass to our
    series `marks`, returning the corresponding `True` items, as illustrated here:


    ```

    marks[marks < 96]

    Output:

    Math             100

    Science           98

    dtype: float64

    ```


    The value of a particular item in the series can be changed on the go by accessing
    the corresponding index of the item, as illustrated here:


    ```

    print(''Old value:'', marks[''Math''])

    marks[''Math''] = 99

    print(''New value:'', marks[''Math''])

    Output:

    (''Old value:'', 100.0)

    (''New value:'', 99.0)

    ```


    We can also check whether an item exists in the series or not using the following
    code:


    ```

    print(''Math'' in marks)

    print(''French'' in marks)

    Output:

    True

    False

    ```


    Mathematical operations can also be done on a series of numerical values, as illustrated
    here:


    ```

    marks * 10

    Output:

    English           950

    Math              990

    Science           980

    Social Science    930

    dtype: float64

    np.square(marks)

    Output:

    English           9025

    Math              9801

    Science           9604

    Social Science    8649

    dtype: float64

    ```


    ## DataFrame


    The tabular `DataFrame` data structure is composed of rows and columns, similar
    to a spreadsheet or a database table. You can also think of a `DataFrame` as a
    group of `Series` objects that share an index (the column names).


    ### Reading Data


    To create a `DataFrame` data structure out of common Python data structures, we
    can pass a dictionary of lists to the `DataFrame` constructor.


    ```

    a={''Name'':[''Augustus'', ''Hazel'', ''Esther'', ''Cavas''],

    ''Gender'':[''Male'',''Female'',''Female'',''Male''],

    ''Age'':[19, 18, 22, 21]}

    b=pd.DataFrame.from_dict(a)

    print(b)

    Output:

    Name      Gender   Age

    0  Augustus    Male   19

    1     Hazel  Female   18

    2    Esther  Female   22

    3     Cavas    Male   21

    ```


    ### Reading CSV Data


    Reading a CSV file is as simple as calling the `read_csv` function. By default,
    the `read_csv` function expects the column separator to be a comma, but you can
    change that using the `sep` parameter. The following code shows the syntax to
    read a CSV file into a `DataFrame ''df''` and print the first five rows of `df`
    using the `head()` function:


    ```

    df = pd.read_csv(''data.csv'')

    print(df.head())

    ```


    There’s also a set of writer functions for writing the `DataFrame` object to a
    variety of formats such as CSV files, HTML tables, JSON, etc. The following line
    of code shows the syntax to write a `DataFrame` object to a CSV file:


    ```

    df.to_csv(''path_to_file.csv'')

    ```


    ### Reading Excel Data


    Pandas allows us to read and write Excel files, so we can easily read from Excel,
    in Python, and then write the data back out to Excel. Reading Excel files requires
    the `xlrd` library, which can be installed using the `pip` command, as shown here:


    ```

    pip install xlrd.

    ```


    The following code illustrates the syntax used to read a sheet from an Excel file
    into a `DataFrame df`*.* Replace `data.xlsx` with the path/filename of your Excel
    file to run the code.


    ```

    df = pd.read_excel(''data.xlsx'', ''Sheet1'')

    print(df.head())

    ```


    Similarly, the data from a `DataFrame` object can be written to an Excel file,
    as shown here:


    ```

    dataframe.to_excel(''path_to_file.xlsx'', index=False)

    ```


    ### Reading URL Data


    The `read_table` function can be used to read directly from a URL. The following
    code illustrates a `DataFrame` created using raw data from a given URL:


    ```

    url = ''https://raw.github.com/gjreda/best-sandwiches/master/data/best-sandwiches-geocode.tsv''

    from_url = pd.read_table(url, sep=''\t'')

    from_url.head(3)

    Output:

    rank         sandwich  ...   lat        lng

    0     1                 BLT  ...   41.895734  -87.679960

    1     2       Fried Bologna  ...   41.884672  -87.647754

    2     3   Woodland Mushroom  ...   41.890602  -87.630925

    ```


    ### Cleaning the Data


    In most of the data analytics projects, the available data is not always perfect.
    The raw data always tends to be messy with corrupt or inaccurate data in addition
    to the useful data. It is therefore essential for the data scientists to treat
    these messy data samples so as to convert the raw data to a form which can work,
    and they spend a considerably long time doing so.


    Data cleaning is the process of identifying inaccurate, incorrect, or incomplete
    parts of the data and treating them by replacing, deleting, or modifying the data.
    In other words, it is the process of preparing the data for analysis by treating
    all the irregularities in the raw data. In the following sections, we will discuss
    how to handle missing values and outliers, fill in the inappropriate values, and
    remove duplicate entries.'
  trans: '

    # Pandas 与数据结构


    Pandas 是一个为 Python 编程语言编写的软件库，主要用于数据处理和分析。


    简而言之，Pandas 就像是 Python 中的 Excel，拥有由行和列（在 Pandas 中称为 *series*）组成的表格（在 Pandas 中称为
    *dataframes*）。Pandas 具备许多功能，使其成为数据处理、检查和操作的优秀库。


    ## 安装与使用 Pandas


    在系统上安装 Pandas 需要先安装 NumPy，如果要从源代码构建库，则需要合适的工具来编译 Pandas 所依赖的 C 和 Cython 源码。


    有关此安装的详细信息，请参阅 Pandas 文档。可以使用 `pip` 功能安装 Pandas，命令如下：`pip install pandas`。Pandas
    安装完成后，您可以导入它并检查版本，如下所示：


    ```

    import pandas

    pandas.__version__

    ```


    就像我们通常以别名 `np` 导入 NumPy 一样，我们将以别名 `pd` 导入 Pandas，并且本书的其余部分将继续使用此导入约定。


    ```

    import pandas as pd

    ```


    ## Pandas 数据结构


    数据结构是一种数据组织、管理和存储的格式，它支持高效的访问和修改。更准确地说，数据结构是数据值、它们之间的关系以及可应用于数据的函数或操作的集合。Pandas
    为 Python 引入了两种新的数据结构：`Series` 和 `DataFrame`，它们都构建在 NumPy 之上（这意味着它们速度很快）。


    ## Series


    *Series* 是一种一维对象，类似于数组、列表或表中的一列。它会为序列中的每个项目分配一个带标签的索引。默认情况下，每个项目会收到一个从 0 到 N 的索引标签，其中
    N 是序列长度减 1，如下所示：


    ```

    s = pd.Series([1, ''Raspberry Pi'', 3.14, -500, ''Data''])

    print(s)

    输出:

    0          1

    1   Raspberry Pi

    2    3.14

    3    -500

    4    Data

    dtype: object

    ```


    除了提供默认索引之外，我们还可以在创建序列时为每个条目指定要使用的索引，如下所示：


    ```

    s = pd.Series([1, ''Raspberry Pi'', 3.14, -500, ''Data''],

    index=[''M'', ''A'', ''X'', ''I'', ''E''])

    print(s)

    输出:

    M          1

    A   Raspberry Pi

    X    3.14

    I    -500

    E    Data

    dtype: object

    ```


    `Series` 构造函数也可以将字典转换为序列，并使用字典的键作为其索引，如下所示：


    ```

    d = {''English'': 95, ''Math'': 100, ''Science'': 98, ''Social Science'': 93}

    marks = pd.Series(d)

    print(marks)

    输出:

    English           95

    Math             100

    Science           98

    Social Science    93

    dtype: float64

    ```


    索引可用于从序列中选择特定项目。例如，可以通过指定索引 `Math` 来选择数学成绩。同样，可以通过在列表中提供对应的索引（以逗号分隔）来打印一组项目，如下所示：


    ```

    print (marks[''Math''])

    print(marks[[''English'', ''Science'', ''Social Science'']])

    输出 :

    100.0

    English           95

    Science           98

    Social Science    93

    dtype: float64

    ```


    还可以使用布尔索引来过滤值。例如，使用索引 `marks < 96` 会返回一个布尔值序列，然后我们将其传递给我们的 `marks` 序列，返回对应的 `True`
    项目，如下所示：


    ```

    marks[marks < 96]

    输出:

    Math             100

    Science           98

    dtype: float64

    ```


    可以通过访问项目的对应索引来动态更改序列中某个特定项目的值，如下所示：


    ```

    print(''旧值:'', marks[''Math''])

    marks[''Math''] = 99

    print(''新值:'', marks[''Math''])

    输出:

    (''旧值:'', 100.0)

    (''新值:'', 99.0)

    ```


    我们还可以使用以下代码检查序列中是否存在某个项目：


    ```

    print(''Math'' in marks)

    print(''French'' in marks)

    输出:

    True

    False

    ```


    数学运算也可以应用于数值序列，如下所示：


    ```

    marks * 10

    输出:

    English           950

    Math              990

    Science           980

    Social Science    930

    dtype: float64

    np.square(marks)

    输出:

    English           9025

    Math              9801

    Science           9604

    Social Science    8649

    dtype: float64

    ```


    ## DataFrame


    表格状的 `DataFrame` 数据结构由行和列组成，类似于电子表格或数据库表。您也可以将 `DataFrame` 视为一组共享索引（列名）的 `Series`
    对象。


    ### 读取数据


    要从常见的 Python 数据结构创建 `DataFrame` 数据结构，我们可以将字典的列表传递给 `DataFrame` 构造函数。


    ```

    a={''Name'':[''Augustus'', ''Hazel'', ''Esther'', ''Cavas''],

    ''Gender'':[''Male'',''Female'',''Female'',''Male''],

    ''Age'':[19, 18, 22, 21]}

    b=pd.DataFrame.from_dict(a)

    print(b)

    输出:

    Name      Gender   Age

    0  Augustus    Male   19

    1     Hazel  Female   18

    2    Esther  Female   22

    3     Cavas    Male   21

    ```


    ### 读取 CSV 数据


    读取 CSV 文件就像调用 `read_csv` 函数一样简单。默认情况下，`read_csv` 函数期望列分隔符为逗号，但您可以使用 `sep` 参数进行更改。以下代码展示了将
    CSV 文件读入 `DataFrame` `df` 并使用 `head()` 函数打印 `df` 的前五行所需的语法：


    ```

    df = pd.read_csv(''data.csv'')

    print(df.head())

    ```


    还有一组写入函数，用于将 `DataFrame` 对象写入各种格式，例如 CSV 文件、HTML 表格、JSON 等。以下代码行展示了将 `DataFrame`
    对象写入 CSV 文件的语法：


    ```

    df.to_csv(''path_to_file.csv'')

    ```


    ### 读取 Excel 数据


    Pandas 允许我们读取和写入 Excel 文件，因此我们可以轻松地在 Python 中从 Excel 读取数据，然后将数据写回 Excel。读取 Excel
    文件需要 `xlrd` 库，可以使用 `pip` 命令安装，如下所示：


    ```

    pip install xlrd.

    ```


    以下代码说明了将 Excel 工作表中的内容读入 `DataFrame` `df` 所使用的语法。将 `data.xlsx` 替换为您的 Excel 文件的路径/文件名以运行代码。


    ```

    df = pd.read_excel(''data.xlsx'', ''Sheet1'')

    print(df.head())

    ```


    类似地，来自 `DataFrame` 对象的数据也可以写入 Excel 文件，如下所示：


    ```

    dataframe.to_excel(''path_to_file.xlsx'', index=False)

    ```


    ### 读取 URL 数据


    `read_table` 函数可用于直接从 URL 读取数据。以下代码说明了使用给定 URL 的原始数据创建 `DataFrame`：


    ```

    url = ''https://raw.github.com/gjreda/best-sandwiches/master/data/best-sandwiches-geocode.tsv''

    from_url = pd.read_table(url, sep=''\t'')

    from_url.head(3)

    输出:

    rank         sandwich  ...   lat        lng

    0     1                 BLT  ...   41.895734  -87.679960

    1     2       Fried Bologna  ...   41.884672  -87.647754

    2     3   Woodland Mushroom  ...   41.890602  -87.630925

    ```


    ### 数据清洗


    在大多数数据分析项目中，可用的数据并不总是完美的。原始数据往往很混乱，除了有用数据之外，还可能包含损坏或不准确的数据。因此，数据科学家必须处理这些混乱的数据样本，以便将原始数据转换为可工作的形式，并且他们通常需要花费相当长的时间来执行此操作。


    数据清洗是识别数据中不准确、错误或不完整的部分，并通过替换、删除或修改数据来处理它们的过程。换句话说，它是通过处理原始数据中的所有不规则性来为分析准备数据的过程。在后续部分中，我们将讨论如何处理缺失值和异常值、填充不恰当的值以及删除重复条目。

