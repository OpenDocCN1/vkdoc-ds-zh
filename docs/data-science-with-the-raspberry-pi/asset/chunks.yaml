- fmt: '### Normal Distribution


    Normal distribution, also known as Gaussian distribution, is normally a bell-shaped
    curve centered at the mean where the probability is the maximum, and the probability
    reduces the further we move from the mean. This implies that the values closer
    to the mean occur more frequently, and the values that are further away from the
    mean occur less frequently. This distribution is dependent on two parameters:
    the mean (μ) of the data and the standard deviation (σ). The probability density
    function (`pdf`) for a normal distribution can be given as follows:


    ![$$ f\left(x;\mu, \sigma \right)=\frac{1}{\sqrt{2{\pi \sigma}^2}}\;{e}^{-\frac{{\left(x-\mu
    \right)}^2}{2{\sigma}^2}} $$](images/496535_1_En_7_Chapter/496535_1_En_7_Chapter_TeX_Equa.png)


    To illustrate the `pdf` function, consider the following code. An array `x` with
    100 values in the range of -10 to 10 is created, and the `pdf` function of `x`
    is computed using the `norm.pdf` function in the `stats` module of the `scipy`
    package. The `pdf` function is computed for four different values of mean 0, 2.5,
    5, and 7.5 using a `for` loop. If the mean value is not given, the `norm.pdf`
    function takes a default value of zero.


    ```

    from scipy.stats import norm

    import matplotlib.pyplot as plt

    import numpy as np

    mean=[0.0,2.5,5,7.5] # mean values for the normal distribution

    x=np.linspace(-10,10,100) # array of 100 numbers in the range -10 to 10

    for m in mean:

    y=norm.pdf(x,loc=m)

    plt.plot(x,y,label=''mean= %.1f'' %m)

    plt.xlabel(''x'')

    plt.ylabel(''pdf(x)'')

    plt.legend(frameon=True)

    plt.show()

    ```


    Figure [7-3](#496535_1_En_7_Chapter.xhtml#Fig3) shows that the normal distribution
    produces a bell-shaped curve that is centered on the mean value. That is, the
    curve is at the maximum at the point of mean, and it starts decreasing on either
    side as we move away from the mean value. Note that we have not specified the
    value of standard deviation. In that case, the `norm.pdf` function takes the default
    value of 1.


    ![../images/496535_1_En_7_Chapter/496535_1_En_7_Fig3_HTML.jpg](images/496535_1_En_7_Chapter/496535_1_En_7_Fig3_HTML.jpg)


    Figure 7-3


    Normal distribution plot for different mean values


    Similarly, let’s keep the value of the mean as constant and plot the distribution
    for different values of standard distribution using the following code:


    ```

    from scipy.stats import norm

    import matplotlib.pyplot as plt

    import numpy as np

    stdev=[1.0,2.0,3.0,4.0] # standard deviation values for the normal distribution

    x=np.linspace(-10,10,100)

    for s in stdev:

    y=norm.pdf(x,scale=s)

    plt.plot(x,y,label=''stdev= %.1f'' %s)

    plt.xlabel(''x'')

    plt.ylabel(''pdf(x)'')

    plt.legend(frameon=True)

    plt.show()

    ```


    From Figure [7-4](#496535_1_En_7_Chapter.xhtml#Fig4), we can see that all four
    curves are centered at the default mean value of zero. As the value of standard
    deviation σ is increased, the density is distributed across a wide range. In other
    words, the distribution of data is more spread out from the mean as the standard
    deviation value is increased and there is a high likelihood that more observations
    are further away from the mean.


    ![../images/496535_1_En_7_Chapter/496535_1_En_7_Fig4_HTML.jpg](images/496535_1_En_7_Chapter/496535_1_En_7_Fig4_HTML.jpg)


    Figure 7-4


    Normal distribution plot for different values of standard deviation


    An important property of the normal distribution that makes it an important statistical
    distribution for data scientists is the *empirical rule*. According to this rule,
    if we divide the range of observations in the x-axis in terms of standard deviation,
    then approximately 68.3 percent of the values fall within one standard deviation
    from the mean, 95.5 percent of the values fall within two standard deviation,
    and 99.7 percent of the values fall within three standard deviations, respectively.
    This empirical rule can be used for identifying outliers in the data if the data
    can be fit to a normal distribution. This principle is used in the Z-score for
    outlier detection, which we discussed earlier in Chapter [5](#496535_1_En_5_Chapter.xhtml).


    ## Statistical Analysis of Boston Housing Price Dataset


    Let’s take the Boston housing price dataset and try to identify the best features
    that can be used to model the data based on the statistical properties of the
    features. As we have already discussed, the Boston dataset consists of 13 different
    features for 506 cases (506 × 13). In addition to these features, the median value
    of owner-occupied homes (in the thousands) denoted by the variable `MEDV` is identified
    as the target. That is, given the 13 different features, the median value of a
    house is to be estimated. The features from the dataset are first converted to
    a dataframe using the Pandas package. Then the target variable is added to the
    last column of this dataframe, making its dimension 506 × 14. This is illustrated
    in the following code:


    ```

    import matplotlib.pyplot as plt

    import numpy as np

    import pandas as pd

    from sklearn.datasets import load_boston

    import matplotlib.pyplot as plt

    dataset = load_boston()

    boston_data=pd.DataFrame(dataset.data,columns=dataset.feature_names)

    boston_data[''MEDV''] = dataset[''target'']

    print(boston_data.head())

    CRIM     ZN    INDUS  CHAS  NOX   ...  TAX    PTRATIO  B    LSTAT  MEDV

    0  0.00632  18.0  2.31   0.0  0.538  ...  296.0  15.3  396.90  4.98   24.0

    1  0.02731  0.0   7.07   0.0  0.469  ...  242.0  17.8  396.90  9.14   21.6

    2  0.02729  0.0   7.07   0.0  0.469  ...  242.0  17.8  392.83  4.03   34.7

    3  0.03237  0.0   2.18   0.0  0.458  ...  222.0  18.7  394.63  2.94   33.4

    4  0.06905  0.0   2.18   0.0  0.458  ...  222.0  18.7  396.90  5.33   36.2

    [5 rows x 14 columns]

    ```


    Once we have the data in hand, the best way to go about it is to plot the histogram
    of all the features so that we can get an understanding of the nature of their
    distribution. Rather than plotting the histogram of each feature individually,
    the `hist` function in the Pandas package can be used to plot them all in one
    go, as illustrated here:


    ```

    fig, axis = plt.subplots(2,7,figsize=(16, 16))

    boston_data.hist(ax=axis,grid=False)

    plt.show()

    ```


    From Figure [7-5](#496535_1_En_7_Chapter.xhtml#Fig5), we can see that the distribution
    of the target variable `MEDV` is like a normal distribution.


    ![../images/496535_1_En_7_Chapter/496535_1_En_7_Fig5_HTML.jpg](images/496535_1_En_7_Chapter/496535_1_En_7_Fig5_HTML.jpg)


    Figure 7-5


    Histogram plots of the Boston dataset features


    Further, if we observe all the other parameters, the distribution for the parameter
    `RM` (which denotes the average number of rooms per dwelling) is also similar
    to the target `MEDV`. Therefore, the `RM` can definitely be used for modeling
    the dataset. Also, the parameters `DIS` (weighted mean of distances to five Boston
    employment centers) and `LSTAT` (percentage of lower status of the population)
    have similar distribution. The distribution of the parameter `AGE` (proportion
    of owner-occupied units built prior to 1940) is exactly the opposite of these
    two parameters. The rest of the parameters have less significant distribution
    compared to the target parameter. Since these three parameters seem to be related
    either positively or negatively, it is pointless to use all three for building
    the model. So, we have to see which of these three parameters are related to our
    target variable `MEDV`. The best way to do this is to measure the correlation
    between these parameters using the `corr` function in the Pandas package, as illustrated
    here:


    ```

    cols=[''RM'',''AGE'',''DIS'',''LSTAT'',''MEDV'']

    print(boston_data[cols].corr())

    RM           AGE          DIS           LSTAT        MEDV

    RM     1.000000    -0.240265     0.205246     -0.613808     0.695360

    AGE   -0.240265     1.000000    -0.747881      0.602339     -0.376955

    DIS    0.205246    -0.747881     1.000000     -0.496996     0.249929

    LSTAT -0.613808     0.602339    -0.496996      1.000000     -0.737663

    MEDV   0.695360    -0.376955     0.249929     -0.737663     1.000000

    ```'
