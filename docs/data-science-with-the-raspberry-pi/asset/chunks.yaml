- fmt: '# Case Study 3: Industry 4.0


    Industry 4.0 represents the fourth revolution in the manufacturing industry. The
    first revolution in industry (i.e., Industry 1.0) was the creation of mechanical
    energy with the help of steam power to increase the productivity in assembly lines.
    The second revolution (i.e., Industry 2.0) incorporated electricity into the assembly
    line to improve productivity. The third revolution (i.e., Industry 3.0) incorporated
    computers for automating the industrial process. Currently, Industry 4.0 is adopting
    computers, data analysis, and machine learning tools for making intelligent decisions
    or monitoring the process with the help of data that is acquired with sensors.
    The Internet of Things (IoT) has recently played a major role in acquiring data
    and transmitting it for remote access.


    Figure [9-17](#496535_1_En_9_Chapter.xhtml#Fig17) describes the basic process
    flow in Industry 4.0. Initially, the physical system’s data is collected with
    the help of sensors and made into a digital record. Then the digital record of
    the physical systems is sent to a server system for real-time data processing
    and analysis. The data science techniques are applied in this stage for preprocessing
    and preparing the data. Then modern learning algorithms can be used for intelligent
    decision-making by predicting the output with the learned model. Moreover, visualization
    techniques are used to monitor the real-time data of the physical systems. Here,
    the `Raspberry Pi` can be used as a server or a localized cloud for real-time
    data processing.


    ![../images/496535_1_En_9_Chapter/496535_1_En_9_Fig17_HTML.jpg](images/496535_1_En_9_Chapter/496535_1_En_9_Fig17_HTML.jpg)


    **Figure 9-17** Industry 4.0 block diagram


    ## Raspberry Pi as a Localized Cloud for Industry 4.0


    To implement Industry 4.0, a sophisticated computer is required to connect the
    devices, collect the data, and process the data. The collected data can be stored
    in a cloud service for further processing. However, these days, subscriptions
    of cloud services are costlier and suitable for highly profitable companies. Small-scale
    companies will want to implement a localized cloud for real-time processing. Further,
    a localized cloud approach can provide data security because it’s on-site and
    attackers are not able to invade via remote access.


    As discussed in Chapter [3](#496535_1_En_3_Chapter.xhtml), the `Raspberry Pi`
    can act as a localized cloud that can connect sensors, IoT devices, other nearby
    computers, and mobile phones, as shown in Figure [9-18](#496535_1_En_9_Chapter.xhtml#Fig18).
    Sophisticated computers also can act as a localized cloud, but they occupy a large
    space. Also, it is difficult to implement the computers in remote areas. The `Raspberry
    Pi` has the advantage of occupying less space and can be implemented in remote
    areas. Based on this, the `Raspberry Pi` is used as a localized cloud for the
    Industry 4.0 framework, as shown in Figure [9-19](#496535_1_En_9_Chapter.xhtml#Fig19).


    ![../images/496535_1_En_9_Chapter/496535_1_En_9_Fig19_HTML.jpg](images/496535_1_En_9_Chapter/496535_1_En_9_Fig19_HTML.jpg)


    **Figure 9-19** Industry 4.0 framework with the Raspberry Pi


    ![../images/496535_1_En_9_Chapter/496535_1_En_9_Fig18_HTML.jpg](images/496535_1_En_9_Chapter/496535_1_En_9_Fig18_HTML.jpg)


    **Figure 9-18** The Raspberry Pi as a localized cloud


    There are three modules available in the Industry 4.0 framework with the `Raspberry
    Pi`. The modules are collecting the data from the sensors, collecting the information
    using cameras, and connecting the `Raspberry Pi` with other computers.


    ## Collecting Data from Sensors


    We will use the temperature and humidity sensor to measure the temperature and
    humidity. Connect the `DHT 11/22` sensor module to the `Raspberry Pi`, as shown
    in Chapter [3](#496535_1_En_3_Chapter.xhtml). The following code collects the
    temperature and humidity percentage for 100 seconds and stores the collected data
    as a CSV file.


    ```

    import Adafruit_DHT

    import time

    from datetime import datetime

    DHT_SENSOR = Adafruit_DHT.DHT11

    DHT_PIN = 17

    data = []

    while _ in range(100):

    humidity, temperature = Adafruit_DHT.read(DHT_SENSOR, DHT_PIN)

    if humidity is not None and temperature is not None:

    now = datetime.now()

    dt_string = now.strftime("%d/%m/%Y %H:%M:%S")

    data.append(dt_string,humidity,temperature)

    time.sleep(60*5)

    df = pd.DataFrame(data)

    df.to_csv(''data.csv'',index=None,header=None)

    ```


    The CSV file would look like Table [9-3](#496535_1_En_9_Chapter.xhtml#Tab3).


    **Table 9-3** Timestamped Data from the Humidity and Temperature Sensors


    | 17/05/2020 01:05:14 | 26.24 | 69.91 |

    |----------------------|-------|-------|

    | 17/05/2020 01:10:14 | 26.24 | 70.65 |

    | 17/05/2020 01:15:14 | 26.22 | 68.87 |

    | 17/05/2020 01:20:14 | 26.15 | 70.11 |

    | 17/05/2020 01:25:14 | 26.11 | 69.02 |'
