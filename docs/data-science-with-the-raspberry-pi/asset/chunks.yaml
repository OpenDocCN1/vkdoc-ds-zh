  trans: '

    # 案例研究 2：图像数据的数据科学


    尽管当今的数字设备能够以比人类视觉更高的分辨率和更多细节来捕捉图像，但计算机只能将这些图像视为表示颜色的数值数组。*计算机视觉*指的是能让计算机理解数字图像和视频的技术。计算机视觉系统可以被视为人类视觉系统的复制，使计算机能够像人类一样处理图像和视频。计算机视觉系统用于许多应用，例如人脸识别、自动驾驶汽车、医疗保健、安防、增强现实等。


    任何计算机视觉系统的第一步都是捕捉感兴趣的目标图像。这可以通过多种方式实现，例如相机、显微镜、X 光机、雷达等，具体取决于应用的性质。然而，捕捉到的原始图像不能直接使用，需要进一步处理。由于各种原因引入的噪声，原始图像可能达不到期望的质量。因此，在进一步处理之前，增强捕捉到的原始图像是至关重要的。为了让计算机能够从图像中学习，有时必须使用分析技术从图像中提取有用信息。在本节中，我们将了解如何使用连接到树莓派板的相机捕捉图像，并讨论准备原始图像以供进一步处理的步骤。


    第一步是将 USB 网络摄像头连接到我们的树莓派板，如图 9-6 所示。


    ![../images/496535_1_En_9_Chapter/496535_1_En_9_Fig6_HTML.jpg](img/496535_1_En_9_Fig6_HTML.jpg)


    **图 9-6** 带网络摄像头的树莓派


    为此，我们需要在 Pi 配置设置中启用 SSH 和 Camera。安全壳协议（SSH）可以帮助通过本地网络远程连接到树莓派，而启用摄像头配置则有助于将网络摄像头与
    Pi 板连接。这可以通过以下步骤完成：


    ![../images/496535_1_En_9_Chapter/496535_1_En_9_Fig8_HTML.jpg](img/496535_1_En_9_Fig8_HTML.jpg)


    **图 9-8** 用于启用摄像头和 SSH 的接口选项


    ![../images/496535_1_En_9_Chapter/496535_1_En_9_Fig7_HTML.jpg](img/496535_1_En_9_Fig7_HTML.jpg)


    **图 9-7** 软件配置工具窗口


    1. 在树莓派操作系统的终端窗口中输入命令 `sudo raspi-config`。这将打开软件配置工具窗口，如图 9-7 所示。


    2. 进入接口选项，如图 9-8 所示，并启用 SSH 和摄像头。


    3. 重启树莓派设备。


    重启完成后，在终端窗口中运行 `lsusb` 命令，检查连接的 USB 网络摄像头是否已被列出。然后打开 Python IDE 并输入以下代码，使用网络摄像头捕捉并保存图像：


    ```python

    import cv2

    import pandas as pd

    import numpy as np

    import matplotlib.pyplot as plt

    camera=cv2.VideoCapture( )

    ret, img = camera.read( )

    cv2.imwrite(''image.png'',img)

    img= cv2.cvtColor(img,cv2.COLOR_BGR2RGB)

    plt.imshow(img)

    plt.axis(''off'')

    plt.show( )

    ```


    如代码所示，`OpenCV` 包用于在 Python 中处理图像。为了捕捉图像，首先创建一个 `VideoCapture` 对象。使用 `read()` 函数通过创建的对象捕捉图像，然后将其存储在变量
    `img` 中。捕捉到的图像可以使用 `imwrite()` 函数保存。`OpenCV` 以 BGR 格式显示图像，而非标准的 RGB 格式。因此，在显示图像之前，需使用
    `cv2.color` 函数将其转换为 RGB 图像。为了显示图像，可以使用 Matplotlib 包中的 `imshow()` 函数。由于使用该包创建的图默认带有坐标轴值，因此在显示图像时，必须移除坐标轴。这可以通过将
    Matplotlib 包中的 `axis` 函数设置为 `off` 状态来实现。图 9-9 显示了使用上述代码捕捉到的示例图像。


    ![../images/496535_1_En_9_Chapter/496535_1_En_9_Fig9_HTML.jpg](img/496535_1_En_9_Fig9_HTML.jpg)


    **图 9-9** 使用连接到树莓派板的网络摄像头捕捉的图像

    '
- fmt: '### Exploratory Image Data Analysis


    The image shows a few stationary objects lying on white paper. To understand the
    acquired image data, it would be better to print the data type and size of the
    image, as illustrated here:


    ```

    print(type(img))

    print(img.shape)

    Output:


    (719, 1206, 3)

    ```


    The captured image is a NumPy array. The image captured using the webcam is usually
    in RGB form where there are three planes of pixels: Red, Blue, and Green. In other
    words, each pixel in the image is composed of three values that represent the
    proportion of red, blue, and green thereby leading to various colors in the visible
    spectrum. The number 3 in the shape of the image printed indicates the three planes;
    i.e., the image is composed of three planes corresponding to RGB, each with a
    size of 719 × 1206 pixels. In many applications, other details such as edges,
    shapes, etc., in the image are more important than the color information. For
    instance, if our objective is to identify the stationary objects in the given
    image, the shape of the objects would be more important than the color. In such
    cases, the three-plane RGB image can be converted to a single-plane grayscale
    image using the following code:


    ```

    gray = cv2.cvtColor(img, cv2.COLOR_BGR2GRAY)

    plt.imshow(gray,cmap= ''gray'')

    plt.axis(''off'')

    plt.show( )

    print(gray.shape)

    Output:

    (719, 1206)

    ```


    Figure [9-10](#496535_1_En_9_Chapter.xhtml#Fig10) shows a single-plane grayscale
    image where the colors in the image are removed. This can be seen from the size
    of the image printed in the previous code. Now the size of the grayscale image
    is just 719×1206 in a single plane. In some cases, the captured image may have
    some missing values caused by defects in the image sensor. These values may be
    reflected in the grayscale image as well, and these values can be detected and
    treated by converting the image to a dataframe, as illustrated here:


    ```

    df=pd.DataFrame(gray)

    s=df.isnull( ).sum( ).sum( )

    print(s)

    if s!=0:

    df=df.ffill(axis=0)

    gray=df.to_numpy( )

    Output:


    ```


    The `isnull( )` function can be used to detect the presence of missing values
    along the rows and columns of the image. The `sum( )` function can be used to
    count the number of missing values in the dataframe along rows and columns. If
    the result of the `sum( )` function is not equal to zero, then the image consists
    of missing values, and they can be treated using the `ffill( )` function, which
    replaces each missing value with the pixel above it. This method of forward filling
    or backward filling will not cause any visible changes in the image because pixel
    values are often closely placed in an image except at edges in the image. As shown
    from the previous code, the number of missing values is 0; i.e., there are no
    missing values in the image. Once the image is checked and treated for missing
    values, the dataframe can be converted back to a NumPy array using `to_numpy(
    )` in Pandas. Since the pixel values are closely placed, there may be repetition
    of same pixel values at many regions in the image. Because of this property, identification
    of duplicate values is irrelevant in the case of the image data.


    ![../images/496535_1_En_9_Chapter/496535_1_En_9_Fig10_HTML.jpg](images/496535_1_En_9_Chapter/496535_1_En_9_Fig10_HTML.jpg)


    Figure 9-10


    Image converted to grayscale


    Using a USB webcam or the Pi camera in natural lighting may often result in poor-quality
    images. So, the next step after treating missing values is to plot the histogram
    of the image. The histogram plot will give an idea about the contrast of the image,
    as shown in Figure [9-11](#496535_1_En_9_Chapter.xhtml#Fig11). This is illustrated
    in the following code:


    ![../images/496535_1_En_9_Chapter/496535_1_En_9_Fig11_HTML.jpg](images/496535_1_En_9_Chapter/496535_1_En_9_Fig11_HTML.jpg)


    Figure 9-11


    Histogram of the grayscale image


    ```

    plt.hist(gray.ravel( ),bins=256)

    plt.xlabel(''bins'')

    plt.ylabel(''No of pixels'')

    plt.show( )

    ```


    The pixel values in a grayscale image range from 0 (representing black) to 255
    (representing white). The `hist( )` function in the previous code plots a bar
    chart of the count of each pixel value in this range. This plot gives insight
    about the contrast of the image that we are dealing with. Figure [9-7](#496535_1_En_9_Chapter.xhtml#Fig7)
    shows the histogram of our grayscale image. It can be seen that the majority of
    the pixels are in the range (120,160). If the spread of pixels is concentrated
    in the lower bins, then we have a low-contrast image, and vice versa. So, depending
    on this plot, a decision can be made as to whether the image needs contrast adjustment.


    The other cause for the poor quality of images may be the presence of noise induced
    by various factors. These noises can be visually perceived, while observing the
    captured images, in the form of grains. In such cases, these noises have to be
    removed before going for further processing. There are many different kinds of
    noises such as Gaussian noise, salt and pepper noise, etc., and there are many
    different types of filters that can be used to remove those noises that are beyond
    the scope of this book. Let’s just look at one particular filter used often in
    image processing called the averaging filter. It is a low-pass filter that can
    be used to remove high-frequency content from a digital image. This filtering
    works by passing a kernel of particular size, say 3×3, across the dimensions of
    the image, taking the average of all the pixels under the kernel area and replacing
    the central element with this average. The overall effect is to create a blurring
    effect. The following code illustrates the implementation of averaging filter
    to our image. Figure [9-12](#496535_1_En_9_Chapter.xhtml#Fig12) shows the image
    obtained after filtering.


    ![../images/496535_1_En_9_Chapter/496535_1_En_9_Fig12_HTML.jpg](images/496535_1_En_9_Chapter/496535_1_En_9_Fig12_HTML.jpg)


    Figure 9-12


    Image obtained by average filtering


    ```

    blur=cv2.blur(gray,(3,3))

    plt.imshow(blur)

    plt.axis(''off'')

    plt.show( )

    ```


    ### Preparing the Image Data for Model


    Once the preprocessing steps are completed, the next step is to analyze or prepare
    the image for a learning model. This can be done in two ways. The first way is
    to extract features that represent useful information and use them for modeling.
    The features extracted may be another transformed image, or they may be attributes
    extracted from the original image. There are numerous features that can be extracted
    from an image, and the selection of a particular feature depends on the nature
    of our application. A discussion of these numerous features is beyond the scope
    of this book. Instead, we will discuss one particular feature: edge detection.


    Edges represent the high-frequency content in an image. Canny edge detection is
    an algorithm that uses a multistage approach to detect a wide range of edges in
    images. It can be implemented in Python by using the `Canny( )` function in `OpenCV`,
    as illustrated in the following code. Figure [9-13](#496535_1_En_9_Chapter.xhtml#Fig13)
    shows the image after the edge detection process.


    ![../images/496535_1_En_9_Chapter/496535_1_En_9_Fig13_HTML.jpg](images/496535_1_En_9_Chapter/496535_1_En_9_Fig13_HTML.jpg)


    Figure 9-13


    Image after edge detection


    ```

    edge_img=cv2.Canny(gray,100,200)

    plt.imshow(edge_img,cmap=''gray'')

    plt.axis(''off'')

    plt.show( )

    ```


    The second way is to directly feed the image to a deep learning model. Deep learning
    is a popular machine learning approach that is being increasingly used for analyzing
    and learning from images. This approach can directly learn the useful information
    from the image and does not require any feature extraction. The image may be resized
    to a different shape and then fed to the learning model, or the image array may
    be converted to a one-dimensional vector and then fed to the model.'
