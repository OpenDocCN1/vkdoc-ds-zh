    # 8. Learning from Data


    Learning from data just means extracting the information from the data and using
    it for predicting/forecasting in order to make intelligent decisions based on
    it. This area is becoming more popular because it is applicable to various applications
    in different industries, such as financial, healthcare, education, computer vision,
    politics, etc.


    Learning from data is used in various situations when the analytical solution
    is not required or there is no clear-cut model about the problem or requirement
    of forecasting based on the previous information, etc. Basically, three types
    of learning techniques are available: supervised learning, unsupervised learning,
    and reinforcement learning. *Supervised learning* utilizes the observations of
    a process to develop a model. Supervised learning models are trained based on
    the input and output observations (i.e., input and output data) of the process.
    In *unsupervised learning*, the training data doesn’t have any information about
    the output. The unsupervised models categorize the model based on the characteristics
    of the data. Also, unsupervised models can be used to find patterns in the data,
    detect outliers by clustering similar data, find the structure of the data, etc.
    The *reinforcement learning* model also doesn’t utilize the correct information
    about the output. However, it has some possible output with information about
    the quality of the output.


    This chapter focuses on describing the learning model development techniques by
    utilizing the Boston dataset. Then, we will implement the learning models in the
    Raspberry Pi and analyze the industry data that is acquired from the sensors.
    This implementation will be discussed as a case study in Chapter [9](#496535_1_En_9_Chapter.xhtml).


    ## Forecasting from Data Using Regression


    *Regression* finds the relationship between the variables in a dataset. Regression
    is used to identify the impact of one variable on another variable. Also, it can
    be used to forecast a variable based on its previous data. Regression models can
    be used in many areas such as forecasting the trends in economics, predicting
    sales in business, predicting the impact of some policies, and predicting the
    blood pressure levels in healthcare applications.


    In regression, there are two kinds of variables required to develop a model: input
    and output. An *input variable* is the variable in a dataset used to predict the
    output variable. An input variable in linear regression is commonly denoted as
    X. An *output variable* is the variable for predicting and is denoted as Y. Equation
    [8-1](#496535_1_En_8_Chapter.xhtml#Par7) shows the equation for linear regression.


    Ye=α+βX    … (8-1)


    Here, Ye is the estimated output variable, Y is the actual output variable, and
    α and β are parameters of the linear regression model. For example, if we want
    to buy a TV and try to estimate the cost of the TV (i.e., output variable), we
    use input variables like the size of the TV. Now, α, β, and Y are selected (randomly)
    as 2, 5, and €170, respectively. The size of the TV (i.e., input variable) is
    32 inch, and the estimated output of the linear regression model in estimating
    the cost of the TV is shown in Equation [8-2](#496535_1_En_8_Chapter.xhtml#Par10).


    Ye=2+5 *32


    = €162    …(8-2)


    So, based on Equation [8-2](#496535_1_En_8_Chapter.xhtml#Par10), the cost of the
    TV is €162 when the size of the TV is 32 inches, which is nearer to the actual
    cost of the TV: €170\. If we modify the parameters α and β as 0.1 and 0.5, respectively,
    now the estimated cost of the TV is calculated as follows:


    Ye=0.1+0.5 *32


    = €16.1


    The cost of the TV is drastically changed to €16.1\. This shows that the selection
    of α and β is important in predicting the output variable. Thus, the objective
    in developing the linear regression model is to find α and β by minimizing the
    difference between the actual output Y and the estimated output Ye. There are
    many methods available to find the optimum parameters of α and β. However, the
    ordinary least (OL) square method is commonly used in finding the optimum parameters
    of α and β.


    The OL method uses covariance and variance of the input variables for identifying
    the parameters α and β as shown in Equation [8-3](#496535_1_En_8_Chapter.xhtml#Par16).


    ![$$ {\displaystyle \begin{array}{l}\beta =\frac{Cov\left(X,Y\right)}{Var(X)}\\
    {}\alpha =\overset{\_}{Y}-\beta \overline{X}\end{array}} $$](images/496535_1_En_8_Chapter/496535_1_En_8_Chapter_TeX_IEq1.png)    …
    (8-3)


    Here, ![$$ \overset{\_}{Y} and\overline{X} $$](images/496535_1_En_8_Chapter/496535_1_En_8_Chapter_TeX_IEq2.png)are
    the means of actual output and input variables.


    Let’s consider the Boston dataset now. The RM variable is used for representing
    the average number of rooms per dwelling, and the target variable (i.e., output
    variable) MEDV is used for representing the median value of owner-occupied homes
    in the thousands. We consider RM as the input variable and MEDV as the output
    variable for linear regression modeling. Because RM and MEDV are interlinked with
    each other closely, the linear regression model for those variables can be implemented
    using the following code. For identifying the α and β parameters, the ordinary
    least square method is used.'
