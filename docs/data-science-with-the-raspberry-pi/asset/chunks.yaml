- fmt: '### Outliers


    In statistics, an outlier is a data point that differs significantly from other
    observations. An outlier may be because of variability in the measurement or it
    may indicate experimental errors; outliers are sometimes excluded from the data
    set. Figure [1-3](#496535_1_En_1_Chapter.xhtml#Fig3) shows an example of outlier
    data. Outlier data can cause problems with certain types of models, which in turn
    will influence the decision-making.


    ![../images/496535_1_En_1_Chapter/496535_1_En_1_Fig3_HTML.jpg](images/496535_1_En_1_Chapter/496535_1_En_1_Fig3_HTML.jpg)


    Figure 1-3


    Outlier data


    ### Transforming the Data


    Data transformation can be done by many methods using normalization, min-max operations,
    correlation information, etc.


    ## Data Visualization


    Based on the requirements of the user, the data can be analyzed with the help
    of visualization tools such as charts, graphs, etc. These visualization tools
    help people to understand the trends, variations, and deviations in a particular
    variable in the data set. Visualization techniques can be used as a part of exploratory
    data analysis.


    ## Data Analysis


    The data can be further analyzed with the help of mathematical techniques such
    as statistical techniques. The improvements, deviations, and variations are determined
    in a numerical form. We can also generate an analysis report by combining the
    results of visualization tools and analysis techniques.


    ### Modeling and Algorithms


    Today many machine learning algorithms are employed to predict useful information
    from raw data. For example, neural networks can be used to identify the users
    who are willing to donate funds to orphans based on the users’ previous behavior.
    In this scenario, the previous behavior data of users can be collected based on
    their education, activities, occupation, sex, etc. The neural network can be trained
    with this collected data. Whenever a new user’s data is fed to this model, it
    can predict whether the new user will give funds or not. However, the accuracy
    of the prediction is based on the reliability and the amount of data used while
    training.


    There are many machine learning algorithms available such as regression techniques,
    support vector machine (SVM), neural networks, deep neural networks, recurrent
    neural networks, etc., that can be applied to data modeling. After data modeling,
    the model can be analyzed by giving data from new users and developing a prediction
    report.


    ### Report Generation/Decision-Making


    Finally, a report can be developed based on the analysis with the help of visualization
    tools, mathematical or statistical techniques, and models. Such reports can be
    helpful in many circumstances such as forecasting the strengths and weakness of
    an organization, industry, government, etc. The facts and findings from the report
    can make the decisions quite easy and intelligent. Moreover, the analysis report
    can be generated automatically using some automation tools based on the client
    requirements.


    ## Recent Trends in Data Science


    Certain fields in data science are growing exponentially and therefore will be
    attractive to data scientists. They are discussed in the following sections.


    ### Automation in Data Science


    In the current scenario, data science still needs a lot of manual work such as
    data processing, data cleaning, and transforming the data. These steps consume
    a lot of time and computations. The modern world demands the automation of data
    science processes such as data processing, data cleaning, data transformations,
    analysis, visualization, and report generation. Hence, the automation field will
    be a top demand in the data science industry.


    ### Artificial Intelligence–Based Data Analyst


    Artificial intelligence techniques and machine learning algorithms can be implemented
    effectively for modeling the data. Particularly, reinforcement learning with deep
    neural networks is used to upgrade the learning of the model based on variations
    in the data. Also, machine learning techniques can be used for automated data
    science projects.


    ## Cloud Computing


    The amount of data used by people nowadays has increased exponentially. Some industries
    gather a large amount of data every day and hence find it difficult to store and
    analyze with the help of local servers. This makes it expensive in terms of computation
    and maintenance. So, they prefer cloud computing in which the data can be stored
    on cloud servers and can be retrieved anytime and anywhere for analysis. Many
    cloud computing companies offer a data analytics platform on their cloud servers.
    The more growth in data processing, the more this field will gain attention.


    ## Edge Computing


    Many small-scale industries don’t require the analysis of data on cloud servers
    and instead require analysis reports instantly. For these kinds of applications,
    edge devices can be a possible solution to acquire the data, analyze it, and present
    a report in visual form or numerical form instantly to the users. In the future,
    the requirements of edge computing will increase significantly.


    ## Natural Language Processing


    Natural language processing (NLP) can be used to extract unstructured data from
    websites, emails, servers, log files, etc. In addition, NLP can be useful for
    converting text into a single data format. For example, we can convert people’s
    emotion into a data format from their messages on social media. This will be a
    powerful tool for collecting data from many sources, and its demand will continue
    to increase.


    ## Why Data Science on the Raspberry Pi?


    Many books explain the different processes involved in data science in relation
    to cloud computing. But in this book, the concepts of data science will be discussed
    as part of real-time applications using the Raspberry Pi. The Raspberry Pi boards
    can interact with the real-time world by connecting to a wide range of sensors
    using their general-purpose input/output (GPIO) pins, which makes it easier to
    collect real-time data. Owing to their small size and low cost, a number of nodes
    of these Raspberry Pi boards can be connected as a network, thereby enabling localized
    operation. In other words, the Raspberry Pi can be used as an edge computing device
    for data processing and storage, closer to the devices used for acquiring the
    information and thereby overcoming the disadvantages associated with cloud computing.
    Therefore, a lot of data processing applications can be implemented using a distribution
    of these devices that can manage real-time data and run the analytics locally.
    This book will help you to implement real-time data science applications using
    the Raspberry Pi.


    # 2. Basics of Python Programming


    Python is a general-purpose dynamic programming language that was created by Dutch
    programmer Guido van Rossum in 1989. It is the most commonly used programming
    language in the field of data science. Since it is easier to learn and write code
    in Python than other languages, it is an optimal choice for beginners. The widespread
    use of Python is also attributed to the fact that it is free and open source.
    The number of scientific libraries and packages developed by the Python community
    allows for data scientists to work with data-intensive real-time applications.
    Some of the leading organizations such as Google, Dropbox, and Netflix are using
    Python at various levels to enhance their software. In this chapter, we will discuss
    Python installation on the Windows operating system, different Python IDEs, the
    fundamental data types available with Python, control flow statements, Python
    functions, and different Python libraries for data science.'
