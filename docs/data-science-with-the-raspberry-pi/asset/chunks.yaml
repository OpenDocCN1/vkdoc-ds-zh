- fmt: '# Connectivity


    The Raspberry Pi 4 model B has onboard Wi-Fi, Bluetooth and Gigabit Ethernet.
    These features come in handy for accessing the Raspberry Pi remotely, making it
    a desirable choice of hardware for Internet of Things (IoT) projects. This also
    frees up the USB ports and GPIO pins for connecting external Wi-Fi and Bluetooth
    modules.


    ## Setting Up the Raspberry Pi


    This section explains how to set up the Raspberry Pi.


    ### microSD Memory Card


    The Raspberry Pi, unlike desktops and laptops, uses a microSD memory card for
    storing the files, applications, and even the operating system. microSD memory
    cards are small compared to hard disks and are easy to use. A minimum of 8GB of
    memory is required by the Pi. A 16GB or 32GB microSD memory card is recommended
    for data science projects. Class 10 ultra-high-speed (UHS) memory cards are recommended
    for faster reading/writing of data.


    ### Installing the OS


    `Raspbian` is the official and most commonly used operating system for the Raspberry
    Pi released by the Raspberry Pi Foundation. It can be easily installed on the
    microSD card using `Raspberry Pi Imager` software, as shown in Figure 3-4. The
    Raspberry Pi also supports other operating systems such as `Ubuntu` and `Windows
    10 IOT Core`.


    ![../images/496535_1_En_3_Chapter/496535_1_En_3_Fig4_HTML.jpg](images/496535_1_En_3_Chapter/496535_1_En_3_Fig4_HTML.jpg)


    Figure 3-4 Interface of the Raspberry Pi Imager software


    Follow these instructions to install the `Raspbian` OS in your Raspberry Pi:


    1. Visit the Downloads page of the Raspberry Pi website and download the `Raspberry
    Pi Imager` software on your operating system.

    2. Once the download is completed, launch the installer by clicking it.

    3. Insert the microSD memory card into your computer. Make sure to back up any
    important data you have in it, as anything stored in the card will be formatted.

    4. Select the `Raspbian` or other desired operating system that you want to install
    and also the microSD card you would like to install it on.

    5. Finally, click the `Write` button and wait for the operation to complete.


    ### Inserting the microSD Memory Card


    The thin metal slot on the underside of the Raspberry Pi, as shown in Figure 3-5,
    is the microSD memory card slot. Once the operating system is installed on the
    microSD memory card, insert it in the memory card slot of the Raspberry Pi.


    ![../images/496535_1_En_3_Chapter/496535_1_En_3_Fig5_HTML.jpg](images/496535_1_En_3_Chapter/496535_1_En_3_Fig5_HTML.jpg)


    Figure 3-5 MicroSD card slot


    As the operating system is stored along with the other files on the microSD memory
    card, it makes the Pi’s memory portable. The microSD memory card can be inserted
    in a new Raspberry Pi, and it will work like a charm.


    ### Connecting a Keyboard and Mouse


    Figure 3-6 shows the USB ports of a Raspberry Pi pin. The Raspberry Pi 4 model
    B has two USB 2.0 ports (black) and two Universal Serial Bus (USB) 3.0 ports (blue).
    USB can be used to connect a keyboard, mouse, webcam, and other USB peripherals.
    USB 3.0 ports are about 10 times faster than the USB 2.0 ports. Normally, peripherals
    like keyboard and mouse are connected to the USB 2.0 ports, leaving the faster
    USB 3.0 ports for devices such as hard disk and webcam.


    ![../images/496535_1_En_3_Chapter/496535_1_En_3_Fig6_HTML.jpg](images/496535_1_En_3_Chapter/496535_1_En_3_Fig6_HTML.jpg)


    Figure 3-6 USB ports


    If you have a wireless keyboard and mouse instead of a wired combination, they
    can be connected to the Raspberry Pi by connecting the USB dongle in one of the
    two black ports. This also frees up one of the USB ports, which can be used to
    connect other devices.


    ### Connecting a Monitor


    The Raspberry Pi can be connected to a monitor through the micro-HDMI port shown
    in Figure 3-7. HDMI stands for High-Definition Multimedia Interface, and the Raspberry
    Pi provides combined audio and video output from this port. The Raspberry Pi model
    4 comes with two micro-HDMI ports with 4K support, which means you can connect
    two 4K monitors to the Raspberry Pi at the same time.


    ![../images/496535_1_En_3_Chapter/496535_1_En_3_Fig7_HTML.jpg](images/496535_1_En_3_Chapter/496535_1_En_3_Fig7_HTML.jpg)


    Figure 3-7 HDMI ports


    If your TV or monitor supports HDMI input, then you will need a micro HDMI-to-HDMI
    cable to connect the Raspberry Pi to your TV or monitor. Older versions of the
    Raspberry Pi come with a single HDMI port. If your TV or monitor has a VGA input,
    then you will need to use a micro HDMI-to-VGA adapter to connect it to the Raspberry
    Pi. Similarly, you can use a HDMI-to-DVI cable for monitors with DVI input.


    ### Powering the Raspberry Pi


    The Raspberry Pi 4 B needs to be powered through a 5.1V DC USB-C type connector,
    as shown in Figure 3-8, with a minimum current input of 3A. It can also be powered
    via the GPIO header. The USB-C type power port is located near a corner of the
    Raspberry Pi. None of the Raspberry Pi models has an on/off switch; once you connect
    the Raspberry Pi to the power supply, it turns on.


    ![../images/496535_1_En_3_Chapter/496535_1_En_3_Fig8_HTML.jpg](images/496535_1_En_3_Chapter/496535_1_En_3_Fig8_HTML.jpg)


    Figure 3-8 USB-C type connector


    Supplying the incorrect voltage or insufficient current can cause damages to the
    Raspberry Pi; hence, it is recommended to use the official Raspberry Pi power
    supply.


    ### Raspberry Pi Enclosure


    The Raspberry Pi needs to be enclosed in a case to prevent the bare connections
    and GPIO headers. A variety of enclosure cases are available for the Raspberry
    Pi, or you can make your own case, but it is recommended to use the official cases
    released by the Raspberry Pi Foundation. Cases with cooling fans are also available.
    They can be used to prevent the Pi from overheating while running heavy-duty applications.


    ## Raspberry Pi Versions


    This section explains the different versions.


    ### Raspberry Pi 1


    The Raspberry Pi B was the first model launched by the Raspberry Pi Foundation
    in 2012, followed by the Pi A in 2013. They had 26 GPIO pins, a 700MHz processor,
    and 256MB/512MB RAM, and they didn’t have any built-in Wi-Fi or Bluetooth. In
    2014, the compact Pi A+ and improved B+ models were released with 40 GPIO pins.


    ### Raspberry Pi 2


    The Raspberry Pi 2 was released in 2015 with an improved 900MHz quad-core processor
    and 1GB RAM. This model had 40 GPIO pins and did not have built-in Wi-Fi or Bluetooth.
    It had four USB 2.0 ports, an Ethernet port, and an HDMI port.


    ### Raspberry Pi 3


    In 2016, the Raspberry Pi 3 was released. It had a 1.2GHz quad-core processor
    with 1GB RAM. This model had 40 GPIO pins, and this was the first Raspberry Pi
    model to have built-in Wi-Fi and Bluetooth. Similar to the Raspberry Pi 2, it
    had four USB 2.0 ports, an Ethernet port, and an HDMI port. Later in 2018, the
    compact Pi 3 A+ and improved Pi 3 B+ models were launched.


    ### Raspberry Pi Zero (W/WH)


    In 2015, a small-sized, low-cost Raspberry Pi Zero with fewer GPIO pins was launched.
    The Pi Zero W was released in 2017 with built-in Wi-Fi and Bluetooth. This was
    followed by the Pi Zero WH that came with pre-soldered GPIO headers.


    ### Raspberry Pi 4


    The Raspberry Pi 4 model B was released in 2019 and had the powerful 1.5GHz quad-core
    processor and 1GB/2GB/4GB RAM options. This was the first model to come with dual
    4K display output, USB-C type power input, and two USB 3.0 ports.'
