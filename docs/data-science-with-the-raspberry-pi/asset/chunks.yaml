    ### 散点图


    散点图是一种使用标记来表示数据点，以展示两个变量之间关系的图表。在数据分析中，散点图有多种用途。例如，将数据点作为一个整体来看，散点图可以揭示数据中的模式和趋势，这反过来有助于数据科学家理解两个变量之间的关系，从而能够提出有效的预测技术。散点图也可用于识别数据中的聚类。它还能揭示数据中存在的异常值，而识别异常值至关重要，因为它们往往会显著影响预测系统的性能。


    创建散点图通常需要两列数据，每列对应图表的一个维度。表中的每一行数据将对应图表中的一个数据点。可以使用 Matplotlib 库中的 `scatter` 函数来创建散点图。为了演示散点图的实用性，我们考虑一个可以从
    Scikit-Learn 库中导入的波士顿房价数据集。该数据集实际上来自卡内基梅隆大学维护的 StatLib 库。它包含 506 个样本，具有 13 个不同的特征属性，例如城镇人均犯罪率（`CRIM`）、每套住宅的平均房间数（`RM`）、径向高速公路可达性指数（`RAD`）等。此外，还有一个目标属性
    `MEDV`，表示自住房屋房价中位数（单位：千美元）。


    以下代码演示了创建波士顿房价数据集 Pandas 数据框的过程，该数据集最初是字典格式。为方便起见，代码中使用 `print` 命令仅显示数据框的前五行。


    ```

    import matplotlib.pyplot as plt

    import numpy as np

    import pandas as pd

    from sklearn.datasets import load_boston

    dataset = load_boston()

    boston_data=pd.DataFrame(dataset.data,columns=dataset.feature_names)

    print(boston_data.head())

    Output:

    CRIM  ZN   INDUS   CHAS  NOX ...  RAD  TAX PTRATIO  B  LSTAT

    0  0.00632  18.0  2.31  0.0  0.538  ...  1.0  296.0  15.3  396.90  4.98

    1  0.02731   0.0  7.07  0.0  0.469  ...  2.0  242.0  17.8  396.90  9.14

    2  0.02729   0.0  7.07  0.0  0.469  ...  2.0  242.0  17.8  392.83  4.03

    3  0.03237   0.0  2.18  0.0  0.458  ...  3.0  222.0  18.7  394.63  2.94

    4  0.06905   0.0  2.18  0.0  0.458  ...  3.0  222.0  18.7  396.90  5.33

    [5 rows x 13 columns]

    ```


    该房价数据集最初是字典形式，并保存在变量 `dataset` 中。13 个特征属性被赋值给键 `data`，目标属性 `MEDV` 被赋值给键 `target`。然后，将这
    13 个特征转换为 Pandas 数据框。现在，可以通过以下代码得到特征变量 `RM` 与目标变量 `MEDV` 的散点图。从图 6-1 中可以看出，房价随着房间数量的增加而上涨。除了这一趋势外，图中还可以看到一些异常值。


