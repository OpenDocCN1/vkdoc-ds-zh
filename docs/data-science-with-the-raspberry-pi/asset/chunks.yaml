- fmt: '# Interfacing a Ultrasonic Sensor with the Raspberry Pi


    Ultrasonic sensors are used to measure the distance of objects by finding the
    time of the sound wave. The `HC-SR04` ultrasonic sensor can be used to measure
    the distance from 2cm to 400cm with 3mm accuracy. Ultrasonic sensors work by sending
    out a sound wave at a frequency of 40kHz, which is above the range of human hearing
    and travels through the air. If there is an obstacle or object, the sound wave
    will bounce back to the sensor. The distance of the object can be calculated by
    multiplying half of the travel time and the speed of sound. Figure [3-14](#496535_1_En_3_Chapter.xhtml#Fig14)
    shows the ultrasonic sensor and its pins where the `VCC` pin needs to be connected
    to the positive terminal of the Raspberry Pi, the `GND` pin can be connected to
    a `GND` pin of the Raspberry Pi, the `Trig` pin is used to trigger the ultrasonic
    sound pulses, and the `Echo` pin produces a pulse when the reflected sound wave
    is received.


    ![../images/496535_1_En_3_Chapter/496535_1_En_3_Fig14_HTML.jpg](images/496535_1_En_3_Chapter/496535_1_En_3_Fig14_HTML.jpg)


    Figure 3-14


    Ultrasonic sensor pin


    Connect the ultrasonic distance sensor to the Raspberry Pi, as shown in Figure
    [3-15](#496535_1_En_3_Chapter.xhtml#Fig15).


    ![../images/496535_1_En_3_Chapter/496535_1_En_3_Fig15_HTML.jpg](images/496535_1_En_3_Chapter/496535_1_En_3_Fig15_HTML.jpg)


    Figure 3-15


    Ultrasonic sensor with the Raspberry Pi GPIO pin


    The `gpiozero` library has an object called `DistanceSensor` that can be used
    to measure distance using the ultrasonic sensor in Python. The `distance` function
    returns the distance measure by the ultrasonic distance senor in meters. Let’s
    multiply the value by 100 to convert it into centimeters. The code in Listing
    [3-4](#496535_1_En_3_Chapter.xhtml#PC4) continuously prints the distance measure
    by the ultrasonic distance sensor in centimeters every second.


    ```

    from gpiozero import DistanceSensor

    from time import sleep

    sensor = DistanceSensor(echo=17, trigger=4)

    while True:

    print(sensor.distance * 100)

    sleep(1)

    Listing 3-4

    Code for calculting distance measured by the Ultrasonic Sensor

    ```


    When the code is running, move the position of the objects placed in front of
    the ultrasonic sensor to get different values.


    # Interfacing the Temperature and Humidity Sensor with the Raspberry Pi


    As the name suggests, these sensors can be used to measure the temperature and
    humidity. They consist of a capacitive humidity sensing element and a thermistor
    for sensing temperature. The temperature and humidity sensor has a dedicated resistive-type
    humidity measurement component, called the *negative temperature coefficient*
    (NTC) temperature measurement component, and an 8-bit microcontroller to output
    the values of temperature and humidity as serial data. A single-bus data format
    is used for the communication and synchronization between the Raspberry Pi and
    the `DHT11` sensor.


    `DHT 11` and `DHT 22` are the generally used temperature and humidity sensors.
    Figure [3-16](#496535_1_En_3_Chapter.xhtml#Fig16) shows the temperature and humidity
    sensor (THD) and Figure [3-17](#496535_1_En_3_Chapter.xhtml#Fig17) explains the
    interfacing of THD with Raspberry Pi where the `VCC` pin needs to be connected
    to the positive terminal of the Raspberry Pi, where the `GND` pin can be connected
    to a `GND` of the Raspberry Pi, and where the `Signal/Data` pin is used for serial
    communication and needs to connect to a GPIO pin.


    ![../images/496535_1_En_3_Chapter/496535_1_En_3_Fig16_HTML.jpg](images/496535_1_En_3_Chapter/496535_1_En_3_Fig16_HTML.jpg)


    Figure 3-16


    Temperature and humidity sensor


    Connect the `DHT 11/22` sensor module to the Raspberry Pi, as shown in Figure
    [3-17](#496535_1_En_3_Chapter.xhtml#Fig17).


    ![../images/496535_1_En_3_Chapter/496535_1_En_3_Fig17_HTML.jpg](images/496535_1_En_3_Chapter/496535_1_En_3_Fig17_HTML.jpg)


    Figure 3-17


    Temperature and humidity sensor with the Raspberry Pi GPIO pin


    Let’s use the `Adafruit_DHT` library to get the temperature and humidity values
    from the sensor. The code in Listing [3-5](#496535_1_En_3_Chapter.xhtml#PC5) continuously
    prints the temperature in Celsius and the humidity percentage.


    ```

    import Adafruit_DHT

    import time

    DHT_SENSOR = Adafruit_DHT.DHT11

    DHT_PIN = 17

    while True:

    humidity, temperature =

    Adafruit_DHT.read(DHT_SENSOR, DHT_PIN)

    if humidity is not None and temperature is not None:

    print("Temperature="{0:0.1f}C)

    humidity={1:0.1f}%".format(temperature, humidity))

    else:

    print("Sensor not connected.");

    time.sleep(3);

    Listing 3-5

    Code for Temperature and Humidity Sensor

    ```


    The `Adafruit` module can be installed in the Raspberry Pi using the following
    code.


    For Python 2:


    ```

    sudo pip install Adafruit_DHT

    ```


    For Python 3:


    ```

    sudo pip3 install Adafruit_DHT

    ```


    # Interfacing the Soil Moisture Sensor with the Raspberry Pi


    Soil moisture sensors are used to detect the moisture present in soil. A soil
    moisture sensor consists of two probes that are used to measure the amount of
    moisture present in the soil. This sensor uses capacitance to measure the dielectric
    permittivity of the soil, which is a function of the moisture content of the soil.
    The sensor is equipped with both analog and digital output, so it can be used
    in both analog and digital modes. But, let’s take the analog signal from the sensor
    and read it using Python. Figure [3-18](#496535_1_En_3_Chapter.xhtml#Fig18) shows
    the soil moisture sensor. Here, the `VCC` pin needs to be connected to the positive
    terminal of the Raspberry Pi, the analog output (`AO`) creates a voltage proportional
    to the dielectric permittivity and therefore the water content of the soil, and
    the digital output (`DO`) creates a pulse when the soil moisture is higher than
    the threshold value. The threshold value is set using the potentiometer in the
    sensor module, and the `GND` pin can be connected to a `GND` of the Raspberry
    Pi.


    ![../images/496535_1_En_3_Chapter/496535_1_En_3_Fig18_HTML.jpg](images/496535_1_En_3_Chapter/496535_1_En_3_Fig18_HTML.jpg)


    Figure 3-18


    Soil moisture sensor


    Connect the soil moisture sensor module to the Raspberry Pi through an `MCP3008`
    ADC, as shown in Figure [3-19](#496535_1_En_3_Chapter.xhtml#Fig19).


    ![../images/496535_1_En_3_Chapter/496535_1_En_3_Fig19_HTML.jpg](images/496535_1_En_3_Chapter/496535_1_En_3_Fig19_HTML.jpg)


    Figure 3-19


    Temperature and humidity sensor with the Raspberry Pi GPIO pin


    Let’s use the `MCP3008` module from the `gpiozero` library to get the values from
    the `MCP3008`. The code in Listing [3-6](#496535_1_En_3_Chapter.xhtml#PC8) continuously
    prints the analog value of the soil moisture sensor every second.


    ```

    from gpiozero import MCP3008

    from time import sleep

    soil_sensor = MCP3008(0)

    while True:

    print(soil_sensor.value)

    sleep(1)

    Listing 3-6

    Code for interfacing soil moisture sensor

    ```'
