- fmt: '### Handling Outliers


    In a dataset, outliers are the observations (i.e., data) that stand out from all
    the other observations. In other words, *outliers* are data points that are distant
    from all the other data in the dataset. Outliers can originate either due to errors
    in measurement/data entry or due to genuine extreme values in the data. For instance,
    consider the series of numbers 112, 123, 120, 132, 106, 26, 118, 140, and 125.
    In this series, all the numbers are close to 100 except 26. Hence, 26 is an outlier
    as it is vastly distant from the rest of the numbers.


    Outliers can be detected in two ways: using visualization techniques and using
    a mathematical approach. In this section, we introduce two mathematical approaches
    to identify outliers in our data, namely, interquartile range (IQR) and the Z-score.


    *Interquartile range* is a measure of the variability or spread of data in a dataset.
    The data is first ordered and divided into four quarters. The values that divide
    the total range into four quarters are called *quartiles*. Therefore, there will
    be three quartiles for splitting data into four quarters. The quartiles are Q[1],
    Q[2], and Q[3], where Q[2] is the median for the entire data, Q[1] is the median
    for the upper half of the data, and Q[3] is the median for the lower half of the
    data. IQR is the difference between the third quartile and first quartile, i.e.,
    Q[3] – Q[1].


    To illustrate the process of removing outliers using IQR, let’s first create a
    `DataFrame` with 15 entries that includes outliers.


    ```python

    import pandas as pd

    a={''Name'':[''A'',''B'',''C'',''D'',''E'',''F'',''G'',''H'',''I'',''J'',''K'',''L'',''M'',''N'',''O''],

    ''Weight'':[56,62,48,72,15,80,76,64,68,180,75,47,58,63,71]}

    df=pd.DataFrame.from_dict(a)

    print(df.head())

    Output:

    Name  Weight

    0    A      56

    1    B      62

    2    C      48

    3    D      72

    4    E      25

    ```


    In the previous code, we created a database containing the weight in kilograms
    of 15 adults. For convenience, we have named the adults with the letters *A* to
    *M*. Weights of 15kg and 180kg have been included as outliers as it is unlikely
    for healthy adults to weigh so little or much. To detect these outliers, we need
    to compute the 25 percent and 75 percent quartile values, Q1 and Q3, respectively.
    From these values, the IQR value can be calculated by determining the difference
    of Q3 – Q1. This process is illustrated here:


    ```python

    Q1=df.Weight.quantile(0.25)

    Q3=df.Weight.quantile(0.75)

    IQR=Q3-Q1

    print(''Q1='',Q1,''Q3='',Q3,''IQR='',IQR)

    Output:

    Q1= 57.0 Q3= 73.5 IQR= 16.5

    ```


    By comparing the entries in the `DataFrame` object with the quartiles calculated
    previously, it can be seen that there are four values below Q1, seven values between
    Q1 and Q3, and four values above Q3. But we know that there is only one outlier
    below Q1 and one outlier above Q3. To detect those outliers, we need to form an
    interval with a lower limit much below Q1 and an upper limit well above Q3. Once
    these limits are established, then it will be safe to consider that the values
    below the lower limit and the values above the upper limit will be outliers. This
    is illustrated in the following code:


    ```python

    lower_limit = Q1 - 1.5 * IQR

    upper_limit = Q3 + 1.5 * IQR

    df1=df[(df.Weight  upper_limit)]

    print(df1)

    Output:

    Name  Weight

    4    E      25

    9    J     180

    ```


    It can be seen that the limits created using the IQR value have detected the outliers
    in our data accurately. Now these outliers can be easily filtered out using the
    following code:


    ```python

    df2=df.drop(df1.index)

    print(df2)

    Output:

    Name  Weight

    0     A      56

    1     B      62

    2     C      48

    3     D      72

    5     F      80

    6     G      76

    7     H      64

    8     I      68

    10    K      75

    11    L      47

    12    M      58

    13    N      63

    14    o      71

    ```


    ### Z-Score


    The Z-score, also called the *standard score*, gives an idea of how far away a
    data point is from the mean value. Technically, the Z-score fits the data in a
    normal distribution and measures the number of standard deviations by which the
    data points are about the mean value of the entire dataset, as illustrated in
    Figure [5-1](#496535_1_En_5_Chapter.xhtml#Fig1).


    ![../images/496535_1_En_5_Chapter/496535_1_En_5_Fig1_HTML.jpg](images/496535_1_En_5_Chapter/496535_1_En_5_Fig1_HTML.jpg)


    Figure 5-1


    Normal distribution of data for outlier detection based on the Z-score


    The Figure [5-1](#496535_1_En_5_Chapter.xhtml#Fig1) shows that each data point
    is mapped along a normal distribution centered at the zero mean. The data points
    that are too far from the zero mean are treated as outliers. In the majority of
    cases, the threshold is fixed as 3, and any data point beyond 3σ or -3σ is treated
    as an outlier. Let’s take the same database that we used in the previous section
    and identify the outliers using the Z-score.


    ```python

    import pandas as pd

    from scipy import stats

    import numpy as np

    a={''Name'':[''A'',''B'',''C'',''D'',''E'',''F'',''G'',''H'',''I'',''J'',''K'',''L'',''M'',''N'',''O''],

    ''Weight'':[56,62,48,72,15,80,76,64,68,180,75,47,58,63,71,]}

    df=pd.DataFrame.from_dict(a)

    z = np.abs(stats.zscore(df.Weight))

    print(z)

    df1=df[z>3]

    print(df1)

    Output:

    Name  Weight

    9    J     180

    ```


    From the previous code, it can be seen that the Z-score corresponding to the weight
    value of 180 exceeds the threshold of 3, and hence it is displayed as an outlier.
    Unfortunately, the weight value of 15 is not detected as an outlier. The reason
    for this could be understood by comparing the value with respect to the mean and
    standard deviation, which can be achieved through the `np.mean` and `np.std` functions,
    as illustrated here:


    ```python

    print(np.mean(df.Weight))

    print(np.std(df.Weight))

    Output:

    67.0

    33.448467827390836

    ```


    Let’s approximate the value of standard deviation as 33.45. It can be seen that
    the difference between the weight value 180 and the mean value is 111, which is
    greater than three times the standard deviation (>3σ), whereas the difference
    between the weight values 15 and the mean value is just 54, which is less than
    two times the standard deviation (<2σ). One way to overcome this problem is to
    reduce the value of threshold. Let’s assume a `Threshold` value of 1.


    ```python

    df1=df[z>1]

    print(df1)

    Output:

    Name  Weight

    4    E      15

    9    J     180

    ```


    From the previous illustration, it can be seen that the ideal threshold of 3 may
    not hold true for every dataset, and hence the threshold should be selected based
    on the distribution of the data. Now similar to the case of IQR, these outliers
    can be simply filtered out using the following code:


    ```python

    df2=df.drop(df.Name[z>1].index)

    print(df2)

    Output:

    Name  Weight

    0     A      56

    1     B      62

    2     C      48

    3     D      72

    5     F      80

    6     G      76

    7     H      64

    8     I      68

    10    K      75

    11    L      47

    12    M      58

    13    N      63

    14    o      71

    ```'
