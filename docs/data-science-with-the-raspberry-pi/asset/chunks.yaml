- fmt: '# Outlier Detection Using K-Means Clustering


    Clustering is an exploratory data analysis technique used in unsupervised learning
    problems, i.e., when there is no prior knowledge about the data. The idea behind
    clustering is to group the data points in a dataset into a number of subgroups
    called *clusters*. The data points in each cluster are more similar to the other
    points in the same cluster than those of other clusters.


    The technique that is used widely for clustering operations is the centroid-based
    method called *k-means clustering*, which is an iterative algorithm that splits
    the dataset into k nonoverlapping clusters where each data point is assigned to
    only one cluster. The condition for assigning data points to a cluster is that
    the sum of the squared overlapping clusters’ distance of the data points to the
    cluster’s centroid is at a minimum. The k-means algorithm works as follows:


    1. Specify the number of clusters.

    2. Randomly select center points for each cluster, also called *centroids*.

    3. Calculate the distance between each data point and the cluster centroids, and
    assign the points to the cluster whose distance is minimum.

    4. Recompute the centroid for each cluster by taking the average of all the data
    points assigned to the cluster.

    5. Iterate steps 3 and 4 until there is no change to the centroids.


    In addition to clustering the data, the k-means algorithm can be used to identify
    outliers present in the data. The idea behind this approach is to sort the distances
    from each data point to the cluster centroid in ascending order and treat a portion
    of the data points that have the maximum distance from the centroid as outliers.


    To illustrate this approach, let’s look at the Boston housing dataset. As we discussed
    in Chapter [7](#496535_1_En_7_Chapter.xhtml), the average number of rooms per
    dwelling (RM) and the medium value of owner-occupied homes in the thousands (MEDV)
    are highly correlated. So, these two parameters are taken as two-dimensional data
    for the clustering algorithm, as illustrated in the following code:


    ```

    import matplotlib.pyplot as plt

    import numpy as np

    import pandas as pd

    from sklearn.cluster import KMeans

    from sklearn.preprocessing import scale

    from numpy import sqrt, random, array, argsort

    from sklearn.datasets import load_boston

    dataset = load_boston()

    boston_data=pd.DataFrame(dataset.data,columns=dataset.feature_names)

    x=boston_data[''RM'']

    y=dataset.target

    x=x.to_numpy() # convert pandas series data to numpy array

    x=x.reshape(x.shape[0],1)

    x=scale(x)

    y=y.reshape(y.shape[0],1)

    y=scale(y)

    X=np.zeros((np.shape(x)[0],2))

    X[:,0]=x[:,0]

    X[:,1]=y[:,0]

    ```


    The features of the dataset are first loaded to a dataframe. The column corresponding
    to the feature RM is moved from the dataframe to the variable `x`. Since the RM
    feature stored in variable `x` is in the Pandas series format, it is converted
    to a NumPy array using the `to_numpy` function, making it viable for applying
    the k-means algorithm. This array is then reshaped as it has to be stored along
    with the target variable MEDV in a two-dimensional array. Then an additional scaling
    of the parameter is done by using the `scale` function in the `sklearn` package.
    This is done to normalize the data within a particular range. In a similar fashion,
    the target MEDV feature (which by default is a NumPy array) is also stored in
    the variable `y`, reshaped and scaled. The two variables `x` and `y` are then
    combined in the variable `X` thereby making it a two-dimensional variable. The
    application of k-means algorithm to this variable is illustrated in the following
    code:


    ```

    km=KMeans(n_clusters=1).fit(X)

    distance = km.transform(X)

    indexes = np.argsort(distance.ravel())[::-1][:20]

    ```


    The `Kmeans` function imported from the `sklearn` package can be used to implement
    the clustering algorithm. This function can take inputs such as the number of
    clusters, the maximum number of iterations, and more. In our code, we are giving
    an input of one for number of clusters. In other words, we are going to group
    all the data points into a single cluster. Since the maximum number of iterations
    is not specified, the default value of 300 iterations is taken by the function.
    After fitting the k-means algorithm to our data, the next step is to compute the
    distance of each data point from the cluster centroid. This is done using the
    `transform` function in the `sklearn` package. The resulting distance variable
    is also an *n*-dimensional NumPy array. Therefore, it is first flattened using
    the `ravel` function, and then the flattened array is sorted in descending order.
    This means the array starts with the data points that are further from the cluster
    center and ends with the points that are closer to the center. This sorting is
    done using the `argsort` function, which provides the indexes corresponding to
    the sorted data points.


    We know that outliers are abnormal data points that lie far away from the other
    data points in the dataset. But what is considered abnormal is left to the analyst
    who is aware of the requirements of the analysis. In the case of the Boston housing
    data, the outliers are the high median value for homes with fewer rooms (overpriced),
    the low median value for homes with more rooms (erroneous), and also depending
    on requirements the median value of the number of room combinations beyond a particular
    limit. To detect these outliers, we randomly pick the first 20 indexes from the
    sorted index array and mark the data points corresponding to those indexes in
    a scatter plot of all data points, as illustrated here:


    ```

    f,ax=plt.subplots()

    ax.scatter(X[:,0],X[:,1])

    ax.scatter(X[indexes][:,0],X[indexes][:,1],edgecolors=''r'',

    facecolors=''none'', s=100)

    plt.xlabel(''MEDV'')

    plt.ylabel(''RM'')

    f.show()

    ```


    Figure [8-5](#496535_1_En_8_Chapter.xhtml#Fig5) shows a scatter plot of the average
    number of rooms per dwelling against the median value of owner-occupied homes.
    The outliers in the data are indicated by those points with red circles around
    them.


    ![../images/496535_1_En_8_Chapter/496535_1_En_8_Fig5_HTML.jpg](images/496535_1_En_8_Chapter/496535_1_En_8_Fig5_HTML.jpg)


    **Figure 8-5** Outliers detected using the k-means clustering algorithm


    # 9. Case Studies


    This chapter presents real-world case studies for implementing data science concepts.
    Three scenarios are considered: data science concepts for human emotion classification
    with EEG signals, image data, and Industry 4.0.


    For human emotion classification, EEG signals of humans are extracted using a
    NeuroSky MindWave Mobile kit, and the EEG signals are received and analyzed in
    the Raspberry Pi. A NeuroSky MindWave Mobile kit and the Raspberry Pi can be connected
    via Bluetooth. In image data, data science steps are applied to preprocess the
    image data for further analysis. In the Industry 4.0 case study, the Raspberry
    Pi acts as a localized cloud. Here, many sensors are connected to the Raspberry
    Pi, and the signals from the sensors are converted to structured data for further
    analysis and visualization.'
