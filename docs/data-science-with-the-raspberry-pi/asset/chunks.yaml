    ### 异常值


    在统计学中，异常值是指与其他观测数据存在显著差异的数据点。异常值可能源于测量过程中的变异性，也可能表明实验误差；异常值有时会从数据集中排除。图 1-3 展示了一个异常值数据的示例。异常值数据会对某些类型的模型造成问题，进而影响决策制定。


    ![../images/496535_1_En_1_Chapter/496535_1_En_1_Fig3_HTML.jpg](img/496535_1_En_1_Fig3_HTML.jpg)


    图 1-3


    异常值数据


    ### 数据变换


    数据变换可以通过多种方法实现，例如归一化、最小-最大值运算、相关性信息等。


    ## 数据可视化


    根据用户的需求，可以借助图表、图形等可视化工具对数据进行分析。这些可视化工具有助于人们理解数据集中特定变量的趋势、变化和偏差。可视化技术可作为探索性数据分析的一部分来使用。


    ## 数据分析


    进一步地，可以借助数学技术（例如统计技术）对数据进行分析。改进点、偏差和变化将以数值形式确定。我们还可以通过结合可视化工具的结果和分析技术来生成分析报告。


    ### 建模与算法


    如今，许多机器学习算法被用于从原始数据中预测有用信息。例如，神经网络可以根据用户的历史行为，识别出愿意向孤儿捐款的用户。在此场景中，可以根据用户的教育背景、活动、职业、性别等收集其历史行为数据，并利用这些收集到的数据训练神经网络。每当有新用户的数据输入该模型时，它就能预测该新用户是否会捐款。然而，预测的准确性取决于训练时所使用数据的可靠性和数据量。


    现有许多机器学习算法，例如回归技术、支持向量机、神经网络、深度神经网络、循环神经网络等，均可应用于数据建模。完成数据建模后，可以通过输入新用户的数据并生成预测报告来对模型进行分析。


    ### 报告生成/决策制定


    最后，可以借助可视化工具、数学或统计技术以及模型，基于分析结果生成报告。此类报告在许多场景下都很有帮助，例如预测某个组织、行业或政府的优势与劣势等。报告中的事实与发现能够使决策变得相当简单且明智。此外，根据客户需求，还可以使用某些自动化工具来自动生成分析报告。


    ## 数据科学的最新趋势


    数据科学中的某些领域正在呈指数级增长，因此将对数据科学家颇具吸引力。以下各节将对此进行讨论。


    ### 数据科学自动化


    在当前的状况下，数据科学仍需要大量人工操作，例如数据处理、数据清洗和数据变换。这些步骤耗费大量时间和计算资源。现代世界要求实现数据科学流程的自动化，例如数据处理、数据清洗、数据变换、分析、可视化和报告生成。因此，自动化领域将成为数据科学行业中的顶级需求。


    ### 基于人工智能的数据分析师


    人工智能技术和机器学习算法可以有效地用于数据建模。特别是，使用深度神经网络的强化学习可根据数据的变化来升级模型的学习能力。同时，机器学习技术也可用于自动化数据科学项目。


    ## 云计算


    如今人们使用的数据量呈指数级增长。一些行业每天都会收集大量数据，因此发现借助本地服务器来存储和分析这些数据十分困难。这使得计算和维护方面的成本变得高昂。因此，他们更倾向于采用云计算，即数据可以存储在云服务器上，并且可以随时随地检索以进行分析。许多云计算公司在其云服务器上提供数据分析平台。数据处理量增长得越多，这个领域就越会获得关注。


    ## 边缘计算


    许多小型行业不需要在云服务器上分析数据，而是需要即时获得分析报告。对于这类应用，边缘设备可能是一种可行的解决方案，用于获取数据、分析数据，并立即以可视化形式或数值形式向用户呈现报告。未来，对边缘计算的需求将显著增加。


    ## 自然语言处理


    自然语言处理可用于从网站、电子邮件、服务器、日志文件等来源提取非结构化数据。此外，NLP 还可用于将文本转换为统一的数据格式。例如，我们可以根据人们在社交媒体上的消息，将其情感转换为数据格式。这将是一种从多种来源收集数据的强大工具，其需求将持续增长。


    ## 为什么要在树莓派上学习数据科学？


    许多书籍在云计算背景下解释了数据科学涉及的不同流程。但本书将结合树莓派的实时应用来讨论数据科学的概念。树莓派板卡可以通过其通用输入/输出（GPIO）引脚连接多种传感器，从而与现实世界进行交互，这使其更易于收集实时数据。由于其体积小、成本低，可以将多个树莓派板卡节点连接成网络，从而实现本地化操作。换句话说，树莓派可以作为一种边缘计算设备，在更靠近信息采集设备的位置进行数据处理和存储，从而克服了与云计算相关的缺点。因此，许多数据处理应用可以通过分布式的这类设备来实现，它们可以管理实时数据并在本地运行分析。本书将帮助您使用树莓派实现实时的数据科学应用。


    # 2. Python 编程基础


    Python 是一种通用动态编程语言，由荷兰程序员吉多·范罗苏姆于 1989 年创建。它是数据科学领域最常用的编程语言。由于用 Python 学习和编写代码比其他语言更容易，因此它是初学者的理想选择。Python
    的广泛使用也归功于其免费且开源的特点。Python 社区开发的大量科学库和软件包使数据科学家能够处理数据密集型的实时应用。一些领先的组织，例如谷歌、Dropbox
    和 Netflix，正在不同层面上使用 Python 来增强其软件。本章中，我们将讨论 Windows 操作系统上 Python 的安装、不同的 Python
    集成开发环境、Python 提供的基本数据类型、控制流语句、Python 函数以及不同的 Python 数据科学库。

    '
- fmt: '# Why Python?


    Python is the most preferred programming language for data scientists because
    of the following reasons:


    - It is an open source programming language with a strong and growing community
    of contributors and users.

    - It has a simpler syntax than other programming languages such as C, C++, and
    Java.

    - It allows users to perform object-oriented programming.

    - It has a large set of libraries that can be used to perform a variety of tasks
    such as developing a website, building machine learning applications, etc.

    - It can be used in embedded, small hardware devices like the Raspberry Pi that
    allows for real-time implementation of various applications.


    # Python Installation


    Most distributions of the Linux operating system come with the preloaded Python
    package, but it has to be installed separately in the case of Windows operating
    system. The procedure to install Python on the Windows operating system is as
    follows:


    ![../images/496535_1_En_2_Chapter/496535_1_En_2_Fig1_HTML.jpg](images/496535_1_En_2_Chapter/496535_1_En_2_Fig1_HTML.jpg)


    Figure 2-1: Installation wizard for Python


    1. Open a browser and go to `Python.org`, the official site for Python.

    2. On that page, click the `Downloads` tab and download the latest version of
    the software on the resulting page.

    3. Once the download is complete, open the installer package. In the installation
    wizard, shown in Figure [2-1](#496535_1_En_2_Chapter.xhtml#Fig1), select `Add
    Python to PATH`, which will ensure that Python is added automatically to your
    system variable path; otherwise, this path must be added manually in the `Environment
    Variables` settings in your system.

    4. Click `Install Now` to install the package.


    After the installation is completed, you can verify the installation by typing
    `python --version` at the command prompt, which will display the version of Python
    installed on the system. If it does not show the version, then there could be
    a problem either with the installation or with the system path variable.


    Refer to the Python documentation available on the official site to understand
    the procedure for downloading additional modules and packages for the software.
    Either you can start working with Python at the command prompt itself or you can
    install one among the various IDEs that are discussed in the next section.


    # Python IDEs


    An *integrated development environment* (IDE) is a software suite that combines
    developer tools into a graphical user interface (GUI), which includes options
    for editing code and building, executing, and debugging programs. A number of
    IDEs are available for Python, each of which comes with its own advantages. Some
    of the commonly used IDEs are discussed here.


    ## PyCharm


    The PyCharm IDE was developed by the Czech company JetBrains. It is a cross-platform
    IDE that can be used on Windows, macOS, and Linux. It provides code analysis and
    a graphical debugger. It also supports web development with Django as well as
    data science with Anaconda. Some of the attractive features of PyCharm are the
    intelligent code completion, a simple package management interface, and the refactoring
    option, which provides the ability to make changes across multiple lines in a
    code.


    ## Spyder


    Spyder is a cross-platform IDE for scientific programming in the Python language.
    Spyder integrates with a number of scientific packages including `NumPy`, `SciPy`,
    `Matplotlib`, `Pandas`, `IPython`, and other open source software. It was released
    under the MIT license.


    ## Jupyter Notebook


    Jupyter Notebook is a web-based interactive computational environment. This notebook
    integrates code and its output in a single document that combines visualizations,
    text, mathematical equations, and other media thereby making it suitable for data
    science applications.


    ## Python Programming with IDLE


    IDLE is a simple cross-platform IDE suitable for beginners in an educational environment.
    It comes with features such as a multiwindow text editor, a Python shell with
    syntax highlighting, and an integrated debugger. Since this is a default editor
    that comes with Python, let’s see how to execute Python code using IDLE.


    There are two ways of executing the Python code in this IDLE. The first way is
    the interactive mode in which you can directly type the code next to the symbol
    `>>>` in the Python shell, as illustrated in Figure [2-2](#496535_1_En_2_Chapter.xhtml#Fig2).
    Each line of code will be executed once you press `Enter`. The disadvantage of
    using the interactive mode is that when you save the code, it is saved along with
    the results, and this implies that you cannot use the saved code for execution
    later.


    ![../images/496535_1_En_2_Chapter/496535_1_En_2_Fig2_HTML.jpg](images/496535_1_En_2_Chapter/496535_1_En_2_Fig2_HTML.jpg)


    Figure 2-2: Running Python code in interactive mode


    The second way is to run the code in script mode where you can open a script window
    and type the entire code there, which can then be saved with a `.py` extension
    to be used later. To open a script file window, go to the `File` menu at the top
    and click `New File`. In the script window, type the same two lines of code, shown
    in Figure [2-2](#496535_1_En_2_Chapter.xhtml#Fig2). Figure [2-3](#496535_1_En_2_Chapter.xhtml#Fig3)
    shows the script file window with the code. Then go to the `File` menu, click
    `Save`, and then save the program by specifying a proper filename. Ensure that
    the filename does not start with a number or have the same name as existing Python
    keywords.


    ![../images/496535_1_En_2_Chapter/496535_1_En_2_Fig3_HTML.jpg](images/496535_1_En_2_Chapter/496535_1_En_2_Fig3_HTML.jpg)


    Figure 2-3: Script file window


    Once the file is saved, the script can be executed by going to the `Run` menu
    at the top and clicking `Run Module`. This will execute the script and print the
    output in the Python shell, as shown in Figure [2-4](#496535_1_En_2_Chapter.xhtml#Fig4).


    ![../images/496535_1_En_2_Chapter/496535_1_En_2_Fig4_HTML.jpg](images/496535_1_En_2_Chapter/496535_1_En_2_Fig4_HTML.jpg)


    Figure 2-4: Output of the script file


    ## Python Comments


    Before we start to discuss the Python data types, it is essential to know about
    comment lines in Python as we will be using them often in our code. There are
    two ways to write comment lines based on the purpose of your comment.


    If you intend to write a short comment, regarding a particular line in the code,
    for yourself, then single-line comments are the best choice. These single-line
    comments can be created by simply beginning the line with a hash (`#`) character,
    and they are terminated automatically by the end of the line. While executing
    the code, the Python compiler will ignore everything after the hash symbol up
    to the end of the line.


    Multiple-line comments are intended to explain a particular aspect of your code
    to others and can be created by adding three single quotes (`''''''`) at the beginning
    and end of the comment. The Python compiler will not ignore these comments, and
    they will appear in the output if your script has nothing else other than the
    comment. These two comments are illustrated using the IDLE Python shell format,
    as shown here:


    ```

    >>> # This is a comment

    >>> "''This is a comment"''

    ''This is a comment''

    ```


    # Python Data Types


    A *data type*, in a programming language, is defined by the type of value that
    a variable can take. Python data types can be primarily classified into numeric
    and sequence data types. The data types that fall under these two categories are
    discussed in this section with relevant illustrations for each.


    ## Numeric Data Types


    Numeric data types are scalar variables that can take numeric values. The categories
    of numeric data types are `int`, `float`, and `complex`. In addition, we will
    discuss the `bool` data type that uses Boolean variables.'
