- fmt: '### Interfacing Cameras with the Raspberry Pi


    Cameras are optical instruments used to record images using an image sensor. An
    image sensor detects and conveys information used to make an image. Cameras can
    be easily interfaced with the Raspberry Pi to get image or video data. There are
    two options available to interface cameras with the Raspberry Pi.


    **Method 1:** The first method is to connect a USB web camera to the Raspberry
    Pi using the USB ports. Figure [3-20](#496535_1_En_3_Chapter.xhtml#Fig20) shows
    a USB web camera. Once the USB web camera is connected properly, it can be accessed
    in Python using the `OpenCV` library. `OpenCV` is a Python library for image processing
    and real-time computer vision. The code in Listing [3-7](#496535_1_En_3_Chapter.xhtml#PC9)
    can be used for connecting the USB web camera to the Raspberry Pi.


    ![../images/496535_1_En_3_Chapter/496535_1_En_3_Fig20_HTML.jpg](images/496535_1_En_3_Chapter/496535_1_En_3_Fig20_HTML.jpg)


    Figure 3-20


    USB web camera


    ```

    import cv2

    videoCaptureObject = cv2.VideoCapture(0)

    result = True

    while(result):

    ret,frame = videoCaptureObject.read()

    cv2.imwrite("/home/pi/Desktop/webcam_image.jpg ",frame)

    result = False

    videoCaptureObject.release()

    cv2.destroyAllWindows()

    Listing 3-7

    Code for Connecting USB Web Cameras with the Raspberry Pi

    ```


    **Method 2:** Another method is to interface a Raspberry Pi camera module via
    the Camera Serial Interface (CSI) port. Figure [3-21](#496535_1_En_3_Chapter.xhtml#Fig21)
    shows the Raspberry Pi camera. There are two Raspberry Pi camera modules available:
    a standard module and a NoIR camera module for taking pictures in the dark. To
    enable the Raspberry Pi camera, open the Raspberry Pi configuration from the main
    menu and enable Camera on the Interfaces tab.


    ![../images/496535_1_En_3_Chapter/496535_1_En_3_Fig21_HTML.jpg](images/496535_1_En_3_Chapter/496535_1_En_3_Fig21_HTML.jpg)


    Figure 3-21


    Raspberry Pi camera with CSI


    The code in Listing [3-8](#496535_1_En_3_Chapter.xhtml#PC10) takes a picture from
    the Raspberry Pi camera module and stores the image in the specified location.


    ```

    from picamera import PiCamera

    from time import sleep

    camera = PiCamera()

    camera.start_preview()

    sleep(5)

    camera.capture(''/home/pi/Desktop/cammodule_img.jpg'')

    camera.stop_preview()

