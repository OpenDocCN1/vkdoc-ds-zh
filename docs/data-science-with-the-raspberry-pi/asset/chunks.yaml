    \ dropping the columns and changing the data using the exploratory data analysis\
    \ section in Chapter [8](#496535_1_En_8_Chapter.xhtml).\n\nFigure [9-5](#496535_1_En_9_Chapter.xhtml#Fig5)\
    \ shows the visualization of a histogram of the mean data in the emotion dataset.\n\
    \n![../images/496535_1_En_9_Chapter/496535_1_En_9_Fig5_HTML.jpg](images/496535_1_En_9_Chapter/496535_1_En_9_Fig5_HTML.jpg)\n\
    \n**Figure 9-5** Histogram of mean for each emotion\n\n# Classifying the Emotion\
    \ Using Learning Models\n\nThe next step after extracting the features is to apply\
    \ a classification algorithm to identify the emotion corresponding to the signals.\
    \ Since we are already aware of the emotions corresponding to each of the signals\
    \ we have used, it is obviously better to go for a supervised learning algorithm\
    \ for classification. Before that, another important task is to split our data\
    \ into training and testing data. Out of the 15 signals for each emotion, let\
    \ us consider the data corresponding to first 12 signals for training and the\
    \ data corresponding to the remaining 3 signals for testing. Also, the labels\
    \ corresponding to the training and testing data should be created. For this,\
    \ we are going to label the emotion Happy as 1, Fear as 2, and Sad as 3. This\
    \ splitting of data as well as the labels is illustrated in the following code:\n\
    \n## 1. k-NN\n\n```python\nm1 = np.ones((15,), dtype=int)\nids = np.concatenate((m1,\
    \ 2*m1, 3*m1), axis=0)\nx_train = np.concatenate((features[:, 0:12], features[:,\
    \ 15:27], features[:, 30:42]), axis=1)\nx_test = np.concatenate((features[:, 12:15],\
    \ features[:, 27:30], features[:, 42:45]), axis=1)\ny_train = np.concatenate((ids[0:12],\
    \ ids[15:27], ids[30:42]))\ny_test = np.concatenate((ids[12:15], ids[27:30], ids[42:45]))\n\
    ```\n\nLet us first use the k-NN algorithm to classify the emotions based on the\
    \ data. k-NN is a simple supervised machine learning algorithm that categorizes\
    \ the available data and assigns new data to a particular category based on a\
    \ similarity score. The k-NN algorithm works by finding the distance between the\
    \ test data and the training data. After finding the distance to each training\
    \ data, the training data is sorted in ascending order of the distance values.\
    \ In this ordered data, the first k data is selected, and the algorithm will assign\
    \ the most frequent label occurring in this to the test data. The Euclidean distance\
    \ is the most commonly used distance measure for the k-NN algorithm, and the distance\
    \ between two data points, `x[i]` and `y[i]`, is given by the following expression:\n\
    \n![$$\\mathrm{Euclidean}\\ \\mathrm{distance}=\\sqrt{\\sum_{\\mathrm{i}=1}^{\\\
    mathrm{k}}{\\left({x_i}-{y_i}\\right)}^2}$$](images/496535_1_En_9_Chapter/496535_1_En_9_Chapter_TeX_IEq8.png)\n\
    \nThe k-NN classification is implemented using the `KNeighborsClassifier` package\
    \ in the `sklearn` Python module. The emotion classification code using this package\
    \ is illustrated here:\n\n```python\nfrom sklearn.neighbors import KNeighborsClassifier\n\
    from sklearn.metrics import confusion_matrix, classification_report\n\nclassifier\
    \ = KNeighborsClassifier(n_neighbors=16)\nclassifier.fit(x_train.T, y_train)\n\
    y_pred = classifier.predict(x_test.T)\ncm = confusion_matrix(y_test, y_pred)\n\
    print(\"confusion matrix\\n\", cm)\nprint(\"Accuracy:\", (sum(np.diagonal(cm))/9)*100)\n\
    ```\n\nOutput:\n\n```\nconfusion matrix\n[[1 0 2]\n [1 2 0]\n [2 0 1]]\nAccuracy:\
    \ 44.44444444444444\n```\n\nThe parameter `n_neighbors` in the previous code indicates\
    \ the value of k, which we have selected as 16. Therefore, 16 neighbors are considered\
    \ for making the classification decision. First, the distance between the test\
    \ data and all the other training data is computed. Then the training data points\
    \ are sorted in ascending order of the computed distance. In the sorted data,\
    \ the labels corresponding to the first 16 data are considered, and the label\
    \ that occurs more out of the 16 is assigned to the test data. This is repeated\
    \ for all nine test signals (three for each emotion), and the results are displayed\
    \ using a confusion matrix, which could be better understood using the information\
    \ in Table [9-2](#496535_1_En_9_Chapter.xhtml#Tab2).\n\n**Table 9-2** Confusion\
    \ Matrix for Emotion Classification Using k-NN\n\n|             | **Happy** |\
    \ **Fear** | **Sad** |\n|-------------|-----------|----------|---------|\n| **Happy**\
    \   | 1         | 0        | 2       |\n| **Fear**    | 1         | 2        |\
    \ 0       |\n| **Sad**     | 2         | 0        | 1       |\n\nIn the confusion\
    \ matrix, the row headers can be treated as inputs, and column headers can be\
    \ treated as outputs. For instance, if we consider the first row, only one of\
    \ the three EEG signals corresponding to the \"happy\" emotion is identified correctly,\
    \ and the remaining two signals are wrongly classified as \"sad\" emotion. Similarly,\
    \ in the second row, two signals corresponding to the \"fear\" emotion are classified\
    \ correctly, and in the third row, one signal corresponding to the \"sad\" emotion\
    \ is identified correctly. To understand better, the diagonal elements in the\
    \ confusion matrix represent the data that is classified correctly, and the remaining\
    \ elements indicate misclassification. In total, four out of the nine test signals\
    \ are classified correctly, giving the system an accuracy of 44.44 percent."
