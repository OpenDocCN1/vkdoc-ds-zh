    ### TensorFlow for Machine Learning


    TensorFlow is an end-to-end open source platform for machine learning created
    by the Google Brain team. TensorFlow has a slew of machine learning models and
    algorithms. It uses Python to provide a front-end API for building applications
    with the framework. Keras is a high-level neural network API that runs on top
    of TensorFlow. Keras allows for easy and fast prototyping and supports both convolutional
    networks and recurrent neural networks.


    # 3. Introduction to the Raspberry Pi


    The Raspberry Pi, or simply the Pi, is a series of small, low-cost, single-board
    computers invented by the Raspberry Pi Foundation in the United Kingdom to promote
    basic computer science and electronics among students around the world. Students
    and tech enthusiasts use the Raspberry Pi to learn programming concepts, build
    hardware projects and robots, and make artificial intelligence projects. It is
    also used in industrial applications.


    ## What Can You Do with the Raspberry Pi?


    A Raspberry Pi board can do pretty much everything a desktop computer can do:
    surf the Internet, watch high-definition videos, listen to music, view and edit
    pictures, perform word processing, make spreadsheets and presentations, write
    and compile code, participate in video conferencing, and even play games.


    ### Physical Computing with the Raspberry Pi


    The Raspberry Pi can also be used to interact with the physical world. This is
    done with the general-purpose input/output (GPIO) pins on the Raspberry Pi board.
    This makes the Raspberry Pi powerful as it can be interfaced with sensors and
    other electric and electronic components such as LEDs, servo and stepper motors,
    relays, etc.


    ### How to Program the Raspberry Pi?


    The Raspberry Pi comes with two pre-installed languages (Scratch and Python),
    but it also supports other languages. Scratch is a visual programming language
    for children, whereas Python is a high-level general-purpose programming language;
    both languages are easy to learn. If you learn to program in Python, then you
    can do everything that’s possible with the Raspberry Pi.


    ## Raspberry Pi Hardware


    The Raspberry Pi Foundation released the first Raspberry Pi, the Raspberry Pi
    model B, in 2012\. A number of improved versions were released after that, and
    we will look at all those versions later. The latest version is the Raspberry
    Pi 4 model B, released in June 2019. Figure [3-1](#496535_1_En_3_Chapter.xhtml#Fig1)
    shows the top view of a Raspberry Pi board with its many I/O ports. Let’s take
    a look at its hardware specifications and other features.


    ![../images/496535_1_En_3_Chapter/496535_1_En_3_Fig1_HTML.jpg](images/496535_1_En_3_Chapter/496535_1_En_3_Fig1_HTML.jpg)


    Figure 3-1


    Raspberry Pi hardware


    ### System on a Chip


    The *system on a chip* (SoC) , shown in Figure [3-2](#496535_1_En_3_Chapter.xhtml#Fig2),
    is the brain of the Raspberry Pi. This small chip consists of many important parts:
    the central processing unit (CPU), the graphics processing unit (GPU), and the
    digital signal processor.


    ![../images/496535_1_En_3_Chapter/496535_1_En_3_Fig2_HTML.jpg](images/496535_1_En_3_Chapter/496535_1_En_3_Fig2_HTML.jpg)


    Figure 3-2


    System on a chip


    The Raspberry Pi 4 model B has the powerful Broadcom BCM2711 (1.5 GHz 64-bit quad-core)
    SoC. The Pi’s CPU performs operations such as basic arithmetic, logic, controlling,
    and input/output, while the Pi’s GPU is used for handling multimedia tasks such
    as digital image processing, drawing 3D graphics, and playing games.


    ### Raspberry Pi RAM


    Random access memory (RAM) is the black rectangle located next to the SoC in the
    Raspberry Pi 4 model B, as shown in Figure [3-3](#496535_1_En_3_Chapter.xhtml#Fig3).
    In previous versions of the Raspberry Pi, the RAM was packed inside the SoC. The
    Pi 4 offers three choices of LPDDR4 RAM: 1GB, 2GB, and 4GB.


    ![../images/496535_1_En_3_Chapter/496535_1_En_3_Fig3_HTML.jpg](images/496535_1_En_3_Chapter/496535_1_En_3_Fig3_HTML.jpg)


    Figure 3-3


    Raspberry Pi RAM


    RAM stores the short-term data used by the applications, and this data will be
    deleted when the Raspberry Pi is turned off. The RAM is shared by both the central
    processing unit and the graphics processing unit.'
