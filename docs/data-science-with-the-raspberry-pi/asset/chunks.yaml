    ## Python 注释


    在我们开始讨论 Python 数据类型之前，有必要了解 Python 中的注释行，因为我们会在代码中经常使用它们。根据注释的目的，有两种编写注释行的方法。


    如果你想为自己编写关于代码中某一行简短说明，那么单行注释是最佳选择。这些单行注释只需在行首使用井号（`#`）字符即可创建，并会在行尾自动结束。执行代码时，Python
    编译器会忽略井号符号之后直到行尾的所有内容。


    多行注释用于向他人解释代码的特定方面，可以通过在注释的开头和结尾添加三个单引号（`''''''`）来创建。Python 编译器不会忽略这些注释，如果脚本中除了注释没有其他内容，它们会出现在输出中。这两种注释在
    IDLE Python shell 格式中的示例如下：


    ```

    >>> # 这是一个注释

    >>> "''这是一个注释"''

    ''这是一个注释''

    ```


    # Python 数据类型


    在编程语言中，*数据类型* 由变量可以取值的类型定义。Python 数据类型主要可分为数字型和序列型两类。本节将讨论属于这两类的数据类型，并为每种类型提供相关示例。


    ## 数字型数据类型


    数字型数据类型是可以取数值的标量变量。数字型数据类型的类别包括 `int`、`float` 和 `complex`。此外，我们还将讨论使用布尔变量的 `bool`
    数据类型。

    '
- fmt: "### `int`\n\nThe `int` data type represents integers that are signed whole\
    \ numbers without a decimal point. The code in Listing [2-1](#496535_1_En_2_Chapter.xhtml#PC3)\
    \ displays the data type of an integer.\n\n```\na=5\n\"'print the data type of\
    \ variable a using type() funcion\"'\nprint(\"a is of type\",type(a))\nOutput:\n\
    a is of type \nListing 2-1\nInteger Data Type\n```\n\n### `float`\n\nThe `float`\
    \ data type represents floating-point numbers with a decimal point separating\
    \ the integer and fractional parts. The code in Listing [2-2](#496535_1_En_2_Chapter.xhtml#PC4)\
    \ prints the data type of a float value.\n\n```\na = 5.0\nprint('a is of type',type(a))\n\
    Output:\na is of type \nListing 2-2\nfloat Data Type\n```\n\n### `complex`\n\n\
    The `complex` data type represents complex numbers of the form *a*+*bj* where\
    \ *a* and *b* are the real part and imaginary part, respectively. The numbers\
    \ *a* and *b* may be either integers or floating-point numbers. The code in Listing\
    \ [2-3](#496535_1_En_2_Chapter.xhtml#PC5) prints the data type of a complex number.\n\
    \n```\na=3.5+4j\nprint('a is of type',type(a))\nOutput :\na is of type \nListing\
    \ 2-3\ncomplex Data Type\n```\n\n### `bool`\n\nIn Python, Boolean variables are\
    \ defined by `True` and `False` keywords. As Python is case sensitive, the keywords\
    \ `True` and `False` must have an uppercase first letter. Listing [2-4](#496535_1_En_2_Chapter.xhtml#PC6)\
    \ illustrates the `bool` data type.\n\n```\na= 8>9\nprint('a is of type',type(a))\n\
    print(a)\nOutput:\na is of type \nFalse\nListing 2-4\nbool Data Type\n```\n\n\
    Boolean values can be manipulated with Boolean operators, which include `and`,\
    \ `or`, and `not`, as illustrated in Listing [2-5](#496535_1_En_2_Chapter.xhtml#PC7).\n\
    \n```\na = True\nb = False\nprint(a or b)\nOutput:\nTrue\nListing 2-5\nManipulation\
    \ of boolean Data Type\n```\n\n### Numeric Operators\n\nTable [2-1](#496535_1_En_2_Chapter.xhtml#Tab1)\
    \ summarizes the numeric operations available in Python that can be applied to\
    \ the numeric data types.\n\nTable 2-1\n\nNumeric Operators in Python\n\n| Operator\
    \ | Operation |\n| --- | --- |\n| `( )` | Parentheses |\n| `**` | Exponentiation\
    \ |\n| `*` | Multiplication |\n| `/` | Division |\n| `+` | Addition |\n| `-` |\
    \ Subtraction |\n| `%` | Modulo operation |\n\nThe operators in Table [2-1](#496535_1_En_2_Chapter.xhtml#Tab1)\
    \ are listed in their order of precedence. When more than one operation is performed\
    \ in a particular line of your code, the order of execution will be according\
    \ to the order of precedence in Table [2-1](#496535_1_En_2_Chapter.xhtml#Tab1).\
    \ Consider the example `2*3+5` where both multiplication and addition are involved.\
    \ Since multiplication has higher precedence than addition, as observed from Table\
    \ [2-1](#496535_1_En_2_Chapter.xhtml#Tab1), the multiplication operator (`*`)\
    \ will be executed first giving `2*3=6`, followed by the addition operator (`+`),\
    \ which would give the final result of `6+5=11`.\n\n### Sequence Data Types\n\n\
    Sequence data types allow multiple values to be stored in a variable. The five\
    \ categories of sequence data types are `list`, `tuple`, `str`, `set`, and `dict`.\n\
    \n#### `list`\n\nLists are the most commonly used data type in Python by data\
    \ scientists. A list is an ordered sequence of elements. The elements in the list\
    \ need not be of the same data type. A list can be declared as items separated\
    \ by commas enclosed within square brackets, `[]`. Lists are mutable; i.e., the\
    \ value of the elements in the list can be changed. The elements in the list are\
    \ indexed starting from zero, and hence any element in the list can be accessed\
    \ by its corresponding index, as illustrated in Listing [2-6](#496535_1_En_2_Chapter.xhtml#PC8).\
    \ The index should be integers, and using any other data type for index will result\
    \ in `TypeError`. Similarly, trying to access an index outside the range of the\
    \ list will result in `IndexError`.\n\n```\na = [1, 2.5, 5, 3+4j, 3, -2]\nprint(\"\
    a is of type\",type(a))\n\"'print the first value in the list\"'\nprint(\"a[0]=\"\
    ,a[0])\n\"'print the third value in the list\"'\nprint(\"a[2]=\",a[2])\n\"' print\
    \ the values from index 0 to 2\"'\nprint(\"a[0:3]=\",a[0:3])\n\"'print the values\
    \ from index 4 till the end of the list\"'\nprint(\"a[4:]=\",a[4:])\n\"'Change\
    \ the value at the index 3 to 4\"'\na[3]=4\nprint(\"a=\",a)\n\"'fractional index\
    \ leads to TypeError\"'\nprint(a[1.5])\n\"out of range index leads to IndexError\"\
    '\nprint(a[8])\nOutput of line 2: a is of type \nOutput of line 4: a[0]= 1\nOutput\
    \ of line 6: a[2]= 5\nOutput of line 8: a[0:3]= [1, 2.5, 5]\nOutput of line 10:\
    \ a[4:]= [3, -2]\nOutput of line 13: a= [1, 2.5, 5, 4, 3, -2]\nOtuput of line\
    \ 15: TypeError: list indices must be integers or slices, not float\nOutput of\
    \ line 17: IndexError: list index out of range\nListing 2-6\nOperations in a List\n\
    ```\n\nConsider two lists stored in the variables `a` and `b`, respectively. Table\
    \ [2-2](#496535_1_En_2_Chapter.xhtml#Tab2) shows some additional operations provided\
    \ by Python that can be performed on the lists `a` and `b`. Some of these functions\
    \ apply to tuples, strings, and sets as well.\n\nTable 2-2\n\nList Operations\
    \ in Python\n\n| Function | Description |\n| --- | --- |\n| `a+b` | Concatenates\
    \ the two lists `a` and `b` |\n| `a*n` | Repeats the list `a` by `n` times where\
    \ `n` is an integer |\n| `len(a)` | Computes the number of elements in list `a`\
    \ |\n| `a.append()` | Adds an element to the end of list `a` |\n| `a.remove()`\
    \ | Removes an item from list `a` |\n| `a.pop()` | Removes and returns an element\
    \ at the given index in list `a` |\n| `a.index()` | Returns the index of the first\
    \ matched item in list `a` |\n| `a.count()` | Returns the count of number of items\
    \ passed as an argument in list `a` |\n| `a.sort()` | Sorts items in list `a`\
    \ in ascending order |\n| `a.reverse()` | Reverses the order of items in list\
    \ `a` |\n\n#### `tuple`\n\nA tuple is also an ordered sequence of elements like\
    \ a list, but the difference is that the tuples are immutable; i.e., the values\
    \ in a tuple cannot be changed. Trying to change the value of an element in a\
    \ tuple will result in `TypeError`. By storing data that doesn’t change as tuples,\
    \ it can be ensured that they remain write-protected. Tuples can be declared as\
    \ items separated by commas enclosed within parentheses, `()`. Tuples can also\
    \ be indexed in the same way as lists, as described in Listing [2-7](#496535_1_En_2_Chapter.xhtml#PC9).\n\
    \n```\na = (1, 3, -2, 4, 6)\nprint(\"a is of type\",type(a))\nprint(\"a[3]=\"\
    ,a[3])\na[2] = 5\nOutput of line 2: a is of type \nOutput of line 3: a[3]= 4\n\
    Output of line 4: TypeError: 'tuple' object does not support item assignment\n\
    Listing 2-7\nOperations in a Tuple\n```\n\n#### `str`\n\nThe `str` data type represents\
    \ a string of characters. The string can be declared as characters enclosed within\
    \ double quotes (`\" \"`). Single quotes (`' '`) can also be used, but since they\
    \ appear as apostrophes in some words, using double quotes can avoid confusion.\
    \ The characters in a string are indexed in the same way as list and tuples. The\
    \ space between two words in a string is also treated as a character. Like tuples,\
    \ strings are also immutable and described in Listing [2-8](#496535_1_En_2_Chapter.xhtml#PC10).\n\
    \n```\na = \"Hello World!\"\nprint(\"a is of type\",type(a))\nprint(\"a[3:7]=\"\
    ,a[3:7]\na[2] = \"r\"\nOutput of line 2: a is of type \nOutput of line 3: a[3:7]=\
    \ lo W\nOutput of line 4: TypeError: 'str' object does not support item assignment\n\
    Listing 2-8\nOperations in a String\n```"
