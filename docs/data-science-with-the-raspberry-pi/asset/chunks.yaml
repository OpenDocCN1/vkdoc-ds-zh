    people on a government policy. First, the objectives of the problem can be set
    as “To collect the opinion of the people about the government policy.” Then, the
    data scientists decide on the kind of data that can support the objective and
    the resources of data. For the example problem, the possible data is social media
    data, including text messages and opinion polls of various categories of people,
    with information about their education level, age, occupation, etc. Before starting
    the data collection, a good work plan is essential for collecting the data from
    various sources. Setting the objectives and work plan can reduce the time spent
    collecting the data and can help to prepare the report.


    ## Data Acquisition


    There are many types of structured open data available on the internet that we
    call *secondary data*, because that kind of data is collected by somebody and
    structured into some tabular format. If the user wants to collect the data directly
    from a source, that is called *primary data*. Initially, the unstructured data
    is collected via many resources such as mobile devices, emails, sensors, cameras,
    direct interaction with people, video files, audio files, text messages, blogs,
    etc.


    ## Data Preparation


    Data preparation is the most important part of the data science process. Preparing
    the data puts the data into proper form for knowledge extraction. There are three
    steps in the data preparation stage.


    1.  Data processing


    2.  Data cleaning


    3.  Data transformation


    ### Data Processing


    This step is important as it is required to check the quality of data while we
    import it from various sources. This quality checking is done to ensure that the
    data is in the correct data type, standard format, and has no typos or errors
    in the variables. This step will reduce data issues when doing analysis. Moreover,
    in this phase, the collected unstructured data can be organized in the form of
    structured data for analysis and visualization.


    ### Data Cleaning


    Once the data processing is done, cleaning the data is required as the data might
    still have some errors. These errors will affect the actual information present
    in the data. Possible errors are as follows:


    *   Duplicates


    *   Human or machine errors


    *   Missing values


    *   Outliers


    *   Inappropriate values


    ### Duplicates


    In the database, some data is repeated multiple times, which results in *duplicates*.
    It is better to check and remove the duplicates to reduce the overhead in computation
    during data analysis.


    ### Human or Machine Errors


    The data is collected from sources either by humans or by machines. Some errors
    are inevitable during this process due to human carelessness or machine failure.
    The possible solution to avoid these kinds of errors is to match the variables
    and values with standard ones.


    ### Missing Values


    While converting the unstructured data into a structured form, some rows and columns
    may not have any values (i.e., empty). This error will cause discontinuity in
    the information and make it difficult to visualize it. There are many built-in
    functions available in programming languages we can use to check if the data has
    any missing values.'
