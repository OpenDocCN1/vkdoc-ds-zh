- fmt: '### Histogram

    Histogram plots work by splitting the data in a variable into different ranges,
    called *bins*; then they count the data points in each bin and plot them as vertical
    bars. These types of plots can give a good idea about the approximate distribution
    of numerical data. The width of the bins, i.e., the range of values in each bin,
    is an important parameter, and the one that best fits the data has to be selected
    by trying out different values.


    To demonstrate the histogram plot, let’s consider the California housing dataset
    that is available in the Scikit-Learn library. This dataset, derived from the
    1990 U.S. Census, uses one row per census block group. A block group is the smallest
    geographical unit for which the U.S. Census Bureau publishes sample data (a block
    group typically has a population of 600 to 3,000 people). The dataset consists
    of 8 parameters such as median income in block, median house age in block, average
    number of rooms, etc., and one target attribute, which is the median house value
    for California districts. There are a total of 20,640 data points (rows) in the
    data. The following code plots a histogram that shows the distribution of blocks
    based on the median age of houses within the blocks. Figure [6-4](#496535_1_En_6_Chapter.xhtml#Fig4)
    shows the histogram plot. A lower number normally suggests a newer building.


    ![../images/496535_1_En_6_Chapter/496535_1_En_6_Fig4_HTML.jpg](images/496535_1_En_6_Chapter/496535_1_En_6_Fig4_HTML.jpg)


    **Figure 6-4** – Distribution of blocks based on median age of houses in the blocks


    ```

    import matplotlib.pyplot as plt

    from sklearn.datasets import fetch_california_housing

    import pandas as pd

    dataset = fetch_california_housing()

    df=pd.DataFrame(dataset.data,columns=dataset.feature_names)

    print(df.head())

    Output:

    MedInc  HouseAge    AveRooms  ...  AveOccup  Latitude  Longitude

    0    8.3252      41.0    6.984127  ...  2.555556     37.88    -122.23

    1    8.3014      21.0    6.238137  ...  2.109842     37.86    -122.22

    2    7.2574      52.0    8.288136  ...  2.802260     37.85    -122.24

    3    5.6431      52.0    5.817352  ...  2.547945     37.85    -122.25

    4    3.8462      52.0    6.281853  ...  2.181467     37.85    -122.25

    plt.hist(df[''HouseAge''],bins=20)

    plt.xlabel("median age of houses")

    plt.ylabel("Frequency")

    plt.show()

    ```


    From the histogram plot in Figure [6-4](#496535_1_En_6_Chapter.xhtml#Fig4), we
    can see that most houses in the blocks are distributed in the middle, which indicates
    that the number of new blocks and very old blocks are lower compared to those
    with an average age.


    ### Bar Chart

    Bar charts are often used by data scientists in their presentations and reports
    to represent categorical data as horizontal or vertical rectangular bars whose
    length or height corresponds to the value of the data that they represent. Normally,
    one of the axes will represent the category of data, while the other axis will
    represent the corresponding values. Therefore, bar graphs are the ideal choice
    for comparing different categories of data. Bar charts can also be used for conveying
    the development of one or multiple variables over a period of time.


    Even though bar charts look similar to histogram plots, there are subtle differences
    between them. For instance, histograms are used to plot the distribution of variables,
    and bar charts are used to compare variables belonging to different categories.
    A histogram groups quantitative data into a finite number of bins and plots the
    distribution of data in those bins, whereas bar charts are used to plot categorical
    data.


    To demonstrate the bar chart, let’s consider the Telecoms Consumer Complaints
    dataset, which is a collection of complaints received by Comcast, an American
    global telecommunication company. This company was fined $2.3 million in October
    2016 over numerous customer complaints claiming that they have been charged for
    services they never used. This dataset is a collection of 2,224 such complaints
    categorized into 11 columns such as customer complaint, date, city, state, ZIP
    code, status, etc. In the following code, the dataset available as an Excel sheet
    is first loaded and converted to a dataframe. Then the column containing the states,
    from which the complaints are received, is selected, and the multiple entries
    corresponding to the same states are grouped together to a single entry using
    the function `groupby()`. The count of the number of times each state is repeated,
    which in turn corresponds to the number of complaints received from each state,
    is obtained by using the function `size()`. The data can then be sorted in descending
    order of the count values using the function `sort_values()`. Figure [6-5](#496535_1_En_6_Chapter.xhtml#Fig5)
    shows the plot of top 10 states with the most number of complaints, which gives
    a clear idea of where more customers have faced grievances. The plot basically
    gives a comparison of the company’s misgivings in different states based on the
    number of complaints received from the customers.


    ![../images/496535_1_En_6_Chapter/496535_1_En_6_Fig5_HTML.jpg](images/496535_1_En_6_Chapter/496535_1_En_6_Fig5_HTML.jpg)


    **Figure 6-5** – Bar plot showing number of complaints received from different
    states


    ```

    import pandas as pd

    import matplotlib.pyplot as plt

    dataset=pd.read_excel(''Comcast_telecom_complaints_data.csv.xlsx'')

    data=pd.DataFrame(dataset)

    print(data.head(3))

    Output:

    Ticket #        Customer Complaint   ...   Zip code  Status

    0  250635  Comcast Cable Internet Speeds   ...   21009  Closed

    1  223441  Payment disappear - service got disconnected ... 30102  Closed

    2  242732               Speed and Service  ...  30101  Closed

    [3 rows x 11 columns]

    a=data.groupby("State").size().sort_values(ascending=False).reset_index()

    plt.bar(a[''State''][0:10],a[0][0:10],align=''center'')

    plt.show()

    ```'
  raw: '### Histogram


    Histogram plots work by splitting the data in a variable into different ranges,
    called *bins*; then they count the data points in each bin and plot them as vertical
    bars. These types of plots can give a good idea about the approximate distribution
    of numerical data. The width of the bins, i.e., the range of values in each bin,
    is an important parameter, and the one that best fits the data has to be selected
    by trying out different values.


