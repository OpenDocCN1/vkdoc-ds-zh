    ### Principal Component Analysis


    Principal component analysis is a statistical method used to extract the strong
    features in a large dataset. In other words, the dimension of the dataset can
    be reduced by extracting the important features from the dataset. PCA uses standardization
    for identifying the distances between the features and implements the covariance
    information for identifying any relationship between the features. Then, with
    the help of the eigenvectors and eigenvalues, the principal components are calculated.
    The principal components are used to extract the strong features, i.e., reduce
    the dimensionality of the data. Further, the principal components are used to
    optimize the number of clusters for the k-means clustering technique, and the
    Boston dataset is used for this work. The Boston dataset has 13 features. In the
    first step, the strong features in the Boston dataset are identified with the
    help of PCA using the following code:


    ```

    from sklearn.decomposition import PCA

    from sklearn.preprocessing import StandardScaler

    #config InlineBackend.figure_format=''retina''

    # Load in the data

    from sklearn.datasets import load_boston

    dataset = load_boston()

    df=pd.DataFrame(dataset.data,columns=dataset.feature_names)

    #df = pd.read_csv(''2013_2014_cleaned.csv'')

    # Standardize the data to have a mean of ~0 and a variance of 1

    X_std = StandardScaler().fit_transform(df)

    # Create a PCA instance: pca

    pca = PCA(n_components=13)

    principalComponents = pca.fit_transform(X_std)

    # Plot the explained variances

    features = range(pca.n_components_)

    plt.bar(features, pca.explained_variance_ratio_, color=''black'')

    plt.xlabel(''PCA features'')

    plt.ylabel(''variance %'')

    plt.xticks(features)

    plt.show()

    # Save components to a DataFrame

    PCA_components = pd.DataFrame(principalComponents)

    ```


    From Figure [8-3](#496535_1_En_8_Chapter.xhtml#Fig3), we can see that the first
    three features give a good variance in the dataset.


    ![../images/496535_1_En_8_Chapter/496535_1_En_8_Fig3_HTML.jpg](images/496535_1_En_8_Chapter/496535_1_En_8_Fig3_HTML.jpg)


    Figure 8-3


    Features in the dataset with respect to variance


    Hence, five features can be selected for clustering. For clustering, k-means clustering
    can be used. To identify the optimal number of clusters, the PCA is fit with the
    k-means clustering algorithms and calculates the inertia of the clustering model
    with the selected principal components. The following code identifies the inertia
    of the clustering model and plots the number of clusters (i.e., `k`) with the
    inertia (this code continues with the previous PCA code). Figure [8-4](#496535_1_En_8_Chapter.xhtml#Fig4)
    shows the plot of inertia against the number of clusters (`k`). From Figure [8-4](#496535_1_En_8_Chapter.xhtml#Fig4),
    it can be concluded that after the number of cluster (`k = 5`), there are no significant
    changes occurring in the inertia. Hence, five can be chosen as the optimal number
    of cluster heads for the given dataset.


    ![../images/496535_1_En_8_Chapter/496535_1_En_8_Fig4_HTML.jpg](images/496535_1_En_8_Chapter/496535_1_En_8_Fig4_HTML.jpg)


    Figure 8-4


    Number of clusters versus inertia


    ```

    ks = range(1, 10)

    inertias = []

    for k in ks:

    # Create a KMeans instance with k clusters: model

    model = KMeans(n_clusters=k)

    # Fit model to samples

    model.fit(PCA_components.iloc[:,:3])

    # Append the inertia to the list of inertias

    inertias.append(model.inertia_)

    plt.plot(ks, inertias, ''-*'', color=''blue'')

    plt.xlabel(''number of clusters, k'')

    plt.ylabel(''inertia'')

    plt.xticks(ks)

    plt.show()

