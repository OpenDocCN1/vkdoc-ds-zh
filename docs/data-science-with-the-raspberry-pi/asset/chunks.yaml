- fmt: '### Scatter Plot


    A scatter plot is a type of plot that uses markers to indicate data points to
    show the relationship between two variables. The scatter plot can serve many purposes
    when it comes to data analysis. For example, the plot can reveal patterns and
    trends in data when the data points are taken as whole, which in turn can help
    data scientists understand the relationship between two variables and hence enable
    them to come up with an effective prediction technique. Scatter plots can also
    be used for identifying clusters in the data. They can also reveal outliers present
    in the data, which is crucial as outliers tend to drastically affect the performance
    of prediction systems.


    Two columns of data are generally required to create scatter plots, one for each
    dimension of the plot. Each row of data in the table will correspond to a single
    data point in the plot. A scatter plot can be created using the `scatter` function
    in the Matplotlib library. To demonstrate the usefulness of scatter plots, let’s
    consider the Boston Housing dataset that can be imported from the Scikit-Learn
    library. This dataset is actually taken from the StatLib library, which is maintained
    at Carnegie Mellon University. It consists of 506 samples with 13 different feature
    attributes such as per capita crime rate by town (`CRIM`), average number of rooms
    per dwelling (`RM`), index of accessibility to radial highways (`RAD`), etc. In
    addition, a target attribute `MEDV` indicates the median value of owner-occupied
    homes in the thousands.


    The following code illustrates the process of creating a Pandas dataframe the
    Boston housing dataset, which is originally in a dictionary format. For convenience,
    only the first five rows of the dataframe are displayed in this code using the
    `print` command.


    ```

    import matplotlib.pyplot as plt

    import numpy as np

    import pandas as pd

    from sklearn.datasets import load_boston

    dataset = load_boston()

    boston_data=pd.DataFrame(dataset.data,columns=dataset.feature_names)

    print(boston_data.head())

    Output:

    CRIM  ZN   INDUS   CHAS  NOX ...  RAD  TAX PTRATIO  B  LSTAT

    0  0.00632  18.0  2.31  0.0  0.538  ...  1.0  296.0  15.3  396.90  4.98

    1  0.02731   0.0  7.07  0.0  0.469  ...  2.0  242.0  17.8  396.90  9.14

    2  0.02729   0.0  7.07  0.0  0.469  ...  2.0  242.0  17.8  392.83  4.03

    3  0.03237   0.0  2.18  0.0  0.458  ...  3.0  222.0  18.7  394.63  2.94

    4  0.06905   0.0  2.18  0.0  0.458  ...  3.0  222.0  18.7  396.90  5.33

    [5 rows x 13 columns]

    ```


    The housing dataset is originally in the form of a dictionary, and it is saved
    to the variable `dataset`. The 13 feature attributes are assigned to the key `data`,
    and the target attribute `MEDV` is assigned to the key `target`. The 13 features
    are then converted to a Pandas dataframe. Now, the scatter plot of the feature
    variable `RM` versus the target variable `MEDV` can be obtained by the following
    code. From the plot in Figure [6-1](#496535_1_En_6_Chapter.xhtml#Fig1), we can
