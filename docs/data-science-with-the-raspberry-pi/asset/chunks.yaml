    # 将超声波传感器与树莓派连接


    超声波传感器通过测量声波传播的时间来测算物体距离。`HC-SR04` 超声波传感器可用于测量 2cm 至 400cm 的距离，精度可达 3mm。超声波传感器的工作原理是发射频率为
    40kHz 的声波，该频率超出人类听觉范围，并在空气中传播。若前方存在障碍物或物体，声波将反弹回传感器。物体的距离可通过将传播时间的一半乘以声速来计算。图
    3-14 展示了超声波传感器及其引脚，其中 `VCC` 引脚需连接树莓派正极，`GND` 引脚可连接树莓派的 `GND` 引脚，`Trig` 引脚用于触发超声波脉冲，`Echo`
    引脚在接收到反射声波时产生脉冲。


    ![../images/496535_1_En_3_Chapter/496535_1_En_3_Fig14_HTML.jpg](img/496535_1_En_3_Fig14_HTML.jpg)


    图 3-14


    超声波传感器引脚


    将超声波距离传感器连接到树莓派，如图 3-15 所示。


    ![../images/496535_1_En_3_Chapter/496535_1_En_3_Fig15_HTML.jpg](img/496535_1_En_3_Fig15_HTML.jpg)


    图 3-15


    超声波传感器与树莓派 GPIO 引脚连接


    `gpiozero` 库中有一个名为 `DistanceSensor` 的对象，可在 Python 中用于通过超声波传感器测量距离。`distance` 函数返回超声波距离传感器测得的距离，单位为米。我们将该值乘以
    100 以转换为厘米。清单 3-4 中的代码每秒连续打印超声波距离传感器测得的距离（以厘米为单位）。


    ```

    from gpiozero import DistanceSensor

    from time import sleep

    sensor = DistanceSensor(echo=17, trigger=4)

    while True:

    print(sensor.distance * 100)

    sleep(1)

