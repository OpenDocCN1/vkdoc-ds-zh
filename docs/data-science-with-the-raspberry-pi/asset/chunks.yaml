- fmt: '# Signals


    Generally, signals represent some information with respect to time or space. For
    example, a variation of a car’s speed with respect to time is a kind of signal.
    The information can be transferred in the form of signals. In electrical engineering,
    a signal is a function that carries information with respect to time or space.
    The electrical equipment exhibits the signals in the form of voltage, current,
    or electromagnetic waves. As per the *IEEE Transactions on Signal Processing*,
    a signal can be audio, video, speech, image, sonar, radar-related, and so on [1].
    Also, mathematically speaking, a signal is a function of one or more independent
    variables. Independent variables are just variables that aren’t changed by the
    other variables you are trying to measure. For example, consider the temperature
    variation with respect to time. Here, time is the independent variable, because
    the time isn’t changed due to the variations in the temperature.


    This chapter discusses how to acquire information from a real-time environment
    using sensors with Raspberry Pi and then convert that information in to structured
    data. The sensor output is in the form of an electrical signal. This chapter first
    describes about signal and its various types. There are many classifications of
    signals of which we concentrate on describing the following electrical signals:


    * Analog and digital signals

    * Continuous-time and discrete-time signals

    * Deterministic and nondeterministic signals

    * One-dimensional signals, two-dimensional signals, multidimensional signals


    ## Analog and Digital Signals


    An *analog signal* represents the instantaneous values of a physical quantity
    that varies continuously with respect to an independent variable (i.e., time).
    Simply speaking, analog signals are continuous in time and amplitude. The physical
    quantity may be temperature, pressure, speed, etc. Sensors can convert the variation
    of physical quantity in to electrical signals like voltage or current. In this
    way, real-time environment data can be collected in the form of electrical signals
    using sensors.


    A *digital signal* is a signal that is used to represent data as a sequence of
    discrete values. The independent variable (i.e., time) is discrete and has quantized
    amplitude. Digital signals can be obtained by applying sampling and quantization
    on analog signals. At any given time the digital signal can take on only one of
    a finite number of values.


    ## Continuous-Time and Discrete-Time Signals


    A *continuous time signal* or *continuous signal* is a signal defined over a continuum
    of its domain, which is often time. Any analog signal is continuous by nature.


    A *discrete-time signal* or *discrete signal* is a signal whose independent variable
    (time) has only discrete values. It is a time series consisting of a sequence
    of quantities. Discrete-time signals, used in digital signal processing, can be
    obtained by sampling and quantization of continuous signals.


    ## Deterministic and Nondeterministic Signals


    A *deterministic signal* is a signal with no uncertainty with respect to its value
    at any instant in time. In other words, a signal that can be defined exactly using
    a mathematical formula is a deterministic signal.


    A *nondeterministic signal* or *random signal* is a signal that has uncertainty
    with respect to its value at some instant in time. This signal is also called
    a *random signal* due to its random nature, and the signal cannot be described
    by a mathematical equation.


    ## One-Dimensional, Two-Dimensional, and Multidimensional Signals


    A *one-dimensional signal* is a function of only one independent variable. Voice
    signal is a good example of one-dimensional signal, because the amplitude of voice
    depends on only one independent variable (i.e., time).


    Similarly, if the signal is a function of two dependent variables, the signal
    is called a *two-dimensional signal*. A grayscale image is an example of a two-dimensional
    signal. Spatial coordinates (x,y) are the two independent variables in an image.
    *Multidimensional signal* is a function of more than two variables. A motion picture
    (i.e., video) is the best example of a multidimensional signal.


    ## Gathering Real-Time Data


    Gathering the data can be conducted in two ways: manual and automated. In the
    manual method, the data can be collected from existing files and documents. Then,
    the collected data can be organized into a structured manner (i.e., a tabular
    format) manually. In automation, the data can be collected using some devices
    called *sensors*. The real-time information about the physical quantities such
    as temperature, pressure, images, etc., can be collected using sensors. This chapter
    focuses on describing automated data collection using sensors. To automate the
    data collection, data acquisition systems are required. This section explains
    how to gather data using sensors such as ultrasonic sensor, humidity, temperature,
    and image data from a camera. Also, storing the collected data in the structured
    format is discussed.


    ## Data Acquisition


    The process of sampling signals that measure real-world physical conditions and
    converting the resulting samples into digital numeric values that can be manipulated
    by a computer is called *data acquisition*. Data acquisition systems (`DAS` or
    `DAQ`) generally convert analog signals into digital values for processing. The
    data acquisition systems comprises the following three components:


    * Sensors

    * Signal conditioning circuitry

    * Analog-to-digital converters


    ### Sensors


    Generally, sensors produce an electrical signal corresponding to the changes in
    the environment. A sensor is a device that converts physical parameters such as
    temperature, humidity, distance, etc., into an electrical signal. A sensor can
    be a device, module, machine, or subsystem that can detect events or changes in
    the environment and send the information to other electronic devices, most often
    a computer processor. For example, a thermocouple is a temperature sensor that
    produces an output voltage based on the input temperature changes. There are two
    types of sensors based on its output signal types: analog and digital.


    ### Analog Sensors


    Analog sensors produce a continuous output signal or voltage that is generally
    proportional to the quantity being measured. These sensors generally produce output
    signals that change smoothly and continuously over time. See Figure [4-1](#496535_1_En_4_Chapter.xhtml#Fig1).


    ![../images/496535_1_En_4_Chapter/496535_1_En_4_Fig1_HTML.jpg](images/496535_1_En_4_Chapter/496535_1_En_4_Fig1_HTML.jpg)


    Figure 4-1


    Analog signal


    The following code continuously prints the analog value of the sensor connected
    to the first channel (0) of `MCP3008` every second. Since `MCP3008` is a 10-bit
    ADC, the output value ranges from 0 to 1023.


    ```python

    from gpiozero import MCP3008

    from time import sleep

    sensor = MCP3008(0)

    while True:

    print(sensor.value)

    ```


    ### Digital Sensors


    Digital sensors produce digital output signals or voltages that are a digital
    representation of the quantity being measured. In these sensors, data conversion
    and data transmission take place digitally. See Figure [4-2](#496535_1_En_4_Chapter.xhtml#Fig2).


    ![../images/496535_1_En_4_Chapter/496535_1_En_4_Fig2_HTML.jpg](images/496535_1_En_4_Chapter/496535_1_En_4_Fig2_HTML.jpg)


    Figure 4-2


    Digital signals


    The following code prints the digital state of the GPIO pin 17 continuously:


    ```python

    from gpiozero import InputDevice

    from time import sleep

    sensor = InputDevice(17, pull_up=True)

    while True:

    print(sensor.value)

    ```


    Some of the common sensors in the electronics industry are listed here:


    * Temperature sensors

    * IR sensors

    * Ultrasonic sensors

    * Pressure sensors

    * Proximity sensors

    * Touch sensors

    * Level sensors

    * Smoke and gas sensors'
