  trans: '

    # 信号


    通常，信号表示关于时间或空间的某些信息。例如，汽车速度随时间的变化就是一种信号。信息可以以信号的形式传输。在电气工程中，信号是携带关于时间或空间信息的函数。电气设备以电压、电流或电磁波的形式呈现信号。根据《IEEE
    信号处理汇刊》，信号可以是音频、视频、语音、图像、声纳、雷达相关等 [1]。此外，从数学角度来说，信号是一个或多个自变量的函数。自变量是指不会被你试图测量的其他变量所改变的变量。例如，考虑温度随时间的变化。这里，时间是自变量，因为时间不会因温度的变化而改变。


    本章讨论如何使用传感器和树莓派从实时环境中获取信息，然后将这些信息转换为结构化数据。传感器的输出以电信号的形式呈现。本章首先介绍信号及其各种类型。信号有许多分类方式，我们重点描述以下电信号：


    * 模拟信号和数字信号

    * 连续时间信号和离散时间信号

    * 确定性信号和非确定性信号

    * 一维信号、二维信号、多维信号


    ## 模拟信号和数字信号


    *模拟信号*表示一个物理量相对于自变量（即时间）连续变化的瞬时值。简单来说，模拟信号在时间和幅度上是连续的。物理量可以是温度、压力、速度等。传感器可以将物理量的变化转换为电压或电流等电信号。这样，就可以使用传感器以电信号的形式收集实时环境数据。


    *数字信号*是一种用于将数据表示为离散值序列的信号。其自变量（即时间）是离散的，并且具有量化幅度。数字信号可以通过对模拟信号进行采样和量化来获得。在任何给定时间，数字信号只能取有限数量的值中的一个。


    ## 连续时间信号和离散时间信号


    *连续时间信号*或*连续信号*是在其定义域（通常是时间）的连续体上定义的信号。任何模拟信号本质上都是连续的。


    *离散时间信号*或*离散信号*是其自变量（时间）只有离散值的信号。它是一个由一系列量组成的时间序列。数字信号处理中使用的离散时间信号可以通过对连续信号进行采样和量化来获得。


    ## 确定性信号和非确定性信号


    *确定性信号*是在任何时刻其值都没有不确定性的信号。换句话说，能够用数学公式精确定义的信号就是确定性信号。


    *非确定性信号*或*随机信号*是在某些时刻其值具有不确定性的信号。由于其随机性，这种信号也称为*随机信号*，并且无法用数学方程来描述。


    ## 一维、二维和多维信号


    *一维信号*是只有一个自变量的函数。语音信号是一维信号的一个很好的例子，因为语音的幅度仅取决于一个自变量（即时间）。


    类似地，如果信号是两个自变量的函数，则称为*二维信号*。灰度图像是二维信号的一个例子。空间坐标（x，y）是图像中的两个自变量。*多维信号*是两个以上变量的函数。电影（即视频）是多维信号的最佳例子。


    ## 收集实时数据


    数据收集可以通过两种方式进行：手动和自动化。在手动方法中，可以从现有文件和文档中收集数据。然后，将收集到的数据手动组织成结构化形式（即表格格式）。在自动化方法中，可以使用称为*传感器*的设备来收集数据。物理量（如温度、压力、图像等）的实时信息可以使用传感器来收集。本章重点介绍使用传感器进行自动化数据收集。为了实现数据收集自动化，需要数据采集系统。本节解释如何使用传感器（如超声波传感器、湿度传感器、温度传感器）以及摄像头收集图像数据。此外，还讨论了如何将收集到的数据以结构化格式进行存储。


    ## 数据采集


    对测量真实世界物理状态的信号进行采样，并将所得样本转换为可由计算机处理的数字数值的过程称为*数据采集*。数据采集系统（`DAS` 或 `DAQ`）通常将模拟信号转换为数字值进行处理。数据采集系统包含以下三个组件：


    * 传感器

    * 信号调理电路

    * 模数转换器


    ### 传感器


    通常，传感器会根据环境的变化产生电信号。传感器是一种将温度、湿度、距离等物理参数转换为电信号的设备。传感器可以是一个设备、模块、机器或子系统，用于检测环境中的事件或变化，并将信息发送到其他电子设备（通常是计算机处理器）。例如，热电偶是一种温度传感器，它根据输入的温度变化产生输出电压。根据输出信号类型，传感器有两种类型：模拟传感器和数字传感器。


    ### 模拟传感器


    模拟传感器产生连续输出信号或电压，该信号或电压通常与被测量的量成比例。这类传感器通常产生的输出信号随时间平滑且连续地变化。请参见图 4-1。


    ![../images/496535_1_En_4_Chapter/496535_1_En_4_Fig1_HTML.jpg](img/496535_1_En_4_Fig1_HTML.jpg)


    图 4-1


    模拟信号


    以下代码每秒连续打印连接到 `MCP3008` 第一个通道（0）的传感器的模拟值。由于 `MCP3008` 是一个 10 位 ADC，其输出值范围为 0 到
    1023。


    ```python

    from gpiozero import MCP3008

    from time import sleep

    sensor = MCP3008(0)

    while True:

    print(sensor.value)

    ```


    ### 数字传感器


    数字传感器产生数字输出信号或电压，这些信号或电压是被测量量的数字表示。在这类传感器中，数据转换和数据传输以数字方式进行。请参见图 4-2。


    ![../images/496535_1_En_4_Chapter/496535_1_En_4_Fig2_HTML.jpg](img/496535_1_En_4_Fig2_HTML.jpg)


    图 4-2


    数字信号


    以下代码连续打印 GPIO 引脚 17 的数字状态：


    ```python

    from gpiozero import InputDevice

    from time import sleep

    sensor = InputDevice(17, pull_up=True)

    while True:

    print(sensor.value)

    ```


    以下是电子行业中一些常见的传感器：


    * 温度传感器

    * 红外传感器

    * 超声波传感器

    * 压力传感器

    * 接近传感器

    * 触摸传感器

    * 液位传感器

    * 烟雾和气体传感器

