  trans: "\n### `set` 集合\n\n`set` 是一个无序的集合，因此不支持索引。`set` 由花括号 `{}` 内逗号分隔的值定义。`set`\
    \ 可用于去除序列中的重复项。清单 2-9 展示了 `set` 中的操作。\n\n```\na = {1, 2, 3, 2, 4, 1, 3}\nprint(\"\
    a is of type\",type(a))\nprint(\"a=\",a)\n第 2 行的输出：a is of type \n第 3 行的输出：a=\
    \ {1, 2, 3, 4}\n清单 2-9\n集合中的操作\n```\n\n假设两个集合分别存储在变量 `a` 和 `b` 中。表 2-3 展示了 Python\
    \ 支持的可应用于这两个集合的各种集合操作。\n\n**表 2-3** Python 中的集合操作\n\n| 函数 | 描述 |\n| --- | ---\
    \ |\n| `a.union(b)` | 返回两个集合 `a` 和 `b` 的并集，存于新集合中 |\n| `a.difference(b)` | 返回两个集合\
    \ `a` 和 `b` 的差集，存于新集合中 |\n| `a.intersection(b)` | 返回两个集合 `a` 和 `b` 的交集，存于新集合中\
    \ |\n| `a.isdisjoint(b)` | 如果两个集合 `a` 和 `b` 没有交集，则返回 `True` |\n| `a.issubset(b)`\
    \ | 如果 `a` 是 `b` 的子集，即集合 `a` 的所有元素都存在于集合 `b` 中，则返回 `True` |\n| `a.symmetric_difference(b)`\
    \ | 返回两个集合 `a` 和 `b` 的对称差集，存于新集合中 |\n\n### `dict` 字典\n\n`dict` 表示字典数据类型，它是一种无序的数据集合，表示为键值对。字典可以用花括号\
    \ `{}` 定义，每个项都是以 `{key:value}` 形式存在的键值对。字典针对数据检索进行了优化，可以使用相应的键来检索字典中的特定值。换句话说，键充当该值的索引。键和值可以是任何数据类型。键通常是不可变的，并且在字典中不能重复，而值可以有重复的条目。尝试访问字典中不存在的键将导致\
    \ `KeyError`，如清单 2-10 所述。\n\n```\na = {1: 'Hello', 4: 3.6}\nprint(\"a is of type\"\
    , type(a))\nprint(a[4])\nprint(a[2])\n第 2 行的输出：a is of type \n第 3 行的输出：3.6\n第\
    \ 4 行的输出：KeyError: 2\n清单 2-10\n字典中的操作\n```\n\n### 类型转换\n\n类型转换是将任何数据类型的值转换为另一种数据类型的过程。Python\
    \ 提供的类型转换函数如下：\n\n* `int()`: 将任何数据类型更改为 `int` 数据类型\n* `float()`: 将任何数据类型更改为 `float`\
    \ 数据类型\n* `tuple()`: 将任何数据类型更改为元组\n* `list()`: 将任何数据类型更改为列表\n* `set()`: 将任何数据类型更改为集合\n\
    * `dict()`: 将任何数据类型更改为字典\n\n清单 2-11 演示了其中一些函数。\n\n```\na = 2\nprint(a)\nfloat(a)\n\
    b = [2 , 3, -1, 2, 4, 3]\nprint(tuple(b))\nprint(set(b))\n第 2 行的输出：2.0\n第 4 行的输出：(2,\
    \ 3, -1, 2, 4, 3)\n第 5 行的输出：(2, 3, 4, -1)\n清单 2-11\n类型转换操作\n```\n\n## 控制流语句\n\n\
    控制流语句允许根据表达式的值执行一条语句或一组语句。控制流语句可以分为三类：*顺序控制流语句*按程序中的顺序执行语句，*决策控制流语句*根据条件为 `True`\
    \ 或 `False` 来执行或跳过一组语句，*循环控制流语句*允许重复执行一组语句直到满足终止条件。\n\n### `if` 语句\n\n决策控制流语句类别中的\
    \ `if` 控制语句以 `if` 关键字开头，后跟条件语句，并以冒号结尾。条件语句计算一个布尔表达式，只有当布尔表达式计算结果为 `True` 时，才会执行\
    \ `if` 语句中的语句体。`if` 块语句从缩进开始，第一个没有缩进的语句标志着块的结束。`if` 语句的语法如下，清单 2-12 展示了它的工作原理：\n\
    \n```\nif <条件>:\n    <语句>\n```\n\n```\nx = 12\ny=8\nif x > y:\nout = \"x is greater\
    \ than y\"\nprint(out)\n输出：x is greater than y\n清单 2-12\nif 语句操作\n```\n\n####\
    \ `if-else` 语句\n\n`if` 语句后面可以跟一个可选的 `else` 语句。如果 `if` 语句中条件语句对应的布尔表达式为 `True`，则执行\
    \ `if` 块中的语句；如果布尔表达式为 `False`，则执行 `else` 块中的语句。换句话说，`if-else` 语句提供了双向决策过程。`if-else`\
    \ 语句的语法如下：\n\n```\nif <条件>:\n    <语句>\nelse:\n    <语句>\n```\n\n清单 2-13 展示了 `if-else`\
    \ 语句的示例代码。\n\n```\nx = 7\ny=9\nif x > y:\nout = \"x is greater than y\"\nelse:\n\
    out = \"x is less than y\"\nprint(out)\n输出：\nx is less than y\n清单 2-13\nif-else\
    \ 语句操作\n```\n\n#### `if...elif...else` 语句\n\n`if...elif...else` 语句可以提供多路决策过程。关键字\
    \ `elif` 是 `else-if` 的缩写形式。如果需要从多个可能的选择中选取一个，则可以将 `elif` 语句与 `if` 语句一起使用。`else`\
    \ 语句将最后出现，作为默认操作。以下是 `if...elif...else` 语句的语法，清单 2-14 展示了示例代码：\n\n```\nif <条件\
    \ 1>:\n    <语句>\nelif <条件 2>:\n    <语句>\nelif <条件 3>:\n    <语句>\n...\nelse:\n\
    \    <默认语句>\n```\n\n```\nx = 4\ny=4\nif x > y:\nout = \"x is greater than y\"\n\
    elif x<y:\nout = \"x is less than y\"\nelse:\nout = \"x is equal to y\"\nprint(out)\n\
    输出：\nx is equal to y\n清单 2-14\nif...elif...else 语句操作\n```\n\n#### `while` 循环\n\
    \n`while` 和 `for` 循环是循环控制流语句。在 `while` 循环中，会计算条件语句中的布尔表达式。只有当布尔表达式为 `True` 时，才会执行\
    \ `while` 循环中的语句块。循环块的每次重复被称为循环的一次*迭代*。每次迭代后都会检查 `while` 语句中的布尔表达式。循环持续执行直到表达式变为\
    \ `False`，此时 `while` 循环退出。`while` 循环的语法如下，清单 2-15 展示了它的工作原理：\n\n```\nwhile <条件>:\n\
    \    <语句>\n```\n\n```\nx=0\nwhile x < 4:\nprint(\"Hello World!\")\nx=x+1\n输出：\n\
    Hello World!\nHello World!\nHello World!\nHello World!\n清单 2-15\nwhile 循环操作\n\
    ```\n"
- fmt: "# for 循环\n\n`for` 循环使用一个迭代变量运行，该变量在每次迭代时递增，直到变量到达循环所操作序列的末尾。在每次迭代中，取出序列中与迭代变量所指示位置相对应的项目，并执行循环中的语句。`for`\
    \ 循环的语法如下：\n\n```\nfor <variable> in <sequence>:\n    <statements>\n```\n\n`range()`\
    \ 函数在 `for` 循环中非常有用，因为它可以生成一个数字序列，可以使用 `for` 循环对其进行迭代。`range()` 函数的语法是 `range([start,]\
    \ stop [,step])`，其中 `start` 表示序列的起始位置（如果未指定，则从零开始），`stop` 表示需要生成数字到的值（不包括该数字本身），`step`\
    \ 表示生成的序列中每两个连续数字之间的差值。`start` 和 `step` 值是可选的。`range` 参数生成的值应始终为整数。清单 [2-16](#496535_1_En_2_Chapter.xhtml#PC23)\
    \ 展示了一个用于逐个打印字符串中元素的 `for` 循环。\n\n```python\nx = \"Hello\"\nfor i in x:\n    print(i)\n\
    # Output:\n# H\n# e\n# l\n# l\n# o\n```\n\n**清单 2-16** for 循环操作\n\n清单 [2-17](#496535_1_En_2_Chapter.xhtml#PC24)\
    \ 展示了如何使用 `range()` 函数打印整数序列。\n\n```python\nfor i in range(4):\n    print(i)\n\
    # Output:\n# 0\n# 1\n# 2\n# 3\n```\n\n**清单 2-17** 使用 range 函数的 for 循环操作\n\n# 异常处理\n\
    \n异常就是在执行过程中检测到的错误。当程序中发生异常时，执行会终止，从而中断程序的正常流程。通过异常处理，可以向用户提供有关错误的有意义信息，而不是系统生成的消息。异常可以是内置的或用户定义的。用户定义的异常是用户创建的自定义异常，可以使用\
    \ `try...except` 语句实现，如清单 [2-18](#496535_1_En_2_Chapter.xhtml#PC25) 所示。\n\n```python\n\
    while True:\n    try:\n        n = int(input(\"Enter a number\"))\n        print(\"\
    The number you entered is\", n)\n        break\n    except ValueError:\n     \
    \   print(\"The number you entered is not the correct data type\")\n        print(\"\
    Enter a different number\")\n\n# Output:\n# Enter a number 5\n# The number you\
    \ have entered is 5\n# Enter a number 3.6\n# The number you entered is not the\
    \ correct data type\n# Enter a different number\n```\n\n**清单 2-18** 异常处理\n\n在清单\
    \ [2-18](#496535_1_En_2_Chapter.xhtml#PC25) 中，当变量接收到不适当数据类型的值时，会发生 `ValueError`\
    \ 异常。如果没有发生异常（即输入的数字是整数），则跳过 `except` 块，只执行 `try` 块。如果在输入不同数据类型的数字时发生异常，则跳过 `try`\
    \ 块中的其余语句，执行 `except` 块，并将程序返回到 `try` 块。\n\n# 函数\n\n函数是 Python 编程中的基本构建块，当需要在程序中多次执行一组语句时可以使用函数。可以通过将这组语句分组并为其命名来创建函数，这样可以在程序的任何部分通过该名称调用这些语句，而无需重复整个代码块。因此，函数可以通过消除冗余代码来减小程序规模。函数可以是内置的或用户定义的。\n\
    \nPython 解释器有许多内置函数，我们已经见过其中一些，如 `print()`、`range()`、`len()` 等。另一方面，Python 允许用户定义自己的函数并根据需要使用它们。函数定义的语法如下：\n\
    \n```python\ndef function_name(parameter1, .... parameter n):\n    statement(s)\n\
    ```\n\n函数名可以包含字母、数字或下划线，但不能以数字开头，也不应与关键字同名。让我们考虑一个简单的函数，它接收单个参数作为输入并计算其平方；请参见清单\
    \ [2-19](#496535_1_En_2_Chapter.xhtml#PC27)。\n\n```python\ndef sq(a):\n    b =\
    \ a * a\n    print(b)\n\nsq(36)\n# Output: 1296\n```\n\n**清单 2-19** 平方函数\n\n让我们看一个稍微复杂的函数，它计算给定十进制数的二进制表示。\n\
    \n如清单 [2-20](#496535_1_En_2_Chapter.xhtml#PC28) 所示，计算十进制数二进制表示所需的五行代码可以通过用户定义的函数替换为一行。\n\
    \n```python\nimport math as mt\n\ndef dec2bin(a):\n    b = ''\n    while a !=\
    \ 0:\n        b = b + str(a % 2)  # 连接操作\n        a = mt.floor(a / 2)\n    return\
    \ b[::-1]  # 反转字符串 b\n\nprint(int(dec2bin(19)))\n# Output: 10011\n```\n\n**清单\
    \ 2-20** 十进制转二进制函数\n\n# 用于数据科学的 Python 库\n\nPython 社区积极参与为各种应用开发多个工具包。数据科学应用中最常用的一些工具包是\
    \ NumPy、SciPy、Pandas 和 Scikit-Learn。"
  raw: '##### for loop


    The `for` loop runs with an iteration variable that is incremented with each iteration,
    and this increment goes on until the variable reaches the end of the sequence
    on which the loop is operating. In each iteration, the items in the sequence corresponding
    to the location given by the iteration variable are taken, and the statements
    in the loop are executed with those items. The syntax for the `for` loop is as
    follows:


    ```

    for  in :


    ```


    The `range()` function is useful in the `for` loop as it can generate a sequence
    of numbers that can be iterated using the `for` loop. The syntax for the `range()`
    function is `range([start,] stop [,step])` where `start` indicates the beginning
    of the sequence (starting from zero if not specified), `stop` indicates the value
    up to which the numbers must be generated (not including the number itself), and
    `step` indicates the difference between every two consecutive numbers in the generated
    sequence. The start and step values are optional. The values generated by the
    range argument should always be integers. Listing [2-16](#496535_1_En_2_Chapter.xhtml#PC23)
    shows a `for` loop used to print the elements in a string one by one.


    ```

    x = "Hello"

    for i in x:

    print(i)

    Output:

    H

    e

    l

    l

    o

    Listing 2-16

    for Loop Operations

    ```


    Listing [2-17](#496535_1_En_2_Chapter.xhtml#PC24) shows how to use the `range()`
    function to print a sequence of integers.


    ```

    for i in range(4):

    print(i)

    Output:


    Listing 2-17

    for Loop Operations with range Function

    ```


    ## Exception Handling


    Exceptions are nothing but errors detected during execution. When an exception
    occurs in a program, the execution is terminated and thereby interrupts the normal
    flow of the program. By means of exception handling, meaningful information about
    the error rather than the system-generated message can be provided to the user.
    Exceptions can be built-in or user-defined. User-defined exceptions are custom
    exceptions created by the user, which can be done using `try...except` statements,
    as shown in Listing [2-18](#496535_1_En_2_Chapter.xhtml#PC25).


    ```

    while True:

    try:

    n=int(input("Enter a number"))

    print("The number you entered is",n)

    break

    except ValueError:

    print("The number you entered is not

    the correct data type")

    print("Enter a different number")

    Output:

    Enter a number 5

    The number you have entered is 5

    Enter a number3.6

    The number you entered is not the correct data type

    Enter a different number

    Listing 2-18

    Exception Handling

    ```


    In Listing [2-18](#496535_1_En_2_Chapter.xhtml#PC25), a `ValueError` exception
    occurs when a variable receives a value of an inappropriate data type. If no exception
    occurs, i.e., the number entered as input is an integer, then the `except` block
    is skipped, and only the `try` block is executed. If an exception occurs while
    entering a number of a different data type, then the rest of the statements in
    the `try` block are skipped, the `except` block is executed, and the program is
    returned to the `try` block.


    ## Functions


    Functions are fundamental blocks in the Python programming that can be used when
    a block of statements needs to be executed multiple times within a program. Functions
    can be created by grouping this block of statements and giving it a name so that
    the statements can be invoked at any part of the program simply by this name rather
    than repeating the entire block. Thus, functions can be used to reduce the size
    of the program by eliminating redundant code. The functions can be either built-in
    or user-defined.


    The Python interpreter has a number of built-in functions some of which we have
    seen already such as `print()`, `range()`, `len()`, etc. On the other hand, Python
    enables users to define their own functions and use them as needed. The syntax
    for function definition is as follows:


    ```

    def function_name(parameter1, ....  parameter n):

    statement(s)

    ```


    The function name can have letters, numbers, or an underscore, but it cannot start
    with a number and should not have the same name as a keyword. Let’s consider a
    simple function that takes a single parameter as input and computes its square;
    see Listing [2-19](#496535_1_En_2_Chapter.xhtml#PC27).


    ```

    def sq(a):

    b = a * a

    print(b)

    sq(36)

    Output:1296

    Listing 2-19

    Square Functions

    ```


    Let’s see a slightly complicated function that computes the binary representation
    of a given decimal number.


    As shown in Listing [2-20](#496535_1_En_2_Chapter.xhtml#PC28), the five lines
    of code required to compute the binary representation of a decimal number can
    be replaced by a single line using the user-defined function.


    ```

    import math as mt

    def dec2bin(a):

    b='' ''

    while a!=0:

    b=b+str(a%2)#concatenation operation

    a=math.floor(a/2)

    return b[:-1]# reverse the string b

    print(int(dec2bin(19))

    Output: 10011

    Listing 2-20

    Square Functions

    ```


    ## Python Libraries for Data Science


    The Python community is actively involved in the development of a number of toolboxes
    intended for various applications. Some of the toolboxes that are used mostly
    in data science applications are NumPy, SciPy, Pandas, and Scikit-Learn.'
