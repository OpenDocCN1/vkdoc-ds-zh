  trans: "\n### `int`\n\n`int` 数据类型表示整数，即不带小数点的有符号整数。清单 2-1 中的代码展示了整数的数据类型。\n\n```\n\
    a=5\n\"'使用 type() 函数打印变量 a 的数据类型\"'\nprint(\"a 的类型是\",type(a))\n输出：\na 的类型是 \n\
    清单 2-1\n整数数据类型\n```\n\n### `float`\n\n`float` 数据类型表示浮点数，即用小数点分隔整数部分和小数部分的数字。清单\
    \ 2-2 中的代码打印了浮点值的数据类型。\n\n```\na = 5.0\nprint('a 的类型是',type(a))\n输出：\na 的类型是 \n\
    清单 2-2\n浮点数据类型\n```\n\n### `complex`\n\n`complex` 数据类型表示形式为 *a*+*bj* 的复数，其中 *a*\
    \ 和 *b* 分别是实部和虚部。数字 *a* 和 *b* 可以是整数或浮点数。清单 2-3 中的代码打印了复数数据类型。\n\n```\na=3.5+4j\n\
    print('a 的类型是',type(a))\n输出：\na 的类型是 \n清单 2-3\n复数数据类型\n```\n\n### `bool`\n\n在\
    \ Python 中，布尔变量通过 `True` 和 `False` 关键字定义。由于 Python 区分大小写，关键字 `True` 和 `False`\
    \ 的首字母必须大写。清单 2-4 演示了 `bool` 数据类型。\n\n```\na= 8>9\nprint('a 的类型是',type(a))\nprint(a)\n\
    输出：\na 的类型是 \nFalse\n清单 2-4\n布尔数据类型\n```\n\n布尔值可以通过布尔运算符进行操作，包括 `and`、`or` 和 `not`，如清单\
    \ 2-5 所示。\n\n```\na = True\nb = False\nprint(a or b)\n输出：\nTrue\n清单 2-5\n布尔数据类型的操作\n\
    ```\n\n### 数值运算符\n\n表 2-1 总结了 Python 中可应用于数值数据类型的数值运算。\n\n表 2-1\n\nPython 中的数值运算符\n\
    \n| 运算符 | 运算 |\n| --- | --- |\n| `( )` | 括号 |\n| `**` | 幂运算 |\n| `*` | 乘法 |\n\
    | `/` | 除法 |\n| `+` | 加法 |\n| `-` | 减法 |\n| `%` | 取模运算 |\n\n表 2-1 中的运算符按其优先级顺序列出。当代码的某一行执行多个运算时，执行的顺序将根据表\
    \ 2-1 中的优先级顺序进行。考虑涉及乘法和加法的示例 `2*3+5`。从表 2-1 可以看出，乘法优先级高于加法，因此会先执行乘法运算符（`*`）得到\
    \ `2*3=6`，然后执行加法运算符（`+`），最终得到结果 `6+5=11`。\n\n### 序列数据类型\n\n序列数据类型允许在变量中存储多个值。序列数据类型的五种类型是\
    \ `list`、`tuple`、`str`、`set` 和 `dict`。\n\n#### `list`\n\n列表是数据科学家在 Python 中最常用的数据类型。列表是一个有序的元素序列。列表中的元素不必属于同一数据类型。列表可以声明为用逗号分隔并括在方括号\
    \ `[]` 内的项。列表是可变的；也就是说，列表中元素的值可以更改。列表中的元素从零开始索引，因此可以通过其对应的索引访问列表中的任何元素，如清单 2-6\
    \ 所示。索引必须是整数，对索引使用任何其他数据类型都会导致 `TypeError`。同样，尝试访问列表范围之外的索引会导致 `IndexError`。\n\
    \n```\na = [1, 2.5, 5, 3+4j, 3, -2]\nprint(\"a 的类型是\",type(a))\n\"'打印列表中的第一个值\"\
    '\nprint(\"a[0]=\",a[0])\n\"'打印列表中的第三个值\"'\nprint(\"a[2]=\",a[2])\n\"'打印从索引 0\
    \ 到 2 的值\"'\nprint(\"a[0:3]=\",a[0:3])\n\"'打印从索引 4 到列表末尾的值\"'\nprint(\"a[4:]=\"\
    ,a[4:])\n\"'将索引 3 处的值更改为 4\"'\na[3]=4\nprint(\"a=\",a)\n\"'小数索引导致 TypeError\"\
    '\nprint(a[1.5])\n\"超出范围索引导致 IndexError\"'\nprint(a[8])\n第 2 行输出：a 的类型是 \n第 4\
    \ 行输出：a[0]= 1\n第 6 行输出：a[2]= 5\n第 8 行输出：a[0:3]= [1, 2.5, 5]\n第 10 行输出：a[4:]= [3,\
    \ -2]\n第 13 行输出：a= [1, 2.5, 5, 4, 3, -2]\n第 15 行输出：TypeError: list indices must\
    \ be integers or slices, not float\n第 17 行输出：IndexError: list index out of range\n\
    清单 2-6\n列表操作\n```\n\n考虑分别存储在变量 `a` 和 `b` 中的两个列表。表 2-2 显示了 Python 提供的一些可以对列表 `a`\
    \ 和 `b` 执行的其他操作。其中一些函数也适用于元组、字符串和集合。\n\n表 2-2\n\nPython 中的列表操作\n\n| 函数 | 描述 |\n\
    | --- | --- |\n| `a+b` | 连接两个列表 `a` 和 `b` |\n| `a*n` | 将列表 `a` 重复 `n` 次，其中 `n`\
    \ 是整数 |\n| `len(a)` | 计算列表 `a` 中元素的个数 |\n| `a.append()` | 向列表 `a` 末尾添加一个元素 |\n\
    | `a.remove()` | 从列表 `a` 中移除一个项 |\n| `a.pop()` | 移除并返回列表 `a` 中给定索引处的元素 |\n| `a.index()`\
    \ | 返回列表 `a` 中第一个匹配项的索引 |\n| `a.count()` | 返回列表 `a` 中作为参数传递的项的数量 |\n| `a.sort()`\
    \ | 按升序对列表 `a` 中的项进行排序 |\n| `a.reverse()` | 反转列表 `a` 中项的顺序 |\n\n#### `tuple`\n\
    \n元组与列表一样，也是一个有序的元素序列，但区别在于元组是不可变的；也就是说，元组中的值不能更改。尝试更改元组中元素的值会导致 `TypeError`。将不会更改的数据存储为元组，可以确保它们保持写保护状态。元组可以声明为用逗号分隔并括在圆括号\
    \ `()` 内的项。元组也可以像列表一样进行索引，如清单 2-7 所述。\n\n```\na = (1, 3, -2, 4, 6)\nprint(\"a\
    \ 的类型是\",type(a))\nprint(\"a[3]=\",a[3])\na[2] = 5\n第 2 行输出：a 的类型是 \n第 3 行输出：a[3]=\
    \ 4\n第 4 行输出：TypeError: 'tuple' object does not support item assignment\n清单 2-7\n\
    元组操作\n```\n\n#### `str`\n\n`str` 数据类型表示一个字符串。字符串可以声明为用双引号（`\" \"`）括起来的字符。也可以使用单引号（`'\
    \ '`），但由于某些单词中会出现撇号，使用双引号可以避免混淆。字符串中的字符与列表和元组相同的方式索引。字符串中两个单词之间的空格也被视为一个字符。与元组一样，字符串也是不可变的，如清单\
    \ 2-8 所述。\n\n```\na = \"Hello World!\"\nprint(\"a 的类型是\",type(a))\nprint(\"a[3:7]=\"\
    ,a[3:7]\na[2] = \"r\"\n第 2 行输出：a 的类型是 \n第 3 行输出：a[3:7]= lo W\n第 4 行输出：TypeError:\
    \ 'str' object does not support item assignment\n清单 2-8\n字符串操作\n```\n"
- fmt: "### `set`\n\nA `set` is an unordered collection of items and hence does not\
    \ support indexing. A `set` is defined by values separated by commas inside set\
    \ braces, `{}`. A `set` can be used for removing duplicates from a sequence. Listing\
    \ [2-9](#496535_1_En_2_Chapter.xhtml#PC11) shows the operations in a `set`.\n\n\
    ```\na = {1, 2, 3, 2, 4, 1, 3}\nprint(\"a is of type\",type(a))\nprint(\"a=\"\
    ,a)\nOutput of line 2: a is of type \nOutput of line 3: a= {1, 2, 3, 4}\nListing\
    \ 2-9\nOperations in a Set\n```\n\nConsider two sets stored in variables `a` and\
    \ `b`, respectively. Table [2-3](#496535_1_En_2_Chapter.xhtml#Tab3) illustrates\
    \ the various set operations supported by Python that can be applied on these\
    \ two sets.\n\n**Table 2-3** Set Operations in Python\n\n| Function | Description\
    \ |\n| --- | --- |\n| `a.union(b)` | Returns the union of the two sets `a` and\
    \ `b` in a new set |\n| `a.difference(b)` | Returns the difference of two sets\
    \ `a` and `b` as a new set |\n| `a.intersection(b)` | Returns the intersection\
    \ of the two sets `a` and `b` as a new set |\n| `a.isdisjoint(b)` | Returns `True`\
    \ if the two sets `a` and `b` have a null intersection |\n| `a.issubset(b)` |\
    \ Returns `True` if `a` is a subset of `b`; i.e., all elements of set `a` are\
    \ present in set `b` |\n| `a.symmetric_difference(b)` | Returns the symmetric\
    \ difference between the two sets `a` and `b` as a new set |\n\n### `dict`\n\n\
    A `dict` represents the dictionary data type, which is an unordered collection\
    \ of data represented as key-value pairs. Dictionaries can be defined within set\
    \ braces, `{}`, with each item being a pair in the form `{key:value}`. Dictionaries\
    \ are optimized for retrieving data where a particular value in the dictionary\
    \ can be retrieved by using its corresponding key. In other words, the key acts\
    \ as the index for that value. The key and value can be of any data type. The\
    \ keys are generally immutable and cannot be duplicated in a dictionary, whereas\
    \ the values may have duplicate entries. Trying to access a key that is not present\
    \ in the dictionary will result in `KeyError`, as described in Listing [2-10](#496535_1_En_2_Chapter.xhtml#PC12).\n\
    \n```\na = {1: 'Hello', 4: 3.6}\nprint(\"a is of type\", type(a))\nprint(a[4])\n\
    print(a[2])\nOutput of line 2: a is of type \nOutput of line 3: 3.6\nOutput of\
    \ line 4: KeyError: 2\nListing 2-10\nOperations in a Dictionary\n```\n\n### Type\
    \ Conversion\n\nType conversion is the process of converting the value of any\
    \ data type to another data type. The functions provided by Python for type conversion\
    \ are listed here:\n\n* `int()`: Changes any data type to the `int` data type\n\
    * `float()`: Changes any data type to the `float` data type\n* `tuple()`: Changes\
    \ any data type to a tuple\n* `list()`: Changes any data type to a list\n* `set()`:\
    \ Changes any data type to a set\n* `dict()`: Changes any data type to a dictionary\n\
    \nListing [2-11](#496535_1_En_2_Chapter.xhtml#PC13) illustrates some of these\
    \ functions.\n\n```\na = 2\nprint(a)\nfloat(a)\nb = [2 , 3, -1, 2, 4, 3]\nprint(tuple(b))\n\
    print(set(b))\nOutput of line 2: 2.0\nOutput of line 4: (2, 3, -1, 2, 4, 3)\n\
    Output of line 5: (2, 3, 4, -1)\nListing 2-11\nType Conversion Operations\n```\n\
    \n## Control Flow Statements\n\nControl flow statements allow for the execution\
    \ of a statement or a group of statements based on the value of an expression.\
    \ The control flow statements can be classified into three categories: *sequential\
    \ control flow statements* that execute the statements in the program in the order\
    \ they appear, *decision control flow statements* that either execute or skip\
    \ a block of statements based on whether a condition is `True` or `False`, and\
    \ *loop control flow statements* that allow the execution of a block of statements\
    \ multiple times until a terminate condition is met.\n\n### `if` Statement\n\n\
    The `if` control statement in the decision control flow statement category starts\
    \ with the `if` keyword, followed by a conditional statement, and ends with a\
    \ colon. The conditional statement evaluates a Boolean expression and only if\
    \ the Boolean expression evaluates to `True`, then the body of statements in the\
    \ `if` statement be executed. `if` block statements start with indentation, and\
    \ the first statement without indentation marks the end. The syntax for the `if`\
    \ statement is as follows, and Listing [2-12](#496535_1_En_2_Chapter.xhtml#PC15)\
    \ shows how it works:\n\n```\nif <condition>:\n    <statement>\n```\n\n```\nx\
    \ = 12\ny=8\nif x > y:\nout = \"x is greater than y\"\nprint(out)\nOutput: x is\
    \ greater than y\nListing 2-12\nif Statement Operations\n```\n\n#### `if-else`\
    \ Statement\n\nThe `if` statement can be followed up by an optional `else` statement.\
    \ If the Boolean expression corresponding to the conditional statement in the\
    \ `if` statement is `True`, then the statements in the `if` block are executed,\
    \ and the statements in the `else` block are executed if the Boolean expression\
    \ is `False`. In other words, the `if-else` statement provides a two-way decision\
    \ process. The syntax for the `if-else` statement is as follows:\n\n```\nif <condition>:\n\
    \    <statement>\nelse:\n    <statement>\n```\n\nListing [2-13](#496535_1_En_2_Chapter.xhtml#PC17)\
    \ shows the example code for the `if-else` statement.\n\n```\nx = 7\ny=9\nif x\
    \ > y:\nout = \"x is greater than y\"\nelse:\nout = \"x is less than y\"\nprint(out)\n\
    Output:\nx is less than y\nListing 2-13\nif-else Statement Operations\n```\n\n\
    #### `if...elif...else` Statement\n\nThe `if...elif...else` statement can provide\
    \ a multiway decision process. The keyword `elif` is the short form of `else-if`.\
    \ The `elif` statement can be used along with the `if` statement if there is a\
    \ need to select from several possible alternatives. The `else` statement will\
    \ come last, acting as the default action. The following is the syntax for the\
    \ `if...elif...else` statement, and Listing [2-14](#496535_1_En_2_Chapter.xhtml#PC19)\
    \ shows the example code:\n\n```\nif <condition1>:\n    <statement>\nelif <condition2>:\n\
    \    <statement>\nelif <condition3>:\n    <statement>\n...\nelse:\n    <default_statement>\n\
    ```\n\n```\nx = 4\ny=4\nif x > y:\nout = \"x is greater than y\"\nelif x<y:\n\
    out = \"x is less than y\"\nelse:\nout = \"x is equal to y\"\nprint(out)\nOutput:\n\
    x is equal to y\nListing 2-14\nif...elif...else Statement Operations\n```\n\n\
    #### `while` Loop\n\nThe `while` and `for` loops are loop control flow statements.\
    \ In a `while` loop, the Boolean expression in the conditional statement is evaluated.\
    \ The block of statements in the `while` loop is executed only when the Boolean\
    \ expression is `True`. Each repetition of the loop block is called an *iteration*\
    \ of the loop. The Boolean expression in the `while` statement is checked after\
    \ each iteration. The execution of the loop is continued until the expression\
    \ becomes `False`, and the `while` loop exits at this point. The syntax for the\
    \ `while` loop is as follows, and Listing [2-15](#496535_1_En_2_Chapter.xhtml#PC21)\
    \ shows how it works:\n\n```\nwhile <condition>:\n    <statement>\n```\n\n```\n\
    x=0\nwhile x < 4:\nprint(\"Hello World!\")\nx=x+1\nOutput:\nHello World!\nHello\
    \ World!\nHello World!\nHello World!\nListing 2-15\nwhile Loop Operations\n```"
