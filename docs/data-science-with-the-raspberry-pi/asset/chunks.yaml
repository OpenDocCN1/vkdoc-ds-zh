    # 什么是实时数据？


    `实时数据（RTD）`是在采集后立即传递给最终用户的信息。实时数据可以是静态的，也可以是动态的，通常通过`实时计算`进行处理。


    ## 实时数据分析


    实时分析是指在数据被收集后立即对其进行分析。实时数据分析使我们能够毫不延迟地做出决策，并在问题发生之前加以预防。


    在此，我们将讨论如何获取关于距离、湿度、温度以及来自摄像头的图像数据的实时数据。


    ## 从超声波传感器获取实时距离数据


    超声波传感器的基本原理是发射和接收声波。可以通过测量发射波与接收回波之间的时间差，计算出待测量的物理变量（如距离、液位、高度、流量等）。


    ### 将超声波传感器与树莓派连接


    将超声波传感器与树莓派连接已在第 3 章中讨论过。我们将从`HC-SR04`超声波传感器收集数据，该传感器可用于测量 2 厘米到 400 厘米的距离，精度为
    3 毫米。此处我们的目标是，将超声波距离传感器与树莓派连接，并将收集到的数据保存为 CSV 格式。为此，超声波距离传感器可以连接到树莓派的 GPIO 引脚，如图
    4-3 所示。


    ![../images/496535_1_En_4_Chapter/496535_1_En_4_Fig3_HTML.jpg](img/496535_1_En_4_Fig3_HTML.jpg)


    图 4-3：超声波传感器与树莓派 GPIO 引脚的连接


    如第 3 章所述，我们将使用`gpiozero`库中的`DistanceSensor`对象。`distance`函数返回超声波距离传感器测得的距离（以米为单位）。要显示为厘米，我们需要将该值乘以
    100。以下代码每秒钟打印一次超声波距离传感器测得的距离（单位为厘米），并在 100 秒后保存收集到的数据。


    ```

    from gpiozero import DistanceSensor

    from time import sleep

    sensor = DistanceSensor(echo=17, trigger=4)

    n = 100

    for i in range(n):

    print(sensor.distance * 100)

    sleep(1)

    ```


    当代码运行时，移动放置在超声波传感器前方物体的位置，可以获得不同的数值。测得的距离（厘米）会持续打印`n`秒；在此例中，`n`为 100。


    ## 从摄像头获取实时图像数据


    本节介绍如何从网络摄像头获取实时视频。


    ### 从网络摄像头获取实时视频


    通过 USB 端口将 USB 网络摄像头连接到树莓派。使用`OpenCV` Python 库，我们可以访问网络摄像头并从中捕获图像和视频。以下代码可用于从网络摄像头获取实时视频。可以实时分析所捕获的帧。


    ```

    import cv2

    vid = cv2.VideoCapture(0)

    while(True):

    ret, frame = vid.read()

    cv2.imshow(''frame'', frame)

    if cv2.waitKey(1) & 0xFF == ord(''q''):

    break

    vid.release()

    cv2.destroyAllWindows()

    ```


    ### 从树莓派摄像头模块获取实时视频


    通过摄像头串行接口（CSI）端口将树莓派摄像头模块连接到树莓派。要启用树莓派摄像头，请从主菜单打开树莓派配置，并在“接口”（Interfaces）选项卡中启用“摄像头”（Camera）。以下代码可用于使用树莓派摄像头模块捕获图像，并将捕获的图像存储到指定位置：`/home/pi/Desktop/cammodule_img.jpg`。


    ```

    from picamera import PiCamera

    from time import sleep

    camera = PiCamera()

    camera.start_preview()

    sleep(5)

    camera.capture(''/home/pi/Desktop/cammodule_img.jpg'')

    camera.stop_preview()

    ```


    ## 数据传输


    数据传输是指两个或多个数字设备之间传输数据的过程。数据以模拟或数字格式传输，数据传输过程使得设备或设备内部的组件能够相互通信。


    ### 串行通信与并行通信


    串行通信是通过通信信道或计算机总线逐位顺序发送数据的过程。并行通信是一种同时传输多个二进制数字（比特）的方法。


    ### 将 Arduino 与树莓派连接


    我们可以将 Arduino 连接到树莓派，并在 Arduino 和树莓派之间双向传输数据。传感器、电机和执行器可以连接到 Arduino，并使 Arduino
    与树莓派之间传输数值。通过这种方式，我们可以将 Arduino 用作节点，并通过这些节点获取传感器数据。


    Arduino 可以通过两种方式连接到树莓派。


    *   通过 USB 进行串行通信

    *   通过 GPIO 引脚进行串行通信


    #### 通过 USB 进行串行通信


    使用 Arduino USB 线缆连接两块板卡，是在 Arduino 和树莓派之间建立通信的最简单方法。


    在树莓派上，选择板卡上四个可用 USB 端口中的任意一个，并连接 USB 接口。将 Arduino USB 线缆的另一端连接到 Arduino。对于不同版本的
    Arduino，其连接线缆会有所不同。


    #### 通过 GPIO 引脚进行串行通信


    也可以使用普通导线在树莓派 GPIO 引脚和 Arduino 引脚之间建立串行连接。根据您所使用的 Arduino 板卡，可能需要使用电压电平转换器。


    树莓派的工作电压为 3.3V，而 Arduino 板卡（如 Uno、Mega、Leonardo、Nano 等）的工作电压为 5V。因此，在连接 RX 和 TX
    引脚时，需要使用 3.3V/5V 的电平转换器来保护树莓派，如图 4-4 所示。


    ![../images/496535_1_En_4_Chapter/496535_1_En_4_Fig4_HTML.jpg](img/496535_1_En_4_Fig4_HTML.jpg)


    图 4-4：通过 GPIO 引脚连接 Arduino 和树莓派


    通常，对于串行通信，建议使用 Arduino USB 线缆而非 GPIO 引脚。

