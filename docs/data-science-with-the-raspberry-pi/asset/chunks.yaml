    To do the EDA, we’ll use the Boston housing dataset that can be imported from
    the `Scikit-Learn` library. This dataset was already described in Chapter [6](#496535_1_En_6_Chapter.xhtml).
    This dataset contains 506 samples under 13 different feature attributes such as
    per capita crime rate by town (`CRIM`), average number of rooms per dwelling (`RM`),
    index of accessibility to radial highways (`RAD`), etc., and a target attribute
    `MEDV` indicates the median value of owner-occupied homes in the thousands.


    ## Import the required libraries


    The first step is to load the required libraries for doing the EDA. In this chapter,
    we will use the packages such as `Pandas`, `NumPy`, and `Matplotlib` for plotting:


    ```

    import matplotlib.pyplot as plt

    import numpy as np

    from sklearn.datasets import load_boston

    ```


    ## Import a dataset


    The Boston housing dataset can be imported from the `Scikit-Learn` library and
    saved as the `boston_data` variable, as given in the following code:


    ```

    dataset = load_boston()

    ```


    The more important thing is that most of the open source data is stored in a comma-separated
    format. This comma-separated format has difficulties fetching and analyzing the
    data. Thus, the comma-separated data can be converted into a dataframe using the
    `Pandas` package in Python.


    ```

    import pandas as pd

    boston_data=pd.DataFrame(dataset.data,columns=dataset.feature_names)

    ```


    If the dataset is very large, we can display the top and bottom five rows with
    headings using the following code:


