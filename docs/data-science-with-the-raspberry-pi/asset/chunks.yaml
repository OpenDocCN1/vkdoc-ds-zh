    ```


    By using the following code, the final five data points can be viewed:


    ```

    print(emotion_data.tail(5))

    LAR    PP        PPT  ...  Mobility   Complexity      Label

    40  0.000649  5070   3.141034  ...  0.173283  231638.99600    ''Sad''

