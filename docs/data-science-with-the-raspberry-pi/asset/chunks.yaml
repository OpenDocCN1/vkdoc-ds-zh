- fmt: '# Object Detection Using a Deep Neural Network


    Object detection is a technique for identifying the objects in the real world
    like a chair, book, car, TV, flowers, animals, humans, etc., from an image or
    video. This technique detects, identifies, and recognizes multiple objects in
    an image for better understanding or for extracting the information from a real-world
    environment. Object detection plays a major role in computer vision applications
    like autonomous vehicles, surveillance, automation in industries, and assistive
    devices for visually impaired people. Many modules are available in the Python
    environment for object detection, and they are as follows:


    - Feature-based object detection

    - Viola Jones object detection

    - SVM classification with HOG features

    - Deep learning object detection

    - Single-shot multibox detector (SSD) object detection

    - You Only Look Once (YOLO) model object detection

    - Region-based convolutional neural network (R-CNN)

    - Faster R-CNN


    Here, we have used a single-shot multibox detector to identify the multiple objects
    in an image or video. Single-shot multibox detectors were proposed by C. Szegedy
    et al. in November 2016. SSD can be explained as follows:


    - *Single shot*: In this stage, localization and classification of the image are
    done with the help of a single forward-pass network.

    - *Multibox*: This represents drawing the bounding boxes for multiple objects
    in an image.

    - *Detector*: This is an object detector that classifies the objects in an image
    or video.


    Figure 9-14 shows the architecture of a single-shot multibox detector.


    In the architecture, the dimension of the input image is considered as `300×300×3`.
    The VGG-16 architecture is used as a base network, and the fully connected networks
    are discarded. The VGG-16 architecture is popular and has a strong classification
    ability with the transfer learning technique. Here, a part of the convolutional
    layers of the VGG-16 architecture is used in the earlier stages. A detailed explanation
    of SSD is available at [`https://towardsdatascience.com/understanding-ssd-multibox-real-time-object-detection-in-deep-learning-495ef744fab`](https://towardsdatascience.com/understanding-ssd-multibox-real-time-object-detection-in-deep-learning-495ef744fab).


    ![../images/496535_1_En_9_Chapter/496535_1_En_9_Fig14_HTML.jpg](images/496535_1_En_9_Chapter/496535_1_En_9_Fig14_HTML.jpg)


    **Figure 9-14** — Architecture of single-shot multibox detector ([*https://towardsdatascience.com/understanding-ssd-multibox-real-time-object-detection-in-deep-learning-495ef744fab*](https://towardsdatascience.com/understanding-ssd-multibox-real-time-object-detection-in-deep-learning-495ef744fab))


    The multibox architecture is a technique for identifying the bounding box coordinates
    and is based on two loss functions such as confidence loss and location loss.
    Confidence loss uses a categorical entropy for measuring the confidence level
    of identifying the objects for the bounding box. Location loss measures the distance
    of the bounding box, which is away from the object in the image. For measuring
    the distance, the L2 norm is used. The multibox loss can be measured with the
    help of the following equation:


    `Multi-box loss = Confidence Loss + α * Location Loss`


    This gives information about how far the bounding box landed from the predicted
    objects. The following code implements the SSD configure file with the DNN weights
    for detecting the objects in COCO names. The SSD configure file (i.e., `ssd_mobilenet_v3_large_coco_2020_01_14.pbtxt`)
    with the DNN weights (i.e., `frozen_inference_graph.pb`) for detecting the objects
    in COCO names can be downloaded from [`https://github.com/AlekhyaBhupati/Object_Detection_Using_openCV`](https://github.com/AlekhyaBhupati/Object_Detection_Using_openCV).


    COCO names are called common objects in this context, and the dataset for the
    COCO names is available at the official website: [`https://cocodataset.org/#home`](https://cocodataset.org/%2523home).
    COCO has segmented common objects such as chair, car, animals, humans, etc., and
    these segmented images can be used to train the deep neural network. See Figure
    9-15 and Figure 9-16.


    ![../images/496535_1_En_9_Chapter/496535_1_En_9_Fig15_HTML.jpg](images/496535_1_En_9_Chapter/496535_1_En_9_Fig15_HTML.jpg)


    **Figure 9-15** — Input image for object identification


    Here’s the code:


    ![../images/496535_1_En_9_Chapter/496535_1_En_9_Fig16_HTML.jpg](images/496535_1_En_9_Chapter/496535_1_En_9_Fig16_HTML.jpg)


    **Figure 9-16** — Output image with identified objects


    ```

    import cv2

    thres = 0.5# Threshold to detect object

    cap = cv2.VideoCapture(0)

    cap.set(3,1280)

    cap.set(4,720)

    cap.set(10,70)

    classNames= []

    classFile = ''coco.names''

    with open(classFile,''rt'') as f:

    classNames = f.read().rstrip(''\n'').split(''\n'')

    configPath = ''ssd_mobilenet_v3_large_coco_2020_01_14.pbtxt''

    weightsPath = ''frozen_inference_graph.pb''

    net = cv2.dnn_DetectionModel(weightsPath,configPath)

    net.setInputSize(320,320)

    net.setInputScale(1.0/ 127.5)

    net.setInputMean((127.5, 127.5, 127.5))

    net.setInputSwapRB(True)

    print(''1st done'')

    while True:

    success, img = cap.read()

    classIds, confs, bbox = net.detect(img, confThreshold=thres)

    print(classIds, bbox)

    if len(classIds) != 0:

    for classId, confidence,box in zip(classIds.flatten(),confs.flatten(),bbox):

    cv2.rectangle(img,box,color=(0,255,0),thickness=2)

    cv2.putText(img,classNames[classId-1].upper(),(box[0]+10,box[1]+30),

    cv2.FONT_HERSHEY_COMPLEX,1,(0,255,0),2)

    cv2.putText(img,str(round(confidence*100,2)),(box[0]+200,box[1]+30),

    cv2.FONT_HERSHEY_COMPLEX,1,(0,255,0),2)

    cv2.imshow("Output",img)

    # Hit ''q'' on the keyboard to quit!

    ```


    When the code is executed, the frames in the video from the webcam are captured
    using the `OpenCV capture` functions. Then, each and every frame is inserted into
    the already trained SSD-DNN model for identifying the objects. The SSD-DNN model
    classifies the objects based on the COCO names and creates a bounding box on the
    detected images with a COCO name label and accuracy. The video file of Figure
    9-15 was fed as the input to the previous program. The figure has the objects
    such as a chair, a book, and a mouse. From Figure 9-16, it can clearly be concluded
    that the SSD-based DNN model identifies the three objects with an accuracy of
    72.53 percent for the chair, 67.41 percent for the book, and 81.52 percent for
    the mouse.'
