- fmt: '# Case Study 2: Data Science for Image Data


    Though digital equipment available today can capture images at a higher resolution
    and with more details than human vision, computers can only treat those images
    as an array of numerical values that represents colors. *Computer vision* refers
    to the techniques that can enable computers to understand digital images and videos.
    Computer vision systems can be thought of as a replication of the human vision
    system, enabling computers to process images and videos in the same way humans
    do. Computer vision systems are used in many applications such as face recognition,
    autonomous vehicles, healthcare, security, augmented reality, etc.


    The first step in any computer vision system is to capture the images of interest.
    This can be done by many means such as cameras, microscopes, X-ray machines, radar,
    etc., depending on the nature of application. The captured raw images, however,
    cannot be used directly and require further processing. The raw images may not
    be of the desired quality due to the noise introduced by various reasons. It is
    therefore essential to enhance the captured raw images before further processing.
    To enable the computer to learn from the images, it is sometimes essential to
    extract useful information from the image using analysis techniques. In this section,
    we will see how to capture images using a camera interfaced to a Raspberry Pi
    board and discuss the steps involved in preparing the raw images for further processing.


    The first step is to interface a USB web camera to our Raspberry Pi board, as
    shown in Figure [9-6](#496535_1_En_9_Chapter.xhtml#Fig6).


    ![../images/496535_1_En_9_Chapter/496535_1_En_9_Fig6_HTML.jpg](images/496535_1_En_9_Chapter/496535_1_En_9_Fig6_HTML.jpg)


    **Figure 9-6** Raspberry Pi with webcam


    To do this, we have to enable SSH and Camera in the Pi configuration settings.
    Secure Shell (SSH) can help to connect with the Raspberry Pi remotely over your
    local network, whereas enabling the Camera configuration can help to interface
    a webcam with the Pi board. This can be done with the following steps:


    ![../images/496535_1_En_9_Chapter/496535_1_En_9_Fig8_HTML.jpg](images/496535_1_En_9_Chapter/496535_1_En_9_Fig8_HTML.jpg)


    **Figure 9-8** Interfacing options for enabling Camera and SSH


    ![../images/496535_1_En_9_Chapter/496535_1_En_9_Fig7_HTML.jpg](images/496535_1_En_9_Chapter/496535_1_En_9_Fig7_HTML.jpg)


    **Figure 9-7** Software Configuration Tool window


    1. Type the command `sudo raspi-config` in the Terminal window of your Raspberry
    Pi OS. This will open the Software Configuration Tool window, as shown in Figure
    [9-7](#496535_1_En_9_Chapter.xhtml#Fig7).


    2. Go to Interfacing Options, as shown in Figure [9-8](#496535_1_En_9_Chapter.xhtml#Fig8),
    and enable both SSH and Camera.


    3. Reboot the Raspberry Pi device.


    Once the reboot is completed, run the `lsusb` command in the Terminal window and
    check whether the connected USB webcam is listed. Then open the Python IDE and
    type the following code to capture and save an image using the webcam:


    ```python

    import cv2

    import pandas as pd

    import numpy as np

    import matplotlib.pyplot as plt

    camera=cv2.VideoCapture( )

    ret, img = camera.read( )

    cv2.imwrite(''image.png'',img)

    img= cv2.cvtColor(img,cv2.COLOR_BGR2RGB)

    plt.imshow(img)

    plt.axis(''off'')

    plt.show( )

    ```


    As shown in the code, the `OpenCV` package is used to work with images in Python.
    To capture an image, a `VideoCapture` object is created first. The `read()` function
    is used to capture the image using the created object and then stored in a variable
    `img`. The captured image can then be saved using the `imwrite()` function. `OpenCV`
    displays an image in BGR format instead of the standard RGB format. Therefore,
    the image is first converted to an RGB image using the `cv2.color` function before
    displaying. To display the image, the `imshow()` function in the Matplotlib package
    can be used. Since the plots created with this package are enabled with an axis
    value by default, it is essential to remove the axis while displaying images.
    This can be done by setting the `axis` function in the Matplotlib package to the
    `off` state. Figure [9-9](#496535_1_En_9_Chapter.xhtml#Fig9) shows a sample image
    captured using the previous code.


    ![../images/496535_1_En_9_Chapter/496535_1_En_9_Fig9_HTML.jpg](images/496535_1_En_9_Chapter/496535_1_En_9_Fig9_HTML.jpg)


    **Figure 9-9** Image captured using a webcam interfaced to the Raspberry Pi board'
