    # 用于机器学习的 TensorFlow


    TensorFlow 是一个由谷歌大脑团队创建的端到端开源机器学习平台。TensorFlow 拥有大量的机器学习模型和算法。它使用 Python 提供前端
    API，以便用该框架构建应用程序。Keras 是一个运行在 TensorFlow 之上的高级神经网络 API。Keras 允许轻松快速地进行原型设计，并支持卷积网络和循环神经网络。


    # Raspberry Pi 简介


    Raspberry Pi，或简称为 Pi，是一系列由英国 Raspberry Pi 基金会发明的小型、低成本、单板计算机，旨在向全球学生推广基础计算机科学和电子学。学生和技术爱好者使用
    Raspberry Pi 来学习编程概念、构建硬件项目和机器人，以及进行人工智能项目。它也被用于工业应用。


    ## 你能用 Raspberry Pi 做什么？


    一个 Raspberry Pi 开发板几乎可以做台式机能做的所有事情：上网、观看高清视频、听音乐、查看和编辑图片、进行文字处理、制作电子表格和演示文稿、编写和编译代码、参加视频会议，甚至玩游戏。


    ### 使用 Raspberry Pi 进行物理计算


    Raspberry Pi 还可以用于与物理世界进行交互。这是通过 Raspberry Pi 开发板上的通用输入/输出（GPIO）引脚实现的。这使得 Raspberry
    Pi 功能强大，因为它可以与传感器以及其他电子和电气元件（如 LED、舵机和步进电机、继电器等）进行接口连接。


    ### 如何为 Raspberry Pi 编程？


    Raspberry Pi 预装了两门语言（Scratch 和 Python），但它也支持其他语言。Scratch 是一种面向儿童的视觉化编程语言，而 Python
    是一种高级通用编程语言；这两种语言都易于学习。如果您学会了用 Python 编程，那么您就可以用 Raspberry Pi 做所有可能的事情。


    ## Raspberry Pi 硬件


    Raspberry Pi 基金会于 2012 年发布了第一款 Raspberry Pi，即 Raspberry Pi model B。此后发布了多个改进版本，我们稍后会介绍所有这些版本。最新版本是
    2019 年 6 月发布的 Raspberry Pi 4 model B。图 3-1 显示了带有许多 I/O 端口的 Raspberry Pi 开发板的俯视图。让我们来看看它的硬件规格和其他特性。


    ![../images/496535_1_En_3_Chapter/496535_1_En_3_Fig1_HTML.jpg](img/496535_1_En_3_Fig1_HTML.jpg)


    图 3-1


    Raspberry Pi 硬件


    ### 片上系统


    *片上系统*（SoC）是 Raspberry Pi 的大脑，如图 3-2 所示。这个小小的芯片包含许多重要部分：中央处理单元（CPU）、图形处理单元（GPU）和数字信号处理器。


    ![../images/496535_1_En_3_Chapter/496535_1_En_3_Fig2_HTML.jpg](img/496535_1_En_3_Fig2_HTML.jpg)


    图 3-2


    片上系统


    Raspberry Pi 4 model B 采用了强大的 Broadcom BCM2711（1.5 GHz 64 位四核）SoC。Pi 的 CPU 执行基本算术、逻辑、控制和输入/输出等操作，而
    Pi 的 GPU 用于处理多媒体任务，如数字图像处理、绘制 3D 图形和玩游戏。


    ### Raspberry Pi 内存


    随机存取存储器（RAM）是 Raspberry Pi 4 model B 中位于 SoC 旁边的黑色矩形，如图 3-3 所示。在早期版本的 Raspberry
    Pi 中，RAM 被封装在 SoC 内部。Pi 4 提供了三种容量的 LPDDR4 RAM 选择：1GB、2GB 和 4GB。


    ![../images/496535_1_En_3_Chapter/496535_1_En_3_Fig3_HTML.jpg](img/496535_1_En_3_Fig3_HTML.jpg)


    图 3-3


    Raspberry Pi 内存


    RAM 存储应用程序使用的短期数据，当 Raspberry Pi 关闭时，这些数据将被删除。RAM 由中央处理单元和图形处理单元共享。

