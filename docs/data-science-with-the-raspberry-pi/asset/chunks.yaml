- fmt: '# Statistical Analysis


    A better understanding of the data at hand can go a long way in simplifying the
    job of a data scientist, and this is where statistics can come in handy. Statistics
    can provide the tools necessary to identify structures in the data, and such insights
    can prove to be valuable in building a model to best fit our data. The role of
    statistics with respect to data can vary from simple analysis to creating self-learning
    models. In this section, we will introduce the various types of distributions,
    statistical measures of data, and ways to fit data to distributions.


    Before discussing distributions, let’s first understand how data is associated
    with probability. When we consider a dataset, it normally represents a single
    sample from a population. For instance, if we have a dataset consisting of the
    height and weight of all the students in a school, the model developed from this
    data after some statistical analysis can be used to predict the height and weight
    of students from another school. The dataset in our hand is just one sample, whereas
    the population may consist of as many schools.


    The numerical data that we encounter may be continuous or discrete in nature.
    The difference between the two is that the continuous data may take any value,
    whereas the discrete data can take only certain values. For example, data such
    as the number of cars manufactured per day, the number of feedback received from
    customers, etc., are discrete in nature, whereas data such as height, weight,
    humidity, temperature, etc., represents continuous data.


    Probability distributions, a fundamental concept in statistics, provide a way
    to represent the possible values taken by a random variable and the respective
    probabilities. The *probability mass function* (PMF) denotes the discrete probability
    distribution, and the *probability density function* (PDF) denotes the continuous
    probability distribution. Some of the common distributions that a data scientist
    needs to be aware of are discussed in the following section.


    ## Uniform Distribution


    Uniform distribution, also called a *rectangular distribution*, has a constant
    probability. In other words, all the outcomes have the same probability of occurrence.
    The number of outcomes in the case of uniform distribution may be unlimited. The
    most common example for a uniform distribution is the roll of a fair die, where
    all six outcomes have an equal probability of 1/6. Let’s illustrate uniform distribution
    by plotting the probabilities of the outcomes for the fair die experiment. In
    other words, the probabilities of occurrence for each face of the die are equally
    likely. Figure [7-1](#496535_1_En_7_Chapter.xhtml#Fig1) shows the distribution
    plot.


    ![../images/496535_1_En_7_Chapter/496535_1_En_7_Fig1_HTML.jpg](images/496535_1_En_7_Chapter/496535_1_En_7_Fig1_HTML.jpg)


    Figure 7-1


    Uniform distribution of fair die experiment


    ```python

    import numpy as np

    import matplotlib.pyplot as plt

    probabilities = np.full((6),1/6)

    events = [1,2,3,4,5,6]

    plt.bar(events,probabilities)

    plt.xlabel(''Die roll events'')

    plt.ylabel(''Event Probability'')

    plt.title(''Fair die - Uniform Distribution'')

    plt.show()

    ```


    If a histogram plot is made for a dataset by dividing the numerical data into
    a number of bins and all the bins are found to have equal distribution, then the
    dataset can be said to be uniformly distributed.


    ## Binomial Distribution


    As the name suggests, this distribution is used when there are only two possible
    outcomes. A random variable `X` that follows a binomial distribution is dependent
    on two parameters:


    *   The number of trials `n` in the case of binomial distribution must be fixed,
    and the trials are considered to be independent of each other. In other words,
    the outcome of a particular trial does not depend on the outcomes of the previous
    trials.

    *   There are only two possible outcomes for each event: success or failure. The
    probability of success, say `p`, remains the same from trial to trial.


    Therefore, the binomial distribution function in Python normally takes two values
    as inputs: the number of trials `n` and the probability of success `p`. To understand
    binomial distribution, let’s look at the common experiment of tossing a coin:


    ```python

    from scipy.stats import binom

    import matplotlib.pyplot as plt

    import numpy as np

    n=15 # no of times coin is tossed

    r_values = list(range(n + 1))

    x=[0.2,0.5,0.7,0.9]  #probabilities of getting a head

    k=1

    for p in x:

    dist = [binom.pmf(r, n, p) for r in r_values ]

    plt.subplot(2,2,k)

    plt.bar(r_values,dist)

    plt.xlabel(''number of heads'')

    plt.ylabel(''probability'')

    plt.title(''p= percent.1f'' percentp)

    k+=1

    plt.show()

    ```


    In the previous code, we have 15 trials for tossing the coin. The probability
    of getting a head remains the same for each trial, and the outcome of each trial
    is independent of the previous outcomes. The binomial distribution is computed
    using the `binom.pmf` function available in the `stats` module of the `scipy`
    package. The experiment is repeated for different probabilities of success using
    a `for` loop, and Figure [7-2](#496535_1_En_7_Chapter.xhtml#Fig2) shows the resulting
    distribution plot.


    ![../images/496535_1_En_7_Chapter/496535_1_En_7_Fig2_HTML.jpg](images/496535_1_En_7_Chapter/496535_1_En_7_Fig2_HTML.jpg)


    Figure 7-2


    Binomial distribution for tossing a coin 15 times


    Figure [7-2](#496535_1_En_7_Chapter.xhtml#Fig2) shows the binomial distribution
    for our coin toss experiment for different probabilities of success. The first
    subplot shows the binomial distribution when the probability of getting a head
    is 0.2. This implies that there is a 20 percent chance of getting a head. Twenty
    percent of 15 tosses is 3, which implies that there is a high probability of getting
    three heads in 15 tosses. Hence, the probability is at a maximum of 3. It can
    be seen that the binomial distribution has a bell-shaped response. The response
    is skewed to the left when the probability of success is low and shifts to the
    right with an increase in probability, as illustrated in the rest of the subplots.


    Binomial distribution can be encountered in various domains of data science. For
    instance, when a pharmaceutical company wants to test a new vaccine, then there
    are only two possible outcomes: the vaccine works or it does not. Also, the result
    for an individual patient is an independent event and does not depend on other
    trials for different patients. Binomial distribution can be applied to various
    business issues as well. For example, consider people working in the sales department
    making calls all day to sell their company’s products. The outcome of the call
    is whether a successful sale is made or not, and the outcome is independent for
    each worker. Similarly, there are many other areas in a business with binary outcomes
    where binomial distribution can be applied, and hence it plays an important role
    in business decision-making.'
