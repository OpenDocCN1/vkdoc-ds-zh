    Figure 9-3


    Sample EEG signal for the entire recording duration'
  raw: '## Case Study 1: Human Emotion Classification


    An emotion is a feeling that is characterized by intense brain activity. A considerable
    amount of research has been focused on recognizing human emotions for a wide range
    of applications such as medical, health, robotics, and brain-computer interface
    (BCI) applications. There are a number of ways to recognize human emotions such
    as facial emotion recognition, tone recognition from speech signal, emotion recognition
    from EEG signals, etc. Among those, classification from EEG signals is a simple
    and convenient method. Also, EEG signals have useful information about human emotions.
    Thus, many researchers have focused on classifying human emotion using EEG signals.
    EEG signals are used to record the human brain activity by measuring electrical
    signals by placing electrodes on the scalp.


    Let’s consider a simple emotion recognition system that uses a single electrode
    device, namely, a NeuroSky MindWave device for acquiring the EEG signals from
    participants and classifying their emotion as happy, afraid, or sad with the help
    of machine learning algorithms, namely, k-nearest neighbor (k-NN) and neural networks
    (NNs).


    ## Methodology


    The participants included are from different age groups, and they were subjected
    to the experiment separately by showing them images in different categories from
    the worldwide recognized database Geneva Affective Picture Database (GAPED). The
    images include images of babies, happy scenarios, animal mistreatments, human
    concerns, snakes, and spiders, each kindling different emotions in the participants.
    The dataset of features corresponding to the recorded EEG signals is then obtained
    for all the participants, and these features are then subjected to machine learning
    models like k-NN and NN, which classifies each signal into one of three emotions:
    happy, afraid, or sad.


    ### Dataset


    The two devices that are used for data collection are the NeuroSky MindWave Mobile
    device and a Raspberry Pi 3 board. The NeuroSky MindWave device can be used to
    safely record the EEG signals. The device consists of a headset, an ear clip,
    and a sensor (electrode) arm. The headset’s ground electrodes are available on
    the ear clip, whereas the EEG electrode is on the sensor arm that will rest on
    the forehead above the eye after putting on the headset. The device uses a single
    AAA battery, which can last for eight hours.


    This device is connected to a Raspberry Pi 3 board via Bluetooth, as shown in
    Figure [9-1](#496535_1_En_9_Chapter.xhtml#Fig1). It is a third-generation Raspberry
    Pi model that comes with a quad-core processor, 1GB of RAM, and a number of ports
    for connecting various devices. It also comes with wireless LAN and Bluetooth
    support, which can help to connect wireless devices like our MindWave Mobile.
    The software provided by the NeuroSky device vendor is installed on the Pi board
    to acquire the serial data from the device.


    ![../images/496535_1_En_9_Chapter/496535_1_En_9_Fig1_HTML.jpg](images/496535_1_En_9_Chapter/496535_1_En_9_Fig1_HTML.jpg)


    Figure 9-1


    Raspberry Pi with MindWave Mobile connected via Bluetooth


    ### Interfacing the Raspberry Pi with MindWave Mobile via Bluetooth


    There are two ways to connect the MindWave Mobile with the Raspberry Pi. The first
    one is to connect the MindWave Mobile with the Raspberry Pi desktop. Initially
    switch on the Raspberry Pi, boot into the Raspberry Pi operating system, and then
    switch on the MindWave Mobile Bluetooth. Then click the Bluetooth symbol in the
    Raspberry Pi OS, which will show the devices that are ready to pair with the Raspberry
    Pi. In the list, the MindWave Mobile can be selected, and the pairing password
    0000 as prescribed by the vendor can be used. Now, the MindWave Mobile device
    is paired with the Pi, as shown in Figure [9-2](#496535_1_En_9_Chapter.xhtml#Fig2).


    ![../images/496535_1_En_9_Chapter/496535_1_En_9_Fig2a_HTML.jpg](images/496535_1_En_9_Chapter/496535_1_En_9_Fig2a_HTML.jpg)![../images/496535_1_En_9_Chapter/496535_1_En_9_Fig2b_HTML.jpg](images/496535_1_En_9_Chapter/496535_1_En_9_Fig2b_HTML.jpg)![../images/496535_1_En_9_Chapter/496535_1_En_9_Fig2c_HTML.jpg](images/496535_1_En_9_Chapter/496535_1_En_9_Fig2c_HTML.jpg)


    Figure 9-2


    Raspberry desktop pairing with MindWave Mobile


    The signals from the MindWave Mobile device can be extracted via this Bluetooth
    connection. Another way to connect the Raspberry with MindWave is by using Pypi
    0.1.0\. The steps are explained at [`https://github.com/cttoronto/python-MindWave-mobile`](https://github.com/cttoronto/python-MindWave-mobile).
    This link provides the data about alpha, beta, and gamma values of the brainwave
    signals. However, in this work, the dataset is developed from the EEG signals.


    ### Data Collection Process


    The participants are seated in a small, darkened room, which is also radio silent
    to prevent them from acoustic and visual disturbances. The terms and conditions
    are explained prior to the experiment, and they are instructed to stop the test
    if they have any discomfort. A manual score sheet was also provided to the participants
    to rate their emotions during each picture. There was a total of 15 participants,
    and 15 signals spread across three different emotions were recorded, thereby making
    a total of 15 × 3 = 45 EEG signals. The emotions were happy, afraid, and sad.


    Initially, raw EEG signals were acquired from the user using a NeuroSky device.
    The raw EEG signal extracted from the brain cannot be directly used for further
    processing. As the subject is exposed to emotion stimulation based on the visual
    inputs for a specific duration, the resulting emotional reaction would be a time-varying
    one. It is essential therefore to identify the duration of peak activity of the
    brain and extract the features only for that duration so as to enhance the classification
    results. To achieve this, the recording is started exactly one minute after the
    start of experiment, which gives enough time to simulate the emotions of the participants
    using the image slides corresponding to the particular emotion. Also, to avoid
    dealing with large data, only 15 seconds of data with 512 samples per second are
    considered, thereby reducing the data size to just 15 × 512 =7680 samples, as
    illustrated in Figure [9-3](#496535_1_En_9_Chapter.xhtml#Fig3). Figure [9-3](#496535_1_En_9_Chapter.xhtml#Fig3)
    shows the signal for the entire duration of recording with the signal in the peak
    period of brain activity indicated in red, and Figure [9-4](#496535_1_En_9_Chapter.xhtml#Fig4)
