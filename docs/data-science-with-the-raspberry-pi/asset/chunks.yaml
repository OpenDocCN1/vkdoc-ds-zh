    # 将温湿度传感器与树莓派连接


    顾名思义，这类传感器可用于测量温度和湿度。它们由一个电容式湿度传感元件和一个用于感测温度的热敏电阻组成。温湿度传感器包含一个专用的电阻式湿度测量组件，即*负温度系数*（NTC）测温组件，以及一个用于将温度和湿度数值以串行数据形式输出的
    8 位微控制器。树莓派与 `DHT11` 传感器之间使用单总线数据格式进行通信与同步。


    `DHT 11` 和 `DHT 22` 是常用的温湿度传感器。图 3-16 展示了温湿度传感器（THD），图 3-17 说明了 THD 与树莓派的连接方式，其中
    `VCC` 引脚需连接树莓派正极，`GND` 引脚可连接树莓派的 `GND` 引脚，`Signal/Data` 引脚用于串行通信，需连接至一个 GPIO 引脚。


    ![../images/496535_1_En_3_Chapter/496535_1_En_3_Fig16_HTML.jpg](img/496535_1_En_3_Fig16_HTML.jpg)


