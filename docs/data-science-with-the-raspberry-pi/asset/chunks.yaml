- fmt: '# 1\. Introduction to Data Science


    Data is a collection of information in the form of words, numbers, and descriptions
    about the subject. Consider the following statement: “The dog has four legs, is
    `1.5m` high, and has brown hair.” This statement has three different kinds of
    information (i.e., data) about the dog. The data “four” and “`1.5m`” is numerical
    data, and “brown hair” is descriptive. It is good to know the various kinds of
    data types to understand the data, perform effective analysis, and better extract
    knowledge from the data. Basically, data can be categorized into two types.


    *   Quantitative data

    *   Qualitative data


    `Quantitative data` can be obtained only with the help of measurements and not
    through observations. This can be represented in the form of numerical values.
    Quantitative data can be further classified into continuous and discrete. The
    exact integer values are `discrete` data, whereas `continuous` data can be any
    value in a range. `Qualitative data` is a description of the characteristics of
    a subject. Usually qualitative data can be obtained from observations and cannot
    be measured. In other words, qualitative data may be described as categorical
    data, and quantitative data can be called numerical data.


    For example, in the previous statement, “brown hair” describes a characteristic
    of the dog and is qualitative data, whereas “four legs” and “`1.5m`” are the quantitative
    data and are categorized as discrete and continuous data, respectively.


    Data can be available in structured and unstructured form. When the data is organized
    in a predefined data model/structure, it is called `structured data`. Structured
    data can be stored in a tabular format or a relational database with the help
    of query languages. We can also store this kind of data in an Excel file format,
    like the student database given in Table [1-1](#496535_1_En_1_Chapter.xhtml#Tab1).


    **Table 1-1** An Example of Structured Data


    | **Student Roll Number** | Marks | Attendance | Batch | Sex |

    | --- | --- | --- | --- | --- |

    | 111401 | 492/500 | 98% | 2011-2014 | Male |

    | 111402 | 442/500 | 72% | 2011-2014 | Male |

    | 121501 | 465/500 | 82% | 2012-2015 | Female |

    | 121502 | 452/500 | 87% | 2012-2015 | Male |


    Most human-generated and machine-generated data are unstructured data such as
    emails, documents, text files, log files, text messages, images, video and audio
    files, messages on the Web and social media, and data from sensors. This data
    can be converted to a structured format only through human or machine intervention.
    Figure [1-1](#496535_1_En_1_Chapter.xhtml#Fig1) shows the various sources of unstructured
    data.


    ![../images/496535_1_En_1_Chapter/496535_1_En_1_Fig1_HTML.jpg](images/496535_1_En_1_Chapter/496535_1_En_1_Fig1_HTML.jpg)


    **Figure 1-1** Sources of unstructured data


    ## Importance of Data Types in Data Science


    Before starting to analyze data, it is important to know about the data types
    so you can choose the suitable analysis methods. The analysis of continuous data
    is different from the analysis of categorical data; hence, using the same analysis
    methods for both may lead to incorrect analysis.


    For example, in statistical analysis where continuous data is involved, the probability
    of an exact event is zero, while the result can be different for discrete data.


    You can also choose the visualization tools based on the data types. For instance,
    continuous data is usually represented using histograms, whereas discrete data
    can be visualized with the help of bar charts.


    ## Data Science: An Overview


    As discussed at the beginning of the chapter, data science is nothing but the
    extraction of knowledge or information from the data. Unfortunately, not all data
    gives useful information. It is based on the client requirements, the hypothesis,
    the nature of the data type, and the methods used for analysis and modeling. Therefore,
    a few processes are required before analyzing or modeling the data for intelligent
    decision-making. Figure [1-2](#496535_1_En_1_Chapter.xhtml#Fig2) describes these
    data science processes.


    ![../images/496535_1_En_1_Chapter/496535_1_En_1_Fig2_HTML.jpg](images/496535_1_En_1_Chapter/496535_1_En_1_Fig2_HTML.jpg)


    **Figure 1-2** Data science process


    ## Data Requirements


    To develop a data science project, the data scientists first understand the problem
    based on the client/business requirements and then define the objectives of the
    problem for analysis. For example, say a client wants to analyze the emotion of
    people on a government policy. First, the objectives of the problem can be set
    as “To collect the opinion of the people about the government policy.” Then, the
    data scientists decide on the kind of data that can support the objective and
    the resources of data. For the example problem, the possible data is social media
    data, including text messages and opinion polls of various categories of people,
    with information about their education level, age, occupation, etc. Before starting
    the data collection, a good work plan is essential for collecting the data from
    various sources. Setting the objectives and work plan can reduce the time spent
    collecting the data and can help to prepare the report.


    ## Data Acquisition


    There are many types of structured open data available on the internet that we
    call `secondary data`, because that kind of data is collected by somebody and
    structured into some tabular format. If the user wants to collect the data directly
    from a source, that is called `primary data`. Initially, the unstructured data
    is collected via many resources such as mobile devices, emails, sensors, cameras,
    direct interaction with people, video files, audio files, text messages, blogs,
    etc.


    ## Data Preparation


    Data preparation is the most important part of the data science process. Preparing
    the data puts the data into proper form for knowledge extraction. There are three
    steps in the data preparation stage.


    1.  Data processing

    2.  Data cleaning

    3.  Data transformation


    ### Data Processing


    This step is important as it is required to check the quality of data while we
    import it from various sources. This quality checking is done to ensure that the
    data is in the correct data type, standard format, and has no typos or errors
    in the variables. This step will reduce data issues when doing analysis. Moreover,
    in this phase, the collected unstructured data can be organized in the form of
    structured data for analysis and visualization.


    ### Data Cleaning


    Once the data processing is done, cleaning the data is required as the data might
    still have some errors. These errors will affect the actual information present
    in the data. Possible errors are as follows:


    *   Duplicates

    *   Human or machine errors

    *   Missing values

    *   Outliers

    *   Inappropriate values


    ### Duplicates


    In the database, some data is repeated multiple times, which results in `duplicates`.
    It is better to check and remove the duplicates to reduce the overhead in computation
    during data analysis.


    ### Human or Machine Errors


    The data is collected from sources either by humans or by machines. Some errors
    are inevitable during this process due to human carelessness or machine failure.
    The possible solution to avoid these kinds of errors is to match the variables
    and values with standard ones.


    ### Missing Values


    While converting the unstructured data into a structured form, some rows and columns
    may not have any values (i.e., empty). This error will cause discontinuity in
    the information and make it difficult to visualize it. There are many built-in
    functions available in programming languages we can use to check if the data has
    any missing values.'
