- fmt: '### Pie Chart


    Pie charts are generally used to show the distribution of data across different
    categories as a percentage of the entire data in the form of proportional circular
    segments. In other words, each circular segment corresponds to a particular category
    of data. By viewing pie charts, users can quickly grasp the distribution of categorical
    data by just visualizing the plot rather than seeing the percentage in numbers
    as in the case of bar plots. Another difference between pie chart and bar charts
    is that pie charts are used to compare the contribution of each category of data
    to the whole, whereas bar charts are used to compare the contribution of different
    categories of data against each other.


    To demonstrate a pie chart, let’s consider a dataset containing the details of
    immigration to Canada from 1980 to 2013\. The dataset contains various attributes
    for immigrants both entering and leaving Canada annually. These attributes include
    origin/destination name, area name, region name, etc. There are a total of 197
    rows of data based on the origin/destination of the immigrants. The following
    code plots a pie chart that shows the total number of immigrants from 1980 to
    2013 categorized by their continent:


    ```

    import pandas as pd

    import matplotlib.pyplot as plt

    df = pd.read_excel(''Canada.xlsx'',skiprows=range(20),skipfooter=2)

    df.columns = list(map(str, df.columns))

    df[''Total'']=df.sum(axis=1)

    df_continents = df.groupby(''AreaName'', axis=0).sum().reset_index()

    print(df_continents)

    Output:

    AreaName   AREA    REG     ...  2012  2013    Total

    0                          Africa   48762   49242   ...  38083 38543   765660

    1                            Asia   45815   109147  ...  152218 155075  3516953

    2                          Europe   39044   39754   ...  29177 28691   1528488

    3 Latin America and the Caribbean   29832   30395   ...  27173 24950   855141

    4                Northern America   1810    1810    ...  7892   8503    246564

    5                         Oceania   12726   13210   ...  1679     1775    93736

    ```


    After the dataset is loaded as a Pandas dataframe, the column titles with numbers
    indicating the year of data are converted to string format. This is done to ensure
    that the titles are not added when we sum across the rows to compute the total
    number of immigrants in the next step. This total number of immigrants is saved
    in an additional column created in the name `Total`. After computing the total
    number of immigrants, the data is grouped by the column titled `AreaName` containing
    the continent details of the immigrants. By doing this, the number of rows is
    now reduced to 6 from 197, which indicates that the entire dataset is grouped
    into 6 continents.


    Now the total number of immigrants from the six continents, given in the column
    titled `Total`, can be plotted as a pie chart shown in Figure [6-6](#496535_1_En_6_Chapter.xhtml#Fig6).
    Therefore, the pie chart will contain six circular segments corresponding to the
    six continents. To label these segments in the plot, the continent names present
    in the column titled `AreaName` is converted to a list and stored in a variable
    to be used as labels in the plot function. This code is illustrated here:


    ![../images/496535_1_En_6_Chapter/496535_1_En_6_Fig6_HTML.jpg](images/496535_1_En_6_Chapter/496535_1_En_6_Fig6_HTML.jpg)


    **Figure 6-6** Pie chart indicating movement of immigrants belonging to different
    continents into and out of Canada from 1980 to 2013


    ```

    t=list(df_continents.AreaName)

    plt.pie(df_continents[''Total''],labels=t,autopct=''%1.1f%%'',shadow=True)

    plt.show()

    ```


    ## Other Plots and Packages


    In addition to the fundamental plots that are discussed in this chapter, there
    are other plots available in the Matplotlib package such as contour plots, stream
    plots, 3D plots, etc., that can be used based on the nature of data or the requirement
    for analysis. Other than the Matplotlib package, other packages available provide
    more sophisticated plots that can be used to enhance the visualization for different
    categories of data. One such package is the Seaborn library, which can be used
    for making statistical graphics in Python. The Seaborn library provides more sophisticated
    plots like the boxplot, heatmap, violin plot, cluster map, etc., that can provide
    enhanced visualization of data. You are encouraged to explore these other categories
    of plots and libraries.


    # 7. Analyzing the Data


    ## Exploratory Data Analysis


    *Exploratory data analysis* (EDA) is the process of understanding the data by
    summarizing its characteristics. This step is important before modeling the data
    for machine learning. From this analysis, the user can extract the information,
    identify the root cause of any issues in the data, and figure out the steps to
    initiate any policies for development. In simple terms, this type of analysis
    explores the data to understand and identify the patterns and trends in it. There
    is no common method for doing EDA; it depends on the data we are working with.
    For simplicity in this chapter, we will use common methods and plots for doing
    EDA.'
