- fmt: '# Recommended Raspberry Pi Version


    There are different versions of Raspberry Pi available, but the Raspberry Pi 4
    is recommended for data science projects as it is more powerful than the other
    versions and also comes with RAM options up to 4GB.


    The Raspberry Pi Zero WH is the smallest variant of the Raspberry Pi available,
    and it is recommended when the size of the single-board computer needs to be small.
    But it comes with a comparatively slower processor, less RAM, and fewer GPIO pins.


    # Interfacing the Raspberry Pi with Sensors


    This section highlights how to interface the Raspberry Pi with sensors.


    ## GPIO Pins


    The GPIO pins shown in Figure [3-9](#496535_1_En_3_Chapter.xhtml#Fig9) are one
    of the most powerful features of the Raspberry Pi. The GPIO pins are the row of
    little pins along the edge of the board. All Raspberry Pi versions released recently
    have a 40-pin GPIO header. These pins are the connections between the Raspberry
    Pi and the real world. GPIO pins can be designated as input or output in software
    and can be used for a variety of purposes like turning on/off LEDs, controlling
    servo motors, and getting data from sensors. They can be programmed in Python
    or any other language such as Scratch or C/C++.


    ![../images/496535_1_En_3_Chapter/496535_1_En_3_Fig9_HTML.jpg](images/496535_1_En_3_Chapter/496535_1_En_3_Fig9_HTML.jpg)


    Figure 3-9


    Raspberry Pi GPIO pins


    ## GPIO Pinout


    Before making any connections to the Raspberry Pi GPIO pins, we need to know the
    GPIO pinout reference. Pinout configurations are not printed on the Raspberry
    Pi, but we can get the pinout reference of any Raspberry Pi by opening the terminal
    window and typing the command `pinout`. This tool is given by the `gpiozero` library,
    which is pre-installed on the Raspbian OS.


    ## GPIO Outputs


    The Raspberry Pi has two 5V pins and two 3V3 pins; it also has eight ground pins
    (0V), which cannot be configured. The remaining 28 pins are all general-purpose
    3V3 pins. The outputs of these pins are set to 3V3 or can receive inputs up to
    3V3. A GPIO pin designated as an output pin can be set to high (3V3) or low (0V).


    ## Controlling GPIO Output with Python


    GPIO pins can be easily controlled with Python using the `gpiozero` library. Let’s
    see a simple Python example of how to turn on/off LEDs connected to GPIO pins.
    LEDs always need to be connected to the GPIO pins through a resistor. Resistors
    will ensure that only a small current will flow in the circuit; hence, the Raspberry
    Pi or the LED will be protected from damage.


    We will connect an LED to GPIO pin 17 through a 330Ω resistor, as shown in Figure
    [3-10](#496535_1_En_3_Chapter.xhtml#Fig10). Now, the LED can be made to continuously
    turn on and off using the Python code given in Listing [3-1](#496535_1_En_3_Chapter.xhtml#PC1).
    The `led.on()` function turns on the LED, and the `led.off()` function turns off
    the LED.


    ![../images/496535_1_En_3_Chapter/496535_1_En_3_Fig10_HTML.jpg](images/496535_1_En_3_Chapter/496535_1_En_3_Fig10_HTML.jpg)


    Figure 3-10


    Connecting LED to GPIO pins


    ```

    from gpiozero import LED

    from time import sleep

    led = LED(17)

    while True:

    led.on()

    sleep(1)

    led.off()

    sleep(1)

    ```


    Listing 3-1


    LED Function Using GPIO


    ## GPIO Input Signals


    GPIO pins that are designated as input pins can be read as high (3V3) or low (0V).
    This means that the GPIO pins do not support analog input and can receive digital
    input only. Although there is no hardware for an analog-to-digital converter in
    the Raspberry Pi, we can use an external ADC such as the MCP3008 to read analog
    data from sensors.


    ### Reading GPIO Inputs with Python


    Sensors can be easily interfaced with the Raspberry Pi by connecting them to GPIO
    pins. The sensors can be powered by connecting the VCC of the sensor to 3.3V/5V
    of the Raspberry Pi and connecting the GND of the sensor to the GND of the Raspberry
    Pi. Digital output from the sensor can be directly connected to the GPIO pins
    and read. But while reading an analog output, an analog-to-digital converter required
    to interface a analog sensor with Raspberry Pi.


    #### Digital Signals from Sensors


    The Raspberry Pi considers any input below 1.8V as low (0) and anything above
    1.8V as high (1), as shown in Figure [3-11](#496535_1_En_3_Chapter.xhtml#Fig11).
    Digital output data from any sensor can be easily read using the `InputDevice.value`
    function. This function returns the current state of the given GPIO pin.


    ![../images/496535_1_En_3_Chapter/496535_1_En_3_Fig11_HTML.jpg](images/496535_1_En_3_Chapter/496535_1_En_3_Fig11_HTML.jpg)


    Figure 3-11


    Low and high inputs


    The code in the Listing [3-2](#496535_1_En_3_Chapter.xhtml#PC2) prints the state
    of GPIO pin 17 every second.


    ```

    from gpiozero import InputDevice

    from time import sleep

    sensor = InputDevice(17, pull_up=True)

    while True:

    print(sensor.value)

    sleep(1)

    ```


    Listing 3-2


    State of GPIO


    #### Analog Signals from Sensors


    Figure [3-12](#496535_1_En_3_Chapter.xhtml#Fig12) illustrates an analog signal.
    To read analog signals from sensors or some other devices, we should use an analog-to-digital
    converter such as MCP3008 for the Raspberry Pi. An ADC converts the analog signals
    into digital signals. The Serial Peripheral Interface (SPI) protocol is used to
    communicate the output from the ADC to the Raspberry Pi.


    ![../images/496535_1_En_3_Chapter/496535_1_En_3_Fig12_HTML.jpg](images/496535_1_En_3_Chapter/496535_1_En_3_Fig12_HTML.jpg)


    Figure 3-12


    Analog signal


    To enable SPI communication, open the Raspberry Pi configuration from the main
    menu and enable SPI on the Interfaces tab. MCP3008 is a 10-bit ADC and has eight
    input channels (0–7). Let’s connect an analog input to the first channel (0) of
    the MCP3008 and the other pins of the MCP3008, as shown in Figure [3-13](#496535_1_En_3_Chapter.xhtml#Fig13).


    ![../images/496535_1_En_3_Chapter/496535_1_En_3_Fig13_HTML.jpg](images/496535_1_En_3_Chapter/496535_1_En_3_Fig13_HTML.jpg)


    Figure 3-13


    10-bit ADC MCP3008


    The code in Listing [3-3](#496535_1_En_3_Chapter.xhtml#PC3) prints the analog
    value of the sensor connected to the first channel (0) of MCP3008 every second.
    Since MCP3008 is a 10-bit ADC, the output value ranges from 0 to 1023.


    ```

    from gpiozero import MCP3008

    from time import sleep

    sensor = MCP3008(0)

    while True:

    print(sensor.value)

    sleep(1)

    ```


    Listing 3-3


    Implement the MCP3008'
