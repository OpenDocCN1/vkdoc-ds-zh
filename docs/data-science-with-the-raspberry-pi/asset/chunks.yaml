- fmt: '### Preparing the Industry Data in the Raspberry Pi


    We will use a dataset consisting of two columns of data recorded from the temperature
    and humidity sensor connected to a Raspberry Pi board; the data was recorded every
    5 minutes over a duration of 28 hours. So, the dataset is essentially time-series
    data in `.csv` format. It is always better to get an understanding of the dataset
    before doing preprocessing. Therefore, the first step will be to read the file
    and print the contents, as illustrated here:


    ```

    import pandas as pd

    import matplotlib.pyplot as plt

    import numpy as np

    dataset=pd.read_csv(''datasets_384649_744229_log_temp.csv'')

    print(dataset.head())

    Output

    Date      Time    Temperature    Humidity

    0  3/14/19  19:33:07         T=22.0      H=20.0

    1  3/14/19  19:38:10         T=22.0      H=20.0

    2  3/14/19  19:43:11         T=22.0      H=26.0

    3  3/14/19  19:48:14         T=22.0      H=26.0

    4  3/14/19  19:53:15         T=22.0      H=20.0

    ```


    From the first five entries of the dataset printed, it is clear that the data
    needs to be cleaned before we start analyzing it. The first two columns consisting
    of the date and time of the entry are not needed for the analysis, and hence those
    columns can be dropped. The third and fourth columns consisting of the actual
    data are a mix of string and numbers. We have to filter out these inappropriate
    values and convert the dataset from `string` to `float`. These two operations
    can be performed as illustrated here:


    ```

    # drop the date and time column

    drop=[''Date'',''Time'']

    dataset.drop(drop,inplace=True,axis=1)

    # remove the ''T='' and ''H='' string

    dataset[''Temperature'']=dataset[''Temperature''].str.replace(''T='','''')

    dataset[''Humidity'']=dataset[''Humidity''].str.replace(''H='','''')

    dataset=dataset.astype(float)

    print(dataset.head())

    Output:

    Temperature    Humidity

    0          22.0        20.0

    1          22.0        20.0

    2          22.0        26.0

    3          22.0        26.0

    4          22.0        20.0

    ```


    The next step is to check for missing data in both columns. As discussed earlier,
    the missing data is normally in the form of NaN, and the function `isna()` from
    the Pandas package can be used to detect the presence of such data. The function
    `where()` from the NumPy data can be used along with the function `isna()` to
    get the location of the missing values in the respective columns, as illustrated
    here:


    ```

    print(np.where(dataset[''Temperature''].isna()))

    print(np.where(dataset[''Humidity''].isna()))

    Outpu:

    (array([206, 207, 214, 215, 216, 217, 218, 219, 220, 221, 222, 223, 224,

    225, 226, 227], dtype=int64),)

    (array([206, 207, 214, 215, 216, 217, 218, 219, 220, 221, 222, 223, 224,

    225, 226, 227], dtype=int64),)

    ```


    As we can see from the previous result, there is missing data in both the temperature
    column and the humidity column, and the location of the missing data is the same
    in both columns. The next step will be to treat the missing values. The method
    of treating the missing values can vary depending on the nature of data. In our
    dataset, since we are have temperature and humidity values measured every five
    minutes, it is safe to assume that there will not be much variation over the range
    of the missing values. Therefore, the missing values can be filled using the `ffill`
    method, which stands for “forward fill” where the missing values are replaced
    by the values in the previous row. This can be implemented using the `fillna()`
    function in the Pandas package. After the implementation of this filling process,
    this can be verified by using the `isna().any()` function, which will return false
    if there are no missing values in any of the columns, as illustrated here:


    ```

    dataset[''Temperature'']=dataset[''Temperature''].fillna(axis=0,method=''ffill'')

    dataset[''Humidity'']=dataset[''Humidity''].fillna(axis=0,method=''ffill'')

    print(dataset.isna().any())

    Output:

    Temperature    False

    Humidity       False

    dtype: bool

    ```


    Now that the missing values are treated, the next step is to look for outliers
    in the data. For this, let’s use the Z-score we discussed earlier. Before computing
    the Z-score, the entries in the dataset should be converted to integers. The following
    code illustrates the detection and removal of outliers using the Z-score:


    ```

    from scipy import stats

    z=np.abs(stats.zscore(dataset))

    df1=dataset[z>3]

    print(df1)

    dataset=dataset[(z<3).all(axis=1)]

    Output:

    Temperature  Humidity

    47             9.0     140.0

    157           37.0      12.0

    ```


    It can be seen from the previous illustration that there are two outliers corresponding
    to the row indices of 47 and 57. Rather than removing the outliers that correspond
    to the data points with a Z-score greater than 3, we retain all the data points
    with a Z-score less than 3.


    ### Exploratory Data Analysis for the Real-Time Sensor Data


    We discussed some of the fundamental plots used frequently by data scientists
    and demonstrated each plot with some readily available datasets. In this section,
    we are going to demonstrate some plots using real-time sensor data. Let’s take
    the same temperature and humidity sensor data that we used in Chapter [5](#496535_1_En_5_Chapter.xhtml)
    to discuss the concepts of preparing the data. As we already went through all
    the data cleaning steps in that chapter, the same code is provided here for preparing
    the data before going for plots:


    ```

    import pandas as pd

    import matplotlib.pyplot as plt

    import numpy as np

    from scipy import stats

    dataset=pd.read_csv(''datasets_384649_744229_log_temp.csv'')

    # drop the date and time column

    drop=[''Date'',''Time'']

    dataset.drop(drop,inplace=True,axis=1)

    # remove the string  header''T='' and ''H=''

    dataset[''Temperature'']=dataset[''Temperature''].str.replace(''T='','''')

    dataset[''Humidity'']=dataset[''Humidity''].str.replace(''H='','''')

    dataset=dataset.astype(float)

    print(''After removing inappropriate data\n'',dataset.head())

    # detect the location of missing data, if any

    print(''Missing values in temperature\n'',np.where(dataset[''Temperature''].isna()))

    print(''Missing values in humidity\n'',np.where(dataset[''Humidity''].isna()))

    # filling the missing values using forward fill

    dataset[''Temperature'']=dataset[''Temperature''].fillna(axis=0,method=''ffill'')

    dataset[''Humidity'']=dataset[''Humidity''].fillna(axis=0,method=''ffill'')

    # detect and remove outliers using z-score

    z=np.abs(stats.zscore(dataset))

    df1=dataset[z>3]

    dataset=dataset[(z<3).all(axis=1)]

    print(dataset.head())

    Output:

    After removing inappropriate data

    Temperature     Humidity

    0                       22.0         20.0

    1                       22.0         20.0

    2                       22.0         26.0

    3                       22.0         26.0

    4                       22.0         20.0

    Missing values in temperature

    (array([206, 207, 214, 215, 216, 217, 218, 219, 220, 221, 222, 223, 224,

    225, 226, 227], dtype=int64),)

    Missing values in humidity

    (array([206, 207, 214, 215, 216, 217, 218, 219, 220, 221, 222, 223, 224,

    225, 226, 227], dtype=int64),)

    Temperature     Humidity

    0                   22.0         20.0

    1                   22.0         20.0

    2                   22.0         26.0

    3                   22.0         26.0

    4                   22.0         20.0

    ```'
