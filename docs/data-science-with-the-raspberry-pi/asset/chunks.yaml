- fmt: '# Handling Missing Values


    Missing values are quite common in raw data. Assume that the input data consists
    of product feedback from thousands of customers collected using survey forms.
    It is common behavior for customers to skip a few entries while filling out the
    survey forms. For instance, a few customers may not share their experience with
    the product, some may not share the duration for which they have been using the
    product, and a few others may not fill their contact information. While compiling
    these survey forms and converting them into a table, there is sure to be plenty
    of missing values in the table.


    Data from sensors may also have missing data due to various reasons like a temporary
    power outage at the sensor node, hardware failure, interference in communication,
    etc. Therefore, handling these missing values is the foremost task for data scientists
    while dealing with raw data. The following code illustrates the creation of a
    database of random numbers using the `random.randn` function in the NumPy library:


    ```

    import pandas as pd

    import numpy as np

    df = pd.DataFrame(np.random.randn(6,4),

    index = [''1'',''3'',''4'',''6'',''7'',''9''],

    columns = [''a'',''b'',''c'',''d''])

    ```


    It can be seen from the previous code that the indices for rows and columns have
    been allocated manually. From the indices allotted for rows, it can be seen that
    indexes 2, 5, and 8 are missing. Using the `reindex` function in the Pandas library,
    these indices are created with missing ‘Not a Number’ (`NaN`) values, as illustrated
    here:


    ```

    df=df.reindex([''1'',''2'',''3'',''4'',''5'',''6'',''7'',''8'',''9''])

    print(df)

    Output:

    a         b         c         d

    1  0.099344  0.293956  1.002970  0.516942

    2       NaN       NaN       NaN       NaN

    3  1.608906 -1.748396 -1.013634 -0.651055

    4  3.211263 -2.555312 -1.036068 -0.728020

    5       NaN       NaN       NaN       NaN

    6 -0.101766 -0.205572  1.369707 -1.133026

    7  0.062344  1.483505  0.026995  1.560656

    8       NaN       NaN       NaN       NaN

    9 -0.324347 -0.342040  0.107224  0.272153

    ```


    Now that a database with missing values has been created, the next step is to
    treat these values. Before considering the options for treating these values,
    the foremost task is to detect the location of the missing values. The `isnull()`
    function in the Pandas library can be used to detect the rows containing missing
    values, as illustrated here:


    ```

    df1=df[df.isna().any(axis=1)]

    print(df1)

    Output:

    a   b   c   d

    2   NaN NaN NaN NaN

    5   NaN NaN NaN NaN

    8   NaN NaN NaN NaN

    ```


    The previous process gives us a fair idea of the amount of missing data in our
    database. Once this missing data is detected, the next step is to treat the missing
    data. There are two ways we can do this: one is to fill the missing data with
    values, and the second one is to simply remove the missing data.


    The `fillna()` function in the Pandas library can be used to fill the missing
    values with a user-specified scalar value, as illustrated here. As shown, the
    missing values in rows 2 and 5 are replaced by 0.000000.


    ```

    df2=df.fillna(0)

    print(df2.head())

    Output:

    a         b         c         d

    1  0.099344  0.293956  1.002970  0.516942

    2  0.000000  0.000000  0.000000  0.000000

    3  1.608906 -1.748396 -1.013634 -0.651055

    4  3.211263 -2.555312 -1.036068 -0.728020

    5  0.000000  0.000000  0.000000  0.000000

    ```


    Another way to replace the missing values is to use the `ffill` or `bfill` function
    in the Pandas library. `ffill` stands for “forward fill,” which fills the missing
    values by repeating the values that occur before them, and `bfill` stands for
    “backward fill,” which fills the missing values by repeating the values that occur
    after them. The following code illustrates the forward fill approach of filling
    in the missing values:


    ```

    df3= df.fillna(method=''ffill'')

