    #### Report Generation by Reading Bar Codes Using Vision Cameras


    Today many industries have documented their products with the help of barcodes
    and QR codes. Information about the product can be printed on the product for
    easy identification and documentation. Dedicative bar/QR code scanners are available
    on the market, but it requires human effort to scan the bar/QR code on the products.
    This may decrease productivity on the assembly line. Nowadays, vision systems
    are employed to automatically scan the bar/QR code on the products. This will
    improve productivity by eliminating the human effort and by reducing the time
    on the assembly line. Hence, a camera can be interfaced with the Raspberry Pi
    to scan the bar/QR code of the products on the assembly line.


    We already discussed how to enable cameras on the Raspberry Pi in case study 2
    of this chapter (refer to case study 2 for the steps to interface a webcam with
    the Raspberry Pi). The following code [30] continuously collects the images of
    the product on the assembly line, identifies the bar/QR code in the image, decodes
    the information in the bar/QR code, and displays the decoded information on the
    image screen.


    ```

    # import the required packages

    from imutils.video import VideoStream

    from pyzbar import pyzbar

    import argparse

    import datetime

    import imutils

    import time

    import cv2

    # construct the argument parser and parse the arguments

    ap = argparse.ArgumentParser()

    ap.add_argument("-o", "--output", type=str, default="barcodes.csv",

    help="path to output CSV file containing barcodes")

    args = vars(ap.parse_args())

    # initialize the video stream and allow the camera sensor to warm up

    print("[INFO] starting video stream...")

    vs = VideoStream(src=0).start()

    #vs = VideoStream(usePiCamera=True).start()

    time.sleep(2.0)

    # open the output CSV file for writing and initialize the set of

    # barcodes found thus far

    csv = open(args["output"], "w")

    found = set()

    # loop over the frames from the video stream

    while True:

    # grab the frame from the threaded video stream and resize it to

    # have a maximum width of 400 pixels

    frame = vs.read()

    frame = imutils.resize(frame, width=400)

    # find the barcodes in the frame and decode each of the barcodes

    barcodes = pyzbar.decode(frame)

    # loop over the detected barcodes

    for barcode in barcodes:

    # extract the bounding box location of the barcode and draw

    # the bounding box surrounding the barcode on the image

    (x, y, w, h) = barcode.rect

    cv2.rectangle(frame, (x, y), (x + w, y + h), (0, 0, 255), 2)

    # the barcode data is a bytes object so if we want to draw it

    # on our output image we need to convert it to a string first

    barcodeData = barcode.data.decode("utf-8")

    barcodeType = barcode.type

    # draw the barcode data and barcode type on the image

    text = "{} ({})".format(barcodeData, barcodeType)

    cv2.putText(frame, text, (x, y - 10),

    cv2.FONT_HERSHEY_SIMPLEX, 0.5, (0, 0, 255), 2)

    # if the barcode text is currently not in our CSV file, write

    # the timestamp + barcode to disk and update the set

    if barcodeData not in found:

    csv.write("{},{}\n".format(datetime.datetime.now(),

    barcodeData))

    csv.flush()

    found.add(barcodeData)

    # show the output frame

    cv2.imshow("Barcode Scanner", frame)

    key = cv2.waitKey(1) & 0xFF

    # if the `q` key was pressed, break from the loop

    if key == ord("q"):

    break

    # close the output CSV file do a bit of cleanup

    print("[INFO] cleaning up...")

    csv.close()

    cv2.destroyAllWindows()

    vs.stop()

    ```


    The previous code acquires an image using a webcam and captures each and every
    frame using a `while` loop. Further, the frames are displayed continuously with
    the help of an infinite `while` loop. The `''q''` key is used to break the infinite
    `while` loop. Then, the image acquisition can be released with the help of `cap.release`.
    In the program, each acquired frame is fed to the `pyzbar` module to identify
    the bar/QR code in the image and also to decode the data in the bar/QR code [30].
    The decoded information is displayed in the corresponding frame. Figure [9-21](#496535_1_En_9_Chapter.xhtml#Fig21)
    shows the output of the program.


    ![../images/496535_1_En_9_Chapter/496535_1_En_9_Fig21_HTML.jpg](images/496535_1_En_9_Chapter/496535_1_En_9_Fig21_HTML.jpg)


    Figure 9-21


    Output of barcode and QR code scanner'
  trans: "\n### 可视化实时传感器数据\n\n数据清洗过程完成后，下一步是绘制数据图表。使用的图表类型取决于数据的性质以及分析流程的要求。由于我们在\
    \ 28 小时内测量了温度和湿度，因此最理想的方式是按时间绘制它们。但为了更好地理解这两个参数的变化，我们每四小时取一次平均值，并用条形图绘制这些平均值。如果我们想了解整个时间段内温度和湿度的分布情况而非其变化趋势，那么可以将温度和湿度的范围划分为若干区间，并统计每个区间内的数值计数，然后用这些数据制作饼图。这三种图表说明如下：\n\
    \n```\n# Taking average over every 4 hours\na = dataset.shape[0]\nb = []\nc =\
    \ []\nfor i in np.arange(0, a-(a%12), 48):\n    b.append(np.mean(dataset.Temperature[i:i+47]))\n\
    \    c.append(np.mean(dataset.Humidity[i:i+47]))\n# Temperature vs Time over 28\
    \ hours\nplt.subplot(221)\nplt.plot(np.linspace(0,28,a), dataset.Temperature)\n\
    plt.title('Temperature vs Time')\n# Humidity vs Time over 28 hours\nplt.subplot(222)\n\
    plt.plot(np.linspace(0,28,a), dataset.Humidity)\nplt.title('Humidity vs Time')\n\
    # Bar plot of average temperature over every 4 hours during the 28 hours\nplt.subplot(223)\n\
    x = ['1','2','3','4','5','6','7']\nplt.bar(x, b)\nplt.title('Average temperature\
    \ over every 4 hours')\n# Bar plot of average humidity over every 4 hours during\
    \ the 28 hours\nplt.subplot(224)\nplt.bar(x, c)\nplt.title('Average humidity over\
    \ every 4 hours')\n# Pie chart for temperature distribution\nd = pd.DataFrame(dataset.Temperature.value_counts(bins=4))\n\
    plt.subplot(235)\nplt.pie(d.Temperature, labels=d.index)\nplt.title('Temperature\
    \ distribution')\n# Pie chart for humidity distribution\ne = pd.DataFrame(dataset.Humidity.value_counts(bins=4))\n\
    plt.subplot(236)\nplt.pie(e.Humidity, labels=e.index)\nplt.title('Humidity distribution')\n\
    plt.show()\n```\n\n在图 9-20 中，前两个图展示了温度和湿度的分布，其中每个数据样本都沿着时间轴（以小时为单位）绘制。我们可以看出，温度和湿度如预期般呈反比关系。但随时间变化的趋势通过每四小时取一次样本平均值并以条形图绘制（如第三和第四张图所示）能更好地体现。第五和第六张图展示了饼图，侧重于温度和湿度的整体分布情况而非随时间的变化。由于传感器数据仅记录了\
    \ 28 小时，数据不会有太大变化，因此仅使用四个区间来绘制分布图。从这两张图中可以看出，在这 28 小时内，温度大多处于 15 至 20 摄氏度范围内，而湿度则大多处于\
    \ 19 至 25 范围内。\n\n![../images/496535_1_En_9_Chapter/496535_1_En_9_Fig20_HTML.jpg](img/496535_1_En_9_Fig20_HTML.jpg)\n\
    \n图 9-20\n\n温度和湿度的变化与分布\n\n### 使用视觉相机读取条形码生成报告\n\n如今，许多行业借助条形码和二维码对其产品进行文档化记录。产品信息可以印在产品上，便于识别和归档。市场上有专用的条码/二维码扫描器，但扫描产品上的条码/二维码需要人工操作。这可能会降低装配线的生产效率。如今，视觉系统被用来自动扫描产品上的条码/二维码。这将通过消除人工操作和减少装配线上的时间来提升生产效率。因此，可以将摄像头与树莓派连接，用于扫描装配线上产品的条码/二维码。\n\
    \n我们在本章的案例研究 2 中已经讨论过如何在树莓派上启用摄像头（关于将网络摄像头与树莓派连接的步骤，请参考案例研究 2）。以下代码[30]持续采集装配线上产品的图像，识别图像中的条码/二维码，解码条码/二维码中的信息，并将解码后的信息显示在图像屏幕上。\n\
    \n```\n# import the required packages\nfrom imutils.video import VideoStream\n\
    from pyzbar import pyzbar\nimport argparse\nimport datetime\nimport imutils\n\
    import time\nimport cv2\n# construct the argument parser and parse the arguments\n\
    ap = argparse.ArgumentParser()\nap.add_argument(\"-o\", \"--output\", type=str,\
    \ default=\"barcodes.csv\",\nhelp=\"path to output CSV file containing barcodes\"\
    )\nargs = vars(ap.parse_args())\n# initialize the video stream and allow the camera\
    \ sensor to warm up\nprint(\"[INFO] starting video stream...\")\nvs = VideoStream(src=0).start()\n\
    #vs = VideoStream(usePiCamera=True).start()\ntime.sleep(2.0)\n# open the output\
    \ CSV file for writing and initialize the set of\n# barcodes found thus far\n\
    csv = open(args[\"output\"], \"w\")\nfound = set()\n# loop over the frames from\
    \ the video stream\nwhile True:\n    # grab the frame from the threaded video\
    \ stream and resize it to\n    # have a maximum width of 400 pixels\n    frame\
    \ = vs.read()\n    frame = imutils.resize(frame, width=400)\n    # find the barcodes\
    \ in the frame and decode each of the barcodes\n    barcodes = pyzbar.decode(frame)\n\
    \    # loop over the detected barcodes\n    for barcode in barcodes:\n       \
    \ # extract the bounding box location of the barcode and draw\n        # the bounding\
    \ box surrounding the barcode on the image\n        (x, y, w, h) = barcode.rect\n\
    \        cv2.rectangle(frame, (x, y), (x + w, y + h), (0, 0, 255), 2)\n      \
    \  # the barcode data is a bytes object so if we want to draw it\n        # on\
    \ our output image we need to convert it to a string first\n        barcodeData\
    \ = barcode.data.decode(\"utf-8\")\n        barcodeType = barcode.type\n     \
    \   # draw the barcode data and barcode type on the image\n        text = \"{}\
    \ ({})\".format(barcodeData, barcodeType)\n        cv2.putText(frame, text, (x,\
    \ y - 10),\n                    cv2.FONT_HERSHEY_SIMPLEX, 0.5, (0, 0, 255), 2)\n\
    \        # if the barcode text is currently not in our CSV file, write\n     \
    \   # the timestamp + barcode to disk and update the set\n        if barcodeData\
    \ not in found:\n            csv.write(\"{},{}\\n\".format(datetime.datetime.now(),\n\
    \                                       barcodeData))\n            csv.flush()\n\
    \            found.add(barcodeData)\n    # show the output frame\n    cv2.imshow(\"\
    Barcode Scanner\", frame)\n    key = cv2.waitKey(1) & 0xFF\n    # if the `q` key\
    \ was pressed, break from the loop\n    if key == ord(\"q\"):\n        break\n\
    # close the output CSV file do a bit of cleanup\nprint(\"[INFO] cleaning up...\"\
    )\ncsv.close()\ncv2.destroyAllWindows()\nvs.stop()\n```\n\n上述代码使用网络摄像头采集图像，并通过\
    \ `while` 循环捕捉每一帧图像。接着，借助一个无限 `while` 循环持续显示这些帧。使用 `'q'` 键来中断这个无限 `while` 循环。然后，可以通过\
    \ `cap.release` 释放图像采集功能。在程序中，每一帧采集到的图像都被送入 `pyzbar` 模块，以识别图像中的条码/二维码，并解码条码/二维码中的数据[30]。解码后的信息显示在对应的帧中。图\
    \ 9-21 展示了该程序的输出。\n\n![../images/496535_1_En_9_Chapter/496535_1_En_9_Fig21_HTML.jpg](img/496535_1_En_9_Fig21_HTML.jpg)\n\
    \n图 9-21\n\n条形码与二维码扫描器输出结果\n"
- fmt: '### Transmitting Files or Data from the Raspberry Pi to the Computer


    In some scenarios, the data in the Raspberry Pi needs to be shared with nearby
    computers. Also, if the Raspberry Pi is somewhere else, it needs to be accessed
    via remote access. Many ways are available to transfer the data from the Raspberry
    Pi to other computers. One of the easiest and more efficient ways is to use the
    `VNC` viewer for sharing data and for remote access. `VNC` is the graphical desktop
    sharing application that allows you to control one system (i.e., the Raspberry
    Pi) from another system via remote access. This section discusses the installation
    procedure and usage of the `VNC` viewer for sharing files and controlling the
    Raspberry Pi from a remote desktop computer using `VNC`.


    To install the `VNC` in Pi, the following code is used in the command window in
    the Raspberry Pi, as shown in Figure [9-22](#496535_1_En_9_Chapter.xhtml#Fig22):


    ![../images/496535_1_En_9_Chapter/496535_1_En_9_Fig22_HTML.jpg](images/496535_1_En_9_Chapter/496535_1_En_9_Fig22_HTML.jpg)


    *Figure 9-22* Installation of the `VNC` viewer in the Raspberry Pi


    ```

    sudo apt update

    sudo apt install realvnc-vnc-server realvnc-vnc-viewer

    ```


    Meanwhile, `VNC` viewers need to be installed on a remote desktop computer. If
    the remote desktop computer has a different operating system (OS), `VNC` is compatible
    with all the OSs. After installing the `VNC` on the Pi, we have to enable the
    `VNC` server in the Raspberry Pi. The `VNC` server can be enabled graphically
    in the Raspberry Pi by following these steps:


    ![../images/496535_1_En_9_Chapter/496535_1_En_9_Fig23_HTML.jpg](images/496535_1_En_9_Chapter/496535_1_En_9_Fig23_HTML.jpg)


    *Figure 9-23* Graphically enabling the `VNC` server on the Pi


    1. Go to the Raspberry Pi graphical desktop, and select **Menu** > **Preferences**
    > **Raspberry Pi Configuration**. The Raspberry Pi Configuration window will open,
    as shown in Figure [9-23](#496535_1_En_9_Chapter.xhtml#Fig23).


    2. In the Raspberry Pi Configuration window, choose the **Interfaces** option
    and ensure that `VNC` is enabled. If `VNC` is not enabled, choose the **Enable**
    button in the window.


    3. After enabling the `VNC` server, click the `VNC` logo ![../images/496535_1_En_9_Chapter/496535_1_En_9_Figa_HTML.jpg](images/496535_1_En_9_Chapter/496535_1_En_9_Figa_HTML.jpg)
    in the upper-right corner of the Raspberry Pi graphical desktop. The `VNC` viewer
    app window will open. In it, the `IP` address of the Raspberry Pi is displayed,
    as shown in Figure [9-8](#496535_1_En_9_Chapter.xhtml#Fig8). The `IP` address
    should appear only if the Raspberry Pi is connected to a network. Here, the Raspberry
    Pi is connected via a `WiFi` network using a `WiFi` dongle/mobile phone hotspot.


    These procedures are for creating a private connection between a remote desktop
    with the Raspberry Pi. To create a private connection, both the remote desktop
    and the Raspberry Pi are connected in the same network. This will create a connection
    only within the campus of the company. If the user wants to upload the data to
    the cloud, then the user needs to sign in to the `VNC` viewer for connecting the
    Pi with the remote desktop, which can be anywhere in the world.


    By opening the `VNC` viewer in another remote desktop, as shown in Figure [9-24](#496535_1_En_9_Chapter.xhtml#Fig24),
    the `IP` address of the Raspberry Pi is entered at the space provided, and the
    `VNC` server establishes the connection between the computer and the Raspberry
    Pi. The login window will open, as shown in Figure [9-25](#496535_1_En_9_Chapter.xhtml#Fig25),
    and ask for the username and password.


    ![../images/496535_1_En_9_Chapter/496535_1_En_9_Fig25_HTML.png](images/496535_1_En_9_Chapter/496535_1_En_9_Fig25_HTML.png)


    *Figure 9-25* Establishing a connection from a desktop to the Pi using the `VNC`
    viewer


    ![../images/496535_1_En_9_Chapter/496535_1_En_9_Fig24_HTML.jpg](images/496535_1_En_9_Chapter/496535_1_En_9_Fig24_HTML.jpg)


    *Figure 9-24* `VNC` viewer in Raspberry Pi


    Typically, the username and password for the Raspberry Pi is `pi`. Enter `pi`
    for the username and password, and the Raspberry Pi desktop will appear on the
    remote desktop computer, as shown in Figure [9-26](#496535_1_En_9_Chapter.xhtml#Fig26).


    ![../images/496535_1_En_9_Chapter/496535_1_En_9_Fig26_HTML.png](images/496535_1_En_9_Chapter/496535_1_En_9_Fig26_HTML.png)


    *Figure 9-26* Raspberry Pi graphical desktop on the remote computer


    Now, the Raspberry Pi desktop can access other computers remotely. Also, the files
    and data in the Raspberry Pi can be shared by using the file sharing option in
    the `VNC` viewer, as shown in Figure [9-27](#496535_1_En_9_Chapter.xhtml#Fig27).


    ![../images/496535_1_En_9_Chapter/496535_1_En_9_Fig27_HTML.png](images/496535_1_En_9_Chapter/496535_1_En_9_Fig27_HTML.png)


    *Figure 9-27* File transfer from Raspberry Pi on remote desktop'
