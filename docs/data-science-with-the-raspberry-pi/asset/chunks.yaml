  trans: '

    # 为什么选择 Python？


    Python 是数据科学家最青睐的编程语言，原因如下：


    - 这是一款开源编程语言，拥有庞大且不断壮大的贡献者与用户社区。

    - 与 C、C++ 和 Java 等其他编程语言相比，其语法更简洁。

    - 支持用户进行面向对象编程。

    - 拥有大量的库，可用于执行开发网站、构建机器学习应用等多种任务。

    - 可应用于树莓派等嵌入式小型硬件设备，从而实现各种应用程序的实时部署。


    # Python 安装


    大多数 Linux 操作系统发行版都预装了 Python 软件包，但在 Windows 操作系统上则需要单独安装。在 Windows 操作系统上安装 Python
    的步骤如下：


    ![../images/496535_1_En_2_Chapter/496535_1_En_2_Fig1_HTML.jpg](img/496535_1_En_2_Fig1_HTML.jpg)


    图 2-1：Python 安装向导


    1. 打开浏览器，访问 Python 官方网站 `Python.org`。

    2. 在该页面点击 `Downloads` 选项卡，并在结果页面下载最新版本的软件。

    3. 下载完成后，打开安装包。在如图 2-1 所示的安装向导中，勾选 `Add Python to PATH`，这将确保 Python 被自动添加到系统环境变量路径中；否则，此路径必须在系统的
    `Environment Variables` 设置中手动添加。

    4. 点击 `Install Now` 安装该软件包。


    安装完成后，你可以在命令提示符下输入 `python --version` 来验证安装，系统将显示已安装的 Python 版本。如果没有显示版本号，则可能是安装过程或系统路径变量存在问题。


    请参阅官方网站上的 Python 文档，了解为该软件下载额外模块和包的操作步骤。你可以直接在命令提示符下开始使用 Python，也可以安装下一节介绍的各种集成开发环境（IDE）之一。


    # Python 集成开发环境（IDE）


    *集成开发环境*（IDE）是一个将开发者工具整合到图形用户界面（GUI）中的软件套件，包含编辑代码、构建、执行和调试程序等功能。Python 有许多可用的
    IDE，每种都有其自身优势。本节将讨论一些常用的 IDE。


    ## PyCharm


    PyCharm IDE 由捷克公司 JetBrains 开发。它是一款跨平台 IDE，可在 Windows、macOS 和 Linux 上使用。它提供代码分析和图形化调试器，还支持使用
    Django 进行 Web 开发以及使用 Anaconda 进行数据科学。PyCharm 的一些吸引人的特性包括智能代码补全、简单的包管理界面以及重构选项，该选项提供了对代码中多行进行修改的能力。


    ## Spyder


    Spyder 是一款用于 Python 语言科学编程的跨平台 IDE。Spyder 集成了多个科学包，包括 `NumPy`、`SciPy`、`Matplotlib`、`Pandas`、`IPython`
    以及其他开源软件。它采用 MIT 许可证发布。


    ## Jupyter Notebook


    Jupyter Notebook 是一个基于 Web 的交互式计算环境。该笔记本将代码及其输出整合在单个文档中，该文档结合了可视化图表、文本、数学方程和其他媒体，使其非常适合数据科学应用。


    ## 使用 IDLE 进行 Python 编程


    IDLE 是一款简单的跨平台 IDE，适合教育环境中的初学者。它具有多窗口文本编辑器、带有语法高亮的 Python shell 以及集成调试器等功能。由于这是
    Python 自带的默认编辑器，下面来看看如何使用 IDLE 执行 Python 代码。


    在此 IDLE 中有两种执行 Python 代码的方式。第一种是交互模式，你可以在 Python shell 中直接在 `>>>` 符号旁边输入代码，如图
    2-2 所示。每行代码在按下 `Enter` 后立即执行。使用交互模式的缺点是：保存代码时，会连同结果一并保存，这意味着你无法将保存的代码用于后续执行。


    ![../images/496535_1_En_2_Chapter/496535_1_En_2_Fig2_HTML.jpg](img/496535_1_En_2_Fig2_HTML.jpg)


    图 2-2：在交互模式下运行 Python 代码


    第二种方式是在脚本模式下运行代码，你可以打开一个脚本窗口，在其中输入完整代码，然后以 `.py` 扩展名保存，供以后使用。要打开脚本文件窗口，请转到顶部的
    `File` 菜单并点击 `New File`。在脚本窗口中，输入图 2-2 中所示的两行相同代码。图 2-3 显示了包含代码的脚本文件窗口。然后转到 `File`
    菜单，点击 `Save`，并通过指定合适的文件名保存程序。确保文件名不以数字开头，也不要与现有的 Python 关键字同名。


    ![../images/496535_1_En_2_Chapter/496535_1_En_2_Fig3_HTML.jpg](img/496535_1_En_2_Fig3_HTML.jpg)


    图 2-3：脚本文件窗口


    文件保存后，可以通过转到顶部的 `Run` 菜单并点击 `Run Module` 来执行脚本。这将执行脚本并在 Python shell 中打印输出，如图
    2-4 所示。


