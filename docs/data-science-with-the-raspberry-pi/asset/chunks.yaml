    3          22.0        26.0

    4          22.0        20.0

    ```


    The next step is to check for missing data in both columns. As discussed earlier,
    the missing data is normally in the form of NaN, and the function `isna()` from
    the Pandas package can be used to detect the presence of such data. The function
    `where()` from the NumPy data can be used along with the function `isna()` to
    get the location of the missing values in the respective columns, as illustrated
    here:


    ```

    print(np.where(dataset[''Temperature''].isna()))

    print(np.where(dataset[''Humidity''].isna()))

    Outpu:

    (array([206, 207, 214, 215, 216, 217, 218, 219, 220, 221, 222, 223, 224,

    225, 226, 227], dtype=int64),)

    (array([206, 207, 214, 215, 216, 217, 218, 219, 220, 221, 222, 223, 224,

    225, 226, 227], dtype=int64),)

    ```


    As we can see from the previous result, there is missing data in both the temperature
    column and the humidity column, and the location of the missing data is the same
    in both columns. The next step will be to treat the missing values. The method
    of treating the missing values can vary depending on the nature of data. In our
    dataset, since we are have temperature and humidity values measured every five
    minutes, it is safe to assume that there will not be much variation over the range
    of the missing values. Therefore, the missing values can be filled using the `ffill`
    method, which stands for “forward fill” where the missing values are replaced
    by the values in the previous row. This can be implemented using the `fillna()`
    function in the Pandas package. After the implementation of this filling process,
    this can be verified by using the `isna().any()` function, which will return false
    if there are no missing values in any of the columns, as illustrated here:


    ```

    dataset[''Temperature'']=dataset[''Temperature''].fillna(axis=0,method=''ffill'')

    dataset[''Humidity'']=dataset[''Humidity''].fillna(axis=0,method=''ffill'')

    print(dataset.isna().any())

    Output:

    Temperature    False

    Humidity       False

    dtype: bool

    ```


    Now that the missing values are treated, the next step is to look for outliers
    in the data. For this, let’s use the Z-score we discussed earlier. Before computing
    the Z-score, the entries in the dataset should be converted to integers. The following
    code illustrates the detection and removal of outliers using the Z-score:


    ```

    from scipy import stats

    z=np.abs(stats.zscore(dataset))

    df1=dataset[z>3]

    print(df1)

    dataset=dataset[(z<3).all(axis=1)]

    Output:

    Temperature  Humidity

    47             9.0     140.0

    157           37.0      12.0

    ```


    It can be seen from the previous illustration that there are two outliers corresponding
    to the row indices of 47 and 57\. Rather than removing the outliers that correspond
    to the data points with a Z-score greater than 3, we retain all the data points
    with a Z-score less than 3.


    ### Exploratory Data Analysis for the Real-Time Sensor Data


