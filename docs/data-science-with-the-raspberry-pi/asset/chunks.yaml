    土壤湿度传感器


    通过 `MCP3008` ADC 将土壤湿度传感器模块连接到树莓派，如图 3-19 所示。


    ![../images/496535_1_En_3_Chapter/496535_1_En_3_Fig19_HTML.jpg](img/496535_1_En_3_Fig19_HTML.jpg)


    图 3-19


    温湿度传感器与树莓派 GPIO 引脚连接


