    # 推荐的树莓派版本


    树莓派有多个版本可供选择，但对于数据科学项目，推荐使用树莓派 4，因为它比其他版本性能更强大，并且 RAM 可选配高达 4GB。


    树莓派 Zero WH 是现有树莓派中尺寸最小的版本，当对单板计算机的尺寸有小型化需求时，推荐使用该版本。但其处理器速度相对较慢，RAM 较小，且 GPIO
    引脚数量较少。


    # 树莓派与传感器的接口连接


    本节重点介绍如何将树莓派与传感器进行接口连接。


    ## GPIO 引脚


    图 3-9 中所示的 GPIO 引脚是树莓派最强大的功能之一。GPIO 引脚是沿着电路板边缘的一排小引脚。近期发布的所有树莓派版本都配备了一个 40 针的
    GPIO 接口。这些引脚是树莓派与现实世界之间的连接。GPIO 引脚可以在软件中被指定为输入或输出，并可用于多种用途，例如打开/关闭 LED、控制舵机以及从传感器获取数据。它们可以使用
    Python 或任何其他语言（如 Scratch 或 C/C++）进行编程。


    ![../images/496535_1_En_3_Chapter/496535_1_En_3_Fig9_HTML.jpg](img/496535_1_En_3_Fig9_HTML.jpg)


    图 3-9


    树莓派 GPIO 引脚


    ## GPIO 引脚排列


    在对树莓派 GPIO 引脚进行任何连接之前，我们需要了解 GPIO 引脚排列的参考信息。引脚排列配置并未印在树莓派上，但我们可以通过打开终端窗口并输入命令
    `pinout` 来获取任何树莓派的引脚排列参考信息。该工具由 `gpiozero` 库提供，该库预装在 Raspbian 操作系统中。


    ## GPIO 输出


    树莓派有两个 5V 引脚和两个 3V3 引脚；它还有八个接地引脚 (0V)，这些引脚不可配置。其余 28 个引脚都是通用的 3V3 引脚。这些引脚的输出被设置为
    3V3，或者可以接收最高 3V3 的输入。一个被指定为输出引脚的 GPIO 引脚可以设置为高电平 (3V3) 或低电平 (0V)。


    ## 使用 Python 控制 GPIO 输出


    使用 `gpiozero` 库可以轻松地通过 Python 控制 GPIO 引脚。让我们看一个简单的 Python 示例，演示如何打开/关闭连接到 GPIO
    引脚的 LED。LED 必须始终通过电阻连接到 GPIO 引脚。电阻器将确保电路中只流过很小的电流；因此，可以保护树莓派或 LED 免受损坏。


    我们将通过一个 330Ω 电阻将 LED 连接到 GPIO 引脚 17，如图 3-10 所示。现在，可以使用清单 3-1 中给出的 Python 代码使 LED
    持续亮灭。`led.on()` 函数点亮 LED，`led.off()` 函数熄灭 LED。


    ![../images/496535_1_En_3_Chapter/496535_1_En_3_Fig10_HTML.jpg](img/496535_1_En_3_Fig10_HTML.jpg)


    图 3-10


    将 LED 连接到 GPIO 引脚


    ```

    from gpiozero import LED

    from time import sleep

    led = LED(17)

    while True:

    led.on()

    sleep(1)

    led.off()

    sleep(1)

    ```


    清单 3-1


    使用 GPIO 的 LED 功能


    ## GPIO 输入信号


    被指定为输入引脚的 GPIO 引脚可以读取为高电平 (3V3) 或低电平 (0V)。这意味着 GPIO 引脚不支持模拟输入，只能接收数字输入。虽然树莓派没有用于模数转换器的硬件，但我们可以使用外部
    ADC（例如 MCP3008）来读取来自传感器的模拟数据。


    ### 使用 Python 读取 GPIO 输入


    通过将传感器连接到 GPIO 引脚，可以轻松地将传感器与树莓派进行接口连接。可以通过将传感器的 VCC 连接到树莓派的 3.3V/5V，并将传感器的 GND
    连接到树莓派的 GND 来为传感器供电。来自传感器的数字输出可以直接连接到 GPIO 引脚并进行读取。但在读取模拟输出时，需要模数转换器才能将模拟传感器与树莓派连接。


    #### 来自传感器的数字信号


    树莓派将任何低于 1.8V 的输入视为低电平 (0)，将任何高于 1.8V 的输入视为高电平 (1)，如图 3-11 所示。可以使用 `InputDevice.value`
    函数轻松读取来自任何传感器的数字输出数据。此函数返回给定 GPIO 引脚的当前状态。


    ![../images/496535_1_En_3_Chapter/496535_1_En_3_Fig11_HTML.jpg](img/496535_1_En_3_Fig11_HTML.jpg)


    图 3-11


    低电平和高电平输入


    清单 3-2 中的代码每秒打印 GPIO 引脚 17 的状态。


    ```

    from gpiozero import InputDevice

    from time import sleep

    sensor = InputDevice(17, pull_up=True)

    while True:

    print(sensor.value)

    sleep(1)

    ```


    清单 3-2


    GPIO 的状态


    #### 来自传感器的模拟信号


    图 3-12 说明了一个模拟信号。为了读取来自传感器或其他设备的模拟信号，我们应该为树莓派使用一个模数转换器，例如 MCP3008。ADC 将模拟信号转换为数字信号。串行外设接口（SPI）协议用于将
    ADC 的输出传输到树莓派。


    ![../images/496535_1_En_3_Chapter/496535_1_En_3_Fig12_HTML.jpg](img/496535_1_En_3_Fig12_HTML.jpg)


    图 3-12


    模拟信号


    要启用 SPI 通信，请从主菜单打开树莓派配置，并在“接口”选项卡上启用 SPI。MCP3008 是一款 10 位 ADC，具有八个输入通道（0-7）。让我们将一个模拟输入连接到
    MCP3008 的第一个通道 (0) 和 MCP3008 的其他引脚，如图 3-13 所示。


    ![../images/496535_1_En_3_Chapter/496535_1_En_3_Fig13_HTML.jpg](img/496535_1_En_3_Fig13_HTML.jpg)


    图 3-13


    10 位 ADC MCP3008


    清单 3-3 中的代码每秒打印连接到 MCP3008 第一个通道 (0) 的传感器的模拟值。由于 MCP3008 是 10 位 ADC，输出值范围从 0 到
    1023。


    ```

    from gpiozero import MCP3008

    from time import sleep

    sensor = MCP3008(0)

    while True:

    print(sensor.value)

    sleep(1)

    ```


