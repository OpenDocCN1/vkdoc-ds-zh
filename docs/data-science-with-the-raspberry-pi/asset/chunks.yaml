    # 选择数据集


    为了进行探索性数据分析（EDA），我们将使用可从 `Scikit-Learn` 库中导入的波士顿房价数据集。该数据集已在第 6 章中描述过。该数据集包含 506
    个样本，涵盖 13 个不同的特征属性，例如城镇人均犯罪率（`CRIM`）、每栋住宅的平均房间数（`RM`）、径向公路可达性指数（`RAD`）等，以及一个目标属性
    `MEDV`，表示自有住房的中位数价值（单位：千美元）。


    ## 导入所需的库


    第一步是加载进行探索性数据分析所需的库。在本章中，我们将使用 `Pandas`、`NumPy` 和 `Matplotlib` 等包进行绘图：


    ```

    import matplotlib.pyplot as plt

    import numpy as np

    from sklearn.datasets import load_boston

    ```


    ## 导入数据集


    波士顿房价数据集可以从 `Scikit-Learn` 库中导入，并保存为 `boston_data` 变量，如下代码所示：


    ```

    dataset = load_boston()

    ```


