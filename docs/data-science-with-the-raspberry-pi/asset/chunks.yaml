  trans: '

    # 使用深度神经网络进行目标检测


    目标检测是一种从图像或视频中识别现实世界物体（如椅子、书籍、汽车、电视、花卉、动物、人类等）的技术。该技术能够检测、识别和辨认图像中的多个物体，以便更好地理解或从现实环境中提取信息。目标检测在计算机视觉应用中扮演着重要角色，例如自动驾驶汽车、监控系统、工业自动化以及为视障人士设计的辅助设备。Python
    环境中提供了多种用于目标检测的模块，具体如下：


    - 基于特征的目标检测

    - Viola Jones 目标检测

    - 基于 HOG 特征的 SVM 分类

    - 深度学习目标检测

    - 单次多框检测器（SSD）目标检测

    - YOLO (You Only Look Once) 模型目标检测

    - 基于区域的卷积神经网络（R-CNN）

    - Faster R-CNN


    在此，我们使用了单次多框检测器来识别图像或视频中的多个物体。单次多框检测器由 C. Szegedy 等人于 2016 年 11 月提出。SSD 可以解释如下：


    - ***单次***：在此阶段，借助单个前向传播网络完成图像的定位和分类。

    - ***多框***：表示在图像中为多个物体绘制边界框。

    - ***检测器***：这是一种目标检测器，用于对图像或视频中的物体进行分类。


    图 9-14 展示了单次多框检测器的架构。


    在该架构中，输入图像的尺寸被视为 `300×300×3`。VGG-16 架构被用作基础网络，并且去掉了全连接网络。VGG-16 架构非常流行，并借助迁移学习技术具备强大的分类能力。此处，在早期阶段使用了
    VGG-16 架构的部分卷积层。关于 SSD 的详细解释，请访问 [`https://towardsdatascience.com/understanding-ssd-multibox-real-time-object-detection-in-deep-learning-495ef744fab`](https://towardsdatascience.com/understanding-ssd-multibox-real-time-object-detection-in-deep-learning-495ef744fab)。


    ![../images/496535_1_En_9_Chapter/496535_1_En_9_Fig14_HTML.jpg](img/496535_1_En_9_Fig14_HTML.jpg)


    **图 9-14** — 单次多框检测器的架构（[ *https://towardsdatascience.com/understanding-ssd-multibox-real-time-object-detection-in-deep-learning-495ef744fab*](https://towardsdatascience.com/understanding-ssd-multibox-real-time-object-detection-in-deep-learning-495ef744fab)）


    多框架构是一种识别边界框坐标的技术，它基于两个损失函数：置信度损失和位置损失。置信度损失使用分类熵来衡量边界框识别物体的置信水平。位置损失则衡量边界框与图像中物体的偏离距离。测量距离时使用
    L2 范数。多框损失可以通过以下公式计算：


    `多框损失 = 置信度损失 + α * 位置损失`


    这提供了边界框与预测物体之间的距离信息。以下代码实现了 SSD 配置文件，该文件带有用于检测 COCO 数据集类别中物体的 DNN 权重。用于检测 COCO
    类别中物体的 SSD 配置文件（即 `ssd_mobilenet_v3_large_coco_2020_01_14.pbtxt`）和 DNN 权重（即 `frozen_inference_graph.pb`）可以从
    [`https://github.com/AlekhyaBhupati/Object_Detection_Using_openCV`](https://github.com/AlekhyaBhupati/Object_Detection_Using_openCV)
    下载。


    在此上下文中，COCO 类别指的是常见物体，COCO 类别的数据集可在其官方网站获取：[`https://cocodataset.org/#home`](https://cocodataset.org/%2523home)。COCO
    包含了诸如椅子、汽车、动物、人类等常见物体的分割图像，这些分割图像可用于训练深度神经网络。请参见图 9-15 和图 9-16。


    ![../images/496535_1_En_9_Chapter/496535_1_En_9_Fig15_HTML.jpg](img/496535_1_En_9_Fig15_HTML.jpg)


    **图 9-15** — 用于物体识别的输入图像


    代码如下：


    ![../images/496535_1_En_9_Chapter/496535_1_En_9_Fig16_HTML.jpg](img/496535_1_En_9_Fig16_HTML.jpg)


    **图 9-16** — 已识别物体的输出图像


    ```

    import cv2

    thres = 0.5# Threshold to detect object

    cap = cv2.VideoCapture(0)

    cap.set(3,1280)

    cap.set(4,720)

    cap.set(10,70)

    classNames= []

    classFile = ''coco.names''

    with open(classFile,''rt'') as f:

    classNames = f.read().rstrip(''\n'').split(''\n'')

    configPath = ''ssd_mobilenet_v3_large_coco_2020_01_14.pbtxt''

    weightsPath = ''frozen_inference_graph.pb''

    net = cv2.dnn_DetectionModel(weightsPath,configPath)

    net.setInputSize(320,320)

    net.setInputScale(1.0/ 127.5)

    net.setInputMean((127.5, 127.5, 127.5))

    net.setInputSwapRB(True)

    print(''1st done'')

    while True:

    success, img = cap.read()

    classIds, confs, bbox = net.detect(img, confThreshold=thres)

    print(classIds, bbox)

    if len(classIds) != 0:

    for classId, confidence,box in zip(classIds.flatten(),confs.flatten(),bbox):

    cv2.rectangle(img,box,color=(0,255,0),thickness=2)

    cv2.putText(img,classNames[classId-1].upper(),(box[0]+10,box[1]+30),

    cv2.FONT_HERSHEY_COMPLEX,1,(0,255,0),2)

    cv2.putText(img,str(round(confidence*100,2)),(box[0]+200,box[1]+30),

    cv2.FONT_HERSHEY_COMPLEX,1,(0,255,0),2)

    cv2.imshow("Output",img)

    # Hit ''q'' on the keyboard to quit!

    ```


    当代码执行时，使用 `OpenCV capture` 函数捕获来自网络摄像头的视频帧。然后，将每一帧输入到已训练好的 SSD-DNN 模型中进行物体识别。SSD-DNN
    模型基于 COCO 类别对物体进行分类，并在检测到的图像上创建带有 COCO 类别标签和准确率的边界框。图 9-15 中的视频文件被作为输入提供给上述程序。该图中包含了椅子、书籍和鼠标等物体。从图
    9-16 中可以清晰地得出结论：基于 SSD 的 DNN 模型识别出了这三个物体，其中椅子的准确率为 72.53%，书籍为 67.41%，鼠标为 81.52%。

