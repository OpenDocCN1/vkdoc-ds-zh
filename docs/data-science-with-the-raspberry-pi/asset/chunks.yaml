- fmt: '# What Is Real-Time Data?


    `Real-time data (RTD)` is the information that is passed along to the end user
    immediately after collection. The real-time data can be either static or dynamic
    and is generally processed using `real-time computing`.


    ## Real-Time Data Analytics


    Real-time analytics is the analysis of collected data as soon as that data is
    gathered. Real-time data analytics allow us to make decisions without delay and
    can prevent problems and issues before they occur.


    Here, we are going to discuss getting real-time data about distance, humidity,
    temperature, and image data from a camera.


    ## Getting Real-Time Distance Data from an Ultrasonic Sensor


    The basic principle of ultrasonic sensors is to transmit and receive the sound
    waves. The physical variables (like distance, level, height, flow, etc.) to be
    measured can be calculated based on the time duration between transmitting waves
    and receiving echo sound waves.


    ### Interfacing an Ultrasonic Sensor with the Raspberry Pi


    Interfacing the ultrasonic sensors with Raspberry Pi was already discussed in
    Chapter [3](#496535_1_En_3_Chapter.xhtml). We will collect data from the `HC-SR04`
    ultrasonic sensor, which can be used to measure the distance from 2cm to 400cm
    with 3mm accuracy. Here our objective is to interface an ultrasonic distance sensor
    with the Raspberry Pi and save the gathered data in CSV format. For that, an ultrasonic
    distance sensor can be connected to the Raspberry Pi GPIO pins, as shown in Figure
    [4-3](#496535_1_En_4_Chapter.xhtml#Fig3).


    ![../images/496535_1_En_4_Chapter/496535_1_En_4_Fig3_HTML.jpg](images/496535_1_En_4_Chapter/496535_1_En_4_Fig3_HTML.jpg)


    Figure 4-3: Ultrasonic sensor connection with Raspberry Pi GPIO pins


    As covered in Chapter [3](#496535_1_En_3_Chapter.xhtml), we will use the `DistanceSensor`
    object from `gpiozero` library. The `distance` function returns the distance measured
    by the ultrasonic distance sensor in meters. To display in centimeters, we need
    to multiply the value by 100. The following code prints the distance measured
    by the ultrasonic distance sensor in centimeters every second and saves the collected
    data after 100 seconds.


    ```

    from gpiozero import DistanceSensor

    from time import sleep

    sensor = DistanceSensor(echo=17, trigger=4)

    n = 100

    for i in range(n):

    print(sensor.distance * 100)

    sleep(1)

    ```


    When the code is running, move the position of objects placed in front of the
    ultrasonic sensor to get different values. The measured distance (in cm) is printed
    continuously for `n` seconds; in our case, it’s 100.


    ## Getting Real-Time Image Data from a Camera


    This section explains how to get real-time video from a webcam.


    ### Getting Real-Time Video from a Webcam


    Connect the USB web camera to the Raspberry Pi via the USB port. Using the `OpenCV`
    Python library, we can access the webcam and capture images and videos from it.
    The following code can be used to get real-time video from the webcam. The collected
    frames can be analyzed in real time.


    ```

    import cv2

    vid = cv2.VideoCapture(0)

    while(True):

    ret, frame = vid.read()

    cv2.imshow(''frame'', frame)

    if cv2.waitKey(1) & 0xFF == ord(''q''):

    break

    vid.release()

    cv2.destroyAllWindows()

    ```


    ### Getting Real-Time Video from Pi-cam


    Interface a Raspberry Pi camera module to the Raspberry Pi via the Camera Serial
    Interface (CSI) port. To enable the Raspberry Pi camera, open the Raspberry Pi
    configuration from the main menu and enable Camera on the Interfaces tab. The
    following code can be used to capture an image using the Raspberry Pi camera module
    and store the captured image in the specified location: `/home/pi/Desktop/cammodule_img.jpg`.


    ```

    from picamera import PiCamera

    from time import sleep

    camera = PiCamera()

    camera.start_preview()

    sleep(5)

    camera.capture(''/home/pi/Desktop/cammodule_img.jpg'')

    camera.stop_preview()

    ```


    ## Data Transfer


    Data transmission or data transfer refers to the process of transferring data
    between two or more digital devices. The data is transmitted in analog or digital
    format, and the data transmission process enables devices or components within
    devices to communicate to each other.


    ### Serial and Parallel Communication


    Serial communication is the process of sending data one bit at a time, sequentially,
    over a communication channel or computer bus. Parallel communication is a method
    of conveying multiple binary digits (bits) simultaneously.


    ### Interfacing an Arduino with the Raspberry Pi


    We can connect an Arduino to a Raspberry Pi and transfer data from the Arduino
    to the Raspberry Pi and vice versa. The sensors, motors, and actuators can be
    connected to the Arduino and make the Arduino transfer values to and from the
    Raspberry Pi. By doing this, we can use Arduino as a node and acquire sensor data
    via these nodes.


    Arduino can be connected to the Raspberry Pi in two ways.


    *   Serial communication via USB

    *   Serial communication via GPIO pins


    #### Serial via USB


    Using an Arduino USB cable to connect the two boards is the easiest way to establish
    communication between the Arduino and Raspberry Pi boards.


    On the Raspberry Pi, choose any of the four USB ports available on the board and
    connect the USB connector. Connect the other end of the Arduino USB cable to the
    Arduino. The connector cable will be different for different versions of Arduino.


    #### Serial via GPIOs


    A serial connection can also be established using plain wires to connect between
    the Raspberry Pi GPIOs and the Arduino pins. A voltage level-shifter might be
    needed depending on the Arduino board you have.


    The Raspberry Pi operates at 3.3V, whereas the Arduino boards such as Uno, Mega,
    Leonardo, Nano, etc., operate at 5V. So, a 3.3V/5V level-shifter needs to be used
    to protect the Raspberry Pi when connecting the RX and TX pins, as shown in Figure
    [4-4](#496535_1_En_4_Chapter.xhtml#Fig4).


    ![../images/496535_1_En_4_Chapter/496535_1_En_4_Fig4_HTML.jpg](images/496535_1_En_4_Chapter/496535_1_En_4_Fig4_HTML.jpg)


    Figure 4-4: Connection between Arduino and Raspberry Pi via GPIO pins


    Generally, the use of an Arduino USB cable is recommended over GPIOs for serial
    communication.'
