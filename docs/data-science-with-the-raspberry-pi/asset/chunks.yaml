    represent the corresponding values. Therefore, bar graphs are the ideal choice
    for comparing different categories of data. Bar charts can also be used for conveying
    the development of one or multiple variables over a period of time.


    Even though bar charts look similar to histogram plots, there are subtle differences
    between them. For instance, histograms are used to plot the distribution of variables,
