    # Introduction


    In modern times data can be thought of as a valuable commodity like oil or gold
    because we can get a lot of useful information from data with the help of some
    scientific methods, and we can make intelligent decisions based on that information
    and convert it into money. *Data science* is the process of extracting knowledge/useful
    information from the data.


    For example, IBM forecasted that the demand for skilled people in data science
    will increase by 28 percent in 2020. Many industries use data science concepts
    in different aspects of their business such as checking whether they have achieved
    their targets, finding the root cause of failures, etc. Recently, data science
    has been effectively implemented in politics to develop strategies, identify the
    weak regions, predict the emotions and expectations of the people, etc. Further,
    local governments utilize the data collected from the people of their town to
    devise the planning and policies for the development of the town. Data science
    is also successfully applied in the agricultural domain in areas like drought
    assessment, crops yield and remote sensing, etc. This shows that the applications
    related to data science concepts are emerging nowadays across multiple domains.


    Most of the recent books have focused on applying data science techniques to some
    open and standard dataset. This book is specifically about applying data science
    concepts in the Raspberry Pi board. The Raspberry Pi can act as a single on board
    computer and can also interact with the real-time environment via sensors as most
    of the local servers can’t do this task.


    The book will start with a brief introduction to data science followed by which
    there will be a dedicated chapter for explaining the concepts of Python starting
    from the installation of the software to the various data types and modules available.
    The next two chapters will introduce the readers to Raspberry Pi devices, their
    hardware description, and the setting up of the devices for gathering real-time
    data. The next four chapters will deal with the different operations in data science
    with respect to real time applications using Raspberry Pi hardware. The penultimate
    chapter of the book will discuss about the concepts that will enable the Raspberry
    Pi to learn from the data. The last chapter will have few case studies that will
    give the readers an idea of the range of domains where these concepts can be applied.


    # Acknowledgments


    First, I wish to thank the almighty Allah for giving me strength and courage in
    writing this book. Writing a book is more complex than I thought. We struggled
    many times when developing the content of this book because this book focuses
    not only the concepts but also on the real-time implementation details on the
    Raspberry Pi.


    My sincere thanks to my family, especially my mom and dad. Without them, I would
    not have attained this level of achievement.


    A very special thanks to my wife Mrs. M. Jashima Parveen for her support and love.
    She always set me free for writing this book. In my hard times, her support and
    encouragement gave me strength and courage. I could not have done it without her.


    My sincere thanks to chief editor Mr. Aaron Black and book coordinator Ms. Jessica
    Vakkili for their enormous support. Even when some of the chapters were delayed,
    they gave their support in developing the contents of the book.


    My heartfelt thanks to the management of Dr. Mahalingam College of Engineering
    and Technology, Pollachi, especially, I thank to my Head of the Department, Dr.
    R. Sudhakar, Professor, for his encouragement and trust in my work and knowledge.


    Last but not least, special thanks to my colleague G. Anand for his support and
    coordination in writing the book.


