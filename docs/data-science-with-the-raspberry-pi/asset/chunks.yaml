- fmt: '### Filtering Out Inappropriate Values


    In some cases, the dataset may contain some inappropriate values that are completely
    irrelevant to the data. This is especially true in the case of sensor data. The
    data recorded from the sensor is normally time-series data with a unique timestamp
    for each data point. These timestamps are not required for analysis in many cases
    and hence can be treated as inappropriate values. To illustrate this concept,
    we create a time-series temperature data similar to the sensor data as follows:


    ```

    import pandas as pd

    data={''Time'':[''12:00:05'',''12:08:33'',''12:25:12'',''12:37:53'',''12:59:08''],

    ''Temperature'':[''T=22'',''T=22'',''T=23'',''T=23'',''T=24'']}

    df=pd.DataFrame.from_dict(data)

    print(df)

    Output:

    Time Temperature

    0  12:00:05        T=22

    1  12:08:33        T=22

    2  12:25:12        T=23

    3  12:37:53        T=23

    4  12:59:08        T=24

    ```


    Now, the timestamp corresponding to each data point and the header `''T=''` in
    each data point should be removed. The timestamp can be removed using the `drop`
    function in the Pandas library, whereas the header can be removed by using the
    `str.replace` function. Because of the presence of a header in each data point,
    the data is initially stored as a string data type. So, the datatype has to be
    changed to `int` or `float` after removing these headers. These procedures are
    illustrated as follows:


    ```

    df.drop(''Time'',inplace=True,axis=1)

    df=df.Temperature.str.replace(''T='','''')

    df=df.astype(float)

    print(df)

    Output:

    0    22.0

    1    22.0

    2    23.0

    3    23.0

    4    24.0

    Name: Temperature, dtype: float64

    ```


    ### Removing Duplicates


    Duplicate entries are common in data science, especially when we collect data
    from various sources and consolidate them for processing. Depending on the nature
    of our analysis, these duplicates may pose a problem. Therefore, it is better
    to remove these duplicates before analyzing the data, as illustrated here:


    ```

    import pandas as pd

    a={''Name'':[''Alan'',''Joe'',''Jim'',''Tom'',''Alan'',''Anna'',''Elle'',''Rachel'',''Mindy''],

    ''Age'':[22,24,25,24,22,23,21,22,23]}

    df=pd.DataFrame.from_dict(a)

    print(''DATA\n'',df)

    print(''DUPLICATES\n'',df[df.duplicated()])

    df1=df.drop_duplicates()

    print(''DATA AFTER REMOVING DUPLICATES\n'',df1)

    Output:

    DATA

    Name  Age

    0    Alan   22

    1     Joe   24

    2     Jim   25

    3     Tom   24

    4    Alan   22

    5    Anna   23

    6   Ellen   21

    7  Rachel   22

    8   Mindy   23

    DUPLICATES

    Name  Age

    4  Alan   22

    DATA AFTER REMOVING DUPLICATES

    Name  Age

    0    Alan   22

    1     Joe   24

    2     Jim   25

    3     Tom   24

    5    Anna   23

    6   Ellen   21

    7  Rachel   22

    8   Mindy   23

    ```


    As shown in the code, a `DataFrame` is created from a dictionary consisting of
    the name and age of a few people, and we have deliberately created a duplicate
    entry for the name Alan. It can be seen that the `duplicated` function in the
    Pandas library clearly identifies the second entry for this name. This duplicate
    entry is then removed by using the `drop_duplicates` function in the Pandas library.


    # Visualizing the Data


    In the previous chapter, we discussed a number of steps involved in preparing
    the data for analysis. Before analyzing the data, it is imperative to get to know
    the nature of data we are dealing with. Visualizing the data may give us some
    useful insights about the nature of data. These insights, such as patterns in
    the data, distribution of the data, outliers present in the data, etc., can prove
    to be handy in determining the methodology to be used for analyzing the data.
    In addition, visualization can be used at the end of analysis to communicate the
    findings to the party concerned, as conveying the results of analysis through
    visualization techniques can be more effective than writing pages of textual content
    explaining the findings. In this chapter, we will learn about some of the basic
    visualization plots provided by the Matplotlib package of Python and how those
    plots can be customized to convey the characteristics of different data.


    ## Matplotlib Library


    Matplotlib is a plotting library for creating publication-quality plots using
    the Python programming language. This package provides various types of plots
    based on the type of information to be conveyed. The plots come with interactive
    options such as pan, zoom, and subplot configurations. The plots can also be saved
    in different formats such as PNG, PDF, etc. In addition, the Matplotlib package
    provides numerous customization options for each type of plot that can be used
    for effective representation of the information to be conveyed.'
