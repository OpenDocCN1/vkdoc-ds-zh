    ## Raspberry Pi as an Edge Device


    Computing done at or near the source of data is known as *edge computing*. Edge
    computing is preferred over cloud computing in areas that require instant or real-time
    computing, as well as in remote locations that cannot be connected to a centralized
    cloud or have limited connectivity. The most significant advantage of edge computing
    is its capacity to reduce latency as the data gathered by the sensors is processed
    in edge devices and doesn’t need to travel far to the data centers. See Figure
    [3-22](#496535_1_En_3_Chapter.xhtml#Fig22).


    ![../images/496535_1_En_3_Chapter/496535_1_En_3_Fig22_HTML.jpg](images/496535_1_En_3_Chapter/496535_1_En_3_Fig22_HTML.jpg)


    Figure 3-22


    Raspberry Pi as edge device


    ### Edge Computing in Self-Driving Cars


    Self-driving cars will rely on edge computing as every millisecond is very crucial
    while driving on the road. The large amount of data collected from their sensors
    and cameras can’t be sent to the cloud for analysis as this would take a considerable
    amount of time and also need an uninterrupted network. So, edge computing is preferred
    for these kind of applications due to its faster speed and high reliability.


    ### What Is an Edge Device?


    Edge computing is done in edge devices. Edge devices are capable of gathering,
    storing, and processing data in real time. As a result, the edge devices provide
    faster response and have better reliability. Sensors and other devices are connected
    to the edge device via wired cables or wireless connectivity such as Wi-Fi or
    Bluetooth, as shown in Figure [3-22](#496535_1_En_3_Chapter.xhtml#Fig22). Sometimes
    the edge devices are connected to a centralized cloud for big data processing
    and data warehousing.


    ### Edge Computing with the Raspberry Pi


    The Raspberry Pi has good computing power and the ability to connect to sensors
    and devices through wired and wireless connections. The Raspberry Pi also supports
    many computer programming languages such as Python, C/C++, and Java. This makes
    the Raspberry Pi an excellent choice for edge computing.


    ## Raspberry Pi as a Localized Cloud


    In this chapter, we’ll discuss using the Raspberry Pi as a localized cloud.


    ### Cloud Computing


    Cloud computing is the practice of using a network of remote servers hosted on
    the Internet to store, manage, and process data. These remote servers are called
    *cloud servers* and are located in data centers all over the world. Accessing
    data from these kind of servers requires strong Internet connectivity.


    ### Raspberry Pi as Localized Cloud


    Nowadays, IoT devices generate huge volumes of data at high speed. Often this
    data requires real-time processing to make quick decisions, and this can be supported
    by a localized cloud. Also, some of the IoT sensor networks are deployed at remote
    areas with sparse Internet connectivity, which challenges the concept of a localized
    cloud. The Raspberry Pi can be made as a localized cloud to support real-time
    data processing closer to the IoT networks. It needs to be connected to a network
    via Ethernet or Wi-Fi. The Raspberry Pi as a localized cloud can be used to store
    and process data collected from sensors or from other devices such as computers
    and mobile phones, as illustrated in Figure [3-23](#496535_1_En_3_Chapter.xhtml#Fig23).


    ![../images/496535_1_En_3_Chapter/496535_1_En_3_Fig23_HTML.jpg](images/496535_1_En_3_Chapter/496535_1_En_3_Fig23_HTML.jpg)


    Figure 3-23


    Raspberry Pi as a localized cloud


    ### Connecting an External Hard Drive


    External hard disk drives can be connected to the Raspberry Pi to increase its
    storage capacity. These HDDs need to be powered externally using a power supply.
    If there is no power supply, they can be connected via a powered USB hub. This
    enhanced storage can allow the Raspberry Pi to collect and process large amounts
    of real-time data from IoT networks.


    ### Connecting USB Accelerator


    Coral USB Accelerator is a super-fast development board for deep learning practitioners
    to deploy their models without the need for the Internet, thereby enabling edge
    computing. It brings a machine learning interface to the Raspberry Pi. It consists
    of an edge TPU coprocessor, which is capable of performing 4 trillion operations
    (tera-operations) per second (TOPS). This makes running ML models in real time
    possible. For example, the device can help the Raspberry Pi run MobileNet v2 models
    at 400 FPS.


    # 4. Sensors and Signals


    This chapter covers sensors and signals.'
