    ### 饼图


    饼图通常用于以百分比形式展示不同类别数据在整体中的分布情况，其表现形式为成比例的圆弧形切片。换句话说，每个圆弧形切片对应一个特定的数据类别。通过查看饼图，用户仅凭视觉观察就能快速掌握分类数据的分布，无需像条形图那样查看具体的百分比数字。饼图与条形图的另一个区别在于：饼图用于比较每个数据类别对整体的贡献，而条形图则用于比较不同数据类别之间的贡献。


    为了演示饼图，我们考虑一个包含 1980 年至 2013 年加拿大移民详细信息的数据集。该数据集包含了每年出入加拿大的移民的各项属性。这些属性包括原籍国/目的地名称、地区名称、区域名称等。根据移民的原籍国/目的地，共有
    197 行数据。以下代码绘制了一个饼图，展示 1980 年至 2013 年间按大洲分类的移民总数：


    ```

    import pandas as pd

    import matplotlib.pyplot as plt

    df = pd.read_excel(''Canada.xlsx'',skiprows=range(20),skipfooter=2)

    df.columns = list(map(str, df.columns))

    df[''Total'']=df.sum(axis=1)

    df_continents = df.groupby(''AreaName'', axis=0).sum().reset_index()

    print(df_continents)

    Output:

    AreaName   AREA    REG     ...  2012  2013    Total

    0                          Africa   48762   49242   ...  38083 38543   765660

    1                            Asia   45815   109147  ...  152218 155075  3516953

    2                          Europe   39044   39754   ...  29177 28691   1528488

    3 Latin America and the Caribbean   29832   30395   ...  27173 24950   855141

    4                Northern America   1810    1810   ...  7892   8503    246564

    5                         Oceania   12726   13210   ...  1679     1775    93736

    ```


    将数据集加载为 Pandas 数据框后，其中表示数据年份的数字列标题被转换为字符串格式。这样做是为了确保在下一步对行求和计算移民总数时，不会将标题也计入总和。这个移民总数被保存在一个名为
    `Total` 的新增列中。计算完移民总数后，数据按照包含移民大洲信息的 `AreaName` 列进行分组。通过这样做，行数从 197 行减少到了 6 行，这表明整个数据集被分成了
    6 个大洲。


    现在，这六个大洲的移民总数（位于 `Total` 列中）可以绘制成饼图，如图 6-6 所示。因此，饼图将包含对应于六大洲的六个圆弧形切片。为了在图中标记这些切片，我们将
    `AreaName` 列中的大洲名称转换为列表，并存储在一个变量中，以便在绘图函数中用作标签。此代码示例如下：


    ![../images/496535_1_En_6_Chapter/496535_1_En_6_Fig6_HTML.jpg](img/496535_1_En_6_Fig6_HTML.jpg)


    **图 6-6** 饼图显示 1980 年至 2013 年间来自不同大洲的移民进出加拿大的情况


    ```

    t=list(df_continents.AreaName)

    plt.pie(df_continents[''Total''],labels=t,autopct=''%1.1f%%'',shadow=True)

    plt.show()

    ```


    ## 其他图表与扩展包


    除了本章讨论的基本图表外，Matplotlib 扩展包中还提供了其他图表，如等高线图、流线图、3D 图等，可以根据数据性质或分析需求选择使用。除了 Matplotlib
    扩展包，还有其他扩展包可以提供更复杂的图表，用于增强不同类别数据的可视化效果。其中一个扩展包是 Seaborn 库，它可用于在 Python 中制作统计图形。Seaborn
    库提供了诸如箱线图、热力图、小提琴图、聚类图等更复杂的图表，能够提供增强的数据可视化效果。我们鼓励您探索这些其他类别的图表和库。


    # 7. 数据分析


    ## 探索性数据分析


    *探索性数据分析*（EDA）是通过总结数据特征来理解数据的过程。在机器学习中对数据进行建模之前，这一步非常重要。通过此分析，用户可以提取信息，识别数据中任何问题的根本原因，并确定启动任何开发策略的步骤。简而言之，这种类型的分析旨在探索数据，以理解和识别其中的模式和趋势。进行
    EDA 没有通用方法；它取决于我们正在处理的数据。为了简化本章内容，我们将使用常见的方法和图表来进行 EDA。

