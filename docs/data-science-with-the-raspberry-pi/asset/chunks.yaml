    signal values occur.


    The peak to peak slope (PPS) is defined as the ratio of peak to peak signal value
    (PP) to the peak to peak time value (PPT) and is shown in Equation 9-4.


    ![$$ {s}_{pp s}=\frac{s_{pp}}{t_{pp}} $$](images/496535_1_En_9_Chapter/496535_1_En_9_Chapter_TeX_IEq2.png)
    (9-4)


    Here, *s*[*pp*] is the peak to peak signal value, and *t*[*pp*] is the peak to
    peak time window.


    The signal power (P) is defined as the signal that exists for infinite time for
    constant amplitude. The signal power is shown in Equation 9-5.


    ![$$ P=\frac{1}{T}\sum {\left|s(t)\right|}^2 $$](images/496535_1_En_9_Chapter/496535_1_En_9_Chapter_TeX_IEq3.png)
    (9-5)


    The mean value of signal (μ) is defined as the average of data samples between
    the end points of the selected area and displays the average value. The mean value
    of signal is given in Equation 9-6.


    ![$$ \mu =\frac{1}{N}\sum \limits_{i=1}^Ns\left[i\right] $$](images/496535_1_En_9_Chapter/496535_1_En_9_Chapter_TeX_IEq4.png)
    (9-6)


    where *N* is total number of samples in signals.


    Kurtosis (K) is the sharpness of the peak of a frequency-distribution curve and
    is given in Equation 9-7.


    ![$$ K=\frac{m_4}{m_2} $$](images/496535_1_En_9_Chapter/496535_1_En_9_Chapter_TeX_IEq5.png)
    (9-7)


    Here, *m*[4] and *m*[2] is the fourth moment and variance of signal.


    Mobility (M) is defined as the ratio of first-order variance of signal to the
    variance of the signal and is given in Equation 9-8.


    ![$$ M=\frac{Var{\left(s(t)\right)}^{\hbox{''}}}{Var\left(s(t)\right)} $$](images/496535_1_En_9_Chapter/496535_1_En_9_Chapter_TeX_IEq6.png)
    (9-8)


    Complexity (C) is defined as the first derivative of mobility divided by mobility
    and is given in Equation 9-9.


    ![$$ {C}_{\varepsilon }=\frac{M_{\varepsilon}^{\hbox{''}}}{M_{\varepsilon }} $$](images/496535_1_En_9_Chapter/496535_1_En_9_Chapter_TeX_IEq7.png)
    (9-9)


    The Python code for all these formulas for the nine time domain features is written
    as a single function that is later called in the main program. This function,
    which takes 15 seconds of EEG signal during the peak emotional activity of brain
    and the corresponding time samples, is illustrated here:


    ```

    def eegfeat(ynew,tnew):

    from scipy.stats import kurtosis

    # latency to amplitude ratio

    smax=max(ynew)

    locmax=np.where(ynew==smax)

    tsmax=tnew[locmax]

    lar1=tsmax/smax

    lar=lar1[0]

    # peak to peak signal value

    smin=min(ynew)

    locmin=np.where(ynew==smax)

    tsmin=tnew[locmin]

    spp=smax-smin

    # peak to peak time window.

    tpp1=tsmax+tsmin

    tpp=tpp1[0]

    # peak to peak slope

    spps=spp/tpp

    # mean value of signal

    m=np.mean(ynew)

    # kurtosis

    k=kurtosis(ynew)

    # mobility and complexity

    n=ynew.shape[0]

    dynew=np.diff(ynew)

    ddynew=np.diff(dynew)

    mx2=np.mean(np.power(ynew,2))

    mdx2=np.mean(np.power(dynew,2))

    mddx2=np.mean(np.power(ddynew,2))

    mob=mdx2/mx2

    complexity=np.sqrt(mddx2/(mdx2-mob))

    mobility=np.sqrt(mob)

    # signal power

    tt=np.power(ynew,2)

    s=0

    for i in np.arange(0,tt.shape[0]):

    s=s+tt[i]

    signalpower=s/ynew.shape[0]

    feat = [lar, spp, tpp, spps, m, k, complexity, mobility, signalpower]

    return feat

    ```


    ### Unstructured Data to Structured Dataset


    Now that we have a function to extract features from the EEG signal, the next
    step is to develop the code to get a structured dataset. First, the EEG signals
    of all 15 participants corresponding to three different emotions are loaded one
    by one using the `pd.read_csv` function inside a `for` loop. After an EEG signal
    is loaded as a dataframe, the timestamp is removed first, and then the amplitude
    values in the remaining column are converted to a NumPy array. The array obtained
    in each iteration is then stacked to a new variable thereby providing a final
    array consisting of 45 columns corresponding to the 45 different EEG signals.
    Then each column of this array is passed to the `eegfeat` function created earlier
    that provides nine features corresponding to each column (each signal) there by
    providing a final feature array of size 9×45\. The dataset is given in Table [9-1](#496535_1_En_9_Chapter.xhtml#Tab1)
    and saved as `emotion_data1.xls` in an Excel sheet. Finally, the features are
    scaled using the `StandardScaler` and fit function in the `sklearns` module. This
    scaling works by first computing the mean and standard deviation of each feature
    for all the 45 signals and then subtracting the mean from all the values and dividing
    this difference by the standard deviation. The following code illustrates the
    feature extraction process:


    Table 9-1


