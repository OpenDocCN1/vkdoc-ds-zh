    ### Line Plot


    A line plot is nothing but a series of data points connected by a line, and it
    can be used to convey the trend of a variable over a particular time. Line plots
    are often used for visualizing time-series data to observe the variation of data
    with respect to time. It can also be used as part of the analysis procedure to
    check the variation of a variable in an iterative process.


    Line plots can be obtained using the `plot` function in the Matplotlib package.
    To demonstrate a line plot, let’s consider a time-series dataset consisting of
    the minimum daily temperature in °C over 10 years (1981–1990) in the city of Melbourne,
    Australia. The following code illustrates the process of loading the `.csv` file
    containing the dataset, converting it into a dataframe, and plotting the variation
    in temperature for 1981.


    ```

    import pandas as pd

    import matplotlib.pyplot as plt

    import numpy as np

    dataset=pd.read_csv(''daily-min-temperatures.csv'')

    df=pd.DataFrame(dataset,columns=[''Date'',''Temp''])

    print(df.head())

    Output:

    Date    Temp

    0        1981-01-01    20.7

    1        1981-01-02    17.9

    2        1981-01-03    18.8

    3        1981-01-04    14.6

    4        1981-01-05    15.8

    plt.plot(df[''Temp''][0:365])

    plt.xlabel("Days in the year")

    plt.ylabel("Temperature in degree celcius")

    plt.show()

    ```


    The line plot in Figure [6-2](#496535_1_En_6_Chapter.xhtml#Fig2) clearly shows
    the day-to-day variation of temperature in Melbourne in 1981.


    ![../images/496535_1_En_6_Chapter/496535_1_En_6_Fig2_HTML.jpg](images/496535_1_En_6_Chapter/496535_1_En_6_Fig2_HTML.jpg)


    **Figure 6-2** – Variation in temperature (°C) in Melbourne over the year 1981


    The Matplotlib package also provides the option of subplots wherein a layout of
    subplots can be created in a single-figure object. In this time-series data example,
    we can use a simple `for` loop to extract the data for each of the 10 years and
    plot it in individual subplots, as illustrated by the following code:


    ```

    y,k=0,1

    x=np.arange(1,366)

    for i in range(10):

    plt.subplot(10,1,k)

    plt.plot(x,df[''Temp''][y:y+365])

    y=y+365

    k=k+1

    plt.xlabel("Days in the year")

    plt.show()

    ```


    Figure [6-3](#496535_1_En_6_Chapter.xhtml#Fig3) consists of 10 subplots each displaying
    the variation of temperature over a particular year from 1981 to 1990. Thus, the
    use of multiple subplots has enabled us to compare the trends in temperature variation
    in Melbourne over the decade.


    ![../images/496535_1_En_6_Chapter/496535_1_En_6_Fig3_HTML.jpg](images/496535_1_En_6_Chapter/496535_1_En_6_Fig3_HTML.jpg)


    **Figure 6-3** – Temperature variation in Melbourne over 10 years (1981 to 1990)'
