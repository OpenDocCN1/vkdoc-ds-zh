  \ `Serial` 发送下一条字符串。\n\n## 时间序列数据\n\n*时间序列*是按时间顺序索引的一系列数据点。最常见的情况是，它是在时间上连续等间隔采集的序列。因此，时间序列可以定义为一系列离散时间数据。在时间序列数据中，时间通常是自变量，目标通常是对未来进行预测。\n\
