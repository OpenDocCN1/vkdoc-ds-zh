  ### 统计分析


  更好地理解手头的数据，可以极大地简化数据科学家的工作，而统计学在这方面能派上用场。统计学能够提供必要的工具来识别数据中的结构，这些见解对于构建最佳拟合数据模型非常有价值。统计学在数据方面的作用，从简单的分析到创建自学习模型，各不相同。在本节中，我们将介绍各种类型的分布、数据的统计度量以及将数据拟合到分布的方法。


  在讨论分布之前，让我们先理解数据是如何与概率关联的。当我们考虑一个数据集时，它通常代表总体中的一个样本。例如，如果我们有一个包含某所学校所有学生身高和体重数据的数据集，那么通过一些统计分析，基于这些数据开发的模型可以用来预测另一所学校学生的身高和体重。我们手中的数据集只是一个样本，而总体可能包含很多所学校。


  我们遇到的数值数据，本质上可以是连续的或离散的。两者的区别在于，连续数据可以取任何值，而离散数据只能取特定值。例如，每天生产的汽车数量、收到的客户反馈数量等数据本质上是离散的；而身高、体重、湿度、温度等数据则代表连续数据。


  概率分布是统计学中的一个基本概念，它提供了一种表示随机变量可能取值及其各自概率的方法。*概率质量函数*（PMF）表示离散概率分布，*概率密度函数*（PDF）表示连续概率分布。以下部分将讨论数据科学家需要了解的一些常见分布。


  #### 均匀分布


  均匀分布，也称为*矩形分布*，具有恒定的概率。换句话说，所有结果发生的概率相同。在均匀分布中，结果的数量可以是无限的。均匀分布最常见的例子是掷一颗公平的骰子，所有六个结果出现的概率相等，均为
  1/6。让我们通过绘制公平掷骰子实验中结果的概率来说明均匀分布。也就是说，骰子每个面出现的概率是均等的。图 7-1 展示了这个分布图。


  ![../images/496535_1_En_7_Chapter/496535_1_En_7_Fig1_HTML.jpg](img/496535_1_En_7_Fig1_HTML.jpg)


  图 7-1


  公平掷骰子实验的均匀分布


  ```python

  import numpy as np

  import matplotlib.pyplot as plt

  probabilities = np.full((6),1/6)

  events = [1,2,3,4,5,6]

  plt.bar(events,probabilities)

  plt.xlabel(''骰子点数'')

  plt.ylabel(''事件概率'')

  plt.title(''公平骰子 - 均匀分布'')

  plt.show()

  ```


  如果对一个数据集绘制直方图，将数值数据划分为若干区间，并且发现所有区间都具有相同的分布，那么可以说该数据集是均匀分布的。


  #### 二项分布


  顾名思义，这种分布用于只有两种可能结果的情况。遵循二项分布的随机变量 `X` 依赖于两个参数：


  *   在二项分布中，实验次数 `n` 必须是固定的，并且每次实验被认为是相互独立的。换句话说，某次实验的结果不依赖于之前实验的结果。

  *   每个事件只有两种可能的结果：成功或失败。每次实验中成功的概率（记为 `p`）保持不变。


  因此，Python 中的二项分布函数通常接受两个值作为输入：实验次数 `n` 和成功概率 `p`。为了理解二项分布，让我们看看常见的抛硬币实验：


  ```python

  from scipy.stats import binom

  import matplotlib.pyplot as plt

  import numpy as np

  n=15 # 抛硬币次数

  r_values = list(range(n + 1))

  x=[0.2,0.5,0.7,0.9]  # 得到正面的概率

  k=1

  for p in x:

  dist = [binom.pmf(r, n, p) for r in r_values ]

  plt.subplot(2,2,k)

  plt.bar(r_values,dist)

  plt.xlabel(''正面次数'')

  plt.ylabel(''概率'')

  plt.title(''p= %.1f'' % p)

  k+=1

  plt.show()

  ```


  在前面的代码中，我们抛了 15 次硬币。每次实验得到正面的概率保持不变，并且每次实验的结果独立于之前的结果。二项分布是使用 `scipy` 包中 `stats`
  模块提供的 `binom.pmf` 函数计算的。通过 `for` 循环，对不同的成功概率重复该实验，图 7-2 展示了结果分布图。


  ![../images/496535_1_En_7_Chapter/496535_1_En_7_Fig2_HTML.jpg](img/496535_1_En_7_Fig2_HTML.jpg)


  图 7-2


  抛硬币 15 次的二项分布


  图 7-2 展示了我们抛硬币实验在不同成功概率下的二项分布。第一个子图显示的是得到正面概率为 0.2 时的二项分布。这意味着有 20%的机会得到正面。15 次抛掷的
  20%是 3，这意味着在 15 次抛掷中得到 3 次正面的概率很高。因此，概率在 3 处达到最大值。可以看出，二项分布具有钟形响应。当成功概率较低时，响应向左偏斜，随着概率增加，又向右移动，其余的子图也说明了这一点。


  二项分布可能出现在数据科学的各个领域。例如，当一家制药公司想要测试一种新疫苗时，只有两种可能的结果：疫苗有效或无效。此外，单个患者的结果是一个独立事件，不依赖于其他患者实验的结果。二项分布也可以应用于各种商业问题。例如，考虑销售部门的人整天打电话推销其公司产品。电话的结果是是否成功销售，并且每个员工的结果是独立的。类似地，在企业中还有许多其他具有二元结果（是/否）的领域可以应用二项分布，因此它在商业决策中扮演着重要的角色。




  #### 正态分布


  正态分布，也称为高斯分布，通常呈钟形曲线，以均值为中心，此处概率最大，且随着我们远离均值，概率会逐渐减小。这意味着接近均值的值出现频率更高，而远离均值的值出现频率更低。该分布依赖于两个参数：数据的均值（μ）和标准差（σ）。正态分布的概率密度函数（`pdf`）可以表示如下：


  ![$$ f\left(x;\mu, \sigma \right)=\frac{1}{\sqrt{2{\pi \sigma}²}}\;{e}^{-\frac{{\left(x-\mu
  \right)}²}{2{\sigma}²}} $$](img/496535_1_En_7_Chapter_TeX_Equa.png)


  为了说明`pdf`函数，请考虑以下代码。创建了一个包含 100 个值、范围在-10 到 10 之间的数组`x`，并使用`scipy`包的`stats`模块中的`norm.pdf`函数计算了`x`的`pdf`函数。通过`for`循环，针对四个不同的均值（0、2.5、5
  和 7.5）计算了`pdf`函数。如果未提供均值，`norm.pdf`函数会取默认值零。


  ```

  from scipy.stats import norm

  import matplotlib.pyplot as plt

  import numpy as np

  mean=[0.0,2.5,5,7.5] # 正态分布的均值

  x=np.linspace(-10,10,100) # 在-10 到 10 范围内包含 100 个数字的数组

  for m in mean:

  y=norm.pdf(x,loc=m)

  plt.plot(x,y,label=''mean= %.1f'' %m)

  plt.xlabel(''x'')

  plt.ylabel(''pdf(x)'')

  plt.legend(frameon=True)

  plt.show()

  ```


  图 7-3 展示了正态分布会生成一条以均值为中心的钟形曲线。也就是说，曲线在均值点处达到最大值，并且随着我们从均值向两侧移动，曲线开始下降。请注意，我们尚未指定标准差的值。在这种情况下，`norm.pdf`函数会采用默认值
  1。


  ![../images/496535_1_En_7_Chapter/496535_1_En_7_Fig3_HTML.jpg](img/496535_1_En_7_Fig3_HTML.jpg)


  图 7-3


  不同均值下的正态分布图


  类似地，让我们保持均值不变，使用以下代码绘制不同标准差下的分布图：


  ```

  from scipy.stats import norm

  import matplotlib.pyplot as plt

  import numpy as np

  stdev=[1.0,2.0,3.0,4.0] # 正态分布的标准差值

  x=np.linspace(-10,10,100)

  for s in stdev:

  y=norm.pdf(x,scale=s)

  plt.plot(x,y,label=''stdev= %.1f'' %s)

  plt.xlabel(''x'')

  plt.ylabel(''pdf(x)'')

  plt.legend(frameon=True)

  plt.show()

  ```


  从图 7-4 中，我们可以看到所有四条曲线都以默认均值零为中心。随着标准差σ值的增加，密度分布在一个更广的范围内。换句话说，随着标准差值增加，数据分布更加分散于均值周围，并且有更高的可能性出现更多远离均值的观测值。


  ![../images/496535_1_En_7_Chapter/496535_1_En_7_Fig4_HTML.jpg](img/496535_1_En_7_Fig4_HTML.jpg)


  图 7-4


  不同标准差下的正态分布图


  正态分布的一个使其对数据科学家而言成为重要统计分布的重要性质是*经验法则*。根据该法则，如果我们在 x 轴上将观测范围按标准差划分，那么大约 68.3%的值落在距均值一个标准差的范围内，95.5%的值落在两个标准差的范围内，99.7%的值落在三个标准差的范围内。如果数据符合正态分布，这个经验法则可用于识别数据中的异常值。我们在前面第
  5 章讨论过的用于异常检测的 Z 分数就应用了这一原理。


  ### 波士顿房价数据集的统计分析


  我们以波士顿房价数据集为例，尝试根据特征的统计属性，识别出可用于建模的最佳特征。正如我们已经讨论过的，波士顿数据集包含 506 个案例（506 × 13）的 13
  个不同特征。除了这些特征外，用变量`MEDV`表示的业主自住房中位数价值（以千计）被确定为预测目标。也就是说，给定 13 个不同的特征，需要估算房屋的中位数价值。首先使用
  Pandas 包将数据集中的特征转换为一个 DataFrame。然后将目标变量添加到此 DataFrame 的最后一列，使其维度变为 506 × 14。以下代码对此进行了说明：


