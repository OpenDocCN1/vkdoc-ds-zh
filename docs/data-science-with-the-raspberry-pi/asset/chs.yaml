  beta=[[-1.08011358e-01  4.64204584e-02  2.05586264e-02     2.68673382e+00\n-1.77666112e+01\
  \  3.80986521e+00  6.92224640e-04 -    1.47556685e+00\n3.06049479e-01 -1.23345939e-02\
  \ -9.52747232e-01     9.31168327e-03\n-5.24758378e-01]]\n```\n\n为了评估模型的质量，我们可以使用均方误差指标。均方误差计算实际输出与预测输出之间平方误差的平均值。\n\
  \n```\n1.8463848451630152e-29\n```\n\n图 8-2 将实际输出（`Y`）与预测输出（`Ye`）进行了对比。\n\n![../images/496535_1_En_8_Chapter/496535_1_En_8_Fig2_HTML.jpg](img/496535_1_En_8_Fig2_HTML.jpg)\n\
  \n图 8-2\n\n使用线性回归将实际输出数据与预测输出数据进行对比\n\n## 主成分分析\n\n主成分分析是一种统计方法，用于提取大规模数据集中的强特征。换句话说，通过从数据集中提取重要特征，可以降低数据集的维度。PCA\
  \ 使用标准化来识别特征之间的距离，并利用协方差信息来识别特征之间的任何关系。然后，借助特征向量和特征值来计算主成分。主成分用于提取强特征，即降低数据的维度。此外，主成分还用于优化\
  \ K-Means 聚类技术的簇数量，此处以波士顿数据集为例。波士顿数据集有 13 个特征。第一步，通过以下代码，借助 PCA 识别波士顿数据集中的强特征：\n\
  \n```\nfrom sklearn.decomposition import PCA\nfrom sklearn.preprocessing import\
  \ StandardScaler\n#config InlineBackend.figure_format='retina'\n# Load in the data\n\
  from sklearn.datasets import load_boston\ndataset = load_boston()\ndf=pd.DataFrame(dataset.data,columns=dataset.feature_names)\n\
  #df = pd.read_csv('2013_2014_cleaned.csv')\n# Standardize the data to have a mean\
  \ of ~0 and a variance of 1\nX_std = StandardScaler().fit_transform(df)\n# Create\
  \ a PCA instance: pca\npca = PCA(n_components=13)\nprincipalComponents = pca.fit_transform(X_std)\n\
  # Plot the explained variances\nfeatures = range(pca.n_components_)\nplt.bar(features,\
  \ pca.explained_variance_ratio_, color='black')\nplt.xlabel('PCA features')\nplt.ylabel('variance\
  \ %')\nplt.xticks(features)\nplt.show()\n# Save components to a DataFrame\nPCA_components\
  \ = pd.DataFrame(principalComponents)\n```\n\n从图 8-3 可以看出，前三个特征在数据集中贡献了良好的方差。\n\n\
  ![../images/496535_1_En_8_Chapter/496535_1_En_8_Fig3_HTML.jpg](img/496535_1_En_8_Fig3_HTML.jpg)\n\
  \n图 8-3\n\n数据集中各特征相对于方差的分布\n\n因此，可以选择五个特征进行聚类。对于聚类，可以使用 K-Means 聚类。为了确定最佳簇数量，将 PCA\
  \ 与 K-Means 聚类算法拟合，并计算所选主成分下聚类模型的惯性。以下代码识别了聚类模型的惯性，并绘制了簇数量（即 `k`）与惯性的关系图（此代码延续了前面的\
  \ PCA 代码）。图 8-4 显示了惯性随簇数量（`k`）变化的曲线。从图 8-4 可以得出结论，当簇数量达到 `k = 5` 之后，惯性不再发生显著变化。因此，可以选择\
  \ 5 作为给定数据集的最佳簇头数量。\n\n![../images/496535_1_En_8_Chapter/496535_1_En_8_Fig4_HTML.jpg](img/496535_1_En_8_Fig4_HTML.jpg)\n\
  \n图 8-4\n\n簇数量与惯性的关系\n\n```\nks = range(1, 10)\ninertias = []\nfor k in ks:\n# Create\
  \ a KMeans instance with k clusters: model\nmodel = KMeans(n_clusters=k)\n# Fit\
  \ model to samples\nmodel.fit(PCA_components.iloc[:,:3])\n# Append the inertia to\
  \ the list of inertias\ninertias.append(model.inertia_)\nplt.plot(ks, inertias,\
  \ '-*', color='blue')\nplt.xlabel('number of clusters, k')\nplt.ylabel('inertia')\n\
  plt.xticks(ks)\nplt.show()\n```\n\n\n\n## 使用 K-Means 聚类的异常值检测\n\n聚类是一种探索性数据分析技术，常用于无监督学习问题，即在对数据没有先验知识的情况下。聚类的基本思想是将数据集中的数据点分组为多个子组，这些子组被称为*簇*。每个簇中的数据点与该簇内其他数据点的相似度，要高于与其他簇中数据点的相似度。\n\
  \n广泛用于聚类操作的技术是基于质心的方法，称为 *k-means 聚类*。这是一种迭代算法，它将数据集划分为 k 个非重叠的簇，每个数据点仅被分配到一个簇中。将数据点分配到一个簇的条件是：所有数据点到其所属簇质心的距离平方和最小。k-means\
  \ 算法的工作流程如下：\n\n1.  指定簇的数量。\n2.  为每个簇随机选择中心点，也称为*质心*。\n3.  计算每个数据点到各个簇质心的距离，并将数据点分配给距离最小的簇。\n\
  4.  通过计算分配给每个簇的所有数据点的平均值，重新计算该簇的质心。\n5.  重复步骤 3 和 4，直到质心不再发生变化。\n\n除了对数据进行聚类，k-means\
  \ 算法还可用于识别数据中存在的异常值。该方法的基本思想是将每个数据点到簇质心的距离按升序排序，并将距离质心最远的那部分数据点视为异常值。\n\n为了说明这种方法，让我们看一看波士顿房价数据集。正如我们在第\
  \ 7 章讨论的，每栋房屋的平均房间数 (RM) 和自住房屋价值中位数（以千计，MEDV）高度相关。因此，这两个参数被作为二维数据用于聚类算法，如下代码所示：\n\
  \n```\nimport matplotlib.pyplot as plt\nimport numpy as np\nimport pandas as pd\n\
  from sklearn.cluster import KMeans\nfrom sklearn.preprocessing import scale\nfrom\
  \ numpy import sqrt, random, array, argsort\nfrom sklearn.datasets import load_boston\n\
  dataset = load_boston()\nboston_data=pd.DataFrame(dataset.data,columns=dataset.feature_names)\n\
  x=boston_data['RM']\ny=dataset.target\nx=x.to_numpy() # convert pandas series data\
  \ to numpy array\nx=x.reshape(x.shape[0],1)\nx=scale(x)\ny=y.reshape(y.shape[0],1)\n\
  y=scale(y)\nX=np.zeros((np.shape(x)[0],2))\nX[:,0]=x[:,0]\nX[:,1]=y[:,0]\n```\n\n\
  首先将数据集的特征加载到一个数据框中。与 RM 特征对应的列从数据框移到变量 `x` 中。由于存储在变量 `x` 中的 RM 特征是 Pandas 序列格式，因此使用\
  \ `to_numpy` 函数将其转换为 NumPy 数组，使其能够应用于 k-means 算法。然后对这个数组进行重塑，因为它需要与目标变量 MEDV 一起存储在一个二维数组中。接着，使用\
  \ `sklearn` 包中的 `scale` 函数对参数进行额外的缩放。这是为了将数据归一化到特定范围内。以类似的方式，目标 MEDV 特征（默认情况下是 NumPy\
  \ 数组）也被存储在变量 `y` 中，经过重塑和缩放。然后，两个变量 `x` 和 `y` 被合并到变量 `X` 中，使其成为一个二维变量。k-means 算法对此变量的应用如下代码所示：\n\
  \n```\nkm=KMeans(n_clusters=1).fit(X)\ndistance = km.transform(X)\nindexes = np.argsort(distance.ravel())[::-1][:20]\n\
  ```\n\n从 `sklearn` 包导入的 `Kmeans` 函数可用于实现聚类算法。该函数可以接受簇的数量、最大迭代次数等输入。在我们的代码中，我们输入的簇数量为\
  \ 1。换句话说，我们将把所有数据点分组到单个簇中。由于没有指定最大迭代次数，该函数取默认值 300 次迭代。将 k-means 算法拟合到我们的数据后，下一步是计算每个数据点到簇质心的距离。这是使用\
  \ `sklearn` 包中的 `transform` 函数完成的。得到的距离变量也是一个 *n* 维 NumPy 数组。因此，首先使用 `ravel` 函数将其展平，然后将展平的数组按降序排序。这意味着数组以离簇中心最远的数据点开始，以离中心最近的数据点结束。此排序使用\
  \ `argsort` 函数完成，该函数提供与排序后数据点对应的索引。\n\n我们知道，异常值是数据集中远离其他数据点的异常数据点。但是，什么被认为是异常，这取决于熟悉分析要求的分析师。对于波士顿房价数据，异常值包括房间数较少但价值中位数较高的房屋（价格过高），房间数较多但价值中位数较低的房屋（数据错误），以及根据要求，超过特定极限的房间数与价值组合。为了检测这些异常值，我们从排序后的索引数组中随机选取前\
  \ 20 个索引，并在所有数据点的散点图中标记这些索引对应的数据点，如下所示：\n\n```\nf,ax=plt.subplots()\nax.scatter(X[:,0],X[:,1])\n\
  ax.scatter(X[indexes][:,0],X[indexes][:,1],edgecolors='r',\nfacecolors='none', s=100)\n\
  plt.xlabel('MEDV')\nplt.ylabel('RM')\nf.show()\n```\n\n图 8-5 显示了每栋房屋的平均房间数相对于自住房屋价值中位数的散点图。数据中的异常值由带有红色圆圈的这些点表示。\n\
  \n![../images/496535_1_En_8_Chapter/496535_1_En_8_Fig5_HTML.jpg](img/496535_1_En_8_Fig5_HTML.jpg)\n\
  \n**图 8-5** 使用 k-means 聚类算法检测到的异常值\n\n"
- "# 9. 案例研究\n\n本章介绍了实施数据科学概念的真实世界案例研究。讨论了三种场景：基于脑电图信号的人类情感分类、图像数据和工业 4.0 的数据科学概念。\n\
  \n对于人类情感分类，使用 NeuroSky MindWave Mobile 套件提取人类的脑电图信号，并在树莓派上接收和分析这些信号。NeuroSky MindWave\
  \ Mobile 套件和树莓派可以通过蓝牙连接。在图像数据中，应用数据科学步骤对图像数据进行预处理以进行进一步分析。在工业 4.0 案例研究中，树莓派充当本地化云。在此，许多传感器连接到树莓派，传感器信号被转换为结构化数据，以便进一步分析和可视化。\n\
  \n\n\n## 案例研究 1：人类情感分类\n\n情感是一种以强烈大脑活动为特征的感觉。大量研究聚焦于识别人类情感，其应用范围广泛，包括医疗、健康、机器人学以及脑机接口（BCI）等领域。识别人类情感的方式有多种，例如面部表情识别、语音信号音调识别、脑电图（EEG）信号情感识别等。其中，基于\
  \ EEG 信号的分类是一种简单便捷的方法。此外，EEG 信号包含有关人类情感的有用信息。因此，许多研究者专注于使用 EEG 信号对人类情感进行分类。EEG 信号通过将电极放置在头皮上来测量电信号，从而记录人类大脑活动。\n\
  \n让我们考虑一个简单的情感识别系统，它使用单电极设备，即 NeuroSky MindWave 设备，从参与者处获取 EEG 信号，并借助机器学习算法（即 k-近邻（k-NN）和神经网络（NN））将其情感分类为快乐、恐惧或悲伤。\n\
  \n### 方法论\n\n参与者来自不同的年龄段，他们被单独进行实验，通过向他们展示来自全球公认数据库日内瓦情感图片数据库（GAPED）中不同类别的图片。图片包括婴儿、快乐场景、虐待动物、人类关怀、蛇和蜘蛛的图像，每种图像都会在参与者中激发不同的情感。随后，针对所有参与者，获得与记录的\
  \ EEG 信号相对应的特征数据集，这些特征再被输入到 k-NN 和 NN 等机器学习模型中，模型将每个信号分类为三种情感之一：快乐、恐惧或悲伤。\n\n####\
  \ 数据集\n\n用于数据收集的两个设备是 NeuroSky MindWave Mobile 设备和 Raspberry Pi 3 板。NeuroSky MindWave\
  \ 设备可用于安全地记录 EEG 信号。该设备包含一个头戴式耳机、一个耳夹和一个传感器（电极）臂。头戴式耳机的接地电极位于耳夹上，而 EEG 电极位于传感器臂上，佩戴头戴式耳机后，传感器臂会搁在眼睛上方的额头上。该设备使用一节\
  \ AAA 电池，可续航八小时。\n\n该设备通过蓝牙连接到 Raspberry Pi 3 板，如图 9-1 所示。这是第三代 Raspberry Pi 型号，配备四核处理器、1GB\
  \ RAM 以及多个用于连接各种设备的端口。它还支持无线局域网和蓝牙，有助于连接诸如 MindWave Mobile 之类的无线设备。NeuroSky 设备供应商提供的软件安装在\
  \ Pi 板上，以从设备获取串行数据。\n\n![../images/496535_1_En_9_Chapter/496535_1_En_9_Fig1_HTML.jpg](img/496535_1_En_9_Fig1_HTML.jpg)\n\
  \n图 9-1\n\n通过蓝牙连接 MindWave Mobile 的 Raspberry Pi\n\n#### 通过蓝牙连接 Raspberry Pi 与 MindWave\
  \ Mobile\n\n将 MindWave Mobile 与 Raspberry Pi 连接有两种方法。第一种是将 MindWave Mobile 与 Raspberry\
  \ Pi 桌面配对。首先打开 Raspberry Pi，启动进入 Raspberry Pi 操作系统，然后打开 MindWave Mobile 的蓝牙。接着点击\
  \ Raspberry Pi 操作系统中的蓝牙符号，它会显示准备与 Raspberry Pi 配对的设备。在列表中可以选择 MindWave Mobile，并使用供应商规定的配对密码\
  \ `0000`。现在，MindWave Mobile 设备已与 Pi 配对，如图 9-2 所示。\n\n![../images/496535_1_En_9_Chapter/496535_1_En_9_Fig2a_HTML.jpg](img/496535_1_En_9_Fig2a_HTML.jpg)![../images/496535_1_En_9_Chapter/496535_1_En_9_Fig2b_HTML.jpg](img/496535_1_En_9_Fig2b_HTML.jpg)![../images/496535_1_En_9_Chapter/496535_1_En_9_Fig2c_HTML.jpg](img/496535_1_En_9_Fig2c_HTML.jpg)\n\
  \n图 9-2\n\nRaspberry 桌面与 MindWave Mobile 配对\n\n来自 MindWave Mobile 设备的信号可以通过此蓝牙连接提取。另一种连接\
  \ Raspberry 与 MindWave 的方法是使用 `Pypi 0.1.0`。相关步骤在 [`https://github.com/cttoronto/python-MindWave-mobile`](https://github.com/cttoronto/python-MindWave-mobile)\
  \ 中说明。此链接提供了脑电波信号中 alpha、beta 和 gamma 值的数据。然而，在本研究中，数据集是基于 EEG 信号开发的。\n\n#### 数据采集过程\n\
  \n参与者被安排坐在一个黑暗的小房间里，该房间也保持无线电静默，以防止受到声学和视觉干扰。实验前向其解释了条款和条件，并指示他们在感到任何不适时停止测试。还向参与者提供了一份手动评分表，以对他们在每张图片期间的情感进行评分。共有\
  \ 15 名参与者，记录了跨越三种不同情感的 15 个信号，因此总共得到 15 × 3 = 45 个 EEG 信号。这三种情感是快乐、恐惧和悲伤。\n\n最初，使用\
  \ NeuroSky 设备从用户处获取原始 EEG 信号。从大脑提取的原始 EEG 信号不能直接用于进一步处理。由于受试者在特定时间段内基于视觉输入接受情感刺激，由此产生的情感反应将是时变的。因此，识别大脑活动高峰期的持续时间，并仅在该持续时间内提取特征以增强分类结果至关重要。为实现这一点，记录在实验开始后恰好一分钟开始，这为使用与特定情感相对应的图片幻灯片来激发参与者情感提供了足够的时间。此外，为了避免处理大量数据，仅考虑包含每秒\
  \ 512 个样本的 15 秒数据，从而将数据大小减少到仅 15 × 512 = 7680 个样本，如图 9-3 所示。图 9-3 显示了整个记录持续时间的信号，其中大脑活动高峰期信号用红色标出，图\
  \ 9-4 则单独显示了这一部分。\n\n![../images/496535_1_En_9_Chapter/496535_1_En_9_Fig4_HTML.jpg](img/496535_1_En_9_Fig4_HTML.jpg)\n\
  \n图 9-4\n\n在大脑活动高峰期提取的 EEG 信号\n\n![../images/496535_1_En_9_Chapter/496535_1_En_9_Fig3_HTML.jpg](img/496535_1_En_9_Fig3_HTML.jpg)\n\
  \n图 9-3\n\n整个记录持续时间的样本 EEG 信号\n\n\n\n### 从脑电波信号中提取的特征\n\n脑电图（EEG）信号蕴含着丰富的脑功能信息。为了从\
  \ EEG 信号中获取有意义的信息，需要提取信号的不同属性。本文从 EEG 信号中提取了 9 种不同的时域属性，这些特征说明如下。\n\n潜伏期与幅值比（`LAR`）定义为最大信号时间与最大信号幅值的比值，见公式\
  \ 9-1。\n\n![$$ LAR=\\frac{t_{s\\max }}{S{}_{\\max }} $$](img/496535_1_En_9_Chapter_TeX_IEq1.png)\
  \ (9-1)\n\n其中，`t[smAx]`={`t`|`s(t)=s[mAx]`} 是出现最大信号值的时间，`s[mAx]=max{s(t)}` 是最大信号值。\n\
  \n峰峰值信号值（`PP`）定义为最大信号值与最小信号值之差，如公式 9-2 所示。\n\n`s[pp]` = `s[mAx]` − `s[min]` (9-2)\n\
  \n其中，`s[mAx]` 和 `s[min]` 分别是信号的最大值和最小值。\n\n峰峰值时间窗（`PPT`）定义为最大信号时间与最小信号时间之差，如公式 9-3\
  \ 所示。\n\n`t[pp]` = `t[s mAx]` − `t[s min]` (9-3)\n\n其中，`t[s mAx]` 和 `t[s min]` 分别是出现最大和最小信号值的时间。\n\
  \n峰峰值斜率（`PPS`）定义为峰峰值信号值（`PP`）与峰峰值时间值（`PPT`）的比值，如公式 9-4 所示。\n\n![$$ {s}_{pp s}=\\\
  frac{s_{pp}}{t_{pp}} $$](img/496535_1_En_9_Chapter_TeX_IEq2.png) (9-4)\n\n其中，`s[pp]`\
  \ 是峰峰值信号值，`t[pp]` 是峰峰值时间窗。\n\n信号功率（`P`）定义为在恒定幅值下无限时间存在的信号。信号功率如公式 9-5 所示。\n\n![$$\
  \ P=\\frac{1}{T}\\sum {\\left|s(t)\\right|}² $$](img/496535_1_En_9_Chapter_TeX_IEq3.png)\
  \ (9-5)\n\n信号均值（`μ`）定义为选定区域端点之间数据样本的平均值，并显示平均值。信号均值如公式 9-6 所示。\n\n![$$ \\mu =\\\
  frac{1}{N}\\sum \\limits_{i=1}^Ns\\left[i\\right] $$](images/496535_1_En_9_Chapter/496535_1_En_9_Chapter_TeX_IEq4.png)\
  \ (9-6)\n\n其中，`N` 是信号中的总样本数。\n\n峭度（`K`）是频率分布曲线峰值的陡峭程度，如公式 9-7 所示。\n\n![$$ K=\\frac{m_4}{m_2}\
  \ $$](img/496535_1_En_9_Chapter_TeX_IEq5.png) (9-7)\n\n其中，`m[4]` 和 `m[2]` 分别是信号的四阶矩和方差。\n\
  \n移动性（`M`）定义为信号一阶方差与信号方差的比值，如公式 9-8 所示。\n\n![$$ M=\\frac{Var{\\left(s(t)\\right)}^{\\\
  hbox{'}}}{Var\\left(s(t)\\right)} $$](img/496535_1_En_9_Chapter_TeX_IEq6.png) (9-8)\n\
  \n复杂度（`C`）定义为移动性的一阶导数除以移动性，如公式 9-9 所示。\n\n![$$ {C}_{\\varepsilon }=\\frac{M_{\\\
  varepsilon}^{\\hbox{'}}}{M_{\\varepsilon }} $$](img/496535_1_En_9_Chapter_TeX_IEq7.png)\
  \ (9-9)\n\n针对这九个时域特征的所有公式，其 Python 代码被编写成一个函数，该函数后续在主程序中被调用。这个函数接收大脑情绪活动峰值期间 15\
  \ 秒的 EEG 信号及对应的时间样本，具体实现如下：\n\n```\ndef eegfeat(ynew,tnew):\nfrom scipy.stats import\
  \ kurtosis\n# latency to amplitude ratio\nsmax=max(ynew)\nlocmax=np.where(ynew==smax)\n\
  tsmax=tnew[locmax]\nlar1=tsmax/smax\nlar=lar1[0]\n# peak to peak signal value\n\
  smin=min(ynew)\nlocmin=np.where(ynew==smax)\ntsmin=tnew[locmin]\nspp=smax-smin\n\
  # peak to peak time window.\ntpp1=tsmax+tsmin\ntpp=tpp1[0]\n# peak to peak slope\n\
  spps=spp/tpp\n# mean value of signal\nm=np.mean(ynew)\n# kurtosis\nk=kurtosis(ynew)\n\
  # mobility and complexity\nn=ynew.shape[0]\ndynew=np.diff(ynew)\nddynew=np.diff(dynew)\n\
  mx2=np.mean(np.power(ynew,2))\nmdx2=np.mean(np.power(dynew,2))\nmddx2=np.mean(np.power(ddynew,2))\n\
  mob=mdx2/mx2\ncomplexity=np.sqrt(mddx2/(mdx2-mob))\nmobility=np.sqrt(mob)\n# signal\
  \ power\ntt=np.power(ynew,2)\ns=0\nfor i in np.arange(0,tt.shape[0]):\ns=s+tt[i]\n\
  signalpower=s/ynew.shape[0]\nfeat = [lar, spp, tpp, spps, m, k, complexity, mobility,\
  \ signalpower]\nreturn feat\n```\n\n### 非结构化数据到结构化数据集\n\n现在我们有了从 EEG 信号中提取特征的函数，下一步是开发代码以获取结构化数据集。首先，使用`for`循环内的`pd.read_csv`函数，逐一加载所有\
  \ 15 名参与者对应三种不同情绪的 EEG 信号。在 EEG 信号作为数据框加载后，首先移除时间戳，然后将剩余列中的幅值转换为 NumPy 数组。每次迭代得到的数组被堆叠到一个新变量中，从而得到一个由\
  \ 45 列组成的最终数组，对应 45 个不同的 EEG 信号。然后，将该数组的每一列传递给之前创建的`eegfeat`函数，该函数为每一列（每个信号）提供九个特征，从而得到一个大小为\
  \ 9×45 的最终特征数组。该数据集如表 9-1 所示，并保存为 Excel 表格中的`emotion_data1.xls`。最后，使用`sklearns`模块中的`StandardScaler`和`fit`函数对特征进行缩放。这种缩放的工作原理是：首先计算所有\
  \ 45 个信号中每个特征的均值和标准差，然后从所有值中减去均值，并将此差值除以标准差。以下代码说明了特征提取过程：\n\n表 9-1\n\n人类情感数据集特征\n\
