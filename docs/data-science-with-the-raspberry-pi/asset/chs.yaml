  ### 将摄像头与树莓派连接


  摄像头是使用图像传感器记录图像的光学仪器。图像传感器检测并传递用于生成图像的信息。摄像头可以轻松地与树莓派连接，以获取图像或视频数据。将摄像头与树莓派连接有两种可用方案。


  **方法 1：** 第一种方法是使用 USB 端口将 USB 网络摄像头连接到树莓派。图 3-20 展示了一个 USB 网络摄像头。正确连接 USB 网络摄像头后，可以在
