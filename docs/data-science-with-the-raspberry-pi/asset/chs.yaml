  \n**图 9-5** 每种情感的平均值直方图\n\n### 使用学习模型对情感进行分类\n\n特征提取后的下一步是应用分类算法来识别与信号对应的情感。由于我们已经知道所使用的每个信号对应的情感，因此显然最好采用监督学习算法进行分类。在此之前，另一项重要任务是将我们的数据分为训练数据和测试数据。在每种情感的\
  \ 15 个信号中，我们考虑前 12 个信号对应的数据用于训练，其余 3 个信号对应的数据用于测试。同时，应创建与训练和测试数据相对应的标签。为此，我们将“快乐”情感标记为\
  \ 1，“恐惧”标记为 2，“悲伤”标记为 3。数据及其标签的分割如下代码所示：\n\n## 1. k-近邻算法 (k-NN)\n\n```python\nm1\
  \ = np.ones((15,), dtype=int)\nids = np.concatenate((m1, 2*m1, 3*m1), axis=0)\n\
  x_train = np.concatenate((features[:, 0:12], features[:, 15:27], features[:, 30:42]),\
  \ axis=1)\nx_test = np.concatenate((features[:, 12:15], features[:, 27:30], features[:,\
  \ 42:45]), axis=1)\ny_train = np.concatenate((ids[0:12], ids[15:27], ids[30:42]))\n\
  y_test = np.concatenate((ids[12:15], ids[27:30], ids[42:45]))\n```\n\n让我们首先使用 k-NN\
  \ 算法根据数据对情感进行分类。k-NN 是一种简单的监督机器学习算法，它根据相似度得分对现有数据进行分类，并将新数据分配到特定类别。k-NN 算法通过计算测试数据与训练数据之间的距离来工作。在计算出到每个训练数据的距离后，训练数据按距离值的升序排序。在此有序数据中，选择前\
  \ k 个数据，算法将把其中出现频率最高的标签分配给测试数据。**欧几里得距离**是 k-NN 算法最常用的距离度量，两个数据点 `x[i]` 和 `y[i]`\
  \ 之间的距离由以下表达式给出：\n\n![$$\\mathrm{欧几里得距离}=\\sqrt{\\sum_{\\mathrm{i}=1}^{\\mathrm{k}}{\\\
  left({x_i}-{y_i}\\right)}²}$$](img/496535_1_En_9_Chapter_TeX_IEq8.png)\n\nk-NN 分类是使用\
  \ Python 模块 `sklearn` 中的 `KNeighborsClassifier` 包实现的。使用此包的情感分类代码如下所示：\n\n```python\n\
  from sklearn.neighbors import KNeighborsClassifier\nfrom sklearn.metrics import\
  \ confusion_matrix, classification_report\n\nclassifier = KNeighborsClassifier(n_neighbors=16)\n\
  classifier.fit(x_train.T, y_train)\ny_pred = classifier.predict(x_test.T)\ncm =\
  \ confusion_matrix(y_test, y_pred)\nprint(\"混淆矩阵\\n\", cm)\nprint(\"准确率:\", (sum(np.diagonal(cm))/9)*100)\n\
  ```\n\n输出：\n\n```\n混淆矩阵\n[[1 0 2]\n [1 2 0]\n [2 0 1]]\n准确率: 44.44444444444444\n\
  ```\n\n前面代码中的参数 `n_neighbors` 表示 k 的值，我们将其选为 16。因此，在做出分类决策时会考虑 16 个邻居。首先，计算测试数据与所有其他训练数据之间的距离。然后，训练数据点按计算距离的升序排序。在排序后的数据中，考虑前\
  \ 16 个数据对应的标签，并将这 16 个数据中出现次数最多的标签分配给测试数据。对所有九个测试信号（每种情感三个）重复此过程，并使用混淆矩阵显示结果，通过表\
  \ 9-2 中的信息可以更好地理解该矩阵。\n\n**表 9-2** 使用 k-NN 进行情感分类的混淆矩阵\n\n|             | **快乐**\
  \ | **恐惧** | **悲伤** |\n|-------------|-----------|----------|---------|\n| **快乐**\
  \   | 1         | 0        | 2       |\n| **恐惧**    | 1         | 2        | 0 \
  \      |\n| **悲伤**     | 2         | 0        | 1       |\n\n在混淆矩阵中，行标题可以视为输入，列标题可以视为输出。例如，如果我们考虑第一行，与“快乐”情感对应的三个脑电图信号中只有一个被正确识别，其余两个信号被错误地分类为“悲伤”情感。类似地，在第二行中，与“恐惧”情感对应的两个信号被正确分类，在第三行中，与“悲伤”情感对应的一个信号被正确识别。为了更好地理解，混淆矩阵中的对角线元素表示正确分类的数据，其余元素表示错误分类。总共九个测试信号中有四个被正确分类，系统的准确率为\
  \ 44.44%。\n\n\n\n## 案例研究 2：图像数据的数据科学\n\n尽管当今的数字设备能够以比人类视觉更高的分辨率和更多细节来捕捉图像，但计算机只能将这些图像视为表示颜色的数值数组。*计算机视觉*指的是能让计算机理解数字图像和视频的技术。计算机视觉系统可以被视为人类视觉系统的复制，使计算机能够像人类一样处理图像和视频。计算机视觉系统用于许多应用，例如人脸识别、自动驾驶汽车、医疗保健、安防、增强现实等。\n\
  \n任何计算机视觉系统的第一步都是捕捉感兴趣的目标图像。这可以通过多种方式实现，例如相机、显微镜、X 光机、雷达等，具体取决于应用的性质。然而，捕捉到的原始图像不能直接使用，需要进一步处理。由于各种原因引入的噪声，原始图像可能达不到期望的质量。因此，在进一步处理之前，增强捕捉到的原始图像是至关重要的。为了让计算机能够从图像中学习，有时必须使用分析技术从图像中提取有用信息。在本节中，我们将了解如何使用连接到树莓派板的相机捕捉图像，并讨论准备原始图像以供进一步处理的步骤。\n\
  \n第一步是将 USB 网络摄像头连接到我们的树莓派板，如图 9-6 所示。\n\n![../images/496535_1_En_9_Chapter/496535_1_En_9_Fig6_HTML.jpg](img/496535_1_En_9_Fig6_HTML.jpg)\n\
  \n**图 9-6** 带网络摄像头的树莓派\n\n为此，我们需要在 Pi 配置设置中启用 SSH 和 Camera。安全壳协议（SSH）可以帮助通过本地网络远程连接到树莓派，而启用摄像头配置则有助于将网络摄像头与\
  \ Pi 板连接。这可以通过以下步骤完成：\n\n![../images/496535_1_En_9_Chapter/496535_1_En_9_Fig8_HTML.jpg](img/496535_1_En_9_Fig8_HTML.jpg)\n\
  \n**图 9-8** 用于启用摄像头和 SSH 的接口选项\n\n![../images/496535_1_En_9_Chapter/496535_1_En_9_Fig7_HTML.jpg](img/496535_1_En_9_Fig7_HTML.jpg)\n\
  \n**图 9-7** 软件配置工具窗口\n\n1. 在树莓派操作系统的终端窗口中输入命令 `sudo raspi-config`。这将打开软件配置工具窗口，如图\
  \ 9-7 所示。\n\n2. 进入接口选项，如图 9-8 所示，并启用 SSH 和摄像头。\n\n3. 重启树莓派设备。\n\n重启完成后，在终端窗口中运行\
  \ `lsusb` 命令，检查连接的 USB 网络摄像头是否已被列出。然后打开 Python IDE 并输入以下代码，使用网络摄像头捕捉并保存图像：\n\n```python\n\
  import cv2\nimport pandas as pd\nimport numpy as np\nimport matplotlib.pyplot as\
  \ plt\ncamera=cv2.VideoCapture( )\nret, img = camera.read( )\ncv2.imwrite('image.png',img)\n\
  img= cv2.cvtColor(img,cv2.COLOR_BGR2RGB)\nplt.imshow(img)\nplt.axis('off')\nplt.show(\
  \ )\n```\n\n如代码所示，`OpenCV` 包用于在 Python 中处理图像。为了捕捉图像，首先创建一个 `VideoCapture` 对象。使用\
  \ `read()` 函数通过创建的对象捕捉图像，然后将其存储在变量 `img` 中。捕捉到的图像可以使用 `imwrite()` 函数保存。`OpenCV`\
  \ 以 BGR 格式显示图像，而非标准的 RGB 格式。因此，在显示图像之前，需使用 `cv2.color` 函数将其转换为 RGB 图像。为了显示图像，可以使用\
  \ Matplotlib 包中的 `imshow()` 函数。由于使用该包创建的图默认带有坐标轴值，因此在显示图像时，必须移除坐标轴。这可以通过将 Matplotlib\
  \ 包中的 `axis` 函数设置为 `off` 状态来实现。图 9-9 显示了使用上述代码捕捉到的示例图像。\n\n![../images/496535_1_En_9_Chapter/496535_1_En_9_Fig9_HTML.jpg](img/496535_1_En_9_Fig9_HTML.jpg)\n\
  \n**图 9-9** 使用连接到树莓派板的网络摄像头捕捉的图像\n\n\n\n### 探索性图像数据分析\n\n图像显示一些静止物体放置在白纸上。为了理解获取的图像数据，最好打印出图像的数据类型和尺寸，如下所示：\n\
  \n```\nprint(type(img))\nprint(img.shape)\n输出：\n\n(719, 1206, 3)\n```\n\n捕获的图像是一个\
  \ NumPy 数组。使用网络摄像头捕获的图像通常为 RGB 格式，其中包含三个像素平面：红色、蓝色和绿色。换句话说，图像中的每个像素都由三个值组成，这些值分别代表红色、蓝色和绿色的比例，从而在可见光谱中产生各种颜色。打印出的图像形状中的数字\
  \ 3 表示三个平面；即图像由对应 RGB 的三个平面组成，每个平面的尺寸均为 719 × 1206 像素。在许多应用中，图像中的边缘、形状等其他细节比颜色信息更重要。例如，如果我们的目标是识别给定图像中的静止物体，物体的形状将比颜色更重要。在这种情况下，可以使用以下代码将三平面\
  \ RGB 图像转换为单平面灰度图像：\n\n```\ngray = cv2.cvtColor(img, cv2.COLOR_BGR2GRAY)\nplt.imshow(gray,cmap=\
  \ 'gray')\nplt.axis('off')\nplt.show( )\nprint(gray.shape)\n输出：\n(719, 1206)\n```\n\
  \n图 9-10 显示了一个单平面灰度图像，其中的颜色已被移除。这可以从上一段代码中打印出的图像尺寸看出。现在灰度图像的尺寸仅为单平面 719×1206。在某些情况下，由于图像传感器的缺陷，捕获的图像可能包含一些缺失值。这些值也可能反映在灰度图像中，可以通过将图像转换为数据框（dataframe）来检测和处理这些值，如下所示：\n\
  \n```\ndf=pd.DataFrame(gray)\ns=df.isnull( ).sum( ).sum( )\nprint(s)\nif s!=0:\n\
  df=df.ffill(axis=0)\ngray=df.to_numpy( )\n输出：\n\n```\n\n`isnull( )` 函数可用于检测图像行和列中是否存在缺失值。`sum(\
  \ )` 函数可用于统计数据框行和列中缺失值的数量。如果 `sum( )` 函数的结果不等于零，则图像包含缺失值，可以使用 `ffill( )` 函数进行处理，该函数用上方的像素值替换每个缺失值。这种前向填充或后向填充的方法不会在图像中引起任何可见的变化，因为除了图像边缘外，图像中的像素值通常非常接近。从上一段代码可以看出，缺失值的数量为\
  \ 0；即图像中没有缺失值。一旦对图像进行了缺失值检查和处理后，可以使用 Pandas 中的 `to_numpy( )` 将数据框转换回 NumPy 数组。由于像素值非常接近，图像中许多区域可能重复出现相同的像素值。因此，在图像数据的情况下，识别重复值是不相关的。\n\
  \n![../images/496535_1_En_9_Chapter/496535_1_En_9_Fig10_HTML.jpg](img/496535_1_En_9_Fig10_HTML.jpg)\n\
  \n图 9-10\n\n转换为灰度后的图像\n\n使用 USB 网络摄像头或 Pi 摄像头在自然光下拍摄，通常会导致图像质量不佳。因此，处理缺失值后的下一步是绘制图像的直方图。直方图可以了解图像的对比度，如图\
  \ 9-11 所示。具体实现如下代码所示：\n\n![../images/496535_1_En_9_Chapter/496535_1_En_9_Fig11_HTML.jpg](img/496535_1_En_9_Fig11_HTML.jpg)\n\
  \n图 9-11\n\n灰度图像的直方图\n\n```\nplt.hist(gray.ravel( ),bins=256)\nplt.xlabel('bins')\n\
  plt.ylabel('No of pixels')\nplt.show( )\n```\n\n灰度图像中的像素值范围从 0（代表黑色）到 255（代表白色）。上一段代码中的\
  \ `hist( )` 函数绘制了一个条形图，显示该范围内每个像素值的计数。该图可以让我们了解所处理图像的对比度。图 9-7 显示了我们的灰度图像的直方图。可以看出，大多数像素集中在\
  \ (120,160) 范围内。如果像素的分布集中在较低的分组（bins）中，则图像对比度较低，反之亦然。因此，根据此图，可以决定是否需要对图像进行对比度调整。\n\
  \n导致图像质量不佳的另一个原因可能是各种因素引入的噪声。在观察捕获的图像时，这些噪声可以通过颗粒的形式被视觉感知。在这种情况下，在进行进一步处理之前，必须先消除这些噪声。噪声有多种不同类型，例如高斯噪声、椒盐噪声等，并且有许多不同类型的滤波器可用于去除这些噪声，但这超出了本书的范围。让我们只看一种在图像处理中常用的特定滤波器，称为均值滤波器。它是一种低通滤波器，可用于去除数字图像中的高频内容。该滤波的工作原理是，将一个特定尺寸（例如\
  \ 3×3）的核在图像的维度上滑动，计算核区域内所有像素的平均值，并用该平均值替换中心元素。整体效果是产生模糊效果。以下代码说明了如何将均值滤波器应用于我们的图像。图\
  \ 9-12 显示了滤波后得到的图像。\n\n![../images/496535_1_En_9_Chapter/496535_1_En_9_Fig12_HTML.jpg](img/496535_1_En_9_Fig12_HTML.jpg)\n\
  \n图 9-12\n\n通过均值滤波得到的图像\n\n```\nblur=cv2.blur(gray,(3,3))\nplt.imshow(blur)\nplt.axis('off')\n\
  plt.show( )\n```\n\n### 为模型准备图像数据\n\n预处理步骤完成后，下一步是分析图像或为学习模型准备图像。这可以通过两种方式完成。第一种方法是提取代表有用信息的特征，并将其用于建模。提取的特征可能是另一个变换后的图像，也可能是从原始图像中提取的属性。可以从图像中提取无数种特征，而特定特征的选择取决于我们应用的性质。讨论这些众多的特征超出了本书的范围。相反，我们将讨论一个特定的特征：边缘检测。\n\
  \n边缘代表图像中的高频内容。Canny 边缘检测是一种算法，它采用多阶段方法来检测图像中广泛的边缘。可以通过使用 OpenCV 中的 `Canny( )` 函数在\
  \ Python 中实现，如下列代码所示。图 9-13 显示了边缘检测过程后的图像。\n\n![../images/496535_1_En_9_Chapter/496535_1_En_9_Fig13_HTML.jpg](img/496535_1_En_9_Fig13_HTML.jpg)\n\
  \n图 9-13\n\n边缘检测后的图像\n\n```\nedge_img=cv2.Canny(gray,100,200)\nplt.imshow(edge_img,cmap='gray')\n\
  plt.axis('off')\nplt.show( )\n```\n\n第二种方法是直接将图像输入到深度学习模型中。深度学习是一种流行的机器学习方法，越来越多地被用于分析和学习图像。这种方法可以直接从图像中学习有用信息，不需要任何特征提取。可以将图像调整为不同的尺寸，然后输入到学习模型中，或者将图像数组转换为一个一维向量，然后输入到模型中。\n\
  \n\n\n### 使用深度神经网络进行目标检测\n\n目标检测是一种从图像或视频中识别现实世界物体（如椅子、书籍、汽车、电视、花卉、动物、人类等）的技术。该技术能够检测、识别和辨认图像中的多个物体，以便更好地理解或从现实环境中提取信息。目标检测在计算机视觉应用中扮演着重要角色，例如自动驾驶汽车、监控系统、工业自动化以及为视障人士设计的辅助设备。Python\
  \ 环境中提供了多种用于目标检测的模块，具体如下：\n\n- 基于特征的目标检测\n- Viola Jones 目标检测\n- 基于 HOG 特征的 SVM 分类\n\
  - 深度学习目标检测\n- 单次多框检测器（SSD）目标检测\n- YOLO (You Only Look Once) 模型目标检测\n- 基于区域的卷积神经网络（R-CNN）\n\
  - Faster R-CNN\n\n在此，我们使用了单次多框检测器来识别图像或视频中的多个物体。单次多框检测器由 C. Szegedy 等人于 2016 年 11\
  \ 月提出。SSD 可以解释如下：\n\n- ***单次***：在此阶段，借助单个前向传播网络完成图像的定位和分类。\n- ***多框***：表示在图像中为多个物体绘制边界框。\n\
  - ***检测器***：这是一种目标检测器，用于对图像或视频中的物体进行分类。\n\n图 9-14 展示了单次多框检测器的架构。\n\n在该架构中，输入图像的尺寸被视为\
  \ `300×300×3`。VGG-16 架构被用作基础网络，并且去掉了全连接网络。VGG-16 架构非常流行，并借助迁移学习技术具备强大的分类能力。此处，在早期阶段使用了\
  \ VGG-16 架构的部分卷积层。关于 SSD 的详细解释，请访问 [`https://towardsdatascience.com/understanding-ssd-multibox-real-time-object-detection-in-deep-learning-495ef744fab`](https://towardsdatascience.com/understanding-ssd-multibox-real-time-object-detection-in-deep-learning-495ef744fab)。\n\
  \n![../images/496535_1_En_9_Chapter/496535_1_En_9_Fig14_HTML.jpg](img/496535_1_En_9_Fig14_HTML.jpg)\n\
  \n**图 9-14** — 单次多框检测器的架构（[ *https://towardsdatascience.com/understanding-ssd-multibox-real-time-object-detection-in-deep-learning-495ef744fab*](https://towardsdatascience.com/understanding-ssd-multibox-real-time-object-detection-in-deep-learning-495ef744fab)）\n\
  \n多框架构是一种识别边界框坐标的技术，它基于两个损失函数：置信度损失和位置损失。置信度损失使用分类熵来衡量边界框识别物体的置信水平。位置损失则衡量边界框与图像中物体的偏离距离。测量距离时使用\
  \ L2 范数。多框损失可以通过以下公式计算：\n\n`多框损失 = 置信度损失 + α * 位置损失`\n\n这提供了边界框与预测物体之间的距离信息。以下代码实现了\
  \ SSD 配置文件，该文件带有用于检测 COCO 数据集类别中物体的 DNN 权重。用于检测 COCO 类别中物体的 SSD 配置文件（即 `ssd_mobilenet_v3_large_coco_2020_01_14.pbtxt`）和\
  \ DNN 权重（即 `frozen_inference_graph.pb`）可以从 [`https://github.com/AlekhyaBhupati/Object_Detection_Using_openCV`](https://github.com/AlekhyaBhupati/Object_Detection_Using_openCV)\
  \ 下载。\n\n在此上下文中，COCO 类别指的是常见物体，COCO 类别的数据集可在其官方网站获取：[`https://cocodataset.org/#home`](https://cocodataset.org/%2523home)。COCO\
  \ 包含了诸如椅子、汽车、动物、人类等常见物体的分割图像，这些分割图像可用于训练深度神经网络。请参见图 9-15 和图 9-16。\n\n![../images/496535_1_En_9_Chapter/496535_1_En_9_Fig15_HTML.jpg](img/496535_1_En_9_Fig15_HTML.jpg)\n\
  \n**图 9-15** — 用于物体识别的输入图像\n\n代码如下：\n\n![../images/496535_1_En_9_Chapter/496535_1_En_9_Fig16_HTML.jpg](img/496535_1_En_9_Fig16_HTML.jpg)\n\
  \n**图 9-16** — 已识别物体的输出图像\n\n```\nimport cv2\nthres = 0.5# Threshold to detect object\n\
  cap = cv2.VideoCapture(0)\ncap.set(3,1280)\ncap.set(4,720)\ncap.set(10,70)\nclassNames=\
  \ []\nclassFile = 'coco.names'\nwith open(classFile,'rt') as f:\nclassNames = f.read().rstrip('\\\
  n').split('\\n')\nconfigPath = 'ssd_mobilenet_v3_large_coco_2020_01_14.pbtxt'\n\
  weightsPath = 'frozen_inference_graph.pb'\nnet = cv2.dnn_DetectionModel(weightsPath,configPath)\n\
  net.setInputSize(320,320)\nnet.setInputScale(1.0/ 127.5)\nnet.setInputMean((127.5,\
  \ 127.5, 127.5))\nnet.setInputSwapRB(True)\nprint('1st done')\nwhile True:\nsuccess,\
  \ img = cap.read()\nclassIds, confs, bbox = net.detect(img, confThreshold=thres)\n\
  print(classIds, bbox)\nif len(classIds) != 0:\nfor classId, confidence,box in zip(classIds.flatten(),confs.flatten(),bbox):\n\
  cv2.rectangle(img,box,color=(0,255,0),thickness=2)\ncv2.putText(img,classNames[classId-1].upper(),(box[0]+10,box[1]+30),\n\
  cv2.FONT_HERSHEY_COMPLEX,1,(0,255,0),2)\ncv2.putText(img,str(round(confidence*100,2)),(box[0]+200,box[1]+30),\n\
  cv2.FONT_HERSHEY_COMPLEX,1,(0,255,0),2)\ncv2.imshow(\"Output\",img)\n# Hit 'q' on\
  \ the keyboard to quit!\n```\n\n当代码执行时，使用 `OpenCV capture` 函数捕获来自网络摄像头的视频帧。然后，将每一帧输入到已训练好的\
  \ SSD-DNN 模型中进行物体识别。SSD-DNN 模型基于 COCO 类别对物体进行分类，并在检测到的图像上创建带有 COCO 类别标签和准确率的边界框。图\
  \ 9-15 中的视频文件被作为输入提供给上述程序。该图中包含了椅子、书籍和鼠标等物体。从图 9-16 中可以清晰地得出结论：基于 SSD 的 DNN 模型识别出了这三个物体，其中椅子的准确率为\
  \ 72.53%，书籍为 67.41%，鼠标为 81.52%。\n\n\n\n## 案例研究 3：工业 4.0\n\n工业 4.0 代表了制造业的第四次革命。第一次工业革命（即工业\
  \ 1.0）是利用蒸汽动力创造机械能，以提高装配线的生产力。第二次革命（即工业 2.0）将电力引入装配线以提升生产力。第三次革命（即工业 3.0）将计算机引入以自动化工业流程。目前，工业\
  \ 4.0 正在采用计算机、数据分析和机器学习工具，借助传感器采集的数据来进行智能决策或监控流程。物联网（IoT）近年来在数据采集和传输以实现远程访问方面发挥了重要作用。\n\
  \n图 9-17 描述了工业 4.0 的基本流程。首先，借助传感器采集物理系统的数据，并将其制成数字记录。然后，将物理系统的数字记录发送到服务器系统进行实时数据处理和分析。在此阶段应用数据科学技术对数据进行预处理和准备。接着，可以使用现代学习算法，通过使用已学习的模型预测输出来进行智能决策。此外，还使用可视化技术来监控物理系统的实时数据。在此，`Raspberry\
  \ Pi` 可以作为服务器或本地化云来用于实时数据处理。\n\n![../images/496535_1_En_9_Chapter/496535_1_En_9_Fig17_HTML.jpg](img/496535_1_En_9_Fig17_HTML.jpg)\n\
  \n**图 9-17** 工业 4.0 框图\n\n### 树莓派作为工业 4.0 的本地化云\n\n要实现工业 4.0，需要一台高性能计算机来连接设备、采集数据和处理数据。采集到的数据可以存储在云服务中以便进一步处理。然而，如今云服务的订阅费用较高，仅适用于高利润公司。小规模公司希望实现本地化云来进行实时处理。此外，本地化云方法可以提供数据安全性，因为其位于本地，攻击者无法通过远程访问入侵。\n\
  \n如第 3 章所述，`Raspberry Pi` 可以充当本地化云，连接传感器、物联网设备、其他附近的计算机和手机，如图 9-18 所示。高性能计算机也可以充当本地化云，但它们占用空间较大。此外，在偏远地区部署计算机也很困难。`Raspberry\
  \ Pi` 具有占用空间小且可在偏远地区部署的优势。基于此，`Raspberry Pi` 被用作工业 4.0 框架的本地化云，如图 9-19 所示。\n\n![../images/496535_1_En_9_Chapter/496535_1_En_9_Fig19_HTML.jpg](img/496535_1_En_9_Fig19_HTML.jpg)\n\
  \n**图 9-19** 采用树莓派的工业 4.0 框架\n\n![../images/496535_1_En_9_Chapter/496535_1_En_9_Fig18_HTML.jpg](img/496535_1_En_9_Fig18_HTML.jpg)\n\
  \n**图 9-18** 树莓派作为本地化云\n\n在使用 `Raspberry Pi` 的工业 4.0 框架中，有三个可用模块：从传感器采集数据、使用摄像头采集信息、以及将\
  \ `Raspberry Pi` 与其他计算机连接。\n\n### 从传感器采集数据\n\n我们将使用温湿度传感器来测量温度和湿度。将 `DHT 11/22`\
  \ 传感器模块连接到 `Raspberry Pi`，如第 3 章所示。以下代码在 100 秒内采集温度和湿度百分比，并将采集到的数据存储为 CSV 文件。\n\n\
  ```\nimport Adafruit_DHT\nimport time\nfrom datetime import datetime\nDHT_SENSOR\
  \ = Adafruit_DHT.DHT11\nDHT_PIN = 17\ndata = []\nwhile _ in range(100):\nhumidity,\
  \ temperature = Adafruit_DHT.read(DHT_SENSOR, DHT_PIN)\nif humidity is not None\
  \ and temperature is not None:\nnow = datetime.now()\ndt_string = now.strftime(\"\
  %d/%m/%Y %H:%M:%S\")\ndata.append(dt_string,humidity,temperature)\ntime.sleep(60*5)\n\
  df = pd.DataFrame(data)\ndf.to_csv('data.csv',index=None,header=None)\n```\n\nCSV\
  \ 文件的内容将类似于表 9-3。\n\n**表 9-3** 来自温湿度传感器的带时间戳数据\n\n| 17/05/2020 01:05:14 | 26.24\
  \ | 69.91 |\n|----------------------|-------|-------|\n| 17/05/2020 01:10:14 | 26.24\
  \ | 70.65 |\n| 17/05/2020 01:15:14 | 26.22 | 68.87 |\n| 17/05/2020 01:20:14 | 26.15\
  \ | 70.11 |\n| 17/05/2020 01:25:14 | 26.11 | 69.02 |\n\n\n\n#### 在树莓派中准备行业数据集\n\n\
  我们将使用一个包含两列数据的数据集，这些数据来自连接到树莓派主板的温度与湿度传感器；数据每 5 分钟记录一次，持续 28 小时。因此，该数据集本质上是`.csv`格式的时间序列数据。在进行预处理之前，最好先了解数据集的概况。因此，第一步将是读取文件并打印其内容，如下所示：\n\
  \n```\nimport pandas as pd\nimport matplotlib.pyplot as plt\nimport numpy as np\n\
  dataset=pd.read_csv('datasets_384649_744229_log_temp.csv')\nprint(dataset.head())\n\
  Output\nDate      Time    Temperature    Humidity\n0  3/14/19  19:33:07        \
  \ T=22.0      H=20.0\n1  3/14/19  19:38:10         T=22.0      H=20.0\n2  3/14/19\
  \  19:43:11         T=22.0      H=26.0\n3  3/14/19  19:48:14         T=22.0    \
  \  H=26.0\n4  3/14/19  19:53:15         T=22.0      H=20.0\n```\n\n从打印出的数据集前五个条目可以清楚地看出，在开始分析之前，数据需要清洗。前两列包含条目的日期和时间，对于分析来说并不需要，因此可以删除这些列。第三和第四列包含实际数据，是字符串和数字的混合。我们需要过滤掉这些不合适的值，并将数据集从`string`类型转换为`float`类型。这两个操作可以按如下方式执行：\n\
  \n```\n# 删除日期和时间列\ndrop=['Date','Time']\ndataset.drop(drop,inplace=True,axis=1)\n\
  # 移除 'T=' 和 'H=' 字符串\ndataset['Temperature']=dataset['Temperature'].str.replace('T=','')\n\
  dataset['Humidity']=dataset['Humidity'].str.replace('H=','')\ndataset=dataset.astype(float)\n\
  print(dataset.head())\nOutput:\nTemperature    Humidity\n0          22.0       \
  \ 20.0\n1          22.0        20.0\n2          22.0        26.0\n3          22.0\
  \        26.0\n4          22.0        20.0\n```\n\n下一步是检查两列中是否存在缺失数据。如前所述，缺失数据通常以\
  \ NaN 的形式存在，可以使用 Pandas 包中的`isna()`函数来检测此类数据的存在。NumPy 包中的`where()`函数可以与`isna()`函数一起使用，以获取各自列中缺失值的位置，如下所示：\n\
  \n```\nprint(np.where(dataset['Temperature'].isna()))\nprint(np.where(dataset['Humidity'].isna()))\n\
  Outpu:\n(array([206, 207, 214, 215, 216, 217, 218, 219, 220, 221, 222, 223, 224,\n\
  225, 226, 227], dtype=int64),)\n(array([206, 207, 214, 215, 216, 217, 218, 219,\
  \ 220, 221, 222, 223, 224,\n225, 226, 227], dtype=int64),)\n```\n\n从前面的结果可以看出，温度列和湿度列都存在缺失数据，并且两列中缺失数据的位置相同。下一步将是处理缺失值。处理缺失值的方法可能因数据的性质而异。在我们的数据集中，由于我们每五分钟测量一次温度和湿度值，可以合理地假设在缺失值范围内不会有太大变化。因此，可以使用`ffill`方法填充缺失值，`ffill`代表“向前填充”，即用前一行的值替换缺失值。这可以使用\
  \ Pandas 包中的`fillna()`函数来实现。在实现此填充过程后，可以使用`isna().any()`函数进行验证，如果任何列中都没有缺失值，该函数将返回\
  \ false，如下所示：\n\n```\ndataset['Temperature']=dataset['Temperature'].fillna(axis=0,method='ffill')\n\
  dataset['Humidity']=dataset['Humidity'].fillna(axis=0,method='ffill')\nprint(dataset.isna().any())\n\
  Output:\nTemperature    False\nHumidity       False\ndtype: bool\n```\n\n既然缺失值已处理完毕，下一步就是寻找数据中的异常值。为此，我们使用之前讨论过的\
  \ Z 分数。在计算 Z 分数之前，数据集中的条目应转换为整数。以下代码说明了使用 Z 分数检测和移除异常值的方法：\n\n```\nfrom scipy import\
  \ stats\nz=np.abs(stats.zscore(dataset))\ndf1=dataset[z>3]\nprint(df1)\ndataset=dataset[(z<3).all(axis=1)]\n\
  Output:\nTemperature  Humidity\n47             9.0     140.0\n157           37.0\
  \      12.0\n```\n\n从之前的图示可以看出，存在两个异常值，分别对应行索引 47 和 157。我们不会移除 Z 分数大于 3 的数据点对应的异常值，而是保留所有\
  \ Z 分数小于 3 的数据点。\n\n#### 实时传感器数据的探索性数据分析\n\n我们讨论了一些数据科学家常用的基础图表，并用一些现成的数据集演示了每种图表。在本节中，我们将使用实时传感器数据演示一些图表。我们使用与第\
  \ 5 章中相同的温度和湿度传感器数据来讨论数据准备的概念。由于我们已经在那一章中完成了所有数据清洗步骤，这里提供相同的代码用于在绘制图表之前准备数据：\n\n\
  ```\nimport pandas as pd\nimport matplotlib.pyplot as plt\nimport numpy as np\n\
  from scipy import stats\ndataset=pd.read_csv('datasets_384649_744229_log_temp.csv')\n\
  # 删除日期和时间列\ndrop=['Date','Time']\ndataset.drop(drop,inplace=True,axis=1)\n# 移除字符串头\
  \ 'T=' 和 'H='\ndataset['Temperature']=dataset['Temperature'].str.replace('T=','')\n\
  dataset['Humidity']=dataset['Humidity'].str.replace('H=','')\ndataset=dataset.astype(float)\n\
  print('移除不合适数据后\\n',dataset.head())\n# 检测缺失数据的位置（如果有）\nprint('温度中的缺失值\\n',np.where(dataset['Temperature'].isna()))\n\
  print('湿度中的缺失值\\n',np.where(dataset['Humidity'].isna()))\n# 使用向前填充法填充缺失值\ndataset['Temperature']=dataset['Temperature'].fillna(axis=0,method='ffill')\n\
  dataset['Humidity']=dataset['Humidity'].fillna(axis=0,method='ffill')\n# 使用 Z 分数检测并移除异常值\n\
  z=np.abs(stats.zscore(dataset))\ndf1=dataset[z>3]\ndataset=dataset[(z<3).all(axis=1)]\n\
  print(dataset.head())\nOutput:\n移除不合适数据后\nTemperature     Humidity\n0          \
  \             22.0         20.0\n1                       22.0         20.0\n2  \
  \                     22.0         26.0\n3                       22.0         26.0\n\
  4                       22.0         20.0\n温度中的缺失值\n(array([206, 207, 214, 215,\
  \ 216, 217, 218, 219, 220, 221, 222, 223, 224,\n225, 226, 227], dtype=int64),)\n\
  湿度中的缺失值\n(array([206, 207, 214, 215, 216, 217, 218, 219, 220, 221, 222, 223, 224,\n\
  225, 226, 227], dtype=int64),)\nTemperature     Humidity\n0                   22.0\
  \         20.0\n1                   22.0         20.0\n2                   22.0\
  \         26.0\n3                   22.0         26.0\n4                   22.0\
  \         20.0\n```\n\n\n\n#### 可视化实时传感器数据\n\n数据清洗过程完成后，下一步是绘制数据图表。使用的图表类型取决于数据的性质以及分析流程的要求。由于我们在\
  \ 28 小时内测量了温度和湿度，因此最理想的方式是按时间绘制它们。但为了更好地理解这两个参数的变化，我们每四小时取一次平均值，并用条形图绘制这些平均值。如果我们想了解整个时间段内温度和湿度的分布情况而非其变化趋势，那么可以将温度和湿度的范围划分为若干区间，并统计每个区间内的数值计数，然后用这些数据制作饼图。这三种图表说明如下：\n\
  \n```\n# Taking average over every 4 hours\na = dataset.shape[0]\nb = []\nc = []\n\
  for i in np.arange(0, a-(a%12), 48):\n    b.append(np.mean(dataset.Temperature[i:i+47]))\n\
  \    c.append(np.mean(dataset.Humidity[i:i+47]))\n# Temperature vs Time over 28\
  \ hours\nplt.subplot(221)\nplt.plot(np.linspace(0,28,a), dataset.Temperature)\n\
  plt.title('Temperature vs Time')\n# Humidity vs Time over 28 hours\nplt.subplot(222)\n\
  plt.plot(np.linspace(0,28,a), dataset.Humidity)\nplt.title('Humidity vs Time')\n\
  # Bar plot of average temperature over every 4 hours during the 28 hours\nplt.subplot(223)\n\
  x = ['1','2','3','4','5','6','7']\nplt.bar(x, b)\nplt.title('Average temperature\
  \ over every 4 hours')\n# Bar plot of average humidity over every 4 hours during\
  \ the 28 hours\nplt.subplot(224)\nplt.bar(x, c)\nplt.title('Average humidity over\
  \ every 4 hours')\n# Pie chart for temperature distribution\nd = pd.DataFrame(dataset.Temperature.value_counts(bins=4))\n\
  plt.subplot(235)\nplt.pie(d.Temperature, labels=d.index)\nplt.title('Temperature\
  \ distribution')\n# Pie chart for humidity distribution\ne = pd.DataFrame(dataset.Humidity.value_counts(bins=4))\n\
  plt.subplot(236)\nplt.pie(e.Humidity, labels=e.index)\nplt.title('Humidity distribution')\n\
  plt.show()\n```\n\n在图 9-20 中，前两个图展示了温度和湿度的分布，其中每个数据样本都沿着时间轴（以小时为单位）绘制。我们可以看出，温度和湿度如预期般呈反比关系。但随时间变化的趋势通过每四小时取一次样本平均值并以条形图绘制（如第三和第四张图所示）能更好地体现。第五和第六张图展示了饼图，侧重于温度和湿度的整体分布情况而非随时间的变化。由于传感器数据仅记录了\
  \ 28 小时，数据不会有太大变化，因此仅使用四个区间来绘制分布图。从这两张图中可以看出，在这 28 小时内，温度大多处于 15 至 20 摄氏度范围内，而湿度则大多处于\
  \ 19 至 25 范围内。\n\n![../images/496535_1_En_9_Chapter/496535_1_En_9_Fig20_HTML.jpg](img/496535_1_En_9_Fig20_HTML.jpg)\n\
  \n图 9-20\n\n温度和湿度的变化与分布\n\n### 使用视觉相机读取条形码生成报告\n\n如今，许多行业借助条形码和二维码对其产品进行文档化记录。产品信息可以印在产品上，便于识别和归档。市场上有专用的条码/二维码扫描器，但扫描产品上的条码/二维码需要人工操作。这可能会降低装配线的生产效率。如今，视觉系统被用来自动扫描产品上的条码/二维码。这将通过消除人工操作和减少装配线上的时间来提升生产效率。因此，可以将摄像头与树莓派连接，用于扫描装配线上产品的条码/二维码。\n\
  \n我们在本章的案例研究 2 中已经讨论过如何在树莓派上启用摄像头（关于将网络摄像头与树莓派连接的步骤，请参考案例研究 2）。以下代码[30]持续采集装配线上产品的图像，识别图像中的条码/二维码，解码条码/二维码中的信息，并将解码后的信息显示在图像屏幕上。\n\
  \n```\n# import the required packages\nfrom imutils.video import VideoStream\nfrom\
  \ pyzbar import pyzbar\nimport argparse\nimport datetime\nimport imutils\nimport\
  \ time\nimport cv2\n# construct the argument parser and parse the arguments\nap\
  \ = argparse.ArgumentParser()\nap.add_argument(\"-o\", \"--output\", type=str, default=\"\
  barcodes.csv\",\nhelp=\"path to output CSV file containing barcodes\")\nargs = vars(ap.parse_args())\n\
  # initialize the video stream and allow the camera sensor to warm up\nprint(\"[INFO]\
  \ starting video stream...\")\nvs = VideoStream(src=0).start()\n#vs = VideoStream(usePiCamera=True).start()\n\
  time.sleep(2.0)\n# open the output CSV file for writing and initialize the set of\n\
  # barcodes found thus far\ncsv = open(args[\"output\"], \"w\")\nfound = set()\n\
  # loop over the frames from the video stream\nwhile True:\n    # grab the frame\
  \ from the threaded video stream and resize it to\n    # have a maximum width of\
  \ 400 pixels\n    frame = vs.read()\n    frame = imutils.resize(frame, width=400)\n\
  \    # find the barcodes in the frame and decode each of the barcodes\n    barcodes\
  \ = pyzbar.decode(frame)\n    # loop over the detected barcodes\n    for barcode\
  \ in barcodes:\n        # extract the bounding box location of the barcode and draw\n\
  \        # the bounding box surrounding the barcode on the image\n        (x, y,\
  \ w, h) = barcode.rect\n        cv2.rectangle(frame, (x, y), (x + w, y + h), (0,\
  \ 0, 255), 2)\n        # the barcode data is a bytes object so if we want to draw\
  \ it\n        # on our output image we need to convert it to a string first\n  \
  \      barcodeData = barcode.data.decode(\"utf-8\")\n        barcodeType = barcode.type\n\
  \        # draw the barcode data and barcode type on the image\n        text = \"\
  {} ({})\".format(barcodeData, barcodeType)\n        cv2.putText(frame, text, (x,\
  \ y - 10),\n                    cv2.FONT_HERSHEY_SIMPLEX, 0.5, (0, 0, 255), 2)\n\
  \        # if the barcode text is currently not in our CSV file, write\n       \
  \ # the timestamp + barcode to disk and update the set\n        if barcodeData not\
  \ in found:\n            csv.write(\"{},{}\\n\".format(datetime.datetime.now(),\n\
  \                                       barcodeData))\n            csv.flush()\n\
  \            found.add(barcodeData)\n    # show the output frame\n    cv2.imshow(\"\
  Barcode Scanner\", frame)\n    key = cv2.waitKey(1) & 0xFF\n    # if the `q` key\
  \ was pressed, break from the loop\n    if key == ord(\"q\"):\n        break\n#\
  \ close the output CSV file do a bit of cleanup\nprint(\"[INFO] cleaning up...\"\
  )\ncsv.close()\ncv2.destroyAllWindows()\nvs.stop()\n```\n\n上述代码使用网络摄像头采集图像，并通过 `while`\
  \ 循环捕捉每一帧图像。接着，借助一个无限 `while` 循环持续显示这些帧。使用 `'q'` 键来中断这个无限 `while` 循环。然后，可以通过 `cap.release`\
  \ 释放图像采集功能。在程序中，每一帧采集到的图像都被送入 `pyzbar` 模块，以识别图像中的条码/二维码，并解码条码/二维码中的数据[30]。解码后的信息显示在对应的帧中。图\
  \ 9-21 展示了该程序的输出。\n\n![../images/496535_1_En_9_Chapter/496535_1_En_9_Fig21_HTML.jpg](img/496535_1_En_9_Fig21_HTML.jpg)\n\
  \n图 9-21\n\n条形码与二维码扫描器输出结果\n\n\n\n### 将文件或数据从树莓派传输到计算机\n\n在某些场景下，需要将树莓派中的数据分享给附近的计算机。此外，如果树莓派位于其他地方，则需要通过远程访问来连接。传输数据的方式有很多种。其中最简单且高效的方法之一是使用\
  \ `VNC` 查看器来共享数据和进行远程访问。`VNC` 是一种图形化桌面共享应用，允许用户通过远程访问从一台系统（即树莓派）控制另一台系统。本节将讨论使用\
  \ `VNC` 查看器共享文件以及通过 `VNC` 从远程桌面计算机控制树莓派的安装步骤和使用方法。\n\n要在树莓派中安装 `VNC`，需在树莓派的命令窗口中使用以下代码，如图\
  \ 9-22 所示：\n\n![../images/496535_1_En_9_Chapter/496535_1_En_9_Fig22_HTML.jpg](img/496535_1_En_9_Fig22_HTML.jpg)\n\
  \n*图 9-22* 在树莓派中安装 `VNC` 查看器\n\n```\nsudo apt update\nsudo apt install realvnc-vnc-server\
  \ realvnc-vnc-viewer\n```\n\n同时，需要在远程桌面计算机上安装 `VNC` 查看器。如果远程桌面计算机的操作系统（OS）不同，`VNC`\
  \ 与所有操作系统兼容。在树莓派中安装 `VNC` 后，必须在树莓派中启用 `VNC` 服务器。可通过以下步骤在树莓派中以图形化方式启用 `VNC` 服务器：\n\
  \n![../images/496535_1_En_9_Chapter/496535_1_En_9_Fig23_HTML.jpg](img/496535_1_En_9_Fig23_HTML.jpg)\n\
  \n*图 9-23* 在树莓派上以图形化方式启用 `VNC` 服务器\n\n1. 进入树莓派图形化桌面，选择 **菜单** > **首选项** > **树莓派配置**。将打开树莓派配置窗口，如图\
  \ 9-23 所示。\n\n2. 在树莓派配置窗口中，选择 **接口** 选项并确保 `VNC` 已启用。如果 `VNC` 未启用，请点击窗口中的 **启用**\
  \ 按钮。\n\n3. 启用 `VNC` 服务器后，点击树莓派图形化桌面右上角的 `VNC` 图标 ![../images/496535_1_En_9_Chapter/496535_1_En_9_Figa_HTML.jpg](img/496535_1_En_9_Figa_HTML.jpg)。`VNC`\
  \ 查看器应用窗口将打开。窗口中会显示树莓派的 `IP` 地址，如图 9-8 所示。只有当树莓派连接到网络时，`IP` 地址才会显示。此处，树莓派通过 `WiFi`\
  \ 网卡/手机热点连接 `WiFi` 网络。\n\n以上步骤用于在远程桌面与树莓派之间建立私有连接。要建立私有连接，远程桌面和树莓派需连接到同一网络。这将仅在公司园区内建立连接。如果用户想要将数据上传到云端，则需要登录\
  \ `VNC` 查看器，以便将树莓派与任何位置的远程桌面连接。\n\n在另一台远程桌面中打开 `VNC` 查看器，如图 9-24 所示，在指定位置输入树莓派的\
  \ `IP` 地址，`VNC` 服务器即在计算机与树莓派之间建立连接。将打开登录窗口，如图 9-25 所示，并提示输入用户名和密码。\n\n![../images/496535_1_En_9_Chapter/496535_1_En_9_Fig25_HTML.png](img/496535_1_En_9_Fig25_HTML.png)\n\
  \n*图 9-25* 使用 `VNC` 查看器从桌面连接树莓派\n\n![../images/496535_1_En_9_Chapter/496535_1_En_9_Fig24_HTML.jpg](img/496535_1_En_9_Fig24_HTML.jpg)\n\
  \n*图 9-24* 树莓派中的 `VNC` 查看器\n\n通常，树莓派的用户名和密码均为 `pi`。输入 `pi` 作为用户名和密码，树莓派桌面将出现在远程桌面计算机上，如图\
  \ 9-26 所示。\n\n![../images/496535_1_En_9_Chapter/496535_1_En_9_Fig26_HTML.png](img/496535_1_En_9_Fig26_HTML.png)\n\
  \n*图 9-26* 远程计算机上的树莓派图形化桌面\n\n现在，树莓派桌面可以远程访问其他计算机。此外，还可以通过 `VNC` 查看器中的文件共享选项共享树莓派中的文件和数据，如图\
  \ 9-27 所示。\n\n![../images/496535_1_En_9_Chapter/496535_1_En_9_Fig27_HTML.png](img/496535_1_En_9_Fig27_HTML.png)\n\
  \n*图 9-27* 从远程桌面上的树莓派进行文件传输\n\n\n\n"
