  ## 树莓派作为边缘设备


  在数据源或其附近进行的计算被称为*边缘计算*。在需要即时或实时计算的领域，以及在无法连接到中央云或连接性受限的偏远地区，边缘计算比云计算更受青睐。边缘计算最大的优势在于其能降低延迟，因为传感器收集的数据在边缘设备上处理，无需远距离传输到数据中心。见图
  3-22。


  ![../images/496535_1_En_3_Chapter/496535_1_En_3_Fig22_HTML.jpg](img/496535_1_En_3_Fig22_HTML.jpg)


  图 3-22


  树莓派作为边缘设备


  ### 自动驾驶汽车中的边缘计算


  自动驾驶汽车将依赖边缘计算，因为在路上行驶的每一毫秒都至关重要。从其传感器和摄像头收集的大量数据无法发送到云端进行分析，因为这需要大量时间，并且还需要不间断的网络连接。因此，由于其更快的速度和更高的可靠性，这类应用更倾向于使用边缘计算。


  ### 什么是边缘设备？


  边缘计算在边缘设备中执行。边缘设备能够实时收集、存储和处理数据。因此，边缘设备能提供更快的响应速度和更高的可靠性。传感器和其他设备通过有线线缆或无线连接（如 Wi-Fi
  或蓝牙）连接到边缘设备，如图 3-22 所示。有时，边缘设备会连接到中央云以进行大数据处理和数据仓库存储。


  ### 使用树莓派进行边缘计算


  树莓派具有良好的计算能力，并且能够通过有线和无线连接连接到传感器和设备。树莓派还支持多种计算机编程语言，如 Python、C/C++ 和 Java。这使得树莓派成为边缘计算的绝佳选择。


  ### 树莓派作为本地化云


  在本章中，我们将讨论将树莓派用作本地化云。


  ### 云计算


  云计算是使用托管在互联网上的远程服务器网络来存储、管理和处理数据的实践。这些远程服务器被称为*云服务器*，位于世界各地的数据中心。从这类服务器访问数据需要强大的互联网连接。


  ### 树莓派作为本地化云


  如今，物联网设备以高速生成海量数据。这些数据通常需要实时处理以做出快速决策，而本地化云可以支持这一点。此外，一些物联网传感器网络部署在互联网连接稀疏的偏远地区，这对本地化云的概念构成了挑战。可以将树莓派打造成一个本地化云，以支持更靠近物联网网络的实时数据处理。它需要通过以太网或
  Wi-Fi 连接到网络。如图 3-23 所示，树莓派作为本地化云，可用于存储和处理从传感器或其他设备（如计算机和手机）收集的数据。


  ![../images/496535_1_En_3_Chapter/496535_1_En_3_Fig23_HTML.jpg](img/496535_1_En_3_Fig23_HTML.jpg)


  图 3-23


  树莓派作为本地化云


  ### 连接外部硬盘驱动器


  可以将外部硬盘驱动器连接到树莓派，以增加其存储容量。这些硬盘驱动器需要使用电源进行外部供电。如果没有电源，可以通过有源 USB 集线器连接它们。增强的存储容量允许树莓派从物联网网络收集和处理大量实时数据。


  ### 连接 USB 加速器


  Coral USB Accelerator 是一个超快的开发板，供深度学习从业者在无需互联网的情况下部署他们的模型，从而实现边缘计算。它为树莓派带来了机器学习接口。它包含一个边缘
  TPU 协处理器，每秒能够执行 4 万亿次运算（TOPS）。这使得实时运行机器学习模型成为可能。例如，该设备可以帮助树莓派以 400 FPS 的速度运行 MobileNet
  v2 模型。


