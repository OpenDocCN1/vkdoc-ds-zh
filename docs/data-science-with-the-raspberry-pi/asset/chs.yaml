- '# 5. 准备数据


  数据科学中最重要的步骤是准备数据。数据准备是清理、处理和转换原始数据以供分析的过程。在此阶段，可以通过清理、识别缺失值、处理异常值等方法来有效处理数据中的错误。因此，本章将讨论使用
  Python 中的 Pandas 包来准备数据的方法。




  ## Pandas 与数据结构


  Pandas 是一个为 Python 编程语言编写的软件库，主要用于数据处理和分析。


  简而言之，Pandas 就像是 Python 中的 Excel，拥有由行和列（在 Pandas 中称为 *series*）组成的表格（在 Pandas 中称为
  *dataframes*）。Pandas 具备许多功能，使其成为数据处理、检查和操作的优秀库。


  ### 安装与使用 Pandas


  在系统上安装 Pandas 需要先安装 NumPy，如果要从源代码构建库，则需要合适的工具来编译 Pandas 所依赖的 C 和 Cython 源码。


  有关此安装的详细信息，请参阅 Pandas 文档。可以使用 `pip` 功能安装 Pandas，命令如下：`pip install pandas`。Pandas
  安装完成后，您可以导入它并检查版本，如下所示：


  ```

  import pandas

  pandas.__version__

  ```


  就像我们通常以别名 `np` 导入 NumPy 一样，我们将以别名 `pd` 导入 Pandas，并且本书的其余部分将继续使用此导入约定。


  ```

  import pandas as pd

  ```


  ### Pandas 数据结构


  数据结构是一种数据组织、管理和存储的格式，它支持高效的访问和修改。更准确地说，数据结构是数据值、它们之间的关系以及可应用于数据的函数或操作的集合。Pandas
  为 Python 引入了两种新的数据结构：`Series` 和 `DataFrame`，它们都构建在 NumPy 之上（这意味着它们速度很快）。


  ### Series


  *Series* 是一种一维对象，类似于数组、列表或表中的一列。它会为序列中的每个项目分配一个带标签的索引。默认情况下，每个项目会收到一个从 0 到 N 的索引标签，其中
  N 是序列长度减 1，如下所示：


  ```

  s = pd.Series([1, ''Raspberry Pi'', 3.14, -500, ''Data''])

  print(s)

  输出:

  0          1

  1   Raspberry Pi

  2    3.14

  3    -500

  4    Data

  dtype: object

  ```


  除了提供默认索引之外，我们还可以在创建序列时为每个条目指定要使用的索引，如下所示：


  ```

  s = pd.Series([1, ''Raspberry Pi'', 3.14, -500, ''Data''],

  index=[''M'', ''A'', ''X'', ''I'', ''E''])

  print(s)

  输出:

  M          1

  A   Raspberry Pi

  X    3.14

  I    -500

  E    Data

  dtype: object

  ```


  `Series` 构造函数也可以将字典转换为序列，并使用字典的键作为其索引，如下所示：


  ```

  d = {''English'': 95, ''Math'': 100, ''Science'': 98, ''Social Science'': 93}

  marks = pd.Series(d)

  print(marks)

  输出:

  English           95

  Math             100

  Science           98

  Social Science    93

  dtype: float64

  ```


  索引可用于从序列中选择特定项目。例如，可以通过指定索引 `Math` 来选择数学成绩。同样，可以通过在列表中提供对应的索引（以逗号分隔）来打印一组项目，如下所示：


  ```

  print (marks[''Math''])

  print(marks[[''English'', ''Science'', ''Social Science'']])

  输出 :

  100.0

  English           95

  Science           98

  Social Science    93

  dtype: float64

  ```


  还可以使用布尔索引来过滤值。例如，使用索引 `marks < 96` 会返回一个布尔值序列，然后我们将其传递给我们的 `marks` 序列，返回对应的 `True`
  项目，如下所示：


  ```

  marks[marks < 96]

  输出:

  Math             100

  Science           98

  dtype: float64

  ```


  可以通过访问项目的对应索引来动态更改序列中某个特定项目的值，如下所示：


  ```

  print(''旧值:'', marks[''Math''])

  marks[''Math''] = 99

  print(''新值:'', marks[''Math''])

  输出:

  (''旧值:'', 100.0)

  (''新值:'', 99.0)

  ```


  我们还可以使用以下代码检查序列中是否存在某个项目：


  ```

  print(''Math'' in marks)

  print(''French'' in marks)

  输出:

  True

  False

  ```


  数学运算也可以应用于数值序列，如下所示：


  ```

  marks * 10

  输出:

  English           950

  Math              990

  Science           980

  Social Science    930

  dtype: float64

  np.square(marks)

  输出:

  English           9025

  Math              9801

  Science           9604

  Social Science    8649

  dtype: float64

  ```


  ### DataFrame


  表格状的 `DataFrame` 数据结构由行和列组成，类似于电子表格或数据库表。您也可以将 `DataFrame` 视为一组共享索引（列名）的 `Series`
  对象。


  #### 读取数据


  要从常见的 Python 数据结构创建 `DataFrame` 数据结构，我们可以将字典的列表传递给 `DataFrame` 构造函数。


  ```

  a={''Name'':[''Augustus'', ''Hazel'', ''Esther'', ''Cavas''],

  ''Gender'':[''Male'',''Female'',''Female'',''Male''],

  ''Age'':[19, 18, 22, 21]}

  b=pd.DataFrame.from_dict(a)

  print(b)

  输出:

  Name      Gender   Age

  0  Augustus    Male   19

  1     Hazel  Female   18

  2    Esther  Female   22

  3     Cavas    Male   21

  ```


  #### 读取 CSV 数据


  读取 CSV 文件就像调用 `read_csv` 函数一样简单。默认情况下，`read_csv` 函数期望列分隔符为逗号，但您可以使用 `sep` 参数进行更改。以下代码展示了将
  CSV 文件读入 `DataFrame` `df` 并使用 `head()` 函数打印 `df` 的前五行所需的语法：


  ```

  df = pd.read_csv(''data.csv'')

  print(df.head())

  ```


  还有一组写入函数，用于将 `DataFrame` 对象写入各种格式，例如 CSV 文件、HTML 表格、JSON 等。以下代码行展示了将 `DataFrame`
  对象写入 CSV 文件的语法：


  ```

  df.to_csv(''path_to_file.csv'')

  ```


  #### 读取 Excel 数据


  Pandas 允许我们读取和写入 Excel 文件，因此我们可以轻松地在 Python 中从 Excel 读取数据，然后将数据写回 Excel。读取 Excel
  文件需要 `xlrd` 库，可以使用 `pip` 命令安装，如下所示：


  ```

  pip install xlrd.

  ```


  以下代码说明了将 Excel 工作表中的内容读入 `DataFrame` `df` 所使用的语法。将 `data.xlsx` 替换为您的 Excel 文件的路径/文件名以运行代码。


  ```

  df = pd.read_excel(''data.xlsx'', ''Sheet1'')

  print(df.head())

  ```


  类似地，来自 `DataFrame` 对象的数据也可以写入 Excel 文件，如下所示：


  ```

  dataframe.to_excel(''path_to_file.xlsx'', index=False)

  ```


  #### 读取 URL 数据


  `read_table` 函数可用于直接从 URL 读取数据。以下代码说明了使用给定 URL 的原始数据创建 `DataFrame`：


  ```

  url = ''https://raw.github.com/gjreda/best-sandwiches/master/data/best-sandwiches-geocode.tsv''

  from_url = pd.read_table(url, sep=''\t'')

  from_url.head(3)

  输出:

  rank         sandwich  ...   lat        lng

  0     1                 BLT  ...   41.895734  -87.679960

  1     2       Fried Bologna  ...   41.884672  -87.647754

  2     3   Woodland Mushroom  ...   41.890602  -87.630925

  ```


  ### 数据清洗


  在大多数数据分析项目中，可用的数据并不总是完美的。原始数据往往很混乱，除了有用数据之外，还可能包含损坏或不准确的数据。因此，数据科学家必须处理这些混乱的数据样本，以便将原始数据转换为可工作的形式，并且他们通常需要花费相当长的时间来执行此操作。


  数据清洗是识别数据中不准确、错误或不完整的部分，并通过替换、删除或修改数据来处理它们的过程。换句话说，它是通过处理原始数据中的所有不规则性来为分析准备数据的过程。在后续部分中，我们将讨论如何处理缺失值和异常值、填充不恰当的值以及删除重复条目。




  #### 处理缺失值


  缺失值在原始数据中相当常见。假设输入数据包含通过调查表收集的来自数千名客户的产品反馈。客户在填写调查表时跳过几个条目是常见行为。例如，部分客户可能不会分享他们对产品的体验，有些可能不会分享他们使用产品的时长，还有另一些可能不会填写联系方式。在整理这些调查表并将其转换为表格时，表中必定会出现大量缺失值。


  来自传感器的数据也可能因各种原因而出现缺失数据，例如传感器节点临时断电、硬件故障、通信干扰等。因此，处理这些缺失值是数据科学家处理原始数据时的首要任务。以下代码演示了如何使用
  NumPy 库中的 `random.randn` 函数创建一个随机数数据库：


  ```

  import pandas as pd

  import numpy as np

  df = pd.DataFrame(np.random.randn(6,4),

  index = [''1'',''3'',''4'',''6'',''7'',''9''],

  columns = [''a'',''b'',''c'',''d''])

  ```


  从前面的代码可以看出，行和列的索引是手动分配的。从分配的行索引可以看出，索引 2、5 和 8 缺失。使用 Pandas 库中的 `reindex` 函数，这些索引被创建出来，并带有缺失的“非数字”（`NaN`）值，如下所示：


  ```

  df=df.reindex([''1'',''2'',''3'',''4'',''5'',''6'',''7'',''8'',''9''])

  print(df)

  输出：

  a         b         c         d

  1  0.099344  0.293956  1.002970  0.516942

  2       NaN       NaN       NaN       NaN

  3  1.608906 -1.748396 -1.013634 -0.651055

  4  3.211263 -2.555312 -1.036068 -0.728020

  5       NaN       NaN       NaN       NaN

  6 -0.101766 -0.205572  1.369707 -1.133026

  7  0.062344  1.483505  0.026995  1.560656

  8       NaN       NaN       NaN       NaN

  9 -0.324347 -0.342040  0.107224  0.272153

  ```


  现在已经创建了一个包含缺失值的数据库，下一步就是处理这些值。在考虑处理这些值的选项之前，首要任务是检测缺失值的位置。Pandas 库中的 `isnull()`
  函数可用于检测包含缺失值的行，如下所示：


  ```

  df1=df[df.isna().any(axis=1)]

  print(df1)

  输出：

  a   b   c   d

  2   NaN NaN NaN NaN

  5   NaN NaN NaN NaN

  8   NaN NaN NaN NaN

  ```


  上述过程让我们大致了解了数据库中缺失数据的数量。一旦检测到这些缺失数据，下一步就是处理它们。我们可以通过两种方式做到这一点：一种是用值填充缺失数据，另一种是直接删除缺失数据。


  Pandas 库中的 `fillna()` 函数可用于用用户指定的标量值填充缺失值，如下所示。如图所示，第 2 行和第 5 行中的缺失值被替换为 0.000000。


  ```

  df2=df.fillna(0)

  print(df2.head())

  输出：

  a         b         c         d

  1  0.099344  0.293956  1.002970  0.516942

  2  0.000000  0.000000  0.000000  0.000000

  3  1.608906 -1.748396 -1.013634 -0.651055

  4  3.211263 -2.555312 -1.036068 -0.728020

  5  0.000000  0.000000  0.000000  0.000000

  ```


  另一种替换缺失值的方法是使用 Pandas 库中的 `ffill` 或 `bfill` 函数。`ffill` 代表“前向填充”，它通过重复缺失值之前出现的值来填充；`bfill`
  代表“后向填充”，它通过重复缺失值之后出现的值来填充。以下代码说明了填充缺失值的前向填充方法：


  ```

  df3= df.fillna(method=''ffill'')

  print(df3.head())

  输出：

  a         b         c         d

  1  0.099344  0.293956  1.002970  0.516942

  2  0.099344  0.293956  1.002970  0.516942

  3  1.608906 -1.748396 -1.013634 -0.651055

