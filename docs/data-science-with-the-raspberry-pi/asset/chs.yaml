  import matplotlib.pyplot as plt

  import numpy as np

  dataset=pd.read_csv(''daily-min-temperatures.csv'')

  df=pd.DataFrame(dataset,columns=[''Date'',''Temp''])

  print(df.head())

  Output:

  Date    Temp

  0        1981-01-01    20.7

  1        1981-01-02    17.9

