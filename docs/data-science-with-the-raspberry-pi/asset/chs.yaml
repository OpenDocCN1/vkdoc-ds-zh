  #### 线图


  线图本质上是由一条线连接起来的一系列数据点，可用于传达某个变量在特定时间段内的变化趋势。线图常用于可视化时间序列数据，以观察数据随时间的变化情况。它也可以作为分析过程的一部分，用于检查迭代过程中变量的变化。


  可以使用 Matplotlib 包中的 `plot` 函数来绘制线图。为了演示线图，我们考虑一个时间序列数据集，该数据集包含澳大利亚墨尔本市 10 年（1981-1990）的每日最低气温（单位：°C）。以下代码演示了加载包含该数据集的
  `.csv` 文件、将其转换为数据框，并绘制 1981 年气温变化的过程。


  ```

