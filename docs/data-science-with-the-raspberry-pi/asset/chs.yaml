  #### 处理异常值


  在数据集中，异常值指的是那些与其他所有观测值（即数据）截然不同的观测值。换句话说，*异常值*是数据集中远离所有其他数据点的数据点。异常值可能源于测量或数据录入时的错误，也可能是数据中真实的极端值。例如，考虑数列
  112, 123, 120, 132, 106, 26, 118, 140, 125。在这个数列中，除了 26 之外，所有数字都接近 100。因此，26 是一个异常值，因为它与其他数字相差甚远。


  检测异常值有两种方法：使用可视化技术和使用数学方法。在本节中，我们将介绍两种用于识别数据中异常值的数学方法，即四分位距（IQR）和 Z 分数。


  *四分位距*是衡量数据集中数据变异性或分散程度的指标。数据首先被排序并划分为四个部分。将整个范围划分为四个部分的值称为*四分位数*。因此，将数据分成四个部分需要三个四分位数。这三个四分位数分别是
  Q[1]、Q[2] 和 Q[3]，其中 Q[2] 是整个数据的中位数，Q[1] 是数据上半部分的中位数，Q[3] 是数据下半部分的中位数。IQR 是第三个四分位数与第一个四分位数的差，即
  Q[3] – Q[1]。


  为了说明使用 IQR 移除异常值的过程，我们首先创建一个包含 15 个条目且包含异常值的 `DataFrame`。


  ```python

  import pandas as pd

  a={''Name'':[''A'',''B'',''C'',''D'',''E'',''F'',''G'',''H'',''I'',''J'',''K'',''L'',''M'',''N'',''O''],

  ''Weight'':[56,62,48,72,15,80,76,64,68,180,75,47,58,63,71]}

  df=pd.DataFrame.from_dict(a)

  print(df.head())

  Output:

  Name  Weight

  0    A      56

  1    B      62

  2    C      48

  3    D      72

  4    E      25

  ```


  在前面的代码中，我们创建了一个包含 15 名成年人（单位：公斤）体重数据的数据库。为方便起见，我们用字母 *A* 到 *M* 为这些成年人命名。我们将 15 公斤和
  180 公斤的体重作为异常值包含进来，因为健康的成年人不太可能体重如此之轻或如此之重。为了检测这些异常值，我们需要分别计算第 25 百分位和第 75 百分位的值，即
  Q1 和 Q3。根据这些值，可以通过计算 Q3 – Q1 的差值得到 IQR 值。此过程如下所示：


  ```python

  Q1=df.Weight.quantile(0.25)

  Q3=df.Weight.quantile(0.75)

  IQR=Q3-Q1

  print(''Q1='',Q1,''Q3='',Q3,''IQR='',IQR)

  Output:

  Q1= 57.0 Q3= 73.5 IQR= 16.5

  ```


  通过将 `DataFrame` 对象中的条目与先前计算的四分位数进行比较，可以看出有四个值低于 Q1，七个值介于 Q1 和 Q3 之间，四个值高于 Q3。但我们知道，在
  Q1 之下只有一个异常值，在 Q3 之上也只有一个异常值。为了检测这些异常值，我们需要形成一个区间，其下限远低于 Q1，上限远高于 Q3。一旦确定了这些界限，就可以稳妥地认为低于下限和高于上限的值是异常值。这在以下代码中进行了说明：


  ```python

  lower_limit = Q1 - 1.5 * IQR

  upper_limit = Q3 + 1.5 * IQR

  df1=df[(df.Weight  upper_limit)]

  print(df1)

  Output:

  Name  Weight

  4    E      25

  9    J     180

  ```


  可以看出，使用 IQR 值创建的界限准确地检测到了我们数据中的异常值。现在可以使用以下代码轻松地过滤掉这些异常值：


  ```python

  df2=df.drop(df1.index)

  print(df2)

  Output:

  Name  Weight

  0     A      56

  1     B      62

  2     C      48

  3     D      72

  5     F      80

  6     G      76

  7     H      64

  8     I      68

  10    K      75

  11    L      47

  12    M      58

  13    N      63

  14    o      71

  ```


  ##### Z 分数


  Z 分数，也称为*标准分数*，可以反映一个数据点距离平均值有多远。从技术上讲，Z 分数将数据拟合到正态分布中，并衡量数据点关于整个数据集平均值的标准差个数，如图
  5-1 所示。


  ![../images/496535_1_En_5_Chapter/496535_1_En_5_Fig1_HTML.jpg](img/496535_1_En_5_Fig1_HTML.jpg)


  图 5-1


  用于基于 Z 分数检测异常值的数据正态分布


  图 5-1 显示，每个数据点都沿着以零均值为中心的正态分布进行映射。距离零均值过远的数据点被视为异常值。在大多数情况下，阈值被设定为 3，任何超出 3σ 或 -3σ
  的数据点都被视为异常值。让我们使用与上一节相同的数据库，并利用 Z 分数来识别异常值。


  ```python

  import pandas as pd

  from scipy import stats

  import numpy as np

  a={''Name'':[''A'',''B'',''C'',''D'',''E'',''F'',''G'',''H'',''I'',''J'',''K'',''L'',''M'',''N'',''O''],

  ''Weight'':[56,62,48,72,15,80,76,64,68,180,75,47,58,63,71,]}

  df=pd.DataFrame.from_dict(a)

  z = np.abs(stats.zscore(df.Weight))

  print(z)

  df1=df[z>3]

  print(df1)

  Output:

  Name  Weight

  9    J     180

  ```


  从上述代码可以看出，对应于体重值 180 的 Z 分数超过了阈值 3，因此它被显示为异常值。遗憾的是，体重值 15 并未被检测为异常值。其原因可以通过将该值与平均值和标准差进行比较来理解，这可以通过
  `np.mean` 和 `np.std` 函数实现，如下所示：


  ```python

  print(np.mean(df.Weight))

  print(np.std(df.Weight))

  Output:

  67.0

  33.448467827390836

  ```


  我们将标准差的值近似为 33.45。可以看出，体重值 180 与平均值之差为 111，大于三倍标准差（>3σ），而体重值 15 与平均值之差仅为 54，小于两倍标准差（<2σ）。解决这个问题的一种方法是降低阈值。让我们假设一个
  `Threshold` 值为 1。


  ```python

  df1=df[z>1]

  print(df1)

  Output:

  Name  Weight

  4    E      15

  9    J     180

  ```


  从上述示例可以看出，理想的阈值 3 可能并不适用于所有数据集，因此应根据数据的分布情况来选择阈值。现在，与 IQR 的情况类似，可以使用以下代码简单地过滤掉这些异常值：


  ```python

  df2=df.drop(df.Name[z>1].index)

  print(df2)

  Output:

  Name  Weight

  0     A      56

  1     B      62

  2     C      48

  3     D      72

  5     F      80

  6     G      76

  7     H      64

  8     I      68

  10    K      75

  11    L      47

  12    M      58

  13    N      63

  14    o      71

  ```




  ##### 过滤掉不合适的值


  在某些情况下，数据集中可能包含一些与数据完全无关的不合适值，这在传感器数据中尤为常见。从传感器记录的数据通常是时间序列数据，每个数据点都带有唯一的时间戳。这些时间戳在许多分析场景中并不需要，因此可以被视为不合适值。为了说明这一概念，我们创建一个类似于传感器数据的时间序列温度数据，如下所示：


  ```

  import pandas as pd

  data={''Time'':[''12:00:05'',''12:08:33'',''12:25:12'',''12:37:53'',''12:59:08''],

  ''Temperature'':[''T=22'',''T=22'',''T=23'',''T=23'',''T=24'']}

  df=pd.DataFrame.from_dict(data)

  print(df)

  Output:

  Time Temperature

  0  12:00:05        T=22

  1  12:08:33        T=22

  2  12:25:12        T=23

  3  12:37:53        T=23

  4  12:59:08        T=24

  ```


  现在，需要移除每个数据点对应的时间戳以及每个数据点中的前缀 `''T=''`。时间戳可以使用 Pandas 库中的 `drop` 函数移除，而前缀可以使用 `str.replace`
  函数移除。由于每个数据点中都存在前缀，数据最初存储为字符串数据类型。因此，在移除这些前缀后，必须将数据类型更改为 `int` 或 `float`。这些步骤说明如下：


  ```

  df.drop(''Time'',inplace=True,axis=1)

  df=df.Temperature.str.replace(''T='','''')

  df=df.astype(float)

  print(df)

  Output:

  0    22.0

  1    22.0

  2    23.0

  3    23.0

  4    24.0

  Name: Temperature, dtype: float64

  ```


  ##### 移除重复项


  重复条目在数据科学中很常见，尤其是当我们从多个来源收集数据并整合处理时。根据分析的性质，这些重复项可能会带来问题。因此，最好在分析数据之前移除这些重复项，如下所示：


  ```

  import pandas as pd

  a={''Name'':[''Alan'',''Joe'',''Jim'',''Tom'',''Alan'',''Anna'',''Elle'',''Rachel'',''Mindy''],

  ''Age'':[22,24,25,24,22,23,21,22,23]}

  df=pd.DataFrame.from_dict(a)

  print(''DATA\n'',df)

  print(''DUPLICATES\n'',df[df.duplicated()])

  df1=df.drop_duplicates()

  print(''DATA AFTER REMOVING DUPLICATES\n'',df1)

  Output:

  DATA

  Name  Age

  0    Alan   22

  1     Joe   24

  2     Jim   25

  3     Tom   24

  4    Alan   22

  5    Anna   23

  6   Ellen   21

  7  Rachel   22

  8   Mindy   23

  DUPLICATES

  Name  Age

  4  Alan   22

  DATA AFTER REMOVING DUPLICATES

  Name  Age

  0    Alan   22

  1     Joe   24

  2     Jim   25

  3     Tom   24

  5    Anna   23

  6   Ellen   21

  7  Rachel   22

  8   Mindy   23

  ```


  如代码所示，从一个包含若干人姓名和年龄的字典中创建了一个 `DataFrame`，并且我们特意为名字 Alan 创建了一个重复条目。可以看到，Pandas 库中的
  `duplicated` 函数清楚地识别出了该名字的第二个条目。随后，通过 Pandas 库中的 `drop_duplicates` 函数移除了这个重复条目。


  ## 数据可视化


  在上一章中，我们讨论了准备数据分析所涉及的多个步骤。在分析数据之前，必须了解所处理数据的性质。数据可视化可以让我们对数据的性质有一些有用的洞察。这些洞察，例如数据中的模式、数据的分布、数据中存在的异常值等，对于确定分析数据所用的方法非常有用。此外，在分析结束时，可视化可用于向相关方传达分析结果，因为通过可视化技术传达分析结果比编写数页文本内容解释结果更有效。在本章中，我们将学习
  Python 的 Matplotlib 包提供的一些基本可视化图表，以及如何定制这些图表以传达不同数据的特点。


  ### Matplotlib 库


  Matplotlib 是一个绘图库，用于使用 Python 编程语言创建达到出版质量的图表。该包根据要传达的信息类型提供各种类型的图表。这些图表带有交互选项，如平移、缩放和子图配置。图表还可以保存为不同格式，如
  PNG、PDF 等。此外，Matplotlib 包为每种图表提供了大量的自定义选项，可用于有效呈现要传达的信息。




  #### 散点图


  散点图是一种使用标记来表示数据点，以展示两个变量之间关系的图表。在数据分析中，散点图有多种用途。例如，将数据点作为一个整体来看，散点图可以揭示数据中的模式和趋势，这反过来有助于数据科学家理解两个变量之间的关系，从而能够提出有效的预测技术。散点图也可用于识别数据中的聚类。它还能揭示数据中存在的异常值，而识别异常值至关重要，因为它们往往会显著影响预测系统的性能。


  创建散点图通常需要两列数据，每列对应图表的一个维度。表中的每一行数据将对应图表中的一个数据点。可以使用 Matplotlib 库中的 `scatter` 函数来创建散点图。为了演示散点图的实用性，我们考虑一个可以从
  Scikit-Learn 库中导入的波士顿房价数据集。该数据集实际上来自卡内基梅隆大学维护的 StatLib 库。它包含 506 个样本，具有 13 个不同的特征属性，例如城镇人均犯罪率（`CRIM`）、每套住宅的平均房间数（`RM`）、径向高速公路可达性指数（`RAD`）等。此外，还有一个目标属性
  `MEDV`，表示自住房屋房价中位数（单位：千美元）。


  以下代码演示了创建波士顿房价数据集 Pandas 数据框的过程，该数据集最初是字典格式。为方便起见，代码中使用 `print` 命令仅显示数据框的前五行。


