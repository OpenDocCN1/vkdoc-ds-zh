- '# 1\. 数据科学导论


  数据是以词语、数字和关于主体的描述形式存在的信息集合。考虑以下表述：“那条狗有四条腿，身高`1.5m`，长着棕色毛发。” 这句话包含了关于这条狗的三种不同类型的信息（即数据）。数据“四”和“`1.5m`”是数值型数据，而“棕色毛发”是描述型数据。了解各种数据类型有助于理解数据、进行有效分析，并更好地从数据中提取知识。从根本上说，数据可以分为两种类型。


  *   定量数据

  *   定性数据


  `定量数据`只能通过测量获得，而不能通过观察得到。它可以以数值形式表示。定量数据可进一步分为连续型和离散型。精确的整数值是`离散数据`，而`连续数据`可以是某个范围内的任意值。`定性数据`是对主体特征的描述。通常，定性数据可以通过观察获得，无法进行测量。换言之，定性数据可称为分类数据，而定量数据可称为数值型数据。


  例如，在前面那句表述中，“棕色毛发”描述了狗的一个特征，属于定性数据；而“四条腿”和“`1.5m`”则是定量数据，分别属于离散数据和连续数据。


  数据可以以结构化形式和非结构化形式存在。当数据按照预定义的数据模型/结构进行组织时，被称为`结构化数据`。结构化数据可以以表格格式存储，或借助查询语言存储在关系数据库中。我们也可以用
  Excel 文件格式存储这类数据，例如表 1-1 中给出的学生数据库。


  **表 1-1** 结构化数据示例


  | **学号** | 分数 | 出勤率 | 年级 | 性别 |

  | --- | --- | --- | --- | --- |

  | 111401 | 492/500 | 98% | 2011-2014 | 男 |

  | 111402 | 442/500 | 72% | 2011-2014 | 男 |

  | 121501 | 465/500 | 82% | 2012-2015 | 女 |

  | 121502 | 452/500 | 87% | 2012-2015 | 男 |


  大多数人类生成和机器生成的数据都是非结构化数据，例如电子邮件、文档、文本文件、日志文件、短信、图像、视频和音频文件、网络和社交媒体上的消息，以及来自传感器的数据。这些数据只有通过人工或机器干预，才能转换为结构化格式。图
  1-1 展示了非结构化数据的各种来源。


  ![../images/496535_1_En_1_Chapter/496535_1_En_1_Fig1_HTML.jpg](img/496535_1_En_1_Fig1_HTML.jpg)


  **图 1-1** 非结构化数据的来源


  ## 数据类型在数据科学中的重要性


  在开始分析数据之前，了解数据类型非常重要，这样你才能选择合适的分析方法。连续数据的分析与分类数据的分析是不同的；因此，对两者使用相同的分析方法可能导致错误的分析结果。


  例如，在涉及连续数据的统计分析中，某个精确事件发生的概率为零，而对于离散数据，其结果可能不同。


  你还可以根据数据类型选择可视化工具。例如，连续数据通常使用直方图表示，而离散数据则可以借助柱状图进行可视化。


  ## 数据科学概述


  正如本章开头所讨论的，数据科学无非就是从数据中提取知识或信息。不幸的是，并非所有数据都能提供有用信息。这取决于客户需求、假设、数据类型性质以及用于分析和建模的方法。因此，在为智能决策而分析或建模数据之前，需要经历一些流程。图
  1-2 描述了这些数据科学流程。


  ![../images/496535_1_En_1_Chapter/496535_1_En_1_Fig2_HTML.jpg](img/496535_1_En_1_Fig2_HTML.jpg)


  **图 1-2** 数据科学流程


  ## 数据需求


  为了开展一个数据科学项目，数据科学家首先需要基于客户/业务需求来理解问题，然后为分析问题定义目标。例如，假设一个客户想要分析公众对某项政府政策的情绪。首先，问题的目标可以设定为“收集民众对政府政策的看法”。接着，数据科学家需要确定能够支撑该目标的数据类型以及数据来源。对于这个示例问题，可能的数据来源是社交媒体数据，包括不同类别人群的短信和民意调查，以及关于他们的教育水平、年龄、职业等信息。在开始数据收集之前，制定一份从各种来源收集数据的良好工作计划至关重要。设定目标和制定工作计划可以减少收集数据所花费的时间，并有助于准备报告。


  ## 数据获取


  互联网上有许多类型的结构化开放数据，我们称之为`二手数据`，因为这些数据是由他人收集并整理成某种表格格式的。如果用户想要直接从某个来源收集数据，则称之为`一手数据`。最初，非结构化数据是通过众多资源收集的，例如移动设备、电子邮件、传感器、摄像头、与人的直接互动、视频文件、音频文件、短信、博客等。


  ## 数据准备


  数据准备是数据科学流程中最重要的部分。准备数据就是将数据整理成适合知识提取的形式。数据准备阶段包含三个步骤。


  1.  数据处理

  2.  数据清洗

  3.  数据转换


  ### 数据处理


  这一步很重要，因为当我们从各种来源导入数据时，需要检查数据质量。进行这种质量检查是为了确保数据具有正确的数据类型、标准格式，并且变量中没有拼写错误或错误。这一步将减少进行分析时的数据问题。此外，在此阶段，可以将收集到的非结构化数据组织成结构化形式，以便于分析和可视化。


  ### 数据清洗


  数据处理完成后，还需要清洗数据，因为数据中可能仍然存在一些错误。这些错误会影响数据中存在的真实信息。可能的错误如下：


  *   重复值

  *   人为或机器错误

  *   缺失值

  *   异常值

  *   不恰当的值


  ### 重复值


  在数据库中，某些数据会重复出现多次，这导致了`重复值`。最好检查并删除重复值，以减少数据分析过程中的计算开销。


  ### 人为或机器错误


  数据是通过人工或机器从各种来源收集的。在此过程中，由于人为疏忽或机器故障，一些错误是不可避免的。避免此类错误的可行解决方案是将变量和值与标准值进行匹配。


  ### 缺失值


  在将非结构化数据转换为结构化形式时，某些行和列可能没有任何值（即空值）。这种错误会导致信息中断，并使可视化变得困难。许多编程语言都提供了内置函数，我们可以用它们来检查数据中是否存在缺失值。




  ### 异常值


  在统计学中，异常值是指与其他观测数据存在显著差异的数据点。异常值可能源于测量过程中的变异性，也可能表明实验误差；异常值有时会从数据集中排除。图 1-3 展示了一个异常值数据的示例。异常值数据会对某些类型的模型造成问题，进而影响决策制定。


  ![../images/496535_1_En_1_Chapter/496535_1_En_1_Fig3_HTML.jpg](img/496535_1_En_1_Fig3_HTML.jpg)


  图 1-3


  异常值数据


  ### 数据变换


  数据变换可以通过多种方法实现，例如归一化、最小-最大值运算、相关性信息等。


  ## 数据可视化


  根据用户的需求，可以借助图表、图形等可视化工具对数据进行分析。这些可视化工具有助于人们理解数据集中特定变量的趋势、变化和偏差。可视化技术可作为探索性数据分析的一部分来使用。


  ## 数据分析


  进一步地，可以借助数学技术（例如统计技术）对数据进行分析。改进点、偏差和变化将以数值形式确定。我们还可以通过结合可视化工具的结果和分析技术来生成分析报告。


  ### 建模与算法


  如今，许多机器学习算法被用于从原始数据中预测有用信息。例如，神经网络可以根据用户的历史行为，识别出愿意向孤儿捐款的用户。在此场景中，可以根据用户的教育背景、活动、职业、性别等收集其历史行为数据，并利用这些收集到的数据训练神经网络。每当有新用户的数据输入该模型时，它就能预测该新用户是否会捐款。然而，预测的准确性取决于训练时所使用数据的可靠性和数据量。


  现有许多机器学习算法，例如回归技术、支持向量机、神经网络、深度神经网络、循环神经网络等，均可应用于数据建模。完成数据建模后，可以通过输入新用户的数据并生成预测报告来对模型进行分析。


  ### 报告生成/决策制定


  最后，可以借助可视化工具、数学或统计技术以及模型，基于分析结果生成报告。此类报告在许多场景下都很有帮助，例如预测某个组织、行业或政府的优势与劣势等。报告中的事实与发现能够使决策变得相当简单且明智。此外，根据客户需求，还可以使用某些自动化工具来自动生成分析报告。


  ## 数据科学的最新趋势


  数据科学中的某些领域正在呈指数级增长，因此将对数据科学家颇具吸引力。以下各节将对此进行讨论。


  ### 数据科学自动化


  在当前的状况下，数据科学仍需要大量人工操作，例如数据处理、数据清洗和数据变换。这些步骤耗费大量时间和计算资源。现代世界要求实现数据科学流程的自动化，例如数据处理、数据清洗、数据变换、分析、可视化和报告生成。因此，自动化领域将成为数据科学行业中的顶级需求。


  ### 基于人工智能的数据分析师


  人工智能技术和机器学习算法可以有效地用于数据建模。特别是，使用深度神经网络的强化学习可根据数据的变化来升级模型的学习能力。同时，机器学习技术也可用于自动化数据科学项目。


  ### 云计算


  如今人们使用的数据量呈指数级增长。一些行业每天都会收集大量数据，因此发现借助本地服务器来存储和分析这些数据十分困难。这使得计算和维护方面的成本变得高昂。因此，他们更倾向于采用云计算，即数据可以存储在云服务器上，并且可以随时随地检索以进行分析。许多云计算公司在其云服务器上提供数据分析平台。数据处理量增长得越多，这个领域就越会获得关注。


  ## 边缘计算


  许多小型行业不需要在云服务器上分析数据，而是需要即时获得分析报告。对于这类应用，边缘设备可能是一种可行的解决方案，用于获取数据、分析数据，并立即以可视化形式或数值形式向用户呈现报告。未来，对边缘计算的需求将显著增加。


  ## 自然语言处理


  自然语言处理可用于从网站、电子邮件、服务器、日志文件等来源提取非结构化数据。此外，NLP 还可用于将文本转换为统一的数据格式。例如，我们可以根据人们在社交媒体上的消息，将其情感转换为数据格式。这将是一种从多种来源收集数据的强大工具，其需求将持续增长。


  ## 为什么要在树莓派上学习数据科学？


  许多书籍在云计算背景下解释了数据科学涉及的不同流程。但本书将结合树莓派的实时应用来讨论数据科学的概念。树莓派板卡可以通过其通用输入/输出（GPIO）引脚连接多种传感器，从而与现实世界进行交互，这使其更易于收集实时数据。由于其体积小、成本低，可以将多个树莓派板卡节点连接成网络，从而实现本地化操作。换句话说，树莓派可以作为一种边缘计算设备，在更靠近信息采集设备的位置进行数据处理和存储，从而克服了与云计算相关的缺点。因此，许多数据处理应用可以通过分布式的这类设备来实现，它们可以管理实时数据并在本地运行分析。本书将帮助您使用树莓派实现实时的数据科学应用。


  '
- "# 2. Python 编程基础\n\nPython 是一种通用动态编程语言，由荷兰程序员吉多·范罗苏姆于 1989 年创建。它是数据科学领域最常用的编程语言。由于用\
  \ Python 学习和编写代码比其他语言更容易，因此它是初学者的理想选择。Python 的广泛使用也归功于其免费且开源的特点。Python 社区开发的大量科学库和软件包使数据科学家能够处理数据密集型的实时应用。一些领先的组织，例如谷歌、Dropbox\
  \ 和 Netflix，正在不同层面上使用 Python 来增强其软件。本章中，我们将讨论 Windows 操作系统上 Python 的安装、不同的 Python\
  \ 集成开发环境、Python 提供的基本数据类型、控制流语句、Python 函数以及不同的 Python 数据科学库。\n\n\n\n## 为什么选择 Python？\n\
  \nPython 是数据科学家最青睐的编程语言，原因如下：\n\n- 这是一款开源编程语言，拥有庞大且不断壮大的贡献者与用户社区。\n- 与 C、C++ 和 Java\
  \ 等其他编程语言相比，其语法更简洁。\n- 支持用户进行面向对象编程。\n- 拥有大量的库，可用于执行开发网站、构建机器学习应用等多种任务。\n- 可应用于树莓派等嵌入式小型硬件设备，从而实现各种应用程序的实时部署。\n\
  \n## Python 安装\n\n大多数 Linux 操作系统发行版都预装了 Python 软件包，但在 Windows 操作系统上则需要单独安装。在 Windows\
  \ 操作系统上安装 Python 的步骤如下：\n\n![../images/496535_1_En_2_Chapter/496535_1_En_2_Fig1_HTML.jpg](img/496535_1_En_2_Fig1_HTML.jpg)\n\
  \n图 2-1：Python 安装向导\n\n1. 打开浏览器，访问 Python 官方网站 `Python.org`。\n2. 在该页面点击 `Downloads`\
  \ 选项卡，并在结果页面下载最新版本的软件。\n3. 下载完成后，打开安装包。在如图 2-1 所示的安装向导中，勾选 `Add Python to PATH`，这将确保\
  \ Python 被自动添加到系统环境变量路径中；否则，此路径必须在系统的 `Environment Variables` 设置中手动添加。\n4. 点击 `Install\
  \ Now` 安装该软件包。\n\n安装完成后，你可以在命令提示符下输入 `python --version` 来验证安装，系统将显示已安装的 Python 版本。如果没有显示版本号，则可能是安装过程或系统路径变量存在问题。\n\
  \n请参阅官方网站上的 Python 文档，了解为该软件下载额外模块和包的操作步骤。你可以直接在命令提示符下开始使用 Python，也可以安装下一节介绍的各种集成开发环境（IDE）之一。\n\
  \n## Python 集成开发环境（IDE）\n\n*集成开发环境*（IDE）是一个将开发者工具整合到图形用户界面（GUI）中的软件套件，包含编辑代码、构建、执行和调试程序等功能。Python\
  \ 有许多可用的 IDE，每种都有其自身优势。本节将讨论一些常用的 IDE。\n\n### PyCharm\n\nPyCharm IDE 由捷克公司 JetBrains\
  \ 开发。它是一款跨平台 IDE，可在 Windows、macOS 和 Linux 上使用。它提供代码分析和图形化调试器，还支持使用 Django 进行 Web\
  \ 开发以及使用 Anaconda 进行数据科学。PyCharm 的一些吸引人的特性包括智能代码补全、简单的包管理界面以及重构选项，该选项提供了对代码中多行进行修改的能力。\n\
  \n### Spyder\n\nSpyder 是一款用于 Python 语言科学编程的跨平台 IDE。Spyder 集成了多个科学包，包括 `NumPy`、`SciPy`、`Matplotlib`、`Pandas`、`IPython`\
  \ 以及其他开源软件。它采用 MIT 许可证发布。\n\n### Jupyter Notebook\n\nJupyter Notebook 是一个基于 Web\
  \ 的交互式计算环境。该笔记本将代码及其输出整合在单个文档中，该文档结合了可视化图表、文本、数学方程和其他媒体，使其非常适合数据科学应用。\n\n### 使用\
  \ IDLE 进行 Python 编程\n\nIDLE 是一款简单的跨平台 IDE，适合教育环境中的初学者。它具有多窗口文本编辑器、带有语法高亮的 Python\
  \ shell 以及集成调试器等功能。由于这是 Python 自带的默认编辑器，下面来看看如何使用 IDLE 执行 Python 代码。\n\n在此 IDLE\
  \ 中有两种执行 Python 代码的方式。第一种是交互模式，你可以在 Python shell 中直接在 `>>>` 符号旁边输入代码，如图 2-2 所示。每行代码在按下\
  \ `Enter` 后立即执行。使用交互模式的缺点是：保存代码时，会连同结果一并保存，这意味着你无法将保存的代码用于后续执行。\n\n![../images/496535_1_En_2_Chapter/496535_1_En_2_Fig2_HTML.jpg](img/496535_1_En_2_Fig2_HTML.jpg)\n\
  \n图 2-2：在交互模式下运行 Python 代码\n\n第二种方式是在脚本模式下运行代码，你可以打开一个脚本窗口，在其中输入完整代码，然后以 `.py` 扩展名保存，供以后使用。要打开脚本文件窗口，请转到顶部的\
  \ `File` 菜单并点击 `New File`。在脚本窗口中，输入图 2-2 中所示的两行相同代码。图 2-3 显示了包含代码的脚本文件窗口。然后转到 `File`\
  \ 菜单，点击 `Save`，并通过指定合适的文件名保存程序。确保文件名不以数字开头，也不要与现有的 Python 关键字同名。\n\n![../images/496535_1_En_2_Chapter/496535_1_En_2_Fig3_HTML.jpg](img/496535_1_En_2_Fig3_HTML.jpg)\n\
  \n图 2-3：脚本文件窗口\n\n文件保存后，可以通过转到顶部的 `Run` 菜单并点击 `Run Module` 来执行脚本。这将执行脚本并在 Python\
  \ shell 中打印输出，如图 2-4 所示。\n\n![../images/496535_1_En_2_Chapter/496535_1_En_2_Fig4_HTML.jpg](img/496535_1_En_2_Fig4_HTML.jpg)\n\
  \n图 2-4：脚本文件的输出\n\n## Python 注释\n\n在我们开始讨论 Python 数据类型之前，有必要了解 Python 中的注释行，因为我们会在代码中经常使用它们。根据注释的目的，有两种编写注释行的方法。\n\
  \n如果你想为自己编写关于代码中某一行简短说明，那么单行注释是最佳选择。这些单行注释只需在行首使用井号（`#`）字符即可创建，并会在行尾自动结束。执行代码时，Python\
  \ 编译器会忽略井号符号之后直到行尾的所有内容。\n\n多行注释用于向他人解释代码的特定方面，可以通过在注释的开头和结尾添加三个单引号（`'''`）来创建。Python\
  \ 编译器不会忽略这些注释，如果脚本中除了注释没有其他内容，它们会出现在输出中。这两种注释在 IDLE Python shell 格式中的示例如下：\n\n```\n\
  >>> # 这是一个注释\n>>> \"'这是一个注释\"'\n'这是一个注释'\n```\n\n## Python 数据类型\n\n在编程语言中，*数据类型*\
  \ 由变量可以取值的类型定义。Python 数据类型主要可分为数字型和序列型两类。本节将讨论属于这两类的数据类型，并为每种类型提供相关示例。\n\n### 数字型数据类型\n\
  \n数字型数据类型是可以取数值的标量变量。数字型数据类型的类别包括 `int`、`float` 和 `complex`。此外，我们还将讨论使用布尔变量的 `bool`\
  \ 数据类型。\n\n\n\n#### `int`\n\n`int` 数据类型表示整数，即不带小数点的有符号整数。清单 2-1 中的代码展示了整数的数据类型。\n\
  \n```\na=5\n\"'使用 type() 函数打印变量 a 的数据类型\"'\nprint(\"a 的类型是\",type(a))\n输出：\na 的类型是\
  \ \n清单 2-1\n整数数据类型\n```\n\n#### `float`\n\n`float` 数据类型表示浮点数，即用小数点分隔整数部分和小数部分的数字。清单\
  \ 2-2 中的代码打印了浮点值的数据类型。\n\n```\na = 5.0\nprint('a 的类型是',type(a))\n输出：\na 的类型是 \n\
  清单 2-2\n浮点数据类型\n```\n\n#### `complex`\n\n`complex` 数据类型表示形式为 *a*+*bj* 的复数，其中 *a*\
  \ 和 *b* 分别是实部和虚部。数字 *a* 和 *b* 可以是整数或浮点数。清单 2-3 中的代码打印了复数数据类型。\n\n```\na=3.5+4j\n\
  print('a 的类型是',type(a))\n输出：\na 的类型是 \n清单 2-3\n复数数据类型\n```\n\n#### `bool`\n\n在 Python\
  \ 中，布尔变量通过 `True` 和 `False` 关键字定义。由于 Python 区分大小写，关键字 `True` 和 `False` 的首字母必须大写。清单\
  \ 2-4 演示了 `bool` 数据类型。\n\n```\na= 8>9\nprint('a 的类型是',type(a))\nprint(a)\n输出：\n\
  a 的类型是 \nFalse\n清单 2-4\n布尔数据类型\n```\n\n布尔值可以通过布尔运算符进行操作，包括 `and`、`or` 和 `not`，如清单\
  \ 2-5 所示。\n\n```\na = True\nb = False\nprint(a or b)\n输出：\nTrue\n清单 2-5\n布尔数据类型的操作\n\
  ```\n\n### 数值运算符\n\n表 2-1 总结了 Python 中可应用于数值数据类型的数值运算。\n\n表 2-1\n\nPython 中的数值运算符\n\
  \n| 运算符 | 运算 |\n| --- | --- |\n| `( )` | 括号 |\n| `**` | 幂运算 |\n| `*` | 乘法 |\n| `/`\
  \ | 除法 |\n| `+` | 加法 |\n| `-` | 减法 |\n| `%` | 取模运算 |\n\n表 2-1 中的运算符按其优先级顺序列出。当代码的某一行执行多个运算时，执行的顺序将根据表\
  \ 2-1 中的优先级顺序进行。考虑涉及乘法和加法的示例 `2*3+5`。从表 2-1 可以看出，乘法优先级高于加法，因此会先执行乘法运算符（`*`）得到 `2*3=6`，然后执行加法运算符（`+`），最终得到结果\
  \ `6+5=11`。\n\n### 序列数据类型\n\n序列数据类型允许在变量中存储多个值。序列数据类型的五种类型是 `list`、`tuple`、`str`、`set`\
  \ 和 `dict`。\n\n#### `list`\n\n列表是数据科学家在 Python 中最常用的数据类型。列表是一个有序的元素序列。列表中的元素不必属于同一数据类型。列表可以声明为用逗号分隔并括在方括号\
  \ `[]` 内的项。列表是可变的；也就是说，列表中元素的值可以更改。列表中的元素从零开始索引，因此可以通过其对应的索引访问列表中的任何元素，如清单 2-6 所示。索引必须是整数，对索引使用任何其他数据类型都会导致\
  \ `TypeError`。同样，尝试访问列表范围之外的索引会导致 `IndexError`。\n\n```\na = [1, 2.5, 5, 3+4j, 3,\
  \ -2]\nprint(\"a 的类型是\",type(a))\n\"'打印列表中的第一个值\"'\nprint(\"a[0]=\",a[0])\n\"'打印列表中的第三个值\"\
  '\nprint(\"a[2]=\",a[2])\n\"'打印从索引 0 到 2 的值\"'\nprint(\"a[0:3]=\",a[0:3])\n\"'打印从索引\
  \ 4 到列表末尾的值\"'\nprint(\"a[4:]=\",a[4:])\n\"'将索引 3 处的值更改为 4\"'\na[3]=4\nprint(\"\
  a=\",a)\n\"'小数索引导致 TypeError\"'\nprint(a[1.5])\n\"超出范围索引导致 IndexError\"'\nprint(a[8])\n\
  第 2 行输出：a 的类型是 \n第 4 行输出：a[0]= 1\n第 6 行输出：a[2]= 5\n第 8 行输出：a[0:3]= [1, 2.5, 5]\n\
  第 10 行输出：a[4:]= [3, -2]\n第 13 行输出：a= [1, 2.5, 5, 4, 3, -2]\n第 15 行输出：TypeError:\
  \ list indices must be integers or slices, not float\n第 17 行输出：IndexError: list\
  \ index out of range\n清单 2-6\n列表操作\n```\n\n考虑分别存储在变量 `a` 和 `b` 中的两个列表。表 2-2 显示了\
  \ Python 提供的一些可以对列表 `a` 和 `b` 执行的其他操作。其中一些函数也适用于元组、字符串和集合。\n\n表 2-2\n\nPython 中的列表操作\n\
  \n| 函数 | 描述 |\n| --- | --- |\n| `a+b` | 连接两个列表 `a` 和 `b` |\n| `a*n` | 将列表 `a` 重复\
  \ `n` 次，其中 `n` 是整数 |\n| `len(a)` | 计算列表 `a` 中元素的个数 |\n| `a.append()` | 向列表 `a` 末尾添加一个元素\
  \ |\n| `a.remove()` | 从列表 `a` 中移除一个项 |\n| `a.pop()` | 移除并返回列表 `a` 中给定索引处的元素 |\n\
  | `a.index()` | 返回列表 `a` 中第一个匹配项的索引 |\n| `a.count()` | 返回列表 `a` 中作为参数传递的项的数量 |\n\
  | `a.sort()` | 按升序对列表 `a` 中的项进行排序 |\n| `a.reverse()` | 反转列表 `a` 中项的顺序 |\n\n####\
  \ `tuple`\n\n元组与列表一样，也是一个有序的元素序列，但区别在于元组是不可变的；也就是说，元组中的值不能更改。尝试更改元组中元素的值会导致 `TypeError`。将不会更改的数据存储为元组，可以确保它们保持写保护状态。元组可以声明为用逗号分隔并括在圆括号\
  \ `()` 内的项。元组也可以像列表一样进行索引，如清单 2-7 所述。\n\n```\na = (1, 3, -2, 4, 6)\nprint(\"a 的类型是\"\
  ,type(a))\nprint(\"a[3]=\",a[3])\na[2] = 5\n第 2 行输出：a 的类型是 \n第 3 行输出：a[3]= 4\n第\
  \ 4 行输出：TypeError: 'tuple' object does not support item assignment\n清单 2-7\n元组操作\n\
  ```\n\n#### `str`\n\n`str` 数据类型表示一个字符串。字符串可以声明为用双引号（`\" \"`）括起来的字符。也可以使用单引号（`' '`），但由于某些单词中会出现撇号，使用双引号可以避免混淆。字符串中的字符与列表和元组相同的方式索引。字符串中两个单词之间的空格也被视为一个字符。与元组一样，字符串也是不可变的，如清单\
  \ 2-8 所述。\n\n```\na = \"Hello World!\"\nprint(\"a 的类型是\",type(a))\nprint(\"a[3:7]=\"\
  ,a[3:7]\na[2] = \"r\"\n第 2 行输出：a 的类型是 \n第 3 行输出：a[3:7]= lo W\n第 4 行输出：TypeError:\
  \ 'str' object does not support item assignment\n清单 2-8\n字符串操作\n```\n\n\n\n### `set`\
  \ 集合\n\n`set` 是一个无序的集合，因此不支持索引。`set` 由花括号 `{}` 内逗号分隔的值定义。`set` 可用于去除序列中的重复项。清单 2-9\
  \ 展示了 `set` 中的操作。\n\n```\na = {1, 2, 3, 2, 4, 1, 3}\nprint(\"a is of type\",type(a))\n\
  print(\"a=\",a)\n第 2 行的输出：a is of type \n第 3 行的输出：a= {1, 2, 3, 4}\n清单 2-9\n集合中的操作\n\
  ```\n\n假设两个集合分别存储在变量 `a` 和 `b` 中。表 2-3 展示了 Python 支持的可应用于这两个集合的各种集合操作。\n\n**表 2-3**\
  \ Python 中的集合操作\n\n| 函数 | 描述 |\n| --- | --- |\n| `a.union(b)` | 返回两个集合 `a` 和 `b`\
  \ 的并集，存于新集合中 |\n| `a.difference(b)` | 返回两个集合 `a` 和 `b` 的差集，存于新集合中 |\n| `a.intersection(b)`\
  \ | 返回两个集合 `a` 和 `b` 的交集，存于新集合中 |\n| `a.isdisjoint(b)` | 如果两个集合 `a` 和 `b` 没有交集，则返回\
  \ `True` |\n| `a.issubset(b)` | 如果 `a` 是 `b` 的子集，即集合 `a` 的所有元素都存在于集合 `b` 中，则返回 `True`\
  \ |\n| `a.symmetric_difference(b)` | 返回两个集合 `a` 和 `b` 的对称差集，存于新集合中 |\n\n### `dict`\
  \ 字典\n\n`dict` 表示字典数据类型，它是一种无序的数据集合，表示为键值对。字典可以用花括号 `{}` 定义，每个项都是以 `{key:value}`\
  \ 形式存在的键值对。字典针对数据检索进行了优化，可以使用相应的键来检索字典中的特定值。换句话说，键充当该值的索引。键和值可以是任何数据类型。键通常是不可变的，并且在字典中不能重复，而值可以有重复的条目。尝试访问字典中不存在的键将导致\
  \ `KeyError`，如清单 2-10 所述。\n\n```\na = {1: 'Hello', 4: 3.6}\nprint(\"a is of type\"\
  , type(a))\nprint(a[4])\nprint(a[2])\n第 2 行的输出：a is of type \n第 3 行的输出：3.6\n第 4\
  \ 行的输出：KeyError: 2\n清单 2-10\n字典中的操作\n```\n\n### 类型转换\n\n类型转换是将任何数据类型的值转换为另一种数据类型的过程。Python\
  \ 提供的类型转换函数如下：\n\n* `int()`: 将任何数据类型更改为 `int` 数据类型\n* `float()`: 将任何数据类型更改为 `float`\
  \ 数据类型\n* `tuple()`: 将任何数据类型更改为元组\n* `list()`: 将任何数据类型更改为列表\n* `set()`: 将任何数据类型更改为集合\n\
  * `dict()`: 将任何数据类型更改为字典\n\n清单 2-11 演示了其中一些函数。\n\n```\na = 2\nprint(a)\nfloat(a)\n\
  b = [2 , 3, -1, 2, 4, 3]\nprint(tuple(b))\nprint(set(b))\n第 2 行的输出：2.0\n第 4 行的输出：(2,\
  \ 3, -1, 2, 4, 3)\n第 5 行的输出：(2, 3, 4, -1)\n清单 2-11\n类型转换操作\n```\n\n## 控制流语句\n\n\
  控制流语句允许根据表达式的值执行一条语句或一组语句。控制流语句可以分为三类：*顺序控制流语句*按程序中的顺序执行语句，*决策控制流语句*根据条件为 `True`\
  \ 或 `False` 来执行或跳过一组语句，*循环控制流语句*允许重复执行一组语句直到满足终止条件。\n\n### `if` 语句\n\n决策控制流语句类别中的\
  \ `if` 控制语句以 `if` 关键字开头，后跟条件语句，并以冒号结尾。条件语句计算一个布尔表达式，只有当布尔表达式计算结果为 `True` 时，才会执行\
  \ `if` 语句中的语句体。`if` 块语句从缩进开始，第一个没有缩进的语句标志着块的结束。`if` 语句的语法如下，清单 2-12 展示了它的工作原理：\n\
  \n```\nif <条件>:\n    <语句>\n```\n\n```\nx = 12\ny=8\nif x > y:\nout = \"x is greater\
  \ than y\"\nprint(out)\n输出：x is greater than y\n清单 2-12\nif 语句操作\n```\n\n#### `if-else`\
  \ 语句\n\n`if` 语句后面可以跟一个可选的 `else` 语句。如果 `if` 语句中条件语句对应的布尔表达式为 `True`，则执行 `if` 块中的语句；如果布尔表达式为\
  \ `False`，则执行 `else` 块中的语句。换句话说，`if-else` 语句提供了双向决策过程。`if-else` 语句的语法如下：\n\n```\n\
  if <条件>:\n    <语句>\nelse:\n    <语句>\n```\n\n清单 2-13 展示了 `if-else` 语句的示例代码。\n\n```\n\
  x = 7\ny=9\nif x > y:\nout = \"x is greater than y\"\nelse:\nout = \"x is less than\
  \ y\"\nprint(out)\n输出：\nx is less than y\n清单 2-13\nif-else 语句操作\n```\n\n#### `if...elif...else`\
  \ 语句\n\n`if...elif...else` 语句可以提供多路决策过程。关键字 `elif` 是 `else-if` 的缩写形式。如果需要从多个可能的选择中选取一个，则可以将\
  \ `elif` 语句与 `if` 语句一起使用。`else` 语句将最后出现，作为默认操作。以下是 `if...elif...else` 语句的语法，清单 2-14\
  \ 展示了示例代码：\n\n```\nif <条件 1>:\n    <语句>\nelif <条件 2>:\n    <语句>\nelif <条件 3>:\n\
  \    <语句>\n...\nelse:\n    <默认语句>\n```\n\n```\nx = 4\ny=4\nif x > y:\nout = \"x\
  \ is greater than y\"\nelif x<y:\nout = \"x is less than y\"\nelse:\nout = \"x is\
  \ equal to y\"\nprint(out)\n输出：\nx is equal to y\n清单 2-14\nif...elif...else 语句操作\n\
  ```\n\n### `while` 循环\n\n`while` 和 `for` 循环是循环控制流语句。在 `while` 循环中，会计算条件语句中的布尔表达式。只有当布尔表达式为\
  \ `True` 时，才会执行 `while` 循环中的语句块。循环块的每次重复被称为循环的一次*迭代*。每次迭代后都会检查 `while` 语句中的布尔表达式。循环持续执行直到表达式变为\
  \ `False`，此时 `while` 循环退出。`while` 循环的语法如下，清单 2-15 展示了它的工作原理：\n\n```\nwhile <条件>:\n\
  \    <语句>\n```\n\n```\nx=0\nwhile x < 4:\nprint(\"Hello World!\")\nx=x+1\n输出：\n\
  Hello World!\nHello World!\nHello World!\nHello World!\n清单 2-15\nwhile 循环操作\n```\n\
  \n\n\n"
- "# for 循环\n\n`for` 循环使用一个迭代变量运行，该变量在每次迭代时递增，直到变量到达循环所操作序列的末尾。在每次迭代中，取出序列中与迭代变量所指示位置相对应的项目，并执行循环中的语句。`for`\
  \ 循环的语法如下：\n\n```\nfor <variable> in <sequence>:\n    <statements>\n```\n\n`range()`\
  \ 函数在 `for` 循环中非常有用，因为它可以生成一个数字序列，可以使用 `for` 循环对其进行迭代。`range()` 函数的语法是 `range([start,]\
  \ stop [,step])`，其中 `start` 表示序列的起始位置（如果未指定，则从零开始），`stop` 表示需要生成数字到的值（不包括该数字本身），`step`\
  \ 表示生成的序列中每两个连续数字之间的差值。`start` 和 `step` 值是可选的。`range` 参数生成的值应始终为整数。清单 2-16 展示了一个用于逐个打印字符串中元素的\
  \ `for` 循环。\n\n```python\nx = \"Hello\"\nfor i in x:\n    print(i)\n# Output:\n\
  # H\n# e\n# l\n# l\n# o\n```\n\n**清单 2-16** for 循环操作\n\n清单 2-17 展示了如何使用 `range()`\
  \ 函数打印整数序列。\n\n```python\nfor i in range(4):\n    print(i)\n# Output:\n# 0\n# 1\n\
  # 2\n# 3\n```\n\n**清单 2-17** 使用 range 函数的 for 循环操作\n\n## 异常处理\n\n异常就是在执行过程中检测到的错误。当程序中发生异常时，执行会终止，从而中断程序的正常流程。通过异常处理，可以向用户提供有关错误的有意义信息，而不是系统生成的消息。异常可以是内置的或用户定义的。用户定义的异常是用户创建的自定义异常，可以使用\
  \ `try...except` 语句实现，如清单 2-18 所示。\n\n```python\nwhile True:\n    try:\n       \
  \ n = int(input(\"Enter a number\"))\n        print(\"The number you entered is\"\
  , n)\n        break\n    except ValueError:\n        print(\"The number you entered\
  \ is not the correct data type\")\n        print(\"Enter a different number\")\n\
  \n# Output:\n# Enter a number 5\n# The number you have entered is 5\n# Enter a number\
  \ 3.6\n# The number you entered is not the correct data type\n# Enter a different\
  \ number\n```\n\n**清单 2-18** 异常处理\n\n在清单 2-18 中，当变量接收到不适当数据类型的值时，会发生 `ValueError`\
  \ 异常。如果没有发生异常（即输入的数字是整数），则跳过 `except` 块，只执行 `try` 块。如果在输入不同数据类型的数字时发生异常，则跳过 `try`\
  \ 块中的其余语句，执行 `except` 块，并将程序返回到 `try` 块。\n\n## 函数\n\n函数是 Python 编程中的基本构建块，当需要在程序中多次执行一组语句时可以使用函数。可以通过将这组语句分组并为其命名来创建函数，这样可以在程序的任何部分通过该名称调用这些语句，而无需重复整个代码块。因此，函数可以通过消除冗余代码来减小程序规模。函数可以是内置的或用户定义的。\n\
  \nPython 解释器有许多内置函数，我们已经见过其中一些，如 `print()`、`range()`、`len()` 等。另一方面，Python 允许用户定义自己的函数并根据需要使用它们。函数定义的语法如下：\n\
  \n```python\ndef function_name(parameter1, .... parameter n):\n    statement(s)\n\
  ```\n\n函数名可以包含字母、数字或下划线，但不能以数字开头，也不应与关键字同名。让我们考虑一个简单的函数，它接收单个参数作为输入并计算其平方；请参见清单\
  \ 2-19。\n\n```python\ndef sq(a):\n    b = a * a\n    print(b)\n\nsq(36)\n# Output:\
  \ 1296\n```\n\n**清单 2-19** 平方函数\n\n让我们看一个稍微复杂的函数，它计算给定十进制数的二进制表示。\n\n如清单 2-20 所示，计算十进制数二进制表示所需的五行代码可以通过用户定义的函数替换为一行。\n\
  \n```python\nimport math as mt\n\ndef dec2bin(a):\n    b = ''\n    while a != 0:\n\
  \        b = b + str(a % 2)  # 连接操作\n        a = mt.floor(a / 2)\n    return b[::-1]\
  \  # 反转字符串 b\n\nprint(int(dec2bin(19)))\n# Output: 10011\n```\n\n**清单 2-20** 十进制转二进制函数\n\
  \n"
