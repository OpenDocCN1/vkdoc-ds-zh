  Matplotlib 包还提供了子图选项，可以在单个图形对象中创建子图布局。在这个时间序列数据示例中，我们可以使用一个简单的 `for` 循环来提取 10 年中每一年的数据，并将其绘制在各自的子图中，如下列代码所示：


