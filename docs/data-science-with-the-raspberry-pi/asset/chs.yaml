  此外，如果我们观察所有其他参数，参数`RM`（表示每套住宅的平均房间数）的分布也与目标变量`MEDV`相似。因此，`RM`肯定可以用于对数据集进行建模。此外，参数`DIS`（到五个波士顿就业中心的加权平均距离）和`LSTAT`（人口中低地位阶层的百分比）具有相似的分布。参数`AGE`（1940
