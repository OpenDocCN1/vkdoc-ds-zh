- "# 8. 从数据中学习\n\n从数据中学习，就是提取数据中的信息并用于预测/预报，从而基于这些信息做出明智的决策。这一领域正变得越来越流行，因为它适用于不同行业的各种应用，例如金融、医疗保健、教育、计算机视觉、政治等。\n\
  \n在不需要解析解、对问题没有明确模型或需要基于先前信息进行预测等各种情况下，都会用到从数据中学习。基本上，有三种可用的学习技术：监督学习、无监督学习和强化学习。*监督学习*利用过程的观测数据来开发模型。监督学习模型基于过程的输入和输出观测数据（即输入和输出数据）进行训练。在*无监督学习*中，训练数据不包含任何关于输出的信息。无监督模型根据数据的特征对模型进行分类。此外，无监督模型可用于在数据中寻找模式、通过聚类相似数据检测异常值、发现数据结构等。*强化学习*模型也不利用关于输出的正确信息。然而，它有一些可能的输出，并附带关于输出质量的信息。\n\
  \n本章重点介绍利用波士顿数据集开发学习模型的技术。然后，我们将在 Raspberry Pi 上实现这些学习模型，并分析从传感器获取的工业数据。此实现将作为案例研究在第\
  \ 9 章中讨论。\n\n## 使用回归从数据中进行预测\n\n*回归*用于发现数据集中变量之间的关系。回归用于确定一个变量对另一个变量的影响。此外，它还可以基于变量的历史数据来预测该变量。回归模型可用于许多领域，例如预测经济趋势、预测商业销售额、预测某些政策的影响以及预测医疗保健应用中的血压水平。\n\
  \n在回归分析中，开发模型需要两种变量：输入变量和输出变量。*输入变量*是数据集中用于预测输出变量的变量。线性回归中的输入变量通常表示为`X`。*输出变量*是待预测的变量，表示为`Y`。公式\
  \ 8-1 展示了线性回归的方程。\n\n`Ye = α + βX` … (8-1)\n\n这里，`Ye`是估计的输出变量，`Y`是实际的输出变量，`α`和`β`是线性回归模型的参数。例如，如果我们想购买一台电视并尝试估算其成本（即输出变量），我们会使用诸如电视尺寸之类的输入变量。现在，假设`α`、`β`和`Y`分别（随机地）选定为\
  \ 2、5 和 170 欧元。电视尺寸（即输入变量）为 32 英寸，则用于估算电视成本的线性回归模型的估计输出如公式 8-2 所示。\n\n```\nYe =\
  \ 2 + 5 * 32\n   = 162 欧元\n```\n… (8-2)\n\n因此，根据公式 8-2，当电视尺寸为 32 英寸时，其成本为 162 欧元，这接近电视的实际成本\
  \ 170 欧元。如果我们将参数`α`和`β`分别修改为 0.1 和 0.5，则现在电视的估计成本计算如下：\n\n```\nYe = 0.1 + 0.5 *\
  \ 32\n   = 16.1 欧元\n```\n\n电视的成本急剧变化为 16.1 欧元。这表明`α`和`β`的选择对于预测输出变量至关重要。因此，开发线性回归模型的目标是通过最小化实际输出`Y`和估计输出`Ye`之间的差异来找到`α`和`β`。有许多方法可以找到`α`和`β`的最优参数。然而，普通最小二乘法常用于寻找`α`和`β`的最优参数。\n\
  \nOLS 方法使用输入变量的协方差和方差来识别参数`α`和`β`，如公式 8-3 所示。\n\n```\nβ = Cov(X, Y) / Var(X)\nα\
  \ = Ȳ - βX̄\n```\n… (8-3)\n\n这里，`Ȳ`和`X̄`分别是实际输出变量和输入变量的均值。\n\n现在让我们考虑波士顿数据集。`RM`变量用于表示每套房屋的平均房间数，目标变量（即输出变量）`MEDV`用于表示自住住房的中位数价格（以千计）。我们将`RM`视为输入变量，`MEDV`视为输出变量，用于线性回归建模。由于`RM`和`MEDV`彼此紧密关联，可以使用以下代码实现这些变量的线性回归模型。为了识别`α`和`β`参数，采用了普通最小二乘法。\n\
  \n\n\n```python\nfrom sklearn.linear_model import LinearRegression\nimport matplotlib.pyplot\
  \ as plt\nimport numpy as np\nfrom sklearn.datasets import load_boston\nimport pandas\
  \ as pd\ndataset = load_boston()\nboston_data=pd.DataFrame(dataset.data,columns=dataset.feature_names)\n\
  Target=pd.DataFrame(dataset.target,columns=['target'])\n# two variable for regression\
  \ model\nX1=boston_data['RM']\nX=X1.to_numpy()  # dataframe is converted in to array\
  \ for arithmetic operations\nY=dataset.target\nxmean=np.mean(X)\nymean=np.mean(Y)\n\
  xcov=np.multiply((X-xmean),(Y-ymean))\nxvar=(X-xmean)**2\n# linear regression model\n\
  beta=xcov.sum()/xvar.sum()\nalpha=ymean-(beta*xmean)\nprint(beta)\nprint(alpha)\n\
  ```\n\n采用普通最小二乘法（OLS）得到的 `α` 和 `β` 值如下所示：\n\n```\nBeta value is 9.10210898118031\n\
  Alpha value is -34.67062077643857\n```\n\n利用上述 `α` 和 `β` 值即可构建线性回归模型，如公式 8-4 所示。\n\
  \n`Ye=-34.6706+9.1021*X`    … (8-4)\n\n这里，`X` 是输入变量 `RM`。可以使用以下代码实现该模型：\n\n```\n\
  # prediction model\nye=alpha+beta*X\n```\n\n让我们绘制实际输出变量 `Y` 与估计模型 `Ye` 的对比图，该图能清晰揭示它们之间的关系，可使用以下代码进行绘制（见图\
  \ 8-1）：\n\n![../images/496535_1_En_8_Chapter/496535_1_En_8_Fig1_HTML.jpg](img/496535_1_En_8_Fig1_HTML.jpg)\n\
  \n图 8-1\n\n实际输出变量与估计的线性回归模型对比\n\n```\n# plot\nplt.figure(figsize=(12,6))\nplt.plot(X1,ye)\n\
  plt.plot(X,Y,'ro')\nplt.title('Actual Vs Predicted')\nplt.xlabel('X')\nplt.ylabel('Y')\n\
  plt.show()\n```\n\n### 使用 Scikit-Learn 进行线性回归\n\n在前面的示例中，线性回归预测器仅使用一个输入变量来预测输出。基于给定的线性回归，可以使用多个变量来预测输出（见公式\
