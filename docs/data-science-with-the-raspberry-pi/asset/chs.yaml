  对于 Python 2：


  ```

  sudo pip install Adafruit_DHT

  ```


  对于 Python 3：


  ```

  sudo pip3 install Adafruit_DHT

  ```


  ### 将土壤湿度传感器与树莓派连接


  土壤湿度传感器用于检测土壤中的水分含量。土壤湿度传感器包含两个探针，用于测量土壤中的水分含量。该传感器利用电容测量土壤的介电常数，而介电常数与土壤含水量相关。传感器同时具备模拟和数字输出，因此可在模拟和数字两种模式下使用。但这里，我们将从传感器获取模拟信号，并使用
  Python 读取。图 3-18 展示了土壤湿度传感器。其中，`VCC` 引脚需连接树莓派正极，模拟输出（`AO`）产生一个与土壤介电常数（进而与含水量）成正比的电压，数字输出（`DO`）则在土壤湿度高于阈值时产生脉冲。阈值通过传感器模块上的电位器设定，`GND`
  引脚可连接树莓派的 `GND` 引脚。


  ![../images/496535_1_En_3_Chapter/496535_1_En_3_Fig18_HTML.jpg](img/496535_1_En_3_Fig18_HTML.jpg)


  图 3-18


  土壤湿度传感器


  通过 `MCP3008` ADC 将土壤湿度传感器模块连接到树莓派，如图 3-19 所示。


  ![../images/496535_1_En_3_Chapter/496535_1_En_3_Fig19_HTML.jpg](img/496535_1_En_3_Fig19_HTML.jpg)


  图 3-19


  温湿度传感器与树莓派 GPIO 引脚连接


  接下来，我们使用 `gpiozero` 库中的 `MCP3008` 模块来获取 `MCP3008` 的值。清单 3-6 中的代码每秒连续打印土壤湿度传感器的模拟值。


  ```

  from gpiozero import MCP3008

  from time import sleep

  soil_sensor = MCP3008(0)

  while True:

  print(soil_sensor.value)

  sleep(1)

