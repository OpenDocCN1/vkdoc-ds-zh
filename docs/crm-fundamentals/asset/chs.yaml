- '# 关于技术审校


  ![图片](img/square.jpg) 汤姆·麦金尼是一位经验丰富的 CRM 顾问和项目经理，在转入咨询行业之前，曾在包括 Nextel Communications
  和微软公司在内的《财富》500 强公司担任高级职位。他的咨询客户涵盖了广告、信息技术、建筑和制造业等行业的各种中小型和大型企业。他喜欢与家人在美丽的华盛顿州享受游船和山地自行车运动。


  ## 引言


  阅读本书的许多人即将踏上在组织内实施客户关系管理（CRM）软件的旅程；有些人对 CRM 完全陌生，而另一些人则已多次实施 CRM，成功程度各不相同。本书旨在为业务领导者和利益相关者提供一本实用的执行手册，详细阐述成功实施
  CRM 项目和计划的方法。


  人们常常认为 CRM 的成功始于并止于购买市场上当前流行的应用程序；然而，无论使用何种应用程序（即使它拥有所有炫酷的功能），你仍然需要进行艰难的讨论：你的组织应该如何架构，面向客户的流程应该是什么样子，以及所有流程应如何在系统中实现，以便有效地利用应用程序的所有优秀特性。CRM
  很容易做得很糟糕，许多人未能从投资中获得价值；事实上，当我们接触一个已有 CRM 系统的现有客户时，我们观察到的最常见的痛点是由软件实施不当（而非软件本身）造成的。请不要误会——技术当然参与其中并会影响设计考量，你选择的软件会有一定的优势，也存在局限性。但在阅读本书的过程中，要记住的关键一点是，参与的利益相关者、业务流程讨论以及建模和设计决策，与软件本身同等重要，甚至更为重要。


  本书的目标是帮助你理解在启动 CRM 计划时真正需要面对什么：达到有效运营所需的工作量，以及通过 CRM 可以合理期望实现什么。这不是一份关于 CRM 项目的理想化“空中楼阁”式展望，而是一本“脚踏实地”的指南，旨在为你提供一种创建有效
  CRM 项目的现实方法。许多 CRM 书籍侧重于各种系统的技术细节；然而，本书与技术无关，而是侧重于利用 CRM 概念来规划、组织和为你的组织交付价值所必需的业务组件。你在
  CRM 上投入了大量资金和组织的宝贵时间，因此我们的目标是帮助你从这项投资中获得最大回报。最终，你将掌握适当的技能和工具来组建团队、规划总体计划和具体迭代，并在关注长期战略的同时，驾驭
  CRM 项目的起起伏伏。


  我们希望你喜欢这本书，并能在通往 CRM 成功的道路上运用书中概述的许多技巧！


