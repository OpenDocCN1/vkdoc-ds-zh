- "# 第 1 章\n\n## 引言\n\n### 定义 CRM\n\n对于企业而言，世界正以无情的速度变得越来越充满竞争。技术创新降低了准入门槛，曾经专业化的产品和服务变成了商品，每个市场都突然变得拥挤不堪。客户体验作为差异化因素对企业越来越重要；与此同时，客户本身也变得更加成熟、要求更高、忠诚度更低。\n\
  \n为了成功，企业需要比竞争对手更高效地运营，员工必须更有生产力和效率，产品和服务必须更紧密地贴合客户需求。他们必须做出更多“正确”的决策，并且必须更快地做出这些决策。这种高水平的绩效需要信息——关于业务运营、关于现有客户和潜在客户、以及关于竞争对手的信息。\n\
  \n为了应对这些趋势，企业加强了对客户的关注——在决策中更频繁地审视客户视角，调整业务流程和组织以提供更好的客户体验，并通常更周到、更审慎地管理客户信息和关系。软件工具应运而生，以支持企业这种对客户和客户管理的新关注。这种加强客户关注的商业策略以及为支持它而出现的业务应用类别，都被称为“客户关系管理”（CRM）。在本书中，我们将使用“CRM\
  \ 计划”来描述企业为加强客户关注而部署的人员、流程和技术，而“CRM 应用程序”则用来描述技术元素，通常以一个 CRM 软件包为核心。我们将在下一章详细探讨计划的不同要素。\n\
  \n\n\n### 本书目的\n\n本书旨在为任何负责领导或参与所在组织 CRM 项目的人提供参考。我们的目标是让读者对 CRM 的价值有扎实的理解，概述构成成功\
  \ CRM 项目的要素，并详细说明成功启动 CRM 项目所需的步骤。我们特意避免深入探讨具体的 CRM 应用程序或 CRM 的技术元素。市面上已有大量书籍详细介绍各种\
  \ CRM 应用程序的方方面面，可以帮助你的管理团队提高效率。我们想写一本这样的书，为不懂技术的管理人员提供信息，帮助他们整合 CRM 项目的各个部分，避免常见的陷阱，并选择合适的应用程序和咨询合作伙伴来协助他们。\n\
  \n本书内容大致按照实际应用的顺序组织。第二章阐述了构成一个完整且成功的 CRM 项目的要素，以便你了解各个组成部分及其如何协同工作。第三章指导你如何构建路线图——即实施\
  \ CRM 的计划，包括项目目标和实施时间表。第四章涵盖了为你的组织选择合适 CRM 应用程序和咨询合作伙伴的流程。第五章 详细介绍了规划路线图实施的细节，第六章\
  \ 则涉及各个 CRM 项目的执行。最后，第七章 描述了维护和发展 CRM 的策略。\n\n### CRM 价值的来源\n\n既然我们已经明确了“CRM”的含义，并提供了本书的高层概述，接下来让我们探讨一个企业或任何组织为何会启动这样一个项目。CRM\
  \ 的价值何在？\n\n#### 支持数据驱动型学习型组织\n\n一套有据可查、持续执行的流程与一个支持、监控并报告这些流程的业务应用程序相结合，为敏捷、学习和发展的组织奠定了基础。这种敏捷性可以帮助你在竞争中保持领先一步。除了在帮助用户高效执行业务流程方面发挥直接作用外，CRM\
  \ 应用程序的报告和仪表板还充当着组织的“仪表盘”——通过让你持续评估哪些有效、哪些无效，检验假设并尝试改进，然后基于结果做出数据驱动的决策，从而支持敏捷性。\n\
  \n思考一下与一位销售主管的以下对话：\n\n> *CRM 顾问*：你知道客户为什么从你这里购买产品吗？\n> \n> *经理*：我大概知道一些。他们购买是因为客户服务好，而且我们的产品更出色。\n\
  > \n> *CRM 顾问*：你是怎么知道的？\n> \n> *经理*：通过和一些客户的交流。\n> \n> *CRM 顾问*：你知道对于不同的客户，这些因素中哪一个最重要吗？\n\
  > \n> *经理*：不，我想我不知道。\n> \n> *CRM 顾问*：你知道你最常输给谁，以及原因吗？\n> \n> *经理*：我有个想法，但同样没有实证数据支持。\n\
  \n这是一个组织在尝试实施 CRM 项目未成功或根本未尝试时的相当常见的互动。如果我们询问关于销售管道可见性、销售周期时长、输单分析或客户服务查询数据（查询需要多长时间解决，首次呼叫解决多少等）时，我们也会得到类似的回答。你听过那句古老格言“*你无法管理你无法衡量的东西*”——一致的流程和一个成熟的\
  \ CRM 应用程序可以为衡量和管理提供所需的平台。\n\n#### 消除低效，提高员工生产力\n\n了解你当前的流程是开始分析 CRM 应用程序可能带来的改进的第一步。整本书都在专门讨论流程定义和改进，因此我们不会在本书中深入探讨这些主题；我们的目标是展示一个\
  \ CRM 系统如何通过正确的分析和实施，帮助在你的流程中创造效率。\n\nCRM 带来效率提升的几个例子包括：\n\n*   **改善潜在客户管理**，通过将来自网站联系表单的线索直接输入\
  \ CRM 中相应销售团队的工作队列。\n*   **自动分配** 入站的潜在客户给合适的销售代表，依据是地理位置、类别等。这种自动分配能更快地将线索交到销售代表手中。\n\
  *   **自动升级或重新分配服务问题**，基于定义的标准，如优先级、问题类型、存在时间、类别等。这带来了更高效的问题管理和改善的客户体验。服务问题不再能“被遗漏”。\n\
  *   **在大额销售交易上提醒管理层**——当销售交易超过某个收入门槛时，CRM 应用程序可以自动提醒销售领导团队，以便他们能够看到该交易并协助客户团队。\n\
  *   **CRM 的商业智能元素** 可用于对已成功转化为客户的线索进行画像，然后对入站线索进行评分，以帮助销售团队成员优先安排电话，专注于与过去成功线索最相似的线索。\n\
  *   **在 CRM 内管理报价生成**，确保销售代表创建有效的报价（包括必要且兼容的组件/产品），并确保所有代表使用正确的定价和最新的产品可用性信息。这减少了新销售团队成员的上手时间，并大幅降低无效报价的频率。\n\
  *   **关联与客户的所有互动**（电话、重要电子邮件、电子邮件通讯、参加展销会等），以分析销售驱动力、赢单或输单原因、重复业务等。\n\n##### 案例研究：CRM\
  \ 增强的销售流程\n\n在这个组织中，销售团队使用 Excel 电子表格向客户发送提案。这些电子表格包含产品信息（名称、价格、依赖关系），因此当产品变更推出时，需要向所有销售人员发送新的电子表格“模板”。这个过程存在很大的出错风险：\n\
  \n*   **销售人员可能会错误地使用旧版本的电子表格。**\n*   **销售人员可能会修改（而且经常修改）Excel 模板以满足自己的需求，而未经经理、财务、产品开发等部门的批准——这可能导致销售无法履约的产品、不符合公司规定等。**\n\
  \n为了了解整个组织的销售预测情况，这个过程还意味着销售人员需要负责将他们的提案信息输入一个单独的数据库。重复录入是一个大问题，因为：\n\n*   **数据录入错误使得预测变得困难。**\n\
  *   **销售人员电子表格中更新的数据并不总是能在预测数据库中更新。**\n*   **销售人员通常等到交易接近成交时才将交易录入预测数据库，以避免在那些没有进展的交易上浪费精力。这导致了组织预测不准确。**\n\
  \n解决方案是推出一款 CRM 应用程序和新的预测流程来捕获销售信息。新的解决方案减少了销售团队的数据录入工作，提高了预测准确性，并包含了报价生成工具，增强了管理层对报价的控制。其他一些运营数据库也被整合到\
  \ CRM 解决方案中，以便运营人员能够从销售信息中受益，并在售后关键交接环节与销售团队更好地协作。\n\n\n\n#### 提供更佳的客户体验\n\n为客户提供最满意、最高效的互动体验，已成为日益重要的差异化竞争优势。如今的客户忠诚度远不如从前——他们往往只需花几分钟在网上搜索，就能找到你的产品或服务“更好”的替代方案。此外，博客、评分网站和社交媒体等技术工具，也放大了消费者“口碑”传播的规模和影响力，使得积极的客户体验变得愈发重要。\n\
  \n客户对“可接受的互动体验”的期望值在不断演变，如今至少包含以下几点：\n\n*   与他们互动的每位客服代表都应能查阅贵组织与客户过往的所有互动记录，涵盖从购买到服务的各个环节。拨打服务电话的客户不应为了查找上次与贵组织沟通的信息而被迫转接多次。\n\
  *   应提供自助服务选项，让客户能够全天候（每周 7 天，每天 24 小时）自行获取信息或发起基本交易。\n*   贵组织应通过客户偏好的任何渠道（电子邮件、电话、短信等）与他们进行沟通。\n\
  \n只需考察一下零售银行业务，就能轻易了解客户对互动的期望发生了怎样的变化。就在不久之前，所有零售银行业务还都是在银行的“营业时间”内，由柜员在分行网点内办理的。随着时间的推移，该行业推出了一项又一项创新，为客户提供了越来越好的体验（同时往往也降低了成本）。先是推出了免下车银行服务，然后是自动取款机，再后来是网上银行。在此过程中，一些银行开始延长营业时间，以提供更多便利。而现在，已有好几家银行允许你通过手机进行交易，并通过短信向你发送余额更新信息。\n\
  \nCRM 程序能以多种方式支持贵组织满足这些期望的努力：\n\n*   从客户角度对与 CRM 程序相关的业务流程进行评估，可以带来改善客户满意度的变革。\n\
  *   CRM 应用程序作为客户信息的中央枢纽，由所有面向客户的员工共享，帮助每位员工在客户面前展现出信息充分、令人信赖的形象。\n*   CRM 应用程序的工作流自动化功能可提供一个平台，根据事件自动向客户发送通信信息。\n\
  *   CRM 应用程序可作为客户网络门户的数据存储库，从而实现自助服务。\n*   对 CRM 应用程序进行数据挖掘，可以根据客户档案识别出他们可能感兴趣的产品、服务和促销活动。\n\
  \n#### 为业务决策提供信息\n\n您的 CRM 程序提供了一个收集客户信息的平台，并使这些信息能够轻松提供给业务领导者进行审查和分析。过去那些依赖传闻证据，或需要经过漫长而艰巨的数据收集和汇总才能做出的决策，如今可以轻松地通过\
  \ CRM 应用程序中的相关信息得到支持。可以从中获得关于组织及其客户的全新洞察，发现新的机遇或竞争威胁。\n\nCRM 数据有助于为决策提供信息的一些常见领域包括以下内容，以及每个领域可能回答的问题：\n\
  \n> 销售预测\n> \n> 我们本月/季度能否实现收入目标？销售额将如何在不同区域和产品线之间分布？\n> \n> 销售管理\n> \n> 我的销售人员表现是否达标？他们在完成交易和开发潜在客户之间是否合理分配了时间？我的销售管道健康状况如何？他们正在丢失哪些交易，原因是什么？\n\
  > \n> 产品规划\n> \n> 不同类型的客户在购买哪些产品？他们会同时购买哪些产品？我们每条产品线的主要竞争对手是谁，他们在什么情况下会取胜？为什么有些产品收到的客户服务咨询比其他产品多？\n\
  > \n> 客户服务人员配置\n> \n> 我的问题处理量随时间如何变化？人员配置水平如何影响问题解决时间？互动或升级的数量是否随时间减少？\n> \n> 营销活动规划\n\
  > \n> 过去哪些潜在客户来源最有效？成功潜客的特征是什么？哪些类型的营销活动能激发最大兴趣？\n\n除了提供一套静态指标来监控业务的持续健康状况和绩效外，CRM\
  \ 程序还可以在业务规划中发挥积极作用。\n\n近年来社交媒体工具使用率和重要性的提升，可以使 CRM 成为一个更有用的平台，用于了解客户并为业务决策提供信息。随着越来越多的客户通过博客、Facebook\
  \ 和 Twitter 等工具分享他们的意见、需求、喜好和厌恶，我们可以整合更多的此类数据，以丰富存储在 CRM 应用程序中的客户和市场档案。如今，已有许多工具和服务能够挖掘这些信息并将其整合到\
  \ CRM 应用程序中。除了这种被动的信息收集角色外，贵组织还可以主动利用这些社交媒体工具，使用客户正在使用且偏好的工具，与客户开辟新的沟通渠道。这些新渠道可用于发布公司最新动态、提供促销活动以及收集反馈。\n\
  \n### 为 CRM 做准备\n\n\n\n## 为组织变革做好准备\n\n在启动新的 CRM 计划之前，为组织变革做好准备是 CRM 成功的重要推动因素。变革（即便是朝着更好的方向）往往都会遭遇阻力，因为人们对自己现有的流程感到舒适。周密的准备可以消除这种阻力，帮助员工看到变革的积极面，并从容应对新流程和新应用带来的不可避免的突发问题。那么，如何恰当地让组织为变革做好准备呢？根据我们的经验，以下主要组成部分已被证明是行之有效的：\n\
  \n> **数据驱动文化**\n>\n> 追求数据驱动文化意味着将流程文档化，收集有关其有效性的数据，基于数据做出改变，然后再根据数据评估变革的成功与否。整个过程应在可行范围内进行沟通。这种变革方法将帮助员工了解哪些情况会被识别为潜在的变革点，变革如何制定，以及这些变革的有效性如何衡量。这种有条不紊的方法会让人相信变革并非随意之举；变革是基于重要的业务目标而进行的，并且会对其成功与否进行严格评估。其结果是形成一个更乐于接受变革、更愿意支持变革的员工群体。显然，CRM\
  \ 计划的部分目的是为数据驱动文化建立一个框架——但尽可能在启动 CRM 项目之前就培养这种文化，将大有裨益。\n>\n> **高管支持**\n>\n> 获得高管对整个实施过程，尤其是对其所带来的变革的支持，对于计划的成功至关重要。高管需要充分参与，以便能够指导决策，并传达实施项目的愿景及其预期收益。\n\
  >\n> **沟通**\n>\n> 沟通至关重要，这样人们才能知道将要发生什么，从而为即将到来的变革做好准备。首先制定一个类似于图 1-1 的沟通计划非常重要，该计划需要明确谁需要什么信息、何时需要、他们如何提供反馈、谁负责传递信息以及使用什么渠道。\n\
  \n![图片](img/0101.jpg)\n\n***图 1-1.** 示例项目沟通计划*\n\n> **培训**\n>\n> 显然，培训是任何技术实施的一部分；然而，在规划你的项目时，有几个关键点需要留意。尽早并经常进行培训有助于员工适应新技术和新流程，从而减少阻力。\n\
  >\n> **反馈**\n>\n> 至关重要的是，人们需要有一种方式来表达新技术/流程对他们的工作生活产生了何种影响（积极或消极的）。当然，你无法处理每一条反馈（也无法完全按照个人期望的方式处理），但仅仅承认、考虑并以非常诚实的方式解释这些反馈这一事实本身，就能在很大程度上促使员工接受变革。\n\
  >\n> **认可**\n>\n> 表彰那些在履行职责过程中正确使用 CRM 系统的员工，可以为其他人树立积极的榜样。这不仅奖励了期望的行为，还能展示这些人在其工作职责中（如节省时间、减少数据录入等）获得的好处。认可个人的一些好方法包括：由项目“倡导者”向团队发送电子邮件、给予小额激励奖励（如礼品卡），以及在团队会议上特别提及。\n\
  \n## 章节总结\n\nCRM 是一种战略，旨在加强对客户关系的开发、维护并从其中获取最大价值。你的 CRM 计划包括人员、业务流程和技术组件。\n\n本书旨在为非技术背景的业务主管提供必要的信息，以成功规划和启动\
  \ CRM 计划。\n\n一个实施良好的 CRM 计划能带来诸多价值，包括提高员工生产力与效率、改善客户体验、增强业务洞察力，以及培养数据驱动的学习文化。\n\n\
  让组织为吸收变革做好准备，是使你的 CRM 计划启动更成功的基础工作。\n\n"
- "# 第 2 章\n\n## CRM 成功的组成部分\n\n一个成功的 CRM 计划提供了帮助组织持续改进和优化其获取及服务客户方式的平台。商业世界日益激烈的竞争会奖励那些了解客户、并能迅速采取行动抓住机遇、应对挑战的组织。\n\
  \n强调我们使用“*计划*”（program）这一术语很重要；CRM 的成功远不止购买并安装一个 CRM 应用程序那么简单。CRM 计划的核心是持续审视和演变你的客户互动，以提供更好的客户体验，并帮助组织实现其与客户相关的目标。CRM\
  \ 应用程序本身只是用来交付卓越客户体验、简化面向客户的操作、并深入了解客户和业务的工具。\n\nCRM 计划的成功建立在四大支柱之上：让组织中合适的*人员*在\
  \ CRM 计划中扮演正确的角色，实施精心设计的内部和面向客户的*流程*，实施正确的支持性*技术*，并为成功的样子以及实现成功所需的努力和成本设定合理的*期望值*。让我们依次审视每个组成部分。\n\
  \n### 人员\n\n你的 CRM 计划将需要来自组织不同部门的人员扮演不同的角色。职位头衔和要求将取决于组织，但对于大多数组织而言，要实现成功的 CRM 实施，应分配以下角色。\n\
  \n##### 执行发起人\n\n执行发起人是最终对组织内 CRM 计划成功负责的高级管理人员，并负责以下事项：\n\n- 为 CRM 计划争取必要的资金。\n\
  - 指导 CRM 路线图的持续制定过程，确保路线图与组织的战略目标紧密对齐。路线图制定将在第 3 章中详细描述。\n- 确保需要为 CRM 计划做出贡献的组织内不同部门在管理层面上有所参与。\n\
  - 为 CRM 计划设定目标，并对个人和团队进行问责。\n- 作为组织内 CRM 相关问题的最终决策者。\n\nCRM 执行发起人的重要资质包括：\n\n- 必须是\
  \ CRM 的“信徒”。他的语气、参与度和热情都会对 CRM 计划产生巨大影响。\n- 应熟悉组织中面向客户部门的人员和流程。财务或 IT 高管并非此角色的理想人选。\n\
  \n员工会追随他们的领导者；执行发起人对 CRM 频繁、大声且充满热情的专注，将向整个组织传达出 CRM 是其“DNA”的一部分，每位员工都需要确保对其给予优先关注。除了这种布道，高管还需要让每一层管理层对其部门的\
  \ CRM 成功负责。\n\n\n\n## 指导委员会\n\n指导委员会是组织内指导 CRM 项目的关键机构。它应由您的执行发起人主持，并包括来自所有关键 CRM\
  \ 相关群体（例如，内部销售、外勤销售、客户服务和市场营销）以及 IT 部门和 CRM 管理团队的代表。委员会应定期召开会议；会议频率需根据实际情况而定。\n\n\
  指导委员会的职责包括：\n\n-   管理生产环境 CRM 应用的持续变更控制流程。此流程用于对 CRM 应用的配置变更进行正式评估和批准。在 CRM 上线后，用于确保提议的变更不会干扰任何群体对\
  \ CRM 的使用，并与整体 CRM 路线图保持一致，同时将这些变更传达给各 CRM 相关方。开发并实施变更控制流程详见第 6 章。\n-   制定并维护组织的\
  \ CRM 路线图。该路线图描述了随时间推移增强 CRM 项目的计划，以及这些增强如何支持组织的战略目标。路线图可能描述要添加到 CRM 的新功能、要迁移到应用的新用户组，或者要实施并使用\
  \ CRM 支持的新业务流程。路线图制定的详细内容见第 3 章。\n-   基于路线图规划 CRM 的预算需求。\n\nCRM 指导委员会成员的重要资质包括：\n\
  \n-   能够准确地向指导委员会代表其所在群体的需求。\n-   能够理解指导委员会提出的 CRM 项目变更将如何影响其所在群体。\n-   能够投入足够的时间充分参与委员会的各项活动。\n\
  \nIT 代表可以帮助告知委员会可能影响 CRM 项目的计划内 IT 举措，并协调 IT 组织为 CRM 应用提供的支持。对于软件即服务（SaaS）应用，此角色的重要性较低，因为\
  \ IT 部门对这些应用的责任通常很小或不存在；而对于本地部署的 CRM 应用，此角色则更为关键。\n\nCRM 管理团队负责管理 CRM 路线图的执行、CRM\
  \ 应用的增强以及用户的培训和支持。他们通常是应用专家，并可以帮助确定如何利用该应用来实现指导委员会确定的业务目标。\n\n#### 实施团队\n\n负责 CRM\
  \ 项目初始推广的实施团队的组成，将根据您组织的复杂程度以及初始实施项目而有所不同。在本节中，我们将描述实施团队中的关键角色；在许多情况下，一个人可能会扮演多个角色。\n\
  \n##### 执行发起人\n\n发起人的角色已在前面描述过，与整个 CRM 项目一样，此人也负责初始实施的成功。通常，发起人希望及时了解项目的状态和进展，并通过清除官僚障碍、鼓励公司内部参与来协助实施团队，以支持实施的成功。\n\
  \n##### 项目经理\n\n初始 CRM 实施是一项复杂的工程，需要来自众多部门的输入，并可能改变组织所有面向客户的员工的行为和流程。专职的项目经理对于规划项目、确保项目按时进行以及在整个过程中保持沟通至关重要。\n\
  \n##### 主题专家\n\n主题专家是团队中对受 CRM 影响的业务领域有深刻理解的人员，他们将指导流程设计和 CRM 应用设计，以实现项目目标。例如，对于一个以销售为重点的项目，主题专家团队可能包括销售总监、一位经验丰富的外勤销售代表和一位经验丰富的内部销售代表。重要的是，主题专家要了解当前的“一线”情况（当前流程和正在使用的工具）以及更宏观的图景——他们所在领域对于\
  \ CRM 的长期组织愿景，以及有助于实现该愿景的近期项目目标。\n\n一些组织倾向于不让个人用户/贡献者（例如，前面例子中的销售人员）参与流程，原因可能是担心他们投入项目时间会影响其生产力，或者是担心他们无法从“大局”角度思考并做出贡献。根据我们的经验，这是一个严重的风险。通常，尤其是在较大的组织中，高管们并不充分了解组织基层（实际发生客户互动的地方）的真实运作情况。如果他们是在流程和应用设计中提供意见的唯一声音，那么当前的流程和工具与新的\
  \ CRM 解决方案之间可能会出现难以弥合的鸿沟。\n\n##### IT 代表\n\n通常，CRM 项目的推广包含重要的技术组成部分：一个新的 CRM 应用、对现有\
  \ CRM 应用的一系列修改、用于简化运营的新应用集成，或新的报告和分析工具。因此，将 IT 部门纳入项目团队非常重要。他们在项目中的职责可能包括采购和维护服务器硬件、更新客户端机器、协助咨询团队进行网络和服务器访问，以及可能进行一些开发和测试工作。对于本地部署，IT\
  \ 组织还将负责灾难恢复计划和应用备份。\n\n##### 用户培训师\n\n初始 CRM 实施项目的一个重要组成部分是用户培训。项目团队中的培训师需要向用户传达，他们的工作流程作为项目的一部分将如何改变，以及应如何使用新的技术工具来支持这些新流程。一些组织设有专门的培训部门，而另一些组织则从被培训的部门抽调培训师；实施团队中的主题专家最终往往需要为其所在小组扮演培训师的角色。\n\
  \n##### 部门倡导者\n\n“倡导者”是受 CRM 影响的每个员工群体中的关键联络人。他们通常接受了额外的培训，并可能参与了设计流程，负责帮助推动其所在小组内\
  \ CRM 流程和工具的成功应用与推广。倡导者充当 CRM 应用及 CRM 相关流程的一线用户支持，并在项目启动后作为 CRM 实施团队的“眼睛和耳朵”，发现摩擦点和问题。他们在“宣传”新流程和工具方面也扮演着关键角色。\n\
  \n##### 咨询合作伙伴团队\n\n如果您聘请了咨询合作伙伴来协助您，他们的项目负责人和项目顾问将在实施过程中发挥关键作用。通常情况下，合作伙伴的项目负责人和您组织的项目经理将携手合作来管理项目。\n\
  \n\n\n#### 部门支持者\n\n这些支持者，如先前所述，是在组织中参与客户流程的各个团队内工作的一群人，他们充当着团队与 CRM 指导委员会及 CRM\
  \ 管理团队之间的持续沟通桥梁。这些支持者通过以下方式为您的 CRM 项目带来巨大价值：\n\n- 协助员工培训与指导，包括分享围绕 CRM 应用使用的最佳实践\n\
  - 将所在团队员工关于流程和应用的反馈传达给 CRM 指导委员会和/或管理团队\n- 积极发声支持 CRM；因此，挑选那些被视为各部门领导的人选会很有帮助\n\n\
  支持者在各自部门扮演着 CRM 项目“耳目”的角色。他们能观察到面向客户的员工实际如何使用该应用，从而了解哪些方面运行良好，哪些方面存在问题。他们是流程与应用改进创意的绝佳来源，并且能在基于对流程运作方式的错误假设而制定计划时，提醒整个\
  \ CRM 团队。此外，在帮助本部门为流程与应用变更做好准备方面，他们也发挥着重要作用。\n\n#### CRM 管理团队\n\nCRM 管理团队肩负两大使命。第一是持续、定期地维护\
  \ CRM 项目；这包括多种任务，例如：\n\n- 为 CRM 应用提供最终用户支持。有时 IT 部门内设有提供基础、“一级”支持的集中式服务台，但即便如此，CRM\
  \ 管理团队在更复杂的问题上仍需担当升级支持的角色。可能还存在一些更复杂的常规任务，用户需要协助，例如数据加载、群发邮件和复杂查询。\n- 维护 CRM 应用的运行状况。同样，根据您\
  \ IT 部门的架构，某些任务可能由 CRM 管理团队之外的人员处理，但这些任务包括：为 CRM 应用及底层操作系统和数据库软件应用软件更新，确保应用在本地和异地都定期备份，以及准备和演练灾难恢复。如果您使用的是软件即服务应用，则无需这些任务。\n\
  - 管理 CRM 应用中的用户，包括为新员工创建账户、为离职员工停用账户，以及在员工调岗或变更角色时调整安全访问权限。\n\n第二大使命是识别、规划并实施对 CRM\
  \ 流程和应用的增强。这些增强可能由用户提出，并作为第 6 章概述的常规 CRM 变更控制流程的一部分来处理，也可能是 CRM 路线图的一部分。CRM 路线图是\
  \ CRM 项目发展的阶段性计划，该计划始终在演进。如何制定和维护 CRM 路线图将在下一章讨论。这些增强的范围可以从相对较小（在 CRM 应用的对象中添加字段，或自动化邮件通信以平滑流程中团队间的交接）到意义重大（如将新部门纳入\
  \ CRM 项目）。\n\n以下部分角色可能由 IT 部门的成员担任。如果并非如此，特别是当您的 CRM 应用由公司自行托管时，CRM 管理团队中最好有 IT\
  \ 部门的代表，即使他们只是作为“虚拟”团队成员，了解 CRM 管理团队的工作动态。\n\n##### CRM 项目负责人\n\nCRM 项目负责人是 CRM\
  \ 项目的总体项目经理和协调者。此人负责管理 CRM 的日常维护以及增强流程（常规变更控制和路线图执行）。此人的关键技能包括：\n\n- 强大的项目管理技能\n\
  - 了解组织中面向客户的部分，并对面向客户的员工有同理心\n- 能够自如地在高管层面进行沟通\n- 拥有管理技术系统、供应商和软件开发人员的经验\n\n#####\
  \ CRM 业务分析师\n\nCRM 业务分析师的职责是结合三种理解，来帮助定义一个使组织更高效并实现其业务目标的未来状态。第一种理解是员工目前的工作方式，第二种是组织的\
  \ CRM 目标，第三种是对如何配置和定制 CRM 应用的深入理解。结合这些，业务分析师可以概述如何修改给定的工作流程及支持的 CRM 应用，以使组织更成功。\n\
  \nCRM 业务分析师的关键技能包括：\n\n- 流程设计/再造经验\n- 技术系统需求收集经验\n- 为软件应用制定功能规格说明的经验\n- 对所选 CRM\
  \ 应用的深入理解和经验\n- 对 CRM 应用所支持业务流程的深入理解\n\n##### CRM 管理员\n\nCRM 管理员是维护和修改 CRM 应用的核心人物，并且，除了接下来描述的\
  \ CRM 开发人员外，通常是 CRM 管理团队中技术性最强的成员。此人处理用户支持问题，维护应用健康，管理用户，并根据需要进行配置更改。此外，此人通常还管理数据导入和任何产品附加组件的安装。\n\
  \nCRM 管理员的关键技能包括：\n\n- 管理基于企业数据库应用的经验（仅限本地部署 CRM 需要）\n- 对所选 CRM 应用的深入理解和经验\n\n#####\
  \ CRM 开发人员\n\n大多数 CRM 应用可以通过一套不需要深厚技术技能的配置工具进行有限的修改。然而，在大多数情况下，实现定制的业务逻辑以支持组织的特定业务流程、构建与其他应用的集成，或开发高度定制的报告，都需要编程。因此，具有显著复杂性的组织应考虑在\
  \ CRM 管理团队中配备一名软件开发人员。\n\n所需的具体技能和经验将由组织选择的 CRM 应用决定。\n\n##### CRM 培训师\n\n培训是 CRM\
  \ 项目中的一个持续过程。新员工加入组织，CRM 流程和应用的增强都需要对现有员工进行持续培训。通常，这种培训在部门内部进行，往往由前面提到的部门支持者负责。然而，规模较大的组织可能会在\
  \ CRM 管理团队中设置一名培训师。这些专职培训师与部门支持者合作，共同制定培训材料和课程。重大的应用或流程变更也可能需要 CRM 管理团队介入，为员工提供培训，而非在部门内部处理。\n\
  \n\n\n#### 让团队成员适配你的组织\n\n用“角色”来命名这一部分可能比“人员”更贴切。我们概述了实现 CRM 项目成功所需的一系列角色。具体由哪些人员来承担这些角色，很大程度上取决于你的组织以及\
  \ CRM 项目的范围。举两个例子或许能帮助说明：\n\n> **示例一：**\n> \n> 假设一家小企业希望利用 CRM 来提高销售部门的效率和透明度。\n\
  > \n> *CRM 管理员/CRM 培训师*：苏珊（信息技术部）\n> \n> *CRM 执行发起人*：阿尔伯特（总裁）\n> \n> *销售部门倡导者/CRM\
  \ 项目负责人/CRM 业务分析师*：简（销售总监）\n> \n> *指导委员会*：阿尔伯特、简、苏珊\n> \n> 在这个例子中，苏珊处理所有与 CRM 应用相关的技术任务：支持、维护、用户管理和配置。简是\
  \ CRM 项目的推动者；她管理 CRM 路线图，确保销售人员采用流程和应用，并寻找利用 CRM 解决业务问题、改进客户流程的新机会。阿尔伯特担任执行发起人；他与简一起处理预算问题，与\
  \ CRM 供应商谈判等。该团队没有开发技能，当需要开发时，会寻求外部顾问的帮助。\n> \n> **示例二：**\n> \n> 假设一家拥有全球员工的大型组织，在其庞大的销售部门和小型客服部门中使用了\
  \ CRM 流程和应用。\n> \n> *CRM 管理员*：彼得（应用分析师）\n> \n> *CRM 开发人员*：亚瑟（应用开发人员）\n> \n> *CRM\
  \ 项目负责人/CRM 业务分析师*：黛安（销售运营经理）\n> \n> *CRM 执行发起人*：莱斯利（首席运营官）\n> \n> *销售部门倡导者*：汤姆（内部销售总监）、安妮（美国区域客户经理）、理查德（英国区域客户经理）、丽莎（拉丁美洲区域销售经理）\n\
  > \n> *客服部门倡导者*：厄尔（客服代表）\n> \n> *指导委员会*：莱斯利、黛安、弗兰克（销售副总裁）、吉尔（客服副总裁）、罗宾（信息技术总监）、菲利普（市场营销副总裁）\n\
  > \n> 这个更大的组织需要一个更大的团队。技术任务由彼得和亚瑟分担。黛安是整体项目的推动者；她的销售运营背景是理解销售团队工作方式以及如何最佳改进的重要资产。更大的组织意味着需要更多的倡导者，以确保一线员工有充分的代表性和覆盖。由于内部有开发人员（亚瑟），该组织相对自给自足，通常不需要聘请外部咨询合作伙伴。\n\
  \n这两个例子凸显了在将组织中的人员映射到 CRM 项目角色时需要注意的几个重要准则：\n\n*   确保指导委员会包含所有面向客户部门的代表。注意，在示例二中，即使该组织目前仅在销售和客服部门使用\
  \ CRM 应用，指导委员会中仍有一位市场营销部门的高管。\n*   对于员工地域分布广泛的组织，确保不同地区在 CRM 项目中有代表。否则，某些地区的员工可能会觉得不适合他们的流程和应用被强行推行，而他们在过程中没有发言权。注意，在示例二中，销售部门的倡导者来自不同地区。\n\
  *   一人承担多个角色是例外，而非惯例，尤其是在较小的组织中。在示例一中，简是项目的核心，负责多个不同角色。角色如何在团队中分配将取决于每个成员的技能、经验和兴趣，以及你项目的性质和范围。\n\
  \n### 流程\n\n我们将分两部分讨论 CRM 流程。第一部分将讨论你的组织已在面向客户的部门中实施的运营流程。这些始终是 CRM 项目的焦点；组织启动 CRM\
  \ 项目是为了产生一系列与客户相关的结果，而 CRM 项目则通过改进或重塑其业务流程来实现这些结果。第二部分将回顾为管理 CRM 项目本身而需要建立的新流程，具体指持续的维护和增强流程。\n\
  \n#### 运营流程\n\n每个组织及其流程都是独一无二的，这使我们无法就你自己的运营流程应该是什么样子或应该做哪些更改提供具体的模板或指导。然而，根据我们协助客户建立和执行\
  \ CRM 项目的经验，我们观察到并可以描述一些作为 CRM 项目目标而反复出现的常见流程改进类别。\n\n##### 为客户运营提供指标和可视性\n\n许多组织缺乏精心设计的方法来记录客户互动信息，使得这些信息无法被广泛看到并采取行动。一切都通过电子邮件处理，或者通过每月报告艰难生成、审阅一次，然后就被扔到某个文件夹里。缺乏系统化信息收集的平台。以这种方式运营任何规模的组织，都好比没有仪表地驾驶飞机。你依靠的是传闻和“感觉”，几乎没有能力预测未来或从过去学习。无法判断流程变更或新投资的影响。就像你可以通过一组提供飞机性能信息的仪表来更有效地驾驶飞机一样，如果你的组织也实现了“仪表化”，你就能更有效地管理它。CRM\
  \ 应用可以被视为一种为你的对客流程实现仪表化平台的方式，该平台允许你定义关键指标，然后收集数据，将这些指标作为你业务流程的一部分提供出来。这种驱动指标并获得运营可见性的能力，是许多组织启动\
  \ CRM 项目的重要动力。\n\n一个简单的例子可能有助于具体化这些关于指标和流程的理论讨论：\n\n假设一个组织正在权衡对垂直市场营销的投资。遗憾的是，该组织只有关于其客户市场领域的传闻信息，因此对于要瞄准哪些市场以及在每个市场要重点推广哪些产品缺乏量化的理解。\n\
  \n认识到这一点后，CRM 团队做出了以下调整：\n\n1.  在 CRM 应用中创建一个属性，用于按市场领域对客户和潜在客户进行分类。\n2.  修改内部销售团队的资格认定流程，使其包括获取潜在客户的市场领域，并将信息录入\
  \ CRM。\n3.  要求客户经理团队更新 CRM，为他们的每位客户录入市场领域信息。\n4.  修改客服团队的问题创建流程，增加一项检查，看 CRM 中是否包含客户的市场领域信息，如果没有，则收集该信息。\n\
  5.  创建一份报告，按市场领域分解客户、潜在客户和商机，并展示每个市场领域的平均交易规模和产品组合。\n\n60 天后，这份报告提供了可行的洞察，揭示了哪些市场为组织带来了最多的收入，以及哪些产品在每个市场领域最为成功。这些信息使营销团队能够制定出成功几率最大的垂直市场营销策略。\n\
  \n这个例子凸显了 CRM 通过人员、流程和技术的结合，来实现组织“仪表化”并收集信息以回答有意义的业务数据这一强大功能。\n\n\n\n#### 改善部门间的客户“交接”\n\
  \n糟糕的客户交接问题屡见不鲜，可能导致收入损失和客户体验下降。两个例子可以说明什么是糟糕的交接：\n\n> **示例 1**：将合格的销售线索从内部销售/市场部门移交给现场销售代表\n\
  >\n> 在许多企业中，线索的初步筛选由市场部门或内部销售部门完成；只有高度合格的线索才会移交给现场销售团队。这种交接通常通过电子邮件完成，但有许多方式可能导致失败：如果现场销售代表正在休假、遇到电子邮件问题，或者只是疏忽了邮件，线索就可能被遗漏。内部销售人员在线索移交后，完全无法得知其后续进展。\n\
  >\n> **示例 2**：升级支持问题\n>\n> 大型支持组织通常按层级划分；问题会按顺序分配给经验更丰富、专业度更高的支持代表，以充分利用每个人的能力。在这种模式下，客户可能需要与两到三位不同的代表沟通，才能解决问题。在许多情况下，这种从一位代表到下一层级的“交接”是“冷启动”的，意味着新代表在与客户互动前对问题没有任何背景了解，迫使客户向每一位接手的代表从头开始解释问题。这对客户来说是一个令人沮丧且低效的过程。\n\
  \nCRM 应用程序有可能改善您组织中的交接问题。\n\n* **示例 1**：CRM 工作流自动化可以防止项目“从缝隙中掉落”。交接后，如果在一定时期内无任何活动，系统可以触发重新分配或发送电子邮件通知。\n\
  * **示例 2**：让面向客户的员工都在同一个 CRM 应用程序中工作，可以更简单地在交接时传递背景信息，从而确保客户或潜在客户获得尽可能无缝的体验。\n\n\
  #### 实施并执行结构化的销售方法论\n\nCRM 应用程序非常适合帮助实施结构化的销售方法论。这些方法论包含了经过验证的最佳实践，而 CRM 应用程序可以引导销售人员持续遵循这些方法论。此外，CRM\
  \ 可以让销售管理层清晰了解销售人员遵循方法论的程度，以及它对销售业绩的影响。详细的 CRM 分析功能可以帮助组织定制和调整方法论，以进一步提升绩效。\n\n\
  #### 聚焦营销支出\n\n市场团队面临的一个典型挑战是了解其营销支出的收入影响，以便将资金分配给能产生效果的营销项目，并取消无效的项目。相互割裂的营销和销售系统使得许多组织甚至无法记录一个成功转化为客户的潜在客户所接触过的营销活动。\n\
  \nCRM 应用程序不仅能够连接销售和营销团队，还能用于测试不同的营销方法（例如，不同的直邮信件或名单来源），并通过销售周期来衡量其效果。\n\n#### 精准定位营销触达\n\
  \n对于那些客户信息分散在多个系统中的组织而言，根据购买历史、订单量、地理位置、网站活动等条件，针对特定客户和潜在客户发送特定营销信息，可能是一项数据管理任务，困难到难以实施。这不仅需要将所有数据汇集到一个环境中进行筛选，还必须建立并维护一个客户\
  \ ID 对照表，以确定会计系统中的`账户 #245`、营销数据库中的`客户 #8879`以及网站跟踪应用中的`访客 #98786`是同一个实体。\n\n将客户信息集中到\
  \ CRM 应用程序中，并与会计系统和网站等其他关键应用程序建立周密的集成，可以简化这项任务。在 CRM 中拥有所有用于筛选和定位营销触达所需的标准，可以在不进行复杂的数据处理（合并来自不同应用程序的数据）的情况下，实现更个性化的营销。\n\
  \n#### 实现客户自助服务\n\n客户自助服务是一项明智的举措，有望同时降低服务成本和提高客户满意度。一个健康的自助服务渠道可以让组织用更少的客服人员服务相同的客户群，并为客户提供更快、更高效的服务体验。对于仅有基础客服工具的组织来说，自助服务是\
  \ CRM 项目三大常见关注领域之一，另外两个是实施结构化问题跟踪和开发可搜索的知识库工具。通常，自助服务是这三个领域中最后发展的一个；组织首先希望理顺其内部的问题管理流程并建立起知识库，然后才为客户提供自助服务选项。\n\
  \n在 CRM 项目中实现客户自助服务最常见的方式是部署客户门户网站。这是一个安全的网站，客户可以登录并以受控方式直接与 CRM 应用程序交互，无需客服代表协助。客户在门户网站中常见操作包括：在知识库中搜索问题解决方案；创建、查看或更新已有的服务问题；下载手册和数据表等支持材料；以及更新个人资料信息（地址、电话号码等）。\n\
  \n#### 管理服务升级\n\n与实施结构化客户服务问题管理流程（这通常是 CRM 项目的一部分）相辅相成的是，制定与问题升级相关的政策。设计良好的服务部门和升级政策可以帮助在提供积极客户体验与控制服务成本之间取得平衡，对于客户合同中明确规定了所需响应和解决时间的组织来说尤为重要。\n\
  \n当今 CRM 应用程序中强大的工作流逻辑有助于遵守升级策略，并能自动完成服务团队内问题的分配，以及团队内部和与客户之间的相关沟通。\n\n#### 分析\n\
  \n许多组织发现自己一次又一次地被迫在缺乏可靠客户数据的情况下做出重要的商业决策。他们发现，要么是没有收集所需的信息，要么是信息收集了，但分散在众多部门和应用程序中，无法在合理的时间或成本内进行整合。\n\
  \nCRM 应用程序能够提供帮助，因为它将客户信息集中在一个位置，并包含强大的查询和报告工具用于分析。对于更复杂的需求，可能需要一个更完整的商业智能计划，而 CRM\
  \ 只是众多数据源中的一个，其他数据源可能包括财务会计应用程序、服务排程应用程序或资源调配应用程序。\n\n我们鼓励所有启动 CRM 项目的组织，将部分关注点放在报告和分析上。这是管理者和高管与\
  \ CRM 应用程序交互并从中实现价值的主要方式。如果这些利益相关者群体对 CRM 不满意，他们的参与度就会降低，从而危及整个项目的成功。\n\n\n\n#####\
  \ CRM 维护流程\n\n上一节重点介绍了一些组织在 CRM 项目中寻求改进的常见业务流程领域，而本节将介绍维护和发展 CRM 项目所需的流程。这些 CRM\
  \ 维护流程将在第 3 章和第 6 章中详细说明。\n\n###### 支持\n\n面向员工的 CRM 项目支持可分为业务流程支持、CRM 应用程序支持以及两者的交叉部分。\n\
  \n由于 CRM 项目通常包含重新设计面向客户的流程，CRM 团队需要准备好为员工提供支持，解答他们关于流程步骤以及如何处理异常的问题。完善的文档和培训显然能发挥作用，但流程支持的需求始终存在。\n\
  \nCRM 应用程序支持类似于任何业务应用程序的技术支持：用户在使用软件时遇到问题、看到错误消息，或者只是忘记了如何在应用程序中完成任务。\n\n这两类支持的交叉部分在培训和文档中常被忽视。例如，你可以培训用户如何在\
  \ CRM 应用程序中鉴定线索，但这还不够；他们还必须理解在线索流程中，何时才被视为“合格”，以及应采取的相应行动。销售流程可能规定了一系列客户会议，而 CRM\
  \ 应用程序培训则展示了如何记录客户会议，但*所有*客户会议都应该录入 CRM 应用程序吗？如果不是，哪些会议应该录入？需要为它们录入哪些信息？这种关于如何在业务流程背景下使用\
  \ CRM 应用程序的说明，在 CRM 培训中常常被遗漏。\n\n###### 培训\n\n培训是 CRM 项目中持续进行的一部分。随着新员工加入组织，他们需要接受面向客户的流程培训，以及如何使用支持这些流程的\
  \ CRM 应用程序的培训。当流程得到优化、应用程序功能得到增强，或者新软件版本带来重大变化时，现有员工需要接受额外的培训。管理团队也能从定期的应用程序培训中受益，尤其是在新软件版本发布时。\n\
  \n大多数培训都是以业务流程为基础，在员工所在的部门内部开发和交付的，但 CRM 管理团队可能在通用应用程序培训中扮演一定角色。\n\n我们见过多种成功用于 CRM\
  \ 培训的培训形式，包括传统的课堂式、网络研讨会和自定进度的在线培训。一些客户还制作了常见应用程序操作的短视频，用户可以在内部网站上访问这些视频。\n\n######\
  \ 技术维护与灾难恢复\n\n本地部署的 CRM 应用程序与其他企业软件一样，需要一系列流程来支持它们，包括数据备份和灾难恢复、软件补丁、定期硬件升级等。这些流程的细节超出了本书的讨论范围。\n\
  \n作为软件即服务提供的 CRM 应用程序则不需要这些流程。\n\n##### CRM 增强流程\n\n有两个并行执行的流程负责 CRM 项目的发展与增强。第一个是持续的变更控制流程，它处理对\
  \ CRM 流程或技术进行的小规模、临时性的变更和增强。第二个是更复杂的路线图制定与执行流程，它确保 CRM 项目持续支持组织的战略目标，并用于规划和实施重大的项目变更。我们将在本节中描述每个流程。\n\
  \n###### 变更控制\n\n为使其有效，CRM 项目必须覆盖整个组织，并以某种形式触及所有面向客户的部门。客户流程跨部门运作，而 CRM 应用程序通常是各部门员工共享的、用于记录客户交互的核心平台。由于这种相互关联性，对\
  \ CRM 项目的变更可能产生广泛影响，必须加以控制；如果每个部门都可以不经协商或沟通，就自行按其认为合适的方式做出变更，则可能导致混乱和无序。一个设计良好的变更控制流程可以防止这种情况发生，并包括以下内容：\n\
  \n- 一个用于收集和编录来自 CRM 项目所有参与部门提出的 CRM 流程或 CRM 应用程序变更建议的系统\n- 定期举行会议，审查、讨论并批准/推迟/否决提出的变更\n\
  - 定期向组织内的 CRM 社区通报已提出/已批准/已否决的变更，以及已批准变更的实施时间表\n- 一个持续的小版本发布计划，CRM 应用程序的变更可被纳入其中，进行详细设计、开发、测试和部署\n\
  \n与这个持续的变更控制流程并行的是路线图制定与执行流程，该流程推动 CRM 项目的重大计划性变更。\n\n#### 路线图制定与执行\n\nCRM 路线图是\
  \ CRM 项目的长期规划，用于管理重大增强，更重要的是，确保 CRM 项目与组织的战略业务目标保持一致。路线图定义了未来一到两年的主要 CRM 举措，并基于组织的规划制定。\n\
  \n主要涉及两个核心的路线图流程。第一个是其持续的制定过程。路线图需要不断更新，以始终反映未来两年的规划。这需要与组织的高级领导层、CRM 执行发起人以及指导委员会保持互动。第二个流程是\
  \ CRM 计划的具体执行。\n\n路线图举措可能涉及 CRM 项目的任何部分，包括人员、业务流程以及 CRM 应用程序。下面，我们为一家名为 ABC Industries\
  \ 的虚构公司提供了一个示例路线图，该公司是一家高科技设备制造商。ABC Industries 近期启动了一个 CRM 项目，并在销售组织内部署了一个新的 CRM\
  \ 应用程序，计划在全公司范围内逐步推广。\n\n**示例 CRM 路线图：ABC Industries**\n\n| 2011 年第一季度 | 为新产品规划销售业务流程\
  \ |\n| --- | --- |\n|  | 规划并执行 CRM 应用程序增强以支持新产品 |\n|  | 针对新产品的销售团队开展流程和应用程序培训 |\n\
  | 第二季度 | 审查电子邮件沟通策略 |\n|  | 推广集成的电子邮件营销解决方案 |\n| 第三季度 | 升级 CRM 应用程序版本 |\n| 第四季度\
  \ | 根据需要审查和修订问题管理流程 |\n|  | 在客户服务和技术支持部门实施用于问题管理的 CRM 应用程序 |\n| 2012 年第一季度（续） |\
  \ 在客户服务和技术支持部门实施用于问题管理的 CRM 应用程序 |\n| 第二季度 | 将网站流量和行为跟踪集成到 CRM 应用程序中 |\n| 第三季度 |\
  \ 审查和修订销售区域策略 |\n|  | 实施人员和流程变更 |\n|  | 实施相关的 CRM 应用程序变更 |\n| 第四季度 | 设计并实施客户自助服务门户\
  \ |\n\n关于路线图，需要记住的一个重要点是它们是“可调整的”规划，且需要不断修订。它们旨在代表 CRM 项目的当前计划，但必须随着环境和组织目标的变化而改变。\n\
  \n\n\n### 技术\n\n对许多人而言，CRM *就是*一项技术，仅此而已。如果你曾是这些人中的一员，那么理想情况下，你已开始意识到技术只是拼图的一部分；它是工具，是赋能者。但它必须与你的组织模式和业务流程协同发展，才能取得成功。在本节中，我们将重点概述\
  \ CRM 应用程序和技术。我们将在第 4 章中深入研究如何选择适合你组织的 CRM 应用程序。\n\n#### CRM 应用程序基础设施概览\n\n其核心在于，CRM\
  \ 应用程序是一个数据库，用户通过应用服务器，使用多种不同的客户端与之交互。图 2-1 展示了典型 CRM 应用程序技术架构的概览。\n\n![images](img/0201.jpg)\n\
  \n**图 2-1.** 典型的 CRM 应用程序基础设施\n\n你的 CRM 基础设施的复杂性将反映你组织的规模。小型 CRM 实施可能仅使用一台物理服务器同时扮演应用服务器和数据库服务器的角色。企业级\
  \ CRM 部署可能需要多台服务器来分散大量用户的负载，并提供冗余以避免系统停机，其环境还可能包含网络负载均衡器和专用存储设备等其他硬件组件。你的咨询合作伙伴和\
  \ IT 团队应协同工作，预测你环境中的 CRM 应用程序使用情况，并据此调整基础设施规模。在做基础设施决策时，请考虑你的发展路线图；如果你的硬件规模仅适配试点用户的负载，那么当你将应用程序推广给更大的用户群体进行生产使用时，你可能会非常失望。\n\
  \n作为技术行业向云计算总体趋势的一部分，大多数领先的 CRM 应用程序供应商现在都将其产品作为“软件即服务”或“云”应用程序提供。在这种模式下，图 2-1 中概述的服务器组件由供应商透明地拥有和管理。应用程序以订阅方式购买，并通过互联网访问。如果应用程序通过网页浏览器访问，客户无需安装任何软件。部署模式（传统的本地部署与软件即服务）的选择应取决于多种因素，包括长期成本、IT\
  \ 支持资源的可用性、待存储数据的敏感性、所需的定制和集成水平等等。\n\n#### 生产、开发和测试环境\n\n除了你的生产 CRM 应用程序部署之外，你很可能还需要运行一个或多个额外的\
  \ CRM 应用程序部署，用于开发、测试或培训目的。\n\n可能作为你初始启动 CRM 的一部分，或者随着你需求的发展，你可能会发现需要为你的 CRM 应用程序开发自定义组件，也许是添加新功能或与你组织中的其他业务系统集成。在生产环境中开发自定义组件充满风险，我们强烈建议不要这样做。它可能会干扰生产用户，可能导致系统停机或中断，并且可能损坏数据。\n\
  \n彻底的测试对于确保新的自定义组件按设计运行，并且不影响任何现有功能或流程至关重要。理想情况下，应使用第三个专门的 CRM 测试环境。该环境应在硬件、软件基础设施版本等方面尽可能与生产环境匹配，以便对在测试中表现良好的自定义组件迁移到生产环境后也能正常运行提供高度信心。将开发和测试分离到不同的环境中非常重要；对于任何规模较大的开发工作，这两个活动实际上无法在同一环境中进行。测试人员需要一个稳定、一致的运行着已知代码集的环境来进行工作。如果开发人员不断向系统中注入新编写的代码，测试人员将无法工作。\n\
  \n大型组织有持续且重要的培训需求，许多组织会为此设置独立的环境。我们也见过测试和培训共享环境的情况，但这可能会让受训者感到困惑，因为他们可能会看到正在开发中的、生产环境中尚不存在的新功能。\n\
  \n无论你打算在你的 CRM 项目中管理多少个环境，花时间规划好两个重要流程的步骤都是值得的：\n\n*   **从生产环境刷新开发/测试环境：** 定期地（也许在开发项目之间），你需要将你的开发环境和测试环境与生产环境同步，使它们再次成为生产环境的副本。这可以确保这些环境不会逐渐偏离生产环境，并为这些环境带来新鲜数据以协助开发和测试。该流程应有完善的文档记录、可重复，并且理想情况下不应过于繁重。隐私政策可能要求开发环境和测试环境中省略或混淆来自生产环境的某些数据（例如，社会安全号码）。\n\
  *   **将自定义组件从开发环境迁移到测试环境再到生产环境：** 记录将自定义组件从开发环境迁移到测试环境再到生产环境的“流程”和“技术”步骤非常有价值。流程步骤很可能作为你开发方法论的一部分来定义，并为每个环境规定相应的门禁和质量标准。迁移自定义组件的“技术”步骤将根据你的\
  \ CRM 应用程序而有所不同。\n\n请注意，这些流程可能会因你的 CRM 应用程序部署方式（本地托管或通过软件即服务）而存在显著差异，但无论你的部署模式如何，对非生产环境的需求以及执行这两个流程的能力都是存在的。\n\
  \n#### 源代码管理\n\n大多数 CRM 部署都能从使用某种形式的源代码控制中受益，并应利用它来管理配置和自定义组件。使用源代码控制的好处很大，而其开销远没有你想象的那么显著。如果管理超过一名开发人员的任何开发工作，没有源代码控制很快就会崩溃。对于非开发人员而言，源代码控制系统管理着配置和自定义组件的源代码（通常有几十到几百个小文件），并提供以下好处：\n\
  \n*   帮助防止或管理不同开发人员独立对同一文件进行更改时发生的冲突\n*   允许访问文件更改的历史记录，并可根据需要恢复到文件的先前版本\n*   允许运行软件的多个版本，以实现分支开发并帮助隔离错误\n\
  \n有多个供应商提供多种源代码控制选项，包括一些功能强大、免费的开源应用程序。\n\n#### 常见的 CRM 应用程序功能\n\n作为 CRM 应用程序领域的入门介绍，本节将概述领先\
  \ CRM 应用程序中的常见功能。这将提供一个框架，帮助你更快、更有效地理解和评估不同的应用程序。\n\n\n### 客户\n\n客户记录是 CRM 应用的核心，大多数其他信息都围绕它展开。这些记录分为“帐户”或“公司”记录，用于代表您与之互动的组织；以及“联系人”或“个人”记录，用于代表个人。\n\
  \n应关注的关键客户功能包括：\n\n-   能够添加字段，以多种方式对客户进行分类——按销售区域、市场细分或行业\n-   能够跟踪多种类型的组织，既可以使用客户记录，也可以使用合作伙伴、供应商和潜在客户等其他记录\n\
  -   能够创建多个临时关系来关联帐户和联系人，以表示可能存在的各种重要关系\n-   能够轻松跟踪与客户的互动，如会议、电话、电子邮件和传真\n\n### 市场营销\n\
  \n市场营销功能旨在帮助执行和跟踪外呼营销活动，例如直邮、邮件群发和电话销售呼叫。一个关键因素是，营销线索能多好地延续到销售领域，以帮助将收入与营销活动联系起来。这是营销团队普遍面临的挑战，也是\
  \ CRM 应用非常适合解决的问题。\n\n应关注的关键营销功能包括：\n\n-   能够独立于客户管理嫌疑/潜在客户信息，用于资格认定和营销目的\n-   能够使用各种标准建立列表，然后针对列表执行营销活动\n\
  -   能够将营销活动组织成营销战役，以便进行规划\n-   能够以稳健的方式执行直接电子邮件营销（例如，跟踪邮件打开、退回和转发；使用丰富的邮件模板；以及管理选择加入/退出流程）\n\
  -   能够将销售和客户获取活动与营销工作联系起来\n\n### 销售\n\n销售部门是 CRM 应用的发源地（早期称为销售力量自动化 [SFA] 应用），销售团队也一直是\
  \ CRM 计划的主要驱动力。将 CRM 应用和精心设计的 CRM 流程引入销售团队有多种动机——最普遍的包括：让管理层更清晰地了解销售活动和销售管道，帮助支持结构化的销售方法论，减少行政工作并帮助销售人员提高生产力。\n\
  \n应关注的关键销售功能包括：\n\n-   能够管理销售机会信息，如交易规模、预计成交日期、所售产品/服务以及销售周期中的阶段\n-   能够定义和管理结构化的销售方法论\n\
  -   能够为客户和潜在客户创建演示报价\n-   能够为向销售管理层汇报创建销售预测\n\n### 服务\n\nCRM 应用的客户服务功能旨在帮助组织记录客户问题，并有效管理直至问题解决。服务流程通常是组织内被研究最多、结构化程度最高的流程之一，因为它对客户体验有重大影响，并且需要在一个传统上非利润中心的部门控制成本。\n\
  \n在 CRM 应用内管理服务流程的其他好处包括：\n\n-   服务人员通常是现有帐户内潜在后续业务的来源——通过让服务员工与销售人员使用相同的应用，可以简化团队之间的交接，工作流自动化可以防止潜在客户流失。\n\
  -   服务问题数据是一个丰富的信息宝库，可用于改进和完善组织的产品、服务及面向客户的流程。服务数据与客户数据之间的轻松关联，使得能够洞察服务问题类别在不同客户群体中的分布情况。\n\
  \n应关注的关键服务功能包括：\n\n-   能够管理和分类服务问题（通常称为*案例*或*故障单*）。每个问题跟踪的信息可能包括服务流程阶段、问题类型、相关产品/服务以及问题负责人。\n\
  -   能够定义并支持针对不同类别问题的多种问题解决流程。\n-   能够支持服务队列，以促进问题路由和解决。\n-   能够部署自助服务门户，客户可以登录创建、更新和查看服务问题。\n\
  -   集成的 wiki 或其他知识库工具，以促进服务部门内部的信息共享。\n\n### 安全性\n\n尽管一些组织以“开放”方式配置其 CRM 应用（即每个用户可以看到应用中的所有信息），但许多组织需要能够对信息进行隔离。常见的例子包括销售信息、敏感客户信息（如社会安全号码或账号），甚至薪酬或佣金信息。CRM\
  \ 应用中强大的安全模型将使您能够灵活地管理各种不同的安全场景。\n\n应关注的关键安全模型功能包括：\n\n-   能够在实体级别（例如，帐户、联系人、销售机会）和单个字段级别（例如，社会安全号码）保护信息\n\
  -   能够将权限打包成“角色”，并可分配给用户或组，以方便用户管理\n-   能够处理安全例外情况——当用户需要访问应用中其当前范围之外的特定记录或记录集时\n\
  -   安全性应贯穿整个应用——适用于通过用户界面查看信息、任何搜索或查询工具，以及报表和仪表板\n\n### 配置与定制\n\nCRM 应用总是需要配置和定制，才能提供优雅的用户体验，并最大化其为您的组织带来的价值。每个组织都是不同的，需要记录不同类型的客户信息，并通过其\
  \ CRM 应用支持不同的业务流程。在讨论对 CRM 应用进行变更时，我们使用术语*配置*来描述无需编程即可使用应用的管理工具和功能进行的更改，而*定制*则指通过编程来更改应用。CRM\
  \ 应用的配置能力和定制灵活性的程度与复杂程度，将决定您能在多大程度上根据当前和未来需求量身定制该应用，以及这种定制所需的工作量。\n\n应关注的关键配置与定制功能包括：\n\
  \n-   无需编程即可扩展应用数据模型的能力。这包括为现有实体（例如“客户”和“销售机会”）添加新字段，以及设计新实体。您定义的新实体应功能完整，具备与现有实体相同的能力。\n\
  -   通过代码将自定义业务逻辑插入系统以改变其行为的能力，通常围绕系统*事件*（例如，创建新客户记录或重新分配销售机会）。\n-   其他应用与 CRM 应用交互的能力。该应用是否存在应用程序编程接口（API）？其健壮性如何？\n\
  \n\n\n## 报告\n\nCRM 应用价值的一大部分，是通过使用精心设计的报告来实现的，这些报告能提供业务洞察并支持明智决策。对于不直接与客户互动的员工而言，CRM\
  \ 应用的直接价值可能完全来自 CRM 报告和仪表板。不要过分依赖开箱即用的报告——它们通常过于通用，不经过定制化很难发挥作用——而应将重点放在报表生成工具和数据的可访问性上。\n\
  \n需要关注的关键报表功能包括：\n\n- 以用户为导向的工具，无需编程即可构建基础报表和仪表板。\n- 通过标准协议（例如`ODBC`）使用其他报表工具开放访问数据，同时尊重应用的安全模型。例如，有些应用允许将数据导出到\
  \ Microsoft Excel 进行报告和分析。\n\n### 工作流自动化\n\n如果你认为 CRM 应用的关键功能之一是支持面向客户的业务流程，那么应用的工作流自动化功能就是一个重要的关注领域。\n\
  \n没有工作流自动化，大多数 CRM 应用本质上就是电子文件柜——以一种有组织、可搜索的方式存储客户信息。这很有价值，但将 CRM 应用定位为任何流程中的*被动*参与者——一个在不同步骤检索和存储信息的地方。正是工作流功能，结合应用于系统事件的自定义逻辑，才能使\
  \ CRM 应用成为流程中的*主动*参与者。一个简单的例子也许有助于强调这种区别：考虑一个合格的潜在客户从营销部门移交给外勤销售团队的情况。\n\n> **被动型\
  \ CRM**\n>\n> 营销代表将资格认定通话中的信息输入到潜在客户表单。他判断该潜在客户达到“合格”标准，然后手动将其重新分配给合适的外勤销售代表，接着处理下一个潜在客户。在外勤，几天后的某个时候，外勤销售代表登录\
  \ CRM，导航到分配给她的一组新潜在客户列表。她打开这个潜在客户，并主动联系以安排初次会面。\n>\n> **主动型 CRM**\n>\n> 营销代表将资格认定通话中的信息输入到潜在客户表单。CRM\
  \ 应用注意到该潜在客户符合预定义的资格认定标准——它会自动将其状态更改为合格，并根据组织的区域销售模型将其重新分配给合适的外勤销售代表。它会向营销代表和外勤销售代表发送电子邮件，告知移交事宜。它启动一个计时器；如果外勤销售代表在两天内未更新此潜在客户状态，系统将向该外勤销售代表及其经理发送提醒邮件。在外勤，就在同一天，外勤销售代表打开潜在客户路由邮件，并点击邮件中的链接阅读营销代表的备注，查找潜在客户的联系信息。他主动联系以安排初次会面。\n\
  \n区别应该很明显。在第一个例子中，CRM 应用只是一个存储库，而在第二个例子中，它则是一个主动参与者——采取行动并促进团队成员之间的沟通。这种能力由 CRM\
  \ 应用的工作流自动化功能提供。\n\n需要关注的关键工作流功能包括：\n\n- 能够设计多步骤的工作流流程，这些流程可以响应应用事件（例如，记录的创建、更新、删除、重新分配）并执行多种操作（例如，创建新记录、重新分配记录、发送电子邮件或短信、更新记录）。这应无需编程即可实现。\n\
  - 能够进行分支并控制工作流流程的流转。\n- 能够通过代码使用自定义逻辑扩展工作流流程。\n\n### 社交媒体与 CRM 应用\n\n社交媒体工具正作为一种新的沟通渠道兴起，个人通过它来相互互动以及与组织互动。这种沟通形式在重要方面与传统渠道不同，组织需要考虑其提供的客户互动机会。我们在此将社交媒体定义为诸如\
  \ Facebook、Twitter、博客、维基、评论网站和视频网站等工具，这些工具允许个人进行交流、创建和交换内容，并找到其他有相似兴趣或关注点的人。\n\n\
  社交媒体工具兴起的一个重要方面，是它们赋予个人影响公众舆论的力量。过去，一个组织需要管理一小部分关键的记者和行业分析师的意见，这些人拥有渠道，可以用他们选择传达关于该组织的任何信息来影响大量受众。社交媒体的兴起让每个个体都拥有了广泛分享他们对一个组织的不满、满意或分析的渠道。这在很大程度上复杂化了负责保护和提升组织品牌的营销和公关团队的任务。\n\
  \n社交媒体工具也为组织提供了一些有趣的新能力。收集产品与政策的反馈比传统方法（如焦点小组）更容易且成本更低，吸引客户参与产品规划和设计过程也是如此。通过 Facebook\
  \ 和 Twitter 传达组织动态，以一种个人习惯且舒适的方式触达他们。\n\nCRM 工具如何帮助管理组织的社交媒体形象和沟通？已有多种产品提供这些能力，它们通常与现有的主流\
  \ CRM 套件应用集成。提供的能力通常包括：\n\n- 监控社交媒体工具（Facebook、Twitter、评论网站、博客等）中提及组织的内容，并帮助管理组织的回应\n\
  - 管理并追踪那些拥有广泛关注度且发表关于组织声明或内容的有影响力个人的活动\n- 协调组织通过社交媒体工具的主动沟通\n- 将个人的 CRM 记录与其在各种社交网站上的个人资料相关联，为\
  \ CRM 用户提供关于该个人及其关系的更全面视图\n\n尽管社交媒体广受欢迎，但组织应谨慎周到地进入这个渠道，并考虑客户希望通过这些工具从与组织的互动中获得什么。研究表明，许多人仍然将社交媒体视为与朋友和家人联系的工具，可能并不欢迎组织的积极介入。\n\
  \n\n### 期望\n\n这并不容易。CRM 项目的初始启动及其持续管理，都需要组织中众多人员投入大量的时间和精力。在对所需投入提高期望的同时，同样重要的是要克制对结果的预期，尤其是在项目启动阶段。CRM\
  \ 可能给组织带来重大变革，而变革可能进展缓慢且早期收益有限。\n\n正如第 5 章和第 6 章所详述的，成功启动一个 CRM 项目并随后进行维护和发展是一项重大工程。初始项目将意味着来自业务、技术和执行团队的一批人员在资本、时间和精力上的重大投入。这些人员需要齐心协力、相互协作并迅速做出决策以支持\
  \ CRM 的上线。他们需要像不知疲倦的啦啦队长和榜样一样，帮助 CRM 的种子扎根并成长为组织创造重大而持久价值的源泉。CRM 的持续维护和改进，要求指导委员会和\
  \ CRM 管理团队忠实地执行一套流程，定期识别、确定优先级并处理小的需求和改进，同时规划更大的举措，使 CRM 项目与组织目标保持一致，并扩大其覆盖范围和价值。\n\
  \n如果我们把启动和管理 CRM 项目的过程形容为一场攻坚战，这仅仅是为了在抑制 CRM 供应商的过度营销方面尽一点绵薄之力——他们一直传递着危险的信号：只要你购买他们的应用程序并安装，你的组织就会万事大吉，并将开始收获一个与自身及客户步调一致的企业的好处。CRM\
  \ 应用程序*确实*能对您的业务产生惊人的积极影响，*确实*能帮助您转型为一个敏捷的组织，提供卓越的客户体验，并能迅速转向，抓住新的机遇。但应用程序本身无法为您做到这些——您必须“拥有”您的\
  \ CRM 项目，并明白成功的关键在于您自己。这就是为什么我们认为“合理的期望”是成功 CRM 项目的关键组成部分——对所需付出的努力、成本、短期结果以及长期结果都要有合理的期望。\n\
  \n#### 为面向客户的员工设定期望\n\n面向客户的员工很可能在 CRM 项目启动过程中，其工作流程和使用工具都会发生变化。这过程不可能毫无痛苦和摩擦——正如关于变革管理的众多书籍所证实的那样。CRM\
  \ 项目的最终成功将取决于这个群体能否接受它并克服任何过渡困难。为了确保这一结果，需要向该群体传达以下几点：\n\n- 应传达 CRM 项目的总体愿景、预期收益以及该项目与组织战略目标之间的联系，以帮助赢得员工的认同。\n\
  - CRM 指导委员会理解项目启动过程中会出现一些波折和问题——感谢员工的耐心，欢迎他们的反馈，并且已预留预算用于清除障碍和解决他们的关切。\n- 尽管存在过渡期的挑战，管理层对\
  \ CRM 项目的承诺不会动摇。这并非“试验”、“测试”或“实验”，而是一项关键的组织战略，并且从现在起就是“业务运作的方式”。我们需要共同努力，把它做好。\n\
  \n### 陷阱\n\n既然我们已经审视了构建成功 CRM 项目所需的人员、流程、技术和期望，那么指出我们观察到的一些组织失败或在通往 CRM 成功之路上无意中引入障碍的方式，可能很有启发意义。请务必注意，在您自己的\
  \ CRM 项目中避免重蹈这些覆辙。\n\n#### 高管支持不力\n\n如前所述，在项目启动后的几周内，启动 CRM 项目对实施团队和所有受影响的员工来说都可能是一项繁重的工作。事情不可能一开始就完美无缺，可能会经历一个令人沮丧的时期，需要不断优化流程和应用程序并逐步推进。一些员工可能会试图恢复原有的工作方式，并可能抵制使用\
  \ CRM 应用程序。如果这些员工是高绩效者，例如顶尖销售人员，经理们可能会倾向于睁一只眼闭一只眼。这种做法极具腐蚀性——向他人传递了 CRM 是“可选”的信号，并且由于将部分客户信息和互动置于\
  \ CRM 流程和应用程序之外，从而降低了项目的价值。\n\nCRM 的执行发起人必须准备好应对此类采用挑战。发起人必须在整个组织中持续推销 CRM 的愿景，强调其价值，并让每个人都对全面参与\
  \ CRM 项目负责。同时，此人还必须努力保持 CRM 项目的灵活性，并吸纳员工反馈以消除问题、推动改进，从而使所有员工受益。\n\n#### 未将“执行者”视为利益相关者\n\
  \n我们参与过的许多 CRM 项目中，都明显存在管理层与面向客户员工的实际工作方式脱节的情况。我们曾在会议中目睹一位经理描述一个流程如何运作，而一位销售代表当场反驳道：“但实际根本不是那样的。”\n\
  \n让面向客户的员工参与 CRM 项目的设计和开发，出于多方面原因是必要的：\n\n- 正如前面的例子所显示，有时只有面向客户的员工——销售人员与客服人员——才了解流程实际如何运作以及工具实际如何使用。任何流程改进或\
  \ CRM 应用程序设计的基础，都是要清晰理解当前的运作方式。\n- CRM 流程将由这些员工执行，CRM 应用程序也由他们使用，因此让他们在设计方式上拥有发言权是合情合理的。他们能提供管理者和高管无法提供的独特而有价值的视角。\n\
  - 他们在 CRM 应用程序设计期间提供了可用性“检查”。业务分析师可能希望收集关于客户的 50 个不同数据属性，以便进行细分和分析客户群。销售员工的代表则可以根据可用性问题提出反对意见，因为他们了解销售人员实际在与谁交谈以及可获得哪些信息，从而知道什么是真正可行的。\n\
  - 最终，CRM 项目的成功将取决于面向客户团队对 CRM 流程和应用程序的采纳。如果这些员工觉得在设计过程中他们的声音被听到了，并且这是“他们的流程”和“他们的应用程序”，而不是\
  \ IT 部门或高层管理者强加给他们的东西，那么他们将拥有更高的认同度，并成为项目更坚定的支持者。他们也会更积极地提供正面反馈，帮助改进项目。\n\n\n\n\
  #### 实施客户关系管理计划但缺乏清晰路线图\n\n“量两次，切一次。”这句木工谚语同样适用于客户关系管理计划。充分的准备和细致的规划能够带来更成功的客户关系管理计划，并提升员工满意度。我们将在第\
  \ 3 章中详细讨论路线图的规划与制定，但其根本在于：要批判性和战略性地思考那些能为组织带来最大利益的客户关系管理举措，考虑不同举措之间的协同效应等因素，并制定和传达一个分阶段实施的计划。\n\
  \n在没有路线图的情况下推进项目，可能会导致效率低下（未必先处理最高价值的领域）、令人困惑（人们无法前瞻性地理解何时发生什么以及为何发生）以及成本高昂（由于后续举措带来的影响，通常需要对部分工作进行返工和重新设计）。此外，伴随缺乏坚实计划而实施客户关系管理所带来的时断时续，会削弱项目的动力并损害团队的**可信度**。\n\
  \n#### 提供不充分的培训\n\n无论出于何种原因，培训往往是高管们在试图降低拟议客户关系管理项目成本时关注的重点。“我们的员工很聪明”或“这又不是造火箭”等言论，常常发生在削减培训预算之前。对于规划客户关系管理举措的项目经理而言，培训工作往往事后才被想起，并且未能获得与其他项目组件同等程度的规划、准备和关注。\n\
  \n事实上，有效的培训是用户采纳率和整个项目成功的关键驱动因素。培训应针对不同角色进行定制，基于具体场景，并融合流程与应用程序培训，使员工了解流程如何运作，以及如何使用客户关系管理应用程序来支持该流程。实操环节对于保持受训者的参与度非常有价值。除了初始的上线前培训，明智的做法是规划后续培训和非正式的问答环节，以帮助客户关系管理团队监控员工在采纳客户关系管理流程和工具方面的成功程度，并为员工提供多次机会来解答他们的疑问。\n\
  \n#### 跳过数据迁移或数据清理\n\n在上线前，有计划地将干净数据迁移到新的客户关系管理应用程序中，能以多种方式增加价值。它能减少员工的数据录入工作；减少或消除用户需要返回旧工具的情况，从而巩固向客户关系管理应用程序的切换；它还允许在客户关系管理应用程序内部更轻松地运行有意义的报告，以对比客户关系管理实施前后数据。\n\
  \n然而，在大多数客户关系管理计划中，数据迁移是一个需要大量工作、高额成本和高度复杂的领域，因此常常成为预算削减的诱人目标。高管们只有在经过深思熟虑和实事求是地评估对客户关系管理用户的影响之后，才应考虑取消这项工作，以确保正确平衡成本节约与项目风险。\n\
  \n#### 未能为所有利益相关者提供价值\n\n客户关系管理计划自然会以不同方式为不同利益相关者群体提供价值。经理和高管会依赖客户关系管理报告和分析来深入了解其业务和客户，帮助他们做出更好的决策并更好地预测未来表现。面对客户的员工应该会发现，客户关系管理应用程序有助于他们保持条理、提高生产力，并最大限度地减少与其工作职能相关的行政开销。\n\
  \n制定一个初始客户关系管理项目，有可能只专注于为某一群体提供价值，而未能为另一群体提供价值。这是一种危险的做法，务必避免。在规划客户关系管理路线图时，应仔细关注，确保参与项目的每个团队都能从中至少获得一些价值。\n\
  \n为了说明这种风险，请考虑一个基本的初始客户关系管理计划启动案例，该计划涉及为一批销售人员部署新的销售方法论，以及为他们提供一个新的客户关系管理应用程序来管理其销售活动。\n\
  \n> **极端且有缺陷的方法一**\n>\n> 想象一个项目团队，由于担心用户采纳问题，专注于尽可能让销售人员顺滑地使用销售方法论和客户关系管理应用程序。每当他们抱怨应用程序要求输入过多关于其活动的信息时，团队便通过移除细节和简化来调整。销售人员感到不适的步骤被稀释或从方法论中移除。最终的结果是，一个效力不明的、被稀释了的方法论，以及一个被用户勉为其难支持、但未能收集足够信息来进行任何分析甚至无法创建完整销售管道的应用程序。\n\
  >\n> 管理层面未能获得价值，导致他们回归到过去管理销售团队的那些临时性方法。他们对工具的缺乏兴趣清晰地传递给销售人员，后者逐渐疏远，直到再也没有人使用它。\n\
  >\n> **极端且有缺陷的方法二**\n>\n> 这个例子中的项目团队大部分时间都与高管团队在一起，了解他们希望看到哪种销售仪表盘和分析，以及他们希望如何对销售信息进行细分。为了支持这些丰富的报告需求，由此产生的方法论和客户关系管理应用程序高度结构化——要求销售人员输入他们作为销售流程一部分所采取的每一个微小行动，并输入关于其商机、联系人和潜在客户的大量信息。很少关注销售人员的“日常工作状态”或什么样的流程和应用程序功能能帮助他们提高效率。销售人员提出的反对意见被“这是高管们需要的——这个项目得到了他们的全力支持”所反驳。\n\
  >\n> 结果是一个臃肿、繁琐的流程和客户关系管理应用程序，令销售人员心生畏惧。没有两个销售人员以相同的方式使用该工具——其复杂性为如何使用它留下了众多选项。最终，它严重拖慢了销售人员的速度，以至于他们开始忽视它，直到月底，当知道经理们要运行预测报告时，他们才在疯狂的最后时刻，一次性输入当月所有活动的最低要求信息。销售人员很不高兴——该流程和应用程序是对他们工作的“税收”，对他们毫无帮助。经理们抱怨说，报告一个月只有一次是准确的，而且销售人员不愿意使用该应用程序。\n\
  \n这些例子故意极端化，以说明一个观点：你需要努力构建项目，使得每个利益相关者群体都能获得成功，并且每个群体都比以前更有生产力。\n\n\n\n#### 试图一次性完成过多任务\n\
  \n我们曾看到客户试图将整个路线图塞进单个项目——这种“大爆炸”式方法试图一次性在所有计划部门及所有业务职能中启动 CRM 项目。尽管这种方法看似能最短时间内实现组织的全部\
  \ CRM 目标，但相比多项目路线图法，其风险极高且存在诸多弊端。这类项目大多会因自身规模而崩塌——存在过多利益相关方互相冲突、过多相互关联导致每个决策瘫痪，项目周期过长导致团队成员和发起人倦怠流失。\n\
  \n相比之下，多项目方法具有若干关键优势：\n\n- 较短的序列化项目意味着组织能更快开始看见 CRM 价值，助力项目积累动力。\n- 让部分流程和部门先上线运行，同时推进其他项目，可使经验教训反哺后续项目，提升整体项目质量。\n\
  - 小型聚焦项目更易成功执行——人员更少，“活动部件”更少，项目目标更少且更易对齐。\n\n## 总结\n\n成功 CRM 项目的组成部分分为三大类：人员、流程与技术。\n\
  \n- 在人员类别中，存在一系列重要角色。最重要的是执行发起人（作为项目领袖，必须设定方向并推动所有人前进）和部门倡导者（保持团队参与度，并将反馈传达给 CRM\
  \ 管理团队）。\n- 流程在 CRM 语境中具有双重含义：存在大量可通过 CRM 应用增强和支持的业务流程；同时需建立一套运营流程来管理 CRM 项目。设计这些运营流程是准备启动\
  \ CRM 项目的重要步骤。\n- 除 CRM 应用外，技术组件还包括源代码管理应用以及维护 CRM 应用测试与开发环境的方案。\n\n## 构建 CRM 路线图\n\
  \n制定周密审慎的 CRM 项目实施计划，有助于在组织优先级与举措、不同部门的需求与准备程度之间取得最佳平衡。随意无序的实施会导致业务流程割裂、员工不满和过度实施成本。规划\
  \ CRM 项目时，\"预防胜于治疗\"。\n\n本章我们将探讨为 CRM 项目制定一至三年计划（即*路线图*）的流程。所有组织都应制定并维护 CRM 路线图——无论它们刚起步考虑\
  \ CRM，还是已有成熟成功的项目。路线图是一份持续演进的文档，反映不断变化的业务状况和优先级，并保持对未来一至三年的前瞻。下一节我们将讨论 CRM 分阶段方法的原理，随后探讨初始路线图的制定。\n\
  \n### 为何采用分阶段方法实施 CRM？\n\n当你形成 CRM 整体项目的初步愿景时，可能很想通过单个项目实现全部范围。这似乎是实现愿景最直接、最短的途径。我们强烈不鼓励这种试图从\"\
  无 CRM\"直接过渡到\"全 CRM 愿景\"的\"大爆炸\"式方法。本节我们希望说服您：采用分阶段方法——将若干较小项目串联起来逐步推进至完整愿景并扩大 CRM\
  \ 覆盖范围——是更明智的方式，且能提升项目成功率。为一次大推进构建内部动力看似容易，一次性向所有员工推广似乎比协调多个阶段更简单，但切勿被迷惑。\n\n以下列举\"\
  大爆炸\"方法中可通过分阶段方法解决的若干问题。\n\n#### 耗时过长\n\n像 CRM 这样的业务流程和技术应用项目周期越长，失败可能性越大——这由多重因素导致。项目团队的人员流失会削弱组织的制度记忆：新成员加入导致决策被反复讨论，进一步拖慢项目进度。项目范围越大，需要参与的干系人越多，这些人在决策中要求发言权，导致项目受委员会驱动而进展缓慢。疲劳耗尽项目发起人和其他高管的精力，他们日渐厌倦向越来越怀疑的员工推销项目益处，员工甚至开始怀疑项目能否真正启动。项目周期越长，从\
  \ CRM 流程与应用设计到实际推广的时间间隔就越长。以当今商业变革的速度，间隔越长，项目实际启动时与地面现实及员工需求的偏差就越大。\n\n在分阶段方法中，每个项目范围更小、周期更短，目标与干系人更少。每个项目都建立在前一项目基础上，扩展\
  \ CRM 在组织内的覆盖范围，解决新部门或新业务流程的问题。本章稍后将介绍如何将项目拆分为多个阶段以构建路线图的指南。\n\n#### 缺乏融入反馈的机会\n\
  \n采用分阶段方法，每个项目阶段结束后都有机会进行项目后评估，将经验教训和成功实践融入下一阶段。这样，随着你不断优化最适合组织的项目方法论，理论上每个阶段的项目执行质量都会逐步提升。而在\"\
  大爆炸\"方法中，这种学习机会少得多，因为项目每个阶段基本上只执行一次。\n\n### 构建初始路线图\n\n本节我们将聚焦构建初始路线图以启动 CRM 项目的流程。如果你已建立\
  \ CRM 项目并部署了 CRM 应用，我们将在\"中途制定路线图\"部分讨论实施 CRM 应用后制定路线图的特殊情况。\n\n#### 评估现状\n\n路线图规划的核心是评估现状与战略目标；对这些因素的研究应能提出一系列举措，随后需要适当排序和排期以最大化效率、最小化风险。\n\
  \n\n\n##### 当前业务流程\n\n构建路线图时，一个有用的第一步是记录你当前实际运营的业务流程。你可能会发现，执行类似职能的员工或部门之间存在流程不一致的情况——这很常见。许多你规划的\
  \ CRM 举措可能都需要流程变革，而记录当前状态将有助于厘清变革所涉及的影响，并增进理解。这项工作还可能揭示出效率低下之处、导致客户体验不佳的流程，或是将一个用户或部门的最佳实践推广到其他用户或部门的机会。通常，只要切实可行，你就应力求流程的一致性——所有员工和部门以相同方式处理相同任务会带来诸多好处，而当客户感受到这种一致性时，也会改善其体验。\n\
  \n##### 当前客户信息应用\n\n创建一个用于管理客户信息或客户相关流程的各类应用程序目录。该目录应描述每个应用程序的使用者、用途，以及这些应用在你组织流程中的使用背景。通过访谈用户，了解他们对每个应用优缺点的看法。这个过程很可能令人大开眼界。大多数组织都是以自下而上的草根方式，在应对不断变化的环境时，发展出自身的流程和工具，且缺乏战略视角。你很可能会发现多个应用程序持有相同信息、流程需要重复录入到多个应用中，以及大量用于解决特定问题的小型\
  \ Microsoft Excel 或 Access 解决方案。这种拼凑式的应用环境会阻碍用户生产力，并妨碍员工之间进行有效协作。我们并非建议一个组织内只能有一个单一的、大一统的应用，而是说你的应用组合理应是理性规划的成果——旨在最大化员工的生产力和效率，并提供卓越的客户体验。在大多数组织中，情况并非如此。\n\
  \n##### 寻找痛点\n\n评估过程的一部分就是要在你面向客户的团队中“寻找痛点”。说得直白些，这些痛点可能预示着人员、流程或技术层面存在需要解决的故障。因此，要关注那些抱怨。谁在呼吁变革？哪个团队或职能部门持续无法达到期望？员工流动率是否更高？分析具体情况——根本问题是什么原因造成的？谁受到了影响，解决这个痛点的商业价值是什么？解决这个痛点是否符合组织的战略目标？\n\
  \n##### 战略目标\n\n组织的战略目标和战略计划在塑造你的 CRM 路线图中扮演着重要角色。它们可能是路线图中相关举措的直接来源。例如，如果你的计划包括进入新市场或开拓新客户群体，这很可能需要调整\
  \ CRM 相关的人员、流程和技术来支持这一努力。除了直接贡献于 CRM 举措集合，你的战略目标也是一个重要的评判视角，用于评估哪些举措应纳入 CRM 路线图。例如，你可能需要降低那些支持某个因新战略方向而变得不再重要或即将被淘汰的产品线或销售渠道的举措的优先级。\n\
  \n##### 技术问题\n\n大多数 CRM 项目都涉及技术组件，因此作为评估的一部分，了解你组织的技术现状和 IT 路线图会很有帮助，这样你就能相应地调整自己的路线图。例如，如果你的\
  \ IT 部门计划在第三季度对公司网络平台进行全面整改，你或许就不该在第二季度投资整合你的 CRM 应用和网站。重大应用部署、IT 人员数量变化以及 IT 技能结构变化都会影响你的路线图，应予以了解并纳入规划考量。\n\
  \n##### 警示信号\n\n及早发现“警示信号”——即可能危及项目成功的那些问题——能为你争取最多时间来制定应对或规避计划。在进行评估时，持续记录你识别出的警示信号，并考虑如何应对。我们在成功推进\
  \ CRM 项目的过程中常见的警示信号包括：\n\n- **高管支持不足或认同度低**：例如，一位不了解或不信奉 CRM 价值的销售主管，会使得一个以销售为重点的项目极难成功。高管层面的频繁更替也会阻碍\
  \ CRM 项目的发展，因为每位新领导都希望将自己的优先事项强加于项目之上，导致 CRM 无法在任何一个方向上积蓄动力。\n- **有限的 IT 资源，加上不愿投资于咨询支持**：为了持续改进并适应不断变化的业务环境，你的\
  \ CRM 应用需要定期投入。没有 IT 资源（例如开发人员、测试人员）的组织需要准备好通过合同方式获取这些技能，以确保项目的活力。我们常看到投资不足的领域是报表功能，组织似乎总是系统性地低估了相关的工作量。这是一个警示信号，因为有效的报表和分析是\
  \ CRM 为管理层提供关键价值来源。\n- **受影响部门内部业务分析能力薄弱**：CRM 项目需要有注重细节、尽心尽责的管理团队才能成功。这些团队需要有了解组织及其流程，并具备足够应用知识来帮助将业务需求转化为应用能力的人员。\n\
  \n##### 将 CRM 愿景拆分为项目\n\n一旦你完成了评估，应该就能确定多个部门或业务流程可以在人员（例如，人员配置、员工角色和职责等）、流程或技术工具方面得到改进。接下来的目标是将这些改进整合成独立的项目，并按时间表对这些项目进行排序。这是路线图制定的核心。我们在本章前面部分已经描述了分阶段实施方法背后的基本原理，这里不再赘述；在本节中，我们想提供一些你需要考虑的视角，以了解如何将你的各种需求分组到各个项目中，以及如何以最有利的方式对它们进行排序。虽然没有硬性规定，但确实有一系列需要考虑的因素会有所帮助：\n\
  \n\n\n- **业务影响**：你将通过评估了解到组织中需求最大的领域，以及哪些领域最能提升生产力和效率。在其他因素相同的情况下，优先推进这些领域是合理的。\n\
  - **按部门**：围绕单个部门开展项目具有诸多优势；它能最小化所涉及的利益相关方数量，从而简化项目管理。员工能用单一工具（CRM 应用）完成越多工作，他们就更容易看到该工具的价值并接受它。\n\
  - **按业务流程**：仅改变业务流程的*一部分*可能导致脱节且不可行。例如，假设一家软件公司设有客户服务部门和软件质量团队。当问题与软件缺陷相关时，通常会从客服部门升级到软件质量团队。试想一下，将客服部门的问题管理流程迁移到新的\
  \ CRM 应用，但让软件质量团队继续使用旧的 Access 数据库。问题会通过客服部门顺利升级，CRM 工作流处理任务重新分配和通知。但当需要升级到软件质量团队时，流程就突然“掉下悬崖”——客服代表不得不将\
  \ CRM 服务工单中的信息复制粘贴到邮件中，发送给软件质量团队的某人。此人收到后，又需将邮件中的详细信息复制粘贴到 Access 系统中，由其团队处理。此时再无自动化或工作流。客服部门在\
  \ CRM 应用中无法看到问题进入软件质量团队后的状态，因此无法在客户来电时提供任何信息，只能记下留言并跟进。这对员工和客户都不理想，其根源在于将同一业务流程分散到多个\
  \ CRM 项目中。\n- **按地域**：组织如果有地理上分散的团队，且各团队与本地客户合作，则适合开展独立的 CRM 项目。地处偏远或规模较小、倾向于在某一地点处理多种流程的团队，通常愿意并渴望参与能简化其流程的试点项目。\n\
  - **按时长/投入**：大型 CRM 项目可能会陷入困境，有时甚至因自身负担过重而失败——陷入无休止的分析循环或永无止境的开发阶段。在其他条件相同的情况下，在路线图中优先安排一两个范围较小、风险较低的项目是有价值的。如果能让一部分员工成功上线并使用该程序，并开始为组织带来一些收益，这将有助于为\
  \ CRM 在组织中积累动力，并消除 CRM“不切实际”或“永远不会实现”的担忧。你也会开始从员工那里获得真实的反馈，这些反馈可以用于改进未来的项目。\n\n\
  设计项目时还需考虑另一个因素：结果——每个项目的成败如何评判？各部门对其参与的项目期望得到什么结果？理想情况下，每个项目都应包含明确且达成共识的成功标准，以便客观地衡量项目成果。\n\
  \n###### 人员协调\n\n完成 CRM 评估并根据上一节所述因素制定了初步的项目路线图后，你的路线图规划工作尚未结束。启动 CRM 项目所需投入巨大，因此从“人员角度”评估你的路线图草案至关重要。与路线图中涉及的各部门负责人逐一沟通，探讨以下问题：\n\
  \n- **可用带宽**：部门是否清楚了解 CRM 团队针对其参与的项目会提出哪些“需求”？部门能否在必要的时间内抽调合适的人员，以确保项目成功？你的 CRM\
  \ 团队无法独自交付成功的 CRM 项目——每个项目都应被视为 CRM 团队与相关部门之间的伙伴关系。你需要确认每个部门都已准备好并能够各尽其责、充分参与。\n\
  - **认同度**：组织内不同高管对 CRM 项目及其收益的“信任度”各不相同。你可能会发现有些人持怀疑甚至敌对态度，原因可能是他们过往的不良经历或团队的性质。他们可能将\
  \ CRM 项目视为“干扰因素”。如前所述，强大且充满热情的高管支持是 CRM 项目成功的关键因素。因此，如果你遇到此类态度，应将其视为重大警示信号。你或许需要深思熟虑，如何安排和构建涉及由“CRM\
  \ 怀疑者”领导的部门的项目。例如，避免将初始项目设在这些部门；更好的做法是先用其他团队取得早期胜利，建立 CRM 的势头，再着手处理这些部门。如果必须尽早将其纳入路线图，则应尝试扩大项目范围，纳入由职位相当且是“CRM\
  \ 坚定支持者”高管领导的部门，以确保有强大的高管领导力。\n\n\n\n###### 试点项目与“概念验证”项目\n\n试点项目和“概念验证”项目可被视为另一种类型的\
  \ CRM 项目，应根据需求将其纳入路线图。这些特殊项目服务于特定目的——在大规模项目启动前，以小范围、低风险的方式验证特定要素（即流程或技术工具）。这两个术语常被混用，但在我们的术语体系中，它们具有不同的含义。\n\
  \n*试点项目*是指一个完整的项目，它将为整个组织规划的变革应用于一小部分群体，以预览变革对整体组织可能产生的结果。这个项目的完整性体现在受影响的业务单元会改变其实际业务运作方式，而非模拟或测试。例如，在向\
  \ 2000 名美国本土一线销售人员推广用于协作生成客户提案的新流程与技术工具之前，组织可能会选择在洛杉矶办公室的 100 名销售人员中先进行为期六个月的试点。这种方法能最大程度降低组织风险——若变革产生负面影响或未能达成目标，仅影响\
  \ 5%的销售团队。其弊端自然是时间延迟：若试点大获成功，这种保守方式将导致其余销售团队错失六个月的收益。试点成功的关键在于预先设定成果预期——何种成果会触发全组织推广？何种情况会引发方案修改或终止？这些成果如何衡量？由谁衡量？\n\
  \n*概念验证*是一个范围更小的项目，通常旨在全面开发前验证技术工具的可行性。在概念验证中，组织实际业务运作方式不会发生改变；它只是一个研究项目，用于在大规模实施前以小范围方式探索某项技术是否可行。例如，假设一家纸制品公司希望为外勤销售团队配备移动设备，使其能在客户现场通过公司\
  \ ERP 应用发起各类交易（如创建新订单、查询订单状态、申请折扣审批）。移动设备供应商保证可以实现这些功能，但他们未曾将该设备与公司 ERP 系统集成，对实现远程交易所需突破的公司网络安全架构也知之甚少。在启动面向全球销售团队的完整设计与开发项目之前，该公司选择先进行概念验证。目标是构建一个轻量级示例应用，通过远程连接公司\
  \ ERP 系统查询订单状态。这显然是一个小型项目，仅需有限的设计与开发工作（应用无需考虑美观或易用性——销售员永远不会看到它，且只需支持单一交易类型）。但若成功，它将*证明*供应商能够突破公司网络安全架构并与\
  \ ERP 系统交互。证实这些关键点大大降低了大型项目所伴随的风险。与试点项目类似，这种风险缓释的代价是时间与成本——完整项目需在概念验证期间暂停，而加入概念验证阶段将增加整体方案成本。与试点相同，概念验证的目标及何种成果构成“验证”标准，应在项目启动前深思熟虑。\n\
  \n试点项目和概念验证项目都能有效控制 CRM 计划中的风险，但必须考虑其进度与成本影响。\n\n###### 示例路线图实践\n\n在本示例中，我们将以虚构的支付处理软件公司\
  \ IdeaShare 为例。IdeaShare 过去数年保持缓慢但稳步的增长态势，但近期经历了领导层更迭。新管理层希望以更激进的策略推动增长，目标是通过上市或被收购实现价值。为驱动增长，他们制定了新战略计划，包含以下目标：拓展目前尚未涉足的教育与政府市场业务；投资客户服务以扭转疑似影响销售的低劣服务口碑；建立合作伙伴销售渠道；加速开发\
  \ IdeaShare 的下一代产品。IdeaShare 首席运营官菲奥娜·史密斯受 CEO 及所有者的委托，负责探索公司内部 CRM 计划的可行性。\n\n\
  请注意，本示例旨在帮助阐明本章概念；我们优先考虑此目标，而非追求示例的高度现实性。\n\n\n\n####### CRM 评估结果\n\n菲奥娜以一个月时间的访谈开启了\
  \ CRM 项目工作。她与思想维度公司在销售、市场营销、客户服务、产品开发和信息技术等部门的各级人员进行了交流。她还采访了现有客户和潜在客户，了解他们与思想维度公司打交道的体验。在梳理笔记时，菲奥娜注意到了以下几点：\n\
  \n**销售**\n\n*   大部分销售流程要么通过电子邮件驱动，要么依赖微软的 Excel。预测方式相当原始，基于 Excel 进行。每年都会替换掉业绩最差的\
  \ 10% 的销售代表。团队内部缺乏协作或专业发展活动。\n*   销售组织内部在政府或教育市场领域并无相关经验。\n*   新任销售副总裁（上任仅一个月）对\
  \ CRM 应用程序有经验，并且非常渴望有机会将其引入组织。\n\n**市场营销**\n\n*   市场营销工作包括参加行业三大关键年度展会、在主要行业期刊投放平面广告、网络广告以及批量电子邮件营销。\n\
  *   营销团队使用营销总监开发的一个复杂的微软 Access 数据库来管理其活动。这位营销总监对 CRM 不以为然，声称自己“用过所有的 CRM”，但没有一个能像他的数据库那样贴合他们的业务需求。\n\
  *   营销部门的主要抱怨是缺乏来自销售部门关于其线索的反馈——没有人费心去“闭环”，让他们了解线索的后续情况。\n*   在公司内部，营销部门普遍被认为是一个运作良好、高效的团队。\n\
  \n**客户服务**\n\n*   客户通过电话或电子邮件报告问题。通过电子邮件报告的问题会从 `support@ideashare.com` 转发给整个 15\
  \ 人的客户服务代表团队，他们通过电子邮件来“认领”要处理的问题。各个代表正在处理的问题对他人不可见。客户服务经理通过监控电子邮件来防止任何问题“被遗漏”。\n\
  *   客服代表需要在三个应用程序之间来回切换才能为客户服务——使用计费应用程序处理计费问题，使用许可应用程序处理许可问题，以及使用 Bug 追踪器查看已升级给产品开发团队的问题状态。\n\
  *   客户服务经理对他们部门流程的了解是基于传闻的；制定任何衡量指标都是一项艰苦的工作。\n*   培养一名新客服代表上岗所需的时间很长；大多数常见问题及解决方案的知识是“部落式”的，仅存储在资深服务代表的大脑中。在“学徒期”期间，新代表很少能在首次通话中解决问题，通常需要请教资深代表。\n\
  \n**信息技术**\n\n*   信息技术团队保持精简。其员工能够维护公司的网络和关键应用程序，并为用户提供帮助台支持，但没有预算或人员编制来开展新计划。团队成员基本上是纯粹的“技术人员”，而非懂技术的业务人员。\n\
  \n**客户及潜在客户**\n\n*   客户总体上对思想维度公司的产品感到满意，但对他们所获得的服务普遍不满。投诉包括解决问题时间长，以及信息不足的服务代表似乎对同一问题在不同时间给出不同的答案。\n\
  *   无论规模大小，客户都赞扬销售团队理解他们的需求，并愿意投入时间帮助他们了解思想维度公司的产品以及哪些产品最能满足他们的需求。\n\n####### 初步路线图\n\
  \n菲奥娜回顾了她的笔记和观察结果，并就每个团队对 CRM 项目的潜力得出以下结论。\n\n**销售**\n\n销售团队需要在其处理和销售活动的方式上引入更多的结构。对于一个希望上市或寻求收购方的组织来说，“原始”的预测方法是行不通的。一个定义明确且一致的销售流程，结合现代的\
  \ CRM 应用程序，可以解决预测问题。计划中的合作伙伴渠道也需要一个比 Excel 更强大的应用程序来追踪合作伙伴的销售活动。从人员角度来看，鉴于围绕这些市场的战略目标，缺乏教育和政府部门的背景令人担忧。菲奥娜的结论是，为了在这些市场取得成功，需要建立一个由具备所需领域背景的外部人员组成的覆盖式销售团队。最后，无论是小客户还是大客户都反映从思想维度销售团队那里得到了“大量时间”，这一点让菲奥娜感到担忧。销售代表们是否在明智地决定如何投入他们的销售时间？他们是否有足够的信息来判断潜在客户的潜力？这似乎是\
  \ CRM 项目可能带来的另一个改进领域。\n\n**市场营销**\n\n菲奥娜知道，通过结合销售流程的修改（要求代表在关闭线索之前记录线索结果）以及市场营销和销售部门共享的\
  \ CRM 应用程序，可以解决市场营销部门的线索可见性问题。她还知道，当市场营销部门被要求增加线索生成量并将生成的线索分配给新的合作伙伴渠道时，他们的 Access\
  \ 数据库将无法胜任。因此，CRM 在这里显然可以发挥作用。然而，公司合作伙伴渠道的计划在战略规划中处于较晚阶段，而且营销总监显然需要一些说服才能支持 CRM\
  \ 项目。她的结论是，市场营销不应该是 CRM 项目初期阶段关注的焦点。\n\n**客户服务**\n\n菲奥娜得出结论，缺乏结构化的工单管理流程以及支持该流程的应用程序是这里根本的问题。这不仅能防止问题被遗漏，而且对最常见问题类型的更深入了解可以为新代表培训提供信息并缩短他们的上岗时间。通过\
  \ CRM 应用程序而不是电子邮件来管理工单，也更容易生成用于监控小组运营情况的衡量指标。知识库工具（为客服代表提供一个可搜索的地方来汇集他们的知识、流程和最佳实践）也是一个重要的需求；它将有助于新代表的上岗，并减轻资深代表的辅导负担。最后，菲奥娜预测，一些精心设计的\
  \ CRM 集成可以最大限度地减少代表在处理问题时需要兼顾的不同应用程序的数量。\n\n**信息技术**\n\nIT 团队的精简性质对菲奥娜来说是一个警示信号。CRM\
  \ 项目的成功需要一个在技术方面拥有扎实业务理解能力的人，能够将业务需求转化为技术需求，并管理与 CRM 相关的技术工作。他们还必须能够将 75% 到 100%\
  \ 的时间投入到 CRM 项目中。菲奥娜随后为 CRM 项目制定了一个初步路线图，如`表 3-1`所示。\n\n![images](img/t0301.jpg)\n\
  \n![images](img/t0301a.jpg)\n\n菲奥娜的下一步计划是与她的领导团队会面，并与销售、市场营销、客户服务及信息技术部门的负责人单独会面，以完善路线图并讨论成果/成功因素（例如，对于这些项目中的每一项，“完成”意味着什么？）。\n\
  \n\n\n### 中期制定路线图\n\n上一节中的示例路线图描述了 IdeaShare 这一组织正计划初次推行 CRM 项目的情景。但如果你所在的组织已经推出了\
  \ CRM 项目和应用程序，而你的目标是更严格地管理该项目，以帮助更多员工从 CRM 中获得更大价值，那又该如何？本章概述的通用两步流程——先评估、后规划路线图——同样适用于这种情况。从某些方面看，这种情况比“从零开始”更容易。员工已经熟悉了\
  \ CRM 的概念以及组织选定的 CRM 应用程序。挑战在于“第一印象无法重来”。员工对 CRM 已形成看法，且可能难以改变，若为负面看法，则可能阻碍未来的 CRM\
  \ 举措。在这种情况下，确保路线图制定过程透明且具有包容性就显得更为重要。\n\n## 总结\n\n本章涵盖以下内容：\n\n- 采用分阶段方法实施 CRM（由多个较小项目组成）比试图一次性完成一个大型项目更有效、风险更低。\n\
  - 从详细评估当前状况开始规划路线图。\n- 人员协调是路线图规划的关键部分，以确保受影响的团队有足够带宽和动力来支持 CRM。\n- 如果情况合适，可考虑试点项目和概念验证项目。\n\
  \n"
- "# 第 4 章\n\n## 评估软件与顾问\n\n在前两章中，我们看到一个成功的 CRM 项目是人员、业务流程和技术的结合，共同帮助组织实现 CRM 目标。尽管支持\
  \ CRM 项目的技术只是其中一部分，但它对项目的成功影响重大。许多组织因为 CRM 应用程序昂贵、不灵活或难以使用，导致项目受阻甚至被放弃。\n\n本章旨在提供一套流程和关键标准，供你用来选择合适的\
  \ CRM 应用程序以及合适的咨询合作伙伴来支持 CRM 项目。虽然我们分开描述软件和顾问的评估，但实践中这两个过程常常相互交织，因为 CRM 供应商通常在销售周期早期就引入合作伙伴。某款\
  \ CRM 应用程序可能在软件评估中明显胜出，但如果其咨询支持不力，你可能需要考虑其他选择。\n\n### CRM 软件市场\n\nCRM 软件市场广阔且变化迅速。本节不会列出当前主流应用的详细目录，而是描述\
  \ CRM 产品之间的一些关键变量，帮助你理解如何比较和分类应用程序。这些变量包括功能范围、部署选项、应用程序访问方式和许可模式。\n\n#### 功能范围：全套\
  \ CRM 套件与专业应用\n\n传统的 CRM“套件”包含支持三个前端业务功能（市场营销、销售和客户服务）的特性。销售功能通常包括潜在客户管理、销售机会管理和报价制定。市场营销功能允许对潜在客户和客户进行细分，并通过多种媒介（电子邮件、电话和直邮）与这些潜在客户协调沟通。客户服务通常包括问题管理和知识库。除了每个部门从应用功能中获取的价值外，全套\
  \ CRM 套件承诺的价值在于它能促进跨部门的信息共享。如果组织要面向客户呈现统一形象，这种共享是必要的。\n\n此外，还有大量更专业的 CRM 应用程序，它们针对特定的业务功能（例如营销需求生成、客户服务与支持）、特定环境（呼叫中心应用）或特定行业（财富管理、非营利组织）。这些应用在各自领域可能比全套套件产品更便宜或功能更丰富，但在选择专业应用前应仔细考虑。将多个专业的部门级应用整合起来以获取无缝的客户视图所面临的挑战，可能会超过这些应用相对于\
  \ CRM 套件的任何优势。\n\n### 部署模式\n\n在组织内部署 CRM 应用有多种选择，各有不同的成本、风险和收益。本节将介绍最常见的三种：本地部署、应用托管/服务器托管和软件即服务。\n\
  \n##### 本地部署\n\n这是部署 CRM 等客户端-服务器软件应用的传统模式；客户将软件安装在自己场所的服务器硬件上。这种部署模式给予客户最大程度的控制权，因为他们可以根据需要选择和升级服务器硬件。他们可以实施任何偏好的备份和灾难恢复计划。这种模式也便于集成；身份验证和网络安全方面的复杂性通常低于将\
  \ CRM 应用托管在组织网络之外的情况。这种模式的缺点在于服务器硬件和 IT 人员方面的成本。\n\n在 CRM 市场的低端，存在“仅客户端”而非“客户端-服务器”的应用。这些应用旨在作为个人生产力工具，通常面向销售人员。该领域的资深应用是`ACT!`，其他产品包括`GoldMine`和微软的`Business\
  \ Contact Manager`。这些应用是出色的个人生产力工具，但不适合寻求将信息共享与协作纳入 CRM 项目的组织。尽管许多此类供应商已推出多用户、网络版产品，试图在\
  \ CRM 市场低端竞争，但根据我们的经验，这属于“本性难移”的情况。这些产品从根本上并非为企业级使用而设计，应避免选用。\n\n##### 应用托管与服务器托管\n\
  \n在这种模式中，客户购买软件，然后将其安装在第三方场所的服务器硬件上并使用。客户可能拥有服务器（服务器托管），也可能不拥有（应用托管）。软件许可可以是永久许可或订阅模式。对于应用托管，提供商通常提供服务器维护、备份和灾难恢复。对于服务器托管模式，提供商可能只提供电力和网络连接。这些部署模式相比本地部署，IT\
  \ 负担更轻，但控制权也更少。\n\n\n\n#### 软件即服务\n\n**软件即服务**（SaaS）模式，由 [Salesforce.com](http://Salesforce.com)\
  \ 在 CRM 市场中率先采用，如今已站稳脚跟并日益壮大，这得益于近期云计算的兴起，使其成为自行管理技术基础设施的可接受替代方案。该模式试图将企业软件从一种资本资产转变为一种按需购买和消耗的公用服务。\n\
  \n理解软件即服务的最简单方法，或许是将其视为订阅许可（如前所述）与外包、远程服务器基础设施的结合。其最常见的形式是，客户按每用户/每月付费，并通过信用卡支付。软件通过互联网访问，客户对底层基础设施既不可见，也无责任或控制权。供应商通常会承诺一定的服务可用性水平（以“正常运行时间”衡量，即服务可用的营业时间百分比），若未达承诺将面临财务处罚。对于\
  \ IT 资源有限的组织而言，软件即服务模式可能极具吸引力。自行管理基础设施所带来的所有麻烦和可变成本都被消除，取而代之的是一笔可预测的固定月度成本和一项服务——你的员工无论在世界何处，只要能够连接互联网，就可以随时使用。然而，一些组织可能制定了隐私或安全策略，不允许将客户数据托管在公司网络之外。\n\
  \n这种便利性伴随着更高的成本；在典型的应用生命周期内，软件即服务应用程序的总软件成本通常高于本地部署的应用程序。另一个需要考虑的关键因素是非货币性的：即与此类应用相关的控制权丧失。一旦你在某个\
  \ CRM 应用中累积了多年的历史数据并培训了用户，你便在许多方面被“锁定”。此时再迁移到其他应用，成本可能极其高昂。然而，SaaS 提供商可能会以你目前无法预料的方式更改其条款或定价。当他们这样做时，这种高额的转换成本将赋予他们在后续任何谈判中的巨大优势。我们听说，摆脱一个糟糕的\
  \ SaaS 应用就像摆脱一段糟糕的婚姻——往往是一次混乱、充满争议且代价高昂的经历。\n\n#### 应用访问方式\n\n用户与 CRM 应用的交互方式是评估\
  \ CRM 应用时的另一个考虑因素。\n\n- *客户端应用程序*：这种用户在其计算机上安装应用以访问 CRM 的方式正在 CRM 市场中消失，取而代之的是 Web\
  \ 浏览器访问和移动设备访问。这种访问形式的主要优势在于能够提供比当前基于浏览器的应用（尽管 Web 应用正在快速追赶）更丰富的应用功能，并且能够在本地缓存 CRM\
  \ 数据以实现离线使用。\n- *Web 应用程序*：这是当今 CRM 市场中应用访问的主导方式。通过安全的 Web 浏览器访问 CRM 应用。其优势在于随处可访问性；只要计算机能连接互联网，即可使用\
  \ CRM，并且无需在计算机上安装任何软件。部署和维护此类 CRM 应用也极其简单，因为无需在用户计算机上安装、升级或修补任何软件。\n- *移动设备访问*：随着智能手机和平板电脑等手持设备在性能、灵活性和普及率方面的不断提升，通过移动设备访问\
  \ CRM 正变得越来越重要。一个设计良好的移动应用可以对移动办公人员（他们通常希望在拜访客户时记录笔记和安排会议）的用户采纳率产生重大影响。他们还可以利用设备功能（例如，摄像头、GPS）实现新的应用场景，例如生成前往客户所在地的导航路线。\n\
  - *集成 Microsoft Outlook 的应用*：一些 CRM 供应商提供与 Outlook 集成的 CRM 客户端应用或附加组件，以便将 CRM 功能集成到\
  \ Microsoft Outlook 中。CRM 用户有相当大比例的屏幕时间是在 Outlook 中工作，它也是与客户互动的主要工具。通过将 CRM 功能集成到\
  \ Outlook 中，可以简化多个 CRM 用户场景，例如在 CRM 中记录与客户的电子邮件互动和会议，以及创建新的联系人记录。\n\n### 许可模式\n\n\
  对于刚接触企业软件世界的读者来说，目前存在多种不同的许可模式，这些模式对软件的初始成本和持续成本都有影响。这些模式的不同之处在于许可的内容、许可期限、许可的用户类型以及许可的访问方式。这些差异将在下文描述。\n\
  \n#### 许可内容：命名用户、设备、连接数……\n\n命名用户许可指的是一种模式，其中许可证被购买并分配给单个用户；只有这些用户被授权使用该软件，但他们可以使用自己选择的任何计算机或设备来使用。这可能是最常见的许可形式。\n\
  \n有些软件是许可给特定计算机的。这在呼叫中心环境中很常见，在那里多个班次的用户在不同时间使用同一组计算机。无论有多少不同的个人使用它，计算机本身是获得许可的。\n\
  \n在并发许可模式下，组织为特定数量的与应用服务器的并发（即同时）连接申请许可。这通常由服务器软件管理，该软件会拒绝超出所购并发许可证数量的连接。这种模式在软件仅需偶尔使用但用户群体庞大时非常有用。会计软件通常以此方式许可；一个十人会计团队可能只为会计软件包许可三到四个并发许可证，因为这些用户并非一直使用该应用，而是在一天中根据需要登录和退出。\n\
  \n##### 许可期限：永久性许可 vs. 订阅式许可\n\n永久性许可是最为人熟知的许可期限；它至今仍是基于 PC 的软件许可的主要形式。顾名思义，在此模式下购买产品允许用户永久使用该软件的权利。通常会有一些重要的限定条件；在大多数情况下，需要支付单独且重复的维护费用，以获得技术支持和安装使用后续软件版本的权利。如果用户选择不支付维护费，未来的版本通常必须按全价购买。\n\
  \n订阅式许可类似于“租赁”模式。用户仅有权在订阅期内使用软件。通常，技术支持与升级权利已包含在订阅许可中，无需额外付费。\n\n##### 其他需要考虑的许可场景\n\
  \n还存在许多可能与 CRM 软件相关的其他许可场景，在评估过程中，应当了解每个供应商的许可模式如何处理每个相关场景。其中一些场景包括以下几点。\n\n\n\n\
  #### 终端客户与合作伙伴访问\n\n许多业务场景需要非员工以受控方式访问 CRM 软件。以下两个常见示例可说明此情况：\n\n-   组织开发并实施与其 CRM\
  \ 应用程序相连的客户门户。该门户允许客户登录并直接在 CRM 应用程序中查看/输入数据（例如地址更新、电子邮件偏好设置及客户支持工单）。\n-   组织开发并实施与其\
  \ CRM 应用程序相连的合作伙伴门户。该门户允许组织将合格的销售线索分配给渠道合作伙伴，同时渠道合作伙伴可更新销售进展、申请营销材料及注册客户。\n\n由于\
  \ CRM 许可证成本相对较高，为所有需要访问 CRM 的客户和合作伙伴购买此类许可证通常成本高昂。因此，许多 CRM 供应商提供特殊的“外部访问”或“外部连接器”许可证，旨在以合理成本允许非员工访问\
  \ CRM 软件。\n\n#### 只读访问\n\n在组织内部，除了常规的 CRM 应用程序事务型用户外，可能还存在一组仅需查看 CRM 信息、无需输入或编辑信息的用户。常见的例子是高级管理人员，他们不直接与客户打交道，也没有信息需要录入\
  \ CRM，但需要从 CRM 中获取汇总报告并偶尔进行只读访问。\n\n考虑到这些用户较低的使用频率，客户反对为其购买完整的用户许可证。许多 CRM 供应商已对此做出回应，推出了“只读”或“报表”许可证，其价格相比完整许可证有大幅折扣。\n\
  \n### 选择合适的 CRM 软件\n\n选择 CRM 软件可能是一件复杂的事情：市场上充斥着标榜为“CRM”的产品，但它们在成本、功能、复杂性、架构和灵活性方面差异巨大。选择适合您业务的产品充满挑战，需要深思熟虑的流程和一套清晰的评估标准来对候选\
  \ CRM 应用进行评分。\n\n#### CRM 应用评估标准\n\n在本节中，我们将描述一套标准，您可利用这些标准来评估特定 CRM 应用与您组织需求的匹配程度。\n\
  \n##### 与您的组织和目标的一致性\n\n这是本评估标准中最直观、最基础的原则。您需要评估特定 CRM 应用与您的组织、目标及优先事项（依据您自身的 CRM\
  \ 路线图所定义）的契合程度。该标准可进一步细分为以下子标准：\n\n-   *功能/特性匹配度*：如果问题的根源在于服务部门，就不要选择以销售为中心的 CRM\
  \ 应用——这类应用的服务功能往往是事后添加来“凑齐”产品线的。如果您销售团队的移动性很高，请确保所选产品具备符合需求的移动设备平台。\n-   *全球化就绪度*：如果您的员工和客户遍布全球，请仔细审视每个产品的多币种和多语言能力。它如何处理汇率存储与更新？增值税及其他国际税务问题呢？全球字符集呢？您可能会惊讶地发现，许多为美国市场设计的产品无法处理多种语言数据录入所需的双字节字符。同时需询问该应用是否针对地理上分散的办公室之间的广域网环境进行了优化。\n\
  -   *可扩展性匹配度*：如果您的 CRM 用户群体可能增长到 1000 人或更多，请以可扩展性为着眼点，严格审视每个产品的技术架构，并要求每个供应商提供用户数量相近的参考客户。许多\
  \ CRM 应用是为个人和小团队设计的；其在低端市场的成功促使它们向更高端市场进军，服务越来越大的客户。其开发团队试图让应用适合这些“企业”客户，但他们无法摆脱产品底层架构的限制——这根本不适合此类场景。\n\
  \n##### 定制灵活性\n\n一旦您选定了 CRM 应用，您的咨询合作伙伴将通过实施过程与您的组织合作，确定如何利用 CRM 支持业务。你们将共同确定对业务流程和\
  \ CRM 产品的修改，以交付最佳解决方案。方案构建完成后，培训用户并投入生产，您的团队将开始自主运行，咨询合作伙伴的项目团队则会淡出，转而帮助下一位客户。\n\
  \n问题可能由此开始。您的 CRM 设计初衷是支持当前运营的业务。然而，下一个新产品领域、新客户细分市场、新部门以及新的组织结构很快就会接踵而至。如果您无法使\
  \ CRM 系统与时俱进，跟上业务发展的步伐，您会发现随着时间的推移，它的实用性和相关性越来越低，为组织提供的价值也越来越少。一个选择是请回您的咨询合作伙伴来修改系统布局和行为，但这可能需要较长的前置时间来安排资源，花费时间来让新团队熟悉您的业务，并产生成本。更理想的是，您的内部团队能够在重新配置和定制\
  \ CRM 解决方案方面发展出一定程度的自给自足能力。\n\n基于此目标，针对 CRM 产品需要提出的一些关键问题包括：\n\n-   该应用的定制和配置能力如何？\n\
  -   提供了哪些工具？\n-   不同类型的定制需要哪些技能？\n-   如何开发自定义报表？\n\n然后，将这些问题答案与您内部团队成员的技能进行比较，并考虑必要时在市场上获取这些技能的成本，从而评估您在没有外部支持的情况下发展“演进”系统能力的可行性。\n\
  \n##### 与现有基础设施的一致性\n\n此标准是关于在评估潜在应用时，不应孤立对待，而应将其置于您组织现有客户数据平台的背景下进行考量。我所说的“客户数据平台”是指用于存储和处理客户信息的现有系统，例如财务核算系统、服务管理系统、客户门户网站、电子邮件系统等。由于\
  \ CRM 应用以客户为中心，它们需要与其他系统集成和交互，因此应尽可能建立在兼容的软件基础设施之上。这将使您能够以最小的难度和成本开发这些集成，并简化客户数据平台的管理。您的技术环境中使用的技术种类越多，IT\
  \ 团队需要掌握的技能就越多，这可能导致团队规模扩大，从而影响成本。例如，如果您的组织使用 Oracle 数据库运行 SAP 财务核算系统，并使用 Lotus\
  \ Notes 处理电子邮件，那么 Microsoft Dynamics CRM 可能不是最佳的 CRM 解决方案选择，因为它运行在 SQL Server 平台上，并与\
  \ Microsoft Outlook 电子邮件客户端紧密集成。\n\n\n\n#### 用户体验\n\n可用性是评估 CRM 解决方案时至关重要的因素。如果你思考\
  \ CRM 项目成功所需的各个环节，用户采用率往往是最薄弱的一环，也是许多项目失败的根源。说得更直白些，糟糕的用户体验比任何其他因素都更可能导致 CRM 项目失败。CRM\
  \ 战略依赖于每个面向客户的员工的参与；在大多数情况下，这些员工的关键作用是通过在 CRM 应用程序中输入数据，向组织其他部门提供有关其客户及互动情况的信息。\n\
  \n如果 CRM 应用程序难以使用、学习或耗时过长，就会与最终用户产生摩擦。这种摩擦最终可能导致用户放弃 CRM 解决方案，尤其在以下任一情况成立时：\n\n\
  -   用户认为其使用几乎没有直接益处。\n-   你的企业文化中，管理层无法或不愿将 CRM 作为业务的强制组成部分。\n\n一旦这种放弃趋势开始，就会像正反馈效应一样加速发展。最终用户对\
  \ CRM 解决方案的贡献越少，系统生成的管理报告价值就越低，CRM 作为监控绩效和团队活动的工具作用也越小。这会削弱管理层对该工具的热情和投入，从而使用户更容易放弃此解决方案，如此循环。\n\
  \n有多种策略可以防止这种情况，并确保 CRM 的采用和成功。许多是与人及流程相关的策略，并且很大程度上与实际使用的 CRM 应用程序无关。然而，在选择 CRM\
  \ 软件时，用户采用率绝对是一个考量因素。从应用程序的角度来看，促进采用的关键因素是易用性和它能为最终用户提供的价值。为评估可用性和最终用户价值，你需要试图了解应用程序的以下几个方面：\n\
  \n-   为了达成你对 CRM 的要求，每个最终用户角色（销售人员、客服人员、市场协调员等）需要在 CRM 应用程序中做什么？\n-   访问和使用该解决方案难度有多大/耗时有多长？完成上一项中确定的任务需要多少次点击和多少个屏幕？\n\
  -   用户学习该解决方案的难度如何？它与用户已经使用或熟悉的工具相似度有多高？\n-   该解决方案在哪些方面为最终用户提供了价值？它在哪些方面加快或消除了手动任务，或提供了他们目前不具备的新洞察？对每个最终用户角色而言，CRM\
  \ 应用程序净属`工作制造者`还是`工作减负者`？\n\n如果你对这些问题的评估普遍持否定态度，并且发现 CRM 可能对你许多最终用户来说是净`工作制造者`，那么你需要将其与\
  \ CRM 在业务其他方面增加的价值进行权衡，并仔细考虑尽管存在此问题，你仍能推动该工具被采用的可能性。\n\n#### 技术标准\n\n此标准与“与你现有基础设施保持一致”有很多共同点，但这里，你试图了解的并非\
  \ CRM 应用程序底层技术与现有基础设施的比较，而是它在多大程度上基于行业标准技术构建。如果你在技术咨询领域待得够久，就会听闻一些恐怖故事：有的企业长期固守老旧的应用程序，或使用晦涩技术定制开发了一个。然后他们找不到任何理解并能操作该程序的开发人员或顾问。它很难甚至无法与其他系统集成。报告工具无法访问它。它从多方面引发麻烦，并且运营成本可能高得惊人。相比之下，构建在标准平台（标准数据库、标准编程语言、可通过符合标准的网络服务访问）之上的应用程序则易于处理得多。\n\
  \n#### 供应商实力与生态系统\n\n你选择的 CRM 应用程序背后供应商的实力、投入度和活力是一个重要的选择标准，因为 CRM 应用程序的生命周期很长，而更换\
  \ CRM 应用程序可能是一项复杂且昂贵的工程。你希望选择一个会持续投资其 CRM 应用程序的供应商，以开发创新的新功能，利用新技术，并在其依赖的其他产品更新时相应地更新自己的应用程序。因此，在评估那些非上市公司（因其财务状况难以判断）、市场份额持平或下滑、不盈利，或刚进入\
  \ CRM 市场的供应商时，务必谨慎。\n\n供应商的`生态系统`指的是围绕 CRM 应用程序的支持性产品和组织社区。生态系统的要素包括：\n\n-   *咨询合作伙伴：*\
  \ 具备安装、配置和定制 CRM 应用程序技能和经验的服务公司。\n-   *独立软件供应商（ISV）：* 生产附加或互补产品以增强 CRM 应用程序能力的软件公司。\n\
  -   *培训机构：* 专门培训 CRM 应用程序用户和管理员的服务公司。\n-   *用户组：* 通常为本地性质的协会，由定期会面、交流最佳实践和分享 CRM\
  \ 应用程序使用经验的客户组成。\n\n一个充满活力的、不断成长的供应商与一个繁荣的生态系统通常是相辅相成的。强大的生态系统将为您作为客户带来更好的体验；您会发现一个庞大而成功的\
  \ ISV 社区，拥有更多种类的产品、多个经验丰富的本地咨询合作伙伴供选择、便捷的培训选项，以及一个活跃的客户社区，可以相互交流和学习。\n\n##### 成本\n\
  \n了解获取和部署 CRM 应用程序的成本。这应尽可能包含所有成本——这里相关的行业流行词是*总拥有成本*（TCO）。不仅要考虑硬件、软件许可证和咨询等直接成本，还要考虑管理该应用程序所需内部资源的数量和类型及其相关成本。这些成本应考虑一个合理的时间段；我们通常建议考虑五到七年。\n\
  \n关于成本的话题，如果不提及 CRM 实施的*投资回报率*（ROI）分析，则是不完整的。坦率地说，这很可能不值当。正在准备对新的 CRM 应用程序进行大规模投资的组织，通常希望进行\
  \ ROI 分析，以描述 CRM 投资的回收期和回报来源。他们通常会要求供应商提供此分析或协助其构建。根据我们的经验，这几乎总是浪费时间，因为这种分析很少是可信的。CRM\
  \ 根本就不是一种能轻易量化收益的产品。做出更好的商业决策值多少钱？服务人员与销售团队共享系统并能轻松提醒他们机会，由此带来的新销售值多少钱？分析师很快就发现自己只能猜测数字，试图找出听起来`合理`的数值，以便为分析量化这些收益（例如，`每月将有\
  \ 20 个新增潜在客户通过 CRM 应用程序从服务部门传达给销售部门`）。通常可以包含少数几个可量化的场景——通常围绕简化报告流程——但这些最终并不能描绘出完整的图景。\n\
  \n有些投资决策可以通过详细而严谨的 ROI 分析来辅助决策，但 CRM 应用程序的选择不属于此类。\n\n\n\n### 软件评估流程\n\n本节概述的流程可用于从竞争激烈的市场中为您的组织挑选最合适的\
  \ CRM 应用。我们将详细描述该流程，但在深入探讨之前，有几个关键点需要重点说明：\n- 整个评估工作的基础，是对您组织的状况、计划和需求进行深入周到的研究。这项工作通常体现在\
  \ 第 3 章 所述的 CRM 路线图中。如果不了解“合适”对您而言意味着什么，就无法选出合适的应用。\n- 在整个流程中，务必对每个产品和供应商使用相同的标准并收集相同的信息。整个流程的目标是尽可能促进进行公平的比较。许多供应商会“建议”一个偏向其自身产品的评估流程；如果您最终对每个产品采用不同的流程，您将无法进行有效比较并做出选择。\n\
  \nCRM 评估流程包含 图 4-1 所示的步骤。\n\n![images](img/0401.jpg)\n\n**图 4-1.** CRM 应用程序评估流程\n\
  \n#### 评估准备\n\n以下是评估的准备工作步骤。\n\n##### 确定评估团队\n\n每个利益相关者群体都应有代表成为评估团队的成员；这包括将使用新\
  \ CRM 应用的每个业务部门的经理，以及能够从技术角度评估该应用的信息技术部门代表。理想情况下，最终决策者应在此层面参与，但在许多情况下这是不可行的。\n\n\
  #### 制定评估评估指南\n\n该文档描述了所有需要评估的具体项目，并将用于评估和记录每个 CRM 应用在各项目上的表现。确切的文档结构并不重要，应反映您自身的情况和需求。\n\
  \n表 4-1 描述了一个示例评估指南。该文档以表格形式组织，评估项目按标准区域排列。每个项目都设有列，用于记录相对重要性、被评估的 CRM 应用对该项目的满足程度以及备注部分。\n\
  \n![images](img/t0401.jpg)\n\n![images](img/t0401a.jpg)\n\n![images](img/t0401b.jpg)\n\
  \n##### 成本评估\n\nCRM 供应商采用的不同许可模式有时会使公平比较变得困难。最佳方法是定义一个标准成本框架，然后让每个供应商针对其应用完成该框架。表\
  \ 4-2 给出了一个示例模板，但您应根据自身情况按需调整。\n\n![images](img/t0402.jpg)\n\n以下是关于该模板的一些说明：\n-\
  \ “服务器硬件”适用于需要安装在您自有数据中心服务器上的本地部署 CRM 应用。第 5 年出现的重复成本代表着定期的硬件升级。\n- “CRM 软件许可”行表示支付给\
  \ CRM 软件供应商的总成本，不包括实施费用。\n- “系统维护/管理”旨在汇总与维持 CRM 应用运行相关的成本。例如，如果需要一名全职管理员，则需将该资源的成本纳入分析。这是一个难以精确估算的因素，但一些指导原则可能会有所帮助。软件即服务供应商在这一领域的成本通常较低，因为该模式不涉及服务器管理（修补、备份和灾难恢复）。然而，大部分管理成本与用户支持、报表支持和业务分析相关，这些与部署方式无关。总体而言，一个有用的预算经验法则是：对于小型\
  \ CRM 部署（按用户/范围衡量），预算为 0.25 至 0.5 个全职人力工时；中型部署为 1 至 3 个全职人力工时；大型部署为 4 至 8 个全职人力工时。\n\
  - “咨询服务”在第 1 年包含初始实施费用，并在第 2 年包含较小规模的费用。通常，在头一两年，与您的咨询合作伙伴签订某种支持协议是很有用的，因为您的内部团队仍在熟悉应用。如果您投入内部资源来管理和运营\
  \ CRM，那么对这种支持的需求预计会逐渐减少，但您可能仍会需要合作伙伴参与重大的开发工作或 CRM 版本升级（这就是为什么第 6 年咨询服务中额外包含了 40,000\
  \ 美元的费用）。\n\n##### 确定并研究潜在供应商\n\n有多种潜在方法可以识别潜在的供应商和 CRM 应用，并将范围缩小到少数几个进行全面的评估。以下是关于\
  \ CRM 应用和供应商的一些信息来源：\n- *分析师报告*：主要的技术分析公司（Gartner、Forrester、Aberdeen 等）都会关注 CRM\
  \ 市场，并定期发布报告，详细介绍市场上的供应商及其相对的优劣势和前景。这些报告通常由被重点介绍的供应商自己提供。\n- *CRM 媒体*：有一些专注于 CRM\
  \ 的商业期刊。\n- *同行交流与行业组织*：这不仅是了解其他企业正在使用什么应用的好途径，也能让您感受到不同供应商的客户对其应用的满意度。\n- *用户组*：市场份额较大的供应商很可能在您所在的地区设有活跃的用户组。多数用户组都欢迎潜在客户参加会议，这是获得关于产品“未经筛选”观点的好地方。\n\
  - *财务报告*：如果您正在研究的供应商是上市公司，它们的年报可以为了解其业务健康状况和战略方向提供参考。\n- *CRM 会议*：虽然参会费用可能不菲，但对于短名单上的供应商，参加他们的客户会议会是极富教育意义的经历。您将有很多机会了解产品、听取客户分享他们的成功与挫折，并亲眼目睹供应商的生态系统全貌。\n\
  \n这项初步研究的目标是将 CRM 市场缩小到一个由两到三个应用组成的“短名单”，以便进行全面的评估。\n\n\n\n#### 发现阶段\n\n发现阶段的目标是让供应商了解您的组织及其需求，使其能够阐述并演示其应用程序将如何满足您的具体要求，并让您对每家供应商的应用程序有一个概览性的熟悉程度。\n\
  \n有些人倾向于将客户与供应商的关系视为天然对立，不愿分享有关自身情况和目标的详细信息。根据我们的经验，这种观点并无益处。它会迫使供应商进行泛泛而谈的演示，价值有限，并将评估应用程序是否合适的大部分工作不公平地推给客户，而本应与供应商共同分担。发现过程是双向的：供应商了解客户的需求，以及他们需要提供哪些信息来支持评估；而客户则了解供应商及应用程序的细节。\n\
  \n每家供应商可能都有自己收集您 CRM 需求的方法，让他们各自按自己的方式组织流程通常没有坏处。您可以提供的一种方法是“工作跟随”，让处于关键岗位、将成为 CRM\
  \ 应用程序用户的员工参与，供应商与这些用户坐在一起，观察他们的活动以及现有工具如何支持他们。\n\n客户在这一阶段的重要任务包括：\n\n-   为每家供应商全面介绍业务概况以及推动\
  \ CRM 计划的原因。\n-   引导每家供应商了解评估指南，使其清楚在演示中必须满足哪些需求。\n-   确保向每家供应商传达相同的信息。\n\n计划让评估团队中的主题专家以及可能的\
  \ CRM 执行发起人在此阶段与供应商会面。供应商可能希望与这些人员会面，就您的情况提出澄清性问题。准备一份详细、定制化的演示内容对供应商而言耗时费力；他们会竭尽全力确保对情况以及决定选择的驱动因素有完整的理解。完成发现阶段所需的会议次数将取决于您组织的规模和\
  \ CRM 需求的复杂性；一个只有单一地点、仅需导入和筛选潜在客户工具的小型企业，其流程将比一个试图向数百或数千用户推广集成的销售、营销和客户服务应用的全球性企业简单得多。\n\
  \n#### 供应商演示\n\n这是流程中每家供应商正式阐述其解决方案如何满足您的需求、为何优于竞争对手以及可能产生何种成本的环节。安排演示时，应留出足够的准备时间，让每家供应商能够制定出针对您组织需求的高质量演示方案，并且不要在同一天安排多家供应商；这些会议对参与各方来说都可能非常耗费精力。以下是一些充分利用供应商演示的指南：\n\
  \n-   坚持要求供应商明确说明演示中的哪些元素是标准功能，哪些是第三方附加组件，或者是为此次演示或某位客户后续定制开发的。对于定制开发项目，询问涉及的大致开发工作量。\n\
  -   坚持要求每家供应商演示关键的用户体验场景。如果这些场景是标准功能，他们应能展示如何在应用程序中完成这些操作。\n-   确保您在演示结束时，评估指南和成本评估都已填写完整。\n\
  \n#### 后续阶段\n\n在完成供应商演示并与内部团队进行总结汇报后，理想情况下，您将能够根据各应用程序在评估标准上的表现及其成本对其进行排名。接下来的主要步骤是核实客户评价。此外，此时如果供应商尚未介绍实施合作伙伴，您应向他们征求建议，推荐当地那些在成功交付项目方面拥有良好业绩记录的公司。我们将在本章后面介绍评估咨询合作伙伴的方法。\n\
  \n核实客户评价是评估过程的重要部分。要求提供两到四个客户评价，这些客户要么来自您的行业，要么具有类似的面向客户的流程。虽然本地客户因有面对面交流以及亲眼看到应用程序“实际运行”的前景而颇具吸引力，但地点的重要性不及找到与您组织最为匹配的客户评价来源。充分的准备将使您能够从客户评价会议中获得最大价值，并充分利用对方的时间。以下是本次讨论的一些建议问题/主题：\n\
  \n-   实施经验\n    -   初始实施项目的范围是什么？\n    -   项目耗时多久？\n    -   成本是多少？是否有成本超支？这些情况是如何告知您的？\n\
  \    -   哪些部分进展顺利，哪些部分具有挑战性？\n    -   关于该应用程序，有什么让您感到意外？\n-   用户采纳\n    -   用户对该应用程序的采纳情况有多成功？\n\
  \    -   哪些应用程序区域给用户带来最多困扰？\n-   成本\n    -   需要多少全职员工以及什么角色来支持和维护该应用程序？\n-   整体体验\n\
  \    -   如果让您再次做决定，您还会选择这个应用程序吗？\n\n#### 选择\n\n结合已完成的评估指南、成本评估以及入围应用程序的客户评价报告，应该可以得出清晰的排名。如果您的合作伙伴评估与应用程序评估同时进行，这通常是常见做法，那么每家应用程序对应的合作伙伴实力无疑也应作为一个考量因素。合同谈判在选定之后进行。\n\
  \n##### 变体：现场访问\n\n客户评价核查的一种变体是现场访问，即供应商协调组织一次到现有客户现场的访问。这样可以与更多不同角色（用户、经理、管理员和\
  \ IT 人员）进行更详细的讨论，并有机会进行工作跟随，亲眼看到应用程序的实际运行。\n\n##### 变体：试点项目和概念验证项目\n\n在某些情况下，使用前述流程选择并实施\
  \ CRM 应用程序被认为风险过高，不可接受。试点项目或概念验证可以进一步验证所选应用程序是否能够实现组织目标，但需要额外的预算，并且会延迟决策和实施时间。\n\
  \n`概念验证`通常涉及安装应用程序的试用版本，并投入足够的咨询预算来配置应用程序，以探索和验证风险最高的场景。该应用程序绝不用于生产数据。\n\n`试点项目`则指范围有限但完整的实施，通过一部分用户在生产环境中评估该应用程序。例如，一家公司可能先将\
  \ CRM 实施到一个较小的子公司或特定的地理区域作为试点，然后再决定是否在全组织范围内推广。\n\n无论是试点项目还是概念验证，其目标都是使组织能够做出基于现有信息无法做出的决策。要使这些努力具有任何价值，必须事先明确规划出结果将如何导向决策。以下是一些关键问题：必须证明什么才能对更大的项目做出“放行”决策？这能否客观衡量？如果能，如何衡量？如果不能，决策时将采用谁的解读？\n\
  \n\n\n### 选择合适的顾问\n\n评估咨询合作伙伴比评估应用程序要简单得多。与评估应用程序一样，需要考虑多项标准。但在考虑标准之前，您可能正在问自己一个更根本的问题：我到底是否需要顾问？CRM\
  \ 供应商投入大量营销精力强调其应用程序的易用性和部署速度。演示让配置看起来像点击操作一样简单。我们难道不能自己做，省下这笔钱吗？\n\n作为以帮助组织成功实施\
  \ CRM 为职业的个人，您可能会认为我们对这个问题的回答缺乏可信的客观性，但我们坚信顾问所创造的价值。以下是咨询合作伙伴能带来的几个具体示例：\n\n-  \
  \ 对特定 CRM 应用程序拥有深厚的技术技能和经验。咨询合作伙伴可以通过了解 CRM 应用程序的所有功能和平台能力，以及如何最好地利用它们来解决您的特定业务问题，从而帮助您设计出满足业务需求的最优解决方案。此外，配置和开发工作可以由咨询合作伙伴更快地完成；在大多数情况下，他们不是“边做边学”，并且通常可以利用过去项目中积累的预置解决方案库。\n\
  -   对 CRM 实施流程有深刻理解，包括如何有效开展需求和设计会议、如何管理开发和测试环境、如何将数据迁移到 CRM，以及如何最好地培训一线销售代表等等。您的组织中可能从未有人做过这些事。\n\
  -   在成功组织如何使用 CRM 应用程序方面拥有丰富的经验，包括它们如何将自身流程与所选应用程序融合，以提供最佳客户体验或简化运营。\n\nCRM 通常是组织的一项重大投资；使用优质的咨询合作伙伴是一种风险缓解措施，有助于确保这项重大投资获得回报。\n\
  \n### 评估标准\n\n评估顾问通常比评估软件更简单。以下标准将帮助您为 CRM 项目做出明智的合作伙伴选择。\n\n##### 实施 CRM 应用程序的经验\n\
  \n最明显的标准是合作伙伴在您所选应用程序方面的经验。理想情况下，合作伙伴应拥有数年使用该应用程序的经验，并且其团队中有多名具备此经验的独立顾问。如果 CRM\
  \ 供应商提供合作伙伴认证计划，请询问每家合作伙伴在该计划中的级别。\n\n在确定项目范围后，需询问潜在合作伙伴在每个项目元素上的经验和熟练程度。例如，如果您需要定制组件，请了解合作伙伴编程人员的经验和深度。如果您需要与任何现有业务线应用程序集成，合作伙伴会推荐哪种集成工具，以及他们何时成功部署过此类集成？\n\
  \n##### 您的行业经验\n\n一个成功的 CRM 实施项目是双向教育的过程；您向合作伙伴学习应用程序知识，而为了有效开展工作，他们必须了解您和您的业务。如果合作伙伴曾与您所在行业的组织合作过，他们将在学习过程中占据优势。\n\
  \n##### 与您组织规模相匹配的经验\n\n不同规模的组织会给成功的 CRM 实施带来不同挑战。风险领域、业务场景和实施方法会因组织规模而变化。不要期望小型企业合作伙伴能够在企业级层面成功运作，也不要期望企业级合作伙伴能够适应和调整以满足小型企业的需求。\n\
  \n##### 人员配置方案和项目管理方法\n\n确保您了解每个合作伙伴为您项目制定的人员配置方案。有多少顾问，分别担任什么角色？这些顾问会同时参与多少个其他项目？理想情况是拥有专职资源；如果任何合作伙伴要求其人员同时处理超过两个项目，那将是一个严重的危险信号。CRM\
  \ 项目的复杂性使得同时有效管理多个客户的进度、配置和需求变得非常困难，最终往往会顾此失彼。\n\n了解潜在合作伙伴的项目管理方法。寻找能够实现以下目标的方法：\n\
  \n-   让客户了解项目进度和预算状况\n-   防止项目出现“意外”超支\n-   在项目适当节点设置审查和审批里程碑，以防偏离轨道\n-   让您的内部团队准备好，在项目完成后能够管理\
  \ CRM\n\n##### 地点\n\n技术正在使远程工作人员更容易参与项目，而不再有历史上与地理分散项目团队相关的沟通问题和由此产生的生产力损失。然而，与一个非本地或计划为您的项目分配远程资源的合作伙伴合作，仍有一些考量因素。\n\
  \n某些项目角色适合远程工作。开发和测试工作通常可以由远程人员成功完成，尽管我们建议额外花时间确保规格说明足够详细，因为远程开发人员本质上比现场参与业务流程和设计会议的开发人员更难把握客户需求。\n\
  \n我们建议不要尝试使用远程资源来执行流程分析和应用程序设计这两个项目组成部分；项目的这些阶段正是我们之前描述的双向教育发生的时候，这最好面对面完成。一起待在配有白板的会议室里所花的时间是无可替代的。\n\
  \n因此，对于远程合作伙伴，请确保他们计划让分析师和设计人员现场工作，并了解相关成本，因为差旅费用会转嫁给客户。\n\n##### 成本\n\n实施 CRM 的咨询成本因项目范围而异，差异巨大。从希望部署基本\
  \ CRM 功能以支持其计划增长的中小型市场企业，到需要复杂集成和多源数据迁移的大型企业。一个大致的经验法则是，软件与服务的成本比例预期为 1:0.75 到 1:2，该比例随组织的复杂性而变化。\n\
  \n\n\n##### 针对咨询合作伙伴的推荐调查\n\n对咨询合作伙伴进行推荐调查，其重要性不亚于对 CRM 应用供应商的调查。与供应商一样，请尝试与每个潜在合作伙伴的两到四位推荐客户沟通，并力求找到与您组织及项目范围最匹配的客户。\n\
  \n除了合作伙伴的总体表现及客户的满意度外，向咨询合作伙伴的推荐客户深入了解的一些具体领域如下：\n\n- **团队的稳定性**：一些咨询公司将项目（尤其是大型项目）视为“旋转门”，定期轮换顾问，原因可能是竞争项目需要人员，或者顾问需结束其他项目以向其他客户提供较短的项目启动周期并保持高利用率。这些人员变动可能具有破坏性且低效，因为新资源需要熟悉情况，而离开的资源总会带走一些信息。请避免选择将此视为常态而非例外的合作伙伴。与此相关的一点是，要询问顾问在该组织的任职年限。高流动率可能是该组织存在问题的危险信号，可能会影响您的项目。\n\
  - **预算执行情况**：CRM 咨询合同通常按工时及材料计费结构签订，这意味着项目没有像固定费用或不超过上限安排那样的内置成本“上限”。采用工时及材料方式是有必要的，因为项目在开始时无法被充分定义，以至于咨询合作伙伴无法在不加入过高安全边际（从而导致项目成本高到无法接受）的情况下提供固定报价。然而，其结果便是，合作伙伴的预算执行情况是需要了解的一个非常重要方面。一些咨询合作伙伴倾向于为了赢得项目而低价投标；了解合作伙伴过去与预算估算相比的执行情况，应有助于评估其可能产生的真实成本并据此进行规划。\n\
  - **文档与知识转移**：在您的 CRM 合作结束数月后，您可能需要更改某项自定义逻辑的功能方式、修改培训文档，或重新审视 CRM 应用与其他业务应用之间的信息集成方式。优秀的合作伙伴会留下一套详尽且组织良好的文档，描述应用及其完成的工作，并会带领您的一位或多位员工了解这些文档。糟糕的合作伙伴则只会留下一堆杂乱无章的文档，有的完整，有的不完整，这可能迫使您像侦探一样去弄清楚您的应用是如何工作的以及为何如此开发。\n\
  \n### 最后思考\n\nCRM 选择过程可能令人感到不知所措且望而生畏。理想情况下，本章通过概述一套系统性的选择流程，已经减轻了您的部分压力。一切始于您的\
  \ CRM 路线图，随后是精心制定评估指南。一旦指南完成，它将成为您的试金石，帮助您专注于重要事项，避免被供应商演示和介绍中的花哨噱头所分心。\n\n"
- "# 第 5 章：规划初始 CRM 实施\n\n至此，本书已讨论了将对 CRM 项目成功产生重大影响的一些要素。当您和您的团队在 CRM 实施的初始阶段工作时，牢记一个成功\
  \ CRM 项目的各个组成部分，将有助于您专注于手头的任务。\n\n本章中，我们将重点规划 CRM 项目第一阶段的实施。我们将引导您了解实施的典型阶段，聚焦于如何划分可用工作，并讨论一些可能成就或破坏实施的具体细节。更具体地说，我们将关注应在项目开始前进行评估或完成的概念。尽管许多概念之间互不相关，但评估每个高层级项目至关重要。在尝试有效规划您的计划时，它们都非常重要。我们将概述图\
  \ 5-1 中展示的概念。\n\n![images](img/0501.jpg)\n\n**图 5-1.** 方法论组件概览\n\n最后，正如我们在第 3 章中讨论的，在完成本章的任务和文档时，始终牢记您的\
  \ CRM 路线图，这将有助于引导您并解答出现的任何问题。\n\n## 管理 CRM 项目\n\n执行 CRM 项目的初始阶段，需要您在严格的项目管理与分析方法和满足最终用户需求、为其创造最终价值所需的灵活性之间取得平衡。维持严格方法所需的大部分基础工作已在您制定\
  \ CRM 路线图时完成。其余部分可在实施的初始阶段完成。\n\n此时，有必要回顾一下 CRM 路线图或项目与特定项目或阶段之间的区别。本章中的实施是特定于项目的。通常，一个项目会有明确的开始和结束日期，并向最终用户交付有限的功能集。每个项目都将构成更大路线图或计划的一部分。\n\
  \n在下一节中，我们将开始向您概述构成项目的要素。首先，我们将向您介绍实施的典型阶段。\n\n### 理解项目阶段\n\n存在数十种用于实施技术应用的常用高层级方法论。从一开始，许多组织就对某种方法论有偏好，坦白说，大多数方法论都可以用于或改编以适应您的\
  \ CRM 项目。根据我们实施 CRM 应用的经验，我们将提供一些关于最常用且最成功方法论的信息，并推荐一个最终综合了多种方法优点的流程。这将为您在组织中实施应用时提供可用的工具。\n\
  \n\n\n#### 软件开发生命周期 (SDLC)\n\n`SDLC` 是一个用于创建或修改系统的高层级流程及相关任务集合。本章稍后概述的方法论都利用了经典`SDLC`流程的某些部分，因此在实施过程中，当你为每种方法论寻找最佳实践时，将有机会利用其中的不同组件。话虽如此，它们往往在以下方面存在差异：完成任务的速度、在任务完成与继续推进之间的灵活性，以及它们鼓励你跟踪和利用的详细程度。`SDLC`的通用组成部分如下：\n\
  \n> *规划/分析：* 规划/分析活动，通常也称为*设想阶段*，是概述项目目标、定义项目投资回报率（ROI）以及为实施阶段确定角色和职责的地方。同时，此活动也完成应用程序的设计，并收集、审查需求，与团队评审，最终以某种形式确定下来。这种设计可以采用多种方法，其中一些变体将在后续文本中提及，但最终，在此阶段结束时，实施阶段的需求已被识别并锁定。\n\
  >\n> *实施：* 实施活动专注于构建在实施规划/分析阶段确定的任何范围内的项目。在`SDLC`的这一活动期间，还会进行单元测试，并根据需要修复错误。根据你选择的设计方法，构建阶段所需时间可能多也可能少，但最终，当此阶段结束时，应用程序的开发将完成。许多非常关键的实施组件，包括各种类型的测试，也需要在此时完成。我们将在本章后面更详细地介绍各种测试类型。\n\
  >\n> *部署与支持：* 部署活动侧重于向最终用户推出应用程序，并在发布后提供支持。正是在实施的这一环节中，会进行最终用户和管理员培训。随后，应用程序将推送给最终用户，并在部署后提供相应的支持。\n\
  \n第 6 章的大部分内容将专注于为上述要点提供更多细节。将概述关于设计、开发、测试、培训及部署的具体细节。对于本章而言，既然我们已经确定了作为实施一部分要完成的高层级活动，接下来我们将为实施这些活动的各种方式提供更多细节。\n\
  \n## 瀑布模型方法论\n\n在技术领域，更具体地说，在 CRM 实施中最常用的方法论之一是瀑布模型。这种方法论被设计为一系列连续的步骤，一个接一个，各个阶段如同瀑布般流动。图\
  \ 5-2 展示了一个简单的瀑布模型图形示例。\n\n![images](img/0502.jpg)\n\n**图 5-2.** 瀑布模型方法论\n\n对瀑布模型方法论而言，最重要的是顺序。通常，一个步骤必须\
  \ 100%完成才能进行下一步。此外，这种方法论非常注重文档化。瀑布模型僵化的结构常常给实施团队带来问题。CRM 项目很少直线推进，因此，拥有创造性和调整项目计划以适应团队需求的能力非常重要。对文档化的高度关注也给项目团队带来了沉重负担。利益相关者往往因为自己的“日常工作”而分身乏术，再加上详细文档的负担，常常导致他们的所有工作都受到影响。\n\
  \n## Scrum 方法论\n\n另一种常见的方法是 Scrum。这种方法论的主要前提是短而固定周期的设计和开发循环。Scrum 周期通常为两到四周，并且包含非常固定的范围。这些周期通常被称为*冲刺*。每个冲刺都以一次讨论开始，项目团队在会中评审收集到的所需功能列表。然后，团队识别出能够在两到四周的冲刺周期内成功开发的功能，接着开始工作。\n\
  \nScrum 方法论的一个关键前提是，一旦确定了冲刺，就不能更改。话虽如此，另一个关键原则是灵活性。由于冲刺持续时间短，用户群体可以更容易地改变想法或处理需求的方法，并在随后的冲刺中实施该更改。被识别为下一个冲刺功能的项目被称为*冲刺待办列表*。\n\
  \n尽管冲刺时间很短，但`SDLC`中确定的许多活动仍被使用，尽管是以一种简化的方式。简短的设计和开发阶段之后是新功能的演示。这个演示替代了较长项目中更详细的培训活动。本质上，使用\
  \ Scrum 方法论的项目团队会定期、简短地开会，涵盖冲刺生命周期中在规划/分析阶段讨论的任何事项。从组织角度来看，图 5-3 展示了如何查看一个包含多个冲刺的项目。\n\
  \n![images](img/0503.jpg)\n\n**图 5-3.** Scrum 方法论\n\n\n\n## 迭代开发方法论\n\n上述两种方法论在与\
  \ CRM 实施结合时都存在一些局限性。根据我们的经验，实施失败的最大原因之一是缺乏用户认同。瀑布模型的一个挑战在于，必须完成一个阶段才能开始下一个阶段，这要求项目团队制定非常详细的设计文档。该文档是在最终用户参与下制定的，并在开发开始前进行评审。最终，用户群体下一次看到应用程序是在用户验收测试期间，因此这种方法可能会让用户对某些假设或取舍感到惊讶或失望。\n\
  \n许多 CRM 实施包含的功能足够多，以至于与 Scrum 方法相关的短期设计会议和快速开发周期难以满足用户对初始实施的期望。即使是最小的 CRM 实施也可能需要数周时间，而大型实施则可能需要\
  \ 6 到 12 个月甚至更久。此外，Scrum 项目的一个关键前提是向用户简要演示新功能，而不是完整的用户培训周期。对于大多数初始实施而言，花费大量时间向用户介绍应用程序（包括它如何帮助提高工作效率）非常重要。\n\
  \n由于这些以及许多其他方法论相关的局限性，我们经常在项目中采用一种衍生自迭代开发方法论的方法。这种方法通常被称为*迭代与增量开发方法论*。其理念是在较短的时间内（增量）通过重复的（迭代）设计过程来循环开发应用程序。从视觉上看，该方法论与瀑布模型非常相似，但有两个关键区别：\n\
  \n- 使用迭代开发方法论时，各阶段之间存在重叠。特定阶段要完成的大部分工作可以在上一阶段结束前开始。\n- 在设计阶段，迭代方法为实施团队提供了一种机制，可以收集需求、构建或配置应用程序的各个部分，然后重复这一过程。实施团队可以根据需要重复多次迭代，以从用户那里获得适当的反馈。\n\
  \n图 5-4 展示了迭代与增量开发方法论与本章前面提到的瀑布模型有何不同。\n\n![images](img/0504.jpg)\n\n**图 5-4.**\
  \ 迭代方法论\n\n正如您从图 5-4 中看到的，各阶段相互重叠，允许在一个阶段完成之前就开始另一个阶段的任务。由于迭代的原因，该方法论的设计阶段通常比其他阶段更长。此外，您通常可能会看到一个较短的纯开发阶段，因为部分开发和配置工作是在设计阶段完成的。迭代过程应如图\
  \ 5-5 所示。\n\n![images](img/0505.jpg)\n\n**图 5-5.** 迭代设计与开发\n\n迭代过程应涉及尽早让最终用户看到应用程序。这样做将确保以下几点：\n\
  \n- *用户认同*：让用户通过应用程序参与进来，会让他们对最终结果更加投入。此外，由于设计时间线的延长，项目的动力应能持续到结束。\n- *准确的需求捕获*：迭代过程为用户和实施团队提供了在需求锁定之前多次审查和更改需求的机会。这种方法不是构建一个设计文档并希望它能准确捕获需求，而是允许用户在最终结果完全定义之前就看到它。\n\
  - *设计与构建的一致性*：这两个阶段的高度重叠，在整个开发过程中提供了额外的一致性和检查点。\n\n正如我们在本节开头所述，许多组织都有自己经常用于技术实施的方法论。只要您确保调整该方法论，让用户能够尽早并频繁地看到应用程序，那么这种方法是可行的。\n\
  \n### 计算投资回报率\n\n计算和衡量 CRM 项目的投资回报率可能是一项具有挑战性的任务。很少有组织能够成功衡量诸如员工生产力或效率等指标的“之前”与“之后”数据。通常，无法衡量这些项目是实施背后的一个重要原因。尽管如此，为了组织领导团队的利益，并协助向用户传递信息，确定一些在部署后需要跟踪和报告的项目非常重要。\n\
  \n为确保全面覆盖，您可能需要在部署前花一些时间来识别需要跟踪的重要项目，这样您才能最终确保项目成功。\n\n### 项目规划\n\n为项目管理进度及相关事项选择适当方法的第一步，是确定初始项目进度和里程碑。项目规划作为一个概念，不仅包括管理进度，还包括管理相关资源和任务。\n\
  \n无论您选择哪种项目规划方法，都应考虑提供一套高层的项目里程碑，并向更大的用户群体展示里程碑的整体状态。虽然项目团队成员会更看重更详细的任务和日期列表，但有些人可能更喜欢一个简单的状态，说明项目是否按计划进行，以及如果存在问题，其严重程度如何。\n\
  \n\n\n### 项目进度规划\n\n针对项目及其相关任务的进度规划，你可以选择多种方式。表 5-1 展示了一个极其简单的示例，供你参考。\n\n![images](img/t0501.jpg)\n\
  \n对于核心项目团队，除了总结里程碑之外，你还可以选择制定一份简单或更复杂的项目计划。对于简单计划，使用类似电子表格的工具可以让你轻松自定义计划，以响应团队的需求。采用此方法，你至少需要跟踪以下内容：\n\
  \n*   *任务*：在此模型中，重点是识别对项目成功至关重要的任务。这些任务可能是高关注度的任务，需要大量资源协调的任务，或涉及整个项目重大风险的任务。\n\
  *   *日期*：通过简单模型，跟踪开始和结束日期能让人们了解特定任务将在何时进行。你也可以选择识别那些需要主题专家（SME）或核心项目团队以外人员大量参与的关键日期。\n\
  *   *资源*：识别参与任务执行的各方，将使整个项目团队就高层级任务的所有权达成共识。\n*   *SME 时间投入*：项目期间经常出现的一个问题是：“在某些阶段，我的\
  \ SME 需要投入多少时间？”在项目规划阶段向他们提供这些信息，将使他们能够规划好自己的时间，并确保项目团队在实施阶段获得所需的时间投入。\n\n图 5-6\
  \ 展示了一个基于电子表格的示例，说明如何跟踪这些项目。\n\n![images](img/0506.jpg)\n\n***图 5-6.** 高层级项目进度表*\n\
  \n这种高层级方法非常适合小型项目，或对经典 SDLC 活动及流程有深入了解的组织。对于更复杂的项目，或需要在项目期间获取额外信息的团队，则应考虑采用更复杂的项目规划流程。\n\
  \n有许多工具可用于管理更复杂的项目任务。一种常用工具是 Microsoft Project 软件。这些工具允许你管理除简单解决方案所列项目之外的信息，例如：\n\
  \n*   *详细的资源跟踪*：使用众多可用复杂工具中的一种，你可以将特定资源关联到特定任务。\n*   *资源平衡*：大多数此类应用程序还能帮助项目经理进行资源平衡。通常存在相关报告，概述特定时期内过度分配的资源。\n\
  *   *里程碑与任务*：与简单格式不同，大多数复杂的项目管理工具允许你在一个文档中同时跟踪详细任务和高层级里程碑。用户随后可根据自身角色选择查看适当级别的细节。\n\
  *   *任务状态*：经典项目计划中的每个任务还关联着一个属性，允许你跟踪状态或完成百分比。在图 5-7 显示的项目计划示例中，“功能设计草案”任务包含一条黑色线条，表示该任务的完成进度。\n\
  *   *项目基线化*：复杂项目管理工具的一个出色功能是，能够轻松地滑动任务的开始或结束日期，并让其他后续任务也随之移动。这种方法的一个缺点是会丢失原始日期的历史记录。因此，许多项目规划工具允许你建立项目基线，从而冻结初始日期。任何更新都将针对该基线进行跟踪。图\
  \ 5-7 是一个完整项目计划的示例。\n\n![images](img/0507.jpg)\n\n***图 5-7.** 详细项目进度表*\n\n你的项目计划（最终也是项目章程文件）中需要包含的其他事项，包括与此项目相关的任何现有项目依赖关系。清晰地看到项目与资源分配之间的重叠，将有助于你在流程中提前降低风险。\n\
  \n### 大爆炸方式与分阶段方式\n\n对项目初始阶段影响最大的因素之一，是你的组织在实施时是采用大爆炸方式还是分阶段方式。最终，此决策应在你开始第一阶段之前，基于你在流程初期定义好的路线图做出。尽管如此，许多组织在初始阶段遇到范围蔓延时，仍倾向于忽视路线图。以下是这两种方式的简要概述：\n\
  \n*   *大爆炸方式*：大爆炸方式通常比任何分阶段方式包含的范围要大得多。通常，多个用户组（例如销售、服务和营销）会包含在同一个实施中。大爆炸式项目通常包含一些报表、必要的集成以及其他项目，使得组织只剩下少量可遗留到未来阶段的项目。\n\
  *   *分阶段方式*：分阶段方式涉及将关键范围项拆分为不同的阶段，以降低风险，并让用户社区逐步适应每个阶段的单项功能集。当采用分阶段方式时，诸如报表、集成和自定义代码等事项通常会被安排到后续阶段，以降低初始阶段的风险。分阶段还能确保所构建的内容是基于用户与应用程序的交互需求，而不是基于某些初始的高层级设计。\n\
  \n根据我们实施 CRM 项目的经验，我们通常建议客户采用分阶段方式。用户采用率通常更高，最初几个阶段的风险更低，并且由于后续阶段构建的内容是由用户使用应用程序时的需求（而非早期设计讨论）所决定，因此“被废弃”的代码也更少。\n\
  \n### 确定资源需求\n\n在记录下项目所需执行的所有任务之后，你就可以开始确定完成工作所需的适当资源。正如我们在第 4 章中讨论的，这些资源可能来自多方面，并有不同的侧重点。花费时间提前确定这些资源，对于项目的成功至关重要。\n\
  \n\n### 识别关键团队技能\n\n项目的规模、类型和复杂度将决定完成任务所需的技能。对于简单的项目，单个资源可能身兼数职。在大型实施过程中，可能需要多人共同承担一个“角色”，以确保具备完成既定任务所需的知识。\n\
  \n无论项目规模大小，这些关键角色在大多数项目中都很有用。再次强调，完成既定工作需要多少人，将决定人员具体承担哪些角色，以及每个角色需要多少人。\n\n- **`项目经理`**：项目经理是整个项目团队的单一联络人。项目经理负责确保方法论中所有步骤和可交付成果得到执行。此人承担项目成功交付、以及及时向项目资源沟通项目进展和状态的主要责任。此外，此人还需为\
  \ CRM 建模设计、配置和定制活动提供总体指导。\n- **`分析师`**：项目分析师通常负责广泛的任务。应用设计、配置/定制和上线的大部分工作通常都落在分析师身上。鉴于其对项目的功能性了解，大部分测试计划制定、培训计划制定以及培训课程的实施也将由项目分析师负责。\n\
  - **`开发人员`**：开发人员负责构建自定义代码、集成、报告、数据转换脚本及相关可交付成果。如果项目范围包含任何架构或数据相关的工作，此资源将是主要联系人。\n\
  - **`测试人员`**：在更复杂的项目中，可能会使用独立的资源在上线前完成应用程序及相关功能的测试。\n- **`其他`**：根据复杂程度，我们在 CRM 项目中通常还会看到其他几个角色：\n\
  \    - CRM 架构师\n    - 专职培训师\n    - 网络/基础架构工程师\n    - 用户体验设计师\n\n需要强调的是，这些角色虽然重要，但对于较小的项目，许多可以由同一个人来担任。\n\
  \n### 内部资源与供应商资源\n\n在第 4 章中，我们花了时间提供关于如何评估使用内部资源与供应商资源的需求的信息，特别是评估潜在供应商的标准。就本章而言，关键是将资源需求与组织内部的技能进行比较。我们常常看到，当组织试图承担超出其时间或技能范围的项目任务时，他们就为项目增加了风险。\n\
  \n如果需要利用供应商资源，本章列出的大部分项目或任务都需要进行扩展，以包含来自供应商团队的信息。例如，尽管供应商可能会为您提供关于其团队任务和活动的状态报告，但整体项目状态需要更新，以融合内部和供应商资源的状态。\n\
  \n供应商资源无疑可以帮助推进实施交付，但也会使整体项目管理变得更加复杂。最终，如果项目既需要内部资源也需要外部资源，那么引入合适的供应商将大大降低项目中的许多风险。\n\
  \n#### 变更管理\n\n无论范围在实施过程中被多么谨慎地管理，我们之前讨论的结构化与灵活性之间的平衡，再加上结构化的项目方法论，都不可避免地会导致范围变更。这些范围变更可能是项目团队有意识决策的结果，也可能是项目中出现问题的结果。当变更发生时，您可以使用多种工具来跟踪这些事项。\n\
  \n#### 变更请求\n\n变更请求流程允许项目团队记录项目范围的功能和技术更新。此文档也应被用来记录和跟踪范围变更对项目工时和预算的影响。您可以在第 6 章中找到更多关于变更请求流程的信息。\n\
  \n#### 项目影响\n\n项目影响文档看起来与变更请求文档非常相似，但通常是在不太乐观的情况下提出的。无论是内部问题还是涉及供应商资源的问题，项目影响通常代表着项目面临的重大风险，或者某些消耗了大量不必要时间或预算、需要向整个项目团队说明的事项。图\
  \ 5-8 展示了一个项目影响声明的示例。\n\n![images](img/0508.jpg)\n\n**图 5-8.** 项目影响示例\n\n### 项目沟通\n\
  \n在整个项目过程中进行有效沟通，是其最终成功的重要因素。更重要的是，您如何以及何时与整个项目团队沟通，将极大地影响他们对项目和成果的看法。在项目规划阶段，请确保考虑好您将在整个项目中使用的各种沟通媒介、沟通频率以及消息内容。\n\
  \n#### 门户网站作为项目管理工具\n\n如今，许多公司利用门户技术作为辅助管理项目的工具。正如状态报告一样，门户网站可以成为满足不同利益相关者群体需求的工具，并有助于确保对文档和其他信息的适当跟踪。以下是在项目中门户网站的一些具体用例：\n\
  \n- **`状态报告`**：取决于项目的规模和范围，利用门户网站作为呈现状态报告的工具可以使查看和协作变得更容易。在大多数门户网站中，您有机会将摘要和详细信息分到不同部分。这本质上与将状态报告分成不同部分的效果相同，但可以避免项目经理发送可能会在收件人收件箱中丢失的电子邮件。\n\
  - **`文档管理`**：对于各种规模的项目，管理、交换和更新文档可能是一项具有挑战性的任务。使用具有文档管理功能的门户技术可以简化此流程。大多数此类技术都能管理签入/签出流程，概述文档的更改，并提供版本控制功能给用户。\n\
  - **`常规信息共享`**：随着项目复杂度的增加，涉及的资源数量通常也会增加。当资源列表扩大到包括内部和外部（供应商）资源时，拥有一个允许协作的工具就变得很重要。\n\
  - **`日志记录`**：如果您的项目有任何复杂性，在实施过程中您很可能会遇到一些风险。状态报告可用于突出显示这些风险，提供关于正在采取的缓解措施的说明或评论，并提供所遇问题及所采取措施的历史记录。\n\
  \n\n\n### 期望设定\n\n无论选择分阶段实施还是一次性全面上线，关键在于尽早并持续地设定用户期望。部署后出现的许多问题往往源于期望设定不当，而非应用程序本身的问题。我们在本书中介绍的不少工具，都可以通过多种方式来实现这一点：\n\
  \n- ***启动会议***：启动会议是为组织设定期望基准的绝佳工具。无论是口头说明还是记录在项目章程中，这次会议可能是广大用户群体首次了解即将交付的内容及交付时间。将此次会议作为工具，并结合状态报告中持续传达的信息，将确保为用户设定恰当的期望。\n\
  - ***状态报告***：正如本章前面所述，状态报告中包含的信息会影响组织内的用户。在状态报告中反复使用关于范围或交付时间表的微妙（有时甚至并不微妙）信息，长期来看将有助于引导用户的期望。\n\
  - ***高管沟通***：虽然高管沟通对于激发用户对 CRM 应用程序的热情和使用至关重要，但将其作为设定用户期望的工具也同样重要。将以设定期望为目的、措辞策略性的更新信息，与突出应用程序亮点功能相结合，既能设定期望，又能激发用户热情。\n\
  \n除这些工具外，在用户群体中找到合适的骨干分子来担任“布道者”，并与有困难的用户协作，也能极大地保障成功。来自同事或同伴的帮助，往往比来自“官方”CRM 实施团队的支持更有效。\n\
  \n## 持续项目管理\n\n一旦确定了项目当前阶段的范围，以及交付该范围的适当资源，就可以进入管理模式，跟踪已确认的任务和时间表。与项目规划工具类似，在管理项目范围、预算和资源状态等高层信息时，也有多种选择。\n\
  \n接下来，我们将提供一些在 CRM 实施过程中常用的标准模板示例。\n\n#### 状态管理\n\n项目启动后，你需要持续汇报实施状态。这些状态可用于多种目的：\n\
  \n- ***经典项目管理***：为项目整体利益着想，掌握项目总体状态以及围绕项目预算、资源和范围的任何问题或关切，并定期向高管指导委员会提供信息，这非常重要。如果不维护和共享这些信息，整个团队（最终用户和项目领导团队）可能会产生不匹配的期望，或对项目期间做出的重要决策理解不一致。\n\
  - ***减少会议次数***：在大型项目中，实施团队往往需要向多个不同的利益相关方群体汇报项目状态。无论这些群体是在寻找相同的信息还是不同深度的信息，你可能都需要安排讨论来提供信息。一份格式得当的状态报告，能为每个群体提供恰当层级的信息来回答他们大部分的状态疑问，从而无需召开独立的会议。\n\
  - ***CRM 布道***：正如我们在全书中所讨论的，激发对 CRM 的热情，并让组织内部了解该工具及其功能，最终将影响项目的成功。状态报告除了可以突出风险或问题等较为“负面”的事项外，也可以用来突出项目中的正面进展。你可以选择纳入近期成果或即将发布、能为用户带来积极益处的功能亮点。\n\
  - ***风险缓解***：最后，在实施过程中，你很可能会遇到一些风险。状态报告可以用来突出这些风险，提供关于正在采取的缓解措施的说明或评论，并记录遇到问题的历史及处理步骤。\n\
  \n图 5-9 中的状态报告示例列出了你可以选择纳入自定义状态报告中的多项内容。根据项目的复杂程度，你可以在生成的状态报告中包含部分或所有这些部分。你也可以根据所在组织的项目管理方法论，添加一些有实际意义的部分。\n\
  \n![images](img/0509.jpg)\n\n**图 5-9.** 概要状态报告\n\n状态报告的第一页为那些希望通过可视化方式了解项目状态的人员提供了高层级信息概览。读者可以快速浏览与范围、进度、预算和资源相关的信息，并通过简要文字和“交通灯”图形，评估是否需要介入已识别的问题。\n\
  \n对于那些寻求更多信息的人员，你可以选择提供更详细的内容，如图 5-10 所示。\n\n![images](img/0510.jpg)\n\n**图 5-10.**\
  \ 详细状态报告\n\n状态报告的这部分允许你汇报在本次报告周期内完成的具体任务，以及下一报告周期需要重点关注的事项。提供这些信息有助于确保实施团队每周都能将注意力集中在正确的活动上。“即将举行的活动日程”部分能帮助不同信息层级的人员了解后续报告周期内计划召开哪些会议。最后，文档中的“里程碑”部分持续更新里程碑的计划日期与实际日期。\n\
  \n#### 流程定义的重要性\n\n正如本章前面所述，你选择的实施方法论将对应用程序的设计方法产生重大影响。我们将在本章后面讨论具体的设计方法和交付物。目前，无论采用何种方法论，都必须认识到流程定义的重要性。在许多\
  \ CRM 项目中，最常见也最容易纠正的错误之一，就是忽视分析“当前”流程以及评估需要在实施阶段纳入的“未来”流程变更。\n\n至少，分析“当前”流程能使实施团队确保项目阶段的范围包含在新应用程序中复刻现有流程所需的功能。理想情况下，对“未来”流程的持续评估，将使整个团队能够将所需流程与你所选\
  \ CRM 应用程序的功能进行对比。这实际上有助于缩小范围、降低成本并降低风险，因为一些未来所需的功能可能通过应用程序本身就能简单实现。\n\n\n\n####\
  \ 追踪“待办事项”项\n\n在初始实施阶段开始前需要计划的另一项内容是，追踪和管理那些被视为重要但不属于项目当前阶段的范围项。实施团队常犯的另一个错误涉及在项目中纳入额外的范围。一旦项目启动，用户群体可能会对项目经理施加很大压力，要求将新项纳入项目范围。虽然在某些情况下这种纳入确实合理，但追踪和分类这些项将使项目经理和指导委员会能够在被请求变更范围时，就如何变更以及是否变更做出明智决策。`图\
  \ 5-11`展示了一个用于追踪这些项的简单而高效的电子表格示例。\n\n![images](img/0511.jpg)\n\n**图 5-11.** 待办事项追踪示例\n\
  \n1. *主题与描述*：尽管非常基础，但主题与描述应用于捕捉所反映的范围变更的高层概况及稍详细的说明。该电子表格将由广大用户群体使用，因此提供易于理解的描述可以预先消除用户的疑问。\n\
  2. *优先级与子优先级*：同时包含优先级和子优先级，使项目指导委员会在评估新的范围请求时能够进行非常精细的判断。如果出现额外的时间或预算，这种对请求范围项的详细排序将有助于做出深思熟虑的决定，明确纳入哪些范围。\n\
  3. *负责人*：这是另一个与范围项相关的简单追踪信息。尽管如此，它也非常重要。待办事项请求的负责人最终将负责推动必要的额外需求，以便就能否将该范围纳入项目做出明智决策。通常，此人还负责初步确定优先级，然后将该项提交给指导委员会审查。\n\
  4. *日期与解决方案*：正如本节前面提到的，广大用户群体可能会使用此电子表格来追踪其请求的进展。为他们提供更新的条目日期和状态，将使他们确信请求正在推进中。\n\
  \n还有一些其他数据点可能对您的项目团队也有价值。最常添加的信息与日期相关，并且确保用户群体能持续感受到他们请求并高度重视的项的最新进展。\n\n#### 过度自定义带来的挑战\n\
  \n与在实施初始阶段采用“大爆炸”方法所导致的问题非常相似，项目团队很容易陷入试图通过过度自定义应用程序来满足用户需求的情况。过度自定义在更大规模、多功能实施中更可能发生。例如，当两个利益和销售流程截然不同的销售团队使用同一个实施时，就可能添加过多的字段、自定义配置和自动化功能。最终，在应用程序中添加过多的内容可能导致以下问题：\n\
  \n* *用户困惑*：用户在培训期间及发布后快速上手应用程序的能力，将决定初始实施的成败。如果字段过多，或者用户收到由应用程序生成的大量电子邮件或任务，他们很可能会感到困惑并放弃使用该实施。\n\
  * *不必要的流程影响*：与上一点非常相似，如果应用程序的新功能要求用户遵循他们不熟悉的流程关卡，他们可能难以采用该应用程序。\n* *额外支持成本*：在发生过度自定义的情况下，用户要么难以使用工具，要么需要“紧急”变更，以便让他们对所开发的解决方案感到更舒适。无论哪种情况，都需要内部或供应商团队提供支持，以保持应用程序的正常推进。\n\
  \n过度自定义是可由整个实施团队控制的事项。采用迭代方法并结合应用程序审查，以确保用户对应用程序的构建方式感到满意，这将防止日后出现意外。此外，使用状态报告和项目章程等经典范围管理工具，并结合管理待办事项，将使初始实施的重点集中在为用户群体增加最大价值的项上。\n\
  \n\n\n### 预算管理\n\n根据您团队内部运作方式的不同，您可能需要也可能不需要跟踪内部预算的费用明细。如果您正在使用供应商，您肯定需要确保能追踪他们按照您的既定预算进行支出。\n\
  预算管理可能是一件棘手的事情，因为它很容易被供应商钻空子。您如何管理预算以及使用哪些工具来识别预算风险，取决于您所负责项目的类型或规模。\n\n如果您正在进行一个小型的初始项目，您可能只有与项目启动相关的少量支出，然后是后续每月固定金额的支出。在这种情况下，关键在于跟踪预算支出以及每月完成的工作量。这将使您能够判断每月的价值是否达到或超过了支出金额，无论是内部还是外部支出。\n\
  \n如果您的团队在 CRM 项目的第一阶段专注于一个大型项目，成本通常变化很大。大型项目相关工作所投入的精力可能从几周到几年不等，几乎涵盖了中间所有的时间跨度。您用于管理预算的工具可能千差万别；不过，我们将提供一个示例，并对特定部分的价值加以说明。图\
  \ 5-12 展示了一个可用于管理预算和跟踪任何偏差的工具示例。\n\n![images](img/0512.jpg)\n\n**图 5-12.** 预算跟踪示例\n\
  \n1. **总支出与预算跟踪**：此工具部分使您能够查看分配的总预算，并了解已支出的金额。根据项目状态，您可能需要就应保留多少可用预算做出明智的决策，但最终，这里的数据将帮助您做出判断。\n\
  2. **剩余预算**：在项目的任何阶段，您都可以通过查看单一数字来了解剩余预算的金额。\n3. **每周预算支出**：查看每周的预算工时和支出是预算管理难题中非常重要的一环。首先，这种可见性使您能够将每周支出与项目计划进行对比，确保两者匹配。其次，这使您能够为大型项目做出更重要的预算决策，例如剩余预算有多少，以及它是否在项目剩余阶段得到了合理分配。\n\
  4. **发票状态**：项目经理和供应商资源通常需要负责在传统预算之外提供发票状态的更新。使用此模板，您可以为指导委员会提供供应商提交的任何发票的日期和金额。\n\
  5. **项目影响及变更请求跟踪**：此模板中的简单自动化功能使您能够在同一个地方跟踪项目影响和变更请求，与原始预算并列。通过将它们添加到这个电子表格中，总预算数字会增加，从而使项目管理团队在评估预算状态时能够使用总预算数字。\n\
  6. **整体预算状态**：通过将所有项目纳入预算电子表格，您将能够立即判断项目超出或低于预算的百分比。\n\n项目越大，预算被不当使用的风险就越高。在大型项目中，存在团队花费\
  \ 80%的预算却仅交付 10%功能的风险。一旦发生这种情况，实施团队就会陷入困境，因为他们已经向用户社区做出了承诺，但成本却持续显著高于最初预期。\n\n归根结底，项目管理团队需要理解的最重要一点是，在任何时间点了解预算的状态。无论这个状态是关于总支出、即将发生的支出，还是仅仅关于本周将使用多少工时，找到一种提供此信息的机制是关键。\n\
  \n### 问题管理\n\n尽管我们可能开始显得有些重复，但做好准备管理问题是项目规划中另一个重要的方面。就像待定事项和状态报告一样，让用户了解问题是让他们信任实施团队的长远之道。除了这一潜在价值之外，管理问题还关乎问责制和风险管理。\n\
  \n为了在整个项目生命周期中成功管理问题，拥有一个跟踪机制（无论多么简单）都很重要。该工具还将允许核心项目团队管理这些问题的责任归属，确保项目团队中的相关人员能进行适当的跟进和分类处理。图\
  \ 5-13 展示了您可用于跟踪问题的一个简单而有效的模板示例。\n\n![images](img/0513.jpg)\n\n**图 5-13.** 问题管理跟踪示例\n\
  \n## 资源/供应商管理\n\n无论您的项目规模如何，您都需要管理某种形式的资源。与许多与项目规划和管理相关的活动一样，提前设定适当的期望将使您从长远来看更加成功。\n\
  \n如果您专注于内部资源，我们经常看到的一个错误是没有为内部资源完成任务留出足够的时间。除非您的组织非常幸运，拥有曾参与过 CRM 项目的员工，否则许多任务所需的时间将比预期的要长。此外，取决于您组织的内部情况，您可能需要花费额外的时间向项目指导委员会汇报资源状态。无论情况如何，您的项目管理工具——特别是项目计划中的资源分配部分和状态报告——都可以帮助您在内部管理资源期望。\n\
  \n如果您处理的是涉及供应商的项目，情况就会变得更加复杂。所有用于管理内部资源的相同技术也可以用于管理供应商。供应商组织通常会在其实施时间之外提供一定量的项目管理时间。与内部资源一样，供应商资源将是项目计划的一个组成部分，他们付出的努力也应包含在任何状态更新中。\n\
  \n我们有机会合作过的大多数供应商都声誉极佳，并专注于做符合客户最佳利益的事情。不幸的是，也有一些供应商的声誉并不那么出色。对于后者，在涉及供应商的实施过程中，以下是一些您可能需要考虑的问题。\n\
  \n\n\n*   **诱饵调包**：在销售周期中的某些情况下，供应商会向您展示某个人作为项目的资源，但在项目开始前却将该资源调换。尽管咨询组织很少在合同签署前承诺具体的资源，但最终分配到您项目的资源，其技能和经验应与销售过程中所做的承诺保持一致。\n\
  *   **支出与预算**：正如我们在本章预算管理部分所概述的，谨慎管理预算和工时将确保预算与所需工作量保持一致。完成了项目的大部分工作，却没有完成实施的预算，这会使整个团队处于非常不利的地位。\n\
  *   **“合作伙伴模式”**：作为一个实施 CRM 的团队，在无需增加不必要开销的情况下，成本已经足够高了。一些咨询组织采用合作伙伴模式，即由一名高级资源在项目上计费时间，却不提供相应的价值。请确保参与项目的所有人，无论是资深还是初级，都为实施提供了价值。\n\
  *   **知识转移**：供应商很容易只专注于实施，而不向内部项目团队提供所需的信息。请确认您的供应商已预留足够的时间来恰当地支持工具部署，并将代码、文档和流程知识等信息转移给内部团队。\n\
  *   **工具与流程**：顾问们对特定的 CRM 工具及相关实施会采取不同的方法。有时，顾问很容易只关注工具，并调整组织的流程来适应现有功能。您应确保供应商准备调整工具来满足您组织的流程需求，而不是改变您的流程去适应工具。\n\
  *   **咨询培训**：每位顾问都会经历第一个项目，但为了确保您组织的最终成功，了解供应商所带来团队的背景至关重要。如果项目中安排的是较初级的资源，请确保他们得到供应商组织的适当支持，并要求折扣费率以弥补该资源不可避免的适应期。\n\
  \n这些例子只是您在与供应商团队合作时可能遇到的一些陷阱。重申一下，对于大多数供应商，您可能不会遇到这些问题，但带着对潜在风险的认知进入项目状况，从长远来看可以防止问题的发生。\n\
  \n## 典型的供应商合同\n\n供应商采用的合同类型和格式差异很大；然而，在您的组织和参与项目的任何供应商之间，有两类高级别的文件可能是有意义的。\n\n第一份文件通常称为**专业服务协议**（PSA）或**主服务协议**（MSA）。这份文件的经典目的是概述管辖两个组织之间关系的条款和条件。这份文件将作为一个总括性文件，所有项目工作都在其下进行定义和完成。\n\
  \n第二份常见文件通常称为工作说明书（SOW）。这份文件是项目特定的，通常涵盖项目的范围、假设、可交付成果以及单个项目成本。\n\n图 5-14 展示了一份 PSA\
  \ 的示例目录，其中列出了一些您应预期在供应商提供此文件时看到的内容和一些注释。\n\n![images](img/0514.jpg)\n\n***图 5-14.**\
  \ PSA 目录*\n\n以下是一些需要关注的关键项目：\n\n1.  **开票结构**：标准的 PSA 将概述您与供应商之间的开票条款。这些条款包括开票频率，以及您在支付供应商发票时应遵循的标准付款条件。通常，大多数供应商每两周或每月开一次发票，并要求按“Net\
  \ 30”付款条件支付。\n2.  **保密信息**：几乎每份 PSA 都包含关于保密信息的条款。根据您的供应商 PSA 的友好程度，该条款可能是双向的，也可能仅侧重于保护供应商的保密文件和资料。显然，从您组织的角度来看，该条款也需要包含对您在项目期间暴露的信息、文件和流程的保护。\n\
  3.  **数据权利**：总的来说，文件中的数据权利部分将讨论由供应商执行的任何项目工作的可交付成果的归属问题。虽然这看起来相当直接，但在 CRM 项目中，这部分可能会变得复杂。因为您为项目付费，所以您假设自己将拥有项目期间开发的任何知识产权是合理的。当讨论配置的所有权时，挑战就出现了。正如您可能想象的，如果您向\
  \ CRM 应用程序添加了一个名为“账户名称”的字段，供应商不能将此项定制的独家所有权授予您，因为他们未来的许多客户可能会请求相同的形式。因此，数据权利部分通常包含对定制的一些共同所有权，您在审查\
  \ PSA 时应预料到这一点。\n4.  **员工招聘**：与保密信息部分非常相似，PSA 的这一部分可能是双向的，也可能只保护供应商免于您雇佣其资源。最终，在项目期间，您双方可能都希望得到这种保护，以确保资源持续专注于手头的任务。\n\
  5.  **解决与争议**：PSA 的这一部分处理您与供应商之间可能出现的任何问题。这部分将讨论任何争议将在何处解决，并且，如果适用，仲裁是否是本协议的一部分。根据我们的经验，加入仲裁条款是个好主意，以防万一出现问题，因为它能让您尽可能避免法律诉讼。\n\
  \n在审查 PSA 时，您需要考虑的一个整体问题是文件中的条款是双向的。文件中有很大一部分内容可以并且应该是双向的。例如，如果供应商要求您避免雇佣他们的资源，那么您期望获得同等待遇也是公平合理的。\n\
  \n图 5-15 展示了一份典型 SOW 的目录。\n\n![images](img/0515.jpg)\n\n***图 5-15.** 工作说明书目录*\n\n\
  \n\n1. ***关键目标***：尽管大多数工作说明书（SOW）的这一部分篇幅较短，但这是供应商阐明其对项目目标理解的机会。这些条目可能以概要形式呈现，但若目标清单中遗漏了重要事项，建议与供应商进行沟通。\n\
  2. ***项目服务范围***：文档中的范围部分为 SOW 中最重要的章节。该部分将概述作为项目组成部分交付的具体范围、定制化、代码、集成等内容。范围部分将明确需交付的条目、与这些范围条目相关的具体可交付成果，以及供应商为将范围条目限定在合理层级所做的任何假设。\n\
  3. ***通用假设***：此部分与范围部分中明确的假设有所不同，因为它涉及一些关于项目的更高级别假设。诸如报告、工作流、培训和部署功能等条目，可通过一个整体时间块（而非特定范围条目）来处理，并可能附带相关的通用假设。\n\
  4. ***供应商项目管理***：根据我们的经验，部分供应商会在 SOW 中提供有关其项目管理方法和交付模式的详细信息，但也有一些不会。如果你有机会要求供应商包含此信息，这将使你能够在流程早期了解其方法论。\n\
  5. ***项目预估成本***：SOW 中的成本部分将是决定是否推进解决方案的关键。该部分将包含三个主要组成部分：\n    - ***软件***：无论选择何种类型的应用程序（托管型或本地部署型），都会产生一些软件成本。请确保贵方供应商提供了与不同模式相关的成本。这也是应提供任何第三方软件成本的部分。\n\
  \    - ***服务***：此处将概述与 SOW 中列出的范围条目相关的专业服务成本。这些成本应包括实施成本、部署后支持成本，以及供应商提供的任何项目管理的成本。\n\
  \    - ***差旅***：尽管并非所有项目都包含差旅，但确保供应商已明确任何预期成本，包括酒店、租车、机票/交通和/或每日津贴的估算，将避免日后产生混淆。你可能还需确保供应商符合贵公司的差旅政策，包括提前获得差旅批准或使用指定酒店。\n\
  \n正如我们在本节前面提到的，不同供应商的合同差异很大。确保合同包含我们列出的大部分或全部内容，将使你能够在开始实施之前尽可能多地覆盖各种情况。\n\n## 高管支持\n\
  \n一旦你完成了项目筹备所需的所有规划任务和文档生成，就必须获得启动项目所需的所有高管支持。在本书中，我们探讨了拥有支持整体 CRM 计划的高管团队的价值。在这个阶段，焦点应放在当前的具体项目上。\n\
  \n在此实施阶段，高管支持可能来自两个主要来源：一位高层管理者以及项目指导委员会。无论是专注于项目启动，还是与整个项目团队达成一致，项目章程文件都可以成为确保团队朝着相同且正确方向前进的工具。\n\
  \n项目章程应由核心项目团队成员制定。许多关键的章程条目，如风险、项目时间表和项目依赖关系，需要来自不同利益相关方的输入，可能无法仅由项目经理知晓。让涉及任何风险或时间依赖关系的人员参与进来并获得他们的认可，将确保项目经理有能力在项目期间有效管理这些问题。在你与团队合作制定章程后，应计划向整个团队公布并征求反馈。图\
  \ 5-16 是一个项目章程目录的示例。\n\n![images](img/0516.jpg)\n\n***图 5-16.** 项目章程目录*\n\n此文档的一些关键点包括：\n\
  \n1. ***解决方案描述***：由于项目中的许多参与者可能未与项目发起人（以及供应商，如适用）就项目范围进行过讨论，因此概述范围内以及同样重要的范围外内容，将为项目团队提供发表意见的机会。如果项目团队中有人不同意范围之内或之外的某些内容，则可以适当地进行后续讨论。\n\
  2. ***项目组织***：尽管项目组织部分看起来相当直接，但在前期正确识别哪些人将担任特定角色，将避免后续整体项目团队和用户的混淆。核心项目团队成员（包括主题专家、项目经理和技术负责人）以及指导委员会将被期望在项目期间做出决策，因此项目章程有助于确保这些角色中的人员理解其职责。\n\
  3. ***项目时间表***：概述项目的关键里程碑将使整个项目团队能够确保不存在可能危及项目时间表的冲突。如果确实存在此类冲突，可以进行后续讨论，以尝试减轻与之相关的任何风险，或确定对项目时间表进行必要的更改。\n\
  4. ***成功标准***：项目章程中最后也是最重要的一点是确定项目成功标准。让项目团队协助定义这些条目将确保他们对项目的成功有所投入。由于 CRM 项目所带来的价值往往具有模糊性，清晰地记录成功标准将使你能够在部署后阐明项目的成功，并极大地有助于为未来阶段获得资金或资源。\n\
  \n与本书中强调的大多数文档一样，贵组织使用的项目章程可能与前述不同。一些公司使用基于 PowerPoint 的单页摘要文档，另一些公司则使用更复杂的文档，但包含上述四个关键要素将确保项目团队成员之间的协调一致。\n\
  \n## 总结\n\n在本章中，我们讨论了在规划和管理初始部署时你应该关注的要点。根据项目参与规模与复杂程度，其中一些内容可能显得多余，但寻找机会使用这些文档的简化版本，将确保你在项目期间不会遗漏任何内容。\n\
  \n我们首先重点讨论了项目规划或你将采取的方法。确保时间表满足利益相关方的需求、评估“大爆炸式”与分阶段实施方法，以及组建一支资源团队来交付工作，将为后续的项目规划活动奠定基础。接下来，我们介绍了维持项目顺利运行所需的持续项目管理活动。最后，也可能是最重要的一点，我们讨论了建立和传达来自高管团队的支持，以保持项目朝着正确的方向推进。无论是激发热情、确保资源承诺，还是解决问题，来自高管团队的支持和参与将贯穿整个项目。\n\
  \n在下一章中，我们将讨论项目的实际执行。我们将涵盖设计、开发、测试和培训以及其它主题。\n\n"
- "# 第 6 章\n\n\n好的，作为高级文档工程师和翻译员，我将遵循您的格式要求，将给定的英文文本翻译成中文。\n\n\n## 执行初始 CRM 实施\n\n\
  在上一章中，我们为您提供了规划 CRM 项目初始阶段所需的步骤。并非所有列出的工具和方法都适用于所有情况；最终，您需要根据您的组织以及计划实施的复杂性，找到对您有意义的工具和方法。\n\
  \n在本章中，我们将重点介绍如何执行 CRM 项目的初始实施。我们将关注实施的各个阶段，并提供有关您应使用的模板和流程的信息，以执行实施。与上一章类似，我们将讨论的许多内容都需要根据您的组织和项目的需求进行定制。\n\
  \n### 设计阶段\n\n在上一章中，我们回顾了在实施期间可能使用的各种设计方法和原则。虽然所有这些方法都可能成功，但我们建议在设计阶段采用迭代方法。\n\n\
  #### “现状”流程定义\n\n在大多数实施的设计阶段，一个经常被忽视的步骤是对组织当前或“现状”流程的文档记录和分析。记录并确保对流程事项达成共识，将为您带来两个好处：\n\
  \n*   **应用对齐**：我们将在本章后面讨论的一个事项是，使您的应用程序与组织的业务流程保持一致。CRM 实施中最大的陷阱之一是允许技术驱动使用场景和业务流程。预先定义您的流程，将确保您的实施团队（包括供应商）勤勉工作，以使应用程序满足您的业务流程，而不是技术的流程。\n\
  *   **流程更新**：预先分析您的流程将使您的团队能够审查这些流程，并确定它们是否适合公司未来的发展。花时间审查每个流程可能会如何改变或改进，同样将使您能够确保应用程序满足这些需求。\n\
  \n图 6-1 中显示的流程文档是一个简单流程图的示例。它结合了普通的方框到方框流程和通常称为*泳道*流程的流程。泳道允许您按所涉及的人员或部门来分解流程，使他们能够有效地对流程的准确性提出意见，并让您看到应用程序可能对特定角色产生的影响。\n\
  \n![images](img/0601.jpg)\n\n**图 6-1.** “现状”流程图\n\n在图 6-1 所示的流程图中，您会注意到代表了四个角色，或*人物角色*。根据图表的结构以及您用来构建图表的技术，您可能还能够将高级流程图链接到更详细的流程图。此外，您可以选择突出显示图表的特定部分，并提供有关某个方框或活动的额外细节或内容。为此，您可以利用图\
  \ 6-1 中的编号气泡，并在一个单独但相关的文档中添加注释。\n\n在进行“现状”流程分析时，不仅要考虑识别发生的步骤或操作，还要考虑识别流程的产出。如果在任何阶段产生了报告或文档，请利用分析过程的机会，花时间评估当前的产出以及这些项目将如何随着新的\
  \ CRM 系统而改变。\n\n#### “目标”流程定义\n\n一旦评估了“现状”流程，就需要以批判性的眼光来评估该流程，以期进行改进，并确定应用程序可以自动化关键功能、改进业务审计或简化沟通的机会。这些讨论对用户来说通常很痛苦，因为许多人习惯于以某种方式或根据特定流程进行操作。虽然这可能需要时间，但现在努力解决流程中的变化，最终将使您的实施更加成功。\n\
  \n“现状”流程图可以作为任何定义的“目标”流程的起点。突出显示任何更改将使将来更容易比较两者。最后，在开发新流程时，您应该考虑使用某些符号来突出显示任何已定义的自动化点。\n\
  \n图 6-2 显示了“现状”流程图，其中标识了一些小的更改，从而创建了“目标”流程图。\n\n![images](img/0602.jpg)\n\n**图 6-2.**\
  \ “目标”流程图\n\n虽然更改很小，但您会注意到此流程图中有一些差异，用两个边框较粗的方框突出显示。这两个更改都代表了流程的变更以及应用程序可以促进的自动化。\n\
  \n#### 规则与升级\n\n一旦定义了“现状”和“目标”流程，您就应该清晰地记录在流程分析中识别出的自动化。在这一点上，此文档可以相对宏观，但应捕捉每个自动化部分的重要特征。\n\
  \n图 6-3 提供了一个用于跟踪业务规则和自动化的简单模板。\n\n![images](img/0603.jpg)\n\n***图 6-3.** 业务规则跟踪模板*\n\
  \n模板中的大部分列都是不言自明的。根据您选择的 CRM 应用程序，将使用不同类型的代码或 CRM 功能来实现特定的自动化部分。\n\n## 用例定义\n\n\
  许多组织选择围绕一组*用例*来组织设计过程。用例以逐步的方式描述用户和应用程序之间为完成某些任务而进行的交互。定义用例为您的团队提供了一个机会，就应用程序需要解决的用户场景和流程达成共识。即使是简单的实施，也需要多个用例来勾勒用户的任务和流程。对于较大的、新的应用程序实施，可能需要数十个用例。用例及其内容不应与应用程序功能混淆，因为它们差异很大。用例定义将主要通过两种方式提供帮助：\n\
  \n*   **流程一致性**：开发和完善用例提供了一个方便的框架来进行详细的流程讨论，并确保所有各方在流程的步骤、参与者及其基本原理方面保持一致。在设计过程早期确保这种一致性，可以使后续工作更顺利，并有助于防止在设计后期出现过程差异时产生不愉快的意外。\n\
  *   **完整测试**：在设计阶段开发用例将有助于确保在部署的测试阶段完成完整的测试。很多时候，端到端的系统测试是基于实际构建的内容完成的，而不是基于已批准的设计（预期要构建的内容）。这是一个重要的区别。设计用例将为在项目后期阶段制定的测试计划提供一组基线信息。\n\
  \n图 6-4 显示了一个可用于记录您的用例的模板示例。\n\n![images](img/0604.jpg)\n\n***图 6-4.** 用例示例*\n\n\
  以下是对用例文档每个部分所包含信息的快速概述：\n\n\n\n*   ***业务需求**：提供用例所涉及业务流程的概要或标题。*\n*   ***描述**：利用描述字段，更详细地说明特定用户用例所解决的业务流程。若你能提供用例的前后对比视图，则可能利用这些信息来评估项目的最终成功。*\n\
  *   ***作者**：作者是编写用例的人。*\n*   ***问题/疑问**：在编写用户用例时，你常会发现一些问题，这些问题将影响系统实现方式以解决用例。此外，如果你能在项目团队审阅此用例时为其识别并总结出任何疑问，可在此处追踪记录。*\n\
  *   ***假设**：如果你对涉及的业务流程或用户（在用例中常称为*参与者*）做出任何假设，请在此处记录这些信息。仔细记录假设是成功运用用例的关键之一。用例通常会被转化为用户测试计划，因此记录关于用例触发条件或作为用例一部分的流程步骤的假设，将有助于更轻松地生成测试计划并进行更有效的测试。*\n\
  *   ***前置条件**：前置条件允许你定义在用户用例中识别的流程被“允许”发生之前必须满足的条件，例如某种形式的审批。*\n*   ***触发器**：使用触发器部分来记录触发用例中已识别步骤的用户或流程操作。以学生尝试注册大学课程为例，学期开始、新课开设等，都是需要完成注册流程的触发器。*\n\
  *   ***成功结束条件**：模板的这一部分可用于记录指示用例成功完成的标准。例如，沿用上述学生注册的例子，成功结束条件即为学生能够使用我们设计的任何应用程序成功注册。*\n\
  *   ***失败结束条件**：模板的这一部分可用于记录指示用例以失败告终的标准。例如，如果前面提到的学生不被允许或无法使用该应用程序注册课程，这就可以记录为失败结束条件。*\n\
  *   ***备注**：用例文档的备注部分可用于记录任何其他信息，这些信息不能恰当地归入之前确定的文档部分中。*\n\n除了图 6-4 提供的模板外，用例通常还包括信息流以及应用程序将如何满足特定用户需求的模型或线框图。图\
  \ 6-5 展示了一个示例，说明如何为一个报告用例展示这种信息流和模型。\n\n![images](img/0605.jpg)\n\n**图 6-5.** 详细用例示例\n\
  \n图 6-5 所示的示例也可作为用户验收测试计划 **错误！未找到书签。** 的基础。提供清晰的步骤、这些步骤发生的位置，以及用户如何与应用程序交互的可视化示例，将使他们能够全面测试该应用程序。\n\
  \n#### 功能规格说明开发\n\n设计拼图的最后一块是功能规格说明文档，它将我们到目前为止介绍的所有元素整合在一起。该文档旨在描述你将要实施的应用程序的预期或期望的业务行为。你会注意到，图\
  \ 6-6 中展示的许多条目都记录了在项目过程中从流程或设计讨论中产生的需求或假设。\n\n![images](img/0606.jpg)\n\n**图 6-6.**\
  \ 功能规格说明目录\n\n你会注意到，图 6-6 中的大部分条目已经在设计阶段的不同节点被审阅或讨论过。功能规格说明文档可以作为整合所有独立流程和工作流需求的机制。\n\
  \n一旦你的项目团队批准了功能规格说明，在设计阶段此时可以产出的另一份文档是技术规格说明文档。技术规格说明是一份由开发团队创建的文档，用于概述那些无法使用 CRM\
  \ 应用程序中可用的标准配置或工作流工具来构建的应用程序组件的设计、开发和测试计划。我们将在本章的“自定义开发”部分提供关于技术规格说明文档的更多信息。在结束项目的设计阶段之前，请务必至少考虑以下常见的设计陷阱：\n\
  \n*   ***报告设计延迟**：由于许多组织最初过于关注功能和表单设计，因此报告需求的识别和设计常常被忽视。通过提前设计报告，或者至少与其余功能和表单并行设计，将确保在整体设计中考虑到应用程序的必要输出。*\n\
  *   ***数据迁移错误**：不要将数据迁移的设计留到设计阶段结束时或构建阶段开始时。与报告一样，请确保你在整个设计阶段都在进行数据迁移工作。从你以前的应用程序中迁移的数据，在如何以及迁移到新\
  \ CRM 应用程序的何处方面会有一些限制。了解这些限制并通过 CRM 的设计来解决它们，将使整个数据迁移过程进行得更加顺利。*\n*   ***技术 vs.\
  \ 流程**：我们在本章前面提到了这个陷阱，稍后我们将更详细地讨论它，但确保你的团队承诺坚持你的业务流程，更重要的是，推动你选择的 CRM 应用程序去满足这些流程需求，将是项目实施成功的最关键因素之一。*\n\
  \n\n\n### 定制开发\n\n在某些情况下，您选择的 CRM 应用的标准功能可能无法充分支持您的业务流程，或者附加功能可能对您团队的生产力产生巨大影响。所有主流\
  \ CRM 应用供应商都预见到了这一点，并在不同程度上设计了他们的应用，允许其合作伙伴和客户为其增添新功能。由于定制功能是为满足您独特的需求和情况而设计的，因此它们可能极具价值。然而，在将定制开发作为\
  \ CRM 项目一部分进行着手之前，有几个重要的考量因素：\n\n- **成本**：定制开发通常涉及为您的 CRM 应用从零开始编程，以实现新功能或新特性。这可能会很昂贵，并且总开发成本在定制组件的所有设计工作完成之前难以精确估算。这可能导致成本超支。\n\
  - **升级路径**：向您的 CRM 应用添加定制代码可能会使从一个版本升级到下一个版本变得更加困难，并且每次 CRM 应用发布新版本时，这些代码都需要进行测试并可能需要返工。\n\
  - **您自身的 IT 资源**：您是否有具备相应技能和带宽的内部资源来构建、或至少维护和定期增强定制组件？如果没有，您与您的 CRM 咨询合作伙伴关系如何？他们作为您的开发合作伙伴，未来是否可能保持良好的连续性？您是否接受将这部分工作外包所带来的成本影响？\n\
  - **CRM 供应商路线图**：您是否计划构建一个已在您的 CRM 应用供应商路线图中的功能？如果是，是否可以等待？\n- **ISV 生态系统**：这个功能是否可以通过为您的\
  \ CRM 应用添加 ISV 附加产品来充分满足？在所有功能相同的情况下，购买现成产品几乎总是比开发定制组件更好。\n\n我们的目的并非劝阻您进行定制开发；事实上，在我们所见过的、最具价值和变革性的\
  \ CRM 项目中，有些就包含了直接针对客户特定流程和挑战而开发的定制组件。但这些组件的价值必须经过深思熟虑，并且必须谨慎管理，因为它们可能会对您的项目预算和进度构成风险。\n\
  \n#### 管理作为 CRM 项目一部分的定制开发\n\n如果您选择将定制组件的开发作为 CRM 项目的一部分，请理解这与标准应用功能相关的设计和配置流程有着根本性的不同。如果那个流程类似于为您的新车选择配置和颜色，那么定制开发则更接近于从零开始设计汽车。这种差异为管理您项目中的定制开发部分提供了一些指导原则：\n\
  \n- **严格对待文档**。创建一份详细的**功能规格说明书**作为设计流程的输出，并在设计变更时保持其更新。\n- **规划几个中间开发里程碑**来评估原型，特别是对于复杂组件。这让您能够切实感知开发进度，并在需要时进行方向修正。\n\
  - **避免功能蔓延**。扩展功能集对预算和进度的影响，远不止新功能额外的开发成本那么简单。总会有发布下一个版本的机会，所以不要试图一次完成所有事情；相反，应以某种方式记录需要但超出范围的功能，以便在未来的开发中进行评审和设定优先级。\n\
  - **谨慎管理离岸开发团队**。市场上将定制开发工作外包到成本较低地区的趋势日益增长。这可能是一种成功的模式，但需要您付出更多努力来确保其成功。确保您谨慎选择开发合作伙伴。找一个对您选择的\
  \ CRM 应用有丰富经验的合作伙伴。计划让您的文档比通常情况更加详细。没有面对面的交流，澄清事情的机会就会减少，通过电话/电子邮件进行澄清也可能更加困难。计划与开发合作伙伴定期沟通进度。监控他们的工作量，确保您有效利用了他们的时间。\n\
  \n## 技术规格说明书\n\n功能规格说明书定义了**要构建什么**。它关注成果和用例，并描述应用应该在什么时候、为谁、在什么流程的什么阶段做什么事。技术规格说明书则专注于**如何实现**：即需要构建什么来交付功能规格说明书所描述的能力。功能规格说明书是一份由分析师驱动的文档，并吸纳了开发团队的输入，而技术规格说明书则是一份由开发者驱动的文档，并吸纳了分析师/设计团队的输入。技术规格说明书有多种风格和变体，但大多数都会涉及图\
  \ 6-7 中的主题。\n\n![图片](img/0607.jpg)\n\n**图 6-7.** 技术规格说明书目录\n\n### 集成\n\n应用集成是 CRM\
  \ 项目中的一个常见组成部分，可以极大地提升您的 CRM 应用的价值和影响力。在本书中，我们将集成定义为以编程方式将业务应用链接在一起；例如，一个应用中的数据在另一个应用中可见，或者一个应用中的操作可以触发另一个应用中的不同操作。集成的常见理由包括提供更完整的客户视图和自动化业务流程。我们来详细探讨每一点。\n\
  \n#### 提供更完整的客户视图\n\nCRM 项目常被提及的一个潜在好处是实现客户的“360 度视图”：在一个地方、一个应用中，员工可以浏览组织与某个客户在所有部门间的所有互动。CRM\
  \ 应用因其以客户为中心的设计，自然而然地适合扮演这个角色，但如果没有应用集成，这一愿景就无法实现。您的组织将继续需要专门的业务应用来管理某些类型的客户信息。例如，您的会计应用将管理发票和付款。集成可以使这些信息在\
  \ CRM 应用中、在客户上下文中可用，这样，除了 CRM 原生数据（如销售机会、服务工单和电子邮件通信）之外，您的 CRM 用户还可以查看来自会计应用的信用状态、发票和付款信息。其他应用也可以通过同样的方式集成，最终\
  \ CRM 成为用户获取客户全貌的中心场所。这使得面向客户的员工能够向客户展现统一的形象，并提供更有意义、更令人满意的互动。\n\n\n\n#### 自动化业务流程\n\
  \n许多客户的业务流程会跨越应用程序的边界。例如，新客户入职流程始于 CRM 应用程序中的赢单机会或订单，但很快会进入会计系统，在那里必须创建新的客户记录、启动订单履行，可能还需要准备发票。对于服务型组织，已售出的项目和客户可能需要在企业项目管理应用程序中创建。\n\
  \n如果没有应用程序集成，这些流程跨越应用程序边界时，可能会引发延迟、冗余且易错的数据录入以及信息不完整等问题。来自一个应用程序的信息必须手动重新输入到另一个应用程序中。一个部门的操作或事件必须通过电子邮件、电话或会议通知给其他部门。\n\
  \n应用程序集成允许这些应用程序之间的交互以编程方式发生，由应用程序事件触发，且无需用户干预。当公司在 CRM 应用程序中的状态从“潜在客户”变为“客户”时，客户信息会自动传递给会计系统，并创建相应的客户记录。会计团队可能会收到一封自动发送的电子邮件来提醒他们这一事件。如果赢得了一个服务型销售机会，CRM\
  \ 中的该事件可以触发在企业项目管理应用程序中创建客户和项目记录，以便交付团队可以着手规划服务交付。\n\n在另一种用于自动化业务流程的集成形式中，另一个应用程序的用户界面元素会被嵌入到\
  \ CRM 应用程序中，这样在流程中的某个特定时刻，CRM 用户可以在 CRM 内部快速手动输入数据，或在另一个应用程序中发起交易。当需要用户监督或判断信息如何输入到其他应用程序时，这种方式非常有用。\n\
  \n#### 集成类型\n\nCRM 项目中常见两种集成类型：`数据级`集成和`用户界面`集成。在某些场景下，一种比另一种更合适；您的集成需求以及应用程序的特性将指导您选择合适的方法。\n\
  \n##### 数据级集成\n\n数据级集成涉及将数据从一个应用程序物理复制到另一个应用程序。这种类型的集成在设计、开发和测试上通常更为复杂。然而，它的优势在于使一个应用程序的数据能够完全用于另一个应用程序的所有功能。例如，如果通过集成将会计系统的发票复制到\
  \ CRM 中，它们就能用于 CRM 报表、触发 CRM 中的通知和其他工作流规则、可以通过 CRM 安全模型进行保护、能够被纳入 CRM 生成的电子邮件中，等等。\n\
  \n数据级集成需要定义的一个方面是数据的“流向”；例如，我们给出的例子中客户记录通过集成从 CRM 应用程序流向会计应用程序。如果在会计应用程序中有人更新了客户记录（比如更改了电话号码），会发生什么？这个更改是否应该反向流动，更新\
  \ CRM 中该客户的记录？必须就数据应如何通过集成流动，以及哪个系统“主控”哪些数据（换句话说，该系统版本的数据始终被认为是“真实的”，并覆盖所有其他系统）做出决策。\n\
  \n## 用户界面集成\n\n这种集成形式涉及将一个应用程序的界面元素（或来自该应用程序的数据报表）嵌入到另一个应用程序中。数据从未从一个应用程序物理移动到另一个应用程序；只是将其`视图`呈现给另一个应用程序中的用户。当关键需求仅仅是想向用户展示数据，或让用户更容易发起交易时，这种方式非常有用。这种类型的集成在设计上比数据级集成更简单。回顾上一节中发票集成的例子，与其实现数据级集成将发票数据复制到\
  \ CRM 应用程序，我们可以开发一个用户界面集成，即在 CRM 客户记录的一个选项卡中显示来自会计系统的客户发票报表。CRM 用户可以像查看 CRM 应用程序本身的一部分一样查看这些信息。但是，他们无法通过\
  \ CRM 搜索工具查询这些数据，这些数据也不能参与 CRM 工作流自动化及其他 CRM 功能。\n\n#### 集成工具\n\n对于用户界面集成，通常所需的定制编程量很小，并且不需要集成工具。大多数\
  \ CRM 应用程序都包含在用户界面中嵌入外部内容的功能；向基于浏览器的客户端发展的趋势使这变得更加容易。\n\n对于数据级集成，纯粹的定制开发仍然是一种选择，但编程工作量要大得多。大多数组织选择实施现成的集成工具，然后使用它来构建数据集成。该工具提供了底层功能（例如错误处理）、连接常见业务应用程序的适配器，以及大量数据转换功能，以方便映射和转换数据，将其从一个应用程序移动到另一个应用程序。使用这些工具所节省的编程工作量很容易证明其成本是合理的，并且结果更易于使用和管理。工具的选择将主要由所需的集成类型、涉及的应用程序以及您团队的技术专长和基础设施来决定。\n\
  \n#### 在 CRM 项目中管理数据级集成\n\n集成工作遵循任何 CRM 项目常见的“设计-构建-测试-部署”流程，但在本节中，我们将讨论一些特定于数据级集成工作的任务。\n\
  \n##### 识别集成场景和涉及的应用程序\n\n第一步是规划出期望的集成场景、数据流向以及涉及的应用程序。此信息可以简洁地通过表格来描述，如 表 6-1 所示。\n\
  \n![images](img/t0601.jpg)\n\n##### 映射数据\n\n一旦您勾勒出集成场景，就必须为每个场景制定数据映射。这项工作与数据迁移所需的数据映射非常相似；您可以将集成视为一种持续的数据迁移。对于每个场景，您必须定义两个应用程序之间的字段如何映射，并且必须记录数据从一个系统传递到另一个系统时所需的任何转换（表\
  \ 6-2）。\n\n![images](img/t0602.jpg)\n\n##### 开发集成\n\n集成开发存在一些值得讨论的独特挑战；所有关于管理定制开发工作的技巧在此都适用。\n\
  \n集成开发的一个特定要求是，开发团队需要为集成涉及的每个应用程序准备一个测试实例。这可能涉及大量的设置工作，应在集成工作的预算和时间表中予以考虑。\n\n####\
  \ 集成测试\n\n与 CRM 项目的其他组件一样，集成也应有文档化的测试计划。在集成中，让业务利益相关者和主题专家参与尤其重要。通常，需要那些熟悉与 CRM\
  \ 集成的应用程序的专家来发现集成中的问题。\n\n\n\n#### 管理 CRM 项目中的用户界面集成\n\n用户界面集成工作更接近于标准的定制开发工作，而非数据层面的集成。设计和开发用户界面集成时，会面临一些独特的挑战，值得讨论；所有关于管理定制开发工作的技巧在此均适用。对于用户层面和数据层面的集成而言，都必须解决的一个挑战是如何将数据从一个系统链接到另一个系统；这一主题将在下一节进行描述。\n\
  \n#### 在系统间链接数据\n\n开发集成的核心挑战之一，是如何将数据从一个应用程序链接到另一个应用程序。例如，对于 CRM 应用中代表琼斯公司的客户记录，集成程序如何才能在会计系统中找到代表同一组织的记录？需要存在某种*唯一链接*，用于告知集成程序：一个应用中的记录\
  \ #123 与另一个应用中的记录 #435 代表的是同一个现实世界实体。你可能已经猜到，仅凭名称是不够的；如果会计系统中的记录名为 Jones Corp 呢？\n\
  \n解决这一挑战的常用方法是将来自一个应用的唯一标识符，存储在另一个系统对应记录的字段中。几乎所有数据库应用中都存在的唯一标识符，其功能正如你想象的那样：它唯一标识一条记录，就像社会安全号码唯一标识一个美国公民。因此，如果琼斯公司在\
  \ CRM 中是记录 #123，在会计系统中是记录 #435，我们就可以修改这些系统，让它们互相跟踪对方的标识符，如图 6-8 所示。\n\n![images](img/0608.jpg)\n\
  \n**图 6-8.** 管理唯一标识符\n\n这种机制使得集成过程能够在应用之间正确地移动数据。如果要集成多个应用，更合理的做法或许是管理一个单独的唯一标识符表，而不是将这些信息直接存储在应用本身中。\n\
  \n从集成部署的这一刻起，集成过程将负责管理新创建记录的唯一标识符，具体方式可以是将标识符从一个系统填充到另一个系统，或者更新一个单独的标识符表。潜在的挑战出现在两个应用中*已有*的记录上。集成过程很可能需要能够将这些记录链接起来，例如，以便处理数据更新。因此，从一开始，要么两个应用中的所有记录都必须包含来自另一个应用的标识符，要么标识符表必须被完整填充。在许多情况下，组织已经以某种方式解决了这个问题，并确定了某种跨系统唯一标识记录的方法。如果你的组织尚未解决，那么你的集成计划、预算和时间表必须将完成这项工作所需的时间和精力考虑在内。通常，这项工作的大部分可以编程完成（例如，通过名称匹配和使用地址信息等方式），但这需要错误检查和异常处理，这可能是一个相当费力的手动过程。\n\
  \n## 报表\n\n报表通常是 CRM 项目的核心要素。除了作为用户的生产力工具以及作为简化和自动化业务流程的机制外，CRM 应用带来的关键价值在于提供了做出更优商业决策所需的信息，而这类信息大多通过报表来获取。\n\
  \n报表相关的工作贯穿 CRM 项目的各个阶段：\n\n-   **构想阶段**：在此阶段，需确定项目的高层目标。在许多情况下，报表是一个或多个目标的核心。例如，“获取销售代表活动和绩效的客观衡量指标”或“按产品线了解支持成本”等目标，都表明报表将是解决方案的核心。\n\
  -   **设计阶段**：在此阶段，需要定义所需报表的细节，以及为获取数据以生成报表而需要捕获信息的业务流程和应用配置。例如，如果某个销售报表需要按规模对商机进行分类，那么在销售流程中的哪个环节由谁捕获该信息？他们将在\
  \ CRM 应用中的何处以及以何种格式输入该信息？你不能脱离流程和应用设计来独立考虑报表设计。\n-   **构建阶段**：在此阶段，需使用适合报表类型的工具来开发报表。\n\
  -   **部署阶段**：报表应包含在系统测试和用户验收测试中，以确保其准确无误并满足 CRM 利益相关者的需求。报表也应包含在培训内容中，培训不仅要涉及如何运行报表的具体操作，还应涵盖所显示数据的来源和含义。\n\
  \n### 什么是有效的报表？\n\n识别合适的指标或关键绩效指标（KPI）并设计有效的报表本身就是一个主题，深入探讨该主题超出了本书的范围。在另一本书《Pro\
  \ SQL Server 2008 Analytics：Delivering Sales and Marketing Dashboards》中，Brian Paulen\
  \ 和 Jeff Finken 提供了关于如何识别和评估 KPI 的信息。在此，我们将提供一些在设计 CRM 报表时需要牢记的指导原则。首先，一个好的指标应能很好地适应你的组织，它需要考虑到你的目标、可用数据的质量，并且能够被你的团队轻松理解。这一定义在图\
  \ 6-9 中得到了有效展示。\n\n![images](img/0609.jpg)\n\n***图 6-9.** 什么是好的指标*\n\n以下是一组核心原则，任何组织都可以利用它们来验证一套基础\
  \ KPI，这些 KPI 可以作为全面销售和市场营销分析计划的核心业务指标。关于 KPI 的发展及其在组织战略中的作用的更深入信息，以下资源非常出色：David\
  \ Paramenter 的《关键绩效指标》和 Paul Niven 的《平衡计分卡逐步实施指南》。要使 KPI 在推动业务绩效方面发挥作用，你需要有一个关于什么构成良好\
  \ KPI 的标准。此外，组织需要了解这个标准，以便能够积极参与到 KPI 的管理和持续完善中。以下是我们鼓励客户遵循的核心原则：\n\n-   指标是具体的。\n\
  -   指标由特定部门或小组明确负责。\n-   指标是可衡量的。\n-   指标能够及时生成。\n-   对于给定的记分卡，KPI 的数量必须限制在可控的少数几项。\n\
  -   KPI 必须有目标值。\n-   KPI 必须与组织的总体目标保持一致。\n\n让我们逐一详细审视这些原则。\n\n\n\n### 关键绩效指标（KPI）定义原则\n\
  \n#### 指标需具体明确\n\n具体明确是指指标拥有精确的定义，能够被轻松解释，并使组织内的任何理性人员都能理解。销售和市场指标中最常见的不符合具体性要求的例子是`预测收入`。这并不是说没有必要衡量`预测收入`，但该指标的定义必须完全清晰，并能在整个组织内得到充分理解。\n\
  \n对于许多与我们合作的客户，我们会询问什么是`预测收入`，得到的回答通常是：这显然是指与销售团队当前正在推进的未结交易相关的收入。这或许正确，但依然缺乏足够的具体性。\n\
  \n一个优秀且具体的`预测收入`指标定义可以如下所示：\n\n> \"CRM 中记录的所有已通过资格审核、预计在本季度内完成交易的有价值交易的加权值。所有交易的价值已根据当前汇率转换为美元。此计算可通过将预测价值求和，再乘以\
  \ CRM 中的成交概率字段来完成。\"\n\n这是一个良好的指标定义，因为它明确且详细，任何熟悉业务和关键业务系统的人都能清晰地理解该值在汇总层面呈现的含义。如果没有类似这样详细的定义，那么审阅这些\
  \ KPI 的管理会议很容易演变成对指标意图的质疑（它是否包含潜在客户还是仅包含后期阶段的交易？是否根据成交概率进行了加权？），而本应用于讨论公司总体方向的宝贵时间则浪费在理解这些数字上。\n\
  \n#### 指标需由特定部门或小组明确负责\n\n责任归属能将指标从仅仅“有趣”转变为“可被采取行动”。关键在于，要使一个指标在推动组织前进方面发挥作用，必须有特定的个人或部门对其是否按计划推进负责。\n\
  \n知道产品销售的附加维护率可能很有趣，但如果没有明确的人对此附加率负责，它就不足以成为一项 KPI。通过坚持“指标必须有人明确负责，才值得花费时间衡量和展示”这一标准，你便执行了一项关键的筛选活动，有助于你将精力集中在少数真正驱动业务的关键指标上。\n\
  \n#### 指标需可衡量\n\n所有打算在计分卡中展示的要素都必须能够量化。衡量员工满意度是一个很棒的概念，但如果没有相应的业务流程和系统来持续跟踪当前的满意度，它就不是一个相关的\
  \ KPI，因为你无法在不猜测的情况下使用该指标进行决策。\n\n或许你会确定某个指标至关重要，这会促使你围绕它定义流程和系统，以便将其纳入计分卡。这可能是对时间和资源的极佳利用，但我们强烈建议，除非你具备了衡量的能力，否则不要将指标称为\
  \ KPI。这不仅包括捕获指标的系统，还包括确保一致性、审计追踪和监督的业务流程。\n\n#### 指标需及时生成\n\n在 KPI 管理中，另一个看似微小的细节是关注指标可被追踪的时间间隔。如果你的周度计分卡中有七个指标中的两个仅按月报告，那么这些指标的价值就值得怀疑。\n\
  \n我们意识到并非所有指标都遵循相同的周期，但我们强烈建议，为了确保你的 KPI 对决策有用，你必须能够按照固定的常规时间间隔重复生成每个指标，以便它能与其他关键绩效指标结合使用，从而全面了解组织的当前状况。\n\
  \n#### 特定计分卡的 KPI 数量必须控制在可管理的少数几个\n\n我们的一位重要客户请我们审阅其管理报告。他们邀请我们过去，并自豪地向我们展示了一本每月生成的、厚达\
  \ 50 页的手册，其中包含了该 200 人部门几乎所有运营的指标。他们解释说，问题在于这本手册汇编耗时过长（约 20 天），而且不幸的是，翻阅它的人并不多。\n\
  \n结论是，当前的报告需要更加自动化，并且需要大力推广这本新手册，以便人们知道应该查阅它来改进绩效。我们询问了该文档的负责人（总经理）是否经常参考它。他说：“不，信息量实在太大，我无法理解。我没有一整天的时间去弄清楚它所有含义。”\n\
  \n我们表示赞同，并建议让组织中的每个管理层级都拥有一份与其角色相关、并包含他们能控制和影响的指标的计分卡。每个此类计分卡应该展示五到十个关键指标，因为我们相信这大致是一个个体能够真正关注并产生影响的项目数量。\n\
  \n这种结构的关键在于，随着组织层级的上升，计分卡中的指标与组织战略直接对齐。许多组织认为衡量尽可能多的业务流程会带来更好的绩效，但我们的发现几乎相反。那些精心选择衡量内容，并有选择性地只追踪相对较少指标的组织，往往拥有最广泛采用且最持久的计分卡项目。\n\
  \n#### KPI 必须有目标值\n\nKPI 容易出问题的一个方面在于，从战略会议上制定的理论化指标，过渡到日常实际的管理和追踪。KPI 成功的关键在于，能够有效地从制定\
  \ KPI 转向基于已确立的 KPI 来设定和管理目标值。\n\n设定目标的关键点如下：\n\n*   设计的目标指标需在一个由现有业务流程支撑的、可存储和访问量化结果的系统中被捕获。\n\
  *   达到或未达到目标，应在该计分卡所考核的部门/人员的可控范围内。\n*   目标必须有清晰的时间限制，并与业务现实和组织战略保持一致。我们多次看到，良好的目标被设计拙劣的软件所破坏，这些软件要么未设定达成目标的时间线，要么将目标均匀地分摊到各个月份，而忽略了可能影响许多指标的季节性因素。\n\
  \n\n\n#### 关键绩效指标必须与整体组织目标保持一致\n\n请认识到，只有在头脑中有一个明确的组织目标时（换句话说，如果你的目标是让组织每年增长 50%\
  \ 并拓展至新地区，那么你的关键绩效指标将与你旨在维持 10% 增长并最大化利润时的指标截然不同），这些指标才能产生正向且长期的积极影响。制定关键绩效指标的团队必须非常谨慎地确保所选的前瞻性指标，能够真正引导组织走向其期望实现的目标。这句话乍看可能显而易见，但一个常见的失败案例是，负责开发关键绩效指标的团队过于沉迷于制定创造性指标的过程，以至于忽视了需要交付与组织达成目标明确关联的、简单明了的指标。\n\
  \n### 报表数据源\n\n客户关系管理系统（CRM）报表通常针对事务性数据库（即客户关系管理应用程序实际使用的数据库）或专门用于报表的独立数据库（常被称为*数据仓库*）来执行。\n\
  \n针对事务性数据库生成报表是最简单的方法；无需移动任何数据，也无需维护单独的数据库。然而，这种方法有几个缺点：\n\n-   *时间序列数据有限或根本不存在*：客户关系管理应用程序中数据随时间变化的信息具有潜在的业务价值。然而，针对事务性数据库生成报表只能提供执行报表时数据的一个快照。数据仓库可以随时间累积趋势数据，以回答包含时间维度的问题。例如，事务性数据库报表可以回答“我当前的销售管道有多大？”这个问题，但无法回答“过去六个月我的销售管道规模是如何变化的？”\n\
  -   *整合额外数据源的能力有限或根本不存在*：许多报表需要从包括客户关系管理系统在内的多个来源获取信息，以提供完整的图景。客户关系管理应用程序通常不支持为报表目的，将其他应用程序的数据导入其数据库。\n\
  -   *性能影响*：报表通常包含复杂的数据库查询，可能会给运行它们的系统带来压力。这可能会影响所有用户使用客户关系管理应用程序时的响应速度和性能。\n\n针对独立数据仓库生成报表消除了这些问题，但会增加额外成本，并使客户关系管理项目更复杂。必须定义数据仓库的结构，然后创建常规任务，以便将来自事务性数据库的新数据或更新数据同步到数据仓库。针对数据仓库运行的报表从来都不是“实时”的，从某种意义上说，它们并不代表事务数据的当前状态，而只代表数据仓库上次同步时的状态。\n\
  \n选择使用事务性数据库还是数据仓库进行客户关系管理报表生成，与客户关系管理项目相关的大多数决策一样，是在业务价值、成本、风险与复杂性之间的一种权衡。\n\n\
  ### 报表工具\n\n客户关系管理领域有几种不同类型的报表工具，它们适用于不同目的并具有不同特性。你可能最终会组合使用多种工具来满足你的报表需求。\n\n####\
  \ 呈现型报表工具\n\n这类工具擅长开发相对静态的报表，这些报表定期运行，以处理一系列重复出现的业务问题，并呈现给决策者。它们通常能生成视觉上吸引人的报表，但灵活性有限（除非更改报表的编程），并且交互性有限或根本不存在。仪表板报表是这些报表中特定的、图形密集型版本。\n\
  \n通常，客户关系管理应用程序会包含一些基本的呈现型报表工具，作为应用程序的一部分，从事务性数据库中检索数据。\n\n#### 数据分析工具\n\n如果说呈现型报表工具旨在展示预定业务问题的答案，那么数据分析工具则旨在探索数据以发现趋势和诊断业务问题，*而无需*预先设定具体问题。这些工具显然不太强调最终结果的精美度，但包含的功能可以让分析师过滤和细分数据，尝试不同的可视化方案，并执行统计分析。\n\
  \n数据分析工具通常不由客户关系管理供应商提供，必须单独从商业智能软件供应商处采购。\n\n### 报表设计\n\n理想情况下，报表设计是一个涉及业务用户、业务分析师和报表开发人员的迭代协作过程。设计过程的核心是报表规格说明文档，它描述了报表的功能，充当流程的接触点，并确保所有人保持一致。\n\
  \n报表规格说明有多种风格和变体，但大多数都会涉及图 6-10 中的主题。\n\n![images](img/0610.jpg)\n\n***图 6-10.**\
  \ 示例报表规格说明*\n\n### 报表培训\n\n鉴于客户关系管理项目预算紧张，很容易忽略报表方面的培训。这很可能是一个错误，原因如下：\n\n-   即使报表技术简单直观，通常也需要对*数据*进行培训。用户需要理解数据的含义、来源以及在进入报表前的过滤方式。如果报表包含复杂的计算，这些也需要向用户阐明。这些信息对于用户建立对报表的信任至关重要，而信任是报表驱动决策所必需的。\n\
  -   报表用户通常是高级管理人员，他们对客户关系管理项目具有重大影响。他们的满意度和热情对项目的成功至关重要，因此值得投入培训精力，以确保他们获得积极的体验。\n\
  -   与呈现型报表和仪表板不同，数据分析工具是复杂的软件包，需要培训才能有效使用。你可以考虑将业务分析师送到你的分析工具供应商那里接受专门的应用程序培训。\n\
  \n\n\n### 数据迁移\n\n数据迁移是指通过编程方式将数据从一个应用程序或系统复制到另一个。这是许多 CRM 项目的重要组成部分。假设一个组织正在实施新的\
  \ CRM 应用程序：一旦软件安装完成，该应用实际上就是空的。它不包含任何客户账户、联系人或潜在客户信息。这些信息需要用户根据需要手动输入，逐步填充 CRM 数据库，这是一个费力、低效且令人沮丧的过程。但通常情况下，现有应用程序中已拥有这些客户信息；它可能是一个即将被淘汰的旧版\
  \ CRM 应用。数据迁移工作会利用软件工具将这些信息从现有应用复制到新的 CRM 应用中，这样用户开始使用新 CRM 时，大部分数据就已经存在了。这使用户能够以最少的录入量开始高效工作，同时无需查阅已淘汰的旧应用即可访问客户和潜在客户的重要历史信息。\n\
  \n数据迁移并不仅限于新 CRM 的实施项目。例如，一个组织可能希望淘汰现有的独立客服应用，并将其以销售为核心的 CRM 应用扩展至包含服务功能。这个项目可能涉及将客户和服务历史信息从客服应用迁移到\
  \ CRM 应用中，以便服务用户能够轻松开始使用 CRM 来管理工作。\n\n执行良好的数据迁移可能极具价值，它可以帮助用户顺利过渡到新应用程序，并节省无数小时的手动数据录入时间。在数据集庞大的情况下，数据迁移是填充新应用的唯一可行方式。然而，数据迁移通常困难、昂贵且不完美。在本节中，我们将提供指导，说明如何评估特定项目是否需要进行数据迁移，以及如果需要，如何规划和执行数据迁移工作。\n\
  \n#### 你的项目需要数据迁移吗？\n\n鉴于数据迁移的难度和成本，明智的默认做法是不将其纳入项目，只有在经过仔细考量证明其价值后才添加。将数据纳入 CRM\
  \ 的业务价值必须与迁移所付出的努力相匹配。评估以下因素以确定数据迁移是否合理：\n\n*   相关数据是否以某种结构化格式存在？数据迁移可以从数据库、电子表格和其他结构化应用中完成，但对于电子邮件等非结构化数据通常不可行。\n\
  *   数据的复杂程度如何？数据中的多重关系、自由格式的备注和文件附件都会使迁移复杂化。\n*   数据集的大小。对于小型、简单的数据集，让用户或临时工作人员手动将数据重新录入新应用程序，可能比执行编程式数据迁移更具成本效益。\n\
  *   项目完成后旧应用的可用性。如果源应用不会因迁移而被淘汰，或者项目完成后仍可使用，那么仅需用户偶尔查阅的数据可能无需迁移。\n*   数据质量。如果数据质量非常差，从头开始可能比迁移后再清洗数据更省力。\n\
  *   数据的业务价值。将当前数据放入 CRM 应用的价值必须与迁移相关的成本进行权衡。\n\n#### 评估数据源\n\n每个考虑进行迁移的数据源（即应用程序或数据库）都必须从多个不同角度进行审视，既要用于决定是否迁移，也要能够设计和执行迁移。\n\
  \n##### 数据访问\n\n首先要克服的障碍是数据访问；你的数据迁移工具必须以编程方式访问源应用程序的数据。通常有直接的解决方案：数据迁移工具会附带“连接器”，使其能够轻松连接到流行的源应用。或者，如果源应用将其数据存储在标准数据库（例如，`SQL\
  \ Server`、`MySQL`、`Oracle`）中，大多数数据迁移工具可以毫无困难地访问它。对于使用晦涩或专有数据存储的数据源，通常可以通过应用程序内的某种导出工具来访问数据，该工具会将数据输出为标准格式，然后你的数据迁移工具可以读取该格式。如果是这种情况，务必要确保此导出功能包含应用程序用来将记录相互关联的唯一记录标识符（例如，联系记录与其父账户记录）。如果你的数据源使用专有数据存储格式且没有可用的导出功能，那么最好的办法可能是寻求应用供应商的帮助来访问数据。\n\
  \n##### 理解数据模式\n\n一旦能够访问数据，真正的工作就开始了。你必须理解数据的结构，以便设计数据迁移过程来复制重要数据并保留不同类型数据之间的关系。有些应用程序附带文档（通常是其软件开发工具包（SDK）的一部分）来描述数据模式。如果你使用应用程序的数据导出功能，这项工作量会大大简化，因为你通常会一次导出一个业务实体的数据。如果没有，你就需要像侦探一样去解码应用的数据模式。你需要为每个业务实体（例如，账户、销售机会）确定数据存储在哪些列和表中，以及不同业务实体之间的关系是如何管理的。应用程序的用户可以通过向你展示如何浏览应用界面并指出哪些数据是重要的且必须迁移来提供帮助，但他们通常并不熟悉应用的数据模式。为每种类型选择几条记录，并交替通过应用界面和直接查看数据本身来查看这些记录，通常能让你足够了解数据模式，从而完成迁移。\n\
  \n\n\n##### 数据质量\n\n几类数据质量问题会显著增加数据迁移的难度。其中最常见的问题或许是不一致的应用程序使用方式；这表现为不同用户使用相同的应用程序字段存储不同的信息，或者不同用户对应用程序术语的解释存在差异（例如，一位用户将某个潜在客户评为“合格”，而另一位用户则将同一潜在客户评为“不合格”），还包括简单的间歇性使用情况（例如，只有少数用户会费心输入其潜在客户的邮寄地址）。其他问题虽然直截了当，但可能需要投入大量精力。例如，对于自由文本的国家/地区字段，有些用户输入了“United\
  \ States”，有些输入了“USA”，还有些输入了“U.S.A.”或“US”，数据迁移过程必须处理所有这些变体。抽查记录、用户访谈和数据库查询有助于评估源系统中数据的质量，从而确定将其迁移到\
  \ CRM 应用程序的价值。\n\n同样重要的是要注意，即使在单个应用程序内部，数据质量也可能存在差异。例如，客户信息可能得到严格维护和更新，而潜在客户信息仅由少数用户使用，这些用户的数据录入习惯随意且缺乏标准化。\n\
  \n如有可能，最好优先独立于数据迁移来解决质量问题。俗语“垃圾进，垃圾出”常被用来描述这样一个事实：如果输入迁移过程的数据质量很差，那么您的 CRM 应用程序就会充满低质量的数据。数据迁移并不能解决数据质量问题。\n\
  \n#### 设计数据迁移\n\n设计数据迁移包含两个部分。第一部分是*功能*设计，它描述了将迁移哪些类型的数据（按业务实体划分，例如“客户”、“联系人”、“服务工单”）、每种类型将迁移哪些记录（全部、最近六个月、还是仅活跃记录？），以及对于每种类型，数据将如何映射到\
  \ CRM 应用程序。*技术*设计则描述了迁移将如何完成，其结构将由所选迁移工具决定。技术设计不在本书的讨论范围之内；在本节中，我们将重点关注功能迁移设计。\n\
  \n每个将参与数据迁移的源应用程序都需要其自身的功能和技术设计。\n\n数据迁移设计，如同应用程序设计（本章前面所述），是一个耗时耗力的过程，需要了解源应用程序及其使用方式的项目团队成员，以及最终确定的\
  \ CRM 应用程序设计的共同参与。\n\n##### 功能设计：迁移哪些数据？\n\n熟悉源应用程序的项目干系人和主题专家应该能够就应用程序管理的重要业务数据以及为达成项目目标必须导入\
  \ CRM 的数据提供指导。对于这个问题，你可能会听到一个敷衍了事的答案：“当然是全部数据。” 事实上，添加到迁移中的每个业务实体都会增加成本和复杂性，而且应用程序中的所有数据都能提供足够价值而值得纳入迁移过程的情况非常罕见。\n\
  \n##### 功能设计：每种类型迁移哪些记录？\n\n待迁移的数据量会影响数据迁移过程的成本和复杂性。它会显著增加开发、测试和执行迁移所需的时间。对于被确定为迁移组成部分的每种数据类型，都要考虑是需要迁移整个数据集，还是只迁移最有价值的一个子集。以从一个\
  \ CRM 应用程序迁移到另一个为例，你可能会问自己：“我需要保留五年前与客户的通话记录吗？” 或者“超过两年未更新的潜在客户真的还有价值吗？”\n\n#####\
  \ 功能设计：映射\n\n一旦确定了要迁移的数据类型以及每种类型内的记录，下一步就是记录数据的映射方式。这种映射在三个级别上进行，如下所述。\n\n######\
  \ 实体映射\n\n实体映射是最高级别的映射，在此级别，根据源应用程序每个数据类型的业务意图及其提供的功能，将其映射到相应的 CRM 业务实体。通常这种映射是直接且直观的，但也可能存在需要更多考虑的映射。例如，也许源系统有一个名为“销售拜访”的实体，而目标系统有“会议”和“电话”这两个实体。必须决定将“销售拜访”记录映射到哪里。也许这些记录中的大多数代表面对面的会议，在这种情况下，可能会决定将它们映射到“会议”。又或者，“销售拜访”中有一个标志位，用于指示该拜访是面对面还是通过电话进行的，并利用此信息来决定每一个“销售拜访”是创建“会议”还是“电话”。\n\
  \n实体映射的结果可以用诸如表 6-3 所示的简单表格记录下来。\n\n![images](img/t0603.jpg)\n\n###### 字段映射\n\n\
  实体映射完成后，就可以进行字段级映射。此工作包括：对于要从源应用程序迁移的每个实体，确定要迁移的每个数据字段以及应将数据插入到哪个 CRM 字段中。理想情况下，这些映射很简单；只需从源应用程序的`ABC`字段取值，然后插入到\
  \ CRM 应用程序的`XYZ`字段即可。但是，随着源应用程序中数据质量的下降，字段映射的复杂性开始显现。考虑这样一种情况：源应用程序中的某些用户将某部分数据放在`ABC`字段中，而其他用户则将相同数据放在`DEF`字段中。此时，不再是简单的字段到字段映射，而是需要加入一些逻辑，例如“先在`ABC`字段中查找；如果为空，则在`DEF`字段中查找，然后将得到的信息复制到\
  \ CRM 应用程序的`XYZ`字段。” 那么，如果源中的一条记录在`ABC`字段*和*`DEF`字段*同时*有数据，你又如何决定如何处理呢？理想情况下，你开始理解为什么数据迁移会是一项如此困难、不精确且成本高昂的工作了。记录所有权映射是数据迁移的另一个复杂元素。旧应用程序中属于前雇员的记录，在新应用程序中应如何分配？是应该为新应用程序中的前雇员创建用户记录以尝试保留记录历史，还是在迁移过程中将所有此类记录重新分配给当前员工？\n\
  \n字段映射可以通过扩展表 6-4 来记录。\n\n![images](img/t0604.jpg)\n\n## 值映射\n\n映射工作的最后一级是值级别。在此，我们需要针对字段映射表中的每一行，确定在将数据复制到\
  \ CRM 应用程序之前，需要对源应用程序中的数据进行的任何转换。这些“转换”的一些示例如下。\n\n\n\n####### 选择列表映射\n\n在映射到 CRM\
  \ 应用程序中的选择列表字段时，几乎总是需要这种转换。选择列表字段，也称为下拉列表框或简称为列表框，是一种用户输入信息时可以从有限选项集中选择单个值的字段类型。需要进行转换的原因有两个。首先，要映射的字段内容可能不完全包含相同的值。例如，考虑销售机会记录中用于跟踪机会销售阶段的字段。在作为源系统的旧\
  \ CRM 应用程序中，可用选项为“新建”、“进行中”、“合同阶段”、“已赢单”和“已丢单”。然而，新 CRM 应用程序采用了一种新的销售方法论，其阶段包括“新建”、“资格确认”、“方案制定”、“谈判”、“已赢单”和“已丢单”。为了将销售机会从源应用程序复制到新\
  \ CRM 应用程序，我们必须定义如何将源应用程序中的销售阶段值转换为 CRM 应用程序中的对应值。此定义需要熟悉源应用程序及其数据以及新 CRM 应用程序设计的项目团队提供输入。这些映射可以通过扩展表\
  \ 6-5 的格式以纳入字段值来进行记录。\n\n![图片](img/t0605.jpg)\n\n即使源应用程序与新 CRM 应用程序之间的某个字段值完全一致，也可能需要进行值映射。应用程序通常不会存储我们在列表框中看到的实际文本，而是存储数字代码。因此，例如，应用程序不会在数据库中为机会的销售阶段存储单词*New*，而是存储“3”，这是与单词*New*关联的数字。然而，CRM\
  \ 应用程序可能为“新建”设置了不同的数字代码，比如“8”。因此，即使两个应用程序中下拉列表的文本选项相同，当我们将销售阶段值从源应用程序复制到 CRM 应用程序时，也必须将“3”改为“8”。\n\
  \n##### 数据查找\n\n某些字段需要通过数据查找才能将源应用程序映射到 CRM。以销售机会中的“销售代表”字段为例。该字段的值表示负责此机会的销售人员。此字段通常链接到源应用程序中一个单独用户表中的相应记录。迁移过程必须从源应用程序的销售机会表中获取该值，使用此值在用户表中查找销售人员，然后在\
  \ CRM 中找到该人员对应的用户值，并将其填写到 CRM 中的相应字段。\n\n##### 数据解析\n\n不同的应用程序以不同方式处理相同的信息；这可能导致在数据迁移过程中需要解析数据。例如，假设源应用程序将个人姓名存储在一个名为“姓名”的单一字段中，而您的\
  \ CRM 应用程序则为姓名各组成部分分别设置字段（例如，“名字”、“中间名”和“姓氏”）。数据迁移过程必须以某种方式将源数据拆分为各个部分，并将正确的部分传递给\
  \ CRM 中正确的字段。\n\n这是一个数据迁移可能变得混乱且不精确的例子。虽然拆分姓名的算法（如上一个示例中所需）表现良好，但并非完美，当遇到“Dr. Sally\
  \ Brown”或“William Van Winkle”时可能会出错。“Van”是中间名还是姓氏的一部分？\n\n#### 数据迁移设计确认\n\n一旦数据迁移设计完成并记录在案，由团队进行正式确认至关重要。这是一个责任节点，团队应理解他们是在确认已审阅并考虑了该设计，并认为其符合业务需求。数据迁移设计是一项注重细节的任务，需要耐心。在此投入的时间是值得的，因为一旦流程构建完成后再更改设计，可能会导致大量的返工和成本。\n\
  \n### 数据迁移工具\n\n数据迁移可以通过多种技术工具实现；深入探讨这些工具超出了本书的范围。在本节中，我们将概述两种主要方法，以及每种方法的一些优缺点。\n\
  \n#### 专用应用程序数据迁移工具\n\n目前有许多专门用于帮助企业将数据迁入和迁出企业应用程序（如 CRM）的产品。这些产品具有一系列引人注目的优势，使其在大多数情况下成为最佳选择：\n\
  \n*   迁移通过用户界面设计和执行；无需编程经验。\n*   针对流行应用程序的预构建连接器，若您的应用程序有可用连接器，可快速轻松地设置基本迁移。\n*\
  \   拥有丰富的函数集，可轻松在数据迁移过程中执行数据转换。\n\n这些应用程序通常可以按永久许可（用于持续的应用集成，需要类似数据集成工具）或临时许可（用于一次性数据迁移）获取。通常，通过使用现成的数据迁移工具所节省的开发人员或顾问时间，远超过其许可成本。\n\
  \n#### 自定义数据迁移工具\n\n另一种数据迁移方法是构建自己的迁移应用程序，可以从头开始构建，也可以使用 Microsoft SQL Server Integration\
  \ Services 等平台技术。如果您具备可用的开发专业知识，这种方法能提供最大灵活性，并且在数据来源不常见或有特殊性能要求的特殊情况下，可能是唯一可行的方法。\n\
  \n然而，该方法比使用现成的数据迁移工具劳动密集得多。您的开发人员需要熟悉源应用程序的数据模式或接口（以了解如何读取数据），以及 CRM 应用程序的接口（以成功将数据从源应用程序写入）。现成产品中内置的所有逻辑，如错误处理、日志记录、转换函数，可能需要从头编写。\n\
  \n\n\n##### 测试数据迁移：模拟迁移\n\n在数据迁移开发过程中，你的团队可能会在测试环境中运行多次小规模迁移，以完善迁移流程并发现问题。然而，至关重要的是，至少应使用要迁移的完整数据集执行一次迁移。这种\"\
  模拟迁移\"可作为对迁移流程的测试、对迁移性能和时长的评估，以及最终数据迁移的一次预演。\n\n模拟迁移的一些重要要素如下：\n\n- 应使用完整数据集，并在将用于运行生产迁移的同一硬件上执行。此项演练的部分目的是了解数据迁移的时长；对于大型数据集，迁移过程可能需要数小时甚至数天。\n\
  - 项目团队的跨部门成员应参与测试和验证迁移结果。熟悉源应用程序及其数据的用户最有可能发现问题。\n- 模拟数据迁移流程应事先完全编写为脚本，并对每个操作保留带时间戳的日志。模拟迁移与实际数据迁移之间可能相隔数周或数月；除非将每个步骤都纳入生产迁移的脚本，否则你不会记住模拟迁移中所执行的所有步骤。\n\
  \n验证数据迁移流程有几种常见方法：\n\n- **查看数据迁移工具的错误日志**：这是一个很好的起点；大多数工具会记录失败的事务，从而能突出数据迁移流程中的问题。\n\
  - **查询测试**：此类测试涉及对源应用程序和 CRM 同时运行查询，以识别迁移问题。例如，如果源应用程序包含 50,000 个账户记录，那么在 CRM 中是否也创建了\
  \ 50,000 个账户？如果没有，哪些记录未被创建以及原因是什么？查询也可用于测试迁移逻辑的特定部分。例如，查询可以提供源应用程序和 CRM 中按销售阶段划分的销售机会数量，从而让你验证映射逻辑是否正确应用。\n\
  - **抽查测试**：这涉及识别源应用程序中的一些记录，并逐字段地在 CRM 中对照检查，以验证所有数据均已正确转换，并且源应用程序中记录之间的关系已在 CRM\
  \ 中忠实重建。在这三种测试形式中，这是唯一一种可以切实分派给项目团队成员的测试。\n\n在让项目团队参与测试时，要提醒人们在描述问题时做到**具体**。理想情况下，应提供未正确迁移的具体记录和字段。像\"\
  CRM 中的数据看起来不对劲\"这样笼统的评论是没有帮助的。\n\n在模拟迁移测试结束后，你需要就数据迁移流程做出\"是否继续\"的决定。如果测试中发现的问题较小，且能够轻松修正并重新测试，那么你很可能已准备好继续进行。如果测试迁移发现了重大问题，你可能需要调整项目计划，在问题解决后安排第二次模拟迁移。\n\
  \n##### 规划实际数据迁移\n\n实际的生产数据迁移（用于填充新的 CRM 应用程序）通常在晚上或周末进行，以尽量减少对用户的影响。理想情况下，用户在周五下午\
  \ 5 点之前继续使用旧应用程序工作，等到周一早上上班时，他们开始使用新的 CRM 应用程序，并发现所有数据都已迁移完成；这样他们就能专注于熟悉新应用程序，而不是录入数据。\n\
  \n在这种\"理想\"的数据迁移模型中，周五下午 5 点成为旧应用程序的\"截止时间\"。如果可能，此时整个应用程序应切换为\"只读\"模式，并准备一份用于迁移的数据提取。迁移过程将使用与模拟迁移相同的程序来执行。随后进行查询测试和抽查测试，以确保过程成功。\n\
  \n正如你可能想象到的，许多（即便不是大多数）CRM 数据迁移并不遵循这种简单模式。你自己的迁移细节将决定你自己的时间表和流程。\n\n###### 数据迁移时间表\n\
  \n除了作为数据迁移流程的最终测试并提供\"是否继续\"决策的机会外，模拟迁移还能让你极其重要地了解迁移过程的持续时间。\n\n理想情况下，迁移过程的持续时间应能适配标准的非工作时间窗口，例如一个晚上或一个周末。如果不行，理想情况下组织能接受一定程度的停机，以便有足够的时间窗口来执行迁移。如果停机不是一个可接受的选项，通常可以将数据迁移分段进行，以消除停机时间，同时仍能让用户保持工作效率。例如，对于实际数据迁移，与其一次性迁移所有五年的客户活动数据（这可能需要四天处理时间并需要停机），不如只迁移最近一年的数据，然后在每个连续的的非工作窗口中逐步迁移更旧的数据，直到所有数据迁移完毕。\n\
  \n###### 脚本\n\n规划数据迁移的一部分工作是制定详细的脚本，即一系列需要按精确顺序执行的任务，以成功完成迁移。该脚本在数据迁移流程的技术开发过程中创建并完善，并通过模拟迁移进行验证。要使模拟迁移具有任何价值，实际数据迁移必须使用**相同的脚本**以**相同的方式**来执行。\n\
  \n#### 数据迁移总结与关键经验教训\n\n以下是关键经验教训：\n\n- 数据迁移是大多数 CRM 项目的重要组成部分，可能极具价值，但除非有足够的业务价值证明其必要性，否则不应贸然进行。它可能困难、昂贵且不精确。\n\
  - 你或许听过一句关于数据迁移的常见表述：\"垃圾进，垃圾出。\"数据迁移并不能神奇地清理、标准化和去重数据；如果你的源应用程序存在质量问题，数据迁移只会将这些问题转移到你的\
  \ CRM 应用程序中。\n- 不要将数据迁移测试外包给你的咨询伙伴；他们不掌握数据和源应用程序的背景与理解，难以轻松识别问题并察觉\"看起来不对劲\"的情况。确保你的团队参与其中。\n\
  \n\n\n### 实施测试\n\n对于任何企业应用而言，测试都是初始实施项目及所有未来开发项目的重要组成部分。像 CRM 这类企业应用中出现重大应用错误或停机，可能会严重阻碍业务运营，造成巨大的负面影响；而轻微的应用错误对于用户来说，则是持续产生挫败感、摩擦以及对工作不满的根源。一个因重大错误而受损的新应用上线，可能会给该应用留下污点，在问题解决后的数周乃至数月内，都会妨碍应用的采用率，并降低您期望实现的价值。\n\
  \n虽然您可能会与咨询合作伙伴合作，进行 CRM 应用的初始实施以及后续的增强项目，但测试是一个无法完全外包的工作领域。您的咨询团队能够熟练地执行单元测试、系统测试、集成测试和性能测试，但他们无法主导用户验收测试。在这个领域，您的团队对业务、数据和流程的了解至关重要。由\
  \ CRM 各个利益相关方群体的代表积极参与的、稳健的用户验收测试，是 CRM 项目成功的关键要素。\n\n### CRM 应用测试的类型\n\n在本节中，我们将重点介绍\
  \ CRM 项目中可能需要的不同类型的测试、它们的目的以及如何将它们整合到您的项目中。\n\n## 单元测试\n\n这是在开发过程中，开发人员对新增或增强的应用功能进行的初步测试，在进行此功能标记为完成之前进行。这是应用开发人员的核心职责，应作为过程的自然组成部分纳入所有\
  \ CRM 开发中。此测试应探索该功能的每一个可能的逻辑分支，以确保其按设计中的规范运行。此测试在隔离环境中进行，不测试不同功能之间的相互作用。\n\n## 系统测试\n\
  \n当所有 CRM 应用功能的开发完成并部署到测试环境中后，系统测试可确保它们能够相互融合，并且在存在完整功能集的情况下仍能正常运行。通常，单个功能可能会以单个功能开发人员未预见的方式相互影响，因此一起测试完整的功能集至关重要。系统测试通常在\
  \ CRM 项目生命周期的构建阶段结束时执行，此时所有功能都已开发完成并经过单元测试。\n\n#### 集成测试\n\n在许多组织中，CRM 应用会与其他业务应用（如会计或供应系统）进行集成。集成测试旨在验证应用之间的连接是否正常运行，数据是否从一个应用流向另一个应用，以及（如果需要）是否被正确转换。\n\
  \n#### 性能测试\n\n对于使用最简定制开发的 CRM 应用部署来说，性能测试不太重要，但对于那些具有大量定制开发的应用则至关重要。大数据集和大量用户可能会对\
  \ CRM 应用的性能产生意想不到的不利影响，导致响应速度缓慢、超时错误和用户沮丧。地理上分散的用户群也可能引发 CRM 应用的性能问题，因为国家间的网络连接可能很差，从而影响\
  \ CRM 客户端和服务器之间的通信。如果您的项目包含大量定制开发，并且存在一个或多个加剧因素（如数据量、高用户数或地理分布），请确保您的项目团队已将性能测试纳入其项目计划中。\n\
  \n将重点放在定制开发的性能测试上，是因为主要 CRM 应用供应商所使用的测试用例很可能既包含大数据集也包含大量并发用户（假设您使用的是针对您组织规模设计的应用）。在合适硬件上运行的标准应用，很可能已经过测试，并在比您自身更严格的场景下通过了测试。另一方面，定制开发从未经过测试，而且开发人员有多种方式编写在高负载下会失败的代码。\n\
  \n## 用户验收测试 (UAT)\n\n用户验收测试是 CRM 项目生命周期中一个关键的验证步骤。在用户验收测试之前，所有 CRM 组件都已通过单元测试和系统测试，并且所有数据都已迁移。此时，测试环境本质上与上线后的生产环境相同。用户验收测试涉及执行\
  \ CRM 应用将要支持的关键业务场景，以验证以下几点：\n\n- 在已批准的应用设计文档中描述的所有功能均能按设计团队的意图运行。\n- 设计和开发完成的应用满足项目目标，并已准备好上线。\n\
  \n用户验收测试的一个独特之处在于，它由应用用户自己执行：可能是销售经理，或客户服务代表。在此之前的所有测试主要由技术团队进行。用户测试的另一个独特之处在于其全面性；应用功能、迁移的数据、集成以及其他应用领域都在用户测试中一并得到检查。\n\
  \n### 制定测试计划\n\n完善的测试计划会探索并验证应用的所有逻辑分支以及所有重要的业务场景。测试计划应编写得足够详细，以便多人能够可靠且一致地执行。\n\
  \n## 系统测试计划\n\n系统测试计划由测试用例组成；每个测试用例包括以下要素，通常以表格结构排列并按功能领域分组：\n\n- `ID` 是每个测试用例的唯一标识符。\n\
  - `行动` 描述了测试人员在应用内应执行的确切步骤。\n- `预期结果` 描述了行动应产生的结果，以便测试人员评估应用是否通过或未通过该测试用例。\n- `通过/失败`\
  \ 指示应用结果是否与预期结果匹配。\n- `实际结果` 对于失败的测试，描述了应用表现出的行为。\n- `测试日期/时间` 是执行测试用例的日期和时间。\n\
  - `测试人员` 是执行测试用例的个人。\n- `环境` 描述了用于测试的环境的技术细节，例如哪个测试环境、哪个测试客户端机器等。\n- `备注` 是关于测试用例的额外描述性注释。\n\
  \n图 6-11 和 6-12 显示了一个示例系统测试计划，分别是测试前和测试后的状态。\n\n![images](img/0611.jpg)\n\n**图 6-11.**\
  \ 示例系统测试计划（测试前）\n\n![images](img/0612.jpg)\n\n**图 6-12.** 示例系统测试计划（测试后）\n\n\n\n\
  ## 用户验收测试计划\n\n用户验收测试计划在格式上不同于系统测试计划，以体现此类测试的不同视角和目标。用户验收测试的真正目的并非“找漏洞”，而是验证经过配置的\
  \ CRM 应用能否支持业务流程并达成应用目标。在 CRM 应用设计阶段提供关键输入的业务用户，可能因缺乏应用经验而无法预见到最终应用将如何工作；用户验收测试让他们能够验证应用“可用”并能优雅地支持用户完成工作。基于这一重点，用户验收测试计划围绕关键业务场景构建，例如图\
  \ 6-13 和图 6-14 中所示的场景。你可能会发现，组织用户验收测试的过程既是培训也是测试，因为用户通常需要一定程度的培训才能有效测试和评估应用的就绪程度。\n\
  \n![images](img/0613.jpg)\n\n**图 6-13.** 用户验收测试计划（测试前）\n\n![images](img/0614.jpg)\n\
  \n***图 6-14.** 用户验收测试计划（测试后）*\n\n### 实施培训\n\n培训在 CRM 项目中常常被置于次要地位，但对于项目的成功至关重要。每次您的\
  \ CRM 项目发生变化，无论是流程变更还是应用升级，都必须考虑培训。培训有助于确保团队正确执行业务流程，一致地使用 CRM 应用，从而最大化生产力。即使没有任何变更，培训仍然是\
  \ CRM 项目中持续存在的重要环节，因为您仍然需要培训新员工和岗位调动人员。\n\n#### 培训目标\n\n培训的明显目标是确保组织内的人员理解其工作中需要执行或支持的面向客户流程，并能自信地在这些流程的上下文中使用\
  \ CRM 应用。新流程和应用可能令人困惑和畏惧，因此正式培训项目极具价值——通过引导用户学习新内容并提供提问和讨论例外案例的机会，这比让用户自行摸索或依赖非正式的“在职培训”更成功。\n\
  \n培训的另一个重要目标是促进 CRM 流程和 CRM 应用的一致应用。流程和应用在使用一致时价值更高，这需要让每个人都达成共识。正式培训是实现这一目标的绝佳途径。\n\
  \n#### 成功培训计划的要素\n\n与 CRM 项目的大多数要素一样，培训的成功始于周全的计划。在本节中，我们将描述有效培训计划的几个要素。\n\n#####\
  \ 兼顾流程与应用\n\nCRM 培训的一个常见缺点是，有时会完全聚焦于 CRM 应用。组织认为应用是新的/不同的/令人畏惧的，因此培训内容侧重于登录应用、搜索客户信息、录入不同类型的交互（`订单`、`商机`）以及执行报表等主题。\n\
  \n这种以应用为中心的不足在用户开始实际使用应用时会变得明显，导致疑问、困惑和不一致的使用方式。用户会提出诸如“我知道*如何*将新线索转化为合格商机，但*何时*应该这样做？”或“我如何判断一个服务案例是否应标记为*紧急*？”之类的问题。这些问题表明用户对与应用程序相关的流程和术语缺乏清晰理解，而非对其使用操作的困惑。\n\
  \n最佳的培训会逐步引导用户了解其工作职能需要支持的流程，并在每个步骤中演示需要在 CRM 应用中采取哪些操作。还应讨论常见的例外情况及其处理方法。\n\n#####\
  \ 定义术语\n\n对术语的混淆及其导致的 CRM 应用使用不一致或错误，是 CRM 项目中的常见问题。请确保在培训内容中明确界定应用中使用的任何术语，并在 CRM\
  \ 应用设计中努力避免在不同语境下使用不同的术语。您可能还希望在培训材料中包含此信息，以便用户在日后遇到问题时可以查阅。\n\n##### 多次培训接触\n\n\
  反复接触培训材料有助于人们“巩固”理解。不要依赖单独的一次培训课程作为培训计划的全部。理想情况下，应将内容分散到几次课程中，以避免长时间课程导致注意力下降，并提供重复关键要素的机会。确保在主要培训之后，定期安排非正式的跟进培训或问答环节。\n\
  \n##### 为受众定制培训\n\n如果呈现的内容与学员自身的工作职能相关，他们的参与度会最高。与其提供通用培训或包含仅适用于部分培训受众的特定角色内容，不如举办多次针对特定角色的培训课程。可以在通用课程中涵盖某些主题，然后让学员按角色分组进行更具体的课程。\n\
  \n##### 包含练习和示例\n\n动手练习有助于发现培训参与者的疑问和困惑点，增强他们对应用的熟悉度，从而提升信心，并打破培训课程的单调感。虽然从培训基础设施的角度来看，设置动手练习（必须在培训场地提供运行\
  \ CRM 应用的机器）稍显复杂，但根据我们的经验，这种投入是值得的，因为它能显著提升培训质量。常见情况的示例，特别是针对例外案例的示例，也是对培训内容的有益补充。\n\
  \n##### 高管参与\n\n对于新启动的 CRM 项目，培训将是大多数人接触该项目和 CRM 应用的第一步。根据我们的经验，由项目的执行发起人介绍培训，向参与者说明组织为何启动\
  \ CRM 项目、由此应实现的收益以及培训参与者需要做出哪些努力才能使项目成功，这非常有帮助。正如我们在本书其他部分所讨论的，组织领导层持续公开支持 CRM 对于成功推动应用至关重要。培训是实现这一目标的绝佳机会。\n\
  \n##### 不要忘记帮助资源\n\n确保您的培训告知参与者在培训结束后可获得的不同支持选项。这可能包括用于提问的邮件列表、专家用户的“办公时间”，或内网网站上的帮助和培训内容。\n\
  \n#### 培训方法\n\n接下来，我们将描述我们所见过的两种最常见的 CRM 项目培训方法：现场课堂培训和网络研讨会式培训。还有其他方法，例如在线自学课程，但这两种是我们常见且最经济有效的方法。\n\
  \n\n\n##### 课堂培训\n\n这是经典的、由讲师现场指导的培训形式。我们发现这是最有效的培训方式。理想情况下，内容应融合讲座、演示、应用展示以及学员的动手练习。小组人数应控制在\
  \ 15 人以内，以确保培训具有互动性，并且讲师在必要时能够给予每位学员个别关注。每次培训时长不应超过四小时，并安排充足的休息时间。\n\n动手练习通常意味着培训参与者需在培训期间使用自带的笔记本电脑或培训室提供的电脑。这些练习应严格管控，仅限练习时间内使用电脑，以帮助参与者专注于培训内容，避免他们沉溺于查看邮件或其他工作。\n\
  \n对于地域分散的组织来说，组织线下课堂培训可能既困难又昂贵。我们观察到，有些组织通过将培训与预先计划好的活动（如全国销售会议）相结合来成功实施培训，届时所有受影响的员工本就需要集中开会。\n\
  \n## 网络培训\n\n与线下课堂培训相比，网络培训更易于组织，成本也更低（无差旅费用）。它还可以轻松录制以供重复使用。然而，它也存在一些缺点。讲师与学员之间的互动更加困难。学员经常在培训期间“走神”，处理副业或补看邮件。讲师无法观察学员的面部表情或肢体语言，可能在不知不觉中“失去”听众。动手练习的后勤工作可能更复杂，因为软件可能需要安装在远程用户的个人电脑上，而不是培训室里的一批机器上。\n\
  \n##### 培训资料\n\n一套精心设计的培训资料能让你的培训课程更高效，并为参与者提供可参考的帮助材料，帮助他们适应新流程以及新版或增强型 CRM 应用。\n\
  \n###### 指南\n\n培训指南应根据角色定制，并组织成逐步引导读者完成每个业务流程的结构，同时引用 CRM 应用中对应的操作步骤。截图是一个重要元素，能使应用操作指南更易于理解。培训指南还应包含某种形式的“组织术语表”，或以某种方式定义员工可能遇到的所有术语。\n\
  \n培训指南也必须保持更新；每当流程发生变化或 CRM 应用得到增强时，指南中受影响的文字和截图也应同步更新。\n\n尽管通常以简单的文档形式准备，但将培训指南内容通过协作工具（如\
  \ Wiki）在线提供给用户也有其优势。这使用户能够轻松搜索指南、添加评论，甚至可以用额外信息更新指南。\n\n图 6-15 展示了一份简单的、以销售为重点的培训指南的示例目录。\n\
  \n![images](img/0615.jpg)\n\n***图 6-15.** 培训指南示例目录*\n\n除了更标准的培训指南，许多组织发现关注常见问题也很有价值。我们历来使用快速参考指南作为提供此类信息的工具。如果该工具可打印，并最好能过塑，以便用户贴在办公室或放在电脑包里携带，那将会很有帮助。虽然你的指南会因你选择实施的应用而有所不同，但图\
  \ 6-16 是快速参考指南可能的样子示例。\n\n![images](img/0616.jpg)\n\n**图 6-16.** 快速参考培训指南示例\n\n\
  ###### 录制的演示视频\n\n录制的演示视频展示应用界面，同时演示者执行特定任务并配以语音解说。制作这些视频很简单，不需要昂贵的设备或软件。可以录制常见场景（例如，“创建服务工单”或“向订单添加产品”），并将其发布在内网网站或培训\
  \ Wiki 上，供应用用户观看。\n\n###### CRM 团队会议\n\n在启动 CRM 项目时，安排定期的 CRM 团队会议会很有帮助。这些会议可用于非正式培训，让员工描述他们在\
  \ CRM 项目中遇到的问题、困难或挫折。这是一个很好的方式，可以保持对员工在 CRM 方面动态的把握，并了解如何增强流程和应用以提供更好的体验。它也为员工提供了一个互相解答\
  \ CRM 问题的场所，这有助于巩固对应用的共同拥有感，从而促进用户采纳。\n\n#### 持续培训\n\n培训是 CRM 项目持续不断的一部分。尽管与改变流程或增强\
  \ CRM 应用相关的项目会带来培训活动的高峰，但必须为现有员工制定定期的培训计划，以巩固他们使用不一致或不正确的领域，并让用户了解 CRM 应用中可能提高其生产力的新功能。此外，组织内会出现人员流动，新员工和岗位变动的员工也需要培训。\n\
  \n新员工培训通常由各职能区域内指定的培训师负责。应挑选那些深刻理解本部门流程、认识到 CRM 对团队和组织的价值，并具备有效沟通和培训软技能的人员。CRM 管理团队最适合牵头对用户进行关于新的或未使用过的\
  \ CRM 应用功能的定期培训。\n\n### 启动解决方案\n\n一旦你完成了所有必要的培训活动，就应该开始专注于首次功能阶段的部署。在此过程中，你的团队和组织都应预见到会经历一些阵痛。无论用户过去使用什么，新的应用很可能都会给他们带来巨大的变化。为这些阵痛做好准备，更重要的是，协助你的用户完成过渡过程，将使你和你的团队能够成功推动项目至完成。\n\
  \n#### 切换上线\n\n切换上线（或正式启用）的过程根据实施的类型和复杂程度而有很大差异。围绕切换上线，最需要关注的是规划和沟通。清楚了解谁在做什么、何时做，将意味着整个过程更顺利。应用正式上线可能压力巨大，时间紧迫且任务繁多。\n\
  \n虽然我们在第 7 章也提供了类似的示例，但图 6-17 中的模板将允许你跟踪上线任务、负责人以及任务需要完成的时间。虽然你未必总能准点完成，但以这种方式规划所有任务能让你看到全局。\n\
  \n![images](img/0617.jpg)\n\n***图 6-17.** CRM 上线计划示例*\n\n根据你是否需要从其他应用迁移，你可能需要在周末内完成各种上线活动。这样你可以在此过程中开展工作，同时尽可能减少对用户群体的干扰。\n\
  \n接下来，我们将重点介绍作为上线过程一部分的几个关键组成部分。\n\n\n##### 最终数据迁移\n\n正如我们在本章前面所讨论的，最好在非工作时间进行上线数据迁移。这不仅最大限度地减少了对用户的干扰，还会使数据迁移及其准确性测试的过程更加容易。概括来说，此流程包括清除测试数据迁移期间完成的所有工作、执行生产环境迁移、监控迁移完成情况，以及在迁移完成后验证数据。考虑让用户参与数据验证过程，以确保他们对数据的有效性有切身利害关系。\n\
  \n正如我们刚才提到的，在周末完成此流程是更可取的方法。如果你无法利用周末时间完成这项工作，则需要在你的计划中安排时间执行初始迁移、验证数据，然后完成一个包含初始迁移与期间完成的工作之间数据差异的迁移。\n\
  \n##### 客户端应用安装\n\n根据您使用的 CRM 应用程序，有些可能会为您提供在实施过程中实现客户端用户界面或加载项产品的机会。如今，基于电子邮件在大多数公司环境中的重要性，许多此类客户端安装都是在您的电子邮件应用程序中进行的，并能为用户提供一种无缝的方式，在\
  \ CRM 应用程序和电子邮件之间管理信息。如果此安装是您需要关注的重点，请考虑以下事项：\n\n-   **谁来安装？**：执行安装的显而易见的选择是最终用户自己、您的内部\
  \ IT 团队，或者协助您实施工作的供应商。尽管每一种都有其优势，但通常您的内部 IT 团队对您的内部基础设施最为熟悉，可能能够快速完成安装。鉴于其对客户端的熟悉程度，您的供应商或许也能快速提供协助，但从成本效益角度来看，这可能使其成为次要或第三选项。\n\
  -   **安装前提条件**：大多数需要安装的应用程序都有软件前提条件，需要在实际客户端应用程序安装之前进行安装。除了物理安装之外，您还应该花时间验证终端用户的计算机是否足够强大以支持客户端安装。不幸的是，许多公司\
  \ IT 环境为其用户采购的是最低配置的计算机，硬件问题可能导致严重的性能问题，从而危及上线初期的应用采用率。\n-   **部署方法**：取决于您的 IT 团队的专业水平，您可能需要逐个安装这些客户端。在更大、更成熟的\
  \ IT 环境中，可能有可用的部署工具将这些更新推送到客户端机器上，从而减轻内部 IT 或供应商员工的负担。如果您最终采用这种方法，请花一点时间与 IT 团队一起验证初始设置，以确保您的用户社区第一次就能正确获得客户端。\n\
  \n虽然如果您使用的是带有必需或可选客户端应用程序的应用，评估这些考虑因素很重要，但通过使用基于 Web 的应用程序，您可以避免许多此类复杂情况。根据所选的 CRM，可能对允许的浏览器版本有限制，但该过程应该会简单得多。\n\
  \n### 沟通\n\n在切换过程中，向不同的利益相关方提供可靠的沟通流将有助于您的团队应对可能出现的任何问题，并且还将在需要您的项目领导团队或用户社区关注的事情出现时，提供必要的\"\
  保护伞\"。\n\n根据切换过程的持续时间，考虑每天提供一次或两次更新。利用这些更新来沟通状态、解决已经出现的问题，并引入一个有趣的功能供您的用户社区查看。\n\
  \n图 6-18 显示了一个简单但有效的模板，您可以用它来提供这些更新。\n\n![images](img/0618.jpg)\n\n**图 6-18.** 示例：上线用户沟通\n\
  \n除了常规的用户更新之外，如果出现任何问题，在问题变得严重之前进行沟通将使您的上线更有可能成功。除了尽快寻求支持外，让您的项目领导团队参与到任何关键问题或决策中，将使他们能够更积极地参与。\n\
  \n##### 部署后支持\n\n完成上线流程并部署应用程序后，您需要切换到应用支持模式。作为部署的一部分，您应该预期会花一些时间与用户一起回答问题或提供有关如何使用特定应用组件的信息。第\
  \ 7 章从更长远的角度探讨了这种支持，但规划短期需求也很重要。\n\n如果您在项目中聘请了供应商，他们通常也会在刚上线后的一段时间内为您和您的用户提供一些支持。无论谁负责此项任务，请审阅第\
  \ 7 章中列出的要点，并选择那些对您的实施有意义的内容。\n\n### 初始应用管理\n\n像上线后支持一样，持续的应用程序管理在第 7 章中有更详细的介绍。尽管如此，识别出一些部署后立即需要思考的焦点问题仍然很重要。在本节中，我们将重点介绍几个早期的考虑因素。\n\
  \n#### 推动采用\n\n作为 CRM 实施的一部分，快速推动采用将决定您的上线是能迅速成功并获得正面评价，还是陷入用户问题和投诉的泥潭。确保用户看到应用程序的适当价值，并充分使用它，将有助于保持事态的积极发展。组织常犯的一个错误是，在部署新的\
  \ CRM 工具后，允许用户继续使用或查看旧的应用程序。这是实施团队可能犯的最严重错误之一，因为它为用户社区提供了借口的机会，并且只会造成混乱。当然，如果您要关闭旧系统，您需要花适当的时间确保旧系统中的数据和所需功能在新系统中可用。此外，在启动后的初期阶段，可见且积极的高管支持对于帮助用户牢记\
  \ CRM 的价值和愿景，并鼓励员工坚持使用，直到他们熟悉新流程和应用程序，非常重要。\n\n##### 胡萝卜 vs. 大棒策略\n\n为了确保所交付解决方案的采用，高级管理人员可以在\"\
  胡萝卜\"和\"大棒\"策略之间做出选择。虽然这两种方法都有其优点，但方向决策取决于管理层风格以及组织中其他应用的现有采用情况。根据我们的经验，很少有管理者在没有\"\
  胡萝卜\"的情况下有决心让\"大棒\"奏效，因此在上线过程推进时要记住这一点。\"胡萝卜\"可能包括表彰积极使用应用的用户，或者为帮助推广应用而提供的小额奖金。\"\
  大棒\"的一个例子（对于销售团队）可能是制定一项政策，即除非交易在 CRM 应用程序中记录和跟踪，否则不会为赢得的交易支付佣金。\n\n\n\n###### 将关键绩效指标与薪酬和\
  \ CRM 使用挂钩\n\n推动应用程序使用的一种更常见“大棒”式手段，是将个人的目标或薪酬与 CRM 的使用挂钩。无论你期望的 CRM 使用是像跟踪邮件通信或活动这样简单，还是像提供关于销售机会的详细销售阶段和状态信息这样复杂，你都应该能够成功地找到无可争议的指标来管理薪酬。考虑定义一个算法，综合考量使用情况、记录更新数量以及跟踪的活动数量，为每个用户生成一个分数。你还可以确保用户只对在系统中留存了特定时长的销售机会获得佣金提成。这将防止有人只在拿到已签署合同时才录入信息。\n\
  \n#### 变更管理\n\n如同本节中的大多数主题一样，变更管理在第 7 章中有更详细的讨论。在系统上线后，立即利用我们在第 7 章中提供的工具来跟踪关于应用程序的任何即时反馈至关重要。你可能需要在上线后定期安排指导委员会讨论，甚至在初期每天进行\
  \ 10 到 15 分钟的会议，以讨论出现的任何高优先级问题。指导委员会应准备好审查问题，并迅速向团队更新进展情况和缓解措施（如果适用）。此外，持续沟通应用程序的状态、新工具带来的好处以及关键功能的亮点，将有助于你塑造更积极的展望，并对团队提出的任何关切做出更及时的响应。\n\
  \n#### 人员管理：新工作职能\n\nCRM 的实施本身不会改变你员工的工作方式；但它可能需要他们在现有职责范围内以不同的方式运作。也许以前人们会用手工将纸质订单交给会计部门处理，而现在他们自己在\
  \ CRM 中录入。也许用户过去需要花费大量时间报告管道状态，而这个过程现在已经自动化了。无论他们是有了更多时间投入到工作中高价值的部分，还是日常工作流程有了细微变化，你都应该准备好过渡期间根据需要给予他们尽可能多的支持。\n\
  \n## 整合：CRM 实施项目计划示例\n\n在本章中，我们按主题组织内容，例如数据迁移、报告等，而不是按照你将如何按时间顺序组织项目工作。在图 6-19 中，我们展示了一个高层次的项目计划，以帮助阐明这第二种视角：项目工作实际上是如何在日历上铺开并完成的。\n\
  \n关于该图表的一些重要说明：\n\n-   图中描述了我们讨论过的迭代式项目流程。设计工作会持续深入到迭代构建阶段，并根据项目团队与 CRM 应用程序原型交互后做出的调整而进行。\n\
  -   由于报告、集成和数据迁移设计最终都依赖于应用程序的设计，在迭代方法中，这些设计在初始设计阶段之后很可能会有所变化，以反映在迭代过程中对应用程序所做的修改。在应用程序设计最终确定之前，所有其他设计都不能“板上钉钉”。\n\
  -   每个阶段内列出的项目没有特定顺序，不反映其完成的先后顺序。\n\n![images](img/0619.jpg)\n\n***图 6-19.** 高层次项目计划*\n\
  \n## 常见项目问题及如何避免\n\n现在，我们已经为你概述了可用于帮助你实施 CRM 应用程序的各种流程和工具，我们想概述一下 CRM 实施中出现的几个经典项目问题。我们将提供这些问题的一些症状或原因，并提供一些关于可采取的避免措施的信息。\n\
  \n### 范围蔓延\n\n在本书的不同地方，我们都谈到用分阶段法或大爆炸法来实施 CRM。“范围蔓延”是阐述同一挑战的另一种说法。允许过多的范围，或者总体需要过多变革的范围进入你的\
  \ CRM 实施，将在你推出第一个版本的 CRM 应用程序时带来重大挑战。定义解决方案是否范围过度的不仅仅是范围的数量，还有范围的复杂性。如果你包含了大量的集成、多个系统替换或其他复杂项目，你的用户社区可能会被这种变革压垮。\n\
  \n专注于小而可控的部署是降低范围蔓延风险的最简单方法。如果可能，将实施的第一阶段分解为一小批有意义、能为最终用户社区提供独特价值的范围。一旦你成功完成了一个阶段，找到更多的时间、预算和成功就应该是顺理成章的过程。如果你确实需要在第一阶段进行大规模实施，请严格审查范围项，以确保没有某一用户组被变革过度负担。你还可以投入额外的时间进行培训和用户支持，以帮助缓解因范围数量较大而增加的额外风险。\n\
  \n### 过度复杂的设计\n\n无论是简单设计账户和联系人实体，还是专注于 CRM 应用程序中一整套自定义实体和属性，试图让它们满足所有人的所有需求，会很快在表单布局和可用性方面引发冲突。无论是审视\
  \ CRM 表单，还是考察 CRM 程序中集成和自定义项的复杂性，这种冲突都存在。一次构建太多内容，或者没有仔细管理用户的期望，都可能导致 CRM 系统的设计乃至最终实施变得过于复杂，并引发用户采纳方面的问题。\n\
  \n我们经常听到我们的客户和其他顾问谈论尽量使用现成功能。这绝对是避免 CRM 应用程序过度复杂设计的一个起点。除了关注原生 CRM 功能，让一个能在项目中客观审视各种定制化或自动化请求，并就最初应该构建什么提供指导的人参与进来，将有助于确保你的设计既能满足用户需求，又能保持尽可能简洁。\n\
  \n### 软件驱动的项目\n\n大多数组织常犯的一个错误是，让各种 CRM 应用程序中可用的功能来驱动整个实施。无论是为了适应新的 CRM 工具而改变现有正常工作流程，还是仅仅因为某个功能在工具中可用就实施它，这都会立即将工具的采用置于风险之中。任何时候，当用户被要求为了技术而改变流程时，他们更有可能抵制应用程序，并寻找新应用程序的变通方法。此外，这种方法常常导致范围蔓延，从而引发许多相同的问题。\n\
  \n利用当今可用的技术，几乎任何东西都可以在 CRM 应用程序中进行定制或构建。专注于使用这些工具，使应用程序适应你组织期望的流程。我们认识到，无休止地在 CRM\
  \ 工具中构建功能既昂贵又耗时，因此，优先处理那些最能促进流程的项目可能很重要。但最终，通过正确的关注和持续的投入，你将能够实施所有必要的功能来满足所有流程要求。\n\
  \n\n\n### 缺乏高管支持\n\n在项目的几乎各个阶段，获得适当层级的高管支持，对于找到合适的供应商（如适用）、帮助确定实施团队的优先事项以及指导整个项目全局都至关重要。初始部署之后，高管支持对于推动用户采用该解决方案、确保任何出现的问题都能得到适当沟通并以恰当方式处理，同样至关重要。如果在任何时刻，高管团队的支持力度，甚至仅仅是沟通程度开始减弱，这都将对你的项目构成风险，需要迅速处理。\n\
  \n管理围绕高管支持力度或程度出现的任何问题通常相当直接。幸运的是，大多数高管在面临会让他们损失金钱或信任的风险时都会做出回应，因此仅仅提出这个问题通常就能提高他们的参与程度。如果单凭这一招不起作用，可以寻找机会帮助他们处理诸如起草项目邮件之类的沟通事务。最后，确保他们在谈论\
  \ CRM 价值或处理任何问题时手头拥有所有必要信息，这将使他们更有可能深度参与整个流程。\n\n### 管理不同的优先事项\n\n无论冲突是集中在 CRM 实施上，还是将\
  \ CRM 的优先事项与某些无关事务相冲突，能否有效管理项目中各利益相关方不同的优先事项，将是获取他们适当参与程度的关键。如果项目团队成员对项目优先级有不同的看法，从项目一开始就处理这些问题将大有裨益。\n\
  \n项目章程、项目状态讨论甚至设计文档等工具都可以用来团结团队并提请注意任何重要问题。如果冲突存在于 CRM 优先事项与其他组织举措的优先事项之间，那么你的执行发起人和项目指导委员会将是解决问题的最佳机制。你的组织规模越大，这类冲突发生的可能性就越高。如有必要，请计划在你的项目计划中预留一些额外时间，以应对整个项目中优先级的小幅变动。\n\
  \n### 应用程序采用\n\n我们在本章前面部分讨论过应用程序采用。基于这些信息，本章此部分所概述的所有项目都可能导致应用程序采用率不足。应尽可能避免出现诸如优先事项分散用户精力、范围过度、高管支持力度不温不火的观感等问题，以便用户能适应新应用程序。应用程序采用方面的问题可能会破坏你的初始实施以及你获得支持（和资金）的能力。\n\
  \n迅速解决问题至关重要。在整个过程中为你的团队提供额外的培训、支持时间和资源，将有助于顺利实施，并为你的团队在未来的任何阶段做好充分准备。\n\n## 总结\n\
  \n在本章中，我们概述了初始 CRM 项目的不同要素。这些主题中很多都足以单独成书，因此我们提供了我们认为足够的信息助你起步，并提供了一些简单却有效的模板供你使用。基于我们深厚的\
  \ CRM 咨询经验，我们也致力于识别出典型 CRM 实施中常见的一些陷阱。综合来看，我们希望这些信息能足够让你成功迈出 CRM 项目的第一步。\n\n*  \
  \ 在项目初始阶段，花时间记录将受 CRM 影响的流程，有助于协调团队，使项目更顺利，减少意外情况。\n*   在设计阶段进行正式的用例开发，对设计过程和后续的测试工作都大有裨益。\n\
  *   定制开发会给项目带来风险，但也能显著提升应用的价值及其与组织流程的契合度。\n*   数据迁移是一项困难且成本高昂的任务；尽可能限制其范围，并对其价值保持现实态度。\n\
  *   将 CRM 与其他业务应用集成，能让员工提供更好的客户体验，并提高他们的工作效率。\n*   报告是项目的关键要素；在项目开始时就应考虑期望的报告成果，并在整个设计过程中定期回顾，以确保完成的应用能够交付这些成果。\n\
  \n## 维护与演进 CRM\n\n本书前面的章节提供了你成功规划和启动 CRM 项目所需的信息。从长远来看，正是对 CRM 的持续维护和演进，或称*管理*，才能使你视自己的投资为有价值。\n\
  \n本章的目标是为你提供必要的信息，以便在初始部署后继续演进你的 CRM 项目。虽然我们会谈及持续的维护对长期成功至关重要，但实际上，正是维护与 CRM 持续成长和进步的结合，才能让你清晰地看到成功。CRM\
  \ 实施的初始阶段可能进展顺利，但如果没有持续的管理，该项目最终将无法再为你的组织增加价值。\n\n\n\n### 指导委员会的角色\n\n第 2 章介绍了指导委员会及其在\
  \ CRM 项目中的作用。尽管该团队在 CRM 初始部署后角色有所变化，但委员会对 CRM 项目的长期成功依然至关重要。指导委员会需要继续充当所有 CRM 相关事务的核心枢纽。其持续关注的要点应包括以下内容：\n\
  \n*   **CRM 推广宣传**：指导委员会应计划继续充当组织内 CRM 项目的主要宣传者。无论是为了获取未来阶段工作的资金支持，还是出于未来项目成功对组织的重要性，成功的信号都需要尽早并频繁地传递。因此，指导委员会有必要大力宣传初始实施阶段的积极成果，并迅速应对出现的任何问题。最后，指导委员会还可以宣扬组织的战略\
  \ CRM 愿景，并阐明 CRM 应用程序带来的商业效益。\n*   **变更控制与路线图规划及执行**：指导委员会也是让高管和决策者齐聚一堂、进行持续性决策的最佳机制。尽管该团队的会议频率可能不如\
  \ CRM 初始启动阶段那么高，但高管层参与重要决策，将使未来阶段的工作、快速修复及任何问题的处理更加迅速高效。\n*   **高管支持**：组织在实施 CRM\
  \ 项目时，通常会面临不同程度的员工采纳率。实施后，指导委员会有责任确保员工按照预期使用流程和应用程序。这通常可以通过适当的“胡萝卜加大棒”组合来实现，并且需要根据组织的具体情况量身定制。一些可能的激励措施示例如下：\n\
  \    *   将销售人员部分薪酬与其商机中存储的信息挂钩\n    *   根据客户满意度或是否履行对客户的服务水平协议（SLA）承诺，为客户服务团队提供奖金\n\
  \    *   跟踪线索到商机的转化率，并激励营销团队协助完成转化\n\n此外，当您寻求提高使用率、收集反馈或处理任何出现的问题时，指导委员会可以确保相关负责人从员工那里获得适当的时间和回应。这将在组织内营造一种协作的环境。\n\
  \n#### 会议频率\n\n在 CRM 初始实施阶段，指导委员会会频繁开会（通常每周一次），以确保项目方向符合预期。CRM 启动后立即维持这一会议频率仍然至关重要。我们经常看到客户在项目启动一两周后就立刻取消指导委员会会议。除了为项目相关的高级领导团队提供一个快速解决问题的机制外，指导委员会还能在启动后的关键时期发出积极、统一的声音。\n\
  \n随着时间的推移，可以适当降低会议频率。启动后几周内，可考虑将会议改为每两周一次。大约 60 天后，可以开始考虑每月讨论一次。由于相当多的 CRM 实施失败是因为缺乏长期的后续跟进和发展，因此拿\
  \ CRM 应用程序的长期成功去冒险是不明智的；所以，请保持指导委员会的参与，并继续召开这些会议。\n\n#### 会议议程\n\n与指导委员会的会议频率类似，这些会议的讨论主题在启动后也会发生变化。关注的焦点大多从管理启动项目团队（内部或供应商）转向确保员工得到支持以及规划下一版本发布。\n\
  \n图 7-1 中的示例议程为部署后指导委员会会议的主题提供了一些参考。尽管列出的许多项目看似与实施主题相似，但您仍应预期在启动后将诸如可交付成果之类的任务分配给相关人员。持续检查这些项目的状态以确保应用程序不断演进非常重要。\n\
  \n![images](img/0701.jpg)\n\n**图 7-1.** 指导委员会会议议程示例\n\n#### 与会人员与职责\n\n在初始部署之后，会有多个不同的个人或角色参加指导委员会会议。通常参加此会议的人员类型包括：\n\
  \n*   初始项目发起人\n*   部门支持者\n*   支持负责人/提供支持的团队成员\n*   负责监控/维护 CRM 应用程序的 IT 人员\n\n务必记住，初始实施阶段担任这些角色的人员在实施后可能会发生变化。此外，当您在后续版本中推出\
  \ CRM 应用程序的新功能或更改流程时，组织内可能会有其他人应该加入指导委员会。\n\n### 维护 CRM\n\n部署 CRM 应用程序后，迅速过渡到维护模式至关重要。此项目阶段的核心任务包括为用户提供所需支持、对应用程序问题进行分诊处理，以及确保关键的\
  \ CRM 文档保持最新状态。\n\n\n\n#### 为员工提供支持并收集反馈\n\n为了推动 CRM 持续发展，营造一种让员工感到被支持、问题不会恶化的氛围至关重要。组织能否快速处理那些不可避免的问题，最终将对\
  \ CRM 的成功以及获取财务及其他资源以持续发展项目的能力做出巨大贡献。\n\n支持员工的一种方式是确定特定的负责人，他们既是 CRM 项目的倡导者，又充分了解\
  \ CRM 流程和应用程序，足以成为各自特定用例方面的专家。以下是一些此类人员的示例：\n\n-   **利益相关者**：项目的利益相关者是那些比普通员工更关心项目成功的个人。项目利益相关者应准备好充当倡导者。此外，对于许多支持和持续维护任务，鉴于其对整体项目的重要性，被明确认定为利益相关者的个人需要比其他人员得到更多关注。\n\
  -   **部门负责人**：部门负责人将为 CRM 团队提供针对特定部门流程和 CRM 需求的总体指导。此人通常是销售或服务经理之类的人物，可能对高管团队有影响力。此人的部分职责如下：\n\
  \    -   作为上线后出现的任何问题的升级联络点\n    -   参与持续的流程和应用程序设计工作\n    -   充当应用程序的功能专家，帮助支持其业务部门内的用户，并且在应用程序允许的情况下，对用户部署后所需的小修改进行调整\n\
  -   **项目发起人**：项目发起人将为 CRM 团队提供广泛未来阶段计划的总体指导。此人通常是比迄今为止所概述的任何角色都更高级别的高管。此人的部分职责如下：\n\
  \    -   在与指导委员会打交道时提供高管指导\n    -   确保团队成员和其他项目利益相关者有空并在需要时提供设计反馈\n\n#### 识别问题\n\
  \n作为实施整体支持的一部分，能够快速识别并解决出现的任何问题非常重要。组织应利用其利益相关者和部门负责人充当耳目，倾听员工的问题。留意员工反复提出的问题、应用程序使用问题以及闲聊中的反馈，以帮助识别问题。跟踪出现的问题也有助于识别常见问题。能够识别这些问题并快速做出反应，将有助于您防止\
  \ CRM 社区内滋生不满情绪。\n\n#### 提供持续支持\n\n作为 CRM 项目启动流程的一部分，您或您选择的供应商将在短时间内为最终用户提供 CRM\
  \ 应用程序支持。仅仅因为这段时间结束并不意味着对该应用程序的支持可以终止。组织应评估其可用的支持选项，以帮助在前进过程中提供这种支持。\n\n尽管有时会被忽视，但在提供长期支持时，组织常犯的一个错误是只针对已部署的技术和配置提供支持。在\
  \ CRM 部署过程中，您很可能会改变组织的流程，因此确保部门负责人和/或利益相关者能够支持解决出现的任何流程问题也同样重要。\n\n最后，鼓励您的应用程序支持人员不断地深入探究表面技术问题之外的原因。虽然可以通过更改设置或更新某些数据来快速解决问题，但以这种方式看待支持可能会导致您忽略问题的根本原因。根本原因被忽视的时间越长，一旦问题被发现，其影响就越严重。\n\
  \n除了利用应用程序来跟踪问题之外，可以考虑的其他一些支持机制如下。\n\n##### 电子邮件反馈\n\n考虑为您的用户社区提供一种通过电子邮件提交反馈的方式。除了提供指向\
  \ CRM 应用程序的链接外，电子邮件为他们提供了一种通过他们熟悉的工具快速简便地提交反馈的方式。根据与 CRM 项目相关的争议程度，也可以进行调整，允许员工发送匿名电子邮件。\n\
  \n为确保在收到反馈时获得适当数量的信息，请考虑向用户提供一个类似图 7-2 中所示的模板用于提交问题。\n\n![images](img/0702.jpg)\n\
  \n**图 7-2.** 支持请求电子邮件模板\n\n需要向员工强调的关键点是，在概述问题时尽可能提供详细信息的重要性。支持资源掌握的信息越多，他们就越有可能解决问题。\n\
  \n##### 集中式反馈收集\n\n收集和跟踪反馈的另一种选择是使用集中式位置。根据贵公司的技术成熟度，这可能简单到共享文件夹中的电子表格，也可能复杂到组织内外部都可访问的门户。无论采用哪种方法，收集的信息都是相同的。\n\
  \n通过这种方式捕捉问题和反馈的一个明显优势是它为用户提供的透明度。当然，这需要 CRM 团队持续更新和监控，但假设能做到这一点，用户可以持续感到自己参与了这个过程。提供持续的状态更新可能使用户在联系团队之前自行解决部分问题。图\
  \ 7-3 显示了一个用于跟踪用户提出的反馈和问题的快速模板。\n\n![images](img/0703.jpg)\n\n**图 7-3.** 问题跟踪列表\n\
  \n##### 办公时间与答疑辅导会\n\n在决定如何支持您的 CRM 社区时，第三个组成部分可以是设立“办公时间”或定期的答疑辅导会。此类会议通常为您的团队提供两个重要价值：\n\
  \n-   **一致性**：定期的办公时间将为您的员工提供一个可以求助的、一致的支持渠道。提前安排这些时间还将使用户感到安心，因为他们知道在未来某个确定的时间，支持资源将可用，以解答任何问题或处理疑虑。\n\
  -   **减少随机性**：实施支持的一个主要风险是整个团队被支持请求打乱工作节奏。这不仅意味着支持水平或质量的下降，还可能导致员工感到被忽视。通过安排明确的时间，可以训练您的员工将请求保留到这些预定时间。此外，支持资源可以利用这段时间专注于用户关心的问题，无论是倾听他们的诉求还是解决问题。\n\
  \n\n\n##### 更新文档\n\n在初次上线后，随着员工逐渐适应，让 CRM 流程和应用程序在一段时间内保持不变，将有助于用户建立对它们的熟悉感和舒适度。这种舒适感是用户采用率和最终上线成功的关键。\n\
  \n在刚上线后的这段时间里，应用程序很可能会有许多小改动。这些改动将迅速解决用户提出的问题，或修复在应用程序实施测试阶段未被发现的小缺陷。一项常被忽视的任务是更新培训文档和支持资源以反映这些改动。这些文档越及时更新，您的\
  \ CRM 社区就越有可能在需要时将其作为自助资源加以利用。\n\n一旦尘埃落定，您或许有机会向 CRM 社区提供额外或增强版的文档。这些文档的设计可以超越最初的培训指南，增加额外价值。虽然这些新增或更新的文档可能对现有员工有所帮助，但它们也可以用于支持新员工入职时的快速成长。此类文档的示例如下：\n\
  \n- **培训视频**：增强现有员工培训材料的一种方法是着手建立一个培训视频库。这些视频时长可在二到五分钟之间，重点突出 CRM 应用程序的某个特定流程或领域。\n\
  - **功能亮点**：在组织内促进 CRM 增长的另一个选择是不断寻找小方法来为 CRM 社区提供额外价值。其中一种方式是在部署后的每周提供简短的信息片段，为用户重点介绍一个新颖的、常被忽略的或虽小但功能强大的\
  \ CRM 应用程序特性。除了让 CRM 在全组织内保持关注度，突出这些特性还能为那些日常重度使用应用程序的用户提供即时、切实的价值。\n- **使用成功案例**：虽然与突出应用程序内的功能非常相似，但为员工讲述更宏大的成功故事可能会提供额外的动力，促使他们有效使用\
  \ CRM。这类亮点的示例可能包括一个关于 CRM 应用程序如何促进团队或员工之间协作以实现预期成果（比如赢得一个销售机会）的故事。\n\n##### 追踪反馈与评估工作量\n\
  \n正如我们之前讨论过的，持续监控和追踪员工的反馈非常重要。对已收到的反馈以及如何处理这些反馈保持透明，将让您的 CRM 社区感受到参与感，并鼓励他们继续积极参与\
  \ CRM 项目。\n\n在本节中，我们将介绍收到反馈后该怎么做，以及如何评估与任何必要改动相关的工作量。变更控制流程应持续运行，并且可能同时存在多个迭代。\n\
  \n### 增强 CRM\n\n一旦您的应用程序上线且运行稳定，更具体地说，当支持请求减少到零星几个时，就该考虑 CRM 路线图的下一步了。增强功能将使您能够继续向用户群体展示进展，从而推动应用程序的采用。\n\
  \n#### 变更控制流程\n\n变更控制流程是一个持续的过程，帮助组织对其 CRM 项目进行变更和增强。图 7-4 展示了该流程的运作方式。\n\n![images](img/0704.jpg)\n\
  \n**图 7-4.** 变更控制流程\n\n变更控制流程的各个阶段如下：\n\n- **识别**：变更控制流程的识别阶段包括根据用户反馈，确定需要对 CRM\
  \ 应用程序或流程进行的任何变更或更新。虽然追踪这些信息是成功的一半，但理解这些变更如何影响项目，并从宏观上了解进行这些变更所需的条件也同样重要。在该流程的此步骤中，应使用一个文档来清晰概述更新内容以及随之所需的时间或资金。图\
  \ 7-5 显示了一个示例文档。\n\n![images](img/0705.jpg)\n\n**图 7-5.** 示例变更请求文档\n\n\n\n#####\
  \ 变更控制流程的阶段\n\n-   **分配**：在流程的分配阶段，指导委员会将根据其他项目对变更请求文档进行优先级排序。如果指导委员会决定优先处理某个特定项目，则应为其分配一名负责人，以管理后续流程。该负责人不一定是执行具体工作的人，而是最终确保工作完成的人。在此阶段应考虑的其他事项如下：\n\
  \    -   **优先级 vs. 其他事项**：此特定事项相对于团队提出的其他事项的优先级如何？这也是指导委员会基于对整体组织的洞察，在企业内其他项目并行的背景下，为\
  \ CRM 更新设定优先级的地方。\n    -   **资源配置**：对 CRM 应用程序的变更可由内部资源处理，也可外包给供应商。由指导委员会负责做出此决定。\n\
  \    -   **发布周期**：一旦确定了优先级和资源配置，就可以评估发布周期。通常，诸如业务旺季、季度或财年末以及其他因素，可能会导致公司加快或放缓发布节奏。\n\
  -   **设计**：变更控制流程的设计阶段与完整 CRM 实施的设计阶段非常相似。在变更控制流程中实施范围项时，其规模通常远小于完整的生命周期项目。因此，可以考虑采用简化的设计阶段。设计文档可能仅包含一份简短的功能规格说明和解决方案实施大纲。这种详细程度既能避免在小型事项上花费过多时间，又能确保设计考虑到之前已实施的其他重要事项。\n\
  -   **构建/测试（针对应用程序变更）**：与设计阶段类似，构建和测试阶段通常也会有所简化。在此阶段的构建环节，将对 CRM 进行配置更改，和/或编写代码以满足需求。在测试环节，应完成第\
  \ 6 章中概述的标准测试。这些测试类型包括：\n    -   **单元测试**：单元测试包括对配置更改或开发的组件进行简要测试。同样，由于变更请求事项的性质，此类测试通常完成得很快。\n\
  \    -   **系统测试**：系统测试包括对模式(schema)和用户界面组件的端到端审查。这使项目开发人员和分析师能够首次审查这些更改在与其他应用程序组件结合时的表现。\n\
  \    -   **回归测试**：在变更控制流程中，回归测试是需要关注的最重要事项。它使项目团队能够测试现有功能，以确保功能在最新发布中没有发生变化。在确定每个测试阶段之后，都应完成回归测试。未完成适当数量的回归测试，可能会将新问题引入稳定的\
  \ CRM 应用程序，从而引发用户的不信任和长期问题。\n-   **部署**：变更控制流程的下一个阶段是部署变更。在大多数情况下，由于变更的规模较小，此过程相当简单直接。此时，指导委员会的责任是确保任何变更的部署不与组织内其他项目或优先级发生冲突。\n\
  -   **签收**：一旦项目部署完毕，关键是要与指导委员会（如果合适的话，也包括最初提出问题的用户）进行反馈。正如我们多次讨论过的，这项工作将确保流程正确完成，并保持用户对整体实施的参与度。\n\
  \n#### 路线图制定与执行\n\n第 2 章引入了 CRM 路线图的概念，第 3 章提供了构建此路线图以将组织业务目标与 CRM 计划对齐的信息。当您确定新的\
  \ CRM 流程或新的 CRM 应用程序功能时，始终牢记此路线图至关重要。根据组织的敏捷性，您可能会在推进过程中有意识地添加或调整路线图计划，但在讨论过程中以路线图为指导，将确保您始终朝着之前定义的最终成功状态前进。以下示例说明了如何在路线图中处理一个计划，以及最终组织的流程和应用程序可能发生的变化。\n\
  \n> 示例\n>\n> 贵公司已使用 CRM 两年，并遵循了本章概述的变更控制流程。作为行业增长期的一部分，您决定收购另一家公司。这家公司位于与您当前所在市场不同的地区。在评估此次收购应如何改变\
  \ CRM 应用程序时，您必须回答许多问题。\n>\n> 应用相关问题\n>\n> 由于公司新增了办公地点，您需要评估其对 CRM 应用程序的影响。以下是一些重要问题：\n\
  >\n> *   新办公地点将如何影响用户访问应用程序的方式？您的组织是否一直为员工提供远程访问，还是我们需要评估此项需求？\n> *   是否有任何当地习俗或规则会影响我们使用\
  \ CRM 的方式？我们是否需要在对报价和订单文档中包含其他语言？\n> *   鉴于新地点，组织是否需要运行不同的报告？\n>\n> 一旦您回答了这些问题，您就可以进行特定的应用程序更新，以适应这个新用户群体。\n\
  >\n> 流程相关问题\n>\n> 除了更新 CRM，您可能还需要考虑更新整个组织的 CRM 流程。以下是一些值得提出的问题：\n>\n> *   您将如何让新的销售团队熟悉我们的\
  \ CRM 工具？应该进行哪些培训？\n> *   被收购的公司是否有任何独特的销售流程，在我们整合时必须考虑？您的现有销售团队是否有机会从他们的销售模式中学习？\n\
  > *   是否存在我们可以进行的流程或自动化更新，以实现更流畅的销售流程，无论地理位置有何差异？\n\n最终，在处理路线图中的计划时，同时考虑应用程序和流程的变更至关重要。除了处理这些独立的计划外，随着公司发展、经济形势变化或您寻求利用市场机会，您的业务环境也可能会发生变化。利用这些情况本身并无不妥，尤其是在您的\
  \ CRM 环境方面，但这也使得定期审查和持续更新您的 CRM 路线图变得更加重要。\n\n考虑到这一点，尽管本章前面定义的变更控制流程主要关注初始部署后对 CRM\
  \ 的管理，但还有一个类似但明显不同的流程，用于管理与执行路线图相关的更大规模增强。本节将重点介绍初始项目实施流程与后续项目流程之间的差异。\n\n\n\n```markdown\n\
  ##### 管理大型应用增强功能\n\n本章前面部分，我们介绍了管理增强功能的流程。该流程同样适用于管理大型项目。图 7-6 展示了跟踪电子表格中的两处小补充：“类型”列和“风险”列；这些将帮助你区分那些可以快速部署作为临时项目的功能，与那些需要大规模部署或新阶段的功能。\n\
  \n![images](img/0706.jpg)\n\n**图 7-6.** 问题列表 + 类型和风险列\n\n与快速修复相比，大型增强功能也需要更多的规划。虽然你可以相对快速地发布快速修复，并且大多使用内部资源完成小型更新，但对于规模更大的新阶段项目和升级，则需要投入更多思考。\n\
  \n###### 安排部署\n\n与小型快速更新相比，新项目或升级相关的部署安排考虑因素更为重要。项目或升级的规模越大，造成不必要的变更、错误或引起用户群体普遍担忧的风险就越高。\n\
  \n以下是一些重要的部署安排考虑因素：\n\n*   **对用户的影响**：\n    *   变更的综合清单对当前用户群有何影响？\n    *   用户现有的流程或用例会发生重大变化吗？\n\
  \    *   用户在使用初始部署时是否仍然存在困难？\n\n这些都是需要思考的重要问题。如果对用户的影响很大，你可能需要更加留意组织中正在发生的其他事情，比如季度末、高支持量等。如果应用中建模的流程会发生重大变化，那么留出额外的用户验收测试或培训时间可能很重要。最后，如果用户在使用初始部署时仍然存在困难，那么推迟第二个项目，直到使用情况稳定下来，可能是合理的。\n\
  \n*   **工作量**：未来的阶段或升级将会涉及不同程度的工作量。与初始实施一样，后续项目的工作量也可能差异很大。这种工作量也与升级相关的工作量不同，因为任务和关注点将完全不同。这些差异将在本章后面部分进行说明。\n\
  *   **风险**：在后续项目或升级部署过程中，许多因素可能导致风险判定。其中一些因素包括：\n    *   **范围项数量**：通常，范围项数量越大，风险越大。虽然情况并非总是如此，但更大的范围意味着需要管理的更多、测试的更多，并且在部署过程中引入错误的地方也更多。\n\
  \    *   **部署时机**：评估风险时，部署时机很重要。时机不当可能意味着用户对设计的关注度降低，难以专注于用户验收测试，或者由于其他优先级事项，用户可能会很快忘记培训内容。\n\
  \    *   **产品版本的生命周期**：这更多是升级时需要考虑的问题，但也应适用于任何未来阶段。产品版本可用的时间长短也会影响用户可能面临的潜在问题，以及部署前需要完成的测试量。\n\
  \n###### 资源：供应商 vs. 内部\n\n如第 4 章所述，在初始实施过程中，选择完成大部分工作的资源（通常是供应商）需要做出不少决策。在考虑未来阶段或升级时，应当继续评估其中的许多标准。以下是一些额外的考虑因素：\n\
  \n*   **谁是正确的供应商？** 你最初用于评估供应商的许多标准在后续项目或升级期间仍然适用。话虽如此，还有两个更重要的问题：\n    *   哪个供应商更有可能与你的团队合作？既然你的团队已经接受了培训，并且已经与应用程序合作了一段时间，那么哪个供应商更有可能成为实施过程中的合作伙伴，而不是需要拥有整个实施过程？一些供应商更有可能支持小型的、兼职的实施，而另一些供应商则更适应大型的、全职的、多成员的团队。请注意，如果你决定在初始项目和后续项目之间更换供应商，你应该为设计变更预留一些额外的时间和预算。新的供应商会为现有流程或应用程序带来新的想法或精简的方法。\n\
  \    *   **内部团队应该做多少工作？** 既然你的团队已经在第一阶段学习过，并且在初始部署后一直在使用该应用程序，那么团队在下个阶段或升级期间应该承担多少工作？部分答案取决于内部实施团队的知识和技能。总体而言，你的团队应该更有能力主导工作，并且在未来的阶段中与供应商合作时应感到自如。\n\
  \n###### 测试\n\n后续项目或新版本 CRM 应用中通常包含的功能数量，加上对现有用户群的潜在影响，意味着测试具有额外的重要性。虽然所有经典的测试方法都应完成，但回归测试变得日益重要，尤其是你距离原始部署的时间越久远。\n\
  \n在进行后续实施测试时，无论进行何种类型的测试，做到以下四点都很重要：\n\n*   审查先前用于其他阶段和快速修复的测试计划。\n*   制定详细的回归测试计划，以有效测试旧功能、新功能以及两者之间的衔接。\n\
  *   确保投入大量时间进行用户验收测试。在项目团队为用户提供较长的时间段（两到三周）来测试你的环境上的旧功能和新功能之前，用户经常会发现应用程序的问题。\n\
  *   测试环节结束后，留出时间修复或更新应用程序。\n```\n\n\n#### 内部版本管理\n\n管理新功能和新版本的发布需要深思熟虑。作为指导部署的指导委员会或团队，版本管理活动通常分为两类：\n\
  \n-   **基础设施迁移/版本管理**：大多数后续阶段和升级将包括搭建或开发及/或测试环境。作为版本发布的一部分，必须有人负责管理代码和定制化功能在这些环境之间的提升。\n\
  -   **新功能/流程版本管理**：不可避免地，当发布大量新功能或一个新的应用版本时，用户与应用交互时所遵循的流程将会改变。确保用户有时间消化这些流程变更、更新他们的使用场景，并解答他们的疑问，对于顺利过渡到新版本或新功能集大有裨益。\n\
  \n在管理整体版本时，可以结合使用两种类型的文档来帮助跟踪相关任务。图 7-7 是一个核对清单，可用于识别上线过程中的所需任务。在部署之前或实际部署过程中的任何时间点，都可以参考此核对清单。\n\
  \n![images](img/0707.jpg)\n\n**图 7-7.** CRM 上线核对清单示例\n\n除了这份文档，我们还发现一份关于发布流程的分步指南是避免最后一刻出现问题的有用工具。虽然任何文档都不太可能捕捉到所有问题，但一份精心制作的、包含截图和详细步骤的文档将有助于让部署团队感到安心。图\
  \ 7-8 是此类文档的一个示例目录。\n\n![images](img/0708.jpg)\n\n**图 7-8.** 部署分步指南\n\n请注意，此文档的具体内容将根据您的\
  \ CRM 托管情况而有所不同。如果您依赖供应商来托管应用程序，那么许多备份和恢复活动将由其负责完成。此外，部署报告等内容的过程可能会因服务器和应用程序所在位置而改变，但制定一个确保它们得到适当部署和测试的计划非常重要。再次强调，只要时间允许，提供带截图的逐步说明将能缓解部署过程中的问题。\n\
  \n#### 新应用版本与升级\n\n在本章中，我们讨论了指导委员会的职责以及如何处理新阶段和部署。我们概述的关于管理版本和部署新功能的概念，无论您是在同一版本的应用上部署新功能，还是正在为团队进行版本升级做准备，都是有效的。\n\
  \n在本节中，我们将提供一些具体的指导和建议，帮助您了解在专注于升级时可能会遇到的情况。\n\n##### 基于云的应用\n\n如果您使用的是托管型 CRM 应用程序，您的升级过程与本地部署的\
  \ CRM 实例将有很大不同。根据您的托管方式，您需要做出一些不同的决定，过程也会略有不同，但最终，升级过程的责任将主要落在托管供应商身上。一些具体差异如下：\n\
  \n-   **供应商托管型 CRM**：如果您在早期选择了供应商托管模式，那么您在升级过程中几乎不需要做什么。通常，大多数托管供应商会提供一个升级计划表或日期，届时您的\
  \ CRM 实例将被升级。您的主要职责是管理您企业中已安装客户端的任何更新或变更。根据托管供应商的不同，至少了解其备份程序以防升级失败可能是明智之举，但可信的\
  \ CRM 供应商对此流程已有完全成熟的方案。\n-   **共置型 CRM**：如果您在选定 CRM 应用程序时选择了共置模式，那么升级相关的责任可能存在一些灰色地带。根据您与供应商的托管协议，您可能负责也可能不负责执行升级。如果您负责升级，那么本章前面概述的版本管理流程、测试等对您来说将非常重要。如果共置托管供应商负责您的升级，那么询问有关备份和恢复程序、必要的基础设施升级以及新客户端安装的问题，将确保您覆盖所有基础。\n\
  \n##### 本地部署应用\n\n对于本地部署的应用程序，升级过程类似于本章前面概述的决策和版本管理流程。您基本上可以将这个新版本视为实施的一个未来阶段。与升级相关的一个主要考量（新功能通常没有）是基础设施升级的必要性。根据\
  \ CRM 应用程序新版本的发布频率，您的应用程序可能需要新版本的数据库软件、操作系统或客户端软件才能正常工作。如果这些中的任何一项需要与 CRM 应用程序一起升级，则需要额外的规划、测试和文档记录以确保成功迁移。\n\
  \n##### 应用测试版\n\n许多 CRM 供应商也会提供其新 CRM 版本的测试版访问权限。实施测试版应用既有优点也有缺点。\n\n**以下是优点：**\n\
  \n-   通常情况下，成为测试版参与者会给客户带来一些优势。无论这个优势是许可证或托管成本的短期优惠，还是作为测试版客户带来的一些宣传效应，您都应该期望从实施预发布软件中获得一些价值。\n\
  -   通过使用测试版软件，您将比其他客户更早地接触到新功能。根据这些功能及其对您组织的重要性，能够使用它们可能会为您的用户群体增加价值，并/或解决您组织当前面临的挑战。\n\
  \n**以下是缺点：**\n\n-   根据您的托管决定，实施测试版软件可能会带来一些额外的麻烦。您在测试过程中参与得越早，当应用程序对其他客户普遍可用时，您就越可能需要重新安装该应用。\n\
  -   如果您的组织在技术上并不成熟，那么实施固有缺陷的软件所引发的问题以及由此给用户群体带来的焦虑，可能不值得其带来的好处。\n-   您觉得有用或计划进行定制的功能，可能会从软件的最终版本中被砍掉。\n\
  \n#### 监控供应商生态\n\n无论您是刚刚完成初始部署，还是在 CRM 之旅中经历了多个阶段或升级，密切关注与您特定 CRM 应用相关的供应商生态都至关重要。在本章的这一节，我们将提供一些关于监控工具相关动态的各种方法的高层信息。\n\
  \n\n\n### 会议\n\n许多大型 CRM 供应商都会举办年度会议。投资派人参加这些活动，能让您了解对组织至关重要的新应用功能。\n\n这些会议通常包含一个功能主题方向，这可能对您的主题专家、项目发起人或部门倡导者有所裨益。作为指导委员会的成员，了解即将发布的版本中提供了哪些功能，将有助于您确定开发工作的优先级并协助管理版本发布。\n\
  \n大多数会议还包含一个更偏技术主题的方向。这些方向是让您的内部团队进一步熟悉 CRM 技术的绝佳途径。参加技术方向的会议（其中许多包含动手实验）将使您的内部团队能够向产品专家提问，并学习自行执行更多实施任务。\n\
  \n##### 新的独立软件供应商\n\n随着 CRM 供应商不断发展其产品，CRM 用户需要持续关注独立软件供应商的格局。当需要新功能时，独立软件供应商为客户提供了“购买”与“构建”的选择。在计划推出新功能时，了解可用的独立软件供应商选项，将使您能够做出最明智的决策。\n\
  \n独立软件供应商领域另一个持续的变化与产品供应商的升级有关。产品供应商的一个主要目标是持续向客户提供高需求的功能。从根本上说，这一目标与独立软件供应商的目标相冲突；独立软件供应商的动机是在客户发现问题时填补应用程序的空白。因此，很自然地，当\
  \ CRM 供应商发布包含与独立软件供应商产品类似功能的新版本应用程序时，独立软件供应商必须适应并创建新产品，或为其现有产品添加实质上更好的功能。\n\n#####\
  \ 用户组\n\n如果您所在的组织位于较大的都市区，您还可以参与由您的 CRM 产品赞助或以其为中心的用户组。与会议一样，参与用户组也有许多好处。正如我们之前提到的，紧跟独立软件供应商领域的变化，将有助于您在组织内扩展\
  \ CRM 的使用。通常，独立软件供应商会作为演讲者参与用户组，使您能够快速、无压力地了解市场上新的独立软件供应商产品。\n\n参加用户组的另一个巨大优势是有机会与其他同行交流，了解他们如何使用\
  \ CRM 应用程序解决问题。您可能正在处理与其他非竞争公司类似的业务问题，因此能够拥有一个开放的讨论论坛，可能会为您试图解决的业务问题提供更简单、更具成本效益的解决方案。\n\
  \n##### 博客和通讯\n\n许多产品供应商和顾问都会撰写博客和制作通讯，以解答其各自应用程序中常见的问题或事项。从您的角度来看，这两类内容可能也有不同的侧重点，因此让组织内有人同时关注这两者非常重要。\n\
  \n-   **博客**：产品供应商和顾问的员工通常会定期撰写博客文章。由于大多偏向其各自的产品，这些文章往往具有特定的性质。尽管如此，确实也存在关于使用 CRM\
  \ 解决业务问题的通用型博客，它们以与技术无关的方式来应对这些挑战。博客文章很少是宽泛的，而是具有特定的性质，要么侧重功能，要么侧重技术，但不会两者兼备。\n\
  -   **通讯**：与产品供应商相比，顾问在提供通讯方面往往更加积极主动。通讯内容通常有意地广泛，以吸引广泛的读者群。\n\n##### 顾问\n\n正如我们在第\
  \ 4 章中讨论的，可以使用一系列标准来评估和选择您的 CRM 顾问。在完成部署的初始阶段后，您显然会对您选择的供应商以及未来阶段希望在该供应商中寻找的特质有更好的感觉。\n\
  \n正如我们在本章前面所讨论的，您可能希望在后期的运维供应商中寻找与第一阶段供应商不同的特性。随着您的团队技能的增长，您可能会发现自己需要的供应商服务时间更少，因此找到一个具有灵活支持和参与模式的供应商，将能在继续获得最佳服务的同时节省资金。\n\
  \n最后，与独立软件供应商渠道中的情况非常相似，供应商也在不断改变他们的产品和服务重点。通过阅读他们的博客和通讯，并在不频繁使用其服务的时期定期与他们保持联系，当您决定开展额外工作时，您将能够快速与合适的顾问接洽。\n\
  \n### 关于维护和发展 CRM 的最终思考\n\n在本章中，我们讨论了在 CRM 计划初次启动后需要您关注的事项。优先处理这些事项，同时始终牢记您的 CRM\
  \ 路线图，将使您能够在组织内发展和扩展 CRM 的使用。上线后，您所做的几乎每件事都会对 CRM 社区产生影响。因此，一个明确的测试流程、一个与新功能和项目相关的计划，以及关注、倾听和支持您的员工，将使您能够继续取得进展，并最终通过\
  \ CRM 计划取得成功。\n\n## 结论\n\n理想情况下，您读完本书时，对启动、管理和发展组织 CRM 计划的能力会充满信心和乐观。我们的意图是将这项可能令人生畏的任务分解成各个组成部分，详细描述每个部分，并让您了解它们是如何协同工作的。CRM\
  \ 不是火箭科学，但它需要勤奋、精力和深思熟虑；您和您的组织将从投入中获得相应的回报。\n\n最后，我们想再给您几条建议：我们认为这是实现 CRM 成功的“大局观”要点，比我们提供的任何应用功能或文档模板都更重要。\n\
  \n### 沟通\n\n努力与所有 CRM 利益相关者建立开放、定期的对话，包括高级管理人员、CRM 应用程序用户、CRM 管理团队、IT 代表、经理等。这对于及早发现可能影响计划的问题、识别改进机会以及确保组织中的关键人员始终是\
  \ CRM 计划的支持者至关重要。不同的利益相关者群体可能偏好不同的形式；对于高级管理人员，定期午餐会可能合适；而对于最终用户，某种定期的 CRM “开放时间”会议可能是建立联系的最佳方式。关键是，找到一种方式与所有\
  \ CRM 利益相关者群体进行有意义的定期互动。\n\n### 成为 CRM 的倡导者\n\n特别是在建立新的 CRM 计划时，频繁、公开地支持 CRM 非常重要。在与组织的沟通中，持续强调\
  \ CRM 对您的使命和组织目标的重要性，并寻找机会表彰为计划做出巨大贡献的员工，以及展示组织在 CRM 投资上取得的切实成果。\n\n### 监控 CRM 应用程序使用情况\n\
  \n如果某个特定群体或关键用户在 CRM 应用程序中的活动减少，这是一个需要调查的重要危险信号。这可能表明某个群体的流程已经改变，而 CRM 应用程序不再能很好地支持它们。发生这种情况时，用户会开始在\
  \ CRM 应用程序之外开发自己的工具和变通方法，从而导致应用程序使用量下降。\n\n\n\n### 用技术解决实际问题\n\n在规划 CRM 项目的路线图时，你可能会忍不住让应用程序来主导方向，专注于新的应用功能和附加组件，然后试图在组织中为其寻找一个能增加价值的位置，以此证明它们有理由出现在路线图上。这是本末倒置。请警惕这种思维潜入你的项目团队。要关注组织所面临的挑战和机遇。首先理解业务问题，然后再开始寻找解决方案。我们并非建议你对新的应用功能一无所知，只是希望你首先关注业务需求。如果技术不能解决组织关心的问题，那么它比无用更糟糕。\n\
  \n同样的主题贯穿于 CRM 项目在应用设计和报表设计的整个过程中，所以要始终专注于解决实际问题，不要仅仅因为技术存在就部署它。大量未使用的应用功能和花哨的仪表盘只会让用户感到困惑，并分散他们对需要完成的工作的注意力。确保你呈现给用户的一切都对组织有价值。\n\
  \n### 根据你的组织调整我们的指导\n\n本书的内容基于我们与众多组织合作建立和发展成功 CRM 项目的经验，但正如大多数事物一样，CRM 并没有一种放之四海而皆准的方法。如果你试图逐字逐句地严格应用本书中概述的方法，可能会举步维艰。请理解你所在组织的运作方式，并运用你的判断力，将本书中的指导原则应用到你的具体情况中。\n\
