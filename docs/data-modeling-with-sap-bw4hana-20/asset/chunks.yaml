- fmt: '# Modern Data Modeling


    SAP BW/4HANA was introduced in 2016 as a next-generation business warehouse to
    replace the old SAP BW application. The core design interface for the BW modeling
    tools has been now unified. This means that the SAP GUI is no longer required
    for modeling activities. BW/4HANA offers a completely new modeling platform, which
    brings numerous benefits to developers.


    - Simplified modeling, with four modeling objects instead of nine

    - Focus on and significant extension of the virtualization capabilities

    - Modern, easy-to-use, Eclipse-based modeling environment

    - A unified UI for the BW/4HANA modeling tools (the SAP GUI is not used for modeling
    anymore, and the SAP BEx Query Designer has been replaced with an Eclipse-based
    Query Designer)

    - A single environment for BW and HANA modeling


    From a functional perspective, in addition to all the new features and functionalities,
    one of the biggest advantages of BW/4HANA is the ability to use hybrid modeling.
    Developers can now combine modeling artifacts from both the SAP BW and SAP HANA
    worlds.


    The big modeling difference between SAP BW and BW/4HANA is that the latter enables
    agile data warehousing capabilities, which were missing in previous versions of
    this product. The big change in BW/4HANA modeling is that it enables a field-based
    modeling approach, which saves a lot of development time and effort, especially
    when creating proof of concepts or pilot data models. Although InfoObject-based
    modeling still is the core of enterprise datawarehouses (EDWs), in some scenarios
    there is no point in creating dozens of InfoObjects to simply deliver a prototype.
    Also, often a business needs an ad hoc report to perform analysis on a specific
    set of data. For example, a business may require a report that will be used for
    only one specific project or a one-time activity (like a data extract). In such
    a scenario, there is no point in enhancing an existing enterprise data model,
    which is usually a huge effort, because the developer needs to perform a fit-gap
    analysis, check the impact on the existing model, consider the risk factors, and
    finally implement the solution based on the design. With BW/4HANA, it is possible
    to create ad hoc reports independently from an EDW without even persisting the
    data, just by taking advantage of HANA’s in-memory processing features to implement
    the logic that will process and display the results on the fly based on the source
    tables.


    The big step forward within BW/4HANA is a virtualization capability. This concept
    utilizes a feature of HANA virtual tables that can be later consumed by BW/4HANA
    modeling objects. Virtual modeling allows you to avoid data persistency when accessing
    data from other databases. With virtualization, it is possible to integrate non-SAP
    data within SAP data models or even create independent data models based on external
    data sources. Of course, when creating virtual data models, we need to consider
    performance constraints. Since the data will be sourced from external systems,
    we will not be able to get any benefits from the HANA in-memory processing powers.
    Unlike standard BW data models, where complex joins and expressions are precalculated
    and stored physically, in the virtual approach all the operations will be processed
    on the fly whenever a user runs a report.


    # Main SAP HANA Modeling Objects


    As mentioned, within BW/4HANA it is possible to take advantage of the SAP HANA
    native modeling artifacts.


    Two main modeling objects in SAP HANA are calculation views and table functions.
    Calculation views are modeled using the graphical interface of the SAP HANA modeler
    perspective, and hence no deep SQL knowledge is required. Table functions are
    created with the SAP HANA development perspective and are purely based on SQL
    scripts.


    Graphical calculation views (CVs) are modeled using the SAP HANA modeler perspective.
    They are used to model a business logic and return a desired set of data as output.
    With CVs you can perform data manipulation functions such as joins, unions, aggregations,
    and ranks, as well as apply filters and create calculated columns. A node-by-node
    building approach enables an easy way of implementing and maintaining complex
    business logic.


    In the past, there were three kinds of CVs: attribute views, analytic views, and
    calculation views. Within SPS11 this approach has been unified, and all three
    view types were replaced with a single modeling object called a `calculation view`.
    SAP also provided functionality for migrating analytic and attribute views to
    calculation views. Although all these view types are still available in Eclipse,
    the ones that are deprecated should not be used anymore.


    Table functions (TFs) are SQL-based modeling objects that are used whenever the
    functionality of a graphical CV is not sufficient to meet the business requirements.
    The usage of TFs is similar to CVs, but the main difference is that the entire
    logic is developed by using SQL scripts instead of the graphical editor. Also,
    the Eclipse perspective used for TF development is different. Unlike CVs, TFs
    are created using the SAP development perspective of the Eclipse tool.


    TFs are used to implement the business logic, however, from a reporting perspective,
    they cannot be used as stand-alone objects. Once a table function is created,
    it needs to be exposed through the calculation view created on top before making
    it available on the reporting layer.


    Table functions were introduced as a replacement to SQL script calculation views.
    Using the Eclipse migration tool, developers can automatically convert obsolete
    script-based calculation views into table functions.


    As you can see, the main purpose for modeling both objects is to perform complex
    data manipulations on top of tables or other views. In the next sections, I will
    describe how to create these objects and explain the use cases, advantages, and
    limitations of each of them.'
