  trans: '

    ### 虚拟表


    借助智能数据访问（SDA）功能，SAP HANA 提供了从外部系统引入数据的能力，而无需在 SAP HANA 数据库中复制这些数据。通过 SDA，开发人员可以轻松建立远程连接，从而能够创建虚拟表，并像访问本地
    HANA 表一样访问这些对象。


    在 BW/4HANA 环境中，当创建非 SAP 数据模型或将外部数据集成到 SAP 数据模型时，SDA 可以发挥重要作用。将来自多个系统（如 Oracle、SQL
    Server、Hadoop 等）的数据集成到单个 SAP 企业数据仓库中，能够实现新的分析能力。


    SDA 的另一个好处是它是一种成本效益高且节省时间的解决方案。首先，您无需复制数据并支付存储费用。当然，对于大型数据集和复杂模型，出于性能原因，可能仍然需要将外部数据持久化存储在
    BW/4HANA 层。其次，无需设置和维护复制系统。此外，通过 SDA 访问的数据是实时的。借助虚拟表，您可以创建使用外部数据的查询，并将它们与驻留在 SAP
    HANA 系统中的数据相结合。


    要开始访问远程数据源，您需要首先设置连接。最简单的方法是使用 Eclipse GUI 创建一个新的远程源（作为创建远程源的替代方法，您也可以使用 SQL 脚本）。要建立远程连接，请打开
    SAP HANA 模型器透视图并展开 Provisioning 目录。然后右键单击 Remote Sources 文件夹，选择 New Remote Source，如图
    1-18 所示。


    ![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig18_HTML.jpg](img/508424_1_En_1_Fig18_HTML.jpg)


    图 1-18


    创建远程源 (SDA)


    提供所有连接属性后，远程源对象将出现在 Remote Source 目录下。每个远程源将包含数据库名称以及所有可访问的模式和表的列表（见图 1-19）。


    ![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig19_HTML.jpg](img/508424_1_En_1_Fig19_HTML.jpg)


    图 1-19


    远程数据源视图


    如图 1-19 所示，有一个名为 MSSQL 的远程连接，连接到名为 RMA 的数据库。此 RMA 数据库包含一个名为 dev 的模式，在该模式中有一个名为
    dev_table 的表。此时，您还不能查询该表中的数据。


    要开始查询来自远程源表的数据，您需要首先创建一种称为*虚拟表*的 HANA 对象。需要为您之后想要访问的每个远程表创建虚拟表。


    提示


    在创建虚拟表之前，一个好的做法是创建一个专用于远程表的 SAP HANA 数据库模式。这样，所有虚拟表都会驻留在一个位置。


    与远程源一样，有两种创建虚拟表的方法：使用 GUI 或 SQL 脚本。图 1-20 展示了一种创建虚拟表的图形化方法。


    ![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig20_HTML.jpg](img/508424_1_En_1_Fig20_HTML.jpg)


    图 1-20


    创建虚拟表


    注意


    对于每个远程源，您都需要获得创建虚拟表的授权。以下 SQL 查询授予此权限：`GRANT CREATE VIRTUAL TABLE ON REMOTE SOURCE
    <SOURCE_NAME> TO <USER_NAME>`


    选择添加虚拟表的选项后，作为下一步，您需要输入虚拟表的名称和目标模式。一旦提供并确认此信息，虚拟表将在给定模式下创建。如果它是一个常规的 HANA 表，您可以开始在
    SQL 控制台中使用虚拟表，或在图形视图中使用它。


    ## 主要的 SAP BW/4HANA 建模对象


    在用于所有建模对象的 BW/4HANA SAP 统一用户界面中，开发人员现在可以使用 Eclipse 工具开发所有 BW 对象（见图 1-21）。另一个好处是，他们只需单击一下即可从
    HANA 原生透视图切换到 BW/4HANA 建模透视图。为了开发 BW 工件，开发人员将使用 Eclipse 的 BW 建模透视图。每个 BW/4HANA
    工件都可以通过右键单击信息区域，选择新建，并选择相应的对象来创建（如图 1-21 所示）。


    ![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig21_HTML.jpg](img/508424_1_En_1_Fig21_HTML.jpg)


    图 1-21


    BW 建模透视图中的建模对象


    对于特定的 BW/4HANA 任务，仍然需要使用 SAP GUI。为了将其使用与建模活动统一起来，SAP GUI 也已嵌入到 Eclipse 中。通过单击“打开
    SAP GUI”按钮（或使用键盘快捷键 Ctrl+6），您可以在 Eclipse 工具中打开 SAP GUI（见图 1-22）。


    ![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig22_HTML.png](img/508424_1_En_1_Fig22_HTML.png)


    图 1-22


    Eclipse 中的 SAP GUI


    SAP BW/4HANA 通过将建模对象类型从九种限制为仅四种，简化了数据建模方法。就数据持久性而言，不再有称为 InfoCube、PSA、DSO 或 HybridProvider
    的对象。它们全部被一个称为高级 DSO (ADSO) 的单一对象所取代。就虚拟层而言，以下遗留对象已合并为一个称为复合提供者的单一对象：MultiProvider、InfoSet
    和 VirtualProvider。还有一个名为开放 ODS 视图的新建模对象。开放 ODS 视图对象具有类似于旧 VirtualProvider 对象的功能。InfoObject
    的主要目的和功能保持不变。图 1-23 显示了 BW/4HANA 与旧版 SAP BW 系统相比如何简化了建模对象。


    ![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig23_HTML.jpg](img/508424_1_En_1_Fig23_HTML.jpg)


    图 1-23


    BW 与 BW/4HANA 中建模对象的比较


    最基本的建模对象是信息对象。该对象的主要功能在 BW/4HANA 版本中没有改变。在早期版本 SAP BW 上工作的开发人员将会熟悉此对象。在下一节中，我不会详细讨论
    InfoObject 的属性；我将重点介绍那些在新建模方法中有用的功能。


    开放 ODS 视图是代表虚拟建模层的对象。这意味着它们不持久化任何数据。使用开放 ODS 视图，开发人员可以将外部数据引入 BW 报告层。与 InfoObject
    不同，使用开放 ODS 视图，您可以决定基本的构建块是什么。它们可以基于 InfoObject、另一个开放 ODS 视图或原始字段构建。


    使用开放 ODS 视图对象，开发人员可以轻松管理外部数据源并构建星型模式模型，而无需数据持久化。这意味着它们可以充当一种虚拟主数据或虚拟事实表。此外，借助开放
    ODS 视图对象的基于字段的方法，我们避免了创建过多的 InfoObject，这在某些场景（概念验证、试点、表/视图数据供应）中不会带来任何价值，反而会因在系统中创建多个虚拟对象而产生额外的工作。

    '
- fmt: '在 SAP BW/4HANA 中，像 DSO、InfoCube、PSA 和 HybridProvider 这些对象的功能现在已统一为单一建模对象。BW/4HANA
    用于数据持久化的主要对象是`ADSO`。与旧的 BW 持久化对象不同，`ADSO`不必仅基于`InfoObject`构建；它可以使用基于字段的建模方法实现。在某些业务场景下，需要创建临时报表、概念验证或基于外部源的模型，并将它们加载到
    BW/4HANA 系统中。定义`ADSO`结构时，您可以简单列出所有所需字段和数据类型，然后激活对象。您也无需指定将为`ADSO`使用哪种构建块类型；您可以在单个`ADSO`中灵活地混合使用`InfoObject`与原始字段。


    `CompositeProvider`是一个 BW/4HANA 对象，它集成了以前 MultiProvider、InfoSet 和 VirtualProvider
    的所有功能。`CompositeProvider`代表一个逻辑层，因此它不持久化任何数据（虚拟对象）。它允许您在创建用于报表的最终查询之前，合并来自多个`InfoProvider`或
    HANA 计算视图的数据。一个良好的 BW/4HANA 建模实践是使用`CompositeProvider`作为逻辑层，该层随后被最终的`Query`对象消费。`CompositeProvider`支持两种主要操作：联接（Join）和联合（Union）。此外，随着
    BW/4HANA 2.0 的最新发布，可以在单个`CompositeProvider`中组合多个联接和联合操作。得益于此，构建逻辑模型类似于构建计算视图。用于建模`CompositeProvider`的节点类型也与计算视图的节点类型几乎相同。您可以使用联接（join）、联合（union）、投影（projection）和聚合（aggregation）节点来实现结合`InfoProvider`和计算视图的复杂场景。


    BW/4HANA 2.0 还进一步为`CompositeProvider`赋予了 HANA SQL 脚本功能。因此，`CompositeProvider`提供了实现基于
    SQL 的计算列的能力。这是一个很好的改进，因为在旧的 BW 系统中一直缺少在特征上创建计算列的功能。借助此功能，您可以轻松创建计算列，例如，将两个`InfoObject`的值连接成一个字符串。所有
    SQL 计算将在查询执行期间即时处理，这意味着对于复杂计算和大型数据集，性能可能会受到影响。SQL 脚本也可用于在`CompositeProvider`模型中消费的`InfoProvider`上实现过滤表达式。


    总结一下，以下是 BW/4HANA 2.0 中`CompositeProvider`的主要优势和改进：


    * `CompositeProvider`可以将多个 PartProvider（`ADSO`、`Open ODS View`、`InfoObject`）合并到一个逻辑层中。

    * SAP HANA 计算视图作为 PartProvider 得到支持。

    * `CompositeProvider`的输出结构可以使用`InfoObject`、`Open ODS View`和原始字段的混合来构建。

    * 投影、聚合、联接和联合建模节点均可用。

    * 联接操作提供了更大的灵活性，可以选择联接类型（内联接、参照联接、左外联接、右外联接、全外联接）、设置联接基数（n:m、1:n、n:1、1:1）以及使用联接运算符（`=`、`≠`、`<`、`≤`、`≥`、`>`）。

    * 支持使用 SQL 脚本实现过滤表达式和计算列。


    `Query`对象用于报表，并可以被前端工具消费。它们可以在每个`InfoProvider`之上创建，但在我看来，最好总是创建一个`CompositeProvider`作为`InfoProvider`和最终`Query`对象之间的中间层。这提供了更大的灵活性，以便您将来需要对底层`InfoProvider`应用一些额外的逻辑或将其与其他`InfoProvider`组合。在这种情况下，您无需从头重新创建查询，只需增强逻辑层并继续使用当前查询即可。在
    SAP BW/4HANA 中，不再支持 BEx Query Designer 工具。BEx Designer 的功能现已迁移到 Eclipse 平台。换句话说，BEx
    Query Designer 的功能现在作为基于 Eclipse 的 Query Designer 提供。


    在本章中，我不会详细讲解查询的所有功能，因为其中大部分与 SAP BEx Query Designer 相同。本章侧重于数据建模能力；因此，我仅对 Query
    Designer 进行高层次概述。


    BW/4HANA 系统中一个可能对建模有用的新对象是`Data Flow`对象。`Data Flow`对象以图形方式解释所选 BW/4HANA 对象之间的依赖关系。借助`Data
    Flow`对象，您可以为数据流创建模板，并从图形模型生成所有对象。


    在接下来的部分中，我将对 BW/4HANA 对象进行高层次概述，并试图突出那些在我看来对新型建模方法有用的特性。'
  raw: 'In SAP BW/4HANA, the functionalities of objects like DSO, InfoCube, PSA, and
    HybridProvider have now been unified into a single modeling object. The primary
    object of BW/4HANA for data persistency is the ADSO. Unlike the old BW persistent
    objects, ADSOs do not need to be based solely on InfoObjects; they can be implemented
    using a field-based modeling approach. There are business scenarios for creating
    ad hoc reports, proof of concepts, or models on external sources that need to
    be loaded into the BW/4HANA system. While defining the ADSO structure, you can
    simply list all the required fields and data types and activate the object. You
    also don’t need to specify what building block type you will use for ADSO; you
    have the flexibility to mix InfoObjects with raw fields within a single ADSO.


    CompositeProvider is a BW/4HANA object that combines all the functionalities of
    former MultiProviders, InfoSets, and VirtualProviders in one. CompositeProvider
    represents a logical layer, so it does not persist any data (virtual object).
    It enables you to merge data coming from multiple InfoProviders or HANA calculation
    views before creating the final query used for reporting. A good BW/4HANA modeling
    practice is to use CompositeProvider as a logical layer, which is later consumed
    by the final Query object. CompositeProviders support two main operations: join
    and union. In addition, with the latest release of BW/4HANA 2.0, it is possible
    to combine multiple join and union operations within a single CompositeProvider.
    Thanks to that, building logical models is similar to building calculation views.
    Node types available for modeling composite providers are also almost the same
    as for calculation views. You can implement complex scenarios combining InfoProviders
    and calculation views using join, union, projection, and aggregation nodes.


    BW/4HANA 2.0 additionally empowers CompositeProvider with HANA SQL script capabilities.
    Therefore, CompositeProvider offers the ability to implement SQL-based calculated
    columns. This is a nice improvement, since the functionality of creating calculated
    columns on characteristics was always missing in the old BW system. With this
    feature, you can easily create calculated columns that will, for example, concatenate
    values from two InfoObjects into a single string. All the SQL calculations will
    be processed on the fly during the query execution, meaning that for complex calculations
    and large data sets performance can be impacted. SQL scripts can be also leveraged
    for implementing filter expressions on InfoProviders consumed in the CompositeProvider
    model.


    To summarize, here are the main benefits and enhancements of CompositeProvider
    within BW/4HANA 2.0:


    *   CompositeProvider can combine multiple PartProviders (ADSOs, Open ODS Views,
    InfoObjects) into a single logical layer.


    *   SAP HANA calculation views are supported as PartProviders.


    *   The output structure of CompositeProvider can be built using a mix of InfoObjects,
    Open ODS Views, and raw fields.


    *   Projection, aggregation, join, and union modeling nodes are available.


    *   Join operations give more flexibility with the option for selecting the join
    type (inner, referential, left outer, right outer, full outer), setting join cardinality
    (n.m, 1.n, n.1, 1.1), and using the join operator (=, ≠, <, ≤, ≥, >).


    *   SQL scripts are supported for implementing filter expressions and calculated
    columns.


    Query objects are used for reporting and can be consumed by front-end tools. They
    can be created on top of each InfoProvider, but in my opinion it is always better
    to create a CompositeProvider as an intermediate layer between an InfoProvider
    and a final Query object. This provides more flexibility in case you want to apply
    some additional logic to the underlying InfoProvider or combine it with other
    InfoProviders. In such a scenario, you will not be forced to re-create a query
    from scratch, but just enhance the logical layer and continue using the current
    query. In SAP BW/4HANA, the BEx Query Designer tool is not supported anymore.
    A feature of the BEx designer has now been migrated to the Eclipse platform. In
    other words, the functionality of the BEx Query Designer is now available as an
    Eclipse-based Query Designer.


    In this chapter, I will not walk through all the functionalities of queries, since
    most of them are the same as in the SAP BEx Query Designer. This chapter is focused
    on the data modeling capabilities; hence, I will only give a high-level overview
    of the Query Designer.


    A new object available in the BW/4HANA system that might be useful for modeling
    is a Data Flow object. Data Flow objects graphically explain dependencies between
    selected BW/4HANA objects. Thanks to Data Flow objects, you can create a template
    for your data flow and generate all the objects from the graphical model.


    In the next sections, I will present a high-level overview of BW/4HANA objects,
    trying to highlight features that in my perspective are useful in the new modeling
    approaches.'
