    **重要**


    定义关联时，应始终从与目标字段具有相同数据类型的源字段开始映射。否则，系统将继承第一个映射的字段的数据类型，并覆盖我们的初始设置。


    如上所述，我们应该始终从具有“主导”数据类型的字段开始映射。例如，对于 `PRODUCT_ID` 目标字段，我们应该首先映射来自 *Projection_1*
