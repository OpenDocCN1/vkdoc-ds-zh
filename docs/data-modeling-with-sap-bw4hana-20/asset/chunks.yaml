- fmt: '# 排版后的内容


    As highlighted, you need to be careful when unselecting the `User Confirmed Referential
    Integrity` option because this might impact the master data table of the associated
    `InfoObject`. Every time you run the preview on the object with associations,
    the system will propagate the values that are not available in the master data
    table of the associated `InfoObjects`. To visualize that, let’s check the before
    and after images of the `ZBW4CUST` master data table.


    Figure [5-17](#508424_1_En_5_Chapter.xhtml#Fig17) shows how the content of the
    `ZBW4CUST` master data table has changed after we unselect the `Referential Integrity`
    option and run the `ZCPFCT01` Open ODS View (Figure [5-15](#508424_1_En_5_Chapter.xhtml#Fig15)).


    ![../images/508424_1_En_5_Chapter/508424_1_En_5_Fig17_HTML.jpg](images/508424_1_En_5_Chapter/508424_1_En_5_Fig17_HTML.jpg)


    **Figure 5-17.** The `ZBW4CUST` master data table before and after the `ZCPFCT01`
    Open ODS View execution


    The new entries that are highlighted (`0100000014` and `0100000015`) were populated
    into that `InfoObject` at the Open ODS View’s runtime. This means that every time
    new customer values appear in the underlying `ORDER_HEADER` table, once the preview
    on the Open ODS View is executed, they will be added to the master data of the
    `ZBW4CUST` InfoObject. Keeping this in mind, you need to be careful when associating
    fields with `InfoObjects`, because you might unconsciously propagate master data
    values that are unwanted. If you want to prevent this situation, you can create
    a copy of an existing `InfoObject` and use it instead of the main `InfoObject`.
    This is why in some scenarios you might prefer to use the `Referential Integrity`
    setting to make sure that the master data will not be messed up.


    Since the Open ODS View for the orders data (`ZCPFCT01`) was updated with new
    fields, we now need to incorporate these changes within `CompositeProvider` and
    Query. First we should update the `CompositeProvider` object (Figure [5-18](#508424_1_En_5_Chapter.xhtml#Fig18)).


    ![../images/508424_1_En_5_Chapter/508424_1_En_5_Fig18_HTML.jpg](images/508424_1_En_5_Chapter/508424_1_En_5_Fig18_HTML.jpg)


    **Figure 5-18.** Adding `ZBW4CUST` navigation attributes to the output of the
    `ZCPFCT01` CompositeProvider


    To display navigation attributes, we should enable them by using the option shown
    in Figure [5-6](#508424_1_En_5_Chapter.xhtml#Fig6). Therefore, we will be able
    to use customer attributes and map them to the output. As shown in Figure [5-18](#508424_1_En_5_Chapter.xhtml#Fig18),
    we need also to remove the mapping for the `CUST_NUMBER` field, since the customer’s
    technical name is now inherited from the `InfoObject` `ZBW4CUST`. Once we successfully
    activate the `CompositeProvider`, as a last step we should update the final query.


    Since we removed the `CUST_NUMBER` field from the underlying `CompositeProvider`,
    we need to also remove it from the query. Then we can add new customer-related
    fields and save the query (Figure [5-19](#508424_1_En_5_Chapter.xhtml#Fig19)).


    ![../images/508424_1_En_5_Chapter/508424_1_En_5_Fig19_HTML.jpg](images/508424_1_En_5_Chapter/508424_1_En_5_Fig19_HTML.jpg)


    **Figure 5-19.** Adding the `ZBW4CUST` navigation attributes to the output of
    the `ZCPFCT01_Q01` query


    The final query shown in Figure [5-20](#508424_1_En_5_Chapter.xhtml#Fig20) contains
    all the additional fields that were requested by the users. The enhancements requested
    from the users have now been implemented.


    ![../images/508424_1_En_5_Chapter/508424_1_En_5_Fig20_HTML.jpg](images/508424_1_En_5_Chapter/508424_1_En_5_Fig20_HTML.jpg)


    **Figure 5-20.** Output of `ZCPFCT01_Q01` query in Analysis for Microsoft Excel


    ## Summary


    This chapter demonstrated how we can consume `InfoObjects` within the models created
    on top of external sources. We explained how to make associations between fields
    and `InfoObjects`. We learned that associations can be applied both at the Open
    ODS View level and at the `CompositeProvider` level.


    The biggest advantage of hybrid data models is the fact that we can utilize existing
    master data objects and their functionalities such as hierarchies, navigation
    attributes, and texts. On the other hand, it was highlighted that hybrid data
    models can be used only when external attributes are in line with SAP data types
    and master data content. Otherwise, associations between external fields and `InfoObjects`
    may generate the wrong results or cause errors during the reporting.


    Finally, we learned the impact of `Referential Integrity` property. The examples
    explained the importance of using this setting in a right way and highlighted
    why it should be used with caution.


    # # 6. Integrating SAP and Non-SAP Data into a Single Data Model


    This chapter will walk you through the scenario of implementing a new data model
    that combines SAP data and non-SAP data. The approach presented in this chapter
    will use BW/4HANA virtualization capabilities to combine two data models with
    different structures. In this chapter, you will learn how to integrate SAP and
    non-SAP models by utilizing the best from both the BW/4HANA and HANA worlds. By
    using the LSA++ architecture, we will get the benefits of virtual objects to avoid
    data redundancy and to make the architecture as lean and simple as possible.'
