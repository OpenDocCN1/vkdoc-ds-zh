    ## Create a CompositeProvider for the Consolidated Open ODS view


    To utilize the navigation attributes of the Orders data model, we will create
    a final CompositeProvider object on top of the Orders ALL (ZINTFCT01) Open ODS
    View object. Figure [6-42](#508424_1_En_6_Chapter.xhtml#Fig42) presents the structure
    of the Orders (ZCPINTFCT01) CompositeProvider object.


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig42_HTML.jpg](images/508424_1_En_6_Chapter/508424_1_En_6_Fig42_HTML.jpg)


    Figure 6-42.


    Defining the structure of the ZCPINTFCT01 CompositeProvider object


    The ZCPINTFCT01 CompositeProvider object sources data from the Orders (ALL) Open ODS
    View object that was created in the previous section. All the fields have been
    mapped from the source into the target. To show the available navigation attributes,
    in the *Source* section right-click the Open ODS View icon and select *Show Unassigned
    Navigation Attributes* (Figure [6-43](#508424_1_En_6_Chapter.xhtml#Fig43)).


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig43_HTML.jpg](images/508424_1_En_6_Chapter/508424_1_En_6_Fig43_HTML.jpg)


    Figure 6-43.


    Show Unassigned Navigation Attributes menu item for the ZCPINTFCT01 CompositeProvider
    object


    After selecting the option shown in Figure [6-43](#508424_1_En_6_Chapter.xhtml#Fig43),
    we will be able to add Product attributes to the output of the CompositeProvider
    object. Optionally we could enable navigation attributes directly from the CompositeProvider
