  trans: '

    ### 虚拟数据供应


    我要介绍的第一个概念是基于 SAP HANA 工件进行报表。可能存在这样一种场景：我们只想在 BW/4HANA 系统中启用 SAP HANA 物理表或虚拟表的结构和内容。在图
    2-3 中，你可以看到直接从 HANA 表进行数据供应的概念。


    ![../images/508424_1_En_2_Chapter/508424_1_En_2_Fig3_HTML.jpg](img/508424_1_En_2_Fig3_HTML.jpg)


    图 2-3. BW/4HANA 表数据供应概念


    图 2-3 所示的概念展示了我们如何通过 BW/4HANA 层暴露 HANA 表。在这种方法中，`Open ODS View` 对象作为 `CompositeProvider`
    和 HANA 表之间的虚拟 BW/4HANA 对象。它们可以被 `CompositeProvider` 消费，以提供来自底层 HANA 表的数据，而无需任何数据持久化。此概念利用了基于字段的方法，因此我们无需创建任何
    `InfoObject`。所有字段都可以简单地从底层表结构拖拽到 `Open ODS View` 对象的目标结构中。然后，`Open ODS View` 对象可以被
    `CompositeProvider` 消费（我们也可以选择直接在 `Open ODS View` 对象之上创建查询）。图中的虚线表示数据流是完全虚拟化的，因此不需要数据加载。此类需求在数据抽取、临时数据分析或原型设计场景中非常常见。


    下一个概念与图 2-3 所示类似；然而，这里我们使用一个虚拟表作为源，该虚拟表物理上驻留在 HANA 数据库之外（例如，在 Microsoft SQL 或
    Oracle 数据库中）。图 2-4 描述了虚拟表数据供应的概念。


    ![../images/508424_1_En_2_Chapter/508424_1_En_2_Fig4_HTML.jpg](img/508424_1_En_2_Fig4_HTML.jpg)


    图 2-4. BW/4HANA 虚拟表数据供应概念


    使用 `Smart Data Access (SDA)`，我们可以创建一个连接到外部数据库的远程源。一旦配置好远程源，我们将能够在 HANA 系统中创建一个虚拟表，其结构与驻留在外部数据库中的源表相同。`Open
    ODS View` 对象使我们能够直接从 HANA 表和虚拟表获取数据。在图 2-4 所示的图表中，`Open ODS View` 对象是在虚拟表之上创建的。


    在需要对源表应用一些额外的数据处理，或者创建结合了多个表（包括虚拟表和普通表）的数据集时，我们可以利用计算视图的功能（见图 2-5）。


    ![../images/508424_1_En_2_Chapter/508424_1_En_2_Fig5_HTML.jpg](img/508424_1_En_2_Fig5_HTML.jpg)


    图 2-5. BW/4HANA 计算视图数据供应概念


    图 2-5 所示的变体与之前的类似。区别仅在于 SAP HANA 层面，即在三个表之上添加了一个计算视图。该计算视图结合了 HANA 表和虚拟表的数据。BW/4HANA
    部分与之前的示例保持一致，这意味着数据通过基于字段的 `Open ODS View` 对象从计算视图传递到 `CompositeProvider` 对象。


    > **注意：** 可以直接添加计算视图作为 `CompositeProvider` 的源。但是，在创建 `Open ODS View` 对象时，我们同时也定义了一个可重用的逻辑对象，包含所有属性、结构或与主数据对象的关联。因此，在每次将特定计算视图用作
    `CompositeProvider` 对象的源时，我们无需重复应用所有这些设置。


    ### 基于字段的数据模型


    现在让我们考虑一个更复杂的场景：需求是基于 HANA 表的数据在 BW/4HANA 中创建一个星型连接数据模型。图 2-6 展示了一个简化的星型连接数据模型，我将把它作为参考，用于可视化
    BW/4HANA 的建模方法。


    ![../images/508424_1_En_2_Chapter/508424_1_En_2_Fig6_HTML.jpg](img/508424_1_En_2_Fig6_HTML.jpg)


    图 2-6. 简化的星型连接模式


    星型连接模式由一个中心事实表和多个以规范化形式连接的维度表组成。为了在 BW/4HANA 中模拟相同的行为，我们可以再次利用 `Open ODS View`
    对象。在创建 `Open ODS View` 对象时，我们可以选择指明底层对象的类型。我们可以将语义定义为 `Facts`、`Master Data` 或
    `Text`。图 2-7 展示了在 BW/4HANA 中基于 HANA 表实现虚拟模型的方法（参见图 2-6）。


    ![../images/508424_1_En_2_Chapter/508424_1_En_2_Fig7_HTML.jpg](img/508424_1_En_2_Fig7_HTML.jpg)


    图 2-7. BW/4HANA 实现基于 `Open ODS View` 的虚拟模型的概念


    如图 2-7 所示，事实表和维度表的数据流是相似的。对于事实表，会创建一个数据类别为 `CUBE` 的计算视图；而对于维度表，则创建一个类别为 `DIMENSION`
    的视图。当利用直接驻留在 HANA 数据库中的物理表时，也可以采用相同的方法。


    > **注意：** `Open ODS View` 可以直接消费虚拟表，因此不强制创建计算视图作为中间层。尽管如此，我仍然建议创建计算视图，因为如果将来需要实现额外的格式化、转换数据类型或添加计算列（这些是非常常见的需求），这将为您带来灵活性。


    对于 `Open ODS View` 对象，还有两种语义类型被使用：`Facts` 用于事实表，`Master Data` 用于三个维度表。您可能会注意到
    `Open ODS View 2` 链接到了 `Open ODS View 3`。这用于可视化表示 `Open ODS View 2` 的字段与 `Open
    ODS View 3` 主数据存在关联。为了更好地理解这个概念，您可以将它们视为带属性的 `InfoObject`。您创建一个主 `InfoObject`
    并指定一个 `InfoObject` 列表作为导航属性。唯一的区别是，我们使用的是 `Open ODS View`，而不是 `InfoObject`。`Facts
    Open ODS View` 与 `Master Data Open ODS View 1` 和 `2` 之间的虚线也描绘了事实表字段与 `Master Data`
    的关联。最终的 `CompositeProvider` 可能仍然包含原始字段；但是，这些字段将与 `Open ODS View` 主数据对象建立关联。这种方法使您能够创建无需数据持久化的星型连接数据模型。


    图 2-7 中描述的建模变体是完全虚拟化的，可能不适用于复杂的数据模型或需要处理大量数据量的场景。在虚拟数据模型中，所有操作都是即时执行的，这显然会导致性能下降。此外，虚拟表从外部数据库查询数据，这同样效率不高。


    如果您开发了基于 `Open ODS View` 对象的虚拟数据模型，并且意识到性能不够理想，您可以为选定的 `Open ODS View` 对象（`Facts`
    和/或 `Master Data`）自动生成持久化层。图 2-8 展示了基于持久化 `Open ODS View` 的数据模型架构。


    ![../images/508424_1_En_2_Chapter/508424_1_En_2_Fig8_HTML.jpg](img/508424_1_En_2_Fig8_HTML.jpg)


    图 2-8. BW/4HANA 实现基于 `Open ODS View` 的持久化模型的概念

    '
- fmt: '# 开放式ODS视图


    开放式ODS视图提供了生成数据流的功能。借助源对象与开放式ODS视图对象之间的这一功能，系统会自动生成数据源和ADSO以及包含DTP的转换。当你将图[2-7](#508424_1_En_2_Chapter.xhtml#Fig7)与图[2-8](#508424_1_En_2_Chapter.xhtml#Fig8)中的架构进行比较时，你会注意到在计算视图与开放式ODS视图对象之间多了两个对象。实线表示来自数据源的数据通过转换和DTP物理加载到ADSO对象中。当然，在从性能优化的角度分析模型时，你可以决定哪些开放式ODS视图对象需要物理数据存储。你无需在虚拟模型和持久化模型之间做出选择，但可以有选择地为某些开放式ODS视图创建持久化的ADSO层。通常，由于高数据量（数百万条记录），性能主要受事务处理表的影响。在这种情况下，你可以为事实表生成ADSO，同时保持主数据模型为虚拟模型。


    ## 混合数据模型


    下一种建模变体是多种建模对象的组合。正如在BW/4HANA中已经提到的，我们不必强制选择单一的数据模型实现方式。BW/4HANA支持混合建模概念，允许我们在单个数据模型中同时利用信息对象、开放式ODS视图对象以及基于字段的方法。当新创建的数据模型中的部分维度与SAP主数据一致时，可以采用混合方法。例如，在生产型企业中，工厂命名规范可能在所有系统中都是标准化的。如果是这种情况，那么在BW/4HANA中创建新模型时，就没有必要创建和存储相同的主数据；我们可以改用标准的`0PLANT`信息对象。通过采用现有的信息对象，我们可以利用其所有功能，如属性、导航属性、层次结构或授权能力（针对与授权相关的信息对象）。此外，通过尽可能采用现有的信息对象，我们既能确保完整性和一致性，又能避免冗余并减少开发和维护工作量。图[2-9](#508424_1_En_2_Chapter.xhtml#Fig9)展示了BW/4HANA中的混合建模方法。


    ![../images/508424_1_En_2_Chapter/508424_1_En_2_Fig9_HTML.jpg](images/508424_1_En_2_Chapter/508424_1_En_2_Fig9_HTML.jpg)


    图2-9. BW/4HANA混合数据模型


    如图[2-9](#508424_1_En_2_Chapter.xhtml#Fig9)所示，`Facts`开放式ODS视图对象基于三种对象类型建模：信息对象、开放式ODS视图和字段。信息对象可用于那些具有与SAP模型中相同主数据的维度。一些组织可能正在使用主数据管理系统；因此，多个系统可以共享相同的主数据。如果是这种情况，外部数据模型中的某些维度可以映射到SAP信息对象。尽可能为外部模型利用信息对象是很好的做法。这样，我们无需任何开发工作就能提供额外的属性。


    图[2-9](#508424_1_En_2_Chapter.xhtml#Fig9)中使用的第二个`Facts`开放式ODS视图构建块是`Master Data`开放式ODS视图。对于主数据，开放式ODS视图的方法与前两个模型（图[2-7](#508424_1_En_2_Chapter.xhtml#Fig7)和图[2-8](#508424_1_En_2_Chapter.xhtml#Fig8)）相同。此外，在创建`Master
    Data`开放式ODS视图时，你可以将字段与其他`Master Data`开放式ODS视图对象、信息对象或字段进行关联。尽管混合模型为设计架构提供了数十种组合，但在实际实施之前，我建议你详细分析整个数据模型（表、字段和关系）。在此基础上，你可以准备总体方法以及使用每种对象类型的用例。我对混合建模的建议如下：


    *   只要适用，就使用信息对象（同时用于`Facts`和`Master Data`开放式ODS视图对象）。

    *   对于非SAP维度，创建`Master Data`开放式ODS视图。

    *   仅当使用虚拟对象时性能不足，才创建ADSO。

    *   如果信息对象或`Master Data`开放式ODS视图关联不适用，则使用基于字段的方法。

    *   在设计阶段，定义混合模型的总体架构并遵循该方法（否则，模型可能会变得复杂且难以管理）。'
  raw: 'Open ODS Views provide functionality for generating data flows. With this
    functionality between the source object and the Open ODS View objects, the system
    generates the Data Source and ADSO as well as the transformation with DTP. When
    you compare the architecture in Figure [2-7](#508424_1_En_2_Chapter.xhtml#Fig7)
    with Figure [2-8](#508424_1_En_2_Chapter.xhtml#Fig8), you will notice that between
    the calculation view and the Open ODS View object there are two additional objects.
    A solid line indicates that data coming from the data source is physically loaded
    into the ADSO object using transformation and DTP. Of course, while analyzing
    your model from the performance improvement perspective, you can decide which
    Open ODS View objects require physical data storage. You don’t need to choose
    between the virtual and persistent models, but you can selectively choose for
    which Open ODS Views you want to create a persistent ADSO layer. Usually because
    of the high data volume (millions of records), performance is mainly impacted
    for transactional tables. In this case, you can generate an ADSO for fact tables
    and keep the master data model virtual.


    ### Hybrid Data Models


    The next modeling variant is a combination of multiple modeling objects. As already
    mentioned in BW/4HANA, we are not forced to choose a single way of implementing
    the data model. BW/4HANA enables a hybrid modeling concept, where we can leverage
    InfoObjects, Open ODS View objects, and a field-based approach within a single
    data model. The hybrid approach can be used when parts of the dimensions from
    the newly created data model are consistent with the SAP master data. For example,
    in a production company, a plant naming convention could be standardized across
    all the systems. If this is the case, then while creating a new model in BW/4HANA,
    there is no point in creating and storing the same master data; we could utilize
    a standard 0PLANT InfoObject instead. As a result of adapting existing InfoObjects,
    we can take advantage of all their features such as attributes, navigational attributes,
    hierarchies, or authorization capabilities (for authorization-relevant InfoObjects).
    Moreover, by adapting existing InfoObjects wherever it’s possible, we ensure integrity
    and consistency as well as avoid redundancy and limit the development and maintenance
    effort. Figure [2-9](#508424_1_En_2_Chapter.xhtml#Fig9) depicts the hybrid modeling
    approach in BW/4HANA.


    ![../images/508424_1_En_2_Chapter/508424_1_En_2_Fig9_HTML.jpg](images/508424_1_En_2_Chapter/508424_1_En_2_Fig9_HTML.jpg)


    Figure 2-9.


    BW/4HANA hybrid data model


    As shown in Figure [2-9](#508424_1_En_2_Chapter.xhtml#Fig9), the Facts Open ODS
    View object is modeled based on three object types: InfoObject, Open ODS View,
    and Field. InfoObjects can be leveraged for dimensions, which have the same master
    data as in the SAP model. Some organizations might be using the master data management
    system; hence, multiple systems can share the same master data. If this is the
    case, some of the dimensions from the external data model could be mapped to SAP
    InfoObjects. It is good to utilize InfoObjects for external models whenever it’s
    possible. This way, we provide additional attributes, without any development
    effort.


    The second Facts Open ODS View building block used in Figure [2-9](#508424_1_En_2_Chapter.xhtml#Fig9)
    is the Master Data Open ODS View. For the master data, the Open ODS View approach
    is the same as in the previous two models (Figures [2-7](#508424_1_En_2_Chapter.xhtml#Fig7)
    and [2-8](#508424_1_En_2_Chapter.xhtml#Fig8)). In addition, when creating the
    Master Data Open ODS View, you have the possibility to associate fields with other
    Master Data Open ODS View objects, InfoObjects, or fields. Although the hybrid
    model gives dozens of combinations for designing the architecture, before the
    actual implementation I suggest you analyze in detail the entire data model (tables,
    fields, and relationships). Based on that, you can prepare the general approach
    and use cases for using each type of the object. My recommendation for hybrid
    modeling is as follows:


    *   Use InfoObjects whenever applicable (both for the Facts and Master Data Open
    ODS View objects).


    *   For non-SAP dimensions, create Master Data Open ODS Views.


    *   Create an ADSO only if the performance is not sufficient when leveraging virtual
    objects.


    *   If the InfoObject or Master Data Open ODS View association is not applicable,
    use a field-based approach.


    *   In the design phase, define the general architecture for the hybrid model
    and follow that approach (otherwise, the model can become complex and unmanageable).'
  trans: '

    # 开放式 ODS 视图


    开放式 ODS 视图提供了生成数据流的功能。借助源对象与开放式 ODS 视图对象之间的这一功能，系统会自动生成数据源和 ADSO 以及包含 DTP 的转换。当你将图
    2-7 与图 2-8 中的架构进行比较时，你会注意到在计算视图与开放式 ODS 视图对象之间多了两个对象。实线表示来自数据源的数据通过转换和 DTP 物理加载到
    ADSO 对象中。当然，在从性能优化的角度分析模型时，你可以决定哪些开放式 ODS 视图对象需要物理数据存储。你无需在虚拟模型和持久化模型之间做出选择，但可以有选择地为某些开放式
    ODS 视图创建持久化的 ADSO 层。通常，由于高数据量（数百万条记录），性能主要受事务处理表的影响。在这种情况下，你可以为事实表生成 ADSO，同时保持主数据模型为虚拟模型。


    ## 混合数据模型


    下一种建模变体是多种建模对象的组合。正如在 BW/4HANA 中已经提到的，我们不必强制选择单一的数据模型实现方式。BW/4HANA 支持混合建模概念，允许我们在单个数据模型中同时利用信息对象、开放式
    ODS 视图对象以及基于字段的方法。当新创建的数据模型中的部分维度与 SAP 主数据一致时，可以采用混合方法。例如，在生产型企业中，工厂命名规范可能在所有系统中都是标准化的。如果是这种情况，那么在
    BW/4HANA 中创建新模型时，就没有必要创建和存储相同的主数据；我们可以改用标准的`0PLANT`信息对象。通过采用现有的信息对象，我们可以利用其所有功能，如属性、导航属性、层次结构或授权能力（针对与授权相关的信息对象）。此外，通过尽可能采用现有的信息对象，我们既能确保完整性和一致性，又能避免冗余并减少开发和维护工作量。图
    2-9 展示了 BW/4HANA 中的混合建模方法。


    ![../images/508424_1_En_2_Chapter/508424_1_En_2_Fig9_HTML.jpg](img/508424_1_En_2_Fig9_HTML.jpg)


    图 2-9. BW/4HANA 混合数据模型


    如图 2-9 所示，`Facts`开放式 ODS 视图对象基于三种对象类型建模：信息对象、开放式 ODS 视图和字段。信息对象可用于那些具有与 SAP 模型中相同主数据的维度。一些组织可能正在使用主数据管理系统；因此，多个系统可以共享相同的主数据。如果是这种情况，外部数据模型中的某些维度可以映射到
    SAP 信息对象。尽可能为外部模型利用信息对象是很好的做法。这样，我们无需任何开发工作就能提供额外的属性。


    图 2-9 中使用的第二个`Facts`开放式 ODS 视图构建块是`Master Data`开放式 ODS 视图。对于主数据，开放式 ODS 视图的方法与前两个模型（图
    2-7 和图 2-8）相同。此外，在创建`Master Data`开放式 ODS 视图时，你可以将字段与其他`Master Data`开放式 ODS 视图对象、信息对象或字段进行关联。尽管混合模型为设计架构提供了数十种组合，但在实际实施之前，我建议你详细分析整个数据模型（表、字段和关系）。在此基础上，你可以准备总体方法以及使用每种对象类型的用例。我对混合建模的建议如下：


    *   只要适用，就使用信息对象（同时用于`Facts`和`Master Data`开放式 ODS 视图对象）。

    *   对于非 SAP 维度，创建`Master Data`开放式 ODS 视图。

    *   仅当使用虚拟对象时性能不足，才创建 ADSO。

    *   如果信息对象或`Master Data`开放式 ODS 视图关联不适用，则使用基于字段的方法。

    *   在设计阶段，定义混合模型的总体架构并遵循该方法（否则，模型可能会变得复杂且难以管理）。

    '
- fmt: '# Hybrid Modeling Concept for Virtual Model Implementation


    The hybrid modeling concept can be used as a final architecture for virtual model
    implementation. Nevertheless, you need to remember that despite the Master Data
    Open ODS Views acting as virtual InfoObjects, this does not cover all their functionalities.
    A common requirement is the creation of hierarchies. `Open ODS Views` do not support
    hierarchies, while `InfoObjects` do. Another limitation is the transitive attributes
    functionality, which is also not available for `Open ODS Views`. In such a scenario,
    assuming that you want to keep your architecture virtual, you might take advantage
    of “virtual” `InfoObjects`. By “virtual” `InfoObjects`, I mean `InfoObjects` with
    the `Access Type` option set as `SAP HANA View`. Figure [2-10](#508424_1_En_2_Chapter.xhtml#Fig10)
    shows the concept of a data model using `HANA View`–based `InfoObjects`.


    ![../images/508424_1_En_2_Chapter/508424_1_En_2_Fig10_HTML.jpg](images/508424_1_En_2_Chapter/508424_1_En_2_Fig10_HTML.jpg)


    **Figure 2-10.** BW/4HANA hybrid data model with “virtual” `InfoObjects`


    The second hybrid modeling approach is a mixture of field-based and `InfoObject`-based
    approaches. If a field has no master data (for example, a free-text field), keeping
    it as a raw field is good enough. For the master data model, we could create a
    “virtual” `InfoObject` by setting its `access type` to `SAP HANA View`. This means
    that instead of using `InfoObject`’s technical tables, this `InfoObject` will
    source master data from the underlying calculation view. When setting the `SAP
    HANA view` as the `access type`, we need to indicate the path for the source calculation
    view and provide the mapping between the `InfoObject` attributes and the calculation
    view fields. In Figure [2-10](#508424_1_En_2_Chapter.xhtml#Fig10), `InfoObject
    1` is mapped to `Calculation View 1`, and it has three attributes: `InfoObject
    2`, `InfoObject 4`, and `InfoObject 5`. `InfoObject 2` is also virtual and queries
    data from `Calculation View 2`. `InfoObject 4` is a standard SAP master data object,
    while `InfoObject 5` is an attribute-only object. If the performance is not sufficient,
    we could create a persistent master data model by loading the output of the dimension
    calculation views into new `InfoObjects`. This way, we could create for the external
    system a data model following the same architecture as the traditional `BW/4HANA`
    model (Figure [2-2](#508424_1_En_2_Chapter.xhtml#Fig2)). The only difference would
    be that the data would be sourced from the external system instead of SAP.


    When applying this architecture, we need to remember that we are losing all the
    flexibility that the `Open ODS View` objects and field-based approach enable.
    `InfoObjects` cannot take advantage of field-based modeling, meaning for each
    attribute we are forced to use `InfoObjects`. As a principle, usage of `InfoObjects`
    for external data models should be considered if the following conditions are
    met:


    - The source data model has stable structures that hardly change.

    - In the pilot phase, you created a field-based model that was tested, and as
    a next iteration, you want to convert it to a structured model followed by the
    classic `BW/4HANA` modeling concept.

    - There is a need for leveraging functionality that is not available for `Open
    ODS Views` or fields. In this case, use a “virtual” `InfoObject` for these specific
    dimensions (i.e., when a hierarchy is required).


    **Best practice**


    Performance may not be sufficient when the data model is fully based on virtual
    tables (the model used on HANA physical tables will have better performance).
    If the source model consists of huge fact tables and multiple dimension tables,
    data persistency will be required.


    Figure [2-11](#508424_1_En_2_Chapter.xhtml#Fig11) shows the architecture of a
    hybrid data model using persistent `InfoObjects`.


    ![../images/508424_1_En_2_Chapter/508424_1_En_2_Fig11_HTML.jpg](images/508424_1_En_2_Chapter/508424_1_En_2_Fig11_HTML.jpg)


    **Figure 2-11.** BW/4HANA hybrid data model with persistent `InfoObjects`


    The architecture shown in Figure [2-11](#508424_1_En_2_Chapter.xhtml#Fig11) is
    similar to the classic modeling concept (Figure [2-2](#508424_1_En_2_Chapter.xhtml#Fig2)).
    The difference is that custom `InfoObjects` (`InfoObject 1` and `InfoObject 2`)
    are loaded with data coming from the external system instead of the SAP system.
    With this approach all the `InfoObject` functionalities can be leveraged for external
    master data, and performance will not be impacted. On the other hand, development
    and maintenance require a higher effort. When analyzing the architecture shown
    in Figure [2-11](#508424_1_En_2_Chapter.xhtml#Fig11), you can ask yourself, why
    instead of creating a new model could I not simply load non-SAP data into the
    existing SAP data model structures?


    You might be thinking about the approach shown in Figure [2-12](#508424_1_En_2_Chapter.xhtml#Fig12).


    ![../images/508424_1_En_2_Chapter/508424_1_En_2_Fig12_HTML.jpg](images/508424_1_En_2_Chapter/508424_1_En_2_Fig12_HTML.jpg)


    **Figure 2-12.** BW/4HANA diagram for loading non-SAP data into the SAP data model


    The approach for including external data into the existing SAP data model has
    the following limitations:


    - The data type for external dimensions and attributes may not be consistent with
    the target `InfoObject` data type, so data loading will not be possible.

    - The data length for external dimension and attributes may not be consistent
    with the target `InfoObject` data length, so data loading will not be possible.

    - There is almost no chance that all non-SAP dimensions and their attributes could
    be incorporated into the SAP model because of the different data modeling approach
    as well as different keys, relationships, and data type definitions, which are
    specific to the given database technology.

    - Even if the source data type matches the `InfoObject` data type, there is a
    risk that the underlying non-SAP dimension table will contain the same primary
    key value as the existing SAP `InfoObject` key. If this is not properly maintained,
    external data could overwrite the SAP master data and cause a lot of reporting
    issues globally.

    - Any small deviation in source data that does not follow the `InfoObject` definition
    will cause data load failure.

    - Not all the users should be allowed to see non-SAP data; hence, the security
    model can become very complex.

    - There is a high risk that during integration, the existing global reporting
    solution will be negatively impacted.


    With all these limitations and disadvantages, we can say that there is no easy
    way to integrate external data into an existing SAP data warehouse. Nevertheless,
    we can create a new data model, which will combine SAP and non-SAP data.'
