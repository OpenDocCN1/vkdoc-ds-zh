- fmt: '基于比较，我们应确定合并数据集的目标结构和数据类型。对于公共字段，需要指定能同时支持源列类型的数据类型。仅存在于单个源中的字段的数据类型可以直接从源列继承。表[6-4](#508424_1_En_6_Chapter.xhtml#Tab4)展示了合并后的`Orders`视图的目标结构和数据类型。


    **表 6-4.** 合并订单计算视图的目标数据类型


    | `CV_FACT_ORDERS_ALL` (Orders ALL) |

    | :--- |

    | 列名 | 键 | 数据类型 |

    | --- | --- | --- |

    | `ORDER_ID` | **X** | `NVACHAR(10)` |

    | `ORDER_ITEM` | **X** | `NVARCHAR(6)` |

    | `DOC_DATE` |  | `DATE` |

    | `REQ_DATE` |  | `DATE` |

    | `SHIP_DATE` |  | `DATE` |

    | `DELV_DATE` |  | `DATE` |

    | `STATUS` |  | `VARCHAR(3)` |

    | `CUST_NUMBER` |  | `NVARCHAR(10)` |

    | `EMP_NUMBER` |  | `VARCHAR(10)` |

    | `FREE_TEXT` |  | `VARCHAR(100)` |

    | `PRODUCT_ID` |  | `NVACHAR(18)` |

    | `CATEGORY_ID` |  | `NVARCHAR(5)` |

    | `QUANTITY` |  | `DECIMAL(17,2)` |

    | `UNIT` |  | `NVARCHAR(3)` |

    | `STOR_LOC` |  | `NVARCHAR(4)` |


    基于表[6-4](#508424_1_En_6_Chapter.xhtml#Tab4)，我们现在可以实现合并后`Orders`数据的计算视图。首先，创建一个新的`CUBE`类型计算视图。然后，添加两个投影节点（用于检索
    SAP 和非 SAP 的`Orders`数据）和一个联合节点，用于将`Orders`数据合并到单个数据集中。作为定义联合节点输出结构的参考，我们可以使用表[6-4](#508424_1_En_6_Chapter.xhtml#Tab4)。图[6-25](#508424_1_En_6_Chapter.xhtml#Fig25)展示了事务性`CV_FACT_ORDERS_ALL`计算视图中联合节点的目标结构。


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig25_HTML.jpg](images/508424_1_En_6_Chapter/508424_1_En_6_Fig25_HTML.jpg)


    **图 6-25.** 在`CV_FACT_ORDERS_ALL`计算视图中定义联合节点的目标结构


    如图[6-25](#508424_1_En_6_Chapter.xhtml#Fig25)所示，`Projection_1`从`CV_FACT_ORDERS`计算视图检索数据，而`Projection_2`使用`ZADS01`计算视图作为源。它们都链接到联合节点。在屏幕右侧，可以看到根据表[6-4](#508424_1_En_6_Chapter.xhtml#Tab4)中的字段定义创建的联合节点目标结构。创建结构后，我们应该以表[6-3](#508424_1_En_6_Chapter.xhtml#Tab3)为参考来定义映射（如图[6-26](#508424_1_En_6_Chapter.xhtml#Fig26)所示）。


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig26_HTML.jpg](images/508424_1_En_6_Chapter/508424_1_En_6_Fig26_HTML.jpg)


    **图 6-26.** 在`CV_FACT_ORDERS`计算视图中为联合节点定义字段映射


    定义映射时，请确保对于每个目标字段，首先映射数据类型与目标字段相同的字段。这是因为系统将从第一个映射的列继承数据类型。


    在联合节点级别应用映射后，您可以将所有字段添加到最终聚合节点的输出中，并验证模型。显然，系统会返回一个错误，如图[6-27](#508424_1_En_6_Chapter.xhtml#Fig27)所示。


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig27_HTML.jpg](images/508424_1_En_6_Chapter/508424_1_En_6_Fig27_HTML.jpg)


    **图 6-27.** 数据类型不匹配的错误消息


    每当系统无法将源数据类型隐式转换为目标数据类型时，就会出现类似图[6-27](#508424_1_En_6_Chapter.xhtml#Fig27)所示的错误消息。您可能会注意到，当将`NVARCHAR(8)`类型的`0DOC_DATE`映射到`DATE`类型的目标列`DOC_DATE`时，系统能够隐式转换数据类型。然而，对于`QTY`列，系统无法自动将`INTEGER`数据类型转换为目标`DECIMAL`数据类型。要解决此问题，我们应创建一个计算列来显式地将`INTEGER`类型转换为`DECIMAL`数据类型。要创建计算列，请单击`Projection_1`节点，在“输出”部分右键单击“计算列”文件夹，然后选择“新建”。


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig28_HTML.jpg](images/508424_1_En_6_Chapter/508424_1_En_6_Fig28_HTML.jpg)


    **图 6-28.** 在`CV_FACT_ORDERS_ALL`计算视图中为`Quantity`字段创建计算列


    选择“新建”选项后，系统将打开计算列编辑器。您可以在此处指定要转换的列和目标数据类型。


    创建计算列时，首先需要提供其名称（1）。该名称应唯一，意味着不应存在任何同名列。在本例中，我将其命名为`CA_QTY`（图[6-29](#508424_1_En_6_Chapter.xhtml#Fig29)）。然后，您需要提供目标列的数据类型（2），此处为`DECIMAL(17,2)`。要将列转换为`DECIMAL`，我们无需应用任何转换函数，只需提供要转换的列的名称（3）。我们可以单击“验证语法”按钮以确保表达式有效，然后继续单击“确定”按钮（4）。


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig29_HTML.jpg](images/508424_1_En_6_Chapter/508424_1_En_6_Fig29_HTML.jpg)


    **图 6-29.** 在`CV_FACT_ORDERS_ALL`计算视图中指定`CA_QTY`计算列的定义


    创建计算列后，我们应该调整联合节点中的映射。我们可以通过右键单击目标列并选择“管理映射”选项来更改映射（见图[6-30](#508424_1_En_6_Chapter.xhtml#Fig30)）。


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig30_HTML.png](images/508424_1_En_6_Chapter/508424_1_En_6_Fig30_HTML.png)


    **图 6-30.** 打开`CV_FACT_ORDERS_ALL`计算视图中`Quantity`列的“管理映射”窗口


    选择“管理映射”选项后，将打开新窗口（图[6-31](#508424_1_En_6_Chapter.xhtml#Fig31)）。


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig31_HTML.png](images/508424_1_En_6_Chapter/508424_1_En_6_Fig31_HTML.png)


    **图 6-31.** `CV_FACT_ORDERS_ALL`计算视图中`Quantity`列的映射管理


    在“管理映射”窗口中，我们可以用新创建的`CA_QTY`计算列替换`QTY`列（图[6-31](#508424_1_En_6_Chapter.xhtml#Fig31)）。确认映射后，您可以验证该视图，错误应该不再出现。


    我们还需要调整另外两个映射。首先，我们需要确保事务数据对于`PRODUCT_ID`和`CATEGORY_ID`的组合具有相同的值，这两个字段是合并后的产品维度的主键。基于这些关键字段值，我们稍后将与产品
    Open ODS 视图对象建立关联；因此，我们需要确保键值匹配。这就是为什么我们需要用`00000`值替换`CATEGORY_ID`字段中的`NULL`值，正如我们在产品计算视图中所做的那样（遵循图[6-15](#508424_1_En_6_Chapter.xhtml#Fig15)所示的相同配置）。'
  raw: 'As we already know, based on the comparison, we should identify the target
    structure and data types for the combined dataset. For common fields, we need
    to specify the data type that will support both the source column types. Data
    types for fields that are specific only for single source can be inherited directly
    from the source column. Table [6-4](#508424_1_En_6_Chapter.xhtml#Tab4) presents
    the target structure and data types for the consolidated Orders view.


    Table 6-4.


    Target Data Types for Combined Orders Calculation View


    | CV_FACT_ORDERS_ALL (Orders ALL) |

    | --- |

    | Column Name | Key | Data Type |

    | --- | --- | --- |

    | ORDER_ID | **X** | NVACHAR(10) |

    | ORDER_ITEM | **X** | NVARCHAR(6) |

    | DOC_DATE |   | DATE |

    | REQ_DATE |   | DATE |

    | SHIP_DATE |   | DATE |

    | DELV_DATE |   | DATE |

    | STATUS |   | VARCHAR(3) |

    | CUST_NUMBER |   | NVARCHAR(10) |

    | EMP_NUMBER |   | VARCHAR(10) |

    | FREE_TEXT |   | VARCHAR(100) |

    | PRODUCT_ID |   | NVACHAR(18) |

    | CATEGORY_ID |   | NVARCHAR(5) |

    | QUANTITY |   | DECIMAL(17,2) |

    | UNIT |   | NVARCHAR(3) |

    | STOR_LOC |   | NVARCHAR(4) |


    Based on Table [6-4](#508424_1_En_6_Chapter.xhtml#Tab4), we can now implement
    the calculation view for the consolidated Orders data. To start, we should first
    create a new calculation view of the CUBE type. Then we should add two Projection
    nodes (for retrieving SAP and non-SAP Orders data) and a Union node for merging
    the Orders data into a single dataset. As a reference for defining the output
    structure of the Union node, we can use Table [6-4](#508424_1_En_6_Chapter.xhtml#Tab4).
    Figure [6-25](#508424_1_En_6_Chapter.xhtml#Fig25) presents the target structure
    of the Union node for the transactional CV_FACT_ORDERS_ALL calculation view.


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig25_HTML.jpg](images/508424_1_En_6_Chapter/508424_1_En_6_Fig25_HTML.jpg)


    Figure 6-25.


    Defining the target structure of the Union node in the CV_FACT_ORDERS_ALL calculation
    view


    As shown in Figure [6-25](#508424_1_En_6_Chapter.xhtml#Fig25), Projection_1 retrieves
    data from the CV_FACT_ORDERS calculation view, while Projection_2 uses the ZADS01
    calculation view as a source. They are linked to the Union node. On the right
    side of the screen, you can see the target structure of the Union node that was
    created according to the field definitions in Table [6-4](#508424_1_En_6_Chapter.xhtml#Tab4).
    After creating the structure, we should define the mappings using Table [6-3](#508424_1_En_6_Chapter.xhtml#Tab3)
    as a reference (Figure [6-26](#508424_1_En_6_Chapter.xhtml#Fig26)).


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig26_HTML.jpg](images/508424_1_En_6_Chapter/508424_1_En_6_Fig26_HTML.jpg)


    Figure 6-26.


    Defining a fields mapping for the Union node in the CV_FACT_ORDERS calculation
    view


    When defining the mapping, make sure that for each target field, you first map
    the field with the same data type as the target one. This is because the system
    will inherit the data type from the column that was mapped as the first one.


    After applying the mappings on the Union node level, you can add all the fields
    to the output of the final Aggregation node and validate the model. Apparently
    the system will return an error, as in Figure [6-27](#508424_1_En_6_Chapter.xhtml#Fig27).


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig27_HTML.jpg](images/508424_1_En_6_Chapter/508424_1_En_6_Fig27_HTML.jpg)


    Figure 6-27.


    Error message for data type mismatch


    An error message similar to the one shown in Figure [6-27](#508424_1_En_6_Chapter.xhtml#Fig27)
    occurs every time the system is not able to implicitly convert the source data
    type to the target one. You might notice that when mapping the 0DOC_DATE of NVARCHAR(8)
    to the target DOC_DATE column of the DATE type, the system was able to implicitly
    convert the data type. However, for the QTY column, the system was not able to
    automatically convert the INTEGER data type to the target DECIMAL data type. To
    resolve this issue, we should create a calculated column to explicitly convert
    an INTEGER type into the DECIMAL data type. To create a calculated column, click
    the Projection_1 node and in the Output section right-click Calculated Columns
    folder and select New.


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig28_HTML.jpg](images/508424_1_En_6_Chapter/508424_1_En_6_Fig28_HTML.jpg)


    Figure 6-28.


    Creating a calculated column for the Quantity field in the CV_FACT_ORDERS_ALL
    calculation view


    After selecting the New option, the system will open the Calculated Column editor.
    Here you can specify the column that you want to convert and the target data type.


    When creating a calculated column, first you need to provide its name (1). It
    should be unique, meaning that there should not be any column with the same name
    already in existence. In my case, I named it CA_QTY (Figure [6-29](#508424_1_En_6_Chapter.xhtml#Fig29)).
    Then you need to provide the target column data type (2), which in our case is
    DECIMAL(17,2). To convert the column to DECIMAL, we do not need to apply any conversion
    function, but simply provide the name of the column that we want to convert (3).
    We can click the Validate Syntax button to make sure that the expression is valid,
    and then we can proceed by clicking the OK button (4).


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig29_HTML.jpg](images/508424_1_En_6_Chapter/508424_1_En_6_Fig29_HTML.jpg)


    Figure 6-29.


    Specifying the definition of the CA_QTY calculated column in the CV_FACT_ORDERS_ALL
    calculation view


    Once we create the calculated column, we should adjust the mapping in the Union
    node. We can change the mappings by right-clicking the target column and selecting
    the *Manage Mappings* option (see Figure [6-30](#508424_1_En_6_Chapter.xhtml#Fig30)).


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig30_HTML.png](images/508424_1_En_6_Chapter/508424_1_En_6_Fig30_HTML.png)


    Figure 6-30.


    Opening the Manage Mappings window for the Quantity column’s CV_FACT_ORDERS_ALL
    calculation view


    After selecting the *Manage Mappings* option, the new window will open (Figure
    [6-31](#508424_1_En_6_Chapter.xhtml#Fig31)).


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig31_HTML.png](images/508424_1_En_6_Chapter/508424_1_En_6_Fig31_HTML.png)


    Figure 6-31.


    Manage Mappings for Quantity column in the CV_FACT_ORDERS_ALL calculation view


    In the Manage Mappings window, we can replace the QTY column with the newly created
    CA_QTY calculated column (Figure [6-31](#508424_1_En_6_Chapter.xhtml#Fig31)).
    After confirming the mappings, you can validate the view, and the error should
    not appear anymore.


    There are two additional mappings that we should adjust. First, we need to ensure
    that transactional data will have the same values for the combination of PRODUCT_ID
    and CATEGORY_ID, which are the primary keys of the consolidated Product dimension.
    Based on these key field values, we will later apply an association with the Product
    Open ODS View object; hence, we need to ensure that key values will be matching.
    This is the reason why we need to replace NULLs with 00000 values for the CATEGORY_ID
    field, the same as we did in the Product calculation view (follow the same configuration
    as shown in Figure [6-15](#508424_1_En_6_Chapter.xhtml#Fig15)).'
  trans: '

    基于比较，我们应确定合并数据集的目标结构和数据类型。对于公共字段，需要指定能同时支持源列类型的数据类型。仅存在于单个源中的字段的数据类型可以直接从源列继承。表
    6-4 展示了合并后的`Orders`视图的目标结构和数据类型。


    **表 6-4.** 合并订单计算视图的目标数据类型


    | `CV_FACT_ORDERS_ALL` (Orders ALL) |

    | :--- |

    | 列名 | 键 | 数据类型 |

    | --- | --- | --- |

    | `ORDER_ID` | **X** | `NVACHAR(10)` |

    | `ORDER_ITEM` | **X** | `NVARCHAR(6)` |

    | `DOC_DATE` |  | `DATE` |

    | `REQ_DATE` |  | `DATE` |

    | `SHIP_DATE` |  | `DATE` |

    | `DELV_DATE` |  | `DATE` |

    | `STATUS` |  | `VARCHAR(3)` |

    | `CUST_NUMBER` |  | `NVARCHAR(10)` |

    | `EMP_NUMBER` |  | `VARCHAR(10)` |

    | `FREE_TEXT` |  | `VARCHAR(100)` |

    | `PRODUCT_ID` |  | `NVACHAR(18)` |

    | `CATEGORY_ID` |  | `NVARCHAR(5)` |

    | `QUANTITY` |  | `DECIMAL(17,2)` |

    | `UNIT` |  | `NVARCHAR(3)` |

    | `STOR_LOC` |  | `NVARCHAR(4)` |


    基于表 6-4，我们现在可以实现合并后`Orders`数据的计算视图。首先，创建一个新的`CUBE`类型计算视图。然后，添加两个投影节点（用于检索 SAP
    和非 SAP 的`Orders`数据）和一个联合节点，用于将`Orders`数据合并到单个数据集中。作为定义联合节点输出结构的参考，我们可以使用表 6-4。图
    6-25 展示了事务性`CV_FACT_ORDERS_ALL`计算视图中联合节点的目标结构。


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig25_HTML.jpg](img/508424_1_En_6_Fig25_HTML.jpg)


    **图 6-25.** 在`CV_FACT_ORDERS_ALL`计算视图中定义联合节点的目标结构


    如图 6-25 所示，`Projection_1`从`CV_FACT_ORDERS`计算视图检索数据，而`Projection_2`使用`ZADS01`计算视图作为源。它们都链接到联合节点。在屏幕右侧，可以看到根据表
    6-4 中的字段定义创建的联合节点目标结构。创建结构后，我们应该以表 6-3 为参考来定义映射（如图 6-26 所示）。


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig26_HTML.jpg](img/508424_1_En_6_Fig26_HTML.jpg)


    **图 6-26.** 在`CV_FACT_ORDERS`计算视图中为联合节点定义字段映射


    定义映射时，请确保对于每个目标字段，首先映射数据类型与目标字段相同的字段。这是因为系统将从第一个映射的列继承数据类型。


    在联合节点级别应用映射后，您可以将所有字段添加到最终聚合节点的输出中，并验证模型。显然，系统会返回一个错误，如图 6-27 所示。


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig27_HTML.jpg](img/508424_1_En_6_Fig27_HTML.jpg)


    **图 6-27.** 数据类型不匹配的错误消息


    每当系统无法将源数据类型隐式转换为目标数据类型时，就会出现类似图 6-27 所示的错误消息。您可能会注意到，当将`NVARCHAR(8)`类型的`0DOC_DATE`映射到`DATE`类型的目标列`DOC_DATE`时，系统能够隐式转换数据类型。然而，对于`QTY`列，系统无法自动将`INTEGER`数据类型转换为目标`DECIMAL`数据类型。要解决此问题，我们应创建一个计算列来显式地将`INTEGER`类型转换为`DECIMAL`数据类型。要创建计算列，请单击`Projection_1`节点，在“输出”部分右键单击“计算列”文件夹，然后选择“新建”。


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig28_HTML.jpg](img/508424_1_En_6_Fig28_HTML.jpg)


    **图 6-28.** 在`CV_FACT_ORDERS_ALL`计算视图中为`Quantity`字段创建计算列


    选择“新建”选项后，系统将打开计算列编辑器。您可以在此处指定要转换的列和目标数据类型。


    创建计算列时，首先需要提供其名称（1）。该名称应唯一，意味着不应存在任何同名列。在本例中，我将其命名为`CA_QTY`（图 6-29）。然后，您需要提供目标列的数据类型（2），此处为`DECIMAL(17,2)`。要将列转换为`DECIMAL`，我们无需应用任何转换函数，只需提供要转换的列的名称（3）。我们可以单击“验证语法”按钮以确保表达式有效，然后继续单击“确定”按钮（4）。


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig29_HTML.jpg](img/508424_1_En_6_Fig29_HTML.jpg)


    **图 6-29.** 在`CV_FACT_ORDERS_ALL`计算视图中指定`CA_QTY`计算列的定义


    创建计算列后，我们应该调整联合节点中的映射。我们可以通过右键单击目标列并选择“管理映射”选项来更改映射（见图 6-30）。


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig30_HTML.png](img/508424_1_En_6_Fig30_HTML.png)


    **图 6-30.** 打开`CV_FACT_ORDERS_ALL`计算视图中`Quantity`列的“管理映射”窗口


    选择“管理映射”选项后，将打开新窗口（图 6-31）。


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig31_HTML.png](img/508424_1_En_6_Fig31_HTML.png)


    **图 6-31.** `CV_FACT_ORDERS_ALL`计算视图中`Quantity`列的映射管理


    在“管理映射”窗口中，我们可以用新创建的`CA_QTY`计算列替换`QTY`列（图 6-31）。确认映射后，您可以验证该视图，错误应该不再出现。


    我们还需要调整另外两个映射。首先，我们需要确保事务数据对于`PRODUCT_ID`和`CATEGORY_ID`的组合具有相同的值，这两个字段是合并后的产品维度的主键。基于这些关键字段值，我们稍后将与产品
    Open ODS 视图对象建立关联；因此，我们需要确保键值匹配。这就是为什么我们需要用`00000`值替换`CATEGORY_ID`字段中的`NULL`值，正如我们在产品计算视图中所做的那样（遵循图
    6-15 所示的相同配置）。

    '
- fmt: 'The second adjustment could be applied for the `UNIT` column. For non-SAP
    data, this column is also not maintained, but since in our scenario, the order
    quantity always refers to the number of items, we can assign `EA` (each) as a
    constant value (Figure [6-32](#508424_1_En_6_Chapter.xhtml#Fig32)).


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig32_HTML.jpg](images/508424_1_En_6_Chapter/508424_1_En_6_Fig32_HTML.jpg)


    Figure 6-32. Manage Mappings for Unit column in the `CV_FACT_ORDERS_ALL` calculation
    view


    By ensuring valid unit values for all the records, we will be able to utilize
    the `UNIT` column as the unit element for the Order Quantity key figure at the
    Open ODS View level. Thanks to that, during reporting, users will be able to see
    key figure values with the unit assigned. After applying all the adjustments,
    we can activate the calculation view and run the data preview.


    The data preview (Figure [6-33](#508424_1_En_6_Chapter.xhtml#Fig33)) returns the
    combined view for the Orders transactional data. Now we can build the Facts Open
    ODS View object on top of the combined dataset.


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig33_HTML.jpg](images/508424_1_En_6_Chapter/508424_1_En_6_Fig33_HTML.jpg)


    Figure 6-33. Data preview of the `CV_FACT_ORDERS_ALL` calculation view


    ## Create a Combined Facts Open ODS View for Orders


    On top of the combined calculation view for the Orders data (`CV_FACT_ORDERS_ALL`),
    we will create a Facts Open ODS View object. This requires the same steps we followed
    for the Master Data Open ODS View, so let’s now create the Facts Open ODS View
    for Orders.


    Figure [6-34](#508424_1_En_6_Chapter.xhtml#Fig34) shows the initial setup for
    the consolidated Facts Open ODS View for Orders. The primary key of the Orders
    data consists of the `ORDER_ID` and `ORDER_ITEM` columns; hence, they are added
    to the *Characteristics (Key)* section (1). The underlying calculation view contains
    one measure, which is `QUANTITY`. This measure is added to the *Key Figures* section
    (2). The `UNIT` column goes into the dedicated *Unit* folder (3). The remaining
    fields are assigned to the *Characteristics* section (4).


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig34_HTML.jpg](images/508424_1_En_6_Chapter/508424_1_En_6_Fig34_HTML.jpg)


    Figure 6-34. Initial output structure of the consolidated Orders (`ZINTFCT01`)
    Open ODS View


    After the initial distribution of fields between specific folders, we can now
    implement additional enhancements. Our target is to build the star schema model
    by applying an association with Master Data objects. The main Master Data object
    in our data model is the Product (`ZINTMD01`) dimension, which we created in the
    previous section. Let’s now apply an association between the Orders transactional
    data and the Product dimension (Figure [6-35](#508424_1_En_6_Chapter.xhtml#Fig35)).


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig35_HTML.jpg](images/508424_1_En_6_Chapter/508424_1_En_6_Fig35_HTML.jpg)


    Figure 6-35. Association for the Product field in the `ZINTFCT01` Open ODS View
    object


    The `PRODUCT_ID` field was set as the Representative Key Field of the `ZINTMD01`
    Products (ALL) dimension. To apply an association to `ZINTMD01`, we should select
    the `PRODUCT_ID` field from the View Fields section of the `ZINTFCT01` Open ODS
    View (1). Then we need to click Browse (2) for the Product (`ZINTMD01`) dimension
    and set the Direct Association option (3). As you remember, the Product dimension
    consists of the compounding key based on `PRODUCT_ID` and `CATEGORY_ID`. To assign
    the Product dimension correctly, we need to use both columns for the association.
    As mentioned in the previous section, the compounding keys should always contain
    the association. This is why when defining the Product dimension, we assigned
    the `ZTXT02` Open ODS View to `CATEGORY_ID` (Figure [6-19](#508424_1_En_6_Chapter.xhtml#Fig19)).
    To complete the association to the Product dimension, we need to first assign
    the `ZTXT02` Open ODS View to the `CATEGORY_ID` field (Figure [6-36](#508424_1_En_6_Chapter.xhtml#Fig36)).


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig36_HTML.jpg](images/508424_1_En_6_Chapter/508424_1_En_6_Fig36_HTML.jpg)


    Figure 6-36. Association for the Category field in the `ZINTFCT01` Open ODS View
    object


    Once we apply an association for the `CATEGORY_ID` field, we can complete the
    association with the Product (`ZINTMD01`) dimension (see Figure [6-37](#508424_1_En_6_Chapter.xhtml#Fig37)).


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig37_HTML.png](images/508424_1_En_6_Chapter/508424_1_En_6_Fig37_HTML.png)


    Figure 6-37. Defining the compounding for the Product field in the `ZINTFCT01`
    Open ODS View object


    To complete the association with the Product dimension, select the `PRODUCT_ID`
    field (1) and click the *Compounding* button (2). In the *Compounding* window,
    we can specify the target field for Compounding. In the drop-down list, we will
    have only one column available (3). Without applying an association between the
    `CATEGORY_ID` field and `ZTXT02` Open ODS View object, the drop-down list would
    be empty, and we would not be able to apply an association. After configuring
    the association, we can enable the navigation attributes of the Product dimension
    (Figure [6-38](#508424_1_En_6_Chapter.xhtml#Fig38)).'
  raw: 'The second adjustment could be applied for the UNIT column. For non-SAP data,
    this column is also not maintained, but since in our scenario, the order quantity
    always refers to the number of items, we can assign EA (each) as a constant value
    (Figure [6-32](#508424_1_En_6_Chapter.xhtml#Fig32)).


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig32_HTML.jpg](images/508424_1_En_6_Chapter/508424_1_En_6_Fig32_HTML.jpg)


    Figure 6-32.


    Manage Mappings for Unit column in the CV_FACT_ORDERS_ALL calculation view


    By ensuring valid unit values for all the records, we will be able to utilize
    the UNIT column as the unit element for the Order Quantity key figure at the Open
    ODS View level. Thanks to that, during reporting, users will be able to see key
    figure values with the unit assigned. After applying all the adjustments, we can
    activate the calculation view and run the data preview.


    The data preview (Figure [6-33](#508424_1_En_6_Chapter.xhtml#Fig33)) returns the
    combined view for the Orders transactional data. Now we can build the Facts Open
    ODS View object on top of the combined dataset.


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig33_HTML.jpg](images/508424_1_En_6_Chapter/508424_1_En_6_Fig33_HTML.jpg)


    Figure 6-33.


    Data preview of the CV_FACT_ORDERS_ALL calculation view


    ## Create a Combined Facts Open ODS View for Orders


    On top of the combined calculation view for the Orders data (CV_FACT_ORDERS_ALL),
    we will create a Facts Open ODS View object. This requires the same steps we followed
    for the Master Data Open ODS View, so let’s now create the Facts Open ODS View
    for Orders.


    Figure [6-34](#508424_1_En_6_Chapter.xhtml#Fig34) shows the initial setup for
    the consolidated Facts Open ODS View for Orders. The primary key of the Orders
    data consists of the ORDER_ID and ORDER_ITEM columns; hence, they are added to
    the *Characteristics (Key)* section (1). The underlying calculation view contains
    one measure, which is QUANTITY. This measure is added to the *Key Figures* section
    (2). The UNIT column goes into the dedicated *Unit* folder (3). The remaining
    fields are assigned to the *Characteristics* section (4).


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig34_HTML.jpg](images/508424_1_En_6_Chapter/508424_1_En_6_Fig34_HTML.jpg)


    Figure 6-34.


    Initial output structure of the consolidated Orders (ZINTFCT01) Open ODS View


    After the initial distribution of fields between specific folders, we can now
    implement additional enhancements. Our target is to build the star schema model
    by applying an association with Master Data objects. The main Master Data object
    in our data model is the Product (ZINTMD01) dimension, which we created in the
    previous section. Let’s now apply an association between the Orders transactional
    data and the Product dimension (Figure [6-35](#508424_1_En_6_Chapter.xhtml#Fig35)).


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig35_HTML.jpg](images/508424_1_En_6_Chapter/508424_1_En_6_Fig35_HTML.jpg)


    Figure 6-35.


    Association for the Product field in the ZINTFCT01 Open ODS View object


    The PRODUCT_ID field was set as the Representative Key Field of the ZINTMD01 Products
    (ALL) dimension. To apply an association to ZINTMD01, we should select the PRODUCT_ID
    field from the View Fields section of the ZINTFCT01 Open ODS View (1). Then we
    need to click Browse (2) for the Product (ZINTMD01) dimension and set the Direct
    Association option (3). As you remember, the Product dimension consists of the
    compounding key based on PRODUCT_ID and CATEGORY_ID. To assign the Product dimension
    correctly, we need to use both columns for the association. As mentioned in the
    previous section, the compounding keys should always contain the association.
    This is why when defining the Product dimension, we assigned the ZTXT02 Open ODS
    View to CATEGORY_ID (Figure [6-19](#508424_1_En_6_Chapter.xhtml#Fig19)). To complete
    the association to the Product dimension, we need to first assign the ZTXT02 Open ODS
    View to the CATEGORY_ID field (Figure [6-36](#508424_1_En_6_Chapter.xhtml#Fig36)).


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig36_HTML.jpg](images/508424_1_En_6_Chapter/508424_1_En_6_Fig36_HTML.jpg)


    Figure 6-36.


    Association for the Category field in the ZINTFCT01 Open ODS View object


    Once we apply an association for the CATEGORY_ID field, we can complete the association
    with the Product (ZINTMD01) dimension (see Figure [6-37](#508424_1_En_6_Chapter.xhtml#Fig37)).


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig37_HTML.png](images/508424_1_En_6_Chapter/508424_1_En_6_Fig37_HTML.png)


    Figure 6-37.


    Defining the compounding for the Product field in the ZINTFCT01 Open ODS View
    object


    To complete the association with the Product dimension, select the PRODUCT_ID
    field (1) and click the *Compounding* button (2). In the *Compounding* window,
    we can specify the target field for Compounding. In the drop-down list, we will
    have only one column available (3). Without applying an association between the
    CATEGORY_ID field and ZTXT02 Open ODS View object, the drop-down list would be
    empty, and we would not be able to apply an association. After configuring the
    association, we can enable the navigation attributes of the Product dimension
    (Figure [6-38](#508424_1_En_6_Chapter.xhtml#Fig38)).'
  trans: '

    第二个调整可应用于`UNIT`列。对于非 SAP 数据，该列同样未进行维护，但由于在我们的场景中，订单数量始终指向物料个数，因此我们可以将`EA`（个）作为常量值进行分配（图
    6-32）。


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig32_HTML.jpg](img/508424_1_En_6_Fig32_HTML.jpg)


    图 6-32. 在`CV_FACT_ORDERS_ALL`计算视图中管理`UNIT`列的映射


    通过确保所有记录的单位值有效，我们就能在开放 ODS 视图层将`UNIT`列作为订单数量关键指标的单位元素使用。这样一来，用户在报表中就能看到带单位的关键指标值。完成所有调整后，我们可以激活计算视图并运行数据预览。


    数据预览（图 6-33）返回了订单事务数据的合并视图。现在我们可以基于合并后的数据集构建事实开放 ODS 视图对象。


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig33_HTML.jpg](img/508424_1_En_6_Fig33_HTML.jpg)


    图 6-33. `CV_FACT_ORDERS_ALL`计算视图的数据预览


    ## 为订单创建合并事实开放 ODS 视图


    在订单数据的合并计算视图（`CV_FACT_ORDERS_ALL`）之上，我们将创建一个事实开放 ODS 视图对象。这需要遵循与主数据开放 ODS 视图相同的步骤，现在开始为订单创建事实开放
    ODS 视图。


    图 6-34 展示了订单合并非开放事实 ODS 视图的初始设置。订单数据的主键由`ORDER_ID`和`ORDER_ITEM`列组成，因此它们被添加到*特征（键）*区域（1）。底层计算视图包含一个度量，即`QUANTITY`，该度量被添加到*关键指标*区域（2）。`UNIT`列放入专用的*单位*文件夹（3）。剩余字段分配到*特征*区域（4）。


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig34_HTML.jpg](img/508424_1_En_6_Fig34_HTML.jpg)


    图 6-34. 合并订单（`ZINTFCT01`）开放 ODS 视图的初始输出结构


    在字段初步分配到各个文件夹之后，我们现在可以实施额外的增强。我们的目标是通过与主数据对象建立关联来构建星型模式模型。我们数据模型中的主要主数据对象是上一节创建的产品（`ZINTMD01`）维度。现在让我们在订单事务数据与产品维度之间建立关联（图
    6-35）。


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig35_HTML.jpg](img/508424_1_En_6_Fig35_HTML.jpg)


    图 6-35. `ZINTFCT01`开放 ODS 视图对象中产品字段的关联


    `PRODUCT_ID`字段被设置为`ZINTMD01`产品（全部）维度的代表性关键字段。要与`ZINTMD01`建立关联，我们应从`ZINTFCT01`开放
    ODS 视图的视图字段部分选择`PRODUCT_ID`字段（1）。然后需要点击产品（`ZINTMD01`）维度的浏览按钮（2），并设置直接关联选项（3）。如您所知，产品维度由基于`PRODUCT_ID`和`CATEGORY_ID`的复合键组成。要正确分配产品维度，我们需要在关联中使用这两列。如上一节所述，复合键应始终包含关联。这就是为什么在定义产品维度时，我们将`ZTXT02`开放
    ODS 视图分配给`CATEGORY_ID`（图 6-19）。为了完成与产品维度的关联，我们首先需要将`ZTXT02`开放 ODS 视图分配给`CATEGORY_ID`字段（图
    6-36）。


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig36_HTML.jpg](img/508424_1_En_6_Fig36_HTML.jpg)


    图 6-36. `ZINTFCT01`开放 ODS 视图对象中类别字段的关联


    一旦我们为`CATEGORY_ID`字段建立了关联，就可以完成与产品（`ZINTMD01`）维度的关联（参见图 6-37）。


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig37_HTML.png](img/508424_1_En_6_Fig37_HTML.png)


    图 6-37. 在`ZINTFCT01`开放 ODS 视图对象中定义产品字段的复合


    要完成与产品维度的关联，选择`PRODUCT_ID`字段（1）并点击*复合*按钮（2）。在*复合*窗口中，我们可以指定复合的目标字段。在下拉列表中，我们只会看到一个可用列（3）。如果不在`CATEGORY_ID`字段和`ZTXT02`开放
    ODS 视图对象之间建立关联，下拉列表将是空的，我们也就无法应用关联。配置完关联后，我们可以启用产品维度的导航属性（图 6-38）。

    '
- fmt: '![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig38_HTML.jpg](images/508424_1_En_6_Chapter/508424_1_En_6_Fig38_HTML.jpg)


    Figure 6-38. Selecting the navigation attributes for the ZINTFCT01 Open ODS View
    object


    To enable the Product navigation attributes, select the `PRODUCT_ID` column (1),
    and from the Properties section click the *Navigation Attributes* button (2).
    In the *Navigation Attributes* window, select the attributes (3) and confirm the
    action by clicking the *OK* button (4).


    To complete the configuration of the `ZINTFCT01` Open ODS View object, we should
    adjust the descriptions to make them meaningful to end users. Additionally, we
    can apply associations for some other fields, as shown in Figure [6-39](#508424_1_En_6_Chapter.xhtml#Fig39).


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig39_HTML.jpg](images/508424_1_En_6_Chapter/508424_1_En_6_Fig39_HTML.jpg)


    Figure 6-39. Final output structure of the Orders (`ZINTFCT01`) Open ODS View


    As presented in Figure [6-39](#508424_1_En_6_Chapter.xhtml#Fig39), the descriptions
    for all the fields were adjusted. The trailing “EXT” and “SAP” description prefixes
    enable us to easily identify whether the field is specific only for the external
    data source or for SAP data only. The fields `DOC_DATE`, `SHIP_DATE`, and `UNIT`
    were associated with the standard SAP InfoObjects `0DOC_DATE`, `0SHIP_DATE`, and
    `0PO_UNIT` accordingly.


    The last enhancement that will be performed is to set the Unit Element property
    for the Quantity Ordered key figure (Figure [6-40](#508424_1_En_6_Chapter.xhtml#Fig40)).


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig40_HTML.png](images/508424_1_En_6_Chapter/508424_1_En_6_Fig40_HTML.png)


    Figure 6-40. Assigning the Unit element for the Quantity Ordered field in the
    ZINTFCT01 Open ODS View object


    When opening the properties of the `QUANTITY` field (1), we can specify the unit
    element for the measure (2). From the drop-down, we will be able to select the
    field that was assigned to the *Unit* section. If there is no field in that section,
    the drop-down list will be empty. After the activation of the `ZINTFCT01` Open
    ODS View object, we can validate the results (Figure [6-41](#508424_1_En_6_Chapter.xhtml#Fig41)).


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig41_HTML.jpg](images/508424_1_En_6_Chapter/508424_1_En_6_Fig41_HTML.jpg)


    Figure 6-41. Final output of the `ZINTFCT01` object in Analysis for Microsoft
    Excel


    As presented in Figure [6-41](#508424_1_En_6_Chapter.xhtml#Fig41), the SAP and
    non-SAP orders are now combined into a single dataset. Thanks to the proper association
    with the Product dimension, users are able to see the product names instead of
    the numbers. The prefixes in the column headers help us to understand if the column
    is SAP or non-SAP-specific. The Quantity Ordered measure displays the quantity
    values with the unit of measure.


    ## Create a CompositeProvider for the Consolidated Open ODS view


    To utilize the navigation attributes of the Orders data model, we will create
    a final `CompositeProvider` object on top of the Orders ALL (`ZINTFCT01`) Open
    ODS View object. Figure [6-42](#508424_1_En_6_Chapter.xhtml#Fig42) presents the
    structure of the Orders (`ZCPINTFCT01`) `CompositeProvider` object.


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig42_HTML.jpg](images/508424_1_En_6_Chapter/508424_1_En_6_Fig42_HTML.jpg)


    Figure 6-42. Defining the structure of the `ZCPINTFCT01` `CompositeProvider` object


    The `ZCPINTFCT01` `CompositeProvider` object sources data from the Orders (ALL)
    Open ODS View object that was created in the previous section. All the fields
    have been mapped from the source into the target. To show the available navigation
    attributes, in the *Source* section right-click the Open ODS View icon and select
    *Show Unassigned Navigation Attributes* (Figure [6-43](#508424_1_En_6_Chapter.xhtml#Fig43)).


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig43_HTML.jpg](images/508424_1_En_6_Chapter/508424_1_En_6_Fig43_HTML.jpg)


    Figure 6-43. Show Unassigned Navigation Attributes menu item for the `ZCPINTFCT01`
    `CompositeProvider` object


    After selecting the option shown in Figure [6-43](#508424_1_En_6_Chapter.xhtml#Fig43),
    we will be able to add Product attributes to the output of the `CompositeProvider`
    object. Optionally we could enable navigation attributes directly from the `CompositeProvider`
    object’s Output tab (see Figure [4-23](#508424_1_En_4_Chapter.xhtml#Fig23) as
    a reference). Figure [6-44](#508424_1_En_6_Chapter.xhtml#Fig44) presents the final
    mapping for the `ZCPINTFCT01` `CompositeProvider` object including the Product
    navigation attributes.


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig44_HTML.jpg](images/508424_1_En_6_Chapter/508424_1_En_6_Fig44_HTML.jpg)


    Figure 6-44. Final structure of the `ZCPINTFCT01` `CompositeProvider` object


    Figure [6-44](#508424_1_En_6_Chapter.xhtml#Fig44) presents the target mapping
    for the `ZCPINTFCT01` `CompositeProvider` object. For the navigation attribute
    descriptions, it is good to include the information about the source object from
    which the column was retrieved. This is why the description for the Product navigation
    attributes were adjusted; i.e., `(EXT) Brand` was changed to `(EXT) Product –
    Brand`. This will help the end user to identify that this information comes from
    the master data of the Product dimension and not from transactional data. After
    activating the `CompositeProvider` object, we can create the final query (Figure
    [6-45](#508424_1_En_6_Chapter.xhtml#Fig45)).


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig45_HTML.jpg](images/508424_1_En_6_Chapter/508424_1_En_6_Fig45_HTML.jpg)


    Figure 6-45. Definition of the `ZCPINTFCT01_Q01` query


    In the final query, we defined the target structure of the report. The Quantity
    Ordered measure was added to the *Columns* section. All the attributes were added
    to the *Free Characteristics section* (Figure [6-45](#508424_1_En_6_Chapter.xhtml#Fig45)).
    Finally, to validate the report, we will open it in the Analysis for Microsoft
    Excel tool.


    First, when we open the report, we can see that thanks to the prefixes that we
    added for the descriptions, the fields are sorted (Figure [6-46](#508424_1_En_6_Chapter.xhtml#Fig46)).
    The end user can easily identify fields that are relevant for one or another data
    source. The fields that are common for both sources are shown at the bottom of
    the list without prefixes. To validate the content of the report, we can add selected
    fields to the output of the crosstab (Figure [6-47](#508424_1_En_6_Chapter.xhtml#Fig47)).


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig47_HTML.jpg](images/508424_1_En_6_Chapter/508424_1_En_6_Fig47_HTML.jpg)


    Figure 6-47. Output of the `ZCPINTFCT01_Q01` query in Analysis for Microsoft Excel


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig46_HTML.jpg](images/508424_1_En_6_Chapter/508424_1_En_6_Fig46_HTML.jpg)


    Figure 6-46. Display list of fields for the `ZCPINTFCT01_Q01` query in Analysis
    for Microsoft Excel


    Figure [6-47](#508424_1_En_6_Chapter.xhtml#Fig47) shows the output of the `ZCPINTFCT01_Q01`
    for the selected fields. The fields that are relevant only for the specific data
    source contain the source system prefix in the header name. This informs us that
    for the given column the data will be available only for the specific system.
    If values are not available, there will be hash (`#`) symbol displayed. In addition,
    the Product - Source System column helps to identify or filter the Products from
    specific source system. This report enables us to perform a detailed analysis
    of all the orders across the company, no matter if they are coming from SAP or
    from the external system.'
