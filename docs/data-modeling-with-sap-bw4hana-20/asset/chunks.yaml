  trans: '

    ### 在表函数之上创建计算视图


    接下来，我们需要在 `TF_ORDER_HEADER` 表函数之上创建一个计算视图。我创建了一个名为 `CV_ORDER_HEADER_TF` 的 CUBE
    类型新计算视图。在此步骤中，重点是正确管理输入参数映射。将表函数添加为计算视图的数据源后，我们可以在语义节点中管理此映射。要将表函数输入参数映射到最终计算视图的目标参数，请点击语义节点，然后转到
    **参数/变量** 选项卡。之后，点击输入参数“管理映射”按钮旁的箭头符号，并选择 **数据源** 选项（图 3-41）。


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig41_HTML.png](img/508424_1_En_3_Fig41_HTML.png)


    图 3-41. 打开输入参数映射窗口


    **数据源** 按钮会打开一个新窗口，用于管理源与目标之间的参数映射。这里我们有一个选项，可以根据底层表函数中可用的参数自动创建输入参数。通过点击 **按名称自动映射**
    按钮（图 3-42），所有输入参数将被自动重新创建并映射到源参数。图 3-42 展示了 `TF_ORDER_HEADER` 表函数与 `CV_ORDER_HEADER_TF`
    计算视图之间的参数映射。


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig42_HTML.jpg](img/508424_1_En_3_Fig42_HTML.jpg)


    图 3-42. 管理 `CV_ORDER_HEADER_TF` 计算视图的输入参数映射


    **按名称自动映射** 功能会创建与源对象中技术名称相同的输入参数。此外，源与目标之间的映射会被自动管理。如果需要，我们可以随后调整所创建参数的属性。定义好映射和计算视图输出结构之后，就可以进行激活了。之后，值得测试一下新创建视图的输入参数。数据预览应该会显示一个提示，包含两个输入参数（`IP_LANGU`
    和 `IP_CALENDAR`）。`CM_DELV_DATE_DIFF_WD` 和 `STATUS_DESC` 列的结果应根据输入值的变化而改变。


    ### 更新订单标题复合提供者的源计算视图


    下一步，我们需要更新 BW/4HANA 对象。如果我们希望保持现有报表的当前形式，可以创建一个新的复合提供者和查询，但在我们的场景中，我们想要更新现有的 BW
    对象。这意味着对于 `ZCPEXT02` 复合提供者，我们需要将源 `CV_ORDER_HEADER` 计算视图替换为新创建的 `CV_ORDER_HEADER_TF`
    视图。


    要调整 `ZCPEXT02` 复合提供者的源视图，请打开该对象并切换到 **场景** 选项卡。然后悬停在现有的计算视图上，并点击 **替换** 按钮（图 3-43）。


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig43_HTML.png](img/508424_1_En_3_Fig43_HTML.png)


    图 3-43. 替换 `ZCPEXT02` 复合提供者的源视图


    当点击 **替换** 按钮时，系统将打开用于搜索替换对象的窗口。选择新的目标视图（`CV_ORDER_HEADER_TF`）后，系统会将之前的视图替换为新视图。对于具有相同技术名称的列和输入参数，源与目标之间的映射将保持不变。其余的映射需要手动管理。图
    3-44 显示了 `ZCPEXT02` 复合提供者更新后的目标结构和映射。


    视图的替换导致目标部分中的 `CM_DELV_DATE` 字段丢失了分配。这是因为从 `CV_ORDER_HEADER_TF` 派生的度量具有不同的技术名称（`CM_DELV_DATE_DIFF_WD`），所以我们需要手动创建缺失的分配。输入参数（`IP_CALENDAR`）也应该被拖拽到复合提供者结构的目标部分，因为我们希望将其用作新查询变量的参考。`ZCPEXT02`
    复合提供者的最终结构应如图 3-44 所示。


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig44_HTML.jpg](img/508424_1_En_3_Fig44_HTML.jpg)


    图 3-44. 更新 `ZCPEXT02` 复合提供者的结构


    ### 使用新的输入参数更新订单标题数据的查询


    完成案例研究 4 任务的最后一步是更新 `ZCPEXT02_Q01` 查询。对于新映射的 `IP_CALENDAR` 参数，我们需要执行与 `IP_LANGU`
    输入参数相同的步骤（图 3-27 到 3-32 中展示的步骤）。`ZCPEXT02_Q01` 查询的最终过滤器定义应如图 3-45 所示。


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig45_HTML.jpg](img/508424_1_En_3_Fig45_HTML.jpg)


    图 3-45. 将 `4ZCPEXT02-IP_CALENDAR` 输入参数字段映射到查询变量


    现在，我们可以在前端工具中运行报表，根据案例研究 4 中描述的需求来测试查询。当在 Analysis for Microsoft Excel 中打开查询时，我们现在应该会看到两个变量提示，如图
    3-46 所示。


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig46_HTML.jpg](img/508424_1_En_3_Fig46_HTML.jpg)


    图 3-46. `ZCPEXT02_Q01` 查询的更新后 Analysis for Microsoft Excel 提示


    **状态名称** 和 **请求日期 vs. 交货日期（天）** 列将根据在 **语言** 和 **日历 ID** 变量选择屏幕上输入的值返回输出。这意味着案例研究
    4 中的需求现已成功完成。


    ## 总结


    在本章中，我描述了需要将 HANA 表中的数据暴露给 BW/4HANA 层的场景。通过利用基于字段的建模和虚拟化，我们能够创建 BW/4HANA 报表，而无需将数据加载到
    BW/4HANA 建模对象中，也无需创建任何单个信息对象。


    在案例研究 1 中，我展示了如何轻松地将数据从 HANA 表预置到 BW/4HANA 查询中。在此场景中，我们使用了两个 BW/4HANA 建模对象：开放
    ODS 视图和复合提供者。


    案例研究 2 要求我们在创建最终输出之前合并两个 HANA 表。为了实现这一点，我们引入了一个额外的 HANA 建模对象，称为计算视图。这帮助我们连接这两个表，以便在将其带入
    BW/4HANA 层之前，以所需的形式创建一个数据集。


    在案例研究 3 中，我演示了如何将值从查询变量传递到计算视图输入参数。我们了解到，带有输入参数的计算视图应由复合提供者直接使用（在此场景中需要跳过开放 ODS
    视图层）。


    最后一个场景帮助我们理解了表函数的用法。通过完成案例研究 4 的需求，我们学习了如何在表函数中使用计算视图。此外，我们还通过示例了解了如何在计算视图和表函数之间双向传递输入参数值。最终，你还学习了如何将查询变量值传递到表函数的
    SQL 代码中。

    '
- fmt: '# 4. Creating Field-Based BW/4HANA Models


    Now that we have discussed the possibility of exposing HANA objects (tables and
    views) in Chapter [3](#508424_1_En_3_Chapter.xhtml), this chapter explains how
    to implement a BW/4HANA data model using a field-based approach. We already know
    that by utilizing `Open ODS Views` objects, we can bring external data located
    in the SAP HANA database schema to the BW/4HANA layer. In this chapter, we will
    take advantage of `Open ODS Views` to build a virtual star schema, field-based
    data model in BW. I will also explain how you can automatically generate an intermediate
    data storage layer between the `Open ODS View` and source objects, without needing
    to edit the reporting layer.


    ## Scenario


    After successful implementation of the basic data provisioning report for the
    orders data (Chapter [3](#508424_1_En_3_Chapter.xhtml)), a project manager requested
    to build in BW/4HANA a proof of concept for a star schema data model. The requirement
    is to implement the data model in the BW/4HANA system, based on the tables replicated
    in the SAP HANA database schema. Two tables (`ORDER_HEADER` and `ORDER_STATUS`)
    were already used for building data provisioning reports in Chapter [3](#508424_1_En_3_Chapter.xhtml).
    The virtual model should include five external tables in total. Two of them are
    the fact tables.


    - `Order Header`: This contains the order header information such as status, order
    date, customer number, and employee responsible.

    - `Order Details`: This table is linked to the `Order Header` table and contains
    information on the order item level such as product ID or quantity ordered.


    The remaining three tables are dimension/text tables.


    - `Order Status`: This is a text table used to look up the status ID in the status
    description. It supports descriptions in two languages (English and German).

    - `Products`: This is a dimension table containing information about product attributes.

    - `Categories`: This is a text table that has information about the available
    group of products and its descriptions.


    Figure [4-1](#508424_1_En_4_Chapter.xhtml#Fig1) shows the logical data model for
    non-SAP tables replicated in the SAP HANA database.


    ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig1_HTML.jpg](images/508424_1_En_4_Chapter/508424_1_En_4_Fig1_HTML.jpg)


    *Figure 4-1.* Logical data model for Orders


    As shown in Figure [4-1](#508424_1_En_4_Chapter.xhtml#Fig1), the data model consists
    of five tables. The connectors between the tables define their relationships.
    In the given example, all the relationships are of the one-to-many type (1..1
    – 1..*). Each entity consists of a table header and a list of fields. Fields,
    which are in bold, indicate the primary key for a table. In the book’s appendix
    you will find the SQL scripts to re-create all these tables in your local schema,
    in case you want to follow along with the demonstrated activities.


    In the next sections of this chapter, I will show you how to implement the virtual
    data model in BW/4HANA using the given logical model as a reference (Figure [4-1](#508424_1_En_4_Chapter.xhtml#Fig1)).
    In this scenario, we will follow the Open ODS View–based modeling concept presented
    in Figure [2-7](#508424_1_En_2_Chapter.xhtml#Fig7) (in Chapter [2](#508424_1_En_2_Chapter.xhtml)).
    Figure [4-2](#508424_1_En_4_Chapter.xhtml#Fig2) presents the general approach
    for implementing the Orders data model based on the requirements described in
    the scenario.


    ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig2_HTML.jpg](images/508424_1_En_4_Chapter/508424_1_En_4_Fig2_HTML.jpg)


    *Figure 4-2.* Virtual BW/4HANA model for Orders


    The idea here is to build a virtual model by utilizing `Open ODS View` objects.
    There will be one `Open ODS View` of the Facts semantics type (`Orders`) and one
    `Open ODS View` of the Master Data type (`Product`). Since the `Order Status`
    and `Category` tables contain only keys and descriptions, the semantics type will
    be set to Texts. On top of the model, I will create a `CompositeProvider`, which
    will later be consumed by the query. First I will focus on implementing the Master
    Data/Texts objects.


    ## Create the Dimension Calculation Views


    We could start implementing `Open ODS Views` directly on the HANA tables, but
    as I mentioned previously, I prefer to consume tables with a calculation view
    first. This gives us more flexibility in case we need to apply any field conversion
    or additional calculation in the future. For each dimension/text table, I created
    a calculation view with a Dimension type (Figure [4-3](#508424_1_En_4_Chapter.xhtml#Fig3)).


    ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig3_HTML.jpg](images/508424_1_En_4_Chapter/508424_1_En_4_Fig3_HTML.jpg)


    *Figure 4-3.* List of dimension calculation views for a virtual data model


    As you will notice in Figure [4-3](#508424_1_En_4_Chapter.xhtml#Fig3), I created
    a new HANA package called `BW4VMODEL`. This helps to keep the developments transparent
    and separated from other HANA objects, which were developed for different purposes.
    The calculation views listed under the `BW4VMODEL` package have the Dimension
    type. They do not contain any joins or calculations, but simply provision the
    data in the same structure as the underlying tables. As an example, you can see
    the structure of the `CV_DIM_PRODUCTS` calculation view in Figure [4-4](#508424_1_En_4_Chapter.xhtml#Fig4).


    ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig4_HTML.jpg](images/508424_1_En_4_Chapter/508424_1_En_4_Fig4_HTML.jpg)


    *Figure 4-4.* `CV_DIM_PRODUCTS` calculation view definition


    Two remaining calculation views (for the Order Status and Category tables) follow
    the same approach. They consist of a `Projection` node pointing to the source
    table, from which all the fields are propagated to the `Semantics` node. Here
    are tables that are used as the source for a specific calculation view (Table
    ➤ Calculation View):


    - `CATEGORIES` ➤ `CV_DIM_CATEGORIES`

    - `ORDER_STATUS` ➤ `CV_DIM_ORDER_STATUSES`

    - `PRODUCTS` ➤ `CV_DIM_PRODUCTS`


    Having these views validated and activated, we can now switch to the BW modeling
    perspective.'
