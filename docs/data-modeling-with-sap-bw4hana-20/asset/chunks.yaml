- fmt: '# Create the Transactional Calculation View


    Like with dimension tables, I will create a virtual layer for the transactional
    data on the SAP HANA level first. In our data model, the transactional data is
    coming from two tables: `ORDER_HEADER` and `ORDER_DETAILS`. Both tables have an
    `Order Number (ORD_NUMBER)` column, and this column will be used to link header
    and item data into a single dataset. This table will be joined within the calculation
    view of the CUBE data category. Figure [4-14](#508424_1_En_4_Chapter.xhtml#Fig14)
    presents the graphical editor of the `CV_FACT_ORDERS` View object.


    ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig14_HTML.jpg](images/508424_1_En_4_Chapter/508424_1_En_4_Fig14_HTML.jpg)


    Figure 4-14. `CV_FACT_ORDERS` calculation view definition


    The `CV_FACT_ORDERS` calculation view queries data from the Order Header and Order
    Item tables (`Projection_1` and `Projection_2`). Then the Join node links these
    tables into a single dataset based on the `ORD_NUMBER` column. From `ORDER_HEADER`,
    all columns are propagated to the Semantics node. From `ORDER_DETAILS`, we also
    should select all the fields except `ORD_NUMBER`, which is already derived from
    the header table. When executing a data preview for the `CV_FACT_ORDERS` calculation
    view, we should see the data from Header and Line Item combined into a single
    dataset. This view will now be used as a source for the Facts Open ODS View object.


    # Create the Facts Open ODS Views


    After creating the Master Data and Texts BW/4HANA objects, now I will create the
    central star schema object. As we already have Orders transactional data combined
    into a single dataset, we can now define a new Facts Open ODS View object. Remember
    that when defining a transactional Open ODS View, you should select the `Facts`
    option as the Semantics type. Figure [4-15](#508424_1_En_4_Chapter.xhtml#Fig15)
    shows the initial setup of the `ZFCT01` Open ODS View.


    ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig15_HTML.jpg](images/508424_1_En_4_Chapter/508424_1_En_4_Fig15_HTML.jpg)


    Figure 4-15. Initial output structure of the Orders data (`ZFCT01`) Open ODS View


    The source fields available in the `CV_FACT_ORDERS` calculation view are distributed
    into these three categories:


    *   `Order Number` and `Order Line Number` are fields that form a composite key
    for the Orders data set. They uniquely define each Order Item record. Primary
    key fields are assigned to the `Characteristics (Key)` category (1).


    > **Note**: Primary key fields could be also assigned to the Characteristics folder.
    However, if in the future there will be a need to persist this data in an ADSO,
    by assigning primary key fields to the `Characteristics (Key)` folder, we make
    sure that these fields will automatically become key fields of the generated ADSO.


    *   Transactional data fields are grouped under the `Characteristics` folder (2).
    Most of the fields coming from the `CV_FACT_ORDERS` calculation view were added
    to this group.


    *   The `Quantity Ordered (QTY)` column is a cumulative measure; hence, it has
    been added to the `Key Figures` folder (3).


    Let''s now activate the `ZFCT01` object to check what the content looks like.


    ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig16_HTML.jpg](images/508424_1_En_4_Chapter/508424_1_En_4_Fig16_HTML.jpg)


    Figure 4-16. Initial output of `ZFCT01` in Analysis for Microsoft Excel


    In Figure [4-16](#508424_1_En_4_Chapter.xhtml#Fig16) you might see the output
    of the `ZFCT01` Open ODS View for some selected fields. Currently, the `Order
    Status`, `Category`, and `Product` fields display values as keys, which might
    not be meaningful for the end users unless they know what the specific ID stands
    for. As we now have the initial setup of the Orders transactional Open ODS View
    ready, we can enhance the fields by applying associations. Thanks to that, some
    of the fields will inherit properties of the associated Texts/Master Data Open
    ODS Views that were created in previous sections of this chapter.


    The `CV_FACT_ORDERS` calculation view displays the `Order Status` and `Category`
    values as keys. To also enable descriptions for the reporting, we can utilize
    the Order Status (`ZTXT01`) and Category (`ZTXT02`) Open ODS Views and apply associations
    to the `STATUS` and `CATEGORY` fields accordingly. Follow the same steps that
    were presented in Figure [4-11](#508424_1_En_4_Chapter.xhtml#Fig11) for the Category
    field to define an association in the `ZFCT01` Open ODS View. Figure [4-17](#508424_1_En_4_Chapter.xhtml#Fig17)
    shows associations between transactional fields and Texts Open ODS Views objects.


    ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig17_HTML.jpg](images/508424_1_En_4_Chapter/508424_1_En_4_Fig17_HTML.jpg)


    Figure 4-17. Association for the Category and Order Status fields in the `ZFCT01`
    Open ODS View


    The Category and Order Status fields shown in Figure [4-17](#508424_1_En_4_Chapter.xhtml#Fig17)
    now have associations to text Open ODS Views. In the previous section, we created
    a Master Data object for the Product dimension. As you remember, this dimension
    has a compounded key, which consists of the Product ID and Category ID fields.
    When assigning the Product (`ZDIM01`) Open ODS View, we need to keep that in mind.


    ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig18_HTML.jpg](images/508424_1_En_4_Chapter/508424_1_En_4_Fig18_HTML.jpg)


    Figure 4-18. Association for the Product field in the `ZFCT01` Open ODS View'
