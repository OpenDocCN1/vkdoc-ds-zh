- fmt: "### Calculation View\n\nTo start working with calculation views, go to the\
    \ SAP HANA modeler perspective, right-click the package, and select New ➤ Calculation\
    \ View (Figure [1-1](#508424_1_En_1_Chapter.xhtml#Fig1)).\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig1_HTML.jpg](images/508424_1_En_1_Chapter/508424_1_En_1_Fig1_HTML.jpg)\n\
    \nFigure 1-1\n\nCreating a new CV\n\nAfter selecting the Calculation View option,\
    \ the window for defining the general settings of the CV will open (see Figure\
    \ [1-2](#508424_1_En_1_Chapter.xhtml#Fig2)).\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig2_HTML.jpg](images/508424_1_En_1_Chapter/508424_1_En_1_Fig2_HTML.jpg)\n\
    \nFigure 1-2\n\nNew Information View window\n\nIn Figure [1-2](#508424_1_En_1_Chapter.xhtml#Fig2),\
    \ these two fields are important:\n\n1.  *Name*: This is a mandatory field that\
    \ is the technical name of the calculation view.\n\n2.  *Data Category*: This\
    \ field has the following options:\n    1.  *CUBE*: The last default node in the\
    \ graphical editor will be Aggregation. Views of this type can be consumed by\
    \ reporting tools. At least one output column needs to be specified as a measure.\n\
    \n2.  *DIMENSION*: The last default node in the graphical editor will be Projection.\
    \ Views of this type cannot be consumed by reporting tools. All the output fields\
    \ are attributes (measures are not available).\n\nNote\n\nOnce the calculation\
    \ view is created, you will be able to change the data category type at any time\
    \ without rebuilding the entire view logic.\n\nAfter providing the calculation\
    \ view details, the next step is to model the business logic in a graphical designer.\
    \ Calculation views are built using building blocks called *nodes*. Graphical\
    \ views support the following node types:\n\n*   *Join*: Join operations are used\
    \ to link two data sources based on specific columns. When linking the data sets,\
    \ you can choose the type of join (referential, inner, left outer, right outer,\
    \ full outer, or text join) and can indicate the join cardinality (1..1, 1..n,\
    \ n..1, n..m).\n\n*   *Union*: These operations are used to combine two or more\
    \ data sources. SAP HANA is a columnar database, so wherever possible, it is always\
    \ better to use union nodes than joins.\n\n*   *Projection*: This is the node\
    \ that retrieves data from the target source objects. It allows you to select\
    \ fields, apply filters, or create calculations. The Projection node can consume\
    \ the following source objects: table, virtual table, view, calculation view,\
    \ table function, or any other node within the model.\n\n*   *Aggregation*: This\
    \ allows you to aggregate data based on selected attributes and apply basic aggregation\
    \ functions (`Sum`, `Min`, `Max`, `Count`, `Avg`, `Var`, `StdDev`) on selected\
    \ measures.\n\n*   *Rank*: Within this node, it is possible to filter the data\
    \ based on the rank definition. In addition, this node allows you to automatically\
    \ generate rank columns.\n\nThe most commonly used node is `Projection`, which\
    \ simply reads the data from the underlying table. Nodes are being added to the\
    \ model by dragging and dropping them from the palette (see Figure [1-3](#508424_1_En_1_Chapter.xhtml#Fig3)).\n\
    \n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig3_HTML.png](images/508424_1_En_1_Chapter/508424_1_En_1_Fig3_HTML.png)\n\
    \nFigure 1-3\n\nAdding a Projection node to the calculation view\n\nAdding all\
    \ the other node types is the same. Once we have the node added to the model,\
    \ in the next step we need to define the source table (or any other object like\
    \ other calculation view, table function, or database view). By clicking the `Add\
    \ Objects` button, you can search for the desired view or table.\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig4_HTML.png](images/508424_1_En_1_Chapter/508424_1_En_1_Fig4_HTML.png)\n\
    \nFigure 1-4\n\nAdding an object to the Projection node in a calculation view\n\
    \nWhen searching for the object, you should type its name (Figure [1-4](#508424_1_En_1_Chapter.xhtml#Fig4)).\
    \ Once it is found and displayed in the “Matching items” section, select it and\
    \ click OK to proceed. Another way to add source objects is to drag them from\
    \ the left display pane directly onto the node (the “Drop Elements Here” section\
    \ displayed on the node). Figure [1-5](#508424_1_En_1_Chapter.xhtml#Fig5) shows\
    \ an exemplary calculation view that joins two standard ERP tables for Purchasing\
    \ Document Header (`EKKO`) and Purchasing Document Item (`EKPO`) on the Document\
    \ Number column (`EBELN`).\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig5_HTML.jpg](images/508424_1_En_1_Chapter/508424_1_En_1_Fig5_HTML.jpg)\n\
    \nFigure 1-5\n\nCalculation view for purchase orders\n\nAs shown in Figure [1-5](#508424_1_En_1_Chapter.xhtml#Fig5),\
    \ this view consists of four nodes: two Projections query data from two Purchasing\
    \ tables (`EKKO` and `EKPO`), the Join node combines these two tables, and the\
    \ Aggregation node is a default node for the calculation views of the `CUBE` data\
    \ category. The Semantics node is always set as the last default node for all\
    \ types of calculation views and cannot be removed. More complex scenarios for\
    \ creating calculation views will be described in the next chapters.\n\nBefore\
    \ you are able to execute the view, like with most BW/4HANA objects, the view\
    \ needs to be activated. To check if there are any errors, you can first validate\
    \ the view by clicking the `Validate` button. Once it’s validated, you can activate\
    \ it, as shown in Figure [1-6](#508424_1_En_1_Chapter.xhtml#Fig6).\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig6_HTML.png](images/508424_1_En_1_Chapter/508424_1_En_1_Fig6_HTML.png)\n\
    \nFigure 1-6\n\nValidating and activating the calculation view\n\nDuring validation\
    \ and activation, the system checks if the model has any errors and displays the\
    \ activation status accordingly on the Job Log tab (Figure [1-6](#508424_1_En_1_Chapter.xhtml#Fig6)).\n\
    \nThere are multiple ways of executing calculation views to display the results.\
    \ The first option is to right-click the Semantics node and select the Data Preview\
    \ option. The system will then open a new tab (Figure [1-7](#508424_1_En_1_Chapter.xhtml#Fig7)),\
    \ where you can see the output of your view on the Raw Data tab (by default 200\
    \ records are displayed).\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig7_HTML.jpg](images/508424_1_En_1_Chapter/508424_1_En_1_Fig7_HTML.jpg)\n\
    \nFigure 1-7\n\nData preview of calculation view\n\nThe second option is to right-click\
    \ the calculation view’s name in the package tree in the left pane (on the System\
    \ tab). There you have two options to run the view: `Data Preview` and `Generate\
    \ Select SQL`. The `Data Preview` option works the same way as Preview on the\
    \ Semantics node (see Figure [1-7](#508424_1_En_1_Chapter.xhtml#Fig7)).\n\nThe\
    \ `Generate Select SQL` option opens the SQL console and generates the SQL `SELECT`\
    \ statement on top of the calculation view. This option is useful when you want\
    \ to perform ad hoc analysis combining the output of the view with additional\
    \ source objects like other calculation views or tables. When using this option\
    \ for the calculation view `CV_PURCHASE_ORDERS`, the following SQL code is generated:\n\
    \n```\nSELECT\n\"EBELN\",\n\"EBELP\",\n\"AEDAT\",\n\"MATNR\",\n\"MEINS\",\nsum(\"\
    MENGE\") AS \"MENGE\"\nFROM \"_SYS_BIC\".\"BW4HANA/CV_PURCHASE_ORDERS\"\nGROUP\
    \ BY \"EBELN\",\n\"EBELP\",\n\"AEDAT\",\n\"MATNR\",\n\"MEINS\"\n```\n\nNote\n\n\
    A common developer question is about whether it’s possible to convert the logic\
    \ of a graphical calculation view into SQL code. The answer is no. You can automatically\
    \ generate a SQL query from a calculation view, but this will not translate the\
    \ entire view logic into SQL joins and unions; instead, this will simply create\
    \ a `SELECT` statement on top of that calculation view.\n\nWhile starting work\
    \ with calculation views, you might face some issues even though the view logic\
    \ was modeled properly. Here are the most common problems that you might encounter:"
