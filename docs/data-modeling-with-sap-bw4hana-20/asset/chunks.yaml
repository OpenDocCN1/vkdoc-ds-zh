  trans: '

    在 `PRODUCT_ID` 字段与 `ZDIM01` 开放 ODS 视图建立关联后，我们还需要为此开放 ODS 视图定义复合键。通过点击“复合”按钮（图
    4-18），我们可以选择用于关联的第二个字段。在给定场景中，应选择 `CATEGORY_ID` 字段作为复合字段。在某些情况下，主数据开放 ODS 视图的复合键可能包含两个以上的字段。此时，在进行关联时，需确保为每个主数据开放
    ODS 视图键字段都定义了复合键。


    将主数据开放 ODS 视图指定给产品字段后，我们可以选择主数据导航属性。在产品开放 ODS 视图中，我们将 `Brand` 字段定义为特征（图 4-9）。所有定义为开放
    ODS 视图特征的字段都可以在后续用作导航属性。这意味着在报表期间，它们可以与所有常规输出字段以相同的方式使用。图 4-19 展示了如何将 `Brand`
    字段启用为导航属性。


    ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig19_HTML.jpg](img/508424_1_En_4_Fig19_HTML.jpg)


    *图 4-19. 为 `ZFCT01` 开放 ODS 视图选择导航属性*


    点击“导航属性”按钮后，我们将看到已关联主数据对象可用的特征列表。通过选中给定属性旁的复选框，可以将其添加为导航属性。在我们的场景中，产品开放 ODS 视图（`ZDIM01`）仅定义了一个特征。选中
    `BRAND_DESC` 字段后，您会注意到它被添加到了 `PRODUCT_ID` 字段下的视图字段部分。


    由于所有调整均已就位，现在我们来验证 `ZFCT01` 开放 ODS 视图选定字段的输出（图 4-20）。


    ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig20_HTML.jpg](img/508424_1_En_4_Fig20_HTML.jpg)


    *图 4-20. `ZFCT01` 在 Analysis for Microsoft Excel 中的最终输出*


    这次，在 Analysis for Microsoft Excel 中打开订单开放 ODS 视图时（图 4-20），在我们定义了关联的字段中，文本设置为默认显示。另一个优势是，我们现在可以利用产品维度的属性（见图
    4-21）。


    ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig21_HTML.jpg](img/508424_1_En_4_Fig21_HTML.jpg)


    *图 4-21. `ZFCT01` 在 Analysis for Microsoft Excel 中显示的产品属性*


    首先，您可能会注意到有一个新的 `Brand` 字段可用于导航。该字段在 `ZFCT01` 的初始输出中不可用（图 4-16），这是因为我们将其设置为导航属性（图
    4-19）。其他产品相关信息（如货币和价格）则显示在产品（`2FZDIM01`）字段的属性部分下。与导航属性（`2FZDIM01=BRAND_DESC`）不同，显示属性不能用于单独下钻，只能与主特征（此处为产品）一起使用。尽管
    `Brand` 字段被设置为导航属性，它也会作为产品属性可见。在图 4-21 的左侧，您可以看到产品显示属性的输出。


    ## 创建使用开放 ODS 视图的 CompositeProvider


    在创建查询之前，我将先创建一个 CompositeProvider，该提供者使用订单数据（`ZFCT01`）开放 ODS 视图。这样，将来我就可以通过使用
    CompositeProvider 的联接和/或联合节点来包含其他对象。图 4-22 展示了 `ZCPFCT01` CompositeProvider 的建模方式。


    ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig22_HTML.jpg](img/508424_1_En_4_Fig22_HTML.jpg)


    *图 4-22. 定义 `ZCPFCT01` CompositeProvider 的结构*


    在名为 `ZCPFCT01` 的 CompositeProvider 中，所有源字段都已映射到输出。尽管底层开放 ODS 视图（`ZFCT01`）中已将 `Brand`
    字段作为导航属性启用，但默认情况下此处并不可见。如果希望启用导航属性，应转到“输出”选项卡。该选项卡列出了 CompositeProvider 的输出字段，我们可以在此处启用可用的导航属性。


    如图 4-23 所示，与主数据/文本开放 ODS 视图的关联继承自所使用的 `ZFCT01` 对象。通过右键单击产品特征，我们可以选择定义要包含在输出中的导航属性。在打开的窗口中，我们将看到可添加为导航属性的字段列表。在我们的场景中，只有一个属性可供选择。选中
    `Brand` 字段作为导航属性后，它将显示在主产品特征下（如图 4-23 所示）。由于此设置符合需求，我们可以激活 CompositeProvider。


    ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig23_HTML.jpg](img/508424_1_En_4_Fig23_HTML.jpg)


    *图 4-23. 为 `ZCPFCT01` CompositeProvider 添加导航属性*


    **注意**


    如果在激活 CompositeProvider 时遇到“列视图”错误，请再次针对底层开放 ODS 视图运行 `RSDDB_LOGINDEX_CREATE`
    程序以创建列视图（参见图 3-12）。


    CompositeProvider 成功激活后，您可以在其之上创建最终查询。定义查询结构时（图 4-24），您将能够使用 `ZCPFCT01` CompositeProvider
    中的所有字段，包括导航属性。


    ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig24_HTML.jpg](img/508424_1_En_4_Fig24_HTML.jpg)


    *图 4-24. `ZCPFCT01_Q01` 查询的定义*


    在此场景中，我们基于开放 ODS 视图构建了一个虚拟数据模型。由于底层表存储在 HANA 数据库中，我们无需将数据持久化到 BW/4HANA 层。然而，在某些情况下，底层数据模型要复杂得多，需要许多额外的操作和计算。此外，数据并不总是驻留在
    HANA 表中，也可以通过智能数据访问从外部数据库进行查询。在这种情况下，我们可能需要创建一个额外的暂存层，以避免查询运行时的性能问题。在下一节中，我将描述如何为现有的开放
    ODS 视图对象生成一个中间 BW/4HANA 持久化层。

    '
- fmt: '# Converting the Virtual Model into a Persistent Structure


    Open ODS Views provide functionality for turning source structures (like remote
    tables) into BW/4HANA persistent objects. The driver for switching the virtual
    model to persistent data storage is usually the performance. If the model is fully
    based on virtual HANA tables, query performance will be obviously impacted. Also,
    when relying on data residing on external systems, it might be a challenge to
    ensure the stability of the virtual model. During source system downtimes, external
    data exposed through BW models will not be accessible at all. To avoid that, you
    might prefer to load source data to BW objects so that in the case of any connection
    or external system downtimes, the model will still return all the data from before
    the last successful load request.


    Also, when you want to combine external tables with various BW objects, due to
    the number of complex operations and data volume, running the query on the fly
    may take some time. Scenarios that need to support time-based data snapshots also
    cannot be maintained by using the virtual approach.


    For these kinds of scenarios, the Open ODS Framework enables the functionality
    of switching from the virtual model to the persistent structures. This approach
    helps with performance-related issues. The conversion can be done independently
    for each Open ODS View, so you can decide for which Open ODS View you would like
    to persist the data. It is worth mentioning that even if you already have built
    the virtual model, you can generate the persistent layer without rebuilding the
    Open ODS Views and other objects that were already created on top of them (such
    as `CompositeProviders` and/or queries). Thanks to that, you can implement your
    data model using an iterative approach, starting from the fully virtual structures,
    making the first round of unit tests, and afterward choosing virtual objects for
    which it is required to generate data storage to improve the performance or to
    capture data snapshots.


    As was mentioned in the first chapter, Open ODS Views are virtual modeling objects,
    so they do not store any data. However, they enable us to generate an ADSO-based
    data structure, including all the necessary BW/4HANA objects to transfer the data,
    such as the Data Source, Transformation, and DTP objects. To demonstrate the conversion
    from virtual structure to persistent object, I will use the `ZFCT01` Open ODS
    View as a reference. Figure [4-25](#508424_1_En_4_Chapter.xhtml#Fig25) depicts
    an overview of switching from virtual to persistent data structures for the Orders
    Open ODS View.


    ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig25_HTML.jpg](images/508424_1_En_4_Chapter/508424_1_En_4_Fig25_HTML.jpg)


    *Figure 4-25. Conversion of the Orders Open ODS View from a virtual to persistent
    structure*


    As shown in Figure [4-25](#508424_1_En_4_Chapter.xhtml#Fig25), in the virtual
    approach, the Orders data is queried directly from the underlying calculation
    view. Our goal is to convert the current data flow to utilize persistent structures.


    The Open ODS View provides `Generate Dataflow` functionality, which makes this
    conversion easy to implement. As depicted in Figure [4-25](#508424_1_En_4_Chapter.xhtml#Fig25),
    on the BW/4HANA side we will generate a few additional objects. These objects
    are Data Source, Transformation and DTP, and finally the Advanced DSO where the
    actual data will be stored.


    To start converting the data flow, open the Open ODS View object and in the editor''s
    General tab click the `Generate Dataflow` button (Figure [4-26](#508424_1_En_4_Chapter.xhtml#Fig26)).


    ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig26_HTML.jpg](images/508424_1_En_4_Chapter/508424_1_En_4_Fig26_HTML.jpg)


    *Figure 4-26. Generating a data source for the ZFCT01 Open ODS View*


    The `Generate Dataflow` button will be available for all Open ODS View semantic
    types (Facts, Master Data, and Texts), so depending on your needs, you can generate
    a persistent layer also for other Open ODS View objects. After clicking this button,
    Eclipse opens a window for providing the name of the Data Source object. Once
    you proceed, the new data source with the given name will be automatically created.
    You will notice that in the Semantics section of the given Orders data Open ODS
    View, the new `ZDS_FACT_ORDERS` BW data source replaces the former `CV_FACT_ORDERS`
    calculation view (Figure [4-26](#508424_1_En_4_Chapter.xhtml#Fig26)). The created
    data source will extract data from the `CV_FACT_ORDERS` view, and its structure
    corresponds to the structure of that calculation view. The data types of the calculation
    view fields are converted into SAP BW/4HANA data types (see Figure [4-27](#508424_1_En_4_Chapter.xhtml#Fig27)).


    ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig27_HTML.jpg](images/508424_1_En_4_Chapter/508424_1_En_4_Fig27_HTML.jpg)


    *Figure 4-27. Output structure of ZDS_FACT_ORDERS*


    Now as we have a Data Source object created, in the next step I will generate
    an ADSO together with the Transformation and DTP objects. ADSO will be a target
    object to store the output of the underlying calculation view. Click the `Generate
    Dataflow` button again to create an ADSO (Figure [4-28](#508424_1_En_4_Chapter.xhtml#Fig28)).


    ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig28_HTML.jpg](images/508424_1_En_4_Chapter/508424_1_En_4_Fig28_HTML.jpg)


    *Figure 4-28. Generating an ADSO for the ZFCT01 Open ODS View object*


    Similarly, as in the previous step, after clicking the button, a new window pops
    up. This time we need to provide the name of the target ADSO, where we will be
    loading the Orders data. Once you proceed, the system will create a new ADSO object.
    This object will now be used as a source for the `ZFCT01` Open ODS View, replacing
    the former `ZDS_FACT_ORDERS` data source. You can now activate the `ZFCT01` Open
    ODS View.


    ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig29_HTML.jpg](images/508424_1_En_4_Chapter/508424_1_En_4_Fig29_HTML.jpg)


    *Figure 4-29. Overview of generated objects for Orders data persistent structure*


    As shown in Figure [4-29](#508424_1_En_4_Chapter.xhtml#Fig29), in the Project
    Explorer you can see that in addition to the `ZSTG01` ADSO object, the system
    automatically generated the transformation and DTP as well. By default the system
    creates the ADSO with the Staging DataStore Object type and the `Compress Data`
    option selected (for detailed information about ADSO types, check Chapter [1](#508424_1_En_1_Chapter.xhtml)).
    If needed, you can manually adjust the ADSO settings according to your requirements.
    The output structure of the generated ADSO corresponds to the structure of the
    underlying `ZDS_FACT_ORDERS` data source (Figure [4-30](#508424_1_En_4_Chapter.xhtml#Fig30)).


    ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig30_HTML.jpg](images/508424_1_En_4_Chapter/508424_1_En_4_Fig30_HTML.jpg)


    *Figure 4-30. Output structure of the ZSTG01 ADSO*


    When generating the ADSO, the system will automatically identify key fields, based
    on the `ZFCT01` Open ODS View fields, that were assigned to the Characteristics
    (Key) folder (Figure [4-15](#508424_1_En_4_Chapter.xhtml#Fig15)).


    After completing the generation of all the necessary BW/4HANA objects, when trying
    to execute the existing `ZCPFCT01_Q01` query, initially no applicable data will
    be found. To make the data available, you need to first load the output of the
    calculation view into the ADSO by executing the data transfer process shown in
    Figure [4-29](#508424_1_En_4_Chapter.xhtml#Fig29). When you load the data to the
    ADSO, you don''t need to apply any other changes on the `CompositeProvider` and
    Query levels.'
  raw: '## Converting the Virtual Model into a Persistent Structure


    Open ODS Views provide functionality for turning source structures (like remote
    tables) into BW/4HANA persistent objects. The driver for switching the virtual
    model to persistent data storage is usually the performance. If the model is fully
    based on virtual HANA tables, query performance will be obviously impacted. Also,
    when relying on data residing on external systems, it might be a challenge to
    ensure the stability of the virtual model. During source system downtimes, external
    data exposed through BW models will not be accessible at all. To avoid that, you
    might prefer to load source data to BW objects so that in the case of any connection
    or external system downtimes, the model will still return all the data from before
    the last successful load request.


    Also, when you want to combine external tables with various BW objects, due to
    the number of complex operations and data volume, running the query on the fly
    may take some time. Scenarios that need to support time-based data snapshots also
    cannot be maintained by using the virtual approach.


    For these kinds of scenarios, the Open ODS Framework enables the functionality
    of switching from the virtual model to the persistent structures. This approach
    helps with performance-related issues. The conversion can be done independently
    for each Open ODS View, so you can decide for which Open ODS View you would like
    to persist the data. It is worth mentioning that even if you already have built
    the virtual model, you can generate the persistent layer without rebuilding the
    Open ODS Views and other objects that were already created on top of them (such
    as CompositeProviders and/or queries). Thanks to that, you can implement your
    data model using an iterative approach, starting from the fully virtual structures,
    making the first round of unit tests, and afterward choosing virtual objects for
    which it is required to generate data storage to improve the performance or to
    capture data snapshots.


    As was mentioned in the first chapter, Open ODS Views are virtual modeling objects,
    so they do not store any data. However, they enable us to generate an ADSO-based
    data structure, including all the necessary BW/4HANA objects to transfer the data,
    such as the Data Source, Transformation, and DTP objects. To demonstrate the conversion
    from virtual structure to persistent object, I will use the ZFCT01 Open ODS View
    as a reference. Figure [4-25](#508424_1_En_4_Chapter.xhtml#Fig25) depicts an overview
    of switching from virtual to persistent data structures for the Orders Open ODS
    View.


    ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig25_HTML.jpg](images/508424_1_En_4_Chapter/508424_1_En_4_Fig25_HTML.jpg)


    Figure 4-25.


    Conversion of the Orders Open ODS View from a virtual to persistent structure


    As shown in Figure [4-25](#508424_1_En_4_Chapter.xhtml#Fig25), in the virtual
    approach, the Orders data is queried directly from the underlying calculation
    view. Our goal is to convert the current data flow to utilize persistent structures.


    The Open ODS View provides Generate Dataflow functionality, which makes this conversion
    easy to implement. As depicted in Figure [4-25](#508424_1_En_4_Chapter.xhtml#Fig25),
    on the BW/4HANA side we will generate a few additional objects. These objects
    are Data Source, Transformation and DTP, and finally the Advanced DSO where the
    actual data will be stored.


    To start converting the data flow, open the Open ODS View object and in the editor’s
    General tab click the Generate Dataflow button (Figure [4-26](#508424_1_En_4_Chapter.xhtml#Fig26)).


    ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig26_HTML.jpg](images/508424_1_En_4_Chapter/508424_1_En_4_Fig26_HTML.jpg)


    Figure 4-26.


    Generating a data source for the ZFCT01 Open ODS View


    The Generate Dataflow button will be available for all Open ODS View semantic
    types (Facts, Master Data, and Texts), so depending on your needs, you can generate
    a persistent layer also for other Open ODS View objects. After clicking this button,
    Eclipse opens a window for providing the name of the Data Source object. Once
    you proceed, the new data source with the given name will be automatically created.
    You will notice that in the Semantics section of the given Orders data Open ODS
    View, the new ZDS_FACT_ORDERS BW data source replaces the former CV_FACT_ORDERS
    calculation view (Figure [4-26](#508424_1_En_4_Chapter.xhtml#Fig26)). The created
    data source will extract data from the CV_FACT_ORDERS view, and its structure
    corresponds to the structure of that calculation view. The data types of the calculation
    view fields are converted into SAP BW/4HANA data types (see Figure [4-27](#508424_1_En_4_Chapter.xhtml#Fig27)).


    ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig27_HTML.jpg](images/508424_1_En_4_Chapter/508424_1_En_4_Fig27_HTML.jpg)


    Figure 4-27.


    Output structure of ZDS_FACT_ORDERS


    Now as we have a Data Source object created, in the next step I will generate
    an ADSO together with the Transformation and DTP objects. ADSO will be a target
    object to store the output of the underlying calculation view. Click the Generate
    Dataflow button again to create an ADSO (Figure [4-28](#508424_1_En_4_Chapter.xhtml#Fig28)).


    ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig28_HTML.jpg](images/508424_1_En_4_Chapter/508424_1_En_4_Fig28_HTML.jpg)


    Figure 4-28.


    Generating an ADSO for the ZFCT01 Open ODS View object


    Similarly, as in the previous step, after clicking the button, a new window pop
    ups. This time we need to provide the name of the target ADSO, where we will be
    loading the Orders data. Once you proceed, the system will create a new ADSO object.
    This object will now be used as a source for the ZFCT01 Open ODS View, replacing
    the former ZDS_FACT_ORDERS data source. You can now activate the ZFCT01 Open ODS
    View.


    ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig29_HTML.jpg](images/508424_1_En_4_Chapter/508424_1_En_4_Fig29_HTML.jpg)


    Figure 4-29.


    Overview of generated objects for Orders data persistent structure


    As shown in Figure [4-29](#508424_1_En_4_Chapter.xhtml#Fig29), in the Project
    Explorer you can see that in addition to the ZSTG01 ADSO object, the system automatically
    generated the transformation and DTP as well. By default the system creates the
    ADSO with the Staging DataStore Object type and the Compress Data option selected
    (for detailed information about ADSO types, check Chapter [1](#508424_1_En_1_Chapter.xhtml)).
    If needed, you can manually adjust the ADSO settings according to your requirements.
    The output structure of the generated ADSO corresponds to the structure of the
    underlying ZDS_FACT_ORDERS data source (Figure [4-30](#508424_1_En_4_Chapter.xhtml#Fig30)).


    ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig30_HTML.jpg](images/508424_1_En_4_Chapter/508424_1_En_4_Fig30_HTML.jpg)


