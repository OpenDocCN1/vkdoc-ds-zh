    接下来，我们需要将两个投影节点的数据合并到单个数据集中。为此，我们将使用联合节点。从调色板添加联合节点后，我们需要创建一个目标结构，用于映射来自底层投影的字段。我们将使用表
    6-2 作为创建目标结构和在联合节点中分配正确数据类型的参考。图 6-11 介绍了定义联合节点目标结构的步骤。


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig11_HTML.jpg](img/508424_1_En_6_Fig11_HTML.jpg)


    **图 6-11.** 在 `CV_DIM_PRODUCTS_ALL` 计算视图中定义联合节点的目标结构


    要添加联合节点，您可以将联合图标从调色板拖到编辑器视图（1）。要定义联合的目标结构，请选择联合节点并单击 *创建目标* 按钮（2）。然后定义目标字段并分配适当的数据类型（3）。由于我们在创建视图之前已经分析了目标结构，现在我们可以根据表
    6-2 轻松定义所有字段及其属性。结构定义完成后，我们可以通过单击 *确定* 按钮（4）来确认。通过此活动，我们创建了合并产品维度的目标结构。现在，我们需要将来自底层投影的字段映射到目标结构。图
    6-12 显示了联合节点的目标映射。


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig12_HTML.jpg](img/508424_1_En_6_Fig12_HTML.jpg)


    **图 6-12.** 在 `CV_DIM_PRODUCTS_ALL` 计算视图中定义联合节点的字段映射


    要正确地将源字段映射到目标字段，我们可以参考表 6-1。要将源字段映射到目标字段，只需拖放它们即可。


    **重要**


    定义关联时，应始终从与目标字段具有相同数据类型的源字段开始映射。否则，系统将继承第一个映射的字段的数据类型，并覆盖我们的初始设置。


    如上所述，我们应该始终从具有“主导”数据类型的字段开始映射。例如，对于 `PRODUCT_ID` 目标字段，我们应该首先映射来自 *Projection_1*
    的 `ZMATID` 字段，然后映射来自 *Projection_2* 的 `PRODUCT_ID` 字段。如果我们首先映射来自 *Projection_2*
    的 `PRODUCT_ID`，则目标 `PRODUCT_ID` 将继承该字段的数据类型，即 `VARCHAR(10)`，而不是 `VARCHAR(18)`。


    还请记住，并非所有目标字段都将有两个数据源的赋值。像 `CATEGORY_ID`、`BRAND_DESC` 和 `CREATED_ON` 这样的字段将只有一个来自数据源的赋值。除了来自两个数据源的字段之外，最好再有一个字段来帮助标识特定记录的源系统。为此，我们可以在目标结构中添加
    `SOURCE` 字段。然后，通过右键单击该字段，我们可以指定映射（图 6-13）。


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig13_HTML.jpg](img/508424_1_En_6_Fig13_HTML.jpg)


    **图 6-13.** 在 `CV_DIM_PRODUCTS_ALL` 计算视图的联合节点中添加 `SOURCE` 字段

