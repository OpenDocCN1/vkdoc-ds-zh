- fmt: '# Publish HANA Views Through BW/4HANA


    Case Study 2


    After providing the query `ZCPEXT01_Q01` to the business users, they validated
    the output and came back with two additional requirements.


    **Requirement 1:** The first requirement is to add a column displaying text for
    order statuses. To get the status name, it is required to use an additional `ORDER_STATUS`
    table. This dimension table helps to look up a status description for given order
    status IDs. In Table [3-3](#508424_1_En_3_Chapter.xhtml#Tab3), you will find details
    of the `ORDER_STATUS` table structure.


    Table 3-3. Structure of the `ORDER_STATUS` Table


    | Column Name | Key | Data Type | Description |

    | --- | --- | --- | --- |

    | `STATUS_ID` | X | `VARCHAR(3)` | Status ID |

    | `STATUS_DESC` |   | `VARCHAR(30)` | Status name |

    | `LANGU` |   | `VARCHAR(2)` | Language |


    Table `ORDER_STATUS` consists of three columns where `STATUS_ID` is a primary
    key.


    **Requirement 2:** A business user requested to add a new column to the report
    that will calculate the difference between the Delivery Date and Requested Delivery
    values in days.


    ## Create the Calculation View for the Order-Header Data


    As per Requirement 1 from Case Study 2, we need to combine two HANA tables. This
    can be achieved by leveraging the calculation view capabilities. The general approach
    that I will follow for this case study is illustrated in Figure [2-5](#508424_1_En_2_Chapter.xhtml#Fig5)
    of Chapter [2](#508424_1_En_2_Chapter.xhtml). Unlike in Figure [2-5](#508424_1_En_2_Chapter.xhtml#Fig5),
    the calculation view will query data only from persistent HANA tables (virtual
    tables will not be used). Figure [3-16](#508424_1_En_3_Chapter.xhtml#Fig16) shows
    the objects that I will be using to fulfill the requirements from Case Study 2.


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig16_HTML.jpg](images/508424_1_En_3_Chapter/508424_1_En_3_Fig16_HTML.jpg)


    Figure 3-16. Publishing HANA views through BW/4HANA (Case Study 2)


    Two HANA tables will be joined on the calculation view level. Then the existing
    Open ODS View object will be updated by changing the underlying data source and
    adding new fields.


    To join the `ORDER_HEADER` and `ORDER_STATUS` tables, I created the `CV_ORDER_HEADER`
    calculation view (see Figure [3-17](#508424_1_En_3_Chapter.xhtml#Fig17)).


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig17_HTML.jpg](images/508424_1_En_3_Chapter/508424_1_En_3_Fig17_HTML.jpg)


    Figure 3-17. `CV_ORDER_HEADER` calculation view definition


    As shown in Figure [3-17](#508424_1_En_3_Chapter.xhtml#Fig17), two Projection
    nodes are pointing to the required HANA tables. They are linked using the Join
    node. Join is performed based on the `STATUS` (`ORDER_HEADER` table) and `STATUS_ID`
    columns (`ORDER_STATUS` table). From `Projection_1`, all fields are mapped to
    the output, while from `Projection_2` only the `STATUS_DESC` column is selected.
    On the `Projection_2` node you might notice the filter icon displayed. This is
    because there is a fixed filter for the Language column to display status descriptions
    in English only (`LANGU = ''E''`).


    The second requirement was to add a column for calculating the difference between
    the requested delivery date and the actual delivery date. In the Join node, I
    created a calculated column with the following SQL syntax:


    ```

    CASE WHEN "STATUS_DESC" = ''Delivered''

    THEN  days_between("REQ_DATE", "DELV_DATE") END

    ```


    This formula calculates the number of days between the requested delivery date
    (`REQ_DATE`) and the delivery date (`DELV_DATE`) for all records with an order
    status value equal to Delivered. The previous SQL formula is used in the Expression
    Editor of the `CM_DELV_DATE_DIFF` calculated column (Figure [3-18](#508424_1_En_3_Chapter.xhtml#Fig18)).


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig18_HTML.jpg](images/508424_1_En_3_Chapter/508424_1_En_3_Fig18_HTML.jpg)


    Figure 3-18. `CM_DELV_DATE_DIFF` calculated column definition


    The calculated column `CM_DELV_DATE_DIFF` is of the `INTEGER` data type. The language
    for the Expression Editor is set to SQL, as the formula is written in SQL. After
    providing the expression, it is worth checking whether the syntax has any errors
    by clicking the Validate Syntax button. If the formula is correct, after clicking
    this button you should see a "Valid Expression" message.


    > **Note**: The Expression Editor does not recognize all SQL functions; hence,
    it might highlight the syntax as an error even though it is valid. This refers
    to SQL functions that are not available in the Functions list of the Expression
    Editor. Please also be aware that not all SQL functions can be used in graphical
    views.


    ## Change the Source Object for the Order-Header Open ODS View


    By using the Open ODS View functionality, for `ZEXTORD01` we can now easily replace
    the `ORDER_HEADER` table with the `CV_ORDER_HEADER` calculation view. To do this,
    I will open the `ZEXTORD01` Open ODS View and on the General tab click the Edit
    button to select the new source object. Then I need to choose the source system,
    which points to the `_SYS_BIC` schema (this is where the database column views
    for calculation views are stored). When the source system is selected, type the
    calculation view name, select the proper entry, and click Finish (Figure [3-19](#508424_1_En_3_Chapter.xhtml#Fig19)).


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig19_HTML.jpg](images/508424_1_En_3_Chapter/508424_1_En_3_Fig19_HTML.jpg)


    Figure 3-19. Changing the source object for the `ZEXTORD01` Open ODS View


    Once the source object is replaced, the Semantics section of the General tab should
    be updated with the new object name. In the Facts tab, the fields that were not
    yet added to the output will be highlighted in gray, as in Figure [3-20](#508424_1_En_3_Chapter.xhtml#Fig20).


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig20_HTML.jpg](images/508424_1_En_3_Chapter/508424_1_En_3_Fig20_HTML.jpg)


    Figure 3-20. Open ODS View for the `CV_ORDER_HEADER` View, Facts tab


    On the Facts tab I need to add two new fields that were requested by the user:
    Status Name and Requested Date vs. Delivery Date (Days). Status Name is an attribute;
    hence, it should go under the Characteristics folder, while Requested Date vs.
    Delivery Date (Days) is a measure, so it should be dragged under Key Figures folder.
    When the target structure of the Open ODS View is defined, I can activate the
    Open ODS View.


    ## Update the CompositeProvider for the Order-Header Data


    There are two remaining objects that require a structure update: the `ZCPEXT01`
    CompositeProvider object and the `ZCPEXT01_Q01` Query object. Since I added two
    new fields to the `ZEXTORD01` Open ODS View, they should already be available
    in the Source section of the `ZCPEXT01` CompositeProvider (Figure [3-21](#508424_1_En_3_Chapter.xhtml#Fig21)).


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig21_HTML.jpg](images/508424_1_En_3_Chapter/508424_1_En_3_Fig21_HTML.jpg)


    Figure 3-21. Adding new fields to the `ZCPEXT01` CompositeProvider structure


    As shown in Figure [3-21](#508424_1_En_3_Chapter.xhtml#Fig21), new ODS fields
    (Status Name and Requested Date vs. Delivery Date (Days)) are available in the
    Source section. To add them to the final structure, drag and drop them from the
    Source section to the Target section. Then activate the CompositeProvider.


    > **Note**: If you see a "column view" error during CompositeProvider activation,
    run again the `RSDDB_LOGINDEX_CREATE` program for the underlying Open ODS View
    to create a column view (see Figure [3-12](#508424_1_En_3_Chapter.xhtml#Fig12)).'
  raw: '## Publish HANA Views Through BW/4HANA


    Case Study 2


    After providing the query ZCPEXT01_Q01 to the business users, they validated the
    output and came back with two additional requirements.


    **Requirement 1:** The first requirement is to add a column displaying text for
    order statuses. To get the status name, it is required to use an additional ORDER_STATUS
    table. This dimension table helps to look up a status description for given order
    status IDs. In Table [3-3](#508424_1_En_3_Chapter.xhtml#Tab3), you will find details
    of the ORDER_STATUS table structure.


    Table 3-3.


    Structure of the ORDER_STATUS Table


    | Column Name | Key | Data Type | Description |

    | --- | --- | --- | --- |

    | STATUS_ID | X | VARCHAR(3) | Status ID |

    | STATUS_DESC |   | VARCHAR(30) | Status name |

    | LANGU |   | VARCHAR(2) | Language |


    Table ORDER_STATUS consists of three columns where STATUS_ID is a primary key.


    **Requirement 2:** A business user requested to add a new column to the report
    that will calculate the difference between the Delivery Date and Requested Delivery
    values in days.


    ### Create the Calculation View for the Order-Header Data


    As per Requirement 1 from Case Study 2, we need to combine two HANA tables. This
    can be achieved by leveraging the calculation view capabilities. The general approach
    that I will follow for this case study is illustrated in Figure [2-5](#508424_1_En_2_Chapter.xhtml#Fig5)
    of Chapter [2](#508424_1_En_2_Chapter.xhtml). Unlike in Figure [2-5](#508424_1_En_2_Chapter.xhtml#Fig5),
    the calculation view will query data only from persistent HANA tables (virtual
    tables will not be used). Figure [3-16](#508424_1_En_3_Chapter.xhtml#Fig16) shows
    the objects that I will be using to fulfill the requirements from Case Study 2.


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig16_HTML.jpg](images/508424_1_En_3_Chapter/508424_1_En_3_Fig16_HTML.jpg)


    Figure 3-16.


    Publishing HANA views through BW/4HANA (Case Study 2)


    Two HANA tables will be joined on the calculation view level. Then the existing
    Open ODS View object will be updated by changing the underlying data source and
    adding new fields.


    To join the ORDER_HEADER and ORDER_STATUS tables, I created the CV_ORDER_HEADER
    calculation view (see Figure [3-17](#508424_1_En_3_Chapter.xhtml#Fig17)).


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig17_HTML.jpg](images/508424_1_En_3_Chapter/508424_1_En_3_Fig17_HTML.jpg)


    Figure 3-17.


    CV_ORDER_HEADER calculation view definition


    As shown in Figure [3-17](#508424_1_En_3_Chapter.xhtml#Fig17), two Projection
    nodes are pointing to the required HANA tables. They are linked using the Join
    node. Join is performed based on the STATUS (ORDER_HEADER table) and STATUS_ID
    columns (ORDER_STATUS table). From Projection_1, all fields are mapped to the
    output, while from Projection_2 only the STATUS_DESC column is selected. On the
    Projection_2 node you might notice the filter icon displayed. This is because
    there is a fixed filter for the Language column to display status descriptions
    in English only (LANGU = ‘E’).


    The second requirement was to add a column for calculating the difference between
    the requested delivery date and the actual delivery date. In the Join node, I
    created a calculated column with the following SQL syntax:


    ```

    CASE WHEN "STATUS_DESC" = ''Delivered''

    THEN  days_between("REQ_DATE", "DELV_DATE") END

    ```


    This formula calculates the number of days between the requested delivery date
    (REQ_DATE) and the delivery date (DELV_DATE) for all records with an order status
    value equal to Delivered. The previous SQL formula is used in the Expression Editor
    of the CM_DELV_DATE_DIFF calculated column (Figure [3-18](#508424_1_En_3_Chapter.xhtml#Fig18)).


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig18_HTML.jpg](images/508424_1_En_3_Chapter/508424_1_En_3_Fig18_HTML.jpg)


    Figure 3-18.


    CM_DELV_DATE_DIFF calculated column definition


    The calculated column CM_DELV_DATE_DIFF is of the INTEGER data type. The language
    for the Expression Editor is set to SQL, as the formula is written in SQL. After
    providing the expression, it is worth checking whether the syntax has any errors
    by clicking the Validate Syntax button. If the formula is correct, after clicking
    this button you should see a “Valid Expression” message.


    Note


    The Expression Editor does not recognize all SQL functions; hence, it might highlight
    the syntax as an error even though it is valid. This refers to SQL functions that
    are not available in the Functions list of the Expression Editor. Please also
    be aware that not all SQL functions can be used in graphical views.


    ### Change the Source Object for the Order-Header Open ODS View


    By using the Open ODS View functionality, for ZEXTORD01 we can now easily replace
    the ORDER_HEADER table with the CV_ORDER_HEADER calculation view. To do this,
    I will open the ZEXTORD01 Open ODS View and on the General tab click the Edit
    button to select the new source object. Then I need to choose the source system,
    which points to the _SYS_BIC schema (this is where the database column views for
    calculation views are stored). When the source system is selected, type the calculation
    view name, select the proper entry, and click Finish (Figure [3-19](#508424_1_En_3_Chapter.xhtml#Fig19)).


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig19_HTML.jpg](images/508424_1_En_3_Chapter/508424_1_En_3_Fig19_HTML.jpg)


    Figure 3-19.


    Changing the source object for the ZEXTORD01 Open ODS View


    Once the source object is replaced, the Semantics section of the General tab should
    be updated with the new object name. In the Facts tab, the fields that were not
    yet added to the output will be highlighted in gray, as in Figure [3-20](#508424_1_En_3_Chapter.xhtml#Fig20).


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig20_HTML.jpg](images/508424_1_En_3_Chapter/508424_1_En_3_Fig20_HTML.jpg)


    Figure 3-20.


    Open ODS View for the CV_ORDER_HEADER View, Facts tab


    On the Facts tab I need to add two new fields that were requested by the user:
    Status Name and Requested Date vs. Delivery Date (Days). Status Name is an attribute;
    hence, it should go under the Characteristics folder, while Requested Date vs.
    Delivery Date (Days) is a measure, so it should be dragged under Key Figures folder.
    When the target structure of the Open ODS View is defined, I can activate the
    Open ODS View.


    ### Update the CompositeProvider for the Order-Header Data


    There are two remaining objects that require a structure update: the ZCPEXT01
    CompositeProvider object and the ZCPEXT01_Q01 Query object. Since I added two
    new fields to the ZEXTORD01 Open ODS View, they should already be available in
    the Source section of the ZCPEXT01 CompositeProvider (Figure [3-21](#508424_1_En_3_Chapter.xhtml#Fig21)).


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig21_HTML.jpg](images/508424_1_En_3_Chapter/508424_1_En_3_Fig21_HTML.jpg)


    Figure 3-21.


    Adding new fields to the ZCPEXT01 CompositeProvider structure


    As shown in Figure [3-21](#508424_1_En_3_Chapter.xhtml#Fig21), new ODS fields
    (Status Name and Requested Date vs. Delivery Date (Days)) are available in the
    Source section. To add them to the final structure, drag and drop them from the
    Source section to the Target section. Then activate the CompositeProvider.


    Note


    If you see a “column view” error during CompositeProvider activation, run again
    the RSDDB_LOGINDEX_CREATE program for the underlying Open ODS View to create a
    column view (see Figure [3-12](#508424_1_En_3_Chapter.xhtml#Fig12)).'
  trans: '

    # 通过 BW/4HANA 发布 HANA 视图


    案例研究 2


    向业务用户提供查询 `ZCPEXT01_Q01` 后，他们验证了输出结果并提出了两个额外要求。


    **要求 1：** 第一个要求是添加一列，用于显示订单状态的文本。要获取状态名称，需要使用额外的 `ORDER_STATUS` 表。此维度表有助于根据给定的订单状态
    ID 查找状态描述。在表 3-3 中，您将找到 `ORDER_STATUS` 表结构的详细信息。


    表 3-3. `ORDER_STATUS` 表的结构


    | 列名 | 键 | 数据类型 | 描述 |

    | --- | --- | --- | --- |

    | `STATUS_ID` | X | `VARCHAR(3)` | 状态 ID |

    | `STATUS_DESC` |   | `VARCHAR(30)` | 状态名称 |

    | `LANGU` |   | `VARCHAR(2)` | 语言 |


    `ORDER_STATUS` 表由三列组成，其中 `STATUS_ID` 是主键。


    **要求 2：** 一位业务用户请求在报表中添加一个新列，用于计算交货日期与请求交货日期之间的天数差。


    ## 为订单头数据创建计算视图


    根据案例研究 2 的要求 1，我们需要合并两个 HANA 表。这可以通过利用计算视图的功能来实现。我将为本案例研究遵循的通用方法在第 2 章的图 2-5 中进行了说明。与图
    2-5 不同，计算视图将仅从持久化 HANA 表中查询数据（将不使用虚拟表）。图 3-16 显示了我将用于满足案例研究 2 要求的对象。


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig16_HTML.jpg](img/508424_1_En_3_Fig16_HTML.jpg)


    图 3-16. 通过 BW/4HANA 发布 HANA 视图（案例研究 2）


    两个 HANA 表将在计算视图级别进行连接。然后，通过更改底层数据源并添加新字段来更新现有的开放 ODS 视图对象。


    为了连接 `ORDER_HEADER` 和 `ORDER_STATUS` 表，我创建了 `CV_ORDER_HEADER` 计算视图（见图 3-17）。


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig17_HTML.jpg](img/508424_1_En_3_Fig17_HTML.jpg)


    图 3-17. `CV_ORDER_HEADER` 计算视图定义


    如图 3-17 所示，两个投影节点指向所需的 HANA 表。它们通过连接节点进行链接。连接基于 `STATUS`（`ORDER_HEADER` 表）和 `STATUS_ID`
    列（`ORDER_STATUS` 表）执行。来自 `Projection_1` 的所有字段都映射到输出，而来自 `Projection_2` 的仅选择 `STATUS_DESC`
    列。在 `Projection_2` 节点上，您可能会注意到显示的过滤器图标。这是因为为了仅显示英文状态描述，对语言列设置了固定过滤器（`LANGU = ''E''`）。


    第二个要求是添加一列用于计算请求交货日期与实际交货日期之间的差值。在连接节点中，我使用以下 SQL 语法创建了一个计算列：


    ```

    CASE WHEN "STATUS_DESC" = ''Delivered''

    THEN  days_between("REQ_DATE", "DELV_DATE") END

    ```


    此公式计算所有订单状态值为“已交货”的记录中请求交货日期 (`REQ_DATE`) 与交货日期 (`DELV_DATE`) 之间的天数。上述 SQL 公式在
    `CM_DELV_DATE_DIFF` 计算列的表达式编辑器中使用（图 3-18）。


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig18_HTML.jpg](img/508424_1_En_3_Fig18_HTML.jpg)


    图 3-18. `CM_DELV_DATE_DIFF` 计算列定义


    计算列 `CM_DELV_DATE_DIFF` 的数据类型为 `INTEGER`。表达式编辑器的语言设置为 SQL，因为公式是用 SQL 编写的。提供表达式后，值得通过单击“验证语法”按钮检查语法是否有任何错误。如果公式正确，点击此按钮后，您应该会看到一条“有效表达式”消息。


    > **注意**：表达式编辑器无法识别所有 SQL 函数；因此，即使语法有效，它也可能将其突出显示为错误。这指的是表达式编辑器函数列表中不可用的 SQL 函数。另请注意，并非所有
    SQL 函数都可以在图形化视图中使用。


    ## 更改订单头开放 ODS 视图的源对象


    通过使用开放 ODS 视图功能，对于 `ZEXTORD01`，我们现在可以轻松地将 `ORDER_HEADER` 表替换为 `CV_ORDER_HEADER`
    计算视图。为此，我将打开 `ZEXTORD01` 开放 ODS 视图，在“常规”选项卡上单击“编辑”按钮以选择新的源对象。然后我需要选择源系统，该源系统指向
    `_SYS_BIC` 模式（这是存储计算视图的数据库列视图的位置）。选择源系统后，键入计算视图名称，选择正确的条目，然后单击“完成”（图 3-19）。


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig19_HTML.jpg](img/508424_1_En_3_Fig19_HTML.jpg)


    图 3-19. 更改 `ZEXTORD01` 开放 ODS 视图的源对象


    一旦源对象被替换，“常规”选项卡的“语义”部分应更新为新的对象名称。在“事实”选项卡中，尚未添加到输出的字段将以灰色突出显示，如图 3-20 所示。


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig20_HTML.jpg](img/508424_1_En_3_Fig20_HTML.jpg)


    图 3-20. `CV_ORDER_HEADER` 视图的开放 ODS 视图，“事实”选项卡


    在“事实”选项卡上，我需要添加用户请求的两个新字段：状态名称和请求日期与交货日期（天数）。状态名称是一个属性；因此，它应放在“特征”文件夹下，而请求日期与交货日期（天数）是一个度量，因此应将其拖到“关键值”文件夹下。定义了开放
    ODS 视图的目标结构后，我可以激活该开放 ODS 视图。


    ## 更新订单头数据的 CompositeProvider


    还有两个对象需要结构更新：`ZCPEXT01` CompositeProvider 对象和 `ZCPEXT01_Q01` 查询对象。由于我向 `ZEXTORD01`
    开放 ODS 视图添加了两个新字段，它们应该已经在 `ZCPEXT01` CompositeProvider 的“源”部分可用（图 3-21）。


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig21_HTML.jpg](img/508424_1_En_3_Fig21_HTML.jpg)


    图 3-21. 向 `ZCPEXT01` CompositeProvider 结构添加新字段


    如图 3-21 所示，新的 ODS 字段（状态名称和请求日期与交货日期（天数））在“源”部分可用。要将它们添加到最终结构中，请将它们从“源”部分拖放到“目标”部分。然后激活
    CompositeProvider。


    > **注意**：如果在激活 CompositeProvider 时看到“列视图”错误，请为基础开放 ODS 视图再次运行 `RSDDB_LOGINDEX_CREATE`
    程序以创建列视图（参见图 3-12）。

    '
- fmt: '### Update the Query for the Order-Header Data


    The final step for Case Study 2 is to include new fields in the `ZCPEXT01_Q01`
    query. Figure [3-22](#508424_1_En_3_Chapter.xhtml#Fig22) presents the final definition
    of the `ZCPEXT01_Q01` query.


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig22_HTML.jpg](images/508424_1_En_3_Chapter/508424_1_En_3_Fig22_HTML.jpg)


    *Figure 3-22.* Adding new fields to the `ZCPEXT01_Q01` query definition


    The `Status Name` characteristic is added to the Rows section, while the `Requested
    Date vs. Delivery Date (Days)` key figure is placed in the Columns section. After
    running the query, by default all fields will be displayed in the output. The
    user can adjust the report structure according to the needs. Figure [3-23](#508424_1_En_3_Chapter.xhtml#Fig23)
    displays the updated output of the `ZCPEXT01_Q01` query.


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig23_HTML.jpg](images/508424_1_En_3_Chapter/508424_1_En_3_Fig23_HTML.jpg)


    *Figure 3-23.* New fields of the `ZCPEXT01_Q01` query in Analysis for Microsoft
    Excel


    The `Analysis for Microsoft Excel` Design panel, shown on the right side of Figure
    [3-23](#508424_1_En_3_Chapter.xhtml#Fig23), presents a list of all the available
    fields defined on the query level. On the left side there is the actual output.
    For demonstration purposes, I limited the output to five characteristics and one
    key figure. As you can see, now the user can see a descriptive value of the order
    status by checking the values in the `Status Name` column. Moreover, a new key
    figure gives information about the difference between the requested delivery date
    and the delivery date. Thanks to this information, the business user can easily
    identify orders for which delivery was significantly delayed, as well as identify
    those delivered on time.


    ### Pass the Input Parameters from a Query to a Calculation View


    **Case Study 3**


    Business users requested the ability to select the display language for status
    names before running the report. When opening the report, the user should be prompted
    to choose a `Language Variable` value. According to the entered value, in the
    output of the report, the `Status Name` column should display the text in the
    proper language.


    #### Create Input Parameters for the Order-Header Calculation View


    The most straightforward approach to fulfill requirement from Case Study 3 is
    to add the `Language` field to the output structure of the query and then create
    a variable on top of that field. For the given scenario, this approach is sufficient,
    because the underlying calculation view is simple, and it does not process huge
    data volumes and complex logic with many tables; hence, performance will not be
    impacted. Nevertheless, there might be a scenario when the source calculation
    view is much more complex and needs to handle operations on very big tables. In
    such a case, the HANA engine might not be able to push down the filter to the
    data foundation level of the view. This may significantly impact the performance.


    To ensure that the value entered on the selection screen is pushed down to the
    table level, I will create an input parameter on the calculation view level and
    then map it to the query variable. Let’s now open the `CV_ORDER_HEADER` calculation
    view and select the `Projection` node, which points to the `ORDER_STATUS` table.
    To create a new input parameter, go to the Output section, right-click the `Input
    Parameters` folder, and select **New** (Figure [3-24](#508424_1_En_3_Chapter.xhtml#Fig24)).


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig24_HTML.jpg](images/508424_1_En_3_Chapter/508424_1_En_3_Fig24_HTML.jpg)


    *Figure 3-24.* Adding a `Language` parameter to the `CV_ORDER_HEADER` calculation
    view


    When adding a new input parameter, the system will open the **New Input Parameter**
    window. Here we can configure the properties of the parameter. Figure [3-25](#508424_1_En_3_Chapter.xhtml#Fig25)
    shows the properties of the `Language` input parameter.


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig25_HTML.jpg](images/508424_1_En_3_Chapter/508424_1_En_3_Fig25_HTML.jpg)


    *Figure 3-25.* Adding a `Language` parameter to the `CV_ORDER_HEADER` calculation
    view


    As shown in Figure [3-25](#508424_1_En_3_Chapter.xhtml#Fig25), the technical name
    of the given input parameter was set to `IP_LANGU`. For `Parameter Type`, I selected
    the `Static List` option. This means that for the `Parameter value`’s help, I
    need to define a list of fixed values. This list is specified in the **List of
    values** section. In the given example, I entered two values into the list: `E`
    for English and `D` for German. The `Is Mandatory` check box indicates that the
    input parameter’s value needs to be provided to be able to run the report. The
    data type was set to `VARCHAR` with a length of `2`. This type corresponds to
    the source data type of the `Language` column. Now we need to link the input parameter
    with the `LANGU` column filter. Right-click the `LANGU` column and select **Edit
    Filter** or **Apply Filter** (depending on whether filter was previously applied
    on that column or not). Instead of filtering the `LANGU` column with the Fixed
    value, change the filter value type to `Input Parameters`. Then select the `IP_LANGU`
    parameter as a filter value (Figure [3-26](#508424_1_En_3_Chapter.xhtml#Fig26)).


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig26_HTML.jpg](images/508424_1_En_3_Chapter/508424_1_En_3_Fig26_HTML.jpg)


    *Figure 3-26.* Applying the `IP_LANGU` parameter as a column filter in the `CV_ORDER_HEADER`
    calculation view


    `IP_LANGU` is a single-value input parameter, so when filtering the `LANGU` column,
    we should use an `Equal` value for the filter operator. To validate the input
    parameter, activate your view and execute the calculation view. When previewing
    the view, you should be prompted with a parameters screen. The output of the view
    should display the `Status Name` text values according to the language selected
    for the input parameter.


    > **Note:** Open ODS Views do not support calculation views with input parameters.
    After adding the mandatory input parameters to the calculation view, it cannot
    be consumed by the Open ODS View anymore. This means that previously created BW/4HANA
    objects (Open ODS View, Composite Provider, and Query) will throw an error when
    trying to preview the data.


    #### Create the CompositeProvider for the Order-Header Data with Input Parameters


    If the input parameter works as expected, we can now switch to the SAP BW modeling
    perspective. First I will create a new `CompositeProvider`, which will source
    data directly from the `CV_ORDER_HEADER` calculation view. Figure [3-27](#508424_1_En_3_Chapter.xhtml#Fig27)
    presents the definition of the newly created `ZCPEXT02` `CompositeProvider`.


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig27_HTML.jpg](images/508424_1_En_3_Chapter/508424_1_En_3_Fig27_HTML.jpg)


    *Figure 3-27.* Defining the structure of the `ZCPEXT02` `CompositeProvider`


    Mapping between the source and target fields looks almost the same as in the `CompositeProvider`
    `ZCPEXT01` (presented in Figure [3-21](#508424_1_En_3_Chapter.xhtml#Fig21)). You
    might notice that there is one more field available in the `ZCPEXT02` `CompositeProvider`
    structure. This is the field representing the HANA input parameter (`IP_LANGU`),
    which was created in the `CV_ORDER_HEADER` calculation view. This `Input Parameter`
    field can be later used as a reference for a variable at the query level. When
    the `CompositeProvider` is active, we can then create a new query (`ZCPEXT02_Q01`)
    on top of it.'
  raw: '### Update the Query for the Order-Header Data


    The final step for Case Study 2 is to include new fields in the ZCPEXT01_Q01 query.
    Figure [3-22](#508424_1_En_3_Chapter.xhtml#Fig22) presents the final definition
    of the ZCPEXT01_Q01 query.


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig22_HTML.jpg](images/508424_1_En_3_Chapter/508424_1_En_3_Fig22_HTML.jpg)


    Figure 3-22.


    Adding new fields to the ZCPEXT01_Q01 query definition


    The Status Name characteristic is added to the Rows section, while the Requested
    Date vs. Delivery Date (Days) key figure is placed in the Columns section. After
    running the query, by default all fields will be displayed in the output. The
    user can adjust the report structure according to the needs. Figure [3-23](#508424_1_En_3_Chapter.xhtml#Fig23)
    displays the updated output of the ZCPEXT01_Q01 query.


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig23_HTML.jpg](images/508424_1_En_3_Chapter/508424_1_En_3_Fig23_HTML.jpg)


    Figure 3-23.


    New fields of the ZCPEXT01_Q01 query in Analysis for Microsoft Excel


    The Analysis for Microsoft Excel Design panel, shown on the right side of Figure
    [3-23](#508424_1_En_3_Chapter.xhtml#Fig23), presents a list of all the available
    fields defined on the query level. On the left side there is the actual output.
    For demonstration purposes, I limited the output to five characteristics and one
    key figure. As you can see, now the user can see a descriptive value of the order
    status by checking the values in the Status Name column. Moreover, a new key figure
    gives information about the difference between the requested delivery date and
    the delivery date. Thanks to this information, the business user can easily identify
    orders for which delivery was significantly delayed, as well as identify those
    delivered on time.


    ## Pass the Input Parameters from a Query to a Calculation View


    Case Study 3


    Business users requested the ability to select the display language for status
    names before running the report. When opening the report, the user should be prompted
    to choose a Language Variable value. According to the entered value, in the output
    of the report, the Status Name column should display the text in the proper language.


    ### Create Input Parameters for the Order-Header Calculation View


    The most straightforward approach to fulfill requirement from Case Study 3 is
    to add the Language field to the output structure of the query and then create
    a variable on top of that field. For the given scenario, this approach is sufficient,
    because the underlying calculation view is simple, and it does not process huge
    data volumes and complex logic with many tables; hence, performance will not be
    impacted. Nevertheless, there might be a scenario when the source calculation
    view is much more complex and needs to handle operations on very big tables. In
    such a case, the HANA engine might not be able to push down the filter to the
    data foundation level of the view. This may significantly impact the performance.


    To ensure that the value entered on the selection screen is pushed down to the
    table level, I will create an input parameter on the calculation view level and
    then map it to the query variable. Let’s now open the CV_ORDER_HEADER calculation
    view and select the Projection node, which points to the ORDER_STATUS table. To
    create a new input parameter, go to the Output section, right-click the Input
    Parameters folder, and select New (Figure [3-24](#508424_1_En_3_Chapter.xhtml#Fig24)).


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig24_HTML.jpg](images/508424_1_En_3_Chapter/508424_1_En_3_Fig24_HTML.jpg)


    Figure 3-24.


    Adding a Language parameter to the CV_ORDER_HEADER calculation view


    When adding a new input parameter, the system will open the New Input Parameter
    window. Here we can configure the properties of the parameter. Figure [3-25](#508424_1_En_3_Chapter.xhtml#Fig25)
    shows the properties of the Language input parameter.


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig25_HTML.jpg](images/508424_1_En_3_Chapter/508424_1_En_3_Fig25_HTML.jpg)


    Figure 3-25.


    Adding a Language parameter to the CV_ORDER_HEADER calculation view


    As shown in Figure [3-25](#508424_1_En_3_Chapter.xhtml#Fig25), the technical name
    of the given input parameter was set to IP_LANGU. For Parameter Type, I selected
    the Static List option. This means that for the Parameter value’s help, I need
    to define a list of fixed values. This list is specified in the “List of values”
    section. In the given example, I entered two values into the list: E for English
    and D for German. The Is Mandatory check box indicates that the input parameter’s
    value needs to be provided to be able to run the report. The data type was set
    to VARCHAR with a length of 2\. This type corresponds to the source data type
    of the Language column. Now we need to link the input parameter with the LANGU
    column filter. Right-click the LANGU column and select Edit Filter or Apply Filter
    (depending on whether filter was previously applied on that column or not). Instead
    of filtering the LANGU column with the Fixed value, change the filter value type
    to Input Parameters. Then select the IP_LANGU parameter as a filter value (Figure
    [3-26](#508424_1_En_3_Chapter.xhtml#Fig26)).


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig26_HTML.jpg](images/508424_1_En_3_Chapter/508424_1_En_3_Fig26_HTML.jpg)


    Figure 3-26.


    Applying the IP_LANGU parameter as a column filter in the CV_ORDER_HEADER calculation
    view


    IP_LANGU is a single-value input parameter, so when filtering the LANGU column,
    we should use an Equal value for the filter operator. To validate the input parameter,
    activate your view and execute the calculation view. When previewing the view,
    you should be prompted with a parameters screen. The output of the view should
    display the Status Name text values according to the language selected for the
    input parameter.


    Note


    Open ODS Views do not support calculation views with input parameters. After adding
    the mandatory input parameters to the calculation view, it cannot be consumed
    by the Open ODS View anymore. This means that previously created BW/4HANA objects
    (Open ODS View, Composite Provider, and Query) will throw an error when trying
    to preview the data.


    ### Create the CompositeProvider for the Order-Header Data with Input Parameters


    If the input parameter works as expected, we can now switch to the SAP BW modeling
    perspective. First I will create a new CompositeProvider, which will source data
    directly from the CV_ORDER_HEADER calculation view. Figure [3-27](#508424_1_En_3_Chapter.xhtml#Fig27)
    presents the definition of the newly created ZCPEXT02 CompositeProvider.


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig27_HTML.jpg](images/508424_1_En_3_Chapter/508424_1_En_3_Fig27_HTML.jpg)


    Figure 3-27.


    Defining the structure of the ZCPEXT02 CompositeProvider


    Mapping between the source and target fields looks almost the same as in the CompositeProvider
    ZCPEXT01 (presented in Figure [3-21](#508424_1_En_3_Chapter.xhtml#Fig21)). You
    might notice that there is one more field available in the ZCPEXT02 CompositeProvider
    structure. This is the field representing the HANA input parameter (IP_LANGU),
    which was created in the CV_ORDER_HEADER calculation view. This Input Parameter
    field can be later used as a reference for a variable at the query level. When
    the CompositeProvider is active, we can then create a new query (ZCPEXT02_Q01)
    on top of it.'
  trans: '

    ### 更新订单抬头数据的查询


    案例研究 2 的最后一步是在 `ZCPEXT01_Q01` 查询中包含新字段。图 3-22 展示了 `ZCPEXT01_Q01` 查询的最终定义。


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig22_HTML.jpg](img/508424_1_En_3_Fig22_HTML.jpg)


    *图 3-22.* 向 `ZCPEXT01_Q01` 查询定义中添加新字段


    `状态名称` 特性被添加到“行”区域，而`请求日期与交付日期之差（天）`关键值被放置在“列”区域。运行查询后，默认情况下所有字段都会显示在输出中。用户可以根据需要调整报表结构。图
    3-23 显示了 `ZCPEXT01_Q01` 查询更新后的输出。


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig23_HTML.jpg](img/508424_1_En_3_Fig23_HTML.jpg)


    *图 3-23.* 在 Analysis for Microsoft Excel 中 `ZCPEXT01_Q01` 查询的新字段


    `Analysis for Microsoft Excel` 设计面板（如图 3-23 右侧所示）列出了在查询级别定义的所有可用字段。左侧是实际的输出。出于演示目的，我将输出限制为五个特性和一个关键值。如您所见，现在用户可以通过查看`状态名称`列中的值来了解订单状态的描述性描述。此外，一个新的关键值提供了有关请求交付日期与实际交付日期之间差异的信息。借助这些信息，业务用户可以轻松识别交付严重延迟的订单，以及那些按时交付的订单。


    ### 将输入参数从查询传递到计算视图


    **案例研究 3**


    业务用户要求在运行报表之前能够选择状态名称的显示语言。打开报表时，应提示用户选择一个`语言变量`值。根据输入的值，报表输出中的`状态名称`列应以相应的语言显示文本。


    #### 为订单抬头计算视图创建输入参数


    满足案例研究 3 要求的最直接方法是将`语言`字段添加到查询的输出结构中，然后在该字段之上创建一个变量。对于给定的场景，这种方法就足够了，因为底层的计算视图很简单，并且不处理大量数据和涉及多个表的复杂逻辑；因此，性能不会受到影响。然而，可能存在源计算视图复杂得多并且需要处理对非常大的表的操作的情况。在这种情况下，HANA
    引擎可能无法将筛选条件下推到视图的数据基础层。这可能会严重影响性能。


    为了确保在选择屏幕上输入的值能够被下推到表级别，我将在计算视图级别创建一个输入参数，然后将其映射到查询变量。现在，让我们打开 `CV_ORDER_HEADER`
    计算视图，并选择指向 `ORDER_STATUS` 表的 `Projection` 节点。要创建一个新的输入参数，请转到“输出”部分，右键单击`输入参数`文件夹，然后选择**新建**（图
    3-24）。


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig24_HTML.jpg](img/508424_1_En_3_Fig24_HTML.jpg)


    *图 3-24.* 向 `CV_ORDER_HEADER` 计算视图添加一个`语言`参数


    添加新的输入参数时，系统将打开**新输入参数**窗口。我们可以在此处配置参数的属性。图 3-25 显示了`语言`输入参数的属性。


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig25_HTML.jpg](img/508424_1_En_3_Fig25_HTML.jpg)


    *图 3-25.* 向 `CV_ORDER_HEADER` 计算视图添加一个`语言`参数


    如图 3-25 所示，该输入参数的技术名称设置为 `IP_LANGU`。对于`参数类型`，我选择了`静态列表`选项。这意味着对于`参数值`的帮助，我需要定义一个固定值的列表。此列表在**值列表**部分中指定。在给定的示例中，我在列表中输入了两个值：`E`代表英语，`D`代表德语。`是否必填`复选框表示需要提供输入参数的值才能运行报表。数据类型设置为长度为
    `2` 的 `VARCHAR`。此类型对应于 `语言` 列的源数据类型。现在我们需要将输入参数与 `LANGU` 列筛选器链接起来。右键单击 `LANGU`
    列，然后选择**编辑筛选器**或**应用筛选器**（取决于之前是否在该列上应用了筛选器）。不要使用固定值筛选 `LANGU` 列，而是将筛选器值类型更改为`输入参数`。然后选择
    `IP_LANGU` 参数作为筛选器值（图 3-26）。


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig26_HTML.jpg](img/508424_1_En_3_Fig26_HTML.jpg)


    *图 3-26.* 在 `CV_ORDER_HEADER` 计算视图中将 `IP_LANGU` 参数应用为列筛选器


    `IP_LANGU` 是一个单值输入参数，因此在筛选 `LANGU` 列时，我们应该使用`等于`值作为筛选运算符。要验证输入参数，请激活您的视图并执行计算视图。预览视图时，系统应提示您进入一个参数屏幕。视图的输出应根据为输入参数选择的语言显示`状态名称`文本值。


    > **注意：** Open ODS 视图不支持带有输入参数的计算视图。向计算视图添加必填输入参数后，它将无法再被 Open ODS 视图使用。这意味着先前创建的
    BW/4HANA 对象（Open ODS 视图、CompositeProvider 和查询）在尝试预览数据时将抛出错误。


    #### 为带有输入参数的订单抬头数据创建 CompositeProvider


    如果输入参数按预期工作，我们现在可以切换到 SAP BW 建模视角。首先我将创建一个新的 `CompositeProvider`，它将直接从 `CV_ORDER_HEADER`
    计算视图获取数据。图 3-27 展示了新创建的 `ZCPEXT02` `CompositeProvider` 的定义。


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig27_HTML.jpg](img/508424_1_En_3_Fig27_HTML.jpg)


    *图 3-27.* 定义 `ZCPEXT02` `CompositeProvider` 的结构


    源字段和目标字段之间的映射看起来与 `CompositeProvider` `ZCPEXT01` 中的映射几乎相同（如图 3-21 所示）。您可能会注意到，`ZCPEXT02`
    `CompositeProvider` 结构中多了一个字段。这个字段代表在 `CV_ORDER_HEADER` 计算视图中创建的 HANA 输入参数 (`IP_LANGU`)。此`输入参数`字段稍后可用作查询级别变量的引用。当
    `CompositeProvider` 激活后，我们可以在其之上创建一个新的查询 (`ZCPEXT02_Q01`)。

    '
- fmt: '### Create the Query for the Order-Header Data with Input Parameters


    The output structure (on the Sheet Definition tab) of the `ZCPEXT02_Q01` query
    will be the same as in the previous scenario (see Figure [3-22](#508424_1_En_3_Chapter.xhtml#Fig22)
    for reference). The mapping between the calculation view’s input parameter and
    query’s variable will be defined on the Filter tab of the query.


    **Note:** You should not add input parameter fields to any section within the
    Sheet Definition tab because when running the query, you would get an error. Input
    parameter fields are not permitted for navigation; they should be used only for
    filtering.


    As a first step, I will add the Language input parameter to the Filter: Fixed
    Values section. To do so, right-click the Filter: Fixed Values area and select
    the Add Characteristic option. Then browse for the input parameter name, select
    it, and click the OK button (Figure [3-28](#508424_1_En_3_Chapter.xhtml#Fig28)).


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig28_HTML.jpg](images/508424_1_En_3_Chapter/508424_1_En_3_Fig28_HTML.jpg)


    *Figure 3-28. Adding the input parameter field to the Filter section of the `ZCPEXT02_Q01`
    query*


    Once the input parameter is added to the Filter section, we need to create a Language
    query variable. Before doing that, copy to the clipboard the technical name of
    the input parameter (in my case it is `4ZCPEXT02-IP_LANGU`). Then go to the Project
    Explorer and select New ➤ Variable (see Figure [3-29](#508424_1_En_3_Chapter.xhtml#Fig29)).


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig29_HTML.jpg](images/508424_1_En_3_Chapter/508424_1_En_3_Fig29_HTML.jpg)


    *Figure 3-29. Adding a new query variable*


    When creating a new variable, the system will open the New Variable editor window.
    Here you need to provide a definition of the variable (Figure [3-30](#508424_1_En_3_Chapter.xhtml#Fig30)).


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig30_HTML.jpg](images/508424_1_En_3_Chapter/508424_1_En_3_Fig30_HTML.jpg)


    *Figure 3-30. Creating the `ZVAR_IP_LANGU` query variable*


    The technical name of the Input Parameter field, which we copied to the clipboard,
    should now be pasted to the Ref. Characteristic field. The Browse option provides
    functionality to search for InfoObjects only; hence, when using the field-based
    approach, we need to enter the field technical names manually. The variable properties
    should match the settings of the HANA input parameter, so in our case we need
    to make sure that the variable represents a Single Value type. After validating
    the general variable properties, click the Finish button to close the wizard and
    proceed with the variable’s detailed settings (Figure [3-31](#508424_1_En_3_Chapter.xhtml#Fig31)).


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig31_HTML.jpg](images/508424_1_En_3_Chapter/508424_1_En_3_Fig31_HTML.jpg)


    *Figure 3-31. Defining settings for the `ZVAR_IP_LANGU` variable*


    The calculation view input parameter is of a mandatory type, so the same setting
    should be applied for the query variable’s input type. In addition, on the Default
    Values tab we can set the default value for the Language variable. When the configuration
    is completed, save the variable and go back to the Query Filter definition. Now
    we can map the calculation view parameter to the query variable. Right-click the
    technical name of the input parameter and choose the Restrict option (Figure [3-32](#508424_1_En_3_Chapter.xhtml#Fig32)).


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig32_HTML.jpg](images/508424_1_En_3_Chapter/508424_1_En_3_Fig32_HTML.jpg)


    *Figure 3-32. Mapping the `4ZCPEXT02-IP_LANGU` input parameter field to the query
    variable*


    In the filter editor, select the proper variable (in my scenario it will be `ZVAR_IP_LANGU`)
    and add it to the Filter Definition section. Once you confirm the variable selection,
    you will see the variable in the Filter: Fixed Values section (as shown in Figure
    [3-32](#508424_1_En_3_Chapter.xhtml#Fig32)). Now we can save the query and run
    it to check the results. When opening the `ZCPEXT02_Q01` query in Analysis for
    Microsoft Excel, the selection screen opens (Figure [3-33](#508424_1_En_3_Chapter.xhtml#Fig33)).


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig33_HTML.jpg](images/508424_1_En_3_Chapter/508424_1_En_3_Fig33_HTML.jpg)


    *Figure 3-33. Analysis for Microsoft Excel prompting for the `ZCPEXT02_Q01` query*


    I set the default value for the Language variable (`ZVAR_IP_LANGU`) to `E`; therefore,
    when opening the report, the `E` value is already entered. When opening the Select
    Member window, we can see two values that were specified as a static list for
    the `IP_LANGU` input parameter at the calculation view level. Depending on the
    Language value selected, the user will see text for the Status Name column either
    in English or in German. The business requirement from Case Study 3 has been fulfilled.'
