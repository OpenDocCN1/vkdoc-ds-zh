    To add the Union node, you can drag the Union icon from the palette to the editor
    view (1). To define the target structure of the Union, select the Union node and
    click the *Create Target* button (2). Then define the target fields and assign
    the proper data types (3). Since we performed the analysis of the target structure
    before creating the view, now we can easily define all the fields and their properties
    based on Table [6-2](#508424_1_En_6_Chapter.xhtml#Tab2). Once the structure is
    defined, we can confirm it by clicking the *OK* button (4). With this activity
    we created a target structure of the consolidated Products dimension. Now we need
    to map fields from the underlying projections to the target structure. Figure
    [6-12](#508424_1_En_6_Chapter.xhtml#Fig12) shows the target mapping for the Union
    node.


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig12_HTML.jpg](images/508424_1_En_6_Chapter/508424_1_En_6_Fig12_HTML.jpg)


    Figure 6-12.


    Defining the fields mapping for the Union node in the CV_DIM_PRODUCTS_ALL calculation
    view


    To properly map the source fields to targets, we can use Table [6-1](#508424_1_En_6_Chapter.xhtml#Tab1)
    as a reference. To map the source field into the target, we can simply drag and
    drop them.


    Important


    When defining associations, you should always start the mapping from the source
    field that is of the same data type as the target field. Otherwise, the system
    will inherit the data type from the field that was mapped as the first one and
    overwrite our initial settings.


    As mentioned, we should start the mapping always from the field with the “leading”
    data type. As an example for the PRODUCT_ID target field, we should first map
    the field ZMATID from *Projection_1* and then map the PRODUCT_ID field from *Projection_2*.
    If we map PRODUCT_ID from *Projection_2* first, then the target PRODUCT_ID will
    inherit the data type from that field, which is VARCHAR(10) instead of VARCHAR(18).


    Remember also that not all target fields will have assignments from both sources.
    Fields like CATEGORY_ID, BRAND_DESC, and CREATED_ON will have only a single assignment
    from the source. In addition to the fields that are coming from both sources,
    it is good to have one more field that will help to identify the source system
    for a specific record. For that purpose, we can add to the target structure field
    SOURCE. Then by right-clicking that field, we can specify mappings (Figure [6-13](#508424_1_En_6_Chapter.xhtml#Fig13)).


