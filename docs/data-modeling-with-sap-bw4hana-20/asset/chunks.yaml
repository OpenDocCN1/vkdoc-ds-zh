    # 排版后的内容


    如上所述，取消选中 `User Confirmed Referential Integrity` 选项时需要格外小心，因为这可能会影响关联 `InfoObject`
    的主数据表。每次对有关联的对象运行预览时，系统都会传播关联 `InfoObjects` 主数据表中不存在的值。为了直观地说明这一点，我们来检查一下 `ZBW4CUST`
    主数据表的变更前后情况。


    图 5-17 展示了在我们取消选中 `Referential Integrity` 选项并运行 `ZCPFCT01` 开放 ODS 视图（图 5-15）后，`ZBW4CUST`
    主数据表内容的变化。


    ![../images/508424_1_En_5_Chapter/508424_1_En_5_Fig17_HTML.jpg](img/508424_1_En_5_Fig17_HTML.jpg)


    **图 5-17.** 执行 `ZCPFCT01` 开放 ODS 视图前后，`ZBW4CUST` 主数据表的对比


    图中高亮显示的新条目（`0100000014` 和 `0100000015`）是在开放 ODS 视图运行时填充到该 `InfoObject` 中的。这意味着，每当底层
    `ORDER_HEADER` 表中出现新的客户值，一旦对开放 ODS 视图执行预览，这些值就会被添加到 `ZBW4CUST` InfoObject 的主数据中。请记住这一点，在将字段与
    `InfoObjects` 关联时必须谨慎，因为你可能无意中传播了不需要的主数据值。如果要避免这种情况，可以创建一个现有 `InfoObject` 的副本，并使用它来代替主
    `InfoObject`。这就是为什么在某些场景下，你可能会更倾向于使用 `Referential Integrity` 设置来确保主数据不会混乱。


    由于订单数据的开放 ODS 视图（`ZCPFCT01`）已用新字段更新，我们现在需要将这些变更整合到 `CompositeProvider` 和查询中。首先，我们应该更新
    `CompositeProvider` 对象（图 5-18）。


    ![../images/508424_1_En_5_Chapter/508424_1_En_5_Fig18_HTML.jpg](img/508424_1_En_5_Fig18_HTML.jpg)


    **图 5-18.** 将 `ZBW4CUST` 导航属性添加到 `ZCPFCT01` CompositeProvider 的输出中


    要显示导航属性，我们应该使用图 5-6 中所示的选项来启用它们。因此，我们将能够使用客户属性并将其映射到输出。如图 5-18 所示，我们还需要删除 `CUST_NUMBER`
    字段的映射，因为客户的技术名称现在继承自 `InfoObject` `ZBW4CUST`。成功激活 `CompositeProvider` 后，最后一步是更新最终的查询。


    由于我们从底层 `CompositeProvider` 中删除了 `CUST_NUMBER` 字段，因此也需要将其从查询中删除。然后，我们可以添加新的客户相关字段并保存查询（图
    5-19）。


    ![../images/508424_1_En_5_Chapter/508424_1_En_5_Fig19_HTML.jpg](img/508424_1_En_5_Fig19_HTML.jpg)


    **图 5-19.** 将 `ZBW4CUST` 导航属性添加到 `ZCPFCT01_Q01` 查询的输出中


    图 5-20 中显示的最终查询包含了用户要求的所有附加字段。用户提出的增强需求现已实现。


    ![../images/508424_1_En_5_Chapter/508424_1_En_5_Fig20_HTML.jpg](img/508424_1_En_5_Fig20_HTML.jpg)


    **图 5-20.** 在 Analysis for Microsoft Excel 中展示的 `ZCPFCT01_Q01` 查询的输出


    ## 总结


    本章演示了如何在基于外部源创建的模型中使用 `InfoObjects`。我们解释了如何在字段与 `InfoObjects` 之间建立关联。我们了解到，关联既可以在开放
    ODS 视图级别应用，也可以在 `CompositeProvider` 级别应用。


    混合数据模型的最大优势在于，我们可以利用现有的主数据对象及其功能，例如层级结构、导航属性和文本。另一方面，需要强调的是，混合数据模型仅在外部属性与 SAP
    数据类型和主数据内容一致时才能使用。否则，外部字段与 `InfoObjects` 之间的关联可能会产生错误结果或在报表时导致错误。


    最后，我们了解了 `Referential Integrity` 属性的影响。示例解释了正确使用此设置的重要性，并强调了为什么应谨慎使用。


    # # 6. 将 SAP 和非 SAP 数据集成到单个数据模型中


    本章将引导您完成实现一个包含 SAP 数据和非 SAP 数据的新数据模型的场景。本章介绍的方法将利用 BW/4HANA 虚拟化功能来组合两个结构不同的数据模型。在本章中，您将学习如何通过充分利用
    BW/4HANA 和 HANA 世界的优势来集成 SAP 和非 SAP 模型。通过使用 LSA++ 架构，我们将获得虚拟对象的优势，避免数据冗余，并使架构尽可能精简和简单。

