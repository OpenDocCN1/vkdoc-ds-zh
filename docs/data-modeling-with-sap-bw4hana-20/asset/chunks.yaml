  trans: '

    # 创建事务性计算视图


    与维度表类似，我首先在 SAP HANA 层为事务性数据创建一个虚拟层。在我们的数据模型中，事务性数据来自两个表：`ORDER_HEADER` 和 `ORDER_DETAILS`。这两个表都有一个
    `Order Number (ORD_NUMBER)` 列，该列将用于将抬头数据和行项目数据链接到一个数据集中。此表将在 CUBE 数据类别的计算视图中进行联接。图
    4-14 展示了 `CV_FACT_ORDERS` 视图对象的图形编辑器。


    ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig14_HTML.jpg](img/508424_1_En_4_Fig14_HTML.jpg)


    图 4-14. `CV_FACT_ORDERS` 计算视图定义


    `CV_FACT_ORDERS` 计算视图从订单抬头表和订单项目表（`Projection_1` 和 `Projection_2`）查询数据。然后，联接节点基于
    `ORD_NUMBER` 列将这些表链接到一个数据集中。从 `ORDER_HEADER` 表开始，所有列都会被传播到语义节点。从 `ORDER_DETAILS`
    表，除了已从抬头表衍生的 `ORD_NUMBER` 字段外，我们也应选择所有字段。当对 `CV_FACT_ORDERS` 计算视图执行数据预览时，我们应该看到抬头数据和行项目数据已合并成一个数据集。该视图现在将用作事实（Facts）开放
    ODS 视图对象的数据源。


    # 创建事实开放 ODS 视图


    创建了主数据和文本 BW/4HANA 对象之后，现在我将创建中心星型模式对象。由于我们已经将订单事务性数据合并到一个数据集中，现在可以定义一个新的事实开放
    ODS 视图对象。请记住，在定义事务性开放 ODS 视图时，应选择 `Facts` 选项作为语义类型。图 4-15 展示了 `ZFCT01` 开放 ODS
    视图的初始设置。


    ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig15_HTML.jpg](img/508424_1_En_4_Fig15_HTML.jpg)


    图 4-15. 订单数据 (`ZFCT01`) 开放 ODS 视图的初始输出结构


    `CV_FACT_ORDERS` 计算视图中可用的源字段分为以下三类：


    *   `Order Number` 和 `Order Line Number` 是构成订单数据集组合键的字段。它们唯一地定义了每个订单项目记录。主键字段被分配到
    `Characteristics (Key)` 类别 (1)。


    > **注意**：主键字段也可以分配到“特征”文件夹。但是，如果将来需要将这些数据持久化到 ADSO 中，通过将主键字段分配到 `Characteristics
    (Key)` 文件夹，我们可以确保这些字段会自动成为所生成 ADSO 的键字段。


    *   事务性数据字段被分组到 `Characteristics` 文件夹 (2)。来自 `CV_FACT_ORDERS` 计算视图的大多数字段都已添加到此组中。


    *   `Quantity Ordered (QTY)` 列是一个累积度量；因此，它已被添加到 `Key Figures` 文件夹 (3)。


    现在让我们激活 `ZFCT01` 对象来检查其内容。


    ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig16_HTML.jpg](img/508424_1_En_4_Fig16_HTML.jpg)


    图 4-16. `ZFCT01`在 Analysis for Microsoft Excel 中的初始输出


    在图 4-16 中，您可能会看到 `ZFCT01` 开放 ODS 视图针对某些选定字段的输出。目前，`Order Status`、`Category` 和
    `Product` 字段显示为键值，除非用户知道特定 ID 的含义，否则这些值对最终用户可能没有意义。由于我们现在已经准备好订单事务性开放 ODS 视图的初始设置，我们可以通过应用关联来增强这些字段。通过这种方式，某些字段将继承本章前面部分创建的关联文本/主数据开放
    ODS 视图的属性。


    `CV_FACT_ORDERS` 计算视图将 `Order Status` 和 `Category` 值显示为键。为了在报表中也启用描述，我们可以利用订单状态
    (`ZTXT01`) 和类别 (`ZTXT02`) 开放 ODS 视图，并分别对 `STATUS` 和 `CATEGORY` 字段应用关联。按照图 4-11
    中为类别字段展示的相同步骤，在 `ZFCT01` 开放 ODS 视图中定义关联。图 4-17 展示了事务性字段与文本开放 ODS 视图对象之间的关联。


    ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig17_HTML.jpg](img/508424_1_En_4_Fig17_HTML.jpg)


    图 4-17. `ZFCT01` 开放 ODS 视图中类别和订单状态字段的关联


    图 4-17 中显示的“类别”和“订单状态”字段现在已与文本开放 ODS 视图建立了关联。在上一节中，我们为产品维度创建了一个主数据对象。您还记得，此维度具有一个复合键，由产品
    ID 和类别 ID 字段组成。在分配产品 (`ZDIM01`) 开放 ODS 视图时，我们需要牢记这一点。


    ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig18_HTML.jpg](img/508424_1_En_4_Fig18_HTML.jpg)


    图 4-18. `ZFCT01` 开放 ODS 视图中产品字段的关联

