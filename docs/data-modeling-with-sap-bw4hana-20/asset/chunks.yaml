  trans: '

    选择“管理映射（`Manage Mappings`）”选项后，会弹出用于定义映射的窗口。在此，我们可以为基础数据源定义常量值。


    如图 6-14 所示，管理映射时，我们可以为连接到联合节点的每个投影指定常量值。对于指向`ZMATID`数据的`Projection_1`，我们可以指定`SAP`作为常量值。`Projection_2`从外部产品维度查询数据，因此我为它分配了`EXT`作为常量值。向输出结构中添加此类列非常有用，因为它允许用户轻松识别或过滤仅来自特定系统的记录（但这并非强制要求）。


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig14_HTML.jpg](img/508424_1_En_6_Fig14_HTML.jpg)


    图 6-14.


    在`CV_DIM_PRODUCTS_ALL`计算视图中管理“数据源”字段的映射


    我们也可以使用管理映射功能来分配常量值，以防某些投影节点未维护映射。默认情况下，如果底层节点没有映射，则输出列会为此数据显示`NULL`。在我们的场景中，`CATEGORY_ID`列就是这种情况。由于`CATEGORY_ID`将成为目标产品维度主键的一部分，我们需要确保其中不会出现`NULL`值。为此，我们应该用该字段的常量值替换`NULL`。要应用固定值，请右键单击`CATEGORY_ID`字段，然后选择“管理映射”选项，打开用于定义映射的窗口（图
    6-15）。


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig15_HTML.jpg](img/508424_1_En_6_Fig15_HTML.jpg)


    图 6-15.


    在`CV_DIM_PRODUCTS_ALL`计算视图中管理`CATEGORY_ID`字段的映射


    如图 6-15 所示，对于目标`CATEGORY_ID`字段，我为来自`Projection_1`（SAP 物料）的数据分配了值`00000`。应用映射后，对于
    SAP 物料主数据，`CATEGORY_ID`值将始终显示`00000`，而不是`NULL`。对于外部数据，类别值将从`Projection_2`节点填充。


    一旦我们在联合节点级别配置了最终结构，就可以转到最终的投影节点，将所有字段添加到视图的输出中（图 6-16）。


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig16_HTML.jpg](img/508424_1_En_6_Fig16_HTML.jpg)


    图 6-16.


    向`CV_DIM_PRODUCTS_ALL`计算视图的输出中添加字段


    定义完`CV_DIM_PRODUCTS_ALL`的最终输出后，我们可以激活该视图。然后运行数据预览以验证内容（图 6-17）。


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig17_HTML.jpg](img/508424_1_En_6_Fig17_HTML.jpg)


    图 6-17.


    `CV_DIM_PRODUCTS_ALL`计算视图的数据预览


    数据预览返回了产品主数据的合并视图。`SOURCE`列清晰地帮助我们识别特定记录集的来源系统。您还可以注意到，`BRAND_DESC`和`CREATED_ON`列针对特定数据集显示问号。问号代表`NULL`值，表示没有可用数据。这是因为这两个列只分配了一个数据源，对于另一个数据源，数据不可用。尽管`CATEGORY_ID`仅从非
    SAP 源检索信息，但我们使用“管理映射”功能为 SAP 物料主数据分配了常量值`00000`（图 6-15）；因此，没有显示`NULL`值。


    ## 为产品创建合并主数据开放 ODS 视图


    在上一节中，我们将 SAP 和非 SAP 的产品主数据整合到了单个计算视图中。根据我们的架构设计（图 6-4），现在应在此视图（`CV_DIM_PRODUCTS_ALL`）之上创建
    BW/4 主数据对象。让我们创建名为`Product`的合并主数据开放 ODS 视图对象。


    图 6-18 显示了产品合并主数据开放 ODS 视图的初始设置。代表键字段设置为`PRODUCT_ID`列（1）。此外，列`CATEGORY_ID`也是主键的一部分，因此它被添加到特征（键）部分（2）。`BRAND_DESC`、`CREATED_ON`和`SOURCE`是属性，它们被添加到特征部分（3）。`NET_PRICE`是一个度量，因此它被分配到关键指标文件夹（4），而`CURRENCY`列有一个专门的货币部分（5）。`PRODUCT_DESC`字段包含产品描述，它被添加到长文本部分（6）。


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig18_HTML.jpg](img/508424_1_En_6_Fig18_HTML.jpg)


    图 6-18.


    `Product`——合并的（`ZINTMD01`）开放 ODS 视图对象的初始输出结构


    配置完合并产品维度的初始结构后，我们应进行额外调整。图 6-19 显示了集成产品维度的最终结构。


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig19_HTML.jpg](img/508424_1_En_6_Fig19_HTML.jpg)


    图 6-19.


    `Product`——合并的（`ZINTMD01`）开放 ODS 视图的最终输出结构


    首先，我们可以识别可以应用关联的字段。字段`CREATED_ON`、`NET_PRICE`和`CURRENCY`可以分别与`0CREATEDON`、`0NETPRICE`和`0LOC_CURRCY`信息对象关联（1）。请记住，当您分配`0LOC_CURRCY`信息对象时，需要确保外部表始终返回
    SAP 特定的货币值。


    **重要提示**


    如果您创建了具有复合键的主数据开放 ODS 视图，即将字段分配到特征（键）部分，则这些字段中的每一个都需要设置关联。此外，在应用关联时，需要选择`按名称直接使用关联对象`选项。


    正如为分配到特征（键）部分的字段所提到的，我们需要应用直接关联。否则，我们将无法使用该开放 ODS 视图进行关联，而这在我们的场景中是必需的。话虽如此，我们需要为`CATEGORY_ID`配置关联。在前面的章节中，我们为类别创建了文本`ZTXT02`开放
    ODS 视图对象（图 4-7）。我可以使用此对象在`CATEGORY_ID`字段和`ZTXT02`开放 ODS 视图对象之间应用直接关联（2）。


    最后，我们应该对字段描述进行调整。对于仅适用于特定系统的字段，最好在标题中包含此类信息。这就是为什么在字段描述中，我为`CATEGORY_ID`和`BRAND_DESC`添加了`EXT`前缀（代表外部），并为`CREATED_ON`字段添加了`SAP`前缀。得益于此，在前端工具中，很容易识别与其中之一系统相关的所有字段。为了检查我们的合并产品维度的最终结果，我将在
    Analysis for Microsoft Excel 工具中打开`ZINTMD01`开放 ODS 视图对象的预览。

