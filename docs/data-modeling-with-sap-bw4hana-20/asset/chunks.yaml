    As presented in Table [6-1](#508424_1_En_6_Chapter.xhtml#Tab1), there are four
    common fields that contain the same information: Product Number, Product Description,
    Price, and Currency. The remaining three (Category, Brand, and Creation Date)
    are not common and hence will be available only either for SAP or for non-SAP
    Materials. An additional difficulty is the fact that the non-SAP dimension has
    a compounded key based on PRODUCT_ID (Product ID) and CATEGORY_ID (Category ID),
    while the SAP master data object key consists only of the ZMATID (Material ID)
    field.


    As a next step, we need to indicate the target structure of the consolidated Product
    Master Data View object. The final Master Data View object should contain not
    only fields that are common, but also those that are available in only one of
    these sources. For common fields, it is important to choose the right data type
    that will cover the values from both sources. If we do not set the right data
    type, some values might be wrongly displayed (i.e., truncated), or the view will
    return an error during activation. Based on Table [6-1](#508424_1_En_6_Chapter.xhtml#Tab1),
    we can easily define the target data type for each output field. If we are considering
    fields that are common in both data sources, then we should always choose the
    data type with the greater length to make sure that the values will not be truncated.
    Table [6-2](#508424_1_En_6_Chapter.xhtml#Tab2) lists the target structure and
    data types for the consolidated Product calculation view.


