  trans: "\n# 场景\n\n为了创建一份全面报告，提供公司所有订单的详细信息，业务用户要求实施一个新的数据模型。该数据模型需要包含 SAP 及非 SAP\
    \ 的信息，以便为订单数据模型提供 360 度全方位视图。以下是该模型中应考虑的两个主要 SAP 对象：\n\n- `ZMATID（物料 ID）`：这是一个覆盖\
    \ SAP 物料主数据的信息对象。`物料 ID` 信息对象包含以下三个属性：\n    - `0CREATEDON（创建日期）`：物料的创建日期\n   \
    \ - `0NETPRICE（净价）`：物料的净价\n    - `0LOC_CURRENCY（当地货币）`：以当地货币表示的净价\n\n    图 6-1\
    \ 展示了 `ZMATID` 物料信息对象的内容和属性。\n\n    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig1_HTML.jpg](img/508424_1_En_6_Fig1_HTML.jpg)\n\
    \n    图 6-1. 物料 ID 信息对象的内容\n\n- `ZADS01（SAP 订单数据）`：存储 SAP 订单数据的高级数据存储对象（Advanced\
    \ DSO）。它包含以下字段：\n    - `ZORDID（订单 ID）`：订单编号\n    - `ZORDITM（订单项目）`：订单项目编号\n  \
    \  - `ZMATID（物料 ID）`：物料主数据\n    - `ZSTORID（存储地点）`：物料的存储地点\n    - `ZBW4CUST（客户）`：客户编号\n\
    \    - `0DOC_DATE（单据日期）`：单据日期\n    - `0SHIP_DATE（发货日期）`：订单的发货日期\n    - `0ORDER_QUAN（采购订单数量）`：订购数量\n\
    \    - `0PO_UNIT（订单单位）`：订购数量的单位\n\n    图 6-2 展示了 `ZADS01`（SAP 订单数据）ADSO 的内容。\n\
    \n    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig2_HTML.jpg](img/508424_1_En_6_Fig2_HTML.jpg)\n\
    \n    图 6-2. SAP 订单 ADSO 的内容\n\n你可能还记得，在外部订单数据模型中，我们还可以区分包含订单交易数据的表（`ORDERS_HEADER`\
    \ 和 `ORDER_DETAILS` 表）以及产品主数据表（`PRODUCTS` 表）。图 6-3 展示了满足业务需求的总体方法。\n\n![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig3_HTML.jpg](img/508424_1_En_6_Fig3_HTML.jpg)\n\
    \n图 6-3. 集成 SAP 和非 SAP 订单数据模型的高级架构\n\n如图 6-3 所示，对于非 SAP 数据，我们将利用两个计算视图。对于订单，我们将使用\
    \ `CV_FACT_ORDERS` 视图，该视图合并了 `ORDERS_HEADER` 和 `ORDERS_DETAILS` 外部表（请参考第 4 章中的图\
    \ 4-14）。来自外部系统的物料信息将从 `CV_DIM_PRODUCTS` 视图中获取（请参考第 4 章中的图 4-4）。SAP 相关数据将从 ADSO\
    \ `ZADS01`（SAP 订单）和信息对象 `ZMATID`（SAP 物料）中检索。我们的目标是组合这些对象，为订单交易数据创建一个单一的事实型开放 ODS\
    \ 视图对象，并为物料创建一个单一的主数据开放 ODS 视图。\n\n## 将产品主数据集成到单个计算视图中\n\n为了合并 SAP 和非 SAP 的物料主数据，我们将使用\
    \ HANA 层。图 6-3 展示了集成两个模型的高级架构，而图 6-4 是该架构的扩展，展示了将物料/产品主数据合并到单个维度中的详细方法。\n\n![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig4_HTML.jpg](img/508424_1_En_6_Fig4_HTML.jpg)\n\
    \n图 6-4. 集成 SAP 和非 SAP 产品主数据的架构\n\n在上一章中，我们为 `PRODUCTS` 表创建了计算视图（请参考图 4-4），现在我们将重用它。此外，我们需要将\
    \ SAP 物料主数据引入 HANA 层。这可以通过使用从信息对象生成外部 SAP HANA 视图的功能来实现。\n\n**注**：除了使用外部计算视图，我们也可以直接查询信息对象的技术表。然而，外部计算视图默认提供了所有相关信息。\n\
    \n现在，让我们打开 `ZMATID` 信息对象的属性并生成一个外部计算视图（见图 6-5）。\n\n![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig5_HTML.jpg](img/508424_1_En_6_Fig5_HTML.jpg)\n\
    \n图 6-5. 为 `ZMATID` 信息对象生成外部 SAP HANA 视图\n\n通过选中 `外部 SAP HANA 主数据视图` 复选框并激活该信息对象，系统将自动生成结构与信息对象结构对应的计算视图。如图\
    \ 6-5 所示，系统会提供所生成视图的位置信息。你可以点击超链接打开外部计算视图的定义。\n\n生成的计算视图包含信息对象的所有属性以及文本列（图 6-6）。正如第一章所述，要查询该计算视图的数据，你需要拥有为该视图同时生成的角色授权。关于授权的更多详细信息，请参考第\
    \ 1 章。\n\n![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig6_HTML.jpg](img/508424_1_En_6_Fig6_HTML.jpg)\n\
    \n图 6-6. `ZMATID` 信息对象的外部 SAP HANA 视图定义\n\n当对该计算视图运行预览时，你将看到物料（`ZMATID`）信息对象的内容数据（见图\
    \ 6-7）。\n\n![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig7_HTML.jpg](img/508424_1_En_6_Fig7_HTML.jpg)\n\
    \n图 6-7. `ZMATID` 信息对象的外部 SAP HANA 视图输出\n\n为了正确地组合不同的主数据对象，我们首先应进行分析以检查它们在结构和数据类型上的差异。基于此分析，我们应确定以下内容：\n\
    \n- 如何将源字段映射到目标字段？\n- 输出字段的目标数据类型应该是什么？\n- 源对象中的哪些字段不匹配或缺失？\n\n表 6-1 比较了 `CV_DIM_PRODUCTS`\
