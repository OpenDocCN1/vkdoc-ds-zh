- fmt: '# Summary


    In this chapter, we showed how to combine SAP and non-SAP data into a single integrated
    star schema data model. We utilized the SAP HANA platform to build the virtual
    layer for combining both transactional and master datasets. After going through
    the scenario, you should also notice how big a role the good technical analysis
    plays, before implementing the actual solution.


    Integrating multiple systems on the BW/4HANA platform can bring a lot of new insights
    to the business users and enable us to implement the global reporting solutions,
    while ensuring that the proper security model is maintained from the single system.


    The new features and flexibility that were introduced with the latest release
    of the SAP BW/4HANA platform significantly simplify the integration of external
    data compared to the old legacy BW system.


