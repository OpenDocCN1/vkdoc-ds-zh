    As we have identified the target structure of our view, we can now start to create
    a consolidated calculation view. First, we need switch to the *SAP HANA modeler*
    perspective. Then, in the target package, we should create a new calculation view
    of the DIMENSION type. As we will query the data from two calculation views, we
    need to add two projections by dragging them from the editor’s palette. Then as
    the source for projections we should select the ZMATID calculation view for the
    SAP master data and the CV_DIM_PRODUCTS calculation view for non-SAP data (Figure
    [6-8](#508424_1_En_6_Chapter.xhtml#Fig8)).


