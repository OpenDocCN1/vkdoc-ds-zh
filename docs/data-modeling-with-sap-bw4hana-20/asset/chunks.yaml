    Figure 3-37. Results of SQL query with `WORKDAYS_BETWEEN` calculation


    Figure [3-37](#508424_1_En_3_Chapter.xhtml#Fig37) shows the result of the SQL
    query on top of the `CV_ORDER_HEADER` view. In addition to columns being derived
    directly from the view, there is a calculated column with the `CM_DELV_DATE_DIFF_WD`
    alias. This calculated column uses the `WORKDAYS_BETWEEN` function to calculate
    the difference between the delivery date and the requested delivery date. When
    you compare the results of the new calculation (`CM_DELV_DATE_DIFF_WD`) with the
    calculation derived from the view (`CM_DELV_DATE_DIFF`), you will notice that
    the values in the former one are in most cases lower than for the latter one.
    The column `CM_DELV_DATE_DIFF_WD` calculates the result based on the `WORKDAYS_BETWEEN`
    function, while the column `CM_DELV_DATE_DIFF` computes the number of days based
    on the `DAYS_BETWEEN` function. This means that the new calculation excludes nonworking
    days, so if between two dates there will be any public holiday or weekend, these
    days will not be included when counting the total number of days. This is why
    for some order entries, the `CM_DELV_DATE_DIFF_WD` column shows lower numbers
    compared to the `CM_DELV_DATE_DIFF` column.


    ### Create the Table Function for the Order-Header Data


    After validating the query and checking its results, we can start creating a new
    table function. Follow the steps described in the section “Table Functions” of
    Chapter [1](#508424_1_En_1_Chapter.xhtml) to open the table function editor. I
    divided the table function definition into the three sections highlighted in Figure
    [3-38](#508424_1_En_3_Chapter.xhtml#Fig38). The numbers indicate the order for
    creating each section of the table function definition.


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig38_HTML.jpg](images/508424_1_En_3_Chapter/508424_1_En_3_Fig38_HTML.jpg)


    Figure 3-38. Definition of the `TF_ORDER_HEADER` table function


    1.  In the first part of the code, I indicated the target schema name for the
    table function (`_SYS_BIC`) and defined two input parameters. The first one (`IP_LANGU`)
    will be used to pass the Language value into the `CV_ORDER_HEADER` calculation
    view input parameter. `IP_CALENDAR` is a new parameter requested by the user to
    determine the calendar type used as a reference for calculating the difference
    between the delivery date and the requested delivery date.


    ```

    FUNCTION "_SYS_BIC"."BW/4HANA::TF_ORDER_HEADER" ( IP_LANGU VARCHAR(2), IP_CALENDAR
    VARCHAR(2) )

    ```


    2.  The actual query is surrounded by the `BEGIN` and `END` operators. The `SELECT`
    query that I defined in the SQL console (Figure [3-37](#508424_1_En_3_Chapter.xhtml#Fig37))
    was copied into the table function definition. For the `WORKDAYS_BETWEEN` function,
    the previously fixed US calendar ID value has now been replaced with the dynamic
    `IP_CALENDAR` input parameter.


    ```

    WORKDAYS_BETWEEN(:IP_CALENDAR, "REQ_DATE", "DELV_DATE", ''SAPABAP1'')

    ```


    In addition, when applying the mapping between the table function language input
    parameter and the calculation view input parameter, the syntax for the placeholder
    needs to be modified to make this mapping work properly. Here is the valid syntax
    for passing the table function input parameter value to the calculation view input
    parameter:


    ```

    ( PLACEHOLDER."$$IP_LANGU$$"  => :IP_LANGU )

    ```


    > **Note**

    > In SQL, table function input parameters are called using a colon (i.e., `:IP_LANGU`),
    while placeholders for calculation view input parameters are surrounded by double
    quotes and double dollar symbols (i.e., `"$$IP_LANGU$$"`).


    The final `SELECT` query looks like this:


    3.  I always define this section once I have the final `SELECT` query prepared.
    This is because in this section you need to provide data types for each column
    listed in the final `SELECT` query. Also, the column order needs to be preserved.
    As I mentioned in Chapter [1](#508424_1_En_1_Chapter.xhtml), this part is error-prone;
    hence, it is important to define data types according to the source column types.
    Here we could open the source calculation view definition in the graphical editor
    to check each output column data type and use the same types in the table function
    definition. Another approach could be to get column data types by running the
    SQL query against the `_SYS_BI`.`BIMC_PROPERTIES` metadata table. The following
    query returns the data types for all the output columns available in the `CV_ORDER_HEADER`
    view:


    ```

    SELECT COLUMN_NAME, COLUMN_SQL_TYPE

    FROM "_SYS_BI"."BIMC_PROPERTIES"

    WHERE CUBE_NAME = ''CV_ORDER_HEADER''

    AND DIMENSION_TYPE IS NOT NULL

    ```


    The previous query will provide you with the list of columns and its data types.
    Figure [3-39](#508424_1_En_3_Chapter.xhtml#Fig39) shows the output of the previous
    statement.


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig39_HTML.jpg](images/508424_1_En_3_Chapter/508424_1_En_3_Fig39_HTML.jpg)


    Figure 3-39. Output of query for the `CV_ORDER_HEADER` calculation view properties


    You can then copy this list to the table function output definition. Then you
    will make sure that all data types are consistent with the source object structure.
    The following code defines the output structure of the `TF_ORDER_HEADER` table
    function:


    ```

    RETURNS TABLE

    (

    ORD_NUMBER VARCHAR(10),

    DOC_DATE DATE,

    REQ_DATE DATE,

    SHIP_DATE DATE,

    DELV_DATE DATE,

    STATUS VARCHAR(3),

    CUST_NUMBER VARCHAR(10),

    EMP_NUMBER VARCHAR(10),

    FREE_TEXT VARCHAR(100),

    STATUS_DESC VARCHAR(30),

    CM_DELV_DATE_DIFF_WD INTEGER

    )

    LANGUAGE SQLSCRIPT

    SQL SECURITY INVOKER AS

    ```


    Before activating the table function, compare the output structure with the columns
    listed in the `SELECT` statement and make sure that the number of output columns
    is consistent, the output column names are identical, and the columns order is
    preserved. After successful activation, you can query the TF to check if it returns
    the desired output. When running the `SELECT` statement, remember to provide the
    input parameter values (unless default input parameter values were defined in
    TF definition). The following code queries data from the `TF_ORDER_HEADER` table
    function:


    ```

    SELECT * FROM "_SYS_BIC"."BW/4HANA::TF_ORDER_HEADER" ( ''E'', ''US'' )

    ```


    Figure [3-40](#508424_1_En_3_Chapter.xhtml#Fig40) shows the output of this query.


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig40_HTML.jpg](images/508424_1_En_3_Chapter/508424_1_En_3_Fig40_HTML.jpg)


    Figure 3-40. Output of the query for the `TF_ORDER_HEADER` table function


    As shown in Figure [3-40](#508424_1_En_3_Chapter.xhtml#Fig40), if we want to pass
    input parameter values to the table function, we need to specify values as a comma-separated
    list inside the parentheses. Be aware that these input parameters are the single-value
    type, so you cannot pass more than one value for each parameter. Nevertheless,
    it is also possible to maintain multiple-value input parameters, but that requires
    additional coding within the table function.


    ```

    SELECT

    "ORD_NUMBER",

    "DOC_DATE",

    "REQ_DATE",

    "SHIP_DATE",

    "DELV_DATE",

    "STATUS",

    "CUST_NUMBER",

    "EMP_NUMBER",

    "FREE_TEXT",

    "STATUS_DESC",

    WORKDAYS_BETWEEN( :IP_CALENDAR, "REQ_DATE", "DELV_DATE", ''SAPABAP1'')

    AS "CM_DELV_DATE_DIFF_WD"

    FROM "_SYS_BIC"."BW/4HANA/CV_ORDER_HEADER"

    (

    PLACEHOLDER."$$IP_LANGU$$"  => :IP_LANGU

    )

    ```'
