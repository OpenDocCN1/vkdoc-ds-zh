  trans: "\n### 计算视图\n\n要开始使用计算视图，请转到 SAP HANA 建模器透视图，右键单击包，然后选择新建 ➤ 计算视图（图 1-1）。\n\
    \n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig1_HTML.jpg](img/508424_1_En_1_Fig1_HTML.jpg)\n\
    \n图 1-1\n\n创建新的计算视图\n\n选择“计算视图”选项后，将打开用于定义计算视图常规设置的窗口（参见图 1-2）。\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig2_HTML.jpg](img/508424_1_En_1_Fig2_HTML.jpg)\n\
    \n图 1-2\n\n新建信息视图窗口\n\n在图 1-2 中，有两个重要字段：\n\n1.  *名称*：这是一个必填字段，是计算视图的技术名称。\n\n\
    2.  *数据类别*：此字段包含以下选项：\n    1.  *CUBE*：图形编辑器中的最后一个默认节点将是聚合。此类视图可被报表工具使用。至少需要指定一个输出列作为度量。\n\
    \n2.  *DIMENSION*：图形编辑器中的最后一个默认节点将是投影。此类视图不能被报表工具使用。所有输出字段都是属性（无法使用度量）。\n\n注意\n\
    \n一旦创建了计算视图，您将能够随时更改数据类别类型，而无需重建整个视图逻辑。\n\n提供计算视图详细信息后，下一步是在图形设计器中建模业务逻辑。计算视图是使用称为*节点*的构建块构建的。图形视图支持以下节点类型：\n\
    \n*   *连接*：连接操作用于基于特定列链接两个数据源。链接数据集时，您可以选择连接类型（参照、内连接、左外连接、右外连接、全外连接或文本连接），并可以指示连接基数（1..1、1..n、n..1、n..m）。\n\
    \n*   *并集*：这些操作用于合并两个或多个数据源。SAP HANA 是一个列式数据库，因此只要可能，使用并集节点总是比使用连接更好。\n\n*   *投影*：这是用于从目标源对象检索数据的节点。它允许您选择字段、应用过滤器或创建计算。投影节点可以使用以下源对象：表、虚拟表、视图、计算视图、表函数或模型中的任何其他节点。\n\
    \n*   *聚合*：这允许您基于所选属性聚合数据，并对所选度量应用基本聚合函数（`Sum`、`Min`、`Max`、`Count`、`Avg`、`Var`、`StdDev`）。\n\
    \n*   *排名*：在此节点内，可以根据排名定义过滤数据。此外，此节点允许您自动生成排名列。\n\n最常用的节点是 `Projection`，它只是从底层表读取数据。通过从面板中拖放节点来将节点添加到模型中（参见图\
    \ 1-3）。\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig3_HTML.png](img/508424_1_En_1_Fig3_HTML.png)\n\
    \n图 1-3\n\n向计算视图添加投影节点\n\n添加所有其他节点类型的方式相同。一旦我们将节点添加到模型中，下一步我们需要定义源表（或任何其他对象，如其他计算视图、表函数或数据库视图）。通过单击“添加对象”按钮，您可以搜索所需的视图或表。\n\
    \n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig4_HTML.png](img/508424_1_En_1_Fig4_HTML.png)\n\
    \n图 1-4\n\n向计算视图中的投影节点添加对象\n\n搜索对象时，您应键入其名称（图 1-4）。一旦找到并在“匹配项”部分中显示，选择它并单击“确定”继续。添加源对象的另一种方法是将其从左侧显示窗格直接拖放到节点上（节点上显示的“将元素拖放到此处”部分）。图\
    \ 1-5 显示了一个示例计算视图，该视图在采购凭证抬头（`EKKO`）和采购凭证项目（`EKPO`）两张标准 ERP 表之间，基于凭证编号列（`EBELN`）进行连接。\n\
    \n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig5_HTML.jpg](img/508424_1_En_1_Fig5_HTML.jpg)\n\
    \n图 1-5\n\n采购订单的计算视图\n\n如图 1-5 所示，此视图由四个节点组成：两个投影节点从两张采购表（`EKKO` 和 `EKPO`）中查询数据，连接节点合并这两张表，聚合节点是\
    \ `CUBE` 数据类别计算视图的默认节点。语义节点始终设置为所有类型计算视图的最后一个默认节点，并且无法删除。创建计算视图的更复杂场景将在后续章节中描述。\n\
    \n在您能够执行视图之前，与大多数 BW/4HANA 对象一样，视图需要被激活。要检查是否存在任何错误，您可以首先通过单击“验证”按钮来验证视图。一旦验证通过，您可以激活它，如图\
    \ 1-6 所示。\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig6_HTML.png](img/508424_1_En_1_Fig6_HTML.png)\n\
    \n图 1-6\n\n验证并激活计算视图\n\n在验证和激活期间，系统会检查模型是否存在任何错误，并相应地在“作业日志”选项卡（图 1-6）上显示激活状态。\n\
    \n有多种方法可以执行计算视图以显示结果。第一个选项是右键单击语义节点，然后选择“数据预览”选项。系统将打开一个新选项卡（图 1-7），您可以在“原始数据”选项卡上看到视图的输出（默认显示\
    \ 200 条记录）。\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig7_HTML.jpg](img/508424_1_En_1_Fig7_HTML.jpg)\n\
    \n图 1-7\n\n计算视图的数据预览\n\n第二个选项是右键单击左侧窗格（在“系统”选项卡上）包树中的计算视图名称。那里有两个选项可以运行视图：`Data\
    \ Preview` 和 `Generate Select SQL`。`Data Preview` 选项的工作方式与语义节点上的预览相同（参见图 1-7）。\n\
    \n`Generate Select SQL` 选项会打开 SQL 控制台，并基于该计算视图生成 SQL `SELECT` 语句。当您想要执行即席分析，将视图的输出与其他源对象（如其他计算视图或表）结合起来时，此选项非常有用。对计算视图\
    \ `CV_PURCHASE_ORDERS` 使用此选项时，会生成以下 SQL 代码：\n\n```\nSELECT\n\"EBELN\",\n\"EBELP\"\
    ,\n\"AEDAT\",\n\"MATNR\",\n\"MEINS\",\nsum(\"MENGE\") AS \"MENGE\"\nFROM \"_SYS_BIC\"\
    .\"BW4HANA/CV_PURCHASE_ORDERS\"\nGROUP BY \"EBELN\",\n\"EBELP\",\n\"AEDAT\",\n\
    \"MATNR\",\n\"MEINS\"\n```\n\n注意\n\n开发人员常问的一个问题是，是否可以将图形化计算视图的逻辑转换为 SQL 代码。答案是否定的。您可以从计算视图自动生成\
    \ SQL 查询，但这不会将整个视图逻辑转换为 SQL 连接和并集；相反，这只会在此计算视图之上创建一个 `SELECT` 语句。\n\n在开始使用计算视图时，即使视图逻辑已正确建模，您也可能会遇到一些问题。以下是您可能遇到的最常见问题：\n"
- fmt: "#### Issue: When executing a data preview on each calculation view node, no\
    \ data is returned in the output, despite that data in the underlying tables exists.\n\
    \n**Reason:** In the calculation view properties, `Session Client` is set as a\
    \ default client.\n\n**Solution:** In the semantics of the calculation view, go\
    \ to the `View Properties` tab and change the `Default Client` value from `Session\
    \ Client` to `Cross Client` (see Figure [1-10](#508424_1_En_1_Chapter.xhtml#Fig10)).\n\
    \n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig10_HTML.jpg](images/508424_1_En_1_Chapter/508424_1_En_1_Fig10_HTML.jpg)\
    \  \nFigure 1-10 – Setting the default client in the calculation view\n\n---\n\
    \n#### Issue: In the SQL console, developers are able to query the data from specific\
    \ schema tables, but when trying to perform a data preview on a calculation view,\
    \ there is the following error message:  \n`Error: SAP DBTech JDBC: [258]: insufficient\
    \ privilege`\n\n**Reason:** SQL analytic privileges have been applied for the\
    \ calculation view.\n\n**Solution:** In the semantics of the calculation view,\
    \ go to the `View Properties` tab and apply the option `Classical Analytic Privileges`\
    \ instead of `SQL Analytic Privileges` (see Figure [1-9](#508424_1_En_1_Chapter.xhtml#Fig9)).\
    \ Another method is to assign the calculation view to the `Analytic Privilege`\
    \ object assigned to the user or user role.\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig9_HTML.jpg](images/508424_1_En_1_Chapter/508424_1_En_1_Fig9_HTML.jpg)\
    \  \nFigure 1-9 – Applying privileges in a calculation view\n\n---\n\n#### Issue:\
    \ In the SQL console, the developer can query the data from specific schema tables,\
    \ but when trying to activate a view on top of one of these tables, there is the\
    \ following error message:  \n`Create Scenario failed: The following errors occurred:\
    \ user is not authorized (2950)`\n\n**Reason:** Runtime objects are created by\
    \ the system user `_SYS_REPO`, who needs to have the `SELECT` privilege to the\
    \ schema.\n\n**Solution:** Grant the `SELECT` privilege for that schema to the\
    \ `_SYS_REPO` user. You can assign the privilege by running the following SQL\
    \ code:\n\n```\nGRANT SELECT ON SCHEMA \"SCHEMA_NAME\" TO _SYS_REPO WITH GRANT\
    \ OPTION\n```\n\nFigure [1-8](#508424_1_En_1_Chapter.xhtml#Fig8) shows the SQL\
    \ console with the code for granting the `SELECT` privilege to the `_SYS_REPO`\
    \ user for the schema called `TEST_SCHEMA`.\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig8_HTML.png](images/508424_1_En_1_Chapter/508424_1_En_1_Fig8_HTML.png)\
    \  \nFigure 1-8 – Granting a privilege to the `_SYS_REPO` user\n\n---\n\nCalculation\
    \ views are the main modeling objects in the SAP HANA environment. Thanks to the\
    \ graphical interface, developers can easily incorporate most of the business\
    \ logic into data models without deep SQL programming knowledge. Calculation views\
    \ provide a lot of development flexibility, so the maintenance is also not a big\
    \ challenge. In some scenarios, however, the functionality available in calculation\
    \ views may not be sufficient. Here are the common limitations of SAP HANA calculation\
    \ views:\n\n- There is no way to implement loop functions (`WHILE <condition>\
    \ DO`, etc.) using a graphical view.\n- Window functions (`LAG`, `LEAD`, `DENSE_RANK`,\
    \ etc.) are not available.\n- Complex SQL functions (`STRING_AGG`, `WORKDAYS_BETWEEN`,\
    \ etc.) are not available.\n- Application function libraries are not supported.\n\
    \nFortunately, there is a second modeling object called a *table function*, which\
    \ supports more complex scenarios, but it requires SQL programming knowledge.\n\
    \n### Table Functions\n\nLet’s now create a table function with the same logic\
    \ as the calculation view created in the previous section. As presented in Figure\
    \ [1-5](#508424_1_En_1_Chapter.xhtml#Fig5), a calculation view was created as\
    \ a join of tables for Purchasing Document Header (`EKKO`) and Purchasing Document\
    \ Item (`EKPO`). A join was performed on the Document Number column (`EBELN`).\n\
    \nPersonally when I start working on table function logic, I prefer to build the\
    \ entire code in the SQL console. Once I run the code and validate the results,\
    \ I copy the SQL script to a TF object and apply the required adjustments. With\
    \ this approach, it’s easier to debug the code if there are any issues and also\
    \ preview the results of that code. Here you can find the SQL code for joining\
    \ the `EKKO` and `EKPO` tables:\n\n```\nSELECT EKPO.\"EBELN\", EKPO.\"EBELP\"\
    , EKKO.\"AEDAT\", EKPO.\"MATNR\",  EKPO.\"MEINS\", EKPO.\"MENGE\"\nFROM \"TEST_SCHEMA\"\
    .\"EKKO\" EKKO\nJOIN \"TEST_SCHEMA\".\"EKPO\" EKPO ON EKKO.\"EBELN\" = EKPO.\"\
    EBELN\";\n```\n\nFigure [1-11](#508424_1_En_1_Chapter.xhtml#Fig11) shows the SQL\
    \ console with the results of executing the previous code.\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig11_HTML.jpg](images/508424_1_En_1_Chapter/508424_1_En_1_Fig11_HTML.jpg)\
    \  \nFigure 1-11 – SQL script to link the `EKPO` and `EKKO` tables\n\nAfter executing\
    \ the script provided in Figure [1-11](#508424_1_En_1_Chapter.xhtml#Fig11), you\
    \ can see that the results are the same as the output of the calculation view\
    \ created in the previous section. As a next step, I will switch the Eclipse perspective\
    \ from the SAP HANA modeler to the SAP HANA development perspective. If this perspective\
    \ has not been used before, the first step is to create a repository workspace\
    \ from the `Repositories` tab, as in Figure [1-12](#508424_1_En_1_Chapter.xhtml#Fig12).\n\
    \n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig12_HTML.jpg](images/508424_1_En_1_Chapter/508424_1_En_1_Fig12_HTML.jpg)\
    \  \nFigure 1-12 – Create Repository Workspace menu item\n\nAfter providing the\
    \ name and physical path for the workspace, it is ready to use. Within the tree\
    \ under the created workspace, I will search for the package where I want to create\
    \ a table function. To open the wizard, right-click the specific package and select\
    \ **New ➤ Other**. A selection wizard will pop up. Input **Table Function** to\
    \ find the right object, as shown in Figure [1-13](#508424_1_En_1_Chapter.xhtml#Fig13).\n\
    \n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig13_HTML.png](images/508424_1_En_1_Chapter/508424_1_En_1_Fig13_HTML.png)\
    \  \nFigure 1-13 – Creating a table function wizard\n\nOnce `Table Function` is\
    \ selected, provide a name for the table function. After proceeding, a table function\
    \ editor will open. Here is where to paste the actual SQL query. Figure [1-14](#508424_1_En_1_Chapter.xhtml#Fig14)\
    \ shows the final definition of the table function for joining the `EKKO` and\
    \ `EKPO` tables.\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig14_HTML.jpg](images/508424_1_En_1_Chapter/508424_1_En_1_Fig14_HTML.jpg)\
    \  \nFigure 1-14 – Definition of table function to link the `EKPO` and `EKKO`\
    \ tables\n\nIn Figure [1-14](#508424_1_En_1_Chapter.xhtml#Fig14), I highlighted\
    \ the important part of codes, which should always be defined explicitly by the\
    \ developer.\n\n1.  By default when creating a new table function, the editor\
    \ uses your local schema. Consider changing this value to the schema that is accessible\
    \ to other users. In my opinion, the most appropriate schema is `_SYS_BIC`, which\
    \ is also where all the column views generated by calculation views are stored.\n\
    \n    ```\n    FUNCTION \"_SYS_BIC\".\"BW4HANA::TF_PURCHASE_ORDERS\" ( )\n   \
    \ ```\n\n2.  The table value should be set to the TF output type.\n\n3.  In this\
    \ section, you need to list all the columns returned in the actual SQL code. You\
    \ need to preserve the column order and column names (which are case sensitive).\
    \ Also, make sure that the data types are consistent with all the data types of\
    \ the source columns returned in the query."
