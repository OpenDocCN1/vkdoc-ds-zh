    When generating the ADSO, the system will automatically identify key fields, based
    on the ZFCT01 Open ODS View fields, that were assigned to the Characteristics
    (Key) folder (Figure [4-15](#508424_1_En_4_Chapter.xhtml#Fig15)).


    After completing the generation of all the necessary BW/4HANA objects, when trying
    to execute the existing ZCPFCT01_Q01 query, initially no applicable data will
    be found. To make the data available, you need to first load the output of the
