    # 将输入参数从查询传递到表函数


    ## 案例研究 4


    业务用户意识到，目前对交货日期与请求交货日期之间差值的计算不够精确。目前的计算方式包含了周末和公共节假日的天数。需求是修正该计算，排除所有非工作日。此外，用户要求能够将工厂日历作为输入参数提供。现在，根据提供的日历
    ID，计算交货日期与请求交货日期的差值时，应仅包含工作日。日历变量的默认值应设置为 US。


    要计算两个日期之间的工作日数，我们可以使用 `WORKDAYS_BETWEEN` SQL 函数。遗憾的是，图形化计算视图不支持此函数，因此我们无法直接调整现有的计算。为了使用
    `WORKDAYS_BETWEEN` 函数，我们首先需要创建一个表函数。针对给定场景，我将介绍两种方法。


    第一种方法是，将整个计算视图（`CV_ORDER_HEADER`）的逻辑转换为 SQL 脚本。所有连接和计算都需要手动转换为 SQL 代码，并包含在表函数定义中（图
    3-34）。


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig34_HTML.jpg](img/508424_1_En_3_Fig34_HTML.jpg)


    图 3-34. 用表函数替换现有的计算视图


    如图 3-34 所示，表函数直接使用源表。对于所考虑的场景，将逻辑从图形化视图转换为 SQL 脚本很容易。只需连接两个表；因此，这种方法可能更可取。此外，不再需要现有的计算视图，可以将其删除。因此，HANA
    原生侧只需维护两个对象：表函数和计算视图。


    > **注意：** `CompositeProvider` 无法直接使用表函数，因此需要创建一个计算视图作为 `CompositeProvider` 和表函数之间的中间层。


    第二种方法是，利用现有的计算视图（`CV_ORDER_HEADER`）作为表函数 SQL 脚本的数据源。在这种情况下，我们无需为所有连接和计算编写 SQL
    代码，只需在 SQL 脚本的 `FROM` 子句中直接使用当前的计算视图即可。图 3-35 说明了第二种方法。


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig35_HTML.jpg](img/508424_1_En_3_Fig35_HTML.jpg)


    图 3-35. 在表函数中利用现有的计算视图


    尽管第二种方法实现起来稍快一些，但从维护角度来看，我认为第一种方法更好。在图 3-35 描述的方法中，有三个 HANA 建模对象。另一方面，如果底层的计算视图很复杂，包含数十个表和计算，那么第二种方法可能更可取。


    尽管对于给定的场景，第一种方法更合适，但我将演示如何使用第二种方法（图 3-35）来满足案例研究 4 的需求。这是因为通过这种方法，我还能展示如何将输入参数值从表函数传递到底层的计算视图。


    ## 准备订单头数据的 SQL 查询


    要开始处理表函数，让我们切换到 SAP 开发透视图。第一步，我们需要在 `CV_ORDER_HEADER` 计算视图之上准备 `SELECT` 语句。我们无需手动从头编写
    SQL 代码，而是可以自动从计算视图生成 `SELECT` 语句，并将其作为进一步增强的参考。在存储库浏览器树中，找到要用作参考的目标计算视图，右键单击它，然后选择“生成
    Select SQL”选项，如图 3-36 所示。


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig36_HTML.jpg](img/508424_1_En_3_Fig36_HTML.jpg)


    图 3-36. 从计算视图生成 SELECT SQL 代码


    从 `CV_ORDER_HEADER` 生成 `SELECT` SQL 代码后，Eclipse 将打开一个新的 SQL 控制台选项卡，其中包含生成的 `SELECT`
    语句。从 `CV_ORDER_HEADER` 生成的脚本具有以下语法：


    ```sql

    SELECT

    "ORD_NUMBER",

    "DOC_DATE",

    "REQ_DATE",

    "SHIP_DATE",

    "DELV_DATE",

    "STATUS",

    "CUST_NUMBER",

    "EMP_NUMBER",

    "FREE_TEXT",

    "STATUS_DESC",

    sum("CM_DELV_DATE_DIFF") AS "CM_DELV_DATE_DIFF"

    FROM "_SYS_BIC"."BW/4HANA/CV_ORDER_HEADER"(''PLACEHOLDER'' = (''$$IP_LANGU$$'',''''))

    GROUP BY "ORD_NUMBER",

    "DOC_DATE",

    "REQ_DATE",

    "SHIP_DATE",

    "DELV_DATE",

    "STATUS",

    "CUST_NUMBER",

    "EMP_NUMBER",

    "FREE_TEXT",

    "STATUS_DESC"

    ```


    你可能注意到，生成的代码包含语言输入参数的占位符，在创建表函数时也需要维护该参数。此外，为了能够将值从表函数输入参数传递到图形化计算视图参数，我们需要应用特定的语法，我将在稍后解释。


    现在，让我们专注于调整 SQL 查询，以满足案例研究 4 的需求。为了能够在 SQL 控制台中预览生成查询的结果，我们需要为 `IP_LANGU` 输入参数传递一个有效值。我暂时将占位符值固定为
    `E`。占位符的语法现在如下所示：


    ```sql

    (''PLACEHOLDER'' = (''$$IP_LANGU$$'',''E''))

    ```


    现在我想创建一个新的计算结果，用于计算交货日期和请求交货日期之间的工作日数。如前所述，我将使用 `WORKDAYS_BETWEEN` 函数。


    > **注意：** 要使用 `WORKDAYS_BETWEEN` 函数，`TFACS` 表必须在任何 HANA 数据库模式中可用。`TFACS` 是一个标准的
    SAP 表，其中包含每个年份和日历类型的非工作日（包括周末和公共节假日）信息。


    `WORKDAYS_BETWEEN` 函数的语法如下所示：


    ```sql

    WORKDAYS_BETWEEN(<calendar_id>, <start_date>, <end_date>, <schema_name>)

    ```


    以下是语法元素的含义：


    - `<calendar_id>`：指定工厂日历的 ID，该日历将作为参考，用于从计算中排除周末和公共节假日。根据需求（案例研究 4），此值应根据用户输入动态定义。


    - `<start_date>`：表示计算工作日差值的开始日期。


    - `<end_date>`：表示计算工作日差值的结束日期。


    - `<schema_name>`：指定存储 `TFACS` 表的模式名称。


    为了在 SQL 控制台中测试该函数，我暂时将 `<calendar_id>` 的值设置为 `US`。对于 `<start_date>`，我将使用“请求交货日期”列，对于
    `<end_date>`，我将使用“交货日期”。在我的 HANA 系统中，`TFACS` 表存储在 `SAPABAP1` 模式中；因此，在 `<schema_name>`
    的位置，我输入 `SAPABAP1` 值。计算交货日期和请求交货日期之间天数的语法如下所示：


    ```sql

    WORKDAYS_BETWEEN(''US'',"REQ_DATE","DELV_DATE",''SAPABAP1'')

    ```

