- fmt: 'Once the `Manage Mappings` option is selected, the window for defining the
    mapping will pop up. Here we can define constant values for the underlying sources.


    As shown in Figure [6-14](#508424_1_En_6_Chapter.xhtml#Fig14), when managing the
    mapping, we can specify constant values for each projection that is connected
    to the Union node. For `Projection_1`, which points to the `ZMATID` data, we can
    specify `SAP` as a constant value. `Projection_2` queries data from the external
    Product dimension; hence, I assigned `EXT` as a constant value. It is useful to
    add such a column to the output structure, since it will allow users to easily
    identify or filter records only from specific system (but it is not mandatory).


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig14_HTML.jpg](images/508424_1_En_6_Chapter/508424_1_En_6_Fig14_HTML.jpg)


    Figure 6-14.


    `Manage mappings for SOURCE` fields in the `CV_DIM_PRODUCTS_ALL` calculation view


    We can use the manage mappings functionality also to assign constant values, in
    case mapping is not maintained for some Projection nodes. By default when there
    is no mapping from the underlying node, the output column will display `NULL`
    for this data. In our scenario, this is a case for the `CATEGORY_ID` column. Since
    `CATEGORY_ID` will be part of the primary key of the target Product dimension,
    we need to ensure that there will be no `NULL` values there. To achieve that,
    we should replace `NULL`s with the constant values for that field. To apply a
    fixed value, right-click the `CATEGORY_ID` field and select the `Manage Mappings`
    option to open the window for defining the mappings (Figure [6-15](#508424_1_En_6_Chapter.xhtml#Fig15)).


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig15_HTML.jpg](images/508424_1_En_6_Chapter/508424_1_En_6_Fig15_HTML.jpg)


    Figure 6-15.


    Managing the mappings for the `CATEGORY_ID` field in the `CV_DIM_PRODUCTS_ALL`
    calculation view


    As shown in Figure [6-15](#508424_1_En_6_Chapter.xhtml#Fig15), for the target
    `CATEGORY_ID` field, I assigned a value of `00000` for the data coming from `Projection_1`
    (SAP Materials). After applying the mapping, `CATEGORY_ID` values will always
    show `00000` instead of `NULL` for the SAP Materials master data. For external
    data, Category values will be populated from the `Projection_2` node.


    Once we have configured the final structure on the Union node level, we can then
    go to the final Projection node and add all the fields to the output of the view
    (Figure [6-16](#508424_1_En_6_Chapter.xhtml#Fig16)).


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig16_HTML.jpg](images/508424_1_En_6_Chapter/508424_1_En_6_Fig16_HTML.jpg)


    Figure 6-16.


    Adding fields to the output of the `CV_DIM_PRODUCTS_ALL` calculation view


    After defining the final output of `CV_DIM_PRODUCTS_ALL`, we can activate the
    view. Then run the data preview to validate the content (Figure [6-17](#508424_1_En_6_Chapter.xhtml#Fig17)).


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig17_HTML.jpg](images/508424_1_En_6_Chapter/508424_1_En_6_Fig17_HTML.jpg)


    Figure 6-17.


    Data preview of the `CV_DIM_PRODUCTS_ALL` calculation view


    The data preview returns the combined view for the Products master data. The `SOURCE`
    column clearly helps us to identify the source system for a specific set of records.
    You can also notice that the `BRAND_DESC` and `CREATED_ON` columns display question
    marks for specific sets of data. Question marks represent `NULL` values, meaning
    that there is no data available. This is because these two columns have assignment
    to only one data source, and for the other, data is not available. Despite `CATEGORY_ID`
    retrieving information only from the non-SAP source, we used the `Manage Mappings`
    functionality to assign a constant `00000` value for the SAP Materials master
    data (Figure [6-15](#508424_1_En_6_Chapter.xhtml#Fig15)); hence, there are no
    `NULL` values displayed.


    ## Create a Combined Master Data Open ODS View for Products


    In the previous section, we consolidated the SAP and non-SAP master data for Products
    into the single calculation view. As per our architecture design (Figure [6-4](#508424_1_En_6_Chapter.xhtml#Fig4)),
    on top of this view (`CV_DIM_PRODUCTS_ALL`) we should now create the BW/4 Master
    Data object. Let’s now create the consolidated Master Data Open ODS View object
    named `Product`.


    Figure [6-18](#508424_1_En_6_Chapter.xhtml#Fig18) shows the initial setup for
    the consolidated Master Data Open ODS View for Products. The Representative Key
    Field is set to the `PRODUCT_ID` column (1). In addition, the column `CATEGORY_ID`
    is also part of the primary key; hence, it was added to the Characteristics (Key)
    section (2). `BRAND_DESC`, `CREATED_ON`, and `SOURCE` are attributes and were
    added to the Characteristics section (3). `NET_PRICE` is a measure, so it’s assigned
    to the Key Figures folder (4), while for the `CURRENCY` column there is a dedicated
    Currency section (5). The `PRODUCT_DESC` field contains product descriptions,
    and it’s added to the Long Text section (6).


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig18_HTML.jpg](images/508424_1_En_6_Chapter/508424_1_En_6_Fig18_HTML.jpg)


    Figure 6-18.


    Initial output structure of `Product`—consolidated (`ZINTMD01`) Open ODS View
    object


    After configuring the initial structure of the consolidated Product dimension,
    now we should apply additional adjustments. Figure [6-19](#508424_1_En_6_Chapter.xhtml#Fig19)
    shows the final structure of the integrated Product dimension.


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig19_HTML.jpg](images/508424_1_En_6_Chapter/508424_1_En_6_Fig19_HTML.jpg)


    Figure 6-19.


    Final output structure of the `Product`—consolidated (`ZINTMD01`) Open ODS View


    First, we can identify the fields for which we can apply associations. The fields
    `CREATED_ON`, `NET_PRICE`, and `CURRENCY` can be associated with the `0CREATEDON`,
    `0NETPRICE`, and `0LOC_CURRCY` InfoObjects accordingly (1). Remember that when
    you assign the `0LOC_CURRCY` InfoObject, you need to make sure that the external
    table will always return SAP-specific currency values.


    **Important**


    If you created a Master Data Open ODS View with a compounded key, meaning that
    you assigned fields to the Characteristics (Key) section, each of those field
    needs to have an association set. In addition, the option `Direct Usage of Associated
    Object by Name` needs to be selected when applying associations.


    As mentioned for fields assigned to the Characteristics (Key) section, we need
    to apply direct associations. Otherwise, we will not be able to utilize that Open
    ODS View for associations, which is required in our scenario. Having said that,
    we need to configure the association for `CATEGORY_ID`. In previous chapters,
    we created the Text `ZTXT02` Open ODS View object for Category (Figure [4-7](#508424_1_En_4_Chapter.xhtml#Fig7)).
    I can use this object to apply a direct association between the `CATEGORY_ID`
    field and the `ZTXT02` Open ODS View object (2).


    Finally, we should apply adjustments for the field descriptions. For fields that
    are available for only a specific system, it is good to include such information
    in the header. This is why in the field descriptions, I added a leading `EXT`
    prefix (which stands for External) for `CATEGORY_ID` and `BRAND_DESC` and a leading
    `SAP` prefix for the `CREATED_ON` field. Thanks to that, in the front-end tool
    it will be easy to identify all the fields that are relevant for one or the other
    system. To check the final result of our consolidated Product dimension, I will
    open the preview of the `ZINTMD01` Open ODS View object in the Analysis for Microsoft
    Excel tool.'
