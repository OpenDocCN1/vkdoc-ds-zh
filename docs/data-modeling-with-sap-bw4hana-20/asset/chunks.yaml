  trans: '

    ### 组合数据模型（SAP 与非 SAP 数据）


    在需要将 SAP 与非 SAP 数据组合到单一数据模型的场景中，利用虚拟化能力可以避免数据冗余（即避免在两个模型中重复存储相同的 SAP 数据）。考虑到 `BW/4HANA`
    提供的所有功能，创建组合模型可采用多种不同方法。图 2-13 展示了将 SAP 和非 SAP 数据集成到单一模型的一种方法。


    ![../images/508424_1_En_2_Chapter/508424_1_En_2_Fig13_HTML.jpg](img/508424_1_En_2_Fig13_HTML.jpg)


    **图 2-13.** `BW/4HANA` 将 SAP 和非 SAP 主数据集成到新模型中


    图 2-13 展示了创建主数据对象的架构，该对象融合了来自 SAP 和非 SAP 维度的数据。图中用三个部分分别标明了 SAP、非 SAP 以及组合后的主数据。对于非
    SAP 数据，创建了一个 `Master Data ADSO` 作为持久化层。正如您可能已知的，`BW/4HANA` 能够根据建模对象自动生成外部 SAP
    HANA 视图。本方法即利用了此功能。从 `Master Data ADSO` 生成一个外部计算视图。同样的功能也用于 SAP 主数据，即对于 SAP `InfoObject`，也会生成一个外部计算视图。一旦两个数据集都以外部计算视图的形式在
    HANA 平台上可用，我们就可以将它们组合到单一维度视图中。如图 2-13 所示，在两个外部视图之上，创建了一个额外的计算视图。该视图的目的是合并 SAP
    和非 SAP 数据。


    **注意**


    您可以避免为非 SAP 数据创建持久化的主数据 `ADSO`，而是直接将从 `InfoObject` 生成的外部视图与虚拟表结合。然而，这种方法会对数据模型的性能产生负面影响。


    当然，在组合 SAP 和非 SAP 数据时，某些属性可能仅适用于 SAP，而另一些则仅适用于非 SAP 源。为了避免用户混淆，如果某个属性值缺失或对于特定记录不可用，最好在数据模型字段中包含用于指示每条记录来源系统的信息。在组合计算视图中，您将能够应用额外的数据操作来尽可能统一两个数据集。此外，在计算视图的联合节点中应用映射之前，很可能需要先将值转换为公共数据类型。一旦组合主数据被恰当塑形，您将能够通过
    `master data Open ODS View` 或 `InfoObject of SAP HANA View access type`（具体取决于方法）来消费最终的主数据视图。


    遵循集成主数据的方法，我们可以将相同的架构应用于事实数据。图 2-14 展示了将 SAP 和非 SAP 数据集成到新的 `BW/4HANA` 模型中的架构。


    ![../images/508424_1_En_2_Chapter/508424_1_En_2_Fig14_HTML.jpg](img/508424_1_En_2_Fig14_HTML.jpg)


    **图 2-14.** `BW/4HANA` 将 SAP 和非 SAP 数据集成到新模型中


    集成事实数据的架构遵循与集成主数据相同的方法。区别在于外部计算视图是从事实 `ADSO`（分别针对 SAP 和非 SAP 数据）生成的。从 `ADSO` 生成的外部计算视图通过在其上创建的计算视图内的联合算子进行合并。包含组合事实数据的最终计算视图随后将由
    `Facts Open ODS View` 消费。如图 2-14 所示，在 `Open ODS View` 对象中，从底层计算视图派生的字段与组合主数据对象（如图
    2-13 所述）关联。根据所选方法，这些字段可以映射到 `Master Data Open ODS Views` 或“虚拟” `InfoObjects`。某些字段也可以不建立任何关联。创建在
    `Facts Open ODS View` 之上的 `CompositeProvider` 随后可由最终查询消费。


    如您所见，存在许多可能的建模概念，您需要根据需求选择最合适的方法。请记住，本章描述的架构并非唯有的可能变体。还有许多其他架构可以设计。`BW/4HANA`
    通过限制对象和层的数量来简化建模，但凭借所有的新特性和功能，它实现了更多可能的建模方法；因此，针对特定场景选择最合适的架构确实具有挑战性。设计正确模型的关键在于深入的需求和数据模型分析、项目交付时间线以及开发人员的经验。'
- fmt: "# Summary\n\nThis chapter explained the concepts of utilizing BW/4HANA and\
    \ HANA native objects to implement agile data models consuming data from HANA\
    \ physical and virtual tables. Table [2-1](#508424_1_En_2_Chapter.xhtml#Tab1)\
    \ summarizes the pros, cons, and usage for each of the modeling concepts covered\
    \ in this chapter.\n\nTable 2-1. Comparison of Modeling Concepts\n\n| Traditional\
    \ Data Models |\n| --- |\n| **Pros** | • High level of data stability, quality,\
    \ and consistency• Possibility of using SAP business content• Access managed by\
    \ the security model |\n| **Cons** | • Low flexibility, strict development rules•\
    \ Suitable mainly for SAP data• High development and maintenance effort• Data\
    \ persistency always required |\n| **Usage** | • SAP data models |\n| **Virtual\
    \ Data Provisioning** |\n| **Pros** | • High flexibility• Very low development\
    \ effort• Easy to implement and maintain• No need for creating InfoObjects• Data\
    \ persistency not required |\n| **Cons** | • No master data• Provides only specific\
    \ piece of information• Security model not applicable (unless association to InfoObjects\
    \ is maintained) |\n| **Usage** | • Simple data provisioning/extractions• Ad hoc\
    \ analysis• Direct access to virtual tables |\n| **Field-Based Data Models** |\n\
    | **Pros** | • High flexibility• Easy to implement and maintain• No need to create\
    \ InfoObjects• Data persistency optional• Possible to implement authorization\
    \ model |\n| **Cons** | • Open ODS View objects not supporting all InfoObjects\
    \ features (i.e., hierarchies)• For complex data models, performance lower |\n\
    | **Usage** | • Non-SAP data models |\n| **Hybrid Data Models** |\n| **Pros**\
    \ | • High flexibility• No need to create new InfoObjects• Possibility of utilizing\
    \ existing master data objects where applicable• Access managed by the security\
    \ model |\n| **Cons** | • Without strict modeling guidelines, by mixing many objects\
    \ from different areas, model may become complex and difficult to maintain• For\
    \ complex data models, performance may be not sufficient |\n| **Usage** | • Non-SAP\
    \ data models having dimensions that correspond to SAP master data |\n| **Combined\
    \ Data Models** |\n| **Pros** | • Gives users possibility to run data analytics\
    \ and reporting on global data (SAP and non-SAP)• Authorization model can be implemented\
    \ |\n| **Cons** | • Design of the combined model requiring detailed and time-consuming\
    \ analysis• Complex implementation• Generates a lot of dependencies through external\
    \ SAP HANA views, which may negatively affect SAP models• Pretty high maintenance\
    \ effort |\n| **Usage** | • Integration of SAP and non-SAP data into a single\
    \ model |\n\nThe concepts described in this chapter give you an idea of how to\
    \ provision external table data into BW/4HANA, implement reports and data models\
    \ based on non-SAP tables, and integrate SAP and non-SAP data into a single data\
    \ model. In the next chapters, by using examples, you will learn how to implement\
    \ these concepts in BW/4HANA systems.\n\n# Publishing HANA Objects Through BW/4HANA\n\
    \nIn this chapter, I will go through different scenarios where data residing in\
    \ HANA needs to be published through the BW/4HANA reporting layer. You will get\
    \ a practical guide for exposing HANA tables and HANA calculation views to the\
    \ BW/4HANA system. Moreover, I will show how you can pass values that were input\
    \ on the Query Variable level directly to the calculation view and table function\
    \ input parameter.\n\nThe appendix contains some SQL scripts that can be used\
    \ for creating table structures and populating them with exemplary data. For demonstration\
    \ purposes, I will use these tables, so if you want to follow the scenarios described\
    \ in this chapter, you can use the same source objects in your system.\n\n## Publish\
    \ HANA Tables Through BW/4HANA\n\n### Case Study 1\n\nCompany XYZ is using the\
    \ BW/4HANA system as the main reporting platform. Reports created in BW/4HANA\
    \ are later consumed by the Analysis for Microsoft Excel for Microsoft Office\
    \ and SAP Analytics Cloud (SAC) front-end tools.\n\nCompany XYZ evaluates the\
    \ possibility of integrating external data into the SAP reporting platform to\
    \ be able to utilize both SAP and non-SAP data in the Analysis for Microsoft Excel\
    \ and SAC tools. In the pilot phase, Company XYZ decided to enable a single transactional\
    \ table with external data. The table named `ORDER_HEADER` is populated with data\
    \ related to orders that come from the non-SAP system. The requirement is to enable\
    \ data from this HANA table for reporting into the BW/4HANA platform. The structure\
    \ of the final query should be the same as the structure of the source table.\
    \ Table [3-1](#508424_1_En_3_Chapter.xhtml#Tab1) describes the details of the\
    \ source table structure.\n\nTable 3-1. Structure of the `ORDER_HEADER` Table\n\
    \n| Column Name | Key | Data Type | Description |\n| --- | --- | --- | --- |\n\
    | `ORD_NUMBER` | X | `VARCHAR(10)` | Order number |\n| `DOC_DATE` |   | `DATE`\
    \ | Document date |\n| `REQ_DATE` |   | `DATE` | Requested delivery date |\n|\
    \ `SHIP_DATE` |   | `DATE` | Ship date |\n| `DELV_DATE` |   | `DATE` | Delivery\
    \ date |\n| `STATUS` |   | `VARCHAR(3)` | Order status |\n| `CUST_NUMBER` |  \
    \ | `VARCHAR(10)` | Customer number |\n| `EMP_NUMBER` |   | `VARCHAR(10)` | Employee\
    \ number |\n| `FREE_TEXT` |   | `VARCHAR(5000)` | Comments |\n\nTable `ORDER_HEADER`\
    \ consists of nine columns. The primary key, which uniquely identifies each record,\
    \ is the `ORD_NUMBER` column and contains order numbers. The rest of the columns\
    \ contain order header information such as the status, document date, or customer\
    \ number.\n\n> **Note**  \n> Refer to the book’s appendix if you want to re-create\
    \ the `ORDER_HEADER` table structure and populate it with data in your SAP HANA\
    \ system.\n\nIn this scenario, I will follow the modeling concept that was illustrated\
    \ in Figure [2-3](#508424_1_En_2_Chapter.xhtml#Fig3) of Chapter [2](#508424_1_En_2_Chapter.xhtml).\
    \ Figure [3-1](#508424_1_En_3_Chapter.xhtml#Fig1) presents the detailed approach\
    \ that I will follow to fulfill the requirements from Case Study 1.\n\n![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig1_HTML.jpg](images/508424_1_En_3_Chapter/508424_1_En_3_Fig1_HTML.jpg)\n\
    \nFigure 3-1. Publishing HANA tables through BW/4HANA (Case Study 1)\n\nFrom the\
    \ BW/4HANA side, the table `ORDER_HEADER` will be consumed by an Open ODS View\
    \ object. On top of that Open ODS View, I will create a `CompositeProvider` object\
    \ (as shown in Figure [3-1](#508424_1_En_3_Chapter.xhtml#Fig1)). Once the modeling\
    \ objects are created, I will consume the `CompositeProvider` with the Query object.\n\
    \n### Create the Source System\n\nTo fulfill the requirements from Case Study\
    \ 1, we do not need to create any additional objects on the HANA level. The only\
    \ prerequisite for sourcing data from HANA is to create a dedicated source system\
    \ object in the BW/4HANA system with SAP HANA’s local database schema connection\
    \ type. This source system should point to the schema where the target tables\
    \ are stored. See Figure [3-2](#508424_1_En_3_Chapter.xhtml#Fig2) as a reference.\n\
    \n![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig2_HTML.jpg](images/508424_1_En_3_Chapter/508424_1_En_3_Fig2_HTML.jpg)\n\
    \nFigure 3-2. Source system for BW4TRAINING HANA schema\n\nAs shown in Figure\
    \ [3-2](#508424_1_En_3_Chapter.xhtml#Fig2), the `BW4H_TEST` source system uses\
    \ the local HANA schema as the connection type and points to the `BW4TRAINING`\
    \ schema. This source system object is needed to be able to access the HANA tables\
    \ stored in the `BW4TRAINING` schema and consume them via Open ODS View objects."
  raw: '## Summary


    This chapter explained the concepts of utilizing BW/4HANA and HANA native objects
    to implement agile data models consuming data from HANA physical and virtual tables.
    Table [2-1](#508424_1_En_2_Chapter.xhtml#Tab1) summarizes the pros, cons, and
    usage for each of the modeling concepts covered in this chapter.


    Table 2-1.


    Comparison of Modeling Concepts


    | Traditional Data Models |

    | --- |

    | **Pros** | • High level of data stability, quality, and consistency• Possibility
    of using SAP business content• Access managed by the security model |

    | **Cons** | • Low flexibility, strict development rules• Suitable mainly for
    SAP data• High development and maintenance effort• Data persistency always required
    |

    | **Usage** | • SAP data models |

    | **Virtual Data Provisioning** |

    | **Pros** | • High flexibility• Very low development effort• Easy to implement
    and maintain• No need for creating InfoObjects• Data persistency not required
    |

    | **Cons** | No master data• Provides only specific piece of information• Security
    model not applicable (unless association to InfoObjects in maintained) |

    | **Usage** | • Simple data provisioning/extractions• Ad hoc analysis• Direct
    access to virtual tables |

    | **Field-Based Data Models** |

    | **Pros** | • High flexibility• Easy to implement and maintain• No need to create
    InfoObjects• Data persistency optional• Possible to implement authorization model
    |

    | **Cons** | • Open ODS View objects not supporting all InfoObjects features (i.e.,
    hierarchies)• For complex data models, performance lower |

    | **Usage** | • Non-SAP data models |

    | **Hybrid Data Models** |

    | **Pros** | • High flexibility• No need to create new InfoObjects• Possibility
    of utilizing existing master data objects where applicable• Access managed by
    the security model |

    | **Cons** | • Without strict modeling guidelines, by mixing many objects from
    different areas, model may become complex and difficult to maintain• For complex
    data models, performance may be not sufficient |

    | **Usage** | • Non-SAP data models having dimensions that correspond to SAP master
    data |

    | **Combined Data Models** |

    | **Pros** | • Gives users possibility to run data analytics and reporting on
    global data (SAP and non-SAP)• Authorization model can be implemented |

    | **Cons** | • Design of the combined model requiring detailed and time-consuming
    analysis• Complex implementation• Generates a lot of dependencies through external
    SAP HANA views, which may negatively affect SAP models• Pretty high maintenance
    effort |

    | **Usage** | • Integration of SAP and non-SAP data into a single model |


    The concepts described in this chapter give you an idea of how to provision external
    table data into BW/4HANA, implement reports and data models based on non-SAP tables,
    and integrate SAP and non-SAP data into a single data model. In the next chapters,
    by using examples, you will learn how to implement these concepts in BW/4HANA
    systems.


    # 3. Publishing HANA Objects Through BW/4HANA


    In this chapter, I will go through different scenarios where data residing in
    HANA needs to be published through the BW/4HANA reporting layer. You will get
    a practical guide for exposing HANA tables and HANA calculation views to the BW/4HANA
    system. Moreover, I will show how you can pass values that were input on the Query
    Variable level directly to the calculation view and table function input parameter.


    The appendix contains some SQL scripts that can be used for creating table structures
    and populating them with exemplary data. For demonstration purposes, I will use
    these tables, so if you want to follow the scenarios described in this chapter,
    you can use the same source objects in your system.


    ## Publish HANA Tables Through BW/4HANA


    Case Study 1


    Company XYZ is using the BW/4HANA system as the main reporting platform. Reports
    created in BW/4HANA are later consumed by the Analysis for Microsoft Excel for
    Microsoft Office and SAP Analytics Cloud (SAC) front-end tools.


    Company XYZ evaluates the possibility of integrating external data into the SAP
    reporting platform to be able to utilize both SAP and non-SAP data in the Analysis
    for Microsoft Excel and SAC tools. In the pilot phase, Company XYZ decided to
    enable a single transactional table with external data. The table named ORDER_HEADER
    is populated with data related to orders that come from the non-SAP system. The
    requirement is to enable data from this HANA table for reporting into the BW/4HANA
    platform. The structure of the final query should be the same as the structure
    of the source table. Table [3-1](#508424_1_En_3_Chapter.xhtml#Tab1) describes
    the details of the source table structure.


    Table 3-1.


    Structure of the ORDER_HEADER Table


    | Column Name | Key | Data Type | Description |

    | --- | --- | --- | --- |

    | ORD_NUMBER | X | VARCHAR(10) | Order number |

    | DOC_DATE |   | DATE | Document date |

    | REQ_DATE |   | DATE | Requested delivery date |

    | SHIP_DATE |   | DATE | Ship date |

    | DELV_DATE |   | DATE | Delivery date |

    | STATUS |   | VARCHAR(3) | Order status |

    | CUST_NUMBER |   | VARCHAR(10) | Customer number |

    | EMP_NUMBER |   | VARCHAR(10) | Employee number |

    | FREE_TEXT |   | VARCHAR(5000) | Comments |


    Table ORDER_HEADER consists of nine columns. The primary key, which uniquely identifies
    each record, is the ORD_NUMBER column and contains order numbers. The rest of
    the columns contain order header information such as the status, document date,
    or customer number.


    Note


    Refer to the book’s appendix if you want to re-create the ORDER_HEADER table structure
    and populate it with data in your SAP HANA system.


    In this scenario, I will follow the modeling concept that was illustrated in Figure
    [2-3](#508424_1_En_2_Chapter.xhtml#Fig3) of Chapter [2](#508424_1_En_2_Chapter.xhtml).
    Figure [3-1](#508424_1_En_3_Chapter.xhtml#Fig1) presents the detailed approach
    that I will follow to fulfill the requirements from Case Study 1.


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig1_HTML.jpg](images/508424_1_En_3_Chapter/508424_1_En_3_Fig1_HTML.jpg)


    Figure 3-1.


    Publishing HANA tables through BW/4HANA (Case Study 1)


    From the BW/4HANA side, the table ORDER_HEADER will be consumed by an Open ODS
    View object. On top of that Open ODS View, I will create a CompositeProvider object
    (as shown in Figure [3-1](#508424_1_En_3_Chapter.xhtml#Fig1)). Once the modeling
    objects are created, I will consume the CompositeProvider with the Query object.


    ### Create the Source System


    To fulfill the requirements from Case Study 1, we do not need to create any additional
    objects on the HANA level. The only prerequisite for sourcing data from HANA is
    to create a dedicated source system object in the BW/4HANA system with SAP HANA’s
    local database schema connection type. This source system should point to the
    schema where the target tables are stored. See Figure [3-2](#508424_1_En_3_Chapter.xhtml#Fig2)
    as a reference.


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig2_HTML.jpg](images/508424_1_En_3_Chapter/508424_1_En_3_Fig2_HTML.jpg)


    Figure 3-2.


    Source system for BW4TRAINING HANA schema


    As shown in Figure [3-2](#508424_1_En_3_Chapter.xhtml#Fig2), the BW4H_TEST source
    system uses the local HANA schema as the connection type and points to the BW4TRAINING
    schema. This source system object is needed to be able to access the HANA tables
    stored in the BW4TRAINING schema and consume them via Open ODS View objects.'
  trans: "\n# 摘要\n\n本章阐述了如何利用 BW/4HANA 和 HANA 原生对象，实现从 HANA 物理表和虚拟表消费数据的敏捷数据模型。表 2-1\
    \ 总结了本章涵盖的每种建模概念的优缺点和用法。\n\n表 2-1. 建模概念对比\n\n| 传统数据模型 |\n| --- |\n| **优点** | •\
    \ 高水平的数据稳定性、质量和一致性• 可使用 SAP 业务内容• 通过安全模型管理访问权限 |\n| **缺点** | • 灵活性低，开发规则严格• 主要适用于\
    \ SAP 数据• 开发和维护工作量大• 始终需要数据持久化 |\n| **用途** | • SAP 数据模型 |\n| **虚拟数据供应** |\n| **优点**\
    \ | • 高灵活性• 开发工作量非常低• 易于实施和维护• 无需创建信息对象• 不需要数据持久化 |\n| **缺点** | • 无主数据• 仅提供特定信息片段•\
    \ 安全模型不适用（除非维护了对信息对象的关联） |\n| **用途** | • 简单的数据供应/提取• 临时分析• 直接访问虚拟表 |\n| **基于字段的数据模型**\
    \ |\n| **优点** | • 高灵活性• 易于实施和维护• 无需创建信息对象• 数据持久化可选• 可实现授权模型 |\n| **缺点** | • 开放式\
    \ ODS 视图对象不支持所有信息对象功能（例如层次结构）• 复杂数据模型性能较低 |\n| **用途** | • 非 SAP 数据模型 |\n| **混合数据模型**\
    \ |\n| **优点** | • 高灵活性• 无需创建新的信息对象• 可在适用处利用现有主数据对象• 通过安全模型管理访问权限 |\n| **缺点** |\
    \ • 如果没有严格的建模指南，混合来自不同区域的多个对象，模型可能变得复杂且难以维护• 对于复杂数据模型，性能可能不足 |\n| **用途** | • 维度与\
    \ SAP 主数据对应的非 SAP 数据模型 |\n| **组合数据模型** |\n| **优点** | • 使用户能够在全局数据（SAP 和非 SAP）上运行数据分析和报表•\
    \ 可实现授权模型 |\n| **缺点** | • 组合模型的设计需要详细且耗时的分析• 实施复杂• 通过外部 SAP HANA 视图产生大量依赖关系，可能对\
    \ SAP 模型产生负面影响• 维护工作量相当高 |\n| **用途** | • 将 SAP 和非 SAP 数据集成到单个模型中 |\n\n本章描述的概念让您了解如何将外部表数据供应到\
    \ BW/4HANA，如何基于非 SAP 表实现报表和数据模型，以及如何将 SAP 和非 SAP 数据集成到单个数据模型中。在接下来的章节中，您将通过示例学习如何在\
    \ BW/4HANA 系统中实施这些概念。\n\n# 通过 BW/4HANA 发布 HANA 对象\n\n在本章中，我将介绍几种不同的场景，这些场景下，HANA\
    \ 中驻留的数据需要通过 BW/4HANA 报表层进行发布。您将获得一份实用指南，了解如何将 HANA 表和 HANA 计算视图暴露给 BW/4HANA 系统。此外，我还会展示如何将在查询变量层面输入的值直接传递给计算视图和表函数输入参数。\n\
    \n附录中包含一些可用于创建表结构并用示例数据填充的 SQL 脚本。出于演示目的，我将使用这些表，因此如果您想遵循本章描述的场景，可以在您的系统中使用相同的源对象。\n\
    \n## 通过 BW/4HANA 发布 HANA 表\n\n### 案例研究 1\n\nXYZ 公司使用 BW/4HANA 系统作为主要的报表平台。在 BW/4HANA\
    \ 中创建的报表随后被 Microsoft Office 的 Analysis for Microsoft Excel 和 SAP Analytics Cloud\
    \ (SAC) 前端工具所消费。\n\nXYZ 公司评估了将外部数据集成到 SAP 报表平台的可能性，以便能够在 Analysis for Microsoft\
    \ Excel 和 SAC 工具中同时利用 SAP 和非 SAP 数据。在试点阶段，XYZ 公司决定启用一个包含外部数据的单张事务表。名为 `ORDER_HEADER`\
    \ 的表填充了来自非 SAP 系统的订单相关数据。需求是启用此 HANA 表中的数据，以便在 BW/4HANA 平台上进行报表。最终查询的结构应与源表的结构相同。表\
    \ 3-1 描述了源表结构的详细信息。\n\n表 3-1. `ORDER_HEADER` 表的结构\n\n| 列名 | 键 | 数据类型 | 描述 |\n\
    | --- | --- | --- | --- |\n| `ORD_NUMBER` | X | `VARCHAR(10)` | 订单编号 |\n| `DOC_DATE`\
    \ |   | `DATE` | 凭证日期 |\n| `REQ_DATE` |   | `DATE` | 要求交货日期 |\n| `SHIP_DATE` |\
    \   | `DATE` | 发货日期 |\n| `DELV_DATE` |   | `DATE` | 交付日期 |\n| `STATUS` |   | `VARCHAR(3)`\
    \ | 订单状态 |\n| `CUST_NUMBER` |   | `VARCHAR(10)` | 客户编号 |\n| `EMP_NUMBER` |   |\
    \ `VARCHAR(10)` | 员工编号 |\n| `FREE_TEXT` |   | `VARCHAR(5000)` | 备注 |\n\n`ORDER_HEADER`\
    \ 表包含九列。用于唯一标识每条记录的主键是 `ORD_NUMBER` 列，包含订单编号。其余列包含订单抬头信息，例如状态、凭证日期或客户编号。\n\n>\
    \ **注意**  \n> 如果您想在自己的 SAP HANA 系统中重新创建 `ORDER_HEADER` 表结构并用数据填充，请参考本书附录。\n\n\
    在此场景中，我将遵循第 2 章图 2-3 中示出的建模概念。图 3-1 展示了我为满足案例研究 1 要求所遵循的详细方法。\n\n![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig1_HTML.jpg](img/508424_1_En_3_Fig1_HTML.jpg)\n\
    \n图 3-1. 通过 BW/4HANA 发布 HANA 表（案例研究 1）\n\n从 BW/4HANA 端来看，表 `ORDER_HEADER` 将由开放式\
    \ ODS 视图对象消费。在该开放式 ODS 视图之上，我将创建一个 `CompositeProvider` 对象（如图 3-1 所示）。创建完建模对象后，我将通过查询对象消费该\
    \ `CompositeProvider`。\n\n### 创建源系统\n\n为了满足案例研究 1 的要求，我们不需要在 HANA 层面创建任何额外的对象。从\
    \ HANA 获取数据的唯一前提条件是在 BW/4HANA 系统中使用 SAP HANA 的本地数据库模式连接类型创建一个专用的源系统对象。该源系统应指向存储目标表的模式。请参考图\
    \ 3-2。\n\n![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig2_HTML.jpg](img/508424_1_En_3_Fig2_HTML.jpg)\n\
    \n图 3-2. BW4TRAINING HANA 模式的源系统\n\n如图 3-2 所示，`BW4H_TEST` 源系统使用本地 HANA 模式作为连接类型，并指向\
    \ `BW4TRAINING` 模式。需要此源系统对象才能访问存储在 `BW4TRAINING` 模式中的 HANA 表，并通过开放式 ODS 视图对象对其进行消费。\n"
- fmt: '### Create the Open ODS View Object for the Order-Header Data


    Tables residing in the HANA database can be directly consumed by Open ODS Views
    in BW/4HANA. To create a new Open ODS View object, go to the target InfoArea and
    select New ➤ Open ODS View (Figure [3-3](#508424_1_En_3_Chapter.xhtml#Fig3)).


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig3_HTML.png](images/508424_1_En_3_Chapter/508424_1_En_3_Fig3_HTML.png)


    Figure 3-3. Creating a new Open ODS View for the ORDER_HEADER table


    As shown in Figure [3-3](#508424_1_En_3_Chapter.xhtml#Fig3), the Open ODS View
    will be created under the BW/4HANA InfoArea. In the next step, you will be asked
    to provide the details of the Open ODS View object such as the technical name,
    description, and semantics. Figure [3-4](#508424_1_En_3_Chapter.xhtml#Fig4) displays
    the initial properties of the Open ODS View object.


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig4_HTML.jpg](images/508424_1_En_3_Chapter/508424_1_En_3_Fig4_HTML.jpg)


    Figure 3-4. Properties of the Open ODS View for the ORDER_HEADER table


    The technical name of the Open ODS View must be between 3 and 28 characters long.
    For this example, the technical name has been set to `ZEXTORD01`, while the description
    is Order-Header Data. Since the source table contains transactional data, I selected
    Facts as the semantics type (Figure [3-4](#508424_1_En_3_Chapter.xhtml#Fig4)).
    After providing the Open ODS View definition, I need to indicate the proper Source
    Type setting, as in Figure [3-5](#508424_1_En_3_Chapter.xhtml#Fig5).


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig5_HTML.jpg](images/508424_1_En_3_Chapter/508424_1_En_3_Fig5_HTML.jpg)


    Figure 3-5. Source Type setting of the Open ODS View for the ORDER_HEADER table


    Since I will be sourcing data from the HANA table, I selected Database Table or
    View for the Source Type setting. I will be using the existing `BW4H_TEST` source
    system (see Figure [3-2](#508424_1_En_3_Chapter.xhtml#Fig2)); hence, I selected
    the Existing BW Source System option. If the source system is not yet created,
    you can select the Owner/Schema option. With this step, you will be able to indicate
    the target schema and create the source system directly from the wizard.


    > Note: To be able to consume tables from any HANA schema, you need to grant schema
    access to the `SAPABAP1` technical user. Otherwise, the schema will not be visible
    from BW/4HANA.


    Run the following SQL script to grant schema access to the `SAPABAP1` user:


    ```sql

    GRANT SELECT ON SCHEMA "<schema name>" TO SAPABAP1

    ```


    To finalize the creation of the Open ODS View object, you need to indicate the
    target table. Once all the information is provided, the system will open the General
    tab of the Open ODS View editor (see Figure [3-6](#508424_1_En_3_Chapter.xhtml#Fig6)).


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig6_HTML.jpg](images/508424_1_En_3_Chapter/508424_1_En_3_Fig6_HTML.jpg)


    Figure 3-6. Open ODS View for the ORDER_HEADER table, General tab


    On the General tab, you will find an overview of the Open ODS View object. The
    actual structure of the Open ODS View is defined on the Facts tab. On this tab,
    I need to define the output fields and their properties. In Figure [3-7](#508424_1_En_3_Chapter.xhtml#Fig7)
    there is an output structure of the `ZEXTORD01` Open ODS View object presented.


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig7_HTML.jpg](images/508424_1_En_3_Chapter/508424_1_En_3_Fig7_HTML.jpg)


    Figure 3-7. Open ODS View for the ORDER_HEADER table, Facts tab


    On the Facts tab there are two Fields sections. On the left side there is a Source
    Fields section. In this section, you will find all the fields that are available
    in the source `ORDER_HEADER` table. The key symbol indicates the column that is
    the primary key of the table. You might notice that the SQL data types of the
    source table have been translated into BW/4HANA data types (i.e., `DATE` is `DATS`,
    and `VARCHAR` is `CHAR`). Table [3-2](#508424_1_En_3_Chapter.xhtml#Tab2) shows
    how the SQL data types are converted to BW data types.


    **Table 3-2.** Mapping Between SQL Data Types and BW Data Types


    | HANA SQL | BW/4HANA |

    | --- | --- |

    | DATE | DATS |

    | TIME | TIMS |

    | SECONDDATE | NUMC |

    | TIMESTAMP | NUMC |

    | TINYINT | INT1 |

    | SMALLINT | INT2 |

    | INTEGER | INT4 |

    | BIGINT | INT8 |

    | SMALLDECIMAL | FLTP |

    | DECIMAL | DEC |

    | REAL | FLTP |

    | DOUBLE | FLTP |

    | BOOLEAN | CHAR |

    | VARCHAR | CHAR |

    | NVARCHAR | CHAR |

    | ALPHANUM | CHAR |

    | SHORTTEXT | CHAR |

    | VARBINARY | RAW |

    | BLOB | *N/A* |

    | CLOB | SSTR |

    | NCLOB | SSTR |

    | TEXT | SSTR |

    | ST_GEOMETRY | CHAR |

    | ST_POINT | CHAR |


    As shown in Table [3-2](#508424_1_En_3_Chapter.xhtml#Tab2), not all SQL data types
    can be supported in the Open ODS View object. Large objects more than 1,333 characters
    long (i.e., the `BLOB` type or a `VARCHAR` longer than 1,333 characters) cannot
    be used in BW/4HANA objects.


    On the right side of the pane (Figure [3-7](#508424_1_En_3_Chapter.xhtml#Fig7))
    there is a View Fields section. In this section, you define the actual output
    structure of the Open ODS View. By default, the system created a structure proposal
    and assigned fields to specific groups. This is because of the `Create with Proposal`
    setting, which was selected when creating the Open ODS View (Figure [3-4](#508424_1_En_3_Chapter.xhtml#Fig4)).
    If needed, you can manually adjust the output structure by removing some fields
    or reassigning them to different groups. In my scenario, the `ORD_NUMBER` column
    has been assigned to the Characteristics (Key) group, and the rest of the fields
    were grouped under the Characteristics catalog. Since this is the target structure
    and no adjustments are required, I will proceed with activating the `ZEXTORD01`
    Open ODS View object.


    > Note: The unique field names of the Open ODS View are generated automatically
    and follow this pattern: `2F<Open ODS View name>-<Field Name>`. The System-Wide
    Unique Name setting cannot be modified.'
