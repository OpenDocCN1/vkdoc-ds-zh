    的计算列。该计算列使用 `WORKDAYS_BETWEEN` 函数来计算交货日期与请求交货日期之间的差值。当您将新计算的结果（`CM_DELV_DATE_DIFF_WD`）与从视图派生的计算结果（`CM_DELV_DATE_DIFF`）进行比较时，您会注意到前者的值在大多数情况下低于后者。列
