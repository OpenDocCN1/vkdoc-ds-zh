  trans: '

    ### 为订单抬头数据创建开放 ODS 视图对象


    位于 HANA 数据库中的表可以被 BW/4HANA 中的开放 ODS 视图直接使用。要创建一个新的开放 ODS 视图对象，请转到目标信息区域并选择 新建
    ➤ 开放 ODS 视图（图 3-3）。


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig3_HTML.png](img/508424_1_En_3_Fig3_HTML.png)


    图 3-3. 为 ORDER_HEADER 表创建新的开放 ODS 视图


    如图 3-3 所示，该开放 ODS 视图将在 BW/4HANA 信息区域下创建。在下一步中，系统将要求您提供开放 ODS 视图对象的详细信息，例如技术名称、描述和语义。图
    3-4 显示了开放 ODS 视图对象的初始属性。


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig4_HTML.jpg](img/508424_1_En_3_Fig4_HTML.jpg)


    图 3-4. 为 ORDER_HEADER 表创建的开放 ODS 视图的属性


    开放 ODS 视图的技术名称长度必须在 3 到 28 个字符之间。在此示例中，技术名称设置为 `ZEXTORD01`，描述为“订单抬头数据”。由于源表包含事务性数据，我选择了“事实（Facts）”作为语义类型（图
    3-4）。提供开放 ODS 视图定义后，我需要指定正确的“源类型”设置，如图 3-5 所示。


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig5_HTML.jpg](img/508424_1_En_3_Fig5_HTML.jpg)


    图 3-5. 为 ORDER_HEADER 表创建的开放 ODS 视图的“源类型”设置


    由于我将从 HANA 表中获取数据，因此在“源类型”设置中选择了“数据库表或视图”。我将使用现有的 `BW4H_TEST` 源系统（见图 3-2）；因此，我选择了“现有
    BW 源系统”选项。如果源系统尚未创建，您可以选择“所有者/模式”选项。通过此步骤，您将能够指定目标模式，并直接从向导中创建源系统。


    > 注：要能够使用任何 HANA 模式中的表，您需要向 `SAPABAP1` 技术用户授予模式访问权限。否则，该模式在 BW/4HANA 中将不可见。


    运行以下 SQL 脚本以向 `SAPABAP1` 用户授予模式访问权限：


    ```sql

    GRANT SELECT ON SCHEMA "<schema name>" TO SAPABAP1

    ```


    要完成开放 ODS 视图对象的创建，您需要指定目标表。提供所有信息后，系统将打开开放 ODS 视图编辑器的“常规”选项卡（见图 3-6）。


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig6_HTML.jpg](img/508424_1_En_3_Fig6_HTML.jpg)


    图 3-6. 为 ORDER_HEADER 表创建的开放 ODS 视图的“常规”选项卡


    在“常规”选项卡上，您可以找到开放 ODS 视图对象的概览。开放 ODS 视图的实际结构在“事实”选项卡上定义。在此选项卡上，我需要定义输出字段及其属性。图
    3-7 展示了 `ZEXTORD01` 开放 ODS 视图对象的输出结构。


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig7_HTML.jpg](img/508424_1_En_3_Fig7_HTML.jpg)


    图 3-7. 为 ORDER_HEADER 表创建的开放 ODS 视图的“事实”选项卡


    在“事实”选项卡上，有两个“字段”区域。左侧是“源字段”区域。在此区域中，您将找到源 `ORDER_HEADER` 表中所有可用的字段。键符号表示该列是表的主键。您可能会注意到，源表的
    SQL 数据类型已转换为 BW/4HANA 数据类型（例如，`DATE` 转换为 `DATS`，`VARCHAR` 转换为 `CHAR`）。表 3-2 显示了
    SQL 数据类型如何转换为 BW 数据类型。


    **表 3-2.** SQL 数据类型与 BW 数据类型之间的映射


    | HANA SQL | BW/4HANA |

    | --- | --- |

    | DATE | DATS |

    | TIME | TIMS |

    | SECONDDATE | NUMC |

    | TIMESTAMP | NUMC |

    | TINYINT | INT1 |

    | SMALLINT | INT2 |

    | INTEGER | INT4 |

    | BIGINT | INT8 |

    | SMALLDECIMAL | FLTP |

    | DECIMAL | DEC |

    | REAL | FLTP |

    | DOUBLE | FLTP |

    | BOOLEAN | CHAR |

    | VARCHAR | CHAR |

    | NVARCHAR | CHAR |

    | ALPHANUM | CHAR |

    | SHORTTEXT | CHAR |

    | VARBINARY | RAW |

    | BLOB | *不适用* |

    | CLOB | SSTR |

    | NCLOB | SSTR |

    | TEXT | SSTR |

    | ST_GEOMETRY | CHAR |

    | ST_POINT | CHAR |


    如表 3-2 所示，并非所有 SQL 数据类型都能在开放 ODS 视图对象中得到支持。长度超过 1,333 个字符的大对象（例如 `BLOB` 类型或长度超过
    1,333 个字符的 `VARCHAR`）不能在 BW/4HANA 对象中使用。


    在面板的右侧（图 3-7）有一个“视图字段”区域。在此区域中，您定义开放 ODS 视图的实际输出结构。默认情况下，系统会创建一个结构建议，并将字段分配到特定的组中。这是因为在创建开放
    ODS 视图时选中了“通过建议创建”设置（图 3-4）。如果需要，您可以通过删除某些字段或将其重新分配到不同的组来手动调整输出结构。在我的场景中，`ORD_NUMBER`
    列被分配到了“特征（关键值）”组，其余字段则归入了“特征目录”组。由于这是目标结构且无需调整，我将继续激活 `ZEXTORD01` 开放 ODS 视图对象。


    > 注：开放 ODS 视图的唯一字段名是自动生成的，并遵循以下模式：`2F<开放 ODS 视图名称>-<字段名称>`。“系统级唯一名称”设置不可修改。

    '
- fmt: '### Create the CompositeProvider for the Order-Header Data


    The `Open ODS View` object can be directly consumed by a query; however, as mentioned
    in Chapter [1](#508424_1_En_1_Chapter.xhtml), as a good practice it is better
    to create a `CompositeProvider` first. Therefore, in the future, you will be able
    to easily enhance the logical layer by combining additional providers or performing
    additional calculations. Follow the path shown in Figure [3-8](#508424_1_En_3_Chapter.xhtml#Fig8)
    to create a new `CompositeProvider`.


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig8_HTML.png](images/508424_1_En_3_Chapter/508424_1_En_3_Fig8_HTML.png)


    **Figure 3-8.** Creating a new `CompositeProvider` for the `ZEXTORD01` `Open ODS
    View`


    Once the technical name and description of `CompositeProvider` are provided, we
    can specify the default node and source providers. In our case, we will use the
    `ZEXTORD01` `Open ODS View` as a `PartProvider` object (Figure [3-9](#508424_1_En_3_Chapter.xhtml#Fig9)).


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig9_HTML.jpg](images/508424_1_En_3_Chapter/508424_1_En_3_Fig9_HTML.jpg)


    **Figure 3-9.** Selecting `PartProviders` and defining the default node for the
    `ZCPEXT01` `CompositeProvider`


    The `Join Providers` section requires you to provide at least two `PartProviders`.
    The `Union Providers` section can be used when we want to consume only a single
    `PartProvider`, so we could add the `ZEXTORD01` `Open ODS View` to this section.
    Optionally we can go directly to the `CompositeProvider` editor without providing
    the `InfoProviders` information. I skipped the step of providing the provider
    information and clicked the `Finish` button.


    I used the default settings for the `CompositeProvider`, so on the `General` tab
    I did not apply any changes and switched to the `Scenario` tab. Since I didn’t
    specify any providers, the `Scenario` tab shows just a default node, which is
    `Union`. To add the `ZCPEXT01` `Open ODS View`, click the `Add` button, as in
    Figure [3-10](#508424_1_En_3_Chapter.xhtml#Fig10).


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig10_HTML.jpg](images/508424_1_En_3_Chapter/508424_1_En_3_Fig10_HTML.jpg)


    **Figure 3-10.** Adding the `ZEXTORD01` `Open ODS View` to the `ZCPEXT01` `CompositeProvider`


    After clicking the `Add` button on the `Union` node, the `Add Provider` window
    opens. There are two `Search Scope` options: `InfoProvider` and `SAP HANA View`.
    Since we are looking for the `Open ODS View`, the `InfoProvider` should be selected
    for the `Search Scope` setting. Then in the search dialog, enter the name of the
    `InfoProvider` object. As shown in Figure [3-10](#508424_1_En_3_Chapter.xhtml#Fig10),
    I entered the `Open ODS View` technical name and then selected the target object.
    When we add the source `InfoProvider` object to the `CompositeProvider`, we will
    be able to define the `CompositeProvider` structure based on the available source
    fields. In our scenario, we need to simply add all the fields from the source
    to the target. This can be done by selecting all the fields (click the first field,
    and then press the `Shift` key and select the last field) and dragging them to
    the `Target` section. Optionally, we can right-click the `Open ODS View` icon
    and select the `Create Assignments` option, as shown in Figure [3-11](#508424_1_En_3_Chapter.xhtml#Fig11).


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig11_HTML.png](images/508424_1_En_3_Chapter/508424_1_En_3_Fig11_HTML.png)


    **Figure 3-11.** Defining the structure of the `ZCPEXT01` `CompositeProvider`


    When using the `Create Assignments` option, all fields will be automatically added
    to the output of the `CompositeProvider`. Names and descriptions will be also
    populated accordingly to the source fields.


    > **Note**

    > Unique field names for the `CompositeProviders` are generated automatically
    following this pattern: `4Z<CompositeProvider Name>-<Field Name>`. The `System-Wide
    Unique Name` setting cannot be modified.


    As shown in Figure [3-11](#508424_1_En_3_Chapter.xhtml#Fig11), nine fields were
    added to the `Target` section of the `ZCPEXT01` `CompositeProvider`. After defining
    the desired output structure of the `CompositeProvider`, activate it.


    > **Important**

    > When activating the `CompositeProvider` on top of the `Open ODS View`, you might
    see a `CalcIndex`-related issue. To fix the activation error, you need to run
    the ABAP program, which creates a column view for the `Open ODS View`.


    As mentioned, for the given scenario, the activation of the `CompositeProvider`
    might return a `CalcIndex` error. The error description will look as follows:


    ```

    ''XXX::SAPABAP1:0BW:BIA:ZEXTORD01:EXTRACTION (t -1)''"

    Could not activate object ''ZCPEXT01''

    Creation of column view for ZCPEXT01 failed

    EC:2048"column store error: fail to create scenario: [2007] Index does not exist;Failed
    to get

    ```


    To fix this issue, you need to go to the `SAP GUI` and run the `SE38` `tcode`.
    Then run the program `RSDDB_LOGINDEX_CREATE` (Figure [3-12](#508424_1_En_3_Chapter.xhtml#Fig12)).


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig12_HTML.png](images/508424_1_En_3_Chapter/508424_1_En_3_Fig12_HTML.png)


    **Figure 3-12.** Generating a `ColumnView` with the `RSDDB_LOGINDEX_CREATE` program


    In that program, set `FBPA` (1) as the object type and provide the name of your
    `InfoProvider` (2). Once you run the program (3) and the `Column View` is successfully
    activated, go back to the `CompositeProvider` and try to activate it again. The
    error should not appear anymore.


    ### Create the Query for the Order-Header Data


    The last step to fulfill the requirements described in Case Study 1 is to create
    a query that users will consume in front-end tools to access data from the external
    `ORDER_HEADER` table. The query will be created on top of the `CompositeProvider`
    `ZCPEXT01`. Follow the steps shown in Figure [3-13](#508424_1_En_3_Chapter.xhtml#Fig13)
    to create a new query on `CompositeProvider`.


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig13_HTML.jpg](images/508424_1_En_3_Chapter/508424_1_En_3_Fig13_HTML.jpg)


    **Figure 3-13.** Creating a new query on the `ZCPEXT01` `CompositeProvider`


    When creating a new query, the system will ask for a technical name and description.
    Then on the `Sheet Definition` tab of the query editor, we should specify the
    output structure of the report. Figure [3-14](#508424_1_En_3_Chapter.xhtml#Fig14)
    presents the output structure of the `ZCPEXT01_Q01` query.


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig14_HTML.jpg](images/508424_1_En_3_Chapter/508424_1_En_3_Fig14_HTML.jpg)


    **Figure 3-14.** Definition of the `ZCPEXT01_Q01` query


    The fields available in the underlying `CompositeProvider` can be added to the
    output of the query by right-clicking one of the blank sections (`Columns`, `Rows`,
    or `Free Characteristics`) available on the `Sheet Definition` tab. As shown in
    Figure [3-14](#508424_1_En_3_Chapter.xhtml#Fig14), all `CompositeProvider` fields
    have been added to the `Rows` section of the query. This means that when running
    the query in the front-end tool, all the fields will be added to the output of
    the report by default. At this point, no additional settings are required, so
    we can simply save the query. To preview the output of the query, I will use the
    `Analysis for Microsoft Excel` tool. Figure [3-15](#508424_1_En_3_Chapter.xhtml#Fig15)
    shows the final output of the `ZCPEXT01_Q01` query.


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig15_HTML.jpg](images/508424_1_En_3_Chapter/508424_1_En_3_Fig15_HTML.jpg)


    **Figure 3-15.** Output of the `ZCPEXT01_Q01` query in `Analysis for Microsoft
    Excel`


    Figure [3-15](#508424_1_En_3_Chapter.xhtml#Fig15) shows the content of the first
    six characteristics available in the `ZCPEXT01_Q01` query. The structure of the
    final report corresponds to the structure of the source table; hence, the requirement
    specified in Case Study 1 has been fulfilled. The same approach can be followed
    if the scenario required using a source virtual table instead of a persistent
    table.'
  raw: '### Create the CompositeProvider for the Order-Header Data


    The Open ODS View object can be directly consumed by a query; however, as mentioned
    in Chapter [1](#508424_1_En_1_Chapter.xhtml), as a good practice it is better
    to create a CompositeProvider first. Therefore, in the future, you will be able
    to easily enhance the logical layer by combining additional providers or performing
    additional calculations. Follow the path shown in Figure [3-8](#508424_1_En_3_Chapter.xhtml#Fig8)
    to create a new CompositeProvider.


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig8_HTML.png](images/508424_1_En_3_Chapter/508424_1_En_3_Fig8_HTML.png)


    Figure 3-8.


    Creating a new CompositeProvider for the ZEXTORD01 Open ODS View


    Once the technical name and description of CompositeProvider are provided, we
    can specify the default node and source providers. In our case, we will use the
    ZEXTORD01 Open ODS View as a PartProvider object (Figure [3-9](#508424_1_En_3_Chapter.xhtml#Fig9)).


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig9_HTML.jpg](images/508424_1_En_3_Chapter/508424_1_En_3_Fig9_HTML.jpg)


    Figure 3-9.


    Selecting PartProviders and defining the default node for the ZCPEXT01 CompositeProvider


    The Join Providers section requires you to provide at least two PartProviders.
    The Union Providers section can be used when we want to consume only a single
    PartProvider, so we could add the ZEXTORD01 Open ODS View to this section. Optionally
    we can go directly to the CompositeProvider editor without providing the InfoProviders
    information. I skipped the step of providing the provider information and clicked
    the Finish button.


    I used the default settings for the CompositeProvider, so on the General tab I
    did not apply any changes and switched to the Scenario tab. Since I didn’t specify
    any providers, the Scenario tab shows just a default node, which is Union. To
    add the ZCPEXT01 Open ODS View, click the Add button, as in Figure [3-10](#508424_1_En_3_Chapter.xhtml#Fig10).


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig10_HTML.jpg](images/508424_1_En_3_Chapter/508424_1_En_3_Fig10_HTML.jpg)


    Figure 3-10.


    Adding the ZEXTORD01 Open ODS View to the ZCPEXT01 CompositeProvider


    After clicking the Add button on the Union node, the Add Provider window opens.
    There are two Search Scope options: InfoProvider and SAP HANA View. Since we are
    looking for the Open ODS View, the InfoProvider should be selected for the Search
    Scope setting. Then in the search dialog, enter the name of the InfoProvider object.
    As shown in Figure [3-10](#508424_1_En_3_Chapter.xhtml#Fig10), I entered the Open
    ODS View technical name and then selected the target object. When we add the source
    InfoProvider object to the CompositeProvider, we will be able to define the CompositeProvider
    structure based on the available source fields. In our scenario, we need to simply
    add all the fields from the source to the target. This can be done by selecting
    all the fields (click the first field, and then press the Shift key and select
    the last field) and dragging them to the Target section. Optionally, we can right-click
    the Open ODS View icon and select the Create Assignments option, as shown in Figure
    [3-11](#508424_1_En_3_Chapter.xhtml#Fig11).


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig11_HTML.png](images/508424_1_En_3_Chapter/508424_1_En_3_Fig11_HTML.png)


    Figure 3-11.


    Defining the structure of the ZCPEXT01 CompositeProvider


    When using the Create Assignments option, all fields will be automatically added
    to the output of the CompositeProvider. Names and descriptions will be also populated
    accordingly to the source fields.


    Note


    Unique field names for the CompositeProviders are generated automatically following
    this pattern: 4Z<CompositeProvider Name>-<Field Name>. The System-Wide Unique
    Name setting cannot be modified.


    As shown in Figure [3-11](#508424_1_En_3_Chapter.xhtml#Fig11), nine fields were
    added to the Target section of the ZCPEXT01 CompositeProvider. After defining
    the desired output structure of the CompositeProvider, activate it.


    Important


    When activating the CompositeProvider on top of the Open ODS View, you might see
    a CalcIndex-related issue. To fix the activation error, you need to run the ABAP
    program, which creates a column view for the Open ODS View.


    As mentioned, for the given scenario, the activation of the CompositeProvider
    might return a CalcIndex error. The error description will look as follows:


    ```

    ''XXX::SAPABAP1:0BW:BIA:ZEXTORD01:EXTRACTION (t -1)''"

    Could not activate object ''ZCPEXT01''

    Creation of column view for ZCPEXT01 failed

    EC:2048"column store error: fail to create scenario: [2007] Index does not exist;Failed
    to get

    ```


    To fix this issue, you need to go to the SAP GUI and run the SE38 tcode. Then
    run the program RSDDB_LOGINDEX_CREATE (Figure [3-12](#508424_1_En_3_Chapter.xhtml#Fig12)).


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig12_HTML.png](images/508424_1_En_3_Chapter/508424_1_En_3_Fig12_HTML.png)


    Figure 3-12.


    Generating a ColumnView with the RSDDB_LOGINDEX_CREATE program


    In that program, set FBPA (1) as the object type and provide the name of your
    InfoProvider (2). Once you run the program (3) and the Column View is successfully
    activated, go back to the CompositeProvider and try to activate it again. The
    error should not appear anymore.


    ### Create the Query for the Order-Header Data


    The last step to fulfill the requirements described in Case Study 1 is to create
    a query that users will consume in front-end tools to access data from the external
    ORDER_HEADER table. The query will be created on top of the CompositeProvider
    ZCPEXT01\. Follow the steps shown in Figure [3-13](#508424_1_En_3_Chapter.xhtml#Fig13)
    to create a new query on CompositeProvider.


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig13_HTML.jpg](images/508424_1_En_3_Chapter/508424_1_En_3_Fig13_HTML.jpg)


    Figure 3-13.


    Creating a new query on the ZCPEXT01 CompositeProvider


    When creating a new query, the system will ask for a technical name and description.
    Then on the Sheet Definition tab of the query editor, we should specify the output
    structure of the report. Figure [3-14](#508424_1_En_3_Chapter.xhtml#Fig14) presents
    the output structure of the ZCPEXT01_Q01 query.


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig14_HTML.jpg](images/508424_1_En_3_Chapter/508424_1_En_3_Fig14_HTML.jpg)


    Figure 3-14.


    Definition of the ZCPEXT01_Q01 query


    The fields available in the underlying CompositeProvider can be added to the output
    of the query by right-clicking one of the blank sections (Columns, Rows, or Free
    Characteristics) available on the Sheet Definition tab. As shown in Figure [3-14](#508424_1_En_3_Chapter.xhtml#Fig14),
    all CompositeProvider fields have been added to the Rows section of the query.
    This means that when running the query in the front-end tool, all the fields will
    be added to the output of the report by default. At this point, no additional
    settings are required, so we can simply save the query. To preview the output
    of the query, I will use the Analysis for Microsoft Excel tool. Figure [3-15](#508424_1_En_3_Chapter.xhtml#Fig15)
    shows the final output of the ZCPEXT01_Q01 query.


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig15_HTML.jpg](images/508424_1_En_3_Chapter/508424_1_En_3_Fig15_HTML.jpg)


    Figure 3-15.


    Output of the ZCPEXT01_Q01 query in Analysis for Microsoft Excel


    Figure [3-15](#508424_1_En_3_Chapter.xhtml#Fig15) shows the content of the first
    six characteristics available in the ZCPEXT01_Q01 query. The structure of the
    final report corresponds to the structure of the source table; hence, the requirement
    specified in Case Study 1 has been fulfilled. The same approach can be followed
    if the scenario required using a source virtual table instead of a persistent
    table.'
  trans: '

    ### 创建订单抬头数据的 CompositeProvider


    `Open ODS View` 对象可以直接被查询使用；然而，如第 1 章所述，作为一种良好实践，最好先创建一个 `CompositeProvider`。这样一来，将来你可以通过组合其他提供程序或执行额外计算来轻松增强逻辑层。请按照图
    3-8 所示的路径创建一个新的 `CompositeProvider`。


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig8_HTML.png](img/508424_1_En_3_Fig8_HTML.png)


    **图 3-8.** 为 `ZEXTORD01` `Open ODS View` 创建新的 `CompositeProvider`


    提供 `CompositeProvider` 的技术名称和描述后，我们可以指定默认节点和源提供程序。在我们的案例中，我们将使用 `ZEXTORD01` `Open
    ODS View` 作为 `PartProvider` 对象（图 3-9）。


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig9_HTML.jpg](img/508424_1_En_3_Fig9_HTML.jpg)


    **图 3-9.** 选择 `PartProviders` 并为 `ZCPEXT01` `CompositeProvider` 定义默认节点


    `Join Providers` 部分要求你至少提供两个 `PartProviders`。当我们只想使用单个 `PartProvider` 时，可以使用 `Union
    Providers` 部分，因此我们可以将 `ZEXTORD01` `Open ODS View` 添加到该部分。或者，我们也可以直接进入 `CompositeProvider`
    编辑器而不提供 `InfoProviders` 信息。我跳过了提供提供程序信息的步骤，直接单击了 `Finish` 按钮。


    我对 `CompositeProvider` 使用了默认设置，因此在 `General` 选项卡上我没有做任何更改，直接切换到了 `Scenario` 选项卡。由于我没有指定任何提供程序，`Scenario`
    选项卡仅显示一个默认节点，即 `Union`。要添加 `ZCPEXT01` `Open ODS View`，请单击 `Add` 按钮，如图 3-10 所示。


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig10_HTML.jpg](img/508424_1_En_3_Fig10_HTML.jpg)


    **图 3-10.** 将 `ZEXTORD01` `Open ODS View` 添加到 `ZCPEXT01` `CompositeProvider`


    在 `Union` 节点上单击 `Add` 按钮后，将打开 `Add Provider` 窗口。有两个 `Search Scope` 选项：`InfoProvider`
    和 `SAP HANA View`。由于我们正在寻找 `Open ODS View`，因此应为 `Search Scope` 设置选择 `InfoProvider`。然后在搜索对话框中，输入
    `InfoProvider` 对象的名称。如图 3-10 所示，我输入了 `Open ODS View` 的技术名称，然后选择了目标对象。当我们向 `CompositeProvider`
    添加源 `InfoProvider` 对象时，我们将能够基于可用的源字段来定义 `CompositeProvider` 结构。在我们的场景中，我们需要简单地将所有字段从源添加到目标。这可以通过选择所有字段（单击第一个字段，然后按住
    `Shift` 键并选择最后一个字段）并将它们拖到 `Target` 部分来完成。或者，我们可以右键单击 `Open ODS View` 图标并选择 `Create
    Assignments` 选项，如图 3-11 所示。


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig11_HTML.png](img/508424_1_En_3_Fig11_HTML.png)


    **图 3-11.** 定义 `ZCPEXT01` `CompositeProvider` 的结构


    使用 `Create Assignments` 选项时，所有字段将自动添加到 `CompositeProvider` 的输出中。名称和描述也将根据源字段自动填充。


    > **注意**

    > 系统会自动按照以下模式为 `CompositeProviders` 生成唯一的字段名称：`4Z<CompositeProvider Name>-<Field
    Name>`。`System-Wide Unique Name` 设置不可修改。


    如图 3-11 所示，有九个字段被添加到了 `ZCPEXT01` `CompositeProvider` 的 `Target` 部分。定义好 `CompositeProvider`
    所需的输出结构后，请将其激活。


    > **重要事项**

    > 当激活基于 `Open ODS View` 之上的 `CompositeProvider` 时，你可能会遇到与 `CalcIndex` 相关的问题。要修复此激活错误，你需要运行
    ABAP 程序，该程序会为 `Open ODS View` 创建一个列视图。


    如前所述，对于给定的场景，激活 `CompositeProvider` 可能会返回一个 `CalcIndex` 错误。错误描述如下所示：


    ```

    ''XXX::SAPABAP1:0BW:BIA:ZEXTORD01:EXTRACTION (t -1)''"

    无法激活对象 ''ZCPEXT01''

    为 ZCPEXT01 创建列视图失败

    EC:2048"column store error: fail to create scenario: [2007] Index does not exist;Failed
    to get

    ```


    要解决此问题，你需要转到 `SAP GUI` 并运行 `SE38` `tcode`。然后运行程序 `RSDDB_LOGINDEX_CREATE`（图 3-12）。


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig12_HTML.png](img/508424_1_En_3_Fig12_HTML.png)


    **图 3-12.** 使用 `RSDDB_LOGINDEX_CREATE` 程序生成 `ColumnView`


    在该程序中，将 `FBPA` (1) 设置为对象类型，并提供你的 `InfoProvider` 的名称 (2)。运行程序 (3) 并且 `Column View`
    成功激活后，返回到 `CompositeProvider` 并再次尝试激活它。该错误应该不会再出现。


    ### 创建订单抬头数据的查询


    满足案例研究 1 中所述需求的最后一步是创建一个查询，用户将在前端工具中使用该查询来访问外部 `ORDER_HEADER` 表中的数据。该查询将基于 `CompositeProvider`
    `ZCPEXT01` 创建。请按照图 3-13 中的步骤在 `CompositeProvider` 上创建一个新查询。


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig13_HTML.jpg](img/508424_1_En_3_Fig13_HTML.jpg)


    **图 3-13.** 在 `ZCPEXT01` `CompositeProvider` 上创建新查询


    创建新查询时，系统将要求输入技术名称和描述。然后在查询编辑器的 `Sheet Definition` 选项卡上，我们应该指定报表的输出结构。图 3-14 展示了
    `ZCPEXT01_Q01` 查询的输出结构。


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig14_HTML.jpg](img/508424_1_En_3_Fig14_HTML.jpg)


    **图 3-14.** `ZCPEXT01_Q01` 查询的定义


    可以通过右键单击 `Sheet Definition` 选项卡上可用的空白区域（`Columns`、`Rows` 或 `Free Characteristics`）来将底层
    `CompositeProvider` 中可用的字段添加到查询的输出中。如图 3-14 所示，所有 `CompositeProvider` 字段都已添加到查询的
    `Rows` 部分。这意味着在前端工具中运行查询时，所有字段将默认添加到报表的输出中。到此为止，无需其他设置，因此我们可以直接保存查询。为了预览查询的输出，我将使用
    `Analysis for Microsoft Excel` 工具。图 3-15 展示了 `ZCPEXT01_Q01` 查询的最终输出。


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig15_HTML.jpg](img/508424_1_En_3_Fig15_HTML.jpg)


    **图 3-15.** `Analysis for Microsoft Excel` 中 `ZCPEXT01_Q01` 查询的输出


    图 3-15 展示了 `ZCPEXT01_Q01` 查询中可用的前六个特性的内容。最终报表的结构与源表的结构一致；因此，案例研究 1 中规定的需求已得到满足。如果场景要求使用源虚拟表而不是持久表，也可以采用相同的方法。

