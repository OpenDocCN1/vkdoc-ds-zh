    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig38_HTML.jpg](img/508424_1_En_6_Fig38_HTML.jpg)


    图 6-38. 为 ZINTFCT01 Open ODS 视图对象选择导航属性


    要启用产品导航属性，请选中`PRODUCT_ID`列（1），然后在“属性”部分点击*导航属性*按钮（2）。在*导航属性*窗口中，选择相应属性（3），并通过点击*确定*按钮（4）来确认操作。


    为了完成`ZINTFCT01` Open ODS 视图对象的配置，我们应该调整描述，使其对最终用户有意义。此外，我们可以为其他一些字段应用关联，如图 6-39
    所示。


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig39_HTML.jpg](img/508424_1_En_6_Fig39_HTML.jpg)


    图 6-39. 订单（`ZINTFCT01`）Open ODS 视图的最终输出结构


    如图 6-39 所示，所有字段的描述都已调整。末尾的“EXT”和“SAP”描述前缀使我们能够轻松识别该字段是仅特定于外部数据源，还是仅特定于 SAP 数据。字段`DOC_DATE`、`SHIP_DATE`和`UNIT`已分别与标准的
    SAP 信息对象`0DOC_DATE`、`0SHIP_DATE`和`0PO_UNIT`关联。


    将要执行的最后一项增强是为“已订购数量”关键值设置单位属性（图 6-40）。


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig40_HTML.png](img/508424_1_En_6_Fig40_HTML.png)


    图 6-40. 在 ZINTFCT01 Open ODS 视图对象中为“已订购数量”字段分配单位元素


    打开`QUANTITY`字段的属性时（1），我们可以为度量指定单位元素（2）。从下拉列表中，我们将能够选择已分配给*单位*部分的字段。如果该部分没有字段，则下拉列表将为空。激活`ZINTFCT01`
    Open ODS 视图对象后，我们可以验证结果（图 6-41）。


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig41_HTML.jpg](img/508424_1_En_6_Fig41_HTML.jpg)


    图 6-41. 在 Microsoft Excel 分析工具中 `ZINTFCT01` 对象的最终输出


    如图 6-41 所示，SAP 和非 SAP 订单现已合并到一个数据集中。得益于与产品维度的正确关联，用户能够看到产品名称而非编号。列标题中的前缀有助于我们理解该列是特定于
    SAP 还是非 SAP。“已订购数量”度量显示带有计量单位的数量值。


    ## 为合并后的 Open ODS 视图创建复合提供者


    为了利用订单数据模型的导航属性，我们将在订单 ALL（`ZINTFCT01`）Open ODS 视图对象之上创建一个最终的 `CompositeProvider`
    对象。图 6-42 展示了订单（`ZCPINTFCT01`）`CompositeProvider` 对象的结构。


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig42_HTML.jpg](img/508424_1_En_6_Fig42_HTML.jpg)


    图 6-42. 定义 `ZCPINTFCT01` `CompositeProvider` 对象的结构


    `ZCPINTFCT01` `CompositeProvider` 对象的数据源来自上一节创建的订单（ALL）Open ODS 视图对象。所有字段都已从源映射到目标。要显示可用的导航属性，请在*源*部分右键单击
    Open ODS 视图图标，然后选择*显示未分配的导航属性*（图 6-43）。


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig43_HTML.jpg](img/508424_1_En_6_Fig43_HTML.jpg)


    图 6-43. `ZCPINTFCT01` `CompositeProvider` 对象的“显示未分配的导航属性”菜单项


    选择图 6-43 所示的选项后，我们将能够将产品属性添加到 `CompositeProvider` 对象的输出中。或者，我们也可以直接从 `CompositeProvider`
    对象的“输出”选项卡中启用导航属性（参见图 4-23 作为参考）。图 6-44 展示了包含产品导航属性的 `ZCPINTFCT01` `CompositeProvider`
    对象的最终映射。


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig44_HTML.jpg](img/508424_1_En_6_Fig44_HTML.jpg)


    图 6-44. `ZCPINTFCT01` `CompositeProvider` 对象的最终结构


    图 6-44 展示了 `ZCPINTFCT01` `CompositeProvider` 对象的目标映射。对于导航属性描述，最好包含关于该列检索自哪个源对象的信息。这就是调整产品导航属性描述的原因；例如，`(EXT)
    Brand` 被更改为 `(EXT) Product – Brand`。这将帮助最终用户识别此信息来自产品维度的主数据，而非事务数据。激活 `CompositeProvider`
    对象后，我们可以创建最终查询（图 6-45）。


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig45_HTML.jpg](img/508424_1_En_6_Fig45_HTML.jpg)


    图 6-45. `ZCPINTFCT01_Q01` 查询的定义


    在最终查询中，我们定义了报表的目标结构。“已订购数量”度量已添加到*列*部分。所有属性都已添加到*自由特征*部分（图 6-45）。最后，为了验证报表，我们将在
    Microsoft Excel 分析工具中打开它。


    首先，当我们打开报表时，可以看到由于我们为描述添加了前缀，字段已被排序（图 6-46）。最终用户可以轻松识别与一个或另一个数据源相关的字段。两个数据源共有的字段显示在列表底部，不带前缀。为了验证报表的内容，我们可以将选定的字段添加到交叉表的输出中（图
    6-47）。


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig47_HTML.jpg](img/508424_1_En_6_Fig47_HTML.jpg)


    图 6-47. `ZCPINTFCT01_Q01` 查询在 Microsoft Excel 分析工具中的输出


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig46_HTML.jpg](img/508424_1_En_6_Fig46_HTML.jpg)


    图 6-46. `ZCPINTFCT01_Q01` 查询在 Microsoft Excel 分析工具中的字段显示列表


    图 6-47 展示了 `ZCPINTFCT01_Q01` 针对选定字段的输出结果。仅特定于特定数据源的字段在其标题名称中包含源系统前缀。这告诉我们，对于给定列，数据将仅对该特定系统可用。如果值不可用，将显示井号（`#`）符号。此外，“产品
    - 源系统”列有助于识别或过滤来自特定源系统的产品。此报表使我们能够对公司内的所有订单进行详细分析，无论订单是来自 SAP 还是外部系统。

