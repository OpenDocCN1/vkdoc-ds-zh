    For that purpose, we will use the Union node. After adding the Union node from
    the palette, we need to create a target structure that will be used for mapping
    fields from the underlying projections. We will use Table [6-2](#508424_1_En_6_Chapter.xhtml#Tab2)
    as a reference for creating the target structure and assigning the right data
    types in the Union node. Figure [6-11](#508424_1_En_6_Chapter.xhtml#Fig11) presents
    the steps for defining the target structure of the Union node.


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig11_HTML.jpg](images/508424_1_En_6_Chapter/508424_1_En_6_Fig11_HTML.jpg)


