    ➤ Query (see Figure [1-39](#508424_1_En_1_Chapter.xhtml#Fig39)). Optionally you
    can create a query using the Eclipse taskbar (File ➤ New ➤ Query).


    ![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig39_HTML.jpg](images/508424_1_En_1_Chapter/508424_1_En_1_Fig39_HTML.jpg)


    Figure 1-39


    Creating a new query on CompositeProvider


    On the first screen, as usual you need to provide a query technical name and optionally
    a description. Figure [1-40](#508424_1_En_1_Chapter.xhtml#Fig40) shows the General
    tab of the query editor.


    ![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig40_HTML.jpg](images/508424_1_En_1_Chapter/508424_1_En_1_Fig40_HTML.jpg)


    Figure 1-40


    Query, General tab


    Here is an overview of all the tabs available in the Query Designer (as in Figure
    [1-40](#508424_1_En_1_Chapter.xhtml#Fig40)).


    *   *General*: This tab is dedicated to setting general query properties (visibility
    to third-party tools, default display options, name, and description, etc.).


    *   *Filter*: This is used to set query filters and assign variables.


    *   *Sheet Definition*: This enables you to define a default report structure.
    Here you can specify a list of fields available for the reporting as well as define
    the default output structure.


    *   *Conditions*: This allows you to limit the output of the report according
    to defined rules (i.e., TopN records with the highest income value).


    *   *Exceptions*: Here you can specify a three-color scale used for highlighting
    deviations based on provided ranges.


    *   *Dependencies*: This shows a graphical diagram as a representation of the
    dependencies between the query and other query components (such as variables,
    calculated key figures, restricted key figures).


    *   *Runtime Properties*: If needed, you can change the default query runtime
    properties (query processing, caching, optimization parameters, etc.).


    To demonstrate the final output of the CompositeProvider (ZCP_PARTN) created in
    the previous section, I added a simple query on top of it. Figure [1-41](#508424_1_En_1_Chapter.xhtml#Fig41)
    shows the query definition.


    ![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig41_HTML.jpg](images/508424_1_En_1_Chapter/508424_1_En_1_Fig41_HTML.jpg)


    Figure 1-41


    Definition of a query on the CompositeProvider object ZCP_PARTN


    As shown in Figure [1-41](#508424_1_En_1_Chapter.xhtml#Fig41), there are eight
    fields added to the output of the query ZQ_001\. Five of them, available in the
    Rows section, will be displayed by default when opening the report. The three
    remaining fields are added to the Free Characteristics section. These will not
    be visible in the output of the report by default; however, the user will have
    the ability to add them if needed. Figure [1-42](#508424_1_En_1_Chapter.xhtml#Fig42)
    shows the results of the query ZQ_001 in the SAP Analysis for Microsoft Excel
    front-end tool.


    ![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig42_HTML.jpg](images/508424_1_En_1_Chapter/508424_1_En_1_Fig42_HTML.jpg)


    Figure 1-42


    Query ZQ_001 in SAP Analysis for Microsoft Office


    As defined in the Query object, when running the report in the Analysis for Microsoft
    Excel tool, you can see five fields displayed by default in the output (Figure
    [1-42](#508424_1_En_1_Chapter.xhtml#Fig42)). If you take a look at the list of
    fields available under the data source name, the remaining three are also available.
    In the previous section, I defined CompositeProvider as an union of three objects:
    HANA View, Open ODS View, and InfoObject. All three objects contain the same data,
    so you can notice that each record is displayed three times (except the # value,
    which exists only in InfoObject). The only differentiator for each record is the
    InfoProvider column, where you can find the source PartProvider information. Thanks
    to that column, you can easily identify the source object for each record. You
    may observe that for the calculation view, instead of its technical name, the
    value 2HG6AGKXYKFNVNVPEAIYQ1574LS is displayed. This is because BW/4HANA generates
    its own HANA views’ technical identifiers, with names that always start with a
    2H string.'
  trans: '

    创建计算字段时，在 SQL 表达式中只能引用 `CompositeProvider` 结构“目标”部分中可用的列。此外，表达式中指定的每个字段都应括在双引号中（例如
    `“0PLANT”`）。


    `CompositeProvider` 编辑器中最后一个可用的选项卡是“输出”选项卡（图 1-38）。


    ![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig38_HTML.jpg](img/508424_1_En_1_Fig38_HTML.jpg)


    图 1-38 – `CompositeProvider`，“输出”选项卡


    在 `CompositeProvider` “输出”选项卡的左窗格中，有一个“`提供程序字段`”部分，您可以在其中找到所有在“`场景`”选项卡中添加至输出的字段。除了列出的字段外，您还可以启用特定
    `InfoObject` 的导航属性以供报表使用（如果可用）。如果您从“`提供程序字段`”列表中右键单击一个 `InfoObject`，将会看到“`导航属性`”选项（如果所选
    `InfoObject` 没有导航属性，则该选项将变灰）。选择此选项后，“`导航属性`”窗口将出现，您便可以选择这些属性。在图 1-38 所示的示例中，您可以看到已为“工厂”（`0COUNTRY`）和“日历天”（`0CALMONTH`、`0CALYEAR`）添加了导航属性。


    “`输出`”选项卡的右窗格用于设置输出字段的属性。在此部分中，您可以应用字段与 `InfoObject`/`Open ODS View` 之间的关联，调整字段名称和描述，或更改字段数据类型。您还可以在此处指定输出字段的报表属性（图
    1-38）。激活 `CompositeProvider` 后，即可将其用于报表。在下一节中，我将在该 `CompositeProvider` 之上创建一个查询以展示最终输出。


    ### 查询


    通过右键单击特定的 `InfoProvider` 并选择 **新建** ➤ **查询**（见图 1-39）来创建查询。或者，您也可以使用 Eclipse 任务栏（**文件**
    ➤ **新建** ➤ **查询**）来创建查询。


    ![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig39_HTML.jpg](img/508424_1_En_1_Fig39_HTML.jpg)


    图 1-39 – 在 `CompositeProvider` 上创建新查询


    在第一个屏幕上，照常需要提供查询的技术名称，并可选地提供描述。图 1-40 显示了查询编辑器的“`常规`”选项卡。


    ![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig40_HTML.jpg](img/508424_1_En_1_Fig40_HTML.jpg)


    图 1-40 – 查询，“`常规`”选项卡


    以下是 `Query Designer` 中所有可用选项卡的概述（如图 1-40 所示）。


    - **常规**：此选项卡专用于设置通用查询属性（对第三方工具的可见性、默认显示选项、名称和描述等）。

    - **筛选器**：用于设置查询筛选器和分配变量。

    - **工作表定义**：使您能够定义默认报表结构。您可以在此处指定可用于报表的字段列表，以及定义默认输出结构。

    - **条件**：允许您根据定义的规则限制报表输出（例如，收入值最高的前 N 条记录）。

    - **异常**：在此处，您可以指定用于根据提供的范围高亮显示偏差的三色标度。

    - **依赖项**：以图形化图表显示查询与其他查询组件（如变量、计算关键值、受限关键值）之间的依赖关系。

    - **运行时属性**：如果需要，可以更改默认的查询运行时属性（查询处理、缓存、优化参数等）。


    为了演示上一节中创建的 `CompositeProvider`（`ZCP_PARTN`）的最终输出，我在其上添加了一个简单查询。图 1-41 显示了该查询的定义。


    ![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig41_HTML.jpg](img/508424_1_En_1_Fig41_HTML.jpg)


    图 1-41 – 在 `CompositeProvider` 对象 `ZCP_PARTN` 上定义查询


    如图 1-41 所示，查询 `ZQ_001` 的输出中添加了八个字段。其中五个字段位于“`行`”部分，在打开报表时将默认显示。其余三个字段被添加到“`自由特征`”部分。默认情况下，这些字段在报表输出中不可见；但用户可以根据需要添加它们。图
    1-42 显示了查询 `ZQ_001` 在 `SAP Analysis for Microsoft Excel` 前端工具中的结果。


    ![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig42_HTML.jpg](img/508424_1_En_1_Fig42_HTML.jpg)


    图 1-42 – `SAP Analysis for Microsoft Office` 中的查询 `ZQ_001`


    正如查询对象中所定义的那样，在 `Analysis for Microsoft Excel` 工具中运行报表时，您可以在输出中看到默认显示的五个字段（图 1-42）。如果您查看数据源名称下可用的字段列表，则其余三个字段也可用。在上一节中，我将
    `CompositeProvider` 定义为三个对象的联合：`HANA View`、`Open ODS View` 和 `InfoObject`。所有三个对象都包含相同的数据，因此您可以注意到每条记录都显示三次（除了仅存在于
    `InfoObject` 中的 `#` 值）。每条记录的唯一区分因素是“`InfoProvider`”列，您可以在其中找到源“`部分提供程序`”信息。借助该列，您可以轻松识别每条记录的源对象。您可能会注意到，对于计算视图，显示的值是其技术名称
    `2HG6AGKXYKFNVNVPEAIYQ1574LS`。这是因为 `BW/4HANA` 会生成其自己的 HANA 视图技术标识符，其名称始终以 `2H`
    字符串开头。

