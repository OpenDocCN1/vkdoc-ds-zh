    的 `PRODUCT_ID`，则目标 `PRODUCT_ID` 将继承该字段的数据类型，即 `VARCHAR(10)`，而不是 `VARCHAR(18)`。


    还请记住，并非所有目标字段都将有两个数据源的赋值。像 `CATEGORY_ID`、`BRAND_DESC` 和 `CREATED_ON` 这样的字段将只有一个来自数据源的赋值。除了来自两个数据源的字段之外，最好再有一个字段来帮助标识特定记录的源系统。为此，我们可以在目标结构中添加
