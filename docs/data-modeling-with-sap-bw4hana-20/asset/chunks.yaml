- fmt: '# Pass Input Parameters from the Query to the Table Function


    ## Case Study 4


    The business user realized that the current calculation of the difference between
    the delivery date and the requested delivery date is not very precise. Right now
    the calculation counts the number of days including weekends and public holidays.
    The requirement is to correct the calculation by excluding all nonworking days.
    In addition, the user requested the ability to provide a factory calendar as an
    input parameter. The difference between the delivery date and requested delivery
    date should now be calculated to include working days only, according to the provided
    calendar ID. The default value for the calendar variable should be set to US.


    To compute the number of workdays between two dates, we can use the `WORKDAYS_BETWEEN`
    SQL function. Unfortunately, this function is not supported by graphical calculation
    views, so we will not be able to simply adjust the existing calculation. To utilize
    the `WORKDAYS_BETWEEN` function, we need to create a table function first. There
    are two approaches that I cover for the given scenario.


    The first approach is to convert the entire calculation view (`CV_ORDER_HEADER`)
    logic into a SQL script. All the joins and calculations need to be manually converted
    into the SQL code and included in the table function definition (Figure [3-34](#508424_1_En_3_Chapter.xhtml#Fig34)).


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig34_HTML.jpg](images/508424_1_En_3_Chapter/508424_1_En_3_Fig34_HTML.jpg)


    Figure 3-34. Replacing the existing calculation view with the table function


    As shown in Figure [3-34](#508424_1_En_3_Chapter.xhtml#Fig34), the table function
    consumes source tables directly. For the considered scenario, it would be easy
    to translate the logic from a graphical view into the SQL script. There are just
    two tables to be joined; hence, this approach might be preferable. Moreover, the
    existing calculation view would not be needed anymore and could be removed. Therefore,
    there would be only two objects to be maintained on the HANA native side: the
    table function and the calculation view.


    > **Note:** Table functions cannot be consumed directly by `CompositeProvider`s,
    so there is a need to create a calculation view as an intermediate layer between
    a `CompositeProvider` and a table function.


    The second approach is to utilize an existing calculation view (`CV_ORDER_HEADER`)
    as a source of the table function SQL script. In that case, we do not need to
    write SQL code for all the joins and calculations, but simply use the current
    calculation view in the `FROM` clause of the SQL script. Figure [3-35](#508424_1_En_3_Chapter.xhtml#Fig35)
    illustrates the second approach.


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig35_HTML.jpg](images/508424_1_En_3_Chapter/508424_1_En_3_Fig35_HTML.jpg)


    Figure 3-35. Utilizing the existing calculation view in the table function


    Although the second approach is a bit faster to implement, I find the first one
    better from a maintenance perspective. In the approach depicted in Figure [3-35](#508424_1_En_3_Chapter.xhtml#Fig35),
    there are three HANA modeling objects. On the other hand, if the underlying calculation
    view is complex and includes dozens of tables and calculations, the second approach
    could be the preferable one.


    Despite that for the given scenario the first approach is more suitable, I will
    demonstrate how to fulfill the requirement from Case Study 4 using the second
    approach (Figure [3-35](#508424_1_En_3_Chapter.xhtml#Fig35)). This is because
    with this approach I will also have an opportunity to show how we can pass input
    parameter values from the table function to the underlying calculation view.


    ## Prepare the SQL Query for the Order-Header Data


    To start working on the table function, let’s switch to the SAP development perspective.
    As a first step, we need to prepare the `SELECT` statement on top of the `CV_ORDER_HEADER`
    calculation view. Instead of writing SQL code manually from scratch, we can automatically
    generate the `SELECT` statement out of the calculation view and use it as a reference
    for further enhancements. From the Repositories explorer tree, find the desired
    calculation view that will be used as the reference, right-click it, and choose
    the Generate Select SQL option as in Figure [3-36](#508424_1_En_3_Chapter.xhtml#Fig36).


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig36_HTML.jpg](images/508424_1_En_3_Chapter/508424_1_En_3_Fig36_HTML.jpg)


    Figure 3-36. Generating the SELECT SQL code from the calculation view


    After generating the `SELECT` SQL code from `CV_ORDER_HEADER`, Eclipse will open
    a new SQL console tab with the generated `SELECT` statement. A script generated
    out of `CV_ORDER_HEADER` has the following syntax:


    ```sql

    SELECT

    "ORD_NUMBER",

    "DOC_DATE",

    "REQ_DATE",

    "SHIP_DATE",

    "DELV_DATE",

    "STATUS",

    "CUST_NUMBER",

    "EMP_NUMBER",

    "FREE_TEXT",

    "STATUS_DESC",

    sum("CM_DELV_DATE_DIFF") AS "CM_DELV_DATE_DIFF"

    FROM "_SYS_BIC"."BW/4HANA/CV_ORDER_HEADER"(''PLACEHOLDER'' = (''$$IP_LANGU$$'',''''))

    GROUP BY "ORD_NUMBER",

    "DOC_DATE",

    "REQ_DATE",

    "SHIP_DATE",

    "DELV_DATE",

    "STATUS",

    "CUST_NUMBER",

    "EMP_NUMBER",

    "FREE_TEXT",

    "STATUS_DESC"

    ```


    As you might notice, the generated code includes a placeholder for the Language
    input parameter, which also needs to be maintained when creating a table function.
    In addition, to be able to pass the value from the table function input parameter
    to the graphical calculation view parameter, we need to apply specific syntax,
    which I will also explain later.


    Let’s now focus on adjusting our SQL query to fulfill the requirements from Case
    Study 4. To be able to preview results in the SQL console from the generated query,
    we need to pass a valid value to the `IP_LANGU` input parameter. Temporarily I
    will fix the placeholder value as `E`. The syntax for the placeholder now looks
    as follows:


    ```sql

    (''PLACEHOLDER'' = (''$$IP_LANGU$$'',''E''))

    ```


    Now I want to create a new calculation to compute the number of working days between
    the delivery date and requested delivery date. As mentioned, I will use the `WORKDAYS_BETWEEN`
    function.


    > **Note:** To use the `WORKDAYS_BETWEEN` function, table `TFACS` must be available
    in any HANA database schemas. `TFACS` is a standard SAP table, which contains
    information about working and nonworking days for each year and calendar type.


    The syntax for the `WORKDAYS_BETWEEN` function looks as follows:


    ```sql

    WORKDAYS_BETWEEN(<calendar_id>, <start_date>, <end_date>, <schema_name>)

    ```


    Here you will find the meaning of the syntax elements:


    - `<calendar_id>`: This specifies the ID for the factory calendar, which will
    be used as a reference for excluding weekends and public holidays from the computation.
    As per the requirements (Case Study 4) this value should be dynamically defined
    based on user input.


    - `<start_date>`: This represents the start date for calculating the difference
    in working days.


    - `<end_date>`: This represents the end date for calculating difference in working
    days.


    - `<schema_name>`: This specifies the schema name in which the `TFACS` table is
    stored.


    To test the function in the SQL console, I will temporarily set the value for
    `<calendar_id>` to `US`. For `<start_date>` I will use the Requested Delivery
    Date column, and for `<end_date>` I will use Delivery Date. In my HANA system,
    the `TFACS` table is stored in the `SAPABAP1` schema; hence, in place of `<schema_name>`,
    I will input the `SAPABAP1` value. The syntax for calculating days between the
    delivery date and requested delivery date will look as follows:


    ```sql

    WORKDAYS_BETWEEN(''US'',"REQ_DATE","DELV_DATE",''SAPABAP1'')

    ```'
