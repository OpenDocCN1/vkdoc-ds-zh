- fmt: '### Create the Calculation View on Top of the Table Function


    Next we need to create a calculation view on top of the `TF_ORDER_HEADER` table
    function. I created a new calculation view of a CUBE type named `CV_ORDER_HEADER_TF`.
    In this step, the important part will be to manage the input parameter mapping
    properly. After adding the table function as a data source of the calculation
    view, in the Semantics node we can manage this mapping. To map the table function
    input parameter to the target parameter of the final calculation view, click the
    Semantics node and then go to the Parameters/Variables tab. After that, click
    the arrow symbol next to the input parameter’s Manage Mapping button and select
    the Data Sources option (Figure [3-41](#508424_1_En_3_Chapter.xhtml#Fig41)).


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig41_HTML.png](images/508424_1_En_3_Chapter/508424_1_En_3_Fig41_HTML.png)


    Figure 3-41. Opening the window for input parameters mapping


    The Data Sources button opens a new window for managing the parameter mappings
    between the source and the target. Here we have an option to automatically create
    input parameters according to the parameters available in the underlying table
    function. By clicking the Auto Map By Name button (Figure [3-42](#508424_1_En_3_Chapter.xhtml#Fig42)),
    all input parameters will be automatically re-created and mapped to the source
    parameters. Figure [3-42](#508424_1_En_3_Chapter.xhtml#Fig42) displays the parameters
    mapping between the `TF_ORDER_HEADER` table function and the `CV_ORDER_HEADER_TF`
    calculation view.


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig42_HTML.jpg](images/508424_1_En_3_Chapter/508424_1_En_3_Fig42_HTML.jpg)


    Figure 3-42. Managing the input parameters mapping for the `CV_ORDER_HEADER_TF`
    calculation view


    The Auto Map By Name functionality creates input parameters with the same technical
    names as in a source object. Moreover, mapping between the source and the target
    is automatically managed. If needed, we can then adjust the properties of the
    created parameters. After defining the mapping and calculation view output structure,
    we can proceed with the activation. Afterward, it is worth testing the input parameters
    for the newly created view. The data preview should display a prompt with two
    input parameters (`IP_LANGU` and `IP_CALENDAR`). Results for the `CM_DELV_DATE_DIFF_WD`
    and `STATUS_DESC` columns should change according to the inserted values.


    ### Update the Source Calculation View for the Order-Header CompositeProvider


    As a next step, we need to update the BW/4HANA objects. If we want to keep the
    existing report in the current form, we could create a new composite provider
    and query, but in our scenario we want to update existing BW objects. This means
    that for the `ZCPEXT02` CompositeProvider we need to replace the source `CV_ORDER_HEADER`
    calculation view with the newly created `CV_ORDER_HEADER_TF` view.


    To adjust the source view for the `ZCPEXT02` CompositeProvider, open the object
    and switch to the Scenario tab. Then hover over the existing calculation view
    and click the Replace button (Figure [3-43](#508424_1_En_3_Chapter.xhtml#Fig43)).


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig43_HTML.png](images/508424_1_En_3_Chapter/508424_1_En_3_Fig43_HTML.png)


    Figure 3-43. Replacing the source view for the `ZCPEXT02` CompositeProvider


    When clicking the Replace button, the system will open the window for searching
    the object for replacement. After selecting the new target view (`CV_ORDER_HEADER_TF`),
    the system will replace the previous view with the new one. For columns and input
    parameters that have the same technical names, mapping between the source and
    the target will remain unchanged. The rest of the mappings need to be managed
    manually. Figure [3-44](#508424_1_En_3_Chapter.xhtml#Fig44) shows the updated
    target structure and the mapping for the `ZCPEXT02` CompositeProvider.


    The replacement of the view caused that `CM_DELV_DATE` field from the Target section
    to lose the assignment. This is because the measure derived from `CV_ORDER_HEADER_TF`
    has a different technical name (`CM_DELV_DATE_DIFF_WD`), so we need to create
    the missing assignment manually. The input parameter (`IP_CALENDAR`) should also
    be dragged to the Target section of the CompositeProvider structure because we
    want to use it as a reference for the new query variable. The final structure
    of the `ZCPEXT02` CompositeProvider should look like Figure [3-44](#508424_1_En_3_Chapter.xhtml#Fig44).


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig44_HTML.jpg](images/508424_1_En_3_Chapter/508424_1_En_3_Fig44_HTML.jpg)


    Figure 3-44. Updating the structure of the `ZCPEXT02` CompositeProvider


    ### Update the Query for the Order-Header Data with New Input Parameters


    The last step to accomplish a task from Case Study 4 is to update the `ZCPEXT02_Q01`
    query. For the newly mapped `IP_CALENDAR` parameter, we need to follow the same
    steps as we did for the `IP_LANGU` input parameter (the steps presented in Figures
    [3-27](#508424_1_En_3_Chapter.xhtml#Fig27) to [3-32](#508424_1_En_3_Chapter.xhtml#Fig32)).
    The final filter definition for the `ZCPEXT02_Q01` query should look like Figure
    [3-45](#508424_1_En_3_Chapter.xhtml#Fig45).


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig45_HTML.jpg](images/508424_1_En_3_Chapter/508424_1_En_3_Fig45_HTML.jpg)


    Figure 3-45. Mapping the `4ZCPEXT02-IP_CALENDAR` input parameter field to the
    query variable


    Now we can test the query against the requirements described in Case Study 4 by
    running the report in a front-end tool. When opening the query in Analysis for
    Microsoft Excel, we should now be prompted with two variables, as in Figure [3-46](#508424_1_En_3_Chapter.xhtml#Fig46).


    ![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig46_HTML.jpg](images/508424_1_En_3_Chapter/508424_1_En_3_Fig46_HTML.jpg)


    Figure 3-46. Updated Analysis for Microsoft Excel prompts for the `ZCPEXT02_Q01`
    query


    The Status Name and Requested Date vs. Delivery Date (Days) columns will return
    output according to the values entered on the selection screen for the Language
    and Calendar ID variables. This means that the requirements from Case Study 4
    have now been successfully fulfilled.


    ## Summary


    In this chapter, I described scenarios where the requirement was to expose data
    residing in HANA tables to the BW/4HANA layer. By taking advantage of field-based
    modeling and virtualization, we were able to create BW/4HANA reports without loading
    data into BW/4HANA modeling objects and also avoiding creating any single InfoObject.


    In Case Study 1, I presented how easily we can provision data from a HANA table
    to a BW/4HANA query. In this scenario, we utilized two BW/4HANA modeling objects:
    Open ODS View and CompositeProvider.


    Case Study 2 required us to combine two HANA tables before creating the final
    output. To achieve that, we brought into play an additional HANA modeling object
    called a calculation view. This helped us to join these two tables to create a
    dataset in the desired form before bringing it to the BW/4HANA layer.


    In Case Study 3, I demonstrated how to pass values from query variables to calculation
    view input parameters. We learned that calculation views with input parameters
    should be consumed directly by CompositeProviders (the Open ODS View layer needs
    to be skipped in such a scenario).


    The last scenario helped us to understand the usage of table functions. By going
    through the requirements from Case Study 4, we learned how to consume a calculation
    view in a table function. What is more, we walked through the examples of passing
    input parameter values between a calculation view and a table function in both
    directions. As a final result, you also learned how to pass query variable values
    into the table function SQL code.'
