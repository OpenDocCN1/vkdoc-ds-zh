- fmt: 'After applying an association between the `PRODUCT_ID` field and the `ZDIM01`
    Open ODS View, we also need to define compounding for this Open ODS View. By clicking
    the Compounding button (Figure [4-18](#508424_1_En_4_Chapter.xhtml#Fig18)), we
    will be able to select the second field used for association. In the given scenario,
    we should select the `CATEGORY_ID` field as a compound field. There might be a
    case when your master data Open ODS View compounded key consists of more than
    two fields. In such a case when making associations, you need to make sure that
    compounding is defined for each master data Open ODS View key field.


    Once we have assigned the master data Open ODS View to our Product field, we can
    select master data navigation attributes. In the Product Open ODS View, we defined
    the `Brand` field as a characteristic (Figure [4-9](#508424_1_En_4_Chapter.xhtml#Fig9)).
    All fields that are defined as Open ODS View characteristics can be later used
    as navigation attributes. This means that during reporting they can be utilized
    in the same way as all regular output fields. Figure [4-19](#508424_1_En_4_Chapter.xhtml#Fig19)
    shows how to enable the `Brand` field as a navigation attribute.


    ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig19_HTML.jpg](images/508424_1_En_4_Chapter/508424_1_En_4_Fig19_HTML.jpg)


    *Figure 4-19. Selecting the navigation attribute for `ZFCT01` Open ODS View*


    When clicking the Navigation Attributes button, we will see the list of characteristics
    available for the associated Master Data object. By selecting the check box next
    to the given attribute, we can add them as a navigation attribute. In our scenario,
    the Product Open ODS View (`ZDIM01`) has only one characteristic defined. After
    selecting the `BRAND_DESC` field, you will notice it is added to the View Fields
    section under the `PRODUCT_ID` field.


    Since all the adjustments are now in place, let’s now validate the output of the
    `ZFCT01` Open ODS View for selected fields (Figure [4-20](#508424_1_En_4_Chapter.xhtml#Fig20)).


    ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig20_HTML.jpg](images/508424_1_En_4_Chapter/508424_1_En_4_Fig20_HTML.jpg)


    *Figure 4-20. Final output of `ZFCT01` in Analysis for Microsoft Excel*


    This time when opening the Orders Open ODS View in Analysis for Microsoft Excel
    (Figure [4-20](#508424_1_En_4_Chapter.xhtml#Fig20)), in the fields for which we
    defined associations, text is set as a default display. Another advantage is that
    we can now utilize the attributes of the Product dimension (see Figure [4-21](#508424_1_En_4_Chapter.xhtml#Fig21)).


    ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig21_HTML.jpg](images/508424_1_En_4_Chapter/508424_1_En_4_Fig21_HTML.jpg)


    *Figure 4-21. Display of Product attributes for `ZFCT01` in Analysis for Microsoft
    Excel*


    First, you might notice that there is a new `Brand` field available for navigation.
    This field was not available in the initial output of `ZFCT01` (Figure [4-16](#508424_1_En_4_Chapter.xhtml#Fig16)).
    This is because we set this field as a navigation attribute (Figure [4-19](#508424_1_En_4_Chapter.xhtml#Fig19)).
    Other product-related information such as Currency and Price are visible under
    the Attributes section of the Product (`2FZDIM01`) field. Unlike the navigation
    attribute (`2FZDIM01=BRAND_DESC`), display attributes cannot be used for individual
    drill-down, but only together with the main characteristic (in this case with
    Product). Although the `Brand` field was set as a navigation attribute, it will
    also be visible as a Product attribute. On the left side of Figure [4-21](#508424_1_En_4_Chapter.xhtml#Fig21),
    you can see the output of the Product display attributes.


    ## Create the CompositeProvider Consuming the Open ODS View


    Before creating a query, I will create a CompositeProvider, which consumes the
    Orders data (`ZFCT01`) Open ODS View. Thanks to that, in the future I will be
    able to include additional objects by using the CompositeProvider Join and/or
    Union nodes. Figure [4-22](#508424_1_En_4_Chapter.xhtml#Fig22) shows how the `ZCPFCT01`
    CompositeProvider was modeled.


    ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig22_HTML.jpg](images/508424_1_En_4_Chapter/508424_1_En_4_Fig22_HTML.jpg)


    *Figure 4-22. Defining the structure of the `ZCPFCT01` CompositeProvider*


    In the CompositeProvider named `ZCPFCT01`, all the source fields have been mapped
    to the output. Although the `Brand` field was enabled in the underlying Open ODS
    View (`ZFCT01`) as a navigation attribute, it is not visible here by default.
    If we want to enable the navigation attribute, we should go to the Output tab.
    This tab shows a list of the CompositeProvider output fields. Here we can enable
    the navigation attributes if available.


    As shown in Figure [4-23](#508424_1_En_4_Chapter.xhtml#Fig23), associations to
    the Master Data/Texts Open ODS Views are inherited from the consumed `ZFCT01`
    object. By right-clicking the Product characteristic, we have an option to define
    navigation attributes to be included in the output. In the opened window, we will
    see the list of available fields that can be added as navigation attributes. In
    our scenario, there will be only one attribute available for the selection. After
    selecting the `Brand` field as a navigation attribute, it will be visible under
    the main Product characteristic (as in Figure [4-23](#508424_1_En_4_Chapter.xhtml#Fig23)).
    As this setup is the desired one, we can now activate the CompositeProvider.


    ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig23_HTML.jpg](images/508424_1_En_4_Chapter/508424_1_En_4_Fig23_HTML.jpg)


    *Figure 4-23. Adding the navigation attribute for the `ZCPFCT01` CompositeProvider*


    **Note**


    If you see a “column view” error during the CompositeProvider activation, run
    the `RSDDB_LOGINDEX_CREATE` program again for the underlying Open ODS View to
    create a column view (see Figure [3-12](#508424_1_En_3_Chapter.xhtml#Fig12)).


    After the successful activation of the CompositeProvider, you can create a final
    query on top. When defining a query structure (Figure [4-24](#508424_1_En_4_Chapter.xhtml#Fig24)),
    you will be able to use all the fields from the `ZCPFCT01` CompositeProvider including
    navigation attributes.


    ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig24_HTML.jpg](images/508424_1_En_4_Chapter/508424_1_En_4_Fig24_HTML.jpg)


    *Figure 4-24. Definition of the `ZCPFCT01_Q01` query*


    In this scenario, we have built a virtual data model based on Open ODS Views.
    Since the underlying tables are stored in the HANA database, we did not have to
    persist this data on the BW/4HANA layer. However, there are scenarios where the
    underlying data model is much more complex and requires many additional operations
    and calculations. Also, data does not always reside in HANA tables but can be
    queried from external databases through Smart Data Access. In such cases, we might
    need to create an additional staging layer to avoid performance issues at query
    runtime. In the next section, I will describe how to generate an intermediate
    BW/4HANA persistent layer for the existing Open ODS View objects.'
