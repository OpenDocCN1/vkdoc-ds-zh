- fmt: "### InfoObject\n\nWhen creating a new `InfoObject` using an Eclipse BW modeling\
    \ perspective, on the `General` tab you will find two check boxes for generating\
    \ external SAP HANA views. By default they are grayed out, but once you select\
    \ `Master Data` and `Usable as InfoProvider` options, they will become active\
    \ (see Figure [1-24](#508424_1_En_1_Chapter.xhtml#Fig24)).\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig24_HTML.jpg](images/508424_1_En_1_Chapter/508424_1_En_1_Fig24_HTML.jpg)\n\
    \n**Figure 1-24** InfoObject external SAP HANA view options\n\nAs shown in Figure\
    \ [1-24](#508424_1_En_1_Chapter.xhtml#Fig24), the `Master Data` check box activates\
    \ the `External SAP HANA View for Master Data` option, and the `Usable as InfoProvider`\
    \ check box activates the option `External SAP HANA View for Reporting`. After\
    \ activating the view, you will see the location of each HANA view that was generated\
    \ from the `InfoObject`.\n\n> **Note**  \n> The default location for generating\
    \ views out of BW objects is `system-local.bw.bw2hana`. However, you can define\
    \ a different location using the transaction `RS2HANA_VIEW`.\n\nWhen I switch\
    \ to the SAP HANA modeler perspective and navigate to the package path shown in\
    \ Figure [1-24](#508424_1_En_1_Chapter.xhtml#Fig24), I will see two created HANA\
    \ views, which were generated after `InfoObject` activation. The first calculation\
    \ view is named the same as the `InfoObject`. The name of the second one is a\
    \ combination of the `InfoObject` and a trailing `_REPORTING` string (see Figure\
    \ [1-25](#508424_1_En_1_Chapter.xhtml#Fig25) as a reference).\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig25_HTML.jpg](images/508424_1_En_1_Chapter/508424_1_En_1_Fig25_HTML.jpg)\n\
    \n**Figure 1-25** Calculation views generated from the InfoObject\n\nIn addition\
    \ to the naming, the main difference between these two views is that the view\
    \ generated for the Master Data object (`ZZPARTN`) is of the `DIMENSION` data\
    \ category type, which means it cannot be consumed by reporting tools and all\
    \ the output fields are the `Attribute` type. `ZZPARTN_REPORTING` is a `CUBE`-type\
    \ calculation view, which can be used for reporting and consists of both attributes\
    \ and measures. Depending on your needs, you can decide which type of external\
    \ view is more suitable in your scenario.\n\n> **Note**  \n> There are multiple\
    \ restrictions for generating external HANA views from BW objects, so you should\
    \ not select that option for every single `InfoObject` by default. For more information\
    \ about restrictions for generating SAP HANA views from the BW/4HANA system, refer\
    \ to the official SAP documentation.\n\nExternal HANA views are generated with\
    \ the `SQL Analytic` privilege. During the generation of external HANA views,\
    \ for each view there is also a new role generated. Figure [1-26](#508424_1_En_1_Chapter.xhtml#Fig26)\
    \ displays two roles that were generated for two external views for the `ZZPARTN`\
    \ InfoObject.\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig26_HTML.jpg](images/508424_1_En_1_Chapter/508424_1_En_1_Fig26_HTML.jpg)\n\
    \n**Figure 1-26** Roles generated for InfoObject external views\n\nUntil these\
    \ roles are not assigned to your user or to the role assigned to your user, you\
    \ will face authorization issues when trying to execute the external view. To\
    \ avoid the manual work of assigning the generated role to the user every time\
    \ a new external view is created, it is possible to automatically assign these\
    \ roles to the user/role for each external view (tcodes: `RS2HANA_ADMIN`, `RS2HANA_CHECK`).\n\
    \nExternal views generated from BW/4HANA objects should not be manually modified.\
    \ This is because the external view will be regenerated every time the `InfoObject`\
    \ is activated, so all the manual changes will be overwritten with the default\
    \ settings. If you want to perform any additional data manipulation for that object,\
    \ you need to create a regular calculation view that will use the external view\
    \ as a source. In the next chapters of the book, I will walk through some use\
    \ cases where I will make use of `InfoObject` external views.\n\nAnother `InfoObject`\
    \ functionality that I find as useful is the `SAP HANA View` option set as the\
    \ `Read Access Type` parameter. This feature can be utilized while creating virtual\
    \ data models. Once the `SAP HANA View` access type is set, you do not need to\
    \ load any data into the `InfoObject` structures; instead, simply indicate the\
    \ SAP HANA view as a source and apply the associations between the calculation\
    \ view fields and the `InfoObject` attributes (see Figure [1-27](#508424_1_En_1_Chapter.xhtml#Fig27)).\n\
    \n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig27_HTML.png](images/508424_1_En_1_Chapter/508424_1_En_1_Fig27_HTML.png)\n\
    \n**Figure 1-27** InfoObject with SAP HANA View access type property\n\nAs shown\
    \ in Figure [1-27](#508424_1_En_1_Chapter.xhtml#Fig27), the `InfoObject` `ZVPARTN`\
    \ has the `SAP HANA View` access type set. It reads data from the calculation\
    \ view `CV_PARTNER`, which resides in the BW/4HANA package. The `InfoObject` `ZVPARTN`\
    \ is mapped to the `PARTNER_ID` field of the calculation view. The `InfoObject`\
    \ attributes `0PLANT` and `0CALDAY` are mapped to the view fields `PLANT` and\
    \ `CREATION_DATE` accordingly.\n\nThe last feature of the BW/4HANA `InfoObject`\
    \ that from my perspective is worth noting is the transitive attributes feature.\
    \ I will introduce this functionality based on the example presented in Figure\
    \ [1-28](#508424_1_En_1_Chapter.xhtml#Fig28).\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig28_HTML.jpg](images/508424_1_En_1_Chapter/508424_1_En_1_Fig28_HTML.jpg)\n\
    \n**Figure 1-28** Use case for transitive attributes\n\nI created the `Partner`\
    \ (`ZZPARTN`) `InfoObject` that has `Plant` (`0PLANT`) set as a navigational attribute.\
    \ Despite the information about `Plant` associated with `Partner`, the reporting\
    \ requirement is to also display the `Country` (`0COUNTRY`) and `Region` (`0REGION`)\
    \ values of that `Plant` attribute. These two fields are navigational attributes\
    \ of `Plant`. To fulfill this requirement, I want to make both the `Plant` and\
    \ `Plant` attributes available as navigational attributes of the `Partner` (`ZZPARTN`)\
    \ `InfoObject`. This requirement can be met by maintaining transitive attributes\
    \ for the `ZZPARTN` `InfoObject`. On the `Attributes` tab, right-click the `Navigation\
    \ Attributes` pane and select \"Maintain transitive attributes\" (Figure [1-29](#508424_1_En_1_Chapter.xhtml#Fig29)).\n\
    \n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig29_HTML.png](images/508424_1_En_1_Chapter/508424_1_En_1_Fig29_HTML.png)\n\
    \n**Figure 1-29** \"Maintain transitive attributes\" option for InfoObject\n\n\
    Once you select `Transitive Attributes` from the maintenance window, the attributes\
    \ will appear in the `Display and Navigation Attributes` section. In this section,\
    \ there is a `Transitive Attribute` column, and based on that, you can identify\
    \ whether a specific field is a regular attribute or transitive. As shown in Figure\
    \ [1-29](#508424_1_En_1_Chapter.xhtml#Fig29), the attributes `0COUNTRY` and `0REGION`\
    \ have been marked with the flag `true` in the `Transitive Attribute` column.\
    \ With this configuration, the `Country` and `Region` columns can be used for\
    \ the reporting, although they will not be physically loaded into the `Partner`\
    \ (`ZZPARTN`) master data table. Transitive attributes simplify development, reduce\
    \ the maintenance, and eliminate redundancy."
  raw: '### InfoObject


    When creating a new InfoObject using an Eclipse BW modeling perspective, on the
    General tab you will find two check boxes for generating external SAP HANA views.
    By default they are grayed out, but once you select Master Data and Usable as
    InfoProvider options, they will become active (see Figure [1-24](#508424_1_En_1_Chapter.xhtml#Fig24)).


    ![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig24_HTML.jpg](images/508424_1_En_1_Chapter/508424_1_En_1_Fig24_HTML.jpg)


    Figure 1-24


    InfoObject external SAP HANA view options


    As shown in Figure [1-24](#508424_1_En_1_Chapter.xhtml#Fig24), the Master Data
    check box activates the External SAP HANA View for Master Data option, and the
    Usable as InfoProvider check box activates the option External SAP HANA View for
    Reporting. After activating the view, you will see the location of each HANA view
    that was generated from the InfoObject.


    Note


    The default location for generating views out of BW objects is system-local.bw.bw2hana.
    However, you can define a different location using the transaction RS2HANA_VIEW.


    When I switch to the SAP HANA modeler perspective and navigate to the package
    path shown in Figure [1-24](#508424_1_En_1_Chapter.xhtml#Fig24), I will see two
    created HANA views, which were generated after InfoObject activation. The first
    calculation view is named the same as the InfoObject. The name of the second one
    is a combination of the InfoObject and a trailing _REPORTING string (see Figure
    [1-25](#508424_1_En_1_Chapter.xhtml#Fig25) as a reference).


    ![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig25_HTML.jpg](images/508424_1_En_1_Chapter/508424_1_En_1_Fig25_HTML.jpg)


    Figure 1-25


    Calculation views generated from the InfoObject


    In addition to the naming, the main difference between these two views is that
    the view generated for the Master Data object (ZZPARTN) is of the DIMENSION data
    category type, which means it cannot be consumed by reporting tools and all the
    output fields are the Attribute type. ZZPARTN_REPORTING is a CUBE-type calculation
    view, which can be used for reporting and consists of both attributes and measures.
    Depending on your needs, you can decide which type of external view is more suitable
    in your scenario.


    Note


    There are multiple restrictions for generating external HANA views from BW objects,
    so you should not select that option for every single InfoObject by default. For
    more information about restrictions for generating SAP HANA views from the BW/4HANA
    system, refer to the official SAP documentation.


    External HANA views are generated with the SQL Analytic privilege. During the
    generation of external HANA views, for each view there is also a new role generated.
    Figure [1-26](#508424_1_En_1_Chapter.xhtml#Fig26) displays two roles that were
    generated for two external views for the ZZPARTN InfoObject.


    ![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig26_HTML.jpg](images/508424_1_En_1_Chapter/508424_1_En_1_Fig26_HTML.jpg)


    Figure 1-26


    Roles generated for InfoObject external views


    Until these roles are not assigned to your user or to the role assigned to your
    user, you will face authorization issues when trying to execute the external view.
    To avoid the manual work of assigning the generated role to the user every time
    a new external view is created, it is possible to automatically assign these roles
    to the user/role for each external view (tcodes: RS2HANA_ADMIN, RS2HANA_CHECK).


    External views generated from BW/4HANA objects should not be manually modified.
    This is because the external view will be regenerated every time the InfoObject
    is activated, so all the manual changes will be overwritten with the default settings.
    If you want to perform any additional data manipulation for that object, you need
    to create a regular calculation view that will use the external view as a source.
    In the next chapters of the book, I will walk through some use cases where I will
    make use of InfoObject external views.


    Another InfoObject functionality that I find as useful is the SAP HANA View option
    set as the Read Access Type parameter. This feature can be utilized while creating
    virtual data models. Once the SAP HANA View access type is set, you do not need
    to load any data into the InfoObject structures; instead, simply indicate the
    SAP HANA view as a source and apply the associations between the calculation view
    fields and the InfoObject attributes (see Figure [1-27](#508424_1_En_1_Chapter.xhtml#Fig27)).


    ![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig27_HTML.png](images/508424_1_En_1_Chapter/508424_1_En_1_Fig27_HTML.png)


    Figure 1-27


    InfoObject with SAP HANA View access type property


    As shown in Figure [1-27](#508424_1_En_1_Chapter.xhtml#Fig27), the InfoObject
    ZVPARTN has the SAP HANA View access type set. It reads data from the calculation
    view CV_PARTNER, which resides in the BW/4HANA package. The InfoObject ZVPARTN
    is mapped to the PARTNER_ID field of the calculation view. The InfoObject attributes
    0PLANT and 0CALDAY are mapped to the view fields PLANT and CREATION_DATE accordingly.


    The last feature of the BW/4HANA InfoObject that from my perspective is worth
    noting is the transitive attributes feature. I will introduce this functionality
    based on the example presented in Figure [1-28](#508424_1_En_1_Chapter.xhtml#Fig28).


    ![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig28_HTML.jpg](images/508424_1_En_1_Chapter/508424_1_En_1_Fig28_HTML.jpg)


    Figure 1-28


    Use case for transitive attributes


    I created the Partner (ZZPARTN) InfoObject that has Plant (0PLANT) set as a navigational
    attribute. Despite the information about Plant associated with Partner, the reporting
    requirement is to also display the Country (0COUNTRY) and Region (0REGION) values
    of that Plant attribute. These two fields are navigational attributes of Plant.
    To fulfill this requirement, I want to make both the Plant and Plant attributes
    available as navigational attributes of the Partner (ZZPARTN) InfoObject. This
    requirement can be met by maintaining transitive attributes for the ZZPARTN InfoObject.
    On the Attributes tab, right-click the Navigation Attributes pane and select “Maintain
    transitive attributes” (Figure [1-29](#508424_1_En_1_Chapter.xhtml#Fig29)).


    ![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig29_HTML.png](images/508424_1_En_1_Chapter/508424_1_En_1_Fig29_HTML.png)


    Figure 1-29


    “Maintain transitive attributes” option for InfoObject


    Once you select Transitive Attributes from the maintenance window, the attributes
    will appear in the Display and Navigation Attributes section. In this section,
    there is a Transitive Attribute column, and based on that, you can identify whether
    a specific field is a regular attribute or transitive. As shown in Figure [1-29](#508424_1_En_1_Chapter.xhtml#Fig29),
    the attributes 0COUNTRY and 0REGION have been marked with the flag true in the
    Transitive Attribute column. With this configuration, the Country and Region columns
    can be used for the reporting, although they will not be physically loaded into
    the Partner (ZZPARTN) master data table. Transitive attributes simplify development,
    reduce the maintenance, and eliminate redundancy.'
  trans: "\n### InfoObject\n\n在使用 Eclipse BW 建模透视图创建新的 `InfoObject` 时，在 `General`（常规）选项卡上，您会找到两个用于生成外部\
    \ SAP HANA 视图的复选框。默认情况下，它们呈灰色不可用状态，但一旦您选中 `Master Data`（主数据）和 `Usable as InfoProvider`（可用作信息提供者）选项，它们就会变为可用状态（参见图\
    \ 1-24）。\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig24_HTML.jpg](img/508424_1_En_1_Fig24_HTML.jpg)\n\
    \n**图 1-24** InfoObject 外部 SAP HANA 视图选项\n\n如图 1-24 所示，`Master Data`（主数据）复选框激活了\
    \ `External SAP HANA View for Master Data`（主数据外部 SAP HANA 视图）选项，而 `Usable as InfoProvider`（可用作信息提供者）复选框激活了\
    \ `External SAP HANA View for Reporting`（报表外部 SAP HANA 视图）选项。激活视图后，您将看到从 `InfoObject`\
    \ 生成的每个 HANA 视图的位置。\n\n> **注意**  \n> 从 BW 对象生成视图的默认位置是 `system-local.bw.bw2hana`。但是，您可以使用事务代码\
    \ `RS2HANA_VIEW` 定义一个不同的位置。\n\n当我切换到 SAP HANA 建模器透视图并导航到图 1-24 所示的包路径时，我将看到两个已创建的\
    \ HANA 视图，它们是在 `InfoObject` 激活后生成的。第一个计算视图的名称与 `InfoObject` 相同。第二个视图的名称是 `InfoObject`\
    \ 名称后跟 `_REPORTING` 字符串的组合（参见图 1-25 作为参考）。\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig25_HTML.jpg](img/508424_1_En_1_Fig25_HTML.jpg)\n\
    \n**图 1-25** 从 InfoObject 生成的计算视图\n\n除了命名之外，这两个视图的主要区别在于：为 Master Data 对象生成的视图（`ZZPARTN`）属于\
    \ `DIMENSION`（维度）数据类别类型，这意味着它不能被报表工具消费，并且所有输出字段都是 `Attribute`（属性）类型。`ZZPARTN_REPORTING`\
    \ 是一个 `CUBE`（立方体）类型的计算视图，可用于报表，并且同时包含属性和度量。根据您的需求，您可以决定哪种类型的外部视图更适合您的场景。\n\n>\
    \ **注意**  \n> 从 BW 对象生成外部 HANA 视图存在多种限制，因此您不应默认对每个 `InfoObject` 都选择该选项。有关从 BW/4HANA\
    \ 系统生成 SAP HANA 视图的限制的更多信息，请参考官方 SAP 文档。\n\n外部 HANA 视图生成时带有 `SQL Analytic`（SQL\
    \ 分析）权限。在生成外部 HANA 视图期间，每个视图还会生成一个新的角色。图 1-26 展示了为 `ZZPARTN` InfoObject 的两个外部视图生成的两个角色。\n\
    \n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig26_HTML.jpg](img/508424_1_En_1_Fig26_HTML.jpg)\n\
    \n**图 1-26** 为 InfoObject 外部视图生成的角色\n\n除非将这些角色分配给您的用户或分配给您的用户角色，否则在尝试执行外部视图时，您将遇到授权问题。为了避免每次创建新外部视图时都需要手动将生成的角色分配给用户，可以自动将这些角色分配给用户/角色（事务代码：`RS2HANA_ADMIN`、`RS2HANA_CHECK`）。\n\
    \n不应手动修改从 BW/4HANA 对象生成的外部视图。这是因为每次激活 `InfoObject` 时，外部视图都会重新生成，因此所有手动更改都将被默认设置覆盖。如果您想对该对象执行任何额外的数据操作，您需要创建一个常规的计算视图，并将外部视图作为源。在本书的后续章节中，我将介绍一些使用\
    \ `InfoObject` 外部视图的用例。\n\n我认为另一个有用的 `InfoObject` 功能是将 `SAP HANA View`（SAP HANA\
    \ 视图）选项设置为 `Read Access Type`（读取访问类型）参数。此功能可以在创建虚拟数据模型时使用。一旦设置了 `SAP HANA View`（SAP\
    \ HANA 视图）访问类型，您无需将任何数据加载到 `InfoObject` 结构中；相反，只需将 SAP HANA 视图指定为源，并在计算视图字段与 `InfoObject`\
    \ 属性之间应用关联即可（参见图 1-27）。\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig27_HTML.png](img/508424_1_En_1_Fig27_HTML.png)\n\
    \n**图 1-27** 具有 SAP HANA 视图访问类型属性的 InfoObject\n\n如图 1-27 所示，`InfoObject` `ZVPARTN`\
    \ 设置了 `SAP HANA View`（SAP HANA 视图）访问类型。它从位于 BW/4HANA 包中的计算视图 `CV_PARTNER` 读取数据。`InfoObject`\
    \ `ZVPARTN` 映射到计算视图的 `PARTNER_ID` 字段。`InfoObject` 属性 `0PLANT` 和 `0CALDAY` 分别映射到视图字段\
    \ `PLANT` 和 `CREATION_DATE`。\n\n从我的角度来看，BW/4HANA `InfoObject` 最后一个值得注意的特性是传递属性功能。我将基于图\
    \ 1-28 中显示的示例介绍此功能。\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig28_HTML.jpg](img/508424_1_En_1_Fig28_HTML.jpg)\n\
    \n**图 1-28** 传递属性的用例\n\n我创建了 `Partner`（合作伙伴）（`ZZPARTN`）`InfoObject`，并将其 `Plant`（工厂）（`0PLANT`）设置为导航属性。尽管与\
    \ `Partner`（合作伙伴）相关联的 `Plant`（工厂）信息可用，但报表需求是同时显示该 `Plant`（工厂）属性的 `Country`（国家）（`0COUNTRY`）和\
    \ `Region`（地区）（`0REGION`）值。这两个字段是 `Plant`（工厂）的导航属性。为了满足此需求，我打算将 `Plant`（工厂）及其属性都作为\
    \ `Partner`（合作伙伴）（`ZZPARTN`）`InfoObject` 的导航属性。可以通过为 `ZZPARTN` `InfoObject` 维护传递属性来满足此需求。在\
    \ `Attributes`（属性）选项卡上，右键单击 `Navigation Attributes`（导航属性）窗格并选择 \"Maintain transitive\
    \ attributes\"（维护传递属性）（图 1-29）。\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig29_HTML.png](img/508424_1_En_1_Fig29_HTML.png)\n\
    \n**图 1-29** InfoObject 的 \"Maintain transitive attributes\" 选项\n\n一旦您从维护窗口中选择\
    \ `Transitive Attributes`（传递属性），这些属性将出现在 `Display and Navigation Attributes`（显示和导航属性）部分。在此部分中，有一个\
    \ `Transitive Attribute`（传递属性）列，基于该列您可以识别特定字段是常规属性还是传递属性。如图 1-29 所示，属性 `0COUNTRY`\
    \ 和 `0REGION` 在 `Transitive Attribute`（传递属性）列中被标记了标志 `true`。通过此配置，`Country`（国家）和\
    \ `Region`（地区）列可用于报表，尽管它们不会实际加载到 `Partner`（合作伙伴）（`ZZPARTN`）主数据表中。传递属性简化了开发、减少了维护工作并消除了冗余。\n"
- fmt: "### Open ODS View\n\nWhen creating a new `Open ODS View` object, as a first\
    \ step, depending on the object’s purpose, we need to choose one of the semantics\
    \ options: `Facts`, `Master Data`, or `Texts`. As mentioned, `Open ODS View` objects\
    \ do not persist any data, so as a second step we will be asked to indicate the\
    \ source for the `Open ODS View` object. In `BW/4HANA 2.0 SP04`, the following\
    \ source types are available for `Open ODS View` objects:\n\n- `DataSource (BW)`\n\
    - `Database Table or View`\n- `Database Table or View via Linked Database or MDC`\n\
    - `Virtual table using SAP HANA Smart Data Access`\n- `Big Data`\n- `DataStore\
    \ Object (Advanced)`\n- `Transformation`\n\nAfter selecting the source object\
    \ for the `Open ODS View` object, we can start defining its structure based on\
    \ the source fields. Figure [1-30](#508424_1_En_1_Chapter.xhtml#Fig30) presents\
    \ the `General` tab of the modeling editor for the `Open ODS View` object.\n\n\
    ![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig30_HTML.jpg](images/508424_1_En_1_Chapter/508424_1_En_1_Fig30_HTML.jpg)\n\
    \n**Figure 1-30**  \n**Open ODS View editor: General tab**\n\nThe `General` tab\
    \ is available always, no matter the semantics type chosen when creating an `Open\
    \ ODS View` object. For the given example (Figure [1-30](#508424_1_En_1_Chapter.xhtml#Fig30)),\
    \ `Open ODS View` objects use as a source the `CV_PARTNER` calculation view. The\
    \ `Edit` option allows you to change the source object. The `Generate Dataflow`\
    \ option gives you the ability to automatically generate the data source and `ADSO`\
    \ (with transformation and `DTP`) between the source object and the `Open ODS\
    \ View` object. This option can be useful in the future if we want to improve\
    \ the performance by persisting the underlying data in `ADSO`, without changing\
    \ the `Open ODS View` structure. In the next chapters of the book, I will describe\
    \ this functionality in more detail with an example.\n\nThe second tab of the\
    \ `Open ODS View` editor may differ depending on the chosen semantics type. In\
    \ the given example, I selected `Master Data` as the semantic type; hence, the\
    \ second tab is named `Master Data` (see Figure [1-31](#508424_1_En_1_Chapter.xhtml#Fig31)).\n\
    \n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig31_HTML.jpg](images/508424_1_En_1_Chapter/508424_1_En_1_Fig31_HTML.jpg)\n\
    \n**Figure 1-31**  \n**Open ODS View editor, Master Data tab**\n\nWithin this\
    \ tab I will model the structure of the `Open ODS View` object. In the left pane,\
    \ there is a section called `Source Fields`, where you can find a list of all\
    \ fields available in the source object. To select the source fields, which should\
    \ be used to model the `Open ODS View` object, you can simply drag and drop them\
    \ from the `Source Fields` section to the `View Field` section. For the `Open\
    \ ODS View` objects of `Master Data` type, it is mandatory to indicate one field\
    \ that should be placed under the `Representative Key Field` group. In my example,\
    \ I set the `PARTNER_ID` field as the representative key field. The two remaining\
    \ fields: `PLANT` and `CREATION_DATE` have been assigned to the `Characteristic`\
    \ section. As you could also notice, `PARTNER_ID` and `PLANT` are raw fields,\
    \ which were taken directly from the source, whereas the `CREATION_DATE` field\
    \ has been associated with the `0CALDAY` InfoObject.\n\nIn this exercise, I created\
    \ the `Open ODS View` `ZODSPARTN`, which has functionality similar to the `InfoObject`\
    \ `ZVPARTN` created in the previous section of that book. The main difference\
    \ is that to build the `Open ODS view`, I didn’t have to use any single `InfoObject`\
    \ (I used `0CALDAY` for field association just to demonstrate the functionality).\
    \ Thanks to that, creating `Open ODS View` objects is extremely flexible and fast.\
    \ This object is especially useful when you need to manage external data models\
    \ for which master data has not been created in the `BW/4HANA` landscape yet.\
    \ This can save a lot of development time, which would be consumed for creating\
    \ dozens of `InfoObjects` for each dimension field when using the old `BW` system.\n\
    \n### Advanced DSO\n\n`Advanced DSO` consists of three technical tables: inbound,\
    \ active, and change log. In addition to technical tables, there are also three\
    \ database views generated (these are not calculation views): a view for extraction,\
    \ a view for reporting, and a view for external access. Database objects generated\
    \ for `ADSO` are stored in the `SAPABAP1` schema. Table [1-1](#508424_1_En_1_Chapter.xhtml#Tab1)\
    \ presents the naming patterns for the database-generated `ADSO` objects.\n\n\
    **Table 1-1**  \n**Database Objects Generated for ADSO**\n\n| Object Type | Object\
    \ Name | Description |\n| --- | --- | --- |\n| Table | `/BIC/A*<ADSO name>*1`\
    \ | Inbound table |\n| Table | `/BIC/A*<ADSO name>*2` | Active data table |\n\
    | Table | `/BIC/A*<ADSO name>*3` | Change log |\n| View | `/BIC/A*<ADSO name>*6`\
    \ | View for extraction |\n| View | `/BIC/A*<ADSO name>*7` | View for reporting\
    \ |\n| View | `/BIC/A*<ADSO name>*8` | View for external access |\n\nThe behavior\
    \ of each technical table can differ depending on the `ADSO` settings. In general,\
    \ the inbound table acts as a new data table and stores the data load details.\
    \ The active table contains data that is utilized for reporting purposes. The\
    \ change log table keeps track of all the data changes within the `ADSO`. External\
    \ `SQL HANA` views might be used when implementing routines with `ABAP` or `AMDP/SQL`\
    \ scripts in `BW/4HANA` transformations.\n\nThe `ADSO` editor consists of three\
    \ tabs: `General`, `Details`, and `Settings`. Figure [1-32](#508424_1_En_1_Chapter.xhtml#Fig32)\
    \ presents the `General` tab of the `ADSO` editor.\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig32_HTML.jpg](images/508424_1_En_1_Chapter/508424_1_En_1_Fig32_HTML.jpg)\n\
    \n**Figure 1-32**  \n**Advanced DSO editor: General tab**\n\nOn the left pane\
    \ of the `General` tab, you can configure the modeling properties of an `ADSO`.\
    \ As shown in Figure [1-32](#508424_1_En_1_Chapter.xhtml#Fig32), there are the\
    \ following modeling properties for an `ADSO`:\n\n- **Standard DataStore Object**:\
    \ This type can cover most reporting scenarios. Within this type there are additional\
    \ settings available.\n    - **Write Change Log**: Once this option is selected,\
    \ when loading the data, the delta will be saved in the change log table. The\
    \ change log stores the request activation history; hence, when this option is\
    \ selected, it is possible to roll back data from the state before request activation.\n\
    \    - **Snapshot Support**: This option is active only if the `Write Change Log`\
    \ check box is selected. This option is useful when the `ADSO` is loaded always\
    \ with a full load. Data that is not available in the load request is being removed\
    \ from the active table of the `ADSO` and written to the change log table.\n \
    \   - **Unique Data Records**: This option should be selected if the `ADSO` will\
    \ be loaded always with unique records. This speeds up the `ADSO` request activation\
    \ process. The request activation will fail if the data set will contain a field\
    \ combination that already exists in `ADSO`.\n\n- **Staging DataStore Object**:\
    \ For this type, the change log is not supported. The following properties are\
    \ available:\n    - **Inbound Queue Only**: This type of `ADSO` can be used for\
    \ the staging layer and cannot be used for reporting. All data is stored in a\
    \ single inbound table.\n    - **Compress Data**: Data is initially written to\
    \ the inbound table. During activation they are compressed (aggregated based on\
    \ semantic key) and loaded to the active table. During activation, key figures\
    \ are either summed up or overwritten (depending on aggregation type defined on\
    \ the transformation level). Since the change log table is not used, it is not\
    \ possible to perform requests by request deletion.\n    - **Reporting-Enabled**:\
    \ This property is similar to the `Compress Data` option, with the difference\
    \ that during request activation, data from the inbound table is not removed.\
    \ In the reporting scenarios, data is taken from the active table; however, for\
    \ data extraction the inbound table will be queried."
  raw: "### Open ODS View\n\nWhen creating a new Open ODS View object, as a first\
    \ step, depending on the object’s purpose, we need to choose one of the semantics\
    \ options: Facts, Master Data, or Texts. As mentioned, Open ODS View objects do\
    \ not persist any data, so as a second step we will be asked to indicate the source\
    \ for the Open ODS View object. In BW/4HANA 2.0 SP04, the following source types\
    \ are available for Open ODS View objects:\n\n*   DataSource (BW)\n\n*   Database\
    \ Table or View\n\n*   Database Table or View via Linked Database or MDC\n\n*\
    \   Virtual table using SAP HANA Smart Data Access\n\n*   Big Data\n\n*   DataStore\
    \ Object (Advanced)\n\n*   Transformation\n\nAfter selecting the source object\
    \ for the Open ODS View object, we can start defining its structure based on the\
    \ source fields. Figure [1-30](#508424_1_En_1_Chapter.xhtml#Fig30) presents the\
    \ General tab of the modeling editor for the Open ODS View object.\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig30_HTML.jpg](images/508424_1_En_1_Chapter/508424_1_En_1_Fig30_HTML.jpg)\n\
    \nFigure 1-30\n\nOpen ODS View editor: General tab\n\nThe General tab is available\
    \ always, no matter the semantics type chosen when creating an Open ODS View object.\
    \ For the given example (Figure [1-30](#508424_1_En_1_Chapter.xhtml#Fig30)), Open\
    \ ODS View objects use as a source the CV_PARTNER calculation view. The Edit option\
    \ allows you to change the source object. The Generate Dataflow option gives you\
    \ the ability to automatically generate the data source and ADSO (with transformation\
    \ and DTP) between the source object and the Open ODS View object. This option\
    \ can be useful in the future if we want to improve the performance by persisting\
    \ the underlying data in ADSO, without changing the Open ODS View structure. In\
    \ the next chapters of the book, I will describe this functionality in more detail\
    \ with an example.\n\nThe second tab of the Open ODS View editor may differ depending\
    \ on the chosen semantics type. In the given example, I selected Master Data as\
    \ the semantic type; hence, the second tab is named Master Data (see Figure [1-31](#508424_1_En_1_Chapter.xhtml#Fig31)).\n\
    \n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig31_HTML.jpg](images/508424_1_En_1_Chapter/508424_1_En_1_Fig31_HTML.jpg)\n\
    \nFigure 1-31\n\nOpen ODS View editor, Master Data tab\n\nWithin this tab I will\
    \ model the structure of the Open ODS View object. In the left pane, there is\
    \ a section called Source Fields, where you can find a list of all fields available\
    \ in the source object. To select the source fields, which should be used to model\
    \ the Open ODS View object, you can simply drag and drop them from the Source\
    \ Fields section to the View Field section. For the Open ODS View objects of Master\
    \ Data type, it is mandatory to indicate one field that should be placed under\
    \ the Representative Key Field group. In my example, I set the PARTNER_ID field\
    \ as the representative key field. The two remaining fields: PLANT and CREATION_DATE\
    \ have been assigned to the Characteristic section. As you could also notice,\
    \ PARTNER_ID and PLANT are raw fields, which were taken directly from the source,\
    \ whereas the CREATION_DATE field has been associated with the 0CALDAY InfoObject.\n\
    \nIn this exercise, I created the Open ODS View ZODSPARTN, which has functionality\
    \ similar to the InfoObject ZVPARTN created in the previous section of that book.\
    \ The main difference is that to build the Open ODS view, I didn’t have to use\
    \ any single InfoObject (I used 0CALDAY for field association just to demonstrate\
    \ the functionality). Thanks to that, creating Open ODS View objects is extremely\
    \ flexible and fast. This object is especially useful when you need to manage\
    \ external data models for which master data has not been created in the BW/4HANA\
    \ landscape yet. This can save a lot of development time, which would be consumed\
    \ for creating dozens of InfoObjects for each dimension field when using the old\
    \ BW system.\n\n### Advanced DSO\n\nAdvanced DSO consists of three technical tables:\
    \ inbound, active, and change log. In addition to technical tables, there are\
    \ also three database views generated (these are not calculation views): a view\
    \ for extraction, a view for reporting, and a view for external access. Database\
    \ objects generated for ADSO are stored in the SAPABAP1 schema. Table [1-1](#508424_1_En_1_Chapter.xhtml#Tab1)\
    \ presents the naming patterns for the database-generated ADSO objects.\n\nTable\
    \ 1-1\n\nDatabase Objects Generated for ADSO\n\n| Object Type | Object Name |\
    \ Description |\n| --- | --- | --- |\n| Table | /BIC/A*<ADSO name>*1 | Inbound\
    \ table |\n| Table | /BIC/A*<ADSO name>*2 | Active data table |\n| Table | /BIC/A*<ADSO\
    \ name>*3 | Change log |\n| View | /BIC/A*<ADSO name>*6 | View for extraction\
    \ |\n| View | /BIC/A*<ADSO name>*7 | View for reporting |\n| View | /BIC/A*<ADSO\
    \ name>*8 | View for external access |\n\nThe behavior of each technical table\
    \ can differ depending on the ADSO settings. In general, the inbound table acts\
    \ as a new data table and stores the data load details. The active table contains\
    \ data that is utilized for reporting purposes. The change log table keeps track\
    \ of all the data changes within the ADSO. External SQL HANA views might be used\
    \ when implementing routines with ABAP or AMDP/SQL scripts in BW/4HANA transformations.\n\
    \nThe ADSO editor consists of three tabs: General, Details, and Settings. Figure\
    \ [1-32](#508424_1_En_1_Chapter.xhtml#Fig32) presents the General tab of the ADSO\
    \ editor.\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig32_HTML.jpg](images/508424_1_En_1_Chapter/508424_1_En_1_Fig32_HTML.jpg)\n\
    \nFigure 1-32\n\nAdvanced DSO editor: General tab\n\nOn the left pane of the General\
    \ tab, you can configure the modeling properties of an ADSO. As shown in Figure\
    \ [1-32](#508424_1_En_1_Chapter.xhtml#Fig32), there are the following modeling\
    \ properties for an ADSO:\n\n*   *Standard DataStore Object*: This type can cover\
    \ most reporting scenarios. Within this type there are additional settings available.\n\
    \    *   *Write Change Log*: Once this option is selected, when loading the data,\
    \ the delta will be saved in the change log table. The change log stores the request\
    \ activation history; hence, when this option is selected, it is possible to roll\
    \ back data from the state before request activation.\n\n*   *Snapshot Support*:\
    \ This option is active only if the Write Change Log check box is selected. This\
    \ option is useful when the ADSO is loaded always with a full load. Data that\
    \ is not available in the load request is being removed from the active table\
    \ of the ADSO and written to the change log table.\n\n*   *Unique Data Records*:\
    \ This option should be selected if the ADSO will be loaded always with unique\
    \ records. This speeds up the ADSO request activation process. The request activation\
    \ will fail if the data set will contain a field combination that already exists\
    \ in ADSO.\n\n*   *Staging DataStore Object*: For this type, the change log is\
    \ not supported. The following properties are available:\n    *   *Inbound Queue\
    \ Only*: This type of ADSO can be used for the staging layer and cannot be used\
    \ for reporting. All data is stored in a single inbound table.\n\n*   *Compress\
    \ Data*: Data is initially written to the inbound table. During activation they\
    \ are compressed (aggregated based on semantic key) and loaded to the active table.\
    \ During activation, key figures are either summed up or overwritten (depending\
    \ on aggregation type defined on the transformation level). Since the change log\
    \ table is not used, it is not possible to perform requests by request deletion.\n\
    \n*   *Reporting-Enabled*: This property is similar to the Compress Data option,\
    \ with the difference that during request activation, data from the inbound table\
    \ is not removed. In the reporting scenarios, data is taken from the active table;\
    \ however, for data extraction the inbound table will be queried."
  trans: "\n### 打开 ODS 视图（Open ODS View）\n\n在创建新的 `Open ODS View`（打开 ODS 视图）对象时，作为第一步，我们需要根据对象的用途，选择以下语义选项之一：`Facts`（事实）、`Master\
    \ Data`（主数据）或 `Texts`（文本）。如前所述，`Open ODS View` 对象不会持久化任何数据，因此作为第二步，系统会要求我们为 `Open\
    \ ODS View` 对象指明数据源。在 `BW/4HANA 2.0 SP04` 中，`Open ODS View` 对象支持以下源类型：\n\n- `DataSource\
    \ (BW)`（数据源 (BW)）\n- `Database Table or View`（数据库表或视图）\n- `Database Table or View\
    \ via Linked Database or MDC`（通过链接数据库或 MDC 的数据库表或视图）\n- `Virtual table using SAP\
    \ HANA Smart Data Access`（使用 SAP HANA 智能数据访问的虚拟表）\n- `Big Data`（大数据）\n- `DataStore\
    \ Object (Advanced)`（高级 DataStore 对象）\n- `Transformation`（转换）\n\n在为 `Open ODS\
    \ View` 对象选择源对象后，我们就可以开始根据源字段定义其结构。图 1-30 展示了 `Open ODS View` 对象建模编辑器的 `General`（常规）选项卡。\n\
    \n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig30_HTML.jpg](img/508424_1_En_1_Fig30_HTML.jpg)\n\
    \n**图 1-30**  \n**Open ODS View 编辑器：常规选项卡**\n\n无论创建 `Open ODS View` 对象时选择何种语义类型，`General`（常规）选项卡始终可用。对于给定的示例（图\
    \ 1-30），`Open ODS View` 对象使用 `CV_PARTNER` 计算视图作为源。`Edit`（编辑）选项允许您更改源对象。`Generate\
    \ Dataflow`（生成数据流）选项使您能够自动生成源对象与 `Open ODS View` 对象之间的数据源和 `ADSO`（包含转换和 `DTP`）。如果我们将来希望通过将底层数据持久化到\
    \ `ADSO` 中来提高性能，而无需更改 `Open ODS View` 结构，则此选项很有用。在本书的后续章节中，我将通过示例更详细地描述此功能。\n\n\
    `Open ODS View` 编辑器的第二个选项卡可能因所选的语义类型而异。在给定的示例中，我选择了 `Master Data`（主数据）作为语义类型；因此，第二个选项卡被命名为\
    \ `Master Data`（主数据）（见图 1-31）。\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig31_HTML.jpg](img/508424_1_En_1_Fig31_HTML.jpg)\n\
    \n**图 1-31**  \n**Open ODS View 编辑器，主数据选项卡**\n\n在此选项卡中，我将为 `Open ODS View` 对象建模其结构。在左侧窗格中，有一个名为\
    \ `Source Fields`（源字段）的区域，您可以在其中找到源对象中所有可用字段的列表。要选择应用于建模 `Open ODS View` 对象的源字段，您可以简单地将它们从\
    \ `Source Fields`（源字段）区域拖放到 `View Field`（视图字段）区域。对于 `Master Data`（主数据）类型的 `Open\
    \ ODS View` 对象，必须指明一个应放置在 `Representative Key Field`（代表键字段）组下的字段。在我的示例中，我将 `PARTNER_ID`\
    \ 字段设置为代表键字段。其余两个字段：`PLANT` 和 `CREATION_DATE` 被分配到 `Characteristic`（特性）部分。您可能还会注意到，`PARTNER_ID`\
    \ 和 `PLANT` 是原始字段，直接从源中获取，而 `CREATION_DATE` 字段已与 `0CALDAY` 信息对象关联。\n\n在本练习中，我创建了\
    \ `Open ODS View` `ZODSPARTN`，其功能与本书上一节中创建的 `InfoObject` `ZVPARTN` 类似。主要区别在于，要构建\
    \ `Open ODS View`，我不必使用任何单个 `InfoObject`（我使用 `0CALDAY` 进行字段关联只是为了演示功能）。得益于此，创建\
    \ `Open ODS View` 对象极其灵活且快速。当您需要管理尚未在 `BW/4HANA` 环境中创建主数据的外部数据模型时，此对象尤其有用。这可以节省大量开发时间，而在使用旧的\
    \ `BW` 系统时，这些时间将用于为每个维度字段创建数十个 `InfoObject`。\n\n### 高级 DSO\n\n`Advanced DSO`（高级\
    \ DSO）由三个技术表组成：入站表、活动表和更改日志表。除了技术表之外，还会生成三个数据库视图（这些不是计算视图）：用于提取的视图、用于报表的视图和用于外部访问的视图。为\
    \ `ADSO` 生成的数据库对象存储在 `SAPABAP1` 模式中。表 1-1 展示了数据库生成的 `ADSO` 对象的命名模式。\n\n**表 1-1**\
    \  \n**为 ADSO 生成的数据库对象**\n\n| 对象类型 | 对象名称 | 描述 |\n| --- | --- | --- |\n| 表 | `/BIC/A*<ADSO\
    \ 名称>*1` | 入站表 |\n| 表 | `/BIC/A*<ADSO 名称>*2` | 活动数据表 |\n| 表 | `/BIC/A*<ADSO 名称>*3`\
    \ | 更改日志 |\n| 视图 | `/BIC/A*<ADSO 名称>*6` | 提取视图 |\n| 视图 | `/BIC/A*<ADSO 名称>*7`\
    \ | 报表视图 |\n| 视图 | `/BIC/A*<ADSO 名称>*8` | 外部访问视图 |\n\n每个技术表的行为可能因 `ADSO` 设置而异。通常，入站表充当新数据表并存储数据加载详细信息。活动表包含用于报表目的的数据。更改日志表跟踪\
    \ `ADSO` 内的所有数据更改。在 `BW/4HANA` 转换中使用 `ABAP` 或 `AMDP/SQL` 脚本实现例程时，可能会使用外部 `SQL\
    \ HANA` 视图。\n\n`ADSO` 编辑器由三个选项卡组成：`General`（常规）、`Details`（详细信息）和 `Settings`（设置）。图\
    \ 1-32 展示了 `ADSO` 编辑器的 `General`（常规）选项卡。\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig32_HTML.jpg](img/508424_1_En_1_Fig32_HTML.jpg)\n\
    \n**图 1-32**  \n**高级 DSO 编辑器：常规选项卡**\n\n在 `General`（常规）选项卡的左侧窗格中，您可以配置 `ADSO`\
    \ 的建模属性。如图 1-32 所示，`ADSO` 具有以下建模属性：\n\n- **标准 DataStore 对象**：此类型可以覆盖大多数报表场景。在此类型中，有额外的设置可用。\n\
    \    - **写入更改日志**：选择此选项后，加载数据时，增量将保存在更改日志表中。更改日志存储请求激活历史记录；因此，当选择此选项时，可以将数据回滚到请求激活之前的状态。\n\
    \    - **快照支持**：仅当选中 `Write Change Log`（写入更改日志）复选框时，此选项才处于活动状态。当 `ADSO` 始终以全量加载方式加载时，此选项很有用。加载请求中不可用的数据将从\
    \ `ADSO` 的活动表中删除并写入更改日志表。\n    - **唯一数据记录**：如果 `ADSO` 将始终加载唯一记录，则应选择此选项。这可以加速\
    \ `ADSO` 的请求激活过程。如果数据集包含已存在于 `ADSO` 中的字段组合，则请求激活将失败。\n\n- **暂存 DataStore 对象**：对于此类型，不支持更改日志。有以下属性可用：\n\
    \    - **仅入站队列**：此类型的 `ADSO` 可用于暂存层，不能用于报表。所有数据都存储在单个入站表中。\n    - **压缩数据**：数据最初写入入站表。在激活期间，它们被压缩（基于语义键进行聚合）并加载到活动表中。在激活期间，关键指标要么相加，要么覆盖（取决于在转换级别定义的聚合类型）。由于不使用更改日志表，因此无法按请求执行删除操作。\n\
    \    - **启用报表**：此属性与 `Compress Data`（压缩数据）选项类似，区别在于在请求激活期间，入站表中的数据不会被删除。在报表场景中，数据取自活动表；但是，对于数据提取，将查询入站表。\n"
- fmt: '*   `Data Mart DataStore Object`: The behavior of this ADSO type is the same
    as the functionality of the former BW object called `InfoCube`. This type should
    be used when loading additive deltas (key figure values cannot be overwritten;
    only `MAX`, `MIN`, and `SUM` aggregations are allowed). Data is initially loaded
    to the inbound table. During activation it is compressed and loaded to the active
    table. For this type of ADSO, all fields are treated as keys. When using this
    type of ADSO in reporting, data is fetched from the union of inbound and active
    tables, meaning that even if the load request is not activated, the report will
    return all the data.


    *   `Direct Update DataStore Object`: When using this type, data is loaded to
    the active table directly. No other technical tables are used. Request activation
    is not possible, and data for extraction and reporting is fetched always from
    the active table. Data can be written using `DTP` or an API.


    In addition to the modeling properties, on the **General** tab of the ADSO editor
    (Figure [1-32](#508424_1_En_1_Chapter.xhtml#Fig32)) there is also a **Data Tiering
    Properties** section. Using this property, you can implement a data tiering storage
    strategy depending on the data category (Hot, Warm, or Cold).


    The second tab available while creating an ADSO is the **Details** tab. On this
    tab, the actual ADSO modeling is taking place. Figure [1-33](#508424_1_En_1_Chapter.xhtml#Fig33)
    shows the **Details** tab of ADSO called `ZVADS_PO`.


    ![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig33_HTML.jpg](images/508424_1_En_1_Chapter/508424_1_En_1_Fig33_HTML.jpg)


    **Figure 1-33** Advanced DSO editor, Details tab


    When creating a new ADSO, you can provide an object (`DataSource`, `InfoProvider`,
    `InfoObject`, or `InfoSource`) as a template. Thanks to that, all the `InfoObjects`/fields
    will be derived to the ADSO structure from the template object. Of course, it
    will be possible to change/remove some of them according to the needs. In the
    example shown in Figure [1-33](#508424_1_En_1_Chapter.xhtml#Fig33), when creating
    the ADSO, I used `DataSource` as a template. All the fields available in the selected
    `DataSource` have been generated in the **Fields** section. You might notice that
    `ZVADS_PO` consists of raw fields. By clicking **Add InfoObject** or **Add Field**,
    you can add a new entry to the **Fields** section. The **Add Group** button allows
    you to add a new folder to the ADSO field structure. With the **Remove** button,
    you can remove the selected fields. The **Remodeling** button enables the options
    shown in Figure [1-34](#508424_1_En_1_Chapter.xhtml#Fig34).


    ![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig34_HTML.jpg](images/508424_1_En_1_Chapter/508424_1_En_1_Fig34_HTML.jpg)


    **Figure 1-34** ADSO Field Remodeling window


    After selecting the field `MATNR` and clicking the **Remodeling** button, the
    **Field Remodeling** window opens (Figure [1-34](#508424_1_En_1_Chapter.xhtml#Fig34)).
    One of the following activities can be selected:


    *   `Replace by InfoObject`: The specific field/`InfoObject` will be replaced
    with a different `InfoObject`.

    *   `Replace by Field`: This specific field/`InfoObject` will be replaced with
    the raw field. The given name should not already be in use for the ADSO.

    *   `Fill with Value of InfoObject`: This will load values from the given `InfoObject`
    into the remodeled field/`InfoObject`.

    *   `Fill with Value of field`: This will load values from the given field into
    the remodeled field/`InfoObject`.

    *   `Filled by Constant Value`: This will load constant value into the remodeled
    field/`InfoObject` (only new elements can be filled).


    In Figure [1-33](#508424_1_En_1_Chapter.xhtml#Fig33), there are two remaining
    buttons: **Manage Keys** and **Maintain Properties**. Depending on the ADSO configuration,
    the **Manage Keys** button can be either inactive or mandatory. It is used to
    indicate a key fields/`InfoObjects` combination that uniquely identifies each
    record.


    With the **Maintain Properties** button, we can set the properties of the field/`InfoObject`
    (aggregation type or behavior of the master data check). You can find more field
    properties in the right pane of the **Details** section (the pane will appear
    once you click a specific field/`InfoObject`).


    ## `CompositeProvider`


    When creating a new `CompositeProvider`, like for all other objects, as a first
    step we need to provide its technical name. Optionally we can enter the description
    and name of another `CompositeProvider` from which we want to copy the structure.
    On the next screen, we are able to select the source `PartProviders` and default
    operation (a join or union). We can also skip this step by clicking **Finish**
    and going to the `CompositeProvider` editor directly. The system by default opens
    the **General** tab of the editor, as shown in Figure [1-35](#508424_1_En_1_Chapter.xhtml#Fig35).


    ![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig35_HTML.jpg](images/508424_1_En_1_Chapter/508424_1_En_1_Fig35_HTML.jpg)


    **Figure 1-35** `CompositeProvider`, General tab


    On this tab, you can configure the runtime properties of the `CompositeProvider`.
    Here you can also find a check box for generating an external SAP HANA view from
    the `CompositeProvider`. You can also specify whether this `CompositeProvider`
    can be consumed as a provider by another `CompositeProvider` (option “This `CompositeProvider`
    can be added to another `CompositeProvider`”).


    The **Scenario** tab of the `CompositeProvider` editor is designed to implement
    the actual logical layer. On this tab, you can specify the source `PartProviders`
    and define the proper operations to get the desired output, according to the required
    business logic. Figure [1-36](#508424_1_En_1_Chapter.xhtml#Fig36) shows the **Scenario**
    tab of the `CompositeProvider` editor.


    ![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig36_HTML.jpg](images/508424_1_En_1_Chapter/508424_1_En_1_Fig36_HTML.jpg)


    **Figure 1-36** `CompositeProvider`, Scenario tab


    In my example, I combined data from three different objects: Open ODS View object
    (`ZODSPARTN`), `InfoObject` (`ZZPARTN`), and calculation view (`CV_PARTNER`).
    The union operator combines data sets from all the underlying objects and maps
    its fields from the source to the target structure (Figure [1-36](#508424_1_En_1_Chapter.xhtml#Fig36)).
    In the target structure of `CompositeProvider` there are three `InfoObjects`:
    Partner (`ZZPARTN`), Plant (`0PLANT`), and Calendar Day (`0CALDAY`). Although
    the objects `CV_PARTNER` and `ZODSPARTN` consist of raw fields (except `0CALDAY`
    in Open ODS View), I was able to map them to the target `InfoObjects`. In Figure
    [1-36](#508424_1_En_1_Chapter.xhtml#Fig36) you can also notice that the field
    `PARTN_PLANT` has no associations to `PartProviders`. This is a calculated column,
    which can be created by right-clicking the **Target** section and selecting **Create
    Calculated Field**. The **Calculated Field** editor will open in a new window,
    as shown in Figure [1-37](#508424_1_En_1_Chapter.xhtml#Fig37).


    ![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig37_HTML.jpg](images/508424_1_En_1_Chapter/508424_1_En_1_Fig37_HTML.jpg)


    **Figure 1-37** `CompositeProvider`, Calculated Field editor


    In the **Calculated Field** editor, first we should define the field type: choose
    **Characteristic** or **Key Figure** depending on whether it is a dimension or
    a measure. We should also provide a name and description for the calculated field.
    It is possible to make an association between the calculated field and `InfoObject`
    or the Open ODS View object using the option “Association with.” In my example,
    I kept this field without an association to the Master Data object. After specifying
    the data type, in the **Definition** section we can type a SQL expression. As
    shown in Figure [1-37](#508424_1_En_1_Chapter.xhtml#Fig37), I used the following
    SQL syntax:


    ```

    "ZZPARTN" || ''_'' || "0PLANT"

    ```


    This expression concatenates the Partner and Plant `InfoObject` values, putting
    an underscore in between. I recommend you always test the code in the SQL console
    (SAP HANA modeler perspective) to verify if it works and returns the desired result.'
  raw: '*   *Data Mart DataStore Object*: The behavior of this ADSO type is the same
    as the functionality of the former BW object called InfoCube. This type should
    be used when loading additive deltas (key figure values cannot be overwritten;
    only MAX, MIN, and SUM aggregations are allowed). Data is initially loaded to
    the inbound table. During activation it is compressed and loaded to the active
    table. For this type of ADSO, all fields are treated as keys. When using this
    type of ADSO in reporting, data is fetched from the union of inbound and active
    tables, meaning that even if the load request is not activated, the report will
    return all the data.


    *   *Direct Update DataStore Object*: When using this type, data is loaded to
    the active table directly. No other technical tables are used. Request activation
    is not possible, and data for extraction and reporting is fetched always from
    the active table. Data can be written using DTP or an API.


    In addition to the modeling properties, on the General tab of the ADSO editor
    (Figure [1-32](#508424_1_En_1_Chapter.xhtml#Fig32)) there is also a Data Tiering
    Properties section. Using this property, you can implement a data tiering storage
    strategy depending on the data category (Hot, Warm, or Cold).


    The second tab available while creating an ADSO is the Details tab. On this tab,
    the actual ADSO modeling is taking place. Figure [1-33](#508424_1_En_1_Chapter.xhtml#Fig33)
    shows the Details tab of ADSO called ZVADS_PO.


    ![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig33_HTML.jpg](images/508424_1_En_1_Chapter/508424_1_En_1_Fig33_HTML.jpg)


    Figure 1-33


    Advanced DSO editor, Details tab


    When creating a new ADSO, you can provide an object (DataSource, InfoProvider,
    InfoObject, or InfoSource) as a template. Thanks to that, all the InfoObjects/fields
    will be derived to the ADSO structure from the template object. Of course, it
    will be possible to change/remove some of them according to the needs. In the
    example shown in Figure [1-33](#508424_1_En_1_Chapter.xhtml#Fig33), when creating
    the ADSO, I used DataSource as a template. All the fields available in the selected
    DataSource has been generated in the Fields section. You might notice that ZVADS_PO
    consists of raw fields. By clicking Add InfoObject or Add Field, you can add a
    new entry to the Fields section. The Add Group button allows you to add a new
    folder to the ADSO field structure. With the Remove button, you can remove the
    selected fields. The Remodeling button enables the options shown in Figure [1-34](#508424_1_En_1_Chapter.xhtml#Fig34).


    ![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig34_HTML.jpg](images/508424_1_En_1_Chapter/508424_1_En_1_Fig34_HTML.jpg)


    Figure 1-34


    ADSO Field Remodeling window


    After selecting the field MATNR and clicking the Remodeling button, the Field
    Remodeling window opens (Figure [1-34](#508424_1_En_1_Chapter.xhtml#Fig34)). One
    of the following activities can be selected:


    *   *Replace by InfoObject*: The specific field/InfoObject will be replaced with
    a different InfoObject.


    *   *Replace by Field*: This specific field/InfoObject will be replaced with the
    raw field. The given name should not already be in use for the ADSO.


    *   *Fill with Value of InfoObject*: This will load values from the given InfoObject
    into the remodeled field/InfoObject.


    *   *Fill with Value of field*: This will load values from the given field into
    the remodeled field/InfoObject.


    *   *Filled by Constant Value*: This will load constant value into the remodeled
    field/InfoObject (only new elements can be filled).


    In Figure [1-33](#508424_1_En_1_Chapter.xhtml#Fig33), there are two remaining
    buttons: Manage Keys and Maintain Properties. Depending on the ADSO configuration,
    the Manage Keys button can be either inactive or mandatory. It is used to indicate
    a key fields/InfoObjects combination that uniquely identifies each record.


    With the Maintain Properties button, we can set the properties of the field/InfoObject
    (aggregation type or behavior of the master data check)*.* You can find more field
    properties in the right pane of the Details section (the pane will appear once
    you click a specific field/InfoObject).


    ### CompositeProvider


    When creating a new CompositeProvider, like for all other objects, as a first
    step we need to provide its technical name. Optionally we can enter the description
    and name of another CompositeProvider from which we want to copy the structure.
    On the next screen, we are able to select the source PartProviders and default
    operation (a join or union). We can also skip this step by clicking Finish and
    going to the CompositeProvider editor directly. The system by default opens the
    General tab of the editor, as shown in Figure [1-35](#508424_1_En_1_Chapter.xhtml#Fig35).


    ![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig35_HTML.jpg](images/508424_1_En_1_Chapter/508424_1_En_1_Fig35_HTML.jpg)


    Figure 1-35


    CompositeProvider, General tab


    On this tab, you can configure the runtime properties of the CompositeProvider.
    Here you can also find a check box for generating an external SAP HANA view from
    the CompositeProvider. You can also specify whether this CompositeProvider can
    be consumed as a provider by another CompositeProvider (option “This CompositeProvider
    can be added to another CompositeProvider”).


    The Scenario tab of the CompositeProvider editor is designed to implement the
    actual logical layer. On this tab, you can specify the source PartProviders and
    define the proper operations to get the desired output, according to the required
    business logic. Figure [1-36](#508424_1_En_1_Chapter.xhtml#Fig36) shows the Scenario
    tab of the CompositeProvider editor.


    ![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig36_HTML.jpg](images/508424_1_En_1_Chapter/508424_1_En_1_Fig36_HTML.jpg)


    Figure 1-36


    CompositeProvider, Scenario tab


    In my example, I combined data from three different objects: Open ODS View object
    (ZODSPARTN), InfoObject (ZZPARTN), and calculation view (CV_PARTNER). The union
    operator combines data sets from all the underlying objects and maps its fields
    from the source to the target structure (Figure [1-36](#508424_1_En_1_Chapter.xhtml#Fig36)).
    In the target structure of CompositeProvider there are three InfoObjects: Partner
    (ZZPARTN), Plant (0PLANT), and Calendar Day (0CALDAY). Although the objects CV_PARTNER
    and ZODSPARTN consist of raw fields (except 0CALDAY in Open ODS View), I was able
    to map them to the target InfoObjects. In Figure [1-36](#508424_1_En_1_Chapter.xhtml#Fig36)
    you can also notice that the field PARTN_PLANT has no associations to PartProviders.
    This is a calculated column, which can be created by right-clicking the Target
    section and selecting Create Calculated Field. The Calculated Field editor will
    open in a new window, as shown in Figure [1-37](#508424_1_En_1_Chapter.xhtml#Fig37).


    ![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig37_HTML.jpg](images/508424_1_En_1_Chapter/508424_1_En_1_Fig37_HTML.jpg)


    Figure 1-37


    CompositeProvider, Calculated Field editor


    In the Calculated Field editor, first we should define the field type: choose
    Characteristic or Key Figure depending on whether it is a dimension or a measure.
    We should also provide a name and description for the calculated field. It is
    possible to make an association between the calculated field and InfoObject or
    the Open ODS View object using the option “Association with.” In my example, I
    kept this field without an association to the Master Data object. After specifying
    the data type, in the Definition section we can type a SQL expression. As shown
    in Figure [1-37](#508424_1_En_1_Chapter.xhtml#Fig37), I used the following SQL
    syntax:


    ```

    "ZZPARTN" || ''_'' || "0PLANT"

    ```


    This expression concatenates the Partner and Plant InfoObject values, putting
    an underscore in between. I recommend you always test the code in the SQL console
    (SAP HANA modeler perspective) to verify if it works and returns the desired result.


