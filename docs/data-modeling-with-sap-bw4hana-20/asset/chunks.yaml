- fmt: "### Data Flow\n\nThere are multiple scenarios for using `Data Flow` objects.\
    \ First, `Data Flow` objects can be used to model process flows. Before creating\
    \ target BW/4HANA objects, you can create a `Data Flow` object to model your desired\
    \ process. To create a `Data Flow` object, simply right-click the `InfoArea` and\
    \ select `New ➤ Data Flow Object`. After providing the name of the object, the\
    \ `Data Flow` editor will open (see Figure [1-43](#508424_1_En_1_Chapter.xhtml#Fig43)).\n\
    \n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig43_HTML.jpg](images/508424_1_En_1_Chapter/508424_1_En_1_Fig43_HTML.jpg)\n\
    \nFigure 1-43\n\n`Data Flow` object editor\n\nIn the right pane (Figure [1-43](#508424_1_En_1_Chapter.xhtml#Fig43)),\
    \ you have the list of object types available for creating a process flow. You\
    \ can add them to your model by using drag-and-drop functionality or by right-clicking\
    \ the modeling area and selecting the `New` option. You can also include existing\
    \ BW/4HANA objects in your model by selecting the `Add Object` option and providing\
    \ the name of the object. After adding objects to the model, you can connect them\
    \ using arrows to depict the dependencies. Figure [1-44](#508424_1_En_1_Chapter.xhtml#Fig44)\
    \ shows the exemplary data flow model.\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig44_HTML.jpg](images/508424_1_En_1_Chapter/508424_1_En_1_Fig44_HTML.jpg)\n\
    \nFigure 1-44\n\nModel created in the `Data Flow` object\n\nAs shown in Figure\
    \ [1-44](#508424_1_En_1_Chapter.xhtml#Fig44), the data flow consists of two data\
    \ sources (`SOURCE_1` and `SOURCE_2`), which are linked with two ADSOs (`ADSO_1`\
    \ and `ADSO_2`). There is also one `Open ODS View` object (`ODS_1`) not linked\
    \ to any data source. `CompositeProvider` (`CP_FINAL`) is modeled as a logical\
    \ layer and combines data from `Open ODS View` and `Advanced DSOs`. Objects displayed\
    \ in the `Data Flow` model are not associated with physical BW/4HANA objects.\
    \ The created data flow model is just a template that can be later used as a reference\
    \ for creating physical objects.\n\nAnother great usage of `Data Flow` objects\
    \ is the ability to generate persistent objects out of data flow models. This\
    \ means that after creating the process flow template, we can then convert objects\
    \ from the model into physical BW/4HANA objects. It’s always good to start from\
    \ the objects at the bottom. Thanks to that, output structures can be propagated\
    \ from the lower-level object to the upper one. After double-clicking the `Data\
    \ Source` object, I can define its properties and activate it. Once that’s done,\
    \ the data flow diagram will be updated accordingly (see Figure [1-45](#508424_1_En_1_Chapter.xhtml#Fig45)).\n\
    \n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig45_HTML.jpg](images/508424_1_En_1_Chapter/508424_1_En_1_Fig45_HTML.jpg)\n\
    \nFigure 1-45\n\nConverting the data flow model into physical objects\n\nAs shown\
    \ in Figure [1-45](#508424_1_En_1_Chapter.xhtml#Fig45), after creating a physical\
    \ data source in place of the `SOURCE_1` object, the model has been updated. Once\
    \ the data source `ZDS_PURCH_ORD` was created, I clicked the `ADSO_1` object and\
    \ created the physical `DataStore` object called `ZADSO_PO`. The structure of\
    \ that `ADSO` was inherited from the underlying data source. In Figure [1-45](#508424_1_En_1_Chapter.xhtml#Fig45),\
    \ I highlighted also the function for generating a transformation from the model.\
    \ The same is possible for the `DTP`. This modeling approach allows you to first\
    \ create a concept for your process and then convert this concept into the working\
    \ solution. It can save time since generating objects from a data flow is a bit\
    \ faster than creating them manually one by one from the `Project Explorer`.\n\
    \nIf the `Data Flow` object consists fully of persistent BW/4HANA objects, you\
    \ can utilize the feature of generating a process chain. This function is available\
    \ from the data flow toolbar, as shown in Figure [1-46](#508424_1_En_1_Chapter.xhtml#Fig46).\n\
    \n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig46_HTML.jpg](images/508424_1_En_1_Chapter/508424_1_En_1_Fig46_HTML.jpg)\n\
    \nFigure 1-46\n\nGenerating a process chain from a data flow\n\nWhen clicking\
    \ the `Process Chain` button, first you need to provide a process chain name.\
    \ Once you enter the name, a new `Eclipse` tab with a `SAP GUI` session embedded\
    \ will open (see Figure [1-47](#508424_1_En_1_Chapter.xhtml#Fig47)).\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig47_HTML.jpg](images/508424_1_En_1_Chapter/508424_1_En_1_Fig47_HTML.jpg)\n\
    \nFigure 1-47\n\nProcess chain window\n\nFigure [1-47](#508424_1_En_1_Chapter.xhtml#Fig47)\
    \ shows that the `DTP` from the data flow model has been automatically inserted\
    \ into the process chain definition. If the `Data Flow` object is modified, the\
    \ changes will not be automatically reflected in the process chain. You will need\
    \ to incorporate these changes manually or generate a new process chain from the\
    \ `Data Flow` object.\n\n`Data Flow` objects can be also generated for existing\
    \ BW/4HANA objects. To open a `Data Flow` object for a specific object, go to\
    \ the `Project Explorer` list, right-click the object, and select the `Explorer\
    \ Data Flow` option (Figure [1-48](#508424_1_En_1_Chapter.xhtml#Fig48)).\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig48_HTML.jpg](images/508424_1_En_1_Chapter/508424_1_En_1_Fig48_HTML.jpg)\n\
    \nFigure 1-48\n\nDisplaying a data flow for the existing object\n\nBy default\
    \ data flows for existing objects are opened as a collapsed view, so not all objects\
    \ and dependencies may be visible. In the data flow editor you can expand the\
    \ data flow downward or upward to see additional objects. When hovering over the\
    \ specific node, you will see arrow symbols, which enable you to narrow down the\
    \ data flow (Figure [1-49](#508424_1_En_1_Chapter.xhtml#Fig49)).\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig49_HTML.png](images/508424_1_En_1_Chapter/508424_1_En_1_Fig49_HTML.png)\n\
    \nFigure 1-49\n\n`Data Flow Explorer`\n\nFigure [1-49](#508424_1_En_1_Chapter.xhtml#Fig49)\
    \ shows the data flow for the `CompositeProvider` named `ZCP_PARTN`. It consists\
    \ of three objects: `Calculation View`, `Open ODS View`, and `InfoObject`. After\
    \ expanding the data flow for the `InfoObject` named `ZZPARTN`, we can see also\
    \ `Data Source` and `Source System` used for loading master data into `InfoObject`\
    \ attributes. Worth mentioning is that when you double-click a calculation view,\
    \ in a new `Eclipse` tab the system will open a definition of this calculation\
    \ view (even though it is a HANA artifact and not BW/4HANA). Exploring data flow\
    \ functionality can be useful when analyzing existing data flows.\n\nThe last\
    \ feature that I want to highlight is the data flow documentation. This function\
    \ enables possibility of describing role of each `Data Flow` node. Documentation\
    \ can be added to both persistent and conceptual nodes. Figure [1-50](#508424_1_En_1_Chapter.xhtml#Fig50)\
    \ shows how to add documentation for a specific node.\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig50_HTML.png](images/508424_1_En_1_Chapter/508424_1_En_1_Fig50_HTML.png)\n\
    \nFigure 1-50\n\nDocumenting data flows\n\nAs shown in Figure [1-50](#508424_1_En_1_Chapter.xhtml#Fig50),\
    \ after right-clicking a specific node you can select the `Show Documentation`\
    \ option. In the `Documentation` section there is an option to input any text\
    \ describing a specific object. In the presented example, I added documentation\
    \ for the `ZZPARTN` `InfoObject` node. This might help other developers to understand\
    \ the entire process as well as the role of single objects.\n\n> **Note**  \n\
    > The entered documentation will be visible only in the context of a specific\
    \ data flow. If you create a new data flow, the documentation section will be\
    \ empty for all the nodes, even though some of the objects might be documented\
    \ already within different data flows."
  raw: '### Data Flow


    There are multiple scenarios for using Data Flow objects. First, Data Flow objects
    can be used to model process flows. Before creating target BW/4HANA objects, you
    can create a Data Flow object to model your desired process. To create a Data
    Flow object, simply right-click the InfoArea and select New ➤ Data Flow Object.
    After providing the name of the object, the Data Flow editor will open (see Figure
    [1-43](#508424_1_En_1_Chapter.xhtml#Fig43)).


    ![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig43_HTML.jpg](images/508424_1_En_1_Chapter/508424_1_En_1_Fig43_HTML.jpg)


    Figure 1-43


    Data Flow object editor


    In the right pane (Figure [1-43](#508424_1_En_1_Chapter.xhtml#Fig43)), you have
    the list of object types available for creating a process flow. You can add them
    to your model by using drag-and-drop functionality or by right-clicking the modeling
    area and selecting the New option. You can also include existing BW/4HANA objects
    in your model by selecting the Add Object option and providing the name of the
    object. After adding objects to the model, you can connect them using arrows to
    depict the dependencies. Figure [1-44](#508424_1_En_1_Chapter.xhtml#Fig44) shows
    the exemplary data flow model.


    ![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig44_HTML.jpg](images/508424_1_En_1_Chapter/508424_1_En_1_Fig44_HTML.jpg)


    Figure 1-44


    Model created in the Data Flow object


    As shown in Figure [1-44](#508424_1_En_1_Chapter.xhtml#Fig44), the data flow consists
    of two data sources (SOURCE_1 and SOURCE_2), which are linked with two ADSOs (ADSO_1
    and ADSO_2). There is also one Open ODS View object (ODS_1) not linked to any
    data source. CompositeProvider (CP_FINAL) is modeled as a logical layer and combines
    data from Open ODS View and Advanced DSOs. Objects displayed in the Data Flow
    model are not associated with physical BW/4HANA objects. The created data flow
    model is just a template that can be later used as a reference for creating physical
    objects.


    Another great usage of Data Flow objects is the ability to generate persistent
    objects out of data flow models. This means that after creating the process flow
    template, we can then convert objects from the model into physical BW/4HANA objects.
    It’s always good to start from the objects at the bottom. Thanks to that, output
    structures can be propagated from the lower-level object to the upper one. After
    double-clicking the Data Source object, I can define its properties and activate
    it. Once that’s done, the data flow diagram will be updated accordingly (see Figure
    [1-45](#508424_1_En_1_Chapter.xhtml#Fig45)).


    ![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig45_HTML.jpg](images/508424_1_En_1_Chapter/508424_1_En_1_Fig45_HTML.jpg)


    Figure 1-45


    Converting the data flow model into physical objects


    As shown in Figure [1-45](#508424_1_En_1_Chapter.xhtml#Fig45), after creating
    a physical data source in place of the SOURCE_1 object, the model has been updated.
    Once the data source ZDS_PURCH_ORD was created, I clicked the ADSO_1 object and
    created the physical DataStore object called ZADSO_PO. The structure of that ADSO
    was inherited from the underlying data source. In Figure [1-45](#508424_1_En_1_Chapter.xhtml#Fig45),
    I highlighted also the function for generating a transformation from the model.
    The same is possible for the DTP. This modeling approach allows you to first create
    a concept for your process and then convert this concept into the working solution.
    It can save time since generating objects from a data flow is a bit faster than
    creating them manually one by one from the Project Explorer.


    If the Data Flow object consists fully of persistent BW/4HANA objects, you can
    utilize the feature of generating a process chain. This function is available
    from the data flow toolbar, as shown in Figure [1-46](#508424_1_En_1_Chapter.xhtml#Fig46).


    ![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig46_HTML.jpg](images/508424_1_En_1_Chapter/508424_1_En_1_Fig46_HTML.jpg)


    Figure 1-46


    Generating a process chain from a data flow


    When clicking the Process Chain button, first you need to provide a process chain
    name. Once you enter the name, a new Eclipse tab with a SAP GUI session embedded
    will open (see Figure [1-47](#508424_1_En_1_Chapter.xhtml#Fig47)).


    ![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig47_HTML.jpg](images/508424_1_En_1_Chapter/508424_1_En_1_Fig47_HTML.jpg)


    Figure 1-47


    Process chain window


    Figure [1-47](#508424_1_En_1_Chapter.xhtml#Fig47) shows that the DTP from the
    data flow model has been automatically inserted into the process chain definition.
    If the Data Flow object is modified, the changes will not be automatically reflected
    in the process chain. You will need to incorporate these changes manually or generate
    a new process chain from the Data Flow object.


    Data Flow objects can be also generated for existing BW/4HANA objects. To open
    a Data Flow object for a specific object, go to the Project Explorer list, right-click
    the object, and select the Explorer Data Flow option (Figure [1-48](#508424_1_En_1_Chapter.xhtml#Fig48)).


    ![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig48_HTML.jpg](images/508424_1_En_1_Chapter/508424_1_En_1_Fig48_HTML.jpg)


    Figure 1-48


    Displaying a data flow for the existing object


    By default data flows for existing objects are opened as a collapsed view, so
    not all objects and dependencies may be visible. In the data flow editor you can
    expand the data flow downward or upward to see additional objects. When hovering
    over the specific node, you will see arrow symbols, which enable you to narrow
    down the data flow (Figure [1-49](#508424_1_En_1_Chapter.xhtml#Fig49)).


    ![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig49_HTML.png](images/508424_1_En_1_Chapter/508424_1_En_1_Fig49_HTML.png)


    Figure 1-49


    Data Flow Explorer


    Figure [1-49](#508424_1_En_1_Chapter.xhtml#Fig49) shows the data flow for the
    CompositeProvider named ZCP_PARTN. It consists of three objects: Calculation View,
    Open ODS View, and InfoObject. After expanding the data flow for the InfoObject
    named ZZPARTN, we can see also Data Source and Source System used for loading
    master data into InfoObject attributes. Worth mentioning is that when you double-click
    a calculation view, in a new Eclipse tab the system will open a definition of
    this calculation view (even though it is a HANA artifact and not BW/4HANA). Exploring
    data flow functionality can be useful when analyzing existing data flows.


    The last feature that I want to highlight is the data flow documentation. This
    function enables possibility of describing role of each Data Flow node. Documentation
    can be added to both persistent and conceptual nodes. Figure [1-50](#508424_1_En_1_Chapter.xhtml#Fig50)
    shows how to add documentation for a specific node.


    ![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig50_HTML.png](images/508424_1_En_1_Chapter/508424_1_En_1_Fig50_HTML.png)


    Figure 1-50


    Documenting data flows


    As shown in Figure [1-50](#508424_1_En_1_Chapter.xhtml#Fig50), after right-clicking
    a specific node you can select the Show Documentation option. In the Documentation
    section there is an option to input any text describing a specific object. In
    the presented example, I added documentation for the ZZPARTN InfoObject node.
    This might help other developers to understand the entire process as well as the
    role of single objects.


    Note


    The entered documentation will be visible only in the context of a specific data
    flow. If you create a new data flow, the documentation section will be empty for
    all the nodes, even though some of the objects might be documented already within
    different data flows.'
  trans: "\n### 数据流\n\n`数据流`对象有多种使用场景。首先，`数据流`对象可用于对流程流进行建模。在创建目标 BW/4HANA 对象之前，您可以先创建一个`数据流`对象来对所需的流程进行建模。要创建`数据流`对象，只需右键单击`信息区域`并选择`新建\
    \ ➤ 数据流对象`。提供对象名称后，`数据流`编辑器将打开（参见图 1-43）。\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig43_HTML.jpg](img/508424_1_En_1_Fig43_HTML.jpg)\n\
    \n图 1-43\n\n`数据流`对象编辑器\n\n在右侧窗格（图 1-43）中，您可以看到可用于创建流程流的对象类型列表。您可以通过拖放功能，或右键单击建模区域并选择`新建`选项，将其添加到模型中。您还可以通过选择`添加对象`选项并提供对象名称，将现有的\
    \ BW/4HANA 对象包含到模型中。将对象添加到模型后，您可以使用箭头将它们连接起来，以描述依赖关系。图 1-44 显示了一个示例性的数据流模型。\n\n\
    ![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig44_HTML.jpg](img/508424_1_En_1_Fig44_HTML.jpg)\n\
    \n图 1-44\n\n在`数据流`对象中创建的模型\n\n如图 1-44 所示，该数据流由两个数据源（`SOURCE_1` 和 `SOURCE_2`）组成，它们与两个\
    \ ADSO（`ADSO_1` 和 `ADSO_2`）相关联。还有一个未链接到任何数据源的`开放 ODS 视图`对象（`ODS_1`）。`复合提供者`（`CP_FINAL`）被建模为一个逻辑层，并组合来自`开放\
    \ ODS 视图`和`高级 DSO` 的数据。在`数据流`模型中显示的对象与实际 BW/4HANA 对象无关。创建的数据流模型只是一个模板，后续可将其用作创建实际对象的参考。\n\
    \n`数据流`对象的另一个重要用途是能够根据数据流模型生成持久对象。这意味着在创建流程流模板之后，我们可以将模型中的对象转换为实际的 BW/4HANA 对象。从底层的对象开始始终是个好办法。这样，输出结构可以从较低层对象向上层对象传递。双击`数据源`对象后，我可以定义其属性并将其激活。完成后，数据流图将相应更新（参见图\
    \ 1-45）。\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig45_HTML.jpg](img/508424_1_En_1_Fig45_HTML.jpg)\n\
    \n图 1-45\n\n将数据流模型转换为实际对象\n\n如图 1-45 所示，在创建了一个实际的数据源以取代 `SOURCE_1` 对象后，模型已更新。创建数据源\
    \ `ZDS_PURCH_ORD` 后，我单击了 `ADSO_1` 对象，并创建了一个名为 `ZADSO_PO` 的实际`数据存储对象`。该 ADSO 的结构继承自底层数据源。在图\
    \ 1-45 中，我还高亮显示了从模型生成转换的功能。对于`数据传输进程`也是如此。这种建模方法允许您先为流程创建概念，然后将此概念转换为可行的解决方案。这可以节省时间，因为从数据流生成对象比在`项目浏览器`中逐个手动创建要快一些。\n\
    \n如果`数据流`对象完全由持久的 BW/4HANA 对象组成，您就可以使用生成流程链的功能。该功能可从数据流工具栏中获得，如图 1-46 所示。\n\n\
    ![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig46_HTML.jpg](img/508424_1_En_1_Fig46_HTML.jpg)\n\
    \n图 1-46\n\n从数据流生成流程链\n\n点击`流程链`按钮时，首先需要提供流程链名称。输入名称后，将打开一个嵌入了`SAP GUI`会话的新`Eclipse`选项卡（参见图\
    \ 1-47）。\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig47_HTML.jpg](img/508424_1_En_1_Fig47_HTML.jpg)\n\
    \n图 1-47\n\n流程链窗口\n\n图 1-47 显示来自数据流模型的`数据传输进程`已自动插入到流程链定义中。如果修改了`数据流`对象，这些更改不会自动反映在流程链中。您需要手动合并这些更改，或从`数据流`对象生成新的流程链。\n\
    \n也可以为现有的 BW/4HANA 对象生成`数据流`对象。要为特定对象打开`数据流`对象，请转到`项目浏览器`列表，右键单击该对象，然后选择`探索数据流`选项（图\
    \ 1-48）。\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig48_HTML.jpg](img/508424_1_En_1_Fig48_HTML.jpg)\n\
    \n图 1-48\n\n显示现有对象的数据流\n\n默认情况下，为现有对象打开的数据流以折叠视图显示，因此可能并非所有对象和依赖关系都可见。在数据流编辑器中，您可以向下或向上展开数据流以查看其他对象。将鼠标悬停在特定节点上时，您会看到箭头符号，这使您可以缩小数据流范围（图\
    \ 1-49）。\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig49_HTML.png](img/508424_1_En_1_Fig49_HTML.png)\n\
    \n图 1-49\n\n`数据流资源管理器`\n\n图 1-49 显示了名为 `ZCP_PARTN` 的`复合提供者`的数据流。它由三个对象组成：`计算视图`、`开放\
    \ ODS 视图`和`信息对象`。展开名为 `ZZPARTN` 的`信息对象`的数据流后，我们还可以看到用于将主数据加载到`信息对象`属性中的`数据源`和`源系统`。值得一提的是，当您双击一个计算视图时，系统会在一个新的`Eclipse`选项卡中打开该计算视图的定义（即使它是\
    \ HANA 组件而非 BW/4HANA）。在分析现有数据流时，探索数据流功能非常有用。\n\n我想强调的最后一个特性是数据流文档功能。此功能可以描述每个`数据流`节点的作用。文档既可以添加到持久节点，也可以添加到概念节点。图\
    \ 1-50 展示了如何为特定节点添加文档。\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig50_HTML.png](img/508424_1_En_1_Fig50_HTML.png)\n\
    \n图 1-50\n\n记录数据流\n\n如图 1-50 所示，右键单击特定节点后，您可以选择`显示文档`选项。在`文档`部分，有一个选项可以输入描述特定对象的任何文本。在展示的示例中，我为\
    \ `ZZPARTN` `信息对象`节点添加了文档。这可能有助于其他开发人员理解整个流程以及单个对象的作用。\n\n> **注意**  \n> 输入的文档仅在特定数据流的上下文中可见。如果您创建了一个新的数据流，则所有节点的文档部分都将为空，即使某些对象可能已经在不同的数据流中被记录。"
- fmt: "# Summary\n\nIn this chapter, we explored the modeling objects available in\
    \ SAP HANA and SAP BW/4HANA. For SAP HANA native, the following modeling artifacts\
    \ were described:\n\n- Calculation view\n- Table function\n- Virtual table\n\n\
    For BW/4HANA, I focused on describing the new modeling objects and highlighting\
    \ the new functionalities of existing SAP BW objects. Features of the following\
    \ BW/4HANA objects were introduced in this chapter:\n\n- InfoObject\n- Open ODS\
    \ View\n- Advanced DSO\n- CompositeProvider\n- Query\n- Data Flow\n\n# 2. Modeling\
    \ Concepts\n\nIn this chapter, I will describe the new modeling approaches introduced\
    \ with SAP BW/4HANA. Not only does the new SAP business warehouse application\
    \ significantly enhance the traditional SAP BW capabilities, but also it revolutionizes\
    \ the modeling approach in general. This knowledge will be the key to understanding\
    \ the new data warehousing functionalities, the bottom-up modeling approach, and\
    \ the virtual data modeling concept.\n\n## Overview of SAP BW/4HANA Modeling Concepts\n\
    \nWith the new functionalities and artifacts, BW/4HANA enables modern architecture\
    \ based on the Layered Scalable Architecture++ (LSA++). This new architecture\
    \ is leaner, simpler, and faster to implement. Moreover, it supports the virtualization\
    \ approach, meaning that it may also be more cost effective.\n\nLSA++ is an extension\
    \ of the traditional LSA, which was available for SAP BW systems. In addition\
    \ to reducing the number of modeling objects, LSA++ defines completely new standards\
    \ for building data warehouses. Figure 2-1 presents the differences between the\
    \ LSA and LSA++ approaches.\n\n![../images/508424_1_En_2_Chapter/508424_1_En_2_Fig1_HTML.jpg](images/508424_1_En_2_Chapter/508424_1_En_2_Fig1_HTML.jpg)\n\
    \n*Figure 2-1. Differences between LSA and LSA++*\n\nAs shown in Figure 2-1, the\
    \ traditional LSA is based on several layers. On each of the layers, data is being\
    \ physically stored, making the LSA architecture highly data redundant. Because\
    \ of the high number of objects needing to be created, the maintenance of such\
    \ an architecture is complex and not flexible. Lack of flexibility, high maintenance,\
    \ and development effort all increase significantly the cost of the data warehouse.\
    \ A high level of data redundancy and the top-down modeling approach both led\
    \ to monolithic architectures that couldn’t be used as part of the agile software\
    \ development approach.\n\nThe SAP BW/4HANA environment introduces the new, modern\
    \ LSA++ architecture, which is heavily focused on virtual objects. As shown in\
    \ Figure 2-1, there is no need to create several staging layers and copy data\
    \ from one layer to another. Virtual data marts can now be built directly on top\
    \ of the data acquisition layer. If there is more than one staging layer needed,\
    \ `CompositeProvider` can virtually combine data across the layers. Another virtualization\
    \ capability is creating reports on top of virtual tables that physically reside\
    \ in different databases. This means that reporting can be done without loading\
    \ external data into a SAP database (of course, this can cause performance issues\
    \ for very large datasets).\n\nPersistent layers supported by `ADSO` can be defined\
    \ using `InfoObject`, but also by using field-based modeling, which significantly\
    \ accelerates the development. Thanks to this approach, developers can quickly\
    \ create a persistent layer and, if needed, later enrich the model by associating\
    \ Master Data objects at the `CompositeProvider` level.\n\nSAP BW/4HANA and the\
    \ new LSA++ architecture gives much more flexibility and significantly reduces\
    \ the maintenance, data storage, and development time. In this chapter, I will\
    \ present the general modeling concepts available in SAP BW/4HANA 2.0.\n\n> **Note**\
    \  \n> The modeling concepts described in this chapter will highlight BW/4HANA\
    \ 2.0 functionalities and features. Be aware that there is no single recommended\
    \ architecture for all scenarios. It is also not possible to cover all the possible\
    \ approaches; hence, I will visualize the ones that I find to be common. The discussion\
    \ of the concepts will be followed by examples in the next chapters of this book.\n\
    \n## Traditional Data Models\n\nTraditional BW modeling follows a top-down approach,\
    \ where before creating any model it is required to create an `InfoObject` for\
    \ every single output field. Figure 2-2 shows a high-level approach for creating\
    \ a classic EDW in BW/4HANA.\n\n![../images/508424_1_En_2_Chapter/508424_1_En_2_Fig2_HTML.jpg](images/508424_1_En_2_Chapter/508424_1_En_2_Fig2_HTML.jpg)\n\
    \n*Figure 2-2. BW/4HANA classic modeling concept*\n\nFigure 2-2 shows a simplified\
    \ scenario for the classic BW modeling approach. The diagram can be also used\
    \ as a reference for comparing the classic approach with the new agile modeling\
    \ concepts.\n\nIn the classic modeling approach, before creating transactional\
    \ `ADSO`, we need to first define the attributes, key figures, and master data\
    \ `InfoObject`. In Figure 2-2, you might notice the link between `InfoObject 2`\
    \ and `InfoObject 3`. This is because that master data `InfoObject` consists of\
    \ attributes and navigational attributes. Before we are able to implement even\
    \ a draft version of our data model, we need to first create all elementary building\
    \ blocks in the form of `InfoObject`. As shown in Figure 2-2, the Facts `ADSO`\
    \ is modeled fully based on `InfoObject`. Solid lines on the diagram indicate\
    \ that data from data sources are loaded into target objects. On top of the `ADSO`\
    \ there is a `CompositeProvider`, which allows us to combine data from multiple\
    \ providers. Although we could create a BW Query object directly on `ADSO`, it\
    \ is always better to take advantage of a `CompositeProvider`, which provides\
    \ additional functionalities and gives us the ability to include other `InfoProvider`.\n\
    \nThe classic BW/4HANA approach leads to a long development time and high maintenance\
    \ effort. Despite its disadvantages, the classic approach is from my point of\
    \ view still the fundamental way to implement an enterprise data warehouse for\
    \ SAP data. In this approach, the data model relies on stable and reusable structures.\
    \ Data persistency ensures a high-performing solution. In addition to adapting\
    \ the SAP business content, we can take advantage of predefined data models. We\
    \ can use them to jump-start delivering EDW solutions as well as a guideline for\
    \ further development.\n\nIn the next part of this section, I will describe some\
    \ new modeling concepts.\n\n> **Note**  \n> Please be aware that in the following\
    \ discussion of new modeling concepts, HANA physical tables and virtual tables\
    \ can be utilized in the same way (even though sometimes only one table type will\
    \ be presented in the diagram)."
  raw: '## Summary


    In this chapter, we explored the modeling objects available in SAP HANA and SAP
    BW/4HANA. For SAP HANA native, the following modeling artifacts were described:


    *   Calculation view


    *   Table function


    *   Virtual table


    For BW/4HANA, I focused on describing the new modeling objects and highlighting
    the new functionalities of existing SAP BW objects. Features of the following
    BW/4HANA objects were introduced in this chapter:


    *   InfoObject


    *   Open ODS View


    *   Advanced DSO


    *   CompositeProvider


    *   Query


    *   Data Flow


    # 2. Modeling Concepts


    In this chapter, I will describe the new modeling approaches introduced with SAP
    BW/4HANA. Not only does the new SAP business warehouse application significantly
    enhance the traditional SAP BW capabilities, but also it revolutionizes the modeling
    approach in general. This knowledge will be the key to understanding the new data
    warehousing functionalities, the bottom-up modeling approach, and the virtual
    data modeling concept.


    ## Overview of SAP BW/4HANA Modeling Concepts


    With the new functionalities and artifacts, BW/4HANA enables modern architecture
    based on the Layered Scalable Architecture++ (LSA++). This new architecture is
    leaner, simpler, and faster to implement. Moreover, it supports the virtualization
    approach, meaning that it may also be more cost effective.


    LSA++ is an extension of the traditional LSA, which was available for SAP BW systems.
    In addition to reducing the number of modeling objects, LSA++ defines completely
    new standards for building data warehouses. Figure [2-1](#508424_1_En_2_Chapter.xhtml#Fig1)
    presents the differences between the LSA and LSA++ approaches.


    ![../images/508424_1_En_2_Chapter/508424_1_En_2_Fig1_HTML.jpg](images/508424_1_En_2_Chapter/508424_1_En_2_Fig1_HTML.jpg)


    Figure 2-1.


    Differences between LSA and LSA++


    As shown in Figure [2-1](#508424_1_En_2_Chapter.xhtml#Fig1), the traditional LSA
    is based on several layers. On each of the layers, data is being physically stored,
    making the LSA architecture highly data redundant. Because of the high number
    of objects needing to be created, the maintenance of such an architecture is complex
    and not flexible. Lack of flexibility, high maintenance, and development effort
    all increase significantly the cost of the data warehouse. A high level of data
    redundancy and the top-down modeling approach both led to monolithic architectures
    that couldn’t be used as part of the agile software development approach.


    The SAP BW/4HANA environment introduces the new, modern LSA++ architecture, which
    is heavily focused on virtual objects. As shown in Figure [2-1](#508424_1_En_2_Chapter.xhtml#Fig1),
    there is no need to create several staging layers and copy data from one layer
    to another. Virtual data marts can now be built directly on top of the data acquisition
    layer. If there is more than one staging layer needed, CompositeProviders can
    virtually combine data across the layers. Another virtualization capability is
    creating reports on top of virtual tables that physically reside in different
    databases. This means that reporting can be done without loading external data
    into a SAP database (of course, this can cause performance issues for very large
    datasets).


    Persistent layers supported by ADSOs can be defined using InfoObjects, but also
    by using field-based modeling, which significantly accelerates the development.
    Thanks to this approach, developers can quickly create a persistent layer and,
    if needed, later enrich the model by associating Master Data objects at the CompositeProvider
    level.


    SAP BW/4HANA and the new LSA++ architecture gives much more flexibility and significantly
    reduces the maintenance, data storage, and development time. In this chapter,
    I will present the general modeling concepts available in SAP BW/4HANA 2.0.


    Note


    The modeling concepts described in this chapter will highlight BW/4HANA 2.0 functionalities
    and features. Be aware that there is no single recommended architecture for all
    scenarios. It is also not possible to cover all the possible approaches; hence,
    I will visualize the ones that I find to be common. The discussion of the concepts
    will be followed by examples in the next chapters of this book.


    ### Traditional Data Models


    Traditional BW modeling follows a top-down approach, where before creating any
    model it is required to create an InfoObject for every single output field. Figure
    [2-2](#508424_1_En_2_Chapter.xhtml#Fig2) shows a high-level approach for creating
    a classic EDW in BW/4HANA.


    ![../images/508424_1_En_2_Chapter/508424_1_En_2_Fig2_HTML.jpg](images/508424_1_En_2_Chapter/508424_1_En_2_Fig2_HTML.jpg)


    Figure 2-2.


    BW/4HANA classic modeling concept


    Figure [2-2](#508424_1_En_2_Chapter.xhtml#Fig2) shows a simplified scenario for
    the classic BW modeling approach. The diagram can be also used as a reference
    for comparing the classic approach with the new agile modeling concepts.


    In the classic modeling approach, before creating transactional ADSOs, we need
    to first define the attributes, key figures, and master data InfoObjects. In Figure
    [2-2](#508424_1_En_2_Chapter.xhtml#Fig2), you might notice the link between InfoObject
    2 and InfoObject 3\. This is because that master data InfoObject consists of attributes
    and navigational attributes. Before we are able to implement even a draft version
    of our data model, we need to first create all elementary building blocks in the
    form of InfoObjects. As shown in Figure [2-2](#508424_1_En_2_Chapter.xhtml#Fig2),
    the Facts ADSO is modeled fully based on InfoObjects. Solid lines on the diagram
    indicate that data from data sources are loaded into target objects. On top of
    the ADSO there is a CompositeProvider, which allows us to combine data from multiple
    providers. Although we could create a BW Query object directly on ADSO, it is
    always better to take advantage of a CompositeProvider, which provides additional
    functionalities and gives us the ability to include other InfoProviders.


    The classic BW/4HANA approach leads to a long development time and high maintenance
    effort. Despite its disadvantages, the classic approach is from my point of view
    still the fundamental way to implement an enterprise data warehouse for SAP data.
    In this approach, the data model relies on stable and reusable structures. Data
    persistency ensures a high-performing solution. In addition to adapting the SAP
    business content, we can take advantage of predefined data models. We can use
    them to jump-start delivering EDW solutions as well as a guideline for further
    development.


    In the next part of this section, I will describe some new modeling concepts.


    Note


    Please be aware that in the following discussion of new modeling concepts, HANA
    physical tables and virtual tables can be utilized in the same way (even though
    sometimes only one table type will be presented in the diagram).'
  trans: "好的，作为高级文档工程师和翻译员，我将严格遵守注意事项和示例格式，为您提供专业、准确的中文翻译。\n\n\n# 总结\n\n在本章中，我们探讨了\
    \ SAP HANA 和 SAP BW/4HANA 中可用的建模对象。对于 SAP HANA 原生环境，描述了以下建模工件：\n\n-   计算视图\n-\
    \   表函数\n-   虚拟表\n\n对于 BW/4HANA，我重点描述了新的建模对象，并强调了现有 SAP BW 对象的新功能。本章介绍了以下 BW/4HANA\
    \ 对象的特性：\n\n-   信息对象\n-   开放 ODS 视图\n-   高级 DSO\n-   组合提供者\n-   查询\n-   数据流\n\n\
    # 2. 建模概念\n\n在本章中，我将描述 SAP BW/4HANA 引入的新建模方法。这个新的 SAP 商务仓库应用程序不仅显著增强了传统 SAP BW\
    \ 的能力，而且从根本上革新了建模方法。这些知识将是理解新的数据仓库功能、自底向上建模方法以及虚拟数据建模概念的关键。\n\n## SAP BW/4HANA\
    \ 建模概念概述\n\n凭借新的功能和工件，BW/4HANA 实现了基于分层可扩展架构++（LSA++）的现代化架构。这种新架构更精简、更简单，并且实施速度更快。此外，它支持虚拟化方法，这意味着它可能也更经济高效。\n\
    \nLSA++是传统 LSA 的扩展，传统 LSA 适用于 SAP BW 系统。除了减少建模对象的数量外，LSA++还定义了构建数据仓库的全新标准。图 2-1\
    \ 展示了 LSA 和 LSA++方法之间的差异。\n\n![../images/508424_1_En_2_Chapter/508424_1_En_2_Fig1_HTML.jpg](img/508424_1_En_2_Fig1_HTML.jpg)\n\
    \n*图 2-1. LSA 与 LSA++的差异*\n\n如图 2-1 所示，传统的 LSA 基于多个层。在每个层上，数据都被物理存储，这使得 LSA 架构具有高度的数据冗余。由于需要创建大量对象，维护此类架构既复杂又不灵活。缺乏灵活性、高维护量和开发工作量都显著增加了数据仓库的成本。高度的数据冗余和自上而下的建模方法都导致了单体架构，这种架构无法作为敏捷软件开发方法的一部分使用。\n\
    \nSAP BW/4HANA 环境引入了新的、现代化的 LSA++架构，该架构高度关注虚拟对象。如图 2-1 所示，无需创建多个暂存层并将数据从一个层复制到另一个层。现在可以直接在数据采集层之上构建虚拟数据集市。如果需要一个以上的暂存层，`CompositeProvider`可以跨层虚拟地组合数据。另一个虚拟化能力是在物理上驻留在不同数据库中的虚拟表之上创建报表。这意味着无需将外部数据加载到\
    \ SAP 数据库即可进行报表生成（当然，对于非常大的数据集，这可能会导致性能问题）。\n\n`ADSO`支持的持久层可以使用`InfoObject`定义，也可以使用基于字段的建模来定义，后者可以显著加速开发。得益于此方法，开发人员可以快速创建持久层，并在需要时，稍后通过在`CompositeProvider`级别关联主数据对象来丰富模型。\n\
    \nSAP BW/4HANA 和新 LSA++架构提供了更大的灵活性，并显著减少了维护、数据存储和开发时间。在本章中，我将介绍 SAP BW/4HANA 2.0\
    \ 中可用的一般建模概念。\n\n> **注意**  \n> 本章描述的建模概念将重点介绍 BW/4HANA 2.0 的功能和特性。请注意，对于所有场景，并没有单一的推荐架构。也不可能涵盖所有可能的方法；因此，我将展示我认为常见的方法。对这些概念的讨论将在本书后续章节中通过示例进行说明。\n\
    \n## 传统数据模型\n\n传统的 BW 建模遵循自上而下的方法，在创建任何模型之前，需要为每一个输出字段创建一个`InfoObject`。图 2-2 展示了在\
    \ BW/4HANA 中创建经典 EDW 的高级方法。\n\n![../images/508424_1_En_2_Chapter/508424_1_En_2_Fig2_HTML.jpg](img/508424_1_En_2_Fig2_HTML.jpg)\n\
    \n*图 2-2. BW/4HANA 经典建模概念*\n\n图 2-2 展示了一个经典 BW 建模方法的简化场景。该图也可作为比较经典方法与新敏捷建模概念的参考。\n\
    \n在经典建模方法中，在创建事务性`ADSO`之前，我们需要首先定义属性、关键指标和主数据`InfoObject`。在图 2-2 中，您可能会注意到`InfoObject\
    \ 2`和`InfoObject 3`之间的链接。这是因为主数据`InfoObject`由属性和导航属性组成。在我们能够实现数据模型的草稿版本之前，我们需要首先以`InfoObject`的形式创建所有基本构建块。如图\
    \ 2-2 所示，事实`ADSO`完全基于`InfoObject`建模。图中的实线表示来自数据源的数据被加载到目标对象中。在`ADSO`之上是一个`CompositeProvider`，它允许我们组合来自多个提供者的数据。虽然我们可以直接在`ADSO`上创建\
    \ BW 查询对象，但最好还是利用`CompositeProvider`，它提供了额外的功能，并允许我们包含其他`InfoProvider`。\n\n经典的\
    \ BW/4HANA 方法导致开发周期长和维护工作量大。尽管有其缺点，但从我的角度来看，经典方法仍然是实现 SAP 数据的企业数据仓库的基本方式。在这种方法中，数据模型依赖于稳定且可重用的结构。数据持久性确保了高性能的解决方案。除了适配\
    \ SAP 业务内容，我们还可以利用预定义的数据模型。我们可以使用它们来快速启动交付 EDW 解决方案，并将其作为进一步开发的指南。\n\n在本节的下一部分，我将描述一些新的建模概念。\n\
    \n> **注意**  \n> 请注意，在接下来的新建模概念的讨论中，HANA 物理表和虚拟表可以以相同的方式使用（尽管有时图中只展示一种表类型）。\n"
- fmt: '### Virtual Data Provisioning


    The first concept that I will introduce is reporting on SAP HANA artifacts. There
    might be a scenario where we want to simply enable the structure and the content
    of a SAP HANA physical table or virtual table in the BW/4HANA system. In Figure
    [2-3](#508424_1_En_2_Chapter.xhtml#Fig3), you can see the concept of data provisioning
    directly from the HANA table.


    ![../images/508424_1_En_2_Chapter/508424_1_En_2_Fig3_HTML.jpg](images/508424_1_En_2_Chapter/508424_1_En_2_Fig3_HTML.jpg)


    Figure 2-3. BW/4HANA concept of table data provisioning


    The concept illustrated in Figure [2-3](#508424_1_En_2_Chapter.xhtml#Fig3) shows
    how we can expose the HANA table through the BW/4HANA layer. In this approach,
    `Open ODS View` objects are the virtual BW/4HANA objects used as a layer between
    a `CompositeProvider` and a HANA table. They can be consumed by a `CompositeProvider`
    to provide the data from the underlying HANA table, without any data persistency.
    This concept takes advantage of a field-based approach, so we don’t need to create
    any `InfoObjects`. All the fields can be simply dragged from the underlying table
    structure to the target structure of the `Open ODS View` object. The `Open ODS
    View` object can be then consumed by the `CompositeProvider` (optionally we could
    also create a query directly on top of the `Open ODS View` object). Dotted lines
    in the diagram indicate that the data flow is fully virtualized, so no data loads
    are required. Such requirements are pretty common for data extractions, ad hoc
    data analysis, or prototyping purposes.


    The next concept is similar to the one shown in Figure [2-3](#508424_1_En_2_Chapter.xhtml#Fig3);
    however, here as a source we utilize a virtual table, which physically resides
    outside of the HANA database (for example in a Microsoft SQL or Oracle database).
    Figure [2-4](#508424_1_En_2_Chapter.xhtml#Fig4) describes the concept of virtual
    table data provisioning.


    ![../images/508424_1_En_2_Chapter/508424_1_En_2_Fig4_HTML.jpg](images/508424_1_En_2_Chapter/508424_1_En_2_Fig4_HTML.jpg)


    Figure 2-4. BW/4HANA concept of virtual table data provisioning


    Using `Smart Data Access (SDA)`, we can create a remote source connected to an
    external database. Once the remote source is configured, we will be able to create
    in the HANA system a virtual table with the same structure as the source table
    residing in the external database. The `Open ODS View` object enables us to source
    data directly both from a HANA table and from a virtual table. In the diagram
    shown in Figure [2-4](#508424_1_En_2_Chapter.xhtml#Fig4), the `Open ODS View`
    object is created on top of the virtual table.


    In scenarios when we need to apply some additional data manipulations on a source
    table or create a dataset that combines data from multiple tables (both virtual
    and regular), we can take advantage of calculation view capabilities (see Figure
    [2-5](#508424_1_En_2_Chapter.xhtml#Fig5)).


    ![../images/508424_1_En_2_Chapter/508424_1_En_2_Fig5_HTML.jpg](images/508424_1_En_2_Chapter/508424_1_En_2_Fig5_HTML.jpg)


    Figure 2-5. BW/4HANA concept of calculation view data provisioning


    The variant depicted in Figure [2-5](#508424_1_En_2_Chapter.xhtml#Fig5) is similar
    to the previous ones. The difference is only on the SAP HANA level, where there
    is a calculation view added on top of three tables. This calculation view combines
    data from the HANA tables and the virtual table. The BW/4HANA part remains the
    same as in the previous example, meaning from the calculation view, data is passed
    through a field-based `Open ODS View` object to the `CompositeProvider` object.


    > **Note:** It is possible to add a calculation view directly as the source of
    `CompositeProvider`. However, when creating an `Open ODS View` object, we also
    define a reusable logical object, with all the properties, structures, or associations
    to Master Data objects. Therefore, we don’t need to apply all these settings every
    time when utilizing a specific calculation view as a source of a `CompositeProvider`
    object.


    ### Field-Based Data Models


    Let’s now consider a more complex scenario, where the requirement is to create
    a snowflake data model in BW/4HANA based on data from HANA tables. Figure [2-6](#508424_1_En_2_Chapter.xhtml#Fig6)
    presents a simple snowflake data model, which I will use as a reference for visualizing
    the BW/4HANA modeling approach.


    ![../images/508424_1_En_2_Chapter/508424_1_En_2_Fig6_HTML.jpg](images/508424_1_En_2_Chapter/508424_1_En_2_Fig6_HTML.jpg)


    Figure 2-6. Simplified snowflake schema


    The snowflake schema consists of a central fact table connected to multiple dimensions
    in a normalized form. To imitate the same behavior in BW/4HANA, we can again take
    advantage of `Open ODS View` objects. When creating `Open ODS View` objects, we
    have the option to indicate the type of the underlying object. We can define semantics
    as `Facts`, `Master Data`, or `Text`. Figure [2-7](#508424_1_En_2_Chapter.xhtml#Fig7)
    visualizes an approach for implementing a virtual model in BW/4HANA, based on
    tables in HANA (see Figure [2-6](#508424_1_En_2_Chapter.xhtml#Fig6)).


    ![../images/508424_1_En_2_Chapter/508424_1_En_2_Fig7_HTML.jpg](images/508424_1_En_2_Chapter/508424_1_En_2_Fig7_HTML.jpg)


    Figure 2-7. BW/4HANA concept of implementing `Open ODS View`–based virtual model


    As shown in Figure [2-7](#508424_1_En_2_Chapter.xhtml#Fig7), the data flows for
    facts and for dimensions are similar. For the fact table, there is a calculation
    view of the `CUBE` data category created, while for dimension tables it is view
    of the `DIMENSION` category. The same approach could be followed when utilizing
    physical tables residing directly in the HANA database.


    > **Note:** Virtual tables can be consumed by `Open ODS Views` directly, so it
    is not mandatory to create a calculation view as an intermediate layer. Nevertheless,
    I recommend creating calculation views, since this gives you flexibility if in
    the future you need to implement additional formatting, convert data types, or
    add calculated columns, which are quite common requirements.


    For `Open ODS View` objects, there are also two semantic types used: `Facts` for
    fact tables and `Master Data` for three dimension tables. You may notice that
    `Open ODS View 2` is linked to `Open ODS View 3`. This is to visualize that the
    `Open ODS View 2` field has an association to the `Open ODS View 3` master data.
    To better understand this concept, you can think about them as `InfoObjects` with
    attributes. You create a main `InfoObject` and specify a list of `InfoObjects`
    as navigational attributes. The only difference is that instead of using `InfoObjects`,
    you utilize `Open ODS Views`. The dotted line between the `Facts Open ODS View`
    and `Master Data Open ODS View 1` and `2` also depicts an association of Fact
    Table fields with `Master Data`. The final `CompositeProvider` may still contain
    raw fields; however, there will be associations with `Open ODS View` master data
    objects. This approach enables you to create a snowflake data model without data
    persistency.


    The modeling variant described in Figure [2-7](#508424_1_En_2_Chapter.xhtml#Fig7)
    is fully virtualized and may not be suitable for complex data models or in scenarios
    were large data volumes need to be handled. In virtual data models, all the operations
    are performed on the fly, which obviously can lead to a performance decrease.
    In addition, virtual tables query data from external databases, which is also
    not efficient.


    If you developed an `Open ODS View` object–based virtual data model and you realized
    that the performance is not good enough, you can automatically generate a persistent
    layer for selected `Open ODS View` objects (`Facts` and/or `Master Data`). Figure
    [2-8](#508424_1_En_2_Chapter.xhtml#Fig8) shows the architecture of a persistent
    `Open ODS View`–based data model.


    ![../images/508424_1_En_2_Chapter/508424_1_En_2_Fig8_HTML.jpg](images/508424_1_En_2_Chapter/508424_1_En_2_Fig8_HTML.jpg)


    Figure 2-8. BW/4HANA concept of implementing `Open ODS View`–based persistent
    model'
