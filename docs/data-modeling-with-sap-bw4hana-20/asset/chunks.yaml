    mapping for the ZCPINTFCT01 CompositeProvider object including the Product navigation
    attributes.


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig44_HTML.jpg](images/508424_1_En_6_Chapter/508424_1_En_6_Fig44_HTML.jpg)


    Figure 6-44.


    Final structure of the ZCPINTFCT01 CompositeProvider object


    Figure [6-44](#508424_1_En_6_Chapter.xhtml#Fig44) presents the target mapping
    for the ZCPINTFCT01 CompositeProvider object. For the navigation attribute descriptions,
    it is good to include the information about the source object from which the column
    was retrieved. This is why the description for the Product navigation attributes
    were adjusted; i.e., (EXT) Brand was changed to (EXT) Product – Brand. This will
    help the end user to identify that this information comes from the master data
    of the Product dimension and not from transactional data. After activating the
    CompositeProvider object, we can create the final query (Figure [6-45](#508424_1_En_6_Chapter.xhtml#Fig45)).


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig45_HTML.jpg](images/508424_1_En_6_Chapter/508424_1_En_6_Fig45_HTML.jpg)


    Figure 6-45.


    Definition of the ZCPINTFCT01_Q01 query


    In the final query, we defined the target structure of the report. The Quantity
    Ordered measure was added to the *Columns* section. All the attributes were added
    to the *Free Characteristics section* (Figure [6-45](#508424_1_En_6_Chapter.xhtml#Fig45)).
    Finally, to validate the report, we will open it in the Analysis for Microsoft
    Excel tool.


    First, when we open the report, we can see that thanks to the prefixes that we
    added for the descriptions, the fields are sorted (Figure [6-46](#508424_1_En_6_Chapter.xhtml#Fig46)).
    The end user can easily identify fields that are relevant for one or another data
    source. The fields that are common for both sources are shown at the bottom of
    the list without prefixes. To validate the content of the report, we can add selected
    fields to the output of the crosstab (Figure [6-47](#508424_1_En_6_Chapter.xhtml#Fig47)).


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig47_HTML.jpg](images/508424_1_En_6_Chapter/508424_1_En_6_Fig47_HTML.jpg)


    Figure 6-47.


    Output of the ZCPINTFCT01_Q01 query in Analysis for Microsoft Excel


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig46_HTML.jpg](images/508424_1_En_6_Chapter/508424_1_En_6_Fig46_HTML.jpg)


    Figure 6-46.


    Display list of fields for the ZCPINTFCT01_Q01 query in Analysis for Microsoft Excel


    Figure [6-47](#508424_1_En_6_Chapter.xhtml#Fig47) shows the output of the ZCPINTFCT01_Q01
    for the selected fields. The fields that are relevant only for the specific data
    source contain the source system prefix in the header name. This informs us that
    for the given column the data will be available only for the specific system.
    If values are not available, there will be hash (#) symbol displayed. In addition,
    the Product - Source System column helps to identify or filter the Products from
    specific source system. This report enables us to perform a detailed analysis
    of all the orders across the company, no matter if they are coming from SAP or
    from the external system.'
