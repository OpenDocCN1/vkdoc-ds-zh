    the transitive attributes functionality, which is also not available for Open
    ODS Views. In such a scenario, assuming that you want to keep your architecture
    virtual, you might take advantage of “virtual” InfoObjects. By “virtual” InfoObjects,
    I mean InfoObjects with the Access Type option set as SAP HANA View. Figure [2-10](#508424_1_En_2_Chapter.xhtml#Fig10)
    shows the concept of a data model using HANA View–based InfoObjects.


    ![../images/508424_1_En_2_Chapter/508424_1_En_2_Fig10_HTML.jpg](images/508424_1_En_2_Chapter/508424_1_En_2_Fig10_HTML.jpg)


    Figure 2-10.


    BW/4HANA hybrid data model with “virtual” InfoObjects


    The second hybrid modeling approach is a mixture of field-based and InfoObject-based
    approaches. If a field has no master data (for example, a free-text field), keeping
    it as a raw field is good enough. For the master data model, we could create a
    “virtual” InfoObject by setting its access type to SAP HANA View. This means that
    instead of using InfoObject’s technical tables, this InfoObject will source master
    data from the underlying calculation view. When setting the SAP HANA view as the
    access type, we need to indicate the path for the source calculation view and
    provide the mapping between the InfoObject attributes and the calculation view
    fields. In Figure [2-10](#508424_1_En_2_Chapter.xhtml#Fig10), InfoObject 1 is
    mapped to Calculation View 1, and it has three attributes: InfoObject 2, InfoObject
    4, and InfoObject 5\. InfoObject 2 is also virtual and queries data from Calculation
    View 2\. InfoObject 4 is a standard SAP master data object, while InfoObject 5
    is an attribute-only object. If the performance is not sufficient, we could create
    a persistent master data model by loading the output of the dimension calculation
    views into new InfoObjects. This way, we could create for the external system
    a data model following the same architecture as the traditional BW/4HANA model
    (Figure [2-2](#508424_1_En_2_Chapter.xhtml#Fig2)). The only difference would be
    that the data would be sourced from the external system instead of SAP.


    When applying this architecture, we need to remember that we are losing all the
    flexibility that the Open ODS View objects and field-based approach enable. InfoObjects
    cannot take advantage of field-based modeling, meaning for each attribute we are
    forced to use InfoObjects. As a principle, usage of InfoObjects for external data
    models should be considered if the following conditions are met:


    *   The source data model has stable structures that hardly change.


    *   In the pilot phase, you created a field-based model that was tested, and as
    a next iteration, you want to convert it to a structured model followed by the
    classic BW/4HANA modeling concept.


    *   There is a need for leveraging functionality that is not available for Open
    ODS Views or fields. In this case, use a “virtual” InfoObject for these specific
    dimensions (i.e., when a hierarchy is required).


    Best practice


    Performance may not be sufficient when the data model is fully based on virtual
    tables (the model used on HANA physical tables will have better performance).
    If the source model consists of huge fact tables and multiple dimension tables,
    data persistency will be required.


    Figure [2-11](#508424_1_En_2_Chapter.xhtml#Fig11) shows the architecture of a
    hybrid data model using persistent InfoObjects.


    ![../images/508424_1_En_2_Chapter/508424_1_En_2_Fig11_HTML.jpg](images/508424_1_En_2_Chapter/508424_1_En_2_Fig11_HTML.jpg)


    Figure 2-11.


    BW/4HANA hybrid data model with persistent InfoObjects


    The architecture shown in Figure [2-11](#508424_1_En_2_Chapter.xhtml#Fig11) is
    similar to the classic modeling concept (Figure [2-2](#508424_1_En_2_Chapter.xhtml#Fig2)).
    The difference is that custom InfoObjects (InfoObject 1 and InfoObject 2) are
    loaded with data coming from the external system instead of the SAP system. With
    this approach all the InfoObject functionalities can be leveraged for external
    master data, and performance will not be impacted. On the other hand, development
    and maintenance require a higher effort. When analyzing the architecture shown
    in Figure [2-11](#508424_1_En_2_Chapter.xhtml#Fig11), you can ask yourself, why
    instead of creating a new model could I not simply load non-SAP data into the
    existing SAP data model structures?


    You might be thinking about the approach shown in Figure [2-12](#508424_1_En_2_Chapter.xhtml#Fig12).


    ![../images/508424_1_En_2_Chapter/508424_1_En_2_Fig12_HTML.jpg](images/508424_1_En_2_Chapter/508424_1_En_2_Fig12_HTML.jpg)


    Figure 2-12.


    BW/4HANA diagram for loading non-SAP data into the SAP data model


    The approach for including external data into the existing SAP data model has
    the following limitations:


    *   The data type for external dimensions and attributes may not be consistent
    with the target InfoObject data type, so data loading will not be possible.


    *   The data length for external dimension and attributes may not be consistent
    with the target InfoObject data length, so data loading will not be possible.


    *   There is almost no chance that all non-SAP dimensions and their attributes
    could be incorporated into the SAP model because of the different data modeling
    approach as well as different keys, relationships, and data type definitions,
    which are specific to the given database technology.


    *   Even if the source data type matches the InfoObject data type, there is a
    risk that the underlying non-SAP dimension table will contain the same primary
    key value as the existing SAP InfoObject key. If this is not properly maintained,
    external data could overwrite the SAP master data and cause a lot of reporting
    issues globally.


    *   Any small deviation in source data that does not follow the InfoObject definition
    will cause data load failure.


    *   Not all the users should be allowed to see non-SAP data; hence, the security
    model can become very complex.


    *   There is a high risk that during integration, the existing global reporting
    solution will be negatively impacted.


    With all these limitations and disadvantages, we can say that there is no easy
    way to integrate external data into an existing SAP data warehouse. Nevertheless,
    we can create a new data model, which will combine SAP and non-SAP data.'
  trans: '

    # 虚拟模型实现的混合建模概念


    混合建模概念可作为虚拟模型实现的最终架构。但需注意，虽然主数据开放 ODS 视图充当虚拟信息对象，但这并未涵盖其全部功能。一个常见需求是创建层级结构。`开放
    ODS 视图`不支持层级，而`信息对象`支持。另一个限制是传递属性功能，该功能同样不适用于`开放 ODS 视图`。在此场景下，若希望保持架构的虚拟性，则可利用“虚拟”`信息对象`。所谓“虚拟”`信息对象`，是指将`访问类型`选项设置为`SAP
    HANA 视图`的`信息对象`。图 2-10 展示了基于`HANA 视图`的`信息对象`数据模型概念。


    ![../images/508424_1_En_2_Chapter/508424_1_En_2_Fig10_HTML.jpg](img/508424_1_En_2_Fig10_HTML.jpg)


    **图 2-10.** 采用“虚拟”`信息对象`的 BW/4HANA 混合数据模型


    第二种混合建模方法是基于字段和基于`信息对象`两种方法的结合。若某个字段没有主数据（例如自由文本字段），则将其保留为原始字段即可。对于主数据模型，我们可以通过将`访问类型`设置为`SAP
    HANA 视图`来创建“虚拟”`信息对象`。这意味着该`信息对象`将不再使用自身技术表，而是从底层计算视图中获取主数据。将`SAP HANA 视图`设置为`访问类型`时，需要指明源计算视图的路径，并提供`信息对象`属性与计算视图字段之间的映射。在图
    2-10 中，`信息对象 1`映射到`计算视图 1`，并包含三个属性：`信息对象 2`、`信息对象 4`和`信息对象 5`。`信息对象 2`也是虚拟的，从`计算视图
    2`查询数据。`信息对象 4`是标准 SAP 主数据对象，而`信息对象 5`是仅属性对象。如果性能不足，我们可以通过将维度计算视图的输出加载到新的`信息对象`中，创建持久化主数据模型。这样，我们可以为外部系统创建一个遵循传统`BW/4HANA`模型架构的数据模型（图
    2-2）。唯一的区别在于数据源来自外部系统而非 SAP。


    采用此架构时，需要意识到我们将失去`开放 ODS 视图`对象和基于字段方法所提供的所有灵活性。`信息对象`无法利用基于字段的建模，这意味着每个属性都必须使用`信息对象`。原则上，在满足以下条件时，应考虑为外部数据模型使用`信息对象`：


    - 源数据模型具有稳定且不易变化的结构。

    - 在试点阶段，您创建了一个经过测试的基于字段的模型，下一步希望将其转换为遵循经典`BW/4HANA`建模概念的结构化模型。

    - 需要利用`开放 ODS 视图`或字段所不具备的功能。在这种情况下，可为这些特定维度使用“虚拟”`信息对象`（例如，当需要层级结构时）。


    **最佳实践**


    当数据模型完全基于虚拟表时，性能可能不足（基于 HANA 物理表的模型性能更优）。如果源模型包含大型事实表和多个维度表，则需要数据持久化。


    图 2-11 展示了使用持久化`信息对象`的混合数据模型架构。


    ![../images/508424_1_En_2_Chapter/508424_1_En_2_Fig11_HTML.jpg](img/508424_1_En_2_Fig11_HTML.jpg)


    **图 2-11.** 采用持久化`信息对象`的 BW/4HANA 混合数据模型


    图 2-11 所示的架构与经典建模概念（图 2-2）类似。区别在于自定义`信息对象`（`信息对象 1`和`信息对象 2`）加载的是来自外部系统而非 SAP
    系统的数据。采用这种方法，外部主数据可以充分利用`信息对象`的所有功能，且性能不会受到影响。另一方面，开发和维护的工作量会更高。分析图 2-11 所示架构时，您可能会问：为何不直接将非
    SAP 数据加载到现有的 SAP 数据模型结构中，而要创建一个新模型？


    您可能正在考虑图 2-12 所示的方法。


    ![../images/508424_1_En_2_Chapter/508424_1_En_2_Fig12_HTML.jpg](img/508424_1_En_2_Fig12_HTML.jpg)


    **图 2-12.** 将非 SAP 数据加载到 SAP 数据模型的 BW/4HANA 示意图


    将外部数据纳入现有 SAP 数据模型的方法存在以下限制：


    - 外部维度和属性的数据类型可能与目标`信息对象`的数据类型不一致，导致无法加载数据。

    - 外部维度和属性的数据长度可能与目标`信息对象`的数据长度不一致，导致无法加载数据。

    - 由于数据建模方法不同，以及特定于数据库技术的键、关系和数据类型定义不同，几乎不可能将所有非 SAP 维度及其属性纳入 SAP 模型。

    - 即使源数据类型与`信息对象`数据类型匹配，底层非 SAP 维度表也可能包含与现有 SAP `信息对象`键相同的主键值。若维护不当，外部数据可能覆盖 SAP
    主数据，从而在全球范围内引发大量报表问题。

    - 源数据中任何不符合`信息对象`定义的微小偏差都将导致数据加载失败。

    - 不应允许所有用户查看非 SAP 数据，因此安全模型可能变得非常复杂。

    - 集成过程中，现有全球报表解决方案面临受负面影响的巨大风险。


    鉴于上述限制和劣势，可以说没有简单的方法将外部数据集成到现有 SAP 数据仓库中。尽管如此，我们可以创建一个新的数据模型来合并 SAP 和非 SAP 数据。

    '
- fmt: '### Combined Data Models (SAP and Non-SAP Data)


    In scenarios where we want to combine SAP and non-SAP data into a single data
    model, by leveraging virtualization capabilities we can avoid data redundancy
    (meaning storing the same SAP data twice in both models). Having in mind all the
    functionalities available in `BW/4HANA`, creating a combined model could follow
    multiple different approaches. Figure [2-13](#508424_1_En_2_Chapter.xhtml#Fig13)
    shows one of the approaches for integrating SAP and non-SAP data into a single
    model.


    ![../images/508424_1_En_2_Chapter/508424_1_En_2_Fig13_HTML.jpg](images/508424_1_En_2_Chapter/508424_1_En_2_Fig13_HTML.jpg)


    **Figure 2-13.** `BW/4HANA` integration of SAP and non-SAP master data into the
    new model


    Figure [2-13](#508424_1_En_2_Chapter.xhtml#Fig13) shows the architecture for creating
    a master data object that combines data from SAP and non-SAP dimensions. The diagram
    highlights three sections with SAP, non-SAP, and combined master data. For non-SAP
    data, there is a `Master Data ADSO` as the persistent layer created. As you might
    already know, `BW/4HANA` gives the ability to autogenerate an external SAP HANA
    view out of modeling objects. This functionality is leveraged in this approach.
    Out of the `Master Data ADSO`, there is an external calculation view generated.
    The same functionality is used for the SAP master data, meaning that for SAP `InfoObject`,
    an external calculation view is also generated. Once we have both datasets available
    on the HANA platform in the form of external calculation views, we can combine
    them into single dimension view. As shown in Figure [2-13](#508424_1_En_2_Chapter.xhtml#Fig13),
    on top of two external views, there is an additional calculation view created.
    The purpose of that view is to union SAP and non-SAP data.


    **Note**


    You can avoid creating a persistent master data `ADSO` for non-SAP data and combine
    an external view generated from an `InfoObject` with the virtual table directly.
    This approach, however, will have a negative impact on the data model''s performance.


    Of course, when combining SAP and non-SAP data, some of the attributes may be
    available only for SAP, while others are for only non-SAP sources. To mitigate
    user confusion, if an attribute value is missing or it’s just not available for
    a specific record, it would be good to include in the data model field for indicating
    the source system for each record. In a combined calculation view, you will be
    able to apply additional data manipulations to unify both datasets as much as
    possible. In addition, before being able to apply mapping in calculation view
    union node, it is likely that you will need to convert values to the common data
    types first. Once you have your combined master data properly shaped, you will
    be able to consume the final master data view either with a `master data Open
    ODS View` or with an `InfoObject of SAP HANA View access type` (depending on the
    approach).


    Following the approach for integrating master data, we can apply the same architecture
    for the fact data. Figure [2-14](#508424_1_En_2_Chapter.xhtml#Fig14) depicts the
    architecture of integrating SAP and non-SAP data into the new `BW/4HANA` model.


    ![../images/508424_1_En_2_Chapter/508424_1_En_2_Fig14_HTML.jpg](images/508424_1_En_2_Chapter/508424_1_En_2_Fig14_HTML.jpg)


    **Figure 2-14.** `BW/4HANA` integration of SAP and non-SAP data into a new model


    The architecture for integrating the fact data follows the same approach as the
    integration of the master data. The difference is that the external calculation
    views are generated from fact `ADSOs` (both for SAP and for non-SAP data). External
    calculation views generated out of `ADSOs` are combined with the union operator
    within the calculation view created on top. The final calculation view with the
    combined fact data will be later consumed by the `Facts Open ODS View`. As shown
    in Figure [2-14](#508424_1_En_2_Chapter.xhtml#Fig14), in the `Open ODS View` object,
    the fields derived from the underlying calculation view are associated with the
    combined Master Data objects (described in Figure [2-13](#508424_1_En_2_Chapter.xhtml#Fig13)).
    Depending on the chosen approach, the fields can be mapped to `Master Data Open
    ODS Views` or "virtual" `InfoObjects`. Some of the fields can be also kept without
    any associations. The `CompositeProvider` created on top of the `Facts Open ODS
    View` can be later consumed with the final query.


    As you can see, there are many possible modeling concepts, and depending on the
    requirements, you need to choose the most appropriate approach. Remember that
    the architectures described in this chapter are not the only possible variants.
    There are many more architectures that could be designed. `BW/4HANA` simplifies
    modeling by limiting the number of objects and layers, but with all the new features
    and functionalities it enables much more possible modeling approaches; hence,
    choosing the most appropriate architecture for a given scenario can be really
    challenging. The keys for designing the right model are deep requirements and
    data model analysis, timeline for project delivery, and developer experience.'
