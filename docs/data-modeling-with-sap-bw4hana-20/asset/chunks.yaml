    Price field. Click the PRICE field to display the Field Settings section (Figure
    [4-12](#508424_1_En_4_Chapter.xhtml#Fig12)).


    ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig12_HTML.jpg](images/508424_1_En_4_Chapter/508424_1_En_4_Fig12_HTML.jpg)


    Figure 4-12.


    Assigning the Currency element for the Price field in the ZDIM01 Open ODS View


    When you open the Currency / Unit Element drop-down, in the list you will see
    the fields that are available under the Currency folder. In my case, there will
    be only one column (CURRENCY). I will use that column as a currency element (Figure
    [4-12](#508424_1_En_4_Chapter.xhtml#Fig12)).


    After applying these two changes, let’s again execute the ZDIM01 object in Analysis
    for Microsoft Excel to validate the output. Figure [4-13](#508424_1_En_4_Chapter.xhtml#Fig13)
    presents the output of the updated ZDIM01 object.


    ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig13_HTML.jpg](images/508424_1_En_4_Chapter/508424_1_En_4_Fig13_HTML.jpg)


    Figure 4-13.


    Final output of ZDIM01 in Analysis for Microsoft Excel


    This time by choosing the Key and Text options for the Category field, we are
    able to see both keys and texts. All the Open ODS View field technical names start
    with the 2F string. By default, the remaining part of the technical field name
    is generated as a concatenation of the Open ODS View name and the field name (i.e.,
    2FZDIM01-BRAND_DESC). In our example, the exceptions are the Product and Category
    fields.


    The name generated for fields that are assigned to the Representative Key Field
    group contain only the Open ODS View name. The Product field was set as the Representative
    Key field (see Figure [4-9](#508424_1_En_4_Chapter.xhtml#Fig9)); hence, its technical
    name is shown as 2FZDIM01 (Figure [4-13](#508424_1_En_4_Chapter.xhtml#Fig13)).


    The Category field has associations to the ZTXT02 Open ODS View; hence, its name
    is inherited from that object. If we would like to keep the same naming convention
    as for other fields (2F<Open ODS View name>_<field name>), we should switch the
    selection from Direct Usage of Associated Object by Name to Usage of System-Wide
    Unique Name (Figure [4-11](#508424_1_En_4_Chapter.xhtml#Fig11)).


    The second change that was implemented for the ZDIM01 Open ODS View refers to
    the Price field. The adjustment is also now reflected in the output shown in Figure
    [4-13](#508424_1_En_4_Chapter.xhtml#Fig13). You can see that each value displayed
    in the Price column now has the currency code assigned.'
  trans: '

    # 创建主数据开放 ODS 视图


    第三个开放 ODS 视图将基于从`PRODUCTS`表获取数据的`CV_DIM_PRODUCTS`视图。与前两个表不同，`PRODUCTS`表除了键列和文本列之外，还包含**品牌**和**价格**等其他属性。因此，在创建产品开放
    ODS 视图时，我们应选择**主数据**作为语义类型。图 4-9 展示了产品开放 ODS 视图的输出结构。


    ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig9_HTML.jpg](img/508424_1_En_4_Fig9_HTML.jpg)


    图 4-9. 产品开放 ODS 视图(`ZDIM01`)的初始输出结构


    在图 4-9 中，你可以看到来自`CV_DIM_PRODUCTS`计算视图的源字段（源字段部分）是如何分配到多个文件夹（视图字段部分）中的。


    - `PRODUCTS`表的主键由两列组成：`PRODUCT_ID`和`CATEGORY_ID`。开放 ODS 视图支持对无法基于单个字段唯一定义的对象进行复合功能。如图
    4-9 所示，`PRODUCT_ID`被分配到代表性键字段(1)文件夹。


    - 主键中的第二列（`CATEGORY_ID`）已被添加到特性（键）(2)文件夹下。此分配的目的类似于标准信息对象可用的复合功能。


    - 在特性(3)文件夹下，你可能会找到`BRAND_DESC`列。属于此部分的列是开放 ODS 视图主数据对象的属性。


    - 关键指标(4)部分包含数值数据类型的属性。对于`ZDIM01`开放 ODS 视图，`PRICE`列被添加到了此部分。


    - 对于货币和单位相关的列，开放 ODS 视图输出结构中还有一个专用文件夹。在给定场景中，我将`CURRENCY`列分配到了货币(5)文件夹。


    **注意**


    在开放 ODS 视图中使用来自外部数据的货币或单位时，你需要了解 BW/4HANA 期望所有这些值都维护在中央 SAP 货币和单位表中。标准 SAP 表中不存在的货币/单位值的记录将不被支持。


    - 产品描述列（`PRODUCT_DESC`）已被拖拽到长文本(6)文件夹。这是因为`PRODUCT_DESC`列长度为 200 个字符。


    图 4-10 展示了产品开放 ODS 视图的初始输出。


    ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig10_HTML.jpg](img/508424_1_En_4_Fig10_HTML.jpg)


    图 4-10. `ZDIM01`在 Microsoft Excel 分析中的初始输出


    产品开放 ODS 视图的输出包含源自`CV_DIM_PRODUCTS`计算视图的所有列。值得注意的是，产品字段的键值由产品 ID 和类别 ID 组成（例如，`0001/AC003`）。这是因为我们将`CATEGORY_ID`列添加到了特性（键）部分（见图
    4-9）。


    我们可以实施两项小的调整，为产品维度提供更多信息。首先，类别字段显示的是 ID 值，因此用户不知道实际的类别值是什么。此外，价格字段显示的数字没有货币代码（货币代码显示为单独的列）。现在让我们切换回
    BW 建模工具。如你所记，我们为类别数据创建了`ZTXT02`文本开放 ODS 视图（图 4-7）。该对象包含类别 ID 与类别名称之间的映射关系。现在，我们可以通过在产品开放
    ODS 视图输出结构中向该对象应用关联来利用`ZTXT02`开放 ODS 视图。图 4-10 说明了如何定义类别字段与`ZTXT02`开放 ODS 视图之间的关联。


    ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig11_HTML.jpg](img/508424_1_En_4_Fig11_HTML.jpg)


    图 4-11. `ZDIM01`开放 ODS 视图中类别字段的关联


    要定义字段与开放 ODS 视图对象之间的关联，请从视图字段部分选择目标字段。在右侧窗格中，选择关联类型为开放 ODS 视图。然后浏览要分配给该特定字段的开放
    ODS 视图的名称。如果要继承关联对象的技术名称，请选择**按名称直接使用关联对象**选项。在所示示例中（图 4-11），我将`ZTXT02`开放 ODS
    视图分配给了`CATEGORY_ID`字段，并选择了按名称使用关联对象的选项。定义关联后，在视图字段部分中，你将在字段名称旁边找到有关关联对象的信息（开放
    ODS 视图图标及其技术名称）。


    我想应用的第二个调整是为价格字段分配货币。点击`PRICE`字段以显示字段设置部分（图 4-12）。


    ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig12_HTML.jpg](img/508424_1_En_4_Fig12_HTML.jpg)


    图 4-12. 为`ZDIM01`开放 ODS 视图中的价格字段分配货币元素


    当你打开货币/单位元素下拉列表时，列表中会看到货币文件夹下可用的字段。在我的案例中，只有一列（`CURRENCY`）。我将使用该列作为货币元素（图 4-12）。


    应用这两项更改后，让我们再次在 Microsoft Excel 分析中执行`ZDIM01`对象以验证输出。图 4-13 展示了更新后的`ZDIM01`对象的输出。


    ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig13_HTML.jpg](img/508424_1_En_4_Fig13_HTML.jpg)


    图 4-13. `ZDIM01`在 Microsoft Excel 分析中的最终输出


    这次通过为类别字段选择键和文本选项，我们能够同时看到键和文本。所有开放 ODS 视图字段的技术名称都以`2F`字符串开头。默认情况下，技术字段名称的其余部分是通过连接开放
    ODS 视图名称和字段名称生成的（例如，`2FZDIM01-BRAND_DESC`）。在我们的示例中，产品和类别字段是例外。


    分配给代表性键字段组的字段生成的名称仅包含开放 ODS 视图名称。产品字段被设置为代表性键字段（见图 4-9）；因此，其技术名称显示为`2FZDIM01`（图
    4-13）。


    类别字段与`ZTXT02`开放 ODS 视图有关联；因此，其名称继承自该对象。如果我们希望保持与其他字段相同的命名约定（`2F<开放 ODS 视图名称>_<字段名称>`），我们应该将选择从**按名称直接使用关联对象**切换为**使用系统级唯一名称**（图
    4-11）。


    为`ZDIM01`开放 ODS 视图实施的第二项更改涉及价格字段。该调整现在也反映在图 4-13 所示的输出中。你可以看到，价格列中显示的每个值现在都已分配了货币代码。

