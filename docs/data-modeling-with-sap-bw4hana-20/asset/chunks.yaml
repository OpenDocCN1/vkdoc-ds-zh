    levels.'
  trans: '

    # 将虚拟模型转换为持久化结构


    开放式 ODS 视图提供了将源结构（如远程表）转换为 BW/4HANA 持久化对象的功能。将虚拟模型切换为持久化数据存储的驱动力通常是性能。如果模型完全基于虚拟
    HANA 表，查询性能将受到明显影响。此外，当依赖驻留在外部系统上的数据时，确保虚拟模型的稳定性可能是一个挑战。在源系统停机期间，通过 BW 模型公开的外部数据将完全无法访问。为避免这种情况，您可能更倾向于将源数据加载到
    BW 对象中，这样，在连接或外部系统出现任何停机时，模型仍能返回上次成功加载请求之前的所有数据。


    此外，当您想要将外部表与各种 BW 对象结合使用时，由于复杂操作的数量和数据量，实时运行查询可能需要一些时间。需要支持基于时间的数据快照的场景也无法通过使用虚拟方法来维护。


    对于此类场景，开放式 ODS 框架支持从虚拟模型切换到持久化结构的功能。这种方法有助于解决与性能相关的问题。转换可以针对每个开放式 ODS 视图独立进行，因此您可以决定要为哪个开放式
    ODS 视图持久化数据。值得一提的是，即使您已经构建了虚拟模型，也可以生成持久化层，而无需重建开放式 ODS 视图以及在其之上已创建的其他对象（例如 `CompositeProviders`
    和/或查询）。得益于此，您可以使用迭代方法实施数据模型，从完全虚拟的结构开始，进行第一轮单元测试，之后选择需要生成数据存储以提高性能或捕获数据快照的虚拟对象。


    正如第一章所述，开放式 ODS 视图是虚拟建模对象，因此它们不存储任何数据。但是，它们使我们能够生成基于 ADSO 的数据结构，包括传输数据所需的所有必要
    BW/4HANA 对象，例如数据源、转换和 DTP 对象。为了演示从虚拟结构到持久化对象的转换，我将使用 `ZFCT01` 开放式 ODS 视图作为参考。图
    4-25 描绘了订单开放式 ODS 视图从虚拟数据结构切换到持久化数据结构的概览。


    ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig25_HTML.jpg](img/508424_1_En_4_Fig25_HTML.jpg)


    *图 4-25. 将订单开放式 ODS 视图从虚拟结构转换为持久化结构*


    如图 4-25 所示，在虚拟方法中，订单数据直接从底层的计算视图中查询。我们的目标是转换当前的数据流以利用持久化结构。


    开放式 ODS 视图提供了 `生成数据流` 功能，这使得此转换易于实现。如图 4-25 所示，在 BW/4HANA 端，我们将生成一些额外的对象。这些对象是数据源、转换和
    DTP，最后是存储实际数据的高级 DSO。


    要开始转换数据流，请打开开放式 ODS 视图对象，并在编辑器的“常规”选项卡中单击 `生成数据流` 按钮（图 4-26）。


    ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig26_HTML.jpg](img/508424_1_En_4_Fig26_HTML.jpg)


    *图 4-26. 为 ZFCT01 开放式 ODS 视图生成数据源*


    `生成数据流` 按钮将适用于所有开放式 ODS 视图语义类型（事实、主数据和文本），因此根据您的需求，您也可以为其他开放式 ODS 视图对象生成持久化层。单击此按钮后，Eclipse
    将打开一个窗口，用于提供数据源对象的名称。继续操作后，将自动创建具有给定名称的新数据源。您会注意到，在给定的订单数据开放式 ODS 视图的语义部分，新的 `ZDS_FACT_ORDERS`
    BW 数据源取代了之前的 `CV_FACT_ORDERS` 计算视图（图 4-26）。创建的数据源将从 `CV_FACT_ORDERS` 视图中提取数据，其结构与该计算视图的结构相对应。计算视图字段的数据类型将转换为
    SAP BW/4HANA 数据类型（参见图 4-27）。


    ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig27_HTML.jpg](img/508424_1_En_4_Fig27_HTML.jpg)


    *图 4-27. ZDS_FACT_ORDERS 的输出结构*


    现在我们已经创建了一个数据源对象，下一步我将生成一个 ADSO 以及转换和 DTP 对象。ADSO 将作为存储底层计算视图输出的目标对象。再次单击 `生成数据流`
    按钮以创建一个 ADSO（图 4-28）。


    ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig28_HTML.jpg](img/508424_1_En_4_Fig28_HTML.jpg)


    *图 4-28. 为 ZFCT01 开放式 ODS 视图对象生成一个 ADSO*


    与上一步类似，单击按钮后，会弹出一个新窗口。这次我们需要提供目标 ADSO 的名称，我们将向其加载订单数据。继续操作后，系统将创建一个新的 ADSO 对象。此对象现在将用作
    `ZFCT01` 开放式 ODS 视图的源，取代之前的 `ZDS_FACT_ORDERS` 数据源。您现在可以激活 `ZFCT01` 开放式 ODS 视图。


    ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig29_HTML.jpg](img/508424_1_En_4_Fig29_HTML.jpg)


    *图 4-29. 为订单数据持久化结构生成的对象概览*


    如图 4-29 所示，在项目资源管理器中，您可以看到除了 `ZSTG01` ADSO 对象之外，系统还自动生成了转换和 DTP。默认情况下，系统会创建具有暂存数据存储对象类型并选中
    `压缩数据` 选项的 ADSO（有关 ADSO 类型的详细信息，请查看第 1 章）。如果需要，您可以根据要求手动调整 ADSO 设置。生成的 ADSO 的输出结构与底层
    `ZDS_FACT_ORDERS` 数据源的结构相对应（图 4-30）。


    ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig30_HTML.jpg](img/508424_1_En_4_Fig30_HTML.jpg)


    *图 4-30. ZSTG01 ADSO 的输出结构*


    在生成 ADSO 时，系统将根据分配给特性（键）文件夹的 `ZFCT01` 开放式 ODS 视图字段，自动识别关键字段（图 4-15）。


    完成所有必要的 BW/4HANA 对象生成后，当尝试执行现有的 `ZCPFCT01_Q01` 查询时，最初将找不到可用的数据。要使数据可用，您需要首先通过执行图
    4-29 中所示的数据传输过程，将计算视图的输出加载到 ADSO 中。当您将数据加载到 ADSO 时，无需在 `CompositeProvider` 和查询级别应用任何其他更改。

    '
- fmt: "## Summary\n\nIn this chapter, I walked through a scenario where the goal\
    \ was to create a BW/4HANA Orders data model that corresponds to a source relational\
    \ data model. At first I implemented the virtual calculation view layer on the\
    \ HANA side. Although it is possible to build such a model directly on tables,\
    \ the calculation view layer gives more flexibility if we need additional data\
    \ manipulation on the source data.\n\nBy consuming these views, I was able to\
    \ implement a fully virtual data model in the BW/4HANA system. The purpose of\
    \ the underlying source object determined the type of Open ODS View that I used.\
    \ To create a model, I took advantage of all three available types of Open ODS\
    \ Views. These types are Texts, Master Data, and Facts. The virtual model was\
    \ later consumed by the `CompositeProvider` and the final Query object.\n\nAt\
    \ the end, I demonstrated how a virtual model can be easily converted into a persistent\
    \ structure, without impacting any objects created on top of that model. The examples\
    \ helped you understand what the limitations of the fully virtual models are and\
    \ what scenarios enforce us to consider converting virtual models into persistent\
    \ structures.\n\n# 5. Creating a Hybrid Data Model\n\nIn the previous chapter,\
    \ we created a field-based data model, which was constructed based on Open ODS\
    \ View objects. As a next step, I will guide you through a scenario where we will\
    \ be mixing the field-based approach with regular InfoObjects to implement a hybrid\
    \ data model. I will highlight the benefits as well as the limitations and disadvantages\
    \ of the hybrid modeling approach.\n\n## Scenario\n\nThe next requirement for\
    \ the Orders data model is to enhance it with additional attributes. This time,\
    \ the business user asked to have the ability to utilize the master data of existing\
    \ SAP InfoObjects. There are two InfoObjects that should be incorporated into\
    \ the existing data model:\n\n- `0CALDAY` (Calendar Day): This is a standard SAP\
    \ InfoObject containing time-related attributes and hierarchies. The user wants\
    \ to be able to take advantage of the `0CALDAY` master data for the Document Date\
    \ column, which currently displays only date values.\n- `ZBW4CUST` (Customer):\
    \ This is a custom SAP InfoObject containing customer information. The master\
    \ data of `ZBW4CUST` will not cover all the customer numbers that are available\
    \ in the external data model. Business users want to have the ability to utilize\
    \ customer attributes for customer numbers that are common. For those customers,\
    \ which are not available in the `ZBW4CUST` object, the attributes will not be\
    \ maintained and should be kept blank. The Customer InfoObject contains these\
    \ three navigation attributes:\n  - `ZBW4ADDR` (address)\n  - `ZBW4STAT` (state)\n\
    \  - `ZBW4COMP` (company name)\n\nFigure [5-1](#508424_1_En_5_Chapter.xhtml#Fig1)\
    \ presents the content and attributes of the Customer InfoObject.\n\n![../images/508424_1_En_5_Chapter/508424_1_En_5_Fig1_HTML.jpg](images/508424_1_En_5_Chapter/508424_1_En_5_Fig1_HTML.jpg)\n\
    \n*Figure 5-1. Content of the Customer InfoObject*\n\nAs shown in Figure [5-1](#508424_1_En_5_Chapter.xhtml#Fig1),\
    \ the master data of the Customer InfoObjects contains only three customer numbers.\
    \ Customers 0100000014 and 0100000015, which are available in the external `ORDER_HEADER`\
    \ table, are not part of this InfoObject.\n\nTo achieve the requested functionality,\
    \ I will follow the hybrid modeling approach. Figure [5-2](#508424_1_En_5_Chapter.xhtml#Fig2)\
    \ depicts how the existing model will be extended to fulfill the business requirements.\n\
    \n![../images/508424_1_En_5_Chapter/508424_1_En_5_Fig2_HTML.jpg](images/508424_1_En_5_Chapter/508424_1_En_5_Fig2_HTML.jpg)\n\
    \n*Figure 5-2. Hybrid data model for the Orders data*\n\nAs shown in Figure [5-2](#508424_1_En_5_Chapter.xhtml#Fig2),\
    \ to fulfill the business needs, we will enhance the existing Orders data model\
    \ by applying additional associations to InfoObjects. This way, we will be able\
    \ to take advantage of that master data that is available in SAP InfoObjects.\n\
    \n## Defining Associations with the `0CALDAY` InfoObject\n\nThe first business\
    \ requirement is to include a time dimension in the existing data model for the\
    \ Document Date column. Users requested the ability for additional time attributes\
    \ for this column, such as calendar year, quarter, month, and week. In addition,\
    \ users wanted to take advantage of time hierarchies. To achieve that, we can\
    \ incorporate an `0CALDAY` standard InfoObject into the Orders data model. This\
    \ InfoObject already contains all the required functionalities.\n\nIn the previous\
    \ chapter, I demonstrated how to use association functionality to assign master\
    \ data Open ODS Views to the fields of the Fact Open ODS View. In the current\
    \ scenario, we will be using the same functionality, but instead of associating\
    \ with the master data Open ODS Views, we will use InfoObjects instead. With this\
    \ functionality, all the properties of the associated InfoObjects will be inherited\
    \ in the output field; hence, users will have enhanced reporting capabilities.\
    \ Figure [5-3](#508424_1_En_5_Chapter.xhtml#Fig3) shows the steps to apply an\
    \ association between the `0DOC_DATE` field and the `0CALDAY` InfoObject for the\
    \ orders data (`ZFCT01`) Open ODS View.\n\n![../images/508424_1_En_5_Chapter/508424_1_En_5_Fig3_HTML.jpg](images/508424_1_En_5_Chapter/508424_1_En_5_Fig3_HTML.jpg)\n\
    \n*Figure 5-3. Association for the Document Date field in the `ZFCT01` Open ODS\
    \ View object*\n\nTo apply an association between the output field and the InfoObject,\
    \ select the target field from the View Fields section. From the right pane, click\
    \ the Browse (2) button. This will open a window where you can search (3) for\
    \ the target InfoObject, which you want to use for the association. When you find\
    \ the target InfoObject, select it (4) and click OK (5). Once you have applied\
    \ the associations, you can specify the navigation attributes that you want to\
    \ enable from the associated InfoObject for the reporting.\n\nAs shown in Figure\
    \ [5-4](#508424_1_En_5_Chapter.xhtml#Fig4), for the `DOC_DATE` column I selected\
    \ three navigation attributes that are coming from the associated `0CALDAY` InfoObject.\
    \ These attributes are `0CALMONTH`, `0CALYEAR`, and `0CALWEEK`. In the Local Description\
    \ column, you can provide your description for navigation attributes. It can help\
    \ you to easily identify the referenced field.\n\n![../images/508424_1_En_5_Chapter/508424_1_En_5_Fig4_HTML.jpg](images/508424_1_En_5_Chapter/508424_1_En_5_Fig4_HTML.jpg)\n\
    \n*Figure 5-4. Adding `0CALDAY` navigation attributes for the `ZFCT01` Open ODS\
    \ View object*\n\nFigure [5-5](#508424_1_En_5_Chapter.xhtml#Fig5) presents the\
    \ target configuration for the Document Date column.\n\n![../images/508424_1_En_5_Chapter/508424_1_En_5_Fig5_HTML.jpg](images/508424_1_En_5_Chapter/508424_1_En_5_Fig5_HTML.jpg)\n\
    \n*Figure 5-5. `0CALDAY` navigation attributes in the `ZFCT01` Open ODS View object*\n\
    \nThe Document Date column now has three additional navigation attributes.\n\n\
    > **Note:** Optionally, the assignment between the field and InfoObject could\
    \ be applied directly on the `CompositeProvider` level. Also, navigation attributes\
    \ can be enabled directly there.\n\nOnce we apply the association, we can go to\
    \ the `CompositeProvider` configuration. Since for the fact Open ODS View I used\
    \ a direct association for the field `DOC_DATE`, its technical name has changed,\
    \ and we need adjust the mapping in the `ZCPFCT01` `CompositeProvider` (unless\
    \ we created a new `CompositeProvider`). In addition, we want to add new navigation\
    \ attributes to the output structure of the `CompositeProvider` for the Orders\
    \ data."
  raw: "## Summary\n\nIn this chapter, I walked through a scenario where the goal\
    \ was to create a BW/4HANA Orders data model that corresponds to a source relational\
    \ data model. At first I implemented the virtual calculation view layer on the\
    \ HANA side. Although it is possible to build such a model directly on tables,\
    \ the calculation view layer gives more flexibility if we need additional data\
    \ manipulation on the source data.\n\nBy consuming these views, I was able to\
    \ implement a fully virtual data model in the BW/4HANA system. The purpose of\
    \ the underlying source object determined the type of Open ODS View that I used.\
    \ To create a model, I took advantage of all three available types of Open ODS\
    \ Views. These types are Texts, Master Data, and Facts. The virtual model was\
    \ later consumed by the CompositeProvider and the final Query object.\n\nAt the\
    \ end, I demonstrated how a virtual model can be easily converted into a persistent\
    \ structure, without impacting any objects created on top of that model. The examples\
    \ helped you understand what the limitations of the fully virtual models are and\
    \ what scenarios enforce us to consider converting virtual models into persistent\
    \ structures.\n\n# 5. Creating a Hybrid Data Model\n\nIn the previous chapter,\
    \ we created a field-based data model, which was constructed based on Open ODS\
    \ View objects. As a next step, I will guide you through a scenario where we will\
    \ be mixing the field-based approach with regular InfoObjects to implement a hybrid\
    \ data model. I will highlight the benefits as well as the limitations and disadvantages\
    \ of the hybrid modeling approach.\n\n## Scenario\n\nThe next requirement for\
    \ the Orders data model is to enhance it with additional attributes. This time,\
    \ the business user asked to have the ability to utilize the master data of existing\
    \ SAP InfoObjects. There are two InfoObjects that should be incorporated into\
    \ the existing data model:\n\n*   *0CALDAY (Calendar Day)*: This is a standard\
    \ SAP InfoObject containing time-related attributes and hierarchies. The user\
    \ wants to be able to take advantage of the 0CALDAY master data for the Document\
    \ Date column, which currently displays only date values.\n\n*   *ZBW4CUST (Customer)*:\
    \ This is a custom SAP InfoObject containing customer information. The master\
    \ data of ZBW4CUST will not cover all the customer numbers that are available\
    \ in the external data model. Business users want to have the ability to utilize\
    \ customer attributes for customer numbers that are common. For those customers,\
    \ which are not available in the ZBW4CUST object, the attributes will not be maintained\
    \ and should be kept blank. The Customer InfoObject contains these three navigation\
    \ attributes:\n    *   ZBW4ADDR (address)\n\n    *   ZBW4STAT (state)\n\n    *\
    \   ZBW4COMP (company name)\n\n        Figure [5-1](#508424_1_En_5_Chapter.xhtml#Fig1)\
    \ presents the content and attributes of the Customer InfoObject.\n\n    ![../images/508424_1_En_5_Chapter/508424_1_En_5_Fig1_HTML.jpg](images/508424_1_En_5_Chapter/508424_1_En_5_Fig1_HTML.jpg)\n\
    \n    Figure 5-1.\n\n    Content of the Customer InfoObject\n\n    As shown in\
    \ Figure [5-1](#508424_1_En_5_Chapter.xhtml#Fig1), the master data of the Customer\
    \ InfoObjects contains only three customer numbers. Customers 0100000014 and 0100000015,\
    \ which are available in the external ORDER_HEADER table, are not part of this\
    \ InfoObject.\n\nTo achieve the requested functionality, I will follow the hybrid\
    \ modeling approach. Figure [5-2](#508424_1_En_5_Chapter.xhtml#Fig2) depicts how\
    \ the existing model will be extended to fulfill the business requirements.\n\n\
    ![../images/508424_1_En_5_Chapter/508424_1_En_5_Fig2_HTML.jpg](images/508424_1_En_5_Chapter/508424_1_En_5_Fig2_HTML.jpg)\n\
    \nFigure 5-2.\n\nHybrid data model for the Orders data\n\nAs shown in Figure [5-2](#508424_1_En_5_Chapter.xhtml#Fig2),\
    \ to fulfill the business needs, we will enhance the existing Orders data model\
    \ by applying additional associations to InfoObjects. This way, we will be able\
    \ to take advantage of that master data that is available in SAP InfoObjects.\n\
    \n## Defining Associations with the 0CALDAY InfoObject\n\nThe first business requirement\
    \ is to include a time dimension in the existing data model for the Document Date\
    \ column. Users requested the ability for additional time attributes for this\
    \ column, such as calendar year, quarter, month, and week. In addition, users\
    \ wanted to take advantage of time hierarchies. To achieve that, we can incorporate\
    \ an 0CALDAY standard InfoObject into the Orders data model. This InfoObject already\
    \ contains all the required functionalities.\n\nIn the previous chapter, I demonstrated\
    \ how to use association functionality to assign master data Open ODS Views to\
    \ the fields of the Fact Open ODS View. In the current scenario, we will be using\
    \ the same functionality, but instead of associating with the master data Open\
    \ ODS Views, we will use InfoObjects instead. With this functionality, all the\
    \ properties of the associated InfoObjects will be inherited in the output field;\
    \ hence, users will have enhanced reporting capabilities. Figure [5-3](#508424_1_En_5_Chapter.xhtml#Fig3)\
    \ shows the steps to apply an association between the 0DOC_DATE field and the\
    \ 0CALDAY InfoObject for the orders data (ZFCT01) Open ODS View.\n\n![../images/508424_1_En_5_Chapter/508424_1_En_5_Fig3_HTML.jpg](images/508424_1_En_5_Chapter/508424_1_En_5_Fig3_HTML.jpg)\n\
    \nFigure 5-3.\n\nAssociation for the Document Date field in the ZFCT01 Open ODS\
    \ View object\n\nTo apply an association between the output field and the InfoObject,\
    \ select the target field from the View Fields section. From the right pane, click\
    \ the Browse (2) button. This will open a window where you can search (3) for\
    \ the target InfoObject, which you want to use for the association. When you find\
    \ the target InfoObject, select it (4) and click OK (5). Once you have applied\
    \ the associations, you can specify the navigation attributes that you want to\
    \ enable from the associated InfoObject for the reporting.\n\nAs shown in Figure\
    \ [5-4](#508424_1_En_5_Chapter.xhtml#Fig4), for the DOC_DATE column I selected\
    \ three navigation attributes that are coming from the associated 0CALDAY InfoObject.\
    \ These attributes are 0CALMONTH, 0CALYEAR, and 0CALWEEK. In the Local Description\
    \ column, you can provide your description for navigation attributes. It can help\
    \ you to easily identify the referenced field.\n\n![../images/508424_1_En_5_Chapter/508424_1_En_5_Fig4_HTML.jpg](images/508424_1_En_5_Chapter/508424_1_En_5_Fig4_HTML.jpg)\n\
    \nFigure 5-4.\n\nAdding 0CALDAY navigation attributes for the ZFCT01 Open ODS\
    \ View object\n\nFigure [5-5](#508424_1_En_5_Chapter.xhtml#Fig5) presents the\
    \ target configuration for the Document Date column.\n\n![../images/508424_1_En_5_Chapter/508424_1_En_5_Fig5_HTML.jpg](images/508424_1_En_5_Chapter/508424_1_En_5_Fig5_HTML.jpg)\n\
    \nFigure 5-5.\n\n0CALDAY navigation attributes in the ZFCT01 Open ODS View object\n\
    \nThe Document Date column now has three additional navigation attributes.\n\n\
    Note\n\nOptionally, the assignment between the field and InfoObject could be applied\
    \ directly on the CompositeProvider level. Also, navigation attributes can be\
    \ enabled directly there.\n\nOnce we apply the association, we can go to the CompositeProvider\
    \ configuration. Since for the fact Open ODS View I used a direct association\
    \ for the field DOC_DATE, its technical name has changed, and we need adjust the\
    \ mapping in the ZCPFCT01 CompositeProvider (unless we created a new CompositeProvider).\
    \ In addition, we want to add new navigation attributes to the output structure\
    \ of the CompositeProvider for the Orders data."
  trans: "\n## 总结\n\n在本章中，我介绍了一个场景，其目标是创建一个与源关系数据模型相对应的 BW/4HANA 订单数据模型。我首先在 HANA\
    \ 端实现了虚拟计算视图层。虽然可以直接在表上构建此类模型，但如果需要对源数据进行额外的数据处理，计算视图层则提供了更高的灵活性。\n\n通过使用这些视图，我得以在\
    \ BW/4HANA 系统中实现一个完全虚拟的数据模型。底层源对象的用途决定了我所使用的开放 ODS 视图的类型。为了创建模型，我利用了所有三种可用的开放\
    \ ODS 视图类型。这些类型包括：文本、主数据和事实。这个虚拟模型随后被 `CompositeProvider` 和最终的查询对象所使用。\n\n最后，我演示了如何将虚拟模型轻松转换为持久化结构，而不会影响在该模型之上创建的任何对象。这些示例帮助您理解了完全虚拟模型的局限性，以及哪些场景要求我们考虑将虚拟模型转换为持久化结构。\n\
    \n# 5. 创建混合数据模型\n\n在上一章中，我们创建了一个基于字段的数据模型，该模型是基于开放 ODS 视图对象构建的。接下来，我将引导您完成一个场景，我们将混合使用基于字段的方法和常规信息对象来实现一个混合数据模型。我将重点介绍混合建模方法的优势、局限性以及缺点。\n\
    \n## 场景\n\n订单数据模型的下一项要求是使用附加属性对其进行增强。这一次，业务用户希望能够利用现有 SAP 信息对象的主数据。有两个信息对象需要纳入现有的数据模型：\n\
    \n- `0CALDAY`（日历日）：这是一个标准的 SAP 信息对象，包含与时间相关的属性和层次结构。用户希望能够利用 `0CALDAY` 主数据来处理“单据日期”列，该列当前只显示日期值。\n\
    - `ZBW4CUST`（客户）：这是一个自定义的 SAP 信息对象，包含客户信息。`ZBW4CUST` 的主数据不会涵盖外部数据模型中可用的所有客户编号。业务用户希望能够对共同的客户编号使用客户属性。对于那些在\
    \ `ZBW4CUST` 对象中不可用的客户，其属性将不予维护，并应保持为空。客户信息对象包含以下三个导航属性：\n  - `ZBW4ADDR`（地址）\n\
    \  - `ZBW4STAT`（州/省）\n  - `ZBW4COMP`（公司名称）\n\n图 5-1 展示了客户信息对象的内容和属性。\n\n![../images/508424_1_En_5_Chapter/508424_1_En_5_Fig1_HTML.jpg](img/508424_1_En_5_Fig1_HTML.jpg)\n\
    \n*图 5-1. 客户信息对象的内容*\n\n如图 5-1 所示，客户信息对象的主数据仅包含三个客户编号。外部 `ORDER_HEADER` 表中存在的客户\
    \ 0100000014 和 0100000015 不属于此信息对象。\n\n为了实现所需的功能，我将采用混合建模方法。图 5-2 描述了如何扩展现有模型以满足业务需求。\n\
    \n![../images/508424_1_En_5_Chapter/508424_1_En_5_Fig2_HTML.jpg](img/508424_1_En_5_Fig2_HTML.jpg)\n\
    \n*图 5-2. 订单数据的混合数据模型*\n\n如图 5-2 所示，为了满足业务需求，我们将通过向信息对象应用额外的关联来增强现有的订单数据模型。通过这种方式，我们将能够利用\
    \ SAP 信息对象中可用的主数据。\n\n## 使用 `0CALDAY` 信息对象定义关联\n\n第一个业务需求是在现有数据模型中为“单据日期”列包含一个时间维度。用户请求能够为此列添加额外的时间属性，例如日历年份、季度、月份和周。此外，用户还希望能够利用时间层次结构。为此，我们可以将\
    \ `0CALDAY` 标准信息对象纳入订单数据模型中。该信息对象已包含所有必需的功能。\n\n在上一章中，我演示了如何使用关联功能将主数据开放 ODS 视图分配给事实开放\
    \ ODS 视图的字段。在当前场景中，我们将使用相同的功能，但不再关联主数据开放 ODS 视图，而是使用信息对象。通过此功能，关联信息对象的所有属性都将被继承到输出字段中；因此，用户将获得增强的报告功能。图\
    \ 5-3 展示了在订单数据（`ZFCT01`）开放 ODS 视图的 `0DOC_DATE` 字段和 `0CALDAY` 信息对象之间应用关联的步骤。\n\n\
    ![../images/508424_1_En_5_Chapter/508424_1_En_5_Fig3_HTML.jpg](img/508424_1_En_5_Fig3_HTML.jpg)\n\
    \n*图 5-3. 在 `ZFCT01` 开放 ODS 视图对象中为“单据日期”字段建立的关联*\n\n要在输出字段和信息对象之间应用关联，请从“视图字段”部分选择目标字段。在右侧窗格中，单击“浏览\
    \ (2)”按钮。这将打开一个窗口，您可以在其中搜索 (3) 要用于关联的目标信息对象。找到目标信息对象后，选中它 (4) 并单击“确定 (5)”。应用关联后，您可以指定要从关联信息对象中启用以供报告使用的导航属性。\n\
    \n如图 5-4 所示，对于 `DOC_DATE` 列，我选择了来自关联的 `0CALDAY` 信息对象的三个导航属性。这些属性是 `0CALMONTH`、`0CALYEAR`\
    \ 和 `0CALWEEK`。在“本地描述”列中，您可以为导航属性提供自己的描述。这可以帮助您轻松识别引用的字段。\n\n![../images/508424_1_En_5_Chapter/508424_1_En_5_Fig4_HTML.jpg](img/508424_1_En_5_Fig4_HTML.jpg)\n\
    \n*图 5-4. 为 `ZFCT01` 开放 ODS 视图对象添加 `0CALDAY` 导航属性*\n\n图 5-5 展示了“单据日期”列的目标配置。\n\
    \n![../images/508424_1_En_5_Chapter/508424_1_En_5_Fig5_HTML.jpg](img/508424_1_En_5_Fig5_HTML.jpg)\n\
    \n*图 5-5. `ZFCT01` 开放 ODS 视图对象中的 `0CALDAY` 导航属性*\n\n“单据日期”列现在多了三个导航属性。\n\n> **注意：**\
    \ 可选地，字段与信息对象之间的分配可以直接在 `CompositeProvider` 级别上应用。同样，导航属性也可以直接在那里启用。\n\n一旦我们应用了关联，我们就可以转到\
    \ `CompositeProvider` 配置。由于对于事实开放 ODS 视图，我对 `DOC_DATE` 字段使用了直接关联，其技术名称已更改，我们需要调整\
    \ `ZCPFCT01` `CompositeProvider` 中的映射（除非我们创建了新的 `CompositeProvider`）。此外，我们希望为订单数据向\
    \ `CompositeProvider` 的输出结构添加新的导航属性。\n"
- fmt: "As you can see in Figure [5-6](#508424_1_En_5_Chapter.xhtml#Fig6), the `Document\
    \ Date` column (highlighted) in the Target section shows a warning. Because of\
    \ the change to the technical name of that column, the assignment from Source\
    \ to Target has been removed. This column should now be removed from the Target\
    \ section and replaced with the `0CALDAY` column. What is worth noting is that\
    \ by default you cannot see the navigation attributes that were enabled for the\
    \ `Document Date` column at the `Open ODS View` level. To display them, in the\
    \ Source section, right-click the `Open ODS View` name and select `Show Unassigned\
    \ Navigation Attributes` (Figure [5-6](#508424_1_En_5_Chapter.xhtml#Fig6)).\n\n\
    ![../images/508424_1_En_5_Chapter/508424_1_En_5_Fig6_HTML.jpg](images/508424_1_En_5_Chapter/508424_1_En_5_Fig6_HTML.jpg)\n\
    \nFigure 5-6.\n\n`Show Unassigned Navigation Attributes` menu item in CompositeProvider\n\
    \nAfter displaying the navigation attributes, you are able to map them from Source\
    \ to Target (Figure [5-7](#508424_1_En_5_Chapter.xhtml#Fig7)).\n\n![../images/508424_1_En_5_Chapter/508424_1_En_5_Fig7_HTML.jpg](images/508424_1_En_5_Chapter/508424_1_En_5_Fig7_HTML.jpg)\n\
    \nFigure 5-7.\n\nAdding the `0CALDAY` navigation attributes to the output of the\
    \ `ZCPFCT01` CompositeProvider\n\nAs shown in Figure [5-7](#508424_1_En_5_Chapter.xhtml#Fig7),\
    \ the former `DOC_DATE` column has been removed from the CompositeProvider structure\
    \ and replaced with the `0CALDAY` field. In addition, three navigation attributes\
    \ (`0CALMONTH`, `0CALWEEK`, and `0CALYEAR`) of `0CALDAY` have been included. The\
    \ last step to complete this task is to activate the CompositeProvider and add\
    \ new fields to the orders report (query `ZCPFCT01_Q01`).\n\n> **Note**  \n> If\
    \ you see a “column view” error during the CompositeProvider activation, run the\
    \ `RSDDB_LOGINDEX_CREATE` program for the underlying Open ODS View to create a\
    \ column view (see Figure [3-12](#508424_1_En_3_Chapter.xhtml#Fig12)).\n\nFigure\
    \ [5-8](#508424_1_En_5_Chapter.xhtml#Fig8) shows the new fields that have been\
    \ added to the query `ZCPFCT01_Q01`.\n\n![../images/508424_1_En_5_Chapter/508424_1_En_5_Fig8_HTML.jpg](images/508424_1_En_5_Chapter/508424_1_En_5_Fig8_HTML.jpg)\n\
    \nFigure 5-8.\n\nAdding the `0CALDAY` navigation attributes to the output of the\
    \ `ZCPFCT01_Q01` query\n\nLike we did for the `ZCPFCT01` CompositeProvider, we\
    \ first need to remove the obsolete `DOC_DATE` column, which has been replaced\
    \ with the `0CALDAY` InfoObject (Figure [5-8](#508424_1_En_5_Chapter.xhtml#Fig8)).\
    \ Then we can add the `0CALWEEK`, `0CALMONTH`, and `0CALYEAR` columns and save\
    \ the query. Now when running the report in Analysis for Microsoft Excel, we can\
    \ take advantage of the new time attributes as well as the hierarchies.\n\nYou\
    \ can see (Figure [5-9](#508424_1_En_5_Chapter.xhtml#Fig9)) that in the orders\
    \ report users can now navigate using the `Calendar Year`, `Year/Month`, and `Year/Week`\
    \ columns. In addition, they can take advantage of the hierarchies that are available\
    \ under the `0CALDAY` InfoObject. As an example, I used the `Year-Quarter-Month-Date`\
    \ hierarchy to see the totals for `Quantity Ordered`, broken down by Year, Quarter,\
    \ Month, and Date. This gives users new display, grouping, and filtering capabilities\
    \ when working with reports and dashboards.\n\n![../images/508424_1_En_5_Chapter/508424_1_En_5_Fig9_HTML.jpg](images/508424_1_En_5_Chapter/508424_1_En_5_Fig9_HTML.jpg)\n\
    \nFigure 5-9.\n\nDisplay of `0CALDAY` attributes for `ZCPFCT01_Q01` in Analysis\
    \ for Microsoft Excel\n\nBefore going to the next section, I will show an alternative\
    \ way to define an association between fields and InfoObjects. As I already mentioned,\
    \ the association can be applied also directly on the CompositeProvider level.\
    \ In the next example, I assigned the `0CALDAY` InfoObject to the `Delivery Date`\
    \ (`DELV_DATE`) column, which is another field of a date type. The steps for assigning\
    \ InfoObjects to the field at a CompositeProvider level are the same as demonstrated\
    \ for Open ODS Views (Figure [5-3](#508424_1_En_5_Chapter.xhtml#Fig3)). Once the\
    \ association is added, you can enable navigation attributes by right-clicking\
    \ the field and selecting the `Navigation Attributes` option.\n\nFigure [5-10](#508424_1_En_5_Chapter.xhtml#Fig10)\
    \ shows that the field `DELV_DATE` now also has an association with the `0CALDAY`\
    \ InfoObject. In addition, you can see that there is an option to enable navigation\
    \ attributes. After selecting navigation attributes, they are shown under the\
    \ `DELV_DATE` column.\n\n![../images/508424_1_En_5_Chapter/508424_1_En_5_Fig10_HTML.jpg](images/508424_1_En_5_Chapter/508424_1_En_5_Fig10_HTML.jpg)\n\
    \nFigure 5-10.\n\nAdding `0CALDAY` navigation attributes for `ZCPFCT01` CompositeProvider\n\
    \n> **Note**  \n> When using association functionality, you need to remember that\
    \ for a single InfoObject, the option `Direct Usage of Associated Object by Name`\
    \ can be set for only one field within the CompositeProvider. If you need to apply\
    \ an association for a specific InfoObject for multiple columns, you should keep\
    \ the option `Usage of System-Wide Unique Name`.\n\nIf the source fact Open ODS\
    \ View will be reused in multiple models, then as a good practice it is recommended\
    \ to apply an association in that object already. Thanks to that, every time when\
    \ it is consumed by the CompositeProvider, all relevant fields are already available.\
    \ Otherwise, you would need to configure associations for every new CompositeProvider.\
    \ In addition, if you create a query directly on top of the Open ODS View, this\
    \ is the only way to enable navigation attributes.\n\nIn case the source Open\
    \ ODS View will not be consumed by any other CompositeProviders or you want to\
    \ add navigation attributes only for a specific model, then you can apply an association\
    \ directly on a CompositeProvider level.\n\nBoth approaches are valid from a modeling\
    \ perspective. In the end, they provide the same functionality to the end user,\
    \ and you should decide what works best for your scenario."
  raw: 'As you can see in Figure [5-6](#508424_1_En_5_Chapter.xhtml#Fig6), the Document
    Date column (highlighted) in the Target section shows a warning. Because of the
    change to the technical name of that column, the assignment from Source to Target
    has been removed. This column should now be removed from the Target section and
    replaced with the 0CALDAY column. What is worth noting is that by default you
    cannot see the navigation attributes that were enabled for the Document Date column
    at the Open ODS View level. To display them, in the Source section, right-click
    the Open ODS View name and select Show Unassigned Navigation Attributes (Figure
    [5-6](#508424_1_En_5_Chapter.xhtml#Fig6)).


    ![../images/508424_1_En_5_Chapter/508424_1_En_5_Fig6_HTML.jpg](images/508424_1_En_5_Chapter/508424_1_En_5_Fig6_HTML.jpg)


    Figure 5-6.


    Show Unassigned Navigation Attributes menu item in CompositeProvider


    After displaying the navigation attributes, you are able to map them from Source
    to Target (Figure [5-7](#508424_1_En_5_Chapter.xhtml#Fig7)).


    ![../images/508424_1_En_5_Chapter/508424_1_En_5_Fig7_HTML.jpg](images/508424_1_En_5_Chapter/508424_1_En_5_Fig7_HTML.jpg)


    Figure 5-7.


    Adding the 0CALDAY navigation attributes to the output of the ZCPFCT01 CompositeProvider


    As shown in Figure [5-7](#508424_1_En_5_Chapter.xhtml#Fig7), the former DOC_DATE
    column has been removed from the CompositeProvider structure and replaced with
    the 0CALDAY field. In addition, three navigation attributes (0CALMONTH, 0CALWEEK,
    and 0CALYEAR) of 0CALDAY have been included. The last step to complete this task
    is to activate the CompositeProvider and add new fields to the orders report (query
    ZCPFCT01_Q01).


    Note


    If you see a “column view” error during the CompositeProvider activation, run
    the RSDDB_LOGINDEX_CREATE program for the underlying Open ODS View to create a
    column view (see Figure [3-12](#508424_1_En_3_Chapter.xhtml#Fig12)).


    Figure [5-8](#508424_1_En_5_Chapter.xhtml#Fig8) shows the new fields that have
    been added to the query ZCPFCT01_Q01.


    ![../images/508424_1_En_5_Chapter/508424_1_En_5_Fig8_HTML.jpg](images/508424_1_En_5_Chapter/508424_1_En_5_Fig8_HTML.jpg)


    Figure 5-8.


    Adding the 0CALDAY navigation attributes to the output of the ZCPFCT01_Q01 query


    Like we did for the ZCPFCT01 CompositeProvider, we first need to remove the obsolete
    DOC_DATE column, which has been replaced with the 0CALDAY InfoObject (Figure [5-8](#508424_1_En_5_Chapter.xhtml#Fig8)).
    Then we can add the 0CALWEEK, 0CALMONTH, and 0CALYEAR columns and save the query.
    Now when running the report in Analysis for Microsoft Excel, we can take advantage
    of the new time attributes as well as the hierarchies.


    You can see (Figure [5-9](#508424_1_En_5_Chapter.xhtml#Fig9)) that in the orders
    report users can now navigate using the Calendar Year, Year/Month, and Year/Week
    columns. In addition, they can take advantage of the hierarchies that are available
    under the 0CALDAY InfoObject. As an example, I used the Year-Quarter-Month-Date
    hierarchy to see the totals for Quantity Ordered, broken down by Year, Quarter,
    Month, and Date. This gives users new display, grouping, and filtering capabilities
    when working with reports and dashboards.


    ![../images/508424_1_En_5_Chapter/508424_1_En_5_Fig9_HTML.jpg](images/508424_1_En_5_Chapter/508424_1_En_5_Fig9_HTML.jpg)


    Figure 5-9.


    Display of 0CALDAY attributes for ZCPFCT01_Q01 in Analysis for Microsoft Excel


    Before going to the next section, I will show an alternative way to define an
    association between fields and InfoObjects. As I already mentioned, the association
    can be applied also directly on the CompositeProvider level. In the next example,
    I assigned the 0CALDAY InfoObject to the Delivery Date (DELV_DATE) column, which
    is another field of a date type. The steps for assigning InfoObjects to the field
    at a CompositeProvider level are the same as demonstrated for Open ODS Views (Figure
    [5-3](#508424_1_En_5_Chapter.xhtml#Fig3)). Once the association is added, you
    can enable navigation attributes by right-clicking the field and selecting the
    Navigation Attributes option.


    Figure [5-10](#508424_1_En_5_Chapter.xhtml#Fig10) shows that the field DELV_DATE
    now also has an association with the 0CALDAY InfoObject. In addition, you can
    see that there is an option to enable navigation attributes. After selecting navigation
    attributes, they are shown under the DELV_DATE column.


    ![../images/508424_1_En_5_Chapter/508424_1_En_5_Fig10_HTML.jpg](images/508424_1_En_5_Chapter/508424_1_En_5_Fig10_HTML.jpg)


    Figure 5-10.


    Adding 0CALDAY navigation attributes for ZCPFCT01 CompositeProvider


    Note


    When using association functionality, you need to remember that for a single InfoObject,
    the option Direct Usage of Associated Object by Name can be set for only one field
    within the CompositeProvider. If you need to apply an association for a specific
    InfoObject for multiple columns, you should keep the option Usage of System-Wide
    Unique Name.


    If the source fact Open ODS View will be reused in multiple models, then as a
    good practice it is recommended to apply an association in that object already.
    Thanks to that, every time when it is consumed by the CompositeProvider, all relevant
    fields are already available. Otherwise, you would need to configure associations
    for every new CompositeProvider. In addition, if you create a query directly on
    top of the Open ODS View, this is the only way to enable navigation attributes.


    In case the source Open ODS View will not be consumed by any other CompositeProviders
    or you want to add navigation attributes only for a specific model, then you can
    apply an association directly on a CompositeProvider level.


    Both approaches are valid from a modeling perspective. In the end, they provide
    the same functionality to the end user, and you should decide what works best
    for your scenario.'
  trans: "\n如图 5-6 所示，目标区域中的`Document Date`列（高亮显示）出现了一条警告。由于该列的技术名称发生了更改，从源到目标的映射已被移除。现在应从目标区域中删除此列，并用`0CALDAY`列替换。值得注意的是，默认情况下，你无法看到在`Open\
    \ ODS View`级别为`Document Date`列启用的导航属性。要显示它们，请在源区域中右键单击`Open ODS View`名称，然后选择`显示未分配的导航属性`（图\
    \ 5-6）。\n\n![../images/508424_1_En_5_Chapter/508424_1_En_5_Fig6_HTML.jpg](img/508424_1_En_5_Fig6_HTML.jpg)\n\
    \n图 5-6.\n\nCompositeProvider 中的`显示未分配的导航属性`菜单项\n\n显示导航属性后，你便可以从源映射到目标（图 5-7）。\n\
    \n![../images/508424_1_En_5_Chapter/508424_1_En_5_Fig7_HTML.jpg](img/508424_1_En_5_Fig7_HTML.jpg)\n\
    \n图 5-7.\n\n将`0CALDAY`导航属性添加到`ZCPFCT01` CompositeProvider 的输出中\n\n如图 5-7 所示，原有的`DOC_DATE`列已从\
    \ CompositeProvider 结构中删除，并替换为`0CALDAY`字段。此外，还包含了`0CALDAY`的三个导航属性（`0CALMONTH`、`0CALWEEK`和`0CALYEAR`）。完成此任务的最后一步是激活\
    \ CompositeProvider，并将新字段添加到订单报表（查询`ZCPFCT01_Q01`）中。\n\n> **注意**  \n> 如果在激活 CompositeProvider\
    \ 期间看到“列视图”错误，请为底层的 Open ODS View 运行`RSDDB_LOGINDEX_CREATE`程序以创建列视图（参见图 3-12）。\n\
    \n图 5-8 显示了已添加到查询`ZCPFCT01_Q01`中的新字段。\n\n![../images/508424_1_En_5_Chapter/508424_1_En_5_Fig8_HTML.jpg](img/508424_1_En_5_Fig8_HTML.jpg)\n\
    \n图 5-8.\n\n将`0CALDAY`导航属性添加到`ZCPFCT01_Q01`查询的输出中\n\n与我们处理`ZCPFCT01` CompositeProvider\
    \ 的方式类似，我们首先需要删除已由`0CALDAY` InfoObject 替换的过时`DOC_DATE`列（图 5-8）。然后我们可以添加`0CALWEEK`、`0CALMONTH`和`0CALYEAR`列并保存查询。现在，当在\
    \ Analysis for Microsoft Excel 中运行报表时，我们可以利用新的时间属性以及层次结构。\n\n你可以看到（图 5-9），在订单报表中，用户现在可以使用`日历年度`、`年/月`和`年/周`列进行导航。此外，他们还可以利用`0CALDAY`\
    \ InfoObject 下可用的层次结构。例如，我使用了`年-季度-月-日`层次结构来查看`已订购数量`的总计，并按年、季度、月和日进行了细分。这为用户在处理报表和仪表板时提供了新的显示、分组和过滤功能。\n\
    \n![../images/508424_1_En_5_Chapter/508424_1_En_5_Fig9_HTML.jpg](img/508424_1_En_5_Fig9_HTML.jpg)\n\
    \n图 5-9.\n\n在 Analysis for Microsoft Excel 中显示`ZCPFCT01_Q01`的`0CALDAY`属性\n\n在进入下一部分之前，我将展示定义字段与\
    \ InfoObject 之间关联的另一种方法。正如我之前提到的，关联也可以直接在 CompositeProvider 级别应用。在下一个示例中，我将`0CALDAY`\
    \ InfoObject 分配给`交货日期`（`DELV_DATE`）列，这是另一个日期类型的字段。在 CompositeProvider 级别为字段分配\
    \ InfoObject 的步骤与为 Open ODS View（图 5-3）演示的步骤相同。添加关联后，你可以通过右键单击该字段并选择`导航属性`选项来启用导航属性。\n\
    \n图 5-10 显示了字段`DELV_DATE`现在也与`0CALDAY` InfoObject 建立了关联。此外，你可以看到有一个启用导航属性的选项。选择导航属性后，它们会显示在`DELV_DATE`列下方。\n\
    \n![../images/508424_1_En_5_Chapter/508424_1_En_5_Fig10_HTML.jpg](img/508424_1_En_5_Fig10_HTML.jpg)\n\
    \n图 5-10.\n\n为`ZCPFCT01` CompositeProvider 添加`0CALDAY`导航属性\n\n> **注意**  \n> 使用关联功能时，需要记住，对于单个\
    \ InfoObject，在 CompositeProvider 内只能为一个字段设置`按名称直接使用关联对象`选项。如果需要对特定 InfoObject\
    \ 的多个列应用关联，则应保留`使用系统级唯一名称`选项。\n\n如果源事实表 Open ODS View 将在多个模型中重复使用，那么最佳实践是建议在该对象中预先应用关联。这样，每次\
    \ CompositeProvider 消费它时，所有相关字段都已可用。否则，你需要为每个新的 CompositeProvider 配置关联。此外，如果你直接在\
    \ Open ODS View 之上创建查询，这是启用导航属性的唯一方法。\n\n如果源 Open ODS View 不会被任何其他 CompositeProvider\
    \ 消费，或者你只想为特定模型添加导航属性，那么你可以直接在 CompositeProvider 级别应用关联。\n\n从建模的角度来看，这两种方法都是有效的。最终，它们为最终用户提供相同的功能，你应该根据具体场景决定哪种方法最适合。"
- fmt: '# Defining Associations with the ZBW4CUST InfoObject


    Since you already know how to apply associations, you might think that assigning
    another InfoObject to the field is a piece of cake. This is partially true; however,
    for the second requirement, we need to consider additional constraints.


    When applying an association between the Document Date field and the `0CALDAY`
    InfoObject, we do not need to worry about the data consistency between these objects.
    This is because the `DATE` data type for the Document Date column already constrains
    the values that this column might take (only dates). Thanks to that, we avoid
    the situation when the Document Date column contains a value that is not available
    in the `0CALDAY` InfoObject. For the Customer field, the situation is different.
    Customer data is maintained in the external data source; hence, we cannot ensure
    that IDs will always match the `ZBW4CUST` InfoObject master data. As described
    in the scenario, the `ORDER_HEADER` table contains two customer numbers that are
    not part of the `ZBW4CUST` InfoObject master data. See the comparison of the Customer
    master data values to the distinct values of customers in the `ORDER_HEADER` table,
    as shown in Figure [5-11](#508424_1_En_5_Chapter.xhtml#Fig11).


    ![../images/508424_1_En_5_Chapter/508424_1_En_5_Fig11_HTML.jpg](images/508424_1_En_5_Chapter/508424_1_En_5_Fig11_HTML.jpg)


    Figure 5-11. Comparison of customer numbers between the ZBW4CUST InfoObject and
    the ORDER_HEADER table


    As presented in Figure [5-11](#508424_1_En_5_Chapter.xhtml#Fig11), the InfoObject
    `ZBW4CUST` contains three Customer values, while in the `ORDER_HEADER` table there
    are five customer numbers available. The highlighted customer numbers (`0100000014`
    and `0100000015`) are not part of the `ZBW4CUST` master data. To check how this
    inconsistency impacts the data model, let’s apply an association between the `CUST_NUMBER`
    field and the `ZBW4CUST` InfoObject (Figure [5-12](#508424_1_En_5_Chapter.xhtml#Fig12)).


    ![../images/508424_1_En_5_Chapter/508424_1_En_5_Fig12_HTML.jpg](images/508424_1_En_5_Chapter/508424_1_En_5_Fig12_HTML.jpg)


    Figure 5-12. Association for Customer field in ZFCT01 Open ODS View


    To apply an association for the `CUST_NUMBER` field, follow the same steps as
    demonstrated for the `0CALDAY` InfoObject (Figure [5-3](#508424_1_En_5_Chapter.xhtml#Fig3)).
    This time you should select the `ZBW4CUST` InfoObject as the reference (Figure
    [5-10](#508424_1_En_5_Chapter.xhtml#Fig10)). In addition, you might notice that
    the option (1) User Confirmed Referential Integrity has been selected (Figure
    [5-12](#508424_1_En_5_Chapter.xhtml#Fig12)). If you select this option, at the
    query runtime the system will perform a referential join between the field `CUST_NUMBER`
    and the technical table of the `ZBW4CUST` InfoObject. As a result, the query will
    return only entries that are common in both tables.


    After applying the association, we can now take advantage of navigation attributes.
    Follow the steps shown in Figure [5-4](#508424_1_En_5_Chapter.xhtml#Fig4) to enable
    the navigation attributes of the `ZBW4CUST` InfoObject. Figure [5-13](#508424_1_En_5_Chapter.xhtml#Fig13)
    shows the navigation attributes that were enabled for the `ZFCT01` Open ODS View.


    ![../images/508424_1_En_5_Chapter/508424_1_En_5_Fig13_HTML.jpg](images/508424_1_En_5_Chapter/508424_1_En_5_Fig13_HTML.jpg)


    Figure 5-13. ZBW4CUST navigation attributes in the ZFCT01 Open ODS View


    Let’s now open the `ZFCT01` Open ODS View in Analysis for Microsoft Excel to check
    whether the association works as expected.


    ## The Importance of the Referential Integrity Setting


    When opening the preview of the `ZCPFCT01` Open ODS View in Analysis for Microsoft
    Excel, by default it shows only the totals. For the given Open ODS View, the Total
    value of Quantity Ordered is 462 (Figure [5-14](#508424_1_En_5_Chapter.xhtml#Fig14)).


    ![../images/508424_1_En_5_Chapter/508424_1_En_5_Fig14_HTML.jpg](images/508424_1_En_5_Chapter/508424_1_En_5_Fig14_HTML.jpg)


    Figure 5-14. Display of ZBW4CUST attributes for ZCPFCT01 in Analysis for Microsoft
    Excel (referential integrity option selected)


    On the right side of Figure [5-14](#508424_1_En_5_Chapter.xhtml#Fig14), you can
    see the display after pulling all the customer-related attributes. At first glance,
    it looks like everything works as expected and the customer-related information
    is displayed properly. However, you might notice that once the customer information
    is added to the output, the total value for Quantity Ordered is not 462 but 405.
    You may also realize that in the underlying `ORDER_HEADER` table there were five
    customers available, while the report output shows only three. This behavior is
    caused by the User Confirmed Referential Integrity option, which we selected when
    associating the `ZBW4CUST` InfoObject to the `CUST_NUMBER` field (Figure [5-12](#508424_1_En_5_Chapter.xhtml#Fig12)).
    With this option, every time the associated InfoObject or its navigation attribute
    is added to the output, the referential join is performed, and it filters out
    all the records that are not part of the master data of the associated InfoObject.
    This can cause confusion for the user, because depending on fields that are added
    to the output, we might see different results. This means that the User Confirmed
    Referential Integrity property (Figure [5-12](#508424_1_En_5_Chapter.xhtml#Fig12))
    should be used only if we know that referential integrity is ensured. In other
    words, we need to make sure that the master data of the associated InfoObject
    will cover all the values that are coming from the source table.


    Since in our scenario the Customer values that are coming from the external `ORDER_HEADER`
    table are not fully covered by the Customer master data, let’s now unselect the
    User Confirmed Referential Integrity property and activate the Open ODS View again
    (Figure [5-15](#508424_1_En_5_Chapter.xhtml#Fig15)).


    ![../images/508424_1_En_5_Chapter/508424_1_En_5_Fig15_HTML.jpg](images/508424_1_En_5_Chapter/508424_1_En_5_Fig15_HTML.jpg)


    Figure 5-15. Unselecting the Referential Integrity option for the Customer field
    in the ZFCT01 Open ODS View


    After activating the Open ODS View, we can check the output again by running it
    in Analysis for Microsoft Excel (Figure [5-16](#508424_1_En_5_Chapter.xhtml#Fig16)).


    ![../images/508424_1_En_5_Chapter/508424_1_En_5_Fig16_HTML.jpg](images/508424_1_En_5_Chapter/508424_1_En_5_Fig16_HTML.jpg)


    Figure 5-16. Display of the ZBW4CUST attributes for ZCPFCT01 in Analysis for Microsoft
    Excel (referential integrity option unselected)


    As shown in Figure [5-16](#508424_1_En_5_Chapter.xhtml#Fig16), after we changed
    the referential integrity option, the customer numbers `0100000014` and `0100000015`
    are now available. Since the master data for these two customers is not maintained
    in the `ZBW4CUST` InfoObject, the attributes State, Company Name, and Address
    are blank. What is more, the value of Quantity Ordered is now consistent.


    > **Note:** When using the User Confirmed Referential Integrity property, you
    should be aware that at query runtime all values that were not found as part of
    the master data of the associated InfoObject will be inserted into the master
    data table of that InfoObject.'
