  trans: "\n#### 问题：在每个计算视图节点上执行数据预览时，输出中未返回数据，尽管底层表中存在数据。\n\n**原因：** 在计算视图属性中，`Session\
    \ Client` 被设置为默认客户端。\n\n**解决方案：** 在计算视图的语义中，进入 `视图属性` 选项卡，将 `默认客户端` 值从 `Session\
    \ Client` 更改为 `Cross Client`（参见图 1-10）。\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig10_HTML.jpg](img/508424_1_En_1_Fig10_HTML.jpg)\
    \  \n图 1-10 – 在计算视图中设置默认客户端\n\n---\n\n#### 问题：在 SQL 控制台中，开发者能够查询特定模式(schema)表中的数据，但在尝试对计算视图执行数据预览时，出现以下错误信息：\
    \  \n`Error: SAP DBTech JDBC: [258]: insufficient privilege`\n\n**原因：** 已为计算视图应用了\
    \ SQL 分析权限。\n\n**解决方案：** 在计算视图的语义中，进入 `视图属性` 选项卡，应用 `经典分析权限` 选项，而非 `SQL 分析权限`（参见图\
    \ 1-9）。另一种方法是将计算视图分配给已分配给用户或用户角色的 `分析权限` 对象。\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig9_HTML.jpg](img/508424_1_En_1_Fig9_HTML.jpg)\
    \  \n图 1-9 – 在计算视图中应用权限\n\n---\n\n#### 问题：在 SQL 控制台中，开发者能够查询特定模式(schema)表中的数据，但在尝试激活其中一个表之上的视图时，出现以下错误信息：\
    \  \n`Create Scenario failed: The following errors occurred: user is not authorized\
    \ (2950)`\n\n**原因：** 运行时对象由系统用户 `_SYS_REPO` 创建，该用户需要对该模式(schema)拥有 `SELECT` 权限。\n\
    \n**解决方案：** 将该模式(schema)的 `SELECT` 权限授予 `_SYS_REPO` 用户。您可以通过运行以下 SQL 代码来分配权限：\n\
    \n```\nGRANT SELECT ON SCHEMA \"SCHEMA_NAME\" TO _SYS_REPO WITH GRANT OPTION\n\
    ```\n\n图 1-8 展示了 SQL 控制台，其中包含将 `SELECT` 权限授予 `_SYS_REPO` 用户（针对名为 `TEST_SCHEMA`\
    \ 的模式(schema)）的代码。\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig8_HTML.png](img/508424_1_En_1_Fig8_HTML.png)\
    \  \n图 1-8 – 授予权限给 `_SYS_REPO` 用户\n\n---\n\n计算视图是 SAP HANA 环境中的主要建模对象。得益于图形界面，开发者无需深入的\
    \ SQL 编程知识即可将大部分业务逻辑整合到数据模型中。计算视图提供了很大的开发灵活性，因此维护也不是一个大挑战。然而，在某些场景下，计算视图中可用的功能可能不足以满足需求。以下是\
    \ SAP HANA 计算视图的常见限制：\n\n-   无法使用图形视图实现循环功能（如 `WHILE <condition> DO` 等）。\n-  \
    \ 窗口函数（如 `LAG`、`LEAD`、`DENSE_RANK` 等）不可用。\n-   复杂的 SQL 函数（如 `STRING_AGG`、`WORKDAYS_BETWEEN`\
    \ 等）不可用。\n-   不支持应用程序函数库。\n\n幸运的是，还有另一种建模对象称为*表函数*，它支持更复杂的场景，但需要 SQL 编程知识。\n\n\
    ### 表函数\n\n现在，让我们创建一个与上一节创建的计算视图逻辑相同的表函数。如图 1-5 所示，一个计算视图是通过对采购凭证抬头表（`EKKO`）和采购凭证项目表（`EKPO`）进行连接(join)而创建的。连接是在凭证编号列（`EBELN`）上进行的。\n\
    \n就我个人而言，在开始处理表函数逻辑时，我更喜欢在 SQL 控制台中构建整个代码。一旦我运行了代码并验证了结果，我会将 SQL 脚本复制到一个表函数对象中并进行必要的调整。通过这种方法，如果代码有任何问题，更容易进行调试，也可以预览该代码的结果。以下是连接\
    \ `EKKO` 和 `EKPO` 表的 SQL 代码：\n\n```\nSELECT EKPO.\"EBELN\", EKPO.\"EBELP\", EKKO.\"\
    AEDAT\", EKPO.\"MATNR\",  EKPO.\"MEINS\", EKPO.\"MENGE\"\nFROM \"TEST_SCHEMA\"\
    .\"EKKO\" EKKO\nJOIN \"TEST_SCHEMA\".\"EKPO\" EKPO ON EKKO.\"EBELN\" = EKPO.\"\
    EBELN\";\n```\n\n图 1-11 展示了 SQL 控制台执行上述代码后的结果。\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig11_HTML.jpg](img/508424_1_En_1_Fig11_HTML.jpg)\
    \  \n图 1-11 – 用于连接 `EKPO` 和 `EKKO` 表的 SQL 脚本\n\n执行图 1-11 中提供的脚本后，您可以看到结果与上一节创建的计算视图的输出相同。下一步，我将把\
    \ Eclipse 视图从 SAP HANA 建模器切换到 SAP HANA 开发视图。如果此前未使用过该视图，首先需要从 `仓库` 选项卡创建一个仓库工作区，如图\
    \ 1-12 所示。\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig12_HTML.jpg](img/508424_1_En_1_Fig12_HTML.jpg)\
    \  \n图 1-12 – 创建仓库工作区菜单项\n\n为工作区提供名称和物理路径后，即可使用。在已创建的工作区下的树形结构中，我将找到想要在其中创建表函数的包。要打开向导，请右键单击特定包并选择\
    \ **新建 ➤ 其他**。将弹出一个选择向导。输入 **表函数** 以找到正确的对象，如图 1-13 所示。\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig13_HTML.png](img/508424_1_En_1_Fig13_HTML.png)\
    \  \n图 1-13 – 创建表函数向导\n\n选择 `表函数` 后，为表函数提供一个名称。继续操作后，将打开一个表函数编辑器。这里是粘贴实际 SQL 查询的地方。图\
    \ 1-14 显示了用于连接 `EKKO` 和 `EKPO` 表的表函数的最终定义。\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig14_HTML.jpg](img/508424_1_En_1_Fig14_HTML.jpg)\
    \  \n图 1-14 – 用于连接 `EKPO` 和 `EKKO` 表的表函数定义\n\n在图 1-14 中，我高亮显示了代码的重要部分，这些部分应始终由开发者明确定义。\n\
    \n1.  默认情况下，在创建新表函数时，编辑器使用您的本地模式(schema)。考虑将此值更改为其他用户可以访问的模式(schema)。在我看来，最合适的模式(schema)是\
    \ `_SYS_BIC`，这也是所有由计算视图生成的列视图(column views)的存储位置。\n\n    ```\n    FUNCTION \"\
    _SYS_BIC\".\"BW4HANA::TF_PURCHASE_ORDERS\" ( )\n    ```\n\n2.  表值应设置为表函数的输出类型。\n\
    \n3.  在此部分，您需要列出实际 SQL 代码中返回的所有列。您需要保持列顺序和列名（区分大小写）。此外，请确保数据类型与查询中返回的源列的所有数据类型一致。\n"
- fmt: "```sql\n(\n    \"EBELN\" VARCHAR(10),\n    \"EBELP\" VARCHAR(5),\n    \"AEDAT\"\
    \ DATE,\n    \"MATNR\" VARCHAR(18),\n    \"MEINS\" VARCHAR(2),\n    \"MENGE\"\
    \ INT\n)\n```\n\n2. This section is optional; however, if you are utilizing tables\
    \ within the schema, which is named differently in a production environment (i.e.,\
    \ on a development environment the schema is named `TEST_SCHEMA`, but on a production\
    \ system, the same schema is named as `PROD_SCHEMA`), you should always provide\
    \ this parameter in TF definition. If you provide the default schema in the definition\
    \ of a table function, then during the transport to the next environment, this\
    \ schema will be automatically replaced with the schema of the target system (based\
    \ on the schema mapping definition).\n\n```\nRETURNS TABLE\n```\n\n1. Add the\
    \ `RETURN` phrase before the final `SELECT` statement.\n\n```\nDEFAULT SCHEMA\
    \ \"TEST_SCHEMA\"\n```\n\n1. Add your actual SQL `SELECT` query followed by a\
    \ semicolon (`;`). If you use in the table function definition the `DEFAULT SCHEMA`\
    \ parameter, then you should remove all the schema names from the query (use `\"\
    EKKO\"` instead of `\"TEST_SCHEMA\".\"EKKO\"`).\n\n```sql\nSELECT EKPO.\"EBELN\"\
    , EKPO.\"EBELP\", EKKO.\"AEDAT\", EKPO.\"MATNR\", EKPO.\"MEINS\", EKPO.\"MENGE\"\
    \nFROM \"EKKO\" EKKO\nJOIN \"EKPO\" EKPO ON EKKO.\"EBELN\" = EKPO.\"EBELN\"\n\
    ```\n\n```\nRETURN\n```\n\nTo test the table function, go to the SQL console and\
    \ write a `SELECT` statement, providing the full name of the TF in the `FROM`\
    \ clause.\n\n```sql\nSELECT * FROM \"_SYS_BIC\".\"BW4HANA::TF_PURCHASE_ORDERS\"\
    \ ( ) ;\n```\n\nFigure [1-15](#508424_1_En_1_Chapter.xhtml#Fig15) shows the results\
    \ of the SQL statement, which queries the data from the table function.\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig15_HTML.jpg](images/508424_1_En_1_Chapter/508424_1_En_1_Fig15_HTML.jpg)\n\
    \n**Figure 1-15** Querying the table function for purchase orders\n\nAfter creating\
    \ and activating the table function, to make its output available for reporting,\
    \ I need to create a calculation view, which will use a TF as a source. Although\
    \ this calculation view is created on top of the table function, its properties\
    \ will be the same as for a regular calculation view (use Figure [1-2](#508424_1_En_1_Chapter.xhtml#Fig2)\
    \ as a reference). The only difference is that the view will consist of a single\
    \ Projection node, pointing to the table function object as a source. Figure [1-16](#508424_1_En_1_Chapter.xhtml#Fig16)\
    \ shows a calculation view that queries data from a table function.\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig16_HTML.jpg](images/508424_1_En_1_Chapter/508424_1_En_1_Fig16_HTML.jpg)\n\
    \n**Figure 1-16** Calculation view on top of table function for purchase orders\n\
    \nOne of the disadvantages of using table functions is that they are error-prone.\
    \ Here I listed common activation issues when working with table functions:\n\n\
    | **Issue:** When activating a table function, there is a general error: *Could\
    \ not create catalog object: general error; RETURN statement should be defined\
    \ for table function* |\n| :--- |\n| **Reason:** The `RETURN` phrase is missing\
    \ in the TF definition. |\n| **Solution:** Add the `RETURN` phrase before the\
    \ final `SELECT` statement. |\n\n| **Issue:** When activating a table function,\
    \ there is a syntax error: *Syntax error in table function object: incorrect syntax\
    \ near \"END\"* |\n| :--- |\n| **Reason:** A semicolon is missing after the `SELECT`\
    \ statement. |\n| **Solution:** Add a semicolon after the last `SELECT` statement.\
    \ Each block of code within the TF definition should be followed by a semicolon\
    \ (`;`). |\n\n| **Issue:** When activating a table function, there is a mismatch\
    \ error: *Could not create catalog object: return type mismatch* |\n| :--- |\n\
    | **Reason:** Columns listed in a TF definition do not match the columns listed\
    \ in the final `SELECT` query. |\n| **Solution:** Make sure that the list and\
    \ order of columns in the specified final `SELECT` query matches the list and\
    \ order of columns listed in the TF definition. Always explicitly define the column\
    \ names and avoid using an asterisk (`SELECT * FROM`...) to select all columns\
    \ from a table. |\n\n| **Issue:** When activating a table function, there is the\
    \ following encoding error shown: *Unsupported encoding Cp1250 for the '<table\
    \ function name>' file; only UTF-8 encoding is supported.* |\n| :--- |\n| **Reason:**\
    \ The default file encoding is set in the Eclipse tool as `Cp1250`. |\n| **Solution:**\
    \ From the Eclipse toolbar, select **Window** ➤ **Preferences** ➤ **General**\
    \ ➤ **Workspace** and set `UTF-8` as the text file encoding value (see Figure\
    \ [1-17](#508424_1_En_1_Chapter.xhtml#Fig17)). |\n| ![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig17_HTML.png](images/508424_1_En_1_Chapter/508424_1_En_1_Fig17_HTML.png)\
    \ **Figure 1-17** Eclipse text file encoding |\n\nYou may now wonder, if table\
    \ functions have more functionality than calculation views, then why should I\
    \ even consider graphical views instead of using TFs by default for each case?\
    \ Here are some disadvantages of table functions:\n\n- **Error proneness**: The\
    \ SQL code written in a table function needs to follow strict rules. You need\
    \ to always remember to preserve the column order, explicitly provide the proper\
    \ data types, and use semicolons after each block of code.\n- **Maintenance**:\
    \ It is much more difficult to implement enhancements to a complex SQL query than\
    \ to graphical views.\n- **SQL knowledge**: A developer needs to know SQL well\
    \ to be able to implement complex and well-performing queries.\n- There are limitations\
    \ for passing multivalue optional input parameters.\n\nDespite all these disadvantages,\
    \ I prefer using table functions over calculation views. This is mainly because\
    \ in my projects, there were scenarios where complex calculation views needed\
    \ to be enhanced with functions, which are not supported by the graphical designer.\
    \ For these cases I needed to either rebuild the entire logic as SQL code or create\
    \ a table function on top of an existing calculation view to apply additional\
    \ functions, which were not achievable in the graphical view. Anyway, wherever\
    \ possible, I suggest sticking to the graphical approach because of the maintenance."
