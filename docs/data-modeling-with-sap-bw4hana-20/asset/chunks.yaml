    ## 将订单事实数据集成到单个计算视图中


    对于事实数据，我们将采用与主数据集成相同的方法。这意味着事务数据的集成也将在 HANA 层实现。图 6‑21 展示了将 SAP 和非 SAP 事实数据集成到单个数据集中的详细方法。


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig21_HTML.jpg](img/508424_1_En_6_Fig21_HTML.jpg)


    *图 6‑21. 集成 SAP 和非 SAP 订单事实数据的架构*


    图 6‑21 所示的架构与我们为产品主数据实现的架构类似。主要区别在于，对于事实数据，我们将从 ADSO 生成外部计算视图。对于订单数据，我们将利用第 4
    章中创建的事务型 `CV_FACT_ORDERS` 计算视图（参见图 4‑14）。


    要从 `ZADS01` ADSO 生成计算视图，请在 ADSO 属性中选择 `External Calculation View` 选项（图 6‑22）。


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig22_HTML.jpg](img/508424_1_En_6_Fig22_HTML.jpg)


    *图 6‑22. 为 `ZADS01` ADSO 生成外部 SAP HANA 视图*


    激活 ADSO 对象后，系统将生成一个与 ADSO 技术名称同名的计算视图。默认情况下，生成的计算视图将位于为 InfoObject 生成的同一位置（`system-local.bw.bw2hana`
    HANA 包中）。


    如图 6‑23 所示，生成的计算视图包含来自原始 ADSO 的字段。如果权限维护得当，运行数据预览后，我们将能够看到该视图的内容。


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig23_HTML.jpg](img/508424_1_En_6_Fig23_HTML.jpg)


    *图 6‑23. 为 `ZADS01` ADSO 定义的外部 SAP HANA 视图*


    如图 6‑24 所示，该视图的输出对应于源 ADSO 的内容（参考图 6‑2）。下一步，我们需要分析如何合并 SAP 和非 SAP 订单数据。


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig24_HTML.jpg](img/508424_1_En_6_Fig24_HTML.jpg)


    *图 6‑24. 为 `ZADS01` ADSO 定义的外部 SAP HANA 视图的输出*


    为了开始分析，让我们比较一下事务型视图的结构。表 6‑3 比较了 `CV_FACT_ORDERS` 和 `ZADS01` 计算视图的字段和数据类型。


