- fmt: "# Scenario\n\nTo create a comprehensive report that gives detailed information\
    \ about all the orders across the company, business users requested the implementation\
    \ of a new data model. This data model should include both the SAP and non-SAP\
    \ information to provide a 360-degree view on the Orders data model. These are\
    \ the two main SAP objects that should be considered in that model:\n\n- `ZMATID\
    \ (Material ID)`: This is an InfoObject that covers the SAP Materials master data.\
    \ The `Material ID` InfoObject consists of these three attributes:\n    - `0CREATEDON\
    \ (Creation Date)`: Creation date of the material\n    - `0NETPRICE (Net Price)`:\
    \ Net price of the material\n    - `0LOC_CURRENCY (Local Currency)`: Net price\
    \ in the local currency\n\n    Figure [6-1](#508424_1_En_6_Chapter.xhtml#Fig1)\
    \ presents the content and attributes of the `ZMATID` Material InfoObject.\n\n\
    \    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig1_HTML.jpg](images/508424_1_En_6_Chapter/508424_1_En_6_Fig1_HTML.jpg)\n\
    \n    Figure 6-1. Content of the Material ID InfoObject\n\n- `ZADS01 (SAP Orders\
    \ data)`: Advanced DSO that stores SAP orders data. It consists of the following\
    \ fields:\n    - `ZORDID (Order ID)`: Order number\n    - `ZORDITM (Order Item)`:\
    \ Order item number\n    - `ZMATID (Material ID)`: Material master data\n    -\
    \ `ZSTORID (Storage Location)`: Storage location of the material\n    - `ZBW4CUST\
    \ (Customer)`: Customer number\n    - `0DOC_DATE (Document Date)`: Date of the\
    \ document\n    - `0SHIP_DATE (Shipping Date)`: Shipping date of the order\n \
    \   - `0ORDER_QUAN (Purchase Order Quantity)`: Ordered quantity\n    - `0PO_UNIT\
    \ (Order unit)`: Unit of the ordered quantity\n\n    Figure [6-2](#508424_1_En_6_Chapter.xhtml#Fig2)\
    \ presents the content of the `ZADS01` (SAP Orders data) ADSO.\n\n    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig2_HTML.jpg](images/508424_1_En_6_Chapter/508424_1_En_6_Fig2_HTML.jpg)\n\
    \n    Figure 6-2. Content of SAP Orders ADSO\n\nAs you probably remember, in the\
    \ external Orders data model we can also distinguish tables with transactional\
    \ data for Orders (tables `ORDERS_HEADER` and `ORDER_DETAILS`) and master data\
    \ for Products (table `PRODUCTS`). Figure [6-3](#508424_1_En_6_Chapter.xhtml#Fig3)\
    \ shows the general approach to fulfill the business requirements.\n\n![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig3_HTML.jpg](images/508424_1_En_6_Chapter/508424_1_En_6_Fig3_HTML.jpg)\n\
    \nFigure 6-3. High-level architecture for integrating the SAP and non-SAP Orders\
    \ data models\n\nAs shown in Figure [6-3](#508424_1_En_6_Chapter.xhtml#Fig3),\
    \ for non-SAP data we will utilize two calculation views. For Orders, we will\
    \ use the `CV_FACT_ORDERS` view, which combines the `ORDERS_HEADER` and `ORDERS_DETAILS`\
    \ external tables (see Figure [4-14](#508424_1_En_4_Chapter.xhtml#Fig14) in Chapter\
    \ [4](#508424_1_En_4_Chapter.xhtml) as a reference). Materials information that\
    \ is coming from an external system will be derived from the `CV_DIM_PRODUCTS`\
    \ view (see Figure [4-4](#508424_1_En_4_Chapter.xhtml#Fig4) in Chapter [4](#508424_1_En_4_Chapter.xhtml)\
    \ as a reference). SAP-related data will be retrieved from ADSO `ZADS01` (SAP\
    \ Orders) and InfoObject `ZMATID` (SAP Materials). Our goal is to combine these\
    \ objects to create a single Facts Open ODS View object for the transactional\
    \ Orders data and a single Master Data Open ODS View for Materials.\n\n## Integrate\
    \ the Product Master Data into a Single Calculation View\n\nTo combine the SAP\
    \ and non-SAP Materials master data, we will use the HANA layer. While Figure\
    \ [6-3](#508424_1_En_6_Chapter.xhtml#Fig3) showed the high-level architecture\
    \ for integrating both models, Figure [6-4](#508424_1_En_6_Chapter.xhtml#Fig4)\
    \ is an extension of that architecture and presents the detailed approach for\
    \ combining the Materials/Products master data into a single dimension.\n\n![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig4_HTML.jpg](images/508424_1_En_6_Chapter/508424_1_En_6_Fig4_HTML.jpg)\n\
    \nFigure 6-4. Architecture for integrating SAP and non-SAP Products master data\n\
    \nIn the previous chapter, we created the calculation view for the `PRODUCTS`\
    \ table (see Figure [4-4](#508424_1_En_4_Chapter.xhtml#Fig4) as a reference),\
    \ and we will reuse it now. In addition, we need to bring the SAP Materials master\
    \ data to the HANA layer. This can be achieved by using the functionality of generating\
    \ external SAP HANA views from InfoObjects.\n\n**Note**: Instead of using external\
    \ calculation views, we could query the InfoObject technical tables directly.\
    \ However, external calculation views provide all the relevant information by\
    \ default.\n\nLet’s now open the `ZMATID` InfoObject properties and generate an\
    \ external calculation view (see Figure [6-5](#508424_1_En_6_Chapter.xhtml#Fig5)).\n\
    \n![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig5_HTML.jpg](images/508424_1_En_6_Chapter/508424_1_En_6_Fig5_HTML.jpg)\n\
    \nFigure 6-5. Generating an external SAP HANA view for the `ZMATID` InfoObject\n\
    \nBy selecting the `External SAP HANA View for Master Data` check box and activating\
    \ the InfoObject, the system will automatically generate the calculation view\
    \ with the structure corresponding to the InfoObject structure. As shown in Figure\
    \ [6-5](#508424_1_En_6_Chapter.xhtml#Fig5), the system provides information about\
    \ a location of the generated view. You can click the hyperlink to open the external\
    \ calculation view definition.\n\nThe generated calculation view contains all\
    \ the InfoObject attributes as well as the texts columns (Figure [6-6](#508424_1_En_6_Chapter.xhtml#Fig6)).\
    \ As discussed in the first chapter, to query data from that calculation view,\
    \ you need to have authorization for the role that was also generated for that\
    \ view. For more details about authorization, please refer to Chapter [1](#508424_1_En_1_Chapter.xhtml).\n\
    \n![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig6_HTML.jpg](images/508424_1_En_6_Chapter/508424_1_En_6_Fig6_HTML.jpg)\n\
    \nFigure 6-6. Definition of the external SAP HANA view for the `ZMATID` InfoObject\n\
    \nWhen running a preview for that calculation view, you will see the content data\
    \ of the Material (`ZMATID`) InfoObject (see Figure [6-7](#508424_1_En_6_Chapter.xhtml#Fig7)).\n\
    \n![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig7_HTML.jpg](images/508424_1_En_6_Chapter/508424_1_En_6_Fig7_HTML.jpg)\n\
    \nFigure 6-7. Output of the external SAP HANA view for the `ZMATID` InfoObject\n\
    \nTo properly combine different master data objects, we should first perform the\
    \ analysis to check the differences in their structure and data types. Based on\
    \ this analysis, we should identify the following:\n\n- How do we map source fields\
    \ into the target?\n- What should the target data type of the output fields be?\n\
    - Which fields from source objects do not match or are missing?\n\nTable [6-1](#508424_1_En_6_Chapter.xhtml#Tab1)\
    \ compares the `CV_DIM_PRODUCTS` and `ZMATID` calculation views’ fields and data\
    \ types.\n\nTable 6-1. Material and Product Structure Comparison (SAP vs. Non-SAP)"
