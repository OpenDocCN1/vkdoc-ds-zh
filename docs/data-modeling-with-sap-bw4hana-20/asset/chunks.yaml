    \n**图 1-15** 查询采购订单的表函数\n\n创建并激活表函数后，为了使其输出可用于报表，需要创建一个计算视图，该视图将使用 TF 作为源。虽然此计算视图是在表函数之上创建的，但其属性将与常规计算视图相同（以图\
    \ 1-2 作为参考）。唯一的区别是，该视图将仅包含一个指向表函数对象作为源的投影节点。图 1-16 展示了一个从表函数查询数据的计算视图。\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig16_HTML.jpg](img/508424_1_En_1_Fig16_HTML.jpg)\n\
    \n**图 1-16** 基于采购订单表函数的计算视图\n\n使用表函数的缺点之一是容易出错。这里我列出了在处理表函数时常见的激活问题：\n\n| **问题：**\
    \ 激活表函数时，出现一般错误：*无法创建编录对象：一般错误；应为表函数定义 RETURN 语句* |\n| :--- |\n| **原因：** TF 定义中缺少\
    \ `RETURN` 短语。 |\n| **解决方案：** 在最后的 `SELECT` 语句之前添加 `RETURN` 短语。 |\n\n| **问题：**\
    \ 激活表函数时，出现语法错误：*表函数对象中的语法错误：\"END\" 附近的语法不正确* |\n| :--- |\n| **原因：** `SELECT`\
    \ 语句后缺少分号。 |\n| **解决方案：** 在最后一个 `SELECT` 语句后添加分号。TF 定义中的每个代码块后都应跟一个分号（`;`）。 |\n\
    \n| **问题：** 激活表函数时，出现不匹配错误：*无法创建编录对象：返回类型不匹配* |\n| :--- |\n| **原因：** TF 定义中列出的列与最终\
    \ `SELECT` 查询中列出的列不匹配。 |\n| **解决方案：** 确保指定的最终 `SELECT` 查询中的列列表和顺序与 TF 定义中列出的列列表和顺序匹配。始终显式定义列名，避免使用星号（`SELECT\
    \ * FROM`...）从表中选择所有列。 |\n\n| **问题：** 激活表函数时，显示以下编码错误：*'<表函数名称>' 文件不支持编码 Cp1250；仅支持\
    \ UTF-8 编码。* |\n| :--- |\n| **原因：** 在 Eclipse 工具中默认文件编码设置为 `Cp1250`。 |\n| **解决方案：**\
    \ 从 Eclipse 工具栏中，选择 **窗口** ➤ **首选项** ➤ **常规** ➤ **工作空间**，并将文本文件编码值设置为 `UTF-8`（参见图\
    \ 1-17）。 |\n| ![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig17_HTML.png](img/508424_1_En_1_Fig17_HTML.png)\
    \ **图 1-17** Eclipse 文本文件编码 |\n\n你现在可能会想，既然表函数比计算视图功能更多，那为什么我还要考虑在每种情况下默认使用图形化视图而不是\
    \ TF 呢？以下是表函数的一些缺点：\n\n- **容易出错**：在表函数中编写的 SQL 代码需要遵循严格的规则。你需要始终记住保持列顺序，显式提供正确的数据类型，并在每个代码块后使用分号。\n\
    - **维护性**：对复杂 SQL 查询实施增强比图形化视图困难得多。\n- **SQL 知识**：开发人员需要精通 SQL 才能实现复杂且高性能的查询。\n\
    - **传递多值可选输入参数存在限制**。\n\n尽管存在所有这些缺点，我仍然倾向于使用表函数而非计算视图。这主要是因为在我的项目中，存在这样的情况：需要为复杂的计算视图增加图形化设计器不支持的功能。对于这些情况，我需要要么将整个逻辑重写为\
    \ SQL 代码，要么在现有计算视图之上创建一个表函数来应用图形化视图中无法实现的其他功能。无论如何，在可能的情况下，我建议坚持使用图形化方法，因为其易于维护。\n"
- fmt: '### Virtual Tables


    With the functionality of Smart Data Access (SDA), HANA offers the ability to
    bring in data from external systems without having to replicate it in the SAP
    HANA database. With SDA, developers can easily establish remote connections, which
    allows you to create virtual tables and access these objects as if they were local
    HANA tables.


    In the BW/4HANA landscape, SDA can play an important role when it comes to creating
    non-SAP data models or integrating external data into SAP data models. Having
    data from multiple systems (like Oracle, SQL Server, Hadoop, and others) integrated
    into a single SAP enterprise data warehouse enables new analytics capabilities.


    Another benefit of SDA is that it is a cost- and time-efficient solution. First,
    you don’t need to replicate the data and pay for the storage. Of course, for large
    data sets and complex models, there still might be a need to persist external
    data in the BW/4HANA layer due to performance reasons. Second, there is no need
    to set and maintain the replication system. Moreover, data accessible via SDA
    is real-time. Thanks to virtual tables, you can create queries consuming external
    data and combine them with data residing in the SAP HANA system.


    To start accessing remote data sources, you need to first set up the connection.
    The easiest way is to create a new remote source using the Eclipse GUI (as an
    alternative for creating a remote source, you can also use a SQL script). To establish
    the remote connection, open the SAP HANA modeler perspective and expand the Provisioning
    catalog. Then right-click the Remote Sources folder and select New Remote Source,
    as shown in Figure [1-18](#508424_1_En_1_Chapter.xhtml#Fig18).


    ![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig18_HTML.jpg](images/508424_1_En_1_Chapter/508424_1_En_1_Fig18_HTML.jpg)


    Figure 1-18


    Creating a remote source (SDA)


    After providing all the connection properties, the remote source object will be
    available under the Remote Source catalog. Each remote source will contain the
    database name and a list of all accessible schemas and tables (see Figure [1-19](#508424_1_En_1_Chapter.xhtml#Fig19)).


    ![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig19_HTML.jpg](images/508424_1_En_1_Chapter/508424_1_En_1_Fig19_HTML.jpg)


    Figure 1-19


    Remote data sources view


    As shown in Figure [1-19](#508424_1_En_1_Chapter.xhtml#Fig19), there is a remote
    connection, named MSSQL, to a database called RMA. This RMA database contains
    a schema called dev, and within that schema there is a table named dev_table.
    At this point you will not be able to query data from that table yet.


    To start querying data from remote source tables, you need to create a type of
    HANA object called a *virtual table* first. Virtual tables need to be created
    for each remote table that you want to later access.


    Tip


    Before creating virtual tables, a good practice is to create a SAP HANA database
    schema that will be dedicated to remote tables. This way all the virtual tables
    will reside in one place.


    Like with remote sources, there are two ways to create virtual tables: using a
    GUI or using a SQL script. Figure [1-20](#508424_1_En_1_Chapter.xhtml#Fig20) presents
    a graphical way of creating a virtual table.


    ![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig20_HTML.jpg](images/508424_1_En_1_Chapter/508424_1_En_1_Fig20_HTML.jpg)


    Figure 1-20


    Creating a virtual table


    Note


    For each remote source, you need to have authorization to create virtual tables.
    The following SQL query grants this privilege: `GRANT CREATE VIRTUAL TABLE ON
    REMOTE SOURCE <SOURCE_NAME> TO <USER_NAME>`


    After selecting the option for adding a virtual table, as a next step you need
    to enter the name of the virtual table and the target schema. Once this information
    is provided and confirmed, the virtual table will be created under the given schema.
    You can start using the virtual table in the SQL console or consume it in graphical
    views if it is a regular HANA table.


    ## Main SAP BW/4HANA Modeling Objects


    Within the BW/4HANA SAP unified user interface for all modeling objects, developers
    can now develop all the BW objects using the Eclipse tool (see Figure [1-21](#508424_1_En_1_Chapter.xhtml#Fig21)).
    An additional benefit is that they can switch from the HANA native perspective
    to the BW/4HANA modeling perspective with a single click. To develop BW artifacts,
    developers will use the BW modeling perspective of Eclipse. Each BW/4HANA artifact
    can be created by right-clicking the InfoArea, choosing New, and selecting the
    proper object (as in Figure [1-21](#508424_1_En_1_Chapter.xhtml#Fig21)).


    ![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig21_HTML.jpg](images/508424_1_En_1_Chapter/508424_1_En_1_Fig21_HTML.jpg)


    Figure 1-21


    Modeling objects in the BW modeling perspective


    For specific BW/4HANA tasks, there is still a need to use the SAP GUI. To unify
    its usage with modeling activities, the SAP GUI has also been embedded in Eclipse.
    By clicking the Open SAP GUI button (or using the keyboard shortcut Ctrl+6), you
    can open the SAP GUI within the Eclipse tool (see Figure [1-22](#508424_1_En_1_Chapter.xhtml#Fig22)).


    ![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig22_HTML.png](images/508424_1_En_1_Chapter/508424_1_En_1_Fig22_HTML.png)


    Figure 1-22


    SAP GUI in Eclipse


    SAP BW/4HANA simplifies the data modeling approach by limiting the number of modeling
    object types from nine to just four. For data persistency, there are no more objects
    called InfoCube, PSA, DSO, or HybridProvider. They all have been replaced with
    a single object called Advanced DSO (ADSO). When it comes to the virtual layer,
    the following legacy objects were merged into a single object called CompositeProvider:
    MultiProvider, InfoSet, and VirtualProvider. There is also one new modeling object
    called Open ODS View available. The object Open ODS View has functionality similar
    to the former VirtualProvider object. The main purpose and functionalities of
    InfoObject remain the same. Figure [1-23](#508424_1_En_1_Chapter.xhtml#Fig23)
    shows how BW/4HANA simplified the modeling objects in comparison to the old SAP
    BW system.


    ![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig23_HTML.jpg](images/508424_1_En_1_Chapter/508424_1_En_1_Fig23_HTML.jpg)


    Figure 1-23


    Comparison of modeling objects within BW versus BW/4HANA


    The most elementary modeling artifact is InfoObject. The main functionality of
    this object has not changed with the BW/4HANA release. Developers who were working
    on previous versions of SAP BW will be familiar with this object. In the next
    section, I will not focus on the details of the InfoObject properties; I will
    highlight the functionalities that can be useful in the new modeling approach.


    Open ODS Views are objects representing a virtual modeling layer. This means they
    do not persist any data. With Open ODS views, developers can bring external data
    into the BW reporting layer. Unlike InfoObjects, with Open ODS Views you can decide
    what the elementary building block is. They can be built based on InfoObjects,
    another Open ODS views, or raw fields.


    With Open ODS View objects, developers can easily manage external data sources
    and build star schema models without data persistency. This means they can act
    as a kind of virtual master data or virtual fact table. In addition, with the
    Open ODS View object’s field-based approach, we avoid creating too many InfoObjects,
    which in some scenarios (proof of concepts, pilots, tables/views data provisioning)
    does not bring any value, but generates additional work for creating multiple
    dummy objects in the system.'
