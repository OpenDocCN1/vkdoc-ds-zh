  trans: '

    # 4. 创建基于字段的 BW/4HANA 模型


    在第三章 3 中，我们讨论了暴露 HANA 对象（表和视图）的可能性，本章将解释如何使用基于字段的方法实现 BW/4HANA 数据模型。我们已经知道，通过利用
    `Open ODS 视图` 对象，我们可以将位于 SAP HANA 数据库模式中的外部数据引入 BW/4HANA 层。在本章中，我们将利用 `Open ODS
    视图` 在 BW 中构建一个虚拟星型模式、基于字段的数据模型。我还会解释如何在不修改报表层的情况下，在 `Open ODS 视图` 和源对象之间自动生成一个中间数据存储层。


    ## 场景


    成功实施订单数据的基本数据供应报表（第三章 3）后，项目经理要求在 BW/4HANA 中构建一个星型模式数据模型的概念验证。需求是基于在 SAP HANA
    数据库模式中复制的表，在 BW/4HANA 系统中实施该数据模型。在第三章 3 中，已经使用了两个表（`ORDER_HEADER` 和 `ORDER_STATUS`）来构建数据供应报表。该虚拟模型总共应包含五个外部表。其中两个是事实表。


    - `Order Header`：包含订单抬头信息，例如状态、订单日期、客户编号和负责员工。

    - `Order Details`：该表与 `Order Header` 表关联，包含订单项目级别信息，例如产品 ID 或订购数量。


    其余三个表是维度/文本表。


    - `Order Status`：这是一个文本表，用于根据状态描述查找状态 ID。它支持两种语言（英语和德语）的描述。

    - `Products`：这是一个维度表，包含产品属性的信息。

    - `Categories`：这是一个文本表，包含可用产品组及其描述的信息。


    图 4-1 展示了在 SAP HANA 数据库中复制的非 SAP 表的逻辑数据模型。


    ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig1_HTML.jpg](img/508424_1_En_4_Fig1_HTML.jpg)


    *图 4-1.* 订单的逻辑数据模型


    如图 4-1 所示，该数据模型由五个表组成。表之间的连接线定义了它们的关系。在给定的示例中，所有关系都是一对多类型（1..1 – 1..*）。每个实体由一个表头和字段列表组成。加粗的字段表示表的主键。如果你希望跟随演示的活动进行操作，可以在本书的附录中找到重新创建这些表到你本地模式的
    SQL 脚本。


    在本章接下来的部分，我将向你展示如何使用给定的逻辑模型作为参考（图 4-1），在 BW/4HANA 中实施虚拟数据模型。在这个场景中，我们将遵循图 2-7（在第二章
    2 中）提出的基于 Open ODS 视图的建模概念。图 4-2 展示了基于场景描述的需求实施订单数据模型的一般方法。


    ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig2_HTML.jpg](img/508424_1_En_4_Fig2_HTML.jpg)


    *图 4-2.* 订单的虚拟 BW/4HANA 模型


    这里的想法是利用 `Open ODS 视图` 对象构建一个虚拟模型。将有一个事实语义类型的 `Open ODS 视图`（`Orders`）和一个主数据类型（`Product`）的
    `Open ODS 视图`。由于 `Order Status` 和 `Category` 表仅包含键和描述，其语义类型将设置为文本。在模型的顶层，我将创建一个
    `CompositeProvider`，稍后由查询消费。首先，我将专注于实施主数据/文本对象。


    ## 创建维度计算视图


    我们可以直接在 HANA 表上开始实施 `Open ODS 视图`，但正如我之前提到的，我更喜欢先通过计算视图消费表。这为我们提供了更大的灵活性，以防将来需要应用任何字段转换或额外计算。对于每个维度/文本表，我创建了一个类型为维度的计算视图（图
    4-3）。


    ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig3_HTML.jpg](img/508424_1_En_4_Fig3_HTML.jpg)


    *图 4-3.* 虚拟数据模型的维度计算视图列表


    你会在图 4-3 中注意到，我创建了一个名为 `BW4VMODEL` 的新 HANA 包。这有助于保持开发的透明性，并将其与为其他目的而开发的其他 HANA
    对象分开。列在 `BW4VMODEL` 包下的计算视图具有维度类型。它们不包含任何连接或计算，只是以与底层表相同的结构提供数据。例如，你可以在图 4-4 中看到
    `CV_DIM_PRODUCTS` 计算视图的结构。


    ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig4_HTML.jpg](img/508424_1_En_4_Fig4_HTML.jpg)


    *图 4-4.* `CV_DIM_PRODUCTS` 计算视图定义


    其余两个计算视图（用于 Order Status 和 Category 表）遵循相同的方法。它们由一个指向源表的 `Projection` 节点组成，所有字段都从该节点传播到
    `Semantics` 节点。以下是作为特定计算视图源的表（表 ➤ 计算视图）：


    - `CATEGORIES` ➤ `CV_DIM_CATEGORIES`

    - `ORDER_STATUS` ➤ `CV_DIM_ORDER_STATUSES`

    - `PRODUCTS` ➤ `CV_DIM_PRODUCTS`


    验证并激活这些视图后，我们现在可以切换到 BW 建模视角了。

    '
- fmt: '# Create the Texts Open ODS Views


    As visualized in Figure [4-2](#508424_1_En_4_Chapter.xhtml#Fig2), for the given
    scenario there will be two Open ODS Views set to the Texts semantics type. Their
    purpose will be the same as the role of regular InfoObjects in classic EDW architecture.
    The main difference is that Open ODS Views can be field-based, and they do not
    store any data. Open ODS Views retrieve data from the underlying objects (in our
    scenario the HANA calculation views) at query runtime.


    Let’s first focus on the data residing in the `ORDER_STATUS` table. This table
    contains the order status IDs and the order descriptions. Status descriptions
    are available in two languages: English and German. The column `LANGU` identifies
    the language for each entry in that table. The values `E` and `D` stored in that
    column follow standard SAP language codes. As a result, we will be able to support
    the functionality of displaying text dynamically in the user’s language.


    The first Open ODS View will be sourcing data from the `CV_DIM_ORDER_STATUSES`
    calculation view. The Semantics type for this Open ODS View is set to `Texts`.
    In the Open ODS View editor, we need to specify the proper output structure. Figure
    [4-5](#508424_1_En_4_Chapter.xhtml#Fig5) shows the output structure of the Order
    Status (`ZTXT01`) Open ODS View.


    ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig5_HTML.jpg](images/508424_1_En_4_Chapter/508424_1_En_4_Fig5_HTML.jpg)


    *Figure 4-5. Output structure of Order Status (ZTXT01) Open ODS View*


    When defining the output structure of the Open ODS View, first we need to fill
    in the `Representative Key` field, which uniquely identifies each record. In our
    case, it is a `STATUS_ID` column. The second key of that table is the `LANGU`
    column; however, we have a dedicated folder for language codes.


    Since the Order Status dimension will be language-dependent, we need to specify
    the column that will provision the language code values. In our case, we should
    put the `LANGU` column under the `Language Code` folder, as shown in Figure [4-5](#508424_1_En_4_Chapter.xhtml#Fig5).


    The last column that should be added to the output structure is the actual description
    field: `STATUS_DESC`. Depending on the source field length, it should be assigned
    under the proper Text-related folder. Table [4-1](#508424_1_En_4_Chapter.xhtml#Tab1)
    specifies the maximum number of characters supported, depending on Text folder
    type.


    *Table 4-1. Open ODS View Text Types Definition*


    | Text Folder | Max Field Length |

    | --- | --- |

    | Short Text | 20 |

    | Medium Text | 40 |

    | Long Text | 5000 |


    You might also add the same description field to multiple Text folders. This way,
    when showing, for example, `Short Text`, it will display only the first 20 characters
    of the string. If the source field length will be longer, the rest of the text
    will be cut off. In our scenario, the `Status Name` length is 30 characters, so
    I assigned it under the `Medium Text` folder (Figure [4-5](#508424_1_En_4_Chapter.xhtml#Fig5)).
    To check the output of the `ZTXT01` Open ODS View, let’s open it in Analysis for
    Microsoft Excel. Figure [4-6](#508424_1_En_4_Chapter.xhtml#Fig6) displays the
    output of the Order Status Open ODS View.


    ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig6_HTML.jpg](images/508424_1_En_4_Chapter/508424_1_En_4_Fig6_HTML.jpg)


    *Figure 4-6. Output of ZTXT01 in Analysis for Microsoft Excel*


    You can notice that although the underlying `ORDER_STATUS` has six entries in
    total, the output of the `ZTXT01` Open ODS View returns only three of them. This
    is because the default language for my BW user is set as `EN`, so entries that
    have the `DE` value in the `LANGU` column are skipped. If I changed the language
    to `DE` when logging into the BW/4HANA system, the descriptions would be returned
    in German.


    Next, for the Categories dimension, we should follow the same steps as for the
    Order Status object. The only difference is that the `CATEGORIES` table is not
    language dependent, so we will not assign any column to the `Language Code` folder.
    Figure [4-7](#508424_1_En_4_Chapter.xhtml#Fig7) shows the output structure of
    the `ZTXT02` Category Open ODS View.


    ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig7_HTML.jpg](images/508424_1_En_4_Chapter/508424_1_En_4_Fig7_HTML.jpg)


    *Figure 4-7. Output structure of the Category (ZTXT02) Open ODS View*


    The source `CATEGORIES` table consists only of a key and text fields. The `CATEGORY_ID`
    column has been put under the `Representative Key Field` section, while the `CATEGORY_DESC`
    field was dragged under the `Long Text` folder. Figure [4-8](#508424_1_En_4_Chapter.xhtml#Fig8)
    presents the output of the Category Open ODS View.


    ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig8_HTML.jpg](images/508424_1_En_4_Chapter/508424_1_En_4_Fig8_HTML.jpg)


    *Figure 4-8. Output of ZTXT02 in Analysis for Microsoft Excel*


    As shown in Figure [4-8](#508424_1_En_4_Chapter.xhtml#Fig8), the output of the
    Category Open ODS View corresponds to the content of the source `CATEGORIES` table.'
  raw: '## Create the Texts Open ODS Views


    As visualized in Figure [4-2](#508424_1_En_4_Chapter.xhtml#Fig2), for the given
    scenario there will be two Open ODS Views set to the Texts semantics type. Their
    purpose will be the same as the role of regular InfoObjects in classic EDW architecture.
    The main difference is that Open ODS Views can be field-based, and they do not
    store any data. Open ODS Views retrieve data from the underlying objects (in our
    scenario the HANA calculation views) at query runtime.


    Let’s first focus on the data residing in the ORDER_STATUS table. This table contains
    the order status IDs and the order descriptions. Status descriptions are available
    in two languages: English and German. The column LANGU identifies the language
    for each entry in that table. The values E and D stored in that column follow
    standard SAP language codes. As a result, we will be able to support the functionality
    of displaying text dynamically in the user’s language.


    The first Open ODS View will be sourcing data from the CV_DIM_ORDER_STATUSES calculation
    view. The Semantics type for this Open ODS View is set to Texts. In the Open ODS
    View editor, we need to specify the proper output structure. Figure [4-5](#508424_1_En_4_Chapter.xhtml#Fig5)
    shows the output structure of the Order Status (ZTXT01) Open ODS View.


    ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig5_HTML.jpg](images/508424_1_En_4_Chapter/508424_1_En_4_Fig5_HTML.jpg)


    Figure 4-5.


    Output structure of Order Status (ZTXT01) Open ODS View


    When defining the output structure of the Open ODS View, first we need to fill
    in the Representative Key field, which uniquely identifies each record. In our
    case, it is a STATUS_ID column. The second key of that table is the LANGU column;
    however, we have a dedicated folder for language codes.


    Since the Order Status dimension will be language-dependent, we need to specify
    the column that will provision the language code values. In our case, we should
    put the LANGU column under the Language Code folder, as shown in Figure [4-5](#508424_1_En_4_Chapter.xhtml#Fig5).


    The last column that should be added to the output structure is the actual description
    field: STATUS_DESC. Depending on the source field length, it should be assigned
    under the proper Text-related folder. Table [4-1](#508424_1_En_4_Chapter.xhtml#Tab1)
    specifies the maximum number of characters supported, depending on Text folder
    type.


    Table 4-1.


    Open ODS View Text Types Definition


    | Text Folder | Max Field Length |

    | --- | --- |

    | Short Text | 20 |

    | Medium Text | 40 |

    | Long Text | 5000 |


    You might also add the same description field to multiple Text folders. This way,
    when showing, for example, Short Text, it will display only the first 20 characters
    of the string. If the source field length will be longer, the rest of the text
    will be cut off. In our scenario, the Status Name length is 30 characters, so
    I assigned it under the Medium Text folder (Figure [4-5](#508424_1_En_4_Chapter.xhtml#Fig5)).
    To check the output of the ZTXT01 Open ODS View, let’s open it in Analysis for
    Microsoft Excel. Figure [4-6](#508424_1_En_4_Chapter.xhtml#Fig6) displays the
    output of the Order Status Open ODS View.


    ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig6_HTML.jpg](images/508424_1_En_4_Chapter/508424_1_En_4_Fig6_HTML.jpg)


    Figure 4-6.


    Output of ZTXT01 in Analysis for Microsoft Excel


    You can notice that although the underlying ORDER_STATUS has six entries in total,
    the output of the ZTXT01 Open ODS View returns only three of them. This is because
    the default language for my BW user is set as EN, so entries that have the DE
    value in the LANGU column are skipped. If I changed the language to DE when logging
    into the BW/4HANA system, the descriptions would be returned in German.


    Next, for the Categories dimension, we should follow the same steps as for the
    Order Status object. The only difference is that the CATEGORIES table is not language
    dependent, so we will not assign any column to the Language Code folder. Figure
    [4-7](#508424_1_En_4_Chapter.xhtml#Fig7) shows the output structure of the ZTXT02
    Category Open ODS View.


    ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig7_HTML.jpg](images/508424_1_En_4_Chapter/508424_1_En_4_Fig7_HTML.jpg)


    Figure 4-7.


    Output structure of the Category (ZTXT02) Open ODS View


    The source CATEGORIES table consists only of a key and text fields. The CATEGORY_ID
    column has been put under the Representative Key Field section, while the CATEGORY_DESC
    field was dragged under the Long Text folder. Figure [4-8](#508424_1_En_4_Chapter.xhtml#Fig8)
    presents the output of the Category Open ODS View.


    ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig8_HTML.jpg](images/508424_1_En_4_Chapter/508424_1_En_4_Fig8_HTML.jpg)


    Figure 4-8.


    Output of ZTXT02 in Analysis for Microsoft Excel


    As shown in Figure [4-8](#508424_1_En_4_Chapter.xhtml#Fig8), the output of the
    Category Open ODS View corresponds to the content of the source CATEGORIES table.'
  trans: '# 创建文本型开放 ODS 视图


    如图 4-2 所示，针对给定的场景，我们将创建两个语义类型设置为“文本”的开放 ODS 视图。它们的作用与传统 EDW 架构中常规信息对象的角色相同。主要区别在于，开放
    ODS 视图可以基于字段，并且不存储任何数据。开放 ODS 视图在查询运行时从底层对象（在我们的场景中为 HANA 计算视图）检索数据。


    我们首先关注存储在 `ORDER_STATUS` 表中的数据。该表包含订单状态 ID 和订单描述。状态描述支持两种语言：英语和德语。`LANGU` 列标识了该表中每个条目的语言。该列中存储的值
    `E` 和 `D` 遵循标准 SAP 语言代码。因此，我们将能够支持以用户语言动态显示文本的功能。


    第一个开放 ODS 视图将从 `CV_DIM_ORDER_STATUSES` 计算视图中获取数据。此开放 ODS 视图的语义类型设置为 `Texts`。在开放
    ODS 视图编辑器中，我们需要指定正确的输出结构。图 4-5 显示了订单状态（`ZTXT01`）开放 ODS 视图的输出结构。


    ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig5_HTML.jpg](img/508424_1_En_4_Fig5_HTML.jpg)


    *图 4-5. 订单状态（ZTXT01）开放 ODS 视图的输出结构*


    在定义开放 ODS 视图的输出结构时，首先需要填写 `Representative Key` 字段，该字段用于唯一标识每条记录。在我们场景中，它是 `STATUS_ID`
    列。该表的第二个键是 `LANGU` 列；不过，我们有一个专门用于语言代码的文件夹。


    由于订单状态维度将依赖于语言，因此我们需要指定提供语言代码值的列。在我们的场景中，应将 `LANGU` 列放在 `Language Code` 文件夹下，如图
    4-5 所示。


    应添加到输出结构中的最后一列是实际的描述字段：`STATUS_DESC`。根据源字段长度，应将其分配到适当的“文本相关”文件夹下。表 4-1 根据文本文件夹类型指定了支持的最大字符数。


    *表 4-1. 开放 ODS 视图文本类型定义*


    | 文本文件夹 | 最大字段长度 |

    | --- | --- |

    | 短文本 | 20 |

    | 中文本 | 40 |

    | 长文本 | 5000 |


    你也可以将同一个描述字段添加到多个文本文件夹中。这样，例如在显示 `Short Text` 时，将只显示字符串的前 20 个字符。如果源字段长度更长，文本的其余部分将被截断。在我们的场景中，`Status
    Name` 长度为 30 个字符，因此我将其分配到了 `Medium Text` 文件夹下（图 4-5）。要检查 `ZTXT01` 开放 ODS 视图的输出，让我们在
    Analysis for Microsoft Excel 中打开它。图 4-6 显示了订单状态开放 ODS 视图的输出。


    ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig6_HTML.jpg](img/508424_1_En_4_Fig6_HTML.jpg)


    *图 4-6. 在 Analysis for Microsoft Excel 中 ZTXT01 的输出*


    你可以注意到，尽管底层 `ORDER_STATUS` 表中共有六个条目，但 `ZTXT01` 开放 ODS 视图的输出仅返回了其中三个。这是因为我的 BW
    用户的默认语言设置为 `EN`，因此 `LANGU` 列中值为 `DE` 的条目被跳过。如果我在登录 BW/4HANA 系统时将语言更改为 `DE`，描述将以德语返回。


    接下来，对于“类别”维度，我们应遵循与订单状态对象相同的步骤。唯一的区别在于 `CATEGORIES` 表不依赖于语言，因此我们不会将任何列分配到 `Language
    Code` 文件夹。图 4-7 显示了 `ZTXT02` 类别开放 ODS 视图的输出结构。


    ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig7_HTML.jpg](img/508424_1_En_4_Fig7_HTML.jpg)


    *图 4-7. 类别（ZTXT02）开放 ODS 视图的输出结构*


    源 `CATEGORIES` 表仅包含键字段和文本字段。`CATEGORY_ID` 列被放在了 `Representative Key Field` 部分，而
    `CATEGORY_DESC` 字段被拖到了 `Long Text` 文件夹下。图 4-8 展示了类别开放 ODS 视图的输出。


    ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig8_HTML.jpg](img/508424_1_En_4_Fig8_HTML.jpg)


    *图 4-8. 在 Analysis for Microsoft Excel 中 ZTXT02 的输出*


    如图 4-8 所示，类别开放 ODS 视图的输出与源 `CATEGORIES` 表的内容一致。'
- fmt: '# Create the Master Data Open ODS Views


    The third Open ODS View will be based on the `CV_DIM_PRODUCTS` view that sources
    data from the `PRODUCTS` table. Unlike the previous two tables, the `PRODUCTS`
    table, in addition to the key and text columns, contains additional attributes
    such as Brand and Price. Because of that, for Product during the Open ODS View
    creation we should select Master Data as the Semantics type. Figure [4-9](#508424_1_En_4_Chapter.xhtml#Fig9)
    presents the output structure of the Product Open ODS View.


    ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig9_HTML.jpg](images/508424_1_En_4_Chapter/508424_1_En_4_Fig9_HTML.jpg)


    Figure 4-9. Initial output structure of the Product (`ZDIM01`) Open ODS View


    In Figure [4-9](#508424_1_En_4_Chapter.xhtml#Fig9), you can see how the source
    fields from the `CV_DIM_PRODUCTS` calculation view (the Source Fields section)
    have been distributed between multiple folders (the View Fields section).


    - The `PRODUCTS` table primary key consists of two columns: `PRODUCT_ID` and `CATEGORY_ID`.
    The Open ODS View supports a compounding functionality for objects that cannot
    be defined uniquely based on a single field. As shown in Figure [4-9](#508424_1_En_4_Chapter.xhtml#Fig9),
    `PRODUCT_ID` is assigned to the Representative Key Field (1) folder.


    - The second column, which is part of the primary key (`CATEGORY_ID`), has been
    added under the Characteristics (Key) (2) folder. The purpose of this assignment
    is similar to the compounding functionality available for standard InfoObjects.


    - Under the Characteristics (3) folder you might find the `BRAND_DESC` column.
    Columns belonging to this section are the attributes of the Open ODS View Master
    Data object.


    - The Key Figures (4) section contains attributes of numeric data types. For the
    `ZDIM01` Open ODS View, the `PRICE` column was added to this section.


    - For currency and unit-related columns there is also a dedicated folder in the
    Open ODS View output structure. In the given scenario, I assigned the `CURRENCY`
    column to the Currency (5) folder.


    **Note**


    When consuming currencies or units coming from an external data in Open ODS View,
    you need to be aware that BW/4HANA expects that all these values will be maintained
    in the central SAP currency and unit tables. Records with currency/unit values,
    which are not available in standard SAP tables, will not be supported.


    - The Product Description column (`PRODUCT_DESC`) has been dragged to the Long
    Text (6) folder. This is because the `PRODUCT_DESC` column is 200 characters long.


    Figure [4-10](#508424_1_En_4_Chapter.xhtml#Fig10) presents an initial output of
    the Product Open ODS View.


    ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig10_HTML.jpg](images/508424_1_En_4_Chapter/508424_1_En_4_Fig10_HTML.jpg)


    Figure 4-10. Initial output of `ZDIM01` in Analysis for Microsoft Excel


    The output of the Product Open ODS View contains all the columns derived from
    the source `CV_DIM_PRODUCTS` calculation view. Worth noting is that key values
    for the Product field consist of Product ID and Category ID (i.e., `0001/AC003`).
    This is because we added a `CATEGORY_ID` column into the Characteristic (Key)
    section (see Figure [4-9](#508424_1_En_4_Chapter.xhtml#Fig9)).


    There are two minor adjustments that we can implement to provide even more information
    for the Product dimension. First, the Category field displays ID values, so the
    user doesn’t know what the actual category value is. Moreover, the Price field
    displays numbers without currency codes (the currency codes are displayed as a
    separate column). Let’s now switch back to the BW modeling tools. As you remember,
    we created the `ZTXT02` Text Open ODS View for the category data (Figure [4-7](#508424_1_En_4_Chapter.xhtml#Fig7)).
    This object contains a mapping between the category ID and the category name.
    Now we can utilize `ZTXT02` Open ODS View by applying an association to that object
    in the Product Open ODS View output structure. Figure [4-10](#508424_1_En_4_Chapter.xhtml#Fig10)
    illustrates how to define the association between the Category field and `ZTXT02`
    Open ODS View.


    ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig11_HTML.jpg](images/508424_1_En_4_Chapter/508424_1_En_4_Fig11_HTML.jpg)


    Figure 4-11. Association for the Category field in the `ZDIM01` Open ODS View


    To define the association between the field and the Open ODS View object, select
    the target field from the View Fields section. In the right pane, select the association
    type as Open ODS View. Then browse for the name of the Open ODS View, which you
    want to assign to that specific field. If you want to inherit the technical name
    of the associated object, select the Direct Usage of Associated Object by Name
    option. In the presented example (Figure [4-11](#508424_1_En_4_Chapter.xhtml#Fig11)),
    I assigned the `ZTXT02` Open ODS View to the `CATEGORY_ID` field and selected
    the option to use the associated object by name. After defining the association,
    in the View Fields section you will find information about the associated object
    next to the field name (Open ODS View icon and its technical name).


    The second adjustment that I wanted to apply was to assign the currency to the
    Price field. Click the `PRICE` field to display the Field Settings section (Figure
    [4-12](#508424_1_En_4_Chapter.xhtml#Fig12)).


    ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig12_HTML.jpg](images/508424_1_En_4_Chapter/508424_1_En_4_Fig12_HTML.jpg)


    Figure 4-12. Assigning the Currency element for the Price field in the `ZDIM01`
    Open ODS View


    When you open the Currency / Unit Element drop-down, in the list you will see
    the fields that are available under the Currency folder. In my case, there will
    be only one column (`CURRENCY`). I will use that column as a currency element
    (Figure [4-12](#508424_1_En_4_Chapter.xhtml#Fig12)).


    After applying these two changes, let’s again execute the `ZDIM01` object in Analysis
    for Microsoft Excel to validate the output. Figure [4-13](#508424_1_En_4_Chapter.xhtml#Fig13)
    presents the output of the updated `ZDIM01` object.


    ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig13_HTML.jpg](images/508424_1_En_4_Chapter/508424_1_En_4_Fig13_HTML.jpg)


    Figure 4-13. Final output of `ZDIM01` in Analysis for Microsoft Excel


    This time by choosing the Key and Text options for the Category field, we are
    able to see both keys and texts. All the Open ODS View field technical names start
    with the `2F` string. By default, the remaining part of the technical field name
    is generated as a concatenation of the Open ODS View name and the field name (i.e.,
    `2FZDIM01-BRAND_DESC`). In our example, the exceptions are the Product and Category
    fields.


    The name generated for fields that are assigned to the Representative Key Field
    group contain only the Open ODS View name. The Product field was set as the Representative
    Key field (see Figure [4-9](#508424_1_En_4_Chapter.xhtml#Fig9)); hence, its technical
    name is shown as `2FZDIM01` (Figure [4-13](#508424_1_En_4_Chapter.xhtml#Fig13)).


    The Category field has associations to the `ZTXT02` Open ODS View; hence, its
    name is inherited from that object. If we would like to keep the same naming convention
    as for other fields (`2F<Open ODS View name>_<field name>`), we should switch
    the selection from Direct Usage of Associated Object by Name to Usage of System-Wide
    Unique Name (Figure [4-11](#508424_1_En_4_Chapter.xhtml#Fig11)).


    The second change that was implemented for the `ZDIM01` Open ODS View refers to
    the Price field. The adjustment is also now reflected in the output shown in Figure
    [4-13](#508424_1_En_4_Chapter.xhtml#Fig13). You can see that each value displayed
    in the Price column now has the currency code assigned.'
