    ## Integrate the Orders Fact Data into a Single Calculation View


    For the fact data, we will follow the same approach as for the master data integration.
    This means that integration of transactional data will be also implemented on
    the HANA layer. Figure [6‑21](#508424_1_En_6_Chapter.xhtml#Fig21) presents a detailed
    approach for integrating SAP and non-SAP fact data into a single dataset.


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig21_HTML.jpg](images/508424_1_En_6_Chapter/508424_1_En_6_Fig21_HTML.jpg)


    *Figure 6‑21. Architecture for integrating SAP and non-SAP Orders fact data*


    The architecture shown in Figure [6‑21](#508424_1_En_6_Chapter.xhtml#Fig21) is
    similar to the one that we implemented for the Products master data. The main
    difference here is that for Facts, we will be generating an external calculation
    view from an ADSO. For Orders data, we will utilize the transactional `CV_FACT_ORDERS`
    calculation view that was created in Chapter [4](#508424_1_En_4_Chapter.xhtml)
    (see Figure [4‑14](#508424_1_En_4_Chapter.xhtml#Fig14)).


    To generate the calculation view from the `ZADS01` ADSO, in the ADSO properties,
    select the `External Calculation View` option (Figure [6‑22](#508424_1_En_6_Chapter.xhtml#Fig22)).


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig22_HTML.jpg](images/508424_1_En_6_Chapter/508424_1_En_6_Fig22_HTML.jpg)


    *Figure 6‑22. Generating an external SAP HANA view for the `ZADS01` ADSO*


    After activating the ADSO object, the system will generate the calculation view
    with the same name as the technical name of the ADSO. By default, the generated
    calculation view will be located in the same place as the one that was generated
    for InfoObject (the `system-local.bw.bw2hana` HANA package).


    As shown in Figure [6‑23](#508424_1_En_6_Chapter.xhtml#Fig23), the generated calculation
    view contains fields from the original ADSO. If the authorization is properly
    maintained, after running the data preview, we will be able to see the content
    of that view.


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig23_HTML.jpg](images/508424_1_En_6_Chapter/508424_1_En_6_Fig23_HTML.jpg)


    *Figure 6‑23. Definition of the external SAP HANA view for the `ZADS01` ADSO*


    As shown in Figure [6‑24](#508424_1_En_6_Chapter.xhtml#Fig24), the output of that
    view corresponds to the content of the source ADSO (see Figure [6‑2](#508424_1_En_6_Chapter.xhtml#Fig2)
    as a reference). In the next step, we need to perform an analysis of how to combine
    the SAP and non-SAP Orders data.


    ![../images/508424_1_En_6_Chapter/508424_1_En_6_Fig24_HTML.jpg](images/508424_1_En_6_Chapter/508424_1_En_6_Fig24_HTML.jpg)


    *Figure 6‑24. Output of the external SAP HANA view for the `ZADS01` ADSO*


