    Excel, by default it shows only the totals. For the given Open ODS View, the Total
    value of Quantity Ordered is 462 (Figure [5-14](#508424_1_En_5_Chapter.xhtml#Fig14)).


    ![../images/508424_1_En_5_Chapter/508424_1_En_5_Fig14_HTML.jpg](images/508424_1_En_5_Chapter/508424_1_En_5_Fig14_HTML.jpg)


    Figure 5-14.


    Display of ZBW4CUST attributes for ZCPFCT01 in Analysis for Microsoft Excel (referential
    integrity option selected)


    On the right side of Figure [5-14](#508424_1_En_5_Chapter.xhtml#Fig14), you can
    see the display after pulling all the customer-related attributes. At first glance,
    it looks like everything works as expected and the customer-related information
    is displayed properly. However, you might notice that once the customer information
    is added to the output, the total value for Quantity Ordered is not 462 but 405\.
    You may also realize that in the underlying ORDER_HEADER table there were five
    customers available, while the report output shows only three. This behavior is
    caused by the User Confirmed Referential Integrity option, which we selected when
    associating the ZBW4CUST InfoObject to the CUST_NUMBER field (Figure [5-12](#508424_1_En_5_Chapter.xhtml#Fig12)).
    With this option, every time the associated InfoObject or its navigation attribute
    is added to the output, the referential join is performed, and it filters out
    all the records that are not part of the master data of the associated InfoObject.
    This can cause confusion for the user, because depending on fields that are added
    to the output, we might see different results. This means that the User Confirmed
    Referential Integrity property (Figure [5-12](#508424_1_En_5_Chapter.xhtml#Fig12))
    should be used only if we know that referential integrity is ensured. In other
    words, we need to make sure that the master data of the associated InfoObject
    will cover all the values that are coming from the source table.


    Since in our scenario the Customer values that are coming from the external ORDER_HEADER
    table are not fully covered by the Customer master data, let’s now unselect the
    User Confirmed Referential Integrity property and activate the Open ODS View again
    (Figure [5-15](#508424_1_En_5_Chapter.xhtml#Fig15)).


    ![../images/508424_1_En_5_Chapter/508424_1_En_5_Fig15_HTML.jpg](images/508424_1_En_5_Chapter/508424_1_En_5_Fig15_HTML.jpg)


    Figure 5-15.


    Unselecting the Referential Integrity option for the Customer field in the ZFCT01 Open
    ODS View


    After activating the Open ODS View, we can check the output again by running it
    in Analysis for Microsoft Excel (Figure [5-16](#508424_1_En_5_Chapter.xhtml#Fig16)).


    ![../images/508424_1_En_5_Chapter/508424_1_En_5_Fig16_HTML.jpg](images/508424_1_En_5_Chapter/508424_1_En_5_Fig16_HTML.jpg)


    Figure 5-16.


    Display of the ZBW4CUST attributes for ZCPFCT01 in Analysis for Microsoft Excel
    (referential integrity option unselected)


    As shown in Figure [5-16](#508424_1_En_5_Chapter.xhtml#Fig16), after we changed
    the referential integrity option, the customer numbers 0100000014 and 0100000015
    are now available. Since the master data for these two customers is not maintained
    in the ZBW4CUST InfoObject, the attributes State, Company Name, and Address are
    blank. What is more, the value of Quantity Ordered is now consistent.


    Note


    When using the User Confirmed Referential Integrity property, you should be aware
    that at query runtime all values that were not found as part of the master data
    of the associated InfoObject will be inserted into the master data table of that
    InfoObject.'
  trans: '

    # 使用 ZBW4CUST 信息对象定义关联


    既然你已经掌握了如何应用关联，你可能会认为为字段分配另一个信息对象是小菜一碟。这在一定程度上是对的；然而，针对第二个需求，我们需要考虑额外的限制条件。


    在文档日期字段与 `0CALDAY` 信息对象之间应用关联时，我们无需担心这些对象之间的数据一致性。这是因为文档日期列的 `DATE` 数据类型已经约束了该列可能包含的值（仅限日期）。正因如此，我们避免了文档日期列包含
    `0CALDAY` 信息对象中不可用值的情况。对于客户字段，情况则有所不同。客户数据在外部数据源中维护；因此，我们无法确保 ID 始终与 `ZBW4CUST`
    信息对象主数据匹配。如场景所述，`ORDER_HEADER` 表包含两个不属于 `ZBW4CUST` 信息对象主数据的客户编号。请参见客户主数据值与 `ORDER_HEADER`
    表中客户唯一值的对比，如图 5-11 所示。


    ![../images/508424_1_En_5_Chapter/508424_1_En_5_Fig11_HTML.jpg](img/508424_1_En_5_Fig11_HTML.jpg)


    图 5-11. ZBW4CUST 信息对象与 ORDER_HEADER 表之间的客户编号对比


    如图 5-11 所示，信息对象 `ZBW4CUST` 包含三个客户值，而在 `ORDER_HEADER` 表中有五个客户编号。高亮的客户编号（`0100000014`
    和 `0100000015`）不属于 `ZBW4CUST` 主数据。要检查这种不一致性如何影响数据模型，让我们在 `CUST_NUMBER` 字段与 `ZBW4CUST`
    信息对象之间应用一个关联（图 5-12）。


    ![../images/508424_1_En_5_Chapter/508424_1_En_5_Fig12_HTML.jpg](img/508424_1_En_5_Fig12_HTML.jpg)


    图 5-12. ZFCT01 开放 ODS 视图中客户字段的关联


    要为 `CUST_NUMBER` 字段应用关联，请遵循与 `0CALDAY` 信息对象相同的步骤（图 5-3）。这次你应选择 `ZBW4CUST` 信息对象作为参考（图
    5-10）。此外，你可能会注意到选项 (1) 用户确认参照完整性已被选中（图 5-12）。如果你选择此选项，在查询运行时，系统将在字段 `CUST_NUMBER`
    与 `ZBW4CUST` 信息对象的技术表之间执行参照连接。结果，查询将仅返回两个表中都存在的条目。


    应用关联后，我们现在可以利用导航属性。按照图 5-4 所示的步骤启用 `ZBW4CUST` 信息对象的导航属性。图 5-13 显示了为 `ZFCT01` 开放
    ODS 视图启用的导航属性。


    ![../images/508424_1_En_5_Chapter/508424_1_En_5_Fig13_HTML.jpg](img/508424_1_En_5_Fig13_HTML.jpg)


    图 5-13. ZFCT01 开放 ODS 视图中的 ZBW4CUST 导航属性


    现在，让我们在 Analysis for Microsoft Excel 中打开 `ZFCT01` 开放 ODS 视图，检查关联是否按预期工作。


    ## 参照完整性设置的重要性


    在 Analysis for Microsoft Excel 中打开 `ZCPFCT01` 开放 ODS 视图的预览时，默认情况下只显示合计。对于该开放 ODS
    视图，订购数量的合计值为 462（图 5-14）。


    ![../images/508424_1_En_5_Chapter/508424_1_En_5_Fig14_HTML.jpg](img/508424_1_En_5_Fig14_HTML.jpg)


    图 5-14. ZBW4CUST 属性在 Analysis for Microsoft Excel 中针对 ZCPFCT01 的显示（选中参照完整性选项）


    在图 5-14 的右侧，你可以看到拉取所有客户相关属性后的显示。乍一看，一切似乎按预期工作，客户相关信息正确显示。然而，你可能会注意到，一旦将客户信息添加到输出中，订购数量的合计值不再是
    462，而是 405。你可能还会意识到，在底层的 `ORDER_HEADER` 表中有五个客户可用，而报告输出只显示三个。这种行为是由我们在将 `ZBW4CUST`
    信息对象关联到 `CUST_NUMBER` 字段时选择的“用户确认参照完整性”选项引起的（图 5-12）。使用此选项后，每次将关联的信息对象或其导航属性添加到输出时，都会执行参照连接，并过滤掉所有不属于关联信息对象主数据的记录。这可能会给用户带来困惑，因为根据添加到输出的字段不同，我们可能会看到不同的结果。这意味着，只有在我们知道参照完整性得到保证的情况下，才应使用“用户确认参照完整性”属性（图
    5-12）。换句话说，我们需要确保关联信息对象的主数据将涵盖来自源表的所有值。


    由于在我们的场景中，来自外部 `ORDER_HEADER` 表的客户值并未完全被客户主数据覆盖，现在让我们取消选中“用户确认参照完整性”属性，并重新激活开放
    ODS 视图（图 5-15）。


    ![../images/508424_1_En_5_Chapter/508424_1_En_5_Fig15_HTML.jpg](img/508424_1_En_5_Fig15_HTML.jpg)


    图 5-15. 在 ZFCT01 开放 ODS 视图中取消选中客户字段的参照完整性选项


    激活开放 ODS 视图后，我们可以通过在 Analysis for Microsoft Excel 中运行来再次检查输出（图 5-16）。


    ![../images/508424_1_En_5_Chapter/508424_1_En_5_Fig16_HTML.jpg](img/508424_1_En_5_Fig16_HTML.jpg)


    图 5-16. ZBW4CUST 属性在 Analysis for Microsoft Excel 中针对 ZCPFCT01 的显示（未选中参照完整性选项）


    如图 5-16 所示，更改参照完整性选项后，客户编号 `0100000014` 和 `0100000015` 现已可用。由于这两个客户的主数据未在 `ZBW4CUST`
    信息对象中维护，因此属性州、公司名称和地址为空。此外，订购数量的值现在保持一致。


    > **注意：** 使用“用户确认参照完整性”属性时，你应该意识到，在查询运行时，未在关联信息对象主数据中找到的所有值都将被插入到该信息对象的主数据表中。

