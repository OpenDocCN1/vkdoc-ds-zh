- "# 引言  \n\n本书适合任何希望了解 SAP BW/4HANA 平台知识的读者。通过本书，读者将学习 SAP BW/4HANA 的新功能与组件，并获得使用现代建模概念实施敏捷数据模型的实用经验。本书尤其推荐给曾使用过早期\
  \ SAP BW 版本、计划将系统升级至 SAP BW/4HANA 版本，或已开始探索 SAP BW/4HANA 并希望更深入了解其变化及新功能的 BI 开发人员、顾问和团队领导者。\
  \  \n\n本书包含以下章节：  \n\n**第 1 章：** SAP BW/4HANA 建模对象  \n本章对 SAP HANA 和 SAP BW/4HANA\
  \ 领域进行技术性介绍。它将引导读者了解主要建模对象，突出新功能，并解释如何创建这些对象。  \n\n**第 2 章：** 建模概念  \n本章介绍五种建模概念，强调其用法以及各自的优缺点。后续章节将运用这些建模概念来实现满足特定业务场景需求的解决方案。\
  \  \n\n**第 3 章：** 通过 BW/4HANA 发布 HANA 对象  \n本章将解释如何通过 BW/4HANA 层公开 HANA 对象，而无需创建持久化采集层。此外，读者还将学习如何在\
  \ BW 查询和 HANA 计算视图之间传递输入参数。  \n\n**第 4 章：** 创建基于字段的数据模型  \n本章介绍如何在 HANA 对象之上创建基于字段的数据模型。学习本章后，读者将了解如何在不使用\
  \ InfoObjects 的情况下实现星型模型。  \n\n**第 5 章：** 创建混合数据模型  \n本章解释用于混合基于字段的方法与 SAP InfoObjects\
  \ 的混合建模方法。通过这种方法，即使源对象中不包含额外信息，您也能为模型增强信息。  \n\n**第 6 章：** 将 SAP 和非 SAP 数据集成到单一数据模型中\
  \  \n本章演示如何整合 SAP 和非 SAP 数据，以创建一个提供 360 度数据视图的单一集成数据模型。  \n\n为了全面理解现代建模概念的各个方面，我建议从第\
  \ 1 章开始，并按顺序通读本书。  \n\n"
- "# 1. SAP BW/4HANA 建模对象  \n\n本章概述了 SAP BW/4HANA 应用程序中可用的主要建模对象。我将引导您了解来自 SAP HANA\
  \ 和 SAP BW/4HANA 两个领域的建模对象。在本章中，您将学习现有建模对象发生了哪些变化，以及有哪些新的建模构件。\n\n\n## 现代数据建模\n\n\
  SAP BW/4HANA 于 2016 年推出，作为下一代业务数据仓库，用以取代旧的 SAP BW 应用。BW 建模工具的核心设计界面现已统一。这意味着建模活动不再需要\
  \ SAP GUI。BW/4HANA 提供了一个全新的建模平台，为开发人员带来了诸多优势。\n\n-   简化的建模，建模对象从九个减少为四个\n-   专注于虚拟化能力并对其进行显著扩展\n\
  -   现代、易用、基于 Eclipse 的建模环境\n-   BW/4HANA 建模工具的统一用户界面（不再使用 SAP GUI 进行建模，SAP BEx 查询设计器已被基于\
  \ Eclipse 的查询设计器取代）\n-   适用于 BW 和 HANA 建模的单一环境\n\n从功能角度来看，除了所有新功能和特性之外，BW/4HANA\
  \ 最大的优势之一是其使用混合建模的能力。开发人员现在可以结合来自 SAP BW 和 SAP HANA 两个领域的建模工件。\n\nSAP BW 与 BW/4HANA\
  \ 在建模上的重大区别在于，后者实现了敏捷数据仓库能力，而这在该产品的先前版本中是缺失的。BW/4HANA 建模的重大变革在于其支持基于字段的建模方法，这节省了大量的开发时间和精力，尤其是在创建概念验证或试点数据模型时。尽管基于信息对象的建模仍然是企业数据仓库（EDW）的核心，但在某些场景下，仅仅为了交付一个原型而创建数十个信息对象是没有意义的。此外，业务部门通常需要一份临时的报告来对特定数据集进行分析。例如，业务部门可能需要一份仅用于某个特定项目或一次性活动（如数据抽取）的报告。在这种场景下，扩展现有的企业数据模型通常没有意义，因为这是一个巨大的工作量——开发人员需要进行适配差距分析，检查对现有模型的影响，考虑风险因素，最后基于设计来实施方案。借助\
  \ BW/4HANA，可以独立于 EDW 创建临时报告，甚至无需持久化数据，只需利用 HANA 的内存处理特性来实现逻辑，从而基于源表实时处理并显示结果。\n\n\
  BW/4HANA 的一大进步是虚拟化能力。这一概念利用了 HANA 虚拟表的特性，这些虚拟表随后可以被 BW/4HANA 建模对象消费。虚拟建模允许你在从其他数据库访问数据时避免数据持久化。通过虚拟化，可以将非\
  \ SAP 数据集成到 SAP 数据模型中，甚至创建基于外部数据源的独立数据模型。当然，在创建虚拟数据模型时，我们需要考虑性能限制。由于数据将来自外部系统，我们将无法获得\
  \ HANA 内存处理能力的任何好处。与标准 BW 数据模型（其中复杂的连接和表达式被预计算并物理存储）不同，在虚拟方法中，所有操作都将在用户运行报告时实时处理。\n\
  \n## 主要的 SAP HANA 建模对象\n\n如前所述，在 BW/4HANA 中，可以利用 SAP HANA 原生的建模工件。\n\nSAP HANA 中的两个主要建模对象是计算视图和表函数。计算视图是使用\
  \ SAP HANA 建模器视角的图形界面进行建模的，因此不需要深入的 SQL 知识。表函数是使用 SAP HANA 开发视角创建的，并且完全基于 SQL 脚本。\n\
  \n图形化计算视图（CV）是使用 SAP HANA 建模器视角进行建模的。它们用于建模业务逻辑，并按要求的数据集作为输出返回。使用计算视图，你可以执行数据操作功能，如连接、并集、聚合和排名，以及应用过滤器和创建计算列。逐节点构建的方法使得实现和维护复杂的业务逻辑变得容易。\n\
  \n过去，有三种计算视图：属性视图、分析视图和计算视图。在 SPS11 中，这种方法被统一了，所有三种视图类型都被一个名为`计算视图`的单一建模对象所取代。SAP\
  \ 还提供了将分析视图和属性视图迁移到计算视图的功能。尽管所有这些视图类型在 Eclipse 中仍然可用，但已弃用的那些不应再使用。\n\n表函数（TF）是基于\
  \ SQL 的建模对象，当图形化计算视图的功能不足以满足业务需求时使用。表函数的使用方式与计算视图类似，但主要区别在于整个逻辑是通过使用 SQL 脚本而非图形编辑器来开发的。此外，用于开发表函数的\
  \ Eclipse 视角也不同。与计算视图不同，表函数是使用 Eclipse 工具的 SAP 开发视角创建的。\n\n表函数用于实现业务逻辑，然而，从报表的角度来看，它们不能作为独立对象使用。一旦创建了表函数，需要先通过在其之上创建的计算视图进行暴露，然后才能在报表层使用。\n\
  \n表函数是作为 SQL 脚本计算视图的替代品而引入的。使用 Eclipse 迁移工具，开发人员可以自动将已弃用的基于脚本的计算视图转换为表函数。\n\n如你所见，对这两个对象进行建模的主要目的是在表或其他视图之上执行复杂的数据操作。在接下来的章节中，我将描述如何创建这些对象，并解释每个对象的用例、优势和局限性。\n\
  \n\n\n### 计算视图\n\n要开始使用计算视图，请转到 SAP HANA 建模器透视图，右键单击包，然后选择新建 ➤ 计算视图（图 1-1）。\n\n\
  ![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig1_HTML.jpg](img/508424_1_En_1_Fig1_HTML.jpg)\n\
  \n图 1-1\n\n创建新的计算视图\n\n选择“计算视图”选项后，将打开用于定义计算视图常规设置的窗口（参见图 1-2）。\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig2_HTML.jpg](img/508424_1_En_1_Fig2_HTML.jpg)\n\
  \n图 1-2\n\n新建信息视图窗口\n\n在图 1-2 中，有两个重要字段：\n\n1.  *名称*：这是一个必填字段，是计算视图的技术名称。\n\n2.\
  \  *数据类别*：此字段包含以下选项：\n    1.  *CUBE*：图形编辑器中的最后一个默认节点将是聚合。此类视图可被报表工具使用。至少需要指定一个输出列作为度量。\n\
  \n2.  *DIMENSION*：图形编辑器中的最后一个默认节点将是投影。此类视图不能被报表工具使用。所有输出字段都是属性（无法使用度量）。\n\n注意\n\n\
  一旦创建了计算视图，您将能够随时更改数据类别类型，而无需重建整个视图逻辑。\n\n提供计算视图详细信息后，下一步是在图形设计器中建模业务逻辑。计算视图是使用称为*节点*的构建块构建的。图形视图支持以下节点类型：\n\
  \n*   *连接*：连接操作用于基于特定列链接两个数据源。链接数据集时，您可以选择连接类型（参照、内连接、左外连接、右外连接、全外连接或文本连接），并可以指示连接基数（1..1、1..n、n..1、n..m）。\n\
  \n*   *并集*：这些操作用于合并两个或多个数据源。SAP HANA 是一个列式数据库，因此只要可能，使用并集节点总是比使用连接更好。\n\n*   *投影*：这是用于从目标源对象检索数据的节点。它允许您选择字段、应用过滤器或创建计算。投影节点可以使用以下源对象：表、虚拟表、视图、计算视图、表函数或模型中的任何其他节点。\n\
  \n*   *聚合*：这允许您基于所选属性聚合数据，并对所选度量应用基本聚合函数（`Sum`、`Min`、`Max`、`Count`、`Avg`、`Var`、`StdDev`）。\n\
  \n*   *排名*：在此节点内，可以根据排名定义过滤数据。此外，此节点允许您自动生成排名列。\n\n最常用的节点是 `Projection`，它只是从底层表读取数据。通过从面板中拖放节点来将节点添加到模型中（参见图\
  \ 1-3）。\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig3_HTML.png](img/508424_1_En_1_Fig3_HTML.png)\n\
  \n图 1-3\n\n向计算视图添加投影节点\n\n添加所有其他节点类型的方式相同。一旦我们将节点添加到模型中，下一步我们需要定义源表（或任何其他对象，如其他计算视图、表函数或数据库视图）。通过单击“添加对象”按钮，您可以搜索所需的视图或表。\n\
  \n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig4_HTML.png](img/508424_1_En_1_Fig4_HTML.png)\n\
  \n图 1-4\n\n向计算视图中的投影节点添加对象\n\n搜索对象时，您应键入其名称（图 1-4）。一旦找到并在“匹配项”部分中显示，选择它并单击“确定”继续。添加源对象的另一种方法是将其从左侧显示窗格直接拖放到节点上（节点上显示的“将元素拖放到此处”部分）。图\
  \ 1-5 显示了一个示例计算视图，该视图在采购凭证抬头（`EKKO`）和采购凭证项目（`EKPO`）两张标准 ERP 表之间，基于凭证编号列（`EBELN`）进行连接。\n\
  \n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig5_HTML.jpg](img/508424_1_En_1_Fig5_HTML.jpg)\n\
  \n图 1-5\n\n采购订单的计算视图\n\n如图 1-5 所示，此视图由四个节点组成：两个投影节点从两张采购表（`EKKO` 和 `EKPO`）中查询数据，连接节点合并这两张表，聚合节点是\
  \ `CUBE` 数据类别计算视图的默认节点。语义节点始终设置为所有类型计算视图的最后一个默认节点，并且无法删除。创建计算视图的更复杂场景将在后续章节中描述。\n\
  \n在您能够执行视图之前，与大多数 BW/4HANA 对象一样，视图需要被激活。要检查是否存在任何错误，您可以首先通过单击“验证”按钮来验证视图。一旦验证通过，您可以激活它，如图\
  \ 1-6 所示。\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig6_HTML.png](img/508424_1_En_1_Fig6_HTML.png)\n\
  \n图 1-6\n\n验证并激活计算视图\n\n在验证和激活期间，系统会检查模型是否存在任何错误，并相应地在“作业日志”选项卡（图 1-6）上显示激活状态。\n\
  \n有多种方法可以执行计算视图以显示结果。第一个选项是右键单击语义节点，然后选择“数据预览”选项。系统将打开一个新选项卡（图 1-7），您可以在“原始数据”选项卡上看到视图的输出（默认显示\
  \ 200 条记录）。\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig7_HTML.jpg](img/508424_1_En_1_Fig7_HTML.jpg)\n\
  \n图 1-7\n\n计算视图的数据预览\n\n第二个选项是右键单击左侧窗格（在“系统”选项卡上）包树中的计算视图名称。那里有两个选项可以运行视图：`Data\
  \ Preview` 和 `Generate Select SQL`。`Data Preview` 选项的工作方式与语义节点上的预览相同（参见图 1-7）。\n\
  \n`Generate Select SQL` 选项会打开 SQL 控制台，并基于该计算视图生成 SQL `SELECT` 语句。当您想要执行即席分析，将视图的输出与其他源对象（如其他计算视图或表）结合起来时，此选项非常有用。对计算视图\
  \ `CV_PURCHASE_ORDERS` 使用此选项时，会生成以下 SQL 代码：\n\n```\nSELECT\n\"EBELN\",\n\"EBELP\"\
  ,\n\"AEDAT\",\n\"MATNR\",\n\"MEINS\",\nsum(\"MENGE\") AS \"MENGE\"\nFROM \"_SYS_BIC\"\
  .\"BW4HANA/CV_PURCHASE_ORDERS\"\nGROUP BY \"EBELN\",\n\"EBELP\",\n\"AEDAT\",\n\"\
  MATNR\",\n\"MEINS\"\n```\n\n注意\n\n开发人员常问的一个问题是，是否可以将图形化计算视图的逻辑转换为 SQL 代码。答案是否定的。您可以从计算视图自动生成\
  \ SQL 查询，但这不会将整个视图逻辑转换为 SQL 连接和并集；相反，这只会在此计算视图之上创建一个 `SELECT` 语句。\n\n在开始使用计算视图时，即使视图逻辑已正确建模，您也可能会遇到一些问题。以下是您可能遇到的最常见问题：\n\
  \n\n\n#### 问题：在每个计算视图节点上执行数据预览时，输出中未返回数据，尽管底层表中存在数据。\n\n**原因：** 在计算视图属性中，`Session\
  \ Client` 被设置为默认客户端。\n\n**解决方案：** 在计算视图的语义中，进入 `视图属性` 选项卡，将 `默认客户端` 值从 `Session\
  \ Client` 更改为 `Cross Client`（参见图 1-10）。\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig10_HTML.jpg](img/508424_1_En_1_Fig10_HTML.jpg)\
  \  \n图 1-10 – 在计算视图中设置默认客户端\n\n---\n\n#### 问题：在 SQL 控制台中，开发者能够查询特定模式(schema)表中的数据，但在尝试对计算视图执行数据预览时，出现以下错误信息：\
  \  \n`Error: SAP DBTech JDBC: [258]: insufficient privilege`\n\n**原因：** 已为计算视图应用了\
  \ SQL 分析权限。\n\n**解决方案：** 在计算视图的语义中，进入 `视图属性` 选项卡，应用 `经典分析权限` 选项，而非 `SQL 分析权限`（参见图\
  \ 1-9）。另一种方法是将计算视图分配给已分配给用户或用户角色的 `分析权限` 对象。\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig9_HTML.jpg](img/508424_1_En_1_Fig9_HTML.jpg)\
  \  \n图 1-9 – 在计算视图中应用权限\n\n---\n\n#### 问题：在 SQL 控制台中，开发者能够查询特定模式(schema)表中的数据，但在尝试激活其中一个表之上的视图时，出现以下错误信息：\
  \  \n`Create Scenario failed: The following errors occurred: user is not authorized\
  \ (2950)`\n\n**原因：** 运行时对象由系统用户 `_SYS_REPO` 创建，该用户需要对该模式(schema)拥有 `SELECT` 权限。\n\
  \n**解决方案：** 将该模式(schema)的 `SELECT` 权限授予 `_SYS_REPO` 用户。您可以通过运行以下 SQL 代码来分配权限：\n\n\
  ```\nGRANT SELECT ON SCHEMA \"SCHEMA_NAME\" TO _SYS_REPO WITH GRANT OPTION\n```\n\
  \n图 1-8 展示了 SQL 控制台，其中包含将 `SELECT` 权限授予 `_SYS_REPO` 用户（针对名为 `TEST_SCHEMA` 的模式(schema)）的代码。\n\
  \n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig8_HTML.png](img/508424_1_En_1_Fig8_HTML.png)\
  \  \n图 1-8 – 授予权限给 `_SYS_REPO` 用户\n\n---\n\n计算视图是 SAP HANA 环境中的主要建模对象。得益于图形界面，开发者无需深入的\
  \ SQL 编程知识即可将大部分业务逻辑整合到数据模型中。计算视图提供了很大的开发灵活性，因此维护也不是一个大挑战。然而，在某些场景下，计算视图中可用的功能可能不足以满足需求。以下是\
  \ SAP HANA 计算视图的常见限制：\n\n-   无法使用图形视图实现循环功能（如 `WHILE <condition> DO` 等）。\n-   窗口函数（如\
  \ `LAG`、`LEAD`、`DENSE_RANK` 等）不可用。\n-   复杂的 SQL 函数（如 `STRING_AGG`、`WORKDAYS_BETWEEN`\
  \ 等）不可用。\n-   不支持应用程序函数库。\n\n幸运的是，还有另一种建模对象称为*表函数*，它支持更复杂的场景，但需要 SQL 编程知识。\n\n###\
  \ 表函数\n\n现在，让我们创建一个与上一节创建的计算视图逻辑相同的表函数。如图 1-5 所示，一个计算视图是通过对采购凭证抬头表（`EKKO`）和采购凭证项目表（`EKPO`）进行连接(join)而创建的。连接是在凭证编号列（`EBELN`）上进行的。\n\
  \n就我个人而言，在开始处理表函数逻辑时，我更喜欢在 SQL 控制台中构建整个代码。一旦我运行了代码并验证了结果，我会将 SQL 脚本复制到一个表函数对象中并进行必要的调整。通过这种方法，如果代码有任何问题，更容易进行调试，也可以预览该代码的结果。以下是连接\
  \ `EKKO` 和 `EKPO` 表的 SQL 代码：\n\n```\nSELECT EKPO.\"EBELN\", EKPO.\"EBELP\", EKKO.\"\
  AEDAT\", EKPO.\"MATNR\",  EKPO.\"MEINS\", EKPO.\"MENGE\"\nFROM \"TEST_SCHEMA\".\"\
  EKKO\" EKKO\nJOIN \"TEST_SCHEMA\".\"EKPO\" EKPO ON EKKO.\"EBELN\" = EKPO.\"EBELN\"\
  ;\n```\n\n图 1-11 展示了 SQL 控制台执行上述代码后的结果。\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig11_HTML.jpg](img/508424_1_En_1_Fig11_HTML.jpg)\
  \  \n图 1-11 – 用于连接 `EKPO` 和 `EKKO` 表的 SQL 脚本\n\n执行图 1-11 中提供的脚本后，您可以看到结果与上一节创建的计算视图的输出相同。下一步，我将把\
  \ Eclipse 视图从 SAP HANA 建模器切换到 SAP HANA 开发视图。如果此前未使用过该视图，首先需要从 `仓库` 选项卡创建一个仓库工作区，如图\
  \ 1-12 所示。\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig12_HTML.jpg](img/508424_1_En_1_Fig12_HTML.jpg)\
  \  \n图 1-12 – 创建仓库工作区菜单项\n\n为工作区提供名称和物理路径后，即可使用。在已创建的工作区下的树形结构中，我将找到想要在其中创建表函数的包。要打开向导，请右键单击特定包并选择\
  \ **新建 ➤ 其他**。将弹出一个选择向导。输入 **表函数** 以找到正确的对象，如图 1-13 所示。\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig13_HTML.png](img/508424_1_En_1_Fig13_HTML.png)\
  \  \n图 1-13 – 创建表函数向导\n\n选择 `表函数` 后，为表函数提供一个名称。继续操作后，将打开一个表函数编辑器。这里是粘贴实际 SQL 查询的地方。图\
  \ 1-14 显示了用于连接 `EKKO` 和 `EKPO` 表的表函数的最终定义。\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig14_HTML.jpg](img/508424_1_En_1_Fig14_HTML.jpg)\
  \  \n图 1-14 – 用于连接 `EKPO` 和 `EKKO` 表的表函数定义\n\n在图 1-14 中，我高亮显示了代码的重要部分，这些部分应始终由开发者明确定义。\n\
  \n1.  默认情况下，在创建新表函数时，编辑器使用您的本地模式(schema)。考虑将此值更改为其他用户可以访问的模式(schema)。在我看来，最合适的模式(schema)是\
  \ `_SYS_BIC`，这也是所有由计算视图生成的列视图(column views)的存储位置。\n\n    ```\n    FUNCTION \"_SYS_BIC\"\
  .\"BW4HANA::TF_PURCHASE_ORDERS\" ( )\n    ```\n\n2.  表值应设置为表函数的输出类型。\n\n3.  在此部分，您需要列出实际\
  \ SQL 代码中返回的所有列。您需要保持列顺序和列名（区分大小写）。此外，请确保数据类型与查询中返回的源列的所有数据类型一致。\n\n\n\n```sql\n\
  (\n    \"EBELN\" VARCHAR(10),\n    \"EBELP\" VARCHAR(5),\n    \"AEDAT\" DATE,\n\
  \    \"MATNR\" VARCHAR(18),\n    \"MEINS\" VARCHAR(2),\n    \"MENGE\" INT\n)\n```\n\
  \n2. 此部分为可选操作；但是，如果你在模式（schema）中使用表，并且在生产环境中的模式名称不同（例如，在开发环境中模式名为 `TEST_SCHEMA`，而在生产系统中，同一模式名为\
  \ `PROD_SCHEMA`），则始终应在 TF 定义中提供此参数。如果在表函数定义中提供了默认模式，则在传输到下一环境时，该模式将自动替换为目标系统的模式（基于模式映射定义）。\n\
  \n```\nRETURNS TABLE\n```\n\n1.  在最后的 `SELECT` 语句之前添加 `RETURN` 短语。\n\n```\nDEFAULT\
  \ SCHEMA \"TEST_SCHEMA\"\n```\n\n1.  添加你实际的 SQL `SELECT` 查询，后跟分号（`;`）。如果在表函数定义中使用了\
  \ `DEFAULT SCHEMA` 参数，则应从查询中移除所有模式名称（使用 `\"EKKO\"` 代替 `\"TEST_SCHEMA\".\"EKKO\"\
  `）。\n\n```sql\nSELECT EKPO.\"EBELN\", EKPO.\"EBELP\", EKKO.\"AEDAT\", EKPO.\"MATNR\"\
  , EKPO.\"MEINS\", EKPO.\"MENGE\"\nFROM \"EKKO\" EKKO\nJOIN \"EKPO\" EKPO ON EKKO.\"\
  EBELN\" = EKPO.\"EBELN\"\n```\n\n```\nRETURN\n```\n\n要测试该表函数，请转到 SQL 控制台并编写一条 `SELECT`\
  \ 语句，在 `FROM` 子句中提供 TF 的全名。\n\n```sql\nSELECT * FROM \"_SYS_BIC\".\"BW4HANA::TF_PURCHASE_ORDERS\"\
  \ ( ) ;\n```\n\n图 1-15 显示了 SQL 语句的结果，该语句从表函数中查询数据。\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig15_HTML.jpg](img/508424_1_En_1_Fig15_HTML.jpg)\n\
  \n**图 1-15** 查询采购订单的表函数\n\n创建并激活表函数后，为了使其输出可用于报表，需要创建一个计算视图，该视图将使用 TF 作为源。虽然此计算视图是在表函数之上创建的，但其属性将与常规计算视图相同（以图\
  \ 1-2 作为参考）。唯一的区别是，该视图将仅包含一个指向表函数对象作为源的投影节点。图 1-16 展示了一个从表函数查询数据的计算视图。\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig16_HTML.jpg](img/508424_1_En_1_Fig16_HTML.jpg)\n\
  \n**图 1-16** 基于采购订单表函数的计算视图\n\n使用表函数的缺点之一是容易出错。这里我列出了在处理表函数时常见的激活问题：\n\n| **问题：**\
  \ 激活表函数时，出现一般错误：*无法创建编录对象：一般错误；应为表函数定义 RETURN 语句* |\n| :--- |\n| **原因：** TF 定义中缺少\
  \ `RETURN` 短语。 |\n| **解决方案：** 在最后的 `SELECT` 语句之前添加 `RETURN` 短语。 |\n\n| **问题：** 激活表函数时，出现语法错误：*表函数对象中的语法错误：\"\
  END\" 附近的语法不正确* |\n| :--- |\n| **原因：** `SELECT` 语句后缺少分号。 |\n| **解决方案：** 在最后一个 `SELECT`\
  \ 语句后添加分号。TF 定义中的每个代码块后都应跟一个分号（`;`）。 |\n\n| **问题：** 激活表函数时，出现不匹配错误：*无法创建编录对象：返回类型不匹配*\
  \ |\n| :--- |\n| **原因：** TF 定义中列出的列与最终 `SELECT` 查询中列出的列不匹配。 |\n| **解决方案：** 确保指定的最终\
  \ `SELECT` 查询中的列列表和顺序与 TF 定义中列出的列列表和顺序匹配。始终显式定义列名，避免使用星号（`SELECT * FROM`...）从表中选择所有列。\
  \ |\n\n| **问题：** 激活表函数时，显示以下编码错误：*'<表函数名称>' 文件不支持编码 Cp1250；仅支持 UTF-8 编码。* |\n| :---\
  \ |\n| **原因：** 在 Eclipse 工具中默认文件编码设置为 `Cp1250`。 |\n| **解决方案：** 从 Eclipse 工具栏中，选择\
  \ **窗口** ➤ **首选项** ➤ **常规** ➤ **工作空间**，并将文本文件编码值设置为 `UTF-8`（参见图 1-17）。 |\n| ![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig17_HTML.png](img/508424_1_En_1_Fig17_HTML.png)\
  \ **图 1-17** Eclipse 文本文件编码 |\n\n你现在可能会想，既然表函数比计算视图功能更多，那为什么我还要考虑在每种情况下默认使用图形化视图而不是\
  \ TF 呢？以下是表函数的一些缺点：\n\n- **容易出错**：在表函数中编写的 SQL 代码需要遵循严格的规则。你需要始终记住保持列顺序，显式提供正确的数据类型，并在每个代码块后使用分号。\n\
  - **维护性**：对复杂 SQL 查询实施增强比图形化视图困难得多。\n- **SQL 知识**：开发人员需要精通 SQL 才能实现复杂且高性能的查询。\n\
  - **传递多值可选输入参数存在限制**。\n\n尽管存在所有这些缺点，我仍然倾向于使用表函数而非计算视图。这主要是因为在我的项目中，存在这样的情况：需要为复杂的计算视图增加图形化设计器不支持的功能。对于这些情况，我需要要么将整个逻辑重写为\
  \ SQL 代码，要么在现有计算视图之上创建一个表函数来应用图形化视图中无法实现的其他功能。无论如何，在可能的情况下，我建议坚持使用图形化方法，因为其易于维护。\n\
  \n\n\n### 虚拟表\n\n借助智能数据访问（SDA）功能，SAP HANA 提供了从外部系统引入数据的能力，而无需在 SAP HANA 数据库中复制这些数据。通过\
  \ SDA，开发人员可以轻松建立远程连接，从而能够创建虚拟表，并像访问本地 HANA 表一样访问这些对象。\n\n在 BW/4HANA 环境中，当创建非 SAP\
  \ 数据模型或将外部数据集成到 SAP 数据模型时，SDA 可以发挥重要作用。将来自多个系统（如 Oracle、SQL Server、Hadoop 等）的数据集成到单个\
  \ SAP 企业数据仓库中，能够实现新的分析能力。\n\nSDA 的另一个好处是它是一种成本效益高且节省时间的解决方案。首先，您无需复制数据并支付存储费用。当然，对于大型数据集和复杂模型，出于性能原因，可能仍然需要将外部数据持久化存储在\
  \ BW/4HANA 层。其次，无需设置和维护复制系统。此外，通过 SDA 访问的数据是实时的。借助虚拟表，您可以创建使用外部数据的查询，并将它们与驻留在 SAP\
  \ HANA 系统中的数据相结合。\n\n要开始访问远程数据源，您需要首先设置连接。最简单的方法是使用 Eclipse GUI 创建一个新的远程源（作为创建远程源的替代方法，您也可以使用\
  \ SQL 脚本）。要建立远程连接，请打开 SAP HANA 模型器透视图并展开 Provisioning 目录。然后右键单击 Remote Sources 文件夹，选择\
  \ New Remote Source，如图 1-18 所示。\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig18_HTML.jpg](img/508424_1_En_1_Fig18_HTML.jpg)\n\
  \n图 1-18\n\n创建远程源 (SDA)\n\n提供所有连接属性后，远程源对象将出现在 Remote Source 目录下。每个远程源将包含数据库名称以及所有可访问的模式和表的列表（见图\
  \ 1-19）。\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig19_HTML.jpg](img/508424_1_En_1_Fig19_HTML.jpg)\n\
  \n图 1-19\n\n远程数据源视图\n\n如图 1-19 所示，有一个名为 MSSQL 的远程连接，连接到名为 RMA 的数据库。此 RMA 数据库包含一个名为\
  \ dev 的模式，在该模式中有一个名为 dev_table 的表。此时，您还不能查询该表中的数据。\n\n要开始查询来自远程源表的数据，您需要首先创建一种称为*虚拟表*的\
  \ HANA 对象。需要为您之后想要访问的每个远程表创建虚拟表。\n\n提示\n\n在创建虚拟表之前，一个好的做法是创建一个专用于远程表的 SAP HANA 数据库模式。这样，所有虚拟表都会驻留在一个位置。\n\
  \n与远程源一样，有两种创建虚拟表的方法：使用 GUI 或 SQL 脚本。图 1-20 展示了一种创建虚拟表的图形化方法。\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig20_HTML.jpg](img/508424_1_En_1_Fig20_HTML.jpg)\n\
  \n图 1-20\n\n创建虚拟表\n\n注意\n\n对于每个远程源，您都需要获得创建虚拟表的授权。以下 SQL 查询授予此权限：`GRANT CREATE VIRTUAL\
  \ TABLE ON REMOTE SOURCE <SOURCE_NAME> TO <USER_NAME>`\n\n选择添加虚拟表的选项后，作为下一步，您需要输入虚拟表的名称和目标模式。一旦提供并确认此信息，虚拟表将在给定模式下创建。如果它是一个常规的\
  \ HANA 表，您可以开始在 SQL 控制台中使用虚拟表，或在图形视图中使用它。\n\n## 主要的 SAP BW/4HANA 建模对象\n\n在用于所有建模对象的\
  \ BW/4HANA SAP 统一用户界面中，开发人员现在可以使用 Eclipse 工具开发所有 BW 对象（见图 1-21）。另一个好处是，他们只需单击一下即可从\
  \ HANA 原生透视图切换到 BW/4HANA 建模透视图。为了开发 BW 工件，开发人员将使用 Eclipse 的 BW 建模透视图。每个 BW/4HANA\
  \ 工件都可以通过右键单击信息区域，选择新建，并选择相应的对象来创建（如图 1-21 所示）。\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig21_HTML.jpg](img/508424_1_En_1_Fig21_HTML.jpg)\n\
  \n图 1-21\n\nBW 建模透视图中的建模对象\n\n对于特定的 BW/4HANA 任务，仍然需要使用 SAP GUI。为了将其使用与建模活动统一起来，SAP\
  \ GUI 也已嵌入到 Eclipse 中。通过单击“打开 SAP GUI”按钮（或使用键盘快捷键 Ctrl+6），您可以在 Eclipse 工具中打开 SAP\
  \ GUI（见图 1-22）。\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig22_HTML.png](img/508424_1_En_1_Fig22_HTML.png)\n\
  \n图 1-22\n\nEclipse 中的 SAP GUI\n\nSAP BW/4HANA 通过将建模对象类型从九种限制为仅四种，简化了数据建模方法。就数据持久性而言，不再有称为\
  \ InfoCube、PSA、DSO 或 HybridProvider 的对象。它们全部被一个称为高级 DSO (ADSO) 的单一对象所取代。就虚拟层而言，以下遗留对象已合并为一个称为复合提供者的单一对象：MultiProvider、InfoSet\
  \ 和 VirtualProvider。还有一个名为开放 ODS 视图的新建模对象。开放 ODS 视图对象具有类似于旧 VirtualProvider 对象的功能。InfoObject\
  \ 的主要目的和功能保持不变。图 1-23 显示了 BW/4HANA 与旧版 SAP BW 系统相比如何简化了建模对象。\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig23_HTML.jpg](img/508424_1_En_1_Fig23_HTML.jpg)\n\
  \n图 1-23\n\nBW 与 BW/4HANA 中建模对象的比较\n\n最基本的建模对象是信息对象。该对象的主要功能在 BW/4HANA 版本中没有改变。在早期版本\
  \ SAP BW 上工作的开发人员将会熟悉此对象。在下一节中，我不会详细讨论 InfoObject 的属性；我将重点介绍那些在新建模方法中有用的功能。\n\n\
  开放 ODS 视图是代表虚拟建模层的对象。这意味着它们不持久化任何数据。使用开放 ODS 视图，开发人员可以将外部数据引入 BW 报告层。与 InfoObject\
  \ 不同，使用开放 ODS 视图，您可以决定基本的构建块是什么。它们可以基于 InfoObject、另一个开放 ODS 视图或原始字段构建。\n\n使用开放 ODS\
  \ 视图对象，开发人员可以轻松管理外部数据源并构建星型模式模型，而无需数据持久化。这意味着它们可以充当一种虚拟主数据或虚拟事实表。此外，借助开放 ODS 视图对象的基于字段的方法，我们避免了创建过多的\
  \ InfoObject，这在某些场景（概念验证、试点、表/视图数据供应）中不会带来任何价值，反而会因在系统中创建多个虚拟对象而产生额外的工作。\n\n\n\n\
  在 SAP BW/4HANA 中，像 DSO、InfoCube、PSA 和 HybridProvider 这些对象的功能现在已统一为单一建模对象。BW/4HANA\
  \ 用于数据持久化的主要对象是`ADSO`。与旧的 BW 持久化对象不同，`ADSO`不必仅基于`InfoObject`构建；它可以使用基于字段的建模方法实现。在某些业务场景下，需要创建临时报表、概念验证或基于外部源的模型，并将它们加载到\
  \ BW/4HANA 系统中。定义`ADSO`结构时，您可以简单列出所有所需字段和数据类型，然后激活对象。您也无需指定将为`ADSO`使用哪种构建块类型；您可以在单个`ADSO`中灵活地混合使用`InfoObject`与原始字段。\n\
  \n`CompositeProvider`是一个 BW/4HANA 对象，它集成了以前 MultiProvider、InfoSet 和 VirtualProvider\
  \ 的所有功能。`CompositeProvider`代表一个逻辑层，因此它不持久化任何数据（虚拟对象）。它允许您在创建用于报表的最终查询之前，合并来自多个`InfoProvider`或\
  \ HANA 计算视图的数据。一个良好的 BW/4HANA 建模实践是使用`CompositeProvider`作为逻辑层，该层随后被最终的`Query`对象消费。`CompositeProvider`支持两种主要操作：联接（Join）和联合（Union）。此外，随着\
  \ BW/4HANA 2.0 的最新发布，可以在单个`CompositeProvider`中组合多个联接和联合操作。得益于此，构建逻辑模型类似于构建计算视图。用于建模`CompositeProvider`的节点类型也与计算视图的节点类型几乎相同。您可以使用联接（join）、联合（union）、投影（projection）和聚合（aggregation）节点来实现结合`InfoProvider`和计算视图的复杂场景。\n\
  \nBW/4HANA 2.0 还进一步为`CompositeProvider`赋予了 HANA SQL 脚本功能。因此，`CompositeProvider`提供了实现基于\
  \ SQL 的计算列的能力。这是一个很好的改进，因为在旧的 BW 系统中一直缺少在特征上创建计算列的功能。借助此功能，您可以轻松创建计算列，例如，将两个`InfoObject`的值连接成一个字符串。所有\
  \ SQL 计算将在查询执行期间即时处理，这意味着对于复杂计算和大型数据集，性能可能会受到影响。SQL 脚本也可用于在`CompositeProvider`模型中消费的`InfoProvider`上实现过滤表达式。\n\
  \n总结一下，以下是 BW/4HANA 2.0 中`CompositeProvider`的主要优势和改进：\n\n* `CompositeProvider`可以将多个\
  \ PartProvider（`ADSO`、`Open ODS View`、`InfoObject`）合并到一个逻辑层中。\n* SAP HANA 计算视图作为\
  \ PartProvider 得到支持。\n* `CompositeProvider`的输出结构可以使用`InfoObject`、`Open ODS View`和原始字段的混合来构建。\n\
  * 投影、聚合、联接和联合建模节点均可用。\n* 联接操作提供了更大的灵活性，可以选择联接类型（内联接、参照联接、左外联接、右外联接、全外联接）、设置联接基数（n:m、1:n、n:1、1:1）以及使用联接运算符（`=`、`≠`、`<`、`≤`、`≥`、`>`）。\n\
  * 支持使用 SQL 脚本实现过滤表达式和计算列。\n\n`Query`对象用于报表，并可以被前端工具消费。它们可以在每个`InfoProvider`之上创建，但在我看来，最好总是创建一个`CompositeProvider`作为`InfoProvider`和最终`Query`对象之间的中间层。这提供了更大的灵活性，以便您将来需要对底层`InfoProvider`应用一些额外的逻辑或将其与其他`InfoProvider`组合。在这种情况下，您无需从头重新创建查询，只需增强逻辑层并继续使用当前查询即可。在\
  \ SAP BW/4HANA 中，不再支持 BEx Query Designer 工具。BEx Designer 的功能现已迁移到 Eclipse 平台。换句话说，BEx\
  \ Query Designer 的功能现在作为基于 Eclipse 的 Query Designer 提供。\n\n在本章中，我不会详细讲解查询的所有功能，因为其中大部分与\
  \ SAP BEx Query Designer 相同。本章侧重于数据建模能力；因此，我仅对 Query Designer 进行高层次概述。\n\nBW/4HANA\
  \ 系统中一个可能对建模有用的新对象是`Data Flow`对象。`Data Flow`对象以图形方式解释所选 BW/4HANA 对象之间的依赖关系。借助`Data\
  \ Flow`对象，您可以为数据流创建模板，并从图形模型生成所有对象。\n\n在接下来的部分中，我将对 BW/4HANA 对象进行高层次概述，并试图突出那些在我看来对新型建模方法有用的特性。\n\
  \n\n\n### InfoObject\n\n在使用 Eclipse BW 建模透视图创建新的 `InfoObject` 时，在 `General`（常规）选项卡上，您会找到两个用于生成外部\
  \ SAP HANA 视图的复选框。默认情况下，它们呈灰色不可用状态，但一旦您选中 `Master Data`（主数据）和 `Usable as InfoProvider`（可用作信息提供者）选项，它们就会变为可用状态（参见图\
  \ 1-24）。\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig24_HTML.jpg](img/508424_1_En_1_Fig24_HTML.jpg)\n\
  \n**图 1-24** InfoObject 外部 SAP HANA 视图选项\n\n如图 1-24 所示，`Master Data`（主数据）复选框激活了\
  \ `External SAP HANA View for Master Data`（主数据外部 SAP HANA 视图）选项，而 `Usable as InfoProvider`（可用作信息提供者）复选框激活了\
  \ `External SAP HANA View for Reporting`（报表外部 SAP HANA 视图）选项。激活视图后，您将看到从 `InfoObject`\
  \ 生成的每个 HANA 视图的位置。\n\n> **注意**  \n> 从 BW 对象生成视图的默认位置是 `system-local.bw.bw2hana`。但是，您可以使用事务代码\
  \ `RS2HANA_VIEW` 定义一个不同的位置。\n\n当我切换到 SAP HANA 建模器透视图并导航到图 1-24 所示的包路径时，我将看到两个已创建的\
  \ HANA 视图，它们是在 `InfoObject` 激活后生成的。第一个计算视图的名称与 `InfoObject` 相同。第二个视图的名称是 `InfoObject`\
  \ 名称后跟 `_REPORTING` 字符串的组合（参见图 1-25 作为参考）。\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig25_HTML.jpg](img/508424_1_En_1_Fig25_HTML.jpg)\n\
  \n**图 1-25** 从 InfoObject 生成的计算视图\n\n除了命名之外，这两个视图的主要区别在于：为 Master Data 对象生成的视图（`ZZPARTN`）属于\
  \ `DIMENSION`（维度）数据类别类型，这意味着它不能被报表工具消费，并且所有输出字段都是 `Attribute`（属性）类型。`ZZPARTN_REPORTING`\
  \ 是一个 `CUBE`（立方体）类型的计算视图，可用于报表，并且同时包含属性和度量。根据您的需求，您可以决定哪种类型的外部视图更适合您的场景。\n\n> **注意**\
  \  \n> 从 BW 对象生成外部 HANA 视图存在多种限制，因此您不应默认对每个 `InfoObject` 都选择该选项。有关从 BW/4HANA 系统生成\
  \ SAP HANA 视图的限制的更多信息，请参考官方 SAP 文档。\n\n外部 HANA 视图生成时带有 `SQL Analytic`（SQL 分析）权限。在生成外部\
  \ HANA 视图期间，每个视图还会生成一个新的角色。图 1-26 展示了为 `ZZPARTN` InfoObject 的两个外部视图生成的两个角色。\n\n\
  ![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig26_HTML.jpg](img/508424_1_En_1_Fig26_HTML.jpg)\n\
  \n**图 1-26** 为 InfoObject 外部视图生成的角色\n\n除非将这些角色分配给您的用户或分配给您的用户角色，否则在尝试执行外部视图时，您将遇到授权问题。为了避免每次创建新外部视图时都需要手动将生成的角色分配给用户，可以自动将这些角色分配给用户/角色（事务代码：`RS2HANA_ADMIN`、`RS2HANA_CHECK`）。\n\
  \n不应手动修改从 BW/4HANA 对象生成的外部视图。这是因为每次激活 `InfoObject` 时，外部视图都会重新生成，因此所有手动更改都将被默认设置覆盖。如果您想对该对象执行任何额外的数据操作，您需要创建一个常规的计算视图，并将外部视图作为源。在本书的后续章节中，我将介绍一些使用\
  \ `InfoObject` 外部视图的用例。\n\n我认为另一个有用的 `InfoObject` 功能是将 `SAP HANA View`（SAP HANA\
  \ 视图）选项设置为 `Read Access Type`（读取访问类型）参数。此功能可以在创建虚拟数据模型时使用。一旦设置了 `SAP HANA View`（SAP\
  \ HANA 视图）访问类型，您无需将任何数据加载到 `InfoObject` 结构中；相反，只需将 SAP HANA 视图指定为源，并在计算视图字段与 `InfoObject`\
  \ 属性之间应用关联即可（参见图 1-27）。\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig27_HTML.png](img/508424_1_En_1_Fig27_HTML.png)\n\
  \n**图 1-27** 具有 SAP HANA 视图访问类型属性的 InfoObject\n\n如图 1-27 所示，`InfoObject` `ZVPARTN`\
  \ 设置了 `SAP HANA View`（SAP HANA 视图）访问类型。它从位于 BW/4HANA 包中的计算视图 `CV_PARTNER` 读取数据。`InfoObject`\
  \ `ZVPARTN` 映射到计算视图的 `PARTNER_ID` 字段。`InfoObject` 属性 `0PLANT` 和 `0CALDAY` 分别映射到视图字段\
  \ `PLANT` 和 `CREATION_DATE`。\n\n从我的角度来看，BW/4HANA `InfoObject` 最后一个值得注意的特性是传递属性功能。我将基于图\
  \ 1-28 中显示的示例介绍此功能。\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig28_HTML.jpg](img/508424_1_En_1_Fig28_HTML.jpg)\n\
  \n**图 1-28** 传递属性的用例\n\n我创建了 `Partner`（合作伙伴）（`ZZPARTN`）`InfoObject`，并将其 `Plant`（工厂）（`0PLANT`）设置为导航属性。尽管与\
  \ `Partner`（合作伙伴）相关联的 `Plant`（工厂）信息可用，但报表需求是同时显示该 `Plant`（工厂）属性的 `Country`（国家）（`0COUNTRY`）和\
  \ `Region`（地区）（`0REGION`）值。这两个字段是 `Plant`（工厂）的导航属性。为了满足此需求，我打算将 `Plant`（工厂）及其属性都作为\
  \ `Partner`（合作伙伴）（`ZZPARTN`）`InfoObject` 的导航属性。可以通过为 `ZZPARTN` `InfoObject` 维护传递属性来满足此需求。在\
  \ `Attributes`（属性）选项卡上，右键单击 `Navigation Attributes`（导航属性）窗格并选择 \"Maintain transitive\
  \ attributes\"（维护传递属性）（图 1-29）。\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig29_HTML.png](img/508424_1_En_1_Fig29_HTML.png)\n\
  \n**图 1-29** InfoObject 的 \"Maintain transitive attributes\" 选项\n\n一旦您从维护窗口中选择 `Transitive\
  \ Attributes`（传递属性），这些属性将出现在 `Display and Navigation Attributes`（显示和导航属性）部分。在此部分中，有一个\
  \ `Transitive Attribute`（传递属性）列，基于该列您可以识别特定字段是常规属性还是传递属性。如图 1-29 所示，属性 `0COUNTRY`\
  \ 和 `0REGION` 在 `Transitive Attribute`（传递属性）列中被标记了标志 `true`。通过此配置，`Country`（国家）和\
  \ `Region`（地区）列可用于报表，尽管它们不会实际加载到 `Partner`（合作伙伴）（`ZZPARTN`）主数据表中。传递属性简化了开发、减少了维护工作并消除了冗余。\n\
  \n\n\n### 打开 ODS 视图（Open ODS View）\n\n在创建新的 `Open ODS View`（打开 ODS 视图）对象时，作为第一步，我们需要根据对象的用途，选择以下语义选项之一：`Facts`（事实）、`Master\
  \ Data`（主数据）或 `Texts`（文本）。如前所述，`Open ODS View` 对象不会持久化任何数据，因此作为第二步，系统会要求我们为 `Open\
  \ ODS View` 对象指明数据源。在 `BW/4HANA 2.0 SP04` 中，`Open ODS View` 对象支持以下源类型：\n\n- `DataSource\
  \ (BW)`（数据源 (BW)）\n- `Database Table or View`（数据库表或视图）\n- `Database Table or View\
  \ via Linked Database or MDC`（通过链接数据库或 MDC 的数据库表或视图）\n- `Virtual table using SAP\
  \ HANA Smart Data Access`（使用 SAP HANA 智能数据访问的虚拟表）\n- `Big Data`（大数据）\n- `DataStore\
  \ Object (Advanced)`（高级 DataStore 对象）\n- `Transformation`（转换）\n\n在为 `Open ODS View`\
  \ 对象选择源对象后，我们就可以开始根据源字段定义其结构。图 1-30 展示了 `Open ODS View` 对象建模编辑器的 `General`（常规）选项卡。\n\
  \n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig30_HTML.jpg](img/508424_1_En_1_Fig30_HTML.jpg)\n\
  \n**图 1-30**  \n**Open ODS View 编辑器：常规选项卡**\n\n无论创建 `Open ODS View` 对象时选择何种语义类型，`General`（常规）选项卡始终可用。对于给定的示例（图\
  \ 1-30），`Open ODS View` 对象使用 `CV_PARTNER` 计算视图作为源。`Edit`（编辑）选项允许您更改源对象。`Generate\
  \ Dataflow`（生成数据流）选项使您能够自动生成源对象与 `Open ODS View` 对象之间的数据源和 `ADSO`（包含转换和 `DTP`）。如果我们将来希望通过将底层数据持久化到\
  \ `ADSO` 中来提高性能，而无需更改 `Open ODS View` 结构，则此选项很有用。在本书的后续章节中，我将通过示例更详细地描述此功能。\n\n\
  `Open ODS View` 编辑器的第二个选项卡可能因所选的语义类型而异。在给定的示例中，我选择了 `Master Data`（主数据）作为语义类型；因此，第二个选项卡被命名为\
  \ `Master Data`（主数据）（见图 1-31）。\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig31_HTML.jpg](img/508424_1_En_1_Fig31_HTML.jpg)\n\
  \n**图 1-31**  \n**Open ODS View 编辑器，主数据选项卡**\n\n在此选项卡中，我将为 `Open ODS View` 对象建模其结构。在左侧窗格中，有一个名为\
  \ `Source Fields`（源字段）的区域，您可以在其中找到源对象中所有可用字段的列表。要选择应用于建模 `Open ODS View` 对象的源字段，您可以简单地将它们从\
  \ `Source Fields`（源字段）区域拖放到 `View Field`（视图字段）区域。对于 `Master Data`（主数据）类型的 `Open\
  \ ODS View` 对象，必须指明一个应放置在 `Representative Key Field`（代表键字段）组下的字段。在我的示例中，我将 `PARTNER_ID`\
  \ 字段设置为代表键字段。其余两个字段：`PLANT` 和 `CREATION_DATE` 被分配到 `Characteristic`（特性）部分。您可能还会注意到，`PARTNER_ID`\
  \ 和 `PLANT` 是原始字段，直接从源中获取，而 `CREATION_DATE` 字段已与 `0CALDAY` 信息对象关联。\n\n在本练习中，我创建了\
  \ `Open ODS View` `ZODSPARTN`，其功能与本书上一节中创建的 `InfoObject` `ZVPARTN` 类似。主要区别在于，要构建\
  \ `Open ODS View`，我不必使用任何单个 `InfoObject`（我使用 `0CALDAY` 进行字段关联只是为了演示功能）。得益于此，创建 `Open\
  \ ODS View` 对象极其灵活且快速。当您需要管理尚未在 `BW/4HANA` 环境中创建主数据的外部数据模型时，此对象尤其有用。这可以节省大量开发时间，而在使用旧的\
  \ `BW` 系统时，这些时间将用于为每个维度字段创建数十个 `InfoObject`。\n\n### 高级 DSO\n\n`Advanced DSO`（高级\
  \ DSO）由三个技术表组成：入站表、活动表和更改日志表。除了技术表之外，还会生成三个数据库视图（这些不是计算视图）：用于提取的视图、用于报表的视图和用于外部访问的视图。为\
  \ `ADSO` 生成的数据库对象存储在 `SAPABAP1` 模式中。表 1-1 展示了数据库生成的 `ADSO` 对象的命名模式。\n\n**表 1-1**\
  \  \n**为 ADSO 生成的数据库对象**\n\n| 对象类型 | 对象名称 | 描述 |\n| --- | --- | --- |\n| 表 | `/BIC/A*<ADSO\
  \ 名称>*1` | 入站表 |\n| 表 | `/BIC/A*<ADSO 名称>*2` | 活动数据表 |\n| 表 | `/BIC/A*<ADSO 名称>*3`\
  \ | 更改日志 |\n| 视图 | `/BIC/A*<ADSO 名称>*6` | 提取视图 |\n| 视图 | `/BIC/A*<ADSO 名称>*7` |\
  \ 报表视图 |\n| 视图 | `/BIC/A*<ADSO 名称>*8` | 外部访问视图 |\n\n每个技术表的行为可能因 `ADSO` 设置而异。通常，入站表充当新数据表并存储数据加载详细信息。活动表包含用于报表目的的数据。更改日志表跟踪\
  \ `ADSO` 内的所有数据更改。在 `BW/4HANA` 转换中使用 `ABAP` 或 `AMDP/SQL` 脚本实现例程时，可能会使用外部 `SQL HANA`\
  \ 视图。\n\n`ADSO` 编辑器由三个选项卡组成：`General`（常规）、`Details`（详细信息）和 `Settings`（设置）。图 1-32\
  \ 展示了 `ADSO` 编辑器的 `General`（常规）选项卡。\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig32_HTML.jpg](img/508424_1_En_1_Fig32_HTML.jpg)\n\
  \n**图 1-32**  \n**高级 DSO 编辑器：常规选项卡**\n\n在 `General`（常规）选项卡的左侧窗格中，您可以配置 `ADSO` 的建模属性。如图\
  \ 1-32 所示，`ADSO` 具有以下建模属性：\n\n- **标准 DataStore 对象**：此类型可以覆盖大多数报表场景。在此类型中，有额外的设置可用。\n\
  \    - **写入更改日志**：选择此选项后，加载数据时，增量将保存在更改日志表中。更改日志存储请求激活历史记录；因此，当选择此选项时，可以将数据回滚到请求激活之前的状态。\n\
  \    - **快照支持**：仅当选中 `Write Change Log`（写入更改日志）复选框时，此选项才处于活动状态。当 `ADSO` 始终以全量加载方式加载时，此选项很有用。加载请求中不可用的数据将从\
  \ `ADSO` 的活动表中删除并写入更改日志表。\n    - **唯一数据记录**：如果 `ADSO` 将始终加载唯一记录，则应选择此选项。这可以加速 `ADSO`\
  \ 的请求激活过程。如果数据集包含已存在于 `ADSO` 中的字段组合，则请求激活将失败。\n\n- **暂存 DataStore 对象**：对于此类型，不支持更改日志。有以下属性可用：\n\
  \    - **仅入站队列**：此类型的 `ADSO` 可用于暂存层，不能用于报表。所有数据都存储在单个入站表中。\n    - **压缩数据**：数据最初写入入站表。在激活期间，它们被压缩（基于语义键进行聚合）并加载到活动表中。在激活期间，关键指标要么相加，要么覆盖（取决于在转换级别定义的聚合类型）。由于不使用更改日志表，因此无法按请求执行删除操作。\n\
  \    - **启用报表**：此属性与 `Compress Data`（压缩数据）选项类似，区别在于在请求激活期间，入站表中的数据不会被删除。在报表场景中，数据取自活动表；但是，对于数据提取，将查询入站表。\n\
  \n\n\n*   `Data Mart DataStore Object`（数据集市数据存储对象）：此 ADSO 类型的行为与先前名为`InfoCube`的\
  \ BW 对象功能相同。当加载增量数据时（关键指标值不可覆盖；仅允许`MAX`、`MIN`和`SUM`聚合），应使用此类型。数据最初加载到入站表中。激活时，数据会被压缩并加载到活动表中。对于此类型的\
  \ ADSO，所有字段均被视为键。在报表中使用此类型的 ADSO 时，数据将从入站表和活动表的并集中获取，这意味着即使加载请求未被激活，报表也会返回所有数据。\n\
  \n*   `Direct Update DataStore Object`（直接更新数据存储对象）：使用此类型时，数据直接加载到活动表中。不使用其他技术表。无法进行请求激活，用于抽取和报表的数据始终从活动表中获取。数据可以通过`DTP`或\
  \ API 写入。\n\n除了建模属性之外，在 ADSO 编辑器的**常规**选项卡（图 1-32）上还有一个**数据分层属性**部分。使用此属性，您可以根据数据类别（热、温或冷）实施数据分层存储策略。\n\
  \n创建 ADSO 时可用的第二个选项卡是**详细信息**选项卡。在此选项卡上进行实际的 ADSO 建模。图 1-33 显示了名为`ZVADS_PO`的 ADSO\
  \ 的**详细信息**选项卡。\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig33_HTML.jpg](img/508424_1_En_1_Fig33_HTML.jpg)\n\
  \n**图 1-33** 高级 DSO 编辑器，详细信息选项卡\n\n创建新的 ADSO 时，您可以提供一个对象（`DataSource`、`InfoProvider`、`InfoObject`或`InfoSource`）作为模板。这样，所有`InfoObject`/字段都将从模板对象派生到\
  \ ADSO 结构中。当然，可以根据需要更改/移除其中的一些字段。在图 1-33 所示的示例中，创建 ADSO 时，我使用了`DataSource`作为模板。所选`DataSource`中的所有可用字段都已生成在**字段**部分中。您可能会注意到`ZVADS_PO`由原始字段组成。通过单击**添加\
  \ InfoObject** 或 **添加字段**，可以向**字段**部分添加新条目。**添加组**按钮允许您向 ADSO 字段结构中添加新文件夹。使用**移除**按钮，可以移除选定的字段。**重塑**按钮启用了图\
  \ 1-34 中所示的选项。\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig34_HTML.jpg](img/508424_1_En_1_Fig34_HTML.jpg)\n\
  \n**图 1-34** ADSO 字段重塑窗口\n\n选择字段`MATNR`并单击**重塑**按钮后，将打开**字段重塑**窗口（图 1-34）。可以选择以下活动之一：\n\
  \n*   `Replace by InfoObject`（替换为 InfoObject）：特定的字段/`InfoObject`将被替换为另一个`InfoObject`。\n\
  *   `Replace by Field`（替换为字段）：此特定字段/`InfoObject`将被替换为原始字段。给定的名称不应已在 ADSO 中使用。\n\
  *   `Fill with Value of InfoObject`（填充为 InfoObject 的值）：这会将给定`InfoObject`的值加载到重塑的字段/`InfoObject`中。\n\
  *   `Fill with Value of field`（填充为字段的值）：这会将给定字段的值加载到重塑的字段/`InfoObject`中。\n*   `Filled\
  \ by Constant Value`（填充为常量值）：这会将常量值加载到重塑的字段/`InfoObject`中（只能填充新元素）。\n\n在图 1-33 中，还有两个按钮：**管理键**和**维护属性**。根据\
  \ ADSO 配置，**管理键**按钮可以是非活动或强制性的。它用于指示唯一标识每条记录的键字段/`InfoObject`组合。\n\n使用**维护属性**按钮，我们可以设置字段/`InfoObject`的属性（聚合类型或主数据检查行为）。您可以在**详细信息**部分的右侧窗格中找到更多字段属性（单击特定字段/`InfoObject`后将出现该窗格）。\n\
  \n## `CompositeProvider`\n\n创建新的`CompositeProvider`时，与所有其他对象一样，第一步我们需要提供其技术名称。可选地，我们可以输入描述和要从中复制结构的另一个`CompositeProvider`的名称。在下一个屏幕上，我们可以选择源`PartProvider`和默认操作（连接或联合）。我们也可以通过单击**完成**并直接转到`CompositeProvider`编辑器来跳过此步骤。系统默认打开编辑器的**常规**选项卡，如图\
  \ 1-35 所示。\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig35_HTML.jpg](img/508424_1_En_1_Fig35_HTML.jpg)\n\
  \n**图 1-35** `CompositeProvider`，常规选项卡\n\n在此选项卡上，您可以配置`CompositeProvider`的运行时属性。此处还可以找到一个用于从`CompositeProvider`生成外部\
  \ SAP HANA 视图的复选框。您还可以指定此`CompositeProvider`是否可以作为提供者被另一个`CompositeProvider`使用（选项“此`CompositeProvider`\
  \ 可以添加到另一个 `CompositeProvider`”）。\n\n`CompositeProvider`编辑器的**方案**选项卡旨在实现实际的逻辑层。在此选项卡上，您可以指定源`PartProvider`并根据所需的业务逻辑定义适当的操作，以获得所需的输出。图\
  \ 1-36 显示了`CompositeProvider`编辑器的**方案**选项卡。\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig36_HTML.jpg](img/508424_1_En_1_Fig36_HTML.jpg)\n\
  \n**图 1-36** `CompositeProvider`，方案选项卡\n\n在我的示例中，我组合了来自三个不同对象的数据：Open ODS View 对象（`ZODSPARTN`）、`InfoObject`（`ZZPARTN`）和计算视图（`CV_PARTNER`）。联合运算符将来自所有底层对象的数据集组合起来，并将其字段从源映射到目标结构（图\
  \ 1-36）。在`CompositeProvider`的目标结构中，有三个`InfoObject`：合作伙伴（`ZZPARTN`）、工厂（`0PLANT`）和日历日（`0CALDAY`）。尽管对象`CV_PARTNER`和`ZODSPARTN`由原始字段组成（Open\
  \ ODS View 中的`0CALDAY`除外），但我能够将它们映射到目标`InfoObject`。在图 1-36 中，您还可以注意到字段`PARTN_PLANT`没有与任何`PartProvider`关联。这是一个计算列，可以通过右键单击**目标**部分并选择**创建计算字段**来创建。**计算字段**编辑器将在新窗口中打开，如图\
  \ 1-37 所示。\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig37_HTML.jpg](img/508424_1_En_1_Fig37_HTML.jpg)\n\
  \n**图 1-37** `CompositeProvider`，计算字段编辑器\n\n在**计算字段**编辑器中，首先我们应该定义字段类型：根据是维度还是度量，选择**特征**或**关键指标**。我们还应为计算字段提供名称和描述。可以使用“关联于”选项在计算字段与`InfoObject`或\
  \ Open ODS View 对象之间建立关联。在我的示例中，我保持此字段不与主数据对象关联。指定数据类型后，在**定义**部分我们可以输入 SQL 表达式。如图\
  \ 1-37 所示，我使用了以下 SQL 语法：\n\n```\n\"ZZPARTN\" || '_' || \"0PLANT\"\n```\n\n此表达式连接合作伙伴和工厂`InfoObject`的值，并在中间插入下划线。我建议您始终在\
  \ SQL 控制台（SAP HANA 模型器透视图）中测试代码，以验证其是否有效并返回所需结果。\n\n\n\n创建计算字段时，在 SQL 表达式中只能引用 `CompositeProvider`\
  \ 结构“目标”部分中可用的列。此外，表达式中指定的每个字段都应括在双引号中（例如 `“0PLANT”`）。\n\n`CompositeProvider` 编辑器中最后一个可用的选项卡是“输出”选项卡（图\
  \ 1-38）。\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig38_HTML.jpg](img/508424_1_En_1_Fig38_HTML.jpg)\n\
  \n图 1-38 – `CompositeProvider`，“输出”选项卡\n\n在 `CompositeProvider` “输出”选项卡的左窗格中，有一个“`提供程序字段`”部分，您可以在其中找到所有在“`场景`”选项卡中添加至输出的字段。除了列出的字段外，您还可以启用特定\
  \ `InfoObject` 的导航属性以供报表使用（如果可用）。如果您从“`提供程序字段`”列表中右键单击一个 `InfoObject`，将会看到“`导航属性`”选项（如果所选\
  \ `InfoObject` 没有导航属性，则该选项将变灰）。选择此选项后，“`导航属性`”窗口将出现，您便可以选择这些属性。在图 1-38 所示的示例中，您可以看到已为“工厂”（`0COUNTRY`）和“日历天”（`0CALMONTH`、`0CALYEAR`）添加了导航属性。\n\
  \n“`输出`”选项卡的右窗格用于设置输出字段的属性。在此部分中，您可以应用字段与 `InfoObject`/`Open ODS View` 之间的关联，调整字段名称和描述，或更改字段数据类型。您还可以在此处指定输出字段的报表属性（图\
  \ 1-38）。激活 `CompositeProvider` 后，即可将其用于报表。在下一节中，我将在该 `CompositeProvider` 之上创建一个查询以展示最终输出。\n\
  \n### 查询\n\n通过右键单击特定的 `InfoProvider` 并选择 **新建** ➤ **查询**（见图 1-39）来创建查询。或者，您也可以使用\
  \ Eclipse 任务栏（**文件** ➤ **新建** ➤ **查询**）来创建查询。\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig39_HTML.jpg](img/508424_1_En_1_Fig39_HTML.jpg)\n\
  \n图 1-39 – 在 `CompositeProvider` 上创建新查询\n\n在第一个屏幕上，照常需要提供查询的技术名称，并可选地提供描述。图 1-40\
  \ 显示了查询编辑器的“`常规`”选项卡。\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig40_HTML.jpg](img/508424_1_En_1_Fig40_HTML.jpg)\n\
  \n图 1-40 – 查询，“`常规`”选项卡\n\n以下是 `Query Designer` 中所有可用选项卡的概述（如图 1-40 所示）。\n\n- **常规**：此选项卡专用于设置通用查询属性（对第三方工具的可见性、默认显示选项、名称和描述等）。\n\
  - **筛选器**：用于设置查询筛选器和分配变量。\n- **工作表定义**：使您能够定义默认报表结构。您可以在此处指定可用于报表的字段列表，以及定义默认输出结构。\n\
  - **条件**：允许您根据定义的规则限制报表输出（例如，收入值最高的前 N 条记录）。\n- **异常**：在此处，您可以指定用于根据提供的范围高亮显示偏差的三色标度。\n\
  - **依赖项**：以图形化图表显示查询与其他查询组件（如变量、计算关键值、受限关键值）之间的依赖关系。\n- **运行时属性**：如果需要，可以更改默认的查询运行时属性（查询处理、缓存、优化参数等）。\n\
  \n为了演示上一节中创建的 `CompositeProvider`（`ZCP_PARTN`）的最终输出，我在其上添加了一个简单查询。图 1-41 显示了该查询的定义。\n\
  \n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig41_HTML.jpg](img/508424_1_En_1_Fig41_HTML.jpg)\n\
  \n图 1-41 – 在 `CompositeProvider` 对象 `ZCP_PARTN` 上定义查询\n\n如图 1-41 所示，查询 `ZQ_001`\
  \ 的输出中添加了八个字段。其中五个字段位于“`行`”部分，在打开报表时将默认显示。其余三个字段被添加到“`自由特征`”部分。默认情况下，这些字段在报表输出中不可见；但用户可以根据需要添加它们。图\
  \ 1-42 显示了查询 `ZQ_001` 在 `SAP Analysis for Microsoft Excel` 前端工具中的结果。\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig42_HTML.jpg](img/508424_1_En_1_Fig42_HTML.jpg)\n\
  \n图 1-42 – `SAP Analysis for Microsoft Office` 中的查询 `ZQ_001`\n\n正如查询对象中所定义的那样，在\
  \ `Analysis for Microsoft Excel` 工具中运行报表时，您可以在输出中看到默认显示的五个字段（图 1-42）。如果您查看数据源名称下可用的字段列表，则其余三个字段也可用。在上一节中，我将\
  \ `CompositeProvider` 定义为三个对象的联合：`HANA View`、`Open ODS View` 和 `InfoObject`。所有三个对象都包含相同的数据，因此您可以注意到每条记录都显示三次（除了仅存在于\
  \ `InfoObject` 中的 `#` 值）。每条记录的唯一区分因素是“`InfoProvider`”列，您可以在其中找到源“`部分提供程序`”信息。借助该列，您可以轻松识别每条记录的源对象。您可能会注意到，对于计算视图，显示的值是其技术名称\
  \ `2HG6AGKXYKFNVNVPEAIYQ1574LS`。这是因为 `BW/4HANA` 会生成其自己的 HANA 视图技术标识符，其名称始终以 `2H`\
  \ 字符串开头。\n\n\n\n### 数据流\n\n`数据流`对象有多种使用场景。首先，`数据流`对象可用于对流程流进行建模。在创建目标 BW/4HANA 对象之前，您可以先创建一个`数据流`对象来对所需的流程进行建模。要创建`数据流`对象，只需右键单击`信息区域`并选择`新建\
  \ ➤ 数据流对象`。提供对象名称后，`数据流`编辑器将打开（参见图 1-43）。\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig43_HTML.jpg](img/508424_1_En_1_Fig43_HTML.jpg)\n\
  \n图 1-43\n\n`数据流`对象编辑器\n\n在右侧窗格（图 1-43）中，您可以看到可用于创建流程流的对象类型列表。您可以通过拖放功能，或右键单击建模区域并选择`新建`选项，将其添加到模型中。您还可以通过选择`添加对象`选项并提供对象名称，将现有的\
  \ BW/4HANA 对象包含到模型中。将对象添加到模型后，您可以使用箭头将它们连接起来，以描述依赖关系。图 1-44 显示了一个示例性的数据流模型。\n\n\
  ![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig44_HTML.jpg](img/508424_1_En_1_Fig44_HTML.jpg)\n\
  \n图 1-44\n\n在`数据流`对象中创建的模型\n\n如图 1-44 所示，该数据流由两个数据源（`SOURCE_1` 和 `SOURCE_2`）组成，它们与两个\
  \ ADSO（`ADSO_1` 和 `ADSO_2`）相关联。还有一个未链接到任何数据源的`开放 ODS 视图`对象（`ODS_1`）。`复合提供者`（`CP_FINAL`）被建模为一个逻辑层，并组合来自`开放\
  \ ODS 视图`和`高级 DSO` 的数据。在`数据流`模型中显示的对象与实际 BW/4HANA 对象无关。创建的数据流模型只是一个模板，后续可将其用作创建实际对象的参考。\n\
  \n`数据流`对象的另一个重要用途是能够根据数据流模型生成持久对象。这意味着在创建流程流模板之后，我们可以将模型中的对象转换为实际的 BW/4HANA 对象。从底层的对象开始始终是个好办法。这样，输出结构可以从较低层对象向上层对象传递。双击`数据源`对象后，我可以定义其属性并将其激活。完成后，数据流图将相应更新（参见图\
  \ 1-45）。\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig45_HTML.jpg](img/508424_1_En_1_Fig45_HTML.jpg)\n\
  \n图 1-45\n\n将数据流模型转换为实际对象\n\n如图 1-45 所示，在创建了一个实际的数据源以取代 `SOURCE_1` 对象后，模型已更新。创建数据源\
  \ `ZDS_PURCH_ORD` 后，我单击了 `ADSO_1` 对象，并创建了一个名为 `ZADSO_PO` 的实际`数据存储对象`。该 ADSO 的结构继承自底层数据源。在图\
  \ 1-45 中，我还高亮显示了从模型生成转换的功能。对于`数据传输进程`也是如此。这种建模方法允许您先为流程创建概念，然后将此概念转换为可行的解决方案。这可以节省时间，因为从数据流生成对象比在`项目浏览器`中逐个手动创建要快一些。\n\
  \n如果`数据流`对象完全由持久的 BW/4HANA 对象组成，您就可以使用生成流程链的功能。该功能可从数据流工具栏中获得，如图 1-46 所示。\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig46_HTML.jpg](img/508424_1_En_1_Fig46_HTML.jpg)\n\
  \n图 1-46\n\n从数据流生成流程链\n\n点击`流程链`按钮时，首先需要提供流程链名称。输入名称后，将打开一个嵌入了`SAP GUI`会话的新`Eclipse`选项卡（参见图\
  \ 1-47）。\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig47_HTML.jpg](img/508424_1_En_1_Fig47_HTML.jpg)\n\
  \n图 1-47\n\n流程链窗口\n\n图 1-47 显示来自数据流模型的`数据传输进程`已自动插入到流程链定义中。如果修改了`数据流`对象，这些更改不会自动反映在流程链中。您需要手动合并这些更改，或从`数据流`对象生成新的流程链。\n\
  \n也可以为现有的 BW/4HANA 对象生成`数据流`对象。要为特定对象打开`数据流`对象，请转到`项目浏览器`列表，右键单击该对象，然后选择`探索数据流`选项（图\
  \ 1-48）。\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig48_HTML.jpg](img/508424_1_En_1_Fig48_HTML.jpg)\n\
  \n图 1-48\n\n显示现有对象的数据流\n\n默认情况下，为现有对象打开的数据流以折叠视图显示，因此可能并非所有对象和依赖关系都可见。在数据流编辑器中，您可以向下或向上展开数据流以查看其他对象。将鼠标悬停在特定节点上时，您会看到箭头符号，这使您可以缩小数据流范围（图\
  \ 1-49）。\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig49_HTML.png](img/508424_1_En_1_Fig49_HTML.png)\n\
  \n图 1-49\n\n`数据流资源管理器`\n\n图 1-49 显示了名为 `ZCP_PARTN` 的`复合提供者`的数据流。它由三个对象组成：`计算视图`、`开放\
  \ ODS 视图`和`信息对象`。展开名为 `ZZPARTN` 的`信息对象`的数据流后，我们还可以看到用于将主数据加载到`信息对象`属性中的`数据源`和`源系统`。值得一提的是，当您双击一个计算视图时，系统会在一个新的`Eclipse`选项卡中打开该计算视图的定义（即使它是\
  \ HANA 组件而非 BW/4HANA）。在分析现有数据流时，探索数据流功能非常有用。\n\n我想强调的最后一个特性是数据流文档功能。此功能可以描述每个`数据流`节点的作用。文档既可以添加到持久节点，也可以添加到概念节点。图\
  \ 1-50 展示了如何为特定节点添加文档。\n\n![../images/508424_1_En_1_Chapter/508424_1_En_1_Fig50_HTML.png](img/508424_1_En_1_Fig50_HTML.png)\n\
  \n图 1-50\n\n记录数据流\n\n如图 1-50 所示，右键单击特定节点后，您可以选择`显示文档`选项。在`文档`部分，有一个选项可以输入描述特定对象的任何文本。在展示的示例中，我为\
  \ `ZZPARTN` `信息对象`节点添加了文档。这可能有助于其他开发人员理解整个流程以及单个对象的作用。\n\n> **注意**  \n> 输入的文档仅在特定数据流的上下文中可见。如果您创建了一个新的数据流，则所有节点的文档部分都将为空，即使某些对象可能已经在不同的数据流中被记录。\n\
  \n好的，作为高级文档工程师和翻译员，我将严格遵守注意事项和示例格式，为您提供专业、准确的中文翻译。\n\n\n## 总结\n\n在本章中，我们探讨了 SAP\
  \ HANA 和 SAP BW/4HANA 中可用的建模对象。对于 SAP HANA 原生环境，描述了以下建模工件：\n\n-   计算视图\n-   表函数\n\
  -   虚拟表\n\n对于 BW/4HANA，我重点描述了新的建模对象，并强调了现有 SAP BW 对象的新功能。本章介绍了以下 BW/4HANA 对象的特性：\n\
  \n-   信息对象\n-   开放 ODS 视图\n-   高级 DSO\n-   组合提供者\n-   查询\n-   数据流\n\n"
- "# 2. 建模概念\n\n在本章中，我将描述 SAP BW/4HANA 引入的新建模方法。这个新的 SAP 商务仓库应用程序不仅显著增强了传统 SAP BW\
  \ 的能力，而且从根本上革新了建模方法。这些知识将是理解新的数据仓库功能、自底向上建模方法以及虚拟数据建模概念的关键。\n\n## SAP BW/4HANA 建模概念概述\n\
  \n凭借新的功能和工件，BW/4HANA 实现了基于分层可扩展架构++（LSA++）的现代化架构。这种新架构更精简、更简单，并且实施速度更快。此外，它支持虚拟化方法，这意味着它可能也更经济高效。\n\
  \nLSA++是传统 LSA 的扩展，传统 LSA 适用于 SAP BW 系统。除了减少建模对象的数量外，LSA++还定义了构建数据仓库的全新标准。图 2-1\
  \ 展示了 LSA 和 LSA++方法之间的差异。\n\n![../images/508424_1_En_2_Chapter/508424_1_En_2_Fig1_HTML.jpg](img/508424_1_En_2_Fig1_HTML.jpg)\n\
  \n*图 2-1. LSA 与 LSA++的差异*\n\n如图 2-1 所示，传统的 LSA 基于多个层。在每个层上，数据都被物理存储，这使得 LSA 架构具有高度的数据冗余。由于需要创建大量对象，维护此类架构既复杂又不灵活。缺乏灵活性、高维护量和开发工作量都显著增加了数据仓库的成本。高度的数据冗余和自上而下的建模方法都导致了单体架构，这种架构无法作为敏捷软件开发方法的一部分使用。\n\
  \nSAP BW/4HANA 环境引入了新的、现代化的 LSA++架构，该架构高度关注虚拟对象。如图 2-1 所示，无需创建多个暂存层并将数据从一个层复制到另一个层。现在可以直接在数据采集层之上构建虚拟数据集市。如果需要一个以上的暂存层，`CompositeProvider`可以跨层虚拟地组合数据。另一个虚拟化能力是在物理上驻留在不同数据库中的虚拟表之上创建报表。这意味着无需将外部数据加载到\
  \ SAP 数据库即可进行报表生成（当然，对于非常大的数据集，这可能会导致性能问题）。\n\n`ADSO`支持的持久层可以使用`InfoObject`定义，也可以使用基于字段的建模来定义，后者可以显著加速开发。得益于此方法，开发人员可以快速创建持久层，并在需要时，稍后通过在`CompositeProvider`级别关联主数据对象来丰富模型。\n\
  \nSAP BW/4HANA 和新 LSA++架构提供了更大的灵活性，并显著减少了维护、数据存储和开发时间。在本章中，我将介绍 SAP BW/4HANA 2.0\
  \ 中可用的一般建模概念。\n\n> **注意**  \n> 本章描述的建模概念将重点介绍 BW/4HANA 2.0 的功能和特性。请注意，对于所有场景，并没有单一的推荐架构。也不可能涵盖所有可能的方法；因此，我将展示我认为常见的方法。对这些概念的讨论将在本书后续章节中通过示例进行说明。\n\
  \n## 传统数据模型\n\n传统的 BW 建模遵循自上而下的方法，在创建任何模型之前，需要为每一个输出字段创建一个`InfoObject`。图 2-2 展示了在\
  \ BW/4HANA 中创建经典 EDW 的高级方法。\n\n![../images/508424_1_En_2_Chapter/508424_1_En_2_Fig2_HTML.jpg](img/508424_1_En_2_Fig2_HTML.jpg)\n\
  \n*图 2-2. BW/4HANA 经典建模概念*\n\n图 2-2 展示了一个经典 BW 建模方法的简化场景。该图也可作为比较经典方法与新敏捷建模概念的参考。\n\
  \n在经典建模方法中，在创建事务性`ADSO`之前，我们需要首先定义属性、关键指标和主数据`InfoObject`。在图 2-2 中，您可能会注意到`InfoObject\
  \ 2`和`InfoObject 3`之间的链接。这是因为主数据`InfoObject`由属性和导航属性组成。在我们能够实现数据模型的草稿版本之前，我们需要首先以`InfoObject`的形式创建所有基本构建块。如图\
  \ 2-2 所示，事实`ADSO`完全基于`InfoObject`建模。图中的实线表示来自数据源的数据被加载到目标对象中。在`ADSO`之上是一个`CompositeProvider`，它允许我们组合来自多个提供者的数据。虽然我们可以直接在`ADSO`上创建\
  \ BW 查询对象，但最好还是利用`CompositeProvider`，它提供了额外的功能，并允许我们包含其他`InfoProvider`。\n\n经典的 BW/4HANA\
  \ 方法导致开发周期长和维护工作量大。尽管有其缺点，但从我的角度来看，经典方法仍然是实现 SAP 数据的企业数据仓库的基本方式。在这种方法中，数据模型依赖于稳定且可重用的结构。数据持久性确保了高性能的解决方案。除了适配\
  \ SAP 业务内容，我们还可以利用预定义的数据模型。我们可以使用它们来快速启动交付 EDW 解决方案，并将其作为进一步开发的指南。\n\n在本节的下一部分，我将描述一些新的建模概念。\n\
  \n> **注意**  \n> 请注意，在接下来的新建模概念的讨论中，HANA 物理表和虚拟表可以以相同的方式使用（尽管有时图中只展示一种表类型）。\n\n\n\
  \n### 虚拟数据供应\n\n我要介绍的第一个概念是基于 SAP HANA 工件进行报表。可能存在这样一种场景：我们只想在 BW/4HANA 系统中启用 SAP\
  \ HANA 物理表或虚拟表的结构和内容。在图 2-3 中，你可以看到直接从 HANA 表进行数据供应的概念。\n\n![../images/508424_1_En_2_Chapter/508424_1_En_2_Fig3_HTML.jpg](img/508424_1_En_2_Fig3_HTML.jpg)\n\
  \n图 2-3. BW/4HANA 表数据供应概念\n\n图 2-3 所示的概念展示了我们如何通过 BW/4HANA 层暴露 HANA 表。在这种方法中，`Open\
  \ ODS View` 对象作为 `CompositeProvider` 和 HANA 表之间的虚拟 BW/4HANA 对象。它们可以被 `CompositeProvider`\
  \ 消费，以提供来自底层 HANA 表的数据，而无需任何数据持久化。此概念利用了基于字段的方法，因此我们无需创建任何 `InfoObject`。所有字段都可以简单地从底层表结构拖拽到\
  \ `Open ODS View` 对象的目标结构中。然后，`Open ODS View` 对象可以被 `CompositeProvider` 消费（我们也可以选择直接在\
  \ `Open ODS View` 对象之上创建查询）。图中的虚线表示数据流是完全虚拟化的，因此不需要数据加载。此类需求在数据抽取、临时数据分析或原型设计场景中非常常见。\n\
  \n下一个概念与图 2-3 所示类似；然而，这里我们使用一个虚拟表作为源，该虚拟表物理上驻留在 HANA 数据库之外（例如，在 Microsoft SQL 或\
  \ Oracle 数据库中）。图 2-4 描述了虚拟表数据供应的概念。\n\n![../images/508424_1_En_2_Chapter/508424_1_En_2_Fig4_HTML.jpg](img/508424_1_En_2_Fig4_HTML.jpg)\n\
  \n图 2-4. BW/4HANA 虚拟表数据供应概念\n\n使用 `Smart Data Access (SDA)`，我们可以创建一个连接到外部数据库的远程源。一旦配置好远程源，我们将能够在\
  \ HANA 系统中创建一个虚拟表，其结构与驻留在外部数据库中的源表相同。`Open ODS View` 对象使我们能够直接从 HANA 表和虚拟表获取数据。在图\
  \ 2-4 所示的图表中，`Open ODS View` 对象是在虚拟表之上创建的。\n\n在需要对源表应用一些额外的数据处理，或者创建结合了多个表（包括虚拟表和普通表）的数据集时，我们可以利用计算视图的功能（见图\
  \ 2-5）。\n\n![../images/508424_1_En_2_Chapter/508424_1_En_2_Fig5_HTML.jpg](img/508424_1_En_2_Fig5_HTML.jpg)\n\
  \n图 2-5. BW/4HANA 计算视图数据供应概念\n\n图 2-5 所示的变体与之前的类似。区别仅在于 SAP HANA 层面，即在三个表之上添加了一个计算视图。该计算视图结合了\
  \ HANA 表和虚拟表的数据。BW/4HANA 部分与之前的示例保持一致，这意味着数据通过基于字段的 `Open ODS View` 对象从计算视图传递到 `CompositeProvider`\
  \ 对象。\n\n> **注意：** 可以直接添加计算视图作为 `CompositeProvider` 的源。但是，在创建 `Open ODS View` 对象时，我们同时也定义了一个可重用的逻辑对象，包含所有属性、结构或与主数据对象的关联。因此，在每次将特定计算视图用作\
  \ `CompositeProvider` 对象的源时，我们无需重复应用所有这些设置。\n\n### 基于字段的数据模型\n\n现在让我们考虑一个更复杂的场景：需求是基于\
  \ HANA 表的数据在 BW/4HANA 中创建一个星型连接数据模型。图 2-6 展示了一个简化的星型连接数据模型，我将把它作为参考，用于可视化 BW/4HANA\
  \ 的建模方法。\n\n![../images/508424_1_En_2_Chapter/508424_1_En_2_Fig6_HTML.jpg](img/508424_1_En_2_Fig6_HTML.jpg)\n\
  \n图 2-6. 简化的星型连接模式\n\n星型连接模式由一个中心事实表和多个以规范化形式连接的维度表组成。为了在 BW/4HANA 中模拟相同的行为，我们可以再次利用\
  \ `Open ODS View` 对象。在创建 `Open ODS View` 对象时，我们可以选择指明底层对象的类型。我们可以将语义定义为 `Facts`、`Master\
  \ Data` 或 `Text`。图 2-7 展示了在 BW/4HANA 中基于 HANA 表实现虚拟模型的方法（参见图 2-6）。\n\n![../images/508424_1_En_2_Chapter/508424_1_En_2_Fig7_HTML.jpg](img/508424_1_En_2_Fig7_HTML.jpg)\n\
  \n图 2-7. BW/4HANA 实现基于 `Open ODS View` 的虚拟模型的概念\n\n如图 2-7 所示，事实表和维度表的数据流是相似的。对于事实表，会创建一个数据类别为\
  \ `CUBE` 的计算视图；而对于维度表，则创建一个类别为 `DIMENSION` 的视图。当利用直接驻留在 HANA 数据库中的物理表时，也可以采用相同的方法。\n\
  \n> **注意：** `Open ODS View` 可以直接消费虚拟表，因此不强制创建计算视图作为中间层。尽管如此，我仍然建议创建计算视图，因为如果将来需要实现额外的格式化、转换数据类型或添加计算列（这些是非常常见的需求），这将为您带来灵活性。\n\
  \n对于 `Open ODS View` 对象，还有两种语义类型被使用：`Facts` 用于事实表，`Master Data` 用于三个维度表。您可能会注意到\
  \ `Open ODS View 2` 链接到了 `Open ODS View 3`。这用于可视化表示 `Open ODS View 2` 的字段与 `Open\
  \ ODS View 3` 主数据存在关联。为了更好地理解这个概念，您可以将它们视为带属性的 `InfoObject`。您创建一个主 `InfoObject`\
  \ 并指定一个 `InfoObject` 列表作为导航属性。唯一的区别是，我们使用的是 `Open ODS View`，而不是 `InfoObject`。`Facts\
  \ Open ODS View` 与 `Master Data Open ODS View 1` 和 `2` 之间的虚线也描绘了事实表字段与 `Master Data`\
  \ 的关联。最终的 `CompositeProvider` 可能仍然包含原始字段；但是，这些字段将与 `Open ODS View` 主数据对象建立关联。这种方法使您能够创建无需数据持久化的星型连接数据模型。\n\
  \n图 2-7 中描述的建模变体是完全虚拟化的，可能不适用于复杂的数据模型或需要处理大量数据量的场景。在虚拟数据模型中，所有操作都是即时执行的，这显然会导致性能下降。此外，虚拟表从外部数据库查询数据，这同样效率不高。\n\
  \n如果您开发了基于 `Open ODS View` 对象的虚拟数据模型，并且意识到性能不够理想，您可以为选定的 `Open ODS View` 对象（`Facts`\
  \ 和/或 `Master Data`）自动生成持久化层。图 2-8 展示了基于持久化 `Open ODS View` 的数据模型架构。\n\n![../images/508424_1_En_2_Chapter/508424_1_En_2_Fig8_HTML.jpg](img/508424_1_En_2_Fig8_HTML.jpg)\n\
  \n图 2-8. BW/4HANA 实现基于 `Open ODS View` 的持久化模型的概念\n\n\n\n## 开放式 ODS 视图\n\n开放式 ODS\
  \ 视图提供了生成数据流的功能。借助源对象与开放式 ODS 视图对象之间的这一功能，系统会自动生成数据源和 ADSO 以及包含 DTP 的转换。当你将图 2-7\
  \ 与图 2-8 中的架构进行比较时，你会注意到在计算视图与开放式 ODS 视图对象之间多了两个对象。实线表示来自数据源的数据通过转换和 DTP 物理加载到 ADSO\
  \ 对象中。当然，在从性能优化的角度分析模型时，你可以决定哪些开放式 ODS 视图对象需要物理数据存储。你无需在虚拟模型和持久化模型之间做出选择，但可以有选择地为某些开放式\
  \ ODS 视图创建持久化的 ADSO 层。通常，由于高数据量（数百万条记录），性能主要受事务处理表的影响。在这种情况下，你可以为事实表生成 ADSO，同时保持主数据模型为虚拟模型。\n\
  \n## 混合数据模型\n\n下一种建模变体是多种建模对象的组合。正如在 BW/4HANA 中已经提到的，我们不必强制选择单一的数据模型实现方式。BW/4HANA\
  \ 支持混合建模概念，允许我们在单个数据模型中同时利用信息对象、开放式 ODS 视图对象以及基于字段的方法。当新创建的数据模型中的部分维度与 SAP 主数据一致时，可以采用混合方法。例如，在生产型企业中，工厂命名规范可能在所有系统中都是标准化的。如果是这种情况，那么在\
  \ BW/4HANA 中创建新模型时，就没有必要创建和存储相同的主数据；我们可以改用标准的`0PLANT`信息对象。通过采用现有的信息对象，我们可以利用其所有功能，如属性、导航属性、层次结构或授权能力（针对与授权相关的信息对象）。此外，通过尽可能采用现有的信息对象，我们既能确保完整性和一致性，又能避免冗余并减少开发和维护工作量。图\
  \ 2-9 展示了 BW/4HANA 中的混合建模方法。\n\n![../images/508424_1_En_2_Chapter/508424_1_En_2_Fig9_HTML.jpg](img/508424_1_En_2_Fig9_HTML.jpg)\n\
  \n图 2-9. BW/4HANA 混合数据模型\n\n如图 2-9 所示，`Facts`开放式 ODS 视图对象基于三种对象类型建模：信息对象、开放式 ODS\
  \ 视图和字段。信息对象可用于那些具有与 SAP 模型中相同主数据的维度。一些组织可能正在使用主数据管理系统；因此，多个系统可以共享相同的主数据。如果是这种情况，外部数据模型中的某些维度可以映射到\
  \ SAP 信息对象。尽可能为外部模型利用信息对象是很好的做法。这样，我们无需任何开发工作就能提供额外的属性。\n\n图 2-9 中使用的第二个`Facts`开放式\
  \ ODS 视图构建块是`Master Data`开放式 ODS 视图。对于主数据，开放式 ODS 视图的方法与前两个模型（图 2-7 和图 2-8）相同。此外，在创建`Master\
  \ Data`开放式 ODS 视图时，你可以将字段与其他`Master Data`开放式 ODS 视图对象、信息对象或字段进行关联。尽管混合模型为设计架构提供了数十种组合，但在实际实施之前，我建议你详细分析整个数据模型（表、字段和关系）。在此基础上，你可以准备总体方法以及使用每种对象类型的用例。我对混合建模的建议如下：\n\
  \n*   只要适用，就使用信息对象（同时用于`Facts`和`Master Data`开放式 ODS 视图对象）。\n*   对于非 SAP 维度，创建`Master\
  \ Data`开放式 ODS 视图。\n*   仅当使用虚拟对象时性能不足，才创建 ADSO。\n*   如果信息对象或`Master Data`开放式 ODS\
  \ 视图关联不适用，则使用基于字段的方法。\n*   在设计阶段，定义混合模型的总体架构并遵循该方法（否则，模型可能会变得复杂且难以管理）。\n\n\n\n###\
  \ 虚拟模型实现的混合建模概念\n\n混合建模概念可作为虚拟模型实现的最终架构。但需注意，虽然主数据开放 ODS 视图充当虚拟信息对象，但这并未涵盖其全部功能。一个常见需求是创建层级结构。`开放\
  \ ODS 视图`不支持层级，而`信息对象`支持。另一个限制是传递属性功能，该功能同样不适用于`开放 ODS 视图`。在此场景下，若希望保持架构的虚拟性，则可利用“虚拟”`信息对象`。所谓“虚拟”`信息对象`，是指将`访问类型`选项设置为`SAP\
  \ HANA 视图`的`信息对象`。图 2-10 展示了基于`HANA 视图`的`信息对象`数据模型概念。\n\n![../images/508424_1_En_2_Chapter/508424_1_En_2_Fig10_HTML.jpg](img/508424_1_En_2_Fig10_HTML.jpg)\n\
  \n**图 2-10.** 采用“虚拟”`信息对象`的 BW/4HANA 混合数据模型\n\n第二种混合建模方法是基于字段和基于`信息对象`两种方法的结合。若某个字段没有主数据（例如自由文本字段），则将其保留为原始字段即可。对于主数据模型，我们可以通过将`访问类型`设置为`SAP\
  \ HANA 视图`来创建“虚拟”`信息对象`。这意味着该`信息对象`将不再使用自身技术表，而是从底层计算视图中获取主数据。将`SAP HANA 视图`设置为`访问类型`时，需要指明源计算视图的路径，并提供`信息对象`属性与计算视图字段之间的映射。在图\
  \ 2-10 中，`信息对象 1`映射到`计算视图 1`，并包含三个属性：`信息对象 2`、`信息对象 4`和`信息对象 5`。`信息对象 2`也是虚拟的，从`计算视图\
  \ 2`查询数据。`信息对象 4`是标准 SAP 主数据对象，而`信息对象 5`是仅属性对象。如果性能不足，我们可以通过将维度计算视图的输出加载到新的`信息对象`中，创建持久化主数据模型。这样，我们可以为外部系统创建一个遵循传统`BW/4HANA`模型架构的数据模型（图\
  \ 2-2）。唯一的区别在于数据源来自外部系统而非 SAP。\n\n采用此架构时，需要意识到我们将失去`开放 ODS 视图`对象和基于字段方法所提供的所有灵活性。`信息对象`无法利用基于字段的建模，这意味着每个属性都必须使用`信息对象`。原则上，在满足以下条件时，应考虑为外部数据模型使用`信息对象`：\n\
  \n- 源数据模型具有稳定且不易变化的结构。\n- 在试点阶段，您创建了一个经过测试的基于字段的模型，下一步希望将其转换为遵循经典`BW/4HANA`建模概念的结构化模型。\n\
  - 需要利用`开放 ODS 视图`或字段所不具备的功能。在这种情况下，可为这些特定维度使用“虚拟”`信息对象`（例如，当需要层级结构时）。\n\n**最佳实践**\n\
  \n当数据模型完全基于虚拟表时，性能可能不足（基于 HANA 物理表的模型性能更优）。如果源模型包含大型事实表和多个维度表，则需要数据持久化。\n\n图 2-11\
  \ 展示了使用持久化`信息对象`的混合数据模型架构。\n\n![../images/508424_1_En_2_Chapter/508424_1_En_2_Fig11_HTML.jpg](img/508424_1_En_2_Fig11_HTML.jpg)\n\
  \n**图 2-11.** 采用持久化`信息对象`的 BW/4HANA 混合数据模型\n\n图 2-11 所示的架构与经典建模概念（图 2-2）类似。区别在于自定义`信息对象`（`信息对象\
  \ 1`和`信息对象 2`）加载的是来自外部系统而非 SAP 系统的数据。采用这种方法，外部主数据可以充分利用`信息对象`的所有功能，且性能不会受到影响。另一方面，开发和维护的工作量会更高。分析图\
  \ 2-11 所示架构时，您可能会问：为何不直接将非 SAP 数据加载到现有的 SAP 数据模型结构中，而要创建一个新模型？\n\n您可能正在考虑图 2-12\
  \ 所示的方法。\n\n![../images/508424_1_En_2_Chapter/508424_1_En_2_Fig12_HTML.jpg](img/508424_1_En_2_Fig12_HTML.jpg)\n\
  \n**图 2-12.** 将非 SAP 数据加载到 SAP 数据模型的 BW/4HANA 示意图\n\n将外部数据纳入现有 SAP 数据模型的方法存在以下限制：\n\
  \n- 外部维度和属性的数据类型可能与目标`信息对象`的数据类型不一致，导致无法加载数据。\n- 外部维度和属性的数据长度可能与目标`信息对象`的数据长度不一致，导致无法加载数据。\n\
  - 由于数据建模方法不同，以及特定于数据库技术的键、关系和数据类型定义不同，几乎不可能将所有非 SAP 维度及其属性纳入 SAP 模型。\n- 即使源数据类型与`信息对象`数据类型匹配，底层非\
  \ SAP 维度表也可能包含与现有 SAP `信息对象`键相同的主键值。若维护不当，外部数据可能覆盖 SAP 主数据，从而在全球范围内引发大量报表问题。\n-\
  \ 源数据中任何不符合`信息对象`定义的微小偏差都将导致数据加载失败。\n- 不应允许所有用户查看非 SAP 数据，因此安全模型可能变得非常复杂。\n- 集成过程中，现有全球报表解决方案面临受负面影响的巨大风险。\n\
  \n鉴于上述限制和劣势，可以说没有简单的方法将外部数据集成到现有 SAP 数据仓库中。尽管如此，我们可以创建一个新的数据模型来合并 SAP 和非 SAP 数据。\n\
  \n\n\n### 组合数据模型（SAP 与非 SAP 数据）\n\n在需要将 SAP 与非 SAP 数据组合到单一数据模型的场景中，利用虚拟化能力可以避免数据冗余（即避免在两个模型中重复存储相同的\
  \ SAP 数据）。考虑到 `BW/4HANA` 提供的所有功能，创建组合模型可采用多种不同方法。图 2-13 展示了将 SAP 和非 SAP 数据集成到单一模型的一种方法。\n\
  \n![../images/508424_1_En_2_Chapter/508424_1_En_2_Fig13_HTML.jpg](img/508424_1_En_2_Fig13_HTML.jpg)\n\
  \n**图 2-13.** `BW/4HANA` 将 SAP 和非 SAP 主数据集成到新模型中\n\n图 2-13 展示了创建主数据对象的架构，该对象融合了来自\
  \ SAP 和非 SAP 维度的数据。图中用三个部分分别标明了 SAP、非 SAP 以及组合后的主数据。对于非 SAP 数据，创建了一个 `Master Data\
  \ ADSO` 作为持久化层。正如您可能已知的，`BW/4HANA` 能够根据建模对象自动生成外部 SAP HANA 视图。本方法即利用了此功能。从 `Master\
  \ Data ADSO` 生成一个外部计算视图。同样的功能也用于 SAP 主数据，即对于 SAP `InfoObject`，也会生成一个外部计算视图。一旦两个数据集都以外部计算视图的形式在\
  \ HANA 平台上可用，我们就可以将它们组合到单一维度视图中。如图 2-13 所示，在两个外部视图之上，创建了一个额外的计算视图。该视图的目的是合并 SAP\
  \ 和非 SAP 数据。\n\n**注意**\n\n您可以避免为非 SAP 数据创建持久化的主数据 `ADSO`，而是直接将从 `InfoObject` 生成的外部视图与虚拟表结合。然而，这种方法会对数据模型的性能产生负面影响。\n\
  \n当然，在组合 SAP 和非 SAP 数据时，某些属性可能仅适用于 SAP，而另一些则仅适用于非 SAP 源。为了避免用户混淆，如果某个属性值缺失或对于特定记录不可用，最好在数据模型字段中包含用于指示每条记录来源系统的信息。在组合计算视图中，您将能够应用额外的数据操作来尽可能统一两个数据集。此外，在计算视图的联合节点中应用映射之前，很可能需要先将值转换为公共数据类型。一旦组合主数据被恰当塑形，您将能够通过\
  \ `master data Open ODS View` 或 `InfoObject of SAP HANA View access type`（具体取决于方法）来消费最终的主数据视图。\n\
  \n遵循集成主数据的方法，我们可以将相同的架构应用于事实数据。图 2-14 展示了将 SAP 和非 SAP 数据集成到新的 `BW/4HANA` 模型中的架构。\n\
  \n![../images/508424_1_En_2_Chapter/508424_1_En_2_Fig14_HTML.jpg](img/508424_1_En_2_Fig14_HTML.jpg)\n\
  \n**图 2-14.** `BW/4HANA` 将 SAP 和非 SAP 数据集成到新模型中\n\n集成事实数据的架构遵循与集成主数据相同的方法。区别在于外部计算视图是从事实\
  \ `ADSO`（分别针对 SAP 和非 SAP 数据）生成的。从 `ADSO` 生成的外部计算视图通过在其上创建的计算视图内的联合算子进行合并。包含组合事实数据的最终计算视图随后将由\
  \ `Facts Open ODS View` 消费。如图 2-14 所示，在 `Open ODS View` 对象中，从底层计算视图派生的字段与组合主数据对象（如图\
  \ 2-13 所述）关联。根据所选方法，这些字段可以映射到 `Master Data Open ODS Views` 或“虚拟” `InfoObjects`。某些字段也可以不建立任何关联。创建在\
  \ `Facts Open ODS View` 之上的 `CompositeProvider` 随后可由最终查询消费。\n\n如您所见，存在许多可能的建模概念，您需要根据需求选择最合适的方法。请记住，本章描述的架构并非唯有的可能变体。还有许多其他架构可以设计。`BW/4HANA`\
  \ 通过限制对象和层的数量来简化建模，但凭借所有的新特性和功能，它实现了更多可能的建模方法；因此，针对特定场景选择最合适的架构确实具有挑战性。设计正确模型的关键在于深入的需求和数据模型分析、项目交付时间线以及开发人员的经验。\n\
  \n\n"
- '# 摘要


  本章阐述了如何利用 BW/4HANA 和 HANA 原生对象，实现从 HANA 物理表和虚拟表消费数据的敏捷数据模型。表 2-1 总结了本章涵盖的每种建模概念的优缺点和用法。


  表 2-1. 建模概念对比


  | 传统数据模型 |

  | --- |

  | **优点** | • 高水平的数据稳定性、质量和一致性• 可使用 SAP 业务内容• 通过安全模型管理访问权限 |

  | **缺点** | • 灵活性低，开发规则严格• 主要适用于 SAP 数据• 开发和维护工作量大• 始终需要数据持久化 |

  | **用途** | • SAP 数据模型 |

  | **虚拟数据供应** |

  | **优点** | • 高灵活性• 开发工作量非常低• 易于实施和维护• 无需创建信息对象• 不需要数据持久化 |

  | **缺点** | • 无主数据• 仅提供特定信息片段• 安全模型不适用（除非维护了对信息对象的关联） |

  | **用途** | • 简单的数据供应/提取• 临时分析• 直接访问虚拟表 |

  | **基于字段的数据模型** |

  | **优点** | • 高灵活性• 易于实施和维护• 无需创建信息对象• 数据持久化可选• 可实现授权模型 |

  | **缺点** | • 开放式 ODS 视图对象不支持所有信息对象功能（例如层次结构）• 复杂数据模型性能较低 |

  | **用途** | • 非 SAP 数据模型 |

  | **混合数据模型** |

  | **优点** | • 高灵活性• 无需创建新的信息对象• 可在适用处利用现有主数据对象• 通过安全模型管理访问权限 |

  | **缺点** | • 如果没有严格的建模指南，混合来自不同区域的多个对象，模型可能变得复杂且难以维护• 对于复杂数据模型，性能可能不足 |

  | **用途** | • 维度与 SAP 主数据对应的非 SAP 数据模型 |

  | **组合数据模型** |

  | **优点** | • 使用户能够在全局数据（SAP 和非 SAP）上运行数据分析和报表• 可实现授权模型 |

  | **缺点** | • 组合模型的设计需要详细且耗时的分析• 实施复杂• 通过外部 SAP HANA 视图产生大量依赖关系，可能对 SAP 模型产生负面影响•
  维护工作量相当高 |

  | **用途** | • 将 SAP 和非 SAP 数据集成到单个模型中 |


  本章描述的概念让您了解如何将外部表数据供应到 BW/4HANA，如何基于非 SAP 表实现报表和数据模型，以及如何将 SAP 和非 SAP 数据集成到单个数据模型中。在接下来的章节中，您将通过示例学习如何在
  BW/4HANA 系统中实施这些概念。


