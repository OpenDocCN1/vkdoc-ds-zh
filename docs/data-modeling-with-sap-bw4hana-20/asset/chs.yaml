  AS \"CM_DELV_DATE_DIFF_WD\"\nFROM \"_SYS_BIC\".\"BW/4HANA/CV_ORDER_HEADER\"\n(\n\
  PLACEHOLDER.\"$$IP_LANGU$$\"  => :IP_LANGU\n)\n```\n\n\n\n#### 在表函数之上创建计算视图\n\n\
  接下来，我们需要在 `TF_ORDER_HEADER` 表函数之上创建一个计算视图。我创建了一个名为 `CV_ORDER_HEADER_TF` 的 CUBE 类型新计算视图。在此步骤中，重点是正确管理输入参数映射。将表函数添加为计算视图的数据源后，我们可以在语义节点中管理此映射。要将表函数输入参数映射到最终计算视图的目标参数，请点击语义节点，然后转到\
  \ **参数/变量** 选项卡。之后，点击输入参数“管理映射”按钮旁的箭头符号，并选择 **数据源** 选项（图 3-41）。\n\n![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig41_HTML.png](img/508424_1_En_3_Fig41_HTML.png)\n\
  \n图 3-41. 打开输入参数映射窗口\n\n**数据源** 按钮会打开一个新窗口，用于管理源与目标之间的参数映射。这里我们有一个选项，可以根据底层表函数中可用的参数自动创建输入参数。通过点击\
  \ **按名称自动映射** 按钮（图 3-42），所有输入参数将被自动重新创建并映射到源参数。图 3-42 展示了 `TF_ORDER_HEADER` 表函数与\
  \ `CV_ORDER_HEADER_TF` 计算视图之间的参数映射。\n\n![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig42_HTML.jpg](img/508424_1_En_3_Fig42_HTML.jpg)\n\
  \n图 3-42. 管理 `CV_ORDER_HEADER_TF` 计算视图的输入参数映射\n\n**按名称自动映射** 功能会创建与源对象中技术名称相同的输入参数。此外，源与目标之间的映射会被自动管理。如果需要，我们可以随后调整所创建参数的属性。定义好映射和计算视图输出结构之后，就可以进行激活了。之后，值得测试一下新创建视图的输入参数。数据预览应该会显示一个提示，包含两个输入参数（`IP_LANGU`\
  \ 和 `IP_CALENDAR`）。`CM_DELV_DATE_DIFF_WD` 和 `STATUS_DESC` 列的结果应根据输入值的变化而改变。\n\n\
  #### 更新订单标题复合提供者的源计算视图\n\n下一步，我们需要更新 BW/4HANA 对象。如果我们希望保持现有报表的当前形式，可以创建一个新的复合提供者和查询，但在我们的场景中，我们想要更新现有的\
  \ BW 对象。这意味着对于 `ZCPEXT02` 复合提供者，我们需要将源 `CV_ORDER_HEADER` 计算视图替换为新创建的 `CV_ORDER_HEADER_TF`\
  \ 视图。\n\n要调整 `ZCPEXT02` 复合提供者的源视图，请打开该对象并切换到 **场景** 选项卡。然后悬停在现有的计算视图上，并点击 **替换**\
  \ 按钮（图 3-43）。\n\n![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig43_HTML.png](img/508424_1_En_3_Fig43_HTML.png)\n\
  \n图 3-43. 替换 `ZCPEXT02` 复合提供者的源视图\n\n当点击 **替换** 按钮时，系统将打开用于搜索替换对象的窗口。选择新的目标视图（`CV_ORDER_HEADER_TF`）后，系统会将之前的视图替换为新视图。对于具有相同技术名称的列和输入参数，源与目标之间的映射将保持不变。其余的映射需要手动管理。图\
  \ 3-44 显示了 `ZCPEXT02` 复合提供者更新后的目标结构和映射。\n\n视图的替换导致目标部分中的 `CM_DELV_DATE` 字段丢失了分配。这是因为从\
  \ `CV_ORDER_HEADER_TF` 派生的度量具有不同的技术名称（`CM_DELV_DATE_DIFF_WD`），所以我们需要手动创建缺失的分配。输入参数（`IP_CALENDAR`）也应该被拖拽到复合提供者结构的目标部分，因为我们希望将其用作新查询变量的参考。`ZCPEXT02`\
  \ 复合提供者的最终结构应如图 3-44 所示。\n\n![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig44_HTML.jpg](img/508424_1_En_3_Fig44_HTML.jpg)\n\
  \n图 3-44. 更新 `ZCPEXT02` 复合提供者的结构\n\n#### 使用新的输入参数更新订单标题数据的查询\n\n完成案例研究 4 任务的最后一步是更新\
  \ `ZCPEXT02_Q01` 查询。对于新映射的 `IP_CALENDAR` 参数，我们需要执行与 `IP_LANGU` 输入参数相同的步骤（图 3-27\
  \ 到 3-32 中展示的步骤）。`ZCPEXT02_Q01` 查询的最终过滤器定义应如图 3-45 所示。\n\n![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig45_HTML.jpg](img/508424_1_En_3_Fig45_HTML.jpg)\n\
  \n图 3-45. 将 `4ZCPEXT02-IP_CALENDAR` 输入参数字段映射到查询变量\n\n现在，我们可以在前端工具中运行报表，根据案例研究 4\
  \ 中描述的需求来测试查询。当在 Analysis for Microsoft Excel 中打开查询时，我们现在应该会看到两个变量提示，如图 3-46 所示。\n\
  \n![../images/508424_1_En_3_Chapter/508424_1_En_3_Fig46_HTML.jpg](img/508424_1_En_3_Fig46_HTML.jpg)\n\
  \n图 3-46. `ZCPEXT02_Q01` 查询的更新后 Analysis for Microsoft Excel 提示\n\n**状态名称** 和 **请求日期\
  \ vs. 交货日期（天）** 列将根据在 **语言** 和 **日历 ID** 变量选择屏幕上输入的值返回输出。这意味着案例研究 4 中的需求现已成功完成。\n\
  \n## 总结\n\n在本章中，我描述了需要将 HANA 表中的数据暴露给 BW/4HANA 层的场景。通过利用基于字段的建模和虚拟化，我们能够创建 BW/4HANA\
  \ 报表，而无需将数据加载到 BW/4HANA 建模对象中，也无需创建任何单个信息对象。\n\n在案例研究 1 中，我展示了如何轻松地将数据从 HANA 表预置到\
  \ BW/4HANA 查询中。在此场景中，我们使用了两个 BW/4HANA 建模对象：开放 ODS 视图和复合提供者。\n\n案例研究 2 要求我们在创建最终输出之前合并两个\
  \ HANA 表。为了实现这一点，我们引入了一个额外的 HANA 建模对象，称为计算视图。这帮助我们连接这两个表，以便在将其带入 BW/4HANA 层之前，以所需的形式创建一个数据集。\n\
  \n在案例研究 3 中，我演示了如何将值从查询变量传递到计算视图输入参数。我们了解到，带有输入参数的计算视图应由复合提供者直接使用（在此场景中需要跳过开放 ODS\
  \ 视图层）。\n\n最后一个场景帮助我们理解了表函数的用法。通过完成案例研究 4 的需求，我们学习了如何在表函数中使用计算视图。此外，我们还通过示例了解了如何在计算视图和表函数之间双向传递输入参数值。最终，你还学习了如何将查询变量值传递到表函数的\
  \ SQL 代码中。\n\n\n\n"
- '# 4. 创建基于字段的 BW/4HANA 模型


  在第三章 3 中，我们讨论了暴露 HANA 对象（表和视图）的可能性，本章将解释如何使用基于字段的方法实现 BW/4HANA 数据模型。我们已经知道，通过利用
  `Open ODS 视图` 对象，我们可以将位于 SAP HANA 数据库模式中的外部数据引入 BW/4HANA 层。在本章中，我们将利用 `Open ODS
  视图` 在 BW 中构建一个虚拟星型模式、基于字段的数据模型。我还会解释如何在不修改报表层的情况下，在 `Open ODS 视图` 和源对象之间自动生成一个中间数据存储层。


  '
- '# 场景


  成功实施订单数据的基本数据供应报表（第三章 3）后，项目经理要求在 BW/4HANA 中构建一个星型模式数据模型的概念验证。需求是基于在 SAP HANA 数据库模式中复制的表，在
  BW/4HANA 系统中实施该数据模型。在第三章 3 中，已经使用了两个表（`ORDER_HEADER` 和 `ORDER_STATUS`）来构建数据供应报表。该虚拟模型总共应包含五个外部表。其中两个是事实表。


  - `Order Header`：包含订单抬头信息，例如状态、订单日期、客户编号和负责员工。

  - `Order Details`：该表与 `Order Header` 表关联，包含订单项目级别信息，例如产品 ID 或订购数量。


  其余三个表是维度/文本表。


  - `Order Status`：这是一个文本表，用于根据状态描述查找状态 ID。它支持两种语言（英语和德语）的描述。

  - `Products`：这是一个维度表，包含产品属性的信息。

  - `Categories`：这是一个文本表，包含可用产品组及其描述的信息。


  图 4-1 展示了在 SAP HANA 数据库中复制的非 SAP 表的逻辑数据模型。


  ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig1_HTML.jpg](img/508424_1_En_4_Fig1_HTML.jpg)


  *图 4-1.* 订单的逻辑数据模型


  如图 4-1 所示，该数据模型由五个表组成。表之间的连接线定义了它们的关系。在给定的示例中，所有关系都是一对多类型（1..1 – 1..*）。每个实体由一个表头和字段列表组成。加粗的字段表示表的主键。如果你希望跟随演示的活动进行操作，可以在本书的附录中找到重新创建这些表到你本地模式的
  SQL 脚本。


  在本章接下来的部分，我将向你展示如何使用给定的逻辑模型作为参考（图 4-1），在 BW/4HANA 中实施虚拟数据模型。在这个场景中，我们将遵循图 2-7（在第二章
  2 中）提出的基于 Open ODS 视图的建模概念。图 4-2 展示了基于场景描述的需求实施订单数据模型的一般方法。


  ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig2_HTML.jpg](img/508424_1_En_4_Fig2_HTML.jpg)


  *图 4-2.* 订单的虚拟 BW/4HANA 模型


  这里的想法是利用 `Open ODS 视图` 对象构建一个虚拟模型。将有一个事实语义类型的 `Open ODS 视图`（`Orders`）和一个主数据类型（`Product`）的
  `Open ODS 视图`。由于 `Order Status` 和 `Category` 表仅包含键和描述，其语义类型将设置为文本。在模型的顶层，我将创建一个
  `CompositeProvider`，稍后由查询消费。首先，我将专注于实施主数据/文本对象。


  ## 创建维度计算视图


  我们可以直接在 HANA 表上开始实施 `Open ODS 视图`，但正如我之前提到的，我更喜欢先通过计算视图消费表。这为我们提供了更大的灵活性，以防将来需要应用任何字段转换或额外计算。对于每个维度/文本表，我创建了一个类型为维度的计算视图（图
  4-3）。


  ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig3_HTML.jpg](img/508424_1_En_4_Fig3_HTML.jpg)


  *图 4-3.* 虚拟数据模型的维度计算视图列表


  你会在图 4-3 中注意到，我创建了一个名为 `BW4VMODEL` 的新 HANA 包。这有助于保持开发的透明性，并将其与为其他目的而开发的其他 HANA 对象分开。列在
  `BW4VMODEL` 包下的计算视图具有维度类型。它们不包含任何连接或计算，只是以与底层表相同的结构提供数据。例如，你可以在图 4-4 中看到 `CV_DIM_PRODUCTS`
  计算视图的结构。


  ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig4_HTML.jpg](img/508424_1_En_4_Fig4_HTML.jpg)


  *图 4-4.* `CV_DIM_PRODUCTS` 计算视图定义


  其余两个计算视图（用于 Order Status 和 Category 表）遵循相同的方法。它们由一个指向源表的 `Projection` 节点组成，所有字段都从该节点传播到
  `Semantics` 节点。以下是作为特定计算视图源的表（表 ➤ 计算视图）：


  - `CATEGORIES` ➤ `CV_DIM_CATEGORIES`

  - `ORDER_STATUS` ➤ `CV_DIM_ORDER_STATUSES`

  - `PRODUCTS` ➤ `CV_DIM_PRODUCTS`


  验证并激活这些视图后，我们现在可以切换到 BW 建模视角了。



  ## 创建文本型开放 ODS 视图


  如图 4-2 所示，针对给定的场景，我们将创建两个语义类型设置为“文本”的开放 ODS 视图。它们的作用与传统 EDW 架构中常规信息对象的角色相同。主要区别在于，开放
  ODS 视图可以基于字段，并且不存储任何数据。开放 ODS 视图在查询运行时从底层对象（在我们的场景中为 HANA 计算视图）检索数据。


  我们首先关注存储在 `ORDER_STATUS` 表中的数据。该表包含订单状态 ID 和订单描述。状态描述支持两种语言：英语和德语。`LANGU` 列标识了该表中每个条目的语言。该列中存储的值
  `E` 和 `D` 遵循标准 SAP 语言代码。因此，我们将能够支持以用户语言动态显示文本的功能。


  第一个开放 ODS 视图将从 `CV_DIM_ORDER_STATUSES` 计算视图中获取数据。此开放 ODS 视图的语义类型设置为 `Texts`。在开放
  ODS 视图编辑器中，我们需要指定正确的输出结构。图 4-5 显示了订单状态（`ZTXT01`）开放 ODS 视图的输出结构。


  ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig5_HTML.jpg](img/508424_1_En_4_Fig5_HTML.jpg)


  *图 4-5. 订单状态（ZTXT01）开放 ODS 视图的输出结构*


  在定义开放 ODS 视图的输出结构时，首先需要填写 `Representative Key` 字段，该字段用于唯一标识每条记录。在我们场景中，它是 `STATUS_ID`
  列。该表的第二个键是 `LANGU` 列；不过，我们有一个专门用于语言代码的文件夹。


  由于订单状态维度将依赖于语言，因此我们需要指定提供语言代码值的列。在我们的场景中，应将 `LANGU` 列放在 `Language Code` 文件夹下，如图
  4-5 所示。


  应添加到输出结构中的最后一列是实际的描述字段：`STATUS_DESC`。根据源字段长度，应将其分配到适当的“文本相关”文件夹下。表 4-1 根据文本文件夹类型指定了支持的最大字符数。


  *表 4-1. 开放 ODS 视图文本类型定义*


  | 文本文件夹 | 最大字段长度 |

  | --- | --- |

  | 短文本 | 20 |

  | 中文本 | 40 |

  | 长文本 | 5000 |


  你也可以将同一个描述字段添加到多个文本文件夹中。这样，例如在显示 `Short Text` 时，将只显示字符串的前 20 个字符。如果源字段长度更长，文本的其余部分将被截断。在我们的场景中，`Status
  Name` 长度为 30 个字符，因此我将其分配到了 `Medium Text` 文件夹下（图 4-5）。要检查 `ZTXT01` 开放 ODS 视图的输出，让我们在
  Analysis for Microsoft Excel 中打开它。图 4-6 显示了订单状态开放 ODS 视图的输出。


  ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig6_HTML.jpg](img/508424_1_En_4_Fig6_HTML.jpg)


  *图 4-6. 在 Analysis for Microsoft Excel 中 ZTXT01 的输出*


  你可以注意到，尽管底层 `ORDER_STATUS` 表中共有六个条目，但 `ZTXT01` 开放 ODS 视图的输出仅返回了其中三个。这是因为我的 BW 用户的默认语言设置为
  `EN`，因此 `LANGU` 列中值为 `DE` 的条目被跳过。如果我在登录 BW/4HANA 系统时将语言更改为 `DE`，描述将以德语返回。


  接下来，对于“类别”维度，我们应遵循与订单状态对象相同的步骤。唯一的区别在于 `CATEGORIES` 表不依赖于语言，因此我们不会将任何列分配到 `Language
  Code` 文件夹。图 4-7 显示了 `ZTXT02` 类别开放 ODS 视图的输出结构。


  ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig7_HTML.jpg](img/508424_1_En_4_Fig7_HTML.jpg)


  *图 4-7. 类别（ZTXT02）开放 ODS 视图的输出结构*


  源 `CATEGORIES` 表仅包含键字段和文本字段。`CATEGORY_ID` 列被放在了 `Representative Key Field` 部分，而
  `CATEGORY_DESC` 字段被拖到了 `Long Text` 文件夹下。图 4-8 展示了类别开放 ODS 视图的输出。


  ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig8_HTML.jpg](img/508424_1_En_4_Fig8_HTML.jpg)


  *图 4-8. 在 Analysis for Microsoft Excel 中 ZTXT02 的输出*


  如图 4-8 所示，类别开放 ODS 视图的输出与源 `CATEGORIES` 表的内容一致。



  ## 创建主数据开放 ODS 视图


  第三个开放 ODS 视图将基于从`PRODUCTS`表获取数据的`CV_DIM_PRODUCTS`视图。与前两个表不同，`PRODUCTS`表除了键列和文本列之外，还包含**品牌**和**价格**等其他属性。因此，在创建产品开放
  ODS 视图时，我们应选择**主数据**作为语义类型。图 4-9 展示了产品开放 ODS 视图的输出结构。


  ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig9_HTML.jpg](img/508424_1_En_4_Fig9_HTML.jpg)


  图 4-9. 产品开放 ODS 视图(`ZDIM01`)的初始输出结构


  在图 4-9 中，你可以看到来自`CV_DIM_PRODUCTS`计算视图的源字段（源字段部分）是如何分配到多个文件夹（视图字段部分）中的。


  - `PRODUCTS`表的主键由两列组成：`PRODUCT_ID`和`CATEGORY_ID`。开放 ODS 视图支持对无法基于单个字段唯一定义的对象进行复合功能。如图
  4-9 所示，`PRODUCT_ID`被分配到代表性键字段(1)文件夹。


  - 主键中的第二列（`CATEGORY_ID`）已被添加到特性（键）(2)文件夹下。此分配的目的类似于标准信息对象可用的复合功能。


  - 在特性(3)文件夹下，你可能会找到`BRAND_DESC`列。属于此部分的列是开放 ODS 视图主数据对象的属性。


  - 关键指标(4)部分包含数值数据类型的属性。对于`ZDIM01`开放 ODS 视图，`PRICE`列被添加到了此部分。


  - 对于货币和单位相关的列，开放 ODS 视图输出结构中还有一个专用文件夹。在给定场景中，我将`CURRENCY`列分配到了货币(5)文件夹。


  **注意**


  在开放 ODS 视图中使用来自外部数据的货币或单位时，你需要了解 BW/4HANA 期望所有这些值都维护在中央 SAP 货币和单位表中。标准 SAP 表中不存在的货币/单位值的记录将不被支持。


  - 产品描述列（`PRODUCT_DESC`）已被拖拽到长文本(6)文件夹。这是因为`PRODUCT_DESC`列长度为 200 个字符。


  图 4-10 展示了产品开放 ODS 视图的初始输出。


  ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig10_HTML.jpg](img/508424_1_En_4_Fig10_HTML.jpg)


  图 4-10. `ZDIM01`在 Microsoft Excel 分析中的初始输出


  产品开放 ODS 视图的输出包含源自`CV_DIM_PRODUCTS`计算视图的所有列。值得注意的是，产品字段的键值由产品 ID 和类别 ID 组成（例如，`0001/AC003`）。这是因为我们将`CATEGORY_ID`列添加到了特性（键）部分（见图
  4-9）。


  我们可以实施两项小的调整，为产品维度提供更多信息。首先，类别字段显示的是 ID 值，因此用户不知道实际的类别值是什么。此外，价格字段显示的数字没有货币代码（货币代码显示为单独的列）。现在让我们切换回
  BW 建模工具。如你所记，我们为类别数据创建了`ZTXT02`文本开放 ODS 视图（图 4-7）。该对象包含类别 ID 与类别名称之间的映射关系。现在，我们可以通过在产品开放
  ODS 视图输出结构中向该对象应用关联来利用`ZTXT02`开放 ODS 视图。图 4-10 说明了如何定义类别字段与`ZTXT02`开放 ODS 视图之间的关联。


  ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig11_HTML.jpg](img/508424_1_En_4_Fig11_HTML.jpg)


  图 4-11. `ZDIM01`开放 ODS 视图中类别字段的关联


  要定义字段与开放 ODS 视图对象之间的关联，请从视图字段部分选择目标字段。在右侧窗格中，选择关联类型为开放 ODS 视图。然后浏览要分配给该特定字段的开放 ODS
  视图的名称。如果要继承关联对象的技术名称，请选择**按名称直接使用关联对象**选项。在所示示例中（图 4-11），我将`ZTXT02`开放 ODS 视图分配给了`CATEGORY_ID`字段，并选择了按名称使用关联对象的选项。定义关联后，在视图字段部分中，你将在字段名称旁边找到有关关联对象的信息（开放
  ODS 视图图标及其技术名称）。


  我想应用的第二个调整是为价格字段分配货币。点击`PRICE`字段以显示字段设置部分（图 4-12）。


  ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig12_HTML.jpg](img/508424_1_En_4_Fig12_HTML.jpg)


  图 4-12. 为`ZDIM01`开放 ODS 视图中的价格字段分配货币元素


  当你打开货币/单位元素下拉列表时，列表中会看到货币文件夹下可用的字段。在我的案例中，只有一列（`CURRENCY`）。我将使用该列作为货币元素（图 4-12）。


  应用这两项更改后，让我们再次在 Microsoft Excel 分析中执行`ZDIM01`对象以验证输出。图 4-13 展示了更新后的`ZDIM01`对象的输出。


  ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig13_HTML.jpg](img/508424_1_En_4_Fig13_HTML.jpg)


  图 4-13. `ZDIM01`在 Microsoft Excel 分析中的最终输出


  这次通过为类别字段选择键和文本选项，我们能够同时看到键和文本。所有开放 ODS 视图字段的技术名称都以`2F`字符串开头。默认情况下，技术字段名称的其余部分是通过连接开放
  ODS 视图名称和字段名称生成的（例如，`2FZDIM01-BRAND_DESC`）。在我们的示例中，产品和类别字段是例外。


  分配给代表性键字段组的字段生成的名称仅包含开放 ODS 视图名称。产品字段被设置为代表性键字段（见图 4-9）；因此，其技术名称显示为`2FZDIM01`（图
  4-13）。


  类别字段与`ZTXT02`开放 ODS 视图有关联；因此，其名称继承自该对象。如果我们希望保持与其他字段相同的命名约定（`2F<开放 ODS 视图名称>_<字段名称>`），我们应该将选择从**按名称直接使用关联对象**切换为**使用系统级唯一名称**（图
  4-11）。


  为`ZDIM01`开放 ODS 视图实施的第二项更改涉及价格字段。该调整现在也反映在图 4-13 所示的输出中。你可以看到，价格列中显示的每个值现在都已分配了货币代码。




  ## 创建事务性计算视图


  与维度表类似，我首先在 SAP HANA 层为事务性数据创建一个虚拟层。在我们的数据模型中，事务性数据来自两个表：`ORDER_HEADER` 和 `ORDER_DETAILS`。这两个表都有一个
  `Order Number (ORD_NUMBER)` 列，该列将用于将抬头数据和行项目数据链接到一个数据集中。此表将在 CUBE 数据类别的计算视图中进行联接。图
  4-14 展示了 `CV_FACT_ORDERS` 视图对象的图形编辑器。


  ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig14_HTML.jpg](img/508424_1_En_4_Fig14_HTML.jpg)


  图 4-14. `CV_FACT_ORDERS` 计算视图定义


  `CV_FACT_ORDERS` 计算视图从订单抬头表和订单项目表（`Projection_1` 和 `Projection_2`）查询数据。然后，联接节点基于
  `ORD_NUMBER` 列将这些表链接到一个数据集中。从 `ORDER_HEADER` 表开始，所有列都会被传播到语义节点。从 `ORDER_DETAILS`
  表，除了已从抬头表衍生的 `ORD_NUMBER` 字段外，我们也应选择所有字段。当对 `CV_FACT_ORDERS` 计算视图执行数据预览时，我们应该看到抬头数据和行项目数据已合并成一个数据集。该视图现在将用作事实（Facts）开放
  ODS 视图对象的数据源。


  ## 创建事实开放 ODS 视图


  创建了主数据和文本 BW/4HANA 对象之后，现在我将创建中心星型模式对象。由于我们已经将订单事务性数据合并到一个数据集中，现在可以定义一个新的事实开放 ODS
  视图对象。请记住，在定义事务性开放 ODS 视图时，应选择 `Facts` 选项作为语义类型。图 4-15 展示了 `ZFCT01` 开放 ODS 视图的初始设置。


  ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig15_HTML.jpg](img/508424_1_En_4_Fig15_HTML.jpg)


  图 4-15. 订单数据 (`ZFCT01`) 开放 ODS 视图的初始输出结构


  `CV_FACT_ORDERS` 计算视图中可用的源字段分为以下三类：


  *   `Order Number` 和 `Order Line Number` 是构成订单数据集组合键的字段。它们唯一地定义了每个订单项目记录。主键字段被分配到
  `Characteristics (Key)` 类别 (1)。


  > **注意**：主键字段也可以分配到“特征”文件夹。但是，如果将来需要将这些数据持久化到 ADSO 中，通过将主键字段分配到 `Characteristics
  (Key)` 文件夹，我们可以确保这些字段会自动成为所生成 ADSO 的键字段。


  *   事务性数据字段被分组到 `Characteristics` 文件夹 (2)。来自 `CV_FACT_ORDERS` 计算视图的大多数字段都已添加到此组中。


  *   `Quantity Ordered (QTY)` 列是一个累积度量；因此，它已被添加到 `Key Figures` 文件夹 (3)。


  现在让我们激活 `ZFCT01` 对象来检查其内容。


  ![../images/508424_1_En_4_Chapter/508424_1_En_4_Fig16_HTML.jpg](img/508424_1_En_4_Fig16_HTML.jpg)


  图 4-16. `ZFCT01`在 Analysis for Microsoft Excel 中的初始输出


  在图 4-16 中，您可能会看到 `ZFCT01` 开放 ODS 视图针对某些选定字段的输出。目前，`Order Status`、`Category` 和 `Product`
  字段显示为键值，除非用户知道特定 ID 的含义，否则这些值对最终用户可能没有意义。由于我们现在已经准备好订单事务性开放 ODS 视图的初始设置，我们可以通过应用关联来增强这些字段。通过这种方式，某些字段将继承本章前面部分创建的关联文本/主数据开放
  ODS 视图的属性。


  `CV_FACT_ORDERS` 计算视图将 `Order Status` 和 `Category` 值显示为键。为了在报表中也启用描述，我们可以利用订单状态
  (`ZTXT01`) 和类别 (`ZTXT02`) 开放 ODS 视图，并分别对 `STATUS` 和 `CATEGORY` 字段应用关联。按照图 4-11 中为类别字段展示的相同步骤，在
  `ZFCT01` 开放 ODS 视图中定义关联。图 4-17 展示了事务性字段与文本开放 ODS 视图对象之间的关联。


