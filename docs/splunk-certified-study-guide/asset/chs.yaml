  *   b. 1\n*   c. 1、2 和 4\n*   d. 1\n*   e. 2\n\n\n\n## 延伸阅读\n\n更多关于索引工作原理的信息，请访问[`https://docs.splunk.com/Documentation/Splunk/7.2.3/Indexer/Howindexingworks`](https://docs.splunk.com/Documentation/Splunk/7.2.3/Indexer/Howindexingworks)。\n\
  \n您可以在此处查看 Splunk 的架构：[`https://docs.splunk.com/File:Architecture-new.png`](https://docs.splunk.com/File:Architecture-new.png)。\n\
  \n您可以在此处阅读 Splunk 如何处理您的数据：[`https://docs.splunk.com/Documentation/Splunk/7.2.3/Data/WhatSplunkdoeswithyourdata`](https://docs.splunk.com/Documentation/Splunk/7.2.3/Data/WhatSplunkdoeswithyourdata)。\n\
  \n"
- "# 2. Splunk 搜索处理语言\n\n在第 1 章中，您了解了 Splunk 的架构、历史、起源和显著特性。您看到了 Splunk Enterprise\
  \ 认证管理员考试的路线图，并对 Splunk 有了初步了解。您在 macOS 或 Windows 上安装了 Splunk，并经历了向其添加数据的过程。在本章中，您将深入探讨\
  \ Splunk 搜索处理语言以及使用 Splunk 分析数据的方法。\n\nSplunk 的搜索处理语言（SPL）是一种用户友好的语言，旨在搜索已在 Splunk\
  \ 中索引的数据。该语言基于 Unix 管道和标准查询语言（SQL）。SPL 的范围包括数据搜索、过滤、修改、操作、插入和删除。您可以使用此软件对不同事件进行分组、洞察数据模式、读取实时交互报告并获得商业智能。SPL\
  \ 可以通过单个命令或使用管道的命令组执行各种功能。因此，在成功操作 Splunk 之前，有必要讨论此语言。第 3 章也包含了 Splunk 搜索处理语言的示例。\n\
  \n本章讨论以下主题。\n\n- 管道运算符\n- 时间修饰符\n- 基本 SPL\n- 排序结果\n- 过滤命令\n- 报告命令\n- 过滤、修改和添加字段\n\
  - 分组结果\n\n## 管道运算符\n\n在 SPL 中，管道运算符在 Splunk 中执行搜索命令链。它使用`|`运算符表示。在 SPL 中，所有命令从左到右执行，管道运算符左侧的命令首先执行，然后是其右侧的命令。简而言之，管道运算符左侧的输出是管道运算符右侧命令的输入。\n\
  \n1.  转到 Splunk Web 中的测试应用程序，并在搜索栏中输入以下命令。\n\n```\nindex=\"Test\"\n```\n\n2.  要获取\
  \ Test 索引中的总事件数，请使用`index=\"Test\"`过滤结果并获取 Test 索引的所有事件，然后使用管道运算符将`index=\"Test\"\
  `的输出作为输入，以获取 Test 索引中的事件总数。请参考搜索栏中的命令。\n\n```\nindex=\"Test\" | stats count\n```\n\
  \nSplunk 中的字段名称区分大小写，但字段值不区分大小写。例如，在`index Test [ search index=\"Test\" to=\"deep@gmail.com\"\
  \ | transaction sid ]`中。字段名称`sid`区分大小写，但`sid`中的值不区分大小写，这导致一个事件的`sid`值与另一个事件的`sid`值匹配。\n\
  \n## 时间修饰符\n\n当索引处理事件时，时间戳会保存为默认字段`_time`。如果您的原始数据中已有一个时间戳，您可以使用`props.conf`更新`_time`（有关`props.conf`的更多信息，请参见第\
  \ 11 章）。每当您在 Splunk 中执行 SPL 命令时，都需要注意时间范围。一旦您使用某个时间范围发起 SPL 查询，仅会检索在该时间范围内发生的事件，其他事件将被过滤。时间范围选择器位于搜索命令的右侧。\n\
  \n时间修饰符主要有两种类型：相对搜索和实时搜索。\n\n- **相对搜索**捕获在给定时间段内出现的数据，例如*yesterday*。当相对时间边界过去后，搜索会刷新。因此，对*yesterday*的搜索会随着每一天的到来而刷新（因此是相对的）。\n\
  \n- **实时搜索**实时刷新；因此，它会根据边界不断丢弃旧数据并获取新数据。\n\n**排序结果**在 SPL 中按升序或降序对结果进行排序。您可以根据`_time`参数选择所需的任何顺序。\n\
  \n时间是 SPL 中最有效的过滤器。\n\n本节讨论了执行链式命令的管道运算符和时间修饰符。在下一节中，让我们讨论 SPL 基础知识。\n\n## 理解基本\
  \ SPL\n\n理解 SPL 的基础知识就像学习字母表一样，是最好地理解 Splunk 的关键。SPL 由搜索语言语法、布尔运算符、搜索模式和语法着色组成。\n\
  \n### 搜索语言语法\n\nSplunk 有五个基本搜索组件。\n\n- **搜索词**定义您要从 Splunk 检索的数据。一个词使用高亮的关键字。例如，处理命令`index\
  \ = \"Test\" 58840`过滤所有包含数字`58840`的事件。\n\n- **命令**定义如何处理搜索的检索结果。它们主要用于分析结果集中的数据。例如，处理命令`index=\"\
  Test\" |tail 20`检索 Test 索引中的最后 20 个结果。\n\n- **函数**定义如何绘制结果图表。例如，处理命令`index=\"_internal\"\
  |stats avg(bytes)`给出`_internal`索引中的平均字节数。\n\n- **参数**是您通常应用于函数以检索结果的变量。例如，处理命令`index=\"\
  Test\"|eventstats sum(count) as total_count`将计数的求和函数应用为总计数。\n\n- **子句**允许您对结果进行分组并重命名字段结果。例如，处理命令`index=\"\
  _internal\"|stats avg(bytes) by the host`给出`_internal`索引中使用的平均字节数以及每个主机使用的平均字节数。\n\
  \nSplunk 中的每次搜索都是一个作业，该作业的默认生命周期为 10 分钟；可以延长至 7 天。\n\n### Splunk 中的布尔运算符\n\nSplunk\
  \ 中有三种布尔运算符：`AND`、`OR`和`NOT`。它们始终需要大写。\n\nAND 运算符隐含在搜索词之间。与其重写整个 SPL 语句，不如使用布尔运算符`AND`。例如，如果您想检查\
  \ Amazon 和 Walmart 上都有的产品，可以使用以下查询。\n\n```\nindex=\"products\"| product_website=\"\
  amazon\" AND \"walmart\"\n```\n\nOR 运算符应用于任一搜索词。例如，\n\n```\nindex=\"products\"|\
  \ product_website=\"amazon\" OR \"walmart\"\n```\n\nNOT 运算符仅适用于紧跟其后的搜索词，允许您在查询中省略某些结果。例如，\n\
  \n```\nindex=\"products\"| error NOT(400 or 500)\n```\n\n`!=`与`NOT`运算符有何不同？使用`NOT`运算符的搜索会检查字段是否具有指定值，而使用`!=`的搜索会检索字段存在的事件，但该字段不必有值。\n\
  \n### SPL 中的语法着色\n\n在 Splunk 中，搜索字符串的一部分会自动着色。布尔运算符、命令、参数和函数各有不同的颜色；默认值如表 2-1 所示。值得注意的是，您可以自定义或禁用语法着色。\n\
  \n**表 2-1** SPL 中的语法颜色\n\n| 参数名称 | 颜色 |\n| --- | --- |\n| 布尔运算符 | 橙色 |\n| 命令 | 蓝色\
  \ |\n| 参数 | 绿色 |\n| 函数 | 紫色 |\n\n下一节讨论排序结果。\n\n## 排序结果\n\n在 SPL 中排序结果**按升序或降序对结果进行排序**。您可以根据`_time`参数选择希望显示的任何顺序。\n\
  \n\n\n### 排序\n\n排序使用`sort`命令执行，字段名跟在`sort`命令之后。默认情况下，`sort`字段名按升序排列结果；要按降序排列数据，必须写`sort\
  \ -fieldname`。表 2-2 描述了各种类型的排序命令。\n\n**表 2-2** 排序命令\n\n| 命令 | 说明 |\n| --- | ---\
  \ |\n| `\\|sort field1` | 按`field1`升序排列结果 |\n| `\\|sort count field1` | 检索按`field1`升序排列的事件数量\
  \ |\n| `\\|sort -field1` | 按`field1`降序排列结果 |\n| `\\|sort count -field1` | 检索按`field1`降序排列的事件数量\
  \ |\n\n要限制排序结果，可以使用`limit`选项。以下是一个示例语法查询，展示了如何限制排序结果。\n\n```\n\"your_query | sort\
  \ - sum(field_name)| head 10(count)\"\n```\n\n以上就是关于排序的内容。在下一节中，你将学习各种 Splunk 过滤命令。\n\
  \n## 过滤命令\n\nSPL 中的过滤命令基于各种 SPL 命令（如`where`、`dedup`、`head`和`tail`）来过滤事件。让我们从`where`命令开始。\n\
  \n### where\n\n`where`过滤命令评估 SPL 来过滤结果。如果结果匹配，则评估成功，并检索该结果。如果结果评估不匹配，则评估失败，不检索该结果。表\
  \ 2-3 解释了如何使用`where`子句过滤结果。\n\n**表 2-3** `where`命令\n\n| 命令 | 说明 |\n| --- | --- |\n\
  | `\\|where field1!=value` | `where`语句检查`field1`中的数据是否不等于`field1`。如果是，则检索与`field1`不相似的匹配事件。\
  \ |\n| `\\|where field1=value` | `where`语句检查`field1`中的数据是否相同；如果是，则检索相似的事件。 |\n|\
  \ `\\|where field1>value` | `where`语句检查`field1`中的数据是否更大；如果是，则检索相似的事件。 |\n| `\\|where\
  \ field1<value` | `where`语句检查`field1`中的数据是否更小；如果是，则检索相似的事件。 |\n| `\\| where (ip\
  \ LIKE “27.%.%.%”)` | `where`子句尝试查找所有 IP 范围在 27.0.0.0 到 27.255.255.255 之间的事件。 |\n\
  \n### dedup\n\n`dedup`命令移除所有符合同一条件的重复数据。结果匹配对于提供的字段值是唯一的。不会存在任何其他与该字段值相等的重复数据。\n\
  \n表 2-4 描述了各种`dedup`命令。\n\n**表 2-4** `dedup`命令\n\n| 命令 | 说明 |\n| --- | --- |\n|\
  \ `\\|dedup field1` | `dedup`检查`field1`值是否存在于其他具有相同值的事件中；如果是，则移除它。 |\n| `\\|dedup\
  \ count field1` | `dedup`检查`field1`值是否存在于其他具有相同值的事件中；如果是，则移除这些值。`dedup count`决定了`field1`的计数。\
  \ |\n\n### head\n\n`head`命令检索最初计数的若干事件。`count`是一个参数，根据提供给`head`命令的计数数量来停止检索结果；例如，`head\
  \ 5`检索前五个事件。\n\n### tail\n\n`tail`命令检索最后计数的若干事件。`count`是一个参数，根据提供给`tail`的计数数量来停止检索结果；例如，`tail\
  \ 5`检索最后五个事件。\n\n## 报告命令\n\nSPL 中的报告命令准备一个对报告有用的摘要。这些命令包括`top`、`rare`、`history`、`stats`、`untable`、`timechart`、`chart`和`table`。\n\
  \n### top\n\n`top`命令检索字段值中排名靠前（最常见）的值表，包括该字段的总计数和百分比。表 2-5 解释了如何使用`top`命令对事件进行分组。\n\
  \n**表 2-5** `top`命令\n\n| 命令 | 说明 |\n| --- | --- |\n| `\\|top field` | `top`命令查找所有字段值中最常见（top）的值，并检索`field1`表、总计数和百分比。\
  \ |\n| `\\|top count field1` | `top`命令查找字段中最常见（top）的值，然后检索计数，并创建一个包含`field1`表、总计数和百分比的表。\
  \ |\n\n默认情况下，`top`命令的输出格式为表格。\n\n### rare\n\n`rare`命令与`top`命令相反，因为它显示字段中罕见值出现的总次数及其在结果中的百分比。表\
  \ 2-6 解释了如何使用`rare`命令对事件进行分组。\n\n**表 2-6** `rare`命令\n\n| 命令 | 说明 |\n| --- | ---\
  \ |\n| `\\|rare field` | 此`rare`命令查找字段值中的罕见值，并检索`field1`的表、总计数和百分比。 |\n| `\\|rare\
  \ count field` | 此`rare`命令查找所有字段值中的罕见值，并检索计数、创建表、总计数以及`field1`的百分比。 |\n\n### history\n\
  \nSPL 中的`history`命令用于查看当前用户的搜索历史。\n\n表 2-7 解释了`history`命令。\n\n**表 2-7** 历史命令\n\n\
  | 命令 | 说明 |\n| --- | --- |\n| `\\|history` | 返回搜索历史表 |\n| `\\|history events=true`\
  \ | 返回搜索历史中的所有事件 |\n\n### table\n\nSPL 中的`table`命令在你希望包含在报告中的所有字段名上生成一个表格。\n\n表\
  \ 2-8 显示了`table`命令的语法。\n\n**表 2-8** `table`命令语法\n\n| 命令 | 说明 |\n| --- | --- |\n\
  | `\\|table fieldname1,fieldname2` | 仅在提供的字段名上创建表格 |\n\n\n\n### `stats`\n\n`stats`\
  \ 命令用于计算聚合统计信息，例如结果的平均值、计数和总和。它类似于 SQL 中的聚合操作。\n\n行首的第一个元素即为聚合函数。\n\n#### 聚合函数\n\
  \n聚合函数将每个事件的值汇总，以生成一个单一的、有意义的数值。表 2-9 描述了 Splunk 中的各种聚合函数。\n\n表 2-9 聚合函数\n\n| 函数名称\
  \ | 命令 | 说明 |\n| --- | --- | --- |\n| `avg(field)` | `\\|stats avg(field_name)`\
  \ | `Stats Avg` 函数返回某个字段的事件平均值 |\n| `count(field)` | `\\|stats count(field_name)`\
  \ | `Stats count` 函数返回某个字段的事件计数 |\n| `distinct_count(field)` | `\\|stats dc(field_name)`\
  \ | `Stats distinct_count` 函数返回某个字段的不同值 |\n| `max(field)` | `\\|stats max(field_name)`\
  \ | `Stats max` 函数返回字段的最大值 |\n| `median(field)` | `\\|stats median(field_name)`\
  \ | `Stats median` 函数返回字段的中位数 |\n| `min(field)` | `\\|stats min (field_name)` |\
  \ `Stats min` 函数返回字段的最小值 |\n| `mode(field)` | `\\|stats mode(field_name)` | `Stats\
  \ mode` 函数返回字段的众数（出现最频繁的值） |\n| `sum(field)` | `\\|stats sum(field_name)` | `Stats\
  \ sum` 函数返回字段值的总和 |\n| `var(field)` | `\\|stats mode(field_name)` | `Stats var`\
  \ 函数返回字段值的方差 |\n\n#### 事件顺序函数\n\n事件顺序函数按时间顺序或时间戳顺序返回事件。表 2-10 解释了各种事件顺序函数。\n\n表\
  \ 2-10 事件顺序函数\n\n| 函数名称 | 命令 | 说明 |\n| --- | --- | --- |\n| `first(field)` | `\\\
  |stats first(field_name)` | `Stats first` 函数返回字段的第一个值 |\n| `last(field)` | `\\|stats\
  \ last(field_name)` | `Stats last` 函数返回字段的最后一个值 |\n\n#### 多值 stats 和 chart 函数\n\n\
  多值 stats 和 chart 函数以多值条目的形式返回字段 X 的值。表 2-11 解释了 Splunk 中的各种多值 stats 和 chart 函数。\n\
  \n表 2-11 多值 stats 和 chart 函数\n\n| 函数名称 | 命令 | 说明 |\n| --- | --- | --- |\n| `list(field)`\
  \ | `\\|stats list(field_name)` | 此 `stats list` 函数返回字段值的列表 |\n| `values(field)`\
  \ | `\\|stats values(field_name)` | `stats values` 函数返回字段不同值的列表 |\n\n#### 时间图函数\n\
  \n时间图是对字段进行统计聚合以生成图表，时间作为 X 轴。表 2-12 解释了 Splunk 中的各种时间图函数。\n\n表 2-12 时间图函数\n\n|\
  \ 函数名称 | 命令 | 说明 |\n| --- | --- | --- |\n| `per_day(field)` | `\\|stats per_day(field_name)`\
  \ | `Stats per_day` 返回字段每天的比率。 |\n| `per_hour(field)` | `\\|stats per_hour(field_name)`\
  \ | `Stats per_hour` 返回字段每小时的比率。 |\n| `per_minute(field)` | `\\|stats per_day(field_name)`\
  \ | `Stats per_minute` 返回字段每分钟的比率。 |\n| `per_second(field)` | `\\|stats per_second(field_name)`\
  \ | `Stats per_second` 返回字段每秒钟的比率。 |\n\n### `untable`\n\n`untable` 命令将结果从表格格式转换为类似于统计信息标签页的格式。\n\
  \n表 2-13 描述了 `untable` 命令。\n\n表 2-13 `untable` 命令\n\n| 命令 | 说明 |\n| --- | --- |\n\
  | `\\|untable fieldnameX filednameY fieldvalueY` | 它们在 `Fieldname` 上返回重复事件，但 `fieldvalue\
  \ Y` 具有来自 `fieldname X` 的唯一值。 |\n\n### `chart`\n\n`chart` 命令是一个转换命令，因为它以表格形式返回结果。此命令还可以以图表形式显示数据。您可以决定\
  \ X 轴上的内容。\n\n通过使用 `chart` 命令，您可以使用 `over` 和 `by` 子句对数据进行分组。\n\n表 2-14 显示了各种 `chart`\
  \ 命令及其应用。\n\n表 2-14 `chart` 命令\n\n| 命令 | 说明 |\n| --- | --- |\n| `\\|chart count\
  \ over field name` | 它统计事件数并以表格格式检索。您可以使用可视化工具将结果绘制成图形。 |\n| `\\|chart count over\
  \ filename by hostname` | 此命令根据您使用的 `over` 和 `by` 子句对数据进行分组。 |\n| `\\|chart avg(fieldname)\
  \ over host` | 在此命令中，您对主机名使用 `avg` 函数。 |\n| `\\|chart avg(fieldname) over host by\
  \ time` | 在此命令中，您对主机名使用 `avg` 函数，并将时间作为分组子句。 |\n\n### `timechart`\n\n`timechart`\
  \ 命令是一个转换命令。`timechart` 是一种统计聚合命令，应用于 Y 轴上的字段，以生成图表，时间作为 X 轴。\n\n表 2-15 描述了 `timechart`\
  \ 命令。\n\n表 2-15 `timechart` 命令\n\n| 命令 | 说明 |\n| --- | --- |\n| `\\|timechart count`\
  \ | 它根据提供的数据源计算特定时间点的事件数量。 |\n| `\\|timechart count by fieldname` | 它根据提供的字段名称计算特定时间点的事件数量。\
  \ |\n\n至此，本章已介绍了管道操作符、时间修饰符、搜索语言语法以及三个布尔命令。\n\n## 过滤、修改和添加字段\n\n本节分析了在报表中过滤、修改和添加字段的方法。其中一些命令包括\
  \ `eval`、`rex`、`lookup` 和 `field`。\n\n### `eval`\n\n`eval` 命令计算表达式并将结果值放入搜索字段值中。如果计算\
  \ `(x1, y1, x2, y2)`，则第一个表达式 `x1` 是一个布尔表达式。如果返回 `True`，则计算 `y1` 的结果。如果为 `False`，则计算下一个布尔表达式\
  \ `x2`。\n\n有几个函数需要讨论。\n\n\n\n### 比较与条件函数\n\n比较与条件函数用于比较数值或指定条件语句。表 2-16 解释了 Splunk\
  \ 中的各类比较与条件函数。\n\n**表 2-16** 比较与条件函数\n\n| 函数名 | 命令 | 解释 |\n| --- | --- | --- |\n\
  | `case(x,\"Y\",x1,\"Y1\")` | `` \\| eval Description=case(fieldname<=value, \"\
  message\", fieldname>value AND fieldname<=value, \"message\",fieldname>value, \"\
  message\") `` | 此语句接受交替出现的条件。 |\n| `Cidrmatch(\"X\",Y)` | `` \\| eval isLocal=if(cidrmatch(\"\
  value\",Fieldname), \"Message\", \"Message\") \\| table isLocal `` | 根据是否匹配 CIDR\
  \ 返回真值或假值。 |\n| `coalesce(X,...)` | `` \\| eval ip=coalesce(fieldname1,fieldname2)\
  \ `` | 该函数判断 X 的值，若为真则返回 Y；否则返回 Z。 |\n| `if(X,Y,Z)` | `` \\| eval err=if(fieldname\
  \ == value, \"message\", \"message\") `` | 该函数判断 X 的值，若为真则返回 Y；否则返回 Z。 |\n| `in(FIELD,VALUE-LIST)`\
  \ | `` \\| where fieldname in(\"value\", \"value\", \"value\", \"value\") `` | 如果其中一个字段值被验证通过，则返回真值。\
  \ |\n| `Like(TEXT,PATTERN)` | `` \\| eval is_a_foo=if(like(field, \"value\"), \"\
  message\", \"message\") `` | 如果文本匹配模式，则返回真值。 |\n| `match(SUBJECT,\"REGEX\")` | ``\
  \ \\| eval k = if(match(field_value,\"message\"), 1, 0) `` | 根据正则表达式匹配结果返回真值或假值。\
  \ |\n| `null()` | `` \\| eval n=nullif(fieldA,fieldB) `` | 该函数不接受任何参数，并返回 NULL。\
  \ |\n| `nullif(X,Y)` | `` \\| eval n=nullif(fieldA,fieldB) `` | 该函数用于比较字段。如果 X 和\
  \ Y 相同，则返回 NULL；否则返回 X。 |\n| `Searchmatch(X)` | `` \\| makeresults 1 \\| eval _raw\
  \ = \"x=message1 y=message2\" \\| eval x=\"message1\" \\| eval y=\"message2\" \\\
  | eval test=if(searchmatch(\"x=message1 y=*\"), \"yes\", \"no\") \\| table _raw\
  \ test x y `` | 如果 `searchmatch(x)` 与事件匹配，则返回真值；否则返回假值。 |\n| `validate(X,Y,Z)` |\
  \ `` \\| eval n=validate(isint(port), \"Message\", port >= range AND port <= range,\
  \ \"Message\") `` | 该函数与 case 函数功能相反。 |\n\n### 转换函数\n\n转换函数用于在数字和字符串之间进行互相转换。表 2-17\
  \ 解释了 Splunk 中的各类转换函数。\n\n**表 2-17** 转换函数\n\n| 函数名 | 命令 | 解释 |\n| --- | --- | ---\
  \ |\n| `printf(\"formats\",arguments)` | `` \\| eval new_field=printf(\"%04.4f %-30s\"\
  ,field_one,field_two) `` | 类似于 C 语言中的 `sprintf()` 函数。 |\n| `tonumber(NUMSTR,BASE)`\
  \ | `` \\| eval n=tonumber(fieldname) `` | 将输入字符串 `NUMSTR` 转换为字段名称。 |\n| `tostring(X,Y)`\
  \ | `` \\| eval foo=615 \\| eval foo2 = tostring(foo, \"Message\") `` | 将输入值转换为字符串。\
  \ |\n\n### 加密函数\n\nSplunk 中的加密函数用于计算字符串值的安全哈希值。表 2-18 解释了 Splunk 中的各类加密函数。\n\n**表\
  \ 2-18** 加密函数\n\n| 函数名 | 命令 | 解释 |\n| --- | --- | --- |\n| `md5(X)` | `` \\| eval\
  \ n=md5(field) `` | 计算并返回 X 的 MD5 哈希值。 |\n| `sha1(X)` | `` \\| eval n=sha1(field)\
  \ `` | 基于 SHA-1 哈希函数计算并返回字符串 X 的安全哈希值。 |\n| `Sha256(X)` | `` \\| eval n=sha256(field)\
  \ `` | 基于 SHA-256 哈希函数计算并返回字符串 X 的安全哈希值。 |\n| `sha512(X)` | `` \\| eval n=sha512(field)\
  \ `` | 基于 SHA-512 哈希函数计算并返回字符串 X 的安全哈希值。 |\n\n### 日期和时间函数\n\nSplunk 中的日期和时间函数包含可以计算日期和时间的函数。表\
  \ 2-19 描述了 Splunk 中的各类日期和时间函数。\n\n**表 2-19** 日期和时间函数\n\n| 函数名 | 命令 | 解释 |\n| ---\
  \ | --- | --- |\n| `now()` | `` \\| eval k=now() `` | 不接受任何参数，并返回搜索开始的时间。 |\n| `relative_time(X,Y)`\
  \ | `` \\| eval k=relative_time(now(),\"-15d@d\") `` | 将 X 作为第一个参数，Y 作为第二个参数，并显示该时间范围内的所有事件。\
  \ |\n| `strftime(X,Y)` | `` eval min_sec=strftime(_time, \"%M:%S\") `` | 将 X 作为\
  \ Unix 时间值作为第一个参数，Y 作为字符串时间值。 |\n\n### 信息函数\n\n信息函数包含返回数值信息的相关命令。表 2-20 解释了 Splunk\
  \ 中的信息函数。\n\n**表 2-20** 信息函数\n\n| 函数名 | 命令 | 解释 |\n| --- | --- | --- |\n| `isint(X)`\
  \ | `` \\| eval n=if(isint(field),\"int\", \"not int\")\\|table n `` | 接受一个参数，如果参数为真则返回真值；否则返回假值。\
  \ |\n| `isnotnull(X)` | `` \\| eval n=if(isnotnull(field_name),\"yes\",\"no\")\\\
  |table n `` | 接受一个参数，根据该参数是否为非空返回 yes 或 no。 |\n| `isnull(X)` | `` \\| eval n=if(isnull(field_name),\"\
  yes\",\"no\")\\|table n `` | 接受一个参数，根据该参数是否为空返回 yes 或 no。 |\n| `isnum(X)` | `` \\\
  | eval n=if(isnum(field_name),\"yes\",\"no\")\\|table n `` | 接受一个参数，根据参数值返回 yes\
  \ 或 no。如果参数是数字，则返回 yes。 |\n| `isstr(X)` | `` \\| eval n=if(isstr(field_name),\"\
  yes\",\"no\")\\|table n `` | 接受一个参数，根据参数值返回 yes 或 no。如果参数是字符串，则返回 yes。 |\n| `typeof(X)`\
  \ | `` \\| eval n=typeof(12) + typeof(\"string\") + typeof(1==2) + typeof(badfield)\\\
  |table n `` | 接受一个参数，并返回该参数的数据类型。 |\n\n### 数学函数\n\n数学函数包含可以执行数学计算的函数。表 2-21 解释了\
  \ Splunk 中的各类数学函数。\n\n**表 2-21** 数学函数\n\n| 函数名 | 命令 | 解释 |\n| --- | --- | --- |\n\
  | `abs(X)` | `` \\| makeresults \\| eval a=abs(number) `` | 接受数字 X，并返回其绝对值。 |\n\
  | `ceiling(X)` | `` \\| makeresults \\| eval n=ceil(1,9) `` | 将数字 X 向上舍入到下一个最高的整数。\
  \ |\n| `exp(X)` | `` \\| makeresults \\| eval y=exp(3) `` | 返回数字和函数的指数值。 |\n| `floor(X)`\
  \ | `` \\| makeresults \\| eval n=floor(1.9) `` | 将数字 X 向下舍入到最近的整数。 |\n| `ln(X)`\
  \ | `` \\| makeresults \\| eval lnBytes=ln(bytes) `` | 接受数字 X，并返回其自然对数。 |\n| `log(X,Y)`\
  \ | `` \\| makeresults \\| eval num=log(number,2) `` | 接受一个或两个数值参数，并以第二个参数 Y 为底数，返回第一个参数\
  \ X 的对数。 |\n| `pi()` | `` \\| makeresults \\| eval area_circle=pi()*pow(radius,2)\
  \ `` | 不接受任何参数，并返回精确到 11 位小数的常数 pi。 |\n| `sqrt(X)` | `` \\| makeresults \\| eval\
  \ n=sqrt(9) `` | 接受一个参数，并返回其平方根。 |\n\n\n\n### 多值 eval 函数\n\n多值 eval 函数通过 `mvappend`\
  \ 和 `mvdedup` 等命令返回多值字段。表 2-22 解释了多值 eval 函数的类型。\n\n表 2-22\n\n多值 eval 函数\n\n| 函数名称\
  \ | 命令 | 说明 |\n| --- | --- | --- |\n| `commands(X)` | `\\| eval x=commands(\"\"\
  )` | 它接受一个搜索字符串，或包含搜索字符串的字段（例如 `X`），并返回一个多值字段，其中包含在 `X` 中使用的命令列表。 |\n| `mvappend(X,….)`\
  \ | `\\| eval fullName=mvappend(initial_values, \"middle value\", last_values)`\
  \ | 它接受 `N` 个参数，并返回包含所有值的结果。这些值可以是字符串、多值字段或单值字段。 |\n| `mvdedup(X)` | `\\| eval s=mvdedup(mvfield)`\
  \ | 它接受一个多值字段，并返回一个已移除重复值的多值字段。 |\n| `mvsort(X)` | `\\| eval s=mvsort(mvfield)`\
  \ | 它接受一个多值字段，并返回一个按字典序排序的字段。 |\n\n### 统计 eval 函数\n\n统计 eval 函数是用于计算统计数据的求值函数。诸如\
  \ `max`、`min` 和 `random` 之类的命令都属于统计 eval 函数类型。\n\n表 2-23 解释了这些函数及其各自的命令。\n\n表 2-23\n\
  \n统计 eval 函数\n\n| 函数名称 | 命令 | 说明 |\n| --- | --- | --- |\n| `max(X,Y,..)` | `\\|\
  \ eval n=max(1, 3, 6, 7, \"foo\", field)` | 它接受任意输入，并返回最大值结果。 |\n| `min(X,….)` |\
  \ `\\| eval n=min(1, 3, 6, 7, \"foo\", field)` | 它接受任意输入，并返回最小值结果。 |\n| `random()`\
  \ | `\\| makeresults \\| eval n=random()` | 它不接受任何参数，并返回一个范围从 0 到 2³¹-1 的伪随机整数。\
  \ |\n\n### 文本函数\n\n文本函数在函数和嵌套函数中返回关于字符串和数字字段的信息。`len`、`lower`、`ltrim` 和 `rtrim`\
  \ 是 Splunk 中文本函数的类型。\n\n表 2-24 解释了这些函数及其命令。\n\n表 2-24\n\n文本函数\n\n| 函数名称 | 命令 | 说明\
  \ |\n| --- | --- | --- |\n| `len(X)` | `\\| eval k= len(field_name) \\| table k`\
  \ | 它返回 `field_name` 的字符数。 |\n| `lower(X)` | `\\| eval k= lower(field_name) \\|\
  \ table k` | 它接受一个字段值，并将字符串转换为小写。 |\n| `ltrim(X,Y)` | `\\| eval k= ltrim(Field_name,\"\
  value\") \\| table k` | 它接受一个或两个参数 `X` 和 `Y`，并返回从 `X` 的左侧修剪掉 `Y` 中的字符后的结果。如果未指定\
  \ `Y`，则移除空格和制表符。 |\n| `rtrim(X,Y)` | `\\| eval k= rtrim(Field_name,\"value\") \\\
  | table k` | 它接受一个或两个参数 `X` 和 `Y`，并返回从 `X` 的右侧修剪掉 `Y` 中的字符后的结果。如果未指定 `Y`，则移除空格和制表符。\
  \ |\n| `upper(X)` | `\\| eval k= upper(field_name) \\| table k` | 它接受一个字段值，并将字符串转换为大写。\
  \ |\n\n### 三角函数和双曲函数\n\n为了计算三角函数和双曲函数值，Splunk 包含了诸如 `acos`、`acosh`、`asin` 和 `asinh`\
  \ 等命令。它们在表 2-25 中进行了解释。\n\n表 2-25\n\n三角函数和双曲函数值\n\n| 函数名称 | 命令 | 说明 |\n| --- | ---\
  \ | --- |\n| `acos(X)` | `\\| eval n=acos(0)` | 计算 `X` 在区间 [0, pi] 弧度内的反余弦值。 |\n\
  | `acosh(X)` | `\\| eval n=acosh(2)` | 计算 `X` 的反双曲余弦值（单位为弧度）。 |\n| `asin(X)` | `\\\
  | eval n=asin(1)` | 计算 `X` 在区间 [-pi/2, +pi/2] 弧度内的反正弦值。 |\n| `asinh(X)` | `\\| eval\
  \ n=asinh(1)` | 计算 `X` 的反双曲正弦值（单位为弧度）。 |\n| `sin(X)` | `\\| eval n=sin(1)` | 计算\
  \ `X` 的正弦值。 |\n| `sinh(X)` | `\\| eval n=sinh(1)` | 计算 `X` 的双曲正弦值。 |\n| `tan(X)`\
  \ | `\\| eval n=tan(1)` | 计算 `X` 的正切值。 |\n| `tanh(X)` | `\\| eval n=tanh(1)` | 计算\
  \ `X` 的双曲正切值。 |\n\n## Rex\n\n`rex` 命令从正则表达式命名组中提取字段，或使用 `sed` 表达式替换特定字段中的字符。\n\n\
  `rex` 命令将匹配的值与表达式进行匹配。表 2-26 解释了 `rex` 命令。\n\n表 2-26\n\n`rex` 命令\n\n| 命令 | 说明 |\n\
  | --- | --- |\n| `\\| rex field=_raw \"From: <(?<from>.*)> To: <(?<to>.*)>\"` |\
  \ 它提取字段值；例如，提取出 \"from\" 和 \"TO\"。 |\n\n模式设置为 `sed` 会将替换字符替换为字段的给定值。此功能解释如下。\n\n\
  ```\n| rex field=fieldname  mode=sed \"value\"\n```\n\n它会将字段的当前值替换为您指定的值。\n\n##\
  \ Lookup\n\n`lookup` 命令通过从表中添加字段值组合来丰富用户数据。SPL 中的 Lookup 将字段添加到从搜索获得的结果中的事件数据中。\n\
  \n表 2-27 解释了 lookup 函数。\n\n表 2-27\n\n`lookup` 函数\n\n| 命令 | 说明 |\n| --- | --- |\n\
  | `\\| lookup lookup_name Fieldname OUTPUTNEW field_name2` | 在此命令中，`lookup_name`\
  \ 尝试将每个事件中字段的值进行匹配，并返回 `field_name2`。 |\n\nLookup 有两种类型：输入（input）和输出（output）。\n\n\
  ### 输入 Lookup (Input Lookup)\n\n输入 Lookup 会搜索查找表的内容。（更多内容请参见第 4 章。）\n\n输入 Lookup\
  \ 的命令在表 2-28 中进行了解释。\n\n表 2-28\n\n输入 Lookup (Input Lookup)\n\n| 命令 | 说明 |\n| ---\
  \ | --- |\n| `\\| inputlookup test` | 此命令从在 `transforms.conf` 中定义的测试查找中读取数据。 |\n\
  | `\\| inputlookup append=t test` | 此命令从在 `transforms.conf` 中定义的测试查找中读取数据，并将该字段附加到计数结果中。\
  \ |\n\n### 输出 Lookup (Output Lookup)\n\n输出 Lookup 将搜索结果中的字段写入到静态查找表文件中。\n\n输出 Lookup\
  \ 的命令在表 2-29 中进行了解释。\n\n表 2-29\n\n输出 Lookup 命令\n\n| 命令 | 说明 |\n| --- | --- |\n|\
  \ `\\| outputlookup lookupname` | 此命令将查找到的名称写入到在 `transforms.conf` 中指定的查找表中。 |\n\
  | `\\| outputlookup test.csv` | 此命令将数据写入到 `$SPLUNK_HOME/etc/system/lookups` 或 `$SPLUNK_HOME/etc/apps/*/lookups`\
  \ 下的 `test.csv` 查找文件中。 |\n\n简而言之，lookup 通过组合来丰富字段值数据。\n\n## Field\n\n`field` 命令根据提供的条件保留或移除搜索字段结果（见表\
  \ 2-30）。\n\n表 2-30\n\n`field` 命令\n\n| 命令 | 说明 |\n| --- | --- |\n| `\\| fields -fieldname1,fieldname2`\
  \ | 从结果中移除 `fieldname1, fieldname2`。 |\n| `\\| fields fieldname1,fieldname2 \\|\
  \ fields - _*` | 它仅保留 `fieldname1, fieldname2`，并从结果中移除其余字段。 |\n\n本章的最后一部分讨论了分组结果。\n\
  \n## 分组结果\n\nSPL 中的分组结果决定了在特定 `_time` 范围内，为特定 ID 以及所需字段的事件总数。这对于识别事件中的模式非常有用。\n\n\
  用于分组的命令是 `transaction` 命令。\n\n\n\n### 事务\n\n当您要求所有事件都相互关联，并且必须根据开始和结束值来定义事件分组时，需要使用\
  \ `transaction`（事务）命令。事务的默认最大值为 1000。\n\n表 2-31 描述了用于对结果进行分组的不同 `transaction`（事务）命令。\n\
  \n**表 2-31** 事务命令\n\n| 命令 | 说明 |\n| --- | --- |\n| `\\|transaction fieldname` |\
  \ 显示所有具有指定 `fieldname`（字段名）的事务性事件 |\n| `\\|transaction fieldname maxpause=value`\
  \ | 显示所有具有指定 `fieldname`（字段名）且事件间最大暂停间隔等于给定 `value`（值）的事务性事件 |\n| `\\|transaction\
  \ fieldname maxspan=value` | 显示所有具有指定 `fieldname`（字段名）且事件间最大跨度等于给定 `value`（值）的事务性事件\
  \ |\n| `\\|transaction fieldname maxspan=value and maxpause=value` | 显示所有具有指定 `fieldname`（字段名），且事件间最大跨度等于给定\
  \ `value`（值）和最大暂停间隔等于给定 `value`（值）的事务性事件 |\n\n## 总结\n\n本章概述了 Splunk SPL。您学习了搜索管道和搜索处理语言的排序命令。您熟悉了语法着色和结果排序功能以及布尔运算符\
  \ `AND`、`OR` 和 `NOT`。您还学习了筛选和报告命令以及 Splunk 中的字段。要了解有关这些主题的更多信息，请参阅 [`https://docs.splunk.com/Documentation/Splunk/7.2.4/SearchReference/ListOfSearchCommands`](https://docs.splunk.com/Documentation/Splunk/7.2.4/SearchReference/ListOfSearchCommands)。\n\
  \n下一章将讨论字段提取、宏和字段别名，并提供一个示例 SPL 查询。\n\n## 多项选择题\n\n1.  `timechart` 函数是 ___ 的一部分\n\
  \    1.  结果排序\n    2.  筛选命令\n    3.  报告命令\n    4.  结果分组\n\n2.  选择 `stats` 命令的所有函数。\n\
  \    1.  `count`\n    2.  `distinct_count`\n    3.  `sum`\n    4.  `chart`\n   \
  \ 5.  `values`\n    6.  `list`\n\n3.  在 SPL 筛选器中筛选、修改和添加字段，并在报表中添加 ___。\n    1.\
  \  字段\n    2.  键\n    3.  值\n    4.  以上都不是\n\n4.  在 `stats` 命令中，`DC` 函数执行什么操作？\n\
  \    1.  返回符合搜索条件的事件数\n    2.  返回给定字段的唯一值计数\n    3.  返回数字字段的总和\n    4.  列出字段中的所有值\n\
  \n5.  默认情况下，`top` 命令的输出是表格格式。\n    1.  错误\n    2.  正确\n\n6.  Splunk 中任何搜索作业的默认时间线是多少？\n\
  \    1.  10 分钟\n    2.  7 分钟\n    3.  7 天\n    4.  10 天\n\n7.  在 Splunk SPL 中，时间是最有效的筛选器。\n\
  \    1.  正确\n    2.  错误\n\n**答案**\n\n*   a. 1\n*   b. 1\n*   c. 2\n*   d. 2\n* \
  \  e. 1\n*   f. 1, 2, 3, 5, 6\n*   g. 3\n\n"
- "# 3. 宏、字段提取和字段别名\n\n第 2 章概述了 Splunk 搜索处理语言 (SPL)、时间修饰符和管道运算符。本章讨论 Splunk 中的字段提取、宏和字段别名，并通过使用各种查询来探索\
  \ SPL。Splunk 中的字段提取是一个从原始数据中提取字段的过程。Splunk 可以在索引和搜索期间提取数据字段。Splunk 中的宏是可重用的代码块（可以保存以备将来使用的内容），您可以在其中为数据集的不同部分或值动态设置相同的逻辑。当您想频繁运行搜索命令时，宏非常有用，因为它可以省去您重写整个命令的麻烦。Splunk\
  \ 中的字段别名为字段提供了替代名称。字段别名与具有相似字段值的各种事件相关联。\n\n在处理小数据和大数据时，Splunk 搜索查询提供了灵活性。SPL 查询可帮助您理解如何使用\
  \ SPL 并熟悉 SPL 语法。\n\n本章涵盖以下主题。\n\n*   字段提取\n*   宏\n*   字段别名\n*   示例 SPL 查询\n\n在本章结束时，您将能够使用正则表达式和分隔符在\
  \ Splunk 中执行字段提取，创建宏和字段别名，并在 SPL 中触发查询。换句话说，您将完成 Splunk Power User 考试蓝图高达 30% 的内容。\n\
  \n让我们从字段提取开始。\n\n## Splunk 中的字段提取\n\n字段提取是关于创建新字段的。Splunk 为其索引的每个事件提取默认字段，例如 `host`（主机）、`source`（来源）和\
  \ `source type`（来源类型）。字段提取在索引和搜索期间提取数据字段。它提供了两种提取数据的方法：正则表达式和分隔符。\n\n\n\n### 正则表达式\n\
  \n正则表达式主要用于处理**非结构化**的事件数据。它们是用于匹配字符串中字符组合的模式。在 Splunk Web 中，你只需选择正则表达式字段和对应的值，它就会自动生成能够匹配其他事件中字段的正则表达式。如果正则表达式无法自动映射字段，你还可以手动编辑表达式，并相应丢弃不匹配的事件。\n\
  \n在第一章中，你在 Splunk 中导入了数据。你可以对该数据使用正则表达式来查找 IP（互联网协议）地址和端口。\n\n接下来将介绍使用正则表达式的各种方法。\n\
  \n#### 使用字段提取的正则表达式\n\n在本节中，你将使用字段提取来从 `index = \"Test\"` 中提取端口字段。其值不与端口值匹配的事件将使用黑名单移除。\n\
  \n以下步骤展示了如何使用正则表达式提取端口值。\n\n![../images/499684_1_En_3_Chapter/499684_1_En_3_Fig1_HTML.jpg](img/499684_1_En_3_Fig1_HTML.jpg)\n\
  \n图 3-1 正则表达式字段提取\n\n1.  单击 Splunk，然后进入屏幕顶部的 Enterprise。\n2.  进入第一章创建的 Test 应用。\n\
  3.  搜索事件 `index=\"Test\"`，并将时间范围选择为“所有时间”。\n4.  展开该事件，然后单击“提取字段”。\n5.  单击“正则表达式”，然后单击“下一步”。\n\
  6.  从事件中选择端口号，如图 3-1 所示。在“字段名称”中，输入 **ports**。\n\n![../images/499684_1_En_3_Chapter/499684_1_En_3_Fig2_HTML.jpg](img/499684_1_En_3_Fig2_HTML.jpg)\n\
  \n图 3-2 正则表达式黑名单\n\n7.  单击“下一步”，你将看到所有事件、匹配项和不匹配项。\n8.  选择不匹配的事件。它会被列入黑名单（黑名单是一种过滤规则，用于将某个事件排除在集合之外），并且你可以找到你的正则表达式。此时“选择字段”屏幕与图\
  \ 3-2 类似。\n9.  单击“下一步”，然后单击“保存”。\n\n接下来，让我们看一下内联正则表达式，它可以将值与端口值不匹配的事件列入黑名单。\n\n\
  #### 使用字段提取的内联正则表达式\n\n在本节中，你将使用内联正则表达式从 `index = \"Test\"` 中提取端口字段，并屏蔽所有值与端口值不匹配的事件。\n\
  \n以下步骤展示了如何在内联正则表达式中提取端口。\n\n1.  单击 Splunk，然后进入屏幕顶部的 Enterprise。\n2.  进入 Test 应用，搜索事件\
  \ `index=\"Test\"`，并将时间范围选择为“所有时间”。\n3.  展开该事件，然后单击“提取字段”。\n4.  单击“正则表达式”，然后单击“下一步”。\n\
  5.  选择 IP 地址。\n6.  在“字段名称”中，输入 **scrip**。\n7.  单击“必需”按钮，并选择一些事件。\n\n图 3-3 展示了一个“选择字段”的示例截图。\n\
  \n![../images/499684_1_En_3_Chapter/499684_1_En_3_Fig3_HTML.jpg](img/499684_1_En_3_Fig3_HTML.jpg)\n\
  \n图 3-3 内联正则表达式\n\n8.  单击“下一步”，然后单击“显示正则表达式”，再单击“编辑”。\n9.  将正则表达式内容替换为以下内容。\n10.\
  \ 按照上一个示例中的方法移除黑名单内容，单击“下一步”，然后单击“请保存”。\n11. 单击“下一步”，并将报告名称保存为 Test1。\n\n```\n(?=[^-]*(?:-|-.*-))^(?:[^\\\
  t\\n]*\\t){2}(?P[^ ]+)\n```\n\n一旦正则表达式被编辑，你将无法返回字段提取器用户界面。\n\n接下来，我们将讨论另一种字段提取方法：分隔符。\n\
  \n### 分隔符\n\n分隔符用于结构化数据。字段由常见的分隔符分隔，例如逗号、空格、制表符等。分隔符常用于 CSV 数据及类似格式。\n\n分隔符仅通过字段提取来使用。\n\
  \n#### 使用字段提取的分隔符\n\n在本节中，你将使用分隔符从 `index = \"Test\"` 中提取字段，并使用制表符将字段彼此分隔。\n\n以下是使用分隔符的步骤。\n\
  \n![../images/499684_1_En_3_Chapter/499684_1_En_3_Fig4_HTML.jpg](img/499684_1_En_3_Fig4_HTML.jpg)\n\
  \n图 3-4 分隔符字段提取\n\n1.  单击 Splunk，然后进入屏幕顶部的 Enterprise。\n2.  进入 Test 应用，搜索事件 `index=\"\
  Test\"`，并将时间范围选择为“所有时间”。\n3.  展开该事件，然后单击“提取字段”。\n4.  单击“分隔符”，然后单击“下一步”。\n5.  通过选择“制表符”来指定分隔符。图\
  \ 3-4 展示了分隔符屏幕。\n6.  将所有字段重命名如下：\n    *   `field1=id`\n    *   `field2=lat_long`\n\
  \    *   `field3=ip_port`\n    *   `field4=timestamp`\n\n图 3-5 展示了重命名过程。\n\n![../images/499684_1_En_3_Chapter/499684_1_En_3_Fig5_HTML.jpg](img/499684_1_En_3_Fig5_HTML.jpg)\n\
  \n图 3-5 在分隔符中重命名字段\n\n7.  单击“下一步”，并将报告名称保存为 Test2。\n8.  单击“完成”。\n\n当你的事件包含结构化数据（例如\
  \ JSON 文件、CSV 文件等）时，请使用分隔符。\n\n下一节，我们将讨论搜索命令宏。\n\n## 宏\n\nSplunk 中的宏可以是 SPL 中的完整搜索命令，也可以是搜索命令的一部分。当你需要频繁运行某个搜索命令时，宏非常有用，因为你无需重写整个命令。\n\
  \n在 Splunk 中创建宏有两种方法。\n\n*   使用 Splunk Web\n\n*   使用 `.conf` 文件\n\n宏是可重用的知识对象，因为多个用户和多个应用都可以使用它们。\n\
  \n### 使用 Splunk Web 创建宏\n\nSplunk 中的宏是一个可重用块，你可以在数据集的不同部分或值上动态应用相同的逻辑。使用 Splunk\
  \ Web 为 test 应用创建一个宏，并为最大暂停时间为 20 分钟的事务创建一个宏。\n\n按照以下步骤使用 Splunk Web 创建宏。\n\n1.\
  \  单击“设置”，然后进入“高级搜索”。\n2.  选择“搜索宏”，然后单击“新建宏”。\n3.  在“目标应用”中，输入 **test**。\n4.  在“名称”中，输入\
  \ **session**。\n5.  在“定义”中，输入 **transaction maxpause=20m**。\n6.  单击“保存”。\n\n图 3-6\
  \ 显示了执行这些步骤时的“添加新”页面。\n\n![../images/499684_1_En_3_Chapter/499684_1_En_3_Fig6_HTML.jpg](img/499684_1_En_3_Fig6_HTML.jpg)\n\
  \n图 3-6 创建宏\n\n7.  要测试该宏，请进入搜索栏并输入以下命令。\n\n```\nindex=\"test\"|`session`|timechart\
  \ span=1d sum(eventcount)| as sessions\n```\n\n图 3-7 展示了输出。\n\n![../images/499684_1_En_3_Chapter/499684_1_En_3_Fig7_HTML.jpg](img/499684_1_En_3_Fig7_HTML.jpg)\n\
  \n图 3-7 宏的输出\n\n注意\n\n要在 SPL 中运行宏，你必须使用 `` `macro_name` ``。\n\n接下来，让我们看看创建宏的另一种方法。\n\
  \n\n\n### 使用 `.conf` 文件创建宏\n\n要在 Splunk 中使用 `.conf` 文件创建宏，请转到 `$Splunk_Home/etc/apps/<app_name>/local/macros.conf`。如果该文件不存在，请创建它；如果存在，请编辑它。\n\
  \n在本节中，您将使用 `.conf` 文件为测试应用程序创建一个宏。该宏将是一个事务，其最大暂停时间为 20 分钟。转到 `$Splunk_Home/etc/apps/Test/local/`。如果\
  \ `macros.conf` 存在，请编辑它；否则，您需要创建它。\n\n`macros.conf` 文件准备就绪后，请按照以下步骤操作：\n\n1.  添加以下代码块。\n\
  \    ```\n    [Test9]\n    definition = index=\"test\"|transaction maxpause=20m|timechart\
  \ span=1d sum(eventcount) as sessions\n    ```\n2.  重启 Splunk。\n3.  转到“设置”。\n4.\
  \  转到“高级搜索”。\n5.  搜索“宏”。\n6.  转到使用 `.conf` 添加的宏 `Test9`。\n\n可用的“搜索宏”页面如图 3-8 所示。\n\
  \n![../images/499684_1_En_3_Chapter/499684_1_En_3_Fig8_HTML.jpg](img/499684_1_En_3_Fig8_HTML.jpg)\n\
  \n**图 3-8** 图示宏：测试应用\n\n1.  要测试此宏，请转到搜索栏并输入以下命令。\n    ```\n    index=\"test\"|`session`|timechart\
  \ span=1d sum(eventcount) as sessions\n    ```\n\n图 3-9 显示了输出结果。\n\n![../images/499684_1_En_3_Chapter/499684_1_En_3_Fig9_HTML.jpg](img/499684_1_En_3_Fig9_HTML.jpg)\n\
  \n**图 3-9** 宏 `Test9`\n\n接下来，让我们讨论字段别名。\n\n## Splunk 中的字段别名\n\n字段别名用于关联 Splunk 中具有相似字段值的各种事件。为了更深入地洞察这些事件，您可以使用字段别名对两个或多个具有相似字段值的字段进行分组。\n\
  \n让我们来看看如何在 Splunk 环境中设置字段别名。\n\n### 设置字段别名\n\n在本节中，您将上传两个数据源：`Test2.txt` 和 `Test3.csv`。在\
  \ `Test2.txt` 中，您有 `unit_id`，而在 `Test3.csv` 中，您有 `id`。您将为 `unit_id` 和 `id` 创建字段别名。\n\
  \n您可以从 [`https://github.com/deeppmehta/splunk-certification-guide/blob/main/ch3/Test2.txt`](https://github.com/deeppmehta/splunk-certification-guide/blob/main/ch3/Test2.txt)\
  \ 下载 `Test2.txt`。\n\n要设置字段别名，请按照以下步骤操作：\n\n1.  转到“添加数据”并上传 `Test2.txt`。\n2.  将“源类型”设置为“默认”，将“事件中断”设置为“每行”。\n\
  \n图 3-10 显示了“设置源类型”页面。\n\n![../images/499684_1_En_3_Chapter/499684_1_En_3_Fig10_HTML.jpg](img/499684_1_En_3_Fig10_HTML.jpg)\n\
  \n**图 3-10** 源类型：`test89`\n\n1.  单击“下一步”，并将新索引创建为 `tes22`，将应用程序名称设置为 `test`，将源类型设置为\
  \ `test89`。\n\n您可以从 [`https://github.com/deeppmehta/splunk-certification-guide/blob/main/ch3/Test3.csv`](https://github.com/deeppmehta/splunk-certification-guide/blob/main/ch3/Test3.csv)\
  \ 下载 `Test3.csv`。\n\n![../images/499684_1_En_3_Chapter/499684_1_En_3_Fig11_HTML.jpg](img/499684_1_En_3_Fig11_HTML.jpg)\n\
  \n**图 3-11** 源类型：`test2`\n\n1.  转到“添加数据”并上传数据。\n2.  选择 `test3.csv`。\n3.  将“源类型”设置为“默认”，将“事件中断”设置为“每行”。“设置源类型”页面如图\
  \ 3-11 所示。\n4.  单击“下一步”，并将新索引创建为 `tes22`，将应用程序名称设置为 `test`。\n\n对于 `Test2.txt` 的字段提取，请执行以下操作：\n\
  \n1.  导航到测试应用程序的搜索命令。索引是 `tes22`，源是 `test2`。\n2.  在“字段名称”中，使用“分隔符提取字段”为 `Test2.txt`\
  \ 提取字段，然后提供以下字段名称并将制表符设置为分隔符。\n    ```\n    field1=unit_id\n    field2=method\n\
  \    field3=timestamp\n    field4=status\n    field5=category\n    field6=location\n\
  \    ```\n\n对于 `Test3.txt` 的字段提取，请执行以下操作：\n\n1.  使用 Splunk Web 导航到测试应用程序，进入搜索命令并在其中输入\
  \ `index = \"tes22\" source = \"Test3.csv\"`。\n2.  在“字段名称”中，使用“分隔符提取字段”为 `Test3`\
  \ 提取字段，然后提供以下字段名称并将分隔符设置为逗号。\n    ```\n    field1=id\n    field2=url\n    ```\n\n\
  在 `Test2.txt` 中，`unit_id` 是一个公共字段，在 `Test3.csv` 中，`id` 是一个公共字段，因此您可以使用字段别名来关联事件。\n\
  \n输入凭据后，请按照以下步骤操作：\n\n1.  转到“设置”。\n2.  选择“添加字段”。\n3.  转到“字段别名”。\n4.  单击“新增”。\n5.\
  \  在“目标应用程序”中，输入 `test`。\n6.  在“名称”中，输入 `tes11_test`。\n7.  在“应用于”中，选择“源”。\n8.  在“命名”中，输入\
  \ `test3.csv`。\n9.  在“字段别名”中，输入 `id=ptestid`。\n\n“新增”屏幕如图 3-12 所示。\n\n![../images/499684_1_En_3_Chapter/499684_1_En_3_Fig12_HTML.jpg](img/499684_1_En_3_Fig12_HTML.jpg)\n\
  \n**图 3-12** 字段别名 `tes11_test:test3.csv`\n\n与前面的示例类似，添加另一个具有相似字段值的字段别名。\n\n1.  在“目标应用程序”中，输入\
  \ `test`。\n2.  在“名称”中，输入 `tes11_test`。\n3.  在“应用于”中，选择“源”，并在“命名”中，输入 `Test3.csv`。\n\
  4.  在“字段别名”中，输入 `unit_id=ptestid`。\n\n运行中的屏幕如图 3-13 所示。\n\n![../images/499684_1_En_3_Chapter/499684_1_En_3_Fig13_HTML.jpg](img/499684_1_En_3_Fig13_HTML.jpg)\n\
  \n**图 3-13** 字段别名 `tes11_test:Test3.csv`\n\n要检查命令是否成功执行，请参考以下步骤：\n\n![../images/499684_1_En_3_Chapter/499684_1_En_3_Fig14_HTML.jpg](img/499684_1_En_3_Fig14_HTML.jpg)\n\
  \n**图 3-14** 图示字段别名：测试应用\n\n1.  转到“设置”，然后转到“字段”。\n2.  在“字段别名”页面上，您会发现在图 3-14 中添加了两个字段别名。\n\
  \n要测试您添加的字段别名，请在搜索栏中输入以下 SPL 命令：\n\n```\nindex=\"tes22\" unit_id=1\n```\n\n用于测试字段别名的页面如图\
  \ 3-15 所示。\n\n![../images/499684_1_En_3_Chapter/499684_1_En_3_Fig15_HTML.jpg](img/499684_1_En_3_Fig15_HTML.jpg)\n\
  \n**图 3-15** 字段别名 `unit_id=1`\n\n字段别名可以对任何字段（主机、源或源类型）进行规范化。\n\n接下来，让我们介绍一个有助于关联数据的\
  \ Splunk 搜索查询。\n\n\n\n### Splunk 搜索查询\n\nSplunk 搜索查询用于关联数据，并广泛应用于数据搜索、过滤、修改、操作、丰富、插入和删除。无论处理小数据还是大数据，它们都能提供灵活性。您还可以在\
  \ Splunk 中分析和可视化数据。\n\n1. 编写一个 `index=\"test89\"` 查询，用户希望知道在 1 小时时间跨度内，事件总数何时超过\
  \ 150。显示总计数以及事件超过限制的时间。\n\n以下是解决方案。\n\n```\nindex=\"test89\" | bin span=1h _time\
  \ | stats count by _time | where count > 150\n```\n\n解决方案如图 3-16 所示。\n\n![../images/499684_1_En_3_Chapter/499684_1_En_3_Fig16_HTML.jpg](img/499684_1_En_3_Fig16_HTML.jpg)\n\
  \n图 3-16\n\n1. 显示 `index=\"test89\"` 上的事务事件，并且事务中的最大暂停时间不超过 10 分钟。\n\n以下是解决方案。\n\
  \n```\nindex=\"test89\" | transaction maxpause=10m\n```\n\n解决方案界面如图 3-17 所示。\n\n\
  ![../images/499684_1_En_3_Chapter/499684_1_En_3_Fig17_HTML.jpg](img/499684_1_En_3_Fig17_HTML.jpg)\n\
  \n图 3-17\n\n1. 编写一个针对 `index=\"test89\"` 的 Splunk 查询，以获取每个端口的事件计数。\n\n以下是解决方案。\n\
  \n```\nindex=\"test89\" |stats count by port\n```\n\n解决方案如图 3-18 所示。\n\n![../images/499684_1_En_3_Chapter/499684_1_En_3_Fig18_HTML.jpg](img/499684_1_En_3_Fig18_HTML.jpg)\n\
  \n图 3-18\n\n1. 编写一个针对 `index=\"test89\"` 的 Splunk 查询，以获取时间跨度为 1 小时的会话。\n\n以下是解决方案。\n\
  \n```\nindex=\"test89\"|`session`|timechart span=1h sum(eventcount) as sessions\n\
  ```\n\n解决方案如图 3-19 所示。\n\n![../images/499684_1_En_3_Chapter/499684_1_En_3_Fig19_HTML.jpg](img/499684_1_En_3_Fig19_HTML.jpg)\n\
  \n图 3-19\n\n请祝贺自己，因为你已经成功学会了如何使用正则表达式和分隔符在 Splunk 中创建宏和字段别名。\n\n## 总结\n\n本章涵盖了 Splunk\
  \ 中的字段提取，用于在索引化和搜索期间提取数据字段。你了解到，当需要频繁运行搜索命令时，宏非常有用，因为它避免了重写整个命令。你还了解了字段别名，它用于关联具有相似字段值的不同事件。此外，Splunk\
  \ 搜索查询在处理小数据和大数据时提供了灵活性。\n\n根据 Splunk Power User 考试蓝图，字段提取占 4%–10%，宏占 7%–10%，字段别名占\
  \ 5%–10%。\n\n在下一章中，你将学习 Splunk 标签和查找，并创建和设置警报。\n\n## 选择题测试题\n\n1. 如果字段出现在至少 _____\
  \ 的事件中，则这两个字段都会出现在“所有字段”和“有趣字段”列表中。\n   1. 10%\n   2. 80%\n   3. 40%\n   4. 20%\n\
  \n1. 字段别名规范了哪些默认字段上的数据？（选择所有适用项。）\n   1. 主机\n   2. 来源\n   3. 来源类型\n   4. 事件\n\n\
  1. 分隔符主要用于结构化数据吗？\n   1. 是\n   2. 否\n\n1. 编辑正则表达式后，能否返回字段提取器用户界面？\n   1. 是\n   2.\
  \ 否\n\n1. Splunk 中哪个父目录包含配置文件？\n   1. `SPLUNK_HOME/etc`\n   2. `SPLUNK_HOME/var`\n\
  \   3. `SPLUNK_HOME/conf`\n   4. `SPLUNK_HOME/default`\n\n1. 如果白名单和黑名单输入设置之间存在冲突，会使用哪一个？\n\
  \   1. 黑名单\n   2. 白名单\n   3. 两者相互抵消\n   4. 以上皆非\n\n**答案**\n\n* A: 1\n* B: 1\n* C:\
  \ 1\n* D: 2\n* E: 1、2 和 4\n* F: 4\n\n"
- "# 4. 标签、查找和关联事件\n\n在上一章中，你学习了如何使用分隔符和正则表达式从 Splunk 中提取字段，以创建宏和字段别名。你还执行了一些搜索处理语言命令来提高留存率。在本章中，你将处理\
  \ Splunk 标签和查找，并创建各种报告和警报。Splunk 标签是添加了命名约定的值对，用于为特定字段及其值组合分配名称。Splunk 查找通过从任何外部数据源添加字段-值组合来增强数据。报告是保存的搜索结果，显示相关的统计数据和可视化图表。同时，当搜索结果满足任何条件时，会触发警报。\n\
  \n以下是本章涵盖的主题。\n\n* Splunk 查找\n* Splunk 标签\n* 在 Splunk 中创建报告\n* 在 Splunk 中创建警报\n\n\
  到本章结束时，你将至少覆盖 Splunk Power User 考试蓝图的 10% 和 Splunk User 考试蓝图的 21%。\n\n## Splunk\
  \ 查找\n\n**查找** 是通过**向现有数据添加字段-值**来增强数据的命令。将来自多个源的数据添加到现有源中，通过另一个数据源中事件的相关字段，使用查找映射值来增强数据。例如，您可以使用查找来匹配浏览器中的错误代码，并返回一个包含错误代码详细描述的新字段。Splunk\
  \ 中有 4 种类型的查找，如图 4-1 所示。\n\n![../images/499684_1_En_4_Chapter/499684_1_En_4_Fig1_HTML.jpg](img/499684_1_En_4_Fig1_HTML.jpg)\n\
  \n图 4-1\n\nSplunk 查找类型\n\n每种查找类型说明如下。\n\n* **CSV 查找** 从 CSV 文件中提取键值对。它们从包含字段的事件中添加数据，并代表一个静态数据表。因此，它们也被称为**静态查找**。CSV\
  \ 表中的每一列都被解释为一个潜在的字段值。\n* **KV 存储查找** 从已定义的应用中提取键值对，并添加来自应用键值存储集合的事件数据及其字段。\n* **地理空间查找**\
  \ 创建返回结果的查询，Splunk 软件可以使用这些结果生成等值区域地图可视化效果。在此类查找中，数据源是一个 **KMZ**（压缩密钥标记语言）文件，该文件定义了地图区域的边界。\n\
  * **外部查找** 从外部源填充事件数据。它们可以是**Python 脚本**或**二进制可执行文件**，用于从外部源获取字段值。它们也被称为**脚本化查找**。\n\
  \n在 Splunk 中创建查找有三种不同的方法。\n\n* 查找表文件\n* 查找定义\n* 自动查找\n\n默认情况下，字段值区分大小写。\n\n\n好的，作为高级文档工程师和翻译员，我将根据您提供的注意事项和示例，将给定的英文文本翻译成中文。\n\
  \n\n### 查找表文件\n\n在 Splunk 中，当您需要使用 CSV 文件或 GZ 文件来定义查找时，可以使用查找表文件，具体取决于这些文件的可用性。在本节中，您将定义一个名为\
  \ `Location.csv` 的示例查找表。您可以在已有的查找表文件中定义自己的文件。\n\n![../images/499684_1_En_4_Chapter/499684_1_En_4_Fig2_HTML.jpg](img/499684_1_En_4_Fig2_HTML.jpg)\n\
  \n图 4-2 – 查找表\n\n1. 从 [`https://github.com/deeppmehta/splunk-certification-guide/blob/main/ch4/Location.csv`](https://github.com/deeppmehta/splunk-certification-guide/blob/main/ch4/Location.csv)\
  \ 下载 `Location.csv` 文件。`Location.csv` 包含两列：`location` 和 `state`，如图 4-2 所示。\n\n![../images/499684_1_En_4_Chapter/499684_1_En_4_Fig3_HTML.jpg](img/499684_1_En_4_Fig3_HTML.jpg)\n\
  \n图 4-3 – Splunk 查找表文件\n\n1. 转到 Splunk Web 上的“设置”，然后转到“查找”。\n2. 转到“查找表文件”，然后单击“新建”。\n\
  3. 在“目标应用”中，选择测试应用。\n4. 上传 `Location.csv` 文件。供您参考，示例图片如图 4-3 所示。\n5. 创建查找后，转到“查找表过滤”，您可以在其中找到\
  \ `Location.csv`。\n6. 单击 `Location.csv` 文件上的“权限”。您可以选择编辑各种角色。选择**允许所有人读取和写入**选项。（第\
  \ 6 章将介绍知识对象权限。）\n\nCSV 文件和 GZ 文件仅用于查找表。\n\n### 查找定义\n\n查找定义定义了用于比较 Splunk 中事件字段的数据类型和连接参数。查找定义需要一个查找表。在本节中，您将为在查找表文件中定义的\
  \ `Location.csv` 查找文件创建一个名为 `countries` 的查找。\n\n按照以下步骤创建查找定义。\n\n![../images/499684_1_En_4_Chapter/499684_1_En_4_Fig4_HTML.jpg](img/499684_1_En_4_Fig4_HTML.jpg)\n\
  \n图 4-4 – 查找定义\n\n1. 转到“设置”并选择“查找”。\n2. 转到“查找定义”，然后单击“新建”。\n3. 在“目标应用”中，选择测试应用。将其命名为\
  \ `Countries`。在“类型”中，选择“基于文件”。在“查找文件”中，选择 `Location.csv`。为了更好地理解，请参考图 4-4。\n4. 单击“保存”按钮，并编辑\
  \ `countries` 文件的权限，以允许所有人读取和写入。\n\n在下一节中，您将把查找输入字段映射到查找输出字段。\n\n### 自动查找\n\n在自动查找中，表文件需要将查找输入字段与查找输出字段映射。在本节中，您将把来自\
  \ `Test2.txt` 来源类型的事件中的 `location` 字段与 `Location.csv` 中的 `States` 列关联起来。\n\n以下步骤用于创建自动查找。\n\
  \n![../images/499684_1_En_4_Chapter/499684_1_En_4_Fig5_HTML.jpg](img/499684_1_En_4_Fig5_HTML.jpg)\n\
  \n图 4-5 – Splunk 自动查找\n\n1. 转到“设置”并单击“查找”。\n2. 选择“自动查找”，然后选择“新建”。\n3. 在“目标应用”中，选择\
  \ `test`。在“名称”中，输入 `test`。在“查找表”中，选择您在查找定义中创建的 `countries`。在“应用于”中，选择名为 `Test2.txt`\
  \ 的源类型。在“查找输入字段”中，输入 `location` = `location`。在“查找输出字段”中，输入 `City` = `City`。参考图 4-5。\n\
  4. 在 `test` 应用的搜索栏中，输入以下命令。\n\n```\nindex=\"tes22\" source=\"Test2.txt\"|lookup\
  \ Location.csv location output City\n```\n\n您可以在一个包含已映射事件的字段中找到州信息（见图 4-6）。\n\n\
  ![../images/499684_1_En_4_Chapter/499684_1_En_4_Fig6_HTML.jpg](img/499684_1_En_4_Fig6_HTML.jpg)\n\
  \n图 4-6 – Splunk 查找\n\n在 Splunk 中，管理员可以在 `transforms.conf` 中将 `case_sensitive_match`\
  \ 选项更改为 `false`。\n\n## Splunk 标签\n\n标签也是 Splunk 中的知识对象。它们允许**用户通过特定的字段值来搜索对象**。标签使数据更容易理解。可以为特定的字段-值组合创建多个标签。标签还负责为字段值分配区分大小写的名称。\n\
  \n### 使用 Splunk Web 在 Splunk 中创建标签\n\nSplunk Web 界面可以方便地创建标签。在本节中，您将在 `Test2.txt`\
  \ 来源中为 `location=3` 创建一个名为 `privileged` 的标签。按照以下步骤创建标签。\n\n![../images/499684_1_En_4_Chapter/499684_1_En_4_Fig7_HTML.jpg](img/499684_1_En_4_Fig7_HTML.jpg)\n\
  \n图 4-7 – Splunk 标签\n\n1. 进入 `test` 应用。在搜索栏中，输入 `Type` 后跟以下命令：\n\n    `index=\"\
  Test\" source=\"Test2.txt\"`\n\n2. 浏览事件并转到名为 `Location` 的字段。\n3. 在“操作”中，单击下拉箭头并选择“编辑标签”。\n\
  4. 在“标签”中，输入 `privileged`。字段值为 `location=3`，如图 4-7 所示。\n5. 您已成功创建了一个标签。您可以使用以下搜索命令进行验证。\n\
  \n```\n(index=\"test\" source=\"Test2.txt\") \"tag::location\"=privileged\n```\n\
  \n您可以在通配符和与字段值 `tag::tag_name=tag_value` 关联的标签中使用 `*`。\n\n#### 在 Splunk Web 中标记事件类型\n\
  \n在 Splunk 中标记事件类型可以为事件添加额外信息。在本节中，名为 `privileged` 的标记事件类型位于 `Test2.txt` 来源中。\n\n\
  按照以下步骤创建此内容。\n\n1. 转到“设置”，然后选择“事件类型”。\n2. 创建一个新的事件类型。\n3. 在“目标应用”中，选择 `test`。在“名称”中，输入\
  \ `test0102`。在“标签”中，输入 `privileged`。在“颜色”中，选择红色。在“优先级”中，选择 1。在“搜索字符串”中，输入如下搜索查询。\n\
  \n```\n(index=\"test\" source=\"Test2.txt\") \"tag::location\"=privileged\n```\n\
  \n图 4-8 展示了工作页面。\n\n![../images/499684_1_En_4_Chapter/499684_1_En_4_Fig8_HTML.jpg](img/499684_1_En_4_Fig8_HTML.jpg)\n\
  \n图 4-8 – 使用事件类型的 Splunk 标签\n\n1. 单击“保存”。\n2. 如果您在搜索栏中调用了所有带有 `privileged` 标签的事件，您会发现所有优先级为\
  \ 1、颜色为红色的事件。\n\n```\n(index=\"test\" location=3) \"tag::location\"=privileged\n\
  ```\n\n如图 4-9 所示，所有符合搜索查询中所述的优先级为 1、颜色为红色的事件都会被显示。\n\n![../images/499684_1_En_4_Chapter/499684_1_En_4_Fig9_HTML.jpg](img/499684_1_En_4_Fig9_HTML.jpg)\n\
  \n图 4-9 – 使用事件类型的 Splunk 标签\n\n根据特定事件的重要性设置优先级和颜色。如果您发现某个特定事件更重要，则为其分配更高的优先级（对于低优先级的事件则相反）。\n\
  \n下一节将介绍 Splunk 中的报告流程。\n\n## Splunk 报告\n\n报告是包含通过表格、图表等表示的已定义信息的结果。它们是通过保存的搜索命令创建的，以便重复使用。Splunk\
  \ 中的报告可以配置为执行多种操作，并且可以转换为 PDF 格式并通过电子邮件发送。报告也可以在 Splunk 中排程。\n\n让我们从学习如何在 Splunk\
  \ Web 中创建报告开始。\n\n\n\n### 在 Splunk Web 中创建报表\n\n报表会复用 Splunk 的搜索命令（即 Splunk 搜索处理语言）。在本节中，你将创建一个关于从\
  \ `index=test89` 接收事件数量的报表。\n\n![../images/499684_1_En_4_Chapter/499684_1_En_4_Fig10_HTML.jpg](img/499684_1_En_4_Fig10_HTML.jpg)\
  \  \n图 4-10：Splunk 可视化界面\n\n1.  导航至 Splunk 中的 `test` 应用。\n2.  输入以下搜索命令：  \n    `index=test89|\
  \ stats count by Ip`\n3.  在时间范围选择器中，选择**所有时间**。\n4.  进入**可视化**并选择**柱状图**。输出结果如图\
  \ 4-10 所示。\n\n![../images/499684_1_En_4_Chapter/499684_1_En_4_Fig11_HTML.jpg](img/499684_1_En_4_Fig11_HTML.jpg)\
  \  \n图 4-11：Splunk 报表\n\n1.  在右上角，点击**另存为**。\n2.  在**标题**中输入 `Test1`。在**内容**中，选择**表格\
  \ + 图表**（见图 4-11）。\n\n`Test1` 报表如图 4-12 所示。\n\n![../images/499684_1_En_4_Chapter/499684_1_En_4_Fig12_HTML.jpg](img/499684_1_En_4_Fig12_HTML.jpg)\
  \  \n图 4-12：Splunk `Test1` 报表\n\n你也可以通过导航至**设置** ➤ **搜索** ➤ **报表和警报** ➤ **创建新报表**来创建报表。在此报表中，你可能还会获得两个额外的字段：最早时间和最晚时间。图\
  \ 4-13 展示了一个名为 `test` 的新报表的工作页面，其中最早时间为 `–1y`。\n\n![../images/499684_1_En_4_Chapter/499684_1_En_4_Fig13_HTML.jpg](img/499684_1_En_4_Fig13_HTML.jpg)\
  \  \n图 4-13：Splunk 中的报表\n\n接下来，你将了解 Splunk 中的报表加速功能。\n\n### Splunk 中的报表加速\n\nSplunk\
  \ 中的报表加速意味着系统地运行覆盖长时间范围、包含大数据集的报表。当你加速一个报表时，会创建一个摘要；这在处理大量数据时会非常有用。加速搜索模式必须设置为**智能**或**快速**。\n\
  \n#### 创建报表加速\n\nSplunk 中的报表加速会为报表创建一个摘要。在本节中，你将加速报表，以发现从 `index=“test89”` 接收事件最多的端口。\n\
  \n请遵循以下步骤（另请参见图 4-14）。\n\n1.  创建一个报表用于了解 `index = test89` 的顶级端口。将报表命名为 `test10`。在应用中，选择\
  \ `test` 应用。请参考以下查询。\n\n![../images/499684_1_En_4_Chapter/499684_1_En_4_Fig14_HTML.jpg](img/499684_1_En_4_Fig14_HTML.jpg)\
  \  \n图 4-14：加速页面\n\n1.  进入**设置**。选择**搜索、报表和警报**。\n2.  在**应用**中，选择 **test**。\n3.\
  \  找到 `test10` 报表。点击**编辑**，然后进入**编辑加速**。\n4.  点击**加速报表**。\n5.  点击**下一步**。\n6.  在**摘要范围**中，选择**所有时间**。\n\
  \n```\nindex=\"test89\" |top port\n```\n\n请执行以下操作以查看报表摘要。\n\n![../images/499684_1_En_4_Chapter/499684_1_En_4_Fig15_HTML.jpg](img/499684_1_En_4_Fig15_HTML.jpg)\
  \  \n图 4-15：示例摘要\n\n1.  进入**设置**。\n2.  选择**报表加速和摘要**。\n3.  当你点击**摘要 ID** 时，会获得诸如磁盘上事件大小、摘要范围、桶、块等内容（见图\
  \ 4-15）。\n\nSplunk 中的报表加速使用自动创建的摘要来加快处理速度，但这也伴随着成本，因为加速报表的数量会影响并发搜索，并可能导致索引器使用量的增加。\n\
  \n### 在 Splunk 中调度报表\n\n调度报表是一种预定义的、按固定时间间隔运行的报表。一旦报表被触发，你可以通过多种方式定义其后续操作，例如通过电子邮件发送报表摘要、通过\
  \ CSV 查找文件报告结果、使用 webhook，或者记录并索引可搜索的事件。在本节中，你将调度一个 `Test1` 报表，使其在每周一上午 10:00 以最高优先级运行。\n\
  \n为此，请参考以下步骤。\n\n![../images/499684_1_En_4_Chapter/499684_1_En_4_Fig16_HTML.jpg](img/499684_1_En_4_Fig16_HTML.jpg)\
  \  \n图 4-16：调度页面\n\n1.  进入**设置**。选择**搜索、报表和警报**。\n2.  在**应用**中，选择 **test**。找到 `test1`\
  \ 报表。点击**编辑**并选择**编辑调度**。\n3.  在**编辑调度**中，选择**每周一上午 10:00 运行**，并将优先级设置为**最高**（见图\
  \ 4-16）。\n\n要编辑一个已调度的报表，你需要从 Splunk 管理员那里获得写入权限。\n\n以上完成了在 Splunk Web 中创建和设置报表的流程。下一节将讨论警报。\n\
  \n## Splunk 中的警报\n\n警报在组织中非常重要，因为它们能提供关于系统状态的信息。例如，警报可以判断服务器负载是否增加，或者提供运维洞察。在 Splunk\
  \ 中，警报是已保存的搜索，用于实时查找事件。当搜索结果满足特定条件时，警报会被触发。\n\n让我们首先了解如何在 Splunk Web 中创建警报。\n\n\
  ### 使用 Splunk Web 在 Splunk 中创建警报\n\nSplunk 中的警报会在搜索结果满足特定条件时进行监控并发出警报。一旦警报被触发，你可以定义后续操作。在本节中，你将创建一个在每月第一天的\
  \ 0:00 运行的警报。当顶级端口的事件计数大于或等于 500 时，你希望获知此信息。\n\n请按照以下步骤执行此任务。\n\n![../images/499684_1_En_4_Chapter/499684_1_En_4_Fig17_HTML.jpg](img/499684_1_En_4_Fig17_HTML.jpg)\
  \  \n图 4-17：Splunk 中的警报\n\n1.  进入**设置**。选择**搜索、报表和警报**。\n2.  选择**新警报**。\n3.  将标题设置为\
  \ `test1298`，应用名称设置为 `test`。选择**每月第 1 天 0:00 运行**。设置 `port >=500`。请参考图 4-17。\n\n\
  ![../images/499684_1_En_4_Chapter/499684_1_En_4_Fig18_HTML.jpg](img/499684_1_En_4_Fig18_HTML.jpg)\
  \  \n图 4-18：警报中的触发器\n\n1.  在 Splunk 中创建一个触发器，如图 4-18 所示。将严重性设置为**低**。\n\n默认情况下，所有人都有读取警报的权限。在\
  \ Splunk 中，只有超级用户和管理员拥有写入警报的明确权限。\n\n### 警报的 Cron 表达式\n\n你可以在 Splunk 中使用 cron 表达式进行警报调度。在本节中，你将创建一个\
  \ cron 表达式，使警报每 12 小时运行一次。当顶级端口的事件计数大于或等于 500 时，该警报会通知你。\n\ncron 表达式的语法如下。\n\n*\
  \   分钟：0–59\n*   小时：0–23\n*   月中的日期：1–31\n*   月份：1–12\n*   星期中的日期：0–6（其中 `0` 代表星期日）\n\
  \n以下说明了如何编辑此警报。\n\n![../images/499684_1_En_4_Chapter/499684_1_En_4_Fig19_HTML.jpg](img/499684_1_En_4_Fig19_HTML.jpg)\
  \  \n图 4-19：警报页面\n\n1.  在 `test` 应用中，进入**设置**。\n2.  选择**搜索、报表和警报**。\n3.  选择**警报**。\n\
  4.  将警报名称编辑为 `test1298`。\n5.  在**每月运行**下拉菜单中，选择**按 Cron 调度运行**，如图 4-19 所示。\n\n你已创建一个每\
  \ 12 小时运行一次的警报，如图 4-20 所示。\n\n![../images/499684_1_En_4_Chapter/499684_1_En_4_Fig20_HTML.jpg](img/499684_1_En_4_Fig20_HTML.jpg)\
  \  \n图 4-20：Cron 表达式\n\n```\n0 */12 * * *\n```\n\n1.  点击**保存**。\n\n恭喜你成功学习了关于表文件、定义、自动查找、Splunk\
  \ 标签、报表和警报的知识。请通过本章末尾的多项选择题来测试你的理解程度。\n\n\n\n## 总结\n\n您学习了查找及其各种类型，例如 CSV 查找、外部查找、地理空间查找和\
  \ KV 存储查找。您还学习了如何在 Splunk 中创建标签，以及如何生成报告和警报。这些知识对象发挥着至关重要的作用，尤其对于管理和处理大量数据的 Splunk\
  \ 管理员而言。\n\n关于 Splunk 中的标签，依据 Splunk 高级用户认证考试大纲**模块 6-10%** 涉及在 Splunk 中创建标签的内容。关于\
  \ Splunk 中的查找，您也可以在 Splunk 中创建自己的查找，依据 Splunk 用户认证考试大纲**模块 7-6%** 涉及在 Splunk 中创建查找的内容。关于报告和警报，您同样可以在\
  \ Splunk 中创建自己的报告和警报，依据 Splunk 用户认证考试大纲**模块 6、8-15%** 涉及调度报告和警报的内容。\n\n在下一章中，您将学习数据模型、Pivot、事件操作和\
  \ CIM。\n\n## 选择题\n\n1. 您可以使用 ____ 在 Splunk 中访问一个标签。（选择所有适用项）\n   1. `:`\n   2. `=`\n\
  \   3. `*`\n   4. `&`\n\n2. 要使用 `.conf` 文件在 Splunk 中创建警报，需编辑 ____。\n   1. `savedsearches.conf`\n\
  \   2. `props.conf`\n   3. `alert.conf`\n   4. `transformation.conf`\n\n3. 要创建警报，您必须是\
  \ ___（选择所有适用选项）\n   1. 用户\n   2. 高级用户\n   3. 管理员\n   4. `edit_user`\n\n4. 如果我是 ____，我可以编辑一个计划报告。\n\
  \   1. 用户\n   2. 高级用户\n   3. 管理员\n   4. 以上所有\n\n5. 在 Splunk 中，标签使用事件类型。您可以根据事件的重要性设置优先级和颜色。\n\
  \   1. 正确\n   2. 错误\n\n6. 在 Splunk 中，字段值默认不区分大小写。\n   1. 正确\n   2. 错误\n\n7. 选择所有查找类型的选项。\n\
  \   1. CSV 查找\n   2. KV 存储查找\n   3. 外部查找\n   4. 以上都不是\n\n**答案**\n\n- a. 1, 2, 3\n\
  - b. 2\n- c. 2\n- d. 3\n- e. 2, 3\n- f. 1\n- g. 1, 2, 3\n\n"
- "# 5. 数据模型、Pivot 和 CIM\n\n在上一章中，您学习了查找及其各种类型。我们还讨论了 Splunk 中的标签、报告和警报。在本章中，您将学习如何创建数据模型、事件操作和通用信息模型。\n\
  \nSplunk 软件在设计上富有艺术性，并且拥有用户友好的界面，便于解读命令和代码。一款优秀软件应用的标志不在于它是否容易被计算机理解，而在于是否容易被使用它的人理解。Splunk\
  \ 通过其功能、特性和命令提供了适应性。它是一个易于使用的平台，拥有广阔的适用范围和强大的实用性。\n\n本章涵盖以下主题。\n\n- 数据模型和 Pivot\n\
  - Splunk 中的事件操作\n- Splunk 中的通用信息模型\n\n数据模型是一个层次化的规范化数据集。事件操作是一个高度配置的知识对象，它在 Splunk\
  \ Web 中的字段与其他可配置的互联网源之间进行通信。CIM 可以使用字段名称和事件标签来规范化数据，以便从不同的数据源获取事件。学完本章后，您将掌握 Splunk\
  \ 高级用户认证考试大纲中的 30%。\n\n## 理解数据模型和 Pivot\n\n数据模型是**层次化的数据集，使 Pivot 用户能够创建复杂的报告和仪表板**，而无需在\
  \ Splunk 的搜索处理语言中编写复杂的命令。在生成报告时，数据模型及其相应的数据集由组织的知识渊博的管理员进行编码。\n\n数据模型由事件、事务或搜索作为数据集组成。\n\
  \n让我们讨论数据集和数据模型，以便更好地理解 SPL。\n\n### 数据集和数据模型\n\n数据模型由按顺序排列的父数据集和子数据集组成。每个子数据集除了拥有自己的约束和字段外，还继承其父数据集的约束和字段。（这个概念类似于编程中的继承）。\n\
  \n数据集是为特定目的而定义和维护的**数据集合**。它以表格形式呈现，包含列形式的字段及其单元格中的值，用于创建视觉丰富的 Pivot 报告，并在搜索过程中进行扩展。\n\
  \n数据集包括自动提取的字段、eval 表达式、查找、正则表达式和 Geo IP 字段。\n\n### 在 Splunk 中创建数据模型和 Pivot\n\n\
  本节展示了如何创建数据模型，以及 Pivot 如何识别来自美国东部和西部地区的产品销售请求模式。\n\n#### 创建新数据集\n\n按照以下步骤创建新数据集。\n\
  \n![../images/499684_1_En_5_Chapter/499684_1_En_5_Fig1_HTML.jpg](img/499684_1_En_5_Fig1_HTML.jpg)\n\
  \n图 5-1 创建数据模型：国家\n\n1. 转到“设置”并选择“数据模型”。点击“创建新数据模型”。在“标题”中，输入 **Country**。在“应用”中，选择\
  \ test（见图 5-1）。\n\n2. 点击“创建”。您将被重定向到数据集页面。\n\n3. 点击“添加数据集”，然后从下拉菜单中选择“根事件”。\n\n\
  数据模型的国家页面如图 5-2 所示。\n\n![../images/499684_1_En_5_Chapter/499684_1_En_5_Fig2_HTML.jpg](img/499684_1_En_5_Fig2_HTML.jpg)\n\
  \n图 5-2 国家数据模型\n\n4. 在“数据集名称”中，输入 **Country**，并在“约束”中，输入以下搜索命令。\n\n```\nindex=\"\
