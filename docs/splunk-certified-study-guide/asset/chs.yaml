  -   **第 9 部分：数据接入——暂存 (5%)** 本部分重点在于 Splunk 索引过程的三个阶段以及 Splunk 输入选项。\n-   **第 10\
  \ 部分：配置转发器 (5%)** 本部分重点在于配置转发器以及识别其他转发器选项。\n-   **第 11 部分：转发器管理 (10%)** 本部分重点在于部署管理、部署服务器、使用部署应用管理转发器、配置部署客户端、配置客户端组以及监控转发器管理活动。\n\
