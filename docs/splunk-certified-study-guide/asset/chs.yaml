  ## 引言


  Splunk 是一种用于实时监控、搜索、分析和可视化机器生成数据的软件技术。本书探讨了 Splunk 管理员的角色，并解释了如何高效部署和管理 Splunk 架构。它涵盖了通过
  Splunk 考试所需的一切知识。本书旨在以交互方式使用，并在每章末尾提供练习数据集和测试题。


  本书分为四个模块，其中三个模块专注于考试。


  第一个模块包含六章，致力于通过 Splunk Core Certified User 考试和 Splunk Core Certified Power User
  考试。它涵盖了安装 Splunk、Splunk 搜索处理语言 (SPL)、字段提取、Splunk 中的字段别名和宏、创建 Splunk 标签、Splunk 查找以及触发警报。您将学习如何在
  Splunk 中创建数据模型和准备高级仪表板。


  第二个模块专注于 Splunk Enterprise Certified Admin 考试，包含四章。它涵盖了 Splunk 许可证和用户角色管理、Splunk
  转发器配置、索引器集群、Splunk 安全策略以及高级数据输入选项。


  第三个模块也聚焦于 Splunk Enterprise Certified Admin 考试，但其章节教导管理员如何排查和管理 Splunk 基础设施。


  在第四个模块中，您将学习如何在 AWS 平台上设置 Splunk Enterprise，并了解 Splunk 的一些最佳实践。


  每章末尾都有一个多项选择题测试，以帮助考生熟悉考试。


