  3. 在特定策略的“操作”列中选择 `映射组`。\n4. 单击 `组名称`。\n5. 将角色映射到组，然后单击箭头将角色移动到 `可用角色` 列表中。这将把该组移动到\
  \ `已选角色` 列表中，有助于将多个角色映射到该组（见图 9-12）。\n6. 单击 `保存`。\n\n以上总结了 Splunk LDAP 的分析、创建、映射及其在\
  \ Splunk 域中的重要性。接下来，我们将学习 Splunk SAML。\n\n\n\n## Splunk 安全断言标记语言（SAML）\n\nSplunk\
  \ SAML（安全断言标记语言）是一个身份提供者（IdP），负责维护用户凭证并处理身份验证。当你配置 Splunk 实例使用 SAML 认证系统时，你可以在 IdP\
  \ 上授权群组，并通过将它们映射到 Splunk 用户角色来启用其登录。然而，SAML 不支持身份验证。\n\nSplunk SAML 和 LDAP 也可以使用位于\
  \ `$SPLUNK_HOME/etc/system/local` 的 `authentication.conf` 进行配置。\n\n### 配置 Splunk\
  \ SAML\n\n要配置 Splunk SAML，请参考以下步骤。\n\n1.  点击 **设置**，然后转到 **认证方法**。\n2.  点击 **配置\
  \ Splunk 使用 SAML** 并创建一个新的 SAML。\n3.  直接复制元数据文件。\n4.  在 **常规设置** 中，提供以下数据。\n   \
  \ *   单点登录 URL（输入复制的元数据文件时自动填充）\n    *   IdP 证书路径（可以是目录或文件）。\n    *   实体 ID（实体的身份标识）\n\
  5.  选择 **签署认证请求**。\n6.  选择 **签署 SAML 响应**。\n7.  如果你使用 PingIdentity 作为 IdP，请指定属性查询\
  \ URL、签名属性查询请求和签名属性查询响应。\n8.  在 **高级设置** 中，配置属性别名角色、属性别名角色名称和属性别名邮件等信息。\n9.  点击\
  \ **保存**。\n\n图 9-13 说明了 Splunk SAML 配置的过程。\n\n![../images/499684_1_En_9_Chapter/499684_1_En_9_Fig13_HTML.jpg](img/499684_1_En_9_Fig13_HTML.jpg)\n\
  \n**图 9-13** 配置 SAML\n\n让我们来看看 SAML 映射。\n\n### 将 SAML 映射到用户角色\n\n要将 SAML 映射到 Splunk\
  \ 角色，请参考以下说明。\n\n1.  前往 **访问控制**，选择 **认证方法**。\n2.  选择 **SAML**，然后转到 **配置 Splunk\
  \ 使用 SAML 并映射群组**。\n3.  在 **SAML 群组** 页面上，点击 **新建群组**，或点击 **编辑** 修改现有群组。\n4.  为该群组提供一个名称。\n\
  5.  通过将所需角色从左侧列移动到右侧列，确定要分配给此群组的角色。\n6.  点击 **保存**。\n\n图 9-14 是 SAML 映射方法的图示。\n\n\
  ![../images/499684_1_En_9_Chapter/499684_1_En_9_Fig14_HTML.jpg](img/499684_1_En_9_Fig14_HTML.jpg)\n\
  \n**图 9-14** 映射 SAML：Splunk 角色\n\n以上概括了 Splunk SAML 的工作原理。\n\n至此，你已经完成了本章的学习。你应该为自己成功学习了\
  \ Splunk 数据管理而感到自豪。当需要分类或简化数据时，本章内容显得尤为重要，并能让你在 Splunk 管理方面更进一步。\n\n## 总结\n\n本章涵盖了\
  \ Splunk 通用转发器、重型与轻型转发器、Splunk 索引器集群及其配置、Splunk LDAP 以及 Splunk SAML。这些主题管理着 Splunk\
  \ 环境中数据的收集、整理和认证。数据收集通常包括远程源和大型处理。实例转发器和索引器集群确保所有数据被分配到正确的存储桶并分类到正确的节点。Splunk LDAP\
  \ 和 SAML 确保数据输入得到认证，用户凭证得到授权。你通过逐步讨论学习了实现、配置和角色映射。\n\n下一章将讨论如何使用监视器输入和网络输入获取数据、使用脚本化输入和\
  \ Windows 输入提取数据、使用无代理输入拉取数据，以及使用微调输入进行数据清理。\n\n练习本章所学内容，并通过以下问题测试你的知识。\n\n## 选择题\n\
