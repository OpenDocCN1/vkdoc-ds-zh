- '# 第二部分 Splunk 数据管理和系统管理


  '
- "# 8. Splunk 许可证、索引和角色管理\n\n本章将向您介绍 Splunk 桶、许可证和用户角色管理。\n\n本章涵盖以下主题。\n\n* Splunk\
  \ 中的桶\n* `journal.gz`、`.tsidx`和布隆过滤器\n* Splunk 许可证\n* 管理 Splunk 许可证\n* 用户管理\n\n\
  ## 桶\n\n桶是存储原始数据和索引数据的目录。它有两个主要属性：最大数据和最长时限。需要配置这两个属性才能使桶平稳运行。桶有三种类型。\n\n*   **热桶**：数据被解析到\
  \ Splunk 后，会经过许可证主控服务器，然后事件被写入热桶。简单来说，它是数据写入的桶。热桶是可搜索的。当达到最大大小或 Splunk 重启时，热桶会转换为暖桶。一个索引可能同时打开多个热桶。\n\
  \n*   **暖桶和冷桶**：暖桶是可搜索的，但不会主动写入。暖桶通过`_time`进行标识。当特定索引超过限制时，暖桶会回滚到冷桶。在特定时间后，冷桶会根据索引策略回滚到冻结或归档状态。\n\
  \n*   **冻结**：这也称为*数据过期*。它是最旧的数据桶。当索引大小已满或桶的存在时间超过指定的时间限制时，它会从索引中删除。\n\n`indexes.conf`文件管理索引策略，例如数据过期和数据阈值。\n\
  \n\n\n### 存储桶的工作原理是什么？\n\n当你通过监控输入、脚本化输入或数据上传将数据摄取到 Splunk 平台时，数据会被索引。Splunk 将数据保存在名为\
  \ *存储桶* 的目录中。根据数据策略定义，第一个存储桶是热存储桶，数据会在其中保存一段时间。这是一个可读写存储桶。\n\n在以下任一情况下，热存储桶会滚动为温存储桶：`splunkd`（一种用于访问、处理、索引流式数据并处理搜索请求的服务）重启；索引大小超过限制；存储桶的时间跨度过大；热存储桶在一段时间内未接收到数据；或者存储桶的元数据增加。随后，它会创建一个名为\
  \ `“db_[最新时间]_[最旧时间]_[ID]”` 的新目录。该命名基于 `_time`，用于了解特定存储桶中事件的时间范围。\n\n温存储桶中的时间以纪元时间格式表示。温存储桶通常是只读的，在达到索引限制或创建的温存储桶数量过多时，会滚动为冷存储桶。在从温存储桶滚动到冷存储桶的过程中，整个存储桶目录会被复制到一个冷存储桶路径。理想情况下，最旧的索引会被优先切换。\n\
  \n冷存储桶允许你读取数据，然后根据策略定义，删除数据或将其滚动到冻结存储桶。在冻结存储桶中，索引既不能被读取，也不能写入数据，只能归档。要读取冻结数据，需要将其移动到冷存储桶。当索引达到最大大小，或存储桶的生命周期达到限制时，最旧的存储桶会从索引中删除。可以配置一个冻结路径。此流程如图\
  \ 8-1 中的示意图所示。\n\n![../images/499684_1_En_8_Chapter/499684_1_En_8_Fig1_HTML.jpg](img/499684_1_En_8_Fig1_HTML.jpg)\n\
  \n图 8-1\n\n存储桶生命周期\n\n热存储桶和温存储桶应使用更快的存储设备，例如 SSD。冷存储桶可以使用较慢的存储设备，例如 SANS/NAS。\n\n\
  ### 在存储桶中如何执行搜索\n\n当你搜索已索引的数据时，Splunk 会以相反的顺序返回结果。假设你想搜索最近添加的事件中的数据。Splunk 会直接查找热存储桶，因为它们是最近写入数据的存储桶。因此，很容易找到最新的结果。\n\
  \n类似地，如果你搜索关键词 *kite*，Splunk 会首先检查热存储桶。如果找不到该词，Splunk 会显示事件 “kite” 的时间戳以及该事件进入存储桶的实际时间。然而，它随后会按照\
  \ `_time` 的逆序时间在温存储桶中查找该事件，如果仍未找到，则移动到冷存储桶，以相同的方式进行搜索。因此，在 Splunk 中，搜索主要通过 `_time`\
  \ 检查最近添加的事件，仅在关键词匹配时才深入挖掘存储桶。因此，如果一个 “kite” 事件是新添加的，而另一个 “kite” 事件在温存储桶或冷存储桶中，Splunk\
  \ 会首先显示热存储桶中的事件，然后显示温存储桶或冷存储桶中的事件。\n\n现在我们来讨论存储桶用于执行搜索的三个命令：`journal.gz`、`.tsidx`\
  \ 和 Bloom 过滤器。\n\n## 理解 journal.gz、.tsidx 和 Bloom 过滤器\n\n要理解搜索的工作原理，你需要了解存储桶用于执行搜索的三个组件。\n\
  \n*   **journal.gz**：当你在 Splunk 中摄取数据时，数据会保存在热存储桶中。在热存储桶内部，`journal.gz` 在保存数据方面起着至关重要的作用。原始数据被压缩并分成多个切片。一个切片最多可以包含\
  \ 128 KB 的未压缩数据。\n\n*   **.tsidx** 代表 *时间序列索引文件*。每个事件在存储桶内都被赋予一个唯一的 ID。一个事件被分割成多个词条，并按字典序（按字母顺序排序）保存。每个词条都在其\
  \ `.tsidx` 中被跟踪，并且可以通过二分搜索来确定该词条是否存在。如果找到了该词条，则可以线性扫描以检查数据是否存在。一个词条表会将其指向存储原始数据的地址。`journal.gz`\
  \ 和 `.tsidx` 共同构成一个存储桶。\n\n*   **Bloom 过滤器** 减少了索引器从索引中检索事件的时间。Bloom 过滤器在预测事件是否存在于索引中起着关键作用。Bloom\
  \ 过滤器在索引级别运行。例如，如果你使用关键词 *error* 运行搜索命令，Bloom 过滤器会过滤掉所有在其词条表中不包含该关键词的存储桶。Splunk\
  \ Enterprise 通过在指定存储桶内搜索存在搜索内容的 `.tsidx` 文件来节省你的时间。\n\n现在你已经了解了存储桶及其组件。但是 Splunk\
  \ 的搜索功能是如何工作的呢？\n\n### 搜索功能是如何工作的？\n\n假设你想搜索包含关键词 *kite* 的事件。当你在 SPL 中编写命令，使用哈希函数搜索这些事件时，它会为\
  \ *kite* 生成一个哈希键。然后，它使用 Bloom 过滤器在基于 `_time` 的存储桶上搜索该哈希键。如果 Bloom 过滤器确定该关键词存在于某个特定索引中，它会使用时间序列索引文件生成的词条表，并查找存储原始数据（`journal.gz`）的地址。`journal.gz`、Bloom\
  \ 过滤器和 `.tsidx` 共同使搜索工作更高效。\n\n现在让我们继续讨论 Splunk 许可证。\n\n## Splunk 许可证\n\n当你在 Splunk\
  \ 中输入数据时，索引器会将其索引并存储在磁盘上。Splunk 许可证决定了数据摄取的限制。每个 Splunk Enterprise 实例都需要一个许可证，该许可证规定了其一天内可以索引的数据量规则。Splunk\
  \ 许可证有多种类型。\n\n*   **Splunk Enterprise 许可证**\n\n“标准” Splunk Enterprise 许可证规定了被索引数据的类型，可供购买或配置。\n\
  \n*   **不强制执行许可证**\n\n标准 Splunk Enterprise 许可证有一个最大每日索引量，如果超过该量，你会收到违规警告。如果你在一个月内收到超过五次警告，就违反了许可证规定。这可能导致\
  \ Splunk 搜索头被禁用。但是，在不强制执行的情况下，即使违反了许可证，你的搜索头也不会被禁用。\n\n*   **企业试用许可证**\n\n企业试用许可证允许最大索引量为每天\
  \ 500 MB。它在 60 天后过期，届时系统会要求你切换到标准的 Splunk Enterprise 许可证或免费许可证。\n\n*   **销售试用许可证**\n\
  \n企业试用许可证在 60 天后过期，索引容量为每天 500 MB。如果你有一个试点项目需要的索引容量超过每天 500 MB，可以直接联系 Splunk 销售团队获取许可证。\n\
  \n*   **开发/测试许可证**\n\nSplunk 提供其开发/测试许可证的访问权限，以便在非生产环境中运行。\n\n*   **免费许可证**\n\n\
  Splunk 中的免费许可证的索引容量最高为每天 500 MB。使用此许可证，你无法执行分布式搜索、TCP/HTTP 转发、告警、用户管理、LDAP 或脚本化身份验证。\n\
  \n*   **Splunk 工业物联网许可证**\n\nSplunk 为工业物联网提供了一种特殊许可证，可以访问专门设计的应用集。\n\n*   **转发器许可证**\n\
  \n转发器许可证允许转发无限量的数据。与免费许可证不同，它支持身份验证。你无需购买额外的许可证，因为它已包含在 Splunk 中。\n\n### 在 Splunk\
  \ 中更改许可证组\n\n要从试用版切换到企业许可证，请按照以下步骤操作。\n\n1.  转到“设置”并选择“许可”。\n\n2.  选择你想要实施的许可证组。\n\
  \n示例屏幕图像如图 8-2 所示。\n\n![../images/499684_1_En_8_Chapter/499684_1_En_8_Fig2_HTML.jpg](img/499684_1_En_8_Fig2_HTML.jpg)\n\
  \n图 8-2\n\nSplunk 许可证组\n\n管理是任何程序或软件平稳运行的灵魂。让我们来看看 Splunk 许可证是如何管理的。\n\n\n\n###\
  \ 管理 Splunk 许可证\n\n`Splunk` 许可证基于您可以输入的最大数据量。例如，`Splunk Enterprise` 试用许可证组提供 500\
  \ MB/天的许可容量。所有 `Splunk Enterprise` 实例都需要根据使用情况和输入的数据类型获得许可证。以下介绍数据类型。\n\n- `事件数据`\
  \ 是索引器插入索引管道的 `raw_data`。\n- `指标数据` 每条计为 150 字节。它与事件数据共享相同的许可配额。\n- `摘要索引` 允许您通过将计算成本高昂的报表任务随时间分散开来，对大型数据集执行快速搜索。\n\
  \n许可证计量发生在索引阶段。\n\n`Splunk` 许可证按两类角色管理工作。\n\n- 许可证主服务器\n- 许可证从服务器\n\n## 许可证主服务器与从服务器\n\
  \n在 `Splunk` 中，许可证主服务器和许可证从服务器同步工作。在您的企业实例中，有一个许可证主服务器实例，所有其他实例都是从节点。`集群主服务器`、`索引器`、`部署器`、`部署服务器`、`监控控制台`等。所有其他实例通常是由许可证主服务器管理的从节点。许可证主服务器的角色是管理企业实例的许可证使用情况。\n\
  \n### 许可证主服务器\n\n当存在多个实例时，`Splunk` 中的许可证主服务器负责从中央位置管理许可证访问。许可证主服务器分配许可容量并管理所有实例的许可证使用情况。您只需将一个\
  \ `Splunk` 实例设置为许可证主服务器，其余实例则为其许可证从服务器。要使用 `Splunk Web` 将实例配置为许可证主服务器，请参考以下步骤。\n\
  \n1. 转到 `设置` 并选择 `许可`。\n2. 将许可证服务器类型指定为 `主服务器`。\n\n### 许可证从服务器\n\n当您将一个 `Splunk`\
  \ 实例配置为许可证主服务器时，其余实例需要成为许可证从服务器。但是，如果您只有一个实例，则该节点将充当许可证主服务器，而没有许可证从服务器。要将实例配置为许可证从服务器，请执行以下步骤。\n\
  \n1. 转到 `设置` 并选择 `许可`。\n2. 将许可证服务器类型指定为 `从服务器`。\n3. 指定它应向哪个主服务器报告。提供 IP 地址或主机名以及\
  \ `Splunk` 管理端口（默认为 `8089`）。\n4. 点击 `保存` 并重新启动 `Splunk` 实例。\n\n图 8-3 展示了更改许可证类型的过程。\n\
  \n![../images/499684_1_En_8_Chapter/499684_1_En_8_Fig3_HTML.jpg](img/499684_1_En_8_Fig3_HTML.jpg)\n\
  \n图 8-3\n\n许可证主服务器\n\n如果您的企业实例中有专用的许可证主服务器，则唯一需要考虑的因素是从服务器的数量。您可以拥有较低的 CPU 核心数、内存和磁盘大小。\n\
  \n下一节将介绍在 `Splunk` 中添加许可证的过程。\n\n## 在 Splunk 中添加许可证\n\n对于 `Splunk` 软件的长期使用而言，添加许可证非常重要。假设您拥有企业试用许可证，并希望切换到标准的\
  \ `Splunk Enterprise` 许可证。同样，假设您有一个允许每天最多 500 GB 索引量的许可证，但您的使用量正在增加，需要更多容量。您可以添加更多许可证。\n\
  \n要在 `Splunk` 中添加许可证，请执行以下步骤。\n\n1. 转到 `设置` 并选择 `许可`。\n2. 选择 `添加许可证`。\n3. 要安装许可证，请上传许可证文件（许可证文件以\
  \ `.license` 结尾）。\n4. 点击 `安装`。\n\n图 8-4 展示了如何在 `Splunk` 中添加新许可证。\n\n![../images/499684_1_En_8_Chapter/499684_1_En_8_Fig4_HTML.jpg](img/499684_1_En_8_Fig4_HTML.jpg)\n\
  \n图 8-4\n\n添加许可证\n\n`Splunk` 许可证保存在 `$SPLUNK_HOME/etc/licenses` 中。\n\n## 许可证池\n\n\
  许可证池允许将许可证细分并分配给索引器组。主节点分配一个许可证大小，许可证主服务器管理许可证池以及从节点对容量的访问。如果您有一个 `Splunk` 单机实例，它会自动成为许可主服务器，位于\
  \ `Splunk Enterprise` 栈中。它有一个名为 `auto_generated_pool_enterprise` 的默认许可证池。\n\n###\
  \ 创建许可证池\n\n要使用 `Splunk Web` 创建许可证池，请参考以下内容。\n\n1. 转到 `设置` 并选择 `许可`。\n2. 点击页面底部的\
  \ `添加池`。\n3. 为池指定一个名称。\n4. 设置容量分配。分配至关重要。它可以是该栈中可用的全部索引容量；这取决于您的优先级和要求。\n5. 指定可以访问该池的索引器。特定索引器可以访问特定池，或者一组索引器可以访问某个特定池。\n\
  \n您不能在 `Splunk Enterprise` 试用许可证下创建许可池。\n\n索引是 `Splunk` 环境中非常重要的一部分。它是整个软件的构建块。因此，高效管理索引至关重要。下一节将讨论\
  \ `Splunk` 中索引的管理。\n\n## 管理 Splunk 中的索引\n\n在 `Splunk` 中，索引器默认处理数据并将其保存到主索引。但是，您可以为其他数据输入创建并指定索引。索引由文件和目录组成，也称为\
  \ `桶`。`桶` 会根据定义的规则发生变化。\n\n除主索引外，`Splunk` 还拥有预配置的内部索引。\n\n- `main` 是默认索引。所有外部数据都存储在此索引中。\n\
  - `_internal` 包含内部日志和矩阵。\n- `_audit` 包含与审计、用户搜索历史等相关的日志事件。\n- `_introspection` 跟踪系统性能和使用资源。\n\
  - `the fishbucket` 包含文件监控的各种检查点。\n- `Summary` 是摘要索引系统的默认索引。\n\n以下是索引的类型。\n\n- `事件索引`\
  \ 施加基本结构，并允许所有类型的事件包含指标数据。\n- `指标索引` 是高度结构化的格式，并对与指标数据相关的高延迟需求施加限制。将指标数据放入指标索引而不是事件索引可以获得更好的性能并减少索引存储使用量。每个指标事件固定计为\
  \ 150 字节。\n\n\n\n### 在 Splunk 中创建索引\n\n创建索引可将传入的数据库进行隔离，这有助于 Splunk 管理员安排合适的团队进行操作。例如，如果我创建了一个名为\
  \ `security` 的索引来收集与组织安全相关的所有事件，这将有助于公司的安全团队。在 Splunk 中创建索引需要几个步骤。\n\n#### 使用 Splunk\
  \ Web 创建索引\n\n要通过 Splunk Web 创建索引，请执行以下步骤。\n\n1. 转到 Splunk Web 并选择**设置**。\n2. 转到**索引**并单击**新建**。\n\
  3. 输入以下信息以创建新索引。\n   1. 索引的名称。\n   2. 输入 `HOME_PATH`。默认路径为 `$SPLUNK_DB/<索引名称>/db`。\n\
  \   3. 输入 `COLD_PATH`。默认路径为 `$SPLUNK_DB/<索引名称>/colddb`。\n   4. 输入 `THAWED_PATH`。默认路径为\
  \ `$SPLUNK_DB/<索引名称>/thaweddb`。\n   5. 启用/禁用完整性检查。\n   6. 输入索引的最大大小。默认值为 500,000\
  \ MB。\n   7. 您还可以根据需要配置每个索引桶的大小，或者选择**自动**。\n   8. 如果您希望归档数据，请在**冻结路径**中输入路径。\n\
  \   9. 选择您要为其创建索引的应用程序。\n   10. 为存储优化配置 `.tsidx` 策略。\n\n图 8-5 显示了在 Splunk 实例中创建新索引的界面。\n\
  \n![../images/499684_1_En_8_Chapter/499684_1_En_8_Fig5_HTML.jpg](img/499684_1_En_8_Fig5_HTML.jpg)\n\
  \n**图 8-5** — 创建索引：`test89`\n\n#### 使用 Splunk 配置文件创建索引\n\n要使用配置文件创建索引，请编辑位于 `$Splunk_HOME/etc/system/local`\
  \ 的 `indexes.conf` 文件。请参考以下代码块。\n\n1. 在 `homePath` 中，输入要在 Splunk 中存储桶的路径。默认路径为 `$SPLUNK_DB/<索引名称>/db`。\n\
  2. 在 `coldPath` 中，输入要在 Splunk 中存储冷桶的路径。默认路径为 `$SPLUNK_DB/<索引名称>/colddb`。\n3. 在 `thawedPath`\
  \ 中，输入要在 Splunk 中存储已归档桶的路径。默认路径为 `$SPLUNK_DB/<索引名称>/thaweddb`。\n4. 启用**数据完整性控制**以在\
  \ Splunk 中配置完整性检查。\n5. 启用 **Tsidx 缩减**以进行存储优化。根据您的需要进行配置。\n6. 在 `maxTotalDataSizeMB`\
  \ 中，配置桶的最大大小。请以 MB 为单位输入大小。\n\n```\n[security_test]\nhomePath=\ncoldPath=\nthawedPath=\n\
  enableDataIntegrityControl=0|1\nenableTsidxReduction=0|1\nmaxTotalDataSizeMB=\n\
  ```\n\n#### 使用 Splunk CLI 创建索引\n\n要使用 Splunk CLI 创建索引，请参考以下步骤。\n\n1. 在 `-homePath`\
  \ 中，输入要在 Splunk 中存储桶的路径。默认路径为 `$SPLUNK_DB/<索引名称>/db`。\n2. 在 `-coldPath` 中，输入要在 Splunk\
  \ 中存储冷桶的路径。默认路径为 `$SPLUNK_DB/<索引名称>/colddb`。\n3. 在 `-thawedPath` 中，输入要在 Splunk 中存储已归档桶的路径。默认路径为\
  \ `$SPLUNK_DB/<索引名称>/thaweddb`。\n4. 在 `-enableDataIntegrityControl` 中，配置 Splunk\
  \ 中的完整性检查。\n5. 根据需要配置 `-enableTsidxReduction`，这涉及存储优化。\n6. `-maxTotalDataSizeMB`\
  \ 配置桶的最大大小。请以 MB 为单位输入大小。\n\n```\nsplunk add index test  -coldPath \n-thawedPath\
  \  -enableDataIntegrityControl  -enableTsidxReduction  -maxTotalSizeMB\n```\n\n\
  至此，您已完成了本节内容。本章的最后一节将讨论用户管理和软件权限。\n\n## 用户管理\n\n用户管理涵盖了用户在 Splunk 中拥有的权限。它决定了 Splunk\
  \ 管理员的角色和工作结构。Splunk 管理员需要处理各种用户管理任务。\n\n- 添加本地用户\n- 定义角色继承和角色能力\n- 角色索引搜索选项\n\n\
  ### 添加本地用户\n\n向 Splunk 添加本地用户是一个简单的过程。要在 Splunk（Web）中添加本地用户，请参考以下说明。\n\n1. 转到**设置**并选择**用户**。\n\
  2. 单击**新建用户**。\n3. 提供用户名和密码（必填）。\n4. 提供用户的全名和电子邮件地址（默认为无）。\n5. 输入您的时区（默认为搜索头时区）。\n\
  6. 输入默认应用程序（默认为**主页**）。\n7. 输入角色（默认为**用户**）。\n\n图 8-6 是向 Splunk 添加本地用户的截图。\n\n![../images/499684_1_En_8_Chapter/499684_1_En_8_Fig6_HTML.jpg](img/499684_1_En_8_Fig6_HTML.jpg)\n\
  \n**图 8-6** — 添加本地用户\n\nSplunk 中的密码存储在 `$SPLUNK_HOME/etc/passwd` 中。Splunk 中的 `passwd`\
  \ 文件是加密的。\n\n### 定义角色继承和角色能力\n\n新用户可以继承另一用户的能力和索引访问权限。如果新用户继承了父用户的角色和能力，则无法禁用它。以下步骤定义了角色继承。\n\
  \n1. 转到**设置**并选择**用户**。\n2. 选择**管理员**（您想要的任何角色）。\n3. 转到**管理员**（您想要的任何用户）。\n4. 转到**继承**并选择您想要继承的任何角色。\n\
  \n图 8-7 显示了在 Splunk 中添加继承。\n\n![../images/499684_1_En_8_Chapter/499684_1_En_8_Fig7_HTML.jpg](img/499684_1_En_8_Fig7_HTML.jpg)\n\
  \n**图 8-7** — 为 Splunk 用户定义角色继承\n\n角色继承可以继承能力和索引访问权限。\n\n以下步骤在 Splunk 中添加角色能力。\n\
  \n1. 转到**设置**并选择**角色**。\n2. 转到**管理员**（选择您想要的任何用户）。\n3. 转到**能力**并选择**分配或移除能力**。\n\
  \n图 8-8 是向 Splunk 添加角色能力的截图。\n\n![../images/499684_1_En_8_Chapter/499684_1_En_8_Fig8_HTML.jpg](img/499684_1_En_8_Fig8_HTML.jpg)\n\
  \n**图 8-8** — 为 Splunk 用户定义角色能力\n\n拥有 `edit roles` 和 `edit user` 能力后，用户可以提升为完全管理员角色。\n\
  \n角色索引搜索中的新用户在搜索时无需指定索引名称。这类似于默认索引。在**角色索引访问选项**中，如果未选择索引，用户将无法访问该索引。\n\n1. 转到**设置**并选择**角色**。\n\
  2. 转到**管理员**（选择您想要的任何用户）。\n3. 转到**默认搜索的索引**并分配或移除索引。\n\n图 8-9 显示了向 Splunk 用户添加索引访问权限。\n\
  \n![../images/499684_1_En_8_Chapter/499684_1_En_8_Fig9_HTML.jpg](img/499684_1_En_8_Fig9_HTML.jpg)\n\
  \n**图 8-9** — 为 Splunk 用户定义索引访问权限\n\n至此，您已学完本章。为自己喝彩！您可以通过本章末尾的多项选择题进行练习来测试您的知识。\n\
  \n## 总结\n\n完成第 8 章后，您已经涵盖了 Splunk 软件基础的很大一部分。从标签和关键字到管理员和许可，您已学习了 Splunk 的大部分主要概念。本章涉及\
  \ Splunk 许可、许可池、管理索引、桶、`journal.gz`、`.tsidx` 和布隆过滤器以及用户管理。因此，您现在重点关注的是执行元素以及管理和维护元素。\n\
  \n根据 Splunk 管理员考试大纲，您已经熟悉模块 2（许可）的 5% 和模块 5（用户管理和桶）的 5%。\n\n下一章将介绍 Splunk 转发器和集群。\n\
  \n\n\n## 多项选择题\n\n1. `_internal` 索引中的 Splunk 事件会计入许可用量。\n    1. 正确\n    2. 错误\n\n\
  1. 指标数据以每个事件固定 150 字节的标准计入企业版许可用量。\n    1. 正确\n    2. 错误\n\n1. Splunk 中创建的本地用户帐户将密码存储在哪个文件中？\n\
  \    1. `$SPLUNK_HOME/etc/users/authentication.conf`\n    2. `$SPLUNK_HOME/etc/passwd`\n\
  \    3. `$SPLUNK_HOME/etc/authentication`\n    4. `$SPLUNK_HOME/etc/passwd`\n\n\
  1. 许可计量发生在索引时间处理的哪个阶段？\n    1. 输入阶段\n    2. 解析阶段\n    3. 索引阶段\n    4. 许可阶段\n\n1.\
  \ 您可以使用以下哪些选项创建 Splunk 索引？（请选择所有适用的选项。）\n    1. Splunk CLI\n    2. `indexes.conf`\n\
  \    3. Splunk Web\n    4. `inputs.conf`\n    5. `transforms.conf`\n\n1. 以下哪些是预配置的内部索引？（请选择所有适用的选项。）\n\
  \    1. `main`\n    2. `_internal`\n    3. `_audit`\n    4. `_introspection`\n \
  \   5. `_thefishbucket`\n    6. `summary`\n    7. `test`\n    8. 以上皆非\n\n1. Splunk\
  \ Enterprise 试用版许可每天的最大索引容量是多少？\n    1. 500 MB\n    2. 700 MB\n    3. 1 GB\n   \
  \ 4. 100 MB\n\n1. 选择 Splunk 中索引的三个主要组件。\n    1. `journal.gz`\n    2. `.tsidx`\n\
  \    3. 布隆过滤器\n    4. 以上皆非\n\n**答案**\n\n1. 1, 2, 3\n2. 1\n3. 1, 2, 3, 4, 5, 6\n\
  4. 1, 2, 3\n5. 3\n6. 2\n7. 1\n8. 2\n\n"
- "# 使用 Splunk Forwarder 和集群处理机器数据\n\n当处理来自评分系统的大量数据时，数据收集对于功能的系统化流程变得至关重要。首先，本章讨论\
  \ Splunk forwarder 及其类型。其次，您还将了解如何将数据从 Splunk forwarder 解析到 Splunk 索引器，以展示机器数据的能力。第三，您将探索集群的过程，以便在数据收集过程中实施集群。最后，您将了解用于\
  \ Splunk 中身份验证和凭据管理的 LDAP 和 SAML。\n\n本章涵盖以下主题。\n\n- Splunk 通用转发器\n- Splunk 轻型转发器和重型转发器\n\
  - 转发器管理\n- Splunk 索引器集群\n- Splunk 轻量级目录访问协议（LDAP）\n- Splunk 安全断言标记语言（SAML）\n\n##\
  \ Splunk 通用转发器\n\nSplunk 通用转发器使用最少的硬件资源从源收集数据并将其转发到 Splunk 索引器。它更轻量，因为它没有 Web 界面，但需要考虑安装成本。通用转发器仅包含将数据转发到企业版实例所必需的组件。通过编辑配置文件、编辑转发器管理器或通过\
  \ Splunk Enterprise 实例中的监控控制台进行管理。\n\n### 配置 Splunk 索引器以接收来自通用转发器的数据\n\n以下说明了通过\
  \ Splunk Web 将数据转发到 Splunk 索引器的过程。\n\n![../images/499684_1_En_9_Chapter/499684_1_En_9_Fig1_HTML.jpg](img/499684_1_En_9_Fig1_HTML.jpg)\n\
  \n*图 9-1 在索引器上配置监听*\n\n1. 转到 Splunk 索引器实例的 Web 界面。\n2. 转到**设置**并选择**转发和接收**。\n3.\
  \ 转到**配置接收**并**添加新**。\n4. 在**侦听此端口**中输入 `9997`。（您可以指定任何端口，但如果分配了其他端口，则需要在转发器实例的端口号块中输入该端口）。请参考图\
  \ 9-1。\n\n从 Windows 通用转发器发送日志时，支持任何操作系统的索引器平台。\n\n请执行以下操作以使用 Splunk CLI 在索引器中启用端口侦听。\n\
  \n1. 在 Linux 中，转到 Splunk 索引器，并使用终端进入 `$SPLUNK_HOME/bin` 并运行 `sudo ./splunk enable\
  \ listen <端口号>`。\n2. 在 Windows 中，转到 Splunk 索引器，并使用命令提示符进入 `%SPLUNK_HOME%/bin` 并运行\
  \ `.\\splunk enable listen <端口号>`。\n\n现在让我们看看 Windows Splunk 转发器中使用的配置。\n\n### 配置\
  \ Windows Splunk 转发器\n\n有两种方法可以配置 Windows Splunk 通用转发器。\n\n- 使用命令行\n- 通过执行 `.msi`\
  \ 文件\n\nWindows 可以执行 `.msi` 文件，或者您可以使用命令行安装 Splunk 通用转发器。从 [`www.splunk.com/en_us/download/universal-forwarder.html`](http://www.splunk.com/en_us/download/universal-forwarder.html)\
  \ 下载适用于 Windows 的 Splunk 通用转发器。\n\n### 使用 Windows 的 Splunk 通用转发器\n\n要使用命令行配置 Splunk\
  \ 通用转发器，请参考以下步骤。\n\n1. 转到命令提示符并进入 `%SPLUNK_HOME%/bin`。\n2. 要启动、停止和重启 Splunk，请键入\
  \ `.\\splunk start`、`.\\splunk stop` 和 `.\\splunk restart`。\n3. 通过运行以下命令将数据转发到索引器。\n\
  \n`.\\splunk add forward-server <主机名>:<端口>`\n\n1. 转到 `SPLUNK_HOME/etc/system/local/outputs.conf`\
  \ 检查通用转发器是否正在转发数据。输出如下所示。\n\n```\n[tcpout]\ndefaultGroup = default-autolb-group\n\
  [tcpout:default-autolb-group]\ndisabled = false\nserver = 179.10.###.###:9997\n\
  ```\n\n### 使用 .msi 的 Splunk 通用转发器\n\n要使用 `.msi` 配置 Splunk 通用转发器，请从 [`www.splunk.com/en_us/download/universal-forwarder.html`](http://www.splunk.com/en_us/download/universal-forwarder.html)\
  \ 下载 Splunk `.msi` 文件。有关配置通用转发器的说明，请参考以下说明（参见图 9-2）。\n\n![../images/499684_1_En_9_Chapter/499684_1_En_9_Fig2_HTML.jpg](img/499684_1_En_9_Fig2_HTML.jpg)\n\
  \n*图 9-2 配置通用转发器到索引器*\n\n1. 勾选接受许可协议的框，然后单击**下一步**。\n2. 输入用户名和密码。\n3. 输入部署服务器的主机名或\
  \ IP 以及端口。\n\n现在让我们看看如何配置 Linux Splunk 转发器。\n\n### 配置 Linux Splunk 转发器\n\nLinux\
  \ Splunk 转发器可以通过命令行工具、`.rpm` 文件、`.tgz` 文件或 `.deb` 文件下载。要通过 `.rpm` 包文件、`.tgz` 包文件或\
  \ `.deb` 包文件安装 Splunk 通用转发器，请从 [`www.splunk.com/en_us/download/universal-forwarder.html`](http://www.splunk.com/en_us/download/universal-forwarder.html)\
  \ 下载。\n\n现在让我们通过 Linux 终端配置 Splunk 转发器。\n\n1. 在终端中，进入 `$SPLUNK_HOME/bin`。\n2. 要启动、停止或重启\
  \ Splunk，请键入 `./splunk start`、`./splunk stop` 或 `./splunk restart`。\n3. 键入 `sudo\
  \ ./splunk start` 来配置 Splunk 实例。\n4. Splunk 询问您是否同意。键入 \"`y`\"。（y = 是，n = 否）。\n\
  5. 输入管理员用户名为 `admin`（或您想要的任何名称）。\n6. 输入密码。\n7. 重新输入并确认密码。\n8. 键入以下命令以向索引器类型转发数据。\n\
  \n`./splunk add forward-server <主机名>:<端口>`\n\n1. 转到 `$SPLUNK_HOME/etc/system/local/outputs.conf`\
  \ 检查通用转发器是否正在转发数据。您应该会看到类似于以下的输出。\n\n```\n[tcpout]\ndefaultGroup = default-autolb-group\n\
  [tcpout:default-autolb-group]\ndisabled = false\nserver = 179.10.###.###:9997\n\
  ```\n\n接下来，让我们讨论两种类型的转发器。\n\n- 轻量型转发器\n- 重型转发器\n\n## Splunk 的轻量型和重型转发器\n\n您已经了解到转发器从源收集数据，将其转发到索引器，并使用不同的方法进行配置。现在您将了解两种类型的转发器：重型和轻型。\n\
  \n\n\n### Splunk 重量级转发器\n\n重量级转发器的占用空间比 Splunk 索引器小。它能执行索引器的几乎所有工作，但分布式搜索除外。它在转发前解析数据，并根据事件来源或类型等标准路由数据。重量级转发器还能够在本地索引数据，并将其发送到另一个索引器。\n\
  \n#### 配置重量级转发器\n\n要配置重量级转发器，请遵循以下步骤。\n\n![../images/499684_1_En_9_Chapter/499684_1_En_9_Fig3_HTML.jpg](img/499684_1_En_9_Fig3_HTML.jpg)\n\
  \n图 9-3 配置 Splunk 重量级转发器至索引器\n\n1. 在你想要配置重量级转发器的机器上安装 `Splunk Enterprise`。\n2. 点击\
  \ `设置`，进入 `转发和接收`。\n3. 选择 `配置转发`，然后点击 `新增`。\n4. 输入部署服务器的主机名或 IP 以及端口（请在索引器上启用监听端口）。\n\
  5. 重启 `Splunk` 实例。\n\n#### 配置重量级转发器以索引并转发来自通用转发器的数据\n\n要配置重量级转发器以索引和转发数据，请遵循以下步骤。\n\
  \n![../images/499684_1_En_9_Chapter/499684_1_En_9_Fig4_HTML.jpg](img/499684_1_En_9_Fig4_HTML.jpg)\n\
  \n图 9-4 在 Splunk 索引器上配置接收\n\n1. 进入 `Splunk Enterprise` 实例的 Web 界面。\n2. 点击 `设置`，进入\
  \ `转发和接收`。\n3. 进入 `配置接收`，点击 `新建`。\n4. 在 `监听此端口` 中，输入 `9997`。（你可以使用任何端口，但如果你分配了不同的端口，则需要在转发器实例的端口号模块中输入该端口。）请参考图\
  \ 9-4。\n\n重量级转发器是一种能够在转发前解析数据的 Splunk 转发器。\n\n### Splunk 轻量级转发器\n\n轻量级转发器已从 `Splunk\
  \ Enterprise` 6.0 版本起弃用，并被通用转发器取代。因此，只能在 `Splunk Enterprise` 6.0 之前的版本上配置轻量级转发器。\n\
  \n要在 Splunk 轻量级转发器中转发和接收数据，需要同时配置接收端和转发端。\n\n1. 安装一个完整的 `Splunk Enterprise` 实例。\n\
  2. 在该实例上启用转发。\n\n当你将一个 Splunk 实例配置为轻量级转发器时，请选择转发器许可证。该许可证必须适用于低于 6.0 版本的 `Splunk\
  \ Enterprise`。\n\n现在，我们聚焦于转发器管理。\n\n## 转发器管理\n\n本节讨论转发器的管理及其配置。\n\nSplunk 转发器管理提供了一个集中节点来管理整个\
  \ `Splunk` 域。转发器管理角色包括检查系统状态、监控部署活动以及配置和卸载环境中的应用。转发器管理提供了一个界面，用于创建服务器类，同时将客户端部署与应用程序部署进行映射。其主要目标是检查系统状态、监控部署活动，以及配置和卸载环境中的应用。它允许你修改服务器类并推送更新。简而言之，转发器管理提供了一个集中节点来管理整个\
  \ `Splunk` 域。\n\n转发器管理中有三个主要标签页。\n\n* **应用：** 此标签页显示已部署的应用列表并显示应用状态。你可以从转发器管理内部推送应用更新并编辑应用的属性。\n\
  * **服务器类：** 此标签页显示已部署的类列表并显示服务器类状态。你可以创建新的服务器类并编辑现有的服务器类。\n* **客户端：** 此标签页显示已部署的客户端列表及其状态。你可以通过此标签页限制应用的视图。\n\
  \n转发器管理界面中的 `转发器` 类决定了客户端可以安装的应用。\n\n在下一节中，你将了解可用于配置转发器管理的各种流程和平台。\n\n### 配置转发器管理\n\
  \n以下步骤用于在 Splunk 环境中设置转发器管理。\n\n转发器管理屏幕类似于图 9-5 所示。\n\n![../images/499684_1_En_9_Chapter/499684_1_En_9_Fig5_HTML.jpg](img/499684_1_En_9_Fig5_HTML.jpg)\n\
  \n图 9-5 配置转发器管理\n\n1. 进入 `$SPLUNK_HOME$/etc/system/local/serverclass.conf`。如果此文件不存在，你需要创建\
  \ `serverclass.conf`。\n2. 将以下代码复制到 `serverclass.conf` 中（提供的代码在你的 Splunk 实例中启用转发器管理）并重启你的实例。\n\
  3. 将 `Test` 应用添加到部署服务器文件夹。\n4. 在 Splunk Web 中进入 `设置`，然后进入 `转发器管理`。\n\n```\n[global]\n\
  [serverClass:AllApps]\n[serverClass:AllApps:app:*]\n```\n\n图 9-6 是已配置的转发器管理页面的截图。\n\
  \n![../images/499684_1_En_9_Chapter/499684_1_En_9_Fig6_HTML.jpg](img/499684_1_En_9_Fig6_HTML.jpg)\n\
  \n图 9-6 转发器管理页面\n\n### 配置转发器管理客户端\n\n转发器管理客户端可以是通用转发器、索引器或搜索头。除了部署服务器（即转发器管理本身）之外，所有组件都是转发器管理的潜在客户端。\n\
  \n要配置转发器管理的客户端，请参考以下规则。\n\n1. 使用 Linux 终端，进入 `$SPLUNK_HOME$/binsudo./splunk` 并设置\
  \ `deploy-poll` (IP 或主机名):(管理端口号)\n2. 在 Windows 命令提示符中，进入 `%SPLUNK_HOME%/binsudo.\\\
  splunk` 并设置 `deploy-poll` (IP 或主机名):(管理端口号)\n\n设置 `deploy-poll` 后，进入 `$SPLUNK_HOME$/etc/system/local/deploymentclient.conf`。你将看到类似如下的\
  \ `deploymentclient.conf`。\n\n```\n[target-broker:deploymentServer]\ntargetUri=\
  \ 179.12.XXX.XXX:8089\n```\n\n至此，关于转发器及其各种元素的讨论到此结束。下一节将讨论索引器集群，这是数据实现的另一个重要方面。\n\
  \n## Splunk 索引器集群\n\n在 `Splunk` 中，集群是指对等节点上每个存储桶的重复因子副本数量。`Splunk` 索引器集群由以某种方式配置的分组索引器组成，这种方式使索引器能够复制数据并维护其多个副本。它支持从一个索引器到下一个索引器的自动故障转移。因此，如果一个索引器宕机，传入\
  \ `Splunk` 的数据将通过另一个索引器进行索引，并保持可搜索性。\n\n通过索引复制，你可以实现以下几点：\n\n* 数据可用性\n* 数据保真度\n\
  * 灾难容错\n* 提升搜索性能\n\n### 配置索引器集群\n\n索引器集群是一组 `Splunk Enterprise` 索引器，它们复制数据以创建备份。它还通过其数据复制和搜索能力促进高可用性和灾难恢复。\n\
  \n`Splunk` 中基本的索引器集群架构包括两种类型的节点（见图 9-7）。\n\n* **主节点** 管理集群。它跟踪位于对等节点（从节点）上的副本，并帮助搜索头查找数据。它还帮助维护从一个索引器到下一个索引器的自动故障转移。\n\
  * **对等节点** 接收并索引来自转发器的传入数据。对等节点可以索引其传入数据，同时存储来自其他节点的数据副本。\n\n![../images/499684_1_En_9_Chapter/499684_1_En_9_Fig7_HTML.jpg](img/499684_1_En_9_Fig7_HTML.jpg)\n\
  \n图 9-7 组成索引器集群架构\n\n\n\n#### 使用 Splunk Web 创建索引器集群\n\n要使用 Splunk Web 创建索引器集群，请参考以下步骤。\n\
  \n1. 在 Splunk Web 中，转到 `设置`。\n2. 选择 `索引器集群` 并启用它。\n\n此步骤用于区分主节点和对等节点的创建方式。\n\n要创建主节点，请输入以下内容。\n\
  \n1. 输入复制因子。（更高的复制因子可在对等节点发生故障时防止数据丢失。）\n2. 输入搜索因子。（更高的搜索因子可加快恢复丢失数据的速度，但会占用更多磁盘空间。）\n\
  3. 输入安全密钥。（此密钥用于验证主节点与对等节点之间的通信。）\n4. 为集群命名。（此步骤为可选。）\n\n图 9-8 展示了配置主节点的示例。\n\n\
  ![../images/499684_1_En_9_Chapter/499684_1_En_9_Fig8_HTML.jpg](img/499684_1_En_9_Fig8_HTML.jpg)\n\
  \n**图 9-8** 配置主节点：Splunk Web\n\n填写完必要详细信息后，单击 `启用主节点` 来创建该节点。\n\n要配置对等节点，请输入以下信息。\n\
  \n1. 输入主节点 URI（`IP:mgmt_port/主机名:mgmt_port`）。\n2. 输入对等复制端口。（对等节点之间用于流式传输数据的端口。）\n\
  3. 输入安全密钥。（此密钥用于验证主节点与对等节点之间的通信。）\n4. 单击 `启用对等节点`。\n\n图 9-9 展示了配置对等节点的示例。\n\n![../images/499684_1_En_9_Chapter/499684_1_En_9_Fig9_HTML.jpg](img/499684_1_En_9_Fig9_HTML.jpg)\n\
  \n**图 9-9** 配置对等节点：Splunk Web\n\n#### 使用 Splunk .conf 文件创建索引器集群\n\n要从主节点的 `.conf`\
  \ 文件配置 Splunk 索引器集群，索引器会创建或编辑 `$Splunk_Home$/etc/system/local` 目录下的 `indexer.conf`\
  \ 文件。\n\n以下代码块展示了使用 `.conf` 文件配置主节点的语法。\n\n- `replication_factor` 可在对等节点发生故障时防止数据丢失。\n\
  - `search_factor` 可加快恢复丢失数据的速度，但会占用更多磁盘空间。\n- `pass4SymmKey` 用于验证主节点与对等节点之间的通信。\n\
  - `cluster_label` 是集群的名称。\n- 要配置对等节点，索引器会创建或编辑位于 `$Splunk_Home$/etc/system/local`\
  \ 目录下的 `indexer.conf` 文件。\n\n```\n[clustering]\nmode = master\nreplication_factor\
  \ = \nsearch_factor = \npass4SymmKey = \ncluster_label = \n```\n\n以下代码块展示了使用 `.conf`\
  \ 文件配置对等节点的语法。\n\n- `master_uri` 是主节点的地址。\n- `pass4SymmKey` 用于验证主节点与对等节点之间的通信。\n\
  \n```\n[replication_port://]\n[clustering]\nmaster_uri = https://:,:\nmode = slave\n\
  pass4SymmKey = \n```\n\n#### 使用 Splunk CLI 创建索引器集群\n\n要使用 Splunk CLI 为主节点配置索引器集群，请参考以下步骤。\n\
  \n1. 使用 Windows CMD 或 Linux 终端，转到 `%SPLUNK_HOME%/bin`。\n2. 要启动、停止和重启 Splunk，请分别输入\
  \ `.\\splunk start`、`.\\splunk stop` 和 `.\\splunk restart`。\n\n以下代码块展示了使用 Splunk\
  \ CLI 配置主节点的语法。\n\n```\nsplunk edit cluster-config -mode master -replication_factor\
  \  -search_factor  -secret  -cluster_label \nsplunk restart\n```\n\n以下内容描述了对等节点的配置步骤。\n\
  \n1. 使用 Windows CMD 或 Linux 终端，转到 `%SPLUNK_HOME%/bin`。\n2. 要启动、停止和重启 Splunk，请分别输入\
  \ `.\\splunk start`、`.\\splunk stop` 和 `.\\splunk restart`。\n\n以下代码块展示了使用 Splunk\
  \ CLI 配置对等节点的语法。\n\n```\nsplunk edit cluster-config -mode slave -master_uri https://:,:\
  \ -replication_port  -secret  -cluster_label \nsplunk restart\n```\n\n现在，让我们继续学习\
  \ Splunk LDAP，它负责监督 Splunk 域中的身份验证。\n\n## Splunk 轻量级目录访问协议 (LDAP)\n\n您已经学习了 Splunk\
  \ 转发器、转发器管理和索引器集群。它们共同负责从数据源收集、分配和汇总数据。本节将讨论数据身份验证和凭据管理。\n\nSplunk LDAP 在 Splunk\
  \ Web 的身份验证中起着关键作用。它维护用户凭据（如用户 ID 和密码）以及信息（如主机名、绑定 DN 和用户基础 DN）。当您在 Splunk Web 中配置\
  \ LDAP 时，它会处理身份验证。\n\n每次用户登录时，Splunk 都会重新检查 LDAP 服务器。\n\n### 创建 LDAP 策略\n\n要创建 LDAP\
  \ 策略，请遵循以下步骤。\n\n1. 在 Splunk 主页上单击 `设置`，然后转到 `身份验证方法`。\n2. 单击 `配置 Splunk 以使用 LDAP`，然后转到\
  \ `新建 LDAP`。在 `新建 LDAP` 中，输入以下详细信息。\n   1. LDAP 策略名称\n   2. LDAP 服务器的主机名（确保 Splunk\
  \ 服务器可以识别该主机名）\n   3. Splunk Enterprise 用于连接 LDAP 服务器的端口，默认为端口 636（默认情况下，LDAP 服务器侦听\
  \ TCP 端口 389，LDAPS (带 SSL 的 LDAP) 侦听端口 636）\n3. 检查是否启用了 SSL。此为可选步骤。\n4. 提供绑定 DN。（它定义了管理员所在的域名。）\n\
  5. 输入并确认绑定用户的绑定 DN 密码。\n6. 指定用户基础 DN（Splunk Enterprise 使用此属性来定位用户信息）。\n\n以下是可能需要处理的其他信息。\n\
  \n- 用户基础过滤器（建议仅返回适用的用户；例如，`(department=IT, Management, Accounts, etc.)`。）\n- 用户名\n\
  - 真实名称属性\n- 邮件地址\n- 组映射属性（组条目用于定义其成员的用户属性）\n- 组基础 DN（LDAP 中用户组的位置）\n- 要过滤静态组的对象类的静态组搜索过滤器\n\
  - 组名称属性（其值存储组名称的组条目属性）\n- 静态成员属性（其值为组成员的组属性）\n\n对于嵌套组，请选中 `嵌套组`。输入 `动态组搜索过滤器` 以检索动态组；如果存在，则输入\
  \ `动态成员属性`。\n\n在 `高级设置` 中，您可以限制搜索请求时间、搜索请求大小限制以及网络套接字超时时间。\n\n1. 单击 `保存` 并退出。\n\n\
