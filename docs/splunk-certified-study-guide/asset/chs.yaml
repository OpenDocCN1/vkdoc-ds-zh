  \  `regular expression`\n    5.  `geo IP fields`\n    6.  `以上所有`\n    7.  `以上都不是`\n\
  \n6.  数据模型和 Pivot 之间的关系是什么？\n    1.  数据模型为 Pivot 提供数据集。\n    2.  Pivot 和数据模型没有关系。\n\
  \    3.  Pivot 和数据模型是同一回事。\n    4.  Pivot 为数据模型提供数据集。\n\n7.  选择所有包含在数据模型事件类型中的选项。\n\
