  \ Splunk 及其架构，以及 Splunk Enterprise 认证管理员考试。在本章的最后一节，您将学习如何在 Splunk 中添加数据。\n\n###\
  \ 在 Splunk 中添加数据\n\n在本地机器上安装好 Splunk 后，下一步就是接入数据。为此，您需要创建一个名为 `test` 的新应用程序来执行操作。\n\
