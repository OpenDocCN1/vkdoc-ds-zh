  \ (5%)** 本部分考察你对网络（TCP 和 UDP）输入、网络输入的可选设置以及基本脚本化输入的知识。\n-   **第 14 部分：无代理输入 (5%)**\
  \ 本部分考察你对 Windows 输入类型和 HTTP 事件收集器的知识。\n-   **第 15 部分：微调输入 (5%)** 本部分考察你对输入阶段默认处理过程以及配置输入阶段选项（例如源类型微调和字符集编码）的知识。\n\
  -   **第 16 部分：解析阶段与数据 (5%)** 本部分考察你对解析过程中的默认处理、优化和配置事件分行、从事件中提取时间戳和时区，以及使用数据预览验证解析阶段创建的事件的知识。\n\
  -   **第 17 部分：操作原始数据 (5%)** 本部分考察你对如何定义和调用数据转换，以及如何使用 `props.conf`、`transforms.conf`\
  \ 和 `SEDCMD` 进行转换来修改原始数据的知识。\n\n## Splunk 简介\n\n*Splunk* 一词源自 *spelunking*，意为探索洞穴。Splunk\
  \ 能够分析几乎所有已知的数据类型，包括机器数据、结构化数据和非结构化数据。Splunk 实时提供整个基础设施中发生的运营反馈——有助于快速决策。\n\nSplunk\
  \ 通常被认为是“日志文件的谷歌”，因为和谷歌一样，你可以使用 Splunk 来确定网络的状态以及网络内发生的活动。它是一个**集中式日志管理工具**，但它也能很好地处理结构化和非结构化数据。Splunk\
  \ **监控、报告和分析实时机器数据**，并根据时间戳对数据进行索引。\n\n### Splunk 的历史\n\nSplunk 由 Rob Das、Erik Swan\
  \ 和 Michael Baum 于 2003 年 10 月创立。它从一家小型初创公司发展成为安全信息和事件管理 (SIEM) 工具领域最大的跨国公司之一。在\
  \ Splunk 出现之前，需要对环境进行故障排除的企业必须依赖 IT 部门，由程序员编写脚本来满足需求。该脚本在一个平台上运行以生成报告。\n\n因此，公司无法精确地发现其基础设施深处的问题。Splunk\
  \ 就是为了解决这个问题而创建的。最初，Splunk 侧重于分析和理解问题，了解组织在出现问题时采取的措施，并追溯踪迹。\n\nSplunk 的第一个版本于 2004\
  \ 年在 Unix 市场发布，并开始获得关注。\n\n理解开发此软件的原因很重要。下一节将讨论 Splunk 的许多有用优势。\n\n### Splunk 的优势\n\
  \nSplunk 提供了多种优势，包括以下内容。\n\n-   将复杂的日志分析报告转换为图表\n-   支持结构化数据以及非结构化数据\n-   提供一个简单且可扩展的平台\n\
  -   为最复杂的架构提供简单的架构\n-   理解机器数据\n-   为运营智能提供数据洞察\n-   持续监控 IT 数据\n\n\n\n### Splunk\
  \ 架构\n\n`Splunk 索引器`在特定架构中按照指定方式工作（见图 1-2）。\n\n![../images/499684_1_En_1_Chapter/499684_1_En_1_Fig2_HTML.jpg](img/499684_1_En_1_Fig2_HTML.jpg)\n\
  \n图 1-2 Splunk 架构图\n\n我们来解析上图并介绍其组成部分。\n\n- **输入数据**：这是数据接入的第一阶段。将数据导入 `Splunk`\
  \ 有多种方法：它可以监听你的端口、`REST API` 端点、传输控制协议（`TCP`）、用户数据报协议（`UDP`）等，或者使用脚本化输入。\n- **解析器**：第二阶段是解析输入数据，将数据块分解为不同的事件。解析管道中数据的最大大小为\
  \ 128 MB。在解析阶段，你可以提取默认字段，例如源类型。你还可以从数据中提取时间戳、识别行终止符，并执行其他类似操作。你也可以对敏感但有用的数据进行脱敏。例如，如果数据来自银行且包含客户账号，那么数据脱敏至关重要。在解析阶段，如果需要，你可以应用自定义元数据。\n\
  - **索引**：在此阶段，事件被分解为可以在其中进行搜索的段。数据被写入磁盘，你可以设计索引数据结构。\n- **搜索**：在此阶段，在索引数据之上执行搜索操作，你可以创建知识对象并执行任何任务；例如，制作月度销售报告。\n\
  \n输入数据、解析器和索引器都位于同一台独立机器上。与此相反，在分布式环境中，输入数据通过通用转发器 (`UF`) 被解析到索引器或重型转发器。`UF` 是一个轻量级程序，用于在\
  \ `Splunk` 中获取数据。在 `UF` 中，你无法搜索数据或执行任何操作。你将在本章后续内容中了解这一点。\n\n图 1-3 展示了 `Splunk`\
  \ 的架构。\n\n![../images/499684_1_En_1_Chapter/499684_1_En_1_Fig3_HTML.jpg](img/499684_1_En_1_Fig3_HTML.jpg)\n\
  \n图 1-3 Splunk 架构\n\n在 `Splunk` 架构中可以执行以下任务。\n\n- 你可以通过网络端口接收数据，并实时检测文件变化。\n- 你可以实时监控文件和检测文件。\n\
  - 你可以运行脚本以获取自定义数据。\n- 分布式环境中支持数据路由、克隆和负载均衡，你将在后续章节中了解这些内容。\n- 用户访问控制保障了安全性。有不同级别的安全权限：普通用户、高级用户和管理员。用户可以根据其权限写入或读取索引。\n\
  - 部署服务器管理整个技术栈的部署。你可以使用部署服务器来部署新的应用程序。\n- 当索引器从解析器接收数据时，它会对其进行索引，你可以将事件分解为多个片段。\n\
  - 数据一旦存储在索引器中，你就可以执行搜索操作。\n- 你可以对索引数据进行计划搜索。\n- 你可以通过设置参数来生成数据警报；例如，当特定事务的事务时间超过\
  \ 15 分钟时。\n- 你可以通过计划执行、保存搜索或创建宏来生成报告。有多种方式可以生成报告。\n- 知识对象对于从用户定义的数据、非结构化数据等创建专业报告非常有用。\n\
  - 你可以通过 `Splunk` 网页界面（最常用的选项）或 `Splunk CLI` 来访问 `Splunk` 实例。\n\n现在，我们继续学习如何快速安装\
  \ `Splunk`。\n\n## 安装 Splunk\n\n你可以免费下载并安装 `Splunk Enterprise` 的 60 天试用版，该版本每天可索引\
  \ 500 MB 数据。你只需在 [`www.splunk.com/en_us/download/splunk-enterprise.html`](http://www.splunk.com/en_us/download/splunk-enterprise.html)\
  \ 创建一个帐户即可。\n\n60 天后，你可以转换为永久免费许可证，或购买 `Splunk Enterprise` 许可证以继续使用专为企业级规模部署设计的扩展功能。（第\
  \ 8 章将详细讨论 `Splunk` 许可证）。\n\n表 1-1 展示了在安装过程中，几个 `Splunk` 属性与其默认端口之间的关系。每个属性的重要性将在本书后续章节讨论。\n\
  \n表 1-1 Splunk 属性与默认端口值\n\n| 属性 | 默认端口 |\n| --- | --- |\n| Splunk 默认端口 | 8000 |\n\
  | Splunk 管理端口 | 8089 |\n| Splunk KV 存储 | 8191 |\n\n### 在 macOS 上安装 Splunk\n\nmacOS\
  \ 用户应按照以下步骤安装 `Splunk`。\n\n![../images/499684_1_En_1_Chapter/499684_1_En_1_Fig4_HTML.jpg](img/499684_1_En_1_Fig4_HTML.jpg)\n\
  \n图 1-4 安装 Splunk\n\n1.  登录你的 `Splunk` 帐户。\n2.  在 [`www.splunk.com/en_us/download/splunk-enterprise.html#tabs/macos`](http://www.splunk.com/en_us/download/splunk-enterprise.html%2523tabs/macos)\
  \ 下载 `Splunk` 文件。\n3.  打开下载的文件。\n4.  点击安装按钮。\n5.  在下一步点击继续按钮。\n6.  持续点击继续按钮，直到系统提示你点击安装按钮。\n\
  7.  如果你希望先更改安装位置，可以点击更改安装位置来进行操作（见图 1-4）。\n\n![../images/499684_1_En_1_Chapter/499684_1_En_1_Fig5_HTML.jpg](img/499684_1_En_1_Fig5_HTML.jpg)\n\
  \n图 1-5 创建管理员用户\n\n8.  在选择好要安装 `Splunk` 的路径后，点击安装按钮。\n9.  在管理员用户名处输入 admin（见图 1-5）。\n\
  \n![../images/499684_1_En_1_Chapter/499684_1_En_1_Fig6_HTML.jpg](img/499684_1_En_1_Fig6_HTML.jpg)\n\
  \n图 1-6 为管理员用户创建密码\n\n10. 输入你的新密码，如图 1-6 所示。\n\n![../images/499684_1_En_1_Chapter/499684_1_En_1_Fig7_HTML.jpg](img/499684_1_En_1_Fig7_HTML.jpg)\n\
  \n图 1-7 Splunk 用户界面\n\n11. 在 `http://localhost:8000` 启动 `Splunk`。输入你刚刚创建的用户名和密码（图\
  \ 1-7）。\n\n![../images/499684_1_En_1_Chapter/499684_1_En_1_Fig8_HTML.jpg](img/499684_1_En_1_Fig8_HTML.jpg)\n\
  \n图 1-8 用于审计索引的 Splunk 事件\n\n12. 登录后，进入搜索和报告应用程序，并输入以下 `Splunk` 处理命令进行测试。\n\n  \
