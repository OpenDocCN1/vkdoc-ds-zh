  \ `props.conf` 文件所致。图 1-19 显示了“源类型”框。\n\n4.  在“输入设置”中，创建一个名为 Test 的新索引。Test 索引将存储来自\
  \ `test.txt` 文件的所有事件。图 1-20 展示了如何创建索引器。您只需输入名称即可。\n\n    ![../images/499684_1_En_1_Chapter/499684_1_En_1_Fig20_HTML.jpg](img/499684_1_En_1_Fig20_HTML.jpg)\n\
  \n    **图 1-20** Test 索引：Splunk Web\n\n5.  确认所有字段无误后，点击“保存”按钮。\n\n6.  转到 test 应用程序，在搜索框中输入\
