  \n您现在对 Splunk 软件有了更深入的了解，并学习了如何输入数据。至此，您已成功完成第 1 章的学习。\n\n## 总结\n\n本章通过讨论 Splunk\
  \ 的历史、起源和突出特点，着重介绍了其基本概念。它提供了管理考试的路线图，解释了基础架构以及如何在 macOS 和 Windows 上安装 Splunk。在最后一节中，您学习了如何在\
  \ Splunk 中操作数据，包括数据接入、修改源文件（例如添加时间戳）和行分隔符。\n\n您将在第 11 章中了解更多关于 `.conf` 文件的内容。在此之前，请尝试接入各种类型的数据，并在\
  \ Splunk 中对它们进行操作。\n\n在下一章中，您将学习 Splunk 的搜索处理语言及其各种命令。\n\n### 多选题\n\n1.  Splunk\
  \ 的默认管理端口是什么？\n    1.  8000\n    2.  8089\n    3.  8056\n    4.  9997\n\n2.  索引数据源时，默认元数据会被添加到\
  \ Splunk。\n    1.  正确\n    2.  错误\n\n3.  Splunk 的各个阶段是什么？（请选择所有适用项。）\n    1.  解析\n\
