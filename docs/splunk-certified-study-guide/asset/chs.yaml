  \ 1-8 的屏幕。\n\n请注意，`host`、`index`、`linecount`、`punct`、`source`、`sourcetype`、`splunk_server`\
  \ 和 `timestamp` 是在索引数据源时添加到 `Splunk` 中的一些默认字段。\n\n至此，在 macOS 上安装 `Splunk` 的整个过程就结束了。\n\
  \n接下来，我们来讨论如何在 Windows 操作系统上进行安装。\n\n\n\n### 在 Windows 系统上安装 Splunk\n\nWindows 用户应按照以下步骤安装\
