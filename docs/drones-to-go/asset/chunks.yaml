    equations, and the one that contains the ODE solver. Although in this book we
    use MATLAB and Simulink for simplicity, with the concepts outlined, you will be
    able to use any other programming language ​​or graphic simulator for the same
    purposes.


    *   And finally the implementation section, which shows the coding considerations
    and signal processing currently available or required to use most of the unmanned
    aerial systems. Also this section may be useful for other types of vehicles.


    As you can see, this book and its chapters can be used as the basis for the elaboration
    of a complete plan for teaching and studying the described subject. This book
    is by itself a complete course in a pocket size.


    This book is aimed at makers, designers, scientists, and researchers related to
    the drone world and specifically to multicopters. However, if you are a pilot
    or a hobbyist and you are interested in knowing every corner of your vehicle,
    this text will be a useful and understandable reading.


    If you have the printed version of this book, consider to download also the pdf
    of the same in order to see detailed close-ups of the equations.


