- fmt: '### Control of the Dependent Dynamics


    From the previous simplifications, we can note that the remaining system is


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figad_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figad_HTML.jpg)


    The subsystems that do not have dependencies on other variables are the rotational
    ones, while the translational ones depend on those rotational variables.


    For this reason, it is reasonable to start designing the controllers of the rotational
    dynamics. Under a similar argument to the one presented for the yaw variable,
    and for the reasons already explained about smooth flight (small accelerations)
    and constant absorption, these controllers for roll and pitch are proposed:


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figae_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figae_HTML.jpg)


    This implies in a similar way to the previously analyzed variables that


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figaf_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figaf_HTML.jpg)


    As a consequence, the dependent dynamics can be controlled through the desired
    values of the angles on which they depend. This is logical, since a quadcopter
    is able to move in `X` and `Y` through roll and pitch tilting.


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figag_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figag_HTML.jpg)


    Then the desired values of `theta` and `phi` are selected in this way (this is
    known as external control loop or nested control):


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figah_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figah_HTML.jpg)


    This feedback on the translational `X` and `Y` dynamics has as a consequence


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figai_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figai_HTML.jpg)


    Under the premises of smooth flight, bounded trajectories with small accelerations,
    and absorption of constants previously used, the auxiliary controllers can be
    simply


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figaj_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figaj_HTML.jpg)


    In summary, the control to be injected is as follows (see the simulation in the
    next chapter to observe its performance):


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figak_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figak_HTML.jpg)


    which is expanded in the following way:


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figal_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figal_HTML.jpg)


    Remember the introduction to the ISO 1151–2: 1985 standard, and note that the
    `theta` measurement is made with respect to the `Y` axis but its variation influences
    the `X` motion. Likewise, the `phi` measurement is made around the `X` axis, but
    its variation influences the motion on `Y`.


    Finally, given that


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figam_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figam_HTML.jpg)


    you should notice that the desired speeds of `theta` and `phi` are not zero, and
    that they should be the corresponding derivatives of the translational PDs. However,
    zero is a good approximation considering the smooth flight approximation and the
    variable convergence described above.


    Concerning to this smooth flight approximation, let’s see what happens in this
    flight mode to the controllers.


    ### Linear Decoupling of the Controllers


    Another important consideration is the fact that in this type of smooth flight
    with fixed yaw equal to zero, the controllers are decoupled (at least the linear
    controllers like PD, PID, etc.), so the planar translations and the roll and pitch
    rotations seem to have an independent behavior, for example


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figan_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figan_HTML.jpg)


    making the previous assumptions of constant absorption


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figao_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figao_HTML.jpg)


    The following is obtained:


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figap_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figap_HTML.jpg)


    A similar result is obtained for the variable `phi`. Do this as an exercise.


    Before ending this section, let’s talk about some remarks.


    ### Remarks and Graphical Interpretations


    Graphically, the implementation of this control has the sequence shown in Figure
    3-6.


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Fig6_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Fig6_HTML.jpg)


    *Figure 3-6: Graphic sequence of a fully linear Cartesian control with no yaw
    variation*


    Two versions with remote control (semi-automatic or guided manual mode) are as
    follows.


    In this first version, the remote control only alters the desired values; see
    Figure 3-7.


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Fig7_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Fig7_HTML.jpg)


    *Figure 3-7: Graphic sequence of a fully linear Cartesian control with no yaw
    variation and with manual radio control command at the desired values*


    In the second version, the remote control modifies the torques and forces; see
    Figure 3-8.


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Fig8_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Fig8_HTML.jpg)


    *Figure 3-8: Graphic sequence of a fully linear Cartesian control with no yaw
    variation and with manual radio control command at the force and torque control*


    Notice that there are as many combinations of manual modes as you want. In the
    examples described, the second one could be dangerous because you directly affect
    the controllers, but the risk is reduced if you introduce small and bounded values.


    You learned about the robot mode control without yaw variation. Let’s move to
    the one with variable yaw.'
