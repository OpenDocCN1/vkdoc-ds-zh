- fmt: '### Text Mode with Predefined Commands


    In this case, only a text file and an auxiliary file for plotting (optional) are
    required (the auxiliary file can be replaced by typing directly into the command
    window). As the name implies, predefined functions are used (in the following
    example, the command `ode45`).


    The disadvantage of this method is that its interaction with Simulink is extremely
    difficult and any additional signal processing implies that you must write auxiliary
    code (this becomes very difficult when feedback is required). On the other hand,
    note that for converting this code into an interpreted MATLAB function, you must
    make some simple adjustments (the dynamics file already has a structure similar
    to an interpreted MATLAB function).


    Listing [4-9](#504209_1_En_4_Chapter.xhtml#PC9) shows the code of the `msdPredefinedFuncSys.m`
    file and the way to convert this file into an interpreted MATLAB function code.


    ```

    function out=msdPredefinedFuncSys(t,inpt)

    % for converting this file into an Interpreted MATLAB® function

    % just delete the letter t from the function arguments and add the

    % word end after the output line

    x1=inpt(1);

    x2=inpt(2);

    B=0.5;

    K=0.5;

    M=0.7;

    x1d=x2;

    x2d=(1/M)*((-B*x2)-(K*x1));

    out=[x1d;x2d];

    Listing 4-9

    Code for Using the Text Mode with Predefined Commands

    ```


    The use of this file is described in the lines of Listing [4-10](#504209_1_En_4_Chapter.xhtml#PC10)
    (observe the part where the time and initial conditions are set):


    ```

    [t,X]=ode45(@msdPredefinedFuncSys,[0 30],[5;0]);

    plot(t,X)

    Listing 4-10

    Complementary Code for Running the Simulation and Plotting While Using the Text
    Mode with Predefined Commands

    ```


    The previous commands can be introduced directly into the command window or by
    using an auxiliary file. In the case of this book, it’s the file `msdPredefinedFuncPlot.m`.
    The result of this kind of simulation is displayed in Figure [4-44](#504209_1_En_4_Chapter.xhtml#Fig44).


    ![../images/504209_1_En_4_Chapter/504209_1_En_4_Fig44_HTML.jpg](images/504209_1_En_4_Chapter/504209_1_En_4_Fig44_HTML.jpg)


    Figure 4-44


    Mass spring damper simulation by using only text files (with predefined or customized
    commands)


    ### Text Mode with Customized Commands


    This is identical to the previous case, but the user is free to generate their
    own ODE solvers (non-predesigned functions). This implies a direct way to migrate
    to other programming languages. Just remember that the syntax will change but
    not the algorithms or the equations.


    Listing [4-11](#504209_1_En_4_Chapter.xhtml#PC11) shows the system code (`msdCustomSys.m`).
    Remember that in this case the controller is zero. At this point, you should have
    already noticed the simulation pattern (a file with the dynamics of the system,
    another file with the ODE solver, and a line, code segment, or execution interface
    for running the simulation).


    ```

    function h=msdCustomSys(t,X)

    x1=X(1);

    x2=X(2);

    B=0.5;

    K=0.5;

    M=0.7;

    x1p=x2;

    x2p=(-(B*x2)-(K*x1))/M;

    h=[x1p;x2p];

    Listing 4-11

    Code for Using the Text Mode with Customized Commands

    ```


    The execution lines are as indicated in Listing [4-12](#504209_1_En_4_Chapter.xhtml#PC12),
    and they are contained in the `msdCustomPlot.m` file (which is optional since
    they can be executed from the command window).


    ```

    X0=[5;0];

    t = linspace(0,30,5000);

    X=ode3(''msdCustomSys'',t,X0);

    plot(t,X)

    Listing 4-12

    Complementary Code for Running the Simulation and Plotting While Using the Text
    Mode with Customized Commands

    ```


    The plot is practically identical to Figure [4-44](#504209_1_En_4_Chapter.xhtml#Fig44).
    The solver file called `ode3` is available for download at [`www.mathworks.com/matlabcentral/answers/98293-is-there-a-fixed-step-ordinary-differential-equation-ode-solver-in-matlab-8-0-r2012b`](http://www.mathworks.com/matlabcentral/answers/98293-is-there-a-fixed-step-ordinary-differential-equation-ode-solver-in-matlab-8-0-r2012b)
    in the folder called `ODE_Solvers.zip`, which appears throughout that post.


    Observe that the code provides in an extensive way its own numerical method. For
    other solvers, you can consult the Appendix.


    ## Summary


    In this chapter, you learned about different methods to simulate the behavior
    and control of drones by using MATLAB and Simulink tools. However, it is presented
    to you in such a way that you can use the knowledge learned with other tools and
    programming languages. The chapter conclusion is that, in order to simulate an
    aircraft and in general any system, you will require at least three programs:
    the dynamic model with its control code, the numerical solver for your system
    of equations, and an execution environment. If you want to include graphics or
    user interaction, some options were mentioned but finally and in any case you
    will need to know the basic notions of the three aforementioned programs. This
    knowledge is complemented in the Appendix. In the next chapter, you will see implementation
    details focused on signal processing, high-level UART communication, and SDKs
    programming.


    # 5. Implementation


    This chapter has a scientific and maker impact and you will learn about topics
    that are also discarded in many publications, related to core implementation details
    such as signal processing for sensors and actuators, data transmission, the ways
    to program a drone, and a glossary with the main commands used with the most popular
    software development interfaces. As a result, you will be able to understand concisely
    how to program a drone or any other robotic vehicle. You will also be able to
    advance your knowledge with the selected references in the Appendix.'
