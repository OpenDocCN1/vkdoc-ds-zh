    This useful zero can be observed behaving like a zero as the time evolves. Note
    the fact that there is no negative time. This is just plotted as an expanded view:


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figb_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figb_HTML.jpg)


    This function will always have the behavior shown in Figure [3-2](#504209_1_En_3_Chapter.xhtml#Fig2)
    as long as B has a positive value.


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Fig2_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Fig2_HTML.jpg)


    Figure 3-2


    An example of zero by approximation


    Note that a useful zero is a way to force something to become as a constant zero.
    This function is also the solution and behavior associated with this differential
    equation:


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figc_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figc_HTML.jpg)


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figd_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figd_HTML.jpg)


    Using Newton’s notation, it is equal to


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Fige_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Fige_HTML.jpg)


    In a more generic way, this family of differential equations always results in
    a decreasing exponential function, which tends to zero as long as B and K are
    positive values:


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figf_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figf_HTML.jpg)


    If we make the following variable changes, we obtain an equation known as PD controller:


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figg_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figg_HTML.jpg)


    which implies that the value E associated with the error to be controlled will
    tend to zero, and as E is defined like


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figh_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figh_HTML.jpg)


    In other words, the desired value minus the actual value of a variable, for example
    a position or an orientation:


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figi_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figi_HTML.jpg)


    The desired value will tend to be the real value and therefore we will have accomplished
    our task!


    We will use this useful zero concept and its PD application later.


    Keep in mind that the first-order differential equation, and consequently the
    PD, has a physical equivalent called a massless damped harmonic oscillator or
    a spring damper system. Therefore, the proportional term can be interpreted as
    an induced spring and the differential term as an induced damper; see Figure [3-3](#504209_1_En_3_Chapter.xhtml#Fig3).
    Said induced spring serves to pull the real system towards the desired value,
    and the induced damper serves to stop the real system at said value. If it were
    just the induced spring and not the induced damper, the real system would not
    stop and it would remain oscillating around the desired value (the zero value
    of the error).


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Fig3_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Fig3_HTML.jpg)


    Figure 3-3


    The physical analogy of a PD controller


    Another useful zero is the second order differential equation or mass spring damper
    system, also called a damped harmonic oscillator, as long as the terms M, B, and
    K are positive. The deduction is a little less intuitive and is a matter of linear
    control and differential equations books. However, for the purposes of this book
    and under the given conditions, we will just assume that this system is also a
    useful zero.


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figj_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figj_HTML.jpg)


    For control purposes, it is highlighted that the PID control behaves like said
    mass spring damper system (at least mathematically, since there are physical considerations
    during the implementation as the effect of using differentiators instead of integrators).


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figl_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figl_HTML.jpg)


    Having learned about the useful zero concept, let’s continue with the controllers.
    We will start with the robot mode controllers.'
  trans: '

    # 3. 无人机控制


    在本章中，你将学习基于两种分类的四种最常用的无人机控制器，这两种分类分别将飞行器视为载具和机器人。本章还将向你介绍一些控制概念和李雅普诺夫稳定性理论的基本概念。最后，还包括一节关于轨迹规划的内容。因此，你将能够理解和掌握大多数现有的无人机控制器，包括强大的几何控制。有了这些知识，你可以将其扩展到其他类型的载具和飞行器。


    请记住，为了将我们将要研究的控制器注入飞行器的电机（以及一般任何其他控制器），你必须使用为你各自的载具计算的分配矩阵或推进矩阵。上一章中分析的特定案例的分配矩阵如下所示：


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figa_HTML.jpg](img/504209_1_En_3_Figa_HTML.jpg)


    因此，本章的目标是学习设计`FZB`力以及其余三个扭矩的最通用方法。


    另请注意，如果使用 SDK 类型 3（如第五章关于无人机编程方式的章节所述），此方法是有效的。如果使用 SDK 类型 2，则所述力和扭矩将直接注入飞行器，无需使用分配矩阵。最后，如果使用
    SDK 类型 1 或 GUI，则你只能定义轨迹配置文件（你将无法设计自己的控制器；只能修改预装的控制器增益和路径）。


    你将看到，像任何其他无人载具一样，四轴飞行器可以被分析和视为机器人或载具，在这两种情况下，控制可以是自动的，也可以不是。


    在讨论这些控制器之前，让我们先来谈谈一个有用的概念：零值。


    ## 有用零值概念


    控制目标是为了开发一个任务而引入有用的零值。


    在控制理论中，通常会发现三种零值：定义零值、主导零值和近似零值。不要将这些概念与线性控制理论中的极点和零点相混淆。


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Fig1_HTML.jpg](img/504209_1_En_3_Fig1_HTML.jpg)


    **图 3-1** 主导零值示例


    * **定义零值**是一个理想的恒定值，旨在将误差或估计值趋近于此值。它也是一种静态或动态平衡，确保受力或运动平衡。


    * **主导零值**是指当方程中的某一项相对于其他项过大时，方程的行为仅由主导项决定，而忽略其他项的影响。这些被忽略的项被视为主导零值。这种零值在电路和电子电路分析以及控制理论中非常常见。图
    3-1 显示了一个函数的图形，其中主导效应可以近似等于 4。观察到被主导的正弦分量相对于 4 可以视为零。


    另一方面，这里所称的有用零值是通过时间行为获得的。在数学上，它是任何随时间增加而趋于零的函数。


    在控制理论中，广泛用作有用零值的一个函数是负指数函数。这个有用零值会随着时间推移表现出类似零的行为。注意，不存在负时间。下图只是一个展开视图：


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figb_HTML.jpg](img/504209_1_En_3_Figb_HTML.jpg)


    只要 `B` 为正值，该函数将始终表现出如图 3-2 所示的行为。


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Fig2_HTML.jpg](img/504209_1_En_3_Fig2_HTML.jpg)


    **图 3-2** 近似零值示例


    请注意，有用零值是一种强制某物变为恒定零值的方法。此函数也是与此微分方程相关的解和行为：


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figc_HTML.jpg](img/504209_1_En_3_Figc_HTML.jpg)


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figd_HTML.jpg](img/504209_1_En_3_Figd_HTML.jpg)


    使用牛顿记法，它等同于


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Fige_HTML.jpg](img/504209_1_En_3_Fige_HTML.jpg)


    更一般地，这一系列微分方程总是得到一个递减的指数函数，只要 `B` 和 `K` 为正值，该函数就趋于零：


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figf_HTML.jpg](img/504209_1_En_3_Figf_HTML.jpg)


    如果我们做以下变量替换，我们将得到一个称为 PD 控制器的方程：


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figg_HTML.jpg](img/504209_1_En_3_Figg_HTML.jpg)


    这意味着与被控误差相关的值 `E` 将趋于零，并且由于 `E` 被定义为


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figh_HTML.jpg](img/504209_1_En_3_Figh_HTML.jpg)


    换句话说，它是变量的期望值减去实际值，例如位置或姿态：


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figi_HTML.jpg](img/504209_1_En_3_Figi_HTML.jpg)


    期望值将趋于等于实际值，因此我们就完成了任务！


    我们稍后会用到这个有用零值概念及其 PD 应用。


    请记住，一阶微分方程以及 PD 控制器有一个物理等效系统，称为无质量阻尼谐振子或弹簧-阻尼器系统。因此，比例项可以解释为诱导弹簧，微分项可以解释为诱导阻尼器；见图
    3-3。所述诱导弹簧用于将实际系统拉向期望值，而诱导阻尼器用于使实际系统在该值处停止。如果只有诱导弹簧而没有诱导阻尼器，实际系统将不会停止，而是会在期望值（误差的零值）附近持续振荡。


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Fig3_HTML.jpg](img/504209_1_En_3_Fig3_HTML.jpg)


    **图 3-3** PD 控制器的物理类比


    另一个有用零值是二阶微分方程或质量-弹簧-阻尼器系统，也称为阻尼谐振子，条件是项 `M`、`B` 和 `K` 为正。其推导过程不太直观，属于线性控制和微分方程教材的内容。然而，就本书的目的及在给定条件下，我们只需假设该系统也是一个有用零值。


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figj_HTML.jpg](img/504209_1_En_3_Figj_HTML.jpg)


    就控制而言，需要强调的是，PID 控制器的行为类似于所述质量-弹簧-阻尼器系统（至少在数学上是如此，因为在实现过程中存在物理上的考量，例如使用微分器而非积分器带来的影响）。


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figl_HTML.jpg](img/504209_1_En_3_Figl_HTML.jpg)


    了解了有用零值概念后，让我们继续学习控制器。我们将从机器人模式控制器开始。

    '
- fmt: '# Robot Mode Control


    If the drone is analyzed as a robot, the control design will involve seeing it
    as if it was controlled by a third person or as an external view. For these purposes,
    the control objective will be to move a reference point of the quadcopter to a
    given three-dimensional location with or without a regulated orientation. See
    Figure [3-4](#504209_1_En_3_Chapter.xhtml#Fig4).


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Fig4_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Fig4_HTML.jpg)


    Figure 3-4: Robot mode control of a drone seen as a third person task


    It’s time to explain the robot mode control called linear Cartesian control with
    no yaw variation.


    ## Fully Linear Cartesian Control with No Yaw Variation


    This is a simple and very basic controller that allows an operation like the one
    shown in Figure [3-5](#504209_1_En_3_Chapter.xhtml#Fig5), which simply consists
    of following a path without altering the orientation of the drone. This is useful,
    for example, in planting or in house-painting patterns. Let’s describe its independent
    and dependent dynamics modules.


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Fig5_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Fig5_HTML.jpg)


    Figure 3-5: Graphic description of a fully linear Cartesian control with no yaw
    variation


    ### Control of the Independent Dynamics


    Let’s return to the linearized dynamic model of a drone by separating the dynamics
    that have no dependence on the other variables (observe that this is done with
    respect to the motion variables in which you can identify three positions and
    three orientations). So we have


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figm_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figm_HTML.jpg)


    Note that the dependence on the `X` and `Y` dynamics is with respect to the dynamics
    of the `theta` and `phi` angles. Therefore we isolate the equations that do not
    have an interaction with other equations, that is, those of `psi` and `Z`. Note
    that `psi` differs from the desired `psi` due to the fact that the latter one
    is a constant value or a trajectory, and in the case of our example the desired
    `psi` will be equal to zero.


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Fign_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Fign_HTML.jpg)


    If the thrust force in `Z` is proposed as follows


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figo_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figo_HTML.jpg)


    where


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figp_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figp_HTML.jpg)


    when replacing it into the dynamic model and particularly into the `Z` equation,
    we will have the following:


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figq_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figq_HTML.jpg)


    This becomes a useful zero or damped harmonic oscillator.


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figr_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figr_HTML.jpg)


    And as long as the gains satisfy at least being positive along other criteria
    found in linear control books, we know that


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figs_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figs_HTML.jpg)


    Furthermore, it is demonstrated by control theory that if the desired value is
    a constant or a function whose maximum absolute value can be limited by a constant
    (a sine or a cosine for example),


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figt_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figt_HTML.jpg)


    a similar reasoning can be applied with a `PID` controller. You can develop the
    demonstration on your own as an exercise.


    This also implies that


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figu_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figu_HTML.jpg)


    and consequently


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figv_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figv_HTML.jpg)


    We will use this result soon.


    On the other hand, in practice and simulation, there are people who simplify the
    proposed thrust control as follows:


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figw_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figw_HTML.jpg)


    And it will work if the differential and proportional gains are big enough, by
    the following considerations:


    1. If the flight accelerations are small (which comes from the assumption that
    we made about smooth flight).


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figx_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figx_HTML.jpg)


    2. If the mass is constant or bounded by a constant, it can be absorbed by the
    proportional and differential gains (one constant multiplied by other constant
    produces another constant):


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figy_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figy_HTML.jpg)


    Let’s continue with the equation related to `psi` (yaw variable).


    In this case, the control value can be defined as


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figz_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figz_HTML.jpg)


    When this control is replaced into the yaw model, it leads to the following:


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figaa_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figaa_HTML.jpg)


    Again, if the controller gains are at least positive and satisfy the other guidelines
    described in automatic control textbooks, we will have a useful zero or a mass
    spring damper system, which implies that


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figab_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figab_HTML.jpg)


    considering again the smooth flight conditions (small accelerations) and the constant
    values absorption. As deduced for the variable `Z`, we will have the following:


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figac_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figac_HTML.jpg)


    Now, we proceed to control the dependent dynamics.'
