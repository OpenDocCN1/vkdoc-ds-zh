    Guille，她不幸未能打破自己 100 岁的个人纪录。最后，我感谢医生、护士、救援人员、食品和服务提供者、研究人员以及所有公共安全团队的宝贵帮助，他们是真正的英雄，在整个人类面临真正艰难的时刻，他们冒着自身安危支持着我们。特别地，本书献给所有那些已不在我们身边，但对我们成长和生活产生了深远影响的人，包括我的另一位祖母
