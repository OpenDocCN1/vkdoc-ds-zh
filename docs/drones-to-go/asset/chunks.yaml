  trans: "\n### UART 校验\n\n在这种情况中，会丢弃错误信息，最简单的算法是校验和，其改进版本是异或校验和。\n\n下面从十进制角度进行简单说明。\n\
    \n假设发送以下数据：\n\n- `val1Send = 50`\n- `val2Send = 30`\n\n要发送的第三个值可以是前两个值的和（校验和算法的求和部分）：\n\
    \n`valsumSend = val1 + val2 = 80`\n\n接收方应收到相同的数据：\n\n- `Val1Rec = 50`\n- `Val2Rec\
    \ = 30`\n- `valSumRec = 80`\n\n然后构建算法的校验部分：\n\n`Check = Val1Rec + Val2Rec = 80`\n\
    \n这样，`Check` 和 `valSumRec` 相同，说明这是一组有效的数据。\n\n现在假设接收方读取到了一个错误的值：\n\n- `Val1Rec\
    \ = 20`\n- `Val2Rec = 30`\n- `valSumRec = 80`\n\n我们再次构建校验部分：\n\n`Check = Val1Rec\
    \ + Val2Rec = 50`\n\n这样，`Check` 与 `valSumRec` 不同，这组数据会被丢弃，或者要求重新发送信息。\n\n可以看出，校验和算法存在几个重要问题：\n\
    \n1.  总和可能超过 `255` 的值，此时需要将数字分成两组或多组数据来发送。\n\n2.  错误数据的求和结果可能恰好得到一个正确的校验值。\n\n\
    例如，发送方写入：\n\n- `val1Send = 50`\n- `val2Send = 30`\n- `valsumSend = val1 + val2\
    \ = 80`\n\n接收方读取：\n\n- `Val1Rec = 60`\n- `Val2Rec = 20`\n- `valSumRec = 80`\n\n\
    由于校验结果仍等于 `80`，这个错误的数据包将不会被丢弃。\n\n3.  数据本身正确到达，但校验和部分损坏了。\n\n发送方写入：\n\n- `val1Send\
    \ = 50`\n- `val2Send = 30`\n- `valsumSend = val1 + val2 = 80`\n\n接收方读取：\n\n- `Val1Rec\
    \ = 50`\n- `Val2Rec = 30`\n- `valSumRec = 10`\n\n由于 `check = 80` 的值与 `valSumRec`\
    \ 不同，尽管数据正确到达，信息仍会被丢弃。\n\n为了减少这些问题（至少是溢出问题），会使用二进制校验和。其中一种是异或校验和（C++ 中的 `^` 运算符）。请注意，其余问题仍然存在。\n\
    \n如果你想发送一个超过 255 的和值，例如 `520`，首先要进行二进制转换：\n\n`1000001000(bin) = 520(dec)`\n\n\
    之后，逐位进行异或加法：\n\n`(1) xor (0) xor (0) xor (0) xor (0) xor (0) xor (1) xor (0) xor\
    \ (0) xor (0) = 0`\n\n因此，要发送的附加数据就是简单的 `0`。\n\n例如：\n\n- `Val1Send = 250`\n- `Val2Send\
    \ = 250`\n- `Val3Send = 20`\n- `ValSum = 520`\n\n`ValSum` 无法直接发送，但可以发送其二进制分量的异或和：\n\
    \n`XORSend = (1) xor (0) xor (0) xor (0) xor (0) xor (0) xor (1) xor (0) xor (0)\
    \ xor (0) = 0`\n\n接收方读取：\n\n- `Val1Rec = 250`\n- `Val2Rec = 10`\n- `Val3Rec =\
    \ 20`\n- `XORRec = 0`\n\n然后，构建校验值：\n\n`Check = Val1Rec + Val2Rec + Val3Rec = 280`\n\
    \n对 `Check` 的二进制分量进行异或求和：\n\n`100011000(bin) = 280(dec)`\n\n`XORCheck = (1) xor\
    \ (0) xor (0) xor (0) xor (1) xor (1) xor (0) xor (0) xor (0) = 1`\n\n由于结果与 `XORRec`\
    \ 不同，数据会被丢弃或要求重新发送。\n\n### 轮流协议\n\n在这种情况中，会发送额外的信息来指示在通信过程中哪些设备是接收方，哪些是发送方。该算法包括发送和评估一个逻辑值。这意味着有两架或多架搭载通信设备的无人机；所有无人机都有一个充当交通灯或标志的变量。其中一架无人机的该变量处于\
    \ ON 状态，其他无人机处于 OFF 状态。只有初始状态为 ON 的无人机能够写入数据，而其他无人机则处于读取状态。一旦初始状态为 ON 的无人机完成操作，它会将其标志或信号量更改为\
    \ OFF。当团队中的其他成员读取到初始发送方的标志变为 OFF 时，它们会启动一个序列，以确定下一个将自己的标志变为 ON 的无人机。这一过程可以循环重复、交替进行，或者只执行一次。基本上，这就像一次礼貌的交谈，每位参与者询问或轮换自己的发言权，同时等待正在发言的人结束。\n\
    \n### 通用 UART 算法\n\n结合上述操作，用于 UART 通信的通用算法如下。（每种操作的具体外观已加下划线；请注意校验和是一种共享操作。为了改进此序列，每个过程可能依赖于一个定时器来加速或确保其执行，或者只是为了避免延迟。）\n\
    \n1.  检查通信设备的标志位或轮次。\n\n2.  如果当前轮次涉及写入：\n    *   将要发送的信息分割成 8 位段。此信息被分成两部分：模数和商数。\n\
    \    *   计算所有待发送信息的总和，然后从结果中获取其二进制分量的异或和。\n    *   验证信道是否可用。\n    *   发送信息。\n\
    \    *   清空用于写入的变量，以便后续使用。\n    *   将标志状态更改为读取。\n\n3.  如果当前轮次涉及读取：\n    *   读取接收到的数据。\n\
    \    *   执行异或校验，然后与接收到的校验和进行验证。\n    *   如果两者不匹配，设计者将规定后续步骤，可能包括丢弃信息或要求重新发送信息。\n\
    \    *   如果两者匹配，则通过指定的位移和 OR 运算重建信息。\n    *   清空用于读取的变量，以便后续使用。\n    *   将标志状态更改为写入。\n\
    \n4.  该过程将无限期持续，直到用户、代码或电源中断通信。\n\n现在你已经了解了控制、信号处理和 UART 通信，接下来的章节将指导你如何为无人机编写代码。首先，我们将向你展示可用于编程无人机的环境。\n\
    \n## 无人机编程的可用方法\n\n目前，有两种方式可以为你的无人机编写代码：GUI 和 SDK。\n\n### GUI（图形用户界面）\n\nGUI 是一种简化且高度可视化的界面，专为编程技能有限或为零的用户设计。\n\
    \n在这种情况下，这是一个图形用户界面。许多用于编程无人机的封闭架构都包含这样一种界面。这些封闭架构的特点是允许用户修改基本参数，例如要遵循的路径、预加载控制器的增益以及传感器和执行器的基本校准。更专业的任务对用户是封闭的。一些最常用的\
    \ GUI 包括 Mission Planner 和 LibrePilot。\n\n### SDK（软件开发工具包）\n\nSDK 是一个软件开发工具包。在所有情况下，用户都需要掌握一种编程语言。\n\
    \n#### SDK 一级\n\n对于 SDK 一级，非无人机控制或机器人学专业用户也可以为娱乐以外的目的对无人机进行编程。该架构并非完全开放，仅允许用户以类似于将飞行器视为一个能够在\
    \ X、Y、Z 方向上移动并绕其 Z 轴旋转的粒子的方式，设计一些高级控制器。请参见图 5-9。\n\n最著名的例子之一是基于 Python 的 Dronekit\
    \ SDK。在这种类型的 SDK 中，用户只能修改 X、Y、Z 和偏航的期望参考值，或它们的速度。用户无法对推力和无人机力矩，当然也无法对分配矩阵进行任何操作。\n\
    \n![../images/504209_1_En_5_Chapter/504209_1_En_5_Fig9_HTML.jpg](img/504209_1_En_5_Fig9_HTML.jpg)\n\
    \n图 5-9 SDK 一级\n"
- fmt: '#### SDK Level 2


    The architecture in SDK Level 2 is a little more open and allows control of the
    vehicle at the force-torque level. That is, it allows users who are familiar with
    drone control and robotics to incorporate their own algorithms and controllers
    into predesigned vehicles that are compatible with the SDK. One of the best known
    examples is the Parrot Bebop-autonomy SDK based on `C++`, and also a flight mode
    of the PX4 libraries.


    In this type of SDK, the user can only modify the thrust force and the torques
    of a drone. Nothing can be done about the allocation matrix. See Figure [5-10](#504209_1_En_5_Chapter.xhtml#Fig10).
    As the thrust force and the drone torques are a function of a spatial reference
    (X, Y, Z, and yaw), this SDK has a higher level than the type 1 SDKs.


    ![../images/504209_1_En_5_Chapter/504209_1_En_5_Fig10_HTML.jpg](images/504209_1_En_5_Chapter/504209_1_En_5_Fig10_HTML.jpg)


    Figure 5-10


    SDK level 2


    #### SDK Level 3


    SDK Level 3 is totally open and allows the user to control the vehicle at motor
    level; see Figure [5-11](#504209_1_En_5_Chapter.xhtml#Fig11). It also allows programming
    their own communication protocols, incorporating their own sensors, monitoring
    their parameters of interest, and more. In short, it allows the user to design
    their own vehicles, even if these vehicles have no precedent. The best known examples
    are the Ardupilot libraries and the PX4 libraries based on `C++`.


    In this type of SDK, the user must provide the allocation matrix, which is a function
    of the thrust torques and the forces of the drone, which in turn are a function
    of the desired position and orientation values. Therefore this kind of SDK has
    a higher level than type 2 and 1 SDKs.


    ![../images/504209_1_En_5_Chapter/504209_1_En_5_Fig11_HTML.jpg](images/504209_1_En_5_Chapter/504209_1_En_5_Fig11_HTML.jpg)


    Figure 5-11


    SDK level 3


    You learned where to code, but what about how to code? This is introduced in the
    next section.


    ## Some Useful Commands Available in Most SDKs


    The following are the most employed commands to program aerial drones, and any
    other type of vehicle in general. They are found in three of the most used SDKs:
    Ardupilot, PX4, and Dronekit. These commands are presented in a thematic way and
    are compatible with `C++`, `C++` for ROS, and Python, respectively (although these
    SDKs have variants for other programming languages, operating systems, and computational
    architectures). A detailed description and examples can be found in the official
    webpages or in my book *Advanced Robotic Vehicles Programming* described in the
    reference section in the Appendix. With regard to the aforementioned libraries,
    it must be indicated that the only one that allows the user to incorporate real-time
    tasks is Ardupilot, the simplest to use is Dronekit, and the one that has multiple
    compatibilities because is based on ROS is PX4, which as a disadvantage has limited
    and not very understandable documentation (at least up to now).


    ### Official Webpages


    Ardupilot


    [`http://ardupilot.org/dev/docs/apmcopter-programming-libraries.html`](http://ardupilot.org/dev/docs/apmcopter-programming-libraries.html)


    Dronekit


    [`https://dronekit-python.readthedocs.io/en/latest/`](https://dronekit-python.readthedocs.io/en/latest/)


    Px4


    [`https://dev.px4.io/master/en/index.html`](https://dev.px4.io/master/en/index.html)


    ### Input Commands


    Ardupilot keyboard input (serial monitor):


    ```

    hal.console->read()

    ```


    Ardupilot remote control input:


    ```

    hal.rcin->read()

    ```


    Dronekit keyboard input:


    ```

    input() or raw_input()

    ```


    Dronekit remote control input:


    ```

    vehicle.channels[channel]

    ```


    PX4 message for keyboard input:


    ```

    PX4_INFO

    ```


    PX4 message for remote control input:


    ```

    manual_control_setpoint.msg

    ```


    ### Output Commands


    Ardupilot user output (serial monitor):


    ```

    hal.console->printf()

    ```


    Dronekit user output:


    ```

    Print

    ```


    PX4 message for user output:


    ```

    PX4_INFO

    ```


    ### Sensor Commands


    Ardupilot analog reading:


    ```

    ch =hal.analogin->channel(channel)

    read=ch->voltage_average()

    ```


    Ardupilot digital reading:


    ```

    hal.gpio->read(pin)

    ```


    Ardupilot GPS reading (XYZ positions and velocities):


    ```

    inertial_nav.get_position()

    inertial_nav.get_velocity();

    ```


    Ardupilot attitude reading (orientations and angular velocities):


    ```

    ahrs

    ins.get_gyro()

    ```


    Ardupilot barometer’s altitude:


    ```

    barometer.get_altitude()

    ```


    Dronekit analog reading:


    Indirect, for example, analog ports on Raspberry Pi


    Dronekit digital reading:


    Indirect, for example, digital ports on Raspberry Pi


    Dronekit GPS reading (XYZ positions and velocities):


    ```

    vehicle.gps_0

    vehicle.velocity

    vehicle.location

    ```


    Dronekit attitude reading:


    ```

    vehicle.attitude

    ```


    PX4 message for analog reading:


    ```

    adc_report.msg

    ```


    PX4 message for digital reading:


    ```

    gpio_led start

    ```


    PX4 messages for GPS reading (XYZ positions and velocities):


    ```

    vehicle_gps_position.msg

    vehicle_odometry.msg

    ```


    PX4 messages for angular positions and velocities:


    ```

    vehicle_odometry.msg

    sensor_combined.msg

    ```


    ### Actuator Commands


    Ardupilot digital writing:


    ```

    hal.gpio->write(pin,value)

    ```


    Ardupilot writing to motors and servos (PWM RC for brushless or brushed motors):


    ```

    hal.rcout->write()

    ```


    Dronekit digital writing:


    Indirect, for example digital ports on Raspberry Pi


    Dronekit vehicle writing (not to the motors because of the SDK type):


    ```

    send_ned_velocity(vx,vy,vz,time)

    ```


    PX4 message for writing to motors or to the vehicle (PX4 is a SDK type 1, and
    a type 3):


    ```

    actuator_controls.msg

    for writing to a vehicle

    actuator_direct.msg

    test_motor.msg

    for writing to the motors

    ```


    ### Signal Processing Commands


    Ardupilot noisy signals filtering:


    ```

    LowPassFilter2pfloat filtername(parameters)

    filtername.apply(signal);

    ```


    Dronekit noisy signal filtering:


    Indirect through specialized Python libraries


    PX4 procedure


    ```

    https://dev.px4.io/v1.9.0/en/middleware/modules_estimator.html

    ```


    ### Communication Commands (Wired and Wireless)


    Ardupilot serial communication:


    ```

    hal.uart#->write()

    hal.uart#->read()

    with #=A,B,C,D

    ```


    Dronekit serial communication:


    Indirect by using Python libraries and Raspberry ports


    PX4 procedure


    ```

    https://mavlink.io/en/

    ```


    ### Time Commands


    Ardupilot current time, delays, and real-time:


    ```

    hal.scheduler->millis(),micros()

    hal.scheduler->delay()

    scheduler.run(time)

    ```


    Dronekit current time, delays, and real-time:


    Python time commands, for example `time.sleep(time)`


    Real time is not possible by using these libraries


    PX4 (there is no way to generate a real time scheduler)


    ```

    hrt_absolute_time();

    ```


    ### Miscellaneous Commands


    Ardupilot onboard memory storage:


    ```

    DataFlash.WriteBlock(package,size)

    ```


    Ardupilot battery monitor:


    ```

    battery.read( )

    ```


    Dronekit memory storage:


    Based on Python, for example `file.write` or MAVLINK commands


    Dronekit battery monitor:


    ```

    vehicle.battery

    ```


    PX4 procedure for using the onboard memory:


    ```

    https://dev.px4.io/v1.9.0/en/log/ulog_file_format.html

    ```


    PX4 message for using the battery monitor:


    ```

    battery_status.msg

    ```'
