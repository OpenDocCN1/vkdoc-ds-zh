    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figcy_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figcy_HTML.jpg)


    In this case, since we have a scalar and we need to design a three-dimensional
    orientation control, we need a way to obtain a three-dimensional vector from said
    distance definition. Remember that having defined the distance between our measured
    matrix and the desired matrix, we must generate three errors from it in order
    to generate the three torques of the vehicle.


    One way is by applying the concept of directional derivative (here we will use
    a type of directional derivative called a trivialized right derivative) and considering
    that our distance is a scalar function of several variables, when we derive directionally
    we will obtain a vector expression in a similar way as when we applied the gradient
    (`nabla`) to the distance between two vectors.


    The trivialized right derivative is widely used in this type of controller, but
    given its complexity of interpretation, we will only use it as a tool. For more
    information about it, see the documents of Bullo and Taeyoung Lee in the Appendix.
    It should be noted that the value of `1/4` is used here for convenience in a way
    such that the final result is expressed in terms of `1/2` and this is particularly
    useful in nonlinear control to eliminate constant values through matrix properties
    or derivatives. However, you can use any other multiplier. The result only alters
    the values to be dragged during the procedure.


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figcz_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figcz_HTML.jpg)


    Observe three things:


    - In the case of the trace, because it is a linear operation, the derivative of
    the trace is the trace of the derivative.

    - Also, we use the fact that the generic derivative of a rotation matrix produces
    the rotation matrix multiplied by a skew-symmetric matrix (`S`). However, note
    that said antisymmetric matrix is not the same as the previous one described in
    Chapter [2](#504209_1_En_2_Chapter.xhtml). This is because that was a derivative
    with respect to the time and this is a derivative with respect to the direction
    of change. However, an antisymmetric matrix dependent on the rate of change (`n`)
    is generated.

    - Finally, note that the derivative of the identity matrix is zero, and that the
    remaining derivative only affects the term of the rotation matrices, where `Rd`
    is considered as a “constant” because it is independent of `R` (this derivative
    is done with respect to `R`).


    In summary, the following properties were used:


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figda_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figda_HTML.jpg)


    The term `S(n)` is a representation that indicates the presence of a vector `n`
    that is transformed to a skew matrix in order to avoid the use of cross products
    and to allow the use of matrix products.


    From now on, we will use the notations `hat` and `vee`. A notation equivalent
    to `S(n)` is the `hat` operator, which implies obtaining a skew matrix from a
    vector.


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figdb_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figdb_HTML.jpg)


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figdc_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figdc_HTML.jpg)


    If you look carefully, you can see that we do not yet have a vector that we can
    use, since the trace is a scalar and even the product on which the trace is being
    applied is a matrix.


    However, there are three useful facts.


    The first is that the following identity exists:


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figdd_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figdd_HTML.jpg)


    For this, we use the operator `vee`, which is the inverse of the operator `hat`
    and implies obtaining a vector from a skew matrix:


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figde_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figde_HTML.jpg)


    The second is that the following matrix and in general any other matrix can be
    decomposed as the sum of a skew part and a symmetric part as follows:


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figdf_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figdf_HTML.jpg)


    In this way:


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figdg_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figdg_HTML.jpg)


    The third fact is that the trace of the product of a symmetric matrix by a skew
    symmetric one is zero, so only the trace of the product of the skew matrices survives:


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figdh_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figdh_HTML.jpg)


    Using the equality that relates the trace of the product of two antisymmetric
    matrices to the dot product of their equivalent `vee` vectors, we have that:


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figdi_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figdi_HTML.jpg)


    Finally, the error vector that we are looking for is this:


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figdj_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figdj_HTML.jpg)


    To formulate our attitude control (also known as orientation control), in addition
    to the orientation error component (in this case given by rotation matrices, which
    serves to incorporate a proportional part), an angular velocity component is required
    (to incorporate a derivative part). This is done in the following way.


    A first attempt is to propose:


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figdk_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figdk_HTML.jpg)


    Simple logic indicates that these angular velocities (the measured one and the
    reference one) are vectors, and what is explained in this equation could be directly
    applied:


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figdl_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figdl_HTML.jpg)


    However, the desired angular velocity and the measured one cannot be directly
    subtracted since they lie within different spaces. In this way, we will use a
    deduction based on the derivatives of the rotation matrix. See Figure [3-18](#504209_1_En_3_Chapter.xhtml#Fig18).


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Fig18_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Fig18_HTML.jpg)


    Figure 3-18 Graphic representation of the spaces where the desired and real rotation
    matrices derivatives lie.


    In a simplified way, we indicate that the speed of a rotation matrix is tangential
    to itself. Note that neither the rotation matrix nor its derivative are vectors
    but matrices, although we can use their eigenvectors in order to imagine and represent
    them graphically. A mathematical proof of the perpendicularity of the derivative
    of a rotation matrix with respect to its rotation matrix is given by the equation
    of the derivative of a rotation matrix in which appears a skew-symmetric matrix
    depending on the angular velocity, and because this antisymmetric matrix is the
    equivalent of a cross product, the result is an orthogonal matrix.


    From the fact that the desired rotation matrix does not lie within the same space
    as the measured rotation matrix, it is necessary to do the process shown in Figure
    [3-19](#504209_1_En_3_Chapter.xhtml#Fig19).


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Fig19_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Fig19_HTML.jpg)


    Figure 3-19 Graphic sequence for homologating the rotation matrices derivatives.


    The result of this graphic sequence produces the following equation:


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figdm_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figdm_HTML.jpg)'
