  raw: 'This implies that we require four equations to calculate the four coefficients.
    To avoid problems and confusion with the letters, we will continue the example
    with the X variable, but you should repeat it for all other variables.


    We have two equations, one that depends on the final position and the other that
    depends on the initial position. Note that it is necessary to evaluate at the
    initial time and at the final time, so the maximum speed of the vehicle is considered
    here.


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figfw_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figfw_HTML.jpg):


    The other two equations are generated with the initial and final velocities. For
    this, we see that the derivative or the speed profile of our polynomial is


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figfx_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figfx_HTML.jpg)


    And therefore the equations with the initial and final velocities are


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figfy_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figfy_HTML.jpg)


    Note that the coefficients of these polynomials must be recalculated as the initial
    and final points change. It is convenient to rewrite our four equations with four
    unknowns in matrix mode:


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figfz_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figfz_HTML.jpg)


    And the calculation of the polynomial will be updated in this way:


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figga_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figga_HTML.jpg)


    In each new calculation, the starting position value, the starting speed, and
    the starting time must be taken from the previous final values. If we also want
    to include initial and final accelerations, the polynomial must be the fifth order.


    Where is the maximum speed of the vehicle included?


    Observe that the maximum speed value on the X axis can be approximated by


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figgb_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figgb_HTML.jpg)


    Position values are unalterable as they define our starting and final points.
    Another thing that we cannot alter is the initial time, so we can only modify
    the final time according to our maximum speed:


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figgc_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figgc_HTML.jpg)


    In this way, our design can do the following:


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figgd_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figgd_HTML.jpg)


    As the vehicle does not generate more speed than that produced by its motors,
    the final time could be affected and this distorts the desired polynomial trajectory.
    To counteract this effect, a higher order polynomial can be used to introduce
    acceleration profiles, or these calculations can be avoided by working with exceeded
    values in this way:


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figge_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figge_HTML.jpg)


    For defining attitude paths, depending on whether the used tools are directly
    Euler angles, quaternions, rotation matrices, etc., there are more considerations.
    Some of them can be found in the book of Peter Corke indicated in the Appendix,
    also at [`https://robotacademy.net.au/masterclass/paths-and-trajectories/`](https://robotacademy.net.au/masterclass/paths-and-trajectories/),
    and finally in the book of modern robotics by Lynch and Park.


    Finally, we will mention that the PD represents by itself a smooth polynomial
    of infinite order at the error level (a point-to-point tracking, where the starting
    point is the measured value and the final point the desired value), so a PD control
    could be performed without defining polynomial paths.


    This is because the PD equation has an associated exponential behavior


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figgf_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figgf_HTML.jpg)


    and an exponential function, which according to the Taylor series is a nth order
    polynomial (much larger than a third, fifth, or higher order approximation)


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figgg_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figgg_HTML.jpg)


    However, there is no way to regulate the final time (this can be done with polynomial
    trajectories) unless there is something additional controlling the proportional
    and derivative gains of the PD based on the final time. This could be achieved
    with intelligent algorithms or with the TBG (time base generator) controller.
    See the concept of TBG in Parra’s article in the Appendix. Additionally, as already
    said, the PD is based on an error that depends on two values. For this reason,
    it can only be applied at point-to-point tracking, while trajectory planning,
    according to the algorithm, also allows generating a trajectory that covers more
    than two points. In summary, see Table [3-1](#504209_1_En_3_Chapter.xhtml#Tab1).


    Table 3-1


    Type of Desired Values and Their Characteristics


    | Type of desired value | Use |

    | --- | --- |

    | Constant | Regulation tasks where it is desired to stay indefinitely at a constant
    value (hovering drone tasks, for example) |

    | Time-dependent trajectory | Tasks where the trajectory has a slow and smooth
    evolution with respect to the maximum speeds or accelerations of the vehicle |

    | Point-to-point or multi-point trajectory by using n-th order polynomials (or
    other methods based on trigonometric functions) | Tasks where the trajectory cannot
    be defined by known functions, or where there is an abrupt evolution of the path
    causing sudden performances on the speed or the acceleration of the vehicle, or
    where the designer wants to restrict the speed, acceleration, or their derivatives
    with respect to the maximum values that the vehicle can reach |


    ## Summary


    In this chapter, you learned useful concepts on control theory related to drones.
    In this case, the concepts were also applied to quadcopters but they are widely
    used in other types of aircraft. You explored two families of controllers, those
    of the vehicle kind and those of the robot type. In both cases, we presented four
    of the most used controllers in articles and books: the linear control, the variable
    yaw control, the spherical dynamic compensation controller, and the geometric
    control. With all of them you will be able to design from smooth operations to
    acrobatic flight modes. The chapter concluded with notions about trajectory planning.
    In the next chapter, you will learn details about drone simulation.


    # 4. Simulation


    This chapter has both maker and scientific impacts. It will show you a topic discarded
    in practically all the books and available references, and which consists of the
    generic simulation of drones. In this particular case, we will use the MATLAB/Simulink
    tools due to their popularity and simplified use among the scientific community,
    but the knowledge is extendable to any other programming environment, including
    open source simulators. The approach is based on the use of state-space variables
    and a graphic representation through processing blocks. As a result, you will
    be able to design your own vehicles by using software tools and also to extend
    this type of knowledge to other robots.'
