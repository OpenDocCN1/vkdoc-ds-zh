  trans: '

    # 无人机的任务


    无人机有六个基本任务：


    - **电机**：这是最基本也是最重要的任务。通常，它由一个自动开环控制组成，该控制是飞行器其他闭环控制器的函数。每个电机的速度都会被调整，从而影响无人机的行为。该任务呈现最快的变化，因此需要高频更新。电机必须以自动方式接收推进或分配矩阵。


    - **姿态或方向**：这是第二重要的任务（在执行频率上也是如此）。它比高度任务更重要，因为它意味着飞行器得到了充分的平衡。如果情况并非如此，无人机可能会在平面上随机移动，最坏的情况下会坠落。由于其在飞行器飞行中的重要性，它通常是一个全自动的闭环控制。


    - **高度或仰角**：这在重要性上排在第三位，因为任何飞行器都意味着能够悬浮。因此，具有入门知识的人认为这个任务是最重要的，但正如我们已指出的，不平衡往往会导致无人机失稳。它通常是一个自动的闭环控制，但您可以通过遥控器赋予它半自动行为。


    - **平面位置**：这在相关性上排在第四位。它涉及控制无人机的位置，该位置垂直于仰角轴（飞行器在地面上保持的位置）。这个任务也可以是自动或半自动的。


    - **轨迹规划**：在这种情况下，这是姿态、高度和平面位置任务的同步变化。这种变化根据时间或特定的点到点路径来执行。它可以是自动或半自动的。基本上，它是通过一系列点的导航。


    - **遥控**：这是飞行任务中的人为组成部分。它是一个人类闭环控制，因为飞行员是根据其视觉提供的测量值以及控制按钮的动作来调节误差的人。由于动作依赖于人，该任务与飞行员的能力一样缓慢且不精确。它与其他任务结合使用，赋予了它们半自动模式。在某些情况下，飞行员只改变期望值，在其他情况下则直接修改控制效果。不建议遥控直接修改方向任务（按钮和摇杆的动作比所需的自动姿态动作更慢且更突兀）。


    现在您了解了无人机的任务，我们来谈谈它们所使用的控制器类型。


    # 无人机的控制回路与控制器类型


    四轴飞行器是一个很好的例子，可以用来描述各种类型的控制器和控制回路。这些将在以下章节中介绍。


    ## 控制回路


    ### 开环与闭环


    通常，无人机的高度、平面位置和方向都是闭环控制，这意味着它们的误差修正基于反馈。然而，有一个任务依赖于开环控制，即电机的速度控制。开环控制是指任务的执行更多取决于比例效应，而不是误差修正。在电机的情况下，发送一个电压，我们观察到与之成比例的电机的速度，而没有闭环来验证和修正这个速度。


    ### 内环与外环


    四轴飞行器有四个电机，并且由于它们的几何构型，可以直接控制四个变量：高度和姿态（其三个方向）。这被称为内环。然而，由于需要飞行器也能在 XY 平面上移动，这在外环控制回路中依赖于横滚和俯仰方向来实现。


    ### 相关回路与独立回路


    独立回路出现在所有其控制不需要监控额外变量的变量中；例如高度控制和偏航控制。另一方面，相关回路需要一个或多个额外变量的信息；例如依赖于飞行器方向的 X 和
    Y 控制。


    ### 位姿回路与速度回路


    四轴飞行器是一个其位姿回路（方向和位置）依赖于每个电机速度开环控制的飞行器。伺服电机是位姿执行器，而无刷直流电机通常是速度执行器。


    ## 控制器类型


    ### 无模型与有模型控制器


    某些变量，如横滚、俯仰和偏航方向，可以用一个“简单的”PD 控制器来调节。这意味着不需要对其部分或全部动力学进行补偿。另一方面，在控制高度时，需要引入一个针对飞行器重量的补偿元件（一个部分有模型控制器）。


    ### 鲁棒控制器与自适应控制器


    在使用没有任何补偿的 PD 控制器来调节变量的情况下，假设 PD 控制器相对于飞行器动力学足够强大。在这种情况下，这种控制被称为主控或鲁棒控制（只要电机允许这种鲁棒性）。鲁棒控制器的另一个例子是滑模控制系列。它们基本上不需要系统的模型，只需要误差回路。对于高度，由于重量被补偿，这是一个非常初步的自适应控制例子。然而，如果
    PD 增益足够大并且电机能够自行抵消这种效应，则可以省略补偿项。通常，自适应控制器被设计用于补偿部分或全部动力学，或者未建模的扰动。


    ### 无限制控制与有限制控制


    无限制控制是指可以使用无限范围数值的控制，例如所有正数和负数。这种控制实际上并不存在，但您可以认为由于仿真器的存在，它是一个可行的选项。另一方面，有限制控制器则引入了操作限制。在四轴飞行器中发现的第一个有限制控制是由电机提供的，因为它们具有速度和扭矩的最大值和最小值。第二个有限制控制在使用无刷电机时非常明显（假设它们不是双向的），即其操作值只能是正数。最后一个在无人机中不那么明显的有限制控制，由物理效应（如响应时间）决定。


    对于第一种限制，会使用饱和函数。对于第二种，需要缩放因子。对于第三种，则采用延迟控制技术。最后一种效应在普通无人机上并不那么明显，因为自动驾驶仪和计算机的响应速度快，通常会被忽略，但在使用双向螺旋桨的飞行器上，考虑这些延迟是相关的，因为螺旋桨不会瞬时改变其旋转方向。


    ### 线性控制与非线性控制


    这种控制类型由操作条件决定。您看到过一些飞行模式，其中运动平稳，角度被限制在零附近的一个小范围内，因此将模型和控制器都线性化是一个正确的决定。然而，我们也描述了一些飞行模式，其中角度不受限制，飞行器可以执行激进运动；因此，控制器和模型都具有非线性特性。


    ### 连续操作控制与基于事件控制


    在这种情况下，始终连续且必须在飞行器整个运行过程中都存在的控制是姿态控制器。而依赖于事件（如基于时间的信号或与遥控器的交互）的控制是轨迹控制。

