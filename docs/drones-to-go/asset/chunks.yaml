  trans: '

    # 仿真器类型


    我们有四种仿真器：


    - **带符号的数字仿真器**：它们只需要方程，具体来说是系统的数学模型及其控制器。这类仿真器是任何能够求解这些方程的程序。根据模型的复杂程度，程序可能能够或无法求解。以无人机为例，可以使用标准编程语言（如编写求解常微分方程的数值算法，例如欧拉法、`RK4`
    等）来实现。这种仿真器至少需要两个代码部分：求解器和待求解的系统。


    - **带模块的数字仿真器**：与上一种情况类似，但它不是用符号表示方程和控制器，而是采用基于模块的图形化表示。这是一种比符号编程更直观的编程形式，并且便于组件互联（除非组件数量众多）。已知的例子有
    `LabView`、`Simulink` 或 `Scilab/Scicos`。在使用模块的情况下，求解器本身就是命令接口，而待求解的系统则是一个包含示意图的文件。


    - **动画仿真器**：在这种情况下，它们是具有三维图形的界面，能够模拟一个系统。例如 `V-rep`、`Gazebo`，或 `Mission Planner`
    的图形用户界面及其虚拟的 `SITL`（软件在环）仿真器。通常，它们由两部分组成：动画对象及其世界，以及建模文件。许多这类仿真器都包含物理引擎，能够模拟风或气压等环境效应。


    - **交互式仿真器**：这里是指能够与上述任何类型的仿真器进行交互，或与硬件进行交互的能力。例如 `X-Plane`，或处于 `HITL`（硬件在环）模式的
    `Mission Planner`。


    在本文中，我们将重点讨论两种最易于使用（从安装角度来看）的仿真器：数字仿真器。当然，它们需要数学知识，但用户可以根据需要将其设计得简单或复杂。此外，许多仿真器可以按照下文所述的方法组合使用并进行交互。


    在确定了我们将使用哪种仿真器后，接下来我们继续介绍状态空间表示法，这是一种能让我们与仿真器协同工作的工具。


    # 状态空间表示法


    如果你有一个 `n` 阶微分方程，可以将其转化为 `n` 个一阶微分方程。这在仿真器中便于使用一个统一的积分模块，或者处理向量和矩阵运算，而非标量运算。


    ![../images/504209_1_En_4_Chapter/504209_1_En_4_Figa_HTML.jpg](img/504209_1_En_4_Figa_HTML.jpg)


    例如，回想一下质量-弹簧-阻尼系统是一个二阶系统：


    ![../images/504209_1_En_4_Chapter/504209_1_En_4_Figb_HTML.jpg](img/504209_1_En_4_Figb_HTML.jpg)


    这样一来，它将需要两个状态空间变量。在这种情况下，最方便的选择是选取那些相对于系统阶次而言阶次较低的变量作为状态空间变量。在这个方程中，我们选择位置和速度作为状态空间变量：


    ![../images/504209_1_En_4_Chapter/504209_1_En_4_Figc_HTML.jpg](img/504209_1_En_4_Figc_HTML.jpg)


    对变量求导后，我们得到了所需的表达式：


    ![../images/504209_1_En_4_Chapter/504209_1_En_4_Figd_HTML.jpg](img/504209_1_En_4_Figd_HTML.jpg)


    最后一个方程可以通过系统的原始方程求解：


    ![../images/504209_1_En_4_Chapter/504209_1_En_4_Fige_HTML.jpg](img/504209_1_En_4_Fige_HTML.jpg)


    代入状态空间变量后，结果如下：


    ![../images/504209_1_En_4_Chapter/504209_1_En_4_Figf_HTML.jpg](img/504209_1_En_4_Figf_HTML.jpg)


    这样，正如预期，只保留了这两个一阶方程。


    根据其动力学模型，一个四旋翼飞行器可以有十二个状态空间变量（六个二阶方程；请记住，其中三个方程与平动动力学有关，其余三个与转动动力学有关）：


    ![../images/504209_1_En_4_Chapter/504209_1_En_4_Figg_HTML.jpg](img/504209_1_En_4_Figg_HTML.jpg)


    如果我们按以下方式选择状态空间变量（这是一种可能的方案，交替选择位置和速度），我们得到：


    ![../images/504209_1_En_4_Chapter/504209_1_En_4_Figh_HTML.jpg](img/504209_1_En_4_Figh_HTML.jpg)


    同时还要注意，控制输入 `u` 有四个值。它们是推力以及三个力矩：


    ![../images/504209_1_En_4_Chapter/504209_1_En_4_Figi_HTML.jpg](img/504209_1_En_4_Figi_HTML.jpg)


    另一种可能的方案是先选择所有位置，再选择所有速度，或者简单地采用与这里所示不同的另一种顺序。无论选择哪种方案，在后续使用中都必须保持一致。


    对我们的仿真有用的第二个工具是模块表示法。下面我们就来讨论它。

    '
- fmt: '# Block Representation


    In this case, the blocks are a graphical representation of the state space variables.
    They are useful for making diagrams or for simulating with visual languages such
    as Simulink or Labview, which are designed to use blocks.


    Returning to the mass spring damper example and specifically its representation
    in state space variables, we can do the following to obtain its block representation.


    First, note that there are two state space equations, so two main blocks are required.
    These blocks represent integrators; see Figure [4-1](#504209_1_En_4_Chapter.xhtml#Fig1).
    In this example, we added labels to the states, which is a good practice for programming
    and understanding, but such labeling is not frequently done.


    ![../images/504209_1_En_4_Chapter/504209_1_En_4_Fig1_HTML.jpg](images/504209_1_En_4_Chapter/504209_1_En_4_Fig1_HTML.jpg)


    Figure 4-1


    Block representation of an ODE, first step


    The standard implies that what is placed on the right of the block is the output,
    and what is on the left is the input. We will start with the definition of the
    derivative of `x1`.


    We make the connection shown in Figure [4-2](#504209_1_En_4_Chapter.xhtml#Fig2),
    which defines the `x1` derivative.


    ![../images/504209_1_En_4_Chapter/504209_1_En_4_Fig2_HTML.jpg](images/504209_1_En_4_Chapter/504209_1_En_4_Fig2_HTML.jpg)


    Figure 4-2


    Block representation of an ODE, first equation connection


    In the same way, you can notice that the derivative of `x2` is a sum. For this
    reason, we will need another block. You should also note that at the output of
    said block there must be a gain; see Figure [4-3](#504209_1_En_4_Chapter.xhtml#Fig3).


    ![../images/504209_1_En_4_Chapter/504209_1_En_4_Fig3_HTML.jpg](images/504209_1_En_4_Chapter/504209_1_En_4_Fig3_HTML.jpg)


    Figure 4-3


    Block representation of an ODE, second equation connection


    And finally, following the previous logic, we arrive at Figure [4-4](#504209_1_En_4_Chapter.xhtml#Fig4).


    ![../images/504209_1_En_4_Chapter/504209_1_En_4_Fig4_HTML.jpg](images/504209_1_En_4_Chapter/504209_1_En_4_Fig4_HTML.jpg)


    Figure 4-4


    Block representation of an ODE, full connection (without control)


    Even though this system only has a few equations and terms, its block representation
    required many icons and connectors (also note that the value of `u` has not been
    defined and this can increase the number of blocks).


    One way to simplify this is by working with matrices and vectors, relegating the
    equations to just one block, as indicated in Figure [4-5](#504209_1_En_4_Chapter.xhtml#Fig5).


    ![../images/504209_1_En_4_Chapter/504209_1_En_4_Fig5_HTML.jpg](images/504209_1_En_4_Chapter/504209_1_En_4_Fig5_HTML.jpg)


    Figure 4-5


    A reduced block representation with the system in a “text file” (without control)


    In this way, an aggregate such as `u` can be reduced to some lines of code instead
    of a large number of blocks. Also, the variable `u`, for example, can be a PD
    controller that depends on a trajectory, which also depends on the time. See Figure
    [4-6](#504209_1_En_4_Chapter.xhtml#Fig6). Observe that you need a clock block.


    ![../images/504209_1_En_4_Chapter/504209_1_En_4_Fig6_HTML.jpg](images/504209_1_En_4_Chapter/504209_1_En_4_Fig6_HTML.jpg)


    Figure 4-6


    A reduced block representation with the system in a “text file” (with control)


    Note that if the system has many equations and each of them have several terms,
    as in the case of the quadcopter, this simplified model of blocks is very convenient.
    This is exactly what we will do in the next section by using the Simulink-MATLAB
    combination.


    # Simulation with Simulink and Interpreted MATLAB Functions


    If you want to use free software such as Scilab or Python, it is advisable to
    read this section. Based on what you learn here and the references of this chapter
    (which you can find in the Appendix), you could search for the equivalent commands
    or blocks in the mentioned programs and programming languages.


    Keep in mind that through the multiple libraries that this combination has (MATLAB/Simulink),
    you can interact with animated or interactive simulation software such as Gazebo,
    X-plane, the Ardupilot libraries, the Pixhawk autopilot, or CAD software with
    physics engines.


    Let’s continue. This is a special mode among the many that Simulink has to perform
    simulations. It offers the practicality of the blocks in one of their most simplified
    forms, where a text file is used exclusively for writing the equations of the
    system and its controller. In this manner, a set of equations with many terms
    are relegated to the text file, and a general template is placed in a block file.
    The block file contains preprogrammed equation solvers such as Euler or RK4 and
    is developed for an easy interconnection and processing. This method is valid
    for MATLAB 2012b versions or higher. The best thing about this type of representation
    and simulation is that multiple modifications and uses can be made with the input
    and output signals (filtering, plot edition, introducing delays, etc.). This is
    not possible in simulators that do not use blocks.'
