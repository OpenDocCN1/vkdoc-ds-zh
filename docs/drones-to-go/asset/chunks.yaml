    ### 依赖动力学的控制


    根据之前的简化，我们可以注意到剩余的系统为


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figad_HTML.jpg](img/504209_1_En_3_Figad_HTML.jpg)


    不依赖于其他变量的子系统是旋转子系统，而平移子系统则依赖于这些旋转变量。


    因此，从设计旋转动力学的控制器开始是合理的。基于与偏航变量类似的论证，以及已经阐述过的平稳飞行（小加速度）和恒定吸收的原因，这里提出了滚转和俯仰的控制器：


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figae_HTML.jpg](img/504209_1_En_3_Figae_HTML.jpg)


    这与先前分析的变量类似，意味着


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figaf_HTML.jpg](img/504209_1_En_3_Figaf_HTML.jpg)


    因此，依赖动力学可以通过其所依赖角度的期望值进行控制。这是合乎逻辑的，因为四旋翼飞行器能够通过滚转和俯仰倾斜在 `X` 和 `Y` 方向上移动。


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figag_HTML.jpg](img/504209_1_En_3_Figag_HTML.jpg)


    随后，`theta` 和 `phi` 的期望值以此方式选取（这被称为外环控制或嵌套控制）：


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figah_HTML.jpg](img/504209_1_En_3_Figah_HTML.jpg)


    这种对平移 `X` 和 `Y` 动力学的反馈导致


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figai_HTML.jpg](img/504209_1_En_3_Figai_HTML.jpg)


    在平稳飞行、小加速度下轨迹有界以及先前使用的常数吸收的前提下，辅助控制器可以简单地设计为


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figaj_HTML.jpg](img/504209_1_En_3_Figaj_HTML.jpg)


    总而言之，注入的控制量如下所示（请参阅下一章的仿真以观察其性能）：


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figak_HTML.jpg](img/504209_1_En_3_Figak_HTML.jpg)


    展开后如下：


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figal_HTML.jpg](img/504209_1_En_3_Figal_HTML.jpg)


    请回忆 ISO 1151–2:1985 标准的介绍，注意 `theta` 的测量是相对于 `Y` 轴进行的，但其变化会影响 `X` 方向的运动。同样，`phi`
    的测量是绕 `X` 轴进行的，但其变化会影响 `Y` 方向的运动。


    最后，鉴于


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figam_HTML.jpg](img/504209_1_En_3_Figam_HTML.jpg)


    您应该注意到 `theta` 和 `phi` 的期望速度不为零，并且它们应是对应平移 PD 控制器的导数。然而，考虑到上述平稳飞行近似和变量收敛性，将期望速度设为零是一个很好的近似。


    关于这种平稳飞行近似，让我们看看在此飞行模式下控制器会发生什么。


    ### 控制器的线性解耦


    另一个重要的考虑因素是，在这种偏航角固定为零的平稳飞行中，控制器是解耦的（至少线性控制器如 PD、PID 等是如此），因此平面平移运动以及滚转和俯仰旋转运动似乎具有独立的行为，例如：


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figan_HTML.jpg](img/504209_1_En_3_Figan_HTML.jpg)


    结合先前常数吸收的假设


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figao_HTML.jpg](img/504209_1_En_3_Figao_HTML.jpg)


    得到如下结果：


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figap_HTML.jpg](img/504209_1_En_3_Figap_HTML.jpg)


    对于变量 `phi` 也能得到类似的结果。请将此作为练习。


    在结束本节之前，我们来讨论一些说明。


    ### 说明与图形解释


    从图形上看，该控制的实现顺序如图 3-6 所示。


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Fig6_HTML.jpg](img/504209_1_En_3_Fig6_HTML.jpg)


    *图 3-6: 无偏航变化的完全线性笛卡尔控制图形顺序*


    两种带有遥控器（半自动或手动引导模式）的版本如下。


    在第一个版本中，遥控器仅改变期望值；见图 3-7。


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Fig7_HTML.jpg](img/504209_1_En_3_Fig7_HTML.jpg)


    *图 3-7: 无偏航变化且通过手动遥控指令设定期望值的完全线性笛卡尔控制图形顺序*


    在第二个版本中，遥控器改变力矩和力；见图 3-8。


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Fig8_HTML.jpg](img/504209_1_En_3_Fig8_HTML.jpg)


    *图 3-8: 无偏航变化且通过手动遥控指令直接作用于力和力矩控制的完全线性笛卡尔控制图形顺序*


    请注意，手动模式的组合可以有任意多种。在所描述的示例中，第二种模式可能很危险，因为它直接影响控制器，但如果输入的值很小且有界，则可以降低风险。


    你已经学习了无偏航变化的机器人模式控制。接下来，我们进入偏航可变的情况。

    '
- fmt: '# Fully Linear Cartesian Control with Yaw Variation


    This type of controller is a modification of the previous one. Now the drone is
    able to follow a trajectory, and it can also modify its yaw angle; see Figure
    [3-9](#504209_1_En_3_Chapter.xhtml#Fig9). This operation is useful for recording
    an object, person, or building located inside the path, as in the case of surveillance
    operations.


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Fig9_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Fig9_HTML.jpg)


    *Figure 3-9* – Graphic representation of a fully linear Cartesian control with
    yaw variation


    In the case of this flight mode, the thrust and torque controls are identical
    to the previous section:


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figaq_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figaq_HTML.jpg)


    What changes is the design of the desired `theta` and `phi` auxiliary controllers,
    as follows.


    The `XY` dynamic systems cannot be simplified since `psi` does not have a zero
    value:


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figar_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figar_HTML.jpg)


    But you can rewrite them in matrix form like this:


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figas_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figas_HTML.jpg)


    From the roll and pitch controllers, remember that


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figat_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figat_HTML.jpg)


    The following auxiliary controllers can be proposed:


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figau_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figau_HTML.jpg)


    Substituting the auxiliary controllers into the given dynamic model:


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figav_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figav_HTML.jpg)


    Simplifying:


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figaw_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figaw_HTML.jpg)


    And this implies that


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figax_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figax_HTML.jpg)


    Rewriting the proposed matrix form to an equivalent but programmable one (which
    avoids making a lot of matrix multiplications to a computer), we obtain a known
    equation found in drone research:


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figay_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figay_HTML.jpg)


    Finally, note that the matrix depending on `psi_desired` is a rotation matrix
    (this will be very useful for the interpretation of the geometric control in the
    upcoming section).


    There are two ways to verify that this is a rotation matrix:


    1. **Turning the matrix into a known rotation matrix by using transformations:**


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figaz_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figaz_HTML.jpg)


    2. **Using a property of the rotation matrices previously employed in this book:**


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figba_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figba_HTML.jpg)


    In summary, the controller proposed in this section is as follows (see the simulation
    section to observe the performance of this control):


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figbb_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figbb_HTML.jpg)


    The graphic sequence of these controllers is displayed in Figure [3-10](#504209_1_En_3_Chapter.xhtml#Fig10).


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Fig10_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Fig10_HTML.jpg)


    *Figure 3-10* – Graphic sequence of a fully linear Cartesian control with yaw
    variation


    For the remote control variants, they can be adapted considering two ways; see
    Figure [3-11](#504209_1_En_3_Chapter.xhtml#Fig11).


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Fig11_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Fig11_HTML.jpg)


    *Figure 3-11* – Remote control variants when a fully linear Cartesian control
    with yaw variation is used


    - The first is to include the yaw action over the corresponding remote controls
    for roll and pitch (through yaw compensation as in the previous control). In this
    way, the manual behavior of the vehicle will be as in the left side of the figure.

    - The second is not to include such variation and the manual behavior of the vehicle
    will be as in the right side of the same figure.


    At this point, you have learned about the robot mode control, which allows a smooth
    flight. Now it’s time to see the vehicle mode control, which allows higher degrees
    of mobility and acrobatic or aggressive motion.


    ## Vehicle Mode Control


    In the case of being analyzed as a vehicle, the control design of the drone implies
    seeing it as if it were a first person mode, an on-board experience, or in the
    “cockpit.” See Figure [3-12](#504209_1_En_3_Chapter.xhtml#Fig12). For the purposes
    of this, the line of sight of the aircraft, also known as the guide vector (the
    vector that would have a pilot on board), should be regulated by means of “rudders”
    or “thrusters.” Unlike the robot mode or third person mode, the coupling between
    rotational and translational controllers and dynamics is bigger or even totally
    dependent. This is a mathematical drawback, but it also represents an advantage
    in versatility and usage for aggressive or acrobatic operations.


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Fig12_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Fig12_HTML.jpg)


    *Figure 3-12* – Graphic representation of the vehicle mode control (as a first
    person view)


    Let’s start with the spherical control (based on rudders) and then the geometric
    one (based on thrusters).'
