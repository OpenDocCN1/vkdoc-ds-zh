- fmt: '# Historical Context


    If you look at the Figure [1-1](#504209_1_En_1_Chapter.xhtml#Fig1), you will notice
    that drones, and particularly multicopters, have centuries of history. They started
    as sketches designed by DaVinci (at least that’s how occidental history reports
    it). Recently these sketches were carried out in a giant quadcopter in a kind
    of retrotechnology developed by the University of Maryland where the processor
    and base engine are the human body (the brain and the extremities, respectively).
    Multicopters came back around in 1907 with the Breguet brothers and later in the
    1920s with Oehmichen and Bothezat. In these drones, the processor and base engine
    were, respectively, a pilot and a mechanical computer (a mechanism) in charge
    of coordinating the movements of each propeller and internal combustion motors.
    They were forgotten until the 2010s, when the commercial and research booms in
    these vehicles/robots occurred. Currently, the processor and engine base are,
    respectively, an autopilot and electric motors. Now you that you know some history,
    let’s move on to some useful nomenclatures.


    ![../images/504209_1_En_1_Chapter/504209_1_En_1_Fig1_HTML.jpg](images/504209_1_En_1_Chapter/504209_1_En_1_Fig1_HTML.jpg)


    Figure 1-1


    Quadcopter history


    # Etymologies and Names in Use


    Although the term “drone” is correctly used for any unmanned vehicle, commercial
    popularization associates it with aerial vehicles, and more specifically, with
    multicopters. This term comes from insects, very specifically from those whose
    function in the hive or nest is simply to perpetuate the species.


    More professional words to refer to an aerial drone are


    *   UAV or unmanned aerial vehicle

    *   UAS or unmanned aerial system

    *   RPAS or remotely piloted aircraft system


    You should also familiarize yourself with the terms “multirotor” and “multicopter,”
    which roughly mean multiple rotating motors. The term “multiple copters” was adapted
    from the French “hélicoptère,” a word invented by Gustave d’Amécourt in 1861 that
    means spiral wing. The word is based on the Greek “helix,” which means helix or
    spiral, and “pteron,” which means wing.


    Why is this useful to know? Perhaps it seems trivial, but for those who want to
    research the classic concepts of drones, the archaic nomenclature is important
    to know. Of course, if you only need current research and new trends, you only
    need to know the modern terms. For the vehicles presented in this book, the evolution
    from classic to current terminologies is


    *   Multicopter (22,400 results in Google Scholar on May 5, 2020) -> multirotor
    (10,600 results in Google Scholar on May 5, 2020)

    *   Quadcopter (37,400 results in Google Scholar on May 5, 2020) -> Quadrotor
    (35,500 results in Google Scholar on May 5, 2020)

    *   And, in an unusual way, the word quadricopter (674 results in Google Scholar
    on May 5, 2020)


    Figure [1-2](#504209_1_En_1_Chapter.xhtml#Fig2) is based on Google Trends, indicating
    when the boom of the term “quadcopter” began. In early 2011 approximately, the
    words “quadrotor” and “quadcopter” were almost equally employed. In fact, it was
    very frequent to read “quadrotor” in the scientific field, but the use of the
    “quadcopter” grew as time evolved (including in scientific and technological research).
    Currently, both terms are more or less equal in use due to a reduction in their
    use, and the domination and popularization of the term “drone” (Figure [1-3](#504209_1_En_1_Chapter.xhtml#Fig3)).
    Curiously, the terms “quadcopter” and “quadrotor” have been relegated to the research
    field where the growing term now is “UAV.”


    ![../images/504209_1_En_1_Chapter/504209_1_En_1_Fig3_HTML.jpg](images/504209_1_En_1_Chapter/504209_1_En_1_Fig3_HTML.jpg)


    Figure 1-3


    Quadrotor vs. quadcopter vs. drone search results on Google Trends


    ![../images/504209_1_En_1_Chapter/504209_1_En_1_Fig2_HTML.jpg](images/504209_1_En_1_Chapter/504209_1_En_1_Fig2_HTML.jpg)


    Figure 1-2


    Quadrotor vs. quadcopter search results on Google Trends


    In summary, the value of this section is to indicate the trend of certain terms
    to facilitate any necessary research, and also the way to provide background on
    how each term should be used in context. Now that you know about etymologies as
    a tool for searching, let’s consider what kind of drone you need.


    # What Kind of Drone Do You Need?


    There are four types of drone users: the specialist researcher, the researcher
    (who uses a drone as a tool), the designer, and the pilot. Table [1-1](#504209_1_En_1_Chapter.xhtml#Tab1)
    shows some of the characteristics and recommended equipment for each type of user.


    Table 1-1


    Types of Drone Users and Characteristics


    | User | Most common vehicle | Kind of software (see Chapter [5](#504209_1_En_5_Chapter.xhtml)
    regarding ways to program a drone) | What do they need to know? | Examples |

    | --- | --- | --- | --- | --- |

    | Pilot | Closed architectures (prebuilt drones) | Closed architecture GUI | Maker-style
    technical knowledge, regulations, and unmanned flight courses. The vehicle is
    a work tool. | Racing pilot or photographer |

    | Researcher who uses a drone as a tool | Mostly closed or limited open architectures
    | GUI or SDK type 1 | Maker-style technical knowledge. The vehicle is still a
    work tool but with a specialized task unrelated to the drone. The aircraft is
    a test platform. | Research in artificial vision or artificial intelligence algorithms,
    including SLAM |

    | Specialist researcher | Kit-like open architectures | SDK type 2 or 3 | Scientific
    knowledge about control and robotic vehicles, and maker-style technical knowledge
    are desired. Here, the vehicle’s flight mode is designed. | Research in automatic
    control algorithms for aircraft flight |

    | Designer | Open architectures which are selected component by component | SDK
    type 3. In general, a design component by component is related to open software
    architectures and conversely, almost all the commercial drones have software with
    limited capabilities. | Scientific knowledge specialized in aircraft control and
    design, and advanced technical knowledge are required. Here, the whole vehicle
    is designed. | Aircraft designer |


    Now you have an idea about the vehicle that is useful for your purposes, but what
    about safety and standards? Let’s answer this now.


    # Generic Safety Issues and International Standards


    In general, nobody will persecute you for carrying out prototype tests in your
    home, garden, or in a laboratory with the appropriate equipment and security measures,
    as long as people, animals, buildings, or property other than your own are not
    injured. However, in order to reduce risks and accidents, we include a small section
    with generic recommendations. Note that the impact of these recommendations for
    each person may vary based on local laws.


    ## Communications


    A drone can affect and infringe on local telecommunications in two ways and in
    both cases you could be penalized.


    1.  **Telemetry system and remote control system**: Telemetry and remote control
    transmitters must be compatible with the range of transmission frequencies allowed
    in your locality. A typical example is that telemetry radios usually come in two
    presentations: 433 MHz, which is used in Europe and countries with the same standard,
    and 915 MHz, which is used in the US and countries compatible with the same standard.


    2.  **Electrical power consumption**: People who design and use quadcopters with
    high power consumption, especially in high current applications, know that this
    affects the performance of the vehicle’s sensors, and it’s necessary to shield
    the cables, twist them, cover them, or even separate the connections. This can
    influence the behavior of a public antenna or civil communication equipment. So,
    as a designer or user, you should be aware that you could be penalized.'
