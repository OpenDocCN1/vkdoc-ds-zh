    并且期望矩阵包含三个“推进器”。这是因为在旋转矩阵中，每一列都代表一个笛卡尔坐标轴的行为。同时，如前所述，每一列都是满足法向量条件的单位向量，而正交条件由以下定义满足：


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figcr_HTML.jpg](img/504209_1_En_3_Figcr_HTML.jpg)


    如前所述，这些向量是**noa**类型的向量，并且它们的定义要求彼此之间正交归一。这解释了叉积和归一化量的存在。最后，对于`b1d`，由于它是两个归一化向量或单位向量的叉积，因此它也是归一化或单位的。


    请注意，唯一独立的向量是`Bdes`和`b3d`，并且唯一可以设计的向量是`Bdes`，因为`b3d`必须满足我们的约束条件以调节`FBZ`。而对于`b1d`，它被强制满足与其余两个向量的正交归一性。


    `Bdes`的一个示例如下


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figcs_HTML.jpg](img/504209_1_En_3_Figcs_HTML.jpg)


    该向量与`b1d`和`b2d`相关联，并允许例如绕`ZB`轴的旋转（一种强制但功能性的偏航调节，由于`b1d`和`b2d`与`b3d`的相互作用，并未完全实现）。


    在定义了测量旋转矩阵和期望旋转矩阵之后，让我们回顾一些关于距离的概念。两个标量之间的距离是减法。两个向量之间的距离，在众多定义中，是二次向量范数（其分量标量差值的平方和再开平方根）。对于矩阵，也有多种距离的定义。这里我们将使用**Frobenius**范数，因为其具有不变性（迹和行列式是矩阵中的不变量，而
    Frobenius 范数基于迹）。


