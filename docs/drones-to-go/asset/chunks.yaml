    Graphic representation of the **noa** vectors in a robotic manipulator


    This section requires that you possess a good knowledge about the following tools
    (all the useful properties are indicated as they are used, but you should read
    a little more about them): norms and distances in metric spaces (absolute value,
    quadratic distance, etc.); matrix invariants (trace, determinant, etc.); rotation
    matrices and their properties including their derivative properties; the transpose
    of a matrix and its properties; the trace of a matrix; and the equivalent matrix
    product of the cross product known as hat product and its inverse operation called
    vee product.


    Let’s begin with the translational part.


    ## Translational Control


    This control uses the alternative kinematic representation based on rotation matrices
    and also uses the nonlinearized general dynamic model. This is


