- fmt: '# Types of Simulators


    We have four kinds of simulators:


    - **Numeric with symbols**: They only require equations, specifically the system’s
    mathematical model and its controller. This kind of simulator is any program capable
    of solving these equations. Depending on the complexity of the model, the program
    will be able or not to solve it. In the case of a drone, this can be done with
    a standard programming language where you can code an algorithm for the numerical
    resolution of ordinary differential equations such as Euler, `RK4`, etc. This
    simulator requires at least two sections of code: the solver and the system to
    solve.


    - **Numeric with blocks**: Similar to the previous case, but instead of a symbolic
    representation of the equations and the controller, they have a graphical representation
    based on blocks. This is a much more visual form of programming than the symbolic
    one, and it facilitates the interconnection of components (except when they are
    many components). Known examples are `LabView`, `Simulink`, or `Scilab/Scicos`.
    In the case of using blocks, the solver is the command interface by itself, and
    the system to be solved is a file with diagrams.


    - **Animated**: In this case, they are interfaces with three-dimensional graphics
    that allow simulating a system. Examples are `V-rep`, `Gazebo`, or the `Mission
    Planner` GUI and its virtual `SITL` (software in the loop) simulator. In general,
    they consist of two parts: the animated object and its world, and the modeling
    file. Many of these simulators have a physics engine, which includes effects of
    the environment like wind or pressure.


    - **Interactive**: Here we find the ability to interact among simulators of any
    of the previous types, or the interaction with hardware. Examples are `X-Plane`
    or the `Mission Planner` with its `HITL` (hardware in the loop) mode.


    In the case of this text, we will focus on the two simplest to use (from the point
    of view of the installation): the numerical ones. Of course, they require mathematics
    but users can make them as simple or complicated as they want. Additionally, many
    simulators can be used assembled and interactively with the methodology described
    below.


    Having decided which kind of simulators we will use, let’s continue with the state
    space representation, which is a tool that allows us to work with simulators.


    # State Space Representation


    If you have a differential equation of order `n`, it can be transformed into `n`
    differential equations of order one. This is useful for using a single collective
    integrator block in the simulator, or handling vector and matrix operations instead
    of scalar ones.


    ![../images/504209_1_En_4_Chapter/504209_1_En_4_Figa_HTML.jpg](images/504209_1_En_4_Chapter/504209_1_En_4_Figa_HTML.jpg)


    For example, remember that the mass spring damper system is a second order system:


    ![../images/504209_1_En_4_Chapter/504209_1_En_4_Figb_HTML.jpg](images/504209_1_En_4_Chapter/504209_1_En_4_Figb_HTML.jpg)


    This way, it will require two state space variables. In these cases, the most
    convenient selection is to take as state space variables those that have lower
    orders with respect to the system’s order. In this equation, the position and
    velocity are chosen as state space variables:


    ![../images/504209_1_En_4_Chapter/504209_1_En_4_Figc_HTML.jpg](images/504209_1_En_4_Chapter/504209_1_En_4_Figc_HTML.jpg)


    Obtaining the derivative, we arrive at the required expression:


    ![../images/504209_1_En_4_Chapter/504209_1_En_4_Figd_HTML.jpg](images/504209_1_En_4_Chapter/504209_1_En_4_Figd_HTML.jpg)


    The last equation is solvable from the original equation of the system:


    ![../images/504209_1_En_4_Chapter/504209_1_En_4_Fige_HTML.jpg](images/504209_1_En_4_Chapter/504209_1_En_4_Fige_HTML.jpg)


    Replacing the state space variables, this results in


    ![../images/504209_1_En_4_Chapter/504209_1_En_4_Figf_HTML.jpg](images/504209_1_En_4_Chapter/504209_1_En_4_Figf_HTML.jpg)


    remaining only two first order equations as expected.


    A quadcopter can have, according to its dynamic model, twelve state space variables
    (six equations of the second order; remember that three of these equations are
    related to the translational dynamics and the rest with the rotational dynamics):


    ![../images/504209_1_En_4_Chapter/504209_1_En_4_Figg_HTML.jpg](images/504209_1_En_4_Chapter/504209_1_En_4_Figg_HTML.jpg)


    If we select the state space variables in the following way (this is a possible
    choice alternating positions and speeds), we have


    ![../images/504209_1_En_4_Chapter/504209_1_En_4_Figh_HTML.jpg](images/504209_1_En_4_Chapter/504209_1_En_4_Figh_HTML.jpg)


    Note also that the control input `u` has four values. They are the thrust force
    and the three torques:


    ![../images/504209_1_En_4_Chapter/504209_1_En_4_Figi_HTML.jpg](images/504209_1_En_4_Chapter/504209_1_En_4_Figi_HTML.jpg)


    Another possible choice could be done by first selecting all the positions and
    then all the speeds, or simply another sequence different from the one presented
    here. Whichever you choose, it must be respected for its later use.


    The second tool that is useful for our simulations is the block representation.
    Let’s talk about it.'
