    is developed for an easy interconnection and processing. This method is valid
    for MATLAB 2012b versions or higher. The best thing about this type of representation
    and simulation is that multiple modifications and uses can be made with the input
    and output signals (filtering, plot edition, introducing delays, etc.). This is
    not possible in simulators that do not use blocks.'
  trans: '

    # 框图表示


    在此情况下，框图是状态空间变量的图形化表示。它们非常适用于绘制图表，或在使用 Simulink 或 Labview 等旨在运用框图的视觉化语言进行仿真时发挥作用。


    回到质量-弹簧-阻尼器示例，具体来说是其在状态空间变量中的表示，我们可以执行以下操作来获得其框图表示。


    首先，注意有两个状态空间方程，因此需要两个主框。这些框代表积分器；见图 4-1。在此示例中，我们为状态添加了标签，这是一种有利于编程和理解的优良实践，但这种标签化处理并不常见。


    ![../images/504209_1_En_4_Chapter/504209_1_En_4_Fig1_HTML.jpg](img/504209_1_En_4_Fig1_HTML.jpg)


    图 4-1


    常微分方程的框图表示，第一步


    标准规定，放在框右侧的是输出，左侧的是输入。我们将从定义`x1`的导数开始。


    我们进行如图 4-2 所示的连接，该连接定义了`x1`的导数。


    ![../images/504209_1_En_4_Chapter/504209_1_En_4_Fig2_HTML.jpg](img/504209_1_En_4_Fig2_HTML.jpg)


    图 4-2


    常微分方程的框图表示，第一个方程连接


    同样，你可以注意到`x2`的导数是求和的形式。因此，我们需要另一个框。你还应注意到，在该框的输出端必须有一个增益；见图 4-3。


    ![../images/504209_1_En_4_Chapter/504209_1_En_4_Fig3_HTML.jpg](img/504209_1_En_4_Fig3_HTML.jpg)


    图 4-3


    常微分方程的框图表示，第二个方程连接


    最后，按照之前的逻辑，我们得到图 4-4。


    ![../images/504209_1_En_4_Chapter/504209_1_En_4_Fig4_HTML.jpg](img/504209_1_En_4_Fig4_HTML.jpg)


    图 4-4


    常微分方程的框图表示，完整连接（无控制）


    尽管该系统只有几个方程和项，但其框图表示却需要许多图标和连接器（同时请注意，`u`的值尚未定义，这可能会增加框的数量）。


    一种简化方法是使用矩阵和向量，将方程归并到一个框内，如图 4-5 所示。


    ![../images/504209_1_En_4_Chapter/504209_1_En_4_Fig5_HTML.jpg](img/504209_1_En_4_Fig5_HTML.jpg)


    图 4-5


    将系统置于“文本文件”中的简化框图表示（无控制）


    这样，诸如`u`这样的聚合项可以简化为几行代码，而不是大量的框。此外，例如变量`u`可以是一个依赖于轨迹的 PD 控制器，而轨迹本身又依赖于时间。见图 4-6。请注意，你需要一个时钟模块。


    ![../images/504209_1_En_4_Chapter/504209_1_En_4_Fig6_HTML.jpg](img/504209_1_En_4_Fig6_HTML.jpg)


    图 4-6


    将系统置于“文本文件”中的简化框图表示（有控制）


    注意，如果系统有很多方程，且每个方程都有多个项，例如四旋翼飞行器的情况，这种简化的框图模型就非常方便。这正是我们在下一节将要使用 Simulink-MATLAB
    组合来做的。


    # 使用 Simulink 和解释型 MATLAB 函数进行仿真


    如果你想使用免费软件，如 Scilab 或 Python，建议阅读本节。基于你在这里学到的知识以及本章的参考文献（你可以在附录中找到），你可以搜索上述程序和编程语言中的等效命令或模块。


    请记住，通过这种组合（MATLAB/Simulink）所拥有的多个库，你可以与动画或交互式仿真软件进行交互，例如 Gazebo、X-plane、Ardupilot
    库、Pixhawk 自动驾驶仪或带有物理引擎的 CAD 软件。


    让我们继续。这是 Simulink 执行仿真的众多模式中一种特殊模式。它提供了框的最简化形式之一的实用性，其中专门使用文本文件来编写系统及其控制器的方程。这样，一组包含多个项的方程被归入文本文件，而一个通用模板则置于框文件中。框文件包含预编程的方程求解器，如欧拉法或
    RK4 法，并设计用于简便的互联和处理。此方法适用于 MATLAB 2012b 及以上版本。这种表示和仿真类型最大的优点在于，可以对输入和输出信号进行多种修改和使用（滤波、图形编辑、引入延迟等）。这在那些不使用框的仿真器中是无法实现的。

    '
- fmt: "### Required Blocks\n\nThe Simulink blocks here described have at least one\
    \ of the following three properties: an input signal, an output signal, and a\
    \ way for setting up their own parameters. See Figure [4-7](#504209_1_En_4_Chapter.xhtml#Fig7).\n\
    \n![../images/504209_1_En_4_Chapter/504209_1_En_4_Fig7_HTML.jpg](images/504209_1_En_4_Chapter/504209_1_En_4_Fig7_HTML.jpg)\n\
    \nFigure 4-7  \nProperties of a Simulink block\n\nThese are the seven most usable\
    \ blocks for our purposes.\n\n### Interpreted MATLAB Function\n\nThis block is\
    \ used to link the text file containing the dynamic model of the system and its\
    \ controller with the block file. See Figure [4-8](#504209_1_En_4_Chapter.xhtml#Fig8).\n\
    \n![../images/504209_1_En_4_Chapter/504209_1_En_4_Fig8_HTML.jpg](images/504209_1_En_4_Chapter/504209_1_En_4_Fig8_HTML.jpg)\n\
    \nFigure 4-8  \n`Interpreted MATLAB Function` block\n\nThe input of this block\
    \ is a bus or data channel with *n* signals (states, time, auxiliary values, etc.).\
    \ The output of this block is also a bus or data channel with *m* signals (states,\
    \ auxiliary values, signals to be plotted, etc.).\n\nThe important properties\
    \ of this block in which we are interested are (do not modify the other properties):\n\
    \n1. The name of the file that contains the dynamic model of the system and its\
    \ controller. This name must be identical to the text file that contains said\
    \ model and without the file extension.\n2. The size of the output bus (measured\
    \ in the number of variables).\n\nOnce these parameters have been modified, just\
    \ click `OK` and close the block’s dialog box. See Figure [4-9](#504209_1_En_4_Chapter.xhtml#Fig9).\n\
    \n![../images/504209_1_En_4_Chapter/504209_1_En_4_Fig9_HTML.jpg](images/504209_1_En_4_Chapter/504209_1_En_4_Fig9_HTML.jpg)\n\
    \nFigure 4-9  \n`Interpreted MATLAB Function` block parameters\n\nNote that we\
    \ use the previous block for practicality, but you should also investigate the\
    \ `MATLAB Function` and the `S-function` blocks.\n\n### Integrator\n\nIt allows\
    \ integrating a bus of signals. See Figure [4-10](#504209_1_En_4_Chapter.xhtml#Fig10).\n\
    \n![../images/504209_1_En_4_Chapter/504209_1_En_4_Fig10_HTML.jpg](images/504209_1_En_4_Chapter/504209_1_En_4_Fig10_HTML.jpg)\n\
    \nFigure 4-10  \n`Integrator` block\n\nThis block is used to integrate signals.\
    \ In Simulink, there are different types of integrators, but for our purposes,\
    \ this is the one that we use.\n\nThe input of this block is a bus or data channel\
    \ with *n* signals (the derivatives of the system states, for example).  \nThe\
    \ output of this block is also a bus or data channel with *n* signals (the system\
    \ states, for example).\n\nThe only parameter that we are interested in modifying\
    \ is the initial conditions or the starting point of our system to simulate. If\
    \ this is a single equation, just write a scalar. If there is more than one equation,\
    \ the initial values must be introduced as follows: `[val1 val2 val3 valN]`.\n\
    \nOnce this parameter has been modified, we just click `OK` and close the properties\
    \ dialog box. See Figure [4-11](#504209_1_En_4_Chapter.xhtml#Fig11).\n\n![../images/504209_1_En_4_Chapter/504209_1_En_4_Fig11_HTML.jpg](images/504209_1_En_4_Chapter/504209_1_En_4_Fig11_HTML.jpg)\n\
    \nFigure 4-11  \n`Integrator` block parameters\n\n### Scope\n\nThis block allows\
    \ seeing the graphs of our simulation directly in the block-diagram file, either\
    \ during the simulation or at the end of it. See Figure [4-12](#504209_1_En_4_Chapter.xhtml#Fig12).\n\
    \n![../images/504209_1_En_4_Chapter/504209_1_En_4_Fig12_HTML.jpg](images/504209_1_En_4_Chapter/504209_1_En_4_Fig12_HTML.jpg)\n\
    \nFigure 4-12  \n`Scope` block\n\nThis block does not have outputs. Its inputs\
    \ are buses with *n* signals to be plotted. Its relevant parameters are as follows:\n\
    \n![../images/504209_1_En_4_Chapter/504209_1_En_4_Fig13_HTML.jpg](images/504209_1_En_4_Chapter/504209_1_En_4_Fig13_HTML.jpg)\n\
    \nFigure 4-13  \n`Scope` block parameters\n\n1. **The autoscale button**: This\
    \ is useful to adjust the graph at the end or during the simulation.\n2. **The\
    \ properties button**: When this button is pressed, an auxiliary menu will appear.\
    \ We are only interested in two options:\n   - **The number of input axes**: This\
    \ determines how many independent graphs there will be in the scope. Each input\
    \ to the scope will be an independent bus of *n* variables. This option is accessed\
    \ from the **General** menu.\n   - **The limit data checkbox**: This is usually\
    \ activated, and it only displays the last 5,000 data points. If you want to see\
    \ an extensive simulation, you must deactivate this checkbox. This option is accessed\
    \ from the **History** menu. See Figure [4-13](#504209_1_En_4_Chapter.xhtml#Fig13).\n\
    \nAs in the previous cases, you must click `OK` and close the auxiliary menus\
    \ in order to save the modifications.\n\nYou can also experiment with the **Style**\
    \ menu of the `Scope` parameters if you want to modify the presentation and the\
    \ colors of the plot.\n\n### To Workspace Block\n\nThis block allows using specific\
    \ data outside the Simulink interface in order to carry out further processing\
    \ or editing (for example, exporting the plots for editing their graphs to be\
    \ used in a publication). See Figure [4-14](#504209_1_En_4_Chapter.xhtml#Fig14).\n\
    \n![../images/504209_1_En_4_Chapter/504209_1_En_4_Fig14_HTML.jpg](images/504209_1_En_4_Chapter/504209_1_En_4_Fig14_HTML.jpg)\n\
    \nFigure 4-14  \n`To Workspace` block\n\nThis block only has an input, which is\
    \ a data bus.\n\nIts parameters of interest for our purposes are only two:\n\n\
    ![../images/504209_1_En_4_Chapter/504209_1_En_4_Fig15_HTML.jpg](images/504209_1_En_4_Chapter/504209_1_En_4_Fig15_HTML.jpg)\n\
    \nFigure 4-15  \n`To Workspace` block parameters\n\n1. The name of the variable\
    \ that will be used from the MATLAB console for editing the information.\n2. The\
    \ type of the output data. In our case and for a simplified data access, this\
    \ must always be an `array`. See Figure [4-15](#504209_1_En_4_Chapter.xhtml#Fig15).\n\
    \n### Selector\n\nThis block is used for selecting one or more signals from a\
    \ bus. See Figure [4-16](#504209_1_En_4_Chapter.xhtml#Fig16).\n\n![../images/504209_1_En_4_Chapter/504209_1_En_4_Fig16_HTML.jpg](images/504209_1_En_4_Chapter/504209_1_En_4_Fig16_HTML.jpg)\n\
    \nFigure 4-16  \n`Selector` block\n\nThe input to the block is a data bus with\
    \ *n* variables. Its output is another bus with *p* variables, where *p* goes\
    \ from just one signal to the *n* signals. The size of *p* will simply depend\
    \ on which signals you want to extract.\n\nIts parameters of interest are:\n\n\
    ![../images/504209_1_En_4_Chapter/504209_1_En_4_Fig17_HTML.jpg](images/504209_1_En_4_Chapter/504209_1_En_4_Fig17_HTML.jpg)\n\
    \nFigure 4-17  \n`Selector` block parameters\n\n1. The output signal index in\
    \ scalar format if only one signal is chosen, or in the vector format `[val1 val2\
    \ val3 valN]` if more than one signal is required.\n2. The size of the input bus.\
    \ See Figure [4-17](#504209_1_En_4_Chapter.xhtml#Fig17).\n\nLet's analyze the\
    \ given example. Note that it is graphically intuitive. The block in the figure\
    \ receives a data bus with three variables, and its output is another bus with\
    \ two variables, specifically the first and third values of the input bus.\n\n\
    ### Mux\n\nIt is a multiplexer and its function is to generate a single bus from\
    \ the input of two or more data buses. The opposite block is called `Demux`. This\
    \ block is useful for plotting in a single channel of a scope. We simply select\
    \ all the variables of interest from different blocks in order to send them to\
    \ the scope by using a `Mux`. See Figure [4-18](#504209_1_En_4_Chapter.xhtml#Fig18).\n\
    \n![../images/504209_1_En_4_Chapter/504209_1_En_4_Fig18_HTML.jpg](images/504209_1_En_4_Chapter/504209_1_En_4_Fig18_HTML.jpg)\n\
    \nFigure 4-18  \n`Mux` block\n\nIts inputs are several buses of *n* variables\
    \ each, and its output is a single bus with all the collected variables from all\
    \ the input buses.\n\nIts only parameter of interest for our applications is the\
    \ number of input buses, as indicated in Figure [4-19](#504209_1_En_4_Chapter.xhtml#Fig19).\n\
    \n![../images/504209_1_En_4_Chapter/504209_1_En_4_Fig19_HTML.jpg](images/504209_1_En_4_Chapter/504209_1_En_4_Fig19_HTML.jpg)\n\
    \nFigure 4-19"
  raw: "### Required Blocks\n\nThe Simulink blocks here described have at least one\
    \ of the following three properties: an input signal, an output signal, and a\
    \ way for setting up their own parameters. See Figure [4-7](#504209_1_En_4_Chapter.xhtml#Fig7).\n\
    \n![../images/504209_1_En_4_Chapter/504209_1_En_4_Fig7_HTML.jpg](images/504209_1_En_4_Chapter/504209_1_En_4_Fig7_HTML.jpg)\n\
    \nFigure 4-7\n\nProperties of a Simulink block\n\nThese are the seven most usable\
    \ blocks for our purposes.\n\n**Interpreted MATLAB function**: This block is used\
    \ to link the text file containing the dynamic model of the system and its controller\
    \ with the block file. See Figure [4-8](#504209_1_En_4_Chapter.xhtml#Fig8).\n\n\
    ![../images/504209_1_En_4_Chapter/504209_1_En_4_Fig8_HTML.jpg](images/504209_1_En_4_Chapter/504209_1_En_4_Fig8_HTML.jpg)\n\
    \nFigure 4-8\n\nInterpreted MATLAB function block\n\nThe input of this block is\
    \ a bus or data channel with *n* signals (states, time, auxiliary values, etc.).\
    \ The output of this block is also a bus or data channel with *m* signals (states,\
    \ auxiliary values, signals to be plotted, etc.).\n\nThe important properties\
    \ of this block in which we are interested are (do not modify the other properties):\n\
    \n1.  The name of the file that contains the dynamic model of the system and its\
    \ controller. This name must be identical to the text file that contains said\
    \ model and without the file extension.\n\n2.  The size of the output bus (measured\
    \ in the number of variables).\n\nOnce these parameters have been modified, just\
    \ click OK and close the block’s dialog box. See Figure [4-9](#504209_1_En_4_Chapter.xhtml#Fig9).\n\
    \n![../images/504209_1_En_4_Chapter/504209_1_En_4_Fig9_HTML.jpg](images/504209_1_En_4_Chapter/504209_1_En_4_Fig9_HTML.jpg)\n\
    \nFigure 4-9\n\nInterpreted MATLAB function block parameters\n\nNote that we use\
    \ the previous block for practicality, but you should also investigate the MATLAB\
    \ Function and the S-function blocks.\n\n**Integrator**: It allows integrating\
    \ a bus of signals. See Figure [4-10](#504209_1_En_4_Chapter.xhtml#Fig10).\n\n\
    ![../images/504209_1_En_4_Chapter/504209_1_En_4_Fig10_HTML.jpg](images/504209_1_En_4_Chapter/504209_1_En_4_Fig10_HTML.jpg)\n\
    \nFigure 4-10\n\nIntegrator block\n\nThis block is used to integrate signals.\
    \ In Simulink, there are different types of integrators, but for our purposes,\
    \ this is the one that we use.\n\nThe input of this block is a bus or data channel\
    \ with *n* signals (the derivatives of the system states, for example).\n\nThe\
    \ output of this block is also a bus or data channel with *n* signals (the system\
    \ states, for example).\n\nThe only parameter that we are interested in modifying\
    \ is the initial conditions or the starting point of our system to simulate. If\
    \ this is a single equation, just write a scalar. If there is more than one equation,\
    \ the initial values must be introduced as follows: [val1 val2 val3 valN].\n\n\
    Once this parameter has been modified, we just click OK and close the properties\
    \ dialog box. See Figure [4-11](#504209_1_En_4_Chapter.xhtml#Fig11).\n\n![../images/504209_1_En_4_Chapter/504209_1_En_4_Fig11_HTML.jpg](images/504209_1_En_4_Chapter/504209_1_En_4_Fig11_HTML.jpg)\n\
    \nFigure 4-11\n\nIntegrator block parameters\n\n**Scope**: This block allows seeing\
    \ the graphs of our simulation directly in the block-diagram file, either during\
    \ the simulation or at the end of it. See Figure [4-12](#504209_1_En_4_Chapter.xhtml#Fig12).\n\
    \n![../images/504209_1_En_4_Chapter/504209_1_En_4_Fig12_HTML.jpg](images/504209_1_En_4_Chapter/504209_1_En_4_Fig12_HTML.jpg)\n\
    \nFigure 4-12\n\nScope block\n\nThis block does not have outputs. Its inputs are\
    \ buses with *n* signals to be plotted. Its relevant parameters are as follows:\n\
    \n![../images/504209_1_En_4_Chapter/504209_1_En_4_Fig13_HTML.jpg](images/504209_1_En_4_Chapter/504209_1_En_4_Fig13_HTML.jpg)\n\
    \nFigure 4-13\n\nScope block parameters\n\n1.  **The autoscale button**: This\
    \ is useful to adjust the graph at the end or during the simulation.\n\n2.  **The\
    \ properties button**: When this button is pressed, an auxiliary menu will appear.\
    \ We are only interested in two options:\n    *   **The number of input axes**:\
    \ This determines how many independent graphs there will be in the scope. Each\
    \ input to the scope will be an independent bus of n variables. This option is\
    \ accessed from the General menu.\n\n*   **The limit data checkbox**: This is\
    \ usually activated, and it only displays the last 5,000 data points. If you want\
    \ to see an extensive simulation, you must deactivate this checkbox. This option\
    \ is accessed from the History menu. See Figure [4-13](#504209_1_En_4_Chapter.xhtml#Fig13).\n\
    \nAs in the previous cases, you must click OK and close the auxiliary menus in\
    \ order to save the modifications.\n\nYou can also experiment with the Style menu\
    \ of the Scope parameters if you want to modify the presentation and the colors\
    \ of the plot.\n\n**To Workspace block**: This block allows using specific data\
    \ outside the Simulink interface in order to carry out further processing or editing\
    \ (for example, exporting the plots for editing their graphs to be used in a publication).\
    \ See Figure [4-14](#504209_1_En_4_Chapter.xhtml#Fig14).\n\n![../images/504209_1_En_4_Chapter/504209_1_En_4_Fig14_HTML.jpg](images/504209_1_En_4_Chapter/504209_1_En_4_Fig14_HTML.jpg)\n\
    \nFigure 4-14\n\nTo Workspace block\n\nThis block only has an input, which is\
    \ a data bus.\n\nIts parameters of interest for our purposes are only two:\n\n\
    ![../images/504209_1_En_4_Chapter/504209_1_En_4_Fig15_HTML.jpg](images/504209_1_En_4_Chapter/504209_1_En_4_Fig15_HTML.jpg)\n\
    \nFigure 4-15\n\nTo Workspace block parameters\n\n1.  The name of the variable\
    \ that will be used from the MATLAB console for editing the information\n\n2.\
    \  The type of the output data. In our case and for a simplified data access,\
    \ this must always be an array. See Figure [4-15](#504209_1_En_4_Chapter.xhtml#Fig15).\n\
    \n**Selector**: This block is used for selecting one or more signals from a bus.\
    \ See Figure [4-16](#504209_1_En_4_Chapter.xhtml#Fig16).\n\n![../images/504209_1_En_4_Chapter/504209_1_En_4_Fig16_HTML.jpg](images/504209_1_En_4_Chapter/504209_1_En_4_Fig16_HTML.jpg)\n\
    \nFigure 4-16\n\nSelector block\n\nThe input to the block is a data bus with n\
    \ variables. Its output is another bus with p variables, where p goes from just\
    \ one signal to the n signals. The size of p will simply depend on which signals\
    \ you want to extract.\n\nIts parameters of interest are\n\n![../images/504209_1_En_4_Chapter/504209_1_En_4_Fig17_HTML.jpg](images/504209_1_En_4_Chapter/504209_1_En_4_Fig17_HTML.jpg)\n\
    \nFigure 4-17\n\nSelector block parameters\n\n1.  The output signal index in scalar\
    \ format if only one signal is chosen, or in the vector format [val1 val2 val3\
    \ valN] if more than one signal is required.\n\n2.  The size of the input bus.\
    \ See Figure [4-17](#504209_1_En_4_Chapter.xhtml#Fig17).\n\nLet's analyze the\
    \ given example. Note that it is graphically intuitive. The block in the figure\
    \ receives a data bus with three variables, and its output is another bus with\
    \ two variables, specifically the first and third values of the input bus.\n\n\
    **Mux**: It is a multiplexer and its function is to generate a single bus from\
    \ the input of two or more data buses. The opposite block is called Demux. This\
    \ block is useful for plotting in a single channel of a scope. We simply select\
    \ all the variables of interest from different blocks in order to send them to\
    \ the scope by using a Mux. See Figure [4-18](#504209_1_En_4_Chapter.xhtml#Fig18).\n\
    \n![../images/504209_1_En_4_Chapter/504209_1_En_4_Fig18_HTML.jpg](images/504209_1_En_4_Chapter/504209_1_En_4_Fig18_HTML.jpg)\n\
    \nFigure 4-18\n\nMux block\n\nIts inputs are several buses of *n* variables each,\
    \ and its output is a single bus with all the collected variables from all the\
    \ input buses.\n\nIts only parameter of interest for our applications is the number\
    \ of input buses, as indicated in Figure [4-19](#504209_1_En_4_Chapter.xhtml#Fig19).\n\
    \n![../images/504209_1_En_4_Chapter/504209_1_En_4_Fig19_HTML.jpg](images/504209_1_En_4_Chapter/504209_1_En_4_Fig19_HTML.jpg)\n\
    \nFigure 4-19"
  trans: "\n### 所需模块\n\n这里描述的 Simulink 模块至少具有以下三个属性之一：输入信号、输出信号以及设置自身参数的方式。见图 4-7。\n\
    \n![../images/504209_1_En_4_Chapter/504209_1_En_4_Fig7_HTML.jpg](img/504209_1_En_4_Fig7_HTML.jpg)\n\
    \n图 4-7  \nSimulink 模块的属性\n\n以下七个模块是我们最常用的。\n\n### Interpreted MATLAB Function\n\
    \n此模块用于将包含系统动力学模型及其控制器的文本文件与模块文件链接起来。见图 4-8。\n\n![../images/504209_1_En_4_Chapter/504209_1_En_4_Fig8_HTML.jpg](img/504209_1_En_4_Fig8_HTML.jpg)\n\
    \n图 4-8  \n`Interpreted MATLAB Function` 模块\n\n此模块的输入是一个包含 *n* 个信号（状态、时间、辅助值等）的总线或数据通道。其输出也是一个包含\
    \ *m* 个信号（状态、辅助值、待绘制信号等）的总线或数据通道。\n\n我们关心的该模块重要属性如下（请勿修改其他属性）：\n\n1.  包含系统动力学模型及其控制器的文件名。此名称必须与包含所述模型的文本文件名称一致，且不包含文件扩展名。\n\
    2.  输出总线的大小（以变量数量衡量）。\n\n修改完这些参数后，只需点击`OK`并关闭模块的对话框即可。见图 4-9。\n\n![../images/504209_1_En_4_Chapter/504209_1_En_4_Fig9_HTML.jpg](img/504209_1_En_4_Fig9_HTML.jpg)\n\
    \n图 4-9  \n`Interpreted MATLAB Function` 模块参数\n\n请注意，我们使用前面的模块是为了实用，但您也应该研究一下\
    \ `MATLAB Function` 和 `S-function` 模块。\n\n### Integrator\n\n用于对信号总线进行积分。见图 4-10。\n\
    \n![../images/504209_1_En_4_Chapter/504209_1_En_4_Fig10_HTML.jpg](img/504209_1_En_4_Fig10_HTML.jpg)\n\
    \n图 4-10  \n`Integrator` 模块\n\n此模块用于对信号进行积分。在 Simulink 中有不同类型的积分器，但就我们的目的而言，这是我们要用的一个。\n\
    \n此模块的输入是一个包含 *n* 个信号（例如，系统状态的导数）的总线或数据通道。  \n其输出也是一个包含 *n* 个信号（例如，系统状态）的总线或数据通道。\n\
    \n我们唯一需要修改的参数是初始条件，即我们系统仿真的起始点。如果只有一个方程，只需输入一个标量。如果有多个方程，则必须按如下方式输入初始值：`[val1\
    \ val2 val3 valN]`。\n\n修改完此参数后，我们只需点击`OK`并关闭属性对话框。见图 4-11。\n\n![../images/504209_1_En_4_Chapter/504209_1_En_4_Fig11_HTML.jpg](img/504209_1_En_4_Fig11_HTML.jpg)\n\
    \n图 4-11  \n`Integrator` 模块参数\n\n### Scope\n\n此模块允许我们在仿真期间或仿真结束时，直接在模块框图中查看仿真的图形。见图\
    \ 4-12。\n\n![../images/504209_1_En_4_Chapter/504209_1_En_4_Fig12_HTML.jpg](img/504209_1_En_4_Fig12_HTML.jpg)\n\
    \n图 4-12  \n`Scope` 模块\n\n此模块没有输出。其输入是包含待绘制 *n* 个信号的总线。其相关参数如下：\n\n![../images/504209_1_En_4_Chapter/504209_1_En_4_Fig13_HTML.jpg](img/504209_1_En_4_Fig13_HTML.jpg)\n\
    \n图 4-13  \n`Scope` 模块参数\n\n1.  **自动缩放按钮**：用于在仿真结束或期间调整图形。\n2.  **属性按钮**：按下此按钮将出现一个辅助菜单。我们只关心两个选项：\n\
    \    -   **输入轴数**：决定示波器中有多少个独立的图形。示波器的每个输入都是一个包含 *n* 个变量的独立总线。此选项通过**通用**菜单访问。\n\
    \    -   **限制数据复选框**：该复选框通常处于激活状态，仅显示最近 5,000 个数据点。如果您想查看长时间的仿真，则必须取消勾选此复选框。此选项通过**历史记录**菜单访问。见图\
    \ 4-13。\n\n与之前的情况一样，您必须点击`OK`并关闭辅助菜单以保存修改。\n\n如果您想修改图形的外观和颜色，也可以尝试 `Scope` 参数中的**样式**菜单。\n\
    \n### To Workspace 模块\n\n此模块允许在 Simulink 界面之外使用特定数据，以进行进一步处理或编辑（例如，导出图形以编辑其图表，用于出版物）。见图\
    \ 4-14。\n\n![../images/504209_1_En_4_Chapter/504209_1_En_4_Fig14_HTML.jpg](img/504209_1_En_4_Fig14_HTML.jpg)\n\
    \n图 4-14  \n`To Workspace` 模块\n\n此模块只有一个输入，即一个数据总线。\n\n对我们来说，其相关的参数只有两个：\n\n![../images/504209_1_En_4_Chapter/504209_1_En_4_Fig15_HTML.jpg](img/504209_1_En_4_Fig15_HTML.jpg)\n\
    \n图 4-15  \n`To Workspace` 模块参数\n\n1.  将从 MATLAB 控制台用于编辑信息的变量名。\n2.  输出数据的类型。在我们这里，为了简化数据访问，必须始终为\
    \ `array`。见图 4-15。\n\n### Selector\n\n此模块用于从总线中选择一个或多个信号。见图 4-16。\n\n![../images/504209_1_En_4_Chapter/504209_1_En_4_Fig16_HTML.jpg](img/504209_1_En_4_Fig16_HTML.jpg)\n\
    \n图 4-16  \n`Selector` 模块\n\n模块的输入是一个包含 *n* 个变量的数据总线。其输出是另一个包含 *p* 个变量的总线，其中 *p*\
    \ 的范围是从一个信号到全部 *n* 个信号。*p* 的大小完全取决于您想要提取哪些信号。\n\n其相关参数为：\n\n![../images/504209_1_En_4_Chapter/504209_1_En_4_Fig17_HTML.jpg](img/504209_1_En_4_Fig17_HTML.jpg)\n\
    \n图 4-17  \n`Selector` 模块参数\n\n1.  输出信号索引，如果只选择一个信号，则使用标量格式；如果需要多个信号，则使用向量格式 `[val1\
    \ val2 val3 valN]`。\n2.  输入总线的大小。见图 4-17。\n\n我们来分析给定的示例。请注意，它在图形上很直观。图中的模块接收一个包含三个变量的数据总线，其输出是另一个包含两个变量的总线，具体来说是输入总线的第一个和第三个值。\n\
    \n### Mux\n\n它是一个多路复用器，其功能是从两个或多个数据总线的输入生成单个总线。相反的模块称为 `Demux`。此模块对于在示波器的单个通道中绘图非常有用。我们只需从不同模块中选择所有感兴趣的变量，然后使用\
    \ `Mux` 将它们发送到示波器。见图 4-18。\n\n![../images/504209_1_En_4_Chapter/504209_1_En_4_Fig18_HTML.jpg](img/504209_1_En_4_Fig18_HTML.jpg)\n\
    \n图 4-18  \n`Mux` 模块\n\n其输入是几个各包含 *n* 个变量的总线，其输出是一个包含来自所有输入总线的所有收集变量的单个总线。\n\n\
    对于我们的应用，其唯一相关的参数是输入总线的数量，如图 4-19 所示。\n\n![../images/504209_1_En_4_Chapter/504209_1_En_4_Fig19_HTML.jpg](img/504209_1_En_4_Fig19_HTML.jpg)\n\
    \n图 4-19\n"
- fmt: "# Mux block parameters\n\n**Clock**: This is very useful for defining trajectories\
    \ (time-variant functions). This block does not have inputs, and its only output\
    \ is the simulation time (this time is not real-time). See Figure [4-20](#504209_1_En_4_Chapter.xhtml#Fig20).\n\
    \n![../images/504209_1_En_4_Chapter/504209_1_En_4_Fig20_HTML.jpg](images/504209_1_En_4_Chapter/504209_1_En_4_Fig20_HTML.jpg)\n\
    \nFigure 4-20  \nClock block\n\nFor the purposes of this book, this block does\
    \ not have parameters that must be modified.\n\n**Other blocks that may be useful**:\
    \ For more information, refer to the gain block, the derivative block, the sum\
    \ block, the constant block, the math function block, the goto labels, and the\
    \ saturation block, among many others.\n\nNow that you know how to work with blocks,\
    \ state space variables, and the basic blocks that we will use with MATLAB, we\
    \ can start with our simulations.\n\n## Quadcopter Example, Text File\n\nNote\
    \ that this file would be enough if we wanted to simulate our drone and we only\
    \ had a basic programming language such as C++ or Python, of course by incorporating\
    \ an ODE solver.\n\nRemember that the model will be as precise as you want by\
    \ adding more dynamic effects. In this case, we will use the previous models that\
    \ have no aerodynamic effects, but they serve to test some details in the control\
    \ design, such as the fact that planar PDs cannot exceed the value of 2Pi (remember\
    \ that these PDs represent desired angles and they cannot reach values greater\
    \ than 2Pi). One way to improve the model is by adding more effects or by inducing\
    \ noise in the states by means of random functions, or even by creating a delay\
    \ in the signals to simulate the behavior of the sensors. The text file called\
    \ `quadmodel.m` is displayed in Listing [4-1](#504209_1_En_4_Chapter.xhtml#PC1).\n\
    \n```\nfunction outp=quadmodel(inpt)\n% system inputs: states and time\n% x1-x,\
    \ x2-xdot, x3-y, x4-ydot, x5-z, x6-zdot\n% x7-theta, x8-thetadot, x9-phi, x10-phidot,\
    \ x11-psi, x12-psidot\nx1=inpt(1);\nx2=inpt(2);\nx3=inpt(3);\nx4=inpt(4);\nx5=inpt(5);\n\
    x6=inpt(6);\nx7=inpt(7);\nx8=inpt(8);\nx9=inpt(9);\nx10=inpt(10);\nx11=inpt(11);\n\
    x12=inpt(12);\nt=inpt(13);\n% constant parameters: mass, inertial values, gravity\n\
    m=1;\ng=9.8;\nJx=0.2;\nJy=0.2;\nJz=0.2;\n% control gains: notice the small values\
    \ at x and y gains because they\n% define an angle\nkpx=0.1;\nkdx=0.09;\nkpy=0.1;\n\
    kdy=0.09;\nkpz=1;\nkdz=0.7;\nkptet=3;\nkdtet=1;\nkpfi=3;\nkdfi=1;\nkppsi=3;\n\
    kdpsi=1;\n% planar desired values\nx1d=5;\nx2d=0;\nx3d=-6;\nx4d=0;\n% planar PD:\
    \ remember that these PD define desired angular values\nPDx=(kpx*(x1d-x1))+(kdx*(x2d-x2));\n\
    PDy=(kpy*(x3d-x3))+(kdy*(x4d-x4));\n% altitude and attitude desired values\nx5d=8+sin(t);\n\
    x6d=cos(t);\nx7d=PDx;\nx8d=0;\nx9d=-PDy;\nx10d=0;\nx11d=0;\nx12d=0;\n% altitude\
    \ and attitude PDs\nPDz=(kpz*(x5d-x5))+(kdz*(x6d-x6));\nPDteta=(kptet*(x7d-x7))+(kdtet*(x8d-x8));\n\
    PDfi=(kpfi*(x9d-x9))+(kdfi*(x10d-x10));\nPDpsi=(kppsi*(x11d-x11))+(kdpsi*(x12d-x12));\n\
    % vehicle's forces and torques\nFbz=PDz+(m*g);\ntaoteta=PDteta;\ntaofi=PDfi;\n\
    taopsi=PDpsi;\n% vehicle's dynamic model xp notation implies xdot or xpoint or\
    \ x\n% derivative\nx1p=x2;\nx2p=(Fbz/m)*((x7*cos(x11d))+(x9*sin(x11d)));\nx3p=x4;\n\
    x4p=(Fbz/m)*((x7*sin(x11d))-(x9*cos(x11d)));\nx5p=x6;\nx6p=(Fbz/m)-g;\nx7p=x8;\n\
    x8p=taoteta/Jy;\nx9p=x10;\nx10p=taofi/Jx;\nx11p=x12;\nx12p=taopsi/Jz;\n% output:\
    \ derivatives of the system states and vehicle's force and\n% torques\noutp=[x1p;x2p;x3p;x4p;x5p;x6p;x7p;x8p;x9p;x10p;x11p;x12p;Fbz;taoteta;taofi;taopsi];\n\
    end\n```\n\nListing 4-1  \nQuadmodel Code, a Controller with a Desired Yaw Value\
    \ Equal to Zero\n\n**Attention**: The name of the textfile that contains the dynamic\
    \ model of the system (the one with the `.m` extension) must be identical to the\
    \ word that we wrote in the function line, as indicated in Figure [4-21](#504209_1_En_4_Chapter.xhtml#Fig21).\n\
    \n![../images/504209_1_En_4_Chapter/504209_1_En_4_Fig21_HTML.jpg](images/504209_1_En_4_Chapter/504209_1_En_4_Fig21_HTML.jpg)\n\
    \nFigure 4-21  \nText file for the interpreted MATLAB function block `quadmodel.m`\n\
    \nRemember that as an alternative to MATLAB and Simulink, you can use Scilab,\
    \ which has a block simulator called Scicos or Xcos depending on the version.\
    \ Scilab is a free software tool and you must search for the equivalent of the\
    \ seven blocks shown here (for example, the Scicos user defined functions).\n\n\
    ## Quadcopter Example, Block File\n\nIn the following block file called `blockquad.slx`\
    \ (see Figure [4-22](#504209_1_En_4_Chapter.xhtml#Fig22); in Simulink versions\
    \ prior to the 2013a, the extension is `.mdl`), we have used all of the seven\
    \ basic blocks previously mentioned. Note that the complexity of the model remains\
    \ in the text file. For this reason, the number of blocks is reduced. This block\
    \ file can be used as a template for any other model. It only changes the size\
    \ of the buses and the text file that contains the system.\n\n![../images/504209_1_En_4_Chapter/504209_1_En_4_Fig22_HTML.jpg](images/504209_1_En_4_Chapter/504209_1_En_4_Fig22_HTML.jpg)\n\
    \nFigure 4-22  \nBlock file for using the interpreted MATLAB function block, `blockquad.slx`\n\
