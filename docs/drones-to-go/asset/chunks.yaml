    we will have


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figbe_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Figbe_HTML.jpg)


    Applying the smooth flight conditions, translational dynamics is simplified in
    this way (note that a simplification of the translational kinematics is implicit).
    Observe that this smooth flight only applies to roll and pitch angles, while the
    yaw angle can be commanded arbitrary and obeys a desired value.


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figbf_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Figbf_HTML.jpg)


    Note that these sine simplifications for small angles were applied for convenience.
    If we used the other simplification, we would only have zeros and there would
    be no equations to interact with.


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figbg_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Figbg_HTML.jpg)


    At rotational level, we have the following dynamic model:


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figbh_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Figbh_HTML.jpg)


    And because of the smooth flight, slow angular velocities is simplified in this
    way:


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figbi_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Figbi_HTML.jpg)


    It is worth analyzing whether it is feasible to express this equation directly
    in the fixed frame or not. For this, it is necessary to project torques and angular
    velocities from the vehicle frame to the fixed frame. We will use the kinematic
    relationship previously deduced:


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figbj_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Figbj_HTML.jpg)


    This is simplified as follows:


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figbk_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Figbk_HTML.jpg)


    Here these approximations for small angles were used for convenience:


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figbl_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Figbl_HTML.jpg)


    This is because what is desired here is to disappear terms and not keep them for
    further analysis.


    Returning to the dynamic rotational model developed in the frame of the vehicle,
    we do the following to bring it to the fixed frame:


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figbm_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Figbm_HTML.jpg)


    For the angular velocities, we must carry out the following operations:


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figbn_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Figbn_HTML.jpg)


    But remember that (and remember that the inverse of an identity matrix is also
    an identity matrix):


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figbo_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Figbo_HTML.jpg)


    Therefore,


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figbp_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Figbp_HTML.jpg)


    In this way, the rotational dynamics in the vehicle frame become the same as in
    the fixed frame.


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figbq_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Figbq_HTML.jpg)


    In short, the smooth flight simplification altered the original set of equations
    as indicated in Figures [2-26](#504209_1_En_2_Chapter.xhtml#Fig26), [2-27](#504209_1_En_2_Chapter.xhtml#Fig27),
    and [2-28](#504209_1_En_2_Chapter.xhtml#Fig28).


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Fig27_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Fig27_HTML.jpg)


    Figure 2-27


    Linear simplifications for dynamics


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Fig26_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Fig26_HTML.jpg)


    Figure 2-26


    Linear simplifications for kinematics


    Note that the changes were done in the kinematic relationships and of course in
    the dynamics, but the propulsion equations remain the same (keep in mind that
    if your vehicle has a thrust vectoring system, the allocation matrix will also
    change).


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Fig28_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Fig28_HTML.jpg)


    Figure 2-28


    Linear simplifications for the allocation matrix (in this example, the equations
    remain the same)


    ## Summary


    In this chapter, you learned the generic model of drones with a particular but
    not exclusive approach to quadcopters. The chapter explained the frames of modeling,
    the kinematic and dynamic equations of rotational and translational types, the
    generic modeling of a propeller, the allocation or propulsion model, and finally
    some linear simplifications that will be useful in the next chapter. These topics
    are very common in different books and articles about drones. Again, you are invited
    to explore the Appendix if you want to deepen your knowledge on the topics learned.
    In the next chapter, you will see topics related to the design of controllers
    seen as two types of families: vehicle mode (or first-person view or on-board
    control mode) and robot mode (or third-person view or external control mode).'
