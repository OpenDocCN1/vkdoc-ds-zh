    ## 总结


    在本章中，您学习了使用 MATLAB 和 Simulink 工具模拟无人机行为和控件的不同方法。但是，我们以这样一种方式向您呈现，以便您可以将学到的知识用于其他工具和编程语言。本章的结论是，为了模拟飞行器以及一般的任何系统，您至少需要三个程序：包含其控制代码的动力学模型、用于方程组的数值求解器以及一个执行环境。如果您想要包含图形或用户交互，文中提到了一些选项，但最终，在任何情况下，您都将需要了解上述三个程序的基本概念。附录中对这些知识进行了补充。在下一章中，您将看到侧重于信号处理、高级
    UART 通信和 SDK 编程的实现细节。


    # 5. 实现


    本章具有科学和创客方面的影响力，您将学习到许多出版物中也忽略的主题，这些主题涉及核心实现细节，例如传感器和执行器的信号处理、数据传输、无人机编程方式，以及一个包含最流行软件开发接口中使用的主要命令的词汇表。因此，您将能够简明地理解如何对无人机或任何其他机器人车辆进行编程。您还将能够通过附录中精选的参考文献来提升您的知识水平。

    '
- fmt: '# Tasks of a Drone


    There are six basic tasks of a drone:


    - **Motor**: This is the most basic and important task. In general, it consists
    of an automatic open loop control that is a function of other closed loop controllers
    of the vehicle. The speed of each motor is modified, having an effect on the behavior
    of the drone. This task is the one that presents the fastest variation and consequently
    needs a high frequency update. Motors must receive the propulsion or allocation
    matrix in an automatic way.


    - **Attitude or orientation**: This is the second most relevant task (also in
    the frequency of execution). It is more important than the altitude task because
    it implies that the aircraft is adequately balanced. If this was not the case,
    the drone could move randomly around the plane and in the worst case fall down.
    Due to the relevance in the flight of the vehicle, it is usually a fully automatic
    closed loop.


    - **Altitude or elevation**: This is the third in importance because any aircraft
    implies being able to float. For this reason, people with an introductory knowledge
    believe that this task is the most important, but as we already indicated, lack
    of balance tends to destabilize the drone. It is usually an automatic closed loop,
    but you can give it a semi-automatic behavior through the remote control.


    - **Planar**: This is the fourth in relevance. It involves controlling the drone
    position, which is perpendicular to the elevation axis (the position that the
    aircraft keeps along the ground). This task can also be automatic or semi-automatic.


    - **Trajectory planning**: In this case, this is the simultaneous variation of
    the attitude, altitude, and planar tasks. This variation is carried out as a function
    of the time or a specific point-to-point path. It can be automatic or semi-automatic.
    Basically it is the navigation through a collection of points.


    - **Remote control**: This is the manual component of the flight tasks. It is
    a human closed loop control because the pilot is the one who regulates the error
    according to the measurement provided by their sight and the action of the control
    buttons. Since the action is human-dependent, this task is as slow and imprecise
    as the pilot’s abilities. Its use with the other tasks gives them a semi-automatic
    mode. In some cases, the pilot only alters the desired values and in others modifies
    directly the effect of the control. It is not recommended that the remote control
    directly modifies the orientation tasks (buttons and sticks move slower and more
    abrupt than the required automatic attitude action).


    Now that you know about the tasks of a drone, let’s talk about the kind of controllers
    that they use.


    # Loops and Kinds of Controllers for a Drone


    A quadcopter is a system that serves as a good example to describe various types
    of controllers and control loops. They are covered in the following sections.


    ## Control Loops


    ### Open and Closed Loops


    In general, the altitude, planar position, and orientation of a drone are closed
    loops, which means that their error correction is based on feedback. However,
    there is a task that depends on an open loop. It is the speed control of the motors.
    An open loop is the one where the task is executed more as an effect of proportionality
    than by error correction. In the case of the motors, a voltage is sent and we
    observe a proportional motor speed without having a closed loop to verify and
    correct this speed.


    ### Inner and Outer Loops


    A quadcopter has four motors, and due to their geometric configuration, it can
    directly control four variables, which are the altitude and the attitude (its
    three orientations). This is called an inner loop. However, as it is required
    that the vehicle can also move in the XY plane, this is done in a dependent way
    with respect to the roll and pitch orientations in an outer control loop.


    ### Dependent and Independent Loops


    The independent loops occur in all the variables whose control does not require
    the monitoring of an additional variable; examples are the altitude control and
    the yaw control. On the other hand, the dependent loops require the information
    of one or more additional variables; examples are the controls of X and Y that
    depend on the vehicle’s orientation.


    ### Pose and Speed Loops


    A quadcopter is a vehicle whose pose loops (orientation and position) depend on
    the speed open loop of each one of its motors. Servomotors are pose actuators,
    and brushless DC motors are usually speed actuators.


    ## Kinds of Controllers


    ### Model-Free and Non–Model-Free Controllers


    Certain variables such as the roll, pitch, and yaw orientations could be regulated
    with a "simple" PD controller. This means that compensation for their partial
    or full dynamics is not required. On the other hand, when controlling the altitude,
    it is necessary to introduce a compensation element for the vehicle''s weight
    (a partial non–model-free controller).


    ### Robust and Adaptive Controllers


    In the case of the regulated variables by using PDs without any type of compensation,
    it is assumed that the PDs are large enough with respect to the vehicle dynamics.
    In this case, the control is called dominant or robust (as long as the motors
    allow this robustness). Another example of robust controllers are the sliding
    mode family. Basically they don''t require the model of the system, just the error
    loop. In the case of the altitude, as the weight is compensated, this is a very
    rudimentary example of adaptive control. However, if the PD gains are large enough
    and the motors can counteract this effect by themselves, the compensatory term
    can be omitted. Generally, adaptive controllers are designed to compensate partial
    or full dynamics or unmodeled perturbations.


    ### Unrestricted and Bounded Controls


    An unrestricted control is the one that can use an unlimited range of values,
    such as all the positive and negative values. This kind of control does not exist
    but you can think that is a viable option because of the simulators. On the other
    hand, bounded controllers introduce operating limits. The first bounded control
    found in a quadcopter is given by the motors since they have maximum and minimum
    values of speed and torque. The second bounded control is very noticeable when
    using brushless motors (assuming they are not bidirectional). This is the presence
    of exclusively positive operating values. And the last bounded control, not so
    evident in drones, is determined by physical effects such as the response time.


    In the first restriction, saturations are used. In the second, scaling factors
    are required. In the third, delay control techniques are used. The last effect
    is not so evident on regular drones due to the fast response of autopilots and
    computers, and is usually omitted, but in aircraft that use bidirectional propellers,
    it is relevant to consider these delays since the propellers do not change their
    sense of rotation instantaneously.


    ### Linear and Nonlinear Control


    This kind of control is determined by the operating conditions. You saw some flight
    modes where the motion is smooth and the angles are restricted to a small vicinity
    around zero, so it was a right decision to linearize both the model and the controller.
    However, we also described some flight-modes where the angles are not bounded
    and the vehicle can perform aggressive motions; therefore the control and the
    model have non-linearities.


    ### Continuous Operation and Based on Events


    In this case, a control that is always continuous and that must be present throughout
    the full operation of the aircraft is the attitude controller. The one that depends
    on events, like time-based signals or the interaction with the remote controller,
    is the trajectory control.'
  raw: '## Tasks of a Drone


    There are six basic tasks of a drone:


    *   **Motor** : This is the most basic and important task. In general, it consists
    of an automatic open loop control that is a function of other closed loop controllers
    of the vehicle. The speed of each motor is modified, having an effect on the behavior
    of the drone. This task is the one that presents the fastest variation and consequently
    needs a high frequency update. Motors must receive the propulsion or allocation
    matrix in an automatic way.


    *   **Attitude or orientation** : This is the second most relevant task (also
    in the frequency of execution). It is more important than the altitude task because
    it implies that the aircraft is adequately balanced. If this was not the case,
    the drone could move randomly around the plane and in the worst case fall down.
    Due to the relevance in the flight of the vehicle, it is usually a fully automatic
    closed loop.


    *   **Altitude or elevation** : This is the third in importance because any aircraft
    implies being able to float. For this reason, people with an introductory knowledge
    believe that this task is the most important, but as we already indicated, lack
    of balance tends to destabilize the drone. It is usually an automatic closed loop,
    but you can give it a semi-automatic behavior through the remote control.


    *   **Planar** : This is the fourth in relevance. It involves controlling the
    drone position, which is perpendicular to the elevation axis (the position that
    the aircraft keeps along the ground). This task can also be automatic or semi-automatic.


    *   **Trajectory planning** : In this case, this is the simultaneous variation
    of the attitude, altitude, and planar tasks. This variation is carried out as
    a function of the time or a specific point-to-point path. It can be automatic
    or semi-automatic. Basically it is the navigation through a collection of points.


