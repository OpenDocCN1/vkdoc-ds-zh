- fmt: "### Forces Acting on the Vehicle\n\nBased on the previous conclusion, we will\
    \ transfer the forces of each propeller to the center of the vehicle. See Figure\
    \ [2-15](#504209_1_En_2_Chapter.xhtml#Fig15).\n\n![../images/504209_1_En_2_Chapter/504209_1_En_2_Fig15_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Fig15_HTML.jpg)\n\
    \n**Figure 2-15**  \nForces and torques generated by each propeller with respect\
    \ to the center of a quadcopter, and the corresponding vehicle frame for this\
    \ analysis\n\nFor this example and for the expected results, we will do it as\
    \ in the case of Figure [2-15](#504209_1_En_2_Chapter.xhtml#Fig15). Pay attention\
    \ to the fact that the labeling and the direction of the Cartesian axes, as well\
    \ as the numbering of the motors, and their sense of rotation, and even their\
    \ geometric distribution, influence what we will see and is known as allocation\
    \ or propulsion matrix. Also notice that half of the motors rotate clockwise with\
    \ respect to the other half, in order to prevent autorotation (which implies that\
    \ the vehicle rotates in an undesired way around its main axis). This could happen\
    \ if all the motors or most of them rotate in one sense (clockwise or counterclockwise).\n\
    \nAnalyzing the forces on the `Zb` axis, we have:\n\n![../images/504209_1_En_2_Chapter/504209_1_En_2_Figw_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Figw_HTML.jpg)\n\
    \nConsidering a well-balanced vehicle with well-balanced propellers, in the `Yb`\
    \ and `Xb` axes there are no forces acting directly on them, just torques, therefore:\n\
    \n![../images/504209_1_En_2_Chapter/504209_1_En_2_Figx_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Figx_HTML.jpg)\n\
    \nNotice that there are conditions where these forces are present and they cannot\
    \ be canceled out from the model. However, these effects usually appear in large\
    \ aircraft and they can be simplified by means of mathematical transformations\
    \ or control compensation. See Reza-Olfati’s article in the Appendix.\n\nLet’s\
    \ continue with the torques. The first thing to do is to establish a positive\
    \ sense of rotation, as illustrated in Figure [2-16](#504209_1_En_2_Chapter.xhtml#Fig16).\n\
    \n![../images/504209_1_En_2_Chapter/504209_1_En_2_Fig16_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Fig16_HTML.jpg)\n\
    \n**Figure 2-16**  \nForces and torques generated by each propeller with respect\
    \ to the center of a quadcopter, and a sense of positive rotation for this analysis\n\
    \nObserve that in the case of the torque around the `Zb` axis, this is directly\
    \ induced by the individual torques of each motor. See Figure [2-17](#504209_1_En_2_Chapter.xhtml#Fig17).\n\
    \n![../images/504209_1_En_2_Chapter/504209_1_En_2_Fig17_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Fig17_HTML.jpg)\n\
    \n**Figure 2-17**  \nDrone’s top view for the analysis of torque around the `Zbody`\
    \ axis, which points towards you\n\n![../images/504209_1_En_2_Chapter/504209_1_En_2_Figy_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Figy_HTML.jpg)\n\
    \nIn the case of the `Yb` and `Xb` axes, torques are induced as a lever arm effect\
    \ given by the thrust forces and their respective radii. See Figure [2-18](#504209_1_En_2_Chapter.xhtml#Fig18)\
    \ and Figure [2-19](#504209_1_En_2_Chapter.xhtml#Fig19). Note that the vehicle\
    \ must be well balanced to ensure identical or highly similar radii or lever arms.\n\
    \n![../images/504209_1_En_2_Chapter/504209_1_En_2_Figz_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Figz_HTML.jpg)\n\
    \n![../images/504209_1_En_2_Chapter/504209_1_En_2_Fig19_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Fig19_HTML.jpg)\n\
    \n**Figure 2-19**  \nDrone’s lateral view for the analysis of torque around the\
    \ `X` axis, which points towards you\n\n![../images/504209_1_En_2_Chapter/504209_1_En_2_Fig18_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Fig18_HTML.jpg)\n\
    \n**Figure 2-18**  \nDrone’s lateral view for the analysis of torque around the\
    \ `Y` axis, which points towards you\n\n![../images/504209_1_En_2_Chapter/504209_1_En_2_Figaa_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Figaa_HTML.jpg)\n\
    \nThe important conclusion here is that a quadcopter has at its center of gravity,\
    \ coincident by design with the geometric center, one thrust and three torques\
    \ generated by its motors and the action of the force of gravity. See Figure [2-20](#504209_1_En_2_Chapter.xhtml#Fig20).\
    \ Notice that the force of gravity is always perpendicular to the ground or world\
    \ frame, but this is not the case for `FZb` (drone thrust), because `FZb` is perpendicular\
    \ to the body of the drone or the vehicle frame. Soon we will use the appropriate\
    \ relationships between these frames.\n\n![../images/504209_1_En_2_Chapter/504209_1_En_2_Fig20_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Fig20_HTML.jpg)\n\
    \n**Figure 2-20**  \nEquivalent forces and torques acting on the center of the\
    \ drone, generated by its motors and the gravity\n\nHaving learned about the forces\
    \ acting on the vehicle, it is time to study its dynamics.\n\n## Translational\
    \ Dynamics\n\nHaving established the motion or kinematic relationships between\
    \ frames, and the forces acting on a quadcopter, we will deduce the equations\
    \ that produce these motions. In this case, we will start with the translational\
    \ dynamics.\n\nFor this, it is convenient to ask ourselves where and why to do\
    \ this analysis.\n\nThe translational dynamics is generally deducted in the fixed\
    \ frame. Why? Just for mathematical simplification and for compatibility with\
    \ the sensors (most of the translational sensors indicate the position of the\
    \ drone with respect to a fixed frame like a GPS).\n\nThe procedure is as follows:\n\
    \n1. Symmetry and point mass assumptions are done (a quadcopter type drone is\
    \ designed in a way that is balanced and generally its center of gravity coincides\
    \ with its geometric center or at least is located as close as possible).\n\n\
    2. Newton’s second law equation is used for the aircraft as it was a particle\
    \ with three-dimensional motion (that is the purpose of the step 1 assumptions).\n\
    \n![../images/504209_1_En_2_Chapter/504209_1_En_2_Figab_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Figab_HTML.jpg)\n\
    \n3. Since we are interested in controlling the aircraft motion (modeled as a\
    \ particle), we rewrite the previous equation with respect to the position (acceleration\
    \ is defined as the second derivative of the position).\n\n![../images/504209_1_En_2_Chapter/504209_1_En_2_Figac_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Figac_HTML.jpg)\n\
    \n4. We add the free-fall effect (gravity).\n\n![../images/504209_1_En_2_Chapter/504209_1_En_2_Figad_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Figad_HTML.jpg)\n\
    \n5. Since we want to model the drone in the fixed frame and the thrust force\
    \ of the drone acts on the body frame, we must relate them, so see Figure [2-21](#504209_1_En_2_Chapter.xhtml#Fig21).\
    \ In this case, as an extension of D’Alembert’s principle, it is valid to indicate\
    \ the following. Remember that the matrix of rotation is the composition given\
    \ by the Tait-Bryan rotations.\n\n![../images/504209_1_En_2_Chapter/504209_1_En_2_Fig21_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Fig21_HTML.jpg)\n\
    \n**Figure 2-21**  \nThrust force of a quadcopter overlapped between the body\
    \ and the world frames\n\n![../images/504209_1_En_2_Chapter/504209_1_En_2_Figae_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Figae_HTML.jpg)\n\
    \n6. So, the system of equations that model the translational dynamics is:\n\n\
    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figaf_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Figaf_HTML.jpg)\n\
    \nNote that this is the simplified model, but you can add effects such as air\
    \ friction, turbulence, and more, depending on the needs of your work.\n\nNow\
    \ that you know about the translational dynamics, let’s move to rotational dynamics."
