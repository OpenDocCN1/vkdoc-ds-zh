  trans: '

    ### 作用在飞行器上的力


    基于之前的结论，我们将把每个螺旋桨的力转移到飞行器的中心。见图 2-15。


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Fig15_HTML.jpg](img/504209_1_En_2_Fig15_HTML.jpg)


    **图 2-15**

    每个螺旋桨相对于四轴飞行器中心产生的力和扭矩，以及用于此分析的相应机体坐标系


    对于本例以及预期的结果，我们将按照图 2-15 的情况进行处理。请注意，笛卡尔坐标轴的标记和方向，以及电机的编号、它们的旋转方向，甚至它们的几何分布，都会影响我们将要看到的内容，这被称为分配矩阵或推进矩阵。还要注意，一半的电机相对于另一半顺时针旋转，以防止自转（这意味着飞行器会绕其主轴以不希望的方式旋转）。如果所有或大多数电机都朝一个方向（顺时针或逆时针）旋转，就可能发生这种情况。


    分析 `Zb` 轴上的力，我们有：


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figw_HTML.jpg](img/504209_1_En_2_Figw_HTML.jpg)


    考虑到一个平衡良好的飞行器及其平衡良好的螺旋桨，在 `Yb` 和 `Xb` 轴上没有直接作用的力，只有扭矩，因此：


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figx_HTML.jpg](img/504209_1_En_2_Figx_HTML.jpg)


    请注意，在某些条件下，这些力是存在的，并且无法从模型中消除。然而，这些效应通常出现在大型飞行器中，可以通过数学变换或控制补偿来简化。参见附录中的 Reza-Olfati
    文章。


    我们继续讨论扭矩。首先要做的是确定正旋转方向，如图 2-16 所示。


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Fig16_HTML.jpg](img/504209_1_En_2_Fig16_HTML.jpg)


    **图 2-16**

    每个螺旋桨相对于四轴飞行器中心产生的力和扭矩，以及本次分析中的正旋转方向


    观察到，在绕 `Zb` 轴的扭矩情况下，这是直接由每个电机的单个扭矩引起的。见图 2-17。


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Fig17_HTML.jpg](img/504209_1_En_2_Fig17_HTML.jpg)


    **图 2-17**

    用于分析绕 `Zbody` 轴（指向你）扭矩的无人机俯视图


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figy_HTML.jpg](img/504209_1_En_2_Figy_HTML.jpg)


    在 `Yb` 和 `Xb` 轴的情况下，扭矩是由推力及其各自半径产生的杠杆臂效应引起的。见图 2-18 和图 2-19。请注意，飞行器必须保持良好的平衡，以确保半径或杠杆臂完全相同或高度相似。


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figz_HTML.jpg](img/504209_1_En_2_Figz_HTML.jpg)


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Fig19_HTML.jpg](img/504209_1_En_2_Fig19_HTML.jpg)


    **图 2-19**

    用于分析绕 `X` 轴（指向你）扭矩的无人机侧视图


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Fig18_HTML.jpg](img/504209_1_En_2_Fig18_HTML.jpg)


    **图 2-18**

    用于分析绕 `Y` 轴（指向你）扭矩的无人机侧视图


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figaa_HTML.jpg](img/504209_1_En_2_Figaa_HTML.jpg)


    这里重要的结论是，四轴飞行器的重心（按设计与其几何中心重合）处，存在由其电机和重力作用产生的一个推力和三个扭矩。见图 2-20。请注意，重力始终垂直于地面或世界坐标系，但
    `FZb`（无人机推力）并非如此，因为 `FZb` 垂直于无人机机体或机体坐标系。稍后我们将使用这些坐标系之间的适当关系。


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Fig20_HTML.jpg](img/504209_1_En_2_Fig20_HTML.jpg)


    **图 2-20**

    作用在无人机中心、由电机和重力产生的等效力和扭矩


    了解了作用在飞行器上的力之后，是时候研究其动力学了。


    ## 平移动力学


    在建立了坐标系之间的运动或运动学关系以及作用在四轴飞行器上的力之后，我们将推导出产生这些运动的方程。在本例中，我们从平移动力学开始。


    为此，我们有必要问一下，在哪里进行以及为什么要进行这种分析。


    平移动力学通常是在固定坐标系中推导的。为什么？只是为了数学上的简化以及与传感器的兼容性（大多数平移传感器指示无人机相对于固定坐标系的位置，例如 GPS）。


    步骤如下：


    1.  假设飞行器是对称的且为质点（四轴飞行器型无人机在设计上是平衡的，其重心通常与几何中心重合，或至少尽可能靠近）。


    2.  将飞行器视为具有三维运动的质点，使用牛顿第二定律方程（这正是步骤 1 假设的目的）。


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figab_HTML.jpg](img/504209_1_En_2_Figab_HTML.jpg)


    3.  由于我们关心的是控制飞行运动（建模为质点），我们根据位置重写上述方程（加速度定义为位置的二阶导数）。


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figac_HTML.jpg](img/504209_1_En_2_Figac_HTML.jpg)


    4.  我们加入自由落体效应（重力）。


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figad_HTML.jpg](img/504209_1_En_2_Figad_HTML.jpg)


    5.  因为我们想要在固定坐标系中建模无人机，而无人机的推力作用于机体坐标系，所以我们必须建立它们之间的关系，见图 2-21。本例中，作为达朗贝尔原理的扩展，可以表述如下。请记住，旋转矩阵是由
    Tait-Bryan 旋转组合而成的。


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Fig21_HTML.jpg](img/504209_1_En_2_Fig21_HTML.jpg)


    **图 2-21**

    四轴飞行器在机体坐标系和世界坐标系之间重叠的推力


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figae_HTML.jpg](img/504209_1_En_2_Figae_HTML.jpg)


    6.  因此，用于建模平移动力学的方程组为：


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figaf_HTML.jpg](img/504209_1_En_2_Figaf_HTML.jpg)


    请注意，这是简化模型，但您可以根据工作需要添加空气摩擦、湍流等效应。


    现在您了解了平移动力学，让我们转向旋转动力学。

    '
- fmt: '# Rotational Dynamics


    In this part, we use Euler’s equations for rotational motion. They are the equivalent
    of Newton’s second law for rotational motion.


    Unlike the translational dynamics, this analysis is expressed in the body frame.
    The reasons are again simplification of equations and compatibility with the sensors,
    which generally provide on-board rotation measurements.


    The procedure is as follows:


    1.  We use the rotational equivalent of Newton’s second law or Euler’s equations.
    Note that unlike the previous case, `J` is not a constant like mass but is a 3x3
    matrix which, when multiplied by angular accelerations, produces a 3x1 vector.


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figah_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Figah_HTML.jpg)


    1.  We rewrite in terms of something known or measurable such as the onboard angular
    velocity (note that the translational analysis is expressed in terms of the second
    derivative of the position). In this case, it helps that the sensors generally
    allow measuring on-board angular velocities. Observe that the acceleration is
    also the first derivative of the velocity.


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figai_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Figai_HTML.jpg)


    1.  Rigid and symmetrical body assumptions are made to consider that the inertia
    matrix only has components on its diagonal, which means that everything that is
    not on the diagonal is negligible.


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figaj_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Figaj_HTML.jpg)


    1.  The gravitational effect is omitted because when considering that the drone
    is symmetrical, rigid, and well balanced with respect to its center, the torques
    created by the force of gravity are canceled (lever arm radii tend to zero). You
    should consider that this does not happen with an unbalanced vehicle or a drone
    with large dimensions (for example, a drone transporting something placed on the
    edge of its frame like a robotic arm).


    However, the effects of centrifugal accelerations are usually important (in the
    smooth flight simplification, you will notice that these accelerations are omitted
    due to the reduced angular velocities).


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figak_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Figak_HTML.jpg)


    Why are these centrifugal effects omitted during translational analysis? Because
    the thrust force position is almost zero with respect to the vehicle’s analysis
    center, and therefore they are negligible (but not for large vehicles, where something
    similar happens to the rotational effect of gravity). As you can see, in rotational
    motion, they are considered because they do not depend on the action radii but
    they depend on angular velocities.


    1.  Developing the equations (cross product), the rotational dynamics become


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figal_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Figal_HTML.jpg)


    This dynamics will be simplified later with the smooth flight conditions. However,
    they will be employed again in the geometric control section.


    You have learned about kinematics and dynamics. In order to close our modeling,
    let’s talk about the allocation model.


    # Allocation Model


    The propulsion or allocation model establishes the relationship between the motors
    and the vehicle’s center of analysis (the gravity center, for example). It is
    the link between theory (modeling, simulation, and control) and practice (design
    and programming).


    ## Steps for Obtaining the Allocation Model


    The procedure for obtaining this model is really similar to the one carried out
    in the section where the torques and forces acting on the quadcopter are demonstrated.
    However, it is repeated in a systematic way.


    In general, the following relationship is expected (assuming, of course, a linear
    behavior of the motors):


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figam_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Figam_HTML.jpg)


    where `w`, with index from 1 to `m`, represents the speed of each one of the `m`
    motors of the vehicle and `A` is an allocation matrix that indicates how each
    motor influences the behavior of the three possible torques and three possible
    forces in the Cartesian space. This Cartesian space is associated with the center
    of analysis of said aircraft (the gravity one, for example). In most of the multicopters,
    the `A` matrix has constant elements, but they can vary if, for example, each
    motor has a system of servos that alter its position and orientation.


    Note that the result of this modeling process changes for each drone configuration,
    but the process described is generic and is as follows:


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Fig22_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Fig22_HTML.jpg)


    **Figure 2-22:** Axes convention for step 1


    1.  The first thing to do is to establish an axes convention, including positive
    directions of motion. This includes defining both translations and rotations;
    see Figure [2-22](#504209_1_En_2_Chapter.xhtml#Fig22). In practice, this is done
    according to the remote control sticks, which are frequently based on the aforementioned
    ISO standard (see the design section of this book).


    1.  The next step is to attach a label to the motors. This involves their sense
    of rotation and their geometric distribution with respect to the other motors.


    In this case, and to give a concrete example, we are using a flat geometry called
    X configuration, with the indicated senses of rotation, the following labels,
    and also with radial symmetry, as shown in Figure [2-23](#504209_1_En_2_Chapter.xhtml#Fig23).


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Fig23_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Fig23_HTML.jpg)


    **Figure 2-23:** Motor labeling for step 2


    Note that this is usually done with respect to the autopilot reference (generally
    a little arrow).


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Fig24_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Fig24_HTML.jpg)


    **Figure 2-24:** Motor forces and torques acting on the selected frame for step
    3


    1.  Now we must relate the motions established in step 1 with the effects of torque
    and thrust of each motor; see Figure [2-24](#504209_1_En_2_Chapter.xhtml#Fig24).
    Remember that there are torques created by the action of individual torques and
    torques generated by the lever arms.'
