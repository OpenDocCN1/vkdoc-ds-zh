  raw: 'Mux block parameters


    **Clock**: This is very useful for defining trajectories (time-variant functions).
    This block does not have inputs, and its only output is the simulation time (this
    time is not real-time). See Figure [4-20](#504209_1_En_4_Chapter.xhtml#Fig20).


    ![../images/504209_1_En_4_Chapter/504209_1_En_4_Fig20_HTML.jpg](images/504209_1_En_4_Chapter/504209_1_En_4_Fig20_HTML.jpg)


    Figure 4-20


    Clock block


    For the purposes of this book, this block does not have parameters that must be
    modified.


    **Other blocks that may be useful**: For more information, refer to the gain block,
    the derivative block, the sum block, the constant block, the math function block,
    the goto labels, and the saturation block, among many others.


    Now that you know how to work with blocks, state space variables, and the basic
    blocks that we will use with MATLAB, we can start with our simulations.


    ### Quadcopter Example, Text File


    Note that this file would be enough if we wanted to simulate our drone and we
    only had a basic programming language such as C++ or Python, of course by incorporating
    an ODE solver.


    Remember that the model will be as precise as you want by adding more dynamic
    effects. In this case, we will use the previous models that have no aerodynamic
    effects, but they serve to test some details in the control design, such as the
    fact that planar PDs cannot exceed the value of 2Pi (remember that these PDs represent
    desired angles and they cannot reach values greater than 2Pi). One way to improve
    the model is by adding more effects or by inducing noise in the states by means
    of random functions, or even by creating a delay in the signals to simulate the
    behavior of the sensors. The text file called `quadmodel.m` is displayed in Listing
    [4-1](#504209_1_En_4_Chapter.xhtml#PC1).


    ```

    function outp=quadmodel(inpt)

    % system inputs: states and time

    % x1-x, x2-xdot, x3-y, x4-ydot, x5-z, x6-zdot

    % x7-theta, x8-thetadot, x9-phi, x10-phidot, x11-psi, x12-psidot

    x1=inpt(1);

    x2=inpt(2);

    x3=inpt(3);

    x4=inpt(4);

    x5=inpt(5);

    x6=inpt(6);

    x7=inpt(7);

    x8=inpt(8);

    x9=inpt(9);

    x10=inpt(10);

    x11=inpt(11);

    x12=inpt(12);

    t=inpt(13);

    % constant parameters: mass, inertial values, gravity

    m=1;

    g=9.8;

    Jx=0.2;

    Jy=0.2;

    Jz=0.2;

    % control gains: notice the small values at x and y gains because they

    % define an angle

    kpx=0.1;

    kdx=0.09;

    kpy=0.1;

    kdy=0.09;

    kpz=1;

    kdz=0.7;

    kptet=3;

    kdtet=1;

    kpfi=3;

    kdfi=1;

    kppsi=3;

    kdpsi=1;

    % planar desired values

    x1d=5;

    x2d=0;

    x3d=-6;

    x4d=0;

    % planar PD: remember that these PD define desired angular values

    PDx=(kpx*(x1d-x1))+(kdx*(x2d-x2));

    PDy=(kpy*(x3d-x3))+(kdy*(x4d-x4));

    % altitude and attitude desired values

    x5d=8+sin(t);

    x6d=cos(t);

    x7d=PDx;

    x8d=0;

    x9d=-PDy;

    x10d=0;

    x11d=0;

    x12d=0;

    % altitude and attitude PDs

    PDz=(kpz*(x5d-x5))+(kdz*(x6d-x6));

    PDteta=(kptet*(x7d-x7))+(kdtet*(x8d-x8));

    PDfi=(kpfi*(x9d-x9))+(kdfi*(x10d-x10));

    PDpsi=(kppsi*(x11d-x11))+(kdpsi*(x12d-x12));

    % vehicle''s forces and torques

    Fbz=PDz+(m*g);

    taoteta=PDteta;

    taofi=PDfi;

    taopsi=PDpsi;

    % vehicle''s dynamic model xp notation implies xdot or xpoint or x

    % derivative

    x1p=x2;

    x2p=(Fbz/m)*((x7*cos(x11d))+(x9*sin(x11d)));

    x3p=x4;

    x4p=(Fbz/m)*((x7*sin(x11d))-(x9*cos(x11d)));

    x5p=x6;

    x6p=(Fbz/m)-g;

    x7p=x8;

    x8p=taoteta/Jy;

    x9p=x10;

    x10p=taofi/Jx;

    x11p=x12;

    x12p=taopsi/Jz;

    % output: derivatives of the system states and vehicle''s force and

    % torques

    outp=[x1p;x2p;x3p;x4p;x5p;x6p;x7p;x8p;x9p;x10p;x11p;x12p;Fbz;taoteta;taofi;taopsi];

    end

    Listing 4-1

    Quadmodel Code, a Controller with a Desired Yaw Value Equal to Zero

    ```


    Attention: The name of the textfile that contains the dynamic model of the system
    (the one with the `.m` extension) must be identical to the word that we wrote
    in the function line, as indicated in Figure [4-21](#504209_1_En_4_Chapter.xhtml#Fig21).


    ![../images/504209_1_En_4_Chapter/504209_1_En_4_Fig21_HTML.jpg](images/504209_1_En_4_Chapter/504209_1_En_4_Fig21_HTML.jpg)


    Figure 4-21


    Text file for the interpreted MATLAB function block quadmodel.m


    Remember that as an alternative to MATLAB and Simulink, you can use Scilab, which
    has a block simulator called Scicos or Xcos depending on the version. Scilab is
    a free software tool and you must search for the equivalent of the seven blocks
    shown here (for example, the Scicos user defined functions).


    ### Quadcopter Example, Block File


    In the following block file called `blockquad.slx` (see Figure [4-22](#504209_1_En_4_Chapter.xhtml#Fig22);
    in Simulink versions prior to the 2013a, the extension is .`mdl`), we have used
    all of the seven basic blocks previously mentioned. Note that the complexity of
    the model remains in the text file. For this reason, the number of blocks is reduced.
    This block file can be used as a template for any other model. It only changes
    the size of the buses and the text file that contains the system.


    ![../images/504209_1_En_4_Chapter/504209_1_En_4_Fig22_HTML.jpg](images/504209_1_En_4_Chapter/504209_1_En_4_Fig22_HTML.jpg)


    Figure 4-22


    Block file for using the interpreted MATLAB function block, blockquad.slx


    Into Figure [4-22](#504209_1_En_4_Chapter.xhtml#Fig22) a zoom to the parameters
    to be modified is displayed.'
