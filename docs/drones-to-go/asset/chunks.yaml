  trans: '

    # 平移运动学


    假设我们想要将世界坐标系与飞行器坐标系关联起来。尽管这乍看之下很简单，但必须记住，所有概念的关联都应在无偏的参考空间中进行。


    为此，想象一下，在教室里，学生们被要求指出一只在白板上爬行的昆虫相对于他们自身所在位置的位置，如图 2-3 所示。


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Fig3_HTML.jpg](img/504209_1_En_2_Fig3_HTML.jpg)


    **图 2-3** 物体相对于外部观测者的运动与位置


    如你所见，每个人对昆虫的位置都会有不同的感知，他们会给出一个取决于自身所处位置的结果。然而，无论身处何位，每个人都能指出昆虫正在沿所示方向移动。因此，在那个教室里，对于所有人而言，一个无偏的元素就是昆虫的运动，而这个运动与其速度有关。


    这表明，如果世界坐标系相对于飞行器放置在不同的位置，如图 2-4 所示，那么坐标系之间的不变量关系将不在位置层面，而在速度层面（作为一个向量），这对于放置在每个世界坐标系中的观测者或传感器都是成立的。


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Fig4_HTML.jpg](img/504209_1_En_2_Fig4_HTML.jpg)


    **图 2-4** 无人机相对于不同世界坐标系的运动与位置


    从前面的图中可以看出，在每个坐标系中对飞行器运动的感知并不会因坐标系之间的距离而改变。然而，如图 2-5 所示，将其中两个坐标系叠加时，可能会注意到其各自坐标轴在方向上的影响。因此，为了关联它们，需要在坐标系的各自坐标轴之间找到一个三角投影。在三维模式下，这归结为寻找旋转矩阵（注意使用了牛顿的记号，即一个带有点的字母或符号；这表示一阶导数，在我们这里表明这是速度坐标系或速度之间的关系，如前所述）。


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Fig5_HTML.jpg](img/504209_1_En_2_Fig5_HTML.jpg)


    **图 2-5** 机体坐标系与世界坐标系重叠


    在旋转矩阵的家族中，为了满足 ISO 1151–2: 1985 标准，本文采用横滚、俯仰和偏航的欧拉角序列，即所谓的泰特-布莱恩角。其定义如下：


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figb_HTML.jpg](img/504209_1_En_2_Figb_HTML.jpg)


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figc_HTML.jpg](img/504209_1_En_2_Figc_HTML.jpg)


    请记住，各个旋转的定义如下（注意枢轴即为旋转轴）：


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figd_HTML.jpg](img/504209_1_En_2_Figd_HTML.jpg)


    这里有个很好的问题：为什么这些旋转的序列是乘法而不是加法？至少从数学一致性的角度来看，答案很简单。每个旋转矩阵必须是正交归一化的，因为其每一列都代表单位向量，这些向量的分量在
    0 到 1 之间变化，并描述了相互垂直的坐标轴（若要验证此性质，请查阅推荐的关于线性代数和旋转矩阵的文献）。因此，如果我们对它们进行加法运算，结果中的元素有可能会超过单位值；而如果我们进行乘法运算，由于它们是分数、零或一，结果仍将是分数、零或一。因此，连续旋转矩阵序列的复合必须是乘法的。


    请注意，我们使用的一组方程在速度层面和力层面都是有效的。这一表述将在后续章节中使用，而追求严谨的读者可以在大量文献中找到其证明和基础，这可以看作是达朗贝尔原理和虚功原理（也称为最小作用量原理）的应用。


    接下来，你将学习无人机的旋转运动学。

    '
- fmt: '# Rotational Kinematics


    Obtaining the translational kinematics was relatively easy, considering the existence
    of reference frames directly linked through rotations. However, this is not the
    case for rotational variables (notice that we have angular information regarding
    the world frame given by Euler’s angles, but we do not have angular information
    directly in the body or vehicle frame). For deducing the kinematics, it becomes
    necessary to use the mathematical properties of a rotation matrix.


    Rotation matrices must fulfil the principle of orthonormality. This implies the
    following:


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Fige_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Fige_HTML.jpg)


    As indicated, the most objective analysis to establish a relationship between
    frames is at the speed level. The velocities and consequently the speed are obtained
    from positional derivatives, so a first intuition is to derive the previous equation.
    Note that this is a derivative with respect to the time, so if the rotation matrix
    depends on the Euler angles when deriving, the angular rates of said Euler angles
    will appear (chain rule). Also notice that the following result is obtained with
    the rules of the derivative of a product (a matrix product) and the derivative
    of a constant (an identity matrix):


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figf_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Figf_HTML.jpg)


    Using the following property of the transposed matrices in the second term of
    the previous equation


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figg_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Figg_HTML.jpg)


    and replacing this property, we get


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figh_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Figh_HTML.jpg)


    From this result a special type of matrices called antisymmetric or skew-symmetric
    are invoked. They satisfy the following:


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figi_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Figi_HTML.jpg)


    Therefore, it is true that the following term is a skew-symmetric matrix:


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figj_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Figj_HTML.jpg)


    And what is this useful for?


    A skew-symmetric matrix is associated with a representation of the cross product.
    Suppose we have two vectors:


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figk_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Figk_HTML.jpg)


    In this way, an antisymmetric matrix (in this case the one associated with the
    vector `a`) contains information of a vector distributed in its elements in the
    indicated way.


    The question about the equation’s usefulness remains open and it will be answered
    now. Just keep in mind the concept of skew-symmetric matrix and its relationship
    with the cross product.


    Suppose that the car in Figure [2-6](#504209_1_En_2_Chapter.xhtml#Fig6) only rotates
    around its `Zb` axis with angular velocity equal to the `theta` derivative. Note
    that the `Z` axis of the world frame and the body frame (`Zb`) are parallel (both
    of them point towards you).


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Fig6_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Fig6_HTML.jpg)


    **Figure 2-6** Body frame of a wheeled vehicle and its relationship with the world
    frame


    It is obvious for this example that the angular velocity in the `Z` axis of the
    body frame is equal to the derivative of `theta` measured in the fixed frame (again,
    because they are parallel axes).


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figl_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Figl_HTML.jpg)


    So we can reach the same result with the skew-symmetric equation:


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figm_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Figm_HTML.jpg)


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Fign_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Fign_HTML.jpg)


    We can conclude from the definition of the elements of a skew-symmetric matrix
    that


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figo_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Figo_HTML.jpg)


    Then, by using Euler’s compound rotation matrix and by doing the previous procedure,
    as well as the corresponding simplifications, the following is obtained (it is
    an interesting exercise that you develop the full sequence of these equations;
    remember that the rotation matrix derivative is with respect to the time, and
    also remember the total differential concept):


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figp_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Figp_HTML.jpg)


    where


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figq_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Figq_HTML.jpg)


    This relates the body frame angular velocities with the fixed frame angular velocities.
    Remember that the fixed frame is expressed in Euler’s angles.


    For those who prefer geometry to developing equations, there is also an understandable
    and visual deduction for obtaining this relationship between velocities in Beedford’s
    book indicated in the Appendix.


    Note also that the imposition of said angular orthonormality constraints gives
    to the drones what is known as a non-holonomic property (this is unnoticeable
    in smooth or linear flight modes, as you will see soon).


    Finally, observe that the (`p` `q` `r`) nomenclature was introduced. This is frequently
    used with aircraft and of course multicopters.


    Now that you have the kinematics of the drone, it’s time to look at the dynamics,
    but before that, we provide you with a brief on the forces acting on a drone and
    its propellers.


    # Forces Acting on a Multicopter and Its Propellers


    Before developing the dynamic equations, it is convenient to deduce the basic
    forces that act on a multicopter. Aerodynamic effects could be added, but since
    they vary between outdoor and indoor operations, even at near or far distances
    from the ground, they are considered as non-generic material that can be consulted
    in other works or briefly in the Appendix (see drone maximum velocities).


    The most obvious force acting on a drone is gravity. Let’s consider that the vehicle
    is well balanced, and that said force is located directly at the center of gravity
    or the center of geometry, which for this kind of vehicle is desirable to coincide.
    See Figure [2-7](#504209_1_En_2_Chapter.xhtml#Fig7).


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Fig7_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Fig7_HTML.jpg)


    **Figure 2-7** Gravity force actuating on a drone'
