- fmt: "### UART Checking\n\nIn this case, the incorrect information is discarded,\
    \ the simplest algorithm is the checksum, and its improvement is the XOR checksum.\n\
    \nAn easy explanation is done from the decimal base.\n\nSuppose the following\
    \ data are sent:\n\n- `val1Send = 50`\n- `val2Send = 30`\n\nA third value to send\
    \ can be the sum of the previous quantities (the sum part of the checksum algorithm):\n\
    \n`valsumSend = val1 + val2 = 80`\n\nThe same data should arrive to the receiver:\n\
    \n- `Val1Rec = 50`\n- `Val2Rec = 30`\n- `valSumRec = 80`\n\nAnd then the check\
    \ part of the algorithm is built:\n\n`Check = Val1Rec + Val2Rec = 80`\n\nIn this\
    \ way, `Check` and `valSumRec` are the same and this is a valid collection of\
    \ data.\n\nNow let’s suppose that the receiver reads an incorrect value:\n\n-\
    \ `Val1Rec = 20`\n- `Val2Rec = 30`\n- `valSumRec = 80`\n\nWe build the check part\
    \ again:\n\n`Check = Val1Rec + Val2Rec = 50`\n\nIn this way, `Check` is different\
    \ from `valSumRec` and the data collection is discarded, or the information is\
    \ requested again.\n\nAs can be seen, the checksum algorithm has some important\
    \ problems:\n\n1.  The sum may exceed the value of `255` and it will be required\
    \ to send the number as two or more groups of data.\n\n2.  The sum of the incorrect\
    \ data can result in a correct check.\n\nFor example, the sender writes:\n\n-\
    \ `val1Send = 50`\n- `val2Send = 30`\n- `valsumSend = val1 + val2 = 80`\n\nThe\
    \ receiver reads:\n\n- `Val1Rec = 60`\n- `Val2Rec = 20`\n- `valSumRec = 80`\n\n\
    And, as the check remains equal to `80`, this incorrect data packet will not be\
    \ discarded.\n\n3.  The data arrive correctly but the sum is corrupted.\n\nThe\
    \ sender writes:\n\n- `val1Send = 50`\n- `val2Send = 30`\n- `valsumSend = val1\
    \ + val2 = 80`\n\nAnd the receiver reads:\n\n- `Val1Rec = 50`\n- `Val2Rec = 30`\n\
    - `valSumRec = 10`\n\nSince the value of the `check = 80` is different from `valSumRec`,\
    \ the information is discarded despite having arrived correctly.\n\nIn order to\
    \ reduce these problems (at least the overflow problem), binary checksums are\
    \ used. One of them is the XOR checksum (`^` operator in C++). Note that the rest\
    \ of the problems are still present.\n\nIf you want to send a sum value that exceeds\
    \ 255, for example `520`, the first thing to do is a binary transformation:\n\n\
    `1000001000(bin) = 520(dec)`\n\nAfter that, the XOR addition is made element by\
    \ element:\n\n`(1) xor (0) xor (0) xor (0) xor (0) xor (0) xor (1) xor (0) xor\
    \ (0) xor (0) = 0`\n\nSo, the additional data to send is simply `0`.\n\nFor example:\n\
    \n- `Val1Send = 250`\n- `Val2Send = 250`\n- `Val3Send = 20`\n- `ValSum = 520`\n\
    \n`ValSum` cannot be sent, but instead the XOR sum of its binary components is\
    \ sent:\n\n`XORSend = (1) xor (0) xor (0) xor (0) xor (0) xor (0) xor (1) xor\
    \ (0) xor (0) xor (0) = 0`\n\nThe receiver reads:\n\n- `Val1Rec = 250`\n- `Val2Rec\
    \ = 10`\n- `Val3Rec = 20`\n- `XORRec = 0`\n\nThen, the check is built:\n\n`Check\
    \ = Val1Rec + Val2Rec + Val3Rec = 280`\n\nThe XOR sum is done with the binary\
    \ components of the `Check`:\n\n`100011000(bin) = 280(dec)`\n\n`XORCheck = (1)\
    \ xor (0) xor (0) xor (0) xor (1) xor (1) xor (0) xor (0) xor (0) = 1`\n\nSince\
    \ the result is different from `XORRec`, the data are discarded or requested again.\n\
    \n### Turn Agreement\n\nIn this case, additional information is sent to indicate\
    \ which devices are the receivers and which are the transmitters during the communication\
    \ process. The algorithm consists of sending and evaluating a logical value. This\
    \ is having two or more drones that contain communication devices; all of them\
    \ have a variable that works as a traffic light or flag. One of them has this\
    \ variable in the ON state and the others in the OFF state. Only the one that\
    \ starts with the ON state can write while the others read. As soon as the one\
    \ that started with the ON state finishes, it changes its flag or semaphore to\
    \ OFF. When the other members of the team read that the flag of the initial emitter\
    \ changes to OFF, they initiate a sequence to determine which of them is the next\
    \ to change their flag to ON. This is repeated cyclically, alternately, or just\
    \ once. Basically, it is like a polite conversation where each participant asks\
    \ or rotates their turn to communicate while waiting for the one who is talking\
    \ to finish.\n\n### Generic UART Algorithm\n\nThe generic algorithm for the UART\
    \ communication using the aforementioned operations is as follows. (The specific\
    \ appearance of each operation is underlined; note that the checksum is a shared\
    \ operation. To improve this sequence, each process may depend on a timer to accelerate\
    \ or ensure its execution or just to avoid delays.)\n\n1.  The flag or turn of\
    \ the communication device is checked.\n\n2.  If the current turn involves writing:\n\
    \    *   The information to send is divided into 8-bit segments. This information\
    \ is segmented into two parts: the modulo and the quotient.\n    *   The sum of\
    \ all the information to send is performed, and from the result is obtained the\
    \ XOR sum of its binary components.\n    *   Channel availability is verified.\n\
    \    *   The information is sent.\n    *   The variables employed for writing\
    \ are cleaned for their later use.\n    *   The state of the flag is changed to\
    \ reading.\n\n3.  If the turn implies reading:\n    *   The received data is read.\n\
    \    *   The XOR check is performed and then it is verified with the received\
    \ sum.\n    *   If they do not coincide, the designer will prescribe the procedure\
    \ to follow, which can be from discarding the information to requesting the information\
    \ again.\n    *   If they coincide, the information is reconstructed with the\
    \ indicated bit shifting and the OR operation.\n    *   The variables employed\
    \ for reading are cleaned for their later use.\n    *   The state of the flag\
    \ is changed to writing.\n\n4.  The process continues indefinitely until the user,\
    \ the code, or the power supply interrupts the communication.\n\nNow that you\
    \ know about control, signal processing, and UART communications, the next sections\
    \ will guide you on the ways to code your drone. First, we will show you the available\
    \ environments for programming your aircraft.\n\n## Available Ways to Program\
    \ a Drone\n\nCurrently, there are two ways to code your drones, the GUI and the\
    \ SDK.\n\n### The GUI\n\nA GUI is a simplified and highly visual interface designed\
    \ for the user with limited or null programming skills.\n\nIn this case, this\
    \ is a graphical user interface. Many of the closed architectures for programming\
    \ drones have one of them. These closed architectures are characterized by allowing\
    \ the user to modify basic parameters such as the path to follow, the gains of\
    \ preloaded controllers, and the rudimentary calibration of sensors and actuators.\
    \ More specialized tasks are closed to the user. Some of the most common GUIs\
    \ are Mission Planner and LibrePilot.\n\n### The SDK\n\nAn SDK is a software development\
    \ kit. The user is required to know a programming language in all cases.\n\n####\
    \ SDK Level 1\n\nFor SDK Level 1, non-specialized users in drone control or robotics\
    \ can program a drone for purposes other than recreational. The architecture is\
    \ not completely open, and only allows the user to design some high-level controllers\
    \ in a way as if the vehicle were a particle able to move in X, Y, Z, and rotate\
    \ around its Z axis. See Figure [5-9](#504209_1_En_5_Chapter.xhtml#Fig9).\n\n\
    One of the best known examples is the Dronekit SDK based on Python. In this type\
    \ of SDK, the user can only modify the desired references of X, Y, Z, and yaw,\
    \ or their speeds. Nothing can be done about the thrust force and drone torques,\
    \ and of course, about the allocation matrix.\n\n![../images/504209_1_En_5_Chapter/504209_1_En_5_Fig9_HTML.jpg](images/504209_1_En_5_Chapter/504209_1_En_5_Fig9_HTML.jpg)\n\
    \nFigure 5-9 SDK level 1"
