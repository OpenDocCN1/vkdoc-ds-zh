  trans: '

    ### GPS


    尽管全球定位系统是一个三维运动与速度传感系统（平移运动），但由于它被制作者和科学家们广泛使用，尤其在开阔地形应用中，因此单独成节进行介绍。它本质上是一个受环境影响的卫星三角测量系统，因此仅推荐用于开放空间作业。


    ## 指令组件


    以下章节将讨论使飞行器能够执行动作并接收指令的组件。


    ### 自动驾驶仪


    `Autopilot` 是无人飞行器的专用处理单元（见图 1-12）。此外，也有一些微控制器或开发板经过适配后可作为自动驾驶仪使用。它们采用封闭式或开放式架构（参见第
    5 章中关于无人机编程方式的章节）。


    ![../images/504209_1_En_1_Chapter/504209_1_En_1_Fig12_HTML.jpg](img/504209_1_En_1_Fig12_HTML.jpg)


    图 1-12


    自动驾驶仪


    ### 数传模块


    数传模块是用于无线远程传输信息的单元（见图 1-13）。它们的工作范围有限。数传模块可用于在两台或多台飞行器之间，或者在固定基站与一台或多台无人机之间进行相互通信。它们也可用于将动作捕捉系统获取的位置信息传输给飞行器。数传模块通常是双向模块。


    ![../images/504209_1_En_1_Chapter/504209_1_En_1_Fig13_HTML.jpg](img/504209_1_En_1_Fig13_HTML.jpg)


    图 1-13


    数传模块


    ### 遥控模块


    与数传模块不同，`RC` 模块允许通过摇杆和按钮手动控制无人机。它们的工作范围很广，部分模块还支持视频传输。遥控模块通常是单向的，即包含一个发射器模块和一个接收设备。见图
    1-14。


    ![../images/504209_1_En_1_Chapter/504209_1_En_1_Fig14_HTML.jpg](img/504209_1_En_1_Fig14_HTML.jpg)


    图 1-14


    遥控器与接收机


    ### 机载计算机


    机载计算机是一种板载处理单元，用于执行通常超出自动驾驶仪能力范围的高强度任务（例如实现人工视觉或 `SLAM`）。例如 `Raspberry Pi` 单板计算机、微控制器、微处理器或
    `FPGA`。简单来说，自动驾驶仪直接用于飞行控制，而机载计算机则用于与该飞行相关的间接任务。


    ## 动力组件


    以下章节将讨论为飞行器提供能量的组件。


    ### 电池/线缆供电


    使用电池或线缆供电为系统提供能量是显而易见的。虽然目前大多数无人机在长期应用中采用 `LIPO` 型电池（见图 1-15 右侧），但市场上也存在电源转换器或电源供应器，这意味着飞行器会通过电源延长线固定连接。显然，这种延长线会带来特殊的使用条件和移动限制。这些电源的理想工况是，其电压和电流的纹波或尖峰尽可能小，使得提供的数值尽可能恒定。由于电池已有大量文档介绍，这里我们将重点讨论有线或线缆供电。


    线缆供电有四种类型：


    *   **通过电源供应器**：在这种情况下，最大的障碍是成本，因为基于无刷电机的多旋翼无人机消耗的电流远大于电压（一个小型飞行器轻松消耗约 12V/60A
    的电力）。如此一来，在拥有能够提供上述电压和电流的电源的同时，还必须考虑电缆和导线必须能够承受这些参数，并且消耗如此大电流的电缆本身必然沉重而粗大，因而不适合高空使用。因此，如果您的应用是在飞行器高度几乎不超过一米五的实验室级别，那么推荐使用此选项。


    *   **通过汽车电池**：与上一种情况类似，但考虑到汽车电池是非常商业化的单元，成本略有降低。然而，汽车电池通常很重，并且运输和充电需要特殊处理。


    *   **通过电源转换器**：在这种情况下，需要提供中电压、低电流，例如 400V/3A，以便为能够将输入转换为 12V/100A 的电源转换器供电。这些电源转换器可以从某些制造商处购得（例如
    `VICOR`）。它们（含散热器）通常重约 200 克，是这类线缆供电应用中一个可行的选择。


    *   **通过太阳能电池**：其限制与上述情况类似，但存在太阳能电池本身所特有的问题（如尺寸和功率密度）。


    您可能会争辩说存在基于燃料的选项，因为它们在标准直升机上已使用数十年；然而，对于电动多旋翼飞行器而言，它们仍面临研究挑战（燃料发电机除外，其中使用燃料发动机作为发电厂的电源）。


    ### 电量指示器


    如果使用电池，配备一个能在电池即将耗尽时发出警报的设备至关重要，这样可以防止飞行器因掉电而坠毁受损。这些设备本质上是带有灯光或声音指示的小型电压表。


    ### 电源分配器


    电源分配器是一种设计用于使用单一电源为多个电机供电的设备。它们本质上是电流分配器，可以是线束形式（占用空间较大但易于操作），也可以是电子电路板形式（节省空间但难以操作）。见图
    1-15 中部。


    ### 电源模块


    电源模块是一种能够使自动驾驶仪从主电池获得电力的设备。见图 1-15 左侧。


    ![../images/504209_1_En_1_Chapter/504209_1_En_1_Fig15_HTML.jpg](img/504209_1_En_1_Fig15_HTML.jpg)


    图 1-15


    电源模块、电源分配器和电池

    '
- fmt: "### Electrical Connector\n\nElectrical connectors are a way to interconnect\
    \ various electrical or electronic devices. There are versions designed for power\
    \ or data. Power connectors can handle large amounts of voltage and/or current.\
    \ Data connectors are used exclusively to send and receive information that generally\
    \ consumes very low current or voltage.\n\nTables [1-2](#504209_1_En_1_Chapter.xhtml#Tab2)\
    \ through [1-4](#504209_1_En_1_Chapter.xhtml#Tab4) display more information about\
    \ the previous components and are presented in three categories: power components,\
    \ mechanical components, and control components.\n\n#### Table 1-4  \nMechanical\
    \ Components and Characteristics\n\n| Mechanical component | Main characteristics\
    \ | Frequent procedures | Types |\n| --- | --- | --- | --- |\n| Frame | Material,\
    \ hardness, lightness, holes, levels, accessories, size and weight, landing gear,\
    \ anti-shock systems, folding or not, electromagnetic shielding | Component connection,\
    \ balancing, restoration | Common classifications are by size, materials, and\
    \ folding ability |\n| Motors | `kv`, weight and dimensions, maximum current and\
    \ voltage, maximum thrust and torque | Getting the start value and proportionality\
    \ gains of torque and thrust with respect to their speed and the propeller, PWM\
    \ binding (with the remote control) | Brushed and brushless, speed or position,\
    \ kind of control signal (DC, BLDC, servo, stepper, AC, PWM RC or PWM duty cycle,\
    \ etc.) |\n| Propellers | Pitch, diameter, edge, number of blades, flexibility,\
    \ hardness, sense of rotation | Balancing, edge cutting | Usual classifications\
    \ are based on the material, the flexibility, and the number of blades. |\n| Fasteners\
    \ | Material, hardness, lightness, accessories, size and weight, fast or slow\
    \ change | Each mechanical connection is a case of analysis and depends on the\
    \ application. | Fast change or permanent connection |\n| Anti-vibration mounts\
    \ | Size, frame compatibility, mobility, kind of suppression | Balancing | For\
    \ motors, for autopilots, for sensors |\n\n#### Table 1-3  \nControl Components\
    \ and Characteristics\n\n| Control component | Main characteristics | Frequent\
    \ procedures | Types |\n| --- | --- | --- | --- |\n| Autopilot | Size, weight,\
    \ number of motors, connectors, available ports, architecture, programming language,\
    \ processor, required power | Programming | Open and closed architectures |\n\
    | Sensors | Resolution, size, weight, type, linearity, power required, kind of\
    \ connector, range, and operating conditions | Soldering, signal coupling, filtering\
    \ | Analog, digital, and serial |\n| Telemetry modules | Size, operating voltages\
    \ and currents, required accessories, connectors compatibility, maximum distance,\
    \ legality of operation frequencies | Binding and labeling, data speed configuration\
    \ | American and European standards |\n| Remote controller | Maximum distance,\
    \ support for LIPO batteries, legality of operation frequencies, number of channels,\
    \ binding mode, type of auxiliary channels, sensitivity, transmission modes, screen\
    \ or not, presence or not of a PPM channel in the receiver | Binding the receiver\
    \ with the transmitter, sticks and buttons configuration | By number of channels\
    \ and additional features as a screen |\n| Memory card | Memory size, type, adapters,\
    \ accessibility for plugging, number of work cycles | Write, erase, external or\
    \ on board use, format conversion | Usually by their memory size and commercial\
    \ type |\n| Companion computer | The same that an autopilot has plus additional\
    \ processing features and compatibilities with hardware and software | Programming\
    \ | By level of code abstraction (natural language vs. machine language), also\
    \ by their hardware performance |\n| Stop button | Accessibility to the user,\
    \ size, colors, mechanical suppression | Level of accessibility, programming |\
    \ Push buttons, sticks, based on time or based on events |\n| Data connectors\
    \ | Standard to use and compatibilities, tools to use them, speed, electromagnetic\
    \ shields, market availability, number of pins, sealed or not, standard or special\
    \ versions, maximum voltage and current, easy or rigid plugging | Soldering, replacing,\
    \ programming | It depends on each application. |\n\n#### Table 1-2  \nPower Components\
    \ and Characteristics\n\n| Power component | Main characteristics | Frequent procedures\
    \ | Types |\n| --- | --- | --- | --- |\n| Battery | Number of cells, size, weight,\
    \ amp hours, operating voltages, C or discharge rate, connectors, accessories\
    \ required for their use (a charger) | Charge, discharge, storage, transportation,\
    \ connector soldering, parallelization or serialization | There are many but LIPO\
    \ batteries are the most abundant. |\n| Power supply | Power, current, voltage,\
    \ ripple, frequency, input voltage (110/220), number of phases | Filtering if\
    \ required, phase joint if required, amplification or reduction, regulation, discharge\
    \ protection, transformation (AC-DC) | Switched and linear |\n| Battery indicator\
    \ | Number of cells allowed, light or sound indicators | Pin verification | On\
    \ board or external |\n| Power module | Maximum current supported, maximum voltage\
    \ supported, electromagnetic shield, maximum current measured, type of connectors\
    \ | Electromagnetic shielding if required, adding current or voltage sensors if\
    \ required, parallelization if required | For low and high current |\n| Power\
    \ distributor | Maximum current supported, maximum voltage supported, number of\
    \ motors to be powered, BEC, size, weight, type electromagnetic shield | Terminal\
    \ soldering, serialization or parallelization, electromagnetic shielding | Hub\
    \ (harness) or board (circuit) |\n| Power connectors | Maximum current supported,\
    \ maximum voltage supported, compatibility with the components, thermal resistance,\
    \ flexibility, plug/unplug capacities | Terminal soldering, replacement | Each\
    \ application has its own set of connectors. |\n| Power stages and ESCs | Maximum\
    \ size, weight, current and voltage, reversibility, BEC or optocoupling | Configuration\
    \ (usually via a software interface) | Reversible or non-reversible, PWM-RC or\
    \ PWM duty cycle, standard or optocoupled, for brushless or brushed motors |\n\
    \nNow that you know the introductory concepts about drone components, let’s see\
    \ how to choose them.\n\n## Component Selection\n\nThis process is divided, as\
    \ a recommended design, into three sub-processes (the analysis is carried out\
    \ considering brushless motors since they are the most employed with quadcopters).\n\
    \n### Vehicle Selection\n\nVehicle selection is an iterative process that consists\
    \ of:\n\n1. Choosing motors. Motors are chosen according to the weight and the\
    \ speed that you want to operate the vehicle. Therefore you must consult two important\
    \ parameters in datasheets: the maximum weight that each motor can lift and its\
    \ maximum value of RPMs (in brushless motors this is called `kv` and it must not\
    \ be confused with the electromechanical constants of the motor).\n\n2. According\
    \ to the above (the load capacity and the speed of the vehicle), the propellers\
    \ are chosen.\n\n3. Once the motors and propellers are selected, the ESCs are\
    \ chosen. Again, in the datasheet of the brushless motors you can find the current\
    \ and voltage required by these operating conditions. This allows selecting the\
    \ ESCs. It is recommended that ESCs consume 30% more current compared to that\
    \ consumed by their respective motors in order to overcome power loss.\n\n4. With\
    \ the previous point and the inclusion of other components such as the autopilot\
    \ and auxiliary motors, an adequate battery or power source is chosen.\n\n5. Considering\
    \ the dimensions of all the components and the final weight (which can be calculated\
    \ by using individual datasheets for each element of the vehicle), the frame is\
    \ selected.\n\n6. Considering the final weight, you must return to step 1 and\
    \ verify that the motors still satisfy your requirements. If not, you must repeat\
    \ the design process."
  raw: '### Electrical Connector


    Electrical connectors are a way to interconnect various electrical or electronic
    devices. There are versions designed for power or data. Power connectors can handle
    large amounts of voltage and/or current. Data connectors are used exclusively
    to send and receive information that generally consumes very low current or voltage.


    Tables [1-2](#504209_1_En_1_Chapter.xhtml#Tab2) through [1-4](#504209_1_En_1_Chapter.xhtml#Tab4)
    display more information about the previous components and are presented in three
    categories: power components, mechanical components, and control components.


    Table 1-4


    Mechanial Components and Characteristics


    | Mechanical component | Main characteristics | Frequent procedures | Types |

    | --- | --- | --- | --- |

    | Frame | Material, hardness, lightness, holes, levels, accessories, size and
    weight, landing gear, anti-shock systems, folding or not, electromagnetic shielding
    | Component connection, balancing, restoration | Common classifications are by
    size, materials, and folding ability |

    | Motors | kv, weight and dimensions, maximum current and voltage, maximum thrust
    and torque | Getting the start value and proportionality gains of torque and thrust
    with respect to their speed and the propeller, PWM binding (with the remote control)
    | Brushed and brushless, speed or position, kind of control signal (DC, BLDC,
    servo, stepper, AC, PWM RC or PWM duty cycle, etc.) |

    | Propellers | Pitch, diameter, edge, number of blades, flexibility, hardness,
    sense of rotation | Balancing, edge cutting | Usual classifications are based
    on the material, the flexibility, and the number of blades. |

    | Fasteners | Material, hardness, lightness, accessories, size and weight, fast
    or slow change | Each mechanical connection is a case of analysis and depends
    on the application. | Fast change or permanent connection |

    | Anti-vibration mounts | Size, frame compatibility, mobility, kind of suppression
    | Balancing | For motors, for autopilots, for sensors |


    Table 1-3


    Control Components and Characteristics


    | Control component | Main characteristics | Frequent procedures | Types |

    | --- | --- | --- | --- |

    | Autopilot | Size, weight, number of motors, connectors, available ports, architecture,
    programming language, processor, required power | Programming | Open and closed
    architectures |

    | Sensors | Resolution, size, weight, type, linearity, power required, kind of
    connector, range, and operating conditions | Soldering, signal coupling, filtering
    | Analog, digital, and serial |

    | Telemetry modules | Size, operating voltages and currents, required accessories,
    connectors compatibility, maximum distance, legality of operation frequencies
    | Binding and labeling, data speed configuration | American and European standards
    |

    | Remote controller | Maximum distance, support for LIPO batteries, legality of
    operation frequencies, number of channels, binding mode, type of auxiliary channels,
    sensitivity, transmission modes, screen or not, presence or not of a PPM channel
    in the receiver | Binding the receiver with the transmitter, sticks and buttons
    configuration | By number of channels and additional features as a screen |

    | Memory card | Memory size, type, adapters, accessibility for plugging, number
    of work cycles | Write, erase, external or on board use, format conversion | Usually
    by their memory size and commercial type |

    | Companion computer | The same that an autopilot has plus additional processing
    features and compatibilities with hardware and software | Programming | By level
    of code abstraction (natural language vs. machine language), also by their hardware
    performance |

    | Stop button | Accessibility to the user, size, colors, mechanical suppression
    | Level of accessibility, programming | Push buttons, sticks, based on time or
    based on events |

    | Data connectors | Standard to use and compatibilities, tools to use them, speed,
    electromagnetic shields, market availability, number of pins, sealed or not, standard
    or special versions, maximum voltage and current, easy or rigid plugging | Soldering,
    replacing, programming | It depends on each application. |


    Table 1-2


    Power Components and Characteristics


    | Power component | Main characteristics | Frequent procedures | Types |

    | --- | --- | --- | --- |

    | Battery | Number of cells, size, weight, amp hours, operating voltages, C or
    discharge rate, connectors, accessories required for their use (a charger) | Charge,
    discharge, storage, transportation, connector soldering, parallelization or serialization
    | There are many but LIPO batteries are the most abundant. |

    | Power supply | Power, current, voltage, ripple, frequency, input voltage (110/220),
    number of phases | Filtering if required, phase joint if required, amplification
    or reduction, regulation, discharge protection, transformation (AC-DC) | Switched
    and linear |

    | Battery indicator | Number of cells allowed, light or sound indicators | Pin
    verification | On board or external |

    | Power module | Maximum current supported, maximum voltage supported, electromagnetic
    shield, maximum current measured, type of connectors | Electromagnetic shielding
    if required, adding current or voltage sensors if required, parallelization if
    required | For low and high current |

    | Power distributor | Maximum current supported, maximum voltage supported, number
    of motors to be powered, BEC, size, weight, type electromagnetic shield | Terminal
    soldering, serialization or parallelization, electromagnetic shielding | Hub (harness)
    or board (circuit) |

    | Power connectors | Maximum current supported, maximum voltage supported, compatibility
    with the components, thermal resistance, flexibility, plug/unplug capacities |
    Terminal soldering, replacement | Each application has its own set of connectors.
    |

    | Power stages and ESCs | Maximum size, weight, current and voltage, reversibility,
    BEC or optocoupling | Configuration (usually via a software interface) | Reversible
    or non-reversible, PWM-RC or PWM duty cycle, standard or optocoupled, for brushless
    or brushed motors |


    Now that you know the introductory concepts about drone components, let’s see
    how to choose them.


    ## Component Selection


    This process is divided, as a recommended design, into three sub-processes (the
    analysis is carried out considering brushless motors since they are the most employed
    with quadcopters).


    ### Vehicle Selection


    Vehicle selection is an iterative process that consists of


    1.  Choosing motors. Motors are chosen according to the weight and the speed that
    you want to operate the vehicle. Therefore you must consult two important parameters
    in datasheets: the maximum weight that each motor can lift and its maximum value
    of RPMs (in brushless motors this is called kv and it must not be confused with
    the electromechanical constants of the motor).


    2.  According to the above (the load capacity and the speed of the vehicle), the
    propellers are chosen.


    3.  Once the motors and propellers are selected, the ESCs are chosen. Again, in
    the datasheet of the brushless motors you can find the current and voltage required
    by these operating conditions. This allows selecting the ESCs. It is recommended
    that ESCs consume 30% more current compared to that consumed by their respective
    motors in order to overcome power loss.


    4.  With the previous point and the inclusion of other components such as the
    autopilot and auxiliary motors, an adequate battery or power source is chosen.


    5.  Considering the dimensions of all the components and the final weight (which
    can be calculated by using individual datasheets for each element of the vehicle),
    the frame is selected.


    6.  Considering the final weight, you must return to the step 1 and verify that
    the motors still satisfy your requirements. If not, you must repeat the design
    process.'
  trans: "\n### 电气连接器\n\n电气连接器是一种用于连接各种电气或电子设备的方式。针对电力或数据传输，有不同版本的设计。电源连接器可处理大电压和/或大电流。数据连接器则专门用于发送和接收信息，通常消耗非常低的电流或电压。\n\
    \n表 1-2 至 1-4 提供了关于前述组件的更多信息，并按三类呈现：电源组件、机械组件和控制组件。\n\n#### 表 1-4  \n机械组件及特性\n\
    \n| 机械组件 | 主要特性 | 常见操作 | 类型 |\n| --- | --- | --- | --- |\n| 机架 | 材料、硬度、轻量性、孔位、水平度、配件、尺寸和重量、起落架、减震系统、是否可折叠、电磁屏蔽\
    \ | 组件连接、平衡调整、修复 | 常见分类依据：尺寸、材料和折叠能力 |\n| 电机 | `kv`值、重量和尺寸、最大电流和电压、最大推力和扭矩 | 获取扭矩和推力相对于转速及螺旋桨的初始值及比例增益、PWM\
    \ 绑定（与遥控器） | 有刷与无刷、速度或位置型、控制信号类型（直流、无刷直流、伺服、步进、交流、PWM RC 或 PWM 占空比等） |\n| 螺旋桨\
    \ | 螺距、直径、边缘、叶片数量、柔韧性、硬度、旋转方向 | 平衡调整、边缘修剪 | 通常按材料、柔韧性和叶片数量分类 |\n| 紧固件 | 材料、硬度、轻量性、配件、尺寸和重量、快速或慢速更换\
    \ | 每种机械连接都需要根据具体应用进行分析。 | 快速更换或永久连接 |\n| 减震支架 | 尺寸、机架兼容性、移动性、抑制方式 | 平衡调整 | 适用于电机、自动驾驶仪、传感器\
    \ |\n\n#### 表 1-3  \n控制组件及特性\n\n| 控制组件 | 主要特性 | 常见操作 | 类型 |\n| --- | --- | ---\
    \ | --- |\n| 自动驾驶仪 | 尺寸、重量、电机数量、连接器、可用端口、架构、编程语言、处理器、所需功率 | 编程 | 开放式与封闭式架构 |\n\
    | 传感器 | 分辨率、尺寸、重量、类型、线性度、所需功率、连接器类型、量程及工作条件 | 焊接、信号耦合、滤波 | 模拟、数字和串行 |\n| 遥测模块\
    \ | 尺寸、工作电压和电流、所需配件、连接器兼容性、最大距离、工作频率的合法性 | 绑定与标签、数据速率配置 | 美国与欧洲标准 |\n| 遥控器 | 最大距离、对\
    \ LIPO 电池的支持、工作频率的合法性、通道数量、绑定模式、辅助通道类型、灵敏度、传输模式、是否带屏幕、接收器是否包含 PPM 通道 | 接收器与发射器绑定、摇杆和按键配置\
    \ | 按通道数量和附加功能（如屏幕）分类 |\n| 存储卡 | 存储容量、类型、适配器、插拔便利性、工作循环次数 | 写入、擦除、板载或外部使用、格式转换\
    \ | 通常按存储容量和商业类型分类 |\n| 伴侣计算机 | 功能与自动驾驶仪相同，但增加额外处理能力及硬件/软件兼容性 | 编程 | 按代码抽象级别（自然语言与机器语言），也按硬件性能分类\
    \ |\n| 停止按钮 | 对用户的可达性、尺寸、颜色、机械抑制 | 可达性级别、编程 | 按键开关、摇杆、基于时间或基于事件 |\n| 数据连接器 | 使用的标准及兼容性、使用的工具、速度、电磁屏蔽、市场可用性、引脚数量、是否密封、标准或特殊版本、最大电压和电流、插拔的松紧程度\
    \ | 焊接、更换、编程 | 取决于具体应用 |\n\n#### 表 1-2  \n电源组件及特性\n\n| 电源组件 | 主要特性 | 常见操作 | 类型\
    \ |\n| --- | --- | --- | --- |\n| 电池 | 电芯数量、尺寸、重量、安时数、工作电压、C 倍率或放电率、连接器、使用所需配件（充电器）\
    \ | 充电、放电、存储、运输、连接器焊接、并联或串联 | 类型众多，但 LIPO 电池最为常见 |\n| 电源 | 功率、电流、电压、纹波、频率、输入电压（110/220）、相数\
    \ | 若需要则进行滤波、若需要则进行并相、升压或降压、稳压、放电保护、变换（AC-DC） | 开关电源和线性电源 |\n| 电池指示器 | 支持的电芯数量、灯光或声音指示\
    \ | 引脚验证 | 板载式或外接式 |\n| 电源模块 | 支持的最大电流、支持的最大电压、电磁屏蔽、可测量的最大电流、连接器类型 | 若需要则进行电磁屏蔽、若需要则添加电流或电压传感器、若需要则进行并联\
    \ | 用于低电流和高电流 |\n| 电源分配器 | 支持的最大电流、支持的最大电压、供电电机数量、BEC、尺寸、重量、电磁屏蔽类型 | 端子焊接、串联或并联、电磁屏蔽\
    \ | 集线器（线束）或电路板（电路） |\n| 电源连接器 | 支持的最大电流、支持的最大电压、与组件的兼容性、热阻、柔韧性、插拔能力 | 端子焊接、更换\
    \ | 每种应用都有其特定的连接器组 |\n| 功率级与电调 | 最大尺寸、重量、电流和电压、可逆性、BEC 或光耦隔离 | 配置（通常通过软件界面） |\
    \ 可逆或不可逆、PWM-RC 或 PWM 占空比、标准或光耦隔离、适用于无刷或有刷电机 |\n\n现在你已经了解了关于无人机组件的基础概念，接下来看看如何选择它们。\n\
    \n## 组件选择\n\n按照推荐的设计流程，这一过程分为三个子过程（为便于分析，假设使用的是无刷电机，因为这是四轴飞行器中最常用的类型）。\n\n###\
    \ 飞行器选择\n\n飞行器选择是一个迭代过程，包括：\n\n1. 选择电机。电机是根据飞行器期望的运行重量和速度来选择的。因此，你必须查阅数据手册中的两个重要参数：每个电机能提升的最大重量，以及其最大转速值（在无刷电机中，这被称为`kv`值，注意不要与电机的机电常数混淆）。\n\
    \n2. 根据上述内容（即飞行器的负载能力和速度），选择螺旋桨。\n\n3. 选定电机和螺旋桨后，选择电调。同样，在无刷电机的数据手册中，你可以找到这些运行条件所需的电流和电压。这有助于选择合适的电调。建议电调的电流容量比其对应电机消耗的电流高出\
    \ 30%，以克服功率损耗。\n\n4. 结合上一点以及自动驾驶仪、辅助电机等其他组件的需求，选择合适的电池或电源。\n\n5. 考虑所有组件的尺寸和最终重量（可以通过查阅飞行器每个元件的单独数据手册来计算），然后选择机架。\n\
    \n6. 考虑最终重量后，你必须返回步骤 1，验证电机是否仍能满足你的要求。如果不能，则必须重复设计过程。\n"
- fmt: '### Remote Control Selection


    The remote control is the direct link with the pilot, assuming that you want a
    manual intervention or at least a human-controlled emergency stop. The selection
    process is as follows:


    1. The minimum number of channels to fly a quadcopter are four (`X`, `Y`, `Z`,
    and yaw angle). In other vehicles, for example a car, they are only two (moving
    forward and turning). However, you must take into account if you also require
    an emergency stop, a button that could be used to open and close a clamp. Each
    one of these tasks needs at least their own auxiliary channel. Hence, six, eight,
    or ten channel radio controls are employed. These additional channels can be sticks,
    buttons, or knobs, and they can be used through combinatorial logics and activation
    states (to learn more about state machines, see my book on `Ardupilot` and other
    references included in the Appendix).


    2. Once you know how many channels you require, the next thing is to determine
    the maximum distance that the remote control will allow from the human operator
    to the vehicle. This will determine the operation area in which the vehicle will
    have human interaction, and this will affect whether or not the drone would be
    recoverable in an emergency.


    3. The following are subjective details of operation, and consist in asking yourself
    about whether or not a camera monitor on the remote control is necessary, whether
    you want to operate more than one vehicle with the same RC, and so on.


    4. The next step is to find out how long you need to use the vehicle because this
    will affect the durability of the batteries in the remote control. This way remote
    controls with LIPO battery connectors are recommended for long periods of working
    time.


    5. Finally, you must verify that the autopilot and the remote control receiver
    have `PPM` ports. Otherwise, you must buy the corresponding adapters.


    ### Autopilot Selection


    The autopilot selection will depend on your programming skills and also on the
    degree of immersion you want to have with the vehicle.


    1. If you do not need to program specialized tasks, it is enough to buy a generic
    drone.


    2. If more specialized tasks are required but you do not know how to program,
    it is recommended that you buy an autopilot that allows you to use a GUI, such
    as `Mission Planner`. A recommended autopilot here is the `Pixhawk`.


    3. If you know how to program and you want to design your own tasks without concentrating
    on the design of the vehicle, it is recommended that you use a simplified SDK
    such as `Dronekit`. This SDK requires that you know how to program in the `Python`
    language but allows the vehicle to be used as a particle that moves in `X`, `Y`,
    `Z`, and rotates on its own axis. The `Pixhawk` is also recommended here.


    4. If you (in addition to the previous point) just want to design or test control
    laws in predesigned vehicles, then it is necessary to use an extended SDK. This
    kind of SDK allows operating a vehicle in particle mode but through force and
    torque interaction instead of just defining trajectories. An example is the `Bebop
    Autonomy SDK` or the `Simulink` libraries for the `Pixhawk` autopilot.


    5. If you, in addition to point 4, are designing an experimental vehicle or a
    vehicle that is out of the standard models that are compatible with the extended
    SDKs, then you require an autopilot compatible with a full SDK. Examples of this
    type of SDK are the `Ardupilot` libraries and the `PX4` libraries. Again, the
    `Pixhawk` autopilot can be used here.


    6. If, in addition to what is described in point 5, you must carry out other specialized
    tasks, such as the use of artificial vision, it is highly recommended that you
    employ a companion computer together with the autopilot. For example, you can
    use a `Raspberry Pi`, an `Odroid`, or a laptop with `ROS` to perform the artificial
    vision algorithm, in combination with the `Pixhawk` executing the flight algorithm.
    Or, even better, you can use an embedded unit that combines the autopilot and
    the companion computer such as `NavIO` cards or the `ErleBrain`.


    Notice that moving forward through the selection process also involves moving
    from a hobbyist user to a scientific one, requiring a deeper understanding of
    programming, control, and mathematical modeling, but in return you will have the
    capacity for a total design and not only the restrictions of selecting a few parameters.


    You learned about the components and how to select them. It’s time that you learn
    how to assemble them.


    ## Component Connection


    This section illustrates the way to connect the components of a drone. This can
    help you avoid very common assembly mistakes at the mechanical, electrical, and
    control levels.


    ### Mechanical Connection


    The main element of the mechanical connection is the frame, to which the rest
    of the components are attached. See Figure [1-16](#504209_1_En_1_Chapter.xhtml#Fig16).


    ![../images/504209_1_En_1_Chapter/504209_1_En_1_Fig16_HTML.jpg](images/504209_1_En_1_Chapter/504209_1_En_1_Fig16_HTML.jpg)


    Figure 1-16: Mechanical connection


    ### Electrical Connection


    The central element here is the battery or power supply. Notice that the motors
    are not directly plugged to this power supply. See Figure [1-17](#504209_1_En_1_Chapter.xhtml#Fig17).


    ![../images/504209_1_En_1_Chapter/504209_1_En_1_Fig17_HTML.jpg](images/504209_1_En_1_Chapter/504209_1_En_1_Fig17_HTML.jpg)


    Figure 1-17: Electrical connection


    ### Control Connection


    The central element here is the autopilot. In this level is also placed the user
    interface or the interface with an auxiliary computer located on the ground. See
    Figure [1-18](#504209_1_En_1_Chapter.xhtml#Fig18).


    ![../images/504209_1_En_1_Chapter/504209_1_En_1_Fig18_HTML.jpg](images/504209_1_En_1_Chapter/504209_1_En_1_Fig18_HTML.jpg)


    Figure 1-18: Control connection


    ## Summary


    In this chapter, you learned about the components for designing drones with a
    particular focus on quadcopters but extendable to other types of aircraft, including
    their historical context, etymologies, and the most common search results in order
    to choose the name of your work. You also learned about the type of drones that
    are useful for your activities, some generic security measures, as well as the
    most widely used international standard for modeling and design of a drone and
    its components. Regarding the components, you learned some useful classifications,
    their most frequent characteristics and procedures, and their connections and
    selection. You are invited to take a look at the Appendix for a selected bibliography
    to complete your knowledge in the indicated topics. In the next chapter, you will
    learn about drone modeling, which is also useful for many types of aerial vehicles.'
  raw: '### Remote Control Selection


    The remote control is the direct link with the pilot, assuming that you want a
    manual intervention or at least a human-controlled emergency stop. The selection
    process is as follows:


    1.  The minimum number of channels to fly a quadcopter are four (X, Y, Z, and
    yaw angle). In other vehicles, for example a car, they are only two (moving forward
    and turning). However, you must take into account if you also require an emergency
    stop, a button that could be used to open and close a clamp. Each one of these
    tasks needs at least their own auxiliary channel. Hence, six, eight, or ten channel
    radio controls are employed. These additional channels can be sticks, buttons,
    or knobs, and they can be used through combinatorial logics and activation states
    (to learn more about state machines, see my book on Ardupilot and other references
    included in the Appendix).


    2.  Once you know how many channels you require, the next thing is to determine
    the maximum distance that the remote control will allow from the human operator
    to the vehicle. This will determine the ​​operation area in which the vehicle
    will have human interaction, and this will affect whether or not the drone would
    be recoverable in an emergency.


    3.  The following are subjective details of operation, and consist in asking yourself
    about whether or not a camera monitor on the remote control is necessary, whether
    you want to operate more than one vehicle with the same RC, and so on.


    4.  The next step is to find out how long you need to use the vehicle because
    this will affect the durability of the batteries in the remote control. This way
    remote controls with LIPO battery connectors are recommended for long periods
    of working time.


    5.  Finally, you must verify that the autopilot and the remote control receiver
    have PPM ports. Otherwise, you must buy the corresponding adapters .


    ### Autopilot Selection


    The autopilot selection will depend on your programming skills and also on the
    degree of immersion you want to have with the vehicle.


    1.  If you do not need to program specialized tasks, it is enough to buy a generic
    drone.


    2.  If more specialized tasks are required but you do not know how to program,
    it is recommended that you buy an autopilot that allows you to use a GUI, such
    as Mission Planner. A recommended autopilot here is the Pixhawk.


    3.  If you know how to program and you want to design your own tasks without concentrating
    on the design of the vehicle, it is recommended that you use a simplified SDK
    such as Dronekit. This SDK requires that you know how to program in the Python
    language but allows the vehicle to be used as a particle that moves in X, Y, Z,
    and rotates on its own axis. The Pixhawk is also recommended here.


    4.  If you (in addition to the previous point) just want to design or test control
    laws in predesigned vehicles, then it is necessary to use an extended SDK. This
    kind of SDK allows operating a vehicle in particle mode but through force and
    torque interaction instead of just defining trajectories. An example is the Bebop
    Autonomy SDK or the Simulink libraries for the Pixhawk autopilot.


    5.  If you, in addition to point 4, are designing an experimental vehicle or a
    vehicle that is out of the standard models that are compatible with the extended
    SDKs, then you require an autopilot compatible with a full SDK. Examples of this
    type of SDK are the Ardupilot libraries and the PX4 libraries. Again, the Pixhawk
    autopilot can be used here.


    6.  If, in addition to what is described in point 5, you must carry out other
    specialized tasks, such as the use of artificial vision, it is highly recommended
    that you employ a companion computer together with the autopilot. For example,
    you can use a Raspberry Pi, an Odroid, or a laptop with ROS to perform the artificial
    vision algorithm, in combination with the Pixhawk executing the flight algorithm.
    Or, even better, you can use an embedded unit that combines the autopilot and
    the companion computer such as NavIO cards or the ErleBrain.


    Notice that moving forward through the selection process also involves moving
    from a hobbyist user to a scientific one, requiring a deeper understanding of
    programming, control, and mathematical modeling, but in return you will have the
    capacity for a total design and not only the restrictions of selecting a few parameters.


    You learned about the components and how to select them. It’s time that you learn
    how to assemble them .


    ## Component Connection


    This section illustrates the way to connect the components of a drone. This can
    help you avoid very common assembly mistakes at the mechanical, electrical, and
    control levels.


    ### Mechanical Connection


    The main element of the mechanical connection is the frame, to which the rest
    of the components are attached. See Figure [1-16](#504209_1_En_1_Chapter.xhtml#Fig16).


    ![../images/504209_1_En_1_Chapter/504209_1_En_1_Fig16_HTML.jpg](images/504209_1_En_1_Chapter/504209_1_En_1_Fig16_HTML.jpg)


    Figure 1-16


    Mechanical connection


    ### Electrical Connection


    The central element here is the battery or power supply. Notice that the motors
    are not directly plugged to this power supply. See Figure [1-17](#504209_1_En_1_Chapter.xhtml#Fig17).


    ![../images/504209_1_En_1_Chapter/504209_1_En_1_Fig17_HTML.jpg](images/504209_1_En_1_Chapter/504209_1_En_1_Fig17_HTML.jpg)


    Figure 1-17


    Electrical connection


    ### Control Connection


    The central element here is the autopilot. In this level is also placed the user
    interface or the interface with an auxiliary computer located on the ground. See
    Figure [1-18](#504209_1_En_1_Chapter.xhtml#Fig18).


    ![../images/504209_1_En_1_Chapter/504209_1_En_1_Fig18_HTML.jpg](images/504209_1_En_1_Chapter/504209_1_En_1_Fig18_HTML.jpg)


    Figure 1-18


    Control connection


    ## Summary


    In this chapter, you learned about the components for designing drones with a
    particular focus on quadcopters but extendable to other types of aircraft, including
    their historical context, etymologies, and the most common search results in order
    to choose the name of your work. You also learned about the type of drones that
    are useful for your activities, some generic security measures, as well as the
    most widely used international standard for modeling and design of a drone and
    its components. Regarding the components, you learned some useful classifications,
    their most frequent characteristics and procedures, and their connections and
    selection. You are invited to take a look at the Appendix for a selected bibliography
    to complete your knowledge in the indicated topics. In the next chapter, you will
    learn about drone modeling, which is also useful for many types of aerial vehicles.'
  trans: '

    ### 遥控器选择


    遥控器是与飞行员直接连接的设备，前提是你希望进行手动干预或至少拥有一个由人类控制的紧急停止装置。选择流程如下：


    1. 操控四轴飞行器所需的最少通道数为四个（`X`、`Y`、`Z`和偏航角）。对于其他类型的载具，例如汽车，则只需两个通道（前进和转向）。但你必须考虑是否需要紧急停止功能、一个可用于开启和关闭夹具的按钮。这些任务中的每一个至少都需要一个独立的辅助通道。因此，通常会使用六通道、八通道或十通道的无线电遥控器。这些额外的通道可以是摇杆、按钮或旋钮，并且可以通过组合逻辑和激活状态来使用（如需了解更多关于状态机的信息，请参阅我关于`Ardupilot`的书籍以及附录中提供的其他参考资料）。


    2. 一旦你确定了所需的通道数量，接下来要确定的是遥控器允许操作员与载具之间的最大距离。这将决定载具与人类交互的操作区域，并进而影响无人机在紧急情况下是否可回收。


    3. 接下来是一些操作上的主观细节，包括自问：遥控器上是否需要摄像头显示器？是否希望用同一个遥控器操控多个载具？等等。


    4. 下一步是确定你需要使用载具多长时间，因为这会影响遥控器电池的续航能力。因此，对于长时间工作，建议使用带有 LIPO 电池接口的遥控器。


    5. 最后，你必须确认自动驾驶仪和遥控器接收机具有`PPM`端口。否则，你必须购买相应的适配器。


    ### 自动驾驶仪选择


    自动驾驶仪的选择取决于你的编程技能，以及你希望与载具的交互深度。


    1. 如果你不需要编程执行专门任务，购买一架通用无人机就足够了。


    2. 如果需要更专门的任务，但你不懂如何编程，则建议购买一个允许你使用图形用户界面（GUI，如`Mission Planner`）的自动驾驶仪。这里推荐使用的自动驾驶仪是`Pixhawk`。


    3. 如果你会编程，并且希望在无需专注于载具设计的情况下设计自己的任务，建议使用简化版的 SDK，例如`Dronekit`。这个 SDK 要求你掌握`Python`语言编程技能，但它允许将载具视为一个可在`X`、`Y`、`Z`方向上移动并绕自身轴旋转的质点。这里同样推荐使用`Pixhawk`。


    4. 如果你（在上述基础上）还希望在预设计的载具上设计或测试控制律，那么你需要使用扩展 SDK。这类 SDK 允许以质点模式操控载具，但交互方式是通过力和力矩，而不仅仅是定义轨迹。例如，适用于`Pixhawk`自动驾驶仪的`Bebop
    Autonomy SDK`或`Simulink`库。


    5. 如果你在第 4 点的基础上，正在设计一个实验性载具，或一个超出扩展 SDK 兼容标准型号范围的载具，那么你需要一个兼容完整 SDK 的自动驾驶仪。这类
    SDK 的示例包括`Ardupilot`库和`PX4`库。同样，这里可以使用`Pixhawk`自动驾驶仪。


    6. 如果除了第 5 点所述的之外，你还必须执行其他专门任务，例如使用人工智能视觉，则强烈建议你使用一个伴随计算机与自动驾驶仪协同工作。例如，你可以使用一个搭载`ROS`系统的`Raspberry
    Pi`、`Odroid`或笔记本电脑来执行人工智能视觉算法，同时结合`Pixhawk`执行飞行算法。或者，更佳方案是使用一个将自动驾驶仪和伴随计算机整合在一起的嵌入式单元，例如`NavIO`板卡或`ErleBrain`。


    请注意，在选择过程中向前推进，也意味着从爱好者用户向科研用户的转变，这需要对编程、控制和数学建模有更深入的理解，但作为回报，你将拥有进行整体设计的能力，而不仅仅是在选择少数几个参数时受到限制。


    你已经了解了这些组件以及如何选择它们。现在是时候学习如何组装它们了。


    ## 组件连接


    本节将说明如何连接无人机的各个组件。这可以帮助你避免在机械、电气和控制层面常见的装配错误。


    ### 机械连接


    机械连接的主要元件是机架，其余所有组件都安装在其上。见图 1-16。


    ![../images/504209_1_En_1_Chapter/504209_1_En_1_Fig16_HTML.jpg](img/504209_1_En_1_Fig16_HTML.jpg)


    图 1-16：机械连接


    ### 电气连接


    这里的中心元件是电池或电源。请注意，电机并非直接连接到该电源。见图 1-17。


    ![../images/504209_1_En_1_Chapter/504209_1_En_1_Fig17_HTML.jpg](img/504209_1_En_1_Fig17_HTML.jpg)


    图 1-17：电气连接


    ### 控制连接


    这里的中心元件是自动驾驶仪。在此层面，还包含了用户界面或与地面辅助计算机的接口。见图 1-18。


    ![../images/504209_1_En_1_Chapter/504209_1_En_1_Fig18_HTML.jpg](img/504209_1_En_1_Fig18_HTML.jpg)


    图 1-18：控制连接


    ## 总结


    在本章中，你学习了设计无人机的组件知识，特别侧重于四轴飞行器，但这些知识也可扩展到其他类型的飞行器，包括它们的历史背景、词源学，以及为你的作品选择名称时最常见的搜索结果。你还了解了适合你活动的无人机类型、一些通用的安全措施，以及用于无人机及其组件建模和设计的、最广泛使用的国际标准。在组件方面，你学习了有用的分类、最常见的特性和流程，以及它们的连接和选择方法。我们邀请你查阅附录中的精选参考文献，以完善你在相应主题上的知识。在下一章中，你将学习无人机建模，这对于许多类型的空中载具也很有用。

    '
- fmt: '# 2. Modeling


    This chapter focuses on the modeling of drones. You will learn about frames of
    reference, kinematics, dynamics, models of propulsion or allocation, and linear
    modeling considerations. As a result, you will be able to model a drone and extend
    this knowledge to other types of vehicles and aircraft.


    Regarding aerodynamics, we won’t cover these topics because the design of the
    vehicles analyzed in this book are mostly vertical takeoff and have low speeds,
    light weights, and/or small size areas in their operation with respect to other
    types of vehicles (airplanes and manned aircraft, for example). See Figure [2-1](#504209_1_En_2_Chapter.xhtml#Fig1).


    You may notice that a multicopter requires thrust components to achieve its motion
    (this is called thrust vectoring). For this reason, we separate the aerodynamic
    analysis into two useful sections in the Appendix. One of them is about the calculation
    of the maximum drone speeds and could serve for the design of racing drones. The
    other is about how to extend the knowledge of this book to other types of aircraft.
    In these sections, you will use the knowledge acquired in this chapter and you
    will expand it by introducing aerodynamic effects.


    The elements that have high aerodynamic effects due to their rotation speeds are
    the propellers. However, they will not be considered here because it is assumed
    that you will not manufacture your own propellers but rather you will buy them
    (but if necessary, you can read more about their design in the references section
    of the Appendix). It is also assumed that you will fly your aircraft most of the
    time at a considerable distance from the floor or walls or even other objects
    and vehicles; otherwise, you can read related information about restrictions in
    the Appendix.


    Let’s start with a description of the frames of modeling.


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Fig1_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Fig1_HTML.jpg)


    Figure 2-1


    Generic forces acting on a plane and a quadcopter equivalent


    ## Frames of Modeling


    There are three frames of modeling associated with a quadcopter, as you will soon
    see. The modeling of said vehicle is developed in mixed frames and is done at
    the convenience of the sensors and mathematical operations. These frames are the
    world frame, the vehicle frame, and the motor frame, and they are illustrated
    in Figure [2-2](#504209_1_En_2_Chapter.xhtml#Fig2).


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Fig2_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Fig2_HTML.jpg)


    Figure 2-2


    Frames of modeling


    *   The world frame (or base, or fixed frame, or inertial frame) indicates a fixed
    coordinate system. The vehicle moves with respect to this fixed reference. This
    can be a global geographical reference such as an Earth pole, a simple corner,
    or the center of a room.


    *   The vehicle frame (or body frame, or mobile, or non-inertial frame) indicates
    the coordinate system that is usually placed at a point of interest on board the
    vehicle (the geometric center, or the mass center, or the gravitational or buoyancy
    centers, among many others). It is with respect to this frame and the fixed frame
    that translations and rotations are measured.


    *   Finally, the frame of the motors (or propulsion frame, or actuator, or allocation
    frame) is each one of the frames placed on each motor. They have the function
    of distributing the force and torque of each motor to the vehicle’s reference
    frame.


    Notice that in order to facilitate the calculations, as far as possible, the `Z`
    axes corresponding to the world and the vehicle frames, respectively, are usually
    placed in parallel. This is because the quadcopter design allows it and, as you
    will see later, because smooth flight considerations are made (this simplification
    in the selection of said axes is not possible in vehicles with more advanced mobility,
    for example those of the omnidirectional type).


    It’s time to move on to the kinematics of the drone. First we will consider translational
    kinematics.'
