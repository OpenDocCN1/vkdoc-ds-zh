- fmt: "# Introduction to Lyapunov Stability\n\nThis section is for those who want\
    \ to know more about the extended and formal proofs available in the aforementioned\
    \ articles which are based on the Lyapunov stability theory and that complete\
    \ the previous section. There are two Lyapunov methods, one for linear systems,\
    \ and the other for nonlinear systems. Given the scope of the second method and\
    \ the fact that the linear is a particular case of it, we will briefly explain\
    \ its use through examples and also its graphic interpretation.\n\n## Step 1\n\
    \nGiven a system, for example the first order system and the damped harmonic oscillator\
    \ without a control input, remember the fact that we arrive at these systems once\
    \ we apply closed loop controllers to our dynamic systems, as you can see in the\
    \ previous sections.\n\n![../images/504209_1_En_3_Chapter/504209_1_En_3_Figej_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figej_HTML.jpg)\n\
    \nA virtual energy can be proposed. This is a scalar function of several variables\
    \ that is always positive except in its minimum value, where it is zero, or a\
    \ total immobility condition, or a stable condition. In general, this function\
    \ depends on the variables that we are analyzing.\n\n![../images/504209_1_En_3_Chapter/504209_1_En_3_Figek_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figek_HTML.jpg)\n\
    \nFor the first system, a function that satisfies the previous conditions is the\
    \ following (notice that its graphical representation is a concave parabola):\n\
    \n![../images/504209_1_En_3_Chapter/504209_1_En_3_Figel_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figel_HTML.jpg)\n\
    \nFor the second system, another example of function that satisfies both conditions\
    \ is this one (its graphical representation is an elliptic paraboloid that is\
    \ also concave):\n\n![../images/504209_1_En_3_Chapter/504209_1_En_3_Figem_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figem_HTML.jpg)\n\
    \nFrom now on, note that a Lyapunov function is usually denoted by the letter\
    \ `V` (it is possible that this is because `V` seems to be the graphical representation\
    \ of a concave function). Also, note that they are frequently divided by 2 in\
    \ order not to drag the factor of 2 when deriving the Lyapunov squared functions.\n\
    \nObserve that a Lyapunov function usually has the shape displayed in Figure [3-21](#504209_1_En_3_Chapter.xhtml#Fig21)\
    \ (at least as it can be represented as such when it depends on only one or two\
    \ variables). It looks like concave vessels, not necessarily curved. Some of them\
    \ look like inverted pyramids (the idea can be extended for more than two variables).\n\
    \n![../images/504209_1_En_3_Chapter/504209_1_En_3_Fig21_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Fig21_HTML.jpg)\n\
    \n**Figure 3-21**  \nA 3D example of a Lyapunov function\n\n## Step 2\n\nThe derivative\
    \ of the Lyapunov function with respect to the time must be negative, or at least\
    \ negative semidefinite, and must depend on one or more of our variables of interest.\
    \ This has a lot to do with the graphical analogy. Remember that Lyapunov functions\
    \ are concave and closed containers, and their slope seen from any point on their\
    \ surfaces is negative. See Figure [3-22](#504209_1_En_3_Chapter.xhtml#Fig22).\
    \ This implies that the states of a system \"placed\" on said energy surface \"\
    will slide\" towards the minimum point of the surface, or condition of stability,\
    \ or null energy, or simply that the system will stop at the minimum value of\
    \ energy.\n\n![../images/504209_1_En_3_Chapter/504209_1_En_3_Fig22_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Fig22_HTML.jpg)\n\
    \n**Figure 3-22**  \nThe derivative of a Lyapunov function (3D and 2D examples)\n\
    \n![../images/504209_1_En_3_Chapter/504209_1_En_3_Figen_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figen_HTML.jpg)\n\
    \nFor the first order system:\n\n![../images/504209_1_En_3_Chapter/504209_1_En_3_Figeo_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figeo_HTML.jpg)\n\
    \nAnd replacing the system for which said Lyapunov function was designed:"
  raw: '## Introduction to Lyapunov Stability


    This section is for those who want to know more about the extended and formal
    proofs available in the aforementioned articles which are based on the Lyapunov
    stability theory and that complete the previous section. There are two Lyapunov
    methods, one for linear systems, and the other for nonlinear systems. Given the
    scope of the second method and the fact that the linear is a particular case of
    it, we will briefly explain its use through examples and also its graphic interpretation.


    Step 1


    Given a system, for example the first order system and the damped harmonic oscillator
    without a control input, remember the fact that we arrive at these systems once
    we apply closed loop controllers to our dynamic systems, as you can see in the
    previous sections.


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figej_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figej_HTML.jpg)


    A virtual energy can be proposed. This is a scalar function of several variables
    that is always positive except in its minimum value, where it is zero, or a total
    immobility condition, or a stable condition. In general, this function depends
    on the variables that we are analyzing.


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figek_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figek_HTML.jpg)


    For the first system, a function that satisfies the previous conditions is the
    following (notice that its graphical representation is a concave parabola):


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figel_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figel_HTML.jpg)


    For the second system, another example of function that satisfies both conditions
    is this one (its graphical representation is an elliptic paraboloid that is also
    concave):


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figem_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figem_HTML.jpg)


    From now on, note that a Lyapunov function is usually denoted by the letter V
    (it is possible that this is because V seems to be the graphical representation
    of a concave function). Also, note that they are frequently divided by 2 in order
    not to drag the factor of 2 when deriving the Lyapunov squared functions.


    Observe that a Lyapunov function usually has the shape displayed in Figure [3-21](#504209_1_En_3_Chapter.xhtml#Fig21)
    (at least as it can be represented as such when it depends on only one or two
    variables). It looks like concave vessels, not necessarily curved. Some of them
    look like inverted pyramids (the idea can be extended for more than two variables).


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Fig21_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Fig21_HTML.jpg)


    Figure 3-21


    A 3D example of a Lyapunov function


    Step 2


    The derivative of the Lyapunov function with respect to the time must be negative,
    or at least negative semidefinite, and must depend on one or more of our variables
    of interest. This has a lot to do with the graphical analogy. Remember that Lyapunov
    functions are concave and closed containers, and their slope seen from any point
    on their surfaces is negative. See Figure [3-22](#504209_1_En_3_Chapter.xhtml#Fig22).
    This implies that the states of a system “placed” on said energy surface “will
    slide” towards the minimum point of the surface, or condition of stability, or
    null energy, or simply that the system will stop at the minimum value of energy.


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Fig22_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Fig22_HTML.jpg)


    Figure 3-22


    The derivative of a Lyapunov function (3D and 2D examples)


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figen_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figen_HTML.jpg)


    For the first order system:


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figeo_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figeo_HTML.jpg)


    And replacing the system for which said Lyapunov function was designed:'
  trans: "\n# 李雅普诺夫稳定性简介\n\n本节适用于希望进一步了解前述文章中基于李雅普诺夫稳定性理论的扩展形式证明的读者，这些内容是对上节的补充。李雅普诺夫方法共有两种，一种针对线性系统，另一种针对非线性系统。考虑到第二种方法的适用范围更广，且线性系统只是其中的一个特例，我们将通过示例简要说明其用法，并给出图形化解释。\n\
    \n## 第一步\n\n给定一个系统，例如不含控制输入的一阶系统和阻尼谐振子。请记住，正如前文所述，我们是在对动态系统施加闭环控制器后得到这些系统的。\n\n\
    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figej_HTML.jpg](img/504209_1_En_3_Figej_HTML.jpg)\n\
    \n可以提出一种虚拟能量。这是一个关于多个变量的标量函数，除了在其最小值处（零值，或完全静止条件，或稳定条件）之外，该函数始终为正。通常情况下，该函数取决于我们正在分析的变量。\n\
    \n![../images/504209_1_En_3_Chapter/504209_1_En_3_Figek_HTML.jpg](img/504209_1_En_3_Figek_HTML.jpg)\n\
    \n对于第一个系统，满足上述条件的函数如下所示（注意其图形表示是一个凹抛物线）：\n\n![../images/504209_1_En_3_Chapter/504209_1_En_3_Figel_HTML.jpg](img/504209_1_En_3_Figel_HTML.jpg)\n\
    \n对于第二个系统，另一个满足这两个条件的函数示例如下（其图形表示是一个同样凹陷的椭圆抛物面）：\n\n![../images/504209_1_En_3_Chapter/504209_1_En_3_Figem_HTML.jpg](img/504209_1_En_3_Figem_HTML.jpg)\n\
    \n从现在起，请注意李雅普诺夫函数通常用字母 `V` 表示（这可能是因为 `V` 看起来像一个凹函数的图形表示）。此外，请注意这些函数经常被除以 2，以便在对李雅普诺夫平方函数求导时避免出现因子\
    \ 2。\n\n观察可知，李雅普诺夫函数通常具有图 3-21 所示的形状（至少当它仅依赖一个或两个变量时可以这样表示）。它们看起来像凹形容器，但不一定都是弯曲的。有些看起来像倒金字塔（该概念可以扩展到多于两个变量的情况）。\n\
    \n![../images/504209_1_En_3_Chapter/504209_1_En_3_Fig21_HTML.jpg](img/504209_1_En_3_Fig21_HTML.jpg)\n\
    \n**图 3-21**  \n李雅普诺夫函数的三维示例\n\n## 第二步\n\n李雅普诺夫函数对时间的导数必须为负，或至少为半负定，并且必须依赖于我们关心的一个或多个变量。这与图形类比密切相关。请记住，李雅普诺夫函数是凹的封闭容器，从其表面上任意一点观察，其斜率均为负。见图\
    \ 3-22。这意味着，\"放置\"在该能量表面上的系统状态将\"滑向\"表面的最低点，即稳定条件或零能量状态，简单来说，系统将在能量的最小值处停止。\n\n\
    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Fig22_HTML.jpg](img/504209_1_En_3_Fig22_HTML.jpg)\n\
    \n**图 3-22**  \n李雅普诺夫函数的导数（三维和二维示例）\n\n![../images/504209_1_En_3_Chapter/504209_1_En_3_Figen_HTML.jpg](img/504209_1_En_3_Figen_HTML.jpg)\n\
    \n对于一阶系统：\n\n![../images/504209_1_En_3_Chapter/504209_1_En_3_Figeo_HTML.jpg](img/504209_1_En_3_Figeo_HTML.jpg)\n\
    \n并将该李雅普诺夫函数所针对的系统代入：\n"
- fmt: "This derivative is negative semidefined and depends totally or partially on\
    \ the states of our interest.\n\nFor the damped harmonic oscillator system, we\
    \ have\n\n![../images/504209_1_En_3_Chapter/504209_1_En_3_Figeq_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figeq_HTML.jpg)\n\
    \nAnd replacing the system for which said Lyapunov function was designed:\n\n\
    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figer_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figer_HTML.jpg)\n\
    \nThis derivative is negative semidefined and depends totally or partially on\
    \ the states of our interest. (In this case, it does not depend on the error but\
    \ on its derivative. Soon we will see how to deal with this problem.)\n\nIf for\
    \ the first order system we had proposed\n\n![../images/504209_1_En_3_Chapter/504209_1_En_3_Figes_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figes_HTML.jpg)\n\
    \nthe derivative of the Lyapunov function would not alter its negativity, nor\
    \ the Lyapunov function its positivity while the constant `Kp` was positive. You\
    \ will remember this fact soon.\n\nNote that we can only say that the states with\
    \ respect to which the Lyapunov derivative depends tend to the behavior of the\
    \ minimum energy of the Lyapunov function; that is, they tend to 0\\. If the rest\
    \ of the states do not appear, we cannot ensure anything about them, and we must\
    \ design and try a new Lyapunov function.\n\n### Step 3\n\nBy using auxiliary\
    \ postulates, known as Barbalat’s lemma or Lasalle’s principle (they are used\
    \ according to the type of system you have, so you must investigate them), it\
    \ must be evaluated when `V` and its derivatives are zero if the states of the\
    \ system also tend to zero. This is because local valleys may occur, as in Figure\
    \ [3-23](#504209_1_En_3_Chapter.xhtml#Fig23). In these valleys, the energy value\
    \ is zero, but the system will not reach the minimum value of the Lyapunov function,\
    \ but a local trap.\n\n![../images/504209_1_En_3_Chapter/504209_1_En_3_Fig23_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Fig23_HTML.jpg)\n\
    \n**Figure 3-23**  \nLocal and global minimal values at a Lyapunov function\n\n\
    For the first example, let’s see what happens when the derivative of `V` is equal\
    \ to zero:\n\n![../images/504209_1_En_3_Chapter/504209_1_En_3_Figet_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figet_HTML.jpg)\n\
    \n![../images/504209_1_En_3_Chapter/504209_1_En_3_Figeu_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figeu_HTML.jpg)\n\
    \nand also\n\n![../images/504209_1_En_3_Chapter/504209_1_En_3_Figev_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figev_HTML.jpg)\n\
    \nThis result could also be reached with the system equation:\n\n![../images/504209_1_En_3_Chapter/504209_1_En_3_Figew_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figew_HTML.jpg)\n\
    \nThus,\n\n![../images/504209_1_En_3_Chapter/504209_1_En_3_Figex_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figex_HTML.jpg)\n\
    \nFor the second system, we proceed in the same way:\n\n![../images/504209_1_En_3_Chapter/504209_1_En_3_Figey_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figey_HTML.jpg)\n\
    \nand also\n\n![../images/504209_1_En_3_Chapter/504209_1_En_3_Figez_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figez_HTML.jpg)\n\
    \nSolving for the double derivative of `e` by replacing the found values of `e`\
    \ and its first derivative:\n\n![../images/504209_1_En_3_Chapter/504209_1_En_3_Figfa_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figfa_HTML.jpg)\n\
    \nThis result could also be reached with the system equation:\n\n![../images/504209_1_En_3_Chapter/504209_1_En_3_Figfb_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figfb_HTML.jpg)\n\
    \nThus,\n\n![../images/504209_1_En_3_Chapter/504209_1_En_3_Figfc_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figfc_HTML.jpg)\n\
    \nAdditionally, a very common way to work with Lyapunov functions is based on\
    \ quadratic equations.\n\nFor example, the Lyapunov function of the damped harmonic\
    \ system can be rewritten like this:"
  raw: '![../images/504209_1_En_3_Chapter/504209_1_En_3_Figep_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figep_HTML.jpg)


    This derivative is negative semidefined and depends totally or partially on the
    states of our interest.


    For the damped harmonic oscillator system, we have


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figeq_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figeq_HTML.jpg)


    And replacing the system for which said Lyapunov function was designed:


