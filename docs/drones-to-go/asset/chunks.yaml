    # 线性简化


    在进行第二组简化之前，让我们回顾一下已经完成的简化，同时请记住，在您的数学模型中应考虑重新评估是否使用它们。


    -   小型化飞行器，这意味着惯性简化

    -   相对于其重心具有良好的平衡性，这意味着力矩和力的简化

    -   重心与几何中心对齐，这意味着径向简化，或力臂趋近于零

    -   螺旋桨良好平衡，这意味着每个螺旋桨仅提供推力和扭矩

    -   飞行器的对称性，以便对惯性矩阵施加简化，这也意味着离心力方程的简化

    -   不考虑摩擦、湍流或其他空气动力学建模效应的基础建模。这提供了一个高度简化的模型，该模型几乎可以在任何动态仿真软件中执行。


    话虽如此，让我们继续任务简化。


    平稳飞行模式在此意味着滚转角和俯仰角趋近于零，而偏航角可以取任意值以重新定向飞行器，就像汽车中的方向盘一样。


    平稳飞行模式也涉及平稳的角速度。


    这意味着：


    -   当滚转角和俯仰角趋近于零时，将遵循以下近似：


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figba_HTML.jpg](img/504209_1_En_2_Figba_HTML.jpg)


    请注意正弦近似；根据最方便的情况选择使用两者。等于零的那个是一个极限，而等于直线的那个是一个线性近似（例如，泰勒级数的第一项）。这些方法并不相互矛盾，而是互补的。而且，它们同样有用（事实上，它们可能同时出现在同一个问题中）。


    -   缓慢的角速度，当它们相乘时，会产生一个更小且趋近于零的结果。


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figbb_HTML.jpg](img/504209_1_En_2_Figbb_HTML.jpg)


    这还将以下列方式影响飞行器的动态行为。


    如果我们展开平移动力学模型，


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figbc_HTML.jpg](img/504209_1_En_2_Figbc_HTML.jpg)


    并且我们记得


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figbd_HTML.jpg](img/504209_1_En_2_Figbd_HTML.jpg)


    我们将得到


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figbe_HTML.jpg](img/504209_1_En_2_Figbe_HTML.jpg)


    应用平稳飞行条件，平移动力学以这种方式简化（注意，其中隐含着平移运动学的简化）。观察可知，此平稳飞行仅适用于滚转角和俯仰角，而偏航角可任意指令并遵循期望值。


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figbf_HTML.jpg](img/504209_1_En_2_Figbf_HTML.jpg)


    注意，这里为了方便，对小角度应用了正弦简化。如果我们使用另一种简化，我们将只得到零，就没有方程可交互了。


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figbg_HTML.jpg](img/504209_1_En_2_Figbg_HTML.jpg)


    在旋转层面，我们有以下动力学模型：


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figbh_HTML.jpg](img/504209_1_En_2_Figbh_HTML.jpg)


