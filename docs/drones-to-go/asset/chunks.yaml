  trans: "\n如果你看到  \n\n![../images/504209_1_En_3_Chapter/504209_1_En_3_Figfe_HTML.jpg](img/504209_1_En_3_Figfe_HTML.jpg)\n\
    \n直接关注点在于证明这些矩阵分别对应于正和负，或者在线性代数中被称为正定矩阵、负定矩阵或半定矩阵。利用线性代数理论，通过特征值准则可以得出第一个矩阵是正定的，而第二个矩阵是负半定的，这与原始结果吻合。这种矩阵表示在许多控制系统的文献中都可以找到，包括\
    \ Taeyoung Lee 在之前提到的文章中给出的演示。\n\n提出李雅普诺夫函数并证明其导数（通常包含系统及其控制器）是负定的，是一门称为非线性控制理论的科学中的广阔分支。每个动态系统都代表了通过李雅普诺夫函数寻找其稳定性的一个挑战；甚至每个单独的结果都可能代表一本书或一门新科学。\n\
    \n在这项研究中，能够与控制器进行代数运算的能力非常有帮助。例如，在第 4 章中，有一节专门介绍状态空间表示，其中指出一个非线性微分方程组（包括多旋翼飞行器）可以表示如下：\n\
    \n![../images/504209_1_En_3_Chapter/504209_1_En_3_Figff_HTML.jpg](img/504209_1_En_3_Figff_HTML.jpg)\n\
    \n其中 `x` 是系统的状态，`u` 是其控制信号。\n\n这样，按照李雅普诺夫方法\n\n![../images/504209_1_En_3_Chapter/504209_1_En_3_Figfg_HTML.jpg](img/504209_1_En_3_Figfg_HTML.jpg)\n\
    \n并且期望得到如下结果：\n\n![../images/504209_1_En_3_Chapter/504209_1_En_3_Figfh_HTML.jpg](img/504209_1_En_3_Figfh_HTML.jpg)\n\
    \n实现这一目标的方法是通过适当地修改控制量 `u`。\n\n例如，让我们分析一个非自由输入（存在力 `u` 而非简单的 0）的二阶系统（阻尼谐振子）的情况。\n\
    \n目标是使变量 `Y` 趋向于一个称为 `Yd` 的期望值。\n\n我们将有两个方程：真实系统方程和控制方程。\n\n所以我们有两种选择：\n\n1. \
    \ 测试一个控制器，如果工作正常，我们直接尝试证明闭环系统的稳定性。这并非完全推荐，但大多数人这样做，尤其是因为几乎所有系统都可以用 PD 或 PID 控制器工作，而人们只想回答原因。\n\
    \    \n    如前所述，我们有一个系统和已经可用的控制器：\n    \n    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figfi_HTML.jpg](img/504209_1_En_3_Figfi_HTML.jpg)\n\
    \    \n    分析闭环系统：\n    \n    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figfj_HTML.jpg](img/504209_1_En_3_Figfj_HTML.jpg)\n\
    \    \n    做出一些主导假设。以下内容对正值且大于 1 的 `Kp` 和 `Kd` 成立：\n    \n    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figfk_HTML.jpg](img/504209_1_En_3_Figfk_HTML.jpg)\n\
    \    \n    重新命名：\n    \n    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figfl_HTML.jpg](img/504209_1_En_3_Figfl_HTML.jpg)\n\
    \    \n    并同样重命名其导数，我们得到这个系统：\n    \n    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figfm_HTML.jpg](img/504209_1_En_3_Figfm_HTML.jpg)\n\
    \    \n    最后，其闭环稳定性的证明方式与之前分析过的二阶系统类似：\n    \n    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figfn_HTML.jpg](img/504209_1_En_3_Figfn_HTML.jpg)\n\
    \n2.  证明原始系统的稳定性，并在过程中设计控制器。\n    \n    例如，提出这个李雅普诺夫函数，然后是其导数：\n    \n    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figfo_HTML.jpg](img/504209_1_En_3_Figfo_HTML.jpg)\n\
    \    \n    我们将系统的动态引入到李雅普诺夫导数中：\n    \n    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figfp_HTML.jpg](img/504209_1_En_3_Figfp_HTML.jpg)\n\
    \    \n    此时，还不能说\n    \n    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figfq_HTML.jpg](img/504209_1_En_3_Figfq_HTML.jpg)\n\
    \    \n    但可以设计 `u`，例如：\n    \n    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figfr_HTML.jpg](img/504209_1_En_3_Figfr_HTML.jpg)\n\
    \    \n    那么该项\n    \n    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figfs_HTML.jpg](img/504209_1_En_3_Figfs_HTML.jpg)\n\
    \    \n    再次，我们可以做出这些假设\n    \n    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figft_HTML.jpg](img/504209_1_En_3_Figft_HTML.jpg)\n\
    \    \n    在这些考虑条件下\n    \n    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figfu_HTML.jpg](img/504209_1_En_3_Figfu_HTML.jpg)\n\
    \n请注意，正如前面提到的 Taeyoung Lee 的文章所述，有时并不严格证明李雅普诺夫函数及其导数是正定和负定的，而只是说它们的某些方程项是有界的（这意味着它们的最大值和最小值不能超过某个值），并且由于这些项是有界的，它们的影响可以被其他负定或正定的项所主导。此外，这些界限有助于找到飞行器的物理限制及其运行范围。\n\
    \n最后必须提到，在线性系统中，使用李雅普诺夫方法进行稳定性分析是可选的，因为它们有许多其他工具。但在非线性系统中，就像几何控制的情况一样，李雅普诺夫方法是最流行的选择，这不是因为它简单（事实上并不简单），而是因为它有特定的方法。该方法如图\
    \ 3-24 所示。\n\n![../images/504209_1_En_3_Chapter/504209_1_En_3_Fig24_HTML.jpg](img/504209_1_En_3_Fig24_HTML.jpg)\n\
    \n图 3-24  \n李雅普诺夫方法的常用顺序\n\n你已经了解了机器人和飞行器的模式控制器，以及李雅普诺夫理论的基础。让我们以关于期望值（记住它们是定义我们控制器的误差的一个组成部分）的一节来结束本章。\n"
- fmt: "## Definition of Desired Values: Regulation, Trajectory, or Point-to-Point\n\
    \nIn Chapter [4](#504209_1_En_4_Chapter.xhtml), we will verify most of the controllers\
    \ explained here and we will note (especially in the geometric case) that the\
    \ kind of path alters the way the control is tuned (and not only in the selection\
    \ of gains, but also in the inclusion or omission of specific terms).\n\nIn this\
    \ way, we can ask ourselves if there is a way to follow trajectories without depending\
    \ directly on the execution time, but directly on the mobility of the vehicle,\
    \ for example its speed, acceleration, jerk (first derivative of acceleration),\
    \ or even its snap (second derivative of acceleration).\n\nLet’s start by defining\
    \ some concepts related to the desired value. Other concepts can be found in the\
    \ article by Kelly in the Appendix (for example, in order to define a haptic error).\n\
    \n**Regulation**: A regulation task is when a system is placed in a constant value.\
    \ In this case, a good example is the hovering task of a multicopter, which implies\
    \ that the vehicle reaches a point in the space and once there it keeps a \"static\"\
    \ position.\n\n**Trajectory tracking**: This is when the vehicle is commanded\
    \ to follow a time-dependent reference (a circle, a cosine, etc.). The basic task\
    \ is to follow a reference in critical times, and it will be achieved as long\
    \ as the motors and the system by itself are able to move at the speed, acceleration,\
    \ etc. Here it is relevant to replicate the reference and its motion characteristics,\
    \ for example a vehicle chase.\n\n**Point-to-point tracking**: This is a special\
    \ case of the previous one, where the maximum characteristics of the drone (speed,\
    \ acceleration, etc.) are considered. The objective here is that our drone follows\
    \ a route without exceeding its own limit values, avoiding forcing the motors\
    \ and damaging the aircraft due to sudden inertial changes.\n\nIt consists of\
    \ splitting a given trajectory into specific segments and carrying out said trajectory\
    \ as a motion between points; see Figure [3-25](#504209_1_En_3_Chapter.xhtml#Fig25).\
    \ This way the designer is able to control the speed and acceleration (or more\
    \ derivatives) profiles between the target points, in order that these profiles\
    \ are under the maximum values of the vehicle. There are many ways to do it, such\
    \ as splines, Hermite, Catmull-Rom polynomial interpolation of `n` degree, interpolation\
    \ by using trigonometric, or exponential Fourier series. The main concern for\
    \ defining point-to-point values is to achieve a smooth execution for the motors.\
    \ It is not relevant to replicate the execution time of a reference but the reference\
    \ only, and it is useful, for example, in object-search tasks or the execution\
    \ of predefined movements for body rehabilitation.\n\n![../images/504209_1_En_3_Chapter/504209_1_En_3_Fig25_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Fig25_HTML.jpg)\n\
    \nFigure 3-25  \nPoint-to-point path approximation when a soft function is tracked\n\
    \nNote that the closer the points are, the point-to-point tracking is also closer\
    \ to the trajectory tracking behavior. In other words, the larger the order of\
    \ the interpolation, the vehicle will behave in a less \"robotic motion\" way,\
    \ all at the cost of damaging the vehicle's actuators. This represents a tradeoff\
    \ between the mobility performance and the safety of the motors. Remember also\
    \ that the closer the points are, the easier that oversampling errors may occur\
    \ and consequently you could damage your vehicle. Conversely, while the distance\
    \ between points is larger, undersampling tracking may occur. You will see with\
    \ the given examples that the intermediate values between the points do not necessarily\
    \ follow the original profile of the trajectory.\n\nNote also that if the path\
    \ to be followed has by itself a slow and smooth performance with respect to the\
    \ limits of the vehicle (for example, following a low-frequency cosine signal),\
    \ point-to-point tracking can be replaced by the trajectory tracking (in order\
    \ to experiment, go to the simulation section in the geometric control part and\
    \ modify the code to follow trigonometric functions from lower to higher frequencies).\n\
    \nOf course, point-to-point tracking is useful when a trajectory cannot be defined\
    \ by using standard functions or when the functions to be followed are not smooth\
    \ (for example, squares, triangles, etc.). The planning of trajectories can by\
    \ itself generate a complete book, if we contemplate trajectories with minimum\
    \ time, acceleration, or other motion profile derivatives, also trajectories with\
    \ multiple points, or point-to-point trajectories, trajectories with a single\
    \ variable or with multiple variables, translational, orientational, or combined\
    \ trajectories, trajectories based on polynomials or trigonometric functions,\
    \ and so on.\n\nLet’s continue. Suppose that we want to follow the square path\
    \ displayed in Figure [3-26](#504209_1_En_3_Chapter.xhtml#Fig26) (as you will\
    \ see, tracking figures or paths with vertices represents a challenge for any\
    \ controller).\n\n![../images/504209_1_En_3_Chapter/504209_1_En_3_Fig26_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Fig26_HTML.jpg)\n\
    \nFigure 3-26  \nPosition, velocity, and acceleration profiles of a non-smooth\
    \ function tracked by polynomials\n\nPart of this path implies that we must go\
    \ through the `ABC` points. The intuition based on the shortest distance tells\
    \ us that we can do it in a straight line (by using two first-degree polynomials).\n\
    \nThe problem is that the derivative of the straight line trajectories takes an\
    \ abrupt shape when inflection points occur (the derivative is a step function).\
    \ To avoid this, a second order polynomial could be used (but now the square trajectory\
    \ becomes an approximation, where only `ABCD` points are achieved).\n\nFollowing\
    \ the same reasoning, the second order polynomial no longer presents sudden changes\
    \ at the speed level but at the acceleration level (again, where the inflection\
    \ or transition point between the two polynomials occurs) and this also damages\
    \ the motors. Then, the solution is simply to use polynomial trajectories of third\
    \ order. A deeper demonstration, which is also based on the previous physical\
    \ reasonings and the minimization of cost functions of Euler Lagrange equations,\
    \ can be found in the MOOC, articles, and thesis of Kumar and his team, indicated\
    \ in the Appendix.\n\nNote that even with this, the derivative of the acceleration\
    \ will continue presenting abrupt changes and thus indefinitely with each level\
    \ of derivative when incorporating new polynomial degrees. However, this is not\
    \ entirely relevant because we are interested in soft velocity values for which\
    \ the accelerations are small (tending to zero) and even with these abrupt changes,\
    \ their effects will not be important.\n\nHowever, if we are interested in aggressive\
    \ motion, then we must consider higher-order polynomials as shown by Kumar (see\
    \ the Appendix) that perform point-to-point planning at the snap level (second\
    \ derivative of the acceleration).\n\nFrom this moment on, we can introduce speed\
    \ values that are compatible with those that the vehicle can by itself generate\
    \ in the following way (always considering a starting point and an ending point,\
    \ although there are multipoint algorithms).\n\nFirst, we observe that we have\
    \ a desired polynomial of order three and that we will have a polynomial of this\
    \ type for each desired value. This means that if we are interested in defining\
    \ the desired values for the variables `X`, `Y`, and `Z`, we must repeat the procedure\
    \ for each of these variables:\n\n![../images/504209_1_En_3_Chapter/504209_1_En_3_Figfv_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figfv_HTML.jpg)"
  raw: '## Definition of Desired Values: Regulation, Trajectory, or Point-to-Point


    In Chapter [4](#504209_1_En_4_Chapter.xhtml), we will verify most of the controllers
    explained here and we will note (especially in the geometric case) that the kind
    of path alters the way the control is tuned (and not only in the selection of
    gains, but also in the inclusion or omission of specific terms).


    In this way, we can ask ourselves if there is a way to follow trajectories without
    depending directly on the execution time, but directly on the mobility of the
    vehicle, for example its speed, acceleration, jerk (first derivative of acceleration),
    or even its snap (second derivative of acceleration).


    Let’s start by defining some concepts related to the desired value. Other concepts
    can be found in the article by Kelly in the Appendix (for example, in order to
    define a haptic error).


    **Regulation** : A regulation task is when a system is placed in a constant value.
    In this case, a good example is the hovering task of a multicopter, which implies
    that the vehicle reaches a point in the space and once there it keeps a “static”
    position.


    **Trajectory tracking** : This is when the vehicle is commanded to follow a time-dependent
    reference (a circle, a cosine, etc.). The basic task is to follow a reference
    in critical times, and it will be achieved as long as the motors and the system
    by itself are able to move at the speed, acceleration, etc. Here it is relevant
    to replicate the reference and its motion characteristics, for example a vehicle
    chase.


    **Point-to-point tracking** : This is a special case of the previous one, where
    the maximum characteristics of the drone (speed, acceleration, etc.) are considered.
    The objective here is that our drone follows a route without exceeding its own
    limit values, avoiding forcing the motors and damaging the aircraft due to sudden
    inertial changes.


    It consists of splitting a given trajectory into specific segments and carrying
    out said trajectory as a motion between points; see Figure [3-25](#504209_1_En_3_Chapter.xhtml#Fig25).
    This way the designer is able to control the speed and acceleration (or more derivatives)
    profiles between the target points, in order that these profiles are under the
    maximum values of the vehicle. There are many ways to do it, such as splines,
    Hermite, Catmull-Rom polynomial interpolation of n degree, interpolation by using
    trigonometric, or exponential Fourier series. The main concern for defining point-to-point
    values ​​is to achieve a smooth execution for the motors. It is not relevant to
    replicate the execution time of a reference but the reference only, and it is
    useful, for example, in object-search tasks or the execution of predefined movements
    for body rehabilitation.


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Fig25_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Fig25_HTML.jpg)


    Figure 3-25


    Point-to-point path approximation when a soft function is tracked


    Note that the closer the points are, the point-to-point tracking is also closer
    to the trajectory tracking behavior. In other words, the larger the order of the
    interpolation, the vehicle will behave in a less “robotic motion” way, all at
    the cost of damaging the vehicle’s actuators. This represents a tradeoff between
    the mobility performance and the safety of the motors. Remember also that the
    closer the points are, the easier that oversampling errors may occur and consequently
    you could damage your vehicle. Conversely, while the distance between points is
    larger, undersampling tracking may occur. You will see with the given examples
    that the intermediate values ​​between the points do not necessarily follow the
    original profile of the trajectory.


    Note also that if the path to be followed has by itself a slow and smooth performance
    with respect to the limits of the vehicle (for example, following a low-frequency
    cosine signal), point-to-point tracking can be replaced by the trajectory tracking
    (in order to experiment, go to the simulation section in the geometric control
    part and modify the code to follow trigonometric functions from lower to higher
    frequencies).


    Of course, point-to-point tracking is useful when a trajectory cannot be defined
    by using standard functions or when the functions to be followed are not smooth
    (for example, squares, triangles, etc.). The planning of trajectories can by itself
    generate a complete book, if we contemplate trajectories with minimum time, acceleration,
    or other motion profile derivatives, also trajectories with multiple points, or
    point-to-point trajectories, trajectories with a single variable or with multiple
    variables, translational, orientational, or combined trajectories, trajectories
    based on polynomials or trigonometric functions, and so on.


    Let’s continue. Suppose that we want to follow the square path displayed in Figure
    [3-26](#504209_1_En_3_Chapter.xhtml#Fig26) (as you will see, tracking figures
    or paths with vertices represents a challenge for any controller).


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Fig26_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Fig26_HTML.jpg)


    Figure 3-26


    Position, velocity, and acceleration profiles of a non-smooth function tracked
    by polynomials


    Part of this path implies that we must go through the ABC points. The intuition
    based on the shortest distance tells us that we can do it in a straight line (by
    using two first-degree polynomials).


    The problem is that the derivative of the straight line trajectories takes an
    abrupt shape when inflection points occur (the derivative is a step function).
    To avoid this, a second order polynomial could be used (but now the square trajectory
    becomes an approximation, where only ABCD points are achieved).


    Following the same reasoning, the second order polynomial no longer presents sudden
    changes at the speed level but at the acceleration level (again, where the inflection
    or transition point between the two polynomials occurs) and this also damages
    the motors. Then, the solution is simply to use polynomial trajectories of third
    order. A deeper demonstration, which is also based on the previous physical reasonings
    and the minimization of cost functions of Euler Lagrange equations, can be found
    in the MOOC, articles, and thesis of Kumar and his team, indicated in the Appendix.


    Note that even with this, the derivative of the acceleration will continue presenting
    abrupt changes and thus indefinitely with each level of derivative when incorporating
    new polynomial degrees. However, this is not entirely relevant because we are
    interested in soft velocity values for which the accelerations are small (tending
    to zero) and even with these abrupt changes, their effects will not be important.


    However, if we are interested in aggressive motion, then we must consider higher-order
    polynomials as shown by Kumar (see the Appendix) that perform point-to-point planning
    at the snap level (second derivative of the acceleration).


    From this moment on, we can introduce speed values that are compatible with those
    that the vehicle can by itself generate in the following way (always considering
    a starting point and an ending point, although there are multipoint algorithms).


    First , we observe that we have a desired polynomial of order three and that we
    will have a polynomial of this type for each desired value. This means that if
    we are interested in defining the desired values for the variables X, Y, and Z,
    we must repeat the procedure for each of these variables:


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figfv_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figfv_HTML.jpg)'
  trans: "\n## 期望值的定义：调节、轨迹跟踪或点对点跟踪\n\n在第四章中，我们将验证此处解释的大多数控制器，并会注意到（尤其是在几何控制情况下）路径类型会改变控制调节的方式（这不仅体现在增益的选择上，也体现在特定项的包含与否上）。\n\
    \n这样，我们就可以思考：是否存在一种不直接依赖执行时间，而直接依赖车辆机动性（例如其速度、加速度、加加速度（加速度的一阶导数），甚至冲击度（加速度的二阶导数））来跟踪轨迹的方法。\n\
    \n让我们从定义一些与期望值相关的概念开始。其他概念可以在附录中 Kelly 的文章中找到（例如，为了定义触觉误差）。\n\n**调节**：调节任务是指系统被置于一个恒定值。在这种情况下，一个很好的例子是多旋翼飞行器的悬停任务，这意味着飞行器到达空间中的某个点，并在那里保持“静态”位置。\n\
    \n**轨迹跟踪**：这是指飞行器被指令跟随一个时间相关的参考信号（如圆形、余弦等）。基本任务是在关键时间点跟随参考信号，只要电机和系统本身能够以所需的速度、加速度等运动，就能实现。这里关键是复现参考信号及其运动特性，例如飞行器追逐。\n\
    \n**点对点跟踪**：这是前一种情况的特例，其中考虑了无人机最大特性（速度、加速度等）。其目标是让我们的无人机在不超出其自身极限值的情况下沿路线飞行，避免因惯性突变而强制驱动电机并损坏飞行器。\n\
    \n它涉及将给定的轨迹分割成特定的段，并将该轨迹作为点与点之间的运动来执行；见图 3-25。这样设计者就能够控制目标点之间的速度和加速度（或更高阶导数）曲线，以确保这些曲线低于飞行器的最大值。实现方法有很多，例如样条插值、埃尔米特插值、`n`\
    \ 次 Catmull-Rom 多项式插值，或使用三角级数、指数傅里叶级数进行插值。定义点对点值的主要考虑是为了实现电机平稳运行。复现参考信号的执行时间并不重要，重要的是复现参考信号本身；这在例如物体搜索任务或为身体康复执行预定运动时很有用。\n\
    \n![../images/504209_1_En_3_Chapter/504209_1_En_3_Fig25_HTML.jpg](img/504209_1_En_3_Fig25_HTML.jpg)\n\
    \n图 3-25  \n当跟踪平滑函数时的点对点路径近似\n\n请注意，点与点越接近，点对点跟踪就越接近轨迹跟踪行为。换句话说，插值阶数越高，飞行器的行为就越不像“机器人运动”，但这会以损伤飞行器执行器为代价。这代表了机动性能与电机安全性之间的权衡。还需记住，点与点越接近，越容易发生过采样误差，从而可能损坏飞行器。相反，当点与点之间的距离较大时，可能会发生欠采样跟踪。您将从给出的示例中看到，点与点之间的中间值不一定遵循轨迹的原始轮廓。\n\
    \n还需注意，如果待跟踪路径本身相对于飞行器的极限是缓慢且平滑的（例如，跟踪一个低频余弦信号），那么点对点跟踪可以被轨迹跟踪所替代（为了实验，请前往几何控制部分的仿真环节，修改代码以跟踪从低频到高频的三角函数）。\n\
    \n当然，当无法使用标准函数定义轨迹，或者待跟踪的函数不光滑（例如方形、三角形等）时，点对点跟踪就非常有用。如果我们考虑具有最小时间、加速度或其他运动曲线导数的轨迹，以及多点轨迹或点对点轨迹、单变量或多变量轨迹、平移、旋转或组合轨迹、基于多项式或三角函数的轨迹等等，轨迹规划本身就能写成一本完整的书。\n\
    \n我们继续。假设我们想要跟踪图 3-26 中显示的方形路径（正如你将看到的，跟踪带有顶点的图形或路径对任何控制器来说都是一个挑战）。\n\n![../images/504209_1_En_3_Chapter/504209_1_En_3_Fig26_HTML.jpg](img/504209_1_En_3_Fig26_HTML.jpg)\n\
    \n图 3-26  \n通过多项式跟踪非光滑函数的位置、速度和加速度曲线\n\n这条路径的一部分意味着我们必须经过 `ABC` 点。基于最短距离的直觉告诉我们可以沿直线行进（通过使用两个一次多项式）。\n\
    \n问题在于，当拐点出现时，直线轨迹的导数会呈现突变形状（导数是一个阶跃函数）。为了避免这种情况，可以使用一个二次多项式（但现在方形轨迹变成了一个近似，只有\
    \ `ABCD` 点被精确到达）。\n\n按照同样的推理，二次多项式在速度层面上不再有突变，但在加速度层面上却会出现突变（再次发生在两个多项式之间的拐点或过渡点），这同样会损坏电机。那么，解决方案就是简单地使用三次多项式轨迹。在附录中提到的\
    \ Kumar 及其团队的 MOOC、文章和论文中，可以找到基于上述物理推理和欧拉-拉格朗日方程代价函数最小化的更深入论证。\n\n请注意，即使如此，加速度的导数仍会继续呈现突变，并且随着每个导数层面引入新的多项式阶数，这种情况会无限延续下去。然而，这并不完全重要，因为我们感兴趣的是平滑的速度值，对应的加速度很小（趋于零），即使有这些突变，其影响也不重要。\n\
    \n但是，如果我们对剧烈运动感兴趣，那么我们必须考虑 Kumar（见附录）所示的高阶多项式，这些多项式在冲击度层面（加速度的二阶导数）进行点对点规划。\n\n\
    从现在开始，我们可以引入与车辆自身能产生的速度相兼容的速度值，具体方法如下（始终考虑一个起点和一个终点，尽管也有多点的算法）。\n\n首先，我们注意到我们有一个所需的三次多项式，并且每个期望值都有一个这种类型的多项式。这意味着如果我们有兴趣为变量\
    \ `X`、`Y` 和 `Z` 定义期望值，我们必须为每个变量重复该过程：\n\n![../images/504209_1_En_3_Chapter/504209_1_En_3_Figfv_HTML.jpg](img/504209_1_En_3_Figfv_HTML.jpg)\n"
