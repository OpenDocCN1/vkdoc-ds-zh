    The direct concern is to demonstrate that these matrices are respectively the
    equivalent of positive and negative or what in linear algebra is known as a positive
    definite matrix, a negative definite matrix, or semidefinite matrices. By using
    the linear algebra theory, it is obtained through the eigenvalues criterion that
    the first matrix is positive definite while the second is negative semidefinite,
    which matches with the original results. This matrix representation is found in
    many texts on control systems, including Taeyoung Lee’s demonstrations in the
    previously indicated articles.


    Proposing Lyapunov functions and also demonstrating that their derivatives (where
    the systems and their controllers usually appear) are defined negative is an extensive
    branch of a science called nonlinear control theory. Each dynamic system represents
    a challenge in finding its stability through Lyapunov functions; even each individual
    result represents a book or a new science.


    What helps a lot in this research is the capacity to do algebraic operations with
    the controller. As an example, in Chapter [4](#504209_1_En_4_Chapter.xhtml), there
    is a section dedicated to the state-space representation, where it is indicated
    that a non-linear system of differential equations (including a multicopter) can
    be represented as follows:


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figff_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figff_HTML.jpg)


    where x are the states of the system and u their control signals.


    In this way, following the Lyapunov method


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figfg_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figfg_HTML.jpg)


    and as the following is expected:


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figfh_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figfh_HTML.jpg)


    The way to achieve this is by modifying the control u as appropriate.


    For example, let’s analyze the case of the second order system (damped harmonic
    oscillator) with non-free input (with the presence of a force u instead of a simple
    0).


    The goal is that the variable Y tends to a desired value known as Yd.


    We will have two equations: the real system equation and the control equation.


    So here we have two options:


    1\. A controller is tested and if it works correctly, we directly try to demonstrate
    the stability of the closed loop system. This is not entirely recommended, but
    most people do it this way, especially because almost everything works with a
    PD or PID and people only want to answer the reasons.


    As said, we have a system and a control that is already useful:


