    function outp=geoquad(inpt)

    % 系统输入：状态

    % x x 导数 y y 导数 z z 导数

    x1=inpt(1);

    x2=inpt(2);

    x3=inpt(3);

    x4=inpt(4);

    x5=inpt(5);

    x6=inpt(6);

    % w 和 R（角速度与姿态）

    w1=inpt(7);

    w2=inpt(8);

    w3=inpt(9);

    r11=inpt(10);

    r12=inpt(11);

    r13=inpt(12);

    r21=inpt(13);

    r22=inpt(14);

    r23=inpt(15);

    r31=inpt(16);

    r32=inpt(17);

    r33=inpt(18);

    % 还需要 R 期望的导数

    r11dp=inpt(19);

    r12dp=inpt(20);

    r13dp=inpt(21);

    r21dp=inpt(22);

    r22dp=inpt(23);

    r23dp=inpt(24);

    r31dp=inpt(25);

    r32dp=inpt(26);

    r33dp=inpt(27);

    % 时间

    t=inpt(28);

    % 常量参数：质量、惯性值、重力

    m=1;

    g=9.8;

    Jx=0.2;

    Jy=0.2;

    Jz=0.2;

    % 根据分量构建期望旋转矩阵

    Rdp=[r11dp,r12dp,r13dp;r21dp,r22dp,r23dp;r31dp,r32dp,r33dp];

    % 同时构建旋转矩阵和反对称的角速度矩阵

    R=[r11,r12,r13;r21,r22,r23;r31,r32,r33];

    S=[0,-w3,w2;w3,0,-w1;-w2,w1,0];

    % 控制增益

    kpx=0.3;

    % 有时由于噪声或控制交互，

    % 微分增益可能大于比例增益

    % 尝试相反的情况，观察结果行为

    kdx=0.5;

    kpy=0.3;

    kdy=0.5;

    kpz=0.7;

    kdz=0.5;

    KR=50;

    Kw=30;

    % 笛卡尔平动期望值

    % 这是一个螺旋轨迹

    x1d=0.4*t;

    x2d=0.4;

    x3d=0.4*sin(t/2);

    x4d=0.2*cos(t/2);

    x5d=0.6*cos(t/2);

    x6d=-0.3*sin(t/2);

    % 平面 PD 控制

    PDx=(kpx*(x1d-x1))+(kdx*(x2d-x2));

    PDy=(kpy*(x3d-x3))+(kdy*(x4d-x4));

    PDz=(kpz*(x5d-x5))+(kdz*(x6d-x6));

    % 主推力

    Fbz=dot(([PDx;PDy;PDz]+[0;0;m*g]),(R*[0;0;1]));

    % 尝试提高这些运动轮廓的角频率，

    % 从而增加速度和加速度以扰乱控制回路。

    % 在这种情况下，添加上述的完整控制器或改进版本，

    % 因为这里我们只是模拟一个简单的 PD 控制器。

    % Rd 定义：注意通过 Bdes 矢量间接调节偏航角（圆形运动）

    psid=t/3;

    Bdes=[cos(psid);sin(psid);0];

    b3d=([PDx;PDy;PDz]+[0;0;m*g])/norm([PDx;PDy;PDz]+[0;0;m*g]);

    b2d=cross(b3d,Bdes)/norm(cross(b3d,Bdes));

    b1d=cross(b2d,b3d);

    Rd=[b1d,b2d,b3d];

    % 这里将期望旋转矩阵分解为其分量，

    % 以便作为向量输出该模型，我们需要按此顺序发送它们以计算其导数

    r11d=Rd(1,1);

    r12d=Rd(1,2);

    r13d=Rd(1,3);

    r21d=Rd(2,1);

    r22d=Rd(2,2);

    r23d=Rd(2,3);

    r31d=Rd(3,1);

    r32d=Rd(3,2);

    r33d=Rd(3,3);

    % 定义旋转和角速度误差

    Rmul=transpose(Rd)*Rdp;

    eRM=(transpose(Rd)*R)-(transpose(R)*Rd);

    w=[w1;w2;w3];

    wd=[Rmul(3,2);Rmul(1,3);Rmul(2,1)];

    ew=w-(transpose(R)*Rd*wd);

    eR=[eRM(3,2);eRM(1,3);eRM(2,1)]/2;

    % 简单的旋转 PD 控制

    PDrw=-KR*eR-Kw*ew;

    % 这里将 PDrw 分解，以便注入三个机体力矩中

    Tbx=PDrw(1);

    Tby=PDrw(2);

    Tbz=PDrw(3);

    % 飞行器平动动力学模型

    % 速度

    xp=[x2;x4;x6];

    % 加速度

    xpp=(R*[0;0;Fbz])-[0;0;m*g];

    % 这样做是为了发送状态变量进行积分

    % xdot xdoubledot ydot ydoubledot zdot zdoubledot

    x1p=xp(1);

    x2p=xpp(1);

    x3p=xp(2);

    x4p=xpp(2);

    x5p=xp(3);

    x6p=xpp(3);

    % 飞行器转动动力学

    w1p=(Tbx-(w2*w3*Jz)+(w2*w3*Jy))/Jx;

    w2p=(Tby-(w1*w3*Jx)+(w1*w3*Jz))/Jy;

    w3p=(Tbz-(w1*w2*Jy)+(w1*w2*Jx))/Jz;

    % 旋转辅助运动学

    Rp=R*(S);

    % 我们将 R 导数分解为其分量，以便发送到输出进行积分并得到 R 元素。

    % 注意：我们需要在 Simulink®求解器中提供 R 的初始值

    r11p=Rp(1,1);

    r12p=Rp(1,2);

    r13p=Rp(1,3);

    r21p=Rp(2,1);

    r22p=Rp(2,2);

    r23p=Rp(2,3);

    r31p=Rp(3,1);

    r32p=Rp(3,2);

    r33p=Rp(3,3);

    % 输出：

    % 平动系统状态，元素 1-6

    % 角速度，元素 7-9

    % 旋转矩阵的导数，元素 10-18

    % 期望旋转矩阵（用于获取其导数），元素 19-27

    % 期望平动值（仅用于绘图），元素 28-30

    outp=[x1p;x2p;x3p;x4p;x5p;x6p;w1p;w2p;w3p;r11p;r12p;r13p;r21p;r22p;r23p;r31p;r32p;r33p;r11d;r12d;r13d;r21d;r22d;r23d;r31d;r32d;r33d;x1d;x3d;x5d];

    end

    ```


