    Javier、Manuel 和 Belem 对我工作的贡献。我谨向我的导师和榜样——教授 Moises Bonilla、Rogelio Lozano、Hebertt
    Sira 和 Romeo Ortega——表示深切的感激。对我来说，他们是我们挚爱职业中努力和奉献的典范。最后但同样重要的是，我要感谢我挚爱的妻子 Erika、我的女儿
    Daira 和 Zaida，以及我的母亲、兄弟、表亲和叔伯，他们是我爱的主要源泉，也是我每天努力成为更好的人的动力。最后，我感谢上帝让我能够从事并依靠我所热爱的事业生活。


    **莱昂纳多·丰塞卡-鲁伊斯** 我将本书献给 Aidee、Matilde Amelie 和 Leonardo，他们是我生命中的光。我还感谢国家理工学院；我的学生们，他们让我保持与时俱进；Julio
    Alberto Mendoza 博士和 Mauricio Méndez 硕士，他们从成为我的学生起就一直在我身边，并且总是全力以赴，激励我也这样做。我衷心感谢
    IPN 的工程与高级技术跨学科专业单位 (UPIITA)，它让我有机会在 14 年多的时间里教授新一代机电一体化工程师。


    ## 关于作者 关于技术审稿人


    # 1. 无人机设计概念


    在本章中，您将找到关于无人机最相关的信息，包括其历史和社会背景。本章将涵盖国际标准、一些词源学以及您在操作这些飞行器时应牢记的某些安全注意事项。我们将描述通用组件及其选择和连接。因此，您将学习到设计无人机及其他飞行器所需的技术细节、国际标准和必要条件。请记住，本书是一本速成课程，因此本章仅为您提供快速掌握内容的方法。如果您想扩展这些知识，请参阅指导参考附录。

