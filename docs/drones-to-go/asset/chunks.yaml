- fmt: "#### Continuous and Discrete Controllers\n\nHere comes a second definition\
    \ of continuity and it is related to how small the sampling time is. This depends\
    \ on two factors: the first is the computer and the second the actuators and sensors.\
    \  \nIn the case of computers, today almost all of them are fast enough to consider\
    \ their operation as continuous models or systems based on differential equations.\
    \ However, by varying the technology of the actuators from electric brushless\
    \ motors to internal combustion motors, you will notice that the latter kind of\
    \ engines have slower response times with respect to the electric ones (they have\
    \ a lot of components, friction, and operating cycles) and they require difference\
    \ equations for their analysis (their modeling with differential equations is\
    \ no longer possible).\n\n#### Electrical and Mechanical Control\n\nWe abuse some\
    \ of the technology because the electrical and electronic components are guaranteed\
    \ by the manufacturer to operate properly so, for example, we do not worry about\
    \ the operation of the ESCs. Also, we rely on the fact that electrical devices\
    \ are faster with respect to the mechanical components. For these reasons, our\
    \ design ignores electrical and electronic components and we just consider the\
    \ drone as a system with purely mechanical modeling and control. However, modern\
    \ designs that introduce a closed loop control in the speed of the motors can\
    \ be seen as an intermediate or electromechanical control, where the mechanical\
    \ speed of the motors depends on electrical variables such as the electrical phases\
    \ of the ESCs. See the Appendix for references on closed loop motor control.\n\
    \nYou have learned about the drone tasks and most of the controllers that this\
    \ vehicle/robot can use. Let’s continue with the basic signal processing that\
    \ a drone requires and an example of application.\n\n## Drone Signal Processing\n\
    \nMaybe you are tempted to implement the previous controllers. However, some steps\
    \ are required before this implementation. The most common are the following:\n\
    \n* Signal filtering, which is used in the sensors\n* Signal mapping, which is\
    \ used in the sensors, the remote control sticks, during data transmission, etc.\n\
    * Signal casting or data conversion, which is used to inject the control value\
    \ into the motors or during serial data transmission\n* Signal saturation, which\
    \ is used to limit the values to send to the motors, or to limit the values that\
    \ are read from a remote control stick\n* Signal normalization, which is used\
    \ to impose an operating range in the sensors\n\n### Signal Filtering\n\nAs you\
    \ can see in the previous chapters, the main component of the closed loop controllers\
    \ is the error, which also depends on the measured variables, and this is achieved\
    \ with the sensors. However, these sensors usually have electrical noise due to\
    \ their own behavior or because of their interaction with the environment.  \n\
    Therefore, a filtering stage is required in order to reduce or suppress the electrical\
    \ noise. As a computational or electronic processing is implied, noise suppression\
    \ is an agreement between smoothing the noise signal and delaying the smoothed\
    \ signal. There are several ways to achieve this. Some examples are the following:\n\
    \n* **Passive**: Here, additional devices are used, which by their own nature\
    \ absorbs some of the environmental noise. Examples are dissipative sponges or\
    \ fluids for mechanical motion, lenses that absorb a frequency of light, or passive\
    \ electronic devices that can be used as filters.\n* **Active by electronic filtering**:\
    \ Low-pass, high-pass, band-pass, and band-reject circuits are well known examples.\n\
    * **Active by mathematical filtering**: The signal is sent to a mathematical filter.\
    \ Among the best known filters are the Kalman Filter and the Luenbenger observer.\n\
    * **Active by space transformation**: The signal is converted into a different\
    \ space in order to perform a simple filtering in the new space, such as filtering\
    \ at a frequency level instead of at a time-based level. This method can also\
    \ be considered as a mathematical filter, but it has its own line of research.\
    \ Examples are Fourier and Wavelets transformations.\n* **Active by intelligent\
    \ filtering**: This is done by using any algorithm that employs an artificial\
    \ intelligence.\n\nThe trade-off between the noise reduction and the signal delay\
    \ can be seen in Figure [5-1](#504209_1_En_5_Chapter.xhtml#Fig1) (the code of\
    \ a generic low pass filter was used). In Listing [5-1](#504209_1_En_5_Chapter.xhtml#PC1),\
    \ you can see a high-level generic code for using this type of filters (in this\
    \ case, MATLAB).\n\n![../images/504209_1_En_5_Chapter/504209_1_En_5_Fig1_HTML.jpg](images/504209_1_En_5_Chapter/504209_1_En_5_Fig1_HTML.jpg)\n\
    \n**Figure 5-1** Noisy signal vs. filtered one\n\n```\nfilteredSignal=lowpassFilter(noisySignal)\n\
    Listing 5-1\nGeneric Code for Filtering a Signal as Available in Many Programs\
    \ (Syntax May Change)\n```\n\n### Saturation\n\nIn this case, it is necessary\
    \ to impose limit values on the controllers, in order that the maximum and minimum\
    \ values to be injected do not exceed the motor limits. Another application is\
    \ to limit the values that a user can reach in the stick of the remote control.\
    \  \nThis saturation can be done abruptly (for example, by using a sign function\
    \ which is equivalent to the action of turning on and off) or continuously (by\
    \ using a function called saturation). Even a continuous function can be smooth\
    \ or sharp (you could use a lot of functions among a family of saturators called\
    \ sigmoidal functions).  \nTypically, the non-restricted part of the saturator\
    \ copies the original signal as a standard linear function, as illustrated in\
    \ the code of Listing [5-2](#504209_1_En_5_Chapter.xhtml#PC2). However, in order\
    \ to counteract an undesired performance (for example, the abrupt behavior of\
    \ a remote control stick), sometimes other types of sigmoids are used.\n\nFigure\
    \ [5-2](#504209_1_En_5_Chapter.xhtml#Fig2) illustrates two things. The upper part\
    \ is a family of saturators, in this case the sign function, the saturation function,\
    \ and the hyperbolic tangent function. Obviously the designer must modify them\
    \ so that they reach minimum and maximum values according to their applications\
    \ and not only -1 and 1. The lower part is the application of the saturation function\
    \ with a given signal, in this case the minimum and maximum allowed values go\
    \ from 0 to 7.\n\n![../images/504209_1_En_5_Chapter/504209_1_En_5_Fig2_HTML.jpg](images/504209_1_En_5_Chapter/504209_1_En_5_Fig2_HTML.jpg)\n\
    \n**Figure 5-2** Different kinds of saturators and their application with a signal\n\
    \nThe code used in Figure [5-2](#504209_1_En_5_Chapter.xhtml#Fig2) is really simple\
    \ and is displayed in Listing [5-2](#504209_1_En_5_Chapter.xhtml#PC2).\n\n```\n\
    Mini=0\nMaxi=7\nif(signal=Maxi)\nsatsignal=Maxi;\nelse\nsatsignal=signal;\nend\n\
    Listing 5-2\nGeneric Code for a Saturation Function (the Linear One)\n```"
  raw: '#### Continuous and Discrete Controllers


    Here comes a second definition of continuity and it is related to how small the
    sampling time is. This depends on two factors: the first is the computer and the
    second the actuators and sensors.


    In the case of computers, today almost all of them are fast enough to consider
    their operation as continuous models or systems based on differential equations.
    However, by varying the technology of the actuators from electric brushless motors
    to internal combustion motors, you will notice that the latter kind of engines
    have slower response times with respect to the electric ones (they have a lot
    of components, friction, and operating cycles) and they require difference equations
    for their analysis (their modeling with differential equations is no longer possible).


    #### Electrical and Mechanical Control


    We abuse some of the technology because the electrical and electronic components
    are guaranteed by the manufacturer to operate properly so, for example, we do
    not worry about the operation of the ESCs. Also, we rely on the fact that electrical
    devices are faster with respect to the mechanical components. For these reasons,
    our design ignores electrical and electronic components and we just consider the
    drone as a system with purely mechanical modeling and control. However, modern
    designs that introduce a closed loop control in the speed of the motors can be
    seen as an intermediate or electromechanical control, where the mechanical speed
    of the motors depends on electrical variables such as the electrical phases of
    the ESCs. See the Appendix for references on closed loop motor control.


    You have learned about the drone tasks and most of the controllers that this vehicle/robot
    can use. Let’s continue with the basic signal processing that a drone requires
    and an example of application.


    ## Drone Signal Processing


    Maybe you are tempted to implement the previous controllers. However, some steps
    are required before this implementation. The most common are the following:


    *   Signal filtering, which is used in the sensors


    *   Signal mapping, which is used in the sensors, the remote control sticks, during
    data transmission, etc.


    *   Signal casting or data conversion, which is used to inject the control value
    into the motors or during serial data transmission


    *   Signal saturation, which is used to limit the values to send to the motors,
    or to limit the values that are read from a remote control stick


    *   Signal normalization, which is used to impose an operating range in the sensors


    ### Signal Filtering


    As you can see in the previous chapters, the main component of the closed loop
    controllers is the error, which also depends on the measured variables, and this
    is achieved with the sensors. However, these sensors usually have electrical noise
    due to their own behavior or because of their interaction with the environment.


    Therefore, a filtering stage is required in order to reduce or suppress the electrical
    noise. As a computational or electronic processing is implied, noise suppression
    is an agreement between smoothing the noise signal and delaying the smoothed signal.
    There are several ways to achieve this. Some examples are the following :


    *   **Passive**: Here, additional devices are used, which by their own nature
    absorbs some of the environmental noise. Examples are dissipative sponges or fluids
    for mechanical motion, lenses that absorb a frequency of light, or passive electronic
    devices that can be used as filters.


    *   **Active by electronic filtering**: Low-pass, high-pass, band-pass, and band-reject
    circuits are well known examples.


    *   **Active by mathematical filtering**: The signal is sent to a mathematical
    filter. Among the best known filters are the Kalman Filter and the Luenbenger
    observer.


    *   **Active by space transformation**: The signal is converted into a different
    space in order to perform a simple filtering in the new space, such as filtering
    at a frequency level instead of at a time-based level. This method can also be
    considered as a mathematical filter, but it has its own line of research. Examples
    are Fourier and Wavelets transformations.


    *   **Active by intelligent filtering**: This is done by using any algorithm that
    employs an artificial intelligence.


    The trade-off between the noise reduction and the signal delay can be seen in
    Figure [5-1](#504209_1_En_5_Chapter.xhtml#Fig1) (the code of a generic low pass
    filter was used). In Listing [5-1](#504209_1_En_5_Chapter.xhtml#PC1), you can
    see a high-level generic code for using this type of filters (in this case, MATLAB).


    ![../images/504209_1_En_5_Chapter/504209_1_En_5_Fig1_HTML.jpg](images/504209_1_En_5_Chapter/504209_1_En_5_Fig1_HTML.jpg)


    Figure 5-1


    Noisy signal vs. filtered one


    ```

    filteredSignal=lowpassFilter(noisySignal)

    Listing 5-1

    Generic Code for Filtering a Signal as Available in Many Programs (Syntax May
    Change)

    ```


    ### Saturation


    In this case, it is necessary to impose limit values ​​on the controllers, in
    order that the maximum and minimum values to be injected do not exceed the motor
    limits. Another application is to limit the values ​​that a user can reach in
    the stick of the remote control.


    This saturation can be done abruptly (for example, by using a sign function which
    is equivalent to the action of turning on and off) or continuously (by using a
    function called saturation). Even a continuous function can be smooth or sharp
    (you could use a lot of functions among a family of saturators called sigmoidal
    functions).


    Typically, the non-restricted part of the saturator copies the original signal
    as a standard linear function, as illustrated in the code of Listing [5-2](#504209_1_En_5_Chapter.xhtml#PC2).
    However, in order to counteract an undesired performance (for example, the abrupt
    behavior of a remote control stick), sometimes other types of sigmoids are used.


    Figure [5-2](#504209_1_En_5_Chapter.xhtml#Fig2) illustrates two things. The upper
    part is a family of saturators, in this case the sign function, the saturation
    function, and the hyperbolic tangent function. Obviously the designer must modify
    them so that they reach minimum and maximum values ​​according to their applications
    and not only -1 and 1\. The lower part is the application of the saturation function
    with a given signal, in this case the minimum and maximum allowed values ​​go
    from 0 to 7.


    ![../images/504209_1_En_5_Chapter/504209_1_En_5_Fig2_HTML.jpg](images/504209_1_En_5_Chapter/504209_1_En_5_Fig2_HTML.jpg)


    Figure 5-2


    Different kinds of saturators and their application with a signal


    The code used in Figure [5-2](#504209_1_En_5_Chapter.xhtml#Fig2) is really simple
    and is displayed in Listing [5-2](#504209_1_En_5_Chapter.xhtml#PC2).


    ```

    Mini=0

    Maxi=7

    if(signal=Maxi)

    satsignal=Maxi;

    else

    satsignal=signal;

    end

    Listing 5-2

    Generic Code for a Saturation Function (the Linear One)

    ```'
  trans: "\n#### 连续控制器与离散控制器\n\n这里给出了连续性的第二个定义，它与采样时间的大小有关。这取决于两个因素：一是计算机，二是执行器和传感器。\
    \  \n对于计算机而言，如今几乎所有计算机的速度都足够快，可以将其视为基于微分方程的连续模型或系统。然而，当执行器的技术从无刷电机变为内燃机时，你会注意到后者的响应时间相对于前者更慢（它们包含大量部件、摩擦和工作循环），因此需要采用差分方程进行分析（不再能用微分方程对其建模）。\n\
    \n#### 电气控制与机械控制\n\n我们有时会依赖某些技术的特性，因为电气和电子元件的制造商保证其正常运行，例如，我们无需担心电调（ESC）的工作情况。此外，我们信赖电气设备比机械部件速度更快这一事实。出于这些原因，我们的设计忽略了电气和电子元件，仅仅将无人机视为一个纯机械建模和控制的系统。然而，在电机转速中引入闭环控制的现代设计，可以被视为一种中间或机电控制，其中电机的机械转速取决于电气变量，例如电调（ESC）的电气相位。关于闭环电机控制的参考资料，请参见附录。\n\
    \n你已经了解了无人机的任务以及该飞行器/机器人可以使用的绝大多数控制器。接下来，让我们继续学习无人机所需的基本信号处理及应用示例。\n\n## 无人机信号处理\n\
    \n也许你很想实现前面的控制器。但在实现之前，需要完成一些步骤。最常见的有以下几个：\n\n*   信号滤波，用于传感器\n*   信号映射，用于传感器、遥控器摇杆、数据传输等\n\
    *   信号类型转换或数据转换，用于将控制值注入电机或进行串行数据传输\n*   信号限幅，用于限制发送给电机的值，或限制从遥控器摇杆读取的值\n*   信号归一化，用于为传感器设定一个工作范围\n\
    \n### 信号滤波\n\n正如你在前面几章中所见，闭环控制器的主要组成部分是误差，该误差也依赖于通过传感器测量的变量。然而，这些传感器通常会因为其自身行为或与环境的相互作用而产生电噪声。\
    \  \n因此，需要一个滤波环节来减少或抑制电噪声。由于涉及计算或电子处理，噪声抑制是在平滑噪声信号和延迟平滑信号之间进行权衡。有多种方法可以实现这一点。以下是一些示例：\n\
    \n*   **被动滤波**：使用附加设备，这些设备通过其固有特性吸收部分环境噪声。例如，用于机械运动的耗散海绵或流体、吸收特定频率光线的透镜，或可用作滤波器的无源电子器件。\n\
    *   **主动电子滤波**：低通、高通、带通和带阻电路是众所周知的例子。\n*   **主动数学滤波**：将信号送入数学滤波器。最著名的滤波器包括卡尔曼滤波器和龙伯格观测器。\n\
    *   **主动空间变换滤波**：将信号转换到另一个空间，以便在新空间中进行简便滤波，例如在频率层面而非时间层面进行滤波。这种方法也可以被视为一种数学滤波器，但它拥有独立的研究方向。例如傅里叶变换和小波变换。\n\
    *   **主动智能滤波**：通过使用任何采用人工智能的算法来实现。\n\n噪声降低与信号延迟之间的权衡如图 5-1 所示（使用了通用低通滤波器的代码）。在代码清单\
    \ 5-1 中，你可以看到使用此类滤波器（本例中使用 MATLAB）的高级通用代码。\n\n![../images/504209_1_En_5_Chapter/504209_1_En_5_Fig1_HTML.jpg](img/504209_1_En_5_Fig1_HTML.jpg)\n\
    \n**图 5-1** 含噪信号与滤波后的信号对比\n\n```\nfilteredSignal=lowpassFilter(noisySignal)\n\
    代码清单 5-1\n许多程序中可用的信号滤波通用代码（语法可能有所不同）\n```\n\n### 信号限幅\n\n在这种情况下，有必要对控制器施加限制值，以确保输入电机的最大值和最小值不超过电机的限值。另一个应用是限制用户在遥控器摇杆上所能达到的值。\
    \  \n这种限幅可以突然进行（例如，使用等价于开关动作的符号函数）或连续进行（使用称为饱和函数的函数）。即使是连续函数也可以是平滑的或陡峭的（你可以使用饱和函数家族中的许多函数，称为\
    \ S 型函数）。  \n通常，饱和器的无限制部分会像标准线性函数一样复制原始信号，如代码清单 5-2 中的代码所示。然而，为了抵消不期望的表现（例如，遥控器摇杆的突变行为），有时也会使用其他类型的\
    \ S 型函数。\n\n图 5-2 说明了两个方面。上半部分是一个饱和函数家族，本例中包括符号函数、饱和函数和双曲正切函数。显然，设计者必须对它们进行修改，使其根据应用达到最小值和最大值，而不仅仅是-1\
    \ 和 1。下半部分是将饱和函数应用于给定信号，本例中允许的最小和最大值范围为 0 到 7。\n\n![../images/504209_1_En_5_Chapter/504209_1_En_5_Fig2_HTML.jpg](img/504209_1_En_5_Fig2_HTML.jpg)\n\
    \n**图 5-2** 不同类型的饱和函数及其对信号的应用\n\n图 5-2 中使用的代码非常简单，如代码清单 5-2 所示。\n\n```\nMini=0\n\
    Maxi=7\nif(signal=Maxi)\nsatsignal=Maxi;\nelse\nsatsignal=signal;\nend\n代码清单 5-2\n\
    饱和函数（线性类型）的通用代码\n```\n"
- fmt: "### Biasing and Mapping\n\nAnother important task is to transform the control\
    \ signal (a signal with positive and negative values) into one signal compatible\
    \ with the motors (for example, within a range of values between 1000 and 2000\
    \ in brushless RC motors). Another example is the range of the sensors, which\
    \ can be arbitrary and must be converted into a standard working range (0 to 360\
    \ degrees, -180 to 180 degrees, -1 to 1 meter etc.). See Figure [5-3](#504209_1_En_5_Chapter.xhtml#Fig3).\
    \ In this case, scaling and translation functions are used.\n\nOne of the most\
    \ used biasing and mapping techniques is the equation of the line between two\
    \ points known as linear mapping, which adjusts an input value to the equation\
    \ of a straight line (the output value). For this, the input signal must previously\
    \ be constrained in a way that it does not exceed maximum and minimum input limits.\n\
    \n![../images/504209_1_En_5_Chapter/504209_1_En_5_Fig3_HTML.jpg](images/504209_1_En_5_Chapter/504209_1_En_5_Fig3_HTML.jpg)\n\
    \nFigure 5-3  \nMapping a signal from a range of input values to a range of output\
    \ values\n\nThe code is also simple and is shown in Listing [5-3](#504209_1_En_5_Chapter.xhtml#PC3)\
    \ (note that this mapping code describes a line between two points).\n\n```\n\
    mininput=0;\nminoutput=-pi;\nmaxinput=360;\nmaxoutput=pi;\nmapsignal=(signal -\
    \ mininput) * (maxoutput - minoutput) / (maxinput - mininput) + minoutput;\nListing\
    \ 5-3\nGeneric Code for a Mapping (the Linear One)\n```\n\n### Data Casting\n\n\
    This is another important signal adaptation, and it is the one to be carried out\
    \ when a command only admits one type of data and is provided with data of another\
    \ type. For example, the commands for writing to a PWM-type RC motor usually require\
    \ data of integer type and the provided values are floating numbers or fractions.\
    \ In this case, we use what in programming is called as casting, which is the\
    \ transformation from one data type to another. This can involve two things:\n\
    \n* The casting does not exist and the user must design this program.\n* The casting\
    \ generates aliasing, which affects the quality of the measurements or the executions\
    \ (for example, a controller can go from a smooth and natural motion to an abrupt\
    \ and robotic one, or from a high definition image to one with poor quality).\n\
    \nFigure [5-4](#504209_1_En_5_Chapter.xhtml#Fig4) shows a common example. The\
    \ red signal represents a calculated control value (with a large number of decimal\
    \ places) and at the moment of injecting this signal into the motors, as the writing\
    \ command admits other type of data (`uint8` for example), the precision of the\
    \ original value is reduced. In appearance they look similar, but if we see in\
    \ detail, a stepped effect called aliasing is presented. This effect could imply\
    \ a less smooth behavior in the motion of a drone.\n\n![../images/504209_1_En_5_Chapter/504209_1_En_5_Fig4_HTML.jpg](images/504209_1_En_5_Chapter/504209_1_En_5_Fig4_HTML.jpg)\n\
    \nFigure 5-4  \nAliasing of a signal when data casting is performed\n\nDepending\
    \ on the programming language, the casting commands may or may not exist (the\
    \ user must create them), but in general they adopt the form displayed in Listing\
    \ [5-4](#504209_1_En_5_Chapter.xhtml#PC4).\n\n```\nsignal=100+50*sin(t/30);\n\
    castSignal = uint8(signal);\nListing 5-4\nA Generic Example of Data Casting\n\
    ```\n\nObserve that if the casting exists, it means that there are functions that\
    \ force a signal or input data to change its data type (`uint8`, in this example).\n\
    \n### Redundancies and Singularities Normalization\n\nThis is a common problem\
    \ found in angular sensors and it lies in the fact that they have a jump from\
    \ their maximum value to their minimum value, for example from 359 degrees to\
    \ 0 degrees, or redundant values known as singularities such as 0 degrees and\
    \ 360 degrees (this also happens with -180 degrees and 180 degrees if the sensor\
    \ works in this way). See Figure [5-5](#504209_1_En_5_Chapter.xhtml#Fig5).\n\n\
    ![../images/504209_1_En_5_Chapter/504209_1_En_5_Fig5_HTML.jpg](images/504209_1_En_5_Chapter/504209_1_En_5_Fig5_HTML.jpg)\n\
    \nFigure 5-5  \nAngular redundancies and singularities\n\nTo handle these conditions\
    \ of singularity, ambiguity, or redundancy, there are many normalization methods.\
    \ One of them (which considers the case on the left side of Figure [5-5](#504209_1_En_5_Chapter.xhtml#Fig5))\
    \ is based on the symmetric definition of the angular error with respect to the\
    \ measured value. See my book *Advanced Robotic Vehicles Programming* for more\
    \ details.\n\n![../images/504209_1_En_5_Chapter/504209_1_En_5_Figa_HTML.jpg](images/504209_1_En_5_Chapter/504209_1_En_5_Figa_HTML.jpg)\n\
    \nThis is a dynamic normalization, whose additional objective is to reduce the\
    \ rotation to be made by the vehicle in a way that implies a shorter distance.\
    \ To achieve a desired orientation, a vehicle can do it by rotating to the left\
    \ or to the right. This algorithm, in addition to preventing singularities, chooses\
    \ whether it is better to move in clockwise or in counterclockwise sense.\n\n\
    You should also develop or investigate alternative normalization methods that\
    \ are based on the desired value rather than the measured one, or based on an\
    \ absolute reference instead of the vehicle reference, or methods based on multiple\
    \ rotations and methods for angular measurements from 0 to 360 degrees, etc.\n\
    \n### Example of Use\n\nFigure [5-6](#504209_1_En_5_Chapter.xhtml#Fig6) presents\
    \ a modification of the semi-automatic controller without yaw motion (or very\
    \ small) as previously described. This variation incorporates the five basic signal\
    \ processing methods in this way: mapping and saturation of the remote control\
    \ is applied to adapt its values in order to have acceptable angular commands.\
    \ Filtering is applied to the pose sensors to reduce their levels of noise. The\
    \ angular error is normalized. Before injecting the allocation matrix into the\
    \ motors, a scaling is applied to make their signals positive. In general, drone\
    \ motors have a fixed sense of rotation, and their speed can be varied from zero\
    \ or starting value, up to their maximum speed, so a saturation is applied in\
    \ the motor signals in order not to exceed their starting and maximum values.\
    \ Finally, a casting is done because in general the commands for writing to the\
    \ motors request a type of integer and the control signals are floating values.\n\
    \n![../images/504209_1_En_5_Chapter/504209_1_En_5_Fig6_HTML.jpg](images/504209_1_En_5_Chapter/504209_1_En_5_Fig6_HTML.jpg)\n\
    \nFigure 5-6  \nSignal processing applied to the controller of a drone\n\nYou\
    \ learned the basis of signal processing for drones. Let’s continue with the basis\
    \ of data transmission theory, which is used for most of the drone programming\
    \ environments that are usually based on the UART type serial transmission.\n\n\
    ## Data Transmission Theory\n\nData transmission theory is considered a topic\
    \ of high relevance given that it allows the communication between a team of drones\
    \ or between a single drone and a remote base. Among the available presentations,\
    \ here we describe the UART type (Universal Asynchronous Receiver-Transmitter),\
    \ because is one of the most basic and employed protocols with decades of use\
    \ and is really common to find in drone SDKs."
  raw: '### Biasing and Mapping


    Another important task is to transform the control signal (a signal with positive
    and negative values) into one signal compatible with the motors (for example,
    within a range of values between 1000 and 2000 in brushless RC motors). Another
    example is the range of the sensors, which can be arbitrary and must be converted
    into a standard working range (0 to 360 degrees, -180 to 180 degrees, -1 to 1
    meter etc.). See Figure [5-3](#504209_1_En_5_Chapter.xhtml#Fig3). In this case,
    scaling and translation functions are used.


    One of the most used biasing and mapping techniques is the equation of the line
    between two points known as linear mapping, which adjusts an input value to the
    equation of a straight line (the output value). For this, the input signal must
    previously be constrained in a way that it does not exceed maximum and minimum
    input limits.


    ![../images/504209_1_En_5_Chapter/504209_1_En_5_Fig3_HTML.jpg](images/504209_1_En_5_Chapter/504209_1_En_5_Fig3_HTML.jpg)


    Figure 5-3


    Mapping a signal from a range of input values to a range of output values


    The code is also simple and is shown in Listing [5-3](#504209_1_En_5_Chapter.xhtml#PC3)
    (note that this mapping code describes a line between two points).


    ```

    mininput=0;

    minoutput=-pi;

    maxinput=360;

    maxoutput=pi;

    mapsignal=(signal - mininput) * (maxoutput - minoutput) / (maxinput - mininput)
    + minoutput;

    Listing 5-3

    Generic Code for a Mapping (the Linear One)

    ```


    ### Data Casting


    This is another important signal adaptation, and it is the one to be carried out
    when a command only admits one type of data and is provided with data of another
    type. For example, the commands for writing to a PWM-type RC motor usually require
    data of integer type and the provided values are floating numbers or fractions.
    In this case, we use what in programming is called as casting, which is the transformation
    from one data type to another. This can involve two things:


    *   The casting does not exist and the user must design this program.


    *   The casting generates aliasing, which affects the quality of the measurements
    or the executions (for example, a controller can go from a smooth and natural
    motion to an abrupt and robotic one, or from a high definition image to one with
    poor quality).


    Figure [5-4](#504209_1_En_5_Chapter.xhtml#Fig4) shows a common example. The red
    signal represents a calculated control value (with a large number of decimal places)
    and at the moment of injecting this signal into the motors, as the writing command
    admits other type of data (uint8 for example), the precision of the original value
    is reduced. In appearance they look similar, but if we see in detail, a stepped
    effect called aliasing is presented. This effect could imply a less smooth behavior
    in the motion of a drone.


    ![../images/504209_1_En_5_Chapter/504209_1_En_5_Fig4_HTML.jpg](images/504209_1_En_5_Chapter/504209_1_En_5_Fig4_HTML.jpg)


    Figure 5-4


    Aliasing of a signal when data casting is performed


    Depending on the programming language , the casting commands may or may not exist
    (the user must create them), but in general they adopt the form displayed in Listing
    [5-4](#504209_1_En_5_Chapter.xhtml#PC4).


    ```

    signal=100+50*sin(t/30);

    castSignal = uint8(signal);

    Listing 5-4

    A Generic Example of Data Casting

    ```


    Observe that if the casting exists, it means that there are functions that force
    a signal or input data to change its data type (uint8, in this example).


    ### Redundancies and Singularities Normalization


    This is a common problem found in angular sensors and it lies in the fact that
    they have a jump from their maximum value to their minimum value, for example
    from 359 degrees to 0 degrees, or redundant values known as singularities such
    as 0 degrees and 360 degrees (this also happens with -180 degrees and 180 degrees
    if the sensor works in this way). See Figure [5-5](#504209_1_En_5_Chapter.xhtml#Fig5).


    ![../images/504209_1_En_5_Chapter/504209_1_En_5_Fig5_HTML.jpg](images/504209_1_En_5_Chapter/504209_1_En_5_Fig5_HTML.jpg)


    Figure 5-5


    Angular redundancies and singularities


    To handle these conditions of singularity, ambiguity, or redundancy, there are
    many normalization methods. One of them (which considers the case on the left
    side of Figure [5-5](#504209_1_En_5_Chapter.xhtml#Fig5)) is based on the symmetric
    definition of the angular error with respect to the measured value. See my book
    *Advanced Robotic Vehicles Programming* for more details.


    ![../images/504209_1_En_5_Chapter/504209_1_En_5_Figa_HTML.jpg](images/504209_1_En_5_Chapter/504209_1_En_5_Figa_HTML.jpg)


    This is a dynamic normalization, whose additional objective is to reduce the rotation
    to be made by the vehicle in a way that implies a shorter distance. To achieve
    a desired orientation, a vehicle can do it by rotating to the left or to the right.
    This algorithm, in addition to preventing singularities, chooses whether it is
    better to move in clockwise or in counterclockwise sense.


    You should also develop or investigate alternative normalization methods that
    are based on the desired value rather than the measured one, or based on an absolute
    reference instead of the vehicle reference, or methods based on multiple rotations
    and methods for angular measurements from 0 to 360 degrees, etc.


    ### Example of Use


    Figure [5-6](#504209_1_En_5_Chapter.xhtml#Fig6) presents a modification of the
    semi-automatic controller without yaw motion (or very small) as previously described.
    This variation incorporates the five basic signal processing methods in this way:
    mapping and saturation of the remote control is applied to adapt its values in
    order to have acceptable angular commands. Filtering is applied to the pose sensors
    to reduce their levels of noise. The angular error is normalized. Before injecting
    the allocation matrix into the motors, a scaling is applied to make their signals
    positive. In general, drone motors have a fixed sense of rotation, and their speed
    can be varied from zero or starting value, up to their maximum speed, so a saturation
    is applied in the motor signals in order not to exceed their starting and maximum
    values. Finally, a casting is done because in general the commands for writing
    to the motors request a type of integer and the control signals are floating values.


    ![../images/504209_1_En_5_Chapter/504209_1_En_5_Fig6_HTML.jpg](images/504209_1_En_5_Chapter/504209_1_En_5_Fig6_HTML.jpg)


    Figure 5-6


    Signal processing applied to the controller of a drone


    You learned the basis of signal processing for drones. Let’s continue with the
    basis of data transmission theory, which is used for most of the drone programming
    environments that are usually based on the UART type serial transmission.


    ## Data Transmission Theory


    Data transmission theory is considered a topic of high relevance given that it
    allows the communication between a team of drones or between a single drone and
    a remote base. Among the available presentations, here we describe the UART type
    (Universal Asynchronous Receiver-Transmitter), because is one of the most basic
    and employed protocols with decades of use and is really common to find in drone
    SDKs.'
  trans: "\n### 偏置与映射\n\n另一项重要任务是将控制信号（一个具有正负值的信号）转换为电机兼容的信号（例如，对于无刷 RC 电机，其值范围在 1000\
    \ 到 2000 之间）。另一个例子是传感器的量程，它可能是任意的，必须被转换为标准的工作范围（0 到 360 度，-180 到 180 度，-1 到 1\
    \ 米等）。见图 5-3。在这种情况下，会使用缩放和平移函数。\n\n一种最常用的偏置和映射技术是两点之间的直线方程，称为线性映射，它将输入值调整为一条直线方程（输出值）。为此，输入信号必须事先被约束，使其不超过最大和最小输入限制。\n\
    \n![../images/504209_1_En_5_Chapter/504209_1_En_5_Fig3_HTML.jpg](img/504209_1_En_5_Fig3_HTML.jpg)\n\
    \n图 5-3  \n将信号从输入值范围映射到输出值范围\n\n代码也很简单，如清单 5-3 所示（注意，这段映射代码描述了两点之间的一条直线）。\n\n\
    ```\nmininput=0;\nminoutput=-pi;\nmaxinput=360;\nmaxoutput=pi;\nmapsignal=(signal\
    \ - mininput) * (maxoutput - minoutput) / (maxinput - mininput) + minoutput;\n\
    清单 5-3\n映射的通用代码（线性映射）\n```\n\n### 数据类型转换\n\n这是另一种重要的信号适配，当一条指令只接受一种数据类型，而提供的是另一种数据类型的数据时，就需要进行这种操作。例如，写入\
    \ PWM 型 RC 电机的指令通常需要整数类型的数据，但提供的值可能是浮点数或分数。在这种情况下，我们使用编程中称为**强制类型转换**的方法，即将一种数据类型转换为另一种数据类型。这可能涉及两种情况：\n\
    \n*   该类型转换不存在，用户必须自行设计程序。\n*   该类型转换会产生混叠，影响测量或执行的质量（例如，控制器可能从平滑自然的运动变为突兀僵硬的运动，或者从高清晰度图像变为低质量图像）。\n\
    \n图 5-4 显示了一个常见示例。红色信号代表一个计算出的控制值（带有大量小数位），当将该信号注入电机时，由于写入命令接受其他数据类型（例如 `uint8`），原始值的精度会降低。它们看起来相似，但如果仔细观察，会出现一个称为**混叠**的阶梯效应。这种效应可能导致无人机运动行为不够平滑。\n\
    \n![../images/504209_1_En_5_Chapter/504209_1_En_5_Fig4_HTML.jpg](img/504209_1_En_5_Fig4_HTML.jpg)\n\
    \n图 5-4  \n执行数据类型转换时的信号混叠\n\n根据编程语言的不同，类型转换命令可能存在也可能不存在（用户必须自行创建），但通常它们采用清单 5-4\
    \ 所示的形式。\n\n```\nsignal=100+50*sin(t/30);\ncastSignal = uint8(signal);\n清单 5-4\n\
    数据类型转换的通用示例\n```\n\n请注意，如果存在类型转换，这意味着存在一些函数，它们强制信号或输入数据改变其数据类型（在此示例中为 `uint8`）。\n\
    \n### 冗余与奇异性归一化\n\n这是角度传感器中常见的一个问题，问题在于它们的值会从其最大值跳变到最小值，例如从 359 度跳变到 0 度，或者存在称为**奇点**的冗余值，例如\
    \ 0 度和 360 度（如果传感器以这种方式工作，-180 度和 180 度也会出现这种情况）。见图 5-5。\n\n![../images/504209_1_En_5_Chapter/504209_1_En_5_Fig5_HTML.jpg](img/504209_1_En_5_Fig5_HTML.jpg)\n\
    \n图 5-5  \n角度冗余与奇异性\n\n为了处理这些奇异、歧义或冗余的情况，有许多归一化方法。其中一种（考虑了图 5-5 左侧的情况）基于相对于测量值对称定义角度误差。更多细节请参阅我的著作\
    \ *《Advanced Robotic Vehicles Programming》*。\n\n![../images/504209_1_En_5_Chapter/504209_1_En_5_Figa_HTML.jpg](img/504209_1_En_5_Figa_HTML.jpg)\n\
    \n这是一种动态归一化，其额外目标是减少车辆需要进行的旋转，以实现更短的距离。为了达到期望的方向，车辆可以选择向左或向右旋转。该算法除了防止奇点外，还会选择顺时针或逆时针方向旋转哪个更好。\n\
    \n你还应该开发或研究替代的归一化方法，这些方法可以基于期望值而非测量值，或者基于绝对参考系而非车辆参考系，或者基于多次旋转的方法，以及用于 0 到 360\
    \ 度角度测量的方法等。\n\n### 使用示例\n\n图 5-6 展示了对之前描述的无偏航运动（或偏航运动非常小）的半自动控制器的改进。这种变体结合了五种基本信号处理方法，具体如下：对遥控器信号应用映射和饱和处理，以调整其值，从而获得可接受的角度指令。对位姿传感器应用滤波处理，以降低其噪声水平。对角度误差进行归一化处理。在将分配矩阵注入电机之前，应用缩放处理使电机信号变为正值。通常，无人机电机具有固定的旋转方向，其速度可以从零或起始值变化到最大速度，因此对电机信号应用饱和处理，以防止其超过起始值和最大值。最后，执行数据类型转换，因为写入电机的命令通常需要整数类型，而控制信号是浮点值。\n\
    \n![../images/504209_1_En_5_Chapter/504209_1_En_5_Fig6_HTML.jpg](img/504209_1_En_5_Fig6_HTML.jpg)\n\
    \n图 5-6  \n应用于无人机控制器的信号处理\n\n你已经学习了无人机信号处理的基础知识。让我们继续学习数据传输理论的基础知识，该理论用于大多数无人机编程环境，这些环境通常基于\
    \ UART 类型的串行传输。\n\n## 数据传输理论\n\n数据传输理论被认为是一个高度相关的主题，因为它允许无人机编队之间或单个无人机与远程基站之间的通信。在可用的介绍中，我们在此描述\
    \ UART（通用异步收发传输器）类型，因为它是最常用、最基本的协议之一，已经使用了数十年，并且在无人机 SDK 中非常常见。\n"
- fmt: '# Data Types and Subtypes


    Before talking about this standard, it is convenient to talk about data types
    and subtypes. This topic is related to the data conversion previously introduced.
    We will use C/C++ concepts in the following paragraphs because this is the most
    common programming language found in different SDKs for developing drone applications.
    However, this is a really common topic among other programming languages and each
    one of them has the following basic types (or very similar). See Table [5-1](#504209_1_En_5_Chapter.xhtml#Tab1).


    ## Table 5-1 Basic Data Types


    | Type | Description |

    | --- | --- |

    | `int` | Used for integer numbers |

    | `float` | Used for numbers with decimal values |

    | `double` | Increases the accuracy of the floats and is useful for scientific
    or engineering calculations |

    | `char` | Allows the use of characters |

    | `bool` | Allows the use of logical values |


    However, according to the operations being carried out, such as time management,
    memory management, and communication protocols, it is common to find variants
    of these fundamental types of data. These variants are identified by the incorporation
    of prefixes and suffixes. In drone programming, it is very common to use variants
    of the integer type. For example, `uint8` has a prefix `u` and a suffix `8`.


    In general, the prefix indicates a sign restriction and the suffix a range restriction
    based on bits. There are 8, 16, 32, and 64 bit integers, and they can store up
    to 255 (255 = 2 raised to eighth power minus 1, in order to start from the element
    0), 65535, 4294967295, and 18446744073709551615, respectively. The prefix `u`
    indicates that the possible values to use have only a positive sign and 0. So
    in the case of `uint8`, its useful range is from 0 to 255. Instead, if we use
    the option `int8`, we will also have 255 values but between a range from -128
    to 127.


    The usefulness of the prefixes and suffixes is described with examples.


    Let’s imagine a process that must be executed in microseconds. If we use an `uint8`
    data subtype, we will only have 255 microseconds, which is not even a millisecond
    of time. If we use an `uint16`, we will only have 65 milliseconds. Finally, by
    selecting an `uint32` subtype, the equivalent in seconds is 4294 or around 71
    minutes.


    Let’s advance a little further on the use of the UART to indicate that this is
    a communication that only supports unsigned 8-bit blocks. In this way, the use
    of subtypes 16 and 32 is not possible, much less the subtype with negative values.
    For this reason, here is where the utility of the `uint8` subtypes is found.


    Finally, you will find in many programming environments the aggregate `t` in the
    numerical suffix (`uint16t`, for example). This only has the property of being
    a compatible data between different hardware platforms. When the data types 8,
    16, and 32 were developed, they diverged in memory consumption between different
    computing platforms. Thus the manufacturers came to an agreement on the portability
    of the code by creating a standard that is identified with the letter `t`.


    ## UART Introduction


    Notice that it is assumed a SDK with high-level UART commands such as `read()`,
    `write()`, `begin()`, or `available()`, like the one presented in Arduino or Ardupilot.
    The use of a low-level UART is reserved for books about machine language, assembly
    language, or microcontrollers.


    UART transmission is described because it is one of the most widely used with
    the current autopilots and their respective SDKs. It is bilateral but asynchronous
    (without a timer involved and consequently without ensuring transmission and reception
    times). We have also indicated that this standard is based on the management of
    8-bit positive and integer data packets.


    To continue, we ask the following questions.


    Given the limitations indicated:


    - How do you work with negative data?

    - How do you work with decimal data (a number with decimal places)?

    - How are the reading and writing actions guaranteed, if there’s no timer to read
    or write?

    - And, how do you work with data greater than the value 255?


    To answer these questions, we start with the concept of a cyclic counter. This
    is simple to understand if we refer to the rotary motion.


    In a rotary motion, a body can be oriented from 0 to 360 degrees or from 0 to
    2pi radians, depending on the standard that you employ. Values higher than this
    range imply making multiple rotations or placing in the modulo operation of the
    indicated value with 360 or 2pi.


    Thus, 800 degrees is equivalent to two rotations of 360 degrees and a surplus
    of 80 degrees. Note that any angle is a function of the modulo or remainder of
    base 360 or 2pi, and the quotient of said angle with the same base (observe that
    we are interested only in the integer parts of the modulo and the quotient).


    ![../images/504209_1_En_5_Chapter/504209_1_En_5_Figb_HTML.jpg](images/504209_1_En_5_Chapter/504209_1_En_5_Figb_HTML.jpg)


    For the previous example:


    ![../images/504209_1_En_5_Chapter/504209_1_En_5_Figc_HTML.jpg](images/504209_1_En_5_Chapter/504209_1_En_5_Figc_HTML.jpg)


    Using this logic, the serial transmission implies that our base is the number
    256 (from 0 to 255 there are 256 values), and any number to be sent can be decomposed
    into the modulo with that base and the quotient with the same base:


    ![../images/504209_1_En_5_Chapter/504209_1_En_5_Figd_HTML.jpg](images/504209_1_En_5_Chapter/504209_1_En_5_Figd_HTML.jpg)


    For example:


    ![../images/504209_1_En_5_Chapter/504209_1_En_5_Fige_HTML.jpg](images/504209_1_En_5_Chapter/504209_1_En_5_Fige_HTML.jpg)


    In short, to work with values greater than 255, a number must be decomposed into
    two sections, one related to the modulo of said number and the other to its quotient:


    ![../images/504209_1_En_5_Chapter/504209_1_En_5_Figf_HTML.jpg](images/504209_1_En_5_Chapter/504209_1_En_5_Figf_HTML.jpg)


    The next question to solve is the way to send negative numbers.


    The answer is that there are two options and each one will depend on the data
    range to be used (the range of a sensor, for example).


    The first of them is basically to waste one of the 8 bits to be sent for indicating
    that said bit has a value of 0 if the number to send is positive or 0, and that
    has a value of 1 if the number is negative. However, our communication base will
    no longer be 256 but 128 (with the remaining 7 bits, we can only form 128 different
    numbers).


    The second is to carry out a saturation and mapping (translation and scaling)
    of the values (the operations seen in the previous section). When performing the
    saturation, we establish limits for our signal and these limits are required to
    define the minimum and maximum input values in our mapping function. The translation
    allows us to move towards a positive reference, for example to move from a range
    of values from [-100 100] to one of [0 200]. The scaling is optional if the input
    has large values with respect to the output, for example going from [-1000 1000]
    to [0 200]. Notice that the mapping function already has both effects.'
