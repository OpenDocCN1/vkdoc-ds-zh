    ## Simulation with Simulink and Interpreted MATLAB Functions


    If you want to use free software such as Scilab or Python, it is advisable to
    read this section. Based on what you learn here and the references of this chapter
    (which you can find in the Appendix), you could search for the equivalent commands
    or blocks in the mentioned programs and programming languages.


    Keep in mind that through the multiple libraries that this combination has (MATLAB/Simulink),
    you can interact with animated or interactive simulation software such as Gazebo,
    X-plane, the Ardupilot libraries, the Pixhawk autopilot, or CAD software with
    physics engines.


    Let’s continue. This is a special mode among the many that Simulink has to perform
    simulations. It offers the practicality of the blocks in one of their most simplified
    forms, where a text file is used exclusively for writing the equations of the
    system and its controller. In this manner, a set of equations with many terms
    are relegated to the text file, and a general template is placed in a block file.
