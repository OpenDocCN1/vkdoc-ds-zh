  raw: '### The Allocation Model for a Quadcopter


    By carrying out a similar procedure to the one in the previous section about the
    forces acting on a quadcopter, the following is obtained (remember that each aircraft
    configuration is different, but it can be analyzed following this example as a
    starting point):


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figan_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Figan_HTML.jpg)


    Notice that the torques around the body frame Z axis are directly produced by
    other torques (those of the motors), while the torques around the body frame X
    and Y axes are caused by the action of the lever arms, as illustrated in Figure
    [2-25](#504209_1_En_2_Chapter.xhtml#Fig25).


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Fig25_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Fig25_HTML.jpg)


    Figure 2-25


    Motor lever arm components for calculating torques (exemplified for motor 4)


    For simplicity, this is illustrated only for motor 4, but you can deduce the remaining
    components. Observe the direction of the lever arms with respect to the coordinate
    axes and consequently their components. Also, keep in mind the rotation caused
    by each motor with respect to the reference axis in order to determine the appropriate
    signs. In this case, both components in X and Y are negative and this is reflected
    in the equations, because the rotations that thrust 4 produces are opposite to
    the reference of positive rotation previously set.


    Next, a series of assumptions will be made to simplify the above equations as
    much as possible. You must evaluate whether such assumptions are feasible or not
    in your own designs.


    The following relationships between forces and torques with the rotation speed
    of each motor are assumed (these assumptions are more or less adequate since motor
    manufacturers usually ensure this degree of linear proportion). Observe the proportionality
    constants that relate the torque and thrust force with the speed of the motor.


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figao_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Figao_HTML.jpg)


    Therefore and also assuming that all of the motors are the same (if the motors
    are the same model, the proportionality constants, according to the manufacturer,
    will be similar or approximately the same),


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figap_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Figap_HTML.jpg)


    The next assumption is that the terms kf, kt, rcos (45) kf, and rsin (45) kf are
    constant gains and as they are present in all the terms that contain an angular
    velocity w, they can be factorized and absorbed by compensation for Fzb, Tzb,
    Txb, and Tyb.


    In this way, it is common to find this simplified representation. Note that said
    compensation considers symmetries, and if the angles of the arms or their distances
    were different (an asymmetric drone), these terms should be taken into account
    and not omitted:


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figaq_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Figaq_HTML.jpg)


    These equations are simpler than the original ones and admit this vectorial representation:


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figar_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Figar_HTML.jpg)


    And thus the following reduction (to simplify matrix operations):


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figas_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Figas_HTML.jpg)


    For those who wonder how X and Y motions are controlled, this will be seen later
    in the control section of this book, but it is anticipated that it is due to their
    dependence on angular variables (nested control).


    Note that for hexarotors or tricopters, we will inevitably have non-square matrices
    and it will be necessary to use pseudoinverses or numerical optimization algorithms.


    Continuing our analysis, once we design the control values of this vector,


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figat_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Figat_HTML.jpg)


    its distribution to the motors is done as follows:


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figau_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Figau_HTML.jpg)


    In order to reduce processing and avoid calculating said inverse and matrix multiplication
    over and over again, this is programmed in a developed way, that is


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figav_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Figav_HTML.jpg)


    which, under the same argument of constant-values absorption done by the control
    of torques and forces, is equivalent in action to (this is the allocation matrix)


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figaw_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Figaw_HTML.jpg)


    and finally


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figax_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Figax_HTML.jpg)


    This format must be incorporated both into automatic controls (designed and introduced
    by control theory, as will be seen in the corresponding section) and into manual
    controls (from a remote control, for example). When using a remote control, the
    vector to be incorporated into the motors is this:


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figay_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Figay_HTML.jpg)


    A semiautomatic design (with manual and automatic operations) could be as follows
    (this sum of vectors must be multiplied by the allocation matrix to inject its
    effect into each motor):


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figaz_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Figaz_HTML.jpg)


    A natural question is if the previous equations have a simpler way to be used.
    The answer is affirmative but it also implies certain operating conditions. Let’s
    see what happens.'
  trans: '

    ### 四旋翼飞行器的分配模型


    通过采用与上一节关于四旋翼飞行器受力分析相似的步骤，可以得到以下结果（请记住，每种飞行器的配置都不同，但可以以此例为起点进行分析）：


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figan_HTML.jpg](img/504209_1_En_2_Figan_HTML.jpg)


    请注意，绕机体坐标系`Z`轴的扭矩直接由其他扭矩（即电机的扭矩）产生，而绕机体坐标系`X`和`Y`轴的扭矩则由力臂作用产生，如图 2-25 所示。


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Fig25_HTML.jpg](img/504209_1_En_2_Fig25_HTML.jpg)


    图 2-25


    用于计算扭矩的电机力臂分量（以电机 4 为例）


    为简单起见，此处仅以电机 4 为例进行说明，但您可以推导出其余电机的情况。观察力臂相对于坐标轴的方向及其分量。同时，牢记每个电机相对于参考轴引起的旋转方向，以确定正确的正负号。在此例中，`X`和`Y`方向的分量均为负，这反映在方程式中，因为电机
    4 推力产生的旋转与之前设定的正旋转参考方向相反。


    接下来，将进行一系列假设，以尽可能地简化上述方程。您需要评估这些假设在您自己的设计中是否可行。


    假设力、扭矩与各电机转速之间存在以下关系（这些假设或多或少是合理的，因为电机制造商通常会保证这种线性比例程度）。注意这些将扭矩和推力与电机转速关联起来的比例常数。


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figao_HTML.jpg](img/504209_1_En_2_Figao_HTML.jpg)


    因此，同时假设所有电机均相同（如果电机为同一型号，据制造商提供的数据，其比例常数将相似或大致相同），


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figap_HTML.jpg](img/504209_1_En_2_Figap_HTML.jpg)


    下一个假设是，项`kf`、`kt`、`rcos(45) kf`和`rsin(45) kf`为恒定增益，由于它们存在于所有包含角速度`w`的项中，因此可以被提取公因式，并通过补偿`Fzb`、`Tzb`、`Txb`和`Tyb`来吸收。


    这样，我们通常可以找到这种简化表示形式。请注意，所述的补偿考虑了对称性；如果力臂的角度或距离不同（例如非对称无人机），则必须考虑这些项，而不能将其忽略：


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figaq_HTML.jpg](img/504209_1_En_2_Figaq_HTML.jpg)


    这些方程比原始方程更简洁，并且可以采用如下向量形式表示：


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figar_HTML.jpg](img/504209_1_En_2_Figar_HTML.jpg)


    进而可以简化如下（以简化矩阵运算）：


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figas_HTML.jpg](img/504209_1_En_2_Figas_HTML.jpg)


    对于好奇`X`和`Y`方向运动如何控制的人，这将在本书后续的控制章节中介绍，但可以预先说明，这是由于它们对角变量的依赖关系（嵌套控制）。


    注意，对于六旋翼或三旋翼飞行器，我们不可避免地会遇到非方阵的情况，此时需要使用伪逆矩阵或数值优化算法。


    继续我们的分析，一旦我们设计出这个向量的控制值，


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figat_HTML.jpg](img/504209_1_En_2_Figat_HTML.jpg)


    其到各电机的分配过程如下：


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figau_HTML.jpg](img/504209_1_En_2_Figau_HTML.jpg)


    为了减少处理开销并避免反复计算上述逆矩阵和矩阵乘法，我们会以展开形式进行编程，即


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figav_HTML.jpg](img/504209_1_En_2_Figav_HTML.jpg)


    基于与上述相同的、由扭矩和力控制所吸收的常数值吸收原理，其在作用上等价于（这就是分配矩阵）


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figaw_HTML.jpg](img/504209_1_En_2_Figaw_HTML.jpg)


    最终得到


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figax_HTML.jpg](img/504209_1_En_2_Figax_HTML.jpg)


    此格式必须同时应用于自动控制（由控制理论设计并引入，将在相应章节介绍）和手动控制（例如，来自遥控器）。使用遥控器时，输入到电机的向量如下：


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figay_HTML.jpg](img/504209_1_En_2_Figay_HTML.jpg)


    一种半自动设计（结合手动与自动操作）可能如下所示（此向量之和必须乘以分配矩阵，才能将其效应注入到每个电机）：


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figaz_HTML.jpg](img/504209_1_En_2_Figaz_HTML.jpg)


    一个自然而然的问题是，上述方程是否有更简单的使用方法。答案是肯定的，但这也意味着需要满足某些特定的运行条件。让我们来看看具体是什么情况。

