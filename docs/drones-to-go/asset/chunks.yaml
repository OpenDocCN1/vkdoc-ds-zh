    ### Rotational Control


    It is time for the most difficult part of this controller: the design of the orientation
    control by regulating the rotation matrix . For this, we consider that all the
    closed loop controllers are based on an error. An error is a distance between
    a desired value and a measured value. With scalar quantities, this distance is
    simply a subtraction. In a similar way, we are going to define the concept of
    distance between two rotation matrices (the measured and the desired one).


    To begin with, we already know that the matrix R is defined by Euler’s angles
    as


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figcq_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figcq_HTML.jpg)


    and the fact that the desired matrix contains the three “thrusters.” This is because
    in a rotation matrix, each one of its columns represents the behavior of a Cartesian
    axis. Also, as mentioned, each column is a unit vector that satisfies the normal
    vector condition, and the orthogonal condition is satisfied with the following
    definitions:


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figcr_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figcr_HTML.jpg)


    As mentioned, these vectors are **noa** type vectors, and for their definition
    it is very important that they are orthonormal to each other. This explains the
    presence of the cross products and the normalized quantities. Finally, in the
    case of b1d since it is the cross product of two normalized or unitary vectors,
    it is also normalized or unitary.


    Notice that the only independent vectors are Bdes and b3d, and the only one that
    can be designed is Bdes, since b3d must satisfy our constraint condition to regulate
    FBZ. In the case of b1d, it is forced to fulfill the orthonormality with the two
    remaining vectors.


    An example of Bdes can be


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figcs_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figcs_HTML.jpg)


    This vector is linked to b1d and b2d, and allows for example the rotation around
    the ZB axis (a forced but functional yaw regulation, not entirely carried out,
    because of the interaction in b1d and b2d, with b3d).


    Having defined the measured rotation matrix and the desired rotation matrix, let’s
    remember some concepts about distance. The distance between two scalars is a subtraction.
    The distance between two vectors is, among many others, a quadratic vector norm
    (the square root of the sum of its scalar subtractions at the second power). For
    matrices, there are also several definitions of distance. Here we will use the
    Frobenius norm because of its invariant properties (the trace and the determinant
    are invariant values in a matrix and the Frobenius norm is based on traces).


    As you can see, all distances are either a scalar or a scalar function. If a and
    b are scalar values, the distance is


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figct_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figct_HTML.jpg)


    If they are vectors, a very common type of distance is


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figcu_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figcu_HTML.jpg)


    And the vector components (individual subtractions) can be obtained in this way
    (it is useful to know these components in order to design a three-dimensional
    control):


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figcv_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figcv_HTML.jpg)


    where the operator used here (the inverted triangle also known as nabla or del)
    is known as the gradient and is a type of directional derivative that obtains
    the vector components from a scalar function dependent on several variables (in
    this case, a function of the distance, which is already a scalar dependent on
    several variables).


    If a and b are matrices, the Frobenius distance is


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figcw_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figcw_HTML.jpg)


    Note that the sequence of the subtractions is dimensionally extended.'
