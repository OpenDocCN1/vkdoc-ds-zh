    # 机器人模式控制


    如果将无人机视为机器人进行分析，控制设计将涉及到将其视为由第三方操控或外部视角来观察。为此，控制目标是将四旋翼飞行器的一个参考点移动至给定的三维位置，同时可以选择是否调节其朝向。请参见图
    3-4。


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Fig4_HTML.jpg](img/504209_1_En_3_Fig4_HTML.jpg)


    图 3-4：从第三方任务视角看的无人机机器人模式控制


    现在，我们来解释一下称为无偏航变化的线性笛卡尔控制的机器人模式控制。


    ## 无偏航变化的完全线性笛卡尔控制


    这是一种简单且基础的控制器，能够实现如图 3-5 所示的操作，即在不改变无人机朝向的情况下沿路径飞行。这在例如种植作业或房屋涂装图案中非常有用。下面我们来描述其独立和依赖的动态模块。


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Fig5_HTML.jpg](img/504209_1_En_3_Fig5_HTML.jpg)


    图 3-5：无偏航变化的完全线性笛卡尔控制图解说明


    ### 独立动态的控制


    让我们回到无人机的线性化动态模型，通过分离那些不依赖于其他变量的动态（请注意，这是相对于运动变量进行的，您可以在其中识别出三个位置和三个方向）。因此，我们得到


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figm_HTML.jpg](img/504209_1_En_3_Figm_HTML.jpg)


    请注意，`X` 和 `Y` 方向动态依赖于 `theta` 和 `phi` 角度的动态。因此，我们隔离出那些与其他方程没有交互的方程，即 `psi` 和 `Z`
    相关的方程。注意，实际的 `psi` 不同于期望的 `psi`，因为后者是一个恒定值或一条轨迹，而在我们的示例中，期望的 `psi` 将等于零。


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Fign_HTML.jpg](img/504209_1_En_3_Fign_HTML.jpg)


    如果将 `Z` 方向上的推力定义为如下形式


