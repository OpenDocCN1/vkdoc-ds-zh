    但请记住（并且记得单位矩阵的逆矩阵也是单位矩阵）：


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figbo_HTML.jpg](img/504209_1_En_2_Figbo_HTML.jpg)


    因此，


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figbp_HTML.jpg](img/504209_1_En_2_Figbp_HTML.jpg)


    这样，飞行器坐标系中的旋转动力学就变得与固定坐标系中的相同。


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figbq_HTML.jpg](img/504209_1_En_2_Figbq_HTML.jpg)


    简而言之，平稳飞行简化改变了原始方程组，如图 2-26、2-27 和 2-28 所示。


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Fig27_HTML.jpg](img/504209_1_En_2_Fig27_HTML.jpg)


    **图 2-27** 动力学的线性简化


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Fig26_HTML.jpg](img/504209_1_En_2_Fig26_HTML.jpg)


    **图 2-26** 运动学的线性简化


    注意，变化是在运动学关系以及动力学中进行的，但推进方程保持不变（请记住，如果您的飞行器具有推力矢量系统，分配矩阵也会改变）。


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Fig28_HTML.jpg](img/504209_1_En_2_Fig28_HTML.jpg)


    **图 2-28** 分配矩阵的线性简化（在此示例中，方程保持不变）


    ## 本章小结


    在本章中，您学习了无人机的通用模型，该方法特别针对但并非排他性地适用于四旋翼飞行器。本章解释了建模的坐标系、旋转和平移类型的运动学和动力学方程、螺旋桨的通用建模、分配或推进模型，最后介绍了一些线性简化，这些简化将在下一章中用到。这些主题在不同关于无人机的书籍和文章中非常常见。如果您想深入学习已学知识，再次邀请您探索附录。在下一章，您将看到与控制器设计相关的主题，这些控制器被视为两类家族：飞行器模式（或第一人称视角，或称机上控制模式）和机器人模式（或第三人称视角，或称外部控制模式）。

