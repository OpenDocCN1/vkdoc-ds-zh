  trans: '

    # 数据类型与子类型


    在讨论本标准之前，先来了解一下数据类型与子类型的概念会很有帮助。该主题与之前介绍的数据转换相关。由于 C/C++ 是开发无人机应用的不同 SDK 中最常见的编程语言，以下段落将使用
    C/C++ 的概念。不过，这实际上是其他编程语言中非常普遍的主题，每种语言都包含以下基本类型（或非常相似的类型）。请参见表 5-1。


    ## 表 5-1 基本数据类型


    | 类型 | 描述 |

    | --- | --- |

    | `int` | 用于整数 |

    | `float` | 用于带有小数的数值 |

    | `double` | 提高浮点数精度，适用于科学或工程计算 |

    | `char` | 允许使用字符 |

    | `bool` | 允许使用逻辑值 |


    然而，根据所执行的操作（例如时间管理、内存管理和通信协议），经常会发现这些基本数据类型的变体。这些变体通过增加前缀和后缀来标识。在无人机编程中，使用整数类型的变体非常常见。例如，`uint8`
    包含前缀 `u` 和后缀 `8`。


    通常，前缀表示符号限制，后缀表示基于比特位的范围限制。存在 8、16、32 和 64 位的整数，它们分别可以存储最大值为 255（255 = 2 的 8 次方减
    1，以便从 0 开始计数）、65535、4294967295 和 18446744073709551615 的值。前缀 `u` 表示可使用的值仅为正数和 0。因此，对于
    `uint8`，其有效范围是 0 到 255。而如果使用 `int8` 选项，我们同样拥有 255 个值，但范围是 -128 到 127。


    前缀和后缀的用途将通过示例进行说明。


    假设一个过程必须以微秒为单位执行。如果我们使用 `uint8` 数据子类型，我们只有 255 微秒，这甚至不到一毫秒。如果我们使用 `uint16`，我们只有
    65 毫秒。最后，选择 `uint32` 子类型，其等效时间约为 4294 秒，或者说大约 71 分钟。


    让我们进一步探讨 UART 的使用，以说明这是一种仅支持无符号 8 位数据块的通信方式。因此，无法使用 16 位和 32 位子类型，更不用说带有负值的子类型了。正因如此，才体现了
    `uint8` 子类型的实用性。


    最后，在许多编程环境中，你会在数字后缀中看到附加的 `t`（例如 `uint16t`）。这仅表示该数据类型在不同硬件平台间具有兼容性。在开发 8、16 和
    32 位数据类型时，不同计算平台在内存占用上存在差异。因此，制造商们就代码的可移植性达成一致，创建了一个用字母 `t` 标识的标准。


    ## UART 简介


    请注意，这里假设 SDK 提供了高级 UART 命令，例如 `read()`、`write()`、`begin()` 或 `available()`，类似于
    Arduino 或 Ardupilot 中提供的那些。低级 UART 的使用则留给关于机器语言、汇编语言或微控制器的书籍来讨论。


    此处描述 UART 传输，是因为它是当前自动飞行器及其相应 SDK 中最广泛使用的通信方式之一。它是双向的，但却是异步的（不涉及定时器，因此无法保证发送和接收时间）。我们还指出，本标准基于
    8 位正整数数据包的管理。


    接下来，我们提出以下问题。


    鉴于所述的限制：


    -   如何处理负值数据？

    -   如何处理小数数据（带有小数位的数字）？

    -   如果没有定时器进行读取或写入，如何保证读取和写入操作？

    -   以及，如何处理大于 255 的数据？


    为了回答这些问题，我们从循环计数器的概念开始。如果参照旋转运动，这个概念就很容易理解。


    在旋转运动中，一个物体可以从 0 度到 360 度或从 0 到 2π 弧度进行定向，具体取决于您采用的标准。超出此范围的值意味着要进行多次旋转，或者对该值进行模
    360 或 2π 的取模运算。


    因此，800 度相当于两次 360 度的旋转加上 80 度的余数。请注意，任何角度都可以表示为该角度除以 360 或 2π 底数的模（余数）和商（注意，我们只关心模和商的整数部分）。


    ![../images/504209_1_En_5_Chapter/504209_1_En_5_Figb_HTML.jpg](img/504209_1_En_5_Figb_HTML.jpg)


    对于前面的例子：


    ![../images/504209_1_En_5_Chapter/504209_1_En_5_Figc_HTML.jpg](img/504209_1_En_5_Figc_HTML.jpg)


    运用此逻辑，串行传输意味着我们的底数是 256（从 0 到 255 共有 256 个值），任何要发送的数字都可以分解为该底数的模和该底数的商：


    ![../images/504209_1_En_5_Chapter/504209_1_En_5_Figd_HTML.jpg](img/504209_1_En_5_Figd_HTML.jpg)


    例如：


    ![../images/504209_1_En_5_Chapter/504209_1_En_5_Fige_HTML.jpg](img/504209_1_En_5_Fige_HTML.jpg)


    简而言之，为了处理大于 255 的值，必须将一个数字分解为两部分，一部分与该数字的模相关，另一部分与其商相关：


    ![../images/504209_1_En_5_Chapter/504209_1_En_5_Figf_HTML.jpg](img/504209_1_En_5_Figf_HTML.jpg)


    接下来要解决的问题是如何发送负数。


    答案是，有两种选择，具体取决于要使用的数据范围（例如，传感器的量程）。


    第一种选择基本上是浪费要发送的 8 位中的一位，用来指示：如果要发送的数字是正数或 0，则该位值为 0；如果数字是负数，则该位值为 1。然而，我们的通信底数将不再是
    256，而是 128（因为使用剩余的 7 位，我们只能组成 128 个不同的数字）。


    第二种选择是对值进行饱和与映射（平移和缩放）（即前一节中介绍的操作）。进行饱和处理时，我们为信号设定界限，这些界限用于定义映射函数中的最小和最大输入值。平移允许我们将信号移动到正参考系，例如，将值范围从
    [-100, 100] 移动到 [0, 200]。如果输入值相对于输出值很大，则缩放是可选的，例如从 [-1000, 1000] 转换到 [0, 200]。请注意，映射函数本身已包含这两种效果。

    '
- fmt: '# 处理过大数值时的精度与通信


    过大缩放（在数值较大时会变得更为明显）的影响在于会产生带有小数部分的数字。现在我们将回答如何处理它们。


    首先要做的是确定我们想要的精度等级。我们必须评估我们感兴趣的是保留一位、两位还是更多位小数。例如，在我们`[0 200]`的范围内，我们感兴趣的是处理像`199.3`这样的数字，还是像`199.15`这样的数字。


    为了传递这些数字，我们有两种基本选择。


    第一种是分离整数部分和小数部分，并将它们作为两个不同的数字发送。在数字`199.15`的示例中，会先单独发送一个`199`，然后再发送一个`15`。这种方法的问题在于，其中一个数字可能在传输过程中丢失。


    另一种选项是应用缩放。这样，如果我们只关心一位小数，则只需将初始范围乘以`10`即可。使用给定的示例，`199.3`将变为`1993`，而`199.15`将变为`1991`。相反，如果我们想要两位小数，则缩放因子为`100`，分别发送`19930`和`19915`。这样，发送的是一个缩放后的数字。为此，要求接收方和发送方都知道缩放因子。使用这种方法获得高精度是一个问题，因为很可能需要将待发送的数字分成两部分或更多部分。应用很简单。例如，如果我们想要两位小数，那么不应从`[-1000
    1000]`映射到`[0 200]`，而应从`[-1000 1000]`映射到`[0 20000]`。


    请注意，几乎任何操作都可以在发送方和接收方完成，包括浮点或双精度运算。但数据传输仅针对正整数值。因此，我们必须进行上述调整（有些开发接口如`Arduino`包含自动进行这些转换的函数；因此，它们似乎不仅支持正整数）。


    最后，为了回答关于如何保证通信的剩余问题，我们将说明`UART`通信的组件是如何实现的。


    此过程的基础是理解与之前介绍的操作（取模和取商）等效的二进制操作，以及其他一些二进制校验操作。这是因为在计算机上，使用处理器所熟知的语言来简化数据处理任务是很方便的。这些操作包括发送、接收、校验和通信协议。


    ## UART 发送


    起点是以下方程：


    ![../images/504209_1_En_5_Chapter/504209_1_En_5_Figg_HTML.jpg](images/504209_1_En_5_Chapter/504209_1_En_5_Figg_HTML.jpg)


    在十进制格式中，通过除法运算得到模和商，如图5-7所示。


    ![../images/504209_1_En_5_Chapter/504209_1_En_5_Fig7_HTML.jpg](images/504209_1_En_5_Chapter/504209_1_En_5_Fig7_HTML.jpg)


    图 5-7


    十进制基数的商和模


    在二进制格式中，可以通过对要分割的数字的二进制等效值的最后8位应用非循环右移操作（用零替换移位的数字）来获得商。此操作在`C++`中表示为`>> 8`，作为其他编程语言的参考。另一方面，通过对`255`或二进制基下的`1111
    1111`应用`AND`操作来获得模。此操作在`C++`中表示为`&`，作为其他编程语言的参考。


    使用同样的示例：


    `7515`=`1110101011011`（二进制）


    `11101 0101 1011`（二进制）`>> 8`=`0000 0000 11101`（二进制）=`29`（十进制）


    另一方面：


    `11101 0101 1011`（二进制）


    `& 00000 1111 1111`（二进制）


    `= 00000 0101 1011`（二进制）=`91`（十进制）


    这样，数字（本例中为`7515`）被作为两组8位发送：


    `0101 1011`（二进制）=`91`（十进制）


    `0001 1101`（二进制）=`29`（十进制）


    当然，在发送这些数字之前，它们是通过前面描述的操作（`>> 8`和`& 1111 1111`）获得的。


    ## UART 接收


    接收包括应用以下方程：


    ![../images/504209_1_En_5_Chapter/504209_1_En_5_Figh_HTML.jpg](images/504209_1_En_5_Chapter/504209_1_En_5_Figh_HTML.jpg)


    直接使用某些编程语言，或通过以下二进制等效值：8位非循环左移和`OR`运算（在`C++`中为`<< 8`和`|`）：


    `Binary value = Binary Quotient part << 8 | Binary Module part`


    使用前面的示例：


    `0001 1101`（二进制）=`29`（十进制）`<< 8`=`0000 11101 0000 0000`=`7424`（十进制）


    得到这个结果后，我们继续进行`OR`运算。请注意，这里出现了超过8位的情况，但请记住，这是由接收计算机在收到数据后处理的。对于需要8位消息的通信信道来说情况并非如此。


    `11101 0000 0000`


    `| 00000 0101 1011`（二进制）=`91`（十进制）


    `= 11101 0101 1011`（二进制）=`7515`（十进制）


    读写过程总结在图5-8中。


    ![../images/504209_1_En_5_Chapter/504209_1_En_5_Fig8_HTML.jpg](images/504209_1_En_5_Chapter/504209_1_En_5_Fig8_HTML.jpg)


    图 5-8


    UART 读写过程总结


    现在你知道了如何发送和接收信息。但是，如何验证数据？又如何判断你是否能够通信？以下操作将回答这些问题。'
  raw: 'The effect of the excessive scaling (with large numbers it becomes more noticeable)
    is the presence of numbers with a fractional part. Now we will answer how to work
    with them.


    The first thing to do is to establish the degree of precision that we want. We
    must evaluate if we are interested in one, two, or more decimal places. For example,
    if in our range [0 200] we are interested in working with numbers like 199.3 or
    in numbers like 199.15.


    To communicate with these numbers, we also have two basic options.


    The first is to separate the integer part from the fractional part and send them
    as two different numbers. In the example of the number 199.15, a 199 will be sent
    separately and then a 15\. The problem with this approach is that one of the two
    numbers could get lost on the way.


    The other option is to apply a scaling. In this way, if we are only interested
    in one decimal place, it would be enough that we multiply our initial range by
    10, so using the given examples, 199.3 would become 1993 and 199.15 would become
    1991\. Instead, if we want two decimal places, the factor would be 100, sending
    19930 and 19915, respectively. In this way, a scaled number is sent. For this
    purpose, it is required that both the receiver and the emitter know the scale
    factor. Obtaining a high level of precision with this approach is a problem because
    quite possibly the number to send must be divided into two parts or more. The
    application is simple. For example, if we want two decimal places, instead of
    mapping from [-1000 1000] to [0 200], we should do it from [-1000 1000] to [0
    20000].


    Note that almost any operation can be done in the sender and the receiver, including
    floating or double operations. But the data transmission is exclusively for positive
    integer values. For this reason we must make the aforementioned adjustments (there
    are development interfaces like Arduino that include functions that automatically
    make these conversions; for this reason, it seems that they support not only positive
    integers).


    Finally, to answer the remaining question about how the communication is guaranteed,
    we will indicate how the components of the UART communication are implemented.


    The basis for this procedure is to understand the binary operations that are equivalent
    to those previously presented (modulo and quotient) and some other binary check
    operations. This is because it is convenient to simplify the data processing tasks
    at the computer in a language that the processor knows. These operations are sending,
    receiving, checking, and communication agreement.


    ### UART Sending


    The starting point is this equation:


    ![../images/504209_1_En_5_Chapter/504209_1_En_5_Figg_HTML.jpg](images/504209_1_En_5_Chapter/504209_1_En_5_Figg_HTML.jpg)


    In decimal format, the operations to get the modulo and the quotient are obtained
    from the division, as indicated in Figure [5-7](#504209_1_En_5_Chapter.xhtml#Fig7).


    ![../images/504209_1_En_5_Chapter/504209_1_En_5_Fig7_HTML.jpg](images/504209_1_En_5_Chapter/504209_1_En_5_Fig7_HTML.jpg)


    Figure 5-7


    Quotient and modulo of a decimal base number


    In binary format, the quotient can be obtained from the non-cyclic right shift
    operation (replacing the shifted numbers with zeros). This is applied to the last
    8 bits of the binary equivalent of the number to be partitioned . This operation
    is represented as >> 8 in C ++ as a reference for other programming languages.
    On the other hand, the module is obtained with the AND operation applied with
    255 or 1111 1111 in binary base. This is represented as & in C ++ as a reference
    for other programming languages.


    Using the same example:


    7515=1110101011011(bin)


    11101 0101 1011(bin) >>8 = 0000 0000 11101(bin) = 29(dec)


    On the other hand:


    11101 0101 1011 (bin)


    & 00000 1111 1111 (bin)


    = 00000 0101 1011 (bin) = 91 (dec)


    In this way, the number (7515 in this case) is sent as two groups of 8 bits:


    0101 1011 (bin) = 91 (dec)


    0001 1101(bin) = 29(dec)


    Of course, before sending these numbers, they were obtained with the operations
    described previously (>>8 and & 1111 1111).


    ### UART Receiving


    Receiving consists of applying the following equation:


    ![../images/504209_1_En_5_Chapter/504209_1_En_5_Figh_HTML.jpg](images/504209_1_En_5_Chapter/504209_1_En_5_Figh_HTML.jpg)


    Directly in some programming languages or by using the following binary equivalent:
    8-bit non-cyclic left shift, and the OR operations (<< 8 and | in C ++):


    Binary value = Binary Quotient part << 8 | Binary Module part


    Using the previous example:


    0001 1101(bin) = 29 (dec) << 8 = 0000 11101 0000 0000 = 7424 (dec)


    Having this result, we continue with the OR operation. Note that there are more
    than 8 bits, but remember that this is processed by the receiving computer once
    the data is received. This is not the case for the communication channel that
    requires 8-bit messages.


    11101 0000 0000


    | 00000 0101 1011 (bin) = 91 (dec)


    = 11101 0101 1011(bin) = 7515(dec)


    The reading and writing processes are summarized in Figure [5-8](#504209_1_En_5_Chapter.xhtml#Fig8).


    ![../images/504209_1_En_5_Chapter/504209_1_En_5_Fig8_HTML.jpg](images/504209_1_En_5_Chapter/504209_1_En_5_Fig8_HTML.jpg)


    Figure 5-8


    UART reading and writing processes sumarized


    Now you know how to send and receive information. However, how do you verify the
    data? And how do you know if you are able to communicate? This is answered with
    the following operations.'
