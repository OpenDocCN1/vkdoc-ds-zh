    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figbj_HTML.jpg](img/504209_1_En_2_Figbj_HTML.jpg)


    它被简化如下：


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figbk_HTML.jpg](img/504209_1_En_2_Figbk_HTML.jpg)


    这里为了方便，对这些小角度使用了以下近似：


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figbl_HTML.jpg](img/504209_1_En_2_Figbl_HTML.jpg)


    这是因为这里期望的是消除项，而不是保留它们以便进一步分析。


    回到在飞行器坐标系中推导出的旋转动力学模型，我们执行以下操作将其转换到固定坐标系：


