    \ a Delaware corporation.\n\n# Foreword\n\nThis book can be considered as one\
    \ of the most complete courses on drones and specifically on multicopters with\
    \ special attention and focus on quadcopters. It is aimed at an audience ranging\
    \ from makers to scientists. It contains the necessary elements of design, modeling,\
    \ control, simulation, and programming, explained in a concise but extended way,\
    \ especially in points that many texts ignore. Additionally, it merges maker knowledge\
