  trans: '

    # 带偏航变化的完全线性笛卡尔控制


    这种控制器是前一种控制器的改进版本。现在无人机能够跟踪轨迹，并且可以修改其偏航角；见图 3-9。该操作对于记录路径内的物体、人物或建筑物非常有用，例如在监控任务中。


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Fig9_HTML.jpg](img/504209_1_En_3_Fig9_HTML.jpg)


    *图 3-9* – 带偏航变化的完全线性笛卡尔控制的图形表示


    在这种飞行模式下，推力和扭矩控制与上一节相同：


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figaq_HTML.jpg](img/504209_1_En_3_Figaq_HTML.jpg)


    变化的是期望的 `theta` 和 `phi` 辅助控制器的设计，具体如下。


    由于 `psi` 的值不为零，`XY` 动态系统无法简化：


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figar_HTML.jpg](img/504209_1_En_3_Figar_HTML.jpg)


    但你可以将它们重写为如下的矩阵形式：


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figas_HTML.jpg](img/504209_1_En_3_Figas_HTML.jpg)


    根据滚转和俯仰控制器，请记住：


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figat_HTML.jpg](img/504209_1_En_3_Figat_HTML.jpg)


    可以提出以下辅助控制器：


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figau_HTML.jpg](img/504209_1_En_3_Figau_HTML.jpg)


    将辅助控制器代入给定的动态模型：


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figav_HTML.jpg](img/504209_1_En_3_Figav_HTML.jpg)


    简化后：


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figaw_HTML.jpg](img/504209_1_En_3_Figaw_HTML.jpg)


    这表明：


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figax_HTML.jpg](img/504209_1_En_3_Figax_HTML.jpg)


    将所提出的矩阵形式重写为等效但可编程的形式（这可以避免计算机进行大量矩阵乘法运算），我们得到了无人机研究中一个已知的方程：


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figay_HTML.jpg](img/504209_1_En_3_Figay_HTML.jpg)


    最后，注意依赖于 `psi_desired` 的矩阵是一个旋转矩阵（这对于下一节中几何控制的解读将非常有用）。


    有两种方法可以验证这是一个旋转矩阵：


    1. **通过变换将该矩阵转化为已知的旋转矩阵：**


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figaz_HTML.jpg](img/504209_1_En_3_Figaz_HTML.jpg)


    2. **利用本书先前使用过的旋转矩阵的一个性质：**


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figba_HTML.jpg](img/504209_1_En_3_Figba_HTML.jpg)


    总之，本节提出的控制器如下所示（请参阅仿真部分以观察该控制器的性能）：


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figbb_HTML.jpg](img/504209_1_En_3_Figbb_HTML.jpg)


    这些控制器的图形序列如图 3-10 所示。


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Fig10_HTML.jpg](img/504209_1_En_3_Fig10_HTML.jpg)


    *图 3-10* – 带偏航变化的完全线性笛卡尔控制的图形序列


    对于遥控变体，可以通过两种方式进行适配；见图 3-11。


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Fig11_HTML.jpg](img/504209_1_En_3_Fig11_HTML.jpg)


    *图 3-11* – 使用带偏航变化的完全线性笛卡尔控制时的遥控变体


    - 第一种方式是在滚转和俯仰的相应遥控控制中包含偏航动作（如同上一控制中通过偏航补偿那样）。这样，飞行器的手动操作行为将如图左半部分所示。

    - 第二种方式是不包含这种变化，飞行器的手动操作行为将如图右半部分所示。


    至此，你已经了解了机器人模式控制，该模式可实现平稳飞行。现在，是时候了解飞行器模式控制了，它允许更高的机动性以及特技或激烈运动。


    ## 飞行器模式控制


    当将无人机作为飞行器进行分析时，其控制设计意味着将其视为第一人称模式、机载体验或“驾驶舱”视角。见图 3-12。为此，飞机的视线方向（也称为引导向量，即机上飞行员所具有的向量）应通过“舵”或“推进器”进行调节。与机器人模式或第三人称模式不同，旋转与平移控制器及其动力学之间的耦合程度更大，甚至完全依赖。这在数学上是一个缺点，但对于激烈或特技操作而言，其在多功能性和实用性方面也代表了一种优势。


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Fig12_HTML.jpg](img/504209_1_En_3_Fig12_HTML.jpg)


    *图 3-12* – 飞行器模式控制的图形表示（第一人称视角）


    让我们从球面控制（基于舵）开始，然后是几何控制（基于推进器）。

    '
- fmt: '# Spherical Control (Rudders and Guide Vector)


    The following is a basic vehicle mode control. Note that this type of controller
    is widely used with wheeled robots. See Figure 3-13.


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Fig13_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Fig13_HTML.jpg)


    **Figure 3-13** Graphic representation of the spherical control


    In this type of control, it is convenient to change from the linear Cartesian
    space to one based on spherical coordinates, where the guide vector is associated
    with the resultant of the Cartesian components and the rudders are associated
    with the angular motion of said sphere. These angles are tangential projections
    of the Cartesian components.


    ## Step 1. Define the resultant (guide vector) and the rudder angles.


    Let’s remember that the dynamic model is given by


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figbc_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figbc_HTML.jpg)


    Notice that for our purposes, this model will not be simplified to the smooth
    flight conditions (linearization).


    From previous sections, note that there are six controllers: four of them are
    physical or force-torque commanded, and the remaining two are auxiliary or trajectory
    dependent:


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figbd_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figbd_HTML.jpg)


    In the case of this new design, the torque controllers in roll, pitch, and yaw
    will be left as in the preceding sections:


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figbe_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figbe_HTML.jpg)


    This implies that


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figbf_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figbf_HTML.jpg)


    The remaining three controllers to be defined:


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figbg_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figbg_HTML.jpg)


    Since the thrust force is related to a Cartesian vector, we are going to associate
    the guide vector to it. With regard to the auxiliary controllers of roll and pitch
    (which are needed to move the vehicle on the plane), we will associate them with
    the rudders that will determine the direction of the guide vector.


    ## Step 2. Find the value of the guide vector and the rudders.


    We rewrite the translational or dependent dynamic equations in terms of the controllers
    to be defined. Note that the only independent variable is `psi`:


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figbh_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figbh_HTML.jpg)


    As you can see, `FBZ`, as well as the desired values of `theta` and `phi`, are
    available through the entire system of equations (three unknowns and three equations).
    Notice also that the main objective of our controllers is that both the translational
    variables and their derivatives converge to their desired values. This is


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figbi_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figbi_HTML.jpg)


    Solving these equations for the desired rudders and guide vector is not simple.
    This way we proceed step by step by using projective and resultant relationships.
    Initially, it is convenient to obtain `FBZ` by using the scalar equivalent of
    these vector equations (the vector norm).


    The translational dynamic equations are rewritten in this way. Note that the rudders
    and guide vector variables were separated from the independent variable `psi`:


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figbj_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figbj_HTML.jpg)


    We solve for the rudders and the guide vector:


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figbk_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figbk_HTML.jpg)


    One way to get a scalar from a vector is with the dot product:


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figbl_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figbl_HTML.jpg)


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figbm_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figbm_HTML.jpg)


    Thus


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figbn_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figbn_HTML.jpg)


    Note that `FBZ` is a scalar that contains information from our guide vector (its
    distance).


    The rudders must be presented in arctangent mode (in order to be compatible with
    spherical coordinates). They are obtained from the following equations. Notice
    that the yaw angle is an independent rudder.


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figbo_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figbo_HTML.jpg)


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figbp_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figbp_HTML.jpg)


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figbq_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figbq_HTML.jpg)


    The form of these equations implies spherical coordinates expressed in the Cartesian
    framework where the radius is the guide vector magnitude `FBZ` and the spherical
    angles are determined by the rudders (roll, pitch, and yaw desired values).


    ## Step 3. Inject the controller.


    This is done by replacing the found values of the guide vector magnitude and the
    rudders in the original translational dynamics with the following trigonometric
    identities:


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figbr_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figbr_HTML.jpg)


    The following is obtained:


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figbs_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figbs_HTML.jpg)


    For example (this is a tedious but necessary example that can be developed with
    the help of a numerical computing program, like MATLAB),


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figbt_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figbt_HTML.jpg)


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figbv_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figbv_HTML.jpg)


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figbw_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figbw_HTML.jpg)


    Consequentially,


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figbx_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figbx_HTML.jpg)


    In the same way, the results for X and Y dynamics can be obtained.


    This implies that the following can be proposed:


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figby_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figby_HTML.jpg)


    with this


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figbz_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figbz_HTML.jpg)


    In practice and under the previously described smooth flight conditions, we can
    simply say that


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figca_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figca_HTML.jpg)


    In summary, the guide vector and rudders are injected as follows:


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figcb_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figcb_HTML.jpg)


    We say that this is a vehicle mode control, or a first person mode control, or
    an on-board mode control because this is how a pilot into the cockpit would behave.
    Additionally, this type of control has decades of use in wheeled robots.


    Figure 3-14 illustrates this controller seen as a scheme (remember that the controls
    proposed here can be any other than the PD, but the structure is the same in general).


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Fig14_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Fig14_HTML.jpg)


    **Figure 3-14** Graphic sequence of the spherical control


    The incorporation of a remote controller can be done as stated in the previous
    sections.


    You learned about the spherical control for drones. Now we will teach you one
    of the most powerful controllers available, the geometric one.'
  raw: '## Spherical Control (Rudders and Guide Vector)


    The following is a basic vehicle mode control. Note that this type of controller
    is widely used with wheeled robots. See Figure [3-13](#504209_1_En_3_Chapter.xhtml#Fig13).


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Fig13_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Fig13_HTML.jpg)


    Figure 3-13


    Graphic representation of the spherical control


    In this type of control, it is convenient to change from the linear Cartesian
    space to one based on spherical coordinates, where the guide vector is associated
    with the resultant of the Cartesian components and the rudders are associated
    with the angular motion of said sphere. These angles are tangential projections
    of the Cartesian components.


    Step 1\. Define the resultant (guide vector) and the rudder angles.


    Let’s remember that the dynamic model is given by


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figbc_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figbc_HTML.jpg)


    Notice that for our purposes, this model will not be simplified to the smooth
    flight conditions (linearization).


    From previous sections, note that there are six controllers: four of them are
    physical or force-torque commanded, and the remaining two are auxiliary or trajectory
    dependent:


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figbd_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figbd_HTML.jpg).


    In the case of this new design, the torque controllers in roll, pitch, and yaw
    will be left as in the preceding sections:


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figbe_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figbe_HTML.jpg)


    This implies that


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figbf_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figbf_HTML.jpg)


    The remaining three controllers to be defined:


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figbg_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figbg_HTML.jpg)


    Since the thrust force is related to a Cartesian vector, we are going to associate
    the guide vector to it. With regard to the auxiliary controllers of roll and pitch
    (which are needed to move the vehicle on the plane), we will associate them with
    the rudders that will determine the direction of the guide vector.


    Step 2\. Find the value of the guide vector and the rudders.


    We rewrite the translational or dependent dynamic equations in terms of the controllers
    to be defined. Note that the only independent variable is psi:


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figbh_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figbh_HTML.jpg)


    As you can see, FBZ, as well as the desired values of theta and phi, are available
    through the entire system of equations (three unknowns and three equations). Notice
    also that the main objective of our controllers is that both the translational
    variables and their derivatives converge to their desired values. This is


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figbi_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figbi_HTML.jpg)


    Solving these equations for the desired rudders and guide vector is not simple.
    This way we proceed step by step by using projective and resultant relationships.
    Initially, it is convenient to obtain FBZ by using the scalar equivalent of these
    vector equations (the vector norm).


    The translational dynamic equations are rewritten in this way. Note that the rudders
    and guide vector variables were separated from the independent variable psi:


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figbj_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figbj_HTML.jpg)


    We solve for the rudders and the guide vector:


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figbk_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figbk_HTML.jpg)


    One way to get a scalar from a vector is with the dot product:


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figbl_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figbl_HTML.jpg)


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figbm_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figbm_HTML.jpg)


    Thus


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figbn_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figbn_HTML.jpg)


    Note that FBZ is a scalar that contains information from our guide vector (its
    distance).


    The rudders must be presented in arctangent mode (in order to be compatible with
    spherical coordinates). They are obtained from the following equations. Notice
    that the yaw angle is an independent rudder.


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figbo_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figbo_HTML.jpg)


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figbp_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figbp_HTML.jpg)


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figbq_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figbq_HTML.jpg)


    The form of these equations implies spherical coordinates expressed in the Cartesian
    framework where the radius is the guide vector magnitude FBZ and the spherical
    angles are determined by the rudders (roll, pitch, and yaw desired values).


    Step 3\. Inject the controller.


    This is done by replacing the found values of the guide vector magnitude and the
    rudders in the original translational dynamics with the following trigonometric
    identities:


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figbr_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figbr_HTML.jpg)


    The following is obtained:


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figbs_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figbs_HTML.jpg)


    For example (this is a tedious but necessary example that can be developed with
    the help of a numerical computing program, like MATLAB),


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figbt_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figbt_HTML.jpg)


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figbv_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figbv_HTML.jpg)


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figbw_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figbw_HTML.jpg)


    Consequentially,


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figbx_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figbx_HTML.jpg)


    In the same way, the results for X and Y dynamics can be obtained.


    This implies that the following can be proposed:


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figby_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figby_HTML.jpg)


    with this


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figbz_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figbz_HTML.jpg)


    In practice and under the previously described smooth flight conditions, we can
    simply say that


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figca_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figca_HTML.jpg)


    In summary, the guide vector and rudders are injected as follows:


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figcb_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figcb_HTML.jpg)


    We say that this is a vehicle mode control, or a first person mode control, or
    an on-board mode control because this is how a pilot into the cockpit would behave.
    Additionally, this type of control has decades of use in wheeled robots.


    Figure [3-14](#504209_1_En_3_Chapter.xhtml#Fig14) illustrates this controller
    seen as a scheme (remember that the controls proposed here can be any other than
    the PD, but the structure is the same in general).


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Fig14_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Fig14_HTML.jpg)


    Figure 3-14


    Graphic sequence of the spherical control


    The incorporation of a remote controller can be done as stated in the previous
    sections.


    You learned about the spherical control for drones. Now we will teach you one
    of the most powerful controllers available, the geometric one.'
  trans: '

    # 球面控制（方向舵与引导向量）


    以下是一种基本的运载器模式控制方法。请注意，这类控制器广泛用于轮式机器人。参见图 3-13。


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Fig13_HTML.jpg](img/504209_1_En_3_Fig13_HTML.jpg)


    **图 3-13** 球面控制的图形表示


    在这类控制中，从线性笛卡尔空间转换到基于球面坐标的空间是很方便的，其中引导向量与笛卡尔分量的合向量相关联，而方向舵则与该球体的角运动相关联。这些角度是笛卡尔分量的切向投影。


    ## 第一步：定义合向量（引导向量）和方向舵角。


    我们需记住，动力学模型由下式给出：


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figbc_HTML.jpg](img/504209_1_En_3_Figbc_HTML.jpg)


    请注意，出于我们的目的，此模型不会简化为平滑飞行条件（线性化）。


    从前面的章节可以注意到，这里有六个控制器：其中四个是物理的或力/力矩指令型，剩余两个是辅助的或与轨迹相关的：


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figbd_HTML.jpg](img/504209_1_En_3_Figbd_HTML.jpg)


    对于这个新设计，滚转、俯仰和偏航方向的力矩控制器将保持与前几节相同：


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figbe_HTML.jpg](img/504209_1_En_3_Figbe_HTML.jpg)


    这意味着：


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figbf_HTML.jpg](img/504209_1_En_3_Figbf_HTML.jpg)


    需要定义剩下的三个控制器：


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figbg_HTML.jpg](img/504209_1_En_3_Figbg_HTML.jpg)


    由于推力与笛卡尔向量相关，我们将其与引导向量关联。至于滚转和俯仰的辅助控制器（用于在平面上移动运载器），我们将它们与决定引导向量方向的方向舵相关联。


    ## 第二步：求引导向量和方向舵的值。


    我们根据待定义的控制器重写平移或依赖的动力学方程。注意，唯一的独立变量是`psi`：


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figbh_HTML.jpg](img/504209_1_En_3_Figbh_HTML.jpg)


    如你所见，`FBZ`以及`theta`和`phi`的期望值，可以通过整个方程组（三个未知数和三个方程）得到。还需注意，我们控制器的主要目标是使平移变量及其导数都收敛到它们的期望值。即：


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figbi_HTML.jpg](img/504209_1_En_3_Figbi_HTML.jpg)


    求解这些方程以得到期望的方向舵和引导向量并不简单。因此，我们通过使用投影和合向量关系逐步进行。首先，用这些向量方程的标量等价形式（向量范数）来求解`FBZ`是比较方便的。


    平移动力学方程按此方式重写。注意，方向舵和引导向量变量已从独立变量`psi`中分离出来：


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figbj_HTML.jpg](img/504209_1_En_3_Figbj_HTML.jpg)


    我们求解方向舵和引导向量：


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figbk_HTML.jpg](img/504209_1_En_3_Figbk_HTML.jpg)


    从向量获取标量的一种方法是使用点积：


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figbl_HTML.jpg](img/504209_1_En_3_Figbl_HTML.jpg)


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figbm_HTML.jpg](img/504209_1_En_3_Figbm_HTML.jpg)


    因此：


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figbn_HTML.jpg](img/504209_1_En_3_Figbn_HTML.jpg)


    注意，`FBZ`是一个标量，它包含了来自我们引导向量的信息（它的距离）。


    方向舵必须以反正切模式呈现（以便与球面坐标兼容）。它们由以下方程求得。注意，偏航角是一个独立的方向舵。


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figbo_HTML.jpg](img/504209_1_En_3_Figbo_HTML.jpg)


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figbp_HTML.jpg](img/504209_1_En_3_Figbp_HTML.jpg)


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figbq_HTML.jpg](img/504209_1_En_3_Figbq_HTML.jpg)


    这些方程的形式蕴含了在笛卡尔坐标系中表达的球面坐标，其中半径是引导向量的大小`FBZ`，球面角由方向舵（滚转、俯仰和偏航的期望值）决定。


    ## 第三步：注入控制器。


    通过用以下三角恒等式替换原始平移动力学中找到的引导向量大小和方向舵的值来实现：


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figbr_HTML.jpg](img/504209_1_En_3_Figbr_HTML.jpg)


    得到如下结果：


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figbs_HTML.jpg](img/504209_1_En_3_Figbs_HTML.jpg)


    例如（这是一个繁琐但必要的示例，可借助数值计算程序如 MATLAB 来展开）：


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figbt_HTML.jpg](img/504209_1_En_3_Figbt_HTML.jpg)


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figbv_HTML.jpg](img/504209_1_En_3_Figbv_HTML.jpg)


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figbw_HTML.jpg](img/504209_1_En_3_Figbw_HTML.jpg)


    因此：


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figbx_HTML.jpg](img/504209_1_En_3_Figbx_HTML.jpg)


    同样地，可以得到 X 和 Y 方向动力学的结果。


    这意味着我们可以提出以下内容：


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figby_HTML.jpg](img/504209_1_En_3_Figby_HTML.jpg)


    由此得到：


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figbz_HTML.jpg](img/504209_1_En_3_Figbz_HTML.jpg)


    在实际应用中，并且在前面描述的平滑飞行条件下，我们可以简单地说：


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figca_HTML.jpg](img/504209_1_En_3_Figca_HTML.jpg)


    总结来说，引导向量和方向舵按如下方式注入：


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figcb_HTML.jpg](img/504209_1_En_3_Figcb_HTML.jpg)


    我们称此为运载器模式控制、第一人称模式控制或机载模式控制，因为这是驾驶舱内飞行员的行为方式。此外，这种类型的控制已在轮式机器人中使用了几十年。


    图 3-14 以示意图的形式展示了这种控制器（请记住，这里提出的控制方法可以是 PD 以外的任何方法，但总体结构是相同的）。


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Fig14_HTML.jpg](img/504209_1_En_3_Fig14_HTML.jpg)


    **图 3-14** 球面控制的图形流程


    如前面章节所述，可以集成遥控器。


    你已经了解了无人机的球面控制。现在我们将教你一种最强大的控制器——几何控制。

    '
- fmt: '# Introduction to Geometric Control for Drones (Thrusters and Guide Vector)


    The previous case was based on trigonometric considerations. A more advanced controller
    based on rotation-matrix theory is explained in this section.


    This time, the vehicle will not have a guide vector and three rudders (as in the
    previous case, `psi` counted as an independent rudder, and also `phi` and `theta`).
    In the case in this section, the vehicle will have a guide vector and three thrusters;
    see Figure [3-15](#504209_1_En_3_Chapter.xhtml#Fig15). Imagine that we changed
    the onboard “steering wheels” or “rudders“ by commands that activate a kind of
    forward-backward, up-down, and left-right “thrusters.” This is also widely used
    in robotics and is associated with **noa** vectors for correcting or describing
    the orientation of a body by means of three orthogonal vectors; two of them are
    designable and only one is independent on the others.


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Fig15_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Fig15_HTML.jpg)


    Figure 3-15


    Graphic representation of the geometric control


    Notice that the **noa** vectors have these names because of their use in robotics
    of manipulators, and specifically in a gripper or robotic hand, where **a** is
    a unit vector that represents the gripper approach, **n** is a normal vector with
    respect to **a**, and **o** is also a normal vector to **a** and **n**, which
    is used to orientate the gripper. See Figure [3-16](#504209_1_En_3_Chapter.xhtml#Fig16).


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Fig16_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Fig16_HTML.jpg)


