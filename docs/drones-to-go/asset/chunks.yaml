  trans: '

    # 总结


    在本章中，你学习了无人机的各项任务，以及使用它所必需的基本信号处理类型。所阐述的信号处理包括：信号滤波、信号饱和、信号映射、数据转换，以及冗余与奇异性的归一化。所有这些方法均可应用于传感器、执行器，以及通信或控制阶段。针对通信任务，你了解了高级
    UART 的常见组成部分。最后，你学习了编程无人机的四种方法，并掌握了基于三种最常用 SDK 的无人机命令主题列表。


    至此，我们已完成本书的主题内容，但我们建议你继续阅读附录。附录包含与无人机相关的主题，例如其最大功率与速度极限的估算、滑模控制、微分平坦性、线性控制简介、表示飞行器朝向的几种替代方法，以及如何将本书所述主题扩展应用于除四旋翼之外的其他类型飞行器。

    '
