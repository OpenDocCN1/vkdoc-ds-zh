    # 螺旋桨受力分析


    下一步是分析单个螺旋桨的受力情况。请注意，此分析针对双叶螺旋桨进行，但可通过相应的三角函数投影推广至更多桨叶的情况。


    首先考虑的是，每片桨叶上的推力可等效为作用于该桨叶某一点上的力。在图 2-8 中，这些力分别标注为 `FL`（即左侧）和 `FR`（即右侧）。其次要假定螺旋桨已完全平衡，这意味着螺旋桨中心到每片桨叶分析点的距离相同（即半径
    `r`）。


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Fig8_HTML.jpg](img/504209_1_En_2_Fig8_HTML.jpg)


    图 2-8

    作用于螺旋桨桨叶的力及其力臂


    此外，我们将采用图 2-9 所示的螺旋桨坐标系。


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Fig9_HTML.jpg](img/504209_1_En_2_Fig9_HTML.jpg)


    图 2-9

    用于分析的螺旋桨坐标系


    下一步，将每片桨叶上的力分解为垂直和水平分量（分别标注为 `Z` 和 `H`）。请参见图 2-10。


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Fig10_HTML.jpg](img/504209_1_En_2_Fig10_HTML.jpg)


    图 2-10

    作用于每片桨叶的力的分量


    接下来，我们将计算三个相应轴（`X`、`Y`、`Z`）上的合力与合力矩。由于假定每片桨叶具有对称性和平衡性，可建立以下等式：


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figr_HTML.jpg](img/504209_1_En_2_Figr_HTML.jpg)


    从上图可知，垂直方向的受力分析较为简单。请注意，增加桨叶数量会增加飞行器的负载能力（正如预期，每片桨叶都充当一个支撑轴）。


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figs_HTML.jpg](img/504209_1_En_2_Figs_HTML.jpg)


    在 `X`、`Y` 轴上的分析是相同的，为此我们将利用螺旋桨的径向对称性（对奇数桨叶的分析会变得非常有趣，因为需要用到三角函数投影，但最终结果必须一致）。


    假设此时螺旋桨位于 `X` 轴或 `Y` 轴上，如图 2-11 所示。


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Fig11_HTML.jpg](img/504209_1_En_2_Fig11_HTML.jpg)


    图 2-11

    作用于每片桨叶的力之俯视图。`Z` 轴指向读者


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figt_HTML.jpg](img/504209_1_En_2_Figt_HTML.jpg)


    因此，这表明只要螺旋桨充分平衡，每片桨叶产生的水平力将会相互抵消。但是，正如你所注意到的，还存在作用力臂以及由此产生的力矩。下面将对此进行分析。


    让我们回到上图，并补充说明 `Z` 轴指向读者，那么绕该轴的力矩如图 2-12 所示。


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Fig12_HTML.jpg](img/504209_1_En_2_Fig12_HTML.jpg)


    图 2-12

    用于分析等效力矩的作用于每片桨叶的力之俯视图。`Z` 轴指向读者


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figu_HTML.jpg](img/504209_1_En_2_Figu_HTML.jpg)


    请注意，增加桨叶数量也会增加螺旋桨的力矩容量（每片桨叶都充当一个力臂）。


    最后，我们将确定水平方向的力矩（绕 `X` 轴或 `Y` 轴；二者无区别）。请参见图 2-13。


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Fig13_HTML.jpg](img/504209_1_En_2_Fig13_HTML.jpg)


    图 2-13

    用于分析水平力矩的作用于每片桨叶的力之侧视图。`Y` 轴或 `X` 轴指向读者


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figv_HTML.jpg](img/504209_1_En_2_Figv_HTML.jpg)


    上述分析最重要的结论如下。只要螺旋桨充分平衡，它仅能在其作用轴上产生一个垂直推力，并绕该轴产生一个力矩。请参见图 2-14。


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Fig14_HTML.jpg](img/504209_1_En_2_Fig14_HTML.jpg)


    图 2-14

    螺旋桨相对于其中心的等效力和力矩


    一个有趣的练习题供你思考：请推导出对三片桨叶（每片间隔 120 度）的螺旋桨产生相同效果。最终结果必须一致。

