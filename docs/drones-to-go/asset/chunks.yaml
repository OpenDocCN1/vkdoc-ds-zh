    Finally, observe that the (p q r) nomenclature was introduced. This is frequently
    used with aircraft and of course multicopters.


    Now that you have the kinematics of the drone, it’s time to look at the dynamics,
    but before that, we provide you with a brief on the forces acting on a drone and
    its propellers.


    ## Forces Acting on a Multicopter and Its Propellers


    Before developing the dynamic equations, it is convenient to deduce the basic
    forces that act on a multicopter. Aerodynamic effects could be added, but since
    they vary between outdoor and indoor operations, even at near or far distances
    from the ground, they are considered as non-generic material that can be consulted
    in other works or briefly in the Appendix (see drone maximum velocities).


    The most obvious force acting on a drone is gravity. Let’s consider that the vehicle
    is well balanced, and that said force is located directly at the center of gravity
    or the center of geometry, which for this kind of vehicle is desirable to coincide.
    See Figure [2-7](#504209_1_En_2_Chapter.xhtml#Fig7).


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Fig7_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Fig7_HTML.jpg)


    Figure 2-7


    Gravity force actuating on a drone'
