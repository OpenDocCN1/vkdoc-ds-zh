    This derivative is negative semidefined and depends totally or partially on the
    states of our interest. (In this case, it does not depend on the error but on
    its derivative. Soon we will see how to deal with this problem.)


    If for the first order system we had proposed


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figes_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figes_HTML.jpg)


    the derivative of the Lyapunov function would not alter its negativity, nor the
    Lyapunov function its positivity while the constant Kp was positive. You will
    remember this fact soon.


    Note that we can only say that the states with respect to which the Lyapunov derivative
    depends tend to the behavior of the minimum energy of the Lyapunov function; that
    is, they tend to 0\. If the rest of the states do not appear, we cannot ensure
    anything about them, and we must design and try a new Lyapunov function.


    Step 3


    By using auxiliary postulates, known as Barbalat’s lemma or Lasalle’s principle
    (they are used according to the type of system you have, so you must investigate
    them), it must be evaluated when V and its derivatives are zero if the states
    of the system also tend to zero. This is because local valleys may occur, as in
    Figure [3-23](#504209_1_En_3_Chapter.xhtml#Fig23). In these valleys, the energy
    value is zero, but the system will not reach the minimum value of the Lyapunov
    function, but a local trap.


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Fig23_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Fig23_HTML.jpg)


    Figure 3-23


    Local and global minimal values at a Lyapunov function


