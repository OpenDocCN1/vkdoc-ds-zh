    ## Simulation Alternatives with the Simulink and MATLAB environment


    In this section, alternative simulation methods for using MATLAB/Simulink are
    presented. For this purpose and in order to make the procedures understandable
    and compact, the general solution of a mass spring damper system will be simulated
    (with an input force equal to zero and with non-zero initial conditions, this
    system should return to zero). Note that this is the closed-loop behavior of a
    PD controller with acceleration compensation as previously seen or a PID. Based
    on these examples, you can modify them as you wish in order to simulate a quadcopter
    or any other system or aircraft.


    The concrete system to be exemplified in this section is the following:


    ![../images/504209_1_En_4_Chapter/504209_1_En_4_Figp_HTML.jpg](images/504209_1_En_4_Chapter/504209_1_En_4_Figp_HTML.jpg)


    with the initial conditions given by


    ![../images/504209_1_En_4_Chapter/504209_1_En_4_Figq_HTML.jpg](images/504209_1_En_4_Chapter/504209_1_En_4_Figq_HTML.jpg)


    There are more ways to simulate a system with MATLAB and Simulink, but these are
    the five that we consider the most useful.


    ### Blocks and Interpreted MATLAB Functions


    This is the case already seen in all the previous simulations but this time with
    the aforementioned reduced system so you can compare it with other available techniques.
    This is the one that we recommend given its practicality and the ease of use.
    In general, this method is the most compatible with other Simulink blocks and
    MATLAB functions in an intuitive and not so laborious way compared with the others
    that will be presented later.


    Figure [4-41](#504209_1_En_4_Chapter.xhtml#Fig41) illustrates the block file called
    `msdmatBlockSim.slx`. Observe that we include two blocks that facilitate the interconnection
    in terms of spacing and aesthetics (the `Goto` and `From` tags). Without them,
    the user would simply make direct and entangled connections.


    ![../images/504209_1_En_4_Chapter/504209_1_En_4_Fig41_HTML.jpg](images/504209_1_En_4_Chapter/504209_1_En_4_Fig41_HTML.jpg)


    **Figure 4-41** Mass spring damper simulation by using blocks and interpreted
    MATLAB functions


    The dynamics and control code (in this case, the control is zero) is in a file
    called `msdMatBlock.m`, which is displayed in Listing [4-7](#504209_1_En_4_Chapter.xhtml#PC7).


    ```

    function outp=msdMatBlock(X)

    % as you know you can modify the following dynamics with the dynamics

    % and control that you want, for example a quadcopter

    x1=X(1);

    x2=X(2);

    B=0.5;

    K=0.5;

    M=0.7;

    x1d=x2;

    x2d=(1/M)*((-B*x2)-(K*x1));

    outp=[x1d;x2d];

    end

    Listing 4-7

    Code for Using the Blocks and Interpreted MATLAB Functions Method

    ```


    ### Only Blocks


    Figure [4-42](#504209_1_En_4_Chapter.xhtml#Fig42) also illustrates the previous
    case but by only using a file of blocks. In this example, it is called `msdBlock.slx`.


    ![../images/504209_1_En_4_Chapter/504209_1_En_4_Fig42_HTML.jpg](images/504209_1_En_4_Chapter/504209_1_En_4_Fig42_HTML.jpg)


    **Figure 4-42** Mass spring damper simulation by using only blocks


    This type of simulation is still useful because there are some hardware devices
    that are linked with Simulink and for some reason they do not allow interaction
    with user-defined functions. The biggest disadvantage of this technique, as already
    indicated, is that in a larger system, the blocks also become numerous in quantity.
    Remember that each equation requires blocks for all its symbols and operators
    (sums, products, exponents, matrices, etc.). When you have more equations, it
    is convenient that you read about the use of subsystems, and especially on how
    to create a subsystem from Selection. You can find this information in the following
    link:


    [`www.mathworks.com/help/simulink/ug/creating-subsystems.html`](http://www.mathworks.com/help/simulink/ug/creating-subsystems.html)


    ### Blocks and S-Functions


    An S-Function can be considered an evolution of the interpreted MATLAB function,
    which contains the differential dynamics in the text file (it does not require
    the use of an integrator; it only needs feedback). It has several advantages,
    such as the possibility of being used with hardware and software external to MATLAB
    and Simulink. The biggest problem that exists with these functions is related
    to the time management. In the example presented below, the Simulation is useful
    with variable-step ODE solvers but not with fixed-step ODE solvers (the most demanding
    task when working with S-Functions is that you must be careful with the compatibility
    of the simulation times).


    Figure [4-43](#504209_1_En_4_Chapter.xhtml#Fig43) shows the block file called
    `msdSfuncBlock.slx`.


    ![../images/504209_1_En_4_Chapter/504209_1_En_4_Fig43_HTML.jpg](images/504209_1_En_4_Chapter/504209_1_En_4_Fig43_HTML.jpg)


    **Figure 4-43** Mass spring damper simulation by using blocks and S-Functions


    Listing [4-8](#504209_1_En_4_Chapter.xhtml#PC8) is the corresponding text file
    called `msdSfunc.m`. Its description is reserved for you to investigate, since
    as indicated, they are not so intuitive and they have a variety of configurations.
    You can start your research on this topic with the book about sliding mode control
    by Jinkun Liu indicated in the Appendix. In this book, there are a lot of examples
    that use the S-Function approach.


    ```

    function [sys,x0,str,ts]=msdSfunc(t,x,u,flag)

    switch flag,

    case 0,

    [sys,x0,str,ts]=mdlInitializeSizes;

    case 1,

    sys=mdlDerivatives(t,x,u);

    case 3,

    sys=mdlOutputs(t,x,u);

    case {2, 4, 9 }

    sys = [];

    otherwise

    error([''Unhandled flag = '',num2str(flag)]);

    end

    function [sys,x0,str,ts]=mdlInitializeSizes

    sizes = simsizes;

    sizes.NumContStates  = 2;

    sizes.NumDiscStates  = 0;

    sizes.NumOutputs     = 2;

    sizes.NumInputs      = 2;

    sizes.DirFeedthrough = 0;

    sizes.NumSampleTimes = 0;

    sys=simsizes(sizes);

    x0=[5 0];

    str=[];

    ts=[];

    function sys=mdlDerivatives(t,x,u)

    B=0.5;

    K=0.5;

    M=0.7;

    sys(1)=x(2);

    sys(2)=(1/M)*((-B*x(2))-(K*x(1)));

    function sys=mdlOutputs(t,x,u)

    sys(1)=x(1);

    sys(2)=x(2);

    Listing 4-8

    Code for Using the Blocks and S- Functions Method

    ```'
