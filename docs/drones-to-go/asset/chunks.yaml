    About the Authors About the Technical Reviewer


    # 1. Drone Design Concepts


    In this chapter, you will find the most relevant information about what a drone
    is, including historical and social context. This chapter will cover international
    standards, some etymologies, and certain safety considerations that you should
    keep in mind while working with these aircraft. We’ll go through a description
    of generic components and their selection and connection. As a result, you will
    learn the technical details, international standards, and necessary requirements
    for the design of drones and other vehicles. Remember that this book is a crash
    course, so this chapter just provides a fast way for you to assimilate the contents.
    If you want to extend this knowledge, go to the guided reference appendix.'
