- fmt: '# 3. Control of Drones


    In this chapter with scientific impact, you will learn about four of the most
    employed drone controllers based on two classifications, one that visualizes the
    aircraft as a vehicle and the other as a robot. This chapter will also show you
    some control concepts and basic notions of Lyapunov’s theory of stability. Finally,
    a section on the trajectory planning is included. As a result, you will be able
    to understand and implement most of the drone controllers available, including
    the powerful geometric control. With this in mind, you can extend this knowledge
    to other types of vehicles and aircraft.


    Remember that in order to inject the controllers that we will study into the vehicle’s
    motors (and in general any other controller), you must do it by using the allocation
    or propulsion matrix calculated for your respective vehicles. The allocation matrix
    for the particular case that was analyzed in the previous chapter was


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figa_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figa_HTML.jpg)


    Thus, the objective of this chapter consists of learning the most generic methods
    to design the `FZB` force and the remaining three torques.


    Note also that this is valid if a SDK type 3 is used, as indicated in the section
    on the ways to program a drone in Chapter [5](#504209_1_En_5_Chapter.xhtml). In
    the case of using a SDK type 2, said force and torques will be injected directly
    into the vehicle without requiring the allocation matrix. Finally, in the case
    of using a SDK type 1 or a GUI, you will only be able to define trajectory profiles
    (you will not be able to design your own controllers; you can just modify preloaded
    controls gains and paths).


    You will see that a quadcopter, like any other unmanned vehicle, can be analyzed
    and viewed as a robot or as a vehicle, and in both cases the control may or may
    not be automatic.


    Before talking about these controllers, let’s talk about the useful zero concept.


    ## Useful Zero Concept


    The control objective is the introduction of useful zeros in order to develop
    a task.


    In control theory, it is usual to find three types of zero: the zero by definition,
    the zero by domination, and the zero by approximation. Do not confuse these concepts
    with those of poles and zeros of linear control theory.


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Fig1_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Fig1_HTML.jpg)


    **Figure 3-1** An example of zero by domination


    * The zero by definition is an ideal and a constant value to which it is intended
    to bring an error or estimation. It is also a static or dynamic balance that ensures
    a force or motion equilibrium.


    * The zero by domination is when a term within an equation is too large with respect
    to the other terms such that the equation simply behaves like the dominant term
    without giving importance to the effects of the rest of the terms. These nullified
    terms are considered as a zero by domination. This type of zero is very common
    in electrical and electronic circuit analysis and also in control theory. Figure
    [3-1](#504209_1_En_3_Chapter.xhtml#Fig1) shows a graph of a function in which
    the domination effect can be considered approximately equal to 4. Observe that
    the dominated sine component can be considered as a zero in proportion to the
    4.


    On the other hand, what here is called a useful zero is the one that is obtained
    by time behavior. Mathematically it will be any function that tends to zero as
    the time increases.


    A function widely used in control theory as a useful zero is the negative exponential.
    This useful zero can be observed behaving like a zero as the time evolves. Note
    the fact that there is no negative time. This is just plotted as an expanded view:


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figb_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figb_HTML.jpg)


    This function will always have the behavior shown in Figure [3-2](#504209_1_En_3_Chapter.xhtml#Fig2)
    as long as `B` has a positive value.


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Fig2_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Fig2_HTML.jpg)


    **Figure 3-2** An example of zero by approximation


    Note that a useful zero is a way to force something to become as a constant zero.
    This function is also the solution and behavior associated with this differential
    equation:


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figc_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figc_HTML.jpg)


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figd_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figd_HTML.jpg)


    Using Newton’s notation, it is equal to


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Fige_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Fige_HTML.jpg)


    In a more generic way, this family of differential equations always results in
    a decreasing exponential function, which tends to zero as long as `B` and `K`
    are positive values:


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figf_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figf_HTML.jpg)


    If we make the following variable changes, we obtain an equation known as PD controller:


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figg_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figg_HTML.jpg)


    which implies that the value `E` associated with the error to be controlled will
    tend to zero, and as `E` is defined like


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figh_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figh_HTML.jpg)


    In other words, the desired value minus the actual value of a variable, for example
    a position or an orientation:


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figi_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figi_HTML.jpg)


    The desired value will tend to be the real value and therefore we will have accomplished
    our task!


    We will use this useful zero concept and its PD application later.


    Keep in mind that the first-order differential equation, and consequently the
    PD, has a physical equivalent called a massless damped harmonic oscillator or
    a spring damper system. Therefore, the proportional term can be interpreted as
    an induced spring and the differential term as an induced damper; see Figure [3-3](#504209_1_En_3_Chapter.xhtml#Fig3).
    Said induced spring serves to pull the real system towards the desired value,
    and the induced damper serves to stop the real system at said value. If it were
    just the induced spring and not the induced damper, the real system would not
    stop and it would remain oscillating around the desired value (the zero value
    of the error).


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Fig3_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Fig3_HTML.jpg)


    **Figure 3-3** The physical analogy of a PD controller


    Another useful zero is the second order differential equation or mass spring damper
    system, also called a damped harmonic oscillator, as long as the terms `M`, `B`,
    and `K` are positive. The deduction is a little less intuitive and is a matter
    of linear control and differential equations books. However, for the purposes
    of this book and under the given conditions, we will just assume that this system
    is also a useful zero.


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figj_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figj_HTML.jpg)


    For control purposes, it is highlighted that the PID control behaves like said
    mass spring damper system (at least mathematically, since there are physical considerations
    during the implementation as the effect of using differentiators instead of integrators).


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figl_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figl_HTML.jpg)


    Having learned about the useful zero concept, let’s continue with the controllers.
    We will start with the robot mode controllers.'
