    Finally, the error vector that we are looking for is this:


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figdj_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figdj_HTML.jpg)


    To formulate our attitude control (also known as orientation control), in addition
    to the orientation error component (in this case given by rotation matrices, which
    serves to incorporate a proportional part), an angular velocity component is required
    (for incorporate a derivative part). This is done in the following way.


    A first attempt is to propose


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figdk_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figdk_HTML.jpg)


    Simple logic indicates that these angular velocities (the measured one and the
    reference one) are vectors, and what is explained in this equation could be directly
    applied:


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figdl_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figdl_HTML.jpg)


    However, the desired angular velocity and the measured one cannot be directly
    subtracted since they lie within different spaces. In this way, we will use a
    deduction based on the derivatives of the rotation matrix. See Figure [3-18](#504209_1_En_3_Chapter.xhtml#Fig18).


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Fig18_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Fig18_HTML.jpg)


    Figure 3-18


    Graphic representation of the spaces where the desired and real rotation matrices
    derivatives lie


    In a simplified way, we indicate that the speed of a rotation matrix is tangential
    to itself. Note that neither the rotation matrix nor its derivative are vectors
    but matrices, although we can use their eigenvectors in order to imagine and represent
    them graphically. A mathematical proof of the perpendicularity of the derivative
    of a rotation matrix with respect to its rotation matrix is given by the equation
    of the derivative of a rotation matrix in which appears a skew-symmetric matrix
    depending on the angular velocity, and because this antisymmetric matrix is the
    equivalent of a cross product, the result is an orthogonal matrix.


    From the fact that the desired rotation matrix does not lie within the same space
    as the measured rotation matrix, it is necessary to do the process shown in Figure
    [3-19](#504209_1_En_3_Chapter.xhtml#Fig19).


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Fig19_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Fig19_HTML.jpg)


    Figure 3-19


    Graphic sequence for homologating the rotation matrices derivatives


    The result of this graphic sequence produces the following equation:


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figdm_HTML.jpg](images/504209_1_En_3_Chapter/504209_1_En_3_Figdm_HTML.jpg)'
  trans: '好的，作为一名高级文档工程师和翻译员，我将遵循您的指示，将给定的英文文本翻译成中文，并严格遵守格式规范。


    ---



    执行以下操作（对旋转矩阵有效，并使用迹积性质）：


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figcx_HTML.jpg](img/504209_1_En_3_Figcx_HTML.jpg)


    得到：


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figcy_HTML.jpg](img/504209_1_En_3_Figcy_HTML.jpg)


    在这种情况下，由于我们有一个标量且需要设计一个三维姿态控制，我们需要一种方法从上述距离定义中获得一个三维向量。请记住，在定义了测量矩阵与期望矩阵之间的距离后，我们必须从中生成三个误差，以便生成飞行器的三个力矩。


    一种方法是应用方向导数的概念（这里我们将使用一种称为平凡化右导数的方向导数），并考虑到我们的距离是一个多变量的标量函数，当我们进行方向求导时，我们将得到一个向量表达式，其方式类似于我们对两个向量之间的距离应用梯度（`nabla`）时得到的结果。


    平凡化右导数广泛用于此类控制器，但鉴于其解释的复杂性，我们仅将其作为一种工具使用。更多信息，请参见附录中 Bullo 和 Taeyoung Lee 的文献。需要注意的是，此处使用`1/4`的值是为了方便，使得最终结果以`1/2`的形式表达，这对于非线性控制中通过矩阵性质或导数来消除常数值特别有用。但是，您可以使用任何其他乘数。结果只会改变在过程中需要携带的数值。


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figcz_HTML.jpg](img/504209_1_En_3_Figcz_HTML.jpg)


    观察三点：


    -   对于迹的情况，由于它是线性运算，所以迹的导数就是导数的迹。

    -   此外，我们利用了旋转矩阵的通用导数会产生旋转矩阵乘以一个反对称矩阵（`S`）这一事实。但是，请注意，所述反对称矩阵与第 2 章中描述的之前的反对称矩阵不同。这是因为之前的导数是关于时间的导数，而这是关于变化方向的导数。然而，会生成一个依赖于变化率（`n`）的反对称矩阵。

    -   最后，请注意单位矩阵的导数为零，剩余导数仅影响旋转矩阵的项，其中`Rd`被视为一个“常数”，因为它独立于`R`（此导数是关于`R`进行的）。


    总之，使用了以下性质：


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figda_HTML.jpg](img/504209_1_En_3_Figda_HTML.jpg)


    术语 `S(n)` 是一种表示，用于指示存在一个向量 `n`，它被转换为一个反对称矩阵，以便避免使用叉积，并允许使用矩阵乘积。


    从现在开始，我们将使用 `hat` 和 `vee` 符号。`S(n)` 的等价符号是 `hat` 算子，它意味着从向量获取一个反对称矩阵。


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figdb_HTML.jpg](img/504209_1_En_3_Figdb_HTML.jpg)


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figdc_HTML.jpg](img/504209_1_En_3_Figdc_HTML.jpg)


    仔细观察，你会发现我们还没有得到一个可以使用的向量，因为迹是一个标量，而且应用迹的乘积本身也是一个矩阵。


    然而，有三个有用的事实。


    第一个是存在以下恒等式：


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figdd_HTML.jpg](img/504209_1_En_3_Figdd_HTML.jpg)


    为此，我们使用 `vee` 算子，它是 `hat` 算子的逆，意味着从反对称矩阵获取向量：


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figde_HTML.jpg](img/504209_1_En_3_Figde_HTML.jpg)


    第二个是，以下矩阵以及一般的任何其他矩阵，都可以分解为一个反对称部分和一个对称部分，如下所示：


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figdf_HTML.jpg](img/504209_1_En_3_Figdf_HTML.jpg)


    这样：


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figdg_HTML.jpg](img/504209_1_En_3_Figdg_HTML.jpg)


    第三个事实是，对称矩阵与反对称矩阵乘积的迹为零，因此只有反对称矩阵乘积的迹能够保留：


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figdh_HTML.jpg](img/504209_1_En_3_Figdh_HTML.jpg)


    利用将两个反对称矩阵乘积的迹与它们等效的 `vee` 向量的点积联系起来的等式，我们得到：


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figdi_HTML.jpg](img/504209_1_En_3_Figdi_HTML.jpg)


    最后，我们寻找的误差向量就是这个：


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figdj_HTML.jpg](img/504209_1_En_3_Figdj_HTML.jpg)


    为了制定我们的姿态控制（也称为方向控制），除了方向误差分量（此处由旋转矩阵给出，用于引入比例部分）外，还需要一个角速度分量（用于引入微分部分）。这是通过以下方式完成的。


    第一个尝试是提出：


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figdk_HTML.jpg](img/504209_1_En_3_Figdk_HTML.jpg)


    简单的逻辑表明，这些角速度（测量值和参考值）是向量，并且可以直接应用该方程中解释的内容：


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figdl_HTML.jpg](img/504209_1_En_3_Figdl_HTML.jpg)


    然而，期望角速度和测量角速度不能直接相减，因为它们位于不同的空间中。因此，我们将使用基于旋转矩阵导数的推导。见图 3-18。


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Fig18_HTML.jpg](img/504209_1_En_3_Fig18_HTML.jpg)


    图 3-18 期望和实际旋转矩阵导数所在空间的图形表示。


    简化来说，我们指出旋转矩阵的速度与其自身相切。注意，旋转矩阵及其导数都不是向量，而是矩阵，尽管我们可以使用它们的特征向量来想象和图形化表示它们。旋转矩阵导数相对于其旋转矩阵的正交性的数学证明，由旋转矩阵的导数方程给出，该方程中出现了一个依赖于角速度的反对称矩阵，并且由于该反对称矩阵等价于叉积，因此结果是一个正交矩阵。


    由于期望旋转矩阵与实测旋转矩阵不在同一个空间中，因此需要进行图 3-19 所示的过程。


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Fig19_HTML.jpg](img/504209_1_En_3_Fig19_HTML.jpg)


    图 3-19 用于统一旋转矩阵导数的图形序列。


    该图形序列的结果产生以下方程：


    ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figdm_HTML.jpg](img/504209_1_En_3_Figdm_HTML.jpg)

