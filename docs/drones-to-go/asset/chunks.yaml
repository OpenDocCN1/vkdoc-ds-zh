    As indicated, to solve a differential equation, it is required to have a solver
    or method to solve it, along with the file that contains the model or differential
    equations associated with that model.


    When using the proposed Simulink method, both files must be in the same folder,
    as indicated in Figure [4-23](#504209_1_En_4_Chapter.xhtml#Fig23).


    ![../images/504209_1_En_4_Chapter/504209_1_En_4_Fig23_HTML.jpg](images/504209_1_En_4_Chapter/504209_1_En_4_Fig23_HTML.jpg)


    Figure 4-23


    Files location for their execution


    If the `blockquad.slx` file does not exist, click the Simulink library icon and
    create this file, as also indicated in Figure [4-23](#504209_1_En_4_Chapter.xhtml#Fig23).


    If the `quadmodel.m` file does not exist, you must generate it by using the NewScript
    button, as shown in Figure [4-24](#504209_1_En_4_Chapter.xhtml#Fig24). Never try
    to start the simulation from the file with the `.m` extension. This must be done
    from the block diagram file.


    ![../images/504209_1_En_4_Chapter/504209_1_En_4_Fig24_HTML.jpg](images/504209_1_En_4_Chapter/504209_1_En_4_Fig24_HTML.jpg)


    Figure 4-24


    Text file additional instructions


    Once in the block file, and with the text file filled with the code provided,
    in the Simulink window you will notice some drop-down menus. If you go to the
    Simulation menu and then to the Model Configuration Parameters option, you can
    choose from a variety of solvers. See Figure [4-25](#504209_1_En_4_Chapter.xhtml#Fig25).


    ![../images/504209_1_En_4_Chapter/504209_1_En_4_Fig25_HTML.jpg](images/504209_1_En_4_Chapter/504209_1_En_4_Fig25_HTML.jpg)


    Figure 4-25


    Simulink model configuration parameters


    The features that we want to modify are the following:


    *   **Type of step**: Here you choose if the step is fixed or variable. This means
    that the simulation time is executed unalterably in a fixed unit of time, or that
    it is adapted as the simulation evolves.


    *   **Step duration**: In the case of choosing fixed steps, the duration of the
    step will determine how accurate and consequently how slow the simulation will
    be. A smaller step will imply a more detailed simulation (this will be reflected
    in the graphs and the result qualities), but it will take longer to run.


    *   **Method**: Here you choose the type of solver to be used. The most common
    are Euler and RK4.


    The combination of the method and the duration of the step influences the result
    and the execution time. It is recommended to use a simple method with a relatively
    reduced step. For example, the Euler method with fixed steps of 0.001 seconds
    is an acceptable option for a quadcopter; see Figure [4-26](#504209_1_En_4_Chapter.xhtml#Fig26).
    In general, this combination will be used with the rest of our simulations.


    ![../images/504209_1_En_4_Chapter/504209_1_En_4_Fig26_HTML.jpg](images/504209_1_En_4_Chapter/504209_1_En_4_Fig26_HTML.jpg)


    Figure 4-26


    Simulink solver, time, and step size selection


    Once you have selected the solver and you have set the aforementioned characteristics,
    you must define the total time to be simulated. Click OK, close the auxiliary
    window, and save the changes. See Figure [4-27](#504209_1_En_4_Chapter.xhtml#Fig27)
    to the left side.


    ![../images/504209_1_En_4_Chapter/504209_1_En_4_Fig27_HTML.jpg](images/504209_1_En_4_Chapter/504209_1_En_4_Fig27_HTML.jpg)


    Figure 4-27


    Simulink final instructions for the simulation


    Press the play button and wait for the result; see Figure [4-27](#504209_1_En_4_Chapter.xhtml#Fig27).
    Note that the simulation time and the real time are not the same. The simulation
    time will depend on the machine processor, and it is desirable that the simulation
    be executed as fast as possible. If this was not the case, a simulation time of
    10,000 seconds would imply waiting almost 3 hours.


    When pressing any scope in the block file, the simulation graphs will appear;
    see Figure [4-28](#504209_1_En_4_Chapter.xhtml#Fig28). In this example, the states
    converge to the desired values with the given controller and references set up
    in the `quadmodel.m` file. It is convenient to press the autoscale button in the
    scope menu.


    ![../images/504209_1_En_4_Chapter/504209_1_En_4_Fig28_HTML.jpg](images/504209_1_En_4_Chapter/504209_1_En_4_Fig28_HTML.jpg)


    Figure 4-28


    Simulation result and autoscale button


    If we want to use the graphs beyond the simulator scopes, we use the To Workspace
    blocks and the MATLAB command window; see Figure [4-29](#504209_1_En_4_Chapter.xhtml#Fig29).


    ![../images/504209_1_En_4_Chapter/504209_1_En_4_Fig29_HTML.jpg](images/504209_1_En_4_Chapter/504209_1_En_4_Fig29_HTML.jpg)


    Figure 4-29


    Using To Workspace blocks


    In the given example, two data buses were sent to the workspace: the simulation
    time called time, and the forces and torques called forcTorq.


    Once the simulation has been run, just go to the MATLAB command window and type
    this to use the aforementioned data: `plot (time, forcTorq)`. The graph displayed
    in Figure [4-30](#504209_1_En_4_Chapter.xhtml#Fig30) will appear.


    ![../images/504209_1_En_4_Chapter/504209_1_En_4_Fig30_HTML.jpg](images/504209_1_En_4_Chapter/504209_1_En_4_Fig30_HTML.jpg)


    Figure 4-30


    Plotting from the command window


    Note that simulations here developed will omit the motors’ effect because they
    focus on controlling the vehicle’s center of gravity. It is assumed that the allocation
    matrix only has a linear effect on the control transmission towards the motors
    due to the previously indicated facts of symmetry, balance, and point-mass distribution.
    If you want to analyze the effect of the motors, it would be enough to take the
    thrust force and torque signals from the simulation and multiply these values
    by the corresponding allocation matrix (obviously it would be necessary to include
    scaling factors to make it compatible with real motors). This is done as indicated
    in Listing [4-2](#504209_1_En_4_Chapter.xhtml#PC2).'
