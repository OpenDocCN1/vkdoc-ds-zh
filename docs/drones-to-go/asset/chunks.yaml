  trans: '#### SDK 级别 2


    SDK 级别 2 的架构稍显开放，允许用户在力-力矩层级控制飞行器。也就是说，它让熟悉无人机控制和机器人学的用户能够将自己开发的算法和控制器集成到兼容 SDK
    的预设计飞行器中。最著名的例子是基于 `C++` 的 Parrot Bebop-autonomy SDK，以及 PX4 库的一种飞行模式。


    在此类 SDK 中，用户只能修改无人机的推力和力矩，无法对分配矩阵进行任何操作。参见图 5-10。由于推力和无人机力矩是空间参考量（X、Y、Z 和偏航角）的函数，因此该
    SDK 的层级高于类型 1 SDK。


    ![../images/504209_1_En_5_Chapter/504209_1_En_5_Fig10_HTML.jpg](img/504209_1_En_5_Fig10_HTML.jpg)


    图 5-10


    SDK 级别 2


    #### SDK 级别 3


    SDK 级别 3 完全开放，允许用户在电机层级控制飞行器；参见图 5-11。它还允许用户编写自己的通信协议、集成自己的传感器、监控自己关注的参数等等。简而言之，它允许用户设计自己的飞行器，即使这些飞行器没有先例。最著名的例子是基于
    `C++` 的 Ardupilot 库和 PX4 库。


    在此类 SDK 中，用户必须提供分配矩阵，该矩阵是无人机推力力矩和力的函数，而这些推力和力矩又是期望位置和姿态值的函数。因此，这种 SDK 的层级高于类型
    2 和类型 1 的 SDK。


    ![../images/504209_1_En_5_Chapter/504209_1_En_5_Fig11_HTML.jpg](img/504209_1_En_5_Fig11_HTML.jpg)


    图 5-11


    SDK 级别 3


    你已经了解在哪里编写代码，那么如何编写代码呢？这将在下一节中介绍。


    ## 大多数 SDK 中可用的常用命令


    以下是用于对空中无人机以及一般任何类型飞行器进行编程时最常用的命令。它们出现在三个最常用的 SDK 中：Ardupilot、PX4 和 Dronekit。这些命令按主题分类，并分别兼容
    `C++`、用于 ROS 的 `C++` 以及 Python（尽管这些 SDK 也有其他编程语言、操作系统和计算架构的变体）。详细描述和示例可在官方网页或我的书《Advanced
    Robotic Vehicles Programming》中找到，该书在附录的参考文献部分中有所介绍。关于上述库，必须指出的是，唯一允许用户集成实时任务的库是
    Ardupilot，最简单易用的是 Dronekit，而基于 ROS 因此具有多种兼容性的库是 PX4，其缺点在于文档有限且不易理解（至少目前如此）。


    ### 官方网页


    Ardupilot


    [`http://ardupilot.org/dev/docs/apmcopter-programming-libraries.html`](http://ardupilot.org/dev/docs/apmcopter-programming-libraries.html)


    Dronekit


    [`https://dronekit-python.readthedocs.io/en/latest/`](https://dronekit-python.readthedocs.io/en/latest/)


    Px4


    [`https://dev.px4.io/master/en/index.html`](https://dev.px4.io/master/en/index.html)


    ### 输入命令


    Ardupilot 键盘输入（串口监视器）：


    ```

    hal.console->read()

    ```


    Ardupilot 遥控输入：


    ```

    hal.rcin->read()

    ```


    Dronekit 键盘输入：


    ```

    input() or raw_input()

    ```


    Dronekit 遥控输入：


    ```

    vehicle.channels[channel]

    ```


    PX4 键盘输入消息：


    ```

    PX4_INFO

    ```


    PX4 遥控输入消息：


    ```

    manual_control_setpoint.msg

    ```


    ### 输出命令


    Ardupilot 用户输出（串口监视器）：


    ```

    hal.console->printf()

    ```


    Dronekit 用户输出：


    ```

    Print

    ```


    PX4 用户输出消息：


    ```

    PX4_INFO

    ```


    ### 传感器命令


    Ardupilot 模拟量读取：


    ```

    ch =hal.analogin->channel(channel)

    read=ch->voltage_average()

    ```


    Ardupilot 数字量读取：


    ```

    hal.gpio->read(pin)

    ```


    Ardupilot GPS 读取（XYZ 位置和速度）：


    ```

    inertial_nav.get_position()

    inertial_nav.get_velocity();

    ```


    Ardupilot 姿态读取（姿态角和角速度）：


    ```

    ahrs

    ins.get_gyro()

    ```


    Ardupilot 气压计高度：


    ```

    barometer.get_altitude()

    ```


    Dronekit 模拟量读取：


    间接方式，例如通过 Raspberry Pi 的模拟端口


    Dronekit 数字量读取：


    间接方式，例如通过 Raspberry Pi 的数字端口


    Dronekit GPS 读取（XYZ 位置和速度）：


    ```

    vehicle.gps_0

    vehicle.velocity

    vehicle.location

    ```


    Dronekit 姿态读取：


    ```

    vehicle.attitude

    ```


    PX4 模拟量读取消息：


    ```

    adc_report.msg

    ```


    PX4 数字量读取消息：


    ```

    gpio_led start

    ```


    PX4 GPS 读取消息（XYZ 位置和速度）：


    ```

    vehicle_gps_position.msg

    vehicle_odometry.msg

    ```


    PX4 角度位置和角速度消息：


    ```

    vehicle_odometry.msg

    sensor_combined.msg

    ```


    ### 执行器命令


    Ardupilot 数字量写入：


    ```

    hal.gpio->write(pin,value)

    ```


    Ardupilot 写入电机和舵机（用于无刷或有刷电机的 PWM RC）：


    ```

    hal.rcout->write()

    ```


    Dronekit 数字量写入：


    间接方式，例如通过 Raspberry Pi 的数字端口


    Dronekit 飞行器写入（由于 SDK 类型限制，非直接写入电机）：


    ```

    send_ned_velocity(vx,vy,vz,time)

    ```


    PX4 写入电机或飞行器消息（PX4 是类型 1 和类型 3 的 SDK）：


    ```

    actuator_controls.msg

    for writing to a vehicle

    actuator_direct.msg

    test_motor.msg

    for writing to the motors

    ```


    ### 信号处理命令


    Ardupilot 噪声信号滤波：


    ```

    LowPassFilter2pfloat filtername(parameters)

    filtername.apply(signal);

    ```


    Dronekit 噪声信号滤波：


    通过专门的 Python 库间接实现


    PX4 程序


    ```

    https://dev.px4.io/v1.9.0/en/middleware/modules_estimator.html

    ```


    ### 通信命令（有线和无线）


    Ardupilot 串口通信：


    ```

    hal.uart#->write()

    hal.uart#->read()

    with #=A,B,C,D

    ```


    Dronekit 串口通信：


    通过使用 Python 库和 Raspberry 端口间接实现


    PX4 程序


    ```

    https://mavlink.io/en/

    ```


    ### 时间命令


    Ardupilot 当前时间、延时和实时：


    ```

    hal.scheduler->millis(),micros()

    hal.scheduler->delay()

    scheduler.run(time)

    ```


    Dronekit 当前时间、延时和实时：


    Python 时间命令，例如 `time.sleep(time)`


    使用这些库无法实现实时功能


    PX4（没有生成实时调度器的方法）


    ```

    hrt_absolute_time();

    ```


    ### 杂项命令


    Ardupilot 板载内存存储：


    ```

    DataFlash.WriteBlock(package,size)

    ```


    Ardupilot 电池监控：


    ```

    battery.read( )

    ```


    Dronekit 内存存储：


    基于 Python，例如 `file.write` 或 MAVLINK 命令


    Dronekit 电池监控：


    ```

    vehicle.battery

    ```


    PX4 使用板载内存的程序：


    ```

    https://dev.px4.io/v1.9.0/en/log/ulog_file_format.html

    ```


    PX4 使用电池监控的消息：


    ```

    battery_status.msg

    ```'
- fmt: '# Summary


    In this chapter, you learned about the tasks of a drone as well as the basic types
    of signal processing that are required to use it. The explained signal processing
    were signal filtering, signal saturation, signal mapping, data casting, and the
    normalization of redundancies and singularities. All of them can be used with
    sensors, actuators, and with the communication or control stages. For the communication
    task, you learned about the usual parts of a high-level UART. Finally, you learned
    about the four ways to program a drone, including a thematic list of drone commands
    with an approach based on three of the most used SDKs.


    With this chapter, we finished the topics of the book, but we recommend that you
    continue with the Appendix. It contains topics related to drones such as the estimation
    of their maximum power and speed limits, sliding modes, differential flatness,
    a brief on linear control, some alternative ways for representing the orientation
    of a vehicle, and how you can extend the topics described in this book to other
    types of aerial vehicles instead of just quadcopters.'
