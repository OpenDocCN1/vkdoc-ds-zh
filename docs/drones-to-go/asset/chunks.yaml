    \ simulation, and programming\n\n* An extended model on the mathematics of a multicopter,\
    \ not present in any previous work and with a visual and pedagogical development,\
    \ answering many of the doubts that remain in the air at the time of such explanations\n\
    \n* A novel way to visualize the controllers of a multicopter, that is fully compatible\
    \ with the existing state of the art\n\n* A detailed description of the controllers\
