    \ 之前的 Simulink 版本中，扩展名为 `.mdl`），我们使用了之前提到的所有七个基本模块。请注意，模型的复杂性保留在文本文件中。因此，模块的数量得以减少。此模块文件可用作任何其他模型的模板。只需更改总线的尺寸和包含系统的文本文件即可。\n\
