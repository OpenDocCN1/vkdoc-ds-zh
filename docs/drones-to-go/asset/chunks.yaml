- fmt: '### Electrical Safety


    Drone operation with wired electrical connections, called tethered, involves sending
    medium voltages of around 400V to the vehicle, which in certain countries (for
    example, Japan) go beyond what is legally permitted.


    ### Transport and Storage


    The tricky topic here is about batteries and fuel tanks, so be sure you know how
    to properly store and transport such supplies.


    ### Safety of Use


    Any person or property that you damage with your vehicle involves legal problems.
    You must be aware that a drone is an object that, even in small sizes, due to
    the speeds that it reaches by itself or by its propellers, represents a risk.


    ### Buying and Selling Problems


    You may be interested in a vehicle or perhaps you want to commercialize a prototype.
    If so, you need to verify that its components, features, and materials are permitted
    in your region. It is possible that something that represents a small expense
    to you, once you sell it or buy it in a specific country or commercial area, will
    increase considerably in price or taxes or may even be retained or rejected for
    the use of illegal components.


    ### Regulations and Standardizations


    When you get to Chapter [2](#504209_1_En_2_Chapter.xhtml), you will notice a non-arbitrary
    selection of coordinates and angles of rotation, as displayed in Figure [1-4](#504209_1_En_1_Chapter.xhtml#Fig4).
    This selection obeys the ISO 1151-2: 1985 standard and facilitates the link between
    the described theory and the use of sensors and components already manufactured.
    However, to simplify equations, we will use the upward Z axis.


    ![../images/504209_1_En_1_Chapter/504209_1_En_1_Fig4_HTML.jpg](images/504209_1_En_1_Chapter/504209_1_En_1_Fig4_HTML.jpg)


    Figure 1-4: Drone motions as indicated by the ISO 1151-2: 1985 standard


    Notice that in the case of a drone, as you will see later, although the pitch
    (`theta`) and roll (`phi`) angles are measured respectively with the Y and X axes,
    the motion in X axis depends on controlled tilt rotations in `theta`, and the
    motion in the Y axis depends on controlled tilt rotations in `phi`, as illustrated
    in Figure [1-5](#504209_1_En_1_Chapter.xhtml#Fig5).


    ![../images/504209_1_En_1_Chapter/504209_1_En_1_Fig5_HTML.jpg](images/504209_1_En_1_Chapter/504209_1_En_1_Fig5_HTML.jpg)


    Figure 1-5: Link between angular and planar motions


    ### Recommendations


    Here are some standard recommendations in order to work with drones:


    *   Read your local legislation regarding the topics listed here or even additional
    considerations.

    *   Verify that your hardware complies with the requirements of said legislations.

    *   You and your team must use standard protective equipment such as googles or
    gloves.

    *   When other people are present during a test, keep in mind that a prototype
    can cause injuries and it is recommended that you or the person in charge of your
    laboratory have a license to operate unmanned aerial vehicles.

    *   Avoid public or private spaces, whether indoors or outdoors, that are not
    designed for your tests.

    *   Remember that you are a designer and not necessarily a pilot.

    *   If you have the necessary permissions, you must prepare the place with walls,
    protection meshes, or plastic surfaces in case any pieces break or detach from
    the drone. You should also post warning advisories/signs to restrict access of
    non-authorized personnel.

    *   Perform exhaustive tests without propellers or with the drone anchored before
    the free flying tests. In order to avoid damaging your motors by testing them
    without any load, you can replace your propellers with pieces of paper.

    *   When you have a prototype available, verify that all its components are legal
    in your specific location and determine if there are functional replacements for
    the components that are not allowed.


    Now it is time to specify the type of drones that we will analyze in the rest
    of the book.


    ## Types of Drones


    According to their displacement, drones can be classified in this way (Figure
    [1-6](#504209_1_En_1_Chapter.xhtml#Fig6)):


    ![../images/504209_1_En_1_Chapter/504209_1_En_1_Fig6_HTML.jpg](images/504209_1_En_1_Chapter/504209_1_En_1_Fig6_HTML.jpg)


    Figure 1-6: Types of drones


    *   **Rotary wings** : They only require propellers to move. In this case, they
    have vertical takeoff and landing, and are designed for load transport and short-
    and medium-range applications.

    *   **Fixed wings** : They require long surfaces in order to move, like most airplanes.
    In this case, they have applications for horizontal takeoff and landing, and are
    designed for higher speeds as well as longer flight ranges than rotating wing
    aircrafts.

    *   **Flapping wings** : They require oscillating surfaces to fly, like the wings
    of a bird or an insect. They could be viewed as a fusion of fixed and rotating
    wings, and similarly have mixed applications.

    *   **Transformable**: They can go from one configuration to another, as in the
    case of the tailsitters. These vehicles go from a vertical takeoff and landing
    using propellers to a fixed-wing flight-mode for long range operations.


    This book will cover topics about multicopter-type unmanned aerial vehicles, which
    are based on rotary-wing propulsion. However, most of the concepts can be extended
    to other types of aircraft under additional restrictions or considerations (including
    modeling, control, simulation, and programming topics).


    Let’s move to the drone components.


    ## Components


    We will describe the most relevant components of a drone, based on their use:
    action components, structural components, measurement components, command components,
    and power ones.


    ### Action Components


    There are two types of action components : electromechanical and electrical action.
    Electromechanical types are motors or servos that simply receive an electrical
    signal and then transform this signal to a mechanical effect. In the case of the
    electrical action, they are components that provide an amplification stage or
    an electrical adaptation.


    Electromechanical action elements can have a direct effect on the speed (brushless
    and brushed motors) or position (servo motors).'
