  trans: '

    ### 电气安全


    通过有线电气连接（即系留操作）运行无人机，需向飞行器输送约 400V 的中等电压，这在某些国家（例如日本）超出了法律许可范围。


    ### 运输与存储


    这里的关键问题涉及电池和油箱，因此务必掌握此类物资的正确储存和运输方法。


    ### 使用安全


    您用飞行器对任何人员或财产造成的损坏都会引发法律问题。必须认识到，即使是小尺寸的无人机，由于其自身或螺旋桨所能达到的速度，也构成潜在风险。


    ### 买卖问题


    您可能对某款飞行器感兴趣，或希望将原型机商业化。若如此，您需要验证其组件、特性和材料是否在您所在地区获得许可。某些对您而言开支不大的部件，一旦在特定国家或商业区域进行买卖，其价格或税费可能会大幅增加，甚至可能因使用非法部件而被扣押或退回。


    ### 法规与标准


    当您阅读到第 2 章时，将会注意到如图 1-4 所示的一组非随意选取的坐标和旋转角。这种选取遵循了 ISO 1151-2:1985 标准，并有助于将所述理论与现成传感器和组件的使用联系起来。不过，为简化方程，我们将使用
    Z 轴向上。


    ![../images/504209_1_En_1_Chapter/504209_1_En_1_Fig4_HTML.jpg](img/504209_1_En_1_Fig4_HTML.jpg)


    图 1-4：ISO 1151-2:1985 标准定义的无人机运动


    请注意，对于无人机而言，如后文所述，尽管俯仰角（`theta`）和横滚角（`phi`）分别沿 Y 轴和 X 轴测量，但 X 轴方向的运动依赖于`theta`方向的可控倾斜旋转，而
    Y 轴方向的运动则依赖于`phi`方向的可控倾斜旋转，如图 1-5 所示。


    ![../images/504209_1_En_1_Chapter/504209_1_En_1_Fig5_HTML.jpg](img/504209_1_En_1_Fig5_HTML.jpg)


    图 1-5：角运动与平面运动之间的联系


    ### 建议


    以下是关于无人机操作的一些标准建议：


    *   阅读您当地关于此处列出主题或其他方面的法规。

    *   确保您的硬件符合上述法规的要求。

    *   您和您的团队必须使用标准的防护装备，例如护目镜或手套。

    *   当测试时有其他人在场时，请牢记原型机可能造成伤害，建议您或您的实验室负责人持有无人驾驶飞行器操作执照。

    *   避免使用非专门用于测试的公共或私人空间，无论是室内还是室外。

    *   请记住，您是设计者，不一定是飞行员。

    *   若获得必要许可，您应在场地四周设置墙壁、防护网或塑料面板，以防零件从无人机上碎裂或脱落。您还应张贴警告标识/告示，限制未经授权人员进入。

    *   在进行自由飞行测试前，先进行无螺旋桨或无人机固定状态下的全面测试。为避免无负载测试损坏电机，您可以用纸张替代螺旋桨。

    *   当拥有原型机时，请确认其所有组件在您所在地点均为合法，并确定违规组件是否存在功能性替代品。


    现在，该明确本书后续将分析哪种类型的无人机了。


    ## 无人机类型


    根据运动方式，无人机可按如下方式分类（图 1-6）：


    ![../images/504209_1_En_1_Chapter/504209_1_En_1_Fig6_HTML.jpg](img/504209_1_En_1_Fig6_HTML.jpg)


    图 1-6：无人机类型


    *   **旋翼型**：仅需螺旋桨即可移动。此类无人机能够垂直起降，设计用于载荷运输及短、中程任务。

    *   **固定翼型**：需要长翼面才能移动，如同大多数飞机。此类无人机能够水平起降，设计用于比旋翼机更高的速度和更远的航程。

    *   **扑翼型**：需要振荡翼面才能飞行，如同鸟类或昆虫的翅膀。可视为固定翼与旋翼的融合，应用场景兼具两者特点。

    *   **可转换型**：能从一个构型转变为另一个构型，例如“尾座式”无人机。这类飞行器从使用螺旋桨的垂直起降模式，转变为固定翼飞行模式以执行远程任务。


    本书将重点讨论基于旋翼推进的多旋翼型无人飞行器。然而，在附加约束或考虑（包括建模、控制、仿真和编程主题）下，大部分概念可推广至其他类型的飞行器。


    接下来，我们来看无人机的组件。


    ## 组件


    我们将根据用途描述无人机最相关的组件：执行组件、结构组件、测量组件、指令组件和动力组件。


    ### 执行组件


    执行组件分为两类：机电执行组件和电气执行组件。机电类型是指电机或舵机，它们接收电信号并将其转换为机械效应。电气类型则是提供放大级或电气适配的组件。


    机电执行元件可直接作用于速度（无刷电机和有刷电机）或位置（舵机）。

    '
- fmt: '### Brushed and Brushless Motors


    Currently, because of their response time, the most common engines found on multicopters
    (for makers and scientists) are based on direct current electric motors. These
    kinds of motors can be brushed or brushless. In both cases, it is required to
    modify the motor speed by increasing or decreasing it by adjusting values such
    as the RMS voltage.


    In the case of brushed motors, they are the most common electric motor. They are
    used in very small size drones. The brushes reduce response times due to contact
    friction. Also, they are not recommended in explosive environments due to the
    sparks that they produce, and they are not recommended in aquatic environments
    since they can short-circuit themselves. However, since they work with PWM duty
    cycle signals (remember that pulse width modulation are various techniques for
    regulating a signal by varying a percentage of its action, in this case by regulating
    the on/off percentage of the power signal), this kind of PWM is usual for example
    in an Arduino board.


    Brushless motors are usually found in multicopters because of their faster response
    times and because of the absence of electrical contacts, which implies a reduction
    in friction. They are employed in explosive environments due to the absence of
    sparks and they can be used in aquatic environments because they do not have elements
    susceptible to short-circuiting (as long as their wires are coated).


    On the other hand, they are more expensive compared to the brushed motors and
    they operate with a special type of PWM called RC, where the on/off percentage
    is regulated in a different way than brushed motors (here the percentage is a
    function of the time), requiring additional components.


    For the proper use of both types of motors, power stages are required, as you
    will see in the next section. Note that duty cycle-type PWM and vRC-type PWM are
    not directly compatible


    The main difference is that brushed type motors are usually single-phase while
    brushless are three-phase or multiphase motors (generally three-phase in aircraft
    applications).


    Figure [1-7](#504209_1_En_1_Chapter.xhtml#Fig7) shows an oversized brushed motor
    compared to a brushless one, but the opposite can also happen; this simply depends
    on the requirements of the user or the designer. A more remarkable difference
    that you should notice is the number of cables (electrical phases) and the fact
    that brushed motors are generally of the inrunner type (rotating inner shaft)
    while brushless are often outrunner (rotating outer casing).


    ![../images/504209_1_En_1_Chapter/504209_1_En_1_Fig7_HTML.jpg](images/504209_1_En_1_Chapter/504209_1_En_1_Fig7_HTML.jpg)


    **Figure 1-7** Brushed and brushless motors


    #### ESCs and Power Stages


    `ESCs`, also called speed variators (Figure [1-8](#504209_1_En_1_Chapter.xhtml#Fig8)),
    are the power stages of brushless motors and some brushed motors (for the latter,
    they are only electronic RC signal to duty cycle adapters).


    Basically they are injected with a signal that regulates their on/off states in
    PWM RC format. By means of that, the single-phase and direct-current power signal
    is transformed to a kind of three-phase signal that controls the speed of the
    motor’s rotation.


    In the case of brushed DC motors, as already explained, an adapter `ESC` can be
    used. This takes a PWM RC signal that is converted to a PWM duty cycle signal.
    Another option that is more commonly used on devices is called an electronic driver,
    which takes a duty cycle PWM as input and then amplifies the signal to obtain
    the necessary current or voltage to regulate the motor speed.


    Both `ESC` and electronic drivers are called power stages because they are electronic
    circuits that amplify electrical signals sent by autopilots or processing units
    (which are unable to supply enough electrical power) to drive the motors. Observe
    that if you try to move a motor directly from a processing unit without using
    the proper power stage, you can burn or break this processing unit.


    ![../images/504209_1_En_1_Chapter/504209_1_En_1_Fig8_HTML.jpg](images/504209_1_En_1_Chapter/504209_1_En_1_Fig8_HTML.jpg)


    **Figure 1-8** ESC


    ### Servos


    Servo motors (widely known as just “servos”) are position motors that receive
    a PWM RC type signal that is converted into the position of an axis coupled to
    the motor. See Figure [1-9](#504209_1_En_1_Chapter.xhtml#Fig9). They operate similarly
    to a brushless motor except that the `BLDC` (brushless direct current motor) changes
    its speed through variations in the PWM RC signal, while the servo changes its
    position.


    They also require their respective power stage. Additionally, they are not as
    fast at changing position as a brushless motor. Due to this fact, there is a risk
    of breaking or burning a servomotor with a sudden change of the PWM signal. A
    PWM signal used for servos must be slower than a PWM signal used for a `BLDC`.


    ![../images/504209_1_En_1_Chapter/504209_1_En_1_Fig9_HTML.jpg](images/504209_1_En_1_Chapter/504209_1_En_1_Fig9_HTML.jpg)


    **Figure 1-9** Servomotor


    ### Propellers


    It is difficult for a motor to act directly on the environment. An interaction
    like this requires objects, such as wheels or propellers (as shown in Figure [1-10](#504209_1_En_1_Chapter.xhtml#Fig10)),
    depending on whether it is a watercraft, an aircraft, or a ground vehicle. For
    safety purposes, the vehicle should be tested without them until you obtain a
    desired behavior. A motor has two types of performances. The first is known as
    a full-load operation, which occurs when the propellers are placed, and the second
    is free performance, which implies that the motor does not have a propeller or
    some other object attached to its structure. Both cases represent extreme situations.
    In the case of the free performance, which is common for initial tests, it is
    recommended to use pieces of paper instead of the propellers as a safety load
    (weight). During the full-load mode, it is recommended not to reach the maximum
    load value (weight) recommended by the manufacturer.


    ![../images/504209_1_En_1_Chapter/504209_1_En_1_Fig10_HTML.jpg](images/504209_1_En_1_Chapter/504209_1_En_1_Fig10_HTML.jpg)


    **Figure 1-10** Propellers


    ## Structure Components


    The following sections discuss the components that give shape and support to the
    vehicle.


    ### Frame


    The frame is simply the chassis or vehicle’s body (Figure [1-11](#504209_1_En_1_Chapter.xhtml#Fig11))
    on which the other components are mounted.


    ![../images/504209_1_En_1_Chapter/504209_1_En_1_Fig11_HTML.jpg](images/504209_1_En_1_Chapter/504209_1_En_1_Fig11_HTML.jpg)


    **Figure 1-11** Frame with propellers


    ### Vibration-Damping Mounts


    Vibration-damping mounts are structures designed for absorbing or reducing the
    noise that induces the vibration of the vehicle on the sensors or the processor
    and thus avoids incorrect measurements or computational errors.


    ### Mechanical Connector


    It is evident that the components must be fixed, either permanently or long-term
    (screws) or in a replaceable way or short-term (Velcro, straps).


    ## Measurement Components


    The following sections discuss the components that allow the vehicle to know where
    it is placed.


    ### Miscellaneous Sensors


    A multicopter requires motion and speed sensors on the XY plane and for the altitude,
    as well as three-dimensional rotational speed and angular sensors. They can be
    analog sensors, digital or serial ones, even on-board and external sensors. The
    most common are barometers, `IMUs`, gyroscopes, accelerometers, `LIDARs`, cameras,
    and motion tracking systems. (See the Appendix to learn more about them).'
