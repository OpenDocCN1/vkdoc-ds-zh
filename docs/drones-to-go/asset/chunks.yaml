- fmt: '# Forces Acting on a Propeller


    The next step is to analyze the forces on a single propeller. Note that this analysis
    is performed for two-bladed propellers but is expandable for more blades with
    the corresponding trigonometric projections.


    The first thing that is considered is that the thrust force on each blade can
    be equivalent to a force placed on a point of said blade. In Figure 2-8, they
    are labeled `FL` (or left) and `FR` (or right). The second thing that is considered
    is that the propeller is well balanced, which implies that the distance between
    the center of the propeller to the analysis point on each blade is the same (a
    radius `r`).


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Fig8_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Fig8_HTML.jpg)


    Figure 2-8

    Forces actuating on the blades of a propeller and their lever arms


    Also, we will use the propeller frame shown in Figure 2-9.


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Fig9_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Fig9_HTML.jpg)


    Figure 2-9

    A propeller frame for analysis


    The following step is to decompose the forces on each blade into their vertical
    and horizontal components (`Z` and `H` labels). See Figure 2-10.


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Fig10_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Fig10_HTML.jpg)


    Figure 2-10

    Components of the forces acting on each blade


    Next, we perform the sum of forces and torques in the three respective axes (`X`,
    `Y`, and `Z`). As symmetry and balancing assumptions are made in each blade, it
    is possible to perform the following equalities:


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figr_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Figr_HTML.jpg)


    From the previous figure, the vertical analysis of forces is simple. Notice the
    fact that using more blades increases the vehicle’s load capacity (as expected,
    each blade acts as a support axle).


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figs_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Figs_HTML.jpg)


    The analysis in `X Y` is the same, and for this we will take advantage of the
    radial symmetry of the propeller (this analysis using odd blades becomes very
    interesting since it requires trigonometric projections, but the final result
    must be the same).


    Suppose that the propeller is positioned for a moment on the `X` or `Y` axis,
    as indicated in Figure 2-11.


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Fig11_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Fig11_HTML.jpg)


    Figure 2-11

    Top view of the forces acting on each blade. The `Z` axis points towards you


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figt_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Figt_HTML.jpg)


    Therefore, it is shown that as long as the propeller is adequately balanced, the
    horizontal forces that each blade generates will be canceled. However, as you
    have noticed, there is also the presence of the radii of action and consequently
    torques. This is analyzed as follows.


    Let’s go back to the previous figure, and adding the fact that the `Z` axis points
    towards you, the torque around this axis is as shown in Figure 2-12.


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Fig12_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Fig12_HTML.jpg)


    Figure 2-12

    Top view of the forces acting on each blade for analyzing the equivalent torque.
    The `Z` axis points towards you


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figu_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Figu_HTML.jpg)


    Note that increasing the blade number also increases the propeller torque capacity
    (each blade acts as a lever arm).


    And finally we will determine the horizontal torque (around the `X` or `Y` axes;
    there is no difference). See Figure 2-13.


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Fig13_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Fig13_HTML.jpg)


    Figure 2-13

    Lateral view of the forces acting on each blade for analyzing the horizontal torque.
    The `Y` or `X` axis points towards you


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figv_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Figv_HTML.jpg)


    The most important conclusion of the previous analysis is the next. While the
    propellers are well balanced, they can only generate a vertical thrust force on
    their axis of action and a torque around the same axis. See Figure 2-14.


    ![../images/504209_1_En_2_Chapter/504209_1_En_2_Fig14_HTML.jpg](images/504209_1_En_2_Chapter/504209_1_En_2_Fig14_HTML.jpg)


    Figure 2-14

    Equivalent force and torque of the propeller with respect to its center


    An interesting exercise for you is to deduce the same effect for a propeller with
    three blades distributed at 120 degrees each. The final result must be the same.'
