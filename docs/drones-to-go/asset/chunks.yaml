    \n# 前言\n\n本书可被视为关于无人机，特别是多旋翼飞行器（重点关注四旋翼飞行器）的最完整教程之一。其目标读者涵盖从创客到科学家的各类人群。书中包含了设计、建模、控制、仿真和编程的必要元素，以简洁但详尽的方式阐述，尤其关注许多其他书籍忽略的要点。此外，它将创客知识与技术细节、科学知识与设计细节融合于一书之中。\n\
    \n本书是多年在该领域研究的成果。它采用循序渐进的教学设计，使无人机领域的新手或已有基础者都能获得坚实的基础，以便进一步学习。\n\n书中包含其他作品中没有的详细分步推导，例如控制器的详尽证明及其仿真。\n\
    \n书中明确指出了如何将此处发展的知识扩展到各种飞行器或航空系统中，并提供了充足的参考文献。\n\n最后，附录为那些希望在该主题上扩展知识的人提供了非常全面的参考书目。\n\
    \n本书假设读者至少具备高中或技术学士学位，并理解导数、积分、基本常微分方程等概念，以及算法和编程的基本概念。\n\n## 许可与版权\n\n* MATLAB®\
    \ 和 Simulink® 是 The MathWorks, Inc. 的注册商标。请参阅 `mathworks.com/trademarks` 了解其他商标列表。\n\
    \n* ArduPilot 库和 Mission Planner 软件是 GPLv3 许可的自由软件。它们可以根据自由软件基金会（[`www.fsf.org/`](http://www.fsf.org/)）描述的\
    \ GNU GPLv3 条款和限制进行重新分发和/或修改。这些代码和程序分发时希望能有用，但不提供任何担保，甚至不包含适销性或特定用途适用性的默示担保。更多详情请参见\
    \ GNU 项目的通用公共许可部分。ArduPilot 库可从 [`http://ardupilot.org/dev/docs/apmcopter-programming-libraries.html`](http://ardupilot.org/dev/docs/apmcopter-programming-libraries.html)\
    \ 下载。\n\n* PX4 库采用 BSD 3-Clause 许可证（[`https://opensource.org/licenses/BSD-3-Clause`](https://opensource.org/licenses/BSD-3-Clause)）。\n\
    \n* Pixhawk 自动驾驶仪采用 CC-BY-SA 3.0 许可证（[`https://creativecommons.org/licenses/by-sa/3.0/deed.es`](https://creativecommons.org/licenses/by-sa/3.0/deed.es)），版权归\
    \ Lorenz Meier 所有。\n\n* DroneKit-Python 采用 Apache 许可证 2.0 版，2004 年 1 月（[`www.apache.org/licenses/`](http://www.apache.org/licenses/)）。\n\
    \n* Scilab 在 GPL 许可证下可用。Xcos 是免费提供的，并与 Scilab 一起分发。\n\n## 通过本书，你将学到\n\n* 成为多旋翼飞行器开发者所需五项理想技能的入门介绍：设计、建模、控制、仿真和编程\n\
    * 关于多旋翼飞行器数学的扩展模型，这在以往任何作品中都未涉及，并配有直观和循序渐进的推导，解答了在类似讲解中经常悬而未决的许多疑问\n* 一种新颖的多旋翼飞行器控制器可视化方式，与现有最先进技术完全兼容\n\
    * 对控制器及其仿真的详细描述，这在文章或其他书籍中并未广泛传播，通常仅限于课堂\n* 你可以将本书作为未来学习的基础，以小型、高度可视化且易于理解的形式呈现。\n\
    * 本书的目标是通过这类飞行器统一创客世界与科学世界，包含科学书籍中省略的设计技巧和设计书籍中省略的科学技巧。\n* 你可以通过适度但系统的努力，将所学知识扩展到其他类型飞行器的设计与分析中。\n"
- fmt: '# How to Read This Book


    This book is divided into five sections that in our opinion are necessary for
    an acceptable level of knowledge for a drone designer:


    - In the design section, the technical characteristics to be considered when preparing
    a prototype of a multicopter are shown. This section is based on a compilation
    of maker-style texts and webpages. Note that this knowledge can be easily extended
    to other types of vehicles.

    - In the modeling section, the mathematics related to a quadcopter (and generic
    aircraft) are shown, emphasizing the three basic sets of equations: the dynamic
    set (with this, the control is designed), the kinematic set (with this, the tasks
    to be executed are designed), and the set of allocation (with this, each motor
    is programmed and works as the link between theory and practice). Also here, the
    knowledge shown is moderately easy to be extended to other types of vehicles.

    - In the control section, four basic types of multicopter controllers are developed,
    classifying them into two main branches: vehicle mode control, also known as on-board
    or first-person mode, and robot mode control, also known as external or third-person
    mode. This categorization was preferred because these aircraft can be seen as
    a vehicle or as a robot depending on the application they have. The knowledge
    in this section can be extended to other types of vehicles under certain mobility
    conditions.

    - The simulation section provides a simplified way (a template) to simulate the
    previous systems and their controllers, allowing you to understand that only two
    sections of code are required: the one that contains modeling and control equations,
    and the one that contains the ODE solver. Although in this book we use MATLAB
    and Simulink for simplicity, with the concepts outlined, you will be able to use
    any other programming language or graphic simulator for the same purposes.

    - And finally the implementation section, which shows the coding considerations
    and signal processing currently available or required to use most of the unmanned
    aerial systems. Also this section may be useful for other types of vehicles.


    As you can see, this book and its chapters can be used as the basis for the elaboration
    of a complete plan for teaching and studying the described subject. This book
    is by itself a complete course in a pocket size.


    This book is aimed at makers, designers, scientists, and researchers related to
    the drone world and specifically to multicopters. However, if you are a pilot
    or a hobbyist and you are interested in knowing every corner of your vehicle,
    this text will be a useful and understandable reading.


    If you have the printed version of this book, consider to download also the pdf
    of the same in order to see detailed close-ups of the equations.


    ## Acknowledgments


    **Julio Mendoza** This book was made with the support of the UNAM DGAPA postdoctoral
    grants program 2018-2020. I also thank IPN, Conacyt, and IMPI, as well as my teachers,
    students, family, and friends, in particular Humberto Sossa, Jose Antonio Aquino,
    Gabriel Sepulveda, Rogelio Lozano, Miguel Suarez-Castanon, Marco Butron, Hazur
    Socconini, Francisco Arteaga-Velasquez, Jamyr Vasquez-Salinas, Carlos Vargas-Luis,
    David Arvizu-Rondero, Vicente Flores-Gutierrez, Mario Martinez-Ramirez, Artemisa
    Pedroza, Rodrigo Encinas-Porcel, Rodrigo Pelayo-Ramos, Mauricio Mendez, Tio Fox
    (Neftali Elorza), Gilberto Castrejon , Rafael Martinez, Manuel Jesus Rodriguez,
    Orlando Garcia, Carlos Rios Ramirez, Pablo Mendoza-Iturralde, Ernesto Filio-Lopez,
    our graphic designer Jesus Castillo, our editor Natalie Pao and her team, the
    Ardupilot team through Philip Rowse and his CubePilot project, the Mathworks book
    program, among many other people and institutions. I also deeply appreciate my
    granny Guille that unfortunately could not break her personal record of 100 years.
    Finally, I appreciate the invaluable help of doctors, nurses, rescuers, food and
    services providers, researchers, and all the public security teams who are true
    heroes and who risk their own integrity by supporting us in these truly difficult
    times for all humanity. In particular, this book is dedicated to all the people
    who are no longer with us, but whose impact on our formation and life had some
    meaning including my other grandma Carmen, and also to all the people that in
    the anonymity of the streets or poverty did not reach a mention in our lists.


    **Victor J. Gonzalez-Villela** would like to acknowledge the financial support
    from the Support Program for Research and Technological Innovation Projects (PAPIIT)
    and Postdoctoral Grant Program DGAPA, UNAM, and the National Council of Science
    and Technology (CONACYT) for its support given via its National Research System
    (SNI exp 262253). Also I want to thank to my lovely family, especially my daughter
    Brenda and my son Andres for their support for all over these years in the good
    and bad times. Besides, thanks to all the members of the Mechatronics Research
    Group (MRG) and all the members of the Mechanical Design and Technological Innovation
    Center (CDMIT), FI, UNAM, who I have shared many personal and professional experiences
    throughout all these years, working together for a common goal and finally, all
    who made possible the materialization of this book.


    **Carlos Aguilar** I wish to express my profound appreciation to my colleagues
    and friends, professors Santiago Suarez, Octavio Gutierrez, Julio Mendoza, Jose
    de Jesus Rubio, Jose Angel Acosta, Juan Carlos Martinez, Ruben Garrido, Rafael
    Martinez, Eloisa García, and Nareli Cruz for their interested and unmeasurable
    support for so many years. I also want to thank my new friends and collaborators,
    professors Eduardo Javier, Manuel, and Belem for their contributions to my work.
    I also wish to express my profound gratitude to my mentors and role models, professors
    Moises Bonilla, Rogelio Lozano, Hebertt Sira, and Romeo Ortega. They have been,
    for me, an example of effort and dedication in our beloved profession. Last but
    not least, I want to thank my beloved wife, Erika, my daughters, Daira and Zaida,
    and my mother, brothers, cousins, and uncles, who are my primary source of love
    and the motivation to be a better person every day. Finally, I express gratitude
    to God for letting me do and live off what I love to do.


    **Leonardo Fonseca-Ruiz** I dedicate the book to Aidee, Matilde Amelie, and Leonardo,
    who are the lights of my life. I also thank the National Polytechnic Institute;
    my students, who keep me updated; Dr. Julio Alberto Mendoza and MSc. Mauricio
    Méndez, who have been by my side since they were my students and have always done
    their best, inspiring me to do the same. I am really grateful to the Interdisciplinary
    Professional Unit of Engineering and Advanced Technologies (UPIITA) of the IPN
    for giving me the opportunity to teach new mechatronic engineers for over 14 years.


    ## About the Authors About the Technical Reviewer


    # 1. Drone Design Concepts


    In this chapter, you will find the most relevant information about what a drone
    is, including historical and social context. This chapter will cover international
    standards, some etymologies, and certain safety considerations that you should
    keep in mind while working with these aircraft. We’ll go through a description
    of generic components and their selection and connection. As a result, you will
    learn the technical details, international standards, and necessary requirements
    for the design of drones and other vehicles. Remember that this book is a crash
    course, so this chapter just provides a fast way for you to assimilate the contents.
    If you want to extend this knowledge, go to the guided reference appendix.'
