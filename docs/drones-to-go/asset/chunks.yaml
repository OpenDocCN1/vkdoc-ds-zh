    Finally, the simulation of the geometric control is shown. We use a set of trajectories
    similar to that found in the publications of Taeyoung Lee previously indicated,
    but with a slower motion profile in order to use a simple PD controller. If you
    want to go further, you can modify the following code by adding the required terms
    until you achieve a high-speed performance as in said articles.


