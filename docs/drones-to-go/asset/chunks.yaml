  trans: '

    ### 有刷电机与无刷电机


    目前，由于其响应速度快，多旋翼飞行器（面向创客和科研人员）上最常见的引擎基于直流电动机。这类电机可分为有刷电机和无刷电机。在这两种情况下，都需要通过调整均方根电压等参数来增加或减小电机转速。


    有刷电机是最常见的电动机类型，常用于微型无人机。电刷会因接触摩擦而降低响应速度。此外，由于会产生火花，不推荐在易爆环境中使用；由于可能发生短路，也不推荐在水生环境中使用。不过，有刷电机可与
    PWM 占空比信号（请记住，脉宽调制是通过改变信号作用百分比来调节信号的各种技术，此处指调节电源信号的开/关百分比）配合工作，例如在 Arduino 开发板上通常使用这种
    PWM 信号。


    无刷电机通常用于多旋翼飞行器，原因在于其响应速度更快，且没有电触点，从而减少了摩擦。由于不产生火花，可用于易爆环境；由于没有易短路的元件（只要导线有绝缘层），也可用于水生环境。


    另一方面，无刷电机比有刷电机更昂贵，并且使用一种称为 RC 的特殊 PWM 信号工作，其开/关百分比的调节方式与有刷电机不同（这里的百分比是时间的函数），因此需要额外的组件。


    为了正确使用这两种类型的电机，都需要功率级，你将在下一节中看到。请注意，占空比型 PWM 和 RC 型 PWM 并不直接兼容。


    主要区别在于，有刷电机通常是单相的，而无刷电机是三相或多相电机（在航空应用中通常为三相）。


    图 1-7 显示了一个放大的有刷电机与一个无刷电机的对比，但反过来也可能发生；这完全取决于用户或设计者的需求。一个更值得注意的区别是电缆（电相）的数量，以及有刷电机通常是内转子类型（转子轴旋转），而无刷电机通常是外转子类型（外壳旋转）。


    ![../images/504209_1_En_1_Chapter/504209_1_En_1_Fig7_HTML.jpg](img/504209_1_En_1_Fig7_HTML.jpg)


    **图 1-7** 有刷电机和无刷电机


    #### 电子调速器与功率级


    `ESC`（电子调速器），也称为速度调节器（图 1-8），是无刷电机和一些有刷电机的功率级（对于后者，它们只是电子 RC 信号到占空比的适配器）。


    其基本原理是，向其注入一个 PWM RC 格式的信号来调节其开/关状态。通过这种方式，单相直流电源信号被转换为一种控制电机旋转速度的三相信号。


    对于有刷直流电机，如前所述，可以使用适配器`ESC`。它接收 PWM RC 信号并将其转换为 PWM 占空比信号。另一种在设备上更常用的选择是名为电子驱动器的装置，它以占空比
    PWM 作为输入，然后放大信号以获得调节电机速度所需的电流或电压。


    `ESC`和电子驱动器都被称为功率级，因为它们都是电子电路，用于放大自动驾驶仪或处理单元（这些单元无法提供足够的电功率）发出的电信号以驱动电机。请注意，如果你尝试不使用合适的功率级而直接从处理单元驱动电机，可能会烧毁或损坏该处理单元。


    ![../images/504209_1_En_1_Chapter/504209_1_En_1_Fig8_HTML.jpg](img/504209_1_En_1_Fig8_HTML.jpg)


    **图 1-8** 电子调速器


    ### 舵机


    伺服电机（通常简称为“舵机”）是一种位置电机，它接收 PWM RC 型信号，并将其转换为与电机耦合的轴的位置。参见图 1-9。它们的运行方式类似于无刷电机，但区别在于，无刷电机通过改变
    PWM RC 信号来改变速度，而舵机则改变位置。


    舵机也需要它们各自的功率级。此外，它们在改变位置时不如无刷电机快速。因此，PWM 信号的突然变化存在损坏或烧毁舵机的风险。用于舵机的 PWM 信号必须比用于`BLDC`（无刷直流电机）的
    PWM 信号更慢。


    ![../images/504209_1_En_1_Chapter/504209_1_En_1_Fig9_HTML.jpg](img/504209_1_En_1_Fig9_HTML.jpg)


    **图 1-9** 舵机


    ### 螺旋桨


    电机很难直接作用于环境。这种相互作用需要借助诸如轮子或螺旋桨（如图 1-10 所示）之类的物体，具体取决于它是水上航行器、飞行器还是地面车辆。为了安全起见，应在获得所需的动态特性之前，在不安装螺旋桨的情况下测试飞行器。电机有两种性能状态：第一种称为满载运行，即安装螺旋桨时；第二种是空载性能，即电机轴上未安装螺旋桨或其他物体。这两种情况都代表了极端状况。在空载性能测试（常用于初始测试）中，建议使用纸片代替螺旋桨作为安全负载（重量）。在满载模式下，建议不要超过制造商推荐的最大负载值（重量）。


    ![../images/504209_1_En_1_Chapter/504209_1_En_1_Fig10_HTML.jpg](img/504209_1_En_1_Fig10_HTML.jpg)


    **图 1-10** 螺旋桨


    ## 结构组件


    以下章节将讨论构成飞行器外形并提供支撑的组件。


    ### 机架


    机架就是飞行器的底盘或机身（图 1-11），其他部件都安装在其上。


    ![../images/504209_1_En_1_Chapter/504209_1_En_1_Fig11_HTML.jpg](img/504209_1_En_1_Fig11_HTML.jpg)


    **图 1-11** 安装有螺旋桨的机架


    ### 减震支架


    减震支架是一种用于吸收或减少飞行器振动对传感器或处理器产生的噪声的结构，从而避免错误的测量或计算错误。


    ### 机械连接件


    显然，所有组件都必须固定，可以是永久性或长期固定（如螺丝），也可以是可更换的或短期固定（如魔术贴、扎带）。


    ## 测量组件


    以下章节将讨论使飞行器能够感知其所在位置的组件。


    ### 多种传感器


    多旋翼飞行器需要 XY 平面上的运动传感器和速度传感器，以及高度传感器，还需要三维旋转速度和角度传感器。它们可以是模拟传感器、数字传感器或串行传感器，甚至可以是机载传感器和外部传感器。最常见的有气压计、`IMU`（惯性测量单元）、陀螺仪、加速度计、`LIDAR`（激光雷达）、摄像头和运动跟踪系统。（更多信息请参见附录）。

    '
- fmt: '### GPS


    Although it is a three-dimensional motion and speed sensor system (translational),
    `GPS` gets its own section because it is widely used by makers and scientists,
    especially in open terrain applications. It is basically a satellite triangulation
    system that is affected by the environment; therefore it is only recommended for
    open space operations.


    ## Command Components


    The following sections discuss the components that allow the vehicle to act and
    be commanded.


    ### Autopilot


    `Autopilot` is the specialized processing unit for unmanned vehicles (see Figure
    [1-12](#504209_1_En_1_Chapter.xhtml#Fig12)). Also, there are some microcontrollers
    or development boards adapted to function as autopilots. They have closed and
    open architectures (see the section about the ways to program a drone in Chapter
    [5](#504209_1_En_5_Chapter.xhtml)).


    ![../images/504209_1_En_1_Chapter/504209_1_En_1_Fig12_HTML.jpg](images/504209_1_En_1_Chapter/504209_1_En_1_Fig12_HTML.jpg)


    Figure 1-12


    Autopilot


    ### Telemetry Modules


    Telemetry modules are units for wireless and remote transmission of information
    (see Figure [1-13](#504209_1_En_1_Chapter.xhtml#Fig13)). They have a limited operating
    range. Telemetry modules can be used to intercommunicate two or more vehicles
    with each other, or a fixed base with one or more drones. They can be used to
    transmit positions taken with a motion capture system to the vehicle. They are
    generally bidirectional modules.


    ![../images/504209_1_En_1_Chapter/504209_1_En_1_Fig13_HTML.jpg](images/504209_1_En_1_Chapter/504209_1_En_1_Fig13_HTML.jpg)


    Figure 1-13


    Telemetry modules


    ### RC Modules


    Unlike telemetry modules, `RC` modules allow for manual control of the drone by
    sticks and buttons. They have a wide operating range and some of them allow video
    transmission. They are usually unidirectional, which means that they have a transmitter
    module and a receiver device. See Figure [1-14](#504209_1_En_1_Chapter.xhtml#Fig14).


    ![../images/504209_1_En_1_Chapter/504209_1_En_1_Fig14_HTML.jpg](images/504209_1_En_1_Chapter/504209_1_En_1_Fig14_HTML.jpg)


    Figure 1-14


    Remote controller and receiver


    ### Companion Computer


    A companion computer is an on-board processing unit that is used to carry out
    demanding tasks which usually go beyond the scope of the autopilot (such as making
    artificial vision or `SLAM`). Examples are the `Raspberry Pi` single-board computer,
    a microcontroller, a microprocessor, or `FPGA`. Basically the autopilot is directly
    used for the flight control and the companion computer is used for indirect tasks
    for that flight.


    ## Power Components


    The following sections discuss the components that energize the vehicle.


    ### Battery/Tethered Supplies


    The use of batteries or tethered supplies to energize the system is evident. Although
    most drones currently employ `LIPO`-type batteries (see Figure [1-15](#504209_1_En_1_Chapter.xhtml#Fig15)
    to the right) for long-term applications, there are available power converters
    or power supplies, which implies a vehicle anchored to an electrical extension.
    Obviously, such an extension entails special use conditions and mobility restrictions.
    The ideal conditions for these power supplies is that they have reduced voltage
    and current ripples, or spikes, at a level that the supplied values are as constant
    as possible. As the batteries have extensive documentation, we are going to talk
    a little more about wired or tethered supplies.


    There are four types of tethered supplies:


    *   **By power supplies**: In this case, the biggest impediment is the cost, since
    a multicopter drone based on brushless motors consumes much more current than
    voltage (a small vehicle easily consumes approximately 12V/60A). In such a way,
    while having a power source that provides said voltage and current, you must consider
    that the cables and wires must be able to deal with these parameters, including
    the fact that a cable that consumes so much current must be physically heavy and
    bulky, and thus not suited for use for high altitudes. Therefore, this option
    is recommended if your application is at laboratory level where the drone barely
    exceeds one and a half meters of elevation.


    *   **By car batteries**: The same thing happens as in the previous case, but
    the cost is slightly reduced considering that car batteries are very commercial
    units. However, a car battery is usually heavy and requires special care for transportation
    and electric charging.


    *   **By power converters**: In this case, it is required to provide medium voltage
    and low current, 400V/3A for example, in order to supply a power converter capable
    of transforming said input into 12V/100A. These power converters are available
    through some manufacturers (`VICOR`, for example). They usually weigh 200g including
    heat sinks and are a viable option for these tethered applications.


    *   **By solar cells**: The restrictions are similar to the previous cases, with
    the implications that such cells have (such as size and power density).


    You could possibly argue that there are fuel-based options because they have decades
    of use in standard helicopters; however, for electric multicopters they still
    have research challenges (with the exception of fuel generators, where a fuel-based
    engine is used as the power source for an electrical plant).


    ### Battery Indicator


    If a battery is used, it is important to have a device that alerts us when said
    battery is about to run out, so the aircraft does not collapse and get damaged.
    Basically they are small voltmeters with light or sound indicators.


    ### Power Distributor


    A power distributor is a device designed to use multiple motors with a single
    power supply. They are basically current dividers either in a harness presentation
    (they consume more space but they are easier to manipulate) or as electronic circuit
    boards (they are reduced in space but they are difficult to manipulate). See Figure
    [1-15](#504209_1_En_1_Chapter.xhtml#Fig15) in the middle.


    ### Power Module


    A power module is a device that enables the autopilot to be powered from the main
    battery. See Figure [1-15](#504209_1_En_1_Chapter.xhtml#Fig15) to the left.


    ![../images/504209_1_En_1_Chapter/504209_1_En_1_Fig15_HTML.jpg](images/504209_1_En_1_Chapter/504209_1_En_1_Fig15_HTML.jpg)


    Figure 1-15


    Power module, power distributor, and battery'
