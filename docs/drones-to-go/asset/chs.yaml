  \ | 编程 | 按代码抽象级别（自然语言与机器语言），也按硬件性能分类 |\n| 停止按钮 | 对用户的可达性、尺寸、颜色、机械抑制 | 可达性级别、编程 |\
  \ 按键开关、摇杆、基于时间或基于事件 |\n| 数据连接器 | 使用的标准及兼容性、使用的工具、速度、电磁屏蔽、市场可用性、引脚数量、是否密封、标准或特殊版本、最大电压和电流、插拔的松紧程度\
  \ | 焊接、更换、编程 | 取决于具体应用 |\n\n#### 表 1-2  \n电源组件及特性\n\n| 电源组件 | 主要特性 | 常见操作 | 类型 |\n\
  | --- | --- | --- | --- |\n| 电池 | 电芯数量、尺寸、重量、安时数、工作电压、C 倍率或放电率、连接器、使用所需配件（充电器） |\
  \ 充电、放电、存储、运输、连接器焊接、并联或串联 | 类型众多，但 LIPO 电池最为常见 |\n| 电源 | 功率、电流、电压、纹波、频率、输入电压（110/220）、相数\
  \ | 若需要则进行滤波、若需要则进行并相、升压或降压、稳压、放电保护、变换（AC-DC） | 开关电源和线性电源 |\n| 电池指示器 | 支持的电芯数量、灯光或声音指示\
  \ | 引脚验证 | 板载式或外接式 |\n| 电源模块 | 支持的最大电流、支持的最大电压、电磁屏蔽、可测量的最大电流、连接器类型 | 若需要则进行电磁屏蔽、若需要则添加电流或电压传感器、若需要则进行并联\
  \ | 用于低电流和高电流 |\n| 电源分配器 | 支持的最大电流、支持的最大电压、供电电机数量、BEC、尺寸、重量、电磁屏蔽类型 | 端子焊接、串联或并联、电磁屏蔽\
  \ | 集线器（线束）或电路板（电路） |\n| 电源连接器 | 支持的最大电流、支持的最大电压、与组件的兼容性、热阻、柔韧性、插拔能力 | 端子焊接、更换 |\
  \ 每种应用都有其特定的连接器组 |\n| 功率级与电调 | 最大尺寸、重量、电流和电压、可逆性、BEC 或光耦隔离 | 配置（通常通过软件界面） | 可逆或不可逆、PWM-RC\
  \ 或 PWM 占空比、标准或光耦隔离、适用于无刷或有刷电机 |\n\n现在你已经了解了关于无人机组件的基础概念，接下来看看如何选择它们。\n\n## 组件选择\n\
  \n按照推荐的设计流程，这一过程分为三个子过程（为便于分析，假设使用的是无刷电机，因为这是四轴飞行器中最常用的类型）。\n\n### 飞行器选择\n\n飞行器选择是一个迭代过程，包括：\n\
  \n1. 选择电机。电机是根据飞行器期望的运行重量和速度来选择的。因此，你必须查阅数据手册中的两个重要参数：每个电机能提升的最大重量，以及其最大转速值（在无刷电机中，这被称为`kv`值，注意不要与电机的机电常数混淆）。\n\
  \n2. 根据上述内容（即飞行器的负载能力和速度），选择螺旋桨。\n\n3. 选定电机和螺旋桨后，选择电调。同样，在无刷电机的数据手册中，你可以找到这些运行条件所需的电流和电压。这有助于选择合适的电调。建议电调的电流容量比其对应电机消耗的电流高出\
  \ 30%，以克服功率损耗。\n\n4. 结合上一点以及自动驾驶仪、辅助电机等其他组件的需求，选择合适的电池或电源。\n\n5. 考虑所有组件的尺寸和最终重量（可以通过查阅飞行器每个元件的单独数据手册来计算），然后选择机架。\n\
  \n6. 考虑最终重量后，你必须返回步骤 1，验证电机是否仍能满足你的要求。如果不能，则必须重复设计过程。\n\n\n\n### 遥控器选择\n\n遥控器是与飞行员直接连接的设备，前提是你希望进行手动干预或至少拥有一个由人类控制的紧急停止装置。选择流程如下：\n\
  \n1. 操控四轴飞行器所需的最少通道数为四个（`X`、`Y`、`Z`和偏航角）。对于其他类型的载具，例如汽车，则只需两个通道（前进和转向）。但你必须考虑是否需要紧急停止功能、一个可用于开启和关闭夹具的按钮。这些任务中的每一个至少都需要一个独立的辅助通道。因此，通常会使用六通道、八通道或十通道的无线电遥控器。这些额外的通道可以是摇杆、按钮或旋钮，并且可以通过组合逻辑和激活状态来使用（如需了解更多关于状态机的信息，请参阅我关于`Ardupilot`的书籍以及附录中提供的其他参考资料）。\n\
  \n2. 一旦你确定了所需的通道数量，接下来要确定的是遥控器允许操作员与载具之间的最大距离。这将决定载具与人类交互的操作区域，并进而影响无人机在紧急情况下是否可回收。\n\
  \n3. 接下来是一些操作上的主观细节，包括自问：遥控器上是否需要摄像头显示器？是否希望用同一个遥控器操控多个载具？等等。\n\n4. 下一步是确定你需要使用载具多长时间，因为这会影响遥控器电池的续航能力。因此，对于长时间工作，建议使用带有\
  \ LIPO 电池接口的遥控器。\n\n5. 最后，你必须确认自动驾驶仪和遥控器接收机具有`PPM`端口。否则，你必须购买相应的适配器。\n\n### 自动驾驶仪选择\n\
  \n自动驾驶仪的选择取决于你的编程技能，以及你希望与载具的交互深度。\n\n1. 如果你不需要编程执行专门任务，购买一架通用无人机就足够了。\n\n2. 如果需要更专门的任务，但你不懂如何编程，则建议购买一个允许你使用图形用户界面（GUI，如`Mission\
  \ Planner`）的自动驾驶仪。这里推荐使用的自动驾驶仪是`Pixhawk`。\n\n3. 如果你会编程，并且希望在无需专注于载具设计的情况下设计自己的任务，建议使用简化版的\
  \ SDK，例如`Dronekit`。这个 SDK 要求你掌握`Python`语言编程技能，但它允许将载具视为一个可在`X`、`Y`、`Z`方向上移动并绕自身轴旋转的质点。这里同样推荐使用`Pixhawk`。\n\
  \n4. 如果你（在上述基础上）还希望在预设计的载具上设计或测试控制律，那么你需要使用扩展 SDK。这类 SDK 允许以质点模式操控载具，但交互方式是通过力和力矩，而不仅仅是定义轨迹。例如，适用于`Pixhawk`自动驾驶仪的`Bebop\
  \ Autonomy SDK`或`Simulink`库。\n\n5. 如果你在第 4 点的基础上，正在设计一个实验性载具，或一个超出扩展 SDK 兼容标准型号范围的载具，那么你需要一个兼容完整\
  \ SDK 的自动驾驶仪。这类 SDK 的示例包括`Ardupilot`库和`PX4`库。同样，这里可以使用`Pixhawk`自动驾驶仪。\n\n6. 如果除了第\
  \ 5 点所述的之外，你还必须执行其他专门任务，例如使用人工智能视觉，则强烈建议你使用一个伴随计算机与自动驾驶仪协同工作。例如，你可以使用一个搭载`ROS`系统的`Raspberry\
  \ Pi`、`Odroid`或笔记本电脑来执行人工智能视觉算法，同时结合`Pixhawk`执行飞行算法。或者，更佳方案是使用一个将自动驾驶仪和伴随计算机整合在一起的嵌入式单元，例如`NavIO`板卡或`ErleBrain`。\n\
  \n请注意，在选择过程中向前推进，也意味着从爱好者用户向科研用户的转变，这需要对编程、控制和数学建模有更深入的理解，但作为回报，你将拥有进行整体设计的能力，而不仅仅是在选择少数几个参数时受到限制。\n\
  \n你已经了解了这些组件以及如何选择它们。现在是时候学习如何组装它们了。\n\n## 组件连接\n\n本节将说明如何连接无人机的各个组件。这可以帮助你避免在机械、电气和控制层面常见的装配错误。\n\
  \n### 机械连接\n\n机械连接的主要元件是机架，其余所有组件都安装在其上。见图 1-16。\n\n![../images/504209_1_En_1_Chapter/504209_1_En_1_Fig16_HTML.jpg](img/504209_1_En_1_Fig16_HTML.jpg)\n\
  \n图 1-16：机械连接\n\n### 电气连接\n\n这里的中心元件是电池或电源。请注意，电机并非直接连接到该电源。见图 1-17。\n\n![../images/504209_1_En_1_Chapter/504209_1_En_1_Fig17_HTML.jpg](img/504209_1_En_1_Fig17_HTML.jpg)\n\
  \n图 1-17：电气连接\n\n### 控制连接\n\n这里的中心元件是自动驾驶仪。在此层面，还包含了用户界面或与地面辅助计算机的接口。见图 1-18。\n\n\
  ![../images/504209_1_En_1_Chapter/504209_1_En_1_Fig18_HTML.jpg](img/504209_1_En_1_Fig18_HTML.jpg)\n\
  \n图 1-18：控制连接\n\n## 总结\n\n在本章中，你学习了设计无人机的组件知识，特别侧重于四轴飞行器，但这些知识也可扩展到其他类型的飞行器，包括它们的历史背景、词源学，以及为你的作品选择名称时最常见的搜索结果。你还了解了适合你活动的无人机类型、一些通用的安全措施，以及用于无人机及其组件建模和设计的、最广泛使用的国际标准。在组件方面，你学习了有用的分类、最常见的特性和流程，以及它们的连接和选择方法。我们邀请你查阅附录中的精选参考文献，以完善你在相应主题上的知识。在下一章中，你将学习无人机建模，这对于许多类型的空中载具也很有用。\n\
  \n\n\n"
- '# 2. 建模


  本章重点介绍无人机的建模。你将学习参考系、运动学、动力学、推进或分配模型以及线性建模注意事项。最终，你将能够对无人机进行建模，并将这些知识扩展到其他类型的运载器和飞行器。


  关于空气动力学，我们不会涉及这些主题，因为本书所分析运载器的设计大多是垂直起降类型，并且相对于其他类型的运载器（例如飞机和有人驾驶飞行器），它们运行时的速度较低、重量较轻和/或尺寸面积较小。见图
  2-1。


  你可能注意到，多旋翼飞行器需要推力分量来实现其运动（这被称为推力矢量控制）。因此，我们将在附录中将空气动力学分析分为两个有用的部分。其中一部分是关于计算无人机最大速度，可用于比赛用无人机的设计。另一部分是关于如何将本书的知识扩展到其他类型的飞行器。在这些部分中，你将运用本章学到的知识，并通过引入空气动力学效应来加以扩展。


  由于旋转速度高而对空气动力学效应影响显著的元件是螺旋桨。然而，此处将不予以考虑，因为假设你不会自己制造螺旋桨，而是会购买它们（但如果需要，你可以在附录的参考文献部分阅读更多关于其设计的内容）。同时还假设，你的飞行器大部分时间都飞行在距离地面、墙壁甚至其他物体和运载器相当远的地方；否则，你可以在附录中阅读关于限制条件的相关信息。


  让我们从建模参考系的描述开始。


  ![../images/504209_1_En_2_Chapter/504209_1_En_2_Fig1_HTML.jpg](img/504209_1_En_2_Fig1_HTML.jpg)


  图 2-1


  作用在飞机和等效四轴飞行器上的通用力


  ## 建模参考系


  你很快会看到，与四轴飞行器相关联的有三个建模参考系。所述运载器的建模在混合参考系中进行，并以便于传感器和数学运算的方式完成。这些参考系是世界参考系、飞行器参考系和电机参考系，它们如图
  2-2 所示。


  ![../images/504209_1_En_2_Chapter/504209_1_En_2_Fig2_HTML.jpg](img/504209_1_En_2_Fig2_HTML.jpg)


  图 2-2


  建模参考系


  *   世界参考系（或基座参考系，或固定参考系，或惯性参考系）表示一个固定的坐标系。飞行器相对于这个固定参考系运动。这可以是一个全球地理参考系，例如地球极点、一个简单的角落或房间的中心。


  *   飞行器参考系（或机体参考系，或移动参考系，或非惯性参考系）表示通常位于飞行器上某个感兴趣点（几何中心、质量中心、重力中心或浮力中心等）的坐标系。相对于这个参考系和固定参考系来测量平移和旋转。


  *   最后，电机参考系（或推进参考系，或执行器参考系，或分配参考系）是放置在每台电机上的各个参考系。它们的功能是将每台电机的力和扭矩分配到飞行器的参考系。


  请注意，为了便于计算，在尽可能的情况下，世界参考系和飞行器参考系各自对应的 `Z` 轴通常平行放置。这是因为四轴飞行器的设计允许这样做，并且正如你稍后将看到的，还因为出于平稳飞行的考虑（在具有更先进机动性的运载器中，例如全向型运载器，这种对所述轴的选择简化是不可行的）。


  接下来我们进入无人机的运动学部分。首先，我们将考虑平移运动学。




  '
- '# 平移运动学


  假设我们想要将世界坐标系与飞行器坐标系关联起来。尽管这乍看之下很简单，但必须记住，所有概念的关联都应在无偏的参考空间中进行。


  为此，想象一下，在教室里，学生们被要求指出一只在白板上爬行的昆虫相对于他们自身所在位置的位置，如图 2-3 所示。


  ![../images/504209_1_En_2_Chapter/504209_1_En_2_Fig3_HTML.jpg](img/504209_1_En_2_Fig3_HTML.jpg)


  **图 2-3** 物体相对于外部观测者的运动与位置


  如你所见，每个人对昆虫的位置都会有不同的感知，他们会给出一个取决于自身所处位置的结果。然而，无论身处何位，每个人都能指出昆虫正在沿所示方向移动。因此，在那个教室里，对于所有人而言，一个无偏的元素就是昆虫的运动，而这个运动与其速度有关。


  这表明，如果世界坐标系相对于飞行器放置在不同的位置，如图 2-4 所示，那么坐标系之间的不变量关系将不在位置层面，而在速度层面（作为一个向量），这对于放置在每个世界坐标系中的观测者或传感器都是成立的。


  ![../images/504209_1_En_2_Chapter/504209_1_En_2_Fig4_HTML.jpg](img/504209_1_En_2_Fig4_HTML.jpg)


  **图 2-4** 无人机相对于不同世界坐标系的运动与位置


  从前面的图中可以看出，在每个坐标系中对飞行器运动的感知并不会因坐标系之间的距离而改变。然而，如图 2-5 所示，将其中两个坐标系叠加时，可能会注意到其各自坐标轴在方向上的影响。因此，为了关联它们，需要在坐标系的各自坐标轴之间找到一个三角投影。在三维模式下，这归结为寻找旋转矩阵（注意使用了牛顿的记号，即一个带有点的字母或符号；这表示一阶导数，在我们这里表明这是速度坐标系或速度之间的关系，如前所述）。


  ![../images/504209_1_En_2_Chapter/504209_1_En_2_Fig5_HTML.jpg](img/504209_1_En_2_Fig5_HTML.jpg)


  **图 2-5** 机体坐标系与世界坐标系重叠


  在旋转矩阵的家族中，为了满足 ISO 1151–2: 1985 标准，本文采用横滚、俯仰和偏航的欧拉角序列，即所谓的泰特-布莱恩角。其定义如下：


  ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figb_HTML.jpg](img/504209_1_En_2_Figb_HTML.jpg)


  ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figc_HTML.jpg](img/504209_1_En_2_Figc_HTML.jpg)


  请记住，各个旋转的定义如下（注意枢轴即为旋转轴）：


  ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figd_HTML.jpg](img/504209_1_En_2_Figd_HTML.jpg)


  这里有个很好的问题：为什么这些旋转的序列是乘法而不是加法？至少从数学一致性的角度来看，答案很简单。每个旋转矩阵必须是正交归一化的，因为其每一列都代表单位向量，这些向量的分量在
  0 到 1 之间变化，并描述了相互垂直的坐标轴（若要验证此性质，请查阅推荐的关于线性代数和旋转矩阵的文献）。因此，如果我们对它们进行加法运算，结果中的元素有可能会超过单位值；而如果我们进行乘法运算，由于它们是分数、零或一，结果仍将是分数、零或一。因此，连续旋转矩阵序列的复合必须是乘法的。


  请注意，我们使用的一组方程在速度层面和力层面都是有效的。这一表述将在后续章节中使用，而追求严谨的读者可以在大量文献中找到其证明和基础，这可以看作是达朗贝尔原理和虚功原理（也称为最小作用量原理）的应用。


  接下来，你将学习无人机的旋转运动学。




  '
- '# 旋转运动学


  考虑到存在通过旋转直接关联的参考系，获取平移运动学相对容易。然而，对于旋转变量来说情况并非如此（注意，我们通过欧拉角获得了关于世界坐标系的角信息，但并未直接在机体或飞行器坐标系中获得角信息）。为了推导运动学，有必要利用旋转矩阵的数学性质。


  旋转矩阵必须满足正交归一化原则。这意味着以下内容：


  ![../images/504209_1_En_2_Chapter/504209_1_En_2_Fige_HTML.jpg](img/504209_1_En_2_Fige_HTML.jpg)


  如前所述，在速度层面建立坐标系之间关系是最客观的分析方法。速度（以及由此产生的速率）由位置导数得到，因此直觉上首先会对上述方程进行求导。注意这是对时间的导数，因此如果旋转矩阵在求导时依赖于欧拉角，那么这些欧拉角的角速率就会出现（链式法则）。同时也要注意，利用乘积求导法则（矩阵乘积）和常数求导法则（单位矩阵），可以得到以下结果：


  ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figf_HTML.jpg](img/504209_1_En_2_Figf_HTML.jpg)


  利用前一方程第二项中关于转置矩阵的以下性质：


  ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figg_HTML.jpg](img/504209_1_En_2_Figg_HTML.jpg)


  并将此性质代入替换，我们得到：


  ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figh_HTML.jpg](img/504209_1_En_2_Figh_HTML.jpg)


  从这个结果中引出了一类特殊的矩阵，称为反对称矩阵或斜对称矩阵。它们满足以下条件：


  ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figi_HTML.jpg](img/504209_1_En_2_Figi_HTML.jpg)


  因此，以下项确实是一个斜对称矩阵：


  ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figj_HTML.jpg](img/504209_1_En_2_Figj_HTML.jpg)


  这有什么用呢？


  斜对称矩阵与叉积的表示相关联。假设我们有两个向量：


  ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figk_HTML.jpg](img/504209_1_En_2_Figk_HTML.jpg)


  这样，一个反对称矩阵（此处是与向量 `a` 关联的矩阵）按所示方式将向量信息分布在其元素中。


  关于该方程用途的问题仍然悬而未决，现在就来解答。只需记住斜对称矩阵的概念及其与叉积的关系。


  假设图 2-6 中的汽车仅围绕其 `Zb` 轴旋转，角速度等于 `theta` 的导数。注意，世界坐标系的 `Z` 轴与机体坐标系（`Zb`）平行（两者均指向您）。


  ![../images/504209_1_En_2_Chapter/504209_1_En_2_Fig6_HTML.jpg](img/504209_1_En_2_Fig6_HTML.jpg)


  **图 2-6** 轮式车辆的机体坐标系及其与世界坐标系的关系


  对于这个例子，显然机体坐标系中 `Z` 轴的角速度等于在固定坐标系中测量的 `theta` 的导数（再次重申，因为它们是平行轴）。


  ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figl_HTML.jpg](img/504209_1_En_2_Figl_HTML.jpg)


  因此，我们可以通过斜对称方程得到相同的结果：


  ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figm_HTML.jpg](img/504209_1_En_2_Figm_HTML.jpg)


  ![../images/504209_1_En_2_Chapter/504209_1_En_2_Fign_HTML.jpg](img/504209_1_En_2_Fign_HTML.jpg)


  根据斜对称矩阵元素的定义，我们可以得出：


  ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figo_HTML.jpg](img/504209_1_En_2_Figo_HTML.jpg)


  然后，利用欧拉复合旋转矩阵，通过执行上述步骤以及相应的简化，可以得到以下结果（这是一个有趣的练习，您可以推导出这些方程的完整序列；记住旋转矩阵的导数是对时间的导数，也记住全微分的概念）：


  ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figp_HTML.jpg](img/504209_1_En_2_Figp_HTML.jpg)


  其中


  ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figq_HTML.jpg](img/504209_1_En_2_Figq_HTML.jpg)


  这建立了机体坐标系角速度与固定坐标系角速度之间的关系。记住，固定坐标系是用欧拉角表示的。


  对于更偏好几何而非推导方程的人来说，在附录中提到的 Beedford 的书中，也有一种易于理解且直观的推导方法来获得这种速度关系。


  另请注意，这些旋转正交归一化约束的施加，赋予了无人机所谓的非完整特性（在平滑或线性飞行模式下，这一点并不明显，您很快会看到）。


  最后，观察引入了（`p` `q` `r`）这种命名法。这常用于飞机，当然也用于多旋翼飞行器。


  现在您已经了解了无人机的运动学，接下来可以研究动力学了，但在此之前，我们先简要介绍一下作用在无人机及其螺旋桨上的力。


  '
- '# 作用在多旋翼飞行器及其螺旋桨上的力


  在推导动力学方程之前，方便先推导出作用于多旋翼飞行器上的基本力。空气动力学效应可以加入，但由于它们在室外和室内操作中会发生变化，甚至在靠近或远离地面时也不同，因此这些被视为非通用内容，可在其他著作或附录（见无人机最大速度）中简要查阅。


  作用在无人机上最明显的力是重力。假设飞行器平衡良好，并且该力直接位于重心或几何中心（对于这类飞行器，期望两者重合）。见图 2-7。


  ![../images/504209_1_En_2_Chapter/504209_1_En_2_Fig7_HTML.jpg](img/504209_1_En_2_Fig7_HTML.jpg)


  **图 2-7** 作用在无人机上的重力




  '
- '# 螺旋桨受力分析


  下一步是分析单个螺旋桨的受力情况。请注意，此分析针对双叶螺旋桨进行，但可通过相应的三角函数投影推广至更多桨叶的情况。


  首先考虑的是，每片桨叶上的推力可等效为作用于该桨叶某一点上的力。在图 2-8 中，这些力分别标注为 `FL`（即左侧）和 `FR`（即右侧）。其次要假定螺旋桨已完全平衡，这意味着螺旋桨中心到每片桨叶分析点的距离相同（即半径
  `r`）。


  ![../images/504209_1_En_2_Chapter/504209_1_En_2_Fig8_HTML.jpg](img/504209_1_En_2_Fig8_HTML.jpg)


  图 2-8

  作用于螺旋桨桨叶的力及其力臂


