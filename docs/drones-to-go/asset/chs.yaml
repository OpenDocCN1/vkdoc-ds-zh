  图 2-9

  用于分析的螺旋桨坐标系


  下一步，将每片桨叶上的力分解为垂直和水平分量（分别标注为 `Z` 和 `H`）。请参见图 2-10。


  ![../images/504209_1_En_2_Chapter/504209_1_En_2_Fig10_HTML.jpg](img/504209_1_En_2_Fig10_HTML.jpg)


  图 2-10

  作用于每片桨叶的力的分量


  接下来，我们将计算三个相应轴（`X`、`Y`、`Z`）上的合力与合力矩。由于假定每片桨叶具有对称性和平衡性，可建立以下等式：


