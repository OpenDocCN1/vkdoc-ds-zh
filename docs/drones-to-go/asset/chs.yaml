  ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figx_HTML.jpg](img/504209_1_En_2_Figx_HTML.jpg)


  请注意，在某些条件下，这些力是存在的，并且无法从模型中消除。然而，这些效应通常出现在大型飞行器中，可以通过数学变换或控制补偿来简化。参见附录中的 Reza-Olfati
  文章。


  我们继续讨论扭矩。首先要做的是确定正旋转方向，如图 2-16 所示。


  ![../images/504209_1_En_2_Chapter/504209_1_En_2_Fig16_HTML.jpg](img/504209_1_En_2_Fig16_HTML.jpg)


  **图 2-16**

  每个螺旋桨相对于四轴飞行器中心产生的力和扭矩，以及本次分析中的正旋转方向


