- '# 无人机几何控制导论（推进器与导引矢量）


  前一案例基于三角函数原理。本节将介绍一种更高级的、基于旋转矩阵理论的控制器。


  此处的飞行器将不再配备导引矢量和三个方向舵（如前一案例中，`psi` 被视为独立方向舵，`phi` 和 `theta` 亦然）。在本节案例中，飞行器将配置一个导引矢量和三个推进器，参见图
  3-15。想象我们通过指令将机载的“方向盘”或“方向舵”替换为控制前后、上下和左右运动的“推进器”。这种技术在机器人领域也广泛应用，并关联着用于通过三个正交矢量修正或描述物体姿态的
  **noa** 矢量；其中两个矢量可设计，仅一个矢量独立于其他两者。


  ![../images/504209_1_En_3_Chapter/504209_1_En_3_Fig15_HTML.jpg](img/504209_1_En_3_Fig15_HTML.jpg)


  图 3-15

  几何控制图示


  注意，**noa** 矢量因其在机械臂操作中的应用而得名，尤其在机械爪或机器人手中：**a** 是表示机械爪接近方向的单位矢量，**n** 是相对于 **a**
  的法向矢量，**o** 则是同时垂直于 **a** 和 **n** 的矢量，用于确定机械爪的朝向。参见图 3-16。


  ![../images/504209_1_En_3_Chapter/504209_1_En_3_Fig16_HTML.jpg](img/504209_1_En_3_Fig16_HTML.jpg)


  图 3-16

  **noa** 矢量在机械臂中的图示


  本节要求你熟练掌握以下工具（所有有用的属性会在使用时注明，但你仍需自行详细了解）：度量空间中的范数与距离（绝对值、二次距离等）；矩阵不变量（迹、行列式等）；旋转矩阵及其导数性质；矩阵的转置及其性质；矩阵的迹；以及叉积的等价矩阵表示——帽子积及其逆运算——倒
  V 积。


  让我们从平移部分开始。


  ## 平移控制


  该控制方法采用基于旋转矩阵的替代运动学表示，并使用了非线性化的通用动力学模型。如下所示：


  ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figcc_HTML.jpg](img/504209_1_En_3_Figcc_HTML.jpg)


  不再使用 Tait-Bryan 角运动学（该情形下控制基于三角函数），此处的运动学模型基于旋转矩阵，而控制基于这些矩阵的性质。


  两者之间的等价关系其实非常简单。只需记住，从 `S` 矩阵中，你可以得到机体坐标系下的角速度分量，以及它们与世界坐标系下滚转、俯仰、偏航角速度之间的关系（这在上一章中已有证明）：


  ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figcd_HTML.jpg](img/504209_1_En_3_Figcd_HTML.jpg)


  你可能会问，将模型从基于方向舵的操作改为基于推进器的操作有何优势。我们预先告知你，当机体角度较大时（这与我们此前所有设计中假设的平稳飞行模式相反），这种变换极为有用。换句话说，它适用于剧烈和特技飞行动作。


  根据上一段所述，注意我们无法直接使用欧拉角进行运算，而只能通过其等效旋转矩阵间接地工作。


  平移动力学控制运用了一个在控制理论中称为“湮灭器”的概念。注意，在我们所依据的 Tae Young Lee 的文章（参见附录）中，坐标轴的方向与我们此处采用的正值方向相反。请记下这些反转的坐标轴，以便在本文与上述文章之间进行对照。


  一个包含导引矢量信息的推力控制器如下：


  ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figce_HTML.jpg](img/504209_1_En_3_Figce_HTML.jpg)


  注意这里存在点积，因为 `FBZ` 是一个标量。同时注意单位矢量 `[0 0 1]` 的存在。这就是 `FBZ` 在无人机坐标系中的位置。


  前述旋转矩阵的一个约束条件是：


