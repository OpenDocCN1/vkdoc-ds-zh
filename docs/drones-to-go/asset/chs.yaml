  一种方法是应用方向导数的概念（这里我们将使用一种称为平凡化右导数的方向导数），并考虑到我们的距离是一个多变量的标量函数，当我们进行方向求导时，我们将得到一个向量表达式，其方式类似于我们对两个向量之间的距离应用梯度（`nabla`）时得到的结果。


