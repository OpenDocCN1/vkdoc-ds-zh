  从上图可知，垂直方向的受力分析较为简单。请注意，增加桨叶数量会增加飞行器的负载能力（正如预期，每片桨叶都充当一个支撑轴）。


  ![../images/504209_1_En_2_Chapter/504209_1_En_2_Figs_HTML.jpg](img/504209_1_En_2_Figs_HTML.jpg)


  在 `X`、`Y` 轴上的分析是相同的，为此我们将利用螺旋桨的径向对称性（对奇数桨叶的分析会变得非常有趣，因为需要用到三角函数投影，但最终结果必须一致）。


  假设此时螺旋桨位于 `X` 轴或 `Y` 轴上，如图 2-11 所示。


