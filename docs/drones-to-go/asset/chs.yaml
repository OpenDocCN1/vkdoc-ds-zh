- "# 李雅普诺夫稳定性简介\n\n本节适用于希望进一步了解前述文章中基于李雅普诺夫稳定性理论的扩展形式证明的读者，这些内容是对上节的补充。李雅普诺夫方法共有两种，一种针对线性系统，另一种针对非线性系统。考虑到第二种方法的适用范围更广，且线性系统只是其中的一个特例，我们将通过示例简要说明其用法，并给出图形化解释。\n\
  \n## 第一步\n\n给定一个系统，例如不含控制输入的一阶系统和阻尼谐振子。请记住，正如前文所述，我们是在对动态系统施加闭环控制器后得到这些系统的。\n\n\
  ![../images/504209_1_En_3_Chapter/504209_1_En_3_Figej_HTML.jpg](img/504209_1_En_3_Figej_HTML.jpg)\n\
  \n可以提出一种虚拟能量。这是一个关于多个变量的标量函数，除了在其最小值处（零值，或完全静止条件，或稳定条件）之外，该函数始终为正。通常情况下，该函数取决于我们正在分析的变量。\n\
  \n![../images/504209_1_En_3_Chapter/504209_1_En_3_Figek_HTML.jpg](img/504209_1_En_3_Figek_HTML.jpg)\n\
  \n对于第一个系统，满足上述条件的函数如下所示（注意其图形表示是一个凹抛物线）：\n\n![../images/504209_1_En_3_Chapter/504209_1_En_3_Figel_HTML.jpg](img/504209_1_En_3_Figel_HTML.jpg)\n\
  \n对于第二个系统，另一个满足这两个条件的函数示例如下（其图形表示是一个同样凹陷的椭圆抛物面）：\n\n![../images/504209_1_En_3_Chapter/504209_1_En_3_Figem_HTML.jpg](img/504209_1_En_3_Figem_HTML.jpg)\n\
  \n从现在起，请注意李雅普诺夫函数通常用字母 `V` 表示（这可能是因为 `V` 看起来像一个凹函数的图形表示）。此外，请注意这些函数经常被除以 2，以便在对李雅普诺夫平方函数求导时避免出现因子\
  \ 2。\n\n观察可知，李雅普诺夫函数通常具有图 3-21 所示的形状（至少当它仅依赖一个或两个变量时可以这样表示）。它们看起来像凹形容器，但不一定都是弯曲的。有些看起来像倒金字塔（该概念可以扩展到多于两个变量的情况）。\n\
  \n![../images/504209_1_En_3_Chapter/504209_1_En_3_Fig21_HTML.jpg](img/504209_1_En_3_Fig21_HTML.jpg)\n\
  \n**图 3-21**  \n李雅普诺夫函数的三维示例\n\n## 第二步\n\n李雅普诺夫函数对时间的导数必须为负，或至少为半负定，并且必须依赖于我们关心的一个或多个变量。这与图形类比密切相关。请记住，李雅普诺夫函数是凹的封闭容器，从其表面上任意一点观察，其斜率均为负。见图\
  \ 3-22。这意味着，\"放置\"在该能量表面上的系统状态将\"滑向\"表面的最低点，即稳定条件或零能量状态，简单来说，系统将在能量的最小值处停止。\n\n\
  ![../images/504209_1_En_3_Chapter/504209_1_En_3_Fig22_HTML.jpg](img/504209_1_En_3_Fig22_HTML.jpg)\n\
  \n**图 3-22**  \n李雅普诺夫函数的导数（三维和二维示例）\n\n![../images/504209_1_En_3_Chapter/504209_1_En_3_Figen_HTML.jpg](img/504209_1_En_3_Figen_HTML.jpg)\n\
  \n对于一阶系统：\n\n![../images/504209_1_En_3_Chapter/504209_1_En_3_Figeo_HTML.jpg](img/504209_1_En_3_Figeo_HTML.jpg)\n\
  \n并将该李雅普诺夫函数所针对的系统代入：\n\n\n\n该导数为半负定，且完全或部分依赖于我们所关注的状态。\n\n对于阻尼谐振子系统，我们有\n\n![../images/504209_1_En_3_Chapter/504209_1_En_3_Figeq_HTML.jpg](img/504209_1_En_3_Figeq_HTML.jpg)\n\
  \n并将该李雅普诺夫函数所设计的系统代入：\n\n![../images/504209_1_En_3_Chapter/504209_1_En_3_Figer_HTML.jpg](img/504209_1_En_3_Figer_HTML.jpg)\n\
  \n该导数为半负定，且完全或部分依赖于我们所关注的状态。（在这种情况下，它不依赖于误差，而是依赖于误差的导数。稍后我们将看到如何处理这个问题。）\n\n如果我们对一阶系统提出了\n\
  \n![../images/504209_1_En_3_Chapter/504209_1_En_3_Figes_HTML.jpg](img/504209_1_En_3_Figes_HTML.jpg)\n\
  \n那么只要常数 `Kp` 为正，李雅普诺夫函数的导数就不会改变其负定性，李雅普诺夫函数也不会改变其正定性。你很快就会记住这个事实。\n\n请注意，我们只能说明李雅普诺夫导数所依赖的那些状态会趋向于李雅普诺夫函数的最小能量行为；也就是说，它们趋向于\
  \ 0。如果其余的状态没有出现，我们就无法对它们做出任何保证，并且必须设计并尝试一个新的李雅普诺夫函数。\n\n### 步骤 3\n\n通过使用辅助假设，即所谓的\
  \ Barbalat 引理或 Lasalle 原理（它们根据你所拥有的系统类型来使用，因此你必须研究它们），当 `V` 及其导数为零时，必须评估系统的状态是否也趋向于零。这是因为可能会出现局部谷底，如图\
  \ 3-23 所示。在这些谷底中，能量值为零，但系统不会达到李雅普诺夫函数的最小值，而是陷入局部陷阱。\n\n![../images/504209_1_En_3_Chapter/504209_1_En_3_Fig23_HTML.jpg](img/504209_1_En_3_Fig23_HTML.jpg)\n\
  \n**图 3-23**  \n李雅普诺夫函数中的局部和全局最小值\n\n对于第一个例子，让我们看看当 `V` 的导数为零时会发生什么：\n\n![../images/504209_1_En_3_Chapter/504209_1_En_3_Figet_HTML.jpg](img/504209_1_En_3_Figet_HTML.jpg)\n\
