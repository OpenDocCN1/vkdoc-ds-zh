  结果是一个数组，其中包含每个观测值对应于响应变量*y* = 1 的概率。通过将该概率与阈值 0.5 进行比较，我们可以生成响应变量二元值的预测结果：


  ```

  In [103]: df_new["P-Species"].head(3)

  Out[103]: 0    0.995472

  1    0.799899

