  对于*仅有*不等式约束的优化问题，`SciPy` 提供了一种使用线性逼近约束优化（COBYLA）方法的替代求解器。该求解器可以通过 `optimize.fmin_cobyla`
  或指定 `method=''COBYLA''` 的 `optimize.minimize` 来访问。前面的例子只需将 `method=''SLSQP''` 替换为
  `method=''COBYLA''`，即可使用此求解器求解。


  ### 线性规划


  在上一节中，我们讨论了处理非常通用的优化问题的方法，其中目标函数和约束函数都可以是非线性的。然而，此时有必要退后一步，考虑一种更为受限的优化问题，即*线性规划*，其中目标函数是线性的，所有约束都是线性等式或不等式约束。这类问题的通用性显然要低得多，但事实证明，线性规划有许多重要的应用，并且它们的求解效率远高于通用的非线性问题。原因在于，线性问题具有的特性使得我们可以使用完全不同的方法。特别是，线性优化问题的解必然位于约束边界上，因此仅搜索线性约束函数交点的顶点就足够了。这在实践中可以高效地完成。针对这类问题，一种流行的算法称为*单纯形法*，它系统地从一个顶点移动到另一个顶点，直到找到最优顶点。还有更新的内点法可以高效地求解线性规划问题。使用这些方法，可以轻松求解具有数千个变量和约束的线性规划问题。


  线性规划问题通常写成所谓的标准形式：![$$ {\min}_x{c}^Tx $$](img/332789_2_En_6_Chapter_TeX_IEq12.png)
  其中 `Ax` ≤ `b` 且 `x` ≥ 0。此处 `c` 和 `x` 是长度为 `n` 的向量，`A` 是一个 `m` × `n` 矩阵，`b` 是一个 `m`
  维向量。例如，考虑在满足三个不等式约束 `x[0] + x[1] ≤ 1`、`-x[0] + 3*x[1] ≤ 2` 和 `-x[1] + x[2] ≤ 3`
  的条件下，最小化函数 `f(x) = -x[0] + 2*x[1] - 3*x[2]` 的问题。在标准形式中，我们有 `c = (-1, 2, -3)`，`b
  = (1, 2, 3)`，以及


  ![$$ A=\left(\begin{array}{ccc}1&amp; 1&amp; 0\\ {}-1&amp; 3&amp; 0\\ {}0&amp; -1&amp;
  1\end{array}\right). $$](img/332789_2_En_6_Chapter_TeX_Equh.png)


  为了解决这个问题，我们在此使用 `cvxopt` 库，它通过 `cvxopt.solvers.lp` 函数提供了线性规划求解器。该求解器期望的参数顺序是前文介绍的标准形式中使用的
  `c`、`A` 和 `b` 向量及矩阵。`cvxopt` 库使用自己的类来表示矩阵和向量，但幸运的是，它们可以通过数组接口 ^(³⁴) 与 NumPy 数组互操作，因此可以使用
  `cvxopt.matrix` 和 `np.array` 函数进行形式转换。由于 NumPy 数组是科学 Python 环境中事实上的标准数组格式，合理的做法是尽可能使用
  NumPy 数组，仅在必要时（即在调用 `cvxopt.solvers` 中的求解器之前）才转换为 `cvxopt` 矩阵。


  因此，为了使用 `cvxopt` 库求解上述示例问题，我们首先为 `A` 矩阵以及 `c` 和 `b` 向量创建 NumPy 数组，然后使用 `cvxopt.matrix`
  函数将其转换为 `cvxopt` 矩阵：


  ```python

  In [96]: c = np.array([-1.0, 2.0, -3.0])

  In [97]: A = np.array([[ 1.0, 1.0, 0.0],

  [-1.0, 3.0, 0.0],

  [ 0.0, -1.0, 1.0]])

  In [98]: b = np.array([1.0, 2.0, 3.0])

  In [99]: A_ = cvxopt.matrix(A)

  In [100]: b_ = cvxopt.matrix(b)

  In [101]: c_ = cvxopt.matrix(c)

  ```


  现在，可以将与 `cvxopt` 兼容的矩阵和向量 `c_`、`A_` 和 `b_` 传递给线性规划求解器 `cvxopt.solvers.lp`：


  ```python

  In [102]: sol = cvxopt.solvers.lp(c_, A_, b_)

  Optimal solution found.

  In [103]: sol

  Out[103]: {''dual infeasibility'': 1.4835979218054372e-16,

  ''dual objective'': -10.0,

  ''dual slack'': 0.0,

  ''gap'': 0.0,

  ''iterations'': 0,

  ''primal infeasibility'': 0.0,

  ''primal objective'': -10.0,

  ''primal slack'': -0.0,

  ''relative gap'': 0.0,

  ''residual as dual infeasibility certificate'': None,

  ''residual as primal infeasibility certificate'': None,

  ''s'': ,

  ''status'': ''optimal'',

  ''x'': ,

  ''y'': ,

  ''z'': }

  In [104]: x = np.array(sol[''x''])

  In [105]: x

  Out[105]: array([[ 0.25],

  [ 0.75],

  [ 3.75]])

  In [106]: sol[''primal objective'']

  Out[106]: -10.0

  ```


  该优化问题的解由向量 `x` 给出，在此特定示例中为 `x = (0.25, 0.75, 3.75)`，对应的 `f(x)` 值为 -10。使用此方法和 `cvxopt.solvers.lp`
  求解器，可以轻松求解具有数百或数千个变量的线性规划问题。所需要做的只是将优化问题写成标准形式，并创建 `c`、`A` 和 `b` 数组。


  ## 总结


  优化——从一组备选方案中选出最佳方案——是科学和工程中许多应用的基础。如果优化问题可以表述为一个数学问题，那么数学优化就为系统地处理这些问题提供了一个严谨的框架。计算的优化方法是在实践中求解此类优化问题的工具。因此，在科学计算环境中，优化扮演着非常重要的角色。对于使用
  Python 进行科学计算，`SciPy` 库提供了求解许多标准优化问题的高效例程，可用于解决各种各样的计算优化问题。然而，优化是数学领域的一个庞大分支，需要不同的方法来求解不同类型的问题，并且有多个
  Python 优化库为特定类型的优化问题提供专门的求解器。总的来说，`SciPy` 的 `optimize` 模块为各种各样的优化问题提供了良好且灵活的通用求解器，但对于特定类型的优化问题，也有许多专门库提供了更好的性能或更多的功能。`cvxopt`
  库就是这样一个例子，它通过用于线性和二次问题的高效求解器，补充了 `SciPy` 中的通用优化例程。


  ## 延伸阅读


  关于优化的入门介绍，并对本章介绍的几种方法的数值性质进行更详细讨论，可参见，例如，Heath (2002)。对于更严谨和深入的优化介绍，可参见，例如，E.K.P.
  Chong (2013)。`cvxopt` 库的创建者在优秀著作 (S. Boyd, 2004) 中对凸优化进行了全面阐述，该书也可在线查阅，网址为 [`http://stanford.edu/~boyd/cvxbook`](http://stanford.edu/%257Eboyd/cvxbook)。




