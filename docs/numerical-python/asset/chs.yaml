  在此例中我们可以看到，`R-squared`统计量显著升高至 0.963，表明模型与数据之间近乎完美吻合。


  ```

  In [72]: result.rsquared

  Out[72]: 0.96252198253140375

  ```


  需要注意的是，我们总可以通过引入更多变量来提高`R-squared`统计量，但必须确保不添加预测能力较低的变量（即系数小且对应的 p 值高），因为这会使模型容易过拟合。同往常一样，我们要求残差服从正态分布。对更新后的模型重复进行正态性检验和
  QQ 图分析，结果得到相对较高的*p*值（0.081）和相对线性的 QQ 图（见图 14-2）。这表明在该情况下，残差很可能服从正态分布（在本示例中，我们已知它们确实是按设计服从正态分布的）。


