  \ 3), (2, 0), colspan=3)`<br>`ax4 = plt.subplot2grid((3, 3), (0, 2), rowspan=2)`\
  \ |\n\n### GridSpec\n\n我们在此介绍的最后一个网格布局管理器是`mpl.gridspec`模块中的`GridSpec`。这是 Matplotlib\
  \ 中最通用的网格布局管理器，特别是它允许创建并非所有行和列都具有相同宽度和高度的网格，而这在使用本章前面介绍的网格布局管理器时是不易实现的。\n\n一个`GridSpec`对象仅用于指定网格布局，它本身不会创建任何`Axes`对象。在创建`GridSpec`类的新实例时，我们必须指定网格中的行数和列数。与其他网格布局管理器一样，我们也可以使用关键字参数`left`、`bottom`、`right`和`top`来设置网格的位置，并使用`wspace`和`hspace`来设置子图之间的宽度和高度间距。此外，`GridSpec`允许使用`width_ratios`和`height_ratios`参数来指定列和行的相对宽度和高度。这两个参数都应是包含网格中每列和每行大小相对权重的列表。例如，要生成一个两行两列的网格，其中第一行和第一列的大小是第二行和第二列的两倍，我们可以使用`mpl.gridspec.GridSpec(2,\
  \ 2, width_ratios=[2, 1], height_ratios=[2, 1])`。\n\n一旦创建了`GridSpec`实例，我们就可以使用`Figure.add_subplot`方法来创建`Axes`对象并将它们放置在图像画布上。作为`add_subplot`的参数，我们需要传递一个`mpl.gridspec.SubplotSpec`实例，我们可以使用类似数组的索引从`GridSpec`对象生成该实例：例如，给定一个`GridSpec`实例`gs`，我们可以使用`gs[0,\
  \ 0]`获取左上角网格元素的`SubplotSpec`实例，使用`gs[:, 0]`获取覆盖第一行的`SubplotSpec`实例，依此类推。有关如何使用`GridSpec`和`add_subplot`创建`Axes`实例的具体示例，请参见表\
  \ 4-4。\n\n表 4-4  \n如何使用子图网格管理器`mpl.gridspec.GridSpec`的示例\n\n| Axes 网格布局 | 代码 |\n\
