  此外，我们可以使用`predict`方法预测新观测值，该方法接受一个 NumPy 数组或`DataFrame`对象作为参数，其中包含自变量（本例中的*x*[1]和*x*[2]）的值。例如，由于当前问题只有两个自变量，我们可以将模型预测结果可视化为等高线图。为此，我们首先构建一个`DataFrame`对象，包含我们希望使用拟合模型预测*y*值的*x*[1]和*x*[2]值。


