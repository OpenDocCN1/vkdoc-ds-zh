  Laplace 变换的核心公式如下：


  ![$$ {\mathcal{L}}_t\left\frac{d^n}{d{t}^n}y(t)\ \right={s}^n{\mathcal{L}}_t\lefty(t)\
  \right-{\left.\sum_{m=0}^{n-1}{s}^{n-m-1}\frac{d^m}{d{t}^m}y(t)\right|}_{t=0}. $$](img/332789_2_En_9_Chapter_TeX_Equr.png)


  通过遍历 `L_ode` 的 SymPy 表达式树，并将出现的 ![$$ {\mathcal{L}}_t\left\frac{d^n}{d{t}^n}y(t)\
  \right $$](img/332789_2_En_9_Chapter_TeX_IEq29.png) 替换为由上述公式给出的表达式形式，我们可以得到所需的 ODE
  代数形式。以下函数接受一个经过拉普拉斯变换的 ODE，并对其中未求值的 *y*(*t*) 导数项的拉普拉斯变换执行替换：


  ```

  In [65]: def laplace_transform_derivatives(e):

  ...:     """

  ...:     Evaluate laplace transforms of derivatives of functions

  ...:     """

  ...:     if isinstance(e, sympy.LaplaceTransform):

  ...:         if isinstance(e.args[0], sympy.Derivative):

  ...:             d, t, s = e.args

  ...:             n = len(d.args) - 1

  ...:             return ((s**n) * sympy.LaplaceTransform(d.args[0], t, s) -

  ...:                     sum([s**(n-i) * sympy.diff(d.args[0], t, i-1).subs(t, 0)
  for i in range(1, n+1)]))

  ...:

  ...:     if isinstance(e, (sympy.Add, sympy.Mul)):

  ...:         t = type(e)

  ...:         return t(*[laplace_transform_derivatives(arg) for arg in e.args])

  ...:

  ...:     return e

  ```


