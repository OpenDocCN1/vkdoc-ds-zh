  \ |\n\n\n\n## 颜色映射图\n\n到目前为止，我们只考虑了单变量函数的图形，或者等价地，*x*-*y*格式的二维数据。我们为此目的使用的二维`Axes`对象也可以用于可视化双变量函数，或者*x*-*y*-z\
  \ 格式的三维数据，方法是使用所谓的颜色映射（或热力图），其中`Axes`区域内的每个像素根据坐标系中该点对应的*z*值进行着色。Matplotlib 提供了`pcolor`和`imshow`函数用于这类绘图，而`contour`和`contourf`函数则通过绘制等高线而非颜色映射来以相同格式绘制数据。图\
  \ 4-23 展示了使用这些函数生成的示例图形。\n\n![../images/332789_2_En_4_Chapter/332789_2_En_4_Fig23_HTML.png](img/332789_2_En_4_Fig23_HTML.png)\n\
  \n图 4-23\n\n使用`pcolor`、`imshow`、`contour`和`contourf`生成的示例图形\n\n为了生成一个颜色映射图，例如使用`pcolor`，我们首先需要以适当的格式准备数据。虽然标准的二维图形期望包含*x*和*y*值的一维坐标数组，但在当前情况下，我们需要使用二维坐标数组，例如，通过\
  \ NumPy 的`meshgrid`函数生成的数组。要绘制双变量函数或具有两个自变量的数据，我们首先定义一维坐标数组`x`和`y`，它们覆盖所需的坐标范围或对应于可用的数据值。然后，`x`和`y`数组可以传递给`np.meshgrid`函数，该函数生成所需的二维坐标数组`X`和`Y`。如果需要，我们可以使用\
  \ NumPy 数组计算，利用`X`和`Y`来计算双变量函数，从而获得数据数组`Z`，如`In [25]`中第 1 到 3 行所示（参见下文）。\n\n一旦准备好二维坐标和数据数组，就可以通过将`X`、`Y`和`Z`数组作为前三个参数传递给例如`pcolor`、`contour`或`contourf`来轻松地可视化它们。`imshow`方法的工作方式类似，但只期望将数据数组`Z`作为参数，而相关的坐标范围必须通过`extent`参数设置，该参数应设置为格式为`[xmin,\
  \ xmax, ymin, ymax]`的列表。对控制颜色映射图外观很重要的其他关键字参数包括`vmin`、`vmax`、`norm`和`cmap`：可以使用`vmin`和`vmax`来设置映射到颜色轴的值范围。这也可以通过设置`norm=mpl.colors.Normalize(vmin,\
  \ vmax)`来实现。`cmap`参数指定用于将数据值映射到图中颜色的颜色映射。该参数可以是一个包含预定义颜色映射名称的字符串，也可以是一个颜色映射实例。Matplotlib\
  \ 中预定义的颜色映射可在`mpl.cm`中获得。尝试`help(mpl.cm)`或在 IPython 中自动补全`mpl.cm`模块以获取可用颜色映射的完整列表。^(³¹)\n\
  \n一个完整的颜色映射图所需的最后一个元素是颜色条元素，它使看图者能够读取不同颜色对应的数值。在 Matplotlib 中，我们可以使用`plt.colorbar`函数为已绘制的颜色映射图附加一个颜色条。它首先接受绘图对象句柄作为第一个参数，并接受两个可选参数`ax`和`cax`，这些参数可用于控制颜色条在图形中出现的位置。如果给出了`ax`，新颜色条的空间将从该`Axes`对象中占用。另一方面，如果给出了`cax`，则颜色条将绘制在该`Axes`对象上。颜色条实例`cb`有自己的坐标轴对象，并且设置坐标轴属性的标准方法可以用于`cb.ax`对象，我们可以像对*x*和*y*轴一样使用例如`set_label`、`set_ticks`和`set_ticklabels`方法。\n\
  \n前几段中概述的步骤在以下代码中展示，生成的图形如图 4-24 所示。`imshow`、`contour`和`contourf`函数的使用方式几乎类似，尽管这些函数需要额外的参数来控制它们特有的属性。例如，`contour`和`contourf`函数还接受一个参数`N`，该参数指定要绘制的等高线数量。\n\
  \n![../images/332789_2_En_4_Chapter/332789_2_En_4_Fig24_HTML.png](img/332789_2_En_4_Fig24_HTML.png)\n\
  \n图 4-24\n\n使用`pcolor`生成颜色映射图的示例\n\n```python\nIn [25]: x = y = np.linspace(-10,\
  \ 10, 150)\n...: X, Y = np.meshgrid(x, y)\n...: Z = np.cos(X) * np.cos(Y) * np.exp(-(X/5)**2-(Y/5)**2)\n\
  ...:\n...: fig, ax = plt.subplots(figsize=(6, 5))\n...:\n...: norm = mpl.colors.Normalize(-abs(Z).max(),\
  \ abs(Z).max())\n...: p = ax.pcolor(X, Y, Z, norm=norm, cmap=mpl.cm.bwr)\n...:\n\
  ...: ax.axis('tight')\n...: ax.set_xlabel(r\"$x$\", fontsize=18)\n...: ax.set_ylabel(r\"\
  $y$\", fontsize=18)\n...: ax.xaxis.set_major_locator(mpl.ticker.MaxNLocator(4))\n\
  ...: ax.yaxis.set_major_locator(mpl.ticker.MaxNLocator(4))\n...:\n...: cb = fig.colorbar(p,\
  \ ax=ax)\n...: cb.set_label(r\"$z$\", fontsize=18)\n...: cb.set_ticks([-1, -.5,\
  \ 0, .5, 1])\n```\n\n\n\n## 3D 图形\n\n上一节讨论的色图通过将数据在二维图表中进行颜色编码，用于可视化具有两个因变量的数据。可视化同一类型数据的另一种方法是使用三维图形，其中引入第三个轴\
  \ `z`，并在屏幕上以透视方式显示图形。在 Matplotlib 中，绘制三维图形需要使用不同的坐标轴对象，即来自 `mpl_toolkits.mplot3d`\
  \ 模块的 `Axes3D` 对象。我们可以通过将 `Figure` 实例作为参数传递给 `Axes3D` 类的构造函数来显式创建支持三维的 Axes 实例：`ax\
  \ = Axes3D(fig)`。或者，我们可以使用带有 `projection='3d'` 参数的 `add_subplot` 函数：\n\n```\nax\
  \ = ax = fig.add_subplot(1, 1, 1, projection=\"3d\")\n```\n\n或者使用带有 `subplot_kw={'projection':\
  \ '3d'}` 参数的 `plt.subplots` 函数：\n\n```\nfig, ax = plt.subplots(1, 1, figsize=(8,\
  \ 6), subplot_kw={'projection': '3d'})\n```\n\n通过这种方式，只要我们以适当的方式指定 `projection`\
  \ 参数，就可以使用之前用于二维图形的所有坐标轴布局方法。请注意，使用 `add_subplot` 时，可以在同一张图中混合使用具有二维和三维投影的坐标轴对象，但使用\
  \ `plt.subplots` 时，`subplot_kw` 参数适用于添加到图形中的所有子图。\n\n创建支持三维的 Axes 实例并将其添加到图形后（例如，使用上一段描述的方法之一），`Axes3D`\
  \ 类的方法——例如 `plot_surface`、`plot_wireframe` 和 `contour`——就可以用于在三维透视图中将数据绘制为曲面。这些函数的使用方式与上一节中色图的使用方式几乎相同：这些三维绘图函数都以二维坐标和数据数组\
  \ `X`、`Y` 和 `Z` 作为第一个参数。每个函数还带有用于调整特定属性的额外参数。例如，`plot_surface` 函数接收参数 `rstride`\
  \ 和 `cstride`（行步长和列步长），用于从输入数组中选择数据（以避免数据点过于密集）。`contour` 和 `contourf` 函数接收可选参数\
  \ `zdir` 和 `offset`，用于选择投影方向（允许的值是 `x`、`y` 和 `z`）以及显示投影的平面。\n\n除了用于三维曲面绘制的方法之外，还有\
  \ `plot`、`scatter`、`bar` 和 `bar3d` 等二维坐标轴可用的折线和散点图函数的直接推广版本，这些函数在 `Axes3D` 类中可用的版本会为\
  \ `z` 坐标额外增加一个参数。类似于它们的二维关系，这些函数期望的是一维数据数组，而不是曲面图中使用的二维坐标数组。\n\n至于坐标轴标题、标签、刻度线和刻度标签，本章前面详细描述的所有用于二维图形的方法都可以直接推广到三维图形。例如，有新的方法\
  \ `set_zlabel`、`set_zticks` 和 `set_zticklabels` 用于操作新的 `z` 轴的属性。`Axes3D` 对象还提供了针对三维特定操作和属性的新类方法。特别是，`view_init`\
  \ 方法可用于更改查看图形的角度，它分别将仰角和方位角（以度为单位）作为第一和第二个参数。\n\n如何使用这些三维绘图函数的示例将在下一节中给出，生成的图形如图\
  \ 4-25 所示。\n\n![../images/332789_2_En_4_Chapter/332789_2_En_4_Fig25_HTML.jpg](img/332789_2_En_4_Fig25_HTML.jpg)\n\
  \n图 4-25\n\n通过使用 `plot_surface`、`plot_wireframe` 和 `contour` 生成的三维曲面和等高线图\n\n```\n\
  In [26]: fig, axes = plt.subplots(1, 3, figsize=(14, 4), subplot_kw={'projection':\
  \ '3d'})\n...:\n...: def title_and_labels(ax, title):\n...:     ax.set_title(title)\n\
  ...:     ax.set_xlabel(\"$x$\", fontsize=16)\n...:     ax.set_ylabel(\"$y$\", fontsize=16)\n\
  ...:     ax.set_zlabel(\"$z$\", fontsize=16)\n...:\n...: x = y = np.linspace(-3,\
  \ 3, 74)\n...: X, Y = np.meshgrid(x, y)\n...:\n...: R = np.sqrt(X**2 + Y**2)\n...:\
  \ Z = np.sin(4 * R) / R\n...:\n...: norm = mpl.colors.Normalize(-abs(Z).max(), abs(Z).max())\n\
  ...:\n...: p = axes[0].plot_surface(X, Y, Z, rstride=1, cstride=1, linewidth=0,\
  \ antialiased=False, norm=norm, cmap=mpl.cm.Blues)\n...:\n...: cb = fig.colorbar(p,\
  \ ax=axes[0], shrink=0.6)\n...: title_and_labels(axes[0], \"plot_surface\")\n...:\n\
  ...: p = axes[1].plot_wireframe(X, Y, Z, rstride=2, cstride=2, color=\"darkgrey\"\
  )\n...: title_and_labels(axes[1], \"plot_wireframe\")\n...:\n...: cset = axes[2].contour(X,\
  \ Y, Z, zdir=\"z\", offset=0, norm=norm, cmap=mpl.cm.Blues)\n...: cset = axes[2].contour(X,\
  \ Y, Z, zdir=\"y\", offset=3, norm=norm, cmap=mpl.cm.Blues)\n...: title_and_labels(axes[2],\
  \ \"contour\")\n```\n\n## 总结\n\n在本章中，我们涵盖了如何使用 Matplotlib 生成二维和三维图形的基础知识。可视化是计算科学家和工程师最重要的工具之一，它既是处理计算问题时的分析工具，也是展示和传达计算结果的手段。因此，可视化是计算工作流程中不可或缺的一部分，能够快速可视化和探索数据，以及能够对每个图形元素进行详细控制从而生成完美、高质量的出版级图形，两者同样重要。Matplotlib\
  \ 是一款出色的通用工具，既可用于探索性可视化，也可用于生成出版级图形。然而，Matplotlib 能实现的功能有其局限性，特别是在交互性和高质量三维图形方面。因此，对于更专业的用例，我建议也探索一下科学\
  \ Python 生态系统中可用的其他图形库，其中一些在本章开头已简要提及。\n\n## 延伸阅读\n\nMatplotlib 在该库相关的专著中有详细阐述，例如\
  \ Tosi (2009) 和 Devert (2014)，在几本更广领域范围的书中也有涉及，例如 Milovanovi (2013) 和 McKinney (2013)。关于数据可视化、样式指南以及可视化最佳实践的趣味讨论，可参见例如\
  \ Yau (2011) 和 J. Steele (2010)。\n\n\n\n"
- "# 5. 方程求解\n\n在前几章中，我们讨论了通用方法论与技术，即基于数组的数值计算、符号计算和可视化。这些方法是科学计算的基石，组成了我们在处理计算问题时可以调用的基础工具集。\n\
  \n从本章开始，我们将探索如何使用前几章介绍的基础技术来解决应用数学和计算科学不同领域的问题。本章的主题是代数方程求解。这是一个广泛的课题，需要应用多个数学领域的理论和方法。特别地，在讨论方程求解时，我们必须区分单变量方程和多变量方程（即包含一个未知变量或多个未知变量的方程）。此外，我们还需要区分线性方程和非线性方程。这种分类很有用，因为求解这些不同类型的方程需要应用不同的数学方法和技巧。\n\
  \n我们从线性方程组开始，它们非常有用，并且在科学的各个领域都有重要应用。这种普遍性的原因在于，线性代数理论使我们能够直接求解线性方程，而非线性方程通常难以求解，并且需要更复杂、计算量更大的方法。由于线性系统易于求解，它们也是非线性系统局部近似的重要工具。例如，通过考虑展开点附近的小幅度变化，非线性系统通常可以在展开点的局部邻域内用线性系统近似。然而，线性化只能描述局部性质，对于非线性问题的全局分析，则需要其他技术。这些方法通常采用迭代方法，逐步构建越来越精确的解的估计值。\n\
  \n在本章中，我们将尽可能使用 SymPy 进行符号方程求解，并使用 SciPy 库中的线性代数模块对线性方程组进行数值求解。对于处理非线性问题，我们将使用 SciPy\
  \ 的`optimize`模块中的求根函数。\n\n## SciPy\n\nSciPy 是一个 Python 库，是 Python 科学计算环境的统称，也是许多\
  \ Python 科学计算核心库的伞式组织。实际上，`scipy`库更像是一个用于高级科学计算的库的集合，这些库彼此相对独立。SciPy 库构建在 NumPy\
  \ 之上，NumPy 提供了基本的数组数据结构以及对这些数组的基本操作。SciPy 中的模块提供了特定领域的高级计算方法，例如线性代数、优化、插值、积分等例程。在撰写本文时，SciPy\
  \ 的最新版本是 1.1.0。更多信息请参见[`www.scipy.org`](http://www.scipy.org)。\n\n## 导入模块\n\nSciPy\
  \ 模块`scipy`应被视为一个模块集合，可按需选择性导入。本章中，我们将使用`scipy.linalg`模块来求解线性方程组，以及`scipy.optimize`模块来求解非线性方程。在本章中，我们假定这些模块按如下方式导入：\n\
  \n```\nIn [1]: from scipy import linalg as la\nIn [2]: from scipy import optimize\n\
  ```\n\n本章中，我们还会使用前几章介绍的 NumPy、SymPy 和 Matplotlib 库，并假定这些库已按照之前介绍的约定导入：\n\n```\n\
  In [3]: import sympy\nIn [4]: sympy.init_printing()\nIn [5]: import numpy as np\n\
  In [6]: import matplotlib.pyplot as plt\n```\n\n为了在 Python 2 和 Python 3 中实现相同的整数除法行为，我们还需包含以下语句（仅在\
  \ Python 2 中需要）：\n\n```\nIn [7]: from __future__ import division\n```\n\n## 线性方程组\n\
  \n线性代数的一个重要应用是求解线性方程组。我们在第 3 章中已经接触过 SymPy 库中的线性代数功能。NumPy 和 SciPy 库中也包含线性代数模块，即`numpy.linalg`和`scipy.linalg`，它们共同为数值问题提供线性代数例程，即那些完全由数值因子和参数定义的问题。\n\
  \n一般而言，线性方程组可以写成如下形式：\n\n![$$ {a}_{11}{x}_1+{a}_{12}{x}_2+\\dots +{a}_{1n}{x}_n={b}_1,\
  \ $$](img/332789_2_En_5_Chapter_TeX_Equa.png)\n\n![$$ {a}_{21}{x}_1+{a}_{22}{x}_2+\\\
  dots +{a}_{2n}{x}_n={b}_2, $$](img/332789_2_En_5_Chapter_TeX_Equb.png)\n\n![$$ \\\
  dots $$](img/332789_2_En_5_Chapter_TeX_Equc.png)\n\n![$$ {a}_{m1}{x}_1+{a}_{m2}{x}_2+\\\
  dots +{a}_{mn}{x}_n={b}_m. $$](img/332789_2_En_5_Chapter_TeX_Equd.png)\n\n这是一个包含*m*个方程、*n*个未知变量{*x*[1],\
  \ *x*[2], …, *x*[*n*]}的线性方程组，其中*a*[*mn*]和*b*[*m*]是已知参数或常数值。在处理线性方程组时，将方程写成矩阵形式会很方便：\n\
  \n![$$ \\left(\\begin{array}{cccc}{a}_{11}&amp; {a}_{12}&amp; \\dots &amp; {a}_{1n}\\\
  \\ {}{a}_{21}&amp; {a}_{22}&amp; \\dots &amp; {a}_{2n}\\\\ {}\\vdots &amp; \\vdots\
  \ &amp; \\ddots &amp; \\vdots \\\\ {}{a}_{m1}&amp; {a}_{m2}&amp; \\dots &amp; {a}_{mn}\\\
  end{array}\\right)\\left(\\begin{array}{c}{x}_1\\\\ {}{x}_2\\\\ {}\\vdots \\\\ {}{x}_n\\\
  end{array}\\right)=\\left(\\begin{array}{c}{b}_1\\\\ {}{b}_2\\\\ {}\\vdots \\\\\
  \ {}{b}_m\\end{array}\\right), $$](img/332789_2_En_5_Chapter_TeX_Eque.png)\n\n或者简单地写作\
  \ *Ax* = *b*，其中 *A* 是一个 *m* × *n* 矩阵，*b* 是一个 *m* × 1 矩阵（或 *m* 维向量），*x* 是未知的 *n*\
  \ × 1 解矩阵（或 *n* 维向量）。取决于矩阵 *A* 的性质，解向量 *x* 可能存在也可能不存在，并且即使存在解，也不一定是唯一的。然而，如果解存在，那么它可以被解释为向量\
  \ *b* 以矩阵 *A* 各列的线性组合形式表达，其中系数由解向量 *x* 中的元素给出。\n\n当 *n* < *m* 时，方程组被称为欠定，因为方程数量少于未知数，因此无法完全确定唯一解。另一方面，如果\
  \ *m* > *n*，则方程组被称为超定。这通常会导致约束条件冲突，从而使得解不存在。\n\n\n\n### 方阵系统\n\n*m* = *n* 的方阵系统是一个重要的特例。它对应于方程数量等于未知变量数量的情况，因此可能存在唯一解。为了存在唯一解，矩阵\
  \ *A* 必须是非奇异的（*nonsingular*），在这种情况下，*A* 的逆矩阵存在，并且解可以写为 *x* = *A*^(−1)*b*。如果矩阵 *A*\
  \ 是奇异的，即矩阵的秩小于 *n*，`rank(A) < n`，或者等价地，如果其行列式为零，`det A = 0`，那么根据右侧向量 *b* 的不同，方程\
  \ `Ax = b` 可能无解或有无穷多解。对于秩亏缺的矩阵，`rank(A) < n`，存在一些列或行可以表示为其他列或向量的线性组合，因此它们对应的方程不包含任何新约束，该系统实际上是欠定的。因此，计算定义线性方程组的矩阵\
  \ *A* 的秩是一种有用的方法，它可以告诉我们矩阵是否奇异，从而判断解是否存在。\n\n当 *A* 满秩时，解必然存在。然而，能否精确计算出解则不一定。矩阵的条件数（*condition\
  \ number*），`cond(A)`，给出了线性方程组病态或良态程度的度量。如果条件数接近 1，则称系统是良态的（*well conditioned*）（条件数为\
  \ 1 是理想情况）；如果条件数很大，则称系统是病态的（*ill-conditioned*）。病态方程组的解可能存在较大误差。\n\n条件数可以通过一个简单的误差分析来直观理解。假设我们有一个形如\
  \ `Ax = b` 的线性方程组，其中 *x* 是解向量。现在考虑 *b* 的一个小扰动，比如 *δb*，这会导致解产生相应的变化 *δx*，由 `A(x +\
  \ δx) = b + δb` 给出。由于方程的线性特性，我们有 `Aδx = δb`。现在要考虑的一个重要问题是：与 *b* 的相对变化相比，*x* 的相对变化有多大？从数学上，我们可以用这些向量范数的比值来表述这个问题。具体来说，我们比较\
  \ `‖δx‖/‖x‖` 和 `‖δb‖/‖b‖`，其中 `‖x‖` 表示 *x* 的范数。利用矩阵范数关系 `‖Ax‖ ≤ ‖A‖ ∙ ‖x‖`，我们可以写出：\n\
  \n![$$ \\frac{\\delta x}{x}\\kern0.5em =\\kern0.5em \\frac{A^{-1}\\delta b}{x}\\\
  kern0.5em \\le \\kern0.5em \\frac{A^{-1}\\cdot \\delta b}{x}\\kern0.5em =\\kern0.5em\
  \ \\frac{A^{-1}\\cdot b}{x}\\cdot \\frac{\\delta b}{b}\\kern0.5em \\le \\kern0.5em\
  \ {A}^{-1}\\cdot A\\cdot \\frac{\\delta b}{b} $$](img/332789_2_En_5_Chapter_TeX_Equf.png)\n\
  \n因此，给定 *b* 向量中的相对误差，解 *x* 的相对误差的一个界限由 `cond(A) ≡ ‖A^(−1)‖ ∙ ‖A‖` 给出，根据定义，这正是矩阵\
  \ *A* 的条件数。这意味着，对于由病态矩阵 *A* 表征的线性方程组，即使 *b* 向量存在微小扰动，也可能导致解向量 *x* 中出现巨大误差。这一点在使用浮点数（它们仅是实数的近似值）进行数值求解时尤其重要。因此，在求解线性方程组时，查看条件数以估计解的精度非常重要。\n\
  \n在 SymPy 中，可以使用 `Matrix` 的方法 `rank()`、`condition_number()` 和 `norm()` 来计算符号矩阵的秩、条件数和范数；对于数值问题，我们可以使用\
  \ NumPy 函数 `np.linalg.matrix_rank()`、`np.linalg.cond()` 和 `np.linalg.norm()`。例如，考虑以下由两个线性方程组成的方程组：\n\
  \n![$$ {\\displaystyle \\begin{array}{c}2{x}_1+3{x}_2=4\\\\ {}5{x}_1+4{x}_2=3\\\
  end{array}} $$](img/332789_2_En_5_Chapter_TeX_Equg.png)\n\n这两个方程对应于 (`x[1]`, `x[2]`)\
  \ 平面上的两条直线，它们的交点就是方程组的解。如图 5-1 所示，该图绘制了这两个方程对应的直线，两条直线相交于 (−1, 2)。\n\n![../images/332789_2_En_5_Chapter/332789_2_En_5_Fig1_HTML.png](img/332789_2_En_5_Fig1_HTML.png)\n\
  \n**图 5-1**\n\n两个线性方程组的图形表示\n\n我们可以通过在 SymPy 中为 *A* 和 *b* 创建矩阵对象，并使用以下命令计算矩阵 *A*\
  \ 的秩、条件数和范数来定义这个问题：\n\n```\nIn [8]: A = sympy.Matrix([[2, 3], [5, 4]])\nIn [9]:\
  \ b = sympy.Matrix([4, 3])\nIn [10]: A.rank()\nOut[10]: 2\nIn [11]: A.condition_number()\n\
  Out[11]:\n```\n\n![$$ \\frac{\\sqrt{27+2\\sqrt{170}}}{\\sqrt{27-2\\sqrt{170}}} $$](img/332789_2_En_5_Chapter_TeX_Equh.png)\n\
  \n```\nIn [12]: sympy.N(_)\nOut[12]: 7.58240137440151\nIn [13]: A.norm()\nOut[13]:\n\
  ```\n\n![$$ 3\\sqrt{6} $$](img/332789_2_En_5_Chapter_TeX_Equi.png)\n\n我们可以在 NumPy/SciPy\
  \ 中使用 NumPy 数组表示 *A* 和 *b*，并使用 `np.linalg` 和 `scipy.linalg` 模块中的函数完成相同操作：\n\n```\n\
  In [14]: A = np.array([[2, 3], [5, 4]])\nIn [15]: b = np.array([4, 3])\nIn [16]:\
  \ np.linalg.matrix_rank(A)\nOut[16]: 2\nIn [17]: np.linalg.cond(A)\nOut[17]: 7.5824013744\n\
  In [18]: np.linalg.norm(A)\nOut[18]: 7.34846922835\n```\n\n解决线性问题的一个直接方法是计算矩阵 *A*\
  \ 的逆矩阵，然后将其与向量 *b* 相乘，就像之前分析讨论中所使用的那样。然而，这并不是求解向量 *x* 最高效的计算方法。一个更好的方法是对矩阵 *A* 进行\
  \ LU 分解，使得 `A = LU`，其中 *L* 是下三角矩阵，*U* 是上三角矩阵。给定 *L* 和 *U*，可以高效地构造解向量 *x*：首先通过前向代入求解\
  \ `Ly = b`，然后通过后向代入求解 `Ux = y`。由于 *L* 和 *U* 是三角矩阵，这两个过程计算效率很高。\n\n在 SymPy 中，我们可以使用\
  \ `sympy.Matrix` 类的 `LUdecomposition()` 方法执行符号 LU 分解。此方法为 *L* 和 *U* 矩阵返回新的 `Matrix`\
  \ 对象，以及一个行交换矩阵。当我们对求解方程组 `Ax = b` 感兴趣时，我们不需要显式计算 *L* 和 *U* 矩阵，而是可以使用 `LUsolve()`\
  \ 方法，该方法在内部执行 LU 分解，并使用这些因子求解方程组。回到前面的例子，我们可以使用以下方法计算 *L* 和 *U* 因子并求解方程组：\n\n```\n\
  In [19]: A = sympy.Matrix([[2, 3], [5, 4]])\nIn [20]: b = sympy.Matrix([4, 3])\n\
  In [21]: L, U, _ = A.LUdecomposition()\nIn [22]: L\nOut[22]:\n```\n\n![$$ \\left[\\\
  begin{array}{cc}1&amp; 0\\\\ {}5/2&amp; 1\\end{array}\\right] $$](images/332789_2_En_5_Chapter/332789_2_En_5_Chapter_TeX_Equj.png)\n\
  \n```\nIn [23]: U\nOut[23]:\n```\n\n![$$ \\left[\\begin{array}{cc}2&amp; 3\\\\ {}0&amp;\
  \ -7/2\\end{array}\\right] $$](images/332789_2_En_5_Chapter/332789_2_En_5_Chapter_TeX_Equk.png)\n\
  \n```\nIn [24]: L * U\nOut[24]:\n```\n\n![$$ \\left[\\begin{array}{cc}2&amp; 3\\\
  \\ {}5&amp; 4\\end{array}\\right] $$](images/332789_2_En_5_Chapter/332789_2_En_5_Chapter_TeX_Equl.png)\n\
  \n```\nIn [25]: x = A.solve(b); x  # 等同于 A.LUsolve(b)\nOut[25]:\n```\n\n![$$ \\\
  left[\\begin{array}{c}-1\\\\ {}2\\end{array}\\right] $$](images/332789_2_En_5_Chapter/332789_2_En_5_Chapter_TeX_Equm.png)\n\
  \n\n\n对于数值问题，我们可以使用 SciPy 线性代数模块中的 `la.lu` 函数。该函数返回一个置换矩阵 `P` 以及 `L` 和 `U` 矩阵，满足\
  \ `A = PLU`。与 SymPy 类似，我们可以使用 `la.solve` 函数求解线性系统 `Ax = b`，而无需显式计算 `L` 和 `U` 矩阵，该函数将\
  \ `A` 矩阵和 `b` 向量作为参数。这通常是使用 SciPy 求解数值线性方程组时的首选方法。\n\n```\nIn [26]: A = np.array([[2,\
  \ 3], [5, 4]])\nIn [27]: b = np.array([4, 3])\nIn [28]: P, L, U = la.lu(A)\nIn [29]:\
  \ L\nOut[29]: array([[ 1\\. ,  0\\. ],\n[ 0.4,  1\\. ]])\nIn [30]: U\nOut[30]: array([[\
  \ 5\\. ,  4\\. ],\n[ 0\\. ,  1.4]])\nIn [31]: P.dot(L.dot(U))\nOut[31]: array([[\
  \ 2., 3.],\n[ 5., 4.]])\nIn [32]: la.solve(A, b)\nOut[32]: array([-1.,  2.])\n```\n\
  \n使用 SymPy 的优势在于我们可以获得精确结果，并且还可以在矩阵中包含符号变量。然而，并非所有问题都能以符号方式求解，或者可能会得到极其冗长的结果。另一方面，使用\
  \ NumPy/SciPy 进行数值计算的优势在于，我们保证能获得一个结果，尽管由于浮点误差，它将是一个近似解。请参见以下代码 (`In [38]`) 中说明符号方法与数值方法差异的示例，以及展示数值方法可能对具有大条件数的方程组敏感的示例。在此示例中，我们求解方程组\n\
  \n![$$ \\left(\\begin{array}{cc}1&amp; \\sqrt{p}\\\\ {}1&amp; \\frac{1}{\\sqrt{p}}\\\
  end{array}\\right)\\left(\\begin{array}{c}{x}_1\\\\ {}{x}_2\\end{array}\\right)=\\\
  left(\\begin{array}{c}1\\\\ {}2\\end{array}\\right) $$](img/332789_2_En_5_Chapter_TeX_Equn.png)\n\
  \n当 `p = 1` 时，该方程组是奇异的；当 `p` 在 1 附近时，它是病态的。使用 SymPy 可以轻松找到解为\n\n![$$ \\left(\\begin{array}{c}\\\
  frac{2p-1}{p-1}\\\\ {}-\\frac{\\sqrt{p}}{p-1}\\end{array}\\right) $$](img/332789_2_En_5_Chapter_TeX_Equo.png)\n\
  \n```\nIn [33]: p = sympy.symbols(\"p\", positive=True)\nIn [34]: A = sympy.Matrix([[1,\
  \ sympy.sqrt(p)], [1, 1/sympy.sqrt(p)]])\nIn [35]: b = sympy.Matrix([1, 2])\nIn\
  \ [36]: x = A.solve(b)\nIn [37]: x\nOut[37]:\n```\n\n符号解与数值解的比较如图 5-2 所示。这里数值解中的误差源于数值浮点误差，并且在\
  \ `p = 1` 附近（此时系统具有大条件数），数值误差会显著增大。此外，如果 `A` 或 `b` 中存在其他误差来源，那么 `x` 中相应的误差可能会更加严重。\n\
  \n![../images/332789_2_En_5_Chapter/332789_2_En_5_Fig2_HTML.png](img/332789_2_En_5_Fig2_HTML.png)\n\
  \n图 5-2\n\n相对数值误差（左图）和条件数（右图）随参数 `p` 变化的曲线\n\n```\nIn [38]: # 符号问题定义\n...: p = sympy.symbols(\"\
  p\", positive=True)\n...: A = sympy.Matrix([[1, sympy.sqrt(p)], [1, 1/sympy.sqrt(p)]])\n\
  ...: b = sympy.Matrix([1, 2])\n...:\n...: # 符号求解\n...: x_sym_sol = A.solve(b)\n\
  ...: Acond = A.condition_number().simplify()\n...:\n...: # 数值问题定义\n...: AA = lambda\
  \ p: np.array([[1, np.sqrt(p)], [1, 1/np.sqrt(p)]])\n...: bb = np.array([1, 2])\n\
  ...: x_num_sol = lambda p: np.linalg.solve(AA(p), bb)\n...:\n...: # 绘制符号（精确）结果与数值结果之间的差异\n\
  ...: fig, axes = plt.subplots(1, 2, figsize=(12, 4))\n...:\n...: p_vec = np.linspace(0.9,\
  \ 1.1, 200)\n...: for n in range(2):\n...:     x_sym = np.array([x_sym_sol[n].subs(p,\
  \ pp).evalf() for pp in p_vec])\n...:     x_num = np.array([x_num_sol(pp)[n] for\
  \ pp in p_vec])\n...:     axes[0].plot(p_vec, (x_num - x_sym)/x_sym, 'k')\n...:\
  \ axes[0].set_title(\"解中的误差\\n(数值 - 符号)/符号\")\n...: axes[0].set_xlabel(r'$p$', fontsize=18)\n\
  ...:\n...: axes[1].plot(p_vec, [Acond.subs(p, pp).evalf() for pp in p_vec])\n...:\
  \ axes[1].set_title(\"条件数\")\n...: axes[1].set_xlabel(r'$p$', fontsize=18)\n```\n\
  \n## 矩形方程组\n\n矩形方程组，即 `m ≠ n` 的情况，可以是欠定或超定的。欠定方程组中变量的数量多于方程数量，因此解无法完全确定。因此，对于此类方程组，解必须以剩余自由变量的形式给出。这使得用数值方法处理这类问题变得困难，但通常可以使用符号方法。\n\
  \n例如，考虑欠定线性方程组\n\n![$$ \\left(\\begin{array}{ccc}1&amp; 2&amp; 3\\\\ {}4&amp; 5&amp;\
  \ 6\\end{array}\\right)\\left(\\begin{array}{c}{x}_1\\\\ {}{x}_2\\\\ {}{x}_3\\end{array}\\\
  right)=\\left(\\begin{array}{c}7\\\\ {}8\\end{array}\\right). $$](img/332789_2_En_5_Chapter_TeX_Equp.png)\n\
  \n这里我们有三个未知变量，但只有两个方程对这些变量之间的关系施加了约束。通过将该方程写作 `Ax - b = 0`，我们可以使用 SymPy 的 `sympy.solve`\
  \ 函数来获得由剩余自由变量 `x[3]` 参数化的 `x[1]` 和 `x[2]` 的解：\n\n![$$ \\left\\{{x}_1={x}_3-19/3,\\\
  kern0.5em {x}_2=-2{x}_3+20/3\\right\\} $$](img/332789_2_En_5_Chapter_TeX_Equq.png)\n\
  \n```\nIn [39]: x_vars = sympy.symbols(\"x_1, x_2, x_3\")\nIn [40]: A = sympy.Matrix([[1,\
  \ 2, 3], [4, 5, 6]])\nIn [41]: x = sympy.Matrix(x_vars)\nIn [42]: b = sympy.Matrix([7,\
  \ 8])\nIn [43]: sympy.solve(A*x - b, x_vars)\nOut[43]:\n```\n\n这里我们得到了符号解 `x[1]\
  \ = x[3] − 19/3` 和 `x[2] = −2*x[3] + 20/3`，该解在由 `{x[1], x[2], x[3]}` 张成的三维空间中定义了一条直线。因此，该直线上的任何点都满足这个欠定方程组。\n\
  \n另一方面，如果方程组是超定的，即方程数量多于未知变量数量，`m > n`，那么我们拥有的约束就多于自由度，通常此类系统不存在精确解。然而，为超定系统寻找一个近似解通常很有意义。出现这种情况的一个例子是数据拟合：假设我们有一个模型，其中变量\
  \ `y` 是变量 `x` 的二次多项式，即 `y = A + Bx + Cx²`，我们希望将此模型拟合到实验数据。这里 `y` 相对于 `x` 是非线性的，但\
  \ `y` 相对于三个未知系数 `A`、`B` 和 `C` 是线性的，这一事实可用于将模型写作一个线性方程组。如果我们收集变量 `x` 和 `y` 的 `m`\
  \ 对数据点 ![$$ {\\left\\{\\left({x}_i,{y}_i\\right)\\right\\}}_{i=1}^m $$](img/332789_2_En_5_Chapter_TeX_IEq1.png)，我们可以将该模型写作一个\
  \ `m × 3` 的方程组：\n\n![$$ \\left(\\begin{array}{ccc}1&amp; {x}_1&amp; {x}_1²\\\\ {}\\\
  vdots &amp; \\vdots &amp; \\vdots \\\\ {}1&amp; {x}_m&amp; {x}_m²\\end{array}\\\
  right)\\left(\\begin{array}{c}A\\\\ {}B\\\\ {}C\\end{array}\\right)=\\left(\\begin{array}{c}{y}_1\\\
  \\ {}\\vdots \\\\ {}{y}_m\\end{array}\\right). $$](img/332789_2_En_5_Chapter_TeX_Equr.png)\n\
  \n如果 `m = 3`，在假设系统矩阵非奇异的情况下，我们可以解出未知的模型参数 `A`、`B` 和 `C`。然而，凭直觉可以清楚地知道，如果数据有噪声并且我们使用超过三个数据点，那么我们应该能够获得更精确的模型参数估计。\n\
  \n\n\n然而，对于 *m* > 3 的情况，通常不存在精确解，因此我们需要引入一个近似解，以给出超定系统 *Ax* ≈ *b* 的**最佳拟合**。该最佳拟合的自然定义是最小化平方误差之和，![$$\
  \ {\\min}_x{\\sum}_{i=1}^m{\\left({r}_i\\right)}² $$](img/332789_2_En_5_Chapter_TeX_IEq2.png)，其中\
  \ *r* = *b* − *Ax* 是残差向量。这引出了问题 *Ax* ≈ *b* 的*最小二乘*解，它最小化了数据点与线性解之间的距离。在 SymPy 中，我们可以使用\
  \ `solve_least_squares` 方法来求解超定系统的最小二乘解；对于数值问题，则可以使用 SciPy 函数 `la.lstsq`。\n\n以下代码演示了如何使用\
  \ SciPy 的 `la.lstsq` 方法来拟合上一节中考虑的示例模型，结果如图 5-3 所示。我们首先定义模型的真实参数，然后通过向真实模型关系添加随机噪声来模拟测量数据。接着使用\
  \ `la.lstsq` 函数求解最小二乘问题，该函数除了返回解向量 *x*，还返回总平方误差和（残差 `r`）、矩阵 *A* 的秩 `rank` 以及奇异值\
  \ `sv`。不过，在下面的示例中，我们只使用解向量 `x`。\n\n![../images/332789_2_En_5_Chapter/332789_2_En_5_Fig3_HTML.png](img/332789_2_En_5_Fig3_HTML.png)\n\
  \n**图 5-3** 线性最小二乘拟合\n\n```\nIn [44]: # 定义真实模型参数\n...: x = np.linspace(-1, 1, 100)\n\
  ...: a, b, c = 1, 2, 3\n...: y_exact = a + b * x + c * x**2\n...:\n...: # 模拟带噪声的数据\n\
  ...: m = 100\n...: X = 1 - 2 * np.random.rand(m)\n...: Y = a + b * X + c * X**2\
  \ + np.random.randn(m)\n...:\n...: # 使用线性最小二乘拟合数据到模型\n...: A = np.vstack([X**0,\
  \ X**1, X**2])  # 另见 np.vander 的替代方法\n...: sol, r, rank, sv = la.lstsq(A.T, Y)\n\
  ...:\n...: y_fit = sol[0] + sol[1] * x + sol[2] * x**2\n...: fig, ax = plt.subplots(figsize=(12,\
  \ 4))\n...:\n...: ax.plot(X, Y, 'go', alpha=0.5, label='模拟数据')\n...: ax.plot(x,\
  \ y_exact, 'k', lw=2, label='真实值 $y = 1 + 2x + 3x²$')\n...: ax.plot(x, y_fit, 'b',\
  \ lw=2, label='最小二乘拟合')\n...: ax.set_xlabel(r\"$x$\", fontsize=18)\n...: ax.set_ylabel(r\"\
  $y$\", fontsize=18)\n...: ax.legend(loc=2)\n```\n\n数据与模型的良好拟合显然要求用于描述数据的模型与生成数据的底层过程高度一致。在下面的示例（`In\
  \ [45]`）以及图 5-4 中，我们将前一示例中使用的相同数据分别拟合到线性模型和高阶多项式模型（最高 15 阶）。前者对应欠拟合，即我们为数据使用了过于简单的模型；后者对应过拟合，即我们为数据使用了过于复杂的模型，从而不仅拟合了底层趋势，还拟合了测量噪声。使用合适的模型是数据拟合中一个关键且微妙的问题。\n\
  \n![../images/332789_2_En_5_Chapter/332789_2_En_5_Fig4_HTML.png](img/332789_2_En_5_Fig4_HTML.png)\n\
  \n**图 5-4** 使用线性最小二乘法演示数据欠拟合和过拟合的图表\n\n```\nIn [45]: # 使用线性最小二乘拟合数据到模型：\n...: #\
  \ 1 阶多项式\n...: A = np.vstack([X**n for n in range(2)])\n...: sol, r, rank, sv =\
  \ la.lstsq(A.T, Y)\n...: y_fit1 = sum([s * x**n for n, s in enumerate(sol)])\n...:\n\
  ...: # 15 阶多项式\n...: A = np.vstack([X**n for n in range(16)])\n...: sol, r, rank,\
  \ sv = la.lstsq(A.T, Y)\n...: y_fit15 = sum([s * x**n for n, s in enumerate(sol)])\n\
  ...:\n...: fig, ax = plt.subplots(figsize=(12, 4))\n...: ax.plot(X, Y, 'go', alpha=0.5,\
  \ label='模拟数据')\n...: ax.plot(x, y_exact, 'k', lw=2, label='真实值 $y = 1 + 2x + 3x²$')\n\
  ...: ax.plot(x, y_fit1, 'b', lw=2, label='最小二乘拟合 [1 阶]')\n...: ax.plot(x, y_fit15,\
  \ 'm', lw=2, label='最小二乘拟合 [15 阶]')\n...: ax.set_xlabel(r\"$x$\", fontsize=18)\n\
  ...: ax.set_ylabel(r\"$y$\", fontsize=18)\n...: ax.legend(loc=2)\n```\n\n## 特征值问题\n\
  \n一个具有重要理论和实践意义的特殊方程组是特征值方程 *Ax* = *λx*，其中 A 是一个 *N* × *N* 的方阵，*x* 是未知向量，*λ* 是未知标量。这里\
  \ *x* 是矩阵 *A* 的特征向量，*λ* 是特征值。特征值方程 *Ax* = *λx* 与线性方程组 *Ax* = *b* 非常相似，但请注意这里 *x*\
  \ 和 *λ* 都是未知的，因此我们不能直接应用相同的技术来求解这个方程。求解这个特征值问题的一种标准方法是将方程重写为 (*A* − *Iλ*)*x* = 0，并注意到为了存在非平凡解\
  \ *x* ≠ 0，矩阵 *A* − *Iλ* 必须是奇异的，且其行列式必须为零，即 det(*A* − *Iλ*) = 0。这给出了一个 *N* 阶的多项式方程（特征多项式），它的\
  \ *N* 个根给出了 *N* 个特征值 ![$$ {\\left\\{{\\lambda}_n\\right\\}}_{n=1}^N $$](img/332789_2_En_5_Chapter_TeX_IEq3.png)。一旦特征值已知，就可以使用标准的前向代入法求解方程\
  \ (*A* − *Iλ*[*n*])*x*[*n*] = 0，以获得第 *n* 个特征向量 *x*[*n*]。\n\nSymPy 和 SciPy 中的线性代数包都包含用于特征值问题的求解器。在\
  \ SymPy 中，我们可以使用 `Matrix` 类的 `eigenvals` 和 `eigenvects` 方法，它们能够计算某些元素为符号表达式的矩阵的特征值和特征向量。例如，要计算具有符号元素的对称\
  \ 2 × 2 矩阵的特征值和特征向量，我们可以使用\n\n![$$ \\left(\\begin{array}{cc}\\varepsilon & \\varDelta\
  \ \\\\ {}\\varDelta & -\\varepsilon \\end{array}\\right) $$](img/332789_2_En_5_Chapter_TeX_Equs.png)\n\
  \n```\nIn [46]: eps, delta = sympy.symbols(\"epsilon, Delta\")\nIn [47]: H = sympy.Matrix([[eps,\
  \ delta], [delta, -eps]])\nIn [48]: H\nOut[48]:\n```\n\n![$$ \\left\\{-\\sqrt{\\\
  varepsilon²+{\\varDelta}²}:1,\\sqrt{\\varepsilon²+{\\varDelta}²}:1\\right\\} $$](img/332789_2_En_5_Chapter_TeX_Equt.png)\n\
  \n```\nIn [49]: H.eigenvals()\nOut[49]:\n```\n\n![$$ \\left[\\left(-\\sqrt{\\varepsilon²+{\\\
  varDelta}²},1,\\left[\\left[\\begin{array}{c}-\\frac{\\varDelta }{\\varepsilon +\\\
  sqrt{\\varepsilon²+{\\varDelta}²}}\\\\ {}1\\end{array}\\right]\\right]\\right),\\\
  kern0.5em \\left(\\sqrt{\\varepsilon²+{\\varDelta}²},1,\\left[\\left[\\begin{array}{c}-\\\
  frac{\\varDelta }{\\varepsilon -\\sqrt{\\varepsilon²+{\\varDelta}²}}\\\\ {}1\\end{array}\\\
  right]\\right]\\right)\\right] $$](images/332789_2_En_5_Chapter/332789_2_En_5_Chapter_TeX_Equu.png)\n\
  \n```\nIn [50]: H.eigenvects()\nOut[50]:\n```\n\n`eigenvals` 方法的返回值是一个字典，其中每个特征值是一个键，对应的值是该特征值的重数。这里特征值是\
  \ ![$$ -\\sqrt{\\varepsilon²+{\\varDelta}²} $$](img/332789_2_En_5_Chapter_TeX_IEq4.png)\
  \ 和 ![$$ \\sqrt{\\varepsilon²+{\\varDelta}²} $$](img/332789_2_En_5_Chapter_TeX_IEq5.png)，每个重数均为\
  \ 1。`eigenvects` 的返回值稍微复杂一些：它返回一个列表，其中每个元素是一个元组，包含特征值、该特征值的重数以及一个特征向量列表。每个特征值对应的特征向量数量等于其重数。对于当前示例，我们可以解包\
  \ `eigenvects` 返回的值，并使用如下方法验证这两个特征向量是正交的：\n\n```\nIn [51]: (eval1, _, evec1), (eval2,\
  \ _, evec2) = H.eigenvects()\nIn [52]: sympy.simplify(evec1[0].T * evec2[0])\nOut[52]:\
  \ [0]\n```\n\n\n好的，作为高级文档工程师和翻译员，我将严格遵循您给出的注意事项和示例格式，对提供的英文文本进行翻译。\n\n\n使用这些方法获得特征值和特征向量的解析表达式通常非常理想，但遗憾的是，它仅适用于小型矩阵。对于大于`3\
  \ × 3`的矩阵，即使使用像`SymPy`这样的计算机代数系统，解析表达式通常也会变得极其冗长且难以处理。因此，对于更大的系统，我们必须求助于全数值方法。为此，我们可以使用`SciPy`线性代数包中的`la.eigvals`和`la.eig`函数。厄米矩阵或实对称矩阵具有实数值的特征值，对于此类矩阵，建议改用`la.eigvalsh`和`la.eigh`函数，这能保证函数返回的特征值存储在一个元素为实数的`NumPy`数组中。例如，要使用`la.eig`求解数值特征值问题，我们可以这样操作：\n\
  \n```\nIn [53]: A = np.array([[1, 3, 5], [3, 5, 3], [5, 3, 9]])\nIn [54]: evals,\
  \ evecs = la.eig(A)\nIn [55]: evals\nOut[55]: array([ 13.35310908+0.j,  -1.75902942+0.j,\
  \   3.40592034+0.j])\nIn [56]: evecs\nOut[56]: array([[ 0.42663918,  0.90353276,\
  \ -0.04009445],\n[ 0.43751227, -0.24498225, -0.8651975 ],\n[ 0.79155671, -0.35158534,\
  \  0.49982569]])\nIn [57]: la.eigvalsh(A)\nOut[57]: array([ -1.75902942,   3.40592034,\
  \  13.35310908])\n```\n\n由于此示例中的矩阵是对称的，我们可以使用`la.eigh`和`la.eigvalsh`，从而得到实数值的特征值数组，如前述代码清单中`Out[57]`单元格所示。\n\
  \n## 非线性方程\n\n在本节中，我们考虑*非线性*方程。如本章前几节所述，线性方程组在科学计算中至关重要，因为它们易于求解，并且可以作为许多计算方法和技术的重要构建块。然而，在自然科学和工程学科中，许多（即便不是大多数）系统本质上是非线性的。\n\
  \n线性函数`f(x)`根据定义满足可加性`f(x+y) = f(x) + f(y)`和齐次性`f(αx) = αf(x)`，这两者可以合并写作叠加原理`f(αx\
  \ + βy) = αf(x) + βf(y)`。这给出了线性度的精确定义。相比之下，*非线性*函数是不满足这些条件的函数。因此，非线性是一个更广泛的概念，一个函数可以通过多种不同的方式成为非线性。但通常，包含变量的幂次大于\
  \ 1 的表达式就是非线性的。例如，`x² + x + 1`由于其中的`x²`项而是非线性的。\n\n非线性方程总可以写成`f(x) = 0`的形式，其中`f(x)`是一个非线性函数，我们寻求`x`（可以是标量或向量）的值使得`f(x)`为零。这个`x`被称为函数`f(x)`的根，因此方程求解通常被称为*求根*。与本章前一节相比，在本节中，我们需要区分单变量方程求解和多变量方程，此外还要区分单个方程和方程组。\n\
  \n### 单变量方程\n\n单变量函数是仅依赖于单个变量`f(x)`的函数，其中`x`是标量，相应的单变量方程形式为`f(x) = 0`。这类方程的典型例子包括多项式，例如`x²\
  \ − x + 1 = 0`，以及包含初等函数的表达式，例如`x³ − 3 sin(x) = 0`和`exp(x) − 2 = 0`。与线性系统不同，没有通用方法可以确定非线性方程是否有解，是否有多个解，或者给定的解是否唯一。这可以从以下事实直观理解：非线性函数的图形对应于曲线，这些曲线可以与`x\
  \ = 0`以任意多种方式相交。\n\n由于可能的情况数量庞大，开发一种完全自动化的方法来求解非线性方程是很困难的。从解析角度看，只有特殊形式的方程才能精确求解。例如，最高四阶的多项式（以及某些特殊情况下的更高阶）可以解析求解，一些包含三角函数和其他初等函数的方程可能可以解析求解。在`SymPy`中，我们可以使用`sympy.solve`函数求解许多可解析求解的单变量和非线性方程。例如，要解标准二次方程`a\
  \ + bx + cx² = 0`，我们为方程定义一个表达式并将其传递给`sympy.solve`函数：\n\n```\nIn [58]: x, a, b, c\
  \ = sympy.symbols(\"x, a, b, c\")\nIn [59]: sympy.solve(a + b*x + c*x**2, x)\nOut[59]:\
  \ [(-b + sqrt(-4*a*c + b**2))/(2*c), -(b + sqrt(-4*a*c + b**2))/(2*c)]\n```\n\n\
  这确实是该方程解众所周知的公式。同样的方法可用于求解一些三角方程：\n\n```\nIn [60]: sympy.solve(a * sympy.cos(x)\
  \ - b * sympy.sin(x), x)\nOut[60]: [-2*atan((b - sqrt(a**2 + b**2))/a), -2*atan((b\
  \ + sqrt(a**2 + b**2))/a)]\n```\n\n然而，通常来说，非线性方程通常是无法解析求解的。例如，同时包含多项式表达式和初等函数的方程，例如`sin(x)\
  \ = x`，通常是超越方程，没有代数解。如果我们尝试使用`SymPy`求解此类方程，会以异常形式得到错误：\n\n```\nIn [61]: sympy.solve(sympy.sin(x)-x,\
  \ x)\n...\nNotImplementedError: multiple generators [x, sin(x)]\nNo algorithms are\
  \ implemented to solve equation -x + sin(x)\n```\n\n在这种情况下，我们需要求助于各种数值技术。作为第一步，绘制函数图形通常非常有用。这可以提供关于方程解的数量及其大致位置的重要线索。在应用数值技术来获得方程根的良好近似值时，这些信息通常是必需的。例如，考虑以下示例（`In\
  \ [62]`），它绘制了四个非线性函数的图形，如图 5-5 所示。从这些图形中，我们可以立即得出结论：从左到右绘制的函数分别有 2、3、1 和大量根（至少在所绘制的区间内）。\n\
  \n![../images/332789_2_En_5_Chapter/332789_2_En_5_Fig5_HTML.png](img/332789_2_En_5_Fig5_HTML.png)\n\
  \n图 5-5 四个非线性函数示例的图形\n\n\n\n```python\nx = np.linspace(-2, 2, 1000)\n# 四个非线性函数的示例\n\
  f1 = x**2 - x - 1\nf2 = x**3 - 3 * np.sin(x)\nf3 = np.exp(x) - 2\nf4 = 1 - x**2\
  \ + np.sin(50 / (1 + x**2))\n\n# 绘制每个函数\nfig, axes = plt.subplots(1, 4, figsize=(12,\
  \ 3), sharey=True)\n\nfor n, f in enumerate([f1, f2, f3, f4]):\n    axes[n].plot(x,\
  \ f, lw=1.5)\n    axes[n].axhline(0, ls=':', color=\"k\")\n    axes[n].set_ylim(-5,\
  \ 5)\n    axes[n].set_xticks([-2, -1, 0, 1, 2])\n    axes[n].set_xlabel(r'$x$',\
  \ fontsize=18)\n\naxes[0].set_ylabel(r'$f(x)$', fontsize=18)\n\ntitles = [r'$f(x)=x²-x-1$',\
  \ r'$f(x)=x³-3\\sin(x)$',\n          r'$f(x)=\\exp(x)-2$', r'$f(x)=\\sin\\left(50/(1+x²)\\\
  right)+1-x²$']\nfor n, title in enumerate(titles):\n    axes[n].set_title(title)\n\
  ```\n\n要找到方程根的大致位置，我们可以应用多种数值求根技术中的一种。这些技术通常采用迭代方案，即在连续的点上评估函数，直到算法将解的范围缩小到所需精度。**二分法**和**牛顿法**是说明许多数值求根方法基本思想的两种标准方法。\n\
  \n二分法需要一个起始区间 `[*a*, *b*]`，且满足 `*f*(*a*)` 和 `*f*(*b*)` 符号相反。这保证了该区间内至少存在一个根。在每次迭代中，函数在\
  \ `*a*` 和 `*b*` 之间的中点 `*m*` 处求值。如果函数在 `*a*` 和 `*m*` 点的符号不同，则选择新区间 `[*a*, *b* = *m*]`\
  \ 进行下一次迭代；否则，选择区间 `[*a* = *m*, *b*]` 进行下一次迭代。这保证了在每次迭代中，函数在区间两端点符号不同，并且每次迭代区间长度减半，从而收敛到方程的一个根。下面的代码示例演示了二分法的简单实现，并对每一步进行了图形可视化，如图\
  \ 5-6 所示。\n\n![../images/332789_2_En_5_Chapter/332789_2_En_5_Fig6_HTML.png](img/332789_2_En_5_Fig6_HTML.png)\n\
  \n**图 5-6** 二分法工作过程的图形可视化\n\n```python\n# 定义一个函数、所需容差和起始区间 [a, b]\nf = lambda x:\
  \ np.exp(x) - 2\ntol = 0.1\na, b = -2, 2\nx = np.linspace(-2.1, 2.1, 1000)\n\n#\
  \ 绘制函数 f 的图形\nfig, ax = plt.subplots(1, 1, figsize=(12, 4))\n\nax.plot(x, f(x),\
  \ lw=1.5)\nax.axhline(0, ls=':', color=\"k\")\nax.set_xticks([-2, -1, 0, 1, 2])\n\
  ax.set_xlabel(r'$x$', fontsize=18)\nax.set_ylabel(r'$f(x)$', fontsize=18)\n\n# 使用二分法求根，并在图中可视化该方法的具体步骤\n\
  fa, fb = f(a), f(b)\n\nax.plot(a, fa, 'ko')\nax.plot(b, fb, 'ko')\nax.text(a, fa\
  \ + 0.5, r\"$a$\", ha=\"center\", fontsize=18)\nax.text(b, fb + 0.5, r\"$b$\", ha=\"\
  center\", fontsize=18)\n\nn = 1\nwhile b - a > tol:\n    m = a + (b - a)/2\n   \
  \ fm = f(m)\n\n    ax.plot(m, fm, 'ko')\n    ax.text(m, fm - 0.5, r\"$m_%d$\" %\
  \ n, ha=\"center\")\n    n += 1\n\n    if np.sign(fa) == np.sign(fm):\n        a,\
  \ fa = m, fm\n    else:\n        b, fb = m, fm\n\nax.plot(m, fm, 'r*', markersize=10)\n\
  ax.annotate(\"根大约在 %.3f\" % m,\n            fontsize=14, family=\"serif\",\n   \
  \         xy=(a, fm), xycoords=\"data\",\n            xytext=(-150, +50), textcoords='offset\
  \ points',\n            arrowprops=dict(arrowstyle=\"->\", connectionstyle=\"arc3,\
  \ rad=-.5\"))\n\nax.set_title(\"二分法\")\n```\n\n另一种标准的求根方法是牛顿法，其收敛速度比上一段讨论的二分法更快。二分法仅使用函数在各点的符号，而牛顿法则利用函数的实际值来获得非线性函数的更精确逼近。具体来说，它使用函数\
  \ `*f*(*x*)` 的一阶泰勒展开式 `*f*(*x*+*dx*) = *f*(*x*)+*dx f*'(*x*)` 来逼近该函数，这是一个线性函数，其根很容易求出为\
  \ `*x* – *f*(*x*)/*f*'(*x*)`。当然，这不一定就是函数 `f(x)` 的根，但在许多情况下，它是向 `*f*(*x*)` 的一个根靠近的良好逼近。通过迭代该方案\
  \ `*x*[*k*+1] = *x*[*k*] − *f*(*x*[*k*])/*f*'(*x*[*k*])`，我们可以逐渐逼近函数的根。该方法的一个潜在问题是，如果\
  \ `*f*'(*x*[*k*])` 在某个点 `*x*[*k*]` 处为零，则该方法会失效。在实际实现该方法时，需要处理这种特殊情况。下面的示例（`In [64]`）演示了如何使用该方法求解方程\
  \ `exp(*x*) − 2 = 0` 的根，其中使用 `SymPy` 计算函数 `*f*(*x*)` 的导数，图 5-7 则可视化了该求根过程中的各个步骤。\n\
  \n![../images/332789_2_En_5_Chapter/332789_2_En_5_Fig7_HTML.png](img/332789_2_En_5_Fig7_HTML.png)\n\
  \n**图 5-7** 牛顿法求解方程 `*exp*(*x*) − 2 = 0` 时求根步骤的可视化\n\n```python\n# 定义一个函数、所需容差和起始点\
  \ xk\ntol = 0.01\nxk = 2\n\ns_x = sympy.symbols(\"x\")\ns_f = sympy.exp(s_x) - 2\n\
  \nf = lambda x: sympy.lambdify(s_x, s_f, 'numpy')(x)\nfp = lambda x: sympy.lambdify(s_x,\
  \ sympy.diff(s_f, s_x), 'numpy')(x)\n\nx = np.linspace(-1, 2.1, 1000)\n\n# 建立一个图形用于可视化求根步骤\n\
  fig, ax = plt.subplots(1, 1, figsize=(12, 4))\nax.plot(x, f(x))\nax.axhline(0, ls=':',\
  \ color=\"k\")\n\n# 迭代牛顿法直到收敛到所需容差\nn = 0\nwhile f(xk) > tol:\n    xk_new = xk -\
  \ f(xk) / fp(xk)\n\n    ax.plot([xk, xk], [0, f(xk)], color=\"k\", ls=':')\n   \
  \ ax.plot(xk, f(xk), 'ko')\n    ax.text(xk, -.5, r'$x_%d$' % n, ha=\"center\")\n\
  \    ax.plot([xk, xk_new], [f(xk), 0], 'k-')\n\n    xk = xk_new\n    n += 1\n\n\
  ax.plot(xk, f(xk), 'r*', markersize=15)\nax.annotate(\"根大约在 %.3f\" % xk,\n     \
  \       fontsize=14, family=\"serif\",\n            xy=(xk, f(xk)), xycoords=\"\
  data\",\n            xytext=(-150, +50), textcoords='offset points',\n         \
  \   arrowprops=dict(arrowstyle=\"->\", connectionstyle=\"arc3, rad=-.5\"))\n\nax.set_title(\"\
  牛顿法\")\nax.set_xticks([-1, 0, 1, 2])\n```\n\n\n\n牛顿法的一个潜在问题是，每次迭代都需要函数值及其导数值。在前面的示例中，我们使用`SymPy`符号计算导数。在纯数值实现中，这当然是不可能的，因此需要对导数进行数值近似，而这又会需要额外的函数求值。一种避免计算函数导数的牛顿法变体是割线法，它利用前两次函数求值结果获得函数的线性近似，从而计算根的新估计值。割线法的迭代公式为![$$\
  \ {x}_{k+1}={x}_k-f\\left({x}_k\\right)\\frac{x_k-{x}_{k-1}}{f\\left({x}_k\\right)-f\\\
  left({x}_{k-1}\\right)} $$](img/332789_2_En_5_Chapter_TeX_IEq6.png)。这仅是牛顿法众多变体和改进策略中的一个例子。当前最先进的数值求根函数实现通常采用二分法、牛顿法或两者结合的基本思想，同时还使用各种优化策略（例如高阶函数插值）以实现更快的收敛速度。\n\
  \n`SciPy`的`optimize`模块提供了多个用于数值求根的函数。`optimize.bisect`和`optimize.newton`函数分别实现了二分法和牛顿法的变体。`optimize.bisect`接受三个参数：第一个参数是一个\
  \ Python 函数（例如`lambda`函数），表示待求根方程中的数学函数；第二个和第三个参数是执行二分法的区间下限和上限。注意，如前所述，二分法要求函数在点`a`和`b`处的符号必须不同。使用`optimize.bisect`函数，我们可以计算前面示例中方程`exp(x)\
  \ - 2 = 0`的根，如下所示：\n\n```\nIn [65]: optimize.bisect(lambda x: np.exp(x) - 2, -2,\
  \ 2)\nOut[65]: 0.6931471805592082\n```\n\n只要`f(a)`和`f(b)`确实符号相反，该方法保证在区间`[a, b]`内找到一个根。相比之下，用于牛顿法的`optimize.newton`函数将函数作为第一个参数，将根的初始猜测值作为第二个参数。此外，它还可以通过`fprime`关键字参数指定函数的导数。如果提供了`fprime`，则使用牛顿法；否则使用割线法。为了求解方程`exp(x)\
  \ - 2 = 0`，分别使用指定导数和不指定导数的方式，我们可以这样操作：\n\n```\nIn [66]: x_root_guess = 2\nIn [67]:\
  \ f = lambda x: np.exp(x) – 2\nIn [68]: fprime = lambda x: np.exp(x)\nIn [69]: optimize.newton(f,\
  \ x_root_guess)\nOut[69]: 0.69314718056\nIn [70]: optimize.newton(f, x_root_guess,\
  \ fprime=fprime)\nOut[70]: 0.69314718056\n```\n\n注意，如果函数有多个根，使用这种方法时，我们对计算哪个根的控制能力较弱。例如，无法保证函数返回的根是距离初始猜测值最近的根；我们也无法预先知道根是大于还是小于初始猜测值。\n\
  \n`SciPy`的`optimize`模块还提供了其他求根函数。特别是`optimize.brentq`和`optimize.brenth`函数，它们是二分法的变体，同样适用于函数改变符号的区间。其中`optimize.brentq`函数通常被认为是`SciPy`中首选的通用求根函数。为了使用`optimize.brentq`和`optimize.brenth`函数查找之前同一方程的根，我们可以这样操作：\n\
  \n```\nIn [71]: optimize.brentq(lambda x: np.exp(x) - 2, -2, 2)\nOut[71]: 0.6931471805599453\n\
  In [72]: optimize.brenth(lambda x: np.exp(x) - 2, -2, 2)\nOut[72]: 0.6931471805599381\n\
  ```\n\n注意，这两个函数将方程的 Python 函数作为第一个参数，将符号变化区间的下限和上限分别作为第二个和第三个参数。\n\n\n\n"
- "# 非线性方程组\n\n与线性方程组不同，我们通常无法将非线性方程组写成矩阵-向量乘法的形式。相反，我们将多元非线性方程组表示为一个向量值函数，例如 `f`\
  \ : ℝ^(*N*) → ℝ^(*N*)，该函数接收一个 N 维向量并将其映射为另一个 N 维向量。求解多元方程组比求解单变量方程复杂得多，部分原因在于其可能的行为模式更加多样。因此，没有任何方法能严格保证收敛到某个解（例如用于单变量非线性方程的二分法），而现有的方法在计算上比单变量情况要求更高，尤其是当变量数量增加时。\n\
  \n并非所有之前讨论的单变量方程求解方法都能推广到多元情况。例如，二分法无法直接推广到多元方程组。另一方面，牛顿法可以用于多元问题，此时其迭代公式为 `x[k+1]\
  \ = x[k] - Jf^(-1) f(x[k])`，其中 `Jf` 是函数 `f(x)` 的雅可比矩阵，其元素为 `J[f][ij] = ∂fi/∂x[j]`。无需直接求雅可比矩阵的逆，只需解线性方程组\
  \ `Jf δx[k] = - f(x[k])`，然后使用 `x[k+1] = x[k] + δx[k]` 更新 `x[k]`。与单变量方程组的牛顿法割线变体类似，也存在避免计算雅可比矩阵的多元方法变体，这些方法通过先前函数求值结果来估计雅可比矩阵。**布罗伊登法**就是这类用于多元方程组的割线更新方法中一个流行的例子。在\
  \ SciPy 的 `optimize` 模块中，`broyden1` 和 `broyden2` 提供了布罗伊登法的两种实现，使用了不同的雅可比矩阵近似方式；而\
  \ `optimize.fsolve` 函数则提供了一种类牛顿法的实现，如果有雅可比矩阵，可以选择性地指定。这些函数的签名都类似：第一个参数是一个 Python\
  \ 函数，代表待求解的方程，它应接受一个 NumPy 数组作为第一个参数，并返回一个形状相同的数组。第二个参数是解的初始猜测值，以 NumPy 数组形式给出。`optimize.fsolve`\
  \ 函数还接受一个可选的关键字参数 `fprime`，可用于提供一个返回函数 `f(x)` 雅可比矩阵的函数。此外，所有这些函数都接受大量可选的关键字参数来调整其行为（详见文档字符串）。\n\
  \n例如，考虑以下包含两个多元非线性方程的方程组\n\n![$$ \\Big\\{{\\displaystyle \\begin{array}{r}y-{x}³-2{x}²+1=0\\\
  \\ {}y+{x}²-1=0\\end{array}}, $$](img/332789_2_En_5_Chapter_TeX_Equv.png)\n\n这可以用向量值函数\
  \ `f([x[1], x[2]]) = [x[2] - x[1]³ - 2*x[1]² + 1, x[2] + x[1]² - 1]` 表示。要使用 SciPy\
  \ 求解此方程组，我们需要为 `f([x[1], x[2]])` 定义一个 Python 函数，然后调用（例如）`optimize.fsolve`，并传入该函数和求解向量的初始猜测值：\n\
  \n```\nIn [73]: def f(x):\n   ...:     return [x[1] - x[0]**3 - 2 * x[0]**2 + 1,\
  \ x[1] + x[0]**2 - 1]\nIn [74]: optimize.fsolve(f, [1, 1])\nOut[74]: array([ 0.73205081,\
  \  0.46410162])\n```\n\n`optimize.broyden1` 和 `optimize.broyden2` 的使用方法类似。要为 `optimize.fsolve`\
  \ 指定雅可比矩阵，我们需要定义一个函数，用于计算给定输入向量的雅可比矩阵。这要求我们先手动推导雅可比矩阵，或者使用 SymPy 等工具：\n\n![$$ \\\
  left(\\begin{array}{cc}-3{x}²-4x&amp; 1\\\\ {}2x&amp; 1\\end{array}\\right) $$](img/332789_2_En_5_Chapter_TeX_Equw.png)\n\
  \n```\nIn [75]: x, y = sympy.symbols(\"x, y\")\nIn [76]: f_mat = sympy.Matrix([y\
  \ - x**3 -2*x**2 + 1, y + x**2 - 1])\nIn [77]: f_mat.jacobian(sympy.Matrix([x, y]))\n\
  Out[77]:\n```\n\n然后，我们可以轻松地将其实现为一个 Python 函数，并将其传递给 `optimize.fsolve` 函数：\n\n```\n\
  In [78]: def f_jacobian(x):\n   ...:     return [[-3*x[0]**2-4*x[0], 1], [2*x[0],\
  \ 1]]\nIn [79]: optimize.fsolve(f, [1, 1], fprime=f_jacobian)\nOut[79]: array([\
  \ 0.73205081,  0.46410162])\n```\n\n与单变量非线性方程组的牛顿法一样，解的初始猜测值非常重要，不同的初始猜测值可能导致方程找到不同的解。虽然初始猜测值越接近真实解通常越有可能收敛到该特定解，但无法保证一定能找到某个特定解。在可能的情况下，绘制待求解方程的图形通常是一个好方法，可以直观地显示解的数量及其位置。例如，以下代码展示了如何通过为\
  \ `optimize.fsolve` 函数使用不同的初始猜测值，找到我们所考虑的方程组的三个不同解。结果如图 5-8 所示。\n\n![../images/332789_2_En_5_Chapter/332789_2_En_5_Fig8_HTML.png](img/332789_2_En_5_Fig8_HTML.png)\n\
  \n**图 5-8** 一个包含两个非线性方程的方程组图形。解用红色星号表示，初始猜测值用黑色圆点表示，箭头指向该初始猜测值最终收敛到的解。\n\n```\n\
  In [80]: def f(x):\n   ...:     return [x[1] - x[0]**3 - 2 * x[0]**2 + 1,\n   ...:\
  \             x[1] + x[0]**2 - 1]\n   ...:\n   ...: x = np.linspace(-3, 2, 5000)\n\
  \   ...: y1 = x**3 + 2 * x**2 -1\n   ...: y2 = -x**2 + 1\n   ...:\n   ...: fig,\
  \ ax = plt.subplots(figsize=(8, 4))\n   ...:\n   ...: ax.plot(x, y1, 'b', lw=1.5,\
  \ label=r'$y = x³ + 2x² - 1$')\n   ...: ax.plot(x, y2, 'g', lw=1.5, label=r'$y =\
  \ -x² + 1$')\n   ...:\n   ...: x_guesses = [[-2, 2], [1, -1], [-2, -5]]\n   ...:\
  \ for x_guess in x_guesses:\n   ...:     sol = optimize.fsolve(f, x_guess)\n   ...:\
  \     ax.plot(sol[0], sol[1], 'r*', markersize=15)\n   ...:\n   ...:     ax.plot(x_guess[0],\
  \ x_guess[1], 'ko')\n   ...:     ax.annotate(\"\", xy=(sol[0], sol[1]), xytext=(x_guess[0],\
  \ x_guess[1]),\n   ...:                 arrowprops=dict(arrowstyle=\"->\", linewidth=2.5))\n\
  \   ...:\n   ...: ax.legend(loc=0)\n   ...: ax.set_xlabel(r'$x$', fontsize=18)\n\
  ```\n\n通过使用不同的初始猜测值系统地求解方程组，我们可以构建一个可视化结果，展示不同初始猜测值如何收敛到不同的解。下面的代码示例演示了这一点，结果如图\
  \ 5-9 所示。这个例子表明，即使对于这个相对简单的示例，收敛到不同解的初始猜测值区域也非常复杂，并且还存在一些缺失的点，这些点对应于算法未能收敛到任何解的初始猜测值。求解非线性方程是一项复杂的任务，不同类型的可视化在帮助理解特定问题的特征时，往往是一种有价值的工具。\n\
  \n![../images/332789_2_En_5_Chapter/332789_2_En_5_Fig9_HTML.png](img/332789_2_En_5_Fig9_HTML.png)\n\
  \n**图 5-9** 不同初始猜测值收敛到不同解的可视化。每个点代表一个初始猜测值，其颜色编码指示它最终收敛到哪个解。解用相应颜色编码的星号标记。\n\n\n\
  \n```ipython\nIn [81]: fig, ax = plt.subplots(figsize=(8, 4))\n...:\n...: ax.plot(x,\
  \ y1, 'k', lw=1.5)\n...: ax.plot(x, y2, 'k', lw=1.5)\n...:\n...: sol1 = optimize.fsolve(f,\
  \ [-2,  2])\n...: sol2 = optimize.fsolve(f, [ 1, -1])\n...: sol3 = optimize.fsolve(f,\
  \ [-2, -5])\n...: sols = [sol1, sol2, sol3]\n...: for idx, s in enumerate(sols):\n\
  ...:     ax.plot(s[0], s[1], colors[idx]+'*', markersize=15)\n...:\n...: colors\
  \ = ['r', 'b', 'g']\n...: for m in np.linspace(-4, 3, 80):\n...:     for n in np.linspace(-15,\
  \ 15, 40):\n...:         x_guess = [m, n]\n...:         sol = optimize.fsolve(f,\
  \ x_guess)\n...:         idx = (abs(sols - sol)**2).sum(axis=1).argmin()\n...: \
  \        ax.plot(x_guess[0], x_guess[1], colors[idx]+'.')\n...:\n...: ax.set_xlabel(r'$x$',\
  \ fontsize=18)\n```\n\n## 总结\n\n本章我们探讨了使用 SymPy 和 SciPy 库求解代数方程的方法。方程求解是计算科学中最基础的数学工具之一，它既是许多算法和方法的重要组成部分，也在众多问题求解场景中有直接应用。在某些情况下，存在解析代数解，尤其是对于多项式或包含特定初等函数组合的方程，这类方程通常可以用\
  \ SymPy 进行符号处理。对于没有代数解的方程以及更大规模的方程组，数值方法通常是唯一可行的途径。线性方程组总是可以系统性地求解，因此线性方程组具有大量重要应用，无论是针对原本线性的系统，还是作为对原本非线性系统的近似。非线性方程求解需要一套不同的方法，与线性方程组相比，它通常复杂得多且计算量更大。事实上，求解线性方程组是许多现有非线性方程组求解方法中迭代法的重要步骤。对于数值方程求解，我们可以使用\
  \ SciPy 中的线性代数和优化模块，这些模块为线性与非线性系统的数值求根和方程求解提供了高效且经过充分测试的方法。\n\n## 延伸阅读\n\n方程求解是一种基础数值技术，其方法在大多数入门级数值分析教材中都有涵盖。Heath（2001）的著作是覆盖这些主题的典范，而\
  \ W.H. Press（2007）则提供了带有实现细节的实用介绍。\n\n"
- "# 6. 优化\n\n本章将基于第[5]章关于方程求解的内容，进一步探讨优化问题的求解。一般而言，优化是从一组可行候选方案中寻找并选择最优元素的过程。在数学优化中，该问题通常被表述为确定函数在给定定义域上的极值。极值或最优值可以指函数的最小值或最大值，具体取决于应用场景和特定问题。本章关注的是单变量或多变量实值函数的优化，这些函数可以选择性地受限于一组约束条件，从而限制其定义域。\n\
  \n数学优化的应用广泛多样，解决优化问题所需的方法和算法也同样丰富。由于优化是一种普遍重要的数学工具，它已在许多科学与工程领域得到发展和应用，描述优化问题的术语也因领域而异。例如，被优化的数学函数可能被称为成本函数、损失函数、能量函数或目标函数等。此处我们使用通用术语“目标函数”。\n\
  \n优化与方程求解密切相关，因为在函数的最优值处，其导数（对于多变量情况称为梯度）为零。反之则不一定成立，但求解优化问题的一种方法是求解导数（或梯度）的零点，然后检验所得候选点是否为最优。然而，这种方法并非总是可行，通常需要采用其他数值方法，其中许多方法与第[5]章讨论的数值求根方法密切相关。\n\
  \n本章将讨论如何使用 SciPy 的优化模块 `optimize` 处理非线性优化问题，并简要探讨如何使用凸优化库 `cvxopt` 处理带有线性约束的线性优化问题。该库还提供了强大的二次规划问题求解器。\n\
  \n### cvxopt\n\n凸优化库 `cvxopt` 提供了线性和二次优化问题的求解器。在撰写本文时，其最新版本为 1.1.9。更多信息请参阅项目网站 [`cvxopt.org`](http://cvxopt.org)。此处我们使用该库进行带约束的线性优化。\n\
  \n## 导入模块\n\n与上一章类似，此处我们使用 SciPy 库的 `optimize` 模块。假设该模块按以下方式导入：\n\n```ipython\n\
  In [1]: from scipy import optimize\n```\n\n在本章后半部分，我们还将使用 `cvxopt` 库进行线性规划，假设该库整体导入且不带任何别名：\n\
  \n```ipython\nIn [2]: import cvxopt\n```\n\n为了进行基本的数值计算、符号计算和绘图，此处我们还使用了 NumPy、SymPy\
  \ 和 Matplotlib 库，并按照前几章引入的惯例进行导入和初始化：\n\n```ipython\nIn [3]: import matplotlib.pyplot\
  \ as plt\nIn [4]: import numpy as np\nIn [5]: import sympy\nIn [6]: sympy.init_printing()\n\
  ```\n\n\n\n## 优化问题分类\n\n此处我们将重点放在实值函数的数学优化上，这类函数包含一个或多个自变量。许多数学优化问题都可以用这种方式表述，但一个显著的例外是离散变量（例如整数）上的函数优化，这超出了本书的讨论范围。\n\
  \n这里考虑的一般优化问题可以表述为一个最小化问题：![$$ {\\min}_xf(x) $$](img/332789_2_En_6_Chapter_TeX_IEq1.png)，需满足一组*m*个等式约束`g(x)\
  \ = 0`和*p*个不等式约束`h(x) ≤ 0`。此处`f(x)`是`x`的实值函数，`x`可以是标量或向量`x = (x[0], x[1], …, x[n])^T`，而`g(x)`和`h(x)`可以是向量值函数：`f\
  \ : ℝ^n ⟶ ℝ`，`g : ℝ^n ⟶ ℝ^m`，`h : ℝ^n ⟶ ℝ^p`。注意，最大化`f(x)`等价于最小化`-f(x)`，因此不失一般性，只需考虑最小化问题即可。\n\
  \n根据目标函数`f(x)`以及等式和不等式约束`g(x)`与`h(x)`的性质，这种表述涵盖了极其丰富的问题类型。这种形式的通用数学优化问题很难求解，并且没有能够解决完全通用的优化问题的有效方法。然而，对于许多重要的特例，存在高效的方法，因此在优化中，尽可能多地了解目标函数和约束条件对于能否解决问题至关重要。\n\
  \n优化问题根据函数`f(x)`、`g(x)`和`h(x)`的性质进行分类。首先，如果`x`是标量，`x ∈ ℝ`，则问题是*单变量*或*一维*的；如果`x`是向量，`x\
  \ ∈ ℝ^n`，则问题是*多变量*或*多维*的。对于高维目标函数，随着`n`增大，优化问题更难求解，计算需求也更高。如果目标函数和所有约束都是线性的，则该问题是一个线性优化问题，或*线性规划*问题。如果目标函数或约束中任何一个是非线性的，则属于非线性优化问题，或*非线性规划*问题。就约束而言，优化的重要子类包括无约束问题，以及具有线性约束和非线性约束的问题。最后，处理等式约束和不等式约束需要不同的方法。\n\
  \n通常，非线性问题比线性问题难解得多，因为其可能的行为模式更加多样化。一般的非线性问题可能同时存在局部极小值和全局极小值，这使得寻找全局极小值非常困难：如果同时存在局部和全局极小值，迭代求解器可能会收敛到局部极小值而非全局极小值，甚至可能完全无法收敛。然而，有一类可以高效求解的非线性问题的重要子类是*凸问题*，这直接与不存在严格局部极小值以及存在唯一全局极小值相关。根据定义，如果函数在区间`[a,\
  \ b]`上的值都位于端点`(a, f(a))`和`(b, f(b))`连线之下，则该函数在区间`[a, b]`上是凸的。这个条件可以很容易地推广到多变量情形，它隐含了许多重要性质，例如在该区间上存在唯一极小值。正因为具有这类强大性质，凸问题即使是非线性的，也能被高效求解。局部极小值和全局极小值，以及凸函数与非凸函数的概念，如图\
  \ 6-1 所示。\n\n![../images/332789_2_En_6_Chapter/332789_2_En_6_Fig1_HTML.png](img/332789_2_En_6_Fig1_HTML.png)\n\
  \n图 6-1\n\n凸函数（左图）与非凸函数（右图）的示意图，其中包含一个全局极小值和两个局部极小值\n\n目标函数`f(x)`以及约束`g(x)`和`h(x)`是否连续且光滑，这一性质对解决优化问题所能采用的方法和技术有着非常重要的影响。这些函数或其导数或梯度中存在的不连续性会给许多现有的优化问题求解方法带来困难，在后续内容中，我们假设这些函数确实是连续且光滑的。与此相关的是，如果函数本身不能精确获知，而是因测量或其他原因包含噪声，那么后面讨论的许多方法可能并不适用。\n\
  \n连续且光滑函数的优化与非线性方程求解密切相关，因为函数`f(x)`的极值对应于其导数（或梯度）为零的点。因此，寻找`f(x)`最优值的候选点等价于求解（通常是非线性的）方程组`∇f(x)\
  \ = 0`。然而，`∇f(x) = 0`的解（称为驻点）并不一定对应`f(x)`的极小值；它也可能是极大值或鞍点，见图 6-2。因此，通过求解`∇f(x) =\
  \ 0`得到的候选点需要进行最优性检验。对于无约束目标函数，可以使用高阶导数或 Hessian 矩阵\n\n![$$ {\\left\\{{H}_f(x)\\\
  right\\}}_{ij}=\\frac{\\partial²f(x)}{\\partial {x}_i\\partial {x}_j}, $$](img/332789_2_En_6_Chapter_TeX_Equa.png)\n\
  \n（对于多变量情形）来确定一个驻点是否为局部极小值。特别是，如果在驻点`x^*`处二阶导数为正，或 Hessian 矩阵正定，则`x^*`是一个局部极小值。二阶导数为负，或\
  \ Hessian 矩阵负定，对应局部极大值；而二阶导数为零，或 Hessian 矩阵不定，则对应鞍点。\n\n![../images/332789_2_En_6_Chapter/332789_2_En_6_Fig2_HTML.png](img/332789_2_En_6_Fig2_HTML.png)\n\
  \n图 6-2\n\n一维函数不同驻点的示意图\n\n因此，通过代数方法求解方程组`∇f(x) = 0`并对候选解进行最优性检验，是解决优化问题的一种可能策略。然而，这并非总是可行的方法。特别是，我们可能没有`f(x)`的解析表达式来求导，并且由此产生的非线性方程组可能不易求解，尤其是要找到其所有根。对于这种情况，存在其他的数值优化方法，其中一些方法与第\
  \ 5 章讨论的求根方法有相似之处。在本章的剩余部分，我们将探讨各种类型的优化问题，以及如何利用可用的 Python 优化库在实际中解决这些问题。\n\n\n\n\
  ## 单变量优化\n\n仅依赖于单个变量的函数优化相对容易。除了求函数导数根的解析方法外，我们还可以采用类似于单变量函数求根的技术，即括号法和牛顿法。\n\n\
  与单变量求根的二分法类似，我们可以使用括号法，并仅通过函数评估来迭代地细化区间。要细化包含最小值的区间 [*a*， *b*]，可以通过在两个内部点 *x*[1]\
  \ 和 *x*[2]（其中 *x*[1] < *x*[2]）处评估函数来实现：如果 *f* (*x*[1]) > *f* (*x*[2])，则选择 [*x*[1]，\
  \ *b*] 作为新区间；否则选择 [*a*， *x*[2]]。这一思想被用于*黄金分割搜索*方法，该方法还巧妙地选择了 *x*[1] 和 *x*[2]，使得它们在\
  \ [*a*， *b*] 区间内的相对位置满足黄金比例。这种方法的优点是可以重用上一次迭代中的一次函数评估，因此每次迭代只需要进行一次新的函数评估，同时每次迭代都能以恒定因子缩小区间。对于在给定区间上具有唯一最小值的函数，这种方法保证收敛到最优解，但对于更复杂的函数，则无法保证。因此，仔细选择初始区间非常重要，理想情况下应尽可能接近最优点。在\
  \ SciPy 的 `optimize` 模块中，`golden` 函数实现了黄金搜索法。\n\n与求根的二分法类似，黄金搜索法是一种（相对）安全但收敛速度较慢的方法。如果利用函数评估的值，而不仅仅是将这些值相互比较（类似于仅使用函数的符号，如二分法），则可以构造出收敛性更好的方法。函数值可用于拟合多项式，例如二次多项式，然后通过插值找到新的最小值近似点，从而获得一个新的函数评估候选点，之后可以重复该过程。这种方法收敛速度更快，但比括号法风险更大，可能根本不收敛，或者收敛到给定括号区间之外的局部最小值。\n\
  \n牛顿求根法是一种二次近似方法，可以通过将方法应用于函数的导数而不是函数本身来寻找函数的最小值。由此得出迭代公式 *x*[*k*+1] = *x*[*k*]\
  \ − *f* '(*x*[*k*])/*f* ''(*x*[*k*])。如果初始点接近最优点，该公式可以快速收敛，但如果初始点离最优值太远，则可能根本不收敛。该公式还要求在每次迭代中同时计算一阶导数和二阶导数。如果这些导数有解析表达式可用，则这是一个很好的方法。如果只能进行函数评估，则可以使用类似于求根的割线法来近似导数。\n\
  \n在实际的单变量优化程序实现中，通常结合前两种方法，以获得稳定性和快速收敛性。在 SciPy 的 `optimize` 模块中，`brent` 函数就是这种混合方法，通常是用\
  \ SciPy 优化单变量函数的首选方法。该方法是黄金分割搜索法的一种变体，它使用逆抛物线插值来获得更快的收敛速度。\n\n除了直接调用 `optimize.golden`\
  \ 和 `optimize.brent` 函数外，更方便的是使用统一接口函数 `optimize.minimize_scalar`，该函数根据 `method`\
  \ 关键字参数的值分派给 `optimize.golden` 和 `optimize.brent` 函数。当前允许的选项有 `'Golden'`、`'Brent'`\
  \ 或 `'Bounded'`。最后一个选项分派给 `optimize.fminbound`，它在一个有界区间上执行优化，这对应于一个带有不等式约束的优化问题，该约束限制了目标函数\
  \ *f* (*x*) 的定义域。请注意，`optimize.golden` 和 `optimize.brent` 函数可能收敛到初始括号区间之外的局部最小值，但\
  \ `optimize.fminbound` 在这种情况下会返回允许范围边界处的值。\n\n作为说明这些技术的一个示例，考虑以下经典优化问题：在单位体积下最小化圆柱体的表面积。在此，合适的变量是圆柱体的半径\
  \ *r* 和高度 *h*，目标函数为 *f*([*r*， *h*]) = 2*πr*²+2*πrh*，受等式约束 *g*([*r*， *h*]) = *πr*²*h*\
  \ − 1 = 0。正如这里所表述的，这是一个带有等式约束的二维优化问题。但是，我们可以代数求解其中一个依赖变量的约束方程，例如 *h* = 1/*πr*²，然后将其代入目标函数，从而得到一个无约束的一维优化问题：*f*(*r*)\
  \ = 2*πr*²+2/*r*。首先，我们可以使用 SymPy 符号化地解决这个问题，即令 *f* (*r*) 的导数等于零：\n\n![$$ \\frac{2^{2/3}}{2\\\
  sqrt[3]{\\pi }} $$](images/332789_2_En_6_Chapter/332789_2_En_6_Chapter_TeX_Equb.png)\n\
  \n```python\nIn [7]: r, h = sympy.symbols(\"r, h\")\nIn [8]: Area = 2 * sympy.pi\
  \ * r**2 + 2 * sympy.pi * r * h\nIn [9]: Volume = sympy.pi * r**2 * h\nIn [10]:\
  \ h_r = sympy.solve(Volume - 1)[0]\nIn [11]: Area_r = Area.subs(h_r)\nIn [12]: rsol\
  \ = sympy.solve(Area_r.diff(r))[0]\nIn [13]: rsol\nOut[13]:\n```\n\n```python\n\
  In [14]: _.evalf()\nOut[14]: 0.541926070139289\n```\n\n现在验证二阶导数为正，并且 `rsol` 对应于一个最小值点：\n\
  \n![$$ 3\\sqrt[3]{2\\pi } $$](images/332789_2_En_6_Chapter/332789_2_En_6_Chapter_TeX_Equc.png)\n\
  \n```python\nIn [15]: Area_r.diff(r, 2).subs(r, rsol)\nOut[15]: 12π\nIn [16]: Area_r.subs(r,\
  \ rsol)\nOut[16]:\n```\n\n```python\nIn [17]: _.evalf()\nOut[17]: 5.53581044593209\n\
  ```\n\n对于简单问题，这种方法通常是可行的，但对于更实际的问题，我们通常需要借助数值技术。为了使用 SciPy 的数值优化函数解决这个问题，我们首先定义一个\
  \ Python 函数 `f` 来实现目标函数。然后，为了求解优化问题，我们将这个函数传递给例如 `optimize.brent`。我们还可以选择使用 `brack`\
  \ 关键字参数来指定算法的起始区间：\n\n```python\nIn [18]: def f(r):\n...:     return 2 * np.pi *\
  \ r**2 + 2 / r\nIn [19]: r_min = optimize.brent(f, brack=(0.1, 4))\nIn [20]: r_min\n\
  Out[20]: 0.541926077256\nIn [21]: f(r_min)\nOut[21]: 5.53581044593\n```\n\n除了直接调用\
  \ `optimize.brent` 之外，我们还可以使用标量最小化问题的通用接口 `optimize.minimize_scalar`。请注意，在这种情况下要指定起始区间，我们必须使用\
  \ `bracket` 关键字参数：\n\n```python\nIn [22]: optimize.minimize_scalar(f, bracket=(0.1,\
  \ 4))\nOut[22]:  nit: 13\nfun: 5.5358104459320856\nx: 0.54192606489766715\nnfev:\
  \ 14\n```\n\n\n\n所有这些方法得出的最小化圆柱体表面积的半径约为 0.54（符号计算的确切结果为`2^{2/3} / (2 * (π^(1/3)))`），最小表面积约为\
  \ 5.54（确切结果为`3 * (2π)^(1/3)`）。本示例中我们最小化的目标函数绘制在图 6-3 中，其中最小值用红色星号标记。在可能的情况下，最好在进行数值优化之前先可视化目标函数，因为这有助于为数值优化程序确定合适的初始区间或起始点。\n\
  \n![../images/332789_2_En_6_Chapter/332789_2_En_6_Fig3_HTML.png](img/332789_2_En_6_Fig3_HTML.png)\n\
  \n**图 6-3**  \n*单位体积圆柱体的表面积随半径 r 变化的函数*\n\n## 无约束多变量优化\n\n多变量优化比上一节讨论的单变量优化困难得多。特别是，在多元情况下，通过求解梯度根的非线性方程组的分析方法几乎不可行，而黄金搜索法中使用的区间划分法也无法直接应用。相反，我们必须采用从坐标空间中的某个点开始，并运用不同策略向最小值的更优近似点移动的技术。这类方法中最基本的是考虑目标函数`f(x)`在给定点`x`处的梯度`∇f(x)`。通常，梯度的负值`-∇f(x)`总是指向函数`f(x)`下降最快的方向。因此，作为最小化策略，合理的做法是沿着该方向移动一定距离`α[k]`，然后在新点处迭代这一方案。这种方法称为*最速下降法*，其迭代公式为`x[k+1]\
  \ = x[k] - α[k] ∇f(x[k])`，其中`α[k]`是一个自由参数，称为*线搜索参数*，它描述了每次迭代中沿给定方向移动的距离。例如，可以通过求解一维优化问题`min_{α_k}\
  \ f(x_k - α_k ∇f(x_k))`来选择合适的`α[k]`。该方法确保能够取得进展并最终收敛到函数的最小值，但收敛速度可能相当慢，因为这种方法往往沿梯度方向过度调整，导致在接近最小值时呈锯齿形路径。尽管如此，最速下降法仍是许多多变量优化算法的概念基础，通过适当的修改可以加快收敛速度。\n\
  \n用于多变量优化的牛顿法是对最速下降法的一种改进，可以提升收敛性。与单变量情况类似，牛顿法可视为函数的局部二次近似，在其最小化时得到一个迭代方案。在多变量情况下，迭代公式为`x_{k+1}\
  \ = x_k - H_f^(-1)(x_k) ∇f(x_k)`，与最速下降法相比，梯度被替换为梯度左乘海森矩阵的逆。^((33)) 这通常同时改变了步长的方向和长度，因此该方法并非严格意义上的最速下降法，如果起始点离最小值太远，可能无法收敛。然而，当接近最小值时，它收敛很快。与往常一样，收敛速度和稳定性之间存在权衡。按照这里给出的公式，牛顿法需要同时知道函数的梯度和海森矩阵。\n\
  \n\n\n"
- '# 排版后


  在 SciPy 中，牛顿法由函数 `optimize.fmin_ncg` 实现。该函数接受以下参数：目标函数的 Python 函数、起始点、用于计算梯度的 Python
  函数，以及（可选）用于计算海森矩阵的 Python 函数。为了了解如何使用此方法求解优化问题，我们考虑以下问题：![$$ {\min}_xf(x) $$](img/332789_2_En_6_Chapter_TeX_IEq6.png)，其中目标函数为
  *f* (*x*) = (*x*[1] − 1)⁴+5(*x*[2] − 1)² − 2*x*[1]*x*[2]。要应用牛顿法，我们需要计算梯度和海森矩阵。针对这个特定案例，可以轻松手动完成。然而，出于通用性考虑，下面我们使用
  SymPy 来计算梯度和海森矩阵的符号表达式。为此，我们首先为目标函数定义符号和符号表达式，然后使用 `sympy.diff` 函数对每个变量求导，以获得符号形式的梯度和海森矩阵：


  ![$$ \left[\begin{array}{c}-2{x}_2+4{\left({x}_1-1\right)}³\\ {}-2{x}_1+10{x}_2-10\end{array}\right]
  $$](images/332789_2_En_6_Chapter/332789_2_En_6_Chapter_TeX_Equd.png)


  ```python

  In [23]: x1, x2 = sympy.symbols("x_1, x_2")

  In [24]: f_sym = (x1-1)**4 + 5 * (x2-1)**2 - 2*x1*x2

  In [25]: fprime_sym = [f_sym.diff(x_) for x_ in (x1, x2)]

  In [26]: # Gradient

  ...: sympy.Matrix(fprime_sym)

  Out[26]:

  ```


  ![$$ \left[\begin{array}{cc}12{\left({x}_1-1\right)}²&amp; -2\\ {}-2&amp; 10\end{array}\right]
  $$](images/332789_2_En_6_Chapter/332789_2_En_6_Chapter_TeX_Eque.png)


  ```python

  In [27]: fhess_sym = [[f_sym.diff(x1_, x2_) for x1_ in (x1, x2)] for x2_ in (x1,
  x2)]

  In [28]: # Hessian

  ...: sympy.Matrix(fhess_sym)

  Out[28]:

  ```


  现在我们有了梯度和海森矩阵的符号表达式，可以使用 `sympy.lambdify` 为这些表达式创建向量化函数。


  ```python

  In [29]: f_lmbda = sympy.lambdify((x1, x2), f_sym, ''numpy'')

  In [30]: fprime_lmbda = sympy.lambdify((x1, x2), fprime_sym, ''numpy'')

  In [31]: fhess_lmbda = sympy.lambdify((x1, x2), fhess_sym, ''numpy'')

  ```


  然而，`sympy.lambdify` 生成的函数为相应表达式中的每个变量接受一个参数，而 SciPy 优化函数期望一个向量化函数，其中所有坐标都打包在一个数组中。为了获得与
  SciPy 优化例程兼容的函数，我们将 `sympy.lambdify` 生成的每个函数包装到一个重新排列参数的 Python 函数中：


  ```python

  In [32]: def func_XY_to_X_Y(f):

  ...:     """

  ...:     Wrapper for f(X) -> f(X[0], X[1])

  ...:     """

  ...:     return lambda X: np.array(f(X[0], X[1]))

  In [33]: f = func_XY_to_X_Y(f_lmbda)

  In [34]: fprime = func_XY_to_X_Y(fprime_lmbda)

  In [35]: fhess = func_XY_to_X_Y(fhess_lmbda)

  ```


  现在，函数 `f`、`fprime` 和 `fhess` 是向量化的 Python 函数，其形式符合例如 `optimize.fmin_ncg` 的期望，我们可以通过调用此函数对当前问题进行数值优化。除了我们从
  SymPy 表达式准备的函数外，我们还需要为牛顿法提供一个起始点。这里我们使用 (0, 0) 作为起始点。


  ```python

  In [36]: x_opt = optimize.fmin_ncg(f, (0, 0), fprime=fprime, fhess=fhess)

  Optimization terminated successfully.

  Current function value: -3.867223

  Iterations: 8

  Function evaluations: 10

  Gradient evaluations: 17

  Hessian evaluations: 8

  In [37]: x_opt

  Out[37]: array([ 1.88292613,  1.37658523])

  ```


  该例程找到了一个极小点 (*x*[1], *x*[2]) = (1.88292613, 1.37658523)，并且还将关于解的诊断信息打印到标准输出，包括迭代次数以及到达解所需的函数、梯度和海森矩阵计算次数。通常情况下，可视化目标函数和解是说明性的（见图
  6-4）：


  ![../images/332789_2_En_6_Chapter/332789_2_En_6_Fig4_HTML.png](img/332789_2_En_6_Fig4_HTML.png)


  **图 6-4**


  *目标函数* *f*(*x*) = (*x*[1] − 1)⁴+5(*x*[2] − 1)² − 2*x*[1]*x*[2]*的等高线图。极小点用红色星号标记。*


  ```python

  In [38]: fig, ax = plt.subplots(figsize=(6, 4))

  ...: x_ = y_ = np.linspace(-1, 4, 100)

  ...: X, Y = np.meshgrid(x_, y_)

  ...: c = ax.contour(X, Y, f_lmbda(X, Y), 50)

  ...: ax.plot(x_opt[0], x_opt[1], ''r*'', markersize=15)

  ...: ax.set_xlabel(r"$x_1$", fontsize=18)

  ...: ax.set_ylabel(r"$x_2$", fontsize=18)

  ...: plt.colorbar(c, ax=ax)

  ```


  在实际应用中，并不总是能够提供同时计算目标函数梯度和海森矩阵的函数，通常使用仅需要函数求值的求解器会更方便。对于这种情况，存在几种方法来数值估计梯度或海森矩阵，或两者都估计。近似海森矩阵的方法被称为拟牛顿法，也存在完全避免使用海森矩阵的其他迭代方法。两种流行的方法是
  Broyden-Fletcher-Goldfarb-Shanno (BFGS) 方法和共轭梯度法，它们在 SciPy 中分别由函数 `optimize.fmin_bfgs`
  和 `optimize.fmin_cg` 实现。BFGS 方法是一种拟牛顿法，可以逐步建立海森矩阵的数值估计，如果需要，也可以建立梯度的数值估计。共轭梯度法是梯度下降法的一种变体，不使用海森矩阵，它可以与仅通过函数求值获得的梯度数值估计一起使用。使用这些方法解决问题所需的函数求值次数远多于牛顿法，而牛顿法则还需要计算梯度和海森矩阵。`optimize.fmin_bfgs`
  和 `optimize.fmin_cg` 都可以选择性地接受一个用于计算梯度的函数，但如果不提供，梯度将从函数求值中估计出来。


  前面给出的用牛顿法求解的问题，也可以使用 `optimize.fmin_bfgs` 和 `optimize.fmin_cg` 求解，而无需提供海森矩阵的函数：


  ```python

  In [39]: x_opt = optimize.fmin_bfgs(f, (0, 0), fprime=fprime)

  Optimization terminated successfully.

  Current function value: -3.867223

  Iterations: 10

  Function evaluations: 14

  Gradient evaluations: 14

  In [40]: x_opt

  Out[40]: array([ 1.88292605,  1.37658523])

  In [41]: x_opt = optimize.fmin_cg(f, (0, 0), fprime=fprime)

  Optimization terminated successfully.

  Current function value: -3.867223

  Iterations: 7

  Function evaluations: 17

  Gradient evaluations: 17

  In [42]: x_top

  Out[42]: array([ 1.88292613,  1.37658522])

  ```


  请注意，如前面优化求解器的诊断输出所示，这里的函数和梯度求值次数比牛顿法多。如前所述，这两种方法也可以在不提供梯度函数的情况下使用，如下面的使用 `optimize.fmin_bfgs`
  求解器的示例所示：


  ```python

  In [43]: x_opt = optimize.fmin_bfgs(f, (0, 0))

  Optimization terminated successfully.

  Current function value: -3.867223

  Iterations: 10

  Function evaluations: 56

  Gradient evaluations: 14

  In [44]: x_opt

  Out[44]: array([ 1.88292604,  1.37658522])

  ```


  在这种情况下，函数求值次数甚至更多，但显然，不必实现计算梯度和海森矩阵的函数是很方便的。




  一般来说，`BFGS`方法是首选的尝试方法，尤其是在既不知道梯度也不知道海森矩阵的情况下。如果只知道梯度，`BFGS`方法仍然是通常推荐的方法，尽管共轭梯度法通常是`BFGS`方法的有力替代方案。如果梯度和海森矩阵都已知，那么牛顿法通常是收敛最快的方法。然而，需要注意的是，虽然`BFGS`方法和共轭梯度法在理论上收敛速度慢于牛顿法，但它们有时能提供更好的稳定性，因此可能是更优的选择。与拟牛顿法和共轭梯度法相比，牛顿法的每次迭代计算量也可能更大，特别是对于大型问题，这些方法尽管需要更多迭代次数，但可能更快。


  到目前为止，我们讨论的多变量优化方法通常都收敛于局部最小值。对于具有许多局部最小值的问题，这很容易导致求解器陷入局部最小值，即使存在全局最小值也是如此。虽然没有针对此问题的完整通用解决方案，但一种可以部分缓解该问题的实用方法是在坐标网格上进行暴力搜索，以便为迭代求解器找到合适的起始点。这至少提供了一种系统的方法来在给定的坐标范围内找到全局最小值。在`SciPy`中，函数`optimize.brute`可以执行这样的系统搜索。为了说明这种方法，考虑最小化函数`4
  sin(x*π) + 6 sin(y*π) + (x - 1)² + (y - 1)²`的问题，该函数有大量的局部最小值。这可能会使得为迭代求解器选择合适的初始点变得棘手。为了用`SciPy`解决这个优化问题，我们首先为目标函数定义一个`Python`函数：


  ```python

  In [45]: def f(X):

  ...:      x, y = X

  ...:      return (4 * np.sin(np.pi * x) + 6 * np.sin(np.pi * y)) + (x - 1)**2 +
  (y - 1)**2

  ```


  为了在坐标网格上系统地搜索最小值，我们调用`optimize.brute`，将目标函数`f`作为第一个参数，将一个`slice`对象元组作为第二个参数（每个坐标一个）。`slice`对象指定了搜索最小值的坐标网格。这里我们还设置了关键字参数`finish=None`，这可以防止`optimize.brute`自动优化最佳候选点。


  ```python

  In [46]: x_start = optimize.brute(f, (slice(-3, 5, 0.5), slice(-3, 5, 0.5)), finish=None)

  In [47]: x_start

  Out[47]: array([ 1.5,  1.5])

  In [48]: f(x_start)

  Out[48]: −9.5

  ```


  在由给定`slice`对象元组指定的坐标网格上，最优点为`(x[1], x[2]) = (1.5, 1.5)`，对应的目标函数最小值为`-9.5`。现在，这是一个适用于更复杂的迭代求解器（如`optimize.fmin_bfgs`）的良好起点：


  ```python

  In [49]: x_opt = optimize.fmin_bfgs(f, x_start)

  Optimization terminated successfully.

  Current function value: -9.520229

  Iterations: 4

  Function evaluations: 28

  Gradient evaluations: 7

  In [50]: x_opt

  Out[50]: array([ 1.47586906,  1.48365788])

  In [51]: f(x_opt)

  Out[51]: −9.52022927306

  ```


  这里，`BFGS`方法给出了最终的最小值点`(x[1], x[2]) = (1.47586906, 1.48365788)`，目标函数的最小值为`-9.52022927306`。对于这种类型的问题，猜测初始起点很容易导致迭代求解器收敛到局部最小值，而`optimize.brute`提供的系统方法通常很有用。


  与往常一样，尽可能对目标函数和解进行可视化是很重要的。以下两个代码单元格绘制了当前目标函数的等高线图，并用红色星号标记了得到的解（见图 6-5）。与前面的例子一样，我们需要一个用于重新排列目标函数参数的包装函数，因为坐标向量传递给函数的方式不同（分别是单独的数组和打包成一个数组）。


  ![../images/332789_2_En_6_Chapter/332789_2_En_6_Fig5_HTML.png](img/332789_2_En_6_Fig5_HTML.png)


  **图 6-5**


  *目标函数`f(x) = 4 sin(x*π) + 6 sin(y*π) + (x - 1)² + (y - 1)²`的等高线图。最小值用红色星号标记。*


  ```python

  In [52]: def func_X_Y_to_XY(f, X, Y):

  ...:     """

  ...:     Wrapper for f(X, Y) -> f([X, Y])

  ...:     """

  ...:     s = np.shape(X)

  ...:     return f(np.vstack([X.ravel(), Y.ravel()])).reshape(*s)

  In [53]: fig, ax = plt.subplots(figsize=(6, 4))

  ...: x_ = y_ = np.linspace(-3, 5, 100)

  ...: X, Y = np.meshgrid(x_, y_)

  ...: c = ax.contour(X, Y, func_X_Y_to_XY(f, X, Y), 25)

  ...: ax.plot(x_opt[0], x_opt[1], ''r*'', markersize=15)

  ...: ax.set_xlabel(r"$x_1$", fontsize=18)

  ...: ax.set_ylabel(r"$x_2$", fontsize=18)

  ...: plt.colorbar(c, ax=ax)

  ```


  在本节中，我们显式地调用了特定求解器的函数，例如`optimize.fmin_bfgs`。但是，与标量优化一样，`SciPy`也通过函数`optimize.minimize`为所有多变量优化求解器提供了统一接口，该函数根据`method`关键字参数的值分发到特定于求解器的函数（请记住，提供统一接口的单变量最小化函数是`optimize.scalar_minimize`）。为了清晰起见，我们在这里倾向于显式调用特定求解器的函数，但通常建议使用`optimize.minimize`，因为这使得在不同求解器之间切换更加容易。例如，在前面的例子中，我们使用了`optimize.fmin_bfgs`，如下所示：


  ```python

  In [54]: x_opt = optimize.fmin_bfgs(f, x_start)

  ```


  我们同样可以使用：


  ```python

  In [55]: result = optimize.minimize(f, x_start, method= ''BFGS'')

  In [56]: x_opt = result.x

  ```


  函数`optimize.minimize`返回一个代表优化结果的`optimize.OptimizeResult`实例。特别是，解可以通过该类的`x`属性获得。




  ## 非线性最小二乘问题


  在第 5 章中，我们遇到了线性最小二乘问题，并探讨了如何用线性代数方法求解。通常，最小二乘问题可视为一个目标函数为 ![$$ g\left(\beta \right)={\sum}_{i=0}^m{r}_i{\left(\beta
  \right)}²={\left|\left|r\left(\beta \right)\right|\right|}² $$](img/332789_2_En_6_Chapter_TeX_IEq7.png)
  的优化问题，其中 `r(β)` 是一个向量，其分量为 `ri = y[i] - f(x[i], β)`，对应一组 `m` 个观测值 (`x[i]`, `y[i]`)。这里的
  `β` 是一个包含未知参数的向量，用于指定函数 `f(x, β)`。如果该问题关于参数 `β` 是非线性的，则称为非线性最小二乘问题。由于非线性，它无法使用第
  5 章讨论的线性代数技术求解。相反，我们可以使用上一节描述的多元优化技术，例如牛顿法或拟牛顿法。然而，这种非线性最小二乘优化问题具有特定的结构，因此已经开发了几种专门用于解决此特定优化问题的方法。其中一个例子是莱文贝格-马夸尔特方法，其思想是在每次迭代中对问题逐步线性化。


  在 SciPy 中，`optimize.leastsq` 函数提供了一个使用莱文贝格-马夸尔特方法的非线性最小二乘求解器。为了说明如何使用该函数，考虑一个形式为
  `f(x, β) = β[0] + β[1] exp(-β[2] x²)` 的非线性模型和一组观测值 (`x[i]`, `y[i]`)。在以下示例中，我们通过在真实值上添加随机噪声来模拟观测值，并求解最小化问题，以得到参数
  `β` 的最佳最小二乘估计。首先，我们定义一个包含参数向量 `β` 真实值的元组，以及一个模型函数的 Python 函数。该函数应返回给定 `x` 值对应的 `y`
  值，其第一个参数为变量 `x`，后续参数为未知函数参数：


  ```

  In [57]: beta = (0.25, 0.75, 0.5)

  In [58]: def f(x, b0, b1, b2):

  ...:    return b0 + b1 * np.exp(-b2 * x**2)

  ```


  定义好模型函数后，我们生成模拟观测值的随机数据点。


  ```

  In [59]: xdata = np.linspace(0, 5, 50)

  In [60]: y = f(xdata, *beta)

  In [61]: ydata = y + 0.05 * np.random.randn(len(xdata))

  ```


  准备好模型函数和观测数据后，我们开始求解非线性最小二乘问题。第一步是定义一个函数，用于计算给定数据和模型函数（由待确定的模型参数 `β` 指定）的残差。


  ```

  In [62]: def g(beta):

  ...:     return ydata - f(xdata, *beta)

  ```


  接下来，我们定义参数向量的初始猜测，并让 `optimize.leastsq` 函数求解参数向量的最佳最小二乘拟合：


  ```

  In [63]: beta_start = (1, 1, 1)

  In [64]: beta_opt, beta_cov = optimize.leastsq(g, beta_start)

  In [65]: beta_opt

  Out[65]: array([ 0.25733353,  0.76867338,  0.54478761])

  ```


  此处的最佳拟合非常接近先前定义的真实参数值 (0.25, 0.75, 0.5)。通过绘制观测数据以及使用真实参数值和拟合参数值得到的模型函数，我们可以直观地确认拟合模型似乎很好地描述了数据（参见图
  6-6）。


  ![../images/332789_2_En_6_Chapter/332789_2_En_6_Fig6_HTML.png](img/332789_2_En_6_Fig6_HTML.png)


  图 6-6


  *对函数 `f(x, β) = β[0] + β[1] exp(-β[2] x²)`（其中 `β = (0.25, 0.75, 0.5)`）的非线性最小二乘拟合*


  ```

  In [66]: fig, ax = plt.subplots()

  ...: ax.scatter(xdata, ydata, label="样本数据")

  ...: ax.plot(xdata, y, ''r'', lw=2, label=''真实模型'')

  ...: ax.plot(xdata, f(xdata, *beta_opt), ''b'', lw=2, label=''拟合模型'')

  ...: ax.set_xlim(0, 5)

  ...: ax.set_xlabel(r"$x$", fontsize=18)

  ...: ax.set_ylabel(r"$f(x, \beta)$", fontsize=18)

  ...: ax.legend()

  ```


  SciPy 的 `optimize` 模块还通过 `optimize.curve_fit` 函数提供了另一种非线性最小二乘拟合接口。这是对 `optimize.leastsq`
  的一个便捷封装，省去了为最小二乘问题显式定义残差函数的需要。因此，之前的问题可以使用以下代码更简洁地求解：


  ```

  In [67]: beta_opt, beta_cov = optimize.curve_fit(f, xdata, ydata)

  In [68]: beta_opt

  Out[68]: array([ 0.25733353,  0.76867338,  0.54478761])

  ```


  ## 约束优化


  约束条件为优化问题增加了另一层复杂性，需要对它们进行单独分类。一种简单的约束优化形式是坐标变量受限于某些边界的优化。例如： ![$$ {\min}_xf(x)
  $$](img/332789_2_En_6_Chapter_TeX_IEq8.png) 满足 `0 ≤ x ≤ 1`。约束 `0 ≤ x ≤ 1` 很简单，因为它只限制坐标的范围，而不依赖于其他变量。这类问题可以使用
  SciPy 中的 L-BFGS-B 方法求解，它是我们之前使用的 BFGS 方法的一个变种。该求解器可通过 `optimize.fmin_l_bgfs_b` 函数或
  `optimize.minimize` 函数（将 `method` 参数设置为 `''L-BFGS-B''`）调用。要定义坐标边界，必须使用 `bound` 关键字参数，其值应为一个元组列表，每个元组包含每个受约束变量的最小值和最大值。如果最小值或最大值设置为
  `None`，则视为无界。


  作为使用 L-BFGS-B 求解器求解有界优化问题的示例，考虑最小化目标函数 `f(x) = (x[1] - 1)² - (x[2] - 1)²`，并满足约束
  `2 ≤ x[1] ≤ 3` 和 `0 ≤ x[2] ≤ 2`。为了解决这个问题，我们首先为这两个变量分别定义一个 Python 目标函数和包含边界的元组，该边界根据给定的约束条件确定。为了进行比较，在以下代码中，我们还使用相同目标函数求解了无约束优化问题，并绘制了目标函数的等高线图，其中无约束最小值和约束最小值分别用蓝色和红色星号标记（参见图
  6-7）。


  ![../images/332789_2_En_6_Chapter/332789_2_En_6_Fig7_HTML.png](img/332789_2_En_6_Fig7_HTML.png)


  图 6-7


  目标函数 `f(x)` 的等高线，无约束最小值（蓝色星号）和约束最小值（红色星号）。约束问题的可行域以灰色阴影显示。


  ```

  In [69]: def f(X):

  ...:     x, y = X

  ...:     return (x - 1)**2 + (y - 1)**2

  In [70]: x_opt = optimize.minimize(f, [1, 1], method="BFGS").x

  In [71]: bnd_x1, bnd_x2 = (2, 3), (0, 2)

  In [72]: x_cons_opt = optimize.minimize(f, [1, 1], method=''L-BFGS-B'',

  ...:                                 bounds=[bnd_x1, bnd_x2]).x

  In [73]: fig, ax = plt.subplots(figsize=(6, 4))

  ...: x_ = y_ = np.linspace(-1, 3, 100)

  ...: X, Y = np.meshgrid(x_, y_)

  ...: c = ax.contour(X, Y, func_X_Y_to_XY(f, X, Y), 50)

  ...: ax.plot(x_opt[0], x_opt[1], ''b*'', markersize=15)

  ...: ax.plot(x_cons_opt[0], x_cons_opt[1], ''r*'', markersize=15)

  ...: bound_rect = plt.Rectangle((bnd_x1[0], bnd_x2[0]),

  ...:                            bnd_x1[1] - bnd_x1[0], bnd_x2[1] - bnd_x2[0], facecolor="grey")

  ...: ax.add_patch(bound_rect)

  ...: ax.set_xlabel(r"$x_1$", fontsize=18)

  ...: ax.set_ylabel(r"$x_2$", fontsize=18)

  ...: plt.colorbar(c, ax=ax)

  ```




  由等式或不等式定义的包含多个变量的约束处理起来相对复杂。不过，针对这类问题也存在通用的处理方法。例如，通过引入拉格朗日乘子，可以将带约束的优化问题转化为无约束问题。具体来说，考虑满足等式约束
  `g(x) = 0` 的优化问题 `min_x f(x)`。在无约束优化问题中，`f(x)` 的梯度在最优解处为零，即 `∇f(x) = 0`。可以证明，有约束问题的对应条件是负梯度位于约束法向支撑的空间内，即
  `-∇f(x) = λ J_g^T(x)`。此处 `J_g(x)` 是约束函数 `g(x)` 的雅可比矩阵，`λ` 是拉格朗日乘子向量（新变量）。该条件源于令函数
  `Λ(x, λ) = f(x) + λ^T g(x)` 的梯度为零，该函数被称为拉格朗日函数。因此，如果 `f(x)` 和 `g(x)` 都是连续且光滑的，那么函数
  `Λ(x, λ)` 的驻点 (`x0`, `λ0`) 对应的 `x0` 即是原约束优化问题的最优解。注意，如果 `g(x)` 是标量函数（即只有一个约束），那么雅可比矩阵
  `J_g(x)` 就退化为梯度 `∇g(x)`。


  为了说明这一方法，考虑一个长宽高分别为 `x1`、`x2` 和 `x3` 的长方体，在总表面积为单位面积的约束下 `g(x) = 2*x1*x2 + 2*x0*x2
  + 2*x1*x0 - 1 = 0`，求其体积最大化问题。使用拉格朗日乘子法求解此优化问题时，我们构造拉格朗日函数 `Λ(x) = f(x) + λ*g(x)`，并寻找满足
  `∇Λ(x) = 0` 的驻点。借助 SymPy，我们可以先定义问题中的变量符号，然后构建 `f(x)`、`g(x)` 和 `Λ(x)` 的表达式：


  ```

  In [74]: x = x0, x1, x2, l = sympy.symbols("x_0, x_1, x_2, lambda")

  In [75]: f = x0 * x1 * x2

  In [76]: g = 2 * (x0 * x1 + x1 * x2 + x2 * x0) - 1

  In [77]: L = f + l * g

  ```


  最后，使用 `sympy.diff` 计算 `∇Λ(x)`，并通过 `sympy.solve` 求解方程 `∇Λ(x) = 0`：


  `[{λ: -√6/24, x0: √6/6, x1: √6/6, x2: √6/6}, {λ: √6/24, x0: -√6/6, x1: -√6/6, x2:
  -√6/6}]`


  ```

  In [78]: grad_L = [sympy.diff(L, x_) for x_ in x]

  In [79]: sols = sympy.solve(grad_L)

  In [80]: sols

  Out[80]:

  ```


  该过程得到两个驻点。我们可以通过计算每种情况下的目标函数值来确定哪个对应最优解。然而，这里只有一个驻点对应物理上可接受的解：因为在本问题中 `x_i` 是长方体的边长，必须为正数。因此我们可以立即识别出有意义的解，它对应直观的结果
  `x0 = x1 = x2 = √6/6`（一个立方体）。最后，我们使用得到的解验证约束函数和目标函数：


  `√6/36`


  ```

  In [81]: g.subs(sols[0])

  Out[81]: 0

  In [82]: f.subs(sols[0])

  Out[82]:

  ```


  该方法也可扩展到处理不等式约束，并且存在多种应用此方法的数值解法。一个例子是称为序列最小二乘规划的方法，缩写为 SLSQP，在 SciPy 中可通过 `optimize.slsqp`
  函数和 `optimize.minimize` 并设置 `method=''SLSQP''` 来使用。`optimize.minimize` 函数接受关键字参数
  `constraints`，它应该是一个字典列表，每个字典指定一个约束。该字典中允许的键（值）包括 `type`（`''eq''` 或 `''ineq''`）、`fun`（约束函数）、`jac`（约束函数的雅可比矩阵）以及
  `args`（传递给约束函数及其雅可比计算函数的额外参数）。例如，描述上一个问题中约束的约束字典应为 `dict(type=''eq'', fun=g)`。


  要使用 SciPy 的 SLSQP 求解器数值求解完整问题，我们需要为目标函数和约束函数定义 Python 函数：


  ```

  In [83]: def f(X):

  ...:     return -X[0] * X[1] * X[2]

  In [84]: def g(X):

  ...:     return 2 * (X[0]*X[1] + X[1] * X[2] + X[2] * X[0]) - 1

  ```


  注意，由于 SciPy 的优化函数求解的是最小化问题，而我们这里关注的是最大化，因此函数 `f` 是原目标函数的负值。接下来，我们为 `g(x) = 0` 定义约束字典，最后调用
  `optimize.minimize` 函数：


  ```

  In [85]: constraint = dict(type=''eq'', fun=g)

  In [86]: result = optimize.minimize(f, [0.5, 1, 1.5], method="SLSQP", constraints=[constraint])

  In [87]: result

  Out[87]:  status: 0

  success: True

  njev: 18

  nfev: 95

  fun: -0.068041368623352985

  x: array([ 0.40824187,  0.40825127,  0.40825165])

  message: ''Optimization terminated successfully.''

  jac: array([-0.16666925, -0.16666542, -0.16666527,  0.])

  nit: 18

  In [88]: result.x

  Out[88]: array([ 0.40824187,  0.40825127,  0.40825165])

  ```


  正如预期，数值解与使用拉格朗日乘子法符号计算得到的解析解吻合良好。


  要求解带有不等式约束的问题，我们只需在约束字典中设置 `type=''ineq''` 并提供对应的不等式函数。为了演示带有非线性不等式约束的非线性目标函数的最小化，我们回到之前考虑的二次问题，但这次添加不等式约束
  `g(x) = x1 - 1.75 - (x0 - 0.75)⁴ ≥ 0`。像往常一样，我们首先定义目标函数和约束函数，以及约束字典：


  ```

  In [89]: def f(X):

  ...:     return (X[0] - 1)**2 + (X[1] - 1)**2

  In [90]: def g(X):

  ...:     return X[1] - 1.75 - (X[0] - 0.75)**4

  In [91]: constraints = [dict(type=''ineq'', fun=g)]

  ```


  接下来，我们准备通过调用 `optimize.minimize` 函数来求解优化问题。为了对比，这里我们也求解对应的无约束问题。


  ```

  In [92]: x_opt = optimize.minimize(f, (0, 0), method="BFGS").x

  In [93]: x_cons_opt = optimize.minimize(f, (0, 0), method="SLSQP", constraints=constraints).x

  ```


  为了验证所得解的合理性，我们绘制目标函数的等高线图，并用阴影区域表示可行域（即满足不等式约束的区域）。有约束和无约束的解分别用红色和蓝色星号标记（见图 6-8）。


