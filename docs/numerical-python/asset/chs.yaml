  从图 14-4 所示的回归图可以看出，在这个 Icecream 数据集中，消费量与温度似乎呈线性相关，但与价格没有明显的依赖关系（可能因为价格范围相当小）。像`plot_fit`这样的图形化工具在开发统计模型时可能非常有用。




  ## 离散回归


  处理离散因变量（例如二元结果）的回归需要不同于我们迄今为止所见的线性回归模型的技术。原因是线性回归要求响应变量是正态分布的*连续*变量，不能直接用于只有少数离散可能结果的响应变量，例如二元变量或取正整数值的变量。然而，通过使用适当的变换，可以将线性预测器映射到一个可以解释为不同离散结果概率的区间。例如，在二元结果的情况下，一种流行的变换是逻辑函数
  `log(p/(1 − p)) = β[0] + β ∙ x`，或 `p = (1 + exp(−β[0] − β[1] ∙ x))^(−1)`，它将 `x ∈
  [−∞, ∞]` 映射到 `p ∈ [0, 1]`。换句话说，连续的或离散的特征向量 `x` 通过模型参数 `β[0]` 和 `β[1]` 以及逻辑变换映射到概率
  p。如果 `p < 0.5`，则可据此预测 `y = 0`，如果 `p ≥ 0.5`，则可据此预测 `y = 1`。这个过程被称为逻辑回归，是二元分类器的一个例子。我们将在关于机器学习的第
  15 章中看到更多关于分类器的内容。


  `statsmodels` 库提供了几种离散回归的方法，包括 `Logit` 类⁶²、相关的 `Probit` 类（它使用正态分布的累积分布函数而非逻辑函数将线性预测器映射到
  [0, 1] 区间）、多项逻辑回归类 `MNLogit`（用于两个以上的类别）以及用于泊松分布计数变量（正整数）的泊松回归类 `Poisson`。


  ### 逻辑回归


  作为如何使用 `statsmodels` 执行逻辑回归的一个例子，我们首先使用 `sm.datasets.get_rdataset` 函数加载一个经典数据集，该数据集包含一组鸢尾花的样本的萼片和花瓣的长宽数据，以及这些花朵的物种分类。这里我们将选择数据集中对应两个不同物种的子集，并建立一个逻辑模型，根据花瓣长度和宽度的值来预测物种类型。`info`
  方法提供了数据集中所含变量的摘要：


  ```

  In [90]: df = sm.datasets.get_rdataset("iris").data

  In [91]: df.info()


  Int64Index: 150 entries, 0 to 149

  Data columns (total 5 columns):

  Sepal.Length    150 non-null float64

  Sepal.Width     150 non-null float64

  Petal.Length    150 non-null float64

  Petal.Width     150 non-null float64

  Species         150 non-null object

  dtypes: float64(4), object(1)

  memory usage: 7.0+ KB

  ```


  要查看 `Species` 列中存在多少种唯一的物种类型，我们可以对从数据框对象中提取该列时返回的 Pandas 序列使用 `unique` 方法：


  ```

  In [92]: df.Species.unique()

  Out[92]: array([''setosa'', ''versicolor'', ''virginica''], dtype=object)

  ```


  该数据集包含三种不同的物种类型。为了获得一个可以在逻辑回归中用作响应变量的二元变量，这里我们只关注两个物种*变色鸢尾*和*维吉尼亚鸢尾*的数据。为方便起见，我们创建一个新的数据框
  `df_subset`，用于对应这些物种的数据子集：


  ```

  In [93]: df_subset = df[df.Species.isin(["versicolor", "virginica"])].copy()

  ```


  为了能够使用逻辑回归，将其他变量作为自变量来预测物种，我们首先需要创建一个对应这两个不同物种的二元变量。使用 Pandas 序列对象的 `map` 方法，我们可以将两个物种名称映射为二元值
  0 和 1：


  ```

  In [94]: df_subset.Species = df_subset.Species.map({"versicolor": 1, "virginica":
  0})

  ```


  我们还需要将包含句点字符的列名重命名为在 Python 中有效的符号名称（例如，将“.”字符替换为“_”），否则包含这些列名的 Patsy 公式将被错误地解释。要重命名
  `DataFrame` 对象中的列，我们可以使用 `rename` 方法，并将包含名称翻译的字典作为 `columns` 参数传递：


  ```

  In [95]: df_subset.rename(columns={"Sepal.Length": "Sepal_Length",

  ...:                           "Sepal.Width": "Sepal_Width",

  ...:                           "Petal.Length": "Petal_Length",

  ...:                           "Petal.Width": "Petal_Width"}, inplace=True)

  ```


  经过这些变换后，我们就得到了一个适用于逻辑回归分析的 `DataFrame` 实例：


  |   | `Sepal_Length` | `Sepal_Width` | `Petal_Length` | `Petal_Width` | `Species`
  |

  | `50` | `7.0` | `3.2` | `4.7` | `1.4` | `1` |

  | `51` | `6.4` | `3.2` | `4.5` | `1.5` | `1` |

  | `52` | `6.9` | `3.1` | `4.7` | `1.5` | `1` |


  ```

  In [96]: df_subset.head(3)

  Out[96]:

  ```


  要创建一个试图以 `Petal_Length` 和 `Petal_Width` 为自变量来解释 `Species` 变量值的逻辑模型，我们可以创建一个 `smf.logit`
  类的实例，并使用 Patsy 公式 `"Species ~ Petal_Length + Petal_Width"`：


  ```

  In [97]: model = smf.logit("Species ~ Petal_Length + Petal_Width", data=df_subset)

  ```


  像往常一样，我们需要调用结果模型实例的 `fit` 方法来实际拟合所提供的数据。该拟合使用最大似然优化进行：


