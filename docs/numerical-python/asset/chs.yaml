  \n## 入门\n\n在我们深入探讨如何使用 Matplotlib 创建图形的细节之前，我们首先从一个快速示例开始，说明如何创建一个简单但典型的图表。我们还将介绍\
  \ Matplotlib 库的一些基本原理，以建立对如何使用该库生成图形的理解。\n\nMatplotlib 中的图形是按一个 `Figure` 实例和该图形内的一个或多个\
  \ `Axes` 实例来组织的。`Figure` 实例提供了一个用于绘图的画布区域，而 `Axes` 实例提供了坐标系，这些坐标系被分配给整个图形画布的固定区域；见图\
  \ 4-1。\n\n![../images/332789_2_En_4_Chapter/332789_2_En_4_Fig1_HTML.png](img/332789_2_En_4_Fig1_HTML.png)\n\
  \n图 4-1\n\nMatplotlib *Figure* 实例和 *Axes* 实例的排列示意图。*Axes* 实例为绘图提供了坐标系，而 *Axes* 实例本身被分配给图形画布内的一个区域。图形画布有一个简单的坐标系，其中\
  \ (0, 0) 是左下角，(1, 1) 是右上角。只有在将诸如 *Axes* 之类的元素直接放置在图形画布上时，才会使用此坐标系。\n\n一个 `Figure`\
  \ 可以包含多个 `Axes` 实例，例如，在图形中显示多个面板，或在另一个 `Axes` 实例中显示插图。可以将 `Axes` 实例手动分配给图形画布的任意区域，或者，也可以使用\
  \ Matplotlib 提供的几种布局管理器之一，将 `Axes` 实例自动添加到图形画布。`Axes` 实例提供了一个坐标系，可用于以多种绘图样式绘制数据，包括折线图、散点图、条形图和许多其他样式。此外，`Axes`\
  \ 实例还决定了坐标轴的显示方式，例如，关于轴标签、刻度线和刻度标签等等。实际上，在使用 Matplotlib 的面向对象 API 时，大多数调整图形外观所需的函数都是\
  \ `Axes` 类的方法。\n\n作为一个简单的 Matplotlib 入门示例，假设我们想绘制函数 *y*(*x*) = *x*³ + 5*x*² + 10\
  \ 及其一阶和二阶导数在区间 *x* ∈ [−5, 2] 上的图形。为此，我们首先为 *x* 范围创建 NumPy 数组，然后计算我们要绘制的三个函数。当图形的数据准备好后，我们需要创建\
  \ Matplotlib 的 `Figure` 和 `Axes` 实例，然后使用 `Axes` 实例的 `plot` 方法绘制数据，并使用 `set_xlabel`\
  \ 和 `set_ylabel` 方法设置基本的图形属性，如 x 轴和 y 轴标签，以及使用 `legend` 方法生成图例。这些步骤在以下代码中执行，生成的图形如图\
  \ 4-2 所示。\n\n![../images/332789_2_En_4_Chapter/332789_2_En_4_Fig2_HTML.png](img/332789_2_En_4_Fig2_HTML.png)\n\
  \n图 4-2\n\n使用 Matplotlib 创建的简单图形示例\n\n```\nIn [7]: x = np.linspace(-5, 2, 100)\n\
  ...: y1 = x**3 + 5*x**2 + 10\n...: y2 = 3*x**2 + 10*x\n...: y3 = 6*x + 10\n...:\n\
  ...: fig, ax = plt.subplots()\n...: ax.plot(x, y1, color=\"blue\", label=\"y(x)\"\
  )\n...: ax.plot(x, y2, color=\"red\", label=\"y'(x)\")\n...: ax.plot(x, y3, color=\"\
  green\", label=\"y”(x)\")\n...: ax.set_xlabel(\"x\")\n...: ax.set_ylabel(\"y\")\n\
  ...: ax.legend()\n```\n\n这里，我们使用了 `plt.subplots` 函数来生成 `Figure` 和 `Axes` 实例。此函数可用于在新创建的\
  \ `Figure` 实例中创建 `Axes` 实例网格，但在此处，它仅用作一种便捷方式，只需一次函数调用即可创建 `Figure` 和 `Axes` 实例。一旦\
  \ `Axes` 实例可用，请注意所有剩余步骤都涉及调用此 `Axes` 实例的方法。要创建实际的图形，我们使用 `ax.plot`，它接受 NumPy 数组作为第一和第二个参数，这些数组包含图形的\
  \ *x* 和 *y* 值的数值数据，并绘制一条连接这些数据点的线。我们还使用了可选的 `color` 和 `label` 关键字参数来指定每条线的颜色，并为每条线分配一个用于图例的文本标签。这几行代码足以生成我们打算制作的图形，但作为最低要求，我们还应该在\
  \ *x* 和 *y* 轴上设置标签，并在合适的情况下为我们绘制的曲线添加图例。轴标签通过 `ax.set_xlabel` 和 `ax.set_ylabel`\
  \ 方法设置，这些方法接受一个包含相应标签的文本字符串作为参数。图例使用 `ax.legend` 方法添加，在这种情况下它不需要任何参数，因为我们在绘制曲线时已经使用了\
  \ `label` 关键字参数。\n\n这些是使用 Matplotlib 创建图形所需的典型步骤。尽管该图形（图 4-2）是完整且功能齐全的，但其外观的许多方面肯定还有改进的空间。例如，为了达到出版标准，我们可能需要更改轴标签、刻度标签和图例的字体和字体大小，并且我们可能应该将图例移动到图形中不干扰我们正在绘制的曲线的位置。我们甚至可能还想更改轴刻度和标签的数量，添加注释和额外的辅助线来强调图形的某些方面等等。经过这样一些修改后，该图形可能会如图\
  \ 4-3 所示，这看起来要好得多。在本章的剩余部分，我们将探讨如何完全控制使用 Matplotlib 生成的图形外观。\n\n![../images/332789_2_En_4_Chapter/332789_2_En_4_Fig3_HTML.png](img/332789_2_En_4_Fig3_HTML.png)\n\
  \n图 4-3\n\n图 4-2 的修订版\n\n\n\n### 交互式与非交互式模式\n\nMatplotlib 库旨在与多种不同环境和平台良好协作。因此，该库不仅包含生成图表的程序，还包含在不同图形环境中显示图表的支持。为此，Matplotlib\
  \ 提供了*后端*来生成不同格式的图形（例如，PNG、PDF、PostScript 和 SVG），并使用适用于不同平台的各种小部件工具包（例如，Qt、GTK、wxWidgets\
  \ 和 Mac OS X 的 Cocoa）在图形用户界面中显示图形。\n\n可以在 Matplotlib 资源文件^(²⁸)中，或在导入 `matplotlib`\
  \ 之后、导入 `matplotlib.pyplot` 模块之前立即调用的 `mpl.use` 函数中，选择使用哪个后端。例如，要选择 Qt4Agg 后端，我们可以使用\n\
  \n![../images/332789_2_En_4_Chapter/332789_2_En_4_Fig4_HTML.png](img/332789_2_En_4_Fig4_HTML.png)\n\
  \n**图 4-4**。Mac OS X 上使用 Qt4 后端显示图形的 Matplotlib 图形用户界面截图。详细外观因平台和后端而异，但基本功能相同。\n\
  \n```\nimport matplotlib as mpl\nmpl.use('qt4agg')\nimport matplotlib.pyplot as\
  \ plt\n```\n\n如图 4-4 所示，用于显示 Matplotlib 图形的图形用户界面，对于与 Python 脚本文件或 IPython 控制台进行交互式使用非常有用，它允许交互式探索图形，例如通过缩放和平移。当使用在图形用户界面中显示图形的交互式后端时，需要调用\
  \ `plt.show` 函数才能使窗口出现在屏幕上。默认情况下，`plt.show` 调用会挂起，直到窗口关闭。为了获得更交互的体验，我们可以通过调用 `plt.ion`\
  \ 函数来激活*交互式模式*。这会指示 Matplotlib 接管 GUI 事件循环，并在图形创建后立即显示窗口，将控制流返回给 Python 或 IPython\
  \ 解释器。要使对图形的更改生效，我们需要使用 `plt.draw` 函数发出重绘命令。我们可以使用 `plt.ioff` 函数停用交互式模式，并使用 `mpl.is_interactive`\
  \ 函数检查 Matplotlib 当前处于交互式还是非交互式模式。\n\n虽然交互式图形用户界面具有独特的优势，但在使用 Jupyter Notebook 或\
  \ Qtconsole 时，将 Matplotlib 生成的图形直接嵌入到 notebook 中通常更加方便。此行为通过 IPython 命令 `%matplotlib\
  \ inline` 激活，该命令会启用 IPython 提供的“内联后端”。这会将 Matplotlib 配置为使用非交互式后端生成图形图像，然后这些图像会作为静态图像显示在例如\
  \ Jupyter Notebook 中。可以使用 IPython 的 `%config` 命令对 Matplotlib 的 IPython“内联后端”进行微调。例如，我们可以使用\
  \ `InlineBackend.figure_format` 选项^(²⁹)选择生成图形的输出格式，例如，我们可以将其设置为 `'svg'` 以生成 SVG\
  \ 图形而非 PNG 文件：\n\n```\nIn [8]: %matplotlib inline\nIn [9]: %config InlineBackend.figure_format='svg'\n\
  ```\n\n采用这种方法，图形用户界面的交互性（例如缩放和平移）会丢失，但将图形直接嵌入 notebook 具有许多其他优点。例如，将用于生成图形的代码与生成的图形保存在同一文档中，消除了重新运行代码以显示图形的需要，而\
  \ Jupyter Notebook 本身的交互性也替代了 Matplotlib 图形用户界面的部分交互功能。\n\n使用 IPython 内联后端时，无需使用\
  \ `plt.show` 和 `plt.draw`，因为 IPython 的富文本显示系统负责触发图形的渲染和显示。在本书中，我假设代码示例在 Jupyter\
  \ Notebooks 中执行，因此代码示例中不包含对 `plt.show` 函数的调用。当使用交互式后端时，则需要在每个示例的末尾添加此函数调用。\n\n##\
  \ 图形对象 Figure\n\n如前一节所述，`Figure` 对象在 Matplotlib 中用于表示一个图形。`Figure` 对象除了提供画布（例如，可以在其上放置\
  \ `Axes` 实例）之外，还提供了对图形执行操作的方法，并具有多个可用于配置图形属性的属性。\n\n可以使用 `plt.figure` 函数创建 `Figure`\
  \ 对象，该函数接受多个可选的键参数来设置图形属性。具体来说，它接受 `figsize` 键参数，该参数应被赋值为一个 `(width, height)` 形式的元组，以英寸为单位指定图形画布的宽度和高度。通过设置\
  \ `facecolor` 键参数来指定图形画布的颜色也很有用。\n\n一旦创建了 `Figure`，我们就可以使用 `add_axes` 方法创建新的 `Axes`\
  \ 实例，并将其分配给图形画布上的一个区域。`add_axes` 接受一个必需参数：一个列表，其中包含 `Axes` 在图形画布坐标系中的左下角坐标、宽度和高度，格式为\
  \ `(left, bottom, width, height)`。^(³⁰) `Axes` 对象的坐标、宽度和高度表示为总画布宽度和高度的分数；见图 4-1。例如，完全填充画布的\
  \ `Axes` 对象对应于 `(0, 0, 1, 1)`，但这会为轴标签和刻度线留下空间。更实用的尺寸可能是 `(0.1, 0.1, 0.8, 0.8)`，这对应于一个居中的\
  \ `Axes` 实例，覆盖画布宽度和高度的 80%。`add_axes` 方法接受大量键参数来设置新 `Axes` 实例的属性。这些将在本章后面深入讨论 `Axes`\
  \ 对象时进行更详细的描述。然而，这里值得强调的一个键参数是 `facecolor`，我们可以用它来为 `Axes` 对象分配背景颜色。与 `plt.figure`\
  \ 的 `facecolor` 参数相结合，这允许同时选择画布和 `Axes` 实例所覆盖区域的颜色。\n\n\n\n通过`plt.figure`和`fig.add_axes`获得`Figure`和`Axes`对象后，我们便具备了利用`Axes`对象方法绘制数据的基本条件。更详细的内容请参见本章下一节。然而，一旦创建了所需的图表，`Figure`对象中还有许多在图表创建流程中至关重要的方法。例如，要设置整个图形的标题，可以使用`suptitle`方法，该方法接受一个包含标题的字符串作为参数。要将图形保存到文件，可以使用`savefig`方法。该方法将输出文件名作为第一个参数（字符串类型），同时还支持多个可选关键字参数。默认情况下，输出文件格式由文件名的扩展名决定，但我们也可以使用`format`参数显式指定格式。可用的输出格式取决于所使用的\
  \ Matplotlib 后端，但常见的选项包括 PNG、PDF、EPS 和 SVG 格式。生成图像的分辨率可以通过`dpi`参数设置。DPI 代表“每英寸点数”（dots\
  \ per inch），由于图形尺寸是通过`figsize`参数以英寸为单位指定的，因此将这些数值相乘即可得到输出图像的像素尺寸。例如，当`figsize=(8，\
  \ 6)`且`dpi=100`时，生成的图像尺寸为 800x600 像素。`savefig`方法还接受一些与`plt.figure`函数类似的参数，例如`facecolor`参数。请注意，尽管`facecolor`参数与`plt.figure`一同使用，但为了使其应用于生成的图像文件，也需要在`savefig`中指定该参数。最后，还可以使用`savefig`的`transparent=True`参数使图形画布透明。以下代码清单展示了这些技术，结果如图\
  \ 4-5 所示。\n\n![../images/332789_2_En_4_Chapter/332789_2_En_4_Fig5_HTML.png](img/332789_2_En_4_Fig5_HTML.png)\n\
  \n**图 4-5**\n\n本图展示了以下操作的结果：使用`figsize`设置图形尺寸、使用`add_axes`添加新的`Axes`实例、使用`facecolor`设置`Figure`和`Axes`对象的背景颜色，最后使用`savefig`将图形保存到文件。\n\
  \n```\nIn [10]: fig = plt.figure(figsize=(8, 2.5), facecolor=\"#f1f1f1\")\n...:\n\
  ...: # 坐标作为画布宽度和高度的比例\n...: left, bottom, width, height = 0.1, 0.1, 0.8, 0.8\n...:\
  \ ax = fig.add_axes((left, bottom, width, height), facecolor=\"#e1e1e1\")\n...:\n\
  ...: x = np.linspace(-2, 2, 1000)\n...: y1 = np.cos(40 * x)\n...: y2 = np.exp(-x**2)\n\
  ...:\n...: ax.plot(x, y1 * y2)\n...: ax.plot(x, y2, 'g')\n...: ax.plot(x, -y2, 'g')\n\
  ...: ax.set_xlabel(\"x\")\n...: ax.set_ylabel(\"y\")\n...:\n...: fig.savefig(\"\
  graph.png\", dpi=100, facecolor=\"#f1f1f1\")\n```\n\n## Axes\n\n上一节介绍的`Figure`对象构成了\
  \ Matplotlib 图形的基础框架，但所有有趣的内容都在`Axes`实例内部或周围组织。在本章前面部分，我们已经多次遇到`Axes`对象。`Axes`对象是使用\
  \ Matplotlib 库进行大多数绘图活动的核心。它提供了绘制数据和数学函数的坐标系，此外还包含确定轴标签和轴刻度放置位置的坐标轴对象。用于绘制不同类型图形的函数也是`Axes`类的方法。在本节中，我们首先探讨可以使用`Axes`方法绘制的不同类型图形，以及如何自定义*x*轴和*y*轴的外观以及`Axes`对象使用的坐标系。\n\
  \n我们已经看到如何显式地使用`add_axes`方法将新的`Axes`实例添加到图形中。这是一种灵活且强大的方法，可以将`Axes`对象放置在任意位置，这有几个重要的应用，我们将在本章后面看到。然而，对于大多数常见用例，在图形画布内显式指定`Axes`实例的坐标显得繁琐。特别是当在图形中使用多个`Axes`实例面板（例如网格布局）时。Matplotlib\
  \ 提供了几种不同的`Axes`布局管理器，它们按照不同的策略在图形画布内创建和放置`Axes`实例。在本章后面，我们将更详细地研究如何使用此类布局管理器。但是，为了方便接下来的示例，我们在此简要介绍其中一个布局管理器：`plt.subplots`函数。在本章前面，我们已经使用过这个函数，以便在一次函数调用中方便地生成新的`Figure`和`Axes`对象。然而，`plt.subplots`函数还能够用`Axes`实例网格填充图形，这可以通过其第一个和第二个参数指定，或者使用`nrows`和`ncols`参数（顾名思义，这两个参数用于创建一个具有指定行数和列数的`Axes`对象网格）。例如，要在新创建的`Figure`对象中生成一个三行两列的`Axes`实例网格，我们可以使用：\n\
  \n```\nfig, axes = plt.subplots(nrows=3, ncols=2)\n```\n\n这里，函数`plt.subplots`返回一个元组`(fig,\
  \ axes)`，其中`fig`是一个`Figure`实例，`axes`是一个大小为`(nrows, ncols)`的 NumPy 数组，数组中的每个元素都是一个已恰当放置在相应图形画布中的`Axes`实例。此时，我们还可以使用`sharex`和`sharey`参数指定列和/或行是否共享\
  \ x 轴和 y 轴，这些参数可以设置为`True`或`False`。\n\n`plt.subplots`函数还接受两个特殊的关键字参数`fig_kw`和`subplot_kw`，它们分别是用于创建`Figure`和`Axes`实例时的关键字参数字典。这使我们能够在使用`plt.subplots`时，以类似于直接使用`plt.figure`和`make_axes`方法的方式，设置并完全控制`Figure`和`Axes`对象的属性。\n\
  \n### 图形类型\n\n有效的数据科学和技术可视化需要多种绘图技术。Matplotlib 将许多类型的绘图技术实现为`Axes`对象的方法。例如，在前面的示例中，我们已经使用了`plot`方法，它在`Axes`对象提供的坐标系中绘制曲线。在接下来的几节中，我们将通过在一些示例图形中使用这些函数，更深入地探索\
  \ Matplotlib 的部分绘图函数。常用二维绘图函数的总结如图 4-6 所示。其他类型的图形，如颜色图和三维图形，将在本章后面讨论。Matplotlib\
  \ 中的所有绘图函数都期望输入 NumPy 数组作为数据，通常将包含*x*和*y*坐标的数组作为第一个和第二个参数。有关详细信息，请参见图 4-6 中每个方法的文档字符串，例如，使用`help(plt.Axes.bar)`。\n\
  \n![../images/332789_2_En_4_Chapter/332789_2_En_4_Fig6_HTML.png](img/332789_2_En_4_Fig6_HTML.png)\n\
  \n**图 4-6**\n\n选定二维图形类型概览。图中显示了用于生成每种图形的`Axes`方法名称及对应的图形。\n\n\n\n### 线条属性\n\n最基本的一种图形是简单线图。例如，它可用于描绘单变量函数的图像，或将数据绘制为控制变量的函数。在线图中，我们经常需要配置图形中线条的属性，例如线宽、线条颜色和线条样式（实线、虚线、点线等）。在\
  \ Matplotlib 中，我们通过向绘图方法（如 `plot`、`step` 和 `bar`）提供关键字参数来设置这些属性。其中一些图形类型显示在图 4-6\
  \ 中。许多绘图方法都有自己特定的参数，但诸如颜色和线宽等基本属性在大多数绘图方法中是共享的。这些基本属性及其对应的关键字参数总结在表 4-1 中。\n\n**表\
  \ 4-1** Matplotlib 绘图方法使用的基本线条属性及其对应的参数名称\n\n| 参数 | 示例值 | 描述 |\n| --- | --- | ---\
  \ |\n| `color` | 颜色规范可以是一个包含颜色名称的字符串，例如“red”、“blue”等，或者是一个形如“#aabbcc”的 RGB 颜色代码。\
  \ | 颜色规范。 |\n| `alpha` | 介于 0.0（完全透明）和 1.0（完全不透明）之间的浮点数。 | 透明度。 |\n| `linewidth`,\
  \ `lw` | 浮点数。 | 线条的宽度。 |\n| `linestyle`, `ls` | “-” – 实线, “--” – 虚线, “:” – 点线, “.-”\
  \ – 点划线 | 线条的样式，即线条是绘制成实线，还是例如点线或虚线。 |\n| `marker` | `+`, `o`, `*` = 叉号, 圆圈, 星号;\
  \ `s` = 方块; `.` = 小点; `1`, `2`, `3`, `4`, ... = 不同角度的三角形符号。 | 每个数据点，无论其是否与相邻数据点相连，都可以用此参数指定的标记符号来表示。\
  \ |\n| `markersize` | 浮点数。 | 标记的大小。 |\n| `markerfacecolor` | 颜色规范（见上文）。 | 标记的填充颜色。\
  \ |\n| `markeredgewidth` | 浮点数。 | 标记边缘的线宽。 |\n| `markeredgecolor` | 颜色规范（见上文）。 |\
  \ 标记边缘的颜色。 |\n\n为了说明这些属性和参数的使用，请考虑以下代码，该代码使用不同的线宽、线条样式、标记符号、颜色和大小绘制了水平线。生成的图形显示在图\
  \ 4-7 中。\n\n![../images/332789_2_En_4_Chapter/332789_2_En_4_Fig7_HTML.png](img/332789_2_En_4_Fig7_HTML.png)\n\
  \n**图 4-7** 展示设置线条属性线宽、线条样式、标记类型和标记大小以及颜色结果的图形\n\n```\nIn [11]: x = np.linspace(-5,\
  \ 5, 5)\n...: y = np.ones_like(x)\n...:\n...: def axes_settings(fig, ax, title,\
  \ ymax):\n...:    ax.set_xticks([])\n...:    ax.set_yticks([])\n...:    ax.set_ylim(0,\
  \ ymax+1)\n...:    ax.set_title(title)\n...:\n...: fig, axes = plt.subplots(1, 4,\
  \ figsize=(16,3))\n...:\n...: # Line width\n...: linewidths = [0.5, 1.0, 2.0, 4.0]\n\
  ...: for n, linewidth in enumerate(linewidths):\n...:    axes[0].plot(x, y + n,\
  \ color=\"blue\", linewidth=linewidth)\n...: axes_settings(fig, axes[0], \"linewidth\"\
  , len(linewidths))\n...:\n...: # Line style\n...: linestyles = ['-', '-.', ':']\n\
  ...: for n, linestyle in enumerate(linestyles):\n...:    axes[1].plot(x, y + n,\
  \ color=\"blue\", lw=2, linestyle=linestyle)\n...: # custom dash style\n...: line,\
  \ = axes[1].plot(x, y + 3, color=\"blue\", lw=2)\n...: length1, gap1, length2, gap2\
  \ = 10, 7, 20, 7\n...: line.set_dashes([length1, gap1, length2, gap2])\n...: axes_settings(fig,\
  \ axes[1], \"linetypes\", len(linestyles) + 1)\n...: # marker types\n...: markers\
  \ = ['+', 'o', '*', 's', '.', '1', '2', '3', '4']\n...: for n, marker in enumerate(markers):\n\
  ...:    # lw = shorthand for linewidth, ls = shorthand for linestyle\n...:    axes[2].plot(x,\
  \ y + n, color=\"blue\", lw=2, ls='*', marker=marker)\n...: axes_settings(fig, axes[2],\
  \ \"markers\", len(markers))\n...:\n...: # marker size and color\n...: markersizecolors\
  \ = [(4, \"white\"), (8, \"red\"), (12, \"yellow\"), (16, \"lightgreen\")]\n...:\
  \ for n, (markersize, markerfacecolor) in enumerate(markersizecolors):\n...:   \
  \ axes[3].plot(x, y + n, color=\"blue\", lw=1, ls='-',\n...:                 marker='o',\
  \ markersize=markersize,\n...:                 markerfacecolor=markerfacecolor,\
  \ markeredgewidth=2)\n...: axes_settings(fig, axes[3], \"marker size/color\", len(markersizecolors))\n\
  ```\n\n实际应用中，使用不同的颜色、线宽和线条样式是使图形易于阅读的重要工具。在包含大量线条的图形中，我们可以结合使用颜色和线条样式，使每条线都能被唯一识别，例如，通过图例。线宽属性最适合用于强调重要的线条。考虑以下示例，其中函数\
  \ `sin(x)` 与其在 `x = 0` 附近的几个低阶级数展开一起绘制，如图 4-8 所示。\n\n![../images/332789_2_En_4_Chapter/332789_2_En_4_Fig8_HTML.png](img/332789_2_En_4_Fig8_HTML.png)\n\
  \n**图 4-8** `sin(x)` 及其几个最低阶泰勒级数逼近的图形\n\n```\nIn [12]: # a symbolic variable for\
  \ x, and a numerical array with specific values of x\n...: sym_x = sympy.Symbol(\"\
  x\")\n...: x = np.linspace(-2 * np.pi, 2 * np.pi, 100)\n...:\n...: def sin_expansion(x,\
  \ n):\n...:     \"\"\"\n...:     Evaluate the nth order Taylor. series expansion\n\
  ...:     of sin(x) for the numerical values in the array x.\n...:     \"\"\"\n...:\
  \     return sympy.lambdify(sym_x, sympy.sin(sym_x).series(n=n+1).removeO(), 'numpy')(x)\n\
  ...:\n...: fig, ax = plt.subplots()\n...:\n...: ax.plot(x, np.sin(x), linewidth=4,\
  \ color=\"red\", label=\"exact\")\n...:\n...: colors = [\"blue\", \"black\"]\n...:\
  \ linestyles = [':', '-.', '--']\n...: for idx, n in enumerate(range(1, 12, 2)):\n\
  ...:     ax.plot(x, sin_expansion(x, n), color=colors[idx // 3],\n...:         \
  \    linestyle=linestyles[idx % 3], linewidth=3,\n...:             label=\"order\
  \ %d approx.\" % (n+1))\n...:\n...:  ax.set_ylim(-1.1, 1.1)\n...: ax.set_xlim(-1.5*np.pi,\
  \ 1.5*np.pi)\n...:\n...: # place a legend outsize of the Axes\n...: ax.legend(bbox_to_anchor=(1.02,\
  \ 1), loc=2, borderaxespad=0.0)\n...: # make room for the legend to the right of\
  \ the Axes\n...: fig.subplots_adjust(right=.75)\n```\n\n\n\n### 图例\n\n包含多条线的图通常得益于图例的辅助，图例会在图形中的某个位置为每种线型显示一个标签。正如我们在前面的示例中看到的，可以使用\
  \ `legend` 方法为 Matplotlib 图形中的 `Axes` 实例添加图例。只有带有指定标签的线条才会包含在图例中（要为线条指定标签，请使用，例如，`Axes.plot`\
  \ 的 `label` 参数）。`legend` 方法接受大量可选参数。详情请参阅 `help(plt.legend)`。这里我们重点介绍几个更有用的参数。在前一节的示例中，我们使用了\
  \ `loc` 参数，它允许指定图例添加到 `Axes` 区域中的位置：`loc=1` 表示右上角，`loc=2` 表示左上角，`loc=3` 表示左下角，而\
  \ `loc=4` 表示右下角，如图 4-9 所示。\n\n![../images/332789_2_En_4_Chapter/332789_2_En_4_Fig9_HTML.png](img/332789_2_En_4_Fig9_HTML.png)\n\
  \n图 4-9\n图例在 `Axes` 实例内的不同位置，通过 `legend` 方法的 `loc` 参数指定。\n\n在前一节的示例中，我们还使用了 `bbox_to_anchor`，借助它可以将图例放置在图形画布中的任意位置。`bbox_to_anchor`\
  \ 参数接受一个形式为 `(x, y)` 的元组值，其中 `x` 和 `y` 是 `Axes` 对象内的*画布坐标*。也就是说，点 `(0, 0)` 对应于左下角，点\
  \ `(1, 1)` 对应于右上角。注意，在这种情况下，`x` 和 `y` 可以小于 0 或大于 1，这表示图例将被放置在 `Axes` 区域之外，正如前一节中所使用的那样。\n\
  \n默认情况下，图例中的所有线条都会垂直排列显示。使用 `ncols` 参数，可以将图例标签分割成多列，如图 4-10 所示。\n\n![../images/332789_2_En_4_Chapter/332789_2_En_4_Fig10_HTML.png](img/332789_2_En_4_Fig10_HTML.png)\n\
  \n图 4-10\n图例显示在 `Axes` 对象外部，并以四列而非单列显示，这里使用了 `ax.legend(ncol=4, loc=3, bbox_to_anchor=(0,\
  \ 1))`。\n\n### 文本格式与注释\n\n文本标签、标题和注释是大多数图形中的重要组成部分，而对用于渲染此类文本的字体类型和字体大小等拥有完全控制，是生成出版级质量图形的基本要求。Matplotlib\
  \ 提供了几种配置字体属性的方法。默认值可以在 Matplotlib 资源文件中设置，而会话范围的配置可以在 `mpl.rcParams` 字典中设置。该字典是\
  \ Matplotlib 资源文件的缓存，对此字典内参数的更改在 Python 解释器重新启动并再次导入 Matplotlib 之前一直有效。与文本显示方式相关的参数包括，例如，`'font.family'`\
  \ 和 `'font.size'`。\n\n### 提示\n\n尝试 `print(mpl.rcParams)` 以获取可能的配置参数列表及其当前值。更新参数就像为字典\
  \ `mpl.rcParams` 中的对应项赋新值一样简单，例如，`mpl.rcParams['savefig.dpi'] = 100.`。另请参阅可用于更新\
  \ `mpl.rcParams` 字典的 `mpl.rc` 函数，以及用于恢复默认值的 `mpl.rcdefaults`。\n\n也可以通过向图形中创建文本标签的函数传递一组标准关键字参数，来逐个设置文本属性。大多数以某种方式处理文本标签的\
  \ Matplotlib 函数都接受表 4-2 中总结的关键字参数（此列表是常用参数的不完整选择；完整参考请参阅 `help(mpl.text.Text)`）。例如，这些参数可以与\
  \ `Axes.text` 方法一起使用，该方法会在给定坐标处创建一个新的文本标签。它们也可以与 `set_title`、`set_xlabel`、`set_ylabel`\
  \ 等方法一起使用。有关这些方法的更多信息，请参阅下一节。\n\n在科学和技术可视化中，能够在文本标签中渲染数学符号和表达式显然非常重要。Matplotlib\
  \ 通过其文本标签中的 LaTeX 标记提供了对此的出色支持：Matplotlib 中的任何文本标签都可以通过将 LaTeX 数学表达式括在 `$` 符号中来包含它，例如\
  \ `\"Regular text: $f(x)=1-x²$\"`。默认情况下，Matplotlib 使用内部 LaTeX 渲染引擎，该引擎支持 LaTeX 语言的一个子集。然而，通过设置配置参数\
  \ `mpl.rcParams[\"text.usetex\"]=True`，也可以使用外部功能完备的 LaTeX 引擎（如果您的系统上可用的话）。\n\n在\
  \ Python 字符串中嵌入 LaTeX 代码时，有一个常见的陷阱：Python 使用 `\\` 作为转义字符，而在 LaTeX 中它用于表示命令的开始。为了防止\
  \ Python 解释器对包含 LaTeX 表达式的字符串中的字符进行转义，使用原始字符串会很方便，原始字符串是前面带有 `r` 的文字字符串表达式，例如，`r\"\
  $\\int f(x) dx$\"` 和 `r'$x_{\\rm A}$'`。\n\n以下示例演示了如何使用 `ax.text` 和 `ax.annotate`\
  \ 向 Matplotlib 图形添加文本标签和注释，以及如何渲染包含用 LaTeX 排版的方程的文本标签。生成的图形如图 4-11 所示。\n\n表 4-2\n\
  选定字体属性及对应关键字参数总结\n\n| 参数 | 描述 |\n| --- | --- |\n| `fontsize` | 字体大小，以磅为单位。 |\n|\
  \ `family 或 fontname` | 字体类型。 |\n| `backgroundcolor` | 文本标签背景颜色的颜色规范。 |\n| `color`\
  \ | 字体颜色的颜色规范。 |\n| `alpha` | 字体颜色的透明度。 |\n| `rotation` | 文本标签的旋转角度。 |\n\n![../images/332789_2_En_4_Chapter/332789_2_En_4_Fig11_HTML.png](img/332789_2_En_4_Fig11_HTML.png)\n\
  \n图 4-11\n示例展示了使用 `ax.text` 和 `ax.annotation` 添加文本标签和注释，以及在 Matplotlib 文本标签中包含 LaTeX\
  \ 格式化方程的效果。\n\n```\nIn [13]: fig, ax = plt.subplots(figsize=(12, 3))\n...:\n...:\
  \ ax.set_yticks([])\n...: ax.set_xticks([])\n...: ax.set_xlim(-0.5, 3.5)\n...: ax.set_ylim(-0.05,\
  \ 0.25)\n...: ax.axhline(0)\n...:\n...: # 文本标签\n...: ax.text(0, 0.1, \"文本标签\", fontsize=14,\
  \ family=\"serif\")\n...:\n...: # 注释\n...: ax.plot(1, 0, \"o\")\n...: ax.annotate(\"\
  注释\",\n...:             fontsize=14, family=\"serif\",\n...:             xy=(1,\
  \ 0), xycoords=\"data\",\n...:           xytext=(+20, +50), textcoords=\"offset\
  \ points\",\n...:           arrowprops=dict(arrowstyle=\"->\", connectionstyle=\"\
  arc3, rad=.5\"))\n...:\n...: # 方程\n...: ax.text(2, 0.1, r\"方程: $i\\hbar\\partial_t\
  \ \\Psi = \\hat{H}\\Psi$\", fontsize=14, family=\"serif\")\n...:\n```\n\n### 坐标轴属性\n\
  \n在创建了 `Figure` 和 `Axes` 对象之后，使用 Matplotlib 提供的众多绘图函数之一绘制数据或函数，并自定义线条和标记的外观——图形中最后一个需要配置和微调的主要方面是\
  \ `Axis` 实例。二维图形有两个坐标轴对象：用于水平 *x* 轴和垂直 *y* 轴。每个坐标轴都可以独立配置其属性，例如坐标轴标签、刻度线和刻度标签的放置位置，以及坐标轴本身的位置和外观。在本节中，我们将详细探讨如何控制图形的这些方面。\n\
  \n\n\n### 坐标轴标签和标题\n\n可以说，坐标轴最重要的属性是其标签，在几乎所有情况下都需要进行设置。我们可以使用 `set_xlabel` 和 `set_ylabel`\
  \ 方法来设置坐标轴标签：这两个方法都将包含标签的字符串作为第一个参数。此外，可选的 `labelpad` 参数用于指定坐标轴到标签之间的间距，单位是点（points）。这种内边距有时是必要的，可以避免坐标轴标签与坐标轴刻度标签重叠。`set_xlabel`\
  \ 和 `set_ylabel` 方法还接受其他用于设置文本属性的参数，例如 `color`、`fontsize` 和 `fontname`，这些在前一节中已有详细讨论。以下代码生成了图\
  \ 4-12，演示了如何使用 `set_xlabel` 和 `set_ylabel` 方法以及这里讨论的关键字参数。\n\n![../images/332789_2_En_4_Chapter/332789_2_En_4_Fig12_HTML.png](img/332789_2_En_4_Fig12_HTML.png)\n\
  \n图 4-12：展示使用 `set_xlabel` 和 `set_ylabel` 设置 x 轴和 y 轴标签的结果的图表。\n\n```\nIn [14]:\
  \ x = np.linspace(0, 50, 500)\n...: y = np.sin(x) * np.exp(-x/10)\n...:\n...: fig,\
  \ ax = plt.subplots(figsize=(8, 2), subplot_kw={'facecolor': \"#ebf5ff\"})\n...:\n\
  ...: ax.plot(x, y, lw=2)\n...:\n...: ax.set_xlabel(\"x\", labelpad=5, fontsize=18,\
  \ fontname=\"serif\", color=\"blue\")\n...: ax.set_ylabel(\"f(x)\", labelpad=15,\
  \ fontsize=18, fontname=\"serif\", color=\"blue\")\n...: ax.set_title(\"axis labels\
  \ and title example\", fontsize=16,\n...:              fontname='serif', color=\"\
  blue\")\n```\n\n除了在 x 轴和 y 轴上设置标签，我们还可以使用 `set_title` 方法为 `Axes` 对象设置标题。此方法接受的参数与\
  \ `set_xlabel` 和 `set_ylabel` 基本相同，但多了 `loc` 参数，它可以被设置为 `'left'`、`'centered'` 或\
  \ `'right'`，用于指定标题是左对齐、居中对齐还是右对齐。\n\n### 坐标轴范围\n\n默认情况下，Matplotlib 的 *x* 轴和 *y*\
  \ 轴的范围会根据 `Axes` 对象中绘制的数据自动调整。在许多情况下，这些默认范围已经足够，但在某些情况下，可能需要显式设置坐标轴范围。在这种情况下，我们可以使用\
  \ `Axes` 对象的 `set_xlim` 和 `set_ylim` 方法。这两个方法都接受两个参数，分别指定要在坐标轴上显示的下限和上限。`set_xlim`\
  \ 和 `set_ylim` 的替代方法是 `axis` 方法，例如，它接受字符串参数 `'tight'`，用于生成紧密贴合所包含线条的坐标范围；还接受 `'equal'`，用于生成每个坐标轴上的一个单位长度对应相同像素数的坐标范围（即保持比例不变的坐标系）。\n\
  \n还可以使用 `autoscale` 方法通过传递 `True` 和 `False` 作为第一个参数来选择性地开启和关闭自动缩放，并通过将其 `axis` 参数设置为\
  \ `'x'`、`'y'` 或 `'both'` 来针对 *x* 轴和/或 *y* 轴进行控制。下面的例子展示了如何使用这些方法来控制坐标轴范围。生成的图表如图\
  \ 4-13 所示。\n\n![../images/332789_2_En_4_Chapter/332789_2_En_4_Fig13_HTML.png](img/332789_2_En_4_Fig13_HTML.png)\n\
  \n图 4-13：展示使用 `set_xlim`、`set_ylim` 和 `axis` 方法设置图表中显示的坐标轴范围的结果的图表。\n\n```\nIn [15]:\
  \ x = np.linspace(0, 30, 500)\n...: y = np.sin(x) * np.exp(-x/10)\n...:\n...:\n\
  ...: fig, axes = plt.subplots(1, 3, figsize=(9, 3), subplot_kw={'facecolor': \"\
  #ebf5ff\"})\n...:\n...: axes[0].plot(x, y, lw=2)\n...: axes[0].set_xlim(-5, 35)\n\
  ...: axes[0].set_ylim(-1, 1)\n...: axes[0].set_title(\"set_xlim / set_y_lim\")\n\
  ...:\n...: axes[1].plot(x, y, lw=2)\n...: axes[1].axis('tight')\n...: axes[1].set_title(\"\
  axis('tight')\")\n...:\n...: axes[2].plot(x, y, lw=2)\n...: axes[2].axis('equal')\n\
  ...: axes[2].set_title(\"axis('equal')\")\n```\n\n### 坐标轴刻度、刻度标签和网格\n\n需要配置的最后几个基本坐标轴属性是坐标轴刻度的位置，以及相应刻度标签的位置和格式。坐标轴刻度是图表整体外观的重要组成部分，在准备用于出版和生产质量的图表时，通常需要对坐标轴刻度进行精细控制。Matplotlib\
  \ 的 `mpl.ticker` 模块提供了一个通用且可扩展的刻度管理系统，能完全控制刻度位置。Matplotlib 区分主刻度和次刻度。默认情况下，每个主刻度都有一个对应的标签，主刻度之间的距离可以用没有标签的次刻度进一步标记，尽管此功能必须显式开启。有关主刻度和次刻度的图示，请参见图\
  \ 4-14。\n\n![../images/332789_2_En_4_Chapter/332789_2_En_4_Fig14_HTML.png](img/332789_2_En_4_Fig14_HTML.png)\n\
  \n图 4-14：主刻度和次刻度之间的区别。\n\n在处理刻度配置时，最常见的设计目标是确定带有标签的主刻度应沿坐标轴放置在何处。`mpl.ticker` 模块为不同的刻度放置策略提供了类。例如，`mpl.ticker.MaxNLocator`\
  \ 可用于设置最大刻度数量（位置未指定），`mpl.ticker.MultipleLocator` 可用于在给定基数的整数倍位置设置刻度，`mpl.ticker.FixedLocator`\
  \ 可用于在显式指定的坐标位置放置刻度。要更改刻度策略，我们可以使用 `Axes.xaxis` 和 `Axes.yaxis` 中的 `set_major_locator`\
  \ 和 `set_minor_locator` 方法。这些方法接受一个在 `mpl.ticker` 中定义的刻度类实例，或从这些类派生的自定义类实例。\n\n\
  当显式指定刻度位置时，我们还可以使用 `set_xticks` 和 `set_yticks` 方法，它们接受一个用于放置主刻度的坐标列表。在这种情况下，还可以使用\
  \ `set_xticklabels` 和 `set_yticklabels` 为每个刻度设置自定义标签，这些方法期望使用字符串列表作为相应刻度的标签。如果可能，最好使用通用的刻度放置策略，例如\
  \ `mpl.ticker.MaxNLocator`，因为它们会在坐标范围改变时动态调整；而使用 `set_xticks` 和 `set_yticks` 进行显式刻度放置则需要手动修改代码。但是，当必须精确控制刻度位置时，`set_xticks`\
  \ 和 `set_yticks` 是很方便的方法。\n\n以下代码演示了如何使用前面段落讨论的方法的组合来更改默认刻度放置，生成的图表如图 4-15 所示。\n\
  \n![../images/332789_2_En_4_Chapter/332789_2_En_4_Fig15_HTML.png](img/332789_2_En_4_Fig15_HTML.png)\n\
  \n图 4-15：演示沿 *x* 轴和 *y* 轴控制和放置主刻度与次刻度及其外观的不同方式的图表。\n\n\n\n```python\nIn [16]: x\
  \ = np.linspace(-2 * np.pi, 2 * np.pi, 500)\n...: y = np.sin(x) * np.exp(-x**2/20)\n\
  ...:\n...: fig, axes = plt.subplots(1, 4, figsize=(12, 3))\n...:\n...: axes[0].plot(x,\
  \ y, lw=2)\n...: axes[0].set_title(\"default ticks\")\n...: axes[1].plot(x, y, lw=2)\n\
  ...: axes[1].set_title(\"set_xticks\")\n...: axes[1].set_yticks([-1, 0, 1])\n...:\
  \ axes[1].set_xticks([-5, 0, 5])\n...:\n...: axes[2].plot(x, y, lw=2)\n...: axes[2].set_title(\"\
  set_major_locator\")\n...: axes[2].xaxis.set_major_locator(mpl.ticker.MaxNLocator(4))\n\
  ...: axes[2].yaxis.set_major_locator(mpl.ticker.FixedLocator([-1, 0, 1]))\n...:\
  \ axes[2].xaxis.set_minor_locator(mpl.ticker.MaxNLocator(8))\n...: axes[2].yaxis.set_minor_locator(mpl.ticker.MaxNLocator(8))\n\
  ...:\n...: axes[3].plot(x, y, lw=2)\n...: axes[3].set_title(\"set_xticklabels\"\
  )\n...: axes[3].set_yticks([-1, 0, 1])\n...: axes[3].set_xticks([-2 * np.pi, -np.pi,\
  \ 0, np.pi, 2 * np.pi])\n...: axes[3].set_xticklabels([r'$-2\\pi$', r'$-\\pi$',\
  \ 0, r'$\\pi$', r'$2\\pi$'])\n...: x_minor_ticker = mpl.ticker.FixedLocator([-3\
  \ * np.pi / 2, -np.pi / 2, 0,\n...:                                           np.pi\
  \ / 2, 3 * np.pi / 2])\n...: axes[3].xaxis.set_minor_locator(x_minor_ticker)\n...:\
  \ axes[3].yaxis.set_minor_locator(mpl.ticker.MaxNLocator(4))\n```\n\n图中一个常用的设计元素是网格线，它作为从图表中读取数值时的视觉参考。网格和网格线与坐标轴刻度密切相关，因为它们绘制在相同的坐标值上，因此本质上是跨越整个图形的刻度延伸。在\
  \ Matplotlib 中，我们可以使用坐标轴对象的`grid`方法打开坐标轴网格。`grid`方法接受可选的关键字参数，用于控制网格的外观。例如，与 Matplotlib\
  \ 中的许多绘图函数一样，`grid`方法接受参数`color`、`linestyle`和`linewidth`，用于指定网格线的属性。此外，它还接受参数`which`和`axis`，可以分别赋值为`'major'`、`'minor'`或`'both'`，以及`'x'`、`'y'`或`'both'`。这些参数用于指示要将给定的样式应用于哪个坐标轴的哪些刻度。如果网格线需要多种不同的样式，可以对`grid`进行多次调用，每次使用不同的`which`和`axis`值。关于如何添加网格线以及如何以不同方式设置其样式的示例，请参见以下示例，该示例生成了图\
  \ 4-16 所示的图形。\n\n![../images/332789_2_En_4_Chapter/332789_2_En_4_Fig16_HTML.png](img/332789_2_En_4_Fig16_HTML.png)\n\
  \n图 4-16\n\n演示使用网格线效果的图形\n\n```python\nIn [17]: fig, axes = plt.subplots(1, 3, figsize=(12,\
  \ 4))\n...: x_major_ticker = mpl.ticker.MultipleLocator(4)\n...: x_minor_ticker\
  \ = mpl.ticker.MultipleLocator(1)\n...: y_major_ticker = mpl.ticker.MultipleLocator(0.5)\n\
  ...: y_minor_ticker = mpl.ticker.MultipleLocator(0.25)\n...:\n...: for ax in axes:\n\
  ...:     ax.plot(x, y, lw=2)\n...:     ax.xaxis.set_major_locator(x_major_ticker)\n\
  ...:     ax.yaxis.set_major_locator(y_major_ticker)\n...:     ax.xaxis.set_minor_locator(x_minor_ticker)\n\
  ...:     ax.yaxis.set_minor_locator(y_minor_ticker)\n...:\n...: axes[0].set_title(\"\
  默认网格\")\n...: axes[0].grid()\n...:\n...: axes[1].set_title(\"主/副网格\")\n...: axes[1].grid(color=\"\
  blue\", which=\"both\", linestyle=':', linewidth=0.5)\n...:\n...: axes[2].set_title(\"\
  单独的 x/y 主/副网格\")\n...: axes[2].grid(color=\"grey\", which=\"major\", axis=\"x\"\
  , linestyle='-', linewidth=0.5)\n...: axes[2].grid(color=\"grey\", which=\"minor\"\
  , axis=\"x\", linestyle=':', linewidth=0.25)\n...: axes[2].grid(color=\"grey\",\
  \ which=\"major\", axis=\"y\", linestyle='-', linewidth=0.5)\n```\n\n除了控制刻度位置，Matplotlib\
  \ 的`mpl.ticker`模块还提供了用于自定义刻度标签的类。例如，`mpl.ticker`模块中的`ScalarFormatter`可用于设置几个与使用科学记数法显示刻度标签相关的有用属性，用于显示大数值的坐标轴标签。如果使用`set_scientific`方法激活了科学记数法，我们可以使用`set_powerlimits`方法控制何时使用科学记数法的阈值（默认情况下，小数的刻度标签不使用科学记数法显示），并且在创建`ScalarFormatter`实例时，我们可以使用`useMathText=True`参数，以便以数学样式而不是代码样式（例如`1e10`）显示指数。以下代码是刻度标签中使用科学记数法的示例。生成的图形如图\
  \ 4-17 所示。\n\n![../images/332789_2_En_4_Chapter/332789_2_En_4_Fig17_HTML.png](img/332789_2_En_4_Fig17_HTML.png)\n\
  \n图 4-17\n\n带有科学记数法刻度标签的图形。左侧面板使用默认标签格式，而右侧面板使用以数学文本形式渲染的科学记数法刻度标签。\n\n```python\n\
  In [19]: fig, axes = plt.subplots(1, 2, figsize=(8, 3))\n...:\n...: x = np.linspace(0,\
  \ 1e5, 100)\n...: y = x ** 2\n...:\n...: axes[0].plot(x, y, 'b.')\n...: axes[0].set_title(\"\
  默认标签\", loc=\"right\")\n...:\n...: axes[1].plot(x, y, 'b')\n...: axes[1].set_title(\"\
  科学记数法标签\", loc=\"right\")\n...:\n...: formatter = mpl.ticker.ScalarFormatter(useMathText=True)\n\
  ...: formatter.set_scientific(True)\n...: formatter.set_powerlimits((-1,1))\n...:\
  \ axes[1].xaxis.set_major_formatter(formatter)\n...: axes[1].yaxis.set_major_formatter(formatter)\n\
  ```\n\n### 对数绘图\n\n在可视化跨越多个数量级的数据时，使用对数坐标系非常有用。在 Matplotlib 中，有几个用于在此类坐标系中绘制函数的绘图函数，例如`loglog`、`semilogx`和`semilogy`，它们分别用于*x*和*y*轴都使用对数刻度、仅*x*轴使用对数刻度和仅*y*轴使用对数刻度。除了对数轴刻度外，这些函数的行为与标准的`plot`方法类似。另一种方法是使用标准的`plot`方法，然后分别使用`set_xscale`和/或`set_yscale`方法，并以`'log'`作为第一个参数，将轴刻度配置为对数刻度。以下部分示例了这些生成对数刻度图的方法，生成的图形如图\
  \ 4-18 所示。\n\n![../images/332789_2_En_4_Chapter/332789_2_En_4_Fig18_HTML.png](img/332789_2_En_4_Fig18_HTML.png)\n\
  \n图 4-18\n\n对数刻度图的示例\n\n```python\nIn [20]: fig, axes = plt.subplots(1, 3, figsize=(12,\
  \ 3))\n...:\n...: x = np.linspace(0, 1e3, 100)\n...: y1, y2 = x**3, x**4\n...:\n\
  ...: axes[0].set_title('loglog')\n...: axes[0].loglog(x, y1, 'b', x, y2, 'r')\n\
  ...:\n...: axes[1].set_title('semilogy')\n...: axes[1].semilogy(x, y1, 'b', x, y2,\
  \ 'r')\n...:\n...: axes[2].set_title('plot / set_xscale / set_yscale')\n...: axes[2].plot(x,\
  \ y1, 'b', x, y2, 'r')\n...: axes[2].set_xscale('log')\n...: axes[2].set_yscale('log')\n\
  ```\n\n\n\n#### 双轴\n\nMatplotlib 提供的一个有趣的坐标轴技巧是双轴功能，它允许将两个独立的坐标轴叠加在彼此之上。当在同一张图中绘制两个不同的量时（例如，具有不同单位），这非常有用。一个展示此功能的简单示例如下，生成的图形如图\
  \ 4-19 所示。这里我们使用 `twinx` 方法（还有一个 `twiny` 方法）来创建第二个`Axes`实例，它共享 *x* 轴，并带有一个新的独立 *y*\
  \ 轴，该轴显示在图表的右侧。\n\n![../images/332789_2_En_4_Chapter/332789_2_En_4_Fig19_HTML.png](img/332789_2_En_4_Fig19_HTML.png)\n\
  \n图 4-19\n\n具有双轴的图表示例\n\n```\nIn [21]: fig, ax1 = plt.subplots(figsize=(8, 4))\n\
  ...:\n...: r = np.linspace(0, 5, 100)\n...: a = 4 * np.pi * r ** 2  # area\n...:\
  \ v = (4 * np.pi / 3) * r ** 3  # volume\n...:\n...: ax1.set_title(\"surface area\
  \ and volume of a sphere\", fontsize=16)\n...: ax1.set_xlabel(\"radius [m]\", fontsize=16)\n\
  ...:\n...: ax1.plot(r, a, lw=2, color=\"blue\")\n...: ax1.set_ylabel(r\"surface\
  \ area ($m²$)\", fontsize=16, color=\"blue\")\n...: for label in ax1.get_yticklabels():\n\
  ...:     label.set_color(\"blue\")\n...:\n...: ax2 = ax1.twinx()\n...: ax2.plot(r,\
  \ v, lw=2, color=\"red\")\n...: ax2.set_ylabel(r\"volume ($m³$)\", fontsize=16,\
  \ color=\"red\")\n...: for label in ax2.get_yticklabels():\n...:    label.set_color(\"\
  red\")\n```\n\n#### 脊柱（Spines）\n\n在迄今为止生成的所有图表中，我们总是有一个包围着`Axes`区域的方框。这确实是科技图表的一种常见样式，但在某些情况下，例如，绘制示意图时，可能需要移动这些坐标线。在\
  \ Matplotlib 中，构成包围框的线被称为坐标轴脊柱，我们可以使用 `Axes.spines` 属性来更改它们的属性。例如，我们可能想要移除顶部和右侧的脊柱，并将脊柱移动到与坐标系原点重合的位置。\n\
  \n`Axes` 对象的 `spines` 属性是一个字典，其键为 `right`、`left`、`top` 和 `bottom`，可用于单独访问每条脊柱。我们可以使用\
  \ `set_color` 方法将颜色设置为 `'None'` 以表明不应显示特定脊柱，在这种情况下，我们还需要使用 `Axes.xaxis` 和 `Axes.yaxis`\
  \ 的 `set_ticks_position` 方法（分别接受参数 `'both'`、`'top'` 或 `'bottom'` 以及 `'both'`、`'left'`\
  \ 或 `'right'`）移除与该脊柱关联的刻度。使用这些方法，我们可以将包围框转换为 *x* 和 *y* 坐标轴，如下例所示。生成的图形如图 4-20 所示。\n\
  \n![../images/332789_2_En_4_Chapter/332789_2_En_4_Fig20_HTML.png](img/332789_2_En_4_Fig20_HTML.png)\n\
  \n图 4-20\n\n具有坐标轴脊柱的图表示例\n\n```\nIn [22]: x = np.linspace(-10, 10, 500)\n...: y\
  \ = np.sin(x) / x\n...:\n...: fig, ax = plt.subplots(figsize=(8, 4))\n...:\n...:\
  \ ax.plot(x, y, linewidth=2)\n...:\n...: # remove top and right spines\n...: ax.spines['right'].set_color('none')\n\
  ...: ax.spines['top'].set_color('none')\n...:\n...: # remove top and right spine\
  \ ticks\n...: ax.xaxis.set_ticks_position('bottom')\n...: ax.yaxis.set_ticks_position('left')\n\
  ...:\n...: # move bottom and left spine to x = 0 and y = 0\n...: ax.spines['bottom'].set_position(('data',\
  \ 0))\n...: ax.spines['left'].set_position(('data', 0))\n...:\n...: ax.set_xticks([-10,\
  \ -5, 5, 10])\n...: ax.set_yticks([0.5, 1])\n...:\n...: # give each label a solid\
  \ background of white, to not overlap with the plot line\n...: for label in ax.get_xticklabels()\
  \ + ax.get_yticklabels():\n...:    label.set_bbox({'facecolor': 'white',\n...: \
  \                   'edgecolor': 'white'})\n```\n\n## 高级坐标轴布局\n\n到目前为止，我们反复使用 `plt.figure`、`Figure.make_axes`\
  \ 和 `plt.subplots` 来创建新的 `Figure` 和 `Axes` 实例，然后使用它们生成图表。在科学和技术可视化中，通常将多个图形打包到不同的面板中，例如，采用网格布局。Matplotlib\
  \ 中提供了函数，可以使用多种不同的布局策略自动创建 `Axes` 对象并将它们放置在图形画布上。我们已经使用了 `plt.subplots` 函数，它能够生成\
  \ `Axes` 对象的均匀网格。在本节中，我们将探讨 `plt.subplots` 函数的其他特性，并介绍 `subplot2grid` 和 `GridSpec`\
  \ 布局管理器，它们在 `Axes` 对象于图形画布内的分布方式上更加灵活。\n\n### 嵌入图（Insets）\n\n在深入探讨如何使用更高级的 `Axes`\
  \ 布局管理器之前，有必要退一步思考一下我们最初用以向图形画布添加 `Axes` 实例的一种重要用法：`Figure.add_axes` 方法。这种方法非常适合创建所谓的嵌入图，即显示在另一个图表区域内的较小图表。例如，嵌入图经常用于在主图中显示某个特别关注区域的放大视图，或者显示一些次要的相关图表。\n\
  \n在 Matplotlib 中，我们可以将额外的 `Axes` 对象放置在图形画布内的任意位置，即使它们与现有的 `Axes` 对象重叠也没关系。因此，要创建一个嵌入图，我们只需使用\
  \ `Figure.make_axes` 添加一个新的 `Axes` 对象，并指定该嵌入图应该放置的位置（图形画布坐标）。一个带有嵌入图的典型图表示例如下代码所示，此代码生成的图形如图\
  \ 4-21 所示。在创建嵌入图的 `Axes` 对象时，使用参数 `facecolor='none'` 可能会很有用，这表示不应有背景颜色，即嵌入图的 `Axes`\
  \ 背景应该是透明的。\n\n![../images/332789_2_En_4_Chapter/332789_2_En_4_Fig21_HTML.png](img/332789_2_En_4_Fig21_HTML.png)\n\
  \n图 4-21\n\n带有嵌入图的图表示例\n\n```\nIn [23]: fig = plt.figure(figsize=(8, 4))\n...:\n\
  ...: def f(x):\n...:     return 1/(1 + x**2) + 0.1/(1 + ((3 - x)/0.1)**2)\n...:\n\
  ...: def plot_and_format_axes(ax, x, f, fontsize):\n...:     ax.plot(x, f(x), linewidth=2)\n\
  ...:     ax.xaxis.set_major_locator(mpl.ticker.MaxNLocator(5))\n...:     ax.yaxis.set_major_locator(mpl.ticker.MaxNLocator(4))\n\
  ...:     ax.set_xlabel(r\"$x$\", fontsize=fontsize)\n...:     ax.set_ylabel(r\"\
  $f(x)$\", fontsize=fontsize)\n...:\n...: # main graph\n...: ax = fig.add_axes([0.1,\
  \ 0.15, 0.8, 0.8], facecolor=\"#f5f5f5\")\n...: x = np.linspace(-4, 14, 1000)\n\
  ...: plot_and_format_axes(ax, x, f, 18)\n...:\n...: # inset\n...: x0, x1 = 2.5,\
  \ 3.5\n...: ax.axvline(x0, ymax=0.3, color=\"grey\", linestyle=\":\")\n...: ax.axvline(x1,\
  \ ymax=0.3, color=\"grey\", linestyle=\":\")\n...:\n...: ax_insert = fig.add_axes([0.5,\
  \ 0.5, 0.38, 0.42], facecolor=\"none\")\n...: x = np.linspace(x0, x1, 1000)\n...:\
  \ plot_and_format_axes(ax_insert, x, f, 14)\n```\n\n\n\n### Subplots\n\n我们已经广泛使用了`plt.subplots`，并且注意到它返回一个元组，其中包含一个`Figure`实例和一个\
  \ NumPy 数组，该数组包含函数调用中请求的每一行和每一列的`Axes`对象。在绘制子图网格时，通常子图之间共享*x*轴或*y*轴，或两者都共享。在这种情况下，使用`plt.subplots`的`sharex`和`sharey`参数非常有用，因为它可以防止相同的轴标签在多个`Axes`上重复出现。\n\
  \n同样值得注意的是，`plt.subplots`返回的包含`Axes`实例的 NumPy 数组的维度默认是“压缩”的：即，长度为 1 的维度会从数组中移除。如果请求的列数和行数都大于\
  \ 1，则返回一个二维数组；但如果列数或行数（或两者）为 1，则返回一个一维数组（或标量，即唯一的`Axes`对象本身）。我们可以通过向`plt.subplots`函数传递参数`squeeze=False`来关闭\
  \ NumPy 数组维度的压缩。在这种情况下，`fig, axes = plt.subplots(nrows, ncols)`中的`axes`变量始终是一个二维数组。\n\
  \n最后，可以使用`plt.subplots_adjust`函数来实现可配置性，该函数允许显式设置整个`Axes`网格的左侧、右侧、底部和顶部坐标，以及网格中`Axes`实例之间的宽度（`wspace`）和高度间距（`hspace`）。请参阅以下代码以及对应的图\
  \ 4-22，了解如何逐步设置具有共享*x*轴和*y*轴以及调整了`Axes`间距的`Axes`网格。\n\n![../images/332789_2_En_4_Chapter/332789_2_En_4_Fig22_HTML.png](img/332789_2_En_4_Fig22_HTML.png)\n\
  \n图 4-22  \n使用`plt.subplot`和`plt.subplot_adjust`的示例图\n\n```\nIn [24]: fig, axes\
  \ = plt.subplots(2, 2, figsize=(6, 6), sharex=True, sharey=True, squeeze=False)\n\
  ...:\n...: x1 = np.random.randn(100)\n...: x2 = np.random.randn(100)\n...:\n...:\
  \ axes[0, 0].set_title(\"Uncorrelated\")\n...: axes[0, 0].scatter(x1, x2)\n...:\n\
  ...: axes[0, 1].set_title(\"Weakly positively correlated\")\n...: axes[0, 1].scatter(x1,\
  \ x1 + x2)\n...:\n...: axes[1, 0].set_title(\"Weakly negatively correlated\")\n\
  ...: axes[1, 0].scatter(x1, -x1 + x2)\n...:\n...: axes[1, 1].set_title(\"Strongly\
  \ correlated\")\n...: axes[1, 1].scatter(x1, x1 + 0.15 * x2)\n...:\n...: axes[1,\
  \ 1].set_xlabel(\"x\")\n...: axes[1, 0].set_xlabel(\"x\")\n...: axes[0, 0].set_ylabel(\"\
  y\")\n...: axes[1, 0].set_ylabel(\"y\")\n...:\n...: plt.subplots_adjust(left=0.1,\
  \ right=0.95, bottom=0.1, top=0.95, wspace=0.1, hspace=0.2)\n```\n\n### Subplot2grid\n\
  \n`plt.subplot2grid`函数是`plt.subplots`和`GridSpec`（参见下一节）之间的中间工具，它提供了比`plt.subplots`更灵活的`Axes`布局管理，同时比`GridSpec`更易于使用。特别是，`plt.subplot2grid`能够创建包含跨越多个行和/或列的`Axes`实例的网格。`plt.subplot2grid`接受两个必需参数：第一个参数是`Axes`网格的形状，形式为元组`(nrows,\
  \ ncols)`；第二个参数是一个元组`(row, col)`，指定网格内的起始位置。两个可选的关键字参数`colspan`和`rowspan`可用于指示新的`Axes`实例应跨越多少行和列。表\
  \ 4-3 给出了一个如何使用`plt.subplot2grid`函数的示例。请注意，每次调用`plt.subplot2grid`函数都会产生一个新的`Axes`实例，这与`plt.subplots`不同，后者一次函数调用创建所有`Axes`实例并以\
  \ NumPy 数组形式返回它们。\n\n表 4-3  \n使用`plt.subplot2grid`创建的网格布局示例及对应代码\n\n| Axes 网格布局\
