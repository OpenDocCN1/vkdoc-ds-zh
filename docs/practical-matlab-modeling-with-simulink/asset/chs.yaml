  \ (c) 中的模型进行仿真。要使改进欧拉法的解与其他两种方法的解收敛，合适的步长是多少？\n\n### 练习 4\n\n执行以下操作：\n\n1.  在三自由度质量-弹簧-阻尼器系统（见第\
