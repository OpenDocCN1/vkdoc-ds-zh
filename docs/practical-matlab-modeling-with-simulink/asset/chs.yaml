- "# Lotka-Voltera 问题\n\nLotka-Voltera 模型最初由阿尔弗雷德·洛特卡于 1910 年提出 [7]。该模型的微分方程组是科尔莫戈罗夫模型\
  \ [8] 的一个具体实例。Lotka-Voltera 问题方程组，也称为*捕食者-猎物方程*，描述了自然界中观察到的捕食者与猎物之间的关系，并由以下一阶常微分方程组构成：\n\
  \n![$$ \\left\\{\\begin{array}{c}\\frac{dx\\ }{dt}=\\alpha x-\\beta x y\\\\ {}\\\
  frac{dy}{dt}=\\delta x y-\\gamma y\\end{array}\\right. $$](img/490522_1_En_12_Chapter_TeX_Equ2.png)\n\
  \n(12-2)\n\n其中，`x` 变量可视为猎物的密度或数量（例如，兔子）；`y` 变量表示捕食者的密度或数量（例如，狼）；`α` 是猎物种群的内禀增长率；`β`\
  \ 是捕食者捕食率系数；`δ` 是捕食者每捕食一个猎物的繁殖率；`γ` 是捕食者的死亡率。\n\nLotka-Voltera 模型中的非线性微分方程常被用来描述自然界中两个物种为生存而相互作用的生物系统动态\
  \ [8, 9]。这两个物种中，一个是捕食者，另一个是猎物。\n\nLotka-Voltera 模型对猎物和捕食者的环境及演化做出了一些假设，列举如下：\n\n\
  *   猎物在任何时候都有充足的食物。\n*   捕食者的食物供应取决于猎物的种群规模。\n*   种群的增长率和减少率与种群规模成正比。\n*   在整个过程中，环境不会改变以偏袒任何一个物种，模型中的任何一个物种也不会适应环境。Lotka-Voltera\
  \ 方程的解是确定且连续的，这意味着猎物的数量与捕食者的数量会持续相互重叠。\n\n为了模拟 Lotka-Voltera 模型，我们将使用以下数值和初始条件（猎物与捕食者的数量）：`α\
  \ = 1`，`β = 0.05`，`δ = 0.02`，`γ = 0.5` 且 `x(0) = 10`，`y(0) = 10`。以下是模型代码：\n\n```\n\
  % Lotka_Voltera.m\n% LOTKA-VOLTERA ~ Predator-Prey ~ two body simulation %%%%%\n\
  % dx/dt = alfa*x-beta*x*y;\n% dy/dt = delta*x*y-gamma*y;\nAlfa = 1; Beta = 0.05;\
  \ Delta = 0.02; Gamma = 0.5;\n% NOTE: x(1)=x and x(2)=y\ndxy=@(t,x)([Alfa*x(1)-Beta*x(1).*x(2);...\n\
  Delta*x(1).*x(2)-Gamma*x(2)]);\ntime=[0, 20];\nICs=[10 10];      % Initial number\
  \ of preys and predators\n%   Since this has two populations, we pass the array\
  \ [1 2].\n%   Options=odeset('reltol', 1e-5),'NonNegative', [1 2]);\nopts=odeset('reltol',\
  \ 1e-5, 'NonNegative', [1 2]);\n[t, xy]=ode45(dxy, time, ICs, opts);\nplot(t, xy,\
  \ 'linewidth', 2),\ngrid minor, legend('Prey','Predator')\ntitle('Lotka-Voltera\
  \ function: predator/prey two-body sim.')\nfigure\nplot(xy(:,1),xy(:,2)), grid on;\
  \ hold on\nICs=[40 20];\nopts=odeset('reltol', 1e-5, 'NonNegative', [1 2]);\n[t,\
  \ xy]=ode45(dxy, time, ICs, opts);\nplot(xy(:,1),xy(:,2), 'r--', 'linewidth', 1.5),\
  \ grid on\nICs=[60 20];\nopts=odeset('reltol', 1e-5, 'NonNegative', [1 2]);\n[t,\
  \ xy]=ode45(dxy, time, ICs, opts);\nplot(xy(:,1),xy(:,2), 'mo-', 'linewidth', 1.5),\
  \ grid on\nICs=[80 20];\nopts=odeset('reltol', 1e-5, 'NonNegative', [1 2]);\n[t,\
  \ xy]=ode45(dxy, time, ICs, opts);\nplot(xy(:,1),xy(:,2), 'kx:', 'linewidth', 1.5),\
  \ grid on\nICs=[Alfa/Beta Gamma/Delta];\nopts=odeset('reltol', 1e-5, 'NonNegative',\
  \ [1 2]);\n[t, xy]=ode45(dxy, time, ICs, opts);\nplot(xy(:,1),xy(:,2), 'gx-', 'linewidth',\
  \ 1.5), grid on\ntitle('Lotka-Voltera model: 20 predators vs.~ preys')\nxlabel('x(t),\
  \ prey rate'), ylabel('y(t), predator rate')\nlegend('x_0/y_0=1','x_0/y_0=2','x_0/y_0=3','x_0/y_0=4',...\n\
  'ICs=[\\alpha/\\beta \\gamma/\\delta]'), hold off\n```\n\n图 12-6 和图 12-7 显示了该脚本的仿真结果。\n\
  \n![../images/490522_1_En_12_Chapter/490522_1_En_12_Fig7_HTML.png](img/490522_1_En_12_Fig7_HTML.png)\n\
  \n图 12-7\n\nLotka-Voltera 模型模拟，包含 20 个捕食者与 20、60、80 个猎物，以及一个特殊情况，即猎物数为 ![$$ \\frac{\\\
  alpha }{\\beta }=20\\ and\\ predators $$](img/490522_1_En_12_Chapter_TeX_IEq3.png)\
  \ 且捕食者数为 ![$$ \\frac{\\gamma }{\\delta }=25\\. $$](img/490522_1_En_12_Chapter_TeX_IEq4.png)\n\
  \n![../images/490522_1_En_12_Chapter/490522_1_En_12_Fig6_HTML.jpg](img/490522_1_En_12_Fig6_HTML.jpg)\n\
  \n图 12-6\n\n包含 20 个猎物和 20 个捕食者的 Lotka-Voltera 模拟\n\nLotka-Voltera 问题的建模方法不仅可应用于自然界生物过程的研究，也可用于存在干扰因素下各行业发展动态的建模。\n\
  \n## 练习\n\n以下是供您自行尝试的练习。\n\n### 练习 1\n\n执行以下操作：\n\n*   使用求解器 `ode2` 在 Simulink 中构建\
