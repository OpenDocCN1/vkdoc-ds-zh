  ## 示例 21


  下面是示例问题：![$$ \ddot{y}-2\dot{y}+5y=0,\kern0.5em y\left(\frac{\pi }{2}\right)=0,\dot{y}\left(\frac{\pi
  }{2}\right)=1\. $$](img/490522_1_En_3_Chapter_TeX_IEq138.png)


  请注意，在该问题中，初始条件设定在 ![$$ t=\frac{\pi }{2}。 $$](img/490522_1_En_3_Chapter_TeX_IEq139.png)


  在本例中，我们同样通过引入新变量，将给定的二阶问题表示为两个一阶常微分方程开始。


  ![$$ \ddot{y}=2\dot{y}-5y $$](img/490522_1_En_3_Chapter_TeX_IEq140.png) 表示为：![$$
  \left\{\begin{array}{c}{\dot{y}}_1={y}_2\\ {}{\dot{y}}_2=2{y}_2-5{y}_1\end{array}\right.
  $$](img/490522_1_En_3_Chapter_TeX_IEq141.png)


  请注意 *y*[1] = *y* 且 ![$$ {\dot{y}}_2=\ddot{y} $$](img/490522_1_En_3_Chapter_TeX_IEq142.png)
  。


  脚本 `ODEx_solvers_EX21.m` 嵌入了 Simulink 的 `ode23`、MATLAB 的 `ode45`、通过脚本实现的四阶龙格-库塔方法以计算数值解，以及
  `dsolve()` 以计算问题的解析解。该示例的 Simulink 模型 (`ICs_non_Zero_2ODE_EX4.mdl`) 如图 3-32 所示。


  ![../images/490522_1_En_3_Chapter/490522_1_En_3_Fig32_HTML.jpg](img/490522_1_En_3_Fig32_HTML.jpg)


  **图 3-32** 问题的 Simulink 模型 (`ICs_non_Zero_2ODE_EX4.mdl`)


  ```

  % ODEx_solvers_EX21.m

  % 给定： y"-2y''+5y=0, y(pi/2)=0, y''(pi/2)=2

  clearvars; close all

  %% SIMULINK 解法

  %!!! 注意：计算从 pi/2 开始

  opts=simset(''reltol'',1e-5,''solver'', ''ode23'');

  [time, Yout]=sim(''ICs_non_Zero_2ODE_EX4'', [pi/2, 2*pi], opts);

  plot(time, Yout(:,1), ''m--o'', ''markersize'', 9), hold on

  %% 龙格-库塔（基于 ode45 求解器）解法

  % 注意：计算从 pi/2 开始，这是初始条件的设定点。

  ICs=[0; 2];    %初始条件

  ts=pi/2;       %!!! 注意：计算从 pi/2 开始

  tend=2*pi;

  U(1,:)=[0, 2];

  [time,u_sol]=ode45(@(t,u)([u(2); 2*u(2)-5*u(1)]),[ts,tend], ICs);

  plot(time, u_sol(:,1), ''b>'', ''markersize'', 9), hold on

  %% 龙格-库塔（基于脚本）解法

  % 注意：计算从 pi/2 开始，这是初始条件的设定点。

  U(1,:)=[0, 2];    %初始条件

  ts=pi/2;          %!!! 注意：计算从 pi/2 开始

  h=pi/20; tend=2*pi; t=ts:h:tend; steps=length(t);

  FF=@(t, u1, u2)([u2, 2*u2-5*u1]);

  for ii=1:steps-1

  k1=FF(t(ii), U(ii,1), U(ii,2));

  k2=FF(t(ii)+h/2,U(ii,1)+h*k1(:,1)/2,U(ii,2)+h*k1(:,2)/2);

  k3=FF(t(ii)+h/2,U(ii,1)+h*k2(:,1)/2,U(ii,2)+h*k2(:,2)/2);

  k4=FF(t(ii)+h,U(ii,1)+h*k3(:,1),U(ii,2)+h*k3(:,2));

  U(ii+1,:)=U(ii,:)+h*(k1+2*k2+2*k3+k4)/6;

  end

  plot(t(:)'',U(:,1),''k:p'',''markersize'', 13, ''markerfacecolor'', ''c'')

  %% 解析解：通过 dsolve

  y=dsolve(''D2y=2*Dy-5*y'', ''y(pi/2)=0'', ''Dy(pi/2)=2'', ''x'');

  display(''y(t) 为''); pretty(y); y=vectorize(y); x=t; Yt=eval(y);

  plot(t, Yt, ''g-'', ''linewidth'', 2.5), grid on; hold on

  legend(''Simulink(ode23 ~变步长)'',''ODE45'',''RK 四阶脚本'',''解析解'')

  title(''ddy-2dy+5y=0, y(\pi/2)=0, dy(\pi/2)=2'')

  xlabel(''t, 时间''), ylabel(''y(t), 解''), hold off; shg

  ```


  执行上述脚本 (`ODEx_solversEX4.m`) 后，该脚本还会执行 Simulink 模型 (`ICs_non_Zero_2ODE_EX21.mdl`)，即可得到显示所有结果的图（如图
  3-33 所示）。


  ![../images/490522_1_En_3_Chapter/490522_1_En_3_Fig33_HTML.png](img/490522_1_En_3_Fig33_HTML.png)


  **图 3-33** 问题的仿真结果


  此外，在命令行窗口中得到以下符号表达式，即问题的解析解：


  ```

  y(t) 为

  /   pi \

  - sin(2 x) exp| - -- | exp(x)

  \   2  /

  ```


  从图 3-33 所示的图中可以清楚地看到，采用 `ode23` 变步长求解器的 Simulink 模型和四阶龙格-库塔方法计算出的数值解与给定二阶常微分方程的解析解良好收敛。


  ## `diff()`


  `diff()` 是 MATLAB 的一个内置函数，用于计算差分和近似导数。它的工作方式类似于泰勒级数方法，通过评估函数的近似导数来计算计算演化中的差分。让我们考虑以下示例并应用
  `diff` 函数。




  ### 示例 22


  火星着陆器在着陆时的速度和加速度运动方程如下：


  ![$$ \ddot{y}+\left(\frac{k}{m}\right){\dot{y}}²=g,\kern0.5em y(0)=20,\kern0.5em
  \dot{y}(0)=67.0556 $$](img/490522_1_En_3_Chapter_TeX_Equb.png)


  与之前的问题不同，本例中我们并不关心着陆器的位移`y(t)`；而是需要评估其着陆时的速度（`\dot{y}(t)=v(t)`）和加速度（`\ddot{y}(t)=a(t)`），其中`m`是火星着陆器的质量，`k`是阻尼系数，`g`是火星的重力加速度。在本数值模拟中，我们使用以下数值：


  ![$$ m=150\ \left[ kg\right],k=1.2\ \left[N\ m\ s\right],g=3.885\ \left[\frac{m}{s²}\right].
  $$](images/490522_1_En_3_Chapter/490522_1_En_3_Chapter_TeX_IEq145.png)


  在本例中，我们再次通过引入新变量，将给定的二阶常微分方程重写为两个一阶常微分方程。


  `\ddot{y}+(k/m)\dot{y}²=g` 表示如下：


  ![$$ \left\{\begin{array}{c}{y}_2={\dot{y}}_1\\ {}{\dot{y}}_2=g-\left(\frac{k}{m}\right){y}_2²\end{array}\right.
  $$](img/490522_1_En_3_Chapter_TeX_IEq147.png)


  请注意，`y[1] = y` 且 `\dot{y}_2 = \ddot{y}_1`。


  以下是嵌入了`ode45`求解器和`diff`函数的脚本（`MARS_lander.m`）：


  ```

  %%  MARS Lander Vehicle velocity and acceleration while landing

  %   MARS_lander.m

  t=0:.05:6; u0=[20, 67.0556]; g=3.885; k=1.2; m=150;

  %F=inline(''[u(2); g-(k/m)*(u(2).²)]'', ''t'', ''u'');

  Flander=@(t, u)([u(2); g-(k/m)*(u(2).²)]);

  [time, Uout]=ode45(Flander, t, u0, []);

  % Acceleration is a derivative of velocity!

  acc = diff(Uout(:,2))/(time(2)-time(1));

  plot(t,Uout(:,2),''ro'',t(2:end),acc,''bs''); hold on

  % Time derivative:

  Ttt=[diff(t);diff(t)];

  % Velocity:

  Utt=diff(Uout);

  % Acceleration:

  UT=Utt./Ttt'';

  plot(t(2:end),UT(:,1),''b-'',t(2:end),UT(:,2), ...

  ''m--'',''linewidth'',2.5)

  legend({''Velocity1 [m/s]'';''Acceleration1 [m²/s]'';...

  ''Velocity2''; ''Acceleration2''},0); grid minor

  title(''Mars lander"s velocity and acceleration during landing'')

  xlabel(''time''), ylabel(''v, a''), shg

  ```


  从图 3-34 所示的图形可以看出，对于给定问题（火星着陆器着陆时的运动方程），`ode45`和`diff`这两种方法都生成了良好收敛的解。


  ![../images/490522_1_En_3_Chapter/490522_1_En_3_Fig34_HTML.jpg](img/490522_1_En_3_Fig34_HTML.jpg)


  **图 3-34**


  使用`ode45`和`diff`评估的火星着陆器速度和加速度


  当需要计算复杂函数的符号导数时，使用`diff()`非常简便。以下是一个示例：


  ```

  >> syms x y t

  >> F=[sin(10*t); x²+y³+2*x*y²; t²*sinc(2*x/y)];

  dF=[diff(F(1),t); diff(F(2), x, y); diff(F(3), x, y)]

  dF =

  10*cos(10*t)

  3*y² + 4*x*y

  (t²*sin((2*pi*x)/y))/(2*pi*x) - (t²*cos((2*pi*x)/y))/y

  >> pretty(dF)

  +-                                     -+

  |              10 cos(10 t)             |

  |                                       |

  |                 2                     |

  |              3 y  + 4 x y             |

  |                                       |

  |   2    / 2 pi x \    2    / 2 pi x \  |

  |  t  sin| ------ |   t  cos| ------ |  |

  |        \   y    /         \   y    /  |

  |  ---------------- - ----------------  |

  |       2 pi x               y          |

  +-                                     -+

  ```


  通过对几个二阶常微分方程的仿真示例，我们演示了如何实现欧拉法、龙格-库塔法、龙格-库塔-吉尔法、龙格-库塔-费尔伯格法、亚当斯-巴什福思法、米尔恩法、亚当斯-莫尔顿法以及泰勒级数法来求解常微分方程。此外，我们还使用了
  MATLAB 内置的 ODE 求解器和工具，例如`ode23`、`ode23tb`、`ode45`、`ode113`、`odeset`和`diff()`。同时，我们还演示了使用求解器（如`ode2`、`ode3`、`ode23`、`ode45`）和工具（如`simset`和`sim`）的
  Simulink 建模技术。所有这些方法和工具都适用于所有显式定义的常微分方程及常微分方程组。这些方法的效率和精度取决于给定的 ODE 方程类型，例如线性或非线性、齐次或非齐次、刚性或非刚性。此外，所采用的数值方法的精度和效率还取决于用户选择/设置的误差容限和步长。


  '
- "# 4. 刚性 ODE 问题\n\n在本章中，我们将探讨求解刚性 ODE 的几种不同方法。我们将再次介绍如何运用欧拉法、龙格-库塔法以及预测-校正法。我们还将使用亚当斯-莫尔顿法和\
  \ MATLAB 内置求解器，即`ode15s`、`ode23s`、`ode23tb`、`ode45`和`ode113`，然后对所有方法进行比较，以找出在精度和计算时间方面最有效的方法。在许多\
  \ MATLAB 参考资料中，对于非常刚性的 ODE，推荐使用求解器`ode15s`。我们将验证它是否确实最高效。\n\n\n\n### 示例 1\n\n给定一个中等刚度的常微分方程，示例问题如下：`dy/dt\
  \ + 100y = 0, y(0) = 1`。\n\n为了对常微分方程求解器和方法进行对比分析，我们将首先使用**前向欧拉法**，以（时间）步长 0.015\
  \ 计算给定练习的数值解，然后以步长 0.0075（比第一个步长小两倍）重复仿真。接着，我们使用 `dsolve()` 求解析解，并再次使用步长为 0.0075\
  \ 的**四阶/五阶龙格-库塔法**求数值解。所有这些步骤均在以下脚本中实现，该脚本名为 `STIFF_1ODE_EX1.m`：\n\n```\n%% STIFF_1ODE_EX1.m\n\
  % 问题的解析解为 y(t)=exp(-100t)。\n% 欧拉前向法：\nclose all; clearvars; clc\ny0=1;         \
  \         % 初始条件\ndt1=1.5e-2;            % 步长 1\ndt2=0.75e-2;           % 步长 2\n\
  tstart=0;\ntend=.25;\nt1=tstart:dt1:tend;    % 第一次尝试的仿真时间空间\nt2=tstart:dt2:tend;\
  \    % 第二次尝试的仿真时间空间\nsteps1=length(t1);     % 第一次迭代的循环次数\nf=@(y)(-100*y);\ny=[y0,\
  \ zeros(1,steps1-1)]; h=dt1;\nfor ii=1:steps1-1\ny(ii+1)=y(ii)+f(y(ii))*h;\nend\n\
  figure, plot(t1, y, 'bo-'); hold on\nsteps2=length(t2);     % 第二次迭代的循环次数\ny=[y(1),\
  \ zeros(1,steps2-1)]; h=dt2;\nfor ii=1:steps2-1\ny(ii+1)=y(ii)+f(y(ii))*h;\nend\n\
  plot(t2, y, 'rd-'); Y=dsolve('Dy=-100*y', 'y(0)=1', 't');\nYY=vectorize(Y); t=t1;\n\
  YY=eval(YY);\nplot(t1, YY, 'k-', 'linewidth',1.5)\ntitle('\\it 刚性问题的解：$$ \\frac{dy}{dt}=-100*y,\
  \ y_0=1 $$', 'interpreter', 'latex')\nxlabel('t'); ylabel( 'y(t)'); xlim([0, .3])\n\
  grid on\n%% 通过脚本实现的四阶龙格-库塔法\nu(1)=1;     % 初始条件：u(0)=1，从索引 1 开始\nu=[u(1), zeros(1,steps2-1)];\n\
  for ii=1:steps2-1\nk1=f(u(ii)); k2=f(u(ii)+h*k1(:,1)/2); k3=f(u(ii)+h*k2(:,1)/2);\n\
  k4=f(u(ii)+h*k3(:,1)); u(ii+1)=u(ii)+h*(k1+2*k2+2*k3+k4)/6;\nend\nplot(t2, u, 'mp--',\
  \ 'linewidth',1.0)\nlegend('欧拉前向法：h=0.015', '欧拉前向法：h=0.0075',...\n'dsolve（解析解）',\
  \ '龙格-库塔法：h=0.0075')\ngrid on\naxis tight\nhold off; shg\n```\n\n从仿真结果（如图 4-1 所示）可以看出，如果选取的步长大于所需值，则在将前向欧拉法用于刚性问题时，会观察到明显的波动和不稳定解。因此，在使用欧拉法和龙格-库塔法（这两者均为预测型常微分方程求解器）时，如何选择步长是一个值得关注的问题。\n\
  \n![../images/490522_1_En_4_Chapter/490522_1_En_4_Fig1_HTML.png](img/490522_1_En_4_Fig1_HTML.png)\n\
  \n*图 4-1* – 一阶刚性常微分方程的仿真结果：`dy/dt + 100y = 0，y(0) = 1`\n\n## 示例 2\n\n这是一个刚性更强的问题：`dy/dt\
  \ + 1000y = 0，y(0) = 1`。在本问题的仿真中，我们使用 MATLAB 内置的常微分方程求解器，即 `ode45` 和 `ode15s`，并比较它们在计算时间方面的效率（`STIFF_1ODE_EX2.m`）。\n\
  \n```\n%% STIFF_1ODE_EX2.m\nclose all; clearvars\n%{\n注意：该问题的解衰减至零。如果求解器\n产生一个负的近似解，它会通过此值开始追踪\n\
  常微分方程的解，解会趋向负无穷，\n计算失败。因此，使用 ODESET 的 NonNegative 属性可以防止\n这种情况发生。\n非负性适用于 ode45、ode113，不适用于\
  \ ode15i、ode15s、ode23s、ode23t、ode23tb。\n%}\n% x1=1; time=[0, 15];\ntic;\nopts=odeset('NonNegative',1,'reltol',\
  \ 1e-3, 'abstol', 1e-5);\n[t1, xODE45]=ode45(@(t,x)(-1000*x), [0, 15], 1, opts);\n\
  Time_ODE45=toc; fprintf('Time_ODE45 = %2.6f\\n', Time_ODE45)\n%% MATLAB 刚性问题求解器\
  \ ODE15s\nclearvars\ntic;\nopts=odeset('reltol', 1e-3, 'abstol', 1e-5);\n[t, xODE15s]=ode15s(@(t,x)(-1000*x),\
  \ [0, 15], 1, opts);\nTime_ODE15s=toc; fprintf('Time_ODE15s = %2.6f\\n', Time_ODE15s)\n\
  ```\n\n执行脚本后，我们在命令窗口中获取以下输出：\n\n```\nTime_ODE45 = 0.632997\nTime_ODE15s = 0.013348\n\
  ```\n\n从计算时间的输出来看，显然求解器 `ode15s` 在计算时间方面效率更高。如果我们绘制两个求解器的仿真结果，会得到与问题解析解非常接近的收敛结果。对于中等刚性问题，`ode45`\
  \ 可以表现得相对不错。请注意，并非所有常微分方程求解器在其默认设置下都能正确评估非常刚性初值问题的数值解。让我们考虑下一个一阶刚性常微分方程练习。\n\n\n\
  \n### 示例 3\n\n以下是示例问题：![$$ \\dot{y}-\\cos (1001t)=0 $$](img/490522_1_En_4_Chapter_TeX_IEq4.png)\
  \ 初始条件为 `y(0) = 1.001`。该问题存在解析解，如下所示：![$$ y(t)=\\frac{\\sin (1001t)}{1001}+1.001\
  \ $$](img/490522_1_En_4_Chapter_TeX_IEq5.png)。\n\n我们使用内置求解器（如 `ode23`、`ode23s`、`ode45`、`ode113`\
  \ 和 `ode15s`）以及前向欧拉法（`STIFF_1ODE_EX3.m`）来计算给定一阶常微分方程的数值解。\n\n```\n% STIFF_1ODE_EX3.m\n\
  clearvars; close all\n% Numerical solutions with ODEx:\nFun=@(t,y)(cos(1001*t));\
  \ Time=[0,0.75]; y0=1.001;\n[t1, y1]=ode23s(Fun, Time, y0);\n[t2, y2]=ode45(Fun,\
  \ Time, y0);\n[t3, y3]=ode113(Fun, Time, y0);\n[t4, y4]=ode15s(Fun, Time, y0);\n\
  subplot(211)\nplot(t1, y1, 'rs--', 'markersize', 9, 'markerfacecolor', 'c')\nhold\
  \ on\nplot(t2, y2, 'bh-.', 'markersize', 9, 'markerfacecolor', 'y')\nplot(t3, y3,\
  \ 'm-', 'linewidth', 1.5)\nlegend('ode23s','ode45','ode113')\ntitle('\\it Solutions\
  \ of Stiff Problem: $$ \\frac{dy}{dt}=cos(1001*t, y_0=1.001 $$', 'interpreter',\
  \ 'latex')\nxlabel('\\it t'); ylabel( '\\it y(t)'); axis tight; grid on\nsubplot(212)\n\
  plot( t4, y4, 'b--o', 'markersize', 9, 'markerfacecolor', 'y'), hold on\n% Euler\
  \ forward method:\ny(1)=y0; h=1e-2; t=0:h:0.75; steps=length(t);\nf=@(t, y)(cos(1001*t));\
  \ y=[y(1), zeros(1, length(t)-1)];\nfor ii=1:steps-1\nF=f(t(ii), y(ii));\ny(ii+1)=y(ii)+h*F;\n\
  end\nplot(t, y, 'm', 'linewidth', 1.5)\n% Analytical Solution:\nclearvars t y\n\
  syms y(t)\nDy=diff(y); y=dsolve(Dy==cos(1001*t), y(0)==1.001); y=vectorize(y);\n\
  t=0:.01:0.75; y=eval(y); plot(t, y, 'k--', 'linewidth', 1.5),\nhold on;\nlegend(\
  \ 'ode15s', 'Euler forward','Analytical Sol')\nxlabel('\\it t'); ylabel( '\\it y(t)');\
  \ shg\naxis([0 .75 .95 1.33]), grid on\n```\n\n在此练习中，对于给定的一阶刚性常微分方程，可以清晰地看到，求解器\
  \ `ode23`、`ode23s`、`ode45` 和 `ode15s`（即使是推荐的求解器）给出了错误或虚假的解（如图 4-2 所示）。相反，高阶求解器 `ode113`\
  \ 以及前向欧拉法这种粗略近似方法却能得出足够正确的解，且与解析解结果吻合良好。另外，值得指出的是，当使用内置 ODEx 求解器及其默认设置（如相对和绝对误差容限）计算刚性常微分方程的数值解时，即使我们选择了推荐的求解器\
  \ `ode15s`，也并非总能得到精确的数值解。\n\n![../images/490522_1_En_4_Chapter/490522_1_En_4_Fig2_HTML.png](img/490522_1_En_4_Fig2_HTML.png)\n\
  \n图 4-2\n\n一阶刚性常微分方程仿真：![$$ \\dot{y}-\\mathit{\\cos}(1001t)=0 $$](img/490522_1_En_4_Chapter_TeX_IEq6.png)\
  \ 初始条件为 `y(0) = 1.001`\n\n**注意**  \n包括 `ode15s` 在内的大多数内置 ODEx 求解器，在默认设置下无法计算出非常刚硬初值问题的精确数值解。必须相应地调整设置。在解决某些非常刚硬的常微分方程时，高阶求解器\
  \ `ode113` 可能是个例外。\n\n接下来，我们用多个内置 ODEx 求解器来考虑另一个中等刚度的二阶齐次常微分方程练习。\n\n### 示例 4\n\n\
  以下是示例问题：![$$ \\ddot{y}+100\\dot{y}+10.9y=0 $$](img/490522_1_En_4_Chapter_TeX_IEq7.png)，`y(0)\
  \ = 1`，`\\dot{y}(0) = 0`。\n\n首先，我们将给定的二阶常微分方程重写为两个一阶常微分方程组成的方程组，如下所示：\n\n![$$ \\\
  ddot{y}=-100\\dot{y}-10.9y $$](img/490522_1_En_4_Chapter_TeX_IEq9.png) => ![$$ \\\
  left\\{\\begin{array}{c}{x}_2={\\dot{x}}_1\\\\ {}{\\dot{x}}_2=-100{x}_2-10.9{x}_1\\\
  end{array}\\right. $$](img/490522_1_En_4_Chapter_TeX_IEq10.png)\n\n该方程组被编码在一个名为\
  \ `A1_Stiff.m` 的函数文件中。\n\n```\nfunction Dxdt=A2_Stiff(T, X)\n%%% Note: Given Equation\
  \ is 2nd Order ODE.\n%      ddy+100*dy+10.9*y(t)=0\n%      The Function File Is\
  \ Saved Under The Name: A2_Stiff.M\nDxdt=[X(2);\n-100*X(2)-10.9*X(1)];\nend\n```\n\
  \n函数文件 `A2_stiff.m` 被脚本 `STIFF_2ODE_EX4.m` 调用，以使用多个内置 ODEx 求解器仿真给定的二阶常微分方程。\n\n\
  ```\n% STIFF_2ODE_EX4.m\nICs=[1 0]; ts=[0, 100];\nOPTs=odeset('RelTol', 1e-6, 'AbsTol',\
  \ 1e-8);\ntic;\n[t, x_ODE45]=ode45(@A2_Stiff,  ts, ICs, OPTs);\nt_ODE45=toc;\nfprintf('Time_ode45\
  \ = %2.6f \\n', t_ODE45)\nclearvars\nICs=[1 0]; ts=[0, 100];\nOPTs=odeset('RelTol',\
  \ 1e-6, 'AbsTol', 1e-8);\ntic;\n[t1, x_ODE23s]=ode23s(@A2_Stiff, ts, ICs, OPTs);\n\
  t_ODE23s=toc;\nfprintf('Time_ode23 = %2.6f \\n', t_ODE23s)\nclearvars\nICs=[1 0];\
  \ ts=[0, 100];\nOPTs=odeset('RelTol', 1e-6, 'AbsTol', 1e-8);\ntic;\n[t2, x_ODE113]=ode113(@A2_Stiff,\
  \ ts, ICs, OPTs);\nt_ODE113=toc;\nfprintf('Time_ode113 = %2.6f \\n', t_ODE113)\n\
  clearvars\nICs=[1 0]; ts=[0, 100];\nOPTs=odeset('RelTol', 1e-6, 'AbsTol', 1e-8);\n\
  tic;\n[t3, Y_ODE23tb]=ode23tb(@A2_Stiff, ts, ICs, OPTs);\nt_ODE23tb=toc;\nfprintf('Time_ode23tb\
  \ = %2.6f \\n', t_ODE23tb)\nclearvars\nICs=[1 0]; ts=[0, 100];\nOPTs=odeset('RelTol',\
  \ 1e-6, 'AbsTol', 1e-8);\ntic;\n[t4, x_ODE15s]=ode15s(@A2_Stiff,  ts, ICs, OPTs);\n\
  t_ODE15s=toc;\nfprintf('Time_ode15s = %2.6f \\n', t_ODE15s)\n```\n\n在一台笔记本电脑（配备\
  \ Windows 10、Intel Core i7 芯片、2.5 GHz 和 8GB RAM）上执行该脚本后，得到了以下结果。可以清晰地看出，`ode15s`\
  \ 在计算（已耗用）时间效率上明显优于所有其他常微分方程求解器。\n\n```\nTime_ode45 = 0.232020\nTime_ode23 = 0.098099\n\
  Time_ode113 = 0.480924\nTime_ode23tb = 0.084671\nTime_ode15s = 0.028107\n```\n\n\
  这展示了 MATLAB/Simulink 中可用于刚性常微分方程问题的求解器的效率。\n\n### 雅可比矩阵\n\n使用雅可比矩阵配合内置 ODEx 求解器求解刚性常微分方程可以加速计算过程。雅可比矩阵的性质仅与刚性问题求解器相关，即\
  \ `ode15s`、`ode23s`、`ode23t`、`ode23tb` 和 `ode15i`，并且它们不仅在计算中，而且在可靠性问题上都扮演着重要角色。请注意，`ode15i`\
  \ 的雅可比矩阵具有不同的性质。\n\n雅可比矩阵是关于定义微分方程的给定函数的偏导数矩阵。例如，给定一个向量 `h`：\n\n![$$ h\\left(x,y,z\\\
  right)=\\left\\{\\begin{array}{c}{x}²+{y}²+{z}²\\\\ {}{x}²y+{y}²z-2 yz\\\\ {}3 xyz+2\
  \ xy\\end{array}\\right\\} $$](img/490522_1_En_4_Chapter_TeX_Equa.png)\n\n向量 `h(x,\
  \ y, z)` 关于向量 ![$$ g\\left(x,y,z\\right)=\\left\\{\\begin{array}{c}x\\\\ {}y\\\\\
  \ {}z\\end{array}\\right. $$](img/490522_1_En_4_Chapter_TeX_IEq11.png) 的雅可比矩阵可以通过符号数学工具箱工具/命令按以下方式计算：\n\
  \n```\n>> syms x y z\n>> h=[x²+y²+z²; x²+y²*z-2*y*z; 3*x*y*z-2*x*y];\n>> g=[x, y,\
  \ z];\n>> Jac_h=jacobian(h, g)\nJac_h =\n[         2*x,         2*y,       2*z]\n\
  [         2*x, 2*y*z - 2*z, y² - 2*y]\n[ 3*y*z - 2*y, 3*x*z - 2*x,     3*x*y]\n\
  ```\n\n现在，我们可以通过使用刚性问题的雅可比矩阵来验证其在解决问题中的重要性。请注意，接下来我们将通过二阶常微分方程（切比雪夫微分方程）来阐明雅可比矩阵。\n\
  \n\n\n## 示例 5\n\n切比雪夫微分方程定义如下：\n\n![$$ \\left(1-{t}²\\right)\\ddot{y}-t\\dot{y}+{n}²y=0\
  \ $$](img/490522_1_En_4_Chapter_TeX_IEq12.png) 且满足 `|t| < 1` 和 ![$$ y(0)=1,\\kern0.5em\
  \ \\dot{y}(0)=1 $$](img/490522_1_En_4_Chapter_TeX_IEq13.png)\n\n让我们计算 `n = 0, 1,\
  \ 2, …, 9` 时切比雪夫微分方程解的数值。\n\n第一步，我们需要通过引入新变量，将切比雪夫方程重写为两个一阶微分方程。\n\n![$$ \\ddot{y}=\\\
  frac{t\\dot{y}-{n}²y}{\\left(1-{t}²\\right)} $$](img/490522_1_En_4_Chapter_TeX_IEq14.png)\
  \ => ![$$ \\left\\{\\begin{array}{c}{y}_2=\\dot{y_1}\\\\ {}{\\dot{y}}_2=\\frac{t{y}_2-{n}²{y}_1}{1-{t}²}\\\
  end{array}\\right. $$](img/490522_1_En_4_Chapter_TeX_IEq15.png)\n\n第二步，我们求前面描述的微分方程组的雅可比矩阵。\n\
  \n```\n>> syms y1 y2 n t\n>> C1=[y2; (t*y2-n²*y1)/(1-t²)];\n>> G=[y1, y2];\n>> JC1=jacobian(C1,\
  \ G)\nJC1 =\n[             0,            1]\n[ n²/(t² - 1), -t/(t² - 1)]\n>> pretty(JC1)\n\
  +-                  -+\n|     0,       1     |\n|                    |\n|     2\
  \              |\n|    n         t     |\n|  ------, - ------  |\n|   2        \
  \ 2      |\n|  t  - 1    t  - 1  |\n+-                  -+\n```\n\n基于计算出的切比雪夫微分方程雅可比矩阵及其初始条件，我们编写下一个脚本，命名为\
  \ `ChebyshevDemo.m`：\n\n```\nfunction ChebyshevDemo\n% HELP: ChebyshevDemo.m 是一个模拟切比雪夫方程\n\
  %      数值解的脚本：\n%      (1-t²)*ddy-t*dy+n²*y=0\n%      其中 n=0,1,2,3,4,5,6, ...\n\
  %      t 定义满足 |t|.xsh+od+*^v'；\noptions = odeset('RelTol',1e-4,'AbsTol',1e-5,'Jacobian',@JC1);\n\
  for ii = 1:10\n[t, Y]   = ode15s(@D2Y, t,[y0, dy0], options, ii-1);\nStylo    =\
  \ [Colorit(ii) Lineit(ii) Markit(ii)];\nLabelit{ii} = ['n= ' num2str(ii-1)]; plot(t,\
  \ Y(:,1),Stylo), hold on\nend\nxlabel('\\it t'), ylabel('\\it 解, y(t)')\nlegend(Labelit{:},\
  \ 'location', 'northwest'), grid on\ntitle('\\it 切比雪夫方程的解，n=0,1...9'), hold off\n\
  function ddy=D2Y(t, y, n)\n% 切比雪夫微分方程\nddy=[y(2);\n(t.*y(2)-n.²*y(1))./(1-t.²)];\n\
  function J=JC1(t, y, n)\n% 计算雅可比矩阵\nJ=[0, 1;\nn²/(t²-1), -t/(t²-1)];\n```\n\n执行脚本\
  \ `ChebyshevDemo.m` 后，我们得到图 4-3 所示的图形，其中包含 `n = 0, 1, … 9` 不同取值下切比雪夫微分方程的 10 条曲线。\n\
  \n![../images/490522_1_En_4_Chapter/490522_1_En_4_Fig3_HTML.png](img/490522_1_En_4_Fig3_HTML.png)\n\
  \n**图 4-3** 切比雪夫微分方程的模拟：![$$ \\left(1-{t}²\\right)\\ddot{y}-t\\dot{y}+{n}²y=0 $$](img/490522_1_En_4_Chapter_TeX_IEq16.png)\
  \ 满足 `|t| < 1` 和 ![$$ y(0)=1,\\dot{y}(0)=1 $$](img/490522_1_En_4_Chapter_TeX_IEq17.png)\
  \ ，其中 `n = 0, 1, 2, … , 9`\n\n> **注意**\n> 雅可比矩阵是 ODEx 求解器的重要组成部分。因此，如果提供了雅可比矩阵，求解器的计算效率将得到提升，尤其是在解空间较大时。\n\
  \n## 示例 6\n\n这是另一个适用于相对刚性微分方程的好例子。给定的问题描述了一个整流电路电压：![$$ \\ddot{u}+100\\ \\dot{u}+{10}⁴u={10}⁴\\\
  left|\\sin \\left(333\\ t\\right)\\right|, $$](img/490522_1_En_4_Chapter_TeX_IEq18.png)\
  \ ![$$ u(0)=0,\\dot{u}(0)=0 $$](img/490522_1_En_4_Chapter_TeX_IEq19.png)。\n\n首先，如同我们在前面的示例中所做的那样，将问题重写为两个一阶微分方程。\n\
  \n![$$ \\ddot{u}={10}⁴\\mid \\sin \\left(333\\ t\\right)\\mid -100\\dot{u}-{10}⁴u\
  \ $$](img/490522_1_En_4_Chapter_TeX_IEq20.png) => ![$$ \\left\\{\\begin{array}{c}{u}_2={\\\
  dot{u}}_1\\\\ {}{\\dot{u}}_2={10}⁴\\mid \\sin \\left(333\\ t\\right)\\mid -100{u}_2-{10}⁴{u}_1\\\
  end{array}\\right. $$](img/490522_1_En_4_Chapter_TeX_IEq21.png)\n\n这个二阶刚性常微分方程的仿真模型通过脚本\
  \ `STIFF_2ODE_EX6.m` 和 Simulink 模型 `EL_Circuit.mdl` 的两个版本实现。\n\n```\n% Stiff_2ODE_EX6.m\n\
  % 示例：二阶常微分方程 ~ 整流电路电压\nclearvars; close all\nu(1,:)=[0, 0];        % 初始条件\nh=1e-4;\
  \               % 时间步长\nt=0:h:.1;             % 仿真时间空间\nsteps=length(t);      %\
  \ 步数\nf=@(t, u1,u2)([u2, 1e4*abs(sin(333*t))-1e4*u1-100*u2]);\ntic;\nfor ii=1:steps-1\n\
  F=f(t(ii), u(ii,1), u(ii,2));\nu(ii+1,:)=u(ii,:)+h*F;\nend\nt_EF=toc;\nplot(t, abs(sin(333*t)),'r',\
  \ t, u(:,1), 'bd')\naxis([0, .1 0, 1.2]),\nxlabel( '\\it t')\nylabel('\\it 输出电压,\
  \ u(t)')\ntitle('Simulation of: $$ \\frac{d²u}{dt²}+100*\\frac{du}{dt}+10⁴*u=10⁴*|sin(333*t)|\
  \ $$', ...\n'Interpreter', 'latex')\nhold on\nfprintf('使用前向欧拉法的仿真时间为： %3.5f\\n',\
  \ t_EF)\n% ODE23s\nclearvars\nt=[0,.1];ICs=[0, 0];\nFFm=@(tm, um)([um(2); 1e4*abs(sin(333*tm))-1e4*um(1)-100*um(2)]);\n\
  options=odeset('reltol', 1e-4);\ntm=t;\ntic\n[Tm, Um]=ode23s(FFm, tm', ICs, options);\n\
  t_ode23s=toc;\nfprintf('使用 ode23s 的仿真时间为：   %3.5f\\n', t_ode23s)\nplot(Tm,Um(:,1),'k--+'),\n\
  % 通过 SIMULINK\n% Simulink 模型：EL_circuit.mdl 创建了两个版本\n% 相对容差设置为：1e-4\nclearvars\n\
  options=simset('reltol', 1e-4);\ntic\n[tout, yout]=sim('EL_Circuit', [0, .1], options);\n\
  t_SIM=toc;\nplot(tout, yout(:,1), 'm-', 'linewidth', 1.5)\nlegend('输入：|sin(333*t)|','前向欧拉脚本',\
  \ ...\n'ode23s', 'Simulink：ode15s','location', 'northeast'), shg\nfprintf('使用 Simulink\
  \ ode15s 的仿真时间为： %3.5f\\n', t_SIM)\n```\n\n通过执行上述调用图 4-4 中所示 Simulink 模型 `EL_Circuit.mdl`\
  \ 的脚本（`STIFF_2ODE_EX6.m`），我们得到如图 4-5 所示的仿真结果，即计算时间效率和数值结果。\n\n![../images/490522_1_En_4_Chapter/490522_1_En_4_Fig5_HTML.png](img/490522_1_En_4_Fig5_HTML.png)\n\
  \n**图 4-5** 整流电路仿真\n\n![../images/490522_1_En_4_Chapter/490522_1_En_4_Fig4_HTML.jpg](img/490522_1_En_4_Fig4_HTML.jpg)\n\
  \n**图 4-4** `EL_Circuit.mdl` 的两个 Simulink 模型版本\n\n```\n使用前向欧拉法的仿真时间为：   0.03180\n\
  使用 ode23s 的仿真时间为：     0.63395\n使用 Simulink ode15s 的仿真时间为： 0.27289\n```\n\n在本练习中，前向欧拉法（如图\
  \ 4-5 所示）在计算时间效率方面明显优于另外两个 MATLAB/Simulink ODE 求解器 `ode23s` 和 `ode15s`。\n\n在本章中，我们通过六个练习对刚性问题的模拟，研究了不同数值求解器的效率和精度；我们使用了\
  \ `ode15s`（推荐使用）、`ode23s`（推荐使用）、`ode23`（不推荐）、`ode113`（不推荐）、`ode45`（不推荐）以及基于前向欧拉法、梯形法和\
  \ Adams-Moulton 法的脚本。对于非常刚性的问题，`ode15s` 优于所有其他求解器，正如 MATLAB 教程所推荐的那样，但我们需要仔细调整其设置，例如相对误差容限和绝对误差容限，并且，在处理非常刚性问题时，如果可行，还应使用\
  \ `odeset` 提供问题的雅可比矩阵（参见示例 5）。此外，在示例 6 中，我们看到了前向欧拉法由于其计算时间效率高，可以作为替代方案或用于对某些刚性问题进行初步评估的情况。\n\
  \n\n\n"
- '# 5. 高阶与耦合常微分方程


  本章致力于数值求解高阶和耦合常微分方程（ODE）。通常，求解高阶 ODE 和耦合 ODE 系统所使用的步骤与二阶 ODE 相似，唯一的区别在于，在将给定的高阶
  ODE 改写为一阶 ODE 系统时，需要为新变量添加额外的步骤。


  ## 四阶 ODE 问题


  让我们考虑以下四阶非齐次 ODE：


  ![$$ \frac{d⁴y}{d{t}⁴}+3\ \frac{d³y}{d{t}³}-\sin \left(\mathrm{t}\right)\frac{dy}{dt}+8y={t}²
  $$](img/490522_1_En_5_Chapter_TeX_IEq1.png)，`y(0) = 50`，`dy(0) = 40`，`d²y(0) = 30`，`d³y(0)
  = 20`。


  上述给定的四阶 ODE 可以通过如下四个一阶 ODE 组成的系统重写：


  ![$$ \left\{\begin{array}{c}{y}_2={\dot{y}}_1\\ {}{y}_3={\dot{y}}_2\\ {}{y}_4={\dot{y}}_3\\
  {}{\dot{y}}_4={t}²-3{y}_4+\mathit{\sin}\left(\mathrm{t}\right){\mathrm{y}}_2-8{\mathrm{y}}_1\end{array}\right.
  $$](img/490522_1_En_5_Chapter_TeX_Equa.png)


  该系统通过脚本 `SOLVE_4order_ODE.m` 实现：


  ```matlab

  function SOLVE_4order_ODE

  % 帮助：使用 f4ode（嵌套函数）的 EXE4orderODE.m

  %       对问题进行仿真。

  close all

  time=[0, 2*pi]; y0=[50, 40, 30, 20];

  [t, y]=ode45(@f4ode, time, y0, odeset(''reltol'', 1e-8));

  figure(''name'', ''Simulate with ODE45''),

  plot(t,y(:,1), ''b-'', t,y(:,2), ''r--'',t,y(:,3), ...

  ''k:'',t,y(:,4), ''m-.'',''linewidth'', 1.5)

  legend(''\it y(t)'', ''\it dy'',''\it ddy'',''\it dddy'',... ''location'',''best'')

  title(''ODE45 仿真: $$ \frac{d⁴y}{dt⁴}+3*\frac{d³y}{dt³}-sin(t)*\frac{dy}{dt}+8*y=t²
  $$'', ''interpreter'', ''latex'')

  grid on, ylim([-700 300]), xlim([0, 2*pi])

  xlabel(''\it t'')

  ylabel(''\it 解: $$ \frac{d³y}{dt³}, \frac{d²y}{dt²}, \frac{dy}{dt}, y(t) $$'', ''interpreter'',
  ''latex'')

  grid on

  figure(''name'',''Simulate with ODE23'');

  ode23(@f4ode, time, y0, odeset(''reltol'', 1e-8))

  ylim([-700 300]), xlim([0, 2*pi])

  legend(''\it y(t)'', ''\it dy'',''\it ddy'',''\it dddy'', ''location'',''best'')

  title(''ODE23 仿真: $$ \frac{d⁴y}{dt⁴}+3*\frac{d³y}{dt³}-sin(t)*\frac{dy}{dt}+8*y=t²
  $$'', ''interpreter'', ''latex'')

  xlabel(''\it t'')

  ylabel(''\it 解: $$ \frac{d³y}{dt³}, \frac{d²y}{dt²}, \frac{dy}{dt}, y(t) $$'', ''interpreter'',
  ''latex'')

  grid on

  function f=f4ode(t, y)

  % 给定的四阶 ODE 为： y""+3*y"''-sin(t)*y''+8*y=t²

  f=[y(2); y(3); y(4); t.²-3.*y(4)+sin(t).*y(2)-8.*y(1)];

  end

  end

  ```


  使用 `ode45` 的仿真结果（如图 5-1 所示）与使用 `ode23` 得到的结果（此处未显示绘图）吻合良好。注意，在脚本 `SOLVE_4order_ODE.m`
  中，使用了一个嵌套函数 (`f4ode`) 来表达给定的四阶 ODE，该函数也可用匿名函数替代。示例如下：


  ![../images/490522_1_En_5_Chapter/490522_1_En_5_Fig1_HTML.png](img/490522_1_En_5_Fig1_HTML.png)


  图 5-1：四阶非齐次非线性 ODE 问题的仿真


  ```matlab

  f4ode=@(t, y)([y(2); y(3); y(4); t.²-3.*y(4)+sin(t).*y(2)-8.*y(1)]);

  ```


  那么调用 `ode45` 或 `ode23` 的语法如下：


  ```matlab

  [t, y]=ode45(f4ode, time, y0, odeset(''reltol'', 1e-8));

  ```


  图 5-2 展示了给定四阶 ODE 问题的两个版本的 Simulink 模型（`Fourth_order_ODE.slx`）。


  ![../images/490522_1_En_5_Chapter/490522_1_En_5_Fig2_HTML.jpg](img/490522_1_En_5_Fig2_HTML.jpg)


  图 5-2：四阶非齐次 ODE 的 Simulink 模型


  注意，在第一个和`二阶积分器`模块中，所有初始条件（IC）都是内部源的输入。两个模型唯一的区别在于：第一个模型中使用了两个`二阶积分器`模块，而第二个模型中使用了四个一阶`积分器`模块。注意，在图
  1-3 所示的仿真结果中，输出信号名称显示在图例中。也就是说，这些名称是通过将连接到 `Mux` 模块的每个信号分别命名为 `y(t)`、`dy(t)`、`ddy(t)`、`dddy(t)`
  获得的。您可以通过右键单击并逐一重命名信号来重命名这些信号。来自 Simulink 模型 `Fourth_order_ODE.slx` 的仿真结果（图 5-3）与来自脚本
  `SOLVE_4order_ODE.m` 的 `ode45` 求解器输出（如图 5-1 所示）是一致的。


  ![../images/490522_1_En_5_Chapter/490522_1_En_5_Fig3_HTML.jpg](img/490522_1_En_5_Fig3_HTML.jpg)


  图 5-3：`Scope` 中显示的 Simulink 模型仿真结果


  从我们对高阶 ODE 的仿真可以看出，计算高阶 ODE 的数值解与二阶 ODE 类似，用于仿真高阶 ODE 的工具和函数与我们在求解一阶和二阶 ODE 时使用的相同。我们在高阶
  ODE 中遇到的唯一区别是，在脚本中将高阶 ODE 改写为一阶 ODE 时需要额外的步骤，并且在 Simulink 建模中需要额外的`积分器`模块。


  ## Robertson 问题


  Robertson 问题 [1] 描述了化学反应，并常被用作针对刚性初值问题 (IVP) 的 ODE 求解器的测试问题。它是用于耦合系统以及刚性 ODE 问题的一个很好的例子。Robertson
  问题由以下耦合的一阶微分方程组描述：


  ![$$ \left\{\begin{array}{c}{\dot{y}}_1=0.04\ {y}_1+{10}⁴{y}_2{y}_3\\ {}{\dot{y}}_2=0.04\
  {y}_1-{10}⁴{y}_2{y}_3-3\ast {10}⁷{y}_2\\ {}{\dot{y}}_3=3\ast {10}⁷{y}_2\end{array}\right.
  $$](img/490522_1_En_5_Chapter_TeX_Equb.png)


  其初始条件为 `y1(0) = 1`，`y2(0) = 0`，`y3(0) = 0`。


  这个问题可以相对容易地通过 Simulink 建模实现。图 5-4 显示了 Simulink 模型（`Robertson_problem.mdl`），图 5-5
  显示了仿真结果。


  ![../images/490522_1_En_5_Chapter/490522_1_En_5_Fig5_HTML.jpg](img/490522_1_En_5_Fig5_HTML.jpg)


  图 5-5：Robertson 问题的 Simulink 模型仿真结果（放大视图）


  ![../images/490522_1_En_5_Chapter/490522_1_En_5_Fig4_HTML.jpg](img/490522_1_En_5_Fig4_HTML.jpg)


  图 5-4：Simulink 中的 Robertson 问题模型（`Robertson_problem.mdl`）


  Robertson 问题是用于演示刚性 ODE 的一个很好的例子。其数值解是通过 Simulink 建模方法计算的，并且计算出的解被证明是相当稳定的。然而，为了评估所开发的
  Simulink 模型的精度和计算时间效率，需要使用其他方法（如 Milne 方法、Adams-Moulton 方法或改进的 Euler 方法）或内置的 ODEx
  求解器（如 `ode15`、`ode23s` 和 `ode113`）来开发其他数值仿真模型。




