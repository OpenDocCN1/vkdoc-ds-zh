  ![../images/490522_1_En_3_Chapter/490522_1_En_3_Fig14_HTML.jpg](img/490522_1_En_3_Fig14_HTML.jpg)


  **图 3-14** — 问题的 Simulink 模型：![$$ \frac{1}{2}\ddot{u}+\frac{2}{5}\dot{u}+u=t $$](img/490522_1_En_3_Chapter_TeX_IEq84.png)，![$$
  u(0)=1\ and\ \dot{u}(0)=2 $$](img/490522_1_En_3_Chapter_TeX_IEq85.png)


  对于图 3-14 所示的 Simulink 模型，`[Integrator1]`模块的内部初始条件值为 `2.0`，另一个模块的内部初始条件值为 `1.0`。执行该模型（图
  3-14）后，即可获得显示在`[Scope]`模块中的仿真结果。


