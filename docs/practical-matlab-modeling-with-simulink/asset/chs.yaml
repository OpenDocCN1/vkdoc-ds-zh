  \ `u(t) = sin(t)`。给定的初始条件为 ![$$ y(0)=1\\kern0.75em \\mathrm{and}\\kern0.5em \\dot{y}(0)=0\\\
  . $$](img/490522_1_En_12_Chapter_TeX_IEq6.png)\n\n1.  在 Simulink 中构建该问题的仿真模型，并使用函数块计算代数运算。使用\
