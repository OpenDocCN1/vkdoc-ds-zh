  \ sin(πt) + cos(πt) + t` 进行比较。在 MuPAD 笔记中计算其解析解，并构建所找到解析解的三维图。\n\n# 第三部分：常微分方程的应用\n\
  \n# 9. 弹簧-质量-阻尼系统\n\n本章介绍了如何在 MATLAB 和 Simulink 环境中构建弹簧-质量-阻尼系统仿真模型的几个关键方面和方法。推导了单自由度、两自由度、三自由度弹簧-质量-阻尼系统的运动方程，并基于推导的数学表达式构建了\
  \ MATLAB/Simulink 模型。研究了弹簧-质量-阻尼系统的自由运动和受迫运动，并考虑了其线性和非线性行为。所开发的单自由度、两自由度和三自由度系统仿真模型可应用于多自由度系统。\n\
  \n## 单自由度系统\n\n### 情况 1：自由振动（运动）\n\n考虑一个非线性类型的单自由度弹簧-质量-阻尼系统，其数学表达式为 `M·u'' + C·|u'|·u'\
  \ + K·u = 0`，`u(0) = 0`，`u'(0) = 1`，其中 `M` 是质量，`C` 是阻尼，`K` 是系统的刚度。注意，该系统方程是一个二阶齐次常微分方程，且没有施加外力。系统根据其初始条件进行振荡。换句话说，其响应取决于初始位移和速度值。\n\
  \n同样，在求解常微分方程的初值问题时，构建给定问题仿真模型的第一步是重写其运动方程。\n\n`u'' = -(C·|u'|·u' + K·u(t)) / M`\
  \ (9-1)\n\n如书中第一部分所述，通过引入一个新变量，可以将公式 (9-1) 所示的二阶常微分方程表示为以下两个微分方程，以便数值求解二阶常微分方程。\n\
  \n`u1' = u2`  \n`u2' = -(C·|u2|·u2 + K·u1) / M` (9-2)\n\n如果系统的质量远小于其刚度和阻尼，则给定的系统模型将属于刚性常微分方程类型，例如：`M\
  \ = 1 kg`，`C = 1001 N·s/m`，`K = 1000 N/m`。\n\n让我们基于公式 (9-2) 所示的第一个常微分方程组，在函数文件 (`SMDode.m`)\
  \ 中编写一个包含三个输入参数 (`M`, `C`, `K`) 的脚本。由于给定问题是刚性常微分方程类型，我们使用 ODE 求解器 `ode15s`。注意，我们还在公式\
  \ (9-2) 中将给定系统的雅可比矩阵作为嵌套函数 `function dfdu = Jacobian(t, u)` 引入。公式 (9-2) 所示的表达式编码在嵌套函数\
  \ `function dudt = f(t, u)` 中。定义雅可比矩阵可以加快 MATLAB ODE 求解器的仿真过程。\n\n\n```matlab\n\
  function  SMDode(Mass,Damping, Stiffness)\n%{\nSMDode.m. 弹簧-质量-阻尼系统行为分析\n给定质量、阻尼和刚度值。\n\
  注意：输入参数数据的顺序很重要。\n系统的阻尼器具有非线性特性，表示为\nD*|u'|*u'，例如 abs(速度)*速度\n采用求解器 ode15s；然而，其他求解器，即\n\
  ODE15S、ODE23S、ODE23T、ODE23TB，也可使用。\n%}\nif nargin < 1\n%  参数的一些默认值：质量、阻尼和刚度\n% \
  \ 以防用户未指定\nMass = 1;          % [kg]\nDamping=1001;      % [Ns/m]\nStiffness=1000;\
  \    % [N/m]\nend\ntspan = [0; min(20,5*(Damping/Mass))]; % 若干个周期\nu0 = [0; 1];\
  \                           % 初始条件\n% ODESETs 的选项可以关闭\noptions = odeset('Jacobian',@Jacobian);\n\
  % [t,u] = ode15s(@f,tspan,u0,[]); % 不使用选项\n[t,u] = ode15s(@f,tspan,u0,options);\n\
  figure;\nplot(t,u(:,1),'r-', t, u(:,2), 'b-.', 'MarkerSize', 5,...\n'LineWidth',\
  \ 1.5);\ntitle(['\\it 弹簧-质量-阻尼系统：',...\n'M = ' num2str(Mass), '[kg]' '; D = ' num2str(Damping),...\n\
  '[Ns/m]', '; S = ' num2str(Stiffness), '[N/m]']);\nxlabel('时间 t')\ngrid on\naxis\
  \ tight\naxis([tspan(1) tspan(end) -0.1 0.1]); % 设置坐标轴范围\nhold on\nAcceleration=-(Damping/Mass)*abs(u(:,2)).*u(:,2)-...\n\
  (Stiffness/Mass)*u(:,1);\nplot(t, Acceleration,'k--', 'MarkerSize', 3, 'LineWidth',\
  \ 1);\nlegend('位移', '速度', '加速度');\nylabel('位移、速度、加速度')\nhold off; xlim([0, 3])\n\
  % -----------------------------------------------------------\n% 嵌套函数：质量、阻尼和刚度由外部函数提供。\n\
  %------------------------------------------------------------\nfunction dudt = f(t,\
  \ u)\n% 导数函数。质量、阻尼和刚度由外部函数提供\n% 或采用默认值（示例值）\ndudt = [            u(2);\n-(Damping/Mass)*abs(u(2))*u(2)-(Stiffness/Mass)*u(1)\
  \ ];\nend\n% -----------------------------------------------------------\nfunction\
  \ dfdu = Jacobian(t, u)\n% 雅可比矩阵函数。质量、阻尼和刚度由\n% 主函数提供，若无输入则采用默认值。\ndfdu = [    \
  \     0,                  1;\n-(Stiffness/Mass),  -(Damping/Mass)*abs(u(2))-...\n\
  (Damping/Mass)*u(2)*sign(u(2)) ];\nend %\n% -----------------------------------------------------------\n\
  end  % SMDode.m\n```\n\n从图 9-1 绘制的仿真结果中可以清楚地看出，该系统是过阻尼的。在研究弹簧-质量-阻尼系统时，不仅要研究整体系统行为，还要研究其固有频率、阻尼水平（轻阻尼、欠阻尼和过阻尼情况）以及系统参数变化的影响，这些都很重要。所有这些研究都可以额外引入到系统的仿真模型中。\n\
  \n![../images/490522_1_En_9_Chapter/490522_1_En_9_Fig1_HTML.png](img/490522_1_En_9_Fig1_HTML.png)\n\
  \n**图 9-1** 弹簧-质量-阻尼系统仿真\n\n让我们重新考虑单自由度 SMD 系统之前的那个问题，以研究其在系统为线性，即不存在 ![$$ \\left|\\\
  dot{u}\\right| $$](img/490522_1_En_9_Chapter_TeX_IEq4.png) 的情况下的自由运动：![$$ M\\ddot{u}+C\\\
  dot{u}+ Ku=0 $$](img/490522_1_En_9_Chapter_TeX_IEq5.png)。通过除以 *M*（质量），可以将其重写，如下所示：\n\
  \n![$$ \\ddot{u}+\\frac{C}{M}\\dot{u}+\\frac{K}{M}u=0 $$](img/490522_1_En_9_Chapter_TeX_Equ3.png)\n\
  \n(9-3)\n\n在这个新的公式中，可以引入以下替换：\n\n![$$ \\frac{K}{M}={\\omega}_n²;\\frac{C}{M}=2\\\
  zeta {\\omega}_n $$](img/490522_1_En_9_Chapter_TeX_Equ4.png)\n\n(9-4)\n\n其中 *ω*[*n*]\
  \ 是系统的固有频率，*ζ* 是阻尼比。\n\n问题公式可以再次重写如下：\n\n![$$ \\ddot{u}+2\\zeta {\\omega}_n\\dot{u}+{\\\
  omega}_n²u=0 $$](img/490522_1_En_9_Chapter_TeX_Equ5.png)\n\n(9-5)\n\n该方程具有以下形式的通解：\n\
  \n![$$ u(t)=A{e}^{r_1t}+B{e}^{r_2t} $$](img/490522_1_En_9_Chapter_TeX_Equ6.png)\n\
  \n(9-6)\n\n其中未知系数 *A* 和 *B* 根据初始条件 (![$$ u(0)={u}_0,\\dot{u}(0)={\\dot{u}}_0 $$](img/490522_1_En_9_Chapter_TeX_IEq6.png))\
  \ 使用以下通用方程计算得出：\n\n![$$ A=\\frac{u_0{r}_2-{\\dot{u}}_0}{r_2-{r}_1} $$](img/490522_1_En_9_Chapter_TeX_Equ7.png)\n\
  \n(9-7)\n\n![$$ B=\\frac{{\\dot{u}}_0-{u}_0{r}_1}{r_2-{r}_1} $$](img/490522_1_En_9_Chapter_TeX_Equ8.png)\n\
  \n(9-8)\n\n将通解代入给定的问题公式方程 (9-5) 中，我们得到以下特征方程：\n\n![$$ {r}²+2\\zeta {\\omega}_n\\\
  \ r+{\\omega}_n²=0 $$](img/490522_1_En_9_Chapter_TeX_Equ9.png)\n\n(9-9)\n\n该二次特征方程的根（根\
  \ *r*[1] 和 *r*[2]）如下：\n\n![$$ {r}_{1,\\kern0.5em 2}=\\Big(-2\\zeta {\\omega}_n\\\
  pm \\left.\\sqrt{{\\left(2\\zeta {\\omega}_n\\right)}²-4{\\omega}_n²}\\right)/4{\\\
  omega}_n² $$](img/490522_1_En_9_Chapter_TeX_Equ10.png)\n\n(9-10)\n\n根（*r*[1] 和 *r*[2]）取决于参数，即\
  \ *ω*[*n*] 和 *ζ*。让我们看看四种情况 [1, 2] 来计算它们。\n\n**情况一：无阻尼。** *ζ* = 0。问题公式如下：\n\n![$$\
  \ \\ddot{u}+{\\omega}_n²\\ u=0 $$](img/490522_1_En_9_Chapter_TeX_IEq7.png), ![$$\
  \ u(0)={u}_0,\\kern0.5em \\dot{u}(0)={\\dot{u}}_0 $$](img/490522_1_En_9_Chapter_TeX_IEq8.png)\
  \ (9-11)\n\n方程 (9-11) 中微分方程的解是 *r*[1] = *i ω*[*n*]; *r*[2] = − *i ω*[*n*]，并且真实系统情况的解适用于：*M*\
  \ > 0 且 *K* > 0。\n\n解如下：\n\n![$$ u(t)={u}_0\\cos \\left(\\ {\\omega}_nt\\right)+\\\
  frac{{\\dot{u}}_0}{\\ {\\omega}_n}\\sin \\left(\\ {\\omega}_nt\\right) $$](img/490522_1_En_9_Chapter_TeX_Equ11.png)\n\
  \n(9-12)\n\n注意，这个解是通过一些替换得到的，例如我们在前面章节中使用过的欧拉公式（*e*^(*iθ*) = cos *θ* + *i* sin *θ*）以及前面方程\
  \ (9-6) 中所示的通解公式。\n\n解的另一形式如下：\n\n![$$ u(t)=\\left(\\sqrt{u_0²+\\frac{{\\dot{u}}_0²}{\\\
  omega_n²}}\\right)\\sin \\left({\\omega}_nt+\\varphi \\right) $$](img/490522_1_En_9_Chapter_TeX_Equ12.png)\n\
  \n(9-13)\n\n![$$ \\varphi ={\\tan}^{-1}\\left(\\frac{\\omega_n{u}_0}{{\\dot{u}}_0}\\\
  right) $$](img/490522_1_En_9_Chapter_TeX_Equ13.png)\n\n(9-14)\n\n其中 *φ* 是相移角。注意，方程\
  \ (9-12) 和 (9-13) 中显示的两种解的形式是等价的，并且可以相互推导。\n\n**情况二：欠阻尼。** 0 < *c*² < 4 *MK* 或 0\
  \ < *ζ* < 1。方程 (9-6) 中通解的根如下：\n\n![$$ {r}_1=\\left[-\\zeta +i\\sqrt{\\left(1-{\\\
  zeta}²\\right)}\\right]{\\omega}_n $$](images/490522_1_En_9_Chapter/490522_1_En_9_Chapter_TeX_Equ14.png)\n\
  \n(9-15)\n\n![$$ {r}_2=\\left[-\\zeta -i\\sqrt{\\left(1-{\\zeta}²\\right)}\\right]{\\\
  omega}_n $$](images/490522_1_En_9_Chapter/490522_1_En_9_Chapter_TeX_IEq9.png) (9-16)\n\
  \n存在阻尼，系统的有阻尼固有频率将为：\n\n![$$ {\\omega}_d={\\omega}_n\\sqrt{\\left(1-{\\zeta}²\\\
  right)} $$](img/490522_1_En_9_Chapter_TeX_Equ15.png)\n\n(9-17)\n\n因此，解如下：\n\n![$$\
  \ u(t)={e}^{-\\zeta {\\omega}_nt}\\ \\left({u}_o\\cos \\left({\\omega}_dt\\right)+\\\
  frac{u_0\\zeta {\\omega}_n+{\\dot{u}}_0}{\\omega_d}\\sin \\left({\\omega}_dt\\right)\\\
  right)\\kern5em \\left(9-18\\right) $$](img/490522_1_En_9_Chapter_TeX_Equa.png)\n\
  \n(9-18)\n\n\n### 案例三：过阻尼\n*ζ* > 1 (*c*² > 4*MK*)。式 (9-6) 所示通解方程的根如下：\n\n![$$ {r}_1=\\\
  left[-\\zeta -\\sqrt{\\left({\\zeta}²-1\\right)}\\right]{\\omega}_n $$](images/490522_1_En_9_Chapter/490522_1_En_9_Chapter_TeX_Equ16.png)\n\
  \n(9-19)\n\n![$$ {r}_2=\\left[-\\zeta +\\sqrt{\\left({\\zeta}²-1\\right)}\\right]{\\\
  omega}_n $$](images/490522_1_En_9_Chapter/490522_1_En_9_Chapter_TeX_Equ17.png)\n\
  \n(9-20)\n\n式 (9-6) 所示通解方程的系数如下：\n\n![$$ A={u}_0\\left[\\frac{\\zeta }{2\\sqrt{\\\
  zeta²-1}}\\right]-\\frac{{\\dot{u}}_0}{2{\\omega}_n\\sqrt{\\zeta²-1}} $$](images/490522_1_En_9_Chapter/490522_1_En_9_Chapter_TeX_Equ18.png)\n\
  \n(9-21)\n\n![$$ B={u}_0\\left[\\frac{\\zeta }{2\\sqrt{\\zeta²-1}}\\right]+\\frac{{\\\
  dot{u}}_0}{2{\\omega}_n\\sqrt{\\zeta²-1}} $$](images/490522_1_En_9_Chapter/490522_1_En_9_Chapter_TeX_Equ19.png)\n\
  \n(9-22)\n\n最终，解方程如下：\n\n![$$ u(t)=A{e}^{r_1t}+B{e}^{r_2t}=\\left[{u}_0\\left[\\\
  frac{\\zeta }{2\\sqrt{\\zeta²-1}}\\right]+\\frac{{\\dot{u}}_0}{2{\\omega}_n\\sqrt{\\\
  zeta²-1}}\\right]{e}^{\\left[-\\zeta -\\sqrt{\\left({\\zeta}²-1\\right)}\\right]{\\\
  omega}_n}+\\left[-{u}_0\\left[\\frac{\\zeta }{2\\sqrt{\\zeta²-1}}\\right]+\\frac{{\\\
  dot{u}}_0}{2{\\omega}_n\\sqrt{\\zeta²-1}}\\right]{e}^{\\left[-\\zeta +\\sqrt{\\\
  left({\\zeta}²-1\\right)}\\right]{\\omega}_n} $$](images/490522_1_En_9_Chapter/490522_1_En_9_Chapter_TeX_Equ20.png)\n\
  \n(9-23)\n\n### 案例四：临界阻尼\n*ζ* = 1 (*临界阻尼*)，*c*² = 4*MK*。式 (9-6) 所示通解方程的根如下：\n\n\
  ![$$ {r}_1={r}_2=-{\\omega}_n $$](img/490522_1_En_9_Chapter_TeX_Equ21.png)\n\n(9-24)\n\
  \n式 (9-6) 所示通解方程的系数如下：\n\n![$$ A={u}_0,B={\\dot{u}}_0+{\\omega}_n{u}_0 $$](img/490522_1_En_9_Chapter_TeX_Equ22.png)\n\
  \n(9-25)\n\n解方程由两个线性无关的解组成。\n\n![$$ u(t)=\\left(A+ Bt\\right){e}^{-{\\omega}_nt}\
  \ $$](img/490522_1_En_9_Chapter_TeX_Equ23.png)\n\n(9-26)\n\n此处我们跳过了推导四种案例场景解的一些细节。关于从式\
  \ (9-7) 到 (9-26) 所示推导公式的一些必要细节，可参见文献 [3]。\n\n前几种案例场景的完整仿真模型可以使用嵌套函数进行编程。`Out=SMDsysSim(M,\
  \ D, S, ICs, t)` 嵌入在 m 文件 `SMDsysSIM_compare.m` 中，该函数基于五个输入参数（即 `M`、`D`、`S`、`ICs`、`t`）模拟所有四种场景。这些输入参数分别是：质量\
  \ (`M`)、阻尼 (`D`)、刚度 (`S`)、初始条件 (`ICs`) 和时间向量 (`t`)。\n\n```\nclearvars; close all\n\
  % 场景 I - IV 的输入数据。\nM1=1; D1=0; S1=25;   % 场景 I. 无阻尼\nM2=1; D2=2; S2=25;   % 场景\
  \ II. 欠阻尼\nM3=1; D3=13; S3=25;  % 场景 III. 过阻尼\nM4=1; D4=10; S4=25;  % 场景 IV. 临界阻尼\n\
  ICs=[0.1, 0]; t=0:.05:5;\n% 位移：\nut1=SMDsysSim(M1, D1, S1, ICs, t);\nut2=SMDsysSim(M2,\
  \ D2, S2, ICs, t);\nut3=SMDsysSim(M3, D3, S3, ICs, t);\nut4=SMDsysSim(M4, D4, S4,\
  \ ICs, t);\n% 速度：\ndut1=diff(ut1);\ndut2=diff(ut2);\ndut3=diff(ut3);\ndut4=diff(ut4);\n\
  figure(1)\nplot(t, ut1, 'b-',  'linewidth', 1.5), hold on\nplot(t, ut2, 'r-.', 'linewidth',\
  \ 1.5)\nplot(t, ut3, 'k:',  'linewidth', 2)\nplot(t, ut4, 'g--', 'linewidth', 1.5)\n\
  xlabel('时间, [s]'); ylabel('系统响应, [m]'), grid on,\ntitle('1-DOF 弹簧-质量-阻尼系统仿真 - 4\
  \ 种场景'),\nlegend('无阻尼: \\zeta=0',' 欠阻尼: 0<\\zeta<1','过阻尼: \\zeta>1','临界阻尼: \\zeta=1'),\
  \ hold off\nfigure(2)\nplot(ut1(2:end), dut1, 'b-',  'linewidth', 1.5),\nhold on\n\
  plot(ut2(2:end), dut2, 'r-.','linewidth', 1.5)\nplot(ut3(2:end), dut3, 'k:', 'linewidth',\
  \ 2)\nplot(ut4(2:end), dut4, 'g--',  'linewidth', 1.5)\nxlabel('时间, [s]');\nylabel('系统响应,\
  \ [m]')\ngrid on, title('相图：位移 vs. 速度')\nlegend('无阻尼: \\zeta=0',' 欠阻尼: 0<\\zeta<1','过阻尼:\
  \ \\zeta>1','临界阻尼: \\zeta=1')\nxlim([-.1 .1]), ylim([-.025 .025]), axis square\n\
  hold off; shg\nfunction Out=SMDsysSim(M, D, S, ICs, t)\n% 帮助。1-DOF SMD 系统的仿真模型。\n\
  omegaN = sqrt(S/M);\nksi = 0.5*(D/M)*(1/omegaN);\nu0=ICs(1);\ndu0=ICs(2);\nif ksi==0\
  \               % 场景 I. 无阻尼\nOut=u0*cos(omegaN*t)+(du0/omegaN)*sin(omegaN*t);\n\
  elseif ksi>0 && ksi<1    % 场景 II. 欠阻尼\nOut=(u0*cos(omegaN*sqrt(1-ksi²)*t)+(du0+ksi*omegaN*u0)/(omegaN*sqrt(1-ksi²))*sin(omegaN*sqrt(1-ksi²)*t)).*exp(-ksi*omegaN*t);\n\
  elseif ksi>1            % 场景 III. 过阻尼\nr1=(-ksi-sqrt(ksi²-1))*omegaN;\nr2=(-ksi+sqrt(ksi²-1))*omegaN;\n\
  A=(-du0+(-ksi+(sqrt(ksi²-1)))*u0*omegaN)/(2*omegaN*sqrt(ksi²-1));\nB=(du0+(ksi+(sqrt(ksi²-1)))*u0*omegaN)/(2*omegaN*sqrt(ksi²-1));\n\
  Out=(A*exp(r1*t)+B*exp(r2*t));\nelse  %ksi==1          % 场景 IV. 临界阻尼\nr1=-omegaN;\n\
  A=u0;\nB=du0+omegaN*u0;\nOut=(A+B*t).*exp(r1*t);\nend\nend\n```\n\n该仿真模型的仿真结果展示了阻尼比\
  \ *ζ*（图 9-2 和图 9-3）对系统行为的影响。例如，当 *ζ* 小于临界阻尼值（欠阻尼情况）时，会导致系统响应衰减（阻尼），但衰减率将呈指数形式，具体取决于\
  \ *ζ* 的值。如果不存在阻尼，则系统响应会以其固有频率 *ω*[*n*] 振动。相反，在过阻尼和临界阻尼情况下，系统响应不会振荡。\n\n![../images/490522_1_En_9_Chapter/490522_1_En_9_Fig3_HTML.png](img/490522_1_En_9_Fig3_HTML.png)\n\
  \n**图 9-3** – 单自由度弹簧-质量-阻尼系统四种场景的相图\n\n![../images/490522_1_En_9_Chapter/490522_1_En_9_Fig2_HTML.png](img/490522_1_En_9_Fig2_HTML.png)\n\
  \n**图 9-2** – 四种不同场景下单自由度弹簧-质量-阻尼系统的仿真\n\n此外，我们可以研究初始条件对系统响应 `u(t)` 的影响，以了解系统需要多长时间才能完全停止。现在，通过修改之前的脚本\
  \ `SMDsysSIM_compare.m`，我们可以编写另一个仿真模型 `SMDsysSIM_compare_ICs.m`，该模型模拟三种场景：欠阻尼、临界阻尼和过阻尼，并采用三种不同的初始条件。\n\
  \n\n\n```\n%% 研究初始条件的影响\nclearvars; close all\n% 输入数据：\nM=1; D=5; S=25; t=0:.05:2.5;\n\
  % 三种不同情况下的初始条件：\nICs1=[0.1, 0];\nICs2=[0.1, 1];\nICs3=[0.1, -1];\n% 位移：\nut1=SMDsysSim(M,\
  \ D, S, ICs1, t);\nut2=SMDsysSim(M, D, S, ICs2, t);\nut3=SMDsysSim(M, D, S, ICs3,\
  \ t);\nfigure, subplot(311)\nplot(t, ut1, 'b-', 'linewidth', 1.5), hold on\nplot(t,\
  \ ut2, 'r--', 'linewidth', 2),\nplot(t, ut3, 'k:', 'linewidth', 2), grid on\nlegend('u_0=0.1,\
  \ du_0=0','u_0=0.1, du_0=1','u_0= 0.1, du_0= -1')\nylabel(' u(t), [m]')\ngtext({'\
  \ \\zeta 1'}, 'fontsize', 13), hold off, axis tight\nfunction Out=SMDsysSim(M, D,\
  \ S, ICs, t)\n% 帮助：单自由度 SMD 系统的仿真模型。\n% Out=SMDsysSim(M, D, S, ICs, t)\nomegaN =\
  \ sqrt(S/M);\nksi = 0.5*(D/M)*(1/omegaN);\nu0=ICs(1);\ndu0=ICs(2);\nif ksi==0  \
  \             % 场景 I: 无阻尼\nOut=u0*cos(omegaN*t)+(du0/omegaN)*sin(omegaN*t);\nelseif\
  \ ksi>0 && ksi1            % 场景 III: 过阻尼\nr1=(-ksi-sqrt(ksi²-1))*omegaN;\nr2=(-ksi+sqrt(ksi²-1))*omegaN;\n\
  A=(-du0+(-ksi+(sqrt(ksi²-1)))*u0*omegaN)/(2*omegaN*sqrt(ksi²-1));\nB=(du0+(ksi+(sqrt(ksi²-1)))*u0*omegaN)/(2*omegaN*sqrt(ksi²-1));\n\
  Out=(A*exp(r1*t)+B*exp(r2*t));\nelse  %ksi==1          % 场景 IV: 临界阻尼\nr1=-omegaN;\n\
  A=u0;\nB=du0+omegaN*u0;\nOut=(A+B*t).*exp(r1*t);\nend\nend\n```\n\n如图 9-4 所示，针对三个不同`ζ`值的仿真结果表明，如果系统中存在显著阻尼，则系统的自由运动会随时间衰减。然而，自由运动的整个衰减（消亡）时间取决于初始条件，即初始激励值（系统的位移和速度）。先前讨论的针对单自由度系统自由振动（运动）的仿真模型方法，经过一些调整后，也可应用于多自由度（线性）系统的自由振动仿真。\n\
  \n![../images/490522_1_En_9_Chapter/490522_1_En_9_Fig4_HTML.png](img/490522_1_En_9_Fig4_HTML.png)\n\
  \n**图 9-4** 研究系统初始条件对其响应的影响\n\n## 案例 2：受迫振动（运动）\n\n现在我们考虑单自由度 SMD 系统受到如图 9-5 所示的矩形周期性波力激励的情况。\n\
  \n![../images/490522_1_En_9_Chapter/490522_1_En_9_Fig5_HTML.jpg](img/490522_1_En_9_Fig5_HTML.jpg)\n\
  \n**图 9-5** 受周期性波力激励的弹簧-质量-阻尼系统\n\n系统的运动方程如下：\n\n![$$ \\frac{md²y}{d{t}²}+\\frac{Cdy}{dt}+\
  \ Ky=F(t) $$](img/490522_1_En_9_Chapter_TeX_Equ24.png)\n\n(9-27)\n\n其中，外力`F(t)`是一个周期性波函数，可通过如下傅里叶级数近似表示：\n\
  \n![$$ F(t)=\\sum \\limits_{n=1}^{\\infty}\\left(1-\\cos n\\pi \\right)\\sin \\\
  left( n\\pi t\\right)=\\frac{400}{\\pi}\\sin \\left(\\pi t\\right)-\\frac{400}{3\\\
  pi}\\sin \\left(3\\pi t\\right)+\\frac{80}{\\pi}\\sin \\left(5\\pi t\\right)-\\\
  dots \\kern2.25em \\left(9-28\\right) $$](img/490522_1_En_9_Chapter_TeX_Equb.png)\n\
  \n(9-28)\n\n现在，方程(9-27)中系统模型的最终公式如下：\n\n![$$ \\frac{md²y}{d{t}²}+\\frac{Cdy}{dt}+\
  \ Ky=\\frac{400}{\\pi}\\sin \\left(\\pi t\\right)-\\frac{400}{3\\pi}\\sin \\left(3\\\
  pi t\\right)+\\frac{80}{\\pi}\\sin \\left(5\\pi t\\right)-\\dots $$](img/490522_1_En_9_Chapter_TeX_Equ25.png)\n\
  \n(9-29)\n\n**第一个仿真模型。** 使用方程(9-29)，我们创建一个包含 MATLAB 脚本的仿真模型。方程(9-28)中的周期性波函数公式可以表示为名为`F=func_pulse(t,\
  \ n)`的函数。\n\n```\nfunction F=func_pulse(t, n)\n%帮助：t 为时间向量。n 为脉冲逼近中的项数。\nF(1,:)=(200/pi)*(1-cos(pi))*sin(pi*t);\n\
  for ii=2:n\nF(:,:)=F(:,:)+(200/(ii*pi))*(1-cos(ii*pi))*sin(ii*pi*t);\nend\n```\n\
  \n我们将二阶常微分方程（即方程(9-29)的左侧部分）通过匿名函数句柄`DDx`表示，并将力函数`F=func_pulse(t, n)`嵌入一个名为`Sim_func_pulse.m`的\
  \ m 文件中，并使用`ode45`求解器。这将模拟系统行为并绘制仿真结果。注意，在此仿真模型中，采用了零初始条件。模型的仿真结果如图 9-6 和图 9-7 所示。\n\
  \n```\n% F = func_pulse(t, n) 生成周期性矩形脉冲。\n% DDx = @(t, x) 匿名函数句柄。\nclearvars; close\
  \ all\nM = 10; C = 0.5; K = 1000; % 系统参数\nt=0:pi/1000:13;          % 时间\nn=113;\
  \                   % 傅里叶级数的项数\nICs=[0,0];               % 初始条件\nF=func_pulse(t,\
  \ n);      % 傅里叶级数值\n% 系统模型方程由两个一阶常微分方程表示\nDDx=@(t,x)([x(2); (1/10)*(func_pulse(t,n)-C*x(2)-K*x(1))]);\n\
  opts_ODE=odeset('RelTol', 1e-6, 'AbsTol', 1e-8);\n[time, Xt]=ode45(DDx, t, ICs,\
  \ opts_ODE);\nsubplot(211)\nyyaxis left\nplot(t, F, 'k-');\nylabel('输入 F(t), [N]')\n\
  yyaxis right\nplot(t, Xt(:,1), 'r--')\nylabel('输出 x(t), [m]')\nlegend('F(t) 输入',\
  \ 'x(t) 输出'), grid on\ntitle(['\\it 受周期性脉冲力激励的 ',...\n'SMD 系统'])\naxis tight\nsubplot(212)\n\
  yyaxis left\nplot(t,Xt(:,1),'k-')\nylabel('位移 x(t), [m]')\nyyaxis right\nplot(t,\
  \ Xt(:,2),'b-.','linewidth', 1.5)\nlegend('x(t)','dx(t)')\nylabel('速度 dx(t), [m/s]')\n\
  xlabel('时间 [秒]'), grid on, axis tight\nfigure\nplot(Xt(:,1), Xt(:,2)),\nxlabel('x(t)'),\
  \ ylabel('dx(t)')\ntitle('相图；x 与 dx'), grid on\naxis square\nfunction F=func_pulse(t,n)\n\
  %帮助：t 为时间向量。n 为脉冲逼近中的项数。\nF(1,:)=(200/pi)*(1-cos(pi))*sin(pi*t);\nfor ii=2:n\nF(:,:)=F(:,:)+(200/(ii*pi))*(1-cos(ii*pi))*sin(ii*pi*t);\n\
  end\nend\n```\n\n现在，我们采用 Simulink 建模方法来模拟系统行为。\n\n![../images/490522_1_En_9_Chapter/490522_1_En_9_Fig6_HTML.png](img/490522_1_En_9_Fig6_HTML.png)\n\
  \n**图 9-6** 受周期性脉冲力激励的弹簧-质量-阻尼系统仿真\n```\n\n\n![../images/490522_1_En_9_Chapter/490522_1_En_9_Fig7_HTML.png](img/490522_1_En_9_Fig7_HTML.png)\n\
  \n**图 9-7**  \n相图：受周期矩形波力激励的弹簧-质量-阻尼系统的位移与速度关系\n\n第二个仿真模型在 Simulink 中构建。在 Simulink\
  \ 中，有若干模块可用于生成周期脉冲信号（关于如何构建 Simulink 模型的更多细节，请参见[4]）。这些模块包括信号发生器、脉冲发生器、阶跃函数序列、信号构建器以及重复序列。`Pulses__Input.mdl`（如图\
  \ 9-8 所示）是受外力（即重复脉冲）作用的弹簧-质量-阻尼系统的最终模型。\n\n![../images/490522_1_En_9_Chapter/490522_1_En_9_Fig8_HTML.jpg](img/490522_1_En_9_Fig8_HTML.jpg)\n\
  \n**图 9-8**  \n受脉冲外力作用的弹簧-质量系统的 Simulink 模型 (`Pulses__Input.mdl`)\n\n图 9-8 所示 Simulink\
  \ 模型 (`Pulses__Input.mdl`) 的仿真结果（输入信号与系统响应、Plots–Scope 模块中的位移与速度、Phase Plot 模块中的位移与速度）与来自\
  \ m 文件 `Sim_func_pulse.m` 的图 9-6 和图 9-7 中的结果高度吻合。从名为 [Plots] 的 Scope 模块和名为 [Phase\
  \ Plot] 的 XY Scope 模块获得的仿真结果在此未显示。如图 [Phase Plot] 所示，XY Scope 模块的 x-y 轴范围设置为 `[-0.8\
  \ 0.8 -8 8]`。请注意，[Signal Generator] 模块的参数如下：\n\n*   输出各种波形：`Y(t) = Amp*Waveform(Freq,\
  \ t)`\n*   波形：方波\n*   时间 (t)：使用仿真时间\n*   幅值：-100\n*   频率：0.5\n*   单位：赫兹\n\n模型 (`Pulses__Input.mdl`)\
  \ 中其他增益参数 `M`、`C` 和 `K` 的值分别为 10、0.5 和 1000。\n\n让我们考虑另一个案例：一个单自由度弹簧-质量-阻尼系统在 `F(t)\
  \ = F[0] cos (ωt)` 作用下的正弦周期强迫运动。\n\n方程 (9-27)，即 ![$$ \\frac{md²y}{d{t}²}+\\frac{Cdy}{dt}+\
  \ Ky=F(t) $$](img/490522_1_En_9_Chapter_TeX_IEq10.png)，其通解如下所示：\n\n![$$ x(t)=A{e}^{-\\\
  zeta {\\omega}_nt}\\sin \\left({\\omega}_dt+\\varphi \\right)+X\\ \\cos \\left(\\\
  omega t-\\theta \\right) $$](img/490522_1_En_9_Chapter_TeX_Equ26.png)\n\n(9-30)\n\
  \n其中 `ω` 是作用力的频率，`φ` 是相移。常数 `A` 和 `X` 由初始条件计算得出 [1, 2, 3]。\n\n![$$ A=\\frac{x_0-X\\\
  cos \\theta }{\\sin \\varphi } $$](img/490522_1_En_9_Chapter_TeX_Equ27.png)\n\n\
  (9-31)\n\n![$$ X=\\frac{f_0}{\\sqrt{{\\left({\\omega}_n²-{\\omega}²\\right)}²+{\\\
  left(2\\zeta {\\omega}_n\\omega \\right)}²}} $$](img/490522_1_En_9_Chapter_TeX_Equ28.png)\n\
  \n(9-32)\n\n式中 ![$$ {f}_0=\\frac{F_0}{m} $$](img/490522_1_En_9_Chapter_TeX_IEq11.png)\
  \ 是归一化的力幅值。相位 `θ` 由以下公式计算得出：\n\n![$$ \\theta ={\\tan}^{-1}\\frac{2\\zeta {\\omega}_n\\\
  omega }{\\omega_n²-{\\omega}²} $$](img/490522_1_En_9_Chapter_TeX_Equ29.png)\n\n\
  (9-33)\n\n上述关于幅值 `X` 和相位 `θ` 的公式在一般实践中具有非常重要的意义。瞬态响应 ![$$ {x}_t(t)=A{e}^{-\\zeta\
  \ {\\omega}_nt}\\sin \\left({\\omega}_dt+\\varphi \\right) $$](img/490522_1_En_9_Chapter_TeX_IEq12.png)\
  \ 作为通解的一部分，其幅值相对较小，对响应的影响远小于稳态响应幅值。因此，在实践中，我们主要处理解的稳态响应部分，即 `x(t) = X cos (ωt −\
  \ θ)`。\n\n根据 `X` 和 `θ` 的公式，通过提取 `ω²` 因子，将幅值除以 ![$$ \\frac{F_0}{m} $$](img/490522_1_En_9_Chapter_TeX_IEq13.png)\
  \ 或 `f[0]`，并代入 ![$$ r=\\frac{\\omega }{\\omega_n}, $$](img/490522_1_En_9_Chapter_TeX_IEq14.png)，可以得到系统响应归一化幅值和相位的以下表达式：\n\
  \n![$$ \\frac{XK}{F_0}=\\frac{X{\\omega}_n²}{f_0}=\\frac{1}{\\sqrt{{\\left(1-{r}²\\\
  right)}²+{\\left(2\\zeta r\\right)}²}} $$](img/490522_1_En_9_Chapter_TeX_Equ30.png)\n\
  \n(9-34)\n\n![$$ \\theta ={\\tan}^{-1}\\frac{2\\zeta r}{1-{r}²} $$](img/490522_1_En_9_Chapter_TeX_Equ31.png)\n\
  \n(9-35)\n\n这些公式通过以下脚本 (`zeta_1DOF_SMD.m`) 进行仿真：\n\n```\nfunction zeta_1DOF_SMD(M,\
  \ zeta, S, omega)\n% 帮助。研究阻尼比 (zeta) 对幅值变化的影响\n% M - 系统质量\n% zeta - 阻尼比\n% S - 系统刚度\n\
  % omega - 频率\nif nargin.xsh+od+*^v';\nfor m=1:length(zeta)\nStylo    = [Colorit(m)\
  \ Lineit(m) Markit(m)];\nLabelit{m} = ['\\zeta= ' num2str(zeta(m))];\nsemilogy(r,\
  \ Mag(m,:), Stylo, 'linewidth', 1.5), hold on\nend\nlegend(Labelit{:}); axis tight;\
  \ grid on; ylim([0, 5])\ntitle('\\zeta influence on Response Amplitude change')\n\
  xlabel('r = \\omega/\\omega_n'), ylabel('\\it Normalized Amplitude'),\nhold off\n\
  figure\nfor m=1:length(zeta)\nStylo    = [Colorit(m) Lineit(m) Markit(m)];\nLabelit{m}\
  \ = ['\\zeta= ' num2str(zeta(m))];\nplot(r, Theta(m,:), Stylo, 'linewidth', 1.5)\n\
  hold on\nend\nlegend(Labelit{:}, 'location', 'northwest')\naxis tight, grid on;\n\
  axis([0, 2 -.2 3.35])\ntitle('\\zeta  effects on Phase changes')\nxlabel('r = \\\
  omega/\\omega_n ')\nylabel('Phase, \\theta(r)')\n```\n\n再次强调，在我们对阻尼比 (`ζ`) 与归一化系统幅值（图\
  \ 9-9）及相移（图 9-10）的仿真研究中，我们可以得出结论：当系统固有频率等于周期激励力的激励频率时，会出现共振峰值，这与理论评估预期一致，并且系统行为将变得不可控。为避免这种情况，我们需要施加阻尼。请注意，在脚本中，使用了\
  \ `atan2` 函数来计算相位角 `θ(r)` 的值，因为该函数可在 [0, `π`] 范围内计算 `θ(r)` 的值，而 `tan` 函数在 ![$$ \\\
  left[-\\frac{\\pi }{2},\\frac{\\pi }{2}\\right] $$](images/490522_1_En_9_Chapter/490522_1_En_9_Chapter_TeX_IEq15.png)\
  \ 范围内计算，在这种情况下不适用。\n\n![../images/490522_1_En_9_Chapter/490522_1_En_9_Fig10_HTML.png](img/490522_1_En_9_Fig10_HTML.png)\n\
  \n**图 9-10**  \n阻尼比 (`ζ`) 对系统相位 `θ` 变化的影响\n\n![../images/490522_1_En_9_Chapter/490522_1_En_9_Fig9_HTML.png](img/490522_1_En_9_Fig9_HTML.png)\n\
  \n**图 9-9**  \n阻尼比 (`ζ`) 对归一化系统响应幅值的影响\n\n\n\n"
- "# 二自由度系统\n\n许多机械系统的运动都是通过将其建模为 SMD（弹簧-质量-阻尼）系统来研究的。让我们考虑图 9-11 所示的受外力的二自由度 SMD\
  \ 系统。请注意，质量块 1 和质量块 2 下的摩擦力被视为线性的。\n\n![../images/490522_1_En_9_Chapter/490522_1_En_9_Fig11_HTML.png](img/490522_1_En_9_Fig11_HTML.png)\n\
  \n图 9-11\n\n受外部脉冲力 *F*(*t*) 作用的双质量弹簧-质量-阻尼系统\n\n在我们开始推导系统方程之前，图 9-12 展示了所给系统的另一种等效物理模型，该模型通过将作用于质量块\
  \ 1 和 2 下的摩擦阻尼替换为施加在每个质量块上的阻尼器来实现。\n\n![../images/490522_1_En_9_Chapter/490522_1_En_9_Fig12_HTML.png](img/490522_1_En_9_Fig12_HTML.png)\n\
  \n图 9-12\n\na) 系统的另一种物理模型；b) 质量块 1、2 的受力图\n\n利用系统的受力图，并对每个质量块上的作用力应用达朗贝尔原理，我们可以写出系统的运动方程。\n\
  \n对于质量块 1：\n\n![$$ F(t)={m}_1{\\ddot{x}}_1+\\left({c}_1+{c}_2\\right){\\dot{x}}_1-{c}_2{\\\
  dot{x}}_2+{k}_1{x}_1-{k}_1{x}_2 $$](img/490522_1_En_9_Chapter_TeX_Equ32.png)\n\n\
  (9-36)\n\n对于质量块 2：\n\n![$$ 0={m}_2{\\ddot{x}}_2+\\left({c}_2+{c}_3\\right){\\dot{x}}_2+\\\
  left({k}_1+{k}_2\\right){x}_2-{c}_2{\\dot{x}}_1-{k}_1{x}_1 $$](img/490522_1_En_9_Chapter_TeX_Equ33.png)\n\
  \n(9-37)\n\n请注意，`m`[1]、`m`[2]、`c`[1]、`c`[2]、`c`[3]、`k`[1]、`k`[2] 分别是质量、阻尼和刚度的系统参数。`x`[1]\
  \ 和 `x`[2] 分别是质量块 1 和 2 的位移，并且 ![$$ {\\dot{x}}_1,{\\dot{x}}_2,{\\ddot{x}}_1,{\\\
  ddot{x}}_2 $$](img/490522_1_En_9_Chapter_TeX_IEq16.png) 分别是质量块 1 和质量块 2 的速度和加速度。\n\
  \n通过引入新的状态变量，我们将方程 (9-36) 和 (9-37) 重写为一阶常微分方程组。为避免混淆，将变量重命名为 `x`[1] = `y`[1] 和 `x`[2]\
  \ = `y`[2]。\n\n![$$ \\left\\{\\begin{array}{c}{\\dot{x}}_1={y}_2\\\\ {}\\begin{array}{c}{\\\
  dot{y}}_2=\\frac{1}{m_1}\\left[F(t)-\\left({c}_1+{c}_2\\right){y}_2+{c}_2{y}_4-{k}_1{y}_1+{k}_1{y}_3\\\
  right]\\\\ {}{\\dot{x}}_2={y}_4\\\\ {}{\\dot{y}}_4=\\frac{1}{m_2}\\left[{c}_2{y}_2-\\\
  left({c}_2+{c}_3\\right){y}_4+{k}_1{y}_1-\\left({k}_1+{k}_2\\right){y}_3\\right]\\\
  end{array}\\end{array}\\right. $$](images/490522_1_En_9_Chapter/490522_1_En_9_Chapter_TeX_Equ34.png)\n\
  \n(9-38)\n\n基于方程(9-38)中定义的系统模型，针对施加外 *F*(*t*) = *F*[0] sin (10*t*) 的情况，我们编写了名为 `SMsysSIM.m`\
  \ 和 `two_DOF_sys_sim_ALL.m` 的 MATLAB 模型，并构建了一个名为 `Two_DOF_SMsys.mdl` 的 Simulink\
  \ 模型。\n\n```\nfunction SMsysSIM(t, ICs)\n% SMsysSIM.m\n% t 是时间；ICs 是初始条件。\nif nargin<1\n\
  % 如果未提供输入参数和初始条件，则\nt=[0,5]; ICs=[1; 1.5; -1; 1];\nOPTs=odeset('OutputFcn', @odeplot,'reltol',\
  \ 1e-4,'abstol',1e-6);\node45(@SMsys1,t, ICs, OPTs)\nelse\nOpts=odeset('OutputFcn',\
  \ @odeplot,'reltol', 1e-4,'abstol',1e-6);\node45(@SMsys1,t, ICs, Opts)\nend\nfunction\
  \ DX=SMsys1(t, y)\nk1=90; k2=85; c1=2; c2=1; c3=3; m1=5; m2=3; F0=3.3;\nDx(1)= y(2);\n\
  Dx(2)=(1/m1)*(F0*sin(10*t)-(c1+c2)*y(2)+c2*y(4)-k1*y(1)+k1*y(3));\nDx(3)= y(4);\n\
  Dx(4)= (1/m2)*(c2*y(2)-(c2+c3)*y(4)+k1*y(1)-(k1+k2)*y(3));\nDX=[Dx(1); Dx(2); Dx(3);\
  \ Dx(4)];\nend\nend\n```\n\n此函数文件 (`SMsysSIM.m`) 计算质量块 1 和 2 的位移和速度值，并在不包含图形属性（如图标题、图例等）的单个图中进行绘制。\n\
  \n接下来的 m 文件 (`two_DOF_sys_sim_ALL.m`) 使用 ODE 求解器（`ode23`、`ode23s`、`ode23tb` 和 `ode113`）和\
  \ Simulink 模型 (`Two_DOF_SMsys.mdl`) 计算质量块 1 和 2 的位移和速度值，并分别绘制带有所有图形属性的图形，如图 9-14、图\
  \ 9-15 和图 9-16 所示。\n\n```\n% two_DOF_sys_sim_ALL.m\nclearvars; close all\nICs=[1;\
  \ 1.5; -1; 1];\nk1=90; k2=85; c1=2; c2=1; c3=3; m1=5; m2=3; F0=3.3;\nF=@(t, y)[y(2);(1/m1)*(F0*sin(10*t)-(c1+c2)*y(2)+c2*y(4)-\
  \ ...\nk1*y(1)+k1*y(3)); y(4); ...\n(1/m2)*(c2*y(2)-(c2+c3)*y(4)+k1*y(1)-(k1+k2)*y(3))];\n\
  t=0:.005:5;\nOpts=odeset('OutputFcn',@odeplot,'reltol', 1e-4, 'abstol', 1e-6);\n\
  ode45(F, t, ICs, Opts)\nxlabel('\\it time'), ylabel('x_1, dx_1, x_2,  dx_2'), grid\
  \ on\nlegend('x_1(t)', 'dx_1(t)', 'x_2(t)', 'dx_2(t)')\ntitle('Simulation of 2-DOF\
  \ system')\n%% Testing different solvers with different ODE settings\n% ODE45 with\
  \ fixed time step of 0.005\nts=0:.005:5; % fixed time step of 0.005\n[t1, y1]=ode45(F,\
  \ ts, ICs, []);\n%% ODE23tb with variable time step\nt=[0, 5];\n[t2, y2]=ode23tb(F,\
  \ t, ICs, []);\n%% ODE23 calls an embedded function SMsys. A fixed time step of\
  \ 0.005\n[t3, y3]=ode23(@SMsys, ts, ICs);\n%% ODE113 with the varying step size\
  \ and function handle\n[t4, y4]=ode113(@(t, y)[y(2); (1/m1)*(F0*sin(10*t)- ...\n\
  (c1+c2)*y(2)+c2*y(4)-k1*y(1)+k1*y(3)); y(4);\n(1/m2)*(c2*y(2)-(c2+c3)*y(4)+k1*y(1)-(k1+k2)*y(3))],t,\
  \ ICs);\n%% SIMULINK model: Two_DOF_SMsys.slx with ODE23S & rel. error tol. 1e-6\n\
  OPTs=simset('reltol', 1e-6, 'solver', 'ode23s');\nXOUT=sim('Two_DOF_SMsys', t, OPTs);\
  \ % Simulates model: Two_DOF_SMsys.slx\nfigure('name', 'Displacement: x1')\nplot(t1,y1(:,1),\
  \ 'b-o'), hold on\nplot(t2,y2(:,1), 'r--s')\nplot(t3,y3(:,1), 'm-.x'),\nplot(t4,y4(:,1),\
  \ 'g:+')\nplot(XOUT.tout, XOUT.yout{1}.Values.Data, 'k-'), grid on\nlegend('ode45','ode23tb','ode23',...\n\
  'ode113','Simulink(ode23s ~var)')\ntitle('Displacement of body mass: m_1')\nxlabel('time,\
  \ [sec]'), ylabel('x_1(t)')\nfigure('name', 'Displacement: x2')\nplot(t1,y1(:,3),\
  \ 'b-o'), hold on\nplot(t2,y2(:,3), 'r--s')\nplot(t3,y3(:,3), 'm-.x'),\nplot(t4,y4(:,3),\
  \ 'g:+')\nplot(XOUT.tout, XOUT.yout{2}.Values.Data, 'k-'), grid on\nlegend('ode45','ode23tb','ode23',...\n\
  'ode113','Simulink(ode23s ~var)')\ntitle('Displacement of body mass: m_2')\nxlabel('time,\
  \ [sec]'), ylabel('x_2(t)')\n% Function called by ODE23TB\nfunction DX=SMsys(t,y)\n\
  k1=90; k2=85; c1=2; c2=1; c3=3; m1=5; m2=3; F0=3.3;\nDx(1)= y(2);\nDx(2)=(1/m1)*(F0*sin(10*t)-(c1+c2)*y(2)+c2*y(4)-k1*y(1)+k1*y(3));\n\
  Dx(3)= y(4);\nDx(4)= (1/m2)*(c2*y(2)-(c2+c3)*y(4)+k1*y(1)-(k1+k2)*y(3));\nDX=[Dx(1);\
  \ Dx(2); Dx(3); Dx(4)];\nend\n```\n\n请注意，Simulink 模型 (`Two_DOF_SMsys.mdl`) 从名为 `two_DOF_sys_sim_ALL.m`\
  \ 的仿真 m 文件中获取所有参数（`m1`, `m2`, `k1`, `k2`, `c1`, `c2`, `c3`, `F0`）值和初始条件值（在积分器块中定义，变量名为\
  \ `ICs(1)`, `ICs(2)`, `ICs(3)`, `ICs(4)`）。请注意，输入图（Simulink 模型 `Two_DOF_SMsys.mdl`\
  \ 中的正弦波）的幅值设置为 `F0`，频率（弧度/秒）设置为 `10`。\n\n![../images/490522_1_En_9_Chapter/490522_1_En_9_Fig13_HTML.jpg](img/490522_1_En_9_Fig13_HTML.jpg)\n\
  \n图 9-13\n\nSimulink 模型，`Two_DOF_SMsys.slx`\n\n我们运行模型 `two_DOF_sys_sim_ALL.m`，它会自动调用/仿真\
  \ Simulink 模型 (`Two_DOF_SMsys.mdl`) 和函数文件。随后，我们得到显示仿真结果的下图（图 9-14、图 9-15 和图 9-16）。\n\
  \n![../images/490522_1_En_9_Chapter/490522_1_En_9_Fig16_HTML.png](img/490522_1_En_9_Fig16_HTML.png)\n\
  \n图 9-16\n\n使用 MATLAB/Simulink 的不同 ODE 求解器计算得到的质量块 2 的位移\n\n\n\n![../images/490522_1_En_9_Chapter/490522_1_En_9_Fig15_HTML.png](img/490522_1_En_9_Fig15_HTML.png)\n\
  \n**图 9-15**  \n使用 MATLAB/Simulink 的不同 ODE 求解器计算得到的物体 1 的位移\n\n![../images/490522_1_En_9_Chapter/490522_1_En_9_Fig14_HTML.png](img/490522_1_En_9_Fig14_HTML.png)\n\
  \n**图 9-14**  \n物体 1 和物体 2 的位移与速度\n\n图 9-14 和 9-15 中的仿真结果表明，所有使用的 ODE 求解器（`ode23`、`ode23tb`、`ode23s`、`ode45`、`ode113`）都得到了良好收敛的解。\n\
  \n## 三自由度系统\n\n让我们考虑图 9-17 中所示的三自由度弹簧-质量-阻尼器系统，该系统有三个通过弹簧和阻尼器相互连接的质量块。它类似于之前的二自由度系统。我们将推导系统的运动方程并构建仿真模型。\n\
  \n根据其自由体受力图（图 9-17），系统的运动方程可以用公式 (9-39) 所示的二阶微分方程组表示：\n\n![$$ \\left\\{\\begin{array}{c}{m}_1{\\\
  ddot{x}}_1+{k}_1{x}_1+{k}_2\\left({x}_1-{x}_2\\right)+{c}_1{\\dot{x}}_1+{c}_2\\\
  left({\\dot{x}}_1-{\\dot{x}}_2\\right)={F}_1(t)\\\\ {}{m}_2{\\ddot{x}}_2+{k}_2\\\
  left({x}_2-{x}_1\\right)+{k}_3\\left({x}_2-{x}_3\\right)+{c}_2\\left({\\dot{x}}_2-{\\\
  dot{x}}_1\\right)+{c}_3\\left({\\dot{x}}_2-{\\dot{x}}_3\\right)={F}_2(t)\\\\ {}{m}_3{\\\
  ddot{x}}_3+{k}_3\\left({x}_3-{x}_2\\right)+2{k}_4{x}_3+{c}_3\\left({\\dot{x}}_3-{\\\
  dot{x}}_2\\right)={F}_3(t)\\end{array}\\right.\\kern4.75em \\left(9-39\\right) $$](img/490522_1_En_9_Chapter_TeX_Equc.png)\n\
  \n(9-39)\n\n公式 (9-39) 可以改写如下：\n\n![$$ \\left\\{\\begin{array}{c}{m}_1{\\ddot{x}}_1(t)+\\\
  left({k}_1+{k}_2\\right){x}_1(t)-{k}_2{x}_2(t)+\\left({c}_1+{c}_2\\right)\\ {\\\
  dot{x}}_1(t)-{c}_2{\\dot{x}}_2(t)={F}_1(t)\\kern8.25em \\\\ {}{m}_2{\\ddot{x}}_2(t)-{k}_2{x}_1(t)+\\\
  left({k}_2+{k}_3\\right){x}_2(t)-{k}_3{x}_3(t)+\\left({c}_2+{c}_3\\right)\\ {\\\
  dot{x}}_2(t)-{c}_2{\\dot{x}}_1(t)-{c}_3{\\dot{x}}_3(t)={F}_2(t)\\\\ {}{m}_3{\\ddot{x}}_3(t)-{k}_3{x}_2(t)+\\\
  left({k}_3+2{k}_4\\right){x}_3(t)-{c}_3{\\dot{x}}_2(t)+{c}_3{\\dot{x}}_3(t)={F}_3(t)\\\
  end{array}\\kern0.5em \\right.\\kern0.75em \\left(9-40\\right) $$](img/490522_1_En_9_Chapter_TeX_Equd.png)\n\
  \n(9-40)\n\n请注意，`m_1`、`m_2`、`m_3`、`c_1`、`c_2`、`c_3`、`k_1`、`k_2` 和 `k_3` 分别是系统的质量、阻尼和刚度参数。`x_1`、`x_2`\
  \ 和 `x_3` 分别是物体 1、2、3 的位移。![$$ {\\dot{x}}_1,{\\dot{x}}_2,\\mathrm{and}\\kern0.5em\
  \ {\\dot{x}}_3 $$](img/490522_1_En_9_Chapter_TeX_IEq17.png) 是速度，而 ![$$ {\\ddot{x}}_1,{\\\
  ddot{x}}_2,\\mathrm{and}\\kern0.5em {\\ddot{x}}_3 $$](img/490522_1_En_9_Chapter_TeX_IEq18.png)\
  \ 分别是物体 1、2、3 的加速度。`F_1(t)`、`F_2(t)` 和 `F_3(t)` 分别是施加在物体 1、2、3 上的外部作用力。\n\n![../images/490522_1_En_9_Chapter/490522_1_En_9_Fig17_HTML.png](img/490522_1_En_9_Fig17_HTML.png)\n\
  \n**图 9-17**  \n三自由度系统：a) 系统的物理模型，三个质量块在无摩擦的平面上滚动；b) 系统的自由体受力图\n\n请注意，公式 (9-39)\
  \ 和公式 (9-40) 中的系统方程是二阶 ODE，它们是线性且时不变的。它们通过 `x_1(t)`、`x_2(t)` 和 `x_3(t)` 的坐标系进行耦合。因此，这些方程必须同时求解。对于数值仿真，系统参数采用以下数值：`m_1\
  \ = 2.5 [kg]`；`m_2 = 2.0 [kg]`；`m_3 = 3.0 [kg]`；![$$ {k}_1=25\\ \\left[\\frac{N}{m}\\\
  right];{k}_2=5\\ \\left[\\frac{N}{m}\\right];{k}_3={k}_4=30\\left[\\frac{N}{m}\\\
  right] $$](images/490522_1_En_9_Chapter/490522_1_En_9_Chapter_TeX_IEq19.png)；![$$\
  \ {c}_1=2.5\\left[\\frac{Ns}{m}\\right];{c}_2=0.5\\left[\\frac{Ns}{m}\\right];{c}_3=3.5\\\
  left[\\frac{Ns}{m}\\right] $$](images/490522_1_En_9_Chapter/490522_1_En_9_Chapter_TeX_IEq20.png)。\n\
  \n我们分别在强迫运动和自由运动的情况下对该系统进行仿真。\n\n- **强迫运动**（振动）情况，初始条件为零：\n\n  例如：`F_1(t) = 20 sin\
  \ (120*t)`；`F_2(t) = 0`；`F_3(t) = 20Φ(t − t_0)`；\n\n  请注意，`F_3(t)` 是一个在 `t_0 = 0`\
  \ 时施加的 Heaviside 阶跃函数 `Φ(t − t_0)`。\n\n- **自由运动**（振动）情况。未施加外部作用力：`F_1(t) = F_2(t)\
  \ = F_3(t) = 0`；仅在物体 1 上施加了一个初始（激励）位移：![$$ {x}_1(0)=0.5,{x}_2(0)=0,{x}_3(0)=0;{\\\
  dot{x}}_1(0)=0,{\\dot{x}}_2(0)=0,{\\dot{x}}_3(0)=0; $$](img/490522_1_En_9_Chapter_TeX_IEq21.png)。\n\
  \n请注意，在编写仿真模型之前，我们通过一阶 ODE 来重写公式 (9-39) 中的系统方程。该系统具有三个二阶（加速度）变量，即 ![$$ {\\ddot{x}}_1,{\\\
  ddot{x}}_2,\\mathrm{and}\\ {\\ddot{x}}_3 $$](img/490522_1_En_9_Chapter_TeX_IEq22.png)，这些变量将被新变量替换，即\
  \ ![$$ {x}_1={y}_1,{\\dot{x}}_1={y}_2,{\\ddot{x}}_1={\\dot{y}}_2;{x}_2={y}_3,{\\\
  dot{x}}_2={y}_4,{\\ddot{x}}_2={\\dot{y}}_4;{x}_3={y}_5,{\\dot{x}}_3={y}_6,\\mathrm{and}\\\
  \ {\\ddot{x}}_3={\\dot{y}}_6 $$](img/490522_1_En_9_Chapter_TeX_IEq23.png)。使用这些新变量，我们可以写出如下一阶耦合\
  \ ODE 方程组。\n\n![$$ \\left\\{\\begin{array}{c}\\begin{array}{c}{\\dot{x}}_1={y}_2\\\
  \\ {}{\\dot{y}}_2=\\left(\\frac{1}{m_1}\\right)\\left({F}_1(t)-\\left({k}_1+{k}_2\\\
  right){y}_1+{k}_2{y}_3-\\left({c}_1+{c}_2\\right){y}_2+{c}_2{y}_4\\ \\right)\\end{array}\\\
  \\ {}\\begin{array}{c}{\\dot{x}}_2={y}_4\\\\ {}\\ {\\dot{y}}_4=\\left(1/{m}_2\\\
  right)\\left({F}_2(t)+{k}_2{y}_1-\\left({k}_2+{k}_3\\right){x}_3+{k}_3{y}_5-\\left({c}_2+{c}_3\\\
  right){y}_4\\right)\\end{array}\\\\ {}\\begin{array}{c}{\\dot{x}}_3={y}_6\\\\ {}{\\\
  dot{y}}_6=\\left(\\frac{1}{m_3}\\right)\\left({F}_3(t)+{k}_3{y}_3-\\left({k}_3+2{k}_4\\\
  right){y}_5+{c}_3{y}_4-{c}_3{y}_6\\right)\\end{array}\\end{array}\\right. $$](img/490522_1_En_9_Chapter_TeX_Equ35.png)\n\
  \n(9-41)\n\n基于公式 (9-41) 中的方程，我们使用 `ode45` 求解器编写了一个名为 `three_MASS.m` 的函数文件。请注意，该函数文件包含一个名为\
  \ `third_DOF(t, y)` 的嵌套函数，用于定义公式 (9-41) 中给出的系统方程。系统参数值和外部作用力也在此嵌套函数内定义。Heaviside\
  \ 阶跃函数通过 MATLAB 的内置函数 `step()` 表示。\n\n\n\n```matlab\n% three_MASS.m\n% 说明：高度耦合三自由度系统的仿真。\n\
  clearvars; clc\nt=0:.01:120;  % 仿真时间跨度\nIC=[0;0;0;0;0;0];           % 案例 #1\n% IC=[0.5;\
  \ 0; 0; 0; 0; 0];  % 案例 #2\nF1=20*sin(120*t);F2=0; t0=0; F3=20*stepfun(t,t0); %\
  \ 案例 #1\n% F1=0; F2=F1; F3=F1;                             % 案例 #2\nk1=25; k2=5;\
  \ k3=30; k4=k3; c1=2.5; c2=.5; c3=3.5;\nm1=2.5; m2=2; m3=3;\n[t, xyz]=ode45(@third_DOF,\
  \ t, IC, []);\n% SIMULINK 模型：ThreeDOFsys.slx，使用 ODE113 求解器，相对误差容限 1e-6\nOPTs=simset('reltol',\
  \ 1e-6, 'solver', 'ode113');\n[tt, YY, X123]=sim('ThreeDOFsys', [0, 20], OPTs);%\
  \ 运行：ThreeDOFsys.slx\nfigure('name', 'Matlab vs. Simulink')\nplot(t(1:2000),xyz(1:2000,1),'bo',t(1:2000),xyz(1:2000,3),\
  \ ...\n'rx', t(1:2000), xyz(1:2000,5), 'ks', ...\ntt(1:5000),X123(1:5000,1),'r-',tt(1:5000),X123(1:5000,2),\
  \ ...\n'b--', tt(1:5000), X123(1:5000,3), 'g-.','linewidth',1.5)\nlegend('质量 1:\
  \ x_1(t) (Matlab)','质量 2: x_2(t) (Matlab)', ...\n'质量 3: x_3(t) (Matlab)', ...\n\
  '质量 1: x_1(t) (Simulink)', '质量 2: x_2(t) (Simulink)', ...\n'质量 3: x_3(t) (Simulink)')\n\
  title('\\it 三自由度 SMD（耦合）系统')\nxlabel('\\it 时间, [秒]')\nylabel('\\it 位移, x_1(t), x_2(t),\
  \ x_3(t)'), grid on\nfigure('name', '动画')\nfor k=1:t(end)-20\n% 注意：为提高可视化效果，x1、x2、x3\
  \ 的位移幅度放大了 10 倍\nplot(-20,0,'*', 20,0, '*', -10+10*xyz(k+20,1), 0, 'r-o',...\n-5+10*xyz(k+20,3),0,'g-o',...\n\
  10+10*xyz(k+20,5),0,'b-o','markersize', 35, ...\n'markerfacecolor', 'c');\ngrid\
  \ on; Motion(k)=getframe;\nend\nmovie(Motion)\nfunction  dx = third_DOF(t, y)\n\
  % 说明：三自由度系统\nk1=25; k2=5; k3=30; k4=k3; c1=2.5; c2=.5; c3=3.5;\nm1=2.5; m2=2; m3=3;\n\
  F1=20*sin(120*t);F2=0; t0=0; F3=20*stepfun(t,t0);     % 案例 #1\n% F1=0; F2=0; F3=0;\
  \                                   % 案例 #2\ndx=zeros(6,1);\ndx(1)=y(2);\ndx(2)=(1/m1)*(F1-(k1+k2)*y(1)+k2*y(3)-(c1+c2)*y(2)+c2*y(4));\n\
  dx(3)=y(4);\ndx(4)=(1/m2)*(F2+k2*y(1)-(k2+k3)*y(3)+k3*y(5)-...\n(c2+c3)*y(4)+c2*y(2)+c3*y(6));\n\
  dx(5)=y(6);\ndx(6)=(1/m3)*(F3+k3*y(3)-(k3+2*k4)*y(5)+c3*y(4)-c3*y(6));\nend\n```\n\
  \n该仿真模型包含了受迫运动（案例 #1）和自由运动（案例 #2）的输入，例如针对受迫和自由运动情况分别施加的输入力以及非零初始条件（针对质量 1）。\n\n\
  此外，模型还包含了调用并执行系统 Simulink 模型的命令，如图 9-18 所示。需要注意的是，Simulink 模型 `ThreeDOFsys.slx`\
  \ 会接收所有参数的数值，而初始条件则通过仿真函数文件 `three_MASS.m` 在积分器模块内部设置。Simulink 模型的外部力幅值通过依次选择“模型属性”\
  \ ➤ “回调” ➤ “初始化函数” 来设定。\n\n* `F1 = 30; F2=0; F3=30;` % 用于案例 #1\n* `F1 = 0; F2=0;\
  \ F3=0;` % 用于案例 #2\n\n请注意，在 Simulink 模型 `ThreeDOFsys.slx` 中，`正弦波`模块用于产生作用于质量 1 的输入力信号\
  \ `F1(t)`，其参数设置如下：`幅值 =1`、`频率=120`、`相位=0`、`偏置 =0`、`采样时间=0`。其输出公式为：`O(t) = 幅值 * sin\
  \ (频率 * t + 相位) + 偏置`。输入力信号为 `F1(t) = O(t) * F1`，其中 `F1` 是常数增益值。作用于质量 3 的力为常数值，等于\
  \ `F3`。作用于质量 2 的力为 0。因此，`F2 = 0`，在模型中忽略不计。\n\n![../images/490522_1_En_9_Chapter/490522_1_En_9_Fig18_HTML.jpg](img/490522_1_En_9_Fig18_HTML.jpg)\n\
  \n**图 9-18**\n\n三自由度系统的 Simulink 模型 (`ThreeDOFsys.slx`)\n\n## 受迫运动情况\n\n在这种情况下，我们采用全部为零的初始条件和两个非零的外部施加力：\n\
  \n```\nIC=[0;0;0;0;0;0];                                 % 案例 #1\nF1=20*sin(120*t);F2=0;\
  \ t0=0; F3=20*stepfun(t,t0); % 案例 #1\n```\n\n通过仿真调用并执行 Simulink 模型 (`ThreeDOFsys.slx`)\
  \ 的 MATLAB 脚本 (`three_MASS.m`)，我们得到了如图 9-19 所示的仿真结果，以及一个（此处未展示的）展示三个质量块相对运动的动画图。\n\
  \n![../images/490522_1_En_9_Chapter/490522_1_En_9_Fig19_HTML.png](img/490522_1_En_9_Fig19_HTML.png)\n\
  \n**图 9-19**\n\n三自由度耦合系统受迫振动的仿真结果\n\n图 9-19 中的仿真结果表明，MATLAB 模型的结果与 Simulink 模型的结果相匹配。\n\
  \n## 自由运动情况\n\n在这种情况下，我们采用全部为零的初始条件和两个非零的外部施加力。\n\n```\nIC=[0.5;0;0;0;0;0];    %\
  \ 案例 #2\nF1=0; F2=0; F3=0;      % 案例 #2\n```\n\n案例 #2（自由运动，如图 9-20 所示）的仿真结果显示，质量\
  \ 1 上的微小初始位移（非零）也会引起其他两个质量块产生位移。尽管使用了不同的求解器和步长，由 MATLAB 和 Simulink 模型计算出的结果依然完美地吻合。\n\
  \n![../images/490522_1_En_9_Chapter/490522_1_En_9_Fig20_HTML.png](img/490522_1_En_9_Fig20_HTML.png)\n\
  \n**图 9-20**\n\n三自由度 SMD 系统自由运动的仿真结果\n\n\n\n"
- '# *n*自由度系统的矩阵方法


  当给定的 *n* 自由度系统为线性时，存在另一种更高效的方法，即矩阵方法，用于构建此类系统的仿真模型。让我们考虑一个阻尼线性 *n* 自由度弹簧-质量-阻尼系统的受迫响应。此类系统最通用的表述形式如下：


  ![$$ \left[M\right]\ddot{x}+\left[C\right]\dot{x}+\left[K\right]x=\left[B\right]F(t)
  $$](images/490522_1_En_9_Chapter/490522_1_En_9_Chapter_TeX_Equ36.png)


  (9-42)


  初始条件为 ![$$ x(0)={x}_0\kern0.75em \mathrm{and}\ \dot{x}(0)={\dot{x}}_0 $$](img/490522_1_En_9_Chapter_TeX_IEq24.png)，其中
  `[M]`、`[C]`、`[K]` 分别是质量矩阵、阻尼矩阵和刚度矩阵，`[B]` 是施加力 `F(t)` 的列力矩阵。通过将方程 (9-1) 两边除以 `[M]`
  或乘以 `[M]^(-1)` 并引入新变量，二阶常微分方程被转换为一阶常微分方程。引入新变量，例如对于一个二阶系统，将是 ![$$ x={y}_1,\dot{x}={y}_2,\mathrm{and}\
  \ddot{x}={\dot{y}}_2 $$](img/490522_1_En_9_Chapter_TeX_IEq25.png)。通过这些代换，得到由两个微分方程组成的下一个系统。


  ![$$ \left\{\begin{array}{c}{\dot{y}}_1={y}_2\\ {}{\dot{y}}_2=\left[{M}^{-1}\right]\left[B\right]F(t)-\left[{M}^{-1}\right]\left[K\right]{y}_1-\left[{M}^{-1}\right]\left[C\right]{y}_2\end{array}\right.
  $$](images/490522_1_En_9_Chapter/490522_1_En_9_Chapter_TeX_Equ37.png)


  (9-43)


  初始条件为 ![$$ {y}_1(0)={x}_0,{y}_2(0)={\dot{y}}_1(0)={\dot{x}}_0 $$](img/490522_1_En_9_Chapter_TeX_IEq26.png)。方程
  (9-43) 中的公式可以用以下更明确的形式写出：


  ![$$ \dot{y}=\left[\begin{array}{c}{\dot{y}}_1\\ {}{\dot{y}}_2\end{array}\right]=\left[\begin{array}{c}\left[0\right]{y}_1+\left[I\right]{y}_2\\
  {}\left[{M}^{-1}\right]\left[B\right]F(t)-\left[{M}^{-1}\right]\left[K\right]{y}_1-\left[{M}^{-1}\right]\left[C\right]{y}_2\end{array}\right]
  $$](images/490522_1_En_9_Chapter/490522_1_En_9_Chapter_TeX_IEq27.png)


  ![$$ \left[\begin{array}{c}\left[0\right]\\ {}\left[{M}^{-1}\right]\left[B\right]F(t)\end{array}\right]+\left[\begin{array}{c}\left[0\right]{y}_1+\left[I\right]{y}_2\\
  {}-\left[{M}^{-1}\right]\left[K\right]{y}_1-\left[{M}^{-1}\right]\left[C\right]{y}_2\end{array}\right]
  $$](images/490522_1_En_9_Chapter/490522_1_En_9_Chapter_TeX_Equ38.png)


  (9-44)


  这可以表示为更通用的形式：


  ![$$ \dot{y}(t)=f(t)+\left[A\right]y(t) $$](images/490522_1_En_9_Chapter/490522_1_En_9_Chapter_TeX_Equ39.png)


  (9-45)


  其中 `A` 是由以下方程定义的状态矩阵：


  ![$$ A=\left[\begin{array}{cc}0&amp; I\\ {}-\left[{M}^{-1}\right]\left[K\right]&amp;
  -\left[{M}^{-1}\right]\left[C\right]\end{array}\right] $$](images/490522_1_En_9_Chapter/490522_1_En_9_Chapter_TeX_Equ40.png)


  (9-46)


  此外，我们可以写出以下内容：


  ![$$ y(t)=\left[\begin{array}{c}{y}_1(t)\\ {}{y}_2(t)\end{array}\right],f(t)=\left[\begin{array}{c}0\\
  {}{M}^{-1} BF(t)\end{array}\right],{y}_0=\left[\begin{array}{c}{y}_1(0)\\ {}{y}_2(0)\end{array}\right]=\left[\begin{array}{c}{x}_0\\
  {}{\dot{x}}_0\end{array}\right] $$](images/490522_1_En_9_Chapter/490522_1_En_9_Chapter_TeX_Equ41.png)


  (9-47)


  总结一下，在计算出矩阵 `[A]` 和力向量 `f(t)` 之后，如果给定的系统受到外力作用，我们可以对方程 ![$$ \dot{y}(t)=f(t)+\left[A\right]y(t)
  $$](images/490522_1_En_9_Chapter/490522_1_En_9_Chapter_TeX_IEq28.png) 进行数值求解。


  **示例。** 让我们考虑先前研究过的三自由度弹簧-质量-阻尼系统。


  ![$$ \left[M\right]=\left[\begin{array}{ccc}2.5&amp; 0&amp; 0\\ {}0&amp; 2&amp;
  0\\ {}0&amp; 0&amp; 3\end{array}\right] $$](images/490522_1_En_9_Chapter/490522_1_En_9_Chapter_TeX_IEq29.png),
  ![$$ \left[C\right]=\left[\begin{array}{ccc}{c}_1+{c}_2&amp; -{c}_2&amp; 0\\ {}-{c}_2&amp;
  {c}_2+{c}_3&amp; -{c}_3\\ {}0&amp; -{c}_3&amp; {c}_3\end{array}\right]=\left[\begin{array}{ccc}3&amp;
  -0.5&amp; 0\\ {}-0.5&amp; 4&amp; -3.5\\ {}0&amp; -3.5&amp; 3.5\end{array}\right]
  $$](images/490522_1_En_9_Chapter/490522_1_En_9_Chapter_TeX_IEq30.png), ![$$ \left[K\right]=\left[\begin{array}{ccc}{k}_1+{k}_2&amp;
  -{k}_2&amp; 0\\ {}-{k}_2&amp; {k}_2+{k}_3&amp; -{k}_3\\ {}0&amp; -{k}_3&amp; {k}_3+2{k}_4\end{array}\right]=\left[\begin{array}{ccc}30&amp;
  -5&amp; 0\\ {}-5&amp; 35&amp; -30\\ {}0&amp; -30&amp; 90\end{array}\right] $$](images/490522_1_En_9_Chapter/490522_1_En_9_Chapter_TeX_IEq31.png)


  同样，我们考虑两种情况：受迫运动和自由运动。


  **受迫运动（振动）情况。** 在此情况下，初始条件为零，外力施加于质量块 2，而质量块 1 和 3 自由：


  ![$$ {F}_1(t)=0;{F}_2(t)=20\ \Phi \left(\mathrm{t}-{\mathrm{t}}_0\right);{F}_3(t)=0;
  $$](img/490522_1_En_9_Chapter_TeX_Eque.png)


  注意 `F2(t)` 是幅度为 20 的赫维赛德阶跃函数 `Φ(t - t0)`，作用于 `t0 = 0`。


  我们编写该问题的仿真模型脚本 `MASS3.m`，其中包含一个嵌套函数 `DOF3(t, x)`。


  ```

  function MASS3

  % HELP. 三自由度系统仿真。

  t=0:.01:120;          % 仿真时间跨度

  IC=[0;0;0;0;0;0];    % 情况 #1. 受迫运动

  % IC=[0.5;0;0;0;0;0]; % 初始条件

  [t, x123]=ode45(@DOF3, t, IC, []);

  figure(''name'', ''矩阵方法'')

  H=plot(t, x123(:,1), t, x123(:,3), t, x123(:,5));

  H(1).Color = [1 0 0];

  H(2).Color = [0 1 0];

  H(3).Color = [0 0 1];

  H(1).LineStyle = ''-'';

  H(2).LineStyle = ''-.'';

  H(3).LineStyle = ''--'';

  H(1).LineWidth = 1.5;

  H(2).LineWidth = 2.0;

  H(3).LineWidth = 2.0;

  legend(''质量块 1: x_1(t)'', ''质量块 2: x_2(t)'', ''质量块 3: x_3(t)'')

  ylabel(''\it x_1(t), x_2(t), x_3(t)'')

  xlabel(''\it time'')

  title(''\it 受迫运动：位移''), grid on

  % title(''\it 自由运动：位移''), grid on

  xlim([0, 20])

  figure(2)

  G=plot(t, x123(:,2), t, x123(:,4), t, x123(:,6));

  G(1).Color = [1 0 0];

  G(2).Color = [0 1 0];

  G(3).Color = [0 0 1];

  G(1).LineStyle = ''-'';

  G(2).LineStyle = ''-.'';

  G(3).LineStyle = ''--'';

  G(1).LineWidth = 1.5;

  G(2).LineWidth = 2.0;

  G(3).LineWidth = 2.0;

  legend(''质量块 1: dx_1(t)'', ''质量块 2: dx_2(t)'', ''质量块 3: dx_3(t)'')

  title(''\it 受迫运动：速度''), grid on

  % title(''\it 自由运动：速度''), grid on

  xlabel(''\it time''), ylabel(''\it dx_1, dx_2, dx_3'')

  xlim([0, 20])

  function  dx = DOF3(t, x)

  % HELP: 三自由度系统仿真

  k1=25; k2=5; k3=30; k4=k3; c1=2.5; c2=.5; c3=3.5;

  m1=2.5; m2=2; m3=3; M=[m1 0 0; 0 m2 0; 0 0 m3];

  K=[k1+k2, -k2, 0; -k2, k2+k3, -k3; 0, -k3, k3+2*k4];

  C=[c1+c2, -c2, 0; -c2, c2+c3, -c3; 0, -c3, c3];

  % 情况 1: 施加外力

  F1= 0; t0=0; F2=20*stepfun(t,t0); F3=0;

  % 情况 2: 自由振动（无外力施加）

  % F1=0;F2=0;F3=0;

  B=[F1;F2;F3]; A=[zeros(3) eye(3); -inv(M)*K, -inv(M)*C];

  f=(M\eye(3))*B; dx=A*x+[0;0;0;f];

  end

  end

  ```


  注意，对于大型系统，矩阵求逆计算函数计算成本很高。因此，使用反斜杠（`\`）运算符代替 `inv()`，因为它在计算上比矩阵求逆方法更高效、更精确。例如，`M\eye(3)`
  等价于 `inv(M)`，但比 `inv(M)` 更精确、更高效。


  通过执行模型 `MASS3.m`，我们获得了受迫运动的仿真结果，如图 9-21 和图 9-22 所示。


  ![../images/490522_1_En_9_Chapter/490522_1_En_9_Fig22_HTML.png](img/490522_1_En_9_Fig22_HTML.png)


  图 9-22 三自由度弹簧-质量-阻尼系统受迫运动的仿真结果




  ![../images/490522_1_En_9_Chapter/490522_1_En_9_Fig21_HTML.png](img/490522_1_En_9_Fig21_HTML.png)


  **图 9-21** 三自由度弹簧-质量-阻尼系统受迫运动的仿真结果


  **自由运动（振动）情况。**最初，仅对质量块 2 施加一个微小位移，另外两个质量块的初始条件均为零：![$$ {x}_1(0)=0.5,{x}_2(0)=0,{x}_3(0)=0;{\dot{x}}_1(0)=0,{\dot{x}}_2(0)=0,{\dot{x}}_3(0)=0,
  $$](img/490522_1_En_9_Chapter_TeX_IEq32.png) `F1(t) = F2(t) = F3(t) = 0`。仿真结果如图
  9-23 和图 9-24 所示。


  ![../images/490522_1_En_9_Chapter/490522_1_En_9_Fig24_HTML.png](img/490522_1_En_9_Fig24_HTML.png)


  **图 9-24** 自由运动：速度


  ![../images/490522_1_En_9_Chapter/490522_1_En_9_Fig23_HTML.png](img/490522_1_En_9_Fig23_HTML.png)


  **图 9-23** 自由运动：位移


  所开发的、包含自由运动和受迫运动的三自由度弹簧-质量-阻尼仿真模型，只需对系统参数进行少量调整，即可应用于 `n` 自由度系统。矩阵法相对简单且计算效率高。


