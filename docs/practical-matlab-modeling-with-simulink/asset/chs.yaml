- '# 引言


  本书涵盖了 MATLAB 和 Simulink 软件包以及符号数学工具箱（MuPAD 笔记）中最基础且实用的工具和函数，用于求解、建模和模拟常微分方程(ODE)和偏微分方程(PDE)。本书通过互动示例和案例研究，讲解了如何符号化和数值化地求解
  ODE 和 PDE。本书的主要原则是“从做中学”，由浅入深。书中包含数十个已解问题以及嵌入在 MATLAB 脚本和 Simulink 模型中的仿真模型，这将帮助您掌握编程和建模的基本要素，并学习如何编程和建模涉及
  ODE 和 PDE 的更困难和复杂的问题。


  *《实用 MATLAB 建模与 Simulink》*通过对比 MATLAB 的编程工具和 Simulink 的建模工具，并行解释了编程和建模中的各种实际问题。通过阅读本书，您将熟练掌握
  MATLAB/Simulink 软件包的使用，并能将本书示例中的源代码和模型作为自己项目的模板，用于解决涉及 ODE 和 PDE 的建模、仿真或工程问题。


  ## 你将学到什么


  在本书结束时，您将学到以下内容：


  *   使用 MATLAB 和 Simulink 对复杂问题进行建模

  *   使用 MATLAB 和 Simulink 求解 ODE 和 PDE

  *   使用数值方法求解一阶、二阶、高阶和耦合 ODE

  *   求解刚性和隐式 ODE

  *   采用数值方法求解一阶和二阶线性 PDE

  *   使用 MATLAB 的符号数学工具箱符号化求解 ODE

  *   理解微分方程在解决各类仿真问题中的应用和建模方面


  本书面向工程师、程序员、数据科学家以及主修工程、应用/工业数学、数据科学和科学计算的学生。本书接续 Apress 出版的《MATLAB 与 Simulink 入门》的内容。


  全书共分为四部分。第一部分包含以下章节：


  *   第 1 章专门介绍使用符号数学工具箱函数和 MuPAD 笔记命令进行一般公式化表述和符号化求解 ODE。

  *   第 2 章涵盖基于欧拉法、龙格-库塔法、米尔恩法、亚当斯-巴什福斯法、拉尔斯顿法和亚当斯-莫尔顿法编写脚本，以数值化求解一阶 ODE 的最重要编程方面。您将使用
  MATLAB 的内置 ODE 求解器，例如`ode23`、`ode23t`、`ode45`、`ode15s`、`ode113`、`odeset`等，以及 Simulink
  建模来编写脚本。

  *   第 3 章专门使用欧拉法、龙格-库塔法、米尔恩法、亚当斯-巴什福斯法、拉尔斯顿法和亚当斯-莫尔顿法，符号化和数值化地求解二阶 ODE。您将通过 MATLAB
  的内置 ODE 求解器，如`ode23`、`ode23t`、`ode45`、`ode15s`、`ode113`、`odeset`等，以及 Simulink 建模来完成此任务。

  *   第 4 章讲解如何通过调整步长、指定求解器设置、选择合适的求解器类型等方式来解决刚性 ODE 的问题。

  *   第 5 章专门用于求解高阶和耦合 ODE。

  *   第 6 章致力于使用 MATLAB 的`ode15i`和 Simulink 建模来求解隐式定义的初值问题和微分代数方程。

  *   第 7 章专门对使用 MATLAB 的 ODE 求解器、Simulink 建模、脚本编写以及使用符号数学工具箱（MuPAD 笔记）计算解析解来求解 ODE
  进行对比分析。


  第二部分包含以下章节：


  *   第 8 章涵盖了使用 MATLAB 求解器（如`bvp4c`、`bvp5c`、`bvpinit`、`deval`等）数值化求解 ODE 边值问题的最基本工具。


  第三部分包含以下章节：


  *   第 9 章专门介绍 ODE 的应用，特别是弹簧-质量-阻尼器系统的建模与仿真。

  *   第 10 章专门介绍 ODE 的应用，特别是机械和机电系统的建模与仿真。

  *   第 11 章专门介绍 ODE 的应用，特别是弹道问题的建模与仿真。

  *   第 12 章专门介绍 ODE 的应用，特别是几个仿真问题（如 Lotka-Voltera 和 Lorenz 系统）的建模与仿真。


  第四部分包含以下章节：


  *   第 13 章致力于使用 PDE 工具箱函数（如`pdepe()`和拉普拉斯算子`del2()`）以及基于高斯-赛德尔法和有限差分法编写脚本来求解偏微分方程。


  ## 如何获取源代码


  本书中讨论的所有源代码（例如 M/MN 文件、Simulink 模型以及 SLX/MDL 文件）均可通过[`www.apress.com/9781484257982`](http://www.apress.com/9781484257982)上的“下载源代码”按钮供读者获取。




