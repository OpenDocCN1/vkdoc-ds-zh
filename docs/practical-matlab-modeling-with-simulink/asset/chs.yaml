  ## 示例 13


  给定 ![$$ A\ddot{y}+B\dot{y}+C\mathrm{y}=D $$](img/490522_1_En_1_Chapter_TeX_IEq33.png)，初始条件为：`y(0)`
  = `a` 和 ![$$ \dot{y}(0)=b. $$](img/490522_1_En_1_Chapter_TeX_IEq34.png)。这是一个二阶线性常微分方程。`[A,
  B, C, D]` 和 `[a, b]` 都是标量。让我们编写一个 Unicode 代码，能够针对这些标量的任意值求解给定的常微分方程。


  以下是使用符号数学工具箱中的 `dsolve()` 和 `syms` 函数的求解脚本（`Unicode_2nd_ODE.m`）：


  ```

  % Unicode_2nd_ODE.m

  syms y(t) t

  Dy=diff(y, t);

  D2y=diff(y, t, 2);

  fprintf(''要求解： A*ddy+B*dy+C*y=D，初始条件： y(0)=a, dy(0)=b \n'')

  fprintf(''请输入 [A, B, C, D] 和 [a, b] 的值 \n'');

  A = input(''输入 A = '');

  B = input(''输入 B = '');

  C = input(''输入 C = '');

  D = input(''输入 D = '');

  a = input(''输入 a = '');

  b = input(''输入 b = '');

  % 给定的 ODE 方程：

  Equation = D2y==(1/A)*(D - B*Dy-C*y);

  ICs = [y(0)==a; Dy(0)==b];

  Solution=dsolve(Equation, ICs);

  % 在命令窗口中显示计算出的解析解：

  pretty(Solution)

  fplot(Solution, [0, 5], ''b-''), grid on

  xlabel(''\it t'')

  ylabel(''\it 解, y(t) '')

  title(''\it 的解: $$\frac{A*d²y}{dt²}+\frac{B*dy}{dt}+C*y=D, y(0)=a, dy(0)=b$$'',
  ''interpreter'', ''latex'')

  gtext([''\it A = ''  num2str(A), ''\it,  B = ''  num2str(B), ''\it,  C = ''  num2str(C),
  ''\it,  D = ''  num2str(D)])

  gtext([''\it 初始条件:  a = ''  num2str(a), ''\it,  b = ''  num2str(b)])

  grid on; shg

  ```


  现在，让我们测试代码来求解这个方程：![$$ 1.3\ddot{y}+\dot{y}+2\mathrm{y}=3 $$](img/490522_1_En_1_Chapter_TeX_IEq35.png)，`y(0)`
  = 1，![$$ \dot{y}(0)=0\. $$](img/490522_1_En_1_Chapter_TeX_IEq36.png)


  ```

  要求解： A*ddy+B*dy+C*y=D，初始条件： y(0)=a, dy(0)=b

  请输入 [A, B, C, D] 和 [a, b] 的值

  输入 A = 1.3

  输入 B = 1

  输入 C = 2

  输入 D = 3

  输入 a = 1

  输入 b = 0

  /   5 t \    / sqrt(235) t \

  sqrt(235) exp| - --- | sin| ----------- |

  3                \    13 /    \      13     /

  - - -----------------------------------------

  2                       94

  /   5 t \    / sqrt(235) t \

  exp| - --- | cos| ----------- |

  \    13 /    \      13     /

  - -------------------------------

  ```


  此外，我们得到下一个绘图，如图 1-5 所示，该图展示了计算出的解析解 `y(t)` 的数值。


  ![../images/490522_1_En_1_Chapter/490522_1_En_1_Fig5_HTML.jpg](img/490522_1_En_1_Fig5_HTML.jpg)


  **图 1-5** *二阶 ODE 的解:* ![$$ 1.3\ddot{y}+\dot{y}+2y=3 $$](img/490522_1_En_1_Chapter_TeX_IEq37.png)
  `y(0)` = 1*,* ![$$ \dot{y}(0)=0 $$](img/490522_1_En_1_Chapter_TeX_IEq38.png)


  您可以使用此代码求解任何具有标量 `[A, B, C, D]` 值的初值问题的二阶 ODE。此代码可以类似地扩展以求解三阶、四阶或更高阶的 ODE。这是另一个可求解高达四阶
  ODE 的替代脚本（`Unicode_4th_order_ODE.m`）：


  ```

  % Unicode_4th_order_ODE.m

  %% Unicode 用于求解高达 4 阶非齐次线性 ODE 的初值问题

  %

  %  方程： Ax+B*dx + C*ddx + ... = F

  %  用户输入（1）为 ODE 阶数：N

  %  用户输入（2）为系数值：A, B, C, ....

  %  用户输入（3）为初始条件：IC1, IC2, IC3,...

  syms x(t)

  Dx=diff(x, t);

  D2x=diff(x, t, 2);

  D3x=diff(x, t, 3);

  D4x=diff(x, t, 4);

  D5x=diff(x, t, 5);

  D6x=diff(x, t, 6);

  D7x=diff(x, t, 7);

  N = input(''ODE 的阶数： N  =  '');

  if N == 1

  disp(''求解： A*x+B*dx=F 带一个初始条件： x(0) = ? '')

  A = input('' 输入：  A =         '');

  B = input('' 输入：  B =         '');

  F = input('' 输入：  F =         '');

  EQN = A*x+B*Dx==F;

  IC1 = input('' 输入： x(0) =    '');

  IC = x(0)==IC1;

  Str0 =''的解： $$ A*x+B*\frac{dx}{dt}=F $$'';

  Str1=sprintf(''A = %d,  B = %d, F = %d'',  A, B, F);

  Str2 =([''初始条件： [ ''  num2str(IC1), '' ]'' ]);

  elseif N == 2

  disp(''求解： A*x+B*dx+C*ddx=E 带两个初始条件： x(0) = ?, dx(0) = ? '')

  A = input('' 输入：  A =         '');

  B = input('' 输入：  B =         '');

  C = input('' 输入：  C =         '');

  F = input('' 输入：  F =         '');

  EQN = A*x+B*Dx+C*D2x==F;

  IC1 = input('' 输入：   x(0) =    '');

  IC2 = input('' 输入： dx(0) =    '');

  IC = [x(0)==IC1, Dx(0)==IC2];

  Str0 =''的解： $$ A*x+B*\frac{dx}{dt}+C*\frac{d²x}{dt²}=F $$'';

  Str1=sprintf(''A = %d,  B = %d, C = %d, F = %d'',  A, B, C, F);

  Str2 =([''初始条件： [ '' num2str(IC1), '', '' num2str(IC2), '' ]'']);

  elseif N == 3

  disp(''求解： A*x+B*dx+C*ddx+D*dddx=F '')

  disp(''带三个初始条件： x(0) = ?, dx(0) = ? ddx(0) = ?'')

  A = input('' 输入：  A =         '');

  B = input('' 输入：  B =         '');

  C = input('' 输入：  C =        '');

  D = input('' 输入：  D =        '');

  F = input('' 输入：  F =         '');

  EQN = A*x+B*Dx+C*D2x+D*D3x==F;

  IC1 = input('' 输入：    x(0) =    '');

  IC2 = input('' 输入：  dx(0) =    '');

  IC3 = input('' 输入： ddx(0) =    '');

  IC = [x(0)==IC1, Dx(0)==IC2, D2x(0)==IC3];

  Str0 =''的解： $$ A*x+B*\frac{dx}{dt}+C*\frac{d²x}{dt²}+D*\frac{d³x}{dt³}=F $$'';

  Str1=sprintf(''A = %d,  B = %d, C = %d, D = %d, F = %d'',  A, B, C, D, F);

  Str2 =([''初始条件： [ ''  num2str(IC1), '', '' num2str(IC2), '', '' num2str(IC3),''
  ]'']);

  else

  disp(''求解： a*x+b*dx+c*ddx+d*dddx+e*ddddx=0 '')

  disp(''带四个初始条件： x(0) = ?, dx(0) = ? ddx(0) = ?, dddx(0) = ?'')

  A = input('' 输入：  A =        '');

  B = input('' 输入：  B =        '');

  C = input('' 输入：  C =        '');

  D = input('' 输入：  D =        '');

  E = input('' 输入：  E =        '');

  F = input('' 输入：  F =        '');

  EQN = A*x+B*Dx+C*D2x+D*D3x+E*D4x==F;

  IC1 = input('' 输入：   x(0)  =    '');

  IC2 = input('' 输入：  dx(0)  =    '');

  IC3 = input('' 输入： ddx(0)  =    '');

  IC4 = input('' 输入： dddx(0) =   '');

  IC = [x(0)==IC1, Dx(0)==IC2, D2x(0)==IC3, D3x(0)==IC4];

  Str0 =''的解： $$ A*x+B*\frac{dx}{dt}+C*\frac{d²x}{dt²}+D*\frac{d³x}{dt³} +E*\frac{d⁴y}{dt⁴}=F
  $$'';

  Str1=sprintf(''A = %d,  B = %d, C = %d, D = %d,  E = %d, F = %d'',  A, B, C, D,
  E, F);

  Str2 =([''初始条件： [ ''  num2str(IC1),'', '' num2str(IC2), '', '' num2str(IC3), '',
  '' num2str(IC3) '' ]'']);

  end

  Solution = dsolve(EQN, IC);

  fplot(Solution, [0, 3*pi], ''LineWidth'', 2), grid on

  xlabel(''\it t'')

  ylabel(''\it 解, x(t) '')

  title(Str0, ''Interpreter'', ''latex'')

  gtext(Str1)

  gtext(Str2)

  grid on; shg

  ```


  使用此脚本（`Unicode_4th_order_ODE.m`），用户可以根据输入获得高达四阶的非齐次线性 ODE 的解析解和数值解。




  '
- "# 拉普拉斯变换\n\n常系数线性常微分方程的解可以通过拉普拉斯变换来求解。拉普拉斯变换在解微分方程时最重要的特性之一在于，变换后的方程是一个代数方程，该代数方程将用于定义给定微分方程的解。通常，应用拉普拉斯变换求解微分方程的过程可表述如下。\n\
  \n假设给定的 `y`^(`n`)(`x`) = `f`(`t`) 是 *n* 阶导数。`y`^(`n`)(`x`) 的拉普拉斯变换如下：\n\n![$$ \\\
  mathcal{L}\\left\\{\\frac{d^ny}{d{t}^n}=f(t)\\right\\}=&gt;{s}^nY(s)-{s}^{n-1}{y}^{n-1}(0)-{s}^{n-2}{y}^{n-2}(0)-\
  \ $$](img/490522_1_En_1_Chapter_TeX_Eque.png)\n\n![$$ -s{y}^{\\prime }(0)-y(0)=F(s)\
  \ $$](img/490522_1_En_1_Chapter_TeX_Equ5.png)\n\n(1-6)\n\n或如下：\n\n![$$ {s}^nY(s)-{\\\
  sum}_{i=1}^n{s}^{n-1}{y}^{i-1}(0)=F(s) $$](img/490522_1_En_1_Chapter_TeX_Equ6.png)\n\
  \n(1-7)\n\n在方程 (1.6) 或 (1.7) 中，如果我们代入 `t` = 0 时的初始条件常数，即 `y`(0) = `a`[0]; `y`′(0)\
  \ = `a`[1]; `y`″(0) = `a`[2]; …; `y`^(`n` − 2)(0) = `a`[`n` − 2]; `y`^(`n` − 1)(0)\
  \ = `a`[`n` − 1.]。\n\n现在，我们可以将方程 (1-6 或 1-7) 中的表达式重写如下：\n\n![$$ \\mathcal{L}\\left\\\
  {\\frac{d^ny}{d{t}^n}=f(t)\\right\\}=&gt;{s}^nY(s)-{s}^{n-1}{a}_0-{s}^{n-2}{a}_1-{s}^{n-3}{a}_2-\\\
  dots -s\\ {a}_{n-2}-{a}_{n-1}=F(s) $$](img/490522_1_En_1_Chapter_TeX_Equ7.png)\n\
  \n(1-8)\n\n随后，我们首先求解 `Y`(`s`)，对 `Y`(`s`) 进行逆拉普拉斯变换，从而得到 *n* 阶微分方程的解 `y`(`t`)。\n\n\
  应用拉普拉斯变换和逆拉普拉斯变换求解常系数微分方程的一般步骤如下：\n\n1.  对给定方程的两边同时进行拉普拉斯变换。\n2.  用 `F`(`s`) 及其他未知量表示并求解\
  \ `Y`(`s`)。\n3.  对求解出的表达式进行逆拉普拉斯变换，得到问题的最终解。\n\n请注意，在第 3 步中，我们还应将第 2 步得到的表达式分解为部分分式，以便使用逆拉普拉斯变换对应表。拉普拉斯变换和逆拉普拉斯变换的示意图见图\
  \ 1-6。\n\n![../images/490522_1_En_1_Chapter/490522_1_En_1_Fig6_HTML.png](img/490522_1_En_1_Fig6_HTML.png)\n\
  \n图 1-6\n\n使用拉普拉斯变换及其逆变换求解常微分方程的流程图\n\n## 示例 14\n\n考虑一个如下的二阶非齐次微分方程：![$$ \\frac{d²y}{d{t}²}+A\\\
  frac{dy}{dt}+C={e}^{nt} $$](img/490522_1_En_1_Chapter_TeX_IEq39.png) `dy`(0) = `k`,\
  \ `y`(0) = `m`。\n\n现在，依据拉普拉斯和逆变换流程图中描述的步骤，我们可以分步明确写出该问题的拉普拉斯变换。\n\n![$$ \\mathcal{L}\\\
  left\\{\\frac{d²y}{d{t}²}+A\\frac{dy}{dt}+C={e}^{nt}\\ \\right\\}=&gt;L\\left\\\
  {\\frac{d²y}{d{t}²}\\right\\}+\\mathcal{L}\\left\\{A\\frac{dy}{dt}\\right\\}+\\\
  mathcal{L}\\left\\{C\\right\\}=\\mathcal{L}\\left\\{{e}^{nt}\\right\\} $$](img/490522_1_En_1_Chapter_TeX_Equ8.png)\n\
  \n(1-9)\n\n![$$ \\mathcal{L}\\left\\{{e}^{nt}\\right\\}=\\frac{1}{s-n} $$](img/490522_1_En_1_Chapter_TeX_Equ9.png)\n\
  \n(1-10)\n\n因此，\n\n![$$ \\mathcal{L}\\left\\{\\frac{d²y}{d{t}²}\\right\\}={s}²Y(s)-\
  \ dy(0)-s\\ast y(0)={s}²Y(s)-k-s\\ast m $$](img/490522_1_En_1_Chapter_TeX_Equ10.png)\n\
  \n(1-11)\n\n![$$ \\mathcal{L}\\left\\{A\\frac{dy}{dt}\\right\\}=A\\ast \\mathcal{L}\\\
  left\\{\\frac{dy}{dt}\\right\\}=A\\ast \\left(s\\ast Y(s)-y(0)\\right)=A\\ast s\\\
  ast Y(s)-m $$](img/490522_1_En_1_Chapter_TeX_Equ11.png)\n\n(1-12)\n\n![$$ \\mathcal{L}\\\
  left\\{C\\right\\}=C $$](img/490522_1_En_1_Chapter_TeX_Equ12.png)\n\n(1-13)\n\n\
  现在，将方程 (1-10)、(1-11)、(1-12) 和 (1-13) 代回方程 (1-9)，我们得到下一个表达式：\n\n![$$ {s}²Y(s)-k-\
  \ sm+ AsY(s)-m+C=\\frac{1}{s-n} $$](img/490522_1_En_1_Chapter_TeX_Equ13.png)\n\n\
  (1-14)\n\n我们求解方程 (1-14) 中的 `Y`(`s`) 并确定如下结果：\n\n![$$ Y(s)=\\frac{1+\\left( sm+\\\
  left(k+m-C\\right)\\right)\\left(s-n\\right)}{\\left(s-n\\right)\\left({s}²+ As\\\
  right)}=-\\frac{Cn- Cs- kn- mn+ ks+ ms+m{s}²}{s\\left(A+s\\right)\\left(n-s\\right)}\
  \ $$](img/490522_1_En_1_Chapter_TeX_Equ14.png)\n\n(1-15)\n\n根据方程 (1-15) 中 `Y`(`s`)\
  \ 的表达式，我们分解部分分式，然后对方程两边进行逆拉普拉斯变换，得到如下方程 (1-16) 所示的解，即给定微分方程的解 `y`(`t`)：\n\n![$$\
  \ y(t)=\\frac{e^{nt}}{An+{n}²}-\\frac{Cn- kn- mn+1}{An}+\\frac{Cn- kn- mn-A\\left(k-\
  \ mn-C\\right)+1}{A{e}^{At}\\left(A+n\\right)} $$](img/490522_1_En_1_Chapter_TeX_Equ15.png)\n\
  \n(1-16)\n\n符号数学工具箱的内置函数 `laplace()` 用于计算任何代数表达式或微分方程的拉普拉斯变换，而符号数学工具箱的 `ilaplace()`\
  \ 函数用于计算已求得的拉普拉斯变换后 *s* 域表达式的逆变换。这两个函数通过自动分解部分分式过程来处理所有变换，并计算给定常微分方程问题的解析解。\n\n\
  ### laplace/ilaplace\n\n`laplace`/`ilaplace` 基于拉普拉斯和逆拉普拉斯变换，是符号数学工具箱的内置函数工具。`laplace`/`ilaplace`\
  \ 的一般语法如下：\n\n```\nF=laplace(f)\nF=laplace(f, t)\nF=laplace(f, var1, var2)\n```\n\
  \n以及\n\n```\nf=ilaplace(F)\nf=ilaplace(F, s)\nf=ilaplace(F, var1, var2)\n```\n\n\
  ## 示例 15\n\n给定 `x`(`t`) = sin(2`t`)，使用以下命令语法计算 `x`(`t`) 的拉普拉斯变换：\n\n```\n>> syms\
  \ t\n>> xt=sin(2*t); Xs=laplace(xt)\nXs =\n2/(s² + 4)\n```\n\n## 示例 16\n\n给定 `y`(`t`)\
  \ = sin(`Kt`)，我们得到如下结果：\n\n```\n>> syms t K\n>> yt=sin(K*t); Ys=laplace(yt)\nYs\
  \ =\nK/(K² + s²)\n```\n\n## 示例 17\n\n给定 `y`(`x`) = `ax`³ + `b`，我们得到如下结果：\n\n```\n\
  >> syms x a b\n>> yx=a*x³+b; Ys=laplace(yx)\nYs =\n(6*a)/s⁴ + b/s\n```\n\n或者，我们可以在\
  \ `t` 变量域中获得结果，而不是 `s` 域。\n\n```\n>> yx=a*x³+b; Yt=laplace(yx, x, t)\nYt =\n(6*a)/t⁴\
  \ + b/t\n```\n\n`ilaplace()` 函数的语法和实现与 `laplace` 完全相同。让我们看几个常微分方程练习，以演示如何使用 `laplace`\
  \ 和 `ilaplace`，并将它们求得的解与 `dsolve()` 得到的解进行比较。\n\n\n\n### 示例 18\n\n给定方程 `\\dot{y}+2y=0,y(0)=0.5`，我们使用\
  \ `laplace/ilaplace` 和 `dsolve()` 来求解。以下脚本（`Laplace_vs_Dsolve_old_MATLAB_ex14.m`）即为求解方法。请注意，此脚本仅适用于\
  \ MATLAB 2017a 或更早版本。\n\n```\n% Laplace_vs_Dsolve_old_MATLAB_ex18.m\nclearvars;\
  \ clc; close all\n% Step #1. Define symbolic variables' names\nsyms t s Y\nODE1='D(y)(t)=-2*y(t)';\n\
  % Step #2. Laplace Transforms\nLT_A=laplace(ODE1, t, s);\n% Step #3. Substitute\
  \ ICs and initiate an unknown Y\nLT_A=subs(LT_A,{'laplace(y(t),t, s)','y(0)'},{Y,0.5});\n\
  % Step #4. Solve for Y (unknown)\nY=solve(LT_A, Y);\ndisplay('Laplace Transforms\
  \ of the given ODE with ICs'); disp(Y)\n% Step #5. Evaluate Inverse Laplace Transform\n\
  Solution_Laplace=ilaplace(Y);\ndisplay('Solution found using Laplace Transforms:\
  \ ')\npretty(Solution_Laplace)\n% Step #6. Compute numerical values and plot them\n\
  t=0:.01:2.5; LTsol=eval(vectorize(Solution_Laplace));\nfigure, semilogx(t, LTsol,\
  \ 'ro-')\nxlabel('t'), ylabel('solution values')\ntitle('laplace/ilaplace vs dsolve\
  \ ')\ngrid on; hold on\n% Compare with dsolve solution method\nY_d=dsolve('Dy=-2*y',\
  \ 'y(0)=0.5'); display('Solution with dsolve')\npretty(Y_d); Y_sol=eval(vectorize(Y_d));\n\
  plot(t,Y_sol, 'b-', 'linewidth', 2), grid minor\nlegend('laplace+ilaplace', 'dsolve'),\
  \ hold off; axis tight\n```\n\n这是该脚本的另一个版本（`Laplace_vs_Dsolve_new_MATLAB_ex14.m`），适用于更新版本的\
  \ MATLAB（从 MATLAB 2018b 开始）。\n\n```\n% Laplace_vs_Dsolve_New_MATLAB_ex18.m\nclearvars;\
  \ clc; close all\n% Step #1. Define symbolic variables' names\nsyms t s Y y(t) Dy(t)\n\
  assume([t, Y]>0);\nDy=diff(y,t);\nODE1=Dy==-2*y(t);\n% Step #2. Laplace Transform\n\
  LT_A=laplace(ODE1, t, s);\n% Step #3. Substitute the arbitrary unknown Y and IC(s)\n\
  LT_A=subs(LT_A,laplace(y,t, s),Y);\nLT_A=subs(LT_A, y(0), 0.5);\n% Step #4. Solve\
  \ for the arbitrary unknown Y\nY=solve(LT_A, Y);\ndisp('Laplace Transforms of the\
  \ given ODE with ICs'); disp(Y)\n% Step #5. Evaluate the Inverse Laplace Transform\n\
  Solution_Laplace=ilaplace(Y);\ndisp('Solution found using Laplace Transforms: ')\n\
  pretty(Solution_Laplace)\n% Step #6. Compute numerical values and plot them\nt=0:.01:2.5;\
  \ LTsol=eval(vectorize(Solution_Laplace));\nfigure, semilogx(t, LTsol, 'ro-')\n\
  xlabel('t'), ylabel('solution values')\ntitle('laplace/ilaplace vs. dsolve ')\n\
  grid on; hold on\n% Compare with dsolve solution method\nIC=y(0)==0.5;\nY_d=dsolve(ODE1,\
  \ IC);\ndisp('Solution with dsolve')\npretty(Y_d); Y_sol=eval(vectorize(Y_d));\n\
  plot(t,Y_sol, 'b-', 'linewidth', 2), grid minor\nlegend('laplace+ilaplace', 'dsolve')\n\
  hold off; axis tight\n```\n\n两个版本的脚本会产生相同的输出。执行脚本（`Laplace_vs_Dsolve_old_MATLAB_ex18.m`\
  \ 或 `ODE_Laplace_New_MATLAB_vers.m`）后，将得到以下输出：\n\n```\nWarning: Solutions are valid\
  \ under the following conditions: -2 < s. To include parameters and conditions in\
  \ the solution, specify the 'ReturnConditions' value as 'true'.\nLaplace Transforms\
  \ of the given ODE with ICs\n1/(2*s + 4)\nSolution found using Laplace Transforms:\n\
  exp(-2 t)\n\nSolution with dsolve\nexp(-2 t)\n```\n\n图 1-7 展示了绘制出的解，并清晰地显示了使用 `laplace/ilaplace`\
  \ 和 `dsolve()` 找到的解完美吻合。\n\n![../images/490522_1_En_1_Chapter/490522_1_En_1_Fig7_HTML.png](img/490522_1_En_1_Fig7_HTML.png)\n\
  \n图 1-7\n\n*问题* `\\dot{y}+2y=0,y(0)=0.5` *使用* `laplace/ilaplace`、`dsolve()` *求解*\n\
  \n注意\n\nSymbolic Math Toolbox 中有一些命令语法（函数）不具有前向兼容性，例如在求解 ODE 时使用的 `laplace`/`ilaplace`\
  \ 和 `subs`。这种前向不兼容问题在示例 4 和示例 5 中已得到演示。\n\n### 示例 19\n\n给定方程 `\\ddot{y}+\\dot{y}=\\\
  sin t,y(0)=1,\\text{and }\\dot{y}(0)=2`，以下脚本（`Laplace_vs_Dsolve_old_MATLAB_ex19.m`）是使用\
  \ `laplace`、`ilaplace` 和 `dsolve()` 求解这个二阶非齐次 ODE 的解法：\n\n```\n% Laplace_vs_Dsolve_old_MATLAB_ex19.m\n\
  % %%   LAPLACE TRANSFORMS\n% Given: y\"+y'=sin(t) with ICs: [1, 2] for y(0) & y'(0).\n\
  clearvars, clc, close all\nsyms t s Y\n% Define the given ODE equation\nODE2nd='D(D(y))(t)+D(y)(t)-sin(t)';\n\
  % Step 1. Laplace Transforms\nLT_A=laplace(ODE2nd, t, s);\n% Step 2. Substitute\
  \ ICs and initiate an unknown Y\nLT_A=subs(LT_A,{'laplace(y(t),t, s)','y(0)','D(y)(0)'},{Y,1,2});\n\
  % Step 3.  Solve for Y unknown\nY=solve(LT_A, Y);\ndisp('Laplace Transforms of the\
  \ given ODE with ICs'); disp(Y)\nSolution_Laplace=ilaplace(Y);\ndisp('Solution found\
  \ using ilaplace/laplace: ')\npretty(Solution_Laplace); t=0:.01:13;\nLTsol=eval(vectorize(Solution_Laplace));\n\
  figure, plot(t, LTsol, 'ro-');\nxlabel('\\it t'),\nylabel('\\it Solution y(t)')\n\
  ylabel('\\it Solution y(t)')\ntitle('\\it laplace/ilaplace vs. dsolve Solutions:\
  \ $$ \\frac{d²y}{dt²}+\\frac{dy}{dt}=sin(t)$$', 'interpreter', 'latex');\nhold on\n\
  % dsolve solution method\nY=dsolve('D2y+Dy=sin(t)', 'y(0)=1, Dy(0)=2', 't');\ndisp('Solution\
  \ with dsolve:  ');\npretty(Y); Y_sol=eval(vectorize(Y));\nplot(t,Y_sol, 'b-', 'linewidth',\
  \ 2); grid minor\nlegend('laplace+ilaplace', 'dsolve', 'location', 'southeast');\
  \ hold off\n```\n\n在命令窗口中显示的计算出的解析解如下（见图 1-8）：\n\n![../images/490522_1_En_1_Chapter/490522_1_En_1_Fig8_HTML.png](img/490522_1_En_1_Fig8_HTML.png)\n\
  \n图 1-8\n\n`\\ddot{y}+\\dot{y}=\\sin(t),y(0)=1,\\dot{y}(0)=2` *的数值解*\n\n```\nLaplace\
  \ Transforms of the given ODE with ICs\n(s + 1/(s² + 1) + 3)/(s² + s)\nSolution\
  \ found using Laplace Transforms:\ncos(t)   sin(t)   5 exp(-t)\n4 - ------ - ------\
  \ - ---------\n2        2          2\nSolution with dsolve:\ncos(t)   sin(t)   5\
  \ exp(-t)\n4 - ------ - ------ - ---------\n2        2          2\n```\n\n请注意，前面的脚本（`Laplace_vs_Dsolve_old_MATLAB_ex19.m`）适用于旧版本的\
  \ MATLAB，并且在 MATLAB 2018a 之后的版本中将无法运行。此脚本（`Laplace_vs_Dsolve_New_MATLAB_ex15.m`）会产生相同的输出。\n\
  \n\n\n```matlab\n% Laplace_vs_Dsolve_New_MATLAB_ex19.m\n% %%   拉普拉斯变换\n% 已知：y\"\
  +y'=sin(t)，初始条件：y(0)=1，y'(0)=2。\nclearvars, clc, close all\n% 步骤 1. 定义符号变量名称\nsyms\
  \ t s Y y(t) Dy(t)\nDy=diff(y, t);\nD2y=diff(y, t, 2);\n% 定义给定的常微分方程\nEquation=D2y+Dy==sin(t);\n\
  % 步骤 2. 拉普拉斯变换\nLT_A=laplace(Equation, t, s);\n% 步骤 3. 代入未知变量 Y 与初始条件\nLT_A=subs(LT_A,laplace(y(t),t,\
  \ s),Y);\nLT_A=subs(LT_A,y(0),1);                             % 初始条件：y(0)=1\nLT_A=subs(LT_A,subs(diff(y(t),\
  \ t), t, 0), 2);   % 初始条件：dy(0)=2\n% 步骤 4. 求解未知变量 Y\nY=solve(LT_A, Y);\ndisp('含初始条件的给定常微分方程的拉普拉斯变换结果：');\
  \ disp(Y)\n% 步骤 5. 计算拉普拉斯逆变换\nSolution_Laplace=ilaplace(Y);\ndisp('使用拉普拉斯变换求得的解：')\n\
  pretty(Solution_Laplace); t=0:.01:13;\nLTsol=eval(vectorize(Solution_Laplace));\n\
  figure, plot(t, LTsol, 'ro-'); xlabel('\\it t'),\nylabel('\\it 解 y(t)')\ntitle('\\\
  it laplace/ilaplace 与 dsolve 解法对比：$$ \\frac{d²y}{dt²}+\\frac{dy}{dt}=sin(t)$$',\
  \ 'interpreter', 'latex');\nhold on\n% dsolve 解法\nsyms t y(t)\nDy=diff(y, t);\n\
  D2y=diff(y, t, 2);\n% 定义给定的常微分方程\nEquation=D2y+Dy==sin(t);\n% 定义初始条件\nICs = [y(0)==1,\
  \ Dy(0)==2];\nY=dsolve(Equation, ICs);\ndisp('使用 dsolve 求得的解：');\npretty(Y);\nt=0:.01:13;\n\
  Y_sol=eval(vectorize(Y));\nplot(t,Y_sol, 'b-', 'linewidth', 2); grid minor\nlegend('\\\
  it laplace+ilaplace', '\\it dsolve', 'location', 'southeast') hold off\n```\n\n\
  从图 1-8 所展示的图形可以清晰地看出，通过拉普拉斯变换的 `laplace()`/`ilaplace()` 函数以及 `dsolve()` 函数求得的解完美吻合。这是因为两个函数都能正确计算解析解。\n\
  \n> **注意**  \n> 在使用 Symbolic MATH Toolbox 函数（`ilaplace()`/`laplace()`、`dsolve()`）求解常微分方程时，建议先引入所有符号变量，然后设定关于自变量的任何假设（例如\
  \ `t`、`Y`）。此外，一个良好的习惯是先指定关于自变量的所有导数，再指定微分方程。示例如下：\n>\n> ```matlab\n> syms t s Y\
  \ y(t) Dy(t)\n> Dy=diff(y, t);                    % 一阶导数\n> D2y=diff(y, t, 2); \
  \               % 二阶导数\n> assume([t, Y]>0);                 % 假设条件\n> Equation=D2y==sin(t)-5*Dy-2*y;\
  \    % 常微分方程表达式\n> ```\n\n> **注意**  \n> 在使用 Symbolic MATH Toolbox 的 `ilaplace`/`laplace`\
  \ 函数时，如何调用给定的常微分方程表达式（即自变量 `t` 和未知变量 `Y`）是可选的。\n\n并非所有非齐次常微分方程（尤其是非线性类型）都能通过 Symbolic\
  \ MATH Toolbox 的 `dsolve()` 和 `ilaplace`/`laplace` 函数明确地计算出解析解。\n\n## 示例 20\n\n\
  给定一个二阶非齐次非线性常微分方程 `2\\ddot{y}+3{\\dot{y}}³-\\left|y\\right|\\cos(t)=2`，其中 `y(0)=0`\
  \ 且 `\\dot{y}(0)=0`。以下是使用拉普拉斯变换与逆拉普拉斯变换的求解脚本（`Laplace_vs_Dsolve_Ex20.m`）：\n\n```matlab\n\
  % Laplace_vs_Dsolve_Ex20.m\nclearvars, clc, close all\n% 步骤 1. 引入符号变量\nsyms t s\
  \ Y y(t)  Dy(t)\nassume([t  Y]>0);\nDy=diff(y, t);\nD2y=diff(y, t, 2);\n% 定义方程\n\
  Equation=2*D2y+3*Dy³==cos(100*t)*abs(y(t))-2;\n% 步骤 2. 拉普拉斯变换\nLT_Y=laplace(Equation,\
  \ t, s);\n% 步骤 3. 代入未知变量 Y 与初始条件\nLT_Y=subs(LT_Y,laplace(y(t),t, s),Y);\nLT_Y=subs(LT_Y,y(0),1);\n\
  LT_Y=subs(LT_Y,subs(diff(y(t), t), t),0);\n% 步骤 4. 求解未知变量 Y\nY=solve(LT_Y, Y);\n\
  % 步骤 5. 计算拉普拉斯逆变换\ndisp('含初始条件的给定常微分方程的拉普拉斯变换结果：'); disp(Y)\nSolution_Laplace=ilaplace(Y);\n\
  disp('使用拉普拉斯变换求得的解：')\npretty(Solution_Laplace)\n%  使用 dsolve() 求解：\nsyms t y(t)\
  \ Dy(t)\nDy=diff(y, t);\nD2y=diff(y, t, 2);\n% 定义方程\nEquation=2*D2y+3*Dy³==cos(100*t)*abs(y(t))-2;\n\
  ICs = [y(0)==0, Dy(0)==0];\nSolution=dsolve(Equation, ICs);\npretty(Solution)\n\
  ```\n\n该脚本（`Laplace_vs_Dsolve_Ex20.m`）在命令窗口产生如下输出（示例 20 的解表达式）：\n\n```\n含初始条件的给定常微分方程的拉普拉斯变换结果：\n\
  (4 + s*laplace(abs(y(t)), t, s - 100*i) + s*laplace(abs(y(t)), t, s + 100*i) - 6*s*laplace(D(y)(t)³,\
  \ t, s))/(4*s³)\n使用拉普拉斯变换求得的解：\n/                3              \\\n| laplace(D(y)(t)\
  \ , t, s)       |\n3 ilaplace| -----------------------, s, t |\n2             |\
  \            2                  |\nt              \\           s               \
  \    /\n-- - ------------------------------------------- +\n2                  \
  \       2\n/ laplace(|y(t)|, t, s - 100 i)       \\\nilaplace| -----------------------------,\
  \ s, t |\n|               2                     |\n\\              s           \
  \           /\n----------------------------------------------- +\n\n/ laplace(|y(t)|,\
  \ t, s + 100 i)       \\\nilaplace| -----------------------------, s, t |\n|   \
  \            2                     |\n\\              s                      /\n\
  \n警告：无法找到显式解。\n()\n```\n\n该输出意味着利用 `laplace()`/`ilaplace()` 和 `dsolve()` 函数工具均未能显式计算得到解析解。\n\
  \n\n\n## 示例 21\n\n给定一个二阶非齐次常微分方程 `2\\ddot{y}+3\\dot{y}-2y=g(t)`，初始条件为 `y(0)=0` 和\
  \ `\\dot{y}(0)=0`，其中 `g(t)` 是一个不连续的强迫函数，定义如下：\n\n```\ng(t)=u_2(t)-u_{10}(t)={\n\
  5,            2<=t<10,\n0,   0<=t<2 and t>=10.\n```\n\n给定方程的拉普拉斯变换如下：\n\n```\nL{2\\\
  ddot{y}+3\\dot{y}-2y}=L{u_2(t)-u_{10}(t)}\n```\n\n```\n2s²Y(s)-2s*y(0)-2*\\dot{y}(0)+3sY(s)-y(0)-2Y(s)=5(e^{-2s}-e^{-10s})/s\n\
  ```\n\n```\nY(s)=5(e^{-2s}-e^{-10s})/(s(2s²+3s-2))\n```\n\n请注意，`e^(-2s)` 和 `e^(-10s)`\
  \ 在系统输出信号中被解释为时间延迟；换句话说，-2 和 -10 分别表示 2 秒和 10 秒的时间延迟。5 是赫维赛德（阶跃）函数的幅值。\n\n公式 `Y(s)`\
  \ 是微分方程在 `s` 域中的解，但我们需要时域中的解，因此需要计算其逆拉普拉斯变换，例如 `L^{-1}{Y(s)}=y(t)`。通过使用 `ilaplace()`，我们创建了以下简短脚本（`iLaplace_Ex21.m`），用于求解给定问题并计算其解析解和数值解：\n\
  \n```\n% iLaplace_Ex21.m\nsyms t s\n% 求解带有不连续强迫函数的二阶非齐次常微分方程\nF=5*(exp(-2*s)-exp(-10*s))/s;\
  \ % 强迫函数\nY=2*s²+s+2;                  % 常微分方程\nTF=F/Y;                       %\
  \ 方程\nTFt=ilaplace(TF);             % 逆拉普拉斯变换\npretty(TFt);                  % 显示\n\
  Sol=vectorize(TFt);           % 向量化\nt=linspace(0, 20, 400);       % t 空间（自变量）\n\
  S=eval(Sol);                  % 计算数值解\nplot(t, S, 'b-', 'linewidth', 2);\ngrid minor\n\
  title('\\it 求解: $$ 2*\\frac{d²y}{dt²}+3*\\frac{dy}{dt}-2*y=g(t) $$', 'interpreter',\
  \ 'latex')\nStr='\\it g(t) 是不连续的强迫函数';\ntext(7.5, 3.75, Str, 'backgroundcolor',\
  \ [1 1 1]);\ngrid on, xlabel('\\it t ')\nylabel('\\it 解, y(t) '), shg\n```\n\n执行脚本\
  \ `iLaplace_Ex21.m` 后，我们得到如图 1-9 所示的解曲线图，同时在命令窗口中显示了解的表达形式。\n\n![../images/490522_1_En_1_Chapter/490522_1_En_1_Fig9_HTML.png](img/490522_1_En_1_Fig9_HTML.png)\n\
  \n**图 1-9**  承受不连续强迫函数的二阶非齐次常微分方程仿真\n\n```\n>> pretty(TFt)\n/                / \
  \            1/2         \\       \\\n|    /       t \\ |           15    sin(#1)\
  \ |       |\n| exp| 5/2 - - | | cos(#1) + ------------- |       |\n|    \\     \
  \  4 / \\                15       /       |\n5 heaviside(t - 10) | ------------------------------------------\
  \ - 1/2 | -\n\\                     2                            /\n/          \
  \      /             1/2         \\       \\\n|    /       t \\ |           15 \
  \   sin(#2) |       |\n| exp| 1/2 - - | | cos(#2) + ------------- |       |\n| \
  \   \\       4 / \\                15       /       |\n5 heaviside(t - 2) | ------------------------------------------\
  \ - 1/2 |\n\\                     2                            /\n其中\n1/2\n15  \
  \  (t - 10)\n#1 == --------------\n\n1/2\n15    (t - 2)\n#2 == -------------\n```\n\
  \n从前面的练习中可以看出，使用拉普拉斯变换 (`laplace()/ilaplace()`) 计算受外部强迫函数（可能不连续）作用的非齐次常微分方程的解析解相对简单快捷。这类练习常见于控制工程环境中。此外，请注意，在求解常微分方程时，拉普拉斯变换和逆拉普拉斯变换\
  \ (`laplace()/ilaplace()`) 的实现非常直接。使用它们求得的常微分方程解与使用 `dsolve()` 求得的解完全匹配。如前所述，许多常微分方程无法使用\
  \ `laplace()/ilaplace()` 和 `dsolve()` 函数解析求解。因此，数值方法是唯一的选择。\n\n"
- '# 一阶常微分方程的数值方法


  本章专门探讨使用数值方法求解常微分方程的初值问题。我们将使用的方法包括欧拉法、龙格-库塔法、亚当斯法、泰勒法、米尔恩法和亚当斯-莫尔顿法。具体来说，我们将评估它们的精度和效率。在这些方法中，欧拉法是最简单的一种，实际上包含多种类型，例如前向、后向和改进（修正）欧拉法。


  ## 欧拉法


  如前所述，有三种不同的欧拉法用于计算初值问题的数值解。它们是前向欧拉法、改进欧拉法和后向欧拉法；其中最简单的是前向法。


  前向欧拉法表述如下：


  ```

  {

  y_i = y_{i-1} + hk

  k = f(t_{i-1}, y_{i-1})

  t_i = t_{i-1} + h

  ```


  其中 `y[0] = y(t[0])`，且 `i = 1, 2, 3, …, N`。式 (2-1) 所示的前向法可以通过以下算法实现数值搜索解：


  步骤 1. 定义 `f(t, y)`。


  步骤 2. 输入初始条件：`t[0]` 和 `y[0]`。


  步骤 3. 输入步长 `h` 和步数 `N`。


  步骤 4. 输出 `t[0]` 和 `y[0]`。


  步骤 5. 对 `i` 从 `1` 到 `N`，执行步骤 6 和步骤 7。


  步骤 6.


  ```

  k = f(t, y)

  y = y + hk

  t = t + h

  ```


  步骤 7. 输出 `t` 和 `y`。


  步骤 8. 结束。


  有时步骤 6 不易理解，在实现上也可能存在困难。该步骤可以用以下表达式更明确地解释：


  ```

  y_1 = y_0 + f(t_0, y_0)(t_1 - t_0)

  y_2 = y_1 + f(t_1, y_1)(t_2 - t_1)

  y_3 = y_2 + f(t_2, y_2)(t_3 - t_2)

  ```


  因此，我们可以表述如下：


  ```

  y_{i+1} = y_i + f(t_i, y_i)(t_{i+1} - t_i)

  ```


  其中 `i = 1, 2, 3, …, N`。


  如果引入等间距步长 `h = t_1 - t_0 = t_2 - t_1 = …`，则 `y[i+1] = y[i] + f[i]h`，其中 `i = 1, 2,
  3, …, N`。




  ### 示例 1


  以下是示例问题：`˙y + 2y - e^{-t} = 3`，初始条件（ICs）为：`y(0) = 1`。


  为了计算给定一阶非齐次常微分方程问题在 `t = 0...10` 范围内的数值解，我们取 `h = 0.05`（时间步长），并将给定问题方程重写为 `˙y =
  3 - 2y + e^{-t}`，该式也可写作 `f(t, y) = 3 - 2y + e^{-t}`。


  当 `t[0] = 0` 时，


  `y_0 = 1`


  当 `t[1] = 0.05` 时，


  `y[0] = 1`，`k = f(t[0], y[0]) = 3 - 2 * 1 + e⁰ = 2`


  `y[1] = y[0] + h * k = 1 + 0.05 * 2 = 1.1`


  当 `t[2] = 0.1` 时，


  `y[1] = 1.1`，`k = f(t[1], y[1]) = 3 - 2 * 1.1 + e^{-0.1} = 1.7512`


  `y_2 = y_1 + k*h = 1.1 + 1.7512 * 0.05 = 1.1876`


  …


  现在，基于我们推导出的内容，我们将脚本（`Example1.m`）整合起来，以获得该问题的完整数值解，如下所示：


  ```

  % Example1.m

  %% 欧拉前向法。

  % 第 1 部分

  clc; clearvars; close all;

  t0=0;                  % 初始时间

  tend=10;               % 结束时间

  h=.05;                 % 时间步长

  t=t0:h:tend;           % 仿真时间范围

  steps=length(t)-1;     % 步数

  y0=1;                  % 初始条件 y0 在 t0 处

  f=zeros(size(t));      % 内存分配

  y1=[y0, f(1, end-1)];  % 内存分配

  for ii=1:steps

  f(ii)=3+exp(-t(ii))-2*y1(ii);

  y1(ii+1)=y1(ii)+f(ii)*h;

  end

  plot(t, y1, ''b-'', ''linewidth'', 1.5), grid on

  xlabel(''\it t'')

  ylabel(''\it y(t)'')

  hold on

  ```


  ## 改进欧拉法


  改进欧拉法在某些文献中被称为*修正欧拉法*或*休恩法*。它是一种显式方法，其实现方式与前向欧拉法类似，但第 6 步除外。其第 6 步的实现如下所示：


  `y_{i+1} = y_i + (f(t_i, y_i) + f(t_i + h, y_i + h*f_i)) * h/2`； (2-2)


  方程（2-2）所示的改进欧拉法，通过以下算法在数值搜索解答中实现：


  第 1 步。定义 `f(t, y)`。


  第 2 步。输入初始条件：`t[0]` 和 `y[0]`。


  第 3 步。输入步长 `h` 和步数 `N`。


  第 4 步。输出 `t[0]` 和 `y[0]`。


  第 5 步。对于从 `1` 到 `N` 的 `i`，执行第 6 步和第 7 步。


  第 6 步。


  `k_1 = f(t_i, y_i)`


  `k_2 = f(t_i + h, y_i + h*k_1)`


  `y_i = y_i + (k_1 + k_2) * h/2`


  `t = t + h`


  第 7 步。输出 `t` 和 `y`。


  第 8 步。结束。


  在此方法中，第 6 步与前向欧拉法中所给出的步骤略有不同。该步骤可以通过以下表达式更明确地解释。以上述常微分方程问题的示例可以重写此过程，使其表达式更明确：`˙y
  + 2y - e^{-t} = 3`，`y(0) = 1`。


  `k_{1,i} = f(t_i, y_i) = 3 + e^{-t_i} - 2y_i;`


  `k_{2,i} = f(t_i + h, y_i + h * k_{1,i}) = 3 + e^{-(t_i + h)} - 2(y_i + h*k_{1,i});`


  `y_{i+1} = y_i + (k_{1,i} + k_{2,i}) * (h/2).`


  我们不一定需要 `[t[i+1] = t[i] + h]`，换句话说，根据参考文献 [1]，区间内不必采用均匀时间步长。可变步长求解器也将在后续章节中讨论。该方法的所有描述步骤均在脚本
  `Example1.m` 的第 2 部分中实现，如下所示：


  ```

  %% 欧拉改进法或休恩法。

  % 第 2 部分

  %{

  y(n+1)=y(n)+( f(tn,y(n)) + f(tn+h, y(n)+h*fn) )*0.5*h;

  或使用不同的表达式（第 6 步与欧拉法不同）：

  k1 =f(t,y) = 3+exp(-t(ii))-2*y(ii);

  k2 =f(t+h, y+h*k1) = 3 + exp(-(t(ii)+h))-2*(y(ii)+h*k1);

  y(ii+1) = y(ii)+(h/2)*(k1(ii)+k2(ii))

  %}

  f(1) = 3 + exp(-t(1))-2*y0;

  f=[f(1), zeros(1, steps-1)];   % 内存分配

  y2=[y0, zeros(1, steps-1)];    % 内存分配

  for jj=1:steps

  f(jj+1)=3+exp(-(t(jj)+h))-2*(y2(jj)+h*f(jj));

  y2(jj+1)=y2(jj)+(f(jj)+f(jj+1))*.5*h;

  end

  plot(t,y2, ''k--'', ''linewidth'',1.5)

  ```




