  ### 二阶常微分方程组和常微分方程组


  有许多过程和现象通过二阶微分方程表达，例如弹簧质量系统的简谐运动、具有一定加速度的物体运动（牛顿第二定律）、阻尼振动、电阻-电容-电感电路中的电流等。一般形式下，二阶常微分方程以两种不同形式表达：齐次形式，如方程
  (1-4) 所示；非齐次形式，如方程 (1-5) 所示。


  `![$$ \ddot{y}+p(x)\dot{y}+q(x)y=0 $$](img/490522_1_En_1_Chapter_TeX_Equ3.png)`


  (1-4)


  `![$$ \ddot{y}+p(x)\dot{y}+q(x)y=g(x) $$](img/490522_1_En_1_Chapter_TeX_Equ4.png)`


  (1-5)


  注意，方程 1-4 中的齐次常微分方程总是有一个平凡解，即 `y(x) = 0`，它满足方程 1-4 中给出的方程。关于独立函数 `p(x)`、`q(x)` 和
  `g(x)`，常微分方程可能是线性的或非线性的。在某些情况下，独立函数 `p(x)`、`q(x)` 和 `g(x)` 可能是常数值或非常数值。


  让我们考虑几个例子，使用 MATLAB 的符号数学工具箱通过二阶常微分方程计算通解和特解。


