  ## 示例 6


  示例问题如下：![$$ {e}^{0.01t}+\dot{y}{e}^y=2 $$](img/490522_1_En_6_Chapter_TeX_IEq33.png)，*y*(0)
  = 2。


  我们首先将方程重写为隐式或微分代数方程的形式。


  ![$$ 2-\left({e}^{0.01t}+\dot{y}{e}^y\right)=0 $$](img/490522_1_En_6_Chapter_TeX_Eque.png)


  也可以表述如下：


  ![$$ 2-\left({e}^{0.01t}+\frac{dy}{dt}{e}^y\right)=0 $$](img/490522_1_En_6_Chapter_TeX_Equf.png)


  该方程包含三个参数：![$$ t,y,\mathrm{和}\ \frac{dy}{dt} $$](img/490522_1_En_6_Chapter_TeX_IEq34.png)，可以通过匿名函数
  (`@`) 表达。完整的仿真模型位于名为 `IMPLICIT_1ODE_EX6.m` 的文件中，该文件调用图 6-9 所示的 Simulink 模型 `IMPLICIT_1ODE_Ex6_sim.mdl`。该练习的仿真结果如图
  6-10 所示。


  ![../images/490522_1_En_6_Chapter/490522_1_En_6_Fig9_HTML.jpg](img/490522_1_En_6_Fig9_HTML.jpg)


  图 6-9


  针对问题 ![$$ {e}^{0.01t}+\dot{y}{e}^y=2 $$](img/490522_1_En_6_Chapter_TeX_IEq35.png)
  的 Simulink 模型 `IMPLICIT_1ODE_Ex6_sim.mdl`


  ```

  % IMPLICIT_1ODE_EX6.m

  % 示例 6\. exp(.01*t)+y''*exp(y)=2 初始条件：y(0)=2

  clearvars; close all

  Fun=@(t, y, dy)(2-(exp(.01*t)+dy*exp(y)));

  y0=2; dy0=1/2; t0=0; F_aty0=1;

  [y0, dy0]=decic(Fun,t0, y0, dy0, F_aty0, [] );

  tspan=[0, 130];

  [time, y]=ode15i(Fun, tspan, y0, dy0, []);

  plot(time, y, ''bd-''), grid minor

  title(''解： $$ e^{0.01*t}+\frac{dy}{dt}*e^y=2 $$'', ... ''interpreter'', ''latex'')

  xlabel ''\it t'', ylabel ''\it y(t)''

  % dsolve

  yt=dsolve(''2-(exp(.01*t)+Dy*exp(y))=0'', ''y(0)=2'');

  Yt=vectorize(yt);

  t=time;

  Yt=eval(Yt);

  hold on; plot( t, Yt, ''mx--'', ''linewidth'', 1.5), ylim([-.4 4])

  % Simulink 模型在时间跨度 0...130 秒内执行。

  [time,y]=sim(''IMPLICIT_1ODE_EX6_sim'', [0, 130]);

  plot(time, y, ''k-'', ''linewidth'', 1.5)

  legend(''ode15i'',''dsolve：解析解'',''SIMULINK'', ... ''location'', ''best''), shg

  ```


  Simulink 模型 (`IMPLICIT_1ODE_Ex6_sim.mdl`) 是基于问题公式 ![$$ \frac{dy}{dt}=\left(2-{e}^{0.01t}\right){e}^y
  $$](img/490522_1_En_6_Chapter_TeX_IEq36.png) 构建的。请注意，初始条件 *y*(0) = 2 是通过积分器模块作为内部源实现的，所有误差容限保持不变。


  ![../images/490522_1_En_6_Chapter/490522_1_En_6_Fig10_HTML.png](img/490522_1_En_6_Fig10_HTML.png)


  图 6-10


  问题仿真结果：![$$ {e}^{0.01t}+\dot{y}{e}^y=2 $$](img/490522_1_En_6_Chapter_TeX_IEq37.png)，*y*(0)
  = 2


  前述使用 `ode15i` 和 `decic` 的程序和脚本，以及通过调整初始条件来计算隐式定义（真正隐式或为演示目的“刻意”视为隐式常微分方程）的一阶和二阶常微分方程数值解的
  Simulink 建模方法，也适用于高阶隐式常微分方程（或微分代数方程）和常微分方程组。从前面的示例可以得出结论，Simulink 建模是求解隐式定义常微分方程或微分代数方程的一个良好替代方案，只需在初始条件设置以及必要时对求解器设置进行调整即可。




  '
- "# 7. 常微分方程求解方法的比较分析\n\n在前几章中，我们讨论了求解一阶、二阶、高阶及耦合常微分方程初值问题的几种不同方法及 MATLAB/Simulink\
  \ 内置函数，这些方程有显式定义和隐式定义两种形式，并给出了相应示例。综合所有讨论过的方法，我们可以概括出六种利用 MATLAB/Simulink 工具、函数、工具箱以及脚本编写来求解初值问题的不同途径。\n\
  \n*   使用符号数学工具箱中的 `dsolve()` 进行解析解搜索\n*   使用符号数学工具箱中名为 `laplace` 和 `ilaplace` 的拉普拉斯变换进行解析解搜索\n\
  *   使用 MuPAD 笔记（符号数学工具箱）结合 `ODE` 和 `ODE::SOLVE` 进行解析解搜索\n*   使用内置 ODEx 求解器进行数值解搜索，例如：`ode15s`、`ode23`、`ode45`、`ode113`\
  \ 等\n*   使用 Simulink 模型进行数值解搜索，该模型包含几种不同的固定步长与变步长求解器，例如：`ode2`、`ode4`、`ode8`、`ode15s`、`ode45`\
  \ 等\n*   通过基于欧拉法、休恩法、米尔恩法、亚当斯-巴什福思法、亚当斯-莫尔顿法、龙格-库塔法、泰勒级数展开法及其他方法编写脚本进行数值解搜索\n\n\
  接下来，我们通过求解下列二阶显式定义的非齐次常微分方程来展示所有六种方法，然后比较结果的精度与效率。\n\n\n\n### 示例 1\n\n以下是示例问题：![$$\
  \ \\ddot{y}+\\dot{y}+3y=\\sin (5t) $$](img/490522_1_En_7_Chapter_TeX_IEq1.png),\
  \ ![$$ \\dot{y}(0)=-2;y(0)=3\\. $$](img/490522_1_En_7_Chapter_TeX_IEq2.png)\n\n\
  我们首先采用两种方法：使用`dsolve()`进行解析求解，以及使用符号数学工具箱中的`laplace`和`ilaplace`工具。该练习的解决方案可在 `COMPARE_ODE_Solvers.m`、`COMPARE_ODE_Solvers_MUPAD.mn`\
  \ 和 `COMPARE_ODE_Solvers_sim.slx` 文件中找到。脚本 `COMPARE_ODE_Solvers.m` 使用以下方法进行计算：`dsolve()`、`laplace/ilaplace`、`ode45/ode113`\
  \ 以及欧拉/亚当斯-莫尔顿方法。该脚本从 Simulink 模型（`COMPARE_ODE_Solvers_sim.slx`，如图 7-5 所示）中调用使用\
  \ `ode8` 的数值解。根据解析公式计算得到的数值解显示在图 7-1 和 7-2 中。\n\n![../images/490522_1_En_7_Chapter/490522_1_En_7_Fig1_HTML.png](img/490522_1_En_7_Fig1_HTML.png)\n\
  \n**图 7-1** 使用 `dsolve()` 以及 `laplace` 和 `ilaplace` 计算的解析解\n\n```\n% COMPARE_ODE_Solvers.m\n\
  close all; clearvars\n% Part 1\n%% 1st Solution Approach: DSOLVE\nsyms t s Y y(t)\n\
  Dy=diff(y, t);\nD2y=diff(y, t, 2);\nEquation = D2y==sin(5*t)-Dy-3*y;\nICs = [y(0)==3,\
  \ Dy(0)==-2];\nSolution_dsolve=dsolve('D2y+Dy+3*y-sin(5*t)=0', 'y(0)=3','Dy(0)+2=0');\n\
