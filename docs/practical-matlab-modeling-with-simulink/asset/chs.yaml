  `auto`。


  ![../images/490522_1_En_6_Chapter/490522_1_En_6_Fig5_HTML.jpg](img/490522_1_En_6_Fig5_HTML.jpg)


  **图 6-5**  求解 ![$$ {e}^{\ddot{x}}+\ddot{x}+x=0 $$](img/490522_1_En_6_Chapter_TeX_IEq28.png)
  的 Simulink 模型 `IMPLICIT_2ODE_EX4_sim.mdl`


  **注意：** 最新版本的 Simulink 有一个名为 `DAESSC` 的 DAE 求解器，该求解器旨在与 Simulink 的 Simscape Toolbox
  一起使用。


  `ode15i` 和 Simulink 模型的仿真结果（如图 6-6 所示）表明，计算出的解收敛得非常好。


