  ### 波动方程


  波动方程是一个二阶偏微分方程，用于描述声波、机械波和光波等波的传播。它广泛应用于力学、声学、电磁学和流体动力学计算中。与热方程不同，波动方程可能包含多个空间变量（`x[1]`，`x[2]`，`x[3]`，…，`x[n]`）以及时间变量
  `t`。


  一个通用的波动方程表述如下：


  ![$$ \frac{\partial²u}{\partial {t}²}={c}²\left(\frac{\partial²u}{\partial {x_1}²}+\frac{\partial²u}{\partial
  {x_2}²}+\frac{\partial²u}{\partial {x_3}²}+\dots +\frac{\partial²u}{\partial {x_n}²}\right)
  $$](img/490522_1_En_13_Chapter_TeX_Equ19.png)


  (13-18)


  其中 `c` 是一个固定的非负（波传播速度）实系数。波动方程还有另一种更紧凑的表述形式，它使用了拉普拉斯算子 `∇`，如下所示：


  ![$$ \frac{\partial²u}{\partial {t}²}={c}²{\nabla}²u $$](img/490522_1_En_13_Chapter_TeX_Equ20.png)


  (13-19)




  '
- "# 求解一维波动方程\n\n一维空间（仅相对于`x`空间变量）的波动方程可表述如下：\n\n![](img/490522_1_En_13_Chapter_TeX_Equ21.png)\n\
  \n(13-20)\n\n方程(13-20)描述了仅沿`x-y`平面发生的一维波动；该方程由法国科学家让·勒朗·达朗贝尔[3]发现。让我们以胡克定律中弹簧振动的例子，来演示一维波动方程的数值模拟。实际上，根据牛顿定律和胡克定律[4]，我们可以推导出一维偏微分波动方程。假设存在一个由有限质量`m`组成的阵列，这些质量通过长度为`Δx`的无质量弹簧相互连接，并假设弹簧单元具有均匀的弹性常数`k`。\n\
  \n![](img/490522_1_En_13_Fig13_HTML.jpg)\n\n图 13-13  \n从牛顿定律和胡克定律推导波动方程\n\n图 13-13\
  \ 显示了通过均匀刚性弹簧/弦相互连接的质量单元。质量单元的位移`u(x)`衡量了沿弹簧单元传播的应变（波）的幅度。利用图 13-13 所示系统的自由体受力图，我们可以根据牛顿定律和胡克定律（在`x`和`x\
  \ + 2Δx`处）[4]计算出在`x + Δx`处质量单元上产生/扰动的力，如下所示：\n\n![](img/490522_1_En_13_Chapter_TeX_Equ22.png)\n\
  \n(13-21)\n\n![](img/490522_1_En_13_Chapter_TeX_Equ23.png)\n\n(13-22)\n\n![](img/490522_1_En_13_Chapter_TeX_Equ24.png)\n\
  \n(13-23)\n\n现在，我们基于在`x`、`x + 2Δx`处计算的力的有限差分（根据胡克定律），计算`x + Δx`处的力，如方程(13-22)和(13-23)所示。\n\
  \n![](img/490522_1_En_13_Chapter_TeX_Equ25.png)\n\n(13-24)\n\n此外，通过将方程(13-21)中根据牛顿定律计算出的`x\
  \ + Δx`处的力与方程(13-24)中根据胡克定律计算出的力进行等量代换，我们可以写出下式：\n\n![](img/490522_1_En_13_Chapter_TeX_Equ26.png)\n\
  \n(13-25)\n\n方程(13-25)的表述可以进行改写，条件是`n`个质量均匀分布，即`L = nΔx`；总质量(`M`)沿`n`个节点均匀分布（`M\
  \ = nm`）；并且总弹簧刚度(`k`)均匀分布（`K = k/n`）。\n\n![](img/490522_1_En_13_Chapter_TeX_Equ27.png)\n\
  \n(13-26)\n\n考虑当`Δx`趋近于无穷小（`Δx → 0`）且`n`趋近于无穷大（`n → ∞`）的情况，我们可以将方程(13-26)重写为更紧凑和连续的形式，如下所示：\n\
  \n![](img/490522_1_En_13_Chapter_TeX_Equ28.png)\n\n(13-27)\n\n其中方程的常数部分 ![](img/490522_1_En_13_Chapter_TeX_IEq2.png)\
  \ 是波传播速度，它取决于弹簧的刚度和长度以及弦/弹簧的质量值。注意，通过将 ![](img/490522_1_En_13_Chapter_TeX_IEq3.png)\
  \ 代入方程(13-27)，我们得到方程(13-20)，即二维波动方程。\n\n通过对方程(13-27)进行离散化，并将其左右两边的偏导数替换为有限（近似）差分，我们可以写出以下方程：\n\
  \n![](img/490522_1_En_13_Chapter_TeX_Equ29.png)\n\n(13-28)\n\n![](img/490522_1_En_13_Chapter_TeX_Equ30.png)\n\
  \n(13-29)\n\n通过令方程(13-28)和方程(13-29)相等，我们可以写出方程(13-27)的一个代数或离散化形式。\n\n![](img/490522_1_En_13_Chapter_TeX_Equ31.png)\n\
  \n(13-30)\n\n通过求解方程(13-30)得到 ![](img/490522_1_En_13_Chapter_TeX_IEq4.png)，我们可以构建数值计算的递归算法。\n\
  \n![](img/490522_1_En_13_Chapter_TeX_Equ32.png)\n\n(13-31)\n\n通过将常数项 ![](img/490522_1_En_13_Chapter_TeX_IEq5.png)\
  \ 和 ![](img/490522_1_En_13_Chapter_TeX_IEq6.png) 替换为 `C²`（`C`被称为库朗数[5]），我们可以重写方程(13-31)，如下所示：\n\
  \n![](img/490522_1_En_13_Chapter_TeX_Equ33.png)\n\n(13-32)\n\n\n\n### 示例 4\n\n让我们看一个关于弹性弦的数值算例，弦长\
  \ 20 [m]，均匀刚度 100 [Nm]，均匀分布质量为 2 kg。弦的两端无位移。所有三种情况的仿真周期均为 `T=30` [s]。考虑以下三种扰动情况：\n\
  \n-   左侧（第五、第六和第七）节点上存在的微小位移扰动：`u[3] = 0.05`，`u[4] = 0.5`，以及 `u[5] = 0.05`\n-  \
  \ 从弦中心施加的正弦激励力：`u[100] = 0.5 * sin(10 * pi * t / T)`，其中 `T = 30` [s]\n-   组合扰动：`u[3]\
  \ = 0.05`，`u[4] = 0.1`，以及 `u[5] = 0.05`，并且 `u[100] = 0.5 * sin(10 * pi * t / T)`，其中\
  \ `T = 30` [s]\n\n通过使用方程 (13-31) 并为每种情况分配零边界条件和扰动，我们可以编写以下脚本，命名为 `Wave_Propagation_1D.m`：\n\
  \n```\n%% 弦中的波传播 - 弹簧-质量系统仿真（胡克定律）：\nclearvars; clc;\n% 给定参数\nk = 100;         \
  \            % [Nm] 刚度\nmass=2;                      % [kg] 质量\nLx = 20;       \
  \              % [m] 弦长\ndx=.1;                       % [m] 节点间距\nNodes=Lx/dx; \
  \                % 节点数量\nx = linspace(0, Lx, Nodes);\nK = k/Nodes;\nc = K*Lx²*dx²/mass;\n\
  dt=0.05;                     % 仿真时间步长\nu = zeros(Nodes,1);          % 边界条件\num1=\
  \ u;\nup1 = u;\nC = c*dt/dx;                 % 波传播速度\nt=0;                     \
  \    % 仿真开始时间\nT=30;                        % 仿真周期\nCase = input('输入案例编号 (1, 2,\
  \ 3)：   ');\nif Case==1\n% 微小扰动：\nu(5:7)=[0.05 0.5 0.05];   % 案例 1\nup1(:)=u(:);\n\
  while t<T\n% 时间演化：\nt=t+dt;\n% 保存迭代结果：\nun1=u; u=up1;\nfor ii=2:Nodes-1\nup1(ii)=(C²)*(u(ii+1)-2*u(ii)+u(ii-1))\
  \ - un1(ii)+2*u(ii);\nend\nclf;\nplot(x, u, 'g-o', 'linewidth', 1), shg\nend\nelseif\
  \ Case == 2\nu(5:7)=0;                        % 案例 2\nup1(:)=u(:);\nwhile t<T\n\
  t=t+dt;\n% 保存仿真结果：\nun1=u; u=up1;\n% 扰动源：\nu(100)=0.5*sin(10*pi*t/T);\nfor ii=2:Nodes-1\n\
  up1(ii)=(C²)*(u(ii+1)-2*u(ii)+u(ii-1)) - un1(ii)+2*u(ii);\nend\nclf;\nplot(x, u,\
  \ 'k-o', 'linewidth', 1), shg\nend\nelse   % 案例 3\nu(5:7)=[0.05 0.5 0.05];\nup1(:)=u(:);\n\
  while t<T\nt=t+dt;\n% 保存仿真结果：\nun1=u; u=up1;\n% 扰动源：\nu(100)=0.5*sin(10*pi*t/T);\n\
  for ii=2:Nodes-1\nup1(ii)=(C²)*(u(ii+1)-2*u(ii)+u(ii-1)) - un1(ii)+2*u(ii);\nend\n\
  clf;\nplot(x, u, 'r-o', 'linewidth', 1), shg\nend\nend\nxlabel('\\it x 空间, [m]')\n\
  ylabel('\\it u(t, x) 位移, [m]')\ntitle(['\\it t = '  num2str(T) '  [s] 后的波传播。', ...\n\
  '案例 # '  num2str(Case)])\ngrid on\n```\n\n该脚本提供了三种情况下仿真结果的动画图。图 13-14、13-15 和 13-16\
  \ 展示了脚本的仿真结果。\n\n![../images/490522_1_En_13_Chapter/490522_1_En_13_Fig14_HTML.png](img/490522_1_En_13_Fig14_HTML.png)\n\
  \n图 13-14：一维波传播问题，案例 1\n\n![../images/490522_1_En_13_Chapter/490522_1_En_13_Fig15_HTML.png](img/490522_1_En_13_Fig15_HTML.png)\n\
  \n图 13-15：一维波传播问题，案例 2\n\n![../images/490522_1_En_13_Chapter/490522_1_En_13_Fig16_HTML.png](img/490522_1_En_13_Fig16_HTML.png)\n\
  \n图 13-16：一维波传播问题，案例 3\n\n## 求解二维波动方程\n\n让我们考虑一个无扰动源区域的二维波动方程，其形式如下：\n\n![$$ \\\
  frac{\\partial²u\\left(x,y,t\\right)}{\\partial {t}²}={c}²\\left(\\frac{\\partial²u\\\
  left(x,y,t\\right)}{\\partial {x}²}+\\frac{\\partial²u\\left(x,y,t\\right)}{\\partial\
  \ {y}²}\\right)+f $$](img/490522_1_En_13_Chapter_TeX_Equ34.png)\n\n(13-33)\n\n通过对方程\
  \ (13-33) 进行离散化，我们可以写出下一个方程：\n\n![$$ \\frac{u_{i,j}^{n+1}-2{u}_{i,j}^n+{u}_{i,j}^{n-1}}{\\\
  Delta {t}²}\\approx {c}²\\left(\\frac{u_{i+1,j}^n-2{u}_{i,j}^n+{u}_{i-1,j}^n}{\\\
  Delta {x}²}+\\frac{u_{i,j+1}^n-2{u}_{i,j}^n+{u}_{i,j-1}^n}{\\Delta {y}²}\\right)+{f}_i^n\
  \ $$](img/490522_1_En_13_Chapter_TeX_Equ35.png)\n\n(13-34)\n\n为简单起见，我们设置 `Δx = Δy`\
  \ 并重写方程 (13-34)。\n\n![$$ {u}_{i,j}^{n+1}=2{u}_{i,j}^n-{u}_{i,j}^{n-1}+{\\left[c\\\
  frac{\\Delta t}{\\Delta x}\\right]}²\\left({u}_{i+1,j}^n-4{u}_{i,j}^n+{u}_{i-1,j}^n+{u}_{i,j+1}^n+{u}_{i,j-1}^n\\\
  right)+\\Delta {t}²\\ {f}_i^n $$](images/490522_1_En_13_Chapter/490522_1_En_13_Chapter_TeX_Equ36.png)\n\
  \n(13-35)\n\n方程 (13-35) 是计算二维波传播的递归算法。\n\n以下是狄利克雷边界条件：\n\n![$$ u\\left(0,y,t\\right)=0,u\\\
  left( Lx,y,t\\right)=0\\ \\mathrm{and}\\ u\\left(x,0,t\\right)=0,u\\left(x, Ly,t\\\
  right)=0 $$](img/490522_1_En_13_Chapter_TeX_Equ37.png)\n\n(13-36)\n\n此外，为了吸收/阻止沿四个边界的传播波，让我们考虑以下零边界条件：\n\
  \n![$$ {\\left.\\frac{\\partial u}{\\partial x}\\right|}_{x=0}=c{\\left.\\frac{\\\
  partial u}{\\partial t}\\right|}_{x=0},{\\left.\\frac{\\partial u}{\\partial x}\\\
  right|}_{x= Lx}=-c{\\left.\\frac{\\partial u}{\\partial t}\\right|}_{x= Lx}\\ \\\
  mathrm{and}\\ {\\left.\\frac{\\partial u}{\\partial y}\\right|}_{y=0}=c{\\left.\\\
  frac{\\partial u}{\\partial t}\\right|}_{y=0},{\\left.\\frac{\\partial u}{\\partial\
  \ y}\\right|}_{y= Ly}=-c{\\left.\\frac{\\partial u}{\\partial t}\\right|}_{y= Ly}\
  \ $$](img/490522_1_En_13_Chapter_TeX_Equ38.png)\n\n(13-37)\n\n通过考虑先前编写的边界条件，引入 `C²\
  \ = [c * Δt / Δx]²`，并使用离散化后的方程 (13-34)，我们可以写出以下方程：\n\n![$$ {u}_{1,j}^{n+1}=2{u}_{2,j}^n+\\\
  frac{C²-1}{C²+1}\\left[{u}_{2,j}^{n+1}-{u}_{1,j}^n\\right] $$](images/490522_1_En_13_Chapter/490522_1_En_13_Chapter_TeX_Equ39.png)\n\
  \n(13-38)\n\n![$$ {u}_{i,1}^{n+1}=2{u}_{i,2}^n+\\frac{C²-1}{C²+1}\\left[{u}_{i,2}^{n+1}-{u}_{i,1}^n\\\
  right] $$](images/490522_1_En_13_Chapter/490522_1_En_13_Chapter_TeX_Equ40.png)\n\
  \n(13-39)\n\n![$$ {u}_{n_x,j}^{n+1}=2{u}_{n_x-1,j}^n+\\frac{C²-1}{C²+1}\\left[{u}_{n_x-1,j}^{n+1}-{u}_{n_x,j}^n\\\
  right] $$](images/490522_1_En_13_Chapter/490522_1_En_13_Chapter_TeX_Equ41.png)\n\
  \n(13-40)\n\n![$$ {u}_{i,{n}_y}^{n+1}=2{u}_{i,{n}_y-1}^n+\\frac{C²-1}{C²+1}\\left[{u}_{i,{n}_y-1}^{n+1}-{u}_{i,{n}_y}^n\\\
  right] $$](images/490522_1_En_13_Chapter/490522_1_En_13_Chapter_TeX_Equ42.png)\n\
  \n(13-41)\n\n其中 `C` 是波传播速度，也称为库朗数。\n\n\n好的，作为高级文档工程师和翻译员，我将遵循您的指示，准确翻译以下文本。\n\n\n\
  ## 示例 5\n\n我们以一个 5 米 x 5 米、采用狄利克雷边界条件的弹性板为例。该板中心受到一个正弦力 *f* = 0.5 *sin* (1.5*πt*)\
  \ 的激励。波传播速度为 *c* = 0.25。\n\n以下是该练习的解决方案脚本，名为 `Wave_Propagation_2D.m`：\n\n```\n%\
  \ 2D Wave propagation problem simulation\nclearvars; clc\n% Given parameters:\n\
  Lx = 5;  % Length along x axis\nLy=Lx;   % Length along y axis\ndx=.05;  % Mesh\
  \ size along x axis\ndy=dx;   % Mesh size along y axis\nNx = Lx/dx;   % Number of\
  \ node points along x axis\nNy=Nx;         % Number of node points along y axis\n\
  x=linspace(0, Lx, Nx);\ny=x;\n% Simulation period:\nT=50;\n% Displacement:\nun =\
  \ zeros(Nx, Ny);    % Memory allocation\nunm1=un;\nunp1 =un;\nC  =0.25;      % Courant\
  \ number\nc  = 1;        % Wave propagation speed\ndt=C*dx/c;     % Time increment\n\
  t=0;           % Initial simulation time value\n% Simulation Loop:\nwhile t<T\n\
  % Boundary conditions:\nun(:, [1,end])  = 0;\nun([1, end], :) = 0;\n% Time evolution:\n\
  t=t+dt;\n% Save the simulation results:\nunm1=un; un=unp1;\n%  Excitation source:\n\
  un(50,50)=0.5*sin(1.5*pi*t);\nfor ii=2:Nx-1\nfor jj=2:Ny-1\nunp1(ii, jj)=2*un(ii,\
  \ jj)-unm1(ii, jj)+...\n(C²)*(un(ii+1,jj)+un(ii,jj+1)-4*un(ii, jj)+ ...\nun(ii-1,\
  \ jj)+un(ii,jj-1));\nend\nend\nsurfc(x, y, un'), colorbar; shg\ncaxis([-0.15 0.25])\
  \   % Pseudocolor axis scaling.\ntitle([' Simulation results after t = '  num2str(t)\
  \ '  [s]'])\npause(dt)\naxis tight\nend\nxlabel('Width, [m] ')\nylabel('Length,\
  \ [m] ')\nzlabel('Displacement, [m]')\n%% Contour plot\nfigure(2)\ncontourf(x, y,\
  \ un'), colorbar; shg\ntitle([' Simulation results after t = '  num2str(t) '  [s]'])\n\
  axis tight\nxlabel('Width, [m] ')\nylabel('Length, [m] ')\n```\n\n该解决方案脚本求解了给定的二维波传播问题，并绘制了仿真结果的动画图，如图\
  \ 13-17 和图 13-18 所示。请注意，此仿真是一个计算数据的实时演示（图 13-17），因此运行速度较慢。\n\n![../images/490522_1_En_13_Chapter/490522_1_En_13_Fig18_HTML.png](img/490522_1_En_13_Fig18_HTML.png)\n\
  \n图 13-18\n\n二维波传播问题仿真\n\n![../images/490522_1_En_13_Chapter/490522_1_En_13_Fig17_HTML.jpg](img/490522_1_En_13_Fig17_HTML.jpg)\n\
  \n图 13-17\n\n二维波传播问题仿真\n\n偏微分方程示例到此结束。请注意，MATLAB 中有一个名为 PDE 工具箱的工具箱，它包含许多 GUI 入口工具和内置函数，例如几何构建（矩形、圆形、多边形）、边界条件设置、PDE\
  \ 方程设置、网格划分、求解、绘图以及许多其他用户友好选项。\n\n## 练习\n\n以下是供您自行尝试的练习。\n\n### 练习 1\n\n求解一维热传导问题。假设有一根长度为\
  \ *L= 2 [m]* (0 < *x* ≤ *L*) 且 *k=0.001* 的导线。使用以下初始温度分布：*T(x, 0) = 65x [°C]*。假设导线两端都插入冰桶中（*T(0)=T(L)\
  \ = 0 [°C]*）。将该问题的数值解作为一系列解进行计算。\n\n### 练习 2\n\n求解以下一维波动方程：![$$ \\frac{\\partial²y}{\\\
  partial {t}²}=9\\frac{\\partial²y}{\\partial {x}²} $$](img/490522_1_En_13_Chapter_TeX_IEq10.png)。\n\
  \n假设 *y*(0, *t*) = *y*(1, *t*) = 0，对于 0 < *x* < 1，有 *y*(*x*, 0) = *cos* (2*πx*)\
  \ + 0.25 *cos* (5*πx*)，对于 0 < *x* < 1，有 ![$$ \\frac{\\partial y}{\\partial t}\\\
  left(x,0\\right)=0 $$](img/490522_1_En_13_Chapter_TeX_IEq11.png)。\n\n### 练习 3\n\n\
  使用 `PDEPE()`。求解给定的一维热传导方程 ![$$ \\frac{\\partial u}{\\partial t}-k\\frac{\\partial²u}{\\\
  partial {x}²}=0 $$](img/490522_1_En_13_Chapter_TeX_IEq12.png)，定义域为 0 < *x* < *L*\
  \ 且 0 < *t*。设 *L =10* 且 *k=0.55*。对于所有 *t > 0*，边界条件为 *u(0, t) = 75* 且 *u(L, t)=125*。初始条件形式为对于\
  \ *0<x<L*，*u(x, 0)=u*[*0*]*(x)*，其中 *u*[*0*]*(x)* 是一个已知/给定的函数，描述了沿杆长度的初始温度分布。考虑以下情况：*u*[*0*]*(x)\
  \ = 5x-1.2*0。\n\n### 练习 4\n\n使用拉普拉斯算子 `del2()`。求解拉普拉斯方程 ![$$ \\frac{\\partial²u}{\\\
  partial {x}²}+\\frac{\\partial²u}{\\partial {y}²}=0 $$](img/490522_1_En_13_Chapter_TeX_IEq13.png)，其中\
  \ *u(x, y)* 定义在 *x* ∈ [0, 2]，*y* ∈ [0, 2] 上，并具有以下边界条件：*u(x, 0)= 5, u(x, 2)=15; u(0,\
  \ y)=5, u(2, y)=15*。\n\n### 练习 5\n\n使用高斯-赛德尔方法。求解拉普拉斯方程 ![$$ \\frac{\\partial²u}{\\\
  partial {x}²}+\\frac{\\partial²u}{\\partial {y}²}=0 $$](img/490522_1_En_13_Chapter_TeX_IEq14.png)，其中\
  \ *u(x, y)* 定义在 *x* ∈ [0, 2]，*y* ∈ [0, 2] 上，并具有以下边界条件：*u(x, 0)= 5, u(x, 2)=15; u(0,\
  \ y)=5, u(2, y)=15*。\n\n### 练习 6\n\n使用递归算法。求解一维波动方程 ![$$ \\frac{\\partial u}{\\\
  partial t}+a\\frac{\\partial u}{\\partial x}=0 $$](img/490522_1_En_13_Chapter_TeX_IEq15.png)，其中\
  \ *u(t, x)* 定义在 *x* ∈ [0, 10] 上，并具有以下边界条件：*u(t, 0)= 0* 和 *u(t, 10)=0*。弦在中间被激发，*u*(*t*,\
  \ 5) = 0.25 *sin* (2*πt*)。取 =0.75。\n\n### 练习 7\n\n使用 `PDEPE()`。求解给定的一维热传导方程 ![$$\
  \ {\\pi}²\\frac{\\partial u}{\\partial t}-\\frac{\\partial²u}{\\partial {x}²}=0\
  \ $$](img/490522_1_En_13_Chapter_TeX_IEq16.png)，定义域为 0 < *x* < *L* 且 0 < *t*。设 *L=5*。对于所有\
  \ *t > 0*，边界条件为 *u(0, t) = 0* 且 ![$$ \\pi {e}^{-t}+\\frac{\\partial u\\left(5,t\\\
  right)}{\\partial t}=0 $$](img/490522_1_En_13_Chapter_TeX_IEq17.png)。初始条件为对于 *0<x<L*，*u*(*x*,\
  \ 0) = *sin* (2*πx*)。\n\n### 练习 8\n\n使用高斯-赛德尔方法。求解拉普拉斯方程 ![$$ \\frac{\\partial²u}{\\\
  partial {x}²}+\\frac{\\partial²u}{\\partial {y}²}=0 $$](img/490522_1_En_13_Chapter_TeX_IEq18.png)，其中\
  \ *u(x, y)* 定义在 *x* ∈ [0, 2]，*y* ∈ [0, 2] 上，并具有以下边界条件：*u(x, 0)= 5, u(x, 2)=15; u(0,\
  \ y)=5, u(2, y)=15*。\n\n### 练习 9\n\n使用有限差分方法。求解拉普拉斯方程 ![$$ \\frac{\\partial²u}{\\\
  partial {x}²}+\\frac{\\partial²u}{\\partial {y}²}=0 $$](img/490522_1_En_13_Chapter_TeX_IEq19.png)，其中\
  \ *u(x, y)* 定义在 *x* ∈ [0, 2]，*y* ∈ [0, 2] 上，并具有以下边界条件：*u(x, 0)= 5, u(x, 2)=15; u(0,\
