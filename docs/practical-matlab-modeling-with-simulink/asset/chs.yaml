- '# 1. 常微分方程的解析解


  工程应用中的许多建模问题都可以用常微分方程来表述。*微分方程*有几种不同的定义；其中最简单的定义之一是 [1] 中给出的：“微分方程是包含导数的任何方程，无论是常导数还是偏导数。”
  从这个定义中，我们可以推导出两种微分方程：常微分方程 (ODE) 和偏微分方程 (PDE)。ODE 包含一种导数或一个自变量，而 PDE 包含两种或更多种导数或自变量。例如，一阶
  ODE 的一般形式可以表示为：


  ![$$ \frac{dy}{dx}=f\left(y,x\right) $$](img/490522_1_En_1_Chapter_TeX_Equ1.png)


  (1-1)


  其中 `y(x)` 是因变量，其值取决于自变量 `x` 的值。ODE 的另一个很好的例子是牛顿第二运动定律，其公式为：


  `ma` ![$$ =\frac{dp}{dt}=\frac{mdv}{dt}=F\left(t,v\right) $$](img/490522_1_En_1_Chapter_TeX_IEq1.png)
  (1-2)


  其中 `F(t, v)` 是力，它是时间 (`t`) 和速度 (`v`) 的函数；![$$ \frac{dv}{dt} $$](img/490522_1_En_1_Chapter_TeX_IEq2.png)
  是运动物体的速度变化率（加速度）；`m` 是运动物体的质量；`a` 是运动物体的加速度；`p` 是动量；而 ![$$ \frac{dp}{dt} $$](img/490522_1_En_1_Chapter_TeX_IEq3.png)
  是其导数。


  先前牛顿第二定律的公式也可以改写为以下形式：


  ![$$ \frac{md}{dt}\left(\frac{dx}{dt}\right)=\kern0.5em \frac{m{d}²x}{d{t}²}=F\left(t,x,\frac{dx}{dt}\
  \right) $$](img/490522_1_En_1_Chapter_TeX_Equ2.png)


  (1-3)


  其中运动物体的位移 (`x`) 的导数 ![$$ \left(\frac{dx}{dt}\right) $$](img/490522_1_En_1_Chapter_TeX_IEq4.png)
  就是速度 (`v`)。换句话说，速度是运动物体的位移 `x(t)` 随时间的变化率。这可以用图 1-1 所示的流程图来直观表示。


  ![../images/490522_1_En_1_Chapter/490522_1_En_1_Fig1_HTML.jpg](img/490522_1_En_1_Fig1_HTML.jpg)


  **图 1-1** 表达运动物体的运动及所受力的流程图


  ## 常微分方程分类


  与 ODE 相关的问题分为两类。


  - **初值问题 (IVPs)：** 例如：![$$ \ddot{x}= xt-3\dot{x} $$](img/490522_1_En_1_Chapter_TeX_IEq5.png)
  ，初值条件为：`x(0) = 3`，`\dot{x}(0) = 1`。


  - **边值问题 (BVPs)：** 例如：![$$ \ddot{x}= xt-3\dot{x} $$](img/490522_1_En_1_Chapter_TeX_IEq7.png)
  ，边值条件为：`x(0) = 3`，`x(2) = 1.50`。


  IVP 由 ODE 以及在解域内某一点上未知函数的指定值（称为*初值条件*）共同定义。在 ODE 的 IVP 中，可能存在唯一解、无解或多解。根据定义，ODE
  的 IVP 可以显式定义或隐式定义。大多数 IVP 是显式定义的。


  我们将从显式定义的 IVP 开始，然后转向隐式定义的 IVP。除了按解的类型（解值在解搜索空间中的变化方式）分类外，IVP 还分为刚性问题和非刚性问题。此外，ODE
  要么是线性的要么是非线性的，要么是齐次的要么是非齐次的。


  以下是一些不同 ODE 类型、类别和分组的具体示例：


  - 刚性 ODE：![$$ \left\{\begin{array}{c}\dot{x}=-0.04x+{10}⁴ yz\\ {}\dot{y}=0.04x-{10}⁴
  yz-3\ast {10}⁷{y}²\\ {}\dot{z}=3\ast {10}⁷{y}²\end{array}\right. $$](img/490522_1_En_1_Chapter_TeX_IEq8.png)
  `t ∈ [0, 40]`


  - 非刚性 ODE：`\dot{y} + 2y = 2t`，`\ddot{w} + \dot{w} = 5`


  - 线性 ODE：`dv/dt = 9.81 - 0.198v`，`\ddot{x} + 3\dot{x} + 5x = 0`


  - 非线性 ODE：`dv/dt = 9.81 - 0.198v²`，`\ddot{x} + 3x\dot{x} + 5x² = 0`


  - 齐次 ODE：`\dot{y} + 2y = 0`，`\ddot{x} + 3\dot{x} + 5x = 0`


  - 非齐次 ODE：`\dot{y} + 2y = sin(x)`，`\ddot{x} + 3\dot{x} + 5x = e^{2t}`


  本章包含了几个 ODE 及其应用领域的示例。


  ### 示例 1


  本示例展示了一个指数增长问题。该方程可以描述生物有机体（细菌）的无约束增长、房地产或投资的价值、热门社交网站的会员数、零售业务的增长、电气系统的正反馈或生成的化学反应。它由以下一阶
  ODE 描述：


  `dy/dt = μy` 的解为：`y(t) = y[0]e^(μt)`




  ## 示例 2


  本示例演示指数衰减。该方程可描述自然界和工程学中的许多现象，例如放射性衰变、反应器中化学物质的洗出、电容器的放电以及河流中物质的分解。指数衰减由以下一阶常微分方程（ODE）表示：


  `dy/dt = -μy` 的解为：`y(t) = y[0]*e^(−μt)`


  示例 1 和 2 是一阶常微分方程的两个简单例子。


  ### 示例 3


  下落物体的运动使用牛顿第二定律表达如下：


  `m*d²y/dt² = mg - γ*dy/dt`


  这是一个二阶常微分方程，其通解形式如下：


  `y(t) = C1*e^(−γt/m) - m*(mg - gγt)/γ² + C2`


  其中，`m` 是下落物体的质量；`g` 是重力加速度；`γ` 是下落物体的空气阻力系数。这里共有三个参数。具体来说，`m`、`g` 和 `γ` 是常数，而两个参数随时间变化：`d²y/dt²`（加速度）和
  `dy/dt`（速度）。在使用运动方程求解下落物体通解时，`C1` 和 `C2` 是由初始条件决定的任意数，换言之，可以根据下落物体的初始条件计算得出。


  有几种方法可以评估 ODE 的解析解，包括变量分离法、引入新变量法等。我们通过这些类型的 ODE 的具体示例来展示，并解释如何使用 MATLAB/Simulink
  环境中的脚本和建立模型，采用不同技术来评估其解析解和计算数值解。我们通过具体示例评估 ODE 的解析解，并演示如何使用符号数学工具箱¹ 和 MuPAD² 笔记本的内置函数。我们将重点更多地放在符号数学工具箱的命令语法上，而非
  MuPAD 笔记本。原因在于，在 MATLAB 的未来版本中，对 MuPAD 笔记本的技术支持将被移除。


  数值方法有很多种，包括欧拉法（前向、后向、改进）、休恩法、中点法则、龙格-库塔法、龙格-库塔-吉尔法、亚当斯-巴什福斯法、米尔恩法、亚当斯-莫尔顿法、泰勒级数法和梯形法则法。其中一些方法是显式的，另一些是隐式的。为了演示如何应用这些方法，我们将首先简要描述它们的公式，然后针对其实现算法明确编写脚本（程序）。我们不试图推导这些数值方法中使用的任何公式，并且有许多文献来源
  [2, 3, 4, 5] 解释了这些方法的理论方面。


  在使用数值方法求解初值问题（IVP）时，我们首先从一个初始点（初始条件）开始，然后随时间向前迈出一步（等步长或变步长）来计算数值解。前面提到的一些数值方法（如欧拉法）是单步法，而其他方法（龙格-库塔法、亚当斯-巴什福斯法、米尔恩法、亚当斯-莫尔顿法、泰勒级数法）是多步法。单步法仅需前一点及其导数值来确定当前值。其他方法，如龙格-库塔法，会进行一些中间步骤以获得更高阶的步长，然后在进行下一步之前丢弃之前的值。与单步法不同，多步法会保留并使用前几步的值，而不是丢弃它们。通过这种方式，多步法将先前获得的几个值（解）及其导数值联系起来。所有这些方法，例如单步法和多步法，都是根据其计算特定类型
  ODE 的 IVP 数值解时的准确性以及计算时间和资源（例如机器时间）效率来评估的。


  ## ODE 的解析解


  符号数学工具箱（或 MuPAD 笔记本）具有多个函数，能够评估许多可解析求解的 ODE 的解析解。有两个命令（内置函数）——`dsolve()` 和 `ilaplace/laplace`——可用于评估某些
  ODE 的解析解。


  请注意，在本节中，我们通过几个一阶和二阶 ODE 以及耦合微分方程系统的示例来演示如何计算 ODE 的解析解。


  ### `dsolve()`


  `dsolve()` 是一个 ODE 求解器工具，用于在 MATLAB 中计算任何给定 ODE 的解析（或通解）。`dsolve()` 可以使用以下通用语法：


  ```

  Solution = dsolve(equation)

  Solution = dsolve(equation, conditions)

  Solution = dsolve(equation, conditions, Name, Value)

  [y1,...,yN] = dsolve(equations)

  [y1,...,yN] = dsolve(equations, conditions)

  [y1,...,yN] = dsolve(equations, conditions, Name, Value)

  ```


  ### 示例 4


  给定一个 ODE：`dy/dt + 2t*y² = 0`。注意，未指定初始条件或边界条件。以下命令可用于计算给定示例的通解。


  ```

  >> y_solution=dsolve(''Dy=-2*y²*t'')

  y_solution=-1/(C3-t²)

  ```


  注意，`C3` 由给定 ODE 的初始条件或边界条件定义。


  还有一个替代命令。对于较新版本的 MATLAB（从 MATLAB 2012 开始），可以使用以下命令语法来解决给定的问题：


  ```

  >>syms y(t); y_sol=dsolve(diff(y) == -2*y²*t)

  y_sol =


  -1/(-t² + C3)

  ```


  ## 示例 5


  给定一个 ODE：`dy/dt + 2t*y² = 0`，初始条件为 `y(0) = 0.5`。


  ```

  >> Solution=dsolve(''Dy=-2*y²*t'', ''y(0)=0.5'')

  Solution =

  1/(t² + 2)

  ```


  以下是适用于较新版本 MATLAB 的替代命令语法：


  ```

  >> syms y(t); Solution=dsolve(diff(y) == -2*y²*t, y(0)==0.5)

  Solution =

  1/(t² + 2)

  ```


  这是另一种适用于较新版本 MATLAB 的替代语法：


  ```

  >> syms y(t) t; Dy=diff(y, t); Equation = Dy ==-2*y²*t; IC=y(0)==0.5; Solution=dsolve(Equation,
  IC); pretty(Solution)


  t  + 2

  ```


  得到的解析解是符号形式，因此可以使用 `ezplot` 或推荐的 `fplot` 进行绘图（图 1-2）。（`ezplot` 将不再受 MATLAB 未来版本的支持。）


  **图 1-2** *`dy/dt + 2t*y² = 0, y(0) = 0.5` 的解析解*


  ```

  >> fplot(Solution, [-5, 5], ''r--o''), grid on

  >>title(''Solution of: $$ \frac{dy}{dt}+2y²t=0, y_0 = 0.5 $$'', ''interpreter'',
  ''latex'')

  >> xlabel(''\it t''), ylabel ''\it Solution, y(t)''

  ```


  可以通过向量化（参数化）得到的符号公式（解）来计算所得解析解（方程）的数值，如下所示：


  ```

  >> ysol=vectorize(solution)

  ysol =

  1./(t.² + 2)

  >> t=(-5:.1:5); ysol_values=eval(ysol);

  ```


  计算数值解值的另一种方法是使用 `fplot`，如下所示：


  ```

  [t, yt]=fplot(Solution, [-5, 5]);

