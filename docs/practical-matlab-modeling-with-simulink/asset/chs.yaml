  并选择其下拉选项中的“模型配置参数 Ctrl+E” ![../images/490522_1_En_2_Chapter/490522_1_En_2_Figk_HTML.jpg](img/490522_1_En_2_Figk_HTML.jpg)，按下
  Ctrl+E，或者选择“工具 ➤ 模型浏览器 ➤ 模型层次结构 ➤ 配置”来访问它们，如图 2-25 所示。


  ![../images/490522_1_En_2_Chapter/490522_1_En_2_Fig25_HTML.jpg](img/490522_1_En_2_Fig25_HTML.jpg)


