- '# 3. 二阶常微分方程的数值方法


  二阶或更高阶的常微分方程对于物理学、工程学和自然科学中的广泛问题至关重要。例如，波动方程、电磁现象、热传导和流体力学都是用二阶或更高阶常微分方程建模的。通常，二阶常微分方程的形式如方程
  (3-1) 所示。


  ![$$ \frac{d²y}{dt²}=f\left(t,y,\frac{dy}{dt}\right), $$](img/490522_1_En_3_Chapter_TeX_Equ1.png)


  (3-1)


  通常，自变量用 *t* 表示，在许多物理系统中，它通常是一个自变量（例如，相对于时间）。还有许多系统使用 *x*、*y* 和 *z* 或其他变量。


  一个 *n* 阶线性微分方程可以用如下一般形式表示：


  ![$$ {P}_0(t)\frac{d^ny}{dt^n}+{P}_1(t)\frac{d^{n-1}y}{dt^{n-1}}+\dots +{P}_{n-1}(t)\frac{dy}{dt}+{P}_n(t)y=H(t)
  $$](img/490522_1_En_3_Chapter_TeX_Equ2.png)


  (3-2)


  其中 *P*0, *P*1...*P**n* 和 *H*(*t*) 是在某个区间 *α* < *t* < *β* 上的连续实值函数，并且在该区间内 *P*0 不接近于零。如果我们用
  *P*0 除以方程 (3-2)，得到以下方程：


  ![$$ \frac{d^ny}{dt^n}+{p}_1(t)\frac{d^{n-1}y}{dt^{n-1}}+\dots +{p}_{n-1}(t)\frac{dy}{dt}+{p}_n(t)y=h(t)
  $$](img/490522_1_En_3_Chapter_TeX_Equ3.png)


  (3-3)


  方程 (3-3) 也可以重写如下：


  ![$$ \frac{d^ny}{dt^n}=h(t)-\left({p}_1(t)\frac{d^{n-1}y}{dt^{n-1}}+\dots +{p}_{n-1}(t)\frac{dy}{dt}+{p}_n(t)y\right)
  $$](img/490522_1_En_3_Chapter_TeX_Equ4.png)


  (3-4)


  并且也可以写成：


  ![$$ \frac{d^ny}{dt^n}=f\left(t,\frac{d^{n-1}y}{dt^{n-1}},..\frac{dy}{dt},y(t)\
  \right) $$](img/490522_1_En_3_Chapter_TeX_Equ5.png)


  (3-5)


  方程 (3-5) 类似于二阶常微分方程的方程 (3-1)。


  让我们看几个二阶常微分方程的例子，以展示如何使用欧拉法、龙格-库塔法、亚当斯-巴什福思法和亚当斯-莫尔顿法以及其他方法。此外，我们还演示了如何使用 MATLAB
  内置的常微分方程求解器和工具（包括 `dsolve()`）来计算数值解和解析解。


  一阶常微分方程所采用的方法和先前的做法对于二阶及更高阶常微分方程是相似且有效的。对于所有显式定义的常微分方程，需要多一个（或多个）步骤，即将给定的二阶或更高阶常微分方程重写为一阶常微分方程组。对于隐式定义的常微分方程，我们通过使用
  MATLAB 内置求解器 `ode15i` 和 Simulink 演示了一种单独的方法。


  ## 欧拉法


  在前面的章节中，我们详细介绍了欧拉法的公式推导和实现算法，以展示如何数值求解一阶常微分方程。对于高阶常微分方程，欧拉法的实现步骤相同，只是中间多了一些步骤。因此，在本节中，我们将局限于通过
  MATLAB 脚本实现欧拉法，直接计算二阶及更高阶常微分方程的数值解。


  ### 示例 1


  给定一个二阶非齐次常微分方程，示例问题如下：![$$ \frac{1}{2}\ddot{u}+\frac{2}{5}\dot{u}+u=2t, $$](img/490522_1_En_3_Chapter_TeX_IEq1.png)
  ![$$ u(0)=1,\dot{u}(0)=2 $$](img/490522_1_En_3_Chapter_TeX_IEq2.png)。


  在编写基于欧拉法的脚本之前，我们需要通过引入新变量，将给定的二阶常微分方程重写为两个一阶常微分方程组成的方程组。


  ![$$ \ddot{u}=4t-\frac{4}{5}\dot{u}-2u $$](img/490522_1_En_3_Chapter_TeX_IEq3.png)
  需要重写如下：![$$ \left\{\begin{array}{c}{\dot{u}}_1={u}_2\\ {}{\dot{u}}_2=4t-\frac{4}{5}{u}_2-2{u}_1\end{array}\right.
  $$](img/490522_1_En_3_Chapter_TeX_IEq4.png)。


  注意 *u*[1] = *u* 且 ![$$ {\dot{u}}_2=\ddot{u} $$](img/490522_1_En_3_Chapter_TeX_IEq5.png)。


  上述重写后的一阶常微分方程组可以通过多种方式在脚本中实现，例如，直接在脚本中编写方程组、使用匿名函数（`@`）、使用函数或使用函数文件。请注意，从 MATLAB
  2018a 开始，在脚本中实现函数是有效的。


  以下是嵌入欧拉前向法以计算给定问题数值解（如图 3-1 所示）的脚本（名为 `Example1_2ndODE.m`）：


  ![../images/490522_1_En_3_Chapter/490522_1_En_3_Fig1_HTML.png](img/490522_1_En_3_Fig1_HTML.png)


  图 3-1


  前向欧拉法与用 `dsolve()` 求解 ![$$ \frac{1}{2}\ddot{u}+\frac{2}{5}\dot{u}+u=2t $$](img/490522_1_En_3_Chapter_TeX_IEq6.png),
  ![$$ u(0)=1,\kern0.5em \dot{u}(0)=2 $$](img/490522_1_En_3_Chapter_TeX_IEq7.png)
  得到的解析解对比


  ```

  % 示例 1。 (1/2)*u"+(2/5)*u''+u=2*t，初始条件：u(0)=1 & u''(0)=2

  % 使用欧拉前向法和 DSOLVE 求解。

  clearvars, close all; clc

  h=0.2;         % 时间步长

  tmax=7;        % 仿真结束时间

  t0=0;          % 仿真开始时间

  t=t0:h:tmax;

  steps=length(t);   % 评估步数

  u(1,:)=[1 2];      % 初始条件

  %{

  注意：u(t) 的维数是二维的，这是因为

  有两个变量用于将二阶常微分方程重写为两个一阶常微分方程。

  %}

  % 方法 #1。 直接表达常微分方程组的方式

  for k=2:steps

  f=[u(k-1,2), 4*t(k)-(4/5)*u(k-1,2)-2*u(k-1,1)];

  u(k,:)=u(k-1,:)+f*h;

  end

  % 方法 #2。 匿名函数 (@)

  %{

  F = @(t, u1, u2)([u2, 4*t-(4/5)*u2-2*u1]);

  for k=2:steps

  F1=F(t(k-1), u(k-1, 1), u(k-1, 2));

  u(k,:)=u(k-1,:)+F1*h;

  end

  %}

  % 方法 #3。  函数文件，命名为：FuFu.m

  %{

  function dudt = FuFu(t, u1, u2)

  dudt = [u2, 4*t-(4/5)*u2-2*u1]

  end

  %}

  %{

  for k=2:steps

  F1=feval(@FuFu,t(k-1), u(k-1, 1), u(k-1, 2));

  u(k,:)=u(k-1,:)+F1*h;

  end

  %}

  % 方法 #4

  %{

  syms T u1 u2

  f=[u2, 4*T-(4/5)*u2-2*u1];

  matlabFunction(f, ''file'', ''F'');

  for k=2:steps

  F1=feval(@F, t(k-1), u(k-1, 1), u(k-1, 2));

  u(k,:)=u(k-1,:)+F1*h;

  end

  %}

  plot(t, u(:,1), ''bo''), grid minor, hold on

  % 问题的解析解：

  syms x(T) Dx T

  Dx=diff(x, T);

  D2x=diff(x, T, 2);

  Equation=D2x==-(4/5)*Dx-2*x+(4*T);

  ICs = [x(0)==1, Dx(0)==2];

  y=dsolve(Equation, ICs);

  Y=double(subs(y,''T'',t));

  % 或使用：U=vectorize(u); T=t; U=eval(U);

  plot(t, Y, ''g-'', ''linewidth'', 2)

  legend(''欧拉前向法'',''解析解'', ''location'', ''southeast'')

  title(''\it 解的：$$\frac{1}{2}*\frac{d²u}{dt²}+\frac{2}{5}*\frac{du}{dt}+u=2*t $$'',
  ''interpreter'', ''latex'')

  xlabel(''\it t''), ylabel(''\it 解, u(t)''), hold off

  axis tight; shg

  ```


  在前面的示例中应该注意，通过减小步长（*h*），欧拉法的精度会显著提高，就像一阶常微分方程一样。



