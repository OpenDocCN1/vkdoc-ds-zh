  Simulink 库 ➤ 用户自定义函数，采用函数模块 ![../images/490522_1_En_3_Chapter/490522_1_En_3_Figc_HTML.jpg](img/490522_1_En_3_Figc_HTML.jpg)
  开发而成。[积分器]模块中的初始条件作为内部初始条件实现，仿真时间设置为从 *t* = 1 *秒*开始。仿真结果如图 3-31 所示。


  **注意：** 对于初始值问题起始时间非零的 Simulink 模型，仿真必须从给定的初始时间（值）开始。例如，对于 ![$$ y\left(\frac{\pi
  }{2}\right)=\frac{1}{3}, $$](img/490522_1_En_3_Chapter_TeX_IEq136.png) 仿真必须从 ![$$
  t=\frac{\pi }{2}. $$](img/490522_1_En_3_Chapter_TeX_IEq137.png) 开始。


