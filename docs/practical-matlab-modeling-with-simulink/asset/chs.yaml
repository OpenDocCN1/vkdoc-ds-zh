  ## 龙格-库塔法


  龙格-库塔法可以按不同阶次实现，例如一阶龙格-库塔法（等同于欧拉法）、二阶龙格-库塔法（等同于霍因法），以及经典的四阶和五阶龙格-库塔法。这些方法也可采用与欧拉法算法类似的算法实现，只需在第
  6 步中引入一些更改。因此，在龙格-库塔法中，通过根据公式(2-6)计算函数值，对前向欧拉法算法的第 6 步进行了如下更改。


  ![$$ {y}_{i+1}={y}_i+\frac{h\left({k}_1+2{k}_2+2{k}_3+{k}_4\right)}{6} $$](img/490522_1_En_2_Chapter_TeX_Equ5.png)


  (2-6)


  项 `k[1]`、`k[2]`、`k[3]`、`k[4]` 由下式计算：


  ![$$ {k}_1=f\left({t}_i,{y}_i\right) $$](img/490522_1_En_2_Chapter_TeX_Equap.png)


  ![$$ {k}_2=f\left({t}_i+\frac{h}{2},{y}_i+\frac{k_1h}{2}\right) $$](img/490522_1_En_2_Chapter_TeX_Equaq.png)


  ![$$ {k}_3=f\left({t}_i+\frac{h}{2},{y}_i+\frac{k_2h}{2}\right) $$](img/490522_1_En_2_Chapter_TeX_Equar.png)


  ![$$ {k}_4=f\left({t}_i+\frac{h}{2},{y}_i+{k}_3h\right) $$](img/490522_1_En_2_Chapter_TeX_Equas.png)


  其中 `i = 0, 1, 2, …, N - 1`。总和 ![$$ \frac{\left({k}_1+2{k}_2+2{k}_3+{k}_4\right)}{6}
  $$](img/490522_1_En_2_Chapter_TeX_IEq18.png) 可解释为平均斜率。


  ### 示例 4


  以下是示例问题：![$$ \dot{y}+2y-{e}^{-t}=3 $$](img/490522_1_En_2_Chapter_TeX_IEq19.png)，`y(0)
  = 1`。让我们计算 `t = 0...10`、时间步长 `h = 0.05` 时的数值解，并将给定的问题方程重写为 ![$$ \dot{y}=3-2y+{e}^{-t}
  $$](img/490522_1_En_2_Chapter_TeX_IEq20.png)。这也可以表示为 `f(t, y) = 3 - 2y + e^(-t)`，其中
  `t = 0...10`。


