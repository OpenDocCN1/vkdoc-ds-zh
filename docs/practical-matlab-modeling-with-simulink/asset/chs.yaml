  \ ∈ [1, 15]`。注意初始点不在 0 而在 1。\n   - 使用 MATLAB 解算器 `ode15i`。\n   - 构建一个 Simulink 模型。\n\
  \   - 比较 `ode15i` 和 Simulink 模型的结果。\n\n### 练习 13\n\n求解由以下方程定义的二阶常微分方程隐式定义的初值问题：\n\
  \n1. 创建问题的 Simulink 模型。\n2. 使用 MATLAB 内置的 ODE 解算器 `ode15i` 和 `decic`。\n3. 比较 (a)\
