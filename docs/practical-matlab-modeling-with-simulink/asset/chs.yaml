  \ 和 `ilaplace`）来评估该问题的解析解？\n\n- `3ÿ² - 2ÿ + e^(2t)ẏ - 12y = 0, y(0) = 2, ẏ(0) =\
  \ 2e², t ∈ [0, 25]`\n- `3ÿ³ - 2yÿ + ẏ - 13y = e^(3t), y(0) = 5, ẏ(0) = 3e⁴, t ∈\
  \ [0, 15]`\n\n# 第二部分 – 常微分方程中的边值问题\n\n\n\n# 8. 边值问题\n\n在本章中，我们将讨论使用 MATLAB 内置求解器求解常微分方程\
  \ (ODE) 边值问题 (BVP) 的基本步骤。BVP 与初值问题 (IVP) 的唯一区别在于，BVP 中给定的微分方程在两个边界条件（即初始条件和结束条件）下有效。BVP\
  \ 可以用以下表达式表示：\n\n![$$ \\frac{\\partial u}{\\partial t}\\left(y,t\\right)=\\beta\
  \ \\frac{\\partial²y}{\\partial {y}²}\\left(y,t\\right),\\kern1em a&lt;y&lt;b,\\\
  kern0.5em 0&lt;t $$](img/490522_1_En_8_Chapter_TeX_Equ1.png)\n\n(8-1)\n\nBVP 中有三种主要类型（外加另一种类型）的边界条件\
  \ (BC)，如下所列：\n\n- 狄利克雷边界条件：\n\n![$$ u\\left(a,t\\right)=0;\\kern0.75em u\\left(b,t\\\
  right)=0 $$](img/490522_1_En_8_Chapter_TeX_Equ2.png)\n\n(8-2)\n\n- 诺伊曼边界条件：\n\n\
  ![$$ \\frac{\\partial u}{\\partial y}\\left(a,t\\right)=0;\\kern0.75em \\frac{\\\
  partial u}{\\partial y}\\left(b,t\\right)=0 $$](img/490522_1_En_8_Chapter_TeX_Equ3.png)\n\
  \n(8-3)\n\n- 罗宾或混合边界条件：\n\n![$$ u\\left(a,t\\right)=0;\\kern0.5em \\frac{\\partial\
  \ u}{\\partial y}\\left(b,t\\right)=0 $$](img/490522_1_En_8_Chapter_TeX_Equ4.png)\n\
  \n(8-4)\n\n或\n\n![$$ \\frac{\\partial u}{\\partial y}\\left(a,t\\right)=0;\\kern0.75em\
  \ u\\left(b,t\\right)=0 $$](img/490522_1_En_8_Chapter_TeX_Equ5.png)\n\n(8-5)\n\n\
  - 周期边界条件：\n\n![$$ u\\left(a,t\\right)=u\\left(b,t\\right);\\kern0.5em \\frac{\\\
  partial u}{\\partial y}\\left(a,t\\right)=\\frac{\\partial u}{\\partial y}\\left(b,t\\\
  right); $$](img/490522_1_En_8_Chapter_TeX_Equ6.png)\n\n(8-6)\n\n大多数 BVP 是二阶问题；因此，我们着重求解或模拟定义如下的二阶\
  \ BVP 方程：\n\n![$$ \\ddot{y}+p(t)\\dot{y}+q(t)y=r(t),\\kern0.5em a&lt;t&lt;b $$](img/490522_1_En_8_Chapter_TeX_Equ7.png)\n\
  \n(8-7)\n\n其中，令 *Ι* = (*a*, *b*) ⊆ ℝ 为一个区间，并令 *p*, *q*, *r* : (*a*, *b*) → ℝ 为连续函数。\n\
  \nBVP 中的常微分方程可能有一个解、几个解或无限多个解，具体取决于边界条件（边界值和边界类型）。例如，考虑如下所示的二阶微分方程：\n\n![$$ \\ddot{y}+y=0\
  \ $$](img/490522_1_En_8_Chapter_TeX_Equ8.png)\n\n(8-8)\n\n以下是该方程的三个案例：\n\n- **案例\
  \ #1：** 方程 (8-8) 在边界条件![$$ y(0)=1\\kern0.75em \\mathrm{and}\\kern0.5em y\\left(\\\
  frac{\\pi }{2}\\right)=1 $$](img/490522_1_En_8_Chapter_TeX_IEq1.png)下，有唯一解 `y(t)\
  \ = sin(t) + cos(t)`。\n\n- **案例 #2：** 方程 (8-8) 在边界条件 `y(0) = 1` 和 `y(π) = 1`下无解。\n\
  \n- **案例 #3：** 方程 (8-8) 在边界条件 `y(0) = 1` 和 `y(2π) = 1`下有无穷多解。\n\n类似地，如果需要，我们也可以利用其他边界条件生成更多其他案例。\n\
  \n**对于案例 #1。** 在![$$ y(0)=1\\kern0.75em \\mathrm{and}\\kern0.5em y\\left(\\frac{\\\
  pi }{2}\\right)=1 $$](img/490522_1_En_8_Chapter_TeX_IEq2.png)条件下，我们假设方程 (8-8) 的通解为\
  \ `y(t) = C[1] * sin(t) + C[2] * cos(t)`。可以通过以下表达式并将边界条件应用于问题的通解来求出 `C[1]` 和 `C[2]`：\n\
  \n![$$ 1=y(0)={C}_1\\sin (0)+{C}_2\\mathit{\\cos}(0)={C}_1\\ast 0+{C}_2\\ast 1={C}_2\\\
  Rightarrow {C}_2=1 $$](img/490522_1_En_8_Chapter_TeX_Equa.png)\n\n![$$ 1=y\\left(\\\
  frac{\\pi }{2}\\right)={C}_1\\sin \\left(\\frac{\\pi }{2}\\right)+{C}_2\\mathit{\\\
  cos}\\left(\\frac{\\pi }{2}\\right)={C}_1\\ast 1+{C}_2\\ast 0={C}_1\\Rightarrow\
  \ {C}_1=1 $$](img/490522_1_En_8_Chapter_TeX_Equb.png)\n\n现在，解如下所示：\n\n![$$ y(t)=\\\
  mathit{\\sin}(t)+\\mathit{\\cos}(t) $$](img/490522_1_En_8_Chapter_TeX_Equc.png)\n\
  \n**对于案例 #2。** 在 `y(0) = 1` 和 `y(π) = 1`条件下，我们假设方程 (8-8) 的通解为 `y(t) = C[1] * sin(t)\
  \ + C[2] * cos(t)`。可以通过以下表达式并将边界条件应用于问题的通解来求出 `C[1]` 和 `C[2]`：\n\n![$$ 1=y(0)={C}_1\\\
  sin (0)+{C}_2\\mathit{\\cos}(0)={C}_1\\ast 0+{C}_2\\ast 1={C}_2\\Rightarrow {C}_2=1\
  \ $$](img/490522_1_En_8_Chapter_TeX_Equd.png)\n\n![$$ 1=y\\left(\\pi \\right)={C}_1\\\
  sin \\left(\\pi \\right)+{C}_2\\mathit{\\cos}\\left(\\pi \\right)={C}_1\\ast 0+{C}_2\\\
  ast \\left(-1\\right)={C}_2\\Rightarrow {C}_2=-1 $$](img/490522_1_En_8_Chapter_TeX_Eque.png)\n\
  \n对于 `a = 0`，`C[2] = 1`；而对于 `b = π`，`C[2] = -1`。这相互矛盾，意味着对于这些边界条件，没有解。\n\n**对于案例\
  \ #3。** 在 `y(0) = 1` 和 `y(2π) = 1`条件下，我们假设方程 (8-8) 的通解为 `y(t) = C[1] * sin(t) +\
  \ C[2] * cos(t)`。可以通过以下表达式并将边界条件应用于问题的通解来求出 `C[1]` 和 `C[2]`：\n\n![$$ 1=y(0)={C}_1\\\
  sin (0)+{C}_2\\mathit{\\cos}(0)={C}_1\\ast 0+{C}_2\\ast 1={C}_2\\Rightarrow {C}_2=1\
  \ $$](img/490522_1_En_8_Chapter_TeX_Equf.png)\n\n![$$ 1=y\\left(2\\pi \\right)={C}_1\\\
  sin \\left(2\\pi \\right)+{C}_2\\mathit{\\cos}\\left(2\\pi \\right)={C}_1\\ast 0+{C}_2\\\
  ast (1)={C}_2\\Rightarrow {C}_2=1 $$](img/490522_1_En_8_Chapter_TeX_Equg.png)\n\n\
  `C[1]` 可以是任意数值，这意味着对于给定的边界条件，该问题具有无限多个解，形式为 `y(t) = C[1] * sin(t) + cos(t)`，其中 `C[1]\
  \ ⊆ ∀`。\n\n让我们探索 MATLAB 工具和函数，以及 Symbolic Math Toolbox 的 MuPAD 笔记，来求解几个不同的 BVP。以下\
  \ MATLAB 内置函数用于求解 BVP：`bvpinit`、`bvp4c`、`bvp5c`、`bc`、`odeset` 和 `deval`。在 Symbolic\
  \ Math Toolbox 中，使用命令 `ode::solve` 来计算给定问题的解析解。\n\n现在，让我们考虑几个不同的 BVP 二阶常微分方程，以找到数值解，并使用\
  \ MATLAB 和 Symbolic Math Toolbox 对其进行仿真。\n\n在 MATLAB 中计算 BVP 的数值解时，有一些通用的“必须遵循”步骤。\n\
  \n- **步骤 #0.** 通过一阶微分方程组重写给定的高阶微分方程。此步骤与 IVP 中的步骤类似。\n\n- **步骤 #1.** 通过内联函数或函数句柄（`@`）或函数文件（m\
  \ 文件）定义给定的问题微分方程。\n\n- **步骤 #2.** 通过匿名函数（函数句柄，`@`）或单独的函数文件（m 文件）或嵌套函数定义边界条件的残差。\n\
  \n- **步骤 #3.** 定义模拟范围/空间（例如，时间空间）。\n\n- **步骤 #4.** 使用 `bvpinit()` 对解的结构进行猜测。请注意，初始猜测可以是常数值，也可以是针对特定（常数）值计算的函数。\n\
  \n- **步骤 #5.** 使用 `bvp4c()` 或 `bvp5c()` 获取解。\n\n- **步骤 #6.** 使用 `deval()` 计算数值解。\n\
  \n让我们考虑几个不同的问题，以展示如何根据先前用于求解 BVP 的步骤过程来使用 MATLAB 工具。\n\n## 狄利克雷边界条件问题\n\n\n\n###\
  \ 示例 1\n\n示例如下：\n\n![$$ \\ddot{y}+2y={\\mathrm{e}}^{\\mathrm{t}} $$](img/490522_1_En_8_Chapter_TeX_IEq3.png)，其中\
  \ `y = [y[0] y[end]]`\n\n这里 `y[0] = y(0) = 0` 和 `y[end] = y(π) = 1` 是狄利克雷边界条件。\n\
  \n给定问题 `f(t, y)` 的解仅在 `t ∈ [0, π]` 范围内及边界之外有效。`f(t, y)` 的有效性并不重要。\n\n我们首先需要将其重写为两个一阶常微分方程：![$$\
  \ \\left\\{\\begin{array}{c}{y}_2={\\dot{y}}_1\\\\ {}{\\dot{y}}_2={e}^t-2{y}_1\\\
  end{array}\\right. $$](img/490522_1_En_8_Chapter_TeX_IEq4.png).\n\n这类似于求解二阶常微分方程的初值问题方法。现在我们编写一个\
  \ m 文件来计算其数值解。以下是计算给定微分方程数值解的脚本（`BVP_EX1.m`）。练习的计算解如图 8-1 所示。\n\n```\nclc; clearvars\n\
  % BVP_EX1.m\n%{\n示例 1. 已知：y\"+2y=exp(t) 边界条件为：y(0)=0, y(pi)=1。\n帮助：首先，我们需要将给定的问题方程\n\
  重写为一组一阶常微分方程，类似于二阶初值问题。\n因此，我们将其重写为：dy/dt=[y2, exp(t)-2*y1]；\ndy/dt 可以通过函数文件或匿名函数定义。\n\
  %}\n% 通过匿名函数定义：\ndy=@(t, y)([y(2); exp(t)-2*y(1)]);\n% 通过匿名函数定义边界条件的残差（狄利克雷边界条件）：\n\
  Res=@(yl, yr)([yl(1), yr(1)-1]);\n% 创建模拟的时间空间：\nt = linspace(0, pi, 40);\n% 创建一个猜测结构，包含一个初始网格\n\
  % 在 [0,pi] 内均匀分布的 40 个点，以及\n% 常量值 y1=0 和 y2=1 的猜测，使用以下命令：\nSOLin1 = bvpinit(t,[0\
  \ 1]);\n% 另一个初始猜测（为了好玩）：y1=2 和 y2=1\nSOLin2 = bvpinit(t,[2 1]);\n% 获取问题的数值解：\nSOL1\
  \ = bvp4c(dy, Res, SOLin1);\nSOL2 = bvp4c(dy, Res, SOLin2);\ny1 = deval(SOL1,t);\n\
  y2 = deval(SOL2,t);\nfigure\nplot(t, y1(1,1:end), 'ro-', t, y2(1, :),'bx-', 'linewidth',\
  \ 1.5),\ngrid minor;\nlegend('\\it 猜测 #1: y_1=1  & y_2=0 ',...\n'\\it 猜测 #2: y_1=2\
  \  & y_2=1', 'location', 'SouthWest')\nxlabel( '\\it t, 时间')\nylabel( '\\it y(t)\
  \ 解值')\naxis tight\nsyms y t d dt e\nEQN = d²*y/dt²+2*y==e^t;\ntitle('\\it 边值问题解:\
  \ $\\frac{d²y}{dt²}+2y=e^t$' , 'Interpreter',  'latex')\n```\n\n![../images/490522_1_En_8_Chapter/490522_1_En_8_Fig1_HTML.png](img/490522_1_En_8_Fig1_HTML.png)\n\
  \n**图 8-1** 二阶边值问题的模拟结果：![$$ \\ddot{y}+2y={e}^t $$](img/490522_1_En_8_Chapter_TeX_IEq5.png)\n\
  \n解决此练习的另一种方法是使用符号数学工具箱，该工具箱可以用两行命令（在 MuPAD 笔记中）计算问题的解析解，语法如下：\n\n![../images/490522_1_En_8_Chapter/490522_1_En_8_Figa_HTML.jpg](img/490522_1_En_8_Figa_HTML.jpg)\n\
  \n![../images/490522_1_En_8_Chapter/490522_1_En_8_Figp_HTML.jpg](img/490522_1_En_8_Figp_HTML.jpg)\n\
  \n```\n[ Sol1:=ode::solve({u\"(t)=exp(t)-2*u(t),\nu(0) = 0, u(PI) = 1}, u(t));\n\
  ```\n\n```\n[ plot(Sol1, t=0..PI, #G, #L)\n```\n\n使用两个彼此值较为接近的不同数值初始猜测对此边值问题进行数值模拟，结果表明，对于此类边值问题，数值初始猜测对给定问题的最终数值解没有任何影响。此练习也可用\
  \ `[10⁷, −10⁷]` 或 `[−10⁷, 10⁷]` 的第二个初始猜测进行测试，并且之前图中显示的结果将以相同方式重复。然而，这些数值初始猜测不能取无穷大（`∞`）的值。如果初始猜测值设置为\
  \ `inf`，则求解器 `bvp4c` 将无法解决问题，因为问题的雅可比矩阵存在奇异性问题。\n\n使用符号数学工具箱（MuPAD 笔记）评估解析解具有简单的语法。然而，并非所有边值问题都能用符号数学工具箱的命令和函数求解。这与初值问题的情况类似。\n\
  \n## 示例 2\n\n这是另一个狄利克雷边界条件问题：![$$ {t}²\\ddot{y}-5t\\dot{y}+8y=0,y(1)=0,y(2)=24.\
  \ $$](img/490522_1_En_8_Chapter_TeX_IEq6.png) 我们将给定的问题重写为两个一阶常微分方程：![$$ \\left\\\
  {\\begin{array}{c}{y}_2={\\dot{y}}_1\\\\ {}{\\dot{y}}_2=\\frac{5t{y}_2-8{y}_1}{t²}\\\
  end{array}\\right. $$](img/490522_1_En_8_Chapter_TeX_IEq7.png).\n\n现在，我们通过脚本函数文件中的一个名为\
  \ `dy` 的嵌套函数来实现上述方程组，该文件命名为 `BVP_EX2.m`。请注意，此问题通过使用函数文件实现，并且定义边界条件和初始猜测结构的几个嵌套函数已嵌入该函数文件中。模拟结果如图\
  \ 8-2 所示。\n\n```\nfunction BVP_EX2\n% BVP_EX2.m 求解给定的边值问题：t²*y\"-5t*y'+8y=0, y(1)=0,\
  \ y(2)=24\nt = linspace(1, 2, 30);\n% 创建一个猜测结构，包含在边界条件范围内的\n% 时间网格和一个猜测函数 (Gsol1)：\n\
  SOLin1 = bvpinit(t,@Gsol1);\n% 另一个初始猜测（使用函数）Gsol2\nSOLin2 = bvpinit(t,@Gsol2);\n\
  % 另一个初始猜测（使用数值）y1=0 和 y2=24\nSOLin3 = bvpinit(t,[0,24]);\n% 获取问题的数值解：\nSOL1 = bvp4c(@dy,@Res,SOLin1);\n\
  SOL2 = bvp4c(@dy,@Res,SOLin2);\nSOL3 = bvp4c(@dy,@Res,SOLin3);\ny1 = deval(SOL1,t);\n\
  y2 = deval(SOL2,t);\ny3 = deval(SOL3,t);\nfigure\nplot(t, y1(1,1:end), 'ro-', t,\
  \ y2(1, :), 'bx-',...\nt, y3(1,:),'kd:','linewidth', 1.5), grid on\nlegend('\\it\
  \ 猜测 #1: 多项式', '\\it 猜测 #2: cos&sin 函数 ',...\n'\\it 猜测 #3: 数值', 'location', 'SouthEast')\n\
  title('\\it 边值问题解:  $\\frac{d²y}{dt²}*t²-5t*\\frac{dy}{dt}+8y=0$', 'Interpreter',\
  \ 'latex')\nxlabel '\\it t',\nylabel '\\it y(t) 解值'\nfunction Ft1=Gsol1(t,~)\n%\
  \ 第一个猜测解函数：\nFt1=([8*t.²-8*t, 16*t-8]);\nend\nfunction Ft2=Gsol2(t,~)\n% 第二个猜测解函数：\n\
  Ft2=([cos(t), -sin(t)]);\nend\nfunction f=dy(t,y)\n% 给定问题的公式表示：\nf=[y(2), (5*t.*y(2)-8*y(1))./t.²];\n\
  end\nfunction F=Res(yl,yr)\n% 现在，我们将边界条件的残差定义为一个嵌套函数。\nF=[yl(1), yr(1)-24];\nend\n\
  end\n```\n\n![../images/490522_1_En_8_Chapter/490522_1_En_8_Fig2_HTML.png](img/490522_1_En_8_Fig2_HTML.png)\n\
  \n**图 8-2** 问题的模拟：![$$ {t}²\\ddot{y}-5t\\dot{y}+8y=0 $$](img/490522_1_En_8_Chapter_TeX_IEq8.png)\n\
  \nMuPAD 笔记中符号数学工具箱的求解命令如下：\n\n![../images/490522_1_En_8_Chapter/490522_1_En_8_Figb_HTML.jpg](img/490522_1_En_8_Figb_HTML.jpg)\n\
  \n```\n Sol1:=ode::solve({u\"(t) =(5*t*u'(t)-8*u(t))/t²,\nu(1) = 0, u(2) = 24},\
  \ u(t));\n```\n\n```\n[ plot(Sol1, t=1..2, #G, #L, #3D)\n```\n\n![../images/490522_1_En_8_Chapter/490522_1_En_8_Figq_HTML.jpg\n\
  \n对于此具有狄利克雷边界条件的二阶非线性边值问题（示例 2）的数值解，我们进行了三种不同的猜测（`BVP_EX2.m`），具体而言，多项式（二次和线性方程）、正弦和余弦函数以及数值猜测，所有这些都得到了良好收敛的解。此外，在本示例中，我们还探索了使用嵌套函数和函数文件来加速模拟过程的方法。此外，我们使用符号数学工具箱以更简单的方式用两行命令计算了此练习的解析解，并绘制了数值。\n\
  \n# 罗宾边界条件问题\n\n罗宾边界条件是混合边界条件。\n\n\n\n### 示例 3\n\n在本例中，我们考察两个具有相同微分方程但使用不同边界条件（罗宾边界条件和狄利克雷边界条件）的边值问题，以进行比较。文中比较了这两个边值问题的两种不同边界条件。\n\
  \n*   **问题 1:** `\\ddot{y}+2y=0\\ \\mathrm{with}\\ BCs:y(0)=1,\\dot{y}\\left(\\\
  pi \\right)=0` （罗宾边界条件或混合边界条件）\n*   **问题 2:** `\\ddot{y}+2y=0\\ \\mathrm{with}\\\
  \ BCs:y(0)=1,y\\left(\\pi \\right)=0` （狄利克雷边界条件）\n\n注意，这两个问题的唯一区别在于它们的边界条件。\n\n\
  首先，我们将给定的问题方程重写为一阶常微分方程组：`\\left\\{\\begin{array}{c}{y}_2={\\dot{y}}_1\\\\ {}{\\\
  dot{y}}_2=-2{y}_1\\end{array}\\right.`\n\n现在，我们使用以下脚本（`BVP_EX3.m`）模拟该问题，该脚本包含两部分；第\
  \ 1 部分求解问题 1（使用狄利克雷边界条件），第 2 部分求解问题 2（罗宾边界条件或混合边界条件）。除了边界条件残差的定义方式不同外，求解这两个问题的方法类似。\n\
  \n```\n% BVP_EX3.m\n% 问题 1\\. 给定: y\"+2y=0\n% 第 1 部分. 边界条件: y(0)=1, dy(pi)=0\\.\
  \ 罗宾边界条件.\nclearvars; clc; close all\ndy=@(t, y)([y(2), -2*y(1)]);\n% 定义边界条件的残差:\n\
  Res=@(yl, yr)([yl(1)-1, yr(2)]);\n% 创建猜测结构:\nSOLin1 = bvpinit(linspace(0,pi,40),[1\
  \ 0]);\n% 另一个初始猜测:\nSOLin2 = bvpinit(linspace(0,pi,40),[2 1]);\n% 获取问题的解:\nSOL1\
  \ = bvp4c(dy,Res,SOLin1);\nSOL2 = bvp4c(dy,Res,SOLin2);\nt = linspace(0,pi, 40);\n\
  y1 = deval(SOL1,t);\ny2 = deval(SOL2,t);\nplot(t, y1(1,1:end), 'mp', t, y2(1, :),'k-',\
  \ 'linewidth', 2.0),\ngrid on; axis tight; hold on\n% 第 2 部分. 问题 2\\. y\"+2y=0,\
  \ 边界条件: y(0)=1, y(pi)=0\\. 狄利克雷边界条件\n%{\n将给定的问题方程重写为一阶常微分方程组:\ndydt=[y2, 2*y1];\n\
  使用匿名函数定义 dydt:\n%}\ndy=@(t,y)([y(2), -2*y(1)]);\n% 定义边界条件的残差:\nRes=@(yl, yr)([yl(1)-1,\
  \ yr(1)]);\n%{\n创建一个猜测结构，包含一个初始网格\n（由 [0,pi]（边界条件范围内）中 40 个（可选）等间距点组成）\n以及一个常数值猜测\
  \ y1=1 和 y2=0，如下所示:\n%}\nSOLin1 = bvpinit(linspace(0,pi,40),[1 0]);\n% 取另一个初始猜测:\
  \ y1=2 和 y2=1\nSOLin2 = bvpinit(linspace(0,pi,40),[2 1]);\n% 获取问题的解:\nSOL1 = bvp4c(dy,Res,SOLin1);\n\
  SOL2 = bvp4c(dy,Res,SOLin2);\nt  = linspace(0,pi, 40);\ny1 = deval(SOL1,t);\ny2\
  \ = deval(SOL2,t);\nplot(t, y1(1,1:end), 'bo', t, y2(1, :), 'r', 'linewidth',2)\n\
  legend('\\it 问题 1: 猜测 #1 [y1=1 & y2=0] ',...\n'\\it 问题 1: 猜测 #2 [y1=2 & y2=1]',\
  \ ...\n'\\it 问题 2: 猜测 #1 [y1=1 & y2=0] ', ...\n'\\it 问题 2: 猜测 #2 [y1=2  & y2=1]',\
  \ ...\n'location', 'southwest')\nxlabel '\\it t', ylabel '\\it y(t) 解值'\ntitle('BVP\
  \ 的解: $\\frac{d²y}{dt²}+2y=0$', 'interpreter', 'latex')\ngtext('问题 1: y(0)=1, y(\\\
  pi)=0')\ngtext('问题 2: ; y(0)=1,dy(\\pi)=0')\nhold off\n```\n\n图 8-3 显示了该脚本的仿真结果。本练习清晰地展示了边界条件对边值问题最终解的影响程度。\n\
  \n图 8-3：采用两种不同边界条件（罗宾边界条件（问题 1）和狄利克雷边界条件（问题 2））对 `\\ddot{y}+2y=0` 进行的仿真\n\n另一种解法可以通过\
  \ MuPAD 注释中的符号数学工具箱计算得出。\n\n```\n[ SOL1:=ode::solve({y\"(t) =-2*y(t),y(0) = 1, y'(PI)\
  \ = 0}, y(t));\n```\n\n```\n[ plot(SOL1, t=0..PI, #G, #L)\n```\n\n```\n[ SOL2:=ode::solve({y\"\
  (t) =-2*y(t), y(0) = 1, y(PI) = 0}, y(t));\n```\n\n```\n[  plot(SOL2, t=0..PI, #G,\
  \ #L)\n```\n\n```\n[ plot(SOL1,SOL2, t=0..PI, #G, #L)\n```\n\n本练习的仿真结果表明，两种不同的边界值猜测如何产生收敛良好的解。在此示例中，与之前的示例（示例\
  \ 1）一样，可以在很大范围内测试边界值的数值猜测，例如 `[−10⁸, 10¹⁰]` 或反之。\n\n## 斯图姆-刘维尔边值问题\n\n在科学计算和工程研究中，有许多具有广泛应用的边值问题。其中一类边值问题是斯图姆-刘维尔边值问题，以两位法国数学家雅克·斯图姆和约瑟夫·刘维尔的名字命名。斯图姆-刘维尔边值问题\
  \ [1] 具有广泛的应用领域，例如：\n\n*   非均匀杆中的热传导\n*   量子力学中的一维薛定谔方程\n*   非均匀杆和弦的振动\n*   散射理论中的希尔方程\n\
  *   球体的振荡与勒让德方程\n*   圆柱体和球体的热力学\n\n\n\n### 示例 4\n\n以下是具有常系数值的 Sturm-Liouville 边值问题的一个示例：\n\
  \n![$$ -\\ddot{u}+{\\omega}²u=f(t)\\ \\mathrm{with}\\ BCsu(0)=u(1)=0 $$](img/490522_1_En_8_Chapter_TeX_IEq13.png)\
  \ （周期边界条件）\n\n让我们考虑以下情况：*ω* = 0、3、7、13 和 *f*(*t*) = *sinh*(*t*)。\n\n现在，我们将 Sturm-Liouville\
  \ 方程重写为我们所考虑的情况。\n\n![$$ -\\ddot{u}+{\\omega}²u=\\mathit{\\sinh}(t)\\Rightarrow\
  \ \\left\\{\\begin{array}{c}{u}_2={\\dot{u}}_1\\\\ {}{\\dot{u}}_2={\\omega}²{u}_1-\\\
  mathit{\\sinh}(t)\\end{array}\\right. $$](img/490522_1_En_8_Chapter_TeX_Equh.png)\n\
  \n在 MATLAB 的 BVP 求解器工具中，有一个选项可以在 `bvpinit` 中包含参数，我们可以利用该选项来包含 *ω* 的值用于仿真，并编写 `BVP_EX4.m`。仿真结果如图\
  \ 8-4 所示。\n\n```\nclc; clearvars; close all\n% BVP_EX4.m\n% Sturm_Liouville_bvp.\
  \ Given: -u\"+w²*u=sinh(t)\n% periodic boundary conditions: u(0)=u(1)=0\n%  ----------------------------------------------------------\n\
  % Define residues of BCs via a function handle\nRes=@(yl,yr)([yl(1) yr(1)]);\n%\
  \ 1st guess solution function defined with function handle:\nGsol=@(t)([sin(-0.540302305868140*t),cos(t)-0.540302305868140]);\n\
  close all; clc\nomega=[0, 3, 5, 7, 13];\nt = linspace(0, 1, 500);\n% A guess structure\
  \ consisting of time mesh within [0, 1]\n% in the range of BCs and a guess function\
  \ (Gsol):\nSOLin1 = bvpinit(linspace(0,1, 10),Gsol);\n% Another numeric value based\
  \ initial guess y1=0 and y2=0\nSOLin2 = bvpinit(linspace(0,1, 10),[0,0]);\n% Plotting\
  \ options:\nLabelit = { };\nColorit1 = 'krgbm';\nColorit2 = 'krgbm';\nLineit1  =\
  \ '---:--:---:';\nLineit2  = '---:--:---:';\nfor ii=1:numel(omega)\nStyleit1=[Colorit1(ii),\
  \ Lineit1(ii)];\nStyleit2=[Colorit2(ii), Lineit2(ii)];\n% Given problem formulation:\n\
  dy=@(t,y)([y(2), omega(ii)²*y(1)-sinh(t)]);\n%Obtain the solutions of the problem\
  \ for two initial guesses:\nSOL1 = bvp4c(dy,Res,SOLin1);\nSOL2 = bvp4c(dy,Res,SOLin2);\n\
  % Compute numeric solutions of the problem within time-space:\ny1 = deval(SOL1,t);\n\
