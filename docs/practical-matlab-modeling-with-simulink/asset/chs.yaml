  \ MATLAB 脚本模型开发四步 Adams-Moulton 方法（不使用 ODEx 求解器，例如 `ode23`、`ode45`、`ode113` 等）。\n\
  *   对这两个模型进行仿真并比较其结果。\n\n### 练习 3\n\n控制是工程学的重要组成部分，许多系统都用微分方程建模。这里有一个复杂控制问题的例子，其公式如下：![$$\
