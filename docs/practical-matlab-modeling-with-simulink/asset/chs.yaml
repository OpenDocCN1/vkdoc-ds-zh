  图 11-2 – 在强空气阻力（情形#1）和小空气阻力（情形#2）两种环境下，坠落物体的时间与速度关系图


  两种求解器针对两种情形得到的仿真结果，如图 11-2 所示，收敛良好且几乎相同。当物体的阻力增大 100 倍时，其终端速度下降了约 90 m/s，降幅约为 995%。空气阻力对坠落物体的影响非常显著。对于情形#1
  和#2，终端速度分别约在 2.5 秒和 30 秒后达到。




  '
- '# 抛射球体轨迹


  多个因素会影响击打或抛射球体的飞行轨迹。此练习题是微分方程应用的一个良好示例。所有优秀的网球运动员都知道如何击球，使其以特定角度飞过球网并落在对手场地上的正确位置。高质量的击球是数年艰苦训练和实践的结果。如果一名新手击球的速度比职业网球运动员快约
  1%或力量稍大，那么球落地的位置会明显更远（约 0.50 米或以上），超出底线。球体轨迹问题已由数篇文献（例如参考文献[1]）中的球体轨迹理论进行了良好阐述和解释。


  图 11-3 显示了作用在空气中飞行的球体上的三个力。


  -   重力，如下所示：


  ![$$ \overrightarrow{F_g}=m\overrightarrow{g} $$](img/490522_1_En_11_Chapter_TeX_Equ5.png)


  (11-5)


  其中 ![$$ \overrightarrow{g}=\left(0,0,-g\right) $$](img/490522_1_En_11_Chapter_TeX_IEq9.png)
  是重力加速度向量。


  -   空气阻力，如下所示：


  ![$$ \overrightarrow{F_D}=\frac{-{D}_L(v)m\overrightarrow{v}}{v} $$](img/490522_1_En_11_Chapter_TeX_Equ6.png)


  (11-6)


  该力的方向与球的速度向量 ![$$ \overrightarrow{v} $$](img/490522_1_En_11_Chapter_TeX_IEq10.png)
  相反。


  -   马格努斯力，如下所示：


  ![$$ \overrightarrow{F_M}={M}_L\overrightarrow{\omega}/\left(\omega \times \overrightarrow{v}\right)/v
  $$](img/490522_1_En_11_Chapter_TeX_Equ7.png)


  (11-7)


  阻力 `D_L(v)` 和马格努斯力 `M_L(v)` 的大小通常具有理想流体理论 [2] 给出的形式，如下所示：


  ![$$ {D}_L(v)=\frac{C_D}{2}\frac{\pi {d}²}{4}\ \rho {v}² $$](img/490522_1_En_11_Chapter_TeX_Equ8.png)


  (11-8)


  ![$$ {M}_L(v)=\frac{C_M}{2}\frac{\pi {d}²}{4}\ \rho {v}² $$](img/490522_1_En_11_Chapter_TeX_Equ9.png)


  (11-9)


  其中 `ρ` 是空气密度。系数 `C_D` 和 `C_M` 取决于实际流体（例如空气）以及速度 `v`、球的旋转和球表面材料。这些系数通过实验确定，并取自参考文献[1]的实验结果。对于速度为
  ![$$ v=13.6\frac{m}{s} $$](img/490522_1_En_11_Chapter_TeX_IEq11.png) 且球旋转（自转）为 `n
  = [800, 3250] rpm` 的网球，系数 `C_D` 和 `C_M` 仅取决于 ![$$ \frac{v}{\omega } $$](img/490522_1_En_11_Chapter_TeX_IEq12.png)
  的比值，其中 ![$$ \omega =\frac{d}{2}\left|\overrightarrow{\omega}\times \frac{\overrightarrow{v}}{v}\right|
  $$](img/490522_1_En_11_Chapter_TeX_IEq13.png) 在某些情况下是旋转球赤道速度 ![$$ \frac{\omega d}{2}
  $$](img/490522_1_En_11_Chapter_TeX_IEq14.png) 在速度向量 ![$$ \overrightarrow{v} $$](img/490522_1_En_11_Chapter_TeX_IEq15.png)
  上的投影。参考文献[1]得到了以下系数的经验表达式：


  ![$$ {C}_D=0.508+{\left(\frac{1}{22.053+4.196{\left(\frac{v}{\omega}\right)}^{\frac{5}{2}}}\right)}^{\frac{2}{5}}
  $$](img/490522_1_En_11_Chapter_TeX_Equ10.png)


  (11-10)


  ![$$ {C}_M=\frac{1}{2.022+0.981\left(\frac{v}{\omega}\right)} $$](img/490522_1_En_11_Chapter_TeX_Equ11.png)


  (11-11)


  ![../images/490522_1_En_11_Chapter/490522_1_En_11_Fig3_HTML.jpg](img/490522_1_En_11_Fig3_HTML.jpg)


  **图 11-3** 作用在空气中运动旋转球上的力


  我们可以忽略球旋转的减速，并取 `ω` 为常数。球体的轨迹向量可以通过牛顿第二定律方程定义，该方程针对来自参考文献[3]的位置向量 ![$$ \overrightarrow{r}(t)
  $$](img/490522_1_En_11_Chapter_TeX_IEq16.png)。


  ![$$ \frac{m{d}²\overrightarrow{r}(t)}{d{t}²}=-m\overrightarrow{g}-\frac{D_Lv}{v}+\frac{M_L\overrightarrow{\omega}}{\omega}\kern0.5em
  \times \frac{\overrightarrow{v}}{v} $$](img/490522_1_En_11_Chapter_TeX_Equ12.png)


  (11-12)


  初始条件为 ![$$ \overrightarrow{r}(0)={\overrightarrow{r}}_0\ \mathrm{and}\ \frac{\mathrm{d}\overrightarrow{r}(0)}{dt}={\overrightarrow{v}}_0
  $$](img/490522_1_En_11_Chapter_TeX_IEq17.png)。该方程是一个由三个微分方程组成的非线性系统，不存在解析解。因此，唯一的求解方法是数值求解。我们在
  x-z 平面中选择 x 轴，然后通过代入 `D_L` 和 `M_L`，从方程(11-12)中得到最终公式[3]的方程(11-13)和(11-14)。


  ![$$ \ddot{x}=-{C}_D\alpha v\dot{x}+\eta {C}_M\alpha v\dot{z} $$](img/490522_1_En_11_Chapter_TeX_Equ13.png)


  (11-13)


  ![$$ \ddot{z}=-g-{C}_D\alpha v\dot{z}-\eta {C}_M\alpha v\dot{x} $$](img/490522_1_En_11_Chapter_TeX_Equ14.png)


  (11-14)


  其中 ![$$ v=\sqrt{{\dot{x}}²+{\dot{z}}²} $$](img/490522_1_En_11_Chapter_TeX_IEq18.png)
  且 ![$$ \alpha =\frac{\rho \pi {d}²}{8m}. $$](img/490522_1_En_11_Chapter_TeX_IEq19.png)
  参数 `η = ±1` 描述旋转方向，例如，对于上旋，`η = 1`。对于 `t = 0` 的初始条件，使用以下初始值：


  ![$$ x(0)=0,\kern0.5em z(0)=h,\kern0.5em \dot{x}(0)={v}_0\cos \left(\theta \right),\kern0.5em
  \dot{z}(0)={v}_0\sin \left(\theta \right) $$](img/490522_1_En_11_Chapter_TeX_Equ15.png)


  (11-15)


  其中 `v0` 是初始速度向量 ![$$ {\overrightarrow{v}}_0 $$](img/490522_1_En_11_Chapter_TeX_IEq20.png)
  的大小，`θ` 是 ![$$ {\overrightarrow{v}}_0 $$](img/490522_1_En_11_Chapter_TeX_IEq21.png)
  与 x 轴之间的夹角。


  在模拟中，我们将使用两种条件：球在真空中和球在空气中。


  对于球在真空中的情况，作用在球上的力只有重力，因此方程(11-13)和(11-14)将具有简单的形式：![$$ \ddot{x}=0,\kern0.5em \ddot{z}=-g
  $$](img/490522_1_En_11_Chapter_TeX_IEq22.png)。


  对于球在空气中的情况，为了找到问题的数值解，我们通过引入新的变量名，将二阶常微分方程的方程(11-13)和方程(11-14)改写为一阶常微分方程组，如下所示：


  ![$$ \left\{\begin{array}{c}\begin{array}{c}\dot{x}={v}_x\\ {}\dot{z}={v}_z\end{array}\\
  {}\begin{array}{c}{\dot{v}}_x=-{C}_D\ \alpha\ v\ {v}_x+\eta {C}_M\ \alpha\ v\ {v}_z\\
  {}{\dot{v}}_z=-g-{C}_D\ \alpha\ v\ {v}_z-\eta {C}_M\ \alpha\ v\ {v}_x\end{array}\end{array}\right.
  $$](img/490522_1_En_11_Chapter_TeX_Equ16.png)


  (11-16)


  其中 ![$$ v=\sqrt{{v_x}²+{v_z}²} $$](img/490522_1_En_11_Chapter_TeX_IEq23.png)。初始条件为
  `x(0) = 0`，`z(0) = h`，`v_x(0) = v0 cos(θ)`，以及 `v_z(0) = v0 sin(θ)`。在模拟中，我们使用以下数值[1]：


  ![$$ g=9.8\ \left[\frac{m}{s²}\right] $$](images/490522_1_En_11_Chapter/490522_1_En_11_Chapter_TeX_Equa.png)


  ![$$ \mathrm{网球直径}=0.063\ \left[\mathrm{m}\right] $$](images/490522_1_En_11_Chapter/490522_1_En_11_Chapter_TeX_Equb.png)


  ![$$ \mathrm{质量}:m=0.05\ \left[ kg\right] $$](images/490522_1_En_11_Chapter/490522_1_En_11_Chapter_TeX_Equc.png)


  空气密度： ![$$ \rho =1.29\ \left[\frac{kg}{m³}\right] $$](images/490522_1_En_11_Chapter/490522_1_En_11_Chapter_TeX_IEq24.png)


  此外，对于初始条件，我们将使用 ![$$ h=1\ \left[m\right],{v}_0=25\ \left[\frac{m}{s}\right],\mathrm{and}\kern0.5em
  \theta ={15}⁰ $$](images/490522_1_En_11_Chapter/490522_1_En_11_Chapter_TeX_IEq25.png)。对于球的旋转，对于上旋，我们将使用
  ![$$ \omega =20\ \left[\frac{1}{s}\right]\mathrm{and}\ \eta =1 $$](images/490522_1_En_11_Chapter/490522_1_En_11_Chapter_TeX_IEq26.png)。


  网球轨迹的仿真模型是在 MATLAB 和 Simulink 中开发的。情况 #1（网球在真空中被击打）的解析解位于 `Thrown_Ball.m` 中。该脚本的仿真结果如图
  11-4 所示。


  ![../images/490522_1_En_11_Chapter/490522_1_En_11_Fig4_HTML.png](img/490522_1_En_11_Fig4_HTML.png)


  **图 11-4** 网球在真空中的轨迹


  ```matlab

  % Thrown_Object.m. 情况 1. 解析解 - 球在真空中的轨迹

  x_z_vac=dsolve(''D2x=0'', ''D2z=-g'', ''x(0)=0'',...

  ''Dx(0)=v0*cos(theta*pi/180)'', ''z(0)=h'', ...

  ''Dz(0)=v0*sin(theta*pi/180)'', ''t'');

  xt=x_z_vac.x  %#ok

  zt=x_z_vac.z  %#ok

  g=9.8;        % 重力加速度

  h=1;          % 球在距离地面 1 m 处被击打

  theta=15;     % 球以 15 度角被击打

  v0=25;        % 球的初始速度

  xt=vectorize(xt); zt=vectorize(zt); t=linspace(0,1.5, 200);

  xt=eval(xt); zt=eval(zt); z_i=find(zt==min(abs(zt)));

  touch_gr=xt(z_i); t_touch = t(z_i);

  plot(xt, zt,''ko'', ''markersize'', 4,''MarkerFaceColor'',''y''), grid on

  xlim([0, touch_gr]);

  text0=(''球在距离地面 h=1[m] 处以 \theta=15⁰ 角被击打'');

  gtext(text0, ''fontsize'', 13);

  text1=[''球在 (x 方向) 距离 '' ... num2str(touch_gr) ''[m] 处落地'']; gtext(text1);

  text2=[''球在 '' num2str(t_touch)'' [秒] 后落地''];

  gtext(text2);

  title(''网球在真空中被击打的轨迹, v_0=25 [m/s] '')

  xlabel(''x, (水平方向) [m]''), ylabel(''z, [m]'')

  ```


  下一个仿真模型 `Thrown_Ball_All.m` 计算了球在真空中、空气中带旋转以及空气中无旋转时的轨迹。该脚本获得的仿真结果如图 11-5 所示。


  ![../images/490522_1_En_11_Chapter/490522_1_En_11_Fig5_HTML.png](img/490522_1_En_11_Fig5_HTML.png)


  **图 11-5** 网球在真空、空气中有上旋和无旋转情况下的轨迹


  ```matlab

  % Thrown_Ball_All.m

  h =1;       % [m];

  v0=25;      % [m*s^-1];

  theta=15;   % [deg];

  ro=1.29;    % [kg*m^-3];

  g=9.81;     % [m/s²]

  d=.063;     % [m];

  m=.05;      % [kg];

  w=20;       % [m*s^-1]; 旋转球的角速度

  eta=1;      % 描述旋转的方向(+ -)和存在性;

  % eta=1 表示上旋。

  alfa=ro*pi*d²/(8*m); time=0:.01:1.5;

  ICs=[0, 1, v0*cos(theta*pi/180), v0*sin(theta*pi/180)];

  u  = @(t,x)sqrt(x(3).²+x(4).²);

  CD = @(t,x)(0.508+(1./(22.053+4.196*(u(t,x)./w).^(5/2))).^(2/5));

  CM = @(t,x)(1/(2.022+.981*(u(t,x)./w)));

  vacuum = @(t,x)([x(3); x(4); 0; -g]);

  nospin = @(t,x)([x(3); x(4); (-1)*CD(t,x)*alfa*u(t,x)*x(3);

  (-1)*g-CD(t,x)*alfa*u(t,x)*x(4)]);

  topspin= @(t,x)([x(3); x(4);

  (-1)*CD(t,x)*alfa*u(t,x)*x(3)+eta*CM(t,x)*alfa*u(t,x)*x(4);

  (-1)*g-CD(t,x)*alfa*u(t,x)*x(4)-eta*CM(t,x)*alfa*u(t,x)*x(3)]);

  [tvac, XZvac]= ode45(vacuum, time, ICs, []);

  [tns, XZns]  = ode45(nospin, time, ICs, []);

  [tts, XZts]  = ode23(topspin, time, ICs, []);

  % 情况 #1. 球在真空中被击打

  z_i=find(abs(XZvac(:,2))<=min(abs(XZvac(:,2))));

  t_gr=XZvac(z_i,1); t_t = time(z_i);

  % 情况 #2. 球在无旋转下被击打

  z1_i =find(abs(XZns(:,2))<=min(abs(XZns(:,2))));

  t_gr1=XZns(z1_i,1); t_t1 = time(z1_i);

  % 情况 #3. 球在上旋下被击打

  z2_i =find(abs(XZts(:,2))<=min(abs(XZts(:,2))));

  t_gr2=XZts(z2_i,1); t_t2 = time(z2_i);

  plot(XZvac(:,1), XZvac(:,2), ''bo'', ''linewidth'', 1), grid; hold on

  plot(XZns(:,1), XZns(:,2), ''m'', ''linewidth'', 2)

  plot(XZts(:,1), XZts(:,2), ''ko-'', ''linewidth'', 1.0)

  legend(''在真空中'',''在空气中无旋转'',''在空气中上旋''),

  ylim([0, 3.35])

  title ''网球在 \theta=15⁰, h=1 m 条件下的轨迹''

  xlabel ''长度, [m]''; ylabel ''高度, [m]''

  tt1=[''真空: 球 (在 x 轴方向) 落地距离: '' num2str(t_gr) ''[m]''];

  gtext(tt1, ''backgroundcolor'', ''w'');

  tt1a=[''真空: 球落地时间: '' num2str(t_t) ''[s]''];

  gtext(tt1a, ''backgroundcolor'', ''w'');

  tt2=[''无旋转: 球落地距离: '' num2str(t_gr1) '' [m]''];

  gtext(tt2, ''backgroundcolor'', ''w'');

  tt2a=[''无旋转: 球落地时间: '' num2str(t_t1)  '' [s]''];

  gtext(tt2a, ''backgroundcolor'', ''w'');

  tt3=[''上旋: 球落地距离: '' num2str(t_gr2) '' [m]''];

  gtext(tt3, ''backgroundcolor'', ''w'');

  tt3a=[''上旋: 球落地时间: '' num2str(t_t2) '' [s]''];

  gtext(tt3a, ''backgroundcolor'', ''w''); hold off

  ```


  另一种模拟抛射球体轨迹的方法是构建一个 Simulink 模型 `TENNIS_Ball.slx`，如图 11-6 所示（以及两个子系统，如图 11-7 和图
  11-8 所示），用于模拟三种情况：真空中、空气中上旋（`η = 1`）以及空气中无旋转（`η = 0`）。


  ![../images/490522_1_En_11_Chapter/490522_1_En_11_Fig8_HTML.jpg](img/490522_1_En_11_Fig8_HTML.jpg)


  **图 11-8** 模型 `TENNIS_Ball.slx` 的无旋转（无自旋：`η = 0`）子系统


  ![../images/490522_1_En_11_Chapter/490522_1_En_11_Fig7_HTML.jpg](img/490522_1_En_11_Fig7_HTML.jpg)


  **图 11-7** 模型 `TENNIS_Ball.slx` 的上旋模型子系统（上旋：`η = 1`）


  ![../images/490522_1_En_11_Chapter/490522_1_En_11_Fig6_HTML.jpg](img/490522_1_En_11_Fig6_HTML.jpg)


  **图 11-6** 网球轨迹的主 Simulink 模型


  请注意，在构建图 11-6 所示的 Simulink 模型 `TENNIS_Ball.slx` 时，使用了 [Function] 模块来处理 `C_D` 和 `C_M`
  的代数表达式，以简化模型构建。此外，所有初始条件，包括 ![$$ \dot{z}(0)={v}_0\cos \left(\theta \right)\ \mathrm{and}\
  \dot{x}(0)={v}_0\sin \left(\theta \right) $$](img/490522_1_En_11_Chapter_TeX_IEq27.png)，都通过
  [Integrator] 模块的内部初始条件源插入到模型中。该问题主 Simulink 模型的真空部分由 [Constant] 输入、[Integrator]
  和 [Scope] 模块组成。空气中带旋转和无旋转的部分在子类中建模，并置于两个子系统中，如图 11-7 和图 11-8 所示。


  当使用以下脚本 `Sim_TENNIS_Ball.m` 执行图 11-6、图 11-7 和图 11-8 中所示、采用固定步长求解器 `ode8` 的 Simulink
  模型 `TENNIS_Ball.slx` 时，我们将获得与前文图 11-5 所示结果相同的仿真结果（此处未显示绘图）。


  ```matlab

  % Sim_TENNIS_Ball.m

  % 使用固定步长求解器 ode8 的 SIMULINK 模型

  set_param(''TENNIS_ball'',''Solver'',''ode8'',''StopTime'',''1.5'')

  out=sim(''TENNIS_ball'');

  plot(out.yout{2}.Values.Data,out.yout{1}.Values.Data, ''g'',...

  out.yout{4}.Values.Data,out.yout{3}.Values.Data, ''c:'',...

  out.yout{6}.Values.Data,out.yout{5}.Values.Data,''r-.'', ... ''linewidth'', 3),
  grid on

  legend(''通过 SIM 仿真的真空中'', ''通过 SIM 仿真的空气中无旋转'',...

  ''通过 SIM 仿真的空气中上旋''), ylim([0, 3.35])

  title(''网球在 \theta=15⁰ & h=1 m 条件下的轨迹'')

  xlabel(''长度, [m]''), ylabel(''高度, [m]'')

  ```


  我们再次看到，较高的球旋转会使其飞行距离更短。此外，数值仿真结果表明，如果球在真空中被击打（或忽略空气阻力），它飞行距离最远，飞行时间最长，这与物理学课程中的知识一致。




