- fmt: "# [1] 120\n\n## CHAPTER 7\n\n## Point-Free Programming\n\nIn this last chapter,\
    \ we will not so much discuss actual programming but a programming style called\
    \ *point-free programming* (not *pointless* programming), which is characterized\
    \ by constructing functions through a composition of other functions rather than\
    \ writing new functions.\n\nA lot of computing can be expressed as the steps that\
    \ data flow through and how data is transformed along the way. We write functions\
    \ to handle all the most basic steps, the atoms of a program, and then construct\
    \ functions for more complex operations by combining more fundamental transformations,\
    \ building program molecules from the program atoms.\n\nThe term *point-free*\
    \ refers to the intermediate states data can be in when computing a sequence of\
    \ transformations. The *points* it refers to are the states the data is in after\
    \ each transformation, and *point-free* means that we do not focus on these points\
    \ in any way. They are simply not mentioned anywhere in code written using point-free\
    \ programming.\n\nThis might all sound a bit abstract, but if you are used to\
    \ writing pipelines in shell scripts, it should soon become very familiar because\
    \ point-free programming is exactly what you do when you write a pipeline. There,\
    \ data flow through a number of programs tied together. The output of one program\
    \ becomes the input for the next in the pipeline, and you never refer to the intermediate\
    \ data, only the steps of transformations the data go through as the pipeline\
    \ processes it.\n\n© Thomas Mailund 2023  \nT. Mailund, *Functional Programming\
    \ in R 4*, [https://doi.org/10.1007/978-1-4842-9487-1_7](https://doi.org/10.1007/978-1-4842-9487-1_7#DOI)\n\
    \n### Function Composition\n\nThe simplest way to construct new functions from\
    \ more basic ones is through function composition. In mathematics, if we have\
    \ a function, `f`, mapping from domain `A` to domain `B`, which we can write as\
    \ `f : A → B`, and another function `g`, `g : A → C`, we can create a new function\
    \ `h : A → C` by composing the two: `h(x) = g(f(x))`.\n\nWe can do exactly the\
    \ same thing in R and define `h` in terms of functions `f` and `g` like this:\n\
    \n```\nh <- function(x) g(f(x))\n```\n\nThere is a lot of extra fluff in writing\
    \ a new function explicitly just to combine two other functions. In mathematical\
    \ notation, we don't write the combination of two functions that way. We write\
    \ the function composition as `h = g ° f`. Composing functions to define new functions,\
    \ rather than defining functions that just explicitly call others, is what we\
    \ call point-free programming, and it is easily done in R.\n\nYou can write a\
    \ composition function, a higher-order function that takes two functions as arguments\
    \ and returns their composition:\n\n```\ncompose <- function(g, f) function(...)\
    \ g(f(...))\n```\n\nWe can then use this function to handle a common case when\
    \ we are using `Map` and frequently want to `unlist` the result. We could use\
    \ `Map` and then `unlist` by explicitly calling them, of course:\n\n```\nxs <-\
    \ 1:4\nunlist(Map(\\(x) x + 2, xs))  # explicit Map + unlist call\n## [1] 3 4\
    \ 5 6\n```\n\nbut we could also compose `Map` and `unlist` to create a new mapping\
    \ function from their composition:\n\n```\numap <- compose(unlist, Map)  # composing\
    \ Map and unlist\numap(\\(x) x + 2, xs)          # using the new function\n##\
    \ [1] 3 4 5 6\n```\n\nTo get something similar to the mathematical notation, we\
    \ want it to be an infix operator, but the package `pryr` has already defined\
    \ it for us so we can write the same code as this:\n\n```\nlibrary(pryr)\numap\
    \ <- unlist %.% Map\numap(\\(x) x + 2, xs)\n## [1] 3 4 5 6\n```\n\nWe are not\
    \ limited to only composing two functions, and since function composition is associative,\
    \ we don't need to worry about the order in which they are composed, so we don't\
    \ need to use parentheses around compositions. We can combine three or more functions\
    \ as well, and we can combine functions with anonymous functions if we need some\
    \ extra functionality that isn't already implemented as a named function. For\
    \ example, we could define a function for computing the root mean square error\
    \ like this:\n\n```\nrmse <- sqrt %.% mean %.% \\(x, y) (x - y)**2\nrmse(1:4,\
    \ 2:5)\n## [1] 1\n```\n\nWe need a new function for computing the squared distance\
    \ between `x` and `y`, so we add an anonymous function for that, but then we can\
    \ just use `mean` and `sqrt` to get the rest of the functionality.\n\nIn the mathematical\
    \ notation for function composition, you always write the functions you compose\
    \ in the same order as you would write them if you explicitly called them, so\
    \ `h ° g ° f` would be evaluated on a value `x` as `h(g(f(x)))`. This is great\
    \ if you are used to reading from right to left, but if you are used to reading\
    \ left to right, it is a bit backward.\n\nOf course, nothing prevents us from\
    \ writing a function composition operator that reverses the order of the functions.\
    \ To avoid confusion with the mathematical notation for function composition,\
    \ we would use a different operator so we could define `;` such that `f ; g =\
    \ g ° f` and in R use that for function composition:\n\n```\n`%;%` <- function(f,\
    \ g) function(...) g(f(...))\nrmse <- (\\(x, y) (x - y)**2) %;% mean %;% sqrt\n\
    rmse(1:4, 2:5)\n## [1] 1\n```\n\nHere, I need parentheses around the anonymous\
    \ function to prevent R from considering the composition as part of the function\
    \ body, but otherwise, the functionality is the same as before; we can just read\
    \ the composition from left to right.\n\n### Pipelines\n\nThe `magrittr` package\
    \ introduced a \"left-to-right\" function composition as the operator `%>%`, and\
    \ with R 4.1 we got a built-in operator `|>` with the same purpose. Although they\
    \ differ slightly in syntax and flexibility, both aim at making data analysis\
    \ pipelines easier to read and write by specifying transformations in a left-to-right\
    \ pipeline syntax. Both allow you to chain together various data transformations\
    \ and analyses in ways very similar to how you chain together command-line tools\
    \ in shell pipelines.\n\nThe various operations are function calls, and these\
    \ functions are chained together with the `%>%` or `|>` operators, moving the\
    \ output of one function to the input of the next.\n\nFor example, to take the\
    \ vector `1:4`, get the mean of it, and then take the `sqrt`, you can write a\
    \ pipeline like this:\n\n```\nlibrary(magrittr)\n1:4 %>% mean %>% sqrt\n## [1]\
    \ 1.581139\n```\n\nor using `|>`:\n\n```\n1:4 |> mean() |> sqrt()\n```"
  raw: '## [1] 120


    **CHAPTER 7**


    **Point-Free**


    **Programming**


    In this last chapter, we will not so much discuss actual programming but a programming
    style called *point-free programming* (not *pointless* programming), which is
    characterized by constructing functions through a composition of other functions
    rather than writing new functions.


    A lot of computing can be expressed as the steps that data flow through and how
    data is transformed along the way. We write functions to handle all the most basic
    steps, the atoms of a program, and then construct functions for more complex operations
    by combining more fundamental transformations, building program molecules from
    the program atoms.


    The term *point-free* refers to the intermediate states data can be in when computing
    a sequence of transformations. The *points* it refers to are the states the data
    is in after each transformation, and *point-free* means that we do not focus on
    these points in any way. They are simply not mentioned anywhere in code written
    using point-free programming.


    This might all sound a bit abstract, but if you are used to writing pipelines
    in shell scripts, it should soon become very familiar because point-free programming
    is exactly what you do when you write a pipeline.


    There, data flow through a number of programs tied together. The output of one
    program becomes the input for the next in the pipeline, and you never refer to
    the intermediate data, only the steps of transformations the data go through as
    the pipeline processes it.


    © Thomas Mailund 2023


    T. Mailund, *Functional Programming in R 4*, [https://doi.org/10.1007/978-1-4842-9487-1_7](https://doi.org/10.1007/978-1-4842-9487-1_7#DOI)


    Chapter 7 point-Free programming


    **Function Composition**


    The simplest way to construct new functions from more basic ones is through function
    composition. In mathematics, if we have a function, *f*, mapping from domain *A*
    to domain *B*, which we can write as *f* : *A* → *B*, and another function *g*,
    *g* : *A* → *C*, we can create a new function *h* : *A* → *C* by composing the
    two: *h*( *x*) = *g*( *f* ( *x*)).


    We can do exactly the same thing in R and define h in terms of functions f and
    g like this:


    h <- **function**(x) g(f(x))


    There is a lot of extra fluff in writing a new function explicitly just to combine
    two other functions. In mathematical notation, we don’t write the combination
    of two functions that way. We write the function composition as *h* = *g ° f*.
    Composing functions to define new functions, rather than defining functions that
    just explicitly call others, is what we call point-free programming, and it is
    easily done in R.


    You can write a composition function, a higher-order function that takes two functions
    as arguments and returns their composition: compose <- **function**(g, f) **function**(...)
    g(f(...)) We can then use this function to handle a common case when we are using
    Map and frequently want to unlist the result. We could use Map and then unlist
    by explicitly calling them, of course:


    xs <- 1:4


    unlist(Map(\(x) x + 2, xs)) *# explicit Map + unlist call*


    ## [1] 3 4 5 6


    Chapter 7 point-Free programming


    but we could also compose Map and unlist to create a new mapping function from
    their composition:


    umap <- compose(unlist, Map) *# composing Map and unlist* umap(\(x) x + 2, xs)
    *# using the new function*


    ## [1] 3 4 5 6


    To get something similar to the mathematical notation, we want it to be an infix
    operator, but the package pryr has already defined it for us so we can write the
    same code as this:


    library(pryr)


    umap <- unlist %.% Map


    umap(\(x) x + 2, xs)


    ## [1] 3 4 5 6


    We are not limited to only composing two functions, and since function composition
    is associative, we don’t need to worry about the order in which they are composed,
    so we don’t need to use parentheses around compositions. We can combine three
    or more functions as well, and we can combine functions with anonymous functions
    if we need some extra functionality that isn’t already implemented as a named
    function. For example, we could define a function for computing the root mean
    square error like this:


    rmse <- sqrt %.% mean %.% \(x, y) (x - y)**2


    rmse(1:4, 2:5)


    ## [1] 1


    We need a new function for computing the squared distance between x and y, so
    we add an anonymous function for that, but then we can just use mean and sqrt
    to get the rest of the functionality.


    Chapter 7 point-Free programming


    In the mathematical notation for function composition, you always write the functions
    you compose in the same order as you would write them if you explicitly called
    them, so *h°g°f* would be evaluated on a value *x* as *h*( *g*( *f* ( *x*))).
    This is great if you are used to reading from right to left, but if you are used
    to reading left to right, it is a bit backward.


    Of course, nothing prevents us from writing a function composition operator that
    reverses the order of the functions. To avoid confusion with the mathematical
    notation for function composition, we would use a different operator so we could
    define ; such that *f*; *g* = *g ° f* and in R use that for function composition:


    `%;%` <- **function**(f, g) **function**(...) g(f(...)) rmse <- (\(x, y) (x -
    y)**2) %;% mean %;% sqrt


    rmse(1:4, 2:5)


    ## [1] 1


    Here, I need parentheses around the anonymous function to prevent R from considering
    the composition as part of the function body, but otherwise, the functionality
    is the same as before; we can just read the composition from left to right.


    **Pipelines**


    The magrittr package introduced a “left-to-right” function composition as the
    operator %>%, and with R 4.1 we got a built-in operator |> with the same purpose.
    Although they differ slightly in syntax and flexibility, both aim at making data
    analysis pipelines easier to read and write by specifying transformations in a
    left-to-right pipeline syntax. Both allow you to chain together various data transformations
    and analyses in ways very similar to how you chain together command-line tools
    in shell pipelines. The various 148


    Chapter 7 point-Free programming


    operations are function calls, and these functions are chained together with the
    %>% or |> operators, moving the output of one function to the input of the next.


    For example, to take the vector 1:4, get the mean of it, and then take the sqrt,
    you can write a pipeline like this:


    library(magrittr)


    1:4 %>% mean %>% sqrt


    ## [1] 1.581139


    or using |>:


    1:4 |> mean() |> sqrt()'
  trans: "\n# [1] 120\n\n## 第 7 章\n\n## 无点编程\n\n在最后一章中，我们不会过多讨论实际的编程，而是一种被称为*无点编程*（并非*无意义*编程）的编程风格，其特点是通过组合其他函数来构造新函数，而非直接编写新函数。\n\
    \n许多计算都可以表达为数据流经的步骤以及数据在此过程中如何被转换。我们编写函数来处理所有最基本的步骤，即程序的原子，然后通过组合更基础的变换来构造用于更复杂操作的函数，从而从程序原子构建程序分子。\n\
    \n术语*无点*指的是在计算一系列变换时数据可能所处的中间状态。它所指的*点*是数据在每次变换后所处的状态，而*无点*意味着我们不以任何方式关注这些点。在使用无点编程编写的代码中，这些点根本不会被提及。\n\
    \n这听起来可能有点抽象，但如果你习惯于在 shell 脚本中编写管道，那么很快就会感到非常熟悉，因为无点编程正是你在编写管道时所做的事情。在那里，数据流经一系列串联在一起的程序。一个程序的输出成为管道中下一个程序的输入，你从不引用中间数据，只引用数据在管道处理过程中所经历的变换步骤。\n\
    \n© Thomas Mailund 2023  \nT. Mailund, *R 语言函数式编程（第 4 版）*, [`doi.org/10.1007/978-1-4842-9487-1_7`](https://doi.org/10.1007/978-1-4842-9487-1_7#DOI)\n\
    \n### 函数组合\n\n从更基础的函数构造新函数的最简单方法就是函数组合。在数学中，如果我们有一个函数 `f` 将定义域 `A` 映射到值域 `B`，我们可以将其记为\
    \ `f : A → B`，另一个函数 `g` 记为 `g : A → C`，那么我们可以通过组合这两个函数来创建一个新函数 `h : A → C`：`h(x)\
    \ = g(f(x))`。\n\n我们可以在 R 中做完全相同的事情，并像这样用函数 `f` 和 `g` 来定义 `h`：\n\n```\nh <- function(x)\
    \ g(f(x))\n```\n\n仅仅为了组合两个函数而显式编写一个新函数，其中包含大量额外的冗余内容。在数学符号中，我们不会那样写两个函数的组合。我们将函数组合写成\
    \ `h = g ° f`。通过组合函数来定义新函数，而不是定义那些仅仅显式调用其他函数的函数，这就是我们所说的无点编程，并且在 R 中很容易实现。\n\n\
    你可以编写一个组合函数，它是一个高阶函数，接受两个函数作为参数并返回它们的组合：\n\n```\ncompose <- function(g, f) function(...)\
    \ g(f(...))\n```\n\n然后我们可以用这个函数来处理一个常见情况：当我们使用 `Map` 并经常想要对结果进行 `unlist` 时。当然，我们可以显式地调用它们来使用\
    \ `Map` 和 `unlist`：\n\n```\nxs <- 1:4\nunlist(Map(\\(x) x + 2, xs))  # 显式调用 Map\
    \ + unlist\n## [1] 3 4 5 6\n```\n\n但我们也可以组合 `Map` 和 `unlist`，从它们的组合中创建一个新的映射函数：\n\
    \n```\numap <- compose(unlist, Map)  # 组合 Map 和 unlist\numap(\\(x) x + 2, xs)\
    \          # 使用新函数\n## [1] 3 4 5 6\n```\n\n为了得到类似于数学记法的东西，我们希望它是一个中缀运算符，但 `pryr`\
    \ 包已经为我们定义了它，所以我们可以像这样编写相同的代码：\n\n```\nlibrary(pryr)\numap <- unlist %.% Map\n\
    umap(\\(x) x + 2, xs)\n## [1] 3 4 5 6\n```\n\n我们不仅限于组合两个函数，由于函数组合是可结合的，我们无需担心组合的顺序，因此不需要在组合周围使用括号。我们也可以组合三个或更多函数，并且如果我们需要一些尚未作为命名函数实现的额外功能，我们还可以将函数与匿名函数组合。例如，我们可以像这样定义一个计算均方根误差的函数：\n\
    \n```\nrmse <- sqrt %.% mean %.% \\(x, y) (x - y)**2\nrmse(1:4, 2:5)\n## [1] 1\n\
    ```\n\n我们需要一个新函数来计算 `x` 和 `y` 之间的平方距离，所以为此我们添加了一个匿名函数，然后我们可以直接使用 `mean` 和 `sqrt`\
    \ 来获得其余的功能。\n\n在函数组合的数学记法中，你总是按照显式调用它们的顺序来书写要组合的函数，因此 `h ° g ° f` 会在值 `x` 上被评估为\
    \ `h(g(f(x)))`。如果你习惯从右向左阅读，这很好；但如果你习惯从左向右阅读，那就有点反过来了。\n\n当然，没有什么能阻止我们编写一个反转函数顺序的函数组合运算符。为了避免与函数组合的数学记法混淆，我们会使用一个不同的运算符，这样我们可以定义\
    \ `;` 使得 `f ; g = g ° f`，并在 R 中将其用于函数组合：\n\n```\n`%;%` <- function(f, g) function(...)\
    \ g(f(...))\nrmse <- (\\(x, y) (x - y)**2) %;% mean %;% sqrt\nrmse(1:4, 2:5)\n\
    ## [1] 1\n```\n\n在这里，我需要用括号将匿名函数括起来，以防止 R 将组合视为函数体的一部分，但除此之外，功能与之前相同；我们可以从左到右阅读组合。\n\
    \n### 管道\n\n`magrittr` 包引入了一种“从左到右”的函数组合，作为运算符 `%>%`，而在 R 4.1 中，我们有了一个内置的具有相同目的的运算符\
    \ `|>`。尽管它们在语法和灵活性上略有差异，但两者都旨在通过指定从左到右的管道语法中的变换，使数据分析管道更易于阅读和编写。两者都允许你以与在 shell\
    \ 管道中串联命令行工具非常相似的方式，将各种数据转换和分析链接在一起。\n\n各种操作都是函数调用，这些函数通过 `%>%` 或 `|>` 运算符链接在一起，将一个函数的输出传递到下一个函数的输入。\n\
    \n例如，要获取向量 `1:4`，计算其均值，然后计算 `sqrt`，你可以像这样编写一个管道：\n\n```\nlibrary(magrittr)\n1:4\
    \ %>% mean %>% sqrt\n## [1] 1.581139\n```\n\n或者使用 `|>`：\n\n```\n1:4 |> mean()\
    \ |> sqrt()\n```\n"
- fmt: '# [1] 1.581139


    When using `%>%`, you can compose functions by their names, `mean %>% sqrt`, but
    with `|>` you have to compose function calls `mean() |> sqrt()`.


    The `%>%` operator also accesses the latter syntax.


    The default is that the output from the previous step in the pipeline is passed
    as the first argument to the next function in the pipeline. To write your own
    functions to fit into this pattern, you just need to make the data that come through
    a pipeline the first argument for your function.


    Because pipelines are now frequently used in R, this is the pattern that most
    functions follow, and it is used in popular packages like `dplyr` and `tidyr`.
    The `purrr` package is also designed to work well with `magrittr` pipelines. All
    its functions take the data they operate on as their first parameter, so stringing
    together several transformations using `%>%` or `|>` is straightforward.


    Not all functions follow the pattern, mostly older functions do not, but you can
    use the variable `.` to refer to the data being passed along the pipeline when
    you need it to go at a different position than the first: `data.frame(x = 1:4,
    y = 2:5) %>% plot(y ~ x, data = .)`.


    This is only supported by the `%>%` operator and not `|>`, though.


    If the input is a data frame, you can access its columns using the column names
    as you would with any other data frame. The argument is still `.` and you just
    need to use that parameter to refer to the data: `data.frame(x = 1:4, y = 2:5)
    %>% plot(.$x, .$y)`.


    The `.` parameter can be used several times in a function call in the pipeline
    and can be used together with function calls in a pipeline, for example:


    ```

    rnorm(4) %>% data.frame(x = ., y = cos(.))

    ```


    ## x y

    ## 1 -0.4606873 0.89574717

    ## 2 -0.2682750 0.96422956

    ## 3 -0.5016734 0.87677906

    ## 4 -1.6209375 -0.05012016


