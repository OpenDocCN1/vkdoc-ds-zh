  trans: "\n## [1] 5\n\n该函数在调用时接受一个延续，负责计算“后续需要完成的工作”。如果我们当前查看的节点是叶子节点，就用 `1` 调用它——因为叶子节点的大小为\
    \ 1——然后它会执行任何所需的计算，以算出先前已遍历并封装在延续参数中的树的大小。\n\n默认延续是恒等函数：\n\n`function(x) x`\n\n\
    因此，如果我们仅用叶子节点调用该函数，会得到值 `1`。但当我们遇到内部节点时，会修改延续，以封装那些因尚未掌握计算所需的全部信息而无法立即完成的部分计算。\n\
    \n对于内部节点，我们这样做：\n\n```\n# 创建一个延续，该延续将接收左子树的大小\nleft_continuary <- function(left_result)\
    \ {\n    # 当我们获得左子树的大小时，创建一个组合左、右子树的延续（并将其传递给延续）\n    right_continuation <- function(right_result)\
    \ {\n        continuation(left_result + right_result + 1)\n    }\n    # 计算右子树的大小\n\
    \    size_of_tree(node$right, right_continuation)\n}\n# 计算左子树的大小\nsize_of_tree(node$left,\
    \ left_continuation)\n```\n\n我们创建一个延续，只要给它左子树的大小，它就能计算出整棵树的大小。当该延续被调用时，它接收左子树的大小作为参数，但自身需要计算右子树的大小。为此，它需要一个能获取右子树大小的延续，而当\
    \ *那个* 函数被调用时，我们就可以返回内部节点的大小：左子树大小加右子树大小再加一。它通过调用延续来返回结果，该延续随后会处理从递归返回时必须进行的后续操作。\n\
    \n`left_continuation` 用这个 `right_continuation` 对右子树发起递归调用，从而将右子树的大小传入 `right_continuation`\
    \ 函数。但在调用 `left_continuation` 之前，我们先调用 `size_of_tree(node$left, left_continuation)`\
    \ 来获取左子树的大小。当遍历完左子树后，`left_continuation` 会随其大小被调用。\n\n由于它是尾递归的，我们可以用循环替换递归调用。这次，我们需要记住在创建新延续时强制求值该延续，因为循环时我们在修改局部参数。除此之外，其形式与你期望的将尾递归函数转换为循环函数的通用模式一致。\n\
    \n```\nsize_of_tree <- function(node, continuation = identity) {\n    repeat {\n\
    \        if (is.null(node$left) && is.null(node$right)) {\n            return(continuation(1))\n\
    \        }\n        new_continuation <- function(continuation) {\n           \
    \ force(continuation)\n            function(left_result) {\n                size_of_tree(\n\
    \                    node$right,\n                    function(right_result) continuation(left_result\
    \ + right_result + 1)\n                )\n            }\n        }\n        #\
    \ 模拟递归调用\n        node <- node$left\n        continuation <- new_continuation(continuation)\n\
    \    }\n}\n\nsize_of_tree(tree)\n```\n\n## [1] 5\n\n不过，这里有一个问题。我们避免了向左的深层递归，但我们创建的延续会像之前递归那样调用同样深度的函数。向右的递归调用仍然是函数调用——我们在那里还需要另一个延续，并且还不能覆盖左延续。此外，每次我们通常递归调用时，都会将一个函数包裹在另一个函数内部，当这些函数需要被求值时，我们仍然会面临深层嵌套的函数调用。\n\
    \n将此类函数转换为纯循环仍然是可能的，但要求 *所有* 尾调用（即我们立即返回其结果的那类函数）都得到优化。某些编程语言实现了这一点，这在纯函数式编程语言中很常见，但\
    \ R 语言并不支持。\n\n不幸的是，我们自己也很难将其重写为一个循环函数。\n\n不过，有一个利用闭包的技巧可以绕过这个问题。它不会让我们获得用循环替代递归所带来的性能提升，实际上反而会稍微慢一些，但它能让我们编写包含多个递归调用的函数，而无需担心递归调用过深。如果你的算法需要递归，或者递归能带来更简单的实现，并且你并不迫切需要高性能，就可以使用这个通用技巧。\n\
    \n## 延迟求值与蹦床\n\n解决递归过深问题有两个关键部分。第一部分叫做“thunk”（延迟计算体）。它本质上是一个不接受参数、仅返回值的函数。它用于封装一小段计算，供日后求值。我们可以像这样将一个函数及其参数转换为一个\
    \ thunk：\n\n```\n# 一个可以直接调用的函数，例如 f(1, 2)\nf <- function(x, y) x + y\n\n# thunk\
    \ 将会调用 f(1, 2)\nthunk <- \\( ) f(1, 2)\n\nf(1, 2)\n## [1] 3\n\nthunk()\n## [1]\
    \ 3\n```\n\n我们将对 `f` 的调用 `f(1, 2)` 封装在一个不接受任何参数的函数 `\\( ) f(1, 2)` 中，这样在不调用 `f`\
    \ 的情况下，我们创建了一个函数 `thunk`，它 *如果* 被我们调用，就会求值 `f(1, 2)`。这有点像函数参数的惰性求值。\n\n如果你所处的环境中\
    \ `f` 后续可能会绑定到其他值，你可以进一步处理。你不希望使用 `\\( ) f(1, 2)`，因为那会在你调用 `thunk()` 时调用当前的 `f`（无论其为何值），但你可以通过类似下面的方式将\
    \ `f` 置于一个不会改变的环境中：\n\n```\nmake_thunk <- function(f, ...) {\n    # 确保变量在我们返回后不会改变\n\
    \    force(f)\n    params <- list(...)\n    # 然后返回 thunk\n    \\( ) do.call(f,\
    \ params)\n}\n\ng <- make_thunk(f, 1, 2)\ng()\n```"
- fmt: "## [1] 3\n\nBy calling `force(f)`, you make sure that the `f` in the thunk’s\
    \ environment stays the same, and by evaluating the `...` parameter immediately\
    \ (by putting it in a list), you ensure that the variables are bound to the values\
    \ they have when you create the thunk, rather than what values they might have\
    \ when you call it.\n\nThe first construction is simpler, but if you have nonpure\
    \ functions, and variables can change, the second is safer.\n\nIf you are wondering\
    \ why such functions are called “thunks,” here is what the Hacker’s Dictionary\
    \ has to say:\n\n> Historical note: There are a couple of onomatopoeic\n> \n>\
    \ myths circulating about the origin of this term. The\n> \n> most common is that\
    \ it is the sound made by data\n> \n> hitting the stack; another holds that the\
    \ sound is\n> \n> that of the data hitting an accumulator. Yet another\n> \n>\
    \ holds that it is the sound of the expression being\n> \n> unfrozen at argument-evaluation\
    \ time. In fact,\n> \n> according to the inventors, it was coined after they\n\
    > \n> realized (in the wee hours after hours of discussion)\n> \n> that the type\
    \ of an argument in Algol-60 could be\n> \n> figured out in advance with a little\
    \ compile-time\n> \n> thought, simplifying the evaluation machinery. In\n> \n\
    > other words, it had “already been thought of”; thus\n> \n> it was christened\
    \ a thunk, which is “the past tense of\n> \n> ‘think’ at two in the morning.”\n\
    \nWe are going to wrap recursive calls into thunks where each thunk takes one\
    \ step in a recursion. Each thunk evaluates one step and returns a new thunk that\
    \ will evaluate the next step and so on until a thunk eventually returns a value.\
    \ The term for such evaluations is a “trampoline,” and the imagery is that each\
    \ thunk bounces on the trampoline, evaluates one step, and lands on the trampoline\
    \ again as the next thunk.\n\nA trampoline is just a function that keeps evaluating\
    \ thunks until it gets a value, and the implementation looks like this:\n\n```\n\
    trampoline <- function(thunk) {\n  while (is.function(thunk)) thunk <- thunk()\n\
    \  thunk\n}\n```\n\nTo see how thunks and trampolines can be combined to avoid\
    \ recursion, we will first consider the simpler case of calculating the factorial\
    \ of a number instead of the size of a tree.\n\nWe wrote the recursive factorial\
    \ function in Chapter 3, and the non-tail-recursive version looked like this:\n\
    \n```\nfactorial <- function(n) {\n  if (n == 1) 1\n  else n * factorial(n - 1)\n\
    }\n```\n\nThe tail-recursive version, using an accumulator, looked like this:\n\
    \n```\nfactorial <- function(n, acc = 1) {\n  if (n == 1) acc\n  else factorial(n\
    \ - 1, acc * n)\n}\n```\n\nTo get the thunk-trampoline version, we are first going\
    \ to rewrite this using continuation passing. This is mostly just turning the\
    \ accumulator in the tail-recursive version into a continuation for computing\
    \ the final result:\n\n```\ncp_factorial <- function(n, continuation = identity)\
    \ {\n  if (n == 1) {\n    continuation(1)\n  } else {\n    cp_factorial(n - 1,\
    \ \\(result) continuation(result * n))\n  }\n}\n```\n\n```\nfactorial(10)\n##\
    \ [1] 3628800\n\ncp_factorial(10)\n## [1] 3628800\n```\n\nThis function does the\
    \ same as the accumulator version, and because there is no tail-recursion optimization,\
    \ it will call `cp_factorial` all the way down from `n` to `1`, and then it will\
    \ evaluate continuation functions just as many times. We can get it to work for\
    \ `n` maybe up to a thousand or so, but after that, we hit the recursion stack\
    \ limit. Before we reach that limit, the number will be too large to represent\
    \ as floating-point numbers in R anyway, but that is not the point; the point\
    \ is that the number of recursive calls can get too large for us to handle.\n\n\
    So instead of calling recursively, we want each “recursive” call to create a thunk\
    \ instead. This will create a thunk that does the next step and returns a thunk\
    \ for the step after that, but it will not call the next step, so no recursion.\
    \ We need such thunks both for the recursions and the continuations. The implementation\
    \ is simple; we just replace the recursions with calls to `make_thunk`:\n\n```\n\
    thunk_factorial <- function(n, continuation = identity) {\n  if (n == 1) {\n \
    \   continuation(1)\n  } else {\n    # The new continuation is a function that\
    \ returns a thunk.\n    # The thunk will run the next step of the computation\
    \ by\n    # calling the continuation\n    new_continuation <- \\(result) \\()\
    \ continuation(n * result)\n    # We don't call the factorial recursion yet, we\
    \ just return a\n    # thunk that is ready to take the first step of the computation\n\
    \    \\(() thunk_factorial(n - 1, new_continuation)\n  }\n}\n```\n\nCalling this\
    \ function with `1` directly gives us a value:\n\n```\nthunk_factorial(1)\n##\
    \ [1] 1\n```\n\nCalling it with `2` creates a thunk. We need to call this thunk\
    \ to move down the recursion to the base case; this will give us a thunk for the\
    \ continuation there, and we need to evaluate that thunk to get the value:\n\n\
    ```\n# Takes us one step down the recursion, but not up again\nthunk_factorial(2)()\n\
    ## \\(() continuation(n * result)\n## <bytecode: 0x7fe42629e860>\n## <environment:\
    \ 0x7fe4263bcb38>\n\n# The next call will take us up to a result\nthunk_factorial(2)()()\n\
    ## [1] 2\n```\n\nFor each additional step in the recursion, we thus get two more\
    \ thunks, one for going down the recursion and the next for evaluating the thunk,\
    \ but, eventually, we will have evaluated all the thunks and will get a value:\n\
    \n```\nthunk_factorial(3)()()()()\n## [1] 6\n\nthunk_factorial(4)()()()()()()\n\
    ## [1] 24\n\nthunk_factorial(5)()()()()()()()()\n## [1] 120\n```\n\nOf course,\
    \ we don’t want to call all these thunks explicitly; that is what the trampoline\
    \ is for:\n\n```\ntrampoline(thunk_factorial(100))\n## [1] 9.332622e+157\n```\n\
    \nWe can write another higher-order function for translating such a thunkenized\
    \ function into one that uses the trampoline to do the calculation like this:\n\
    \n```\nmake_trampoline <- function(f) \\(...) trampoline(f(...))\nfactorial <-\
    \ make_trampoline(thunk_factorial)\nfactorial(100)\n## [1] 9.332622e+157\n```\n\
    \nFor computing the size of a tree, we just do exactly the same thing. It doesn’t\
    \ matter that the continuation we use here does something more complex—it calls\
    \ the depth-first traversal on the right subtree instead of just computing an\
    \ expression directly—because it is just a continuation, and we just need to wrap\
    \ it up as a thunk:\n\n```\nthunk_size <- function(node, continuation = identity)\
    \ {\n  if (is.null(node$left) && is.null(node$right)) {\n    continuation(1)\n\
    \  } else {\n    left_continuation <- function(left_result) {\n      # Right continuation\
    \ gives us a thunk for returning with\n      # the size of the current tree (left\
    \ + right + 1).\n      right_continuation <- function(right_result)\n        \\\
    (() continuation(left_result + right_result + 1)\n      # Return thunk for recursing\
    \ right\n      \\(() thunk_size(node$right, right_continuation)\n    }\n    #\
    \ Return thunk for recursing left\n    \\(() thunk_size(node$left, left_continuation)\n\
    \  }\n}\n\nsize_of_tree <- make_trampoline(thunk_size)\nsize_of_tree(tree)\n```"
