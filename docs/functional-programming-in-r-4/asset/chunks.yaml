- fmt: "## [1] 5\n\n# Chapter 3: Pure Functional Programming – Tail-Recursion\n\n\
    Functions, such as our search functions, that return the result of a recursive\
    \ call without doing further computation on it are called *tail recursive*. Such\
    \ functions are particularly desired in functional programming languages because\
    \ they can be translated into loops, removing the overhead involved in calling\
    \ functions. R, however, unfortunately does not implement this tail-recursion\
    \ optimization. There are good but technical reasons why, having to do with scopes.\
    \ This doesn’t mean that we cannot exploit tail-recursion and the optimizations\
    \ possible if we write our functions to be tail-recursive; we just have to translate\
    \ our functions into loops explicitly.\n\nWe cover that in the next section. First,\
    \ I will show you a technique for translating an otherwise not tail-recursive\
    \ function into one that is.\n\nAs long as you have a function that only calls\
    \ recursively zero or one time, it is a very simple trick. You pass along values\
    \ in recursive calls that can be used to compute the final value once the recursion\
    \ gets to a base case.\n\nAs a simple example, we can take the factorial function.\
    \ The way we wrote it earlier was not tail-recursive. We called recursively and\
    \ then multiplied `n` to the result:\n\n```\nfactorial <- function(n) {\n  if\
    \ (n == 1) 1\n  else n * factorial(n - 1)\n}\n```\n\nWe can translate it into\
    \ a tail-recursive function by passing the product of the numbers we have seen\
    \ so far along to the recursive call. Such a value that is passed along is typically\
    \ called an accumulator. The tail-recursive function would look like this:\n\n\
    ## Chapter 3 : Pure Functional Programming\n\n```\nfactorial <- function(n, acc\
    \ = 1) {\n  if (n == 1) acc\n  else factorial(n - 1, acc * n)\n}\n```\n\nSimilarly,\
    \ we can take the `find_duplicates` function we wrote and turn it into a tail-recursive\
    \ function. The original function looks like this:\n\n```\nfind_duplicates <-\
    \ function(x, i = 1) {\n  if (i >= length(x)) return(c())\n  rest <- find_duplicates(x,\
    \ i + 1)\n  if (x[i] == x[i + 1]) c(i, rest) else rest\n}\n```\n\nIt needs to\
    \ return a list of indices so that is what we pass along as the accumulator:\n\
    \n```\nfind_duplicates <- function(x, i = 1, acc = c()) {\n  if (i >= length(x))\
    \ return(acc)\n  if (x[i] == x[i + 1]) find_duplicates(x, i + 1, c(acc, i)) else\
    \ find_duplicates(x, i + 1, acc)\n}\n```\n\nAll functions that call themselves\
    \ recursively at most once can equally easily be translated into tail-recursive\
    \ functions using an appropriate accumulator.\n\nIt is harder for functions that\
    \ make more than one recursive call, like the tree functions we wrote earlier.\
    \ It is not impossible to make them tail-recursive, but it requires a trick called\
    \ *continuation passing*, which I will show you in Chapter [5](https://doi.org/10.1007/978-1-4842-9487-1_5).\n\
    \n# Chapter 3: Pure Functional Programming – Runtime Considerations\n\nNow for\
    \ the bad news. All the techniques I have shown you in this chapter for writing\
    \ pure functional programs using recursion instead of loops are relatively slow\
    \ in R.\n\nFrom a software design perspective, you will want to write pure functions,\
    \ but relying on recursion instead of loops comes at a runtime cost. We can compare\
    \ our recursive linear search function with one that uses a for-loop to see how\
    \ much overhead we incur.\n\nThe recursive function looked like this:\n\n```\n\
    r_lin_search <- function(element, sequence, i = 1) {\n  if (i > length(sequence))\
    \ FALSE\n  else if (sequence[i] == element) TRUE\n  else r_lin_search(element,\
    \ sequence, i + 1)\n}\n```\n\nA version using a for-loop could look like this:\n\
    \n```\nl_lin_search <- function(element, sequence) {\n  for (e in sequence) {\n\
    \    if (e == element) return(TRUE)\n  }\n  return(FALSE)\n}\n```\n\nWe can use\
    \ the function `microbenchmark` from the `microbenchmark` package to compare the\
    \ two. If we search for an element that is not contained in the sequence we search\
    \ in, we will have to search through the entire sequence, so we can use that worst-case\
    \ scenario for the performance measure:\n\n## Chapter 3: Pure Functional Programming\n\
    \n```\nx <- 1:1000\n\nmicrobenchmark::microbenchmark(\n  r_lin_search(-1, x),\n\
    \  l_lin_search(-1, x)\n)\n```\n\n## Unit: microseconds\n##   expr           \
    \         min        lq       mean\n##   r_lin_search(-1, x )  834.297   927.9130\
    \  1121.50154\n##   l_lin_search(-1, x )   20.117    20.6345    47.32387\n## \
    \  median      uq        max     neval  cld\n##   986.011   1094.573   5361.536\
    \   100    b"
  raw: '## [1] 5


    Chapter 3 pure FunCtional programming **Tail-Recursion**


    Functions, such as our search functions, that return the result of a recursive
    call without doing further computation on it are called *tail recursive*. Such
    functions are particularly desired in functional programming languages because
    they can be translated into loops, removing the overhead involved in calling functions.
    R, however, unfortunately does not implement this tail-recursion optimization.
    There are good but technical reasons why, having to do with scopes. This doesn’t
    mean that we cannot exploit tail-recursion and the optimizations possible if we
    write our functions to be tail-recursive, we just have to translate our functions
    into loops explicitly.


    We cover that in the next section. First, I will show you a technique for translating
    an otherwise not tail-recursive function into one that is.


    As long as you have a function that only calls recursively zero or one time, it
    is a very simple trick. You pass along values in recursive calls that can be used
    to compute the final value once the recursion gets to a base case.


    As a simple example, we can take the factorial function. The way we wrote it earlier
    was not tail-recursive. We called recursively and then multiplied *n* to the result:


    factorial *<* - **function**(n) {


    **if** (n == 1) 1


    **else** n * factorial(n - 1)


    }


    We can translate it into a tail-recursive function by passing the product of the
    numbers we have seen so far along to the recursive call. Such a value that is
    passed along is typically called an accumulator. The tail-recursive function would
    look like this:


    Chapter 3 pure FunCtional programming factorial *<* - **function**(n, acc = 1)
    {


    **if** (n == 1) acc


    **else** factorial(n - 1, acc * n)


    }


    Similarly, we can take the find_duplicates function we wrote and turn it into
    a tail-recursive function. The original function looks like this: find_duplicates
    *<* - **function**(x, i = 1) {


    **if** (i *>* = length(x)) return(c())


    rest *<* - find_duplicates(x, i + 1)


    **if** (x[i] == x[i + 1]) c(i, rest) **else** rest


    }


    It needs to return a list of indices so that is what we pass along as the accumulator:


    find_duplicates *<* - **function**(x, i = 1, acc = c()) {


    **if** (i *>* = length(x)) return(acc)


    **if** (x[i] == x[i + 1]) find_duplicates(x, i + 1, c(acc, i)) **else** find_duplicates(x,
    i + 1, acc)


    }


    All functions that call themselves recursively at most once can equally easily
    be translated into tail-recursive functions using an appropriate accumulator.


    It is harder for functions that make more than one recursive call, like the tree
    functions we wrote earlier. It is not impossible to make them tail-recursive,
    but it requires a trick called *continuation passing*, which I will show you in
    Chapter [5](https://doi.org/10.1007/978-1-4842-9487-1_5).


    Chapter 3 pure FunCtional programming **Runtime Considerations**


    Now for the bad news. All the techniques I have shown you in this chapter for
    writing pure functional programs using recursion instead of loops are relatively
    slow in R.


    From a software design perspective, you will want to write pure functions, but
    relying on recursion instead of loops comes at a runtime cost. We can compare
    our recursive linear search function with one that uses a for-loop to see how
    much overhead we incur.


    The recursive function looked like this:


    r_lin_search *<* - **function**(element, sequence, i = 1) {


    **if** (i *>* length(sequence)) FALSE


    **else if** (sequence[i] == element) TRUE


    **else** r_lin_search(element, sequence, i + 1)


    }


    A version using a for-loop could look like this:


    l_lin_search *<* - **function**(element, sequence) {


    **for** (e **in** sequence) *{*


    **if** (e == element) return(TRUE)


    }


    return(FALSE)


    }


    We can use the function microbenchmark from the microbenchmark package to compare
    the two. If we search for an element that is not contained in the sequence we
    search in, we will have to search through the entire sequence, so we can use that
    worst-case scenario for the performance measure:


    Chapter 3 pure FunCtional programming x *<* - 1:1000


    microbenchmark::microbenchmark(


    r_lin_search(-1, x),


    l_lin_search(-1, x)


    )


    ## Unit: microseconds


    ## expr min lq mean


    ## r_lin_search(-1, x ) 834.297 927.9130 1121.50154


    ## l_lin_search(-1, x ) 20.117 20.6345 47.32387


    ## median uq max neval cld


    ## 986.011 1094.573 5361.536 100 b'
  trans: "\n## [1] 5\n\n# 第 3 章：纯函数式编程——尾递归\n\n像我们的搜索函数这样，在递归调用后直接返回结果而不进行进一步计算的函数，被称为**尾递归**函数。这类函数在函数式编程语言中特别受欢迎，因为它们可以被转换为循环，从而消除调用函数的开销。然而，遗憾的是，R\
    \ 语言并未实现这种尾递归优化。这背后有充分但技术性的原因，与作用域有关。但这并不意味着我们无法利用尾递归以及通过编写尾递归函数所能实现的优化；我们只需将函数显式地转换为循环即可。\n\
    \n我们将在下一节讨论这个问题。首先，我将向你展示一种技巧，将原本非尾递归的函数转化为尾递归函数。\n\n只要你的函数只进行零次或一次递归调用，这便是一个非常简单的技巧。你可以在递归调用中传递值，这些值在递归到达基准情况时可用于计算最终结果。\n\
    \n以一个简单的例子来说，我们来看阶乘函数。我们之前编写的方式不是尾递归的。我们进行递归调用，然后将 `n` 乘以结果：\n\n```\nfactorial\
    \ <- function(n) {\n  if (n == 1) 1\n  else n * factorial(n - 1)\n}\n```\n\n我们可以通过将到目前为止所见数字的乘积传递给递归调用，将其转换为尾递归函数。这种传递的值通常被称为累加器。尾递归函数如下所示：\n\
    \n## 第 3 章：纯函数式编程\n\n```\nfactorial <- function(n, acc = 1) {\n  if (n == 1) acc\n\
    \  else factorial(n - 1, acc * n)\n}\n```\n\n类似地，我们可以将我们编写的 `find_duplicates`\
    \ 函数转换为尾递归函数。原始函数如下所示：\n\n```\nfind_duplicates <- function(x, i = 1) {\n  if (i\
    \ >= length(x)) return(c())\n  rest <- find_duplicates(x, i + 1)\n  if (x[i] ==\
    \ x[i + 1]) c(i, rest) else rest\n}\n```\n\n它需要返回一个索引列表，因此我们将这个列表作为累加器传递：\n\n\
    ```\nfind_duplicates <- function(x, i = 1, acc = c()) {\n  if (i >= length(x))\
    \ return(acc)\n  if (x[i] == x[i + 1]) find_duplicates(x, i + 1, c(acc, i)) else\
    \ find_duplicates(x, i + 1, acc)\n}\n```\n\n所有最多只进行一次递归调用的函数，都可以使用适当的累加器轻松地转换为尾递归函数。\n\
    \n对于进行多次递归调用的函数，比如我们之前编写的树函数，则要困难一些。让它们变成尾递归并非不可能，但这需要一种称为*续延传递*的技巧，我将在第[5](https://doi.org/10.1007/978-1-4842-9487-1_5)章中向你展示。\n\
    \n# 第 3 章：纯函数式编程——运行时考量\n\n现在来谈坏消息。我在本章中向你展示的所有使用递归而不是循环来编写纯函数式程序的技术，在 R 语言中相对较慢。\n\
    \n从软件设计的角度来看，你希望编写纯函数，但依赖递归而非循环会带来运行时成本。我们可以将递归线性搜索函数与使用 for 循环的版本进行比较，看看会带来多少额外开销。\n\
    \n递归函数如下所示：\n\n```\nr_lin_search <- function(element, sequence, i = 1) {\n  if\
    \ (i > length(sequence)) FALSE\n  else if (sequence[i] == element) TRUE\n  else\
    \ r_lin_search(element, sequence, i + 1)\n}\n```\n\n使用 for 循环的版本可能如下所示：\n\n```\n\
    l_lin_search <- function(element, sequence) {\n  for (e in sequence) {\n    if\
    \ (e == element) return(TRUE)\n  }\n  return(FALSE)\n}\n```\n\n我们可以使用 `microbenchmark`\
    \ 包中的 `microbenchmark` 函数来比较两者。如果我们搜索一个不包含在序列中的元素，我们将不得不搜索整个序列，因此我们可以使用这种最坏情况来进行性能衡量：\n\
    \n## 第 3 章：纯函数式编程\n\n```\nx <- 1:1000\n\nmicrobenchmark::microbenchmark(\n  r_lin_search(-1,\
    \ x),\n  l_lin_search(-1, x)\n)\n```\n\n## Unit: microseconds\n##   expr     \
    \               min        lq       mean\n##   r_lin_search(-1, x )  834.297 \
    \  927.9130  1121.50154\n##   l_lin_search(-1, x )   20.117    20.6345    47.32387\n\
    ##   median      uq        max     neval  cld\n##   986.011   1094.573   5361.536\
    \   100    b\n"
- fmt: "# 23.087 25.269 2341.506 100 a\n\nThe recursive function is orders of magnitude\
    \ slower than the function that uses a loop. Keep that in mind if people tell\
    \ you that loops are slow in R; they might be, but recursive functions are slower.\n\
    \nIt gets worse than that. R has a limit to how deep you can call a function recursively,\
    \ and if we were searching in a sequence longer than about a thousand elements,\
    \ we would reach this limit, and R would terminate the call with an error.\n\n\
    This doesn’t mean that reading this chapter was a complete waste of time. It can\
    \ be very useful to think in terms of recursion when you are constructing a function.\
    \ There is a reason why divide and conquer is frequently used to solve algorithmic\
    \ problems. You just want to translate the recursive solution into a loop once\
    \ you have designed the function.\n\nFor functions such as linear search, we would\
    \ never program a solution as a recursive function in the first place. The `for`-loop\
    \ version is much easier to write and much more efficient. Other problems are\
    \ much easier to solve with a recursive algorithm, and there the implementation\
    \ is also easier done by first thinking in terms of a recursive function. The\
    \ binary search is an example of such a problem. It is inherently recursive since\
    \ we solve the search by another search on a shorter string. It is also less likely\
    \ to hit the allowed recursion limit since it will only call recursively a number\
    \ of times that is logarithmic in the length of the input, but that is another\
    \ issue.\n\nThe recursive binary search looked like this:\n\n```\nr_binary_search\
    \ <- function(element, x, first = 1, last = length(x)) {\n  if (last < first)\
    \ return(FALSE) # empty sequence\n  middle <- (last - first) %/% 2 + first\n \
    \ if (element == x[middle]) TRUE\n  else if (element < x[middle]) {\n    r_binary_search(element,\
    \ x, first, middle - 1)\n  } else {\n    r_binary_search(element, x, middle +\
    \ 1, last)\n  }\n}\n```\n\nIt is a tail-recursive function, and we can exploit\
    \ that to translate it into a version that uses a loop instead of recursive calls.\
    \ To translate a tail-recursive function into a looping function, you put the\
    \ body of the function in a `repeat`-loop. A `repeat`-loop will loop forever unless\
    \ you explicitly exit from it, but the base case tests in the recursive function\
    \ can be used to exit the loop using an explicit `return` call. When you would\
    \ normally call recursively, you instead just update the local parameters. You\
    \ simply have to update them to the values they would have if you had called the\
