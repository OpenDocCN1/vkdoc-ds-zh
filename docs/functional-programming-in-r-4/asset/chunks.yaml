  trans: "\n# [1] 5\n\n第 4 章：作用域与闭包\n\n我们得到与之前相同的值，因为 `eval()` 同样使用当前环境来查找变量名与值之间的映射关系，因此在此例中\
    \ `eval(expr)` 是 `eval(expr, genv)` 的简写：\n\n```\neval(expr, genv)\n```\n\n## [1]\
    \ 5\n\n如果你愿意，也可以自行创建环境。`new.env()` 函数会创建一个空环境，之后你可以向其中写入内容：\n\n```\nenv <- new.env()\n\
    env$x <- 4\nenv$y <- 5\neval(expr, env)\n```\n\n## [1] 9\n\n或者，`list2env()` 函数可以将列表转换为环境：\n\
    \n```\neval(expr, list2env(list(x = -1, y = -2)))\n```\n\n## [1] -3\n\n当你使用默认环境评估诸如\
    \ `x + y` 这样的表达式，以获取变量所引用的值时，我们将这一过程称为*标准求值*。当你显式指定环境，并使用默认环境之外的其他环境时，我们称之为*非标准求值*。虽然显式环境求值自有其用途，但一般情况下你很少需要这么做——不过请记住，每当我们求值某个需要了解变量所指代对象的表达式时，都涉及某种形式的表查找过程。\n\
    \n## 环境与函数\n\n当我们加入函数后，情况变得更有趣了。对于函数而言，我们同时拥有全局环境和局部环境。\n\n在以下代码中，我们有两个名为 `x`\
    \ 的变量。一个是全局变量，指向一个向量；另一个是函数参数。在函数内部，有一个引用 `x` 的表达式。当我们评估该函数时，表达式需要先判断 `x` 是函数参数而非全局变量，然后才能获取该变量所引用的值：\n\
    \n```\nx <- 1:10\nf <- function(x) sqrt(sum(x))\nf(x²)\n```\n\n当我们调用函数时，同样有一个引用名为\
    \ `x` 的变量的表达式，但这里的 `x` 与函数内部的 `x` 不同。这里的 `x` 是全局变量，因此当评估函数调用表达式时，R 需要判断 `x` 指向全局变量，然后查找*这个*变量所引用的值。\n\
    \n我们可以通过重命名变量使其唯一来厘清这一点。将全局变量命名为 `gx`，参数变量命名为 `px`：\n\n```\ngx <- 1:10\nf <- function(px)\
    \ sqrt(sum(px))\nf(gx²)\n```\n\n运行这段代码后，全局作用域知道 `gx`（代表序列 1:10）和 `f`（代表函数）这两个名称，但不会知道\
    \ `px`。在函数调用内部，当我们评估 `sqrt(sum(px))` 时，我们*确实*知道 `px`。那么这究竟是怎么回事呢？\n\n我们仍然拥有全局环境，并且可以通过\
    \ `globalenv()` 检查，确认 `f` 和 `gx` 存在于其中。然而，当我们调用 `f` 时，函数调用也会获得一个新的环境——即局部环境。\n\
    \n正如我们可以使用 `globalenv()` 获取全局环境一样，我们也能使用 `environment()` 函数获取局部环境：\n\n```\ngx\
    \ <- 1:10\nf <- function(px) as.list(environment())\nf(gx²)\n```\n\n## $px\n##\
    \ [1] 1 4 9 16 25 36 49 64 81 100\n\n我使用 `as.list()` 将环境转换为列表，以便查看其中的内容。\n\n`environment()`\
    \ 函数在全局作用域中同样有效，并且会返回全局环境，因为在全局环境中，当前环境*就是*全局环境。\n\n从上面的例子可以看出，函数中的局部环境包含了参数 `px`。通常，函数调用的局部环境会包含参数以及你在函数内部赋值的任何变量：\n\
    \n```\nf <- function(x) {\n  res <- sqrt(sum(x))\n  as.list(environment())\n}\n\
    x <- 1:10\nf(x²)\n```\n\n## $res\n## [1] 19.62142\n##\n## $x\n## [1] 1 4 9 16\
    \ 25 36 49 64 81 100\n\n因为我对 `res` 进行了赋值，该变量现在也位于局部环境之中。\n\n这里，我还将参数名改回了 `x`，但此\
    \ `x` 会映射到 `f` 内部局部环境中的参数，而不是全局环境中的 `x`，这就是全局 `x` 和局部 `x` 不会产生冲突的原因。当我们调用函数时，有两个环境在起作用：包含局部变量的局部环境，以及包含全局变量的全局环境；参见图\
    \ 4-1。函数内部的代码会在局部环境中查找变量所引用的值，而全局代码则在全局环境中查找。\n\n你可能现在会好奇，函数 `f` 似乎也知道的 `sqrt()`\
    \ 和 `sum()` 这些名称。它们并不在局部环境中。（它们也不在全局环境中；你可以用 `as.list(globalenv())` 验证一下。）那么函数是如何找到它们的呢？我们现在来看，环境中还有一个巧妙之处，用于处理在直接作用域中找不到的变量，以及这个技巧如何解决刚才的问题。\n\
    \n**图 4-1.** 函数调用中的局部环境和全局环境\n\n## 环境链、作用域与函数调用\n\n在 R 中调用函数时，首先会为该函数创建一个空环境。这个环境将存储其参数，函数内赋值的任何局部变量也会存放在这里。每当\
    \ R 需要查找某个值，它都会在这个环境中寻找。如果找到了变量，你就获得这张表中的值。但如果没找到，R 并不会就此放弃，而是会继续搜索。\n\n环境不仅仅是表，更是表组成的链条。每个环境都有一个“父环境”（你可以使用\
    \ `parent.env()` 函数获取它），如果在一个环境中查找失败，R 就会去父环境中查找。如果在父环境中也找不到，它会尝试祖父环境，并且只要还有更上层环境，就会一直向上追溯。\n\
    \n思考以下代码：\n\n```\nf <- function(x) {\n  sqrt(sum(x + y))\n}\nx <- 1:10\ny <- 1:10\n\
    f(x²)\n```\n\n**图 4-2.** 局部环境和全局环境通过父指针相互关联\n"
- fmt: "## [1] 20.97618\n\nWe define three variables, `f`, `x`, and `y`, in the global\
    \ environment, where `f` is a function. Then we call the function, creating a\
    \ local environment where `f`’s argument `x` will be placed; see Figure 4-2.\n\
    \nThe `x` in the local and the global environments refers to different values,\
    \ and if we look for the value of `x` inside the function, we get the one in the\
    \ local environment; see Figure 4-3. The `sqrt`, `sum`, and `y` names used in\
    \ the function body are not defined in the local environment. If we only had environments\
    \ as tables, we wouldn’t be able to run this code. The parent environment, however,\
    \ allows us to find nonlocal variables. When R cannot find `y` in the local environment,\
    \ it will go to the parent environment, which is the global environment, and find\
    \ it there; see Figure 4-4.\n\nThe `sqrt` and `sum` variables are also not defined\
    \ in the local environment, so R will also look for them in the parent, but they\
    \ are not defined in the global environment either. Although I will not look beyond\
    \ the global environment in the rest of this book, the environment chain goes\
    \ deeper than that. After the global environment, you will find environments that\
    \ hold names from loaded packages, which is why you can use functions from packages.\
    \ Once you are through them, you get to the so-called \"base environment,\" where\
    \ you find the base R functions (you can get hold of it with the `baseenv()` function)\
    \ and then an empty environment that terminates the search. It is in this base\
    \ environment we find `sum` and `sqrt`; see Figure 4-5. The mechanism is the same\
    \ all the way down, so if you understand how it works between functions and the\
    \ global environment, you will also understand how environments work everywhere[1.](#index_split_000.html#p81)\n\
    \n**Figure 4-3.** Finding local variable `x`\n\n1 Packages also use the environment\
    \ system to differentiate between public and private names, but not through a\
    \ separate mechanism. They just use different environment chains, where we hook\
    \ into the public environment while they have another environment containing the\
    \ private names that we do not see.\n\n**Figure 4-4.** Finding global variable\
    \ `y`\n\n**Figure 4-5.** Finding variable `sum`\n\nWhenever you need the value\
    \ of a variable, whether you use standard evaluation where R finds the environment\
    \ for you or you provide an environment to `eval` in a nonstandard evaluation,\
    \ you will use the chain of parent environments to find variables that are not\
    \ in the immediate scope.\n\n## Scopes, Lazy Evaluation, and Default Parameters\n\
    \nKnowing the rules for how variables are mapped into values also helps us understand\
    \ why we can use function parameters in expressions for default parameters when\
    \ defining a function, but we cannot use them when we call a function.\n\nIf we\
    \ define a function with a default parameter set to an expression that refers\
    \ to another parameter:\n\n```\nf <- function(x, y = 2 * x) x + y\n```\n\nwe can\
    \ call it like this:\n\n```\na <- 2\nf(x = a)\n## [1] 6\n```\n\nbut not necessarily\
    \ like this:\n\n```\nf(x = a, y = 2 * x)\n```\n\nIn both cases, we will create\
    \ an environment for the function first, and in it, we will store the mappings\
    \ from `x` and `y` to values. Except, function arguments are not passed as values\
    \ but using lazy evaluation. You can think of this lazy evaluation much like the\
    \ `quote(x + y)` expression from earlier in the chapter. It is unevaluated expressions\
    \ we pass to the function, and we only evaluate them once we have to.\n\nSo, in\
    \ both cases, `f`’s environment will map `x` to `a` and `y` to `2 * x`. We then\
    \ will try to evaluate `x + y`, which means that we trigger evaluation of the\
    \ expressions `a` and `2 * x`, and this is where the two calls differ.\n\nFunction\
    \ arguments *also* have an associated environment. In this sense, they are *not*\
    \ exactly like the `quote(x + y)` expression. And in the first case, where `x`\
    \ is provided but `y` is the default, the expression `a` for `x` knows that it\
    \ should be evaluated in the global scope, where `a` is defined, but the default\
    \ parameter `y = 2 * x` should be evaluated in the local environment; see Figure\
    \ 4-6. So, when we try to evaluate `x + y`, we will evaluate the expression `a`\
    \ in the global environment to get the value for `x`, and we will then evaluate\
    \ the expression `2 * x` in the local variable (that knows `x`) to get `y`, and\
    \ that will give us the variable values we need.\n\nIn the second case, however,\
    \ both `x` and `y` need to be evaluated in the global environment because we got\
    \ the expressions from there. We can still evaluate `a` to get `x`, but there\
    \ might not be an `x` in the global environment, in which case we can’t evaluate\
    \ `2 * x`, or even worse, there is one, but it is the wrong value, so we would\
    \ get a result back that isn’t the one we expect.\n\nWhile we evaluate parameters\
    \ inside function calls, the environment we use depends on where they were provided.\
    \ Default parameters will be evaluated in the local environment, see Figure 4-6,\
    \ and other parameters will be evaluated in the calling scope, see Figure 4-7.\n\
    \n**Figure 4-6.** Evaluating with a default parameter\n\n**Figure 4-7.** Evaluating\
    \ with an explicit argument\n\nWe can exploit lazy evaluation to extract expressions\
    \ rather than values and evaluate them in different environments, should we choose.\
    \ A full exploration of this is beyond the scope of this book, but a short example\
    \ could look like this:\n\n```\nf <- function(expr, ...) {\n  expr <- substitute(expr)\
    \ # Turn argument into a plain expression\n  env <- list2env(list(...)) # Make\
    \ an env from '...'\n  parent.env(env) <- parent.frame() # Get remaining args\
    \ from caller's env\n  eval(expr, env) # Now evaluate the expression in the new\
    \ env\n}\n\na <- 22\nf(a)\n## [1] 22\n\nf(a + b, b = 13)\n## [1] 35\n```\n\nYou\
    \ can use the `substitute()` function to strip an argument of its environment\
    \ and only get its expression. In the function, we then use `list2env` to turn\
    \ the `...` arguments into an environment, we make the parent of this environment\
    \ the calling scope (using `parent.frame` to get the caller’s environment rather\
    \ than the function’s local scope), and then we evaluate the expression in the\
    \ new environment. It allows us to push in extra arguments, like `b = 13`, and\
    \ use them instead of the local environment for the evaluation.\n\nTricks like\
    \ this are used throughout the Tidyverse ecosystem of packages, and if it is something\
    \ you wish to explore further, an excellent place to start is the `rlang` package.\
    \ It provides several high-level handles for manipulating arguments and evaluating\
    \ them in alternative environments. But I will leave the topic of nonstandard\
    \ evaluation here.\n\n## Nested Functions and Scopes\n\nSo far, we have only considered\
    \ two environments—global and local—so it might be natural to assume that the\
    \ parent of a local environment is always the global (and you might wonder why\
    \ this whole mechanism is necessary in that case), but this isn’t the case. It\
    \ is merely an artifact of where we have defined our functions so far.\n\nConsider\
    \ this slightly weird but simple enough function: `f <- function() environment()`\n\
    \nWhen we call `f()`, it will return its local environment, and there is nothing\
    \ we haven’t seen before yet. However, the `environment()` function takes an argument,\
    \ a function, and if you call it with a function, it returns something else than\
    \ the current environment. It returns the environment where the function was defined.\
    \ We defined `f` in the global environment, so `environment(f)` will give us the\
    \ global environment:\n\n```\nenvironment(f)\n## <environment: R_GlobalEnv>\n\
    ```\n\nwhich, as should be clear by now, is different from the environment we\
    \ get when we are inside the function’s body:\n\n```\nf()\n```"
