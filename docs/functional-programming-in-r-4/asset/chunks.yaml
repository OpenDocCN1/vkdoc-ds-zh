- fmt: "## 1. 4\n\nThis does *not* mean that all the expressions are evaluated inside\
    \ the scope of the function, though. We discuss scopes in [Chapter 4, b](https://doi.org/10.1007/978-1-4842-9487-1_4)\
    \ but for now, you can think of two scopes: the global scope where global variables\
    \ live and the function scope that has parameters and local variables as well.\n\
    \nIf you call a function like this:\n\n`f(a = 2, b = a)`\n\nyou will get an error\
    \ if you expect `b` to be the same as `a` inside the function.\n\nIf you are lucky\
    \ and there isn’t any global variable called `a`, you will get a runtime error.\
    \ If you are unlucky and there *is* a global variable called `a`, that is what\
    \ `b` will be assigned, and if you expect it to be set to `2` here, your code\
    \ will just give you an incorrect answer.\n\nHowever, it is safe for a default\
    \ parameter to be an expression that uses some of the other function arguments.\
    \ The default parameters are evaluated after the function is called, where they\
    \ have access to the other arguments. An expression you use when calling a function,\
    \ however, doesn’t see the local variables inside the function, but the variables\
    \ you have in the calling scope.\n\n### Chapter 2 FunCtions in r\n\n**Figure 2-2.**\
    \ Where arguments and default arguments are evaluated Consider [Figure 2-2](#index_split_000.html#p24).\
    \ We have a function, `f`, that takes two arguments, `a` and `b`, where `b` has\
    \ a default of `2*a`. If we call it as `f(2*a, b = 2*a)`, then both arguments\
    \ will be expressions that R knows have to be evaluated in the global scope where\
    \ `a` is the list `1 2 3 4 5` and where we don’t have a `b`. Neither parameter\
    \ will be evaluated until we look at the arguments, but when we do, both will\
    \ be evaluated and to the same value since both are `2*a` and `a` refers to the\
    \ global `a`. If, however, we call `f` as `f(2*a)` so `b` gets the default value,\
    \ we are in a different situation. Inside the function call, `a` still refers\
    \ to the expression `2*a` to be evaluated in the global scope, but `b`, also still\
    \ referring to the expression `2*a`, will be evaluated in the *local* scope. So,\
    \ if we evaluate `b`, we will first evaluate the parameter `a` to get `2*a` (evaluated\
    \ using the global `a`) `2 4 6 8 10`, and then we evaluate `2*a` with this local\
    \ `a` to get `4 8 12 16 20`.\n\nSo, while arguments aren’t evaluated yet when\
    \ you call a function, they will be when you access them. If they are default\
    \ arguments, you evaluate them inside the function, and if they were provided\
    \ in the function call, you evaluated them outside the call, where the function\
    \ was called.\n\n### Chapter 2 FunCtions in r\n\nThis also means that you cannot\
    \ change what an expression evaluates to just by changing a local variable:\n\n\
    ```\na <- 4\nf <- function(x) {\n  a <- 2\n  x\n}\nf(1 + a)\n## [1] 5\n```\n\n\
    In this example, the expression `1 + a` is evaluated inside `f`, but the `a` in\
    \ the expression is the `a` outside of `f` and not the `a` local variable inside\
    \ `f`.\n\nThis is of course what you want. If expressions really *were* evaluated\
    \ inside the scope of the function, then you would have no idea what they evaluated\
    \ to if you called a function with an expression. It would depend on any local\
    \ variables the function might use.\n\nBecause expressions are evaluated in the\
    \ calling scope and not the scope of the function, you mostly won’t notice the\
    \ difference between call-by-value and call-by-promise. There are certain cases\
    \ where the difference can bite you, though, if you are not careful.\n\nAs an\
    \ example, we can consider this function:\n\n`f <- function(a) function(b) a +\
    \ b`\n\nThis might look a bit odd if you are not used to it, but it is a function\
    \ that returns another function. We will see many examples of this kind of functions\
    \ in later chapters.\n\nWhen we call `f` with a parameter `a`, we get a function\
    \ back that will add `a` to its argument:\n\n```\nf(2)(2)\n## [1] 4\n```\n\n###\
    \ Chapter 2 FunCtions in r\n\nWe can create a list of functions from this `f`:\n\
    \n```\nff <- vector(\"list\", 4)\nfor (i in 1:4) {\n  ff[[i]] <- f(i)\n}\nff\n\
    ## [[1]]\n## function(b) a + b\n## <bytecode: 0x7fe446ad68a8>\n## <environment:\
    \ 0x7fe446a07ca0>\n##\n## [[2]]\n## function(b) a + b\n## <bytecode: 0x7fe446ad68a8>\n\
    ## <environment: 0x7fe446ad71e8>\n##\n## [[3]]\n## function(b) a + b\n## <bytecode:\
    \ 0x7fe446ad68a8>\n## <environment: 0x7fe446ad7098>\n##\n## [[4]]\n## function(b)\
    \ a + b\n## <bytecode: 0x7fe446ad68a8>\n## <environment: 0x7fe446ad6f48>\n```\n\
    \nHere, `ff` contains four functions, and the idea is that the first of these\
    \ adds `1` to its argument, the second adds `2`, and so on.\n\n### Chapter 2 FunCtions\
    \ in r\n\nIf we call the functions in `ff`, however, weird stuff happens:\n\n\
    ```\nff[[1]](1)\n## [1] 5\n```\n\nWhen we get the element `ff[[1]]`, we get the\
    \ first function we created in the loop. If we substitute into `f` the value we\
    \ gave in the call, this is `function(b) i + b`\n\nThe parameter `a` from `f`\
    \ has been set to the parameter we gave it, `i`, but `i` has not been evaluated\
    \ at this point!\n\nWhen we call the function, the expression is evaluated, in\
    \ the global scope, but there `i` now has the value `4` because that is the last\
    \ value it was assigned in the loop. The value of `i` was `1` when we called it\
    \ to create the function, but it is `5` when the expression is actually evaluated.\n\
    \nThis also means that we can change the value of `i` before we evaluate one of\
    \ the functions, and this changes it from the value we intended when we created\
    \ the function:\n\n```\ni <- 1\nff[[2]](1)\n## [1] 2\n```\n\nThis laziness is\
    \ only in effect the first time we call the function. If we change `i` again and\
    \ call the function, we get the same value as the first time the function was\
    \ evaluated:\n\n```\ni <- 2\nff[[2]](1)\n## [1] 2\n```\n\n### Chapter 2 FunCtions\
    \ in r\n\nWe can see this in effect by looping over the functions and evaluating\
    \ them:\n\n```\nresults <- vector(\"numeric\", 4)\nfor (i in 1:4) {\n  results[i]\
    \ <- ff[[i]](1)\n}\nresults\n## [1] 5 2 4 5\n```\n\nWe have already evaluated\
    \ the first two functions, so they are stuck at the values they got at the time\
    \ of the first evaluation. The other two get the intended functionality but only\
    \ because we are setting the variable `i` in the loop where we evaluate the functions.\
    \ If we had used a different loop variable, we wouldn’t have been so lucky.\n\n\
    This problem is caused by having a function with an unevaluated expression that\
    \ depends on variables in the outer scope. Functions that return functions are\
    \ not uncommon, though, if you want to exploit the benefits of having a functional\
    \ language. It is also a consequence of allowing variables to change values, something\
    \ most functional programming languages do not allow for such reasons. You cannot\
    \ entirely avoid it, though, by avoiding `for`-loops. If you call functions that\
    \ loop for you, you do not necessarily have control over how they do that, and\
    \ you can end up in the same situation.\n\nThe way to avoid the problem is to\
    \ force an evaluation of the parameter. If you evaluate it once, it will remember\
    \ the value, and the problem is gone.\n\nYou can do that by just writing the parameter\
    \ as a single statement.\n\nThat will evaluate it. It is better to use the function\
    \ `force` though, to make it explicit that this is what you are doing. It really\
    \ just gives you the expression back, so it works exactly as if you just wrote\
    \ the parameter, but the code makes clear why you are doing it.\n\n### Chapter\
    \ 2 FunCtions in r\n\nIf you do this, the problem is gone:\n\n```\nf <- function(a)\
    \ {\n  force(a)\n  function(b) a + b\n}\nff <- vector(\"list\", 4)\nfor (i in\
    \ 1:4) {\n  ff[[i]] <- f(i)\n}\nff[[1]](1)\n## [1] 2\ni <- 1\nff[[2]](1)\n```"
  raw: '## [1] 4


    This does *not* mean that all the expressions are evaluated inside the scope of
    the function, though. We discuss scopes in Chapt[er 4, b](https://doi.org/10.1007/978-1-4842-9487-1_4)ut
    for now, you can think of two scopes: the global scope where global variables
    live and the function scope that has parameters and local variables as well.


    If you call a function like this:


    f(a = 2, b = a)


    you will get an error if you expect b to be the same as a inside the function.


    If you are lucky and there isn’t any global variable called a, you will get a
    runtime error. If you are unlucky and there *is* a global variable called a, that
    is what b will be assigned, and if you expect it to be set to 2 here, your code
    will just give you an incorrect answer.


    However, it is safe for a default parameter to be an expression that uses some
    of the other function arguments. The default parameters are evaluated after the
    function is called, where they have access to the other arguments. An expression
    you use when calling a function, however, doesn’t see the local variables inside
    the function, but the variables you have in the calling scope.


    Chapter 2 FunCtions in r


    ***Figure 2-2.** Where arguments and default arguments are evaluated* Consider
    Figure [2-2](#index_split_000.html#p24). We have a function, f, that takes two
    arguments, a and b, where b has a default of 2*a. If we call it as f(2*a, b =
    2*a), then both arguments will be expressions that R knows have to be evaluated
    in the global scope where a is the list 1 2 3 4 5 and where we don’t have a b.
    Neither parameter will be evaluated until we look at the arguments, but when we
    do, both will be evaluated and to the same value since both are 2*a and a refers
    to the global a. If, however, we call f as f(2*a) so b gets the default value,
    we are in a different situation. Inside the function call, a still refers to the
    expression 2*a to be evaluated in the global scope, but b, also still referring
    to the expression 2*a, will be evaluated in the *local* scope. So, if we evaluate
    b, we will first evaluate the parameter a to get 2*a (evaluated using the global
    a) 2 4 6 8 10, and then we evaluate 2*a with this local a to get 4 8 12 16 20.


    So, while arguments aren’t evaluated yet when you call a function, they will be
    when you access them. If they are default arguments, you evaluate them inside
    the function, and if they were provided in the function call, you evaluated them
    outside the call, where the function was called.


    Chapter 2 FunCtions in r


    This also means that you cannot change what an expression evaluates to just by
    changing a local variable:


    a *<* - 4


    f *<* - **function**(x) {


    a *<* - 2


    x


    }


    f(1 + a)


    ## [1] 5


    In this example, the expression 1 + a is evaluated inside f, but the a in the
    expression is the a outside of f and not the a local variable inside f.


    This is of course what you want. If expressions really *were* evaluated inside
    the scope of the function, then you would have no idea what they evaluated to
    if you called a function with an expression. It would depend on any local variables
    the function might use.


