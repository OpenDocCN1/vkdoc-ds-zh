    \ `<<-`。这个运算符会像 R 语言确定表达式求值方式一样，沿环境链向上搜索，并在找到该变量的环境中进行更新（如果环境链中找不到该变量，则将其添加到全局环境中）。\n\
    \n我们来看一下将示例中的赋值运算符更改后会发生什么：\n\n```\nMake_counter <- function() {\n  x <- 0\n \
    \ count <- function() {\n    x <<- x + 1\n    x\n  }\n}\n\ncounter <- make_counter()\n\
    counter()\n## [1] 1\ncounter()\n## [1] 2\ncounter()\n## [1] 3\n```\n\n这次，当我们进行赋值时，发现外层环境中存在一个\
    \ `x`，即我们在调用 `make_counter` 时初始化的那个 `x`。因此，该赋值针对的是那个环境，而不是局部环境。每次调用 `counter`\
    \ 时，我们都会创建一个新的函数实例环境，但所有实例都链接到同一个外层环境，因此每次调用该函数时，我们都会更新同一个环境。\n\n我们可以结合使用这个计数器函数和\
    \ `<<-` 运算符，来创建 `depth_first_numbers` 函数的一个更简单版本，这样就不需要在递归调用中传递数据了。我们可以在最外层作用域中创建一个表格和一个计数器函数，然后直接使用该计数器并通过\
    \ `<<-` 对表格进行赋值：\n\n```\ndepth_first_numbers <- function(tree) {\n  table <- c()\n\
    \  counter <- make_counter()\n  traverse_tree <- function(node) {\n    if (is.null(node$left)\
    \ && is.null(node$right)) {\n      dfn <- counter()\n      node$range <- c(dfn,\
    \ dfn)\n      table[node$name] <<- dfn\n      node\n    } else {\n      left <-\
    \ traverse_tree(node$left)\n      right <- traverse_tree(node$right)\n      new_node\
    \ <- make_node(node$name, left, right)\n      new_node$range <- c(left$range[1],\
    \ right$range[2])\n      new_node\n    }\n  }\n  new_tree <- traverse_tree(tree)\n\
    \  list(tree = new_tree, table = table)\n}\n\nresult <- depth_first_numbers(tree)\n\
    print_tree(result$tree)\n## [1] \"((A,B) ,D)\"\nresult$table\n## A B D\n## 1 2\
    \ 3\n```\n\n如果我们想用深度优先编号范围来标注所有节点，我们仍然需要在这里创建一个新树；我们仍然不能修改数据，但是可以在递归函数内部使用外层作用域中的变量。\n\
    \n**词法作用域与动态作用域**\n\n这种根据函数定义时所处环境来查找变量值的规则，被称为词法作用域，是最常见的作用域标准。之所以这样称呼，是因为原则上你可以通过代码判断表达式中的变量是在哪里定义的。首先，你检查变量是否在当前局部环境中设置，可以是局部变量或函数参数。如果没有，你会查看外围代码，检查该变量是否在该环境中。外围代码可以是全局环境，也可以是另一个函数。如果它是一个函数且变量未定义，你会沿着函数定义处的代码继续向外查找。如果变量到值的映射取决于函数被调用的位置而非定义的位置（即所谓的动态作用域），那么仅通过阅读函数定义处的代码，你无法确定变量名所引用的到底是哪个变量。\n\
    \nR 语言支持两种作用域，其中词法作用域是默认的（标准求值模式）。尽管如此，通过修改环境链，你可以访问调用函数的作用域（在非标准求值模式下）。在某些情况下，非标准求值可以为你的代码提供更简洁的接口，但在大多数项目中，你应该坚持使用标准的词法作用域，因为它是最容易处理的。\n\
    \n需要动态作用域和非标准求值的一个常见场景是，当你需要对表达式求值，而表达式中的数据部分存在于变量中，部分存在于数据框中时。在这里，如果你能像使用标准变量一样使用数据框变量，就能获得更简洁的接口。因此，我将给出一个如何实现这一点的例子。\n\
    \n我们将编写一个函数，它接受一个表达式和一个数据框作为输入，并在一个环境中对该表达式求值，该环境会优先在数据框中查找变量。如果找不到，它会在调用者（而非函数）的环境中查找。\n\
    \n该函数看起来像这样：\n\n```\ndf_eval <- function(expr, df = list()) {\n  x <- substitute(expr)\
    \  # 剥离 expr 的环境；现在只是引号内的表达式\n  env <- list2env(df, parent = parent.frame())\n\
    \  eval(x, env)\n}\n```\n\n我们使用 `substitute()` 函数来剥离 `expr` 的环境。它将 `expr` 转换为原始表达式，就像我们可以用\
    \ `quote()` 创建的那样。我将其存储在变量 `x` 中，是为了稍后说明一个要点；通常情况下，我可能仍会称它为 `expr`。\n\n无论如何，接下来我们根据数据框创建一个新环境。数据框也是列表，因此\
    \ `list2env()` 会创建一个环境，其中数据框中的每个变量都存储为环境变量。新环境的父环境是 `parent.frame()`，即调用者的环境。这样设置会将数据框放在前面，因此我们在查找父框架之前，会先使用数据框中的变量。如果在数据框中找不到某个变量，我们就会在调用者的环境中查找。最后，我们在新环境中对\
    \ `x` 进行求值。\n\n让我们设置一些数据来进行实验：\n\n```\nx <- 1:3\ny <- \"foo\"\ndf <- data.frame(y\
    \ = 2:4, z = 3:5)\n```\n\n我们在调用者的环境中有一个 `x` 和一个 `y`，在数据框中有 `y` 和 `z`。我们希望函数选择这个\
    \ `x`（而不是 `df_eval` 内部的 `x`），并且如果我们调用 `df_eval` 并传入 `df` 作为数据框，我们不应该选择变量 `y`，而应该选择数据框中的\
    \ `y`。\n\n让我们测试一下。首先，仅使用 `x` 调用它：\n\n```\ndf_eval(x)\n## [1] 1 2 3\n```\n\n我们没有提供数据框，因此使用了默认参数，但这次调用的目的是展示我们选择了全局环境中的\
    \ `x`，而不是函数内部的 `x`。\n\n现在，让我们看看它是否会优先选择数据框中的 `y` 而不是这里的变量：\n\n```\ndf_eval(y+z,\
    \ df)\n```\n"
- fmt: "# 1 5 7 9\n\nYup, it works as expected.\n\nSeveral built-in functions in R\
    \ do nonstandard evaluation in this way—putting data frames into the current environment\
    \ when evaluating an expression—and it is a fair way to exploit the environment\
    \ mechanism. Don't go overboard, though.\n\n## Chapter 5: Higher-Order Functions\n\
    \nThe term *higher-order functions* refers to functions that either take functions\
    \ as arguments or return functions. The functions we used to create closures in\
    \ the previous chapter are thus higher-order functions.\n\nHigher-order functions\
    \ are frequently used in R instead of looping control structures, and we will\
    \ cover how you can do this in general in the next chapter. I will just give you\
    \ a quick example here before moving on to more interesting things we can do with\
    \ functions working on functions.\n\nThe function `sapply`, which we saw in the\
    \ last chapter, lets you call a function for all elements in a list or vector.\
    \ You should mainly use this for interactive in R because it is a little unsafe.\
    \ It tries to guess at which type of output you want, based on what the input\
    \ and the function you give it does, and there are safer alternatives, `vapply`\
    \ and `lapply`, where the output is always a predefined type or always a list,\
    \ respectively.\n\nIn any case, if you want to evaluate a function for all elements\
    \ in a vector, you can write code like this:\n\n```r\nsapply(1:4, sqrt)\n## [1]\
    \ 1.000000 1.414214 1.732051 2.000000\n```\n\n© Thomas Mailund 2023  \nT. Mailund,\
    \ *Functional Programming in R 4*, <https://doi.org/10.1007/978-1-4842-9487-1_5>\n\
    \nThis evaluates `sqrt` on all the elements in the vector `1:4` and gives you\
    \ the result. It is an analog to the vectorized expression, and the vectorized\
    \ version is probably always preferable if your expressions can be vectorized.\
    \ The vector expression is easier to read and usually much faster if it involves\
    \ calling built-in functions:\n\n```r\nsqrt(1:4)\n```\n\nYou can use `sapply`\
    \ to evaluate a function on all elements in a sequence when the function you want\
    \ to call is not vectorized, however, and in fact, the `Vectorize` function we\
    \ saw in the first chapter is implemented using `sapply`'s cousin, `lapply`.\n\
    \nWe could implement our own version like this:\n\n```r\nmyapply <- function(x,\
    \ f) {\n  result <- x\n  for (i in seq_along(x))\n    result[i] <- f(x[i])\n \
    \ result\n}\n\nmyapply(1:4, sqrt)\n## [1] 1.000000 1.414214 1.732051 2.000000\n\
    ```\n\nHere, I create a result vector of the right length just by copying `x`.\
    \ The assignments into this vector might create copies. The first is guaranteed\
    \ to because we are changing a vector, which R avoids by making a copy. Later\
    \ assignments might do it again to convert the type of the results. Still, it\
    \ is reasonably simple to see how it works, and if the input and output have the\
    \ same type, it is running in linear time (in the number of function calls to\
    \ `f` which of course can have any runtime complexity).\n\nUsing a function like\
    \ `sapply` or `myapply`, or any of their cousins, lets us replace with a single\
    \ function call a loop, where all kinds of nastiness can happen with assignments\
    \ to local variables that we do not necessarily want. We just need to wrap the\
    \ body of the loop in another function we can give to the apply function.\n\n\
    Closures can be particularly useful in combination with apply functions if we\
    \ need to pass some information along to the function. Let us, for example, consider\
    \ a situation where we want to scale the element in a vector. We wrote such a\
    \ function in the first chapter:\n\n```r\nrescale <- function(x) {\n  m <- mean(x)\n\
    \  s <- sd(x)\n  (x - m) / s\n}\n\nrescale(1:4)\n## [1] -1.1618950 -0.3872983\
    \  0.3872983  1.1618950\n```\n\nThis was written using vector expressions, which\
    \ is the right thing to do, but let us see what we can do with an apply function.\
    \ Obviously, we still need to compute `m` and `s` and then a function for computing\
    \ `(x - m) / s`:\n\n```r\nrescale <- function(x) {\n  m <- mean(x)\n  s <- sd(x)\n\
    \  f <- function(y) (y - m) / s\n  myapply(x, f)\n}\n\nrescale(1:4)\n## [1] -1.1618950\
    \ -0.3872983  0.3872983  1.1618950\n```\n\nThere is really no need to give the\
    \ function a name and then pass it along; we can also just write\n\n```r\nrescale\
    \ <- function(x) {\n  m <- mean(x)\n  s <- sd(x)\n  myapply(x, \\(y) (y - m) /\
    \ s)\n}\n\nrescale(1:4)\n## [1] -1.1618950 -0.3872983  0.3872983  1.1618950\n\
    ```\n\nThe function we pass to `myapply`, `\\(y) ...`, knows the environment in\
    \ which it was created, so it knows `m` and `s` and can use these variables when\
    \ it is being called from `myapply`.\n\n## Currying\n\nIt is not unusual to have\
    \ a function of two arguments where you want to bind one of them and return a\
    \ function that takes, as a parameter, the second argument. For example, if we\
    \ want to use the function\n\n```r\nf <- function(x, y) x + y\n```\n\nwe might\
    \ want to use it to add 2 to each element in a sequence using `myapply`. Once\
    \ again, I stress that this example is just to show you a general technique, and\
    \ you should never do these things when you can solve a problem with vector expressions.\
    \ Still, let us for a second pretend that we don't have vector expressions. Then\
    \ we would need to create a function for one of the parameters, say `y`, and then\
    \ when called evaluate `f(2, y)`.\n\nWe could write it like this, obviously:\n\
    \n```r\ng <- function(y) f(2, y)\nmyapply(1:4, g)\n## [1] 3 4 5 6\n```\n\nor shorter\
    \ as\n\n```r\nmyapply(1:4, \\(y) f(2, y))\n## [1] 3 4 5 6\n```\n\nwhich would\
    \ suffice if we only ever needed to add 2 to all elements in a sequence. If we\
    \ wanted a more general solution, we would want a function to create the function\
    \ we need, a closure that remembers `x` and can be called with `y`. Such a function\
    \ is only slightly more complicated to write; we simply need a function that returns\
    \ a function like this:\n\n```r\nh <- function(x) \\(y) f(x, y)\nmyapply(1:4,\
    \ h(2))\n## [1] 3 4 5 6\n```\n\nThe functions `f` and `h` eventually do the same\
    \ thing, the only difference is in how we provide parameters to them. Function\
    \ `f` needs both parameters at once, while function `h` takes one parameter at\
    \ a time:\n\n```r\nf(2, 2)\n## [1] 4\n\nh(2)(2)\n## [1] 4\n```\n\nA function such\
    \ as `h`, one that takes a sequence of parameters not in a single function call\
    \ but through a sequence of function calls, each taking a single parameter and\
    \ returning a new function, is known as a *curried* function. What we did to transform\
    \ `f` into `h` is called *currying* `f`. The names refer to the logician Haskell\
    \ Curry, from whom we also get the name of the functional programming language\
    \ Haskell.\n\nThe transformation we did from `f` to `h` was manual, but we can\
    \ write functions that transform functions: functions that take a function as\
    \ input and return another function. We can thus write a general function for\
    \ currying a function—another high-level function. A function for currying functions\
    \ of two parameters can be written like this:\n\n```r\ncurry2 <- function(f) \\\
    (x) \\(y) f(x, y)\n```\n\nThe argument `f` is the function we want to curry, and\
    \ the return value is the function\n\n```r\n\\(x) \\(y) f(x, y)\n```\n\nthat needs\
    \ to be called first with parameter `x` and then with parameter `y`, and then\
    \ it will return the value `f(x, y)`. The names of the variables do not matter\
    \ here, they are just names and need not have anything to do with the names of\
    \ the variables that `f` actually takes.\n\nUsing this function, we can automatically\
    \ create `h` from `f`:\n\n```r\nh <- curry2(f)\n\nf(2, 3)\n## [1] 5\n\nh(2)(3)\n\
    ## [1] 5\n```\n\nSince `+` is just a function in R, we can also simply use *it*\
    \ instead of writing the function `f` first:\n\n```r\nh <- curry2(`+`)\nh(2)(3)\n\
    ## [1] 5\n```\n\nand thus write the code that adds 2 to all elements in a sequence\
    \ like this:\n\n```r\nmyapply(1:4, curry2(`+`)(2))\n```"
