    but you will get an error if you call it on a sequence of names: node_depth(tree,
    c("A", "B", "C", "D")) It is not hard to imagine that a vectorized version could
    be useful, however. For example, to get the depth of a sequence of names: node_depth
    *<* - Vectorize(node_depth, vectorize.args = "name", USE.NAMES = FALSE)


    node_depth(tree, c("A", "B", "C", "D"))


    ## [1] 2 2 1 1


    Here, the USE.NAMES = FALSE is needed to get a simple vector out. If we did not
    include it, the vector would have names based on the input variables. See the
    documentation for Vectorize for details.


    **Infix Operators**


    Infix operators in R are also functions. You can overwrite them with other functions
    (but you really shouldn’t since you could mess up a lot of code), and you can
    also make your own infix operators.


    User-defined infix operators are functions with special names. A function with
    a name that starts and ends with % will be considered an infix operator by R.
    There is no special syntax for creating a function to be used as an infix operator,
    except that it should take two arguments. There is a special syntax for assigning
    variables, though, including variables with names starting and ending with %.


    Chapter 2 FunCtions in r


    To work with special variables, you need to quote them with backticks. You cannot
    write +(2, 2) even though + is a function. R will not understand this as a function
    call when it sees it written like this. But you can take + and quote it, `+`,
    and then it is just a variable name like all other variable names:


    `+`(2, 2)


    ## [1] 4


    The same goes for all other infix operators in R and even control structures:


    ìf`(2 > 3, "true", "false")


    ## [1] "false"


    The R parser recognizes control structure keywords and various operators, for
    example, the arithmetic operators, and therefore these get to have a special syntax.
    But they are all really just functions. Even parentheses are a special syntax
    for the function `(`, and the subscript operators are as well, `[ànd `[[`, respectively.
    If you quote them, you get a variable name that you can use just like any other
    function name.


    Just like all these operators have a special syntax, variables starting and ending
    with % get a special syntax. R expects them to be infix operators and will treat
    an expression like this:


    exp1 %op% exp2


    as the function call


    `%op%`(exp1, exp2)


    Knowing that you can translate an operator name into a function name just by quoting
    it also tells you how to define new infix operators. If you assign a function
    to a variable name, you can refer to it by that name.


    Chapter 2 FunCtions in r


    If that name is a quoted special name, it gets to use the special syntax for that
    name.


    So, to define an operator %x% that does multiplication, we can writè%x%` *<* -
    `*`


    3 %x% 2


    ## [1] 6


    Here, we used quotes twice, first to get a variable name we could assign to for
    %x% and once to get the function that the multiplication operator, *, points to.


    Just because all control structures and operators in R are functions that you
    can overwrite, you shouldn’t go doing that without extreme caution.


    You should *never* change the functions the control structures point to, and you
    should not change the other operators unless you are defining operators on new
    types where it is relatively safe to do so. Defining entirely new infix operators,
    however, can be quite useful if they simplify expressions you write often.


    As an example, let us do something else with the %x% operator—after all, there
    is no point in having two different operators for multiplication.


    We can make it replicate the left-hand side a number of times given by the right-hand
    side:


    `%x%` <- **function**(expr, num) replicate(num, expr) 3 %x% 5


    ## [1] 3 3 3 3 3


    cat("This is ", "very " %x% 3, "much fun")


    ## This is very very very much fun


    We are using the replicate function to achieve this. It does the same thing. It
    repeatedly evaluates an expression a fixed number of times. Using


    %x% infix might give more readable code, depending on your taste.


    Chapter 2 FunCtions in r


    In the interest of honesty, I must mention, though, that we haven’t just given
    replicate a new name here, switching of arguments aside. The %x%


    operator works slightly differently. In %x%, the expr parameter is evaluated when
    we call replicate. So if we call %x% with a function that samples random numbers,
    we will get the same result repeated num times; we will not sample num times.


    rnorm(1) %x% 4


    ## [1] -0.8094755 -0.8094755 -0.8094755 -0.8094755


    Lazy evaluation only takes you so far.


    To actually get the same behavior as replicate, we need a little more trickery:


    `%x%` *<* - **function**(expr, num) {


    m *<* - match.call()


    replicate(num, eval.parent(m$expr))


    }


    rnorm(1) %x% 4


    ## [1] 0.8430961 -2.9336330 -1.1009706 0.2947148


    Here, the match.call function just gets us a representation of the current function
    call from which we can extract the expression without evaluating it. We then use
    replicate to evaluate it a number of times in the calling function’s scope.


    If you don’t quite get this, don’t worry. We cover scopes in a later chapter.


    Chapter 2 FunCtions in r


    **Replacement Functions**


    Another class of functions with special names is the so-called *replacement* *functions*.
    Data in R is immutable. You can change what data parameters point to, but you
    cannot change the actual data. Even when it looks like you are modifying data,
    you are, at least conceptually, creating a copy, modifying that, and making a
    variable point to the new copy.


    We can see this in a simple example with vectors. If we create two vectors that
    point to the same initial vector, and then modify one of them, the other remains
    unchanged:


    x <- y <- 1:5


    x


    ## [1] 1 2 3 4 5


    y


    ## [1] 1 2 3 4 5


    x[1] <- 6


    x


    ## [1] 6 2 3 4 5


    y


    ## [1] 1 2 3 4 5


    R is smart about it. It won’t make a copy of values if it doesn’t have to.


    Semantically, it is best to think of any modification as creating a copy, but
    for performance reasons, R will only make a copy when it is necessary—at least
    for built-in data like vectors. Typically, this happens when you have two variables
    referring to the same data, and you “modify” one of them.


    Chapter 2 FunCtions in r


    We can use the address function to get the memory address of an object. This will
    change when a copy is made but will remain the same when it isn’t. And we can
    use the mem_change function from the pryr package to see how much memory is allocated
    for an expression.


    Using these two functions, we can dig a little deeper into this copying mechanism.
    (The exact output will depend on your computer, but you should see something similar
    to what is shown as follows.) We can start by creating a longish vector and modifying
    it: library(pryr)


    rm(x) ; rm(y)


    mem_change(x <- 1:10000000)


    ## 2.31 kB


    address(x)


    ## [1] "0x7fe426826a90"


    mem_change(x[1] <- 6)


    ## 80 MB


    address(x)


    ## [1] "0x7fe420000000"


    When we assign to the first element in this vector, we see that the entire vector
    is being copied. This might look odd since I just told you that R would only copy
    a vector if it had to, and here we are just modifying an element in it, and no
    other variable refers to it.


    The reason we get a copy here is that the expression we used to create the vector,
    1:10000000, creates an integer vector. The value 6 we assign to the first element
    is a floating point, called “numeric” in R. If we want an actual integer, we have
    to write “L” (for “long” integer) after the number: 32


    Chapter 2 FunCtions in r


    class(6)


    ## [1] "numeric"


    class(6L)


    ## [1] "integer"


    When we assign a numeric to an integer vector, R has to convert the entire vector
    into numeric, and that is why we get a copy: z <- 1:5


    class(z)


    ## [1] "integer"


    z[1] <- 6


    class(z)


    ## [1] "numeric"


    If we assign another numeric to it, after it has been converted, we no longer
    get a copy:


    mem_change(x[3] <- 8)


    ## -1.14 kB


    address(x)'
