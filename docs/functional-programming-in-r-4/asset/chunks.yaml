    \ `sapply()` doesn’t know about databases, we need to wrap the database up in\
    \ the function we provide. If we do this inside a function, `sapply()` won’t have\
    \ access to the database variable, but the function we created, `\\(key) key %in%\
    \ database`, does. The function will get `key` from `sapply()`, and it will get\
