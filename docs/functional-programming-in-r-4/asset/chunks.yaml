    at the end of curry.


    Now we can use this curry function to translate any function into a curried version:


    f <- **function**(x, y, z) x + 2*y + 3*z


    f(1, 2, 3)


    Chapter 5 higher-Order FunCtiOns


    ## [1] 14


    curry(f)(1)(2)(3)


    ## [1] 14


    It is not *quite* the same semantics as calling f directly; we are evaluating
    each expression when we assign it to the arguments table, so lazy evaluation isn’t
    in play here. To write a function that can deal with the lazy evaluation of the
    parameters requires a lot of mucking about with environments and expressions that
    is beyond the scope of this book.


    Aside from that, though, we have written a general function for translating normal
    functions into their curried form.


    It is *much* harder to make a transformation in the other direction automatically.
    If we get a function, we cannot see how many times we would need to call it to
    get a value, if that is even independent of the parameters we give it, so there
    is no way to figure out how many parameters we should get for the uncurried version
    of a curried function.


    The curry function isn’t completely general. We cannot deal with default arguments—all
    arguments must be provided in the curried version—and we cannot create a function
    where some arguments are fixed, and others are not. The curried version always
    needs to take the arguments in the exact order the original function takes them.


    **A Parameter Binding Function**


    We already have all the tools we need to write a function that binds a set of
    parameters for a function and return another function where we can give the remaining
    parameters and get a value:


    bind_parameters <- **function**(f, ...) {


    remembered <- list(...)


    **function**(...) {


    Chapter 5 higher-Order FunCtiOns


    new <- list(...)


    do.call(f, c(remembered, new))


    }


    }


    f <- **function**(x, y, z, w = 4) x + 2*y + 3*z + 4*w f(1, 2, 3, 4)


    ## [1] 30


    g <- bind_parameters(f, y = 2)


    g(x = 1, z = 3)


    ## [1] 30


    h <- bind_parameters(f, y = 1, w = 1)


    f(2, 1, 3, 1)


    ## [1] 17


    h(x = 2, z = 3)'
  trans: "\n# [1] 3 4 5 6\n\n你觉得这个写法是巧妙还是过于简洁而难以理解，全凭个人品味。它显然不如向量表达式优雅，但一旦你熟悉了柯里化的作用，解析起来也并不困难。\n\
    \n话虽如此，我本人还是更喜欢任何一天都使用`myapply`，因为我发现那个版本更易读。但我们还是继续深入探讨一下柯里化。不过请注意，所有这些不同的方法都在做同一件事：通过绑定第一个参数，将二元运算符`+`转化为一个单一函数。\n\
    \n```\nmyapply(1:4, \\(y) 2 + y)\n## [1] 3 4 5 6\n```\n\n我们为柯里化编写的函数只适用于恰好接受两个参数的函数。我们显式创建了一个返回函数的函数，而这个返回函数最终返回最终值，因此柯里化版本必须能处理接受两个参数的函数。但在\
    \ R 中，函数是可以被检查的数据，所以我们可以创建一个通用的版本，能够处理任意数量参数的函数。我们只需要知道函数接受的参数个数，然后创建一个函数序列来处理每一个参数。\n\
    \n完整实现如下所示，在函数列表之后我会详细解释：\n\n```\ncurry <- function(f) {\n  n <- length(formals(f))\n\
    \  if (n == 1) return(f) # 无需柯里化\n  arguments <- vector(\"list\", length = n)\n\
    \  last <- function(x) {\n    arguments[n] <<- x\n    do.call(f, arguments)\n\
    \  }\n  make_i <- function(i, continuation) {\n    force(i) ; force(continuation)\n\
    \    function(x) {\n      arguments[i] <<- x\n      continuation\n    }\n  }\n\
    \  continuation <- last\n  for (i in seq(n-1, 1)) {\n    continuation <- make_i(i,\
    \ continuation)\n  }\n  continuation\n}\n```\n\n首先，我们获取函数`f`接受的参数个数：`n <- length(formals(f))`\n\
    \n我们可以使用`formals`函数获取这些参数。它返回一个所谓的“配对列表”（pair-list），本质上是一个链表，类似于我们在第三章中看到的那种，它在\
    \ R 内部使用，但在实际的 R 编程中并不常用。你可以把它当作列表来对待，除了一些运行时性能差异外，其行为相同。我们只需要知道这个列表的长度。\n\n如果`f`只接受一个参数，我们就直接返回它。这样它就已经是最大程度的柯里化了。否则，我们创建一个列表，用于在调用函数链时存储变量：\n\
    \n```\narguments <- vector(\"list\", length = n)\n```\n\n我们需要收集传递给所创建的各个函数的参数。我们不能像在`curry2`中那样简单地使用形式参数`x`和`y`，因为在我们检查输入函数`f`之前，不知道需要多少个参数。无论如何，我们需要动态创建名称以确保它们不会冲突。将参数保存在一个列表中更简单，而且由于它是一个列表，我们可以将作为参数传递的任何类型的值放入其中。\n\
    \n现在，我们需要创建实际要返回的函数。我们分步进行。我们创建的最终函数应当使用所有参数调用`f`。它将最后一个参数作为输入，因此我们需要将其存储在`arguments`中——由于这意味着修改实际函数作用域之外的列表，我们需要使用`<<-`赋值运算符。为了使用参数列表调用`f`，我们需要使用`do.call`函数。它允许我们以列表形式指定函数的参数，而不是直接用逗号分隔的参数来传递。\n\
    \n```\nlast <- function(x) {\n  arguments[n] <<- x\n  do.call(f, arguments)\n\
    }\n```\n\n其他每个函数也需要存储一个参数，因此它们需要知道对应的索引，然后返回柯里化链中的下一个函数。我们可以这样创建这些函数：\n\n```\n\
    make_i <- function(i, continuation) {\n  force(i) ; force(continuation)\n  function(x)\
    \ {\n    arguments[i] <<- x\n    continuation\n  }\n}\n```\n\n参数`i`是索引，我们用它来为参数赋值；参数`continuation`是那个在最终结果能从`last`函数返回之前仍需被调用的函数。它是柯里化函数的延续。在返回函数之前，我们需要在`make_i`内部对这两个参数进行求值。否则，我们会遇到惰性求值问题：当我们最终调用函数时，变量的值可能已经在我们创建函数后改变了。我们通过调用`force`来处理参数。\n\
    \n现在我们只需将所有部分绑定在一起。我们以降序方式操作，这样在创建下一个函数时，我们始终拥有所需的延续函数。第一个延续函数是`last`函数。它应该是最后一个被调用的函数，并将返回整个柯里化链的期望结果。每次对`make_i`的调用都会返回一个新的延续函数，我们将其提供给链中的下一个函数（按降序排列）：\n\
    \n```\ncontinuation <- last\nfor (i in seq(n-1, 1)) {\n  continuation <- make_i(i,\
    \ continuation)\n}\n```\n\n最终创建的延续函数就是柯里化后的函数，这就是我们在`curry`末尾返回的内容。\n\n现在，我们可以使用这个`curry`函数将任何函数转换为柯里化版本：\n\
    \n```\nf <- function(x, y, z) x + 2*y + 3*z\nf(1, 2, 3)\n## [1] 14\ncurry(f)(1)(2)(3)\n\
    ## [1] 14\n```\n\n这与直接调用`f`的语义并不完全相同；我们在将表达式赋值给参数列表时就对其进行了求值，因此惰性求值在这里并不适用。编写一个能处理参数惰性求值的函数需要大量涉及环境和表达式的复杂操作，这超出了本书的范围。\n\
    \n不过除此之外，我们已经编写了一个通用函数，用于将普通函数转换为其柯里化形式。\n\n反向转换（即自动将柯里化函数转换为非柯里化形式）要困难得多。当我们得到一个函数时，我们无法知道需要调用它多少次才能得到一个值——即使调用次数与传递给它的参数无关——因此我们无法确定应该为非柯里化版本的函数获取多少个参数。\n\
    \n`curry`函数并非完全通用。我们无法处理默认参数——柯里化版本中必须提供所有参数——而且我们也无法创建这样一个函数：其中部分参数被固定，而其他参数不固定。柯里化版本始终需要按照原始函数接受参数的精确顺序来接收参数。\n\
    \n## 一个参数绑定函数\n\n我们已经拥有所有必要的工具，可以编写一个函数，用于绑定函数的一组参数，并返回另一个函数，在该函数中我们可以提供剩余参数并获得结果：\n\
    \n```\nbind_parameters <- function(f, ...) {\n  remembered <- list(...)\n  function(...)\
    \ {\n    new <- list(...)\n    do.call(f, c(remembered, new))\n  }\n}\n```\n\n\
    ```\nf <- function(x, y, z, w = 4) x + 2*y + 3*z + 4*w\nf(1, 2, 3, 4)\n## [1]\
    \ 30\ng <- bind_parameters(f, y = 2)\ng(x = 1, z = 3)\n## [1] 30\nh <- bind_parameters(f,\
    \ y = 1, w = 1)\nf(2, 1, 3, 1)\n## [1] 17\nh(x = 2, z = 3)\n```\n"
- fmt: "## [1] 17\n\nWe get the parameters from the first function call and save them\
    \ in a list, and then we return a closure that can take the remaining parameters,\
    \ turn them into a list, combine the remembered and the new parameters, and call\
    \ function `f` using `do.call`.\n\nAll the building blocks we have seen before,\
    \ we are just combining them to translate one function into another.\n\nUsing\
    \ `list` here to remember the parameters from `...` means that we are evaluating\
    \ the parameters. We are explicitly turning off lazy evaluation in this function.\
    \ It is possible to keep the lazy evaluation semantics as well, but it requires\
    \ more work. We would need to use the `eval(substitute(alist(...)))` trick to\
    \ get the unevaluated parameters into a list—we saw this trick in the first chapter—but\
    \ that would give us raw expressions in the lists, and we would need to be careful\
    \ to evaluate these in the right environment chain to make it work. I leave this\
    \ as an exercise to the reader, or you can look at the `partial` function from\
    \ the `pryr` package to see how it is done.\n\nSuch partial binding functions\
    \ aren’t used that often in R. It is just as easy to write closures to bind parameters\
    \ and those are usually easier to read, so use partial bindings with caution.\n\
    \n**Continuation-Passing Style**\n\nThe trick we used to create `curry` involved\
    \ creating a chain of functions where each function returns the next function\
    \ that should be called, the *continuation*. This idea of having the remainder\
    \ of a computation as a function you can eventually call can be used in many other\
    \ problems.\n\nConsider the simple task of adding all elements in a list. We can\
    \ write a function for doing this in the following three ways:\n\n```\nmy_sum_direct\
    \ <- function(lst) {\n  if (is_empty(lst)) 0\n  else first(lst) + my_sum_direct(rest(lst))\n\
    }\n\nmy_sum_acc <- function(lst, acc = 0) {\n  if (is_empty(lst)) acc\n  else\
    \ my_sum_acc(rest(lst), first(lst) + acc)\n}\n\nmy_sum_cont <- function(lst, cont\
    \ = identity) {\n  if (is_empty(lst)) cont(0)\n  else my_sum_cont(rest(lst),\n\
    \                   function(acc) cont(first(lst) + acc))\n}\n```\n\nThe first\
    \ function handles the computation in an obvious way by adding the current element\
    \ to the result of the recursive call. The second function uses an accumulator\
    \ to make a tail-recursive version, where the accumulator carries a partial sum\
    \ along with the recursion. The third version also gives us a tail-recursive function\
    \ but in this case via a continuation function. This function works as the accumulator\
    \ in the second function; it just wraps the computation inside a function that\
    \ is passed along in the recursive call.\n\nHere, the continuation captures the\
    \ partial sum moving down the recursion—the same job as the accumulator has in\
    \ the second function—but expressed as an as-yet not evaluated function. This\
    \ function will eventually be called by the sum of values for the rest of the\
    \ recursion, so the job at this place in the recursion is simply to take the value\
    \ it will eventually be provided, add the current value, and then call the continuation\
    \ it was passed earlier to complete the computation.\n\nFor something as simple\
    \ as adding the numbers in a list, continuation passing is of course overkill.\
    \ If you need tail-recursion, the accumulator version is simpler and faster, and\
    \ in any case, you are just replacing recursion going down the vector with function\
    \ calls in the continuation moving up again (but see later for a solution to this\
    \ problem). Still, seeing the three approaches to recursion—direct, accumulator,\
    \ and continuation passing—in a trivial example makes it easier to see how they\
    \ work and how they differ.\n\nA common use of continuations is to translate nontail-recursive\
    \ functions into tail-recursive. As an example, we return to the function from\
    \ Chapter [3 th](https://doi.org/10.1007/978-1-4842-9487-1_3)at we used to compute\
    \ the size of a tree. In that solution, we needed to handle internal nodes by\
    \ first calling recursively on the left subtree and then the right subtree, to\
    \ get the sizes of these, and then combining them and adding one for the internal\
    \ node. Because we needed the results from two recursive calls, we couldn’t directly\
    \ make the function tail-recursive. Using continuations, we can.\n\nThe trick\
    \ is to pass a continuation along that is used to wrap one of the recursions,\
    \ while we can handle the other recursions in a tail-recursive call. The solution\
    \ looks like this:\n\n```\nsize_of_tree <- function(node, continuation = identity)\
    \ {\n  if (is.null(node$left) && is.null(node$right)) {\n    # A leaf, of size\
    \ 1.\n    # Tell the continuation to compute the rest from that value.\n    continuation(1)\n\
    \  } else {\n    # Make a continuation that will be called with the size of the\
    \ left tree\n    left_continuation <- function(left_result) {\n      # When we\
    \ have the size of the left tree, create a continuation that\n      # combines\
    \ left and right tree (and give it to the continuation)\n      right_continuation\
    \ <- function(right_result) {\n        continuation(left_result + right_result\
    \ + 1)\n      }\n      # Compute the size of the right tree\n      size_of_tree(node$right,\
    \ right_continuation)\n    }\n    # Compute the size of the left tree\n    size_of_tree(node$left,\
    \ left_continuation)\n  }\n}\n\ntree <- make_node(\"root\",\n                \
    \  make_node(\"C\", make_node(\"A\"),\n                            make_node(\"\
    B\")),\n                  make_node(\"D\"))\nsize_of_tree(tree)\n```"
