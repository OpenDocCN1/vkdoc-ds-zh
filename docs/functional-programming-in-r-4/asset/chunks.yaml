    The structure is very similar to the list version, but here we return the result
    of the recursive call together with the current index if it is a duplicate and
    just the result of the recursive call otherwise.


    This solution isn’t perfect. Each time we create an index vector by combining
    it with the recursive result, we are making a copy so the running time will be
    quadratic in the length of the result. We can turn it into a linear time algorithm
    in the output as well by making a next list instead of a vector of the indices
    and then translate that into a vector in the remove duplicates function before
    we index into the vector x to remove the duplicates. I will leave that as an exercise.


    As another example of a recursive function where we need to combine results from
    recursive calls, we can consider computing the size of a tree.


