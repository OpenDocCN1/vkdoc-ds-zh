- fmt: "## [1] 1\n\n我们可以解包该函数，看看具体发生了什么。当我们创建计数器时，调用 `make_counter` 函数，该函数创建了一个环境，其中\
    \ `x` 被设置为 `0`，然后返回 `count` 函数。\n\n当我们调用计数器函数时，它会通过闭包知道 `x` 的存在，因此可以计算 `x + 1`，并将结果赋值给\
    \ `x`。问题就出在这里。在计算 `x + 1` 时使用的 `x` 是通过沿环境链向上搜索找到的，但函数所赋值的 `x` 被放入了计数器函数自身的环境。函数返回后，该环境就消失了。下一次调用\
    \ `counter` 时，会创建一个新的函数实例，从而产生一个新的环境。来自 `make_counter` 函数的变量 `x` 永远不会被更新。\n\n\
    当你使用 `<-` 时，如果局部变量不存在，就会创建一个新的局部变量。即使变量名在环境链更深层被发现，也没有影响。赋值始终是针对局部环境。\n\n要赋值给环境链中更深层的变量，你需要使用运算符\
    \ `<<-`。这个运算符会像 R 语言确定表达式求值方式一样，沿环境链向上搜索，并在找到该变量的环境中进行更新（如果环境链中找不到该变量，则将其添加到全局环境中）。\n\
    \n我们来看一下将示例中的赋值运算符更改后会发生什么：\n\n```\nMake_counter <- function() {\n  x <- 0\n \
    \ count <- function() {\n    x <<- x + 1\n    x\n  }\n}\n\ncounter <- make_counter()\n\
    counter()\n## [1] 1\ncounter()\n## [1] 2\ncounter()\n## [1] 3\n```\n\n这次，当我们进行赋值时，发现外层环境中存在一个\
    \ `x`，即我们在调用 `make_counter` 时初始化的那个 `x`。因此，该赋值针对的是那个环境，而不是局部环境。每次调用 `counter`\
    \ 时，我们都会创建一个新的函数实例环境，但所有实例都链接到同一个外层环境，因此每次调用该函数时，我们都会更新同一个环境。\n\n我们可以结合使用这个计数器函数和\
    \ `<<-` 运算符，来创建 `depth_first_numbers` 函数的一个更简单版本，这样就不需要在递归调用中传递数据了。我们可以在最外层作用域中创建一个表格和一个计数器函数，然后直接使用该计数器并通过\
    \ `<<-` 对表格进行赋值：\n\n```\ndepth_first_numbers <- function(tree) {\n  table <- c()\n\
    \  counter <- make_counter()\n  traverse_tree <- function(node) {\n    if (is.null(node$left)\
    \ && is.null(node$right)) {\n      dfn <- counter()\n      node$range <- c(dfn,\
    \ dfn)\n      table[node$name] <<- dfn\n      node\n    } else {\n      left <-\
    \ traverse_tree(node$left)\n      right <- traverse_tree(node$right)\n      new_node\
    \ <- make_node(node$name, left, right)\n      new_node$range <- c(left$range[1],\
    \ right$range[2])\n      new_node\n    }\n  }\n  new_tree <- traverse_tree(tree)\n\
    \  list(tree = new_tree, table = table)\n}\n\nresult <- depth_first_numbers(tree)\n\
    print_tree(result$tree)\n## [1] \"((A,B) ,D)\"\nresult$table\n## A B D\n## 1 2\
    \ 3\n```\n\n如果我们想用深度优先编号范围来标注所有节点，我们仍然需要在这里创建一个新树；我们仍然不能修改数据，但是可以在递归函数内部使用外层作用域中的变量。\n\
    \n**词法作用域与动态作用域**\n\n这种根据函数定义时所处环境来查找变量值的规则，被称为词法作用域，是最常见的作用域标准。之所以这样称呼，是因为原则上你可以通过代码判断表达式中的变量是在哪里定义的。首先，你检查变量是否在当前局部环境中设置，可以是局部变量或函数参数。如果没有，你会查看外围代码，检查该变量是否在该环境中。外围代码可以是全局环境，也可以是另一个函数。如果它是一个函数且变量未定义，你会沿着函数定义处的代码继续向外查找。如果变量到值的映射取决于函数被调用的位置而非定义的位置（即所谓的动态作用域），那么仅通过阅读函数定义处的代码，你无法确定变量名所引用的到底是哪个变量。\n\
    \nR 语言支持两种作用域，其中词法作用域是默认的（标准求值模式）。尽管如此，通过修改环境链，你可以访问调用函数的作用域（在非标准求值模式下）。在某些情况下，非标准求值可以为你的代码提供更简洁的接口，但在大多数项目中，你应该坚持使用标准的词法作用域，因为它是最容易处理的。\n\
    \n需要动态作用域和非标准求值的一个常见场景是，当你需要对表达式求值，而表达式中的数据部分存在于变量中，部分存在于数据框中时。在这里，如果你能像使用标准变量一样使用数据框变量，就能获得更简洁的接口。因此，我将给出一个如何实现这一点的例子。\n\
    \n我们将编写一个函数，它接受一个表达式和一个数据框作为输入，并在一个环境中对该表达式求值，该环境会优先在数据框中查找变量。如果找不到，它会在调用者（而非函数）的环境中查找。\n\
    \n该函数看起来像这样：\n\n```\ndf_eval <- function(expr, df = list()) {\n  x <- substitute(expr)\
    \  # 剥离 expr 的环境；现在只是引号内的表达式\n  env <- list2env(df, parent = parent.frame())\n\
    \  eval(x, env)\n}\n```\n\n我们使用 `substitute()` 函数来剥离 `expr` 的环境。它将 `expr` 转换为原始表达式，就像我们可以用\
    \ `quote()` 创建的那样。我将其存储在变量 `x` 中，是为了稍后说明一个要点；通常情况下，我可能仍会称它为 `expr`。\n\n无论如何，接下来我们根据数据框创建一个新环境。数据框也是列表，因此\
    \ `list2env()` 会创建一个环境，其中数据框中的每个变量都存储为环境变量。新环境的父环境是 `parent.frame()`，即调用者的环境。这样设置会将数据框放在前面，因此我们在查找父框架之前，会先使用数据框中的变量。如果在数据框中找不到某个变量，我们就会在调用者的环境中查找。最后，我们在新环境中对\
    \ `x` 进行求值。\n\n让我们设置一些数据来进行实验：\n\n```\nx <- 1:3\ny <- \"foo\"\ndf <- data.frame(y\
    \ = 2:4, z = 3:5)\n```\n\n我们在调用者的环境中有一个 `x` 和一个 `y`，在数据框中有 `y` 和 `z`。我们希望函数选择这个\
    \ `x`（而不是 `df_eval` 内部的 `x`），并且如果我们调用 `df_eval` 并传入 `df` 作为数据框，我们不应该选择变量 `y`，而应该选择数据框中的\
    \ `y`。\n\n让我们测试一下。首先，仅使用 `x` 调用它：\n\n```\ndf_eval(x)\n## [1] 1 2 3\n```\n\n我们没有提供数据框，因此使用了默认参数，但这次调用的目的是展示我们选择了全局环境中的\
    \ `x`，而不是函数内部的 `x`。\n\n现在，让我们看看它是否会优先选择数据框中的 `y` 而不是这里的变量：\n\n```\ndf_eval(y+z,\
    \ df)\n```"
