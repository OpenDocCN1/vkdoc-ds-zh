    A <- make_node(\"A\")\nB <- make_node(\"B\")\nC <- make_node(\"C\")\nD <- make_node(\"\
    D\")\nroot <- make_node(\"root\")\n\nleft(C) <- A\nright(C) <- B\nleft(root) <-\
    \ C\nright(root) <- D\n\ntree <- root\n```\n\n## 第 2 章 R 语言中的函数\n\n为了查看结果，我们可以编写一个用于打印树的函数。为了保持函数简单，我假设要么两个子节点都是\
