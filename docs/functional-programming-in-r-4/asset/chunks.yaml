    We create a new environment for the call g(3), and since g’s environment is the
    one we created when we called f(2), that will be the parent environment. The parameter
    y is inserted in the new environment, so when we evaluate x + y, we can get y
    from there. The variable x is not in the local environment, so we must follow
    the parent pointer to the f(2) environment, where we find that it maps to 2.


    Chapter 4 SCope and CloSureS


    **Closures**


    The g function we have written here is an example of a so-called *closure*: a
    function that can find some of the variables it needs in the environment of the
    function call that created it. With closures, we can adapt the same function to
    different data by putting it in different environment chains.


    With the f from before, we could write


    h1 <- f(1)


    ## <environment: 0x7fe446992678>


    h2 <- f(2)


    ## <environment: 0x7fe4777ada20>


    h3 <- f(3)


    ## <environment: 0x7fe477056128>


    to get three different functions, one that adds 1 to its input, one that adds
    2, and one that adds 3, all from the same code. The variable x will be found in
    three different environments—environments created when we called f and that map
    x to 1, 2, or 3, respectively.


    sapply(1:5, h1)


    ## [1] 2 3 4 5 6


    sapply(1:5, h2)


    ## [1] 3 4 5 6 7


    sapply(1:5, h3)


    ## [1] 4 5 6 7 8


    Chapter 4 SCope and CloSureS


    Closures are frequently used in functional programming because they give us a
    way to wrap up data together with functions so that we can separate domain information
    from generic code. Earlier, we called sapply() (it stands for simplifying apply)
    with three closures. The sapply() function calls its argument function on each
    element in a sequence. It doesn’t know anything about what the function does,
    but it must be a function it can call with a single argument. By using closures,
    we adapted a function that does addition to a function that has already bound
    one of the arguments to the addition. By doing that, we adapted addition to the
    interface that sapply() provides.


    We don’t need to write functions to return closures either. Whenever you define
    a function, you give it access to all the variables you have in scope at the point
    where you define it. So if you write code such as this:


    *# Increment all elements in x by inc*


    inc_all <- **function**(x, inc) {


    sapply(x, \(a) a + inc)


    }


    inc_all(1:5, 3)


    ## [1] 4 5 6 7 8


    you are still creating a function (in this case, we don’t name it, but it is the
    function \(a) a + inc) that knows how much to increment by, so sapply() can use
    it without needing the increment amount as an extra parameter.


    Of course, a vector expression


    1:5 + 3


    ## [1] 4 5 6 7 8


    Chapter 4 SCope and CloSureS


    would be both cleaner and more efficient than using sapply(), but our needs are
    often more complex than adding numbers. Maybe we need to check which elements
    in our data can be found in some database—a toy example of that could look like
    this:


    ## foo qux bar


    ## TRUE FALSE TRUE


    Since sapply() doesn’t know about databases, we need to wrap the database up in
    the function we provide. If we do this inside a function, sapply() won’t have
    access to the database variable, but the function we created, \(key) key %in%
    database, does. The function will get key from sapply(), and it will get database
    from its scope.


    **Reaching Outside Your Innermost Scope**


    When we assign to a variable using the <- operator, we modify the environment
    at the top of the current environment chain. We modify the local environment.
    So what does this code do?


    Make_counter <- **function**() {


    x <- 0


    count <- **function**() {


    x <- x + 1


    x


    }


    }


    counter <- make_counter()


