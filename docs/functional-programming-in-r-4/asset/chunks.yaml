    \n如果你不太理解这一点，别担心。我们将在后面的章节中介绍作用域。\n\n## 第2章 R中的函数\n\n**替换函数**\n\n另一类具有特殊名称的函数是所谓的*替换函数*。R中的数据是不可变的。你可以更改数据参数所指的内容，但不能更改实际数据。即使看起来你在修改数据，至少在概念上，你是在创建一个副本，修改它，然后使一个变量指向新的副本。\n\
    \n我们可以通过一个简单的向量示例看到这一点。如果我们创建两个指向同一个初始向量的向量，然后修改其中一个，另一个保持不变：\n\n```\nx <- y <-\
