    \n## 第2章 R中的函数\n\n```\nclass(6)\n```\n\n## [1] \"numeric\"\n\n```\nclass(6L)\n\
    ```\n\n## [1] \"integer\"\n\n当我们将一个numeric值赋给一个整数向量时，R不得不将整个向量转换为numeric，这就是我们得到副本的原因：\n\
    \n```\nz <- 1:5\nclass(z)\n```\n\n## [1] \"integer\"\n\n```\nz[1] <- 6\nclass(z)\n\
    ```\n\n## [1] \"numeric\"\n\n如果我们在它被转换后再赋一个numeric值给它，就不会再得到副本：\n\n```\nmem_change(x[3]\
