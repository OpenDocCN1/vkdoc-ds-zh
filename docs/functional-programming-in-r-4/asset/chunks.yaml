  trans: "\n## [1] 17\n\n我们从第一次函数调用中获取参数，并将其保存到一个列表中，然后返回一个闭包，该闭包可以接收剩余参数，将它们转为列表，合并已记忆的参数和新参数，并通过\
    \ `do.call` 调用函数 `f`。\n\n我们之前已经见过所有的构建块，现在只是将它们组合起来，将一个函数转换为另一个函数。\n\n在这里使用 `list`\
    \ 来记忆来自 `...` 的参数，意味着我们正在对参数进行求值。我们在该函数中明确关闭了惰性求值。保持惰性求值的语义也是可能的，但这需要更多工作。我们需要使用\
    \ `eval(substitute(alist(...)))` 技巧来将未求值的参数放入一个列表中——我们在第一章中见过这个技巧——但这会让我们在列表中得到原始表达式，并且需要小心地在正确的环境链中对这些表达式求值，才能使其正常工作。我把这作为练习留给读者，或者你可以查看\
    \ `pryr` 包中的 `partial` 函数，了解它是如何实现的。\n\n这种部分绑定函数在 R 中并不常用。编写闭包来绑定参数同样简单，而且通常更易读，因此在使用部分绑定时需谨慎。\n\
    \n**续延传递风格**\n\n我们用来创建 `curry` 的技巧涉及创建一个函数链，其中每个函数返回下一个应被调用的函数，即*续延*（*continuation*）。这种将计算的剩余部分作为一个可最终调用的函数的想法，可以应用于许多其他问题。\n\
    \n考虑一个简单的任务：对列表中的所有元素求和。我们可以通过以下三种方式编写函数来实现：\n\n```\nmy_sum_direct <- function(lst)\
    \ {\n  if (is_empty(lst)) 0\n  else first(lst) + my_sum_direct(rest(lst))\n}\n\
    \nmy_sum_acc <- function(lst, acc = 0) {\n  if (is_empty(lst)) acc\n  else my_sum_acc(rest(lst),\
    \ first(lst) + acc)\n}\n\nmy_sum_cont <- function(lst, cont = identity) {\n  if\
    \ (is_empty(lst)) cont(0)\n  else my_sum_cont(rest(lst),\n                   function(acc)\
    \ cont(first(lst) + acc))\n}\n```\n\n第一个函数以直观的方式处理计算：将当前元素与递归调用的结果相加。第二个函数使用累加器来构建一个尾递归版本，其中累加器在递归过程中携带部分和。第三个版本同样提供了一个尾递归函数，但这次是通过一个续延函数来实现的。该函数的作用类似于第二个函数中的累加器；它只是将计算包装在一个函数内，该函数在递归调用中被传递下去。\n\
    \n在这里，续延捕获了向下递归过程中的部分和——这与第二个函数中累加器的作用相同——但表示为尚未求值的函数。该函数最终会被递归其余部分的和值所调用，因此在该递归位置的任务仅仅是接收最终会提供的值，加上当前值，然后调用先前传递给它的续延以完成计算。\n\
    \n对于“对列表中的数字求和”这样简单的任务，续延传递当然是杀鸡用牛刀。如果你需要尾递归，累加器版本更简单、更快；而且无论如何，你只是用续延向上传递的函数调用替换了向下遍历向量的递归（不过后续会看到这个问题的一种解决方案）。尽管如此，在一个简单的例子中看到这三种递归方式——直接递归、累加器递归和续延传递递归——有助于理解它们的工作原理及区别。\n\
    \n续延的一个常见用途是将非尾递归函数转换为尾递归函数。举个例子，我们回到第 [3 章](https://doi.org/10.1007/978-1-4842-9487-1_3)中用于计算树的大小的函数。在那个解决方案中，我们需要处理内部节点：先递归调用左子树，再调用右子树，获取它们的大小，然后将它们相加并加\
    \ 1（表示内部节点自身）。因为我们需要两次递归调用的结果，所以无法直接使该函数变成尾递归。使用续延，我们可以做到。\n\n这个技巧是传递一个续延，用它来包裹其中一次递归，而我们可以通过尾递归调用来处理另一次递归。解决方案如下所示：\n\
    \n```\nsize_of_tree <- function(node, continuation = identity) {\n  if (is.null(node$left)\
    \ && is.null(node$right)) {\n    # 叶子节点，大小为 1。\n    # 告诉续延根据该值计算后续部分。\n    continuation(1)\n\
    \  } else {\n    # 创建一个续延，将在获得左树大小时被调用\n    left_continuation <- function(left_result)\
    \ {\n      # 当获得左树大小时，创建一个续延，\n      # 用于合并左树和右树（并将其传递给续延）\n      right_continuation\
    \ <- function(right_result) {\n        continuation(left_result + right_result\
    \ + 1)\n      }\n      # 计算右树的大小\n      size_of_tree(node$right, right_continuation)\n\
    \    }\n    # 计算左树的大小\n    size_of_tree(node$left, left_continuation)\n  }\n}\n\
    \ntree <- make_node(\"root\",\n                  make_node(\"C\", make_node(\"\
    A\"),\n                            make_node(\"B\")),\n                  make_node(\"\
    D\"))\nsize_of_tree(tree)\n```\n"
- fmt: "## [1] 5\n\nThe function takes a continuation along in its call, and this\
    \ function is responsible for computing \"the rest of what needs to be done.\"\
    \ If the node we are looking at is a leaf, we call it with `1`, because a leaf\
    \ has size one, and then it will do whatever computation is needed to compute\
    \ the size of the tree we have seen earlier and wrapped in the continuation parameter.\n\
    \nThe default continuation is the identity function:\n\n`function(x) x`\n\nso\
    \ if we just call the function with a leaf, we will get `1` as the value. But\
    \ we modify the continuation when we see an internal node to wrap some of the\
    \ computation we cannot do yet because we do not have the full information for\
    \ what we need to compute.\n\nFor internal nodes, we do this:\n\n```\n# Make a\
    \ continuation that will be called with the size of the left tree\nleft_continuation\
    \ <- function(left_result) {\n    # When we have the size of the left tree, create\
    \ a continuation that\n    # combines left and right tree (and give it to the\
    \ continuation)\n    right_continuation <- function(right_result) {\n        continuation(left_result\
    \ + right_result + 1)\n    }\n    # Compute the size of the right tree\n    size_of_tree(node$right,\
    \ right_continuation)\n}\n# Compute the size of the left tree\nsize_of_tree(node$left,\
    \ left_continuation)\n```\n\nWe create a continuation that, if we give it the\
    \ size of the left subtree, can compute the size of the full tree. When it is\
    \ called, it gets the size of the left subtree as its argument, but it needs to\
    \ compute the size of the right subtree itself. For that, it needs a continuation\
    \ that will get the size of the right tree, and when *that* function is called,\
    \ we can return the size of the inner node: the size of the left tree plus the\
    \ size of the right tree plus one. It returns it by calling the continuation,\
    \ which will then handle whatever has to happen as we return from the recursion.\n\
    \nThe `left_continuation` calls a recursion on the right tree with this `right_continuation`,\
    \ thus getting the size of the right tree into the `right_continuation` function.\
    \ But before `left_continuation` is called, we call `size_of_tree(node$left, left_continuation)`\
    \ to get the size of the left tree. When we have traversed the left tree, `left_continuation`\
    \ is called with its size.\n\nBecause it is tail-recursive, we can replace the\
    \ recursive calls with a loop. This time around, we need to remember to force\
    \ the evaluation of the continuation when we create the new continuation because\
    \ when we loop we are modifying local parameters. Otherwise, it looks like you\
    \ would expect from the general pattern for translating tail-recursive functions\
    \ into looping functions.\n\n```\nsize_of_tree <- function(node, continuation\
    \ = identity) {\n    repeat {\n        if (is.null(node$left) && is.null(node$right))\
    \ {\n            return(continuation(1))\n        }\n        new_continuation\
    \ <- function(continuation) {\n            force(continuation)\n            function(left_result)\
    \ {\n                size_of_tree(\n                    node$right,\n        \
    \            function(right_result) continuation(left_result + right_result +\
    \ 1)\n                )\n            }\n        }\n        # simulated recursive\
    \ call\n        node <- node$left\n        continuation <- new_continuation(continuation)\n\
    \    }\n}\n\nsize_of_tree(tree)\n```\n\n## [1] 5\n\nThere is a catch, though.\
    \ We avoid deep recursions to the left, but the continuation we create is going\
    \ to call functions just as deep as we would earlier do the recursion. The recursive\
    \ calls to the right are still function calls — we need a second continuation\
    \ there, and we cannot yet overwrite the left continuation. Furthermore, each\
    \ time we would usually call recursively, we are wrapping a function inside another,\
    \ and when these need to be evaluated, we still have a deep number of function\
    \ calls.\n\nIt is still possible to translate functions such as these into pure\
    \ loops, but it requires that *all* tail-calls (functions where we immediately\
    \ return their result) are optimized. Some programming languages implement this,\
    \ it is typical for all pure programming languages, but R does not.\n\nAnd it\
    \ is not easy to rewrite this to a looping function ourselves either, unfortunately.\n\
    \nHowever, there is a trick to get around this, using closures. It won't give\
    \ us the performance boost of using a loop instead of recursions, it will actually\
    \ be slightly slower, but it will let us write functions with more than one recursion\
    \ without having too deep recursive calls. If you have an algorithm where you\
    \ need recursion, or just where recursion gives you a simpler implementation,\
    \ and you don't desperately need high performance, you can use this general trick.\n\
    \n## Thunks and Trampolines\n\nThere are two pieces to the solution of too deep\
    \ recursions. The first is something called a \"thunk.\" It is simply a function\
    \ that takes no arguments and returns a value. It is used to wrap up a little\
    \ bit of computation that you can evaluate later. We can turn a function, with\
    \ its arguments, into a thunk like this:\n\n```\n# A function we can call directly\
    \ as e.g. f(1, 2)\nf <- function(x, y) x + y\n\n# thunk will call f(1, 2)\nthunk\
    \ <- \\( ) f(1, 2)\n\nf(1, 2)\n## [1] 3\n\nthunk()\n## [1] 3\n```\n\nWe wrap a\
    \ call to `f`, `f(1, 2)`, in a function that doesn't take any arguments, `\\(\
    \ ) f(1, 2)`, so without invoking f we have created a function, `thunk`, that\
    \ *if* we call it will evaluate `f(1, 2)`. It is a bit like the lazy evaluation\
    \ of function arguments.\n\nIf you are in an environment where `f` might bind\
    \ to other values later, you can go a bit further. You don't want `\\( ) f(1,\
    \ 2)` because that will call the current `f`, whatever that is, when you call\
    \ `thunk()`, but you can put `f` in an environment where it doesn't change with\
    \ something like this:\n\n```\nmake_thunk <- function(f, ...) {\n    # Make sure\
    \ the variables don't change after we return\n    force(f)\n    params <- list(...)\n\
    \    # Then return the thunk\n    \\( ) do.call(f, params)\n}\n\ng <- make_thunk(f,\
    \ 1, 2)\ng()\n```"
