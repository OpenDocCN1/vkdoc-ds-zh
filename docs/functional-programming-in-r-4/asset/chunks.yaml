    We didn’t have to name the function object the same in the global and local environments,
    but in this code, we use the variable g in both environments to refer to the same
    object.


    Usually, you can think of the local environment of a function call as disappearing
    when you return from a call because it is inaccessible after the function returns,
    but not in this case. The function we call g in the global environment has the
    f(2) call’s environment as its function environment, so the environment is still
    around, which is important if we now call g (from the global environment).


    Chapter 4 SCope and CloSureS


    ***Figure 4-10.** Defining g inside a call to f*


    ***Figure 4-11.** Returning g from a call to f*


