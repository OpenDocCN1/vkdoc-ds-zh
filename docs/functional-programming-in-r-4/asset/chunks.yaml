- fmt: "# [1] 3 4 5 6\n\nWhether you find this clever or too terse to be easily understood\
    \ is a matter of taste. It is clearly not as elegant as vector expressions, but\
    \ once you are familiar with what currying does, it is not difficult to parse\
    \ either.\n\nThat being said, I would prefer any day of the week, as I find this\
    \ version easier to read. But we will continue with currying a little bit further\
    \ to explore it. Notice, however, that all the different approaches are doing\
    \ the same thing: translating a binary `+` into a single function, by binding\
    \ the first argument.\n\n```\nmyapply(1:4, \\(y) 2 + y)\n## [1] 3 4 5 6\n```\n\
    \nThe function we wrote for currying only works on functions that take exactly\
    \ two arguments. We explicitly created a function that returns a function that\
    \ returns the final value, so the curried version has to work on functions with\
    \ two arguments. But functions are data that we can examine in R, so we can create\
    \ a general version that can handle functions of any number of arguments. We simply\
    \ need to know the number of arguments the function takes and then create a sequence\
    \ of functions for taking each parameter.\n\nThe full implementation is shown\
    \ as follows, and I will explain it in detail after the function listing:\n\n\
    ```\ncurry <- function(f) {\n  n <- length(formals(f))\n  if (n == 1) return(f)\
    \ # no currying needed\n  arguments <- vector(\"list\", length = n)\n  last <-\
    \ function(x) {\n    arguments[n] <<- x\n    do.call(f, arguments)\n  }\n  make_i\
    \ <- function(i, continuation) {\n    force(i) ; force(continuation)\n    function(x)\
    \ {\n      arguments[i] <<- x\n      continuation\n    }\n  }\n  continuation\
    \ <- last\n  for (i in seq(n-1, 1)) {\n    continuation <- make_i(i, continuation)\n\
    \  }\n  continuation\n}\n```\n\nFirst, we get the number of arguments that function\
    \ `f` takes: `n <- length(formals(f))`\n\nWe can get these arguments using the\
    \ `formals` function. It returns what is called a pair-list, which is essentially\
    \ a linked list similar to the one we saw in chapter 3 and is used internally\
    \ in R but not in actual R programming. You can treat it as a list, and it behaves\
    \ the same way except for some runtime performance differences. We just need to\
    \ know the length of the list.\n\nWe just return if `f` only takes a single argument.\
    \ Then it is already as curried as it can get. Otherwise, we create a table in\
    \ which we will store variables when the chain of functions is called:\n\n```\n\
    arguments <- vector(\"list\", length = n)\n```\n\nWe need to collect the arguments\
    \ that are passed to the individual functions we create. We cannot simply use\
    \ parameter arguments `x` and `y` as we did in `curry2` because we do not know\
    \ how many arguments we would need before we have examined the input function,\
    \ `f`. In any case, we would need to create names dynamically to make sure they\
    \ don’t clash. Just saving the arguments in a list is simpler, and since it is\
    \ a list, we can put any kind of values that are passed as arguments in it.\n\n\
    Now we need to create the actual function we should return. We do this in steps.\
    \ The final function we create should call `f` with all the arguments. It takes\
    \ the last argument as input, so we need to store that in `arguments` — and since\
    \ this means modifying a list outside of the scope of the actual function, we\
    \ need the `<<-` assignment operator for that. To call `f` with a list of its\
    \ arguments, we need to use the function `do.call`. It lets us specify the arguments\
    \ to the function in a list instead of giving them directly as comma-separated\
    \ arguments.\n\n```\nlast <- function(x) {\n  arguments[n] <<- x\n  do.call(f,\
    \ arguments)\n}\n```\n\nEach of the other functions needs to store an argument\
    \ as well, so they will need to know the corresponding index, and then they should\
    \ return the next function in the curried chain. We can create such functions\
    \ like this:\n\n```\nmake_i <- function(i, continuation) {\n  force(i) ; force(continuation)\n\
    \  function(x) {\n    arguments[i] <<- x\n    continuation\n  }\n}\n```\n\nThe\
    \ parameter `i` is the index, which we use to assign a value to an argument, and\
    \ the parameter `continuation` is the function that still remains to be called\
    \ before the final result can be returned from function `last`. It is the continuation\
    \ of the curried function. We need to evaluate both parameters inside `make_i`\
    \ before we return the function. Otherwise, we run into the lazy evaluation problem\
    \ where, when we eventually call the function, values of variables might have\
    \ changed since we created the function. We do this by calling `force` on the\
    \ arguments.\n\nWe now simply need to bind it all together. We do this in reverse\
    \ order, so we always have the continuation we need when we create the next function.\
    \ The first continuation is the `last` function. It is the last function that\
    \ should be called, and it will return the desired result of the entire curried\
    \ chain. Each call to `make_i` will return a new continuation that we provide\
    \ to the next function in the chain (in reverse order):\n\n```\ncontinuation <-\
    \ last\nfor (i in seq(n-1, 1)) {\n  continuation <- make_i(i, continuation)\n\
    }\n```\n\nThe final continuation we create is the curried function, so that is\
    \ what we return at the end of `curry`.\n\nNow we can use this `curry` function\
    \ to translate any function into a curried version:\n\n```\nf <- function(x, y,\
    \ z) x + 2*y + 3*z\nf(1, 2, 3)\n## [1] 14\ncurry(f)(1)(2)(3)\n## [1] 14\n```\n\
    \nIt is not quite the same semantics as calling `f` directly; we are evaluating\
    \ each expression when we assign it to the arguments table, so lazy evaluation\
    \ isn’t in play here. To write a function that can deal with the lazy evaluation\
    \ of the parameters requires a lot of mucking about with environments and expressions\
    \ that is beyond the scope of this book.\n\nAside from that, though, we have written\
    \ a general function for translating normal functions into their curried form.\n\
    \nIt is much harder to make a transformation in the other direction automatically.\
    \ If we get a function, we cannot see how many times we would need to call it\
    \ to get a value, if that is even independent of the parameters we give it, so\
    \ there is no way to figure out how many parameters we should get for the uncurried\
    \ version of a curried function.\n\nThe `curry` function isn’t completely general.\
    \ We cannot deal with default arguments — all arguments must be provided in the\
    \ curried version — and we cannot create a function where some arguments are fixed,\
    \ and others are not. The curried version always needs to take the arguments in\
    \ the exact order the original function takes them.\n\n## A Parameter Binding\
    \ Function\n\nWe already have all the tools we need to write a function that binds\
    \ a set of parameters for a function and return another function where we can\
    \ give the remaining parameters and get a value:\n\n```\nbind_parameters <- function(f,\
    \ ...) {\n  remembered <- list(...)\n  function(...) {\n    new <- list(...)\n\
    \    do.call(f, c(remembered, new))\n  }\n}\n```\n\n```\nf <- function(x, y, z,\
    \ w = 4) x + 2*y + 3*z + 4*w\nf(1, 2, 3, 4)\n## [1] 30\ng <- bind_parameters(f,\
    \ y = 2)\ng(x = 1, z = 3)\n## [1] 30\nh <- bind_parameters(f, y = 1, w = 1)\n\
    f(2, 1, 3, 1)\n## [1] 17\nh(x = 2, z = 3)\n```"
