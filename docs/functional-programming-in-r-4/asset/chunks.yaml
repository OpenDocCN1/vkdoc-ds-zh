    myapply(1:4, \(y) 2 + y)


    ## [1] 3 4 5 6


    The function we wrote for currying only works on functions that take exactly two
    arguments. We explicitly created a function that returns a function that returns
    the final value, so the curried version has to work on functions with two arguments.
    But functions are data that we can examine in R, so we can create a general version
    that can handle functions of any number of arguments. We simply need to know the
    number of arguments the function takes and then create a sequence of functions
    for taking each parameter.


    The full implementation is shown as follows, and I will explain it in detail after
    the function listing:


    curry <- **function**(f) {


    n <- length(formals(f))


    **if** (n == 1) return(f) *# no currying needed*


    arguments <- vector("list", length = n)


    Chapter 5 higher-Order FunCtiOns


    last <- **function**(x) {


    arguments[n] <<- x


    do.call(f, arguments)


    }


    make_i <- **function**(i, continuation) {


    force(i) ; force(continuation)


    **function**(x) {


    arguments[i] <<- x


    continuation


    }


    }


    continuation <- last


    **for** (i **in** seq(n-1, 1)) {


    continuation <- make_i(i, continuation)


    }


    continuation


    }


    First, we get the number of arguments that function f takes: n <- length(formals(f))


    We can get these arguments using the formals function. It returns what is called
    a pair-list, which is essentially a linked list similar to the one we saw in chapt[er
    3 and is us](https://doi.org/10.1007/978-1-4842-9487-1_3)ed internally in R but
    not in actual R


    programming. You can treat it as a list, and it behaves the same way except for
    some runtime performance differences. We just need to know the length of the list.


    We just return if f only takes a single argument. Then it is already as curried
    as it can get. Otherwise, we create a table in which we will store variables when
    the chain of functions is called:


    arguments <- vector("list", length = n)


    Chapter 5 higher-Order FunCtiOns


    • We need to collect the arguments that are passed to


    the individual functions we create. We cannot simply


    use parameter arguments x and y as we did in curry2


    because we do not know how many arguments we


    would need before we have examined the input


    function, f. In any case, we would need to create


    names dynamically to make sure they don’t clash. Just


    saving the arguments in a list is simpler, and since it is a list, we can put
    any kind of values that are passed as arguments in it.


    Now we need to create the actual function we should return. We do this in steps.
    The final function we create should call f with all the arguments. It takes the
    last argument as input, so we need to store that in arguments—and since this means
    modifying a list outside of the scope of the actual function, we need the <<-
    assignment operator for that. To call f with a list of its arguments, we need
    to use the function do.call. It lets us specify the arguments to the function
    in a list instead of giving them directly as comma-separated arguments.


    last <- **function**(x) {


    arguments[n] <<- x


    do.call(f, arguments)


    }


    Each of the other functions needs to store an argument as well, so they will need
    to know the corresponding index, and then they should return the next function
    in the curried chain. We can create such functions like this:


    make_i <- **function**(i, continuation) {


    force(i) ; force(continuation)


    Chapter 5 higher-Order FunCtiOns


    **function**(x) {


    arguments[i] <<- x


    continuation


    }


    }


