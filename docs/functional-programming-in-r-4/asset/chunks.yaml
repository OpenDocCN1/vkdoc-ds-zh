    \ `sapply` 可能存在风险：你无法预先知道输出类型，因此必须防御性编程，检查得到的是向量还是列表。\n\n`sapply(trees, size_of_tree)`\n\
    \n## `A` `C` `E`\n\n## 1 3 5\n\n`sapply(trees, identity)`\n\n## `A` `C` `E`\n\n\
    ## name \"A\" \"C\" \"E\"\n\n## left NULL list,3 list,3\n\n## right NULL list,3\
    \ list,3\n\n使用 `vapply` 时，如果结果可以转换为向量，你会得到与 `sapply` 相同的简化效果，但必须向函数告知输出应为何种类型。这通过提供一个期望输出的示例来实现。如果\
    \ `vapply` 无法将结果转换为该类型，你会得到错误而非不同类型的意外结果，这使得该函数在程序中使用更安全。毕竟，相比因类型混淆导致的意外结果，得到错误要好得多。\n\
    \n`vapply(trees, size_of_tree, 1)`\n\n## `A` `C` `E`\n\n## 1 3 5\n\n第 6 章 Filter、Map\
    \ 和 Reduce\n\n`lapply` 是与 `Map` 最相似的函数。它接受一个列表作为输入，并返回一个列表。`lapply` 与 `Map` 的主要区别在于，`lapply`\
    \ 始终作用于*单个*列表，而 `Map` 可以接受多个列表（这也解释了 `mapply` 的名称由来，`Map` 正是它的包装器）。\n\n`lapply(trees,\
    \ size_of_tree)`\n\n## $A\n\n## [1] 1\n\n##\n\n## $C\n\n## [1] 3\n\n##\n\n## $E\n\
    \n## [1] 5\n\n**apply 函数**\n\n`apply` 函数作用于矩阵和高维数组，而非序列。它接受三个参数，外加任何应传递给被调用函数的额外参数。\n\
    \n第一个参数是要映射的数组，第二个参数是应沿哪个维度（或多个维度）进行边缘化，第三个参数是要应用的函数。\n\n我们可以通过创建一个矩阵来观察其运行： \
    \ \n`(m <- matrix(1:6, nrow=2, byrow=TRUE))`\n\n## [,1] [,2] [,3]\n\n## [1,] 1\
    \ 2 3\n\n## [2,] 4 5 6\n\n第 6 章 Filter、Map 和 Reduce\n\n为了看清实际发生的情况，我们创建一个收集所接收数据的函数，以便准确看到它被调用时的参数：\
    \  \n`collaps_input <- **function**(x) paste(x, collapse = \":\")`  \n如果按行边缘化，它将对每一行调用，函数将接收整个行向量：\
    \  \n`apply(m, 1, collaps_input)`\n\n## [1] \"1:2:3\" \"4:5:6\"\n\n如果按列边缘化，它将对每一列调用，并生成三个字符串：\
    \  \n`apply(m, 2, collaps_input)`\n\n## [1] \"1:4\" \"2:5\" \"3:6\"\n\n如果同时按行和列边缘化，它将对每个元素单独调用：\
    \  \n`apply(m, c(1, 2), collaps input)`\n\n## [,1] [,2] [,3]\n\n## [1,] \"1\"\
    \ \"2\" \"3\"\n\n## [2,] \"4\" \"5\" \"6\"\n\n**tapply 函数**\n\n`tapply` 函数作用于所谓的“不规则表格”：即行长度可以不同的表格。你无法直接创建行维度大小不一的数组，但可以使用一个扁平向量，结合指示虚拟维度的因子。`tapply`\
    \ 根据因子对向量进行分组，然后对每组调用指定函数：\n\n第 6 章 Filter、Map 和 Reduce\n\n`(x <- rnorm(10))`\n\
    \n## [1] 1.58827631 -0.99044548 -1.56081835\n\n## [4] 0.38316964 1.82773685 -0.96031940\n\
    \n## [7] -1.32439441 0.09413377 -0.02306317\n\n## [10] -0.60627476\n\n`(categories\
    \ <- sample(c(\"A\", \"B\", \"C\"), size = 10, replace = TRUE))`\n\n## [1] \"\
    A\" \"A\" \"A\" \"B\" \"C\" \"A\" \"B\" \"A\" \"C\" \"A\"\n\n`tapply(x, categories,\
    \ mean)`\n\n## `A` `B` `C`\n\n## -0.4059080 -0.4706124 0.9023368\n\n你可以使用多个因子，只需将它们包装在列表中：\
    \  \n`(categories2 <- sample(c(\"X\", \"Y\"), size = 10, replace = TRUE))`\n\n\
    ## [1] \"X\" \"Y\" \"X\" \"Y\" \"Y\" \"X\" \"X\" \"Y\" \"Y\" \"X\"\n\n`tapply(x,\
    \ list(categories, categories2), mean)`\n\n## `X` `Y`\n\n## `A` -0.384784 -0.4481559\n\
    \n## `B` -1.324394 0.3831696"
  raw: '## "A" "(A,B)" "((A,B),D)"


    We can combine this with Filter to only get the trees that are not single leaves;
    here, we can use the size_of_tree function we wrote earlier: unlist(Map(print_tree,


    Filter(**function**(tree) size_of_tree(tree) > 1, trees)))


    ## C E


    ## "(A,B)" "((A,B),D)"


    Chapter 6 Filter, Map, and reduCe


    or we can get the size of all trees and compute their sum by combining Map with
    Reduce:


    unlist(Map(size_of_tree, trees))


    ## A C E


    ## 1 3 5


    Reduce(`+`, Map(size_of_tree, trees), 0)


    ## [1] 9


    We can also search for the node depth of a specific node and, for example, get
    the depth of “B” in all the trees:


    node_depth_B <- **function**(tree) node_depth(tree, "B") unlist(Map(node_depth_B,
    trees))


    ## A C E


    ## NA 1 2


    The names we get in the result are just confusing. They refer to the names we
    gave the trees when we constructed the list, and we can get rid of them by using
    the parameter use.names in unlist. In general, if you don’t need the names of
    a vector, you should always do this; it speeds up computations when R doesn’t
    have to drag names along with the data you are working on.


    unlist(Map(node_depth_B, trees), use.names = FALSE)


    ## [1] NA 1 2


    For trees that do not have a “B” node, we get NA when we search for the node depth,
    and we can easily remove those using Filter: Filter(**function**(x) !is.na(x),


    unlist(Map(node_depth_B, trees), use.names = FALSE))


    ## [1] 1 2


    Chapter 6 Filter, Map, and reduCe


    or we can explicitly check if a tree has node “B” before we Map over the trees:


    has_B <- **function**(node) {


    **if** (node$name == "B") return(TRUE)


    **if** (is.null(node$left) && is.null(node$right)) return(FALSE) has_B(node$left)
    || has_B(node$right)


    }


    unlist(Map(node_depth_B, Filter(has_B, trees)), use.names = FALSE)


    ## [1] 1 2


    The solution with filtering after mapping is probably preferable since we do not
    have to remember to match the has_B with node_depth_B if we replace them with
    general functions that handle arbitrary node names, but either solution will work.


    **The Apply Family of Functions**


    The Map function is a general solution for mapping over elements in a list, but
    R has a whole family of Map-like functions that operate on different types of
    input. These are all named “something”-apply, and we have already seen sapply
    in the previous chapter. The Map function is actually just a wrapper around one
    of these, the function mapply, and since we have already seen Map in use, I will
    not also discuss mapply, but I will give you a brief overview of the other functions
    in the apply family.


    **sapply, vapply, and lapply**


    The functions sapply, vapply, and lapply all operate on sequences. The difference
    is that sapply tries to *simplify* its output, vapply takes a value as an argument
    and will coerce its output to have the type of this value and give an error if
    it cannot, and lapply maps over lists.


    Chapter 6 Filter, Map, and reduCe


    Using sapply is convenient for interactive sessions since it essentially works
    like Map combined with unlist when the result of a map can be converted into a
    vector. Unlike unlist, it will not flatten a list, so if a map’s result is more
    complex than a vector, sapply will still give you a list as its result. Because
    of this, sapply can be dangerous to use in a program. You don’t necessarily know
    which type the output will have, so you have to program defensively and check
    if you get a vector or a list.


    sapply(trees, size_of_tree)


    ## A C E


    ## 1 3 5


    sapply(trees, identity)


    ## A C E


    ## name "A" "C" "E"


    ## left NULL list,3 list,3


    ## right NULL list,3 list,3


    Using vapply, you get the same simplification as using sapply if the result can
    be transformed into a vector, but you have to tell the function what type the
    output should have. You do this by giving it an example of the desired output.
    If vapply cannot translate the result into that type, you get an error instead
    of a type of a different type, making the function safer to use in programs. After
    all, getting errors is better than unexpected results due to type confusion.


    vapply(trees, size_of_tree, 1)


    ## A C E


    ## 1 3 5


    Chapter 6 Filter, Map, and reduCe


    The lapply is the function most similar to Map. It takes a list as input and returns
    a list. The main difference between lapply and Map is that lapply always operates
    on a *single* list, while Map can take multiple lists (which explains the name
    of mapply, the function that Map is a wrapper for).


    lapply(trees, size_of_tree)


    ## $A


    ## [1] 1


    ##


    ## $C


    ## [1] 3


    ##


    ## $E


    ## [1] 5


    **The apply Function**


    The apply function works on matrices and higher-dimensional arrays instead of
    sequences. It takes three parameters plus any additional parameters that should
    just be passed along to the function called.


    The first parameter is the array to map over, the second is which dimension(s)
    we should marginalize along, and the third is the function we should apply.


    We can see it in action by creating a matrix to apply over: (m <- matrix(1:6,
    nrow=2, byrow=TRUE))


    ## [,1] [,2] [,3]


    ## [1,] 1 2 3


    ## [2,] 4 5 6


    Chapter 6 Filter, Map, and reduCe


    To see what is actually happening, we will create a function that collects the
    data that it gets, so we can see exactly what it is called with: collaps_input
    <- **function**(x) paste(x, collapse = ":") If we marginalize on rows, it will
    be called on each of the two rows, and the function will be called with the entire
    row vectors: apply(m, 1, collaps_input)


    ## [1] "1:2:3" "4:5:6"


    If we marginalize on columns, it will be called on each of the three columns and
    produce tree strings:


    apply(m, 2, collaps_input)


    ## [1] "1:4" "2:5" "3:6"


    If we marginalize on both rows and columns, it will be called on every single
    element instead:


    apply(m, c(1, 2), collaps input)


    ## [,1] [,2] [,3]


    ## [1,] "1" "2" "3"


    ## [2,] "4" "5" "6"


    **The tapply Function**


    The tapply function works on so-called ragged tables: tables where the rows can
    have different lengths. You cannot directly make an array with different sizes
    of dimensions in rows, but you can use a flat vector combined with factors that
    indicate which virtual dimensions you are using. The tapply function groups the
    vector according to a factor and then calls its function with each group:


    Chapter 6 Filter, Map, and reduCe


    (x <- rnorm(10))


    ## [1] 1.58827631 -0.99044548 -1.56081835


    ## [4] 0.38316964 1.82773685 -0.96031940


    ## [7] -1.32439441 0.09413377 -0.02306317


    ## [10] -0.60627476


    (categories <- sample(c("A", "B", "C"), size = 10, replace


    = TRUE))


    ## [1] "A" "A" "A" "B" "C" "A" "B" "A" "C" "A"


    tapply(x, categories, mean)


    ## A B C


    ## -0.4059080 - 0.4706124 0.9023368


    You can use more than one factor if you wrap the factors in a list: (categories2
    <- sample(c("X", "Y"), size = 10, replace = TRUE))


    ## [1] "X" "Y" "X" "Y" "Y" "X" "X" "Y" "Y" "X"


    tapply(x, list(categories, categories2), mean)


    ## X Y


    ## A -0.384784 -0.4481559


    ## B -1.324394 0.3831696'
