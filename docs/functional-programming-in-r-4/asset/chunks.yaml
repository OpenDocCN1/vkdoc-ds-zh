  trans: "\n# [1] \"(C,D)\"\n\n替换函数看起来像是在修改数据，但实际上并非如此。它们只是将值重新赋值给变量。\n\n## 纯函数式编程\n\
    \n“纯”函数是一种行为与数学函数类似的函数：它将一个空间的值映射到另一个空间，相同的值总是映射到相同的结果，并且数学函数中没有“副作用”这种东西。\n\n\
    编程语言为确保函数纯正所采取的程度各不相同，而 R 语言在这方面做得非常有限。由于值是不可变的，你对函数可能产生的副作用有一定保证，但并不多。函数可以修改其作用域之外的变量，例如修改全局变量。它们可以打印或绘图，并以这种方式改变\
    \ R 进程的状态。它们还可以抽取随机数并用其进行计算，从而在某种意义上使函数的结果变得不确定，因此相同的值并不总是映射到相同的结果。\n\n纯函数之所以可取，是因为它们更容易推理。如果一个函数没有任何副作用，你就可以将其视为一个仅在值之间进行映射的黑箱。如果它有副作用，你还需要了解它如何修改程序的其他部分，这意味着你至少要在某种程度上理解函数体在做什么。如果你只需要知道一个函数如何将输入参数映射到结果，你可以在任何时候更改其实现，而不会破坏任何依赖该函数的代码。\n\
    \n© Thomas Mailund 2023\n\nT. Mailund，《R 4 函数式编程》，<https://doi.org/10.1007/978-1-4842-9487-1_3>\n\
    \n### 非确定性函数\n\n对于相同输入，结果并非总是相同的函数未必难以推理。但如果它们的结果依赖于随机数，那么测试和调试起来就会更困难。\n\n由于纯函数更容易推理和测试，你应尽可能多地使用纯函数来编写程序。你未必能用纯函数编写*所有*程序。有时你需要随机性来实现蒙特卡洛方法，或者需要函数产生输出。但如果你用纯函数编写了大部分程序，并且知道不纯函数所在的位置，那么你就编写出了更好、更健壮的程序。\n\
    \n### 编写纯函数\n\n要保证你编写的函数是纯的，相关工作并不多。你应该避免抽样随机数，并且避免修改函数作用域之外的变量。\n\n避免抽样随机数是轻而易举的。不要直接或通过其他函数调用任何执行此操作的函数。如果一个函数只调用确定性函数，并且自身不引入任何随机性，那么该函数就是确定性的。\n\
    \n保证你不修改函数作用域之外的任何内容，这一点稍微不那么简单。你需要一个特殊的函数 `<<-` 来修改函数局部作用域之外的变量（我们将在下一章讨论这个运算符），所以请避免使用它。这样所有赋值都将针对局部变量，你也就无法修改其他作用域中的变量。如果你避免使用这个运算符，那么修改作用域之外函数的唯一风险就是通过惰性求值。还记得上一章中我们创建了一个函数列表的例子吗？这些函数包含未求值的表达式，这些表达式的值依赖于我们在求值表达式之前正在更改的变量。\n\
    \n严格来说，如果我们返回的函数包含依赖于局部变量的这种未求值表达式，我们仍然拥有一个纯函数。甚至我们要返回的函数本身也是纯的。它们会引用第一个函数中的局部变量，一旦第一个函数返回，如果没有\
    \ `<<-` 运算符，这些变量就无法更改。只是它们未必是你想要返回的函数。\n\n虽然根据严格定义，这样的函数是纯的，但它们确实存在一个问题：我们返回的函数依赖于第一个函数内部局部变量的状态。从编程的角度来看，如果这些函数难以推理，那么它们是纯的这个事实对我们帮助不大；在这种情况下，我们需要知道改变第一个函数的状态如何影响其他函数的功能。\n\
    \n避免函数依赖于其自身作用域之外的变量（即既不是参数也不是局部变量的变量）的一个解决方案是，永远不改变变量所引用的内容。那些保证函数纯正的编程语言强制执行这一点。那里根本没有修改变量值的方法。你可以定义常量，但不存在变量这种东西。由于\
    \ R 语言确实有变量，如果你想以这种方式保证函数的纯正，就必须避免多次给同一个变量赋值。\n\n在一个长函数中，即使你从未打算改变变量的值，也非常容易意外地重复使用变量名。保持函数简短精炼可以在一定程度上缓解这个问题，但无法保证这种情况不会发生。唯一迫使我们改变变量的控制结构是\
    \ `for` 循环。编写 `for` 循环时，你不可能不设置一个循环变量。\n\n现在，`for` 循环在 R 语言中名声不佳，许多人会告诉你避免使用它们，因为它们很慢。事实并非如此。与更底层语言中的循环相比，它们确实较慢，但这与它们是循环无关。因为\
    \ R 是一种非常动态的语言，你所做的每件事都涉及调用函数，而这些函数随时可能因为某人重定义变量而发生变化，所以 R 代码通常都很慢。当你调用像 `sum`\
    \ 或 `mean` 这样的内置函数时，它们很快，因为是用 C 语言实现的。通过使用向量化表达式和内置函数，你可以避免动态性带来的性能惩罚。但如果你在 R\
    \ 中自己编写循环，就会受到这种惩罚。然而，如果你使用人们推荐替代循环的其他构造（我们将在第 [6](https://doi.org/10.1007/978-1-4842-9487-1_6)\
    \ 章讨论这些构造），你会付出相同的代价。\n\n你应该使用这些其他构造的真正原因在于，它们能使代码背后的意图比循环更清晰（至少在你熟悉函数式编程之后是这样的），并且避免了可能引发问题的循环变量。人们通常发现自己的循环效率低下的原因在于，很容易写出“修改”数据的循环，从而迫使\
    \ R 制作副本。仅仅避免循环并不能解决这个问题，我们将在本章稍后部分再次讨论这一点。\n\n### 递归作为循环\n\n函数式编程语言避免循环的方式是改用递归。任何可以用循环编写的内容，你也可以用递归函数调用来编写，本章的大部分内容将侧重于让你习惯以递归函数的方式进行思考。\n\
    \n将问题视为递归不仅仅是一种避免循环的编程技巧。它通常是一种将问题分解为更易于解决的简单子问题的方法。当你需要处理一个问题时，你可以首先考虑是否存在容易解决的基准情形。\n\
    \n如果我们要在一个序列中搜索某个元素，当序列为空时，判断该元素是否存在是微不足道的：显然它不存在。现在，如果序列不为空，我们面临一个更难的问题，但我们可以将其分解为两个更小的问题。我们要搜索的元素是否是序列的第一个元素？如果是，则该元素存在。如果第一个元素不等于我们要搜索的元素，那么它只有在序列的剩余部分中才可能存在。\n\
