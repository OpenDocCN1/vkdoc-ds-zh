    \ Closures\n\n**Figure 4-10.** Defining `g` inside a call to `f`\n\n**Figure 4-11.**\
    \ Returning `g` from a call to `f`\n\n## Chapter 4 Scope and Closures\n\n**Figure\
    \ 4-12.** Calling `g`\n\n```r\ng(3)\n## [1] 5\n```\n\nLet’s see what happens in\
