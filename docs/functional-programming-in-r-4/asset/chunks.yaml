    do with functions working on functions.


    The function sapply, which we saw in the last chapter, lets you call a function
    for all elements in a list or vector. You should mainly use this for interactive
    in R because it is a little unsafe. It tries to guess at which type of output
    you want, based on what the input and the function you give it does, and there
    are safer alternatives, vapply and lapply, where the output is always a predefined
    type or always a list, respectively.


    In any case, if you want to evaluate a function for all elements in a vector,
    you can write code like this:


    sapply(1:4, sqrt)


    ## [1] 1.000000 1.414214 1.732051 2.000000


    © Thomas Mailund 2023


    T. Mailund, *Functional Programming in R 4*, [https://doi.org/10.1007/978-1-4842-9487-1_5](https://doi.org/10.1007/978-1-4842-9487-1_5#DOI)


    Chapter 5 higher-Order FunCtiOns


    This evaluates sqrt on all the elements in the vector 1:4 and gives you the result.
    It is an analog to the vectorized expression, and the vectorized version is probably
    always preferable if your expressions can be vectorized.


    The vector expression is easier to read and usually much faster if it involves
    calling built-in functions:


    sqrt(1:4)


    You can use sapply to evaluate a function on all elements in a sequence when the
    function you want to call is not vectorized, however, and in fact, the Vectorize
    function we saw in the first chapter is implemented using sapply’s cousin, lapply.


    We could implement our own version like this:


    myapply <- **function**(x, f) {


    result <- x


    **for** (i **in** seq_along(x))


    result[i] <- f(x[i])


    result


    }


    myapply(1:4, sqrt)


    ## [1] 1.000000 1.414214 1.732051 2.000000


    Here, I create a result vector of the right length just by copying x. The assignments
    into this vector might create copies. The first is guaranteed to because we are
    changing a vector, which R avoids by making a copy. Later assignments might do
    it again to convert the type of the results. Still, it is reasonably simple to
    see how it works, and if the input and output have the same type, it is running
    in linear time (in the number of function calls to f which of course can have
    any runtime complexity).


    Chapter 5 higher-Order FunCtiOns


    Using a function like sapply or myapply, or any of their cousins, lets us replace
    with a single function call a loop, where all kinds of nastiness can happen with
    assignments to local variables that we do not necessarily want. We just need to
    wrap the body of the loop in another function we can give to the apply function.


    Closures can be particularly useful in combination with apply functions if we
    need to pass some information along to the function. Let us, for example, consider
    a situation where we want to scale the element in a vector. We wrote such a function
    in the first chapter: rescale <- **function**(x) {


    m <- mean(x)


    s <- sd(x)


    (x - m) / s


    }


    rescale(1:4)


    ## [1] -1.1618950 -0.3872983 0.3872983 1.1618950


    This was written using vector expressions, which is the right thing to do, but
    let us see what we can do with an apply function. Obviously, we still need to
    compute m and s and then a function for computing (x - m) / s: rescale <- **function**(x)
    {


    m <- mean(x)


    s <- sd(x)


    f <- **function**(y) (y - m) / s


    myapply(x, f)


    }


    rescale(1:4)


    ## [1] -1.1618950 -0.3872983 0.3872983 1.1618950


    There is really no need to give the function a name and then pass it along; we
    can also just write


    Chapter 5 higher-Order FunCtiOns


    rescale <- **function**(x) {


    m <- mean(x)


    s <- sd(x)


    myapply(x, \(y) (y - m) / s)


    }


    rescale(1:4)


    ## [1] -1.1618950 -0.3872983 0.3872983 1.1618950


    The function we pass to myapply, \(y) ..., knows the environment in which it was
    created, so it knows m and s and can use these variables when it is being called
    from myapply.


    **Currying**


    It is not unusual to have a function of two arguments where you want to bind one
    of them and return a function that takes, as a parameter, the second argument.
    For example, if we want to use the function f <- **function**(x, y) x + y


    we might want to use it to add 2 to each element in a sequence using myapply.
    Once again, I stress that this example is just to show you a general technique,
    and you should never do these things when you can solve a problem with vector
    expressions. Still, let us for a second pretend that we don’t have vector expressions.
    Then we would need to create a function for one of the parameters, say y, and
    then when called evaluate f(2,y).


    We could write it like this, obviously:


    g <- **function**(y) f(2, y)


    Chapter 5 higher-Order FunCtiOns


    myapply(1:4, g)


    ## [1] 3 4 5 6


    or shorter as


    myapply(1:4, \(y) f(2, y))


    ## [1] 3 4 5 6


    which would suffice if we only ever needed to add 2 to all elements in a sequence.
    If we wanted a more general solution, we would want a function to create the function
    we need, a closure that remembers x and can be called with y. Such a function
    is only slightly more complicated to write; we simply need a function that returns
    a function like this: h <- **function**(x) \(y) f(x, y)


    myapply(1:4, h(2))


    ## [1] 3 4 5 6


    The functions f and h eventually do the same thing, the only difference is in
    how we provide parameters to them. Function f needs both parameters at once, while
    function h takes one parameter at a time: f(2, 2)


    ## [1] 4


    h(2)(2)


    ## [1] 4


    A function such as h, one that takes a sequence of parameters not in a single
    function call but through a sequence of function calls, each taking a single parameter
    and returning a new function, is known as a *curried* 97


    Chapter 5 higher-Order FunCtiOns


    function. What we did to transform f into h is called *currying* f. The names
    refer to the logician Haskell Curry, from whom we also get the name of the functional
    programming language Haskell.


    The transformation we did from f to h was manual, but we can write functions that
    transform functions: functions that take a function as input and return another
    function. We can thus write a general function for currying a function—another
    high-level function. A function for currying functions of two parameters can be
    written like this:


    curry2 <- **function**(f) \(x) \(y) f(x, y)


    The argument f is the function we want to curry, and the return value is the function


    \(x) \(y) f(x, y)


    that needs to be called first with parameter x and then with parameter y, and
    then it will return the value f(x, y). The names of the variables do not matter
    here, they are just names and need not have anything to do with the names of the
    variables that f actually takes.


    Using this function, we can automatically create h from f: h <- curry2(f)


    f(2, 3)


    ## [1] 5


    h(2)(3)


    ## [1] 5


    Since + is just a function in R, we can also simply use *it* instead of writing
    the function f first:


    h <- curry2(`+`)


    h(2)(3)


    Chapter 5 higher-Order FunCtiOns


    ## [1] 5


    and thus write the code that adds 2 to all elements in a sequence like this: myapply(1:4,
    curry2(`+`)(2))'
