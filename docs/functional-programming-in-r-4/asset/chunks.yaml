  trans: "\n## 1. 4\n\n然而，这*并不*意味着所有表达式都在函数的作用域内求值。我们将在[第 4 章，b](https://doi.org/10.1007/978-1-4842-9487-1_4)中讨论作用域，但现在，你可以将其视为两个作用域：全局变量所在的全局作用域，以及包含参数和局部变量的函数作用域。\n\
    \n如果你像这样调用一个函数：\n\n`f(a = 2, b = a)`\n\n并且期望 `b` 在函数内部与 `a` 相同，那么你会得到一个错误。\n\n\
    如果幸运的话，当没有名为 `a` 的全局变量时，你会得到一个运行时错误。如果不幸，恰好*存在*一个名为 `a` 的全局变量，那么 `b` 就会被赋值为该值；而如果你期望它被设为\
    \ `2`，你的代码就会给出错误的结果。\n\n不过，默认参数可以是使用其他函数参数的表达式，这是安全的。默认参数在函数被调用后才求值，此时它们可以访问其他参数。然而，在调用函数时使用的表达式，无法看到函数内部的局部变量，只能看到调用作用域中的变量。\n\
    \n### 第 2 章 R 语言中的函数\n\n**图 2-2.** 参数与默认参数的求值位置 请参考图 2-2。我们有一个函数 `f`，它接受两个参数 `a`\
    \ 和 `b`，其中 `b` 的默认值为 `2*a`。如果我们以 `f(2*a, b = 2*a)` 的形式调用它，那么两个参数都是表达式，R 会知道它们必须在全局作用域中求值，此时\
    \ `a` 是列表 `1 2 3 4 5`，并且没有 `b`。在我们查看参数之前，这两个参数都不会被求值；但当我们查看时，两者都会被求值，并且由于它们都是\
    \ `2*a` 且 `a` 指向全局变量 `a`，因此得到相同的值。然而，如果我们以 `f(2*a)` 的形式调用 `f`，从而使 `b` 使用默认值，情况就不同了。在函数调用内部，`a`\
    \ 仍然指向需要在全局作用域中求值的表达式 `2*a`，但 `b`（同样指向表达式 `2*a`）将在*局部*作用域中求值。因此，如果我们对 `b` 求值，我们首先会求值参数\
    \ `a` 得到 `2*a`（使用全局变量 `a` 求值）`2 4 6 8 10`，然后使用这个局部变量 `a` 求值 `2*a`，得到 `4 8 12 16\
    \ 20`。\n\n所以，尽管调用函数时参数尚未求值，但当你访问它们时就会被求值。如果是默认参数，则在函数内部求值；如果是在函数调用中提供的参数，则在调用处（函数被调用的地方）外部求值。\n\
    \n### 第 2 章 R 语言中的函数\n\n这也意味着，你不能仅仅通过更改局部变量来改变表达式的求值结果：\n\n```\na <- 4\nf <- function(x)\
    \ {\n  a <- 2\n  x\n}\nf(1 + a)\n## [1] 5\n```\n\n在这个例子中，表达式 `1 + a` 在 `f` 内部求值，但表达式中的\
    \ `a` 是 `f` 外部的 `a`，而不是 `f` 内部的局部变量 `a`。\n\n这当然是符合预期的。如果表达式真的在函数的作用域内求值，那么当你用一个表达式调用函数时，你将完全无法预知其求值结果，因为它会取决于函数可能使用的任何局部变量。\n\
    \n由于表达式在调用作用域而非函数作用域中求值，因此你通常不会注意到传值调用（call-by-value）与传承诺调用（call-by-promise）之间的区别。不过，在某些情况下，如果你不小心，这种区别可能会带来麻烦。\n\
    \n举个例子，我们可以考虑这个函数：\n\n`f <- function(a) function(b) a + b`\n\n如果你不习惯，这看起来可能有点奇怪，但它是一个返回另一个函数的函数。在后续章节中，我们会看到很多这类函数的例子。\n\
    \n当我们用参数 `a` 调用 `f` 时，我们会得到一个将 `a` 加到其参数上的函数：\n\n```\nf(2)(2)\n## [1] 4\n```\n\
    \n### 第 2 章 R 语言中的函数\n\n我们可以基于这个 `f` 创建一个函数列表：\n\n```\nff <- vector(\"list\",\
    \ 4)\nfor (i in 1:4) {\n  ff[[i]] <- f(i)\n}\nff\n## [[1]]\n## function(b) a +\
    \ b\n## <bytecode: 0x7fe446ad68a8>\n## <environment: 0x7fe446a07ca0>\n##\n## [[2]]\n\
    ## function(b) a + b\n## <bytecode: 0x7fe446ad68a8>\n## <environment: 0x7fe446ad71e8>\n\
    ##\n## [[3]]\n## function(b) a + b\n## <bytecode: 0x7fe446ad68a8>\n## <environment:\
    \ 0x7fe446ad7098>\n##\n## [[4]]\n## function(b) a + b\n## <bytecode: 0x7fe446ad68a8>\n\
    ## <environment: 0x7fe446ad6f48>\n```\n\n这里，`ff` 包含了四个函数，它们的意图是：第一个函数对其参数加 `1`，第二个加\
    \ `2`，以此类推。\n\n### 第 2 章 R 语言中的函数\n\n然而，当我们调用 `ff` 中的函数时，奇怪的事情发生了：\n\n```\nff[[1]](1)\n\
    ## [1] 5\n```\n\n当我们获取元素 `ff[[1]]` 时，得到的是我们在循环中创建的第一个函数。如果我们将调用 `f` 时传入的值代入，它应该是\
    \ `function(b) i + b`。\n\n`f` 的参数 `a` 已被设为我们传入的参数 `i`，但此时 `i` 尚未被求值！\n\n当我们调用这个函数时，表达式在全局作用域中被求值，而此时的\
    \ `i` 值为 `4`，因为这是它在循环中被赋予的最后一个值。我们创建函数时 `i` 的值是 `1`，但表达式实际被求值时它变成了 `5`。\n\n这也意味着，我们可以在求值某个函数之前更改\
    \ `i` 的值，这会使其与我们在创建函数时预期的值不同：\n\n```\ni <- 1\nff[[2]](1)\n## [1] 2\n```\n\n这种惰性求值只在第一次调用函数时生效。如果我们再次更改\
    \ `i` 并调用该函数，得到的值与第一次求值时相同：\n\n```\ni <- 2\nff[[2]](1)\n## [1] 2\n```\n\n### 第\
    \ 2 章 R 语言中的函数\n\n我们可以通过循环遍历这些函数并求值来看到这一效果：\n\n```\nresults <- vector(\"numeric\"\
    , 4)\nfor (i in 1:4) {\n  results[i] <- ff[[i]](1)\n}\nresults\n## [1] 5 2 4 5\n\
    ```\n\n我们已经对前两个函数求过值了，因此它们被固定在了第一次求值时的结果。另外两个函数得到了预期的功能，但仅仅是因为我们在求值函数的循环中设置了变量\
    \ `i`。如果我们使用了不同的循环变量，就不会这么幸运了。\n\n这个问题源于函数包含一个未求值的表达式，且该表达式依赖于外部作用域中的变量。不过，如果你想利用函数式语言的优势，返回函数的函数并不罕见。这也是允许变量改变值的后果——出于类似原因，大多数函数式编程语言都不允许变量改变值。然而，仅仅通过避免\
    \ `for` 循环，你并不能完全避免这个问题。如果你调用的函数为你进行了循环，你未必能控制它们如何执行，最终可能陷入同样的境地。\n\n避免问题的方法是强制对参数进行求值。一旦你对其求值，它就会记住该值，问题就不复存在了。\n\
    \n你可以通过将参数写成一个单独的语句来实现这一点。\n\n这样会对它求值。不过，最好使用 `force` 函数，以明确表明你正在这样做。它实际上只是将表达式返回给你，因此其效果与直接写参数完全相同，但代码能更清楚地表明你为何这样做。\n\
    \n### 第 2 章 R 语言中的函数\n\n如果你这样做，问题就消失了：\n\n```\nf <- function(a) {\n  force(a)\n\
    \  function(b) a + b\n}\nff <- vector(\"list\", 4)\nfor (i in 1:4) {\n  ff[[i]]\
    \ <- f(i)\n}\nff[[1]](1)\n## [1] 2\ni <- 1\nff[[2]](1)\n```\n"
- fmt: "# [1] 3\n\n## Functions Don’t Have Names\n\nThe last thing I want to stress\
    \ when we talk about defining functions is that functions do not have names. Variables\
    \ have names, and variables can refer to functions, but these are two separate\
    \ things.\n\nIn many languages, such as Java, Python, or C++, you define a function,\
    \ and at the same time, you give it an argument. When possible at all, you need\
    \ a special syntax to define a function without a name.\n\nNot so in R. In R,\
    \ functions do not have names, and when you define them, you are not giving them\
    \ a name. We have given names to all the functions we have used earlier by assigning\
    \ them to variables right where we defined them. We didn’t have to. It is the\
    \ `function(...) ...` syntax that defines a function. We are defining a function\
    \ whether we assign it to a variable or not.\n\n### Chapter 2 Functions in R\n\
    \nWe can define a function and call it immediately like this: `(function(x) x^2)(2)`\n\
    \n## [1] 4\n\nWe would never do this, of course. Anywhere we would want to define\
    \ an anonymous function and immediately call it, we could instead just put the\
    \ body of the function. Functions we want to reuse we *have* to give a name so\
    \ we can get to them again.\n\nThe syntax for defining functions, however, doesn’t\
    \ force us to give them names. When you start to write higher-order functions,\
    \ that is, functions that take other functions as input or return functions, this\
    \ is convenient.\n\nSuch higher-order functions are an important part of functional\
    \ programming, and we will see much of them later in the book.\n\n## Vectorized\
    \ Functions\n\nExpressions in R are vectorized. When you write an expression,\
    \ it is implicitly working on vectors of values, not single values. Even simple\
    \ expressions that only involve numbers really are vector operations. They are\
    \ just vectors of length 1.\n\nFor longer vectors, expressions work component-wise.\
    \ So if you have vectors `x` and `y`, you can subtract the first from the second\
    \ component-wise just by writing `x - y`:\n\n```\nx <- 1:5\ny <- 6:10\nx - y\n\
    ```\n\n## [1] -5 -5 -5 -5 -5\n\nIf the vectors are not of the same length, the\
    \ shorter vector is just repeated as many times as is necessary. This is why you\
    \ can, for example, multiply a number to a vector:\n\n```\n2 * x\n```\n\n## [1]\
    \ 2 4 6 8 10\n\nHere, `2` is a vector of length 1 and `x` a vector of length 5,\
    \ and `2` is just repeated five times. You will get a warning if the length of\
    \ the longer vector is not divisible by the length of the shorter vector, and\
    \ you generally want to avoid this. The semantic is the same, though: R just keeps\
    \ repeating the shorter vector as many times as needed.\n\n```\nx <- 1:6\ny <-\
    \ 1:3\nx - y\n```\n\n## [1] 0 0 0 3 3 3\n\nDepending on how a function is written,\
    \ it can also be used in vectorized expressions. R is happy to use the result\
    \ of a function call in a vector expression as long as this result is a vector.\
    \ This is not quite the same as the function operating component-wise on vectors.\
    \ Such functions we can call *vectorized* functions.\n\nMost mathematical functions\
    \ such as `sqrt`, `log`, `cos`, and `sin` are vectorized, and you can use them\
    \ in expressions:\n\n```\nlog(1:3) - sqrt(1:3)\n```\n\n## [1] -1.0000000 -0.7210664\
    \ -0.6334385\n\nFunctions you write yourself will also be vectorized if their\
    \ body consists only of vectorized expressions:\n\n```\nf <- function(a, b) log(a)\
    \ - sqrt(b)\nf(1:3, 1:3)\n```\n\n## [1] -1.0000000 -0.7210664 -0.6334385\n\nThe\
    \ very first function we wrote in this book, `square`, was also a vectorized function.\
    \ The function `scale` was also, although the functions it used, `mean` and `sd`,\
    \ are not; they take vector input but return a summary of the entire vector and\
    \ do not operate on the vector component-wise.\n\nA function that uses control\
    \ structures usually will not be vectorized.\n\nWe can write a comparison function\
    \ that returns -1 if the first argument is smaller than the second and 1 if the\
    \ second is larger than the first, and zero otherwise like this:\n\n```\ncompare\
    \ <- function(x, y) {\n  if (x < y) {\n    -1\n  } else if (y < x) {\n    1\n\
    \  } else {\n    0\n  }\n}\n```\n\nThis function will work fine on single values\
    \ but not on vectors. The problem is that the `if`-expression only looks at the\
    \ first element in the logical vector `x < y`. (Yes, `x < y` is a vector because\
    \ `<` is a vectorized function.)\n\nTo handle if-expressions, we can get around\
    \ this problem by using the `ifelse` function. This is a vectorized function that\
    \ behaves just as an if-else expression:\n\n```\ncompare <- function(x, y) {\n\
    \  ifelse(x < y, -1, ifelse(y < x, 1, 0))\n}\ncompare(1:6, 1:3)\n```\n\n## [1]\
    \ 0 0 0 1 1 1\n\nThe situation is not always so simple that we can replace if-statements\
    \ with `ifelse`. In most cases, we can, but when we cannot, we can instead use\
    \ the function `Vectorize`. This function takes a function that can operate on\
    \ single values and translate it into a function that can work component-wise\
    \ on vectors.\n\nAs an example, we can take the `compare` function from before\
    \ and vectorize it:\n\n```\ncompare <- function(x, y) {\n  if (x < y) {\n    -1\n\
    \  } else if (y < x) {\n    1\n  } else {\n    0\n  }\n}\ncompare <- Vectorize(compare)\n\
    compare(1:6, 1:3)\n```\n\n## [1] 0 0 0 1 1 1\n\nBy default, `Vectorize` will vectorize\
    \ on all parameters of a function. As an example, imagine that we want a scale\
    \ function that doesn’t scale all variables in a vector by the same vector’s mean\
    \ and standard deviation but use the mean and standard deviation of another vector:\n\
    \n```\nScale_with <- function(x, y) {\n  (x - mean(y)) / sd(y)\n}\n```\n\nThis\
    \ function is already vectorized on its first parameter since it just consists\
    \ of a vectorized expression, but if we use `Vectorize` on it, we break it:\n\n\
    ```\nscale_with(1:6, 1:3)\n```\n\n## [1] -1 0 1 2 3 4\n\n```\nscale_with <- Vectorize(scale_with)\n\
