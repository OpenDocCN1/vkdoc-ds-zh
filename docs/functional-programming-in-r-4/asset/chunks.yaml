    \ but it is a function that is harder to vectorize than the `scale_with` function.\
    \ As it is, it works well for single names:\n\n```\nnode_depth(tree, \"D\")\n\
    ```\n\n## [1] 1\n\n```\nnode_depth(tree, \"A\")\n```"
  raw: '## [1] 3


    **Functions Don’t Have Names**


    The last thing I want to stress when we talk about defining functions is that
    functions do not have names. Variables have names, and variables can refer to
    functions, but these are two separate things.


    In many languages, such as Java, Python, or C++, you define a function, and at
    the same time, you give it an argument. When possible at all, you need a special
    syntax to define a function without a name.


    Not so in R. In R, functions do not have names, and when you define them, you
    are not giving them a name. We have given names to all the functions we have used
    earlier by assigning them to variables right where we defined them. We didn’t
    have to. It is the “function(...) ...” syntax that defines a function. We are
    defining a function whether we assign it to a variable or not.


    Chapter 2 FunCtions in r


    We can define a function and call it immediately like this: (**function**(x) x**2)(2)


    ## [1] 4


    We would never do this, of course. Anywhere we would want to define an anonymous
    function and immediately call it, we could instead just put the body of the function.
    Functions we want to reuse we *have* to give a name so we can get to them again.


    The syntax for defining functions, however, doesn’t force us to give them names.
    When you start to write higher-order functions, that is, functions that take other
    functions as input or return functions, this is convenient.


    Such higher-order functions are an important part of functional programming, and
    we will see much of them later in the book.


    **Vectorized Functions**


    Expressions in R are vectorized. When you write an expression, it is implicitly
    working on vectors of values, not single values. Even simple expressions that
    only involve numbers really are vector operations. They are just vectors of length
    1.


    For longer vectors, expressions work component-wise. So if you have vectors x
    and y, you can subtract the first from the second component-wise just by writing
    x - y:


    x *<* - 1:5


    y *<* - 6:10


    x – y


    ## [1] -5 -5 -5 -5 -5


    Chapter 2 FunCtions in r


    If the vectors are not of the same length, the shorter vector is just repeated
    as many times as is necessary. This is why you can, for example, multiply a number
    to a vector:


    2 * x


    ## [1] 2 4 6 8 10


    Here, 2 is a vector of length 1 and x a vector of length 5, and 2 is just repeated
    five times. You will get a warning if the length of the longer vector is not divisible
    by the length of the shorter vector, and you generally want to avoid this. The
    semantic is the same, though: R just keeps repeating the shorter vector as many
    times as needed.


    x *<* - 1:6


    y *<* - 1:3


    x – y


    ## [1] 0 0 0 3 3 3


    Depending on how a function is written, it can also be used in vectorized expressions.
    R is happy to use the result of a function call in a vector expression as long
    as this result is a vector. This is not quite the same as the function operating
    component-wise on vectors. Such functions we can call *vectorized* functions.


    Most mathematical functions such as sqrt, log, cos, and sin are vectorized, and
    you can use them in expressions:


    log(1:3) - sqrt(1:3)


    ## [1] -1.0000000 -0.7210664 -0.6334385


    Functions you write yourself will also be vectorized if their body consists only
    of vectorized expressions:


    Chapter 2 FunCtions in r


    f <- **function**(a, b) log(a) - sqrt(b)


    f(1:3, 1:3)


    ## [1] -1.0000000 -0.7210664 -0.6334385


    The very first function we wrote in this book, square, was also a vectorized function.
    The function scale was also, although the functions it used, mean and sd, are
    not; they take vector input but return a summary of the entire vector and do not
    operate on the vector component-wise.


    A function that uses control structures usually will not be vectorized.


    We can write a comparison function that returns -1 if the first argument is smaller
    than the second and 1 if the second is larger than the first, and zero otherwise
    like this:


    compare *<* - **function**(x, y) {


    **if** (x *<* y) {


    } **else if** (y *<* x) {


    } **else** {


    }


    }


    This function will work fine on single values but not on vectors. The problem
    is that the if-expression only looks at the first element in the logical vector
    x < y. (Yes, x < y is a vector because < is a vectorized function.)


    To handle if-expressions, we can get around this problem by using the ifelse function.
    This is a vectorized function that behaves just as an if- else- expression:


    Chapter 2 FunCtions in r


    compare *<* - **function**(x, y) {


    ifelse(x *<* y, -1, ifelse(y *<* x, 1, 0))


    }


    compare(1:6, 1:3)


    ## [1] 0 0 0 1 1 1


    The situation is not always so simple that we can replace if-statements with ifelse.
    In most cases, we can, but when we cannot, we can instead use the function Vectorize.
    This function takes a function that can operate on single values and translate
    it into a function that can work component-wise on vectors.


    As an example, we can take the compare function from before and vectorize it:


    compare *<* - **function**(x, y) {


    **if** (x *<* y) {


    } **else if** (y < x) {


    } **else** {


    }


    }


    compare *<* - Vectorize(compare)


    compare(1:6, 1:3)


    ## [1] 0 0 0 1 1 1


    By default, Vectorize will vectorize on all parameters of a function. As an example,
    imagine that we want a scale function that doesn’t scale all variables in a vector
    by the same vector’s mean and standard deviation but use the mean and standard
    deviation of another vector:


    Chapter 2 FunCtions in r


    Scale_with *<* - **function**(x, y) {


    (x - mean(y)) / sd(y)


    }


    This function is already vectorized on its first parameter since it just consists
    of a vectorized expression, but if we use Vectorize on it, we break it:


    scale_with(1:6, 1:3)


    ## [1] -1 0 1 2 3 4


    scale_with <- Vectorize(scale_with)


    scale_with(1:6, 1:3)


    ## [1] NA NA NA NA NA NA


    The function we create with Vectorize is vectorized for both x and y, which means
    that it operates on these component-wise. When scaling, the function only sees
    one component of y, not the whole vector. The result is a vector of missing values,
    NA because the standard deviation of a single value is not defined.


    We can fix this by explicitly telling Vectorize which parameters should be vectorized—in
    this example, only parameter x:


    Scale_with *<* - **function**(x, y) {


    (x - mean(y)) / sd(y)


    }


    scale_with *<* - Vectorize(scale_with, vectorize.args="x") scale_with(1:6, 1:3)


    ## [1] -1 0 1 2 3 4


    Chapter 2 FunCtions in r


    Simple functions are usually already vectorized, or can easily be made vectorized
    using ifelse, but for functions more complex, the Vectorize function is needed.


    As an example, we can consider a tree data structure and a function for computing
    the node depth of a named node—the node depth defined as the distance from the
    root. For simplicity, we consider only binary trees.


    We can implement trees using lists:


    Make_node *<* - **function**(name, left = NULL, right = NULL) list(name = name,
    left = left, right = right)


    tree *<* - make_node("root",


    make_node("C", make_node("A"),


    make_node("B")),


    make_node("D"))


    To compute the node depth, we can traverse the tree recursively: node_depth *<*
    - **function**(tree, name, depth = 0) {


    **if** (is.null(tree)) return(NA)


    **if** (tree$name == name) return(depth)


    left *<* - node_depth(tree$left, name, depth + 1) **if** (!is.na(left)) return(left)


    right *<* - node_depth(tree$right, name, depth + 1) return(right)


    }


    This is not an unreasonably complex function, but it is a function that is harder
    to vectorize than the scale_with function. As it is, it works well for single
    names:


    Chapter 2 FunCtions in r


    node_depth(tree, "D")


    ## [1] 1


    node_depth(tree, "A")'
  trans: "\n# [1] 3\n\n## 函数没有名称\n\n在讨论函数定义时，我想强调的最后一点是：函数本身并没有名称。变量才有名称，变量可以指向函数，但这是两个不同的概念。\n\
    \n在许多语言，比如 Java、Python 或 C++ 中，当你定义一个函数时，同时也会给它一个名称。即便在允许的情况下，你也需要借助特殊的语法才能定义一个没有名称的函数。\n\
    \n但在 R 语言中并非如此。在 R 里，函数没有名称，当你定义它们时，并没有赋予它们名字。之前我们使用过的所有函数，都是通过在定义处将它们赋值给变量来命名的。但我们并非必须这样做。实际上，是\
    \ `function(...) ...` 这个语法定义了函数。无论我们是否将其赋值给变量，都是在定义一个函数。\n\n### 第 2 章 R 语言中的函数\n\
    \n我们可以像这样定义一个函数并立即调用它：`(function(x) x²)(2)`\n\n## [1] 4\n\n当然，我们通常不会这样做。在任何需要定义匿名函数并立即调用的场景下，我们大可直接使用函数体。对于想要复用的函数，我们*必须*给它一个名称，以便能够再次调用它。\n\
    \n然而，定义函数的语法并不强制我们给函数命名。当你开始编写高阶函数（即接受其他函数作为输入或返回函数的函数）时，这种特性会非常便利。\n\n这类高阶函数是函数式编程的重要组成部分，我们在本书后面会经常遇到它们。\n\
    \n## 向量化函数\n\nR 语言中的表达式是向量化的。当你编写一个表达式时，它会隐式地作用于值的向量，而不是单个值。即使是只涉及数字的简单表达式，本质上也是向量运算，只不过这些向量的长度为\
    \ 1。\n\n对于更长的向量，表达式会按元素逐个进行计算。因此，如果你有向量 `x` 和 `y`，只需写成 `x - y` 就可以实现第二个向量元素减去第一个向量元素的操作：\n\
    \n```\nx <- 1:5\ny <- 6:10\nx - y\n```\n\n## [1] -5 -5 -5 -5 -5\n\n如果向量的长度不同，较短的向量会根据需要被重复多次。这就是为什么你可以将一个数与一个向量相乘，例如：\n\
    \n```\n2 * x\n```\n\n## [1] 2 4 6 8 10\n\n这里，`2` 是长度为 1 的向量，`x` 是长度为 5 的向量，`2`\
    \ 被重复了五次。如果较长向量的长度不是较短向量长度的整数倍，你会收到一个警告，通常应尽量避免这种情况。不过语义是一样的：R 会尽可能多次地重复较短的向量，直到与较长向量长度匹配。\n\
    \n```\nx <- 1:6\ny <- 1:3\nx - y\n```\n\n## [1] 0 0 0 3 3 3\n\n根据函数的编写方式，它也可以用在向量化表达式中。只要函数调用的结果是一个向量，R\
    \ 就乐意将其用于向量表达式。但这与函数对向量按元素进行操作并非完全相同。这样的函数我们可以称之为*向量化*函数。\n\n大多数数学函数，如 `sqrt`、`log`、`cos`\
    \ 和 `sin`，都是向量化的，你可以在表达式中使用它们：\n\n```\nlog(1:3) - sqrt(1:3)\n```\n\n## [1] -1.0000000\
    \ -0.7210664 -0.6334385\n\n如果你自己编写的函数的主体仅包含向量化表达式，那么该函数也会是向量化的：\n\n```\nf <- function(a,\
    \ b) log(a) - sqrt(b)\nf(1:3, 1:3)\n```\n\n## [1] -1.0000000 -0.7210664 -0.6334385\n\
    \n我们在本书中编写的第一个函数 `square` 也是一个向量化函数。函数 `scale` 同样如此，尽管它内部使用的 `mean` 和 `sd` 函数并非向量化函数；它们接收向量输入，但返回的是整个向量的汇总统计量，而不是对向量分量进行操作。\n\
    \n使用了控制结构的函数通常不会是向量化的。\n\n我们可以编写一个比较函数，如果第一个参数小于第二个参数则返回 -1，如果第二个参数大于第一个参数则返回\
    \ 1，否则返回 0，如下所示：\n\n```\ncompare <- function(x, y) {\n  if (x < y) {\n    -1\n\
    \  } else if (y < x) {\n    1\n  } else {\n    0\n  }\n}\n```\n\n这个函数对于单个值工作良好，但不适用于向量。问题在于\
    \ `if` 表达式只会查看逻辑向量 `x < y` 的第一个元素。（没错，`x < y` 是一个向量，因为 `<` 是一个向量化函数。）\n\n为了处理\
    \ if 表达式，我们可以使用 `ifelse` 函数来绕过这个问题。这是一个向量化函数，其行为类似于 if-else 表达式：\n\n```\ncompare\
    \ <- function(x, y) {\n  ifelse(x < y, -1, ifelse(y < x, 1, 0))\n}\ncompare(1:6,\
    \ 1:3)\n```\n\n## [1] 0 0 0 1 1 1\n\n情况并非总是简单到可以用 `ifelse` 替换 if 语句。大多数情况下可以，但当不能时，我们可以改用\
    \ `Vectorize` 函数。这个函数接受一个可操作单个值的函数，并将其转换为能按元素处理向量的函数。\n\n举个例子，我们可以使用之前的 `compare`\
    \ 函数并对其进行向量化：\n\n```\ncompare <- function(x, y) {\n  if (x < y) {\n    -1\n  }\
    \ else if (y < x) {\n    1\n  } else {\n    0\n  }\n}\ncompare <- Vectorize(compare)\n\
    compare(1:6, 1:3)\n```\n\n## [1] 0 0 0 1 1 1\n\n默认情况下，`Vectorize` 会对函数的所有参数进行向量化。例如，假设我们想要一个缩放函数，它不按同一个向量的均值和标准差来缩放该向量中的所有变量，而是使用另一个向量的均值和标准差：\n\
    \n```\nScale_with <- function(x, y) {\n  (x - mean(y)) / sd(y)\n}\n```\n\n这个函数在其第一个参数上已经是向量化的了，因为它仅由一个向量化表达式组成，但如果对其使用\
    \ `Vectorize`，反而会破坏它：\n\n```\nscale_with(1:6, 1:3)\n```\n\n## [1] -1 0 1 2 3 4\n\
    \n```\nscale_with <- Vectorize(scale_with)\nscale_with(1:6, 1:3)\n```\n\n## [1]\
    \ NA NA NA NA NA NA\n\n用 `Vectorize` 创建的函数对 `x` 和 `y` 都是向量化的，这意味着它会按分量对它们进行操作。在缩放时，该函数只看到\
    \ `y` 的一个分量，而不是整个向量。结果会得到一个缺失值向量 NA，因为单个值的标准差是未定义的。\n\n我们可以通过显式告诉 `Vectorize`\
    \ 哪些参数需要向量化来解决这个问题——在本例中，只有参数 `x`：\n\n```\nScale_with <- function(x, y) {\n  (x\
    \ - mean(y)) / sd(y)\n}\nscale_with <- Vectorize(scale_with, vectorize.args =\
    \ \"x\")\nscale_with(1:6, 1:3)\n```\n\n## [1] -1 0 1 2 3 4\n\n简单的函数通常已经是向量化的，或者可以通过\
    \ `ifelse` 轻松实现向量化，但对于更复杂的函数，则需要用到 `Vectorize` 函数。\n\n举个例子，我们可以考虑一个树形数据结构，以及一个用于计算命名节点深度的函数——节点深度定义为到根节点的距离。为简单起见，我们只考虑二叉树。\n\
    \n我们可以使用列表来实现树：\n\n```\nMake_node <- function(name, left = NULL, right = NULL)\
    \ list(name = name, left = left, right = right)\n\ntree <- make_node(\"root\"\
    ,\n                  make_node(\"C\", make_node(\"A\"),\n                    \
    \        make_node(\"B\")),\n                  make_node(\"D\"))\n```\n\n要计算节点深度，我们可以递归地遍历树：\n\
    \n```\nnode_depth <- function(tree, name, depth = 0) {\n  if (is.null(tree)) return(NA)\n\
    \  if (tree$name == name) return(depth)\n  left <- node_depth(tree$left, name,\
    \ depth + 1)\n  if (!is.na(left)) return(left)\n  right <- node_depth(tree$right,\
    \ name, depth + 1)\n  return(right)\n}\n```\n\n这并非一个特别复杂的函数，但它比 `scale_with` 函数更难向量化。就其本身而言，它对单个名称运行良好：\n\
    \n```\nnode_depth(tree, \"D\")\n```\n\n## [1] 1\n\n```\nnode_depth(tree, \"A\"\
    )\n```\n"
- fmt: "## [1] 2\n\n但如果你在一个名称序列上调用它，你会得到一个错误：`node_depth(tree, c(\"A\", \"B\", \"\
    C\", \"D\"))`。不难想象，向量化版本会很有用。例如，要获取一个名称序列的深度：`node_depth <- Vectorize(node_depth,\
    \ vectorize.args = \"name\", USE.NAMES = FALSE)`\n\n`node_depth(tree, c(\"A\"\
    , \"B\", \"C\", \"D\"))`\n\n## [1] 2 2 1 1\n\n这里，需要设置`USE.NAMES = FALSE`才能得到一个简单的向量。如果不设置，向量将基于输入变量包含名称。详情请参阅`Vectorize`的文档。\n\
    \n**中缀运算符**\n\nR中的中缀运算符也是函数。你可以用其他函数覆盖它们（但你真的不应该这样做，因为可能会搞乱大量代码），你也可以创建自己的中缀运算符。\n\
    \n用户定义的中缀运算符是具有特殊名称的函数。名称以`%`开头和结尾的函数会被R视为中缀运算符。创建用作中缀运算符的函数没有特殊语法，只是它应该接受两个参数。不过，变量赋值有特殊语法，包括名称以`%`开头和结尾的变量。\n\
    \n## 第2章 R中的函数\n\n要处理特殊变量，你需要用反引号引用它们。你不能写`+(2, 2)`，尽管`+`是一个函数。R不会将其理解为一个函数调用。但你可以引用`+`，写成``\
    \ `+` ``，然后它就像所有其他变量名一样是一个变量名：\n\n`` `+`(2, 2) ``\n\n## [1] 4\n\n这同样适用于R中所有其他中缀运算符，甚至控制结构：\n\
    \n`` `if`(2 > 3, \"true\", \"false\") ``\n\n## [1] \"false\"\n\nR解析器识别控制结构关键字和各种运算符，例如算术运算符，因此它们拥有特殊语法。但它们实际上都只是函数。甚至括号也是函数`(`的特殊语法，下标运算符也是如此，分别是``\
    \ `[` ``和`` `[[` ``。如果你引用它们，你就得到了一个变量名，可以像使用其他任何函数名一样使用它。\n\n就像所有这些运算符都有特殊语法一样，以`%`开头和结尾的变量也有特殊语法。R期望它们是中缀运算符，并将像`exp1\
