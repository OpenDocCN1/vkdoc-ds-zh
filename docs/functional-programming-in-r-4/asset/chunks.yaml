    ## Functional Programming in purrr


    The Filter, Map, and Reduce functions are the building blocks of many functional
    algorithms. However, many common operations require various combinations of the
    three functions, and combinations with `unlist`, so 138


    Chapter 6 Filter, Map, and reduce


    Writing functions using *only* these three/four functions means building functions
    from the most basic building blocks. This is inefficient, so you want a toolbox
    of more specific functions for common operations.


    The package `purrr` implements a number of such functions for more effective functional
    programming and also provides its own versions of Filter, Map, and Reduce. A complete
    coverage of the `purrr` package is beyond the scope of this short book, but I
    will give a quick overview of the functions available in the package and urge
    you to explore the package more if you are serious about using functional programming
    in R.


    ```

    library(purrr)

    ```


    The functions in `purrr` all take the sequence they operate on as their first
    argument—similar to the `apply` family of functions but different from the Filter,
    Map, and Reduce functions.


    ### Filter-like Functions


    The `purrr` analog of Filter is called `keep` and works exactly like Filter. It
    takes a predicate and returns a list of the elements in a sequence where the predicate
    returns TRUE. The function `discard` works similarly but returns the elements
    where the predicate returns FALSE:


    ```

    keep(1:5, \(x) x > 3)

    ## [1] 4 5


    discard(1:5, \(x) x > 3)

    ## [1] 1 2 3

    ```


    If you give these functions a vector, you get a vector back, of the same type,
    and if you give them a list, you will get a list back:


    ```

    keep(as.list(1:5), \(x) x > 3)

    ## [[1]]

    ## [1] 4

    ##

    ## [[2]]

    ## [1] 5

    ```


    Two convenience functions that you could implement by checking the length of the
    list returned by Filter are `every` and `some` that check if all elements in the
    sequence satisfy the predicate or if some elements satisfy the predicate:


    ```

    every(1:5, \(x) x > 0)

    ## [1] TRUE


    every(1:5, \(x) x > 3)

    ## [1] FALSE


    some(1:5, \(x) x > 3)

    ## [1] TRUE


    some(1:5, \(x) x > 6)

    ## [1] FALSE

    ```


    In the examples here, I have used the `\(x) ...` syntax introduced in R 4, but
    with `purrr`, developed before we had this syntax, you can also use formulae to
    define short functions. You can use the “formula notation” and define an anonymous
    function by writing `~` followed by the body of the function, where the function
    argument is referred to by the variable `.x`:


    ```

    keep(1:5, ~ .x > 3)

    ## [1] 4 5


    discard(1:5, ~ .x > 3)

    ## [1] 1 2 3

    ```


    This shorthand for anonymous functions is only available within functions from
    `purrr`, though. Just because you have imported the `purrr` package, you will
    not get the functionality in other functions.


    ### Map-like Functions


    The Map functionality comes in different flavors in `purrr`, depending on the
    type of output you want and the number of input sequences you need to map over.


    The `map` function always returns a list, while functions `map_lgl`, `map_int`,
    `map_dbl`, and `map_chr` return vectors of logical values, integer values, numeric
    (double) values, and characters, respectively.


    ```

    map(1:5, ~ .x + 2)

    ## [[1]]

    ## [1] 3

    ##

    ## [[2]]

    ## [1] 4

    ##

    ## [[3]]

    ## [1] 5

    ##

    ## [[4]]

    ## [1] 6

    ##

    ## [[5]]

    ## [1] 7


    map_dbl(1:5, ~ .x + 2)

    ## [1] 3 4 5 6 7

    ```


    The `map` family of functions all take a single sequence as input, but there are
    corresponding functions for two sequences, the `map2` family, and for an arbitrary
    number of sequences, the `pmap` family.


    For the `map2` functions, you can create anonymous functions that refer to the
    two input values they will be called with by using variables `.x` and `.y`:


    ```

    map2(1:5, 6:10, ~ 2 * .x + .y)

    ## [[1]]

    ## [1] 8

    ##

    ## [[2]]

    ## [1] 11

    ##

    ## [[3]]

    ## [1] 14

    ##

    ## [[4]]

    ## [1] 17

    ##

    ## [[5]]

    ## [1] 20


    map2_dbl(1:5, 6:10, ~ 2 * .x + .y)

    ## [1] 8 11 14 17 20

    ```


    For arbitrary numbers of sequences, you must use the `pmap` family and wrap the
    sequences in a list that is given as the first parameter. If you use anonymous
    functions, you will need to define them using the general R syntax; there are
    no shortcuts for specifying anonymous functions with three or more parameters.


    ```

    pmap(list(1:5, 6:10, 11:15), \(x, y, z) x + y + z)

    ## [[1]]

    ## [1] 18

    ##

    ## [[2]]

    ## [1] 21

    ##

    ## [[3]]

    ## [1] 24

    ##

    ## [[4]]

    ## [1] 27

    ##

    ## [[5]]

    ## [1] 30


    pmap_dbl(list(1:5, 6:10, 11:15), \(x, y, z) x + y + z)

    ## [1] 18 21 24 27 30

    ```


    The function `map_if` provides a variation of `map` that only applies the function
    it is mapping if a predicate is TRUE. If the predicate returns FALSE for an element,
    that element is kept unchanged.


    For example, we can use it to multiply only numbers that are not even by two like
    this:


    ```

    unlist(map_if(1:5, ~ .x %% 2 == 1, ~ 2*.x))

    ## [1] 2 2 6 4 10

    ```


    A particularly nice feature of `purrr`’s map functions is that you can provide
    them with a string instead of a function, and this is used when you are working
    with sequences of elements that have names, like data frames and lists, to extract
    named components. So if we map over the trees from earlier, we can, for example,
    use `map` to extract the left child of all the trees:


    ```

    map_chr(map(keep(trees, ~ size_of_tree(.x) > 1), "left"), print_tree)

    ## C      E

    ## "A" "(A,B)"

    ```


    Here, we combine three different functions: we use `keep` so we only look at trees
    that actually *have* a left child. Then we use `map` with `"left"` to extract
    the left child, and, finally, we use `map_chr` to translate the trees into Newick
    format for printing.


    ### Reduce-like Functions


    The Reduce function is implemented in the `reduce` function:


    ```

    reduce(1:5, `+`)

    ## [1] 15


    reduce(1:5, `*`, .dir = "backward")  # Reduce from the right

    ```'
