    # Chapter 1: Introduction


    Welcome to *Functional Programming in R 4*. I wrote this book to have teaching
    material beyond the typical introductory level most textbooks on R have, where
    functions are simple constructions for wrapping up some reusable instructions
    that you can then call when you need those instructions run. In languages such
    as R, functions are more than this. They are objects in their own right that you
    can also treat as data, create and manipulate and pass around like other objects,
    and learning how to do this will make you a far more effective R programmer.


    The R language is a multiparadigm language with elements from procedural programming,
    object-oriented programming, and functional programming. Procedural programming
    focuses on the instructions you want the computer to execute—add these numbers,
    put the result in this variable, loop through this list, etc. Object-oriented
    programming, on the other hand, focuses on what kind of data you manipulate, which
    operations you can perform on them, and how they change when you manipulate them.
    If you are interested in these aspects of the R language, I have written another
    book, *Advanced Object-Oriented Programming in R*, also by Apress, that you might
    be interested in.


    Functional programming is the third style of programming, where the focus is on
    transformations. Functions transform data from input to output, and by composing
    transformations, you construct programs from simpler functions to more involved
    pipelines for your data. In functional programming, functions themselves are considered
    data, and just as with other data, you can write transformations that take functions
    as input and produce (other) functions as output. You can thus write simple functions,
    then adapt them (using other functions to modify them), and combine them in various
    ways to construct complete programs.


    The R programming language supports procedural programming, object-oriented programming,
    and functional programming, but it is mainly a functional language. It is not
    a “pure” functional language. Pure functional languages will not allow you to
    modify the state of the program by changing values parameters hold and will not
    allow functions to have side effects (and need various tricks to deal with program
    input and output because of it). R is somewhat close to “pure” functional languages.
    In general, data is immutable, so changes to data inside a function do ordinarily
    not alter the state of data outside that function. But R does allow side effects,
    such as printing data or making plots, and, of course, allows variables to change
    values.


    *Pure* functions have no side effects, so a function called with the same input
    will always return the same output. Pure functions are easier to debug and to
    reason about because of this. They can be reasoned about in isolation and will
    not depend on the context in which they are called. The R language does not guarantee
    that the functions you write are pure, but you can write most of your programs
    using only pure functions. By keeping your code mostly purely functional, you
    will write more robust code and code that is easier to modify when the need arises.
    You will want to move the impure functions to a small subset of your program.
    These functions are typically those that need to sample random data or that produce
    output (either text or plots). If you know where your impure functions are, you
    know when to be extra careful with modifying code.'
