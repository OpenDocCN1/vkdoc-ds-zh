    \n## 第2章 R中的函数\n\n我们可以使用`address`函数获取对象的内存地址。当创建副本时，地址会改变；没有创建副本时，地址保持不变。我们可以使用`pryr`包中的`mem_change`函数来查看一个表达式分配了多少内存。\n\
    \n使用这两个函数，我们可以更深入地研究这种复制机制。（具体输出取决于你的计算机，但你应该看到与下面类似的内容。）我们可以先创建一个长向量并修改它：\n\n\
