    \ name the function, by assigning the function to the variable `g`, we also get\
    \ a reference from the local environment to the function.\n\n**Figure 4-8.** After\
    \ defining `f`\n\n## Chapter 4 Scope and Closures\n\n**Figure 4-9.** Calling `f`\n\
    \nWe return the new function object from the call to `f`, and in this code, we\
