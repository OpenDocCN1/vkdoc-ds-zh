  trans: "\n## [1] 3\n\n通过调用 `force(f)`，你确保 thunk 环境中的 `f` 保持不变；而通过立即求值 `...` 参数（将其放入列表中），你确保变量会被绑定到创建\
    \ thunk 时所持有的值，而不是在调用 thunk 时可能持有的值。\n\n第一种结构更简单，但如果存在非纯函数且变量会发生变化，那么第二种更安全。\n\
    \n如果你好奇为什么这类函数被称为 \"thunk\"，以下是《黑客词典》中的解释：\n\n> 历史注记：关于这个术语的起源，流传着几个拟声词神话。\n>\n\
    > 最常见的一种说法是，它模拟了数据撞击堆栈的声音；\n>\n> 另一种说法认为，它模拟了数据撞击累加器的声音。\n>\n> 还有说法认为，它模拟了表达式在参数求值时被解冻的声音。\n\
    >\n> 实际上，根据发明者的说法，这个术语是在他们意识到\n>\n> （经过数小时讨论后的凌晨时分）可以通过一点编译时的思考\n>\n> 提前推算出 Algol-60\
    \ 中参数的类型，从而简化求值机制后\n>\n> 才被创造出来的。换句话说，这个想法“已经被想到过了”（already been thought of）；\n\
    >\n> 因此它被命名为 thunk，这就像是“凌晨两点时‘think（想）’的过去式”。\n\n我们将把递归调用封装到 thunk 中，每个 thunk\
    \ 执行递归中的一步。每个 thunk 求值一步，并返回一个新的 thunk，该 thunk 将求值下一步，依此类推，直到某个 thunk 最终返回一个值。这种求值方式被称为“蹦床”（trampoline），其形象比喻是：每个\
    \ thunk 在蹦床上弹跳一次，完成一步求值，然后作为下一个 thunk 再次落回蹦床。\n\n蹦床只是一个不断求值 thunk 直到获得值的函数，其实现如下：\n\
    \n```\ntrampoline <- function(thunk) {\n  while (is.function(thunk)) thunk <-\
    \ thunk()\n  thunk\n}\n```\n\n为了理解如何结合 thunk 和蹦床来避免递归，我们首先考虑计算数字阶乘这一更简单的例子，而不是计算树的大小。\n\
    \n我们在第 3 章中编写了递归阶乘函数，非尾递归版本如下：\n\n```\nfactorial <- function(n) {\n  if (n ==\
    \ 1) 1\n  else n * factorial(n - 1)\n}\n```\n\n使用累加器的尾递归版本如下：\n\n```\nfactorial\
    \ <- function(n, acc = 1) {\n  if (n == 1) acc\n  else factorial(n - 1, acc *\
    \ n)\n}\n```\n\n为了得到 thunk-蹦床版本，我们首先将其重写为连续传递风格（continuation passing style）。这基本上就是将尾递归版本中的累加器转换为用于计算最终结果的延续：\n\
    \n```\ncp_factorial <- function(n, continuation = identity) {\n  if (n == 1) {\n\
    \    continuation(1)\n  } else {\n    cp_factorial(n - 1, \\(result) continuation(result\
    \ * n))\n  }\n}\n```\n\n```\nfactorial(10)\n## [1] 3628800\n\ncp_factorial(10)\n\
    ## [1] 3628800\n```\n\n这个函数与累加器版本功能相同，并且由于没有尾递归优化，它会从 `n` 直到 `1` 一直调用 `cp_factorial`，然后对延续函数进行同样多次的求值。我们可以让它对\
    \ `n` 值最高大约达到一千左右还能工作，但超过这个值后，就会达到递归栈的极限。在我们达到这个极限之前，R 中的数字就已经大到无法用浮点数表示，但这不是重点；重点是递归调用的次数可能会多到我们无法处理。\n\
    \n因此，我们希望每个“递归”调用不再进行递归，而是创建一个 thunk。这将创建一个执行下一步并返回下一步 thunk 的 thunk，但它不会调用下一步，因此不会产生递归。我们需要为递归和延续两者都创建这样的\
    \ thunk。实现很简单：我们只需将递归替换为对 `make_thunk` 的调用：\n\n```\nthunk_factorial <- function(n,\
    \ continuation = identity) {\n  if (n == 1) {\n    continuation(1)\n  } else {\n\
    \    # 新的延续是一个返回 thunk 的函数。\n    # 该 thunk 将通过调用延续来运行计算的下一步\n    new_continuation\
    \ <- \\(result) \\() continuation(n * result)\n    # 我们尚未调用阶乘递归，只是返回一个准备好执行计算第一步的\
    \ thunk\n    \\(() thunk_factorial(n - 1, new_continuation)\n  }\n}\n```\n\n用\
    \ `1` 调用此函数会直接得到一个值：\n\n```\nthunk_factorial(1)\n## [1] 1\n```\n\n用 `2` 调用会创建一个\
    \ thunk。我们需要调用这个 thunk 来向下递归到基本情况；这将为我们提供一个针对该处延续的 thunk，并且我们需要求值该 thunk 以得到值：\n\
    \n```\n# 将我们向下递归一步，但不会向上返回\nthunk_factorial(2)()\n## \\(() continuation(n * result)\n\
    ## <bytecode: 0x7fe42629e860>\n## <environment: 0x7fe4263bcb38>\n\n# 下一步调用将我们向上返回一个结果\n\
    thunk_factorial(2)()()\n## [1] 2\n```\n\n对于递归中的每一步，我们因此会多得到两个 thunk：一个用于向下递归，另一个用于求值该\
    \ thunk。但最终，我们将求值所有 thunk 并得到一个值：\n\n```\nthunk_factorial(3)()()()()()\n## [1]\
    \ 6\n\nthunk_factorial(4)()()()()()()\n## [1] 24\n\nthunk_factorial(5)()()()()()()()()\n\
    ## [1] 120\n```\n\n当然，我们不想显式调用所有这些 thunk；这正是蹦床的用途：\n\n```\ntrampoline(thunk_factorial(100))\n\
    ## [1] 9.332622e+157\n```\n\n我们可以编写另一个高阶函数，将这种 thunk 化的函数转换为一个使用蹦床进行计算的函数，如下所示：\n\
    \n```\nmake_trampoline <- function(f) \\(...) trampoline(f(...))\nfactorial <-\
    \ make_trampoline(thunk_factorial)\nfactorial(100)\n## [1] 9.332622e+157\n```\n\
    \n为了计算树的大小，我们只需做同样的事情。这里使用的延续执行的操作更复杂——它会在右子树上调用深度优先遍历，而不是直接计算一个表达式——但这并不影响，因为它只是一个延续，我们只需将其包装成一个\
    \ thunk：\n\n```\nthunk_size <- function(node, continuation = identity) {\n  if\
    \ (is.null(node$left) && is.null(node$right)) {\n    continuation(1)\n  } else\
    \ {\n    left_continuation <- function(left_result) {\n      # 右侧延续为我们返回一个 thunk，该\
    \ thunk 返回当前树的大小（左 + 右 + 1）。\n      right_continuation <- function(right_result)\n\
    \        \\(() continuation(left_result + right_result + 1)\n      # 返回用于向右递归的\
    \ thunk\n      \\(() thunk_size(node$right, right_continuation)\n    }\n    #\
    \ 返回用于向左递归的 thunk\n    \\(() thunk_size(node$left, left_continuation)\n  }\n}\n\
    \nsize_of_tree <- make_trampoline(thunk_size)\nsize_of_tree(tree)\n```\n"
