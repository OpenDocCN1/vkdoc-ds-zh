    the parameter continuation is the function that still remains to be called before
    the final result can be returned from function last. It is the continuation of
    the curried function. We need to evaluate both parameters inside make_i before
    we return the function. Otherwise, we run into the lazy evaluation problem where,
    when we eventually call the function, values of variables might have changed since
    we created the function. We do this by calling force on the arguments.


    We now simply need to bind it all together. We do this in reverse order, so we
    always have the continuation we need when we create the next function. The first
    continuation is the last function. It is the last function that should be called,
    and it will return the desired result of the entire curried chain. Each call to
    make_i will return a new continuation that we provide to the next function in
    the chain (in reverse order): continuation <- last


    **for** (i **in** seq(n-1, 1)) {


    continuation <- make_i(i, continuation)


    }


