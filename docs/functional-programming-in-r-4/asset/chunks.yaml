    \ on these component-wise. When scaling, the function only sees one component\
    \ of `y`, not the whole vector. The result is a vector of missing values, NA because\
    \ the standard deviation of a single value is not defined.\n\nWe can fix this\
    \ by explicitly telling `Vectorize` which parameters should be vectorized—in this\
    \ example, only parameter `x`:\n\n```\nScale_with <- function(x, y) {\n  (x -\
    \ mean(y)) / sd(y)\n}\nscale_with <- Vectorize(scale_with, vectorize.args = \"\
    x\")\nscale_with(1:6, 1:3)\n```\n\n## [1] -1 0 1 2 3 4\n\nSimple functions are\
    \ usually already vectorized, or can easily be made vectorized using `ifelse`,\
    \ but for functions more complex, the `Vectorize` function is needed.\n\nAs an\
    \ example, we can consider a tree data structure and a function for computing\
    \ the node depth of a named node—the node depth defined as the distance from the\
    \ root. For simplicity, we consider only binary trees.\n\nWe can implement trees\
    \ using lists:\n\n```\nMake_node <- function(name, left = NULL, right = NULL)\
    \ list(name = name, left = left, right = right)\n\ntree <- make_node(\"root\"\
    ,\n                  make_node(\"C\", make_node(\"A\"),\n                    \
    \        make_node(\"B\")),\n                  make_node(\"D\"))\n```\n\nTo compute\
    \ the node depth, we can traverse the tree recursively:\n\n```\nnode_depth <-\
    \ function(tree, name, depth = 0) {\n  if (is.null(tree)) return(NA)\n  if (tree$name\
    \ == name) return(depth)\n  left <- node_depth(tree$left, name, depth + 1)\n \
    \ if (!is.na(left)) return(left)\n  right <- node_depth(tree$right, name, depth\
