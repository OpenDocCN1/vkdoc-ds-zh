    but not necessarily like this:


    f(x = a, y = 2 * x)


    In both cases, we will create an environment for the function first, and in it,
    we will store the mappings from x and y to values. Except, function arguments
    are not passed as values but using lazy evaluation. You can think of this lazy
    evaluation much like the quote(x + y) expression from earlier in the chapter.
    It is unevaluated expressions we pass to the function, and we only evaluate them
    once we have to.


    So, in both cases, f’s environment will map x to a and y to 2 * x. We then will
    try to evaluate x + y, which means that we trigger evaluation of the expressions
    a and 2 * x, and this is where the two calls differ.


    Function arguments *also* have an associated environment. In this sense, they
    are *not* exactly like the quote(x + y) expression. And in the first case, where
    x is provided but y is the default, the expression a for x knows that it should
    be evaluated in the global scope, where a is defined, but the default parameter
    y = 2 * x should be evaluated in the local environment; see Figur[e 4-6\. S](#index_split_000.html#p84)o,
    when we try to evaluate x + y, we will evaluate the expression a in the global
    environment to get the value for x, and we will then evaluate the expression 2
    * x in the local variable (that knows x) to get y, and that will give us the variable
    values we need.


    Chapter 4 SCope and CloSureS


    In the second case, however, both x and y need to be evaluated in the global environment
    because we got the expressions from there. We can still evaluate a to get x, but
    there might not be an x in the global environment, in which case we can’t evaluate
    2 * x, or even worse, there is one, but it is the wrong value, so we would get
    a result back that isn’t the one we expect.


    While we evaluate parameters inside function calls, the environment we use depends
    on where they were provided. Default parameters will be evaluated in the local
    environment, see Figur[e 4-6, and other p](#index_split_000.html#p84)arameters
    will be evaluated in the calling scope, see Figur[e 4-7.](#index_split_000.html#p84)


    ***Figure 4-6.** Evaluating with a default parameter*


    ***Figure 4-7.** Evaluating with an explicit argument* 76


    Chapter 4 SCope and CloSureS


    We can exploit lazy evaluation to extract expressions rather than values and evaluate
    them in different environments, should we choose. A full exploration of this is
    beyond the scope of this book, but a short example could look like this:


    f <- **function**(expr, ...) {


    expr <- substitute(expr) *# Turn argument into a plain* *expression*


    env <- list2env(list(...)) # *Make an env from ''...''*


    parent.env(env) <- parent.frame() *# Get remaining args from* *caller''s env*


    eval(expr, env) *# Now evaluate the expression in* *the new env*


    }


    a <- 22


    f(a)


    ## [1] 22


    f(a + b, b = 13)


    ## [1] 35


    You can use the substitute() function to strip an argument of its environment
    and only get its expression. In the function, we then use list2env to turn the
    ... arguments into an environment, we make the parent of this environment the
    calling scope (using parent.frame to get the caller’s environment rather than
    the function’s local scope), and then we evaluate the expression in the new environment.
    It allows us to push in extra arguments, like b = 13, and use them instead of
    the local environment for the evaluation.


    Chapter 4 SCope and CloSureS


    Tricks like this are used throughout the Tidyverse ecosystem of packages, and
    if it is something you wish to explore further, an excellent place to start is
    the rlang package. It provides several high-level handles for manipulating arguments
    and evaluating them in alternative environments. But I will leave the topic of
    nonstandard evaluation here.


    **Nested Functions and Scopes**


    So far, we have only considered two environments—global and local—so it might
    be natural to assume that the parent of a local environment is always the global
    (and you might wonder why this whole mechanism is necessary in that case), but
    this isn’t the case. It is merely an artifact of where we have defined our functions
    so far.


    Consider this slightly weird but simple enough function: f <- **function**() environment()


    When we call f(), it will return its local environment, and there is nothing we
    haven’t seen before yet. However, the environment() function takes an argument,
    a function, and if you call it with a function, it returns something else than
    the current environment. It returns the environment where the function was defined.
    We defined f in the global environment, so environment(f) will give us the global
    environment:


    environment(f)


    ## <environment: R_GlobalEnv>


    which, as should be clear by now, is different from the environment we get when
    we are inside the function’s body:


    f()'
