    ## [1] 8 9\n```\n\n我们有一个包含三个向量的列表，每个向量都有从 1 到 10 的十个样本，我们想要获取这三个列表的交集。这意味着取前两个的交集，然后取该结果与第三个列表的交集。非常适合使用\
    \ `Reduce`。我们只需将其与 `intersection` 函数结合使用。\n\n## 集合使用这些函数\n\n这三个函数经常一起使用，`Filter`\
    \ 首先剔除不应处理的元素，然后 `Map` 处理列表，最后 `Reduce` 合并所有结果。\n\n本节将展示几个如何使用这些函数的示例。我们从处理树开始。请记住，我们可以使用之前编写的\
    \ `make_node` 函数构建树，并且我们可以创建一个树列表，因为我们可以创建任何内容的列表：\n\n```\nA <- make_node(\"A\"\
    )\nC <- make_node(\"C\", make_node(\"A\"), make_node(\"B\"))\nE <- make_node(\"\
    E\",\n              make_node(\"C\", make_node(\"A\"), make_node(\"B\")),\n  \
    \            make_node(\"D\"))\ntrees <- list(A = A, C = C, E = E)\n```\n\n打印一棵树会得到它的列表表示形式。如果我们\
    \ `unlist` 一棵树，我们会得到相同的表示形式，只是被扁平化了，因此结构体现在结果向量的名称中，但我们编写了一个 `print_tree` 函数，它能够以\
    \ Newick 格式给出字符串表示形式：\n\n```\ntrees[[2]]\n## $name\n## [1] \"C\"\n##\n## $left\n\
    ## $left$name\n## [1] \"A\"\n##\n## $left$left\n## NULL\n##\n## $left$right\n\
    ## NULL\n##\n##\n## $right\n## $right$name\n## [1] \"B\"\n##\n## $right$left\n\
    ## NULL\n##\n## $right$right\n## NULL\n\nunlist(trees[[2]])\n##    name left.name\
    \ right.name\n##     \"C\"       \"A\"        \"B\"\n\nprint_tree(trees[[2]])\n\
    ## [1] \"(A,B)\"\n```\n\n我们可以使用 `Map` 将一个树列表转换为它们的 Newick 格式，并将此列表扁平化以获得一个字符向量：\n\
    \n```\nMap(print_tree, trees)\n## $A\n## [1] \"A\"\n##\n## $C\n## [1] \"(A,B)\"\
    \n##\n## $E\n## [1] \"((A,B),D)\"\n\nunlist(Map(print_tree, trees))\n##      \
    \    A          C          E\n##        \"A\"     \"(A,B)\"   \"((A,B),D)\"\n\
    ```\n"
- fmt: "## `\"A\"` `\"(A,B)\"` `\"((A,B),D)\"`\n\n我们可以将其与 `Filter` 结合，只获取非单叶的树；这里可以使用之前编写的\
    \ `size_of_tree` 函数：`unlist(Map(print_tree, Filter(**function**(tree) size_of_tree(tree)\
    \ > 1, trees)))`\n\n## `C` `E`\n\n## `\"(A,B)\"` `\"((A,B),D)\"`\n\n第 6 章 Filter、Map\
    \ 和 Reduce\n\n或者我们可以获取所有树的大小，并通过组合 `Map` 与 `Reduce` 计算它们的总和：\n\n`unlist(Map(size_of_tree,\
    \ trees))`\n\n## `A` `C` `E`\n\n## 1 3 5\n\n`Reduce(`+`, Map(size_of_tree, trees),\
    \ 0)`\n\n## [1] 9\n\n我们也可以搜索特定节点的深度，例如获取所有树中节点“B”的深度：\n\n`node_depth_B <- **function**(tree)\
    \ node_depth(tree, \"B\")`  \n`unlist(Map(node_depth_B, trees))`\n\n## `A` `C`\
    \ `E`\n\n## NA 1 2\n\n结果中的名称会让人困惑。它们对应我们在构建列表时为树赋予的名称，可以通过 `unlist` 的 `use.names`\
    \ 参数去除。通常，如果不需要向量的名称，应始终这样做；这样能加快计算速度，因为 R 无须在数据上拖带名称。\n\n`unlist(Map(node_depth_B,\
    \ trees), use.names = FALSE)`\n\n## [1] NA 1 2\n\n对于不包含“B”节点的树，搜索节点深度时会得到 `NA`，我们可以使用\
    \ `Filter` 轻松移除它们：  \n`Filter(**function**(x) !is.na(x), unlist(Map(node_depth_B,\
    \ trees), use.names = FALSE))`\n\n## [1] 1 2\n\n第 6 章 Filter、Map 和 Reduce\n\n\
    或者我们可以在对树应用 `Map` 之前，显式检查树是否包含节点“B”：\n\n`has_B <- **function**(node) {`  \n` \
    \ **if** (node$name == \"B\") return(TRUE)`  \n`  **if** (is.null(node$left) &&\
    \ is.null(node$right)) return(FALSE)`  \n`  has_B(node$left) || has_B(node$right)`\
    \  \n`}`\n\n`unlist(Map(node_depth_B, Filter(has_B, trees)), use.names = FALSE)`\n\
    \n## [1] 1 2\n\n先过滤再映射的解决方案可能更可取，因为如果我们用处理任意节点名称的通用函数替换 `has_B` 和 `node_depth_B`，则无需特意匹配它们，但两种方案都可行。\n\
    \n**Apply 函数族**\n\n`Map` 函数是对列表元素进行映射的通用解决方案，但 R 有一整套类似 `Map` 的函数族，它们适用于不同类型的输入。这些函数均以“something-apply”命名，我们已在上一章中见过\
    \ `sapply`。`Map` 函数实际上只是其中一个函数 `mapply` 的包装器，鉴于我们已经了解 `Map` 的用法，这里不再讨论 `mapply`，但我会简要介绍\
    \ `apply` 族中的其他函数。\n\n**sapply、vapply 和 lapply**\n\n`sapply`、`vapply` 和 `lapply`\
    \ 都作用于序列。区别在于：`sapply` 尝试*简化*其输出；`vapply` 接受一个值作为参数，并将输出强制转换为该值的类型，若无法转换则报错；`lapply`\
    \ 则对列表进行映射。\n\n第 6 章 Filter、Map 和 Reduce\n\n在交互式会话中使用 `sapply` 很方便，因为当映射结果可以转换为向量时，它本质上类似于\
