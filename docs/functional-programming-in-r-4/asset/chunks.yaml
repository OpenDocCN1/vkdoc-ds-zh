    rnorm(1) %x% 4\n```\n\n## [1] 0.8430961 -2.9336330 -1.1009706 0.2947148\n\n这里，`match.call`函数只是获取当前函数调用的表示，我们可以从中提取表达式而无需对其求值。然后，我们使用`replicate`在调用函数的作用域内对其进行多次求值。\n\
    \n如果你不太理解这一点，别担心。我们将在后面的章节中介绍作用域。\n\n## 第 2 章 R 中的函数\n\n**替换函数**\n\n另一类具有特殊名称的函数是所谓的*替换函数*。R\
    \ 中的数据是不可变的。你可以更改数据参数所指的内容，但不能更改实际数据。即使看起来你在修改数据，至少在概念上，你是在创建一个副本，修改它，然后使一个变量指向新的副本。\n\
    \n我们可以通过一个简单的向量示例看到这一点。如果我们创建两个指向同一个初始向量的向量，然后修改其中一个，另一个保持不变：\n\n```\nx <- y <-\
    \ 1:5\nx\n```\n\n## [1] 1 2 3 4 5\n\n```\ny\n```\n\n## [1] 1 2 3 4 5\n\n```\n\
    x[1] <- 6\nx\n```\n\n## [1] 6 2 3 4 5\n\n```\ny\n```\n\n## [1] 1 2 3 4 5\n\nR\
    \ 很智能。如果不需要，它不会复制值。\n\n从语义上讲，最好将任何修改视为创建副本，但出于性能原因，R 只会在必要时才复制——至少对于像向量这样的内置数据来说是这样。通常，当你有两个变量引用同一份数据，并且你“修改”了其中一个时，就会发生复制。\n\
    \n## 第 2 章 R 中的函数\n\n我们可以使用`address`函数获取对象的内存地址。当创建副本时，地址会改变；没有创建副本时，地址保持不变。我们可以使用`pryr`包中的`mem_change`函数来查看一个表达式分配了多少内存。\n\
    \n使用这两个函数，我们可以更深入地研究这种复制机制。（具体输出取决于你的计算机，但你应该看到与下面类似的内容。）我们可以先创建一个长向量并修改它：\n\n\
    ```\nlibrary(pryr)\nrm(x) ; rm(y)\nmem_change(x <- 1:10000000)\n```\n\n## 2.31\
    \ kB\n\n```\naddress(x)\n```\n\n## [1] \"0x7fe426826a90\"\n\n```\nmem_change(x[1]\
    \ <- 6)\n```\n\n## 80 MB\n\n```\naddress(x)\n```\n\n## [1] \"0x7fe420000000\"\n\
    \n当我们给这个向量的第一个元素赋值时，我们看到整个向量都被复制了。这可能看起来很奇怪，因为我刚刚告诉过你，R 只会在必要时才复制向量，而这里我们只是修改了其中的一个元素，并且没有其他变量引用它。\n\
    \n这里发生复制的原因是，我们用来创建向量的表达式`1:10000000`创建了一个整数向量。我们赋给第一个元素的值`6`是一个浮点数（在 R 中称为“numeric”）。如果我们想要一个实际的整数，我们需要在数字后面写上`L`（代表“长整数”）：32\n\
    \n## 第 2 章 R 中的函数\n\n```\nclass(6)\n```\n\n## [1] \"numeric\"\n\n```\nclass(6L)\n\
    ```\n\n## [1] \"integer\"\n\n当我们将一个 numeric 值赋给一个整数向量时，R 不得不将整个向量转换为 numeric，这就是我们得到副本的原因：\n\
    \n```\nz <- 1:5\nclass(z)\n```\n\n## [1] \"integer\"\n\n```\nz[1] <- 6\nclass(z)\n\
    ```\n\n## [1] \"numeric\"\n\n如果我们在它被转换后再赋一个 numeric 值给它，就不会再得到副本：\n\n```\nmem_change(x[3]\
    \ <- 8)\n```\n\n## -1.14 kB\n\n```\naddress(x)\n```\n"
- fmt: "## [1] `\"0x7fe420000000\"`\n\nAll expression evaluations modify the memory\
    \ a little, up or down, but the change is much smaller than the entire vector,\
    \ so we can see that the vector isn’t being copied, and the address remains the\
    \ same.\n\n## Chapter 2 Functions in R\n\nIf we assign `x` to another variable,\
    \ we do not get a copy. We just have the two names refer to the same value:\n\n\
    ```r\nmem_change(y <- x)\n## 376 B\n\naddress(x)\n## [1] \"0x7fe420000000\"\n\n\
    address(y)\n## [1] \"0x7fe420000000\"\n```\n\nIf we change `x` again, though,\
    \ we need a copy to make the other vector point to the original, unmodified data:\n\
    \n```r\nmem_change(x[3] <- 8)\n## 80 MB\n\naddress(x)\n## [1] \"0x7fe430000000\"\
    \n\naddress(y)\n## [1] \"0x7fe420000000\"\n```\n\nBut after that copy, we can\
    \ again assign to `x` without making additional copies:\n\n```r\nmem_change(x[4]\
    \ <- 9)\n## 112 B\n\naddress(x)\n## [1] \"0x7fe430000000\"\n```\n\n## Chapter\
    \ 2 Functions in R\n\nWhen you assign to a variable in R, you are calling the\
    \ assignment function, ``<-``. When you assign to an element in a vector or list,\
    \ you are using the ``[<-`` function. But there is a whole class of such functions\
    \ you can use to make the appearance of modifying an object, without actually\
    \ doing it of course. These are called replacement functions and have names that\
    \ end in ``<-``. An example is the ``names<-`` function. If you have a vector\
    \ `x`, you can give its elements names using this syntax:\n\n```r\nx <- 1:4\n\
    x\n## [1] 1 2 3 4\n\nnames(x) <- letters[1:4]\nx\n## a b c d\n## 1 2 3 4\n\nnames(x)\n\
    ## [1] \"a\" \"b\" \"c\" \"d\"\n```\n\nThere are two different functions in play\
    \ here. The last expression, which gives us `x`’s names, is the `names` function.\
    \ The function we use to *assign* the names to `x` is the ``names<-`` function.\n\
    \nAny function you define whose name ends with ``<-`` becomes a replacement function,\
    \ and the syntax for it is that it evaluates whatever is on the right-hand side\
    \ of the assignment operator and assigns the result to the variable that it takes\
    \ as its argument.\n\nSo this syntax\n\n```r\nnames(x) <- letters[1:4]\n```\n\n\
    is translated into\n\n```r\nx <- `names<-`(x, letters[1:4])\n```\n\n## Chapter\
    \ 2 Functions in R\n\nNo values are harmed in the evaluation of this, but the\
    \ variable is set to the new value.\n\nWe can write our own replacement functions\
    \ using this syntax. There are just two requirements. The function name has to\
    \ end with ``<-``—so we need to quote the name when we assign to it—and the argument\
    \ for the value that goes to the right-hand side of the assignment has to be named\
    \ `value`. The last requirement is there, so replacement functions can take more\
    \ than two arguments.\n\nThe ``attr<-`` function is an example of this. Attributes\
    \ are key-value maps that can be associated with objects. You can get the attributes\
    \ associated with an object using the `attributes` function and set all attributes\
    \ with the ``attributes<-`` function, but you can assign individual attributes\
    \ using ``attr<-``. It takes three arguments, the object to modify, a `which`\
    \ parameter that is the name of the attribute to set, and the `value` argument\
    \ that goes to the right-hand side of the assignment. The `which` argument is\
    \ passed to the function on the left-hand side together with the object to modify:\n\
    \n```r\nx <- 1:4\nattributes(x)\n## NULL\n\nattributes(x) <- list(foo = \"bar\"\
    )\nattributes(x)\n## $foo\n## [1] \"bar\"\n\nattr(x, \"baz\") <- \"qux\"\nattributes(x)\n\
    ## $foo\n## [1] \"bar\"\n##\n## $baz\n## [1] \"qux\"\n```\n\nWe can write a replacement\
    \ function to make the tree construction we had earlier in the chapter slightly\
    \ more readable. Earlier, we constructed the tree like this:\n\n```r\ntree <-\
    \ make_node(\"root\",\n                make_node(\"C\", make_node(\"A\"),\n  \
    \                        make_node(\"B\")),\n                make_node(\"D\"))\n\
    ```\n\nbut we can make functions for setting the children of an object like this:\n\
    \n```r\n`left<-` <- function(node, value) {\n    node$left = value\n    node\n\
    }\n\n`right<-` <- function(node, value) {\n    node$right = value\n    node\n\
    }\n```\n\nand then construct the tree like this:\n\n```r\nA <- make_node(\"A\"\
    )\nB <- make_node(\"B\")\nC <- make_node(\"C\")\nD <- make_node(\"D\")\nroot <-\
    \ make_node(\"root\")\n\nleft(C) <- A\nright(C) <- B\nleft(root) <- C\nright(root)\
    \ <- D\n\ntree <- root\n```\n\n## Chapter 2 Functions in R\n\nTo see the result,\
    \ we can write a function for printing a tree. To keep the function simple, I\
    \ assume that either both children are `NULL` or both are trees. It is simple\
    \ to extend it to deal with trees that do not satisfy that; it just makes the\
    \ function a bit longer:\n\n```r\nprint_tree <- function(tree) {\n    build_string\
    \ <- function(node) {\n        if (is.null(node$left) && is.null(node$right))\
    \ {\n            node$name\n        } else {\n            left <- build_string(node$left)\n\
    \            right <- build_string(node$right)\n            paste0(\"(\", left,\
    \ \",\", right, \")\")\n        }\n    }\n    build_string(tree)\n}\n\nprint_tree(tree)\n\
    ## [1] \"((A,B),D)\"\n```\n\nThis function shows the tree in what is known as\
    \ the Newick format and doesn’t show the names of inner nodes, but you can see\
    \ the structure of the tree.\n\nThe order in which we build the tree using children\
    \ is important.\n\nWhen we set the children for root, we refer to the variable\
    \ `C`. If we set the children for `C` *after* we set the children for root, we\
    \ get the *old* version of `C`, not the new modified version:\n\n## Chapter 2\
    \ Functions in R\n\n```r\nA <- make_node(\"A\")\nB <- make_node(\"B\")\nC <- make_node(\"\
    C\")\nD <- make_node(\"D\")\nroot <- make_node(\"root\")\n\nleft(root) <- C\n\
    right(root) <- D\nleft(C) <- A\nright(C) <- B\n\ntree <- root\nprint_tree(tree)\n\
    ```"
