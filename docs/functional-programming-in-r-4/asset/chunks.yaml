- fmt: "# Functions in R\n\nThe next chapter contains a short introduction to functions\
    \ in R. Some parts you might already know, and so feel free to skip ahead, but\
    \ I give a detailed description of how functions are defined and used to ensure\
    \ that we are all on the same page. The following chapters then move on to more\
    \ complex issues.\n\n## Chapter 2: Functions in R\n\nIn this chapter, we cover\
    \ how to write functions in R. If you already know much of what is covered, feel\
    \ free to skip ahead. We will discuss the way parameters are passed to functions\
    \ as “promises,” a way of passing parameters known as lazy evaluation. If you\
    \ are not familiar with that but know how to write functions, you can jump forward\
    \ to that section. We will also cover how to write infix operators and replacement\
    \ functions, so if you do not know what those are, and how to write them, you\
    \ can skip ahead to those sections. If you are new to R functions, continue reading\
    \ from here.\n\n### Writing Functions in R\n\nYou create an R function using the\
    \ `function` keyword or, since R 4.1, the `\\()` syntax. For example, we can write\
    \ a function that squares numbers like this:\n\n```\nsquare <- function(x) x**2\n\
    ```\n\nor like this:\n\n```\nsquare <- \\(x) x**2\n```\n\nand then use it like\
    \ this:\n\n```\nsquare(1:5)\n## [1] 1 4 9 16 25\n```\n\n© Thomas Mailund 2023\
    \  \nT. Mailund, *Functional Programming in R 4*, https://doi.org/10.1007/978-1-4842-9487-1_2\n\
    \nThe shorter syntax, `\\(x) x**2`, is intended for so-called “lambda expressions,”\
    \ and the backslash notation is supposed to look like the Greek letter lambda,\
    \ λ. Lambda expressions are useful when we need to provide short functions as\
    \ arguments to other functions, which is something we return to in later chapters.\
    \ Usually, we use the `function()` syntax when defining reusable functions, and\
    \ I will stick to this notation in every case where we define and name a function\
    \ the way we did for `square` earlier.\n\nThe function we have written takes one\
    \ argument, `x`, and returns the result `x**2`. The return value of a function\
    \ is always the last expression evaluated in it. If you write a function with\
    \ a single expression, you can write it as earlier, but for more complex functions,\
    \ you will typically need several statements in it. If you do, you can put the\
    \ function’s body in curly brackets like this:\n\n```\nsquare <- function(x) {\n\
    \  x**2\n}\n```\n\nThe following function needs the curly brackets since it needs\
    \ three separate statements to compute its return value, one for computing the\
    \ mean of its input, one for getting the standard deviation, and a final expression\
    \ that returns the input scaled to be centered on the mean and having one standard\
    \ deviation.\n\n```\nrescale <- function(x) {\n  m <- mean(x)\n  s <- sd(x)\n\
    \  (x - m) / s\n}\n```\n\nThe first two statements are just there to define some\
    \ variables we can use in the final expression. This is typical for writing short\
    \ functions.\n\nVariables you assign to inside a function will only be visible\
    \ from inside the function. When the function completes its execution, the variables\
    \ cease to exist. From inside a function, you can see the so-called *local* variables—the\
    \ function arguments and the variables you assign to in the function body—and\
    \ you can see the so-called *global* variables—those assigned to outside of the\
    \ function. Outside of the function, however, you can only see the global variables.\
    \ At least that is a good way to think about which variables you can see at any\
    \ point in a program until we get to the gritty details in [Chapter 4](https://doi.org/10.1007/978-1-4842-9487-1_4).\
    \ For now, think in terms of global variables and local variables, where anything\
    \ you write outside a function is in the first category and can be seen by anyone,\
    \ and where function parameters and variables assigned to inside functions are\
    \ in the second category; see Figure [2-1](#index_split_000.html#p14). If you\
    \ have the same name for both a global and a local variable, as in the figure\
    \ where we have a global variable `x` and a function parameter `x`, then the name\
    \ always refers to the local variable.\n\n**Figure 2-1.** Local and global variables\n\
    \nAssignments are really also expressions. They return an object, the value that\
    \ is being assigned; they just do so quietly. R considers some expressions “invisible,”\
    \ and while they do evaluate to some value or other—all expressions do—R does\
    \ not print the result. Assignments are invisible in this way; they do return\
    \ to the value on the right-hand side of the assignment, but R makes the result\
    \ invisible. You can remove this invisibility by putting an assignment in parentheses.\
    \ The parentheses make R remove the invisibility of the expression result, so\
    \ you see the actual value:\n\n```\n(x <- 1:5)\n## [1] 1 2 3 4 5\n```\n\nYou can\
    \ also go the other way and make a value invisible. When you evaluate an expression,\
    \ R will print it:\n\n```\nx**2\n## [1] 1 4 9 16 25\n```\n\nbut if you put the\
    \ expression in a call to `invisible`, R will not print the result:\n\n```\ninvisible(x**2)\n\
    ```\n\nWe usually use assignments for their side effect, assigning a name to a\
    \ value, so you might not think of them as expressions, but everything you do\
    \ in R is actually an expression. That includes control structures like `if`-statements\
    \ and `for`-loops. They return values. They are actually functions themselves,\
    \ and they return values. If you evaluate an `if`-statement, you get the value\
    \ of the last expression in the branch it takes:\n\n```\nif (2 + 2 == 4) \"Brave\
    \ New World\" else \"1984\"\n## [1] \"Brave New World\"\n```\n\nIf you evaluate\
    \ a loop, you get the value `NULL` (and not the last expression in its body):\n\
    \n```\nx <- for (i in 1:10) i\nx\n## NULL\n```\n\nEven parentheses and subscripting\
    \ are functions. Parentheses evaluate to the value you put inside them (but stripped\
    \ of invisibility), and subscripting, `[...]` or `[[...]]`, evaluates to some\
    \ appropriate value on the data structure you are accessing (and you can define\
    \ how this will work for your own data structures if you want to).\n\nIf you want\
    \ to return a value from a function before its last expression, you can use the\
    \ `return` function. It might look like a keyword, but it *is* a function, and\
    \ you need to include the parentheses when you use it. Many languages will let\
    \ you return a value by writing:\n\n```\nreturn expression\n```\n\nNot R. In R,\
    \ you need to write:\n\n```\nreturn(expression)\n```\n\nIf you are trying to return\
    \ a value, this will not cause you much trouble. R will tell you that you have\
    \ a syntax error if you use the former and not the latter syntax. Where it can\
    \ be a problem is if you want to return from a function without providing a value\
    \ (in which case the function automatically returns `NULL`).\n\nIf you write something\
    \ like this:\n\n```\nf <- function(x) {\n  if (x < 0) return;\n  # Something else\
    \ happens here...\n}\n```\n\nyou will not return if `x` is negative. The `if`-expression\
    \ evaluates to the function `return`, which is not what you want. Instead, you\
    \ must write:\n\n```\nf <- function(x) {\n  if (x < 0) return();\n  # Something\
    \ else happens here...\n}\n```\n\nIf `x` is negative, we call `return()`, which\
    \ will return `NULL`. (To return a value, `val`, use `return(val)`).\n\n`return`\
    \ is usually used to exit a function early and isn’t used that much in most R\
    \ code. It is easier to return a value by just making it the last expression in\
    \ a function than it is to explicitly use `return`. But you can use it to return\
    \ early like this:\n\n```\nrescale <- function(x, only_translate) {\n  m <- mean(x)\n\
    \  translated <- x - m\n  if (only_translate) return(translated)\n  s <- sd(x)\n\
    \  translated / s\n}\n\nrescale(1:4, TRUE)\n## [1] -1.5 -0.5 0.5 1.5\n\nrescale(1:4,\
    \ FALSE)\n```"
  raw: 'The next chapter contains a short introduction to functions in R. Some parts
    you might already know, and so feel free to skip ahead, but I give a detailed
    description of how functions are defined and used to ensure that we are all on
    the same page. The following chapters then move on to more complex issues.


    **CHAPTER 2**


    **Functions in R**


    In this chapter, we cover how to write functions in R. If you already know much
    of what is covered, feel free to skip ahead. We will discuss the way parameters
    are passed to functions as “promises,” a way of passing parameters known as lazy
    evaluation. If you are not familiar with that but know how to write functions,
    you can jump forward to that section. We will also cover how to write infix operators
    and replacement functions, so if you do not know what those are, and how to write
    them, you can skip ahead to those sections. If you are new to R functions, continue
    reading from here.


    **Writing Functions in R**


    You create an R function using the function keyword or, since R 4.1, the


    \() syntax. For example, we can write a function that squares numbers like this:


    square *<* - **function**(x) x**2


    or like this:


    square *<* - *\*(x) x**2


    and then use it like this:


    square(1:5)


    ## [1] 1 4 9 16 25


    © Thomas Mailund 2023


    T. Mailund, *Functional Programming in R 4*[, https://doi.org/10.1007/978-1-4842-9487-1_2](https://doi.org/10.1007/978-1-4842-9487-1_2#DOI)


    Chapter 2 FunCtions in r


    The shorter syntax, \(x) x**2, is intended for so-called “lambda expressions,”
    and the backslash notation is supposed to look like the Greek letter lambda, λ.
    Lambda expressions are useful when we need to provide short functions as arguments
    to other functions, which is something we return to in later chapters. Usually,
    we use the function() syntax when defining reusable functions, and I will stick
    to this notation in every case where we define and name a function the way we
    did for square earlier.


    The function we have written takes one argument, x, and returns the result x**2\.
    The return value of a function is always the last expression evaluated in it.
    If you write a function with a single expression, you can write it as earlier,
    but for more complex functions, you will typically need several statements in
    it. If you do, you can put the function’s body in curly brackets like this:


    square *<* - **function**(x) {


    x**2


    }


    The following function needs the curly brackets since it needs three separate
    statements to compute its return value, one for computing the mean of its input,
    one for getting the standard deviation, and a final expression that returns the
    input scaled to be centered on the mean and having one standard deviation.


    rescale *<* - **function**(x) {


    m *<* - mean(x)


    s *<* - sd(x)


    (x - m) / s


    }


    The first two statements are just there to define some variables we can use in
    the final expression. This is typical for writing short functions.


    Chapter 2 FunCtions in r


    Variables you assign to inside a function will only be visible from inside the
    function. When the function completes its execution, the variables cease to exist.
    From inside a function, you can see the so-called *local* variables—the function
    arguments and the variables you assign to in the function body—and you can see
    the so-called *global* variables—those assigned to outside of the function. Outside
    of the function, however, you can only see the global variables. At least that
    is a good way to think about which variables you can see at any point in a program
    until we get to the gritty details in Chapt[er 4](https://doi.org/10.1007/978-1-4842-9487-1_4).
    For now, think in terms of global variables and local variables, where anything
    you write outside a function is in the first category and can be seen by anyone,
    and where function parameters and variables assigned to inside functions are in
    the second category; see Figure [2-1](#index_split_000.html#p14). If you have
    the same name for both a global and a local variable, as in the figure where we
    have a global variable x and a function parameter x, then the name always refers
    to the local variable.


    ***Figure 2-1.** Local and global variables*


    Assignments are really also expressions. They return an object, the value that
    is being assigned; they just do so quietly. R considers some expressions “invisible,”
    and while they do evaluate to some value or other—all expressions do—R does not
    print the result. Assignments are invisible in this way; they do return to the
    value on the right-hand side of the 5


    Chapter 2 FunCtions in r


    assignment, but R makes the result invisible. You can remove this invisibility
    by putting an assignment in parentheses. The parentheses make R remove the invisibility
    of the expression result, so you see the actual value: (x <- 1:5)


    ## [1] 1 2 3 4 5


    You can also go the other way and make a value invisible. When you evaluate an
    expression, R will print it:


    x**2


    ## [1] 1 4 9 16 25


    but if you put the expression in a call to invisible, R will not print the result:


    invisible(x**2)


    We usually use assignments for their side effect, assigning a name to a value,
    so you might not think of them as expressions, but everything you do in R is actually
    an expression. That includes control structures like if-statements and for-loops.
    They return values. They are actually functions themselves, and they return values.
    If you evaluate an if-statement, you get the value of the last expression in the
    branch it takes: **if** (2 + 2 == 4) "Brave New World" **else** "1984"


    ## [1] "Brave New World"


    If you evaluate a loop, you get the value NULL (and not the last expression in
    its body):


    x *<* - **for** (i **in** 1:10) i


    x


    ## NULL


    Chapter 2 FunCtions in r


    Even parentheses and subscripting are functions. Parentheses evaluate to the value
    you put inside them (but stripped of invisibility), and subscripting, [...] or
    [[...]], evaluates to some appropriate value on the data structure you are accessing
    (and you can define how this will work for your own data structures if you want
    to).


    If you want to return a value from a function before its last expression, you
    can use the return function. It might look like a keyword, but it *is* a function,
    and you need to include the parentheses when you use it. Many languages will let
    you return a value by writing


    return expression


    Not R. In R, you need to write


    return(expression)


    If you are trying to return a value, this will not cause you much trouble.


    R will tell you that you have a syntax error if you use the former and not the
    latter syntax. Where it can be a problem is if you want to return from a function
    without providing a value (in which case the function automatically returns NULL).


    If you write something like this:


    f *<* - **function**(x) {


    **if** (x *<* 0) **return**;


    # Something **else** happens here...


    }


    you will not return if x is negative. The if-expression evaluates to the function
    return, which is not what you want. Instead, you must write f *<* - **function**(x)
    {


    **if** (x *<* 0) **return**();


    # Something **else** happens here...


    }


    Chapter 2 FunCtions in r


    If x is negative, we call return(), which will return NULL. (To return a value,
    val, use return(val)).


    Return is usually used to exit a function early and isn’t used that much in most
    R code. It is easier to return a value by just making it the last expression in
    a function than it is to explicitly use return. But you can use it to return early
    like this:


    rescale *<* - **function**(x, only_translate) {


    m *<* - mean(x)


    translated *<* - x - m


    **if** (only_translate) return(translated)


    s *<* - sd(x)


    translated / s


    }


    rescale(1:4, TRUE)


    ## [1] -1.5 -0.5 0.5 1.5


    rescale(1:4, FALSE)'
  trans: "\n# R 语言中的函数\n\n下一章将简要介绍 R 语言中的函数。你可能已经熟悉其中部分内容，因此可以跳过直接阅读后续章节，但我会详细描述函数的定义与使用方法，以确保大家步调一致。后续章节会进一步探讨更复杂的问题。\n\
    \n## 第二章：R 语言中的函数\n\n本章将介绍如何在 R 中编写函数。如果你对大部分内容已有所了解，可以放心跳过。我们将讨论参数如何作为\"承诺\"\
    传递给函数——这种参数传递方式被称为惰性求值。如果你不熟悉这个概念但会编写函数，可以直接跳到该部分。我们还会介绍如何编写中缀运算符和替换函数，如果你不清楚这些是什么以及如何编写，也可以直接跳转到相关章节。如果你是\
    \ R 函数的新手，请从这里开始阅读。\n\n### 在 R 中编写函数\n\n你可以使用 `function` 关键字来创建 R 函数，或者从 R 4.1\
    \ 开始，也可以使用 `\\()` 语法。例如，我们可以这样编写一个计算平方的函数：\n\n```\nsquare <- function(x) x**2\n\
    ```\n\n或者这样写：\n\n```\nsquare <- \\(x) x**2\n```\n\n然后这样使用：\n\n```\nsquare(1:5)\n\
    ## [1] 1 4 9 16 25\n```\n\n© Thomas Mailund 2023  \nT. Mailund, *R 4 中的函数式编程*,\
    \ https://doi.org/10.1007/978-1-4842-9487-1_2\n\n较短的语法 `\\(x) x**2` 专为所谓的\"lambda\
    \ 表达式\"设计，反斜杠符号旨在模仿希腊字母 lambda（λ）。当我们需要将简短函数作为参数传递给其他函数时，lambda 表达式非常有用——我们将在后续章节中讨论这一点。通常，在定义可复用的函数时，我们使用\
    \ `function()` 语法，在定义并命名函数时（如之前的 `square`），我将坚持使用这种写法。\n\n我们编写的函数接受一个参数 `x`，并返回结果\
    \ `x**2`。函数的返回值始终是函数体内最后一个表达式的值。如果函数只有一个表达式，你可以像之前那样编写；但对于更复杂的函数，通常需要多条语句。这时，你可以将函数体放入花括号中，如下所示：\n\
    \n```\nsquare <- function(x) {\n  x**2\n}\n```\n\n下面的函数需要花括号，因为它需要三条独立的语句来计算返回值：第一条计算输入的均值，第二条获取标准差，最后一条返回以均值为中心、标准差为单位的缩放后输入值。\n\
    \n```\nrescale <- function(x) {\n  m <- mean(x)\n  s <- sd(x)\n  (x - m) / s\n\
    }\n```\n\n前两条语句仅用于定义一些可在最后一条表达式中使用的变量。这是编写短函数的典型做法。\n\n在函数内部赋值的变量仅在函数内部可见。当函数执行完毕后，这些变量将不复存在。从函数内部，你可以看到所谓的*局部*变量（函数参数和在函数体内赋值的变量），以及所谓的*全局*变量（在函数外部赋值的变量）。然而，在函数外部，你只能看到全局变量。至少在我们深入探讨[第\
    \ 4 章](https://doi.org/10.1007/978-1-4842-9487-1_4)的细节之前，这是一种理解程序中任意时刻可见变量的好方法。目前，我们暂且从全局变量和局部变量的角度思考：在函数外部编写的任何内容都属于第一类，所有人都能看到；而函数参数和在函数内部赋值的变量则属于第二类；参见图\
    \ 2-1。如果全局变量和局部变量同名（如图中全局变量 `x` 和函数参数 `x`），那么该名称始终指向局部变量。\n\n**图 2-1.** 局部变量与全局变量\n\
    \n赋值操作实际上也是表达式。它们会返回一个对象（即被赋的值），只是以静默方式返回。R 认为某些表达式是\"不可见的\"——虽然它们会像所有表达式一样求值得到某个值，但\
    \ R 不会打印结果。赋值操作正是以这种方式不可见；它们确实会返回赋值运算符右侧的值，但 R 使结果不可见。你可以将赋值语句放在括号中，从而移除这种不可见性。括号会让\
    \ R 移除表达式结果的不可见性，因此你能看到实际的值：\n\n```\n(x <- 1:5)\n## [1] 1 2 3 4 5\n```\n\n你也可以反其道而行之，使值变为不可见。通常，当你求值一个表达式时，R\
    \ 会打印它：\n\n```\nx**2\n## [1] 1 4 9 16 25\n```\n\n但如果你将表达式放入 `invisible` 函数调用中，R\
    \ 将不会打印结果：\n\n```\ninvisible(x**2)\n```\n\n我们通常利用赋值操作的副作用（为值赋予名称），因此你可能会忘记它们也是表达式；但事实上，你在\
    \ R 中执行的一切都是表达式。这包括像 `if` 语句和 `for` 循环这样的控制结构。它们都会返回值。它们实际上是函数本身，并且会返回值。如果你求值一个\
    \ `if` 语句，你会得到它所执行分支中最后一个表达式的值：\n\n```\nif (2 + 2 == 4) \"美丽新世界\" else \"一九八四\"\
    \n## [1] \"美丽新世界\"\n```\n\n如果你求值一个循环，你会得到值 `NULL`（而不是循环体中的最后一个表达式）：\n\n```\nx\
    \ <- for (i in 1:10) i\nx\n## NULL\n```\n\n甚至括号和下标操作也是函数。括号求值为你放入其中的值（但会剥离不可见性），而下标操作\
    \ `[...]` 或 `[[...]]` 则会求值为你所访问的数据结构上的某个适当值（如果你愿意，也可以为你自己的数据结构定义这种工作方式）。\n\n如果你希望在函数最后一个表达式之前返回一个值，可以使用\
    \ `return` 函数。它看起来可能像关键字，但*它*是一个函数，使用时需要包含括号。许多语言允许你这样写来返回值：\n\n```\nreturn expression\n\
    ```\n\n但 R 不行。在 R 中，你需要这样写：\n\n```\nreturn(expression)\n```\n\n如果你试图返回一个值，这不会造成太大麻烦。如果你使用前一种语法而非后一种，R\
    \ 会提示语法错误。真正可能出问题的情况是，当你希望从函数中返回但不提供值（此时函数会自动返回 `NULL`）时。\n\n如果你写成这样：\n\n```\n\
    f <- function(x) {\n  if (x < 0) return;\n  # 这里执行其他操作...\n}\n```\n\n当 `x` 为负数时，并不会返回。`if`\
    \ 表达式求值得到的是 `return` 函数本身，而非你期望的行为。相反，你必须写成：\n\n```\nf <- function(x) {\n  if\
    \ (x < 0) return();\n  # 这里执行其他操作...\n}\n```\n\n如果 `x` 为负数，我们会调用 `return()`，这将返回\
    \ `NULL`。（要返回某个值 `val`，请使用 `return(val)`。）\n\n`return` 通常用于提前退出函数，在大多数 R 代码中并不常用。相比显式使用\
    \ `return`，让函数最后一个表达式成为返回值更为简单。但你可以像这样用它提前返回：\n\n```\nrescale <- function(x, only_translate)\
    \ {\n  m <- mean(x)\n  translated <- x - m\n  if (only_translate) return(translated)\n\
    \  s <- sd(x)\n  translated / s\n}\n\nrescale(1:4, TRUE)\n## [1] -1.5 -0.5 0.5\
    \ 1.5\n\nrescale(1:4, FALSE)\n```\n"
- fmt: "## [1] -1.1618950 -0.3872983 0.3872983 1.1618950\n\nThis function has two\
    \ arguments, `x` and `only_translate`. Your functions can have any number of parameters.\
    \ When a function takes many arguments, however, it becomes harder to remember\
    \ in which order you have to put them. To get around that problem, R allows you\
    \ to provide the arguments to a function using their names. So the two function\
    \ calls earlier can also be written as\n\n`rescale(x = 1:4, only_translate = TRUE)`\n\
    \n`rescale(x = 1:4, only_translate = FALSE)`\n\n## Chapter 2 Functions in R\n\n\
    ### Named Parameters and Default Parameters\n\nIf you use named arguments, the\
    \ order doesn’t matter, so this is also equivalent to these function calls:\n\n\
    `rescale(only_translate = TRUE, x = 1:4)`\n\n`rescale(only_translate = FALSE,\
    \ x = 1:4)`\n\nYou can mix positional and named arguments. The positional arguments\
    \ have to come in the same order as used in the function definition, and the named\
    \ arguments can come in any order. All the following four function calls are equivalent:\n\
    \n`rescale(1:4, only_translate = TRUE)`\n\n`rescale(only_translate = TRUE, 1:4)`\n\
    \n`rescale(x = 1:4, TRUE)`\n\n`rescale(TRUE, x = 1:4)`\n\nWhen you provide a named\
    \ argument to a function, you don’t need to use the full parameter name. Any unique\
    \ prefix will do. So we could also have used the following two function calls:\n\
    \n`rescale(1:4, o = TRUE)`\n\n`rescale(o = TRUE, 1:4)`\n\nThis is convenient for\
    \ interactive work with R because it saves some typing, but I do not recommend\
    \ it when you are writing programs. It can easily get confusing, and if the author\
    \ of the function adds a new argument to the function with the same prefix as\
    \ the one you use, it will break your code. If the function author provides a\
    \ default value for that parameter, your code will *not* break if you use the\
    \ full argument name. Not breaking, in a situation like this, is a whole lot worse\
    \ than breaking, because the code will not do the right thing and you will not\
    \ be immediately aware of that.\n\n## Chapter 2 Functions in R\n\nNow, default\
    \ parameters are provided when the function is defined.\n\nWe could have given\
    \ `rescale` a default parameter for `only_translate` like this:\n\n```\nrescale\
    \ <- function(x, only_translate = FALSE) {\n  m <- mean(x)\n  translated <- x\
    \ - m\n  if (only_translate) return(translated)\n  s <- sd(x)\n  translated /\
    \ s\n}\n```\n\nThen, if we call the function, we only need to provide `x` if we\
    \ are happy with the default value for `only_translate`.\n\n```\nrescale(1:4)\n\
    ## [1] -1.1618950 -0.3872983 0.3872983 1.1618950\n```\n\nR makes heavy use of\
    \ default parameters. Many commonly used functions, such as plotting functions\
    \ and model fitting functions, have lots of arguments. These arguments let you\
    \ control in great detail what the functions do, making them very flexible, and\
    \ because they have default values, you usually only have to worry about a few\
    \ of them.\n\n### The “Gobble Up Everything Else” Parameter: “...”\n\nThere is\
    \ a special parameter all functions can take called `...`. This parameter is typically\
    \ used to pass parameters on to functions *called* *within* a function. To give\
    \ an example, we can use it to deal with missing values, `NA`, in the `rescale`\
    \ function.\n\n## Chapter 2 Functions in R\n\nWe can write (where I’m building\
    \ from the shorter version)\n\n```\nrescale <- function(x, ...) {\n  m <- mean(x,\
    \ ...)\n  s <- sd(x, ...)\n  (x - m) / s\n}\n```\n\nIf we give this function a\
    \ vector `x` that contains missing values, it will return `NA`:\n\n```\nx <- c(NA,\
    \ 1:3)\nrescale(x)\n## [1] NA NA NA NA\n```\n\nIt would also have done that before\
    \ because that is how the functions `mean` and `sd` work. But both of these functions\
