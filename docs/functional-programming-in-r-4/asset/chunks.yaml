    \nenvironment(g)\n## <environment: 0x7fe435b7a0a8>\n```\n\nAs we see, the environment\
    \ that we print inside the call to `f()` is the same as the environment associated\
    \ with the function we get as the result of the function call.\n\nIt is important\
    \ to note that a function’s environment differs from the local environment we\
    \ get when we *call* the function. The function’s environment is an existing environment\
    \ where we have defined the function, while the local environment is a new environment\
    \ created when we call the function. If that is clear, then the rule for how R\
    \ sets up the parent environment is simple enough: when you call a function, the\
    \ new local environment will get the function’s environment as its parent.\n\n\
    ## Chapter 4 Scope and Closures\n\nLet’s go through the preceding example in detail.\
    \ We start right after we have defined `f`; see Figure [4-8](#index_split_000.html#p88).\
    \ At this point, we only have the global environment (ignoring the chain of parents\
    \ after that) because we haven’t called any function yet, and thus we haven’t\
    \ created any local environments. In the global environment, we have a reference\
    \ to the new function—the variable `f` refers to the function object—and the function’s\
    \ environment is the global environment (where we defined it).\n\nWhen we call\
    \ `f`, we create a new environment for the function call, the parent of the new\
