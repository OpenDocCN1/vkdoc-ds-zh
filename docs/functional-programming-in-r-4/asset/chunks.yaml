    \n我们也可以为向量实现此函数。为了避免每次删除重复元素时都复制向量，可以将该函数拆分为两部分。首先，找出所有重复元素的索引，然后通过单次操作将这些索引从向量中删除：\n\
    \n```\nvector_rm_duplicates <- function(x) {\n  dup <- find_duplicates(x)\n  x[-dup]\n\
    }\n```\n\n`Vector_rm_duplicates(c(1, 1, 2, 2))`\n\n## [1] 1 2\n\nR 语言中已有一个用于查找重复元素的内置函数\
    \ `duplicated`，我们可以用它来实现 `find_duplicates`（该函数返回布尔向量，但我们可以使用 `which` 函数获取 `TRUE`\
    \ 值对应的索引）。不过，自己动手实现也是一个不错的练习。\n\n```\nfind_duplicates <- function(x, i = 1) {\n\
    \  if (i >= length(x)) return(c())\n  if (x[i] == x[i + 1]) c(i, find_duplicates(x,\
    \ i + 1)) else find_duplicates(x, i + 1)\n}\n```\n\n该结构与列表版本非常相似，但如果当前索引对应重复元素，则返回递归调用结果和当前索引；否则仅返回递归调用结果。\n\
    \n这个解决方案并不完美。每次我们将当前索引与递归结果合并创建索引向量时，都会进行一次复制，因此运行时间与结果长度呈二次关系。我们可以通过构建一个 `next`\
    \ 链表（而非索引向量），然后在删除重复元素的函数中将其转换为向量，再对向量 `x` 进行索引删除重复元素，从而将其转变为线性时间算法。这项工作留作练习。\n\
    \n作为另一个需要合并递归调用结果的递归函数示例，我们考虑计算树的大小。\n\n基本情况是树为空（值为 `NULL`），此时大小为 0。递归情况为左子树大小加上右子树大小再加\
