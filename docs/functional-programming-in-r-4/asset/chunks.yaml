    \ `%x%` <- `*` ``：\n\n```\n3 %x% 2\n```\n\n## [1] 6\n\n这里，我们使用了两次引号，第一次是为`%x%`获取一个可以赋值给它的变量名，第二次是获取乘法运算符`*`所指的函数。\n\
