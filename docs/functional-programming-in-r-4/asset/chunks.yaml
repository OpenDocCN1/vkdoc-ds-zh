    to zero, and then the count function, which it returns.


    When we call the counter function, it knows x because it is a closure, so it can
    evaluate x + 1, which it then assigns to x. This is where the problem is. The
    x used in evaluating x + 1 is found by searching up the environment chain, but
    the x the function assigns to is put in the counter function’s environment. Then
    the function returns, and that environment is gone. The next time counter is called,
    it is a new function instance, creating a new environment. The variable x from
    the make_counter function is never updated.


    When you use <-, you create a new local variable if it didn’t exist before. Even
    if the variable name is found deeper in the environment chain, it doesn’t matter.
    The assignment always is to the local environment.


    To assign to a variable deeper in the environment chain, you need to use the operator
    <<- instead. This operator will search through the environment chain, the same
    way as R does to figure out what expressions 87


    Chapter 4 SCope and CloSureS


    should evaluate to, and update the environment where it finds the variable (or
    add it to the global environment if it doesn’t find it anywhere in the environment
    chain).


    We can see what happens if we change the assignment operator in the example:


    Make_counter <- **function**() {


    x <- 0


    count <- **function**() {


    x <<- x + 1


    x


    }


    }


    counter <- make_counter()


    counter()


    ## [1] 1


    counter()


    ## [1] 2


    counter()


    ## [1] 3


    This time around, when we do the assignment, we find that there is an x in the
    enclosing environment, the x that was initialized when we called make_counter.
    Hence, the assignment is to that environment instead of to the local environment.
    Each time we call counter, we create a new function instance environment, but
    all the instances are linked to the same enclosing environment, so each time we
    call the function, we update the same environment.


    Chapter 4 SCope and CloSureS


    We can use this counter function together with the <<- operator to make a much
    simpler version of the depth_first_numbers function, where we do not need to pass
    data along in the recursive calls. We can create a table and a counter function
    in the outermost scope and simply use the counter and assign with <<- to the table:


    depth_first_numbers <- **function**(tree) {


    table <- c()


    counter <- make_counter()


    traverse_tree <- **function**(node) {


    **if** (is.null(node$left) && is.null(node$right)) {


    dfn <- counter()


    node$range <- c(dfn, dfn)


    table[node$name] <<- dfn


    node


    } **else** {


    left <- traverse_tree(node$left)


    right <- traverse_tree(node$right)


    new_node <- make_node(node$name, left, right)


    new_node$range <- c(left$range[1], right$range[2])


    new_node


    }


    }


    new_tree <- traverse_tree(tree)


    list(tree = new_tree, table = table)


    }


    result <- depth_first_numbers(tree)


    print_tree(result$tree)


    Chapter 4 SCope and CloSureS


    ## [1] "((A,B) ,D)"


    result$table


    ## A B D


    ## 1 2 3


    We still need to create a new tree here if we want to annotate all nodes with
    their depth-first-number ranges; we still cannot modify data, but we can use the
    variables in the outer scope inside the recursive function.


    **Lexical and Dynamic Scope**


    This rule for finding variable values, based on the environment where functions
    are defined, is called *lexical scoping* and is the most common standard for scopes.
    They are called that because you can, in principle, figure out what variables
    in an expression are defined where. You first check if the variables are set in
    the local environment, either local variables or function parameters. If not,
    you look at the enclosing code and check if the variable is in the environment.
    The enclosing code can be the global environment or a function. If it is a function
    and the variables are not defined, you work your way further out in the code where
    the function is defined. If the mapping from variables to values depended on where
    a function was *called* rather than where it was defined, something called *dynamic
    scope*, you couldn’t figure out what variables variable names were referring to
    just from reading the code where the function is defined.


    R supports both kinds of scope, with the lexical scope being the default (standard
    evaluation). Still, by modifying environment chains, you can get access to the
    calling function’s scope (in nonstandard evaluation). There are cases where nonstandard
    evaluation gives you cleaner interfaces to your code, but you should stick to
    standard lexical scope in the majority of your projects, as it is by far the easiest
    to work with.


    Chapter 4 SCope and CloSureS


    One common case where dynamic scope and nonstandard evaluation are worth the effort
    is when you need to evaluate expressions where some of your data is in variables
    and some in a data frame. There, you get a cleaner interface if you can use the
    data frame variables as if they were standard variables. So, I will give you an
    example of how you can achieve that.


    We will write a function that takes an expression and a data frame as input, and
    it will evaluate the expression in an environment where it first looks for variables
    in the data frame. If it cannot find it there, it will look in the caller’s (not
    the function’s) environment.


    It looks like this:


    df_eval <- **function**(expr, df = list()) {


    x <- substitute(expr) *# strip expr of env; now just* *quoted expr*


    env <- list2env(df, parent = parent.frame())


    eval(x, env)


    }


    We use the substitute() function to strip expr of its environment.


    It turns it into a raw expression, just as what we can create with quote().


    I store it in a variable x to make a point in a little bit; normally, I would
    probably call it expr.


    Anyway, the next thing we do is create a new environment from the data frame.
    Data frames are also lists, so list2env() will create an environment where each
    variable in the data frame is stored as an environment variable. The parent of
    the new environment is parent.


    frame(), which is the caller’s environment. Setting it up this way puts the data
    frame first, so we will pick variables we can find there before we look in the
    parent frame. If we don’t see a variable in the data frame, we will look in the
    caller’s environment. Finally, we evaluate x in the new environment.


    Chapter 4 SCope and CloSureS


    Let’s set some data up for an experiment:


    x <- 1:3


    y <- "foo"


    df <- data.frame(y = 2:4, z = 3:5)


    We have an x and a y in the caller’s environment and y and z in a data frame.
    We want the function to pick this x rather than the one inside df_eval, and if
    we call df_eval with df as the data frame, we shouldn’t pick the variable y but
    rather the y from the data frame.


    Let’s check it out. First, call it with just x:


    df_eval(x)


    ## [1] 1 2 3


    We didn’t provide a data frame, so we got the default, but the point of this call
    was to show that we picked the x in the global environment and not the x inside
    the function.


    Now, let’s see if it will pick the y from the data frame over the variable here:


    df_eval(y+z, df)'
  trans: "\n## [1] 1\n\n我们可以解包该函数，看看具体发生了什么。当我们创建计数器时，调用 `make_counter` 函数，该函数创建了一个环境，其中\
    \ `x` 被设置为 `0`，然后返回 `count` 函数。\n\n当我们调用计数器函数时，它会通过闭包知道 `x` 的存在，因此可以计算 `x + 1`，并将结果赋值给\
