    \n当我们给这个向量的第一个元素赋值时，我们看到整个向量都被复制了。这可能看起来很奇怪，因为我刚刚告诉过你，R只会在必要时才复制向量，而这里我们只是修改了其中的一个元素，并且没有其他变量引用它。\n\
