    ## This is very very very much fun\n\n我们使用`replicate`函数来实现这一点。它做同样的事情：重复计算一个表达式固定次数。使用`%x%`中缀运算符可能会使代码更具可读性，这取决于你的喜好。\n\
    \n## 第2章 R中的函数\n\n出于诚实的考虑，我必须提一下，除了参数顺序交换之外，我们不仅仅是给`replicate`取了个新名字。`%x%`运算符的工作方式略有不同。在`%x%`中，`expr`参数在调用`replicate`时会被求值。所以，如果我们用一个采样随机数的函数调用`%x%`，我们会得到相同的重复结果`num`次；不会采样`num`次。\n\
