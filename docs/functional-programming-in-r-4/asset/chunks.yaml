    is equal to *n ×*( *n −* 1)! with a base case 1! = 1\. It is very simple to write
    a recursive function to return the factorial, but we cannot just return the result
    of a recursive call. We need to multiply the result we get from the recursive
    call with *n*:


    Chapter 3 pure FunCtional programming factorial *<* - **function**(n) {


    **if** (n == 1) 1


    **else** n * factorial(n - 1)


    }


    Here, I am assuming that *n* is an integer and *n* 0. If it is not, the recursion
    doesn’t move us closer to the base case, and we will (in principle) keep going
    forever. So here is another case where we need to be careful to make sure that
    when we call recursively, we are actually making progress on solving the problem.
    In this function, I am only guaranteeing this for positive integers.


    In most algorithms, we will need to do something to the results of recursive calls
    to complete the computation. As another example, besides factorial, we can consider
    a function for removing duplicates in a sequence. Duplicates are elements that
    are equal to the next element in the sequence. It is similar to the unique function
    built into R except that this function only removes repeated elements that are
    right next to each other.


    To write it, we follow the recipe for writing recursive functions. What is the
    base case? An empty sequence doesn’t have duplicates, so the result is just an
    empty sequence. The same is the case for a sequence with only one element. Such
    a sequence does not have duplicated elements, so the result is also the input
    sequence. If we always know that the input to our function has at least one element,
    we don’t have to worry about the first base case, but if the function might be
    called on empty sequences, we need to take care of both. For sequences with more
    than one element, we need to check if the first element equals the next. If it
    does, we should recurse on the sequence that leaves out the first element, thus
    removing a duplicated element. If it does not, we should return the first element
    together with the rest of the sequence where duplicates have been removed.


    Chapter 3 pure FunCtional programming A solution using “next lists” could look
    like this:


    rm_duplicates *<* - **function**(x) {


    *# Base cases*


    **if** (is.null(x)) return(NULL)


    **if** (is.null(x$rest)) return(x)


    *# Recursive case*


    **if** (x$element == x$rest$element) rm_duplicates(x$rest) **else** next_list(x$element,
    rm_duplicates(x$rest))


    }


    x *<* - next_list(1, next_list(1, next_list(2, next_list(2)))) rm_duplicates(x)'
  trans: "\n## [1] 假\n\n我将判空、提取第一个元素以及获取序列剩余部分的操作，分别隐藏在三个函数中：`is_empty`、`first`和`rest`。对于向量，可以这样实现：\n\
    \n```\nis_empty <- function(x) length(x) == 0\nfirst <- function(x) x[1]\nrest\
    \ <- function(x) x[-1]\n```\n\n如果向量的长度为 0，则视为空。第一个元素自然就是第一个元素。`rest`函数返回除第一个元素之外的所有内容（通过\
    \ `-1` 索引实现）。\n\n现在这个搜索算法可以运行，但你绝不应照搬我刚才写的 `rest` 函数那样的代码。我们通过切片方式提取向量剩余部分时，R\
    \ 会复制那个子向量。第一次调用 `rest`，得到的是去掉第一个元素的整个向量；第二次调用，得到的是去掉前两个元素的整个向量，依此类推。这会导致运算量大约达到向量长度平方的一半。因此，虽然搜索算法本应是线性时间复杂度的，但我们提取向量剩余部分的方式却使其变成了平方时间复杂度。\n\
    \n在实践中，这其实无关紧要。R 对递归调用的深度有限制，而在性能成为问题之前，我们早就触达这个上限了。我们会在本章末尾再讨论这些问题，但目前，出于简洁性的考虑，既然我们可以实现线性时间算法，就尽量避开平方时间算法。\n\
    \n那些为递归而非循环而设计的语言，通常以另一种方式来表示序列——这种方式下，你可以在常数时间内获取序列的剩余部分。我们可以实现这样一个版本的序列：将序列中的元素表示为一个结构，该结构包含一个指向剩余部分的\
    \ `next` 变量。\n\n我们将这种结构称为*next 列表*。这是*链表*的一个例子，但链表有不同的变体，而这种只需引用序列的剩余部分，所以我将其称为*next\
    \ 列表*。我们可以使用下面的函数将单个元素转换为这种序列：\n\n```\nnext_list <- function(element, rest = NULL)\
    \ list(element = element, rest = rest)\n```\n\n然后通过嵌套调用该函数来构造序列，这与上一章中构造树的方式类似：\n\
    \n```\nx <- next_list(1, next_list(2, next_list(3, next_list(4))))\n```\n\n对于这种结构，我们可以如下定义搜索算法所需的函数：\n\
    \n```\nnl_is_empty <- function(nl) is.null(nl)\nnl_first <- function(nl) nl$element\n\
    nl_rest <- function(nl) nl$rest\n```\n\n实际的搜索算法是这样的：\n\n```\nnl_lin_search <-\
    \ function(element, sequence) {\n  if (nl_is_empty(sequence)) FALSE\n  else if\
    \ (nl_first(sequence) == element) TRUE\n  else nl_lin_search(element, nl_rest(sequence))\n\
    }\n```\n\n这运行良好，并且是线性时间，但构造列表有点繁琐。我们应该写一个函数，用于将向量转换为 next 列表。要构造这样的函数，我们可以再次采用递归思路。如果向量的长度为零（即基准情形），那么\
    \ next 列表应为 `NULL`。否则，我们希望构造一个 next 列表：第一个元素是向量的第一个元素，列表的剩余部分则是向量剩余部分对应的 next\
    \ 列表：\n\n```\nvector_to_next_list <- function(x) {\n  if (is_empty(x)) NULL\n\
    \  else next_list(first(x), vector_to_next_list(rest(x)))\n}\n```\n\n这也能运行，但显然，我们只是把性能问题从搜索算法转移到了\
    \ `vector_to_next_list` 函数上。该函数仍然需要获取向量的剩余部分，而这需要复制。从向量到 next 列表的转换是平方时间复杂度的。我们需要一种方法来获取向量的剩余部分，且无需复制。\n\
    \n一种解决方案是跟踪向量中的索引。如果将该索引视为向量真正起始位置的索引，那么只需增加索引即可获取向量的剩余部分。我们可以使用这些辅助函数：\n\n```\n\
    i_is_empty <- function(x, i) i > length(x)\ni_first <- function(x, i) x[i]\n```\n\
    \n并这样编写转换函数：\n\n```\ni_vector_to_next_list <- function(x, i = 1) {\n  if (i_is_empty(x,\
    \ i)) NULL\n  else next_list(i_first(x, i), i_vector_to_next_list(x, i + 1))\n\
    }\n```\n\n当然，使用同样的技巧，我们本可以直接用索引来实现搜索算法：\n\n```\ni_lin_search <- function(element,\
    \ sequence, i = 1) {\n  if (i_is_empty(sequence, i)) FALSE\n  else if (i_first(sequence,\
    \ i) == element) TRUE\n  else i_lin_search(element, sequence, i + 1)\n}\n```\n\
    \n使用索引实现时，我们实际上无法写出一个 `rest` 函数。编写一个返回向量和索引对的函数，操作起来不如直接递增索引本身方便。\n\n当你对序列编写递归函数时，所需的关键抽象包括：检查序列是否为空、获取第一个元素以及获取序列的剩余部分。使用针对这三种操作的函数，并不能真正帮助我们，除非这些函数能让我们处理不同类型的数据序列。实现这样的抽象是可能的，但在本书中我们不再深入探讨。从现在起，我们将直接在递归函数中实现这些抽象。如果这样做，线性搜索算法就简化为：\n\
    \n```\nlin_search <- function(element, sequence, i = 1) {\n  if (i > length(sequence))\
    \ FALSE\n  else if (sequence[i] == element) TRUE\n  else lin_search(element, sequence,\
    \ i + 1)\n}\n```\n\n## 递归函数的结构\n\n递归函数都遵循相同的模式：找出易于解决的基准情形，并理解如何将问题分解成可通过递归解决的更小子问题。这种思路在算法设计理论中被称为“分治”。将问题归约成更小的子问题是难点所在。需要注意两点：这些子问题是否*真的*更小了？如何组合子问题的解来解决更大的问题？\n\
    \n在我们至今研究的线性搜索中，我们知道递归调用处理的是更小的子问题，因为每次调用面对的都是更短的序列。无论我们是用列表实现函数，还是使用向量索引，当我们递归调用时，我们处理的都是更短的序列。对于处理序列的函数来说，通常都是如此。如果你知道每次递归调用都离基准情形更近一步，你就知道函数最终会完成计算。\n\
    \n递归并不总是只针对序列中除了第一个元素以外的所有部分。例如，对于二分搜索，我们可以通过每次递归调用将问题规模减半，从而在已排序的序列中以对数时间完成搜索。算法是这样的：如果序列为空，则找不到要搜索的元素，返回\
    \ `FALSE`。如果序列非空，检查中间元素是否是目标元素，如果是则返回 `TRUE`。如果不是，检查它是否小于目标元素：如果是，则对序列的后半部分递归调用；如果不是，则对序列的前半部分递归调用。\n\
    \n这听起来很简单，但初次尝试实现时，往往会导致在同一序列上反复递归，永远无法接近完成。这种情况出现在我们选择前半部分或后半部分时不够仔细时。以下实现就是错误的。如果你搜索\
    \ `0` 或 `5`，将会陷入无限递归：\n\n```\nbinary_search <- function(element, x, first = 1,\
    \ last = length(x)) {\n  if (last < first) return(FALSE) # empty sequence\n  middle\
    \ <- (last - first) %/% 2 + first\n  if (element == x[middle]) {\n    TRUE\n \
    \ } else if (element < x[middle]) {\n    binary_search(element, x, first, middle)\n\
    \  } else {\n    binary_search(element, x, middle, last)\n  }\n}\n```\n\n原因是中间索引等于\
    \ `first`，导致你递归调用时面对的是与之前相同的问题，而非更简单的问题。解决方法是，在递归调用的范围中绝不要包含 `middle`——毕竟，只有在确定\
    \ `middle` 不是目标元素时，你才会调用递归：\n\n```\nbinary_search <- function(element, x, first\
    \ = 1, last = length(x)) {\n  if (last < first) return(FALSE) # empty sequence\n\
    \  middle <- (last - first) %/% 2 + first\n  if (element == x[middle]) {\n   \
    \ TRUE\n  } else if (element < x[middle]) {\n    binary_search(element, x, first,\
    \ middle - 1)\n  } else {\n    binary_search(element, x, middle + 1, last)\n \
    \ }\n}\n```\n\n关键在于必须确保所有递归调用确实是在处理更小的子问题。对于序列，这通常意味着要确保递归调用处理的是更短的序列。\n\n对于树这种本质上是递归的数据结构——树要么是叶子节点，要么是包含若干子节点的内部节点，而这些子节点本身也是树——我们会在子树上递归调用，从而保证每次递归调用处理的都是更小的子问题。我们在第一章中编写的\
    \ `node_depth` 函数就是一个例子：\n\n```\nnode_depth <- function(tree, name, depth = 0)\
    \ {\n  if (is.null(tree)) return(NA)\n  if (tree$name == name) return(depth)\n\
    \  left <- node_depth(tree$left, name, depth + 1)\n  if (!is.na(left)) return(left)\n\
    \  right <- node_depth(tree$right, name, depth + 1)\n  return(right)\n}\n```\n\
    \n基准情形处理空树——空树不包含我们要找的节点，因此直接返回 `NA`。如果树非空，要么我们找到了目标节点，可以返回结果；要么则对左子树递归调用。如果找到了目标节点，就返回结果；否则，返回对右子树递归调用的结果（无论是否找到，如果节点根本不在树中，最终结果就是\
    \ `NA`）。\n\n我们到目前为止编写的函数，都没有组合子问题的解。这些函数都是搜索函数，返回的结果要么是直接找到的，要么是某个递归函数返回的结果。并非总是这么简单，通常你需要对递归调用的结果进行处理，才能解决更大的问题。\n\
    \n一个简单的例子是计算阶乘。数字 *n* 的阶乘（*n*!）等于 *n* × (*n* − 1)!，基准情形为 `1! = 1`。编写递归函数计算阶乘非常简单，但我们不能直接返回递归调用的结果，而需要将递归调用的结果乘以\
    \ *n*：\n\n```\nfactorial <- function(n) {\n  if (n == 1) 1\n  else n * factorial(n\
    \ - 1)\n}\n```\n\n这里，我假设 *n* 是整数且 *n* > 0。如果不是这样，递归就不会向基准情形靠近，原则上会无限进行下去。因此，这又是一个需要小心确保递归调用确实在推进问题求解的例子。在这个函数中，我只对正整数保证了这一点。\n\
    \n在大多数算法中，我们需要对递归调用的结果进行某些操作，才能完成计算。除了阶乘，另一个例子是去除序列中重复元素的函数。重复元素是指序列中与下一个元素相等的元素。这个函数类似于\
    \ R 内建的 `unique` 函数，但不同之处在于它只移除相邻的重复元素。\n\n编写这个函数时，我们遵循递归函数的编写步骤。基准情形是什么？空序列没有重复元素，所以结果就是空序列。只有一个元素的序列也是如此：这样的序列没有重复元素，因此结果就是输入序列本身。如果我们始终知道函数的输入至少包含一个元素，就不必担心第一种基准情形；但如果函数可能被调用处理空序列，我们就需要同时处理这两种情况。对于包含多个元素的序列，我们需要检查第一个元素是否与下一个元素相等。如果是，则对去掉第一个元素后的序列递归调用，从而移除一个重复元素。如果不是，则返回第一个元素，以及已经去除重复后的剩余序列。\n\
    \n使用“next 列表”的解法如下：\n\n```\nrm_duplicates <- function(x) {\n  # Base cases\n \
    \ if (is.null(x)) return(NULL)\n  if (is.null(x$rest)) return(x)\n  # Recursive\
    \ case\n  if (x$element == x$rest$element) rm_duplicates(x$rest)\n  else next_list(x$element,\
    \ rm_duplicates(x$rest))\n}\n\nx <- next_list(1, next_list(1, next_list(2, next_list(2))))\n\
    rm_duplicates(x)\n```\n"
- fmt: "## `$element`\n\n## [1] 1\n\n## `$rest`\n\n## `$rest$element`\n\n## [1] 2\n\
    \n## `$rest$rest`\n\n## [1] NULL\n\nTo get a solution to the general problem,\
    \ we have to combine the smaller solution we get from the recursive call with\
    \ information in the larger problem. If the first element is equal to the first\
    \ element we get back from the recursive call, we have a duplicate and should\
    \ just return the result of the recursive call; if not, we need to combine the\
    \ first element with the next list from the recursive call.\n\nWe can also implement\
    \ this function for vectors. To avoid copying vectors each time we remove a duplicate,\
    \ we can split that function into two parts. First, we find the indices of all\
    \ duplicates, and then we remove these from the vector in a single operation:\n\
    \n```\nvector_rm_duplicates <- function(x) {\n  dup <- find_duplicates(x)\n  x[-dup]\n\
    }\n```\n\n`Vector_rm_duplicates(c(1, 1, 2, 2))`\n\n## [1] 1 2\n\nR already has\
    \ a built-in function for finding duplicates, called `duplicated`, and we could\
    \ implement `find_duplicates` using it (it returns a boolean vector, but we can\
    \ use the function `which` to get the indices of the `TRUE` values). It is a good\
    \ exercise to implement it ourselves, though.\n\n```\nfind_duplicates <- function(x,\
    \ i = 1) {\n  if (i >= length(x)) return(c())\n  if (x[i] == x[i + 1]) c(i, find_duplicates(x,\
    \ i + 1)) else find_duplicates(x, i + 1)\n}\n```\n\nThe structure is very similar\
    \ to the list version, but here we return the result of the recursive call together\
    \ with the current index if it is a duplicate and just the result of the recursive\
    \ call otherwise.\n\nThis solution isn’t perfect. Each time we create an index\
    \ vector by combining it with the recursive result, we are making a copy so the\
    \ running time will be quadratic in the length of the result. We can turn it into\
    \ a linear time algorithm in the output as well by making a `next` list instead\
    \ of a vector of the indices and then translate that into a vector in the remove\
    \ duplicates function before we index into the vector `x` to remove the duplicates.\
    \ I will leave that as an exercise.\n\nAs another example of a recursive function\
    \ where we need to combine results from recursive calls, we can consider computing\
    \ the size of a tree.\n\nThe base case is when it is empty (it is `NULL`), where\
    \ the size is zero. The recursive case is the size of the left tree plus the size\
    \ of the right tree plus one for the node:\n\n```\nsize_of_tree <- function(node)\
    \ {\n  if (is.null(node)) 0\n  else size_of_tree(node$left) + size_of_tree(node$right)\
    \ + 1\n}\n```\n\n```\nmake_node <- function(name, left = NULL, right = NULL) list(name\
    \ = name, left = left, right = right)\n```\n\n```\ntree <- make_node(\"root\"\
    ,\n                  make_node(\"C\", make_node(\"A\"),\n                    \
    \        make_node(\"B\")),\n                  make_node(\"D\"))\n```\n\n`size_of_tree(tree)`\n\
    \n## [1] 5\n\nIf I wanted to remember the size of subtrees so I didn’t have to\
    \ recompute them, I could attempt something like this:\n\n```\nset_size_of_subtrees\
    \ <- function(node) {\n  if (is.null(node)) return(0)  # We can't save anything\
    \ in NULL\n  # Compute the size if we don't have it\n  if (is.null(node$size))\
    \ {\n    left_size <- set_size_of_subtrees(node$left)\n    right_size <- set_size_of_subtrees(node$right)\n\
    \    node$size <- left_size + right_size + 1\n  }\n  return(node$size)\n}\n```\n\
    \nbut remember that data in R cannot be changed. If I run this function on a tree,\
    \ it would create nodes that knew the size of a subtree, but these nodes would\
    \ be copies and not the nodes in the tree I call the function on:\n\n`set_size_of_subtrees(tree)`\n\
    \n## [1] 5\n\n`tree$size`\n\n## NULL\n\nTo actually remember the sizes, I would\
    \ have to construct a whole new tree where the nodes knew their size. So I would\
    \ need this function:\n\n```\n# Handles both NULL and nodes that know their size\n\
    get_size <- function(node) if (is.null(node)) 0 else node$size\n\nset_size_of_subtrees\
    \ <- function(node) {\n  if (is.null(node)) return(NULL)\n  # Update children\n\
    \  node$left <- set_size_of_subtrees(node$left)\n  node$right <- set_size_of_subtrees(node$right)\n\
    \  # Set size\n  node$size <- get_size(node$left) + get_size(node$right) + 1\n\
    \  return(node)\n}\n```\n\n```\ntree <- set_size_of_subtrees(tree)\ntree$size\n\
    ```"
