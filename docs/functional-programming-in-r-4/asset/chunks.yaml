    see many examples of this kind of functions in later chapters.


    When we call f with a parameter a, we get a function back that will add a to its
    argument:


    f(2)(2)


    ## [1] 4


    Chapter 2 FunCtions in r


    We can create a list of functions from this f:


    ff *<* - vector("list", 4)


    **for** (i **in** 1:4) {


    ff[[i]] *<* - f(i)


    }


    ff


    ## [[1]]


    ## function(b) a + b


    ## <bytecode: 0x7fe446ad68a8>


    ## <environment: 0x7fe446a07ca0>


    ##


    ## [[2]]


    ## function(b) a + b


    ## <bytecode: 0x7fe446ad68a8>


    ## <environment: 0x7fe446ad71e8>


    ##


    ## [[3]]


    ## function(b) a + b


    ## <bytecode: 0x7fe446ad68a8>


    ## <environment: 0x7fe446ad7098>


    ##


    ## [[4]]


    ## function(b) a + b


    ## <bytecode: 0x7fe446ad68a8>


    ## <environment: 0x7fe446ad6f48>


    Here, ff contains four functions, and the idea is that the first of these adds
    1 to its argument, the second adds 2, and so on.


    Chapter 2 FunCtions in r


    If we call the functions in ff, however, weird stuff happens: ff[[1]](1)


    ## [1] 5


    When we get the element ff[[1]], we get the first function we created in the loop.
    If we substitute into f the value we gave in the call, this is **function**(b)
    i + b


    The parameter a from f has been set to the parameter we gave it, i, but i has
    not been evaluated at this point!


    When we call the function, the expression is evaluated, in the global scope, but
    there i now has the value 4 because that is the last value it was assigned in
    the loop. The value of i was 1 when we called it to create the function, but it
    is 5 when the expression is actually evaluated.


    This also means that we can change the value of i before we evaluate one of the
