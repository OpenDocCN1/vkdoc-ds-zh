- '# 第 1 章：引言


  欢迎阅读 *《R 4 中的函数式编程》*。我撰写这本书的初衷，是希望提供超越大多数 R 教材典型入门水平（即将函数视为封装可重用指令的简单构造，在需要执行这些指令时进行调用）的教学材料。在诸如
  R 这样的语言中，函数远不止于此。它们本身就是对象，你可以像处理其他对象一样将其视为数据、创建、操作并传递。学会这一点将使你成为一名更高效的 R 语言编程者。


  R 语言是一种多范式语言，融合了过程式编程、面向对象编程和函数式编程的元素。过程式编程侧重于希望计算机执行的指令——如相加这些数字、将结果存入变量、循环遍历列表等。面向对象编程则侧重于你操作的数据类型、可对其执行的操作，以及操作后数据如何变化。如果你对
  R 语言的这些方面感兴趣，我撰写了另一本由 Apress 出版的著作 *《R 中的高级面向对象编程》*，或许正合你意。


  函数式编程是第三种编程风格，其重点在于转换。函数将数据从输入转换为输出，通过组合这些转换，你可以从简单函数构建出涉及数据处理的复杂管道。在函数式编程中，函数本身被视为数据，就像其他数据一样，你可以编写将函数作为输入并生成（其他）函数作为输出的转换。因此，你可以编写简单函数，然后（通过其他函数）对它们进行修改，并以多种方式组合，从而构建完整的程序。


  R 编程语言支持过程式编程、面向对象编程和函数式编程，但它主要是一种函数式语言。不过，它并非“纯”函数式语言。纯函数式语言不允许你通过更改参数值来修改程序状态，也不允许函数产生副作用（因此需要各种技巧来处理程序输入和输出）。R
  语言在一定程度上接近“纯”函数式语言。通常，数据是不可变的，因此函数内部对数据的修改通常不会改变函数外部数据的状态。但 R 确实允许副作用，例如打印数据或绘制图形，当然也允许变量改变值。


  *纯*函数没有副作用，因此使用相同输入调用的函数始终返回相同输出。纯函数因此更易于调试和推理，因为它们可以独立地进行分析，不依赖于其被调用的上下文。R 语言并不保证你编写的函数是纯函数，但你可以仅使用纯函数来编写大部分程序。通过保持代码的纯函数性，你将编写出更健壮、且更易于在需要时修改的代码。你应该将不纯的函数集中到程序的一小部分中。这些函数通常是那些需要采样随机数据或产生输出（文本或图形）的函数。如果你知道不纯函数所在的位置，你就知道在修改代码时何时需要格外小心。




  '
- "# R 语言中的函数\n\n下一章将简要介绍 R 语言中的函数。你可能已经熟悉其中部分内容，因此可以跳过直接阅读后续章节，但我会详细描述函数的定义与使用方法，以确保大家步调一致。后续章节会进一步探讨更复杂的问题。\n\
  \n## 第二章：R 语言中的函数\n\n本章将介绍如何在 R 中编写函数。如果你对大部分内容已有所了解，可以放心跳过。我们将讨论参数如何作为\"承诺\"传递给函数——这种参数传递方式被称为惰性求值。如果你不熟悉这个概念但会编写函数，可以直接跳到该部分。我们还会介绍如何编写中缀运算符和替换函数，如果你不清楚这些是什么以及如何编写，也可以直接跳转到相关章节。如果你是\
  \ R 函数的新手，请从这里开始阅读。\n\n## 在 R 中编写函数\n\n你可以使用 `function` 关键字来创建 R 函数，或者从 R 4.1 开始，也可以使用\
  \ `\\()` 语法。例如，我们可以这样编写一个计算平方的函数：\n\n```\nsquare <- function(x) x**2\n```\n\n或者这样写：\n\
  \n```\nsquare <- \\(x) x**2\n```\n\n然后这样使用：\n\n```\nsquare(1:5)\n## [1] 1 4 9 16\
  \ 25\n```\n\n© Thomas Mailund 2023  \nT. Mailund, *R 4 中的函数式编程*, https://doi.org/10.1007/978-1-4842-9487-1_2\n\
  \n较短的语法 `\\(x) x**2` 专为所谓的\"lambda 表达式\"设计，反斜杠符号旨在模仿希腊字母 lambda（λ）。当我们需要将简短函数作为参数传递给其他函数时，lambda\
  \ 表达式非常有用——我们将在后续章节中讨论这一点。通常，在定义可复用的函数时，我们使用 `function()` 语法，在定义并命名函数时（如之前的 `square`），我将坚持使用这种写法。\n\
  \n我们编写的函数接受一个参数 `x`，并返回结果 `x**2`。函数的返回值始终是函数体内最后一个表达式的值。如果函数只有一个表达式，你可以像之前那样编写；但对于更复杂的函数，通常需要多条语句。这时，你可以将函数体放入花括号中，如下所示：\n\
  \n```\nsquare <- function(x) {\n  x**2\n}\n```\n\n下面的函数需要花括号，因为它需要三条独立的语句来计算返回值：第一条计算输入的均值，第二条获取标准差，最后一条返回以均值为中心、标准差为单位的缩放后输入值。\n\
  \n```\nrescale <- function(x) {\n  m <- mean(x)\n  s <- sd(x)\n  (x - m) / s\n}\n\
  ```\n\n前两条语句仅用于定义一些可在最后一条表达式中使用的变量。这是编写短函数的典型做法。\n\n在函数内部赋值的变量仅在函数内部可见。当函数执行完毕后，这些变量将不复存在。从函数内部，你可以看到所谓的*局部*变量（函数参数和在函数体内赋值的变量），以及所谓的*全局*变量（在函数外部赋值的变量）。然而，在函数外部，你只能看到全局变量。至少在我们深入探讨[第\
  \ 4 章](https://doi.org/10.1007/978-1-4842-9487-1_4)的细节之前，这是一种理解程序中任意时刻可见变量的好方法。目前，我们暂且从全局变量和局部变量的角度思考：在函数外部编写的任何内容都属于第一类，所有人都能看到；而函数参数和在函数内部赋值的变量则属于第二类；参见图\
  \ 2-1。如果全局变量和局部变量同名（如图中全局变量 `x` 和函数参数 `x`），那么该名称始终指向局部变量。\n\n**图 2-1.** 局部变量与全局变量\n\
  \n赋值操作实际上也是表达式。它们会返回一个对象（即被赋的值），只是以静默方式返回。R 认为某些表达式是\"不可见的\"——虽然它们会像所有表达式一样求值得到某个值，但\
  \ R 不会打印结果。赋值操作正是以这种方式不可见；它们确实会返回赋值运算符右侧的值，但 R 使结果不可见。你可以将赋值语句放在括号中，从而移除这种不可见性。括号会让\
  \ R 移除表达式结果的不可见性，因此你能看到实际的值：\n\n```\n(x <- 1:5)\n## [1] 1 2 3 4 5\n```\n\n你也可以反其道而行之，使值变为不可见。通常，当你求值一个表达式时，R\
  \ 会打印它：\n\n```\nx**2\n## [1] 1 4 9 16 25\n```\n\n但如果你将表达式放入 `invisible` 函数调用中，R\
  \ 将不会打印结果：\n\n```\ninvisible(x**2)\n```\n\n我们通常利用赋值操作的副作用（为值赋予名称），因此你可能会忘记它们也是表达式；但事实上，你在\
  \ R 中执行的一切都是表达式。这包括像 `if` 语句和 `for` 循环这样的控制结构。它们都会返回值。它们实际上是函数本身，并且会返回值。如果你求值一个\
  \ `if` 语句，你会得到它所执行分支中最后一个表达式的值：\n\n```\nif (2 + 2 == 4) \"美丽新世界\" else \"一九八四\"\n\
  ## [1] \"美丽新世界\"\n```\n\n如果你求值一个循环，你会得到值 `NULL`（而不是循环体中的最后一个表达式）：\n\n```\nx <- for\
  \ (i in 1:10) i\nx\n## NULL\n```\n\n甚至括号和下标操作也是函数。括号求值为你放入其中的值（但会剥离不可见性），而下标操作 `[...]`\
  \ 或 `[[...]]` 则会求值为你所访问的数据结构上的某个适当值（如果你愿意，也可以为你自己的数据结构定义这种工作方式）。\n\n如果你希望在函数最后一个表达式之前返回一个值，可以使用\
  \ `return` 函数。它看起来可能像关键字，但*它*是一个函数，使用时需要包含括号。许多语言允许你这样写来返回值：\n\n```\nreturn expression\n\
  ```\n\n但 R 不行。在 R 中，你需要这样写：\n\n```\nreturn(expression)\n```\n\n如果你试图返回一个值，这不会造成太大麻烦。如果你使用前一种语法而非后一种，R\
  \ 会提示语法错误。真正可能出问题的情况是，当你希望从函数中返回但不提供值（此时函数会自动返回 `NULL`）时。\n\n如果你写成这样：\n\n```\nf\
  \ <- function(x) {\n  if (x < 0) return;\n  # 这里执行其他操作...\n}\n```\n\n当 `x` 为负数时，并不会返回。`if`\
  \ 表达式求值得到的是 `return` 函数本身，而非你期望的行为。相反，你必须写成：\n\n```\nf <- function(x) {\n  if (x\
  \ < 0) return();\n  # 这里执行其他操作...\n}\n```\n\n如果 `x` 为负数，我们会调用 `return()`，这将返回 `NULL`。（要返回某个值\
  \ `val`，请使用 `return(val)`。）\n\n`return` 通常用于提前退出函数，在大多数 R 代码中并不常用。相比显式使用 `return`，让函数最后一个表达式成为返回值更为简单。但你可以像这样用它提前返回：\n\
  \n```\nrescale <- function(x, only_translate) {\n  m <- mean(x)\n  translated <-\
  \ x - m\n  if (only_translate) return(translated)\n  s <- sd(x)\n  translated /\
  \ s\n}\n\nrescale(1:4, TRUE)\n## [1] -1.5 -0.5 0.5 1.5\n\nrescale(1:4, FALSE)\n\
  ```\n\n\n\n## [1] -1.1618950 -0.3872983 0.3872983 1.1618950\n\n该函数有两个参数：`x` 和 `only_translate`。你的函数可以包含任意数量的参数。然而，当函数需要很多参数时，记住它们的传入顺序就会变得困难。为解决这个问题，R\
  \ 语言允许你使用参数名称来向函数提供参数。因此，前面的两次函数调用也可以写成：\n\n`rescale(x = 1:4, only_translate = TRUE)`\n\
  \n`rescale(x = 1:4, only_translate = FALSE)`\n\n## 第 2 章 R 语言中的函数\n\n## 命名参数与默认参数\n\
  \n如果使用命名参数，顺序就不重要了，因此以下函数调用也是等价的：\n\n`rescale(only_translate = TRUE, x = 1:4)`\n\
  \n`rescale(only_translate = FALSE, x = 1:4)`\n\n你可以混合使用位置参数和命名参数。位置参数必须按照函数定义中的顺序出现，而命名参数则可以按任意顺序排列。以下四个函数调用都是等价的：\n\
  \n`rescale(1:4, only_translate = TRUE)`\n\n`rescale(only_translate = TRUE, 1:4)`\n\
  \n`rescale(x = 1:4, TRUE)`\n\n`rescale(TRUE, x = 1:4)`\n\n当你为函数提供命名参数时，不必使用完整的参数名。任何唯一的前缀都可以。因此，我们也可以使用以下两种函数调用：\n\
  \n`rescale(1:4, o = TRUE)`\n\n`rescale(o = TRUE, 1:4)`\n\n这在进行 R 的交互式工作时很方便，因为它可以节省一些打字量，但在编写程序时我不建议这样做。这样做很容易造成混淆，而且如果函数的作者在函数中添加了一个与你所用前缀相同的新参数，你的代码就会出错。如果函数作者为该参数提供了默认值，那么只要你使用完整的参数名，你的代码就*不会*出错。在这种情况下，不出错比出错更糟糕，因为代码不会执行正确的操作，而你却无法立即察觉到。\n\
  \n## 第 2 章 R 语言中的函数\n\n现在来看默认参数，它们是在函数定义时提供的。\n\n我们本可以像这样为 `rescale` 函数中的 `only_translate`\
  \ 参数提供一个默认值：\n\n```\nrescale <- function(x, only_translate = FALSE) {\n  m <- mean(x)\n\
  \  translated <- x - m\n  if (only_translate) return(translated)\n  s <- sd(x)\n\
  \  translated / s\n}\n```\n\n这样，如果我们调用该函数，并且对 `only_translate` 的默认值感到满意，就只需要提供 `x`\
  \ 参数。\n\n```\nrescale(1:4)\n## [1] -1.1618950 -0.3872983 0.3872983 1.1618950\n```\n\
  \nR 语言大量使用了默认参数。许多常用的函数，例如绘图函数和模型拟合函数，都有很多参数。这些参数让你能够非常精细地控制函数的行为，使它们非常灵活，并且由于它们有默认值，通常你只需要关注其中少数几个参数。\n\
  \n### “吞噬一切其他参数”的参数：“...”\n\n所有函数都可以接受一个特殊的参数，称为 `...`。该参数通常用于将参数传递给*在*函数*内部调用*的其他函数。举例来说，我们可以利用它来处理\
  \ `rescale` 函数中的缺失值 `NA`。\n\n## 第 2 章 R 语言中的函数\n\n我们可以编写如下代码（这里我是在较短的版本基础上构建）：\n\
  \n```\nrescale <- function(x, ...) {\n  m <- mean(x, ...)\n  s <- sd(x, ...)\n \
  \ (x - m) / s\n}\n```\n\n如果我们向这个函数传递一个包含缺失值的向量 `x`，它将返回 `NA`：\n\n```\nx <- c(NA,\
  \ 1:3)\nrescale(x)\n## [1] NA NA NA NA\n```\n\n之前这样做也会导致相同的结果，因为 `mean` 和 `sd` 函数就是这样工作的。但这两个函数都接受一个额外的参数\
  \ `na.rm`，该参数会让它们在计算之前移除所有 `NA` 值。现在，我们的 `rescale` 函数也能做到这一点：\n\n```\nrescale(x,\
  \ na.rm = TRUE)\n## [1] NA -1 0 1\n```\n\n输出中的第一个值仍然是 `NA`。对一个 `NA` 值进行缩放不可能得到其他结果。但其余部分都是缩放后的值，在计算均值和标准差时，那个\
  \ `NA` 已被忽略。\n\n`...` 参数允许一个函数接受任何命名参数。如果你编写的函数没有它，那么该函数只能接受预先确定的参数；但如果你添加了这个参数，它就能接受任何命名参数：\n\
  \n```\nf <- function(x) x\ng <- function(x, ...) x\nf(1:4, foo = \"bar\")\n```\n\
  \n## 第 2 章 R 语言中的函数\n\n```\n## Error in f(1:4, foo = \"bar\"): unused argument (foo\
  \ = \"bar\")\ng(1:4, foo = \"bar\")\n## [1] 1 2 3 4\n```\n\n如果你随后用 `...` 作为参数调用了另一个函数，那么第一个函数不识别的所有参数都会被传递给第二个函数：\n\
  \n```\nf <- function(...) list(...)\ng <- function(x, y, ...) f(...)\ng(x = 1, y\
  \ = 2, z = 3, w = 4)\n## $z\n## [1] 3\n##\n## $w\n## [1] 4\n```\n\n在前面的例子中，函数 `f`\
  \ 从 `...` 创建了一个命名元素的列表，正如你所见，它获取了函数 `g` 没有显式接受的参数。\n\n使用 `...` 并不特别安全。通常很难弄清楚它在特定代码段中实际上做了什么。传递给其他函数的内容取决于第一个函数显式接受哪些参数，而当你使用\
  \ `...` 调用第二个函数时，你会传递其中的所有参数。如果你调用的函数不知道如何处理它们，就会出现错误：\n\n```\nf <- function(w)\
  \ w\ng <- function(x, y, ...) f(...)\ng(x = 1, y = 2, z = 3, w = 4)\n## Error in\
  \ f(...): unused argument (z = 3)\n```\n\n## 第 2 章 R 语言中的函数\n\n在 `rescale` 函数中，显式添加\
  \ `na.rm` 参数会好得多。\n\n尽管如此，`...` 在 R 语言中仍被频繁使用。这尤其是因为许多函数带有非常多的默认参数，如果将这些参数全部添加到调用它们的函数中，将会非常繁琐且容易出错。此外，在特化泛型函数时，这也是添加参数的最佳方式——泛型函数是另一本书《高级\
  \ R 面向对象编程》（本人所著）中的主题。\n\n## 惰性求值\n\n函数调用中使用的表达式在传递给函数之前不会被求值。大多数常见语言采用所谓的传值语义，这意味着在函数被调用之前，所有传递给函数参数的表达式都会被求值。而在\
  \ R 语言中，其语义是“按承诺调用”，也称为“惰性求值”。\n\n当你调用一个函数并将表达式作为其参数时，这些表达式并不会在此时被求值。函数接收到的不是求值结果，而是实际的表达式，这些表达式被称为“承诺”（它们是对求值的承诺，当你需要时可以得到一个值），因此有了术语“按承诺调用”。这些表达式只有在实际需要时才被求值，因此也有了术语“惰性求值”。\n\
  \n这对函数的运行方式产生了几个影响。首先，函数中未使用的表达式不会被求值：\n\n```\nf <- function(a, b) a\nf(2, stop(\"\
  error if evaluated\"))\n## [1] 2\nf(stop(\"error if evaluated\"), 2)\n## Error in\
  \ f(stop(\"error if evaluated\"), 2): error if evaluated\n```\n\n## 第 2 章 R 语言中的函数\n\
  \n如果你有一个参数只有在特定上下文中才有意义，那么只要只在满足这些必要条件时才引用它，将其作为参数就是足够安全的。\n\n这对于参数的默认值也非常有用。这些默认值在函数的作用域内被求值，因此你可以编写依赖于其他参数的默认值：\n\
  \n```\nf <- function(a, b = a) a + b\nf(a = 2)\n```\n\n\n\n## 1. 4\n\n然而，这*并不*意味着所有表达式都在函数的作用域内求值。我们将在[第\
  \ 4 章，b](https://doi.org/10.1007/978-1-4842-9487-1_4)中讨论作用域，但现在，你可以将其视为两个作用域：全局变量所在的全局作用域，以及包含参数和局部变量的函数作用域。\n\
  \n如果你像这样调用一个函数：\n\n`f(a = 2, b = a)`\n\n并且期望 `b` 在函数内部与 `a` 相同，那么你会得到一个错误。\n\n如果幸运的话，当没有名为\
  \ `a` 的全局变量时，你会得到一个运行时错误。如果不幸，恰好*存在*一个名为 `a` 的全局变量，那么 `b` 就会被赋值为该值；而如果你期望它被设为 `2`，你的代码就会给出错误的结果。\n\
  \n不过，默认参数可以是使用其他函数参数的表达式，这是安全的。默认参数在函数被调用后才求值，此时它们可以访问其他参数。然而，在调用函数时使用的表达式，无法看到函数内部的局部变量，只能看到调用作用域中的变量。\n\
  \n### 第 2 章 R 语言中的函数\n\n**图 2-2.** 参数与默认参数的求值位置 请参考图 2-2。我们有一个函数 `f`，它接受两个参数 `a`\
  \ 和 `b`，其中 `b` 的默认值为 `2*a`。如果我们以 `f(2*a, b = 2*a)` 的形式调用它，那么两个参数都是表达式，R 会知道它们必须在全局作用域中求值，此时\
  \ `a` 是列表 `1 2 3 4 5`，并且没有 `b`。在我们查看参数之前，这两个参数都不会被求值；但当我们查看时，两者都会被求值，并且由于它们都是 `2*a`\
  \ 且 `a` 指向全局变量 `a`，因此得到相同的值。然而，如果我们以 `f(2*a)` 的形式调用 `f`，从而使 `b` 使用默认值，情况就不同了。在函数调用内部，`a`\
  \ 仍然指向需要在全局作用域中求值的表达式 `2*a`，但 `b`（同样指向表达式 `2*a`）将在*局部*作用域中求值。因此，如果我们对 `b` 求值，我们首先会求值参数\
  \ `a` 得到 `2*a`（使用全局变量 `a` 求值）`2 4 6 8 10`，然后使用这个局部变量 `a` 求值 `2*a`，得到 `4 8 12 16\
  \ 20`。\n\n所以，尽管调用函数时参数尚未求值，但当你访问它们时就会被求值。如果是默认参数，则在函数内部求值；如果是在函数调用中提供的参数，则在调用处（函数被调用的地方）外部求值。\n\
  \n### 第 2 章 R 语言中的函数\n\n这也意味着，你不能仅仅通过更改局部变量来改变表达式的求值结果：\n\n```\na <- 4\nf <- function(x)\
  \ {\n  a <- 2\n  x\n}\nf(1 + a)\n## [1] 5\n```\n\n在这个例子中，表达式 `1 + a` 在 `f` 内部求值，但表达式中的\
  \ `a` 是 `f` 外部的 `a`，而不是 `f` 内部的局部变量 `a`。\n\n这当然是符合预期的。如果表达式真的在函数的作用域内求值，那么当你用一个表达式调用函数时，你将完全无法预知其求值结果，因为它会取决于函数可能使用的任何局部变量。\n\
  \n由于表达式在调用作用域而非函数作用域中求值，因此你通常不会注意到传值调用（call-by-value）与传承诺调用（call-by-promise）之间的区别。不过，在某些情况下，如果你不小心，这种区别可能会带来麻烦。\n\
  \n举个例子，我们可以考虑这个函数：\n\n`f <- function(a) function(b) a + b`\n\n如果你不习惯，这看起来可能有点奇怪，但它是一个返回另一个函数的函数。在后续章节中，我们会看到很多这类函数的例子。\n\
  \n当我们用参数 `a` 调用 `f` 时，我们会得到一个将 `a` 加到其参数上的函数：\n\n```\nf(2)(2)\n## [1] 4\n```\n\n\
  ### 第 2 章 R 语言中的函数\n\n我们可以基于这个 `f` 创建一个函数列表：\n\n```\nff <- vector(\"list\", 4)\n\
  for (i in 1:4) {\n  ff[[i]] <- f(i)\n}\nff\n## [[1]]\n## function(b) a + b\n## <bytecode:\
  \ 0x7fe446ad68a8>\n## <environment: 0x7fe446a07ca0>\n##\n## [[2]]\n## function(b)\
  \ a + b\n## <bytecode: 0x7fe446ad68a8>\n## <environment: 0x7fe446ad71e8>\n##\n##\
  \ [[3]]\n## function(b) a + b\n## <bytecode: 0x7fe446ad68a8>\n## <environment: 0x7fe446ad7098>\n\
  ##\n## [[4]]\n## function(b) a + b\n## <bytecode: 0x7fe446ad68a8>\n## <environment:\
  \ 0x7fe446ad6f48>\n```\n\n这里，`ff` 包含了四个函数，它们的意图是：第一个函数对其参数加 `1`，第二个加 `2`，以此类推。\n\
  \n### 第 2 章 R 语言中的函数\n\n然而，当我们调用 `ff` 中的函数时，奇怪的事情发生了：\n\n```\nff[[1]](1)\n## [1]\
  \ 5\n```\n\n当我们获取元素 `ff[[1]]` 时，得到的是我们在循环中创建的第一个函数。如果我们将调用 `f` 时传入的值代入，它应该是 `function(b)\
  \ i + b`。\n\n`f` 的参数 `a` 已被设为我们传入的参数 `i`，但此时 `i` 尚未被求值！\n\n当我们调用这个函数时，表达式在全局作用域中被求值，而此时的\
  \ `i` 值为 `4`，因为这是它在循环中被赋予的最后一个值。我们创建函数时 `i` 的值是 `1`，但表达式实际被求值时它变成了 `5`。\n\n这也意味着，我们可以在求值某个函数之前更改\
  \ `i` 的值，这会使其与我们在创建函数时预期的值不同：\n\n```\ni <- 1\nff[[2]](1)\n## [1] 2\n```\n\n这种惰性求值只在第一次调用函数时生效。如果我们再次更改\
  \ `i` 并调用该函数，得到的值与第一次求值时相同：\n\n```\ni <- 2\nff[[2]](1)\n## [1] 2\n```\n\n### 第 2\
  \ 章 R 语言中的函数\n\n我们可以通过循环遍历这些函数并求值来看到这一效果：\n\n```\nresults <- vector(\"numeric\"\
  , 4)\nfor (i in 1:4) {\n  results[i] <- ff[[i]](1)\n}\nresults\n## [1] 5 2 4 5\n\
  ```\n\n我们已经对前两个函数求过值了，因此它们被固定在了第一次求值时的结果。另外两个函数得到了预期的功能，但仅仅是因为我们在求值函数的循环中设置了变量 `i`。如果我们使用了不同的循环变量，就不会这么幸运了。\n\
  \n这个问题源于函数包含一个未求值的表达式，且该表达式依赖于外部作用域中的变量。不过，如果你想利用函数式语言的优势，返回函数的函数并不罕见。这也是允许变量改变值的后果——出于类似原因，大多数函数式编程语言都不允许变量改变值。然而，仅仅通过避免\
  \ `for` 循环，你并不能完全避免这个问题。如果你调用的函数为你进行了循环，你未必能控制它们如何执行，最终可能陷入同样的境地。\n\n避免问题的方法是强制对参数进行求值。一旦你对其求值，它就会记住该值，问题就不复存在了。\n\
  \n你可以通过将参数写成一个单独的语句来实现这一点。\n\n这样会对它求值。不过，最好使用 `force` 函数，以明确表明你正在这样做。它实际上只是将表达式返回给你，因此其效果与直接写参数完全相同，但代码能更清楚地表明你为何这样做。\n\
  \n### 第 2 章 R 语言中的函数\n\n如果你这样做，问题就消失了：\n\n```\nf <- function(a) {\n  force(a)\n\
  \  function(b) a + b\n}\nff <- vector(\"list\", 4)\nfor (i in 1:4) {\n  ff[[i]]\
  \ <- f(i)\n}\nff[[1]](1)\n## [1] 2\ni <- 1\nff[[2]](1)\n```\n\n\n\n"
- "# [1] 3\n\n## 函数没有名称\n\n在讨论函数定义时，我想强调的最后一点是：函数本身并没有名称。变量才有名称，变量可以指向函数，但这是两个不同的概念。\n\
  \n在许多语言，比如 Java、Python 或 C++ 中，当你定义一个函数时，同时也会给它一个名称。即便在允许的情况下，你也需要借助特殊的语法才能定义一个没有名称的函数。\n\
  \n但在 R 语言中并非如此。在 R 里，函数没有名称，当你定义它们时，并没有赋予它们名字。之前我们使用过的所有函数，都是通过在定义处将它们赋值给变量来命名的。但我们并非必须这样做。实际上，是\
  \ `function(...) ...` 这个语法定义了函数。无论我们是否将其赋值给变量，都是在定义一个函数。\n\n### 第 2 章 R 语言中的函数\n\
  \n我们可以像这样定义一个函数并立即调用它：`(function(x) x²)(2)`\n\n## [1] 4\n\n当然，我们通常不会这样做。在任何需要定义匿名函数并立即调用的场景下，我们大可直接使用函数体。对于想要复用的函数，我们*必须*给它一个名称，以便能够再次调用它。\n\
  \n然而，定义函数的语法并不强制我们给函数命名。当你开始编写高阶函数（即接受其他函数作为输入或返回函数的函数）时，这种特性会非常便利。\n\n这类高阶函数是函数式编程的重要组成部分，我们在本书后面会经常遇到它们。\n\
  \n## 向量化函数\n\nR 语言中的表达式是向量化的。当你编写一个表达式时，它会隐式地作用于值的向量，而不是单个值。即使是只涉及数字的简单表达式，本质上也是向量运算，只不过这些向量的长度为\
  \ 1。\n\n对于更长的向量，表达式会按元素逐个进行计算。因此，如果你有向量 `x` 和 `y`，只需写成 `x - y` 就可以实现第二个向量元素减去第一个向量元素的操作：\n\
  \n```\nx <- 1:5\ny <- 6:10\nx - y\n```\n\n## [1] -5 -5 -5 -5 -5\n\n如果向量的长度不同，较短的向量会根据需要被重复多次。这就是为什么你可以将一个数与一个向量相乘，例如：\n\
  \n```\n2 * x\n```\n\n## [1] 2 4 6 8 10\n\n这里，`2` 是长度为 1 的向量，`x` 是长度为 5 的向量，`2` 被重复了五次。如果较长向量的长度不是较短向量长度的整数倍，你会收到一个警告，通常应尽量避免这种情况。不过语义是一样的：R\
  \ 会尽可能多次地重复较短的向量，直到与较长向量长度匹配。\n\n```\nx <- 1:6\ny <- 1:3\nx - y\n```\n\n## [1] 0\
  \ 0 0 3 3 3\n\n根据函数的编写方式，它也可以用在向量化表达式中。只要函数调用的结果是一个向量，R 就乐意将其用于向量表达式。但这与函数对向量按元素进行操作并非完全相同。这样的函数我们可以称之为*向量化*函数。\n\
  \n大多数数学函数，如 `sqrt`、`log`、`cos` 和 `sin`，都是向量化的，你可以在表达式中使用它们：\n\n```\nlog(1:3) - sqrt(1:3)\n\
  ```\n\n## [1] -1.0000000 -0.7210664 -0.6334385\n\n如果你自己编写的函数的主体仅包含向量化表达式，那么该函数也会是向量化的：\n\
  \n```\nf <- function(a, b) log(a) - sqrt(b)\nf(1:3, 1:3)\n```\n\n## [1] -1.0000000\
  \ -0.7210664 -0.6334385\n\n我们在本书中编写的第一个函数 `square` 也是一个向量化函数。函数 `scale` 同样如此，尽管它内部使用的\
  \ `mean` 和 `sd` 函数并非向量化函数；它们接收向量输入，但返回的是整个向量的汇总统计量，而不是对向量分量进行操作。\n\n使用了控制结构的函数通常不会是向量化的。\n\
  \n我们可以编写一个比较函数，如果第一个参数小于第二个参数则返回 -1，如果第二个参数大于第一个参数则返回 1，否则返回 0，如下所示：\n\n```\ncompare\
  \ <- function(x, y) {\n  if (x < y) {\n    -1\n  } else if (y < x) {\n    1\n  }\
  \ else {\n    0\n  }\n}\n```\n\n这个函数对于单个值工作良好，但不适用于向量。问题在于 `if` 表达式只会查看逻辑向量 `x <\
  \ y` 的第一个元素。（没错，`x < y` 是一个向量，因为 `<` 是一个向量化函数。）\n\n为了处理 if 表达式，我们可以使用 `ifelse` 函数来绕过这个问题。这是一个向量化函数，其行为类似于\
  \ if-else 表达式：\n\n```\ncompare <- function(x, y) {\n  ifelse(x < y, -1, ifelse(y\
  \ < x, 1, 0))\n}\ncompare(1:6, 1:3)\n```\n\n## [1] 0 0 0 1 1 1\n\n情况并非总是简单到可以用 `ifelse`\
  \ 替换 if 语句。大多数情况下可以，但当不能时，我们可以改用 `Vectorize` 函数。这个函数接受一个可操作单个值的函数，并将其转换为能按元素处理向量的函数。\n\
  \n举个例子，我们可以使用之前的 `compare` 函数并对其进行向量化：\n\n```\ncompare <- function(x, y) {\n  if\
  \ (x < y) {\n    -1\n  } else if (y < x) {\n    1\n  } else {\n    0\n  }\n}\ncompare\
  \ <- Vectorize(compare)\ncompare(1:6, 1:3)\n```\n\n## [1] 0 0 0 1 1 1\n\n默认情况下，`Vectorize`\
  \ 会对函数的所有参数进行向量化。例如，假设我们想要一个缩放函数，它不按同一个向量的均值和标准差来缩放该向量中的所有变量，而是使用另一个向量的均值和标准差：\n\
  \n```\nScale_with <- function(x, y) {\n  (x - mean(y)) / sd(y)\n}\n```\n\n这个函数在其第一个参数上已经是向量化的了，因为它仅由一个向量化表达式组成，但如果对其使用\
  \ `Vectorize`，反而会破坏它：\n\n```\nscale_with(1:6, 1:3)\n```\n\n## [1] -1 0 1 2 3 4\n\
  \n```\nscale_with <- Vectorize(scale_with)\nscale_with(1:6, 1:3)\n```\n\n## [1]\
  \ NA NA NA NA NA NA\n\n用 `Vectorize` 创建的函数对 `x` 和 `y` 都是向量化的，这意味着它会按分量对它们进行操作。在缩放时，该函数只看到\
  \ `y` 的一个分量，而不是整个向量。结果会得到一个缺失值向量 NA，因为单个值的标准差是未定义的。\n\n我们可以通过显式告诉 `Vectorize` 哪些参数需要向量化来解决这个问题——在本例中，只有参数\
  \ `x`：\n\n```\nScale_with <- function(x, y) {\n  (x - mean(y)) / sd(y)\n}\nscale_with\
  \ <- Vectorize(scale_with, vectorize.args = \"x\")\nscale_with(1:6, 1:3)\n```\n\n\
  ## [1] -1 0 1 2 3 4\n\n简单的函数通常已经是向量化的，或者可以通过 `ifelse` 轻松实现向量化，但对于更复杂的函数，则需要用到 `Vectorize`\
  \ 函数。\n\n举个例子，我们可以考虑一个树形数据结构，以及一个用于计算命名节点深度的函数——节点深度定义为到根节点的距离。为简单起见，我们只考虑二叉树。\n\
  \n我们可以使用列表来实现树：\n\n```\nMake_node <- function(name, left = NULL, right = NULL) list(name\
  \ = name, left = left, right = right)\n\ntree <- make_node(\"root\",\n         \
  \         make_node(\"C\", make_node(\"A\"),\n                            make_node(\"\
  B\")),\n                  make_node(\"D\"))\n```\n\n要计算节点深度，我们可以递归地遍历树：\n\n```\n\
  node_depth <- function(tree, name, depth = 0) {\n  if (is.null(tree)) return(NA)\n\
  \  if (tree$name == name) return(depth)\n  left <- node_depth(tree$left, name, depth\
  \ + 1)\n  if (!is.na(left)) return(left)\n  right <- node_depth(tree$right, name,\
  \ depth + 1)\n  return(right)\n}\n```\n\n这并非一个特别复杂的函数，但它比 `scale_with` 函数更难向量化。就其本身而言，它对单个名称运行良好：\n\
  \n```\nnode_depth(tree, \"D\")\n```\n\n## [1] 1\n\n```\nnode_depth(tree, \"A\")\n\
  ```\n\n\n\n## [1] 2\n\n但如果你在一个名称序列上调用它，你会得到一个错误：`node_depth(tree, c(\"A\", \"B\"\
  , \"C\", \"D\"))`。不难想象，向量化版本会很有用。例如，要获取一个名称序列的深度：`node_depth <- Vectorize(node_depth,\
  \ vectorize.args = \"name\", USE.NAMES = FALSE)`\n\n`node_depth(tree, c(\"A\", \"\
  B\", \"C\", \"D\"))`\n\n## [1] 2 2 1 1\n\n这里，需要设置`USE.NAMES = FALSE`才能得到一个简单的向量。如果不设置，向量将基于输入变量包含名称。详情请参阅`Vectorize`的文档。\n\
  \n**中缀运算符**\n\nR 中的中缀运算符也是函数。你可以用其他函数覆盖它们（但你真的不应该这样做，因为可能会搞乱大量代码），你也可以创建自己的中缀运算符。\n\
  \n用户定义的中缀运算符是具有特殊名称的函数。名称以`%`开头和结尾的函数会被 R 视为中缀运算符。创建用作中缀运算符的函数没有特殊语法，只是它应该接受两个参数。不过，变量赋值有特殊语法，包括名称以`%`开头和结尾的变量。\n\
  \n## 第 2 章 R 中的函数\n\n要处理特殊变量，你需要用反引号引用它们。你不能写`+(2, 2)`，尽管`+`是一个函数。R 不会将其理解为一个函数调用。但你可以引用`+`，写成``\
  \ `+` ``，然后它就像所有其他变量名一样是一个变量名：\n\n`` `+`(2, 2) ``\n\n## [1] 4\n\n这同样适用于 R 中所有其他中缀运算符，甚至控制结构：\n\
  \n`` `if`(2 > 3, \"true\", \"false\") ``\n\n## [1] \"false\"\n\nR 解析器识别控制结构关键字和各种运算符，例如算术运算符，因此它们拥有特殊语法。但它们实际上都只是函数。甚至括号也是函数`(`的特殊语法，下标运算符也是如此，分别是``\
  \ `[` ``和`` `[[` ``。如果你引用它们，你就得到了一个变量名，可以像使用其他任何函数名一样使用它。\n\n就像所有这些运算符都有特殊语法一样，以`%`开头和结尾的变量也有特殊语法。R\
  \ 期望它们是中缀运算符，并将像`exp1 %op% exp2`这样的表达式视为函数调用`` `%op%`(exp1, exp2) ``。\n\n知道你可以通过引用运算符名将其转换为函数名，也告诉了你如何定义新的中缀运算符。如果你将一个函数赋值给一个变量名，你就可以通过该名称引用它。\n\
  \n## 第 2 章 R 中的函数\n\n如果该名称是一个被引用的特殊名称，它就可以使用该名称的特殊语法。\n\n因此，要定义一个执行乘法的运算符`%x%`，我们可以写``\
  \ `%x%` <- `*` ``：\n\n```\n3 %x% 2\n```\n\n## [1] 6\n\n这里，我们使用了两次引号，第一次是为`%x%`获取一个可以赋值给它的变量名，第二次是获取乘法运算符`*`所指的函数。\n\
  \n仅仅因为 R 中所有的控制结构和运算符都是你可以覆盖的函数，并不意味着你可以不加极端谨慎地这样做。\n\n你*永远*不应该更改控制结构指向的函数，也不应该更改其他运算符，除非你在新类型上定义运算符，这样相对安全。然而，定义全新的中缀运算符可能非常有用，如果它们能简化你经常编写的表达式的话。\n\
  \n举个例子，让我们对`%x%`运算符做些别的事情——毕竟，乘法没有必要有两个不同的运算符。\n\n我们可以让它将左侧表达式复制右侧数字指定的次数：\n\n```\n\
  `%x%` <- function(expr, num) replicate(num, expr)\n3 %x% 5\n```\n\n## [1] 3 3 3\
  \ 3 3\n\n```\ncat(\"This is \", \"very \" %x% 3, \"much fun\")\n```\n\n## This is\
  \ very very very much fun\n\n我们使用`replicate`函数来实现这一点。它做同样的事情：重复计算一个表达式固定次数。使用`%x%`中缀运算符可能会使代码更具可读性，这取决于你的喜好。\n\
  \n## 第 2 章 R 中的函数\n\n出于诚实的考虑，我必须提一下，除了参数顺序交换之外，我们不仅仅是给`replicate`取了个新名字。`%x%`运算符的工作方式略有不同。在`%x%`中，`expr`参数在调用`replicate`时会被求值。所以，如果我们用一个采样随机数的函数调用`%x%`，我们会得到相同的重复结果`num`次；不会采样`num`次。\n\
  \n```\nrnorm(1) %x% 4\n```\n\n## [1] -0.8094755 -0.8094755 -0.8094755 -0.8094755\n\
  \n惰性求值只能帮你到这里。\n\n要真正获得与`replicate`相同的行为，我们需要一点技巧：\n\n```\n`%x%` <- function(expr,\
  \ num) {\n    m <- match.call()\n    replicate(num, eval.parent(m$expr))\n}\n\n\
  rnorm(1) %x% 4\n```\n\n## [1] 0.8430961 -2.9336330 -1.1009706 0.2947148\n\n这里，`match.call`函数只是获取当前函数调用的表示，我们可以从中提取表达式而无需对其求值。然后，我们使用`replicate`在调用函数的作用域内对其进行多次求值。\n\
  \n如果你不太理解这一点，别担心。我们将在后面的章节中介绍作用域。\n\n## 第 2 章 R 中的函数\n\n**替换函数**\n\n另一类具有特殊名称的函数是所谓的*替换函数*。R\
  \ 中的数据是不可变的。你可以更改数据参数所指的内容，但不能更改实际数据。即使看起来你在修改数据，至少在概念上，你是在创建一个副本，修改它，然后使一个变量指向新的副本。\n\
  \n我们可以通过一个简单的向量示例看到这一点。如果我们创建两个指向同一个初始向量的向量，然后修改其中一个，另一个保持不变：\n\n```\nx <- y <-\
  \ 1:5\nx\n```\n\n## [1] 1 2 3 4 5\n\n```\ny\n```\n\n## [1] 1 2 3 4 5\n\n```\nx[1]\
  \ <- 6\nx\n```\n\n## [1] 6 2 3 4 5\n\n```\ny\n```\n\n## [1] 1 2 3 4 5\n\nR 很智能。如果不需要，它不会复制值。\n\
  \n从语义上讲，最好将任何修改视为创建副本，但出于性能原因，R 只会在必要时才复制——至少对于像向量这样的内置数据来说是这样。通常，当你有两个变量引用同一份数据，并且你“修改”了其中一个时，就会发生复制。\n\
  \n## 第 2 章 R 中的函数\n\n我们可以使用`address`函数获取对象的内存地址。当创建副本时，地址会改变；没有创建副本时，地址保持不变。我们可以使用`pryr`包中的`mem_change`函数来查看一个表达式分配了多少内存。\n\
  \n使用这两个函数，我们可以更深入地研究这种复制机制。（具体输出取决于你的计算机，但你应该看到与下面类似的内容。）我们可以先创建一个长向量并修改它：\n\n```\n\
  library(pryr)\nrm(x) ; rm(y)\nmem_change(x <- 1:10000000)\n```\n\n## 2.31 kB\n\n\
  ```\naddress(x)\n```\n\n## [1] \"0x7fe426826a90\"\n\n```\nmem_change(x[1] <- 6)\n\
  ```\n\n## 80 MB\n\n```\naddress(x)\n```\n\n## [1] \"0x7fe420000000\"\n\n当我们给这个向量的第一个元素赋值时，我们看到整个向量都被复制了。这可能看起来很奇怪，因为我刚刚告诉过你，R\
  \ 只会在必要时才复制向量，而这里我们只是修改了其中的一个元素，并且没有其他变量引用它。\n\n这里发生复制的原因是，我们用来创建向量的表达式`1:10000000`创建了一个整数向量。我们赋给第一个元素的值`6`是一个浮点数（在\
  \ R 中称为“numeric”）。如果我们想要一个实际的整数，我们需要在数字后面写上`L`（代表“长整数”）：32\n\n## 第 2 章 R 中的函数\n\n\
  ```\nclass(6)\n```\n\n## [1] \"numeric\"\n\n```\nclass(6L)\n```\n\n## [1] \"integer\"\
  \n\n当我们将一个 numeric 值赋给一个整数向量时，R 不得不将整个向量转换为 numeric，这就是我们得到副本的原因：\n\n```\nz <- 1:5\n\
  class(z)\n```\n\n## [1] \"integer\"\n\n```\nz[1] <- 6\nclass(z)\n```\n\n## [1] \"\
  numeric\"\n\n如果我们在它被转换后再赋一个 numeric 值给它，就不会再得到副本：\n\n```\nmem_change(x[3] <- 8)\n\
  ```\n\n## -1.14 kB\n\n```\naddress(x)\n```\n\n\n好的，作为一名高级文档工程师和翻译员，我将严格按照您提供的注意事项和示例，将给定的英文文本翻译成中文。\n\
  \n\n## [1] `\"0x7fe420000000\"`\n\n所有的表达式求值都会对内存产生一点点修改，无论是增加还是减少，但变化量远小于整个向量。因此我们可以看到，向量并没有被复制，其地址保持不变。\n\
  \n## 第 2 章 R 语言中的函数\n\n如果我们将 `x` 赋值给另一个变量，并不会得到一份副本。只是两个名称指向了同一个值：\n\n```r\nmem_change(y\
  \ <- x)\n## 376 B\n\naddress(x)\n## [1] \"0x7fe420000000\"\n\naddress(y)\n## [1]\
  \ \"0x7fe420000000\"\n```\n\n然而，如果我们再次修改 `x`，就需要一个副本，以便让另一个向量指向原始的、未经修改的数据：\n\n\
  ```r\nmem_change(x[3] <- 8)\n## 80 MB\n\naddress(x)\n## [1] \"0x7fe430000000\"\n\
  \naddress(y)\n## [1] \"0x7fe420000000\"\n```\n\n但在那次复制之后，我们就可以再次对 `x` 进行赋值，而无需创建额外的副本：\n\
  \n```r\nmem_change(x[4] <- 9)\n## 112 B\n\naddress(x)\n## [1] \"0x7fe430000000\"\
  \n```\n\n## 第 2 章 R 语言中的函数\n\n在 R 语言中，当你给一个变量赋值时，你实际上是在调用赋值函数 ``<-``。当你给向量或列表中的某个元素赋值时，你使用的是\
  \ ``[<-`` 函数。但其实还有一整类这样的函数，它们可以让你在不实际修改对象的情况下，做出修改对象的样子。这些函数被称为替换函数，其名称以 ``<-``\
  \ 结尾。一个例子是 ``names<-`` 函数。如果你有一个向量 `x`，你可以使用如下语法为其元素命名：\n\n```r\nx <- 1:4\nx\n##\
  \ [1] 1 2 3 4\n\nnames(x) <- letters[1:4]\nx\n## a b c d\n## 1 2 3 4\n\nnames(x)\n\
  ## [1] \"a\" \"b\" \"c\" \"d\"\n```\n\n这里涉及两个不同的函数。最后一个表达式，它返回了 `x` 的名称，这是 `names`\
  \ 函数。而我们用来将名称*赋值*给 `x` 的函数是 ``names<-`` 函数。\n\n任何你定义的、名称以 ``<-`` 结尾的函数都会成为一个替换函数。其语法是，它会求值赋值运算符右侧的内容，并将结果赋值给它作为参数接收的那个变量。\n\
  \n因此，这个语法\n\n```r\nnames(x) <- letters[1:4]\n```\n\n会被翻译成\n\n```r\nx <- `names<-`(x,\
  \ letters[1:4])\n```\n\n## 第 2 章 R 语言中的函数\n\n在这个求值过程中，没有任何值被破坏，只是变量被设置为了新的值。\n\n\
  我们可以使用这种语法编写自定义的替换函数。只有两个要求。函数名必须以 ``<-`` 结尾——因此我们在赋值时需要给名称加上引号——并且，用于赋值运算符右侧的那个值的参数，必须命名为\
  \ `value`。最后一个要求的存在，是为了使替换函数可以接受两个以上的参数。\n\n``attr<-`` 函数就是一个例子。属性是可以与对象关联的键值对映射。你可以使用\
  \ `attributes` 函数获取与对象关联的所有属性，并使用 ``attributes<-`` 函数设置所有属性，但你可以使用 ``attr<-`` 来分配单个属性。它接受三个参数：要修改的对象\
  \ `attr(x, which) <- value`、一个 `which` 参数（即要设置的属性名称）、以及一个 `value` 参数（即赋值运算符右侧的值）。`which`\
  \ 参数会与要修改的对象一起传递给左侧的函数：\n\n```r\nx <- 1:4\nattributes(x)\n## NULL\n\nattributes(x)\
  \ <- list(foo = \"bar\")\nattributes(x)\n## $foo\n## [1] \"bar\"\n\nattr(x, \"baz\"\
  ) <- \"qux\"\nattributes(x)\n## $foo\n## [1] \"bar\"\n##\n## $baz\n## [1] \"qux\"\
  \n```\n\n我们可以编写一个替换函数，使本章前面构建树结构的代码稍微可读性更强一些。之前，我们是这样构建树的：\n\n```r\ntree <- make_node(\"\
  root\",\n                make_node(\"C\", make_node(\"A\"),\n                  \
  \        make_node(\"B\")),\n                make_node(\"D\"))\n```\n\n但是，我们可以通过如下方式创建用于设置对象子节点的函数：\n\
  \n```r\n`left<-` <- function(node, value) {\n    node$left = value\n    node\n}\n\
  \n`right<-` <- function(node, value) {\n    node$right = value\n    node\n}\n```\n\
  \n然后用如下方式构建树：\n\n```r\nA <- make_node(\"A\")\nB <- make_node(\"B\")\nC <- make_node(\"\
  C\")\nD <- make_node(\"D\")\nroot <- make_node(\"root\")\n\nleft(C) <- A\nright(C)\
  \ <- B\nleft(root) <- C\nright(root) <- D\n\ntree <- root\n```\n\n## 第 2 章 R 语言中的函数\n\
  \n为了查看结果，我们可以编写一个用于打印树的函数。为了保持函数简单，我假设要么两个子节点都是 `NULL`，要么两个都是树。要扩展它以处理不满足此条件的树很简单，只是会让函数稍长一些：\n\
  \n```r\nprint_tree <- function(tree) {\n    build_string <- function(node) {\n \
  \       if (is.null(node$left) && is.null(node$right)) {\n            node$name\n\
  \        } else {\n            left <- build_string(node$left)\n            right\
  \ <- build_string(node$right)\n            paste0(\"(\", left, \",\", right, \"\
  )\")\n        }\n    }\n    build_string(tree)\n}\n\nprint_tree(tree)\n## [1] \"\
  ((A,B),D)\"\n```\n\n这个函数以所谓的 Newick 格式显示树，并且不会显示内部节点的名称，但你可以看到树的结构。\n\n我们使用子节点构建树的顺序非常重要。\n\
  \n当我们为根节点设置子节点时，我们引用了变量 `C`。如果我们*在*为根节点设置子节点*之后*才为 `C` 设置子节点，那么得到的是 `C` 的*旧*版本，而不是修改后的新版本：\n\
  \n## 第 2 章 R 语言中的函数\n\n```r\nA <- make_node(\"A\")\nB <- make_node(\"B\")\nC <-\
  \ make_node(\"C\")\nD <- make_node(\"D\")\nroot <- make_node(\"root\")\n\nleft(root)\
  \ <- C\nright(root) <- D\nleft(C) <- A\nright(C) <- B\n\ntree <- root\nprint_tree(tree)\n\
  ```\n\n\n\n"
- "# [1] \"(C,D)\"\n\n替换函数看起来像是在修改数据，但实际上并非如此。它们只是将值重新赋值给变量。\n\n## 纯函数式编程\n\n“纯”函数是一种行为与数学函数类似的函数：它将一个空间的值映射到另一个空间，相同的值总是映射到相同的结果，并且数学函数中没有“副作用”这种东西。\n\
  \n编程语言为确保函数纯正所采取的程度各不相同，而 R 语言在这方面做得非常有限。由于值是不可变的，你对函数可能产生的副作用有一定保证，但并不多。函数可以修改其作用域之外的变量，例如修改全局变量。它们可以打印或绘图，并以这种方式改变\
  \ R 进程的状态。它们还可以抽取随机数并用其进行计算，从而在某种意义上使函数的结果变得不确定，因此相同的值并不总是映射到相同的结果。\n\n纯函数之所以可取，是因为它们更容易推理。如果一个函数没有任何副作用，你就可以将其视为一个仅在值之间进行映射的黑箱。如果它有副作用，你还需要了解它如何修改程序的其他部分，这意味着你至少要在某种程度上理解函数体在做什么。如果你只需要知道一个函数如何将输入参数映射到结果，你可以在任何时候更改其实现，而不会破坏任何依赖该函数的代码。\n\
  \n© Thomas Mailund 2023\n\nT. Mailund，《R 4 函数式编程》，<https://doi.org/10.1007/978-1-4842-9487-1_3>\n\
  \n### 非确定性函数\n\n对于相同输入，结果并非总是相同的函数未必难以推理。但如果它们的结果依赖于随机数，那么测试和调试起来就会更困难。\n\n由于纯函数更容易推理和测试，你应尽可能多地使用纯函数来编写程序。你未必能用纯函数编写*所有*程序。有时你需要随机性来实现蒙特卡洛方法，或者需要函数产生输出。但如果你用纯函数编写了大部分程序，并且知道不纯函数所在的位置，那么你就编写出了更好、更健壮的程序。\n\
  \n## 编写纯函数\n\n要保证你编写的函数是纯的，相关工作并不多。你应该避免抽样随机数，并且避免修改函数作用域之外的变量。\n\n避免抽样随机数是轻而易举的。不要直接或通过其他函数调用任何执行此操作的函数。如果一个函数只调用确定性函数，并且自身不引入任何随机性，那么该函数就是确定性的。\n\
  \n保证你不修改函数作用域之外的任何内容，这一点稍微不那么简单。你需要一个特殊的函数 `<<-` 来修改函数局部作用域之外的变量（我们将在下一章讨论这个运算符），所以请避免使用它。这样所有赋值都将针对局部变量，你也就无法修改其他作用域中的变量。如果你避免使用这个运算符，那么修改作用域之外函数的唯一风险就是通过惰性求值。还记得上一章中我们创建了一个函数列表的例子吗？这些函数包含未求值的表达式，这些表达式的值依赖于我们在求值表达式之前正在更改的变量。\n\
  \n严格来说，如果我们返回的函数包含依赖于局部变量的这种未求值表达式，我们仍然拥有一个纯函数。甚至我们要返回的函数本身也是纯的。它们会引用第一个函数中的局部变量，一旦第一个函数返回，如果没有\
  \ `<<-` 运算符，这些变量就无法更改。只是它们未必是你想要返回的函数。\n\n虽然根据严格定义，这样的函数是纯的，但它们确实存在一个问题：我们返回的函数依赖于第一个函数内部局部变量的状态。从编程的角度来看，如果这些函数难以推理，那么它们是纯的这个事实对我们帮助不大；在这种情况下，我们需要知道改变第一个函数的状态如何影响其他函数的功能。\n\
  \n避免函数依赖于其自身作用域之外的变量（即既不是参数也不是局部变量的变量）的一个解决方案是，永远不改变变量所引用的内容。那些保证函数纯正的编程语言强制执行这一点。那里根本没有修改变量值的方法。你可以定义常量，但不存在变量这种东西。由于\
  \ R 语言确实有变量，如果你想以这种方式保证函数的纯正，就必须避免多次给同一个变量赋值。\n\n在一个长函数中，即使你从未打算改变变量的值，也非常容易意外地重复使用变量名。保持函数简短精炼可以在一定程度上缓解这个问题，但无法保证这种情况不会发生。唯一迫使我们改变变量的控制结构是\
  \ `for` 循环。编写 `for` 循环时，你不可能不设置一个循环变量。\n\n现在，`for` 循环在 R 语言中名声不佳，许多人会告诉你避免使用它们，因为它们很慢。事实并非如此。与更底层语言中的循环相比，它们确实较慢，但这与它们是循环无关。因为\
  \ R 是一种非常动态的语言，你所做的每件事都涉及调用函数，而这些函数随时可能因为某人重定义变量而发生变化，所以 R 代码通常都很慢。当你调用像 `sum` 或\
  \ `mean` 这样的内置函数时，它们很快，因为是用 C 语言实现的。通过使用向量化表达式和内置函数，你可以避免动态性带来的性能惩罚。但如果你在 R 中自己编写循环，就会受到这种惩罚。然而，如果你使用人们推荐替代循环的其他构造（我们将在第\
  \ [6](https://doi.org/10.1007/978-1-4842-9487-1_6) 章讨论这些构造），你会付出相同的代价。\n\n你应该使用这些其他构造的真正原因在于，它们能使代码背后的意图比循环更清晰（至少在你熟悉函数式编程之后是这样的），并且避免了可能引发问题的循环变量。人们通常发现自己的循环效率低下的原因在于，很容易写出“修改”数据的循环，从而迫使\
  \ R 制作副本。仅仅避免循环并不能解决这个问题，我们将在本章稍后部分再次讨论这一点。\n\n## 递归作为循环\n\n函数式编程语言避免循环的方式是改用递归。任何可以用循环编写的内容，你也可以用递归函数调用来编写，本章的大部分内容将侧重于让你习惯以递归函数的方式进行思考。\n\
  \n将问题视为递归不仅仅是一种避免循环的编程技巧。它通常是一种将问题分解为更易于解决的简单子问题的方法。当你需要处理一个问题时，你可以首先考虑是否存在容易解决的基准情形。\n\
  \n如果我们要在一个序列中搜索某个元素，当序列为空时，判断该元素是否存在是微不足道的：显然它不存在。现在，如果序列不为空，我们面临一个更难的问题，但我们可以将其分解为两个更小的问题。我们要搜索的元素是否是序列的第一个元素？如果是，则该元素存在。如果第一个元素不等于我们要搜索的元素，那么它只有在序列的剩余部分中才可能存在。\n\
  \n我们可以基于这种问题分解来编写一个线性搜索函数。首先检查基准情形，如果我们在空序列中搜索，就返回 `FALSE`。否则，检查第一个元素；如果找到，返回 `TRUE`；如果第一个元素不是我们要找的，则对序列的剩余部分递归调用该函数：\n\
  \n```r\nlin_search <- function(element, sequence) {\n  if (is_empty(sequence)) FALSE\n\
  \  else if (first(sequence) == element) TRUE\n  else lin_search(element, rest(sequence))\n\
  }\n\nx <- 1:5\nlin_search(0, x)\n```\n\n\n\n\n```\n## [1] 假\nlin_search(1, x)\n\
  ```\n\n```\n## [1] 真\nlin_search(5, x)\n```\n\n```\n## [1] 真\nlin_search(6, x)\n\
  ```\n\n\n\n## [1] 假\n\n我将判空、提取第一个元素以及获取序列剩余部分的操作，分别隐藏在三个函数中：`is_empty`、`first`和`rest`。对于向量，可以这样实现：\n\
  \n```\nis_empty <- function(x) length(x) == 0\nfirst <- function(x) x[1]\nrest <-\
  \ function(x) x[-1]\n```\n\n如果向量的长度为 0，则视为空。第一个元素自然就是第一个元素。`rest`函数返回除第一个元素之外的所有内容（通过\
  \ `-1` 索引实现）。\n\n现在这个搜索算法可以运行，但你绝不应照搬我刚才写的 `rest` 函数那样的代码。我们通过切片方式提取向量剩余部分时，R 会复制那个子向量。第一次调用\
  \ `rest`，得到的是去掉第一个元素的整个向量；第二次调用，得到的是去掉前两个元素的整个向量，依此类推。这会导致运算量大约达到向量长度平方的一半。因此，虽然搜索算法本应是线性时间复杂度的，但我们提取向量剩余部分的方式却使其变成了平方时间复杂度。\n\
  \n在实践中，这其实无关紧要。R 对递归调用的深度有限制，而在性能成为问题之前，我们早就触达这个上限了。我们会在本章末尾再讨论这些问题，但目前，出于简洁性的考虑，既然我们可以实现线性时间算法，就尽量避开平方时间算法。\n\
  \n那些为递归而非循环而设计的语言，通常以另一种方式来表示序列——这种方式下，你可以在常数时间内获取序列的剩余部分。我们可以实现这样一个版本的序列：将序列中的元素表示为一个结构，该结构包含一个指向剩余部分的\
  \ `next` 变量。\n\n我们将这种结构称为*next 列表*。这是*链表*的一个例子，但链表有不同的变体，而这种只需引用序列的剩余部分，所以我将其称为*next\
  \ 列表*。我们可以使用下面的函数将单个元素转换为这种序列：\n\n```\nnext_list <- function(element, rest = NULL)\
  \ list(element = element, rest = rest)\n```\n\n然后通过嵌套调用该函数来构造序列，这与上一章中构造树的方式类似：\n\
  \n```\nx <- next_list(1, next_list(2, next_list(3, next_list(4))))\n```\n\n对于这种结构，我们可以如下定义搜索算法所需的函数：\n\
  \n```\nnl_is_empty <- function(nl) is.null(nl)\nnl_first <- function(nl) nl$element\n\
  nl_rest <- function(nl) nl$rest\n```\n\n实际的搜索算法是这样的：\n\n```\nnl_lin_search <- function(element,\
  \ sequence) {\n  if (nl_is_empty(sequence)) FALSE\n  else if (nl_first(sequence)\
  \ == element) TRUE\n  else nl_lin_search(element, nl_rest(sequence))\n}\n```\n\n\
  这运行良好，并且是线性时间，但构造列表有点繁琐。我们应该写一个函数，用于将向量转换为 next 列表。要构造这样的函数，我们可以再次采用递归思路。如果向量的长度为零（即基准情形），那么\
  \ next 列表应为 `NULL`。否则，我们希望构造一个 next 列表：第一个元素是向量的第一个元素，列表的剩余部分则是向量剩余部分对应的 next 列表：\n\
  \n```\nvector_to_next_list <- function(x) {\n  if (is_empty(x)) NULL\n  else next_list(first(x),\
  \ vector_to_next_list(rest(x)))\n}\n```\n\n这也能运行，但显然，我们只是把性能问题从搜索算法转移到了 `vector_to_next_list`\
  \ 函数上。该函数仍然需要获取向量的剩余部分，而这需要复制。从向量到 next 列表的转换是平方时间复杂度的。我们需要一种方法来获取向量的剩余部分，且无需复制。\n\
  \n一种解决方案是跟踪向量中的索引。如果将该索引视为向量真正起始位置的索引，那么只需增加索引即可获取向量的剩余部分。我们可以使用这些辅助函数：\n\n```\n\
  i_is_empty <- function(x, i) i > length(x)\ni_first <- function(x, i) x[i]\n```\n\
  \n并这样编写转换函数：\n\n```\ni_vector_to_next_list <- function(x, i = 1) {\n  if (i_is_empty(x,\
  \ i)) NULL\n  else next_list(i_first(x, i), i_vector_to_next_list(x, i + 1))\n}\n\
  ```\n\n当然，使用同样的技巧，我们本可以直接用索引来实现搜索算法：\n\n```\ni_lin_search <- function(element, sequence,\
  \ i = 1) {\n  if (i_is_empty(sequence, i)) FALSE\n  else if (i_first(sequence, i)\
  \ == element) TRUE\n  else i_lin_search(element, sequence, i + 1)\n}\n```\n\n使用索引实现时，我们实际上无法写出一个\
  \ `rest` 函数。编写一个返回向量和索引对的函数，操作起来不如直接递增索引本身方便。\n\n当你对序列编写递归函数时，所需的关键抽象包括：检查序列是否为空、获取第一个元素以及获取序列的剩余部分。使用针对这三种操作的函数，并不能真正帮助我们，除非这些函数能让我们处理不同类型的数据序列。实现这样的抽象是可能的，但在本书中我们不再深入探讨。从现在起，我们将直接在递归函数中实现这些抽象。如果这样做，线性搜索算法就简化为：\n\
  \n```\nlin_search <- function(element, sequence, i = 1) {\n  if (i > length(sequence))\
  \ FALSE\n  else if (sequence[i] == element) TRUE\n  else lin_search(element, sequence,\
  \ i + 1)\n}\n```\n\n## 递归函数的结构\n\n递归函数都遵循相同的模式：找出易于解决的基准情形，并理解如何将问题分解成可通过递归解决的更小子问题。这种思路在算法设计理论中被称为“分治”。将问题归约成更小的子问题是难点所在。需要注意两点：这些子问题是否*真的*更小了？如何组合子问题的解来解决更大的问题？\n\
  \n在我们至今研究的线性搜索中，我们知道递归调用处理的是更小的子问题，因为每次调用面对的都是更短的序列。无论我们是用列表实现函数，还是使用向量索引，当我们递归调用时，我们处理的都是更短的序列。对于处理序列的函数来说，通常都是如此。如果你知道每次递归调用都离基准情形更近一步，你就知道函数最终会完成计算。\n\
  \n递归并不总是只针对序列中除了第一个元素以外的所有部分。例如，对于二分搜索，我们可以通过每次递归调用将问题规模减半，从而在已排序的序列中以对数时间完成搜索。算法是这样的：如果序列为空，则找不到要搜索的元素，返回\
  \ `FALSE`。如果序列非空，检查中间元素是否是目标元素，如果是则返回 `TRUE`。如果不是，检查它是否小于目标元素：如果是，则对序列的后半部分递归调用；如果不是，则对序列的前半部分递归调用。\n\
  \n这听起来很简单，但初次尝试实现时，往往会导致在同一序列上反复递归，永远无法接近完成。这种情况出现在我们选择前半部分或后半部分时不够仔细时。以下实现就是错误的。如果你搜索\
  \ `0` 或 `5`，将会陷入无限递归：\n\n```\nbinary_search <- function(element, x, first = 1, last\
  \ = length(x)) {\n  if (last < first) return(FALSE) # empty sequence\n  middle <-\
  \ (last - first) %/% 2 + first\n  if (element == x[middle]) {\n    TRUE\n  } else\
  \ if (element < x[middle]) {\n    binary_search(element, x, first, middle)\n  }\
  \ else {\n    binary_search(element, x, middle, last)\n  }\n}\n```\n\n原因是中间索引等于\
  \ `first`，导致你递归调用时面对的是与之前相同的问题，而非更简单的问题。解决方法是，在递归调用的范围中绝不要包含 `middle`——毕竟，只有在确定\
  \ `middle` 不是目标元素时，你才会调用递归：\n\n```\nbinary_search <- function(element, x, first\
  \ = 1, last = length(x)) {\n  if (last < first) return(FALSE) # empty sequence\n\
  \  middle <- (last - first) %/% 2 + first\n  if (element == x[middle]) {\n    TRUE\n\
  \  } else if (element < x[middle]) {\n    binary_search(element, x, first, middle\
  \ - 1)\n  } else {\n    binary_search(element, x, middle + 1, last)\n  }\n}\n```\n\
  \n关键在于必须确保所有递归调用确实是在处理更小的子问题。对于序列，这通常意味着要确保递归调用处理的是更短的序列。\n\n对于树这种本质上是递归的数据结构——树要么是叶子节点，要么是包含若干子节点的内部节点，而这些子节点本身也是树——我们会在子树上递归调用，从而保证每次递归调用处理的都是更小的子问题。我们在第一章中编写的\
  \ `node_depth` 函数就是一个例子：\n\n```\nnode_depth <- function(tree, name, depth = 0) {\n\
  \  if (is.null(tree)) return(NA)\n  if (tree$name == name) return(depth)\n  left\
  \ <- node_depth(tree$left, name, depth + 1)\n  if (!is.na(left)) return(left)\n\
  \  right <- node_depth(tree$right, name, depth + 1)\n  return(right)\n}\n```\n\n\
  基准情形处理空树——空树不包含我们要找的节点，因此直接返回 `NA`。如果树非空，要么我们找到了目标节点，可以返回结果；要么则对左子树递归调用。如果找到了目标节点，就返回结果；否则，返回对右子树递归调用的结果（无论是否找到，如果节点根本不在树中，最终结果就是\
  \ `NA`）。\n\n我们到目前为止编写的函数，都没有组合子问题的解。这些函数都是搜索函数，返回的结果要么是直接找到的，要么是某个递归函数返回的结果。并非总是这么简单，通常你需要对递归调用的结果进行处理，才能解决更大的问题。\n\
  \n一个简单的例子是计算阶乘。数字 *n* 的阶乘（*n*!）等于 *n* × (*n* − 1)!，基准情形为 `1! = 1`。编写递归函数计算阶乘非常简单，但我们不能直接返回递归调用的结果，而需要将递归调用的结果乘以\
  \ *n*：\n\n```\nfactorial <- function(n) {\n  if (n == 1) 1\n  else n * factorial(n\
  \ - 1)\n}\n```\n\n这里，我假设 *n* 是整数且 *n* > 0。如果不是这样，递归就不会向基准情形靠近，原则上会无限进行下去。因此，这又是一个需要小心确保递归调用确实在推进问题求解的例子。在这个函数中，我只对正整数保证了这一点。\n\
  \n在大多数算法中，我们需要对递归调用的结果进行某些操作，才能完成计算。除了阶乘，另一个例子是去除序列中重复元素的函数。重复元素是指序列中与下一个元素相等的元素。这个函数类似于\
  \ R 内建的 `unique` 函数，但不同之处在于它只移除相邻的重复元素。\n\n编写这个函数时，我们遵循递归函数的编写步骤。基准情形是什么？空序列没有重复元素，所以结果就是空序列。只有一个元素的序列也是如此：这样的序列没有重复元素，因此结果就是输入序列本身。如果我们始终知道函数的输入至少包含一个元素，就不必担心第一种基准情形；但如果函数可能被调用处理空序列，我们就需要同时处理这两种情况。对于包含多个元素的序列，我们需要检查第一个元素是否与下一个元素相等。如果是，则对去掉第一个元素后的序列递归调用，从而移除一个重复元素。如果不是，则返回第一个元素，以及已经去除重复后的剩余序列。\n\
  \n使用“next 列表”的解法如下：\n\n```\nrm_duplicates <- function(x) {\n  # Base cases\n  if\
  \ (is.null(x)) return(NULL)\n  if (is.null(x$rest)) return(x)\n  # Recursive case\n\
  \  if (x$element == x$rest$element) rm_duplicates(x$rest)\n  else next_list(x$element,\
  \ rm_duplicates(x$rest))\n}\n\nx <- next_list(1, next_list(1, next_list(2, next_list(2))))\n\
  rm_duplicates(x)\n```\n\n\n\n## `$element`\n\n## [1] 1\n\n## `$rest`\n\n## `$rest$element`\n\
  \n## [1] 2\n\n## `$rest$rest`\n\n## [1] NULL\n\n为了得到一般问题的解，我们需要将递归调用所得到的较小解决方案与较大问题中的信息结合起来。如果第一个元素等于从递归调用返回的第一个元素，则存在重复，应直接返回递归调用的结果；如果不等，则需要将第一个元素与递归调用返回的下一个列表进行合并。\n\
  \n我们也可以为向量实现此函数。为了避免每次删除重复元素时都复制向量，可以将该函数拆分为两部分。首先，找出所有重复元素的索引，然后通过单次操作将这些索引从向量中删除：\n\
  \n```\nvector_rm_duplicates <- function(x) {\n  dup <- find_duplicates(x)\n  x[-dup]\n\
  }\n```\n\n`Vector_rm_duplicates(c(1, 1, 2, 2))`\n\n## [1] 1 2\n\nR 语言中已有一个用于查找重复元素的内置函数\
  \ `duplicated`，我们可以用它来实现 `find_duplicates`（该函数返回布尔向量，但我们可以使用 `which` 函数获取 `TRUE`\
  \ 值对应的索引）。不过，自己动手实现也是一个不错的练习。\n\n```\nfind_duplicates <- function(x, i = 1) {\n\
  \  if (i >= length(x)) return(c())\n  if (x[i] == x[i + 1]) c(i, find_duplicates(x,\
  \ i + 1)) else find_duplicates(x, i + 1)\n}\n```\n\n该结构与列表版本非常相似，但如果当前索引对应重复元素，则返回递归调用结果和当前索引；否则仅返回递归调用结果。\n\
  \n这个解决方案并不完美。每次我们将当前索引与递归结果合并创建索引向量时，都会进行一次复制，因此运行时间与结果长度呈二次关系。我们可以通过构建一个 `next`\
  \ 链表（而非索引向量），然后在删除重复元素的函数中将其转换为向量，再对向量 `x` 进行索引删除重复元素，从而将其转变为线性时间算法。这项工作留作练习。\n\n\
  作为另一个需要合并递归调用结果的递归函数示例，我们考虑计算树的大小。\n\n基本情况是树为空（值为 `NULL`），此时大小为 0。递归情况为左子树大小加上右子树大小再加\
  \ 1（表示当前节点）：\n\n```\nsize_of_tree <- function(node) {\n  if (is.null(node)) 0\n\
  \  else size_of_tree(node$left) + size_of_tree(node$right) + 1\n}\n```\n\n```\n\
  make_node <- function(name, left = NULL, right = NULL) list(name = name, left =\
  \ left, right = right)\n```\n\n```\ntree <- make_node(\"root\",\n              \
  \    make_node(\"C\", make_node(\"A\"),\n                            make_node(\"\
  B\")),\n                  make_node(\"D\"))\n```\n\n`size_of_tree(tree)`\n\n## [1]\
  \ 5\n\n如果我希望记住子树的大小以避免重复计算，可以尝试如下方案：\n\n```\nset_size_of_subtrees <- function(node)\
  \ {\n  if (is.null(node)) return(0)  # 无法在 NULL 中保存任何数据\n  # 若没有存储大小，则进行计算\n  if\
  \ (is.null(node$size)) {\n    left_size <- set_size_of_subtrees(node$left)\n   \
  \ right_size <- set_size_of_subtrees(node$right)\n    node$size <- left_size + right_size\
  \ + 1\n  }\n  return(node$size)\n}\n```\n\n但请注意，R 语言中的数据无法被修改。如果我在树上运行此函数，它会创建知道子树大小的新节点，但这些节点是副本，而非调用函数时所用的原树节点：\n\
  \n`set_size_of_subtrees(tree)`\n\n## [1] 5\n\n`tree$size`\n\n## NULL\n\n为了真正记住大小，我需要构建一棵全新的树，其节点都已知自身大小。因此需要以下函数：\n\
  \n```\n# 同时处理 NULL 和已知自身大小的节点\nget_size <- function(node) if (is.null(node)) 0 else\
  \ node$size\n\nset_size_of_subtrees <- function(node) {\n  if (is.null(node)) return(NULL)\n\
  \  # 更新子节点\n  node$left <- set_size_of_subtrees(node$left)\n  node$right <- set_size_of_subtrees(node$right)\n\
  \  # 设置当前节点大小\n  node$size <- get_size(node$left) + get_size(node$right) + 1\n \
  \ return(node)\n}\n```\n\n```\ntree <- set_size_of_subtrees(tree)\ntree$size\n```\n\
  \n\n\n## [1] 5\n\n"
- "# 第 3 章：纯函数式编程——尾递归\n\n像我们的搜索函数这样，在递归调用后直接返回结果而不进行进一步计算的函数，被称为**尾递归**函数。这类函数在函数式编程语言中特别受欢迎，因为它们可以被转换为循环，从而消除调用函数的开销。然而，遗憾的是，R\
  \ 语言并未实现这种尾递归优化。这背后有充分但技术性的原因，与作用域有关。但这并不意味着我们无法利用尾递归以及通过编写尾递归函数所能实现的优化；我们只需将函数显式地转换为循环即可。\n\
  \n我们将在下一节讨论这个问题。首先，我将向你展示一种技巧，将原本非尾递归的函数转化为尾递归函数。\n\n只要你的函数只进行零次或一次递归调用，这便是一个非常简单的技巧。你可以在递归调用中传递值，这些值在递归到达基准情况时可用于计算最终结果。\n\
  \n以一个简单的例子来说，我们来看阶乘函数。我们之前编写的方式不是尾递归的。我们进行递归调用，然后将 `n` 乘以结果：\n\n```\nfactorial <-\
  \ function(n) {\n  if (n == 1) 1\n  else n * factorial(n - 1)\n}\n```\n\n我们可以通过将到目前为止所见数字的乘积传递给递归调用，将其转换为尾递归函数。这种传递的值通常被称为累加器。尾递归函数如下所示：\n\
  \n"
- "# 第 3 章：纯函数式编程\n\n```\nfactorial <- function(n, acc = 1) {\n  if (n == 1) acc\n\
  \  else factorial(n - 1, acc * n)\n}\n```\n\n类似地，我们可以将我们编写的 `find_duplicates` 函数转换为尾递归函数。原始函数如下所示：\n\
  \n```\nfind_duplicates <- function(x, i = 1) {\n  if (i >= length(x)) return(c())\n\
  \  rest <- find_duplicates(x, i + 1)\n  if (x[i] == x[i + 1]) c(i, rest) else rest\n\
  }\n```\n\n它需要返回一个索引列表，因此我们将这个列表作为累加器传递：\n\n```\nfind_duplicates <- function(x, i\
  \ = 1, acc = c()) {\n  if (i >= length(x)) return(acc)\n  if (x[i] == x[i + 1])\
  \ find_duplicates(x, i + 1, c(acc, i)) else find_duplicates(x, i + 1, acc)\n}\n\
  ```\n\n所有最多只进行一次递归调用的函数，都可以使用适当的累加器轻松地转换为尾递归函数。\n\n对于进行多次递归调用的函数，比如我们之前编写的树函数，则要困难一些。让它们变成尾递归并非不可能，但这需要一种称为*续延传递*的技巧，我将在第[5](https://doi.org/10.1007/978-1-4842-9487-1_5)章中向你展示。\n\
  \n"
- "# 第 3 章：纯函数式编程——运行时考量\n\n现在来谈坏消息。我在本章中向你展示的所有使用递归而不是循环来编写纯函数式程序的技术，在 R 语言中相对较慢。\n\
  \n从软件设计的角度来看，你希望编写纯函数，但依赖递归而非循环会带来运行时成本。我们可以将递归线性搜索函数与使用 for 循环的版本进行比较，看看会带来多少额外开销。\n\
  \n递归函数如下所示：\n\n```\nr_lin_search <- function(element, sequence, i = 1) {\n  if (i\
  \ > length(sequence)) FALSE\n  else if (sequence[i] == element) TRUE\n  else r_lin_search(element,\
  \ sequence, i + 1)\n}\n```\n\n使用 for 循环的版本可能如下所示：\n\n```\nl_lin_search <- function(element,\
  \ sequence) {\n  for (e in sequence) {\n    if (e == element) return(TRUE)\n  }\n\
  \  return(FALSE)\n}\n```\n\n我们可以使用 `microbenchmark` 包中的 `microbenchmark` 函数来比较两者。如果我们搜索一个不包含在序列中的元素，我们将不得不搜索整个序列，因此我们可以使用这种最坏情况来进行性能衡量：\n\
  \n"
- "# 第 3 章：纯函数式编程\n\n```\nx <- 1:1000\n\nmicrobenchmark::microbenchmark(\n  r_lin_search(-1,\
  \ x),\n  l_lin_search(-1, x)\n)\n```\n\n## Unit: microseconds\n##   expr       \
  \             min        lq       mean\n##   r_lin_search(-1, x )  834.297   927.9130\
  \  1121.50154\n##   l_lin_search(-1, x )   20.117    20.6345    47.32387\n##   median\
  \      uq        max     neval  cld\n##   986.011   1094.573   5361.536   100  \
  \  b\n\n\n\n"
- "# 23.087 25.269 2341.506 100 a\n\n递归函数的运行速度比使用循环的函数慢几个数量级。如果有人告诉你 R 语言中循环很慢，请记住这一点；它们可能确实慢，但递归函数更慢。\n\
  \n情况还不止于此。R 语言对函数递归调用的深度有限制，如果我们在一个包含约一千个以上元素的序列中查找，就会达到这个限制，届时 R 将终止调用并返回一个错误。\n\
  \n这并不意味着阅读本章完全是浪费时间。在构建函数时，从递归的角度思考是非常有用的。分治策略经常被用来解决算法问题是有其原因的。你只需要在设计好函数后，将递归解法转化为循环即可。\n\
  \n对于线性搜索这类函数，我们一开始就不会把它编程为递归函数。`for`循环版本编写起来简单得多，效率也高得多。而其他问题用递归算法来解决则容易得多，并且实现时，最好也先以递归函数的角度进行思考。二分查找就是这类问题的一个例子。它本质上是递归的，因为我们通过在一个更短的字符串上进行另一次搜索来解决本次搜索。它也不太可能达到允许的递归深度限制，因为它进行递归调用的次数仅与输入长度的对数相关，不过这已经是另一个问题了。\n\
  \n递归的二分查找代码如下所示：\n\n```\nr_binary_search <- function(element, x, first = 1, last\
  \ = length(x)) {\n  if (last < first) return(FALSE) # empty sequence\n  middle <-\
  \ (last - first) %/% 2 + first\n  if (element == x[middle]) TRUE\n  else if (element\
  \ < x[middle]) {\n    r_binary_search(element, x, first, middle - 1)\n  } else {\n\
  \    r_binary_search(element, x, middle + 1, last)\n  }\n}\n```\n\n这是一个尾递归函数，我们可以利用这一点将其转化为一个使用循环而非递归调用的版本。要将一个尾递归函数转化为循环函数，只需将函数体放入一个\
  \ `repeat` 循环中。除非你显式退出，否则 `repeat` 循环会永远运行下去，但可以利用递归函数中的基本情况测试，通过显式的 `return` 调用来退出循环。在通常需要进行递归调用的地方，你只需更新局部参数。你只需要将它们更新为如果进行递归调用时它们应有的值。因此，对于之前的第一个递归调用\
  \ `r_binary_search(element, x, first, middle - 1)`，你需要更新 `element <- element`，`x\
  \ <- x`，`first <- first`，以及 `last <- middle - 1`。当然，对于那些应该保持当前值的变量，无需更新，所以这个更新只是\
  \ `last <- middle - 1`。同样，对于第二个递归调用，`element`、`x` 和 `last` 保持当前值，但 `first` 更新为 `middle\
  \ + 1`。重写后的结果如下：\n\n```\nl_binary_search <- function(element, x, first = 1, last\
  \ = length(x)) {\n  repeat {\n    # Base case with no match\n    if (last < first)\
  \ return(FALSE) # empty sequence\n    middle <- (last - first) %/% 2 + first\n \
  \   \n    # Base case with a match\n    if (element == x[middle]) return(TRUE)\n\
  \    if (element < x[middle]) {\n      last <- middle - 1 # \"recursive\" call with\
  \ last = middle - 1\n    } else {\n      first <- middle + 1 # \"recursive\" call\
  \ with first = middle + 1\n    }\n  }\n}\n```\n\n这种转换总是遵循这个简单的模式，这也是为什么许多编程语言会自动为你完成转换的原因。\n\
  \n一旦你这样用 `repeat` 循环重写了函数，通常可以进一步简化，得到一个当达到基本情况时就能跳出的 `while` 循环，但这就不那么自动化了（尽管通常也不难）：\n\
  \n```\nl_binary_search <- function(element, x, first = 1, last = length(x)) {\n\
  \  while (last >= first) {\n    middle <- (last - first) %/% 2 + first\n    \n \
  \   # Base case with a match\n    if (element == x[middle]) return(TRUE)\n    if\
  \ (element < x[middle]) {\n      last <- middle - 1 # \"recursive\" call with last\
  \ = middle - 1\n    } else {\n      first <- middle + 1 # \"recursive\" call with\
  \ first = middle + 1\n    }\n  }\n  return(FALSE)\n}\n```\n\n如果你的函数**不是**尾递归的，那么将其转换为使用循环的版本会麻烦得多。你本质上需要自己模拟函数调用栈。这涉及更多的编程工作，但这不属于函数式编程的范畴，因此超出了本书的讨论范围。不过不用担心，使用本书后面会介绍的“续延”这一主题，你通常可以将函数转化为尾递归函数，然后使用一种称为“蹦床”的技巧来用循环替代递归。\n\
  \n"
- '# 作用域与闭包


  *作用域*或*环境*是与函数和表达式相关联的东西，它告诉它们每个变量引用的是什么值。它用于确定表达式在哪个环境中被求值。同一个变量名可以在程序中的多个地方使用，在不同的位置指代不同的东西，但表达式的作用域会精确地告诉
  R 如何将名称映射到值。在 R 中，既有隐式环境（我倾向于称之为作用域），也有显式环境。


  前者是你大多数日常编程中会使用的，而后者用于更高级的技术，主要是在如何向用户提供接口方面增加灵活性。然而，R 将名称映射到值的方式在这两种情况下是相同的，理解其工作原理可以让你更容易编写函数和理解高级包。


  但让我们从一个简单的例子开始。如果你编写一个表达式，比如 `x + y`，你无法在不了解 `x` 和 `y` 指代什么的情况下对其进行求值。R 也是如此。如果你已经告诉了
  R 这两个变量指代什么：


  ```

  x <- 2

  y <- 3

  x + y

  ## [1] 5

  ```


  你会得到预期结果。R 知道 `x` 指代 2（因为你刚刚将 2 赋值给了它），也知道 `y` 指代 3。


  你可以认为 R 有一张在名称和值之间进行映射的表；这离真相并不远。如果我们在全局（最外层）级别编写上述代码，这个表就是“全局环境”或“全局作用域”，我们可以使用
  `globalenv()` 函数获取这个表：


  ```

  genv <- globalenv()

  ```


  并且，从这个表中，我们可以获取我们赋值给变量 `x` 和 `y` 的值：


  ```

  genv$x

  ## [1] 2


  genv$y

  ## [1] 3

  ```


  当我们对 `x + y` 求值时，R 会自动查找 `x` 和 `y` 的值，并且由于我们是在全局环境中编写这个表达式的，所以它会在全局环境中查找。


  我们可以用一种更复杂的方式来演示，使环境和求值过程变得明确。你可以使用 `quote()` 函数创建一个没有关联值的表达式：


  ```

  expr <- quote(x + y)

  ```


  现在，`expr` 指向表达式 `x + y`，但这个表达式并未被求值。它只是加法运算的原始语法。要对它求值，我们需要使用 `eval()` 函数：


  ```

  eval(expr)

  ```




  '
- "# [1] 5\n\n第 4 章：作用域与闭包\n\n我们得到与之前相同的值，因为 `eval()` 同样使用当前环境来查找变量名与值之间的映射关系，因此在此例中\
  \ `eval(expr)` 是 `eval(expr, genv)` 的简写：\n\n```\neval(expr, genv)\n```\n\n## [1]\
  \ 5\n\n如果你愿意，也可以自行创建环境。`new.env()` 函数会创建一个空环境，之后你可以向其中写入内容：\n\n```\nenv <- new.env()\n\
  env$x <- 4\nenv$y <- 5\neval(expr, env)\n```\n\n## [1] 9\n\n或者，`list2env()` 函数可以将列表转换为环境：\n\
  \n```\neval(expr, list2env(list(x = -1, y = -2)))\n```\n\n## [1] -3\n\n当你使用默认环境评估诸如\
  \ `x + y` 这样的表达式，以获取变量所引用的值时，我们将这一过程称为*标准求值*。当你显式指定环境，并使用默认环境之外的其他环境时，我们称之为*非标准求值*。虽然显式环境求值自有其用途，但一般情况下你很少需要这么做——不过请记住，每当我们求值某个需要了解变量所指代对象的表达式时，都涉及某种形式的表查找过程。\n\
  \n## 环境与函数\n\n当我们加入函数后，情况变得更有趣了。对于函数而言，我们同时拥有全局环境和局部环境。\n\n在以下代码中，我们有两个名为 `x` 的变量。一个是全局变量，指向一个向量；另一个是函数参数。在函数内部，有一个引用\
  \ `x` 的表达式。当我们评估该函数时，表达式需要先判断 `x` 是函数参数而非全局变量，然后才能获取该变量所引用的值：\n\n```\nx <- 1:10\n\
  f <- function(x) sqrt(sum(x))\nf(x²)\n```\n\n当我们调用函数时，同样有一个引用名为 `x` 的变量的表达式，但这里的\
  \ `x` 与函数内部的 `x` 不同。这里的 `x` 是全局变量，因此当评估函数调用表达式时，R 需要判断 `x` 指向全局变量，然后查找*这个*变量所引用的值。\n\
  \n我们可以通过重命名变量使其唯一来厘清这一点。将全局变量命名为 `gx`，参数变量命名为 `px`：\n\n```\ngx <- 1:10\nf <- function(px)\
  \ sqrt(sum(px))\nf(gx²)\n```\n\n运行这段代码后，全局作用域知道 `gx`（代表序列 1:10）和 `f`（代表函数）这两个名称，但不会知道\
  \ `px`。在函数调用内部，当我们评估 `sqrt(sum(px))` 时，我们*确实*知道 `px`。那么这究竟是怎么回事呢？\n\n我们仍然拥有全局环境，并且可以通过\
  \ `globalenv()` 检查，确认 `f` 和 `gx` 存在于其中。然而，当我们调用 `f` 时，函数调用也会获得一个新的环境——即局部环境。\n\n\
  正如我们可以使用 `globalenv()` 获取全局环境一样，我们也能使用 `environment()` 函数获取局部环境：\n\n```\ngx <- 1:10\n\
  f <- function(px) as.list(environment())\nf(gx²)\n```\n\n## $px\n## [1] 1 4 9 16\
  \ 25 36 49 64 81 100\n\n我使用 `as.list()` 将环境转换为列表，以便查看其中的内容。\n\n`environment()` 函数在全局作用域中同样有效，并且会返回全局环境，因为在全局环境中，当前环境*就是*全局环境。\n\
  \n从上面的例子可以看出，函数中的局部环境包含了参数 `px`。通常，函数调用的局部环境会包含参数以及你在函数内部赋值的任何变量：\n\n```\nf <- function(x)\
  \ {\n  res <- sqrt(sum(x))\n  as.list(environment())\n}\nx <- 1:10\nf(x²)\n```\n\
  \n## $res\n## [1] 19.62142\n##\n## $x\n## [1] 1 4 9 16 25 36 49 64 81 100\n\n因为我对\
  \ `res` 进行了赋值，该变量现在也位于局部环境之中。\n\n这里，我还将参数名改回了 `x`，但此 `x` 会映射到 `f` 内部局部环境中的参数，而不是全局环境中的\
  \ `x`，这就是全局 `x` 和局部 `x` 不会产生冲突的原因。当我们调用函数时，有两个环境在起作用：包含局部变量的局部环境，以及包含全局变量的全局环境；参见图\
  \ 4-1。函数内部的代码会在局部环境中查找变量所引用的值，而全局代码则在全局环境中查找。\n\n你可能现在会好奇，函数 `f` 似乎也知道的 `sqrt()`\
  \ 和 `sum()` 这些名称。它们并不在局部环境中。（它们也不在全局环境中；你可以用 `as.list(globalenv())` 验证一下。）那么函数是如何找到它们的呢？我们现在来看，环境中还有一个巧妙之处，用于处理在直接作用域中找不到的变量，以及这个技巧如何解决刚才的问题。\n\
  \n**图 4-1.** 函数调用中的局部环境和全局环境\n\n## 环境链、作用域与函数调用\n\n在 R 中调用函数时，首先会为该函数创建一个空环境。这个环境将存储其参数，函数内赋值的任何局部变量也会存放在这里。每当\
  \ R 需要查找某个值，它都会在这个环境中寻找。如果找到了变量，你就获得这张表中的值。但如果没找到，R 并不会就此放弃，而是会继续搜索。\n\n环境不仅仅是表，更是表组成的链条。每个环境都有一个“父环境”（你可以使用\
  \ `parent.env()` 函数获取它），如果在一个环境中查找失败，R 就会去父环境中查找。如果在父环境中也找不到，它会尝试祖父环境，并且只要还有更上层环境，就会一直向上追溯。\n\
  \n思考以下代码：\n\n```\nf <- function(x) {\n  sqrt(sum(x + y))\n}\nx <- 1:10\ny <- 1:10\n\
  f(x²)\n```\n\n**图 4-2.** 局部环境和全局环境通过父指针相互关联\n\n\n\n## [1] 20.97618\n\n我们在全局环境中定义了三个变量：`f`、`x`\
  \ 和 `y`，其中 `f` 是一个函数。然后我们调用该函数，创建了一个局部环境，用于存放 `f` 的参数 `x`；参见图 4-2。\n\n局部环境和全局环境中的\
  \ `x` 指向不同的值。如果在函数内部查找 `x` 的值，我们会得到局部环境中的那个值；参见图 4-3。函数体内使用的 `sqrt`、`sum` 和 `y`\
  \ 这些名称并未在局部环境中定义。如果环境仅仅是表格，我们就无法运行这段代码。然而，父环境允许我们查找非局部变量。当 R 在局部环境中找不到 `y` 时，它会去父环境（即全局环境）中查找，并在那里找到它；参见图\
  \ 4-4。\n\n`sqrt` 和 `sum` 变量也未在局部环境中定义，因此 R 也会去父环境中查找，但它们同样不在全局环境中。尽管本书后续内容不会深入全局环境之外的结构，但环境链实际上要比这更深。在全局环境之后，你会遇到包含已加载包中名称的环境，这就是为什么你可以使用包中的函数。当你遍历完这些环境后，就会到达所谓的“基础环境”，那里存放着\
  \ R 的基础函数（你可以通过 `baseenv()` 函数获取这个环境），最后是一个终止搜索的空环境。正是在这个基础环境中，我们找到了 `sum` 和 `sqrt`；参见图\
  \ 4-5。这个机制在整条链上都是相同的，所以如果你理解了函数与全局环境之间的工作方式，你也就能理解所有环境的工作原理 1.\n\n**图 4-3.** 查找局部变量\
  \ `x`\n\n1 包也利用环境系统来区分公共名称和私有名称，但这并非通过独立的机制实现。它们只是使用了不同的环境链：我们挂在公共环境上，而它们则拥有另一个包含我们不可见私有名称的环境。\n\
  \n**图 4-4.** 查找全局变量 `y`\n\n**图 4-5.** 查找变量 `sum`\n\n无论何时需要变量的值——无论是使用标准求值（由 R 自动查找环境），还是在非标准求值中向\
  \ `eval` 提供一个环境——你都会利用父环境链来查找不在直接作用域内的变量。\n\n## 作用域、惰性求值与默认参数\n\n了解变量如何映射到值的规则，也有助于我们理解：为什么在定义函数时，可以在默认参数的表达式中使用函数参数，但在调用函数时却不能。\n\
  \n如果我们定义一个函数，其默认参数设置为引用另一个参数的表达式：\n\n```\nf <- function(x, y = 2 * x) x + y\n```\n\
  \n我们可以这样调用它：\n\n```\na <- 2\nf(x = a)\n## [1] 6\n```\n\n但*不一定*能这样调用：\n\n```\nf(x\
  \ = a, y = 2 * x)\n```\n\n在这两种情况下，我们首先都会为函数创建一个环境，并在其中存储从 `x` 和 `y` 到值的映射。不过，函数参数并非直接传值，而是通过惰性求值来传递。你可以将这种惰性求值理解为类似本章前面提到的\
  \ `quote(x + y)` 表达式。我们传递给函数的是未经求值的表达式，只有在必要时才会对其求值。\n\n因此，在这两种情况下，`f` 的环境都会将 `x`\
  \ 映射到 `a`，将 `y` 映射到 `2 * x`。然后我们尝试对 `x + y` 求值，这意味着需要触发 `a` 和 `2 * x` 这两个表达式的求值，而这两种调用的区别就体现在这里。\n\
  \n函数参数*也*拥有一个关联的环境。从这个意义上说，它们*并非*完全等同于 `quote(x + y)` 表达式。在第一种情况下，`x` 由用户提供，而 `y`\
  \ 使用默认值：`x` 的表达式 `a` 知道它应在全局作用域（其中定义了 `a`）中求值，但默认参数 `y = 2 * x` 则应在局部环境中求值；参见图 4-6。因此，当我们尝试对\
  \ `x + y` 求值时，我们会在全局环境中对表达式 `a` 求值以获取 `x` 的值，然后在局部变量（它知道 `x` 的值）中对表达式 `2 * x` 求值以获取\
  \ `y` 的值，这样我们就得到了所需的变量值。\n\n然而，在第二种情况下，`x` 和 `y` 都需要在全局环境中求值，因为这两个表达式都来自全局环境。我们仍然可以对\
  \ `a` 求值以获取 `x`，但全局环境中可能不存在 `x` 变量，导致无法对 `2 * x` 求值；更糟的是，全局环境中可能存在一个 `x`，但值却是错误的，这样我们得到的结果就会与预期不符。\n\
  \n在函数调用内部对参数求值时，所使用的环境取决于参数被提供的位置。默认参数会在局部环境中求值（参见图 4-6），而其他参数则会在调用作用域中求值（参见图 4-7）。\n\
  \n**图 4-6.** 使用默认参数进行求值\n\n**图 4-7.** 使用显式参数进行求值\n\n我们可以利用惰性求值来提取表达式（而非值），然后根据需要在不同的环境中对它们求值。对此的完整探讨超出了本书范围，但一个简短的示例如下：\n\
  \n```\nf <- function(expr, ...) {\n  expr <- substitute(expr) # 将参数转换为纯表达式\n  env\
  \ <- list2env(list(...)) # 从 '...' 创建环境\n  parent.env(env) <- parent.frame() # 从调用者环境中获取其余参数\n\
  \  eval(expr, env) # 在新环境中对表达式求值\n}\n\na <- 22\nf(a)\n## [1] 22\n\nf(a + b, b =\
  \ 13)\n## [1] 35\n```\n\n你可以使用 `substitute()` 函数剥离参数的环境，仅获取其表达式。在函数内部，我们使用 `list2env`\
  \ 将 `...` 参数转换为一个环境，然后通过 `parent.frame`（获取调用者的环境而非函数的局部作用域）将这个环境的父环境设置为调用作用域，最后在新环境中对表达式求值。这使我们能够传入额外的参数（如\
  \ `b = 13`），并利用它们代替局部环境进行求值。\n\n类似这样的技巧在 Tidyverse 包生态系统中被广泛使用。如果你想进一步探索，`rlang`\
  \ 包是一个绝佳的起点。它提供了多个高级工具，用于操控参数并在替代环境中对它们求值。不过，关于非标准求值的讨论就到此为止。\n\n## 嵌套函数与作用域\n\n\
  到目前为止，我们只考虑了全局环境和局部环境这两种环境，因此你很可能会认为局部环境的父环境始终是全局环境（并可能好奇既然如此，为什么还需要这一整套机制）。但事实并非如此。这仅仅是到目前为止我们定义函数的位置所导致的结果。\n\
  \n考虑下面这个稍显古怪但足够简单的函数：`f <- function() environment()`\n\n当我们调用 `f()` 时，它会返回其局部环境，这并没有什么新意。然而，`environment()`\
  \ 函数可以接受一个参数——一个函数——如果你用一个函数调用它，它返回的将不是当前环境，而是该函数被定义时的环境。我们在全局环境中定义了 `f`，所以 `environment(f)`\
  \ 会返回全局环境：\n\n```\nenvironment(f)\n## <environment: R_GlobalEnv>\n```\n\n现在应该很清楚了，这与我们在函数体内得到的环境是*不同*的：\n\
  \n```\nf()\n```\n\n```r\n## <environment: 0x7fe46613ae88>\n```\n\n"
- "# 第 4 章 作用域与闭包\n\n为了进一步说明这一点，我们尝试在 `f` 内部定义一个函数：\n\n```r\nf <- function(x) {\n\
  \  print(environment()) # 打印局部环境\n  g <- function(y) x + y\n  g\n}\n```\n\n由于 `f`\
  \ 仍定义在全局环境中，`environment(f)` 依然是 `R_GlobalEnv`，但我们在调用 `f` 时内部定义的函数 `g`，则是在局部环境中定义的：\n\
  \n```r\nenvironment(f)\n## <environment: R_GlobalEnv>\n\ng <- f(2)\n## <environment:\
  \ 0x7fe435b7a0a8>\n\nenvironment(g)\n## <environment: 0x7fe435b7a0a8>\n```\n\n如我们所见，在调用\
  \ `f()` 时打印的环境，与函数调用结果所关联的环境是同一个。\n\n需要特别注意的是，函数的**环境**与我们*调用*函数时获得的局部环境是不同的。函数的环境是我们定义函数时已存在的环境，而局部环境是在调用函数时新创建的环境。如果这一点清楚了，那么\
  \ R 设置父环境的规则就很简单了：当你调用函数时，新的局部环境会将函数的环境作为其父环境。\n\n## 第 4 章 作用域与闭包\n\n让我们详细回顾前面的示例。我们从定义完\
  \ `f` 之后开始（见图 4-8）。此时，我们只有全局环境（忽略其后的一系列父环境），因为我们还没有调用任何函数，因此也没有创建任何局部环境。在全局环境中，我们有一个对新函数的引用——变量\
  \ `f` 指向函数对象——而函数的环境就是全局环境（也就是我们定义它的地方）。\n\n当我们调用 `f` 时，会为这次函数调用创建一个新环境，新环境的父环境是函数的环境（即全局环境），并将参数\
  \ `x` 放入局部环境中（见图 4-9）。\n\n接着，在函数调用内部，我们定义了函数 `g`（见图 4-10）。这会创建一个新的函数对象，由于它是在函数调用环境中定义的，该环境就成为\
  \ `g` 的环境。我们通过将函数赋值给变量 `g` 来命名这个函数，这样局部环境中也就有了对该函数的引用。\n\n**图 4-8.** 定义 `f` 之后\n\
  \n## 第 4 章 作用域与闭包\n\n**图 4-9.** 调用 `f`\n\n我们从 `f` 的调用中返回新的函数对象，并在代码中将其赋值给全局环境中的变量\
  \ `g`（见图 4-11）。我们不必让函数对象在全局环境和局部环境中同名，但在此代码中，我们在两个环境中都使用变量 `g` 来引用同一个对象。\n\n通常，函数调用的局部环境在返回后会消失，因为返回后它便无法访问，但本例并非如此。我们在全局环境中调用的函数\
  \ `g`，其函数环境是 `f(2)` 调用的环境，因此该环境仍然存在。这一点很重要，因为我们现在要从全局环境调用 `g`。\n\n## 第 4 章 作用域与闭包\n\
  \n**图 4-10.** 在调用 `f` 时定义 `g`\n\n**图 4-11.** 从 `f` 的调用中返回 `g`\n\n## 第 4 章 作用域与闭包\n\
  \n**图 4-12.** 调用 `g`\n\n```r\ng(3)\n## [1] 5\n```\n\n让我们看看这次调用中发生了什么。你可以参照图 4-12\
  \ 来理解。\n\n我们为调用 `g(3)` 创建了一个新环境，由于 `g` 的环境是调用 `f(2)` 时创建的那个环境，因此该环境将成为父环境。参数 `y`\
  \ 被插入新环境中，所以当我们求值 `x + y` 时，可以从那里得到 `y`。变量 `x` 不在局部环境中，因此我们必须沿着父指针找到 `f(2)` 的环境，在那里我们找到它映射到\
  \ 2。\n\n## 第 4 章 作用域与闭包\n\n**闭包**\n\n我们在这里编写的 `g` 函数是一个所谓的*闭包*的示例：一个函数可以在创建它的函数调用环境中找到它所需的某些变量。通过闭包，我们可以将同一个函数放入不同的环境链中，从而使其适应不同的数据。\n\
  \n使用之前的 `f`，我们可以编写：\n\n```r\nh1 <- f(1)\n## <environment: 0x7fe446992678>\n\nh2\
  \ <- f(2)\n## <environment: 0x7fe4777ada20>\n\nh3 <- f(3)\n## <environment: 0x7fe477056128>\n\
  ```\n\n从而得到三个不同的函数，一个给输入加 1，一个加 2，一个加 3，所有这些都来自同一段代码。变量 `x` 将在三个不同的环境中找到——这些环境是在我们调用\
  \ `f` 时创建的，分别将 `x` 映射为 1、2 或 3。\n\n```r\nsapply(1:5, h1)\n## [1] 2 3 4 5 6\n\nsapply(1:5,\
  \ h2)\n## [1] 3 4 5 6 7\n\nsapply(1:5, h3)\n## [1] 4 5 6 7 8\n```\n\n## 第 4 章 作用域与闭包\n\
  \n闭包在函数式编程中经常使用，因为它们提供了一种将数据与函数打包在一起的方式，使我们能够将领域信息与通用代码分离。之前，我们使用三个闭包调用了 `sapply()`（它代表简化版的\
  \ apply）。`sapply()` 函数对序列中的每个元素调用其参数函数。它不关心函数具体做什么，但该函数必须能接受一个参数调用。通过使用闭包，我们将一个执行加法的函数适配为已经绑定了其中一个加法参数的函数。通过这样做，我们将加法适配到了\
  \ `sapply()` 提供的接口。\n\n我们也不需要特意编写返回闭包的函数。每当你定义一个函数，你就赋予它访问定义时作用域内所有变量的权限。所以如果你编写这样的代码：\n\
  \n```r\n# 将 x 中所有元素增加 inc\ninc_all <- function(x, inc) {\n  sapply(x, \\(a) a +\
  \ inc)\n}\n\ninc_all(1:5, 3)\n## [1] 4 5 6 7 8\n```\n\n你仍然创建了一个函数（本例中我们没有命名，它是函数\
  \ `\\(a) a + inc`），该函数知道增量是多少，因此 `sapply()` 可以使用它，而无需将增量作为额外参数。\n\n当然，一个向量表达式：\n\
  \n```r\n1:5 + 3\n## [1] 4 5 6 7 8\n```\n\n## 第 4 章 作用域与闭包\n\n会比使用 `sapply()` 更简洁、更高效，但我们的需求往往比简单的加法更复杂。也许我们需要检查数据中的哪些元素可以在某个数据库中找到——一个简单的示例如下：\n\
  \n```r\n## foo qux bar\n## TRUE FALSE TRUE\n```\n\n由于 `sapply()` 不了解数据库，我们需要将数据库打包到我们提供的函数中。如果我们在函数内部这样做，`sapply()`\
  \ 将无法访问数据库变量，但我们创建的函数 `\\(key) key %in% database` 可以。该函数会从 `sapply()` 获取 `key`，并从其作用域中获取\
  \ `database`。\n\n**访问最内层作用域之外**\n\n当我们使用 `<-` 运算符给变量赋值时，我们修改的是当前环境链顶部的环境，即局部环境。那么，这段代码会做什么呢？\n\
  \n```r\nmake_counter <- function() {\n  x <- 0\n  count <- function() {\n    x <-\
  \ x + 1\n    x\n  }\n}\n\ncounter <- make_counter()\n```\n\n这个函数的意图是创建一个函数（一个闭包），该函数每次调用时返回一个递增的数字。它不是纯函数，但可能对我们有用。在上一章编写的深度优先编号算法中，我们不得不在\n\
  \n## 第 4 章 作用域与闭包\n\n递归调用中传递当前数字，但如果我们有这样的计数器，就可以在每次需要时*用它*来获取下一个数字。\n\n然而，它并不工作。\n\
  \n```r\ncounter()\n## [1] 1\n\ncounter()\n## [1] 1\n\ncounter()\n```\n\n\n## [1]\
  \ 1\n\n我们可以解包该函数，看看具体发生了什么。当我们创建计数器时，调用 `make_counter` 函数，该函数创建了一个环境，其中 `x` 被设置为\
  \ `0`，然后返回 `count` 函数。\n\n当我们调用计数器函数时，它会通过闭包知道 `x` 的存在，因此可以计算 `x + 1`，并将结果赋值给 `x`。问题就出在这里。在计算\
  \ `x + 1` 时使用的 `x` 是通过沿环境链向上搜索找到的，但函数所赋值的 `x` 被放入了计数器函数自身的环境。函数返回后，该环境就消失了。下一次调用\
  \ `counter` 时，会创建一个新的函数实例，从而产生一个新的环境。来自 `make_counter` 函数的变量 `x` 永远不会被更新。\n\n当你使用\
  \ `<-` 时，如果局部变量不存在，就会创建一个新的局部变量。即使变量名在环境链更深层被发现，也没有影响。赋值始终是针对局部环境。\n\n要赋值给环境链中更深层的变量，你需要使用运算符\
  \ `<<-`。这个运算符会像 R 语言确定表达式求值方式一样，沿环境链向上搜索，并在找到该变量的环境中进行更新（如果环境链中找不到该变量，则将其添加到全局环境中）。\n\
  \n我们来看一下将示例中的赋值运算符更改后会发生什么：\n\n```\nMake_counter <- function() {\n  x <- 0\n  count\
  \ <- function() {\n    x <<- x + 1\n    x\n  }\n}\n\ncounter <- make_counter()\n\
  counter()\n## [1] 1\ncounter()\n## [1] 2\ncounter()\n## [1] 3\n```\n\n这次，当我们进行赋值时，发现外层环境中存在一个\
  \ `x`，即我们在调用 `make_counter` 时初始化的那个 `x`。因此，该赋值针对的是那个环境，而不是局部环境。每次调用 `counter` 时，我们都会创建一个新的函数实例环境，但所有实例都链接到同一个外层环境，因此每次调用该函数时，我们都会更新同一个环境。\n\
  \n我们可以结合使用这个计数器函数和 `<<-` 运算符，来创建 `depth_first_numbers` 函数的一个更简单版本，这样就不需要在递归调用中传递数据了。我们可以在最外层作用域中创建一个表格和一个计数器函数，然后直接使用该计数器并通过\
  \ `<<-` 对表格进行赋值：\n\n```\ndepth_first_numbers <- function(tree) {\n  table <- c()\n\
  \  counter <- make_counter()\n  traverse_tree <- function(node) {\n    if (is.null(node$left)\
  \ && is.null(node$right)) {\n      dfn <- counter()\n      node$range <- c(dfn,\
  \ dfn)\n      table[node$name] <<- dfn\n      node\n    } else {\n      left <-\
  \ traverse_tree(node$left)\n      right <- traverse_tree(node$right)\n      new_node\
  \ <- make_node(node$name, left, right)\n      new_node$range <- c(left$range[1],\
  \ right$range[2])\n      new_node\n    }\n  }\n  new_tree <- traverse_tree(tree)\n\
  \  list(tree = new_tree, table = table)\n}\n\nresult <- depth_first_numbers(tree)\n\
  print_tree(result$tree)\n## [1] \"((A,B) ,D)\"\nresult$table\n## A B D\n## 1 2 3\n\
  ```\n\n如果我们想用深度优先编号范围来标注所有节点，我们仍然需要在这里创建一个新树；我们仍然不能修改数据，但是可以在递归函数内部使用外层作用域中的变量。\n\
  \n**词法作用域与动态作用域**\n\n这种根据函数定义时所处环境来查找变量值的规则，被称为词法作用域，是最常见的作用域标准。之所以这样称呼，是因为原则上你可以通过代码判断表达式中的变量是在哪里定义的。首先，你检查变量是否在当前局部环境中设置，可以是局部变量或函数参数。如果没有，你会查看外围代码，检查该变量是否在该环境中。外围代码可以是全局环境，也可以是另一个函数。如果它是一个函数且变量未定义，你会沿着函数定义处的代码继续向外查找。如果变量到值的映射取决于函数被调用的位置而非定义的位置（即所谓的动态作用域），那么仅通过阅读函数定义处的代码，你无法确定变量名所引用的到底是哪个变量。\n\
  \nR 语言支持两种作用域，其中词法作用域是默认的（标准求值模式）。尽管如此，通过修改环境链，你可以访问调用函数的作用域（在非标准求值模式下）。在某些情况下，非标准求值可以为你的代码提供更简洁的接口，但在大多数项目中，你应该坚持使用标准的词法作用域，因为它是最容易处理的。\n\
  \n需要动态作用域和非标准求值的一个常见场景是，当你需要对表达式求值，而表达式中的数据部分存在于变量中，部分存在于数据框中时。在这里，如果你能像使用标准变量一样使用数据框变量，就能获得更简洁的接口。因此，我将给出一个如何实现这一点的例子。\n\
  \n我们将编写一个函数，它接受一个表达式和一个数据框作为输入，并在一个环境中对该表达式求值，该环境会优先在数据框中查找变量。如果找不到，它会在调用者（而非函数）的环境中查找。\n\
  \n该函数看起来像这样：\n\n```\ndf_eval <- function(expr, df = list()) {\n  x <- substitute(expr)\
  \  # 剥离 expr 的环境；现在只是引号内的表达式\n  env <- list2env(df, parent = parent.frame())\n \
  \ eval(x, env)\n}\n```\n\n我们使用 `substitute()` 函数来剥离 `expr` 的环境。它将 `expr` 转换为原始表达式，就像我们可以用\
  \ `quote()` 创建的那样。我将其存储在变量 `x` 中，是为了稍后说明一个要点；通常情况下，我可能仍会称它为 `expr`。\n\n无论如何，接下来我们根据数据框创建一个新环境。数据框也是列表，因此\
  \ `list2env()` 会创建一个环境，其中数据框中的每个变量都存储为环境变量。新环境的父环境是 `parent.frame()`，即调用者的环境。这样设置会将数据框放在前面，因此我们在查找父框架之前，会先使用数据框中的变量。如果在数据框中找不到某个变量，我们就会在调用者的环境中查找。最后，我们在新环境中对\
  \ `x` 进行求值。\n\n让我们设置一些数据来进行实验：\n\n```\nx <- 1:3\ny <- \"foo\"\ndf <- data.frame(y\
  \ = 2:4, z = 3:5)\n```\n\n我们在调用者的环境中有一个 `x` 和一个 `y`，在数据框中有 `y` 和 `z`。我们希望函数选择这个\
  \ `x`（而不是 `df_eval` 内部的 `x`），并且如果我们调用 `df_eval` 并传入 `df` 作为数据框，我们不应该选择变量 `y`，而应该选择数据框中的\
  \ `y`。\n\n让我们测试一下。首先，仅使用 `x` 调用它：\n\n```\ndf_eval(x)\n## [1] 1 2 3\n```\n\n我们没有提供数据框，因此使用了默认参数，但这次调用的目的是展示我们选择了全局环境中的\
  \ `x`，而不是函数内部的 `x`。\n\n现在，让我们看看它是否会优先选择数据框中的 `y` 而不是这里的变量：\n\n```\ndf_eval(y+z,\
  \ df)\n```\n\n\n```markdown\n\n# 1 5 7 9\n\n是的，它按预期工作。\n\nR 中有几个内置函数以这种方式进行非标准求值——在求值表达式时将数据框放入当前环境中——这是一种利用环境机制的合理方式。不过，不要过度使用。\n\
  \n# 第 5 章：高阶函数\n\n*高阶函数*这个术语指的是那些以函数作为参数或返回函数的函数。我们在前一章中用来创建闭包的函数就是高阶函数。\n\n在 R\
  \ 中，高阶函数经常被用来替代循环控制结构，我们将在下一章中详细介绍如何做到这一点。在转向使用函数操作函数的更有趣的内容之前，我先在这里给出一个简单的例子。\n\
  \n我们在上一章中看到的 `sapply` 函数，允许你对列表或向量中的所有元素调用一个函数。你应该主要在 R 的交互式使用中用这个函数，因为它有点不安全。它会根据你给出的输入和函数的行为来猜测你想要的输出类型，这里有更安全的替代方案，`vapply`\
  \ 和 `lapply`，它们的输出类型分别是预定义的类型或始终是列表。\n\n无论如何，如果你想对向量中的所有元素求值一个函数，你可以编写如下代码：\n\n\
  ```r\nsapply(1:4, sqrt)\n## [1] 1.000000 1.414214 1.732051 2.000000\n```\n\n© Thomas\
  \ Mailund 2023  \nT. Mailund, *Functional Programming in R 4*, <https://doi.org/10.1007/978-1-4842-9487-1_5>\n\
  \n这会对向量 `1:4` 中的所有元素求值 `sqrt` 并给出结果。它是向量化表达式的一种类比，如果你的表达式可以向量化，向量化版本可能总是更优的。向量表达式更易读，并且如果涉及调用内置函数，通常会快得多：\n\
  \n```r\nsqrt(1:4)\n```\n\n但是，当你想要调用的函数没有被向量化时，你可以使用 `sapply` 对序列中的所有元素求值该函数。事实上，我们在第一章中看到的\
  \ `Vectorize` 函数就是使用 `sapply` 的表亲 `lapply` 实现的。\n\n我们可以像这样实现自己的版本：\n\n```r\nmyapply\
  \ <- function(x, f) {\n  result <- x\n  for (i in seq_along(x))\n    result[i] <-\
  \ f(x[i])\n  result\n}\n\nmyapply(1:4, sqrt)\n## [1] 1.000000 1.414214 1.732051\
  \ 2.000000\n```\n\n这里，我通过复制 `x` 创建了一个长度正确的结果向量。对这个向量的赋值可能会创建副本。第一次赋值肯定会，因为我们正在修改一个向量，R\
  \ 通过制作副本来避免这种情况。后续的赋值可能会再次进行此操作，以转换结果的类型。尽管如此，其工作原理仍然相当简单明了，并且如果输入和输出具有相同类型，它将以线性时间运行（取决于对\
  \ `f` 的函数调用次数，而 `f` 本身可以具有任意时间复杂度）。\n\n使用像 `sapply` 或 `myapply` 这样的函数，或者它们的任何同类，让我们可以用一个函数调用来替换循环，而在循环中，可能会发生各种我们不希望发生的对局部变量的赋值。我们只需要将循环体包装在另一个我们可以传递给\
  \ apply 函数的函数中。\n\n如果我们需要将某些信息传递给函数，闭包与 apply 函数结合使用会特别有用。例如，让我们考虑一个需要对向量中的元素进行缩放的情况。我们在第一章中编写了这样一个函数：\n\
  \n```r\nrescale <- function(x) {\n  m <- mean(x)\n  s <- sd(x)\n  (x - m) / s\n\
  }\n\nrescale(1:4)\n## [1] -1.1618950 -0.3872983  0.3872983  1.1618950\n```\n\n这个函数是用向量表达式编写的，这是正确的做法，但让我们看看可以用\
  \ apply 函数做什么。显然，我们仍然需要计算 `m` 和 `s`，然后需要一个计算 `(x - m) / s` 的函数：\n\n```r\nrescale\
  \ <- function(x) {\n  m <- mean(x)\n  s <- sd(x)\n  f <- function(y) (y - m) / s\n\
  \  myapply(x, f)\n}\n\nrescale(1:4)\n## [1] -1.1618950 -0.3872983  0.3872983  1.1618950\n\
  ```\n\n其实没有必要给函数命名然后再传递它；我们也可以这样写：\n\n```r\nrescale <- function(x) {\n  m <- mean(x)\n\
  \  s <- sd(x)\n  myapply(x, \\(y) (y - m) / s)\n}\n\nrescale(1:4)\n## [1] -1.1618950\
  \ -0.3872983  0.3872983  1.1618950\n```\n\n我们传递给 `myapply` 的函数 `\\(y) ...` 知道它被创建时的环境，因此它知道\
  \ `m` 和 `s`，并且可以在从 `myapply` 调用时使用这些变量。\n\n## 柯里化\n\n我们经常会遇到这样一种情况：有一个两个参数的函数，你想要绑定其中一个参数，并返回一个以第二个参数为参数的函数。例如，如果我们想使用函数\n\
  \n```r\nf <- function(x, y) x + y\n```\n\n我们可能想要使用 `myapply` 将其应用于一个序列，给每个元素加上 2。再次强调，这个例子只是为了向你展示一种通用技术，当你可以用向量表达式解决问题时，永远不应该做这些事情。尽管如此，让我们暂时假装我们没有向量表达式。那么我们需要为其中一个参数（比如\
  \ `y`）创建一个函数，然后在调用时求值 `f(2, y)`。\n\n显然，我们可以这样写：\n\n```r\ng <- function(y) f(2, y)\n\
  myapply(1:4, g)\n## [1] 3 4 5 6\n```\n\n或者更简洁地写成：\n\n```r\nmyapply(1:4, \\(y) f(2,\
  \ y))\n## [1] 3 4 5 6\n```\n\n如果我们只需要给序列中的所有元素加 2，这就足够了。如果我们想要一个更通用的解决方案，我们需要一个函数来创建我们需要的函数，一个记住\
  \ `x` 并且可以用 `y` 调用的闭包。编写这样的函数稍微复杂一点；我们只需要一个返回如下函数的函数：\n\n```r\nh <- function(x)\
  \ \\(y) f(x, y)\nmyapply(1:4, h(2))\n## [1] 3 4 5 6\n```\n\n函数 `f` 和 `h` 最终做的是同一件事，唯一的区别在于我们如何向它们提供参数。函数\
  \ `f` 需要同时提供两个参数，而函数 `h` 一次只接受一个参数：\n\n```r\nf(2, 2)\n## [1] 4\n\nh(2)(2)\n## [1]\
  \ 4\n```\n\n像 `h` 这样的函数，它不是通过单个函数调用接收一系列参数，而是通过一系列函数调用，每个调用接受一个参数并返回一个新函数，这被称为*柯里化*函数。我们将\
  \ `f` 转换为 `h` 的过程称为对 `f` 进行*柯里化*。这些名称源自逻辑学家哈斯凯尔·柯里，函数式编程语言 Haskell 的名字也来源于他。\n\n\
  我们手动完成了从 `f` 到 `h` 的转换，但我们可以编写一个转换函数的函数：一个接受函数作为输入并返回另一个函数的函数。因此，我们可以编写一个通用的柯里化函数的函数——另一个高阶函数。一个用于柯里化两个参数的函数的函数可以这样编写：\n\
  \n```r\ncurry2 <- function(f) \\(x) \\(y) f(x, y)\n```\n\n参数 `f` 是我们想要柯里化的函数，返回值是函数\n\
  \n```r\n\\(x) \\(y) f(x, y)\n```\n\n它需要先使用参数 `x` 调用，然后使用参数 `y` 调用，之后它将返回值 `f(x,\
  \ y)`。这里的变量名无关紧要，它们只是名称，不必与 `f` 实际使用的变量名有任何关系。\n\n使用这个函数，我们可以自动从 `f` 创建 `h`：\n\n\
  ```r\nh <- curry2(f)\n\nf(2, 3)\n## [1] 5\n\nh(2)(3)\n## [1] 5\n```\n\n由于 `+` 在\
  \ R 中只是一个函数，我们也可以直接使用*它*，而无需先编写函数 `f`：\n\n```r\nh <- curry2(`+`)\nh(2)(3)\n## [1]\
  \ 5\n```\n\n因此，可以用如下代码实现给序列中所有元素加 2 的操作：\n\n```r\nmyapply(1:4, curry2(`+`)(2))\n\
  ```\n\n```\n\n\n"
- "# [1] 3 4 5 6\n\n你觉得这个写法是巧妙还是过于简洁而难以理解，全凭个人品味。它显然不如向量表达式优雅，但一旦你熟悉了柯里化的作用，解析起来也并不困难。\n\
  \n话虽如此，我本人还是更喜欢任何一天都使用`myapply`，因为我发现那个版本更易读。但我们还是继续深入探讨一下柯里化。不过请注意，所有这些不同的方法都在做同一件事：通过绑定第一个参数，将二元运算符`+`转化为一个单一函数。\n\
  \n```\nmyapply(1:4, \\(y) 2 + y)\n## [1] 3 4 5 6\n```\n\n我们为柯里化编写的函数只适用于恰好接受两个参数的函数。我们显式创建了一个返回函数的函数，而这个返回函数最终返回最终值，因此柯里化版本必须能处理接受两个参数的函数。但在\
  \ R 中，函数是可以被检查的数据，所以我们可以创建一个通用的版本，能够处理任意数量参数的函数。我们只需要知道函数接受的参数个数，然后创建一个函数序列来处理每一个参数。\n\
  \n完整实现如下所示，在函数列表之后我会详细解释：\n\n```\ncurry <- function(f) {\n  n <- length(formals(f))\n\
  \  if (n == 1) return(f) # 无需柯里化\n  arguments <- vector(\"list\", length = n)\n\
  \  last <- function(x) {\n    arguments[n] <<- x\n    do.call(f, arguments)\n  }\n\
  \  make_i <- function(i, continuation) {\n    force(i) ; force(continuation)\n \
  \   function(x) {\n      arguments[i] <<- x\n      continuation\n    }\n  }\n  continuation\
  \ <- last\n  for (i in seq(n-1, 1)) {\n    continuation <- make_i(i, continuation)\n\
  \  }\n  continuation\n}\n```\n\n首先，我们获取函数`f`接受的参数个数：`n <- length(formals(f))`\n\n\
  我们可以使用`formals`函数获取这些参数。它返回一个所谓的“配对列表”（pair-list），本质上是一个链表，类似于我们在第三章中看到的那种，它在 R\
  \ 内部使用，但在实际的 R 编程中并不常用。你可以把它当作列表来对待，除了一些运行时性能差异外，其行为相同。我们只需要知道这个列表的长度。\n\n如果`f`只接受一个参数，我们就直接返回它。这样它就已经是最大程度的柯里化了。否则，我们创建一个列表，用于在调用函数链时存储变量：\n\
  \n```\narguments <- vector(\"list\", length = n)\n```\n\n我们需要收集传递给所创建的各个函数的参数。我们不能像在`curry2`中那样简单地使用形式参数`x`和`y`，因为在我们检查输入函数`f`之前，不知道需要多少个参数。无论如何，我们需要动态创建名称以确保它们不会冲突。将参数保存在一个列表中更简单，而且由于它是一个列表，我们可以将作为参数传递的任何类型的值放入其中。\n\
  \n现在，我们需要创建实际要返回的函数。我们分步进行。我们创建的最终函数应当使用所有参数调用`f`。它将最后一个参数作为输入，因此我们需要将其存储在`arguments`中——由于这意味着修改实际函数作用域之外的列表，我们需要使用`<<-`赋值运算符。为了使用参数列表调用`f`，我们需要使用`do.call`函数。它允许我们以列表形式指定函数的参数，而不是直接用逗号分隔的参数来传递。\n\
  \n```\nlast <- function(x) {\n  arguments[n] <<- x\n  do.call(f, arguments)\n}\n\
  ```\n\n其他每个函数也需要存储一个参数，因此它们需要知道对应的索引，然后返回柯里化链中的下一个函数。我们可以这样创建这些函数：\n\n```\nmake_i\
  \ <- function(i, continuation) {\n  force(i) ; force(continuation)\n  function(x)\
  \ {\n    arguments[i] <<- x\n    continuation\n  }\n}\n```\n\n参数`i`是索引，我们用它来为参数赋值；参数`continuation`是那个在最终结果能从`last`函数返回之前仍需被调用的函数。它是柯里化函数的延续。在返回函数之前，我们需要在`make_i`内部对这两个参数进行求值。否则，我们会遇到惰性求值问题：当我们最终调用函数时，变量的值可能已经在我们创建函数后改变了。我们通过调用`force`来处理参数。\n\
  \n现在我们只需将所有部分绑定在一起。我们以降序方式操作，这样在创建下一个函数时，我们始终拥有所需的延续函数。第一个延续函数是`last`函数。它应该是最后一个被调用的函数，并将返回整个柯里化链的期望结果。每次对`make_i`的调用都会返回一个新的延续函数，我们将其提供给链中的下一个函数（按降序排列）：\n\
  \n```\ncontinuation <- last\nfor (i in seq(n-1, 1)) {\n  continuation <- make_i(i,\
  \ continuation)\n}\n```\n\n最终创建的延续函数就是柯里化后的函数，这就是我们在`curry`末尾返回的内容。\n\n现在，我们可以使用这个`curry`函数将任何函数转换为柯里化版本：\n\
  \n```\nf <- function(x, y, z) x + 2*y + 3*z\nf(1, 2, 3)\n## [1] 14\ncurry(f)(1)(2)(3)\n\
  ## [1] 14\n```\n\n这与直接调用`f`的语义并不完全相同；我们在将表达式赋值给参数列表时就对其进行了求值，因此惰性求值在这里并不适用。编写一个能处理参数惰性求值的函数需要大量涉及环境和表达式的复杂操作，这超出了本书的范围。\n\
  \n不过除此之外，我们已经编写了一个通用函数，用于将普通函数转换为其柯里化形式。\n\n反向转换（即自动将柯里化函数转换为非柯里化形式）要困难得多。当我们得到一个函数时，我们无法知道需要调用它多少次才能得到一个值——即使调用次数与传递给它的参数无关——因此我们无法确定应该为非柯里化版本的函数获取多少个参数。\n\
  \n`curry`函数并非完全通用。我们无法处理默认参数——柯里化版本中必须提供所有参数——而且我们也无法创建这样一个函数：其中部分参数被固定，而其他参数不固定。柯里化版本始终需要按照原始函数接受参数的精确顺序来接收参数。\n\
  \n### 一个参数绑定函数\n\n我们已经拥有所有必要的工具，可以编写一个函数，用于绑定函数的一组参数，并返回另一个函数，在该函数中我们可以提供剩余参数并获得结果：\n\
  \n```\nbind_parameters <- function(f, ...) {\n  remembered <- list(...)\n  function(...)\
  \ {\n    new <- list(...)\n    do.call(f, c(remembered, new))\n  }\n}\n```\n\n```\n\
  f <- function(x, y, z, w = 4) x + 2*y + 3*z + 4*w\nf(1, 2, 3, 4)\n## [1] 30\ng <-\
  \ bind_parameters(f, y = 2)\ng(x = 1, z = 3)\n## [1] 30\nh <- bind_parameters(f,\
  \ y = 1, w = 1)\nf(2, 1, 3, 1)\n## [1] 17\nh(x = 2, z = 3)\n```\n\n\n\n## [1] 17\n\
  \n我们从第一次函数调用中获取参数，并将其保存到一个列表中，然后返回一个闭包，该闭包可以接收剩余参数，将它们转为列表，合并已记忆的参数和新参数，并通过 `do.call`\
  \ 调用函数 `f`。\n\n我们之前已经见过所有的构建块，现在只是将它们组合起来，将一个函数转换为另一个函数。\n\n在这里使用 `list` 来记忆来自 `...`\
  \ 的参数，意味着我们正在对参数进行求值。我们在该函数中明确关闭了惰性求值。保持惰性求值的语义也是可能的，但这需要更多工作。我们需要使用 `eval(substitute(alist(...)))`\
  \ 技巧来将未求值的参数放入一个列表中——我们在第一章中见过这个技巧——但这会让我们在列表中得到原始表达式，并且需要小心地在正确的环境链中对这些表达式求值，才能使其正常工作。我把这作为练习留给读者，或者你可以查看\
  \ `pryr` 包中的 `partial` 函数，了解它是如何实现的。\n\n这种部分绑定函数在 R 中并不常用。编写闭包来绑定参数同样简单，而且通常更易读，因此在使用部分绑定时需谨慎。\n\
  \n**续延传递风格**\n\n我们用来创建 `curry` 的技巧涉及创建一个函数链，其中每个函数返回下一个应被调用的函数，即*续延*（*continuation*）。这种将计算的剩余部分作为一个可最终调用的函数的想法，可以应用于许多其他问题。\n\
  \n考虑一个简单的任务：对列表中的所有元素求和。我们可以通过以下三种方式编写函数来实现：\n\n```\nmy_sum_direct <- function(lst)\
  \ {\n  if (is_empty(lst)) 0\n  else first(lst) + my_sum_direct(rest(lst))\n}\n\n\
  my_sum_acc <- function(lst, acc = 0) {\n  if (is_empty(lst)) acc\n  else my_sum_acc(rest(lst),\
  \ first(lst) + acc)\n}\n\nmy_sum_cont <- function(lst, cont = identity) {\n  if\
  \ (is_empty(lst)) cont(0)\n  else my_sum_cont(rest(lst),\n                   function(acc)\
  \ cont(first(lst) + acc))\n}\n```\n\n第一个函数以直观的方式处理计算：将当前元素与递归调用的结果相加。第二个函数使用累加器来构建一个尾递归版本，其中累加器在递归过程中携带部分和。第三个版本同样提供了一个尾递归函数，但这次是通过一个续延函数来实现的。该函数的作用类似于第二个函数中的累加器；它只是将计算包装在一个函数内，该函数在递归调用中被传递下去。\n\
  \n在这里，续延捕获了向下递归过程中的部分和——这与第二个函数中累加器的作用相同——但表示为尚未求值的函数。该函数最终会被递归其余部分的和值所调用，因此在该递归位置的任务仅仅是接收最终会提供的值，加上当前值，然后调用先前传递给它的续延以完成计算。\n\
  \n对于“对列表中的数字求和”这样简单的任务，续延传递当然是杀鸡用牛刀。如果你需要尾递归，累加器版本更简单、更快；而且无论如何，你只是用续延向上传递的函数调用替换了向下遍历向量的递归（不过后续会看到这个问题的一种解决方案）。尽管如此，在一个简单的例子中看到这三种递归方式——直接递归、累加器递归和续延传递递归——有助于理解它们的工作原理及区别。\n\
  \n续延的一个常见用途是将非尾递归函数转换为尾递归函数。举个例子，我们回到第 [3 章](https://doi.org/10.1007/978-1-4842-9487-1_3)中用于计算树的大小的函数。在那个解决方案中，我们需要处理内部节点：先递归调用左子树，再调用右子树，获取它们的大小，然后将它们相加并加\
  \ 1（表示内部节点自身）。因为我们需要两次递归调用的结果，所以无法直接使该函数变成尾递归。使用续延，我们可以做到。\n\n这个技巧是传递一个续延，用它来包裹其中一次递归，而我们可以通过尾递归调用来处理另一次递归。解决方案如下所示：\n\
  \n```\nsize_of_tree <- function(node, continuation = identity) {\n  if (is.null(node$left)\
  \ && is.null(node$right)) {\n    # 叶子节点，大小为 1。\n    # 告诉续延根据该值计算后续部分。\n    continuation(1)\n\
  \  } else {\n    # 创建一个续延，将在获得左树大小时被调用\n    left_continuation <- function(left_result)\
  \ {\n      # 当获得左树大小时，创建一个续延，\n      # 用于合并左树和右树（并将其传递给续延）\n      right_continuation\
  \ <- function(right_result) {\n        continuation(left_result + right_result +\
  \ 1)\n      }\n      # 计算右树的大小\n      size_of_tree(node$right, right_continuation)\n\
  \    }\n    # 计算左树的大小\n    size_of_tree(node$left, left_continuation)\n  }\n}\n\n\
  tree <- make_node(\"root\",\n                  make_node(\"C\", make_node(\"A\"\
  ),\n                            make_node(\"B\")),\n                  make_node(\"\
  D\"))\nsize_of_tree(tree)\n```\n\n\n\n## [1] 5\n\n该函数在调用时接受一个延续，负责计算“后续需要完成的工作”。如果我们当前查看的节点是叶子节点，就用\
  \ `1` 调用它——因为叶子节点的大小为 1——然后它会执行任何所需的计算，以算出先前已遍历并封装在延续参数中的树的大小。\n\n默认延续是恒等函数：\n\n\
  `function(x) x`\n\n因此，如果我们仅用叶子节点调用该函数，会得到值 `1`。但当我们遇到内部节点时，会修改延续，以封装那些因尚未掌握计算所需的全部信息而无法立即完成的部分计算。\n\
  \n对于内部节点，我们这样做：\n\n```\n# 创建一个延续，该延续将接收左子树的大小\nleft_continuary <- function(left_result)\
  \ {\n    # 当我们获得左子树的大小时，创建一个组合左、右子树的延续（并将其传递给延续）\n    right_continuation <- function(right_result)\
  \ {\n        continuation(left_result + right_result + 1)\n    }\n    # 计算右子树的大小\n\
  \    size_of_tree(node$right, right_continuation)\n}\n# 计算左子树的大小\nsize_of_tree(node$left,\
  \ left_continuation)\n```\n\n我们创建一个延续，只要给它左子树的大小，它就能计算出整棵树的大小。当该延续被调用时，它接收左子树的大小作为参数，但自身需要计算右子树的大小。为此，它需要一个能获取右子树大小的延续，而当\
  \ *那个* 函数被调用时，我们就可以返回内部节点的大小：左子树大小加右子树大小再加一。它通过调用延续来返回结果，该延续随后会处理从递归返回时必须进行的后续操作。\n\
  \n`left_continuation` 用这个 `right_continuation` 对右子树发起递归调用，从而将右子树的大小传入 `right_continuation`\
  \ 函数。但在调用 `left_continuation` 之前，我们先调用 `size_of_tree(node$left, left_continuation)`\
  \ 来获取左子树的大小。当遍历完左子树后，`left_continuation` 会随其大小被调用。\n\n由于它是尾递归的，我们可以用循环替换递归调用。这次，我们需要记住在创建新延续时强制求值该延续，因为循环时我们在修改局部参数。除此之外，其形式与你期望的将尾递归函数转换为循环函数的通用模式一致。\n\
  \n```\nsize_of_tree <- function(node, continuation = identity) {\n    repeat {\n\
  \        if (is.null(node$left) && is.null(node$right)) {\n            return(continuation(1))\n\
  \        }\n        new_continuation <- function(continuation) {\n            force(continuation)\n\
  \            function(left_result) {\n                size_of_tree(\n          \
  \          node$right,\n                    function(right_result) continuation(left_result\
  \ + right_result + 1)\n                )\n            }\n        }\n        # 模拟递归调用\n\
  \        node <- node$left\n        continuation <- new_continuation(continuation)\n\
  \    }\n}\n\nsize_of_tree(tree)\n```\n\n## [1] 5\n\n不过，这里有一个问题。我们避免了向左的深层递归，但我们创建的延续会像之前递归那样调用同样深度的函数。向右的递归调用仍然是函数调用——我们在那里还需要另一个延续，并且还不能覆盖左延续。此外，每次我们通常递归调用时，都会将一个函数包裹在另一个函数内部，当这些函数需要被求值时，我们仍然会面临深层嵌套的函数调用。\n\
  \n将此类函数转换为纯循环仍然是可能的，但要求 *所有* 尾调用（即我们立即返回其结果的那类函数）都得到优化。某些编程语言实现了这一点，这在纯函数式编程语言中很常见，但\
  \ R 语言并不支持。\n\n不幸的是，我们自己也很难将其重写为一个循环函数。\n\n不过，有一个利用闭包的技巧可以绕过这个问题。它不会让我们获得用循环替代递归所带来的性能提升，实际上反而会稍微慢一些，但它能让我们编写包含多个递归调用的函数，而无需担心递归调用过深。如果你的算法需要递归，或者递归能带来更简单的实现，并且你并不迫切需要高性能，就可以使用这个通用技巧。\n\
  \n### 延迟求值与蹦床\n\n解决递归过深问题有两个关键部分。第一部分叫做“thunk”（延迟计算体）。它本质上是一个不接受参数、仅返回值的函数。它用于封装一小段计算，供日后求值。我们可以像这样将一个函数及其参数转换为一个\
  \ thunk：\n\n```\n# 一个可以直接调用的函数，例如 f(1, 2)\nf <- function(x, y) x + y\n\n# thunk\
  \ 将会调用 f(1, 2)\nthunk <- \\( ) f(1, 2)\n\nf(1, 2)\n## [1] 3\n\nthunk()\n## [1] 3\n\
  ```\n\n我们将对 `f` 的调用 `f(1, 2)` 封装在一个不接受任何参数的函数 `\\( ) f(1, 2)` 中，这样在不调用 `f` 的情况下，我们创建了一个函数\
  \ `thunk`，它 *如果* 被我们调用，就会求值 `f(1, 2)`。这有点像函数参数的惰性求值。\n\n如果你所处的环境中 `f` 后续可能会绑定到其他值，你可以进一步处理。你不希望使用\
  \ `\\( ) f(1, 2)`，因为那会在你调用 `thunk()` 时调用当前的 `f`（无论其为何值），但你可以通过类似下面的方式将 `f` 置于一个不会改变的环境中：\n\
  \n```\nmake_thunk <- function(f, ...) {\n    # 确保变量在我们返回后不会改变\n    force(f)\n  \
  \  params <- list(...)\n    # 然后返回 thunk\n    \\( ) do.call(f, params)\n}\n\ng <-\
  \ make_thunk(f, 1, 2)\ng()\n```\n\n\n## [1] 3\n\n通过调用 `force(f)`，你确保 thunk 环境中的\
  \ `f` 保持不变；而通过立即求值 `...` 参数（将其放入列表中），你确保变量会被绑定到创建 thunk 时所持有的值，而不是在调用 thunk 时可能持有的值。\n\
  \n第一种结构更简单，但如果存在非纯函数且变量会发生变化，那么第二种更安全。\n\n如果你好奇为什么这类函数被称为 \"thunk\"，以下是《黑客词典》中的解释：\n\
  \n> 历史注记：关于这个术语的起源，流传着几个拟声词神话。\n>\n> 最常见的一种说法是，它模拟了数据撞击堆栈的声音；\n>\n> 另一种说法认为，它模拟了数据撞击累加器的声音。\n\
  >\n> 还有说法认为，它模拟了表达式在参数求值时被解冻的声音。\n>\n> 实际上，根据发明者的说法，这个术语是在他们意识到\n>\n> （经过数小时讨论后的凌晨时分）可以通过一点编译时的思考\n\
  >\n> 提前推算出 Algol-60 中参数的类型，从而简化求值机制后\n>\n> 才被创造出来的。换句话说，这个想法“已经被想到过了”（already been\
  \ thought of）；\n>\n> 因此它被命名为 thunk，这就像是“凌晨两点时‘think（想）’的过去式”。\n\n我们将把递归调用封装到 thunk\
  \ 中，每个 thunk 执行递归中的一步。每个 thunk 求值一步，并返回一个新的 thunk，该 thunk 将求值下一步，依此类推，直到某个 thunk\
  \ 最终返回一个值。这种求值方式被称为“蹦床”（trampoline），其形象比喻是：每个 thunk 在蹦床上弹跳一次，完成一步求值，然后作为下一个 thunk\
  \ 再次落回蹦床。\n\n蹦床只是一个不断求值 thunk 直到获得值的函数，其实现如下：\n\n```\ntrampoline <- function(thunk)\
  \ {\n  while (is.function(thunk)) thunk <- thunk()\n  thunk\n}\n```\n\n为了理解如何结合\
  \ thunk 和蹦床来避免递归，我们首先考虑计算数字阶乘这一更简单的例子，而不是计算树的大小。\n\n我们在第 3 章中编写了递归阶乘函数，非尾递归版本如下：\n\
  \n```\nfactorial <- function(n) {\n  if (n == 1) 1\n  else n * factorial(n - 1)\n\
  }\n```\n\n使用累加器的尾递归版本如下：\n\n```\nfactorial <- function(n, acc = 1) {\n  if (n ==\
  \ 1) acc\n  else factorial(n - 1, acc * n)\n}\n```\n\n为了得到 thunk-蹦床版本，我们首先将其重写为连续传递风格（continuation\
  \ passing style）。这基本上就是将尾递归版本中的累加器转换为用于计算最终结果的延续：\n\n```\ncp_factorial <- function(n,\
  \ continuation = identity) {\n  if (n == 1) {\n    continuation(1)\n  } else {\n\
  \    cp_factorial(n - 1, \\(result) continuation(result * n))\n  }\n}\n```\n\n```\n\
  factorial(10)\n## [1] 3628800\n\ncp_factorial(10)\n## [1] 3628800\n```\n\n这个函数与累加器版本功能相同，并且由于没有尾递归优化，它会从\
  \ `n` 直到 `1` 一直调用 `cp_factorial`，然后对延续函数进行同样多次的求值。我们可以让它对 `n` 值最高大约达到一千左右还能工作，但超过这个值后，就会达到递归栈的极限。在我们达到这个极限之前，R\
  \ 中的数字就已经大到无法用浮点数表示，但这不是重点；重点是递归调用的次数可能会多到我们无法处理。\n\n因此，我们希望每个“递归”调用不再进行递归，而是创建一个\
  \ thunk。这将创建一个执行下一步并返回下一步 thunk 的 thunk，但它不会调用下一步，因此不会产生递归。我们需要为递归和延续两者都创建这样的 thunk。实现很简单：我们只需将递归替换为对\
  \ `make_thunk` 的调用：\n\n```\nthunk_factorial <- function(n, continuation = identity)\
  \ {\n  if (n == 1) {\n    continuation(1)\n  } else {\n    # 新的延续是一个返回 thunk 的函数。\n\
  \    # 该 thunk 将通过调用延续来运行计算的下一步\n    new_continuation <- \\(result) \\() continuation(n\
  \ * result)\n    # 我们尚未调用阶乘递归，只是返回一个准备好执行计算第一步的 thunk\n    \\(() thunk_factorial(n\
  \ - 1, new_continuation)\n  }\n}\n```\n\n用 `1` 调用此函数会直接得到一个值：\n\n```\nthunk_factorial(1)\n\
  ## [1] 1\n```\n\n用 `2` 调用会创建一个 thunk。我们需要调用这个 thunk 来向下递归到基本情况；这将为我们提供一个针对该处延续的\
  \ thunk，并且我们需要求值该 thunk 以得到值：\n\n```\n# 将我们向下递归一步，但不会向上返回\nthunk_factorial(2)()\n\
  ## \\(() continuation(n * result)\n## <bytecode: 0x7fe42629e860>\n## <environment:\
  \ 0x7fe4263bcb38>\n\n# 下一步调用将我们向上返回一个结果\nthunk_factorial(2)()()\n## [1] 2\n```\n\
  \n对于递归中的每一步，我们因此会多得到两个 thunk：一个用于向下递归，另一个用于求值该 thunk。但最终，我们将求值所有 thunk 并得到一个值：\n\
  \n```\nthunk_factorial(3)()()()()()\n## [1] 6\n\nthunk_factorial(4)()()()()()()\n\
  ## [1] 24\n\nthunk_factorial(5)()()()()()()()()\n## [1] 120\n```\n\n当然，我们不想显式调用所有这些\
  \ thunk；这正是蹦床的用途：\n\n```\ntrampoline(thunk_factorial(100))\n## [1] 9.332622e+157\n\
  ```\n\n我们可以编写另一个高阶函数，将这种 thunk 化的函数转换为一个使用蹦床进行计算的函数，如下所示：\n\n```\nmake_trampoline\
  \ <- function(f) \\(...) trampoline(f(...))\nfactorial <- make_trampoline(thunk_factorial)\n\
  factorial(100)\n## [1] 9.332622e+157\n```\n\n为了计算树的大小，我们只需做同样的事情。这里使用的延续执行的操作更复杂——它会在右子树上调用深度优先遍历，而不是直接计算一个表达式——但这并不影响，因为它只是一个延续，我们只需将其包装成一个\
  \ thunk：\n\n```\nthunk_size <- function(node, continuation = identity) {\n  if (is.null(node$left)\
  \ && is.null(node$right)) {\n    continuation(1)\n  } else {\n    left_continuation\
  \ <- function(left_result) {\n      # 右侧延续为我们返回一个 thunk，该 thunk 返回当前树的大小（左 + 右 +\
  \ 1）。\n      right_continuation <- function(right_result)\n        \\(() continuation(left_result\
  \ + right_result + 1)\n      # 返回用于向右递归的 thunk\n      \\(() thunk_size(node$right,\
  \ right_continuation)\n    }\n    # 返回用于向左递归的 thunk\n    \\(() thunk_size(node$left,\
  \ left_continuation)\n  }\n}\n\nsize_of_tree <- make_trampoline(thunk_size)\nsize_of_tree(tree)\n\
  ```\n\n\n\n"
- "# 5\n\n我们实现蹦床版本的方式与阶乘函数*完全*相同。我们先将递归改写为续延传递风格，然后把直接递归调用转换为 thunk，并让续延返回 thunk。使用蹦床后，我们永远不会遇到调用栈溢出的问题；我们从不进行递归调用，而是在原本需要调用函数的地方即时创建\
  \ thunk。\n\n### 过滤、映射与归约\n\n上一章介绍了一些可能难以理解的函数式编程概念，但本章会简单得多。\n\n我们将学习函数式编程中用于替代循环和显式递归函数的三种通用方法。它们实际上是处理序列计算的三种不同模式，虽然不同函数的具体实现各异，但仅凭这三种模式就能完成几乎全部原本需要用循环实现的操作。\n\
  \n请注意前面提到的“几乎”二字。这三种函数并不能替代*所有*循环操作。它们可以替代已知迭代次数的 for 循环，但无法替代 while 循环和 repeat\
  \ 循环。不过，在 R 语言中，绝大多数循环都是 for 循环，因此通常情况下可以用这些函数来替代。\n\n这三种函数（或模式）分别是 `Filter`、`Map`\
  \ 和 `Reduce`。第一个函数接收一个序列和一个谓词（返回布尔值的函数），返回的序列包含所有谓词为真的元素，其余元素被移除。第二个函数 `Map` 对序列中的每个元素求值一个函数，并返回包含函数结果的新序列，类似于上一章简要介绍的\
  \ `sapply` 函数。最后一个函数 `Reduce` 接收一个序列和一个函数，通过反复求值将序列归约为单一值。这种模式在某些编程语言中也被称为“折叠”（fold）。\n\
  \n© Thomas Mailund 2023\n\nT. Mailund, *R 4 函数式编程*[, https://doi.org/10.1007/978-1-4842-9487-1_6](https://doi.org/10.1007/978-1-4842-9487-1_6#DOI)\n\
  \n### 过滤、映射与归约\n\n#### R 中通用的序列对象是列表\n\n在 R 中，序列主要有两种形式：向量和列表。向量只能包含基本类型，且所有元素必须类型相同。\n\
  \n列表可以包含任意类型的序列，元素之间可以类型不同。因此列表比向量更通用，通常用作数据结构的基础构件，例如本书之前使用的“邻接列表”和树结构。\n\n因此，通用序列处理函数能对列表进行操作也就不足为奇了。`Filter`、`Map`\
  \ 和 `Reduce` 这三个函数也可以处理向量，但处理时会将其视为先显式转换为列表后的结果。`Reduce` 函数返回的值类型取决于输入（非序列类型），而\
  \ `Filter` 和 `Map` 返回的序列均为列表形式。\n\n从编程角度看，操作列表与操作向量的难度相当，但某些函数（如图形绘制函数和数据框操作函数）要求输入为向量，因此有时需要将\
  \ `Filter` 或 `Map` 返回的列表转换为向量。\n\n使用 `unlist` 函数即可实现转换。该函数会在所有元素类型相同（基本类型）时将列表转换为向量，否则原样返回列表。本章中我会大量使用\
  \ `unlist`，因为它能让输出结果更美观，但在实际编程中，我通常只在确实需要向量时才进行转换——列表本身已足够存储序列。\n\n区别仅在于\n\n```\n\
  list(1, 2, 3, 4)\n```\n\n的输出篇幅比\n\n```\n1:4\n```\n\n更长。如果读者在电脑前跟随操作，可以尝试对比 `unlist`\
  \ 使用前后的输出差异。\n\n将向量转换为列表的情况很少见。虽然操作列表的函数通常也支持向量，但若确需转换，应使用 `as.list` 而非 `list` 函数。\n\
  \n前者会为向量的每个元素创建一个列表元素：\n\n```\nas.list(1:4)\n```\n\n而后者会创建一个包含整个向量的单元素列表：\n\n```\n\
  list(1:4)\n```\n\n#### 序列过滤\n\n`Filter` 函数是本章三个主要函数中最简单的一个。它通过谓词从序列中选取子集。\n\n谓词是返回布尔值的函数，`Filter`\
  \ 会返回谓词为 `TRUE` 的元素构成的列表，并丢弃谓词为 `FALSE` 的元素。\n\n```\nis_even <- \\(x) x %% 2 ==\
  \ 0\nunlist(Filter(is_even, 1:10))\n```\n\n该函数常与闭包配合使用，使谓词能够依赖局部变量：\n\n```\nlarger_than\
  \ <- \\(x) \\(y) y > x\nunlist(Filter(larger_than(5), 1:10))\n```\n\n当然，实际编程中不会写出上述代码，因为更简单的写法同样有效：\n\
  \n```\nunlist(Filter(\\(y) y > 5, 1:10))\n```\n\n但闭包确实可行，并且在更复杂的情况下非常有用。\n\n此处我们使用向量作为\
  \ `Filter` 的输入，但任何列表类型都可以，也不必限制为相同类型的序列：\n\n```\ns <- list(a = 1:10,          #\
  \ 向量\n          b = list(1,2,3,4,5,6),  # 列表\n          c = y ~ x1 + x2 + x3,  \
  \ # 公式\n          d = vector(\"numeric\"))  # 空向量\nFilter(function(x) length(x)\
  \ > 5, s)\n```\n\n打印结果可能不够美观，但此处无法用 `unlist` 解决。使用 `unlist` *会*得到向量，但无法反映结果的原始结构；向量\
  \ `a` 和列表 `b` 会被展平为单一向量。\n\n#### 序列映射\n\n`Map` 函数会对列表中的每个元素求值一个函数，并返回包含结果的新列表：\n\
  \n```\nunlist(Map(is_even, 1:5))\n```\n\n与 `Filter` 类似，`Map` 也常与闭包结合使用：\n\n```\n\
  add <- function(x) function(y) x + y\nunlist(Map(add(2), 1:5))\nunlist(Map(add(3),\
  \ 1:5))\n```\n\n并且可以应用于不同类型的列表：\n\n```\ns <- list(a = 1:10, b = list(1,2,3,4,5,6),\n\
  \          c = y ~ x1 + x2 + x3, d = vector(\"numeric\"))\nunlist(Map(length, s))\n\
  ```\n\n如果提供的函数参数数量与序列数量匹配，`Map` 还可以同时处理多个序列：\n\n```\nunlist(Map(`+`, 1:5, 1:5))\n\
  ```\n\n在此示例中，我们使用了接受两个参数的 `+` 函数，并为 `Map` 提供了两个序列，结果实现了对应元素的加法运算。\n\n可以为 `Map` 调用传递额外参数，既可以直接使用命名参数\n\
  \n```\nx <- 1:10\ny <- c(NA, x)\ns <- list(x = x, y = y)\nunlist(Map(mean, s))\n\
  unlist(Map(mean, s, na.rm = TRUE))\n```\n\n也可以通过 `MoreArgs` 参数传入列表：\n\n```\nunlist(Map(mean,\
  \ s, MoreArgs = list(na.rm = TRUE)))\n```\n\n\n好的，作为高级文档工程师和翻译员，我将严格遵循您提供的注意事项和示例，将以下英文文本翻译成中文。\n\
  \n\n"
- "# 5.5 5.5\n\n对于单个值，这两种方法的工作原理相同，但它们的语义略有不同，这在提供序列作为参数时会体现出来。将命名参数直接提供给 `Map` 与提供未命名参数的作用相同（区别在于你可以按名称而不是按位置选择特定变量），因此\
  \ `Map` 会假定你想要将函数应用于参数的每个元素。这在单个参数下有效的原因是，正如 R 的常规做法，较短的序列会根据需要重复多次。对于单个参数，这正是我们想要的，但对于序列则不一定。\n\
  \n如果我们想要这种行为，我们可以直接使用 `Map` 的命名参数，但如果我们希望每次调用函数时都使用整个序列，则必须将该序列作为 `MoreArgs` 参数的一个参数。\n\
  \n作为一个例子，我们可以考虑我们信赖的朋友 `scale` 函数，并创建一个版本，其中向量 `x` 通过另一个向量 `y` 的均值和标准差进行缩放：\n\n\
  ```\nscale <- function(x, y) (x - mean(y))/sd(y)\n```\n\n如果我们只为 `scale` 提供两个参数，`Map`\
  \ 会独立地评估所有配对，我们会得到很多 `NA` 值，因为我们在单个值上调用了 `sd` 函数：\n\n```\nunlist(Map(scale, 1:10,\
  \ 1:5))\n## [1] NA NA NA NA NA NA NA NA NA NA\n```\n\n如果我们命名参数 `y`，也会发生同样的情况：\n\n\
  ```\nunlist(Map(scale, 1:10, y = 1:5))\n## [1] NA NA NA NA NA NA NA NA NA NA\n```\n\
  \n但是如果我们使用 `MoreArgs`，整个向量 `y` 会在每次调用时提供给 `scale`：\n\n```\nunlist(Map(scale, 1:10,\
  \ MoreArgs = list(y = 1:5)))\n## [1] -1.2649111 -0.6324555  0.0000000  0.6324555\n\
  ## [5]  1.2649111  1.8973666  2.5298221  3.1622777\n## [9]  3.7947332  4.4271887\n\
  ```\n\n与 `Filter` 一样，只要我们的函数可以处理不同类型的列表，`Map` 就可以处理任意类型的列表：\n\n```\ns <- list(a\
  \ = 1:10, b = list(1,2,3,4,5,6),\n          c = y ~ x1 + x2 + x3, d = vector(\"\
  numeric\"))\nunlist(Map(length, s))\n##  a  b  c  d\n## 10  6  3  0\n```\n\n####\
  \ 缩减序列\n\n`Filter` 和 `Map` 生成列表，而 `Reduce` 函数则将列表转换为一个值。当然，这个值也可以是一个列表——列表也是值——但\
  \ `Reduce` 并非简单地独立处理其输入列表中的每个元素。相反，它通过迭代地将一个函数应用于成对的元素来对列表进行汇总。你提供一个接受两个元素的函数 `f`，它首先会对列表中的前两个元素调用\
  \ `f`。然后，它将获取这个结果，并用此结果与下一个元素调用 `f`，并继续在整个列表中执行此操作。\n\n所以调用 `Reduce(f, 1:5)` 等同于调用\
  \ `f(f(f(f(1, 2), 3), 4), 5)`。写 `Reduce(f, 1:5)` 只是更易读，至少在你习惯了之后。\n\n我们可以使用 `+`\
  \ 作为函数来观察它的实际应用：\n\n```\nReduce(`+`, 1:5)\n## [1] 15\n```\n\n如果你使用参数 `accumulate`，还可以获得逐步结果。这将返回一个包含对\
  \ `f` 的所有调用结果的列表，并且列表中包含第一个值，因此 `Reduce(f, 1:5)` 将返回列表：\n\n```\nc(1, f(1, 2), f(f(1\
  \ ,2), 3), f(f(f(1, 2), 3), 4),\n  f(f(f(f(1, 2), 3), 4), 5))\n```\n\n所以，对于加法，我们得到：\n\
  \n```\nReduce(`+`, 1:5, accumulate = TRUE)\n## [1]  1  3  6 10 15\n```\n\n默认情况下，`Reduce`\
  \ 从左到右进行计算，但是通过将选项 `right` 设置为 `TRUE`，你将得到从右到左的结果：\n\n```\nReduce(`+`, 1:5, right\
  \ = TRUE, accumulate = TRUE)\n## [1] 15 14 12  9  5\n```\n\n对于像 `+` 这样的结合性操作，如果我们不要求累积的函数调用，结果显然是相同的。\n\
  \n在许多函数式编程语言中（所有这些语言都有这个函数，尽管有时它被称为 `fold` 或 `accumulate`），你需要为计算提供一个初始值。然后，这个初始值会在对\
  \ `f` 的首次调用中使用，因此如果 `init` 指的是初始值，`x` 是序列，则折叠从 `f(init, x[1])` 开始。在 R 中，你也可以通过参数\
  \ `init` 为 `Reduce` 显式提供一个初始值来获得相同的行为：\n\n```\nReduce(`+`, 1:5, init = 10, accumulate\
  \ = TRUE)\n## [1] 10 11 13 16 20 25\n```\n\n你只是通常不需要指定这个初始值。在需要它的语言中，它用于在累积结果时获得正确的起点。对于加法，如果我们希望\
  \ `Reduce` 计算总和，我们会使用零作为初始值，因为将零加到序列中的第一个值只会得到第一个元素。对于乘法，我们则必须使用 1 作为初始值，因为这样第一个函数应用就会得到初始值。\n\
  \n在 R 中，如果我们满足于让第一个函数调用作用于列表中的前两个元素，则不需要提供这些初始值，因此乘法与加法一样有效，无需提供 `init`：\n\n```\n\
  Reduce(`*`, 1:5)\n## [1] 120\n\nReduce(`*`, 1:5, accumulate = TRUE)\n## [1]   1\
  \   2   6  24 120\n\nReduce(`*`, 1:5, right = TRUE, accumulate = TRUE)\n## [1] 120\
  \ 120  60  20   5\n```\n\n你通常不会使用 `Reduce` 来汇总值（如求和或乘积），R 中已经有了用于此目的的函数（分别是 `sum`\
  \ 和 `prod`），而且它们作为用 C 实现的底层函数要快得多，而 `Reduce` 必须是高级函数才能处理任意函数。对于我们已经没有现成函数来汇总列表的更复杂数据，`Reduce`\
  \ 通常是首选方法。\n\n下面是一个例子，来自 Hadley Wickham 的 *Advanced R* 一书：\n\n```\nsamples <- replicate(3,\
  \ sample(1:10, replace = TRUE), simplify = FALSE)\nstr(samples)\n## List of 3\n\
  ## $ : int [1:10] 1 3 7 8 9 5 9 1 6 4\n## $ : int [1:10] 4 5 8 3 1 6 9 10 5 3\n\
  ## $ : int [1:10] 9 9 2 10 9 2 9 8 7 10\n\nReduce(intersect, samples)\n## [1] 8\
  \ 9\n```\n\n我们有一个包含三个向量的列表，每个向量都有从 1 到 10 的十个样本，我们想要获取这三个列表的交集。这意味着取前两个的交集，然后取该结果与第三个列表的交集。非常适合使用\
  \ `Reduce`。我们只需将其与 `intersection` 函数结合使用。\n\n#### 集合使用这些函数\n\n这三个函数经常一起使用，`Filter`\
  \ 首先剔除不应处理的元素，然后 `Map` 处理列表，最后 `Reduce` 合并所有结果。\n\n本节将展示几个如何使用这些函数的示例。我们从处理树开始。请记住，我们可以使用之前编写的\
  \ `make_node` 函数构建树，并且我们可以创建一个树列表，因为我们可以创建任何内容的列表：\n\n```\nA <- make_node(\"A\"\
  )\nC <- make_node(\"C\", make_node(\"A\"), make_node(\"B\"))\nE <- make_node(\"\
  E\",\n              make_node(\"C\", make_node(\"A\"), make_node(\"B\")),\n    \
  \          make_node(\"D\"))\ntrees <- list(A = A, C = C, E = E)\n```\n\n打印一棵树会得到它的列表表示形式。如果我们\
  \ `unlist` 一棵树，我们会得到相同的表示形式，只是被扁平化了，因此结构体现在结果向量的名称中，但我们编写了一个 `print_tree` 函数，它能够以\
  \ Newick 格式给出字符串表示形式：\n\n```\ntrees[[2]]\n## $name\n## [1] \"C\"\n##\n## $left\n\
  ## $left$name\n## [1] \"A\"\n##\n## $left$left\n## NULL\n##\n## $left$right\n##\
  \ NULL\n##\n##\n## $right\n## $right$name\n## [1] \"B\"\n##\n## $right$left\n##\
  \ NULL\n##\n## $right$right\n## NULL\n\nunlist(trees[[2]])\n##    name left.name\
  \ right.name\n##     \"C\"       \"A\"        \"B\"\n\nprint_tree(trees[[2]])\n\
  ## [1] \"(A,B)\"\n```\n\n我们可以使用 `Map` 将一个树列表转换为它们的 Newick 格式，并将此列表扁平化以获得一个字符向量：\n\
  \n```\nMap(print_tree, trees)\n## $A\n## [1] \"A\"\n##\n## $C\n## [1] \"(A,B)\"\n\
  ##\n## $E\n## [1] \"((A,B),D)\"\n\nunlist(Map(print_tree, trees))\n##          A\
  \          C          E\n##        \"A\"     \"(A,B)\"   \"((A,B),D)\"\n```\n\n\n\
  \n## `\"A\"` `\"(A,B)\"` `\"((A,B),D)\"`\n\n我们可以将其与 `Filter` 结合，只获取非单叶的树；这里可以使用之前编写的\
  \ `size_of_tree` 函数：`unlist(Map(print_tree, Filter(**function**(tree) size_of_tree(tree)\
  \ > 1, trees)))`\n\n## `C` `E`\n\n## `\"(A,B)\"` `\"((A,B),D)\"`\n\n第 6 章 Filter、Map\
  \ 和 Reduce\n\n或者我们可以获取所有树的大小，并通过组合 `Map` 与 `Reduce` 计算它们的总和：\n\n`unlist(Map(size_of_tree,\
  \ trees))`\n\n## `A` `C` `E`\n\n## 1 3 5\n\n`Reduce(`+`, Map(size_of_tree, trees),\
  \ 0)`\n\n## [1] 9\n\n我们也可以搜索特定节点的深度，例如获取所有树中节点“B”的深度：\n\n`node_depth_B <- **function**(tree)\
  \ node_depth(tree, \"B\")`  \n`unlist(Map(node_depth_B, trees))`\n\n## `A` `C` `E`\n\
  \n## NA 1 2\n\n结果中的名称会让人困惑。它们对应我们在构建列表时为树赋予的名称，可以通过 `unlist` 的 `use.names` 参数去除。通常，如果不需要向量的名称，应始终这样做；这样能加快计算速度，因为\
  \ R 无须在数据上拖带名称。\n\n`unlist(Map(node_depth_B, trees), use.names = FALSE)`\n\n## [1]\
  \ NA 1 2\n\n对于不包含“B”节点的树，搜索节点深度时会得到 `NA`，我们可以使用 `Filter` 轻松移除它们：  \n`Filter(**function**(x)\
  \ !is.na(x), unlist(Map(node_depth_B, trees), use.names = FALSE))`\n\n## [1] 1 2\n\
  \n第 6 章 Filter、Map 和 Reduce\n\n或者我们可以在对树应用 `Map` 之前，显式检查树是否包含节点“B”：\n\n`has_B <-\
  \ **function**(node) {`  \n`  **if** (node$name == \"B\") return(TRUE)`  \n`  **if**\
  \ (is.null(node$left) && is.null(node$right)) return(FALSE)`  \n`  has_B(node$left)\
  \ || has_B(node$right)`  \n`}`\n\n`unlist(Map(node_depth_B, Filter(has_B, trees)),\
  \ use.names = FALSE)`\n\n## [1] 1 2\n\n先过滤再映射的解决方案可能更可取，因为如果我们用处理任意节点名称的通用函数替换 `has_B`\
  \ 和 `node_depth_B`，则无需特意匹配它们，但两种方案都可行。\n\n**Apply 函数族**\n\n`Map` 函数是对列表元素进行映射的通用解决方案，但\
  \ R 有一整套类似 `Map` 的函数族，它们适用于不同类型的输入。这些函数均以“something-apply”命名，我们已在上一章中见过 `sapply`。`Map`\
  \ 函数实际上只是其中一个函数 `mapply` 的包装器，鉴于我们已经了解 `Map` 的用法，这里不再讨论 `mapply`，但我会简要介绍 `apply`\
  \ 族中的其他函数。\n\n**sapply、vapply 和 lapply**\n\n`sapply`、`vapply` 和 `lapply` 都作用于序列。区别在于：`sapply`\
  \ 尝试*简化*其输出；`vapply` 接受一个值作为参数，并将输出强制转换为该值的类型，若无法转换则报错；`lapply` 则对列表进行映射。\n\n第 6\
  \ 章 Filter、Map 和 Reduce\n\n在交互式会话中使用 `sapply` 很方便，因为当映射结果可以转换为向量时，它本质上类似于 `Map`\
  \ 与 `unlist` 的组合。与 `unlist` 不同，它不会展平列表，因此如果映射结果比向量更复杂，`sapply` 仍会返回列表。正因如此，在程序中使用\
  \ `sapply` 可能存在风险：你无法预先知道输出类型，因此必须防御性编程，检查得到的是向量还是列表。\n\n`sapply(trees, size_of_tree)`\n\
  \n## `A` `C` `E`\n\n## 1 3 5\n\n`sapply(trees, identity)`\n\n## `A` `C` `E`\n\n\
  ## name \"A\" \"C\" \"E\"\n\n## left NULL list,3 list,3\n\n## right NULL list,3\
  \ list,3\n\n使用 `vapply` 时，如果结果可以转换为向量，你会得到与 `sapply` 相同的简化效果，但必须向函数告知输出应为何种类型。这通过提供一个期望输出的示例来实现。如果\
  \ `vapply` 无法将结果转换为该类型，你会得到错误而非不同类型的意外结果，这使得该函数在程序中使用更安全。毕竟，相比因类型混淆导致的意外结果，得到错误要好得多。\n\
  \n`vapply(trees, size_of_tree, 1)`\n\n## `A` `C` `E`\n\n## 1 3 5\n\n第 6 章 Filter、Map\
  \ 和 Reduce\n\n`lapply` 是与 `Map` 最相似的函数。它接受一个列表作为输入，并返回一个列表。`lapply` 与 `Map` 的主要区别在于，`lapply`\
  \ 始终作用于*单个*列表，而 `Map` 可以接受多个列表（这也解释了 `mapply` 的名称由来，`Map` 正是它的包装器）。\n\n`lapply(trees,\
  \ size_of_tree)`\n\n## $A\n\n## [1] 1\n\n##\n\n## $C\n\n## [1] 3\n\n##\n\n## $E\n\
  \n## [1] 5\n\n**apply 函数**\n\n`apply` 函数作用于矩阵和高维数组，而非序列。它接受三个参数，外加任何应传递给被调用函数的额外参数。\n\
  \n第一个参数是要映射的数组，第二个参数是应沿哪个维度（或多个维度）进行边缘化，第三个参数是要应用的函数。\n\n我们可以通过创建一个矩阵来观察其运行：  \n\
  `(m <- matrix(1:6, nrow=2, byrow=TRUE))`\n\n## [,1] [,2] [,3]\n\n## [1,] 1 2 3\n\
  \n## [2,] 4 5 6\n\n第 6 章 Filter、Map 和 Reduce\n\n为了看清实际发生的情况，我们创建一个收集所接收数据的函数，以便准确看到它被调用时的参数：\
  \  \n`collaps_input <- **function**(x) paste(x, collapse = \":\")`  \n如果按行边缘化，它将对每一行调用，函数将接收整个行向量：\
  \  \n`apply(m, 1, collaps_input)`\n\n## [1] \"1:2:3\" \"4:5:6\"\n\n如果按列边缘化，它将对每一列调用，并生成三个字符串：\
  \  \n`apply(m, 2, collaps_input)`\n\n## [1] \"1:4\" \"2:5\" \"3:6\"\n\n如果同时按行和列边缘化，它将对每个元素单独调用：\
  \  \n`apply(m, c(1, 2), collaps_input)`\n\n## [,1] [,2] [,3]\n\n## [1,] \"1\" \"\
  2\" \"3\"\n\n## [2,] \"4\" \"5\" \"6\"\n\n**tapply 函数**\n\n`tapply` 函数作用于所谓的“不规则表格”：即行长度可以不同的表格。你无法直接创建行维度大小不一的数组，但可以使用一个扁平向量，结合指示虚拟维度的因子。`tapply`\
  \ 根据因子对向量进行分组，然后对每组调用指定函数：\n\n第 6 章 Filter、Map 和 Reduce\n\n`(x <- rnorm(10))`\n\n\
  ## [1] 1.58827631 -0.99044548 -1.56081835\n\n## [4] 0.38316964 1.82773685 -0.96031940\n\
  \n## [7] -1.32439441 0.09413377 -0.02306317\n\n## [10] -0.60627476\n\n`(categories\
  \ <- sample(c(\"A\", \"B\", \"C\"), size = 10, replace = TRUE))`\n\n## [1] \"A\"\
  \ \"A\" \"A\" \"B\" \"C\" \"A\" \"B\" \"A\" \"C\" \"A\"\n\n`tapply(x, categories,\
  \ mean)`\n\n## `A` `B` `C`\n\n## -0.4059080 -0.4706124 0.9023368\n\n你可以使用多个因子，只需将它们包装在列表中：\
  \  \n`(categories2 <- sample(c(\"X\", \"Y\"), size = 10, replace = TRUE))`\n\n##\
  \ [1] \"X\" \"Y\" \"X\" \"Y\" \"Y\" \"X\" \"X\" \"Y\" \"Y\" \"X\"\n\n`tapply(x,\
  \ list(categories, categories2), mean)`\n\n## `X` `Y`\n\n## `A` -0.384784 -0.4481559\n\
  \n## `B` -1.324394 0.3831696\n\n\n\n"
