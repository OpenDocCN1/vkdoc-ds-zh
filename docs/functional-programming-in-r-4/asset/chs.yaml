- "# [1] 120\n\n## 第 7 章\n\n## 无点编程\n\n在最后一章中，我们不会过多讨论实际的编程，而是一种被称为*无点编程*（并非*无意义*编程）的编程风格，其特点是通过组合其他函数来构造新函数，而非直接编写新函数。\n\
  \n许多计算都可以表达为数据流经的步骤以及数据在此过程中如何被转换。我们编写函数来处理所有最基本的步骤，即程序的原子，然后通过组合更基础的变换来构造用于更复杂操作的函数，从而从程序原子构建程序分子。\n\
  \n术语*无点*指的是在计算一系列变换时数据可能所处的中间状态。它所指的*点*是数据在每次变换后所处的状态，而*无点*意味着我们不以任何方式关注这些点。在使用无点编程编写的代码中，这些点根本不会被提及。\n\
  \n这听起来可能有点抽象，但如果你习惯于在 shell 脚本中编写管道，那么很快就会感到非常熟悉，因为无点编程正是你在编写管道时所做的事情。在那里，数据流经一系列串联在一起的程序。一个程序的输出成为管道中下一个程序的输入，你从不引用中间数据，只引用数据在管道处理过程中所经历的变换步骤。\n\
  \n© Thomas Mailund 2023  \nT. Mailund, *R 语言函数式编程（第 4 版）*, [`doi.org/10.1007/978-1-4842-9487-1_7`](https://doi.org/10.1007/978-1-4842-9487-1_7#DOI)\n\
  \n## 函数组合\n\n从更基础的函数构造新函数的最简单方法就是函数组合。在数学中，如果我们有一个函数 `f` 将定义域 `A` 映射到值域 `B`，我们可以将其记为\
  \ `f : A → B`，另一个函数 `g` 记为 `g : A → C`，那么我们可以通过组合这两个函数来创建一个新函数 `h : A → C`：`h(x)\
  \ = g(f(x))`。\n\n我们可以在 R 中做完全相同的事情，并像这样用函数 `f` 和 `g` 来定义 `h`：\n\n```\nh <- function(x)\
  \ g(f(x))\n```\n\n仅仅为了组合两个函数而显式编写一个新函数，其中包含大量额外的冗余内容。在数学符号中，我们不会那样写两个函数的组合。我们将函数组合写成\
  \ `h = g ° f`。通过组合函数来定义新函数，而不是定义那些仅仅显式调用其他函数的函数，这就是我们所说的无点编程，并且在 R 中很容易实现。\n\n你可以编写一个组合函数，它是一个高阶函数，接受两个函数作为参数并返回它们的组合：\n\
  \n```\ncompose <- function(g, f) function(...) g(f(...))\n```\n\n然后我们可以用这个函数来处理一个常见情况：当我们使用\
  \ `Map` 并经常想要对结果进行 `unlist` 时。当然，我们可以显式地调用它们来使用 `Map` 和 `unlist`：\n\n```\nxs <-\
  \ 1:4\nunlist(Map(\\(x) x + 2, xs))  # 显式调用 Map + unlist\n## [1] 3 4 5 6\n```\n\n\
  但我们也可以组合 `Map` 和 `unlist`，从它们的组合中创建一个新的映射函数：\n\n```\numap <- compose(unlist, Map)\
  \  # 组合 Map 和 unlist\numap(\\(x) x + 2, xs)          # 使用新函数\n## [1] 3 4 5 6\n```\n\
  \n为了得到类似于数学记法的东西，我们希望它是一个中缀运算符，但 `pryr` 包已经为我们定义了它，所以我们可以像这样编写相同的代码：\n\n```\nlibrary(pryr)\n\
  umap <- unlist %.% Map\numap(\\(x) x + 2, xs)\n## [1] 3 4 5 6\n```\n\n我们不仅限于组合两个函数，由于函数组合是可结合的，我们无需担心组合的顺序，因此不需要在组合周围使用括号。我们也可以组合三个或更多函数，并且如果我们需要一些尚未作为命名函数实现的额外功能，我们还可以将函数与匿名函数组合。例如，我们可以像这样定义一个计算均方根误差的函数：\n\
  \n```\nrmse <- sqrt %.% mean %.% \\(x, y) (x - y)**2\nrmse(1:4, 2:5)\n## [1] 1\n\
  ```\n\n我们需要一个新函数来计算 `x` 和 `y` 之间的平方距离，所以为此我们添加了一个匿名函数，然后我们可以直接使用 `mean` 和 `sqrt`\
  \ 来获得其余的功能。\n\n在函数组合的数学记法中，你总是按照显式调用它们的顺序来书写要组合的函数，因此 `h ° g ° f` 会在值 `x` 上被评估为\
  \ `h(g(f(x)))`。如果你习惯从右向左阅读，这很好；但如果你习惯从左向右阅读，那就有点反过来了。\n\n当然，没有什么能阻止我们编写一个反转函数顺序的函数组合运算符。为了避免与函数组合的数学记法混淆，我们会使用一个不同的运算符，这样我们可以定义\
  \ `;` 使得 `f ; g = g ° f`，并在 R 中将其用于函数组合：\n\n```\n`%;%` <- function(f, g) function(...)\
  \ g(f(...))\nrmse <- (\\(x, y) (x - y)**2) %;% mean %;% sqrt\nrmse(1:4, 2:5)\n##\
  \ [1] 1\n```\n\n在这里，我需要用括号将匿名函数括起来，以防止 R 将组合视为函数体的一部分，但除此之外，功能与之前相同；我们可以从左到右阅读组合。\n\
  \n## 管道\n\n`magrittr` 包引入了一种“从左到右”的函数组合，作为运算符 `%>%`，而在 R 4.1 中，我们有了一个内置的具有相同目的的运算符\
  \ `|>`。尽管它们在语法和灵活性上略有差异，但两者都旨在通过指定从左到右的管道语法中的变换，使数据分析管道更易于阅读和编写。两者都允许你以与在 shell\
  \ 管道中串联命令行工具非常相似的方式，将各种数据转换和分析链接在一起。\n\n各种操作都是函数调用，这些函数通过 `%>%` 或 `|>` 运算符链接在一起，将一个函数的输出传递到下一个函数的输入。\n\
  \n例如，要获取向量 `1:4`，计算其均值，然后计算 `sqrt`，你可以像这样编写一个管道：\n\n```\nlibrary(magrittr)\n1:4\
  \ %>% mean %>% sqrt\n## [1] 1.581139\n```\n\n或者使用 `|>`：\n\n```\n1:4 |> mean() |>\
  \ sqrt()\n```\n\n\n\n"
- '# [1] 1.581139


  使用 `%>%` 时，你可以通过函数名来组合函数，例如 `mean %>% sqrt`；但使用 `|>` 时，你必须组合函数调用，例如 `mean() |> sqrt()`。


  `%>%` 运算符也支持后一种语法。


  默认情况下，管道中上一步的输出会作为第一个参数传递给下一步的函数。若要编写适合此模式的自定义函数，你只需让通过管道传输的数据成为函数的第一个参数即可。


  由于管道现在在 R 中频繁使用，大多数函数都遵循这一模式，并且在 `dplyr` 和 `tidyr` 等流行包中也是如此。`purrr` 包也设计为与 `magrittr`
  管道良好配合。它的所有函数都将要操作的数据作为第一个参数，因此使用 `%>%` 或 `|>` 将多个转换串联起来非常直接。


  并非所有函数都遵循此模式，主要是较旧的函数不遵循，但你可以使用变量 `.` 来引用在管道中传递的数据，当你需要将其放在非第一个参数的位置时：`data.frame(x
  = 1:4, y = 2:5) %>% plot(y ~ x, data = .)`。


  不过，这仅受 `%>%` 运算符支持，`|>` 则不支持。


  如果输入是数据框，你可以像使用任何其他数据框一样，通过列名来访问其列。参数依然是 `.`，你只需使用该参数来引用数据：`data.frame(x = 1:4,
  y = 2:5) %>% plot(.$x, .$y)`。


  `. ` 参数可以在管道中的函数调用中多次使用，并且可以与管道中的函数调用一起使用，例如：


  ```

  rnorm(4) %>% data.frame(x = ., y = cos(.))

  ```


  ## x y

  ## 1 -0.4606873 0.89574717

  ## 2 -0.2682750 0.96422956

  ## 3 -0.5016734 0.87677906

  ## 4 -1.6209375 -0.05012016


  有一点需要注意：如果 `.` *仅*出现在函数调用内部，那么它*也会*作为第一个参数传递给函数。这意味着类似下例的代码将创建一个包含三个变量的数据框，第一个变量是一个名为
  `.` 的列：


  ```

  rnorm(4) %>% data.frame(x = sin(.), y = cos(.))

  ```


  ## . x y

  ## 1 0.78527169 0.70701735 0.7071962

  ## 2 -0.01757641 -0.01757551 0.9998455

  ## 3 -0.24785011 -0.24532033 0.9694421

  ## 4 -0.37395301 -0.36529810 0.9308906


  虽然 `%>%` 运算符主要用于编写此类数据处理管道，但它也可以用于通过组合其他函数来定义新函数，此时函数按从左到右的顺序编写。编写此类函数就像编写数据处理管道一样，但让管道的第一步是
  `.`，因此这是一个数据管道：


  ```

  mean_sqrt <- 1:4 %>% mean %>% sqrt

  mean_sqrt

  ## [1] 1.581139

  ```


  而这是一个函数：


  ```

  mean_sqrt <- . %>% mean %>% sqrt

  mean_sqrt(1:4)

  ## [1] 1.581139

  ```


  并且你可以在管道中使用这个函数：


  ```

  1:4 %>% mean_sqrt

  ## [1] 1.581139

  ```


  `|>` 运算符不支持这种编写函数的方式；你可以用它来组合函数调用，但它只是调用函数的语法糖，不能用于定义函数。在定义函数方面，`%>%` 运算符更加灵活。


  你只能使用这种方法定义接受单个参数作为输入的函数。如果你需要多个参数，则需要显式定义你的函数。整个管道模式的工作原理是假设在函数调用之间传递的是单条数据。尽管如此，这并不妨碍你拥有复杂的数据（例如数据框），并以此方式模拟拥有多个参数。


  例如，以我们之前编写的均方根误差函数为例：`rmse <- (\(x, y) (x - y)**2) %>% mean %>% sqrt`


  这个函数接受两个参数，因此我们不能使用 `.` 来创建它。我们可以改为让它接受一个参数，例如一个数据框，并从中获取两个值：


  ```

  rmse <- . %>% { (.$x - .$y)**2 } %>% mean %>% sqrt

  data.frame(x = 1:4, y = 2:5) %>% rmse

  ## [1] 1

  ```


  这里，我们还使用了 `magrittr` 的另一个特性，一种更简洁的编写匿名函数的语法。通过将表达式 `{(.$x - .$y)**2}` 写在花括号中，我们创建了一个函数，在其中可以将参数引用为
  `.`。


  当数据需要稍微调整以匹配上一个函数的输出和下一个函数的预期输入时，能够通过将表达式放在花括号中来编写匿名函数是非常方便的。


  匿名函数还可以防止 `.` 参数在仅用于函数调用时被隐式地作为第一个参数传递给函数。如果表达式被包裹在花括号中，那么函数调用就不会以任何方式被修改，因此 `.`
  不会作为第一个参数被隐式添加：


  ```

  rnorm(4) %>% { data.frame(x = sin(.), y = cos(.)) }

  ```


  ## x y

  ## 1 0.5526906 0.8333865

  ## 2 -0.8979247 0.4401492

  ## 3 -0.9402584 -0.3404616




