  trans: '

    如果机器人无法登录电子邮件，请运行电子邮件子任务。如果在 Web 应用程序中更新地址或电话号码时出现错误，请运行 Web 应用程序系列任务，并检查机器人是否成功完成更新。可以遵循相同的过程来检查并确保主机系统已更新。


    **维护**


    此机器人具有正常优先级。如果机器人失败或出错，请运行数据库脚本以重置机器人并重新启动机器人。


    **机器人调度**


    机器人将在每周一至周五的上午 11:00 运行。


    **灾难恢复**


    如果机器人完全故障，团队将需要恢复手动流程：


    *   运营团队将手动执行该流程，直至收到问题已解决的通知。

    *   RPA 团队将负责运营跟踪、监控和维护。如遇任何临时中断或计划性停机，COE 将提前充分通知业务部门，并加速恢复服务。

    *   流程负责人应系统地审查和审计结果，以确保实现功能价值。

    *   主机系统的任何变更都将提前足够时间主动通知 RPA 团队成员，以确保他们能够进行必要的调整。

    *   流程负责人将收到所有故障的通知邮件。


    **术语表**


    | **术语** | **描述** |

    | --- | --- |

    | **RPA** | **机器人流程自动化** |

    | **SIT** | **系统集成测试** |

    | **SLA** | **服务级别协议** |

    | **SME** | **主题专家** |

    | **UAT** | **用户验收测试** |


    **附录**


    **附录 A**：异常消息


    *   `EmailMissingClientID`

    *   `EmailMissingFirstOrLastName`


    让我们详细看看这些组成部分。


    封面页包含几个组成部分：文档名称。这是 SDD，需要指明它属于哪个项目。文档作者是负责创建文档的人。可能是架构师或设计师，但也可能是团队的其他成员。文档版本应指明它是初稿还是后续草稿、是否为最终版本以及是否已获批准。通常，草稿版本以
    0 开头，并在审阅和更新时递增：0.1 是初始草稿，0.2 是更新后的草稿，等等。“注释”列用于进行任何说明。例如，草稿 0.2 可能有这样的注释：“根据与
    Mary Brown 的审阅意见进行修订，她要求修改 XYZ。”


    同样在封面页上，有供批准使用的空间。姓名/角色是负责批准文档的人员的姓名和角色。可能是产品负责人、业务负责人、交付经理或其他角色。“签名”在指定人员批准文档时将是电子形式的。


    **暂停并思考**


    请记住，版本（草稿、最终版等）和角色名称（产品负责人、业务负责人等）因公司而异。请使用您组织内使用的名称。


    “本文档的目的”提供了流程自动化概述的非常简短的描述。这对于从高层次理解机器人将要做什么非常有帮助；更多细节包含在文档的后续部分。


    在 PDD 中开发的“流程图”包含在此处，旨在让开发者“一目了然”地了解他们将要自动化的当前手动流程。


    “自动化目标”开始深入更具体地说明机器人将做什么。


    在“涉及的应用系统”中，您将列出自动化将要与之交互的应用系统。通过识别所有应用系统，您可以发现自动化需要何种访问权限才能与它们中的每一个进行交互。


    开发者需要知道“输入”是什么。在我们的示例中，只有一个输入（来自客户的电子邮件），但这只是一个简单的案例研究。您的“实际”工作可能包含更多输入。


    虽然已经提供了流程的非常高层级的描述，但开发者无法据此进行构建。现在您需要详细列出各个“流程步骤”。在我们的案例研究中，有四个简单的子流程。如您所见，它们非常具体且处于非常低的层级。


    任何流程都会出现异常。在我们的案例研究中，可能是电子邮件不包含客户 ID，或者客户 ID 数字过少或过多；新电话号码可能缺少一位数字，等等。这些“异常”必须由机器人处理，本部分将解释如何处理。


    机器人有起点和终点，有必要确保任何监控它的人（无论是实时还是定期）都知道它已完成每个周期（如指定的每小时、每天等）的工作。必须定义这些“成功标准”。它会是机器人发送给经理的电子邮件，说明
    20xx 年 7 月 29 日指定邮箱中的所有邮件都已处理完毕吗？它会是大报告或仪表板上的一个标注吗？无论是什么，都应在此处指定。


    没有哪个应用系统能一直完美运行。因此，SDD 应包含一些基本的“调试技巧”。这些是您可以包含在内的建议，以帮助未来的开发者解决问题。请记住，最初开发自动化的开发者可能在将来出现问题时无法提供支持。

    '
- fmt: '# Maintenance


    Once the Bot is deployed into the production environment and is live, it starts
    following its schedule. Then maintenance comes into picture. Every Bot has an
    SLA (service-level agreement) to provide support that sets expectations of the
    business in case the Bot fails to perform as required. Mainly, there are two aspects
    to it. One aspect is technical and the other is related to the business side.
    Technical aspects cover when the Bot is unable to perform because of any technical
    reasons, for example, servers are down, infrastructure maintenance, etc. Business
    issues might be related to the Bot being unable to perform as per requirements
    because data is not available or when input systems that feed the Bot are not
    ready at the time of Bot execution.


    In case of technical reasons, the main responsibility of the technical team or
    COE is to communicate to the business information about the outage and also share
    the situation with any other relevant stakeholders. They should all be kept apprised
    of the progress and expected time when Bot will be available as per schedule.
    For any business reasons, the technical team needs to coordinate with the business
    team so that the Bot can be stopped or suspended until the business reasons are
    resolved; the technical team will also work closely with the business team and/or
    COE team to keep everyone on the same page.


    **Scheduling:** The developers need to know when the Bot is to run. This may be
    daily at a certain time or multiple times; it might be weekly, monthly, etc. This
    will have been determined early on in discussions with the business and will be
    documented here for the development team.


    **Disaster Recovery:** What happens if the Bot ceases to work? Either it stops
    work altogether or is malfunctioning to the point that it isn’t doing its job.
    Again, what happens in this case will have been discussed with the business much
    earlier, usually when initially creating the risk assessment. Whatever the determination
    is should be included here. At a minimum, reverting to the manual process until
    the Bot has been repaired is one aspect of disaster recovery.


    After completing SDD, it can be sent for sign-off as per the process in your organization.


    Once SDD approval has been received, you are ready for developing the Bot in your
    selected automation tool. The steps included in this book will be effective with
    whatever tool you use.


    # Testing


    After building the Bot to automate the process in our case study, the next vital
    activity is testing the Bot.


    To capture all tests, testing execution, and its results, a test summary document
    can be created. Keep the test summary document as simple as possible so it will
    be easy to understand. Here in our hypothetical automation, we are going to follow
    a test summary that has three tabs:


    - The first tab contains information about the Bot and test results.

    - The second tab has test scenarios with results.

    - The third tab has test data.


    **Test Summary**


    ![../images/513218_1_En_6_Chapter/513218_1_En_6_Figc_HTML.gif](images/513218_1_En_6_Chapter/513218_1_En_6_Figc_HTML.gif)


    Note that this tab has a Version History, Approval Details, Test Results and Environment
    Details. The information required in them is self-explanatory. For “Environment
    Details,” include any risks that pertain to testing in that environment. This
    is especially critical if testing in a production environment.


    **Test Scenarios and Results**


    | **Prerequisites** | **Process Step Number** | **Test Case Description** | **Expected
    Result** | **Actual Result** | **Test Case Actual Status** |

    | --- | --- | --- | --- | --- | --- |

    | Email account is set up on email server. | 1 | Bot logs in to email inbox. |
    Bot successful login to email account. | Bot able to log in | passed |

    | Web CRM application is up and running. | 2 | Bot logs in to Web CRM and performs
    update to one address and phone number. | Bot successfully updated one record.
    | Bot able to update record | passed |

    | Mainframe 1 is up and running. | 3 | Bot logs in to Mainframe and performs update
    to one address and phone number. | Bot successfully updated one record. | Bot
    able to update record | passed |


    This section is also self-explanatory.


    **Pause and Consider**


    You will note that in keeping processes and documentation as simple as possible,
    you will have more success with your RPA initiative. But remember not to compromise
    quality as you simplify.


    **Test Cases**


    | **ID** | **FRD-Based Scenarios** |

    | --- | --- |

    | Auto-001 | Bot successfully logs in to email inbox and reads emails. |

    | Auto-002 | Bot successfully logs in to Web CRM and updates address and phone
    number. |

    | Auto-003 | Bot successfully logged in to Mainframe 1 and updated address and
    phone number. |


    This section shows the specific test cases that must be executed.


    (For the purposes of the case study, we are only showing user acceptance testing).


    Following testing, business sign-off is required. This is done by forwarding this
    testing document to the business owner and receiving and then storing their approval,
    usually as an email.


    Testing can be completed in iterations; it can also be done more than once to
    assure that the Bot delivers what is expected and is able to handle exception
    situations as per requirements.


    At this point, the Governance Committee is advised of business approval and solution
    design; no meeting is required. If the committee members have any questions, they
    will notify the RPA team.


    After completing testing and obtaining approval, preparation for packaging and
    deployment can start; this is explained in detail in the next chapter.


    Footnotes [1](#513218_1_En_6_Chapter.xhtml#Fn1_source) [2](#513218_1_En_6_Chapter.xhtml#Fn2_source)
    [3](#513218_1_En_6_Chapter.xhtml#Fn3_source) [4](#513218_1_En_6_Chapter.xhtml#Fn4_source)
    [5](#513218_1_En_6_Chapter.xhtml#Fn5_source) [6](#513218_1_En_6_Chapter.xhtml#Fn6_source)
    [7](#513218_1_En_6_Chapter.xhtml#Fn7_source)


    # 7. Solution Deployment, Maintenance, and Retirement


    Once the automation/technical team completes the development and testing of the
    Bot in the UAT/testing environment, it’s time to deploy it in the production environment.
    Make sure your technical team is following all the procedures already in place
    for testing and development of the Bot so that a quality solution that meets the
    expectations of the business goes into production. To move or deploy the Bot in
    production, a detailed and accurate procedure should be followed to avoid any
    unexpected issues while deploying. In this chapter, we will go through in detail
    everything you need to know about the deployment of the Bot to production, how
    to manage and support it once it’s in production, and how to retire the Bot whenever
    that is required. This will prevent any unpleasant surprises during the whole
    live life cycle of the Bot.


    In addition to these topics, we will also discuss auditing and performance improvements
    of the Bot.'
