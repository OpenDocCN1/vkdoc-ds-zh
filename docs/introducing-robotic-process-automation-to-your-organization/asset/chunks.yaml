    \ sponsorship, and framework will be major factors in success. We will describe\
    \ what roles within a typical organization should be involved and what their responsibilities\
    \ will be.\n\nJames Chen, writing in *Investopedia*, describes ***governance***\
    \ in this way: “Corporate governance is the [`system of rules, practices, and\
    \ processes`](https://www.investopedia.com/terms/m/mckinsey-7s-model.asp) by which\
    \ a firm is directed and controlled. Corporate governance essentially involves\
    \ balancing the interests of a company’s many [stakeholders](https://www.investopedia.com/terms/s/stakeholder.asp),\
    \ such as shareholders, senior management executives, customers, suppliers, financiers,\
    \ the government, and the community.”^([²](#fn2)) For RPA, governance is not quite\
    \ that wide ranging, and we will describe what it needs to accomplish for RPA\
    \ success.\n\nThe website Project Smart describes ***project sponsorship*** this\
    \ way: “Project sponsorship is an active senior management role, responsible for\
    \ identifying the business need, problem or opportunity. The sponsor ensures the\
    \ project remains a viable proposition and that benefits are realised, resolving\
    \ any issues outside the control of the project manager.”^([³](#fn3)) The sponsor\
    \ is usually the person responsible for the budget of the area where an RPA project\
    \ is requested.\n\n“A **framework** is a loose but incomplete structure which\
    \ leaves room for other practices and tools to be included but provides much of\
    \ the process required.”^([⁴](#fn4))\n\nThe relationship between the three concepts\
    \ is clearly seen. Governance consists of the rules and processes, sponsorship\
    \ is the authority required to ensure their survival and evolution, and they are\
    \ all performed within the framework.\n\nPause and Consider\n\nIs there effective\
    \ governance and sponsorship within your organization today? Have you seen either\
    \ or both being effective either in your current company or a previous one? It\
    \ is possible (perhaps even likely) that you have not. Do not underestimate the\
    \ importance of good governance and effective sponsorship when beginning your\
    \ RPA implementation journey. Doing so will doom the project from the start.\n\
    \n*   Governance\n\nThe RPA Solution Lifecycle includes the following; bear in\
    \ mind that there may be some differences depending on the individual needs of\
    \ specific organizations.\n\n1.  Request form\n\nThis is the basic request that\
    \ can occur in different ways; it could be an informal hallway conversation, followed\
    \ by a meeting to capture required details to move forward with the request, or\
    \ a requestor may have submitted a request form (see Appendix 1) which provides\
    \ all the required information.\n\nThe information on the request form represents\
    \ the first look at the opportunity, and consequently, there is much unknown information\
    \ at this point.\n\nTypically, at this point, the following information is captured:\n\
    \    *   High-level description of the process\n\n*   Impacted business areas\
    \ (upstream and downstream processes) and systems or tools\n\n*   Business drivers\
    \ and criticality\n\n*   Estimation of savings (FTE hours, etc.) and benefits\
    \ (improved quality, improved service, etc.)\n\n*   Opportunity identification\
    \ (detailed in Chapter [4](#513218_1_En_4_Chapter.xhtml))\n\nTip\n\nWhile initial\
    \ requests may be in the form of emails, or even informal hallway conversations,\
    \ standardizing the request form and encouraging its use will be highly beneficial.\n\
    \nThere may, however, be situations where information provided on the request\
    \ form is sufficient to conclude that automation is not feasible under current\
    \ circumstances, possibly because of the process complexity, RPA-limited capability,\
    \ or even the potentially short life span of the solution. The requestor should\
    \ be advised of this and given any possible recommendations to assist in overcoming\
    \ whatever issues were to be solved by automation.\n\nOnce an initial request\
    \ has been submitted that didn’t rise any feasibility concerns, it is ready to\
    \ move to the next step.\n\nTip\n\nRemember, this is the initial look at the request;\
    \ not a lot of detail is yet available. If no feasibility concerns are raised\
    \ here, and the request is given approval to proceed, that does not mean that\
    \ such concerns may not be uncovered in future phases, causing cancellation of\
    \ the project. If that happens, it must not be considered a failure. It means\
    \ that the iterative process has worked as it should.\n\n1.  Process discovery\n\
    \nAt this stage, the referred opportunity is assessed in detail to capture the\
    \ following:\n    *   End-to-end (E2E) process steps\n\n*   Roles and users involved\
    \ in the process\n\n*   List of systems and tools used\n\n*   Volumes (hourly,\
    \ daily, weekly, etc.)\n\n*   Process time for each step and other process performance\
    \ metrics that would help accurately estimate savings and benefits\n\n*   Process\
    \ constraints\n\n*   Proposed process steps to be automated\n\n*   Any other information\
    \ that was triggered by the request form\n\nAll this information is required to\
    \ move to the next step, opportunity assessment, which will estimate RPA value\
    \ and RPA feasibility as a solution.\n\n*   Opportunity Assessment (detailed in\
    \ Chapter [5](#513218_1_En_5_Chapter.xhtml))\n\nSeveral things are accomplished\
    \ in this phase:\n\n1.  Understand the current process flow\n    *   The process\
    \ flow was examined at a high level during Opportunity Identification. Now it\
    \ is detailed, and the inputs, activities, outputs, and roles responsible are\
    \ documented.\n\n2.  Impact analysis\n    *   Why should this be done? During\
    \ intake, some initial estimates may have been made regarding time saved, compliance\
    \ adhered to, etc. Now these are studied for more accuracy.\n\n*   What is the\
    \ investment of time and resources to create a Bot to automate the process? Is\
    \ the ROI (return on investment) sufficient to justify the expenditure? While\
    \ this is a decision for the steering committee to make, the RPA team will make\
    \ a recommendation.\n\n3.  Suitability analysis\n    *   Here we must evaluate\
    \ if the requested process is a good candidate for automation. Is it sufficiently\
    \ repetitive? Are there few decisions that need to be made that can be referred\
    \ for manual handling? These and other questions will be answered to determine\
    \ suitability.\n\n4.  Risk analysis\n    *   What are the risks involved in automating\
    \ the process? What are the risks involved in *not* automating it?\n\n*   Solution\
    \ feasibility decision process\n\nAll compiled information is presented to the\
    \ decision-makers to evaluate and to ensure that the RPA solution will bring sufficient\
    \ ROI, and expected benefits are aligned with the enterprise-wide strategy.\n\n\
    After the decision is made to proceed with RPA solution development, the opportunity\
    \ moves to the solution design phase.\n\n*   Solution Design phase (detailed in\
    \ Chapter [6](#513218_1_En_6_Chapter.xhtml))\n    1.  Plan\n\n2.  Build\n\n3.\
    \  Test\n        *   Each phase is performed according to company standards, using\
    \ “Waterfall” methodology, Agile, or whatever other methodology is generally used.\n\
    \nAfter successful testing, and passing business acceptance, the RPA solution\
    \ is released to production entering operational phase.\n\n*   Solution retirement\n\
    \    1.  Sunset (end-of-life) strategies or plan\n\n*   Solution deployment and\
    \ maintenance phase (detailed in Chapter [7](#513218_1_En_7_Chapter.xhtml))\n\
    \    1.  Release\n\n2.  Operate\n\n3.  Monitor\n\nThe information provided previously\
    \ is shown in process-flow format in Figure [3-1](#513218_1_En_3_Chapter.xhtml#Fig1).\n\
    \n![../images/513218_1_En_3_Chapter/513218_1_En_3_Fig1_HTML.png](images/513218_1_En_3_Chapter/513218_1_En_3_Fig1_HTML.png)\n\
    \nFigure 3-1\n\nRPA Solution Lifecycle\n\nThe components of effective governance\
    \ may seem complex, but the need for this structure has been demonstrated time\
    \ and again. Identifying and assessing the opportunities, and having repeatable\
    \ processes and tools for doing so, will go a long way to ensuring the success\
    \ of your new RPA initiative."
  trans: "\n# 3. 运营模式 – 治理、赞助与框架\n\n治理、赞助和框架将是成功的关键因素。我们将描述典型组织中应涉及的各个角色及其职责。\n\n\
    James Chen 在 *Investopedia* 中撰文这样描述**治理**：“公司治理是指指导和管控公司的[`规则、实践和流程体系`](https://www.investopedia.com/terms/m/mckinsey-7s-model.asp)。公司治理的本质是平衡公司众多[利益相关者](https://www.investopedia.com/terms/s/stakeholder.asp)（如股东、高级管理人员、客户、供应商、融资方、政府和社区）的利益。”^(²)\
    \ 对于 RPA 而言，治理的范围没有那么广泛，我们将描述它为实现 RPA 成功所需完成的任务。\n\nProject Smart 网站这样描述**项目赞助**：“项目赞助是一种积极的高级管理层角色，负责识别业务需求、问题或机遇。赞助人确保项目始终保持可行性，并确保实现收益，解决项目经理控制范围之外的任何问题。”^(³)\
    \ 赞助人通常是负责提出 RPA 项目的领域预算的人。\n\n“**框架**是一个松散但不完整的结构，它为容纳其他实践和工具留有空间，但提供了所需的大部分流程。”^(⁴)\n\
    \n这三个概念之间的关系清晰可见。治理由规则和流程构成，赞助是确保其存续和演进所需的权威，而这一切都在框架内执行。\n\n## 暂停思考\n\n您所在的组织目前是否存在有效的治理和赞助？您是否在现任或前任公司中看到过其中一种或两种都行之有效？您可能（甚至很可能）没有见过。在开始\
    \ RPA 实施之旅时，切勿低估良好治理和有效赞助的重要性。否则，项目从一开始就注定失败。\n\n## 治理\n\nRPA 解决方案生命周期包含以下内容；请注意，具体组织可能因个别需求而存在一些差异。\n\
    \n### 申请表\n\n这是以不同方式发生的基本请求；它可能是一次非正式的走廊谈话，随后召开会议以获取推进请求所需的详细信息，或者请求者可能提交了一份包含所有必要信息的申请表（参见附录\
    \ 1）。\n\n申请表上的信息代表了对此机会的初步审视，因此，此时存在许多未知信息。\n\n通常，此时会捕获以下信息：\n\n- 流程的高级描述\n- 受影响的业务领域（上游和下游流程）以及系统或工具\n\
    - 业务驱动因素和关键程度\n- 节约量估算（FTE 工时等）和收益估算（改进质量、改善服务等）\n- 机会识别（详见第 4 章）\n\n> **提示**\
    \  \n> 虽然初始请求可能以电子邮件甚至非正式的走廊谈话形式出现，但将申请表标准化并鼓励使用将非常有益。\n\n然而，在某些情况下，申请表上提供的信息就足以断定在当前情况下自动化不可行，原因可能是流程复杂性、RPA\
    \ 能力有限，甚至解决方案的生命周期可能很短。应告知请求者这一情况，并尽可能提供有助于克服自动化本应解决的问题的任何建议。\n\n一旦提交的初始请求未引发任何可行性问题，就可以进入下一步。\n\
    \n> **提示**  \n> 请记住，这是对请求的初步审视；尚无太多细节可用。如果在此未提出可行性问题，并且请求获得批准继续进行，这并不意味着在后续阶段不会发现此类问题而导致项目取消。如果发生这种情况，绝不能认为是失败。这意味着迭代流程按预期发挥了作用。\n\
    \n### 流程发现\n\n在此阶段，会对所提及的机会进行详细评估，以捕获以下内容：\n\n- 端到端（E2E）流程步骤\n- 流程中涉及的角色和用户\n\
    - 所用系统和工具列表\n- 作业量（每小时、每天、每周等）\n- 每个步骤的流程时间以及有助于准确估算节省和收益的其他流程绩效指标\n- 流程约束\n-\
    \ 建议自动化的流程步骤\n- 申请表触发的任何其他信息\n\n需要所有这些信息才能进入下一步——机会评估，该步骤将评估 RPA 价值以及 RPA 作为解决方案的可行性。\n\
    \n### 机会评估（详见第 5 章）\n\n此阶段需完成若干事项：\n\n1. **了解当前流程**  \n   在机会识别阶段已经对流程进行了高层次审视。现在，需要将其细化，并记录输入、活动、输出以及负责的角色。\n\
    \n2. **影响分析**  \n   为什么要做这个？在接收阶段，可能已经对节省的时间、合规性等做出了一些初步估计。现在，需要对这些进行更精确的研究。\n\
    \   - 创建一个 Bot 来自动化该流程需要投入多少时间和资源？投资回报率（ROI）是否足以证明支出的合理性？虽然这需要指导委员会做决定，但 RPA 团队会提出建议。\n\
    \n3. **适用性分析**  \n   在此，我们必须评估所申请的流程是否是自动化的良好候选对象。它是否足够重复？需要做出的决策中是否只有少数可以转交人工处理？将回答这些问题以及其他问题以确定其适用性。\n\
    \n4. **风险分析**  \n   自动化该流程涉及哪些风险？*不*自动化该流程涉及哪些风险？\n\n### 解决方案可行性决策流程\n\n所有汇总信息都会提交给决策者进行评估，以确保\
    \ RPA 解决方案能够带来足够的投资回报率，并且预期收益与整个企业的战略保持一致。\n\n在决定继续进行 RPA 解决方案开发之后，该机会进入解决方案设计阶段。\n\
    \n### 解决方案设计阶段（详见第 6 章）\n\n1. 规划  \n2. 构建  \n3. 测试  \n\n每个阶段均根据公司标准执行，使用 `Waterfall`\
    \ 方法、`Agile` 或其他常用方法。\n\n在成功测试并通过业务验收后，RPA 解决方案将发布到生产环境，进入运营阶段。\n\n### 解决方案退役\n\
    \n1. 日落（生命周期终止）策略或计划\n\n### 解决方案部署与维护阶段（详见第 7 章）\n\n1. 发布  \n2. 运营  \n3. 监控  \n\
    \n前面提供的信息以流程图格式显示在图 3-1 中。\n\n![../images/513218_1_En_3_Chapter/513218_1_En_3_Fig1_HTML.png](img/513218_1_En_3_Fig1_HTML.png)\n\
    \n**图 3-1** RPA 解决方案生命周期\n\n有效治理的组成部分可能看起来复杂，但这种结构的需求已反复得到证明。识别和评估机会，并拥有可重复的流程和工具，将大大有助于确保您新的\
    \ RPA 计划取得成功。\n"
- fmt: '# Sponsorship


    The RPA sponsor will be responsible not for performing these tasks, but for assuring
    that the outcomes or results are aligned with, and are adding value to, enterprise-wide
    strategic direction. He/she establishes program vision, objectives, and goals,
    removes any impediments, and ensures that appropriate resources are allocated
    necessary to the program’s success. Typically, the RPA sponsor is a member of
    the executive team, who oversees the area where the RPA program is being introduced.
    It is fine either for business or IT to own the program. However, it is important
    to remember that the RPA team needs to be cross-functional and should include
    the following:


    - Business

    - IT

    - Security

    - Risk and compliance

    - Finance

    - HR

    - Marketing (when appropriate)


    Stakeholders/subject matter experts from these areas must be involved in creating
    a collaborative environment since, as is mentioned in the article, “[A Blueprint
    for Implementing Robotic Process Automation Successfully,”](https://medium.com/%2540cfb_bots/a-blueprint-for-implementing-robotic-process-automation-successfully-88e5f7ff7400)^([⁵](#fn5))
    RPA has the potential to become a disruptive change agent for true and impactful
    digital transformation.


    The RPA champion, on the other hand, will be responsible for promoting RPA technologies
    to address business challenges and is accountable for RPA adoption across the
    business areas where the program is introduced. Ideally, the RPA champion is one
    who has a deep knowledge of business operations and has the necessary influence
    to promote and overcome resistance to RPA adoption by providing timely resolution
    to any roadblocks.^([⁶](#fn6)) It is optimal to have several RPA champions representing
    different business areas to maximize return value of the RPA program and ensure
    enterprise-wide adoption.


    ## Pause and Consider


    Sponsors and champions should have passion and vested interests in the success
    of the RPA program. Have you done the necessary work to assure that the people
    you want as sponsors or champions believe in RPA? Do not proceed with people who
    are either only required by their manager/leader to participate or who you know
    are not convinced of the potential of RPA.


    Ensuring that there is a senior manager who is invested in, and responsible for,
    the success of the RPA program is vital to success. They should have a compelling
    reason for assuring its success.


    # Framework


    When we refer to framework, we mean a general overview of how the program is structured.
    This is not written in stone; it will differ from company to company and even
    between different business units within the same company. But there are some basic
    foundational pieces.


    As we mentioned before, it is critical that RPA program teams are cross-functional
    and multidisciplinary and should include representatives from all impacted areas
    within business operations and control support functions. A fully functional core
    RPA delivery team should consist of the following roles:


    - Process analyst/designer

    - RPA solution architect

    - RPA developer

    - RPA management and support


    ## Process Analyst/Designer


    This role requires understanding the process that needs to be automated, checking
    the feasibility of automating that particular process and, if it makes sense to
    do so, designing and developing the future state of that process. The process
    analyst/designer is experienced with business processes and is able to define
    the vision of the desired processes. Since there might be one or more people in
    that role, it is very important to remember that the process analyst/designer
    has to work closely with people who perform the current process in order to accurately
    capture its details. The process analyst/designer must understand and evaluate
    these details in order to assess if the process is a good fit for RPA and that
    the deployed solution (Bot) won’t expose operations to any risks and will yield
    sufficient benefits. To do so, the process analyst/designer will also be familiar
    with the capability and limitations of RPA tools and be able to provide basic
    overview training to the process owners. The process analyst/designer is the driver
    of the specification for the RPA solution, at the same time acting as an owner
    of any other related documentation such as feasibility, impact and risk assessments
    as well as business acceptance handoffs, etc. In addition, they should be responsible
    for incorporating back into the specification any feedback and changes made during
    the development and testing phase.


    ## RPA Solution Architect


    RPA solution architects traditionally come from software development or automation
    backgrounds. The RPA arena is growing very fast and is assisted by simple Task
    Bots that execute repetitive, rule-based tasks. These are easy to build to a new
    generation of IQ Bots that allow the addition of cognitive processing capabilities,
    enabling the process to deal with unstructured data. Also, there are plenty of
    packaged enterprise software offerings, such as AutomationAnywhere, BluePrism,
    UIPath, etc. The RPA solution architects need to be familiar with not only the
    RPA capabilities available today but must also be knowledgeable about the following:


    - Automation strategies

    - Digital solution delivery models and frameworks (Agile, DAD, DevOps, etc.)

    - IT infrastructure and business operations

    - Products or services that will be addressed in an RPA program


    This expertise is required to assist and guide the organization throughout the
    RPA journey in building sustainable, effective (impactful), and scalable solutions.


    ## RPA Developer


    The main responsibilities of the RPA developer are to design, develop, and maintain
    the automation solutions using the RPA tooling. Depending upon the tooling used,
    this role will require some developer-level expertise. If you’re looking to automate
    a process that involves rules and logic such as loops, `if/else` statements, variables,
    and exceptions, it requires programming, and the RPA developer should have the
    required experience in that discipline. Keep in mind there are multiple ways to
    automate a process; therefore, good technical knowledge of automation tools is
    a huge asset.


    That the RPA developer is a part of the cross-functional design team means they
    are working closely with the RPA solution architect and the process analyst/designer
    to find the most effective and efficient way to develop, test, and, after successful
    acceptance by the process owner, deploy to production the automation solution.
    It is important to remember that the released-to-production solution should be
    accompanied by supporting documentation to help developers and operations personnel
    understand the logic and content of the automated solution.


    ## RPA Management and Support'
