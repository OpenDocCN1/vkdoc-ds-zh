    select ‘individual insurance’; click ok; enter customer last name; click ok; enter
    customer first name; etc.”


    *   The step could simply say “find customer account number.” The details of the
    steps will be defined, probably by video recording someone actually performing
    the steps in the process, at a later stage in the project. What is required now
    is a solid understanding of the end-to-end process at a high level.'
  trans: '

    # 机会概览


    机会评估的一个主要组成部分是机会概览。这是一份对请求的快速浏览，包含诸如需求概述、期望的解决方案状态以及自动化的预估收益（例如，投资回报率，收益可以是定性和/或定量的）等信息，这些收益可能是财务上的，或者可能包括保持竞争优势、满足法律要求或其他若干因素。其中包含的大部分信息都来自请求表单，并可在探索阶段获取。请参考附录
    6 获取模板。


    换句话说，机会概览是一份执行摘要，它向治理委员会成员提供了关于该机会、可能的解决方案及其复杂性、风险和收益的全面但高层次的概述。


    **提示**


    请始终记住，所提供的模板可以根据组织的需求进行调整。


    以下是典型机会概览的组成部分和细节：


    - **项目名称**：不言自明。请记住，此请求尚未成为一个项目，但这将是赋予该工作的标题，该工作可能会产生以此为名的项目。


    - **编制人**：通常是指业务流程分析师以及任何可能参与的主题专家，以及他们的职务和部门。


    - **机会描述**：以请求表单中的“当前流程描述”信息为基础。在机会概览中，信息是从请求表单上的基本记录提炼而来，以对当前状况和当前存在的问题形成更连贯的描述。


    - **机会陈述**：应该简短，一句话即可。此处需对问题进行简明扼要的总结。例如：“当前手动执行的流程会导致不可接受的延迟以及因错误而反复、耗时地返工。”


    - **目标**：用简单的语言写出请求者希望达成的目标；这应是对机器人应执行的操作的总体描述。用你自己的话表达你希望机器人做什么。例如：“机器人将扫描订单并生成包含客户地址的发票……”或“机器人将读取客户电子邮件并提取信息，以便在系统中进行必要的更新。”


    - **假设与约束**：在本节中，简要包含任何你认为属实且与项目相关的事项。例如，“假设：系统 123 和系统 ABC 能够通信。”关于约束，列出任何你认为可能妨碍机器人轻松构建的事项。例如，“目前，系统
    XYZ 无法读取以 L 结尾的账户。”此处无需进一步解释。


    - **当前状态**：在此处放置足以显示待自动化步骤的流程图。请参考附录 2 获取模板。


    - **运营收益估算**：请求表单上列出了一些初步收益，但更具体的信息要在本阶段详细说明。它应清晰（但无需非常详细）地展示所请求的自动化的优势。节省的成本（投资回报率）是否足以证明自动化成本的合理性？所请求的自动化是否将解决重要的竞争或监管问题？这些考虑因素必须包含在内。


    - **提议的解决方案/流程变更**：此处明确说明要自动化的具体内容。例如，“对前文引用的流程图中的步骤 3–7 进行自动化。”它也可以是描述性的；例如，“自动化识别逾期超过
    90 天的账户、发送通知以及通知客户代表已发送逾期信函的过程。”


    **暂停与思考**


    机会概览是对流程自动化请求的高层次评估。管理层将审查机会概览并就请求做出决定，他们不需要也不想获得与分析人员、开发人员、测试人员等相同级别的信息。添加额外信息似乎是一种“覆盖所有方面”的好方法，但将机会概览限制在做出决定所需的最低限度的关键信息上，效果会好得多。


    ## 当前状态流程图


    自动化一个流程意味着使用现有的流程步骤，并简单地将它们从手动执行转变为自动执行（注意：在某些情况下，可能需要在自动化之前优化流程）。为了使治理委员会能够就流程自动化做出决定，并使开发人员能够创建解决方案，必须理解该流程。当前状态流程图是实现这一目标的主要工具之一。


    在此阶段，流程图应该保持相当高的层次；没有必要详述，例如：


    - “访问屏幕 X；找到‘账号’下拉菜单；点击下拉按钮；选择‘个人保险’；点击确定；输入客户姓氏；点击确定；输入客户名字；等等。”

    - 该步骤可能只是简单地说“查找客户账号”。这些步骤的细节将在项目后期阶段确定，可能是通过录制某人实际执行流程中的步骤的视频来实现。现在需要的是对端到端流程有一个高层次且扎实的理解。

    '
- fmt: '# Feasibility Assessment


    Another major factor of opportunity assessment is feasibility. At this point,
    “feasibility” only relates to the high-level view we currently have. Does it appear,
    based on the limited information thus far available, that the proposed process
    is suitable for automation? In other words, is RPA a reasonable solution to the
    presented opportunity? The goal of the feasibility assessment is to identify,
    as early as possible, requests that are not suitable for RPA and avoid spending
    unnecessary resource hours. The feasibility assessment, with a recommendation
    by the RPA team, will be a major part of the Governance Committee’s decision-making
    process about the requested automation.


    Remember that if the project is approved to move to the next stage, more information
    will be obtained during that stage, and there will be another Governance Committee
    checkpoint, at which the new information will be evaluated. It is possible that
    a project that was seen as “feasible” when very little information was available
    may be viewed differently with additional information and could be cancelled.
    It is very important to reflect and learn from the information or details that
    lead to cancellation of the RPA development and incorporate that into the feasibility
    assessment tool to minimize the RPA cancellation rate. By achieving a low cancellation
    rate, you would decrease operational cost (higher-technology ROI), increase delivery
    velocity, and improve business operations’ trust and user satisfaction. Additionally,
    with the evolving capability of digital automation, some previously impossible
    solutions might become feasible; therefore, you need to make appropriate adjustments
    to the feasibility assessment tool over time, as you gain more experience with
    RPA.


    ### Pause and Consider


    Why is cancellation at a later stage not a “failure”? Remember, the Governance
    Committee exists to evaluate the current information. At “opportunity identification”
    or “opportunity assessment,” only basic information is known, and the Governance
    Committee isn’t giving approval for the entire project, just for the next phase,
    wherein additional information will be discovered. The Governance Committee will
    then evaluate that information.


    At this stage, there are six basic questions to ask.


    ## Feasibility Assessment


    `<Name of Project>`


    |   | **Questions** | **Answers** |

    | --- | --- | --- |

    | 1 | Is the process well defined? |   |

    | 2 | Is the process stable (very few “exceptions”)? |   |

    | 3 | Can exceptions be handled manually? |   |

    | 4 | Are inputs in digital format? |   |

    | 5 | Can required data be input without human intervention? |   |

    | 6 | Are potential changes to roles and processes acceptable to management? |   |


    **Approvals:**


    `<Name>` `<Role>` _______________________________ Date: ____________


    `<Name>` `<Role>` _______________________________ Date: ____________


    `<Name>` `<Role>` _______________________________ Date: ____________


    `<Name>` `<Role>` _______________________________ Date: ____________


    (See Appendix 4 for a template.)


    1. **Is the process well defined?** Here, you need to determine how repetitive
    the process is. Basically, are the exact same steps performed each time the process
    is run? Are the steps well-known? Are there a limited number of exceptions? This
    is one characteristic that makes a process a good candidate for automation.


    2. **Is the process stable (very few “exceptions”)?** When the process is invoked,
    are the steps that are taken based on clearly established rules? Are the steps
    the same within the process?


    3. **Can exceptions be handled manually?** For any process, a certain, limited
    number of transactions might need some additional steps. Perhaps an account number
    was entered incorrectly, and the account must be looked up by last name. A customer
    might make a special request within a more common request. Can these transactions,
    if within an automated process, be sent to a mailbox for manual handling? Is there
    a process for handling these exceptions now?


    4. **Are inputs in digital format?** Do the inputs currently come into the process
    via an electronic mailbox? Or are they calls from clients or others that must
    be input by the call receiver? If so, can the input created by the call receiver
    be input into a system that the Bot can access?


    Also, are all inputs Excel files? Word Documents? PDFs? Etc. How easily might
    they be read by a Bot?


    5. **Can required data be input without human intervention?** A Bot does not think;
    it looks for exactly what it is told to look for and handles what it finds accordingly.
    If inputs require human judgment, beyond a simple decision of if it can be handled
    by the Bot, that process is not a good candidate for automation. Tasks that require
    little to no judgment and have low exception rates are good candidates for RPA.


    For example, an electronic mailbox may receive 300 emails per day, and 100 of
    them can follow a standard process. It may take a person to manually review the
    300 emails and forward the 100 that can follow a standard process to the Bot.
    But once there, the Bot can take over.


    If, however, the mailbox receives 300 emails per day, and each requires that a
    person read them and look up a variety of different information that may be available
    from a variety of different and ever-changing sources, then this process would
    not be a good candidate for automation.


    6. **Are potential changes to roles and processes acceptable to management?**
    One advantage of automating processes is that staff will be freed up for other
    responsibilities, changing their roles. Also, when the process is being investigated
    for automation, efficiencies may be determined that will change the process before
    it is automated. These and related changes must be accepted by the process owner,
    in order to move forward.


    ### Pause and Consider


    Are there other considerations in your organization that should be added to a
    “feasibility assessment” template? Remember, these basic questions are fairly
    standard, but there is no “one-size-fits-all.” You may start with these and use
    them for the first few RPA projects, but your “feasibility assessment” template,
    along with all the others included herein, may evolve over time to meet the specific
    needs of your organization.'
