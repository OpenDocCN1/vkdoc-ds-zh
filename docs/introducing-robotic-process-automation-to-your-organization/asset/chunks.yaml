  trans: '

    # 流程挖掘


    我们在本书中始终强调，RPA 适用于逻辑简单、无需太多智能或人工干预的重复性流程。这是因为大多数流程都涉及安全性和准确性问题。流程必须足够简单，才不会影响安全性和准确性标准。根据我们的经验，流程通常由希望简化运营并提升效率的业务负责人介绍给我们。因此，他们可能会确定一两个他们知道极其重复且看似适合自动化的流程。但通常，这些流程会因某种原因而受到关注；或许是因为执行该流程的员工正在表达不满，因为，我们直说吧，做这种重复性工作可能会很无聊！


    业务部门中可能还有其他几个同样重复的流程，但或许它们目前并未引起管理层的注意。也许它们是月末或年末流程，而非日常流程。也许它们只是偶尔被用来清理某种积压的请求。无论原因如何，它们都可能是极佳的自动化候选对象，但目前尚未被管理层识别为这样的对象。


    流程挖掘工具旨在分析流程，并利用内置逻辑识别和帮助确定哪些是自动化的最佳候选对象。企业应提供尽可能多的流程，而不仅仅是那些“问题突出”的流程，并将其输入流程挖掘工具，该工具将识别出最佳的自动化候选对象。


    在更简单的层面上，对于较小的组织或更简单的流程，流程挖掘工具也可以作为识别自动化候选对象的起点。该工具可以突出显示重要的业务功能及其相关的流程。


    流程挖掘工具还能带来巨大益处的另一个领域是流程之间的交汇点。流程挖掘工具有助于确定这些交汇点中哪些可以实现自动化。


    [托马斯·H·达文波特](https://hbr.org/search%253Fterm%253Dthomas%2520h.%2520davenport)和[安德鲁·斯帕尼](https://hbr.org/search%253Fterm%253Dandrew%2520spanyi)在《哈佛商业评论》中撰文，简洁地总结了流程挖掘的优势：


    > *流程挖掘软件可以帮助组织轻松地从企业交易系统中捕获信息，并提供关于关键流程如何执行的详细——且基于数据驱动的——信息。它在工作完成时创建事件日志：收到订单，交付产品，进行付款。这些日志使人们能够了解以计算机为媒介的工作是如何实际发生的，包括谁做的、花费了多长时间，以及它如何偏离平均值。流程分析为流程创建关键绩效指标，使公司能够专注于优先改进的步骤*。^(³⁴)


    请记住，尽职调查仍然必不可少；工具的性能取决于其输入，而自动化决策仍需由人力资源做出。


    一旦流程挖掘工具选定了流程，将遵循本书中所示的“机会评估”之后的所有阶段，包括与治理委员会定期开会，以批准或不批准进入下一步。


    **暂停与思考**


    对于拥有高度复杂流程的大型组织，流程挖掘可以极大地加快识别潜在自动化候选对象的速度。这在你的组织中会有益处吗？你需要与谁交谈才能更好地了解流程挖掘对你的组织潜在的好处？


    # 智能处理


    在当前的 RPA 中，我们构建逻辑和简单规则，将手动步骤转换为自动化。智能处理可以看作是“一种处理非结构化文本数据的方式。文档认知利用人工智能、机器学习、认知科学和自然语言处理来索引结构化、半结构化和非结构化数据。”^(³⁵)


    通过智能处理，我们正在构建 IQ 机器人。利用人工智能和机器学习，结合 RPA 技术，我们在构建机器人时为规则增加了智能。一个例子是识别文档中的手写文本；目前，包含手写信息的机器人输入将被转交给人工处理；机器人无法读取手写内容。人工智能技术可以帮助读取此类文本，并具有可校准的准确率百分比，从而提高机器人的性能。与任何部分自动化的流程一样，机器人无法读取和/或理解的内容都可以转交给人工处理。


    乔·沙利文在《Capacity》中撰文，列出了智能文档处理的七项好处。^(³⁶) 他说 IDP：


    1.  促进自动化，因为它有助于流程改进

    2.  通过整理文档、数据录入和信息验证简化合规性

    3.  高效省力，因为它减少了以文档为中心的工作流程中的人工干预

    4.  支持可扩展性，因为它可以应用于组织中不同领域的各种应用程序

    5.  通过减少处理文档所需的时间和降低劳动力成本来节省开支

    6.  通过在极短时间内处理大量数据来提高速度

    7.  通过大大减少处理文书工作的时间来提升客户体验和满意度


    **提示**


    正如沙利文在其文章^(³⁷)中所提到的，一些管理团队倾向于忽视与客户体验相关的软成本。不要犯这个错误！仅仅因为你可能无法用具体金额量化客户体验，任何组织如果希望在当今市场取得成功，就必须始终以客户体验为核心。

    '
- fmt: '# Hyperautomation


    One of the upcoming technological trends which is heavily discussed in the industry
    today is hyperautomation. According to Gartner, hyperautomation in the near future,
    within the next few decades, is going to have the greatest impact on expanding
    automation of business processes.


    As we have already mentioned earlier, the best use of `RPA` is for highly repeatable,
    high-volume, manual tasks carried out by employees. Unfortunately, traditional
    `RPA` software has limitations. It doesn’t understand inputs in the form of unstructured
    data, and it doesn’t learn by itself. Due to those limitations, any `RPA` solution
    is only suitable for rule-based tasks which require human intervention to translate
    them into the Bot’s language, in the form of code. It leads to a few disadvantages.
    First, any changes to the process would require a skilled developer to make changes
    to the code and then test and deploy the changes to production. It slows business
    agility and increases operational costs. Second, depending on the industry, the
    rule-based processes may cover a small fraction of overall business operations,
    limiting the expansion of digital processing and not achieving operational cost
    reduction targets.


    So, how about tasks that require more critical thinking? What if most of the processes
    in your organization require analysis of different data to produce an output?
    Can they be automated?


    The concept of hyperautomation goes beyond the straightforward, rule-driven, and
    repeatable processing; it is not a single tool but a combination of, in addition
    to `RPA`, multiple, more advanced processing technologies, such as intelligent
    document processing (`IDP`), optical character recognition (`OCR`), and intelligent
    character recognition (`ICR`). It combines AI-powered solutions like predictive
    modeling, machine learning, deep learning, natural language processing, and other
    intelligent processing technologies into one system. Compared to conventional
    `RPA` automation, hyperautomation allows expanding automation to complex and often
    heavily cognitive processes that require human intervention to make a decision,
    enabling end-to-end process automation of the business operations. Its primary
    mission is to continuously increase the scale of automated end-to-end operational
    decision-making processes by eliminating human operators from low-value operations.
    Due to its nature, hyperautomation creates a separate subset of digitally run
    operations within an organization that replace conventional operations that rely
    heavily on manual processing, often requiring the physical presence of the workforce.


    Consequently, in the near future, operational leaders will need to be ready to
    redefine their employees’ responsibilities, their required skill set, and the
    way they are seeing their work. It might seem that the expansion of hyperautomation
    across industries would make human employees obsolete. We would argue that there
    is no reason to be so pessimistic, at least not for a very long time. We believe
    that the artificial intelligence solutions as part of hyperautomation will redefine
    and reshape the workforce, and, yes, some jobs are going to be fully automated,
    but some new ones will be created and others will need to be readjusted. Looking
    at the nature and limitations of AI-powered solutions, the jobs that will likely
    disappear in the future are customer service related such as receptionist, travel
    agent, cashier, bank teller, etc. We would predict that manual processing would
    still exist in the future for very complex decision-making operations. However,
    we envision that AI will function more as an assistant to human decision-making
    and not its main driver. In those human-machine models, AI would process input
    data and make recommendations, or propose a decision together with the rationale
    behind it, but a human is going to be the one who makes the final call.


    An extension to this AI-human partnership would be an incorporation of a learning
    loop back to AI when a human makes a decision to create a continuous learning
    cycle. The same way as we humans learn by gaining experience with time, machines
    will learn from humans. The proposed approach, in comparison with traditional
    supervised algorithm-based training, would accelerate the AI learning process,
    but most importantly, it increases the adaptability and speed with which any change
    in the decision-making model can be incorporated. As business conditions are rapidly
    changing around us, AI will need to be kept updated with current criteria and
    business rules in order to avoid a model to drift and potentially result in inadequate
    performance and poor decision outcomes. Thus, establishing continuous learning
    cycles where humans continuously curate the decision criteria back to the AI model
    would ensure continuity of business operations by avoiding taking AI out of operations
    for lengthy overhauls and adjustments.


    Further, depending on risk and poor decision impact level, the human-AI model
    can be adjusted so that high-confidence decisions could be delegated to machines,
    allowing humans to focus on low-confidence decisions. Of course, the question
    is what parameters to use and how to define the confidence level based on which
    criteria.


    Hyperautomation could bring numerous advantages that could boost an organization’s
    performance, increase its competitiveness, accelerate innovation, as well as improve
    the well-being of its workforce.


    These could include:


    - **Reduction in operational cost** by redesigning and replacing manual, low-complex
    processes with automation.

    - **Acceleration of digital transformation** when the organization could align
    its business operational goals with investment in technology.

    - **Improved competitive advantage** by introducing new technologies into day-to-day
    operations, since outputs could be produced faster, with higher quality and lower
    cost, resulting in improved customer satisfaction.

    - **Increased quality of business decisions**: AI technology would require access
    to data; this means that business-related information can be easily extracted
    and used, which would create an effective evidence-based, decision-making environment.

    - **AI-powered technologies would accelerate innovation** across the organization
    and increase business agility.

    - **Improved collaboration among technology and business operation teams**. Hyperautomation
    requires integration of multiple technologies and business operations, which are
    traditionally siloed, into one ecosystem.

    - **Increased employee satisfaction** since it would enable employees to focus
    more on value-added tasks which are going to be more interesting, challenging,
    and diverse. Creating a smart working environment where employees will be challenged
    and do not waste their time on boring, repeatable, low cognitive, and low value
    tasks would result in an increase of their productivity.


    Hyperautomation can be largely advantageous for large and hierarchical organizations
    with many legacy systems and heavily manual operations that have considerably
    low automated processing levels. `RPA` Bots can integrate legacy systems with
    other technology solutions used in hyperautomation. By achieving that, those organizations
    would see real results in improving business operations’ agility, effectiveness,
    and efficiency very quickly.


    It is important to remember that different technologies used as part of hyperautomation
    might experience challenges during their implementation due to organizational
    and technological limitations. The most common challenges include:


    - Using AI-powered cloud-based solutions may require the use of client personal
    data which could increase risk of a privacy breach.

    - AI-powered solutions may inherit biases that are either coming from the data
    used for training or embedded into an algorithm because of using assumptions.'
