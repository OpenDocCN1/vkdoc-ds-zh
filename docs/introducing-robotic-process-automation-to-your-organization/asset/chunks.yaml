  trans: '

    ## 书籍结构


    如何运用这些原则来获得理想效益？本书旨在帮助 RPA 新手在所在公司成功实施 RPA 项目。前两章阐述了成功实施 RPA 所需的基础工作。其余章节则描述了
    RPA 实施各具体阶段的活动，以及如何进行监控以确保成功。


    **第 1 章 概述。** 介绍 RPA：什么是 RPA、如何在 IT 组织中发展壮大，以及它能为您的组织带来哪些益处。


    **第 2 章 初步准备。** 在任何规模的组织中成功引入 RPA 项目需要做哪些准备？在开始前必须落实的关键要素是什么？如何识别对成功至关重要的“早期采用者”？有哪些隐藏陷阱，又该如何规避？


    **第 3 章 运营模式——治理、赞助与框架。** 需要多少结构？这种结构应具备多大的灵活性？为确保项目审批即使情况变化仍保持有效，应设置哪些关卡？谁是对
    RPA 项目负责的关键利益相关者？为什么在后期阶段取消项目不算“失败”？


    **第 4 章 机会识别。** 如何征求自动化机会？如何最好地引入自动化重复性手动流程的想法？哪些表格能帮助您最佳地识别机会？此阶段需要哪些人员（何种角色）参与？


    **第 5 章 机会评估。** 在确定了一些可能的自动化候选方案后，如何对其进行评估？您应关注哪些方面？需要哪些文档？您应向治理委员会提交哪些内容？如何处理模棱两可的情况（“如果……这可能是个好机会”）？此阶段需要哪些人员（何种角色）参与？


    **第 6 章 解决方案设计。** 方案获批后，如何设计解决方案？由谁参与？需要哪些文档？


    **第 7 章 解决方案部署、维护与退役。** 方案设计完成后，部署前需要做什么？必须采取哪些步骤来确保最大的成功可能性？需要哪些文档？此阶段需要哪些人员（何种角色）参与？


    **第 8 章 组织结构。** 您的新 RPA 项目应采用何种最佳结构？您需要了解组织中现有的结构。我们详细介绍了三种最常见的结构：集中式、分散式和中心辐射式。


    **第 9 章 开发方法论与框架。** 不同组织使用不同的方法论，例如传统的瀑布式方法论、敏捷方法论或混合方法论。无论您的组织使用何种方法论，我们都将描述其中的共通之处，以及如何确保
    RPA 成功，而不受方法论限制。


    **第 10 章 未来规划。** 随着技术变革，您将如何适应？同时，随着流程变化，现有机器人可能需要哪些调整？即使在未来充满不确定性的情况下，您如何构建应对变化的能力？本章提供了必要的指导，以确保您的新
    RPA 项目能够在未来持续带来效益。


    **第 11 章 挑战与陷阱。** 在实施 RPA 项目的过程中，您会遇到许多挑战。我们在前几章已经详细介绍了其中一些内容，但本章将对其进行总结。管理层三心二意的支持有何风险？您将如何应对那些感觉工作可能被自动化取代的一线员工（如果这种威胁真实存在，您又将如何处理）？如何最有效地与卓越中心（COE）合作？如果您的组织中没有
    COE，这些职责又将由谁来承担？


    **第 12 章 总结。** 在本最后一章中，我们将重点介绍 RPA 优势的一些关键亮点，以及为什么 RPA 可能是您组织的理想选择。我们还会简要提一下，在您开始引入
    RPA 时需要注意的一些事项。


    **附录。** 附录包含了本书所述的所有必要文档。这包括但不限于：申请表（基本起点——最终将由请求者填写，但最初您需要与请求者共同完成，因为他们对此不熟悉）、风险评估表、可行性评估表、需求文档（功能性和非功能性）模板以及其他诸多内容。当然，这些内容可以根据您的特定需求进行调整，但它们为您提供了一个重要的起点。起初，最好按原样使用它们。随着您在使用
    RPA 过程中积累经验，您将对其进行调整，使其在您的特定组织中发挥更大效力。


    虽然本书将成为任何 RPA 计划的持续参考，但建议初次阅读时从头到尾通读一遍。这样，刚接触 RPA 的人就能对全书有很好的概览，并在遇到问题时知道在书中何处查找更详细的信息。


    祝您在开启 RPA 之旅时一切顺利！


    脚注


    ## 2. 初步准备

