    \ client ID and updates the information as required.\n\n*   The CSS confirms the\
    \ update with the client.\n\n*   The CSS maintains a record of updated information.\n\
    \n**Flow Diagram**\n\n![../images/513218_1_En_6_Chapter/513218_1_En_6_Figb_HTML.png](images/513218_1_En_6_Chapter/513218_1_En_6_Figb_HTML.png)\n\
    \n**Goal of the Automation**\n\nThe goal is to create a Bot that will retrieve\
    \ the emails, read and parse them, update the information as specified, and inform\
    \ the client that the information has been updated.\n\n**Applications Involved**\n\
    \n| **Name** | **Internal/External** | **Type** | **Credentials Required?** |\
    \ **Read/Write** |\n| --- | --- | --- | --- | --- |\n| Web Application – Client\
    \ CRM | Internal | Network-hosted application | Yes | Both |\n| Mainframe 1 |\
    \ Internal | Mainframe | Yes | Both |\n\n**Inputs**\n\n| **Name** | **Description**\
    \ | **Initial Value** |\n| --- | --- | --- |\n| AddressUpdate_ClientID | An email\
    \ that will contain the client ID and a new phone number and/or address | Address\
    \ and/or phone information |\n\n**Process Steps**\n\n**First Sub-process**\n\n\
    | **Step Number** | **Description** |\n| --- | --- |\n| 1 | Bot starts. |\n| 2\
    \ | Bot logs into email account. |\n| 3 | Bot reads emails. |\n| 4 | Bot extracts\
    \ client information. |\n| 5 | When all emails have been read, Bot sends completion\
    \ message. |\n\n**Second Sub-process**\n\n| **Step Number** | **Description**\
    \ |\n| --- | --- |\n| 6 | Bot logs into Web CRM. |\n| 7 | Bot searches with client\
    \ ID. |\n| 8 | Bot doesn’t find client ID – “not found” message sent. |\n| 9 |\
    \ Bot finds client ID. |\n| 10 | Bot populates client information in appropriate\
    \ fields. |\n| 11 | Bot activates update. |\n| 12 | Bot sends completion message.\
    \ |\n\n**Third Sub-process**\n\n| **Step Number** | **Description** |\n| --- |\
    \ --- |\n| 13 | Bot logs into Mainframe. |\n| 14 | Bot searches with client ID.\
    \ |\n| 15 | Bot doesn’t find client ID – “not found” message sent |\n| 16 | Bot\
    \ finds client ID. |\n| 17 | Bot populates client information in appropriate fields.\
    \ |\n| 18 | Bot activates update. |\n| 19 | Bot sends completion message. |\n\n\
    **Fourth Sub-process**\n\n| **Step Number** | **Description** |\n| --- | --- |\n\
    | 20 | Bot sends email to Client. |\n\n**Exceptions**\n\n*   Business\n    * \
    \  Client ID is missing in the email: Send exception message EmailMissingClientID.\n\
    \n*   Last name or first name is missing in the email: Send exception message\
    \ EmailMissingFirstOrLastName.\n\n*   Technical\n    *   Web CRM URL not reachable:\
    \ Send exception message CRMInReachable.\n\n*   Login password failed – Web CRM:\
    \ Send exception message LoginFailedPWDExpired.\n\n**Success Criteria**\n\nThe\
    \ process is complete when the Bot sends a job completion notification daily at\
    \ (time – TBD).\n\nDebugging Tips"
  trans: "\n5.  `Rectify`缺陷：不要期望所有测试用例都能通过；如果都通过了，很可能是因为你没有创建足够有效的测试用例。缺陷很常见，发现它们是测试的主要目的之一。所有失败的测试用例都应被完整记录；信息过多总比过少要好。必须为开发团队提供足够的信息，以便他们能够纠正错误。\n\
    \n**暂停并思考**\n\n目前你所在组织的测试流程是什么？为了进行 RPA 测试，该流程需要如何调整？这些改变会遇到阻力吗？如果有，你将如何克服？\n\n\
    测试文档必须存储在一个相关人员易于访问的仓库中。请记住，需要查看文档的开发人员可能同时在进行多个项目。你需要确保他们能够快速、轻松地找到所需的信息。\n\n\
    **暂停并思考**\n\n目前你所在组织的测试文档存储在哪里？它是否易于访问，足以满足你新的 RPA 计划的需求？如果不是，需要做出哪些改变？由谁来执行这些改变？\n\
    \n本节讨论的大部分内容都与质量保证（QA）和质量控制（QC）相关。这并非巧合！我们来看看各自的定义：\n\n质量保证：“*质量管理*的一部分，专注于提供*质量要求*将得到满足的*信心*。”^(¹⁷)\n\
    \n质量控制：“*质量管理*的一部分，专注于满足*质量要求*。”^(¹⁸)\n\n因此，质量控制可以被视为满足质量保证的需求。\n\n**暂停并思考**\n\
    \n你的组织是否有正式的质量保证和质量控制职能？如果有，如何将它们最好地整合到你新的 RPA 计划中？如果需要，有什么需要做得不同的地方？如果没有正式的质量保证和质量控制职能，你如何仍然能确保在你的\
    \ RPA 项目中两者的需求都得到满足？\n\n## 自动化测试执行\n\n当 RPA 团队正在自动化客户或终端用户的流程时，自动化其自身的流程也将是有益的。这包括自动化机器人的测试过程。\n\
    \n由于所有机器人在功能上都是独特的，在决定自动化其测试之前，需要考虑几件事。确定测试自动化的使用频率。对于每个特定的机器人，创建自动化测试的简单或复杂程度如何。此外，确定你创建的测试自动化是否可以在未来用于测试其他机器人；尝试确定其可重用性。\n\
    \n如果确定自动化机器人测试将是有益的，那么这样做将包含三个组成部分。你首先需要执行自动化来搭建环境并创建所需的测试数据。然后执行机器人自动化。最后，你将收集机器人执行后的输出数据，并验证输出以创建测试摘要。\n\
    \n## 案例研究\n\n现在让我们看看解决方案设计是如何在我们的案例研究中实施的，该案例研究在第 4 章中介绍过。我们在第 5 章中继续推进。现在我们将看到我们的假设案例将如何在解决方案设计中推进。\n\
    \n让我们从创建`SDD`开始。在此文档中，我们需要填充各种信息。网上有各种可用的模板；使用我们提供的模板或任何其他看起来满足你需求的模板。\n\n###\
    \ 解决方案设计文档\n\n**电话与地址变更**\n\n| **审批** | **签名** |\n| --- | --- |\n| Mary Brown，经理，客户服务部\
    \ |   |\n\n|   |   | **备注** |\n| --- | --- | --- |\n| **作者** | John Williams，CSS\
    \ 主管 |   |\n| **日期** | 20xx 年 7 月 28 日 |   |\n| **版本** | 草案 0.1 | 初稿 |\n\n####\
    \ 本文档目的\n\n本文档包含电话与地址更新流程的解决方案设计。它呈现了高级别的“现状”流程步骤以及将被自动化的“未来”流程步骤。\n\n当前流程如下：\n\
    \n*  变更地址和/或电话号码的请求接收自指定的邮箱。\n*  CSS 验证客户 ID 并按需更新信息。\n*  CSS 与客户确认更新。\n*  CSS\
    \ 维护更新信息的记录。\n\n#### 流程图\n\n![../images/513218_1_En_6_Chapter/513218_1_En_6_Figb_HTML.png](img/513218_1_En_6_Figb_HTML.png)\n\
    \n#### 自动化目标\n\n目标是创建一个机器人，它将检索邮件，读取并解析它们，按指定信息进行更新，并通知客户信息已更新。\n\n#### 涉及的应用程序\n\
    \n| **名称** | **内部/外部** | **类型** | **是否需要凭据？** | **读/写** |\n| --- | --- | --- |\
    \ --- | --- |\n| Web 应用程序 – 客户 CRM | 内部 | 网络托管应用程序 | 是 | 两者 |\n| 大型机 1 | 内部 |\
    \ 大型机 | 是 | 两者 |\n\n#### 输入\n\n| **名称** | **描述** | **初始值** |\n| --- | --- | ---\
    \ |\n| `AddressUpdate_ClientID` | 一封包含客户 ID 和新电话号码和/或地址的邮件 | 地址和/或电话信息 |\n\n####\
    \ 流程步骤\n\n**第一子流程**\n\n| **步骤编号** | **描述** |\n| --- | --- |\n| 1 | 机器人启动。 |\n\
    | 2 | 机器人登录邮箱账户。 |\n| 3 | 机器人读取邮件。 |\n| 4 | 机器人提取客户信息。 |\n| 5 | 当所有邮件已读取完毕，机器人发送完成消息。\
    \ |\n\n**第二子流程**\n\n| **步骤编号** | **描述** |\n| --- | --- |\n| 6 | 机器人登录 Web CRM。\
    \ |\n| 7 | 机器人使用客户 ID 进行搜索。 |\n| 8 | 机器人未找到客户 ID – 发送“未找到”消息。 |\n| 9 | 机器人找到客户\
    \ ID。 |\n| 10 | 机器人将客户信息填入相应字段。 |\n| 11 | 机器人激活更新。 |\n| 12 | 机器人发送完成消息。 |\n\n\
    **第三子流程**\n\n| **步骤编号** | **描述** |\n| --- | --- |\n| 13 | 机器人登录大型机。 |\n| 14 |\
    \ 机器人使用客户 ID 进行搜索。 |\n| 15 | 机器人未找到客户 ID – 发送“未找到”消息 |\n| 16 | 机器人找到客户 ID。 |\n\
    | 17 | 机器人将客户信息填入相应字段。 |\n| 18 | 机器人激活更新。 |\n| 19 | 机器人发送完成消息。 |\n\n**第四子流程**\n\
    \n| **步骤编号** | **描述** |\n| --- | --- |\n| 20 | 机器人向客户发送邮件。 |\n\n#### 异常\n\n* 业务异常\n\
    \  * 邮件中缺少客户 ID：发送异常消息 `EmailMissingClientID`。\n  * 邮件中缺少姓氏或名字：发送异常消息 `EmailMissingFirstOrLastName`。\n\
    * 技术异常\n  * Web CRM URL 无法访问：发送异常消息 `CRMInReachable`。\n  * 登录密码失败 – Web CRM：发送异常消息\
    \ `LoginFailedPWDExpired`。\n\n#### 成功标准\n\n当机器人每天（时间待定）发送作业完成通知时，流程结束。\n\n####\
    \ 调试技巧\n"
- fmt: 'If the Bot fails to log in to email, run the email subtask. If there is an
    error in updating the address or phone number in the web application, run the
    web application series of tasks, and check if updates are done successfully by
    the Bot. The same procedure can be followed to check to assure that the mainframe
    is updated.


    **Maintenance**


    This Bot has normal priority. If Bot fails or errored out, run the database script
    to reset the Bot and restart the Bot.


    **Bot Scheduling**


    Bot will run every day, Monday through Friday, at 11:00 in the morning.


    **Disaster Recovery**


    In case of complete failure of the Bot, the team will need to revert to the manual
    process:


    *   The operations team will perform the process manually, until notified that
    the issues have been resolved.

    *   The RPA team will be responsible for operational tracking, monitoring, and
    maintenance. In case of any temporary outages or planned downtime, the COE will
    communicate to business well in advance and expedite the restoration of services.

    *   Process owners are expected to systematically review and audit the results
    to ensure the functional value is achieved.

    *   Any changes to host systems will be proactively communicated to members of
    the RPA team far enough in advance to assure they can make any required adjustments.

    *   The process owner will receive notification emails for all failures.


    **Glossary of Terms**


    | **Term** | **Description** |

    | --- | --- |

    | **RPA** | **Robotics process automation** |

    | **SIT** | **System integration testing** |

    | **SLA** | **Service-level agreement** |

    | **SME** | **Subject matter expert** |

    | **UAT** | **User acceptance testing** |


    **Appendices**


    **Appendix A**: Exception messages


    *   `EmailMissingClientID`

    *   `EmailMissingFirstOrLastName`


    Let’s look at these components in detail.


    The cover page includes several components: name of document. This is the SDD,
    and it is necessary to specify what project it pertains to. The document author
    is the person responsible for creating the document. That may be the architect
    or designer, but it could also be another member of the team. The document version
    should indicate whether it is the first or a later draft, if it is final, and
    if it has been approved. Generally, draft versions start with 0 and are incremented
    as the draft is reviewed and updated: 0.1 is the initial draft, 0.2 would be a
    draft that has been updated, etc. The “Comments” column would be used to make
    any explanations. For example, Draft 0.2 might have a comment such as this: “Revised
    following review with Mary Brown, who requested that XYZ be altered.”


    Also on the cover page is the space for the approval. The Name/Role is the name
    and role of the person who is responsible for approving the document. That could
    be the product owner, business owner, delivery manager, or another role. The “Signature”
    would be electronic when the document is approved by the person specified.


    **Pause and Consider**


    Remember that versions (draft, final, etc.) and role names (product owner, business
    owner, etc.) differ from one company to another. Use the names that pertain to
    your organization.


    The “Purpose of This Document” provides a very short description of process automation
    overview. This is very helpful for understanding what the Bot is going to at a
    high level; additional detail is included in later parts of the document.


    The “Flow Diagram,” which was developed in the PDD, is included here, to provide
    developers with an “at-a-glance” understanding of the current manual process that
    they will be automating.


    The “Goal of the Automation” starts to drill down to state more specifically what
    the Bot will do.


    In “Applications Involved,” you will list which applications the automation is
    going to interact with. By identifying all applications, you can discover what
    kind of access the automation will need to interact with each of them.


    The developers need to know what the “Inputs” are. In our example, there is only
    one input (email from the client), but this is just a simple case study. Your
    “real-world” work may include more.


    While a very high-level description of the process has been provided, that is
    not something that the developers can build from. Now you need to list the individual
    “Process Steps” in detail. In our case study, there are four, simple sub-processes.
    As you can see, they are very specific and at a very low level.


    Any process is going to have exceptions. In our case study, that could be an email
    that doesn’t include the client ID, or the client ID may have too few or too many
    numbers; the new telephone number could be missing a number, etc. These “Exceptions”
    must be dealt with by the Bot, and this section explains how that will be done.


    The Bot has a beginning point and an endpoint, and it’s necessary to assure that
    anyone monitoring it, either in real time or periodically, knows that it has completed
    its work for each cycle (hourly, daily, etc., as specified). This “Success Criteria”
    must be defined. Will it be an email to a manager, sent by the Bot, to say that
    all emails in the specified mailbox on July 29, 20xx, have been processed? Will
    it be a notation on a larger report or dashboard? Whatever it is, this is the
    place to specify it.


    No application will ever run perfectly all the time. Because of that, the SDD
    should include some basic “Debugging Tips.” These are suggestions you can include
    to help developers in the future to resolve problems. Remember, the developer
    who initially develops the automation may not be available if problems arise with
    it at some future date.'
