- fmt: '### Deploying RPA Solutions


    Once the RPA solutions (Bots) have been deployed, there will need to be allocated
    resources who will monitor their execution and handle errors, fixes, and small
    enhancements in a timely manner. These resources will also manage the process
    execution schedule. In addition, the RPA management and support team will be accountable
    to maintain and advance the overall RPA ecosystem by monitoring and ensuring system
    health, maximizing runtime license utilization, introducing new automation capabilities,
    etc. Depending on the number of Bots deployed and the complexity of the RPA ecosystem,
    more than one person would be responsible for handling some of the above-mentioned
    functions. Also, it is beneficial to break down those high-level functions into
    smaller chunks in order to avoid overcomplicating things. Remember, the main goal
    of the tactical support is to maintain speed and agility and not to create excessive
    layers of bureaucracy.


    **Pause and Consider**


    The titles may differ from organization to organization. However, the titles are
    unimportant; the role descriptions discussed earlier are key. Who in your organization
    could perform these tasks? Are they familiar with RPA? Do they see value in it?


    ### Choosing a Deployment Model


    Before starting on an RPA path, an organization should decide if RPA initiatives
    will be led by in-house resources or be outsourced to an external third-party
    RPA provider. Also, an organization can choose a hybrid model that establishes
    a collaborative framework with an external provider and in-house resources. For
    instance, an external partner could focus on identification, development, and
    deployment of the solutions, and the in-house team will provide support and maintenance.


    Before choosing a suitable path, an organization must be clear on a few aspects:


    -   Are there enough processes for RPA to justify investments (ROI)?

    -   Is the organization committed to long-term investment in an RPA program?

    -   Does the organization have the in-house skills and capability to start an
    RPA program?

    -   Is RPA a part of the long-term, meaning five- to ten-year, strategy of digital
    transformation of its operations and IT infrastructure or ecosystem?


    Choosing the right path for an RPA program will make a huge difference between
    a successful RPA program and failure that leads to inadequate results and high
    cost. In all likelihood, this would cause withdrawal of the executive sponsorship
    and ultimately cut off financial investment in RPA.


    **Tip**


    Do not start an RPA initiative if these conditions are not met. Without these
    conditions, an RPA program has a much greater possibility of failure than success.


    ### Organizational Models for RPA


    The RPA program’s organizational model provides the structural framework for deploying
    RPA at the enterprise level. There are three models to consider^([⁷](#fn7)):


    **Centralized**


    This is typically designed as a Center of Excellence (COE; see Chapter [7](#513218_1_En_7_Chapter.xhtml)
    for more information about the COE) that is established within one executive office
    (business area) and manages the entire life cycle of the RPA program from developing
    standards, delivering RPA solutions from ideation to deployment, maintaining RPA
    infrastructure, and ensuring that adequate controls, risk management, and compliance
    are in place.


    **Hub and spoke or federated**


    The COE is established within one executive office and typically serves as a hub
    for decentralized spokes. In this case, the COE provides standard-setting, develops
    policy, provides training, and focuses on innovation and RPA program strategy.
    Spokes – RPA delivery teams – are primarily focused on developing and deploying
    RPA solutions to the business area they are assigned to or serve. This model requires
    close collaboration with the hub (COE) and spokes (RPA delivery teams).


    **Decentralized**


    Multiple individual RPA programs are established within an enterprise, with individual
    RPA frameworks operating under different executive branches or business units.
    This can be viewed as multiple sub-COE offices that are operating autonomously.


    The optimal organizational model will depend on an individual RPA program strategy,
    size of the serving population, business complexity, management culture, organization
    design, risk tolerance, and many other factors. In the following chapters, we
    will get more into details on benefits and suitability factors and approaches
    for implementing an effective operating model for your enterprise’s RPA program.
    Also, we will discuss how those models may change as the program becomes more
    mature.


    **Pause and Consider**


    Which style seems right for your organization? How will you determine which is
    best? Does your organization currently have a Center of Excellence? If so, how
    does it operate? Who do you need to speak with from the COE about RPA? If there
    is no COE in your organization, is there an interest in starting one?


    ### Development Methodologies for RPA


    There are multiple product development methodologies for digital products to choose
    from. Those methods define necessary steps, the decision-making process, communication,
    and actions needed to be executed by different stakeholders in order to successfully
    deliver a digital product – the RPA solution.


    The most common are:


    **Waterfall**


    This is a sequential framework where processes are executed in a liner manner
    and a product moves from one phase to another in a predefined or planned sequence.
    This method allows for high quality of product design, but its rigid structure
    does not allow a high degree of flexibility to change, and mistakes made at an
    earlier stage and discovered later can be very costly to resolve.


    **Agile**


    This methodology is widely adopted by software development companies, especially
    among start-ups and is centered around the idea of iterative development and delivery.
    This methodology allows teams to develop and release product features, enhancements,
    or changes frequently but in small segments. This allows for speed of value delivery
    to the customer and high adaptability or flexibility to changes in customer needs,
    and enables the quick identification of errors and mistakes.


    **Waterfall-Agile hybrid**


    This method is initially sequential and then turns into an iterative process through
    the development and delivery phases. This hybrid model creates a disciplined approach
    that allows the thorough investigation and understanding of customer needs and
    product specs prior to starting development and at the same time brings enough
    flexibility to iterate and adjust at the development and deployment phases.


    **Lean**


    This methodology relies on simple ideas like delivering the value defined from
    the customer’s perspective. It uses concepts of Lean originally established in
    the manufacturing industry. In software development, it defines the minimum viable
    product first and then, through iterative cycles, continuously increases its value
    either through adding new features or improving its quality.


    There is no concrete winner in this contest; it all depends on many factors, similar
    to those discussed earlier regarding selection of the appropriate operating model.
    It’s very important to understand the environment you are in and the benefits
    and potential pitfalls of each methodology, within that context.


    ### The Importance of Framework


    A well-structured framework is critical to the success of an RPA program. It can
    be modified over time as needs change or as deficiencies in the framework are
    identified, but starting with a solid framework to operate within will greatly
    contribute to success.


    **Pause and Consider**


    What might the framework look like in your area? What are some of the basic structural
    requirements (roles, etc.)? What roles could potentially serve on the governance
    team? What roles would be appropriate for the decision-making body regarding whether
    or not to move ahead with requests? What documentation should be included? How
    will reporting be done? These and other considerations must be answered as you
    embark on an RPA program.'
