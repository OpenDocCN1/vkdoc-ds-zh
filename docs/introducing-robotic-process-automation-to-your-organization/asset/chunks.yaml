- fmt: "# 5. Opportunity Assessment\n\nBusiness leaders must know that RPA cannot\
    \ automate every process. Hence, selecting appropriate processes to use RPA can\
    \ be a complicated task. Opportunity assessment’s goal is to help decision-makers\
    \ choose processes that will be suitable for RPA. Selecting processes that don’t\
    \ fit the criteria will cause unnecessary expenses and create a drag for the team\
    \ by consuming their resources on non-value-added activities. On the other hand,\
    \ processes that lend themselves to automation will utilize available technology\
    \ to its maximum potential and bring much higher return on investment.\n\n> **Tip**\
    \  \n> Keep in mind that RPA is a phased, iterative program. What may seem to\
    \ be a good fit for RPA at the “opportunity identification” stage does not mean\
    \ the request will be completed through to deployment.\n\nThe tasks within opportunity\
    \ assessment begin once the initial request for automation has been received and\
    \ understood. This is where the request is explored in some depth; a variety of\
    \ information is obtained and examined.\n\nSometimes an idea is submitted with\
    \ very little information; in those cases, the discovery phase described in Chapter\
    \ [4](#513218_1_En_4_Chapter.xhtml) is performed before opportunity assessment.\
    \ Please note that whether or not the discovery phase is implemented depends on\
    \ the amount of information received with the initial request.\n\nPlease note\
    \ also that a request introduces an RPA opportunity; that opportunity may or may\
    \ not become a project.\n\nAt the conclusion of the opportunity identification\
    \ (which may or may not include the discovery phase), the governing body, described\
    \ in Chapter [3](#513218_1_En_3_Chapter.xhtml), reviewed the documentation and\
    \ then met to discuss whether or not to move forward at this time with the request.\
    \ If a “Go” decision was made, the request is approved to move to the opportunity\
    \ assessment phase.\n\nThe following is the tollgate decision template (see Appendix\
    \ 7):\n\n“Go/No-Go/Wait” Tollgate Decision\n\n**Purpose:**  \nTo provide all key\
    \ stakeholders with an interactive opportunity to review the output of the opportunity\
    \ assessment due diligence efforts and to render a decision on the merits of the\
    \ RPA opportunity to proceed/not proceed or wait until specific conditions are\
    \ met.\n\n![../images/513218_1_En_5_Chapter/513218_1_En_5_Figb_HTML.gif](images/513218_1_En_5_Chapter/513218_1_En_5_Figb_HTML.gif)\n\
    \n**Details of the form:**\n\n- **Decision:** This is either “Go,” “No Go,” or\
    \ “Wait.” “Go” indicates that the governance body has determined that moving to\
    \ the next phases is beneficial; “No/Go” indicates that, for any of a variety\
    \ of reasons (e.g., insufficient ROI, complexity, etc.), the project will not\
    \ continue. “Wait” indicates that there is some additional information required\
    \ before a “Go” of “No Go” decision is made. That will be described in the next\
    \ column.\n- **Reason:** This explains why the decision was made and, in the case\
    \ of a “Wait” decision, what is lacking.\n- **Next Steps:** For a “Go” decision,\
    \ this would indicate the next phase. For a “No Go” decision, this would indicate\
    \ that the requestor is to be notified and who specifically will notify them.\n\
    \n> **Tip**  \n> Approval to proceed occurs several times throughout the life\
    \ cycle. Approval for opportunity assessment does not mean approval for deployment.\n\
    \nThroughout this chapter, we introduce the required concepts and provide real-world\
    \ examples to clarify them.\n\nAt this step, a high-level understanding of the\
    \ request is obtained. After some preliminary information is discovered, analyzed,\
    \ and documented, the team presents it to the Governance Committee with their\
    \ recommendation. We detail what should be considered as benefits, which will\
    \ include the potential return on investment (ROI), if the project is necessary\
    \ to meet some competitor’s initiative, if it will satisfy a new government regulation,\
    \ if it is required to enhance customer experience, or any of several other benefits.\n\
    \nAs noted, there are cases where, even from this initial view, it can be determined\
    \ that the request is not a good candidate for RPA, for any of a variety of reasons.\n\
    \nAt the conclusion of the phase, the Governance Committee will meet to determine\
    \ if the request should proceed to the next phase (solution design – see Chapter\
    \ [6](#513218_1_En_6_Chapter.xhtml)).\n\nThis decision will be based on many factors,\
    \ which include time/cost savings, competitive need, regulatory requirements,\
    \ improving quality, enhanced customer services, and other factors depending on\
    \ the request and the needs of your organization.\n\nIn this chapter, we discuss\
    \ the following artifacts that are produced in this phase (see the Appendix for\
    \ templates):\n\n- The opportunity overview, containing a summary of the current\
    \ situation, objective, desired state addressing what process steps are proposed\
    \ to be automated, and benefits estimations. At this point, only a high-level\
    \ estimate of costs and benefits is obtained.\n- An end-to-end, current-state\
    \ process map, as we discussed in Chapter [4](#513218_1_En_4_Chapter.xhtml), picturing\
    \ actual process flow and the level of detail required at this point (e.g., process\
    \ volumes, systems/applications involved, roles, etc.). If, when it is time for\
    \ the “go/no-go” decision, the project is approved to move forward, a more detailed,\
    \ and a future-state, process map will be required. But that will be discussed\
    \ in a later section. We also include a template for the process map.\n- A more\
    \ detailed explanation of each step within the process. A template for that is\
    \ also provided. This is not always necessary, and we will discuss how to determine\
    \ if it is.\n- A feasibility assessment.\n- A risk assessment."
  raw: '# 5. Opportunity Assessment


    Business leaders must know that RPA cannot automate every process. Hence, selecting
    appropriate processes to use RPA can be a complicated task. Opportunity assessment’s
    goal is to help decision-makers choose processes that will be suitable for RPA.
    Selecting processes that don’t fit the criteria will cause unnecessary expenses
    and create a drag for the team by consuming their resources on non-value-added
    activities. On the other hand, processes that lend themselves to automation will
    utilize available technology to its maximum potential and bring much higher return
    on investment.


    Tip


    Keep in mind that RPA is a phased, iterative program. What may seem to be a good
    fit for RPA at the “opportunity identification” stage does not mean the request
    will be completed through to deployment.


    The tasks within opportunity assessment begin once the initial request for automation
    has been received and understood. This is where the request is explored in some
    depth; a variety of information is obtained and examined.


    Sometimes an idea is submitted with very little information; in those cases, the
    discovery phase described in Chapter [4](#513218_1_En_4_Chapter.xhtml) is performed
    before opportunity assessment. Please note that whether or not the discovery phase
    is implemented depends on the amount of information received with the initial
    request.


    Please note also that a request introduces an RPA opportunity; that opportunity
    may or may not become a project.


    At the conclusion of the opportunity identification (which may or may not include
    the discovery phase), the governing body, described in Chapter [3](#513218_1_En_3_Chapter.xhtml),
    reviewed the documentation and then met to discuss whether or not to move forward
    at this time with the request. If a “Go” decision was made, the request is approved
    to move to the opportunity assessment phase.


    The following is the tollgate decision template (see Appendix 7):


    “Go/No-Go/Wait” Tollgate Decision


    Purpose:


    To provide all key stakeholders with an interactive opportunity to review the
    output of the opportunity assessment due diligence efforts and to render a decision
    on the merits of the RPA opportunity to proceed/not proceed or wait until specific
    conditions are met.


    ![../images/513218_1_En_5_Chapter/513218_1_En_5_Figb_HTML.gif](images/513218_1_En_5_Chapter/513218_1_En_5_Figb_HTML.gif)


    Details of the form:


    *   Decision: This is either “Go,” “No Go,” or “Wait.” “Go” indicates that the
    governance body has determined that moving to the next phases is beneficial; “No/Go”
    indicates that, for any of a variety of reasons (e.g., insufficient ROI, complexity,
    etc.), the project will not continue. “Wait” indicates that there is some additional
    information required before a “Go” of “No Go” decision is made. That will be described
    in the next column.


    *   Reason: This explains why the decision was made and, in the case of a “Wait”
    decision, what is lacking.


    *   Next Steps: For a “Go” decision, this would indicate the next phase. For a
    “No Go” decision, this would indicate that the requestor is to be notified and
    who specifically will notify them.


    Tip


    Approval to proceed occurs several times throughout the life cycle. Approval for
    opportunity assessment does not mean approval for deployment.


    Throughout this chapter, we introduce the required concepts and provide real-world
    examples to clarify them.


    At this step, a high-level understanding of the request is obtained. After some
    preliminary information is discovered, analyzed, and documented, the team presents
    it to the Governance Committee with their recommendation. We detail what should
    be considered as benefits, which will include the potential return on investment
    (ROI), if the project is necessary to meet some competitor’s initiative, if it
    will satisfy a new government regulation, if it is required to enhance customer
    experience, or any of several other benefits.


    As noted, there are cases where, even from this initial view, it can be determined
    that the request is not a good candidate for RPA, for any of a variety of reasons.


    At the conclusion of the phase, the Governance Committee will meet to determine
    if the request should proceed to the next phase (solution design – see Chapter
    [6](#513218_1_En_6_Chapter.xhtml)).


    This decision will be based on many factors, which include time/cost savings,
    competitive need, regulatory requirements, improving quality, enhanced customer
    services, and other factors depending on the request and the needs of your organization.


    In this chapter, we discuss the following artifacts that are produced in this
    phase (see the Appendix for templates):


    *   The opportunity overview, containing a summary of the current situation, objective,
    desired state addressing what process steps are proposed to be automated, and
    benefits estimations. At this point, only a high-level estimate of costs and benefits
    is obtained.


    *   An end-to-end, current-state process map, as we discussed in Chapter [4](#513218_1_En_4_Chapter.xhtml),
    picturing actual process flow and the level of detail required at this point (e.g.,
    process volumes, systems/applications involved, roles, etc.). If, when it is time
    for the “go/no-go” decision, the project is approved to move forward, a more detailed,
    and a future-state, process map will be required. But that will be discussed in
    a later section. We also include a template for the process map.


    *   A more detailed explanation of each step within the process. A template for
    that is also provided. This is not always necessary, and we will discuss how to
    determine if it is.


    *   A feasibility assessment.


    *   A risk assessment.'
  trans: "\n# 5. 机会评估\n\n企业领导者必须认识到，RPA 无法实现所有流程的自动化。因此，选择合适的流程来应用 RPA 可能是一项复杂的任务。机会评估的目标是帮助决策者挑选出适合\
    \ RPA 的流程。选择不符合标准的流程将导致不必要的开支，并因将团队资源消耗在无增值活动上而拖累团队。另一方面，适合自动化的流程能最大限度地发挥现有技术的潜力，并带来更高的投资回报率。\n\
    \n> **提示**  \n> 请记住，RPA 是一个分阶段、迭代式的项目。在“机会识别”阶段看似适合 RPA 的请求，并不意味着该请求一定能顺利推进到部署阶段。\n\
    \n一旦收到并理解了最初的自动化请求，机会评估阶段内的任务就开始了。正是在这个阶段，会对该请求进行一定深度的探索，获取并审查各种信息。\n\n有时提交的想法所附带的信息非常少；在这种情况下，会在机会评估之前执行第\
    \ 4 章所述的发现阶段。请注意，是否执行发现阶段取决于初始请求所附带的信息量。\n\n同时请注意，一个请求引入了一个 RPA 机会；这个机会可能会也可能不会成为一个项目。\n\
    \n在机会识别（可能包含也可能不包含发现阶段）结束时，第 3 章所述的管理机构会审查相关文档，然后开会讨论是否在当前时间点推进该请求。如果做出“批准”决定，则该请求被批准进入机会评估阶段。\n\
    \n以下是关卡决策模板（见附录 7）：\n\n“批准/驳回/暂缓”关卡决策\n\n**目的：**  \n为所有关键利益相关者提供一个互动机会，以审查机会评估尽职调查工作的成果，并根据\
    \ RPA 机会的优缺点做出“推进/不推进”或“等待特定条件满足后再决定”的决策。\n\n![../images/513218_1_En_5_Chapter/513218_1_En_5_Figb_HTML.gif](img/513218_1_En_5_Figb_HTML.gif)\n\
    \n**表格详情：**\n\n- **决策：** 可以是“批准”、“驳回”或“暂缓”。“批准”表示治理机构认为进入下一阶段是有益的；“驳回”表示由于各种原因（例如，投资回报率不足、复杂性过高等），项目将不会继续；“暂缓”表示在做出“批准”或“驳回”决策之前，还需要一些额外的信息。这将在下一列中描述。\n\
    - **理由：** 说明做出该决策的原因，如果是“暂缓”决策，则说明缺少什么信息。\n- **下一步行动：** 对于“批准”决策，此处指明下一阶段；对于“驳回”决策，此处指明需通知请求方以及具体由谁负责通知。\n\
    \n> **提示**  \n> 在整个生命周期中，会多次获得推进的批准。机会评估的批准并不意味着部署的批准。\n\n在本章中，我们将介绍所需的概念，并提供现实世界的示例来加以阐明。\n\
    \n在此步骤中，会获得对请求的高层次理解。在发现、分析并记录了一些初步信息后，团队会将其连同建议一同提交给治理委员会。我们将详细说明哪些应被视为收益，包括潜在的投资回报率（ROI）、该项目是否为应对竞争对手的举措所必需、是否将满足新的政府法规、是否为提升客户体验所需，或其他诸多收益。\n\
    \n如前所述，在某些情况下，即使从这一初步评估来看，也可能因各种原因确定该请求并非 RPA 的良好候选对象。\n\n在此阶段结束时，治理委员会将开会决定该请求是否应进入下一阶段（解决方案设计——见第\
    \ 6 章）。\n\n该决策将基于多种因素，包括节省时间/成本、竞争需求、监管要求、提高质量、增强客户服务，以及根据请求和组织需求而定的其他因素。\n\n\
    在本章中，我们将讨论在此阶段产生的以下工件（模板见附录）：\n\n- **机会概览**，包含当前情况摘要、目标、期望状态（说明建议自动化的流程步骤）以及收益估算。此时，仅获得成本与收益的高层次估算。\n\
    - **端到端的当前状态流程图**，如我们在第 4 章中所讨论的，描绘了实际的流程流以及当前所需的详细程度（例如，流程量、涉及的系统/应用程序、角色等）。如果在“批准/驳回”决策时点，项目被批准推进，则需要更详细的和未来状态的流程图。但这将在后续章节中讨论。我们还提供了一个流程图的模板。\n\
    - **流程中每个步骤的更详细说明**。也提供了相应的模板。这并非总是必要的，我们将讨论如何判断是否需要。\n- **可行性评估**。\n- **风险评估**。\n"
- fmt: '# Opportunity Overview


    A major component of the opportunity assessment is the opportunity overview. This
    is an at-a-glance view of the request, which includes such information as an overview
    of the need, desired solution state, and the estimated benefits of automation
    (e.g., ROI, benefits could be qualitative and/or quantitative), which can be financial,
    or might include maintaining a competitive edge, satisfying legal requirements,
    or several other factors. Much of the information contained therein is extracted
    from the request form and can be obtained during discovery. Please see Appendix
    6 for a template.


    In other words, the opportunity overview is an executive summary that provides
    the Governance Committee members with a thorough, but high-level, overview of
    the opportunity, the possible solution, and its complexity, risks, and benefits.


    **Tip**


    Always remember that the templates included can be tailored to meet the needs
    of your organization.


    These are components and details of a typical opportunity overview:


    - **Name of project**: Self-explanatory. Remember, this request is not yet a project,
    but this is the title that will be given to the work which may result in a project
    of this name.


    - **Prepared by**: This is generally the business process analyst and any subject
    matter experts (SME(s)) who might be involved, along with their titles and departments.


    - **Opportunity description**: Information from the “current process description”
    on the request form is the basis for this. In the opportunity overview, the information
    is refined from the basic notes on the request form to make a more coherent description
    of the current situation and the problem as it now exists.


    - **Opportunity statement**: This should be short; a sentence should suffice.
    Here, a concise summary of the problem is stated. For example, “The current process
    manually performed results in unacceptable delays and repeated, time-consuming
    rework due to errors.”


    - **Objective**: Write what the requestor wants accomplished in simple language;
    this should be a general description of what the Bot should do. Express in your
    own words what you want it to do. For example, “Bot will scan orders and produce
    invoices with customer address included…” or “Bot will read customer email and
    extract information to make required updates in the systems.”


    - **Assumptions and constraints**: In this section, briefly include anything that
    is believed to be true and is pertinent to the project. For example, “Assumption:
    System 123 and System ABC are able to communicate.” For constraints, list anything
    you think may prevent the easy build of the Bot. For example “Currently, there
    is no way for accounts ending in L to be read by system XYZ.” Further explanation
    is not required here.


    - **Current state**: The process map, at a sufficient level to show the steps
    to be automated, is placed here. Please see Appendix 2 for a template.


    - **Operational benefits estimation**: Some preliminary benefits were listed on
    the request form, but more specific information is detailed in this phase. It
    should clearly, but without great detail, show the advantage(s) of the requested
    automation. Is the savings (ROI) sufficient to justify the cost of automation?
    Are there important competitive or regulatory issues that the requested automation
    will address? These considerations must be included.


    - **Proposed solution/process change**: Note here exactly what is to be automated.
    For example, “Automate Steps 3–7 on the previously referenced process map.” It
    could also be descriptive; for example, “Automate the identification of accounts
    over 90 days past due, the sending of notices, and notification to the account
    rep. that the past-due letter has been sent.”


    **Pause and Consider**


    An opportunity overview is a high-level assessment of the request to automate
    a process. Management, who will review the opportunity overview and make a decision
    about the request, does not need or want the same level of information that the
    analysts, developers, testers, etc., will need. Adding extra information may seem
    like a good way to “cover all bases” but restricting the opportunity overview
    to just the minimum facts required to make a decision will serve much better.


    ## Current-State Process Map


    Automating a process means using the existing process steps and simply changing
    them from manual to automatic performance (note: in some cases, it may be necessary
    to optimize the process prior to automation). In order for the Governance Committee
    to make a decision on automating a process, and for developers to create the solution,
    the process must be understood. The current-state process map is one of the main
    tools by which this is done.


    At this stage, the map should be fairly high level; it isn’t necessary to state,
    for example:


    - “Access screen X; find the ‘account number’ drop-down; hit the drop-down button;
    select ‘individual insurance’; click ok; enter customer last name; click ok; enter
    customer first name; etc.”


    - The step could simply say “find customer account number.” The details of the
    steps will be defined, probably by video recording someone actually performing
    the steps in the process, at a later stage in the project. What is required now
    is a solid understanding of the end-to-end process at a high level.'
