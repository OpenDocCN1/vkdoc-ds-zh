- fmt: '# Process Mining


    We have emphasized throughout this book that RPA is for repeated processes which
    have simple logic and don’t need much intelligence or human intervention. This
    is because with most processes, there are security concerns and concerns about
    accuracy. The process has to be simple enough that security and accuracy standards
    are not compromised. In our experience, processes are introduced to us by business
    leaders who want to streamline their operations and improve efficiency. So they
    may identify one or two processes that they know are extremely repetitive and
    would appear to be good candidates for automation. But often these are processes
    which for some reason are getting some attention; perhaps the people performing
    the process are voicing discontent because, we’ll just say it, doing this kind
    of repetitive work can be boring!


    There may be several other processes within the business unit that are just as
    repetitive, but perhaps they aren’t coming to the notice of management at the
    moment. Perhaps they are month-end or year-end, rather than daily, processes.
    Perhaps they are only needed occasionally to clean up some kind of backlog of
    requests. Regardless of the reason, they may be excellent candidates for automation,
    but are not currently identified as such by management.


    Process mining tools have been designed to analyze processes, and using built-in
    logic, identify and help determine which are the best candidates for automation.
    The business provides as many processes as possible, not just those that are the
    “squeaky wheel” processes, and enters them into the process mining tool, and the
    tool will identify the best automation candidates.


    At a simpler level, with smaller organizations or simpler processes, process mining
    tools can also assist as a starting point for identifying automation candidates.
    The tool can highlight significant business functions and their accompanying processes.


    Another area where process mining tools can be highly beneficial is in the meeting
    points between processes. Process mining tools can assist in determining where
    those intersection points can be automated.


    [Thomas H. Davenport](https://hbr.org/search%253Fterm%253Dthomas%2520h.%2520davenport)
    and [Andrew Spanyi](https://hbr.org/search%253Fterm%253Dandrew%2520spanyi), writing
    in the *Harvard Business Review*, sum up the advantages of process mining succinctly:


    > *Process mining software can help organizations easily capture information from
    enterprise transaction systems and provides detailed — and data-driven — information
    about how key processes are performing. It creates event logs as work is done:
    an order is received, a product is delivered, a payment is made. The logs make
    visible how computer-mediated work is really happening, including who did it,
    how long it takes, and how it departs from the average. Process analytics create
    key performance indicators for the process, which enables a company to focus on
    the priority steps to improve*. ^([^(34)](#fn34))


    Remember, due diligence is still required; the tool is only as good as its input,
    and the automation decision must still be made by a human resource.


    Once processes are selected by the process mining tool, all the phases from “opportunity
    assessment” shown in this book would be followed, including periodic meetings
    with the Governance Committee to approve or disapprove moving to the next step.


    **Pause and Consider**


    For larger organizations with highly complex processes, process mining can greatly
    expedite the identification of potential automation candidates. Would this be
    beneficial in your organization? Who would you need to speak with to better understand
    the potential benefits of process mining to your organization?


    # Intelligent Processing


    Currently in RPA, we build the logic and simple rules for converting the manual
    steps into automation. Intelligent processing can be viewed as “a way to process
    unstructured textual data. Document cognition leverages artificial intelligence,
    machine learning, cognitive science, and natural language processing to index
    structured, semi-structured, and unstructured data.”^([^(35)](#fn35))


    With intelligent processing, we are building IQ Bots. Using artificial intelligence
    and machine learning, along with RPA techniques, we are adding intelligence to
    the rules when building Bots. One example is identifying handwritten text in documents;
    currently, information input to a Bot with handwritten information will be diverted
    for manual handling; the Bot cannot read handwriting. AI techniques can assist
    in reading this kind of text and have a percent of accuracy that can be calibrated
    so the performance of the Bot can be increased. As with any process that is partially
    automated, anything the Bot cannot read and/or understand can be diverted to manual
    processing.


    Writing in *Capacity*, Joe Sullivan listed seven benefits of intelligent document
    processing.^([^(36)](#fn36)) He said the IDP


    1.  Promotes automation because it facilitates process improvement


    2.  Simplifies compliance by sorting documents, data entry, and information validation


    3.  Is effective, because it reduces manual intervention in document-centric workflows


    4.  Supports scalability, because it can be applied to various applications in
    different areas in your organization


    5.  Attracts savings by reducing the duration it takes to process documents and
    reduce the cost of labor


    6.  Increases speed by processing large volumes of data in a very short amount
    of time


    7.  Enhances customer experience and satisfaction by greatly reducing the time
    it takes to process paperwork


    **Tip**


    As Sullivan mentions in his article,^([^(37)](#fn37)) some management teams tend
    to overlook the soft costs related to customer experience. Don’t make that mistake!
    Just because you may not be able to quantify customer experience in terms of dollars
    and cents, any organization must remain laser focused on customer experience if
    it wants to succeed in today’s market.'
  raw: '## Process Mining


    We have emphasized throughout this book that RPA is for repeated processes which
    have simple logic and don’t need much intelligence or human intervention. This
    is because with most processes, there are security concerns and concerns about
    accuracy. The process has to be simple enough that security and accuracy standards
    are not compromised. In our experience, processes are introduced to us by business
    leaders who want to streamline their operations and improve efficiency. So they
    may identify one or two processes that they know are extremely repetitive and
    would appear to be good candidates for automation. But often these are processes
    which for some reason are getting some attention; perhaps the people performing
    the process are voicing discontent because, we’ll just say it, doing this kind
    of repetitive work can be boring!


    There may be several other processes within the business unit that are just as
    repetitive, but perhaps they aren’t coming to the notice of management at the
    moment. Perhaps they are month-end or year-end, rather than daily, processes.
    Perhaps they are only needed occasionally to clean up some kind of backlog of
    requests. Regardless of the reason, they may be excellent candidates for automation,
    but are not currently identified as such by management.


