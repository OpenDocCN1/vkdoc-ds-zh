- fmt: "# 1. Instructions and Documentation for Deployment\n\nAs indicated by the\
    \ paragraph and lists earlier, there is a lot to do to ensure a smooth and successful\
    \ deployment. In order to accomplish this, there need to be detailed instructions\
    \ documented for the specific deployment. While the items in the bullet list mentioned\
    \ previously must all be achieved, each automation will have tasks specific to\
    \ it. These include preparing a transition to production form and sharing it with\
    \ `COE` if there is one or with the pertinent members of the technical team if\
    \ there isn’t. Please refer to transition to deployment form.\n\n# 2. Release\
    \ Options (Pilot Release)\n\nWhen the automation or the Bot is large and complex\
    \ in nature, and is business critical, then you can choose to deploy the Bot in\
    \ a constrained manner instead of going full live. There are many options that\
    \ can be tried or adapted. This technique is also called pilot release.\n\nThere\
    \ are various pilot release options. These include:\n\n- **Single Bot only**:\
    \ If the Bot has to release with multiple Bots, for pilot release, the Bot can\
    \ be single so that if errors occur, they can be handled properly. Sometimes if\
    \ the full release of the Bot is single, then restricted mode can be adopted.\n\
    - **Restricted mode**: In restricted mode, very light work is assigned to the\
    \ Bot in the first few days, and performance is watched.\n- **Ghost mode**: When\
    \ the work done by the Bot is visible to end users or has a big impact on the\
    \ business (e.g., there are dependent services on the work or updates done by\
    \ the Bot), it is preferable for it to be validated prior to being delivered to\
    \ the end user during the warranty period (more about warranties later). This\
    \ can be done by diverting the output to some other area of the system or another\
    \ environment (email to a member of the technical team, creation of a report,\
    \ etc.). If the outcome is what is expected, the Bot is rerun in the production\
    \ system but not in ghost mode.\n\nThere are no hard and fast rules; it all depends\
    \ upon the situation and how the outcome of the Bot is to be captured. All these\
    \ factors must be considered prior to a pilot release so they can be effectively\
    \ managed.\n\n# 3. Negotiate Deployment/Release Dates with the Business\n\nOften,\
    \ the person requesting the automation wants it yesterday! During the initial\
    \ discussions (see Chapters [4](#513218_1_En_4_Chapter.xhtml) and [5](#513218_1_En_5_Chapter.xhtml)),\
    \ you and the business owner and SMEs have come to a mutual understanding about\
    \ a realistic date. This is seldom one specific date and is more likely a range\
    \ of dates. For example, the business, in conjunction with the development team,\
    \ decides that a reasonable date for deployment is between May 15 and June 8,\
    \ 20xx.\n\nThis information would have been conveyed early on to the `COE`, if\
    \ your organization has one. If not, your regular contacts with the business and\
    \ with people responsible for the systems and applications you must impact would\
    \ have been kept informed about the date range, assuring with them that it was\
    \ reasonable.\n\nNow it is time to finalize the dates with the business. You have\
    \ far more information now than you did in earlier phases. You know the upstream\
    \ and downstream systems and applications to be impacted. You know what needs\
    \ to be done for deployment, and now you can use this information to nail down\
    \ a specific date with the business owner.\n\nIf your organization has a `COE`,\
    \ that group has been a third partner with the technical team and the business\
    \ and now must be included in determining the release date. The `COE` would have\
    \ been advised of the range acceptable to the business and technical team as early\
    \ as it was known. If, at that time, the `COE` said that no date within that range\
    \ was possible, you would have gone back to the business to renegotiate. Now it\
    \ is time to work with the `COE` and the business to determine the date of deployment.\n\
    \n# 4. Warranty\n\nWhen the organization has a `COE`, the warranty time is provided\
    \ by the `COE` after deploying the Bot in production. In organizations without\
    \ a `COE`, the warranty is handled by the technical team. Usually, the warranty\
    \ is set for two weeks, but the dates of the warranty period are flexible. For\
    \ very simple Bots, it could be only for one week, but decreasing the warranty\
    \ period is the decision of the business and technical teams. Similarly, for very\
    \ complex Bots, the warranty can also be increased to three to four weeks. Again,\
    \ increasing the warranty is not something that happens very frequently, but is\
    \ agreed to among the business, technical team, and `COE` (if there is one). This\
    \ depends partly upon the resources required to provide service during the extra\
    \ period and their availability.\n\nIt is also advised that in these situations,\
    \ if there is a `COE`, it should be made aware of the extension as early as possible,\
    \ so that they have sufficient time to be prepared.\n\n- If your organization\
    \ has a `COE`, determine the specific person or people from the `COE` who will\
    \ be present during deployment. This should not be at all difficult to determine,\
    \ because if you do have a `COE`, you have been interacting with that group from\
    \ early in the process.\n- Validate that all project and/or folder structures\
    \ are consistent with all guidelines on production automation tool being used.\n\
    - Assure that all applications and systems are accessible from the production\
    \ environment (`URL`, network, etc.) by the Bot user ID and any other user ID\
    \ used for the application itself.\n- Ensure that the infrastructure is capable\
    \ of adding new automation and Bots according to the schedule.\n- What are the\
    \ risks? At this point, all identified risks must have a mitigation plan, with\
    \ a role assigned to it. The mitigation plan may be simply accepting the risk,\
    \ but there needs to be a role assigned, so that if that risk event happens, that\
    \ person can be contacted to see how they want to handle it.\n- Another piece\
    \ of information is the scheduling of the Bot. How many times will the automation\
    \ run each day, week, month, or even year? Or will it be \"on demand\"? This information\
    \ was determined early on, when the purpose of the request to automate was initially\
    \ received.\n- The volume of work that the Bot is expected to handle is also vital.\
    \ If the work is stable and doesn’t change the period of time that the Bot will\
    \ run, it will be simpler, but if volume may change significantly from run to\
    \ run and there is no information or pattern or historical data about the work,\
    \ then this must be carefully documented. Having historical information (e.g.,\
    \ the volume is usually doubled during the first three days of the month) will\
    \ greatly assist in deploying a successful Bot.\n- It is necessary to verify the\
    \ access to be used by the Bot in production; this includes the environment, user\
    \ IDs, application access, and network access.\n- Verify that the emails are correct\
    \ for communication. For example, if the Bot is to send those exceptions (situations\
    \ that enter the process that, for any of a variety of pre-identified reasons,\
    \ cannot be handled by the Bot) to a specific email, assure that the address is\
    \ correct.\n- If the Bot is an update or enhancement to an existing automation,\
    \ you must plan for disaster recovery. In the event that something goes wrong\
    \ with the update or enhancement, you need to be able to quickly return to the\
    \ Bot prior to the update or enhancement, so at least the work that had been processed\
    \ can continue to be.\n- Any software version has three parts:\n  - **Release\
    \ number** (sometimes referred to as \"major version number\"): For a new automation,\
    \ the release number will be one (1). Release or major version numbers also change\
    \ whenever there is some significant change being introduced. For example, a large\
    \ or potentially backward-incompatible change to a software package."
  raw: "1.  Instructions and documentation for deployment: As indicated by the paragraph\
    \ and lists earlier, there is a lot to do to ensure a smooth and successful deployment.\
    \ In order to accomplish this, there need to be detailed instructions documented\
    \ for the specific deployment. While the items in the bullet list mentioned previously\
    \ must all be achieved, each automation will have tasks specific to it. These\
    \ include preparing a transition to production form and sharing it with COE if\
    \ there is one or with the pertinent members of the technical team if there isn’t.\
    \ Please refer to transition to deployment form.\n\n2.  Release options (pilot\
    \ release): When the automation or the Bot is large and complex in nature, and\
    \ is business critical, then you can choose to deploy the Bot in a constrained\
    \ manner instead of going full live. There are many options that can be tried\
    \ or adapted. This technique is also called pilot release.\n\nThere are various\
    \ pilot release options. These include\n\n– Single Bot only: If the Bot has to\
    \ release with multiple Bots, for pilot release, the Bot can be single so that\
    \ if errors occur, they can be handled properly. Sometimes if the full release\
    \ of the Bot is single, then restricted mode can be adopted.\n\n– Restricted mode:\
    \ In restricted mode, very light work is assigned to the Bot in the first few\
    \ days, and performance is watched.\n\n– Ghost mode: When the work done by the\
    \ Bot is visible to end users or has a big impact on the business (e.g., there\
    \ are dependent services on the work or updates done by the Bot), it is preferable\
    \ for it to be validated prior to being delivered to the end user during the warranty\
    \ period (more about warranties later). This can be done by diverting the output\
    \ to some other area of the system or another environment (email to a member of\
    \ the technical team, creation of a report, etc.). If the outcome is what is expected,\
    \ the Bot is rerun in the production system but not in ghost mode.\n\nThere are\
    \ no hard and fast rules; it all depends upon the situation and how the outcome\
    \ of the Bot is to be captured. All these factors must be considered prior to\
    \ a pilot release so they can be effectively managed.\n\n3.  Negotiate deployment/release\
    \ dates with the business: Often, the person requesting the automation wants it\
    \ yesterday! During the initial discussions (see Chapters [4](#513218_1_En_4_Chapter.xhtml)\
    \ and [5](#513218_1_En_5_Chapter.xhtml)), you and the business owner and SMEs\
    \ have come to a mutual understanding about a realistic date. This is seldom one\
    \ specific date and is more likely a range of dates. For example, the business,\
    \ in conjunction with the development team, decides that a reasonable date for\
    \ deployment is between May 15 and June 8, 20xx.\n\nThis information would have\
    \ been conveyed early on to the COE, if your organization has one. If not, your\
    \ regular contacts with the business and with people responsible for the systems\
    \ and applications you must impact would have been kept informed about the date\
    \ range, assuring with them that it was reasonable.\n\nNow it is time to finalize\
    \ the dates with the business. You have far more information now than you did\
    \ in earlier phases. You know the upstream and downstream systems and applications\
    \ to be impacted. You know what needs to be done for deployment, and now you can\
    \ use this information to nail down a specific date with the business owner.\n\
    \nIf your organization has a COE, that group has been a third partner with the\
    \ technical team and the business and now must be included in determining the\
    \ release date. The COE would have been advised of the range acceptable to the\
    \ business and technical team as early as it was known. If, at that time, the\
    \ COE said that no date within that range was possible, you would have gone back\
    \ to the business to renegotiate. Now it is time to work with the COE and the\
    \ business to determine the date of deployment.\n\n4.  Warranty: When the organization\
    \ has a COE, the warranty time is provided by the COE after deploying the Bot\
    \ in production. In organizations without a COE, the warranty is handled by the\
    \ technical team. Usually, the warranty is set for two weeks, but the dates of\
    \ the warranty period are flexible. For very simple Bots, it could be only for\
    \ one week, but decreasing the warranty period is the decision of the business\
    \ and technical teams. Similarly, for very complex Bots, the warranty can also\
    \ be increased to three to four weeks. Again, increasing the warranty is not something\
    \ that happens very frequently, but is agreed to among the business, technical\
    \ team, and COE (if there is one). This depends partly upon the resources required\
    \ to provide service during the extra period and their availability.\n\nIt is\
    \ also advised that in these situations, if there is a COE, it should be made\
    \ aware of the extension as early as possible, so that they have sufficient time\
    \ to be prepared.\n\n*   If your organization has a COE, determine the specific\
    \ person or people from the COE who will be present during deployment. This should\
    \ not be at all difficult to determine, because if you do have a COE, you have\
    \ been interacting with that group from early in the process.\n\n*   Validate\
    \ that all project and/or folder structures are consistent with all guidelines\
    \ on production automation tool being used.\n\n*   Assure that all applications\
    \ and systems are accessible from the production environment (URL, network, etc.)\
    \ by the Bot user ID and any other user ID used for the application itself.\n\n\
    *   Ensure that the infrastructure is capable of adding new automation and Bots\
    \ according to the schedule.\n\n*   What are the risks? At this point, all identified\
    \ risks must have a mitigation plan, with a role assigned to it. The mitigation\
    \ plan may be simply accepting the risk, but there needs to be a role assigned,\
    \ so that if that risk event happens, that person can be contacted to see how\
    \ they want to handle it.\n\n*   Another piece of information is the scheduling\
    \ of the Bot. How many times will the automation run each day, week, month, or\
    \ even year? Or will it be “on demand”? This information was determined early\
    \ on, when the purpose of the request to automate was initially received.\n\n\
    *   The volume of work that the Bot is expected to handle is also vital. If the\
    \ work is stable and doesn’t change the period of time that the Bot will run,\
    \ it will be simpler, but if volume may change significantly from run to run and\
    \ there is no information or pattern or historical data about the work, then this\
    \ must be carefully documented. Having historical information (e.g., the volume\
    \ is usually doubled during the first three days of the month) will greatly assist\
    \ in deploying a successful Bot.\n\n*   It is necessary to verify the access to\
    \ be used by the Bot in production; this includes the environment, user IDs, application\
    \ access, and network access.\n\n*   Verify that the emails are correct for communication.\
    \ For example, if the Bot is to send those exceptions (situations that enter the\
    \ process that, for any of a variety of pre-identified reasons, cannot be handled\
    \ by the Bot) to a specific email, assure that the address is correct.\n\n*  \
    \ If the Bot is an update or enhancement to an existing automation, you must plan\
    \ for disaster recovery. In the event that something goes wrong with the update\
    \ or enhancement, you need to be able to quickly return to the Bot prior to the\
    \ update or enhancement, so at least the work that had been processed can continue\
    \ to be.\n\n*   Any software version has three parts:\n    *   Release number\
    \ (sometimes referred to as “major version number”): For a new automation, the\
    \ release number will be one (1). Release or major version numbers also change\
    \ whenever there is some significant change being introduced. For example, a large\
    \ or potentially backward-incompatible change to a software package."
  trans: "\n# 1. 部署说明与文档\n\n如前文段落和列表所述，为确保部署顺利成功，需要完成大量工作。为此，必须针对具体部署记录详细的说明文档。尽管上文项目符号列表中列出的所有事项均需完成，但每个自动化项目都有其专属任务。这些任务包括：准备过渡到生产环境的表格，并将其分享给`COE`（如有），或分享给技术团队的相关成员（如无`COE`）。请参考\"\
    过渡到部署\"表格。\n\n# 2. 发布选项（试点发布）\n\n当自动化流程或机器人规模庞大、性质复杂且对业务至关重要时，可以选择以受限方式部署机器人，而非全面上线。有多种方案可供尝试或调整，这种技术也称为试点发布。\n\
    \n试点发布有多种选择，包括：\n\n- **单机器人模式**：若需与多个机器人同时发布，试点阶段可仅发布单个机器人，以便在出现错误时妥善处理。有时若机器人全面发布本身即为单一模式，则可采用受限模式。\n\
    - **受限模式**：在该模式下，前几日分配给机器人的工作量较轻，并持续监控其运行表现。\n- **幽灵模式**：当机器人完成的工作对最终用户可见，或对业务产生重大影响时（例如，存在依赖机器人工作或更新的服务），最好在保修期（后文详述）内向最终用户交付前进行验证。这可通过将输出重定向至系统的其他区域或另一环境（如向技术团队成员发送邮件、生成报告等）来实现。若输出结果符合预期，则可在生产系统中重新运行机器人（但不处于幽灵模式）。\n\
    \n没有硬性规定，完全取决于具体情况以及如何捕获机器人的输出结果。在试点发布前必须综合考虑所有这些因素，以便有效管理。\n\n# 3. 与业务部门协商部署/发布日期\n\
    \n通常，提出自动化需求的人都希望能尽快实现！在初期讨论阶段（参见第 4 章和第 5 章），您与业务负责人及主题专家已就合理日期达成共识。这往往不是一个具体日期，而是一个日期范围。例如，业务部门与开发团队共同商定，合理的部署日期定在\
    \ 20xx 年 5 月 15 日至 6 月 8 日之间。\n\n若您的组织设有`COE`，此信息应已尽早传达给他们。若无`COE`，则应与业务部门以及您需要影响的系统和应用程序负责人保持定期沟通，告知他们该日期范围，并确认其合理性。\n\
    \n现在是与业务部门最终敲定日期的时候了。相比前期阶段，您现在掌握了更多信息。您已了解需要影响的上游和下游系统及应用程序，清楚部署需要完成哪些工作，并可根据这些信息与业务负责人确定具体日期。\n\
    \n如果您的组织设有`COE`，该团队一直是技术团队和业务部门的第三方合作伙伴，现在必须将其纳入发布日期的决策过程。`COE`应在得知业务部门和技术团队可接受的范围后尽早收到通知。若当时`COE`表示该范围内无可行日期，您需反馈给业务部门重新协商。现在则是与`COE`及业务部门共同确定部署日期。\n\
    \n# 4. 保修期\n\n当组织设有`COE`时，机器人在生产环境部署后，保修期由`COE`提供。在无`COE`的组织中，保修期由技术团队负责。通常保修期设定为两周，但期限灵活。对于非常简单的机器人，可能仅需一周，但缩短保修期需由业务部门和技术团队共同决定。同样，对于极为复杂的机器人，保修期可延长至三到四周。不过，延长保修期的情况并不常见，需由业务部门、技术团队和`COE`（若有）共同商定。这在一定程度上取决于额外期间提供支持所需的资源及其可用性。\n\
    \n还建议在此类情况下，若有`COE`，应尽早告知其延期事宜，以便他们有充足时间做好准备。\n\n- 若您的组织设有`COE`，需确定在部署期间由`COE`派驻的具体人员。这应该不难确定，因为若有`COE`，您从流程初期就一直在与该团队互动。\n\
    - 验证所有项目和/或文件夹结构是否符合所使用的生产自动化工具的所有指南要求。\n- 确保生产环境（`URL`、网络等）中的所有应用程序和系统均可通过机器人用户\
    \ ID 及用于应用程序的任何其他用户 ID 进行访问。\n- 确保基础设施能够按计划新增自动化和机器人。\n- 存在哪些风险？此时，所有已识别的风险都必须有相应的缓解计划，并指定专人负责。缓解计划可能仅仅是接受风险，但必须指定责任人，以便在风险事件发生时，可以联系该人员商定处理方式。\n\
    - 另一项信息是机器人的调度安排。自动化每天、每周、每月甚至每年运行多少次？还是\"按需\"运行？这些信息应在最初接收到自动化请求目的时尽早确定。\n- 机器人预期处理的工作量也至关重要。若工作量稳定且机器人运行周期不变，则较为简单；但若工作量在每次运行间显著变化，且缺乏相关信息、模式或历史数据，则必须仔细记录。掌握历史信息（例如，每月前三天的工作量通常翻倍）将极大有助于成功部署机器人。\n\
    - 必须验证机器人在生产环境中使用的访问权限，包括环境、用户 ID、应用程序访问和网络访问。\n- 验证通信电子邮件是否正确。例如，若机器人需将异常情况（因各种预识别原因进入流程但无法由机器人处理的情形）发送至特定邮箱，请确保地址正确。\n\
    - 若机器人是对现有自动化的更新或增强，必须制定灾难恢复计划。一旦更新或增强出现问题时，需能迅速回退至更新或增强前的机器人版本，至少确保已处理的工作能够继续进行。\n\
    - 任何软件版本均包含三部分：\n  - **发布号**（有时称为\"主版本号\"）：对于新自动化，发布号为一（1）。当引入重大变更时，发布号或主版本号也会随之更改。例如，对软件包进行大规模或可能不向前兼容的更改。"
- fmt: '# 排版后的内容


    For enhancements, including adding steps of a manual process into the automation
    (remember, the initial automation may only have automated some of the manual steps;
    at some point, additional steps may be automated using the same `Bot`), the release
    number would be incremented by one.


    - **Minor version number**: Minor version numbers change when a set of smaller
    features is rolled out within the `Bot`.

    - **Patch number**: Patch numbers change when a new build of an existing `Bot`
    is deployed. This is normally for small bug fixes or updates to templates, etc.,
    used by the `Bot`.

    - An example of a number would be: `1.002.013`. This indicates that it’s the original
    release (or major version), there have been 2 minor updates, and 13 patch changes
    (bug fixes, template updates, etc.).

    - Identify the specific people (not just the roles) in the business, and the `SMEs`,
    who must be present at the time of deployment.


    **Pause and Consider** Throughout this book, we have specified identifying roles,
    not names of individuals. Now we are specifying individual names. This is because
    at this point, you need to know exactly who will fulfill these responsibilities.


    ## Major Steps for Deployment


    As you prepare for deployment, you must assure that the scheduled date for deployment
    has been agreed to by all stakeholders. Also, be sure that all required documents
    are signed off for the deployment process. This includes all documents required
    by compliance: requirements documents, code review, and test summary. Stakeholders
    include the release or delivery manager and the business product owner. There
    may be other stakeholders in your organization whose sign-off is required.


    You will then package all the code files and create database scripts or any `Bot`
    scripts (depends on the automation tool being used) and any and all `Bot` documents
    (e.g., Read Me files).


    **Tip** Some software tools allow the user interface to deploy `Bots` to production
    environments from stage or UAT environments. Check if the automation tool used
    in your organization provides the user interface for moving files from the UAT
    environment to the production environment.


    You will need to share all required files (all those files created in the step
    mentioned earlier) and pertinent documentation with the deployment team. This
    could be through network share, email, or the automation tool itself.


    **Tip** Some software automation tools may offer to build scripts, and those scripts
    may be invoked manually or via other means to deploy `Bots`. Again, you need to
    check if the automation tool that you are using provides the user interface for
    moving files from the UAT environment to the production environment.


    As you approach deployment, schedule a meeting with the deployment team members
    to block their time for the time agreed upon for deployment. You need to assure
    that they are available for the deployment.


    You will now deploy all files to production and run scripts on the database if
    required. Once all files are shared with the deployment team, all files will be
    copied to the production environment, during the time scheduled for deployment.
    Validate that all required scripts have been run.


    **Tip** `Bots` can also be deployed by physically copying code files to the production
    environment and changing the required databases as per requirements. As stated
    previously, you need to determine if the automation tool that you are using provides
    the user interface for moving files from UAT environment to production environment.


    You will schedule the `Bot` as per requirements (e.g., hourly, daily, weekly,
    working days only, etc. This was decided earlier in the process). Then you will
    test run the `Bot` in production if required. This assures that the `Bot` is working
    properly in production, because the environment is new. The production environment
    may be different from the test environment. After that, you will validate the
    results to assure the `Bot` is working properly and then announce the successful
    deployment to the business team.


    **Pause and Consider** Deployment steps vary with the software automation tool
    that is being used for implementing RPA in your organization. What changes will
    be required in development in your organization, depending on the tool you select?


    The technical team will continue to monitor the `Bot` for a few days as agreed
    to with the business (and `COE` if there is one). This is for new `Bots`. For
    upgrades or other changes, the technical team will only monitor for one run, or
    one day, depending on what has been agreed upon.


    We have provided a long list of items to do prior to deployment. How will you
    remember to do them all? The best way to avoid having anything fall through the
    cracks is to use a checklist. The following is a sample (this is also included
    in Appendix 11 for your convenience).'
