  trans: "\n# 风险评估\n\n对于任何新的 RPA 机会，都必须执行初步的风险评估。大多数项目负责人对风险评估活动非常熟悉，但有一些风险是 RPA 特有的，我们将在本节中详细说明。需要明确的是，与任何项目一样，在此阶段（机会评估）仅能识别出初步风险，如果项目继续进行，会发现更多风险。尽早让您所在组织的风险与合规团队（在贵公司可能名称不同）参与进来是有益的。该团队可以帮助尽早识别风险。如果风险后来才被识别，则可能需要进行代价高昂的返工，甚至导致项目取消。这将造成不必要的时间和金钱浪费。\n\
    \n总体而言，风险评估的目的是列出在机器人创建或实施过程中可能出现的问题。例如，某些机器人必须访问的应用程序是否难以访问？如果是，这会增加多少解决方案开发时间？再举一个例子：机器人误读信息的可能性有多大？这些类型的风险必须尽早识别，以帮助治理委员会做出明智的决策。\n\
    \n2019 年 6 月 18 日，[纳文·乔希](https://www.forbes.com/sites/naveenjoshi/)在福布斯撰文指出了以下四\
    \ (4) 项主要风险：\n\n1. 流程选择错误\n2. 技术问题\n3. 缺乏沟通\n4. 安全性^(¹¹)\n\n设计师和开发人员将使用风险评估文档来创建能够减轻这些风险的自动化程序。虽然需要进行彻底的风险评估，但必须记住，此时关于项目的信息仍然有限，对解决方案几乎一无所知。我们只清楚地了解目标是什么以及“要求”是什么（请求者实际想要什么）。换句话说，我们知道做什么和在哪里做，但不知道怎么做。随着解决方案开发的进展，将识别出其他风险。\n\
    \n从这份表格开始（附录 5 中有一个模板）。每个类别的说明紧随模板之后。\n\n## 风险评估检查表\n\n<项目名称>\n\n![../images/513218_1_En_5_Chapter/513218_1_En_5_Figc_HTML.gif](img/513218_1_En_5_Figc_HTML.gif)\n\
    \n（参见附录 5 的模板。）\n\n1. **风险**：在此区域，简要且简洁地识别风险。RPA 项目的一个标准风险如下：“机器人无法运行。”\n2. **类型**：通常，“风险类型”属于以下类别之一。\n\
    \   - 合规性\n   - 错误\n   - 财务\n   - 运营\n   - 声誉\n   - 资源\n   - 系统\n   - 技术\n   -\
    \ 安全性\n\n根据您目前掌握的最佳信息填写此区域。请记住，这是项目非常早期的阶段，随着获得更多关于业务需求、技术等信息，将识别出其他风险。\n\n> **提示**\n\
    > \n> 征求多位主题专家的意见，以确保您评估并识别出 RPA 可能暴露或产生的潜在风险。请您的“风险与合规”团队参与其中。\n\n3. **是否有缓解计划？**\
    \ 这可以是“是”、“否”或“不适用”。“是”表示针对此特定风险有缓解计划。对于之前提到的标准风险，这将是“是”。\n   \n   “否”表示针对此特定风险没有缓解计划，但必须创建一个。\n\
    \   \n   “不适用”表示没有缓解计划，但决定直接接受该风险。这可能包括接受维护成本、产生技术债务，或接受 X% 的异常情况需要手动处理等事项。\n\n\
    4. **缓解计划和责任方**：在此框中，您将简要说明必须对该风险采取的措施。如果有缓解计划（来自“是否有缓解计划”列的“是”），请简要说明。例如，对于之前提到的标准风险，“缓解计划”通常是：“在机器人修复之前，恢复人工处理。”\n\
    \   \n   如果没有计划（来自“是否有缓解计划”列的“否”），请简要说明创建计划所需的步骤。这可能包括以下任何一项（以及其他项）：“与公司风险管理协商”；“获取\
    \ SMEs 的意见”；“研究行业期刊。”\n   \n   同样在此部分，填写负责处理该风险的人员的职位（而非姓名）。对于标准风险，这是 RPA 团队负责人，以及负责该流程的人员的职位。\n\
    \n在页面底部，包含您的姓名和任何参与风险评估工作的人员姓名、文档完成日期，然后是批准人的姓名和职位以及批准日期（批准通常通过电子邮件提供，以保留“书面”记录）。\n\
    \n> **暂停并思考**\n> \n> 在 RPA 过渡到生产阶段时，所有已识别的风险都必须有一个指定负责人的缓解计划。该计划可能仅仅是接受风险，但这必须记录在案，并且该接受必须有负责人。您将如何确定风险负责人并记录他们对风险和/或缓解计划的接受？\n\
    \n请记住，机会评估的目的是在投入资源进行解决方案开发之前，评估请求或 RPA 候选项目的适用性和价值。人的天性是想直接进入执行模式，这看起来可能是一种更快、更高效的方式，但对\
    \ RPA 候选项目进行适当的评估或评价更有效、更高效，尤其是在 RPA 引入组织的早期阶段。随着 RPA 文化和技术架构环境的成熟，前期花费的时间会减少。但在组织中引入\
    \ RPA 时，绝不是偷工减料的时候。\n\n一旦机会评估阶段所需的所有文件都完成，您就可以准备参加下一次治理委员会会议了。\n\n> **提示**\n>\
    \ \n> 如果某个特定工件对您的组织没有价值，就不要使用它。但在 RPA 计划的早期阶段，在取消某个步骤之前要谨慎。让经验引导您。\n"
- fmt: '# Governance Committee Meeting at the Conclusion of Opportunity Assessment


    Now that you have looked more closely at the request by completing the documents
    shown earlier, it is time for the Governance Committee to determine if it is still
    feasible to proceed to the next step. The RPA team’s recommendation will be important
    in the Governance Committee’s decision-making. Making the decision to either move
    forward to the next phase of the project (solution design; please see Chapter
    [6](#513218_1_En_6_Chapter.xhtml)), postpone the project, or cancel it altogether
    cannot be made lightly. There are a wide variety of impacts to any of those choices.


    As mentioned earlier, there are several times along the project life cycle that
    the Governance Committee will evaluate the findings obtained from a phase (e.g.,
    opportunity assessment, solution design) and determine feasibility. The RPA team
    will combine the previously referenced documents into a single document, schedule
    the meeting, and include the link to the document (if not everyone on the Governance
    Committee has access to where the document is stored, simply attach it to the
    email).


    Prior to the Governance Committee meeting, the Governance Committee members should
    all have read the document and should come prepared to ask questions. Realistically,
    this is often not the case; the Governance Committee members may not have reviewed
    the document prior to the meeting. The process analyst/designer or another RPA
    team member must be prepared to give a very brief, high-level overview of the
    request. This overview will include a high-level description of the current process.
    The person presenting will also discuss the problem that the automation is meant
    to resolve and the benefits of automating the process; that is, will it achieve
    the requested benefits? Also, they will discuss the feasibility of implementation:
    does it seem as if the manual process is a good candidate to be automated in terms
    of cost, complexity, etc.? Lastly, they will present the risks both of automating
    the process and any risks associated with not automating the process. This might
    include the potential to lose a competitive advantage.


    All the information from this brief summary can be obtained from the prepared
    documents, with most of it coming from the opportunity overview.


    Based on either Governance Committee members’ review or the brief summary provided,
    there are three possible outcomes:


    1. The project is approved to move to the next phase (solution design).

    2. The project is put on hold, pending some additional information. Depending
    on the additional information required, a second Governance Committee meeting
    may or may not need to be held. If the information is minor and advising the Governance
    Committee members via email is sufficient, a second meeting need not be held.
    If email communication is all that is needed, each member of the Governance Committee
    must signify their decision (approve, obtain still more information, or “pause”)
    by return email.


    You will see that, as the culture matures, there will be fewer times when additional
    information is required. As the RPA team learns what information the Governance
    Committee requires, that information will be obtained prior to presenting the
    opportunity to the Committee.


    In some cases, there will be requests that are not currently feasible, but could
    be made feasible. For example, it may be that all inputs are manual, and that
    is the only thing preventing the process from being a good candidate for RPA.
    But if the process owner is able to make them electronic, then the process could
    be automated. Following the Governance Committee meeting, the process stakeholders
    will be advised of any such situations, so they can determine if they want to
    make the changes required to qualify for automation.


    2. The project is “paused.” This could be because while automation would benefit
    the department, the cost of automation would far exceed continuing to do it manually.
    It could also be due to extreme complexity or any of a variety of other reasons.


    There may come a time when, due to a light workload, changing priorities, or other
    situations, the project will move forward. Each individual RPA team must determine
    if all “paused” projects will be reviewed annually, semi-annually, etc.


    3. The project is cancelled. There are times when a project is simply not a good
    fit for RPA. The business stakeholders may certainly have an issue with a manual
    process, but RPA isn’t the solution. In these situations, whenever possible, refer
    the business stakeholders to some other possible solution. Most organizations
    have a variety of applications, and often these can provide some improvement to
    the identified issue.


    ## Pause and Consider


    Requests are “paused” when they will be reviewed again in the future. It is not
    good to cancel a project that the requestor and their department have been excited
    about. How can you best advise the requestor that their request has been “paused”
    or cancelled? Remember, you don’t want to discourage a requestor from submitting
    another process for automation.


    Now let’s look at how the concepts in this chapter would apply to the fictional
    case study we introduced in Chapter [4](#513218_1_En_4_Chapter.xhtml).


    ## Case Study Example


    We would start with an opportunity brief. This document should not exceed two
    pages (please see Appendix 6 for a template). For our example, the opportunity
    brief might look like this.'
