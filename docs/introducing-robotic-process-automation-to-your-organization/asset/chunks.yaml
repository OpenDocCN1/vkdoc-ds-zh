    \n(See Appendix 5 for a template.)\n\n1.  Risks: In this area, briefly and succinctly\
    \ identify the risks. One that is standard for RPA initiatives is the following:\
    \ “The Bot fails to function.”\n\n2.  Type: Generally, the “risk type” is one\
    \ of the following categories.\n    1.  Compliance\n\n2.  Error\n\n3.  Financial\n\
    \n4.  Operational\n\n5.  Reputational\n\n6.  Resource\n\n7.  System\n\n8.  Technology\n\
    \n9.  Security\n\nComplete this area to the best of your current knowledge. Remember,\
    \ this is a very early stage in the project, and additional risks will be identified\
    \ as more information about the business need, the technology, etc., is obtained.\n\
    \nTip\n\nSolicit input on risks from a variety of subject matter experts to assure\
    \ that you assess and identify potential risks RPA could expose or create. Involve\
