- fmt: "# 9\\. Development Methodologies and Framework\n\nOnce the initial foundation\
    \ for an RPA initiative has been established, it is time to begin work on the\
    \ first project or series of projects. How that is actually done will depend on\
    \ many factors in your organization.\n\n`RPA` fits comfortably with traditional\
    \ Waterfall methodology and Agile and its numerous hybrids and variations. How\
    \ you proceed will depend on whether or not yours is an Agile shop or Waterfall.\n\
    \nRegardless of the methodology used, there will be some commonalities:\n\n* The\
    \ business case that was created earlier must be updated. Remember, the preliminary\
    \ business case was based on limited information. By the time you are ready for\
    \ development, additional information will have been obtained. This may change\
    \ the specifics of what’s required, the anticipated savings, the other systems\
    \ impacted by the proposed change, the tools used, etc. These changes must be\
    \ incorporated into the updated business case.\n\nPause and Consider: How is this\
    \ information best gathered? What meetings have been held up to this point that\
    \ have included information that can be used to refine and update the business\
    \ case?\n\n* A readiness checklist will be required. This is used to assure that\
    \ all the steps necessary during development to deploy the software to production\
    \ have been completed. The readiness checklist follows the project through its\
    \ life cycle, since there are requirements for deployment that must be accomplished\
    \ at each stage.\n\n* Roles: When work begins on an RPA project, several roles\
    \ will be required.\n  * Business analyst: This person has been involved from\
    \ the start, working with the business to fully understand the need and translating\
    \ that need to requirements.\n  * System analyst: This person has also had some\
    \ involvement from the start, working with the business analyst to identify the\
    \ systems impacted by the proposed change. Early in the project life cycle, exactly\
    \ what systems are impacted may be suspected but not confirmed. During this phase,\
    \ the exact systems impacted must be identified.\n  * Architect: The architect\
    \ is also not new to the project, having worked with the business and system analysts\
    \ to help determine a general timeline for the project and to evaluate the level\
    \ of complexity. Like the business and system analysts, the architect’s work now\
    \ becomes more specific, as the “unknowns” from early in the project become clear.\n\
    \  * Developer(s): A developer may have had some input early on, but as long as\
    \ there was an architect engaged, it is unlikely. Now the developers will read\
    \ and understand the requirements and translate them to code.\n  * Business owner:\
    \ The business owner is the requirements expert. They know what is needed and\
    \ assist in creating the iterations of the project.\n\nIf Agile (or one of its\
    \ hybrids) is used, the previous roles will all be involved, but simultaneously\
    \ rather than consecutively. `RPA` lends itself very well to Agile, due to the\
    \ iterative nature of both.\n\n## Challenge with Differing Methodologies\n\nRPA\
    \ teams usually work with more than one business unit at a time, because they\
    \ are working with different applications which may be owned by different business\
    \ units. The RPA team cannot change its own methodology for every specific client\
    \ or utilize multiple methodologies at one time. If there are different methodologies\
    \ that other business units are working with, and RPA is using, for example, Agile,\
    \ there are challenges: how can one methodology be used by RPA when the other\
    \ business units are using a Waterfall methodology?\n\nIn the financial sector,\
    \ for example, many business units are using a Waterfall methodology, while most\
    \ RPA teams are using Agile or Lean. The business unit is accustomed to signing\
    \ off on completed requirements; Agile and Lean use an iterative approach, wherein\
    \ partial requirements are approved and then developed. The RPA team then has\
    \ to wait until all requirements are approved to begin development. How can the\
    \ wait time be minimized?\n\nInstead of signing off the entire requirements document,\
    \ the business must sign off on sections incrementally, noting in the document\
    \ that the sign-off does not pertain to the entire requirements document, but\
    \ only to the particular section. Upon full completion of the requirements (note\
    \ that by this time, most of the development will have been completed), the business\
    \ can then sign off on the entire document.\n\nThis requires training of members\
    \ of the business unit. The concept of signing off only partial requirements will\
    \ be new to them, and they may not be comfortable with the idea. They may say\
    \ that they can’t possibly sign off on “partial” requirements, because they need\
    \ to see the whole picture before they can approve any part of it. This is, certainly,\
    \ for some, a new way of doing things. For analysts and for SMEs, they need to\
    \ think about how the requirements document is divided. They will need to look\
    \ only at the steps that are being automated, but even then, they may want to\
    \ see the end-to-end requirements document before approving any one part of it.\
    \ This is true of deployment as well; the Bot will be deployed incrementally.\
    \ Having a product RPA incremental development roadmap or plan is critical to\
    \ define small pieces of RPA. These are building blocks for the final automation.\
    \ This roadmap might include epics, stories, or other artifacts. Regardless of\
    \ what they are called, they constitute the step-by-step roadmap for the automation.\n\
    \nPause and Consider\n\nEach portion of requirements should be large enough to\
    \ develop or be a complete functional portion of RPA, for example, accessing the\
    \ email account to retrieve email content, or accessing the system’s/application\
    \ front end by logging in under RPA credentials, etc. Each requirement should\
    \ produce a “minimal viable product,” even if that small “chunk” is never delivered\
    \ separately to the customer. How can you best work with the business to help\
    \ them understand this division or “chunking” of requirements?\n\nConsider again\
    \ our case study. A client sends an email notifying us that they have changed\
    \ their phone number and address.\n\n* First iteration of requirements: “`Bot`\
    \ will open the email, read only the phone number, and update the phone number\
    \ in the web application.” The business will be asked to approve this first iteration\
    \ of the requirements.\n\n* Second iteration of requirements: “`Bot` will open\
    \ the email, read the phone number and address, and update the phone number and\
    \ the address in the web application.” The business will be asked to approve this\
    \ second iteration of the requirements.\n\n* Third iteration of requirements:\
    \ “`Bot` will open the email, read the phone number and address, and update the\
    \ phone number and address to the web app and the mainframe.”\n\nIn this situation,\
    \ the first iteration of requirements, once approved, will be developed and tested.\
    \ User acceptance testing will not occur until all components of the requirements\
    \ are developed. The assumption here is that there will be incremental development,\
    \ but only one release when all the products of all the requirements have been\
    \ developed.\n\nAn option is that the product of the first requirements could\
    \ be delivered and put into production, followed by the second being deployed,\
    \ etc. This depends on the model that your organization selects.\n\nWith each\
    \ new iteration of requirements, you are increasing the scope of automation. This\
    \ may be a new concept for the business, which has been accustomed to only approving\
    \ the entire requirements document.\n\nIn some organizations, the deployment team\
    \ may be using a Waterfall methodology and the RPA team using an Agile methodology.\n\
    \nWe will now discuss several common methodologies used with `RPA`."
