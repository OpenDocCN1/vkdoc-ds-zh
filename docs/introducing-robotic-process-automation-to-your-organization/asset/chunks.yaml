    \ briefly describe the steps required to create one. This might include any of\
    \ the following (among others): “Confer with corporate risk management”; “Obtain\
    \ input from SMEs”; “Research industry journals.”\n   \n   Also in this section,\
    \ put the role (not the name) of the person responsible for handling the risk.\
    \ For the standard risk, this is the RPA team lead, along with the role of the\
    \ person responsible for the process.\n\nAt the bottom of the page, include your\
    \ name and the names of anyone who worked on the risk assessment, the date of\
    \ the completion of the document, then the names and roles of the approvers, and\
    \ the date of approval (approvals are generally provided via email, to maintain\
    \ a “paper” trail).\n\n> **Pause and Consider**\n> \n> At the point of RPA transition\
    \ to production, all identified risks must have a mitigation plan with an assigned\
    \ owner. The plan may be simply accepting the risk, but that must be documented,\
    \ and that acceptance must have an owner. How will you identify risk owners and\
    \ document their acceptance of the risk and/or mitigation?\n\nRemember that the\
    \ purpose of the opportunity assessment is to evaluate the request or RPA candidate\
    \ for suitability and value prior to investing resources for solution development.\
    \ Human nature is to jump to execution mode, and it may seem that it is a faster\
    \ and more productive way, but it is more effective and more efficient to have\
    \ proper assessment or evaluation of RPA candidates, especially at the early stage\
    \ of RPA introduction to the organization. The amount of time spent up front will\
    \ decrease as RPA culture and the technology architecture environment mature.\
    \ But the introduction of RPA to an organization is not the time to cut corners.\n\
    \nOnce all documents required for the opportunity assessment phase are complete,\
    \ you are ready to proceed to the next Governance Committee meeting.\n\n> **Tip**\n\
    > \n> If a particular artifact does not bring value to your organization, don’t\
    \ use it. But be careful before eliminating a step in the early stages of your\
    \ RPA initiative. Let experience guide you."
  raw: "## Risk Assessment\n\nFor any new RPA opportunity, a preliminary risk assessment\
    \ must be performed. Most project leaders are well versed in risk assessment activities,\
    \ but there are some risks that are peculiar to RPA, and we detail them in this\
    \ section. It’s important to know that, as with any project, in this phase (opportunity\
    \ assessment), only preliminary risks will be identified, and more will be discovered\
    \ when and if the project moves forward. An early involvement of your organization’s\
    \ risk and compliance group (it may have a different name in your company) is\
    \ beneficial. That group can assist in identifying risks early on. If they are\
    \ identified later, it might necessitate costly rework or even cause the project\
    \ to be cancelled. This would result in an unnecessary waste of time and money.\n\
    \nOverall, the purpose of the risk assessment is to list what might go wrong during\
    \ the creation of the Bot or during implementation. For example, is there a likelihood\
    \ that certain applications that must be accessed by the Bot will be difficult\
    \ to access? If so, how much will that increase the time to develop the solution?\
    \ Another example: How great is the possibility that the Bot will misread information?\
    \ These kinds of risks must be identified as early as possible to help the Governance\
    \ Committee make informed decisions.\n\nWriting in Forbes on June 18, 2019, [Naveen\
    \ Joshi](https://www.forbes.com/sites/naveenjoshi/) noted the following four (4)\
    \ major risks:\n\n1.  Incorrect process selection\n\n2.  Technical issues\n\n\
    3.  Lack of communication\n\n4.  Security^([^(11)](#fn11))\n\nThe risk assessment\
    \ document will be used by designers and developers to create the automation that\
    \ will mitigate those risks. While a thorough risk assessment is required, it\
    \ must be remembered that at this point, there is still limited information known\
    \ about the project and almost nothing about the solution. We only have a clear\
    \ understanding of what the objective is and what the “ask” is (what does the\
    \ requestor actually want). In other words, we know what and where, but not how.\
    \ Additional risks will be identified as the solution development progresses.\n\
