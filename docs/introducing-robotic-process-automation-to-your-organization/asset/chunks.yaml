  trans: '

    # 敏捷方法论


    许多 RPA 组织会选择敏捷方法论或敏捷混合模式。敏捷方法中常被新 RPA 团队采纳的核心特点，是其从始至终的迭代式开发特性。


    在敏捷环境中，会批准一些初步且非常基础的需求。这便是最小可行产品，意味着功能可运行，但可能远未达到交付客户的程度——它太过简陋。以我们的案例研究为例，一个非常初步的需求可能是：“机器人将读取邮件，提取电话号码，并更新网页应用程序中的电话号码。”业务方会批准这一需求，同时明知将其交付客户毫无意义，因为这仅是客户期望和承诺功能的一部分。但这仍是一项需要完成的基础功能。一旦获批，开发团队便会着手实施。下一个需求可能是：“机器人将读取邮件，提取地址信息，并更新网页应用程序和大型机中的地址。”同样，这仅是客户要求和承诺功能的一个方面，却是绝对必要的。


    显然，这与传统的瀑布方法论不同——后者要求所有需求在开展任何其他工作之前就被收集并批准。但正如前文所述，RPA 的最佳落地方式是遵循迭代流程（例如：完成部分工作→向治理委员会汇报→获得（或未获得）继续推进的批准→完成更多工作→再次汇报，以此类推），因此采用敏捷开发方法论是合乎逻辑的。


    一个优势在于，可以在项目生命周期早期进行变更。例如，一旦“机器人必须能够从邮箱 XYZ 读取传入邮件”这一需求获得批准，业务方可能决定：机器人不仅应更新地址和电话号码，还应涵盖因结婚、离婚等原因导致的姓名变更。在传统的瀑布方法论中，这将构成重大需求变更，需要返工。而在敏捷环境中，由于需求是逐步获取并批准的，此类变更可以随时进行。


    **暂停思考**


    请记住，在组织中引入 RPA 可能具有革命性。如果 RPA 团队使用的方法论与组织其他部门不同，则需要就差异领域进行协商。例如，你将如何说服业务方签署批准不完整的需求？


    在比较采用敏捷或瀑布方法论的 RPA 项目时，Madan Kumar Divvela 如此表示：“通常，使用 RPA 进行流程自动化从启动到上线只需几周时间。传统的瀑布方法论无法跟上
    RPA 交付的节奏。”^(²²)


    ## 优势


    使用敏捷方法论的优势之一在于，可以轻松进行变更，而不会造成昂贵的延误和返工。Dominic Whaley 在《Partnering Solutions》中撰文评论自己的经验时提到：“将工作划分为独立的数据包使我们能够定期评估进展。变更或新需求会被记录并添加到下一个冲刺中。”^(²³)


    增量交付的另一个优势是：从上一增量中吸取的经验教训可以轻松融入下一组需求中，无需重写整套需求并再次经历重新审批流程。这样一来，例如在第一组需求的收集或文档编制中你认为可以做得更好的地方，可以在第二组需求的收集或文档编制中得到改进。


    这带来了更高的灵活性，并缩短了开发周期的总前置时间。


    此外，所有团队成员始终处于忙碌状态。一旦初始需求被文档化，开发人员和业务分析师就可以开始处理 MVP。在此项工作进行的同时，下一组需求正在被收集。


    敏捷还使得估算每个需求所需的开发时间更加容易，从而使部署计划更简单高效。


    另一个潜在优势在《Blueprint》杂志一篇题为《如何通过敏捷方法实现大规模 RPA 交付》的文章中有所探讨。


    > *在机器人流程自动化的敏捷方法中，业务流程在开发开始之前就经过设计和优化。这使得大型组织能够完全标准化和优化端到端、复杂且多层次的业务流程——这些流程正是自动化真正投资回报率（ROI）的所在。同时，这也为它们提供了宝贵的机会，将这些流程与更广泛的业务目标、企业或监管约束、政策及控制措施联系起来。*^(²⁴)


    ## 可能的缺点


    在敏捷环境中工作需要培训。这不仅涉及新的工作方式和全新的术语表，还包括新的思维方式。仅仅更换术语但沿用相同的方法，并不能让一个组织变得敏捷。人类天性不喜欢改变，尤其是当人们当前的工作方式已经非常高效且有效时。敏捷要求业务和技术双方的人员以截然不同的方式思考需求、开发等问题。尽管开发团队通常能迅速接受敏捷，但业务方往往犹豫得多。


    **暂停思考**


    如果你的组织并不熟悉敏捷，但你认为 RPA 最适合采用这种方法论来构建，你将如何说服人们接受它？你是否预见到技术团队可能接受，但业务方会有阻力？你如何让双方都看到使用敏捷的优势？


    这并非暗示只有敏捷对 RPA 有效；情况绝非如此。虽然许多组织正逐渐脱离传统的瀑布方法论，但也有许多组织并未如此。RPA 同样可以使用瀑布方法论来建立。

    '
- fmt: '## Waterfall Methodology


    Using a Waterfall (requirements, development, test, deployment) methodology with
    RPA simply replicates how projects are performed in any traditional environment.
    Once requirements are captured and approved, development begins. The process continues
    in a very traditional manner.


    Let’s look again at our case study, and consider it in the context of a Waterfall
    methodology within RPA. It would follow the traditional pattern: requirements
    gathered and approved, followed by development, testing, and deployment. The manual
    process is still being automated, so the end remains the same; only the means
    are different. Governance meetings would be held after each phase, to gain approval
    (or not) to proceed.


    Benefits: Most organizations are familiar and comfortable with this very traditional
    methodology. There are no surprises; it is tried and true (if not the most efficient
    way of developing projects today). For some organizations, this can be the safest
    way of introducing RPA to an organization; the introduction of RPA will rock the
    corporate boat a little; you don’t want to swamp it with an Agile tidal wave!


    The Waterfall methodology works well for small and simple RPAs. If the process
    is very simple and straightforward, with little complexity, etc., the Waterfall
    methodology process will usually be successful. More complex manual processes
    are better automated in an Agile environment.


    Possible disadvantages: This can be a much slower process. Work does not begin
    on development until all requirements are gathered and approved; testing does
    not begin until all development has been done. If, during testing, some error
    is found, or if the business decides it wants to add a requirement, much rework,
    with its inevitable accompanying delays, must be done.


    It is only fair to note here that most of the literature comparing Agile and Waterfall
    usage in RPA programs comes down quite heavily on the side of using Agile. While
    that means you should certainly consider it, there are many factors you need to
    think about before making the decision for your organization.


    ## Lean Software Development


    Lean software development emerged as an alternative to the traditional Waterfall
    methodology with rigorous, document-driven, and traditional development approaches.
    Lean thinking principles are based on the Toyota Production System (TPS) and have
    been successfully applied in many manufacturing and product development organizations.
    Lean’s philosophy is based on reducing the development time by removing all non-value-adding
    wastes.


    As Taiichi Ohno, one of the main architects of the Toyota Production System (TPS),
    explained the concept: “All we are doing is looking at the timeline from the moment
    the customer gives us an order to the point when we collect the cash. And we are
    reducing the timeline by removing the non-value added wastes.”^([^(25)](#fn25))


    It took Toyota 30 years to refine their methodology and practices to make them
    effective and efficient and what they are today. However, it did not get mainstream
    attention and recognition until MIT’s (Massachusetts Institute of Technology)
    five-year study of the automotive industry identified Lean as a source of huge
    productivity differences between the United States and Japan.^([^(26)](#fn26))
    The study resulted in defining a new term for production system – “Lean” (because
    by removing waste, it would require less of everything). The Lean production methodology
    and thinking is mainly described in the book *The Machine That Changed the World*
    by James Womack, Daniel Jones, and Daniel Roos.


    During the last few years, Lean has also become popular within the software industry.
    It mainly originated from the book *Lean Software Development: An Agile Toolkit
    for Software Development Managers* by Mary and Tom Poppendieck.^([^(27)](#fn27))
    This book studies Lean production systems from a different perspective and adopts
    and tailors Lean principles and tools for software development. Its popularity
    is rapidly growing, and this growth is due to its effectiveness in identifying
    and eliminating waste and quickly responding to changing customer and market demands.


    The key success of the Lean methodology is in the shifting of the practitioner’s
    mindset to Lean thinking and not just adopting and practicing Lean tools. There
    are five core Lean concepts that underpin Lean thinking:


    1.  *Value* is defined by the customer and is what the customer is willing to
    pay for. It is critical to have a clear understanding of what that is. The product
    owner can be seen as the “customer” in RPA.


    2.  *Value stream* is a visual representation of every action (both value adding
    and non-value adding) currently required to bring a product or service through
    the flow from customer request to delivery. The process map, developed early in
    the life cycle, is a rudimentary but often adequate version of the value stream.


    3.  *Flow* represents how people and materials or required items are moving from
    one step to another until the value is delivered to the customer. It is important
    to achieve a continuous flow by removing waste from the value stream so development
    or services can move smoothly toward the customer. That would lead to gains in
    productivity and efficiency, making processes leaner. That would dramatically
    reduce time to the customer; instead of taking months to deliver, it could be
    reduced to weeks or even days. The document that you will create to accompany
    the process map will capture this information.


    4.  *Pull* means customers can order products or services when they need them,
    and those products or services could be delivered within a short time. It would
    ensure that nothing is built before it is needed, resulting in lower cost of inventory
    that potentially won’t be used by the customer; all that effort of creating inventory
    would be wasted. You determine what the next item to work on is.'
