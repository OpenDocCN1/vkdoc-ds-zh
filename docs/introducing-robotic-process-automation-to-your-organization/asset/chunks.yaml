    But if the process owner is able to make them electronic, then the process could
    be automated. Following the Governance Committee meeting, the process stakeholders
    will be advised of any such situations, so they can determine if they want to
    make the changes required to qualify for automation.


    1.  The project is “paused.” This could be because while automation would benefit
    the department, the cost of automation would far exceed continuing to do it manually.
    It could also be due to extreme complexity or any of a variety of other reasons.


    There may come a time when, due to a light workload, changing priorities, or other
    situations, the project will move forward. Each individual RPA team must determine
    if all “paused” projects will be reviewed annually, semi-annually, etc.


    1.  The project is cancelled. There are times when a project is simply not a good
    fit for RPA. The business stakeholders may certainly have an issue with a manual
    process, but RPA isn’t the solution. In these situations, whenever possible, refer
    the business stakeholders to some other possible solution. Most organizations
    have a variety of applications, and often these can provide some improvement to
    the identified issue.


    Pause and Consider


    Requests are “paused” when they will be reviewed again in the future. It is not
    good to cancel a project that the requestor and their department have been excited
    about. How can you best advise the requestor that their request has been “paused”
    or cancelled? Remember, you don’t want to discourage a requestor from submitting
    another process for automation.


    Now let’s look at how the concepts in this chapter would apply to the fictional
    case study we introduced in Chapter [4](#513218_1_En_4_Chapter.xhtml).


    Case Study Example


    We would start with an opportunity brief. This document should not exceed two
    pages (please see Appendix 6 for a template). For our example, the opportunity
    brief might look like this.'
