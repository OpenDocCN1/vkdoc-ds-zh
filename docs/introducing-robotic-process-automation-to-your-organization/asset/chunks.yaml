- fmt: '# Challenges and Pitfalls in Hyperautomation


    Applying hyperautomation to poorly defined and understood processes is difficult
    and pointless. Process mining tools, mentioned earlier in this chapter, can help
    bring visibility and better understanding of the processes.


    Applying hyperautomation to serve customers with extremely complex and unique
    requirements would require a craftsmanship solution. If process steps and outcomes
    are customized for specific customer needs to increase customer satisfaction,
    it will introduce complexity and dependency on humans for manual handling. It
    is very important for any organization to define the right balance between customer
    satisfaction and process simplification through its standardization.


    A risk-averse organizational culture, which promotes avoidance of potential errors
    creating conservative inertia, would slow down innovation and adoption of automation.
    Empowered employees should be able to explore and experiment with new automation
    technologies and foresee business benefits quickly. It is critical to ensure end-to-end
    technology and business operations leadership support, gain their trust, and confer
    with them to try new and unfamiliar approaches.


    Selecting the right stack of automation solutions from constantly changing and
    evolving products available on the market is challenging. We believe that an organization
    should embrace automation as an operational principle rather than simply seeing
    it as added functionality or a tool.


    We see that in the near future, `RPA` capability will be a part of the automation
    stack of products available in the out-of-the-box functionality of workflow software.
    There will be no need to purchase it separately and integrate it into the tech
    architecture.


    Now that you have all that you need to embark on your `RPA` journey, you need
    to be aware of some of the challenges you may encounter, beyond those already
    mentioned. Chapter [11](#513218_1_En_11_Chapter.xhtml) will help you avoid some
    of the issues we have encountered in our experience.


    Footnotes [1](#513218_1_En_10_Chapter.xhtml#Fn1_source) [2](#513218_1_En_10_Chapter.xhtml#Fn2_source)
    [3](#513218_1_En_10_Chapter.xhtml#Fn3_source) [4](#513218_1_En_10_Chapter.xhtml#Fn4_source)
    [5](#513218_1_En_10_Chapter.xhtml#Fn5_source) [6](#513218_1_En_10_Chapter.xhtml#Fn6_source)


    # 11. Challenges and Pitfalls


    Once you have created the foundation for your `RPA` initiative and have identified
    a few “early adopters” who are willing and anxious to have some of their processes
    automated, and have established your governance policy and identified board members,
    it’s time to look ahead and see what challenges you may encounter. You can minimize
    some common mistakes by understanding what we did initially that wasn’t successful.


    Throughout this book, we have mentioned many of the possible challenges you may
    encounter when starting your `RPA` journey. Some of these we were able to avoid,
    seeing the speeding bullet and figuring out how to dodge it. Some we crashed into
    head-on and then resolved the issue after the fact.


    Studying these will assist you in being able to proceed smoothly as you work to
    automate manual processes in your organization:


    - **Expecting easy management acceptance.** When faced with an opportunity to
    cut costs and improve efficiency, we thought management at least would welcome
    the new `RPA` program. We were mistaken. While line workers were sometimes reluctant,
    due to a fear of job loss, we were surprised by more than a little management
    resistance. Some managers seemed to think that `RPA` was the new buzz phrase,
    the solution of the moment, which would generate much excitement and quickly and
    quietly fade away. They had seen too many other “game-changing” solutions that
    had done just that. Others seemed concerned not for their own jobs, but for threats
    to their “empire”; they had `X` number of employees and didn’t want that number
    reduced. If a `Bot` was going to do some of the work their employees were now
    doing, they would possibly lose those employees, since they could be repurposed
    elsewhere in the organization or let go.


    **Tip** If you are careful to follow the information in Chapter [2](#513218_1_En_2_Chapter.xhtml),
    you will be able to avoid this challenge.


    - **Identifying the wrong processes to automate.** It may seem simple to identify
    the right process; process `XYZ` is repetitive, so let’s automate it. But on closer
    scrutiny, it wasn’t as simple as we thought. As mentioned earlier, when you first
    identify a process for automation, you don’t know too much about it. But there
    are some “red flags” that we missed in some of our first attempts. For example,
    is a middle-management employee deeply invested in that process as it is currently
    performed? Would automating a process possibly step on the toes of a manager who
    does not want to recognize that their area could be improved? Or is it something
    as simple as an extremely complex process that could have been determined in a
    preliminary conversation? We learned in time to better discern these issues.


    - **Attempting to automate an entire process when only part of it is a good candidate
    for automation.** This is related to the item just mentioned. A process with multiple
    steps may be very manual and very repetitive, but that doesn’t mean that all of
    the steps can be automated at this time. The business owner may envision having
    the entire process automated, but that isn’t always reasonable. Remember, you
    may be able to automate a part of a process and still achieve significant savings
    in time or cost or provide a greatly enhanced customer experience. Look at the
    end-to-end process as you have mapped it, consider the time savings, and if only
    some of it can be automated, and that will achieve good results, then automate
    just that part of it. Work with the business owner to determine what may need
    to be done to make additional steps in the process better candidates for automation
    in the future.


    - **Attempting to build the Bot without the required expertise.** The developers
    who will do the actual work of building the `Bot` must have the knowledge to do
    so. Enthusiasm is great, but it isn’t a substitute for experience. Be sure to
    have at least one developer on the team who is highly qualified in `RPA`. They
    can mentor and train less-experienced developers.'
