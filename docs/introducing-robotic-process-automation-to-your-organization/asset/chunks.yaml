  trans: '

    对于业务覆盖不同地理区域的大型组织，集中式模型需要远程控制。由于缺乏分散决策模型，领导层通常无法对执行进行有效控制，也可能没有时间管理执行。这增加了他们的大量工作，并给领导者带来快速决策的巨大压力。这可能导致决策过快过多，而对于远离决策者的员工来说，这些决策可能不恰当、被忽视或执行不力。


    集中式模型适用于业务单元较少或只有一个业务部门的小型或初创企业。它带来了速度、可扩展性和成本效益。它也可作为大型企业的起点或概念验证（`POC`），帮助组织试点、学习并验证`RPA`的价值。这有助于高管决定是否将该能力从`POC`扩展到整个企业的大规模实施。然而，你可能会发现另一种模型（分散式或轮辐式）更适合你的需求。


    尽管集中式模型具有吸引人的优势，但在实施之前，请注意其缺点，因为它们可能会阻碍新`RPA`项目的采纳，并导致`ROI`不佳。


    **暂停思考**


    根据你刚才阅读的信息，你认为集中式模型对你的组织是否适用？它是否让你有所共鸣？还是听起来很陌生？还有另外两种模型需要考虑，但请先思考一下当前这种模型。


    ## 分散式


    在分散式模型中，企业内建立多个独立的`RPA`项目，这些项目拥有各自独立的`RPA`框架，在不同执行部门或业务单元下运行。这可以看作是多个自主运营的子`COE`办公室。分散式模型将其功能分布在整个组织中，不同业务单元运行着不同的能力。在这种模型中，决策和运营管理责任由本地`RPA`团队承担，他们负责监督所有必要职能，从定义架构、运营环境和治理，到交付和维护。


    这种模式对组织内的本地业务团队约束较少，同时帮助他们获得动力和专业知识。它通过授权员工使用`RPA`实现业务目标，将创新需求交到员工手中。这种模式治理松散，不同的业务线条会建立自己的指南、标准、方法论和结构。


    ![../images/513218_1_En_8_Chapter/513218_1_En_8_Fig2_HTML.png](img/513218_1_En_8_Fig2_HTML.png)


    **图 8-2** 分散式模型


    ### 优势


    在决策由较低层级和较小决策群体做出的条件下，创新得以蓬勃发展。更大的自主权赋予人们力量；这给他们一种重要性和主人翁感，因为他们觉得自己对引导组织方向负有责任。员工变得更加忠诚，因为他们可以在日常工作中主动采取行动，而只需极少的审批。没有什么比自己决策的成功结果更令人满足。最重要的是，它还允许他们利用自己的知识和专长，进行实验和学习：这是推动创新的关键要素。所有这些特征创造了一个自给自足、自我维持的结构，各级员工都习惯于自主工作、主动领导并在需要时做出决策，而无需等待指挥链上级的决定。


    更高效的决策为组织带来了速度和敏捷性，帮助其在当今快节奏且不断变化的商业环境中取得成功。


    ### 劣势


    虽然分散式模型是赋能员工、推动创新和业务敏捷性的好方法，但它可能成本更高。此外，由于缺乏中心控制来定义战略方向，与企业范围的`IT`人员协调可能变得困难。


    最终，它可能导致与整体企业战略的不一致和严重脱节。多个拥有自主制定战略权限的`RPA`团队可能导致不同的架构结构和不同的供应商。这最终可能导致在同一企业内出现不同的技术能力、工具、运营模式、方法论和标准。它还可能造成冗余，因为相同的功能可能在整个企业中被重复，导致整体`RPA`项目成本更高。


    此外，它可能创建孤岛，即多个团队在解决相同的问题。要保持这些孤岛之间的连接，需要领导者之间建立牢固的关系并付出努力，以创建某种"实践社区"，共享最佳实践。然而，负责支持`RPA`团队的员工可能忙于日常职责，很容易错过利用这些共享实践的机会。在员工看来，当面临交付压力时，与其花时间研究、理解和重用最佳实践，不如重新"造轮子"来得更容易。有时，创建新事物似乎更可取，仅仅是因为现有解决方案可能不为人知，或由于工具、开发实践甚至业务运营性质的差异而不太适用或难以转移。


    由于所有这些特征，分散式模型通常运行成本更高，企业层面效率更低，并且容易产生技术债务，这些问题迟早需要解决。


    对于小型企业来说，快速增长可能产生分散化的需求，以保持高效运营和业务敏捷性。尽管有其优势，但对于习惯于独自做出所有决策的企业主来说，将控制权委托给其他决策者可能很困难。


    分散式模型适用于拥有多个事业部或多个业务分支的大型企业，这些企业的业务运营性质截然不同且自我维持。通常，我们可能会发现技术服务已经分散化，并归属于各自的业务分支或事业部。在这些情况下，它们很可能拥有不同的核心架构、运营和交付模型、系统和工具，其战略与所服务的特定业务需求保持一致。因此，`RPA`和业务领导者需要确保他们优先确定哪些流程将首先使用`RPA`，并根据个体需求制定转型路线图。


    **暂停思考**


    现在你已经了解了两种结构模型。哪一种更适合你的组织？是否有一个特别突出，还是说两者都不够优化？

    '
- fmt: '# Hub and Spoke


    The hub and spoke is a model that resembles the spherical shape of the bicycle
    wheel, where the hub is in the center and spokes are connected and meet at the
    hub, which is the center of the wheel. This concept was pioneered by the transportation
    industry, and today, it is widely adopted by different companies in every industry.


    In this model, the `COE` is established within one executive office and typically
    serves as a hub for decentralized spokes. The delivery team can be seen as spokes.


    The `COE` sets standards, develops policy, provides training, and focuses on innovation
    and `RPA` program strategy. In this case, you can view the Center of Excellence
    as the main source or library of knowledge and expertise, including best practices,
    frameworks, development practices, reusable components, training, and as an `IT`
    unit that supports, maintains, and evolves `RPA` technical infrastructure and
    capability.


    Spokes – `RPA` delivery teams – are primarily focused on identifying opportunities,
    developing, and deploying `RPA` solutions to the business area they are assigned
    to or support. This model requires close collaboration between the hub (`COE`)
    and spokes (`RPA` delivery teams).


    In this model, the `COE` would:


    * Ensure integration of the `RPA` operating environment into the overall corporate
    `IT` ecosystem by creating a collaborative model with `IT` system/application
    support and solution architecture teams

    * Define the `RPA` program evolution roadmap and drive strategy to execution

    * Drive innovation and introduce new technical capabilities

    * Maintain and support `RPA`-related `IT` infrastructure

    * Develop standards, automation blocks, or reusable components

    * Interact with the `RPA` vendor and service provider

    * Be accountable for technology and tooling choice

    * Manage and maintain a library of reusable components and best practices

    * Train and enable delivery team personnel

    * Ensure knowledge is shared and reused

    * Report on `RPA` program performance and effectiveness on an executive level


    Delivery teams would:


    * Assess and prioritize selected processes to be automated

    * Develop `RPA` automation and place Bots into production

    * Interact with `IT` teams such as system/application architecture and support

    * Provide change management support to business units

    * Ensure existing robotic workforce performance

    * Maintain existing automated processes

    * Perform security/compliance functions


    ![../images/513218_1_En_8_Chapter/513218_1_En_8_Fig3_HTML.jpg](images/513218_1_En_8_Chapter/513218_1_En_8_Fig3_HTML.jpg)


    Figure 8-3 Hub-and-spoke model


    ## Benefits


    This model takes some of the burden of daily business operations off the `COE`.
    This includes allowing other teams outside of their reporting structure to perform
    such tasks as identifying processes suitable for `RPA` and developing and monitoring
    the performance of their own Bots. This frees `COE` resources to spend more time
    on big-picture items, such as planning for program evolution, introducing new
    capabilities, working on tools, knowledge sharing, and recycling activities such
    as the development of best practices, reusable components, etc.


    The model is cheaper than the decentralized one because due to centralization
    of certain functions and activities, duplication can be avoided throughout the
    entire organization. For instance, instead of having four different people across
    the organization looking after `RPA`-related `IT` infrastructure, here, it might
    be sufficient to have two.


    ## Disadvantages


    The most common challenge with the hub-and-spoke model is that it relies on perfection,
    coordination, and collaboration. When a whole model, hub in the center and every
    spoke, is working in harmony together, then the entire `RPA` program is going
    to be incredibly efficient and effective. If just one spoke were to get out of
    place, then the entire model could start to experience problems. Eventually, more
    spokes are going to fall off and the whole `RPA` program becomes ineffective and
    costly. There can be different causes that create issues outside of the central
    hub:


    * Spoke “delivery team” leads may disagree with the hub “`COE`” strategic direction
    or other decisions and not implement or execute central commands.

    * Any mistrust between hub “`COE`” and spokes “delivery teams” might lead to creation
    of silos.

    * A breakdown of the current infrastructure or poorly implemented or introduced
    capability, new vendor or new tooling, could be disastrous to a whole `RPA` program
    impacting every business unit supported by the delivery team.

    * Another issue that might occur would be that innovation velocity tends to be
    slower compared to the decentralized model.


    The hub-and-spoke model provides many benefits, but in order to capitalize fully,
    proper functional distribution of accountabilities and services among the hub
    and spokes is required. In addition, creation of an effective collaborative environment,
    trust, and strategic transparency among spokes and the center hub “`COE`” is essential
    to the success. The model isn’t for every organization, but many might find some
    of its components useful by tailoring their mandate and roles to the hub (`COE`)-and-spoke
    (delivery team) model.


    ## Pause and Consider


    You have now been introduced to the hub-and-spoke model. Do you see it as successful
    within your organizations? What components of it seem workable, and which do not?


    Each of these models can work successfully at any organization if applied appropriately.
    There is no definite winner; no single model can be seen as the most or least
    effective, as it depends entirely upon the type of the organization, nature of
    their business, service or products, culture, size, and reporting structure.


    ## Pause and Consider


    Based on your knowledge of your organization, and considering how receptive you
    think both management and line workers will be to the introduction of an `RPA`
    program, what do you think the organizational structure in your organization should
    be?'
