  trans: "\n**暂停思考** 你能预见你的组织中存在哪些潜在的“地雷”？哪些人对自己的领域特别具有保护意识？如果你发现他们所在领域存在流程优化的机会，你会如何与他们接洽？\n\
    \n-   **治理委员会会议。** 最初，我们会在会议前几天将包含申请表、商业案例、风险评估及其他文件的文档包提交给治理委员会成员。委员会成员和申请者（们）会被邀请参加每周会议来审议该请求。\n\
    \n我们发现，通常没有人会在会议前阅读任何文档。因此，我们不再提前发送详细信息，而是将信息总结成一到两页纸，并在会议上进行展示。我们停止了详细文档的发送，但保留其作为我们的记录，只在会议开始时提供该请求的高层概述。该概述包含以下内容：\n\
    \    -   请求的简要描述（例如，将当前需要三个人每周花两天时间完成的流程 XYZ 实现自动化）。\n    -   节约成本的回顾（例如，这每年将释放\
    \ 2,250 工时 [3 人 × 每周 15 小时 × 每年 50 周]）。将此数据乘以贵公司的小时费率。\n    -   对自动化流程复杂度的评估（例如，高、中、低）。\n\
    \    -   对开发所需时间的预估（例如，三周）。\n\n负责初步估算的架构师应在场回答问题。\n\n**暂停思考**\n\n遗憾的是，人们在会议前常常不阅读所需信息。你在所在组织中的经验如何？决策者会做好准备吗？如果没有，你们通常如何在会议中做出决策？你将如何为决策者准备好参加\
    \ RPA 治理会议？\n\n-   **邀请申请者参加治理委员会会议。** 我们最初认为这有一个好处，即申请者可以回答治理委员会成员可能提出的关于该请求的一些问题。但这些问题可以由业务流程分析师或架构师来回答，而且如果请求未获批准推进，这样做也无法给任何人提供一个向申请者委婉解释的机会。现在，如果请求被治理委员会拒绝，申请者会收到一封类似下面的电子邮件：\n\
    \    -   “（称呼），您好，\n\n感谢您近期提出的将流程 ABC 自动化的请求。我们已审阅您的请求，并评估了自动化的成本、可积累的节约、需求的紧迫性以及其他因素。目前，我们必须优先处理优先级更高的请求。因此，您的请求将被搁置，以便定期重新评估。\n\
    \n如果您知道其他可能与此一同实现自动化的流程，请告知我们。\n\n如果您对此有任何疑问，请与我联系。\n\n此致\n\n（姓名）\n\n（职务）”\n\n\
    在治理委员会会议上，讨论通常更为直接，委员会成员可能会说该流程不值得自动化。这会挫伤申请者提交其他请求的积极性，并为 RPA 蒙上阴影。\n\n有时，某个流程并不适合自动化，但公司的其他领域或许能提供一些帮助。在这些情况下，这些信息应包含在给申请者的邮件中，并且\
    \ RPA 团队应与该其他领域接洽，并将该请求转交过去。对于这个特定的请求，除了定期重新评估所有被搁置的项目外，不需要做进一步的工作。\n\n**暂停思考**\n\
    \n你如何最好地告知一位请求将其流程自动化的业务流程所有者，其请求已被拒绝？请记住，你不想让他们觉得自己的请求本身不合理，只是相关数据不足以支撑继续推进。\n\
    \n-   **未能在早期获取充分信息。** 有时，即使我们与申请者合作完成了申请表，仍然缺少信息。我们在后续改进了表格并消除了这个问题，但要意识到申请者可能并不掌握所有必要信息。这就是为什么与主题专家会面至关重要，他们是了解流程实际运作方式的人，而不是文档中所述的方式。这两者之间通常存在显著脱节。\n\
    \n**提示** 请记住，模板是用来根据你的特定需求进行定制的。你可能希望最初“按原样”使用它们，看看哪些对组织有效，哪些无效。\n\n-   **未能充分应对因自动化导致失业的担忧。**\
    \ 有时这可能是一种真实的恐惧；管理层可能会将减少员工人数视为自动化的一个优势。没有人愿意协助别人导致自己丢掉工作。\n\n**暂停思考** 任何特定自动化的目标可能是为了减少员工人数。你将如何处理这个问题？你将如何从那些可能完全意识到自动化其工作会使他们失业的人那里获取关于流程的协助和信息？你能从人力资源部门或高级管理人员那里获得什么帮助和支持？\n\
    \n-   **信赖现有的（旧的）文档。** 当引入新流程时，通常会有配套的文档。这些文档解释了流程的目的，更重要的是，说明了流程应该如何在理想状态下运作。然而，流程*应该*如何运作与它在日常实践中*实际*如何运作之间往往存在重大脱节。有时，当收到自动化请求时，会提供这些文档。但与\
    \ SMEs（即实际操作流程的人）一起绘制流程图至关重要。一个流程的实际运作可能与它应有的方式大相径庭，而且流程存在的时间越长，它可能离最初文档记录的情况越远。务必要根据*当前的实际执行情况*来绘制流程图。\n\
    \n**提示** 与 SMEs 一起绘制流程图将确保你理解流程的实际运作方式。不要依赖任何现有的文档。\n\n-   **选择了错误的工具。** 在选择 RPA\
    \ 工具时，有许多因素需要考虑，包括满足你的需求需要多少编程工作、它的可扩展性如何、它的变更记录以及提供更新功能的速度如何、以及它需要多少维护工作？对管理层来说，还有一个重要问题是成本。仅仅因为某个工具昂贵并不意味着它是最好的。做好调研：上网查找、与行业同行交流、查阅期刊，以找出最适合你的\
    \ RPA 工具。请记住，对一个组织来说理想的工具，未必是每个组织的最佳选择。做好功课，避免这个陷阱。\n\n-   **业务方的过度自信。** 一旦机器人启动并运行，它总有可能在某个时刻出现故障。在这种情况下，必须有足够了解该流程的人员做好准备，以手动执行流程，直到机器人再次运行。通常，会指派一到两个人来处理机器人无法处理的异常情况（例如案例研究中提到的无效客户\
    \ ID），他们通常也是在机器人停止运行时接手工作的人。但我们发现，有时需要向我们业务合作伙伴再次强调这一点。\n\n这并非可能出错的所有情况的详尽清单。你可能还会通过自己的失误来补充它！但这些是我们遇到或预见的一些关键挑战，了解它们对你来说很重要。\n"
- fmt: '# 12. Summary


    Congratulations! You now have not only the basic understanding of RPA and what
    it might mean to your organization, but you also have the details you need to
    get started and see the initiative succeed.


    To summarize, first, what is Robotic Process Automation (RPA)? It is simply automating
    repetitive manual processes. Every organization has them. Perhaps it’s a manufacturing
    company that bills for its products. The salesperson sells the item and enters
    the order into the system. A clerk finds the name and price of the item based
    on some serial or other identification number, looks up the name and address of
    the customer, types the invoice, places it in an envelope, and puts it in their
    outbox. They then get the next order and follow the same process, day in and day
    out. A “Bot” (robot) could do this: read the order, look up the customer’s name
    and address, populate the fields on a blank invoice, and send it to the printer
    which may be equipped to fold invoices and insert them into envelopes. Then, once
    or twice a day, someone from the mailroom can pick up the invoices and send them.
    The clerk or clerks who were responsible for these tedious tasks are then freed
    to work on other tasks that actually take thought. Chapter [1](#513218_1_En_1_Chapter.xhtml)
    provided you with an excellent understanding of RPA.


    If you have identified the need to automate processes within your organization,
    how will you get buy-in from senior management and line workers? If things are
    progressing well, senior management may not want to change. And line workers may
    fear for the safety of their jobs (this could be a real concern if one of the
    goals of automation is headcount reduction). By reading Chapter [2](#513218_1_En_2_Chapter.xhtml),
    you now know how to address these issues.


    What should governance for an RPA program look like? How should it be structured?
    What roles should be involved? Who should sponsor the program? What will the sponsor’s
    responsibilities be? And what overall framework will the program operate in? It
    must be structured, but be sufficiently flexible to adapt to changing needs. How
    is that done? As you read Chapter [3](#513218_1_En_3_Chapter.xhtml), you learned
    the answers to these questions.


    Once you have senior- and middle-management approval and have identified some
    early adopters, how do you find processes for automation? What are the key components
    to look for that might make a manual process a good candidate for automation?
    As you learned in Chapter [4](#513218_1_En_4_Chapter.xhtml), a manual process
    that is basically done the same way repeatedly is one that should be evaluated
    for automation.


    How do you solicit processes for possible automation? Once word of the RPA program
    becomes public in your organization, there may be many people who will be interested.
    That is excellent, but there must be some orderly manner for them to submit their
    requests. Each request must contain some basic information so you can make your
    initial evaluation. Chapter [4](#513218_1_En_4_Chapter.xhtml) discusses the request
    form, and there is a template for this in the Appendix (Appendix 1). Feel free
    to adapt it to the needs of your company, but try to keep it simple. You don’t
    want people to feel intimidated by it.


    When a manual process has been identified as possibly a good candidate for automation,
    you need to determine if, in fact, it is. You need to determine how much variation
    there is in the process, so you can know if it can be handled by a “Bot.” How
    is this done? You also need to estimate what the savings will be in time (and
    time equals money, as we all know). After you determine that, you need to estimate
    what the cost of automation will be, so you can determine return on investment
    (ROI). And are there other considerations besides ROI? What if your major competitor
    is getting products to market faster than your company, and management sees some
    of your customers moving to the competition? How do you evaluate if that is worth
    the cost of automating some processes to be more competitive, even if the money
    saved by automation will be minimal? Chapter [5](#513218_1_En_5_Chapter.xhtml)
    provides you with the tools you need to make these decisions. It also helps to
    understand that while the initial assessment may indicate that the process is
    definitely worth automating (cost of automation will save money: good ROI, etc.),
    as you proceed through the life cycle of the individual automation project, additional
    information will be discovered. Some of that information may indicate that the
    cost of automation will be significantly higher than initially estimated, or the
    cost savings will be lower. At that point, a decision must be made (and here is
    one area where the sponsor plays a role) as to whether or not to proceed with
    the project or cut your losses and cancel it. Doing so is NOT a failure; our RPA
    program is designed for incremental steps and corresponding milestones to evaluate
    the information and work completed in each phase. Excellent work may have been
    done during *opportunity assessment*, but as developers and others work through
    *solution design* (Chapter [6](#513218_1_En_6_Chapter.xhtml)), they will uncover
    more information, and some of it may indicate unanticipated expenses in development
    or less savings than initially estimated. It is better to find this information
    now, than to proceed through the expense of the entire project, go over budget,
    and find that the solution does not deliver as anticipated.


    What happens if, after obtaining steering team approval to proceed to the next
    step, you learn, in that new step, that complexity is greater than initially thought,
    or the savings will be far less than estimated? You know from Chapter [5](#513218_1_En_5_Chapter.xhtml)
    that this simply indicates that the RPA program is working as it should. It is
    incremental: you gain some initial information and make a decision about moving
    to the next step. If that decision is made, you gain additional information and
    then make another decision about advancing. At any point, you may learn something
    that reduces the feasibility of completing the project. That is fine; this happens
    and is not a failure. It is far better to proceed a short distance into a project
    and then learn that some initial assumptions were inaccurate, than to spend the
    time and effort to complete the project and only learn at the conclusion that
    the expected benefit will not materialize or the cost of creating the solution
    far exceeded the amount the solution will save.


    Who (what roles) needs to be involved in solution design? What specific responsibilities
    will they have? Chapter [6](#513218_1_En_6_Chapter.xhtml) discusses the following
    roles and their corresponding responsibilities:


    *   RPA technical delivery lead

    *   Architect

    *   Developers


    As discussed in that chapter, there may be other roles that are required, depending
    on various circumstances in your organization. Tips on how to determine if there
    are, and what their responsibilities would be, are detailed.'
