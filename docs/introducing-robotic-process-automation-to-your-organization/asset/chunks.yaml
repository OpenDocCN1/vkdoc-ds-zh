  trans: "\n## RPA 的需求\n\n在任何组织中引入 RPA 计划通常源于以下三个来源之一：\n\n1.  高层管理人员了解 RPA 并认为它将为组织带来益处。这可能源于阅读了讨论\
    \ RPA 的商业期刊、与另一家组织的同行随意交谈，或各种其他渠道。\n2.  中层管理人员了解 RPA，并认识到其所在领域有许多重复的手动流程可以通过自动化实现更高的效率、更少的错误以及降低的成本。\n\
    3.  技术负责人认识到 RPA 的重要性。随着 RPA 的日益普及，技术领导者的讨论也愈发频繁，并且它定期出现在各种期刊上。\n\n根据 RPA 引入到组织的原因，初始步骤会有所不同。\n\
    \n**暂停并思考**\n\n为什么要在您的领域中引入 RPA？是前面提到的原因 1、2 或 3，还是它们的组合？也许高级管理人员听说过 RPA 并征求您的意见：您认为它是否会对您的部门有益？如果有益，体现在哪些方面？您认为它可以在整个公司范围内使用吗？或者，您可能被要求在其部门进行试点。\n\
    \n### 高层管理决策\n\n无论引入 RPA 的原因是什么，其成功实施的关键在于利益相关者的支持。是否有一位高级管理人员下令引入 RPA？如果是这样，在开始对\
    \ RPA 进行任何投入（时间、资源、基础设施等）之前，高级管理团队的其他关键成员必须认同这一概念。此外，更重要的是，中层管理人员必须看到其价值。\n\n\
    **提示**\n\n不要忽视中层管理人员和员工支持的重要性。这一层面的阻力可以迅速有效地破坏 RPA 计划。\n\n如果需要争取高级管理团队的其他成员，请做好准备工作。您需要从较高层面展示几项内容，这将有助于您说服他们相信\
    \ RPA 对组织的益处：\n\n1.  **行业标准**：许多组织正在转向自动化那些无需思考的手动、常规任务。例如，在金融服务领域，如果每次客户进行交易时都需要通知其财务顾问；这就是一个可以自动化的流程。可以从数据库中读取客户姓名，匹配到财务顾问，找到其电子邮件地址，然后自动完成模板并通过电子邮件发送给顾问。\n\
    \n进行必要的研究，了解 RPA 在行业中的实施情况。\n\n**暂停并思考**\n\n在许多组织中，员工工作努力，专注于手头的任务。他们通常看不到自己的工作如何实现自动化；他们可能多年来一直以相同的方式做着同样的工作。他们看不到哪些步骤可以被消除或流程可以如何改进。您将如何帮助人们寻找自动化的可能性？\n\
    \n2.  **组织内的具体示例**：您组织中有哪些具体流程可以从自动化中受益？您可能需要进行一些研究来发现这些流程。这将涉及与其他中层管理人员及其团队合作，这也有助于获得这一层面的支持。\n\
    \n**暂停并思考**\n\n对许多人来说，自动化任务意味着裁员。您将如何减轻这种担忧？或者，如果这确实是可能发生的情况，您将如何处理？各级管理者都不愿看到自己的团队规模缩减。他们的团队成员也会抵制任何可能让他们丢掉工作的措施。然而，人员减少可能是目标甚至是意外结果，这必须得到解决。\n\
    \n3.  **重新培训和重新部署员工的机会**，对工作将要被自动化的员工进行再培训和再部署，这也可能带来好处。\n\n**暂停并思考**\n\n在许多组织中，将人员重新部署到其他需要更多思考而非常规手动任务的责任，是自动化的目标之一。\n\
    \n解决这个问题的一种方法是制定人力资源人才发展战略。自动化可以释放资源，用于重新培训员工并将其转移到其他领域，在那里员工可以运用其技能，而不是从事死记硬背的手动任务。为了达成此目标，您需要在组织中与谁沟通？\n\
    \n4.  **益处**：当您讨论行业内的自动化以及组织内的一些示例时，请量化或定性说明潜在益处。这可能包括但不限于以下任何或全部内容：\n    *  \
    \ 客户满意度：客户（内部或外部）将获得更及时的信息。\n    *   提高准确性：自动化流程中不再有“人为错误”。\n    *   减少返工\n  \
    \  *   节约成本：减少人员编制，更有效地利用人员。\n    *   竞争优势：能够比竞争对手更快地向客户提供信息，或至少与其保持同步。\n    *\
    \   节省时间：所需信息能更快速地传递给决策者。\n    *   更及时地遵守政府法规：耗时的报告可以自动化并及时发送给相应的政府机构，从而减少或消除罚款风险。\n\
    \    *   提高员工士气，带来更好的工作绩效并降低人员流动率。\n\n请记住，最初预估的益处仅仅是初步估计。不要过度承诺。指出您所在行业的总体趋势和益处，突出组织中可能实现自动化的候选流程，并给出潜在益处的总体估计。*注意不要保证一定会产生某些特定效益*。这样做，一旦这些效益未能实现，就百分百会导致整个项目被取消。在这一点上，您是依据行业成果和自身专业知识给出估计。但\
    \ RPA 对您的组织来说是全新的，需要时间和实践来提高您的估算准确性。\n\n**提示**\n\n您无需保证特定结果来获得支持；目前您也无法做到。解释潜在益处，并建议先在少数流程中尝试这个新方案。\n\
    \n如果高级管理层已强制要求实施 RPA 计划，那么在开始实施之前，您必须获得中层管理人员的支持。使用下一节中的信息来做到这一点。\n\n### 中层管理构想\n\
    \n无论想法的来源如何，某些步骤将是相同的。此情况下的主要区别在于，您没有高级领导者支持这一想法。这是一个挑战，但并非无法克服。\n\n同样，有必要对 RPA\
    \ 进行整体研究，特别是针对您所在行业进行必要的研究。既要看到收益，也要看到缺点。找到以下问题的答案：\n\n*   您所在行业内部有哪些类型的流程正在实现自动化？\n\
    \    *   为什么它们会被自动化？\n*   结果如何？\n*   在您的行业中成功实施 RPA 面临哪些挑战？\n    *   这些挑战是如何被克服的（如果已被克服）？\n\
    *   如何在您的组织中克服这些挑战？应该与哪些关键人物就此进行沟通？\n\n**提示**\n\n前面已经提到了一些挑战，包括员工对裁员的恐惧。\n\n一旦您彻底调查了\
    \ RPA 在行业内的收益和实施情况，您就需要确定盟友。谁将是“早期采用者”？这些人是您需要争取过来支持该计划的人。（注意：如果高级管理层已强制要求实施 RPA，请使用这些步骤来获得中层管理人员的支持）。\n\
    \n**暂停并思考**\n"
- fmt: "# For Early Adopters\n\nFor early adopters (people who will be willing to\
    \ start using RPA almost immediately), consider first your peers who are likely\
    \ to be interested. Who manages areas where there are repetitive, manual processes?\
    \ Who is frustrated by the lack of time their staff has to work with clients,\
    \ because they must perform repetitive, manual processes? Identifying these people\
    \ will be key to your success.\n\nInformal conversations with peers will assist\
    \ you in knowing who might be most interested. Once you have a few names, be direct.\
    \ Explain to them that you are considering proposing RPA to senior management.\
    \ Ask these questions:\n\n* What processes do you have that are repetitive and\
    \ manual that might be good candidates for automation?\n* Would you be willing\
    \ to pilot RPA with one of your processes?\n* How would your team react to RPA?\
    \ Would there be fear of layoffs, or would team members be anxious to spend less\
    \ time on these manual processes and more on \"thought-provoking tasks\" (tasks\
    \ that take actual thought, not just performing those rote tasks)?\n* What time\
    \ frame might be workable for them to try an automation?\n\n## Pause and Consider\n\
    \nExactly how you will progress with RPA implementation is unknown at this stage,\
    \ but you must still have a clear strategy. People are uncomfortable with uncertainty\
    \ and will cling to what is known and familiar. How will you articulate a strategy\
    \ that is not step-by-step specific, but that still outlines the overall plan?\n\
    \n> **Tip:** While you don't need a crowd of middle managers to buy-in at this\
    \ point, getting at least a few will strengthen your argument with senior management.\n\
    \nCompile the information you have received. If you don't feel confident that\
    \ you have the necessary support at the middle-management level, do not proceed!\
    \ Continue to work to build that support, but moving forward without some enthusiastic\
    \ support is a recipe for disaster.\n\nAssuming you receive the support of a sufficient\
    \ number of middle managers (what that number is will differ depending on the\
    \ size of the company), prepare a short presentation for senior management. It\
    \ should include the following information:\n\n* Overview of RPA\n  * What it\
    \ is\n* Review of RPA successes within your industry\n* Review of RPA challenges\
    \ within your industry\n  * Discussion of how you anticipate overcoming those\
    \ challenges\n* List of middle-managers willing to pilot the program\n  * List\
    \ of potential processes to be automated\n\n## Pause and Consider\n\nWhat is the\
    \ correct amount of information for senior management? Remember, senior management\
    \ members don't need all the detailed information to make a decision. They need\
    \ to understand at a high level what you want to do, how you will do it, and how\
    \ it will impact them. Keep these things in mind as you prepare and deliver your\
    \ presentation. After you create your presentation, be willing to edit it, to\
    \ remove details that may be required for middle management, but not for senior\
    \ management.\n\nBe prepared to answer questions, but don't hesitate to admit\
    \ if you need to further research something that has been asked. However, if your\
    \ presentation is at the right level (see \"Pause and Consider\"), there should\
    \ be few questions. But if there are questions, get the answers and email the\
    \ senior management team with them as soon as possible. If in getting the answers,\
    \ any of your earlier assumptions or information change, be sure to relay that\
    \ information.\n\n> **Tip:** If you can't get buy-in right now, do some more research.\
    \ Learn what your peers in the industry are doing and understand both their successes\
    \ and failures. Do not attempt to implement a new program without the required\
    \ buy-in. Doing so may result in failure.\n\nOnce you have received senior management's\
    \ approval, which will only occur after you have obtained the support of some\
    \ members of middle management, you are ready to begin.\n\nRemember, regardless\
    \ of the trigger for introducing RPA implementation in your organization, it is\
    \ vital that you obtain senior management and middle-management buy-in.\n\n##\
    \ Different Triggers for RPA Introduction\n\nThere are many reasons for the introduction\
    \ of RPA into an organization: it could be because a senior manager has become\
    \ familiar with the concept and sees the potential advantages to the organization.\
    \ Perhaps a mid-level manager, dealing with many repetitive, manual processes,\
    \ recognizes that automation will be highly beneficial. Or a technology leader\
    \ could see how their skills could be utilized to increase efficiency. The way\
    \ you introduce RPA to your organization will depend on why it is being introduced.\
    \ The overall benefit is the same: increased automation of previously manually\
    \ performed tasks. But the successful introduction of RPA requires that you know\
    \ how best to present it, and knowing why it is being brought in is key to determining\
    \ how to begin it.\n\nOnce you have accomplished that, you are ready to proceed\
    \ to the next step.\n\n### A Technology Leader Recognizes RPA\n\nThe same steps\
    \ in number 2 will be used: find early adopters, identify potential projects,\
    \ and make a convincing presentation to senior management. However, this could\
    \ be more challenging. Senior management members, often more business-focused\
    \ than technology-focused, may see this as some \"cool new thing\" that technology\
    \ is excited about. You will need to assure that the benefits to the business\
    \ are highlighted.\n\n> **Tip:** In Chapter [4](#513218_1_En_4_Chapter.xhtml),\
    \ we introduce a case study and demonstrate in that and through succeeding chapters\
    \ how each phase of RPA would apply to it. You may find reviewing that case study\
    \ helpful as you work with senior and middle management."
