- fmt: '# 8. Organizational Structure


    One very important aspect to remember about Robotic Process Automation software
    is that it doesn’t require companies to have a full organizational makeover nor
    a huge IT transformation. Simply stated, there is no need to make any radical
    changes to the core business processes or existing back-office technologies. For
    attended Bots, standard desktop application software is installed, and for unattended
    robotics, a virtual desktop server can be set up, or RPA can be integrated into
    an existing virtual desktop environment. All this makes it very easy to quickly
    implement RPA in any organization, despite its size or structure.


    When rolling out an RPA program, rather than focusing on tool selection, focus
    on team enablement (team structure, training, etc.), the operating environment,
    and on overall RPA governance. Each organization will have different needs, and
    you need to assure that your new RPA program fits your organization. Selecting
    RPA software will be easier after you have the RPA structure established.


    Pause and Consider


    How will you structure your RPA team? What roles will be required in your organization?
    What training will each person require? Who will decide on an RPA tool? How will
    you recommend a tool? What research will you do? Giving these issues careful consideration
    will assist you in successfully implementing an RPA program in your organization.


    The RPA program’s organizational structure provides the model of the framework
    for deploying RPA at the enterprise level. As we addressed in Chapter [3](#513218_1_En_3_Chapter.xhtml),
    choosing the right path for an RPA program will make a huge difference between
    a successful RPA program and failure that leads to inadequate results and ultimately
    high cost. These issues could cause withdrawal of executive sponsorship and ultimately
    cut off financial investment in RPA. The organizational structure of RPA-related
    functions in an organization is important, because it is not only related to costs
    but also to decision-making that will define a long-term vision and drive strategy
    to execution. Who makes those strategic decisions is clearly an important factor
    in how well an organization achieves its business value.


    The optimal organizational structure will depend on an individual RPA program
    strategy, size of the serving population or business operations, operations complexity,
    management culture, organizational design, risk tolerance, and many other factors.


    In this chapter, we will review in depth the three most common structures that
    were briefly introduced in Chapter [3](#513218_1_En_3_Chapter.xhtml): centralized,
    decentralized, and hub and spoke. We will fully describe their benefits and the
    possible drawbacks of each. We also will discuss which RPA program functions could
    be outsourced and which should be in-house, required architecture and support
    for the robotic operating environment, and how they all fit into the enterprise
    IT architecture.


    We will also help you to understand how to determine the right degree of centralization
    and decentralization for your organization and how the organizational structure
    may change as the RPA program becomes more mature.


    For any RPA program, the following functions are required:


    - *Architecture of the robotic operating environment* (infrastructure support,
    technology choice)

    - *RPA operations* (maintenance, support, monitoring, training of new resources,
    change management)

    - *Governance and strategy* (integration to overall organizational structure,
    oversight of resources responsible to support all functionalities of the RPA program,
    compliance to policies and procedures, security system access, process prioritization,
    escalation path)

    - *Delivery* (process discovery and assessment, solution design, testing, deployment,
    development of standards)


    ## Centralized


    In a centralized model, the functions mentioned earlier are part of a centralized
    IT division or unit that is under single executive leadership with full control
    on decision-making, defining strategy, and with sufficient financial resources.


    This IT division is typically designed as a Center of Excellence (COE) that is
    established within one executive office and manages the entire life cycle of the
    RPA program: defining strategy for RPA on the enterprise level, technology choice,
    architectural and operating infrastructure, operations support, delivery RPA solutions,
    developing standards, and ensuring that adequate controls, risk management, and
    compliance are in place. This means it oversees all functions required throughout
    the end-to-end life cycle of the RPA program.


    An effective RPA COE means far more than establishing a generic IT team consisting
    of skilled and experienced developers. It requires the creation of a program consisting
    of many different roles that need to be filled with the right people who will
    fulfill all critical tasks required for each function. Those roles include the
    following: RPA program sponsor, operations and program lead, project manager,
    RPA/business analysts, solution architect, developers, IT infrastructure engineers,
    operations support and service staff, and risk and control team.


    ![../images/513218_1_En_8_Chapter/513218_1_En_8_Fig1_HTML.jpg](images/513218_1_En_8_Chapter/513218_1_En_8_Fig1_HTML.jpg)


    Figure 8-1


    Centralized model


    ### Benefits


    A centralized model works best for companies that need greater control in terms
    of the RPA strategy, cost, execution, and visibility. This structure leads to
    lower costs associated with hardware licensing by having all that is needed in
    one place. When it is distributed across the enterprise, oftentimes extra or duplicate
    equipment and licensing are needed that would lead to increased redundancy and
    inconsistency in methodology and tools. This can contribute to the technical department
    budget and ultimately increase overall costs of the program.


    The centralized model gathers under one umbrella the collective resources and
    expertise that are required to deliver the RPA implementation successfully. This
    enables those in charge to view all initiatives in a centralized place and gives
    them stronger governance abilities over projects and priorities. It enables an
    end-to-end view of process changes, leading to more beneficial opportunity identification.
    A central model also provides a standard set of regulations and practices for
    assessment, delivery, monitoring, and maintenance.


    Ultimately, all of the above attributes make scaling the program easier.


    ### Disadvantages


    As with any type of centralization, this model establishes a structure in which
    the decision-making powers are concentrated in a few leaders, and this could potentially
    lead to the creation of bureaucratic leadership. In this structure, decisions
    are made at the top and then cascaded to lower management for execution. It prevents,
    or at least limits, employees from different areas from contributing to the program’s
    strategic direction, continuous improvement, and overall program maturity. As
    a result of such a decision-making environment, the employees could be disengaged,
    and they could lack motivation or loyalty, be hesitant to present innovative ideas,
    and demonstrate overall poor performance.'
