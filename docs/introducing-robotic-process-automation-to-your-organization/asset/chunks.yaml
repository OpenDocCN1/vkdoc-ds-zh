    # 4. Opportunity Identification


    Robotic Process Automation (RPA) is rapidly gaining popularity. Yet one of the
    main issues regards knowing which process to automate.


    One of the most critical choices made with an RPA program is which processes are
    candidates for applying RPA.


    While organizations are well aware of RPA, they are still trying to figure out
    the magic formula of RPA implementation. There isn’t one, but the information
    in this book will assist in successfully implementing an RPA program at your company.


    An article in *Sagacity Software* expressed this dilemma succinctly:*The company
    that is implementing RPA technology must ensure that it is choosing the right
    processes to be modified. It is quite often the case that companies cannot automate
    all of their processes. Selecting the right processes can be a major challenge.
    If an organization chooses to implement the technology in too many of its processes,
    then it could cause a lot of disruption. At the same time, not implementing RPA
    in an adequate number of processes could hamper its effectiveness. Therefore,
    companies must find the right balance when it comes to implementation.*^([⁸](#fn8))


    Setting up the initial business case and identifying the right processes for automation
    can be complex. Attempting automation of unsuitable processes is one of the main
    causes of an organization’s failure to realize the full potential of RPA capability
    to reimagine their business operations and propel toward digital transformation.


    Pause and Consider


    What challenges to RPA do you see in your organization? How will you address them?
    How will you manage expectations so that RPA is not seen as a “silver bullet”
    to resolve all problems, but will be viewed as an important step in saving time
    and reducing errors?


    As we mentioned in a previous chapter, the RPA Solution Lifecycle starts with
    how RPA candidate processes are to be identified.


    Please note that once you have established the RPA program at your organization,
    there will be two other related events that will require you to take the steps
    that follow in this and subsequent chapters: enhancements and defects. Enhancements
    occur when it is requested that a Bot that is handling a process is improved or
    changed to be able to perform more of the manual tasks. Also, there are times
    when a second process that is similar to the first is proposed for automation,
    and enhancing the existing Bot may be all that is required. In either of these
    cases, the request will be identified, assessed, etc.


    Regarding defects, minor ones will be corrected without going through the process,
    but major ones should follow the process to assure that they are reasonable in
    terms of time and money to do the fix.


    The basic request can occur in different ways: an informal hallway conversation
    followed by a meeting to capture required details to move forward with the request,
    or a requestor may have submitted a request form which provided required information.


    The information on the request form represents the first look at the opportunity,
    and consequently, there is much unknown information at this point.


    A request form provides the bare essentials of the request. It is used to decide
    whether or not to proceed to the next step or if the project should go no further
    at this time.


    At this point, what is required is not sufficient information to decide on completing
    the project, but sufficient information to make one of the decisions referenced
    previously. If it is approved to move to the next step, more information will
    be gathered, and upon completion of that step, another determination will be made
    regarding moving forward.


    A project can be cancelled at any time; there are many valid reasons for initially
    approving a project and then later cancelling it. For example, the preliminary
    estimates of dollar savings may, when more information is gathered in a later
    stage, prove to have been inflated. A more accurate estimate may preclude the
    benefits of spending money to automate the process. Or an automation that originally
    seemed to be fairly simple may, on closer look at a later stage, prove to be far
    more complex. As new information is gained, the sponsors must decide if there
    is still a sufficient return on investment (ROI) to proceed with the automation.
    If not, it is cancelled, and the stakeholders are advised of that fact and of
    the reasons.


    A request that is accepted originally and later cancelled does not represent a
    failure. It is far better to expend some resources (time, money, etc.) on a project
    that appears feasible, but then, at some point during the project, cut losses
    and cancel it, than it is to proceed with the project to its conclusion and then
    realize it doesn’t satisfy the need, went way over budget, etc.


    Also, just because a request is either refused or cancelled after starting does
    not mean it will never be done. The requestor should be advised that due to current
    priorities and the fact that their request doesn’t satisfy some criteria (e.g.,
    insufficient savings, high complexity, etc.), it will not be a high-priority item
    at the present time, but will be re-evaluated in the future.'
  trans: '

    一个灵活的框架，包含必要的角色和流程，是确保`RPA`计划内的成功并非“一次性成果”，而是可以重复实现的关键。


    `治理`——用于控制和监控`RPA`计划的规则、实践和流程——将是成功的关键。拥有有效的`项目发起人`——负责确保`RPA`获得必要支持并实现预期收益的高级管理层——也是`RPA`成功的“必备条件”。确保存在一个广泛的`框架`，能够让参与`RPA`计划的人员在其中拥有灵活的工作结构，确保他们知道预期目标，同时仍能适应不断变化的需求和情况。


    脚注 1 2 3 4 5 6


    # 4. 机会识别


    机器人流程自动化（`RPA`）正迅速流行起来。然而，主要问题之一在于了解哪些流程适合自动化。


    在`RPA`计划中，最关键的决策之一就是确定哪些流程是应用`RPA`的候选对象。


    尽管组织对`RPA`非常了解，但他们仍在努力寻找`RPA`实施的“神奇公式”。实际上并不存在这样的公式，但本书中的信息将有助于您在贵公司成功实施`RPA`计划。


    *Sagacity Software* 的一篇文章简洁地阐述了这一困境：*实施`RPA`技术的公司必须确保选择正确的流程进行改造。通常情况下，公司无法实现所有流程的自动化。选择合适的流程可能是一项重大挑战。如果一个组织选择在过多的流程中实施该技术，则可能造成大量混乱。同时，若在数量不足的流程中实施`RPA`，又会削弱其有效性。因此，公司在实施时必须找到恰当的平衡点。*^(⁸)


    建立初始商业案例并识别适合自动化的流程可能很复杂。尝试对不合适的流程进行自动化，是组织未能充分发挥`RPA`能力以重塑其业务运营并推动数字化转型的主要原因之一。


    暂停思考


    您在您的组织中看到了哪些`RPA`挑战？您将如何应对这些挑战？您将如何管理预期，使其不将`RPA`视为解决所有问题的“银弹”，而是将其视为节省时间和减少错误的重要一步？


    正如我们在前一章中提到的，`RPA`解决方案生命周期始于如何识别`RPA`候选流程。


    请注意，一旦您在组织内建立了`RPA`计划，将会出现另外两个相关事件，要求您遵循本章及后续章节中的步骤：增强和缺陷。当要求改进或更改处理某个流程的`Bot`以使其能够执行更多手动任务时，就会发生增强。此外，有时会提出将第二个与第一个相似的流程进行自动化，这种情况下，可能只需要增强现有的`Bot`。在这两种情况下，请求都会被识别、评估等。


    关于缺陷，小缺陷将在不经过完整流程的情况下被纠正，但重大缺陷应遵循流程，以确保在时间和成本方面进行修复是合理的。


    基本请求可以通过不同方式提出：一次非正式走廊谈话后通过会议来获取推进请求所需的详细信息，或者请求者可能已经提交了包含所需信息的请求表单。


    请求表单上的信息代表着对机会的初步审视，因此，此时存在大量未知信息。


    请求表单提供了请求的基本要素。它用于决定是进入下一步，还是项目此时应就此终止。


    此时，所需的信息不足以决定是否完成项目，但足以做出前述决策之一。如果获批进入下一步，将收集更多信息，并在该步骤完成后，再次就推进事宜做出决定。


    项目可以在任何时候被取消；最初批准一个项目后来又取消它，存在许多合理的理由。例如，对节省金额的初步估算，可能在后续阶段收集到更多信息后被证明是夸大的。更准确的估算可能会排除花钱自动化该流程的收益。或者，一个最初看似相当简单的自动化，在后续阶段仔细审视后，可能被证明复杂得多。随着新信息的获得，项目发起人必须判断自动化是否仍能带来足够的投资回报率（`ROI`）。如果不能，项目将被取消，并通知相关利益方这一事实及原因。


    一个最初被接受但后来被取消的请求并不代表失败。在一个看似可行的项目上投入一些资源（时间、金钱等），然后在项目进行到某个阶段时及时止损并取消它，远比将项目进行到底，却发现它未能满足需求、严重超预算等要好得多。


    另外，一个请求被拒绝或在启动后被取消，并不意味着它永远不会被执行。应告知请求者，由于当前的优先级以及他们的请求不符合某些标准（例如，节省不足、复杂性高等），该项目目前不会是高优先级事项，但未来会重新评估。

    '
- fmt: "## Request Form\n\nThis is a sample request form; you can also find it in\
    \ Appendix 1.\n\n*RPA* Opportunity *– Request Form*\n\n| **Initiative Name** |\
    \  |\n| **Sponsor** |  |\n| **Champion** |  |\n| **How Does the Process Currently\
    \ Work?** |  |\n| **What Is the Goal?** |  |\n| **Common Business Drivers/Business\
    \ Criticality** |  |\n| **Impacted Business Areas** | **Impacted Systems/Tools**\
    \ |\n| **Opportunity Type** | **Duration of the Solution?** | **Estimated Operational\
    \ Benefits (FTE Hours)** |\n| **Priority** | **Desired Delivery Date** |\n| **Form\
    \ Completed Date:** | | **Prepared by:** | |\n\nThe typical components of a request\
    \ form are the following:\n\n- Name of requested project\n- Sponsor: This is the\
    \ person, usually an executive leader, within whose budget the organization requesting\
    \ the automation resides.\n- Champion: This is the leader directly responsible\
    \ for the process that is proposed to be automated. They will also be responsible\
    \ for removing any roadblocks that may occur and allocating required resources\
    \ that would be needed during the automation development, testing, and deployment\
    \ phases.\n- Current process description: The current-state process is summarized\
    \ in sufficient detail that anyone reading it has a comprehensive idea of the\
    \ purpose, process flow, repetitive nature of the process, and the reason it is\
    \ a candidate for automation.\n- Implementation goals: This indicates what portion\
    \ of the process, or the entire process, is proposed for automation. It briefly\
    \ lists the benefits of automating the process.\n- Business criticality: This\
    \ section describes why this process must or should be automated at this time\
    \ and how it is aligned to strategic business goals. Is there a competitive need?\
    \ Is there exposure to high risks? Are clients complaining about something that\
    \ would be resolved with this automation? Etc.\n- Common business drivers: Some\
    \ possible examples include, but are not limited to, the following.\n  - Reduced\
    \ cycle time\n  - Improved consistency and quality of work\n  - Allows staff to\
    \ work on higher value activities\n  - Etc.\n- Impacted business areas: This lists\
    \ the business units that would be impacted by this automation.\n- Impacted systems/tools:\
    \ There may be specific systems that have been purchased or developed that will\
    \ be impacted; these should be listed here. Also, any tools, including `Excel`,\
    \ `Outlook`, `Word`, etc., are listed here.\n- Opportunity type: Note here if\
    \ this is a one-time automation, possibly to clean up months or years of backlog,\
    \ or if it will be ongoing.\n- Life span estimation: If the process is expected\
    \ to be phased out within a certain time frame, or if the anticipated purchase\
    \ of a new tool in, for example, 3Q2X, will resolve it, note it here.\n- Desired\
    \ delivery date: Indicate when the automation is optimally desired.\n- Estimated\
    \ operational benefits: This is generally the savings in time and cost, but not\
    \ every requested automation has a significant time and cost savings. Some are\
    \ required to meet regulatory or competitive requirements. Some are needed to\
    \ reduce the risk of human error. If the automation will result in some time and\
    \ cost savings or revenue gains, this should be explained in detail here.\n  -\
    \ For example:\n    - 5 staff members spend 3 hours a week on this process\n \
    \   - 5 X 3 = 15 hours per week\n    - 15 hours per week X 52 weeks = 780 hours\
    \ per year\n\nIf a process is to be automated to save time and money, an annual\
    \ savings of about 1,500 labor hours, or one full-time position, may be required\
    \ to justify the solution development and maintenance cost. However, this will\
    \ be different in different organizations, so it is important to establish the\
    \ right criteria for yours.\n\n- Form complete date: Self-explanatory.\n- Prepared\
    \ by: Self-explanatory.\n\nTip\n\nWhile initial requests may be in the form of\
    \ emails, or even informal hallway conversations, standardizing the request form\
    \ and encouraging its use will be highly beneficial.\n\nPause and Consider\n\n\
    Based on this information, what might a request form look like in your organization?\
    \ Is there additional information that should be captured? The information above,\
    \ and the template in Appendix 1, are what we have found useful as a basis, but\
    \ different organizations may require slightly different components. However,\
    \ the information shown here includes the basics.\n\nAs mentioned, one of the\
    \ possible outcomes of this phase may be the rejection of the request. There may\
    \ be situations where information provided on the request form is sufficient to\
    \ conclude that automation is not feasible under current circumstances, possibly\
    \ because of the process complexity, RPA-limited capability, or even short life\
    \ span of the solution. The requestor should be advised of this and given any\
    \ possible recommendations to assist in overcoming whatever issues were to be\
    \ solved by automation.\n\nOnce an initial request has been submitted and didn’t\
    \ raise any feasibility concerns, it is ready to move to the next step."
  raw: "## Request Form\n\nThis is a sample request form; you can also find it in\
    \ Appendix 1.\n\n*RPA* Opportunity *– Request Form*\n\n| **Initiative Name** |\
    \   |\n| **Sponsor** |   |\n| **Champion** |   |\n| **How Does the Process Currently\
    \ Work?** |\n| **What Is the Goal?** |\n| **Common Business Drivers/Business Criticality**\
    \ |\n| **Impacted Business Areas** | **Impacted Systems/Tools** |\n| **Opportunity\
    \ Type** | **Duration of the Solution?** | **Estimated Operational Benefits (FTE\
    \ Hours)** |\n| **Priority** | **Desired Delivery Date** |\n| **Form Completed\
    \ Date** **:** |   | **Prepared by:** |   |\n\nThe typical components of a request\
    \ form are the following:\n\n*   Name of requested project\n\n*   Sponsor: This\
    \ is the person, usually an executive leader, within whose budget the organization\
    \ requesting the automation resides.\n\n*   Champion: This is the leader directly\
    \ responsible for the process that is proposed to be automated. They will also\
    \ be responsible for removing any roadblocks that may occur and allocating required\
    \ resources that would be needed during the automation development, testing, and\
    \ deployment phases.\n\n*   Current process description: The current-state process\
    \ is summarized in sufficient detail that anyone reading it has a comprehensive\
    \ idea of the purpose, process flow, repetitive nature of the process, and the\
    \ reason it is a candidate for automation.\n\n*   Implementation goals: This indicates\
    \ what portion of the process, or the entire process, is proposed for automation.\
    \ It briefly lists the benefits of automating the process.\n\n*   Business criticality:\
    \ This section describes why this process must or should be automated at this\
    \ time and how it is aligned to strategic business goals. Is there a competitive\
    \ need? Is there exposure to high risks? Are clients complaining about something\
    \ that would be resolved with this automation? Etc.\n\n*   Common business drivers:\
    \ Some possible examples include, but are not limited to, the following.\n   \
    \ *   Reduced cycle time\n\n*   Improved consistency and quality of work\n\n*\
    \   Allows staff to work on higher value activities\n\n*   Etc.\n\n*   Impacted\
    \ business areas: This lists the business units that would be impacted by this\
    \ automation.\n\n*   Impacted systems/tools: There may be specific systems that\
    \ have been purchased or developed that will be impacted; these should be listed\
    \ here. Also, any tools, including Excel, Outlook, Word, etc., are listed here.\n\
    \n*   Opportunity type: Note here if this is a one-time automation, possibly to\
    \ clean up months or years of backlog, or if it will be ongoing.\n\n*   Life span\
    \ estimation: If the process is expected to be phased out within a certain time\
    \ frame, or if the anticipated purchase of a new tool in, for example, 3Q2X, will\
    \ resolve it, note it here.\n\n*   Desired delivery date: Indicate when the automation\
    \ is optimally desired.\n\n*   Estimated operational benefits: This is generally\
    \ the savings in time and cost, but not every requested automation has a significant\
    \ time and cost savings. Some are required to meet regulatory or competitive requirements.\
    \ Some are needed to reduce the risk of human error. If the automation will result\
    \ in some time and cost savings or revenue gains, this should be explained in\
    \ detail here.\n\n*   For example:\n    *   5 staff members spend 3 hours a week\
    \ on this process\n\n*   5 X 3 = 15 hours per week\n\n*   15 hours per week X\
    \ 52 weeks = 780 hours per year\n\nIf a process is to be automated to save time\
    \ and money, an annual savings of about 1,500 labor hours, or one full-time position,\
    \ may be required to justify the solution development and maintenance cost. However,\
    \ this will be different in different organizations, so it is important to establish\
    \ the right criteria for yours.\n\n*   Form complete date: Self-explanatory.\n\
    \n*   Prepared by: Self-explanatory.\n\nTip\n\nWhile initial requests may be in\
    \ the form of emails, or even informal hallway conversations, standardizing the\
    \ request form and encouraging its use will be highly beneficial.\n\nPause and\
    \ Consider\n\nBased on this information, what might a request form look like in\
    \ your organization? Is there additional information that should be captured?\
    \ The information above, and the template in Appendix 1, are what we have found\
    \ useful as a basis, but different organizations may require slightly different\
    \ components. However, the information shown here includes the basics.\n\nAs mentioned,\
    \ one of the possible outcomes of this phase may be the rejection of the request.\
    \ There may be situations where information provided on the request form is sufficient\
    \ to conclude that automation is not feasible under current circumstances, possibly\
    \ because of the process complexity, RPA-limited capability, or even short life\
    \ span of the solution. The requestor should be advised of this and given any\
    \ possible recommendations to assist in overcoming whatever issues were to be\
    \ solved by automation.\n\nOnce an initial request has been submitted and didn’t\
    \ raise any feasibility concerns, it is ready to move to the next step."
  trans: "\n## 申请表\n\n这是一份申请表样例；你也可以在附录 1 中找到它。\n\n*RPA* 机会 *– 申请表*\n\n| **倡议名称**\
    \ |  |\n| **发起人** |  |\n| **负责人** |  |\n| **当前流程如何运作？** |  |\n| **目标是什么？** | \
    \ |\n| **常见业务驱动因素/业务关键性** |  |\n| **受影响的业务领域** | **受影响的系统/工具** |\n| **机会类型** |\
    \ **解决方案的持续时间？** | **预估运营效益（FTE 工时）** |\n| **优先级** | **期望交付日期** |\n| **表格填写日期：**\
    \ | | **编制人：** | |\n\n申请表通常包含以下组成部分：\n\n- 项目名称\n- 发起人：通常为高层领导，负责该自动化项目所在组织的预算。\n\
    - 负责人：直接负责拟自动化流程的领导者。他们还负责排除可能出现的障碍，并在自动化开发、测试及部署阶段分配所需资源。\n- 当前流程描述：对当前流程进行充分详细的总结，使阅读者能够全面了解其目的、流程流转、重复性特征，以及该流程适合自动化的原因。\n\
    - 实施目标：说明拟将流程的哪一部分或整个流程实现自动化，并简要列举自动化带来的益处。\n- 业务关键性：此部分阐述为何当前必须或应该对该流程实施自动化，以及该自动化如何与战略业务目标保持一致。是否存在竞争需求？是否面临高风险？客户是否在投诉某些可通过自动化解决的问题？等等。\n\
    - 常见业务驱动因素：一些可能的示例（包括但不限于）如下。\n  - 缩短周期时间\n  - 提高工作的一致性和质量\n  - 允许员工从事更高价值的活动\n\
    \  - 等等。\n- 受影响的业务领域：列出将受此自动化影响的业务单元。\n- 受影响的系统/工具：可能涉及已购买或已开发的特定系统并将受到影响，应在此列出。此外，任何工具，包括`Excel`、`Outlook`、`Word`等，也应在此列出。\n\
    - 机会类型：在此注明这是否是一次性自动化（可能用于清理数月或数年的积压工作），还是将持续进行的自动化。\n- 存续期预估：如果该流程预计在特定时间范围内被淘汰，或者预期在例如第三季度购买的新工具将解决此问题，请在此说明。\n\
    - 期望交付日期：指明自动化的最佳期望交付时间。\n- 预估运营效益：这通常是指时间和成本的节省，但并非每个申请自动化的项目都能显著节省时间和成本。有些是为了满足监管或竞争要求，有些是为了降低人为错误的风险。如果自动化能带来时间成本节约或收入增长，应在此详细说明。\n\
    \  - 例如：\n    - 5 名员工每周花 3 小时处理此流程\n    - 5 X 3 = 每周 15 小时\n    - 每周 15 小时 X 52\
    \ 周 = 每年 780 小时\n\n如果为了节省时间和金钱而实施流程自动化，可能需要每年节省约 1,500 个工时（或一个全职岗位），才能证明解决方案开发和维护成本的合理性。然而，这在不同的组织中会有所不同，因此为你的组织建立正确的标准至关重要。\n\
    \n- 表格填写日期：顾名思义。\n- 编制人：顾名思义。\n\n提示\n\n尽管最初的请求可能以邮件甚至非正式的走廊交谈形式提出，但将申请表标准化并鼓励使用将非常有益。\n\
    \n暂停并思考\n\n根据这些信息，你所在组织的申请表可能会是什么样子？是否还应收集其他信息？上述信息及附录 1 中的模板是我们发现作为基础比较有用的内容，但不同组织可能需要略微不同的组成部分。不过，此处展示的信息已包含基本要素。\n\
    \n如前所述，此阶段可能的结果之一是请求被拒绝。可能存在以下情况：申请表上提供的信息足以断定在当前环境下自动化不可行，原因可能包括流程复杂性、RPA 能力有限，或者解决方案的存续期过短。应告知请求者这一情况，并给出任何可行的建议，以帮助解决原本拟通过自动化来解决的问题。\n\
    \n一旦初始请求提交且未引发任何可行性问题，即可进入下一步骤。\n"
- fmt: "# Process Discovery Phase\n\nIt is vital to evaluate each individual process\
    \ candidate to ensure RPA is a right solution to the current situation. It also\
    \ ensures that the automation initiatives will be successful in your organization.\
    \ In order for the RPA team and Governance Committee to make an informed decision\
    \ about whether or not to proceed with automation development, they have to have\
    \ sufficient information about the process candidate. The process discovery phase\
    \ is preliminary to the opportunity assessment phase (please see [Chapter 5](#513218_1_En_5_Chapter.xhtml)),\
    \ and it’s where all information for making critical decisions is gathered. It’s\
    \ important to do it right in order to avoid beginning to automate a process that\
    \ is not a suitable candidate for automation.\n\nProcess discovery can be done\
    \ by going through the process-related documentation and extracting required information\
    \ to provide a summary for the decision-makers. This approach is simple and quick;\
    \ however, it can leave room for errors due to inaccurate assumptions or outdated\
    \ information in the reference documentation. And what if there is no proper process\
    \ documentation available?\n\nAs noted in BPM Resource Center: *In many organizations,\
    \ day to day activities may be so ingrained and routine that it’s not always clear\
    \ what the exact steps are in a given process. Different members of the organization\
    \ may not know what happens to an item once it leaves their hands. Official process\
    \ write-ups that you might find in the corporate operations or policy guides might\
    \ not map what actually is being performed.*^([⁹](#fn9))\n\nAll of this leads\
    \ to a high probability that when the solution design phase begins, the RPA team\
    \ would discover extreme complexity, operational risks, and/or overstated benefits\
    \ of what the automation of the process might yield.\n\nTherefore, the recommended\
    \ approach for process discovery can be as simple as gathering teams together\
    \ (physically or virtually) and discussing and documenting (mapping and including\
    \ a corresponding written description) how a particular process is actually performed.\
    \ Through discussion and interviews with the people directly involved, you can\
    \ usually discover the end-to-end steps of a process across teams, departments,\
    \ divisions, etc. During this collaboration, you can also extract key metrics\
    \ (volumes, costs, and other measurements) that can help determine if making improvement\
    \ investments will yield the results you seek to meet strategic goals.\n\nThere\
    \ are a number of BPMS (Business Process Management Software) tools that can facilitate\
    \ or even partially automate the process discovery phase. By mining existing information\
    \ systems and analyzing event and transaction logs, you can document the actual\
    \ work being done (who did what, when, for how long). Today, new emerging technology\
    \ tools can read in data from various systems and present that information in\
    \ flow diagrams, charts, and in other ways to help you understand process steps,\
    \ bottlenecks, and more.\n\nHowever, often such tools are not available, and that\
    \ is why identifying the right subject matter experts (SMEs) and meeting with\
    \ them is key to success.\n\n> **Tip**\n> \n> Do not be discouraged if automation\
    \ tools (event and transaction logs, etc.) are not readily available. Processes\
    \ for automation can be readily identified through meetings with SMEs. Automation\
    \ tools are an advantage, but not absolutely required.\n\nAs every organization\
    \ suffers from some inherent inefficiencies in their processes, they require a\
    \ method like process discovery that can help them access task-level data and\
    \ the various nuances of interactions between humans and systems. While all companies\
    \ establish standard operating procedures, in reality, they often go unheeded.\
    \ Until these procedures are completely locked down, many employees will invent\
    \ their own ways to operate. This is why the existing documentation of any process\
    \ may not be reliable; it is necessary to know how the work is actually being\
    \ done, which is often very different from how it is supposed to be done (according\
    \ to existing documentation). In addition, many companies outsource their processes\
    \ to other BPM vendors, leaving their leaders unfamiliar with the execution of\
    \ their own processes.\n\nIn most cases, especially during the initial introduction\
    \ of RPA, business processes are documented through manual process mapping. This\
    \ consists of a high-level flow chart (map, usually using `Visio` or a similar\
    \ software) and then describing each task in more detail in a separate Word document.\n\
    \nThese two documents are enhanced by including information, as indicated earlier,\
    \ regarding systems and tools, volume, time the process steps take, potential\
    \ constraints to automation (if known at this time), and any other pertinent details\
    \ as noted in the request form.\n\nThis information is then compiled for presentation\
    \ to the governance committee.\n\n> **Pause and Consider**\n> \n> As a program\
    \ matures, the opportunity identification, intake, and process discovery should\
    \ evolve from the optimal design of RPA solutions to optimal redesign of business\
    \ processes. A robust slate of process improvement capabilities allows the high-performing\
    \ RPA program to solve organization-wide business challenges and attain fully\
    \ scaled, transformative impacts on operations performance and customer experience.^([(10)](#fn10))\n\
    \nRemember, a process map is used for designers, developers, Governance Committee\
    \ members, and other stakeholders to understand the steps of the process. It is\
    \ a high-level view of the inputs, outputs, and process steps in between. It assists\
    \ in understanding what steps are most eligible for automation and how long each\
    \ step takes to perform manually, so the time/cost savings can be determined.\n\
    \nThere are several methods for creating the process map. You may rely on subject\
    \ matter expertise. For this method, schedule time with people who actually perform\
    \ the process. We cannot stress enough that often, there is a way the process\
    \ is supposed to work and the way it actually works. It is vital to know how it\
    \ actually works; what steps do people do to perform the process? This is what\
    \ will be automated.\n\nMap the process on a white board or on a tool like `Visio`\
    \ or `iGraphix`.\n\nFirst, document the steps, for example: \"Start,\" \"Find\
    \ Account Number,\" \"Validate Account Number,\" \"Change Client Address,\" \"\
    Notify Client,\" \"Notify Advisor,\" \"End.\"\n\nThen for each step, ask how long\
    \ it currently takes. For example, finding the account number may mean searching\
    \ a database and then copying the number so it can be validated against another\
    \ database. How long does that take? Thirty seconds? Two minutes? Depending on\
    \ the task, there could be a wide discrepancy in how long it takes to complete.\
    \ In those cases, include a range (e.g., \"Step 5: 30 seconds to 2 minutes\").\n\
    \nMark how long each task takes under the task on the map."
  raw: '## Process Discovery Phase


    It is vital to evaluate each individual process candidate to ensure RPA is a right
    solution to the current situation. It also ensures that the automation initiatives
    will be successful in your organization. In order for the RPA team and Governance
    Committee to make an informed decision about whether or not to proceed with automation
    development, they have to have sufficient information about the process candidate.
    The process discovery phase is preliminary to the opportunity assessment phase
    (please see Chapter [5](#513218_1_En_5_Chapter.xhtml)), and it’s where all information
    for making critical decisions is gathered. It’s important to do it right in order
    to avoid beginning to automate a process that is not a suitable candidate for
    automation.


    Process discovery can be done by going through the process-related documentation
    and extracting required information to provide a summary for the decision-makers.
    This approach is simple and quick; however, it can leave room for errors due to
    inaccurate assumptions or outdated information in the reference documentation.
    And what if there is no proper process documentation available?


    As noted in BPM Resource Center :*In many organizations, day to day activities
    may be so ingrained and routine that it’s not always clear what the exact steps
    are in a given process. Different members of the organization may not know what
    happens to an item once it leaves their hands. Official process write-ups that
    you might find in the corporate operations or policy guides might not map what
    actually is being performed.*^([⁹](#fn9))


    All of this leads to a high probability that when the solution design phase begins,
    the RPA team would discover extreme complexity, operational risks, and/or overstated
    benefits of what the automation of the process might yield.


    Therefore, the recommended approach for process discovery can be as simple as
    gathering teams together (physically or virtually) and discussing and documenting
    (mapping and including a corresponding written description) how a particular process
    is actually performed. Through discussion and interviews with the people directly
    involved, you can usually discover the end-to-end steps of a process across teams,
    departments, divisions, etc. During this collaboration, you can also extract key
    metrics (volumes, costs, and other measurements) that can help determine if making
    improvement investments will yield the results you seek to meet strategic goals.


    There are a number of BPMS (Business Process Management Software) tools that can
    facilitate or even partially automate the process discovery phase. By mining existing
    information systems and analyzing event and transaction logs, you can document
    the actual work being done (who did what, when, for how long). Today, new emerging
    technology tools can read in data from various systems and present that information
    in flow diagrams, charts, and in other ways to help you understand process steps,
    bottlenecks, and more.


    However, often such tools are not available, and that is why identifying the right
    subject matter experts (SMEs) and meeting with them is key to success.


    Tip


    Do not be discouraged if automation tools (event and transaction logs, etc.) are
    not readily available. Processes for automation can be readily identified through
    meetings with SMEs. Automation tools are an advantage, but not absolutely required.


    As every organization suffers from some inherent inefficiencies in their processes,
    they require a method like process discovery that can help them access task-level
    data and the various nuances of interactions between humans and systems. While
    all companies establish standard operating procedures, in reality, they often
    go unheeded. Until these procedures are completely locked down, many employees
    will invent their own ways to operate. This is why the existing documentation
    of any process may not be reliable; it is necessary to know how the work is actually
    being done, which is often very different from how it is supposed to be done (according
    to existing documentation). In addition, many companies outsource their processes
    to other BPM vendors, leaving their leaders unfamiliar with the execution of their
    own processes.


    In most cases, especially during the initial introduction of RPA, business processes
    are documented through manual process mapping. This consists of a high-level flow
    chart (map, usually using Visio or a similar software) and then describing each
    task in more detail in a separate Word document.


    These two documents are enhanced by including information, as indicated earlier,
    regarding systems and tools, volume, time the process steps take, potential constraints
    to automation (if known at this time), and any other pertinent details as noted
    in the request form.


    This information is then compiled for presentation to the governance committed.


    Pause and Consider


    As a program matures, the opportunity identification, intake, and process discovery
    should evolve from the optimal design of RPA solutions to optimal redesign of
    business processes. A robust slate of process improvement capabilities allows
    the high-performing RPA program to solve organization-wide business challenges
    and attain fully scaled, transformative impacts on operations performance and
    customer experience.^([^(10)](#fn10))


    Remember, a process map is used for designers, developers, Governance Committee
    members, and other stakeholders to understand the steps of the process. It is
    a high-level view of the inputs, outputs, and process steps in between. It assists
    in understanding what steps are most eligible for automation and how long each
    step takes to perform manually, so the time/cost savings can be determined.


    There are several methods for creating the process map. You may rely on subject
    matter expertise. For this method, schedule time with people who actually perform
    the process. We cannot stress enough that often, there is a way the process is
    supposed to work and the way it actually works. It is vital to know how it actually
    works; what steps do people do to perform the process? This is what will be automated.


    Map the process on a white board or on a tool like Visio or iGraphix.


    First, document the steps, for example: “Start,” “Find Account Number,” “Validate
    Account Number,” “Change Client Address,” “Notify Client,” “Notify Advisor,” “End.”


    Then for each step, ask how long it currently takes. For example, finding the
    account number may mean searching a database and then copying the number so it
    can be validated against another database. How long does that take? Thirty seconds?
    Two minutes? Depending on the task, there could be a wide discrepancy in how long
    it takes to complete. In those cases, include a range (e.g., “Step 5: 30 seconds
    to 2 minutes”).


    Mark how long each task takes under the task on the map.'
  trans: "  \n# 流程发现阶段  \n\n评估每个候选流程以确保 RPA 是当前情况的正确解决方案至关重要。这也能确保自动化举措在你的组织中取得成功。为了让\
    \ RPA 团队和治理委员会能够就是否继续进行自动化开发做出明智决策，他们必须掌握关于候选流程的充分信息。流程发现阶段是机会评估阶段（请参阅第 5 章）的前置步骤，所有用于做出关键决策的信息都在此阶段收集。正确执行此阶段非常重要，以避免对不适合自动化的流程启动自动化开发。\
    \  \n\n流程发现可以通过查阅流程相关文档并提取所需信息来为决策者提供摘要。这种方法简单快捷；然而，由于参考文档中可能存在不准确的假设或过时信息，容易产生错误。如果没有合适的流程文档该怎么办？\
    \  \n\n正如 BPM 资源中心所指出的：*在许多组织中，日常活动可能已根深蒂固且成为例行公事，以至于某个给定流程的确切步骤并不总是清晰明确。组织中的不同成员可能不知道某个事项一旦离开他们手中后会发生什么。你可能会在公司运营或政策指南中找到的官方流程文件，可能无法映射实际执行的操作。*^(⁹)\
    \  \n\n所有这些都可能导致很高的风险：当解决方案设计阶段开始时，RPA 团队可能会发现极端的复杂性、运营风险，以及/或对流程自动化可能带来的收益的夸大。\
    \  \n\n因此，推荐的流程发现方法可以简单到：将团队聚集在一起（实体或虚拟形式），讨论并记录（绘制流程图并包含相应的书面描述）某个特定流程的实际执行方式。通过与直接相关人员的讨论和访谈，你通常可以发现跨团队、部门、事业部等的流程端到端步骤。在此协作过程中，你还可以提取关键指标（数量、成本及其他衡量标准），这些指标有助于判断改进投资是否能产生实现战略目标所需的结果。\
    \  \n\n有许多 BPMS（业务流程管理软件）工具可以促进甚至部分自动化流程发现阶段。通过挖掘现有信息系统并分析事件和事务日志，你可以记录实际完成的工作（谁做了什么、何时做的、持续了多久）。如今，新兴技术工具能够从各种系统读取数据，并以流程图、图表及其他方式呈现这些信息，帮助你理解流程步骤、瓶颈等更多内容。\
    \  \n\n然而，这类工具往往不可用，因此识别正确的主题专家（SME）并与他们会面是成功的关键。  \n\n> **提示**  \n> \n> 如果自动化工具（事件和事务日志等）不易获得，请不要气馁。通过与\
    \ SME 的会议即可轻松识别适合自动化的流程。自动化工具是优势，但并非绝对必需。  \n\n由于每个组织的流程都存在一些固有的低效问题，因此它们需要像流程发现这样的方法，来帮助获取任务级数据以及人与系统之间交互的各种细微差别。虽然所有公司都制定了标准操作程序，但现实中这些程序往往被忽视。除非这些程序被完全锁定，否则许多员工会自行发明操作方法。这就是为什么任何流程的现有文档可能不可靠；有必要了解工作的实际执行方式，这往往与预期的方式（根据现有文档）大相径庭。此外，许多公司将流程外包给其他\
    \ BPM 供应商，导致其领导者不熟悉自身流程的执行情况。  \n\n在大多数情况下，尤其是在 RPA 的初期引入阶段，业务流程是通过手动流程映射来记录的。这包括一个高级流程图（通常使用`Visio`或类似软件绘制），然后在一个单独的\
    \ Word 文档中更详细地描述每个任务。  \n\n通过包含以下信息来完善这两份文档：如前所述，关于系统和工具、数量、流程步骤耗时、自动化的潜在限制（如果此时已知），以及请求表中注明的任何其他相关细节。\
    \  \n\n然后，这些信息将被汇编并提交给治理委员会。  \n\n> **暂停思考**  \n> \n> 随着项目的成熟，机会识别、接收和流程发现应从 RPA\
    \ 解决方案的最优设计演变为业务流程的最优再设计。一套强大的流程改进能力能使高性能的 RPA 项目解决全组织的业务挑战，并在运营绩效和客户体验方面实现全面、变革性的影响。^((10))\
    \  \n\n请记住，流程图用于设计人员、开发人员、治理委员会成员及其他利益相关者理解流程步骤。它是关于输入、输出以及中间流程步骤的高级视图。它有助于理解哪些步骤最适合自动化，以及每个步骤手动执行需要多长时间，从而确定时间/成本节省。\
    \  \n\n创建流程图有多种方法。你可以依靠主题专家知识。采用这种方法时，请与实际执行该流程的人员安排时间。我们怎么强调都不为过：流程既有预期的工作方式，也有实际的工作方式。了解实际的工作方式至关重要——人们执行流程时具体做了哪些步骤？这才是将要自动化的内容。\
    \  \n\n在白板或`Visio`、`iGraphix`等工具上绘制流程图。  \n\n首先，记录步骤，例如：\"开始\"、\"查找账号\"、\"验证账号\"\
    、\"更改客户地址\"、\"通知客户\"、\"通知顾问\"、\"结束\"。  \n\n然后，针对每个步骤，询问当前所需时间。例如，查找账号可能意味着搜索数据库，然后复制号码以便在另一个数据库中验证。这需要多长时间？30\
    \ 秒？两分钟？根据任务的不同，完成时间可能存在很大差异。在这种情况下，请包含一个范围（例如，\"步骤 5：30 秒到 2 分钟\"）。  \n\n在地图上，在每个任务下方标注其所需时间。\
    \  \n"
- fmt: '另一个映射流程的优秀方法是对其进行**视频录制**。为此，需要安排时间与一位实际执行该流程的人员一起，在他们操作时录制其执行流程中的任务。当他们在点击应用程序和下拉菜单，或输入信息时，应详细讲解他们正在做什么以及为什么这样做。例如：“在这个标记为‘描述’的文本框中，我将触发此请求的邮件正文中的信息复制粘贴到这里。”


    完成此步骤后，你可以回顾视频，并据此创建流程映射图。


    **提示**


    如果项目进入设计阶段（参见第[6](#513218_1_En_6_Chapter.xhtml)章），该视频将对记录功能需求非常有帮助。


    如果因故无法录制流程视频，与执行该流程的人员坐在一起是记录流程的另一种方法（请注意，所有这些都可以远程完成）。记录下每个屏幕及其上执行的操作，然后按照前面所述的方法映射流程。


    创建初稿后，将其呈现给一组主题专家（即实际执行该流程的人员）进行验证，以确保其反映实际情况，这非常有益。请注意，发现某些人可能会调整流程（无论是执行顺序上的调整、插入额外步骤还是省略某些步骤）是正常现象。确保没有遗漏关键步骤，并确保按照映射的流程执行能够获得期望的结果。


    创建并验证映射图后，最好在另一份文档中提供一些描述性的、更详细的信息。请记住，在任何流程映射图中，每个步骤都只有寥寥几个词，例如：“识别账号”、“收集需求”等。详细的解释有助于读者更好地理解流程。


    对于流程中的每个步骤，将以表格形式提供以下信息：


    *   **输入**：什么触发了该步骤？对于除第一步外的所有步骤，输入通常是上一步的输出。

    *   **活动**：该步骤实际做了什么？这里会包含访问特定系统的相关信息。

    *   **输出**：该步骤的结果是什么？使用前面引用的例子，结果可能是“账号已定位”。

    *   **角色**：谁通常执行此活动？这里不是填写姓名的地方，而是填写角色。示例包括但不限于“客服代表”、“业务分析师”、“新业务经理”等。

    *   **度量指标**：在此步骤中收集（或应收集）哪些数字？示例可能包括定位账号所需时间、从初次请求到客户回复的时间等。

    *   **备注**：在此处包含步骤其他部分未记录的任何相关信息。这可能包括使用的系统、应用程序或工具、可能出现的异常解释、预期数量等。


    **提示**


    请记住，尽管此文档提供了关于映射图的额外信息，但它仍然是一份早期阶段的文档，因此不需要过度详细的细节。


    在某些情况下，则不需要此文档。对于非常简单直接的流程，映射图可能就足够了。输入和输出清晰明了，并且明确指出了每个步骤所需的时间。此外，如果在关于请求的初始讨论中，发现此请求不适合进行RPA，那么花时间创建此文档就毫无意义。


    总而言之，在此阶段，被提及的机会已得到详细评估，你现在对端到端流程、流程中涉及的角色和用户、流程使用的系统及工具列表，以及通过流程处理量的合理估算（可以是每小时、每天、每周等）有了清晰的了解。你还知道流程中每个步骤所需的时间，以及任何其他可能相关的绩效指标。你还识别出了自动化该流程的任何已知约束和风险。此外，通过与SME和业务合作伙伴的讨论，你知道了业务方希望自动化的流程步骤，这可能是流程的全部或部分。通过讨论，你可能还掌握了其他重要信息。


    所有这些信息都是进入下一步（即机会评估）所必需的，该步骤将评估RPA的价值和RPA作为解决方案的可行性。


    你会注意到，在此流程阶段中，你已与许多不同的人进行了接触。业务方代表提出了初始请求；你与他们进行了一次（可能多次）互动；随后你联系了SME，并可能联系了风险与合规部门的人员。在此阶段，如果你的组织有卓越中心（COE），则应联系他们。如果没有，谁将负责部署Bot？应让那个人或部门了解所提议的内容以及一个非常粗略的部署日期。尽早让这些人参与进来，将有助于你顺利推进项目启动和开发的流程。你将在后续章节中看到具体方法。


    接下来，让我们通过一个案例研究中的实用（尽管是虚构的）例子来审视这些概念。


    ## 案例研究：客户地址和电话号码更新


    对于任何面向客户的组织来说，拥有客户最新的联系信息至关重要，以便及时提供客户服务（例如，发送发票、账单或服务变更更新，以及促销活动、新服务或新产品等营销材料）。在这种假设情况下，客户通过电子邮件将“地址变更”表格提交到假设的“MyRPA”公司的客服邮件收件箱。可能有不同类型的邮件到达该收件箱；因此，客服人员会查看邮件并将其分派到相应的团队队列进行处理。


    在此案例中，请求被发送到团队A，该团队专门负责客户档案管理任务。团队A由六名客服专员组成，他们每天早上访问团队的待办文件夹，并按照先进先出的顺序处理请求。


    成功变更后，客服专员（CSS）会向客户发送确认邮件。


    经过一次流程质量审计，团队管理层发现，由于人为错误，大量地址变更请求处理不当，这导致了大量的客户投诉，以及因后续调查和纠正这些错误所需的返工而产生的高昂运营成本。管理层希望探索自动化该流程的机会，以提高整体流程质量，并将其资源重新分配到其他需要人工干预的领域。


    ****


    为清晰起见，我们需要区分流程流程图（process flow）和流程映射图（process map）。


    以下是描述案例研究流程的高层次*流程流程图*：


    ![../images/513218_1_En_4_Chapter/513218_1_En_4_Figa_HTML.png](images/513218_1_En_4_Chapter/513218_1_En_4_Figa_HTML.png)


    以下是针对该案例研究的高层次*流程映射图*（*模板见附录2*）：


    ![../images/513218_1_En_4_Chapter/513218_1_En_4_Figb_HTML.png](images/513218_1_En_4_Chapter/513218_1_En_4_Figb_HTML.png)


    此示例的申请表可能如下所示：


    *RPA* 机会 *– 申请表*'
  raw: 'Another excellent way to map the process is to **video it** . For this method,
    it is necessary to schedule time with someone who actually does the process to
    video the tasks they perform in the process while they are performing them. As
    they are clicking on applications and drop-downs, or typing in information, they
    should walk you through the process in detail explaining what they are doing and
    why. For example, “in this text box marked ‘description,’ I copy the information
    from the body of the email that triggered this request and paste it into that
    box.”


    Once you have completed this, you can review it and create a process map from
    it.


    Tip


    If the project moves to the design phase (see Chapter [6](#513218_1_En_6_Chapter.xhtml)),
    this video will be very helpful in documenting functional requirements.


    If for some reason you cannot video the process, sitting with the person who performs
    it is another way to document the process (please note that all this can be done
    remotely). Note each screen and the actions that are performed on it, and then
    map the process as described earlier.


    Once the first draft is created, it is beneficial to present it to a group of
    subject matter experts, the people who actually execute that process to make sure
    it reflects reality. Note that it is normal to discover that some people may tailor
    the process, either in terms of execution order or inserting an extra step or
    eliminating a step. Assure that there are no missing critical steps and that,
    if following the process as mapped, we would get desired results.


    After the map has been created and validated, it is beneficial to provide some
    descriptive and more detailed information in a separate document. Remember that
    in any process map, each step has just a few words: “Identify Account Number,”
    “Gather Requirements,” etc. The detailed explanation helps the reader to better
    understand the process.


    For each step in the process, the following information is provided in table format:


    *   Input: What triggers the step? For all but the first step, the input is usually
    the output from the previous step.


    *   Activity: What is actually done in this step? This is where information about
    accessing a particular system would be included.


    *   Output: What is the result of the step? Using the previously referenced example,
    it could be “Account Number has been located.”


    *   Role(s): Who generally performs this activity? This is not a place for names,
    but for the role. Examples include, but are certainly not limited to, “Customer
    Service Rep,” “Business Analyst,” “New Business Manager,” etc.


    *   Metrics: Are there any numbers that are, or should be, collected with this
    step? Examples might include length of time to locate account number, time from
    initial request to response to customer, etc.


    *   Notes: Include here any pertinent information that was not documented in the
    other sections of the step. This might include systems, applications or tools
    used, an explanation of possible exceptions, anticipated volumes, etc.


    Tip


    Keep in mind that although this document provides additional information about
    the map, this is still an early stage document, so excessive detail is not required.


    There are some circumstances under which this document is not required. For very
    simple and straightforward processes, the map may be sufficient. The inputs and
    outputs are clear, and the time each step takes is indicated. Also, if, during
    the initial conversation about the request, it appears that this request is not
    a good candidate for RPA, there is no point in spending time creating this document.


    To summarize, at this stage, the referred opportunity has been assessed in detail,
    and you now have a clear picture of the end-to-end process, the roles and users
    involved in the process, a list of systems and tools that the process uses, and
    a good estimate of the volumes that go through the process (this could be hourly,
    daily, weekly, etc.). You also know how long each step in the process takes, along
    with any other performance metrics that may be relevant. You have also identified
    any known constraints and risks to automating the process. Also, because of your
    discussions with the SMEs and business partner, you know which steps in the process
    the business wants automated; this could be all or part of the process. And there
    may be other important information that you now know due to your discussions.


    All this information is required to move to the next step, opportunity assessment,
    which will estimate RPA value and RPA feasibility as a solution.


    You will note that you have been in contact with a number of different people
    throughout this phase of the process. A representative of the business made the
    initial request; you had at least one and possibly more interactions with them;
    then you contacted SMEs and possibly someone from your risk and compliance area.
    At this stage, you should contact your Center of Excellence (COE) if your organization
    has one. If not, who will be responsible for deploying the Bot? That person or
    department should be made aware of what is being proposed and a very general deployment
    date. Getting this involvement early on will serve you well as you proceed through
    the process of project initiation and development. You will see how in subsequent
    chapters.


    Let’s look at these concepts in a practical, although fictional, example, as shown
    in this case study.


    ## Case Study: Client Address and Phone Number Update


    For any client-facing organization, it is important to have the clients’ most
    up-to-date contact information, to provide them with timely customer service (e.g.,
    sending invoices, bills, or service change updates and marketing material such
    as promoting sales events, new services or products, etc.). In this hypothetical
    situation, a client submits an “address change” form via email to the hypothetical
    “MyRPA” company’s customer service email inbox. There could be different types
    of emails arriving to that inbox; thus, customer service personnel review the
    emails and direct them to the appropriate team queue for processing.


    In this case, the request went to a team A, which specializes in client profile
    management tasks. Team A consists of six customer service specialists who access
    the team’s backlog folder every morning and process the requests in first-in,
    first-out order.


    After a successful change, a customer service specialist (CSS) sends a confirmation
    email to the client.


    After a process quality audit, the team’s leadership discovered that a high number
    of address change requests were processed incorrectly due to human error, which
    causes a high number of client complaints along with high operational costs due
    to further investigation and the rework required to correct those errors. The
    leadership wants to explore an opportunity to automate that process to improve
    overall process quality and redirect their resources to other areas which require
    manual intervention.


    ****


    For clarity, we need to distinguish between a process flow and a process map.


    The following is a high-level *process flow* describing the process in the case
    study:


    ![../images/513218_1_En_4_Chapter/513218_1_En_4_Figa_HTML.png](images/513218_1_En_4_Chapter/513218_1_En_4_Figa_HTML.png)


    The following is a high-level *process map* for the case study *(please see Appendix
    2 for a template):*


    ![../images/513218_1_En_4_Chapter/513218_1_En_4_Figb_HTML.png](images/513218_1_En_4_Chapter/513218_1_En_4_Figb_HTML.png)


    The request form for this example might look like this:


    *RPA* Opportunity *– Request Form*'
