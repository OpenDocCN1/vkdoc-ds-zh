    # 案例研究


    现在我们将探讨在我们一直跟踪的假设案例中如何执行这些任务。


    ## 部署到生产环境


    | **项目** | **项目详情** | **备注** | **状态** |

    | --- | --- | --- | --- |

    | **产品（机器人）名称** | 电话和地址更新 | 该名称将用于库存、报告或变更请求等。 | 已完成 |

    | **商定的部署日期和时间（如适用）** | 2022 年 1 月 1 日 | 已与所有必要的利益相关者达成一致。 | 已完成 |

    | **自动化规模** | 中等 | 根据运行量和频率，我们确定规模为中等。 |   |

    | **机器人运行时间表** | 周一至周五：每天 3 次（上午 10 点、下午 1 点、下午 6 点） | 这满足了产品所有者认同的业务需求。 |   |

    | **保修期内的联系人** | 约翰·史密斯<br>玛丽·琼斯 | 指定的开发人员将在保修期内随时处理可能出现的任何问题。 |   |

    | **职责分离声明** | 代码编写：玛丽·琼斯<br>文档：莎拉·威廉姆斯<br>参与 UAT 的 SME：道格拉斯·约翰逊和贝蒂·帕克 | 指定人员在保修期内将根据需要随时待命。
    |   |

    | **工作量** | 每次运行 100 个案例 |   |   |

    | **访问权限验证** | 已验证对 Web 应用程序 XYZ 和大型机 ABC 的访问权限 | 先前指定的开发人员已获得对 XYZ 应用程序和 ABC
    大型机的完全访问权限。这将最大限度地减少机器人出现问题时造成的延迟。 |   |

    | **用于沟通的电子邮件地址** | Dev1@company.​com<br>sem1@company.com | 这些邮箱将用于向利益相关者提供机器人性能的每日更新，并告知他们任何问题。如果没有问题，每天将发送一次邮件；但如果出现问题，将立即通过这些邮箱通知相关利益相关者。
    |   |

    | **灾难恢复** | 停止机器人并通知联系人。 | 在机器人进行必要维修期间，将由业务部门决定是手动执行流程，还是在问题解决后重新运行机器人。 |  
    |

    | **主要/次要版本** | 1.0.0 |   |   |

    | **部署时将到场的人员** | 约翰·史密斯 |   |   |

    | **COE 联系人** |   | 没有 COE。 | 不适用 |

    | **文件夹结构** | 无需创建新文件夹 |   | 不适用 |

    | **系统/应用程序可访问性** | 应用程序 XYZ、大型机 ABC | 相关方均可访问这两个系统。 |   |

    | **基础设施能力** | 电话和地址更新机器人可执行。 |   | 已完成 |

    | **风险识别及责任角色** | 所有已识别的风险均已被缓解。 | 业务所有者对任何未预料到的问题承担全部责任。 |   |

    | **部署说明/步骤**<br>**任务部署步骤**<br>− **实施前步骤**<br>− **实施步骤**<br>− **测试实施步骤**<br>−
    **回退步骤**<br>− **实施后步骤** |   | 自动化服务部署经理罗杰·亚当斯已指定实施和回退步骤。这些步骤记录在表格“地址和电话更新机器人，20xx
    年 12 月 1 日”中，该文件位于`C:/Business_Unit_123/Bot_Directory/Address_and_Phone_Update_Bot.doc`。
    |   |

    | **生产支持模型** | 一级和二级支持均由技术团队负责 | 自动化服务将让技术团队参与部署到生产过程，以确保平稳过渡到维护阶段。这将包括全面的知识转移。
    |   |


    暂停思考


    这份清单内容非常详尽。它可能对你的组织来说是完整的；也可能包含你无需考虑的项目，或者遗漏了对你至关重要的因素。基于你所学到的 RPA 知识，以及你对自己组织的了解，你认为清单中可能需要添加什么？哪些内容可以省略？如果不确定，可以在最初的项目中直接使用这份清单。随着时间的推移，你会知道需要改进哪些地方。


    现在你已经部署了机器人，接下来我们将探讨组织结构模型。你可能已经在使用你组织内的现有模型，但随着 RPA 计划的成熟，你可能希望做出改变。第 8 章详细介绍了最常见的组织结构。


