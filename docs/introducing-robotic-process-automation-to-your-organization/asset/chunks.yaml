    # 超自动化中的挑战与陷阱


    将超自动化应用于定义不清且理解不足的流程既困难又毫无意义。本章前面提到的流程挖掘工具，可以帮助提升流程的可见性和理解程度。


    将超自动化应用于满足极其复杂和独特需求的客户，则需要定制化的解决方案。如果为了提升客户满意度而针对特定客户需求定制流程步骤和结果，就会增加复杂性并依赖人工处理。对于任何组织而言，在客户满意度与通过标准化实现流程简化之间找到恰当的平衡点至关重要。


    一种规避风险的组织文化，会因鼓励避免潜在错误而形成保守惯性，从而减缓创新和自动化技术的采用。被赋权的员工应能够探索和试验新的自动化技术，并迅速预见其商业效益。关键在于确保获得端到端技术与业务运营领导层的支持，赢得他们的信任，并与他们协商尝试新的、不熟悉的方法。


    从市场上不断变化和演进的产品中，选择合适的自动化解决方案组合颇具挑战。我们认为，组织应将自动化视为一种运营原则，而不仅仅是附加功能或工具。


    我们预见，在不久的将来，`RPA`能力将成为工作流软件开箱即用功能中自动化产品组合的一部分。届时，无需单独购买并将其集成到技术架构中。


    既然你已经拥有了开启 `RPA` 之旅所需的一切，你需要了解除上述内容之外，你可能还会遇到的一些挑战。第 11 章将帮助你避免我们在经验中遇到的一些问题。


    脚注 1 2 3 4 5 6


    # 11. 挑战与陷阱


    一旦你为 `RPA` 计划奠定了基础，并识别出了一些愿意且渴望将其部分流程实现自动化的“早期采纳者”，同时建立了治理政策并确定了委员会成员，就该展望未来，看看可能会遇到哪些挑战。通过理解我们最初不成功的做法，你可以尽量减少一些常见错误。


    贯穿全书，我们提到了在启动 `RPA` 之旅时可能遇到的许多挑战。其中一些我们能够成功规避，就像看到飞驰的子弹并设法躲开一样。另一些则是我们正面撞上，然后在事后才解决。


    研究这些内容将有助于你在致力于自动化组织内的手动流程时，能够顺利推进：


    - **期望轻松获得管理层的认可。** 面对削减成本和提高效率的机会，我们原以为管理层至少会欢迎新的 `RPA` 计划。我们错了。虽然一线员工有时会因担心失业而不情愿，但我们对来自管理层的诸多阻力感到惊讶。一些管理者似乎认为
    `RPA` 只是一个新流行词，是风靡一时的解决方案，很快会带来一阵兴奋后便悄无声息地消失。他们见过太多其他“颠覆性”解决方案正是如此。另一些人则似乎并非担心自己的工作，而是担心自己的“地盘”受到威胁；他们手下有
    `X` 名员工，不希望这个数字减少。如果一个 `Bot` 要承担他们员工现在正在做的一部分工作，他们可能就会失去这些员工，因为他们可以被重新分配到组织的其他岗位或被解雇。


    **提示** 如果你严格按照第 2 章中的信息行事，就能避免这个挑战。


    - **识别错误的流程进行自动化。** 识别正确的流程看似简单：流程 `XYZ` 是重复性的，那么我们就把它自动化。但仔细审视后发现，这并不像我们想的那么简单。如前所述，当你初次确定一个需要自动化的流程时，你对其了解并不多。但在我们最初的一些尝试中，我们错过了一些“警示信号”。例如，某个中层管理人员是否深度投入到当前执行的该流程中？流程自动化是否会触犯某位不愿承认其领域有待改进的经理的利益？或者仅仅是某个极其复杂的流程，本可以在初步沟通中就判断出来？我们及时学会了如何更好地辨别这些问题。


    - **试图自动化整个流程，但实际上只有部分流程适合自动化。** 这与上一点有关。一个包含多个步骤的流程可能非常手动且高度重复，但这并不意味着所有步骤都能在当下实现自动化。业务负责人可能期望整个流程都实现自动化，但这往往不合理。请记住，即使只自动化流程的一部分，也可能显著节省时间或成本，或大幅改善客户体验。审视你已绘制出的端到端流程，考虑时间的节省，如果只有部分能实现自动化且能取得良好效果，那么就只自动化那部分。与业务负责人合作，确定未来需要做些什么，才能使流程中的更多步骤成为更好的自动化候选对象。


    - **在缺乏必要专业知识的情况下尝试构建 Bot。** 实际负责构建 `Bot` 的开发人员必须具备相应的知识。热情固然重要，但不能替代经验。确保团队中至少有一名在
    `RPA` 方面非常资深的开发人员。他们可以指导和培训经验不足的开发人员。

