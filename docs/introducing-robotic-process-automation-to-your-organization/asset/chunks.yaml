  trans: '

    # 排版后的内容


    如需进行增强（包括向自动化流程中添加手工流程的步骤——请记住，初始自动化可能仅自动化了部分手工步骤；在某个阶段，可能会使用同一个`Bot`来自动化更多步骤），则版本号应递增一位。


    -   **次版本号**：当`Bot`中推出了一系列较小的功能时，次版本号会发生变化。

    -   **补丁号**：当现有`Bot`部署了新版本时，补丁号会发生变化。这通常用于小型错误修复或更新`Bot`所使用的模板等。

    -   版本号的示例为：`1.002.013`。这表明它是初始版本（即主版本），经历了 2 次次版本更新，以及 13 次补丁变更（错误修复、模板更新等）。

    -   请明确识别业务中必须出席部署的具体人员（而不仅仅是角色），以及`SME`（主题专家）。


    **暂停思考** 在本书中，我们一直强调识别角色，而非具体个人的姓名。现在我们指定个人姓名，是因为在这个阶段，你需要确切知道将由谁来承担这些职责。


    ## 部署的主要步骤


    在准备部署时，你必须确保所有利益相关方都同意的预定部署日期。同时，要确保所有必需的文件都已为部署流程签署完毕。这包括合规所需的所有文件：需求文档、代码审查和测试摘要。利益相关方包括发布或交付经理以及业务产品负责人。你的组织中可能还有其他需要签字确认的利益相关方。


    接着，你将打包所有代码文件，并创建数据库脚本或任何`Bot`脚本（取决于所使用的自动化工具），以及所有相关的`Bot`文档（例如，自述文件）。


    **提示** 有些软件工具允许通过用户界面将`Bot`从预生产或 UAT 环境部署到生产环境。请检查你所在组织使用的自动化工具是否提供了将文件从 UAT 环境移动到生产环境的用户界面。


    你需要与部署团队共享所有必需的文件（即上一步中创建的所有文件）及相关文档。这可以通过网络共享、电子邮件或自动化工具本身来完成。


    **提示** 有些软件自动化工具可能提供构建脚本的功能，这些脚本可以通过手动方式或其他方式调用来部署`Bot`。同样，你需要检查你正在使用的自动化工具是否提供了将文件从
    UAT 环境移动到生产环境的用户界面。


    在临近部署时，请与部署团队成员安排一次会议，以锁定他们在商定的部署时间内的时间。你需要确保他们届时能够参与部署。


    现在，你将把所有文件部署到生产环境中，并根据需要在数据库上运行脚本。一旦所有文件共享给部署团队，所有文件将在预定的部署时间段内复制到生产环境。请验证所有必需的脚本是否已运行。


    **提示** `Bot`也可以通过将代码文件物理复制到生产环境，并根据需求更改相应的数据库来部署。如前所述，你需要确定你正在使用的自动化工具是否提供了将文件从
    UAT 环境移动到生产环境的用户界面。


    你将根据需求对`Bot`进行调度（例如，每小时、每天、每周、仅限工作日等——这在流程的早期阶段已经确定）。然后，如果需要，你将在生产环境中对`Bot`进行试运行。这可以确保`Bot`在生产环境中正常运行，因为环境是全新的。生产环境可能与测试环境不同。之后，你将验证结果以确保`Bot`正常工作，然后向业务团队宣布部署成功。


    **暂停思考** 部署步骤会因你所在组织用于实施 RPA 的软件自动化工具而异。根据你选择的工具，你所在组织的开发流程将需要做出哪些更改？


    技术团队将按照与业务部门（以及`COE`，如果有的话）商定的方式，继续监控`Bot`几天。这适用于新的`Bot`。对于升级或其他变更，技术团队将仅根据约定监控一个运行周期或一天。


    我们提供了在部署前需要完成的冗长清单。你将如何记住完成所有这些事项？避免任何遗漏的最佳方法是使用检查清单。以下是一个示例（为方便起见，该示例也包含在附录 11
    中）。

    '
- fmt: '# Deployment and Release Setup Checklist


    | Item | Item Details | Comments | Status* |

    | --- | --- | --- | --- |

    | **Product (Bot) Name** | | Provide the name used to refer to the solution/automation.
    This name will be used in inventory, reports, change requests, etc. | |

    | **Deployment date and time if applicable, agreed upon** | | As per project plan,
    provide the planned/preferred date for the deployment. | |

    | **Size of automation** | | It could be small, medium, or large. | |

    | **Bot schedule** | | Specify the preferred schedule (times and days of the week).
    The acceptable range of start times for the Bot. The approximate runtime of Bot.
    Are there any service-level agreements associated with the process that affect
    the scheduling of the automation? | |

    | **Contacts during warranty** | | During warranty, the deployment team may need
    to contact a software developer on the delivery team that is familiar with the
    code. Ensure that the developer will be available for five business days after
    the deployment date. | |

    | **Statement of segregation of duties** | | Delivery team will note names of
    software developer(s) who wrote the code. Automation services will note names
    of who user acceptance tested the code and who on automation services is deploying
    the code. To ensure segregation duties, automation services will ensure that the
    software developer who wrote the code was not the same person who performed user
    acceptance testing. The deployer of the code to production is not the same person
    who wrote the code. | |

    | **Volume of work** | | What is the expected number of items to be processed
    by the Bot in a designated time period (daily, weekly, etc.)? | |

    | **Access verification** | | Mention what type access is required and has it
    been verified in production environment. | |

    | **Email addresses for communication** | | Emails of business and technical contacts
    those will be contacted for any information, errors, or other reasons. | |

    | **Disaster recovery** | | Backout steps, post-implementation steps. | |

    | **Major/minor version** | | Specify if this is a small change to an existing
    Bot or a large, significant change. | |

    | **People who will be present at deployment** | | List the names and roles of
    the people who must be present at the time of deployment. | |

    | **COE contact** | | List the name and title of this person. | |

    | **Folder structures** | | List any new folders required. | |

    | **System/application accessibility** | | Document any known issues. | |

    | **Infrastructure capability** | | Document any known issues. | |

    | **Risk identification and roles responsible** | | Summarize this from the risk
    assessment. | |

    | **Deployment instructions/steps****Task Deploy Steps****Pre-implementation steps****Implementation
    steps****Test the implementation steps****Backout steps****Post-implementation
    steps** | | Provide a detailed playbook for the deployment. Typically the automation
    services deployment manager specifies the implementation and backup steps. | |

    | **Communication channels established** | | Specify them. | |

    | **Production Support Model** | | Are you retaining break-fix responsibilities
    for this automation? If yes, provide remedy support queue name and email contact
    for the business technical support team. If no, automation services will engage
    the development team as part of the D2P process to ensure a smooth transition
    to maintenance knowledge transfer. | |


    "Status" could be "complete," "incomplete," or "not applicable." For "incomplete"
    or "not applicable," be sure to include a brief, explanatory comment.


    ## Maintaining Communication Between COE/LOB and Dev. Teams for Deployment


    We have mentioned that your organization may or may not have a COE. If there is
    one, it is vital that you work with the COE throughout the process of the automation
    initiative. There must be efficient communication about coding standards, code
    review standards, upgrading the automation tool, and deployment schedule. It is
    the responsibility of the technical team to set expectations. What is the date
    (range) that the business wants deployment to fall within? Will any infrastructure
    upgrades be required? What development environment will be used?


    The COE, if there is one, defines who will maintain the development environment
    and who will maintain the Bot. Some might be maintained by the COE, some by the
    development team. If there is a COE, it maintains the execution of the Bot.


    The technical team has the contact with the business, so the technical team has
    a greater role in collaboration and communication during maintenance. If the Bot
    didn''t run, the business will contact the technical team, which will then, in
    collaboration with the business and the COE (if there is one), determine the next
    steps. This could be reverting back to the manual process until the Bot is repaired,
    rerunning the Bot once work is available, or stopping the Bot and restarting it
    when the business determines it can be restarted. Rerunning the Bot depends on
    the SLA; rerunning options are usually decided as part of deployment planning.
    We will look at some examples:


    1. Stopping the Bot: The Bot could be stopped and the process performed manually,
    until the repair is made. Then the Bot begins again with the new, incoming information.


    2. Rerunning the Bot: Perhaps the Bot didn''t run overnight as scheduled. In this
    case, it could simply be run during the following day with someone monitoring
    it to assure that it runs.


    3. Stop and start: If the Bot isn''t performing as expected, and it is due to
    the load that the Bot is processing (needs some tweaks or updates), or if the
    manual process needs some changes, then the Bot can be stopped and the necessary
    changes made. For example, Bot is processing Jira cards (they are the input for
    the Bot), and the manual process steps to be executed before the Bot begins have
    not been completed (e.g., Jira cards have not been updated or otherwise set up
    per the Bot''s requirements), the Bot can be stopped until the required work in
    the manual process is complete. Then the Bot can be restarted.


    Level 1 support is done by the COE: changing the schedule, changing the frequency
    of run, changing the number of Bots running at one time, updating user IDs and
    passwords, changing the priority of the Bot, and including/excluding any email
    IDs that need to be contacted in case of information from the Bot. All changes
    and updates which are not impacting the actual running of the Bot from the technical
    side. Example: Bot is running fine, but some changes in the settings of the Bot
    are required. These are nonfunctional requirements.


    Level 2 support is done by the technical team: when the Bot is not performing
    as per requirements/expectations. This pertains to functional requirements.


    In the absence of a COE, both Level 1 and Level 2 support are done by the technical
    team in collaboration with the business owner.'
