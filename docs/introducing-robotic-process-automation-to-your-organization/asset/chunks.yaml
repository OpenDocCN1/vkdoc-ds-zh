    \  \nThe registered company address is: 1 New York Plaza, New York, NY 10004,\
    \ U.S.A.\n\n*For Edwina, Travis, Vivian, and Ruby*  \n*—RF*\n\n*To my father,\
    \ who has always inspired me to live a life of curiosity and exploration.*  \n\
    *—AS*\n\n*For Sonia, Aastha, and Shaun*  \n*—KG*\n\n# Preface\n\nThe book in your\
    \ hands represents decades of experience of the authors. We have worked, as employees\
    \ and contractors, in many different industries, on very diverse projects, in\
    \ companies that range from very progressive to those that shun even any discussion\
    \ of change.\n\nBut in this millennium, organizations resist change at their existential\
    \ peril. Many companies that were leaders in their fields at one point are now\
    \ either insignificant or nonexistent. Think “BlackBerry” for one key company\
    \ that took a major fall, reducing its employees from a high of nearly 17,000\
    \ to less than 4,000 today.\n\nThat is only one stunning example of many. But\
    \ it is indicative of what happens when a company fails to keep up with important\
    \ trends and doesn’t make the changes necessary to remain competitive.\n\nWe have\
    \ long recognized the need to keep our own skills current, to maintain our own\
    \ marketability, and provide the best possible service to the companies that employ\
    \ us. Our work in Robotic Process Automation is the latest trend we have seen\
    \ and worked in and one we find exciting to the point of being revolutionary.\
    \ We often hear of some “revolutionary” new tool or methodology, but RPA has proven\
    \ itself time and time again; we have seen it in action.\n\nAs we discussed our\
    \ experience in RPA, and together implemented an RPA program in a company within\
    \ the financial services industry, our belief in it as an excellent tool to assist\
    \ any company in any industry to remain profitable and competitive was strengthened.\
    \ Yet our discussions and our reading also demonstrated that many organizations\
    \ don’t understand RPA and therefore don’t recognize its benefits. But we know\
    \ from experience how beneficial it can be.\n\nThe amount of money that companies\
    \ spend on training for their employees in any given year can be significant.\
    \ It’s wonderful that organizations are willing to invest in their people, and\
    \ we encourage them to continue to do so, as we also encourage employees to take\
    \ full advantage of company training programs. But, too often, employees come\
    \ back into the office after training, enthusiastic about what they have learned\
    \ and anxious to implement it, but the structure for doing so simply isn’t there.\
    \ It could be that management likes the idea, but doesn’t fully understand it\
    \ and is hesitant to implement it, or other employees are simply resistant to\
    \ change. After all, if someone has been doing their job successfully, why change\
    \ the way it’s being done?\n\nThis book answers that question, along with many\
    \ others. Work may be done very effectively, but not efficiently. For example,\
    \ an employee who processes paperwork all day long, looking up account numbers,\
    \ copying them to an invoice, etc., may be very good at their job. But if the\
    \ work can be automated, it’s highly possible that a week’s worth of invoices\
    \ can be completed and sent to the customer in the amount of time it takes a person\
    \ to process a single one.\n\nThese are the kinds of issues management must look\
    \ for. How can more work be done with fewer resources? How can work be more accurate?\
    \ Managers and leaders in companies we have worked for have struggled with these\
    \ issues, and some of them have seen automation as one of the answers.\n\nRobotic\
    \ Process Automation is not mysterious, but it must be understood to be successful.\
    \ There are some prerequisites to implementation, and if you miss them, you increase\
    \ your risk of failure. Within these pages, we provide the tools to help ensure\
    \ your success.\n\nWe recommend that you read the book start to finish and then\
    \ use it as an ongoing reference guide. You will find useful tips based on our\
    \ experience, along with all the templates you will require. We ask specific questions\
    \ within each chapter for you to consider in the context of your own organization.\n\
    \nThe book is designed and written for business leaders, and that can mean anyone\
    \ who wants to take the initiative to improve the efficiency and effectiveness\
    \ of processes within their jurisdiction.\n\nWe wish you every success as you\
    \ learn about, and then implement, Robotic Process Automation.\n\n> Robert Fantina\
    \  \n> Andriy Storozhuk  \n> Kamal Goyal\n\n# Acknowledgments\n\nThis book was\
    \ created based on our experiences at several different companies in Canada and\
    \ the United States. We are grateful for the opportunities afforded to us by these\
    \ organizations.\n\nWe also wish to thank the various experts whose words we quoted\
    \ occasionally in the book. Their work has been invaluable to us as we embarked,\
    \ some time ago, on our own RPA (Robotic Process Automation) journey.\n\nWe are\
    \ also very grateful to our editors, Mark Powers and Laura Berendson, for their\
    \ guidance and assistance throughout the process of writing. We also want to acknowledge\
    \ and thank Shivangi Ramanchandran for her feedback and for giving us the opportunity\
    \ of working with her team.\n\nLastly, we would like to acknowledge our wives\
    \ who we may have, of necessity, neglected at different times throughout the process\
    \ and who maintained their constant support for us regardless.\n\n# About the\
    \ Authors\n\n# 1. Introduction"
