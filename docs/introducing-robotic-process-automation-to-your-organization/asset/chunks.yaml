    | 背景 |  |

    | --- | --- |

    | 举措名称 | 地址和电话号码变更流程 |

    | 发起人 | Mary Smith |

    | 项目负责人 | John Doe |

    | **当前流程如何运作？** |

    | 包含新客户信息（地址和/或电话号码）的客户变更请求邮件，由客户服务专员（CSS）转交给 A 组处理。该组有五名全职员工负责处理这些请求。如果地址无误，每位
    CSS 处理一个请求大约需要 10-15 分钟；如果需要调查或与客户进一步跟进，则大约需要 20 分钟。该组领导看到了至少部分自动化该流程的机会，并将部分
    CSS 调至其他服务时间更长、加班率更高的领域。此外，审核流程请求后发现，电话号码中存在大量人为错误，例如更改了错误的客户地址、新地址出错，或未在所有必需的系统和应用程序中更新客户信息。这会引起客户的不满，并增加客户服务的整体运营成本，因为我们需要进一步调查，且不容易联系到客户。
    |

    | **目标是什么？** |

    | 我们希望提高流程质量并减少处理这些任务的 CSS 数量。要求是自动化端到端的地址和/或电话号码变更流程。自动化系统应能够验证客户凭证、更改电话号码，以及/或者验证并在大型机系统中用新地址更新信息。
    |

    | **常见业务驱动因素/业务关键性** |

    | 运营成本、质量、改善客户体验、公司形象与声誉 |

    | **受影响的业务领域** | **受影响的系统/工具** |

    | 客户服务团队 | Outlook、PDF 表单、客户信息管理系统、大型机系统 |

    | **机会类型** | **解决方案持续时间？** | **预估运营效益（FTE 工时）** |

    | 年度 | 5 年 | 7 个全职等效员工，约 11,830 FTE 工时 |

    | **优先级** | **期望交付日期** |

    | 必须执行 | 20xx 年 10 月 1 日 |

    | **表单填写完成日期** | 20xx 年 5 月 24 日 | **编制人：** | Judith Wilson |


    在发现阶段，流程分析师与主题专家（SME）接洽，并成功捕获了端到端（E2E）流程，识别出关键信息，包括：


    - 输入类型和数量、流程中涉及的工具和系统，以及执行工作的资源


    所有这些信息都被汇编到上方的流程图中。


    除了流程图之外，还创建了流程步骤的详细描述（模板请参见附录 3）。该文档的好处在于，它能提供后续步骤中可能对决策者和开发人员至关重要的任何必要细节。


    ### 客户地址与电话号码更新


    | **输入** | 此为流程的起始点。 |

    | **活动** | A 组成员访问待办请求列表。 |

    | **输出** | 待办请求列表已被访问。 |

    | **角色** | A 组的数据更新文员。 |

    | **备注** | 此处无单独的“输入”。这是启动该流程的触发器，每日早晨执行。 |

    | **指标** | 每日新增请求数量。 |


    1. **访问 A 组待办请求列表**


    | **输入** | 待办请求列表已被访问。 |

    | **活动** | 每个请求被转发给一名文员进行处理。 |

    | **输出** | 请求已被转发。 |

    | **角色** | A 组的数据更新文员。 |

    | **备注** | 必须对工作量有一定了解。 |

    | **指标** | 每日分配请求数量。 |


    1. **分配请求**


    | **输入** | 请求已被转发。 |

    | **活动** | 打开请求表单并理解请求内容（地址变更、电话号码变更等）。 |

    | **输出** | 已知该请求所需完成的工作。 |

    | **角色** | A 组的数据更新文员。 |

    | **备注** | |

    | **指标** | |


    1. **打开并审阅请求表单**


    | **输入** | 已知该请求所需完成的工作。 |

    | **活动** | 查询账户以确保请求上的号码与请求人的姓名相符。 |

    | **输出** | 已知请求中的信息是否属于该请求人（例如，账号和姓名匹配）。 |

    | **角色** | A 组的数据更新文员。 |

    | **备注** | |

    | **指标** | |


    1. **身份已确认？**


    | **输入** | 两种可能的输入：身份未确认（来自步骤 4 的“否”决定）。新地址未确认（来自步骤 6 的“否”决定）。 |

    | **活动** | 向客户发送电子邮件，请求澄清。 |

    | **输出** | 已向客户发送电子邮件。 |

    | **角色** | A 组的数据更新文员。 |

    | **备注** | 使用模板：一个用于未确认身份，另一个用于未确认地址。 |

    | **指标** | 每日必须发送的电子邮件数量。 |


    1. **向客户发送跟进邮件**


    | **输入** | 客户身份已确认（来自步骤 4 的“是”决定）。 |

    | **活动** | 采取必要步骤以确保客户的新地址准确无误。 |

    | **输出** | 已知请求中的信息是否属于该请求人（例如，账号和姓名匹配）。 |

    | **角色** | A 组的数据更新文员。 |

    | **备注** | |

    | **指标** | 每日未确认地址的百分比。 |


    1. **确认客户的新地址**


    | **输入** | 新地址已确认。 |

    | **活动** | 所有访问客户信息的系统和应用程序均使用新信息更新。 |

    | **输出** | 系统和应用程序已更新。 |

    | **角色** | A 组的数据更新文员。 |

    | **备注** | |

    | **指标** | |


    1. **在大型机系统和应用程序中进行更改**


