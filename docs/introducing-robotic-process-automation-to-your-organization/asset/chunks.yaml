    # 可行性评估


    机会评估的另一个主要因素是可行性。在此阶段，“可行性”仅涉及我们当前拥有的高层视图。基于目前可用的有限信息，所提议的流程是否适合自动化？换句话说，RPA 是否是应对所呈现机会的合理解决方案？可行性评估的目标是尽早识别出不适合
    RPA 的请求，并避免花费不必要的资源工时。可行性评估及其 RPA 团队的建议，将成为治理委员会就所请求的自动化做出决策过程的主要部分。


    请记住，如果项目获批进入下一阶段，将在该阶段获取更多信息，并且会设立另一个治理委员会的检查点，届时将对新信息进行评估。一个在信息极少时被视为“可行”的项目，在获得更多信息后可能会被重新评估并取消。反思并学习那些导致
    RPA 开发被取消的信息或细节，并将其纳入可行性评估工具，以最大程度降低 RPA 取消率，这一点非常重要。通过实现较低的取消率，您可以降低运营成本（提高技术投资回报率），提升交付速度，并改善业务运营部门的信任度和用户满意度。此外，随着数字自动化能力的不断发展，一些以前无法实现的解决方案可能会变得可行；因此，随着您在
    RPA 方面积累更多经验，需要随着时间的推移对可行性评估工具进行适当调整。


    ### 暂停与思考


    为什么在后期阶段取消不算“失败”？请记住，治理委员会的存在是为了评估当前的信息。在“机会识别”或“机会评估”阶段，只知道基本信息，治理委员会并非批准整个项目，而只是批准下一阶段，以便发现更多信息。随后，治理委员会将对这些信息进行评估。


    在此阶段，需要提出六个基本问题。


    ## 可行性评估


    `<项目名称>`


    |   | **问题** | **回答** |

    | --- | --- | --- |

    | 1 | 流程是否定义明确？ |   |

    | 2 | 流程是否稳定（“例外”情况极少）？ |   |

    | 3 | 例外情况能否手动处理？ |   |

    | 4 | 输入是否为数字格式？ |   |

    | 5 | 所需数据能否无需人工干预即可输入？ |   |

    | 6 | 管理层是否接受对角色和流程的潜在变更？ |   |


    **批准人：**


    `<姓名>` `<职务>` _______________________________ 日期：____________


    `<姓名>` `<职务>` _______________________________ 日期：____________


    `<姓名>` `<职务>` _______________________________ 日期：____________


    `<姓名>` `<职务>` _______________________________ 日期：____________


    （模板参见附录 4。）


    1.  **流程是否定义明确？** 在此，您需要确定流程的重复性。基本上，每次执行该流程时，是否都执行完全相同的步骤？这些步骤是否为众所周知的？例外情况是否有限？这是使流程成为自动化良好候选者的特征之一。


    2.  **流程是否稳定（“例外”情况极少）？** 当流程被调用时，所采取的步骤是否基于明确制定的规则？流程内的步骤是否一致？


    3.  **例外情况能否手动处理？** 对于任何流程，一定数量的有限交易可能需要一些额外步骤。也许某个账号输入错误，必须通过姓氏来查找该账号。客户可能在某个更常见的请求中提出特殊要求。如果这些交易发生在自动化流程中，能否将它们发送到邮箱进行手动处理？目前是否有处理这些例外情况的流程？


    4.  **输入是否为数字格式？** 输入是否通过电子邮箱进入流程？或者它们是否来自客户或其他人的电话，必须由接听电话者输入？如果是这样，接听电话者创建的信息能否输入到
    Bot 可以访问的系统中？


    另外，所有输入都是 Excel 文件吗？Word 文档？PDF？等等。Bot 读取它们的难易程度如何？


    5.  **所需数据能否无需人工干预即可输入？** Bot 不会思考；它只会寻找被明确告知要寻找的内容，并相应地处理找到的内容。如果输入需要人工判断，而不仅仅是判断是否可由
    Bot 处理的简单决策，那么该流程就不是一个好的自动化候选者。那些几乎不需要判断且异常率低的任务是 RPA 的良好候选者。


    例如，一个电子邮箱每天可能收到 300 封邮件，其中 100 封可以遵循标准流程。可能需要一个人手动检查这 300 封邮件，并将那 100 封可以遵循标准流程的邮件转发给
    Bot。但一旦邮件到达 Bot 那里，它就可以接管处理。


    然而，如果该邮箱每天收到 300 封邮件，并且每封邮件都需要有人阅读并查找各种不同的信息，而这些信息可能来自各种不同且不断变化的来源，那么此流程就不是一个好的自动化候选者。


    6.  **管理层是否接受对角色和流程的潜在变更？** 自动化流程的一个优点是可以将员工解放出来承担其他职责，从而改变他们的角色。此外，在调查流程是否适合自动化时，可能会发现一些可以提高效率的方法，从而在流程自动化之前就对其进行更改。为了能让项目推进，这些变更及相关变更必须得到流程负责人的认可。


    ### 暂停与思考


    您的组织中是否有其他考量因素应添加到“可行性评估”模板中？请记住，这些基本问题相当标准，但不存在“一刀切”的方案。您可以先使用这些模板进行前几个 RPA 项目，但您的“可行性评估”模板以及本文包含的所有其他模板，可能会随着时间的推移而演变，以满足您组织的特定需求。

    '
- fmt: "# Risk Assessment\n\nFor any new RPA opportunity, a preliminary risk assessment\
    \ must be performed. Most project leaders are well versed in risk assessment activities,\
    \ but there are some risks that are peculiar to RPA, and we detail them in this\
    \ section. It’s important to know that, as with any project, in this phase (opportunity\
    \ assessment), only preliminary risks will be identified, and more will be discovered\
    \ when and if the project moves forward. An early involvement of your organization’s\
    \ risk and compliance group (it may have a different name in your company) is\
    \ beneficial. That group can assist in identifying risks early on. If they are\
    \ identified later, it might necessitate costly rework or even cause the project\
    \ to be cancelled. This would result in an unnecessary waste of time and money.\n\
    \nOverall, the purpose of the risk assessment is to list what might go wrong during\
    \ the creation of the Bot or during implementation. For example, is there a likelihood\
    \ that certain applications that must be accessed by the Bot will be difficult\
    \ to access? If so, how much will that increase the time to develop the solution?\
    \ Another example: How great is the possibility that the Bot will misread information?\
    \ These kinds of risks must be identified as early as possible to help the Governance\
    \ Committee make informed decisions.\n\nWriting in Forbes on June 18, 2019, [Naveen\
    \ Joshi](https://www.forbes.com/sites/naveenjoshi/) noted the following four (4)\
    \ major risks:\n\n1. Incorrect process selection\n2. Technical issues\n3. Lack\
    \ of communication\n4. Security^([^(11)](#fn11))\n\nThe risk assessment document\
    \ will be used by designers and developers to create the automation that will\
    \ mitigate those risks. While a thorough risk assessment is required, it must\
    \ be remembered that at this point, there is still limited information known about\
    \ the project and almost nothing about the solution. We only have a clear understanding\
    \ of what the objective is and what the “ask” is (what does the requestor actually\
    \ want). In other words, we know what and where, but not how. Additional risks\
    \ will be identified as the solution development progresses.\n\nStart with this\
    \ form (there is a template in Appendix 5). An explanation of each category follows\
    \ the template.\n\n## Risk Assessment Checklist\n\n<Name of Project>\n\n![../images/513218_1_En_5_Chapter/513218_1_En_5_Figc_HTML.gif](images/513218_1_En_5_Chapter/513218_1_En_5_Figc_HTML.gif)\n\
    \n(See Appendix 5 for a template.)\n\n1. **Risks**: In this area, briefly and\
    \ succinctly identify the risks. One that is standard for RPA initiatives is the\
    \ following: “The Bot fails to function.”\n2. **Type**: Generally, the “risk type”\
    \ is one of the following categories.\n   - Compliance\n   - Error\n   - Financial\n\
    \   - Operational\n   - Reputational\n   - Resource\n   - System\n   - Technology\n\
    \   - Security\n\nComplete this area to the best of your current knowledge. Remember,\
    \ this is a very early stage in the project, and additional risks will be identified\
    \ as more information about the business need, the technology, etc., is obtained.\n\
    \n> **Tip**\n> \n> Solicit input on risks from a variety of subject matter experts\
    \ to assure that you assess and identify potential risks RPA could expose or create.\
    \ Involve your “risk and compliance” group in this.\n\n3. **Is there a mitigation\
    \ plan?** This could be “Yes,” “No,” or “N/A.” “Yes” means that there is a mitigation\
    \ plan for this particular risk. For the standard risk mentioned before, this\
    \ will be “Yes.”\n   \n   “No” means that there is no mitigation plan for this\
    \ particular risk, but one must be created.\n   \n   “N/A” means that there is\
    \ no mitigation plan, but the decision is made to simply accept the risk. This\
    \ may include such things as accepting maintenance costs, creation of the technical\
    \ debt, or accepting the fact that X% exceptions will require manual handling.\n\
    \n4. **Mitigation plan and responsible party**: In this box, you will succinctly\
    \ express what must be done about the risk. If there is a mitigation plan (“Yes”\
    \ from the column titled “Is There a Mitigation Plan”), briefly describe it. For\
    \ example, for the standard risk mentioned previously, the “Mitigation Plan” is\
    \ usually this: “Revert to manual handling until the Bot is repaired.”\n   \n\
