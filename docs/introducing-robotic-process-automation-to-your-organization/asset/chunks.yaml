    \ \n*——RF*\n\n*献给我的父亲，他始终激励我带着好奇与探索精神生活。*  \n*——AS*\n\n*献给 Sonia、Aastha 和 Shaun*\
    \  \n*——KG*\n\n# 前言\n\n您手中的这本书凝聚了作者们数十年的经验。我们曾以员工和承包商的身份，在多个不同行业的、项目迥异的公司工作，这些公司有的非常前卫，有的则对任何变革的讨论都避之不及。\n\
    \n但在本世纪，组织若不进行变革，则将面临生存危机。许多曾经是行业领导者的公司，如今要么无足轻重，要么已不复存在。想想“黑莓”这个典型例子，它曾遭受重创，员工人数从近\
    \ 17,000 人的高峰锐减至如今的不足 4,000 人。\n\n这只是众多惊人案例中的一个。但它表明，当一家公司未能跟上重要趋势、未能做出保持竞争力所需的改变时会发生什么。\n\
    \n我们很早就认识到，需要不断更新自身技能、保持市场竞争力，并为雇佣我们的公司提供最优质的服务。我们在机器人流程自动化方面的工作，是我们所见证并参与的最新趋势，其令人兴奋的程度堪称革命性。我们经常听到一些“革命性”的新工具或方法论，但\
    \ RPA 已经一次又一次地证明了自身价值；我们亲眼目睹了它的实际成效。\n\n随着我们讨论在 RPA 方面的经验，并共同在一家金融服务行业的公司实施 RPA\
    \ 项目，我们更加坚信 RPA 是帮助任何行业的任何公司保持盈利能力和竞争力的优秀工具。然而，我们的讨论和阅读也表明，许多组织并不理解 RPA，因此也未能认识到其益处。但根据经验，我们深知它可能带来多么巨大的好处。\n\
    \n公司每年在员工培训上的投入可能相当可观。组织愿意投资于员工，这很棒，我们鼓励它们继续这样做，同时我们也鼓励员工充分利用公司的培训项目。但情况往往是，员工培训结束后回到办公室，对自己所学的内容充满热情，渴望付诸实践，但公司却缺乏相应的实施架构。可能是管理层喜欢这个想法，但并未完全理解，因而犹豫不决；也可能是其他员工单纯抗拒改变。毕竟，如果一个人一直都能成功完成工作，为什么要改变做事方式呢？\n\
    \n本书回答了这个问题，以及其他许多问题。工作可能做得非常有效，但未必高效。例如，一位整天处理文书工作、查找账号、将其复制到发票上的员工，可能非常擅长自己的工作。但如果这些工作可以自动化，那么很可能一周的发票量都能在一个人处理单张发票的时间内完成并发送给客户。\n\
    \n这正是管理层必须关注的问题。如何用更少的资源完成更多的工作？如何让工作更精确？我们曾工作过的公司的经理和领导者们都曾为此问题而苦恼，其中一些人将自动化视为解决方案之一。\n\
    \n机器人流程自动化并不神秘，但若要成功，就必须理解它。实施 RPA 有一些先决条件，如果忽略了它们，失败的风险就会增加。在本书中，我们提供了确保您成功的工具。\n\
    \n我们建议您从头到尾阅读本书，然后将其作为持续的参考指南。您会发现基于我们经验的有用提示，以及您所需的所有模板。我们在每章中提出具体问题，供您结合自身组织的情况进行思考。\n\
    \n本书是为企业领导者设计和编写的，这可以指任何希望主动在其职责范围内提高流程效率和效果的人。\n\n祝您在了解并实施机器人流程自动化的过程中取得圆满成功。\n\
    \n> Robert Fantina  \n> Andriy Storozhuk  \n> Kamal Goyal\n\n# 致谢\n\n本书的创作基于我们在加拿大和美国几家不同公司的经历。我们感谢这些组织为我们提供的机会。\n\
    \n我们还要感谢诸位专家，我们在书中偶尔引用了他们的话。在我们多年前开始自己的 RPA（机器人流程自动化）之旅时，他们的工作对我们来说非常宝贵。\n\n我们同样非常感谢我们的编辑\
    \ Mark Powers 和 Laura Berendson，他们在整个写作过程中给予我们指导与帮助。我们还要感谢 Shivangi Ramanchandran\
    \ 的反馈以及给予我们与她的团队合作的机会。\n\n最后，我们要感谢我们的妻子，在写作的不同阶段，我们可能因必要而忽略了她们，但她们始终如一地支持着我们。\n\
    \n# 关于作者\n\n# 1. 引言\n"
- fmt: "# Overview\n\nFor decades, we have been hearing about the “fast pace” of technology,\
    \ the “rapidly changing technology environment,” and the need for companies to\
    \ be on the “cutting edge” in order to remain competitive or even relevant. Different\
    \ methodologies have come and gone, some like Six Sigma remaining popular and\
    \ effective and others like the Capability Maturity Model (and its short-lived\
    \ successor, the `Capability Maturity Model Integrated`) falling by the wayside\
    \ after a respectable run.\n\nAll of these have served, or continue to serve,\
    \ a purpose. These models have been adopted successfully by many organizations.\
    \ But process improvement is an ongoing initiative. What can be done next in terms\
    \ of current processes, here and now, that will increase efficiency, benefit customers,\
    \ and improve profitability? One option is `Robotic Process Automation (RPA)`.\n\
    \nCristina-Claudia Osman, writing in *Informatica Economica*, described `RPA`\
    \ as follows:\n\n> The emerging of new digital tools supports organizations to\
    \ improve their business processes by increasing efficiency and agility, or reducing\
    \ errors and costs. `Robotic Process Automation (RPA)` tools are designed to perform\
    \ manual and repetitive tasks of human employees using trained robots. This is\
    \ different than other traditional software because the robots communicate with\
    \ other information systems by means of front-end. `RPA` helps companies to reduce\
    \ employees’ workload and errors, but also to save costs.\n\nTo summarize, `RPA`\
    \ means taking repetitive, manual processes and creating a “Bot” (robot) to perform\
    \ them, thus freeing up the time of personnel who were doing these tasks to focus\
    \ on more important issues, issues that often require human insight and decision-making,\
    \ not just following routine and repetitive actions. These more complex tasks\
    \ involving cognitive thought are often more directly customer facing. Additionally,\
    \ automating processes reduces human error and costly rework. It can also improve\
    \ morale by enabling employees to work on tasks that require thought, rather than\
    \ simply repeating rote actions.\n\n## Pause and Consider\n\nAutomating certain\
    \ processes enables people to focus on more complex processes and tasks and those\
    \ that require decision-making and/or creativity. A `Bot` will do exactly what\
    \ it is programmed to do, and that is most often jobs that don’t require thought.\
    \ Consider how this will help to gain buy-in for a new `RPA` initiative.\n\n#\
    \ Benefits\n\nThe benefits of `RPA` are clear. As Timothy Driscoll, writing in\
    \ *Strategic Finance*, said:\n\n> Designed properly, software robots can operate\
    \ 24/7 at a lower cost than humans while delivering higher-quality and scalable\
    \ output. This set of benefits can make an appealing value-creating business case.\
    \ `RPA` initiatives are likely to target processes that are labor- and transaction-intensive,\
    \ where people are performing recurring tasks that can be redesigned as rules-based\
    \ activities performed by robots or software tools. The benefits of `RPA` initiatives\
    \ may include, but aren’t limited to, the key measures in Table^([¹](#fn1)).\n\
    \n| Efficiency/Cost Metrics | Effectiveness/Quality Metrics | Risk/Compliance\
    \ Metrics |\n| --- | --- | --- |\n| `% Headcount/cost reduction` `% Productivity\
    \ increase` `% Daily throughput increase` | `% Accuracy improvement` `% Cycle-time\
    \ reduction` `% Client-satisfaction increase` | `% Operating risk improvement`\
    \ `% Increase in automated controls` |\n\nAs shown, `RPA` can achieve benefits\
    \ that the management of any organization would welcome. We will now discuss briefly\
    \ how these can be applied. Detail on how to achieve these and additional benefits\
    \ is contained in subsequent chapters.\n\n## Practical Applications\n\nIn order\
    \ to achieve these and additional benefits, `RPA` can be applied to a wide variety\
    \ of processes. There are four key characteristics to look for when determining\
    \ if a process can easily be automated:\n\n1.  Is it repetitive?\n    *   Do the\
    \ same actions need to be performed over and over, for different clients, employees,\
    \ etc.? For example, if an invoice is created manually, a clerk must obtain the\
    \ name of the item or service purchased and the cost of that item or service;\
    \ they must find the name, address, and account number of the purchaser and insert\
    \ all the information onto an invoice template. They then place it in an envelope\
    \ and send it to the mailroom for postage.\n\n2.  Would the cost of automating\
    \ the process exceed the cost of continuing to do it manually?\n    *   While\
    \ a manual process may be very repetitive, it may cost more to automate it than\
    \ to continue doing it manually. On the surface, such a process would not be a\
    \ good candidate for automation.\n\n3.  Is automation required for competitive\
    \ value?\n    *   Saving money is not the only motivation for automating a process.\
    \ Perhaps the cost of automating a process will exceed the dollar savings, but\
    \ it should be automated to maintain a competitive advantage.\n\n4.  Would automating\
    \ a process better enable the organization to fulfill government regulations?\n\
    \    *   Most industries adhere to various kinds of government regulations. Automating\
    \ processes to ensure that required work is done and reports are issued on time\
    \ can be highly beneficial.\n\nIn looking at any process automation potential,\
    \ a “Yes” to question 1 is required in order to continue investigation. The repetitive\
    \ nature of the process is key for automation. And while the cost of automation\
    \ may exceed the financial benefits accrued by it, this does not eliminate the\
    \ process from consideration for automation, since there may be competitive or\
    \ regulatory benefits that go beyond immediate financial considerations."
  raw: "## Overview\n\nFor decades, we have been hearing about the “fast pace” of\
    \ technology, the “rapidly changing technology environment,” and the need for\
    \ companies to be on the “cutting edge” in order to remain competitive or even\
    \ relevant. Different methodologies have come and gone, some like Six Sigma remaining\
    \ popular and effective and others like the Capability Maturity Model (and its\
    \ short-lived successor, the Capability Maturity Model Integrated) falling by\
    \ the wayside after a respectable run.\n\nAll of these have served, or continue\
    \ to serve, a purpose. These models have been adopted successfully by many organizations.\
    \ But process improvement is an ongoing initiative. What can be done next in terms\
    \ of current processes, here and now, that will increase efficiency, benefit customers,\
    \ and improve profitability? One option is Robotic Process Automation (RPA).\n\
    \nCristina-Claudia Osman, writing in *Informatica Economica*, described RPA as\
    \ follows:\n\n*The emerging of new digital tools supports organizations to improve\
    \ their business processes by increasing efficiency and agility, or reducing errors\
    \ and costs. Robotic Process Automation (RPA)* *tools* *are designed to perform\
    \ manual and repetitive tasks of human employees using trained robots. This is\
    \ different than other traditional software because the robots communicate with\
    \ other information systems by means of front-end. RPA helps companies to reduce\
    \ employees’ workload and errors, but also to save costs.*\n\nTo summarize, RPA\
    \ means taking repetitive, manual processes and creating a “Bot” (robot) to perform\
    \ them, thus freeing up the time of personnel who were doing these tasks to focus\
    \ on more important issues, issues that often require human insight and decision-making,\
    \ not just following routine and repetitive actions. These more complex tasks\
    \ involving cognitive thought are often more directly customer facing. Additionally,\
    \ automating processes reduces human error and costly rework. It can also improve\
    \ morale by enabling employees to work on tasks that require thought, rather than\
    \ simply repeating rote actions.\n\nPause and Consider\n\nAutomating certain processes\
    \ enables people to focus on more complex processes and tasks and those that require\
    \ decision-making and/or creativity. A Bot will do exactly what it is programmed\
    \ to do, and that is most often jobs that don’t require thought. Consider how\
    \ this will help to gain buy-in for a new RPA initiative.\n\n## Benefits\n\nThe\
    \ benefits of RPA are clear. As Timothy Driscoll, writing in *Strategic Finance*,\
    \ said:\n\n*Designed properly, software robots can operate 24/7 at a lower cost\
    \ than humans while delivering higher-quality and scalable output. This set of\
    \ benefits can make an appealing value-creating business case. RPA initiatives\
    \ are likely to target processes that are labor- and transaction-intensive, where\
    \ people are performing recurring tasks that can be redesigned as rules-based\
    \ activities performed by robots or software tools. The benefits of RPA initiatives\
    \ may include, but aren’t limited to, the key measures in Table*^([¹](#fn1)).\n\
    \n| Efficiency/Cost Metrics | Effectiveness/Quality Metrics | Risk/Compliance\
    \ Metrics |\n| --- | --- | --- |\n| % Headcount/cost reduction% Productivity increase%\
    \ Daily throughput increase | % Accuracy improvement% Cycle-time reduction% Client-satisfaction\
    \ increase | % Operating risk improvement% Increase in automated controls |\n\n\
    As shown, RPA can achieve benefits that the management of any organization would\
    \ welcome. We will now discuss briefly how these can be applied. Detail on how\
    \ to achieve these and additional benefits is contained in subsequent chapters.\n\
    \n### Practical Applications\n\nIn order to achieve these and additional benefits,\
    \ RPA can be applied to a wide variety of processes. There are four key characteristics\
    \ to look for when determining if a process can easily be automated:\n\n1.  Is\
    \ it repetitive?\n    *   Do the same actions need to be performed over and over,\
    \ for different clients, employees, etc.? For example, if an invoice is created\
    \ manually, a clerk must obtain the name of the item or service purchased and\
    \ the cost of that item or service; they must find the name, address, and account\
    \ number of the purchaser and insert all the information onto an invoice template.\
    \ They then place it in an envelope and send it to the mailroom for postage.\n\
    \n2.  Would the cost of automating the process exceed the cost of continuing to\
    \ do it manually?\n    *   While a manual process may be very repetitive, it may\
    \ cost more to automate it than to continue doing it manually. On the surface,\
    \ such a process would not be a good candidate for automation.\n\n3.  Is automation\
    \ required for competitive value?\n    *   Saving money is not the only motivation\
    \ for automating a process. Perhaps the cost of automating a process will exceed\
    \ the dollar savings, but it should be automated to maintain a competitive advantage.\n\
    \n4.  Would automating a process better enable the organization to fulfill government\
    \ regulations?\n    *   Most industries adhere to various kinds of government\
    \ regulations. Automating processes to ensure that required work is done and reports\
    \ are issued on time can be highly beneficial.\n\nIn looking at any process automation\
    \ potential, a “Yes” to question 1 is required in order to continue investigation.\
    \ The repetitive nature of the process is key for automation. And while the cost\
    \ of automation may exceed the financial benefits accrued by it, this does not\
    \ eliminate the process from consideration for automation, since there may be\
    \ competitive or regulatory benefits that go beyond immediate financial considerations."
  trans: "\n# 概述\n\n几十年来，我们不断听到关于技术“快速迭代”、“技术环境日新月异”的讨论，以及企业需要保持“领先地位”才能在竞争中生存甚至保持相关性的呼声。各种方法层出不穷，其中像六西格玛这样的方法至今仍广受欢迎且行之有效，而另一些方法，例如能力成熟度模型（及其短命的继任者`集成能力成熟度模型`），在经历了一段可观的运行周期后，便逐渐被淘汰。\n\
    \n所有这些方法都曾（或仍在）服务于特定目的。许多组织已成功采用了这些模型。但流程改进是一项持续性的工作。在当前流程的基础上，此时此刻，我们还能做些什么来提高效率、惠及客户并提升盈利能力？一个选择是`机器人流程自动化（RPA）`。\n\
    \n克里斯蒂娜-克劳迪娅·奥斯曼在*经济信息学*杂志中撰文描述了`RPA`：\n\n> 新兴数字工具的出现支持组织通过提高效率和敏捷性、或减少错误和成本来改进业务流程。`机器人流程自动化（RPA）`工具旨在使用经过训练的机器人来执行人类员工的重复性手动任务。这不同于其他传统软件，因为机器人通过前端与其他信息系统进行通信。`RPA`不仅有助于减少员工的工作量和错误，还能节约成本。\n\
    \n总而言之，`RPA`意味着将重复性、手动流程交给“机器人”来执行，从而将原本从事这些任务的人员的时间解放出来，让他们能专注于更重要的问题——那些通常需要人类洞察力和决策能力，而不仅仅是遵循惯例和重复动作的问题。这些涉及认知思维的更复杂任务往往与客户直接相关。此外，自动化流程能减少人为错误和代价高昂的返工。它还能让员工从事需要思考的任务，而非简单重复机械行为，从而提升士气。\n\
    \n## 暂停思考\n\n将某些流程自动化，能让人们专注于更复杂的流程和任务，以及需要决策和/或创造力的工作。一个`机器人`只会精确执行被编程的任务，而这些通常是不需要思考的工作。想想这将如何帮助一项新的`RPA`计划获得支持。\n\
    \n# 优势\n\n`RPA`的优势显而易见。正如蒂莫西·德里斯科尔在*战略财务*中所言：\n\n> 如果设计得当，软件机器人可以每周 7 天、每天 24\
    \ 小时以低于人类的成本运行，同时提供更高质量和可扩展的产出。这一系列优势可以构成一个极具吸引力的价值创造商业案例。`RPA`计划通常针对那些劳动密集型和交易密集型流程，在这些流程中，人们执行的是重复性任务，这些任务可以被重新设计为由机器人或软件工具执行的基于规则的活动。`RPA`计划的好处可能包括但不限于表^(¹)中的关键衡量指标。\n\
    \n| 效率/成本指标 | 有效性/质量指标 | 风险/合规性指标 |\n| --- | --- | --- |\n| `%人员/成本缩减` `%生产力提升`\
    \ `%日处理量增加` | `%准确率提升` `%周期缩短` `%客户满意度提升` | `%运营风险降低` `%自动化控制增加` |\n\n如图所示，`RPA`能够实现任何组织管理层都欢迎的效益。我们将简要讨论这些效益如何得以应用。关于如何实现这些效益及其他好处的详细信息，包含在后续章节中。\n\
    \n## 实际应用\n\n为了达成这些及更多效益，`RPA`可应用于多种多样的流程。在判断一个流程是否易于自动化时，需关注四个关键特征：\n\n1.  流程是否具有重复性？\n\
    \    *   是否需要针对不同的客户、员工等反复执行相同的操作？例如，如果发票是手动创建的，文员必须获取所购物品或服务的名称及其成本；他们必须找到购买者的姓名、地址和账号，并将所有信息填入发票模板。然后将其放入信封并送至收发室进行邮寄。\n\
    \n2.  自动化该流程的成本是否会超过继续手动执行的成本？\n    *   虽然手动流程可能非常重复，但实现其自动化的成本可能比继续手动执行更高。表面上看，这样的流程并非自动化的理想候选。\n\
    \n3.  自动化是否为保持竞争价值所必需？\n    *   节省资金并非自动化流程的唯一动机。或许自动化流程的成本会超过节省的金钱，但为了维持竞争优势，仍应将其自动化。\n\
    \n4.  流程自动化是否能更好地帮助组织履行政府法规？\n    *   大多数行业都需遵守各种政府法规。将流程自动化，以确保完成必要工作并准时提交报告，可以带来巨大益处。\n\
    \n在评估任何流程的自动化潜力时，对问题 1 的回答为“是”是继续调研的必要条件。流程的重复性是自动化的关键。尽管自动化的成本可能超过其带来的财务收益，但这并不将该流程排除在自动化考虑范围之外，因为可能存在超越短期财务考量的竞争或监管方面的收益。\n"
- fmt: '## Structure of the Book


    How do you apply the principles to achieve the desired benefits? This book is
    structured to enable the novice to RPA to successfully implement an RPA program
    within their company. The first two chapters describe the groundwork required
    to implement RPA successfully. The remaining chapters describe the activities
    in specific phases of RPA implementation and how to monitor to ensure success.


    **Chapter 1. Overview.** Introduction to RPA, what it is, how it is growing throughout
    IT organizations, and how it can benefit your organization.


    **Chapter 2. Initial Preparation.** What is required to introduce a successful
    RPA program in any organization, larger or small? What are the key components
    that must be in place before you begin? How do you identify “early adopters” who
    will be key to your success? What are the hidden land mines, and how can you avoid
    them?


    **Chapter 3. Operating Model – Governance, Sponsorship, and Framework.** How much
    structure is needed? How flexible should that structure be? What gates should
    exist in order to assure that approval for a project remains valid, even if circumstances
    change? Who are the key stakeholders who will be responsible for the RPA program?
    Why is cancelling a project in a later phase not a “failure”?


    **Chapter 4. Opportunity Identification.** How do you solicit opportunities for
    automation? How do you best introduce the idea of automating repetitive manual
    processes? What forms will help you to best identify opportunities? Who (what
    roles) must be involved at this stage?


    **Chapter 5. Opportunity Assessment.** Once you have identified some possible
    candidates for automation, how do you assess them? What should you look for? What
    documentation is required? What do you present to the Governance Committee? How
    do you handle ambivalence (“this might be a good opportunity if…”)? Who (what
    roles) must be involved at this stage?


    **Chapter 6. Solution Design.** Once approved, how do you design the solution?
    Who is involved? What documentation is required?


    **Chapter 7. Solution Deployment, Maintenance, and Retirement.** Once designed,
    what is required pre-deployment? What steps must be taken to ensure the best possible
    chance for success? What documentation is required? Who (what roles) must be involved
    at this stage?


    **Chapter 8. Organizational Structure.** What is the best structure for your new
    RPA program? You will need to know what currently exists in your organization.
    We detail the three most common structures: centralized, decentralized, and hub
    and spoke.


    **Chapter 9. Development Methodologies and Framework.** Different organizations
    use different methodologies, such as a traditional Waterfall methodology, Agile,
    or a hybrid. Whatever methodology your organization uses, we describe the commonalities
    and how to best assure RPA success, regardless of the methodology.


    **Chapter 10. Planning for the Future.** As technologies change, how will you
    adapt? Also, as processes change, what alterations may be required for existing
    Bots? How can you build in the ability to change, even when the future is unknown?
    This chapter provides the necessary guidance to assure that your new RPA program
    will continue to provide benefits far into the future.


    **Chapter 11. Challenges and Pitfalls.** You will encounter many challenges as
    you implement an RPA program. We have detailed some of them in early chapters,
    but in this chapter, we will summarize them. What is the risk of half-hearted
    executive buy-in? How will you deal with line workers who feel their jobs may
    be jeopardized by automation (and how will you handle that situation if that is
    a real threat)? How do you work with a COE (Center of Excellence) most effectively,
    and on whom do those responsibilities fall if there is no COE in your organization?


    **Chapter 12. Summary.** In this concluding chapter, we focus on some of the key
    highlights of advantages and why RPA may be ideal for your organization. We also
    briefly note some of the cautions to be aware of as you begin to introduce RPA.


    **Appendix.** The Appendix contains all the documentation you need, as described
    within this book. This includes, but is not limited to, a request form (the basic
    starting point – eventually, this will be completed by the requestor, but initially,
    you will complete it with the requestor, since they will be unfamiliar with it),
    a risk assessment table, a feasibility assessment table, requirements documents
    (functional and nonfunctional) templates, and many others. These, of course, can
    and should be adapted to your particular needs, but they provide you with an important
    starting point. Often it is best, at first, to use them as they currently exist.
    Your ongoing experience with RPA will lead you to adapt them for greater effectiveness
    in your particular organization.


    While this book will be an ongoing reference for any RPA initiative, it is recommended
    that it be read start to finish initially. This way, the person new to RPA will
    have an excellent overview and know where to look within the book for more detailed
    information when questions arise.


    We wish you much success as you start your RPA journey!


    Footnotes


