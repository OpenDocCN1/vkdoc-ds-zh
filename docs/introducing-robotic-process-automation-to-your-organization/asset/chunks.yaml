- fmt: "# DevOps\n\nThe term DevOps combines development and operations practices\
    \ and tools into one framework, which is designed to increase an organization’s\
    \ ability to define, develop, and deploy IT solutions and services faster than\
    \ traditional software development methodologies would do.\n\nThe core principle\
    \ of DevOps lies in removing barriers between siloed development and operations\
    \ teams, to bring their work into one framework to work together throughout the\
    \ entire IT solution life cycle, from development and testing to deployment and\
    \ operations. In other words, DevOps brings people, process, and technology together\
    \ to constantly deliver value to the customer. In that framework, both teams communicate\
    \ frequently by setting strong cultural ethics around information sharing through\
    \ the set of chats, recurring design, problem-solving sessions, and huddles. This\
    \ creates an environment in which communication flows rapidly across all engaged\
    \ stakeholders such as developers, operations, and supporting teams.\n\n> **Tip**\
    \  \n> Silos sometimes occur because of individuals or managers “hoarding” information.\
    \ Tread softly as you work to eliminate them.\n\nTo avoid the long solution deployment\
    \ lead times, developers work on small increments that are released independently\
    \ of each other. To achieve that, DevOps uses continuous integration (`CI`) and\
    \ continuous delivery (`CD`) pipelines in combination with automation to move\
    \ code from one step of development and deployment to another. For `CI`, the key\
    \ goal is to find and fix bugs as soon as possible to improve quality and time\
    \ of delivery. The `CD` practice ensures that workable software can be built in\
    \ short periods of time and is ready to be reliably released at any time without\
    \ manual intervention. To deliver software quickly, DevOps tries to rely on automation\
    \ tools as much as possible. A great level of automation would ensure testing\
    \ and preparation for release to production with higher speed and frequency. When\
    \ `CD` is properly implemented, developers would always have available built,\
    \ tested, and ready-to-production items.\n\nBecause of the continuous nature of\
    \ DevOps processes, it is easier to visualize them as an infinity loop (Figure\
    \ 9-1). The loop consists of the phases on the development and the operations\
    \ sides and represents the relation to each other throughout the DevOps life cycle.\n\
    \n![../images/513218_1_En_9_Chapter/513218_1_En_9_Fig1_HTML.png](images/513218_1_En_9_Chapter/513218_1_En_9_Fig1_HTML.png)\n\
    \n**Figure 9-1** DevOps infinity loop^(32)\n\nDevOps can perfectly coexist with\
    \ Agile software development and is a great framework for large IT-driven transformative\
    \ projects to meet business needs. DevOps can address the challenges that limit\
    \ business growth, including delays in the release of new software; sometimes\
    \ the delay is so long that by the time it’s released, it doesn’t meet business\
    \ needs. In today’s fast-paced environment, where technology changes occur at\
    \ a rapid pace, an organization whose revenue is heavily dependent on IT capabilities\
    \ must be flexible and be able to adjust quickly. Time is critical and any delays\
    \ may shift an organization’s market position from leader to follower in a matter\
    \ of a few months.\n\nTherefore, the main benefits of DevOps is in:\n\n- Higher\
    \ speed of innovation.\n- Better adaptiveness to constantly changing market needs.\n\
    - Rapid value delivery to build or maintain a competitive advantage.\n- Higher\
    \ product/service reliability, much easier to ensure quality within smaller releases.\n\
    - Better collaboration between technology and operations; development and operations\
    \ work as one team by combining their workflows and by sharing accountabilities.\n\
    \nIn addition, DevOps becomes popular among Lean and Agile practitioners and continues\
    \ to evolve as artificial-intelligence-powered solutions come to aid in almost\
    \ everything we do, from reviewing inquiries, searching for and analyzing data,\
    \ performing digital tasks, and proposing decisions to incident management. It\
    \ means smarter solutions would require even shorter development and deployment\
    \ cycles, with higher solution reliability and built-in quality, and with seamless\
    \ transition from business needs identification to viable IT solution.\n\nLet’s\
    \ consider again our case study. A client sends an email notifying us that they\
    \ have changed their phone number and address. DevOps continuous integration and\
    \ delivery might be the following:\n\n- First iteration of development and release:\
    \ “Bot will read the email, read the phone number, and update the phone number\
    \ in the web application.” Those steps are going to be automated; the address\
    \ changes on the web application and mainframe and phone changes on mainframe\
    \ will still be processed manually. The business will be asked to approve and\
    \ accept this first iteration.\n- Second iteration: “Bot will read the email,\
    \ read the address, and update the address in the web application.” The mainframe\
    \ phone and address change will still be updated manually. The business will be\
    \ asked to approve and accept this second iteration.\n- Third iteration: “Bot\
    \ will read the email, read the phone, and update the phone number in the mainframe\
    \ system the address change on mainframe will still be changed manually.”\n- Fourth\
    \ iteration: “Bot will read the email, read the phone number and address, and\
    \ update the phone number and address in the mainframe system.”\n\nWith each new\
    \ iteration, you are increasing the scope of automation. Without lengthy requirement\
    \ gathering, the steps of approval, RPA development, and testing the solution\
    \ move from conceptual solution to live solution faster. Those shorter cycles\
    \ could prevent shifting requirements and solution scope creep, both of which\
    \ are common when teams are working on complex and large solutions. This incremental\
    \ and continuous delivery approach may be a new concept for the business, which\
    \ has been accustomed to only approving the entire requirements document, testing,\
    \ and accepting end-to-end automation at once.\n\n> **Pause and Consider**  \n\
    > Think about hybrid versions. For example, RPA may do development, but some other\
    \ team may gather requirements, do the deployment, etc. Would this be practical\
    \ in your organization? If it is required, what steps will you take to help ensure\
    \ success?\n\nRegardless of what methodology you select, the main challenge for\
    \ RPA is that, most of the time, the teams are new in the organization and usually\
    \ follow an Agile or Lean methodology. Existing business partners and tech teams\
    \ may still be in Waterfall mode, or in transformation, and Agile or Lean, with\
    \ their own vocabulary, practices, rules, guidelines, etc., may be very foreign,\
    \ and thus intimidating, to them. How do you build bridges between existing methodologies\
    \ and the new methodologies that RPA will introduce?\n\nWe discussed four methodologies\
    \ earlier in this chapter. Now we need to see how to incorporate the new RPA methodologies\
    \ into whatever the existing corporate methodologies are.\n\nFirst, let’s look\
    \ at some of the challenges:\n\n- The RPA team will be discussing Sprints, backlog\
    \ items, product increments, and other terms that the business may not be at all\
    \ familiar with.\n- The RPA team will present the business with a very limited\
    \ requirements document, the MVP (minimum viable product), as discussed earlier.\
    \ But the business may be expecting the complete requirements.\n- The business\
    \ may allocate a resource to review the requirements a month or two after the\
    \ project starts, depending on how complex it is, with the belief that it will\
    \ take that long to document the requirements. Yet that resource will be needed\
    \ throughout most of the project life cycle."
  raw: '## DevOps


    The term DevOps combines development and operations practices and tools into one
    framework, which is designed to increase an organization’s ability to define,
    develop, and deploy IT solutions and services faster than traditional software
    development methodologies would do.


    The core principle of DevOps lies in removing barriers between siloed development
    and operations teams, to bring their work into one framework to work together
    throughout the entire IT solution life cycle, from development and testing to
    deployment and operations. In other words, DevOps brings people, process, and
    technology together to constantly deliver value to the customer. In that framework,
    both teams communicate frequently by setting strong cultural ethics around information
    sharing through the set of chats, recurring design, problem-solving sessions,
    and huddles. This creates an environment in which communication flows rapidly
    across all engaged stakeholders such as developers, operations, and supporting
    teams.


    Tip


    Silos sometimes occur because of individuals or managers “hoarding” information.
    Tread softly as you work to eliminate them.


    To avoid the long solution deployment lead times, developers work on small increments
    that are released independently of each other. To achieve that, DevOps uses continuous
    integration (CI) and continuous delivery (CD) pipelines in combination with automation
    to move code from one step of development and deployment to another. For CI, the
    key goal is to find and fix bugs as soon as possible to improve quality and time
    of delivery. The CD practice ensures that workable software can be built in short
    periods of time and is ready to be reliably released at any time without manual
    intervention. To deliver software quickly, DevOps tries to rely on automation
    tools as much as possible. A great level of automation would ensure testing and
    preparation for release to production with higher speed and frequency. When CD
    is properly implemented, developers would always have available built, tested,
    and ready-to-production items.


    Because of the continuous nature of DevOps processes, it is easier to visualize
    them as an infinity loop (Figure [9-1](#513218_1_En_9_Chapter.xhtml#Fig1)). The
    loop consists of the phases on the development and the operations sides and represents
    the relation to each other throughout the DevOps life cycle.


    ![../images/513218_1_En_9_Chapter/513218_1_En_9_Fig1_HTML.png](images/513218_1_En_9_Chapter/513218_1_En_9_Fig1_HTML.png)


    Figure 9-1


    DevOps infinity loop^([^(32)](#fn32))


    DevOps can perfectly coexist with Agile software development and is a great framework
    for large IT-driven transformative projects to meet business needs. DevOps can
    address the challenges that limit business growth, including delays in the release
    of new software; sometimes the delay is so long that by the time it’s released,
    it doesn’t meet business needs. In today’s fast-paced environment, where technology
    changes occur at a rapid pace, an organization whose revenue is heavily dependent
    on IT capabilities must be flexible and be able to adjust quickly. Time is critical
    and any delays may shift an organization’s market position from leader to follower
    in a matter of a few months.


    Therefore, the main benefits of DevOps is in


    *   Higher speed of innovation.


    *   Better adaptiveness to constantly changing market needs.


    *   Rapid value delivery to build or maintain a competitive advantage.


    *   Higher product/service reliability, much easier to ensure quality within smaller
    releases.


    *   Better collaboration between technology and operations; development and operations
    work as one team by combining their workflows and by sharing accountabilities.


    In addition, DevOps becomes popular among Lean and Agile practitioners and continues
    to evolve as artificial-intelligence-powered solutions come to aid in almost everything
    we do, from reviewing inquiries, searching for and analyzing data, performing
    digital tasks, and proposing decisions to incident management. It means smarter
    solutions would require even shorter development and deployment cycles, with higher
    solution reliability and built-in quality, and with seamless transition from business
    needs identification to viable IT solution.


    Let’s consider again our case study. A client sends an email notifying us that
    they have changed their phone number and address. DevOps continuous integration
    and delivery might be the following:


    *   First iteration of development and release: “Bot will read the email, read
    the phone number, and update the phone number in the web application.” Those steps
    are going to be automated; the address changes on the web application and mainframe
    and phone changes on mainframe will still be processed manually. The business
    will be asked to approve and accept this first iteration.


    *   Second iteration: “Bot will read the email, read the address, and update the
    address in the web application.” The mainframe phone and address change will still
    be updated manually. The business will be asked to approve and accept this second
    iteration.


    *   Third iteration: “Bot will read the email, read the phone, and update the
    phone number in the mainframe system the address change on mainframe will still
    be changed manually.”


    *   Fourth iteration: “Bot will read the email, read the phone number and address,
    and update the phone number and address in the mainframe system.”


    With each new iteration, you are increasing the scope of automation. Without lengthy
    requirement gathering, the steps of approval, RPA development, and testing the
    solution move from conceptual solution to live solution faster. Those shorter
    cycles could prevent shifting requirements and solution scope creep, both of which
    are common when teams are working on complex and large solutions. This incremental
    and continuous delivery approach may be a new concept for the business, which
    has been accustomed to only approving the entire requirements document, testing,
    and accepting end-to-end automation at once.


    Pause and Consider


    Think about hybrid versions. For example, RPA may do development, but some other
    team may gather requirements, do the deployment, etc. Would this be practical
    in your organization? If it is required, what steps will you take to help ensure
    success?


    Regardless of what methodology you select, the main challenge for RPA is that,
    most of the time, the teams are new in the organization and usually follow an
    Agile or Lean methodology. Existing business partners and tech teams may still
    be in Waterfall mode, or in transformation, and Agile or Lean, with their own
    vocabulary, practices, rules, guidelines, etc., may be very foreign, and thus
    intimidating, to them. How do you build bridges between existing methodologies
    and the new methodologies that RPA will introduce?


    We discussed four methodologies earlier in this chapter. Now we need to see how
    to incorporate the new RPA methodologies into whatever the existing corporate
    methodologies are.


    First, let’s look at some of the challenges:


    *   The RPA team will be discussing Sprints, backlog items, product increments,
    and other terms that the business may not be at all familiar with.


    *   The RPA team will present the business with a very limited requirements document,
    the MVP (minimum viable product), as discussed earlier. But the business may be
    expecting the complete requirements.


    *   The business may allocate a resource to review the requirements a month or
    two after the project starts, depending on how complex it is, with the belief
    that it will take that long to document the requirements. Yet that resource will
    be needed throughout most of the project life cycle.'
  trans: "\n# DevOps\n\nDevOps 一词将开发与运维的实践和工具整合为一个框架，旨在提升组织定义、开发和部署 IT 解决方案及服务的能力，其速度远超传统软件开发方法。\n\
    \nDevOps 的核心原则在于打破开发与运维团队之间的孤立壁垒，将双方工作纳入同一框架，使其在整个 IT 解决方案生命周期（从开发、测试到部署和运维）中协同合作。换言之，DevOps\
    \ 将人员、流程和技术紧密结合，持续为客户创造价值。在此框架下，两个团队通过建立围绕信息共享的强文化伦理，借助一系列聊天工具、定期设计会议、问题解决会议及小组讨论，保持频繁沟通。这营造了一个信息能快速在开发者、运维及支持团队等所有相关利益方之间流动的环境。\n\
    \n> **提示**  \n> 信息孤岛有时因个人或经理“垄断”信息而产生。在消除它们时需谨慎行事。\n\n为避免解决方案部署周期过长，开发者以相互独立发布的小增量形式进行工作。为此，DevOps\
    \ 采用持续集成（`CI`）和持续交付（`CD`）流水线，并结合自动化技术，将代码从开发与部署的一个阶段推进到另一个阶段。对于`CI`，关键目标是尽早发现并修复缺陷，以提升交付质量和速度。`CD`实践则确保可在短时间内构建出可运行的软件，并随时准备好在无需人工干预的情况下可靠发布。为快速交付软件，DevOps\
    \ 尽可能依赖自动化工具。高度自动化能确保以更快的速度和更高的频率进行生产环境发布的测试与准备工作。当`CD`得到妥善实施时，开发者始终拥有已构建、测试完毕且可进入生产环境的产物。\n\
    \n鉴于 DevOps 流程的持续性特点，将其视为一个无限循环（图 9-1）更容易理解。该循环包含开发侧和运维侧的各个阶段，并展示了它们在整个 DevOps\
    \ 生命周期中相互关联的关系。\n\n![../images/513218_1_En_9_Chapter/513218_1_En_9_Fig1_HTML.png](img/513218_1_En_9_Fig1_HTML.png)\n\
    \n**图 9-1** DevOps 无限循环³²\n\nDevOps 能够与敏捷软件开发完美共存，是大型 IT 驱动型转型项目满足业务需求的绝佳框架。DevOps\
    \ 可以解决制约业务增长的挑战，包括新软件发布的延迟；有时延迟过长，以至于软件发布时已无法满足业务需求。在当今技术快速变革的快节奏环境中，收入严重依赖 IT\
    \ 能力的组织必须保持灵活并能迅速调整。时间至关重要，任何延迟都可能使组织的市场地位在短短数月内从领导者沦为追随者。\n\n因此，DevOps 的主要优势在于：\n\
    \n-   更高的创新速度。\n-   更好地适应不断变化的市场需求。\n-   快速交付价值，以建立或维持竞争优势。\n-   更高的产品/服务可靠性，在更小的发布中更容易保证质量。\n\
    -   技术与运维之间更好的协作；开发与运维通过整合工作流程和共担责任，像一个团队一样工作。\n\n此外，DevOps 在精益和敏捷实践者中日益流行，并随着人工智能驱动的解决方案在几乎我们做的所有事情中提供帮助（从审阅咨询、搜索分析数据、执行数字任务、提出决策到事件管理）而不断发展。这意味着更智能的解决方案需要更短的开发和部署周期，更高的解决方案可靠性和内建质量，以及从业务需求识别到可行\
    \ IT 解决方案的无缝过渡。\n\n让我们重新思考我们的案例研究。客户发送一封电子邮件，通知我们他们更改了电话号码和地址。DevOps 的持续集成和交付可能如下所示：\n\
    \n-   第一次迭代开发与发布：“机器人将读取电子邮件、读取电话号码，并在 Web 应用程序中更新电话号码。”这些步骤将实现自动化；Web 应用程序和大型机上的地址更改以及大型机上的电话更改仍将手动处理。将要求业务方面批准并接受这第一次迭代。\n\
    -   第二次迭代：“机器人将读取电子邮件、读取地址，并在 Web 应用程序中更新地址。”大型机上的电话和地址更改仍将手动更新。将要求业务方面批准并接受这第二次迭代。\n\
    -   第三次迭代：“机器人将读取电子邮件、读取电话，并在大型机系统中更新电话号码，大型机上的地址更改仍将手动进行。”\n-   第四次迭代：“机器人将读取电子邮件、读取电话号码和地址，并在大型机系统中更新电话号码和地址。”\n\
    \n每一次新的迭代，你都在扩大自动化的范围。无需冗长的需求收集、审批步骤、RPA 开发和测试解决方案，就能更快地从概念方案转变为实际方案。这些较短的周期可以防止需求变更和解决方案范围蔓延——这两者都是团队在处理复杂大型解决方案时常见的问题。这种增量式和持续交付的方法对于业务方来说可能是一个新概念，他们习惯了只一次性批准整个需求文档、测试并接受端到端的自动化。\n\
    \n> **暂停与思考**  \n> 思考混合版本。例如，RPA 可能负责开发，但由其他团队收集需求、进行部署等。这在你的组织中可行吗？如果需要，你将采取哪些步骤来确保成功？\n\
    \n无论你选择什么方法，RPA 的主要挑战在于，团队在组织中通常是新成立的，并且通常遵循敏捷或精益方法。现有的业务伙伴和技术团队可能仍处于瀑布模式，或正在转型中，而敏捷或精益模式及其特定的词汇、实践、规则、指南等，对他们来说可能非常陌生，因此令人生畏。你如何架设现有方法与\
    \ RPA 将引入的新方法之间的桥梁？\n\n我们本章前面讨论了四种方法。现在我们需要看看如何将新的 RPA 方法融入到现有的公司方法中去。\n\n首先，让我们看看一些挑战：\n\
    \n-   RPA 团队将讨论冲刺、待办项、产品增量等业务方可能完全不熟悉的术语。\n-   RPA 团队将向业务方提交一份非常有限的需求文档，即前面讨论过的\
    \ MVP（最小可行产品）。但业务方可能期望看到完整的需求。\n-   业务方可能会在项目启动一两个月后，根据项目的复杂程度，才分配资源来审阅需求，他们相信记录需求需要那么长时间。然而，在项目的大部分生命周期中，实际上都需要该资源的参与。\n"
- fmt: "# 规划未来\n\n让我们考虑一下，RPA团队更多是基于角色而非基于团队的。我们这样说的意思是，虽然有一个核心开发团队，包括一名业务分析师和一名系统分析师（根据组织的不同，可能还有其他或不同的角色），但还会有其他角色参与特定的RPA项目，而非所有项目。例如，在我们的案例研究中，我们需要客户服务部门的人员从头到尾参与团队。这个人（或这些人）将以互动方式帮助起草需求，因此在项目的大部分过程中都需要他们。对于不同的项目，比如一个确保商品税收符合政府法规的项目，则不需要客户服务部门的人员，但需要公司法规团队的人员。\n\
    \n因此，在这种模式下，固定团队成员（例如开发人员、流程分析师）留在该团队中；其他所需资源则根据需要共享。项目完成后，共享资源将返回其原始团队。\n\n>\
    \ **提示**  \n> 共享资源可能不需要全职在团队中。应根据具体项目确定需求。\n\n一个潜在的缺点是，共享资源在全职返回其原始团队后，将无法解决出现的问题。您必须计划如何处理这些资源所擅长的领域内的问题。\n\
    \n> **暂停与思考**  \n> 在您的组织中，需要采取哪些具体步骤来确定引入RPA时的最佳方法论？您需要与谁协商？需要获得谁的支持？您将如何获得这种支持？\n\
    \n如上所述，有多种开发方法论可供选择。但您不必感到不知所措；审视您组织中当前的情况，确定您认为最适合新RPA计划的方法论，并努力实施它。但请记住，看似对您的组织有巨大潜力的方法最终可能需要进行修改。这没有问题！理想情况下，RPA是迭代的；您在过程中学习。如果某些方法不起作用，请理解原因，然后要么消除障碍，要么朝不同的方向前进。\n\
    \n在下一章中，我们将讨论RPA如何不断演变，并提供最重要的趋势供您参考。\n\n---\n\n# 10. 规划未来\n\n虽然RPA相对较新，但由于需要自动化重复性、手动流程，它正在席卷技术公司。但技术日新月异，RPA也随之演变。了解即将到来的趋势对您很重要，这样您可以决定是否以及何时将它们引入您的组织。我们将在此讨论RPA最重要的“演进”。\n\
    \n`RPAAS`、`process mining`和`intelligent processing`是RPA的扩展。\n\n## `RPAAS` – 即服务型RPA\n\
    \n目前，大多数公司拥有自动化工具的原生客户端。在未来（这种转变已经发生），RPA的所有基础设施都将迁移到云端。正如*Robocloud*所述，“使用`RPA\
    \ as a service`意味着您的公司不必购买自己的服务器、许可证或专业服务。”^(33)\n\n其基本优势在于可以利用云的所有好处。这些包括：\n\n\
    *   **增加容量**：例如，假设您在一台机器上运行十个`Bot`。如果需要增加更多`Bot`，您将需要增加内存、处理速度等。使用`RPAAS`，您拥有足够的灵活性来更快地增加容量和复制服务器。您可以复制`Bot`运行的机器/服务器，从而更快地复制您的工作力量。\n\
    \n*   **增加灵活性**：例如，我们知道`Bot`许可证可能很昂贵。目前，如果您立即需要2个`Bot`，并且您预计在未来6-12个月内可能还需要2个，您需要购买12个许可证并为其创建基础设施。使用`RPAAS`，您可以利用云，并在几分钟内复制机器，因此您可以随时增加或减少`Bot`数量。通过与业务部门合作制定合理的业务和技术战略，您有可能实现显著的节省。\n\
    \n*   **快速适应新功能**：有时需要非常迅速地引入新功能。使用`RPAAS`，您可以快速适应新的发布版本和功能，因为您可以按需扩展基础设施。\n\n\
    > **暂停与思考**  \n> 基于您目前对RPA的了解，您认为`RPAAS`如何能使您的组织受益？您需要采取哪些步骤（例如，基于历史信息清晰地展示潜在的成本节省）来说服管理层采取下一步行动？"
  raw: 'Let’s consider that RPA teams are more role based than team based. By that,
    we mean that while there is a core group of developers, a business analyst and
    a system analyst (other or different roles depending on the organization), there
    are other roles that will work on specific RPA projects, but not others. For example,
    in our case study, we would need someone from customer service to be part of the
    team from start to finish. That person (or persons) would help draft requirements
    in an interactive manner, and so would be needed throughout most of the project.
    For a different project, perhaps one that assures that taxes on merchandise adhere
    to government regulations, no one from customer service would be needed, but someone
    from the company’s regulatory team would be.


    So with this model, the permanent team members (e.g. developer, process analyst)
    remain on that team; other needed resources are shared as required. After the
    project completes, the shared resources are released back to their original team.


    Tip


    Shared resources may not be required full time on the team. Determine the need
    on a project-by-project basis.


    One of the potential downfalls is that, after the shared resources return full-time
    to their original teams, they won’t be available to address issues that arise.
    You must plan for how you will handle issues that those resources were expert
    in.


    Pause and Consider


    What specific steps do you need to take in your organization to determine the
    best methodology as you introduce RPA? Who do you need to confer with? Who needs
    to buy in? How will you get that buy-in?


    As indicated, there are a variety of development methodologies for you to choose
    from. But you needn’t be overwhelmed; review what is current in your organization,
    determine which methodology you think would be most successful with your new RPA
    initiative, and work to implement it. But remember, what may appear to have great
    potential for your organization may wind up having to be changed. That is fine!
    Ideally, RPA is iterative; you learn as you go along. If something doesn’t work,
    understand why, and either remove the roadblocks, or go in a different direction.


    In the next chapter, we will discuss how RPA is constantly evolving and provide
    details on the most important trends for you to consider.


