  trans: "\n# 开发/实施\n\n一旦软件设计文档（SDD）完成、经过评审、批准并最终签署，机器人的开发工作即可启动。\n\n在开发 RPA 解决方案时，开发或实施活动与传统的操作方式有所不同。对于新组建的\
    \ RPA 开发团队而言，工作可划分为三个阶段。首先是流程步骤的解决方案设计：自动化解决方案的具体形态是怎样的？机器人将执行哪些操作？这将确立技术解决方案的未来愿景或视图。\n\
    \n其次，对机器人进行详尽设计。基于已构想的解决方案，现在进入详细设计阶段。\n\n最后，在组织所使用的自动化工具中完成机器人的实际编码与实施。当然，这首先要确定技术解决方案的愿景，然后根据已创建的设计开展实际的编码工作。\n\
    \n与任何开发工作一样，必须遵循编码标准。如果你的组织没有编码标准，可以由团队自行制定。\n\n**暂停与思考**\n\n如果贵组织没有编码标准，引入 RPA\
    \ 计划正是制定这些标准的好时机。在你的组织中如何定义这些标准由你决定，但你需要确保这些标准足够严谨，并能在各平台及业务单元间通用。\n\n如果你的团队不确定编码标准在软件开发中的重要性，或许你可以提醒他们一些关键理由。编码标准有助于提升整个软件系统的质量。它们体现了一致的风格，仿佛由同一位开发者在同一时间段内完成所有代码。编码标准不仅仅反映了软件本身，更是组织形象的体现。此外，它们极大地提升了代码的可维护性；任何遵循既定标准的合格开发人员都能维护这些代码。拥有编码标准还有助于限制风险；由于遵循了标准，任何人都能读懂代码，从而减少了不确定性。编码标准也能提升代码质量；所有开发者都必须遵守专业、预先批准的标准。最后，这些标准有助于所有开发者熟悉代码结构。\n\
    \n《BOTmantra》的 Nishant Goel 和 Satyendra Shinde 提出了五（5）项关键编码标准及其子类别。以下列表展示了所有内容：\n\
    \n**前 5 项标准：**\n\n1.  **可读性**\n    1.  命名约定标准及合规性\n2.  **零垃圾代码使用**\n3.  **组件化**\n\
    4.  **简化逻辑**\n5.  **可配置性**\n    1.  性能参数\n    2.  URL、文件及文件夹路径\n    3.  电子邮件地址\n\
    \    4.  凭证信息\n    5.  业务规则阈值参数\n    6.  日志消息\n    7.  电子邮件格式\n    8.  通用设计\n\
    6.  **可靠性**\n    1.  异常处理\n    2.  最佳交互技术\n    3.  避免内存泄漏\n    4.  自动恢复与自愈机制\n\
    7.  **安全性**\n    1.  授权\n    2.  身份验证\n    3.  凭证管理\n    4.  业务数据存储\n    5.  数据共享\n\
    8.  **性能**\n    1.  延迟管理\n    2.  并行执行\n    3.  交互技术运用\n    4.  内存管理^(¹⁵)\n\n\
    现在我们将详细审视每个组件：\n\n**1. 可读性：** 代码的易读性如何？是否存在命名约定？是否遵循了命名约定？代码是否尽可能简洁？是否有注释来解释模块，甚至在必要时解释单行代码？\n\
    \n> **提示**\n> \n> 编写代码的开发人员可能并非随时可用，一旦出现问题。任何合格的程序员都应该能够阅读并理解这些代码。\n\n**2. 可配置性：**\
    \ 创建机器人时必须考虑到后续变更的可能性。可能需要添加新参数，或者不同系统需要与机器人“通信”。你是否包含了性能参数、文件路径、文件夹路径、各种凭证和业务规则等？\n\
    \n> **提示**\n> \n> 始终要着眼于未来进行设计。\n\n**3. 可靠性：** 需要达到怎样的精确度？请记住，我们说过，当需要从流程中移除进行人工处理的事件很少时，使用\
    \ RPA 自动化人工流程是最佳选择。对于正在处理的特定流程，可接受的异常率是多少？将如何处理这些异常？是否有自动恢复机制来避免停机？\n\n> **提示**\n\
    > \n> 有时人们认为面向客户的流程比内部流程需要更高的精确度。切勿在任何流程上偷工减料，否则会损害你的信誉。\n\n**4. 安全性：** 严格的风险评估将大大增强安全性。如前所述，风险评估是持续进行的：在早期阶段，仅能获得有限信息，因此无法全面了解所有风险。这没问题！但随着项目的推进，会识别出更多风险。每项风险都必须加以缓解或接受，除非风险过大，以至于治理委员会决定取消项目。了解以下内容很重要：使用、更改或停止自动化需要哪些授权？机器人如何“知道”它应该运行还是停止？身份验证如何完成？流程的输入和输出数据将存储在哪里？\n\
    \n> **提示**\n> \n> 如前所述，让你的风险与合规团队尽早参与将会非常有益。请记住，该团队在你的组织中可能有不同的名称。\n\n**5. 性能：**\
    \ 你将如何优化性能？哪种交互技术最适合这个特定流程？机器人能否同时运行两个或多个进程？对于这个流程，最高效的业务逻辑配置是什么？\n\n**暂停与思考**\n\
    \n前面讨论的四个组件都会影响性能。你的性能标准是什么？你的组织有哪些要求？清晰地定义这些要求将极大地帮助你确定可读性、可配置性、可靠性和安全性方面需要达到的标准。\n\
    \n在这一点上，你可能会觉得在组织中引入并成功实施 RPA 计划需要完成大量工作。是的，要做的事情很多。但你正在做的事情无异于一场革新贵组织运营方式的革命。这样的举措需要时间和精力，但如果执行得当，将带来显著收益。所以，不要被所需的工作吓倒；按照我们提供的步骤去做。当一步一步来时，任何任务都并非那么令人生畏。\n\
    \n**暂停与思考**\n\n对于每一项标准，你需要确定哪些是贵组织必需的，以及每项标准的严格程度应为多少。在贵组织中，哪些可配置性组件至关重要？哪些是“锦上添花”？每项组件应详细到何种程度？这些问题的答案会因公司而异，甚至在同一公司内部的不同业务单元之间也会有所不同。而且，某个自动化项目所需的标准可能比另一个项目更多或更少。\n\
    \n> **提示**\n> \n> 随着团队经验的增长，技术可行性将融入设计活动中，但就目前而言，它应保持独立。\n"
- fmt: "## Code Reviews\n\nFor many organizations, code reviews may be informally\
    \ performed, if done at all. Establishing a code review practice in your development\
    \ activity or team is very important. Dan Radigan, writing in *ATLASSIAN Agile\
    \ Coach*, says that “Code review helps developers learn the code base, as well\
    \ as help them learn new technologies and techniques that grow their skill sets.”^([^(16)](#fn16))\n\
    \nIn the process of code reviews, other developers review the code to assure quality;\
    \ remember, there is no place for “spaghetti code today”. Code reviews help ensure\
    \ the readability of the code.\n\nThe code review also ensures that coding standards,\
    \ which we’ve already discussed, are strictly followed.\n\nAnother advantage of\
    \ code reviews is that they help to assure that code can be easily maintained.\n\
    \nThey also assure that exception handling standards for the particular process\
    \ being automated are followed.\n\nCode reviews, like all aspects of development,\
    \ are more efficient and effective when certain guidelines exist. Having clearly\
    \ documented coding standards is key. Also, it is helpful to provide and follow\
    \ checklists; create these from your code review standards.\n\nAdditionally, it\
    \ is often beneficial to provide pre-review training, to assure that developers\
    \ are familiar with the standards they must follow.\n\nHaving code templates is\
    \ also very helpful.\n\n> **Tip**  \n> If you reduce code reviews to an afterthought,\
    \ something you will do “if time allows,” be prepared to fail. Code reviews are\
    \ an integral part of any RPA project.\n\n## Testing\n\nOnce code reviews are\
    \ completed, and any changes to code have been made and re-reviewed, you are ready\
    \ to test.\n\nFor successful testing, the testing teams must be completely familiar\
    \ with the process. Knowing and understanding the relevant `PDD` (process design\
    \ documents) and `SDD` (solution design documents) are key to success.\n\nAn exhaustive\
    \ list of test use cases must be created; this could be an overall test plan.\
    \ This will include testing data for the automation.\n\n> **Tip**  \n> As you\
    \ progress with the RPA initiative, you will learn from defects and thus improve\
    \ testing procedures. Even the most comprehensive test plans will not be bulletproof;\
    \ there will be continued fine-tuning of testing procedures.\n\nTesting automation\
    \ can be a challenge for several reasons. A major one is that many organizations\
    \ don’t have testing environments. Also, it is sometimes difficult to get data,\
    \ and the Bot may behave differently based on the data it is given.\n\nAdditionally,\
    \ the more applications with which the Bot needs to interact, the more difficult\
    \ it becomes to build and manage parallel environments for testing. Because updates\
    \ to the applications happen during Bot execution, sometimes testing can only\
    \ be done in the production environment. This includes the Bot needing to update\
    \ some screens that may have wrong data or the possibility of it making incorrect\
    \ or partial updates.\n\nFollowing established testing techniques is vital when\
    \ transitioning to RPA. We will look at some of the aspects of RPA testing that\
    \ you may find different from testing in other methodologies.\n\nAlso, please\
    \ remember that the people performing testing must be trained. Someone with minimal\
    \ training may be able to execute the testing (see step 4), but steps 1, 2, and\
    \ 3 require a degree of knowledge that if learned “on the job” carries high risks.\
    \ Be sure that the people performing these steps are trained in doing them. If\
    \ a less experienced person is going to perform step 4, be sure they are trained\
    \ on what’s required for step 5.\n\n1. **Know the business process**: Those performing\
    \ the testing must know and thoroughly understand the business process that is\
    \ being automated. Without this knowledge, they will be unable to properly develop\
    \ and implement effective tests.\n\n   The best way to understand the process\
    \ is to review the process definition document (`PDD`), the solution design document\
    \ (`SDD`), and any other documentation that was created during the design phase\
    \ of the automation. Once the team understands the business process, it can move\
    \ on to the next step: creating the test scenarios to actually test the codes.\n\
    \n   > **Tip**  \n   > If something is unclear, don’t hesitate to contact the\
    \ business owner for clarification. Do not cut corners in understanding the process.\n\
    \n2. **Create test scenarios**: This is another key area. Review the `PDD` and\
    \ the `SDD`, with special attention paid to the `SDD` which, if done properly,\
    \ will list the most important scenarios to be tested. But don’t ignore the `PDD`;\
    \ very useful information for building test scenarios can be gleaned from that\
    \ document, too.\n\n3. **Write test scripts**: Now that the testers thoroughly\
    \ understand the process to be automated and have created test scenarios, the\
    \ next step is to create a series of test cases. Test cases are very specific:\
    \ they list the inputs, expected output (or outputs), and a column (often test\
    \ scripts are written in a spreadsheet) to indicate if the test passed or failed\
    \ and another column for any notes. This column is especially useful for tests\
    \ that fail.\n\n   > **Tip**  \n   > To maximize the effectiveness of test scripts,\
    \ they should be reviewed by the design team. This “second set of eyes” is very\
    \ familiar with the process and can assist in finding any testing gaps.\n\n4.\
    \ **Perform testing**: Now that you have completed all the preliminary work, the\
    \ actual testing is performed. Complete all the work of each test case, documenting\
    \ if each passed or failed, with any relevant comments."
  raw: '## Code Reviews


    For many organizations, code reviews may be informally performed, if done at all.
    Establishing a code review practice in your development activity or team is very
    important. Dan Radigan, writing in *ATLASSIAN Agile Coach*, says that “Code review
    helps developers learn the code base, as well as help them learn new technologies
    and techniques that grow their skill sets.”^([^(16)](#fn16))


    In the process of code reviews, other developers review the code to assure quality;
    remember, there is no place for “spaghetti code today”. Code reviews help ensure
    the readability of the code.


    The code review also ensures that coding standards, which we’ve already discussed,
    are strictly followed.


    Another advantage of code reviews is that they help to assure that code can be
    easily maintained.


    They also assure that exception handling standards for the particular process
    being automated are followed.


    Code reviews, like all aspects of development, are more efficient and effective
    when certain guidelines exist. Having clearly documented coding standards is key.
    Also, it is helpful to provide and follow checklists; create these from your code
    review standards.


    Additionally, it is often beneficial to provide pre-review training, to assure
    that developers are familiar with the standards they must follow.


    Having code templates is also very helpful.


    Tip


    If you reduce code reviews to an afterthought, something you will do “if time
    allows,” be prepared to fail. Code reviews are an integral part of any RPA project.


    ## Testing


    Once code reviews are completed, and any changes to code have been made and re-reviewed,
    you are ready to test.


    For successful testing, the testing teams must be completely familiar with the
    process. Knowing and understanding the relevant PDD (process design documents)
    and SDD (solution design documents) are key to success.


    An exhaustive list of test use cases must be created; this could be an overall
    test plan. This will include testing data for the automation.


    Tip


    As you progress with the RPA initiative, you will learn from defects and thus
    improve testing procedures. Even the most comprehensive test plans will not be
    bulletproof; there will be continued fine-tuning of testing procedures.


    Testing automation can be a challenge for several reasons. A major one is that
    many organizations don’t have testing environments. Also, it is sometimes difficult
    to get data, and the Bot may behave differently based on the data it is given.


    Additionally, the more applications with which the Bot needs to interact, the
    more difficult it becomes to build and manage parallel environments for testing.
    Because updates to the applications happen during Bot execution, sometimes testing
    can only be done in the production environment. This includes the Bot needing
    to update some screens that may have wrong data or the possibility of it making
    incorrect or partial updates.


    Following established testing techniques is vital when transitioning to RPA. We
    will look at some of the aspects of RPA testing that you may find different from
    testing in other methodologies.


    Also, please remember that the people performing testing must be trained. Someone
    with minimal training may be able to execute the testing (see step 4), but steps
    1, 2, and 3 require a degree of knowledge that if learned “on the job” carries
    high risks. Be sure that the people performing these steps are trained in doing
    them. If a less experienced person is going to perform step 4, be sure they are
    trained on what’s required for step 5.


    1.  Know the business process: Those performing the testing must know and thoroughly
    understand the business process that is being automated. Without this knowledge,
    they will be unable to properly develop and implement effective tests.


    The best way to understand the process is to review the process definition document
    (PDD), the solution design document (SDD), and any other documentation that was
    created during the design phase of the automation. Once the team understands the
    business process, it can move on to the next step: creating the test scenarios
    to actually test the codes.


    Tip If something is unclear, don’t hesitate to contact the business owner for
    clarification. Do not cut corners in understanding the process.


    2.  Create test scenarios: This is another key area. Review the PDD and the SDD,
    with special attention paid to the SDD which, if done properly, will list the
    most important scenarios to be tested. But don’t ignore the PDD; very useful information
    for building test scenarios can be gleaned from that document, too.


    3.  Write test scripts: Now that the testers thoroughly understand the process
    to be automated and have created test scenarios, the next step is to create a
    series of test cases. Test cases are very specific: they list the inputs, expected
    output (or outputs), and a column (often test scripts are written in a spreadsheet)
    to indicate if the test passed or failed and another column for any notes. This
    column is especially useful for tests that fail.


    Tip To maximize the effectiveness of test scripts, they should be reviewed by
    the design team. This “second set of eyes” is very familiar with the process and
    can assist in finding any testing gaps.


    4.  Perform testing: Now that you have completed all the preliminary work, the
    actual testing is performed. Complete all the work of each test case, documenting
    if each passed or failed, with any relevant comments.'
  trans: "\n## 代码审查\n\n对于许多组织而言，代码审查即便会执行，也往往以非正式方式进行。在您的开发活动或团队中建立代码审查实践非常重要。丹·拉迪根在*ATLASSIAN\
    \ Agile Coach* 中写道：“代码审查有助于开发者理解代码库，并帮助他们学习能拓展技能的新技术和新方法。”^(¹⁶)\n\n在代码审查过程中，其他开发者会审查代码以保证质量；请记住，如今已没有“意大利面条式代码”的容身之地。代码审查有助于确保代码的可读性。\n\
    \n代码审查还能确保我们已讨论过的编码标准得到严格遵守。\n\n代码审查的另一个优点是，它有助于保证代码易于维护。\n\n它还能确保遵循正在自动化的特定流程的异常处理标准。\n\
    \n与开发的所有方面一样，当存在特定指导方针时，代码审查会更高效、更有效。拥有清晰记录的编码标准是关键。此外，提供并遵循检查表也很有帮助；请根据您的代码审查标准创建这些检查表。\n\
    \n另外，提供审查前培训通常也很有益，以确保开发者熟悉他们必须遵守的标准。\n\n拥有代码模板也大有裨益。\n\n> **提示**  \n> 如果您将代码审查视为事后想法，变成“如果有时间就做”的事情，那就准备好迎接失败吧。代码审查是任何\
    \ RPA 项目中不可或缺的一部分。\n\n## 测试\n\n一旦代码审查完成，且对代码所做的任何修改均已审查并重新审查，您就可以开始测试了。\n\n为了成功进行测试，测试团队必须完全熟悉该流程。了解并理解相关的`PDD`（流程设计文档）和`SDD`（解决方案设计文档）是成功的关键。\n\
    \n必须创建一份详尽的测试用例清单；这可以是一份总体测试计划。这将包含自动化所需的测试数据。\n\n> **提示**  \n> 随着 RPA 项目的推进，您将从缺陷中学习，从而改进测试流程。即使是最全面的测试计划也不会无懈可击；测试流程需要持续微调。\n\
    \n出于多种原因，自动化测试可能是一项挑战。一个主要原因是，许多组织没有测试环境。此外，有时获取数据也很困难，并且机器人可能会根据提供给它的数据表现出不同的行为。\n\
    \n另外，机器人需要交互的应用程序越多，构建和管理并行测试环境就越困难。因为在机器人执行期间应用程序会发生更新，有时测试只能在生产环境中进行。这包括机器人需要更新某些可能包含错误数据的屏幕，或者它可能进行不正确或不完整更新的情况。\n\
    \n在过渡到 RPA 时，遵循既定的测试技术至关重要。我们将探讨 RPA 测试中您可能会发现与其他方法学测试不同的一些方面。\n\n此外，请记住执行测试的人员必须经过培训。接受过最低限度培训的人或许能够执行测试（见步骤\
    \ 4），但步骤 1、2 和 3 需要一定程度的知识，如果在“工作中”学习这些知识会带来很高风险。请确保执行这些步骤的人员接受过相关培训。如果经验较少的人员将执行步骤\
    \ 4，请确保他们接受了关于步骤 5 所需内容的培训。\n\n1. **了解业务流程**：执行测试的人员必须深入了解并彻底理解正在被自动化的业务流程。缺乏这种知识，他们将无法正确开发和实施有效的测试。\n\
    \n   理解流程的最佳方式是审查流程定义文档（`PDD`）、解决方案设计文档（`SDD`）以及在自动化设计阶段创建的任何其他文档。一旦团队理解了业务流程，就可以进入下一步：创建测试场景来实际测试代码。\n\
    \n   > **提示**  \n   > 如果有不清楚的地方，请立即联系业务负责人以获取澄清。不要在理解流程上走捷径。\n\n2. **创建测试场景**：这是另一个关键领域。审查`PDD`和`SDD`，特别关注`SDD`，如果文档编写得当，它会列出需要测试的最重要的场景。但也不要忽略`PDD`；从该文档中也能收集到对构建测试场景非常有用的信息。\n\
    \n3. **编写测试脚本**：现在测试人员已经彻底理解了要自动化的流程并创建了测试场景，下一步是创建一系列测试用例。测试用例非常具体：它们列出输入、预期输出，并有一列（测试脚本通常在电子表格中编写）来指示测试通过或失败，另有一列用于记录备注信息。对于失败的测试，该列尤其有用。\n\
    \n   > **提示**  \n   > 为了最大化测试脚本的有效性，它们应由设计团队进行审查。这个“第二双眼睛”非常熟悉流程，能够帮助发现任何测试缺口。\n\
    \n4. **执行测试**：现在您已完成所有准备工作，可以执行实际测试了。完成每个测试用例的所有工作，记录每个测试是通过还是失败，并附上任何相关评论。\n"
- fmt: "5.  `Rectify` defects: Do not expect all test cases to succeed; if they do,\
    \ it’s likely you have not created sufficiently effective test cases. Defects\
    \ are common, and identifying them is a main purpose of testing. All failed test\
    \ cases should be fully documented; too much information is better than too little.\
    \ There must be sufficient information for the development team to be able to\
    \ correct the errors.\n\n**Pause and Consider**\n\nWhat is the testing process\
    \ in your organization today? How must it be adjusted for RPA testing? Will there\
    \ be resistance to these changes? If so, how will you overcome it?\n\nThe test\
    \ documentation must be stored in a repository that is easily accessible to the\
    \ people needing access to it. Remember that the developers who will need to see\
    \ it are probably working on multiple projects. You need to be sure they can quickly\
    \ and easily find the information they need.\n\n**Pause and Consider**\n\nWhere\
    \ is test documentation currently stored in your organization? Is it sufficiently\
    \ accessible to suit the needs of your new RPA initiative? If not, what changes\
    \ need to be made? Who will make them?\n\nMuch of what has been discussed in this\
    \ session relates to quality assurance (QA) and quality control (QC). That is\
    \ not coincidental! Let’s look at the definitions of each:\n\nQuality assurance:\
    \ “Part of *quality management* focused on providing confidence that *quality\
    \ requirements* will be fulfilled.”^([^(17)](#fn17))\n\nQuality control: “Part\
    \ of *quality management* focused on fulfilling *quality requirements*.”^([^(18)](#fn18))\n\
    \nSo quality control can be seen as fulfilling the needs of quality assurance.\n\
    \n**Pause and Consider**\n\nDoes your organization have formal quality assurance\
    \ and quality control functions? If so, how can they best be integrated into your\
    \ new RPA initiative? What, if anything, will need to be done differently? If\
    \ there are no formal quality assurance and quality control functions, how can\
    \ you still assure that the needs of both are met within your RPA program?\n\n\
    ## Automating Test Execution\n\nWhen the RPA team is automating customer or client\
    \ processes, it will be beneficial to automate its own processes also. This includes\
    \ automating the testing process of Bots.\n\nSince all Bots are unique in their\
    \ function, before deciding to automate their testing, there are a few things\
    \ that need to be considered. Determine how frequently will testing automation\
    \ be used. For each particular Bot, how simple or how complex would it be to create\
    \ automation testing. Also, determine if the testing automation you may create\
    \ could be used to test other Bots in the future; try to determine its reusability.\n\
    \nIf it is determined that automated Bot testing would be beneficial, there will\
    \ be three components to do so. You will first do automation to set up the environment\
    \ and create the required test data. You will then execute the Bot automation.\
    \ Finally, you will gather the output data after the Bot execution and validate\
    \ the output to create a test summary.\n\n## Case Study\n\nNow let’s look at how\
    \ solution design is implemented in our case study which was introduced in Chapter\
    \ [4](#513218_1_En_4_Chapter.xhtml). We moved forward with it in Chapter [5](#513218_1_En_5_Chapter.xhtml).\
    \ Now we will see how our hypothetical case would move through solution design.\n\
    \nLet’s start by creating the `SDD`. In this document, we need to populate a variety\
    \ of information. There are a variety of templates available online; use the one\
    \ we provided or any other template that seems to meet your needs.\n\n### Solution\
    \ Design Document\n\n**Phone and Address Change**\n\n| **Approval** | **Signature**\
    \ |\n| --- | --- |\n| Mary Brown, Manager, Customer Service |   |\n\n|   |   |\
    \ **Comments** |\n| --- | --- | --- |\n| **Author** | John Williams, CSS Supervisor\
    \ |   |\n| **Date** | July 28, 20xx |   |\n| **Version** | Draft 0.1 | Initial\
    \ draft |\n\n#### Purpose of This Document\n\nThis document contains the solution\
    \ design for the phone and address update process. It presents the high-level\
    \ “As Is” process steps and the “To Be” process steps that will be automated.\n\
    \nThe current process is as follows:\n\n* The request to change an address and/or\
    \ phone number is received in the specified mailbox.\n* The CSS verifies the client\
    \ ID and updates the information as required.\n* The CSS confirms the update with\
    \ the client.\n* The CSS maintains a record of updated information.\n\n#### Flow\
    \ Diagram\n\n![../images/513218_1_En_6_Chapter/513218_1_En_6_Figb_HTML.png](images/513218_1_En_6_Chapter/513218_1_En_6_Figb_HTML.png)\n\
    \n#### Goal of the Automation\n\nThe goal is to create a Bot that will retrieve\
    \ the emails, read and parse them, update the information as specified, and inform\
    \ the client that the information has been updated.\n\n#### Applications Involved\n\
    \n| **Name** | **Internal/External** | **Type** | **Credentials Required?** |\
    \ **Read/Write** |\n| --- | --- | --- | --- | --- |\n| Web Application – Client\
    \ CRM | Internal | Network-hosted application | Yes | Both |\n| Mainframe 1 |\
    \ Internal | Mainframe | Yes | Both |\n\n#### Inputs\n\n| **Name** | **Description**\
    \ | **Initial Value** |\n| --- | --- | --- |\n| `AddressUpdate_ClientID` | An\
    \ email that will contain the client ID and a new phone number and/or address\
    \ | Address and/or phone information |\n\n#### Process Steps\n\n**First Sub-process**\n\
    \n| **Step Number** | **Description** |\n| --- | --- |\n| 1 | Bot starts. |\n\
    | 2 | Bot logs into email account. |\n| 3 | Bot reads emails. |\n| 4 | Bot extracts\
    \ client information. |\n| 5 | When all emails have been read, Bot sends completion\
    \ message. |\n\n**Second Sub-process**\n\n| **Step Number** | **Description**\
    \ |\n| --- | --- |\n| 6 | Bot logs into Web CRM. |\n| 7 | Bot searches with client\
    \ ID. |\n| 8 | Bot doesn’t find client ID – “not found” message sent. |\n| 9 |\
    \ Bot finds client ID. |\n| 10 | Bot populates client information in appropriate\
    \ fields. |\n| 11 | Bot activates update. |\n| 12 | Bot sends completion message.\
    \ |\n\n**Third Sub-process**\n\n| **Step Number** | **Description** |\n| --- |\
    \ --- |\n| 13 | Bot logs into Mainframe. |\n| 14 | Bot searches with client ID.\
    \ |\n| 15 | Bot doesn’t find client ID – “not found” message sent |\n| 16 | Bot\
    \ finds client ID. |\n| 17 | Bot populates client information in appropriate fields.\
    \ |\n| 18 | Bot activates update. |\n| 19 | Bot sends completion message. |\n\n\
    **Fourth Sub-process**\n\n| **Step Number** | **Description** |\n| --- | --- |\n\
    | 20 | Bot sends email to Client. |\n\n#### Exceptions\n\n* Business\n  * Client\
    \ ID is missing in the email: Send exception message `EmailMissingClientID`.\n\
    \  * Last name or first name is missing in the email: Send exception message `EmailMissingFirstOrLastName`.\n\
    * Technical\n  * Web CRM URL not reachable: Send exception message `CRMInReachable`.\n\
    \  * Login password failed – Web CRM: Send exception message `LoginFailedPWDExpired`.\n\
    \n#### Success Criteria\n\nThe process is complete when the Bot sends a job completion\
    \ notification daily at (time – TBD).\n\n#### Debugging Tips"
