  trans: '

    # 维护


    一旦机器人被部署到生产环境并上线运行，它便会开始按照预定的计划执行任务。此时，维护工作便提上了日程。每个机器人都有一份服务级别协议（SLA），用于在机器人未能按预期执行时设定业务期望。这主要涉及两个方面：一方面是技术层面，另一方面是业务层面。技术层面涵盖因服务器宕机、基础设施维护等技术原因导致机器人无法运行的情况。业务问题则可能与机器人因数据不可用，或在机器人执行时为其提供数据的输入系统尚未就绪而导致无法按要求运行有关。


    对于技术原因，技术团队或卓越中心（COE）的主要职责是向业务部门通报中断情况，并与任何其他相关利益方共享事态信息。应确保他们随时了解进展情况和机器人预计恢复正常运行的时间。对于任何业务原因，技术团队需要与业务团队协调，以便暂停或中止机器人运行，直至业务问题得到解决；技术团队还将与业务团队和/或卓越中心团队紧密合作，确保信息同步。


    **调度：** 开发人员需要了解机器人的运行时间。这可能是每天在特定时间运行一次或多次；也可能是每周、每月等。这将在与业务的早期讨论中确定，并在此处为开发团队记录。


    **灾难恢复：** 如果机器人停止工作怎么办？要么是完全停止运行，要么是发生故障，以至于无法执行其任务。同样，这种情况下的处理方式应该在更早的时候（通常在最初创建风险评估时）就与业务部门讨论过。无论最终决定是什么，都应在此处说明。至少，在机器人修复完成之前恢复到人工流程是灾难恢复的一个方面。


    完成 SDD 后，可根据贵组织的流程将其提交审批。


    一旦 SDD 获得批准，您就可以开始在选定的自动化工具中开发机器人了。本书中介绍的步骤对于您使用的任何工具都将有效。


    # 测试


    在按照我们案例研究中的流程构建机器人以实现自动化之后，下一个关键活动是测试机器人。


    为了记录所有测试、测试执行及其结果，可以创建一个测试总结文档。尽量保持测试总结文档的简单性，以便于理解。在我们假设的自动化项目中，我们将遵循一个包含三个选项卡的测试总结：


    - 第一个选项卡包含关于机器人和测试结果的信息。

    - 第二个选项卡包含测试场景及其结果。

    - 第三个选项卡包含测试数据。


    **测试总结**


    ![../images/513218_1_En_6_Chapter/513218_1_En_6_Figc_HTML.gif](img/513218_1_En_6_Figc_HTML.gif)


    请注意，此选项卡包含版本历史、审批详情、测试结果和环境详情。其中需要填写的信息是不言自明的。对于“环境详情”，请包含与该环境中测试相关的任何风险。如果是在生产环境中进行测试，这一点尤其关键。


    **测试场景和结果**


    | **前置条件** | **流程步骤编号** | **测试用例描述** | **预期结果** | **实际结果** | **测试用例实际状态** |

    | --- | --- | --- | --- | --- | --- |

    | 电子邮件帐户已在邮件服务器上设置完成。 | 1 | 机器人登录到电子邮件收件箱。 | 机器人成功登录电子邮件帐户。 | 机器人能够登录 | 通过 |

    | Web CRM 应用已启动并正在运行。 | 2 | 机器人登录到 Web CRM 并更新一个地址和电话号码。 | 机器人成功更新一条记录。 | 机器人能够更新记录
    | 通过 |

    | 大型机 1 已启动并正在运行。 | 3 | 机器人登录到大型机并更新一个地址和电话号码。 | 机器人成功更新一条记录。 | 机器人能够更新记录 | 通过
    |


    这部分内容也是不言自明的。


    **暂停与思考**


    您会发现，通过尽可能简化流程和文档，您的 RPA 计划将取得更大的成功。但切记，在简化的同时不要牺牲质量。


    **测试用例**


    | **ID** | **基于 FRD 的场景** |

    | --- | --- |

    | Auto-001 | 机器人成功登录电子邮件收件箱并读取电子邮件。 |

    | Auto-002 | 机器人成功登录 Web CRM 并更新地址和电话号码。 |

    | Auto-003 | 机器人成功登录到大型机 1 并更新了地址和电话号码。 |


    此部分展示了必须执行的特定测试用例。


    （出于案例研究的目的，我们仅展示用户验收测试）。


    测试之后，需要业务方的签收确认。这可以通过将此测试文档转发给业务负责人，然后接收并保存他们的批准（通常通过电子邮件形式）来完成。


    测试可以分多次迭代完成；也可以进行不止一次，以确保机器人能够按预期交付成果，并能根据要求处理异常情况。


    此时，应通知治理委员会业务批准和解决方案设计情况；无需召开会议。如果委员会成员有任何疑问，他们会通知 RPA 团队。


    完成测试并获得批准后，就可以开始准备打包和部署了；下一章将对此进行详细说明。


    脚注 1 2 3 4 5 6 7


    # 7. 解决方案部署、维护与退役


    一旦自动化/技术团队在 UAT/测试环境中完成机器人的开发和测试，就应将其部署到生产环境中。确保您的技术团队遵循所有已有的机器人测试和开发流程，以便将符合业务期望的优质解决方案投入生产。为了将机器人迁移或部署到生产环境，应遵循详细且准确的操作流程，以避免部署过程中出现任何意外问题。在本章中，我们将详细探讨将机器人部署到生产环境需要了解的所有内容，包括如何管理和支持上线后的机器人，以及如何在需要时使机器人退役。这将防止机器人在整个上线生命周期中出现任何不愉快的意外情况。


    除了这些主题，我们还将讨论机器人的审计和性能优化。

    '
- fmt: '# Solution (Automation/Bot) Deployment


    Now is the time to operationalize the work you have done. You have received approval
    at each gate; updated risks, ROI, size, etc.; and designed and created the solution.
    Now you are ready to put the Bot in production.


    Some larger organizations have a Center of Excellence; many do not. The term `COE`
    means different things in different companies, and the functions may be performed
    by the `COE` or the technical team. So when we refer to the `COE`, please remember
    that it may have a different name in your company or may not exist at all.


    This organization, whether a `COE`, another group in your company, or the technical
    team, will have ultimate responsibility for deploying the new Bot. It will assure
    that the scheduled date can be met and that any associated applications will not
    be compromised by the new Bot and will monitor performance with the `RPA` team.


    For any `RPA` program, there are many functions required; remember, they may be
    performed by a Center of Excellence or similar team, or by the technical team.
    You must consider the architecture of the robotic operating environment (infrastructure
    support, technology choice). Also, `RPA` operations (maintenance, support, monitoring,
    training of new resources, change management) are vital to know. What will your
    governance model look like? This includes integration to overall organizational
    structure, oversight of resources responsible to support all functionalities of
    the `RPA` program, compliance to policies and procedures, security system access,
    process prioritization, and the escalation path.


    You need to know the delivery (process discovery and assessment, solution design,
    testing, deployment, development of standards).


    In addition, the `COE`, if there is one in your organization, among its other
    responsibilities, maintains all the common functions required for `RPA` for the
    various lines of business. This makes management of the Bots simpler and more
    cost-effective. The `COE` also establishes standards and best practices and fosters
    continuous improvement.


    ## Pause and Consider


    We have said a lot about the Center of Excellence and acknowledged that there
    may not be one in your organization. We have also detailed, and will continue
    to discuss, the role of the `COE`. Who in your organization would be responsible
    for these tasks? Remember, it might not be one group, but the work may be distributed
    over several groups or individuals.


    As you can see, early involvement with the `COE` will greatly assist you in deploying
    Bots on time and effectively.


    The `COE` is also vital in managing access management and security. The `COE`
    assures that the Bot only has access to the resources (applications, systems,
    etc.) that are required for that particular automation. User IDs and passwords
    expire periodically, and the `COE` assists in renewing them as required. This
    differs from other application management functions, and it’s important to be
    aware of these differences when rolling out your `RPA` initiative.


    Because the `RPA` program in your organization will evolve quickly, the `COE`
    enables the build of the new infrastructure and the adoption of new automation
    tools.


    Many organizations, however, do not have a formal `COE`. If that is the case for
    you, the same functions must still be accomplished, but they will be performed
    by the technical team.


    ### Pause and Consider


    When we say “technical team,” we refer to the broader team beyond just developers.
    This can include such roles as process analyst, architect, business analyst, infrastructure
    analyst, developers, asset management, security, etc. What roles comprise the
    technical team in your new `RPA` program?


    The technical team will work closely with the business partner who has requested
    the automation. The same tasks – establishing standards and best practices, continuous
    improvement, security, access management, etc. – must still be performed, but
    the technical team will take the lead on each one.


    There are both advantages and disadvantages to having a `COE`, so you shouldn’t
    feel at a disadvantage if you don’t have one.


    When there is no `COE` or equivalent group in the organization, the technical
    team takes over all responsibilities of `COE`. Less communication is required
    as it will only be between technical team members now. Faster action and quicker
    response times can be achieved. The technical team makes most of the decisions,
    and support and maintenance needs less management since there is no additional
    communication and collaboration required with any external team or department.
    The technical team can establish processes according to their own specific needs
    and improve or modify them in a timely manner.


    Where there is a `COE`, it must follow organization guidelines and generalize
    the processes and standards. These may be less suited to individual teams, and
    they may need to be modified or updated to accommodate the requirements of a particular
    Bot/team/department. So while there are certainly advantages to having a `COE`,
    there can be drawbacks.


    > **Tip**

    >

    > If your organization has a `COE`, do not attempt to bypass it, even if you think
    it will expedite deployment. This will cause a wide variety of problems and could
    potentially sink your `RPA` program.


    ## Process setup for deployment and release


    ### Prerequisites for deployment: Sizing of the Bot(s), etc.


    Before deploying any Bot, there is a wide variety of information that must be
    determined and shared with various parties. These include information about


    *   The size of the automation. It could be the number of files, any database
    scripts, or other settings like scheduling, frequency, and number of Bots required.
    Sizing can be done on the basis of many factors. It could be based on the number
    of Bots needed to complete the work in the specified time, for example, if work
    can be completed in two hours, only one may be required, but if the same work
    needs to be completed in thirty minutes, then four or more Bots may be required.
    The size may depend upon the complexity of the automation or the steps that need
    to be automated, if they are complex in logic or must interact with multiple applications
    at the same time; this adds complexity to the automation, so more control over
    the Bot is required.


    Size can be categorized as small, medium, or large. This categorization can be
    determined by many factors. Preliminary understanding will be obtained in the
    earlier phases. As you gain more information about the process, you will define
    the size.


    The factors that determine size include the number of process steps being automated,
    number of systems accessed, volume of work, etc. Note that at this point, you
    know if it is “small,” “medium,” or “large.” As you have progressed through the
    process and gained more information, you now are able to definitely say the automation’s
    size. During “opportunity assessment,” you will determine a high-level understanding
    of sizing, but true size will depend on solution and scope that would be finalized
    at solution architecture.


    Remember, don’t be too concerned about getting the sizing exactly right. These
    are general terms.


    > **Pause and Consider**

    >

    > For each organization, small, medium, and large will depend on the factors included
    herein and your own organization. What would constitute “small,” “medium,” or
    “large” in your organization?


    In addition, the Bot could be attended or unattended. “Attended” means that someone
    is watching the execution of the Bot and observing it while it is running. This
    is done so action can be taken should the Bot error out. An attended Bot is always
    attended.


    An “unattended” Bot will still be observed during deployment, but once the operational
    aspect is shown to be successful, it will no longer be “attended.”'
