  trans: '

    # 部署与发布设置检查清单


    | 项目 | 项目详情 | 备注 | 状态* |

    | --- | --- | --- | --- |

    | **产品（机器人）名称** | | 提供用于指代该解决方案/自动化的名称。该名称将用于库存、报告、变更请求等。 | |

    | **商定的部署日期和时间（如适用）** | | 根据项目计划，提供计划的/首选的部署日期。 | |

    | **自动化规模** | | 可为小型、中型或大型。 | |

    | **机器人计划** | | 指定首选计划（每周的时间和天数）。机器人可接受启动时间的范围。机器人的近似运行时长。流程中是否有任何影响自动化计划的服务级别协议？
    | |

    | **质保期联系人** | | 在质保期内，部署团队可能需要联系交付团队中熟悉代码的软件开发人员。确保该开发人员在部署日期后的五个工作日内随时待命。 |
    |

    | **职责分离声明** | | 交付团队将注明编写代码的软件开发人员姓名。自动化服务团队将注明执行用户验收测试的人员姓名，以及在自动化服务团队中负责部署代码的人员姓名。为保障职责分离，自动化服务团队将确保编写代码的软件开发人员与执行用户验收测试的人员非同一人。将代码部署到生产环境的人员与编写代码的人员非同一人。
    | |

    | **工作量** | | 在指定时间段内（每日、每周等），预计机器人需处理多少项任务？ | |

    | **访问权限验证** | | 说明需要何种类型的访问权限，以及是否已在生产环境中验证。 | |

    | **通讯电子邮件地址** | | 因任何信息、错误或其他原因需要联系的人员（业务和技术联系人）的电子邮件地址。 | |

    | **灾难恢复** | | 回滚步骤、实施后步骤。 | |

    | **主要/次要版本** | | 说明这是对现有机器人的小改动，还是重大更改。 | |

    | **部署时在场人员** | | 列出部署时必须到场的人员姓名及其角色。 | |

    | **COE 联系人** | | 列出此联系人的姓名和职务。 | |

    | **文件夹结构** | | 列出任何需要新建的文件夹。 | |

    | **系统/应用程序可访问性** | | 记录任何已知问题。 | |

    | **基础设施能力** | | 记录任何已知问题。 | |

    | **风险识别及负责角色** | | 根据风险评估总结此项。 | |

    | **部署说明/步骤****任务部署步骤****实施前步骤****实施步骤****测试实施步骤****回滚步骤****实施后步骤** | | 提供详细的部署脚本。通常由自动化服务部署经理指定实施和备份步骤。
    | |

    | **已建立的沟通渠道** | | 具体说明。 | |

    | **生产支持模式** | | 您是否保留此自动化的故障修复责任？如果是，请为业务技术支持团队提供补救支持队列名称和电子邮件联系信息。如果否，自动化服务团队将作为
    D2P 流程的一部分，让开发团队参与进来，以确保顺利过渡到维护知识转移。 | |


    “状态”可以是“已完成”、“未完成”或“不适用”。对于“未完成”或“不适用”，请务必附上简短的解释性备注。


    ## 在 COE/LOB 与开发团队之间保持关于部署的沟通


    我们之前提到过，您的组织可能有也可能没有 COE。如果有，那么在自动化计划的全过程中与 COE 合作至关重要。关于编码标准、代码审查标准、自动化工具升级以及部署计划，必须有高效的沟通。技术团队有责任设定预期。业务部门希望部署在哪个日期（范围）内进行？是否需要进行任何基础设施升级？将使用哪个开发环境？


    如果有 COE，由它来定义谁将维护开发环境，以及谁将维护机器人。一些可能由 COE 维护，一些由开发团队维护。如果有 COE，则由它负责机器人的执行。


    技术团队与业务部门保持联系，因此在维护期间的协作和沟通中，技术团队承担着更重要的角色。如果机器人未能运行，业务部门将联系技术团队，然后技术团队将与业务部门和
    COE（如果有）协作，确定下一步行动。这可能包括：在机器人修复之前，恢复到手动流程；一旦有工作可用，重新运行机器人；或者停止机器人，并在业务部门确定可以重新启动时重新启动它。重新运行机器人取决于
    SLA；重新运行的选项通常在部署计划制定时确定。我们来看一些例子：


    1.  停止机器人：可以停止机器人，流程改为手动执行，直到修复完成。然后机器人利用新的、传入的信息重新开始工作。

    2.  重新运行机器人：也许机器人没有按计划在夜间运行。在这种情况下，可以在第二天简单地在有人监控的情况下运行它，以确保它正常运行。

    3.  停止并重启：如果机器人执行效果不佳，并且原因是机器人正在处理的工作负载（需要一些调整或更新），或者手动流程需要一些更改，那么可以停止机器人并进行必要的更改。例如，机器人正在处理
    Jira 卡片（它们是机器人的输入），并且在机器人启动之前需要执行的手动流程步骤尚未完成（例如，Jira 卡片尚未根据机器人要求进行更新或设置），则可以停止机器人，直到手动流程中所需的工作完成。然后可以重新启动机器人。


    一级支持由 COE 执行：更改计划、更改运行频率、更改同时运行的机器人数量、更新用户 ID 和密码、更改机器人的优先级，以及包含/排除在需要接收机器人信息时需要联系的所有电子邮件
    ID。所有不影响技术侧机器人实际运行的更改和更新。例如：机器人运行正常，但需要更改机器人的某些设置。这些是非功能性需求。


    二级支持由技术团队执行：当机器人未按需求/预期运行时。这涉及功能性需求。


    在没有 COE 的情况下，一级和二级支持均由技术团队与业务负责人协作完成。

    '
- fmt: "## Maintenance of Bots\n\n### 3.1 Setup and manage the support queue.\n\n\
    1. **Agile**: Dev. team rotates the term (weekly?) for on-call support and will\
    \ respond to COE/LOB contact about malfunctions. An inbox may be established to\
    \ report on Bot performance and exceptions. This is monitored by the Dev. team\
    \ member designated for the particular week. This allows all the team members\
    \ to be familiar with all the Bots. In a more traditional methodology, one or\
    \ two members of the technical team are assigned to the support queue, although\
    \ a more rotational support may be implemented to increase team members’ knowledge\
    \ of all the Bots.\n\n   While setting up the support queue, steps between the\
    \ COE and the business should be very clear. This includes when an incident is\
    \ reported to the technical team, it is determined: should the Bot be stopped;\
    \ who is the contact on the business side for that particular Bot; can the Bot\
    \ be rerun (decided in advance that it will be rerun every time, or will that\
    \ be an individual decision); will it be stopped immediately every time; etc.?\
    \ For some Bots, it is known that the business wants it to run again if it fails.\n\
    \nA short description of “next steps” can be done for every Bot to ensure quick\
    \ action for any incident reported. This will greatly assist anyone who is assigned\
    \ to support at the time of the incident. Steps may be: contact the business;\
    \ stop; rerun (with information about how much time to wait before rerunning:\
    \ immediately, after X hours, the next day, etc.); let it run and update the business\
    \ regarding the issue; etc. This “next step” document is shared with the COE,\
    \ business, and technical team. These are the immediate first steps.\n\nIt should\
    \ be very clear to everyone on the team that the person on the call isn’t responsible\
    \ for resolving the issue. That person is the contact person who will coordinate\
    \ the response with the business, COE, and technical team. If the person on call\
    \ is not able to resolve the incident, the person who is expert on that particular\
    \ automation can be engaged.\n\n**Note**\n\nIn RPA, the technical team is comprised\
    \ of several different roles (process analyst, architect, business analyst, infrastructure\
    \ analyst, developers, asset management, security, etc.).\n\nIf your organization\
    \ has a COE, Level 1 support is maintained by COE, and Level 2 support is taken\
    \ care of by the technical team. In the absence of a COE, both Level 1 and Level\
    \ 2 support are the responsibility of the technical team. Once the Bot is deployed,\
    \ Level 1 support starts monitoring the Bot.\n\n### 3.2 Monitoring the Dashboard\n\
    \nAfter Bot deployment, it must be maintained to assure it is doing the work it\
    \ was created for and that its performance is at an optimal level. Continuous\
    \ monitoring is vital. Monitoring can be automated or manual. Automated monitoring\
    \ could include sending alerts, such as emails or text messages, that advise if\
    \ the Bot is underperforming or has stopped working or by updating dashboards.\n\
    \nDashboards are very handy for monitoring Bots. Most of the automation tools\
    \ come with simple dashboards that can easily be configured for deployed Bots.\
    \ Dashboards are easily accessible via user interface by the technical teams or\
    \ business partner to keep an eye on the real-time status of the Bot and how it’s\
    \ performing. As Sharda Cherwoo and Roy Rachamimov have said, “The operational\
    \ dashboard is vital for the day-to-day running of the bots - monitoring their\
    \ activities frequently and in real time. At the early stages in an RPA’s program,\
    \ there are few bots and all the attention is on integrating them into workflow\
    \ and making sure they complete their tasks successfully.”^([^(19)](#fn19)) (Note:\
    \ for more information, please see the article referenced in the footnote.)\n\n\
    ## Prioritization\n\nThis is when many Bots need to be rerun. For example, servers\
    \ on which the Bots are running are down, and as a result, there are many Bots\
    \ to be rerun. Prioritization will come from the business owners, determining\
    \ which will come first. Some Bots are processing business-critical work (e.g.,\
    \ satisfying regulatory requirements).\n\nIn the case where there is no business-critical\
    \ Bot to be rerun and all the Bots have the same priority, it is the decision\
    \ of the COE or tech team. They can decide to run first those that are very short\
    \ or have a small amount of work to get those completed. More complex Bots that\
    \ will take more time to run will then be run. The guidelines for prioritization\
    \ should be established up front, but should be sufficiently flexible to adapt\
    \ to differing or varying situations.\n\n## Warranty\n\nWhenever a new automation\
    \ is deployed to production or a new release is moved to the production environment,\
    \ there is a warranty period assigned to the Bot.\n\nThe warranty period could\
    \ be of one week or two weeks as per agreement between the business and technical\
    \ teams. Bots take time to stabilize and there might be some issues initially\
    \ with new Bots. So the warranty period allows for the solving of defects quickly\
    \ fixed with minimum dependency on multiple people. During the warranty period,\
    \ all the documentation required to move the Bot to production, such as business\
    \ sign-off, testing sign-off, etc., is not required. The fixes are done quickly\
    \ to keep the Bot running. As mentioned earlier, the warranty period can be extended\
    \ if either the business or technical team feels that the Bot needs to be closely\
    \ watched for a longer period of time.\n\n## Bot Categorization\n\nBots can be\
    \ “critical” or “noncritical.” Critical Bots are those which are time critical;\
    \ their output may be required for government regulations. These Bots have a significant\
    \ impact on the business. If a critical Bot fails, the technical team must be\
    \ able to take action immediately, without waiting for a decision from someone\
    \ else to do so. For critical Bots, all the actions to be taken in case of failure\
    \ must be defined prior to deployment.\n\nNoncritical Bots do not have the same\
    \ impact on the business. In case of failure of a noncritical Bot, advice from\
    \ the business is required before any action is taken. The business will decide\
    \ whether to rerun the Bot or take some other action. The technical team will\
    \ respond accordingly.\n\n## Communication\n\nIn Chapter [5](#513218_1_En_5_Chapter.xhtml),\
    \ we introduced the need to be in communication with your company’s COE (Center\
    \ of Excellence), if there is one, or, if not, with the department that will be\
    \ responsible for deployment. Now that you are about to deploy, the relationships\
    \ you established earlier by involving this group and letting the people there\
    \ know what was being deployed, when deployment was desired, and other pertinent\
    \ details, will greatly assist you in getting the Bot up and running when required.\n\
    \nIn earlier phases, you advised this group (or individual) of the process being\
    \ automated, what systems it would interact with, how often it would run, what\
    \ platform it would run, and other pertinent details. They knew what date you\
    \ wanted deployment and have, hopefully, worked to assure that everything was\
    \ in place on their side. You need now to update them on a variety of issues,\
    \ since things can change from day to day. Here are some of key topics to confirm:\n\
    \n- Business unit requesting the automation\n- Requested date\n- Impacted systems\n\
    - Date of Governance Committee meetings\n- Any changes that the business might\
    \ ask for after the additional request\n- Anticipated size of the Bot (number\
    \ of steps being automated, volume)\n- Frequency of run\n- Others as may be required\
    \ by your team and the particular Bot being created"
