    # 机会评估结束后的治理委员会会议


    在通过填写前文所述文件更仔细地审视该项请求后，治理委员会需要判断是否仍有可能推进至下一步骤。RPA 团队的建议将在治理委员会的决策中发挥重要作用。无论是决定推进至项目的下一阶段（解决方案设计；请参见第
    6 章）、暂缓项目，还是彻底取消项目，都不能轻率做出。这些选择中的任何一个都会带来广泛的影响。


    如前所述，在项目生命周期中，治理委员会将多次评估某个阶段（例如机会评估、解决方案设计）所获得的发现，并判断其可行性。RPA 团队会将之前引用的文件整合为一个文档，安排会议时间，并在会议邀请中附上该文档的链接（如果治理委员会并非所有成员都能访问文档的存储位置，则直接将其作为电子邮件附件发送）。


    在治理委员会会议召开前，委员会成员应已阅读该文档，并应做好准备提出疑问。实际上，情况往往并非如此；委员会成员可能未在会议前审阅文档。流程分析师/设计师或另一位
    RPA 团队成员必须准备好对该请求进行非常简短、高层次的概述。该概述将包括对当前流程的高层次描述。演示者还将讨论自动化旨在解决的问题以及自动化流程带来的好处；也就是说，它是否能实现所要求的效益？此外，他们还将讨论实施的可行性：从成本、复杂性等方面来看，人工流程是否看起来是自动化的良好候选对象？最后，他们将呈现自动化流程的风险以及不自动化流程可能带来的任何风险。这可能包括失去竞争优势的可能性。


    这份简短摘要的所有信息都可以从已准备的文件中获取，其中大部分信息来自机会概述。


    基于治理委员会成员的审阅或所提供的简短摘要，存在三种可能的结果：


    1. 项目获批进入下一阶段（解决方案设计）。

    2. 项目暂缓，等待获取一些额外信息。根据所需额外信息的不同，可能需要也可能不需要召开第二次治理委员会会议。如果信息是次要的，并且通过电子邮件告知治理委员会成员就足够了，则无需召开第二次会议。如果只需要电子邮件沟通，治理委员会的每位成员都必须通过回复邮件表明他们的决定（批准、获取更多信息，或“暂缓”）。


    您会发现，随着文化的成熟，需要额外信息的情况会越来越少。随着 RPA 团队了解治理委员会需要哪些信息，这些信息将在向委员会提交机会之前就准备好。


    在某些情况下，有些请求目前不可行，但可以使其变得可行。例如，可能所有输入都是手动的，而这正是阻止该流程成为 RPA 良好候选对象的唯一因素。但如果流程负责人能够将这些输入电子化，那么该流程就可以实现自动化。治理委员会会议结束后，流程相关方将被告知任何此类情况，以便他们决定是否要进行必要的更改以符合自动化条件。


    2. 项目被“暂停”。这可能是因为虽然自动化会使部门受益，但自动化的成本远远超过继续手动执行的成本。也可能是因为极端复杂性或各种其他原因。


    未来某个时候，由于工作量减轻、优先级变化或其他情况，该项目可能会继续推进。每个 RPA 团队必须自行决定所有“暂停”项目是每年、每半年还是每季度进行一次审查。


    3. 项目被取消。有时，一个项目根本不适合使用 RPA。业务相关方可能确实对某个手动流程有意见，但 RPA 并非解决方案。在这种情况下，应尽可能将业务相关方引导至其他可能的解决方案。大多数组织都有各种应用程序，这些应用程序通常能够对已识别的问题提供一些改进。


    ## 暂停与思考


    当请求将在未来再次审查时，它们会被“暂停”。取消一个请求者及其部门一直热切期待的项目并非好事。如何最好地告知请求者其请求已被“暂停”或取消？请记住，您不希望打击请求者提交另一个流程进行自动化的积极性。


    现在，让我们看看本章中的概念如何应用于我们在第 4 章中介绍的虚构案例研究。


    ## 案例研究示例


    我们将从一份机会简报开始。该文档不应超过两页（模板请参见附录 6）。在我们的示例中，机会简报可能如下所示。

    '
- fmt: '# Address and Phone Number Change Process


    Prepared by: David Johnson, Business Process Analyst, Operations Support, Business
    Process Automation


    | **Current Situation:** Clients notify us by emailing their new address and/or
    phone number. These emails are reviewed by a client service specialist (CSS).
    The team consists of five FTE working on those requests. It takes about 10–15
    minutes to complete each request, if address contains no errors, and about 20
    minutes when investigation or further follow-ups with the client are required.
    Management sees the opportunity to automate that process at least partially and
    redirect some CSS to other areas where we are experiencing longer service times
    and higher overtime numbers. In addition, auditing has shown that there is a high
    number of human errors either in phone numbers, or wrong client''s address was
    changed, or there are errors in the address. | **Objective:** Automate the end-to-end
    address and/or phone number change process. Automation should validate the clients’
    credentials and change the required information in the mainframe systems and relevant
    applications. |

    | --- | --- |

    | **Assumptions:** Automation can: – Extract information from the request form.
    – Confirm client’s ID. – Check/validate new address. – Access mainframe systems
    and relevant applications. – Store execution data for monitoring, analysis and
    reporting. | **Constraints:** – Automation recovery and accumulated backlog process
    is less than 48 hours. – CSS availability in the event that manual process is
    required. – Address verification could be challenging. |

    | ![../images/513218_1_En_5_Chapter/513218_1_En_5_Figa_HTML.gif](images/513218_1_En_5_Chapter/513218_1_En_5_Figa_HTML.gif)
    |

    | **Benefits Estimation:** Processing requests: FTE hours = 9,375/year (5 FTE),
    which can be deployed elsewhere. Eliminate rework. Eliminate the cost of returned
    mail. | **Proposed Solution:** The Bot will access the teams’ email, open the
    form, confirm the client’s ID, and validate the information it contains. It will
    then access the mainframe systems and relevant applications, make the required
    updates, and send a confirmation email to the client. In case of information that
    cannot be verified, the Bot will redirect the request for manual processing. |

    | (See Appendix 6 for a template.) |


    Next, we look at feasibility assessment. Are the basic conditions listed on the
    document (and discussed earlier) satisfied? Remember, it isn’t necessary that
    all of them be satisfied immediately, but by the end of this phase (opportunity
    assessment), the team must be comfortable in knowing that they can be satisfied.
    For example, if the inputs to the process are not digitized, it must be confirmed
    by the process owner and SMEs that they can be.


    ## Feasibility Assessment


    Address and Name Change Process


    | | **Questions** | **Answers** |

    | --- | --- | --- |

    | 1 | Is the process well defined? | Yes |

    | 2 | Is the process stable (very few “exceptions”)? | Yes |

    | 3 | Can exceptions be handled manually? | Yes |

    | 4 | Are inputs in digital format? | Yes |

    | 5 | Can required data be input without human intervention? | Yes |

    | 6 | Are potential changes to roles and processes acceptable to management? |
    Yes |


    **Prepared by:**


    `<Name> <Role>` _John Williams, Tech Lead._ Date: August 4, 202x


    `<Name> <Role>` Mary Davis, Business Manager Date: August 4, 202x


    **Approvals:**


    `<Name> <Role>` _______________________________ Date: ____________


    `<Name> <Role>` _______________________________ Date: ____________


    `<Name> <Role>` _______________________________ Date: ____________


    `<Name> <Role>` _______________________________ Date: ____________


    Next, we look at risks that the solution could potentially expose the operations
    to. We have discussed this topic previously, but the risks identified will be
    unique to each request. Remember to rely on SMEs and to include your “risk and
    compliance” department during this phase.


    ## Risk Assessment Checklist


    Address and Phone Number Change


    | **Risks** | **Type** | **Is There a Mitigation Plan** | **Mitigation Plan and
    Responsible Party** |

    | --- | --- | --- | --- |

    | Automation fails to execute. | Operational | Yes | Revert to manual processing
    until repaired; James Morris, CSS Assistant Manager and RPA team. |

    | Wrong customer information updated. | Reputational | Yes | Establish client
    ID validation controls; Maria Mulchuk, Compliance Manager. |

    | Client information cannot be confirmed. | Technology | Yes | Handle manually;
    James Morris, CSS Assistant Manager |

    | Client information exposed. | Compliance | No | |


    **Prepared by:**


    `<Name> <Role>` _John Williams, Tech Lead._ Date: August 4, 202x


    `<Name> <Role>` Mary Davis, Business Manager Date: August 4, 202x


    **Approvals:**


    `<Name> <Role>` ________________________________ Date: ____________


    `<Name> <Role>` ________________________________ Date: ____________


    `<Name> <Role>` ________________________________ Date: ____________


    `<Name> <Role>` ________________________________ Date: ____________


    (See Appendix 5 for a template.)


    Note that this document is still incomplete. There is still a risk for which mitigation
    plans have not been established. At this phase, that is acceptable, but those
    mitigation plans must be established if the request is approved to move forward.


    After these documents are created, a Governance Committee meeting is scheduled
    for review and to make a decision either to proceed with development or not. Again,
    the recommendation of the RPA team will be a key input into this decision.


    Let’s now review the Governance Committee decision form.


    ## Governance Committee Decision Form


    Address and Phone Number Change


    | **Decision** | **Reason for the Decision** | **Next Steps** |

    | --- | --- | --- |

    | Go | Automation solution is technically feasible. Process is repeatable and
    straightforward. Benefits meet ROI criteria. No concerns from system architecture.
    | Proceed with solution design. |


    **Approvals:**


    `<Name> <Role>` Siva Khrishnak, RPA Dev. Lead ____ Date: August 4, 202x


    `<Name> <Role>` Daniel Cook, System Architect ____ Date: August 4, 202x


    `<Name> <Role>` Ryan Walthy, Ops Risk and Control ____ Date: August 4, 202x


    `<Name> <Role>` Andy Hamilton, Business Owner ____ Date: August 4, 202x


    (See Appendix 7 for a template.)


    This form is, of course, blank entering the meeting. At the meeting, any questions
    the Governance Committee team members have are answered. In this hypothetical
    request, the decision was made to move forward (see “Go” in the “Decision” column),
    the rationale for the decision is listed in the “Reason” column, and the next
    phase – solution design – is listed in the next step column.


    Conversely, the “Decision” could have been “Pause,” with the reasons listed in
    the “Reason” column, and “Next Steps” would have provided additional explanation.
    It might have said “Once process owner confirms digitization of 90% of input,
    this will be re-reviewed,” or some other description of what the “Next Step” would
    be.


    Finally, the “Decision” could have been “No Go.” The rationale would have been
    described in the “Reason” column, and the “Next Steps” might have been “Advise
    the customer that the ROI is insufficient to justify the cost of development at
    this time. Recommend that the customer speak with (name, role) about using (application
    name) to provide some improvement.” That is, of course, if some alternative that
    would be helpful is known.


    Once the project has been approved to move forward by the Governance Committee,
    you are ready to move to the “solution design” phase.


