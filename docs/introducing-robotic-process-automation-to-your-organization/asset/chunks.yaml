  trans: '好的，作为一名高级文档工程师和翻译员，我将严格按照您提供的注意事项和示例，将给定的英文文本翻译成中文。



    # 地址和电话号码变更流程


    编制人：David Johnson，业务流程分析师，运营支持，业务流程自动化


    | **当前状况：** 客户通过邮件通知其新地址和/或电话号码。客户服务专员 (CSS) 会审阅这些邮件。该团队由 5 名全职员工处理这些请求。如果地址没有错误，完成每个请求大约需要
    10-15 分钟；如果需要调查或与客户进行后续跟进，则需要大约 20 分钟。管理层看到了将该流程至少部分自动化，并将部分 CSS 重新部署到我们服务时间更长、加班时间更多的其他领域的机会。此外，审计表明，在电话号码、更改错误的客户地址或地址本身存在大量的人为错误。
    | **目标：** 实现端到端的地址和/或电话号码变更流程自动化。自动化流程应验证客户凭证，并在主机系统和相关应用程序中更改所需信息。 |

    | --- | --- |

    | **假设：** 自动化可以：– 从请求表单中提取信息。– 确认客户 ID。– 检查/验证新地址。– 访问主机系统和相关应用程序。– 存储执行数据，用于监控、分析和报告。
    | **约束：** – 自动化恢复和积压流程的处理时间少于 48 小时。– 在需要手动处理流程时，CSS 的可用性。– 地址验证可能具有挑战性。 |

    | ![../images/513218_1_En_5_Chapter/513218_1_En_5_Figa_HTML.gif](img/513218_1_En_5_Figa_HTML.gif)
    |

    | **收益估算：** 处理请求：全职员工工时 = 9,375 小时/年（5 名全职员工），可重新部署到其他地方。消除返工。消除退件成本。 | **拟议解决方案：**
    机器人将访问团队的邮箱，打开表单，确认客户 ID 并验证其包含的信息。然后，它将访问主机系统和相关应用程序，进行所需的更新，并向客户发送确认邮件。如果信息无法验证，机器人将把请求转交人工处理。
    |

    | （模板见附录 6） |


    接下来，我们来看可行性评估。文档中列出的基本条件（以及之前讨论过的）是否都满足了？请记住，并非所有条件都必须立即满足，但在此阶段（机会评估）结束时，团队必须确信这些条件是可以满足的。例如，如果流程的输入尚未数字化，则必须得到流程负责人和主题专家的确认，证明它们可以实现数字化。


    ## 可行性评估


    地址和名称变更流程


    | | **问题** | **回答** |

    | --- | --- | --- |

    | 1 | 流程是否明确定义？ | 是 |

    | 2 | 流程是否稳定（“异常”情况非常少）？ | 是 |

    | 3 | 异常情况是否可以手动处理？ | 是 |

    | 4 | 输入是否为数字格式？ | 是 |

    | 5 | 所需数据是否可以无需人工干预输入？ | 是 |

    | 6 | 管理层是否接受对角色和流程的潜在更改？ | 是 |


