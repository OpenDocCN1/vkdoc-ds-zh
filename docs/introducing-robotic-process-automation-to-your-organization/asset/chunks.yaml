- fmt: "## Need for RPA\n\nThe introduction of an RPA initiative in any organization\
    \ usually stems from one of three sources:\n\n1.  Senior management has learned\
    \ of RPA and believes it will be beneficial to the organization. This may result\
    \ from a review of a business journal that discussed RPA, a casual conversation\
    \ with a peer from another organization, or any of a variety of sources.\n2. \
    \ A mid-level manager is aware of RPA and has recognized that there are many repetitive,\
    \ manual processes within their area that could be automated for better efficiency,\
    \ fewer errors, and decreased expense.\n3.  A technology leader recognizes the\
    \ importance of RPA. Since RPA is greatly increasing in popularity, technology\
    \ leaders are discussing it more frequently, and it is appearing regularly in\
    \ a variety of journals.\n\nThe initial steps will be different depending on the\
    \ reason that RPA is being introduced to your organization.\n\n**Pause and Consider**\n\
    \nWhy is RPA being introduced in your area? Is it reason 1, 2, or 3 mentioned\
    \ earlier or a combination? Maybe a senior manager has heard of RPA and has asked\
    \ for your opinion: Do you see it benefiting your department? If so, in what ways?\
    \ Do you think it could be used throughout the company? Perhaps you have been\
    \ asked to pilot it in your department.\n\n### Senior management decision\n\n\
    Key to the success of an RPA implementation, regardless of why it is being introduced,\
    \ is stakeholder buy-in. Has one senior manager decreed that RPA is to be introduced?\
    \ If that’s the case, other key members of the senior management team must buy\
    \ into the concept before any investment in RPA (time, resources, infrastructure,\
    \ etc.) begins. Additionally, and even more importantly, middle managers must\
    \ see the value of it.\n\n**Tip**\n\nDo not neglect the importance of middle-management\
    \ and staff buy-in. Resistance at this level can quickly and effectively sabotage\
    \ an RPA initiative.\n\nIf additional members of the senior management team must\
    \ be brought in, do your homework. There are several things you should present,\
    \ at a fairly high level, that will assist you in convincing them of the benefits\
    \ of RPA to your organization:\n\n1.  **Industry standards**: Many organizations\
    \ are moving toward automating manual, routine tasks that require no thought.\
    \ For example, in financial services, if every time a client makes a transaction,\
    \ their financial adviser must be notified; this is a process that can be automated.\
    \ The client name can be read from a database, matched to the financial adviser,\
    \ their email address located, and then a template can be automatically completed\
    \ and emailed to the adviser.\n\nDo the necessary research to see how RPA is being\
    \ implemented within your industry.\n\n**Pause and Consider**\n\nIn many organizations,\
    \ the employees are working hard, focusing on the tasks at hand. They often don’t\
    \ see how their work could be automated; they may have been doing the same job\
    \ the same way for years. They don’t see how steps could be eliminated or the\
    \ process improved. How will you help people look for automation possibilities?\n\
    \n2.  **Specific examples in your organization**: What are some specific processes\
    \ within your organization that could benefit from automation? You may need to\
    \ do some research to discover these. This will involve working with other middle\
    \ managers and their teams, which will also assist in getting buy-in from this\
    \ level.\n\n**Pause and Consider**\n\nFor many people, automating tasks means\
    \ layoffs. How will you alleviate this fear? Or, if it is a definite possibility,\
    \ how will you handle it? Managers at all levels are loath to see their staff\
    \ reduced in size. And their team members will resist any measures that may cost\
    \ them their jobs. However, headcount reductions could be the goal or even the\
    \ unintended outcome, and this must be addressed.\n\n3.  **The opportunity to\
    \ retrain and redeploy employees** whose work is to be automated can also be a\
    \ benefit.\n\n**Pause and Consider**\n\nIn many organizations, redeploying personnel\
    \ to other responsibilities that require more thought than routine, manual tasks\
    \ is one goal of automation.\n\nOne way of addressing this is an HR talent development\
    \ strategy. Automation can free resources to retrain and move to other areas where\
    \ the employee can use their skills beyond performing rote, manual tasks. Who\
    \ will you need to speak to in your organization to accomplish this?\n\n4.  **Benefits**:\
    \ As you discuss automation within your industry, and some examples within your\
    \ own organization, quantify and/or qualify the potential benefits. This could\
    \ include, but not be limited to, any or all of the following:\n    *   Customer\
    \ satisfaction: Clients (internal or external) will receive more timely information.\n\
    \    *   Improved accuracy: No more “human error” in an automated process.\n \
    \   *   Reduced rework\n    *   Financial savings: Reduced headcount, more efficient\
    \ use of personnel.\n    *   Competitive advantage: Being able to provide information\
    \ either faster to clients than your competitors do, or at least keeping up with\
    \ them.\n    *   Time savings: Required information gets to decision-makers more\
    \ quickly.\n    *   Government regulations adhered to more promptly: Time-consuming\
    \ reports can be automated and sent to the appropriate government bodies in a\
    \ timely manner, reducing or eliminating the risk of fines.\n    *   Increased\
    \ employee morale, resulting in better job performance and reduced turnover.\n\
    \nRemember that the initially estimated benefits are just that: initial estimates.\
    \ Do not overpromise. Point out the general trends and benefits in your industry,\
    \ highlight some likely candidates for automation in your organization, and give\
    \ a general estimate of potential benefits. *Be careful not to guarantee that\
    \ certain benefits will accrue*. Doing so is a surefire way to have the entire\
    \ program cancelled when those benefits do not materialize. At this point, you\
    \ are giving estimates based on industry results and your own expertise. But RPA\
    \ is new to your organization, and it will take time and practice to improve your\
    \ estimating accuracy.\n\n**Tip**\n\nYou don’t need to guarantee certain results\
    \ to obtain buy-in; you can’t at this point anyway. Explain the potential benefits,\
    \ and recommend trying the new program with a few processes.\n\nIf senior management\
    \ has mandated an RPA program, before you begin implementation, you must get middle-management\
    \ buy-in. Use the information in the next section to do so.\n\n### Mid-level management\
    \ idea\n\nSome of the steps will be the same, regardless of the source of the\
    \ idea. The main difference in this scenario is that you do not have a senior\
    \ leader sponsoring the idea. That is a challenge, but not an insurmountable one.\n\
    \nAgain, it will be necessary to do the required research on RPA overall and in\
    \ your industry specifically. Look at both the gains and the drawbacks. Get the\
    \ answers to these questions:\n\n*   What kinds of processes within your industry\
    \ are being automated?\n    *   Why are they being automated?\n*   What are the\
    \ results?\n*   What are the challenges to successful RPA implementation within\
    \ your industry?\n    *   How have they been overcome (if they have been)?\n*\
    \   How could they be overcome in your organization? Who are the key people to\
    \ speak to about them?\n\n**Tip**\n\nSome of the challenges have been mentioned\
    \ earlier, including employee fear of layoffs.\n\nOnce you have thoroughly investigated\
    \ RPA benefits and implementation within your industry, you need to identify allies.\
    \ Who will be the “early adopters”? These are the people you will need to bring\
    \ on board to support the initiative. (Note: if senior management has mandated\
    \ RPA implementation, use these steps to get middle-management buy-in).\n\n**Pause\
    \ and Consider**"
