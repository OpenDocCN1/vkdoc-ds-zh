  trans: "\n# 技术可行性\n\n需要验证多个组成部分，具体包括：\n\n-   定义的逻辑\n-   基于规则的步骤\n-   输入和输出数据\n-\
    \   复杂度分析\n-   事务量\n-   开发工作量\n\n执行技术可行性分析需要以下步骤：\n\n1.  自动化流程能否提供所需的安全性（再次参考\
    \ `PDD`）？\n2.  该流程在自动化后，能否按照业务要求的速度和时间运行？\n3.  是否存在任何监管要求？\n4.  列出自动化将要交互或使用的所有应用程序；此信息可从流程设计文档（参见前述讨论）中获取。\n\
    \    1.  确定自动化工具是否提供与这些应用程序进行抓取或交互的功能。\n    2.  确定是否存在自动化流程无法与之交互的应用程序（例如，任何具有复杂\
    \ JavaScript 且类更新过于频繁的网站）。\n\n**提示**\n\n你可以看到 `PDD` 在设计阶段将被广泛使用。确保其包含的信息是完整无缺的至关重要。\n\
    \n# 概念验证/原型设计\n\n在某些情况下，`RPA` 团队可能不熟悉解决方案将要交互的系统或应用程序。或者可能存在非常严重的风险，例如隐私泄露或稳定性风险。在这些情况下，进行概念验证或开发原型会非常有益。甚至可能不必为整个自动化流程创建原型或概念验证，而只需针对那些风险特别高的部分。请与你的\
    \ `SMEs` 以及“风险与合规”部门合作，确定何时需要这样做。\n\n# 自动化解决方案设计 (机器人会是什么样子？)\n\n我们建议采用分层设计方法。以下步骤将为你提供指导：\n\
    \n1.  **控制器（流程）**：这是控制机器人执行的主控制器。它可以被视为其中其他任务的“监管员”。\n2.  **任务容器（业务对象）**：这是机器人的“具体组件”。这里包含机器人将反复用于执行所需步骤的各种小任务。这些步骤由控制器执行。\n\
    3.  **通信器**：每个自动化流程都必须发出某种类型的报告以显示其结果。此外，如果进入机器人的事务是它不知道如何处理的事务，则必须将这些事务发送给某人进行手动处理。顾名思义，控制器用于执行这些以及可能需要的其他通信目的。\n\
    \n**暂停思考**\n\n你正在自动化的流程有哪些通信需求？如果需要，高级管理层需要多少信息？机器人无法处理的事务将被发送到哪里？将保留它们的哪些记录，以及这些记录将发送、存储到何处？流程执行报告的生成频率是多少，报告将发送、存储到何处？\n\
    \n让我们准备解决方案设计文档 (`SDD`)。\n\neGleis Technologies 的 CEI 兼董事总经理 Hemant Joshi 详细说明了什么是\
    \ `SDD`。^(¹⁴)\n\n总而言之，解决方案设计文档是一份从高层角度描述项目技术解决方案的设计以及最优实施方式的文档。每个使用 `RPA` 技术自动化的业务流程都需要创建此文档。该文档由负责自动化该业务流程的\
    \ `RPA` 开发人员创建，并需征询 `RPA` 解决方案架构师的意见，后者将在文档移交给 `RPA` 运维部门之前对其进行审核。它属于 `RPA` 开发生命周期的设计阶段。\n\
    \n一份典型且有效的解决方案设计文档 (`SDD`) 包含以下组成部分（模板见附录 8）：\n\n-   **高层设计**：这应包括自动化流程图和基础设施架构图。\n\
    -   **信息安全**：合规要求有哪些？这可以从流程设计文档 (`PDD`) 中获取。\n-   **自动化执行前提条件**：考虑硬件、软件、许可证等。\n\
    -   **异常处理**：如何处理进入流程但无法处理的事务？每个流程都有一些“规则之外的异常”，你必须明确确定如何处理这些异常。\n-   **调试技巧**：你可以包含哪些建议来帮助未来的开发人员解决问题？请记住，如果将来出现问题，最初开发自动化的开发人员可能不在。\n\
    -   **成功标准**：最后，记录自动化成功所需满足的条件。\n\n**提示**\n\n虽然每个自动化流程都会有所不同，但请记住可能存在可复用的组件。这将提高整个\
    \ `RPA` 计划的效率。\n\n为任何 `RPA` 解决方案编写最合适的解决方案设计文档（有时也称为解决方案架构文档）是 `RPA` 开发过程中最关键的部分。\n\
    \n**提示**\n\n确保 `PDD`（流程设计文档）完整且详尽，将极大地有助于创建一份优秀的 `SDD`（解决方案设计文档）。\n\n以下是编写一份优秀的\
    \ `RPA` 解决方案设计文档过程中需要记住的要点。\n"
- fmt: "# Development/Implementation\n\nOnce the SDD has been completed, reviewed,\
    \ approved, and signed off, development of the Bot can begin.\n\nIn developing\
    \ an RPA solution, development or implementation activities are different from\
    \ those in more traditional settings. For a newly established RPA development\
    \ team, the work can be divided into three phases. The first is solutioning the\
    \ process steps. What will the automated solution exactly look like? What will\
    \ the Bot do? This establishes the vision or view of what the technical solution\
    \ will be.\n\nSecondly, the Bot is designed in full detail. Using the solution\
    \ that has been envisioned, the design is now created in detail.\n\nFinally, the\
    \ actual coding and implementation of the Bot in the automation tool used by the\
    \ organization is done. This, of course, follows creating the vision of the technical\
    \ solution, and then the actual work of coding is performed according to the design\
    \ that has been created.\n\nAs with any development effort, coding standards must\
    \ be followed. If your organization does not have coding standards, these can\
    \ be developed by the team.\n\n**Pause and Consider**\n\nIf your organization\
    \ doesn’t have coding standards, the introduction of an RPA initiative is a fine\
    \ place to develop them. How these will be defined in your organization is up\
    \ to you. But you need to assure that they are sufficiently rigorous and can be\
    \ used across platforms and business units.\n\nIf your team is unsure of the importance\
    \ of coding standards in software development, you might want to remind them of\
    \ some compelling reasons. Coding standards help improve the quality of the overall\
    \ software system. They reflect a harmonized style, as if a single developer wrote\
    \ the code in one session. Coding standards also reflect more than just the software;\
    \ they are a reflection on the organization itself. Additionally, they greatly\
    \ help to improve the maintainability of code; any qualified developer following\
    \ the established standards will be able to maintain the code. Having coding standards\
    \ also helps to limit risks; there is less unknown because by adhering to the\
    \ standards, anyone can read the code. Coding standards also improve code quality;\
    \ all developers must adhere to a professional, pre-approved standard. And lastly,\
    \ having these standards helps all developers be familiar with the code structure.\n\
    \nNishant Goel and Satyendra Shinde of *BOTmantra* identify five (5) key coding\
    \ standards and several subcategories. The following list shows them all:\n\n\
    **Top 5:**\n\n1.  **Readability**\n    1.  Name convention standards and compliance\n\
    2.  **Zero usage of junk code**\n3.  **Componentization**\n4.  **Simplified logic**\n\
    5.  **Configurability**\n    1.  Performance parameters\n    2.  URLs, files,\
    \ and folder paths\n    3.  Email IDs\n    4.  Credentials\n    5.  Business rule\
    \ threshold parameters\n    6.  Log messages\n    7.  Email formats\n    8.  Generic\
    \ design\n6.  **Reliability**\n    1.  Exception handling\n    2.  Best interaction\
    \ technique\n    3.  Memory leakage avoidance\n    4.  Auto-recovery and auto-healing\
    \ mechanisms\n7.  **Security**\n    1.  Authorization\n    2.  Authentication\n\
    \    3.  Credential management\n    4.  Business data storage\n    5.  Data sharing\n\
    8.  **Performance**\n    1.  Delay management\n    2.  Parallel execution\n  \
    \  3.  Interaction technique usage\n    4.  Memory management^([^(15)](#fn15))\n\
    \nWe will now look at each component in detail:\n\n**1. Readability:** How easy\
    \ is it to read the code? Do naming conventions exist? Have naming conventions\
    \ been followed? Is the code as simple as it can be? Are there comments that explain\
    \ modules or even separate lines of code, if necessary?\n\n> **Tip**\n> \n> The\
    \ developer who creates the code may not always be available if problems arise.\
    \ Any qualified programmer should be able to read and understand the code.\n\n\
    **2. Configurability:** Bots must be created with the possibility of further changes.\
    \ Perhaps new parameters will be added, or different systems will need to “communicate”\
    \ with the Bot. Are you including performance parameters, files paths, folder\
    \ paths, various credentials and business rules, etc.?\n\n> **Tip**\n> \n> Always\
    \ design with the future in mind.\n\n**3. Reliability:** What degree of accuracy\
    \ is required? Remember, we said that automating a manual process with RPA is\
    \ best done when there are few events that must be removed from the process for\
    \ manual handling. What exception rate is acceptable for the particular process\
    \ being addressed? How will those exceptions be handled? Are there auto-recovery\
    \ mechanisms in place to avoid downtime?\n\n> **Tip**\n> \n> It is sometimes believed\
    \ that customer-facing processes require a higher degree of accuracy than internal\
    \ processes. Don’t cut corners on any process. Doing so will damage your credibility.\n\
    \n**4. Security:** A rigorous risk assessment will greatly increase security.\
    \ As mentioned previously, the risk assessment will be ongoing: in the early stages,\
    \ only limited information is available, so a complete view of all risks will\
    \ be impossible to attain. That is fine! But as you progress with the project,\
    \ additional risks will be identified. Each must be either mitigated or accepted,\
    \ unless they are considered to be so great that the Governance Committee decides\
    \ to cancel the project. Is it important to know: What authorizations are required\
    \ to use, change, or stop the automation? How will the Bot “know” if it should\
    \ run or stop? How will authentication be accomplished? Where will data going\
    \ in and coming out of the process be stored?\n\n> **Tip**\n> \n> As mentioned\
    \ previously, early involvement of your risk and compliance team will be highly\
    \ beneficial. Keep in mind that that team might have a different name in your\
    \ organization.\n\n**5. Performance:** How will you optimize performance? What\
    \ interaction technique best suits this particular process? Can the Bot run on\
    \ two or more processes simultaneously? What is the most efficient business logic\
    \ configuration for this process?\n\n**Pause and Consider**\n\nThe four previous\
    \ components all impact performance. What are your performance standards? What\
    \ is required by your organization? Defining these requirements clearly will greatly\
    \ assist you in defining what is required for readability, configurability, reliability,\
    \ and security.\n\nAt this point, you may be thinking that there is an awful lot\
    \ to accomplish to introduce and implement a successful RPA program in your organization.\
    \ Yes, there is a lot to do. But what you are doing is nothing short of revolutionizing\
    \ the way your organization operates. Such an undertaking will take time and effort\
    \ but, if done properly, will bring significant benefits. So don’t be intimidated\
    \ by the work required; follow the steps we have included. A task is never quite\
    \ so daunting when taken in small steps.\n\n**Pause and Consider**\n\nAs with\
    \ each of these standards, you need to determine which ones are required for your\
    \ organization and how rigorous each should be. What configurability components\
    \ are vitally necessary within your organization? Which are “nice to haves”? How\
    \ detailed should each be? The answers to these questions will vary from company\
    \ to company and even within companies, from one business unit to another. Also,\
    \ what is required for one automation may be more or less than will be required\
    \ for another.\n\n> **Tip**\n> \n> As the team gains more experience, technical\
    \ feasibility will be folded into design activities, but for the present time,\
    \ it should be separate."
