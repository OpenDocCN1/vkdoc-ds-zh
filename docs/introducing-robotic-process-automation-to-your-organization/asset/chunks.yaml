    which Agile processes could operate effectively.


    Instead, Lean is applied from an upper management perspective, with the objective
    of optimizing all aspects of their activities across the entire organization.


    From this viewpoint, Lean could be seen as a top-down approach while Agile is
    bottom up.


    Without the strategic piece, Agile adoption is depressed by the organizational
    forces that are resistant to change. By having Lean introduced from the top down,
    the tension between developers working in an Agile environment and their stakeholders
    due to conflict of practices and principles would ease.


    We believe that the Agile framework does not generally concern itself with the
    surrounding business environment in which the software development is taking place.
    It primarily provides a set of practices designed for use by developers and can
    be viewed as supportive to Lean methodology. Lean principles, on the other hand,
    can be applied to any scope, from the specific practice of developing software
    to the entire organization in which software development is just one small part.^([^(30)](#fn30))


    Poppendieck and Poppendieck (2003, 2006) viewed Lean principles as core truth
    that do not change over time, while software development tools and practices are
    the application of those principles to a particular situation. Those tools and
    practices should be tailored accordingly, depending on the environment, and change
    as a situation evolves. Consequently, they suggest that Lean thinking should be
    viewed as guiding principles to develop and adapt Agile practices.^([^(31)](#fn31))


    Starting down the Lean/Agile road can be difficult. We believe it would be very
    useful to look at developing an adoption or scale-up roadmap for companies to
    trial Lean and Agile practices within their business environment while minimizing
    operational risk. Just keep in mind that by creating a Lean/Agile island in the
    organization would not bring a huge breakthrough. However, it would bring enough
    evidence to learn while scaling up across the organization. Remember, Toyota spent
    30 years to refine their production system; it is a journey that would require
    persistence and lots of effort.


    Pause and Consider


    There is a lot to consider between Agile and Lean and a lot of crossover. How
    do you think either would fit in your organization? Who in your organization could
    you talk to about Agile and Lean principles, to get additional input?'
  trans: '

    5. *完美*可能是精益思想中最重要的概念。它要求将持续流程改进作为组织文化的核心部分。追求完美是通过一个可重复的过程实现的，在此过程中，任何浪费都能被持续识别并消除。这是一段漫长的旅程，需要从员工、支持团队到领导者等各个层面付出坚持不懈的努力。正如马克·克劳福德所言：“精益专家常说，一个流程在经历至少六次价值流图分析之前，都算不上真正的精益。”^(²⁸)


    精益的首要指导原则是从流程中识别并消除浪费，以最大化客户价值。请注意，浪费的概念相当宽泛，具体取决于价值交付流程和环境。让我们以软件开发领域为例。例如，浪费可定义为：


    *   客户未使用的额外功能

    *   设计不佳、未通过测试且需要返工的功能

    *   等待需求或支持

    *   未完成的工作

    *   任务切换，同时处理多个开发项目

    *   额外的处理步骤或代码行

    *   未被利用或未被充分利用的员工知识与创造力


    精益软件开发，可以看作是上述概念和原则在软件开发实践中的应用。因此，精益软件开发的主要目的和目标，是在预算内，以尽可能短的交付时间提升客户价值。


    **暂停并思考**


    精益源于制造业，但已演变为一种流行的软件开发方法论。它如何在你的组织中发挥作用？你认为可能的优势是什么？你认为高层管理人员是否会对其潜在的益处印象深刻？


    ## 与敏捷方法论的重叠


    我们认为，精益和敏捷是同一种方法论的两种名称。仔细观察敏捷软件开发实践，不难发现它与精益概念的密切相似之处。


    例如：


    *   敏捷中的代码审查和内建质量，支持了精益方法论所基于的基石之一。该原则不是将低质量产品推向后续流程，而是在流程早期发现并修复缺陷，而不是等到整个产品准备发布时才发现问题。

    *   Scrum 使用精益的“拉动”原则来平衡工作量，并实现系统内的平滑流动。团队在每个冲刺（迭代）中，根据团队能力和容量，从待办列表中拉动任务。

    *   敏捷（Scrum）像精益一样，通过创建流程来识别并消除软件开发周期中的浪费，从而专注于消除浪费。

    *   敏捷使用看板技术来帮助管理产品开发，并加强团队与利益相关者之间的沟通。

    *   敏捷的各种仪式，如每日站会、计划会议或回顾会议，其起源都可追溯到精益。


    我们观察到一个团队，该团队为多个内部客户处理繁重的应用支持任务。该团队使用 Scrum 框架来开发新功能和解决方案，但使用看板来处理战术性的、基于临时需求的支持任务，以修复问题并解决其产品中的故障。团队最初使用简单的纸笔看板来即时跟踪事项和记录新的传入请求。在这种特定情况下，需要为团队带来更高的可见性和工作量管理。随着时间的推移，看板不断发展，变得更加复杂，具备了跟踪团队绩效的能力，并能更容易地识别和量化浪费，特别是在等待开发事项和返工领域。看板从纸笔形式迁移到了数字格式，然后被拆分为两个不同的功能，一个用于开发新产品和服务，另一个用于支持现有的已发布解决方案。看板随着团队在敏捷方法论中日益成熟而共同演进。


    毫无疑问，敏捷方法和精益软件开发在为客户创造价值方面是相辅相成的。然而，我们认为精益和敏捷之间存在关键差异。


    敏捷在本质上似乎更具战术性，其重点多放在技术实践、仪式和技巧上，以实现高效且有效的软件开发。


    在我们看来，关于需要建立怎样的企业级运营框架和程序才能使敏捷采纳成功，讨论得很少。因此，要成为一个敏捷企业组织，所需的重大变革必须从高层发起并推动。H. Smits
    (2007)指出：“在软件开发项目中大规模实施敏捷概念过程中积累的经验告诉我们，目前流行的敏捷软件开发方法（如 Scrum）如果不进行变革，就无法扩展到项目集、产品和组织层面。这些方法变革的基础可以在精益原则中找到……”^(²⁹)
    在这一点上，组织战略成为敏捷流程能够有效运作的主要驱动力。


    相反，精益是从高级管理层视角应用的，其目标是优化整个组织中所有活动的各个方面。


    从这个角度看，精益可以被视为一种自上而下的方法，而敏捷则是自下而上的。


    如果没有战略层面的支持，敏捷的采纳会受到抵制变革的组织力量的压制。通过从高层引入精益，在敏捷环境中工作的开发者与其利益相关者之间因实践和原则冲突而产生的紧张关系将会得到缓解。


    我们认为，敏捷框架通常不关注软件开发所处的周边商业环境。它主要提供一套供开发者使用的实践，可以被视为对精益方法论的补充。另一方面，精益原则可以应用于任何范围，从具体的软件开发实践，到整个组织——软件开发只是其中一小部分。^(³⁰)


    Poppendieck 和 Poppendieck (2003, 2006) 将精益原则视为不随时间改变的核心真理，而软件开发工具和实践则是这些原则在特定情境下的应用。这些工具和实践应根据环境进行相应调整，并随着情况的发展而变化。因此，他们建议应将精益思想视为指导原则，用以发展和调整敏捷实践。^(³¹)


    踏上精益/敏捷之路可能很艰难。我们认为，为企业制定一份在其商业环境中试行精益和敏捷实践、同时最小化运营风险的采纳或扩展路线图，将非常有用。请记住，在组织内部创建一个精益/敏捷孤岛并不会带来巨大的突破。然而，它能够带来足够的证据，以便在向整个组织扩展时学习。请记住，丰田花了
    30 年时间来完善其生产体系；这是一段需要毅力和大量努力的旅程。


    **暂停并思考**


    关于敏捷和精益，有许多需要考虑和交叉的部分。你认为它们中哪一个更适合你的组织？在你的组织中，你可以与谁讨论敏捷和精益原则，以获取更多意见？

