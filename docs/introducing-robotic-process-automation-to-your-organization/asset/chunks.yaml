  trans: '

    ### 部署 RPA 解决方案


    一旦 RPA 解决方案（机器人）部署完成，就需要分配专门的资源来监控其执行情况，并及时处理错误、修复问题以及进行小幅增强。这些资源还将管理流程的执行计划。此外，RPA
    管理和支持团队将负责通过监控和确保系统健康、最大化运行时许可证利用率、引入新的自动化能力等方式，来维护和推进整个 RPA 生态系统。根据部署的机器人数量以及
    RPA 生态系统的复杂程度，可能需要不止一个人来负责处理上述某些职能。同时，将那些高层职能分解成更小的模块也是有益的，以避免把事情过度复杂化。请记住，战术支持的主要目标是保持速度和敏捷性，而不是制造过多的官僚层级。


    **暂停与思考**


    各组织的职位名称可能有所不同。然而，头衔并不重要；关键是之前讨论的职责描述。你所在组织中有谁能执行这些任务？他们熟悉 RPA 吗？他们认为 RPA 有价值吗？


    ### 选择部署模式


    在开启 RPA 之路前，组织应决定 RPA 计划是由内部资源主导，还是外包给外部第三方 RPA 提供商。此外，组织也可以选择混合模式，即与外部提供商和内部资源建立协作框架。例如，外部合作伙伴可以专注于解决方案的识别、开发和部署，而内部团队则负责提供支持与维护。


    在选择合适的路径之前，组织必须明确以下几个方面：


    -   是否有足够的流程来证明 RPA 投资（ROI）的合理性？

    -   组织是否承诺对 RPA 计划进行长期投资？

    -   组织是否拥有启动 RPA 计划所需的内部技能和能力？

    -   RPA 是否是运营及 IT 基础设施或生态系统数字化转型的长期（即五到十年）战略的一部分？


    为 RPA 计划选择正确的路径，将决定其成功与否，否则可能导致结果不佳且成本高昂。这很可能会招致高层的撤资，并最终切断对 RPA 的财务投入。


    **提示**


    如果不满足这些条件，就不要启动 RPA 计划。没有这些条件，RPA 计划失败的可能性远大于成功。


    ### RPA 的组织模式


    RPA 计划的组织模式为在企业层面部署 RPA 提供了结构框架。有三种模式可供考虑^(⁷)：


    **集中式**


    这通常被设计为一个卓越中心（COE；关于 COE 的更多信息，请参见第 7 章），设立在一个高管办公室（业务领域）内，负责管理 RPA 计划的整个生命周期，包括制定标准、从构思到部署交付
    RPA 解决方案、维护 RPA 基础设施，并确保有适当的控制、风险管理和合规性。


    **中心辐射式或联合式**


    COE 设立在一个高管办公室内，通常作为分散型辐射点的中心。在这种情况下，COE 负责制定标准、制定政策、提供培训，并专注于创新和 RPA 计划战略。辐射点（即
    RPA 交付团队）则主要专注于为其所分配或服务的业务领域开发和部署 RPA 解决方案。这种模式要求中心（COE）与辐射点（RPA 交付团队）之间紧密协作。


    **分散式**


    在企业内部设立多个独立的 RPA 计划，各个 RPA 框架在不同的执行分支或业务单元下运作。这可以被视为多个自主运作的次级 COE 办公室。


    最佳的组织模式将取决于各个 RPA 计划的策略、服务人群的规模、业务复杂性、管理文化、组织设计、风险承受能力以及许多其他因素。在接下来的章节中，我们将更详细地讨论为你的企业
    RPA 计划实施有效运营模式的收益、适用性因素及方法。此外，我们还将讨论随着计划日益成熟，这些模式可能会如何变化。


    **暂停与思考**


    哪种模式适合你的组织？你将如何确定哪种模式最佳？你的组织目前是否设有卓越中心？如果有，它是如何运作的？你需要与 COE 中的谁讨论 RPA 事宜？如果你的组织中没有
    COE，是否有兴趣建立一个？


    ### RPA 的开发方法论


    有多种数字产品开发方法论可供选择。这些方法定义了必要的步骤、决策过程、沟通以及不同利益相关者需要执行的操作，以便成功交付数字产品——即 RPA 解决方案。


    最常见的包括：


    **瀑布模型**


    这是一种顺序式框架，流程以线性方式执行，产品按照预定义或计划的顺序从一个阶段进入下一个阶段。这种方法可以实现高质量的产品设计，但其僵化的结构不允许有高度的灵活性来应对变化，并且在早期阶段犯下、后期才发现的问题，解决起来代价可能非常高昂。


    **敏捷开发**


    这种方法论被软件开发公司广泛采用，尤其是初创公司，其核心思想是迭代开发和交付。该方法允许团队频繁地以小模块方式开发和发布产品功能、增强或变更。这可以实现快速的价值交付，对客户需求变化具有高度适应性或灵活性，并能快速识别错误和问题。


    **瀑布-敏捷混合模式**


    这种方法最初是顺序式的，然后在开发和交付阶段转变为迭代过程。这种混合模式创建了一种严谨的方法，允许在开始开发之前就深入调查和理解客户需求及产品规格，同时在开发和部署阶段又保持了足够的灵活性以进行迭代和调整。


    **精益开发**


    这种方法论依赖于简单的理念，比如交付从客户角度定义的价值。它采用了最初在制造业中确立的精益概念。在软件开发中，它首先定义最小可行产品，然后通过迭代周期，不断增加其价值——要么通过添加新功能，要么通过提高其质量。


    在这场竞争中，没有绝对的赢家；这完全取决于许多因素，类似于前面讨论的选择合适运营模式时需要考虑的因素。理解你所处的环境，以及每种方法论在该环境下的优势和潜在陷阱，至关重要。


    ### 框架的重要性


    一个结构良好的框架对于 RPA 计划的成功至关重要。随着需求变化或发现框架中的缺陷，可以随着时间的推移对其进行修改，但从一个稳固的框架开始运作将极大地促进成功。


    **暂停与思考**


    框架在你所在的领域可能会是什么样子？一些基本的结构要求（如角色等）是什么？哪些角色可能适合担任治理团队的成员？哪些角色适合作为决策机构，来决定是否继续推进某个请求？应该包含哪些文档？报告工作将如何开展？当你着手开展
    RPA 计划时，必须回答这些问题以及其他相关考量。

    '
- fmt: 'A flexible framework, with the required roles and processes included, is key
    to assuring that successes within the `RPA` initiative are not “one ofs,” but
    are repeatable.


    `Governance`, the rules, practices, and processes that will be used to control
    and monitor the `RPA` initiative will be key to success. Having effective `project
    sponsorship` – senior management responsible for assuring that `RPA` has the necessary
    support and achieves the anticipated benefits – is also a “must have” for `RPA`
    success. Assuring that there is a broad `framework` enables the people working
    within the `RPA` initiative to have a flexible structure to work within, assuring
    that they know what’s expected, but still have the ability to adapt to changing
    needs and situations.


