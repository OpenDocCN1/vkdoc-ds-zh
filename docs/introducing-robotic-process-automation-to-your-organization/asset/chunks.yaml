    \ the process to start. To follow the example in Section 1.3, the event is the\
    \ client wanting to change beneficiary information. The specific action, or trigger,\
    \ might be the receipt of an email from the client advising of the new beneficiary\
    \ information. Or it might be notification from an advisor to make the change\
    \ on behalf of the client. All possible triggers should be listed.\n\n*   1.5\
    \ Precondition\n\n*   In order for the process to start, what circumstances must\
    \ exist for the Bot to begin? For example, the Bot may need to have access to\
    \ certain software, the request may have to be in a particular format, etc. List\
    \ all required preconditions here.\n\n*   1.6 Post-condition\n\n*   List here\
    \ everything that is changed or produced as a result of the process. In the example\
    \ earlier, post-conditions might include the following:\n    *   Beneficiary information\
    \ has been changed.\n\n*   Client has been notified that the change has been made.\n\
    \n*   Advisor has been notified of the change.\n\n*   A report has been issued,\
    \ listing all changes within the last day.\n\nTip\n\nTalk to subject matter experts\
    \ (SMEs) to fully understand triggering events, triggers, and pre- and post-conditions.\n\
    \n2\\. Level 2 Details\n\n| Parameters Name | Description/Value | Mandatory? |\
    \ Meaning if omitted (only enter if mandatory = no) |\n| --- | --- | --- | ---\
    \ |\n| What is the input to the process? It could be an email, the completion\
    \ of another process, or any number of other things. | Briefly describe the input.\
    \ | Is it mandatory or not? |   |\n| Insert as many input parameters as there\
    \ are. Add extra rows as necessary. |   |   |   |\n\n*   2.1 Input Parameters\n\
    \n| Parameters Name | Description/Value | Mandatory? | Meaning if omitted (only\
    \ enter if mandatory = no) |\n| --- | --- | --- | --- |\n| What does the process\
    \ produce? List its name here. | Briefly describe the output. | Is it mandatory\
    \ or not? |   |\n| Include all outputs. Add extra rows as necessary. |   |   |\
    \   |\n\n*   2.2 Output Parameters\n\n3\\. Level 3 Details\n\n*   3.1 Main Flow\
    \ Steps\n\n*   In this section, list the steps of the normal process. For example,\
    \ if in 70% of the cases, there is one way the process flows, list those steps\
    \ here. In using the same example as before, the steps might be as follows:\n\
    \    1.  Email received\n\n2.  System ABC accessed\n\n3.  Account number found\n\
    \n4.  Beneficiary changed per instructions\n\n5.  Email sent to client\n\n6. \
    \ Email sent to advisor\n\n7.  Information added to daily report\n\n*   3.2 Alternative\
    \ Flows\n\n*   There are some inputs that will have slightly different steps,\
    \ but can still be handled by the Bot. List those process flows here.\n\n*   3.3\
    \ Exception Flows\n\n*   There may be some circumstance that the Bot will be unable\
    \ to process. Using the example earlier, this could be because the account number\
    \ couldn’t be identified, or the current beneficiary name was wrong, etc. Explain\
    \ what happens in those circumstances. Using the same example, the flow might\
    \ be as follows:\n    1.  Email received\n\n2.  System ABC accessed\n\n3.  Account\
    \ number not found\n\n4.  Email sent to processing clerk for manual handling\n\
    \n5.  Adding information to an exception report\n\nPause and Consider\n\nIn order\
    \ for the developers to create efficient Bots, this information is vital. How\
    \ will you get it? Who do you need to speak with to obtain it and then validate\
    \ it? Remember, spending the time now to get it right will prevent costly rework\
    \ later.\n\nWe will now discuss **nonfunctional requirements** (see Appendix 10\
    \ for a template).\n\n“Nonfunctional Requirements (NFRs) define system attributes\
    \ such as security, reliability, performance, maintainability, scalability, and\
    \ usability. They serve as constraints or restrictions on the design of the system\
    \ across the different backlogs.”^([^(12)](#fn12))\n\n1.  Automation service standards:\
    \ This is a “boilerplate” section that simply states the date that current standards\
    \ were set and by whom (example: COE). If there are no established standards at\
    \ your organization, please disregard this section.\n\n2.  Privacy, data retention,\
    \ and purge requirements: Include information on protecting customer privacy and\
    \ also where the data will be stored. Also indicate when the document can be deleted.\n\
    \n**Process Flow**\n\nInclude a process flow for visual clarity. Using the same\
    \ example, the process flow might resemble this:\n\n![../images/513218_1_En_6_Chapter/513218_1_En_6_Figa_HTML.jpg](images/513218_1_En_6_Chapter/513218_1_En_6_Figa_HTML.jpg)\n\
    \nThe process flow is an at-a-glance view of the process from end to end. It enables\
    \ management to have the necessary understanding of the process and assists designers\
    \ in knowing what aspect of the process can be automated and how best to design\
    \ the automation.\n\nTip\n\nThe terms “process flow” and “process map” are often\
    \ used interchangeably. Please keep in mind how they are used in this book.\n\n\
    Screen Captures\n\nIn order for the developers to create the Bot, they must know\
    \ exactly how the process functions. Remember, RPA is to automate an existing\
    \ process. While there might be some opportunities for improving the process itself\
    \ during automation, no major process changes will be made. If they are required,\
    \ the process is not a good candidate for RPA.\n\nPause and Consider\n\nDuring\
    \ this phase, the request will be examined in more detail. Is it still a good\
    \ candidate for RPA? Remember, at the end of this phase, there will be another\
    \ governing body meeting, and you will be asked for a “go/no-go” recommendation.\
    \ You may have recommended “go” at the conclusion of opportunity assessment, but\
    \ following a deeper look, you may recommend “no go.” That is perfectly legitimate.\n\
    \nIn order to get screen captures, the most effective method is to record a person\
    \ actually performing the process manually. This can be done through any of a\
    \ variety of online meeting apps or, lacking anything else, using a cell phone.\n\
    \nAfter identifying the correct SME, schedule a meeting with them, and record\
    \ the entire process. After the meeting, grab screenshots and place them in a\
    \ word document, using arrows to indicate selections, and have a brief description\
    \ of what is happening on each screen. Remember, in order to correctly automate\
    \ the process, the developers must see every last step in the process.\n\nFinally,\
    \ include a screenshot of a typical output. What is it that the process produces?\
    \ Is it a report in Excel format? A letter to a client or advisor? Whatever it\
    \ is, include a screenshot of it.\n\nPause and Consider"
  trans: "好的，作为高级文档工程师和翻译员，我将根据您提供的注意事项和示例，将给定的英文文本翻译成中文。\n\n\n# 需求收集\n\n我们将从讨论功能需求和我们推荐的模板开始。\n\
    \n请参考附录 9 中的模板，记住这只是一个模型。如果它对您的组织适用，那很好，但您可以根据组织的需求自由调整它。\n\n## 1 第一层级详情\n\n###\
    \ 1.1 系统\n\n*   在输入、处理或输出过程中，必须访问哪些系统？请在此列出。\n\n### 1.2 目标\n\n*   在本节中，简要但清晰地描述项目的目标。这可能包括对当前情况的简短描述及其为何存在问题，以及对项目成果及其优势的简要描述。**这里不是定义目标的地方**；那是在更早的阶段完成的。这里只是更详细地描述它。重要的是不要陷入在此处重新定义目标并偏离最初请求的陷阱。此描述必须满足流程所有者所请求的内容。他们必须批准此文档，因此描述必须准确。\n\
    \n### 1.3 触发事件\n\n*   在本节中，列出导致流程开始的事件。例如，客户寻求更改受益人信息。\n\n### 1.4 触发器\n\n*   这是导致流程开始的特定操作。沿用第\
    \ 1.3 节中的示例，事件是客户想要更改受益人信息。特定的操作（或触发器）可能是收到一封来自客户的电子邮件，通知了新的受益人信息。或者可能是来自顾问的通知，代表客户进行更改。应列出所有可能的触发器。\n\
    \n### 1.5 前置条件\n\n*   为了使流程开始，机器人必须处于何种环境条件？例如，机器人可能需要访问某些软件，请求必须采用特定格式等。在此列出所有必需的前置条件。\n\
    \n### 1.6 后置条件\n\n*   在此列出流程导致的所有变化或产出。在前面的示例中，后置条件可能包括以下内容：\n    *   受益人信息已被更改。\n\
    \    *   客户已被通知更改已完成。\n    *   顾问已被通知该更改。\n    *   已生成一份报告，列出最近一天内的所有更改。\n\n**提示**\n\
    \n与主题专家（SME）进行沟通，以充分理解触发事件、触发器以及前置和后置条件。\n\n## 2. 第二层级详情\n\n### 2.1 输入参数\n\n|\
    \ 参数名称 | 描述/值 | 是否必填？ | 省略时的含义（仅在必填=否时填写） |\n| --- | --- | --- | --- |\n| 流程的输入是什么？可能是一封电子邮件、另一个流程的完成，或任何其他事物。\
    \ | 简要描述输入。 | 是否为必填项？ | |\n| 输入参数有多少个就插入多少个。必要时可添加额外行。 | | | |\n\n### 2.2 输出参数\n\
    \n| 参数名称 | 描述/值 | 是否必填？ | 省略时的含义（仅在必填=否时填写） |\n| --- | --- | --- | --- |\n| 流程产生什么？在此列出其名称。\
    \ | 简要描述输出。 | 是否为必填项？ | |\n| 包括所有输出。必要时可添加额外行。 | | | |\n\n## 3. 第三层级详情\n\n###\
    \ 3.1 主流程步骤\n\n*   在本节中，列出正常流程的步骤。例如，如果在 70%的情况下，流程以一种方式流转，请在此列出这些步骤。沿用之前的同一个示例，步骤可能如下：\n\
    \    1.  收到电子邮件\n    2.  访问系统 ABC\n    3.  找到账号\n    4.  根据指示更改受益人\n    5.  向客户发送电子邮件\n\
    \    6.  向顾问发送电子邮件\n    7.  信息被添加到每日报告\n\n### 3.2 备选流程\n\n*   有些输入将包含略有不同的步骤，但仍可由机器人处理。在此列出这些流程。\n\
    \n### 3.3 异常流程\n\n*   可能存在一些机器人无法处理的情况。沿用前面的例子，可能是由于无法识别账号，或者当前受益人姓名错误等原因。解释在这些情况下会发生什么。沿用同一个例子，流程可能如下：\n\
    \    1.  收到电子邮件\n    2.  访问系统 ABC\n    3.  未找到账号\n    4.  向处理员发送电子邮件以进行手动处理\n\
    \    5.  将信息添加到异常报告\n\n**暂停并思考**\n\n为了让开发人员创建高效的机器人，这些信息至关重要。您将如何获取它们？您需要与谁交谈以获取并验证它们？请记住，现在花时间把它做对，可以避免将来代价高昂的返工。\n\
    \n## 非功能性需求\n\n我们现在将讨论非功能性需求（模板见附录 10）。\n\n> “非功能性需求（NFR）定义了系统属性，如安全性、可靠性、性能、可维护性、可伸缩性和可用性。它们在不同的待办事项列表中作为对系统设计的约束或限制。”^(¹²)\n\
    \n1.  **自动化服务标准：** 这是一个“样板”部分，仅说明当前标准的设定日期和设定者（例如：卓越中心 COE）。如果您的组织没有既定的标准，请忽略此部分。\n\
    \n2.  **隐私、数据保留和清除要求：** 包含有关保护客户隐私以及在何处存储数据的信息。同时指明何时可以删除文档。\n\n## 流程图\n\n包括一个流程图以提供视觉清晰度。使用同一个示例，流程图可能类似于：\n\
    \n![../images/513218_1_En_6_Chapter/513218_1_En_6_Figa_HTML.jpg](img/513218_1_En_6_Figa_HTML.jpg)\n\
    \n流程图是从头到尾对流程的一目了然的视图。它使管理层能够对流程有必要的理解，并帮助设计人员了解流程的哪些方面可以自动化以及如何最佳地设计自动化。\n\n\
    **提示**\n\n“流程图”和“流程映射”这两个术语经常互换使用。请记住它们在本节中的用法。\n\n## 屏幕截图\n\n为了让开发人员创建机器人，他们必须确切地知道流程是如何运作的。请记住，RPA\
    \ 是为了自动化现有流程。虽然在自动化过程中可能存在一些改进流程本身的机会，但不会进行重大的流程变更。如果需要重大变更，则该流程不适合采用 RPA。\n\n\
    **暂停并思考**\n\n在此阶段，将更详细地审查请求。它是否仍然是 RPA 的良好候选对象？请记住，在此阶段结束时，将举行另一次管理机构会议，并将要求您提出“可行/不可行”建议。您可能在机会评估结束时建议了“可行”，但经过更深入的了解后，您可能会建议“不可行”。这完全是合理的。\n\
    \n为了获取屏幕截图，最有效的方法是记录一个人手动执行该流程的过程。这可以通过各种在线会议应用程序完成，或者在没有其他方法的情况下，使用手机来完成。\n\n\
    确定正确的主题专家（SME）后，与他们安排一次会议，并记录整个流程。会议结束后，截取屏幕截图并将它们放入 Word 文档中，使用箭头指示选项，并对每个屏幕上发生的事情进行简要描述。请记住，为了正确自动化流程，开发人员必须看到流程中的每一个步骤。\n\
    \n最后，包括一个典型输出的屏幕截图。流程产生的是什么？是 Excel 格式的报告吗？是给客户或顾问的信函吗？无论是什么，都截取一个屏幕截图。\n\n**暂停并思考**\n"
- fmt: '# 排版后内容


    Your company may have standards that must be followed for development. Your new
    RPA program must conform to those standards. If there is a Center of Excellence
    (COE) in your company, those standards may be housed there. Bring in a COE representative
    early in the process, to assure that you have all the necessary steps in place
    to satisfy company requirements.


    ## Planning


    Formal planning begins once requirements are gathered. For a “Waterfall” methodology,
    this means that they have been fully captured, documented, and validated for the
    entire project, start to finish. If you are using an Agile methodology, or a hybrid
    of both, you must determine at what point you have requirements sufficient to
    begin planning.


    Once you have reached the point where requirements have been sufficiently captured
    to satisfy the methodology used (Waterfall, Agile, or a hybrid), planning is the
    next step. Planning is a vital step in the process of automation. The old adage
    “If you fail to plan, plan to fail” is certainly true with RPA.


    In planning, the first step is to schedule meetings with the pertinent stakeholders.
    Most of these will have been identified by now as you have talked to the business
    owner(s) and subject matter experts. Assure that you have all the necessary stakeholders
    identified. This can be validated in a brief discussion with the business owner(s).
    This initial planning meeting should include product (business) owner(s), key
    SMEs, a business analyst, developers, and/or a deployment team member.


    The main purpose of this first formal planning meeting is to assess the size and
    complexity of the process for which automation has been requested. With the key
    stakeholders who will attend this meeting, you will be able to determine if the
    level of requirements detail collected is sufficient to start development or if
    additional detail is needed. This is a key outcome of this meeting.


    Some information may be reviewed at this meeting, but if additional requirements
    are needed, they should be obtained first. You want to be sure to discuss what
    applications the automation is going to work with and understand if these applications
    are used in any existing automations. If they are, identify which automations
    are using the applications. You also need to determine what access is required
    to use these applications. You may need to engage with your organization’s security
    team to get the right authorization. Lastly, you should determine if a proof of
    concept (POC) is required in order to determine technical feasibility.


    If additional requirements are needed, or these questions cannot be answered at
    this meeting, do not proceed. Obtain the missing information, and meet again to
    finalize these issues.


    For a Waterfall methodology, once the requirements are completed, reviewed, and
    signed off by the required stakeholders, the development team will meet regularly.


    If using an Agile methodology, once sufficient information is obtained and the
    user stories are developed, the Agile project management process begins.


    ### Pause and Consider


    The development team will meet “regularly.” What will “regularly” mean in your
    organization? For an Agile team, what meetings additional to the daily stand-up
    will be required? If using a “Waterfall” methodology, how often must you meet?
    It is likely that your team may require more meetings at the start of the project
    and fewer as the project progresses.


    During initial development team meetings, requirements must be divided into smaller
    tasks, functions, or stories. During these meetings, the team will identify dependencies
    and decide the sequence of development.


    Once this information is developed, and the team has a good idea of complexity
    and a timeline, it is time to once again review the project with the governing
    body. The team will briefly present the information they have identified and make
    a recommendation on whether or not to proceed with the project. Remember, as more
    information is gained, a project may be validated, or it may be found to not have
    the promise that it initially appeared to have.


    ### Tip


    Remember, a project cancelled at this point does not indicate failure! Based on
    your earlier knowledge and recommendations, the governing body has agreed to proceed.
    If new information has come to light that causes you to think the project is no
    longer feasible, that just demonstrates that the RPA process itself is working
    as it should.


    ## Governing Body Approval


    ### Tip


    We refer to the governing body as the “governing body,” to indicate that it is
    the “gatekeeper” to the next phase. Use whatever terminology fits your organization.


    As with all the phases, if the governing body decides not to proceed with the
    project to the next phase, the business owner will be advised of this decision
    and the reasons for it. If, during discussions with the team, any other possible
    solution was identified (e.g., a new software tool, a significant improvement
    to the manual process, etc.), the business owner should be informed of those possibilities.


    If the governing body has approved moving to the next phase, the development team
    now starts working on developing process design documents (PDD).


    As mentioned earlier in this chapter, PDD is the preferred method of documenting
    requirements for RPA projects. If your organization doesn’t have an effective
    method of gathering and documenting requirements, use the following method for
    your RPA projects.


    A process definition document is fairly straightforward. It answers some basic
    questions to assist designers and developers in automating the process it describes.
    It conveys what the process does, its inputs and outputs, the steps currently
    performed to accomplish the process, and any decision points in the process. Regarding
    any decision points, you need to determine if they can be automated. If not, they
    will need to be sent for manual handling.


    The PDD also conveys who owns the process and who actually performs it. The document
    will also specify how often the process is performed: it might be hourly, weekly,
    monthly, on demand, or any other configuration. Also, what systems or applications
    interact with it? Which ones either provide input to the process or receive its
    output.


    We talked before about authorization; the PDD lists what authorizations are needed
    for any systems or applications that interact with the process.


    The PDD will also list the currently known risks. What could go wrong? What happens
    if something goes wrong? Does the process revert to manual performance until the
    problem is resolved? Who is responsible?


    Lastly, the PDD will explicitly state the endpoints. How do we know that the process
    has completed?


    A PDD can be accompanied by a flow diagram showing the current process and how
    that same process will/would look if automated. It can also specify the endpoints
    of a manual as well as an automated process.^([^(13)](#fn13))'
