  trans: '

    # 6. 解决方案设计


    在概念设计阶段，需要收集需求（功能性和非功能性）。附录中提供了模板，本章节将给出详细说明。


    概念设计可被视为解决方案蓝图。此时将对自动化解决方案进行高层级决策，包括 Bot 将执行什么任务、需要访问哪些系统、按何种计划运行等。这些内容将在后续阶段进一步细化，但本阶段将确定基本框架。


    同时，本阶段需要创建一份解决方案设计文档。该文档包含流程与产出、整体结构、逻辑组件以及当前状态与潜在未来状态之间的相互关系。我们提供了模板及清晰说明（请参见附录
    12）。


    RPA 可以采用传统的"瀑布"方法或更敏捷的方法论引入。在"瀑布"方法中，需求与概念性解决方案设计在开发开始前便创建并归档。如今越来越多的公司采用敏捷或并行工程方法，需求与解决方案开发活动同步进行。每种方法各有优劣，部分组织会将其融合为混合方法。


    无论选择何种方法论，本章所述的任务都必须完成。


    概念设计完成后，需要填写就绪检查清单。这确保开发（下一阶段）所需的所有组件均已完备。附录中附带详细说明的模板。


    就绪检查清单完成后，将提交给决策机构，由其决定是否进入下一阶段（开发）。决策机构通常由以下角色组成：


    *   RPA 技术交付负责人

    *   架构师

    *   开发人员

    *   其他必要人员


    ### 暂停与思考


    各公司的角色名称不尽相同。您所在组织中有哪些对应角色？同时，考虑一下贵公司中"其他必要人员"可能包含哪些人。这可能包括总监、区域经理、系统分析师或其他人员。决策机构规模应精简，但必须包含具备决策资格的人员来判断是否进入下一阶段。


    请注意，该模式的优势之一是工作逐步推进，并为决策机构（决策主体）设置了非常具体的检查节点，用以审查工作并判断任何项目的持续可行性。在机会评估阶段仅收集初步信息时，某项需求可能在
    ROI、竞争优势或其他方面看似前景可观，但在概念设计阶段的深入调查后可能变得不那么理想。项目从一个阶段推进到下一阶段时皆是如此。在任何节点，决策机构都可能因更仔细的审查发现早期评估不实而取消项目。某个项目在某一阶段获得批准后又被取消，并不代表前一阶段存在失败——这正是
    RPA 项目推进的本质特征。


    ### 暂停与思考


    在许多公司里，即便利益相关方明知项目已无必要，项目仍会继续推进。取消项目被视为对已投入资金的浪费和不同决策者的失败。您将如何说服管理层，采用这种阶段性评估项目的模式是有益的？


    在 RPA 中，需求文档通常被称为流程设计文档（PDD）。下文"决策机构审批"章节将对 PDD 进行说明。如果您的组织擅长需求收集与归档，请继续使用原有流程；以下将说明典型需求文档的细节。


    但如果您的组织不存在高效的需求收集流程，或仅需为 RPA 捕获需求，则 PDD 是收集与记录需求的首选方式。请参见本章"决策机构审批"章节获取相关信息。

    '
- fmt: "# Requirements Gathering\n\nWe will start with a discussion about functional\
    \ requirements and the template we recommend.\n\nPlease refer to the template\
    \ in Appendix 9, remembering that it is simply a model. If it works for your organization,\
    \ fine, but feel free to adapt it to your organization’s needs.\n\n## 1 Level\
    \ 1 Details\n\n### 1.1 System\n\n*   What systems must be accessed, during input,\
    \ throughput, or output? List them here.\n\n### 1.2 Goal\n\n*   In this section,\
    \ briefly but clearly describe the goal of the project. This might include a short\
    \ description of the current situation and why it is a problem, along with a brief\
    \ description of what the outcome of the project will be and its advantages. This\
    \ is NOT where the goal is defined; that was done in earlier phases. This simply\
    \ describes it in more detail. It is important not to fall into the trap of redefining\
    \ the goal here and moving away from the initial request. This description must\
    \ satisfy what the process owner requested. They must approve this document, so\
    \ the description must be accurate.\n\n### 1.3 Triggering Event\n\n*   In this\
    \ section, list what event causes the process to start. For example, client seeks\
    \ to change beneficiary information.\n\n### 1.4 Triggers\n\n*   This is the specific\
    \ action that causes the process to start. To follow the example in Section 1.3,\
    \ the event is the client wanting to change beneficiary information. The specific\
    \ action, or trigger, might be the receipt of an email from the client advising\
    \ of the new beneficiary information. Or it might be notification from an advisor\
    \ to make the change on behalf of the client. All possible triggers should be\
    \ listed.\n\n### 1.5 Precondition\n\n*   In order for the process to start, what\
    \ circumstances must exist for the Bot to begin? For example, the Bot may need\
    \ to have access to certain software, the request may have to be in a particular\
    \ format, etc. List all required preconditions here.\n\n### 1.6 Post-condition\n\
    \n*   List here everything that is changed or produced as a result of the process.\
    \ In the example earlier, post-conditions might include the following:\n    *\
    \   Beneficiary information has been changed.\n    *   Client has been notified\
    \ that the change has been made.\n    *   Advisor has been notified of the change.\n\
    \    *   A report has been issued, listing all changes within the last day.\n\n\
    **Tip**\n\nTalk to subject matter experts (SMEs) to fully understand triggering\
    \ events, triggers, and pre- and post-conditions.\n\n## 2. Level 2 Details\n\n\
    ### 2.1 Input Parameters\n\n| Parameters Name | Description/Value | Mandatory?\
    \ | Meaning if omitted (only enter if mandatory = no) |\n| --- | --- | --- | ---\
    \ |\n| What is the input to the process? It could be an email, the completion\
    \ of another process, or any number of other things. | Briefly describe the input.\
    \ | Is it mandatory or not? | |\n| Insert as many input parameters as there are.\
    \ Add extra rows as necessary. | | | |\n\n### 2.2 Output Parameters\n\n| Parameters\
    \ Name | Description/Value | Mandatory? | Meaning if omitted (only enter if mandatory\
    \ = no) |\n| --- | --- | --- | --- |\n| What does the process produce? List its\
    \ name here. | Briefly describe the output. | Is it mandatory or not? | |\n| Include\
    \ all outputs. Add extra rows as necessary. | | | |\n\n## 3. Level 3 Details\n\
    \n### 3.1 Main Flow Steps\n\n*   In this section, list the steps of the normal\
    \ process. For example, if in 70% of the cases, there is one way the process flows,\
    \ list those steps here. In using the same example as before, the steps might\
    \ be as follows:\n    1.  Email received\n    2.  System ABC accessed\n    3.\
    \  Account number found\n    4.  Beneficiary changed per instructions\n    5.\
    \  Email sent to client\n    6.  Email sent to advisor\n    7.  Information added\
    \ to daily report\n\n### 3.2 Alternative Flows\n\n*   There are some inputs that\
    \ will have slightly different steps, but can still be handled by the Bot. List\
    \ those process flows here.\n\n### 3.3 Exception Flows\n\n*   There may be some\
    \ circumstance that the Bot will be unable to process. Using the example earlier,\
    \ this could be because the account number couldn’t be identified, or the current\
    \ beneficiary name was wrong, etc. Explain what happens in those circumstances.\
    \ Using the same example, the flow might be as follows:\n    1.  Email received\n\
    \    2.  System ABC accessed\n    3.  Account number not found\n    4.  Email\
    \ sent to processing clerk for manual handling\n    5.  Adding information to\
    \ an exception report\n\n**Pause and Consider**\n\nIn order for the developers\
    \ to create efficient Bots, this information is vital. How will you get it? Who\
    \ do you need to speak with to obtain it and then validate it? Remember, spending\
    \ the time now to get it right will prevent costly rework later.\n\n## Nonfunctional\
    \ Requirements\n\nWe will now discuss nonfunctional requirements (see Appendix\
    \ 10 for a template).\n\n> “Nonfunctional Requirements (NFRs) define system attributes\
    \ such as security, reliability, performance, maintainability, scalability, and\
    \ usability. They serve as constraints or restrictions on the design of the system\
    \ across the different backlogs.”^([^(12)](#fn12))\n\n1.  **Automation service\
    \ standards:** This is a “boilerplate” section that simply states the date that\
    \ current standards were set and by whom (example: COE). If there are no established\
    \ standards at your organization, please disregard this section.\n\n2.  **Privacy,\
    \ data retention, and purge requirements:** Include information on protecting\
    \ customer privacy and also where the data will be stored. Also indicate when\
    \ the document can be deleted.\n\n## Process Flow\n\nInclude a process flow for\
    \ visual clarity. Using the same example, the process flow might resemble this:\n\
    \n![../images/513218_1_En_6_Chapter/513218_1_En_6_Figa_HTML.jpg](images/513218_1_En_6_Chapter/513218_1_En_6_Figa_HTML.jpg)\n\
    \nThe process flow is an at-a-glance view of the process from end to end. It enables\
    \ management to have the necessary understanding of the process and assists designers\
    \ in knowing what aspect of the process can be automated and how best to design\
    \ the automation.\n\n**Tip**\n\nThe terms “process flow” and “process map” are\
    \ often used interchangeably. Please keep in mind how they are used in this book.\n\
    \n## Screen Captures\n\nIn order for the developers to create the Bot, they must\
    \ know exactly how the process functions. Remember, RPA is to automate an existing\
    \ process. While there might be some opportunities for improving the process itself\
    \ during automation, no major process changes will be made. If they are required,\
    \ the process is not a good candidate for RPA.\n\n**Pause and Consider**\n\nDuring\
    \ this phase, the request will be examined in more detail. Is it still a good\
    \ candidate for RPA? Remember, at the end of this phase, there will be another\
    \ governing body meeting, and you will be asked for a “go/no-go” recommendation.\
    \ You may have recommended “go” at the conclusion of opportunity assessment, but\
    \ following a deeper look, you may recommend “no go.” That is perfectly legitimate.\n\
    \nIn order to get screen captures, the most effective method is to record a person\
    \ actually performing the process manually. This can be done through any of a\
    \ variety of online meeting apps or, lacking anything else, using a cell phone.\n\
    \nAfter identifying the correct SME, schedule a meeting with them, and record\
    \ the entire process. After the meeting, grab screenshots and place them in a\
    \ word document, using arrows to indicate selections, and have a brief description\
    \ of what is happening on each screen. Remember, in order to correctly automate\
    \ the process, the developers must see every last step in the process.\n\nFinally,\
    \ include a screenshot of a typical output. What is it that the process produces?\
    \ Is it a report in Excel format? A letter to a client or advisor? Whatever it\
    \ is, include a screenshot of it.\n\n**Pause and Consider**"
