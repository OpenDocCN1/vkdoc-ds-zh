    with the capability and limitations of RPA tools and be able to provide basic
    overview training to the process owners. The process analyst/designer is the driver
    of the specification for the RPA solution, at the same time acting as an owner
    of any other related documentation such as feasibility, impact and risk assessments
    as well as business acceptance handoffs, etc. In addition, they should be responsible
    for incorporating back into the specification any feedback and changes made during
    the development and testing phase.


    *RPA Solution Architect*


    RPA solution architects traditionally come from software development or automation
    backgrounds. The RPA arena is growing very fast and is assisted by simple Task
    Bots that execute repetitive, rule-based tasks. These are easy to build to a new
    generation of IQ Bots that allow the addition of cognitive processing capabilities,
    enabling the process to deal with unstructured data. Also, there are plenty of
    packaged enterprise software offerings, such as AutomationAnywhere, BluePrism,
    UIPath, etc. The RPA solution architects need to be familiar with not only the
    RPA capabilities available today but must also be knowledgeable about the following:


    *   Automation strategies


    *   Digital solution delivery models and frameworks (Agile, DAD, DevOps, etc.)


    *   IT infrastructure and business operations


    *   Products or services that will be addressed in an RPA program


    This expertise is required to assist and guide the organization throughout the
    RPA journey in building sustainable, effective (impactful), and scalable solutions.


    *RPA Developer*


    The main responsibilities of the RPA developer are to design, develop, and maintain
    the automation solutions using the RPA tooling. Depending upon the tooling used,
    this role will require some developer-level expertise. If you’re looking to automate
    a process that involves rules and logic such as loops, if/else statements, variables,
    and exceptions, it requires programming, and the RPA developer should have the
    required experience in that discipline. Keep in mind there are multiple ways to
    automate a process; therefore, good technical knowledge of automation tools is
    a huge asset.


    That the RPA developer is a part of the cross-functional design team means they
    are working closely with the RPA solution architect and the process analyst/designer
    to find the most effective and efficient way to develop, test, and, after successful
    acceptance by the process owner, deploy to production the automation solution.
    It is important to remember that the released-to-production solution should be
    accompanied by supporting documentation to help developers and operations personnel
    understand the logic and content of the automated solution.


    *RPA Management and Support*'
  trans: '

    # 赞助支持


    RPA 赞助人无需亲自执行这些任务，但需确保项目成果与全企业战略方向保持一致，并为其创造价值。他/她需要确立项目愿景、目的与目标，清除障碍，并确保为项目成功分配必要的资源。通常，RPA
    赞助人是高管团队成员，负责监督引入 RPA 项目的业务领域。由业务部门或 IT 部门主导项目均可。然而，重要的是要记住，RPA 团队必须是跨职能的，并应包括以下角色：


    -   业务部门

    -   IT 部门

    -   安全部门

    -   风险与合规部门

    -   财务部门

    -   人力资源部门

    -   市场部门（适用时）


    来自这些领域的利益相关者/主题专家必须参与创建协作环境，因为正如文章《[成功实施机器人流程自动化的蓝图](https://medium.com/%2540cfb_bots/a-blueprint-for-implementing-robotic-process-automation-successfully-88e5f7ff7400)》^(⁵)
    所述，RPA 有潜力成为推动真正且有影响力的数字化转型的颠覆性变革力量。


    另一方面，RPA 倡导者将负责推广 RPA 技术以应对业务挑战，并负责在所引入项目的业务领域中推动 RPA 的采纳。理想情况下，RPA 倡导者应深入了解业务运营，并具备必要的影响力来推广
    RPA，同时通过及时解决任何障碍来克服对采纳 RPA 的阻力。^(⁶) 最佳实践是拥有多位代表不同业务领域的 RPA 倡导者，以最大化 RPA 项目的回报价值并确保全企业范围的采纳。


    ## 暂停与思考


    赞助人和倡导者应对 RPA 项目的成功充满热情并拥有既得利益。你是否已采取必要措施，确保你希望成为赞助人或倡导者的人相信 RPA？不要选择那些只是应经理/领导要求参与，或者你明知其对
    RPA 潜力持怀疑态度的人。


    确保有一位高级管理者为 RPA 项目的成功投入并负责，是项目成功的关键。他们应有一个令人信服的理由来确保项目成功。


    # 框架


    当我们提到框架时，指的是项目如何构建的总体概览。这并非一成不变；它会因公司而异，甚至在同一公司的不同业务部门之间也会有所不同。但存在一些基本的基础组成部分。


    正如我们之前提到的，RPA 项目团队必须是跨职能和多学科的，并且应包括来自业务运营和控制支持职能中所有受影响领域的代表。一个功能齐全的核心 RPA 交付团队应包括以下角色：


    -   流程分析师/设计师

    -   RPA 解决方案架构师

    -   RPA 开发人员

    -   RPA 管理与支持


    ## 流程分析师/设计师


    此角色需要理解需要自动化的流程，检查自动化该特定流程的可行性，如果合理的话，则设计并开发该流程的未来状态。流程分析师/设计师应具备业务流程经验，并能够定义所需流程的愿景。由于此角色可能由一人或多人担任，因此非常重要的是要记住，流程分析师/设计师必须与当前流程的执行者密切合作，以准确捕捉其细节。流程分析师/设计师必须理解并评估这些细节，以判断该流程是否适合
    RPA，并且部署的解决方案（机器人）不会使运营面临任何风险，并能带来足够的收益。为此，流程分析师/设计师还需要熟悉 RPA 工具的功能和局限性，并能够为流程负责人提供基础概览培训。流程分析师/设计师是
    RPA 解决方案规范的驱动者，同时负责所有其他相关文档，如可行性、影响和风险评估，以及业务验收交接等。此外，他们还应负责将在开发和测试阶段产生的任何反馈和更改整合回规范中。


    ## RPA 解决方案架构师


    RPA 解决方案架构师通常具有软件开发或自动化背景。RPA 领域发展非常迅速，并且得益于可执行重复性、基于规则任务的简单任务机器人。这些机器人的构建很容易，如今已演进到新一代的
    IQ 机器人，它增加了认知处理能力，使流程能够处理非结构化数据。此外，市面上还有许多打包的企业软件产品，例如 AutomationAnywhere、BluePrism、UIPath
    等。RPA 解决方案架构师不仅需要熟悉当前可用的 RPA 功能，还必须了解以下方面：


    -   自动化策略

    -   数字解决方案交付模型和框架（敏捷、DAD、DevOps 等）

    -   IT 基础设施和业务运营

    -   将在 RPA 项目中涉及的产品或服务


    需要这些专业知识来帮助和指导组织在整个 RPA 旅程中构建可持续、有效（有影响力）且可扩展的解决方案。


    ## RPA 开发人员


    RPA 开发人员的主要职责是使用 RPA 工具设计、开发和维护自动化解决方案。根据所使用的工具，此角色需要一定程度的开发人员专业技能。如果你希望自动化一个包含规则和逻辑（如循环、`if/else`
    语句、变量和异常）的流程，则需要编程能力，并且 RPA 开发人员应具备该领域的必要经验。请记住，自动化一个流程有多种方法；因此，具备良好的自动化工具技术知识是一笔巨大的财富。


    RPA 开发人员是跨职能设计团队的一员，这意味着他们与 RPA 解决方案架构师和流程分析师/设计师密切合作，以寻找最有效和最高效的方式来开发、测试，并在流程负责人成功验收后，将自动化解决方案部署到生产环境。重要的是要记住，发布到生产环境的解决方案应附有支持性文档，以帮助开发人员和运维人员理解自动化解决方案的逻辑和内容。


    ## RPA 管理与支持

