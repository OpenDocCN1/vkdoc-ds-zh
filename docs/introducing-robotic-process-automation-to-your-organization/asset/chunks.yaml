- fmt: "# Technical Feasibility\n\nThere are several components to be validated. These\
    \ include the following:\n\n- Defined logics\n- Rule-based steps\n- Input and\
    \ output data\n- Complexity analysis\n- Volume of transactions\n- Development\
    \ effort\n\nThe following steps are required to do the technical feasibility:\n\
    \n1. Will the automated process provide the required security (again, refer to\
    \ the `PDD`)?\n2. Can the process, when automated, run at the speeds and times\
    \ required by the business?\n3. Are there any regulatory requirements?\n4. List\
    \ all the applications the automation is going to interact with or use; this can\
    \ be obtained from the process design document (see previous discussion).\n  \
    \ 1. Determine if automation tool provides functions of scrapping or interaction\
    \ with these applications.\n   2. Determine if there is any application that the\
    \ automated process would not be able to interact with (e.g., any website that\
    \ has complex JavaScript that updates its classes too frequently).\n\n**Tip**\n\
    \nYou can see how the `PDD` will be used extensively during design. It’s vital\
    \ to assure that the information it contains is complete.\n\n# Proof of Concept/Prototyping\n\
    \nIn some cases, the `RPA` team may not have experience with the systems or applications\
    \ with which the solution will interact. Or there might be very serious risks,\
    \ such as privacy breach or risks to stability, that are involved. In these cases,\
    \ having a proof of concept or developing a prototype can be highly beneficial.\
    \ It may not even be necessary to create a prototype or proof of concept for the\
    \ entire automation, but only for those parts that are particularly risky. Work\
    \ with your `SMEs` and “risk and compliance” department to determine when this\
    \ might be necessary.\n\n# Solution Design of Automation (What Will the BOT Look\
    \ Like?)\n\nWe recommend using a layered design approach. The following steps\
    \ will guide you:\n\n1. **Controller (process)**: This is the main controller\
    \ that controls the Bot execution. It can be seen as the “supervisor” of other\
    \ tasks within it.\n2. **Task container (business objects)**: This is the “nuts\
    \ and bolts” of the Bot. Here are the various small tasks that will be used repeatedly\
    \ by the Bot to execute the steps required. These steps are executed by the controller.\n\
    3. **Communicator**: Every automated process must issue some kinds of reports\
    \ to show its results. Additionally, if transactions enter the Bot that it doesn’t\
    \ know how to handle, those transactions must be sent to someone for manual handling.\
    \ As suggested by its name, the controller is used for these and other communication\
    \ purposes as may be required.\n\n**Pause and Consider**\n\nWhat are the communication\
    \ needs for the processes you are automating? How much information, if any, does\
    \ senior management need? Where will transactions that cannot be handled by the\
    \ Bot be sent? What record of them will be kept, and where will it be sent, stored,\
    \ etc.? How often will a report of the process execution be created, and where\
    \ will it be sent, stored, etc.?\n\nLet’s prepare the solution design document\
    \ (`SDD`).\n\nHemant Joshi, CEI and Managing Director of eGleis Technologies,\
    \ detailed what a `SDD` is.^([^(14)](#fn14))\n\nTo summarize, a solution design\
    \ document is a document that describes at a high level the design and the optimal\
    \ way of implementing a technical solution to your project. It is created for\
    \ every business process that is automated using `RPA` technology. This document\
    \ is created by the `RPA` developer who will automate the business process, with\
    \ input from the `RPA` solution architect who will review it before handover to\
    \ `RPA` operations. It comes under the design phase of the `RPA` development life\
    \ cycle.\n\nA typical and effective solution design document (`SDD`) contains\
    \ the following components (see Appendix 8 for a template):\n\n- **High-level\
    \ design**: This will include an automation flow diagram and an infra architecture\
    \ diagram.\n- **Information security**: What are the compliance requirements?\
    \ This can be obtained from the process design document (`PDD`).\n- **Prerequisites\
    \ to automation execution**: Consider hardware, software, licenses, etc.\n- **Exception\
    \ handling**: What will be done with transactions that enter the process, but\
    \ cannot be handled by it? Every process has some “exceptions to the rule,” and\
    \ you must determine explicitly how these will be handled.\n- **Debugging tips**:\
    \ What suggestions can you include to help developers in the future to resolve\
    \ problems? Remember, the developer who initially develops the automation may\
    \ not be available if problems arise with it at some future date.\n- **Success\
    \ criteria**: Lastly, document what needs to happen for the automation to be successful.\n\
    \n**Tip**\n\nWhile each automation will be different, keep in mind that there\
    \ may be reusable components. This will add to the efficiency of the entire `RPA`\
    \ initiative.\n\nWriting a best-fit solution design document (which is sometimes\
    \ referred to as a solution architect document) for any `RPA` solution is the\
    \ most critical piece in the `RPA` development process.\n\n**Tip**\n\nAssuring\
    \ a complete and thorough `PDD` (process design document) will greatly assist\
    \ in the creation of a good `SDD` (solution design document).\n\nThe following\
    \ are the major points to keep in mind in the process of writing a good `RPA`\
    \ solution design document."
