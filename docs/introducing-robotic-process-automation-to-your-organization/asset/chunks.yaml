  trans: '

    # 12. 总结


    恭喜！你现在不仅对 RPA 及其对组织的意义有了基本了解，还掌握了启动项目并确保其成功所需的细节。


    总结一下，首先，什么是机器人流程自动化（RPA）？它其实就是将重复性的手动流程自动化。每个组织都有这样的流程。也许是一家为其产品开具账单的制造公司。销售人员销售商品并将订单输入系统。文员根据序列号或其他识别号查找商品的名称和价格，查找客户的姓名和地址，打印发票，将其放入信封，然后放进发件箱。接着他们处理下一个订单，日复一日地重复同一流程。一个“机器人”可以完成这些工作：读取订单，查找客户的姓名和地址，在空白发票上填写字段，并将其发送给可能配备了折叠发票并装入信封功能的打印机。然后，每天一两次，邮件收发室的人可以取走发票并寄出。负责这些繁琐任务的文员们就可以解放出来，去处理其他真正需要动脑筋的工作。第
    1 章让您对 RPA 有了出色的理解。


    如果您已确定需要将组织内的流程自动化，那么您将如何获得高级管理层和一线员工的认同？如果一切进展顺利，高级管理层可能不想改变。而一线员工可能担心自己的工作安全（如果自动化的目标之一是减少人员数量，这可能是真正值得担忧的问题）。通过阅读第
    2 章，您现在知道如何解决这些问题了。


    RPA 项目的治理应该是什么样子？应该如何构建？应该涉及哪些角色？谁应该赞助该项目？赞助人的职责是什么？项目将在什么样的总体框架下运作？它必须是有结构的，但同时也要足够灵活，以适应不断变化的需求。这该如何实现？正如您阅读第
    3 章时所了解到的，您已经找到了这些问题的答案。


    一旦获得中高层管理人员的批准，并确定了一些早期采用者之后，您如何寻找适合自动化的流程？哪些关键要素可能使某个手动流程成为自动化的良好候选？正如您在第 4 章中所学到的，那些基本上以相同方式重复执行的手动流程，应该被评估是否适合自动化。


    您如何征集可能实现自动化的流程？一旦 RPA 项目的消息在组织内公开，可能会引起很多人的兴趣。这非常好，但必须有一个有序的方式来让他们提交请求。每个请求必须包含一些基本信息，以便您进行初步评估。第
    4 章讨论了申请表，附录（附录 1）中提供了模板。请根据贵公司的需求自由调整，但要尽量保持简单。您不希望人们因此感到畏惧。


    当某个手动流程被确定为可能适合自动化的候选流程时，您需要判断它是否确实适合。您需要确定该流程的变异程度，以了解它是否能够由“机器人”处理。如何做到这一点？您还需要估算在时间上将节省多少成本（我们都知道，时间就是金钱）。确定这一点后，您需要估算自动化的成本，以便计算投资回报率（ROI）。除了
    ROI 之外，还有其他考虑因素吗？如果您的竞争对手比贵公司更快地将产品推向市场，而管理层发现你们的一些客户正转向竞争对手，那该怎么办？即使自动化节省的资金可能微乎其微，您如何评估为了更具竞争力而将部分流程自动化是否值得付出这些成本？第
    5 章为您提供了做出这些决策所需的工具。它也有助于理解，尽管初步评估可能表明该流程绝对值得自动化（自动化成本将节省资金：ROI 良好等），但随着您推进单个自动化项目的生命周期，将会发现更多信息。其中一些信息可能表明自动化成本将远高于初步估计，或者节省的成本将更低。此时，必须做出是否继续项目或止损取消项目的决定（这是赞助人发挥作用的一个领域）。这样做并非失败；我们的
    RPA 项目设计用于通过增量步骤和相应的里程碑来评估每个阶段的信息和工作完成情况。在*机会评估*阶段可能已经完成了出色的工作，但随着开发人员和其他人进行*解决方案设计*（第
    6 章），他们将发现更多信息，其中一些可能表明开发中存在未预料到的费用，或者节省的成本低于最初估计。现在发现这些信息，比在整个项目上花费巨额成本、超出预算，然后才发现解决方案未能按预期交付要好得多。


    如果在获得指导委员会批准进入下一步骤后，您在新步骤中发现复杂性比最初想象的要高，或者节省的成本将远低于预期，该怎么办？您从第 5 章中了解到，这仅仅表明 RPA
    项目正在按预期方式运作。它是增量式的：您获取一些初步信息，然后决定是否进入下一步。如果做出决定，您将获得更多信息，然后再次就推进做出决策。在任何时候，您都可能了解到一些会降低完成项目可行性的信息。这没关系；这种情况时有发生，并非失败。在项目中进行一小段距离后了解到某些初始假设不准确，远胜于花费时间和精力完成整个项目，却在最后才得知预期的收益无法实现，或者创建解决方案的成本远超该解决方案所能节省的成本。


    解决方案设计中需要哪些角色参与？他们将承担哪些具体职责？第 6 章讨论了以下角色及其相应职责：


    *   RPA 技术交付负责人

    *   架构师

    *   开发人员


    正如该章所讨论的，根据您组织的不同情况，可能还需要其他角色。关于如何确定是否存在这些角色以及他们的职责是什么的提示，文中均提供了详细说明。

    '
- fmt: "Once you have your team established, and have identified some good candidates\
    \ for automation, and designed the new Bot, you need to deploy it. There are many\
    \ components to Bot deployment that may differ from the way you generally deploy\
    \ new software. Chapter [7](#513218_1_En_7_Chapter.xhtml) details this information\
    \ for you.\n\nIn Chapter [3](#513218_1_En_3_Chapter.xhtml), we introduced the\
    \ centralized, decentralized, and hub-and-spoke models. In Chapter [8](#513218_1_En_8_Chapter.xhtml),\
    \ we detail these models, with key information on their advantages and disadvantages\
    \ to assist you in selecting the one most appropriate for your organization.\n\
    \nToday, there are many development methodologies: Waterfall, Agile, hybrids of\
    \ those, Lean, DevOps, and others. All of them can be used effectively with an\
    \ RPA program. There are some commonalities and some differences depending on\
    \ methodology, and Chapter [9](#513218_1_En_9_Chapter.xhtml) provides the detail\
    \ required to assist you in deciding which methodology is best or, if one is mandated\
    \ in your organization, how best to incorporate RPA within it. This chapter also\
    \ helps you understand some of the roadblocks you will encounter, in situations\
    \ where you may need to work to successfully interact with a business unit that\
    \ is using and familiar with a different methodology than you have chosen for\
    \ RPA.\n\nOne of the advantages of RPA is its scalability; as things change within\
    \ your organization (e.g., new applications introduced; company grows), RPA can\
    \ change right along with it. David Chappell, in his article, \"Understanding\
    \ RPA Scalability: The Blue Prism Example,\" describes RPA scalability this way:\n\
    \n> \"What is RPA scalability? One way to think about it is to focus on three\
    \ aspects:\n> \n> *   Handling increased load. This includes support for large\
    \ numbers of RPA robots working together to carry out many instances of a business\
    \ process. It also includes a way to easily change which business process each\
    \ of your robots is executing, letting them work on different processes at different\
    \ times.\n> *   Expanding the scope of usage. This aspect of scalability means\
    \ support for broadening how and where RPA is used in an organization. You might\
    \ start by automating a process in one part of your business, for example, then\
    \ expand by creating RPA solutions for processes in other business units.\n> *\
    \   Increasing the breadth of access. Automated business processes often need\
    \ to access new technologies, such as new applications or integration technologies.\
    \ Your processes might also themselves need to be accessed by other software.\
    \ These kinds of expanded access can be viewed through the lens of scalability,\
    \ because both let your RPA solutions be used more broadly.\"^([^(39)](#fn39))\n\
    \nNo methodology or technology remains the same over time; it either evolves or\
    \ disappears from the scene, replaced by something better. RPA is no exception.\
    \ In Chapter [10](#513218_1_En_10_Chapter.xhtml), we discuss the latest trends\
    \ you need to be aware of as you introduce RPA to your program. You will probably\
    \ start with the basics of RPA, but Chapter [10](#513218_1_En_10_Chapter.xhtml)\
    \ presents you with a clear idea of where you can take the program in the future\
    \ and how it may benefit your specific organization.\n\nThe introduction of any\
    \ new methodology always has risks. In Chapter [11](#513218_1_En_11_Chapter.xhtml),\
    \ we explain areas that we encountered that caused us to pivot from the road we\
    \ thought we needed to take to one that was smoother and more effective. Things\
    \ we thought were quite straightforward still caused some people to question the\
    \ validity of RPA. This chapter, of course, doesn't list every challenge you may\
    \ encounter, but by following its guidance, you will avoid some of the headaches\
    \ we suffered through. Following the information in the entire book should prevent\
    \ a few of your own headaches!\n\nFinally, the book concludes with a detailed\
    \ Appendix. Here you can find templates for all the forms described in earlier\
    \ chapters, with complete instructions on how and when to use them, and how to\
    \ complete them. You learned, of course, that these are excellent starting points\
    \ for any new RPA initiative, but time and experience will help you to know if\
    \ and how they should be tailored to suit the needs of your particular organization.\
    \ We recommend, however, that you initially use them as presented herein.\n\n\
    To conclude, you now have at your fingertips everything you need to succeed with\
    \ the introduction of a Robotic Process Automation initiative in your organization.\
    \ We wish you every success as you embark on your RPA journey!"
  raw: 'Once you have your team established, and have identified some good candidates
    for automation, and designed the new Bot, you need to deploy it. There are many
    components to Bot deployment that may differ from the way you generally deploy
    new software. Chapter [7](#513218_1_En_7_Chapter.xhtml) details this information
    for you.


    In Chapter [3](#513218_1_En_3_Chapter.xhtml), we introduced the centralized, decentralized,
    and hub-and-spoke models. In Chapter [8](#513218_1_En_8_Chapter.xhtml), we detail
    these models, with key information on their advantages and disadvantages to assist
    you in selecting the one most appropriate for your organization.


    Today, there are many development methodologies: Waterfall, Agile, hybrids of
    those, Lean, DevOps, and others. All of them can be used effectively with an RPA
    program. There are some commonalities and some differences depending on methodology,
    and Chapter [9](#513218_1_En_9_Chapter.xhtml) provides the detail required to
    assist you in deciding which methodology is best or, if one is mandated in your
    organization, how best to incorporate RPA within it. This chapter also helps you
    understand some of the roadblocks you will encounter, in situations where you
    may need to work to successfully interact with a business unit that is using and
    familiar with a different methodology than you have chosen for RPA.


    One of the advantages of RPA is its scalability; as things change within your
    organization (e.g., new applications introduced; company grows), RPA can change
    right along with it. David Chappell, in his article, “Understanding RPA Scalability:
    The Blue Prism Example,” describes RPA scalability this way:


    “What is RPA scalability? One way to think about it is to focus on three aspects:


    *   *Handling increased load. This includes support for large numbers of RPA robots
    working together to carry out many instances of a business process. It also includes
    a way to easily change which business process each of your robots is executing,
    letting them work on different processes at different times.*


    *   *Expanding the scope of usage. This aspect of scalability means support for
    broadening how and where RPA is used in an organization. You might start by automating
    a process in one part of your business, for example, then expand by creating RPA
    solutions for processes in other business units*.


    *   *Increasing the breadth of access. Automated business processes often need
    to access new technologies, such as new applications or integration technologies.
    Your processes might also themselves need to be accessed by other software. These
    kinds of expanded access can be viewed through the lens of scalability, because
    both let your RPA solutions be used more broadly*.”^([^(39)](#fn39))


    No methodology or technology remains the same over time; it either evolves or
    disappears from the scene, replaced by something better. RPA is no exception.
    In Chapter [10](#513218_1_En_10_Chapter.xhtml), we discuss the latest trends you
    need to be aware of as you introduce RPA to your program. You will probably start
    with the basics of RPA, but Chapter [10](#513218_1_En_10_Chapter.xhtml) presents
    you with a clear idea of where you can take the program in the future and how
    it may benefit your specific organization.


    The introduction of any new methodology always has risks. In Chapter [11](#513218_1_En_11_Chapter.xhtml),
    we explain areas that we encountered that caused us to pivot from the road we
    thought we needed to take to one that was smoother and more effective. Things
    we thought were quite straightforward still caused some people to question the
    validity of RPA. This chapter, of course, doesn’t list every challenge you may
    encounter, but by following its guidance, you will avoid some of the headaches
    we suffered through. Following the information in the entire book should prevent
    a few of your own headaches!


    Finally, the book concludes with a detailed Appendix. Here you can find templates
    for all the forms described in earlier chapters, with complete instructions on
    how and when to use them, and how to complete them. You learned, of course, that
    these are excellent starting points for any new RPA initiative, but time and experience
    will help you to know if and how they should be tailored to suit the needs of
    your particular organization. We recommend, however, that you initially use them
    as presented herein.


    To conclude, you now have at your fingertips everything you need to succeed with
    the introduction of a Robotic Process Automation initiative in your organization.
    We wish you every success as you embark on your RPA journey!'
  trans: '

    一旦团队组建完毕，并确定了合适的自动化候选项目、设计好新的机器人后，就需要进行部署。机器人部署的许多组件可能与您通常部署新软件的方式有所不同。第 7 章将为您详细介绍这些信息。


    在第 3 章中，我们介绍了集中式、分散式和中心辐射式模型。在第 8 章中，我们将详细阐述这些模型，并附上其优缺点的关键信息，以帮助您选择最适合组织的模型。


    当今存在许多开发方法论：瀑布模型、敏捷开发、两者的混合体、精益开发、DevOps 等。所有这些方法论都可有效地应用于 RPA 项目中。不同方法论之间存在一些共性和差异，第
    9 章提供了必要的详细信息，帮助您决定哪种方法论最佳，或者，如果组织已强制规定了某种方法论，如何在其框架内最佳地融入 RPA。本章还帮助您了解在此过程中可能遇到的一些障碍，例如，当您需要与某个业务部门成功协作时，该部门所使用和熟悉的方法论可能与您为
    RPA 选择的方法论不同。


    RPA 的优势之一在于其可扩展性；随着组织内部的变化（例如，引入新应用；公司规模扩大），RPA 可以随之改变。David Chappell 在其文章《理解
    RPA 可扩展性：以 Blue Prism 为例》中这样描述 RPA 的可扩展性：


    > "什么是 RPA 可扩展性？一种思考方式是关注以下三个方面：

    >

    > *   **处理增加的负载。** 这包括支持大量 RPA 机器人协同工作，以执行多个业务流程实例。它还包括一种可以轻松更改每个机器人正在执行的业务流程的方式，使它们能够在不同时间处理不同的流程。

    > *   **扩大使用范围。** 可扩展性的这一方面意味着支持拓宽 RPA 在组织中的使用方式和场所。例如，您可能从自动化某个业务部门的一个流程开始，然后通过为其他业务部门的流程创建
    RPA 解决方案来扩展。

    > *   **增加访问广度。** 自动化业务流程通常需要访问新技术，例如新应用程序或集成技术。您的流程本身也可能需要被其他软件访问。这些类型的扩展访问可以通过可扩展性的视角来看待，因为它们都能让您的
    RPA 解决方案得到更广泛的应用。"^(³⁹)


    没有哪种方法论或技术会一成不变；它们要么不断演进，要么从舞台上消失，被更好的方案所取代。RPA 也不例外。在第 10 章中，我们将讨论在将 RPA 引入项目时需要注意的最新趋势。您可能会从
    RPA 的基础知识开始，但第 10 章会为您清晰地展示未来项目的发展方向，以及它可能如何为您的特定组织带来益处。


    任何新方法论的引入都伴随着风险。在第 11 章中，我们将解释我们曾遇到的一些情况，这些情况导致我们调整原本认为需要走的道路，转而选择一条更顺畅、更有效的道路。我们曾认为非常直接的事情，仍然让一些人对
    RPA 的有效性产生质疑。当然，本章并未列出您可能遇到的所有挑战，但遵循其指导，您将能避免我们曾经历的一些令人头疼的问题。遵循整本书中的信息，应该能让您少一些烦恼！


    最后，本书以一个详细的附录作为结尾。您可以在此找到前几章中描述的所有表单的模板，以及关于如何使用、何时使用以及如何填写它们的完整说明。当然，您已经了解到这些模板是任何新
    RPA 计划绝佳的起点，但时间和经验将帮助您了解是否需要以及如何对它们进行定制，以满足您特定组织的需求。不过，我们建议您初始时按照本书提供的模板直接使用。


    总而言之，您现在已掌握在组织中成功引入机器人流程自动化计划所需的一切。祝您在踏上 RPA 之旅时一切顺利！

    '
