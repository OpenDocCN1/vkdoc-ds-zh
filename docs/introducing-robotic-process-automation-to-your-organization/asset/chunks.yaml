  trans: "\n# 面向早期采用者\n\n对于早期采用者（愿意几乎立即开始使用 RPA 的人），请首先考虑你身边可能对此感兴趣的同行。谁在管理那些充斥着重复性、手动流程的领域？谁因为员工必须执行重复性手动流程而缺乏与客户打交道的时间而感到沮丧？识别这些人将是您成功的关键。\n\
    \n与同行进行非正式交谈有助于你了解谁可能最感兴趣。一旦你确定了几个人选，就直接说明来意。向他们解释你正在考虑向高级管理层提议引入 RPA。提出以下问题：\n\
    \n*   你负责的流程中，有哪些是重复性、手动的，可能适合自动化？\n*   你是否愿意用你的一个流程来试点 RPA？\n*   你的团队会如何看待 RPA？是担心裁员，还是渴望减少在这些手动流程上花费的时间，将更多精力投入到“启发性任务”（需要真正思考的任务，而不仅仅是执行那些机械重复的工作）上？\n\
    *   他们尝试自动化流程的可行时间范围是什么？\n\n## 暂停与思考\n\n现阶段，你究竟将如何推进 RPA 的实施尚不可知，但你仍然需要有一个清晰的策略。人们会对不确定性感到不安，并倾向于固守已知和熟悉的事物。你将如何阐述一个并非步步具体、但又能勾勒出整体计划的策略呢？\n\
    \n> **提示：** 虽然此时你不需要一群中层管理者的支持，但获取至少几个人的支持将能加强你面向高级管理层的论据。\n\n整理你收集到的信息。如果你对获得中层管理层的必要支持没有信心，那就不要继续推进！继续努力建立这种支持，但在没有获得积极支持的情况下贸然前进只会导致失败。\n\
    \n假设你获得了足够数量中层管理者的支持（具体数量因公司规模而异），请为高级管理层准备一份简短的演示文稿。它应包含以下信息：\n\n*   RPA 概述\n\
    \    *   它是什么\n*   行业内 RPA 成功案例回顾\n*   行业内 RPA 面临的挑战回顾\n    *   讨论你预计如何克服这些挑战\n\
    *   愿意试点该项目的管理者名单\n    *   潜在的可自动化流程列表\n\n## 暂停与思考\n\n向高级管理层提供多少信息才算恰当？请记住，高级管理层成员不需要所有细节信息来做决策。他们需要在宏观层面理解你想做什么、你将如何做、以及这对他们有何影响。在准备和进行演示时请牢记这些要点。创建演示文稿后，要愿意对其进行修改，删除中层管理可能需要、但高级管理层不需要的细节。\n\
    \n准备好回答问题，但如果对方问到你需要进一步研究的问题，也要大方承认。然而，如果你的演示保持在适当的层面（参见“暂停与思考”），问题应该会很少。但如果确实有问题，请找到答案并尽快通过电子邮件发送给高级管理层团队。如果在寻找答案过程中，你之前的某些假设或信息有所改变，务必传达这些更新。\n\
    \n> **提示：** 如果你目前无法获得支持，那就做更多研究。了解行业内的同行在做什么，了解他们的成功与失败。在未获得必要支持前，不要尝试实施新项目。这样做可能会导致失败。\n\
    \n一旦获得高级管理层的批准——这只会发生在你获得部分中层管理者支持之后——你就准备好可以开始了。\n\n请记住，无论是什么契机促使你在组织中引入 RPA，获得高级管理层和中级管理层的支持至关重要。\n\
    \n## 引入 RPA 的不同契机\n\n在组织中引入 RPA 的原因有多种：可能是因为某位高级管理人员熟悉了该概念并看到了其对组织的潜在优势。也可能是一位中层管理者，应对大量重复性手动流程，认识到自动化将非常有益。或者，一位技术领导者看到了如何利用其技能来提高效率。你将\
    \ RPA 引入组织的方式取决于引入的原因。其总体的益处是相同的：提高先前手动执行任务的自动化水平。但成功引入 RPA 需要你知道如何最好地呈现它，而了解引入原因是决定如何开始的关键。\n\
    \n一旦你做到了这一点，就可以准备进入下一步了。\n\n### 技术领导者认识到 RPA 的价值\n\n将采用与第 2 点相同的步骤：寻找早期采用者，识别潜在项目，并向高级管理层进行有说服力的演示。然而，这可能更具挑战性。高级管理层成员通常更关注业务而非技术，可能将此视为技术人员兴奋的“某个酷炫的新东西”。你需要确保突出强调对业务的好处。\n\
    \n> **提示：** 在第 4 章中，我们介绍了一个案例研究，并在此章及后续章节中演示 RPA 的每个阶段如何应用于该案例。在与高级和中级管理层合作时，你可能会发现回顾该案例研究很有帮助。\n"
- fmt: "# 3. Operating Model – Governance, Sponsorship, and Framework\n\nGovernance,\
    \ sponsorship, and framework will be major factors in success. We will describe\
    \ what roles within a typical organization should be involved and what their responsibilities\
    \ will be.\n\nJames Chen, writing in *Investopedia*, describes **governance**\
    \ in this way: “Corporate governance is the [`system of rules, practices, and\
    \ processes`](https://www.investopedia.com/terms/m/mckinsey-7s-model.asp) by which\
    \ a firm is directed and controlled. Corporate governance essentially involves\
    \ balancing the interests of a company’s many [stakeholders](https://www.investopedia.com/terms/s/stakeholder.asp),\
    \ such as shareholders, senior management executives, customers, suppliers, financiers,\
    \ the government, and the community.”^([²](#fn2)) For RPA, governance is not quite\
    \ that wide ranging, and we will describe what it needs to accomplish for RPA\
    \ success.\n\nThe website Project Smart describes **project sponsorship** this\
    \ way: “Project sponsorship is an active senior management role, responsible for\
    \ identifying the business need, problem or opportunity. The sponsor ensures the\
    \ project remains a viable proposition and that benefits are realised, resolving\
    \ any issues outside the control of the project manager.”^([³](#fn3)) The sponsor\
    \ is usually the person responsible for the budget of the area where an RPA project\
    \ is requested.\n\n“A **framework** is a loose but incomplete structure which\
    \ leaves room for other practices and tools to be included but provides much of\
    \ the process required.”^([⁴](#fn4))\n\nThe relationship between the three concepts\
    \ is clearly seen. Governance consists of the rules and processes, sponsorship\
    \ is the authority required to ensure their survival and evolution, and they are\
    \ all performed within the framework.\n\n## Pause and Consider\n\nIs there effective\
    \ governance and sponsorship within your organization today? Have you seen either\
    \ or both being effective either in your current company or a previous one? It\
    \ is possible (perhaps even likely) that you have not. Do not underestimate the\
    \ importance of good governance and effective sponsorship when beginning your\
    \ RPA implementation journey. Doing so will doom the project from the start.\n\
    \n## Governance\n\nThe RPA Solution Lifecycle includes the following; bear in\
    \ mind that there may be some differences depending on the individual needs of\
    \ specific organizations.\n\n### Request Form\n\nThis is the basic request that\
    \ can occur in different ways; it could be an informal hallway conversation, followed\
    \ by a meeting to capture required details to move forward with the request, or\
    \ a requestor may have submitted a request form (see Appendix 1) which provides\
    \ all the required information.\n\nThe information on the request form represents\
    \ the first look at the opportunity, and consequently, there is much unknown information\
    \ at this point.\n\nTypically, at this point, the following information is captured:\n\
    \n- High-level description of the process\n- Impacted business areas (upstream\
    \ and downstream processes) and systems or tools\n- Business drivers and criticality\n\
    - Estimation of savings (FTE hours, etc.) and benefits (improved quality, improved\
    \ service, etc.)\n- Opportunity identification (detailed in Chapter 4)\n\n> **Tip**\
    \  \n> While initial requests may be in the form of emails, or even informal hallway\
    \ conversations, standardizing the request form and encouraging its use will be\
    \ highly beneficial.\n\nThere may, however, be situations where information provided\
    \ on the request form is sufficient to conclude that automation is not feasible\
    \ under current circumstances, possibly because of the process complexity, RPA-limited\
    \ capability, or even the potentially short life span of the solution. The requestor\
    \ should be advised of this and given any possible recommendations to assist in\
    \ overcoming whatever issues were to be solved by automation.\n\nOnce an initial\
    \ request has been submitted that didn’t raise any feasibility concerns, it is\
    \ ready to move to the next step.\n\n> **Tip**  \n> Remember, this is the initial\
    \ look at the request; not a lot of detail is yet available. If no feasibility\
    \ concerns are raised here, and the request is given approval to proceed, that\
    \ does not mean that such concerns may not be uncovered in future phases, causing\
    \ cancellation of the project. If that happens, it must not be considered a failure.\
    \ It means that the iterative process has worked as it should.\n\n### Process\
    \ Discovery\n\nAt this stage, the referred opportunity is assessed in detail to\
    \ capture the following:\n\n- End-to-end (E2E) process steps\n- Roles and users\
    \ involved in the process\n- List of systems and tools used\n- Volumes (hourly,\
    \ daily, weekly, etc.)\n- Process time for each step and other process performance\
    \ metrics that would help accurately estimate savings and benefits\n- Process\
    \ constraints\n- Proposed process steps to be automated\n- Any other information\
    \ that was triggered by the request form\n\nAll this information is required to\
    \ move to the next step, opportunity assessment, which will estimate RPA value\
    \ and RPA feasibility as a solution.\n\n### Opportunity Assessment (detailed in\
    \ Chapter 5)\n\nSeveral things are accomplished in this phase:\n\n1. **Understand\
    \ the current process flow**  \n   The process flow was examined at a high level\
    \ during Opportunity Identification. Now it is detailed, and the inputs, activities,\
    \ outputs, and roles responsible are documented.\n\n2. **Impact analysis**  \n\
    \   Why should this be done? During intake, some initial estimates may have been\
    \ made regarding time saved, compliance adhered to, etc. Now these are studied\
    \ for more accuracy.\n   - What is the investment of time and resources to create\
    \ a Bot to automate the process? Is the ROI (return on investment) sufficient\
    \ to justify the expenditure? While this is a decision for the steering committee\
    \ to make, the RPA team will make a recommendation.\n\n3. **Suitability analysis**\
    \  \n   Here we must evaluate if the requested process is a good candidate for\
    \ automation. Is it sufficiently repetitive? Are there few decisions that need\
    \ to be made that can be referred for manual handling? These and other questions\
    \ will be answered to determine suitability.\n\n4. **Risk analysis**  \n   What\
    \ are the risks involved in automating the process? What are the risks involved\
    \ in *not* automating it?\n\n### Solution Feasibility Decision Process\n\nAll\
    \ compiled information is presented to the decision-makers to evaluate and to\
    \ ensure that the RPA solution will bring sufficient ROI, and expected benefits\
    \ are aligned with the enterprise-wide strategy.\n\nAfter the decision is made\
    \ to proceed with RPA solution development, the opportunity moves to the solution\
    \ design phase.\n\n### Solution Design Phase (detailed in Chapter 6)\n\n1. Plan\
    \  \n2. Build  \n3. Test  \n\nEach phase is performed according to company standards,\
    \ using `Waterfall` methodology, `Agile`, or whatever other methodology is generally\
    \ used.\n\nAfter successful testing, and passing business acceptance, the RPA\
    \ solution is released to production entering operational phase.\n\n### Solution\
    \ Retirement\n\n1. Sunset (end-of-life) strategies or plan\n\n### Solution Deployment\
    \ and Maintenance Phase (detailed in Chapter 7)\n\n1. Release  \n2. Operate  \n\
    3. Monitor  \n\nThe information provided previously is shown in process-flow format\
    \ in Figure 3-1.\n\n![../images/513218_1_En_3_Chapter/513218_1_En_3_Fig1_HTML.png](images/513218_1_En_3_Chapter/513218_1_En_3_Fig1_HTML.png)\n\
    \n**Figure 3-1** RPA Solution Lifecycle\n\nThe components of effective governance\
    \ may seem complex, but the need for this structure has been demonstrated time\
    \ and again. Identifying and assessing the opportunities, and having repeatable\
    \ processes and tools for doing so, will go a long way to ensuring the success\
    \ of your new RPA initiative."
