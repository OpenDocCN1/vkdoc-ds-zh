- fmt: '# 6. Solution Design


    During conceptual design, requirements (functional and nonfunctional) are gathered.
    Templates are provided in the Appendix, and clear explanations are detailed in
    this chapter.


    Conceptual design can be seen as the solution blueprint. A high-level determination
    will be made of the automation solution to include what the Bot will do, the systems
    it must access, the schedule on which it must run, etc. This will be further detailed,
    but in this phase, the basics will be determined.


    Also during this phase, a solution design document is created. This document includes
    process and outcome, overall structure, logical components and interrelationships
    of both the current and possible future states. We provide a template, with a
    clear explanation (please see Appendix 12).


    RPA can be introduced with either a conventional “Waterfall” approach or with
    a more Agile methodology. In the “Waterfall” approach, requirements and conceptual
    solution design are created and documented before development begins. More and
    more companies are adopting an Agile or concurrent engineering approach, where
    requirements and solution development activities are ongoing in parallel. Each
    of these approaches has pros and cons, and some organizations adapt them to a
    hybrid approach.


    Regardless of the methodology selected, the tasks described within this chapter
    must be completed.


    Once conceptual design is finished, a readiness checklist must be completed. This
    assures that all the components required for development (the next stage) are
    complete. A template with a detailed explanation is included.


    Once the readiness checklist is completed, it is forwarded to the governing body
    for a decision on whether or not to move to the next phase, development. The governing
    body generally consists of the following roles:


    *   RPA technical delivery lead

    *   Architect

    *   Developers

    *   Others as deemed necessary


    ### Pause and Consider


    Names of roles differ from company to company. What are the coinciding roles within
    your organization? Also, consider what “others as deemed necessary” might be in
    your company. This could be a director, area manager, system analyst, or others.
    The governing body should be small, but should have the right people to decide
    whether or not to move to the next phase.


    Please note that one of the advantages of this model is that work is done gradually,
    and there are very specific checkpoints for the governing body (decision-making
    body) to review the work and determine the continued feasibility of any project.
    A request that, during opportunity assessment, when only preliminary information
    is gathered, may seem promising in terms of ROI, competitive advantage, or any
    other factor may seem less so upon the deeper investigation done during conceptual
    design. This is true as the project moves from any phase to the next one. At any
    point, the governing body may decide that earlier evaluations have not proven
    true upon closer scrutiny and cancel the project. A project once given the go
    ahead in one phase, and later cancelled, does not indicate a failure in the earlier
    phase. This is the nature of RPA project progress.


    ### Pause and Consider


    In many companies, projects often continue even when stakeholders know they are
    no longer needed. Cancelling a project is seen as a waste of the money already
    spent and the failure of various decision-makers. How will you convince management
    that using this model of periodic evaluation of a project is beneficial?


    In RPA, the requirements document is generally referred to as the Process Design
    Document (PDD). This is described in the section, ‘Governing Body Approval’, below.
    If your organization is good with requirements gathering and documentation, continue
    to use that process; details of a typical requirements document follow.


    But if the process of gathering requirements in your organization does not exist
    or is not efficient, and you need to capture requirements for RPA only, then PDD
    is the preferred way of gathering and documenting requirements. See the section,
    Governing Body Approval, of this chapter for that information.'
