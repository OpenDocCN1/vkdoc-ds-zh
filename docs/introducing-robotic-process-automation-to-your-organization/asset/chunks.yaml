- fmt: "**Pause and Consider** What potential “land mines” can you foresee in your\
    \ organization? Who are the people who are particularly protective of their areas?\
    \ How would you approach them if you are aware of process opportunities in their\
    \ areas?\n\n- **Governance board meetings.** Initially, we submitted the document\
    \ package with the intake form, business case, risk assessment, and other documents\
    \ several days prior to the meeting to the governing board members. They and the\
    \ requestor(s) were invited to the weekly meeting to review the request.\n\nWe\
    \ found that, generally, no one read any of the documentation prior to the meeting.\
    \ Therefore, instead of sending out detailed information in advance, we summarized\
    \ the information into a page or two which we presented at the meeting. We stopped\
    \ sending the detailed documentation, but maintained it for our records and just\
    \ provided a high-level overview of the request at the start of the meeting. This\
    \ overview consisted of the following:\n    - A brief description of the request\
    \ (e.g., automate process XYZ which currently takes three people two days every\
    \ week to accomplish).\n    - A review of the savings (e.g., this will free up\
    \ 2,250 hours per year [3 people times 15 hours per week times 50 weeks per year]).\
    \ Multiply this by your company’s hourly rate.\n    - An evaluation of the complexity\
    \ of automating the process (e.g., high, medium, low).\n    - An estimate of how\
    \ long development will take (e.g., three weeks).\n\nThe architect who worked\
    \ on the initial estimates should be present to answer questions.\n\n**Pause and\
    \ Consider**\n\nUnfortunately, people often don’t read required information before\
    \ meetings. What is your experience in your organization? Do decision-makers come\
    \ prepared? If not, how do you usually reach decisions in meetings? How will you\
    \ prepare decision-makers for RPA governance meetings?\n\n- **Inviting the requestor\
    \ to the governance board meetings.** We initially thought there was an advantage\
    \ to this, in that the requestor could answer some questions about the request\
    \ that the governing board members might have. But those questions were able to\
    \ be answered by the business process analyst or the architect, and if the request\
    \ was not approved to move forward, it didn’t provide anyone with the opportunity\
    \ for tactfully explaining this to the requestor. Now if a request is turned down\
    \ by the governing board, the requestor will receive an email similar to the following:\n\
    \    - “Hello (name),\n\nThank you for your recent request to have process ABC\
    \ automated. We have reviewed your request and evaluated the costs of automation,\
    \ savings to be accrued, urgency of need, and other factors. At this time, there\
    \ are higher-priority requests that we must focus on. Therefore, your request\
    \ will be placed on hold to be periodically re-evaluated.\n\nIf you are aware\
    \ of other processes that could possibly be automated with this one, please advise\
    \ us.\n\nIf you have any questions about this, please contact me.\n\nSincerely,\n\
    \n(Name)\n\n(Title)”\n\nIn the governing board meeting, the discussion is generally\
    \ more direct, with board members possibly saying the process isn’t worth automating.\
    \ This discourages the requestor from submitting other requests and casts a negative\
    \ shadow on RPA.\n\nSometimes a process isn’t right for automation, but there\
    \ may be other areas of the company that could provide some assistance. In those\
    \ cases, that information should be included in the email to the requestor, and\
    \ the RPA team should engage that other area and refer the request to it. No further\
    \ work, except for the periodic re-evaluation of all projects on hold, is required\
    \ for this particular request.\n\n**Pause and Consider**\n\nHow would you best\
    \ advise a business process owner who requested automation of a process that that\
    \ request was denied? Remember, you don’t want to leave them with the impression\
    \ that their request itself was not valid, only that the numbers didn’t work well\
    \ enough to proceed.\n\n- **Not obtaining sufficient information early on.** Sometimes,\
    \ even when we worked with the requestors in completing the request form, there\
    \ was information missing. We adapted the form going forward and eliminated that\
    \ issue, but be aware that the requestor may not have all the necessary information.\
    \ That is why it is vital to meet with subject matter experts, the people who\
    \ know how the process actually works, not how the documentation about it says\
    \ it should work. There is often a significant disconnect between the two.\n\n\
    **Tip** Remember, the templates are made to be tailored to your specific needs.\
    \ You may want to use them “as is” initially and see what works and what doesn’t\
    \ work for your organization.\n\n- **Not adequately addressing concerns about\
    \ job loss due to automation.** Sometimes this could be a real fear; management\
    \ may see headcount savings as an advantage to automation. No one wants to assist\
    \ someone in causing them to lose their own job.\n\n**Pause and Consider** It’s\
    \ possible that the goal of any particular automation may be to reduce headcount.\
    \ How will you deal with this? How will you get assistance and information about\
    \ a process from people who may be fully aware that by automating the work they\
    \ do, they will be out of a job? What assistance and support can you get from\
    \ your HR organization or senior managers?\n\n- **Trusting existing (old) documentation.**\
    \ When a new process is introduced, there is often accompanying documentation.\
    \ This documentation explains the purpose of the process and, more importantly,\
    \ how the process is supposed to work. However, there is often a major disconnect\
    \ between how the process is *supposed* to work and how it *actually* works in\
    \ day-to-day practice. Sometimes when a request for automation is received, that\
    \ documentation will be provided. But it is vitally important to map the process\
    \ with the SMEs, the people who are actually doing it. A process may work very\
    \ differently from the way it is supposed to work, and the longer the process\
    \ exists, the farther it may be from what was initially documented. Be sure to\
    \ map the process *as it is actually performed today*.\n\n**Tip** Process mapping\
    \ with the SMEs will assure that you understand the way the process actually works.\
    \ Do not rely on any existing documentation.\n\n- **Selecting the wrong tool.**\
    \ There are many things to consider when selecting your RPA tool, including how\
    \ much programming it requires to meet your needs, how scalable it is, what is\
    \ its record of changes and promptness in providing updated features, and how\
    \ much maintenance does it require? And a big one for management, what is the\
    \ cost? Just because a tool is expensive doesn’t mean it’s the best. Do your research:\
    \ look online, talk to industry peers, and review journals to find out what RPA\
    \ tools would work best for you. Remember, a tool that is ideal for one organization\
    \ isn’t necessarily the best one for every organization. Do your homework and\
    \ avoid this pitfall.\n\n- **Overconfidence of the business.** Once the Bot is\
    \ up and running, there is always the risk that it will fail at some point. In\
    \ that event, there must be personnel ready and sufficiently knowledgeable to\
    \ manually perform the process until the Bot is once again functioning. Generally,\
    \ there are one or two people assigned to handle the exceptions that the Bot can’t\
    \ handle (such as invalid client IDs as indicated in our case study), and they\
    \ are usually the people who would take over in the event that the Bot stops functioning.\
    \ But we found that this sometimes needs to be reiterated to our business partners.\n\
    \nThis is not a comprehensive list of everything that could possibly go wrong.\
    \ You will probably add to it with your own mistakes! But these are some key challenges\
    \ that we either encountered or anticipated, and it’s important that you be aware\
    \ of them."
