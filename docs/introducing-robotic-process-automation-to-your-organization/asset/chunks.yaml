    最后，“决策”也可能是“不通过”。其理由会在“理由”列中说明，而“后续步骤”可能会是“告知客户，当前的投资回报率不足以证明开发成本的合理性。建议客户与（姓名，职务）沟通，了解使用（应用程序名称）以提供一些改进的可能性。”当然，这需要知道是否有其他有用的替代方案。


