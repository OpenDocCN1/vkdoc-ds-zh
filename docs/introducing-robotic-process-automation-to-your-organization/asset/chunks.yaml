- fmt: '5. *Perfection* is probably the most important concept of Lean thinking. It
    requires making continuous process improvement as a core part of your organization’s
    culture. Striving for perfection is done through the repeatable process in which
    any waste is continuously identified and removed. It is a long journey which requires
    persistence and constant effort on all levels, from employees, supporting teams,
    and leaders. As Mark Crawford mentioned: “Lean experts often say that a process
    is not truly lean until it has been through value-stream mapping at least half
    a dozen times.”^([^(28)](#fn28))


    The primary guiding principle of Lean is the identification and elimination of
    waste from the process to maximize customer value. Note the concept of waste could
    be quite broad and would depend on the value delivery processes and environment.
    Let’s draw parallels to the software development domain. For instance, waste could
    be defined as:


    * Extra features that the customer doesn’t use

    * Poorly designed functionality that failed testing and needs to be redone

    * Waiting for requirements or support

    * Partially completed work

    * Task switching, working on multiple development initiatives at the same time

    * Extra processing steps or lines of code

    * Unutilized or underutilized employee knowledge and creativity


    Lean software development can be viewed as the application of the previous concepts
    and principles to the practice of developing software. Thus, the main aim and
    objective of Lean software development is to enhance customer value within budget
    and in the shortest possible delivery time.


    **Pause and Consider**


    Lean was created for manufacturing, but has evolved into a popular methodology
    for software development. How might it work in your organization? What do you
    see as the possible advantages? Do you think senior management might be impressed
    by some of the potential benefits?


    ## Overlap with Agile Methodology


    We would argue that Lean and Agile are two names for the same methodology. Looking
    closely at Agile software development practices, it is not too hard to notice
    close similarities with Lean concepts.


    For instance:


    * Code inspections and built-in quality in Agile support one of the cornerstones
    of what Lean methodology is founded on. The principle is not to push poor-quality
    to downstream processes; it means to find and fix defects early in the process
    flow and not to find them when the whole product is ready to be released.

    * Scrum uses a Lean “pull” principle to balance a workload and to achieve a smooth
    flow through the system. The team pulls stories from the list in each Sprint (iteration)
    based on team capacity and capability.

    * Agile (Scrum), like Lean, focuses on waste elimination by creating processes
    to identify and eliminate waste from the software development cycle.

    * Agile uses Kanban techniques to help manage the development of the product and
    to increase communication between team and stakeholders.

    * Agile rituals like morning standup, planning session, or retrospective session,
    all trace their origins to Lean.


    We observed one team that faced heavy application-support tasks for multiple internal
    customers. The team used the Scrum framework for development of new features and
    solutions, but Kanban was used for tactical ad hoc-based support to fix breaks
    and address issues with their products. The team started with a simple pencil-and-paper
    board to track items on the fly and to track new, incoming requests. In this particular
    situation, there was a need to bring more visibility and workload management to
    the team. With time, the board evolved, bringing more complexity, with the ability
    to track the team’s performance and make it easier to identify and quantify the
    waste, especially in the area of waiting for items to develop and in the area
    of rework. The board was moved from pencil-paper based to a digital format and
    then was split into two different functions, one for the development of new products
    and services and the other to support the existing released solutions. The board
    evolved together with the team’s growing maturity in the Agile methodology.


    There is no doubt that Agile methods and Lean software development go hand in
    hand in creating value for the customer. However, we believe that there are key
    differences between Lean and Agile.


    Agile seems more tactical in nature where much focus is given to the technical
    practices, rituals, and techniques for effective and efficient software development.


    In our opinion, little is said about what enterprise-wide operating framework
    and procedures must be in place to make Agile adoption successful. Therefore,
    to become an Agile enterprise organization, the major changes required must be
    initiated and driven from the top. H. Smits (2007) states that the “experience
    gathered during large scale implementation of Agile concepts in software development
    projects, teaches us that the currently popular Agile software development methods
    (like Scrum) do not scale to program, product and organization level without change.
    The fundamentals for changes to these methods are found in Lean principles….”^([^(29)](#fn29))
    At this point, an organizational strategy becomes the main driving force within
    which Agile processes could operate effectively.


    Instead, Lean is applied from an upper management perspective, with the objective
    of optimizing all aspects of their activities across the entire organization.


    From this viewpoint, Lean could be seen as a top-down approach while Agile is
    bottom up.


    Without the strategic piece, Agile adoption is depressed by the organizational
    forces that are resistant to change. By having Lean introduced from the top down,
    the tension between developers working in an Agile environment and their stakeholders
    due to conflict of practices and principles would ease.


    We believe that the Agile framework does not generally concern itself with the
    surrounding business environment in which the software development is taking place.
    It primarily provides a set of practices designed for use by developers and can
    be viewed as supportive to Lean methodology. Lean principles, on the other hand,
    can be applied to any scope, from the specific practice of developing software
    to the entire organization in which software development is just one small part.^([^(30)](#fn30))


    Poppendieck and Poppendieck (2003, 2006) viewed Lean principles as core truth
    that do not change over time, while software development tools and practices are
    the application of those principles to a particular situation. Those tools and
    practices should be tailored accordingly, depending on the environment, and change
    as a situation evolves. Consequently, they suggest that Lean thinking should be
    viewed as guiding principles to develop and adapt Agile practices.^([^(31)](#fn31))


    Starting down the Lean/Agile road can be difficult. We believe it would be very
    useful to look at developing an adoption or scale-up roadmap for companies to
    trial Lean and Agile practices within their business environment while minimizing
    operational risk. Just keep in mind that by creating a Lean/Agile island in the
    organization would not bring a huge breakthrough. However, it would bring enough
    evidence to learn while scaling up across the organization. Remember, Toyota spent
    30 years to refine their production system; it is a journey that would require
    persistence and lots of effort.


    **Pause and Consider**


    There is a lot to consider between Agile and Lean and a lot of crossover. How
    do you think either would fit in your organization? Who in your organization could
    you talk to about Agile and Lean principles, to get additional input?'
