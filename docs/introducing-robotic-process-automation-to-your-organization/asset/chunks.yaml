    project to the next phase, the business owner will be advised of this decision
    and the reasons for it. If, during discussions with the team, any other possible
    solution was identified (e.g., a new software tool, a significant improvement
    to the manual process, etc.), the business owner should be informed of those possibilities.


    If the governing body has approved moving to the next phase, the development team
    now starts working on developing process design documents (PDD).


    As mentioned earlier in this chapter, PDD is the preferred method of documenting
    requirements for RPA projects. If your organization doesn’t have an effective
    method of gathering and documenting requirements, use the following method for
    your RPA projects.


    A process definition document is fairly straightforward. It answers some basic
    questions to assist designers and developers in automating the process it describes.
    It conveys what the process does, its inputs and outputs, the steps currently
    performed to accomplish the process, and any decision points in the process. Regarding
    any decision points, you need to determine if they can be automated. If not, they
    will need to be sent for manual handling.


    The PDD also conveys who owns the process and who actually performs it. The document
    will also specify how often the process is performed: it might be hourly, weekly,
    monthly, on demand, or any other configuration. Also, what systems or applications
    interact with it? Which ones either provide input to the process or receive its
    output.


    We talked before about authorization; the PDD lists what authorizations are needed
    for any systems or applications that interact with the process.


    The PDD will also list the currently known risks. What could go wrong? What happens
    if something goes wrong? Does the process revert to manual performance until the
    problem is resolved? Who is responsible?


    Lastly, the PDD will explicitly state the endpoints. How do we know that the process
    has completed?


    A PDD can be accompanied by a flow diagram showing the current process and how
    that same process will/would look if automated. It can also specify the endpoints
    of a manual as well as an automated process.^([^(13)](#fn13))'
