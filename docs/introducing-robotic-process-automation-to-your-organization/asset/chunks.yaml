  trans: '

    # 中心辐射式模型


    中心辐射式模型是一种类似于自行车轮圈球状结构的模式，其中轮毂位于中心，辐条相互连接并交汇于作为轮子中心的轮毂处。这一概念最初由交通运输行业开创，如今已被各行各业的不同公司广泛采用。


    在该模型中，`COE`（卓越中心）设立于一个执行办公室内，通常充当分散式辐条的中心枢纽。交付团队可被视为辐条。


    `COE`负责制定标准、开发政策、提供培训，并专注于创新和`RPA`（机器人流程自动化）项目战略。在这种情况下，你可以将卓越中心视为知识和专长的主要来源或知识库，包括最佳实践、框架、开发实践、可复用组件、培训，以及作为支持、维护和演进`RPA`技术基础设施及能力的`IT`部门。


    辐条——即`RPA`交付团队——主要专注于识别机会、开发`RPA`解决方案并将其部署到所分配或支持的业务领域。该模型要求中心枢纽（`COE`）与辐条（`RPA`交付团队）之间密切协作。


    在此模型中，`COE`将：


    *   通过与`IT`系统/应用支持和解决方案架构团队建立协作模型，确保将`RPA`运营环境整合到整体企业`IT`生态系统中

    *   定义`RPA`项目演进路线图，推动从战略到执行的落地

    *   推动创新并引入新的技术能力

    *   维护和支持与`RPA`相关的`IT`基础设施

    *   制定标准、自动化模块或可复用组件

    *   与`RPA`供应商和服务提供商互动

    *   对技术和工具选择负责

    *   管理和维护可复用组件及最佳实践库

    *   培训并赋能交付团队人员

    *   确保知识得以共享和复用

    *   在高管层面汇报`RPA`项目的绩效和有效性


    交付团队将：


    *   评估并优先排序待自动化的选定流程

    *   开发`RPA`自动化并将机器人投入生产环境

    *   与`IT`团队（如系统/应用架构和支持团队）互动

    *   为业务单元提供变更管理支持

    *   确保现有机器人劳动力的绩效

    *   维护现有的自动化流程

    *   执行安全/合规职能


    ![../images/513218_1_En_8_Chapter/513218_1_En_8_Fig3_HTML.jpg](img/513218_1_En_8_Fig3_HTML.jpg)


    图 8-3 中心辐射式模型


    ## 优势


    该模型减轻了`COE`日常业务运营的部分负担。这包括允许其报告体系之外的其他团队执行诸如识别适合`RPA`的流程、开发并监控自身机器人绩效等任务。这使得`COE`的资源能够腾出更多时间处理宏观事务，例如规划项目演进、引入新能力、研究工具、知识共享以及循环性活动（如开发最佳实践、可复用组件等）。


    相比分散式模型，该模式成本更低，因为通过集中化某些职能和活动，可以避免整个组织范围内的重复浪费。例如，与其让整个组织内四个不同的人分别负责`RPA`相关的`IT`基础设施，在此模式下，两个人可能就足够了。


    ## 劣势


    中心辐射式模型最常见的挑战在于它对完美、协调和协作的高度依赖。当整个模型——中心的枢纽和每一个辐条——协同工作时，整个`RPA`项目将变得极其高效和有效。然而，只要有一个辐条出现偏差，整个模型就可能开始出现问题。最终，更多辐条会脱落，导致整个`RPA`项目效率低下且成本高昂。可能造成中心枢纽之外问题出现的原因有多种：


    *   辐条“交付团队”负责人可能不认同中心枢纽“`COE`”的战略方向或其他决策，从而不执行或落实中央指令。

    *   中心枢纽“`COE`”与辐条“交付团队”之间的任何不信任都可能导致形成孤岛。

    *   当前基础设施的故障，或实施、引进不佳的能力、新供应商或新工具，可能对整个`RPA`项目造成灾难性影响，波及交付团队所支持的每一个业务单元。

    *   另一个可能出现的问题是，与分散式模型相比，创新速度往往较慢。


    中心辐射式模型具有诸多优势，但要充分利用其潜力，需要在中心枢纽和辐条之间进行适当的职能与服务的责任分配。此外，在辐条与中心枢纽“`COE`”之间建立有效的协作环境、信任和战略透明度，对于成功至关重要。该模型并非适用于所有组织，但许多组织可能会通过根据中心枢纽（`COE`）与辐条（交付团队）模型调整其职责和角色，从而发现其某些组成部分的实用性。


    ## 思考与考量


    现在你已经了解了中心辐射式模型。你认为它在你的组织中能取得成功吗？它的哪些组成部分看起来可行，哪些不可行？


    以上每种模型如果应用得当，都能在任何组织中取得成功。没有绝对的赢家；没有任何单一模型可以被视为最有效或最无效，因为它完全取决于组织的类型、其业务、服务或产品的性质、文化、规模和报告体系。


    ## 思考与考量


    基于你对组织的了解，并考虑到你认为管理层和一线员工对引入`RPA`项目的接受程度如何，你认为你的组织应采用怎样的组织架构？

    '
- fmt: '# What to Consider Before Selecting an Organizational Structure


    As we described earlier in Chapter [3](#513218_1_En_3_Chapter.xhtml), before setting
    on an `RPA` path, the program leadership should decide what functions that are
    required to support and execute the `RPA` program are going to be led by in-house
    resources or be outsourced to an external third-party service provider.


    The more companies are experienced with the usage of `RPA` technology, the more
    they tend to use it in-house. They have accumulated sufficient knowledge and technical
    expertise so that it might be more effective and efficient to keep those resources
    within company. On the other hand, those companies that are new to `RPA` capabilities
    are more likely to outsource to their `RPA` external partners.


    This is a very interesting phenomenon, and both options offer different benefits
    to each party.


    A 2016 study conducted by Capgemini Consulting and Capgemini Business Services
    “indicated that while companies will gain benefits implementing `RPA` with help
    of an outsourcing partner, the benefits could not be as high in comparison to
    companies that make the technological investment in `RPA` themselves.”^([^(20)](#fn20))


    However, starting an `RPA` program from scratch would have higher costs since
    it would take time and investment to reach adequate maturity and realize financial
    benefits.


    Nevertheless, for companies that are not certain and not ready to commit to making
    the technological investment in `RPA` themselves, but still want to leverage `RPA`
    technology, they would benefit in partnering with an external provider. They need
    to keep in mind the required `RPA` functions that we discussed earlier in this
    book while selecting their `RPA` partner. It is important to select and partner
    with a provider that could provide a full-stack service, from process discovery
    to `Bot` deployment and maintenance. Companies that choose to follow that model
    do not need to make significant investment in technology infrastructure or be
    concerned about identifying the right processes and the sufficient number of processes
    to gain an adequate return on investment. Now those concerns are outsourced, and
    the company can terminate the partnership at any time if it finds it is not suitable
    or does not bring enough benefits.


    However, as was found in the Capgemini study, “it is clear that those who implement
    `RPA` in-house will benefit the most in the long-term.”^([^(21)](#fn21))


    This is why it is vitally important to define the organization’s strategic course
    and long-term vision prior to embarking on an `RPA` journey.


    Also, an organization can choose a hybrid model that establishes a collaborative
    framework with an external provider and in-house resources. For instance, an external
    partner could play the role of a delivery team, focusing on suitable-for-`RPA`
    process identification and assessment, development, and deployment of the automation
    solutions (`Bots`). The in-house team would then provide support and maintenance.


    The following tips could be helpful for choosing a suitable path.


    Prior to deciding which model to follow, an organization must be clear on these
    aspects:


    - Are there enough processes for `RPA` to justify investments (ROI)?

    - Is the organization committed to long-term investment in an `RPA` program?

    - Does the organization have the in-house skills and capability to start an `RPA`
    program?

    - Is `RPA` a part of the long-term (meaning five- to ten-year) strategy of digital
    transformation of its operations and IT infrastructure or ecosystem?


    Organizations must ensure that they consider all the aspects of `RPA` program
    implementation in terms of operational culture, people, processes, and in-house
    technology prior to selecting the suitable model for `RPA` program organizational
    structure.


    Keep in mind that the `RPA` operating model is one that will continually evolve
    as the organization matures with time. Therefore, companies don’t have to pick
    one model and stick to it. It might be even beneficial to start small, perhaps
    as proof of concept with a centralized team structure, to support one business
    unit to learn, explore, and evolve organically to bring more benefits and slowly
    grow and scale up across the enterprise. Another factor that could trigger the
    need to change is the fast pace of technology change. Automation capabilities
    evolve rapidly, maturing an organization into more advanced stages of automation.
    That level of maturity could require an entirely different operating model for
    the organization to maximize and leverage the full potential of that technological
    capabilities. We will discuss this in detail in Chapter [10](#513218_1_En_10_Chapter.xhtml).


    Footnotes [1](#513218_1_En_8_Chapter.xhtml#Fn1_source) [2](#513218_1_En_8_Chapter.xhtml#Fn2_source)'
  raw: '## What to Consider Before Selecting an Organizational Structure


    As we described earlier in Chapter [3](#513218_1_En_3_Chapter.xhtml), before setting
    on a RPA path, the program leadership should decide what functions that are required
    to support and execute the RPA program are going to be led by in-house resources
    or be outsourced to an external third-party service provider.


    The more companies are experienced with the usage of RPA technology, the more
    they tend to use it in-house. They have accumulated sufficient knowledge and technical
    expertise so that it might be more effective and efficient to keep those resources
    within company. On the other hand, those companies that are new to RPA capabilities
    are more likely to outsource to their RPA external partners.


    This is a very interesting phenomenon, and both options offer different benefits
    to each party.


    A 2016 study conducted by Capgemini Consulting and Capgemini Business Services
    “indicated that while companies will gain benefits implementing RPA with help
    of an outsourcing partner, the benefits could not be as high in comparison to
    companies that make the technological investment in RPA themselves.”^([^(20)](#fn20))


    However, starting an RPA program from scratch would have higher costs since it
    would take time and investment to reach adequate maturity and realize financial
    benefits.


    Nevertheless, for companies that are not certain and not ready to commit to making
    the technological investment in RPA themselves, but still want to leverage RPA
    technology, they would benefit in partnering with an external provider. They need
    to keep in mind the required RPA functions that we discussed earlier in this book
    while selecting their RPA partner. It is important to select and partner with
    a provider that could provide a full-stack service, from process discovery to
    Bot deployment and maintenance. Companies that choose to follow that model do
    not need to make significant investment in technology infrastructure or be concerned
    about identifying the right processes and the sufficient number of processes to
    gain an adequate return on investment. Now those concerns are outsourced, and
    the company can terminate the partnership at any time if it finds it is not suitable
    or does not bring enough benefits.


    However, as was found in the Capgemini study, “it is clear that those who implement
    RPA in-house will benefit the most in the long-term.”^([^(21)](#fn21))


    This is why it is vitally important to define the organization’s strategic course
    and long-term vision prior to embarking on an RPA journey.


    Also, an organization can choose a hybrid model that establishes a collaborative
    framework with an external provider and in-house resources. For instance, an external
    partner could play the role of a delivery team, focusing on suitable-for-RPA process
    identification and assessment, development, and deployment of the automation solutions
    (Bots). The in-house team would then provide support and maintenance.


    The following tips could be helpful for choosing a suitable path.


    Prior to deciding which model to follow, an organization must be clear on these
    aspects:


    *   Are there enough processes for RPA to justify investments (ROI)?


    *   Is the organization committed to long-term investment in an RPA program?


    *   Does the organization have the in-house skills and capability to start an
    RPA program?


    *   Is RPA a part of the long-term (meaning five- to ten-year) strategy of digital
    transformation of its operations and IT infrastructure or ecosystem?


    Organizations must ensure that they consider all the aspects of RPA program implementation
    in terms of operational culture, people, processes, and in-house technology prior
    to selecting the suitable model for RPA program organizational structure.


    Keep in mind that the RPA operating model is one that will continually evolve
    as the organization matures with time. Therefore, companies don’t have to pick
    one model and stick to it. It might be even beneficial to start small, perhaps
    as proof of concept with a centralized team structure, to support one business
    unit to learn, explore, and evolve organically to bring more benefits and slowly
    grow and scale up across the enterprise. Another factor that could trigger the
    need to change is the fast pace of technology change. Automation capabilities
    evolve rapidly, maturing an organization into more advanced stages of automation.
    That level of maturity could require an entirely different operating model for
    the organization to maximize and leverage the full potential of that technological
    capabilities. We will discuss this in detail in Chapter [10](#513218_1_En_10_Chapter.xhtml).


