    # 10. Planning for the Future


    While RPA is relatively new, it is sweeping through technology companies, due
    to the need to automate repetitive, manual processes. But as technology is ever
    changing, RPA is evolving with it. It is important for you to know about coming
    trends, so you can determine if and when to introduce them into your organization.
    We will discuss the most significant “evolutions” to RPA here.


    RPAAS, process mining, and intelligent processing are extensions of RPA.


    ## RPAAS – RPA as a Service


    Currently, most companies have native clients for automation tools. In the future,
    and the transition is already happening, all infrastructure of RPA is moving to
    the cloud. As stated in *Robocloud* , “Using RPA as a service means that your
    company does not have to purchase your own servers, licensing or professional
    services.”^([^(33)](#fn33))


    The basic advantage is that all the benefits of cloud can be leveraged. These
    include


    *   Increased capacity: For example, perhaps you have ten Bots running on one
    machine. If you need to add more, you will need to increase the memory, the processing
    speed, etc. With RPAAS, you have sufficient flexibility to increase the capacity
    and replicate servers much more quickly. You can replicate the machines/servers
    on which the Bots are running, enabling your working force to be replicated faster.


    *   Increased flexibility: For example, we know that Bot licenses can be expensive.
    Currently, if you need 2 Bots immediately, and you estimate that within the next
    6–12 months, you may need 2 more, you need to buy 12 licenses and create the infrastructure
    for them. With RPAAS, you take advantage of the cloud and you can replicate machines
    in minutes, so you can increase or decrease the number of Bots at any time. By
    working with the business to develop a sound business and technology strategy,
    you have the potential to realize significant savings.


    *   Sometimes new functionality is needed very quickly. Using RPAAS, you can adapt
    new releases and features quickly, because you can scale up the infrastructure
    on demand.


    Pause and Consider


    Based on what you now know about RPA, how do you think RPAAS could benefit your
    organization? What steps would you need to take (e.g., a clear presentation of
    potential cost savings, based on historical information) to convince management
    to take this next step?'
