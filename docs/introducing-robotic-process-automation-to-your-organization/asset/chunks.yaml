- fmt: 'For large organizations where its operations are spread across different geographic
    locations, the centralized model would require remote control. With a lack of
    a decentralized decision-making model, leadership is often not able to have the
    required control over implementation, nor might they have the time to manage execution.
    It adds up a lot of work on their hands and creates a tremendous pressure on leaders
    to make decisions fast. It might lead to a situation when too many decisions are
    made too quickly, and they could then be inadequate or disregarded or poorly executed
    by staff that are remotely located from the decision-makers.


    The centralized model is suitable for small or startup organizations with fewer
    business units or one business division. It brings speed, scalability, and cost-effectiveness.
    It also could be used as a start-up point or proof of concept (`POC`) for a large
    enterprise where the organization wants to pilot, learn, and validate the value
    of `RPA`. It would help executives to make decisions on keeping and expanding
    this capability from `POC` to full-scale implementation across the entire enterprise.
    However, you might find that a different model, decentralized or hub-spoke, would
    suit your needs better.


    Regardless of the appealing advantages of the centralized model, before you proceed
    with it, be mindful of its disadvantages since they might stall the adoption of
    your new `RPA` program and result in a poor `ROI`.


    **Pause and Consider**


    Based on the information you have just read, what do you think of the centralized
    model for your organization? Does it resonate with you? Or does it sound foreign?
    There are two additional models to consider, but give some thought to this one.


    ## Decentralized


    In a decentralized model, multiple individual `RPA` programs are established within
    an enterprise, with individual `RPA` frameworks operating under different executive
    branches or business units. This can be viewed as multiple sub-`COE` offices that
    are operating autonomously. The decentralized model has its functionalities spread
    across an organization with different capabilities being run by different business
    units. In this model, decision-making and operational management responsibilities
    are owned by the local `RPA` teams that are overseeing all required functions,
    from defining the architecture, the operating environment and governance, to delivery
    and maintenance.


    This model places fewer constraints on local business teams within the organization,
    while simultaneously helping them gain momentum and expertise. It hands the demand
    for innovation over to the employees by empowering them to meet business goals
    by using `RPA`. This model is loosely governed, and different lines of business
    establish their own guidelines, standards, methodologies, and structures.


    ![../images/513218_1_En_8_Chapter/513218_1_En_8_Fig2_HTML.png](images/513218_1_En_8_Chapter/513218_1_En_8_Fig2_HTML.png)


    **Figure 8-2** Decentralized model


    ### Benefits


    Innovation thrives in those conditions where decisions are made by lower levels
    and smaller groups of decision-makers. Greater autonomy empowers people; it gives
    them a sense of importance and ownership, since they feel that they are accountable
    for steering the direction of the organization. Employees become more loyal because
    they are allowed to take personal initiatives in day-to-day work with minimum
    managerial approvals. There is nothing more satisfying than seeing the successful
    results of your own decisions. Most importantly, it also allows them to leverage
    their knowledge and expertise and be able to experiment and learn: key components
    in driving innovation forward. All those features create a self-sufficient and
    self-maintained structure, where employees at all levels are accustomed to work
    autonomously, take a lead, and make decisions when needed, without having to wait
    for a decision to be made further up the chain of command.


    More efficient decision-making brings speed and agility to the organization, to
    assist it in succeeding in today’s fast-paced and ever-changing business environment.


    ### Disadvantages


    While the decentralized model is a great way to empower employees and drive innovation
    and business agility, it could potentially cost more. Additionally, it may be
    difficult to liaise with enterprise-wide `IT` personnel, since there is no central
    control to define strategic direction.


    Eventually it could lead to misalignment and a major disconnect from the overall
    enterprise strategy. Multiple `RPA` teams with their own authority to define their
    own strategy might lead to different architectural structures and different vendors.
    This could ultimately lead to having, within the same enterprise, different technological
    capability, tools, operating models, methodology, and standards. It also could
    create redundancy, since the same functions could be duplicated across the enterprise,
    leading to higher overall `RPA` program cost.


    In addition, it might create silos or islands, where multiple teams are solving
    the same problems. To keep those islands connected would require strong relationships
    and efforts among leaders to create some sort of “community of practice,” where
    best practices could be shared. However, employees involved in supporting `RPA`
    teams could be so busy with their day-to-day duties that they easily miss the
    opportunity to take advantage of those shared practices. In the eyes of an employee,
    when under pressure to deliver, it is easier to reinvent the wheel than spend
    time to research, understand, and reuse best practices. It sometimes seems preferable
    to create something new simply because existing solutions may not be known or
    are not quite suitable or easily transferable due to differences in tooling, development
    practices, or even the nature of the business operations.


    Because of all those features, generally the decentralized model is more expensive
    to run, less efficient on the enterprise level, and is apt to create technical
    debt which sooner or later needs to be addressed.


    For a small business, rapid growth may create the need to decentralize to continue
    efficient operations and maintain business agility. Despite its advantages, the
    delegation of control to other decision-makers may be difficult for business owners
    who are accustomed to making all the decisions by themselves.


    The decentralized model is suitable for large enterprises with multiple divisions
    or multiple business branches, where the nature of their business operations are
    vastly different and self-maintained. Usually, we might find that technology services
    are already decentralized and are aligned under their own business branch or division.
    In those cases, most likely, they have different core architecture, operating
    and delivery models, systems, and tooling with their strategy aligned to meet
    the specific business needs they are part of. Therefore, `RPA` and business leaders
    need to ensure that they prioritize which processes will initially use `RPA` and
    develop a transformation roadmap based on the individual requirements.


    **Pause and Consider**


    You have now been introduced to two structural models. Which one seems to fit
    your organization better? Does one stand out, or does it seem that neither would
    be optimum for you?'
