  trans: "\n# 9\\. 开发方法与框架\n\n一旦为 RPA 计划奠定了初步基础，就可以开始着手第一个项目或一系列项目了。实际如何推进将取决于组织内的许多因素。\n\
    \n传统的瀑布式方法、敏捷方法及其众多混合变体都能很好地与 `RPA` 相融合。具体采用何种方式，将取决于你的组织是采用敏捷还是瀑布式开发模式。\n\n无论采用何种方法，都存在一些共性：\n\
    \n*   必须更新先前制定的商业案例。请记住，初步商业案例基于有限的信息。当你准备进入开发阶段时，已经获取了额外的信息。这可能会改变所需的具体内容、预期的节省、受拟议变更影响的其他系统、所使用的工具等。这些变更必须纳入更新后的商业案例中。\n\
    \n暂停并思考：如何最好地收集这些信息？到目前为止，举行了哪些会议，包含了可用于优化和更新商业案例的信息？\n\n*   需要准备一份就绪检查清单。它用于确保在开发过程中将软件部署到生产环境所需的所有步骤都已完​​成。就绪检查清单贯穿项目的整个生命周期，因为每个阶段都必须完成部署所需的要求。\n\
    \n*   角色：当 RPA 项目开始时，将需要几个角色。\n  *   业务分析师：此人从项目一开始就参与其中，与业务部门合作，充分理解需求，并将该需求转化为具体要求。\n\
    \  *   系统分析师：此人也从项目一开始就有所参与，与业务分析师合作，确定受拟议变更影响的系统。在项目生命周期的早期，可能只是怀疑但尚未确认具体哪些系统会受到影响。在此阶段，必须确定受影响的准确系统。\n\
    \  *   架构师：架构师对项目也并不陌生，他们与业务分析师和系统分析师合作，协助确定项目的大致时间表并评估复杂程度。与业务分析师和系统分析师一样，架构师的工作现在变得更加具体，因为项目早期存在的“未知因素”逐渐变得清晰。\n\
    \  *   开发者：开发者可能在早期提供过一些意见，但只要架构师已经参与，这种情况就不太可能发生。现在，开发者将阅读并理解需求，并将其转化为代码。\n \
    \ *   业务负责人：业务负责人是需求方面的专家。他们了解所需的内容，并协助创建项目的迭代版本。\n\n如果使用敏捷（或其某种混合变体），上述角色将都会参与，但不是按顺序依次参与，而是同时参与。`RPA`\
    \ 非常适合采用敏捷方法，因为两者都具有迭代性。\n\n## 不同方法带来的挑战\n\nRPA 团队通常同时与多个业务部门合作，因为他们处理的是可能由不同业务部门拥有的不同应用程序。RPA\
    \ 团队不能为每个特定客户更改自己的方法论，也不能同时使用多种方法论。如果其他业务部门使用不同的方法论，而 RPA 团队使用例如敏捷方法，就会遇到挑战：当其他业务部门使用瀑布式方法时，RPA\
    \ 如何能仅使用一种方法论？\n\n例如，在金融领域，许多业务部门使用瀑布式方法，而大多数 RPA 团队使用敏捷或精益方法。业务部门习惯于在完成的需求文档上签字确认；而敏捷和精益则使用迭代方法，即部分需求被批准后就开始开发。然后\
    \ RPA 团队必须等待所有需求都获得批准才能开始开发。如何将等待时间最小化？\n\n业务部门不必签署整个需求文档，而是应逐步签署各个部分，并在文档中注明该签署并非针对整个需求文档，而仅针对特定部分。当所有需求都完全完成时（请注意，此时大部分开发工作可能已经完成），业务部门可以再签署整个文档。\n\
    \n这需要对业务部门的成员进行培训。只签署部分需求的概念对他们来说是全新的，他们可能对此感到不适应。他们可能会说，他们不可能签署“部分”需求，因为他们需要在批准任何部分之前看到整体情况。当然，对某些人来说，这是一种全新的工作方式。对于分析师和主题专家来说，他们需要考虑如何划分需求文档。他们只需要关注正在被自动化的步骤，但即便如此，他们可能仍希望在批准任何部分之前查看端到端的需求文档。部署也是如此；机器人将被逐步部署。制定一个产品\
    \ RPA 增量开发路线图或计划对于定义 RPA 的各个小块至关重要。这些是最终自动化的构建模块。这个路线图可能包含史诗、用户故事或其他工件。无论它们被称为什么，它们都构成了自动化的逐步路线图。\n\
    \n暂停并思考\n\n每个需求部分都应该足够大，以便能够开发或成为 RPA 的完整功能部分，例如，访问电子邮件帐户以检索电子邮件内容，或者使用 RPA 凭据登录系统/应用程序前端等。每个需求都应该产生一个“最小可行产品”，即使这个小的“块”从未单独交付给客户。如何最好地与业务部门合作，帮助他们理解这种需求的划分或“分块”？\n\
    \n再次考虑我们的案例研究。客户发送一封电子邮件，通知我们他们更改了电话号码和地址。\n\n*   第一次需求迭代：“`Bot` 将打开电子邮件，仅读取电话号码，并在\
    \ Web 应用程序中更新该电话号码。”将要求业务部门批准这第一次需求迭代。\n\n*   第二次需求迭代：“`Bot` 将打开电子邮件，读取电话号码和地址，并在\
    \ Web 应用程序中更新电话号码和地址。”将要求业务部门批准这第二次需求迭代。\n\n*   第三次需求迭代：“`Bot` 将打开电子邮件，读取电话号码和地址，并将电话号码和地址更新到\
    \ Web 应用程序和大型机。”\n\n在这种情况下，第一次需求迭代一旦获得批准，就会被开发和测试。用户验收测试将在需求的所有组成部分都开发完成后才进行。这里的假设是会有增量开发，但只有在所有需求的产品都开发完成后才发布一次。\n\
    \n另一种选择是，第一个需求的产品可以先交付并投入生产，然后是第二个部署，以此类推。这取决于你所在组织选择的模型。\n\n随着每次新的需求迭代，你都在扩大自动化的范围。这对业务部门来说可能是一个新概念，他们过去只习惯于批准整个需求文档。\n\
    \n在某些组织中，部署团队可能使用瀑布式方法，而 RPA 团队使用敏捷方法。\n\n现在我们将讨论几种与 `RPA` 一起使用的常见方法。\n"
- fmt: '# Agile Methodology


    Many RPA organizations select an Agile methodology or an Agile hybrid. The major
    aspect of Agile that is often incorporated into a new RPA team is the iterative
    nature of development, from start to finish.


    In an Agile environment, some preliminary, very basic requirements are approved.
    This is the minimum viable product, meaning that the functionality works, but
    it may not be anything you’d want to give to a customer; it is too rudimentary.
    In our case study, a very preliminary requirement might be: “Bot will read the
    email, read the phone number, and update the phone number in the web application.”
    The business would approve that, knowing that it would be pointless to give it
    to the customer, since it is only part of what the customer wanted and was promised.
    But it is still a basic function that needs to be done. Once that is approved,
    the development team would begin working on it. The next requirement may be: “Bot
    will read the email, read the address, and update the address in the web application
    and the mainframe.” Again, this is only one aspect of what the customer requested
    and was promised, but absolutely required.


    This, obviously, differs from the traditional, Waterfall methodology, in which
    all requirements are gathered and approved before any other work begins. But since,
    as has been shown in earlier chapters, RPA is best established following an iterative
    process (e.g., do some work; present to the Governance Committee; get approval
    to move ahead [or not]; do some more work; present again; etc.), using an Agile
    development methodology just makes sense.


    One advantage is that changes can be made early in the project life cycle. For
    example, once the requirement “Bot must be able to read the incoming emails from
    mailbox XYZ” is approved, the business may decide that not only should address
    and phone number updates be done by the Bot, but name changes due to marriage,
    divorce, etc., should also be covered. In a traditional Waterfall methodology,
    this would be a major requirements change, requiring rework. In an Agile environment,
    since the requirements are captured and approved incrementally, such changes can
    be made on the fly.


    **Pause and Consider**


    Remember, the introduction of RPA in your organization can be revolutionary. If
    the methodology that the RPA team will use differs from what the rest of the organization
    is using, you will need to negotiate areas of difference. For example, how will
    you convince the business to sign off on partial requirements?


    In comparing RPA initiatives using either an Agile or Waterfall methodology, Madan
    Kumar Divvela said this: “Typically, process automation with RPA takes a few weeks
    from inception to production. The traditional Waterfall methodology cannot keep
    up with the pace of RPA delivery.”^([^(22)](#fn22))


    ## Benefits


    One of the benefits of using an Agile methodology is that changes can be easily
    made without costly delays and rework. Commenting on his own experience, Dominic
    Whaley, writing in *Partnering Solutions*, said that “Dividing the work into distinct
    packets enabled us to take stock at regular intervals. Changes or new requirements
    were noted and added to the next sprint.”^([^(23)](#fn23))


    Another benefit of delivering in increments is that lessons learned from the previous
    increment could be easily incorporated in the next set of requirements without
    needing to rewrite the whole set requirements and go through the reapproval process
    again. This way, something you think could have been done better in, for example,
    the gathering or documentation of the requirements for the first set of requirements
    can be done in the gathering or documentation of the second set.


    This brings increased flexibility and reduces overall lead time of the development
    cycle.


    Also, all the team members are busy all the time. Once the initial requirements
    have been documented, the developers and business analysts can begin working on
    the MVP. While this work is being done, the next set of requirements is being
    captured.


    Agile also makes it easier to estimate the time it will take to develop each requirement,
    which makes scheduling deployment easier and more effective.


    Another potential benefit was discussed in *Blueprint*, in an article entitled
    “How an Agile Approach to Automation Can Deliver RPA at Scale.”


    > *In an Agile approach to Robotic Process Automation, business processes are
    designed and optimized before any development begins. This allows large organizations
    to fully standardize and optimize end-to-end, complex, and multi-layered business
    processes where the real ROI in automation resides. It also provides them with
    the invaluable opportunity to consider and tie those processes to larger business
    objectives and enterprise or regulatory constraints, policies, and controls.*^([^(24)](#fn24))


    ## Possible Disadvantages


    Working in an Agile environment requires training. There is not only a new way
    of working and an entirely new vocabulary but also a new way of thinking. Simply
    changing the vocabulary but using the same methods does not make an organization
    Agile. It is a characteristic of human nature that people don’t like change, especially
    if they are very efficient and effective at the way they are currently working.
    Agile requires people on both the business and technical side to think about requirements,
    development, etc., very differently. While development teams often quickly get
    on board with Agile, the business side is frequently much more hesitant.


    **Pause and Consider**


    If your organization is not familiar with Agile, but you feel RPA would best be
    structured using this methodology, how would you work to convince people that
    it is? Do you see potential acceptance by the tech team, but resistance by the
    business? How do you get both groups to see the advantage of using Agile?


    This is not meant to imply that only Agile is effective with RPA; that is not
    the case at all. While many organizations are moving away from the traditional
    Waterfall methodology, many are not. RPA can be established using this methodology
    as well.'
