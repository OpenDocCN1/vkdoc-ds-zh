  trans: "\n## 机器人维护\n\n### 3.1 设置并管理支持队列\n\n1. **敏捷模式**：开发团队轮换（每周？）值守支持，负责响应 COE/LOB\
    \ 部门关于故障的联系。可设立专用收件箱用于报告机器人性能及异常情况，由当周指定的开发团队成员监控。这种方式能让所有团队成员熟悉所有机器人。在更传统的方法中，通常指派一到两名技术团队成员负责支持队列，但也可以实施更灵活的轮换支持机制，以提升团队成员对所有机器人的了解。\n\
    \n   在设置支持队列时，COE 与业务部门之间的工作流程应非常清晰。这包括：当事故报告给技术团队时，需要确定：是否该停止机器人？该特定机器人的业务方联系人是谁？机器人是否可以重新运行（是预先决定每次均重新运行，还是需要个案决策）？是否每次都要立即停止？等等。对于某些机器人，已知业务方希望其在失败后能重新运行。\n\
    \n   可以为每个机器人编写简短的\"后续步骤\"说明，以确保对任何报告的事故都能快速响应。这将极大帮助事故发生时任何被指派支持的人员。步骤可能包括：联系业务方；停止；重新运行（附上关于重新运行前等待时长的说明：立即、X\
    \ 小时后、次日等）；使其继续运行并更新业务方相关问题等。此\"后续步骤\"文档应与 COE、业务部门和技术团队共享。这些是立即要执行的首要步骤。\n\n\
    \   团队中的每个人都应清楚，当值人员并不负责解决问题。该人员是联系人，负责协调业务部门、COE 和技术团队的响应。如果当值人员无法解决事故，可以联系该特定自动化领域的专家。\n\
    \n**注意**\n\n在 RPA 中，技术团队由多个不同角色组成（流程分析师、架构师、业务分析师、基础设施分析师、开发人员、资产管理、安全等）。\n\n\
    如果贵组织设有 COE，一线支持由 COE 负责，二线支持由技术团队处理。在未设立 COE 的情况下，一线和二线支持均由技术团队负责。机器人部署后，一线支持开始对其进行监控。\n\
    \n### 3.2 监控仪表板\n\n机器人部署后，必须对其进行维护，以确保其能够完成创建时设定的工作，并保持最佳性能水平。持续监控至关重要。监控可以是自动化的，也可以是手动的。自动化监控可能包括发送警报，例如电子邮件或短信，以提示机器人性能不佳或已停止工作，或者通过更新仪表板来呈现。\n\
    \n仪表板对于监控机器人非常方便。大多数自动化工具都附带简单的仪表板，可以轻松为已部署的机器人进行配置。技术团队或业务合作伙伴可以通过用户界面轻松访问仪表板，以实时了解机器人的状态及其运行情况。正如\
    \ Sharda Cherwoo 和 Roy Rachamimov 所说：\"运营仪表板对于机器人的日常运行至关重要——可以频繁且实时地监控它们的活动。在\
    \ RPA 项目的早期阶段，机器人数量较少，所有注意力都集中在将它们集成到工作流中，并确保它们成功完成任务。\"^(¹⁹)（注：更多信息请参阅脚注中提到的文章。）\n\
    \n## 优先级排序\n\n当许多机器人需要重新运行时，就会涉及此问题。例如，运行机器人的服务器宕机，导致大量机器人需要重新运行。优先级将由业务所有者来确定，决定哪些机器人优先处理。有些机器人正在处理关键业务工作（例如，满足监管要求）。\n\
    \n在没有关键业务机器人需要重新运行，且所有机器人具有相同优先级的情况下，由 COE 或技术团队决定。他们可以决定先运行那些耗时短或工作量小的机器人，以便快速完成这些任务。然后再运行那些需要更长时间才能完成的更复杂的机器人。优先级排序的准则应事先制定，但需要足够灵活，以适应不同的或变化的情况。\n\
    \n## 保修期\n\n每当新的自动化程序部署到生产环境，或者新版本发布到生产环境时，机器人都会被分配一个保修期。\n\n保修期可根据业务部门与技术团队之间的协议，设定为一周或两周。机器人需要时间来稳定，新机器人初期可能会遇到一些问题。因此，保修期允许在最少依赖多人的情况下快速解决缺陷。在保修期内，无需准备将机器人移至生产环境所需的所有文档，例如业务签核、测试签核等。修复工作会快速完成以保持机器人运行。如前所述，如果业务部门或技术团队认为需要对机器人进行更长时间的密切观察，保修期可以延长。\n\
    \n## 机器人分类\n\n机器人可以分为\"关键型\"或\"非关键型\"。关键型机器人是指那些时间敏感的机器人；其输出可能用于满足政府监管要求。这些机器人对业务有重大影响。如果关键型机器人发生故障，技术团队必须能够立即采取措施，无需等待他人的决策。对于关键型机器人，所有在发生故障时应采取的行动必须在部署前定义好。\n\
    \n非关键型机器人对业务的影响不同。如果非关键型机器人发生故障，在采取任何行动之前，需要征求业务部门的意见。业务部门将决定是重新运行机器人还是采取其他措施。技术团队会据此做出响应。\n\
    \n## 沟通\n\n在第 5 章中，我们介绍了需要与公司的 COE（卓越中心）保持沟通的必要性（如果有的话），如果没有 COE，则需与负责部署的部门沟通。现在您即将进行部署，之前通过让该团队参与进来并让他们了解将要部署的内容、期望的部署时间以及其他相关细节所建立的关系，将极大帮助您在需要时让机器人顺利启动和运行。\n\
    \n在早期阶段，您已向该团队（或个人）通报了实现自动化的流程、它将与哪些系统交互、运行频率、运行平台以及其他相关细节。他们知道您希望部署的日期，并且希望他们已经努力确保自己这边一切就绪。由于情况可能每天变化，您现在需要向他们更新各种问题。以下是需要确认的一些关键主题：\n\
    \n- 请求自动化的业务部门\n- 请求日期\n- 受影响的系统\n- 治理委员会会议日期\n- 业务方在追加请求后可能提出的任何变更\n- 机器人的预期规模（自动化的步骤数、数量）\n\
    - 运行频率\n- 您的团队和所创建的特定机器人可能要求的其他事项\n"
- fmt: '# Change Management


    When bots run, there are always issues, and change management is used to fix,
    deploy, and keep track of them. Tracking of changes requires the creation of change
    tickets so that the work can be documented and tracked. There are many situations
    where different types of actions to fix a problem are required. As a result, change
    requests can be categorized to facilitate the team in taking the correct actions.


    Tickets can be categorized as a change request, a service request, an investigation
    request, or a general request.


    A general request is created when information regarding any bot is required, such
    as the total work done, when the bot started or completed, etc. For these types
    of requests, there is no need for any approvals since they are informational requests
    only. There is nothing immediately to fix change. These requests are triggered
    by the receipt of any alert produced by the bot. The information is provided to
    the technical team for review.


    Following the review of the information provided by the general request, either
    an investigation request or a change request may be created. An investigation
    request is created if additional resources are required to further explore the
    issue and find its root cause. In most cases, the bot performed fine in the test
    environment, but isn’t performing as well in the production requirement.


    Some general requests may trigger a change request. The technical team may receive
    a general request as noted earlier. If they are able to identify the issue and
    the root cause, and they can implement the fix, a change request will be created.
    Following approval of the change (generally done through email), they can update
    the bot code files.


    **Pause and Consider**


    These are the types of requests that are generally used, but it depends upon your
    organization’s needs. How do you think you should categorize tickets in your new
    RPA program? If you are unsure, use what we have here; your program will evolve
    and you will learn over time if these categories best suit your organization’s
    needs.


    **Tip**


    Having too many categories of tickets makes it difficult to understand and manage
    expectations, and it can become difficult to discern one type of ticket from another.


    # Auditing Bots


    Once the bot is deployed and is doing its work, we start collecting information
    about bot performance. There is much information to glean.


    - How many work items a work is processing in X amount of time? The expectation
    will have been determined earlier in the process.

    - What is the workload the bot is receiving every day? When the request was initially
    made, an estimate of the workload was provided. This probably changed as you learned
    more about the process, and now you will see what workload the bot is actually
    receiving.

    - How many times does it error out during the day? This indicates that an error
    has occurred; the bot may continue or stop, depending on the error. Sometimes
    the bot will encounter an error that it can move beyond, but sometimes the error
    will cause the bot to stop. Depending on the error, the bot may try to process
    it again.

    - On-time starts vs. delayed start. This includes how many times the bot starts
    on time, and if the start is delayed, how long was the delay. It also includes
    whether or not the bot completed the work if the start was delayed. Knowing this
    information may lead to rescheduling the bot start time.

    - For complex work items with many steps, information is collected on sub-items
    between the works. This means looking at the individual steps at the smallest
    level and determining where the issues causing problems exist.


    Once this information is gathered, it can be analyzed and verified where the bot
    is taking more time than expected; if erroring out too frequently, or infrastructure
    is slow, or applications are slow, these can be analyzed and addressed.


    As noted in Chapter 4, an initiative could be a new bot, an enhancement to an
    existing bot, or defect correction. Deployment to production is slightly different
    for each case. Most of the information in this chapter refers to deploying a new
    bot.


    For an enhancement, a lot of the required information will already exist. You
    will generally know the systems and applications that the bot accesses, and an
    enhancement will probably use the same ones. If there are changes, they will be
    noted. An enhancement often includes automating additional steps within the process;
    for example, if a bot automated steps 3–9 of a process with 15 steps, perhaps
    additional steps are requested to be automated. The process is already known,
    so that need not be documented again. So the deployment steps are basically the
    same, but are expedited because so much information is already known; you are
    just building on what already exists.


    This doesn’t mean, however, that all identified risks need not be mitigated or
    that business doesn’t need to sign off on the enhancement. But many things for
    deployment will already be in place from the original deployment of the bot.


    Defect fixes can be deployed by simply assuring that so doing won’t “break” anything
    that is working. Testing sign-off is required, and then the fix can be put in
    production.


    **Tip**


    If the defect occurs outside of warranty, testing sign-off and approval of updated
    requirements may be required. This depends on the standards set in your organization,
    but both approvals are recommended.


    # Disaster Recovery


    This is the plan required should the bot fail to do the necessary work. This could
    occur because servers are down, the bot is working too slowly, or applications
    that the bot is using are unavailable (e.g., bot is using Jira, but Jira is unavailable).
    In these and other related cases, the functions of the business must continue.
    The disaster recovery plan, detailed in the `SDD` (see Chapter 6), is the blueprint
    for use in these emergency situations.


    If there is a `COE`, that team will notify the technical team that a bot is not
    working. In the absence of a `COE`, the business or the technical team itself
    will identify the problem due to its monitoring of the bot, or the business may
    notify the technical team. The technical team and the business will decide to
    either run the process manually or wait until the issue that the bot has encountered
    has been resolved and then rerun the bot.'
  raw: "## Change Management\n\nWhen Bots run, there are always issues, and change\
    \ management is used to fix, deploy, and keep track of them. Tracking of changes\
    \ requires the creation of change tickets so that the work can be documented and\
    \ tracked. There are many situations where different types of actions to fix a\
    \ problem are required. As a result, change requests can be categorized to facilitate\
    \ the team in taking the correct actions.\n\nTickets can be categorized as a change\
    \ request, a service request, an investigation request, or a general request.\n\
    \nA general request is created when information regarding any Bot is required,\
    \ such as the total work done, when the Bot started or completed, etc. For these\
    \ types of requests, there is no need for any approvals since they are informational\
    \ requests only. There is nothing immediately to fix change. These requests are\
    \ triggered by the receipt of any alert produced by the Bot. The information is\
    \ provided to the technical team for review.\n\nFollowing the review of the information\
    \ provided by the general request, either an investigation request or a change\
    \ request may be created. An investigation request is created if additional resources\
    \ are required to further explore the issue and find its root cause. In most cases,\
    \ the Bot performed fine in the test environment, but isn’t performing as well\
    \ in the production requirement.\n\nSome general requests may trigger a change\
    \ request. The technical team may receive a general request as noted earlier.\
    \ If they are able to identify the issue and the root cause, and they can implement\
    \ the fix, a change request will be created. Following approval of the change\
    \ (generally done through email), they can update the Bot code files.\n\nPause\
    \ and Consider\n\nThese are the types of requests that are generally used, but\
    \ it depends upon your organization’s needs. How do you think you should categorize\
    \ tickets in your new RPA program? If you are unsure, use what we have here; your\
    \ program will evolve and you will learn over time if these categories best suit\
    \ your organization’s needs.\n\nTip\n\nHaving too many categories of tickets makes\
    \ it difficult to understand and manage expectations, and it can become difficult\
    \ to discern one type of ticket from another.\n\n## Auditing Bots\n\nOnce the\
    \ Bot is deployed and is doing its work, we start collecting information about\
    \ Bot performance. There is much information to glean.\n\n*   How many work items\
    \ a work is processing in X amount of time? The expectation will have been determined\
    \ earlier in the process.\n\n*   What is the workload the Bot is receiving every\
    \ day? When the request was initially made, an estimate of the workload was provided.\
    \ This probably changed as you learned more about the process, and now you will\
    \ see what workload the Bot is actually receiving.\n\n*   How many times does\
    \ it error out during the day? This indicates that an error has occurred; the\
    \ Bot may continue or stop, depending on the error. Sometimes the Bot will encounter\
    \ an error that it can move beyond, but sometimes the error will cause the Bot\
    \ to stop. Depending on the error, the Bot may try to process it again.\n\n* \
    \  On-time starts vs. delayed start. This includes how many times the Bot starts\
    \ on time, and if the start is delayed, how long was the delay. It also includes\
    \ whether or not the Bot completed the work if the start was delayed. Knowing\
    \ this information may lead to rescheduling the Bot start time.\n\n*   For complex\
    \ work items with many steps, information is collected on sub-items between the\
    \ works. This means looking at the individual steps at the smallest level and\
    \ determining where the issues causing problems exist.\n\n    Once this information\
    \ is gathered, it can be analyzed and verified where the Bot is taking more time\
    \ than expected; if erroring out too frequently, or infrastructure is slow, or\
    \ applications are slow, these can be analyzed and addressed.\n\nAs noted in Chapter\
    \ [4](#513218_1_En_4_Chapter.xhtml), an initiative could be a new Bot, an enhancement\
    \ to an existing Bot, or defect correction. Deployment to production is slightly\
    \ different for each case. Most of the information in this chapter refers to deploying\
    \ a new Bot.\n\nFor an enhancement, a lot of the required information will already\
    \ exist. You will generally know the systems and applications that the Bot accesses,\
    \ and an enhancement will probably use the same ones. If there are changes, they\
    \ will be noted. An enhancement often includes automating additional steps within\
    \ the process; for example, if a Bot automated steps 3–9 of a process with 15\
    \ steps, perhaps additional steps are requested to be automated. The process is\
    \ already known, so that need not be documented again. So the deployment steps\
    \ are basically the same, but are expedited because so much information is already\
    \ known; you are just building on what already exists.\n\nThis doesn’t mean, however,\
    \ that all identified risks need not be mitigated or that business doesn’t need\
    \ to sign off on the enhancement. But many things for deployment will already\
    \ be in place from the original deployment of the Bot.\n\nDefect fixes can be\
    \ deployed by simply assuring that so doing won’t “break” anything that is working.\
    \ Testing sign-off is required, and then the fix can be put in production.\n\n\
    Tip\n\nIf the defect occurs outside of warranty, testing sign-off and approval\
    \ of updated requirements may be required. This depends on the standards set in\
    \ your organization, but both approvals are recommended.\n\n## Disaster Recovery\n\
    \nThis is the plan required should the Bot fail to do the necessary work. This\
    \ could occur because servers are down, the Bot is working too slowly, or applications\
    \ that the Bot is using are unavailable (e.g., Bot is using Jira, but Jira is\
    \ unavailable). In these and other related cases, the functions of the business\
    \ must continue. The disaster recovery plan, detailed in the SDD (see Chapter\
    \ [6](#513218_1_En_6_Chapter.xhtml)), is the blueprint for use in these emergency\
    \ situations.\n\nIf there is a COE, that team will notify the technical team that\
    \ a Bot is not working. In the absence of a COE, the business or the technical\
    \ team itself will identify the problem due to its monitoring of the Bot, or the\
    \ business may notify the technical team. The technical team and the business\
    \ will decide to either run the process manually or wait until the issue that\
    \ the Bot has encountered has been resolved and then rerun the Bot."
  trans: "  \n# 变更管理  \n\n当机器人运行时，总会遇到各种问题，而变更管理则用于修复、部署和跟踪这些问题。变更的跟踪需要创建变更单，以便记录和追踪工作。在解决问题时，往往需要采取不同类型的操作。因此，变更请求可以被分类，以便团队能够采取正确的行动。\
    \  \n\n工单可以分为变更请求、服务请求、调查请求或普通请求。  \n\n当需要获取关于任何机器人的信息时，就会创建普通请求，例如：已完成的总工作量、机器人开始或完成运行的时间等。对于这类请求，无需任何审批，因为它们仅涉及信息查询，并不需要立即进行修复或变更。这些请求由机器人产生的任何警报触发，相关信息会提供给技术团队进行审核。\
    \  \n\n在审核普通请求提供的信息后，可能会创建调查请求或变更请求。如果需要额外资源来进一步探究问题并找到根本原因，则会创建调查请求。大多数情况下，机器人在测试环境中运行良好，但在生产环境中表现不佳。\
    \  \n\n某些普通请求可能会触发变更请求。如前所述，技术团队可能会收到普通请求。如果团队能够识别问题及其根本原因，并可以实施修复，则会创建变更请求。在变更获批后（通常通过电子邮件完成），他们即可更新机器人代码文件。\
    \  \n\n**暂停并思考**  \n\n这些是通常使用的请求类型，但具体取决于组织的需求。你认为在新的 RPA 项目中应该如何对工单进行分类？如果无法确定，可以先用我们这里提供的分类方式；你的项目会不断发展，随着时间的推移，你会了解这些分类是否最适合组织需求。\
    \  \n\n**提示**  \n\n工单类别过多会导致难以理解和管理预期，也可能使不同类型的工单难以区分。  \n\n# 审核机器人  \n\n一旦机器人部署并开始工作，我们就会开始收集关于机器人性能的信息。可以获取的信息有很多。\
    \  \n\n- 机器人在特定时间内处理了多少个工作项？预期值会在流程的早期阶段确定。  \n- 机器人每天接收的工作量是多少？最初提出请求时，已经提供了工作量估算。随着你对流程的深入了解，这个数字可能发生了变化，而现在你将看到机器人实际接收的工作量。\
    \  \n- 机器人每天出错多少次？这表示发生了错误；根据错误类型，机器人可能会继续运行或停止。有时机器人会遇到可以绕过的错误，但有时错误会导致机器人停止运行。根据错误情况，机器人可能会尝试重新处理。\
    \  \n- 按时启动 vs. 延迟启动。这包括机器人按时启动的次数，以及如果启动延迟，延迟了多长时间。还包括如果启动延迟，机器人是否完成了工作。了解这些信息可能会决定是否需要重新安排机器人的启动时间。\
    \  \n- 对于包含多个步骤的复杂工作项，会收集关于工作项之间子项的信息。这意味着要审视最细粒度的单个步骤，并确定导致问题出现的环节。  \n\n收集到这些信息后，可以进行分析和验证，确定机器人是在哪里花费了比预期更多的时间；如果出错过于频繁，或者基础设施运行缓慢，或者应用程序响应迟缓，这些都可以进行分析和处理。\
    \  \n\n如第 4 章所述，一个项目可以是新机器人、对现有机器人的增强，或是缺陷修正。每种情况的生产部署略有不同。本章的大部分内容都涉及部署新机器人。\
    \  \n\n对于增强功能，许多所需信息已经存在。你通常已经知道机器人访问的系统和应用程序，而增强功能很可能也会使用相同的系统和应用程序。如果有变化，会加以说明。增强功能通常包括对流程中更多步骤的自动化；例如，如果某个机器人自动化了一个包含\
    \ 15 个步骤的流程中的第 3-9 步，那么可能会要求将更多步骤实现自动化。由于流程已知，因此无需再次记录。因此，部署步骤基本一致，但由于已有大量信息，所以流程会加快；你只是在现有基础上进行构建。\
    \  \n\n然而，这并不意味着所有已识别的风险都不需要缓解，或者业务部门无需对增强功能进行签核。但许多部署所需的事项在机器人最初部署时就已经就位。  \n\
    \n缺陷修复可以通过确保修复不会“破坏”任何现有正常功能来进行部署。需要测试签核，然后修复可以投入生产。  \n\n**提示**  \n\n如果缺陷发生在保修期外，则可能需要测试签核以及对更新需求的审批。这取决于组织设定的标准，但建议完成这两项审批。\
    \  \n\n# 灾难恢复  \n\n这是当机器人无法完成必要工作时需要执行的计划。这种情况可能由服务器宕机、机器人运行速度过慢，或机器人使用的应用程序不可用（例如，机器人使用\
    \ Jira，但 Jira 无法访问）等原因导致。在这些及相关情况下，业务的职能必须持续运转。`SDD`（参见第 6 章）中详述的灾难恢复计划，是这些紧急情况下使用的蓝图。\
    \  \n\n如果存在`COE`（卓越中心），该团队会通知技术团队某个机器人无法正常工作。若没有`COE`，业务部门或技术团队自身会通过监控机器人来发现问题，或者业务部门可能通知技术团队。技术团队与业务部门将共同决定是手动运行流程，还是等待机器人遇到的问题解决后重新运行机器人。\
    \  \n"
- fmt: '## Retirement of Bots


    One of the things that must be planned for is the eventual termination of the
    Bot. There are many reasons why a Bot may no longer be required.


    Sometimes, the process is terminated. For a variety of reasons, the process may
    eventually no longer be needed. Perhaps through a merger, the purchasing company’s
    process has incorporated the work of the Bot. Or the Bot may have supported a
    service that the company no longer offers. There are many reasons for a Bot to
    be determined to be no longer necessary.


    In some cases, the current process has changed so significantly that a new Bot
    is required. All organizations are constantly striving for improvement, and processes
    will need to evolve along with them. Adjustments to the Bot can certainly be made,
    but there may come a time when it will be more economical to terminate a Bot and
    replace it with a new one. This becomes a simple “dollars and cents” decision.


    There are situations where the automation software is converted to another software
    tool. Sometimes it may be necessary to convert from one software tool to another.
    This could be because the existing tool is unable to meet the automation need,
    a less expensive tool has been located, or other reasons. The Bot will be “retired”
    for the existing tool and a new Bot built for the new tool. The new Bot may be
    the same as the retired Bot.


    Despite all your careful planning, sometimes the Bot is simply not achieving minimum
    savings. During auditing, you will be able to see how effective the Bot is. Despite
    all your due diligence through the stages as detailed in the previous chapters,
    it’s always possible that the Bot simply doesn’t deliver what it was meant to.
    You may want to make some adjustments, but, even by so doing, you and/or the business
    may come to recognize that the Bot simply isn’t worth its expense. If your organization
    has a COE, someone from there will advise you that they have reservations about
    the Bot’s performance.


    In this situation, you will need to work with the business (and the COE if there
    is one), to determine if some adjustments could be made that would improve Bot
    performance, or if simply terminating the Bot is the most cost-effective decision
    (please bear in mind that cost is not always the determining factor of keeping
    or terminating a Bot. If, e.g., it is providing a service that enhances the customers’
    perception of the company, it may be advantageous to maintain it, even if doing
    so is an expense).


    ### Steps to Retire the Bot


    Retiring a Bot is something that will be done eventually for most Bots. Initially,
    this will probably not be an issue, but as conditions and technology change, there
    will be times when a Bot will no longer be needed.


    The following are the steps leading to and actually retiring a Bot.


    * A request is received from the business to retire a Bot. The retirement of the
    Bot is the decision of the business. Information may have come from the COE that
    the Bot is not performing as expected, but the decision to retire it rests with
    the business.

    * Identify the stakeholders. This is required since many areas are probably dependent
    on the Bot; either they are responsible for providing information to it, or they
    receive information from it.

    * Collaborate by clearly stating which Bot is to be retired and which processes
    are impacted. It is vital that there is no question about the Bot being retired.

    * Determine when execution of the Bot will stop. This will be done in conjunction
    with the business and other pertinent stakeholders.

    * Identify any user IDs or access that must be terminated. Different roles may
    have been able to access various systems when the Bot was in operation, and now
    that access must be terminated. Please note that there may be cases where some
    or all of the access will not be terminated. Work with the business to know these
    situations. Be aware that if the Bot is being discontinued and the process it
    had automated will once again be handled manually, access to some or all of the
    systems may need to be available to individuals.

    * Determine alternative options for when it will stop doing the work. If the process
    is being discarded, no options are required. But if the process is going to continue
    but be performed manually, the business must have sufficient time to make the
    necessary arrangements and operationalize the manual process. This will probably
    have no impact on the RPA team, except in determining when the Bot can actually
    be retired.

    * Obtain the necessary sign-offs for retiring. These would include business representatives
    and the COE (if there is one).

    * Collaborate with COE (if there is one) to actually stop the Bot and release
    all user IDs and resources. If there is no COE in your organization, the technical
    team is responsible for stopping the Bot.

    * Officially declare retirement of the Bot. Send an email to all pertinent stakeholders,
    advising them that the Bot is no longer operational.


    **Pause and Consider**


    As shown, there are several reasons for Bot termination. Can you think of processes
    in your organization that may not be particularly profitable from a balance sheet
    point of view, but are still important? Be sure management is aware of any such
    processes that are being automated, so they understand that there may not be a
    huge financial advantage in the automation, but that it is important nonetheless.'
