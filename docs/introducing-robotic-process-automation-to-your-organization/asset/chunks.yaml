    | --- | --- |

    | Initiative Name | Address and Phone Number Change Process |

    | Sponsor | Mary Smith |

    | Champion | John Doe |

    | **How Does the Process Currently Work?** |

    | A client change request email containing new client information – address and/or
    phone number – is directed to team A for processing by a client service specialist
    (CSS). The team consists of five FTE working on those requests. It takes about
    10–15 minutes per request for a CSS to process it when the address contains no
    errors and about 20 minutes when investigation or further follow-up with the client
    is required. The team leadership sees the opportunity to automate that process
    at least partially and redirect a few CSS to other areas where we are experiencing
    longer service time and higher overtime numbers. In addition, after auditing the
    process requests, we found that there are a high number of human errors in phone
    numbers, having the wrong client’s address changed, errors in the new address,
    or client information not being changed on all the required systems and applications.
    This causes frustration among clients and increases the overall operational cost
    of customer services; since further investigation is required, we are not able
    to easily reach the client. |

    | **What Is the Goal?** |

    | We would like to improve the process quality and reduce the number of CSS working
    on those tasks. The ask is to automate the end-to-end address and/or phone number
    change process. Automation should be able to validate the clients’ credentials,
    change the phone number, and/or validate and then update the information in the
    mainframe systems with the new address. |

    | **Common Business Drivers/Business Criticality** |

    | Operational cost, quality, improved customer experience, company image and reputation
    |

    | **Impacted Business Areas** | **Impacted Systems/Tools** |

    | Client Service Teams | Outlook, PDF forms, Client Information Management System,
    Mainframe System |

    | **Opportunity Type** | **Duration of the Solution?** | **Estimated Operational
    Benefits (FTE Hours)** |

    | Annual | 5 years | 7 FTEs, about 11,830 FTE hours |

    | **Priority** | **Desired Delivery Date** |

    | Must do | 10/01/20xx |

    | **Form Completed Date** | 05/24/20xx | **Prepared by:** | Judith Wilson |


    During discovery phase, the process analyst engaged the SMEs (subject matter experts)
    and was able to capture the end-to-end (E2E) process and identify critical information,
    including:


    - Input types and volumes, tools and systems involved in the process, and resources
    executing the work


    All that information was compiled in the process map, shown above.


    In addition to the process map, a detailed description of the process steps was
    created (please see Appendix 3 for a template). The benefit of having this document
    is to provide any required details that might be critical to decision-makers and
    developers further down at next steps.


    ### Client Address and Phone Number Update


    | **Input** | This is the start of the process. |

    | **Activities** | Team A members access the backlog of requests. |

    | **Output** | The backlog has been accessed. |

    | **Roles** | Data update clerks on team A. |

    | **Notes** | There is no separate “input” here. This is the trigger that starts
    that process and is done daily in the morning. |

    | **Metrics** | Number of new requests per day. |


    1. **Access Team A Backlog**


    | **Input** | The backlog has been accessed. |

    | **Activities** | Each request is forwarded to a clerk for processing. |

    | **Output** | The requests have been forwarded. |

    | **Roles** | Data update clerks on team A. |

    | **Notes** | There must be some awareness of workloads. |

    | **Metrics** | Number of requests assigned per day. |


    1. **Assign Request**


    | **Input** | The requests have been forwarded. |

    | **Activities** | The request form is opened and the request is understood (address
    change, phone number change, etc.). |

    | **Output** | The work required for the request is known. |

    | **Roles** | Data update clerks on team A. |

    | **Notes** | |

    | **Metrics** | |


    1. **Open and Review the Request Form**


    | **Input** | The work required for the request is known. |

    | **Activities** | The account is researched to assure that the number on the
    request pertains to the name of the requestor. |

    | **Output** | It is known if the information in the request pertains to the requestor
    (e.g., account number and name match). |

    | **Roles** | Data update clerks on team A. |

    | **Notes** | |

    | **Metrics** | |


    1. **ID Confirmed?**


    | **Input** | Two possible inputs: The identification is not confirmed (a “No”
    decision from Step 4). The new address is not confirmed (a “No” decision from
    Step 6). |

    | **Activities** | An email is sent to the client, requesting clarification. |

    | **Output** | An email has been sent to the client. |

    | **Roles** | Data update clerks on team A. |

    | **Notes** | A template is used: one for unconfirmed ID and a different one for
    unconfirmed address. |

    | **Metrics** | Number of emails that must be sent per day. |


    1. **Send Follow-up Email to Client**


    | **Input** | Client identification has been confirmed (a “Yes” decision from
    Step 4). |

    | **Activities** | The necessary steps are taken to assure that the client’s new
    address is accurate. |

    | **Output** | It is known if the information in the request pertains to the requestor
    (e.g., account number and name match). |

    | **Roles** | Data update clerks on team A. |

    | **Notes** | |

    | **Metrics** | Percent of unconfirmed addresses per day. |


    1. **Confirm Client’s New Address**


    | **Input** | The new address has been confirmed. |

    | **Activities** | All systems and applications that access the client information
    are updated with the new information. |

    | **Output** | The systems and applications have been updated. |

    | **Roles** | Data update clerks on team A. |

    | **Notes** | |

    | **Metrics** | |


    1. **Make Changes in Mainframe System and Applications**


    | **Input** | The systems and applications have been updated. |

    | **Activities** | Using the template, an email is sent to the client, confirming
    the update of the information submitted. |

    | **Output** | The confirmation update has been sent. |

    | **Roles** | Data update clerks on team A. |

    | **Notes** | |

    | **Metrics** | Number of confirmation emails sent daily. |


    1. **Send Confirmation Email to Client**


    After this information is complete, you will schedule the Governance Committee
    meeting. If the project is approved at this point, you are ready to move to opportunity
    assessment. At this step, you will look in detail at the request. The following
    chapter describes this step.


