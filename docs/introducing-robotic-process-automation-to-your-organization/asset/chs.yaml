  \  *   开发者：开发者可能在早期提供过一些意见，但只要架构师已经参与，这种情况就不太可能发生。现在，开发者将阅读并理解需求，并将其转化为代码。\n  *\
  \   业务负责人：业务负责人是需求方面的专家。他们了解所需的内容，并协助创建项目的迭代版本。\n\n如果使用敏捷（或其某种混合变体），上述角色将都会参与，但不是按顺序依次参与，而是同时参与。`RPA`\
  \ 非常适合采用敏捷方法，因为两者都具有迭代性。\n\n## 不同方法带来的挑战\n\nRPA 团队通常同时与多个业务部门合作，因为他们处理的是可能由不同业务部门拥有的不同应用程序。RPA\
  \ 团队不能为每个特定客户更改自己的方法论，也不能同时使用多种方法论。如果其他业务部门使用不同的方法论，而 RPA 团队使用例如敏捷方法，就会遇到挑战：当其他业务部门使用瀑布式方法时，RPA\
  \ 如何能仅使用一种方法论？\n\n例如，在金融领域，许多业务部门使用瀑布式方法，而大多数 RPA 团队使用敏捷或精益方法。业务部门习惯于在完成的需求文档上签字确认；而敏捷和精益则使用迭代方法，即部分需求被批准后就开始开发。然后\
  \ RPA 团队必须等待所有需求都获得批准才能开始开发。如何将等待时间最小化？\n\n业务部门不必签署整个需求文档，而是应逐步签署各个部分，并在文档中注明该签署并非针对整个需求文档，而仅针对特定部分。当所有需求都完全完成时（请注意，此时大部分开发工作可能已经完成），业务部门可以再签署整个文档。\n\
  \n这需要对业务部门的成员进行培训。只签署部分需求的概念对他们来说是全新的，他们可能对此感到不适应。他们可能会说，他们不可能签署“部分”需求，因为他们需要在批准任何部分之前看到整体情况。当然，对某些人来说，这是一种全新的工作方式。对于分析师和主题专家来说，他们需要考虑如何划分需求文档。他们只需要关注正在被自动化的步骤，但即便如此，他们可能仍希望在批准任何部分之前查看端到端的需求文档。部署也是如此；机器人将被逐步部署。制定一个产品\
  \ RPA 增量开发路线图或计划对于定义 RPA 的各个小块至关重要。这些是最终自动化的构建模块。这个路线图可能包含史诗、用户故事或其他工件。无论它们被称为什么，它们都构成了自动化的逐步路线图。\n\
  \n暂停并思考\n\n每个需求部分都应该足够大，以便能够开发或成为 RPA 的完整功能部分，例如，访问电子邮件帐户以检索电子邮件内容，或者使用 RPA 凭据登录系统/应用程序前端等。每个需求都应该产生一个“最小可行产品”，即使这个小的“块”从未单独交付给客户。如何最好地与业务部门合作，帮助他们理解这种需求的划分或“分块”？\n\
  \n再次考虑我们的案例研究。客户发送一封电子邮件，通知我们他们更改了电话号码和地址。\n\n*   第一次需求迭代：“`Bot` 将打开电子邮件，仅读取电话号码，并在\
  \ Web 应用程序中更新该电话号码。”将要求业务部门批准这第一次需求迭代。\n\n*   第二次需求迭代：“`Bot` 将打开电子邮件，读取电话号码和地址，并在\
  \ Web 应用程序中更新电话号码和地址。”将要求业务部门批准这第二次需求迭代。\n\n*   第三次需求迭代：“`Bot` 将打开电子邮件，读取电话号码和地址，并将电话号码和地址更新到\
  \ Web 应用程序和大型机。”\n\n在这种情况下，第一次需求迭代一旦获得批准，就会被开发和测试。用户验收测试将在需求的所有组成部分都开发完成后才进行。这里的假设是会有增量开发，但只有在所有需求的产品都开发完成后才发布一次。\n\
  \n另一种选择是，第一个需求的产品可以先交付并投入生产，然后是第二个部署，以此类推。这取决于你所在组织选择的模型。\n\n随着每次新的需求迭代，你都在扩大自动化的范围。这对业务部门来说可能是一个新概念，他们过去只习惯于批准整个需求文档。\n\
  \n在某些组织中，部署团队可能使用瀑布式方法，而 RPA 团队使用敏捷方法。\n\n现在我们将讨论几种与 `RPA` 一起使用的常见方法。\n\n\n\n##\
  \ 敏捷方法论\n\n许多 RPA 组织会选择敏捷方法论或敏捷混合模式。敏捷方法中常被新 RPA 团队采纳的核心特点，是其从始至终的迭代式开发特性。\n\n在敏捷环境中，会批准一些初步且非常基础的需求。这便是最小可行产品，意味着功能可运行，但可能远未达到交付客户的程度——它太过简陋。以我们的案例研究为例，一个非常初步的需求可能是：“机器人将读取邮件，提取电话号码，并更新网页应用程序中的电话号码。”业务方会批准这一需求，同时明知将其交付客户毫无意义，因为这仅是客户期望和承诺功能的一部分。但这仍是一项需要完成的基础功能。一旦获批，开发团队便会着手实施。下一个需求可能是：“机器人将读取邮件，提取地址信息，并更新网页应用程序和大型机中的地址。”同样，这仅是客户要求和承诺功能的一个方面，却是绝对必要的。\n\
  \n显然，这与传统的瀑布方法论不同——后者要求所有需求在开展任何其他工作之前就被收集并批准。但正如前文所述，RPA 的最佳落地方式是遵循迭代流程（例如：完成部分工作→向治理委员会汇报→获得（或未获得）继续推进的批准→完成更多工作→再次汇报，以此类推），因此采用敏捷开发方法论是合乎逻辑的。\n\
  \n一个优势在于，可以在项目生命周期早期进行变更。例如，一旦“机器人必须能够从邮箱 XYZ 读取传入邮件”这一需求获得批准，业务方可能决定：机器人不仅应更新地址和电话号码，还应涵盖因结婚、离婚等原因导致的姓名变更。在传统的瀑布方法论中，这将构成重大需求变更，需要返工。而在敏捷环境中，由于需求是逐步获取并批准的，此类变更可以随时进行。\n\
  \n**暂停思考**\n\n请记住，在组织中引入 RPA 可能具有革命性。如果 RPA 团队使用的方法论与组织其他部门不同，则需要就差异领域进行协商。例如，你将如何说服业务方签署批准不完整的需求？\n\
  \n在比较采用敏捷或瀑布方法论的 RPA 项目时，Madan Kumar Divvela 如此表示：“通常，使用 RPA 进行流程自动化从启动到上线只需几周时间。传统的瀑布方法论无法跟上\
  \ RPA 交付的节奏。”^(²²)\n\n### 优势\n\n使用敏捷方法论的优势之一在于，可以轻松进行变更，而不会造成昂贵的延误和返工。Dominic Whaley\
  \ 在《Partnering Solutions》中撰文评论自己的经验时提到：“将工作划分为独立的数据包使我们能够定期评估进展。变更或新需求会被记录并添加到下一个冲刺中。”^(²³)\n\
  \n增量交付的另一个优势是：从上一增量中吸取的经验教训可以轻松融入下一组需求中，无需重写整套需求并再次经历重新审批流程。这样一来，例如在第一组需求的收集或文档编制中你认为可以做得更好的地方，可以在第二组需求的收集或文档编制中得到改进。\n\
  \n这带来了更高的灵活性，并缩短了开发周期的总前置时间。\n\n此外，所有团队成员始终处于忙碌状态。一旦初始需求被文档化，开发人员和业务分析师就可以开始处理 MVP。在此项工作进行的同时，下一组需求正在被收集。\n\
  \n敏捷还使得估算每个需求所需的开发时间更加容易，从而使部署计划更简单高效。\n\n另一个潜在优势在《Blueprint》杂志一篇题为《如何通过敏捷方法实现大规模\
  \ RPA 交付》的文章中有所探讨。\n\n> *在机器人流程自动化的敏捷方法中，业务流程在开发开始之前就经过设计和优化。这使得大型组织能够完全标准化和优化端到端、复杂且多层次的业务流程——这些流程正是自动化真正投资回报率（ROI）的所在。同时，这也为它们提供了宝贵的机会，将这些流程与更广泛的业务目标、企业或监管约束、政策及控制措施联系起来。*^(²⁴)\n\
  \n### 可能的缺点\n\n在敏捷环境中工作需要培训。这不仅涉及新的工作方式和全新的术语表，还包括新的思维方式。仅仅更换术语但沿用相同的方法，并不能让一个组织变得敏捷。人类天性不喜欢改变，尤其是当人们当前的工作方式已经非常高效且有效时。敏捷要求业务和技术双方的人员以截然不同的方式思考需求、开发等问题。尽管开发团队通常能迅速接受敏捷，但业务方往往犹豫得多。\n\
  \n**暂停思考**\n\n如果你的组织并不熟悉敏捷，但你认为 RPA 最适合采用这种方法论来构建，你将如何说服人们接受它？你是否预见到技术团队可能接受，但业务方会有阻力？你如何让双方都看到使用敏捷的优势？\n\
  \n这并非暗示只有敏捷对 RPA 有效；情况绝非如此。虽然许多组织正逐渐脱离传统的瀑布方法论，但也有许多组织并未如此。RPA 同样可以使用瀑布方法论来建立。\n\
  \n\n\n## 瀑布方法论\n\n在 RPA（机器人流程自动化）中采用瀑布式方法（需求、开发、测试、部署），仅仅是复制了在任何传统环境中项目执行的模式。一旦需求被捕获并批准，开发便开始了。整个过程以一种非常传统的方式进行。\n\
  \n让我们再次审视我们的案例，并考虑其在 RPA 中的瀑布方法背景下是如何运作的。它将遵循传统模式：收集并批准需求，随后进行开发、测试和部署。手工流程依然被自动化，所以最终结果保持不变；只是实现方式有所不同。每个阶段结束后会举行治理会议，以决定是否获得批准继续推进。\n\
  \n**优势：** 大多数组织对这种非常传统的方法论感到熟悉和舒适。它没有意外情况；是久经考验且行之有效的（即便不是当今最高效的项目开发方式）。对于某些组织而言，这可能是将\
  \ RPA 引入组织的最安全途径；引入 RPA 会稍微撼动企业的现状——你不想再被敏捷的巨浪淹没！\n\n瀑布方法适用于小型、简单的 RPA 项目。如果流程非常简单直接，复杂性低，那么瀑布方法流程通常会取得成功。更复杂的手工流程则更适合在敏捷环境中实现自动化。\n\
  \n**可能的劣势：** 这可能是一个慢得多的过程。在所有需求被收集和批准之前，开发工作不会开始；在所有开发完成之前，测试不会开始。如果在测试过程中发现错误，或者业务方决定增加某个需求，就必须进行大量的返工，随之而来的是不可避免的延误。\n\
  \n这里有必要公平指出，大多数比较 RPA 项目中敏捷与瀑布应用的文献都强烈倾向于使用敏捷方法。虽然这意味着你确实应该考虑敏捷，但在为你的组织做决定之前，还有许多因素需要思考。\n\
  \n## 精益软件开发\n\n精益软件开发是作为传统瀑布方法的一种替代方案出现的，后者采用了严格、文档驱动和传统的开发方式。精益思维原则基于丰田生产系统（TPS），并已成功应用于许多制造和产品开发组织。精益的哲学理念是通过消除所有不增加价值的浪费来缩短开发时间。\n\
  \n正如丰田生产系统（TPS）的主要缔造者之一大野耐一所解释的概念：“我们所做的一切，就是审视从客户下订单到我们收到现金的时间线。我们通过消除不增加价值的浪费来缩短这条时间线。”^(²⁵)\n\
  \n丰田花了 30 年时间来完善其方法论和实践，使其变得有效且高效，达到今日之水平。然而，直到麻省理工学院（MIT）对汽车行业进行了为期五年的研究，将精益认定为美日之间巨大生产力差异的根源后，它才获得主流的关注和认可。^(²⁶)\
  \ 这项研究为生产体系定义了一个新术语——“精益”（因为通过消除浪费，它对各方面的投入需求都会减少）。精益生产方法论和思维主要描述在詹姆斯·沃麦克、丹尼尔·琼斯和丹尼尔·鲁斯合著的《改变世界的机器》一书中。\n\
  \n在过去几年中，精益在软件行业也变得流行起来。它主要源于玛丽·波彭代克和汤姆·波彭代克合著的《精益软件开发：软件开发经理的敏捷工具包》一书。^(²⁷) 这本书从不同的角度研究精益生产系统，并采用和裁剪了适用于软件开发的精益原则和工具。它的流行度正在迅速增长，这种增长源于其在识别和消除浪费以及快速响应变化中的客户与市场需求方面的有效性。\n\
  \n精益方法论成功的关键在于将实践者的思维方式转变为精益思维，而不仅仅是采纳和实践精益工具。支撑精益思维的有五个核心概念：\n\n1.  *价值*由客户定义，是客户愿意为之付出的。清楚理解价值是什么至关重要。在\
  \ RPA 中，产品负责人可以被视为“客户”。\n2.  *价值流*是对当前为将产品或服务从客户请求到交付的整个流程中所需的每个动作（包括增值和非增值的）的可视化呈现。在生命周期早期开发的过程图，是价值流的一种基础但通常也足够用的版本。\n\
  3.  *流动*代表着人员、材料或所需物品如何从一个步骤移动到下一个步骤，直到价值交付给客户。通过从价值流中消除浪费来实现持续的流动至关重要，这样开发或服务才能顺畅地流向客户。这将带来生产力和效率的提升，使流程更加精益。这将大大缩短交付给客户的时间；不再需要数月才能交付，可能缩短到数周甚至数天。你为配合过程图所创建的文档将捕获这些信息。\n\
  4.  *拉动*意味着客户可以在需要时订购产品或服务，并且这些产品或服务可以在短时间内交付。这将确保在没有需求之前不构建任何东西，从而降低客户可能不会使用的库存成本；所有创建库存的努力都将白费。你需要决定下一个要处理的工作项是什么。\n\
  \n\n\n5. *完美*可能是精益思想中最重要的概念。它要求将持续流程改进作为组织文化的核心部分。追求完美是通过一个可重复的过程实现的，在此过程中，任何浪费都能被持续识别并消除。这是一段漫长的旅程，需要从员工、支持团队到领导者等各个层面付出坚持不懈的努力。正如马克·克劳福德所言：“精益专家常说，一个流程在经历至少六次价值流图分析之前，都算不上真正的精益。”^(²⁸)\n\
  \n精益的首要指导原则是从流程中识别并消除浪费，以最大化客户价值。请注意，浪费的概念相当宽泛，具体取决于价值交付流程和环境。让我们以软件开发领域为例。例如，浪费可定义为：\n\
  \n*   客户未使用的额外功能\n*   设计不佳、未通过测试且需要返工的功能\n*   等待需求或支持\n*   未完成的工作\n*   任务切换，同时处理多个开发项目\n\
  *   额外的处理步骤或代码行\n*   未被利用或未被充分利用的员工知识与创造力\n\n精益软件开发，可以看作是上述概念和原则在软件开发实践中的应用。因此，精益软件开发的主要目的和目标，是在预算内，以尽可能短的交付时间提升客户价值。\n\
  \n**暂停并思考**\n\n精益源于制造业，但已演变为一种流行的软件开发方法论。它如何在你的组织中发挥作用？你认为可能的优势是什么？你认为高层管理人员是否会对其潜在的益处印象深刻？\n\
  \n## 与敏捷方法论的重叠\n\n我们认为，精益和敏捷是同一种方法论的两种名称。仔细观察敏捷软件开发实践，不难发现它与精益概念的密切相似之处。\n\n例如：\n\
  \n*   敏捷中的代码审查和内建质量，支持了精益方法论所基于的基石之一。该原则不是将低质量产品推向后续流程，而是在流程早期发现并修复缺陷，而不是等到整个产品准备发布时才发现问题。\n\
  *   Scrum 使用精益的“拉动”原则来平衡工作量，并实现系统内的平滑流动。团队在每个冲刺（迭代）中，根据团队能力和容量，从待办列表中拉动任务。\n*  \
  \ 敏捷（Scrum）像精益一样，通过创建流程来识别并消除软件开发周期中的浪费，从而专注于消除浪费。\n*   敏捷使用看板技术来帮助管理产品开发，并加强团队与利益相关者之间的沟通。\n\
  *   敏捷的各种仪式，如每日站会、计划会议或回顾会议，其起源都可追溯到精益。\n\n我们观察到一个团队，该团队为多个内部客户处理繁重的应用支持任务。该团队使用\
  \ Scrum 框架来开发新功能和解决方案，但使用看板来处理战术性的、基于临时需求的支持任务，以修复问题并解决其产品中的故障。团队最初使用简单的纸笔看板来即时跟踪事项和记录新的传入请求。在这种特定情况下，需要为团队带来更高的可见性和工作量管理。随着时间的推移，看板不断发展，变得更加复杂，具备了跟踪团队绩效的能力，并能更容易地识别和量化浪费，特别是在等待开发事项和返工领域。看板从纸笔形式迁移到了数字格式，然后被拆分为两个不同的功能，一个用于开发新产品和服务，另一个用于支持现有的已发布解决方案。看板随着团队在敏捷方法论中日益成熟而共同演进。\n\
  \n毫无疑问，敏捷方法和精益软件开发在为客户创造价值方面是相辅相成的。然而，我们认为精益和敏捷之间存在关键差异。\n\n敏捷在本质上似乎更具战术性，其重点多放在技术实践、仪式和技巧上，以实现高效且有效的软件开发。\n\
  \n在我们看来，关于需要建立怎样的企业级运营框架和程序才能使敏捷采纳成功，讨论得很少。因此，要成为一个敏捷企业组织，所需的重大变革必须从高层发起并推动。H. Smits\
  \ (2007)指出：“在软件开发项目中大规模实施敏捷概念过程中积累的经验告诉我们，目前流行的敏捷软件开发方法（如 Scrum）如果不进行变革，就无法扩展到项目集、产品和组织层面。这些方法变革的基础可以在精益原则中找到……”^(²⁹)\
  \ 在这一点上，组织战略成为敏捷流程能够有效运作的主要驱动力。\n\n相反，精益是从高级管理层视角应用的，其目标是优化整个组织中所有活动的各个方面。\n\n从这个角度看，精益可以被视为一种自上而下的方法，而敏捷则是自下而上的。\n\
  \n如果没有战略层面的支持，敏捷的采纳会受到抵制变革的组织力量的压制。通过从高层引入精益，在敏捷环境中工作的开发者与其利益相关者之间因实践和原则冲突而产生的紧张关系将会得到缓解。\n\
  \n我们认为，敏捷框架通常不关注软件开发所处的周边商业环境。它主要提供一套供开发者使用的实践，可以被视为对精益方法论的补充。另一方面，精益原则可以应用于任何范围，从具体的软件开发实践，到整个组织——软件开发只是其中一小部分。^(³⁰)\n\
  \nPoppendieck 和 Poppendieck (2003, 2006) 将精益原则视为不随时间改变的核心真理，而软件开发工具和实践则是这些原则在特定情境下的应用。这些工具和实践应根据环境进行相应调整，并随着情况的发展而变化。因此，他们建议应将精益思想视为指导原则，用以发展和调整敏捷实践。^(³¹)\n\
  \n踏上精益/敏捷之路可能很艰难。我们认为，为企业制定一份在其商业环境中试行精益和敏捷实践、同时最小化运营风险的采纳或扩展路线图，将非常有用。请记住，在组织内部创建一个精益/敏捷孤岛并不会带来巨大的突破。然而，它能够带来足够的证据，以便在向整个组织扩展时学习。请记住，丰田花了\
  \ 30 年时间来完善其生产体系；这是一段需要毅力和大量努力的旅程。\n\n**暂停并思考**\n\n关于敏捷和精益，有许多需要考虑和交叉的部分。你认为它们中哪一个更适合你的组织？在你的组织中，你可以与谁讨论敏捷和精益原则，以获取更多意见？\n\
  \n\n\n## DevOps\n\nDevOps 一词将开发与运维的实践和工具整合为一个框架，旨在提升组织定义、开发和部署 IT 解决方案及服务的能力，其速度远超传统软件开发方法。\n\
  \nDevOps 的核心原则在于打破开发与运维团队之间的孤立壁垒，将双方工作纳入同一框架，使其在整个 IT 解决方案生命周期（从开发、测试到部署和运维）中协同合作。换言之，DevOps\
  \ 将人员、流程和技术紧密结合，持续为客户创造价值。在此框架下，两个团队通过建立围绕信息共享的强文化伦理，借助一系列聊天工具、定期设计会议、问题解决会议及小组讨论，保持频繁沟通。这营造了一个信息能快速在开发者、运维及支持团队等所有相关利益方之间流动的环境。\n\
  \n> **提示**  \n> 信息孤岛有时因个人或经理“垄断”信息而产生。在消除它们时需谨慎行事。\n\n为避免解决方案部署周期过长，开发者以相互独立发布的小增量形式进行工作。为此，DevOps\
  \ 采用持续集成（`CI`）和持续交付（`CD`）流水线，并结合自动化技术，将代码从开发与部署的一个阶段推进到另一个阶段。对于`CI`，关键目标是尽早发现并修复缺陷，以提升交付质量和速度。`CD`实践则确保可在短时间内构建出可运行的软件，并随时准备好在无需人工干预的情况下可靠发布。为快速交付软件，DevOps\
  \ 尽可能依赖自动化工具。高度自动化能确保以更快的速度和更高的频率进行生产环境发布的测试与准备工作。当`CD`得到妥善实施时，开发者始终拥有已构建、测试完毕且可进入生产环境的产物。\n\
  \n鉴于 DevOps 流程的持续性特点，将其视为一个无限循环（图 9-1）更容易理解。该循环包含开发侧和运维侧的各个阶段，并展示了它们在整个 DevOps 生命周期中相互关联的关系。\n\
  \n![../images/513218_1_En_9_Chapter/513218_1_En_9_Fig1_HTML.png](img/513218_1_En_9_Fig1_HTML.png)\n\
  \n**图 9-1** DevOps 无限循环³²\n\nDevOps 能够与敏捷软件开发完美共存，是大型 IT 驱动型转型项目满足业务需求的绝佳框架。DevOps\
  \ 可以解决制约业务增长的挑战，包括新软件发布的延迟；有时延迟过长，以至于软件发布时已无法满足业务需求。在当今技术快速变革的快节奏环境中，收入严重依赖 IT 能力的组织必须保持灵活并能迅速调整。时间至关重要，任何延迟都可能使组织的市场地位在短短数月内从领导者沦为追随者。\n\
  \n因此，DevOps 的主要优势在于：\n\n-   更高的创新速度。\n-   更好地适应不断变化的市场需求。\n-   快速交付价值，以建立或维持竞争优势。\n\
  -   更高的产品/服务可靠性，在更小的发布中更容易保证质量。\n-   技术与运维之间更好的协作；开发与运维通过整合工作流程和共担责任，像一个团队一样工作。\n\
  \n此外，DevOps 在精益和敏捷实践者中日益流行，并随着人工智能驱动的解决方案在几乎我们做的所有事情中提供帮助（从审阅咨询、搜索分析数据、执行数字任务、提出决策到事件管理）而不断发展。这意味着更智能的解决方案需要更短的开发和部署周期，更高的解决方案可靠性和内建质量，以及从业务需求识别到可行\
  \ IT 解决方案的无缝过渡。\n\n让我们重新思考我们的案例研究。客户发送一封电子邮件，通知我们他们更改了电话号码和地址。DevOps 的持续集成和交付可能如下所示：\n\
  \n-   第一次迭代开发与发布：“机器人将读取电子邮件、读取电话号码，并在 Web 应用程序中更新电话号码。”这些步骤将实现自动化；Web 应用程序和大型机上的地址更改以及大型机上的电话更改仍将手动处理。将要求业务方面批准并接受这第一次迭代。\n\
  -   第二次迭代：“机器人将读取电子邮件、读取地址，并在 Web 应用程序中更新地址。”大型机上的电话和地址更改仍将手动更新。将要求业务方面批准并接受这第二次迭代。\n\
  -   第三次迭代：“机器人将读取电子邮件、读取电话，并在大型机系统中更新电话号码，大型机上的地址更改仍将手动进行。”\n-   第四次迭代：“机器人将读取电子邮件、读取电话号码和地址，并在大型机系统中更新电话号码和地址。”\n\
  \n每一次新的迭代，你都在扩大自动化的范围。无需冗长的需求收集、审批步骤、RPA 开发和测试解决方案，就能更快地从概念方案转变为实际方案。这些较短的周期可以防止需求变更和解决方案范围蔓延——这两者都是团队在处理复杂大型解决方案时常见的问题。这种增量式和持续交付的方法对于业务方来说可能是一个新概念，他们习惯了只一次性批准整个需求文档、测试并接受端到端的自动化。\n\
  \n> **暂停与思考**  \n> 思考混合版本。例如，RPA 可能负责开发，但由其他团队收集需求、进行部署等。这在你的组织中可行吗？如果需要，你将采取哪些步骤来确保成功？\n\
  \n无论你选择什么方法，RPA 的主要挑战在于，团队在组织中通常是新成立的，并且通常遵循敏捷或精益方法。现有的业务伙伴和技术团队可能仍处于瀑布模式，或正在转型中，而敏捷或精益模式及其特定的词汇、实践、规则、指南等，对他们来说可能非常陌生，因此令人生畏。你如何架设现有方法与\
  \ RPA 将引入的新方法之间的桥梁？\n\n我们本章前面讨论了四种方法。现在我们需要看看如何将新的 RPA 方法融入到现有的公司方法中去。\n\n首先，让我们看看一些挑战：\n\
  \n-   RPA 团队将讨论冲刺、待办项、产品增量等业务方可能完全不熟悉的术语。\n-   RPA 团队将向业务方提交一份非常有限的需求文档，即前面讨论过的\
  \ MVP（最小可行产品）。但业务方可能期望看到完整的需求。\n-   业务方可能会在项目启动一两个月后，根据项目的复杂程度，才分配资源来审阅需求，他们相信记录需求需要那么长时间。然而，在项目的大部分生命周期中，实际上都需要该资源的参与。\n\
  \n\n\n## 规划未来\n\n让我们考虑一下，RPA 团队更多是基于角色而非基于团队的。我们这样说的意思是，虽然有一个核心开发团队，包括一名业务分析师和一名系统分析师（根据组织的不同，可能还有其他或不同的角色），但还会有其他角色参与特定的\
  \ RPA 项目，而非所有项目。例如，在我们的案例研究中，我们需要客户服务部门的人员从头到尾参与团队。这个人（或这些人）将以互动方式帮助起草需求，因此在项目的大部分过程中都需要他们。对于不同的项目，比如一个确保商品税收符合政府法规的项目，则不需要客户服务部门的人员，但需要公司法规团队的人员。\n\
  \n因此，在这种模式下，固定团队成员（例如开发人员、流程分析师）留在该团队中；其他所需资源则根据需要共享。项目完成后，共享资源将返回其原始团队。\n\n> **提示**\
  \  \n> 共享资源可能不需要全职在团队中。应根据具体项目确定需求。\n\n一个潜在的缺点是，共享资源在全职返回其原始团队后，将无法解决出现的问题。您必须计划如何处理这些资源所擅长的领域内的问题。\n\
  \n> **暂停与思考**  \n> 在您的组织中，需要采取哪些具体步骤来确定引入 RPA 时的最佳方法论？您需要与谁协商？需要获得谁的支持？您将如何获得这种支持？\n\
  \n如上所述，有多种开发方法论可供选择。但您不必感到不知所措；审视您组织中当前的情况，确定您认为最适合新 RPA 计划的方法论，并努力实施它。但请记住，看似对您的组织有巨大潜力的方法最终可能需要进行修改。这没有问题！理想情况下，RPA\
  \ 是迭代的；您在过程中学习。如果某些方法不起作用，请理解原因，然后要么消除障碍，要么朝不同的方向前进。\n\n在下一章中，我们将讨论 RPA 如何不断演变，并提供最重要的趋势供您参考。\n\
  \n---\n\n"
- "# 10. 规划未来\n\n虽然 RPA 相对较新，但由于需要自动化重复性、手动流程，它正在席卷技术公司。但技术日新月异，RPA 也随之演变。了解即将到来的趋势对您很重要，这样您可以决定是否以及何时将它们引入您的组织。我们将在此讨论\
  \ RPA 最重要的“演进”。\n\n`RPAAS`、`process mining`和`intelligent processing`是 RPA 的扩展。\n\
  \n## `RPAAS` – 即服务型 RPA\n\n目前，大多数公司拥有自动化工具的原生客户端。在未来（这种转变已经发生），RPA 的所有基础设施都将迁移到云端。正如*Robocloud*所述，“使用`RPA\
  \ as a service`意味着您的公司不必购买自己的服务器、许可证或专业服务。”³³\n\n其基本优势在于可以利用云的所有好处。这些包括：\n\n*  \
  \ **增加容量**：例如，假设您在一台机器上运行十个`Bot`。如果需要增加更多`Bot`，您将需要增加内存、处理速度等。使用`RPAAS`，您拥有足够的灵活性来更快地增加容量和复制服务器。您可以复制`Bot`运行的机器/服务器，从而更快地复制您的工作力量。\n\
  \n*   **增加灵活性**：例如，我们知道`Bot`许可证可能很昂贵。目前，如果您立即需要 2 个`Bot`，并且您预计在未来 6-12 个月内可能还需要\
  \ 2 个，您需要购买 12 个许可证并为其创建基础设施。使用`RPAAS`，您可以利用云，并在几分钟内复制机器，因此您可以随时增加或减少`Bot`数量。通过与业务部门合作制定合理的业务和技术战略，您有可能实现显著的节省。\n\
  \n*   **快速适应新功能**：有时需要非常迅速地引入新功能。使用`RPAAS`，您可以快速适应新的发布版本和功能，因为您可以按需扩展基础设施。\n\n>\
  \ **暂停与思考**  \n> 基于您目前对 RPA 的了解，您认为`RPAAS`如何能使您的组织受益？您需要采取哪些步骤（例如，基于历史信息清晰地展示潜在的成本节省）来说服管理层采取下一步行动？\n\
  \n\n\n## 流程挖掘\n\n我们在本书中始终强调，RPA 适用于逻辑简单、无需太多智能或人工干预的重复性流程。这是因为大多数流程都涉及安全性和准确性问题。流程必须足够简单，才不会影响安全性和准确性标准。根据我们的经验，流程通常由希望简化运营并提升效率的业务负责人介绍给我们。因此，他们可能会确定一两个他们知道极其重复且看似适合自动化的流程。但通常，这些流程会因某种原因而受到关注；或许是因为执行该流程的员工正在表达不满，因为，我们直说吧，做这种重复性工作可能会很无聊！\n\
  \n业务部门中可能还有其他几个同样重复的流程，但或许它们目前并未引起管理层的注意。也许它们是月末或年末流程，而非日常流程。也许它们只是偶尔被用来清理某种积压的请求。无论原因如何，它们都可能是极佳的自动化候选对象，但目前尚未被管理层识别为这样的对象。\n\
  \n流程挖掘工具旨在分析流程，并利用内置逻辑识别和帮助确定哪些是自动化的最佳候选对象。企业应提供尽可能多的流程，而不仅仅是那些“问题突出”的流程，并将其输入流程挖掘工具，该工具将识别出最佳的自动化候选对象。\n\
  \n在更简单的层面上，对于较小的组织或更简单的流程，流程挖掘工具也可以作为识别自动化候选对象的起点。该工具可以突出显示重要的业务功能及其相关的流程。\n\n流程挖掘工具还能带来巨大益处的另一个领域是流程之间的交汇点。流程挖掘工具有助于确定这些交汇点中哪些可以实现自动化。\n\
  \n[托马斯·H·达文波特](https://hbr.org/search%253Fterm%253Dthomas%2520h.%2520davenport)和[安德鲁·斯帕尼](https://hbr.org/search%253Fterm%253Dandrew%2520spanyi)在《哈佛商业评论》中撰文，简洁地总结了流程挖掘的优势：\n\
  \n> *流程挖掘软件可以帮助组织轻松地从企业交易系统中捕获信息，并提供关于关键流程如何执行的详细——且基于数据驱动的——信息。它在工作完成时创建事件日志：收到订单，交付产品，进行付款。这些日志使人们能够了解以计算机为媒介的工作是如何实际发生的，包括谁做的、花费了多长时间，以及它如何偏离平均值。流程分析为流程创建关键绩效指标，使公司能够专注于优先改进的步骤*。^(³⁴)\n\
  \n请记住，尽职调查仍然必不可少；工具的性能取决于其输入，而自动化决策仍需由人力资源做出。\n\n一旦流程挖掘工具选定了流程，将遵循本书中所示的“机会评估”之后的所有阶段，包括与治理委员会定期开会，以批准或不批准进入下一步。\n\
  \n**暂停与思考**\n\n对于拥有高度复杂流程的大型组织，流程挖掘可以极大地加快识别潜在自动化候选对象的速度。这在你的组织中会有益处吗？你需要与谁交谈才能更好地了解流程挖掘对你的组织潜在的好处？\n\
  \n## 智能处理\n\n在当前的 RPA 中，我们构建逻辑和简单规则，将手动步骤转换为自动化。智能处理可以看作是“一种处理非结构化文本数据的方式。文档认知利用人工智能、机器学习、认知科学和自然语言处理来索引结构化、半结构化和非结构化数据。”^(³⁵)\n\
  \n通过智能处理，我们正在构建 IQ 机器人。利用人工智能和机器学习，结合 RPA 技术，我们在构建机器人时为规则增加了智能。一个例子是识别文档中的手写文本；目前，包含手写信息的机器人输入将被转交给人工处理；机器人无法读取手写内容。人工智能技术可以帮助读取此类文本，并具有可校准的准确率百分比，从而提高机器人的性能。与任何部分自动化的流程一样，机器人无法读取和/或理解的内容都可以转交给人工处理。\n\
  \n乔·沙利文在《Capacity》中撰文，列出了智能文档处理的七项好处。^(³⁶) 他说 IDP：\n\n1.  促进自动化，因为它有助于流程改进\n2. \
  \ 通过整理文档、数据录入和信息验证简化合规性\n3.  高效省力，因为它减少了以文档为中心的工作流程中的人工干预\n4.  支持可扩展性，因为它可以应用于组织中不同领域的各种应用程序\n\
  5.  通过减少处理文档所需的时间和降低劳动力成本来节省开支\n6.  通过在极短时间内处理大量数据来提高速度\n7.  通过大大减少处理文书工作的时间来提升客户体验和满意度\n\
  \n**提示**\n\n正如沙利文在其文章^(³⁷)中所提到的，一些管理团队倾向于忽视与客户体验相关的软成本。不要犯这个错误！仅仅因为你可能无法用具体金额量化客户体验，任何组织如果希望在当今市场取得成功，就必须始终以客户体验为核心。\n\
  \n\n\n## 超自动化\n\n当今行业内热议的即将到来的技术趋势之一是超自动化。据高德纳咨询公司预测，超自动化在不久的将来，即未来几十年内，将对扩大业务流程自动化产生最深远的影响。\n\
  \n正如我们之前所提到的，`RPA` 的最佳应用场景是由员工执行的、高度重复、大批量的手动任务。不幸的是，传统的 `RPA` 软件存在局限性。它无法理解非结构化数据形式的输入，也无法自主学习。由于这些限制，任何\
  \ `RPA` 解决方案仅适用于基于规则的任务，这些任务需要人工干预，将其以代码形式转换为机器人的语言。这导致了几个弊端。首先，流程的任何变更都需要熟练的开发人员修改代码，然后测试并将变更部署到生产环境。这会拖慢业务敏捷性并增加运营成本。其次，取决于行业特性，基于规则的流程可能只占整体业务运营的一小部分，从而限制了数字化处理的扩展，并难以实现降低运营成本的目标。\n\
  \n那么，需要更多批判性思维的任务呢？如果组织中的大多数流程都需要分析不同的数据来产生输出结果，又该如何处理？这些流程能被自动化吗？\n\n超自动化的概念超越了简单、规则驱动、可重复的处理流程；它并非单一工具，而是除了\
  \ `RPA` 之外，结合了多种更高级处理技术的综合体，例如智能文档处理（`IDP`）、光学字符识别（`OCR`）和智能字符识别（`ICR`）。它将预测建模、机器学习、深度学习、自然语言处理等人工智能驱动的解决方案以及其他智能处理技术整合到一个系统中。与传统的\
  \ `RPA` 自动化相比，超自动化能够将自动化的范围扩展到复杂且通常涉及高度认知的流程，这些流程过去需要人工干预才能做出决策，从而实现业务流程的端到端自动化。其主要使命是通过将人类操作者从低价值操作中解放出来，持续扩大自动化端到端运营决策流程的规模。由于其特性，超自动化会在组织内部创建一个独立运行的数字化运营子集，以替代那些严重依赖人工处理、通常需要员工在场操作的常规运营。\n\
  \n因此，在不久的将来，运营领导者需要准备重新定义其员工的职责、所需的技能组合以及他们看待工作的方式。超自动化在各行各业的普及可能会让人类员工变得可以被取代。但我们认为，没有理由如此悲观，至少在很长一段时间内不会。我们相信，作为超自动化一部分的人工智能解决方案将重新定义和重塑劳动力队伍，是的，某些工作将被完全自动化，但也会创造一些新的工作岗位，而其他一些岗位则需要进行调整。从人工智能解决方案的本质和局限性来看，未来可能消失的工作主要与客户服务相关，例如接待员、旅行代理、收银员、银行柜员等。我们预测，在非常复杂的决策运营中，手动处理在未来仍将存在。然而，我们设想人工智能将更多地作为人类决策的辅助工具，而非主要驱动者。在人机协作模型中，人工智能将处理输入数据并提出建议，或提供带有理由的决策方案，但最终决策权仍在人类手中。\n\
  \n这种人工智能与人类伙伴关系的延伸，是在人类做出决策时，将学习循环反馈给人工智能，从而形成一个持续的学习周期。就像我们人类通过时间的积累从经验中学习一样，机器也将向人类学习。与传统的基于监督算法的训练相比，所提出的方法将加速人工智能的学习过程，但最重要的是，它提高了决策模型的适应性和融入变更的速度。随着我们周围的业务条件快速变化，人工智能需要不断更新当前的标准和业务规则，以避免模型漂移，并防止由此导致的性能不佳和错误的决策结果。因此，建立持续的学习循环，让人类持续地将决策标准反馈给人工智能模型，可以避免将人工智能从运营中移除进行冗长的检修和调整，从而确保业务运营的连续性。\n\
  \n此外，根据风险水平和不良决策的影响程度，可以对人类-AI 模型进行调整，使得高置信度的决策可以委托给机器，让人类专注于低置信度的决策。当然，问题在于使用什么参数以及根据何种标准来定义置信度水平。\n\
  \n超自动化可以带来诸多优势，这些优势能够提升组织绩效、增强竞争力、加速创新，并改善员工福祉。\n\n这些优势包括：\n\n- **降低运营成本**：通过自动化重新设计和替换手动、低复杂度的流程。\n\
  - **加速数字化转型**：组织能够将其业务运营目标与技术投资协调一致。\n- **提升竞争优势**：在日常运营中引入新技术，因为可以更快地生产出更高质量、更低成本的产品，从而提高客户满意度。\n\
  - **提高业务决策质量**：人工智能技术需要访问数据；这意味着可以轻松提取和使用与业务相关的信息，从而创造一个有效的、基于证据的决策环境。\n- **人工智能驱动技术将加速创新**，提升跨组织的业务敏捷性。\n\
  - **改善技术与业务运营团队之间的协作**。超自动化需要将通常处于孤立状态的多项技术和业务运营整合到一个生态系统中。\n- **提升员工满意度**：因为员工能够更专注于附加值更高、更有趣、更具挑战性和多样化的任务。创造一个智能的工作环境，让员工受到挑战，而不是将时间浪费在枯燥、重复、低认知和低价值的任务上，这将提高他们的生产力。\n\
  \n超自动化对于那些拥有众多遗留系统、手动操作繁重且自动化处理水平相当低的大型层级组织来说，具有巨大优势。`RPA` 机器人可以将遗留系统与超自动化中使用的其他技术解决方案集成起来。通过实现这一点，这些组织将能很快看到在提升业务运营的敏捷性、有效性和效率方面取得的实际成果。\n\
  \n需要牢记的是，由于组织和技术上的限制，作为超自动化组成部分的不同技术在实施过程中可能会遇到挑战。最常见的挑战包括：\n\n- 使用基于云的、由人工智能驱动的解决方案可能需要使用客户的个人数据，这可能会增加隐私泄露的风险。\n\
  - 人工智能驱动的解决方案可能会继承偏见，这些偏见要么来自用于训练的数据，要么因为使用了某些假设而嵌入到算法中。\n\n\n\n## 超自动化中的挑战与陷阱\n\
  \n将超自动化应用于定义不清且理解不足的流程既困难又毫无意义。本章前面提到的流程挖掘工具，可以帮助提升流程的可见性和理解程度。\n\n将超自动化应用于满足极其复杂和独特需求的客户，则需要定制化的解决方案。如果为了提升客户满意度而针对特定客户需求定制流程步骤和结果，就会增加复杂性并依赖人工处理。对于任何组织而言，在客户满意度与通过标准化实现流程简化之间找到恰当的平衡点至关重要。\n\
  \n一种规避风险的组织文化，会因鼓励避免潜在错误而形成保守惯性，从而减缓创新和自动化技术的采用。被赋权的员工应能够探索和试验新的自动化技术，并迅速预见其商业效益。关键在于确保获得端到端技术与业务运营领导层的支持，赢得他们的信任，并与他们协商尝试新的、不熟悉的方法。\n\
  \n从市场上不断变化和演进的产品中，选择合适的自动化解决方案组合颇具挑战。我们认为，组织应将自动化视为一种运营原则，而不仅仅是附加功能或工具。\n\n我们预见，在不久的将来，`RPA`能力将成为工作流软件开箱即用功能中自动化产品组合的一部分。届时，无需单独购买并将其集成到技术架构中。\n\
  \n既然你已经拥有了开启 `RPA` 之旅所需的一切，你需要了解除上述内容之外，你可能还会遇到的一些挑战。第 11 章将帮助你避免我们在经验中遇到的一些问题。\n\
  \n脚注 1 2 3 4 5 6\n\n"
- "# 11. 挑战与陷阱\n\n一旦你为 `RPA` 计划奠定了基础，并识别出了一些愿意且渴望将其部分流程实现自动化的“早期采纳者”，同时建立了治理政策并确定了委员会成员，就该展望未来，看看可能会遇到哪些挑战。通过理解我们最初不成功的做法，你可以尽量减少一些常见错误。\n\
  \n贯穿全书，我们提到了在启动 `RPA` 之旅时可能遇到的许多挑战。其中一些我们能够成功规避，就像看到飞驰的子弹并设法躲开一样。另一些则是我们正面撞上，然后在事后才解决。\n\
  \n研究这些内容将有助于你在致力于自动化组织内的手动流程时，能够顺利推进：\n\n- **期望轻松获得管理层的认可。** 面对削减成本和提高效率的机会，我们原以为管理层至少会欢迎新的\
  \ `RPA` 计划。我们错了。虽然一线员工有时会因担心失业而不情愿，但我们对来自管理层的诸多阻力感到惊讶。一些管理者似乎认为 `RPA` 只是一个新流行词，是风靡一时的解决方案，很快会带来一阵兴奋后便悄无声息地消失。他们见过太多其他“颠覆性”解决方案正是如此。另一些人则似乎并非担心自己的工作，而是担心自己的“地盘”受到威胁；他们手下有\
  \ `X` 名员工，不希望这个数字减少。如果一个 `Bot` 要承担他们员工现在正在做的一部分工作，他们可能就会失去这些员工，因为他们可以被重新分配到组织的其他岗位或被解雇。\n\
  \n**提示** 如果你严格按照第 2 章中的信息行事，就能避免这个挑战。\n\n- **识别错误的流程进行自动化。** 识别正确的流程看似简单：流程 `XYZ`\
  \ 是重复性的，那么我们就把它自动化。但仔细审视后发现，这并不像我们想的那么简单。如前所述，当你初次确定一个需要自动化的流程时，你对其了解并不多。但在我们最初的一些尝试中，我们错过了一些“警示信号”。例如，某个中层管理人员是否深度投入到当前执行的该流程中？流程自动化是否会触犯某位不愿承认其领域有待改进的经理的利益？或者仅仅是某个极其复杂的流程，本可以在初步沟通中就判断出来？我们及时学会了如何更好地辨别这些问题。\n\
  \n- **试图自动化整个流程，但实际上只有部分流程适合自动化。** 这与上一点有关。一个包含多个步骤的流程可能非常手动且高度重复，但这并不意味着所有步骤都能在当下实现自动化。业务负责人可能期望整个流程都实现自动化，但这往往不合理。请记住，即使只自动化流程的一部分，也可能显著节省时间或成本，或大幅改善客户体验。审视你已绘制出的端到端流程，考虑时间的节省，如果只有部分能实现自动化且能取得良好效果，那么就只自动化那部分。与业务负责人合作，确定未来需要做些什么，才能使流程中的更多步骤成为更好的自动化候选对象。\n\
  \n- **在缺乏必要专业知识的情况下尝试构建 Bot。** 实际负责构建 `Bot` 的开发人员必须具备相应的知识。热情固然重要，但不能替代经验。确保团队中至少有一名在\
  \ `RPA` 方面非常资深的开发人员。他们可以指导和培训经验不足的开发人员。\n\n\n\n**暂停思考** 你能预见你的组织中存在哪些潜在的“地雷”？哪些人对自己的领域特别具有保护意识？如果你发现他们所在领域存在流程优化的机会，你会如何与他们接洽？\n\
  \n-   **治理委员会会议。** 最初，我们会在会议前几天将包含申请表、商业案例、风险评估及其他文件的文档包提交给治理委员会成员。委员会成员和申请者（们）会被邀请参加每周会议来审议该请求。\n\
  \n我们发现，通常没有人会在会议前阅读任何文档。因此，我们不再提前发送详细信息，而是将信息总结成一到两页纸，并在会议上进行展示。我们停止了详细文档的发送，但保留其作为我们的记录，只在会议开始时提供该请求的高层概述。该概述包含以下内容：\n\
  \    -   请求的简要描述（例如，将当前需要三个人每周花两天时间完成的流程 XYZ 实现自动化）。\n    -   节约成本的回顾（例如，这每年将释放\
  \ 2,250 工时 [3 人 × 每周 15 小时 × 每年 50 周]）。将此数据乘以贵公司的小时费率。\n    -   对自动化流程复杂度的评估（例如，高、中、低）。\n\
  \    -   对开发所需时间的预估（例如，三周）。\n\n负责初步估算的架构师应在场回答问题。\n\n**暂停思考**\n\n遗憾的是，人们在会议前常常不阅读所需信息。你在所在组织中的经验如何？决策者会做好准备吗？如果没有，你们通常如何在会议中做出决策？你将如何为决策者准备好参加\
  \ RPA 治理会议？\n\n-   **邀请申请者参加治理委员会会议。** 我们最初认为这有一个好处，即申请者可以回答治理委员会成员可能提出的关于该请求的一些问题。但这些问题可以由业务流程分析师或架构师来回答，而且如果请求未获批准推进，这样做也无法给任何人提供一个向申请者委婉解释的机会。现在，如果请求被治理委员会拒绝，申请者会收到一封类似下面的电子邮件：\n\
  \    -   “（称呼），您好，\n\n感谢您近期提出的将流程 ABC 自动化的请求。我们已审阅您的请求，并评估了自动化的成本、可积累的节约、需求的紧迫性以及其他因素。目前，我们必须优先处理优先级更高的请求。因此，您的请求将被搁置，以便定期重新评估。\n\
  \n如果您知道其他可能与此一同实现自动化的流程，请告知我们。\n\n如果您对此有任何疑问，请与我联系。\n\n此致\n\n（姓名）\n\n（职务）”\n\n在治理委员会会议上，讨论通常更为直接，委员会成员可能会说该流程不值得自动化。这会挫伤申请者提交其他请求的积极性，并为\
  \ RPA 蒙上阴影。\n\n有时，某个流程并不适合自动化，但公司的其他领域或许能提供一些帮助。在这些情况下，这些信息应包含在给申请者的邮件中，并且 RPA 团队应与该其他领域接洽，并将该请求转交过去。对于这个特定的请求，除了定期重新评估所有被搁置的项目外，不需要做进一步的工作。\n\
  \n**暂停思考**\n\n你如何最好地告知一位请求将其流程自动化的业务流程所有者，其请求已被拒绝？请记住，你不想让他们觉得自己的请求本身不合理，只是相关数据不足以支撑继续推进。\n\
  \n-   **未能在早期获取充分信息。** 有时，即使我们与申请者合作完成了申请表，仍然缺少信息。我们在后续改进了表格并消除了这个问题，但要意识到申请者可能并不掌握所有必要信息。这就是为什么与主题专家会面至关重要，他们是了解流程实际运作方式的人，而不是文档中所述的方式。这两者之间通常存在显著脱节。\n\
  \n**提示** 请记住，模板是用来根据你的特定需求进行定制的。你可能希望最初“按原样”使用它们，看看哪些对组织有效，哪些无效。\n\n-   **未能充分应对因自动化导致失业的担忧。**\
  \ 有时这可能是一种真实的恐惧；管理层可能会将减少员工人数视为自动化的一个优势。没有人愿意协助别人导致自己丢掉工作。\n\n**暂停思考** 任何特定自动化的目标可能是为了减少员工人数。你将如何处理这个问题？你将如何从那些可能完全意识到自动化其工作会使他们失业的人那里获取关于流程的协助和信息？你能从人力资源部门或高级管理人员那里获得什么帮助和支持？\n\
  \n-   **信赖现有的（旧的）文档。** 当引入新流程时，通常会有配套的文档。这些文档解释了流程的目的，更重要的是，说明了流程应该如何在理想状态下运作。然而，流程*应该*如何运作与它在日常实践中*实际*如何运作之间往往存在重大脱节。有时，当收到自动化请求时，会提供这些文档。但与\
  \ SMEs（即实际操作流程的人）一起绘制流程图至关重要。一个流程的实际运作可能与它应有的方式大相径庭，而且流程存在的时间越长，它可能离最初文档记录的情况越远。务必要根据*当前的实际执行情况*来绘制流程图。\n\
  \n**提示** 与 SMEs 一起绘制流程图将确保你理解流程的实际运作方式。不要依赖任何现有的文档。\n\n-   **选择了错误的工具。** 在选择 RPA\
  \ 工具时，有许多因素需要考虑，包括满足你的需求需要多少编程工作、它的可扩展性如何、它的变更记录以及提供更新功能的速度如何、以及它需要多少维护工作？对管理层来说，还有一个重要问题是成本。仅仅因为某个工具昂贵并不意味着它是最好的。做好调研：上网查找、与行业同行交流、查阅期刊，以找出最适合你的\
  \ RPA 工具。请记住，对一个组织来说理想的工具，未必是每个组织的最佳选择。做好功课，避免这个陷阱。\n\n-   **业务方的过度自信。** 一旦机器人启动并运行，它总有可能在某个时刻出现故障。在这种情况下，必须有足够了解该流程的人员做好准备，以手动执行流程，直到机器人再次运行。通常，会指派一到两个人来处理机器人无法处理的异常情况（例如案例研究中提到的无效客户\
  \ ID），他们通常也是在机器人停止运行时接手工作的人。但我们发现，有时需要向我们业务合作伙伴再次强调这一点。\n\n这并非可能出错的所有情况的详尽清单。你可能还会通过自己的失误来补充它！但这些是我们遇到或预见的一些关键挑战，了解它们对你来说很重要。\n\
  \n\n\n"
- '# 12. 总结


  恭喜！你现在不仅对 RPA 及其对组织的意义有了基本了解，还掌握了启动项目并确保其成功所需的细节。


  总结一下，首先，什么是机器人流程自动化（RPA）？它其实就是将重复性的手动流程自动化。每个组织都有这样的流程。也许是一家为其产品开具账单的制造公司。销售人员销售商品并将订单输入系统。文员根据序列号或其他识别号查找商品的名称和价格，查找客户的姓名和地址，打印发票，将其放入信封，然后放进发件箱。接着他们处理下一个订单，日复一日地重复同一流程。一个“机器人”可以完成这些工作：读取订单，查找客户的姓名和地址，在空白发票上填写字段，并将其发送给可能配备了折叠发票并装入信封功能的打印机。然后，每天一两次，邮件收发室的人可以取走发票并寄出。负责这些繁琐任务的文员们就可以解放出来，去处理其他真正需要动脑筋的工作。第
  1 章让您对 RPA 有了出色的理解。


  如果您已确定需要将组织内的流程自动化，那么您将如何获得高级管理层和一线员工的认同？如果一切进展顺利，高级管理层可能不想改变。而一线员工可能担心自己的工作安全（如果自动化的目标之一是减少人员数量，这可能是真正值得担忧的问题）。通过阅读第
  2 章，您现在知道如何解决这些问题了。


  RPA 项目的治理应该是什么样子？应该如何构建？应该涉及哪些角色？谁应该赞助该项目？赞助人的职责是什么？项目将在什么样的总体框架下运作？它必须是有结构的，但同时也要足够灵活，以适应不断变化的需求。这该如何实现？正如您阅读第
  3 章时所了解到的，您已经找到了这些问题的答案。


  一旦获得中高层管理人员的批准，并确定了一些早期采用者之后，您如何寻找适合自动化的流程？哪些关键要素可能使某个手动流程成为自动化的良好候选？正如您在第 4 章中所学到的，那些基本上以相同方式重复执行的手动流程，应该被评估是否适合自动化。


  您如何征集可能实现自动化的流程？一旦 RPA 项目的消息在组织内公开，可能会引起很多人的兴趣。这非常好，但必须有一个有序的方式来让他们提交请求。每个请求必须包含一些基本信息，以便您进行初步评估。第
  4 章讨论了申请表，附录（附录 1）中提供了模板。请根据贵公司的需求自由调整，但要尽量保持简单。您不希望人们因此感到畏惧。


  当某个手动流程被确定为可能适合自动化的候选流程时，您需要判断它是否确实适合。您需要确定该流程的变异程度，以了解它是否能够由“机器人”处理。如何做到这一点？您还需要估算在时间上将节省多少成本（我们都知道，时间就是金钱）。确定这一点后，您需要估算自动化的成本，以便计算投资回报率（ROI）。除了
  ROI 之外，还有其他考虑因素吗？如果您的竞争对手比贵公司更快地将产品推向市场，而管理层发现你们的一些客户正转向竞争对手，那该怎么办？即使自动化节省的资金可能微乎其微，您如何评估为了更具竞争力而将部分流程自动化是否值得付出这些成本？第
  5 章为您提供了做出这些决策所需的工具。它也有助于理解，尽管初步评估可能表明该流程绝对值得自动化（自动化成本将节省资金：ROI 良好等），但随着您推进单个自动化项目的生命周期，将会发现更多信息。其中一些信息可能表明自动化成本将远高于初步估计，或者节省的成本将更低。此时，必须做出是否继续项目或止损取消项目的决定（这是赞助人发挥作用的一个领域）。这样做并非失败；我们的
  RPA 项目设计用于通过增量步骤和相应的里程碑来评估每个阶段的信息和工作完成情况。在*机会评估*阶段可能已经完成了出色的工作，但随着开发人员和其他人进行*解决方案设计*（第
  6 章），他们将发现更多信息，其中一些可能表明开发中存在未预料到的费用，或者节省的成本低于最初估计。现在发现这些信息，比在整个项目上花费巨额成本、超出预算，然后才发现解决方案未能按预期交付要好得多。


  如果在获得指导委员会批准进入下一步骤后，您在新步骤中发现复杂性比最初想象的要高，或者节省的成本将远低于预期，该怎么办？您从第 5 章中了解到，这仅仅表明 RPA
  项目正在按预期方式运作。它是增量式的：您获取一些初步信息，然后决定是否进入下一步。如果做出决定，您将获得更多信息，然后再次就推进做出决策。在任何时候，您都可能了解到一些会降低完成项目可行性的信息。这没关系；这种情况时有发生，并非失败。在项目中进行一小段距离后了解到某些初始假设不准确，远胜于花费时间和精力完成整个项目，却在最后才得知预期的收益无法实现，或者创建解决方案的成本远超该解决方案所能节省的成本。


  解决方案设计中需要哪些角色参与？他们将承担哪些具体职责？第 6 章讨论了以下角色及其相应职责：


  *   RPA 技术交付负责人

  *   架构师

  *   开发人员


  正如该章所讨论的，根据您组织的不同情况，可能还需要其他角色。关于如何确定是否存在这些角色以及他们的职责是什么的提示，文中均提供了详细说明。




  一旦团队组建完毕，并确定了合适的自动化候选项目、设计好新的机器人后，就需要进行部署。机器人部署的许多组件可能与您通常部署新软件的方式有所不同。第 7 章将为您详细介绍这些信息。


  在第 3 章中，我们介绍了集中式、分散式和中心辐射式模型。在第 8 章中，我们将详细阐述这些模型，并附上其优缺点的关键信息，以帮助您选择最适合组织的模型。


  当今存在许多开发方法论：瀑布模型、敏捷开发、两者的混合体、精益开发、DevOps 等。所有这些方法论都可有效地应用于 RPA 项目中。不同方法论之间存在一些共性和差异，第
  9 章提供了必要的详细信息，帮助您决定哪种方法论最佳，或者，如果组织已强制规定了某种方法论，如何在其框架内最佳地融入 RPA。本章还帮助您了解在此过程中可能遇到的一些障碍，例如，当您需要与某个业务部门成功协作时，该部门所使用和熟悉的方法论可能与您为
  RPA 选择的方法论不同。


  RPA 的优势之一在于其可扩展性；随着组织内部的变化（例如，引入新应用；公司规模扩大），RPA 可以随之改变。David Chappell 在其文章《理解 RPA
  可扩展性：以 Blue Prism 为例》中这样描述 RPA 的可扩展性：


  > "什么是 RPA 可扩展性？一种思考方式是关注以下三个方面：

  >

  > *   **处理增加的负载。** 这包括支持大量 RPA 机器人协同工作，以执行多个业务流程实例。它还包括一种可以轻松更改每个机器人正在执行的业务流程的方式，使它们能够在不同时间处理不同的流程。

  > *   **扩大使用范围。** 可扩展性的这一方面意味着支持拓宽 RPA 在组织中的使用方式和场所。例如，您可能从自动化某个业务部门的一个流程开始，然后通过为其他业务部门的流程创建
  RPA 解决方案来扩展。

  > *   **增加访问广度。** 自动化业务流程通常需要访问新技术，例如新应用程序或集成技术。您的流程本身也可能需要被其他软件访问。这些类型的扩展访问可以通过可扩展性的视角来看待，因为它们都能让您的
  RPA 解决方案得到更广泛的应用。"^(³⁹)


  没有哪种方法论或技术会一成不变；它们要么不断演进，要么从舞台上消失，被更好的方案所取代。RPA 也不例外。在第 10 章中，我们将讨论在将 RPA 引入项目时需要注意的最新趋势。您可能会从
  RPA 的基础知识开始，但第 10 章会为您清晰地展示未来项目的发展方向，以及它可能如何为您的特定组织带来益处。


  任何新方法论的引入都伴随着风险。在第 11 章中，我们将解释我们曾遇到的一些情况，这些情况导致我们调整原本认为需要走的道路，转而选择一条更顺畅、更有效的道路。我们曾认为非常直接的事情，仍然让一些人对
  RPA 的有效性产生质疑。当然，本章并未列出您可能遇到的所有挑战，但遵循其指导，您将能避免我们曾经历的一些令人头疼的问题。遵循整本书中的信息，应该能让您少一些烦恼！


  最后，本书以一个详细的附录作为结尾。您可以在此找到前几章中描述的所有表单的模板，以及关于如何使用、何时使用以及如何填写它们的完整说明。当然，您已经了解到这些模板是任何新
  RPA 计划绝佳的起点，但时间和经验将帮助您了解是否需要以及如何对它们进行定制，以满足您特定组织的需求。不过，我们建议您初始时按照本书提供的模板直接使用。


  总而言之，您现在已掌握在组织中成功引入机器人流程自动化计划所需的一切。祝您在踏上 RPA 之旅时一切顺利！




