- "# 1. 引言\n\n\n\n## 概述\n\n几十年来，我们不断听到关于技术“快速迭代”、“技术环境日新月异”的讨论，以及企业需要保持“领先地位”才能在竞争中生存甚至保持相关性的呼声。各种方法层出不穷，其中像六西格玛这样的方法至今仍广受欢迎且行之有效，而另一些方法，例如能力成熟度模型（及其短命的继任者`集成能力成熟度模型`），在经历了一段可观的运行周期后，便逐渐被淘汰。\n\
  \n所有这些方法都曾（或仍在）服务于特定目的。许多组织已成功采用了这些模型。但流程改进是一项持续性的工作。在当前流程的基础上，此时此刻，我们还能做些什么来提高效率、惠及客户并提升盈利能力？一个选择是`机器人流程自动化（RPA）`。\n\
  \n克里斯蒂娜-克劳迪娅·奥斯曼在*经济信息学*杂志中撰文描述了`RPA`：\n\n> 新兴数字工具的出现支持组织通过提高效率和敏捷性、或减少错误和成本来改进业务流程。`机器人流程自动化（RPA）`工具旨在使用经过训练的机器人来执行人类员工的重复性手动任务。这不同于其他传统软件，因为机器人通过前端与其他信息系统进行通信。`RPA`不仅有助于减少员工的工作量和错误，还能节约成本。\n\
  \n总而言之，`RPA`意味着将重复性、手动流程交给“机器人”来执行，从而将原本从事这些任务的人员的时间解放出来，让他们能专注于更重要的问题——那些通常需要人类洞察力和决策能力，而不仅仅是遵循惯例和重复动作的问题。这些涉及认知思维的更复杂任务往往与客户直接相关。此外，自动化流程能减少人为错误和代价高昂的返工。它还能让员工从事需要思考的任务，而非简单重复机械行为，从而提升士气。\n\
  \n## 暂停思考\n\n将某些流程自动化，能让人们专注于更复杂的流程和任务，以及需要决策和/或创造力的工作。一个`机器人`只会精确执行被编程的任务，而这些通常是不需要思考的工作。想想这将如何帮助一项新的`RPA`计划获得支持。\n\
  \n### 优势\n\n`RPA`的优势显而易见。正如蒂莫西·德里斯科尔在*战略财务*中所言：\n\n> 如果设计得当，软件机器人可以每周 7 天、每天 24\
  \ 小时以低于人类的成本运行，同时提供更高质量和可扩展的产出。这一系列优势可以构成一个极具吸引力的价值创造商业案例。`RPA`计划通常针对那些劳动密集型和交易密集型流程，在这些流程中，人们执行的是重复性任务，这些任务可以被重新设计为由机器人或软件工具执行的基于规则的活动。`RPA`计划的好处可能包括但不限于表^(¹)中的关键衡量指标。\n\
  \n| 效率/成本指标 | 有效性/质量指标 | 风险/合规性指标 |\n| --- | --- | --- |\n| `%人员/成本缩减` `%生产力提升`\
  \ `%日处理量增加` | `%准确率提升` `%周期缩短` `%客户满意度提升` | `%运营风险降低` `%自动化控制增加` |\n\n如图所示，`RPA`能够实现任何组织管理层都欢迎的效益。我们将简要讨论这些效益如何得以应用。关于如何实现这些效益及其他好处的详细信息，包含在后续章节中。\n\
  \n### 实际应用\n\n为了达成这些及更多效益，`RPA`可应用于多种多样的流程。在判断一个流程是否易于自动化时，需关注四个关键特征：\n\n1.  流程是否具有重复性？\n\
  \    *   是否需要针对不同的客户、员工等反复执行相同的操作？例如，如果发票是手动创建的，文员必须获取所购物品或服务的名称及其成本；他们必须找到购买者的姓名、地址和账号，并将所有信息填入发票模板。然后将其放入信封并送至收发室进行邮寄。\n\
  \n2.  自动化该流程的成本是否会超过继续手动执行的成本？\n    *   虽然手动流程可能非常重复，但实现其自动化的成本可能比继续手动执行更高。表面上看，这样的流程并非自动化的理想候选。\n\
  \n3.  自动化是否为保持竞争价值所必需？\n    *   节省资金并非自动化流程的唯一动机。或许自动化流程的成本会超过节省的金钱，但为了维持竞争优势，仍应将其自动化。\n\
  \n4.  流程自动化是否能更好地帮助组织履行政府法规？\n    *   大多数行业都需遵守各种政府法规。将流程自动化，以确保完成必要工作并准时提交报告，可以带来巨大益处。\n\
  \n在评估任何流程的自动化潜力时，对问题 1 的回答为“是”是继续调研的必要条件。流程的重复性是自动化的关键。尽管自动化的成本可能超过其带来的财务收益，但这并不将该流程排除在自动化考虑范围之外，因为可能存在超越短期财务考量的竞争或监管方面的收益。\n\
  \n\n\n### 书籍结构\n\n如何运用这些原则来获得理想效益？本书旨在帮助 RPA 新手在所在公司成功实施 RPA 项目。前两章阐述了成功实施 RPA 所需的基础工作。其余章节则描述了\
  \ RPA 实施各具体阶段的活动，以及如何进行监控以确保成功。\n\n**第 1 章 概述。** 介绍 RPA：什么是 RPA、如何在 IT 组织中发展壮大，以及它能为您的组织带来哪些益处。\n\
  \n**第 2 章 初步准备。** 在任何规模的组织中成功引入 RPA 项目需要做哪些准备？在开始前必须落实的关键要素是什么？如何识别对成功至关重要的“早期采用者”？有哪些隐藏陷阱，又该如何规避？\n\
  \n**第 3 章 运营模式——治理、赞助与框架。** 需要多少结构？这种结构应具备多大的灵活性？为确保项目审批即使情况变化仍保持有效，应设置哪些关卡？谁是对\
  \ RPA 项目负责的关键利益相关者？为什么在后期阶段取消项目不算“失败”？\n\n**第 4 章 机会识别。** 如何征求自动化机会？如何最好地引入自动化重复性手动流程的想法？哪些表格能帮助您最佳地识别机会？此阶段需要哪些人员（何种角色）参与？\n\
  \n**第 5 章 机会评估。** 在确定了一些可能的自动化候选方案后，如何对其进行评估？您应关注哪些方面？需要哪些文档？您应向治理委员会提交哪些内容？如何处理模棱两可的情况（“如果……这可能是个好机会”）？此阶段需要哪些人员（何种角色）参与？\n\
  \n**第 6 章 解决方案设计。** 方案获批后，如何设计解决方案？由谁参与？需要哪些文档？\n\n**第 7 章 解决方案部署、维护与退役。** 方案设计完成后，部署前需要做什么？必须采取哪些步骤来确保最大的成功可能性？需要哪些文档？此阶段需要哪些人员（何种角色）参与？\n\
  \n**第 8 章 组织结构。** 您的新 RPA 项目应采用何种最佳结构？您需要了解组织中现有的结构。我们详细介绍了三种最常见的结构：集中式、分散式和中心辐射式。\n\
  \n**第 9 章 开发方法论与框架。** 不同组织使用不同的方法论，例如传统的瀑布式方法论、敏捷方法论或混合方法论。无论您的组织使用何种方法论，我们都将描述其中的共通之处，以及如何确保\
  \ RPA 成功，而不受方法论限制。\n\n**第 10 章 未来规划。** 随着技术变革，您将如何适应？同时，随着流程变化，现有机器人可能需要哪些调整？即使在未来充满不确定性的情况下，您如何构建应对变化的能力？本章提供了必要的指导，以确保您的新\
  \ RPA 项目能够在未来持续带来效益。\n\n**第 11 章 挑战与陷阱。** 在实施 RPA 项目的过程中，您会遇到许多挑战。我们在前几章已经详细介绍了其中一些内容，但本章将对其进行总结。管理层三心二意的支持有何风险？您将如何应对那些感觉工作可能被自动化取代的一线员工（如果这种威胁真实存在，您又将如何处理）？如何最有效地与卓越中心（COE）合作？如果您的组织中没有\
  \ COE，这些职责又将由谁来承担？\n\n**第 12 章 总结。** 在本最后一章中，我们将重点介绍 RPA 优势的一些关键亮点，以及为什么 RPA 可能是您组织的理想选择。我们还会简要提一下，在您开始引入\
  \ RPA 时需要注意的一些事项。\n\n**附录。** 附录包含了本书所述的所有必要文档。这包括但不限于：申请表（基本起点——最终将由请求者填写，但最初您需要与请求者共同完成，因为他们对此不熟悉）、风险评估表、可行性评估表、需求文档（功能性和非功能性）模板以及其他诸多内容。当然，这些内容可以根据您的特定需求进行调整，但它们为您提供了一个重要的起点。起初，最好按原样使用它们。随着您在使用\
  \ RPA 过程中积累经验，您将对其进行调整，使其在您的特定组织中发挥更大效力。\n\n虽然本书将成为任何 RPA 计划的持续参考，但建议初次阅读时从头到尾通读一遍。这样，刚接触\
  \ RPA 的人就能对全书有很好的概览，并在遇到问题时知道在书中何处查找更详细的信息。\n\n祝您在开启 RPA 之旅时一切顺利！\n\n脚注\n\n## 2.\
  \ 初步准备\n\n\n\n## RPA 的需求\n\n在任何组织中引入 RPA 计划通常源于以下三个来源之一：\n\n1.  高层管理人员了解 RPA 并认为它将为组织带来益处。这可能源于阅读了讨论\
  \ RPA 的商业期刊、与另一家组织的同行随意交谈，或各种其他渠道。\n2.  中层管理人员了解 RPA，并认识到其所在领域有许多重复的手动流程可以通过自动化实现更高的效率、更少的错误以及降低的成本。\n\
  3.  技术负责人认识到 RPA 的重要性。随着 RPA 的日益普及，技术领导者的讨论也愈发频繁，并且它定期出现在各种期刊上。\n\n根据 RPA 引入到组织的原因，初始步骤会有所不同。\n\
  \n**暂停并思考**\n\n为什么要在您的领域中引入 RPA？是前面提到的原因 1、2 或 3，还是它们的组合？也许高级管理人员听说过 RPA 并征求您的意见：您认为它是否会对您的部门有益？如果有益，体现在哪些方面？您认为它可以在整个公司范围内使用吗？或者，您可能被要求在其部门进行试点。\n\
  \n### 高层管理决策\n\n无论引入 RPA 的原因是什么，其成功实施的关键在于利益相关者的支持。是否有一位高级管理人员下令引入 RPA？如果是这样，在开始对\
  \ RPA 进行任何投入（时间、资源、基础设施等）之前，高级管理团队的其他关键成员必须认同这一概念。此外，更重要的是，中层管理人员必须看到其价值。\n\n**提示**\n\
  \n不要忽视中层管理人员和员工支持的重要性。这一层面的阻力可以迅速有效地破坏 RPA 计划。\n\n如果需要争取高级管理团队的其他成员，请做好准备工作。您需要从较高层面展示几项内容，这将有助于您说服他们相信\
  \ RPA 对组织的益处：\n\n1.  **行业标准**：许多组织正在转向自动化那些无需思考的手动、常规任务。例如，在金融服务领域，如果每次客户进行交易时都需要通知其财务顾问；这就是一个可以自动化的流程。可以从数据库中读取客户姓名，匹配到财务顾问，找到其电子邮件地址，然后自动完成模板并通过电子邮件发送给顾问。\n\
  \n进行必要的研究，了解 RPA 在行业中的实施情况。\n\n**暂停并思考**\n\n在许多组织中，员工工作努力，专注于手头的任务。他们通常看不到自己的工作如何实现自动化；他们可能多年来一直以相同的方式做着同样的工作。他们看不到哪些步骤可以被消除或流程可以如何改进。您将如何帮助人们寻找自动化的可能性？\n\
  \n2.  **组织内的具体示例**：您组织中有哪些具体流程可以从自动化中受益？您可能需要进行一些研究来发现这些流程。这将涉及与其他中层管理人员及其团队合作，这也有助于获得这一层面的支持。\n\
  \n**暂停并思考**\n\n对许多人来说，自动化任务意味着裁员。您将如何减轻这种担忧？或者，如果这确实是可能发生的情况，您将如何处理？各级管理者都不愿看到自己的团队规模缩减。他们的团队成员也会抵制任何可能让他们丢掉工作的措施。然而，人员减少可能是目标甚至是意外结果，这必须得到解决。\n\
  \n3.  **重新培训和重新部署员工的机会**，对工作将要被自动化的员工进行再培训和再部署，这也可能带来好处。\n\n**暂停并思考**\n\n在许多组织中，将人员重新部署到其他需要更多思考而非常规手动任务的责任，是自动化的目标之一。\n\
  \n解决这个问题的一种方法是制定人力资源人才发展战略。自动化可以释放资源，用于重新培训员工并将其转移到其他领域，在那里员工可以运用其技能，而不是从事死记硬背的手动任务。为了达成此目标，您需要在组织中与谁沟通？\n\
  \n4.  **益处**：当您讨论行业内的自动化以及组织内的一些示例时，请量化或定性说明潜在益处。这可能包括但不限于以下任何或全部内容：\n    *   客户满意度：客户（内部或外部）将获得更及时的信息。\n\
  \    *   提高准确性：自动化流程中不再有“人为错误”。\n    *   减少返工\n    *   节约成本：减少人员编制，更有效地利用人员。\n \
  \   *   竞争优势：能够比竞争对手更快地向客户提供信息，或至少与其保持同步。\n    *   节省时间：所需信息能更快速地传递给决策者。\n    *\
  \   更及时地遵守政府法规：耗时的报告可以自动化并及时发送给相应的政府机构，从而减少或消除罚款风险。\n    *   提高员工士气，带来更好的工作绩效并降低人员流动率。\n\
  \n请记住，最初预估的益处仅仅是初步估计。不要过度承诺。指出您所在行业的总体趋势和益处，突出组织中可能实现自动化的候选流程，并给出潜在益处的总体估计。*注意不要保证一定会产生某些特定效益*。这样做，一旦这些效益未能实现，就百分百会导致整个项目被取消。在这一点上，您是依据行业成果和自身专业知识给出估计。但\
  \ RPA 对您的组织来说是全新的，需要时间和实践来提高您的估算准确性。\n\n**提示**\n\n您无需保证特定结果来获得支持；目前您也无法做到。解释潜在益处，并建议先在少数流程中尝试这个新方案。\n\
  \n如果高级管理层已强制要求实施 RPA 计划，那么在开始实施之前，您必须获得中层管理人员的支持。使用下一节中的信息来做到这一点。\n\n### 中层管理构想\n\
  \n无论想法的来源如何，某些步骤将是相同的。此情况下的主要区别在于，您没有高级领导者支持这一想法。这是一个挑战，但并非无法克服。\n\n同样，有必要对 RPA\
  \ 进行整体研究，特别是针对您所在行业进行必要的研究。既要看到收益，也要看到缺点。找到以下问题的答案：\n\n*   您所在行业内部有哪些类型的流程正在实现自动化？\n\
  \    *   为什么它们会被自动化？\n*   结果如何？\n*   在您的行业中成功实施 RPA 面临哪些挑战？\n    *   这些挑战是如何被克服的（如果已被克服）？\n\
  *   如何在您的组织中克服这些挑战？应该与哪些关键人物就此进行沟通？\n\n**提示**\n\n前面已经提到了一些挑战，包括员工对裁员的恐惧。\n\n一旦您彻底调查了\
  \ RPA 在行业内的收益和实施情况，您就需要确定盟友。谁将是“早期采用者”？这些人是您需要争取过来支持该计划的人。（注意：如果高级管理层已强制要求实施 RPA，请使用这些步骤来获得中层管理人员的支持）。\n\
  \n**暂停并思考**\n\n\n\n## 面向早期采用者\n\n对于早期采用者（愿意几乎立即开始使用 RPA 的人），请首先考虑你身边可能对此感兴趣的同行。谁在管理那些充斥着重复性、手动流程的领域？谁因为员工必须执行重复性手动流程而缺乏与客户打交道的时间而感到沮丧？识别这些人将是您成功的关键。\n\
  \n与同行进行非正式交谈有助于你了解谁可能最感兴趣。一旦你确定了几个人选，就直接说明来意。向他们解释你正在考虑向高级管理层提议引入 RPA。提出以下问题：\n\n\
  *   你负责的流程中，有哪些是重复性、手动的，可能适合自动化？\n*   你是否愿意用你的一个流程来试点 RPA？\n*   你的团队会如何看待 RPA？是担心裁员，还是渴望减少在这些手动流程上花费的时间，将更多精力投入到“启发性任务”（需要真正思考的任务，而不仅仅是执行那些机械重复的工作）上？\n\
  *   他们尝试自动化流程的可行时间范围是什么？\n\n### 暂停与思考\n\n现阶段，你究竟将如何推进 RPA 的实施尚不可知，但你仍然需要有一个清晰的策略。人们会对不确定性感到不安，并倾向于固守已知和熟悉的事物。你将如何阐述一个并非步步具体、但又能勾勒出整体计划的策略呢？\n\
  \n> **提示：** 虽然此时你不需要一群中层管理者的支持，但获取至少几个人的支持将能加强你面向高级管理层的论据。\n\n整理你收集到的信息。如果你对获得中层管理层的必要支持没有信心，那就不要继续推进！继续努力建立这种支持，但在没有获得积极支持的情况下贸然前进只会导致失败。\n\
  \n假设你获得了足够数量中层管理者的支持（具体数量因公司规模而异），请为高级管理层准备一份简短的演示文稿。它应包含以下信息：\n\n*   RPA 概述\n \
  \   *   它是什么\n*   行业内 RPA 成功案例回顾\n*   行业内 RPA 面临的挑战回顾\n    *   讨论你预计如何克服这些挑战\n*\
  \   愿意试点该项目的管理者名单\n    *   潜在的可自动化流程列表\n\n### 暂停与思考\n\n向高级管理层提供多少信息才算恰当？请记住，高级管理层成员不需要所有细节信息来做决策。他们需要在宏观层面理解你想做什么、你将如何做、以及这对他们有何影响。在准备和进行演示时请牢记这些要点。创建演示文稿后，要愿意对其进行修改，删除中层管理可能需要、但高级管理层不需要的细节。\n\
  \n准备好回答问题，但如果对方问到你需要进一步研究的问题，也要大方承认。然而，如果你的演示保持在适当的层面（参见“暂停与思考”），问题应该会很少。但如果确实有问题，请找到答案并尽快通过电子邮件发送给高级管理层团队。如果在寻找答案过程中，你之前的某些假设或信息有所改变，务必传达这些更新。\n\
  \n> **提示：** 如果你目前无法获得支持，那就做更多研究。了解行业内的同行在做什么，了解他们的成功与失败。在未获得必要支持前，不要尝试实施新项目。这样做可能会导致失败。\n\
  \n一旦获得高级管理层的批准——这只会发生在你获得部分中层管理者支持之后——你就准备好可以开始了。\n\n请记住，无论是什么契机促使你在组织中引入 RPA，获得高级管理层和中级管理层的支持至关重要。\n\
  \n### 引入 RPA 的不同契机\n\n在组织中引入 RPA 的原因有多种：可能是因为某位高级管理人员熟悉了该概念并看到了其对组织的潜在优势。也可能是一位中层管理者，应对大量重复性手动流程，认识到自动化将非常有益。或者，一位技术领导者看到了如何利用其技能来提高效率。你将\
  \ RPA 引入组织的方式取决于引入的原因。其总体的益处是相同的：提高先前手动执行任务的自动化水平。但成功引入 RPA 需要你知道如何最好地呈现它，而了解引入原因是决定如何开始的关键。\n\
  \n一旦你做到了这一点，就可以准备进入下一步了。\n\n#### 技术领导者认识到 RPA 的价值\n\n将采用与第 2 点相同的步骤：寻找早期采用者，识别潜在项目，并向高级管理层进行有说服力的演示。然而，这可能更具挑战性。高级管理层成员通常更关注业务而非技术，可能将此视为技术人员兴奋的“某个酷炫的新东西”。你需要确保突出强调对业务的好处。\n\
  \n> **提示：** 在第 4 章中，我们介绍了一个案例研究，并在此章及后续章节中演示 RPA 的每个阶段如何应用于该案例。在与高级和中级管理层合作时，你可能会发现回顾该案例研究很有帮助。\n\
  \n\n\n"
- "# 3. 运营模式 – 治理、赞助与框架\n\n治理、赞助和框架将是成功的关键因素。我们将描述典型组织中应涉及的各个角色及其职责。\n\nJames Chen\
  \ 在 *Investopedia* 中撰文这样描述**治理**：“公司治理是指指导和管控公司的[`规则、实践和流程体系`](https://www.investopedia.com/terms/m/mckinsey-7s-model.asp)。公司治理的本质是平衡公司众多[利益相关者](https://www.investopedia.com/terms/s/stakeholder.asp)（如股东、高级管理人员、客户、供应商、融资方、政府和社区）的利益。”^(²)\
  \ 对于 RPA 而言，治理的范围没有那么广泛，我们将描述它为实现 RPA 成功所需完成的任务。\n\nProject Smart 网站这样描述**项目赞助**：“项目赞助是一种积极的高级管理层角色，负责识别业务需求、问题或机遇。赞助人确保项目始终保持可行性，并确保实现收益，解决项目经理控制范围之外的任何问题。”^(³)\
  \ 赞助人通常是负责提出 RPA 项目的领域预算的人。\n\n“**框架**是一个松散但不完整的结构，它为容纳其他实践和工具留有空间，但提供了所需的大部分流程。”^(⁴)\n\
  \n这三个概念之间的关系清晰可见。治理由规则和流程构成，赞助是确保其存续和演进所需的权威，而这一切都在框架内执行。\n\n## 暂停思考\n\n您所在的组织目前是否存在有效的治理和赞助？您是否在现任或前任公司中看到过其中一种或两种都行之有效？您可能（甚至很可能）没有见过。在开始\
  \ RPA 实施之旅时，切勿低估良好治理和有效赞助的重要性。否则，项目从一开始就注定失败。\n\n## 治理\n\nRPA 解决方案生命周期包含以下内容；请注意，具体组织可能因个别需求而存在一些差异。\n\
  \n## 申请表\n\n这是以不同方式发生的基本请求；它可能是一次非正式的走廊谈话，随后召开会议以获取推进请求所需的详细信息，或者请求者可能提交了一份包含所有必要信息的申请表（参见附录\
  \ 1）。\n\n申请表上的信息代表了对此机会的初步审视，因此，此时存在许多未知信息。\n\n通常，此时会捕获以下信息：\n\n- 流程的高级描述\n- 受影响的业务领域（上游和下游流程）以及系统或工具\n\
  - 业务驱动因素和关键程度\n- 节约量估算（FTE 工时等）和收益估算（改进质量、改善服务等）\n- 机会识别（详见第 4 章）\n\n> **提示**  \n\
  > 虽然初始请求可能以电子邮件甚至非正式的走廊谈话形式出现，但将申请表标准化并鼓励使用将非常有益。\n\n然而，在某些情况下，申请表上提供的信息就足以断定在当前情况下自动化不可行，原因可能是流程复杂性、RPA\
  \ 能力有限，甚至解决方案的生命周期可能很短。应告知请求者这一情况，并尽可能提供有助于克服自动化本应解决的问题的任何建议。\n\n一旦提交的初始请求未引发任何可行性问题，就可以进入下一步。\n\
  \n> **提示**  \n> 请记住，这是对请求的初步审视；尚无太多细节可用。如果在此未提出可行性问题，并且请求获得批准继续进行，这并不意味着在后续阶段不会发现此类问题而导致项目取消。如果发生这种情况，绝不能认为是失败。这意味着迭代流程按预期发挥了作用。\n\
  \n### 流程发现\n\n在此阶段，会对所提及的机会进行详细评估，以捕获以下内容：\n\n- 端到端（E2E）流程步骤\n- 流程中涉及的角色和用户\n- 所用系统和工具列表\n\
  - 作业量（每小时、每天、每周等）\n- 每个步骤的流程时间以及有助于准确估算节省和收益的其他流程绩效指标\n- 流程约束\n- 建议自动化的流程步骤\n- 申请表触发的任何其他信息\n\
  \n需要所有这些信息才能进入下一步——机会评估，该步骤将评估 RPA 价值以及 RPA 作为解决方案的可行性。\n\n### 机会评估（详见第 5 章）\n\n\
  此阶段需完成若干事项：\n\n1. **了解当前流程**  \n   在机会识别阶段已经对流程进行了高层次审视。现在，需要将其细化，并记录输入、活动、输出以及负责的角色。\n\
  \n2. **影响分析**  \n   为什么要做这个？在接收阶段，可能已经对节省的时间、合规性等做出了一些初步估计。现在，需要对这些进行更精确的研究。\n \
  \  - 创建一个 Bot 来自动化该流程需要投入多少时间和资源？投资回报率（ROI）是否足以证明支出的合理性？虽然这需要指导委员会做决定，但 RPA 团队会提出建议。\n\
  \n3. **适用性分析**  \n   在此，我们必须评估所申请的流程是否是自动化的良好候选对象。它是否足够重复？需要做出的决策中是否只有少数可以转交人工处理？将回答这些问题以及其他问题以确定其适用性。\n\
  \n4. **风险分析**  \n   自动化该流程涉及哪些风险？*不*自动化该流程涉及哪些风险？\n\n### 解决方案可行性决策流程\n\n所有汇总信息都会提交给决策者进行评估，以确保\
  \ RPA 解决方案能够带来足够的投资回报率，并且预期收益与整个企业的战略保持一致。\n\n在决定继续进行 RPA 解决方案开发之后，该机会进入解决方案设计阶段。\n\
  \n### 解决方案设计阶段（详见第 6 章）\n\n1. 规划  \n2. 构建  \n3. 测试  \n\n每个阶段均根据公司标准执行，使用 `Waterfall`\
  \ 方法、`Agile` 或其他常用方法。\n\n在成功测试并通过业务验收后，RPA 解决方案将发布到生产环境，进入运营阶段。\n\n### 解决方案退役\n\n\
  1. 日落（生命周期终止）策略或计划\n\n### 解决方案部署与维护阶段（详见第 7 章）\n\n1. 发布  \n2. 运营  \n3. 监控  \n\n\
  前面提供的信息以流程图格式显示在图 3-1 中。\n\n![../images/513218_1_En_3_Chapter/513218_1_En_3_Fig1_HTML.png](img/513218_1_En_3_Fig1_HTML.png)\n\
  \n**图 3-1** RPA 解决方案生命周期\n\n有效治理的组成部分可能看起来复杂，但这种结构的需求已反复得到证明。识别和评估机会，并拥有可重复的流程和工具，将大大有助于确保您新的\
  \ RPA 计划取得成功。\n\n\n\n## 赞助支持\n\nRPA 赞助人无需亲自执行这些任务，但需确保项目成果与全企业战略方向保持一致，并为其创造价值。他/她需要确立项目愿景、目的与目标，清除障碍，并确保为项目成功分配必要的资源。通常，RPA\
  \ 赞助人是高管团队成员，负责监督引入 RPA 项目的业务领域。由业务部门或 IT 部门主导项目均可。然而，重要的是要记住，RPA 团队必须是跨职能的，并应包括以下角色：\n\
  \n-   业务部门\n-   IT 部门\n-   安全部门\n-   风险与合规部门\n-   财务部门\n-   人力资源部门\n-   市场部门（适用时）\n\
  \n来自这些领域的利益相关者/主题专家必须参与创建协作环境，因为正如文章《[成功实施机器人流程自动化的蓝图](https://medium.com/%2540cfb_bots/a-blueprint-for-implementing-robotic-process-automation-successfully-88e5f7ff7400)》^(⁵)\
  \ 所述，RPA 有潜力成为推动真正且有影响力的数字化转型的颠覆性变革力量。\n\n另一方面，RPA 倡导者将负责推广 RPA 技术以应对业务挑战，并负责在所引入项目的业务领域中推动\
  \ RPA 的采纳。理想情况下，RPA 倡导者应深入了解业务运营，并具备必要的影响力来推广 RPA，同时通过及时解决任何障碍来克服对采纳 RPA 的阻力。^(⁶)\
  \ 最佳实践是拥有多位代表不同业务领域的 RPA 倡导者，以最大化 RPA 项目的回报价值并确保全企业范围的采纳。\n\n### 暂停与思考\n\n赞助人和倡导者应对\
  \ RPA 项目的成功充满热情并拥有既得利益。你是否已采取必要措施，确保你希望成为赞助人或倡导者的人相信 RPA？不要选择那些只是应经理/领导要求参与，或者你明知其对\
  \ RPA 潜力持怀疑态度的人。\n\n确保有一位高级管理者为 RPA 项目的成功投入并负责，是项目成功的关键。他们应有一个令人信服的理由来确保项目成功。\n\n\
  ## 框架\n\n当我们提到框架时，指的是项目如何构建的总体概览。这并非一成不变；它会因公司而异，甚至在同一公司的不同业务部门之间也会有所不同。但存在一些基本的基础组成部分。\n\
  \n正如我们之前提到的，RPA 项目团队必须是跨职能和多学科的，并且应包括来自业务运营和控制支持职能中所有受影响领域的代表。一个功能齐全的核心 RPA 交付团队应包括以下角色：\n\
  \n-   流程分析师/设计师\n-   RPA 解决方案架构师\n-   RPA 开发人员\n-   RPA 管理与支持\n\n### 流程分析师/设计师\n\
  \n此角色需要理解需要自动化的流程，检查自动化该特定流程的可行性，如果合理的话，则设计并开发该流程的未来状态。流程分析师/设计师应具备业务流程经验，并能够定义所需流程的愿景。由于此角色可能由一人或多人担任，因此非常重要的是要记住，流程分析师/设计师必须与当前流程的执行者密切合作，以准确捕捉其细节。流程分析师/设计师必须理解并评估这些细节，以判断该流程是否适合\
  \ RPA，并且部署的解决方案（机器人）不会使运营面临任何风险，并能带来足够的收益。为此，流程分析师/设计师还需要熟悉 RPA 工具的功能和局限性，并能够为流程负责人提供基础概览培训。流程分析师/设计师是\
  \ RPA 解决方案规范的驱动者，同时负责所有其他相关文档，如可行性、影响和风险评估，以及业务验收交接等。此外，他们还应负责将在开发和测试阶段产生的任何反馈和更改整合回规范中。\n\
  \n### RPA 解决方案架构师\n\nRPA 解决方案架构师通常具有软件开发或自动化背景。RPA 领域发展非常迅速，并且得益于可执行重复性、基于规则任务的简单任务机器人。这些机器人的构建很容易，如今已演进到新一代的\
  \ IQ 机器人，它增加了认知处理能力，使流程能够处理非结构化数据。此外，市面上还有许多打包的企业软件产品，例如 AutomationAnywhere、BluePrism、UIPath\
  \ 等。RPA 解决方案架构师不仅需要熟悉当前可用的 RPA 功能，还必须了解以下方面：\n\n-   自动化策略\n-   数字解决方案交付模型和框架（敏捷、DAD、DevOps\
  \ 等）\n-   IT 基础设施和业务运营\n-   将在 RPA 项目中涉及的产品或服务\n\n需要这些专业知识来帮助和指导组织在整个 RPA 旅程中构建可持续、有效（有影响力）且可扩展的解决方案。\n\
  \n### RPA 开发人员\n\nRPA 开发人员的主要职责是使用 RPA 工具设计、开发和维护自动化解决方案。根据所使用的工具，此角色需要一定程度的开发人员专业技能。如果你希望自动化一个包含规则和逻辑（如循环、`if/else`\
  \ 语句、变量和异常）的流程，则需要编程能力，并且 RPA 开发人员应具备该领域的必要经验。请记住，自动化一个流程有多种方法；因此，具备良好的自动化工具技术知识是一笔巨大的财富。\n\
  \nRPA 开发人员是跨职能设计团队的一员，这意味着他们与 RPA 解决方案架构师和流程分析师/设计师密切合作，以寻找最有效和最高效的方式来开发、测试，并在流程负责人成功验收后，将自动化解决方案部署到生产环境。重要的是要记住，发布到生产环境的解决方案应附有支持性文档，以帮助开发人员和运维人员理解自动化解决方案的逻辑和内容。\n\
  \n### RPA 管理与支持\n\n\n\n#### 部署 RPA 解决方案\n\n一旦 RPA 解决方案（机器人）部署完成，就需要分配专门的资源来监控其执行情况，并及时处理错误、修复问题以及进行小幅增强。这些资源还将管理流程的执行计划。此外，RPA\
  \ 管理和支持团队将负责通过监控和确保系统健康、最大化运行时许可证利用率、引入新的自动化能力等方式，来维护和推进整个 RPA 生态系统。根据部署的机器人数量以及\
  \ RPA 生态系统的复杂程度，可能需要不止一个人来负责处理上述某些职能。同时，将那些高层职能分解成更小的模块也是有益的，以避免把事情过度复杂化。请记住，战术支持的主要目标是保持速度和敏捷性，而不是制造过多的官僚层级。\n\
  \n**暂停与思考**\n\n各组织的职位名称可能有所不同。然而，头衔并不重要；关键是之前讨论的职责描述。你所在组织中有谁能执行这些任务？他们熟悉 RPA 吗？他们认为\
  \ RPA 有价值吗？\n\n#### 选择部署模式\n\n在开启 RPA 之路前，组织应决定 RPA 计划是由内部资源主导，还是外包给外部第三方 RPA 提供商。此外，组织也可以选择混合模式，即与外部提供商和内部资源建立协作框架。例如，外部合作伙伴可以专注于解决方案的识别、开发和部署，而内部团队则负责提供支持与维护。\n\
  \n在选择合适的路径之前，组织必须明确以下几个方面：\n\n-   是否有足够的流程来证明 RPA 投资（ROI）的合理性？\n-   组织是否承诺对 RPA\
  \ 计划进行长期投资？\n-   组织是否拥有启动 RPA 计划所需的内部技能和能力？\n-   RPA 是否是运营及 IT 基础设施或生态系统数字化转型的长期（即五到十年）战略的一部分？\n\
  \n为 RPA 计划选择正确的路径，将决定其成功与否，否则可能导致结果不佳且成本高昂。这很可能会招致高层的撤资，并最终切断对 RPA 的财务投入。\n\n**提示**\n\
  \n如果不满足这些条件，就不要启动 RPA 计划。没有这些条件，RPA 计划失败的可能性远大于成功。\n\n#### RPA 的组织模式\n\nRPA 计划的组织模式为在企业层面部署\
  \ RPA 提供了结构框架。有三种模式可供考虑^(⁷)：\n\n**集中式**\n\n这通常被设计为一个卓越中心（COE；关于 COE 的更多信息，请参见第 7\
  \ 章），设立在一个高管办公室（业务领域）内，负责管理 RPA 计划的整个生命周期，包括制定标准、从构思到部署交付 RPA 解决方案、维护 RPA 基础设施，并确保有适当的控制、风险管理和合规性。\n\
  \n**中心辐射式或联合式**\n\nCOE 设立在一个高管办公室内，通常作为分散型辐射点的中心。在这种情况下，COE 负责制定标准、制定政策、提供培训，并专注于创新和\
  \ RPA 计划战略。辐射点（即 RPA 交付团队）则主要专注于为其所分配或服务的业务领域开发和部署 RPA 解决方案。这种模式要求中心（COE）与辐射点（RPA\
  \ 交付团队）之间紧密协作。\n\n**分散式**\n\n在企业内部设立多个独立的 RPA 计划，各个 RPA 框架在不同的执行分支或业务单元下运作。这可以被视为多个自主运作的次级\
  \ COE 办公室。\n\n最佳的组织模式将取决于各个 RPA 计划的策略、服务人群的规模、业务复杂性、管理文化、组织设计、风险承受能力以及许多其他因素。在接下来的章节中，我们将更详细地讨论为你的企业\
  \ RPA 计划实施有效运营模式的收益、适用性因素及方法。此外，我们还将讨论随着计划日益成熟，这些模式可能会如何变化。\n\n**暂停与思考**\n\n哪种模式适合你的组织？你将如何确定哪种模式最佳？你的组织目前是否设有卓越中心？如果有，它是如何运作的？你需要与\
  \ COE 中的谁讨论 RPA 事宜？如果你的组织中没有 COE，是否有兴趣建立一个？\n\n#### RPA 的开发方法论\n\n有多种数字产品开发方法论可供选择。这些方法定义了必要的步骤、决策过程、沟通以及不同利益相关者需要执行的操作，以便成功交付数字产品——即\
  \ RPA 解决方案。\n\n最常见的包括：\n\n**瀑布模型**\n\n这是一种顺序式框架，流程以线性方式执行，产品按照预定义或计划的顺序从一个阶段进入下一个阶段。这种方法可以实现高质量的产品设计，但其僵化的结构不允许有高度的灵活性来应对变化，并且在早期阶段犯下、后期才发现的问题，解决起来代价可能非常高昂。\n\
  \n**敏捷开发**\n\n这种方法论被软件开发公司广泛采用，尤其是初创公司，其核心思想是迭代开发和交付。该方法允许团队频繁地以小模块方式开发和发布产品功能、增强或变更。这可以实现快速的价值交付，对客户需求变化具有高度适应性或灵活性，并能快速识别错误和问题。\n\
  \n**瀑布-敏捷混合模式**\n\n这种方法最初是顺序式的，然后在开发和交付阶段转变为迭代过程。这种混合模式创建了一种严谨的方法，允许在开始开发之前就深入调查和理解客户需求及产品规格，同时在开发和部署阶段又保持了足够的灵活性以进行迭代和调整。\n\
  \n**精益开发**\n\n这种方法论依赖于简单的理念，比如交付从客户角度定义的价值。它采用了最初在制造业中确立的精益概念。在软件开发中，它首先定义最小可行产品，然后通过迭代周期，不断增加其价值——要么通过添加新功能，要么通过提高其质量。\n\
  \n在这场竞争中，没有绝对的赢家；这完全取决于许多因素，类似于前面讨论的选择合适运营模式时需要考虑的因素。理解你所处的环境，以及每种方法论在该环境下的优势和潜在陷阱，至关重要。\n\
  \n#### 框架的重要性\n\n一个结构良好的框架对于 RPA 计划的成功至关重要。随着需求变化或发现框架中的缺陷，可以随着时间的推移对其进行修改，但从一个稳固的框架开始运作将极大地促进成功。\n\
  \n**暂停与思考**\n\n框架在你所在的领域可能会是什么样子？一些基本的结构要求（如角色等）是什么？哪些角色可能适合担任治理团队的成员？哪些角色适合作为决策机构，来决定是否继续推进某个请求？应该包含哪些文档？报告工作将如何开展？当你着手开展\
  \ RPA 计划时，必须回答这些问题以及其他相关考量。\n\n\n\n一个灵活的框架，包含必要的角色和流程，是确保`RPA`计划内的成功并非“一次性成果”，而是可以重复实现的关键。\n\
  \n`治理`——用于控制和监控`RPA`计划的规则、实践和流程——将是成功的关键。拥有有效的`项目发起人`——负责确保`RPA`获得必要支持并实现预期收益的高级管理层——也是`RPA`成功的“必备条件”。确保存在一个广泛的`框架`，能够让参与`RPA`计划的人员在其中拥有灵活的工作结构，确保他们知道预期目标，同时仍能适应不断变化的需求和情况。\n\
  \n脚注 1 2 3 4 5 6\n\n"
- "# 4. 机会识别\n\n机器人流程自动化（`RPA`）正迅速流行起来。然而，主要问题之一在于了解哪些流程适合自动化。\n\n在`RPA`计划中，最关键的决策之一就是确定哪些流程是应用`RPA`的候选对象。\n\
  \n尽管组织对`RPA`非常了解，但他们仍在努力寻找`RPA`实施的“神奇公式”。实际上并不存在这样的公式，但本书中的信息将有助于您在贵公司成功实施`RPA`计划。\n\
  \n*Sagacity Software* 的一篇文章简洁地阐述了这一困境：*实施`RPA`技术的公司必须确保选择正确的流程进行改造。通常情况下，公司无法实现所有流程的自动化。选择合适的流程可能是一项重大挑战。如果一个组织选择在过多的流程中实施该技术，则可能造成大量混乱。同时，若在数量不足的流程中实施`RPA`，又会削弱其有效性。因此，公司在实施时必须找到恰当的平衡点。*^(⁸)\n\
  \n建立初始商业案例并识别适合自动化的流程可能很复杂。尝试对不合适的流程进行自动化，是组织未能充分发挥`RPA`能力以重塑其业务运营并推动数字化转型的主要原因之一。\n\
  \n暂停思考\n\n您在您的组织中看到了哪些`RPA`挑战？您将如何应对这些挑战？您将如何管理预期，使其不将`RPA`视为解决所有问题的“银弹”，而是将其视为节省时间和减少错误的重要一步？\n\
  \n正如我们在前一章中提到的，`RPA`解决方案生命周期始于如何识别`RPA`候选流程。\n\n请注意，一旦您在组织内建立了`RPA`计划，将会出现另外两个相关事件，要求您遵循本章及后续章节中的步骤：增强和缺陷。当要求改进或更改处理某个流程的`Bot`以使其能够执行更多手动任务时，就会发生增强。此外，有时会提出将第二个与第一个相似的流程进行自动化，这种情况下，可能只需要增强现有的`Bot`。在这两种情况下，请求都会被识别、评估等。\n\
  \n关于缺陷，小缺陷将在不经过完整流程的情况下被纠正，但重大缺陷应遵循流程，以确保在时间和成本方面进行修复是合理的。\n\n基本请求可以通过不同方式提出：一次非正式走廊谈话后通过会议来获取推进请求所需的详细信息，或者请求者可能已经提交了包含所需信息的请求表单。\n\
  \n请求表单上的信息代表着对机会的初步审视，因此，此时存在大量未知信息。\n\n请求表单提供了请求的基本要素。它用于决定是进入下一步，还是项目此时应就此终止。\n\
  \n此时，所需的信息不足以决定是否完成项目，但足以做出前述决策之一。如果获批进入下一步，将收集更多信息，并在该步骤完成后，再次就推进事宜做出决定。\n\n项目可以在任何时候被取消；最初批准一个项目后来又取消它，存在许多合理的理由。例如，对节省金额的初步估算，可能在后续阶段收集到更多信息后被证明是夸大的。更准确的估算可能会排除花钱自动化该流程的收益。或者，一个最初看似相当简单的自动化，在后续阶段仔细审视后，可能被证明复杂得多。随着新信息的获得，项目发起人必须判断自动化是否仍能带来足够的投资回报率（`ROI`）。如果不能，项目将被取消，并通知相关利益方这一事实及原因。\n\
  \n一个最初被接受但后来被取消的请求并不代表失败。在一个看似可行的项目上投入一些资源（时间、金钱等），然后在项目进行到某个阶段时及时止损并取消它，远比将项目进行到底，却发现它未能满足需求、严重超预算等要好得多。\n\
  \n另外，一个请求被拒绝或在启动后被取消，并不意味着它永远不会被执行。应告知请求者，由于当前的优先级以及他们的请求不符合某些标准（例如，节省不足、复杂性高等），该项目目前不会是高优先级事项，但未来会重新评估。\n\
  \n\n\n## 申请表\n\n这是一份申请表样例；你也可以在附录 1 中找到它。\n\n*RPA* 机会 *– 申请表*\n\n| **倡议名称** |  |\n\
  | **发起人** |  |\n| **负责人** |  |\n| **当前流程如何运作？** |  |\n| **目标是什么？** |  |\n| **常见业务驱动因素/业务关键性**\
  \ |  |\n| **受影响的业务领域** | **受影响的系统/工具** |\n| **机会类型** | **解决方案的持续时间？** | **预估运营效益（FTE\
  \ 工时）** |\n| **优先级** | **期望交付日期** |\n| **表格填写日期：** | | **编制人：** | |\n\n申请表通常包含以下组成部分：\n\
  \n- 项目名称\n- 发起人：通常为高层领导，负责该自动化项目所在组织的预算。\n- 负责人：直接负责拟自动化流程的领导者。他们还负责排除可能出现的障碍，并在自动化开发、测试及部署阶段分配所需资源。\n\
  - 当前流程描述：对当前流程进行充分详细的总结，使阅读者能够全面了解其目的、流程流转、重复性特征，以及该流程适合自动化的原因。\n- 实施目标：说明拟将流程的哪一部分或整个流程实现自动化，并简要列举自动化带来的益处。\n\
  - 业务关键性：此部分阐述为何当前必须或应该对该流程实施自动化，以及该自动化如何与战略业务目标保持一致。是否存在竞争需求？是否面临高风险？客户是否在投诉某些可通过自动化解决的问题？等等。\n\
  - 常见业务驱动因素：一些可能的示例（包括但不限于）如下。\n  - 缩短周期时间\n  - 提高工作的一致性和质量\n  - 允许员工从事更高价值的活动\n\
  \  - 等等。\n- 受影响的业务领域：列出将受此自动化影响的业务单元。\n- 受影响的系统/工具：可能涉及已购买或已开发的特定系统并将受到影响，应在此列出。此外，任何工具，包括`Excel`、`Outlook`、`Word`等，也应在此列出。\n\
  - 机会类型：在此注明这是否是一次性自动化（可能用于清理数月或数年的积压工作），还是将持续进行的自动化。\n- 存续期预估：如果该流程预计在特定时间范围内被淘汰，或者预期在例如第三季度购买的新工具将解决此问题，请在此说明。\n\
  - 期望交付日期：指明自动化的最佳期望交付时间。\n- 预估运营效益：这通常是指时间和成本的节省，但并非每个申请自动化的项目都能显著节省时间和成本。有些是为了满足监管或竞争要求，有些是为了降低人为错误的风险。如果自动化能带来时间成本节约或收入增长，应在此详细说明。\n\
  \  - 例如：\n    - 5 名员工每周花 3 小时处理此流程\n    - 5 X 3 = 每周 15 小时\n    - 每周 15 小时 X 52\
  \ 周 = 每年 780 小时\n\n如果为了节省时间和金钱而实施流程自动化，可能需要每年节省约 1,500 个工时（或一个全职岗位），才能证明解决方案开发和维护成本的合理性。然而，这在不同的组织中会有所不同，因此为你的组织建立正确的标准至关重要。\n\
  \n- 表格填写日期：顾名思义。\n- 编制人：顾名思义。\n\n提示\n\n尽管最初的请求可能以邮件甚至非正式的走廊交谈形式提出，但将申请表标准化并鼓励使用将非常有益。\n\
  \n暂停并思考\n\n根据这些信息，你所在组织的申请表可能会是什么样子？是否还应收集其他信息？上述信息及附录 1 中的模板是我们发现作为基础比较有用的内容，但不同组织可能需要略微不同的组成部分。不过，此处展示的信息已包含基本要素。\n\
  \n如前所述，此阶段可能的结果之一是请求被拒绝。可能存在以下情况：申请表上提供的信息足以断定在当前环境下自动化不可行，原因可能包括流程复杂性、RPA 能力有限，或者解决方案的存续期过短。应告知请求者这一情况，并给出任何可行的建议，以帮助解决原本拟通过自动化来解决的问题。\n\
  \n一旦初始请求提交且未引发任何可行性问题，即可进入下一步骤。\n\n\n  \n"
- "# 流程发现阶段  \n\n评估每个候选流程以确保 RPA 是当前情况的正确解决方案至关重要。这也能确保自动化举措在你的组织中取得成功。为了让 RPA 团队和治理委员会能够就是否继续进行自动化开发做出明智决策，他们必须掌握关于候选流程的充分信息。流程发现阶段是机会评估阶段（请参阅第\
  \ 5 章）的前置步骤，所有用于做出关键决策的信息都在此阶段收集。正确执行此阶段非常重要，以避免对不适合自动化的流程启动自动化开发。  \n\n流程发现可以通过查阅流程相关文档并提取所需信息来为决策者提供摘要。这种方法简单快捷；然而，由于参考文档中可能存在不准确的假设或过时信息，容易产生错误。如果没有合适的流程文档该怎么办？\
  \  \n\n正如 BPM 资源中心所指出的：*在许多组织中，日常活动可能已根深蒂固且成为例行公事，以至于某个给定流程的确切步骤并不总是清晰明确。组织中的不同成员可能不知道某个事项一旦离开他们手中后会发生什么。你可能会在公司运营或政策指南中找到的官方流程文件，可能无法映射实际执行的操作。*^(⁹)\
  \  \n\n所有这些都可能导致很高的风险：当解决方案设计阶段开始时，RPA 团队可能会发现极端的复杂性、运营风险，以及/或对流程自动化可能带来的收益的夸大。\
  \  \n\n因此，推荐的流程发现方法可以简单到：将团队聚集在一起（实体或虚拟形式），讨论并记录（绘制流程图并包含相应的书面描述）某个特定流程的实际执行方式。通过与直接相关人员的讨论和访谈，你通常可以发现跨团队、部门、事业部等的流程端到端步骤。在此协作过程中，你还可以提取关键指标（数量、成本及其他衡量标准），这些指标有助于判断改进投资是否能产生实现战略目标所需的结果。\
  \  \n\n有许多 BPMS（业务流程管理软件）工具可以促进甚至部分自动化流程发现阶段。通过挖掘现有信息系统并分析事件和事务日志，你可以记录实际完成的工作（谁做了什么、何时做的、持续了多久）。如今，新兴技术工具能够从各种系统读取数据，并以流程图、图表及其他方式呈现这些信息，帮助你理解流程步骤、瓶颈等更多内容。\
  \  \n\n然而，这类工具往往不可用，因此识别正确的主题专家（SME）并与他们会面是成功的关键。  \n\n> **提示**  \n> \n> 如果自动化工具（事件和事务日志等）不易获得，请不要气馁。通过与\
  \ SME 的会议即可轻松识别适合自动化的流程。自动化工具是优势，但并非绝对必需。  \n\n由于每个组织的流程都存在一些固有的低效问题，因此它们需要像流程发现这样的方法，来帮助获取任务级数据以及人与系统之间交互的各种细微差别。虽然所有公司都制定了标准操作程序，但现实中这些程序往往被忽视。除非这些程序被完全锁定，否则许多员工会自行发明操作方法。这就是为什么任何流程的现有文档可能不可靠；有必要了解工作的实际执行方式，这往往与预期的方式（根据现有文档）大相径庭。此外，许多公司将流程外包给其他\
  \ BPM 供应商，导致其领导者不熟悉自身流程的执行情况。  \n\n在大多数情况下，尤其是在 RPA 的初期引入阶段，业务流程是通过手动流程映射来记录的。这包括一个高级流程图（通常使用`Visio`或类似软件绘制），然后在一个单独的\
  \ Word 文档中更详细地描述每个任务。  \n\n通过包含以下信息来完善这两份文档：如前所述，关于系统和工具、数量、流程步骤耗时、自动化的潜在限制（如果此时已知），以及请求表中注明的任何其他相关细节。\
  \  \n\n然后，这些信息将被汇编并提交给治理委员会。  \n\n> **暂停思考**  \n> \n> 随着项目的成熟，机会识别、接收和流程发现应从 RPA\
  \ 解决方案的最优设计演变为业务流程的最优再设计。一套强大的流程改进能力能使高性能的 RPA 项目解决全组织的业务挑战，并在运营绩效和客户体验方面实现全面、变革性的影响。^((10))\
  \  \n\n请记住，流程图用于设计人员、开发人员、治理委员会成员及其他利益相关者理解流程步骤。它是关于输入、输出以及中间流程步骤的高级视图。它有助于理解哪些步骤最适合自动化，以及每个步骤手动执行需要多长时间，从而确定时间/成本节省。\
  \  \n\n创建流程图有多种方法。你可以依靠主题专家知识。采用这种方法时，请与实际执行该流程的人员安排时间。我们怎么强调都不为过：流程既有预期的工作方式，也有实际的工作方式。了解实际的工作方式至关重要——人们执行流程时具体做了哪些步骤？这才是将要自动化的内容。\
  \  \n\n在白板或`Visio`、`iGraphix`等工具上绘制流程图。  \n\n首先，记录步骤，例如：\"开始\"、\"查找账号\"、\"验证账号\"\
  、\"更改客户地址\"、\"通知客户\"、\"通知顾问\"、\"结束\"。  \n\n然后，针对每个步骤，询问当前所需时间。例如，查找账号可能意味着搜索数据库，然后复制号码以便在另一个数据库中验证。这需要多长时间？30\
  \ 秒？两分钟？根据任务的不同，完成时间可能存在很大差异。在这种情况下，请包含一个范围（例如，\"步骤 5：30 秒到 2 分钟\"）。  \n\n在地图上，在每个任务下方标注其所需时间。\
  \  \n\n\n\n另一个映射流程的优秀方法是对其进行**视频录制**。为此，需要安排时间与一位实际执行该流程的人员一起，在他们操作时录制其执行流程中的任务。当他们在点击应用程序和下拉菜单，或输入信息时，应详细讲解他们正在做什么以及为什么这样做。例如：“在这个标记为‘描述’的文本框中，我将触发此请求的邮件正文中的信息复制粘贴到这里。”\n\
  \n完成此步骤后，你可以回顾视频，并据此创建流程映射图。\n\n**提示**\n\n如果项目进入设计阶段（参见第 6 章），该视频将对记录功能需求非常有帮助。\n\
  \n如果因故无法录制流程视频，与执行该流程的人员坐在一起是记录流程的另一种方法（请注意，所有这些都可以远程完成）。记录下每个屏幕及其上执行的操作，然后按照前面所述的方法映射流程。\n\
  \n创建初稿后，将其呈现给一组主题专家（即实际执行该流程的人员）进行验证，以确保其反映实际情况，这非常有益。请注意，发现某些人可能会调整流程（无论是执行顺序上的调整、插入额外步骤还是省略某些步骤）是正常现象。确保没有遗漏关键步骤，并确保按照映射的流程执行能够获得期望的结果。\n\
  \n创建并验证映射图后，最好在另一份文档中提供一些描述性的、更详细的信息。请记住，在任何流程映射图中，每个步骤都只有寥寥几个词，例如：“识别账号”、“收集需求”等。详细的解释有助于读者更好地理解流程。\n\
  \n对于流程中的每个步骤，将以表格形式提供以下信息：\n\n*   **输入**：什么触发了该步骤？对于除第一步外的所有步骤，输入通常是上一步的输出。\n* \
  \  **活动**：该步骤实际做了什么？这里会包含访问特定系统的相关信息。\n*   **输出**：该步骤的结果是什么？使用前面引用的例子，结果可能是“账号已定位”。\n\
  *   **角色**：谁通常执行此活动？这里不是填写姓名的地方，而是填写角色。示例包括但不限于“客服代表”、“业务分析师”、“新业务经理”等。\n*   **度量指标**：在此步骤中收集（或应收集）哪些数字？示例可能包括定位账号所需时间、从初次请求到客户回复的时间等。\n\
  *   **备注**：在此处包含步骤其他部分未记录的任何相关信息。这可能包括使用的系统、应用程序或工具、可能出现的异常解释、预期数量等。\n\n**提示**\n\
  \n请记住，尽管此文档提供了关于映射图的额外信息，但它仍然是一份早期阶段的文档，因此不需要过度详细的细节。\n\n在某些情况下，则不需要此文档。对于非常简单直接的流程，映射图可能就足够了。输入和输出清晰明了，并且明确指出了每个步骤所需的时间。此外，如果在关于请求的初始讨论中，发现此请求不适合进行\
  \ RPA，那么花时间创建此文档就毫无意义。\n\n总而言之，在此阶段，被提及的机会已得到详细评估，你现在对端到端流程、流程中涉及的角色和用户、流程使用的系统及工具列表，以及通过流程处理量的合理估算（可以是每小时、每天、每周等）有了清晰的了解。你还知道了流程中每个步骤所需的时间，以及任何其他可能相关的绩效指标。你还识别出了自动化该流程的任何已知约束和风险。此外，通过与\
  \ SME 和业务合作伙伴的讨论，你知道了业务方希望自动化的流程步骤，这可能是流程的全部或部分。通过讨论，你可能还掌握了其他重要信息。\n\n所有这些信息都是进入下一步（即机会评估）所必需的，该步骤将评估\
  \ RPA 的价值和 RPA 作为解决方案的可行性。\n\n你会注意到，在此流程阶段中，你已与许多不同的人进行了接触。业务方代表提出了初始请求；你与他们进行了一次（可能多次）互动；随后你联系了\
  \ SME，并可能联系了风险与合规部门的人员。在此阶段，如果你的组织有卓越中心（COE），则应联系他们。如果没有，谁将负责部署 Bot？应让那个人或部门了解所提议的内容以及一个非常粗略的部署日期。尽早让这些人参与进来，将有助于你顺利推进项目启动和开发的流程。你将在后续章节中看到具体方法。\n\
  \n接下来，让我们通过一个案例研究中的实用（尽管是虚构的）例子来审视这些概念。\n\n### 案例研究：客户地址和电话号码更新\n\n对于任何面向客户的组织来说，拥有客户最新的联系信息至关重要，以便及时提供客户服务（例如，发送发票、账单或服务变更更新，以及促销活动、新服务或新产品等营销材料）。在这种假设情况下，客户通过电子邮件将“地址变更”表格提交到假设的“MyRPA”公司的客服邮件收件箱。可能有不同类型的邮件到达该收件箱；因此，客服人员会查看邮件并将其分派到相应的团队队列进行处理。\n\
  \n在此案例中，请求被发送到团队 A，该团队专门负责客户档案管理任务。团队 A 由六名客服专员组成，他们每天早上访问团队的待办文件夹，并按照先进先出的顺序处理请求。\n\
  \n成功变更后，客服专员（CSS）会向客户发送确认邮件。\n\n经过一次流程质量审计，团队管理层发现，由于人为错误，大量地址变更请求处理不当，这导致了大量的客户投诉，以及因后续调查和纠正这些错误所需的返工而产生的高昂运营成本。管理层希望探索自动化该流程的机会，以提高整体流程质量，并将其资源重新分配到其他需要人工干预的领域。\n\
  \n****\n\n为清晰起见，我们需要区分流程流程图（process flow）和流程映射图（process map）。\n\n以下是描述案例研究流程的高层次*流程流程图*：\n\
  \n![../images/513218_1_En_4_Chapter/513218_1_En_4_Figa_HTML.png](img/513218_1_En_4_Figa_HTML.png)\n\
  \n以下是针对该案例研究的高层次*流程映射图*（*模板见附录 2*）：\n\n![../images/513218_1_En_4_Chapter/513218_1_En_4_Figb_HTML.png](img/513218_1_En_4_Figb_HTML.png)\n\
  \n此示例的申请表可能如下所示：\n\n*RPA* 机会 *–* 申请表\n\n\n\n| 背景 |  |\n| --- | --- |\n| 举措名称 | 地址和电话号码变更流程\
  \ |\n| 发起人 | Mary Smith |\n| 项目负责人 | John Doe |\n| **当前流程如何运作？** |\n| 包含新客户信息（地址和/或电话号码）的客户变更请求邮件，由客户服务专员（CSS）转交给\
  \ A 组处理。该组有五名全职员工负责处理这些请求。如果地址无误，每位 CSS 处理一个请求大约需要 10-15 分钟；如果需要调查或与客户进一步跟进，则大约需要\
  \ 20 分钟。该组领导看到了至少部分自动化该流程的机会，并将部分 CSS 调至其他服务时间更长、加班率更高的领域。此外，审核流程请求后发现，电话号码中存在大量人为错误，例如更改了错误的客户地址、新地址出错，或未在所有必需的系统和应用程序中更新客户信息。这会引起客户的不满，并增加客户服务的整体运营成本，因为我们需要进一步调查，且不容易联系到客户。\
  \ |\n| **目标是什么？** |\n| 我们希望提高流程质量并减少处理这些任务的 CSS 数量。要求是自动化端到端的地址和/或电话号码变更流程。自动化系统应能够验证客户凭证、更改电话号码，以及/或者验证并在大型机系统中用新地址更新信息。\
  \ |\n| **常见业务驱动因素/业务关键性** |\n| 运营成本、质量、改善客户体验、公司形象与声誉 |\n| **受影响的业务领域** | **受影响的系统/工具**\
