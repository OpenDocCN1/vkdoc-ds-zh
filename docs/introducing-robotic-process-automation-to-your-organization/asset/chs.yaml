  \ 日\n\n（模板见附录 7。）\n\n当然，这个表格在进入会议时是空白的。在会议上，治理委员会成员提出的任何问题都将得到解答。在这个假设的请求中，做出的决定是继续推进（参见“决策”列中的“通过”），决策的依据列在“理由”列中，而下一阶段——解决方案设计——则列在“后续步骤”列中。\n\
  \n相反，“决策”可能是“暂停”，理由列在“理由”列中，而“后续步骤”则会提供额外的解释。可能会写明“一旦流程负责人确认 90% 的输入实现数字化，将重新审查此请求”，或者对“后续步骤”的其他描述。\n\
  \n最后，“决策”也可能是“不通过”。其理由会在“理由”列中说明，而“后续步骤”可能会是“告知客户，当前的投资回报率不足以证明开发成本的合理性。建议客户与（姓名，职务）沟通，了解使用（应用程序名称）以提供一些改进的可能性。”当然，这需要知道是否有其他有用的替代方案。\n\
  \n一旦项目获得治理委员会批准继续推进，您就可以进入“解决方案设计”阶段了。\n\n脚注 1\n\n\n\n"
- "# 6. 解决方案设计\n\n在概念设计阶段，需要收集需求（功能性和非功能性）。附录中提供了模板，本章节将给出详细说明。\n\n概念设计可被视为解决方案蓝图。此时将对自动化解决方案进行高层级决策，包括\
  \ Bot 将执行什么任务、需要访问哪些系统、按何种计划运行等。这些内容将在后续阶段进一步细化，但本阶段将确定基本框架。\n\n同时，本阶段需要创建一份解决方案设计文档。该文档包含流程与产出、整体结构、逻辑组件以及当前状态与潜在未来状态之间的相互关系。我们提供了模板及清晰说明（请参见附录\
  \ 12）。\n\nRPA 可以采用传统的\"瀑布\"方法或更敏捷的方法论引入。在\"瀑布\"方法中，需求与概念性解决方案设计在开发开始前便创建并归档。如今越来越多的公司采用敏捷或并行工程方法，需求与解决方案开发活动同步进行。每种方法各有优劣，部分组织会将其融合为混合方法。\n\
  \n无论选择何种方法论，本章所述的任务都必须完成。\n\n概念设计完成后，需要填写就绪检查清单。这确保开发（下一阶段）所需的所有组件均已完备。附录中附带详细说明的模板。\n\
  \n就绪检查清单完成后，将提交给决策机构，由其决定是否进入下一阶段（开发）。决策机构通常由以下角色组成：\n\n*   RPA 技术交付负责人\n*   架构师\n\
  *   开发人员\n*   其他必要人员\n\n### 暂停与思考\n\n各公司的角色名称不尽相同。您所在组织中有哪些对应角色？同时，考虑一下贵公司中\"其他必要人员\"\
  可能包含哪些人。这可能包括总监、区域经理、系统分析师或其他人员。决策机构规模应精简，但必须包含具备决策资格的人员来判断是否进入下一阶段。\n\n请注意，该模式的优势之一是工作逐步推进，并为决策机构（决策主体）设置了非常具体的检查节点，用以审查工作并判断任何项目的持续可行性。在机会评估阶段仅收集初步信息时，某项需求可能在\
  \ ROI、竞争优势或其他方面看似前景可观，但在概念设计阶段的深入调查后可能变得不那么理想。项目从一个阶段推进到下一阶段时皆是如此。在任何节点，决策机构都可能因更仔细的审查发现早期评估不实而取消项目。某个项目在某一阶段获得批准后又被取消，并不代表前一阶段存在失败——这正是\
  \ RPA 项目推进的本质特征。\n\n### 暂停与思考\n\n在许多公司里，即便利益相关方明知项目已无必要，项目仍会继续推进。取消项目被视为对已投入资金的浪费和不同决策者的失败。您将如何说服管理层，采用这种阶段性评估项目的模式是有益的？\n\
  \n在 RPA 中，需求文档通常被称为流程设计文档（PDD）。下文\"决策机构审批\"章节将对 PDD 进行说明。如果您的组织擅长需求收集与归档，请继续使用原有流程；以下将说明典型需求文档的细节。\n\
  \n但如果您的组织不存在高效的需求收集流程，或仅需为 RPA 捕获需求，则 PDD 是收集与记录需求的首选方式。请参见本章\"决策机构审批\"章节获取相关信息。\n\
  \n\n好的，作为高级文档工程师和翻译员，我将根据您提供的注意事项和示例，将给定的英文文本翻译成中文。\n\n\n## 需求收集\n\n我们将从讨论功能需求和我们推荐的模板开始。\n\
  \n请参考附录 9 中的模板，记住这只是一个模型。如果它对您的组织适用，那很好，但您可以根据组织的需求自由调整它。\n\n## 1 第一层级详情\n\n####\
  \ 1.1 系统\n\n*   在输入、处理或输出过程中，必须访问哪些系统？请在此列出。\n\n#### 1.2 目标\n\n*   在本节中，简要但清晰地描述项目的目标。这可能包括对当前情况的简短描述及其为何存在问题，以及对项目成果及其优势的简要描述。**这里不是定义目标的地方**；那是在更早的阶段完成的。这里只是更详细地描述它。重要的是不要陷入在此处重新定义目标并偏离最初请求的陷阱。此描述必须满足流程所有者所请求的内容。他们必须批准此文档，因此描述必须准确。\n\
  \n#### 1.3 触发事件\n\n*   在本节中，列出导致流程开始的事件。例如，客户寻求更改受益人信息。\n\n#### 1.4 触发器\n\n*   这是导致流程开始的特定操作。沿用第\
  \ 1.3 节中的示例，事件是客户想要更改受益人信息。特定的操作（或触发器）可能是收到一封来自客户的电子邮件，通知了新的受益人信息。或者可能是来自顾问的通知，代表客户进行更改。应列出所有可能的触发器。\n\
  \n#### 1.5 前置条件\n\n*   为了使流程开始，机器人必须处于何种环境条件？例如，机器人可能需要访问某些软件，请求必须采用特定格式等。在此列出所有必需的前置条件。\n\
  \n#### 1.6 后置条件\n\n*   在此列出流程导致的所有变化或产出。在前面的示例中，后置条件可能包括以下内容：\n    *   受益人信息已被更改。\n\
  \    *   客户已被通知更改已完成。\n    *   顾问已被通知该更改。\n    *   已生成一份报告，列出最近一天内的所有更改。\n\n**提示**\n\
  \n与主题专家（SME）进行沟通，以充分理解触发事件、触发器以及前置和后置条件。\n\n### 2. 第二层级详情\n\n#### 2.1 输入参数\n\n|\
  \ 参数名称 | 描述/值 | 是否必填？ | 省略时的含义（仅在必填=否时填写） |\n| --- | --- | --- | --- |\n| 流程的输入是什么？可能是一封电子邮件、另一个流程的完成，或任何其他事物。\
  \ | 简要描述输入。 | 是否为必填项？ | |\n| 输入参数有多少个就插入多少个。必要时可添加额外行。 | | | |\n\n#### 2.2 输出参数\n\
  \n| 参数名称 | 描述/值 | 是否必填？ | 省略时的含义（仅在必填=否时填写） |\n| --- | --- | --- | --- |\n| 流程产生什么？在此列出其名称。\
  \ | 简要描述输出。 | 是否为必填项？ | |\n| 包括所有输出。必要时可添加额外行。 | | | |\n\n### 3. 第三层级详情\n\n####\
  \ 3.1 主流程步骤\n\n*   在本节中，列出正常流程的步骤。例如，如果在 70%的情况下，流程以一种方式流转，请在此列出这些步骤。沿用之前的同一个示例，步骤可能如下：\n\
  \    1.  收到电子邮件\n    2.  访问系统 ABC\n    3.  找到账号\n    4.  根据指示更改受益人\n    5.  向客户发送电子邮件\n\
  \    6.  向顾问发送电子邮件\n    7.  信息被添加到每日报告\n\n#### 3.2 备选流程\n\n*   有些输入将包含略有不同的步骤，但仍可由机器人处理。在此列出这些流程。\n\
  \n#### 3.3 异常流程\n\n*   可能存在一些机器人无法处理的情况。沿用前面的例子，可能是由于无法识别账号，或者当前受益人姓名错误等原因。解释在这些情况下会发生什么。沿用同一个例子，流程可能如下：\n\
  \    1.  收到电子邮件\n    2.  访问系统 ABC\n    3.  未找到账号\n    4.  向处理员发送电子邮件以进行手动处理\n  \
  \  5.  将信息添加到异常报告\n\n**暂停并思考**\n\n为了让开发人员创建高效的机器人，这些信息至关重要。您将如何获取它们？您需要与谁交谈以获取并验证它们？请记住，现在花时间把它做对，可以避免将来代价高昂的返工。\n\
  \n## 非功能性需求\n\n我们现在将讨论非功能性需求（模板见附录 10）。\n\n> “非功能性需求（NFR）定义了系统属性，如安全性、可靠性、性能、可维护性、可伸缩性和可用性。它们在不同的待办事项列表中作为对系统设计的约束或限制。”^(¹²)\n\
  \n1.  **自动化服务标准：** 这是一个“样板”部分，仅说明当前标准的设定日期和设定者（例如：卓越中心 COE）。如果您的组织没有既定的标准，请忽略此部分。\n\
  \n2.  **隐私、数据保留和清除要求：** 包含有关保护客户隐私以及在何处存储数据的信息。同时指明何时可以删除文档。\n\n##### 流程图\n\n包括一个流程图以提供视觉清晰度。使用同一个示例，流程图可能类似于：\n\
  \n![../images/513218_1_En_6_Chapter/513218_1_En_6_Figa_HTML.jpg](img/513218_1_En_6_Figa_HTML.jpg)\n\
  \n流程图是从头到尾对流程的一目了然的视图。它使管理层能够对流程有必要的理解，并帮助设计人员了解流程的哪些方面可以自动化以及如何最佳地设计自动化。\n\n**提示**\n\
  \n“流程图”和“流程映射”这两个术语经常互换使用。请记住它们在本节中的用法。\n\n## 屏幕截图\n\n为了让开发人员创建机器人，他们必须确切地知道流程是如何运作的。请记住，RPA\
  \ 是为了自动化现有流程。虽然在自动化过程中可能存在一些改进流程本身的机会，但不会进行重大的流程变更。如果需要重大变更，则该流程不适合采用 RPA。\n\n**暂停并思考**\n\
  \n在此阶段，将更详细地审查请求。它是否仍然是 RPA 的良好候选对象？请记住，在此阶段结束时，将举行另一次管理机构会议，并将要求您提出“可行/不可行”建议。您可能在机会评估结束时建议了“可行”，但经过更深入的了解后，您可能会建议“不可行”。这完全是合理的。\n\
  \n为了获取屏幕截图，最有效的方法是记录一个人手动执行该流程的过程。这可以通过各种在线会议应用程序完成，或者在没有其他方法的情况下，使用手机来完成。\n\n确定正确的主题专家（SME）后，与他们安排一次会议，并记录整个流程。会议结束后，截取屏幕截图并将它们放入\
  \ Word 文档中，使用箭头指示选项，并对每个屏幕上发生的事情进行简要描述。请记住，为了正确自动化流程，开发人员必须看到流程中的每一个步骤。\n\n最后，包括一个典型输出的屏幕截图。流程产生的是什么？是\
  \ Excel 格式的报告吗？是给客户或顾问的信函吗？无论是什么，都截取一个屏幕截图。\n\n**暂停并思考**\n\n\n\n## 排版后内容\n\n您的公司可能有一套开发必须遵守的规范。您的新\
  \ RPA 程序必须符合这些规范。如果公司设有卓越中心（COE），这些规范可能由该中心负责管理。请尽早邀请 COE 代表加入流程，以确保您已采取所有必要步骤来满足公司要求。\n\
  \n### 规划\n\n收集需求后，正式规划便开始了。对于“瀑布”方法，这意味着从项目开始到结束，这些需求已被完整捕获、记录并验证。如果您使用的是敏捷方法，或是两者的混合，则必须确定在哪个阶段拥有足够的需求，以便开始规划。\n\
  \n一旦达到需求充分捕获以匹配所用方法（瀑布、敏捷或混合）的阶段，下一步就是规划。规划是自动化流程中的关键步骤。那句古老的格言“如果你不计划，就是在计划失败”对于\
  \ RPA 来说无疑非常正确。\n\n在规划中，第一步是与相关利益相关者安排会议。此时，大多数利益相关者应该已通过与业务负责人和主题专家的沟通而确定下来。确保您已识别所有必要的利益相关者。这可以通过与业务负责人的简短讨论来确认。初次规划会议应包含产品（业务）负责人、主要\
  \ SMEs、业务分析师、开发人员及/或部署团队成员。\n\n这第一次正式规划会议的主要目的是评估申请自动化的流程的规模与复杂性。通过与出席本次会议的关键利益相关者，您将能够确定所收集的需求细节级别是否足以开始开发，或者是否需要更多细节。这是本次会议的关键成果。\n\
  \n本次会议可能会审查某些信息，但如需更多需求，应首先获取这些需求。您需要确保讨论自动化将操作的应用程序，并了解这些应用程序是否已在任何现有自动化中使用。如果是，请找出哪些自动化正在使用这些应用程序。您还需要确定使用这些应用程序需要哪些访问权限。您可能需要与组织的安全团队沟通以获得正确的授权。最后，您应确定是否需要概念验证（POC）来判断技术可行性。\n\
  \n如果本次会议需要额外需求，或者这些问题无法得到解答，请勿继续。先获取缺失的信息，然后再次开会以最终确定这些问题。\n\n对于瀑布方法，一旦需求完成、经过审查并由所需利益相关者签署，开发团队将定期开会。\n\
  \n如果使用敏捷方法，一旦获取了足够的信息并创建了用户故事，敏捷项目管理流程便开始。\n\n### 暂停与思考\n\n开发团队将“定期”开会。在您的组织中，“定期”具体指什么？对于敏捷团队，除了每日站会，还需要哪些额外的会议？如果使用“瀑布”方法，你们需要多久开一次会？很可能，您的团队在项目开始时需要更多会议，随着项目进展，会议次数会减少。\n\
  \n在最初的开发团队会议中，需求必须被分解为更小的任务、功能或故事。在这些会议中，团队将识别依赖关系并决定开发顺序。\n\n一旦这些信息被整理出来，并且团队对复杂性和时间线有了清晰概念，就是时候再次与管理机构一起审查项目了。团队将简要介绍他们已识别的信息，并就项目是否继续进行提出建议。请记住，随着获取更多信息，一个项目可能会被验证可行，或者可能被发现并不具备最初看起来的潜力。\n\
  \n#### 提示\n\n请记住，在此时取消项目并不意味着失败！根据您早期的知识和建议，管理机构已同意推进。如果出现了新信息让您认为项目不再可行，这恰恰证明了\
  \ RPA 流程本身正在按预期运行。\n\n### 管理机构批准\n\n#### 提示\n\n我们称管理机构为“管理机构”，以表明它是进入下一阶段的“把关人”。请使用适合您组织的任何术语。\n\
  \n与所有阶段一样，如果管理机构决定不将项目推进到下一阶段，业务负责人将被告知这一决定及其原因。如果在与团队的讨论中，识别出任何其他可能的解决方案（例如，新的软件工具、对人工流程的重大改进等），也应将这些可能性告知业务负责人。\n\
  \n如果管理机构已批准进入下一阶段，开发团队将开始着手编制流程设计文档（PDD）。\n\n正如本章前面所述，PDD 是记录 RPA 项目需求的首选方法。如果您的组织没有有效的需求收集和记录方法，请为您的\
  \ RPA 项目使用以下方法。\n\n流程定义文档相当直接明了。它回答了一些基本问题，以帮助设计人员和开发人员实现其所描述流程的自动化。它传达了流程的功能、其输入和输出、当前完成该流程所执行的步骤，以及流程中的任何决策点。对于任何决策点，您需要确定它们是否可以被自动化。如果不能，它们将需要被发送至人工处理。\n\
  \nPDD 还说明了谁拥有该流程以及谁实际执行该流程。该文档还将详细说明流程执行的频率：可能是每小时、每周、每月、按需，或任何其他配置。此外，还说明了哪些系统或应用程序与之交互？哪些系统或应用程序向流程提供输入或接收其输出。\n\
  \n我们之前讨论过授权；PDD 列出了与流程交互的任何系统或应用程序所需的授权。\n\nPDD 还将列出当前已知的风险。可能出现什么问题？如果出现问题怎么办？流程是否会回退至人工执行，直到问题解决？由谁负责？\n\
  \n最后，PDD 将明确说明终点。我们如何知道流程已完成？\n\nPDD 可以附带一个流程图，显示当前流程，以及同一流程在自动化后将会/可能呈现的样子。它还可以详细说明人工流程以及自动化流程的终点。^(¹³)\n\
  \n\n\n## 技术可行性\n\n需要验证多个组成部分，具体包括：\n\n-   定义的逻辑\n-   基于规则的步骤\n-   输入和输出数据\n-   复杂度分析\n\
  -   事务量\n-   开发工作量\n\n执行技术可行性分析需要以下步骤：\n\n1.  自动化流程能否提供所需的安全性（再次参考 `PDD`）？\n2. \
  \ 该流程在自动化后，能否按照业务要求的速度和时间运行？\n3.  是否存在任何监管要求？\n4.  列出自动化将要交互或使用的所有应用程序；此信息可从流程设计文档（参见前述讨论）中获取。\n\
  \    1.  确定自动化工具是否提供与这些应用程序进行抓取或交互的功能。\n    2.  确定是否存在自动化流程无法与之交互的应用程序（例如，任何具有复杂\
  \ JavaScript 且类更新过于频繁的网站）。\n\n**提示**\n\n你可以看到 `PDD` 在设计阶段将被广泛使用。确保其包含的信息是完整无缺的至关重要。\n\
  \n## 概念验证/原型设计\n\n在某些情况下，`RPA` 团队可能不熟悉解决方案将要交互的系统或应用程序。或者可能存在非常严重的风险，例如隐私泄露或稳定性风险。在这些情况下，进行概念验证或开发原型会非常有益。甚至可能不必为整个自动化流程创建原型或概念验证，而只需针对那些风险特别高的部分。请与你的\
  \ `SMEs` 以及“风险与合规”部门合作，确定何时需要这样做。\n\n## 自动化解决方案设计 (机器人会是什么样子？)\n\n我们建议采用分层设计方法。以下步骤将为你提供指导：\n\
  \n1.  **控制器（流程）**：这是控制机器人执行的主控制器。它可以被视为其中其他任务的“监管员”。\n2.  **任务容器（业务对象）**：这是机器人的“具体组件”。这里包含机器人将反复用于执行所需步骤的各种小任务。这些步骤由控制器执行。\n\
  3.  **通信器**：每个自动化流程都必须发出某种类型的报告以显示其结果。此外，如果进入机器人的事务是它不知道如何处理的事务，则必须将这些事务发送给某人进行手动处理。顾名思义，控制器用于执行这些以及可能需要的其他通信目的。\n\
  \n**暂停思考**\n\n你正在自动化的流程有哪些通信需求？如果需要，高级管理层需要多少信息？机器人无法处理的事务将被发送到哪里？将保留它们的哪些记录，以及这些记录将发送、存储到何处？流程执行报告的生成频率是多少，报告将发送、存储到何处？\n\
  \n让我们准备解决方案设计文档 (`SDD`)。\n\neGleis Technologies 的 CEI 兼董事总经理 Hemant Joshi 详细说明了什么是\
  \ `SDD`。^(¹⁴)\n\n总而言之，解决方案设计文档是一份从高层角度描述项目技术解决方案的设计以及最优实施方式的文档。每个使用 `RPA` 技术自动化的业务流程都需要创建此文档。该文档由负责自动化该业务流程的\
  \ `RPA` 开发人员创建，并需征询 `RPA` 解决方案架构师的意见，后者将在文档移交给 `RPA` 运维部门之前对其进行审核。它属于 `RPA` 开发生命周期的设计阶段。\n\
  \n一份典型且有效的解决方案设计文档 (`SDD`) 包含以下组成部分（模板见附录 8）：\n\n-   **高层设计**：这应包括自动化流程图和基础设施架构图。\n\
  -   **信息安全**：合规要求有哪些？这可以从流程设计文档 (`PDD`) 中获取。\n-   **自动化执行前提条件**：考虑硬件、软件、许可证等。\n\
  -   **异常处理**：如何处理进入流程但无法处理的事务？每个流程都有一些“规则之外的异常”，你必须明确确定如何处理这些异常。\n-   **调试技巧**：你可以包含哪些建议来帮助未来的开发人员解决问题？请记住，如果将来出现问题，最初开发自动化的开发人员可能不在。\n\
  -   **成功标准**：最后，记录自动化成功所需满足的条件。\n\n**提示**\n\n虽然每个自动化流程都会有所不同，但请记住可能存在可复用的组件。这将提高整个\
  \ `RPA` 计划的效率。\n\n为任何 `RPA` 解决方案编写最合适的解决方案设计文档（有时也称为解决方案架构文档）是 `RPA` 开发过程中最关键的部分。\n\
  \n**提示**\n\n确保 `PDD`（流程设计文档）完整且详尽，将极大地有助于创建一份优秀的 `SDD`（解决方案设计文档）。\n\n以下是编写一份优秀的\
  \ `RPA` 解决方案设计文档过程中需要记住的要点。\n\n\n\n## 开发/实施\n\n一旦软件设计文档（SDD）完成、经过评审、批准并最终签署，机器人的开发工作即可启动。\n\
  \n在开发 RPA 解决方案时，开发或实施活动与传统的操作方式有所不同。对于新组建的 RPA 开发团队而言，工作可划分为三个阶段。首先是流程步骤的解决方案设计：自动化解决方案的具体形态是怎样的？机器人将执行哪些操作？这将确立技术解决方案的未来愿景或视图。\n\
  \n其次，对机器人进行详尽设计。基于已构想的解决方案，现在进入详细设计阶段。\n\n最后，在组织所使用的自动化工具中完成机器人的实际编码与实施。当然，这首先要确定技术解决方案的愿景，然后根据已创建的设计开展实际的编码工作。\n\
  \n与任何开发工作一样，必须遵循编码标准。如果你的组织没有编码标准，可以由团队自行制定。\n\n**暂停与思考**\n\n如果贵组织没有编码标准，引入 RPA\
  \ 计划正是制定这些标准的好时机。在你的组织中如何定义这些标准由你决定，但你需要确保这些标准足够严谨，并能在各平台及业务单元间通用。\n\n如果你的团队不确定编码标准在软件开发中的重要性，或许你可以提醒他们一些关键理由。编码标准有助于提升整个软件系统的质量。它们体现了一致的风格，仿佛由同一位开发者在同一时间段内完成所有代码。编码标准不仅仅反映了软件本身，更是组织形象的体现。此外，它们极大地提升了代码的可维护性；任何遵循既定标准的合格开发人员都能维护这些代码。拥有编码标准还有助于限制风险；由于遵循了标准，任何人都能读懂代码，从而减少了不确定性。编码标准也能提升代码质量；所有开发者都必须遵守专业、预先批准的标准。最后，这些标准有助于所有开发者熟悉代码结构。\n\
  \n《BOTmantra》的 Nishant Goel 和 Satyendra Shinde 提出了五（5）项关键编码标准及其子类别。以下列表展示了所有内容：\n\
  \n**前 5 项标准：**\n\n1.  **可读性**\n    1.  命名约定标准及合规性\n2.  **零垃圾代码使用**\n3.  **组件化**\n\
  4.  **简化逻辑**\n5.  **可配置性**\n    1.  性能参数\n    2.  URL、文件及文件夹路径\n    3.  电子邮件地址\n\
  \    4.  凭证信息\n    5.  业务规则阈值参数\n    6.  日志消息\n    7.  电子邮件格式\n    8.  通用设计\n6.\
  \  **可靠性**\n    1.  异常处理\n    2.  最佳交互技术\n    3.  避免内存泄漏\n    4.  自动恢复与自愈机制\n7.\
  \  **安全性**\n    1.  授权\n    2.  身份验证\n    3.  凭证管理\n    4.  业务数据存储\n    5.  数据共享\n\
  8.  **性能**\n    1.  延迟管理\n    2.  并行执行\n    3.  交互技术运用\n    4.  内存管理^(¹⁵)\n\n现在我们将详细审视每个组件：\n\
  \n**1. 可读性：** 代码的易读性如何？是否存在命名约定？是否遵循了命名约定？代码是否尽可能简洁？是否有注释来解释模块，甚至在必要时解释单行代码？\n\n\
  > **提示**\n> \n> 编写代码的开发人员可能并非随时可用，一旦出现问题。任何合格的程序员都应该能够阅读并理解这些代码。\n\n**2. 可配置性：**\
  \ 创建机器人时必须考虑到后续变更的可能性。可能需要添加新参数，或者不同系统需要与机器人“通信”。你是否包含了性能参数、文件路径、文件夹路径、各种凭证和业务规则等？\n\
  \n> **提示**\n> \n> 始终要着眼于未来进行设计。\n\n**3. 可靠性：** 需要达到怎样的精确度？请记住，我们说过，当需要从流程中移除进行人工处理的事件很少时，使用\
  \ RPA 自动化人工流程是最佳选择。对于正在处理的特定流程，可接受的异常率是多少？将如何处理这些异常？是否有自动恢复机制来避免停机？\n\n> **提示**\n\
  > \n> 有时人们认为面向客户的流程比内部流程需要更高的精确度。切勿在任何流程上偷工减料，否则会损害你的信誉。\n\n**4. 安全性：** 严格的风险评估将大大增强安全性。如前所述，风险评估是持续进行的：在早期阶段，仅能获得有限信息，因此无法全面了解所有风险。这没问题！但随着项目的推进，会识别出更多风险。每项风险都必须加以缓解或接受，除非风险过大，以至于治理委员会决定取消项目。了解以下内容很重要：使用、更改或停止自动化需要哪些授权？机器人如何“知道”它应该运行还是停止？身份验证如何完成？流程的输入和输出数据将存储在哪里？\n\
  \n> **提示**\n> \n> 如前所述，让你的风险与合规团队尽早参与将会非常有益。请记住，该团队在你的组织中可能有不同的名称。\n\n**5. 性能：**\
  \ 你将如何优化性能？哪种交互技术最适合这个特定流程？机器人能否同时运行两个或多个进程？对于这个流程，最高效的业务逻辑配置是什么？\n\n**暂停与思考**\n\
  \n前面讨论的四个组件都会影响性能。你的性能标准是什么？你的组织有哪些要求？清晰地定义这些要求将极大地帮助你确定可读性、可配置性、可靠性和安全性方面需要达到的标准。\n\
  \n在这一点上，你可能会觉得在组织中引入并成功实施 RPA 计划需要完成大量工作。是的，要做的事情很多。但你正在做的事情无异于一场革新贵组织运营方式的革命。这样的举措需要时间和精力，但如果执行得当，将带来显著收益。所以，不要被所需的工作吓倒；按照我们提供的步骤去做。当一步一步来时，任何任务都并非那么令人生畏。\n\
  \n**暂停与思考**\n\n对于每一项标准，你需要确定哪些是贵组织必需的，以及每项标准的严格程度应为多少。在贵组织中，哪些可配置性组件至关重要？哪些是“锦上添花”？每项组件应详细到何种程度？这些问题的答案会因公司而异，甚至在同一公司内部的不同业务单元之间也会有所不同。而且，某个自动化项目所需的标准可能比另一个项目更多或更少。\n\
  \n> **提示**\n> \n> 随着团队经验的增长，技术可行性将融入设计活动中，但就目前而言，它应保持独立。\n\n\n\n### 代码审查\n\n对于许多组织而言，代码审查即便会执行，也往往以非正式方式进行。在您的开发活动或团队中建立代码审查实践非常重要。丹·拉迪根在*ATLASSIAN\
  \ Agile Coach* 中写道：“代码审查有助于开发者理解代码库，并帮助他们学习能拓展技能的新技术和新方法。”^(¹⁶)\n\n在代码审查过程中，其他开发者会审查代码以保证质量；请记住，如今已没有“意大利面条式代码”的容身之地。代码审查有助于确保代码的可读性。\n\
  \n代码审查还能确保我们已讨论过的编码标准得到严格遵守。\n\n代码审查的另一个优点是，它有助于保证代码易于维护。\n\n它还能确保遵循正在自动化的特定流程的异常处理标准。\n\
  \n与开发的所有方面一样，当存在特定指导方针时，代码审查会更高效、更有效。拥有清晰记录的编码标准是关键。此外，提供并遵循检查表也很有帮助；请根据您的代码审查标准创建这些检查表。\n\
  \n另外，提供审查前培训通常也很有益，以确保开发者熟悉他们必须遵守的标准。\n\n拥有代码模板也大有裨益。\n\n> **提示**  \n> 如果您将代码审查视为事后想法，变成“如果有时间就做”的事情，那就准备好迎接失败吧。代码审查是任何\
  \ RPA 项目中不可或缺的一部分。\n\n## 测试\n\n一旦代码审查完成，且对代码所做的任何修改均已审查并重新审查，您就可以开始测试了。\n\n为了成功进行测试，测试团队必须完全熟悉该流程。了解并理解相关的`PDD`（流程设计文档）和`SDD`（解决方案设计文档）是成功的关键。\n\
  \n必须创建一份详尽的测试用例清单；这可以是一份总体测试计划。这将包含自动化所需的测试数据。\n\n> **提示**  \n> 随着 RPA 项目的推进，您将从缺陷中学习，从而改进测试流程。即使是最全面的测试计划也不会无懈可击；测试流程需要持续微调。\n\
  \n出于多种原因，自动化测试可能是一项挑战。一个主要原因是，许多组织没有测试环境。此外，有时获取数据也很困难，并且机器人可能会根据提供给它的数据表现出不同的行为。\n\
  \n另外，机器人需要交互的应用程序越多，构建和管理并行测试环境就越困难。因为在机器人执行期间应用程序会发生更新，有时测试只能在生产环境中进行。这包括机器人需要更新某些可能包含错误数据的屏幕，或者它可能进行不正确或不完整更新的情况。\n\
  \n在过渡到 RPA 时，遵循既定的测试技术至关重要。我们将探讨 RPA 测试中您可能会发现与其他方法学测试不同的一些方面。\n\n此外，请记住执行测试的人员必须经过培训。接受过最低限度培训的人或许能够执行测试（见步骤\
  \ 4），但步骤 1、2 和 3 需要一定程度的知识，如果在“工作中”学习这些知识会带来很高风险。请确保执行这些步骤的人员接受过相关培训。如果经验较少的人员将执行步骤\
  \ 4，请确保他们接受了关于步骤 5 所需内容的培训。\n\n1. **了解业务流程**：执行测试的人员必须深入了解并彻底理解正在被自动化的业务流程。缺乏这种知识，他们将无法正确开发和实施有效的测试。\n\
  \n   理解流程的最佳方式是审查流程定义文档（`PDD`）、解决方案设计文档（`SDD`）以及在自动化设计阶段创建的任何其他文档。一旦团队理解了业务流程，就可以进入下一步：创建测试场景来实际测试代码。\n\
  \n   > **提示**  \n   > 如果有不清楚的地方，请立即联系业务负责人以获取澄清。不要在理解流程上走捷径。\n\n2. **创建测试场景**：这是另一个关键领域。审查`PDD`和`SDD`，特别关注`SDD`，如果文档编写得当，它会列出需要测试的最重要的场景。但也不要忽略`PDD`；从该文档中也能收集到对构建测试场景非常有用的信息。\n\
  \n3. **编写测试脚本**：现在测试人员已经彻底理解了要自动化的流程并创建了测试场景，下一步是创建一系列测试用例。测试用例非常具体：它们列出输入、预期输出，并有一列（测试脚本通常在电子表格中编写）来指示测试通过或失败，另有一列用于记录备注信息。对于失败的测试，该列尤其有用。\n\
  \n   > **提示**  \n   > 为了最大化测试脚本的有效性，它们应由设计团队进行审查。这个“第二双眼睛”非常熟悉流程，能够帮助发现任何测试缺口。\n\
  \n4. **执行测试**：现在您已完成所有准备工作，可以执行实际测试了。完成每个测试用例的所有工作，记录每个测试是通过还是失败，并附上任何相关评论。\n\n\n\
  \n5.  `Rectify`缺陷：不要期望所有测试用例都能通过；如果都通过了，很可能是因为你没有创建足够有效的测试用例。缺陷很常见，发现它们是测试的主要目的之一。所有失败的测试用例都应被完整记录；信息过多总比过少要好。必须为开发团队提供足够的信息，以便他们能够纠正错误。\n\
  \n**暂停并思考**\n\n目前你所在组织的测试流程是什么？为了进行 RPA 测试，该流程需要如何调整？这些改变会遇到阻力吗？如果有，你将如何克服？\n\n\
  测试文档必须存储在一个相关人员易于访问的仓库中。请记住，需要查看文档的开发人员可能同时在进行多个项目。你需要确保他们能够快速、轻松地找到所需的信息。\n\n**暂停并思考**\n\
  \n目前你所在组织的测试文档存储在哪里？它是否易于访问，足以满足你新的 RPA 计划的需求？如果不是，需要做出哪些改变？由谁来执行这些改变？\n\n本节讨论的大部分内容都与质量保证（QA）和质量控制（QC）相关。这并非巧合！我们来看看各自的定义：\n\
  \n质量保证：“*质量管理*的一部分，专注于提供*质量要求*将得到满足的*信心*。”^(¹⁷)\n\n质量控制：“*质量管理*的一部分，专注于满足*质量要求*。”^(¹⁸)\n\
  \n因此，质量控制可以被视为满足质量保证的需求。\n\n**暂停并思考**\n\n你的组织是否有正式的质量保证和质量控制职能？如果有，如何将它们最好地整合到你新的\
  \ RPA 计划中？如果需要，有什么需要做得不同的地方？如果没有正式的质量保证和质量控制职能，你如何仍然能确保在你的 RPA 项目中两者的需求都得到满足？\n\n\
  ### 自动化测试执行\n\n当 RPA 团队正在自动化客户或终端用户的流程时，自动化其自身的流程也将是有益的。这包括自动化机器人的测试过程。\n\n由于所有机器人在功能上都是独特的，在决定自动化其测试之前，需要考虑几件事。确定测试自动化的使用频率。对于每个特定的机器人，创建自动化测试的简单或复杂程度如何。此外，确定你创建的测试自动化是否可以在未来用于测试其他机器人；尝试确定其可重用性。\n\
  \n如果确定自动化机器人测试将是有益的，那么这样做将包含三个组成部分。你首先需要执行自动化来搭建环境并创建所需的测试数据。然后执行机器人自动化。最后，你将收集机器人执行后的输出数据，并验证输出以创建测试摘要。\n\
  \n### 案例研究\n\n现在让我们看看解决方案设计是如何在我们的案例研究中实施的，该案例研究在第 4 章中介绍过。我们在第 5 章中继续推进。现在我们将看到我们的假设案例将如何在解决方案设计中推进。\n\
  \n让我们从创建`SDD`开始。在此文档中，我们需要填充各种信息。网上有各种可用的模板；使用我们提供的模板或任何其他看起来满足你需求的模板。\n\n#### 解决方案设计文档\n\
  \n**电话与地址变更**\n\n| **审批** | **签名** |\n| --- | --- |\n| Mary Brown，经理，客户服务部 |   |\n\
  \n|   |   | **备注** |\n| --- | --- | --- |\n| **作者** | John Williams，CSS 主管 |   |\n\
  | **日期** | 20xx 年 7 月 28 日 |   |\n| **版本** | 草案 0.1 | 初稿 |\n\n##### 本文档目的\n\n本文档包含电话与地址更新流程的解决方案设计。它呈现了高级别的“现状”流程步骤以及将被自动化的“未来”流程步骤。\n\
  \n当前流程如下：\n\n*  变更地址和/或电话号码的请求接收自指定的邮箱。\n*  CSS 验证客户 ID 并按需更新信息。\n*  CSS 与客户确认更新。\n\
  *  CSS 维护更新信息的记录。\n\n##### 流程图\n\n![../images/513218_1_En_6_Chapter/513218_1_En_6_Figb_HTML.png](img/513218_1_En_6_Figb_HTML.png)\n\
  \n##### 自动化目标\n\n目标是创建一个机器人，它将检索邮件，读取并解析它们，按指定信息进行更新，并通知客户信息已更新。\n\n##### 涉及的应用程序\n\
  \n| **名称** | **内部/外部** | **类型** | **是否需要凭据？** | **读/写** |\n| --- | --- | --- | ---\
  \ | --- |\n| Web 应用程序 – 客户 CRM | 内部 | 网络托管应用程序 | 是 | 两者 |\n| 大型机 1 | 内部 | 大型机 |\
  \ 是 | 两者 |\n\n##### 输入\n\n| **名称** | **描述** | **初始值** |\n| --- | --- | --- |\n|\
  \ `AddressUpdate_ClientID` | 一封包含客户 ID 和新电话号码和/或地址的邮件 | 地址和/或电话信息 |\n\n##### 流程步骤\n\
  \n**第一子流程**\n\n| **步骤编号** | **描述** |\n| --- | --- |\n| 1 | 机器人启动。 |\n| 2 | 机器人登录邮箱账户。\
  \ |\n| 3 | 机器人读取邮件。 |\n| 4 | 机器人提取客户信息。 |\n| 5 | 当所有邮件已读取完毕，机器人发送完成消息。 |\n\n**第二子流程**\n\
  \n| **步骤编号** | **描述** |\n| --- | --- |\n| 6 | 机器人登录 Web CRM。 |\n| 7 | 机器人使用客户 ID\
  \ 进行搜索。 |\n| 8 | 机器人未找到客户 ID – 发送“未找到”消息。 |\n| 9 | 机器人找到客户 ID。 |\n| 10 | 机器人将客户信息填入相应字段。\
  \ |\n| 11 | 机器人激活更新。 |\n| 12 | 机器人发送完成消息。 |\n\n**第三子流程**\n\n| **步骤编号** | **描述**\
  \ |\n| --- | --- |\n| 13 | 机器人登录大型机。 |\n| 14 | 机器人使用客户 ID 进行搜索。 |\n| 15 | 机器人未找到客户\
  \ ID – 发送“未找到”消息 |\n| 16 | 机器人找到客户 ID。 |\n| 17 | 机器人将客户信息填入相应字段。 |\n| 18 | 机器人激活更新。\
  \ |\n| 19 | 机器人发送完成消息。 |\n\n**第四子流程**\n\n| **步骤编号** | **描述** |\n| --- | --- |\n\
  | 20 | 机器人向客户发送邮件。 |\n\n##### 异常\n\n* 业务异常\n  * 邮件中缺少客户 ID：发送异常消息 `EmailMissingClientID`。\n\
  \  * 邮件中缺少姓氏或名字：发送异常消息 `EmailMissingFirstOrLastName`。\n* 技术异常\n  * Web CRM URL 无法访问：发送异常消息\
  \ `CRMInReachable`。\n  * 登录密码失败 – Web CRM：发送异常消息 `LoginFailedPWDExpired`。\n\n#####\
  \ 成功标准\n\n当机器人每天（时间待定）发送作业完成通知时，流程结束。\n\n##### 调试技巧\n\n\n\n如果机器人无法登录电子邮件，请运行电子邮件子任务。如果在\
  \ Web 应用程序中更新地址或电话号码时出现错误，请运行 Web 应用程序系列任务，并检查机器人是否成功完成更新。可以遵循相同的过程来检查并确保主机系统已更新。\n\
  \n**维护**\n\n此机器人具有正常优先级。如果机器人失败或出错，请运行数据库脚本以重置机器人并重新启动机器人。\n\n**机器人调度**\n\n机器人将在每周一至周五的上午\
  \ 11:00 运行。\n\n**灾难恢复**\n\n如果机器人完全故障，团队将需要恢复手动流程：\n\n*   运营团队将手动执行该流程，直至收到问题已解决的通知。\n\
  *   RPA 团队将负责运营跟踪、监控和维护。如遇任何临时中断或计划性停机，COE 将提前充分通知业务部门，并加速恢复服务。\n*   流程负责人应系统地审查和审计结果，以确保实现功能价值。\n\
  *   主机系统的任何变更都将提前足够时间主动通知 RPA 团队成员，以确保他们能够进行必要的调整。\n*   流程负责人将收到所有故障的通知邮件。\n\n**术语表**\n\
  \n| **术语** | **描述** |\n| --- | --- |\n| **RPA** | **机器人流程自动化** |\n| **SIT** | **系统集成测试**\
  \ |\n| **SLA** | **服务级别协议** |\n| **SME** | **主题专家** |\n| **UAT** | **用户验收测试** |\n\
  \n**附录**\n\n**附录 A**：异常消息\n\n*   `EmailMissingClientID`\n*   `EmailMissingFirstOrLastName`\n\
  \n让我们详细看看这些组成部分。\n\n封面页包含几个组成部分：文档名称。这是 SDD，需要指明它属于哪个项目。文档作者是负责创建文档的人。可能是架构师或设计师，但也可能是团队的其他成员。文档版本应指明它是初稿还是后续草稿、是否为最终版本以及是否已获批准。通常，草稿版本以\
  \ 0 开头，并在审阅和更新时递增：0.1 是初始草稿，0.2 是更新后的草稿，等等。“注释”列用于进行任何说明。例如，草稿 0.2 可能有这样的注释：“根据与\
  \ Mary Brown 的审阅意见进行修订，她要求修改 XYZ。”\n\n同样在封面页上，有供批准使用的空间。姓名/角色是负责批准文档的人员的姓名和角色。可能是产品负责人、业务负责人、交付经理或其他角色。“签名”在指定人员批准文档时将是电子形式的。\n\
  \n**暂停并思考**\n\n请记住，版本（草稿、最终版等）和角色名称（产品负责人、业务负责人等）因公司而异。请使用您组织内使用的名称。\n\n“本文档的目的”提供了流程自动化概述的非常简短的描述。这对于从高层次理解机器人将要做什么非常有帮助；更多细节包含在文档的后续部分。\n\
  \n在 PDD 中开发的“流程图”包含在此处，旨在让开发者“一目了然”地了解他们将要自动化的当前手动流程。\n\n“自动化目标”开始深入更具体地说明机器人将做什么。\n\
  \n在“涉及的应用系统”中，您将列出自动化将要与之交互的应用系统。通过识别所有应用系统，您可以发现自动化需要何种访问权限才能与它们中的每一个进行交互。\n\n\
  开发者需要知道“输入”是什么。在我们的示例中，只有一个输入（来自客户的电子邮件），但这只是一个简单的案例研究。您的“实际”工作可能包含更多输入。\n\n虽然已经提供了流程的非常高层级的描述，但开发者无法据此进行构建。现在您需要详细列出各个“流程步骤”。在我们的案例研究中，有四个简单的子流程。如您所见，它们非常具体且处于非常低的层级。\n\
  \n任何流程都会出现异常。在我们的案例研究中，可能是电子邮件不包含客户 ID，或者客户 ID 数字过少或过多；新电话号码可能缺少一位数字，等等。这些“异常”必须由机器人处理，本部分将解释如何处理。\n\
  \n机器人有起点和终点，有必要确保任何监控它的人（无论是实时还是定期）都知道它已完成每个周期（如指定的每小时、每天等）的工作。必须定义这些“成功标准”。它会是机器人发送给经理的电子邮件，说明\
  \ 20xx 年 7 月 29 日指定邮箱中的所有邮件都已处理完毕吗？它会是大报告或仪表板上的一个标注吗？无论是什么，都应在此处指定。\n\n没有哪个应用系统能一直完美运行。因此，SDD\
  \ 应包含一些基本的“调试技巧”。这些是您可以包含在内的建议，以帮助未来的开发者解决问题。请记住，最初开发自动化的开发者可能在将来出现问题时无法提供支持。\n\n\
  \n\n## 维护\n\n一旦机器人被部署到生产环境并上线运行，它便会开始按照预定的计划执行任务。此时，维护工作便提上了日程。每个机器人都有一份服务级别协议（SLA），用于在机器人未能按预期执行时设定业务期望。这主要涉及两个方面：一方面是技术层面，另一方面是业务层面。技术层面涵盖因服务器宕机、基础设施维护等技术原因导致机器人无法运行的情况。业务问题则可能与机器人因数据不可用，或在机器人执行时为其提供数据的输入系统尚未就绪而导致无法按要求运行有关。\n\
  \n对于技术原因，技术团队或卓越中心（COE）的主要职责是向业务部门通报中断情况，并与任何其他相关利益方共享事态信息。应确保他们随时了解进展情况和机器人预计恢复正常运行的时间。对于任何业务原因，技术团队需要与业务团队协调，以便暂停或中止机器人运行，直至业务问题得到解决；技术团队还将与业务团队和/或卓越中心团队紧密合作，确保信息同步。\n\
  \n**调度：** 开发人员需要了解机器人的运行时间。这可能是每天在特定时间运行一次或多次；也可能是每周、每月等。这将在与业务的早期讨论中确定，并在此处为开发团队记录。\n\
  \n**灾难恢复：** 如果机器人停止工作怎么办？要么是完全停止运行，要么是发生故障，以至于无法执行其任务。同样，这种情况下的处理方式应该在更早的时候（通常在最初创建风险评估时）就与业务部门讨论过。无论最终决定是什么，都应在此处说明。至少，在机器人修复完成之前恢复到人工流程是灾难恢复的一个方面。\n\
  \n完成 SDD 后，可根据贵组织的流程将其提交审批。\n\n一旦 SDD 获得批准，您就可以开始在选定的自动化工具中开发机器人了。本书中介绍的步骤对于您使用的任何工具都将有效。\n\
  \n## 测试\n\n在按照我们案例研究中的流程构建机器人以实现自动化之后，下一个关键活动是测试机器人。\n\n为了记录所有测试、测试执行及其结果，可以创建一个测试总结文档。尽量保持测试总结文档的简单性，以便于理解。在我们假设的自动化项目中，我们将遵循一个包含三个选项卡的测试总结：\n\
  \n- 第一个选项卡包含关于机器人和测试结果的信息。\n- 第二个选项卡包含测试场景及其结果。\n- 第三个选项卡包含测试数据。\n\n**测试总结**\n\n\
  ![../images/513218_1_En_6_Chapter/513218_1_En_6_Figc_HTML.gif](img/513218_1_En_6_Figc_HTML.gif)\n\
  \n请注意，此选项卡包含版本历史、审批详情、测试结果和环境详情。其中需要填写的信息是不言自明的。对于“环境详情”，请包含与该环境中测试相关的任何风险。如果是在生产环境中进行测试，这一点尤其关键。\n\
  \n**测试场景和结果**\n\n| **前置条件** | **流程步骤编号** | **测试用例描述** | **预期结果** | **实际结果** | **测试用例实际状态**\
  \ |\n| --- | --- | --- | --- | --- | --- |\n| 电子邮件帐户已在邮件服务器上设置完成。 | 1 | 机器人登录到电子邮件收件箱。\
  \ | 机器人成功登录电子邮件帐户。 | 机器人能够登录 | 通过 |\n| Web CRM 应用已启动并正在运行。 | 2 | 机器人登录到 Web CRM\
  \ 并更新一个地址和电话号码。 | 机器人成功更新一条记录。 | 机器人能够更新记录 | 通过 |\n| 大型机 1 已启动并正在运行。 | 3 | 机器人登录到大型机并更新一个地址和电话号码。\
  \ | 机器人成功更新一条记录。 | 机器人能够更新记录 | 通过 |\n\n这部分内容也是不言自明的。\n\n**暂停与思考**\n\n您会发现，通过尽可能简化流程和文档，您的\
  \ RPA 计划将取得更大的成功。但切记，在简化的同时不要牺牲质量。\n\n**测试用例**\n\n| **ID** | **基于 FRD 的场景** |\n\
  | --- | --- |\n| Auto-001 | 机器人成功登录电子邮件收件箱并读取电子邮件。 |\n| Auto-002 | 机器人成功登录 Web CRM\
  \ 并更新地址和电话号码。 |\n| Auto-003 | 机器人成功登录到大型机 1 并更新了地址和电话号码。 |\n\n此部分展示了必须执行的特定测试用例。\n\
  \n（出于案例研究的目的，我们仅展示用户验收测试）。\n\n测试之后，需要业务方的签收确认。这可以通过将此测试文档转发给业务负责人，然后接收并保存他们的批准（通常通过电子邮件形式）来完成。\n\
  \n测试可以分多次迭代完成；也可以进行不止一次，以确保机器人能够按预期交付成果，并能根据要求处理异常情况。\n\n此时，应通知治理委员会业务批准和解决方案设计情况；无需召开会议。如果委员会成员有任何疑问，他们会通知\
  \ RPA 团队。\n\n完成测试并获得批准后，就可以开始准备打包和部署了；下一章将对此进行详细说明。\n\n脚注 1 2 3 4 5 6 7\n\n"
- "# 7. 解决方案部署、维护与退役\n\n一旦自动化/技术团队在 UAT/测试环境中完成机器人的开发和测试，就应将其部署到生产环境中。确保您的技术团队遵循所有已有的机器人测试和开发流程，以便将符合业务期望的优质解决方案投入生产。为了将机器人迁移或部署到生产环境，应遵循详细且准确的操作流程，以避免部署过程中出现任何意外问题。在本章中，我们将详细探讨将机器人部署到生产环境需要了解的所有内容，包括如何管理和支持上线后的机器人，以及如何在需要时使机器人退役。这将防止机器人在整个上线生命周期中出现任何不愉快的意外情况。\n\
  \n除了这些主题，我们还将讨论机器人的审计和性能优化。\n\n\n好的，作为高级文档工程师和翻译员，我将严格遵守您提供的注意事项和示例格式，将给定的英文文本翻译成中文。\n\
  \n\n## 解决方案（自动化/机器人）部署\n\n现在是时候将您已完成的工作投入运营了。您已获得每个关卡的批准；更新了风险、投资回报率、规模等信息；并设计和创建了解决方案。现在，您已准备好将机器人投入生产环境。\n\
  \n一些较大的组织设有卓越中心；许多组织则没有。`COE` 这个术语在不同的公司有不同的含义，其职能可能由 `COE` 或技术团队执行。因此，当我们提到 `COE`\
  \ 时，请记住它在贵公司可能名称不同，或者根本不存在。\n\n这个组织，无论是 `COE`、贵公司的其他团队，还是技术团队，都将对部署新机器人负有最终责任。它将确保能够满足预定的部署日期，并确保相关应用程序不会因新机器人而受到损害，同时将与\
  \ `RPA` 团队一起监控性能。\n\n对于任何 `RPA` 项目，都需要许多职能；请记住，这些职能可能由卓越中心或类似团队执行，也可能由技术团队执行。您必须考虑机器人运行环境的架构（基础架构支持、技术选择）。此外，`RPA`\
  \ 的运营（维护、支持、监控、新资源培训、变更管理）也至关重要。您的治理模型是什么样的？这包括与整体组织架构的整合、对负责支持 `RPA` 项目所有功能的资源的监督、对政策和程序的合规性、系统安全访问、流程优先级以及升级路径。\n\
  \n您需要了解交付流程（流程发现与评估、解决方案设计、测试、部署、标准制定）。\n\n此外，如果贵组织有 `COE`，除了其他职责外，它还负责维护各业务线在 `RPA`\
  \ 方面所需的通用功能。这使得机器人管理更简单、更具成本效益。`COE` 还负责制定标准和最佳实践，并促进持续改进。\n\n### 暂停与思考\n\n我们已经详细讨论了卓越中心，并承认您的组织中可能没有这个部门。我们还详细介绍了并将继续讨论\
  \ `COE` 的作用。在您的组织中，谁将负责这些任务？请记住，可能不是一个团队，而是由多个团队或个人分担这些工作。\n\n正如您所见，尽早与 `COE` 接触将极大地帮助您按时、有效地部署机器人。\n\
  \n`COE` 在管理访问权限和安全性方面也至关重要。`COE` 确保机器人仅有权访问该特定自动化所需的资源（应用程序、系统等）。用户 ID 和密码会定期过期，`COE`\
  \ 会协助根据需要更新它们。这与其他应用程序管理功能不同，在推行您的 `RPA` 计划时，意识到这些差异非常重要。\n\n由于组织中的 `RPA` 项目发展迅速，`COE`\
  \ 可以推动新基础设施的构建和新自动化工具的采用。\n\n然而，许多组织并没有正式的 `COE`。如果您属于这种情况，相同的职能仍然必须完成，只是将由技术团队来执行。\n\
  \n### 暂停与思考\n\n当我们说“技术团队”时，我们指的是比开发者更广泛的团队。这可以包括流程分析师、架构师、业务分析师、基础架构分析师、开发者、资产管理、安全等角色。在您新的\
  \ `RPA` 项目中，技术团队由哪些角色组成？\n\n技术团队将与提出自动化需求业务伙伴密切合作。同样的任务——制定标准和最佳实践、持续改进、安全、访问管理等——仍然需要执行，但技术团队将主导每一项工作。\n\
  \n拥有 `COE` 既有优点也有缺点，所以如果您没有，也不必感到处于劣势。\n\n当组织中没有 `COE` 或同等团队时，技术团队将接管 `COE` 的所有职责。由于沟通仅在技术团队成员之间进行，因此需要的沟通更少。可以实现更快的行动和更短的响应时间。技术团队做出大部分决策，并且支持与维护需要更少的管理，因为无需与任何外部团队或部门进行额外的沟通和协作。技术团队可以根据自己的特定需求建立流程，并及时改进或修改。\n\
  \n而设有 `COE` 时，它必须遵循组织指南，并概括流程和标准。这些可能不太适合单个团队，可能需要修改或更新以适应特定机器人/团队/部门的需求。因此，虽然拥有\
  \ `COE` 确实有优势，但也可能存在缺点。\n\n> **提示**\n>\n> 如果您的组织有 `COE`，不要试图绕过它，即使您认为这样可以加快部署。这会导致各种各样的问题，并可能使您的\
  \ `RPA` 项目功亏一篑。\n\n### 部署与发布的流程设置\n\n#### 部署的前提条件：机器人规模估算等\n\n在部署任何机器人之前，需要确定各种信息并与各方共享。这些信息包括：\n\
  \n*   自动化的规模。这可能涉及文件数量、数据库脚本数量、或其他设置，如调度、频率和所需机器人的数量。规模估算可以基于多种因素。例如，可以根据在指定时间内完成工作所需的机器人数量来确定；如果工作可以在两小时内完成，可能只需要一个机器人；但如果相同的工作需要在三十分钟内完成，则可能需要四个或更多机器人。规模可能取决于自动化的复杂性或需要自动化的步骤；如果这些步骤逻辑复杂或必须同时与多个应用程序交互，则会增加自动化的复杂性，从而需要对机器人进行更多控制。\n\
  \n规模可以分为小型、中型或大型。这种分类可以由多种因素决定。在早期阶段会获得初步了解。随着您获得更多关于流程的信息，您将确定规模。\n\n决定规模的因素包括：自动化的流程步骤数量、访问的系统数量、工作量等。请注意，在此时，您已经知道它是“小型”、“中型”还是“大型”。随着您在流程中不断推进并获取更多信息，您现在能够明确地确定自动化的规模。在“机会评估”期间，您将对规模有一个高层次的了解，但真正的规模将取决于在解决方案架构阶段最终确定的解决方案和范围。\n\
  \n请记住，不必过于担心将规模估算得完全准确。这些都是通用术语。\n\n> **暂停与思考**\n>\n> 对于每个组织来说，小型、中型和大型的定义将取决于此处包含的因素以及您组织自身的情况。在您的组织中，什么构成了“小型”、“中型”或“大型”？\n\
  \n此外，机器人可以是有值守的或无值守的。“有值守”意味着有人在观察机器人的执行过程并在其运行时进行监控。这样做是为了在机器人出错时能够采取措施。有值守的机器人始终处于被监控状态。\n\
  \n一个“无值守”的机器人在部署期间仍会被观察，但一旦其运营方面被证明是成功的，它就不再是“有值守”的了。\n\n\n\n#### 1. 部署说明与文档\n\n\
  如前文段落和列表所述，为确保部署顺利成功，需要完成大量工作。为此，必须针对具体部署记录详细的说明文档。尽管上文项目符号列表中列出的所有事项均需完成，但每个自动化项目都有其专属任务。这些任务包括：准备过渡到生产环境的表格，并将其分享给`COE`（如有），或分享给技术团队的相关成员（如无`COE`）。请参考\"\
  过渡到部署\"表格。\n\n#### 2. 发布选项（试点发布）\n\n当自动化流程或机器人规模庞大、性质复杂且对业务至关重要时，可以选择以受限方式部署机器人，而非全面上线。有多种方案可供尝试或调整，这种技术也称为试点发布。\n\
  \n试点发布有多种选择，包括：\n\n- **单机器人模式**：若需与多个机器人同时发布，试点阶段可仅发布单个机器人，以便在出现错误时妥善处理。有时若机器人全面发布本身即为单一模式，则可采用受限模式。\n\
  - **受限模式**：在该模式下，前几日分配给机器人的工作量较轻，并持续监控其运行表现。\n- **幽灵模式**：当机器人完成的工作对最终用户可见，或对业务产生重大影响时（例如，存在依赖机器人工作或更新的服务），最好在保修期（后文详述）内向最终用户交付前进行验证。这可通过将输出重定向至系统的其他区域或另一环境（如向技术团队成员发送邮件、生成报告等）来实现。若输出结果符合预期，则可在生产系统中重新运行机器人（但不处于幽灵模式）。\n\
  \n没有硬性规定，完全取决于具体情况以及如何捕获机器人的输出结果。在试点发布前必须综合考虑所有这些因素，以便有效管理。\n\n#### 3. 与业务部门协商部署/发布日期\n\
  \n通常，提出自动化需求的人都希望能尽快实现！在初期讨论阶段（参见第 4 章和第 5 章），您与业务负责人及主题专家已就合理日期达成共识。这往往不是一个具体日期，而是一个日期范围。例如，业务部门与开发团队共同商定，合理的部署日期定在\
  \ 20xx 年 5 月 15 日至 6 月 8 日之间。\n\n若您的组织设有`COE`，此信息应已尽早传达给他们。若无`COE`，则应与业务部门以及您需要影响的系统和应用程序负责人保持定期沟通，告知他们该日期范围，并确认其合理性。\n\
  \n现在是与业务部门最终敲定日期的时候了。相比前期阶段，您现在掌握了更多信息。您已了解需要影响的上游和下游系统及应用程序，清楚部署需要完成哪些工作，并可根据这些信息与业务负责人确定具体日期。\n\
  \n如果您的组织设有`COE`，该团队一直是技术团队和业务部门的第三方合作伙伴，现在必须将其纳入发布日期的决策过程。`COE`应在得知业务部门和技术团队可接受的范围后尽早收到通知。若当时`COE`表示该范围内无可行日期，您需反馈给业务部门重新协商。现在则是与`COE`及业务部门共同确定部署日期。\n\
  \n#### 4. 保修期\n\n当组织设有`COE`时，机器人在生产环境部署后，保修期由`COE`提供。在无`COE`的组织中，保修期由技术团队负责。通常保修期设定为两周，但期限灵活。对于非常简单的机器人，可能仅需一周，但缩短保修期需由业务部门和技术团队共同决定。同样，对于极为复杂的机器人，保修期可延长至三到四周。不过，延长保修期的情况并不常见，需由业务部门、技术团队和`COE`（若有）共同商定。这在一定程度上取决于额外期间提供支持所需的资源及其可用性。\n\
  \n还建议在此类情况下，若有`COE`，应尽早告知其延期事宜，以便他们有充足时间做好准备。\n\n- 若您的组织设有`COE`，需确定在部署期间由`COE`派驻的具体人员。这应该不难确定，因为若有`COE`，您从流程初期就一直在与该团队互动。\n\
  - 验证所有项目和/或文件夹结构是否符合所使用的生产自动化工具的所有指南要求。\n- 确保生产环境（`URL`、网络等）中的所有应用程序和系统均可通过机器人用户\
  \ ID 及用于应用程序的任何其他用户 ID 进行访问。\n- 确保基础设施能够按计划新增自动化和机器人。\n- 存在哪些风险？此时，所有已识别的风险都必须有相应的缓解计划，并指定专人负责。缓解计划可能仅仅是接受风险，但必须指定责任人，以便在风险事件发生时，可以联系该人员商定处理方式。\n\
  - 另一项信息是机器人的调度安排。自动化每天、每周、每月甚至每年运行多少次？还是\"按需\"运行？这些信息应在最初接收到自动化请求目的时尽早确定。\n- 机器人预期处理的工作量也至关重要。若工作量稳定且机器人运行周期不变，则较为简单；但若工作量在每次运行间显著变化，且缺乏相关信息、模式或历史数据，则必须仔细记录。掌握历史信息（例如，每月前三天的工作量通常翻倍）将极大有助于成功部署机器人。\n\
  - 必须验证机器人在生产环境中使用的访问权限，包括环境、用户 ID、应用程序访问和网络访问。\n- 验证通信电子邮件是否正确。例如，若机器人需将异常情况（因各种预识别原因进入流程但无法由机器人处理的情形）发送至特定邮箱，请确保地址正确。\n\
  - 若机器人是对现有自动化的更新或增强，必须制定灾难恢复计划。一旦更新或增强出现问题时，需能迅速回退至更新或增强前的机器人版本，至少确保已处理的工作能够继续进行。\n\
  - 任何软件版本均包含三部分：\n  - **发布号**（有时称为\"主版本号\"）：对于新自动化，发布号为一（1）。当引入重大变更时，发布号或主版本号也会随之更改。例如，对软件包进行大规模或可能不向前兼容的更改。\n\
  \n\n### 排版后的内容\n\n如需进行增强（包括向自动化流程中添加手工流程的步骤——请记住，初始自动化可能仅自动化了部分手工步骤；在某个阶段，可能会使用同一个`Bot`来自动化更多步骤），则版本号应递增一位。\n\
  \n-   **次版本号**：当`Bot`中推出了一系列较小的功能时，次版本号会发生变化。\n-   **补丁号**：当现有`Bot`部署了新版本时，补丁号会发生变化。这通常用于小型错误修复或更新`Bot`所使用的模板等。\n\
  -   版本号的示例为：`1.002.013`。这表明它是初始版本（即主版本），经历了 2 次次版本更新，以及 13 次补丁变更（错误修复、模板更新等）。\n\
  -   请明确识别业务中必须出席部署的具体人员（而不仅仅是角色），以及`SME`（主题专家）。\n\n**暂停思考** 在本书中，我们一直强调识别角色，而非具体个人的姓名。现在我们指定个人姓名，是因为在这个阶段，你需要确切知道将由谁来承担这些职责。\n\
  \n#### 部署的主要步骤\n\n在准备部署时，你必须确保所有利益相关方都同意的预定部署日期。同时，要确保所有必需的文件都已为部署流程签署完毕。这包括合规所需的所有文件：需求文档、代码审查和测试摘要。利益相关方包括发布或交付经理以及业务产品负责人。你的组织中可能还有其他需要签字确认的利益相关方。\n\
  \n接着，你将打包所有代码文件，并创建数据库脚本或任何`Bot`脚本（取决于所使用的自动化工具），以及所有相关的`Bot`文档（例如，自述文件）。\n\n**提示**\
  \ 有些软件工具允许通过用户界面将`Bot`从预生产或 UAT 环境部署到生产环境。请检查你所在组织使用的自动化工具是否提供了将文件从 UAT 环境移动到生产环境的用户界面。\n\
  \n你需要与部署团队共享所有必需的文件（即上一步中创建的所有文件）及相关文档。这可以通过网络共享、电子邮件或自动化工具本身来完成。\n\n**提示** 有些软件自动化工具可能提供构建脚本的功能，这些脚本可以通过手动方式或其他方式调用来部署`Bot`。同样，你需要检查你正在使用的自动化工具是否提供了将文件从\
  \ UAT 环境移动到生产环境的用户界面。\n\n在临近部署时，请与部署团队成员安排一次会议，以锁定他们在商定的部署时间内的时间。你需要确保他们届时能够参与部署。\n\
  \n现在，你将把所有文件部署到生产环境中，并根据需要在数据库上运行脚本。一旦所有文件共享给部署团队，所有文件将在预定的部署时间段内复制到生产环境。请验证所有必需的脚本是否已运行。\n\
  \n**提示** `Bot`也可以通过将代码文件物理复制到生产环境，并根据需求更改相应的数据库来部署。如前所述，你需要确定你正在使用的自动化工具是否提供了将文件从\
  \ UAT 环境移动到生产环境的用户界面。\n\n你将根据需求对`Bot`进行调度（例如，每小时、每天、每周、仅限工作日等——这在流程的早期阶段已经确定）。然后，如果需要，你将在生产环境中对`Bot`进行试运行。这可以确保`Bot`在生产环境中正常运行，因为环境是全新的。生产环境可能与测试环境不同。之后，你将验证结果以确保`Bot`正常工作，然后向业务团队宣布部署成功。\n\
  \n**暂停思考** 部署步骤会因你所在组织用于实施 RPA 的软件自动化工具而异。根据你选择的工具，你所在组织的开发流程将需要做出哪些更改？\n\n技术团队将按照与业务部门（以及`COE`，如果有的话）商定的方式，继续监控`Bot`几天。这适用于新的`Bot`。对于升级或其他变更，技术团队将仅根据约定监控一个运行周期或一天。\n\
  \n我们提供了在部署前需要完成的冗长清单。你将如何记住完成所有这些事项？避免任何遗漏的最佳方法是使用检查清单。以下是一个示例（为方便起见，该示例也包含在附录 11\
  \ 中）。\n\n\n\n### 部署与发布设置检查清单\n\n| 项目 | 项目详情 | 备注 | 状态* |\n| --- | --- | --- | ---\
  \ |\n| **产品（机器人）名称** | | 提供用于指代该解决方案/自动化的名称。该名称将用于库存、报告、变更请求等。 | |\n| **商定的部署日期和时间（如适用）**\
  \ | | 根据项目计划，提供计划的/首选的部署日期。 | |\n| **自动化规模** | | 可为小型、中型或大型。 | |\n| **机器人计划** |\
  \ | 指定首选计划（每周的时间和天数）。机器人可接受启动时间的范围。机器人的近似运行时长。流程中是否有任何影响自动化计划的服务级别协议？ | |\n| **质保期联系人**\
  \ | | 在质保期内，部署团队可能需要联系交付团队中熟悉代码的软件开发人员。确保该开发人员在部署日期后的五个工作日内随时待命。 | |\n| **职责分离声明**\
  \ | | 交付团队将注明编写代码的软件开发人员姓名。自动化服务团队将注明执行用户验收测试的人员姓名，以及在自动化服务团队中负责部署代码的人员姓名。为保障职责分离，自动化服务团队将确保编写代码的软件开发人员与执行用户验收测试的人员非同一人。将代码部署到生产环境的人员与编写代码的人员非同一人。\
  \ | |\n| **工作量** | | 在指定时间段内（每日、每周等），预计机器人需处理多少项任务？ | |\n| **访问权限验证** | | 说明需要何种类型的访问权限，以及是否已在生产环境中验证。\
  \ | |\n| **通讯电子邮件地址** | | 因任何信息、错误或其他原因需要联系的人员（业务和技术联系人）的电子邮件地址。 | |\n| **灾难恢复**\
  \ | | 回滚步骤、实施后步骤。 | |\n| **主要/次要版本** | | 说明这是对现有机器人的小改动，还是重大更改。 | |\n| **部署时在场人员**\
  \ | | 列出部署时必须到场的人员姓名及其角色。 | |\n| **COE 联系人** | | 列出此联系人的姓名和职务。 | |\n| **文件夹结构**\
  \ | | 列出任何需要新建的文件夹。 | |\n| **系统/应用程序可访问性** | | 记录任何已知问题。 | |\n| **基础设施能力** | | 记录任何已知问题。\
  \ | |\n| **风险识别及负责角色** | | 根据风险评估总结此项。 | |\n| **部署说明/步骤****任务部署步骤****实施前步骤****实施步骤****测试实施步骤****回滚步骤****实施后步骤**\
  \ | | 提供详细的部署脚本。通常由自动化服务部署经理指定实施和备份步骤。 | |\n| **已建立的沟通渠道** | | 具体说明。 | |\n| **生产支持模式**\
  \ | | 您是否保留此自动化的故障修复责任？如果是，请为业务技术支持团队提供补救支持队列名称和电子邮件联系信息。如果否，自动化服务团队将作为 D2P 流程的一部分，让开发团队参与进来，以确保顺利过渡到维护知识转移。\
  \ | |\n\n“状态”可以是“已完成”、“未完成”或“不适用”。对于“未完成”或“不适用”，请务必附上简短的解释性备注。\n\n## 在 COE/LOB 与开发团队之间保持关于部署的沟通\n\
  \n我们之前提到过，您的组织可能有也可能没有 COE。如果有，那么在自动化计划的全过程中与 COE 合作至关重要。关于编码标准、代码审查标准、自动化工具升级以及部署计划，必须有高效的沟通。技术团队有责任设定预期。业务部门希望部署在哪个日期（范围）内进行？是否需要进行任何基础设施升级？将使用哪个开发环境？\n\
  \n如果有 COE，由它来定义谁将维护开发环境，以及谁将维护机器人。一些可能由 COE 维护，一些由开发团队维护。如果有 COE，则由它负责机器人的执行。\n\n\
  技术团队与业务部门保持联系，因此在维护期间的协作和沟通中，技术团队承担着更重要的角色。如果机器人未能运行，业务部门将联系技术团队，然后技术团队将与业务部门和 COE（如果有）协作，确定下一步行动。这可能包括：在机器人修复之前，恢复到手动流程；一旦有工作可用，重新运行机器人；或者停止机器人，并在业务部门确定可以重新启动时重新启动它。重新运行机器人取决于\
  \ SLA；重新运行的选项通常在部署计划制定时确定。我们来看一些例子：\n\n1.  停止机器人：可以停止机器人，流程改为手动执行，直到修复完成。然后机器人利用新的、传入的信息重新开始工作。\n\
  2.  重新运行机器人：也许机器人没有按计划在夜间运行。在这种情况下，可以在第二天简单地在有人监控的情况下运行它，以确保它正常运行。\n3.  停止并重启：如果机器人执行效果不佳，并且原因是机器人正在处理的工作负载（需要一些调整或更新），或者手动流程需要一些更改，那么可以停止机器人并进行必要的更改。例如，机器人正在处理\
  \ Jira 卡片（它们是机器人的输入），并且在机器人启动之前需要执行的手动流程步骤尚未完成（例如，Jira 卡片尚未根据机器人要求进行更新或设置），则可以停止机器人，直到手动流程中所需的工作完成。然后可以重新启动机器人。\n\
  \n一级支持由 COE 执行：更改计划、更改运行频率、更改同时运行的机器人数量、更新用户 ID 和密码、更改机器人的优先级，以及包含/排除在需要接收机器人信息时需要联系的所有电子邮件\
  \ ID。所有不影响技术侧机器人实际运行的更改和更新。例如：机器人运行正常，但需要更改机器人的某些设置。这些是非功能性需求。\n\n二级支持由技术团队执行：当机器人未按需求/预期运行时。这涉及功能性需求。\n\
  \n在没有 COE 的情况下，一级和二级支持均由技术团队与业务负责人协作完成。\n\n\n\n## 机器人维护\n\n### 3.1 设置并管理支持队列\n\n\
  1. **敏捷模式**：开发团队轮换（每周？）值守支持，负责响应 COE/LOB 部门关于故障的联系。可设立专用收件箱用于报告机器人性能及异常情况，由当周指定的开发团队成员监控。这种方式能让所有团队成员熟悉所有机器人。在更传统的方法中，通常指派一到两名技术团队成员负责支持队列，但也可以实施更灵活的轮换支持机制，以提升团队成员对所有机器人的了解。\n\
  \n   在设置支持队列时，COE 与业务部门之间的工作流程应非常清晰。这包括：当事故报告给技术团队时，需要确定：是否该停止机器人？该特定机器人的业务方联系人是谁？机器人是否可以重新运行（是预先决定每次均重新运行，还是需要个案决策）？是否每次都要立即停止？等等。对于某些机器人，已知业务方希望其在失败后能重新运行。\n\
  \n   可以为每个机器人编写简短的\"后续步骤\"说明，以确保对任何报告的事故都能快速响应。这将极大帮助事故发生时任何被指派支持的人员。步骤可能包括：联系业务方；停止；重新运行（附上关于重新运行前等待时长的说明：立即、X\
  \ 小时后、次日等）；使其继续运行并更新业务方相关问题等。此\"后续步骤\"文档应与 COE、业务部门和技术团队共享。这些是立即要执行的首要步骤。\n\n  \
  \ 团队中的每个人都应清楚，当值人员并不负责解决问题。该人员是联系人，负责协调业务部门、COE 和技术团队的响应。如果当值人员无法解决事故，可以联系该特定自动化领域的专家。\n\
  \n**注意**\n\n在 RPA 中，技术团队由多个不同角色组成（流程分析师、架构师、业务分析师、基础设施分析师、开发人员、资产管理、安全等）。\n\n如果贵组织设有\
  \ COE，一线支持由 COE 负责，二线支持由技术团队处理。在未设立 COE 的情况下，一线和二线支持均由技术团队负责。机器人部署后，一线支持开始对其进行监控。\n\
  \n### 3.2 监控仪表板\n\n机器人部署后，必须对其进行维护，以确保其能够完成创建时设定的工作，并保持最佳性能水平。持续监控至关重要。监控可以是自动化的，也可以是手动的。自动化监控可能包括发送警报，例如电子邮件或短信，以提示机器人性能不佳或已停止工作，或者通过更新仪表板来呈现。\n\
  \n仪表板对于监控机器人非常方便。大多数自动化工具都附带简单的仪表板，可以轻松为已部署的机器人进行配置。技术团队或业务合作伙伴可以通过用户界面轻松访问仪表板，以实时了解机器人的状态及其运行情况。正如\
  \ Sharda Cherwoo 和 Roy Rachamimov 所说：\"运营仪表板对于机器人的日常运行至关重要——可以频繁且实时地监控它们的活动。在 RPA\
  \ 项目的早期阶段，机器人数量较少，所有注意力都集中在将它们集成到工作流中，并确保它们成功完成任务。\"^(¹⁹)（注：更多信息请参阅脚注中提到的文章。）\n\n\
  ## 优先级排序\n\n当许多机器人需要重新运行时，就会涉及此问题。例如，运行机器人的服务器宕机，导致大量机器人需要重新运行。优先级将由业务所有者来确定，决定哪些机器人优先处理。有些机器人正在处理关键业务工作（例如，满足监管要求）。\n\
  \n在没有关键业务机器人需要重新运行，且所有机器人具有相同优先级的情况下，由 COE 或技术团队决定。他们可以决定先运行那些耗时短或工作量小的机器人，以便快速完成这些任务。然后再运行那些需要更长时间才能完成的更复杂的机器人。优先级排序的准则应事先制定，但需要足够灵活，以适应不同的或变化的情况。\n\
  \n## 保修期\n\n每当新的自动化程序部署到生产环境，或者新版本发布到生产环境时，机器人都会被分配一个保修期。\n\n保修期可根据业务部门与技术团队之间的协议，设定为一周或两周。机器人需要时间来稳定，新机器人初期可能会遇到一些问题。因此，保修期允许在最少依赖多人的情况下快速解决缺陷。在保修期内，无需准备将机器人移至生产环境所需的所有文档，例如业务签核、测试签核等。修复工作会快速完成以保持机器人运行。如前所述，如果业务部门或技术团队认为需要对机器人进行更长时间的密切观察，保修期可以延长。\n\
  \n## 机器人分类\n\n机器人可以分为\"关键型\"或\"非关键型\"。关键型机器人是指那些时间敏感的机器人；其输出可能用于满足政府监管要求。这些机器人对业务有重大影响。如果关键型机器人发生故障，技术团队必须能够立即采取措施，无需等待他人的决策。对于关键型机器人，所有在发生故障时应采取的行动必须在部署前定义好。\n\
  \n非关键型机器人对业务的影响不同。如果非关键型机器人发生故障，在采取任何行动之前，需要征求业务部门的意见。业务部门将决定是重新运行机器人还是采取其他措施。技术团队会据此做出响应。\n\
  \n## 沟通\n\n在第 5 章中，我们介绍了需要与公司的 COE（卓越中心）保持沟通的必要性（如果有的话），如果没有 COE，则需与负责部署的部门沟通。现在您即将进行部署，之前通过让该团队参与进来并让他们了解将要部署的内容、期望的部署时间以及其他相关细节所建立的关系，将极大帮助您在需要时让机器人顺利启动和运行。\n\
  \n在早期阶段，您已向该团队（或个人）通报了实现自动化的流程、它将与哪些系统交互、运行频率、运行平台以及其他相关细节。他们知道您希望部署的日期，并且希望他们已经努力确保自己这边一切就绪。由于情况可能每天变化，您现在需要向他们更新各种问题。以下是需要确认的一些关键主题：\n\
  \n- 请求自动化的业务部门\n- 请求日期\n- 受影响的系统\n- 治理委员会会议日期\n- 业务方在追加请求后可能提出的任何变更\n- 机器人的预期规模（自动化的步骤数、数量）\n\
  - 运行频率\n- 您的团队和所创建的特定机器人可能要求的其他事项\n\n\n  \n"
- "# 变更管理  \n\n当机器人运行时，总会遇到各种问题，而变更管理则用于修复、部署和跟踪这些问题。变更的跟踪需要创建变更单，以便记录和追踪工作。在解决问题时，往往需要采取不同类型的操作。因此，变更请求可以被分类，以便团队能够采取正确的行动。\
  \  \n\n工单可以分为变更请求、服务请求、调查请求或普通请求。  \n\n当需要获取关于任何机器人的信息时，就会创建普通请求，例如：已完成的总工作量、机器人开始或完成运行的时间等。对于这类请求，无需任何审批，因为它们仅涉及信息查询，并不需要立即进行修复或变更。这些请求由机器人产生的任何警报触发，相关信息会提供给技术团队进行审核。\
  \  \n\n在审核普通请求提供的信息后，可能会创建调查请求或变更请求。如果需要额外资源来进一步探究问题并找到根本原因，则会创建调查请求。大多数情况下，机器人在测试环境中运行良好，但在生产环境中表现不佳。\
  \  \n\n某些普通请求可能会触发变更请求。如前所述，技术团队可能会收到普通请求。如果团队能够识别问题及其根本原因，并可以实施修复，则会创建变更请求。在变更获批后（通常通过电子邮件完成），他们即可更新机器人代码文件。\
  \  \n\n**暂停并思考**  \n\n这些是通常使用的请求类型，但具体取决于组织的需求。你认为在新的 RPA 项目中应该如何对工单进行分类？如果无法确定，可以先用我们这里提供的分类方式；你的项目会不断发展，随着时间的推移，你会了解这些分类是否最适合组织需求。\
  \  \n\n**提示**  \n\n工单类别过多会导致难以理解和管理预期，也可能使不同类型的工单难以区分。  \n\n"
- "# 审核机器人  \n\n一旦机器人部署并开始工作，我们就会开始收集关于机器人性能的信息。可以获取的信息有很多。  \n\n- 机器人在特定时间内处理了多少个工作项？预期值会在流程的早期阶段确定。\
  \  \n- 机器人每天接收的工作量是多少？最初提出请求时，已经提供了工作量估算。随着你对流程的深入了解，这个数字可能发生了变化，而现在你将看到机器人实际接收的工作量。\
  \  \n- 机器人每天出错多少次？这表示发生了错误；根据错误类型，机器人可能会继续运行或停止。有时机器人会遇到可以绕过的错误，但有时错误会导致机器人停止运行。根据错误情况，机器人可能会尝试重新处理。\
  \  \n- 按时启动 vs. 延迟启动。这包括机器人按时启动的次数，以及如果启动延迟，延迟了多长时间。还包括如果启动延迟，机器人是否完成了工作。了解这些信息可能会决定是否需要重新安排机器人的启动时间。\
  \  \n- 对于包含多个步骤的复杂工作项，会收集关于工作项之间子项的信息。这意味着要审视最细粒度的单个步骤，并确定导致问题出现的环节。  \n\n收集到这些信息后，可以进行分析和验证，确定机器人是在哪里花费了比预期更多的时间；如果出错过于频繁，或者基础设施运行缓慢，或者应用程序响应迟缓，这些都可以进行分析和处理。\
  \  \n\n如第 4 章所述，一个项目可以是新机器人、对现有机器人的增强，或是缺陷修正。每种情况的生产部署略有不同。本章的大部分内容都涉及部署新机器人。  \n\
  \n对于增强功能，许多所需信息已经存在。你通常已经知道机器人访问的系统和应用程序，而增强功能很可能也会使用相同的系统和应用程序。如果有变化，会加以说明。增强功能通常包括对流程中更多步骤的自动化；例如，如果某个机器人自动化了一个包含\
  \ 15 个步骤的流程中的第 3-9 步，那么可能会要求将更多步骤实现自动化。由于流程已知，因此无需再次记录。因此，部署步骤基本一致，但由于已有大量信息，所以流程会加快；你只是在现有基础上进行构建。\
  \  \n\n然而，这并不意味着所有已识别的风险都不需要缓解，或者业务部门无需对增强功能进行签核。但许多部署所需的事项在机器人最初部署时就已经就位。  \n\n\
  缺陷修复可以通过确保修复不会“破坏”任何现有正常功能来进行部署。需要测试签核，然后修复可以投入生产。  \n\n**提示**  \n\n如果缺陷发生在保修期外，则可能需要测试签核以及对更新需求的审批。这取决于组织设定的标准，但建议完成这两项审批。\
  \  \n\n"
- "# 灾难恢复  \n\n这是当机器人无法完成必要工作时需要执行的计划。这种情况可能由服务器宕机、机器人运行速度过慢，或机器人使用的应用程序不可用（例如，机器人使用\
  \ Jira，但 Jira 无法访问）等原因导致。在这些及相关情况下，业务的职能必须持续运转。`SDD`（参见第 6 章）中详述的灾难恢复计划，是这些紧急情况下使用的蓝图。\
  \  \n\n如果存在`COE`（卓越中心），该团队会通知技术团队某个机器人无法正常工作。若没有`COE`，业务部门或技术团队自身会通过监控机器人来发现问题，或者业务部门可能通知技术团队。技术团队与业务部门将共同决定是手动运行流程，还是等待机器人遇到的问题解决后重新运行机器人。\
  \  \n\n\n\n## 机器人的退役\n\n必须规划的事项之一就是机器人最终的终止运行。机器人不再被需要的原因有很多。\n\n有时，流程会被终止。由于各种原因，某个流程可能最终不再被需要。或许是因为公司合并，收购公司的流程已经整合了机器人的工作；或者机器人可能支持了公司不再提供的某项服务。机器人被判定为不再必要的原因有很多。\n\
  \n在某些情况下，当前的流程发生了重大变化，以至于需要一个新的机器人。所有组织都在不断追求改进，流程也需要随之演变。当然可以对机器人进行调整，但有时终止一个机器人并用新机器人替换它可能更经济实惠。这成为一个简单的“金钱”决策。\n\
  \n有些情况下，自动化软件会转换到另一个软件工具。有时可能需要从一个软件工具转换到另一个。这可能是因为现有工具无法满足自动化需求、找到了更便宜的工具，或者其他原因。现有的机器人将被“退役”，并为新工具构建一个新的机器人。这个新机器人可能与退役的机器人相同。\n\
  \n尽管你做了所有周密的规划，但有时机器人就是无法达到最低的节约目标。在审计期间，你将能够看到机器人的成效如何。尽管你已按照前面章节详述的各个阶段进行了尽职调查，但机器人始终有可能无法实现其预期的目标。你可能想要进行一些调整，但即便如此，你和/或业务部门可能会认识到机器人根本不值得它所产生的费用。如果你的组织设有卓越中心（COE），那边会有人告知你，他们对机器人的性能有所保留。\n\
  \n在这种情况下，你需要与业务部门（以及卓越中心，如果有的话）合作，以确定能否通过一些调整来提升机器人的性能，或者干脆终止机器人是否是最具成本效益的决定（请记住，成本并不总是决定保留或终止机器人的因素。例如，如果机器人提供的服务能提升客户对公司的看法，那么即使需要花费成本，维持它可能也是有利的）。\n\
  \n### 机器人退役步骤\n\n对大多数机器人来说，最终都会面临退役。起初这可能不是什么问题，但随着条件和技术的变化，有时机器人将不再被需要。\n\n以下是引导至实际退役机器人的步骤。\n\
  \n*   收到业务部门要求退役某个机器人的请求。机器人是否退役由业务部门决定。信息可能来自卓越中心，指出机器人未按预期运行，但退役的决定权在业务部门。\n*\
  \   确定利益相关方。这是必要的，因为许多领域可能都依赖该机器人；它们要么负责向其提供信息，要么从中接收信息。\n*   通过明确说明哪个机器人将退役以及哪些流程受到影响来进行协作。确保关于退役的机器人信息没有任何疑问至关重要。\n\
  *   确定机器人何时停止执行。这将与业务部门及其他相关利益相关方共同商定。\n*   确定任何必须终止的用户 ID 或访问权限。机器人运行时，不同角色可能能够访问各种系统，现在这些访问权限必须被终止。请注意，在某些情况下，部分或全部访问权限可能不会被终止。请与业务部门合作了解这些情况。要注意，如果机器人被停用，而它所自动化的流程将再次由人工处理，那么个人可能需要获得对部分或全部系统的访问权限。\n\
  *   确定机器人停止工作时的替代方案。如果流程被废弃，则无需替代方案。但如果流程将继续进行但改为人工执行，业务部门必须有足够的时间进行必要的安排并使人工流程运作起来。这除了影响确定机器人实际退役的时间外，可能对\
  \ RPA 团队没有其他影响。\n*   获取退役所需的必要签字批准。这将包括业务代表和卓越中心（如果有的话）。\n*   与卓越中心（如果有的话）协作，实际停止机器人并释放所有用户\
  \ ID 和资源。如果组织中不存在卓越中心，则由技术团队负责停止机器人。\n*   正式宣布机器人退役。向所有相关利益相关方发送电子邮件，告知他们该机器人已不再运行。\n\
  \n**暂停与思考**\n\n如上所述，机器人终止运行的原因有多种。你能否想到贵组织中一些从资产负债表角度看可能并不特别赚钱，但仍然很重要的流程？请确保管理层了解任何正在实现自动化的此类流程，这样他们就能明白自动化可能不会带来巨大的财务优势，但尽管如此，它仍然很重要。\n\
  \n\n\n### 案例研究\n\n现在我们将探讨在我们一直跟踪的假设案例中如何执行这些任务。\n\n#### 部署到生产环境\n\n| **项目** | **项目详情**\
