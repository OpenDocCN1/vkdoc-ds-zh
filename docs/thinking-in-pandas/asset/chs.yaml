  \     05/18/1989     6.1     130\n>> df.dtypes\nbirth          object\nheight  \
  \       float64\nweight         int64\n>> df.index.dtype\ndtype('int64')\n>> df.memory_usage()\n\
  Index          16\nbirth          16\nheight         16\nweight         16\nListing\
  \ 4-27\n使用 pandas 类型推断加载 JSON\n```\n\n\n\n### `pd.read_sql`、`pd.read_sql_table`\
  \ 和 `pd.read_sql_query`\n\n`pd.read_sql` 加载器是 `read_sql_table` 和 `read_sql_query`\
  \ 的一个封装。根据传入的参数，它会在底层调用这两个函数之一。它还内置了对 `SQLAlchemy` 的支持。\n\n`SQLAlchemy` 是一个非常流行的对象关系映射器（ORM）库。pandas\
  \ 的 SQL 读取器也支持直接与 DBAPI 通信，后者是一个更低级的数据库库，`SQLAlchemy` 依赖于它。虽然在 pandas 中 DBAPI 被限制用于\
  \ SQLite3，但 `SQLAlchemy` 可以与各种关系数据库通信，因此在切换数据库时无需重写所有 SQL 查询。ORM 在应用开发领域非常流行，因为它们允许你将数据库表映射到\
  \ Python 中的对象或类。这很好，因为你可以在代码库中跟踪数据库表的定义。你可以将数据库表定义为类，然后通过一个简单的命令将它们添加到数据库中。你还可以通过迁移脚本（例如使用\
  \ Alembic 等迁移库）修改现有的数据库表，这些脚本允许你向前和向后回滚数据库更改，而生产数据库发生不可恢复故障的风险很小。在构建表定义时，你还可以指定\
  \ Python 与数据库之间的列类型转换等内容。`SQLAlchemy` 的另一个优点是，它将 SQL 查询抽象为更易读的查询语言，并带有易于参数化的表达式，如清单\
  \ 4-29 所示。\n\n```\ncur.execute(\n\"\"\"\nSELECT * FROM temperature_readings\nWHERE\
  \ temperature_readings.temp > 45\n\"\"\"\n)\nsession.query(TemperatureReadings).filter(\n\
  temp > 45\n)\nListing 4-29\n使用原始 SQL 字符串查询与使用 SQLAlchemy ORM 生成查询的对比\n```\n\n清单\
  \ 4-30 展示了如何构建一个数据库并向其中插入数据的示例。在这个例子中，我们创建了一个包含 `id` 和 `name` 两个列的用户表，并向该表插入了一个\
  \ `id` 为 0、名字为 Eric 的新用户。请注意，代码中定义了两个不同的 URL，正在使用的那个连接到 sqlite，另一个连接到本地的 Postgres\
  \ 数据库实例。\n\n```\nfrom sqlalchemy import create_engine\nfrom sqlalchemy.orm import\
  \ sessionmaker\nfrom sqlalchemy import Column, Integer, String\nfrom sqlalchemy.ext.declarative\
  \ import declarative_base\nBase = declarative_base()\nSQLITE_URL = \"sqlite://\"\
  \nPOSTGRES_URL = \"postgresql://postgres@localhost:5432\"\nclass User(Base):\n \
  \   __tablename__ = 'user'\n    id = Column(Integer, primary_key=True)\n    name\
  \ =  Column(String(50))\nengine = create_engine(SQLITE_URL)\nSession = sessionmaker(bind=engine)\n\
  def create_tables():\n    Base.metadata.create_all(engine)\ndef add_user():\n  \
  \  session = Session()\n    user = User(id=0, name=\"Eric\")\n    session.add(user)\n\
  \    session.commit()\n    session.close()\n>> create_tables()\n>> add_user()\n\
  Listing 4-30\n在 Postgres 数据库中创建表并使用 SQLAlchemy 添加数据\n```\n\n清单 4-31 提供了一个简单的 `docker-compose.yml`\
  \ 文件，该文件将使用清单 4-32 中的命令在你的机器上启动一个本地 Postgres 数据库。请注意，此数据库被配置为将数据写入磁盘，因此你可以随时停止 Docker\
  \ 容器，数据将持久保存在 `postgres-data` 目录中，并会在下次启动 Docker 容器时存在。\n\n```\n>> docker-compose\
  \ up -d\nListing 4-32\n启动 Postgres 数据库\n```\n\n```\nversion: '3'\nservices:\n  postgres:\n\
  \    image: postgres:9.4-alpine\n    ports:\n      - '127.0.0.1:5432:5432'\n   \
  \ volumes:\n      - ./postgres-data:/var/lib/postgresql/data\nListing 4-31\n用于创建本地\
  \ Postgres 数据库的 docker-compose.yml 文件内容\n```\n\nSQL 加载器通常可以加载整个表，也可以基于查询加载表的部分内容。尽管\
  \ SQL 加载器接受 `SQLAlchemy` 引擎，但它们只接受 select 语句，而不是查询对象。这意味着，虽然你可以使用 `SQLAlchemy` 的查询\
  \ API，但必须将其转换为可选择对象（selectable）才能传递给加载器，如清单 4-34 所示。可选择对象本质上就是原始的 SQL 查询字符串。清单 4-33\
  \ 展示了如何将数据库中的所有用户数据加载到 DataFrame 中，而清单 4-34 展示了如何将 `id=0` 的用户加载到 DataFrame 中。\n\n\
  ```\n>> select_user0 = session.query(Patient).filter_by(id=0).selectable\n>> pd.read_sql(\n\
  \    sql=select_user0,\n    con=engine,\n    columns=[\"id\", \"name\"],\n)\n  \
  \ id   name\n0   0    Eric\nListing 4-34\n使用 read_sql 将 id=0 的用户加载到 DataFrame 中\n\
  ```\n\n```\n>> pd.read_sql(\n    sql=User.__tablename__,\n    con=engine,\n    columns=[\"\
  id\", \"name\"],\n)\n   id   name\n0   0    Eric\nListing 4-33\n使用 read_sql 将所有用户加载到\
  \ DataFrame 中\n```\n\nSQL 加载器与我们之前看过的其他加载器具有相似的选项，例如，分块加载数据或日期时间转换。但是，它们也存在差异。与我们之前看过的一些加载器不同，SQL\
  \ 加载器没有用于指定数据类型的选项。这对于使用数据库的 pandas 用户来说常常是一个问题，因为他们可能在数据库中存储了数据的标准化版本，然后希望将其加载回来，却发现数据类型不一致。如果遇到这种情况，`SQLAlchemy`\
  \ 和一些自定义加载代码可以提供帮助。`SQLAlchemy` 提供了一个自定义类型选项，允许你在数据库类型和 Python 类型之间进行转换。正如我们在其他加载器中看到的，当类型未明确指定时，pandas\
  \ 会将 `id` 列存储为 `int64` 类型。清单 4-35 展示了一个示例，说明如何为整数 `id` 列指定 Python 类型为 `int32`，而不是更通用且更大的整数类型。使用此表定义后，当我们添加用户时，`id`\
  \ 将在数据库中存储为整数，但当我们读取它时，它将是 NumPy 的 `int32` 类型。\n\n```\nfrom sqlalchemy import Column,\
  \ String\nfrom sqlalchemy.ext.declarative import declarative_base\nimport sqlalchemy.types\
  \ as types\nimport numpy as np\nBase = declarative_base()\nclass Int32(types.TypeDecorator):\n\
  \    impl = types.Integer\n    def process_bind_param(self, value, dialect):\n \
  \       return value\n    def process_result_value(self, value, dialect):\n    \
  \    return np.int32(value)\nclass User(Base):\n    __tablename__ = 'user'\n   \
  \ id = Column(Int32, primary_key=True)\n    name =  Column(String(50))\nListing\
  \ 4-35\n使用 SQLAlchemy TypeDecorator 为 pandas 指定数据类型\n```\n\n清单 4-36 展示了 `read_sql`\
  \ 内部实现的一段代码片段，其中 `self.pd_sql` 是 `SQLAlchemy` 引擎对象，`sql_select` 是作为 `sql` 参数传入的可选择对象，而\
  \ `self.frame` 是返回的结果 DataFrame。在这里，你可以准确看到 pandas 是如何从数据库加载数据并将其转换为 DataFrame 的。`fetchall`\
  \ 函数将数据作为元组列表返回，例如 `[(0, 'Eric')]`。此实现与我们接下来要让 pandas 使用在清单 4-35 中定义的适当数据类型的步骤相关。\n\
  \n```\nresult = self.pd_sql.execute(sql_select)\ncolumn_names = result.keys()\n\
  data = result.fetchall()\nself.frame = DataFrame.from_records(\n    data, columns=column_names,\
  \ coerce_float=coerce_float\n)\nListing 4-36\npandas 中 read_sql 的部分实现\n```\n\n\n\
  \n## 自定义 SQL 加载代码\n\n我们不会依赖 pandas 的 `read_sql` 实现，而是编写自己的自定义 SQL 加载代码，以便在创建 DataFrame\
  \ 时保持我们在 SQLAlchemy 用户表中定义的数据类型。自定义 SQL 加载代码如列表 4-37 所示，它比在加载后使用 `astype` 转换类型更快，且消耗更少的内存。\n\
  \n```python\n>> sql = session.query(User).selectable\n>> results = engine.execute(sql).fetchall()\n\
  >> data = {\ncolumns[col]: np.array(\n[row[col] for row in results],\ndtype=type(results[0][col]))\n\
  for col, v in enumerate(results[0])}\n>> df = pd.DataFrame(data)\n>> df.dtypes\n\
  0    int32\n1    object\n```\n\n*列表 4-37 自定义 SQL 加载器代码，该代码保持列表 4-35 中 SQLAlchemy\
  \ 表上定义的数据类型*\n\n## 本章小结\n\n在本章中，我们介绍了几种最流行的加载器及其选项，但还有更多加载器可供选择。请务必阅读你所使用的特定加载器的文档，了解在加载过程中有哪些可用的规范化功能。如果没有，你可能需要自行编写一些自定义代码。请记住，性能提升可以通过减少内存开销以及减少加载和规范化过程中的步骤来实现。pandas\
  \ 提供了许多方法来提高规范化和加载性能，具体取决于你在特定情况下的瓶颈。在章节 5 中，我们将探讨在数据加载和规范化之后，如何将数据重塑为所需的 DataFrame\
  \ 格式。\n\n脚注 1 2\n\n"
- '# 5. pandas 中的基本数据转换


  pandas 库拥有一个庞大的 API，提供了多种数据转换方法。在本章中，我们将介绍一些在 pandas 中转换数据最强大、最流行的方法。


  ## 数据透视与数据透视表


  数据透视（`pivot`）和数据透视表（`pivot_table`）非常流行，尤其对初学者具有吸引力，因为它们功能强大。然而，它们的强大功能是以性能为代价的。虽然
  `pivot` 是作为数据规范化步骤的一部分来初步转换 DataFrame 的优秀工具，但在数据分析阶段不应频繁使用。列表 5-1 展示了如何使用 `pivot_table`
  将原始检查数据转换为餐厅及其平均检查分数的聚合格式。请注意，在列表 5-1 中，聚合函数被显式指定为 `np.mean`，尽管这是不必要的，因为 `np.mean`
  是默认值。`pivot` 本质上是在执行 `groupby`，根据需要应用聚合函数，并将结果重新组织成新的表格格式。


  ```python

  >> df

  restaurant  location    date       score

  Diner       (4, 2)      02/18      90

  Pandas      (5, 4)      04/18      55

  Diner       (4, 2)      05/18      100

  Pandas      (5, 4)      01/18      76

  >> df = df.pivot_table(

  values=[''score''],

  index=["restaurant","location"],

  aggfunc=np.mean

  )

  >> df

  score

  restaurant  location

  Diner       (4, 2)         95

  Pandas      (5, 4)         66

  ```


  *列表 5-1 使用 `pivot_table` 计算每家餐厅的平均检查分数*


  列表 5-1 中存在一些性能问题。`pivot_table` 没有限制内存复制的选项，因此每次使用时都会创建一个全新的 DataFrame。如果你的 DataFrame
  非常大，这可能会对程序性能造成重大影响。在内部，`pivot_table` 会按唯一的餐厅和位置组合对数据进行分组，这需要时间，特别是在组合数量很大的情况下。如果这是作为数据规范化步骤的一部分使用的，那么它比在程序的数据分析过程中多次使用要好得多。这是因为唯一分组和复制所有内存的性能损失只会发生一次，而不是在程序中发生多次。最好一次性规范化和定位
  DataFrame，使其能够优化你计划对其执行的所有分析，而不是将其保留在某种未优化的原始形式中，并在每个分析步骤中重新定位它。请注意，如果 DataFrame
  已经按唯一值分组，我们可以像列表 5-2 那样运行 `groupby` 来计算平均分数，这将会快两倍。我们将在章节 7 中深入讨论 `groupby` 的性能。其他分析很可能需要按唯一餐厅分组的数据，因此此示例中的分组至少应该是规范化步骤的一部分，这样就没有必要使用
  `pivot_table` 了。


  ```python

  >> df

  date        score

  restaurant  location

  Diner       (4, 2)     02/18       90

  04/18       55

  Diner       (4, 2)     05/18       100

  01/18       76

  >> df = df[["score"]].groupby(["restaurant","location"]).mean()

  >> df

  restaurant  location     score

  Diner       (4, 2)       95

  Pandas      (5, 4)       66

  ```


  *列表 5-2 使用 `groupby` 计算每家餐厅的平均检查分数*




  ### Pivot 与 Pivot Table 的对比与重塑操作


  `Pivot`的功能与`pivot table`相同，但不允许聚合数据。当使用`pivot table`时，任何导致多个值的列和索引组合必须被聚合在一起。而`pivot`在遇到这种情况时，会直接抛出`ValueError`。请注意，在清单
  5-3 中，没有药物和日期的组合会产生多个值；然而在清单 5-4 中，同一药物和日期存在或将会出现多行数据，因此清单 5-4 会抛出`ValueError`。因此，`pivot`和`pivot
  table`的一个遗憾的局限是，当某个索引和列组合存在多个值时，它们都无法输出数据。`Pivot table`强制你对多个值进行聚合或选择一个，而`pivot`则直接抛出`ValueError`。


  ```

  >> df

  date          tumor_size    drug      dose

  02/18         90            01384     10

  02/25         80            01384     10

  03/07         65            01384     10

  03/21         60            01384     10

  02/18         30            01389     7

  02/25         20            01389     7

  03/07         25            01389     7

  03/21         25            01389     7

  >> df.pivot(

  index="drug",

  columns="date",

  values="tumor_size",

  )

  ValueError: Index contains duplicate entries, cannot reshape

  Listing 5-4

  当同一列索引组合存在多个值时，Pivot 会抛出 ValueError

  ```


  ```

  >> df

  date           tumor_size      drug         dose

  02/18          90              01384        10

  02/25          80              01384        10

  03/07          65              01384        10

  03/21          60              01384        10

  02/18          30              01389        7

  02/25          20              01389        7

  03/07          25              01384        10

  03/21          25              01389        7

  >> df.pivot(

  index="drug",

  columns="date",

  values="tumor_size"

  )

  date    02/18    02/25    03/07     03/21

  drug

  01384   90        80       65         60

  01389   30        20       25         25

  Listing 5-3

  使用 pivot 重新定向 DataFrame

  ```


  `Pivot`比`pivot table`性能更高，因为它不允许指定和生成多级列和多级索引。因此，它没有生成和处理这种更复杂`DataFrame`格式的开销。无论生成的`DataFrame`是否是多级索引或多级列`DataFrame`，`pivot
  table`仍然会像处理多级结构一样运行各种计算，这会增加相当多的开销，在某些情况下甚至比`pivot`多出六倍。虽然`pivot`允许你指定多个值并为其创建多级列，但它不允许你提供显式的列列表来生成多级列，或提供索引列表来生成多级索引。而`pivot
  table`支持这种多级`DataFrame`。它还有一些其他便利选项，例如添加所有行和列的小计，以及删除包含`NaN`的列。总之，如果你能使用`pivot`，就应该使用它，因为它比`pivot
  table`性能更高。


  ### Stack 和 Unstack


  `Stack`和`unstack`将`DataFrame`的列层级重塑为最内层索引，反之亦然。清单 5-5 中展示了一个示例，其中每一列是一次餐厅卫生检查，值是卫生检查分数，索引代表被检查的餐厅。`Stack`用于重塑数据，使得每家餐厅的卫生检查分数出现在每一行中，而不是每一列中。请注意，`stack`会将顶部的列名转换为列值，这些值最终会从`DataFrame`中被删除。


  ```

  >> df

  score

  inspection                       0    1

  restaurant  location

  Diner       (4, 2)               90   100

  Pandas      (5, 4)               55   76

  >> df = df.stack().reset_index()

  >> df

  restaurant  location   inspection  score

  Diner       (4, 2)      0          90

  1          100

  Pandas      (5, 4)      0          55

  1          76

  >> df.drop(column=["inspection"], inplace=True)

  >> df.set_index(["restaurant", "location"], inplace=True)

  >> df

  score

  restaurant  location

  Diner       (4, 2)     90


  Pandas      (5, 4)     55


  Listing 5-5

  使用 stack 重塑 DataFrame，使每一行代表一次检查

  ```


  你可能认出了清单 5-5 中原始`DataFrame`的形状与清单 3-22 中的形状一致。在清单 5-5 中重塑之前的`DataFrame`形状，正是第 3
  章末尾“选择正确的 DataFrame”部分中被认为最优的朝向。清单 5-5 展示了如何从该最优形状转换为原始的非最优形状。现在，我们来看如何将原始的非最优形状转换为最优形状。清单
  5-6 向`DataFrame`添加了一个名为`inspection`的新列，其值将成为新`DataFrame`的列名。我们还使用了一个方便的`groupby`聚合函数`cumcount`，它为每个组中的每一行创建一个行号。


  ```

  >> df

  score

  restaurant  location

  Diner       (4, 2)      90


  Pandas      (5, 4)      55


  >> df["inspection"] = df.groupby(

  ["restaurant", "location"]).cumcount()

  >> df

  inspection  score

  restaurant  location

  Diner       (4, 2)    0          90

  1          100

  Pandas      (5, 4)    0          55

  1          76

  >> df.set_index("inspection", append=True, inplace=True)

  >> df

  score

  restaurant  location   inspection

  Diner        (4, 2)    0           90

  1           100

  Pandas        (5, 4)   0           55

  1           76

  >> df = df.unstack()

  >> df

  score

  inspection                         0    1

  restaurant  location

  Diner       (4, 2)                 90   100

  Pandas      (5, 4)                 55   76

  Listing 5-6

  使用 unstack 重塑 DataFrame，使每一列代表一次检查

  ```


  那么`stack`和`unstack`的性能如何？它们都会复制内存，因为它们不是原地操作，这可能会很昂贵，因此只应在数据规范化时使用。然而，它们在数据转换方式上非常独特，因此很难找到比`melt`性能更高的替代方法，我们将在下一节中探讨`melt`。


  ### Melt


  清单 5-7 中展示了使用`melt`的示例。请注意，这与`stack`的示例非常相似。在这个示例中，我们基本上是用一行代码完成了之前用`stack`大约四行代码完成的工作。虽然`melt`的功能与`stack`相同，甚至更多，但它的执行方式性能稍高。这主要是因为它在高层调用各种数据转换时开销略小，也就是说，`melt`不是调用底层的`stack`，而是直接在底层执行`stack`之下的数据操作，从而避免了中间代码层。如果将原始的`stack`与`melt`进行对比，`stack`大约快四倍。使用`stack`的缺点在于，它通常需要其他操作，例如设置索引、重命名列、将其转换回`DataFrame`等。这意味着在某些情况下，直接使用`melt`性能更高。


  ```

  >> df

  restaurant  location    0    1

  Diner       (4, 2)      90   100

  Pandas      (5, 4)      55   76

  >> df = df.melt(

  id_vars=["restaurant","location"],

  value_vars=[0,1],

  value_name="score").drop(columns="variable")

  >> df

  restaurant  location      score

  Diner       (4, 2)        90


  Pandas      (5, 4)        55


  Listing 5-7

  使用 melt 重塑 DataFrame，使每一行代表一次检查

  ```




  ### 转置


  `Transpose` 是一个有用的技巧。它简单地将列转换为行，将行转换为列。在清单 5-8 中，有一个需要针对某种疾病进行治疗的患者列表，以及一个根据血型提供用于治疗该疾病的药物列表。我们需要根据患者的血型，将可用于治疗该患者的药物列表添加到患者表中。第一步是按血型对患者列表和药物表进行索引，然后我们可以执行简单的连接操作，将药物数据添加到患者列表中。由于药物表的方向是血型横跨列而非行，因此我们首先执行转置操作。注意，当我们执行此操作时，创建
  `DataFrame` 时默认提供的索引会变成列，而列直接变成索引。这意味着在清单 5-8 中，我们无需显式设置索引，因为转置操作已经将索引设置为血型。


  ```

  >> patient_list

  id      history

  blood_type

  0+            02394   hbp

  B+            02312   NaN

  0-            23409   lbp

  >> drug_table

  index         0+   0-   A+   A-   B+   B-

  0             ADF  ADF  ACB  DCB  ACE  BAB

  1             GCB  RAB  DF   EFR       HEF

  2             RAB

  >> drug_table = drug_table.transpose(copy=False)

  >> drug_table

  blood_type   0     1      2

  0+           ADF   GCB    RAB

  0-           ADF   RAB

  A+           ACB   DF

  A-           DCB   EFR

  B+           ACE

  B-           BAB   HEF

  >> patient_list.join(drug_table)

  id       history    0      1      2

  blood_type

  0+               02394   hbp        ADF    GCB    RAB

  B+               02312   NaN               ACE

  0-               23409   lbp               ADF    RAB

  Listing 5-8

  Using a transpose to reshape a DataFrame

  ```


  `Transpose` 是少数几个提供不重复数据选项（名为 `copy`）的 `DataFrame` 重塑函数之一。话虽如此，`copy=False` 并不一定意味着数据不会被重复，我们将在第
  9 章中更详细地解释。数据是否被重复取决于多种因素，这些因素最终归结为数据的新形状是否可以按原样重用底层的 `NumPy` 数组，还是必须创建新的 `NumPy`
  数组。回想一下，`NumPy` 数组必须都是相同类型。这意味着如果你要转置的 `DataFrame` 的行和列具有相同的类型，那么它很可能能够重用现有的 `NumPy`
  数组。如果不是，它将不得不复制内存并重新构建它们。这意味着 `Transpose` 应该仅在绝对必要时使用，理想情况下作为数据标准化步骤的一部分。


  从所有这些数据转换函数中得出的结论是，数据转换的成本非常高，在理想的程序中应该只在标准化阶段进行。在数据分析过程中应谨慎使用。如果你发现在每个数据分析步骤中都需要进行大量转换，那么你应该重新思考标准化后的
  `DataFrame` 的方向。在下一章中，我们将探讨 `apply` 方法，并研究何时应该使用以及何时不应该使用它，同时还会介绍性能更高的替代方案。


  '
- "# 6. `apply` 方法\n\n`apply` 是 `pandas` 中最常被错误使用的函数之一。很可能如果你正在使用它，你本不应该这样做。这是因为 `apply`\
  \ 将函数“应用”到数据集中的每一行或每一列，有效地打破了使用 `pandas` 的基本规则之一：不要迭代数据集。在本章中，我们将探讨何时 `apply` 是正确的选择，并在不适合使用时提供替代方案。\n\
  \n## 何时不应使用 `apply`\n\n对于那些熟悉基本编程功能的人来说，迭代是一种熟悉的数据操作方式。我们心里想：我想对每一行或每一列运行此操作，因此\
  \ `apply` 看起来非常友好。然而，这种组织问题的方式在 `pandas` 中是完全错误的。许多用于处理关系数据库的原理也适用于 `pandas`。当你对数据库中的数据执行操作时，你不是逐行执行，而是定义一个范围；在\
  \ `pandas` 中也是如此。当对数据集进行操作时，你定义所有要操作的元素，然后提供操作。最简单的形式可能类似于 `df[\"col 1\"] + df[\"\
  col 2\"]`，而在更复杂的情况下，可能类似于 `df.where(100 > df >= 90, \"A\")`。\n\n`pandas` 有许多内置函数用于执行数据计算操作。附录中提供了完整的列表。这些计算通常直接转换为在\
  \ `C` 中运行的 `NumPy` 函数，这使得它们的性能远高于等效的 `apply` 操作。它们可以直接从 `pandas` `DataFrame` 以及\
  \ `pandas` `Series` 对象（`pandas` `DataFrame` 的一列或一行）中访问。\n\n一个简单的 `apply` 示例见清单 6-1。我们向其传递\
  \ `sum` 函数，指定要应用函数的轴，然后得到每行的和。\n\n```\n>> df = pd.DataFrame([[4, 9],[6, 7]], columns=['A',\
  \ 'B'])\n>> df\nA  B\n0  4  9\n1  6  7\n>> df.apply(np.sum, axis=1)\n0    13\n1\
  \    13\nListing 6-1\nExample of using apply\n```\n\n虽然清单 6-1 中的示例很简单，并且说明了*如何*使用\
  \ `apply`，但它使用的用例*本身*是非常错误的。这是一个典型的不应该使用 `apply` 的例子，因为 `np.sum` 函数是 `DataFrame`\
  \ 本身的内置函数，因此应该使用内置函数，因为它的性能更高。但为什么它的性能如此之高呢？让我们更详细地探讨一下。\n\n为什么内置的 `pandas` `sum`\
  \ 比将 `NumPy` `sum` 应用于每一行的性能高得多，答案在于对行的迭代发生在哪里。清单 6-2 中的以下循环是 `pandas` `apply` 方法的底层实现。\n\
  \n```\nfor i, v in enumerate(series_gen):\nresults[i] = self.f(v)\nkeys.append(v.name)\n\
  Listing 6-2\nMain loop in the pandas apply implementation\n```\n\n如清单 6-2 所示，对行的遍历发生在\
  \ `Python` 中。你可以看到 `series_gen`，它是将要应用函数（保存在 `self.f` 中）的列或行。这与内置的 `pandas` `sum`\
  \ 函数相反，后者简单地将一个 `ndarray` 传递给 `NumPy` `sum` 函数进行操作，然后该函数在 `C` 中迭代并求和数据，并将结果 `ndarray`\
  \ 返回给 `Python`。这种在 `C` 中而非 `Python` 中对数据进行操作的过程被称为向量化。本质上，向量化能够比在 `Python` 中运行操作获得巨大的速度提升。由于第\
  \ 3 章中介绍的所有原因，在 `C` 中循环和执行操作的性能远高于 `Python`。然而，速度提升并不总是仅仅来自于在 `C` 中循环。\n\n\n\n向量化操作允许你将数学运算应用于数字序列。例如，如果要将`4`添加到`ndarray`中的每个元素，你可以使用`arr\
  \ + 4`语法来指定。对于`NumPy`的`ufuncs`（参见附录中的完整列表），它们实际上利用了 CPU 中专门的向量寄存器。向量寄存器是一种能够包含一系列值的寄存器，当对其执行操作时，该操作会同时应用于寄存器中的每个值。因此，原本需要在\
  \ CPU 中对八个值进行循环并执行八次连续加法指令的操作，现在变成了在 CPU 中对八个值执行一次加法指令。可以想象，这带来了巨大的速度提升。向量化还会对维度不匹配的数组进行填充，以使维度匹配，从而能够执行操作。这个过程被称为广播。当你在`pandas`中通过`df[\"\
  new_col\"] = 4`添加新列时，`4`会被广播，使其行数与`DataFrame`中所有其他列的行数相同。类似地，像`sum`这样的聚合函数也使用向量化对数字序列进行操作。这一切归结为：`apply`不是一个向量化操作——它在\
  \ Python 中循环，应尽可能避免使用。它实际上与你自己遍历行并应用函数的效果相同，如清单 6-3 所示。\n\n```\nresults = [0]*len(df)\n\
