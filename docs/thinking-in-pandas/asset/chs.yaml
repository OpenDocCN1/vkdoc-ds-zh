- "# 2. 基础数据访问与合并\n\n使用 `pandas` 访问和合并 `DataFrames` 有多种方法。本章将介绍从 `DataFrame` 中获取数据、创建子\
  \ `DataFrame` 以及合并 `DataFrames` 的基本方法。\n\n\n\n## DataFrame 的创建与访问\n\n`pandas` 采用类似字典的语法，这对于熟悉\
  \ Python 但不熟悉 `pandas` 的用户来说非常直观。每个列名被视为一个键，行值则作为对应的值返回。`DataFrame` 对象的构造函数也支持以字典形式创建\
  \ `DataFrame`。需要注意的是，当你从 `DataFrame` 获取某一列时，该列指向原始的 `DataFrame`，这正是我们能够对原始数据进行修改的原因。即使语法上看起来像是在将数据存储到原始数据的子集中（如代码清单\
  \ 2-1 底部所示），实际上也是如此。这种机制有利于内存性能，因为我们不必频繁地创建数据的副本。\n\n```\n>> import pandas as pd\n\
  >> account_info = pd.DataFrame({\n\"name\": [\"Bob\", \"Mary\", \"Mita\"],\n\"account\"\
  : [123846, 123972, 347209],\n\"balance\": [123, 3972, 7209],\n})\n>> account_info[\"\
  name\"]\n0    Bob\n1    Mary\n2    Mita\nName: name, dtype: object\n>> account_info[\"\
  name\"] = [\"Smith\", \"Jane\", \"Patel\"]\n>> account_info\nname  account     balance\n\
  0    Smith 123846       123\n1    Jane  123972       3972\n2    Patel 347209   \
  \    7209\n代码清单 2-1\n字典语法示例\n```\n\n类似地，也可以通过传入一个列名列表来创建子`DataFrame`，如代码清单 2-2 所示。\n\
  \n```\n>> import pandas as pd\n>> account_info = pd.DataFrame({\n\"name\": [\"Bob\"\
  , \"Mary\", \"Mita\"],\n\"account\": [123846, 123972, 347209],\n\"balance\": [123,\
  \ 3972, 7209],\n})\n>> account_info[[\"name\", \"balance\"]]\nname  balance\n0 \
  \    Bob   123\n1     Mary  3972\n2     Mita  7209\n代码清单 2-2\n创建子 DataFrame 示例\n\
  ```\n\n如果从原始 `DataFrame` 创建子`DataFrame`，并期望修改子`DataFrame` 时原始数据不受影响，那么字典语法可能在不经意间导致混淆。`pandas`\
  \ 无法保证在代码清单 2-1 和 2-2 所展示的简单情况之外，字典语法返回的对象究竟是视图还是副本。这也正是对于具有多重索引或多级列标的 `DataFrame`，我们更推荐使用\
  \ `loc` 方法而非字典语法的原因。我们将在下一节讨论的 `loc` 方法，能够确保你在原始 `DataFrame` 上操作，而非操作副本。同理，如果你确实需要一份\
  \ `DataFrame` 的副本，应该显式地创建它。\n\n### `iloc` 方法\n\n`DataFrame` 的行可以通过 `iloc` 方法访问，该方法采用类似列表的语法。代码清单\
  \ 2-3 演示了这一用法。\n\n```\n>> import pandas as pd\n>> account_info = pd.DataFrame({\n\
  \"name\": [\"Bob\", \"Mary\", \"Mita\"],\n\"account\": [123846, 123972, 347209],\n\
  \"balance\": [123, 3972, 7209],\n})\n>> account_info.iloc[1]\nname        Mary\n\
  account     123972\nbalance     3972\n>> account_info.iloc[0:2]\nname  account \
  \ balance\n0    Bob   123846   123\n1    Mary  123972   3972\n>> account_info.iloc[:]\n\
  name  account  balance\n0    Bob   123846   123\n1    Mary  123972   3972\n2   \
  \ Mita  347209   7209\n代码清单 2-3\n使用 iloc 访问 DataFrame 行示例\n```\n\n`iloc` 用于通过基于整数位置的索引来索引\
  \ `DataFrame`。`iloc` 函数中的第一个位置指定行索引，第二个位置指定列索引。这意味着我们可以像代码清单 2-4 那样同时选择行和列。\n\n\
  ```\n>> import pandas as pd\n>> account_info = pd.DataFrame({\n\"name\": [\"Bob\"\
  , \"Mary\", \"Mita\"],\n\"account\": [123846, 123972, 347209],\n\"balance\": [123,\
  \ 3972, 7209],\n})\n>> account_info.iloc[1, 2]\n\n>> account_info.iloc[1, 2] = 3975\n\
  >> account_info.iloc[1, 2]\n\n>> account_info.iloc[:, [0, 2]]\nname  balance\n0\
  \    Bob   123\n1    Mary  3975\n2    Mita  7209\n代码清单 2-4\n使用 iloc 访问 DataFrame\
  \ 行和列示例\n```\n\n`iloc` 也接受布尔数组。在代码清单 2-5 中，我们通过对每个行索引取模并转换为布尔值，来获取所有奇数行。\n\n```\n\
  >> import pandas as pd\n>> account_info = pd.DataFrame({\n\"name\": [\"Bob\", \"\
  Mary\", \"Mita\"],\n\"account\": [123846, 123972, 347209],\n\"balance\": [123, 3972,\
  \ 7209],\n})\n>> account_info.iloc[account_info.index % 2 == 1]\nname  account \
  \   balance\n1    Mary  123972     3972\n代码清单 2-5\n使用 iloc 访问 DataFrame 行和列示例\n\
  ```\n\n`iloc` 也可以接受一个函数；不过，该函数只会被调用一次，传入整个 `DataFrame`。将其直接传入与在调用 `iloc` 之前简单地调用该函数相比，差别不大，因此本文不再赘述。\n\
  \n在处理多重索引和多级列标的 `DataFrame` 时，`iloc` 非常实用，因为级别本身就是整数值。我们来回顾一个示例并进行解析。这里我们通过 `\"\
  :\"` 指定要获取所有行，并使用一个布尔数组来指定列。我们获取多级列标 `\"data\"` 下的值，即 `[\"score\", \"date\", \"\
  score\", \"date\"]`，然后通过指定值必须等于 `\"score\"` 来创建一个布尔数组。代码清单 2-6 将此过程分阶段拆解，以便于理解。\n\
  \n```\n>> restaurant_inspections\ninspection             0                1\ndata\
  \                 score date       score date\nrestaurant location\nDiner      (4,\
  \ 2)    90    02/18      100   05/18\nPandas     (5, 4)    55    04/18      76 \
  \   01/18\n>> score_columns = (\nrestaurant_inspections.columns.get_level_values(\"\
  data\")\n== \"score\")\n>> score_columns\n[True, False, True, False]\n>> restaurant_inspections.iloc[:,\
  \ score_columns]\ninspection                0          1\ndata                 \
  \     score      score\nrestaurant location\nDiner      (4, 2)         90      \
  \   100\nPandas     (5, 4)         55         76\n代码清单 2-6\n使用 iloc 从多重索引多级列标 DataFrame\
  \ 中提取子 DataFrame\n```\n\n\n\n### `loc` 方法\n\n`loc` 与 `iloc` 类似，但它允许你通过列名或标签来索引`DataFrame`。列表\
  \ 2-7 展示了与列表 2-4 功能等效的`loc`用法。\n\n```\n>> import pandas as pd\n>> account_info =\
  \ pd.DataFrame({\n\"name\": [\"鲍勃\", \"玛丽\", \"米塔\"],\n\"account\": [123846, 123972,\
  \ 347209],\n\"balance\": [123, 3972, 7209],\n})\n>> account_info.loc[1, \"balance\"\
  ]\n\n>> account_info.loc[:, [\"name\", \"balance\"]]\nname  balance\n0    鲍勃   123\n\
  1    玛丽  3972\n2    米塔  7209\n列表 2-7\n使用 loc 访问 DataFrame 中行和列的示例\n```\n\n`loc`\
  \ 也可以用于多级索引、多层列的`DataFrames`，并且与 `iloc` 一样支持布尔型数组。列表 2-8 演示了这一点。\n\n```\n>> import\
  \ pandas as pd\n>> account_info\naccount         0                    1\naccount_info\
  \    number   balance     number   balance\nname  username\n鲍勃   smithb    123846\
  \   123         123847   450\n玛丽  mj100     123972   3972        123973   222\n\
  米塔  patelm    347209   7209\n>> account_info.loc[\n(\"玛丽\", \"mj100\"), pd.IndexSlice[:,\
  \ \"balance\"]\n]\n0    balance    3972\n1    balance    222\n列表 2-8\n使用 loc 从多级索引、多层列的\
  \ DataFrame 中提取子 DataFrame 的示例\n```\n\n在字典语法部分的末尾提到，对于复杂的`DataFrames`，`loc` 方法优于字典语法。让我们看看使用每种语法时底层发生了什么，以解释原因。列表\
  \ 2-9 展示了在操作更复杂的`DataFrame`时，每种访问方法在底层转换成了什么。请注意，在列表 2-9 的后半部分使用字典语法时，底层代码使用了`__getitem__`方法，然后在其上调用`__setitem__`。这与直接调用`__setitem__`的`loc`方法相反。这里不可靠的是`__getitem__`，它无法保证返回的是副本还是指向原始`DataFrame`的所谓视图。在列不涉及多级的简单情况下，这两种情况的底层代码看起来相同，但在此处这种更复杂的情况中，字典语法会导致链式索引，并调用不可预测的`__getitem__`。\n\
  \n```\n\"\"\"\n下面的代码等效于：\naccount_info.__setitem__(\n(slice(None), (0, 'balance')),\n\
  NEW_BALANCE,\n)\n\"\"\"\naccount_info.loc[:, (0, \"balance\")] = NEW_BALANCE\n\"\
  \"\"\n下面的代码等效于：\naccount_info.__getitem__(0).__setitem__('balance', NEW_BALANCE\
  \ )\n\"\"\"\naccount_info[0][\"balance\"] = NEW_BALANCE\n列表 2-9\n使用 loc 与字典语法提取子\
  \ DataFrame 的对比\n```\n\n很多时候，你可能需要将来自多个来源的数据合并到一个`DataFrame`中。现在你已经了解了一些基本的数据访问方法，接下来我们将研究将不同`DataFrames`的数据合并在一起的几种不同方法。\n\
  \n## 使用`merge`方法合并 DataFrames\n\n`Merge`的工作方式与关系数据库连接相同，甚至具有熟悉的选项：外连接、内连接、左连接和右连接。右连接本质上与左连接相同，只是`DataFrames`的传入顺序相反，因此本章不会为右连接提供显式示例。\n\
  \n当你想要查找两个 pandas `DataFrames` 的交集时，会使用内连接（图 2-1）。例如，在列表 2-10 中，我们试图查找两个数据集中都存在的建筑，即那些建于\
  \ 1844 年且至今仍屹立不倒的建筑。\n\n![../images/487367_1_En_2_Chapter/487367_1_En_2_Fig1_HTML.png](img/487367_1_En_2_Fig1_HTML.png)\n\
  \n图 2-1\n\n内连接的维恩图\n\n```\n>> import pandas as pd\n>> building_records_1844\nestablished\n\
  building\n大饭店             1830\n琼斯农场           1842\n公共图书馆         1836\n玛丽埃塔之家\
  \       1823\n>> building_records_2020\nestablished\nbuilding\n萨姆面包店         1962\n\
  大饭店             1830\n公共图书馆         1836\n梅伯里工厂         1924\n>> cols = building_records_2020.columns.difference(\n\
  building_records_1844.columns\n)\n>> pd.merge(\nbuilding_records_1844,\nbuilding_records_2020[cols],\n\
  how='inner',\non=[\"building\"],\n)\nestablished\nbuilding\n大饭店             1830\n\
  公共图书馆         1836\n列表 2-10\n使用内连接查找至今仍矗立的 1844 年建筑\n```\n\n在列表 2-11 中，我们将两个基因样本数据集合并在一起，这意味着我们希望将两个数据集的所有数据都包含在同一个数据集中，且不重复。我们可以通过执行外连接来实现这一点（图\
  \ 2-2）。\n\n![../images/487367_1_En_2_Chapter/487367_1_En_2_Fig2_HTML.png](img/487367_1_En_2_Fig2_HTML.png)\n\
  \n图 2-2\n\n外连接的维恩图\n\n```\n>> import pandas as pd\n>> gene_group1\nFC1         \
  \  P1\nid\nMyc          2             0.05\nBRCA1        3             0.01\nBRCA2\
  \        8             0.02\n>> gene_group2\nFC2           P2\nid\nMyc         \
  \ 2             0.05\nBRCA1        3             0.01\nNotch1       2          \
  \   0.03\nBRCA2        8             0.02\n>> pd.merge(\ngene_group1,\ngene_group2,\n\
  how='outer',\non=[\"id\"],\n)\nFC1          P2            FC2           P2\nid\n\
  Myc          2            0.05          2             0.05\nBRCA1        3     \
  \       0.01          3             0.01\nBRCA2        8            0.02       \
  \   8             0.02\nNotch1       NaN          NaN           2             0.03\n\
  列表 2-11\n使用外连接合并两个基因样本集，避免公共数据重复\n```\n\n\n\n在清单 2-12 中，我们正在使用更准确的历史数据更新现代建筑记录。历史记录包含确切的建成日期，我们希望用其更新仅包含估算日期的现代记录。首先，我们使用左合并将更准确的新建成日期作为一个新列添加到数据集中（图\
  \ 2-3）。在这种情况下，左合并非常有用，因为我们只关心更新现存建筑的现代记录中的建成日期。注意，我们还利用了`suffixes`参数为列名提供名称。这样做的好处是，在完成操作后，我们不必将列重命名为与原始列相同的名称。合并完成后，我们需要将两个`established`列的数据合并在一起。这是通过用现代记录中的值替换旧`established`列中的所有缺失值（即`NaN`）来完成的。因此，如果历史记录有建成日期，我们就使用它；否则，我们回退到现代记录的建成日期。最后，删除现代记录中原始的`established`列，转而使用包含来自现代记录和历史记录合并值的新列。\n\
  \n![../images/487367_1_En_2_Chapter/487367_1_En_2_Fig3_HTML.png](img/487367_1_En_2_Fig3_HTML.png)\n\
  \n**图 2-3**  \n左合并的维恩图\n\n```\n>> import pandas as pd\n>> building_records_1844\n\
  building          established\nGrande Hotel      1832\nJone's Farm       1842\n\
  Public Library    1836\nMarietta House    1823\n>> building_records_2020\nbuilding\
  \             established\nSam's Bakery         1962\nGrande Hotel         1830\n\
  Public Library       1836\nMayberry's Factory   1924\n>> merged_records = pd.merge(\n\
  building_records_2020,\nbuilding_records_1844,\nhow='left',\nright_on=\"building\"\
  ,\nleft_on=\"building\",\nsuffixes=(\"_2000\", \"\"),\n)\n>> merged_records\nbuilding\
  \             established_2000     established\nSam’s Bakery         1962      \
  \           NaN\nGrande Hotel         1830                 1832\nPublic Library\
  \       1835                 1836\nMayberry’s Factory   1924                 NaN\n\
  >> merged_records[\"established\"].fillna(\nmerged_records[\"established_2000\"\
  ],\ninplace=True,\n)\n>> del merged_records[\"established_2000\"]\n>> merged_records\n\
  building             established\nSam's Bakery         1962\nGrande Hotel      \
  \   1832\nPublic Library       1836\nMayberry's Factory   1924\n```\n**清单 2-12**\
  \  \n使用左合并以更准确的历史数据更新现代记录\n\n在清单 2-13 中，我们计划进行第三次医疗试验，并且希望生成一份符合条件的参与者名单。只有参与过之前的试验\
  \ a 或 b（但不能同时参与两者）的参与者才有资格参加第三次试验。为了生成符合条件的患者名单，在合并试验 a 和试验 b 的患者数据时，我们需要使用反连接方法（图\
  \ 2-4）。`pandas`的`merge`方法提供了一个名为`indicator`的参数，它会在结果`DataFrame`中添加一个名为`_merge`的附加列，用于报告键是仅存在于左侧（`left_only`）、仅存在于右侧（`right_only`），还是两个`DataFrame`中都有（`both`）。在我们希望执行某种非常规合并的特定情况下，这非常有用。通过使用`query`方法，我们可以选择`_merge`值不是`both`的行，然后删除`_merge`列。这可以像清单\
  \ 2-13 末尾所示在一行内完成，但为了让你了解其工作原理，我们先将其分解为两个步骤。\n\n![../images/487367_1_En_2_Chapter/487367_1_En_2_Fig4_HTML.png](img/487367_1_En_2_Fig4_HTML.png)\n\
  \n**图 2-4**  \n反连接的维恩图\n\n```\n>> import pandas as pd\n>> trial_a_records\nname\n\
  patient\n230858       John\n237340       May\n240932       Catherine\n124093   \
  \    Ahmed\n>> trial_b_records\nname\npatient\n210858       Abi\n237340       May\n\
  240932       Catherine\n154093       Julia\n>> both_trials = pd.merge(\ntrial_a_records,\n\
  trial_b_records,\nhow='outer',\nindicator=True,\nright_index=True,\nleft_index=True,\n\
  on=\"name\",\n)\nname            _merge\npatient\n230858       John            left_only\n\
  237340       May             both\n240932       Catherine       both\n124093   \
  \    Ahmed           left_only\n210858       Abi             right_only\n154093\
  \       Julia           right_only\n>> both_trials.query('_merge != \"both\"').drop('_merge',\
  \ 1)\nname\npatient\n230858       John\n124093       Ahmed\n210858       Abi\n154093\
  \       Julia\n>> both_trials = pd.merge(\ntrial_a_records,\ntrial_b_records,\n\
  how='outer',\nindicator=True,\nright_index=True,\nleft_index=True,\non=\"name\"\
  ,\n).query('_merge != \"both\"').drop('_merge', 1)\n```\n**清单 2-13**  \n使用反连接合并方法消除同时参与两项试验的患者\n\
  \n## 使用`join`方法合并`DataFrame`\n\n`pandas`的`join`方法只是`merge`的一个包装器，它提供相同的基本合并方法：左连接、右连接、外连接和内连接。它允许你自动对多索引`DataFrame`执行合并操作，而无需指定要合并的索引。执行左连接时，它会自动使用左侧`DataFrame`的索引进行连接；对于右侧`DataFrame`也是如此。由于`join`是在`DataFrame`上执行的，而`merge`则需要显式传入两个`DataFrame`，因此`join`的默认行为是合并到“右侧”`DataFrame`的索引上。在这种情况下，“右侧”是传入的`DataFrame`。这与`merge`的默认行为（内连接）相反。\n\
  \n使用`merge`时，可以不指定显式的键进行合并。在合并两个具有相同数据的`DataFrame`，并且不希望左右`DataFrame`出现重复列，而只是简单地将两个数据集合并在一起的情况下，`merge`比`join`更可取。因为`join`在底层调用了`merge`，它显式地指定了要合并的键，从而消除了对于共享相同列名的`DataFrame`不输出重复列的可能性。这里要遵循的基本规则是：如果不在索引上进行连接，则使用`merge`。\n\
  \n清单 2-14 沿用了之前清单 2-10 中的一个内连接合并示例，但与之前公共建筑记录完全匹配的示例不同，这次存在差异。在这种情况下，使用`join`有几个好处。首先，数据已经根据唯一的建筑名称建立了索引，`join`会自动识别这些索引并用于连接这两个数据集。其次，数据中存在差异，因此我们希望输出`DataFrame`能够并排显示两个`DataFrame`的列，以便进行比较。\n\
  \n```\n>> import pandas as pd\n>> building_records_1844\nestablished\nbuilding \
  \        location\nGrande Hotel     (4,5)        1831\nJone's Farm      (1,2)  \
  \      1842\nPublic Library   (6,4)        1836\nMarietta House   (1,7)        1823\n\
  >> building_records_2020\nestablished\nbuilding           location\nSam's Bakery\
  \        (5,1)        1962\nGrande Hotel        (4,5)        1830\nPublic Library\
  \      (6,4)        1835\nMayberry's Factory  (3,2)        1924\n>> building_records_1844.join(\n\
  building_records_2020,\nhow='inner',\nrsuffix=\"_2000\",\n)\nestablished   established_2000\n\
  building          location\nGrande Hotel      (4,5)     1831          1830\nPublic\
  \ Library    (6,4)     1836          1835\n```\n**清单 2-14**  \n使用内连接突出显示 1844 年建成并于\
  \ 2020 年仍存在的建筑在建成日期上的差异\n\n\n\n## 使用 `concat` 方法合并 DataFrame\n\n`Concatenate` 是一种简单的合并两个\
  \ DataFrame 的方式。清单 2-15 演示了如何将来自多个数据源的相同数据进行简单拼接。`Concatenate` 有许多选项，包括 `join` 参数（指定使用外合并还是内合并）和\
  \ `axis` 参数（指定是按列 `axis=1` 合并，还是按行 `axis=0` 合并）。默认情况下，`concatenate` 会按行进行外合并。请注意，在清单\
  \ 2-15 中，位置 `(6,4)` 同时出现在 `county_a` 和 `county_b` 数据中，并且在合并后的结果中，该位置的索引被重复了。\n\n\
  ```\n>> import pandas as pd\n>> temp_county_a\ntemp\nlocation\n(4,5)          35.6\n\
  (1,2)          37.4\n(6,4)          36.3\n(1,7)          40.2\n>> temp_county_b\n\
  temp\nlocation\n(6,4)          34.2\n(0,4)          33.7\n(3,8)          38.1\n\
  (1,5)          37.0\n>> pd.concat([temp_county_a, temp_county_b])\ntemp\nlocation\n\
  (4,5)          35.6\n(1,2)          37.4\n(6,4)          36.3\n(1,7)          40.2\n\
  (6,4)          34.2\n(0,4)          33.7\n(3,8)          38.1\n(1,5)          37.0\n\
  清单 2-15\n使用 concat 合并两个 DataFrame\n```\n\n`Concatenate` 还可以用于更复杂的场景，例如创建多级列或多级索引。清单\
  \ 2-16 演示了一个拼接操作，其中被拼接的每个 `DataFrame` 都是多级列中的一个值。请注意，在清单 2-16 中，`device_a` 和 `device_b`\
  \ 的数据是相同位置上的温度测量值。这里我们指定 `axis=1`，使两个 DataFrame 按列进行外合并。清单 2-16 中的 `key` 参数指示 `concatenate`\
  \ 将这两个温度列视为不同的列（即使它们名称相同），并由此创建一个多级列。按列进行外合并，并将每个设备的温度放入不同的列中，意味着合并后的结果中不会出现重复的位置索引值。这与清单\
  \ 2-15 形成对比——在清单 2-15 中，结果中的索引值被重复，两个 DataFrame 只是简单堆叠在一起。\n\n```\n>> import pandas\
  \ as pd\n>> temp_device_a\ntemp\nlocation\n(4,5)          35.6\n(1,2)          37.4\n\
  (6,4)          36.3\n(1,7)          40.2\n>> temp_device_b\ntemp\nlocation\n(4,5)\
  \          34.2\n(1,2)          36.7\n(6,4)          37.1\n(1,7)          39.0\n\
  >> pd.concat(\n[temp_device_a, temp_device_b],\nkeys=[\"device_a\", \"device_b\"\
  ],\naxis=1,\n)\ndevice_a       device_b\ntemp           temp\nlocation\n(4,5)  \
  \       35.6           34.2\n(1,2)         37.4           36.7\n(6,4)         36.3\
  \           37.1\n(1,7)         40.2           39.0\n清单 2-16\n使用多级列 concat 合并两个\
  \ DataFrame\n```\n\n在 `pandas` 中，合并 DataFrame 和提取子 DataFrame 的方法有很多种。选择哪种方法很大程度上取决于你的具体使用场景。这里给出的示例具有一定的代表性，但你应该查阅每个方法的文档，因为本章并未明确涵盖某些参数（例如排序）^(³)。\n\
