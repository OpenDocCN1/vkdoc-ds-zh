  \ `dtype` 用于指定数组中每个元素的类型，即每个元素在数组中所占用的内存大小。回顾上一节可知，Python 的 `list` 实现本质上是一个动态数组。与\
  \ `ndarray` 不同，Python 的 `list` 类型通过为指向数据的指针分配空间（而非为数据本身分配空间）来处理任意大小的元素。这导致 Python\
  \ 的 `list` 比 `ndarray` 占用更多内存，因为列表持有的是指向数据的指针，而非数据本身，从而增加了一层间接性。总之，`ndarray` 具有固定长度，且每个元素类型相同；而\
  \ Python 的 `list` 类型具有动态长度，元素可以是多种不同类型。这是一个重要区别，也是 `pandas` 中每一列都被分配一个特定 `dtype`\
  \ 的原因。这同样说明了为什么确保 `pandas` 为特定列分配正确类型、以及为什么对数据进行归一化以避免使用包罗万象的 `object` 类型是如此重要。图\
