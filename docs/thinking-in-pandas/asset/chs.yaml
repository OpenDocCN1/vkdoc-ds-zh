  并非所有对象在其引用计数达到 0 时都会被释放，因为有些对象的引用计数永远不会达到 0。例如，清单 3-10 中呈现的场景，这在使用 Python 的类和对象时经常发生。在此场景中，`exc_info`是一个元组，第三个索引处的值是回溯对象（`traceback\
  \ object`）。回溯对象包含对帧（`frame`）的引用，但帧也包含对`exc_info`变量的引用。这就是所谓的循环引用，由于无法在不破坏另一个的情况下删除其中一个，因此这两个对象必须被垃圾收集。垃圾收集器会定期运行，识别并删除像这样的循环引用对象。\n\
  \n```\nimport sys\ntry:\n    raise Exception(\"Something went wrong.\")\nexcept\
  \ Exception as e:\n    exc_info = sys.exc_info()\n    frame = exc_info[2].tb_frame\
  \   # 创建第三个引用\n    assert(sys.getrefcount(frame) == 3)\n    del(exc_info)\n    assert(sys.getrefcount(frame)\
