  \ CPU 周期来计算对象引用计数的适当增减。这就是为什么，如果你比较 Python 中对象的大小和 C 中对象的大小，Python 中的大小要大得多，也是为什么\
  \ Python 执行速度比 C 慢的部分原因。那些额外的字节和额外的 CPU 周期部分源于引用计数跟踪。虽然垃圾收集器确实对性能有影响，但它也使 Python\
  \ 成为一种易于编程的语言。作为开发者，您不必担心跟踪内存分配和释放；Python 垃圾收集器会为您处理这些。\n\n在多线程应用程序中，引用计数与图 3-3\
  \ 中的`total`存在相同的问题。一个线程可能在与另一个线程同时向共享内存空间中的对象创建新引用，从而发生竞态条件，导致引用计数最终只增加一次而不是两次。发生这种情况时，最终可能导致对象过早地从内存中释放（因为竞态条件导致对象的引用计数增加了一次而不是两次）。在其他情况下，当引用计数器的递减出现竞态条件时，这可能导致内存泄漏，因为引用计数比应有的值大\
  \ 1，所以内存永远不会被销毁。因此，正如您在此处所见，运行多线程应用程序不仅会影响程序正在操作的数据，还会影响 Python 解释器本身。\n\n传统上，竞态条件通过锁来解决。这实际上就是您下意识做的事情——也就是说，在您自己更新总计之前，等待您的朋友完成更新总计。在软件中，这是通过共享内存锁实现的。当一个线程需要更新总计时，它获取锁，更新总计，然后释放锁。与此同时，另一个线程等待锁空闲，获取锁，然后也更新总计。这种交互在图\
  \ 3-4 中演示。\n\n![../images/487367_1_En_3_Chapter/487367_1_En_3_Fig4_HTML.png](img/487367_1_En_3_Fig4_HTML.png)\n\
