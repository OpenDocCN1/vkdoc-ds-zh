  ## 何时使用 `apply`\n\n到目前为止，我们已经看了一些不需要使用 `apply` 的例子。现在我们来看一个确实需要它的场景。处理现实世界中的数据通常会导致一些更复杂的情况。假设你想计算一个\
  \ `DataFrame` 中每个元素在所在行的百分位数，其实现方式如代码清单 [6-11] 所示。\n\n```\ndef percentileofscore(a,\
  \ score):\n\"\"\"\n给定分数以下的值占所有值的四分之三：\n>>> stats.percentileofscore([1, 2, 3, 4],\
  \ 3)\n75.0\n当有多个匹配项时，请注意两个匹配项的分数（分别为 0.6 和 0.8）是如何平均的：\n>>> stats.percentileofscore([1,\
  \ 2, 3, 3, 4], 3)\n70.0\n\"\"\"\nn = len(a)\nleft = np.count_nonzero(a < score)\n\
  right = np.count_nonzero(a <= score)\nright_is_greater = (score > left else 0) *\
  \ 50.0/n\nreturn pct\n代码清单 6-11\n`scipy.stats.percentileofscore` 的实现\n```\n\n这意味着，如果我们有以下输入的\
  \ `DataFrame`，在使用 pandas 的 `apply` 函数应用 `scipy.stats.percentileofscore` 之后，我们会看到以下输出的\
  \ `DataFrame`（代码清单 [6-12]）。\n\n```\n>> from scipy import stats\n>> data = pd.DataFrame(np.arange(20).reshape(4,5))\n\
  0   1   2   3   4\n0   0   1   2   3   4\n1   5   6   7   8   9\n2   10  11  12\
  \  13  14\n3   15  16  17  18  19\n>> def apply_percentileofscore(series):\nreturn\
  \ series.apply(\nlambda x:stats.percentileofscore(series,x)\n)\n>> data.apply(apply_percentileofscore,\
  \ axis=1)\n0     1     2     3      4\n0   20.0  40.0  60.0  80.0  100.0\n1   20.0\
  \  40.0  60.0  80.0  100.0\n2   20.0  40.0  60.0  80.0  100.0\n3   20.0  40.0  60.0\
  \  80.0  100.0\n代码清单 6-12\n将 `scipy.percentileofscore` 应用于 `DataFrame` 中的每个元素\n\
  ```\n\n这是一个相当复杂的用例，并且其实现性能非常不佳，因为它对每一行都调用了两次 `apply` 方法。不幸的是，pandas 中没有内置函数能够匹配本例中所需的\
  \ SciPy 的 `percentileofscore` 函数逐元素应用的行为。虽然我们可以对 `DataFrame` 逐列进行单独计算，然后再将结果拼凑起来，但这将是一个非常笨拙的实现。代码清单\
  \ [6-13] 演示了这种方法。\n\n```\ndef percentileofscore(df):\nres_df = pd.DataFrame({})\n\
  for col in df.columns:\nscore = pd.DataFrame([df[col]]*5, index=df.columns).T\n\
  left = df[df < score].count(axis=1)\nright = df[df <= score].count(axis=1)\nright_is_greater\
  \ = (score > left else 0).astype(int)\nres_df[f'res{col}'] = (\nleft + right + right_is_greater\n\
  ) * 50.0 / len(df.columns)\nreturn res_df\npercentileofscore(data)\n代码清单 6-13\n\
  代码清单 6-12 的一个性能更优的实现\n```\n\n代码清单 [6-13] 的实现带来了更好的性能，因为我们通过一次性对所有行执行 pandas 操作，消除了\
  \ Python 中的一个循环（即行循环）。然而，为了达成这种逐行操作，我们不得不创建一个重复的 `DataFrame`，其中所有列都填充了分数值，这导致了不理想的内存开销。请注意，我们也没有复用\
  \ SciPy 的实现，而是使用 pandas 操作重新实现了它，这对可读性来说不太理想，并且增加了实现的复杂性和潜在的脆弱性。幸运的是，还有另一种实现方法，我们将在下一节中讨论。\n\
  \n## 使用 Cython 提升 `apply` 的性能\n\n从前一个简单求和的例子中汲取教训，如果 pandas 开发者在 `DataFrame` 上直接提供了这个函数，它可能会是用\
  \ C 语言实现的。那么，我们为什么不自己用 C 语言实现呢？你可能会对自己说：“我不懂 C——这听起来很难。”但事实上，Cython 库让这件事变得非常简单，而且你甚至不需要了解\
  \ C 语言的语法！Cython 允许你编写 Python 代码，并将其编译成 C 语言，作为 C 扩展来使用。首先，我们需要编写一个能操作整个 `DataFrame`\
  \ 的 `percentileofscore` 函数，如代码清单 [6-14] 所示。然后，按照代码清单 [6-15] 所示进行编译，最后我们就可以像代码清单\
  \ [6-16] 那样使用它了。\n\n```\nfrom percentileofscore import percentileofscore\npercentileofscore(data.values)\n\
  代码清单 6-16\n使用在代码清单 6-14 中实现并编译后的 Cython 函数\n```\n\n```\nimport pyximport; pyximport.install(language_level=3)\n\
  from distutils.core import setup\nfrom Cython.Build import cythonize\nsetup(\next_modules\
  \ = cythonize(\"percentileofscore.pyx\")\n)\n>> python setup.py build_ext --inplace\n\
  代码清单 6-15\n用于编译代码清单 6-14 中 Cython 代码的 `setup.py`\n```\n\n```\nfrom scipy.stats import\
  \ percentileofscore as pctofscore\nfrom copy import deepcopy\ndef percentileofscore(values):\n\
  percentiles = [0]*len(values[0])\nnum_rows = len(values)\nfor row_index in range(num_rows):\n\
  row_vals = values[row_index]\nfor col_index, col_val in enumerate(row_vals):\npercentiles[col_index]\
  \ = \\\npctofscore(row_vals, col_val)\nvalues[row_index] = percentiles\n代码清单 6-14\n\
  使用 Cython 对代码清单 6-12 的性能更优的实现\n```\n\n请注意，Cython 函数接受的是 `values` 而不是完整的 pandas `DataFrame`；这是因为\
  \ `values` 是一个二维数组，易于翻译成 C 语言，而 pandas `DataFrame` 是一个 Python 对象，不容易翻译。同时也请注意，该函数是原地修改数据，而不是返回一个全新的二维数组。这是一个性能优势，因为我们不必为新数组分配新的内存，而且一旦数据被转换，我们就不再需要原始数据集了（至少在这个特定案例中是这样）。\n\
  \n那么，这些方法在运行超过 10 万行时，性能差异有多大？使用代码清单 [6-12] 中的 `apply`，平均耗时约 58 秒。使用 pandas 操作来有效地重新实现与\
  \ SciPy 等效功能的代码清单 [6-13]，平均耗时约 24 秒。第三种方法，即构建自定义 Cython 函数，平均耗时约 4 秒。选择 Cython 方法还有其他好处，而不仅仅是性能。我们可以直接使用\
  \ SciPy 函数，而无需重新实现，因此从实现工作量和可读性的角度来看，这种方法也很有吸引力。\n\n总之，只有在所有其他选项都尝试过后，才应该使用 `apply`。它的性能与\
  \ `iterrows` 和 `itercolumns` 相当，并且应该以同样谨慎的态度对待它。如果需要在大型数据集上使用 `apply`，并且会导致超过一秒钟的性能下降，那么应该实现一个定制的\
  \ Cython 版 `apply`，以免降低数据分析性能。\n\n"
- '# 7. `Groupby`


  很可能在某个时候，当你在 pandas 中处理数据时，你需要对数据进行某种形式的分组和聚合。这正是 `Groupby` 的用途。它允许你将数据聚类成组，并对这些组运行聚合计算。




  ## 正确使用 groupby


  刚开始使用时，你可能会倾向于像代码清单 7-1 那样，将数据聚类成组，然后遍历每个组并运行某些聚合函数。但这会导致性能极其糟糕，因为正如我们在第 6 章中所见，我们是在
  Python 层面循环，而非在 C 层面。相反，如果像代码清单 7-2 那样，直接从 `groupby` 调用聚合函数，则分组会被传递给聚合函数，循环将在 C
  层面进行。


  ```

  >> arrivals_by_destination

  number

  date    place

  2015    LON    10

  2015    BER    20

  2015    LON    5

  2016    LON    10

  2016    BER    15

  2016    BER    10

  >> arrivals_by_destination["total"] = \

  arrivals_by_destination.groupby(["date","place"]).sum()

  >> arrivals_by_destination

  number total

  date    place

  2015    LON    10     15

  2015    BER    20     20

  2015    LON    5      15

  2016    LON    10     10

  2016    BER    15     25

  2016    BER    10     25

  代码清单 7-2

  使用 groupby 计算每年抵达每个目的地的总人数

  ```


  ```

  >> arrivals_by_destination

  number

  date    place

  2015    LON    10

  2015    BER    20

  2015    LON    5

  2016    LON    10

  2016    BER    15

  2016    BER    10

  >> groups = arrivals_by_destination.groupby(["date","place"])

  >> for idx, grp in groups:

  arrivals_by_destination.loc[idx, "total"] = \

  grp["number"].sum()

  >> arrivals_by_destination

  number total

  date    place

  2015    LON    10     15

  2015    BER    20     20

  2015    LON    5      15

  2016    LON    10     10

  2016    BER    15     25

  2016    BER    10     25

  代码清单 7-1

  通过遍历分组计算每年抵达每个目的地的总人数

  ```


  代码清单 7-1 和代码清单 7-2 之间的性能差异与分组数量成正比。仅有 8 个分组时，代码清单 7-1 的性能比代码清单 7-2 慢一倍；而有 16 个分组时，则慢四倍。注意，在这两个示例中，我们都是从预索引的
  `DataFrame` 开始的。这意味着分组已经被预先计算好了，因此 `groupby` 不必重新计算所有分组，只需复用索引中已有的分组即可。这能节省大量时间，尤其是当你需要对索引中的列执行大量
  `groupby` 操作时。


  你可能遇到这样一种 `groupby` 场景：需要一个自定义函数，但该函数并非 `groupby` 对象的内置函数。然而，此时不应屈服于循环。当你在分组上循环时，其性能表现与你对
  `groupby` 对象本身调用 `apply` 并传入自定义函数是一致的。如果你遇到这种情况，请查阅第 6 章中关于 `apply` 的内容，并使用 Cython
  实现你的自定义函数。


  '
- '# 索引


  当索引中存在许多不同的值时，使用已排序的索引可以显著提升速度。你可能会遇到警告 `PerformanceWarning: indexing past lexsort
  depth may impact performance.` 这指的是索引中按词典或字母顺序排序的层级数量。


  在访问未排序的索引时，pandas 的性能为 `O(n)`，因为它必须搜索整个索引来找到索引值，如图 7-1 所示。在访问已排序的索引时，pandas 的性能为
  `O(log(n))`，因为它使用二分查找来定位索引值，如图 7-2 所示。当索引唯一时，它使用哈希查找，性能为 `O(1)`，如图 7-3 所示。当索引中的值的数量
  `n` 非常大时，这会产生巨大差异，这也解释了为什么唯一索引能带来最快的性能。值得注意的是，正如代码清单 7-2 的情况，唯一索引并非总能实现，因此在那些场景中，我们能获得的最佳性能是使用已排序的多级索引。


  ![../images/487367_1_En_7_Chapter/487367_1_En_7_Fig3_HTML.jpg](img/487367_1_En_7_Fig3_HTML.jpg)


  图 7-3


  唯一索引访问 `O(1)`


  ![../images/487367_1_En_7_Chapter/487367_1_En_7_Fig2_HTML.jpg](img/487367_1_En_7_Fig2_HTML.jpg)


  图 7-2


  已排序索引访问 `O(log(n))`


  ![../images/487367_1_En_7_Chapter/487367_1_En_7_Fig1_HTML.jpg](img/487367_1_En_7_Fig1_HTML.jpg)


  图 7-1


  未排序索引访问 `O(n)`


  ## 避免使用 groupby


  到目前为止，我们已经探讨了如何在进行 `groupby` 操作时获得最佳性能。然而，有时最高性能的选择是完全不使用 `groupby`。如果你发现自己需要对 `DataFrame`
  执行大量 `groupby` 操作，可以考虑重新调整 `DataFrame` 的方向，从而避免使用 `groupby`。由于 `groupby` 会对数据进行分组，然后对每组数据运行聚合函数，它本质上是在对分组数量进行循环。即使在最佳性能情况下，分组已预先计算、索引可快速访问、循环在
  C 层面运行，所有这些仍然需要时间。在 pandas 中，运行简单的逐行或逐列操作要高效得多。


  让我们看看如何重新格式化代码清单 7-3 中的 `DataFrame`，以便避免使用 `groupby`。如果我们保持索引列不变，但将每个索引的多个值跨行展开，我们可以通过两种方式来优化这个按分组求和的操作。第一，这消除了
  `groupby` 求和操作，将其转变为简单的跨列求和。第二，这使得索引变得唯一。请注意，这样做会带来一些额外的内存开销，因为数据中的空白会被零填充。然而，即使在非常大的
  `DataFrame` 中，整数占用的空间也很小，因此性能的整体提升值得额外的内存使用。


  ```

  >> arrivals_by_destination

  number          0      1

  date    place

  2015    BER    20      0

  2015    LON    10      5

  2016    BER    15      10

  2016    LON    10      0

  >> arrivals_by_destination["total"] = \

  arrivals_by_destination.sum()

  代码清单 7-3

  不使用 groupby 计算抵达每个目的地的总人数

  ```


  代码清单 7-2 比代码清单 7-3 大约慢 8 倍，而代码清单 7-1 则慢 25 倍。这就是精心选择最适合预期操作的 `DataFrame` 格式如此重要的原因。这可以实实在在地为你节省数分钟的执行时间。


  我们已经探讨了如何最高效地使用 `groupby`，包括预索引以及直接使用 `groupby` 对象的聚合函数而非循环。我们还介绍了如何重新格式化 `DataFrame`，从而无需使用
  `groupby`，转而使用更高性能的行或列操作。不幸的是，不存在一种万能的 `DataFrame` 格式或 `groupby` 方法适用于所有用例。但你现在应该已经掌握了一些方法和技巧，能够帮助你以最高效、最简单的方式解决特定的
  `groupby` 问题。




  '
- "# 超越 pandas 的性能提升\n\n你可能听说过其他 pandas 用户提到使用 `eval` 和 `query` 来加速 pandas 中表达式的求值。虽然使用这些函数可以加快表达式的求值速度，但如果没有一个非常重要的库——`NumExpr`\
  \ 的帮助，这无法实现。如果在未安装 `NumExpr` 的情况下使用这些函数，实际上反而可能导致性能下降。然而，要理解 `NumExpr` 如何能够加速计算，我们需要深入探讨计算机的架构。\n\
  \n## 计算机架构\n\nCPU 被划分为多个核心，每个核心都有专用的缓存。每个核心每次执行一条指令。与你在 Python 程序中可能看到的相比，这些指令非常基础。一行\
  \ Python 代码通常会被分解成许多 CPU 指令。一些例子包括：加载数据（例如在循环时将数组值存储到临时变量中）、跳转到新的指令位置（例如调用函数时），以及求值表达式（例如将两个值相加）。\n\
  \n![../images/487367_1_En_8_Chapter/487367_1_En_8_Fig1_HTML.jpg](img/487367_1_En_8_Fig1_HTML.jpg)\n\
  \n图 8-1 五阶段流水线架构\n\n在现代核心中，求值过程被分为多个阶段。这些多个阶段被称为**流水线**，其中每条指令的求值都会依次通过一系列阶段，直到求值完成。现代英特尔\
  \ CPU 通常被划分为大约 15 个流水线阶段。图 8-1 展示了一个简单的五阶段流水线处理器的例子。首先，指令通常从专用的指令缓存中**取指**，如果不存在，则必须从更远的缓存或主存中获取。然后指令被**译码**。在译码阶段，每条指令都有一个特定的数值代码，该代码被解码为特定类型的指令并产生特定行为，因此译码阶段负责解码指令并从寄存器（你可以将其视作一个非常小的专用内存缓存）中收集数据，以传递给执行阶段。在**执行**阶段，指令被实际运行；这可能意味着将两个值相加，或者如果是加载指令，则只是将一个内存地址传递给下一阶段。由于指令可能跳转到不同的内存位置而非顺序位置，因此求值阶段的一部分工作也是确定要送入流水线的下一条指令。在**访存**阶段，任何需要从内存加载到寄存器以供即将执行的指令使用的数据都会被获取，然后在**写回**阶段加载到寄存器中。这意味着，如果你想将两个值相加，必须先通过加载指令将这两个值加载到两个不同的寄存器中，然后才能运行加法指令。因此，清单\
  \ 8-1 中的那行 Python 代码在 CPU 内部由三条指令组成。\n\n```\na = b + c        load b\nload c\nadd\
  \ a, b, c\n```\n\n清单 8-1 将一行 Python 代码转换为伪代码形式的 CPU 指令\n\n虽然清单 8-1 中的 CPU 指令看起来可能与\
  \ Python 字节码相似，但重要的是要注意它们并不相同。请记住，字节码在 Python 虚拟机上运行，而 CPU 指令在 CPU 上运行。虽然你可以使用 `dis`\
  \ 模块（dis 代表反汇编）来输出字节码，这可能会让你对机器码的样子有所了解，但它**不是**机器码。Python 虚拟机包含一个巨大的 switch 语句，它将一条字节码指令转换为一个函数调用，然后该函数再执行\
  \ CPU 指令。因此，尽管我们可能认为 Python 是一种在软件虚拟机中运行字节码指令的解释型语言，但事实上，在这个过程中的某个时刻，那条加法指令最终会到达\
  \ CPU。最终，那个加法操作会变成清单 8-1 所示的一系列 CPU 指令。\n\n指令流水线的访存阶段比其他所有流水线阶段耗时更长，这是非常常见的。与其让所有其他流水线阶段变得和访存阶段一样慢，或者插入\
  \ NOP（通常称为空操作），不如用其他不依赖于正在加载的数据的指令来填补这段时间。这使得处理器能够继续评估指令，即使指令的某个阶段可能需要数百个周期才能完成。编译器也通过在长时间指令加载期间重排序指令来保持处理器忙碌，确保不依赖于内存加载的指令出现在内存加载指令和依赖该内存已加载的下一条指令之间。在现代英特尔处理器中，CPU\
  \ 内部也可以进行重排序。当然，有时没有指令可以填补间隙，因此 NOP 被用作最后的手段。这确保了核心的指令吞吐量尽可能接近每个时钟周期（阶段）一条指令，这样你就不必为了等待内存加载完成而等待数百个周期。\n\
  \n这里的关键点是：为了高效利用你的 CPU 并获得尽可能高的指令吞吐量，你必须确保数据在使用之前已被加载，并且在你处理的数据和你需要的下一个数据之间提供足够的计算任务。\n\
  \n到目前为止，我们已经介绍了 CPU 如何在底层运行以评估指令，以及它如何努力实现最佳性能；现在让我们更深入地了解访存阶段，以及它为何常常成为瓶颈。图 8-2\
  \ 展示了现代英特尔 CPU 的典型缓存架构。每个核心都有一个专用的 L1 数据缓存、L1 指令缓存和 L2 缓存。所有核心共享 L3 缓存和主存。这些缓存中的每一个在物理电路板上距离核心越来越远。虽然核心速度与晶体管尺寸和速度密切相关，但内存速度则与它们在电路板上距离核心的物理距离有关。\n\
  \n![../images/487367_1_En_8_Chapter/487367_1_En_8_Fig2_HTML.png](img/487367_1_En_8_Fig2_HTML.png)\n\
  \n图 8-2 缓存架构\n\n当处理大型数据集时（这是 pandas 的预期用例），所有这些数据无法全部存储在缓存中。访问 L1 缓存通常需要大约三个时钟周期或指令阶段，并且每增加一个缓存级别，延迟呈指数级增长。访问\
  \ L3 缓存需要大约 21 个时钟周期，而如果我们想要加载的数据不在任何缓存中，并且必须一直访问主存才能加载它，则需要 150 到 400 个时钟周期。在大约\
  \ 21 个时钟周期时，访问 L3 缓存所带来的性能损失很可能超过我们核心中的流水线数量。如果我们在不进行重排序以填充延迟的情况下，必须延迟流水线中的指令直到数据被检索到，这可能会导致整个程序停顿\
  \ 21 个时钟周期。在一个 4 GHz 的处理器上，21 个时钟周期的延迟大约是 5.25 纳秒。这看起来微不足道，如果我们的程序中只发生几次这种延迟，确实如此。但是，请记住，我们在\
  \ pandas 中通常操作的是兆字节级别的数据，由于所有这些数据无法完全放入缓存，我们很可能会遇到许多这样的性能损失。事实上，如果对整个数据集运行操作，我们甚至更有可能遭遇直达主存的那种更大的性能损失。\n\
  \n\n\n缓存通常针对平均情况下的最佳性能进行设计。在软件中，这意味着像循环遍历数组（一种顺序数据结构）这样的操作。正因如此，当缓存需要加载数据时，它会一次性加载称为“缓存行”（cache\
  \ lines）的顺序内存块。这有助于抵消加载数据到缓存所带来的性能损失。其核心理念是，程序通常操作顺序内存，因此通过加载紧随当前核心所需内存之后的内存，可以避免之后再次加载该内存。\n\
  \n为了最有效地利用缓存，在内存中顺序存放或位置接近的数据应在短时间跨度内被反复引用。顺序数据会减少缓存加载的次数。在短时间内反复引用相同的数据可以防止新数据将旧数据挤出缓存，从而避免发生缓存未命中（cache\
  \ miss）——这种情况需要将相同的数据再次加载到缓存中。正如我们在第 3 章所学，数组是顺序数据类型，这意味着第一个元素位于地址`A`，最后一个元素位于地址`A`加上数组长度。当你在内存中创建一系列包含众多指向其他对象的属性的对象，并引用这些属性时，每个对象都有一个非顺序的地址。因此，你将无法有效利用缓存，因为你会从大量不同的内存位置加载不同的缓存行。图\
  \ 8-3 展示了这两种内存访问方式。\n\n![../images/487367_1_En_8_Chapter/487367_1_En_8_Fig3_HTML.jpg](img/487367_1_En_8_Fig3_HTML.jpg)\n\
  \n图 8-3  \n顺序内存访问与随时间推移的对象属性访问对比\n\n## `NumExpr`如何提升性能\n\n`NumExpr`通过在大小与缓存一致的`pandas`\
  \ DataFrame 子集上运行计算，来提升`pandas`的性能。以表达式`(A + B) * 3`为例，其中`A`和`B`是`pandas` DataFrame。没有`NumExpr`时，`A\
  \ + B`的每一行会被逐个相加，存储到临时结构中，然后再乘以 3。使用`NumExpr`时，会先对能放入缓存的前`n`行数据进行相加并乘以 3，然后再处理接下来的`n`行。通过这种方式，`NumExpr`能减少内存加载和存储的次数，正如我们在“计算机体系结构”一节中学到的，这两者是\
  \ CPU 和计算机程序的瓶颈。清单 8-2 演示了这一点。\n\n注意清单 8-2 中的缓存包含三个缓存行（足以容纳`A`、`B`和`C`数据的 64 行）。虽然这远小于真实世界的一级缓存（通常能容纳约\
  \ 128 个缓存行），但它简化了示例。这意味着，在计算完`A + B`的前 64 行结果后，必须将结果存回内存，以便为接下来的 64 行`A`和`B`及其结果腾出空间。注意，通过使用`NumExpr`在缓存大小的块上执行计算的方法，我们减少了加载和存储的次数。同样要注意，清单\
  \ 8-2 中的示例是以顺序的伪代码 CPU 指令形式编写的（即，这些并非在核心内实际执行的指令；在现实世界中，它们很可能为了抵消“计算机体系结构”一节中讨论的内存加载延迟而被重新排序）。\n\
  \n```python\n# NumExpr is not installed.        # NumExpr is installed.\nC = ( A\
  \ + B ) * 3                  C = pd.eval(\"( A + B ) * 3\")\nload A[0:64]      \
  \                 load A[0:64]\nload B[0:64]                       load B[0:64]\n\
  add C[0], A[0], B[0]               add C[0], A[0], B[0]\nmult C[0], C[0], 3\nadd\
  \ C[1], A[1], B[1]               add C[1], A[1], B[1]\nmult C[1], C[1], 3\n.\n.\n\
  add C[63], A[63], B[63]           add C[63], A[63], B[63]\nmult C[63], C[63], 3\n\
  store C[0:64]                     store C[0:64]\nload A[64:128]                \
  \    load A[64:128]\nload B[64:128]                    load B[64:128]\nadd C[64],\
  \ A[64], B[64]           add C[64], A[64], B[64]\nmult C[64], C[64], 3\nadd C[65],\
  \ A[65], B[65]           add C[65], A[65], B[65]\nmult C[65], C[65], 3\n.\n.\nadd\
  \ C[127], A[127], B[127]        add C[127], A[127], B[127]\nmult C[127], C[127],\
  \ 3\nstore C[64:128]                   store C[64:128]\nload C[0:64]\nmult C[0],\
  \ C[0], 3\nmult C[1], C[1], 3\n.\n.\nmult C[3], C[63], 3\nstore C[0:64]\nload C[64:128]\n\
  mult C[64], C[64], 3\n.\n.\nmult [127], C[127], 3\nstore C[64:128]\n```\n清单 8-2\
  \  \n有和没有`NumExpr`时，评估`pandas`表达式的 CPU 伪代码指令\n\n注意，要一次性在`pandas` DataFrames 的块上运行这样的评估，我们必须事先将整个表达式传达给`NumExpr`。`(A\
  \ + B) * 3`必须以某种方式指定，以便`NumExpr`知道它可以将这些操作合并在一起。这正是`query`和`eval`发挥作用的地方。`eval`允许你将一个复杂的表达式作为字符串指定，以通知`NumExpr`它可以一次处理\
  \ DataFrame(s)的一个块。`query`实际上是`eval`的另一种形式，因为它在底层调用了`eval`。\n\n根据具体的计算、数据的形状和大小、操作系统以及你使用的硬件，你可能会发现使用`NumExpr`和`eval`实际上会导致显著的性能下降。在盲目地将计算合并到`eval`或`query`之前，最好先进行性能比较。`NumExpr`实际上只对超过三级缓存大小的计算表现良好。通常，这意味着数组元素数量大于\
  \ 256,000。正如我们所见，与其他`pandas`函数一样，它也要求数据类型的计算能够轻松地转化为 C 语言。因此，例如，日期时间（datetimes）不会带来性能提升，因为它们无法在`NumExpr`中求值。同样值得注意的是，直接使用`NumExpr`通常比在`pandas`中使用`eval`或`query`性能更好。清单\
  \ 8-3 演示了这样一个例子。\n\n```python\nimport pandas as pd\nimport numpy as np\nimport numexpr\
  \ as ne\nnrows, ncols = 1000000, 1\ndf1, df2, df3, df4 = [pd.DataFrame(\nnp.random.randn(nrows,\
  \ ncols)) for _ in range(4)]\n#### Calculate the sum using normal syntax.\ndf_sum1\
  \ = df1 + df2 + df3 + df4\n#### Calculate the sum using eval so that NumExpr optimizes\
  \ it.\ndf_sum2 = pd.eval(\"df1 + df2 + df3 + df4\")\n#### Calculate the sum using\
  \ NumExpr directly.\na1, a2, a3, a4 = (\ndf1.to_numpy(), df2.to_numpy(), df3.to_numpy(),\
  \ df4.to_numpy()\n)\ndf_sum3 = ne.evaluate(\"a1 + a2 + a3 + a4\")\n```\n清单 8-3 \
  \ \n一个示例，其中`eval`比典型的`pandas`语法配合`NumExpr`更慢\n\n`df_sum1`的计算速度是`df_sum2`的两倍。这通常与我们的预期相反，因为`df_sum2`是使用`NumExpr`计算的。然而，如果我们直接使用`NumExpr`而不是通过`pandas`的`eval`，我们会发现`df_sum3`的速度大约是`df_sum1`的四倍。这是由于`pandas`的`eval`函数本身带来的开销造成的。在`eval`内部，它将环境包装成一个局部变量和全局变量的字典，并使它们对`NumExpr`可访问。这包括将\
  \ DataFrames 转换为 NumPy 数组。所有这些都需要相当多的开销，以至于最终比不使用`eval`和`NumExpr`还要慢。很多情况下，正如这里所示，显式地将\
  \ DataFrames 转换为 NumPy 数组，并直接在这些转换后的 DataFrames 上调用`NumExpr`，速度要快得多。\n\n现在我们已经了解了`NumExpr`如何在硬件层面提升组合计算的`pandas`性能，接下来让我们看看`NumPy`和`NumExpr`的另一个依赖——BLAS——是如何利用硬件来优化其计算的。\n\
  \n\n\n## BLAS 和 LAPACK\n\n`NumPy` 在底层使用基本线性代数子程序（BLAS）来实现非常高效的线性代数运算，例如矩阵乘法和向量加法。这些子程序通常用汇编语言编写——这是一种非常底层且性能卓越的语言，与\
  \ CPU 指令高度相似。线性代数包（LAPACK）提供用于求解线性方程的例程。它通常用 Fortran 编写，并且与 NumPy 一样，在底层调用 BLAS。有很多\
  \ BLAS 和 LAPACK 的实现可用，例如 Netlib BLAS 和 LAPACK、OpenBLAS、Intel MKL、Atlas、BLIS 等，每种都有各自的优缺点。不过，让我们更深入地探讨\
  \ BLAS 如何提高 pandas 操作的性能。\n\nBLAS 通过使用单指令多数据流（SIMD）指令来优化矩阵操作，这些指令利用了硬件中的向量寄存器。所有\
  \ CPU 都有寄存器，用于保存 CPU 指令需要操作的数据。向量寄存器只是这些寄存器的一种特殊类型。它们允许在单个寄存器中存储多个数据片段，当对数据执行操作时，该操作会同时对寄存器中的每个数据片段执行。SIMD\
  \ 指令的优势在于，您可以一次性将一堆数据加载到寄存器中，并对它们并发执行相同的操作，而不必对每个元素依次执行相同的操作。通过使用 SIMD 指令，我们减少了完成计算所需的\
  \ CPU 时钟周期数。例如，如果一个向量寄存器能够容纳四个数据元素，那么我们就把时钟周期数从四个减少到了一个。这意味着如果您有一个如列表 8-4 所示的 `y`\
  \ 和 `x` 的点积，那么您可以将其指定为一系列如列表 8-5 所示的 SIMD 指令。请注意，`y` 和 `x` 的数据首先被加载到向量寄存器 `r1` 和\
  \ `r2` 中，然后计算点积并将结果存储在寄存器 `r1` 中。\n\n![../images/487367_1_En_8_Chapter/487367_1_En_8_Figa_HTML.jpg](img/487367_1_En_8_Figa_HTML.jpg)\n\
  \n```\nproduct\n列表 8-4\n点积\n```\n\n```\nload vr2, Y1, Y2, Y3, Y4\nload vr1, X1,\
  \ X2, X3, X4\ndot r1, vr2, vr1\n列表 8-5\n作为 SIMD 伪指令的点积\n```\n\n我们在这里遗漏了一个重要细节，即通常情况下，数据只有在内存中是连续的时候才能被加载到向量寄存器中。这对于大多数复杂的向量操作（通常发生在一个矩阵的行与另一个矩阵的列之间，反之亦然）来说会带来一个小问题。`BLAS`\
  \ 与 Python 相反，它的数组是列优先存储，而不是行优先存储。`BLAS` 也没有二维数组——它们被存储为一维数组。列表 8-6 展示了一个 Python\
  \ 数组的示例，以及它在 BLAS 中是如何存储的。\n\n```\nPython                   BLAS\ny = [[1, 2], [3,\
  \ 4]]     y = [1, 3, 2, 4]\ny[row][col]              y[col * num_cols + row]\n列表\
  \ 8-6\nPython 与 BLAS 中矩阵表示的对比\n```\n\n所以，回到列表 8-5 中的点积示例，因为这两个数组都表示为一维数组，尽管一个是行集合，另一个是列集合，但它们都具有连续的内存地址，因此都可以加载到向量寄存器中。这个连续内存地址的问题只会在处理更复杂的矩阵和更复杂的操作时才会出现，因此让我们看一个更复杂的例子。\n\
  \n执行矩阵乘法有多种方法。其中一种使用点积的方法如图 8-4 所示。取第一个矩阵的行与第二个矩阵的列的点积，将得到矩阵乘法结果中单个元素的值。\n\n![../images/487367_1_En_8_Chapter/487367_1_En_8_Fig4_HTML.jpg](img/487367_1_En_8_Fig4_HTML.jpg)\n\
  \n图 8-4\n\n使用点积的矩阵乘法\n\n在图 8-4 中，我们现在遇到了一个情况，即无法将第一个矩阵的行加载到向量寄存器中，因为其内存不是连续的。但是请注意，如果我们对矩阵进行转置，使行变成列，那么内存就变成连续的了，我们就可以将第一个矩阵的行加载到向量寄存器中。\n\
  \n但是，如果矩阵非常大呢？如果我们将一个 1000 x 1000 的矩阵进行转置，它无法全部放入缓存中，并且在需要到主内存读写数据时会导致巨大的延迟。`BLAS`\
  \ 通过将矩阵数据分解成块来对此进行优化，就像 NumExpr 一样。图 8-5 显示了一个示例。通过这样做，`BLAS` 能够将转置后的矩阵全部保留在缓存中，并且还能在每个块上重用那个占位符转置缓冲区。这样做的优势不仅在于将转置后的缓冲区保留在缓存中，还在于不必为每个块重新分配新的缓冲区。它只需用当前块的新转置数据覆盖上一个块的缓冲区即可。\n\
  \n![../images/487367_1_En_8_Chapter/487367_1_En_8_Fig5_HTML.png](img/487367_1_En_8_Fig5_HTML.png)\n\
  \n图 8-5\n\n将大矩阵分解成块\n\n通过将问题分解成块，`BLAS` 还能够利用多核。它可以在不同的核心上运行每个块，这也节省了时间。\n\n`BLAS`\
  \ 用于加速计算的另一种技术是循环展开。这是将一个循环转换为一串重复指令的过程。循环展开消除了预测分支的需要，以及因错误预测分支而可能产生的分支预测惩罚。回想一下，在数据流水线中，指令的加载和处理可能发生在条件指令检查的结果之前。因此，硬件会在确切知道结果之前，尽力正确地预测该条件的结果以及将要执行哪个分支。循环展开还避免了将指令指针跳转到指令内存中的新位置，这有可能避免缓存未命中以及需要到主内存加载不在指令缓存中的指令。它还避免了每次迭代开始时的条件指令检查，从而节省了\
  \ CPU 周期。通过展开循环，您可能还能够重新排序计算，使得使用相同内存的计算被放置在相近的位置，从而减少寄存器加载指令。\n\n总之，`BLAS` 使用了许多技术来提高线性代数运算的性能：`SIMD`\
  \ 指令、分块、循环展开、多线程等等。还有许多可用的 `BLAS` 实现，为某些类型的 pandas 程序选择性能更优的选项可能会产生巨大影响。\n\n如果您发现自己使用\
  \ pandas 进行了大量的线性代数运算，您可以考虑切换到性能更优的 `BLAS` 实现。`np.config_show()` 将显示 `NumPy` 当前使用的\
  \ `BLAS` 实现。`Netlib BLAS` 实现不完全支持多核，并且往往比替代方案性能差得多。其他实现（如 `OpenBLAS`）完全支持多核，并且是开源且免费的。从\
  \ Anaconda 2.5 或更高版本开始，`Intel MKL` 是默认的 `BLAS` 库，尽管是专有的且体积较大，但它经过高度优化，并且可以免费使用。\n\
  \n\n\n### 确保 NumPy 使用优化依赖\n\n通过确保 NumPy 使用经过优化的依赖项`NumExpr`和`BLAS`，可以显著提升某些`pandas`操作的性能。这些库会根据你运行的具体硬件优化操作，以确保你获得尽可能最佳的性能。但需要注意它们何时能提升性能、何时不能。在最后一章中，我们将探讨`pandas\
  \ 1.0`及未来的发展。\n\n"
- "# 9. pandas 的未来\n\n目前有越来越多的包构建在`pandas`之上或与之兼容。其中一些包（如`sklearn-pandas`）与`scikit-learn`等其他包集成，以便利用`DataFrame`进行机器学习。另一些包（如`Plotly`）则提供交互式绘图功能和在线协作。近年来，`pandas`还积极向其他语言扩展。现在已有`pandas.js`包和一个`Ruby`包装器，使`Ruby`用户能够调用`Python`的`pandas`\
  \ API。此外，还有一个名为`Weld`的新兴`LLVM`项目，旨在更大规模地优化数据分析。它采用与`NumExpr`类似的方法，但规模更大。其思想是将所有数据分析操作懒散地组合在一起，仅在需要实际结果时才执行。这使得操作能够在更宏大的规模上针对并行计算和内存加载进行优化。\n\
  \n## `pandas 1.0`\n\n`pandas`社区一直在为`pandas 1.0`（自`pandas`初始版本以来的首次重大升级）而努力工作。它解决了之前版本中的许多不足。\n\
  \n`pandas 1.0`新增了一种`pandas`专用的`NA`类型。这种新类型将使所有列类型的空值保持一致。你可能还记得第 4 章中的内容，在`pandas\
  \ 0.25`中，`NaN`必须存储为浮点数；它们不能是布尔值、整数或字符串。以前，无法加载包含`NaN`的列并将其作为整数类型——你必须在加载后将其转换为整数。现在，使用`pandas\
  \ 1.0`，可以加载包含`NaN`的列并将其作为整数类型。列表 9-1 是之前文本中列表 4-15 的相同示例；只是现在它利用了`pandas 1.0`中新增的可空整数类型。请注意，这种新类型的内存使用量比数据类型指示的多一个字节。因此，当类型设置为`Int16Dtype`时，每个元素实际上占用三个字节而不是两个。额外的字节对应于`IntegerArray`实现中的一个布尔掩码，用于标记哪些值是`NA`。\n\
  \n```\n>> data = io.StringIO(\n\"\"\"\nid,age,height,weight\n129237,32,5.4,126\n\
  123083,20,6.1,\n123087,25,4.5,unknown\n\"\"\"\n)\n>> df = pd.read_csv(\ndata.\n\
  dtype={\n'id': np.int32,\n'age': np.int8,\n'height': np.float16,\n'weight': pd.Int16Dtype()},\n\
  na_values=[\"unknown\"],\nindex_col=[0],\n)\nage    height  weight\nid\n129237 \
  \  32     5.4     126\n123083   20     6.1     \n123087   25     4.5     \n>> df.memory_usage(deep=True)\n\
  Index     24\nage        3\nheight     6\nweight     9\n>> df.dtypes\nage      \
  \ int8\nheight    float16\nweight    Int16\n>> df.index.dtype\ndtype('int64')\n\
  列表 9-1\npandas 1.0 处理数据中 NaN 的示例\n```\n\n随着`pd.NA`的引入，以及可空布尔数组和专用字符串数据类型的增加，所有数据类型的空值都可以使用相同的类型一致表示。这一看似简单的更改还修复了因空值类型不一致而导致的\
  \ API 中微妙的差异。例如，在列表 9-2 中，`Categorical.min()`现在返回期望的最小值，而不是`NaN`。\n\n```\n>> pd.Categorical([1,\
  \ 3, 5, np.nan], ordered=True).min()\nNaN\n>> pd.Categorical([1, 3, 5, pd.NA], ordered=True).min()\
  \ # 1.0\n\n列表 9-2\n计算 Categorical 最小值时 pandas 1.0 的行为变化\n```\n\n专用字符串数据类型（`StringDtype`）的引入本身也是巨大的进步。在`pandas\
  \ 0.25`中，字符串存储为对象，这不仅占用大量空间，而且由于对象可以容纳任何类型，无法保证数据一致性。使用新的显式`StringDtype`后，它将占用更少的空间，保证列内的一致性，并且会被识别为文本类型，而不是将文本值与所有属于通用对象容器类型的值混为一谈。列表\
  \ 9-3 展示了新的`pandas`字符串类型节省了多少内存。使用新的字符串类型时，每个值仅占用 8 字节，与之前每个对象值占用约 60 字节的版本相比，内存占用大幅减少。\n\
  \n\n\n```\n>> data = io.StringIO(\n\"\"\"\nid,name\n129237,Mary\n123083,Lacey\n\
  123087,Bob\n\"\"\"\n)\n>> # 使用 pandas 0.25.3 加载数据。\n>> df = pd.read_csv(\ndata,\n\
  dtype={'id': np.int32},\nindex_col=[0],\n)\nname\nid\n129237   Mary\n123083   Lacy\n\
  123083   Bob\n>> df.memory_usage(deep=True)\nIndex     24\nname      197\n>> df.dtypes\n\
  name         object\n>> # 使用 pandas 1.0 加载数据。\n>> df = pd.read_csv(\ndata,\ndtype={\n\
  'id': np.int32,\n'name': pd.StringDtype()},\nindex_col=[0],\n)\nname\nid\n129237\
  \   Mary\n123083   Lacy\n123083   Bob\n>> df.memory_usage(deep=True)\nIndex    \
  \ 24\nname      24\n>> df.dtypes\nname      string\n```\n\n可空布尔类型（Nullable Booleans）对\
  \ pandas 用户来说也是一项巨大的改进。在此之前，布尔列不能有空值状态；只允许`True`和`False`。这意味着用户必须使用整数表示或对象来表示具有第三种`NaN`状态的布尔值，但现在他们可以使用\
  \ pandas 的`BooleanArray`类型。\n\npandas 中引入的新类型，即可空布尔类型、pandas `NA`类型和专用字符串类型，使得 pandas\
  \ 1.0 中的类型转换能力有了显著提升。现在，即使整数、布尔值和字符串包含空值，它们也会被识别并以更小的数据类型进行存储。这对于性能和在加载时节省内存来说是一项巨大的改进。请注意，虽然这些新类型在创建\
  \ pandas 数组时已经存在并会被推断，但在创建`DataFrame`时它们不会被推断。在使用 pandas 创建`DataFrame`时，你必须明确指定类型，pandas\
  \ 才能使用它们。这就是为什么在代码清单 9-1 到 9-3 中，在通过`read_csv`加载数据时，我们明确指定了新的 pandas 类型。如果没有明确指定类型，它们会被推断为与之前版本的\
  \ pandas 相同的类型。\n\n滚动应用（Rolling apply）方法现在也支持一个`engine`参数，该参数提供了使用 Numba 代替 Cython\
  \ 的选项。Numba 会将自定义的应用函数转换成类似 Cython 的优化编译机器码，但对于包含数百万行数据以及对 NumPy ndarray 进行操作的自定义函数的数据集，pandas\
  \ 团队发现 Numba 能生成比 Cython 更优化的代码。当然，只有当你反复多次运行计算时，使用 Numba 才是有意义的，因为 Numba 在首次使用时会有编译开销。\n\
  \npandas 1.0 中对`Categorical`数据类型进行了大量的清理工作。你可能还记得在第 2 章中，`Categorical`数据类型用于保存具有唯一值集合的元数据。API\
  \ 中已弃用的功能已被移除，之前对此数据类型进行操作时不会返回`Categorical`类型，现在则会返回，并且对空值的处理也得到了改进。性能也得到了提升，例如，现在所有传递给`searchsorted`的值在运行比较之前都会被转换为相同的数据类型。代码清单\
  \ 9-4 展示了在`Categorical`上使用`searchsorted`的示例。在 pandas 1.0 中，此操作比之前版本快了大约 24 倍。\n\n\
  ```\nimport pandas as pd\nmetadata = pd.Categorical(\n['Mary'] * 100000 + ['Boby']\
  \ * 100000 + ['Joe'] * 100000\n)\nmetadata.searchsorted(['Mary', 'Joe'])\n```\n\n\
  此外，`groupby`也进行了大量的重构和 bug 修复。它曾经是一段看起来相当复杂、bug 也不少的代码，但在 pandas 1.0 中已经得到了很多改进，包括改进的空值处理、在轴为一的情况下支持按列名进行选择、允许对同一列应用多个自定义聚合函数以匹配系列的`groupby`行为，等等。\n\
  \npandas 中用于读取 CSV 数据的加载和转储（load and dump）选项的支持远远超过其他加载器。虽然支持如此多的选项会导致开发人员编写复杂的代码，但对用户来说是非常友好的。一些加载器在选项上取得了良好的平衡，但有些在加载和转储能力上则有所欠缺，而这些能力本可以为用户带来性能提升。正如我们在第\
  \ 3 章中看到的，`read_sql`缺少在加载时指定数据类型的功能，这对性能来说可能相当关键。另一方面，CSV 加载器有非常多的选项，如果使用不当，有些选项反而会导致性能下降。为了解决这个问题并标准化输入和输出数据方法的选项，在\
  \ pandas 1.0 中做了大量工作。例如，`read_json`和`read_csv`现在都能够按照预期解析和解释`Infinity`、`-Infinity`、`+Infinity`和`NaN`。在之前的版本中，`read_json`无法处理`NaN`或`Infinity`字符串，而`read_csv`也不会将`Infinity`字符串转换为浮点数。`read_excel`中的`usecols`参数也已经标准化，其行为更像`read_csv`的`usecols`参数。之前，`usecols`可以是一个整数，而现在它是一个整数列表，就像`read_csv`一样。\n\
  \npandas 1.0 还有许多其它细微的性能改进。我们在这里仅看几个例子，以便让你对用于提高性能的方法有一些了解。\n\npandas 1.0 修复了`infer_type`方法的性能回归问题。在实现中，一个`if`语句被移到了后面，以避免在过早运行`isnaobj`比较时将数据类型转换为对象而导致的性能下降，如图\
  \ 9-1 所示。\n\n![../images/487367_1_En_9_Chapter/487367_1_En_9_Fig1_HTML.jpg](img/487367_1_En_9_Fig1_HTML.jpg)\n\
  \n另一个性能修复是针对`replace`方法进行的，该方法用于将一个值替换为另一个不同的值。这次的修复方法是在原始代码之前插入一些额外的代码，以利用一些提前退出的条件。如果要替换的值列表为空，则直接返回原始值；如果`inplace`为`False`，则返回原始值的副本。如果只有一个有效值，则将该单个值替换为新值。这些值也被转换成了一个有效值列表，而不是保持原样成为一个可能对给定列不合法值列表。请注意，虽然在图\
  \ 9-2 中没有明确显示，但这个新的`to_replace`列表也在最终的`replace`调用中使用了。通过这样做，减少了所需替换的次数，并提高了处理包含多个不包含任何待替换值的列的大型数据集时的整体性能。\n\
  \n![../images/487367_1_En_9_Chapter/487367_1_En_9_Fig2_HTML.jpg](img/487367_1_En_9_Fig2_HTML.jpg)\n\
  \n比较索引是否相等的性能也得到了改善。这是通过添加图 9-3 中所示的提前退出条件来实现的另一个性能改进。如果维度不相等，则判定索引不相等，并且`MultiIndex`的相等性检查会提前退出。\n\
  \n![../images/487367_1_En_9_Chapter/487367_1_En_9_Fig3_HTML.jpg](img/487367_1_En_9_Fig3_HTML.jpg)\n\
  \n\n\n对`is_monotonic`检查的索引进行了改进。此前，该检查的结果依赖于生成缓存值，但当索引的层级已经单独排序时，可以使用代码的`is_lexsorted`来确定单调性。回忆第\
  \ 3 章，`levels`是索引中唯一值的列表，而`codes`存储了这些值在索引中的位置。`codes`将每个值表示为一个整数，该整数是值在值列表中的索引位置。综合来看，`is_lexsorted`是一个运行在表示值的整数上的`O(n)`算法，而之前的实现总是直接在索引值上进行`O(nlog(n))`的检查，即先使用`NumPy`的`lexsort`排序，然后根据排序结果判断是否有值不按单调顺序排列。通过使用已排序的整数值表示，我们能够更快地确定单调性。图\
  \ 9-4 展示了这一变化（以粗体显示）。\n\n![../images/487367_1_En_9_Chapter/487367_1_En_9_Fig4_HTML.jpg](img/487367_1_En_9_Fig4_HTML.jpg)\n\
  \n**图 9-4：** 为提升`is_monotonic`检查性能而插入的附加代码\n\npandas 团队正讨论从所有 pandas 方法中移除`inplace`选项，因此他们普遍建议不要使用它。`inplace`选项，与其名称所示相反，并不总是在不复制内存的情况下原地操作。这通常是由于\
  \ pandas 的类型推断导致的，即操作结果导致数据类型变化，因此必须用新类型重建数据。代码清单 9-5 说明了这个例子。当`NaN`值被替换为`0.0`时，类型仍然是`float`，可以直接在`NumPy`数组中替换该值，而无需创建新数组并复制内存。当`0.0`被替换为字符串`\"\
  null\"`时，`float64`类型无法容纳字符串，因此必须重建`NumPy`数组，并将内存复制到一个类型为`object`的新数组中。这两个操作都指定了`inplace=True`，但后者导致了内存复制，因为底层数据结构的数据类型必须改变。\n\
  \n```\n>> data = pd.DataFrame({\"size\":[np.nan,1.0,3.5]})\n>> data.dtypes\nsize\
  \     float64\n>> id(data._data.blocks[0].values)\n\n>> data.fillna(0.0, inplace=True)\n\
  >> data.dtypes\nsize     float64\n>> id(data._data.blocks[0].values)\n\n>> data.replace(0.0,\
  \ \"null\", inplace=True)\n>> data.dtypes\nsize     object\n>> id(data._data.blocks[0].values)\n\
  \n**代码清单 9-5：** `inplace=True`导致复制而非修改数据的例子\n```\n\n虽然尝试不复制数据在性能上通常优于总是复制数据，但为了尽可能减少用户的痛苦，将其引导至一个没有`inplace`的世界，pandas\
  \ 团队已建议不要使用`inplace=True`。\n\n在过去的几年里，pandas 的原创者 Wes McKinney 开始了一个名为 Apache Arrow^(⁷)的新项目，他希望该项目有朝一日能成为\
  \ pandas 的后端。该项目的目标是修复 pandas 的许多核心问题，包括减少内存开销和实现惰性求值。\n\n## `结论`\n\n由于 pandas 的用户群体多样化，它支持许多不同的选项和许多不同的方法来完成同一件事。pandas\
  \ 的 API 拥有庞大且不断扩展的功能和选项集，这可能会令人不知所措，并常常导致用户以次优的方式实现功能。这是一个艰难的决定：是限制功能和选项的数量使用户无法做错事，还是提供一套功能使用户能找到方法做任何他们想做的事。pandas\
  \ 无疑选择了后者，这使其成为一个非常强大的工具，适用于许多不同类型的大数据问题。对于那些不关心程序运行一分钟还是一小时的用户来说，使用次优实现并不是问题。然而，对于在意这一点的用户来说，这可能难以推理和理解。希望本书能让你更好地理解\
  \ pandas 底层的工作原理，并对在特定场景下使用哪种方法有一种直觉。\n\n总的来说，我们在本书中涵盖了几条基本的编码规则，你在实施未来的 pandas\
  \ 项目时应牢记在心：\n\n*   如果可能，在加载数据的同时进行数据标准化\n*   显式指定数据类型\n*   避免在 Python 中循环\n*   谨慎选择能优化分析的\
  \ DataFrame 方向\n*   避免复制数据的操作\n*   根据需要利用 Cython 或更快的自定义实现\n\n遵循这些基本的编码规则，并凭借你对给定\
  \ pandas 操作底层性能的直觉，你应该能够为下一个 pandas 项目选择最优的实现方案。\n\n\n\n## 脚注\n\n"
