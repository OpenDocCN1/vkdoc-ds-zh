  \ 的差异有关。C 是一种低级语言，开发人员必须自行管理内存的分配和释放，并且不支持动态类型。对于 C 中的数组而言，所有元素的大小或类型必须一致且已知，以便在\
  \ C 中为输入数据数组和输出数据数组分配适当的内存。清单 3-11 展示了如何在 C 中创建一个浮点数数组。请注意，必须使用 `malloc` 显式分配内存，并且数组大小固定为\
  \ 100——仅能容纳 100 个浮点数。\n\n```\nfloat* array = (float*) malloc(100 * sizeof(float));\n\
