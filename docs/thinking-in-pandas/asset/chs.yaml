  \n当我们删除`ref2`时，字符串`foo`的引用计数为 1；当我们删除`ref1`时，字符串`foo`的引用计数为 0，并且内存可以被释放。这在清单 3-9\
  \ 中演示。\n\n```\ndelete(ref2)       # 执行此行后 reference count = 1\ndelete(ref1)    \
