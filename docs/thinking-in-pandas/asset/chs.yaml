- "# 线程 1 与线程 2 之间`total`递增的竞态条件演示\n\n与此运行总计示例类似，CPython 解释器使用一种引用垃圾收集技术，跟踪引用某个对象的位置数量。垃圾收集器负责跟踪已分配的内存，并在其不再使用时释放内存。它通过维护程序中引用每个对象的所有位置的运行总计来实现这一点。当不再有引用时，即引用计数为零，则内存被释放，这意味着它被释放并可用于存储其他内容。在清单\
  \ 3-8 中，字符串`foo`的引用计数将为 2，因为有两个变量引用它。\n\n```\nref1 = \"foo\"\nref2 = \"foo\"\n```\n\
