    trial_a_records,\ntrial_b_records,\nhow='outer',\nindicator=True,\nright_index=True,\n\
    left_index=True,\non=\"name\",\n).query('_merge != \"both\"').drop('_merge', 1)\n\
    ```\n**清单 2-13**  \n使用反连接合并方法消除同时参与两项试验的患者\n\n## 使用`join`方法合并`DataFrame`\n\n`pandas`的`join`方法只是`merge`的一个包装器，它提供相同的基本合并方法：左连接、右连接、外连接和内连接。它允许你自动对多索引`DataFrame`执行合并操作，而无需指定要合并的索引。执行左连接时，它会自动使用左侧`DataFrame`的索引进行连接；对于右侧`DataFrame`也是如此。由于`join`是在`DataFrame`上执行的，而`merge`则需要显式传入两个`DataFrame`，因此`join`的默认行为是合并到“右侧”`DataFrame`的索引上。在这种情况下，“右侧”是传入的`DataFrame`。这与`merge`的默认行为（内连接）相反。\n\
    \n使用`merge`时，可以不指定显式的键进行合并。在合并两个具有相同数据的`DataFrame`，并且不希望左右`DataFrame`出现重复列，而只是简单地将两个数据集合并在一起的情况下，`merge`比`join`更可取。因为`join`在底层调用了`merge`，它显式地指定了要合并的键，从而消除了对于共享相同列名的`DataFrame`不输出重复列的可能性。这里要遵循的基本规则是：如果不在索引上进行连接，则使用`merge`。\n\
    \n清单 2-14 沿用了之前清单 2-10 中的一个内连接合并示例，但与之前公共建筑记录完全匹配的示例不同，这次存在差异。在这种情况下，使用`join`有几个好处。首先，数据已经根据唯一的建筑名称建立了索引，`join`会自动识别这些索引并用于连接这两个数据集。其次，数据中存在差异，因此我们希望输出`DataFrame`能够并排显示两个`DataFrame`的列，以便进行比较。\n\
    \n```\n>> import pandas as pd\n>> building_records_1844\nestablished\nbuilding\
    \         location\nGrande Hotel     (4,5)        1831\nJone's Farm      (1,2)\
    \        1842\nPublic Library   (6,4)        1836\nMarietta House   (1,7)    \
    \    1823\n>> building_records_2020\nestablished\nbuilding           location\n\
    Sam's Bakery        (5,1)        1962\nGrande Hotel        (4,5)        1830\n\
    Public Library      (6,4)        1835\nMayberry's Factory  (3,2)        1924\n\
    >> building_records_1844.join(\nbuilding_records_2020,\nhow='inner',\nrsuffix=\"\
    _2000\",\n)\nestablished   established_2000\nbuilding          location\nGrande\
    \ Hotel      (4,5)     1831          1830\nPublic Library    (6,4)     1836  \
    \        1835\n```\n**清单 2-14**  \n使用内连接突出显示 1844 年建成并于 2020 年仍存在的建筑在建成日期上的差异\n"
- fmt: '# Combining DataFrames using the `concat` method


    `Concatenate` is a simple way of combining two DataFrames together. Listing [2-15](#487367_1_En_2_Chapter.xhtml#PC15)
    demonstrates a simple concatenation of the same data from multiple sources. `Concatenate`
    has many options including the option `join` which specifies whether to use an
    outer or inner merge and `axis` which specifies whether to merge across columns
    with `axis=1` or rows with `axis=0`. By default, `concatenate` performs an outer
    merge across rows. Note in Listing [2-15](#487367_1_En_2_Chapter.xhtml#PC15),
    location `(6,4)` is present in both `county_a` and `county_b` data, and in the
    concatenated result, it is repeated in the index.


    ```

    >> import pandas as pd

    >> temp_county_a

    temp

    location

    (4,5)          35.6

    (1,2)          37.4

    (6,4)          36.3

    (1,7)          40.2

    >> temp_county_b

    temp

    location

    (6,4)          34.2

    (0,4)          33.7

    (3,8)          38.1

    (1,5)          37.0

    >> pd.concat([temp_county_a, temp_county_b])

    temp

    location

    (4,5)          35.6

    (1,2)          37.4

    (6,4)          36.3

    (1,7)          40.2

    (6,4)          34.2

    (0,4)          33.7

    (3,8)          38.1

    (1,5)          37.0

    Listing 2-15

    Joining two DataFrames together using concat

    ```


    `Concatenate` can also be used in a more complicated manner to create multi-level
    columns or indexes. Listing [2-16](#487367_1_En_2_Chapter.xhtml#PC16) demonstrates
    a concatenation where each `DataFrame` being concatenated is a value in a multi-level
    column. Note in Listing [2-16](#487367_1_En_2_Chapter.xhtml#PC16), `device_a`
    and `device_b` data are temperature measurements at the same locations. Here we
    specify `axis=1` so that the two DataFrames are outer merged across the columns.
    The `key` parameter in Listing [2-16](#487367_1_En_2_Chapter.xhtml#PC16) tells
    concatenate to treat the two temperature columns as different columns even though
    they are named the same and as a bi-product creates a multi-level column. Performing
    an outer merge across the columns and putting the temperatures of each device
    into separate columns means the concatenated result has no repeated location index
    values. This is in opposition to Listing [2-15](#487367_1_En_2_Chapter.xhtml#PC15)
    where the resulting index values were repeated and the two DataFrames were simply
    stacked on top of each other.


    ```

    >> import pandas as pd

    >> temp_device_a

    temp

    location

    (4,5)          35.6

    (1,2)          37.4

    (6,4)          36.3

    (1,7)          40.2

    >> temp_device_b

    temp

    location

    (4,5)          34.2

    (1,2)          36.7

    (6,4)          37.1

    (1,7)          39.0

    >> pd.concat(

    [temp_device_a, temp_device_b],

    keys=["device_a", "device_b"],

    axis=1,

    )

    device_a       device_b

    temp           temp

    location

    (4,5)         35.6           34.2

    (1,2)         37.4           36.7

    (6,4)         36.3           37.1

    (1,7)         40.2           39.0

    Listing 2-16

    Joining two DataFrames together using a multi-level column concat

    ```


    There are many different ways to combine DataFrames together and extract a sub-DataFrame
    in `pandas`. Which method you use really depends on your particular use case.
    The examples presented here are a representative sample, but you should consult
    the documentation of each method as there are some parameters that were not explicitly
    covered in this chapter, such as sorting.^([³](#fn3))


    Footnotes [1](#487367_1_En_2_Chapter.xhtml#Fn1_source)


    # How `pandas` Works Under the Hood


    As with any program language, it’s important to understand what is going on underneath
    because it helps you write more explicit, simpler, performant, and correct code.
    The building blocks of a language (its data structures and API) when used correctly
    can make an operation trivial and when used incorrectly can make an operation
    overly complex if not impossible. Python packages are no different.


    A programming language is simply text that is easily readable and writable by
    humans that can be translated into CPU instructions that are understood by machines.
    As programming languages have become increasingly high level (farther removed
    from the machine code that computers understand), the necessity for developers
    to understand the translation has become less essential. A byproduct of this,
    however, is that software can be written in a non-performant and atypical way
    without developers being forced to address the underlying issues. Non-performant
    solutions on modern computing platforms typically are not visibly non-performant
    until they are scaled to handle much more data. Big data software typically operates
    at a scale where the performance impact is visible because it processes huge data
    sets, often repeating a small quick operation so many times that its performance
    becomes significant. When working at this scale, it’s important to understand
    the data structures and performance optimizations available to you, in order to
    get the most out of your machine with the least amount of effort. This starts
    with understanding the performance of data structures in the language you are
    using.'
