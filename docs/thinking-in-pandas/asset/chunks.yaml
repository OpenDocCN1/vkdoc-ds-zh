  trans: '

    由于 NumPy 在 C 语言中执行计算，它必须将所有 Python 对象转换为与 C 兼容的类型。根据 NumPy 文档，只要数组的类型能够转换为 C 类型，就会在计算前释放
    GIL。这意味着，在使用 NumPy 时，操作那些可转换为 C 类型的类型非常重要。如果你操作的是 NumPy 无法转换为 C 的 Python 对象，那么就无法在
    C 中完成计算，而必须停留在 Python 环境中，直到计算完成才能释放 GIL。


    附录中详细列出了 Python 类型与 NumPy 在其 C 扩展中使用的类型（称为标量）之间的映射关系。在 NumPy API 中，所有 NumPy 类型都被称为
    `dtypes`，并作为 `NumPy` 库的属性提供。


    NumPy 的主要数据结构是 N 维数组或 `ndarray`。它是一种特殊的数组结构，专门处理 Python 与 C 之间的边界问题。需要注意的是，NumPy
    中的 `ndarray` 是同质的，即所有元素都具有相同类型。这同样与 Python 和 C 的差异有关。C 是一种低级语言，开发人员必须自行管理内存的分配和释放，并且不支持动态类型。对于
    C 中的数组而言，所有元素的大小或类型必须一致且已知，以便在 C 中为输入数据数组和输出数据数组分配适当的内存。清单 3-11 展示了如何在 C 中创建一个浮点数数组。请注意，必须使用
    `malloc` 显式分配内存，并且数组大小固定为 100——仅能容纳 100 个浮点数。


    ```

    float* array = (float*) malloc(100 * sizeof(float));

    清单 3-11

    在 C 中为包含 100 个浮点数的数组分配内存

    ```


    NumPy 使用如清单 3-12 所示的 `ndarray` 来构建固定大小的数组，其中 `dtype` 用于指定数组中每个元素的类型，即每个元素在数组中所占用的内存大小。回顾上一节可知，Python
    的 `list` 实现本质上是一个动态数组。与 `ndarray` 不同，Python 的 `list` 类型通过为指向数据的指针分配空间（而非为数据本身分配空间）来处理任意大小的元素。这导致
    Python 的 `list` 比 `ndarray` 占用更多内存，因为列表持有的是指向数据的指针，而非数据本身，从而增加了一层间接性。总之，`ndarray`
    具有固定长度，且每个元素类型相同；而 Python 的 `list` 类型具有动态长度，元素可以是多种不同类型。这是一个重要区别，也是 `pandas` 中每一列都被分配一个特定
    `dtype` 的原因。这同样说明了为什么确保 `pandas` 为特定列分配正确类型、以及为什么对数据进行归一化以避免使用包罗万象的 `object` 类型是如此重要。图
    3-6 展示了清单 3-12 中创建的 `ndarray` 在内存中的表示方式。


    ```

    import numpy as np

    groups_waiting_for_a_table = np.ndarray(

    (3,),

    buffer=np.array([4, 7, 21], dtype=np.uint8),

    dtype=np.uint8,

    )

    清单 3-12

    包含三个无符号 8 位整数的 ndarray

    ```


    ![../images/487367_1_En_3_Chapter/487367_1_En_3_Fig6_HTML.jpg](img/487367_1_En_3_Fig6_HTML.jpg)


    图 3-6


    清单 3-12 在内存中的表示。请与图 3-2 进行比较。


    CPython 解释器提供了一个 C-API，该 API 提供了获取和释放 GIL 的能力。NumPy 使用宏 `NPY_BEGIN_THREADS` 和
    `NPY_END_THREADS` 来标识何时可以在不持有 GIL 的情况下运行 C 代码。NumPy 的数学运算是通用函数（即 `ufunc`）的实例，这些函数在
    C 中实现，并且都会调用这些宏。常见 `ufunc` 列表请参见附录。


    回想一下，在没有 GIL 的情况下运行意味着程序现在可以同时在多个内核上执行指令。这意味着，当使用 NumPy 进行密集的数学运算时，能够在 C 层面通过多线程来分解计算任务，例如统计
    Tiffany 在列表中出现的次数。虽然 NumPy 本身通常不实现多线程计算（仅将计算运行在 C 层面本身就能带来显著的性能提升），但结合 NumPy 使用其他库时，这些库会实现多线程。


    当 NumPy 编译时使用了基础线性代数子程序库（BLAS）或线性代数包（LAPACK），它会根据内存缓存大小和系统可用核心数来执行运算。通过根据机器资源优化计算，NumPy
    能够以远高于常规的速度运行计算。BLAS/LAPACK 有多种不同的实现，包括 OpenBLAS、ATLAS 和 Intel MKL。我们将在后续章节中更详细地探讨这些库如何提升性能；但目前，只需要知道它们的存在，并且对于大规模计算而言，它们能带来巨大的性能差异。

    '
- fmt: '# An introduction to pandas performance


    `pandas` is a wrapper around `NumPy` and `NumPy` is a wrapper around C; thus,
    `pandas` gets its performance from running things in C and not in Python. This
    concept is fundamental to everything you do in `pandas`. When you are in C, you
    are fast, and when you are in Python, you are slow.^([⁴](#fn4))


    The same requirements present for working with NumPy arrays hold true when working
    with pandas `DataFrames`—namely, the Python code must be translatable to C code;
    this includes the types that hold the data and the operations performed on the
    data. Table [3-1](#487367_1_En_3_Chapter.xhtml#Tab1) is a table of pandas types
    to NumPy types. Note that datetimes and timedeltas don’t translate into NumPy
    types. This is because C does not have a datetime data structure, and so in cases
    where operations must be made on datetime data, it is more performant to, instead,
    convert the datetimes to an integer type of seconds since the epoch.


    **Table 3-1** pandas to NumPy types


    | pandas type | NumPy type |

    | --- | --- |

    | `object` | `string_`, `unicode_` |

    | `int64` | `int_`, `int8`, `int16`, `int32`, `int64`, `uint8`, `uint16`, `uint32`,
    `uint64` |

    | `float64` | `float_`, `float16`, `float32`, `float64` |

    | `bool` | `bool_` |

    | `datetime64` | `datetime64[ns]` |

    | `timedelta[ns]` | NA |

    | `category` | NA |


    Note that `category` is also not translatable into C. `category` is similar to
    a tuple in that it is intended to hold a collection of categorical variables,
    meaning metadata with a fixed unique set of values. Because it’s not translatable
    into C, it should never be used to hold data that needs to be analyzed. Its advantage
    mainly comes in its ability to sort things in a custom sort order efficiently
    and simply. Underneath it looks like a data array of indexes where the indexes
    correspond to a unique value in an array of categories. The documentation claims
    that it can result in a huge memory savings when using string categories. Of course,
    we know from the previous section that Python already has a built-in string cache
    that does that for us automatically for certain strings so this would really only
    make a difference if the strings contained characters other than alphanumeric
    and underscore. Listing [3-13](#487367_1_En_3_Chapter.xhtml#PC13) shows an example
    of a `category` and its representation in memory. Note that it uses integers to
    represent the value and those integers map to an index in the `category` array.
    This is a common method of conserving memory in pandas. We’ll run into this again
    later when we look at multi-indexing.


    ```

    import pandas as pd

    produce = pd.Series(

    ["apple", "banana", "carrot", "apple"], dtype="category"

    )

    Data       Categories

    0          apple

    1          banana

    2          carrot


    Listing 3-13

    pandas category example and its representation in memory

    ```


    Operations must also be translatable into C in order to take advantage of NumPy’s
    performance optimizations. This means custom functions like the one in Listing
    [3-14](#487367_1_En_3_Chapter.xhtml#PC14) will not be performant because they
    will run in Python and not in C. We’ll dig more into this example and the `apply`
    function specifically in Chapter [6](#487367_1_En_6_Chapter.xhtml).


    ```

    import pandas as pd

    def grade(values):

    if 70 <= values["score"] < 80:

    values["score"] = "C"

    elif 80 <= values["score"] < 90:

    values["score"] = "B"

    elif 90 <= values["score"]:

    values["score"] = "A"

    else:

    values["score"] = "F"

    return values

    scores = pd.DataFrame({"score": [89, 70, 71, 65, 30, 93, 100, 75]}

    )

    scores.apply(grade, axis=1)

    Listing 3-14

    pandas custom Python operation that isn’t translatable to C

    ```


    Since pandas is built on NumPy, it uses NumPy arrays as the building blocks for
    a pandas `DataFrame`, which ultimately translate into `ndarrays` deep down during
    computations.


    ```

    import pandas as pd

    restaurant_inspections = pd.DataFrame({

    "restaurant": ["Diner","Diner","Pandas","Pandas"],

    "location": [(4,2),(4,2),(5,4),(5,4)],

    "date": ["02/18","05/18","04/18","01/18"],

    "score": [90,100,55,60]})

    >> restaurant_inspections

    restaurant  location   date      score

    Diner       (4, 2)     02/18     90

    Diner       (4, 2)     05/18     100

    Pandas      (5, 4)     04/18     55

    Pandas      (5, 4)     01/18     76

    Index           Blocks

    restaurant      Diner      Diner     Pandas    Pandas

    location        (4, 2)     (4, 2)    (5, 4)    (5, 4)

    date            02/18      05/18     04/18     01/18

    score           90         100       55        76

    Listing 3-15

    pandas single-index DataFrame and its representation in memory

    ```


    Listing [3-15](#487367_1_En_3_Chapter.xhtml#PC15) is an example of the simplest
    form of a pandas `DataFrame`. The data is restaurant health inspection data. It
    has four columns: `restaurant`, `location`, `date`, and `score`. Each column has
    four rows worth of data. Note that some of the data is repeated as there can be
    multiple inspections of the same restaurant over time. Underneath, this `DataFrame`
    is represented as a NumPy array called `Index` that contains the column names
    and a two-dimensional NumPy array called `Blocks` that contains the data.


    This same data could be represented in a more expressive way using a multi-index
    `DataFrame`, where each index is a unique restaurant. This is done in two parts.
    First, we create the index, then the index is attached to the data as shown in
    Listing [3-16](#487367_1_En_3_Chapter.xhtml#PC16). The data is represented the
    same as in the previous example, but note there are only two data columns instead
    of four.


    ```

    import pandas as pd

    restaurants = pd.MultiIndex.from_tuples(

    (

    ("Diner", (4,2)),

    ("Diner", (4,2)),

    ("Pandas", (5,4)),

    ("Pandas", (5,4)),

    ),

    names = ["restaurant", "location"]

    )

    restaurant_inspections = pd.DataFrame(

    {

    "date": ["02/18", "05/18", "04/18", "01/18"],

    "score": [90, 100, 55, 76],

    },

    index=restaurants,

    )

    >> restaurant_inspections

    date    score

    restaurant      location

    Diner           (4, 2)    02/18   90

    05/18   100

    Pandas          (5, 4)    04/18   55

    01/18   76

    Levels      Names                 Labels

    restaurant  Diner   Pandas        0    0

    location    (4, 2)  (5, 4)        0    0

    1    1

    1    1

    Index       Blocks

    date        02/18     05/18    04/18    01/18

    score       90        100      55       76

    Listing 3-16

    pandas multi-index DataFrame and its representation in memory

    ```


    Something special happens when we create a multi-index. Underneath the index doesn’t
    look the same as it did in the single-index example. There is still a NumPy array
    called `Levels` that holds the index names; however, instead of a simple two-dimensional
    NumPy array of data, the data undergoes a form of compression. The `Names` is
    a two-dimensional NumPy array that keeps track of the unique values within the
    index, and `Labels` is a two-dimensional NumPy array of integers whose values
    are the indexes of the unique index values in the `Names` NumPy array. This is
    the same memory saving technique used by the pandas `category` data type, and
    in fact, since `category` came later, they probably copied this technique from
    the pandas multi-index.'
