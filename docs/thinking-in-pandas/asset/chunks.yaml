- fmt: '# `pd.read_json`


    `read_json`解析器完全在C中解析，这与`read_csv`不同，后者在某些条件下可能使用Python解析器。


    参数`orient`定义了JSON格式将如何转换为pandas DataFrame。有六个不同的选项：`split`、`records`、`index`、`columns`、`values`和`table`。如果JSON的格式是已经将列、数据和索引定义为键，如清单[4-20](#487367_1_En_4_Chapter.xhtml#PC20)所示，则应使用`split`选项。还值得注意的是，JSON解析器对空格（包括空白）特别挑剔。


    ```

    >> data = io.StringIO(

    """

    {

    "columns": ["temp"],

    "index": ["234unf923", "340inf351", "234abe045"],

    "data": [[35.2],[32.5],[33.1]],

    }

    """

    )

    >> temperatures = pd.read_json(

    data,

    orient="split",

    )

    temp

    234unf923   35.200000

    340inf351   32.500000

    234abe045   33.100000

    Listing 4-20

    Using orient split

    ```


    如果JSON的格式是每个值都是数据中的一行，列名作为键，如清单[4-21](#487367_1_En_4_Chapter.xhtml#PC21)所示，则应使用`records`选项。


    ```

    >> data = io.StringIO(

    """

    [

    {"location": "234unf923", "temp": 35.2},

    {"location": "340inf351", "temp": 32.5},

    {"location": "234abe045", "temp": 33.1},

    ]

    """

    )

    >> temperatures = pd.read_json(

    data,

    orient="records",

    )

    location     temp

    234unf923    35.200000

    340inf351    32.500000

    234abe045    33.100000

    Listing 4-21

    Using orient records

    ```


    如果JSON的格式是每个键是索引值，每个键的值是一个包含该行列和值的字典，如清单[4-22](#487367_1_En_4_Chapter.xhtml#PC22)所示，则应使用`index`选项。


    ```

    >> data = io.StringIO(

    """

    {

    "234unf923": {"temp": 35.2},

    "340inf351": {"temp": 32.5},

    "234abe045": {"temp": 33.1},

    }

    """

    )

    >> temperatures = pd.read_json(

    data,

    orient="index",

    )

    temp

    234unf923   35.200000

    340inf351   32.500000

    234abe045   33.100000

    Listing 4-22

    Using orient index

    ```


    如果JSON的格式是每个键是列名，每个值是一个字典，其中键是索引，值是列值，如清单[4-23](#487367_1_En_4_Chapter.xhtml#PC23)所示，则应使用`columns`选项。


    ```

    >> data = io.StringIO(

    """

    {

    "temp": {

    "234unf923": 35.2,

    "340inf351": 32.5,

    "234abe045": 33.1,

    },

    }

    """

    )

    >> temperatures = pd.read_json(

    data,

    orient="columns",

    )

    temp

    234unf923   35.200000

    340inf351   32.500000

    234abe045   33.100000

    Listing 4-23

    Using orient columns

    ```


    如果JSON的格式是每一行简单地表示为一个值列表，如清单[4-24](#487367_1_En_4_Chapter.xhtml#PC24)所示，则应使用`values`选项。


    ```

    >> data = io.StringIO(

    """

    [

    ["234unf923", 35.2],

    ["340inf351", 32.5],

    ["234abe045", 33.1],

    ]

