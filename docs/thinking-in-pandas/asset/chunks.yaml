    0          0 LOAD_CONST                1

    2 LOAD_CONST                2

    4 MAKE_FUNCTION             0

    6 LOAD_GLOBAL               0 (range)

    8 LOAD_CONST                3 (5)

    10 CALL_FUNCTION            1

    12 GET_ITER

    14 CALL_FUNCTION            1

    16 STORE_FAST               0 (l)

    18 LOAD_CONST               0 (None)

    20 RETURN_VALUE             None

