    Introduction


    Using the pandas Python library requires a shift in thinking that is not always
    intuitive for those who use it. For beginners, pandas’ rich API can often be overwhelming
    and unclear when determining which solution is optimal. This book aims to give
    you an intuition for using pandas correctly by explaining how its operations work
    underneath. We will establish a foundation of knowledge covering information such
    as Python and NumPy data structures , computer architecture, and performance differences
    between Python and C. With this foundation, we will then be able to explain why
    certain pandas operations perform the way they do under certain circumstances.
    We’ll learn when to use certain operations and when to use a more performant alternative.
    And near the end we’ll cover what improvements can be and are being made to make
    pandas even more performant.


    About the Author About the Technical Reviewer


    # 1. Introduction


    We live in a world full of data. In fact, there is so much data that it’s nearly
    impossible to comprehend it all. We rely more heavily than ever on computers to
    assist us in making sense of this massive amount of information. Whether it’s
    data discovery via search engines, presentation via graphical user interfaces,
    or aggregation via algorithms, we use software to process, extract, and present
    the data in ways that make sense to us. pandas has become an increasingly popular
    package for working with big data sets. Whether it’s analyzing large amounts of
    data, presenting it, or normalizing it and re-storing it, pandas has a wide range
    of features that support big data needs. While pandas is not the most performant
    option available, it’s written in Python, so it’s easy for beginners to learn,
    quick to write, and has a rich API.


    ## About pandas


    pandas is the go-to package for working with big data sets in Python. It’s made
    for working with data sets generally below or around 1 GB in size, but really
    this limit varies depending on the memory constraints of the device you run it
    on. A good rule of thumb is have at least five to ten times the amount of memory
    on the device as your data set. Once the data set starts to exceed the single-digit
    gigabyte range, it’s generally recommended to use a different library such as
    Vaex.


    The name pandas came from the term panel data referring to tabular data. The idea
    is that you can make panels out of a larger panel of the data, as shown in Figure
    [1-1](#487367_1_En_1_Chapter.xhtml#Fig1).


    ![../images/487367_1_En_1_Chapter/487367_1_En_1_Fig1_HTML.png](images/487367_1_En_1_Chapter/487367_1_En_1_Fig1_HTML.png)


    Figure 1-1


    Panel data


    When pandas was first implemented, it was tightly coupled to NumPy, a popular
    Python package for scientific computing providing an n-dimensional array object
    for performing efficient matrix math operations. Using the modern implementation
    of pandas today, you can still see evidence of its tight coupling in the exposition
    of the Not a Number (NaN) type and its API such as the dtype parameter.


    pandas was a truly open source project from the start. The original author Wes
    McKinney in the Python Podcast.__init__ admitted, in order to foster an open source
    community and encourage contributions, pandas was tied perhaps a little too closely
    to the NumPy Python package, but looking back, he wouldn’t have done it any different.
    NumPy was and still is a very popular and powerful Python library for efficient
    mathematical arithmetic. At the time of pandas inception, NumPy was the main data
    computation package of the scientific community, and in order to implement pandas
    quickly and simply in a way that was familiar to its existing user and contributor
    base, the NumPy package became the underlying data structure of the pandas DataFrame.
    NumPy is built on C extensions, and while it supplies a Python API, the main computation
    happens almost entirely in C, which is why it is so efficient. C is much faster
    than Python because it is a low-level language and thus doesn’t consume the memory
    and CPU overhead that Python does in order to provide all the high-level niceties
    such as memory management. Even today, developers still rely heavily on NumPy
    and often perform exclusively NumPy-based operations in their pandas programs.


    The difference in performance between Python and C is often not very significant
    to the average developer. Python is generally fast enough in most cases, and the
    nicety of Python’s high-level language qualities (built-in memory management and
    pseudo-code like syntax, to name a few) generally outweighs the headaches of having
    to manage the memory yourself. However, when operating on huge data sets with
    thousands of rows, these subtle performance differences compound into a much more
    significant difference. For the average developer, this may seem absolutely outrageous,
    but it isn’t unusual for the scientific research community to spend days waiting
    for big data computations to run. Sometimes the computations do really take this
    long; however, other times the programs are simply written in an inefficient way.
    There are many different ways to do the same thing in pandas which makes it flexible
    and powerful but also means it can lead developers down less efficient implementation
    paths that result in very slow data processing.'
