    \ a Delaware corporation.\n\n# 简介\n\n使用`pandas`Python库需要思维上的转变，这对初学者来说并不总是直观的。对于新手而言，`pandas`丰富的API通常令人不知所措，且在确定哪种解决方案最优时不够清晰。本书旨在通过解释其底层操作原理，帮助您培养正确使用`pandas`的直觉。我们将建立知识基础，涵盖诸如Python和NumPy数据结构、计算机体系结构以及Python与C语言之间的性能差异等信息。有了这个基础，我们将能够解释为什么某些`pandas`操作在特定情况下会有那样的性能表现。我们将学习何时使用某些操作，以及何时使用更高性能的替代方案。最后，我们将介绍可以并正在进行的改进，以使`pandas`更加高效。\n\
    \n# 关于作者\n\n# 关于技术审稿人\n\n# 第1章 引言\n\n我们生活在一个充满数据的世界。事实上，数据量之大几乎无法完全理解。我们比以往任何时候都更依赖计算机来帮助我们理解海量信息。无论是通过搜索引擎进行数据发现、通过图形用户界面进行展示，还是通过算法进行聚合，我们都使用软件以有意义的方式处理、提取和呈现数据。`pandas`已成为处理大数据集日益流行的软件包。无论是分析大量数据、呈现数据，还是对其进行规范化并重新存储，`pandas`都拥有支持大数据需求的广泛功能。虽然`pandas`不是性能最高的选择，但它用Python编写，因此易于初学者学习、编写快速，并拥有丰富的API。\n\
    \n## 关于pandas\n\n`pandas`是Python中用于处理大数据集的首选软件包。它通常用于处理大小约在1GB或以下的数据集，但实际上这个限制取决于运行设备的可用内存。一个好的经验法则是设备内存至少是数据集的五到十倍。一旦数据集开始超过个位数GB范围，通常建议使用其他库，例如`Vaex`。\n\
    \n`pandas`这个名称来源于术语\"面板数据\"（`panel data`），指的是表格数据。其思想是，你可以从更大的数据面板中制作子面板，如图[1-1](#487367_1_En_1_Chapter.xhtml#Fig1)所示。\n\
    \n![../images/487367_1_En_1_Chapter/487367_1_En_1_Fig1_HTML.png](images/487367_1_En_1_Chapter/487367_1_En_1_Fig1_HTML.png)\n\
    \n**图1-1** 面板数据\n\n当`pandas`首次实现时，它与NumPy紧密耦合。NumPy是一个流行的Python科学计算软件包，提供用于执行高效矩阵数学运算的n维数组对象。今天使用`pandas`的现代实现，你仍然可以在非数字（`NaN`）类型的暴露以及其API（如`dtype`参数）中看到这种紧密耦合的痕迹。\n\
    \n`pandas`从一开始就是一个真正的开源项目。原作者Wes McKinney在Python Podcast.__init__中承认，为了培养开源社区并鼓励贡献，`pandas`可能与NumPy\
    \ Python包耦合得过于紧密，但回顾过去，他不会做出不同的选择。NumPy过去是，现在仍然是一个非常流行且强大的Python库，用于高效的数学运算。在`pandas`诞生之时，NumPy是科学界主要的数据计算包，为了快速简单地实现`pandas`，并以一种让现有用户和贡献者熟悉的方式进行，NumPy包成为了`pandas`\
    \ DataFrame的底层数据结构。NumPy构建在C扩展之上，虽然它提供了Python API，但主要的计算几乎完全在C中完成，这就是它如此高效的原因。C语言比Python快得多，因为它是低级语言，因此不会消耗Python为提供所有高级特性（如内存管理）而消耗的内存和CPU开销。即使在今天，开发者仍然严重依赖NumPy，并经常在其`pandas`程序中执行纯NumPy操作。\n\
    \nPython和C之间的性能差异对于普通开发者来说通常并不显著。在大多数情况下，Python通常足够快，而Python高级语言特性（如内置内存管理和伪代码式语法）带来的便利性，通常超过了必须自己管理内存的麻烦。然而，当在拥有数千行的大数据集上操作时，这些微小的性能差异会累积成更显著的差异。对于普通开发者来说，这似乎绝对令人难以置信，但对于科学研究界来说，花费数天等待大数据计算运行完成并不罕见。有时计算确实需要这么长时间；然而，其他时候程序只是以低效的方式编写的。在`pandas`中，有多种不同的方法可以完成同一件事，这使其既灵活又强大，但也意味着它可能引导开发者走上效率较低的实现路径，从而导致非常缓慢的数据处理。"
