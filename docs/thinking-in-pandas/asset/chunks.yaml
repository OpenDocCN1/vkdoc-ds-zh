- fmt: "# DataFrame 排版优化\n\nThe `DataFrame` in Listing [3-16](#487367_1_En_3_Chapter.xhtml#PC16)\
    \ ends up being about two-thirds the size of the single-index `DataFrame` in Listing\
    \ [3-15](#487367_1_En_3_Chapter.xhtml#PC15) due to the data compression incurred\
    \ by the use of the multi-index. `pandas` is able to save memory by using an integer\
    \ type instead of another larger type to keep track of and represent index data.\
    \ This of course is advantageous when there is a lot of repeated data in the index\
    \ and less advantageous when there is little to no repeated data in the index.\
    \ This is also why it is important to normalize the data. If, for example, there\
    \ were multiple representations for the same restaurant name (`DINER`, `Diner`,\
    \ `diner`), we would not be able to take advantage of the compression as we have\
    \ done here. We would also not be able to take as large of an advantage of the\
    \ Python string cache either.\n\nSimilar to multi-level indexes, `pandas` also\
    \ permits multi-level columns. The multi-level columns are implemented the same\
    \ as the multi-level indexes with the same data compression technique. Listing\
    \ [3-17](#487367_1_En_3_Chapter.xhtml#PC17) shows an example of how to create\
    \ a multi-index multi-level column `DataFrame`.\n\n```python\nimport pandas as\
    \ pd\nrestaurants = pd.MultiIndex.from_tuples(\n(\n(\"Diner\", (4,2)),\n(\"Pandas\"\
    , (5,4)),\n),\nnames = [\"restaurant\", \"location\"]\n)\ninspections = pd.MultiIndex.from_tuples(\n\
    (\n(0, \"score\"),\n(0, \"date\"),\n(1, \"score\"),\n(1, \"date\"),\n),\nnames=[\"\
    inspection\", None],\n)\nrestaurant_inspections = pd.DataFrame(\n[[90, \"02/18\"\
    , 100, \"05/18\"], [55, \"04/18\", 76, \"01/18\"]],\nindex=restaurants,\ncolumns=inspections,\n\
    )\n>> restaurant_inspections\ninspection             0             1\nscore date\
    \    score date\nrestaurant location\nDiner      (4, 2)      90    02/18   100\
    \   05/18\nPandas     (5, 4)      55    04/18   76    01/18\nListing 3-17\npandas\
    \ multi-index multi-level column DataFrame\n```\n\n## Choosing the right DataFrame\n\
    \nChoosing the orientation of a `pandas` `DataFrame` is a decision that takes\
    \ a lot of consideration and planning. Considerations include:\n\n* What kind\
    \ of data processing will you be doing with the data?\n* Do you need to run aggregated\
    \ calculations over the data or group it?\n* Are all the data types translatable\
    \ to C types and what can you do to make them so?\n* Can you separate the data\
    \ from the metadata?\n* Is there a particular `DataFrame` orientation(s) that\
    \ would make the processing simpler and more performant?\n\nConsider the following\
    \ example of health inspection data. Each restaurant can have multiple inspections,\
    \ and as part of the data processing, we would like to count how many inspections\
    \ each restaurant has had.\n\nThe simplest form of a `pandas` `DataFrame` looks\
    \ like the `DataFrame` in Listing [3-18](#487367_1_En_3_Chapter.xhtml#PC18). In\
    \ order to calculate the number of inspections, the data must be aggregated uniquely\
    \ by restaurant and then the number of inspections for each restaurant must be\
    \ counted. This `DataFrame` takes up approximately 1,120 bits underneath.\n\n\
    ```python\nimport pandas as pd\nrestaurant_inspections = pd.DataFrame({\n    \"\
    restaurant\": [\"Diner\",\"Diner\",\"Pandas\",\"Pandas\"],\n    \"location\":\
    \ [(4,2),(4,2),(5,4),(5,4)],\n    \"date\": [\"02/18\",\"05/18\",\"02/18\",\"\
    05/18\"],\n    \"score\": [90,100,55,60]})\n>> restaurant_inspections\nrestaurant\
    \  location     date      score\nDiner       (4, 2)       02/18     90\nDiner\
    \       (4, 2)       05/18     100\nPandas      (5, 4)       02/18     55\nPandas\
    \      (5, 4)       05/18     76\n>> total_inspections = restaurant_inspections.groupby(\n\
    \    [\"restaurant\", \"location\"], as_index=False,\n)[\"score\"].count()\n>>\
    \ total_inspections.rename(\n    columns={\"score\": \"total\"}, inplace=True\n\
    )\n>> total_inspections\nrestaurant  location    total\nDiner       (4, 2)   \
    \   2\nDiner       (4, 2)      2\n>> restaurant_inspections = pd.merge(\n    restaurant_inspections,\n\
    \    total_inspections,\n    how=\"outer\",\n)\n>> restaurant_inspections\nrestaurant\
    \  location    date    score    total\nDiner       (4, 2)      02/18   90    \
    \   2\nDiner       (4, 2)      05/18   100      2\nPandas      (5, 4)      02/18\
    \   55       2\nPandas      (5, 4)      05/18   76       2\nListing 3-18\nStoring\
    \ and operating on restaurant health inspection data in a single-index DataFrame\n\
    ```\n\nUsing a single-index `DataFrame` is less than ideal for this type of calculation\
    \ for several reasons. First, we need to run an aggregated calculation so we need\
    \ to group the data by unique restaurant. This grouping can be quite time-consuming\
    \ if there are many groups. After running the calculation on each group, you’ll\
    \ notice the resulting `total_inspections` is not the same dimensions as the original\
    \ `restaurant_inspections` `DataFrame`. The dimension mismatch requires us to\
    \ do some finagling to get the new data back into the original `DataFrame`. We\
    \ end up using a merge to do it which builds an entirely new `DataFrame`. This\
    \ means we will be doubling our memory during the merge, and if the original `DataFrame`\
    \ is very large, this could cause a slowdown or even a memory crash if we are\
    \ very close to our max memory usage."
  raw: 'The DataFrame in Listing [3-16](#487367_1_En_3_Chapter.xhtml#PC16) ends up
    being about two-thirds the size of the single-index DataFrame in Listing [3-15](#487367_1_En_3_Chapter.xhtml#PC15)
    due to the data compression incurred by the use of the multi-index. pandas is
    able to save memory by using an integer type instead of another larger type to
    keep track of and represent index data. This of course is advantageous when there
    is a lot of repeated data in the index and less advantageous when there is little
    to no repeated data in the index. This is also why it is important to normalize
    the data. If, for example, there were multiple representations for the same restaurant
    name (DINER, Diner, diner), we would not be able to take advantage of the compression
    as we have done here. We would also not be able to take as large of an advantage
    of the Python string cache either.


    Similar to multi-level indexes, pandas also permits multi-level columns. The multi-level
    columns are implemented the same as the multi-level indexes with the same data
    compression technique. Listing [3-17](#487367_1_En_3_Chapter.xhtml#PC17) shows
    an example of how to create a multi-index multi-level column DataFrame.


    ```

    import pandas as pd

    restaurants = pd.MultiIndex.from_tuples(

    (

    ("Diner", (4,2)),

    ("Pandas", (5,4)),

    ),

    names = ["restaurant", "location"]

    )

    inspections = pd.MultiIndex.from_tuples(

    (

    (0, "score"),

    (0, "date"),

    (1, "score"),

    (1, "date"),

    ),

    names=["inspection", None],

    )

    restaurant_inspections = pd.DataFrame(

    [[90, "02/18", 100, "05/18"], [55, "04/18", 76, "01/18"]],

    index=restaurants,

    columns=inspections,

    )

    >> restaurant_inspections

    inspection             0             1

    score date    score date

    restaurant location

    Diner      (4, 2)      90    02/18   100   05/18

    Pandas     (5, 4)      55    04/18   76    01/18

    Listing 3-17

    pandas multi-index multi-level column DataFrame

    ```


    ## Choosing the right DataFrame


    Choosing the orientation of a pandas DataFrame is a decision that takes a lot
    of consideration and planning. Considerations include


    *   What kind of data processing will you be doing with the data?


    *   Do you need to run aggregated calculations over the data or group it?


    *   Are all the data types translatable to C types and what can you do to make
    them so?


    *   Can you separate the data from the metadata?


    *   Is there a particular DataFrame orientation(s) that would make the processing
    simpler and more performant?


    Consider the following example of health inspection data. Each restaurant can
    have multiple inspections, and as part of the data processing, we would like to
    count how many inspections each restaurant has had.


    The simplest form of a pandas DataFrame looks like the DataFrame in Listing [3-18](#487367_1_En_3_Chapter.xhtml#PC18).
    In order to calculate the number of inspections, the data must be aggregated uniquely
    by restaurant and then the number of inspections for each restaurant must be counted.
    This DataFrame takes up approximately 1,120 bits underneath.


    ```

    import pandas as pd

    restaurant_inspections = pd.DataFrame({

    "restaurant": ["Diner","Diner","Pandas","Pandas"],

    "location": [(4,2),(4,2),(5,4),(5,4)],

    "date": ["02/18","05/18","02/18","05/18"],

    "score": [90,100,55,60]})

    >> restaurant_inspections

    restaurant  location     date      score

    Diner       (4, 2)       02/18     90

    Diner       (4, 2)       05/18     100

    Pandas      (5, 4)       02/18     55

    Pandas      (5, 4)       05/18     76

    >> total_inspections = restaurant_inspections.groupby(

    ["restaurant", "location"], as_index=False,

    )["score"].count()

    >> total_inspections.rename(

    columns={"score": "total"}, inplace=True

    )

    >> total_inspections

    restaurant  location    total

    Diner       (4, 2)      2

    Diner       (4, 2)      2

    >> restaurant_inspections = pd.merge(

    restaurant_inspections,

    total_inspections,

    how="outer",

    )

    >> restaurant_inspections

    restaurant  location    date    score    total

    Diner       (4, 2)      02/18   90       2

    Diner       (4, 2)      05/18   100      2

    Pandas      (5, 4)      02/18   55       2

    Pandas      (5, 4)      05/18   76       2

    Listing 3-18

    Storing and operating on restaurant health inspection data in a single-index DataFrame

    ```


    Using a single-index DataFrame is less than ideal for this type of calculation
    for several reasons. First, we need to run an aggregated calculation so we need
    to group the data by unique restaurant. This grouping can be quite time-consuming
    if there are many groups. After running the calculation on each group, you’ll
    notice the resulting total_inspections is not the same dimensions as the original
    restaurant_inspections DataFrame. The dimension mismatch requires us to do some
    finagling to get the new data back into the original DataFrame. We end up using
    a merge to do it which builds an entirely new DataFrame. This means we will be
    doubling our memory during the merge, and if the original DataFrame is very large,
    this could cause a slowdown or even a memory crash if we are very close to our
    max memory usage.'
  trans: "\n# DataFrame 排版优化\n\n列表 3-16 中的 `DataFrame` 最终大小约为列表 3-15 中单索引 `DataFrame`\
    \ 的三分之二，这是因为使用多索引带来了数据压缩。`pandas` 能够通过使用整数类型（而非其他更大的类型）来跟踪和表示索引数据，从而节省内存。当然，当索引中存在大量重复数据时，这会很有优势；而当索引中几乎没有或完全没有重复数据时，优势则不那么明显。这也正是数据规范化如此重要的原因。例如，如果同一餐厅名称存在多种表示形式（如\
    \ `DINER`、`Diner`、`diner`），那么我们就无法像这里一样充分利用数据压缩。同时，我们也无法充分利用 Python 的字符串缓存。\n\n\
    与多级索引类似，`pandas` 也支持多级列。多级列的实现方式与多级索引相同，都采用了相同的数据压缩技术。列表 3-17 展示了一个如何创建多索引多级列\
    \ `DataFrame` 的示例。\n\n```python\nimport pandas as pd\nrestaurants = pd.MultiIndex.from_tuples(\n\
    (\n(\"Diner\", (4,2)),\n(\"Pandas\", (5,4)),\n),\nnames = [\"restaurant\", \"\
    location\"]\n)\ninspections = pd.MultiIndex.from_tuples(\n(\n(0, \"score\"),\n\
    (0, \"date\"),\n(1, \"score\"),\n(1, \"date\"),\n),\nnames=[\"inspection\", None],\n\
    )\nrestaurant_inspections = pd.DataFrame(\n[[90, \"02/18\", 100, \"05/18\"], [55,\
    \ \"04/18\", 76, \"01/18\"]],\nindex=restaurants,\ncolumns=inspections,\n)\n>>\
    \ restaurant_inspections\ninspection             0             1\nscore date \
    \   score date\nrestaurant location\nDiner      (4, 2)      90    02/18   100\
    \   05/18\nPandas     (5, 4)      55    04/18   76    01/18\n列表 3-17\npandas 多索引多级列\
    \ DataFrame\n```\n\n## 选择合适的 DataFrame\n\n选择 `pandas` `DataFrame` 的排布方式是一个需要深思熟虑和精心规划的决定。需要考虑的因素包括：\n\
    \n*   你将使用这些数据进行哪种类型的数据处理？\n*   你是否需要对数据进行聚合计算或分组？\n*   所有数据类型是否都能转换为 C 类型？如果能，需要怎么做？\n\
    *   你能将数据与元数据分离吗？\n*   是否存在某种特定的 `DataFrame` 排布方式，可以使处理更简单且性能更优？\n\n以健康检查数据为例。每家餐厅可以有多次检查记录，作为数据处理的一部分，我们需要统计每家餐厅接受检查的次数。\n\
    \n`pandas` `DataFrame` 最简单的形式如列表 3-18 中的 `DataFrame` 所示。为了计算检查次数，数据必须首先按餐厅进行唯一聚合，然后统计每家餐厅的检查次数。这个\
    \ `DataFrame` 底层大约占用 1,120 比特。\n\n```python\nimport pandas as pd\nrestaurant_inspections\
    \ = pd.DataFrame({\n    \"restaurant\": [\"Diner\",\"Diner\",\"Pandas\",\"Pandas\"\
    ],\n    \"location\": [(4,2),(4,2),(5,4),(5,4)],\n    \"date\": [\"02/18\",\"\
    05/18\",\"02/18\",\"05/18\"],\n    \"score\": [90,100,55,60]})\n>> restaurant_inspections\n\
    restaurant  location     date      score\nDiner       (4, 2)       02/18     90\n\
    Diner       (4, 2)       05/18     100\nPandas      (5, 4)       02/18     55\n\
    Pandas      (5, 4)       05/18     76\n>> total_inspections = restaurant_inspections.groupby(\n\
    \    [\"restaurant\", \"location\"], as_index=False,\n)[\"score\"].count()\n>>\
    \ total_inspections.rename(\n    columns={\"score\": \"total\"}, inplace=True\n\
    )\n>> total_inspections\nrestaurant  location    total\nDiner       (4, 2)   \
    \   2\nDiner       (4, 2)      2\n>> restaurant_inspections = pd.merge(\n    restaurant_inspections,\n\
    \    total_inspections,\n    how=\"outer\",\n)\n>> restaurant_inspections\nrestaurant\
    \  location    date    score    total\nDiner       (4, 2)      02/18   90    \
    \   2\nDiner       (4, 2)      05/18   100      2\nPandas      (5, 4)      02/18\
    \   55       2\nPandas      (5, 4)      05/18   76       2\n列表 3-18\n在单索引 DataFrame\
    \ 中存储和操作餐厅卫生检查数据\n```\n\n使用单索引 `DataFrame` 进行此类计算并不理想，原因有几点。首先，我们需要进行聚合计算，因此必须按唯一餐厅对数据进行分组。如果分组数量很多，这种分组操作可能会非常耗时。对每个分组进行计算后，你会发现生成的\
    \ `total_inspections` 与原始 `restaurant_inspections` `DataFrame` 的维度不匹配。维度不匹配导致我们需要费些周折才能将新数据放回原始\
    \ `DataFrame`。我们最终通过一次合并来实现，但这会构建一个全新的 `DataFrame`。这意味着在合并过程中内存占用会增加一倍。如果原始 `DataFrame`\
    \ 非常大，并且我们的内存使用已接近上限，这可能会导致处理速度变慢，甚至因内存耗尽而崩溃。\n"
- fmt: '如果我们将数据表示为多索引`DataFrame`（如清单[3-19](#487367_1_En_3_Chapter.xhtml#PC19)所示），数据已经按餐厅唯一分组。这意味着`groupby`操作会更快，因为数据已在索引中分组。同时，`DataFrame`占用的内存更少，因为正如前一节所述，索引中的数据是压缩的。最重要的是，我们无需像使用单索引`DataFrame`时那样进行繁琐的操作。我们能够执行计算并将结果放回原始`DataFrame`，而无需创建副本，这大大节省了时间和内存。你会注意到代码也更简单、更易于理解。这个`DataFrame`底层大约占用880比特。回忆一下，当我们创建多索引时，索引数据会被压缩，这就是为什么这个多索引`DataFrame`比其单索引版本更小。


    ```

    import pandas as pd

    restaurants = pd.MultiIndex.from_tuples(

    (

    ("Diner", (4,2)),

    ("Diner", (4,2)),

    ("Pandas", (5,4)),

    ("Pandas", (5,4)),

    ),

    names = ["restaurant", "location"],

    )

    restaurant_inspections = pd.DataFrame(

    {

    "date": ["02/18", "05/18", "02/18", "05/18"],

    "score": [90, 100, 55, 76],

    },

    index=restaurants,

    )

    >> restaurant_inspections

    date         score

    restaurant  location

    Diner       (4, 2)      02/18        90

    05/18        100

    Pandas      (5, 4)      02/18        55

    05/18        76

    >> restaurant_inspections["total"] = \

    restaurant_inspections["score"].groupby(

    ["restaurant","location"],

    ).count()

    >> restaurant_inspections.set_index(

    ["total"],

    append=True,

    inplace=True,

    )

    date        score

    restaurant  location    total

    Diner       (4, 2)      2        02/18       90

    05/18       100

    Pandas      (5, 4)      2        02/18       55

    05/18       76

    Listing 3-19

    Storing and operating on restaurant health inspection data in a multi-index DataFrame

    ```


    如果我们更进一步呢？如果把日期作为列名，那么所有分数将在同一行上，计算将变得非常简单。这里，唯一的餐厅是索引，唯一的检查日期是列。注意，分数现在是唯一的数据。这使得每一行对应一个唯一的餐厅，因此计数可以简单地对每一行执行。参见清单[3-20](#487367_1_En_3_Chapter.xhtml#PC20)。


    ```

    import pandas as pd

    restaurants = pd.MultiIndex.from_tuples(

    (

    ("Diner", (4,2)),

    ("Pandas", (5,4)),

    ),

    names = ["restaurant", "location"],

    )

    restaurant_inspections = pd.DataFrame(

    {

    "02/18": [90, 55],

    "05/18": [100, 76],

    },

    index=restaurants,

    )

    >> restaurant_inspections

    date                    02/18    05/18

    restaurant  location

    Diner       (4, 2)      90       100

    Pandas      (5, 4)      55       76

    >> restaurant_inspections["total"] = \

    restaurant_inspections.count(axis=1)

    >> restaurant_inspections.set_index(

    ["total"],

    append=True,

    inplace=True,

    )

    date                                 02/18    05/18

    restaurant  location    total

    Diner       (4, 2)      2            90       100

    Pandas      (5, 4)      2            55       76

    Listing 3-20

    Storing and operating on restaurant health inspection data in a multi-index date
    column DataFrame

    ```


    这个`DataFrame`底层大约占用660比特。请注意，它占用的内存更少，因为我们不再跟踪日期和分数列名，且日期值不再重复。对于这些数据，这几乎是我们能实现的最大压缩程度，并且它允许我们对每个唯一餐厅执行非常高效的聚合计算。让我们看看在使用这种格式处理更大数据集时，是否会发现任何缺陷。


    目前，每一行对应一个唯一的餐厅，但如果存在多个同名的餐厅位于不同位置呢？这仍然意味着每一行对应一个唯一的餐厅，因此没有问题。


    如果餐厅不是在相同的日期被检查呢？在一个大城市里，检查员几乎不可能在同一天检查所有餐厅。这意味着数据中会出现空缺，如清单[3-21](#487367_1_En_3_Chapter.xhtml#PC21)所示。


    ```

    date                         02/18    05/18    06/18    07/18

    restaurant  location  total

    Diner       (4, 2)    2      90       100      NaN      NaN

    Pandas      (5, 4)    2      NaN      NaN      55       76

    Listing 3-21

    A representation of Listing 3-20 if not all restaurants were inspected on the
    same day

    ```


    这些空缺可能是一个大问题。回忆一下，分数数据原本表示为无符号8位整数，但现在因为数据中存在`NaN`，数据类型必须容纳`NaN`类型的大小，这迫使数据类型变为32位浮点数。这意味着每个分数占用四倍的内存。不仅如此，数据中还存在大量空白，浪费了空间，最终也浪费了内存。餐厅之间共有的日期越少，这个问题就越严重。多级列索引来拯救！参见清单[3-22](#487367_1_En_3_Chapter.xhtml#PC22)。


    ```

    import pandas as pd

    restaurants = pd.MultiIndex.from_tuples(

    (

    ("Diner", (4,2)),

    ("Pandas", (5,4)),

    ),

    names = ["restaurant", "location"]

    )

    inspections = pd.MultiIndex.from_tuples(

    (

    (0, "score"),

    (0, "date"),

    (1, "score"),

    (1, "date"),

    ),

    names=["inspection", "data"],

    )

    restaurant_inspections = pd.DataFrame(

    [[90, "02/18", 100 "05/18",], [55, "04/18", 76 "01/18",]],

    index=restaurants,

    columns=inspections,

    )

    >> restaurant_inspections

    inspection                  0                1

    score date       score date

    restaurant  location

    Diner       (4, 2)          90  02/18        100  05/18

    Pandas      (5, 4)          55  04/18        76   01/18

    >> total = \

    restaurant_inspections.iloc[

    :,

    restaurant_inspections.columns.get_level_values("data") \

    == "score"

    ].count()

    >> new_index = pd.DataFrame(

    total.values,

    columns=["total"],

    index=restaurant_inspections.index,

    )

    >> new_index.set_index("total", append=True, inplace=True)

    >> restaurant_inspections.index = new_index.index

    >> restaurant_inspections

    inspection                     0               1

    score date      score date

    restaurant  location  total

    Diner       (4, 2)    2        90  02/18       100  05/18

    Pandas      (5, 4)    2        55  04/18       76   01/18

    Listing 3-22

    Storing and operating on restaurant health inspection data in a multi-index multi-level
    column DataFrame

    ```


    对于这个特定用例，这可能是我们使用这种`DataFrame`格式能得到的最优方案。我们充分利用了多级索引和多级列，最大程度地压缩了数据，并以实现最快计算的方式组织了`DataFrame`。请注意，这种特定格式的主要缺点是，要将总数放回索引需要一些繁琐的操作，因此这种解决方案的可读性较差。如果这是你打算采用的解决方案，你可能会考虑创建两个自定义函数：一个用于将数据放入索引，另一个用于将数据放入列。这些函数通过隐藏向`DataFrame`追加层级数据的细节来提高代码的可读性。


    一旦你确定了一种合理的`DataFrame`格式，你可能需要将原始数据加载到`pandas`中，进行规范化，并将其转换为该特定的`DataFrame`格式。在第[4](#487367_1_En_4_Chapter.xhtml)章中，我们将深入探讨一些常见的`pandas`数据加载方法，并更详细地讨论它们提供的规范化选项。


