  trans: '

    # pandas 性能简介


    `pandas` 是 `NumPy` 的包装，而 `NumPy` 又是 C 语言的包装；因此，`pandas` 的性能优势源于其在 C 语言环境而非 Python
    环境中运行。这一概念是你在 `pandas` 中所有操作的基础。当你身处 C 语言环境时，速度飞快；而当你置身 Python 环境时，速度则变得缓慢。^(⁴)


    处理 pandas `DataFrames` 同样需要遵循处理 NumPy 数组时的要求——即 Python 代码必须能够翻译成 C 代码；这包括承载数据的数据类型以及对其执行的操作。表
    3-1 列出了 pandas 类型到 NumPy 类型的映射关系。请注意，datetime 和 timedelta 并不会翻译成 NumPy 类型。这是因为
    C 语言没有 datetime 数据结构，因此在对 datetime 数据执行操作时，更高效的做法是将其转换为自纪元以来的整数秒数。


    **表 3-1** pandas 到 NumPy 类型映射


    | pandas 类型 | NumPy 类型 |

    | --- | --- |

    | `object` | `string_`, `unicode_` |

    | `int64` | `int_`, `int8`, `int16`, `int32`, `int64`, `uint8`, `uint16`, `uint32`,
    `uint64` |

    | `float64` | `float_`, `float16`, `float32`, `float64` |

    | `bool` | `bool_` |

    | `datetime64` | `datetime64[ns]` |

    | `timedelta[ns]` | 不适用 |

    | `category` | 不适用 |


    请注意，`category` 类型同样无法翻译成 C 语言。`category` 类似于元组，旨在包含一组分类变量，即具有固定唯一值集合的元数据。由于它无法翻译成
    C 语言，因此绝不应将其用于保存需要分析的数据。它的主要优势在于能够高效且简便地实现自定义排序顺序。其底层结构类似于一个数据索引数组，这些索引指向一个类别数组中唯一的元素值。文档声称，在使用字符串类别时，它可以节省大量内存。当然，从上一节我们知道，Python
    已经内置了一个字符串缓存，可以自动为某些字符串完成此操作，因此，只有当字符串包含字母数字和下划线以外的字符时，此功能才会真正发挥作用。代码清单 3-13 展示了一个
    `category` 示例及其在内存中的表示。请注意，它使用整数来表示值，并且这些整数映射到 `category` 数组中的索引。这是 pandas 中节省内存的常用方法。稍后我们在讨论多层索引时还会再次遇到它。


    ```

    import pandas as pd

    produce = pd.Series(

    ["apple", "banana", "carrot", "apple"], dtype="category"

    )

    Data       Categories

    0          apple

    1          banana

    2          carrot


    代码清单 3-13

    pandas 类别示例及其在内存中的表示

    ```


    为了利用 NumPy 的性能优化，操作也必须能够翻译成 C 代码。这意味着自定义函数（如代码清单 3-14 所示）性能不会很高，因为它们将在 Python
    中而非 C 语言中运行。我们将在第 6 章中更深入地探讨此示例以及 `apply` 函数。


    ```

    import pandas as pd

    def grade(values):

    if 70 <= values["score"] < 80:

    values["score"] = "C"

    elif 80 <= values["score"] < 90:

    values["score"] = "B"

    elif 90 <= values["score"]:

    values["score"] = "A"

    else:

    values["score"] = "F"

    return values

    scores = pd.DataFrame({"score": [89, 70, 71, 65, 30, 93, 100, 75]}

    )

    scores.apply(grade, axis=1)

    代码清单 3-14

    无法翻译成 C 语言的自定义 pandas Python 操作

    ```


    由于 pandas 构建于 NumPy 之上，它使用 NumPy 数组作为 pandas `DataFrame` 的构建块，而这些数组在底层计算中最终会转换为
    `ndarray`。


    ```

    import pandas as pd

    restaurant_inspections = pd.DataFrame({

    "restaurant": ["Diner","Diner","Pandas","Pandas"],

    "location": [(4,2),(4,2),(5,4),(5,4)],

    "date": ["02/18","05/18","04/18","01/18"],

    "score": [90,100,55,60]})

    >> restaurant_inspections

    restaurant  location   date      score

    Diner       (4, 2)     02/18     90

    Diner       (4, 2)     05/18     100

    Pandas      (5, 4)     04/18     55

    Pandas      (5, 4)     01/18     76

    Index           Blocks

    restaurant      Diner      Diner     Pandas    Pandas

    location        (4, 2)     (4, 2)    (5, 4)    (5, 4)

    date            02/18      05/18     04/18     01/18

    score           90         100       55        76

    代码清单 3-15

    pandas 单索引 DataFrame 及其在内存中的表示

    ```


    代码清单 3-15 是 pandas `DataFrame` 最简单形式的示例。数据是餐厅卫生检查数据。它有四列：`restaurant`、`location`、`date`
    和 `score`。每列有四行数据。请注意，有些数据是重复的，因为同一家餐厅可能在不同时间有多次检查记录。在底层，此 `DataFrame` 被表示为一个名为
    `Index` 的 NumPy 数组（包含列名）和一个名为 `Blocks` 的二维 NumPy 数组（包含数据）。


    同样的数据可以使用多层索引 `DataFrame` 以更具表现力的方式表示，其中每个索引代表一家唯一的餐厅。这分两步完成。首先，我们创建索引，然后将该索引附加到数据上，如代码清单
    3-16 所示。数据的表示方式与上一个示例相同，但请注意，现在只有两列数据，而不是四列。


    ```

    import pandas as pd

    restaurants = pd.MultiIndex.from_tuples(

    (

    ("Diner", (4,2)),

    ("Diner", (4,2)),

    ("Pandas", (5,4)),

    ("Pandas", (5,4)),

    ),

    names = ["restaurant", "location"]

    )

    restaurant_inspections = pd.DataFrame(

    {

    "date": ["02/18", "05/18", "04/18", "01/18"],

    "score": [90, 100, 55, 76],

    },

    index=restaurants,

    )

    >> restaurant_inspections

    date    score

    restaurant      location

    Diner           (4, 2)    02/18   90

    05/18   100

    Pandas          (5, 4)    04/18   55

    01/18   76

    Levels      Names                 Labels

    restaurant  Diner   Pandas        0    0

    location    (4, 2)  (5, 4)        0    0

    1    1

    1    1

    Index       Blocks

    date        02/18     05/18    04/18    01/18

    score       90        100      55       76

    代码清单 3-16

    pandas 多层索引 DataFrame 及其在内存中的表示

    ```


    当我们创建多层索引时，会发生一些特殊的事情。底层索引看起来与单索引示例中的不同。仍然有一个名为 `Levels` 的 NumPy 数组来保存索引名称；然而，数据不再是简单的二维
    NumPy 数组，而是经历了一种压缩形式。`Names` 是一个二维 NumPy 数组，用于跟踪索引中的唯一值，而 `Labels` 是一个二维整数 NumPy
    数组，其值是 `Names` NumPy 数组中唯一索引值的索引。这与 pandas `category` 数据类型使用的内存节省技术相同，事实上，由于 `category`
    出现得更晚，它们很可能复制了 pandas 多层索引的这种技术。

