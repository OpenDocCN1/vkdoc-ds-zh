  trans: '

    # 使用 `concat` 方法合并 DataFrame


    `Concatenate` 是一种简单的合并两个 DataFrame 的方式。清单 2-15 演示了如何将来自多个数据源的相同数据进行简单拼接。`Concatenate`
    有许多选项，包括 `join` 参数（指定使用外合并还是内合并）和 `axis` 参数（指定是按列 `axis=1` 合并，还是按行 `axis=0` 合并）。默认情况下，`concatenate`
    会按行进行外合并。请注意，在清单 2-15 中，位置 `(6,4)` 同时出现在 `county_a` 和 `county_b` 数据中，并且在合并后的结果中，该位置的索引被重复了。


    ```

    >> import pandas as pd

    >> temp_county_a

    temp

    location

    (4,5)          35.6

    (1,2)          37.4

    (6,4)          36.3

    (1,7)          40.2

    >> temp_county_b

    temp

    location

    (6,4)          34.2

    (0,4)          33.7

    (3,8)          38.1

    (1,5)          37.0

    >> pd.concat([temp_county_a, temp_county_b])

    temp

    location

    (4,5)          35.6

    (1,2)          37.4

    (6,4)          36.3

    (1,7)          40.2

    (6,4)          34.2

    (0,4)          33.7

    (3,8)          38.1

    (1,5)          37.0

    清单 2-15

    使用 concat 合并两个 DataFrame

    ```


    `Concatenate` 还可以用于更复杂的场景，例如创建多级列或多级索引。清单 2-16 演示了一个拼接操作，其中被拼接的每个 `DataFrame`
    都是多级列中的一个值。请注意，在清单 2-16 中，`device_a` 和 `device_b` 的数据是相同位置上的温度测量值。这里我们指定 `axis=1`，使两个
    DataFrame 按列进行外合并。清单 2-16 中的 `key` 参数指示 `concatenate` 将这两个温度列视为不同的列（即使它们名称相同），并由此创建一个多级列。按列进行外合并，并将每个设备的温度放入不同的列中，意味着合并后的结果中不会出现重复的位置索引值。这与清单
    2-15 形成对比——在清单 2-15 中，结果中的索引值被重复，两个 DataFrame 只是简单堆叠在一起。


    ```

    >> import pandas as pd

    >> temp_device_a

    temp

    location

    (4,5)          35.6

    (1,2)          37.4

    (6,4)          36.3

    (1,7)          40.2

    >> temp_device_b

    temp

    location

    (4,5)          34.2

    (1,2)          36.7

    (6,4)          37.1

    (1,7)          39.0

    >> pd.concat(

    [temp_device_a, temp_device_b],

    keys=["device_a", "device_b"],

    axis=1,

    )

    device_a       device_b

    temp           temp

    location

    (4,5)         35.6           34.2

    (1,2)         37.4           36.7

    (6,4)         36.3           37.1

    (1,7)         40.2           39.0

    清单 2-16

    使用多级列 concat 合并两个 DataFrame

    ```


    在 `pandas` 中，合并 DataFrame 和提取子 DataFrame 的方法有很多种。选择哪种方法很大程度上取决于你的具体使用场景。这里给出的示例具有一定的代表性，但你应该查阅每个方法的文档，因为本章并未明确涵盖某些参数（例如排序）^(³)。


    脚注 1


    # `pandas` 的工作原理


    与任何编程语言一样，了解底层运行机制非常重要，因为它能帮助你编写更清晰、更简单、性能更高且更正确的代码。语言的基本构建块（其数据结构和 API）如果使用得当，可以化繁为简；如果使用不当，则可能使操作变得异常复杂甚至无法实现。Python
    包也不例外。


    编程语言本质上是人类易于读写、且能翻译成机器理解的 CPU 指令的文本。随着编程语言变得越来越高级（与计算机理解的机器码越来越遥远），开发者理解这种翻译过程的必要性已逐渐降低。然而，这带来的一个副作用是：软件可能以低性能或非典型的方式编写，而开发者却无需解决底层问题。在现代计算平台上，低性能的解决方案通常只有在扩展到处理大量数据时才变得明显可见。大数据软件通常在数据规模较大的情况下运行，性能影响因此显而易见——它需要处理海量数据集，往往将某个快速的小操作重复执行成千上万次，从而使其性能变得至关重要。在这种规模下工作，理解你所能使用的数据结构和性能优化手段，以便以最小的代价充分利用机器性能，就显得尤为重要。这一切都要从理解你所使用语言的数据结构性能开始。'
- fmt: '# Python data structures


    Python’s data structures are its building blocks. Choosing the right data structure
    for the problem you are trying to solve is essential to writing correct and performant
    code.


    First, we’ll look at tuples. They are in many ways comparable to a C array and
    in fact are an array underneath. They are an iterable, meaning you can loop over
    them and look at each value, though they are immutable, meaning the values cannot
    be changed once a tuple has been created. They are great at storing static chunks
    of related information such as metadata. When a small tuple is no longer referenced
    in a program and its memory can be freed, Python keeps it around and adds it to
    the tuple free list so that it can be used again. This saves time in the interpreter
    as it does not have to re-allocate the memory for a new tuple. Underneath, tuples
    translate into a fixed-size array, meaning an array of pointers whose size cannot
    be changed. Listing [3-1](#487367_1_En_3_Chapter.xhtml#PC1) shows a code example
    of a tuple, and Figure [3-1](#487367_1_En_3_Chapter.xhtml#Fig1) illustrates its
    representation in memory. Each index is represented as a memory addresses `0x0000
    0FB0 8421 0000` through `0002` in Listing [3-1](#487367_1_En_3_Chapter.xhtml#PC1).
    The value at each index is a memory address or pointer to the actual value in
    memory. This is how Python is able to store non-like types into the same underlying
    array object. Each address or index of the tuple contains a pointer and only has
    to make room for the pointer rather than the actual value.


    ![../images/487367_1_En_3_Chapter/487367_1_En_3_Fig1_HTML.jpg](images/487367_1_En_3_Chapter/487367_1_En_3_Fig1_HTML.jpg)


    Figure 3-1


    A representation of Listing [3-1](#487367_1_En_3_Chapter.xhtml#PC1) in memory


    ```

    person_info = ("Sara", 140, 5.7)

    Listing 3-1

    Example tuple

    ```


    A list, simply put, is a mutable tuple. A list is an array of a fixed size underneath,
    but when the number of elements exceeds the size that Python originally allocated,
    it creates a new fixed-size array with space for more elements and copies the
    elements from the old array into the new array. The allocated size is base 2,
    so if you initialize a list with five values, underneath Python will allocate
    the fixed-size array to hold eight references. If you then append four more values,
    on the fourth append, the fixed-size array will be re-allocated to be double the
    size (16) and the previous value references will be copied into the new array
    including the new fourth value reference that didn’t fit in the previous size
    8 array. Unlike tuples, they do not have any behind-the-scenes performance optimizations
    for reusing freed memory. This is due to the fact that lists are mutable—meaning
    their values can be changed after creation and they are not of fixed size. Listing
    [3-2](#487367_1_En_3_Chapter.xhtml#PC2) shows an example of a list, and Figure
    [3-2](#487367_1_En_3_Chapter.xhtml#Fig2) illustrates its representation in memory.
    Just like a tuple, the list contains references to the values rather than the
    values themselves. Note since the list was initialized with three values, the
    fixed-size array underneath is of length 4, so at index 3 (element 4), there is
    an empty placeholder value of `0x0`.


    ![../images/487367_1_En_3_Chapter/487367_1_En_3_Fig2_HTML.jpg](images/487367_1_En_3_Chapter/487367_1_En_3_Fig2_HTML.jpg)


    Figure 3-2


    A representation of Listing [3-2](#487367_1_En_3_Chapter.xhtml#PC2) in memory


    ```

    people = ["Sara", "Sam", "Joe"]

    Listing 3-2

    Example list

    ```


    A dictionary is a hash table. The keys are hashed to a memory address or a particular
    index in an array. Depending on the number of keys in the dictionary, a certain
    number of bits of the hash are used to determine the index. Listing [3-3](#487367_1_En_3_Chapter.xhtml#PC3)
    shows an example dictionary and illustrates its representation in memory. In the
    example in Listing [3-3](#487367_1_En_3_Chapter.xhtml#PC3), 2 bits are used as
    there are only two elements. The values in the hashed array are the indexes into
    a second array that contains the complete hash, the key, and the value of the
    key in the dictionary. Note each element in the hashed index array only takes
    up 64 bytes (the size of a pointer) compared to the array of data which takes
    up much more than that because it includes the hash, the key, and the value. By
    keeping a separate array of indexes to the data array, the dictionary implementation
    is able to save space in memory by using a smaller hashed index array to be a
    placeholder for the unused keys rather than the larger data array. It is also
    able to grow the hashed index array as it needs to, similar to how a list grows
    as more elements are inserted, as opposed to allocating a bunch of memory for
    hash indexes that don’t exist. Note the hashed index array can be completely re-initialized
    when the number of hashed bits increases, independent of the data array. Also
    note because of this implementation, the dictionary keys are now sorted by insertion
    time in the data array, and as of Python 3.7, dictionary keys are now guaranteed
    to be in insertion order.


    ```

    word_alphabet = {"a": "apple", "b": "banana"}

    Hash-Index            Data

    None                  hash("a"), "a", "apple"

    0                     hash("b"), "b", " banana"


    None

    Listing 3-3

    Example dictionary and its representation in memory

    ```


    Sets are basically the same implementation as dictionaries but without a value.
    They are a data structure for tracking membership and perform almost all the operations
    in mathematical set theory such as union and intersection. Listing [3-4](#487367_1_En_3_Chapter.xhtml#PC4)
    shows an example set and how it is represented in memory.


    ```

    alphabet = {"a", "b"}

    Hash-Index           Data

    None                 hash("a"), "a"

    0                    hash("b"), "b"


    None

    Listing 3-4

    Example set and its representation in memory

    ```


    There are also many other data structures including integers, floats, Booleans,
    and strings. These pretty much directly translate into their c-type equivalents
    underneath and aren’t really worth going over here. Something that is worth mentioning
    though is some of these have special built-in caching in Python.


    Python has a string and integer cache. Take, for example, `str1` and `str2` in
    Listing [3-5](#487367_1_En_3_Chapter.xhtml#PC5). They are both set to the value
    `“foo”` but underneath they are pointing at the same memory location. This means
    that rather than creating a new string that is an exact copy of `str1` and duplicating
    the memory, the new string will simply point to the existing string value. This
    is demonstrated here by the assertion line where the `is` property is used to
    compare the references or pointers of the two strings for equality.


    ```

    str1 = "foo"

    str2 = "foo"

    assert(str1 is str2)

    Listing 3-5

    str1 and str2 are pointing to the same memory location

    ```


    The string cache, however, only works on strings containing letters, numbers,
    and underscore. This is advantageous to know when working with large data sets
    that may contain other letters. You can save a lot of memory by eliminating characters
    from string values in the data set that prevent string caching. See Listing [3-6](#487367_1_En_3_Chapter.xhtml#PC6).


    ```

    str1 = "foo bar"

    str2 = "foo bar"

    assert(str1 is not str2)

    Listing 3-6

    str1 and str2 are not pointing to the same memory location

    ```


    The integer cache works in a similar way; it only caches integers between and
    including –5 and 256. See Listing [3-7](#487367_1_En_3_Chapter.xhtml#PC7).


    ```

    int1 = 22

    int2 = 22

    int3 = 257

    int4 = 257

    assert(int1 is int2)

    assert(int3 is not int4)

    Listing 3-7

    int1 and int2 are pointing to the same memory location but int3 and int4 are not

    ```


    Again, this can be advantageous to know as breaking a single column of large numbers
    into two columns representing the number in scientific notation, for example,
    may lead to memory savings.'
  raw: '## Python data structures


    Python’s data structures are its building blocks. Choosing the right data structure
    for the problem you are trying to solve is essential to writing correct and performant
    code.


    First, we’ll look at tuples. They are in many ways comparable to a C array and
    in fact are an array underneath. They are an iterable, meaning you can loop over
    them and look at each value, though they are immutable, meaning the values cannot
    be changed once a tuple has been created. They are great at storing static chunks
    of related information such as metadata. When a small tuple is no longer referenced
    in a program and its memory can be freed, Python keeps it around and adds it to
    the tuple free list so that it can be used again. This saves time in the interpreter
    as it does not have to re-allocate the memory for a new tuple. Underneath, tuples
    translate into a fixed-size array, meaning an array of pointers whose size cannot
    be changed. Listing [3-1](#487367_1_En_3_Chapter.xhtml#PC1) shows a code example
    of a tuple, and Figure [3-1](#487367_1_En_3_Chapter.xhtml#Fig1) illustrates its
    representation in memory. Each index is represented as a memory addresses 0x0000
    0FB0 8421 0000 through 0002 in Listing [3-1](#487367_1_En_3_Chapter.xhtml#PC1).
    The value at each index is a memory address or pointer to the actual value in
    memory. This is how Python is able to store non-like types into the same underlying
    array object. Each address or index of the tuple contains a pointer and only has
    to make room for the pointer rather than the actual value.


    ![../images/487367_1_En_3_Chapter/487367_1_En_3_Fig1_HTML.jpg](images/487367_1_En_3_Chapter/487367_1_En_3_Fig1_HTML.jpg)


    Figure 3-1


    A representation of Listing [3-1](#487367_1_En_3_Chapter.xhtml#PC1) in memory


    ```

    person_info = ("Sara", 140, 5.7)

    Listing 3-1

    Example tuple

    ```


    A list, simply put, is a mutable tuple. A list is an array of a fixed size underneath,
    but when the number of elements exceeds the size that Python originally allocated,
    it creates a new fixed-size array with space for more elements and copies the
    elements from the old array into the new array. The allocated size is base 2,
    so if you initialize a list with five values, underneath Python will allocate
    the fixed-size array to hold eight references. If you then append four more values,
    on the fourth append, the fixed-size array will be re-allocated to be double the
    size (16) and the previous value references will be copied into the new array
    including the new fourth value reference that didn’t fit in the previous size
    8 array. Unlike tuples, they do not have any behind-the-scenes performance optimizations
    for reusing freed memory. This is due to the fact that lists are mutable—meaning
    their values can be changed after creation and they are not of fixed size. Listing
    [3-2](#487367_1_En_3_Chapter.xhtml#PC2) shows an example of a list, and Figure
    [3-2](#487367_1_En_3_Chapter.xhtml#Fig2) illustrates its representation in memory.
    Just like a tuple, the list contains references to the values rather than the
    values themselves. Note since the list was initialized with three values, the
    fixed-size array underneath is of length 4, so at index 3 (element 4), there is
    an empty placeholder value of 0x0.


    ![../images/487367_1_En_3_Chapter/487367_1_En_3_Fig2_HTML.jpg](images/487367_1_En_3_Chapter/487367_1_En_3_Fig2_HTML.jpg)


    Figure 3-2


    A representation of Listing [3-2](#487367_1_En_3_Chapter.xhtml#PC2) in memory


    ```

    people = ["Sara", "Sam", "Joe"]

    Listing 3-2

    Example list

    ```


    A dictionary is a hash table. The keys are hashed to a memory address or a particular
    index in an array. Depending on the number of keys in the dictionary, a certain
    number of bits of the hash are used to determine the index. Listing [3-3](#487367_1_En_3_Chapter.xhtml#PC3)
    shows an example dictionary and illustrates its representation in memory. In the
    example in Listing [3-3](#487367_1_En_3_Chapter.xhtml#PC3), 2 bits are used as
    there are only two elements. The values in the hashed array are the indexes into
    a second array that contains the complete hash, the key, and the value of the
    key in the dictionary. Note each element in the hashed index array only takes
    up 64 bytes (the size of a pointer) compared to the array of data which takes
    up much more than that because it includes the hash, the key, and the value. By
    keeping a separate array of indexes to the data array, the dictionary implementation
    is able to save space in memory by using a smaller hashed index array to be a
    placeholder for the unused keys rather than the larger data array. It is also
    able to grow the hashed index array as it needs to, similar to how a list grows
    as more elements are inserted, as opposed to allocating a bunch of memory for
    hash indexes that don’t exist. Note the hashed index array can be completely re-initialized
    when the number of hashed bits increases, independent of the data array. Also
    note because of this implementation, the dictionary keys are now sorted by insertion
    time in the data array, and as of Python 3.7, dictionary keys are now guaranteed
    to be in insertion order.


    ```

    word_alphabet = {"a": "apple", "b": "banana"}

    Hash-Index            Data

    None                  hash("a"), "a", "apple"

    0                     hash("b"), "b", " banana"


    None

    Listing 3-3

    Example dictionary and its representation in memory

    ```


    Sets are basically the same implementation as dictionaries but without a value.
    They are a data structure for tracking membership and perform almost all the operations
    in mathematical set theory such as union and intersection. Listing [3-4](#487367_1_En_3_Chapter.xhtml#PC4)
    shows an example set and how it is represented in memory.


    ```

    alphabet = {"a", "b"}

    Hash-Index           Data

    None                 hash("a"), "a"

    0                    hash("b"), "b"


    None

    Listing 3-4

    Example set and its representation in memory

    ```


    There are also many other data structures including integers, floats, Booleans,
    and strings. These pretty much directly translate into their c-type equivalents
    underneath and aren’t really worth going over here. Something that is worth mentioning
    though is some of these have special built-in caching in Python.


    Python has a string and integer cache. Take, for example, str1 and str2 in Listing
    [3-5](#487367_1_En_3_Chapter.xhtml#PC5). They are both set to the value “foo”
    but underneath they are pointing at the same memory location. This means that
    rather than creating a new string that is an exact copy of str1 and duplicating
    the memory, the new string will simply point to the existing string value. This
    is demonstrated here by the assertion line where the “is” property is used to
    compare the references or pointers of the two strings for equality.


    ```

    str1 = "foo"

    str2 = "foo"

    assert(str1 is str2)

    Listing 3-5

    str1 and str2 are pointing to the same memory location

    ```


    The string cache, however, only works on strings containing letters, numbers,
    and underscore. This is advantageous to know when working with large data sets
    that may contain other letters. You can save a lot of memory by eliminating characters
    from string values in the data set that prevent string caching. See Listing [3-6](#487367_1_En_3_Chapter.xhtml#PC6).


    ```

    str1 = "foo bar"

    str2 = "foo bar"

    assert(str1 is not str2)

    Listing 3-6

    str1 and str2 are not pointing to the same memory location

    ```


    The integer cache works in a similar way; it only caches integers between and
    including –5 and 256\. See Listing [3-7](#487367_1_En_3_Chapter.xhtml#PC7).


    ```

    int1 = 22

    int2 = 22

    int3 = 257

    int4 = 257

    assert(int1 is int2)

    assert(int3 is not int4)

    Listing 3-7

    int1 and int2 are pointing to the same memory location but int3 and int4 are not

    ```


    Again, this can be advantageous to know as breaking a single column of large numbers
    into two columns representing the number in scientific notation, for example,
    may lead to memory savings.'
  trans: '

    # Python 数据结构


    Python 的数据结构是其构建模块。为你要解决的问题选择正确的数据结构，对于编写正确且高性能的代码至关重要。


    首先，我们来看元组。它们在很多方面与 C 语言数组相似，实际上底层就是一个数组。它们是可迭代的，意味着你可以遍历它们并查看每个值，但它们是不可变的，即一旦创建元组，其值就无法更改。它们非常适合存储静态的相关信息块，例如元数据。当程序不再引用一个小元组，并且其内存可以被释放时，Python
    会将其保留并添加到元组空闲列表中，以便可以再次使用。这节省了解释器的时间，因为它不必为新的元组重新分配内存。在底层，元组被转换为固定大小的数组，即一个大小无法改变的指针数组。清单
    3-1 展示了一个元组的代码示例，图 3-1 展示了它在内存中的表示。在清单 3-1 中，每个索引都表示为一个内存地址，从 `0x0000 0FB0 8421
    0000` 到 `0002`。每个索引处的值是一个内存地址或指向内存中实际值的指针。这就是 Python 能够将不同类型的数据存储到同一个底层数组对象中的原因。元组的每个地址或索引都包含一个指针，并且只需要为指针腾出空间，而不是为实际值腾出空间。


    ![../images/487367_1_En_3_Chapter/487367_1_En_3_Fig1_HTML.jpg](img/487367_1_En_3_Fig1_HTML.jpg)


    **图 3-1**


    清单 3-1 在内存中的表示


    ```

    person_info = ("Sara", 140, 5.7)

    清单 3-1

    示例元组

    ```


    简单来说，列表就是可变的元组。列表底层是一个固定大小的数组，但当元素数量超过 Python 最初分配的大小时，它会创建一个新的、有更多元素空间的固定大小数组，并将旧数组中的元素复制到新数组中。分配的大小以
    2 为基数，所以如果你用一个包含五个值的列表初始化，Python 底层会分配一个能够容纳八个引用的固定大小数组。如果你接着追加四个值，在第四次追加时，这个固定大小数组将会被重新分配为原来大小的两倍（16），并且之前的值的引用会被复制到新数组中，包括那个在之前大小为
    8 的数组中无法容纳的第四个新值的引用。与元组不同，列表没有针对重用已释放内存的任何幕后性能优化。这是因为列表是可变的——意味着它们的值在创建后可以更改，并且它们不是固定大小的。清单
    3-2 展示了一个列表的示例，图 3-2 展示了它在内存中的表示。与元组一样，列表包含指向值的引用，而不是值本身。注意，由于这个列表是用三个值初始化的，底层的固定大小数组长度为
    4，所以在索引 3（元素 4）处，有一个值为 `0x0` 的空占位符。


    ![../images/487367_1_En_3_Chapter/487367_1_En_3_Fig2_HTML.jpg](img/487367_1_En_3_Fig2_HTML.jpg)


    **图 3-2**


    清单 3-2 在内存中的表示


    ```

    people = ["Sara", "Sam", "Joe"]

    清单 3-2

    示例列表

    ```


    字典是一个哈希表。键被哈希到数组中的一个内存地址或特定索引。根据字典中键的数量，会使用哈希值的特定比特位来确定索引。清单 3-3 展示了一个示例字典及其在内存中的表示。在清单
    3-3 的示例中，由于只有两个元素，所以使用了 2 个比特位。哈希数组中的值是第二个数组的索引，第二个数组包含完整的哈希值、键以及字典中该键对应的值。请注意，哈希索引数组中的每个元素只占用
    64 字节（一个指针的大小），而数据数组占用的空间远大于此，因为它包含了哈希值、键和值。通过维护一个指向数据数组的单独索引数组，字典实现能够使用更小的哈希索引数组来作为未使用键的占位符，而不是更大的数据数组，从而节省内存空间。它还可以根据需要增长哈希索引数组，类似于随着插入更多元素列表的增长方式，而不是为不存在的哈希索引分配一大块内存。请注意，当哈希比特位数增加时，哈希索引数组可以完全重新初始化，而独立于数据数组。同样值得注意的是，由于这种实现方式，字典的键现在会按照插入时间在数据数组中进行排序，自
    Python 3.7 起，字典键保证按照插入顺序排列。


    ```

    word_alphabet = {"a": "apple", "b": "banana"}

    哈希索引            数据

    None                  hash("a"), "a", "apple"

    0                     hash("b"), "b", " banana"


    None

    清单 3-3

    示例字典及其在内存中的表示

    ```


    集合基本上与字典的实现相同，但缺少了值。它是一种用于跟踪成员关系的数据结构，并执行数学集合论中的几乎所有操作，例如并集和交集。清单 3-4 展示了一个示例集合及其在内存中的表示方式。


    ```

    alphabet = {"a", "b"}

    哈希索引           数据

    None                hash("a"), "a"

    0                   hash("b"), "b"


    None

    清单 3-4

    示例集合及其在内存中的表示

    ```


    还有许多其他的数据结构，包括整数、浮点数、布尔值和字符串。这些在底层几乎直接对应到它们的 C 类型等价物，在此不值得赘述。然而，值得一提的是，其中一些在 Python
    中具有特殊的内置缓存机制。


    Python 拥有字符串和整数缓存。以清单 3-5 中的 `str1` 和 `str2` 为例。它们都被设置为值 `“foo”`，但在底层它们指向同一个内存位置。这意味着，与其创建一个新的、与
    `str1` 完全相同的字符串副本并复制内存，不如让新字符串直接指向现有的字符串值。这通过使用 `is` 属性比较两个字符串的引用或指针是否相等的断言行来证明。


    ```

    str1 = "foo"

    str2 = "foo"

    assert(str1 is str2)

    清单 3-5

    str1 和 str2 指向同一个内存位置

    ```


    然而，字符串缓存仅适用于包含字母、数字和下划线的字符串。在处理可能包含其他字符的大型数据集时，了解这一点非常有利。你可以通过从数据集中的字符串值中消除阻止字符串缓存的字符来节省大量内存。参见清单
    3-6。


    ```

    str1 = "foo bar"

    str2 = "foo bar"

    assert(str1 is not str2)

    清单 3-6

    str1 和 str2 不指向同一个内存位置

    ```


    整数缓存的工作方式类似；它只缓存介于 -5 和 256（含）之间的整数。参见清单 3-7。


    ```

    int1 = 22

    int2 = 22

    int3 = 257

    int4 = 257

    assert(int1 is int2)

    assert(int3 is not int4)

    清单 3-7

    int1 和 int2 指向同一个内存位置，但 int3 和 int4 不指向同一个内存位置

    ```


    再说一次，知道这一点可能是有利的，例如，将一列大数字拆分成两列来表示科学计数法中的数字，可能会节省内存。

