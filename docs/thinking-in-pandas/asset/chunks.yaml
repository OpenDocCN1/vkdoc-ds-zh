  raw: 'If instead we represent the data as a multi-index DataFrame as shown in Listing
    [3-19](#487367_1_En_3_Chapter.xhtml#PC19), the data is already grouped uniquely
    by restaurant. This means the groupby will be faster since the data is already
    grouped in the index. It also means the DataFrame will take up less memory since,
    as you recall from the previous section, the data in the index is compressed.
    Most significantly, however, we don’t have to do the kind of finagling that we
    had to do when using a single-index DataFrame. We are able to run the calculation
    and put it back into the original DataFrame without creating a copy which is a
    huge time and memory saver. The code you’ll notice is also simpler and easier
    to follow. This DataFrame takes up approximately 880 bits underneath. Recall that
    when we create a multi-index, the index data is compressed, which is why this
    multi-index DataFrame is smaller than its single-index counterpart.


    ```

    import pandas as pd

    restaurants = pd.MultiIndex.from_tuples(

    (

    ("Diner", (4,2)),

    ("Diner", (4,2)),

    ("Pandas", (5,4)),

    ("Pandas", (5,4)),

    ),

    names = ["restaurant", "location"],

    )

    restaurant_inspections = pd.DataFrame(

    {

    "date": ["02/18", "05/18", "02/18", "05/18"],

    "score": [90, 100, 55, 76],

    },

    index=restaurants,

    )

    >> restaurant_inspections

    date         score

    restaurant  location

    Diner       (4, 2)      02/18        90

    05/18        100

    Pandas      (5, 4)      02/18        55

    05/18        76

    >> restaurant_inspections["total"] = \

    restaurant_inspections["score"].groupby(

    ["restaurant","location"],

    ).count()

    >> restaurant_inspections.set_index(

    ["total"],

    append=True,

    inplace=True,

    )

    date        score

    restaurant  location    total

    Diner       (4, 2)      2        02/18       90

    05/18       100

    Pandas      (5, 4)      2        02/18       55

    05/18       76

    Listing 3-19

    Storing and operating on restaurant health inspection data in a multi-index DataFrame

    ```


    What if we take this one step further? If we make the dates the column names,
    then all the scores will be on the same row and the calculation becomes trivial.
    Here the unique restaurants are indexes, and the unique inspection dates are columns.
    Note the score is now the only data. This makes each row a unique restaurant,
    and thus the count can simply be performed across each row. See Listing [3-20](#487367_1_En_3_Chapter.xhtml#PC20).


    ```

    import pandas as pd

    restaurants = pd.MultiIndex.from_tuples(

    (

    ("Diner", (4,2)),

    ("Pandas", (5,4)),

    ),

    names = ["restaurant", "location"],

    )

    restaurant_inspections = pd.DataFrame(

    {

    "02/18": [90, 55],

    "05/18": [100, 76],

    },

    index=restaurants,

    )

    >> restaurant_inspections

    date                    02/18    05/18

    restaurant  location

    Diner       (4, 2)      90       100

    Pandas      (5, 4)      55       76

    >> restaurant_inspections["total"] = \

    restaurant_inspections.count(axis=1)

    >> restaurant_inspections.set_index(

    ["total"],

    append=True,

    inplace=True,

    )

    date                                 02/18    05/18

    restaurant  location    total

    Diner       (4, 2)      2            90       100

    Pandas      (5, 4)      2            55       76

    Listing 3-20

    Storing and operating on restaurant health inspection data in a multi-index date
    column DataFrame

    ```


    This DataFrame takes up approximately 660 bits underneath. Note this takes up
    less memory because we no longer are tracking the date and score column names
    and the date values are no longer being repeated. This is pretty much as compressed
    as we can get with this data, and it allows us to perform a very efficient aggregated
    calculation over each unique restaurant. Let’s see if we can identify any holes
    in using this format on a larger data set.


    Currently each row is a unique restaurant, but what if there were multiple restaurants
    with the same name at different locations? This would still mean that there is
    a unique restaurant per row so no issues there.


    What if the restaurants were not all inspected on the same days? In a large city,
    it would be near impossible for an inspector to inspect all the restaurants on
    the same day. This means then that there would be holes in the data as shown in
    Listing [3-21](#487367_1_En_3_Chapter.xhtml#PC21).


    ```

    date                         02/18    05/18    06/18    07/18

    restaurant  location  total

    Diner       (4, 2)    2      90       100      NaN      NaN

    Pandas      (5, 4)    2      NaN      NaN      55       76

    Listing 3-21

    A representation of Listing 3-20 if not all restaurants were inspected on the
    same day

    ```


    These holes are potentially a big problem. Recall that the score data was represented
    as an unsigned 8-bit integer, now because there are NaNs in the data, the type
    must accommodate the NaN type size which forces the type to be a 32-bit float.
    That’s four times more memory for each score. Not only that, but now we have a
    bunch of gaps in our data that wasted space and ultimately wasted memory. The
    fewer dates in common there are between the restaurants, the worse this problem
    becomes. Multi-level column index to the rescue! See Listing [3-22](#487367_1_En_3_Chapter.xhtml#PC22).


    ```

    import pandas as pd

    restaurants = pd.MultiIndex.from_tuples(

    (

    ("Diner", (4,2)),

    ("Pandas", (5,4)),

    ),

    names = ["restaurant", "location"]

    )

    inspections = pd.MultiIndex.from_tuples(

    (

    (0, "score"),

    (0, "date"),

    (1, "score"),

    (1, "date"),

    ),

    names=["inspection", "data"],

    )

    restaurant_inspections = pd.DataFrame(

    [[90, "02/18", 100 "05/18",], [55, "04/18", 76 "01/18",]],

    index=restaurants,

    columns=inspections,

    )

    >> restaurant_inspections

    inspection                  0                1

    score date       score date

    restaurant  location

    Diner       (4, 2)          90  02/18        100  05/18

    Pandas      (5, 4)          55  04/18        76   01/18

    >> total = \

    restaurant_inspections.iloc[

    :,

    restaurant_inspections.columns.get_level_values("data") \

    == "score"

    ].count()

    >> new_index = pd.DataFrame(

    total.values,

    columns=["total"],

    index=restaurant_inspections.index,

    )

    >> new_index.set_index("total", append=True, inplace=True)

    >> restaurant_inspections.index = new_index.index

    >> restaurant_inspections

    inspection                     0               1

    score date      score date

    restaurant  location  total

    Diner       (4, 2)    2        90  02/18       100  05/18

    Pandas      (5, 4)    2        55  04/18       76   01/18

    Listing 3-22

    Storing and operating on restaurant health inspection data in a multi-index multi-level
    column DataFrame

    ```


    This is probably the most optimal we can get with this DataFrame format for this
    particular use case. We have compressed our data as much as possible taking advantage
    of both multi-level indexes and multi-level columns and organized the DataFrame
    in such a way as to achieve the fastest calculation possible. Note the main disadvantage
    of this particular format is it requires a bit of finagling to get the total back
    onto the index, and for that reason, this solution is less readable. If this was
    the solution you were going to go with, you might consider making two custom functions:
    one that puts data onto the index and another that puts data onto the columns.
    These functions would improve code readability by hiding the finer details of
    appending level data to the DataFrame.


    Once you have decided on a DataFrame format that makes sense, you will likely
    need to load your raw data into pandas, normalize it, and convert it to that particular
    DataFrame format. In Chapter [4](#487367_1_En_4_Chapter.xhtml), we’ll dive into
    some common pandas data loading methods and discuss the normalization options
    they provide in more detail.


