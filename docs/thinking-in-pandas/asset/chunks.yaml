  raw: 'pandas read_csv function also provides an option called memory_map. When set
    to True and if a filepath is provided, it will map the file directly into virtual
    memory and access the data directly from there. Using this option can improve
    performance because there is no longer any IO overhead waiting for the next chunk
    of the file to be loaded into memory. Generally, accessing memory mapped files
    is faster because the memory is local to the program and the memory mapped is
    already in the page cache so there is no need to load it on the fly. In practice,
    memory mapping the file generally doesn’t provide much of a performance advantage
    in the typical use case of loading a file serially from beginning to end. If you
    are experiencing a lot of cache misses, meaning the file data that would normally
    be loaded into cache (memory closer to the CPU) is not present and must be loaded
    from main memory, this may hold a performance improvement. Cache misses may happen
    if other programs are running concurrently which add their memory into the cache
    and consequently knock your file data out of the cache. See Chapter [8](#487367_1_En_8_Chapter.xhtml)
    for a more detailed explanation of the memory hierarchy and cache misses. This
    might also hold a performance advantage if you are reading this file many times
    over the course of your program or your program runs periodically and you don’t
    want to keep having to load the same file into memory each time it runs. So, while
    this feature sounds like it can provide you with a substantial speedup, the reality
    is unless you are working outside of the standard read a file from start to finish
    workflow, it’s unlikely to do so.


    The na_values parameter allows you to specify values to interpret as Not a Number,
    also known as NaNs. This type comes from NumPy which, if you recall from Chapter
    [2](#487367_1_En_2_Chapter.xhtml), is a dependency of pandas. It’s commonly used
    in NumPy as a placeholder for a value resulting from a computation that is invalid
    such as divide by 0\. Note by default pandas interprets any string Nan or nan
    as a NaN type automatically. This automatic conversion may be problematic if you
    are working with data where Nan or nan may actually be a valid name, for example.
    This is where keep_default_na comes in handy. Setting the parameter keep_default_na
    to False turns off pandas automatic interpretation of certain values to NaNs.
    For a complete list of values that pandas automatically converts to the NaN type,
    see the Appendix.


    The parameter na_filter when set to False disables checking for NaNs altogether,
    and the documentation notes this can lead to a performance improvement when you
    know for certain there are no NaNs in the data. The parameter na_values, on the
    other hand, lets you specify additional values other than the default set that
    you would also like to be converted to NaNs.


    The parameter verbose outputs the number of NaN values in each column that contains
    NaNs when the Python parsing engine is used and parsing performance metrics when
    the C parsing engine is used. The pandas documentation states it outputs NaN values
    explicitly for non-numeric columns. This can be somewhat deceiving however, as
    the non-numeric determination is made at the time the parsing engine runs and
    not based on the final type of the column in the resulting DataFrame. Any column
    with a NaN in it at parsing time is considered a non-numeric column, even if the
    type of that column ultimately ends up being a numeric type (such as a float64
    in the following example). The Python parser must parse all the values in the
    column and convert them appropriately to NaNs before assigning the final type.
    This means the NaN values are counted during parsing before the final type of
    the column has been assigned. Listing [4-13](#487367_1_En_4_Chapter.xhtml#PC13)
    demonstrates this behavior.


    ```

    >> import pandas as pd

    >> data = io.StringIO(

    """

    student_id,grade

    1045,"a"

    2391,"b"

    ,"c"

    1092,"a"

    """

    )

    >> grades = pd.read_csv(

    data,

    verbose=True,

    index_col="student_id",

    engine=''python'',

    )

    Filled 1 NA values in column student_id

    >> grades

    grade

    student_id

    1045        a

    2391        b

    NaN         c

    1092        a

    >> grades.index.dtype

    dtype(''float64'')

    Listing 4-13

    Unexpectedly counting NaNs in numeric columns

    ```


    A limitation of how pandas read_csv handles placeholder types is that you cannot
    specify a converter to convert a NaN to a 0, for example, and also cast a column
    to a particular dtype. Listing [4-14](#487367_1_En_4_Chapter.xhtml#PC14) illustrates
    a case where you might wish to do this. The weight column in the data set does
    not always have a value, nor is it consistent in the way a non-value is entered.
    Sometimes it is left as empty; other times, it is “unknown”. If we do not specify
    a type for this column and let pandas infer the type, pandas stores the column
    values as objects, meaning some of them are integers, some of them are NaNs, and
    some of them are strings. Note that an object in this example takes up 32 bytes
    per element with some additional overhead. This is much more than the desired
    type of an int16 which takes up 2 bytes per element. Not only does the resulting
    DataFrame take up much more memory, but it is also unusable in its state to run
    computations over. Since some of the values are objects, summing all the weights
    in the column, for example, might result in string addition rather than integer
    addition. Thus, leaving pandas to infer the data type in this scenario is less
    than ideal.


    ```

    >> data = io.StringIO(

    """

    id,age,height,weight

    129237,32,5.4,126

    123083,20,6.1,

    123087,25,4.5,unknown

    """

    )

    >> df = pd.read_csv(

    data,

    dtype={

    ''id'': np.int32,

    ''age'': np.int8,

    ''height'': np.float16},

    index_col=[0],

    )

    age    height     weight

    id

    129237      32     5.398438   126

    123083      20     6.101562   NaN

    123083      20     6.101562   unknown

    >> df.memory_usage(deep=True)

    Index      24

    age        3

    height     6

    weight     155

    >> df.dtypes

    age          int8

    height       float16

    weight       object

    >> df.index.dtype

    dtype(''int64'')

    Listing 4-14

    Example of how pandas handles NaNs in the data by default

    ```


    Instead of letting pandas infer the data type, let’s convert all the placeholder
    values to NaNs using na_values. Although ideally we would like them to be int16s,
    float16s take up the same amount of memory, and pandas supports NaNs being stored
    as floats whereas it does not support them being stored as integers during loading,
    so we set the dtype of the weight column to be float16\. Note if we do not specify
    the dtype, it will be a float64\. If we really need them to be integers, we can
    replace the NaNs with zeros using fillna and convert them using astype after loading
    as shown in Listing [4-15](#487367_1_En_4_Chapter.xhtml#PC15).


    ```

    >> data = io.StringIO(

    """

    id,age,height,weight

    129237,32,5.4,126

    123083,20,6.1,

    123087,25,4.5,unknown

    """

    )

    >> df = pd.read_csv(

    data,

    dtype={

    ''id'': np.int32,

    ''age'': np.int8,

    ''height'': np.float16,

    ''weight'': np.float16},

    na_values={"unknown"},

    index_col=[0],

    )

    age    height     weight

    id

    129237        32     5.398438   126

    123083        20     6.101562   NaN

    123083        20     6.101562   NaN

    >> df.memory_usage(deep=True)

    Index      16

    age        3

    height     6

    weight     6

    >> df.dtypes

    age       int8

    height    float16

    weight    float16

    >> df.index.dtype

    dtype(''int64'')

    >> df["weight"].fillna(0, inplace=True)

    >> df["weight"] = df["weight"].astype(np.int16)

    >> df

    age    height    weight

    id

    129237      32     5.398438  126

    123083      20     6.101562  0

    123083      20     6.101562  0

    >> df.memory_usage(deep=True)

    Index      16

    age        3

    height     6

    weight     6

    >> df.dtypes

    age       int8

    height    float16

    weight    int16

    Listing 4-15

    Example of using na_values and dtype to convert placeholder values to float16
    NaNs during load

    ```'
  trans: "```markdown\n\n`pandas`的`read_csv`函数还提供了一个名为`memory_map`的参数。当该参数设置为`True`，并且指定了文件路径时，它会将文件直接映射到虚拟内存中，并直接从那里访问数据。使用此选项可以提升性能，因为无需等待加载下一个文件块到内存而带来的\
    \ I/O 开销。通常，访问内存映射文件速度更快，因为内存在程序本地，且映射的内存已在页面缓存中，因此无需即时加载。在实践中，对于从头到尾串行加载文件的典型用例，内存映射文件通常不会带来太大的性能优势。如果你遇到大量缓存未命中的情况，即通常应被加载到缓存（更接近\
    \ CPU 的内存）中的文件数据不存在，必须从主内存加载，那么使用此方法可能会带来性能提升。如果其他程序同时运行，将内存添加到缓存中，从而将你的文件数据挤出缓存，则可能会发生缓存未命中。有关内存层次结构和缓存未命中的更详细说明，请参见第\
    \ 8 章。如果你的程序需要多次读取同一个文件，或者程序定期运行，而不想每次运行时都重新将同一文件加载到内存中，那么此方法也可能具有性能优势。因此，虽然这个功能听起来可以带来显著的加速，但除非你的工作流程超出了标准的从头到尾读取文件，否则它不太可能做到这一点。\n\
    \n`na_values`参数允许你指定要解释为“非数字”（即 NaN）的值。这种类型来自 NumPy，如果你还记得第 2 章的内容，`pandas`依赖于它。它在\
    \ NumPy 中通常用作计算无效（例如除以 0）所得结果的占位符。请注意，默认情况下，`pandas`会自动将任何字符串`Nan`或`nan`解释为 NaN\
    \ 类型。如果你处理的数据中，`Nan`或`nan`实际上可能是有效名称（例如），那么这种自动转换可能会出现问题。这时`keep_default_na`参数就派上用场了。将`keep_default_na`参数设置为`False`会关闭`pandas`自动将特定值解释为\
    \ NaN 的功能。有关`pandas`自动转换为 NaN 类型的值的完整列表，请参见附录。\n\n`na_filter`参数设置为`False`时会完全禁用对\
    \ NaN 的检查，并且文档指出，当你确定数据中没有任何 NaN 时，这可以带来性能提升。另一方面，`na_values`参数允许你指定除默认值之外的其他要转换为\
    \ NaN 的值。\n\n`verbose`参数会在使用 Python 解析引擎时输出每列中包含 NaN 的 NaN 值数量，在使用 C 解析引擎时则输出解析性能指标。`pandas`文档指出，它会明确为非数值列输出\
    \ NaN 值。然而，这可能会产生误导，因为非数值的判定是在解析引擎运行时做出的，而不是基于结果 DataFrame 中列的最终类型。解析时任何包含 NaN\
    \ 的列都被视为非数值列，即使该列最终的类型是数值类型（如下例中的`float64`）。Python 解析器必须先解析列中的所有值，并适当地将它们转换为 NaN，然后才能分配最终类型。这意味着\
    \ NaN 值的计数是在解析过程中、最终列类型分配之前进行的。清单 4-13 演示了此行为。\n\n```\n>> import pandas as pd\n\
    >> data = io.StringIO(\n\"\"\"\nstudent_id,grade\n1045,\"a\"\n2391,\"b\"\n,\"\
    c\"\n1092,\"a\"\n\"\"\"\n)\n>> grades = pd.read_csv(\ndata,\nverbose=True,\nindex_col=\"\
    student_id\",\nengine='python',\n)\nFilled 1 NA values in column student_id\n\
    >> grades\ngrade\nstudent_id\n1045        a\n2391        b\nNaN         c\n1092\
    \        a\n>> grades.index.dtype\ndtype('float64')\n```\n*清单 4-13*  \n*在数值列中意外计数\
    \ NaN*\n\n`pandas`的`read_csv`处理占位符类型的一个局限性在于，你无法指定一个转换器来将 NaN 转换为 0（例如），同时又将一个列转换为特定的`dtype`。清单\
    \ 4-14 演示了一个你可能希望这样做的情况。数据集中的`weight`列并非总是有值，并且非值的输入方式也不一致。有时它保留为空，有时它是`\"unknown\"\
    `。如果我们不为此列指定类型，而让`pandas`推断类型，`pandas`会将列值存储为对象，这意味着其中一些是整数，一些是 NaN，还有一些是字符串。请注意，在此示例中，一个对象每个元素占用\
    \ 32 字节并带有一些额外开销。这远大于我们期望的`int16`类型（每个元素占用 2 字节）。结果 DataFrame 不仅占用更多内存，而且其状态无法用于运行计算。例如，由于一些值是对象，对列中所有`weight`求和可能会导致字符串相加，而不是整数相加。因此，在这种情况下让`pandas`推断数据类型并不理想。\n\
    \n```\n>> data = io.StringIO(\n\"\"\"\nid,age,height,weight\n129237,32,5.4,126\n\
    123083,20,6.1,\n123087,25,4.5,unknown\n\"\"\"\n)\n>> df = pd.read_csv(\ndata,\n\
    dtype={\n'id': np.int32,\n'age': np.int8,\n'height': np.float16},\nindex_col=[0],\n\
    )\nage    height     weight\nid\n129237      32     5.398438   126\n123083   \
    \   20     6.101562   NaN\n123083      20     6.101562   unknown\n>> df.memory_usage(deep=True)\n\
    Index      24\nage        3\nheight     6\nweight     155\n>> df.dtypes\nage \
    \         int8\nheight       float16\nweight       object\n>> df.index.dtype\n\
    dtype('int64')\n```\n*清单 4-14*  \n*pandas 默认处理数据中 NaN 的示例*\n\n与其让`pandas`推断数据类型，不如使用`na_values`将所有占位符值转换为\
    \ NaN。虽然理想情况下我们希望它们是`int16`，但`float16`占用相同的内存，并且`pandas`支持将 NaN 存储为浮点数，而在加载期间不支持将\
    \ NaN 存储为整数，因此我们将`weight`列的`dtype`设置为`float16`。请注意，如果我们不指定`dtype`，它将是`float64`。如果我们确实需要它们是整数，可以使用`fillna`将\
    \ NaN 替换为零，并在加载后使用`astype`进行转换，如清单 4-15 所示。\n\n```\n>> data = io.StringIO(\n\"\
    \"\"\nid,age,height,weight\n129237,32,5.4,126\n123083,20,6.1,\n123087,25,4.5,unknown\n\
    \"\"\"\n)\n>> df = pd.read_csv(\ndata,\ndtype={\n'id': np.int32,\n'age': np.int8,\n\
    'height': np.float16,\n'weight': np.float16},\nna_values={\"unknown\"},\nindex_col=[0],\n\
    )\nage    height     weight\nid\n129237        32     5.398438   126\n123083 \
    \       20     6.101562   NaN\n123083        20     6.101562   NaN\n>> df.memory_usage(deep=True)\n\
    Index      16\nage        3\nheight     6\nweight     6\n>> df.dtypes\nage   \
    \    int8\nheight    float16\nweight    float16\n>> df.index.dtype\ndtype('int64')\n\
    >> df[\"weight\"].fillna(0, inplace=True)\n>> df[\"weight\"] = df[\"weight\"].astype(np.int16)\n\
    >> df\nage    height    weight\nid\n129237      32     5.398438  126\n123083 \
    \     20     6.101562  0\n123083      20     6.101562  0\n>> df.memory_usage(deep=True)\n\
    Index      16\nage        3\nheight     6\nweight     6\n>> df.dtypes\nage   \
    \    int8\nheight    float16\nweight    int16\n```\n*清单 4-15*  \n*使用`na_values`和`dtype`在加载期间将占位符值转换为`float16`的\
    \ NaN 的示例*\n\n```"
- fmt: '使用C解析引擎时，在详细模式下输出的解析性能指标有助于确定解析引擎的时间消耗位置。清单[4-16](#487367_1_En_4_Chapter.xhtml#PC16)显示了一个示例输出。`Tokenization`是解析器将数据分解为单个值的过程，`Type
    conversion`是将每列转换为特定类型（无论是pandas推断的还是显式指定的）的过程，`Parser memory cleanup`是数据读取后释放所有不再需要的内存所花费的时间。根据这些值，它们可能指出需要改进的领域。例如，如果`Tokenization`耗时很长，则可以通过指定附加选项（如如何解释引号、空格、错误行等）来提高性能。如果在类型转换上花费了大量时间，这可能表明您有一些自定义转换器拖慢了速度，或者您可能需要指定`dtypes`而不是让pandas推断它们。如果发现大量时间花在内存清理上，则可能不需要一次解析整个文件，或者您可能对数据进行了过多转换，导致大量内存重复，从而产生大量内存清理工作。


    ```

    >> grades = pd.read_csv(verbose=True, engine="c")

    Tokenization took: 0.01 ms

    Type conversion took: 0.45 ms

    Parser memory cleanup took: 0.01 ms

    Listing 4-16

    Example output when running in verbose mode with C parsing engine

    ```


    如果将`parse_dates`参数设置为`True`，它将尝试自动检测并将包含日期格式字符串的列转换为`datetime`对象。然而，与其仅将其设置为`True`，更好的做法是显式列出哪些列应转换为`datetime`对象。此参数允许您以列表形式显式指定要转换的列，甚至可以指定列列表的列表，将多个列组合成一个`datetime`对象。清单[4-17](#487367_1_En_4_Chapter.xhtml#PC17)显示了一个显式指定要转换的列的示例。请注意，每个`datetime`对象占用8个字节，但这仍比完全不转换所占用的内存少得多。


    ```

    >> data = io.StringIO(

    """

    id,birth,height,weight

    129237,04/10/1999,5.4,126

    123083,07/03/2000,6.1,150

    123087,11/23/1989,4.5,111

    """

    )

    >> df = pd.read_csv(

    data,

    dtype={

    ''id'': np.int32,

    ''height'': np.float16,

    ''weight'': np.int16},

    parse_dates = ["birth"],

    index_col=[0],

    )

    birth        height     weight

    id

    129237         1999-04-10   5.398438   26

    123083         2000-07-03   6.101562   150

    123083         1989-11-23   6.101562   111

    >> df.memory_usage(deep=True)

    Index      24

    birth      24

    height     6

    weight     6

    >> df.dtypes

    age       int8

    height    float16

    weight    datetime64[ns]

    >> df.index.dtype

    dtype(''int64'')

    Listing 4-17

    Explicitly converting certain columns to datetime objects

    ```


    请注意，清单[4-17](#487367_1_En_4_Chapter.xhtml#PC17)假定该列中没有`NaN`或占位符值。如果存在（如清单[4-18](#487367_1_En_4_Chapter.xhtml#PC18)所示），则必须指定`na_values`将所有占位符值转换为`NaN`；否则，该列将是对象类型而非`datetime`类型，因为占位符值将保留为字符串。


    ```

    >> data = io.StringIO(

    """

    id,birth,height,weight

    129237,04/10/1999,5.4,126

    123083,unknown,6.1,150

    123087,11/23/1989,4.5,111

    """

    )

    >> df = pd.read_csv(

    data,

    dtype={

    ''id'': np.int32,

    ''height'': np.float16,

    ''weight'': np.int16},

    parse_dates=["birth"],

    na_values=["unknown"],

    index_col=[0],

    )

    birth          height      weight

    id

    129237       1999-04-10     5.398438    26

    123083       NaT            6.101562    150

    123083       1989-11-23     6.101562    111

    >> df.memory_usage(deep=True)

    Index      24

    birth      24

    height     6

    weight     6

    >> df.dtypes

    age             int8

    height          float16

    weight          datetime64[ns]

    >> df.index.dtype

    dtype(''int64'')

    Listing 4-18

    Explicitly converting certain columns to datetime objects and handling NaNs

    ```


    通常，`parse_dates`虽然方便，但从性能角度来看适得其反。转换日期需要时间，一旦转换完成，数据类型就无法转换为C语言。因此，建议尽可能将日期时间转换为自纪元以来的时间或一些简单的、可转换为C的数值。如果您需要处理特定的日、月、年，甚至可以将这些信息存储在单独的列中。


    `read_csv`中包含许多其他与日期相关的参数。`infer_datetime_format`参数默认启用，因此只要可能，pandas会尝试自动推断任何日期时间值的格式。文档指出，在某些情况下，当它能够检测并使用特定的日期解析格式时，这可以将解析速度提高五到十倍^([⁶](#fn6))。当设置为`True`时，`keep_date_col`参数会在`parse_dates`指定将多个日期列组合在一起时，同时保留组合后的列和原始的单独日期列。`date_parser`参数允许您指定一个日期解析函数。文档指出，此函数可能以多种不同方式被调用，范围从每行调用一次到一次传入所有行和列。由于此函数在C和Python之间切换，因此尽可能少地调用它是有利的。这意味着最好实现此函数以操作所有日期时间行和列，并输出一个`datetime`实例数组。此函数可以是现有的解析器（默认是`dateutil.parser.parser`），也可以是自定义函数。如果您需要处理特殊的时区，或者数据以特殊的日期时间格式存储，这可能会很有用。并非所有国家都先指定日期再指定月份，因此pandas提供了`dayfirst`参数，以便您可以在解析的日期中指定日是否排在前面。`cache_dates`参数默认启用，它会保存已转换日期的缓存查找表，这样如果同一个日期在数据集中多次出现，就不必再次运行转换，而可以直接使用缓存值。


    `escapechar`参数允许您转义某些字符。例如，在大多数编程语言中，常用的转义字符是反斜杠（`\`），因此可能希望转义引号内的某些引号字符（`\"`）或元素分隔符（`\,`）。清单[4-19](#487367_1_En_4_Chapter.xhtml#PC19)说明了这个用例。如果温度记录是由一个使用逗号作为小数点分隔符且同时使用逗号作为CSV元素分隔符的国家记录的，那么`read_csv`将无法使用其默认配置解析此文件，并会引发解析错误："`pandas.errors.ParserError:
    Error tokenizing data. C error: Expected 2 fields in line 5, saw 3`"。相反，如果使用反斜杠字符转义所有分隔小数位的逗号（`\,`），那么可以配置`read_csv`以正确解析数据。


    ```

    >> import pandas as pd

    >> data = io.StringIO(

    """

    temp, location

    35,234unf923

    32,2340inf012

    33,2340inf351

    33\,1,2340abe045

    """

    )

    >> grades = pd.read_csv(

    data,

    decimal=",",

    escapechar="\\",

    index_col="location",

    )

    temp

    location

    234unf923   35.000000

    2340inf012  32.000000

    2340inf351  33.000000

    2340abe045  33.100000

    Listing 4-19

    Using commas as a delimiter and a decimal point

    ```'
  raw: 'The parsing performance metrics output in verbose mode when using the C parsing
    engine can be useful in determining where the parsing engine is spending its time.
    Listing [4-16](#487367_1_En_4_Chapter.xhtml#PC16) shows an example output. Tokenization
    is the parser breaking up the data into individual values, Type conversion is
    converting each column to a particular type whether that is inferred by pandas
    or explicitly specified, and Parser memory cleanup is the time it took to free
    all the no longer needed memory after the data was read. Depending on these values,
    they may point to areas for improvement, for example, if Tokenization is taking
    a long time, you may be able to speed up performance by specifying additional
    options like how to interpret quotes, spaces, bad lines, and so on. If a lot of
    time is spent in type conversion, it may indicate you have some custom converters
    that are slowing down the process or you may need to specify the dtypes rather
    than letting pandas infer them. If you find a lot of time is spent in memory cleanup,
    you may need to not parse the whole file at once or you may be doing too many
    conversions of the data that lead to a lot of memory duplication and thus a lot
    of memory cleanup.


    ```

    >> grades = pd.read_csv(verbose=True, engine="c")

    Tokenization took: 0.01 ms

    Type conversion took: 0.45 ms

    Parser memory cleanup took: 0.01 ms

    Listing 4-16

    Example output when running in verbose mode with C parsing engine

    ```


    The parse_dates parameter if set to True will attempt to automatically detect
    and convert columns with date formatted strings to datetime objects. Rather than
    just setting it to True however, it’s far better to explicitly list which columns
    should be converted to datetime objects. This parameter lets you explicitly specify
    which columns to convert in the form of a list and even combine multiple columns
    into a single datetime object when it is specified as a list of lists of columns.
    Listing [4-17](#487367_1_En_4_Chapter.xhtml#PC17) shows an example of explicitly
    specifying which columns to convert. Note each datetime object takes up 8 bytes,
    but this is still far less memory than if we didn’t convert it at all.


    ```

    >> data = io.StringIO(

    """

    id,birth,height,weight

    129237,04/10/1999,5.4,126

    123083,07/03/2000,6.1,150

    123087,11/23/1989,4.5,111

    """

    )

    >> df = pd.read_csv(

    data,

    dtype={

    ''id'': np.int32,

    ''height'': np.float16,

    ''weight'': np.int16},

    parse_dates = ["birth"],

    index_col=[0],

    )

    birth        height     weight

    id

    129237         1999-04-10   5.398438   26

    123083         2000-07-03   6.101562   150

    123083         1989-11-23   6.101562   111

    >> df.memory_usage(deep=True)

    Index      24

    birth      24

    height     6

    weight     6

    >> df.dtypes

    age       int8

    height    float16

    weight    datetime64[ns]

    >> df.index.dtype

    dtype(''int64'')

    Listing 4-17

    Explicitly converting certain columns to datetime objects

    ```


    Note Listing [4-17](#487367_1_En_4_Chapter.xhtml#PC17) assumes that there are
    no NaNs or placeholder values in the column. If there are, like in Listing [4-18](#487367_1_En_4_Chapter.xhtml#PC18),
    na_values must be specified to convert all the placeholder values to NaNs; otherwise,
    the column will be an object rather than a datetime because the placeholder values
    will be left as strings.


    ```

    >> data = io.StringIO(

    """

    id,birth,height,weight

    129237,04/10/1999,5.4,126

    123083,unknown,6.1,150

    123087,11/23/1989,4.5,111

    """

    )

    >> df = pd.read_csv(

    data,

    dtype={

    ''id'': np.int32,

    ''height'': np.float16,

    ''weight'': np.int16},

    parse_dates=["birth"],

    na_values=["unknown"],

    index_col=[0],

    )

    birth          height      weight

    id

    129237       1999-04-10     5.398438    26

    123083       NaT            6.101562    150

    123083       1989-11-23     6.101562    111

    >> df.memory_usage(deep=True)

    Index      24

    birth      24

    height     6

    weight     6

    >> df.dtypes

    age             int8

    height          float16

    weight          datetime64[ns]

    >> df.index.dtype

    dtype(''int64'')

    Listing 4-18

    Explicitly converting certain columns to datetime objects and handling NaNs

    ```


    Generally, parse_dates while it’s convenient is counterproductive from a performance
    perspective. It takes time to convert the dates, and once they are converted,
    the data type is not translatable to C. For this reason, it’s recommended to convert
    datetimes to time since the epoch or some simple numeric C-translatable value
    if possible. If you need to work with particular days, months, and years, it might
    even make sense to store those in separate columns.


    There are many other date-specific parameters included in read_csv. The parameter
    infer_datetime_format is enabled by default, so whenever possible, pandas attempts
    to infer the format of any datetime values automatically. The documentation says
    that in some cases this can increase the parsing speed by five to ten times when
    it’s able to detect and use a particular date parsing format.^([⁶](#fn6)) When
    set to True, the parameter keep_date_col keeps both the combined column and the
    original separate date columns if parse_dates specified that multiple date columns
    should be combined together. The date_parser parameter lets you specify a date
    parsing function. The documentation notes this function may be called in several
    different ways ranging from calling it once on each row or passing in all rows
    and columns at once. Since this function is jumping between C and Python, it’s
    advantageous to call it the least amount of times as possible. This means it’s
    best to implement this function to operate on all datetime rows and columns and
    output an array of datetime instances. This function could be an existing parser
    (the default is dateutil.parser.parser), or it could be a custom function. This
    might be useful if you need to do some special timezone handling or the data is
    stored in a special datetime format. Not all countries specify the day before
    the month so pandas provides a dayfirst parameter so you can specify whether the
    day comes first in the dates you are parsing. The parameter cache_dates which
    is enabled by default keeps a cache lookup of the converted dates, so that if
    the same date appears multiple times in the data set, it does not have to run
    the conversion again and can just use the cached value.


    The parameter escapechar lets you escape certain characters. For example, in most
    programing languages, a commonly used escape character is a backslash (\) so it
    may be desirable to escape certain quote characters inside of a quote with a \”
    or element delimiter characters with \,. Listing [4-19](#487367_1_En_4_Chapter.xhtml#PC19)
    illustrates this use case. If the temperature recordings were recorded by a country
    that uses commas as a decimal point delimiter and also uses commas as a CSV element
    delimiter, read_csv will not be able to parse this file with its default configuration
    and will raise a parsing error, “pandas.errors.ParserError: Error tokenizing data.
    C error: Expected 2 fields in line 5, saw 3”. If, instead, the backslash character
    is used to escape all the commas delimiting decimal places (\,), then read_csv
    can be configured in such a way to correctly parse the data.


    ```

    >> import pandas as pd

    >> data = io.StringIO(

    """

    temp, location

    35,234unf923

    32,2340inf012

    33,2340inf351

    33\,1,2340abe045

    """

    )

    >> grades = pd.read_csv(

    data,

    decimal=",",

    escapechar="\\",

    index_col="location",

    )

    temp

    location

    234unf923   35.000000

    2340inf012  32.000000

    2340inf351  33.000000

    2340abe045  33.100000

    Listing 4-19

    Using commas as a delimiter and a decimal point

    ```'
  trans: '

    使用 C 解析引擎时，在详细模式下输出的解析性能指标有助于确定解析引擎的时间消耗位置。清单 4-16 显示了一个示例输出。`Tokenization`是解析器将数据分解为单个值的过程，`Type
    conversion`是将每列转换为特定类型（无论是 pandas 推断的还是显式指定的）的过程，`Parser memory cleanup`是数据读取后释放所有不再需要的内存所花费的时间。根据这些值，它们可能指出需要改进的领域。例如，如果`Tokenization`耗时很长，则可以通过指定附加选项（如如何解释引号、空格、错误行等）来提高性能。如果在类型转换上花费了大量时间，这可能表明您有一些自定义转换器拖慢了速度，或者您可能需要指定`dtypes`而不是让
    pandas 推断它们。如果发现大量时间花在内存清理上，则可能不需要一次解析整个文件，或者您可能对数据进行了过多转换，导致大量内存重复，从而产生大量内存清理工作。


    ```

    >> grades = pd.read_csv(verbose=True, engine="c")

    Tokenization took: 0.01 ms

    Type conversion took: 0.45 ms

    Parser memory cleanup took: 0.01 ms

    Listing 4-16

    Example output when running in verbose mode with C parsing engine

    ```


