    in Listing [6-8](#487367_1_En_6_Chapter.xhtml#PC8) takes about 100 milliseconds.
    But why is a list comprehension so much faster than apply? Don’t they both loop
    in Python? List comprehensions are specially optimized loops within the Python
    interpreter. The bytecode that they translate into more closely resembles a loop
    written in C as they do not load a bunch of specialized Python list attributes.
    What follows is the bytecode for a for loop (Listing [6-9](#487367_1_En_6_Chapter.xhtml#PC9))
    vs. a list comprehension (Listing [6-10](#487367_1_En_6_Chapter.xhtml#PC10)).
    Notice how much simpler and smaller the bytecode is for a list comprehension than
    for a for loop even though they are doing the same thing.


