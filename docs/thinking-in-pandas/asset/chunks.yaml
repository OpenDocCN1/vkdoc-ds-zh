    # 5. Basic Data Transformation in pandas


    The pandas library has a huge API that provides many ways of transforming data.
    In this chapter, we’ll cover some of the most powerful and most popular ways to
    transform data in pandas.


    ## Pivot and pivot table


    Pivot and pivot table are very popular and particularly attractive to beginners
    because they are so powerful. However, their powerfulness comes at a performance
    cost. While pivot is a great tool for initially transforming the DataFrame as
    part of a data normalization step, it should not be used frequently throughout
    the data analysis phase. Listing [5-1](#487367_1_En_5_Chapter.xhtml#PC1) shows
    an example of using pivot table to convert the raw inspection data into an aggregated
    format of restaurants and their average inspection score. Note in Listing [5-1](#487367_1_En_5_Chapter.xhtml#PC1)
    the aggregation function is explicitly specified as np.mean though this is unnecessary
    since np.mean is the default. Pivot is essentially doing a groupby, applying the
    aggregation function as needed, and reorganizing the results into a new table
    format.


    ```

    >> df

    restaurant  location    date       score

    Diner       (4, 2)      02/18      90

    Pandas      (5, 4)      04/18      55

    Diner       (4, 2)      05/18      100

    Pandas      (5, 4)      01/18      76

    >> df = df.pivot_table(

    values=[''score''],

    index=["restaurant","location"],

    aggfunc=np.mean

    )

    >> df

    score

    restaurant  location

    Diner       (4, 2)         95

    Pandas      (5, 4)         66

    Listing 5-1

    Calculating the average inspection score per restaurant with pivot_table

    ```


    There are a couple performance issues in Listing [5-1](#487367_1_En_5_Chapter.xhtml#PC1).
    Pivot table does not have an option to limit memory duplication so it creates
    an entirely new DataFrame each time it is used. If your DataFrame is quite large,
    this can be a big performance hit to your program. Internally, pivot table is
    grouping the data by unique restaurant and location combinations which takes time,
    particularly with a large amount of combinations. If this was being used as part
    of a data normalization step, it would be far better than if it was used many
    times throughout a program as part of data analysis. This is because the performance
    hit of uniquely grouping and copying all that memory would happen only once compared
    to it happening many times throughout the program. It is far better to normalize
    and orient a DataFrame once in such a way that it optimizes all the analysis you
    plan to perform on it than leave it in a somewhat unoptimized raw form and have
    to re-orient it at each analysis step. Note, if instead the DataFrame was already
    uniquely grouped, we could run a groupby to calculate the average score like in
    Listing [5-2](#487367_1_En_5_Chapter.xhtml#PC2) which would be twice as fast.
    We’ll discuss the performance of groupby in depth in Chapter [7](#487367_1_En_7_Chapter.xhtml).
    It is very likely that other analysis needs the data grouped by unique restaurant,
    so the grouping in this example at the very least should be part of the normalization
    step, in which case it becomes unnecessary to use pivot table at all.


    ```

    >> df

    date        score

    restaurant  location

    Diner       (4, 2)     02/18       90

    04/18       55

    Diner       (4, 2)     05/18       100

    01/18       76

    >> df = df[["score"]].groupby(["restaurant","location"]).mean()

    >> df

    restaurant  location     score

    Diner       (4, 2)       95

    Pandas      (5, 4)       66

    Listing 5-2

    Calculating the average inspection score per restaurant with groupby

    ```'
