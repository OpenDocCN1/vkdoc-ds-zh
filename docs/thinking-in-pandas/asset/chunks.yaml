    >> df.index.dtype

    dtype(''int64'')

    >> df.memory_usage()

    Index          16

    birth          16

    height         16

    weight         16

    Listing 4-27

    Loading a JSON with pandas type inference

    ```'
  raw: '## pd.read_json


    The read_json loader parses entirely in C unlike read_csv which may use the Python
    parser under certain conditions.


    The parameter orient defines how the JSON format will be converted into a pandas
    DataFrame. There are six different options: split, records, index, columns, values,
    and table. If the JSON is formatted such that there are columns, data, and an
    index already defined as keys, as is the case in Listing [4-20](#487367_1_En_4_Chapter.xhtml#PC20),
    the split option should be used. It’s also worth noting that the JSON parser is
    particularly picky about spacing including whitespace.


    ```

    >> data = io.StringIO(

    """

    {

    "columns": ["temp"],

    "index": ["234unf923", "340inf351", "234abe045"],

    "data": [[35.2],[32.5],[33.1]],

    }

    """

    )

    >> temperatures = pd.read_json(

    data,

    orient="split",

    )

    temp

    234unf923   35.200000

    340inf351   32.500000

    234abe045   33.100000

    Listing 4-20

    Using orient split

    ```


    If the JSON is formatted such that each value is a row in the data with the column
    names as keys, as is the case in Listing [4-21](#487367_1_En_4_Chapter.xhtml#PC21),
    the records option should be used.


    ```

    >> data = io.StringIO(

    """

    [

    {"location": "234unf923", "temp": 35.2},

    {"location": "340inf351", "temp": 32.5},

    {"location": "234abe045", "temp": 33.1},

    ]

    """

    )

    >> temperatures = pd.read_json(

    data,

    orient="records",

    )

    location     temp

    234unf923    35.200000

    340inf351    32.500000

    234abe045    33.100000

    Listing 4-21

    Using orient records

    ```


    If the JSON is formatted such that each key is the index value and the value of
    each key is a dictionary of the columns and values for the row, as is the case
    in Listing [4-22](#487367_1_En_4_Chapter.xhtml#PC22), the index option should
    be used.


    ```

    >> data = io.StringIO(

    """

    {

    "234unf923": {"temp": 35.2},

    "340inf351": {"temp": 32.5},

    "234abe045": {"temp": 33.1},

    }

    """

    )

    >> temperatures = pd.read_json(

    data,

    orient="index",

    )

    temp

    234unf923   35.200000

    340inf351   32.500000

    234abe045   33.100000

    Listing 4-22

    Using orient index

    ```


    If the JSON is formatted such that each key is the column and each value is a
    dictionary where the key is the index and the value is the column value, as is
    the case in Listing [4-23](#487367_1_En_4_Chapter.xhtml#PC23), the columns option
    should be used.


    ```

    >> data = io.StringIO(

    """

    {

    "temp": {

    "234unf923": 35.2,

    "340inf351": 32.5,

    "234abe045": 33.1,

    },

    }

    """

    )

    >> temperatures = pd.read_json(

    data,

    orient="columns",

    )

    temp

    234unf923   35.200000

    340inf351   32.500000

    234abe045   33.100000

    Listing 4-23

    Using orient columns

    ```


    If the JSON is formatted such that each row is simply represented as a list of
    values, as is the case in Listing [4-24](#487367_1_En_4_Chapter.xhtml#PC24), the
    values option should be used.


    ```

    >> data = io.StringIO(

    """

    [

    ["234unf923", 35.2],

    ["340inf351", 32.5],

    ["234abe045", 33.1],

    ]

    """

    )

    >> temperatures = pd.read_json(

    data,

    orient="values",

    )

    0           1

    0       234unf923   35.200000

    1       340inf351   32.500000

    2       234abe045   33.100000

    Listing 4-24

    Using orient values

    ```


    If the JSON is formatted such that it provides a detailed data schema, as is the
    case in Listing [4-25](#487367_1_En_4_Chapter.xhtml#PC25), the table option should
    be used.


    ```

    >> data = io.StringIO(

    """

    {

    "schema": {

    "fields": [

    {"name": "location", "type": "string"},

    {"name": "temp", "type": "string"},

    ],

    "primaryKey": "location",

    },

    "data": [

    {"location": "234unf923", "temp": 35.2},

    {"location": "340inf351", "temp": 32.5},

    {"location": "234abe045", "temp": 33.1},

    ]

    }

    """

    )

    >> temperatures = pd.read_json(

    data,

    orient="table",

    )

    temp

    location

    234unf923    35.200000

    340inf351    32.500000

    234abe045    33.100000

    Listing 4-25

    Using orient table

    ```


    Similar to read_csv, read_json has a chunksize that lets you read the files in
    chunks at a time. This only is permitted however if the lines option is also set
    to True, meaning the JSON format is oriented as records without the list brackets.
    Listing [4-26](#487367_1_En_4_Chapter.xhtml#PC26) demonstrates this.


    ```

    >> data = io.StringIO(

    """

    {"location": "234unf923", "temp": 35.2}

    {"location": "340inf351", "temp": 32.5}

    {"location": "234abe045", "temp": 33.1}

    """

    )

    >> temperatures = pd.DataFrame({})

    >> reader = pd.read_json(

    data,

    lines=True,

    chunksize=2,

    )

    >> for chunk in reader:

    temperatures = temperatures.append(process(chunk))

    >> temperatures

    location       temp

    234unf923      35.200000

    340inf351      32.500000

    234abe045      33.100000

    Listing 4-26

    Loading the file in chunks

    ```


    By default, the JSON loader determines whether certain columns are date-like based
    on the column name unlike other readers that look at the values. It accepts a
    convert_dates parameter which can be a list of column names or a Boolean. If it’s
    set to True, it converts columns that end with _at or _time, begin with timestamp,
    or are named modified or date into datetimes. To disable automatic detection of
    date columns, you can set keep_default_dates to False.


    By default, the JSON loader will try to infer the type of each column and axis,
    unless orient is set to table, in which case the type is provided as part of the
    JSON schema. Just like reading a CSV file, if the types are not specified in the
    JSON file, it saves a lot of memory to provide them. Listing [4-27](#487367_1_En_4_Chapter.xhtml#PC27)
    shows what the memory footprint might be of a JSON file being loaded without types
    specified vs. Listing [4-28](#487367_1_En_4_Chapter.xhtml#PC28) which shows the
    memory footprint of the same JSON file with types specified. Note in Listing [4-28](#487367_1_En_4_Chapter.xhtml#PC28)
    where types are explicitly specified, the memory of the resulting DataFrame decreased
    by about 40%.


    ```

    >> data = io.StringIO(

    """

    {

    "birth": {

    "129237": "04/10/1999",

    "123083": "05/18/1989",

    },

    "height": {

    "129237": 5.4,

    "123083": 6.1,

    },

    "weight": {

    "129237": 126,

    "123083": 130,

    },

    }

    """

    )

    >> patient_info = pd.read_json(

    data,

    orient="columns",

    convert_dates=["birth"],

    dtype={"height": np.float16, "weight": np.int16},

    )

    birth          height  weight

    129237     1999-04-10     5.4     126

    123083     1989-05-18     6.1     130

    >> df.dtypes

    birth          datetime64[ns]

    height         float16

    weight         int16

    >> df.index.dtype

    dtype(''int64'')

    >> df.memory_usage()

    Index          16

    birth          16

    height         4

    weight         4

    Listing 4-28

    Explicitly specifying the type when loading a JSON

    ```


    ```

    >> data = io.StringIO(

    """

    {

    "birth": {

    "129237": "04/10/1999",

    "123083": "05/18/1989",

    },

    "height": {

    "129237": 5.4,

    "123083": 6.1,

    },

    "weight": {

    "129237": 126,

    "123083": 130,

    },

    }

    """

    )

    >> patient_info = pd.read_json(

    data,

    orient="columns",

    )

    birth          height  weight

    129237     04/10/1999     5.4     126

    123083     05/18/1989     6.1     130

    >> df.dtypes

    birth          object

    height         float64

    weight         int64

    >> df.index.dtype

    dtype(''int64'')

    >> df.memory_usage()

    Index          16

    birth          16

    height         16

    weight         16

    Listing 4-27

    Loading a JSON with pandas type inference

    ```'
