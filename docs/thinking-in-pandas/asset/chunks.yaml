- fmt: "### `pd.read_sql`, `pd.read_sql_table`, and `pd.read_sql_query`\n\nThe `pd.read_sql`\
    \ loader is a wrapper around `read_sql_table` and `read_sql_query`. Depending\
    \ on the parameters passed to it, it calls one of those two functions underneath.\
    \ It also has built-in support for SQLAlchemy.\n\n`SQLAlchemy` is a very popular\
    \ Object Relational Mapper library, also known as an ORM. The pandas SQL reader\
    \ also supports talking directly to DBAPI which is a lower-level database library\
    \ that `SQLAlchemy` depends on. While DBAPI is limited within pandas to SQLite3,\
    \ `SQLAlchemy` can talk to all kinds of relational databases so there’s no need\
    \ to rewrite all your SQL queries when switching databases. ORMs are quite popular\
    \ in the application development space as they allow you to map your database\
    \ tables to objects or classes in Python. This is nice because you can track your\
    \ database table definitions inside your codebase. You can define your database\
    \ tables as classes and then with a simple command add them to your database.\
    \ You can also modify existing database tables via migration scripts using migration\
    \ libraries like Alembic, for example, which let you roll forward and roll back\
    \ database changes with little risk of unrecoverable production database mishaps.\
    \ When building out table definitions, you can also specify things like the conversion\
    \ of column types between Python and the database. `SQLAlchemy` is also nice because\
    \ it abstracts the SQL query into more human-readable query language with easily\
    \ parameterized expressions, like in Listing [4-29](#487367_1_En_4_Chapter.xhtml#PC29).\n\
    \n```\ncur.execute(\n\"\"\"\nSELECT * FROM temperature_readings\nWHERE temperature_readings.temp\
    \ > 45\n\"\"\"\n)\nsession.query(TemperatureReadings).filter(\ntemp > 45\n)\n\
    Listing 4-29\nUsing a raw SQL string query vs. the SQLAlchemy ORM to generate\
    \ a query\n```\n\nListing [4-30](#487367_1_En_4_Chapter.xhtml#PC30) shows an example\
    \ of how you might build a database and insert data into it. In this example,\
    \ we are creating a user table with two columns, `id` and `name`, and inserting\
    \ a new user with an `id` of zero and name Eric into that table. Note two different\
    \ URLs are defined in the code, the one in use connects to sqlite and the other\
    \ connects to a local Postgres database instance.\n\n```\nfrom sqlalchemy import\
    \ create_engine\nfrom sqlalchemy.orm import sessionmaker\nfrom sqlalchemy import\
    \ Column, Integer, String\nfrom sqlalchemy.ext.declarative import declarative_base\n\
    Base = declarative_base()\nSQLITE_URL = \"sqlite://\"\nPOSTGRES_URL = \"postgresql://postgres@localhost:5432\"\
    \nclass User(Base):\n    __tablename__ = 'user'\n    id = Column(Integer, primary_key=True)\n\
    \    name =  Column(String(50))\nengine = create_engine(SQLITE_URL)\nSession =\
    \ sessionmaker(bind=engine)\ndef create_tables():\n    Base.metadata.create_all(engine)\n\
    def add_user():\n    session = Session()\n    user = User(id=0, name=\"Eric\"\
    )\n    session.add(user)\n    session.commit()\n    session.close()\n>> create_tables()\n\
    >> add_user()\nListing 4-30\nCreating tables in a postgres database and adding\
    \ data to it using SQLAlchemy\n```\n\nListing [4-31](#487367_1_En_4_Chapter.xhtml#PC31)\
    \ provides a simple `docker-compose.yml` file which will spin up a local Postgres\
    \ database on your machine using the command in Listing [4-32](#487367_1_En_4_Chapter.xhtml#PC32).\
    \ Note this database is configured to write the data to disk so you can kill the\
    \ docker container at any time and the data will persist in the `postgres-data`\
    \ directory and be there the next time you spin up the docker container.\n\n```\n\
    >> docker-compose up -d\nListing 4-32\nStarting the Postgres database\n```\n\n\
    ```\nversion: '3'\nservices:\n  postgres:\n    image: postgres:9.4-alpine\n  \
    \  ports:\n      - '127.0.0.1:5432:5432'\n    volumes:\n      - ./postgres-data:/var/lib/postgresql/data\n\
    Listing 4-31\nThe contents of the docker-compose.yml that will create a local\
    \ Postgres database\n```\n\nThe SQL loaders generally can either load the whole\
    \ table or load parts of the table based on a query. Although the SQL loaders\
    \ accept a SQLAlchemy engine, they only accept a select statement rather than\
    \ a query object. This means while you can use `SQLAlchemy`’s query API, you must\
    \ convert it to a selectable before passing it into the loader as shown in Listing\
    \ [4-34](#487367_1_En_4_Chapter.xhtml#PC34). A selectable is essentially the raw\
    \ SQL query string. Listing [4-33](#487367_1_En_4_Chapter.xhtml#PC33) shows an\
    \ example of how you would load all the user data from the database into a DataFrame,\
    \ while Listing [4-34](#487367_1_En_4_Chapter.xhtml#PC34) shows how you might\
    \ load the user with `id=0` into a DataFrame.\n\n```\n>> select_user0 = session.query(Patient).filter_by(id=0).selectable\n\
    >> pd.read_sql(\n    sql=select_user0,\n    con=engine,\n    columns=[\"id\",\
    \ \"name\"],\n)\n   id   name\n0   0    Eric\nListing 4-34\nLoading the user with\
    \ id=0 into a DataFrame using read_sql\n```\n\n```\n>> pd.read_sql(\n    sql=User.__tablename__,\n\
    \    con=engine,\n    columns=[\"id\", \"name\"],\n)\n   id   name\n0   0    Eric\n\
    Listing 4-33\nLoading all the users into a DataFrame using read_sql\n```\n\nThe\
    \ SQL loaders have similar options as the other loaders we’ve looked at, for example,\
    \ loading the data chunks at a time or datetime conversion. However, there are\
    \ differences as well. Unlike some of the other loaders we’ve looked at, the SQL\
    \ loaders do not have an option for data type specification. This often poses\
    \ a problem for pandas users working with databases as they may store a normalized\
    \ version of the data in a database and then wish to load it back out only to\
    \ find the data types are not the same. If you run into this situation, `SQLAlchemy`\
    \ and some custom loading code can help. `SQLAlchemy` provides a custom types\
    \ option which lets you convert between the database type and the Python type.\
    \ As we’ve seen with other loaders where the types are not explicitly specified,\
    \ pandas will store the `id` column as an `int64`. Listing [4-35](#487367_1_En_4_Chapter.xhtml#PC35)\
    \ shows an example of how we might specify the Python type for the integer `id`\
    \ column as an `int32` instead of a more generic and larger integer type. Using\
