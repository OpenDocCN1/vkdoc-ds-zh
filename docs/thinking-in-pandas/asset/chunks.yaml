- fmt: '# Loading and Normalizing Data


    Raw data comes in many forms: CSV, JSON, SQL, HTML, and so on. `pandas` provides
    data input and output functions for loading data into a `pandas` DataFrame and
    outputting data from a `pandas` DataFrame into various common formats. In this
    chapter, we’ll deep dive into some of these input functions and explore the various
    loading and normalization options they provide.


    The functions that load data into `pandas` provide a wide range of normalization
    and optimization capabilities that can improve the performance of a program, even
    to the point where it means the difference between being able to load the data
    into `pandas` and running out of memory. Each input function is different however,
    so it really depends on the input/output format that you are working with and
    it’s always worthwhile to check the documentation of the particular functions
    you are using. Table 4-1 lists the various input and output functions that `pandas`
    supports.


    **Table 4-1**. IO `pandas` data functions


    | Input | Output |

    | --- | --- |

    | `read_csv` | `to_csv` |

    | `read_excel` | `to_excel` |

    | `read_hdf` | `to_hdf` |

    | `read_sql` | `to_sql` |

    | `read_json` | `to_json` |

    | `read_html` | `to_html` |

    | `read_stata` | `to_stata` |

    | `read_clipboard` | `to_clipboard` |

    | `read_pickle` | `to_pickle` |


    Chapter 3 mentioned several very good reasons for normalizing data; it can save
    memory and optimize data analysis. Normalizing data can gain you the benefit of
    utilizing Python’s string cache or run computations in C rather than Python by
    choosing a C-compatible data type. Many of the preceding input functions provide
    options for various ways of normalizing data as part of the load process. Instead
    of loading the data with a large memory footprint and then removing unnecessary
    columns or casting columns to a smaller data type to reduce the memory footprint
    after loading, many of the input functions allow you to remove and specify the
    types of columns during load. This means you can load more data without running
    out of memory, and the data load and normalization process is faster since you
    are doing two things at once rather than consecutively loading and then normalizing.


    Operations that result in the creation and elimination of data can be expensive
    because they require large chunks of memory to be allocated and deallocated. Converting
    (more commonly referred to as casting) data from one type to another is also expensive
    as it requires large chunks of memory to be allocated and deallocated. Working
    with large chunks of memory often means cache misses and a lot of time is spent
    in IO moving things from memory that is farther away from the CPU to memory that
    is closer to the CPU (such as from main memory to the first level cache, for example).
    Thus, while you may think that memory has nothing to do with processing speed,
    it can actually have a huge impact on the runtime.


    In these input functions, `pandas` typically infers the data type upon loading
    the data. While this can be quite nice at first and seem like a fantastic feature
    that you should surely always take advantage of, it also has a large and often
    negative impact on performance. Often the data being loaded has not yet been normalized,
    and numeric columns may contain non-numeric values, for example, that force the
    inferred data type to be an object, the largest data type it can be. Many of the
    data load functions allow you to specify the type of the columns and convert place
    holder values to `NaN`s which can prevent `pandas` from inferring the wrong data
    type.


    ## `pd.read_csv`


    The `pandas` CSV loader `pd.read_csv` is the most widely used of the loaders and
    by far the most complete in terms of data normalization options. Because the Python
    standard library has a built-in CSV loader and the `pandas` loader has some fairly
    fancy Pythonic options, it has two different parsing engines: the C engine and
    the Python engine. As you can probably guess by now, the C engine is more performant
    than the Python engine, but depending on what options you specify, you may have
    no choice but to use the Python engine for parsing. Thus, it’s advisable to be
    careful which options you use and the values you provide to those options so that
    you guarantee you are using the C parsing engine and get the best load performance
    possible. The CSV loader has an explicit `engine` parameter that lets you force
    the parsing engine to be Python or C. Explicitly always specifying this parameter
    when loading is an easy way to guarantee the CSV loader uses the C engine for
    parsing. If you specify another Python parser–specific option while `engine` is
    explicitly set to `''c''`, the CSV loader will throw an exception informing you
    that particular setting is not compatible with the C parsing engine as shown in
    Listing 4-1.


    ```

    >> data = io.StringIO(

    """

    id,age,height,weight

    129237,32,5.4,126

    123083,20,6.1,145

    """

    )

    >> df = pd.read_csv(data, sep=None, engine="c")

    ValueError: the ''c'' engine does not support sep=None

    with delim_whitespace=False

    ```


    **Listing 4-1**. `read_csv` will raise a `ValueError` when `engine` is set to
    `''c''` and other settings are not compatible


    Another reason to use the C parsing engine is that it supports a higher precision
    of floating points via the `float_precision` parameter. Generally, the Python
    engine uses double floating point precision, and the C engine uses its own low-level
    string to decimal parser that is comparable to the Python engine. Both can result
    in floating point rounding errors such as cases where `-15.361` and `-15.3610`
    are not equal. However, the C parsing engine supports additional options `high`
    precision and `round_trip` precision. If you want your floats to be as accurate
    as possible, use the `round_trip` precision option. This is a common problem with
    floating points, and so, an alternative approach, often used when handling financial
    data, is to split a float into two integers: one integer represents the number
    above the decimal and the other represents the number below the decimal.


    The first parameter to the `read_csv` function is `filepath_or_buffer`. Typically,
    the path to the CSV file is passed here, but note for unit testing purposes and
    for example purposes in the rest of this chapter, a `StringIO` object can be passed
    in its place. It also accepts a URL path if the CSV file is hosted by a third-party
    application for example. The documentation officially reads:


    > *By file-like object, we refer to objects with a `read()` method, such as a
    file handler (e.g. via builtin `open` function) or `StringIO`.*


    This file-like object is another Python-ism and is commonly known as duck typing.
    This term is born of the idiom “If it walks like a duck and quacks like a duck,
    it’s a duck.” In this case, if it has a `read` method, it is a file-like object.
    This is why `StringIO` can also be substituted for a file handler since it also
    has a `read` method. `StringIO` is a nice substitute in unit tests since it allows
    you to pretend it’s a file without actually having to include a `test.csv` for
    validating your loader works as expected.'
  raw: '# 4. Loading and Normalizing Data


    Raw data comes in many forms: CSV, JSON, SQL, HTML, and so on. pandas provides
    data input and output functions for loading data into a pandas DataFrame and outputting
    data from a pandas DataFrame into various common formats. In this chapter, we’ll
    deep dive into some of these input functions and explore the various loading and
    normalization options they provide.


    The functions that load data into pandas provide a wide range of normalization
    and optimization capabilities that can improve the performance of a program, even
    to the point where it means the difference between being able to load the data
    into pandas and running out of memory. Each input function is different however,
    so it really depends on the input/output format that you are working with and
    it’s always worthwhile to check the documentation of the particular functions
    you are using. Table [4-1](#487367_1_En_4_Chapter.xhtml#Tab1) lists the various
    input and output functions that pandas supports.


    Table 4-1


    IO pandas data functions


    | Input | Output |

    | --- | --- |

    | read_csv | to_csv |

    | read_excel | to_excel |

    | read_hdf | to_hdf |

    | read_sql | to_sql |

    | read_json | to_JSON |

    | read_html | to_html |

    | read_stata | to_stata |

    | read_clipboard | to_clipboard |

    | read_pickle | to_pickle |


    Chapter [3](#487367_1_En_3_Chapter.xhtml) mentioned several very good reasons
    for normalizing data; it can save memory and optimize data analysis. Normalizing
    data can gain you the benefit of utilizing Python’s string cache or run computations
    in C rather than Python by choosing a C-compatible data type. Many of the preceding
    input functions provide options for various ways of normalizing data as part of
    the load process. Instead of loading the data with a large memory foot print and
    then removing unnecessary columns or casting columns to a smaller data type to
    reduce the memory foot print after loading, many of the input functions allow
    you to remove and specify the types of columns during load. This means you can
    load more data without running out of memory, and the data load and normalization
    process is faster since you are doing two things at once rather than consecutively
    loading and then normalizing.


    Operations that result in the creation and elimination of data can be expensive
    because they require large chunks of memory to be allocated and deallocated. Converting
    (more commonly referred to as casting) data from one type to another is also expensive
    as it requires large chunks of memory to be allocated and deallocated. Working
    with large chunks of memory often means cache misses and a lot of time is spent
    in IO moving things from memory that is farther away from the CPU to memory that
    is closer to the CPU (such as from main memory to the first level cache, for example).
    Thus, while you may think that memory has nothing to do with processing speed,
    it can actually have a huge impact on the runtime.


    In these input functions, pandas typically infers the data type upon loading the
    data. While this can be quite nice at first and seem like a fantastic feature
    that you should surely always take advantage of, it also has a large and often
    negative impact on performance. Often the data being loaded has not yet been normalized,
    and numeric columns may contain non-numeric values, for example, that force the
    inferred data type to be an object, the largest data type it can be. Many of the
    data load functions allow you to specify the type of the columns and convert place
    holder values to NaNs which can prevent pandas from inferring the wrong data type.


    ## pd.read_csv


    The pandas CSV loader pd.read_csv is the most widely used of the loaders and by
    far the most complete in terms of data normalization options. Because the Python
    standard library has a built-in CSV loader and the pandas loader has some fairly
    fancy Pythonic options, it has two different parsing engines: the C engine and
    the Python engine. As you can probably guess by now, the C engine is more performant
    than the Python engine, but depending on what options you specify, you may have
    no choice but to use the Python engine for parsing. Thus, it’s advisable to be
    careful which options you use and the values you provide to those options so that
    you guarantee you are using the C parsing engine and get the best load performance
    possible. The CSV loader has an explicit engine parameter that lets you force
    the parsing engine to be Python or C. Explicitly always specifying this parameter
    when loading is an easy way to guarantee the CSV loader uses the C engine for
    parsing. If you specify another Python parser–specific option while engine is
    explicitly set to ‘c’, the CSV loader will throw an exception informing you that
    particular setting is not compatible with the C parsing engine as shown in Listing
    [4-1](#487367_1_En_4_Chapter.xhtml#PC1).


    ```

    >> data = io.StringIO(

    """

    id,age,height,weight

    129237,32,5.4,126

    123083,20,6.1,145

    """

    )

    >> df = pd.read_csv(data, sep=None, engine="c")

    ValueError: the ''c'' engine does not support sep=None

    with delim_whitespace=False

    Listing 4-1

    read_csv will raise a ValueError when engine is set to ‘c’ and other settings
    are not compatible

    ```


    Another reason to use the C parsing engine is that it supports a higher precision
    of floating points via the float_precision parameter. Generally, the Python engine
    uses double floating point precision, and the C engine uses its own low-level
    string to decimal parser that is comparable to the Python engine. Both can result
    in floating point rounding errors such as cases where –15.361 and –15.3610 are
    not equal. However, the C parsing engine supports additional options high precision
    and round-trip precision. If you want your floats to be as accurate as possible,
    use the round-trip precision option. This is a common problem with floating points,
    and so, an alternative approach, often used when handling financial data, is to
    split a float into two integers: one integer represents the number above the decimal
    and the other represents the number below the decimal.


    The first parameter to the read_csv function is filepath_or_buffer. Typically,
    the path to the CSV file is passed here, but note for unit testing purposes and
    for example purposes in the rest of this chapter, a StringIO object can be passed
    in its place. It also accepts a URL path if the CSV file is hosted by a third-party
    application for example. The documentation officially reads^([⁵](#fn5))


    *By file-like object, we refer to objects with a* *read() method* *, such as a
    file handler (e.g. via builtin open function) or StringIO.*


    This file-like object is another Python-ism and is commonly known as duck typing
    . This term is born of the idiom “If it walks like a duck and quacks like a duck,
    it’s a duck.” In this case, if it has a read method, it is a file-like object.
    This is why StringIO can also be substituted for a file handler since it also
    has a read method. StringIO is a nice substitute in unit tests since it allows
    you to pretend it’s a file without actually having to include a test.csv for validating
    your loader works as expected.'
  trans: '

    # 加载与标准化数据


    原始数据形式多样：CSV、JSON、SQL、HTML 等等。`pandas` 提供了数据输入输出函数，用于将数据加载到 `pandas` DataFrame
    中，以及将 `pandas` DataFrame 中的数据输出为各种常见格式。在本章中，我们将深入探讨其中一些输入函数，并探索它们提供的多种加载与标准化选项。


    用于将数据加载到 `pandas` 中的函数提供了广泛的标准化和优化功能，这些功能可以提升程序性能，甚至决定了能否成功将数据加载到 `pandas` 中，还是因内存耗尽而失败。然而，每个输入函数都有所不同，因此这完全取决于你正在处理的输入/输出格式，并且查阅你所使用的特定函数的文档总是值得的。表
    4-1 列出了 `pandas` 支持的各种输入和输出函数。


    **表 4-1**。IO `pandas` 数据函数


    | 输入 | 输出 |

    | --- | --- |

    | `read_csv` | `to_csv` |

    | `read_excel` | `to_excel` |

    | `read_hdf` | `to_hdf` |

    | `read_sql` | `to_sql` |

    | `read_json` | `to_json` |

    | `read_html` | `to_html` |

    | `read_stata` | `to_stata` |

    | `read_clipboard` | `to_clipboard` |

    | `read_pickle` | `to_pickle` |


    第 3 章提到了几个进行数据标准化的充分理由：它可以节省内存并优化数据分析。标准化数据可以让你利用 Python 的字符串缓存，或者通过选择与 C 兼容的数据类型，在
    C 语言环境中而非 Python 环境中运行计算，从而获益。上述许多输入函数都提供了在加载过程中对数据进行标准化处理的各种选项。许多输入函数允许你在加载时移除列或指定列的类型，而不是先用大的内存占用加载数据，然后在加载后再移除不必要的列或将列转换为更小的数据类型以减少内存占用。这意味着你可以加载更多数据而不会耗尽内存，并且数据加载和标准化过程更快，因为你是同时进行这两项操作，而不是先顺序加载再标准化。


    导致数据创建和删除的操作代价可能很高，因为它们需要分配和释放大块内存。将数据从一种类型转换为另一种类型（通常称为类型转换）同样代价高昂，因为它需要分配和释放大块内存。处理大块内存通常意味着缓存未命中，并且大量时间会花费在
    IO 上，即把数据从离 CPU 较远的内存移动到离 CPU 较近的内存（例如，从主内存移动到一级缓存）。因此，尽管你可能认为内存与处理速度无关，但它实际上会对运行时间产生巨大影响。


    在这些输入函数中，`pandas` 通常会在加载数据时推断数据类型。虽然一开始这看起来很不错，似乎是一个你总是应该利用的绝佳功能，但它也会对性能产生巨大且通常是负面的影响。通常，正在加载的数据尚未标准化，例如，数字列可能包含非数字值，这迫使推断出的数据类型成为对象类型，即它能容纳的最大数据类型。许多数据加载函数允许你指定列的类型，并将占位值转换为
    `NaN`，这可以防止 `pandas` 推断出错误的数据类型。


    ## `pd.read_csv`


    `pandas` 的 CSV 加载器 `pd.read_csv` 是使用最广泛的加载器，并且在数据标准化选项方面也是迄今为止最完备的。由于 Python 标准库内置了一个
    CSV 加载器，并且 `pandas` 加载器有一些相当花哨的 Python 式选项，因此它有两个不同的解析引擎：C 引擎和 Python 引擎。正如你现在可能猜到的，C
    引擎的性能优于 Python 引擎，但根据你指定的选项，你可能别无选择，只能使用 Python 引擎进行解析。因此，建议谨慎使用哪些选项以及向这些选项提供哪些值，以确保你使用的是
    C 解析引擎，并获得最佳的加载性能。CSV 加载器有一个明确的 `engine` 参数，允许你强制将解析引擎设置为 Python 或 C。在加载时始终显式指定此参数是保证
    CSV 加载器使用 C 引擎进行解析的一种简单方法。如果你在 `engine` 明确设置为 `''c''` 的同时指定了另一个 Python 解析器特有的选项，CSV
    加载器将抛出一个异常，告知你该特定设置与 C 解析引擎不兼容，如代码清单 4-1 所示。


    ```

    >> data = io.StringIO(

    """

    id,age,height,weight

    129237,32,5.4,126

    123083,20,6.1,145

    """

    )

    >> df = pd.read_csv(data, sep=None, engine="c")

    ValueError: the ''c'' engine does not support sep=None

    with delim_whitespace=False

    ```


    **代码清单 4-1**。当 `engine` 设置为 `''c''` 且其他设置不兼容时，`read_csv` 会引发 `ValueError` 异常


    使用 C 解析引擎的另一个原因是它通过 `float_precision` 参数支持更高精度的浮点数。通常，Python 引擎使用双浮点精度，而 C 引擎使用其自己的底层字符串到十进制数的解析器，该解析器与
    Python 引擎相当。两者都可能导致浮点数舍入错误，例如 `-15.361` 和 `-15.3610` 不相等的情况。然而，C 解析引擎还支持额外的 `high`
    精度和 `round_trip` 精度选项。如果你希望浮点数尽可能精确，请使用 `round_trip` 精度选项。这是浮点数常见的问题，因此，在处理财务数据时经常使用的一种替代方法是将浮点数拆分为两个整数：一个整数表示小数点前的数字，另一个整数表示小数点后的数字。


    `read_csv` 函数的第一个参数是 `filepath_or_buffer`。通常，这里会传入 CSV 文件的路径，但请注意，出于单元测试的目的以及本章其余部分的示例目的，可以传入一个
    `StringIO` 对象来代替。如果 CSV 文件由第三方应用程序托管，它还接受一个 URL 路径。文档的官方描述如下：


    > *所谓类文件对象，我们指的是具有 `read()` 方法的对象，例如文件句柄（例如，通过内置的 `open` 函数获取）或 `StringIO`。*


    这种类文件对象是另一种 Python 特性，通常被称为鸭子类型。这个术语源于一句习语：“如果它走路像鸭子，叫声像鸭子，那么它就是鸭子。”在这种情况下，如果它有一个
    `read` 方法，那么它就是一个类文件对象。这就是为什么 `StringIO` 也可以替代文件句柄，因为它也有一个 `read` 方法。`StringIO`
    在单元测试中是一个很好的替代品，因为它允许你假装它是一个文件，而无需实际包含一个 `test.csv` 来验证你的加载器是否按预期工作。

    '
- fmt: '# `read_csv` 参数详解


    `read_csv` 提供了 `sep` 参数，用于指定分隔数据的字符。默认值为逗号。请注意，`sep` 将长度超过一个字符的值（`\s+` 除外）视为正则表达式。在此使用复杂分隔符可能会强制使用
    Python 解析引擎而非 C 引擎，因此建议尽可能使用单字符分隔符，不要指定复杂的正则表达式。参数 `delim_whitespace` 也可以设置为 `True`，作为设置
    `sep="\s+"` 的替代方案，专门用于表示空格分隔的文件。`sep` 参数也可以设置为 `None`，此时将使用 Python 解析引擎，并自动检测分隔符。`skipinitialspace`
    参数可用于忽略分隔符周围的空格。默认情况下此项是禁用的，因此如果文件中分隔符之间存在空格，则需要将此参数设置为 `True`。列表 [4-2](#487367_1_En_4_Chapter.xhtml#PC2)
    演示了如何结合使用 `sep` 和 `skipinitialspace` 来配置加载非逗号分隔的数据。


    ```

    >> data = io.StringIO(

    """

    id| age| height| weight

    129237| 32| 5.4| 126

    123083| 20| 6.1| 145

    """

    )

    >> pd.read_csv(data, sep="|", skipinitialspace=True)

    idageheightweight

    0129237325.4126

    1123083206.1145

    Listing 4-2

    Loading non-comma-delimited data

    ```


    `usecols` 参数用于缩小要加载的列的范围。CSV 文件中可能存在您不关心的列，因此这是一种在加载时高效删除它们的方法，而不是加载所有数据后再移除。请注意，`usecols`
    也可以是一个函数，该函数以列名作为输入，输出一个布尔值，指示在加载时是包含该列还是丢弃它。然而，使用函数不太理想，因为它需要在 C 解析引擎和自定义函数之间进行调用，这会降低加载速度。列表
    [4-3](#487367_1_En_4_Chapter.xhtml#PC3) 展示了使用 `usecols` 在加载时删除 `id` 和 `age` 列的示例。


    ```

    >> data = io.StringIO(

    """

    id,age,height,weight

    129237,32,5.4,126

    123083,20,6.1,145

    """

    )

    >> pd.read_csv(data, usecols=["height", "age"])

    heightweight

    05.4126

    16.1145

    Listing 4-3

    Eliminating columns during load

    ```


    `skiprows` 参数允许您跳过文件中的某些行。在最简单的形式中，它可以用来跳过文件中的前 `n` 行；然而，它也可以通过指定要跳过的索引列表来跳过特定的行。它也可以是一个函数，该函数接受行索引，如果该行应被跳过则返回
    `True`。请注意，如果在此处传递了一个函数，将会导致 C 解析引擎和 `skiprows` Python 函数之间的频繁切换，这可能会在解析大数据集时导致显著的性能下降。因此，建议将
    `skiprows` 保持为简单的整数或列表值。


    `skipfooter` 参数允许您指定要跳过的文件末尾行数。文档指出，C 解析引擎不支持此参数。由于 Python 引擎使用 Python CSV 解析器，解析器运行后，文件的最后几行会被丢弃。如果您深入思考这个问题，就会发现这是有道理的：解析器如何在不事先知道文件有多少行的情况下知道要跳过哪些行（这需要先解析文件）？这种行为对某些用户来说可能有些意外，例如，当他们试图主动避免文件中的某些行（因为这些行会破坏解析器）时，却发现解析器仍在尝试解析他们配置为跳过的那些行。如果您在自己的程序中遇到这种情况，`nrows`
    是一个不错的替代方案。列表 [4-4](#487367_1_En_4_Chapter.xhtml#PC4) 演示了一个即使加载器配置了跳过某行，仍然遇到解析错误的示例。


    ```

    import pandas as pd

    data = io.StringIO(

    """

    student_id, grade

    1045,"a"

    2391,"b"

    8723,"c"

    1092,"a"

    """

    )

    try:

    grades = pd.read_csv(

    data,

    skipfooter=1,

    )

    except pd.errors.ParserError as e:

    pass

    Listing 4-4

    Encountering a parsing error when using skipfooter

    ```


    `comment` 参数用于指定表示注释的字符，该字符之后的行内容将被忽略。这是在解析之前手动过滤掉某些行的好策略。如果您注释掉某行，则该行不会包含在数据集中。您也可以考虑将
    `error_bad_lines` 设置为 `False`。请注意，默认情况下，pandas 仍会对每个错误行发出警告，因此如果您也希望禁用警告，可以将 `warn_bad_lines`
    设置为 `False`。


    默认情况下，`read_csv` 会推断表头或列名，并且数据的第一行被视为表头。使用 `header` 参数，您可以指定哪些行号应被视为列（如果数据包含多级列）。类似地，使用
    `index_col`，您可以通过列索引指定哪些列应被视为多层索引的一部分。在列表 [4-5](#487367_1_En_4_Chapter.xhtml#PC5)
    中，一个多层索引、多级列的 `DataFrame` 使用 pandas 的 `to_csv` 函数被转储为 CSV 文件。数据包含关于茄科植物（nightshades）科和种的信息。索引包含科和种的
    ID，而列包含实际名称。在这里，前两行包含多级列数据，因此 `header` 设置为 `[0,1]`；前两列是多层索引，因此 `index_col` 设置为
    `[0,1]`。


    ```

    >> data = io.StringIO(

    """

    family,,nightshade,nightshade,nightshade

    species,,tomatoe,deadly-nightshade,potato

    family_id,species_id,,,

    61248,129237,1,0,0

    61248,123083,0,1,0

    61248,123729,0,0,1

    """

    )

    >> df = pd.read_csv(data, header=[0,1], index_col=[0,1])

    family                nightshade

    species               tomatoes    deadly-nightshade potato

    family_id  species_id

    61248      12937      1           0                 0

    61248      123083     0           1                 0

    61248      123729     0           0                 1

    Listing 4-5

    Example of loading a multi-index multi-level column DataFrame

    ```


    如果启用了 `squeeze` 参数，当 CSV 文件中只有一列时，`read_csv` 将返回一个 `Series` 而不是 `DataFrame`。当您需要从多个来源加载数据并将其合并到一个
    `DataFrame` 中时，这非常有用。如果数据被加载到一个 series 中，您可以简单地将其作为新列添加到现有的 `DataFrame` 中，如列表
    [4-6](#487367_1_En_4_Chapter.xhtml#PC6) 所示。


    ```

    import pandas as pd

    site_data = pd.read_csv(''site1.csv'')

    site_data[''site2''] = pd.read_csv(''site2.csv'', squeeze=True)

    Listing 4-6

    Example of using squeeze

    ```


    `dtype` 参数允许您为数据中的每一列指定类型。如果未指定此参数，`read_csv` 将尝试推断数据类型，这通常会导致推断的类型为 `object`，这是数据类型中占用空间最大的类型。在加载时指定
    `dtype` 可以带来巨大的性能提升，但这意味着您需要在加载时对数据集中的列有一定了解。如果您不确定数据具体是什么样，直到查看数据为止，您可以考虑先加载数据的表头或使用
    `nrows` 加载前几行，确定列类型，然后再使用指定的适当类型加载整个数据文件。


    ```

    >> data = io.StringIO(

    """

    id,age,height,weight

    129237,32,5.4,126

    123083,20,6.1,145

    """

    )

    >> df = pd.read_csv(data, index_col=[0])

    age    height    weight

    id

    129237         32     5.398438  126

    123083         20     6.101562  145

    >> df.memory_usage(deep=True)

    Index     16

    age       16

    height    16

    weight    16

    >> df.dtypes

    age          int64

    height       float64

    weight       int64

    >> df.index.dtype

    dtype(''int64'')

    Listing 4-7

    Example of not specifying the types of the columns when loading

    ```'
  raw: 'read_csv provides a sep parameter which specifies the character(s) used to
    delineate the data. The default is a comma. Note sep treats any values longer
    than one character with the exception of \s+ as regular expressions. The use of
    complex delimiters here can force the use of the Python parsing engine instead
    of C, and for that reason, it is advisable to use single-character delimiters
    when possible and not specify complex regular expressions. The parameter delim_whitespace
    may also be set to True as an alternative to setting sep= “\s+”, specifically
    to denote whitespace file delineation. The sep parameter can also be set to None,
    in which case the Python parsing engine will be used and it will automatically
    detect the delimiter. The skipinitialspace parameter can be used to ignore spaces
    surrounding the delimiter. By default, this is disabled, so if there are spaces
    between the delimiters in your file, you will need to set this to True. Listing
    [4-2](#487367_1_En_4_Chapter.xhtml#PC2) demonstrates how you might use sep in
    combination with skipinitialspace to configure loading of data that is not comma
    delimited.


    ```

    >> data = io.StringIO(

    """

    id| age| height| weight

    129237| 32| 5.4| 126

    123083| 20| 6.1| 145

    """

    )

    >> pd.read_csv(data, sep="|", skipinitialspace=True)

    idageheightweight

    0129237325.4126

    1123083206.1145

    Listing 4-2

    Loading non-comma-delimited data

    ```


    The parameter usecols narrows down the list of columns to load. It’s possible
    to have columns within the CSV file that you don’t care about, and thus this can
    be an efficient way of eliminating them upon load as opposed to loading all the
    data and removing them after. Note that usecols can also be a function where the
    column name is an input and the output is a Boolean indicating whether to include
    that column or discard it upon loading. A function however is less ideal as it
    requires calls between the C parsing engine and the custom function which will
    slow the loader down. Listing [4-3](#487367_1_En_4_Chapter.xhtml#PC3) shows an
    example of using use_cols to eliminate columns id and age during load.


    ```

    >> data = io.StringIO(

    """

    id,age,height,weight

    129237,32,5.4,126

    123083,20,6.1,145

    """

    )

    >> pd.read_csv(data, usecols=["height", "age"])

    heightweight

    05.4126

    16.1145

    Listing 4-3

    Eliminating columns during load

    ```


    The skiprows parameter allows you to skip certain rows in the file. In its simplest
    form, it can be used to skip the first n number of rows in a file; however, it
    can also be used to skip particular rows by specifying a list of indexes to skip.
    It can also be a function that accepts a row index and returns True if that row
    should be skipped. Note if a function is passed here, it will have the unfortunate
    consequence of jumping between the C parsing engine and the skiprows Python function
    which may lead to a substantial slowdown when parsing large data sets. For this
    reason, it’s recommended to keep the skiprows a simple integer or list value.


    The skipfooter parameter lets you specify the number of lines at the end of the
    file to skip. The documentation notes that this is unsupported with the C parsing
    engine. Since the Python engine uses the Python CSV parser, the CSV parser runs
    and then the last lines of the file are dropped. This makes sense if you think
    about this problem a little more deeply: How would the parser know which lines
    to skip without knowing how many lines there are in the file first (which would
    require first parsing the file)? This behavior can be somewhat surprising for
    some users when, for example, they are actively trying to avoid lines in the file
    because they break the parser and find that the parser is still trying to parse
    those lines they configured the parser to skip. If you run into this situation
    in your own program, nrows is a nice alternative. Listing [4-4](#487367_1_En_4_Chapter.xhtml#PC4)
    demonstrates an example of running into a parsing error even though the loader
    was configured to skip that line.


    ```

    import pandas as pd

    data = io.StringIO(

    """

    student_id, grade

    1045,"a"

    2391,"b"

    8723,"c"

    1092,"a"

    """

    )

    try:

    grades = pd.read_csv(

    data,

    skipfooter=1,

    )

    except pd.errors.ParserError as e:

    pass

    Listing 4-4

    Encountering a parsing error when using skipfooter

    ```


    The parameter comment lets you specify a character that denotes a comment, and
    the rest of the line is ignored after the character. This can be a good strategy
    for manually filtering out certain lines prior to parsing. If you comment out
    the line, then it will not be included in the data set. You may also consider
    setting error_bad_lines to False. Note by default pandas will still raise a warning
    on each bad line, so if you wish to disable the warning as well, you may set warn_bad_lines
    to False.


    By default, the header or column names are inferred by read_csv, and the first
    row of the data is treated as the header. Using the parameter header, you can
    specify which row numbers are to be treated as columns if the data contains multi-level
    columns. Similarly, using index_col, you can specify which columns via column
    index are to be treated as part of the multi-index. In Listing [4-5](#487367_1_En_4_Chapter.xhtml#PC5),
    a multi-index multi-level column DataFrame was dumped to a CSV file using the
    pandas to_csv function. The data contains information on family and species of
    nightshades. The indexes contain the id of the family and species, while the columns
    contain the actual names. Here, the first two rows contain multi-level column
    data so header is set to [0,1], and the first two columns are the multi-index
    so index_col is set to [0,1].


    ```

    >> data = io.StringIO(

    """

    family,,nightshade,nightshade,nightshade

    species,,tomatoe,deadly-nightshade,potato

    family_id,species_id,,,

    61248,129237,1,0,0

    61248,123083,0,1,0

    61248,123729,0,0,1

    """

    )

    >> df = pd.read_csv(data, header=[0,1], index_col=[0,1])

    family                nightshade

    species               tomatoes    deadly-nightshade potato

    family_id  species_id

    61248      12937      1           0                 0

    61248      123083     0           1                 0

    61248      123729     0           0                 1

    Listing 4-5

    Example of loading a multi-index multi-level column DataFrame

    ```


    If the squeeze parameter is enabled, read_csv returns a Series instead of a DataFrame
    if there is only one column in the CSV file. This can be useful when you need
    to load data from multiple sources and combine it into a single DataFrame. If
    the data is loaded into a series, you can simply add it to an existing DataFrame
    as a new column as demonstrated in Listing [4-6](#487367_1_En_4_Chapter.xhtml#PC6).


    ```

    import pandas as pd

    site_data = pd.read_csv(''site1.csv'')

    site_data[''site2''] = pd.read_csv(''site2.csv'', squeeze=True)

    Listing 4-6

    Example of using squeeze

    ```


    The dtype parameter allows you to specify a type for each column in the data.
    If this is not specified, read_csv will attempt to infer the data type which typically
    results in the inferred type being an object which is the largest size that a
    data type can be. Specifying the dtype during load can be a huge performance improvement,
    but that also means you have to have some knowledge at load time about the columns
    in the data set. If you don’t know exactly what to expect until you look at the
    data, you might consider loading the header of the data first or the first couple
    rows using nrows, identifying the column types, and then loading the whole data
    file with the appropriate types specified.


    ```

    >> data = io.StringIO(

    """

    id,age,height,weight

    129237,32,5.4,126

    123083,20,6.1,145

    """

