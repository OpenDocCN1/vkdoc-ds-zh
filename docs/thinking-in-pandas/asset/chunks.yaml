    The `converters` parameter allows you to specify a function to convert values
    in a particular column such as in Listing [4-9](#487367_1_En_4_Chapter.xhtml#PC9).
    This is a nice normalization feature if, for example, there are multiple values
    that represent the same value in a column and you wish to normalize it to a single
    value. This, however, comes at a cost. Because these functions are written in
    Python, the C engine must make calls between C and Python to convert each of the
    values which can be very time-consuming when working with large data sets. So,
    while the data is being normalized at load time, it is also going to load more
    slowly because it will be jumping between C and Python for each value to convert
    in each column. In this scenario, it would be more performant to convert the column
    values after using an Apply-Cython implementation so that the conversion happens
    quickly all in C and avoids this jumping back and forth. See Chapter [6](#487367_1_En_6_Chapter.xhtml)
    for how to implement an apply in Cython.


    ```

    import pandas as pd

    MEDICATIONS_MAPPER = {"atg": "atg", "aftg": "atg", "bta": "bta"}

    def medication_converter(value):

    return MEDICATIONS_MAPPER[value.lower()]

    data = io.StringIO(

    """

    id,age,height,weight,med

    129237,32,5.4,126,bta

    123083,20,6.1,145,aftg

    """

    )

    >> treatments = pd.read_csv(

    data,

    converters={''med'': medication_converter},

    )

    id        age  height   weight   med

    129237    32   5.4      126      bta

    123083    20   6.1      145      atg

    Listing 4-9

    Standardizing values at load time with converters

    ```


    The `nrows` parameter allows you to specify the number of rows to read from the
    file. Something that may be unintuitive here is that `nrows` doesn’t actually
    skip reading the rows when using the Python parsing engine. This is because the
    Python parsing engine reads the whole file first. This means that if there are
    lines after the number of rows you intended to read from the file that result
    in parsing errors, when running with the Python parsing engine, you will not be
    able to avoid them by using `nrows`. Since the Python parsing engine reads the
    whole file first, it will still throw a parsing error on those lines, even though
    you told the CSV loader not to read those rows. So, this is yet another reason
    to avoid the Python parsing engine, particularly when using this setting. Note
    that `skipfooter`, on the other hand, even in the C parsing engine does in fact
    read the footer row. This is simply because in order to identify it as the footer
    of the file, it has to read it and reach the end of the file to identify it as
    the footer. Listing [4-10](#487367_1_En_4_Chapter.xhtml#PC10) shows an example
    of how to avoid lines that would otherwise cause parsing errors using `nrows`
    and the C parsing engine.


    ```

    import pandas as pd

    data = io.StringIO(

    """

    student_id, grade

    1045,"a"

    2391,"b"

    8723,"c"

    1092,"a"

    """

    )

    grades = pd.read_csv(

    data,

    nrows=3,

    )

    Listing 4-10

    Avoiding a parsing error by using nrows

    ```


    The `nrows` parameter in combination with `skiprows` and `header` can also be
    useful for reading a file into memory in pieces, processing it, and then reading
    the next chunk. This is particularly useful with huge sets of data that you may
    otherwise be unable to read all at once due to memory constraints. Listing [4-9](#487367_1_En_4_Chapter.xhtml#PC9)
    shows an example of this. Note `process` is a function that is wrapping the `read_csv`
    function. It takes the loaded data from `read_csv` and does some processing on
    it to reduce the memory footprint and/or normalize it beyond the capabilities
    of `read_csv` and returns it to be concatenated with the rest of the data. In
    Listing [4-11](#487367_1_En_4_Chapter.xhtml#PC11), we load the first 1000 rows,
    process them, and use those first 1000 rows to initialize `data`. Then we continue
    reading in rows, processing 1000 at a time until we read in less than 1000 rows.
    Once we read in less than 1000 rows, we know we’ve read the entire file and exit
    the loop.


    ```

    import pandas as pd

    ROWS_PER_CHUNK = 1000

    data = process(pd.read_csv(

    ''data.csv'',

    nrows=ROWS_PER_CHUNK,

    ))

    read_rows = len(data)

    chunk = 1

    while chunk * ROWS_PER_CHUNK == read_rows:

    chunk_data = process(pd.read_csv(

    ''data.csv'',

    skiprows=chunk * ROWS_PER_CHUNK,

    nrows=ROWS_PER_CHUNK,

    header=None,

    names=data.columns,

    ))

    read_rows += len(chunk_data)

    data = data.append(process(chunk_data), ignore_index=True)

    Listing 4-11

    Reading a file and processing it nrows at a time to reduce memory overhead

    ```


    The parameter `iterator` used in combination with `chunksize` also lets you read
    the data in chunks similar to Listing [4-11](#487367_1_En_4_Chapter.xhtml#PC11).
    Again, this may be necessary for performance reasons. Maybe the data you are reading
    cannot be read in with a smaller memory footprint using `read_csv`, and some normalization
    must take place after loading that results in a smaller memory footprint, meaning
    while you aren’t able to read all the data into memory all at once using `read_csv`
    because the resulting `DataFrame` would be too large, you are able to read it
    in a chunk at a time and reduce the memory footprint on each chunk such that the
    resulting `DataFrame` will fit in memory. Note using `iterator` and `chunksize`
    is a better alternative if you are reading the whole file chunks at a time than
    using `nrows` and `skiprows` as it keeps the file open at the correct location
    instead of constantly re-opening it and scrolling to the next position. Listing
    [4-12](#487367_1_En_4_Chapter.xhtml#PC12) shows an example of this.


    ```

    import pandas as pd

    ROWS_PER_CHUNK = 1000

    data = pd.DataFrame({})

    reader = pd.read_csv(

    ''data.csv'',

    chunksize=ROWS_PER_CHUNK,

    iterator=True

    )

    for data_chunk in reader:

    processed_data_chunk = process(data_chunk)

    data = data.append(processed_data_chunk)

    Listing 4-12

    Reading a file in chunks to reduce memory overhead

    ```


    The parameter `low_memory` which defaults to `True` actually processes the file
    in chunks already when using the C parsing engine in order to save memory. However,
    it is limited in the processing it can do of each chunk by the options of `read_csv`,
    and thus custom processing and iterating over the chunks manually may be better
    in certain scenarios.'
