    >> data.dtypes

    size     object

    >> id(data._data.blocks[0].values)


    代码清单9-5：`inplace=True`导致复制而非修改数据的例子

    ```


    虽然尝试不复制数据在性能上通常优于总是复制数据，但为了尽可能减少用户的痛苦，将其引导至一个没有`inplace`的世界，pandas团队已建议不要使用`inplace=True`。


    在过去的几年里，pandas的原创者Wes McKinney开始了一个名为Apache Arrow^([⁷](#fn7))的新项目，他希望该项目有朝一日能成为pandas的后端。该项目的目标是修复pandas的许多核心问题，包括减少内存开销和实现惰性求值。


    ## `Conclusion`


    由于pandas的用户群体多样化，它支持许多不同的选项和许多不同的方法来完成同一件事。pandas的API拥有庞大且不断扩展的功能和选项集，这可能会令人不知所措，并常常导致用户以次优的方式实现功能。这是一个艰难的决定：是限制功能和选项的数量使用户无法做错事，还是提供一套功能使用户能找到方法做任何他们想做的事。pandas无疑选择了后者，这使其成为一个非常强大的工具，适用于许多不同类型的大数据问题。对于那些不关心程序运行一分钟还是一小时的用户来说，使用次优实现并不是问题。然而，对于在意这一点的用户来说，这可能难以推理和理解。希望本书能让你更好地理解pandas底层的工作原理，并对在特定场景下使用哪种方法有一种直觉。


    总的来说，我们在本书中涵盖了几条基本的编码规则，你在实施未来的pandas项目时应牢记在心：


    *   如果可能，在加载数据的同时进行数据标准化

    *   显式指定数据类型

    *   避免在Python中循环

    *   谨慎选择能优化分析的DataFrame方向

    *   避免复制数据的操作

    *   根据需要利用Cython或更快的自定义实现


    遵循这些基本的编码规则，并凭借你对给定pandas操作底层性能的直觉，你应该能够为下一个pandas项目选择最优的实现方案。'
  raw: 'Improvements were also made to the is_monotonic check on an index. Previously,
    the result relied on the generation of cached values, but when the levels of an
    index are already individually sorted, is_lexsorted of codes can be used to determine
    monotonicity instead. Recall from Chapter [3](#487367_1_En_3_Chapter.xhtml) that
    levels are the unique list of values within the index and codes hold the position
    of those values within the index. codes represent each value as an integer, and
    this integer is the index location of the value in the list of values. So, putting
    that all together, is_lexsorted is an O(n) algorithm which is operating on integers
    that represent the values, whereas the previous implementation was always operating
    on the index values directly in an O(nlog(n)) check, first sorting them using
    NumPy’s lexsort and then determining based on the sort result whether any of them
    were not in monotonic order. By using the already sorted integer representations
    of the values, we are able to more quickly determine monotonicity. Figure [9-4](#487367_1_En_9_Chapter.xhtml#Fig4)
    shows the change in bold.


    ![../images/487367_1_En_9_Chapter/487367_1_En_9_Fig4_HTML.jpg](images/487367_1_En_9_Chapter/487367_1_En_9_Fig4_HTML.jpg)


    Figure 9-4


    Additional code inserted to improve performance of is_monotonic check


    There is talk from the pandas team of removing the inplace option from all pandas
    methods, and for that reason, they have generally recommended to not use it. The
    inplace option, contrary to what its name suggests, does not always operate inplace
    without duplicating memory. This typically happens as a result of pandas type
    inference where the operation results in a data type change, and thus the data
    has to be reconstructed with the new type. Listing [9-5](#487367_1_En_9_Chapter.xhtml#PC5)
    illustrates this example. When the NaN value is replaced with 0.0, the type is
    still a float and the value can be directly replaced in the NumPy array without
    having to create a new one and copy memory. When 0.0 is replaced with the string
    null, the float64 type cannot hold a string and so the NumPy array must be rebuilt
    and the memory must be copied into a new array of type object. Both these operations
    were specified with inplace=True, yet the latter resulted in a memory copy because
    the type of the underlying data structure had to change.


    ```

    >> data = pd.DataFrame({"size":[np.nan,1.0,3.5]})

    >> data.dtypes

    size     float64

    >> id(data._data.blocks[0].values)


    >> data.fillna(0.0, inplace=True)

    >> data.dtypes

    size     float64

    >> id(data._data.blocks[0].values)


    >> data.replace(0.0, "null", inplace=True)

    >> data.dtypes

    size     object

    >> id(data._data.blocks[0].values)


    Listing 9-5

    An example of inplace=True copying rather than modifying the data

    ```


    While attempting to not duplicate data is arguably better performance than always
    duplicating it, in an effort to shift users with as little pain as possible over
    to a world where inplace does not exist, the pandas team has recommended to not
    use inplace=True.


    In the last couple years, the original author of pandas, Wes McKinney, has started
    working on a new project called Apache Arrow^([⁷](#fn7)) which he hopes will one
    day be the back end of pandas. It aims to fix a lot of the core issues of pandas
    including reducing the memory overhead and enabling lazy evaluations.


    ## `Conclusion`


    Because of pandas’ diverse user base, it supports many different options and many
    different methods for doing the same thing. pandas’ API has a large and ever-expanding
    set of features and options which can be incredibly overwhelming and often lead
    users to implement things in a suboptimal way. It’s a difficult decision to make:
    limit the number of features and options such that users can’t do the wrong thing
    or provide a set of features so that users can find a way to do whatever they
    want. pandas has certainly erred on the side of the latter which makes it a very
    powerful tool and applicable to many different types of big data problems. And
    for those users who don’t care if their program takes a minute or an hour, it’s
    not an issue that they have used a suboptimal implementation. However, for users
    that do, it can be difficult to reason about and understand. Hopefully, this book
    has left you with a better understanding of how pandas works underneath and an
    intuition for which method to use during certain scenarios.


    In general, we’ve covered a few basic rules-to-code-by throughout this book which
    you should keep in mind as you implement your future pandas projects:


    *   Normalize your data at the same time as you load it if possible


    *   Explicitly specify your data types


    *   Avoid looping in Python


    *   Carefully select a DataFrame orientation that optimizes analysis


    *   Avoid operations that duplicate data


    *   Take advantage of Cython or faster custom implementations as needed


    By following these basic rules-to-code-by and now with an intuition for how a
    given pandas operation will perform underneath, you should be able to select the
    most optimal implementation for your next pandas project.'
  trans: '

    对`is_monotonic`检查的索引进行了改进。此前，该检查的结果依赖于生成缓存值，但当索引的层级已经单独排序时，可以使用代码的`is_lexsorted`来确定单调性。回忆第
    3 章，`levels`是索引中唯一值的列表，而`codes`存储了这些值在索引中的位置。`codes`将每个值表示为一个整数，该整数是值在值列表中的索引位置。综合来看，`is_lexsorted`是一个运行在表示值的整数上的`O(n)`算法，而之前的实现总是直接在索引值上进行`O(nlog(n))`的检查，即先使用`NumPy`的`lexsort`排序，然后根据排序结果判断是否有值不按单调顺序排列。通过使用已排序的整数值表示，我们能够更快地确定单调性。图
    9-4 展示了这一变化（以粗体显示）。


    ![../images/487367_1_En_9_Chapter/487367_1_En_9_Fig4_HTML.jpg](img/487367_1_En_9_Fig4_HTML.jpg)


    **图 9-4：** 为提升`is_monotonic`检查性能而插入的附加代码


    pandas 团队正讨论从所有 pandas 方法中移除`inplace`选项，因此他们普遍建议不要使用它。`inplace`选项，与其名称所示相反，并不总是在不复制内存的情况下原地操作。这通常是由于
    pandas 的类型推断导致的，即操作结果导致数据类型变化，因此必须用新类型重建数据。代码清单 9-5 说明了这个例子。当`NaN`值被替换为`0.0`时，类型仍然是`float`，可以直接在`NumPy`数组中替换该值，而无需创建新数组并复制内存。当`0.0`被替换为字符串`"null"`时，`float64`类型无法容纳字符串，因此必须重建`NumPy`数组，并将内存复制到一个类型为`object`的新数组中。这两个操作都指定了`inplace=True`，但后者导致了内存复制，因为底层数据结构的数据类型必须改变。


    ```

    >> data = pd.DataFrame({"size":[np.nan,1.0,3.5]})

    >> data.dtypes

    size     float64

    >> id(data._data.blocks[0].values)


    >> data.fillna(0.0, inplace=True)

    >> data.dtypes

    size     float64

    >> id(data._data.blocks[0].values)


    >> data.replace(0.0, "null", inplace=True)

    >> data.dtypes

    size     object

    >> id(data._data.blocks[0].values)


    **代码清单 9-5：** `inplace=True`导致复制而非修改数据的例子

    ```


    虽然尝试不复制数据在性能上通常优于总是复制数据，但为了尽可能减少用户的痛苦，将其引导至一个没有`inplace`的世界，pandas 团队已建议不要使用`inplace=True`。


    在过去的几年里，pandas 的原创者 Wes McKinney 开始了一个名为 Apache Arrow^(⁷)的新项目，他希望该项目有朝一日能成为 pandas
    的后端。该项目的目标是修复 pandas 的许多核心问题，包括减少内存开销和实现惰性求值。


    ## `结论`


    由于 pandas 的用户群体多样化，它支持许多不同的选项和许多不同的方法来完成同一件事。pandas 的 API 拥有庞大且不断扩展的功能和选项集，这可能会令人不知所措，并常常导致用户以次优的方式实现功能。这是一个艰难的决定：是限制功能和选项的数量使用户无法做错事，还是提供一套功能使用户能找到方法做任何他们想做的事。pandas
    无疑选择了后者，这使其成为一个非常强大的工具，适用于许多不同类型的大数据问题。对于那些不关心程序运行一分钟还是一小时的用户来说，使用次优实现并不是问题。然而，对于在意这一点的用户来说，这可能难以推理和理解。希望本书能让你更好地理解
    pandas 底层的工作原理，并对在特定场景下使用哪种方法有一种直觉。


    总的来说，我们在本书中涵盖了几条基本的编码规则，你在实施未来的 pandas 项目时应牢记在心：


    *   如果可能，在加载数据的同时进行数据标准化

    *   显式指定数据类型

    *   避免在 Python 中循环

    *   谨慎选择能优化分析的 DataFrame 方向

    *   避免复制数据的操作

    *   根据需要利用 Cython 或更快的自定义实现


    遵循这些基本的编码规则，并凭借你对给定 pandas 操作底层性能的直觉，你应该能够为下一个 pandas 项目选择最优的实现方案。

