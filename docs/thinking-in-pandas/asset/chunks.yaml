  raw: '## pd.read_sql, pd.read_sql_table, and pd.read_sql_query


    The pandas read_sql loader is a wrapper around read_sql_table and read_sql_query.
    Depending on the parameters passed to it, it calls one of those two functions
    underneath. It also has built-in support for SQLAlchemy.


    SQLAlchemy is a very popular Object Relational Mapper library, also known as an
    ORM . The pandas SQL reader also supports talking directly to DBAPI which is a
    lower-level database library that SQLAlchemy depends on. While DBAPI is limited
    within pandas to SQLite3, SQLAlchemy can talk to all kinds of relational databases
    so there’s no need to rewrite all your SQL queries when switching databases. ORMs
    are quite popular in the application development space as they allow you to map
    your database tables to objects or classes in Python. This is nice because you
    can track your database table definitions inside your codebase. You can define
    your database tables as classes and then with a simple command add them to your
    database. You can also modify existing database tables via migration scripts using
    migration libraries like Alembic, for example, which let you roll forward and
    roll back database changes with little risk of unrecoverable production database
    mishaps. When building out table definitions, you can also specify things like
    the conversion of column types between Python and the database. SQLAlchemy is
    also nice because it abstracts the SQL query into more human-readable query language
    with easily parameterized expressions, like in Listing [4-29](#487367_1_En_4_Chapter.xhtml#PC29).


    ```

    cur.execute(

    """

    SELECT * FROM temperature_readings

    WHERE temperature_readings.temp > 45

    """

    )

    session.query(TemperatureReadings).filter(

    temp > 45

    )

    Listing 4-29

    Using a raw SQL string query vs. the SQLAlchemy ORM to generate a query

    ```


    Listing [4-30](#487367_1_En_4_Chapter.xhtml#PC30) shows an example of how you
    might build a database and insert data into it. In this example, we are creating
    a user table with two columns, id and name, and inserting a new user with an id
    of zero and name Eric into that table. Note two different URLs are defined in
    the code, the one in use connects to sqlite and the other connects to a local
    Postgres database instance.


    ```

    from sqlalchemy import create_engine

    from sqlalchemy.orm import sessionmaker

    from sqlalchemy import Column, Integer, String

    from sqlalchemy.ext.declarative import declarative_base

    Base = declarative_base()

    SQLITE_URL = "sqlite://"

    POSTGRES_URL = "postgresql://postgres@localhost:5432"

    class User(Base):

    __tablename__ = ''user''

    id = Column(Integer, primary_key=True)

    name =  Column(String(50))

    engine = create_engine(SQLITE_URL)

    Session = sessionmaker(bind=engine)

    def create_tables():

    Base.metadata.create_all(engine)

    def add_user():

    session = Session()

    user = User(id=0, name="Eric")

    session.add(user)

    session.commit()

    session.close()

    >> create_tables()

    >> add_user()

    Listing 4-30

    Creating tables in a postgres database and adding data to it using SQLAlchemy

    ```


