    # `pd.read_json`


    `read_json` 解析器完全在 C 语言中解析，这与 `read_csv` 不同，后者在某些条件下可能使用 Python 解析器。


    参数 `orient` 定义了 JSON 格式将如何转换为 pandas DataFrame。共有六个不同的选项：`split`、`records`、`index`、`columns`、`values`
    和 `table`。如果 JSON 的格式是已经将列、数据和索引定义为键，如清单 4-20 所示，则应使用 `split` 选项。还值得注意的是，JSON
    解析器对空格（包括空白）特别挑剔。


    ```

    >> data = io.StringIO(

    """

    {

    "columns": ["temp"],

    "index": ["234unf923", "340inf351", "234abe045"],

    "data": [[35.2],[32.5],[33.1]],

    }

    """

    )

    >> temperatures = pd.read_json(

    data,

    orient="split",

    )

    temp

    234unf923   35.200000

    340inf351   32.500000

    234abe045   33.100000

    Listing 4-20

    使用 split 取向

    ```


    如果 JSON 的格式是每个值都是数据中的一行，列名作为键，如清单 4-21 所示，则应使用 `records` 选项。


    ```

    >> data = io.StringIO(

    """

    [

    {"location": "234unf923", "temp": 35.2},

    {"location": "340inf351", "temp": 32.5},

    {"location": "234abe045", "temp": 33.1},

    ]

    """

    )

    >> temperatures = pd.read_json(

    data,

    orient="records",

    )

    location     temp

    234unf923    35.200000

    340inf351    32.500000

    234abe045    33.100000

    Listing 4-21

    使用 records 取向

    ```


    如果 JSON 的格式是每个键是索引值，每个键的值是一个包含该行列和值的字典，如清单 4-22 所示，则应使用 `index` 选项。


    ```

    >> data = io.StringIO(

    """

    {

    "234unf923": {"temp": 35.2},

    "340inf351": {"temp": 32.5},

    "234abe045": {"temp": 33.1},

    }

    """

    )

    >> temperatures = pd.read_json(

    data,

    orient="index",

    )

    temp

    234unf923   35.200000

    340inf351   32.500000

    234abe045   33.100000

    Listing 4-22

    使用 index 取向

    ```


    如果 JSON 的格式是每个键是列名，每个值是一个字典，其中键是索引，值是列值，如清单 4-23 所示，则应使用 `columns` 选项。


    ```

    >> data = io.StringIO(

    """

    {

    "temp": {

    "234unf923": 35.2,

    "340inf351": 32.5,

    "234abe045": 33.1,

    },

    }

    """

    )

    >> temperatures = pd.read_json(

    data,

    orient="columns",

    )

    temp

    234unf923   35.200000

    340inf351   32.500000

    234abe045   33.100000

    Listing 4-23

    使用 columns 取向

    ```


    如果 JSON 的格式是每一行简单地表示为一个值列表，如清单 4-24 所示，则应使用 `values` 选项。


    ```

    >> data = io.StringIO(

    """

    [

    ["234unf923", 35.2],

    ["340inf351", 32.5],

    ["234abe045", 33.1],

    ]

    """

    )

    >> temperatures = pd.read_json(

    data,

    orient="values",

    )

    0           1

    0       234unf923   35.200000

    1       340inf351   32.500000

    2       234abe045   33.100000

    Listing 4-24

    使用 values 取向

    ```


    如果 JSON 的格式提供了详细的数据模式，如清单 4-25 所示，则应使用 `table` 选项。


    ```

    >> data = io.StringIO(

    """

    {

    "schema": {

    "fields": [

    {"name": "location", "type": "string"},

    {"name": "temp", "type": "string"},

    ],

    "primaryKey": "location",

    },

    "data": [

    {"location": "234unf923", "temp": 35.2},

    {"location": "340inf351", "temp": 32.5},

    {"location": "234abe045", "temp": 33.1},

    ]

    }

    """

    )

    >> temperatures = pd.read_json(

    data,

    orient="table",

    )

    temp

    location

    234unf923    35.200000

    340inf351    32.500000

    234abe045    33.100000

    Listing 4-25

    使用 table 取向

    ```


    与 `read_csv` 类似，`read_json` 有一个 `chunksize` 参数，允许您分块读取文件。但是，只有在 `lines` 选项也设置为
    `True` 时才允许这样做，这意味着 JSON 格式是面向 `records` 的，但没有列表括号。清单 4-26 演示了这一点。


    ```

    >> data = io.StringIO(

    """

    {"location": "234unf923", "temp": 35.2}

    {"location": "340inf351", "temp": 32.5}

    {"location": "234abe045", "temp": 33.1}

    """

    )

    >> temperatures = pd.DataFrame({})

    >> reader = pd.read_json(

    data,

    lines=True,

    chunksize=2,

    )

    >> for chunk in reader:

    temperatures = temperatures.append(process(chunk))

    >> temperatures

    location       temp

    234unf923      35.200000

    340inf351      32.500000

    234abe045      33.100000

    Listing 4-26

    分块加载文件

    ```


    默认情况下，JSON 加载器根据列名（而不是像其他读取器那样查看值）来确定某些列是否类似日期。它接受一个 `convert_dates` 参数，该参数可以是一个列名列表或一个布尔值。如果设置为
    `True`，它会将以 `_at` 或 `_time` 结尾、以 `timestamp` 开头、或者名为 `modified` 或 `date` 的列转换为日期时间。要禁用自动检测日期列，可以将
    `keep_default_dates` 设置为 `False`。


    默认情况下，JSON 加载器会尝试推断每个列和轴的类型，除非 `orient` 设置为 `table`，在这种情况下，类型作为 JSON 模式的一部分提供。就像读取
    CSV 文件一样，如果 JSON 文件中没有指定类型，那么提供类型可以节省大量内存。清单 4-27 展示了加载未指定类型的 JSON 文件时可能的内存占用，而清单
    4-28 展示了指定了类型的同一 JSON 文件的内存占用。请注意，在清单 4-28 中，明确指定了类型，结果 DataFrame 的内存减少了约 40%。


    ```

    >> data = io.StringIO(

    """

    {

    "birth": {

    "129237": "04/10/1999",

    "123083": "05/18/1989",

    },

    "height": {

    "129237": 5.4,

    "123083": 6.1,

    },

    "weight": {

    "129237": 126,

    "123083": 130,

    },

    }

    """

    )

    >> patient_info = pd.read_json(

    data,

    orient="columns",

    convert_dates=["birth"],

    dtype={"height": np.float16, "weight": np.int16},

    )

    birth          height  weight

    129237     1999-04-10     5.4     126

    123083     1989-05-18     6.1     130

    >> df.dtypes

    birth          datetime64[ns]

    height         float16

    weight         int16

    >> df.index.dtype

    dtype(''int64'')

    >> df.memory_usage()

    Index          16

    birth          16

    height         4

    weight         4

    Listing 4-28

    加载 JSON 时显式指定类型

    ```


    ```

    >> data = io.StringIO(

    """

    {

    "birth": {

    "129237": "04/10/1999",

    "123083": "05/18/1989",

    },

    "height": {

    "129237": 5.4,

    "123083": 6.1,

    },

    "weight": {

    "129237": 126,

    "123083": 130,

    },

    }

    """

    )

    >> patient_info = pd.read_json(

    data,

    orient="columns",

    )

    birth          height  weight

    129237     04/10/1999     5.4     126

    123083     05/18/1989     6.1     130

    >> df.dtypes

    birth          object

    height         float64

    weight         int64

    >> df.index.dtype

    dtype(''int64'')

    >> df.memory_usage()

    Index          16

