    >> df.memory_usage(deep=True)

    Index     16

    age       16

    height    16

    weight    16

    >> df.dtypes

    age          int64

    height       float64

    weight       int64

    >> df.index.dtype

    dtype(''int64'')

    Listing 4-7

    Example of not specifying the types of the columns when loading

