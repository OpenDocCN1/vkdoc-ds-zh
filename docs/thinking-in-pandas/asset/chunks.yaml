- fmt: "向量化操作允许你将数学运算应用于数字序列。例如，如果要将`4`添加到`ndarray`中的每个元素，你可以使用`arr + 4`语法来指定。对于`NumPy`的`ufuncs`（参见附录中的完整列表），它们实际上利用了CPU中专门的向量寄存器。向量寄存器是一种能够包含一系列值的寄存器，当对其执行操作时，该操作会同时应用于寄存器中的每个值。因此，原本需要在CPU中对八个值进行循环并执行八次连续加法指令的操作，现在变成了在CPU中对八个值执行一次加法指令。可以想象，这带来了巨大的速度提升。向量化还会对维度不匹配的数组进行填充，以使维度匹配，从而能够执行操作。这个过程被称为广播。当你在`pandas`中通过`df[\"\
    new_col\"] = 4`添加新列时，`4`会被广播，使其行数与`DataFrame`中所有其他列的行数相同。类似地，像`sum`这样的聚合函数也使用向量化对数字序列进行操作。这一切归结为：`apply`不是一个向量化操作——它在Python中循环，应尽可能避免使用。它实际上与你自己遍历行并应用函数的效果相同，如清单[6-3](#487367_1_En_6_Chapter.xhtml#PC3)所示。\n\
