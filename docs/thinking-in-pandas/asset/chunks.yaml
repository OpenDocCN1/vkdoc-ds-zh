- fmt: '# Pivot与Pivot Table的对比与重塑操作


    `Pivot`的功能与`pivot table`相同，但不允许聚合数据。当使用`pivot table`时，任何导致多个值的列和索引组合必须被聚合在一起。而`pivot`在遇到这种情况时，会直接抛出`ValueError`。请注意，在清单[5-3](#487367_1_En_5_Chapter.xhtml#PC3)中，没有药物和日期的组合会产生多个值；然而在清单[5-4](#487367_1_En_5_Chapter.xhtml#PC4)中，同一药物和日期存在或将会出现多行数据，因此清单[5-4](#487367_1_En_5_Chapter.xhtml#PC4)会抛出`ValueError`。因此，`pivot`和`pivot
    table`的一个遗憾的局限是，当某个索引和列组合存在多个值时，它们都无法输出数据。`Pivot table`强制你对多个值进行聚合或选择一个，而`pivot`则直接抛出`ValueError`。


    ```

    >> df

    date          tumor_size    drug      dose

    02/18         90            01384     10

    02/25         80            01384     10

    03/07         65            01384     10

    03/21         60            01384     10

    02/18         30            01389     7

    02/25         20            01389     7

    03/07         25            01389     7

    03/21         25            01389     7

    >> df.pivot(

    index="drug",

    columns="date",

    values="tumor_size",

    )

    ValueError: Index contains duplicate entries, cannot reshape

    Listing 5-4

    Pivot throws a ValueError when there are multiple values for the same column-index
    combination

    ```


    ```

    >> df

    date           tumor_size      drug         dose

    02/18          90              01384        10

    02/25          80              01384        10

    03/07          65              01384        10

    03/21          60              01384        10

    02/18          30              01389        7

    02/25          20              01389        7

    03/07          25              01384        10

    03/21          25              01389        7

    >> df.pivot(

    index="drug",

    columns="date",

    values="tumor_size"

    )

    date    02/18    02/25    03/07     03/21

    drug

    01384   90        80       65         60

    01389   30        20       25         25

    Listing 5-3

    Re-orienting a DataFrame using pivot

    ```


    `Pivot`比`pivot table`性能更高，因为它不允许指定和生成多级列和多级索引。因此，它没有生成和处理这种更复杂`DataFrame`格式的开销。无论生成的`DataFrame`是否是多级索引或多级列`DataFrame`，`pivot
    table`仍然会像处理多级结构一样运行各种计算，这会增加相当多的开销，在某些情况下甚至比`pivot`多出六倍。虽然`pivot`允许你指定多个值并为其创建多级列，但它不允许你提供显式的列列表来生成多级列，或提供索引列表来生成多级索引。而`pivot
    table`支持这种多级`DataFrame`。它还有一些其他便利选项，例如添加所有行和列的小计，以及删除包含`NaN`的列。总之，如果你能使用`pivot`，就应该使用它，因为它比`pivot
    table`性能更高。


    ## Stack和Unstack


    `Stack`和`unstack`将`DataFrame`的列层级重塑为最内层索引，反之亦然。清单[5-5](#487367_1_En_5_Chapter.xhtml#PC5)中展示了一个示例，其中每一列是一次餐厅卫生检查，值是卫生检查分数，索引代表被检查的餐厅。`Stack`用于重塑数据，使得每家餐厅的卫生检查分数出现在每一行中，而不是每一列中。请注意，`stack`会将顶部的列名转换为列值，这些值最终会从`DataFrame`中被删除。


    ```

    >> df

    score

    inspection                       0    1

    restaurant  location

    Diner       (4, 2)               90   100

    Pandas      (5, 4)               55   76

    >> df = df.stack().reset_index()

    >> df

    restaurant  location   inspection  score

    Diner       (4, 2)      0          90

    1          100

    Pandas      (5, 4)      0          55

    1          76

    >> df.drop(column=["inspection"], inplace=True)

    >> df.set_index(["restaurant", "location"], inplace=True)

    >> df

    score

    restaurant  location

    Diner       (4, 2)     90


    Pandas      (5, 4)     55


    Listing 5-5

    Reshaping a DataFrame so that each row represents an inspection using stack

    ```


    你可能认出了清单[5-5](#487367_1_En_5_Chapter.xhtml#PC5)中原始`DataFrame`的形状与清单[3-22](#487367_1_En_3_Chapter.xhtml#PC22)中的形状一致。在清单[5-5](#487367_1_En_5_Chapter.xhtml#PC5)中重塑之前的`DataFrame`形状，正是第[3](#487367_1_En_3_Chapter.xhtml)章末尾“选择正确的DataFrame”部分中被认为最优的朝向。清单[5-5](#487367_1_En_5_Chapter.xhtml#PC5)展示了如何从该最优形状转换为原始的非最优形状。现在，我们来看如何将原始的非最优形状转换为最优形状。清单[5-6](#487367_1_En_5_Chapter.xhtml#PC6)向`DataFrame`添加了一个名为`inspection`的新列，其值将成为新`DataFrame`的列名。我们还使用了一个方便的`groupby`聚合函数`cumcount`，它为每个组中的每一行创建一个行号。


    ```

    >> df

    score

    restaurant  location

    Diner       (4, 2)      90


    Pandas      (5, 4)      55


    >> df["inspection"] = df.groupby(

    ["restaurant", "location"]).cumcount()

    >> df

    inspection  score

    restaurant  location

    Diner       (4, 2)    0          90

    1          100

    Pandas      (5, 4)    0          55

    1          76

    >> df.set_index("inspection", append=True, inplace=True)

    >> df

    score

    restaurant  location   inspection

    Diner        (4, 2)    0           90

    1           100

    Pandas        (5, 4)   0           55

    1           76

    >> df = df.unstack()

    >> df

    score

    inspection                         0    1

    restaurant  location

    Diner       (4, 2)                 90   100

    Pandas      (5, 4)                 55   76

    Listing 5-6

    Reshaping a DataFrame so that each column is an inspection using unstack

    ```


    那么`stack`和`unstack`的性能如何？它们都会复制内存，因为它们不是原地操作，这可能会很昂贵，因此只应在数据规范化时使用。然而，它们在数据转换方式上非常独特，因此很难找到比`melt`性能更高的替代方法，我们将在下一节中探讨`melt`。


    ## Melt


    清单[5-7](#487367_1_En_5_Chapter.xhtml#PC7)中展示了使用`melt`的示例。请注意，这与`stack`的示例非常相似。在这个示例中，我们基本上是用一行代码完成了之前用`stack`大约四行代码完成的工作。虽然`melt`的功能与`stack`相同，甚至更多，但它的执行方式性能稍高。这主要是因为它在高层调用各种数据转换时开销略小，也就是说，`melt`不是调用底层的`stack`，而是直接在底层执行`stack`之下的数据操作，从而避免了中间代码层。如果将原始的`stack`与`melt`进行对比，`stack`大约快四倍。使用`stack`的缺点在于，它通常需要其他操作，例如设置索引、重命名列、将其转换回`DataFrame`等。这意味着在某些情况下，直接使用`melt`性能更高。


    ```

    >> df

    restaurant  location    0    1

    Diner       (4, 2)      90   100

    Pandas      (5, 4)      55   76

    >> df = df.melt(

    id_vars=["restaurant","location"],

    value_vars=[0,1],

    value_name="score").drop(columns="variable")

    >> df

    restaurant  location      score

    Diner       (4, 2)        90


    Pandas      (5, 4)        55


    Listing 5-7

    Reshaping a DataFrame so that each row represents an inspection using melt

    ```'
  raw: 'Pivot does the same thing as pivot table, but it does not allow you to aggregate
    data. Any columns and index value combinations that result in multiple values
    must be aggregated together when using pivot table. Pivot, on the other hand,
    simply throws a ValueError if it runs into such a scenario. Note in Listing [5-3](#487367_1_En_5_Chapter.xhtml#PC3)
    no combination of drug and date results in multiple values; however, in Listing
    [5-4](#487367_1_En_5_Chapter.xhtml#PC4), there are or would be multiple rows for
    the same drug and date; thus, Listing [5-4](#487367_1_En_5_Chapter.xhtml#PC4)
    throws a ValueError. So, a regrettable limitation of both pivot and pivot table
    is they do not output data where there are multiple values for an index and column
    combination. Pivot table forces you to aggregate the multiple values together
    or select one and pivot simply throws a ValueError.


    ```

    >> df

    date          tumor_size    drug      dose

    02/18         90            01384     10

    02/25         80            01384     10

    03/07         65            01384     10

    03/21         60            01384     10

    02/18         30            01389     7

    02/25         20            01389     7

    03/07         25            01389     7

    03/21         25            01389     7

    >> df.pivot(

    index="drug",

    columns="date",

    values="tumor_size",

    )

    ValueError: Index contains duplicate entries, cannot reshape

    Listing 5-4

    Pivot throws a ValueError when there are multiple values for the same column-index
    combination

    ```


    ```

    >> df

    date           tumor_size      drug         dose

    02/18          90              01384        10

    02/25          80              01384        10

    03/07          65              01384        10

    03/21          60              01384        10

    02/18          30              01389        7

    02/25          20              01389        7

    03/07          25              01384        10

    03/21          25              01389        7

    >> df.pivot(

    index="drug",

    columns="date",

    values="tumor_size"

    )

    date    02/18    02/25    03/07     03/21

    drug

    01384   90        80       65         60

    01389   30        20       25         25

    Listing 5-3

    Re-orienting a DataFrame using pivot

    ```


    Pivot is more performant than pivot table because it does not allow specification
    and generation of multi-level columns and multi-indexes. Thus, it does not have
    the overhead of generating and handling this more complex DataFrame format. Regardless
    of whether the resulting DataFrame is a multi-index or multi-level column DataFrame,
    pivot table still runs the various computations as if it is multi-level which
    adds a fair amount of overhead, up to six times more than pivot in some cases.
    While pivot will allow you to specify multiple values and create a multi-level
    column for them, it does not allow you to provide an explicit list of columns
    to generate multi-level columns or provide a list of indexes to generate multi-level
    indexes. Pivot table, on the other hand, supports this type of multi-level DataFrame.
    It also has some other nicety options like adding a subtotal of all rows and columns
    and dropping columns with NaNs. In summary, if you can get away with using pivot,
    you should, as it’s more performant than using pivot table.


    ## Stack and unstack


    Stack and unstack reshape a DataFrame’s column level into an innermost index and
    vice versa. An example of this is shown in Listing [5-5](#487367_1_En_5_Chapter.xhtml#PC5)
    where each column is a restaurant health inspection, the value is the health inspection
    score, and the index represents the restaurant that was inspected. Stack is used
    to reshape the data so that the health inspection scores for each restaurant occur
    across each row rather than each column. Note stack converts the column names
    across the top into column values which then are ultimately dropped from the DataFrame.


    ```

    >> df

    score

    inspection                       0    1

    restaurant  location

    Diner       (4, 2)               90   100

    Pandas      (5, 4)               55   76

    >> df = df.stack().reset_index()

    >> df

    restaurant  location   inspection  score

    Diner       (4, 2)      0          90

    1          100

    Pandas      (5, 4)      0          55

    1          76

    >> df.drop(column=["inspection"], inplace=True)

    >> df.set_index(["restaurant", "location"], inplace=True)

    >> df

    score

    restaurant  location

    Diner       (4, 2)     90


    Pandas      (5, 4)     55


    Listing 5-5

    Reshaping a DataFrame so that each row represents an inspection using stack

    ```


    You might recognize the shape of the original DataFrame in Listing [5-5](#487367_1_En_5_Chapter.xhtml#PC5)
    from Listing [3-22](#487367_1_En_3_Chapter.xhtml#PC22). The shape of the DataFrame
    before it’s reshaped in Listing [5-5](#487367_1_En_5_Chapter.xhtml#PC5) is the
    orientation that was deemed the most optimal in the “Choosing the right DataFrame”
    section at the end of Chapter [3](#487367_1_En_3_Chapter.xhtml). Listing [5-5](#487367_1_En_5_Chapter.xhtml#PC5)
    shows how to convert from that optimal shape to the original non-optimal shape.
    Now let’s look at how we might take the original non-optimal shape and turn it
    into the optimal shape. Listing [5-6](#487367_1_En_5_Chapter.xhtml#PC6) adds a
    new column called inspection to the DataFrame whose values become the column names
    for the new DataFrame. We also are making use of a handy groupby aggregation function
    called cumcount that creates a row number for each row in each group.


    ```

    >> df

    score

    restaurant  location

    Diner       (4, 2)      90


    Pandas      (5, 4)      55


    >> df["inspection"] = df.groupby(

    ["restaurant", "location"]).cumcount()

    >> df

    inspection  score

    restaurant  location

    Diner       (4, 2)    0          90

    1          100

    Pandas      (5, 4)    0          55

    1          76

    >> df.set_index("inspection", append=True, inplace=True)

    >> df

    score

    restaurant  location   inspection

    Diner        (4, 2)    0           90

    1           100

    Pandas        (5, 4)   0           55

    1           76

    >> df = df.unstack()

    >> df

    score

    inspection                         0    1

    restaurant  location

    Diner       (4, 2)                 90   100

    Pandas      (5, 4)                 55   76

    Listing 5-6

    Reshaping a DataFrame so that each column is an inspection using unstack

    ```


    So how performant are stack and unstack? They both duplicate memory as they are
    not inplace operations which can be costly and thus should really only be used
    in data normalization. They are, however, very unique in the way they can transform
    the data, so it is difficult to find a more performant alternative other than
    melt which is what we’ll explore in the next section.


    ## Melt


    An example of using melt is shown in Listing [5-7](#487367_1_En_5_Chapter.xhtml#PC7).
    Note that this is very similar to the stack example. We are essentially doing
    what we did in approximately four lines with stack in one line in this example.
    While melt does the same thing as stack and a bit more, it does it in a slightly
    more performant way. This is mainly due to the slight overhead advantage it has
    in not calling into all the various data transformations at a high level, meaning
    rather than calling stack underneath, melt performs the lower-level data manipulations
    underneath stack directly, thus avoiding the middle code layers. If you compare
    a raw stack to melt, stack is about four times faster. The drawback of using stack
    is that it often requires other manipulation such as setting an index, renaming
    columns, converting it back to a DataFrame, and so on. This means in some cases
    it’s more performant to just use melt.


    ```

    >> df

    restaurant  location    0    1

    Diner       (4, 2)      90   100

    Pandas      (5, 4)      55   76

    >> df = df.melt(

    id_vars=["restaurant","location"],

    value_vars=[0,1],

    value_name="score").drop(columns="variable")

    >> df

    restaurant  location      score

    Diner       (4, 2)        90


    Pandas      (5, 4)        55


    Listing 5-7

    Reshaping a DataFrame so that each row represents an inspection using melt

    ```'
