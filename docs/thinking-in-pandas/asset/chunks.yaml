    but not both, will be eligible for the third trial. In order to generate a list
    of eligible patients, we need to use an anti-join method when performing a merge
    of trial a and trial b patients (Figure [2-4](#487367_1_En_2_Chapter.xhtml#Fig4)).
    pandas merge method provides a parameter called indicator that adds an additional
    column called _merge into the resulting DataFrame that reports whether the key
    is present in left_only, right_only, or both DataFrames. This comes in handy in
    this particular case as we wish to do a somewhat unconventional merge. Using the
    query method, we are able to select rows where the _merge value is not both and
    then drop the _merge column. This can be done all in one line as shown at the
    end of Listing [2-13](#487367_1_En_2_Chapter.xhtml#PC13) but is broken up into
    two steps beforehand so you can see how it works underneath.


