- fmt: '# DataFrame creation and access


    `pandas` has a dictionary-like syntax that is very intuitive for those familiar
    with Python but not with `pandas`. Each column name is treated as a key, and the
    row values are returned as the value. The `DataFrame` object constructor also
    accepts a dictionary as a way of creating a `DataFrame`. Note when you get the
    column from a `DataFrame`, it points back to the original `DataFrame`, and this
    is what allows us to make modifications to the original. This happens despite
    the syntax that implies we are storing it into a subset of the original as demonstrated
    near the bottom of Listing [2-1](#487367_1_En_2_Chapter.xhtml#PC1). This is great
    for memory-based performance since we aren’t constantly creating copies of the
    data.


    ```

    >> import pandas as pd

    >> account_info = pd.DataFrame({

    "name": ["Bob", "Mary", "Mita"],

    "account": [123846, 123972, 347209],

    "balance": [123, 3972, 7209],

    })

    >> account_info["name"]

    0    Bob

    1    Mary

    2    Mita

    Name: name, dtype: object

    >> account_info["name"] = ["Smith", "Jane", "Patel"]

    >> account_info

    name  account      balance

    0    Smith 123846       123

    1    Jane  123972       3972

    2    Patel 347209       7209

    Listing 2-1

    Example of dictionary syntax

    ```


    Similarly, a sub-`DataFrame` can be created by passing in a list of columns as
    in Listing [2-2](#487367_1_En_2_Chapter.xhtml#PC2).


    ```

    >> import pandas as pd

    >> account_info = pd.DataFrame({

    "name": ["Bob", "Mary", "Mita"],

    "account": [123846, 123972, 347209],

    "balance": [123, 3972, 7209],

    })

    >> account_info[["name", "balance"]]

    name  balance

    0     Bob   123

    1     Mary  3972

    2     Mita  7209

    Listing 2-2

    Example of creating a sub-DataFrame

    ```


    The dictionary syntax can lead to confusion later on if you create a sub-`DataFrame`
    from the original `DataFrame` and modify the sub-`DataFrame` expecting the original
    to be untouched. `pandas` makes no guarantees outside of the simple cases presented
    in Listings [2-1](#487367_1_En_2_Chapter.xhtml#PC1) and [2-2](#487367_1_En_2_Chapter.xhtml#PC2)
    about whether the resulting object returned by the dictionary syntax is a view
    or a copy. This is why the `loc` method is preferred over the dictionary syntax
    for `DataFrame`s that have multi-indexes or multi-level columns. The `loc` method,
    which we’ll discuss in the next section, guarantees that you are operating on
    the original `DataFrame` and not a copy. Similarly, if you truly want a copy of
    the `DataFrame`, you should explicitly create one.


    ## The `iloc` method


    A `DataFrame`’s rows can be accessed via the `iloc` method which uses a list-like
    syntax. Listing [2-3](#487367_1_En_2_Chapter.xhtml#PC3) demonstrates this.


    ```

    >> import pandas as pd

    >> account_info = pd.DataFrame({

    "name": ["Bob", "Mary", "Mita"],

    "account": [123846, 123972, 347209],

    "balance": [123, 3972, 7209],

    })

    >> account_info.iloc[1]

    name        Mary

    account     123972

    balance     3972

    >> account_info.iloc[0:2]

    name  account  balance

    0    Bob   123846   123

    1    Mary  123972   3972

    >> account_info.iloc[:]

    name  account  balance

    0    Bob   123846   123

    1    Mary  123972   3972

    2    Mita  347209   7209

    Listing 2-3

    Example of accessing rows in a DataFrame using iloc

    ```


    `iloc` is used to index a `DataFrame` via integer position-based indexing. The
    first position in the `iloc` function specifies the row indexes, while the second
    position specifies the column indexes. This means we can select rows as well as
    columns like in Listing [2-4](#487367_1_En_2_Chapter.xhtml#PC4).


    ```

    >> import pandas as pd

    >> account_info = pd.DataFrame({

    "name": ["Bob", "Mary", "Mita"],

    "account": [123846, 123972, 347209],

    "balance": [123, 3972, 7209],

    })

    >> account_info.iloc[1, 2]


    >> account_info.iloc[1, 2] = 3975

    >> account_info.iloc[1, 2]


    >> account_info.iloc[:, [0, 2]]

    name  balance

    0    Bob   123

    1    Mary  3975

    2    Mita  7209

    Listing 2-4

    Example of accessing rows and columns in a DataFrame using iloc

    ```


    `iloc` also accepts a Boolean array. In Listing [2-5](#487367_1_En_2_Chapter.xhtml#PC5),
    we grab all odd rows by taking the modulus of each row index and converting it
    to a Boolean.


    ```

    >> import pandas as pd

    >> account_info = pd.DataFrame({

    "name": ["Bob", "Mary", "Mita"],

    "account": [123846, 123972, 347209],

    "balance": [123, 3972, 7209],

    })

    >> account_info.iloc[account_info.index % 2 == 1]

    name  account    balance

    1    Mary  123972     3972

    Listing 2-5

    Example of accessing rows and columns in a DataFrame using iloc

    ```


    `iloc` also accepts a function; however, this function is called once with the
    entire `DataFrame`, and there’s little difference between passing it in and simply
    calling the function beforehand so we won’t go over that here.


    `iloc` can come in quite handy when working with multi-indexed and multi-level
    column `DataFrame`s since levels are integer values. Let’s review an example and
    break it down. Here we specify the rows we want to grab as `":"` meaning we want
    all rows, and we use a Boolean array to specify the columns. We grab the values
    for the multi-level column `"data"` which are `["score", "date", "score", "date"]`
    and then create a Boolean array by specifying that the value must equal `"score"`.
    This is broken down into stages in Listing [2-6](#487367_1_En_2_Chapter.xhtml#PC6)
    so it is easier to follow.


    ```

    >> restaurant_inspections

    inspection             0                1

    data                 score date       score date

    restaurant location

    Diner      (4, 2)    90    02/18      100   05/18

    Pandas     (5, 4)    55    04/18      76    01/18

    >> score_columns = (

    restaurant_inspections.columns.get_level_values("data")

    == "score")

    >> score_columns

    [True, False, True, False]

    >> restaurant_inspections.iloc[:, score_columns]

    inspection                0          1

    data                      score      score

    restaurant location

    Diner      (4, 2)         90         100

    Pandas     (5, 4)         55         76

    Listing 2-6

    Extracting a sub-DataFrame from a multi-indexed multi-level column DataFrame using
    iloc

    ```'
