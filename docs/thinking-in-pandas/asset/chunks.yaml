- fmt: '# Performance Improvements Beyond pandas


    You may have heard another pandas user mention using `eval` and `query` to speed
    up evaluation of expressions in pandas. While use of these functions can speed
    up evaluation of expressions, it cannot do it without the help of a very important
    library: `NumExpr`. Use of these functions without installing `NumExpr` can actually
    cause a performance hit. In order to understand how `NumExpr` is able to speed
    up calculations however, we need to take a deep dive into the architecture of
    a computer.


    ## Computer architecture


    CPUs are broken up into multiple cores where each core has a dedicated cache.
    Each core evaluates one instruction at a time. These instructions are very basic
    compared to what you might see in a Python program. One line of Python is often
    broken up into many CPU instructions. Some examples include loading data such
    as storing an array value into a temporary variable when looping, jumping to a
    new instruction location such as when calling a function, and an evaluation expression
    such as adding two values together.


    ![../images/487367_1_En_8_Chapter/487367_1_En_8_Fig1_HTML.jpg](images/487367_1_En_8_Chapter/487367_1_En_8_Fig1_HTML.jpg)


    Figure 8-1 Five-phase pipeline architecture


    In modern cores, the evaluation is split up into many phases. These multiple phases
    are called a pipeline, where each instruction evaluation is piped through a series
    of phases until the evaluation is complete. Modern Intel CPUs are typically broken
    up into about 15 pipeline phases. Figure [8-1](#487367_1_En_8_Chapter.xhtml#Fig1)
    shows an example of a simple five-phase pipeline processor. First, the instruction
    is fetched typically from a dedicated instruction cache, or if not present, it
    must be fetched from a farther cache or main memory. Then the instruction is decoded.
    In the decoding phase, each instruction has a particular numerical code that decodes
    to a certain type of instruction and results in certain behavior so the decode
    phase is responsible for decoding the instruction and gathering the data from
    the registers (you can think of these as a very small dedicated memory cache)
    to pass to the execution phase. In the execution phase, the instruction is actually
    run; this may mean two values are added together, or if it''s a load instruction,
    simply a memory address is passed to the next phase. Since an instruction may
    be a jump to a different memory location rather than a sequential location, part
    of the evaluation phase is also determining the next instruction to send through
    the pipeline. In the memory access phase, any data that needs to be loaded from
    memory into a register for an upcoming instruction is fetched and then loaded
    into a register in the writeback phase. This means that if you wish to add two
    values together, those values must first be loaded with a load instruction into
    two different registers before an add instruction can be run. So, the line of
    Python code in Listing [8-1](#487367_1_En_8_Chapter.xhtml#PC1) consists of three
    instructions inside the CPU.


    ```

    a = b + c        load b

    load c

    add a, b, c

    ```


    Listing 8-1 Converting a line of Python code into pseudo-code CPU instructions


    While the CPU instructions in Listing [8-1](#487367_1_En_8_Chapter.xhtml#PC1)
    may look similar to Python bytecode, it''s important to note that they are not
    the same. Remember that bytecode is run on the Python Virtual Machine, whereas
    CPU instructions are run on the CPU. While you can use the `dis` module (dis standing
    for disassembly) to output the bytecode and it may give you some idea of what
    the machine code might look like, it is not machine code. The Python Virtual Machine
    contains a giant switch statement that translates a bytecode instruction into
    a function call which then executes CPU instructions. So, while we may think of
    Python as being an interpreted language that runs bytecode instructions in a software
    virtual machine, the fact is at some point that add instruction makes its way
    to the CPU. Eventually that add becomes a series of CPU instructions that are
    shown in Listing [8-1](#487367_1_En_8_Chapter.xhtml#PC1).


    It''s very common for the memory access phase of the instruction pipeline to take
    longer than all the other pipeline phases. Rather than making all the other pipeline
    phases as slow as the memory access phase or inserting NOPs (commonly called no
    ops or no operations), other instructions not dependent on the data being loaded
    are used to fill the time. This enables the processor to keep evaluating instructions
    even though one phase of the instruction may take hundreds of cycles to complete.
    Compilers also play a part in keeping the processor busy during long instruction
    loads by re-ordering instructions so that instructions not dependent on a memory
    load occur between a memory load instruction and the next instruction that is
    dependent on that memory having loaded. In modern Intel processors, re-ordering
    can occur inside the CPU as well. Of course, sometimes there are no instructions
    to fill the gap and so NOPs are used as a last resort. This ensures that the core''s
    instruction throughput is still as close to one instruction per clock cycle (phase)
    as possible so that you don''t have to wait hundreds of cycles for a memory load
    to complete.


    The takeaway here is in order to make efficient use of your CPU and get the highest
    instruction throughput possible you must make sure that your data is loaded before
    you use it and that you give it enough computations to do in between the data
    you are operating on and the next data you need.


    So far, we''ve covered how the CPU operates on a low level to evaluate instructions
    and how it works to achieve the best performance possible; now let''s take a deeper
    look at the memory access phase and why it''s often a bottleneck. Figure [8-2](#487367_1_En_8_Chapter.xhtml#Fig2)
    shows a typical cache architecture of a modern Intel CPU. Each core has a dedicated
    level 1 data, level 1 instruction, and a level 2 cache. All cores share the level
    3 cache and main memory. Each of these caches is placed farther and farther from
    the core on the board itself. While core speeds are closely correlated to transistor
    size and speed, memory speeds are correlated to how physically close they are
    to the core on the board.


    ![../images/487367_1_En_8_Chapter/487367_1_En_8_Fig2_HTML.png](images/487367_1_En_8_Chapter/487367_1_En_8_Fig2_HTML.png)


    Figure 8-2 Cache architecture


    When working with large data sets as is the expected use case in pandas, all of
    that data cannot be stored inside the cache. It typically takes about three clock
    cycles or instruction phases to access level 1 cache and at each level exponentially
    increases in latency. To access the level 3 cache, it takes about 21 clock cycles,
    and if the data we wish to load is not in any of the caches and it has to go all
    the way to main memory to load it, it takes anywhere from 150 to 400 clock cycles.
    At around 21 clock cycles, the performance hit incurred by accessing the level
    3 cache will likely exceed the number of pipelines in our core. If we have to
    delay the instructions in our pipeline until the data is retrieved without re-ordering
    to pad the delay, that could stall our entire program for 21 clock cycles. 21
    clock cycles of delay on a 4 GHz processor is about 5.25 ns. This might seem insignificant
    and it is if we only incur this delay a couple times in our program. However,
    keep in mind we are typically operating on megabytes of data in pandas, and since
    not all of that is going to fit in the caches, we will likely incur many performance
    hits like this. In fact, we''re even more likely to incur larger performance hits
    all the way out to main memory if running an operation over the entire data set.'
