    ## 本章小结


    在本章中，我们介绍了几种最流行的加载器及其选项，但还有更多加载器可供选择。请务必阅读你所使用的特定加载器的文档，了解在加载过程中有哪些可用的规范化功能。如果没有，你可能需要自行编写一些自定义代码。请记住，性能提升可以通过减少内存开销以及减少加载和规范化过程中的步骤来实现。pandas
    提供了许多方法来提高规范化和加载性能，具体取决于你在特定情况下的瓶颈。在章节 [5](#487367_1_En_5_Chapter.xhtml) 中，我们将探讨在数据加载和规范化之后，如何将数据重塑为所需的
    DataFrame 格式。


    脚注 [1](#487367_1_En_5_Chapter.xhtml#Fn1_source) [2](#487367_1_En_5_Chapter.xhtml#Fn2_source)


    # 5. pandas 中的基本数据转换


    pandas 库拥有一个庞大的 API，提供了多种数据转换方法。在本章中，我们将介绍一些在 pandas 中转换数据最强大、最流行的方法。


    ## 数据透视与数据透视表


    数据透视（`pivot`）和数据透视表（`pivot_table`）非常流行，尤其对初学者具有吸引力，因为它们功能强大。然而，它们的强大功能是以性能为代价的。虽然
    `pivot` 是作为数据规范化步骤的一部分来初步转换 DataFrame 的优秀工具，但在数据分析阶段不应频繁使用。列表 [5-1](#487367_1_En_5_Chapter.xhtml#PC1)
    展示了如何使用 `pivot_table` 将原始检查数据转换为餐厅及其平均检查分数的聚合格式。请注意，在列表 [5-1](#487367_1_En_5_Chapter.xhtml#PC1)
    中，聚合函数被显式指定为 `np.mean`，尽管这是不必要的，因为 `np.mean` 是默认值。`pivot` 本质上是在执行 `groupby`，根据需要应用聚合函数，并将结果重新组织成新的表格格式。


    ```python

    >> df

    restaurant  location    date       score

    Diner       (4, 2)      02/18      90

    Pandas      (5, 4)      04/18      55

    Diner       (4, 2)      05/18      100

    Pandas      (5, 4)      01/18      76

    >> df = df.pivot_table(

    values=[''score''],

    index=["restaurant","location"],

    aggfunc=np.mean

    )

    >> df

    score

    restaurant  location

    Diner       (4, 2)         95

    Pandas      (5, 4)         66

    ```


    *列表 5-1 使用 `pivot_table` 计算每家餐厅的平均检查分数*


    列表 [5-1](#487367_1_En_5_Chapter.xhtml#PC1) 中存在一些性能问题。`pivot_table` 没有限制内存复制的选项，因此每次使用时都会创建一个全新的
    DataFrame。如果你的 DataFrame 非常大，这可能会对程序性能造成重大影响。在内部，`pivot_table` 会按唯一的餐厅和位置组合对数据进行分组，这需要时间，特别是在组合数量很大的情况下。如果这是作为数据规范化步骤的一部分使用的，那么它比在程序的数据分析过程中多次使用要好得多。这是因为唯一分组和复制所有内存的性能损失只会发生一次，而不是在程序中发生多次。最好一次性规范化和定位
    DataFrame，使其能够优化你计划对其执行的所有分析，而不是将其保留在某种未优化的原始形式中，并在每个分析步骤中重新定位它。请注意，如果 DataFrame
    已经按唯一值分组，我们可以像列表 [5-2](#487367_1_En_5_Chapter.xhtml#PC2) 那样运行 `groupby` 来计算平均分数，这将会快两倍。我们将在章节
    [7](#487367_1_En_7_Chapter.xhtml) 中深入讨论 `groupby` 的性能。其他分析很可能需要按唯一餐厅分组的数据，因此此示例中的分组至少应该是规范化步骤的一部分，这样就没有必要使用
    `pivot_table` 了。


    ```python

    >> df

    date        score

    restaurant  location

    Diner       (4, 2)     02/18       90

    04/18       55

    Diner       (4, 2)     05/18       100

    01/18       76

    >> df = df[["score"]].groupby(["restaurant","location"]).mean()

    >> df

    restaurant  location     score

    Diner       (4, 2)       95

    Pandas      (5, 4)       66

    ```


