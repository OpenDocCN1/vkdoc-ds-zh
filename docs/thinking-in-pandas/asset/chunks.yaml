- fmt: '# Using groupby correctly


    When starting out, you may be inclined to do something like Listing [7-1](#487367_1_En_7_Chapter.xhtml#PC1)
    where you cluster your data into groups, then loop over each group, and run some
    aggregate. This however results in terrible performance because just as we saw
    in Chapter [6](#487367_1_En_7_Chapter.xhtml), we are looping in Python and not
    in C. If instead you call the aggregate function directly off the `groupby` as
    in Listing [7-2](#487367_1_En_7_Chapter.xhtml#PC2), the groups will be passed
    into the aggregate function and the looping will occur in C.


    ```

    >> arrivals_by_destination

    number

    date    place

    2015    LON    10

    2015    BER    20

    2015    LON    5

    2016    LON    10

    2016    BER    15

    2016    BER    10

    >> arrivals_by_destination["total"] = \

    arrivals_by_destination.groupby(["date","place"]).sum()

    >> arrivals_by_destination

    number total

    date    place

    2015    LON    10     15

    2015    BER    20     20

    2015    LON    5      15

    2016    LON    10     10

    2016    BER    15     25

    2016    BER    10     25

    Listing 7-2

    Calculating total number of arrivals to each destination per year using groupby

    ```


    ```

    >> arrivals_by_destination

    number

    date    place

    2015    LON    10

    2015    BER    20

    2015    LON    5

    2016    LON    10

    2016    BER    15

    2016    BER    10

    >> groups = arrivals_by_destination.groupby(["date","place"])

    >> for idx, grp in groups:

    arrivals_by_destination.loc[idx, "total"] = \

    grp["number"].sum()

    >> arrivals_by_destination

    number total

    date    place

    2015    LON    10     15

    2015    BER    20     20

    2015    LON    5      15

    2016    LON    10     10

    2016    BER    15     25

    2016    BER    10     25

    Listing 7-1

    Calculating total number of arrivals to each destination per year by looping over
    groups

    ```


    The difference in performance between Listing [7-1](#487367_1_En_7_Chapter.xhtml#PC1)
    and Listing [7-2](#487367_1_En_7_Chapter.xhtml#PC2) is proportional to the number
    of groups. With just 8 groups, the performance of Listing [7-1](#487367_1_En_7_Chapter.xhtml#PC1)
    is twice as slow as Listing [7-2](#487367_1_En_7_Chapter.xhtml#PC2), and with
    16 groups, it’s four times as slow. Note in both these examples, we are starting
    with a pre-indexed `DataFrame`. This means the groups have already been pre-computed
    so the `groupby` does not have to calculate all the groups again but just reuse
    the existing groups in the index. This is a huge timesaver, particularly if you
    are going to be doing a lot of `groupby` operations over the columns in the index.


    You may encounter a `groupby` scenario where you need a custom function that isn’t
    built-in off the `groupby` object. This, however, is not the time to give in to
    looping. What you are implementing when you loop over the groups is the same performance
    as if you called `apply` on the `groupby` object itself and passed in your custom
    function. If you find yourself in a situation like this, consult Chapter [6](#487367_1_En_6_Chapter.xhtml)
    on `apply` and implement your custom function in Cython.


    # Indexing


    Working with a sorted index provides a substantial speedup when there are many
    different values in each index. You may encounter the warning `PerformanceWarning:
    indexing past lexsort depth may impact performance.` This is referring to the
    number of levels in an index that are sorted lexically or alphabetically.


    When accessing an unsorted index, pandas has `O(n)` performance since it has to
    search the entire index for the index value as is demonstrated in Figure [7-1](#487367_1_En_7_Chapter.xhtml#Fig1).
    When accessing a sorted index, pandas has `O(log(n))` performance as it uses binary
    search to find the index value such as in Figure [7-2](#487367_1_En_7_Chapter.xhtml#Fig2).
    When the index is unique, it uses a hash lookup which has `O(1)` performance as
    in Figure [7-3](#487367_1_En_7_Chapter.xhtml#Fig3). This can make a huge difference
    when `n`, the number of values in the index, is very large which is why unique
    indexes result in the fastest performance. It’s worth noting that just as is the
    case in Listing [7-2](#487367_1_En_7_Chapter.xhtml#PC2), a unique index cannot
    always be achieved, so the best performance we can get in those scenarios is with
    a sorted multi-index.


    ![../images/487367_1_En_7_Chapter/487367_1_En_7_Fig3_HTML.jpg](images/487367_1_En_7_Chapter/487367_1_En_7_Fig3_HTML.jpg)


    Figure 7-3


    Unique index access `O(1)`


    ![../images/487367_1_En_7_Chapter/487367_1_En_7_Fig2_HTML.jpg](images/487367_1_En_7_Chapter/487367_1_En_7_Fig2_HTML.jpg)


    Figure 7-2


    Sorted index access `O(log(n))`


    ![../images/487367_1_En_7_Chapter/487367_1_En_7_Fig1_HTML.jpg](images/487367_1_En_7_Chapter/487367_1_En_7_Fig1_HTML.jpg)


    Figure 7-1


    Unsorted index access `O(n)`


    # Avoiding groupby


    So far, we’ve explored how to get the best performance when running a `groupby`
    operation. Sometimes, however, the most performant option is to not use a `groupby`
    at all. If you find yourself having to do a lot of `groupby` operations on your
    `DataFrame`, you may consider re-orienting your `DataFrame` so that you don’t
    need to use `groupby`. Since `groupby` groups the data and then runs an aggregate
    function on each group of data, it is essentially doing a loop over the number
    of groups. Even though in the most performant case the groups are already pre-computed,
    the indexes are fast to access, and the looping is run at the C level, all of
    that still takes time. It’s much more performant in pandas to run simple row-wise
    or column-wise operations.


    Let’s take a look at how we can reformat the `DataFrame` in Listing [7-3](#487367_1_En_7_Chapter.xhtml#PC3)
    so that we can avoid using `groupby`. If we keep the index columns where they
    are but instead break out the multiple values for each index across the row, we
    can do two things to optimize this sum by groups operation. The first thing this
    does is eliminate the `groupby` sum operation and turn it into a simple sum across
    the columns. The second thing this does is make the indexes unique. Note we are
    taking on some additional memory overhead by doing this as the gaps in the data
    will be filled with zeros. Integers, however, take up little space even in a very
    large `DataFrame` so the overall performance speedup is worth the additional memory
    usage.


    ```

    >> arrivals_by_destination

    number          0      1

    date    place

    2015    BER    20      0

    2015    LON    10      5

    2016    BER    15      10

    2016    LON    10      0

    >> arrivals_by_destination["total"] = \

    arrivals_by_destination.sum()

    Listing 7-3

    Calculating total number of arrivals to each destination without using groupby

    ```


    Listing [7-2](#487367_1_En_7_Chapter.xhtml#PC2) is approximately 8 times slower
    than Listing [7-3](#487367_1_En_7_Chapter.xhtml#PC3), whereas Listing [7-1](#487367_1_En_7_Chapter.xhtml#PC1)
    is 25 times slower. This is why it’s so important to carefully select the `DataFrame`
    format that best suits the operations you plan to perform on it. It can literally
    save you minutes of execution time.


    We’ve looked at how to use `groupby` most efficiently, with pre-indexing and using
    an aggregate function directly off the `groupby` object instead of looping. We’ve
    also covered how to reformat your `DataFrame` so that you don’t need to use a
    `groupby` and can use a more performant row- or column-wise operation. Unfortunately,
    there isn’t one easy catch-all `DataFrame` format or `groupby` method that can
    be applied to all use cases. But you should now have an understanding and a repertoire
    of methods to help you solve your particular `groupby` problem in the most efficient
    and simplest way possible.'
