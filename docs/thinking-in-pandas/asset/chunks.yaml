    `Transpose` 是少数几个提供不重复数据选项（名为 `copy`）的 `DataFrame` 重塑函数之一。话虽如此，`copy=False` 并不一定意味着数据不会被重复，我们将在第
    9 章中更详细地解释。数据是否被重复取决于多种因素，这些因素最终归结为数据的新形状是否可以按原样重用底层的 `NumPy` 数组，还是必须创建新的 `NumPy`
    数组。回想一下，`NumPy` 数组必须都是相同类型。这意味着如果你要转置的 `DataFrame` 的行和列具有相同的类型，那么它很可能能够重用现有的 `NumPy`
    数组。如果不是，它将不得不复制内存并重新构建它们。这意味着 `Transpose` 应该仅在绝对必要时使用，理想情况下作为数据标准化步骤的一部分。


    从所有这些数据转换函数中得出的结论是，数据转换的成本非常高，在理想的程序中应该只在标准化阶段进行。在数据分析过程中应谨慎使用。如果你发现在每个数据分析步骤中都需要进行大量转换，那么你应该重新思考标准化后的
    `DataFrame` 的方向。在下一章中，我们将探讨 `apply` 方法，并研究何时应该使用以及何时不应该使用它，同时还会介绍性能更高的替代方案。


    # 6. `apply` 方法


    `apply` 是 `pandas` 中最常被错误使用的函数之一。很可能如果你正在使用它，你本不应该这样做。这是因为 `apply` 将函数“应用”到数据集中的每一行或每一列，有效地打破了使用
    `pandas` 的基本规则之一：不要迭代数据集。在本章中，我们将探讨何时 `apply` 是正确的选择，并在不适合使用时提供替代方案。


    ## 何时不应使用 `apply`


    对于那些熟悉基本编程功能的人来说，迭代是一种熟悉的数据操作方式。我们心里想：我想对每一行或每一列运行此操作，因此 `apply` 看起来非常友好。然而，这种组织问题的方式在
    `pandas` 中是完全错误的。许多用于处理关系数据库的原理也适用于 `pandas`。当你对数据库中的数据执行操作时，你不是逐行执行，而是定义一个范围；在
    `pandas` 中也是如此。当对数据集进行操作时，你定义所有要操作的元素，然后提供操作。最简单的形式可能类似于 `df["col 1"] + df["col
    2"]`，而在更复杂的情况下，可能类似于 `df.where(100 > df >= 90, "A")`。


    `pandas` 有许多内置函数用于执行数据计算操作。附录中提供了完整的列表。这些计算通常直接转换为在 `C` 中运行的 `NumPy` 函数，这使得它们的性能远高于等效的
    `apply` 操作。它们可以直接从 `pandas` `DataFrame` 以及 `pandas` `Series` 对象（`pandas` `DataFrame`
    的一列或一行）中访问。


    一个简单的 `apply` 示例见清单 6-1。我们向其传递 `sum` 函数，指定要应用函数的轴，然后得到每行的和。


    ```

    >> df = pd.DataFrame([[4, 9],[6, 7]], columns=[''A'', ''B''])

    >> df

    A  B

    0  4  9

    1  6  7

    >> df.apply(np.sum, axis=1)

    0    13

    1    13

    Listing 6-1

    Example of using apply

    ```


    虽然清单 6-1 中的示例很简单，并且说明了*如何*使用 `apply`，但它使用的用例*本身*是非常错误的。这是一个典型的不应该使用 `apply` 的例子，因为
    `np.sum` 函数是 `DataFrame` 本身的内置函数，因此应该使用内置函数，因为它的性能更高。但为什么它的性能如此之高呢？让我们更详细地探讨一下。


    为什么内置的 `pandas` `sum` 比将 `NumPy` `sum` 应用于每一行的性能高得多，答案在于对行的迭代发生在哪里。清单 6-2 中的以下循环是
    `pandas` `apply` 方法的底层实现。


    ```

    for i, v in enumerate(series_gen):

    results[i] = self.f(v)

    keys.append(v.name)

    Listing 6-2

    Main loop in the pandas apply implementation

    ```


    如清单 6-2 所示，对行的遍历发生在 `Python` 中。你可以看到 `series_gen`，它是将要应用函数（保存在 `self.f` 中）的列或行。这与内置的
    `pandas` `sum` 函数相反，后者简单地将一个 `ndarray` 传递给 `NumPy` `sum` 函数进行操作，然后该函数在 `C` 中迭代并求和数据，并将结果
    `ndarray` 返回给 `Python`。这种在 `C` 中而非 `Python` 中对数据进行操作的过程被称为向量化。本质上，向量化能够比在 `Python`
    中运行操作获得巨大的速度提升。由于第 3 章中介绍的所有原因，在 `C` 中循环和执行操作的性能远高于 `Python`。然而，速度提升并不总是仅仅来自于在
    `C` 中循环。

