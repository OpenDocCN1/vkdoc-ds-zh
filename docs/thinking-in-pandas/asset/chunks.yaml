    ```\n\n专用字符串数据类型（`StringDtype`）的引入本身也是巨大的进步。在`pandas 0.25`中，字符串存储为对象，这不仅占用大量空间，而且由于对象可以容纳任何类型，无法保证数据一致性。使用新的显式`StringDtype`后，它将占用更少的空间，保证列内的一致性，并且会被识别为文本类型，而不是将文本值与所有属于通用对象容器类型的值混为一谈。列表\
