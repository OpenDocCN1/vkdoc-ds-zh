  raw: 'Vectorized operations allow you to apply a mathematical operation to a sequence
    of numbers. For example, if you want to add 4 to each element in an ndarray, you
    specify that using the syntax arr + 4\. In the case of NumPy ufuncs (see the Appendix
    for a comprehensive list), they actually make use of specialized vector registers
    in the CPU itself. Vector registers are registers that can contain a series of
    values, and when an operation is performed on them, it is performed on each value
    in the register at once. So, what would have been a loop over an array of eight
    values and eight consecutive add instructions in the CPU becomes one add instruction
    operating on eight values in the CPU. As you can imagine, this leads to a huge
    speedup. Vectorization will also pad arrays of mismatched dimensions in order
    to make the dimensions match such that an operation can run. This process is known
    as broadcasting. When you add a new column in pandas via df[“new_col”] = 4, 4
    is broadcast to have the same number of rows as all the other columns in the DataFrame.
    Similarly, aggregation functions like sum operate over a sequence of numbers using
    vectorization. What all of this boils down to is apply is not a vectorized operation—it
    loops in Python and should be avoided whenever possible. It becomes effectively
    the same thing as iterating over the rows and applying the function yourself as
    illustrated in Listing [6-3](#487367_1_En_6_Chapter.xhtml#PC3).


    ```

    results = [0]*len(df)

    for i, v in df.itterrows():

    results[i] = v.sum()

    df["sum"] = results

    Listing 6-3

    Equivalent of apply implemented manually

    ```


    In fact, the performance of this custom implementation of apply illustrated in
    Listing [6-3](#487367_1_En_6_Chapter.xhtml#PC3) vs. Listing [6-1](#487367_1_En_6_Chapter.xhtml#PC1)
    where apply is used directly yields slightly better performance simply because
    there is less overhead to get to the guts of the operation when implementing this
    simple custom alternative.


    How much slower is apply vs. using a built-in pandas operation though? Let’s look
    at some concrete examples and compare the performance. Comparing the performance
    of the apply example in Listing [6-1](#487367_1_En_6_Chapter.xhtml#PC1) to the
    alternative method in Listing [6-4](#487367_1_En_6_Chapter.xhtml#PC4) when performed
    on 100,000 rows, the apply function averages about 8.5 seconds compared to running
    the sum function directly off the pandas DataFrame which averages about 0.4 milliseconds.


    ```

    df.sum(axis=1)

    Listing 6-4

    Alternative implementation of Listing 6-1

    ```


    Let’s look at another example. Say you have a data set with one column named A
    but that column has incomplete data and you wish to replace the values that are
    missing with the max of columns B and C. This could be implemented using apply
    as demonstrated in Listing [6-5](#487367_1_En_6_Chapter.xhtml#PC5), or this could
    be implemented in a much more performant way using the where method demonstrated
    in Listing [6-6](#487367_1_En_6_Chapter.xhtml#PC6).


    ```

    df["A"].where(

    ~df["A"].isna(),

    df[["B", "C"]].max(axis=1),

    inplace=True,

    )

    Listing 6-6

    Replacing missing data using the where method

    ```


    ```

    def replace_missing(series):

    if np.isnan(series["A"]):

    series["A"] = max(series["B"], series["C"])

    return series

    df = df.apply(replace_missing, axis=1)

    Listing 6-5

    Replacing missing data using apply

    ```


    The where method replaces falsey values with the value provided in the second
    parameter. This means, in Listing [6-6](#487367_1_En_6_Chapter.xhtml#PC6), all
    the NaN values are being replaced with the max of columns B and C. Note we are
    also specifying inplace=True so that this replace happens on the current DataFrame
    as opposed to creating a new DataFrame that would result in duplicated memory.


