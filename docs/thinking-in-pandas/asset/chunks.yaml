    \n图 8-3  \n顺序内存访问与随时间推移的对象属性访问对比\n\n## `NumExpr`如何提升性能\n\n`NumExpr`通过在大小与缓存一致的`pandas`\
    \ DataFrame 子集上运行计算，来提升`pandas`的性能。以表达式`(A + B) * 3`为例，其中`A`和`B`是`pandas` DataFrame。没有`NumExpr`时，`A\
    \ + B`的每一行会被逐个相加，存储到临时结构中，然后再乘以 3。使用`NumExpr`时，会先对能放入缓存的前`n`行数据进行相加并乘以 3，然后再处理接下来的`n`行。通过这种方式，`NumExpr`能减少内存加载和存储的次数，正如我们在“计算机体系结构”一节中学到的，这两者是\
    \ CPU 和计算机程序的瓶颈。清单 8-2 演示了这一点。\n\n注意清单 8-2 中的缓存包含三个缓存行（足以容纳`A`、`B`和`C`数据的 64 行）。虽然这远小于真实世界的一级缓存（通常能容纳约\
    \ 128 个缓存行），但它简化了示例。这意味着，在计算完`A + B`的前 64 行结果后，必须将结果存回内存，以便为接下来的 64 行`A`和`B`及其结果腾出空间。注意，通过使用`NumExpr`在缓存大小的块上执行计算的方法，我们减少了加载和存储的次数。同样要注意，清单\
    \ 8-2 中的示例是以顺序的伪代码 CPU 指令形式编写的（即，这些并非在核心内实际执行的指令；在现实世界中，它们很可能为了抵消“计算机体系结构”一节中讨论的内存加载延迟而被重新排序）。\n\
    \n```python\n# NumExpr is not installed.        # NumExpr is installed.\nC = (\
    \ A + B ) * 3                  C = pd.eval(\"( A + B ) * 3\")\nload A[0:64]  \
    \                     load A[0:64]\nload B[0:64]                       load B[0:64]\n\
    add C[0], A[0], B[0]               add C[0], A[0], B[0]\nmult C[0], C[0], 3\n\
    add C[1], A[1], B[1]               add C[1], A[1], B[1]\nmult C[1], C[1], 3\n\
    .\n.\nadd C[63], A[63], B[63]           add C[63], A[63], B[63]\nmult C[63], C[63],\
    \ 3\nstore C[0:64]                     store C[0:64]\nload A[64:128]         \
    \           load A[64:128]\nload B[64:128]                    load B[64:128]\n\
    add C[64], A[64], B[64]           add C[64], A[64], B[64]\nmult C[64], C[64],\
    \ 3\nadd C[65], A[65], B[65]           add C[65], A[65], B[65]\nmult C[65], C[65],\
    \ 3\n.\n.\nadd C[127], A[127], B[127]        add C[127], A[127], B[127]\nmult\
    \ C[127], C[127], 3\nstore C[64:128]                   store C[64:128]\nload C[0:64]\n\
    mult C[0], C[0], 3\nmult C[1], C[1], 3\n.\n.\nmult C[3], C[63], 3\nstore C[0:64]\n\
    load C[64:128]\nmult C[64], C[64], 3\n.\n.\nmult [127], C[127], 3\nstore C[64:128]\n\
    ```\n清单 8-2  \n有和没有`NumExpr`时，评估`pandas`表达式的 CPU 伪代码指令\n\n注意，要一次性在`pandas` DataFrames\
    \ 的块上运行这样的评估，我们必须事先将整个表达式传达给`NumExpr`。`(A + B) * 3`必须以某种方式指定，以便`NumExpr`知道它可以将这些操作合并在一起。这正是`query`和`eval`发挥作用的地方。`eval`允许你将一个复杂的表达式作为字符串指定，以通知`NumExpr`它可以一次处理\
    \ DataFrame(s)的一个块。`query`实际上是`eval`的另一种形式，因为它在底层调用了`eval`。\n\n根据具体的计算、数据的形状和大小、操作系统以及你使用的硬件，你可能会发现使用`NumExpr`和`eval`实际上会导致显著的性能下降。在盲目地将计算合并到`eval`或`query`之前，最好先进行性能比较。`NumExpr`实际上只对超过三级缓存大小的计算表现良好。通常，这意味着数组元素数量大于\
    \ 256,000。正如我们所见，与其他`pandas`函数一样，它也要求数据类型的计算能够轻松地转化为 C 语言。因此，例如，日期时间（datetimes）不会带来性能提升，因为它们无法在`NumExpr`中求值。同样值得注意的是，直接使用`NumExpr`通常比在`pandas`中使用`eval`或`query`性能更好。清单\
    \ 8-3 演示了这样一个例子。\n\n```python\nimport pandas as pd\nimport numpy as np\nimport\
    \ numexpr as ne\nnrows, ncols = 1000000, 1\ndf1, df2, df3, df4 = [pd.DataFrame(\n\
    np.random.randn(nrows, ncols)) for _ in range(4)]\n# Calculate the sum using normal\
    \ syntax.\ndf_sum1 = df1 + df2 + df3 + df4\n# Calculate the sum using eval so\
    \ that NumExpr optimizes it.\ndf_sum2 = pd.eval(\"df1 + df2 + df3 + df4\")\n#\
    \ Calculate the sum using NumExpr directly.\na1, a2, a3, a4 = (\ndf1.to_numpy(),\
    \ df2.to_numpy(), df3.to_numpy(), df4.to_numpy()\n)\ndf_sum3 = ne.evaluate(\"\
    a1 + a2 + a3 + a4\")\n```\n清单 8-3  \n一个示例，其中`eval`比典型的`pandas`语法配合`NumExpr`更慢\n\
    \n`df_sum1`的计算速度是`df_sum2`的两倍。这通常与我们的预期相反，因为`df_sum2`是使用`NumExpr`计算的。然而，如果我们直接使用`NumExpr`而不是通过`pandas`的`eval`，我们会发现`df_sum3`的速度大约是`df_sum1`的四倍。这是由于`pandas`的`eval`函数本身带来的开销造成的。在`eval`内部，它将环境包装成一个局部变量和全局变量的字典，并使它们对`NumExpr`可访问。这包括将\
    \ DataFrames 转换为 NumPy 数组。所有这些都需要相当多的开销，以至于最终比不使用`eval`和`NumExpr`还要慢。很多情况下，正如这里所示，显式地将\
    \ DataFrames 转换为 NumPy 数组，并直接在这些转换后的 DataFrames 上调用`NumExpr`，速度要快得多。\n\n现在我们已经了解了`NumExpr`如何在硬件层面提升组合计算的`pandas`性能，接下来让我们看看`NumPy`和`NumExpr`的另一个依赖——BLAS——是如何利用硬件来优化其计算的。\n"
- fmt: '## BLAS 和 LAPACK


    `NumPy` 在底层使用基本线性代数子程序（BLAS）来实现非常高效的线性代数运算，例如矩阵乘法和向量加法。这些子程序通常用汇编语言编写——这是一种非常底层且性能卓越的语言，与
    CPU 指令高度相似。线性代数包（LAPACK）提供用于求解线性方程的例程。它通常用 Fortran 编写，并且与 NumPy 一样，在底层调用 BLAS。有很多
    BLAS 和 LAPACK 的实现可用，例如 Netlib BLAS 和 LAPACK、OpenBLAS、Intel MKL、Atlas、BLIS 等，每种都有各自的优缺点。不过，让我们更深入地探讨
    BLAS 如何提高 pandas 操作的性能。


    BLAS 通过使用单指令多数据流（SIMD）指令来优化矩阵操作，这些指令利用了硬件中的向量寄存器。所有 CPU 都有寄存器，用于保存 CPU 指令需要操作的数据。向量寄存器只是这些寄存器的一种特殊类型。它们允许在单个寄存器中存储多个数据片段，当对数据执行操作时，该操作会同时对寄存器中的每个数据片段执行。SIMD
    指令的优势在于，您可以一次性将一堆数据加载到寄存器中，并对它们并发执行相同的操作，而不必对每个元素依次执行相同的操作。通过使用 SIMD 指令，我们减少了完成计算所需的
    CPU 时钟周期数。例如，如果一个向量寄存器能够容纳四个数据元素，那么我们就把时钟周期数从四个减少到了一个。这意味着如果您有一个如列表 8-4 所示的 `y`
    和 `x` 的点积，那么您可以将其指定为一系列如列表 8-5 所示的 SIMD 指令。请注意，`y` 和 `x` 的数据首先被加载到向量寄存器 `r1` 和
    `r2` 中，然后计算点积并将结果存储在寄存器 `r1` 中。


    ![../images/487367_1_En_8_Chapter/487367_1_En_8_Figa_HTML.jpg](images/487367_1_En_8_Chapter/487367_1_En_8_Figa_HTML.jpg)


    ```

    product

    Listing 8-4

    Dot

    ```


    ```

    load vr2, Y1, Y2, Y3, Y4

    load vr1, X1, X2, X3, X4

    dot r1, vr2, vr1

    Listing 8-5

    Dot product as SIMD pseudo-instruction

    ```


    我们在这里遗漏了一个重要细节，即通常情况下，数据只有在内存中是连续的时候才能被加载到向量寄存器中。这对于大多数复杂的向量操作（通常发生在一个矩阵的行与另一个矩阵的列之间，反之亦然）来说会带来一个小问题。`BLAS`
    与 Python 相反，它的数组是列优先存储，而不是行优先存储。`BLAS` 也没有二维数组——它们被存储为一维数组。列表 8-6 展示了一个 Python
    数组的示例，以及它在 BLAS 中是如何存储的。


    ```

    Python                   BLAS

    y = [[1, 2], [3, 4]]     y = [1, 3, 2, 4]

    y[row][col]              y[col * num_cols + row]

    Listing 8-6

    Comparison of a matrix representation in Python vs. BLAS

    ```


    所以，回到列表 8-5 中的点积示例，因为这两个数组都表示为一维数组，尽管一个是行集合，另一个是列集合，但它们都具有连续的内存地址，因此都可以加载到向量寄存器中。这个连续内存地址的问题只会在处理更复杂的矩阵和更复杂的操作时才会出现，因此让我们看一个更复杂的例子。


    执行矩阵乘法有多种方法。其中一种使用点积的方法如图 8-4 所示。取第一个矩阵的行与第二个矩阵的列的点积，将得到矩阵乘法结果中单个元素的值。


    ![../images/487367_1_En_8_Chapter/487367_1_En_8_Fig4_HTML.jpg](images/487367_1_En_8_Chapter/487367_1_En_8_Fig4_HTML.jpg)


    Figure 8-4


    Matrix multiplication using dot product


    在图 8-4 中，我们现在遇到了一个情况，即无法将第一个矩阵的行加载到向量寄存器中，因为其内存不是连续的。但是请注意，如果我们对矩阵进行转置，使行变成列，那么内存就变成连续的了，我们就可以将第一个矩阵的行加载到向量寄存器中。


    但是，如果矩阵非常大呢？如果我们将一个 1000 x 1000 的矩阵进行转置，它无法全部放入缓存中，并且在需要到主内存读写数据时会导致巨大的延迟。`BLAS`
    通过将矩阵数据分解成块来对此进行优化，就像 NumExpr 一样。图 8-5 显示了一个示例。通过这样做，`BLAS` 能够将转置后的矩阵全部保留在缓存中，并且还能在每个块上重用那个占位符转置缓冲区。这样做的优势不仅在于将转置后的缓冲区保留在缓存中，还在于不必为每个块重新分配新的缓冲区。它只需用当前块的新转置数据覆盖上一个块的缓冲区即可。


    ![../images/487367_1_En_8_Chapter/487367_1_En_8_Fig5_HTML.png](images/487367_1_En_8_Chapter/487367_1_En_8_Fig5_HTML.png)


    Figure 8-5


    Breaking up a large matrix into blocks


    通过将问题分解成块，`BLAS` 还能够利用多核。它可以在不同的核心上运行每个块，这也节省了时间。


    `BLAS` 用于加速计算的另一种技术是循环展开。这是将一个循环转换为一串重复指令的过程。循环展开消除了预测分支的需要，以及因错误预测分支而可能产生的分支预测惩罚。回想一下，在数据流水线中，指令的加载和处理可能发生在条件指令检查的结果之前。因此，硬件会在确切知道结果之前，尽力正确地预测该条件的结果以及将要执行哪个分支。循环展开还避免了将指令指针跳转到指令内存中的新位置，这有可能避免缓存未命中以及需要到主内存加载不在指令缓存中的指令。它还避免了每次迭代开始时的条件指令检查，从而节省了
    CPU 周期。通过展开循环，您可能还能够重新排序计算，使得使用相同内存的计算被放置在相近的位置，从而减少寄存器加载指令。


    总之，`BLAS` 使用了许多技术来提高线性代数运算的性能：`SIMD` 指令、分块、循环展开、多线程等等。还有许多可用的 `BLAS` 实现，为某些类型的
    pandas 程序选择性能更优的选项可能会产生巨大影响。


    如果您发现自己使用 pandas 进行了大量的线性代数运算，您可以考虑切换到性能更优的 `BLAS` 实现。`np.config_show()` 将显示 `NumPy`
    当前使用的 `BLAS` 实现。`Netlib BLAS` 实现不完全支持多核，并且往往比替代方案性能差得多。其他实现（如 `OpenBLAS`）完全支持多核，并且是开源且免费的。从
    Anaconda 2.5 或更高版本开始，`Intel MKL` 是默认的 `BLAS` 库，尽管是专有的且体积较大，但它经过高度优化，并且可以免费使用。'
  raw: '## BLAS and LAPACK


    NumPy uses Basic Linear Algebra Subprograms (BLAS) underneath to implement very
    performant linear algebra operations such as matrix multiplication and vector
    addition. These subprograms are typically written in assembly—a very low-level
    and performant language that closely resembles CPU instructions. The Linear Algebra
    Package (LAPACK) provides routines for solving linear equations. It is typically
    written in Fortran and, just like NumPy, calls into BLAS underneath. There are
    many implementations of BLAS and LAPACK available such as the Netlib BLAS and
    LAPACK, OpenBLAS, Intel MKL, Atlas, BLIS, and so on, each with their own pros
    and cons. But, let’s explore more deeply how BLAS improves the performance of
    pandas operations.


    BLAS optimizes matrix operations by using Single Instruction Multiple Data (SIMD)
    instructions that make use of vector registers in the hardware. All CPUs have
    registers that hold the data that a CPU instruction needs to operate on. Vector
    registers are just a special type of those registers. They allow storage of multiple
    pieces of data in a single register, and when an operation is run on the data,
    it is run on each piece of data in the register at once. The advantage of SIMD
    instructions is that you can load a bunch of data into a register and run the
    same operation on it concurrently rather than having to run the same operation
    on each element consecutively. By using a SIMD instruction, we reduce the number
    of CPU clock cycles that it takes to complete the computation. For example, if
    a vector register is able to hold four data elements, then we have reduced the
    number of clock cycles from four to one. This means if you have a dot product
    of y and x as in Listing [8-4](#487367_1_En_8_Chapter.xhtml#PC4), then you can
    specify it as a series of SIMD instructions as in Listing [8-5](#487367_1_En_8_Chapter.xhtml#PC5).
    Note the y and x data is first loaded into the vector registers r1 and r2, and
    then the dot product is computed and stored in register r1.


    ![../images/487367_1_En_8_Chapter/487367_1_En_8_Figa_HTML.jpg](images/487367_1_En_8_Chapter/487367_1_En_8_Figa_HTML.jpg)


    ```

    product

    Listing 8-4

    Dot

    ```


    ```

    load vr2, Y1, Y2, Y3, Y4

    load vr1, X1, X2, X3, X4

    dot r1, vr2, vr1

    Listing 8-5

    Dot product as SIMD pseudo-instruction

    ```


    We’ve left out one important detail here which is that typically data can only
    be loaded into vector registers if it is sequential in memory. This poses a slight
    problem for most complex vector operations which typically happen on rows of one
    matrix and columns of another matrix or vice versa. BLAS is the opposite of Python
    in that its arrays are column majored instead of row majored. BLAS also does not
    have two-dimensional arrays—they are stored as a single-dimensional array. Listing
    [8-6](#487367_1_En_8_Chapter.xhtml#PC6) shows an example of a Python array and
    how it would be stored in BLAS.


    ```

    Python                   BLAS

    y = [[1, 2], [3, 4]]     y = [1, 3, 2, 4]

    y[row][col]              y[col * num_cols + row]

    Listing 8-6

    Comparison of a matrix representation in Python vs. BLAS

    ```


    So, going back to the dot product example in Listing [8-5](#487367_1_En_8_Chapter.xhtml#PC5),
    because these arrays are both represented as a single-dimensional array, despite
    one being a bunch of rows and the other being a bunch of columns, they both have
    contiguous memory addresses and so they both can be loaded into the vector registers.
    This issue of consecutive memory addresses only comes into play when working with
    more complex matrices and more complex operations, so let’s look at a more complex
    example.


    There are many ways to perform a matrix multiply. One way, using dot product is
    shown in Figure [8-4](#487367_1_En_8_Chapter.xhtml#Fig4). Taking the dot product
    of the first matrix’s row with the second matrix’s column will yield the value
    of a single element in the result of the matrix multiply.


    ![../images/487367_1_En_8_Chapter/487367_1_En_8_Fig4_HTML.jpg](images/487367_1_En_8_Chapter/487367_1_En_8_Fig4_HTML.jpg)


    Figure 8-4


    Matrix multiplication using dot product


    In Figure [8-4](#487367_1_En_8_Chapter.xhtml#Fig4), we now run into a situation
    where loading a row of the first matrix into a vector register is not possible
    as the memory is not contiguous. Note, however, if we transpose the matrix so
    that the rows become the columns, then the memory is contiguous and we can load
    the row of the first matrix into a vector register.


    But what happens if the matrix is very large? If we transposed a 1000 by 1000
    matrix, it would not all fit in the cache and it would result in huge delays when
    it had to go out to main memory to write and read the data. BLAS optimizes for
    this by breaking up the matrix data into blocks just like NumExpr. An example
    is shown in Figure [8-5](#487367_1_En_8_Chapter.xhtml#Fig5). By doing this, BLAS
    is able to keep the transposed matrix all in the cache and also reuse that placeholder
    transpose buffer on each block. This is advantageous not just for keeping the
    transposed buffer in the cache but also because it doesn’t have to keep re-allocating
    a new buffer for each block. It simply overwrites the buffer of the previous block
    with the new transposed data for the current block.


    ![../images/487367_1_En_8_Chapter/487367_1_En_8_Fig5_HTML.png](images/487367_1_En_8_Chapter/487367_1_En_8_Fig5_HTML.png)


    Figure 8-5


    Breaking up a large matrix into blocks


    By breaking up the problem into blocks, BLAS is also able to take advantage of
    multiple cores. It can run each of the blocks on a different core which also saves
    time.


    Another technique BLAS uses to speed up the computation is loop unrolling. This
    is when you convert a loop into a series of repeated instructions. Loop unrolling
    removes the need to predict branches and potentially incur a branch prediction
    penalty for mispredicting a branch. Recall that in the data pipeline instructions
    are loaded and processed potentially before the result of a conditional instruction
    check occurs. So, the hardware tries its best to correctly predict the result
    of that conditional and which branch will be taken before it knows for certain.
    Loop unrolling also avoids having to jump the instruction pointer to a new location
    in instruction memory which potentially avoids cache misses and having to go out
    to main memory to load instructions that aren’t in the instruction cache. It also
    avoids the conditional instruction check at the beginning of each iteration which
    saves CPU cycles. By unrolling a loop, you may also be able to re-order computations
    such that the computations that use the same memory are placed close together,
    thus reducing register load instructions.


    In summary, BLAS uses a lot of techniques to improve performance of linear algebra
    operations: SIMD instructions, blocking, loop unrolling, threading, and so on.
    There are also many implementations of BLAS available, and choosing a more performant
    option for certain types of pandas programs may have a huge impact.


    If you find yourself doing a lot of linear algebra operations with pandas, you
    may consider switching to a more performant BLAS implementation. np.config_show()
    will show you what BLAS implementation NumPy is currently using. The Netlib BLAS
    implementation does not fully support multiple cores and tends to be much less
    performant than the alternatives. Other implementations like OpenBLAS fully support
    multiple cores and are open source and freely available. As of Anaconda 2.5 or
    later, Intel MKL is the default BLAS library and, though proprietary and large,
    is highly optimized and available for free.'
