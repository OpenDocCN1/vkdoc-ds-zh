- fmt: "# 确保 NumPy 使用优化依赖\n\n通过确保 NumPy 使用经过优化的依赖项`NumExpr`和`BLAS`，可以显著提升某些`pandas`操作的性能。这些库会根据你运行的具体硬件优化操作，以确保你获得尽可能最佳的性能。但需要注意它们何时能提升性能、何时不能。在最后一章中，我们将探讨`pandas\
    \ 1.0`及未来的发展。\n\n# 9. pandas 的未来\n\n目前有越来越多的包构建在`pandas`之上或与之兼容。其中一些包（如`sklearn-pandas`）与`scikit-learn`等其他包集成，以便利用`DataFrame`进行机器学习。另一些包（如`Plotly`）则提供交互式绘图功能和在线协作。近年来，`pandas`还积极向其他语言扩展。现在已有`pandas.js`包和一个`Ruby`包装器，使`Ruby`用户能够调用`Python`的`pandas`\
    \ API。此外，还有一个名为`Weld`的新兴`LLVM`项目，旨在更大规模地优化数据分析。它采用与`NumExpr`类似的方法，但规模更大。其思想是将所有数据分析操作懒散地组合在一起，仅在需要实际结果时才执行。这使得操作能够在更宏大的规模上针对并行计算和内存加载进行优化。\n\
    \n## `pandas 1.0`\n\n`pandas`社区一直在为`pandas 1.0`（自`pandas`初始版本以来的首次重大升级）而努力工作。它解决了之前版本中的许多不足。\n\
    \n`pandas 1.0`新增了一种`pandas`专用的`NA`类型。这种新类型将使所有列类型的空值保持一致。你可能还记得第[4](#487367_1_En_4_Chapter.xhtml)章中的内容，在`pandas\
    \ 0.25`中，`NaN`必须存储为浮点数；它们不能是布尔值、整数或字符串。以前，无法加载包含`NaN`的列并将其作为整数类型——你必须在加载后将其转换为整数。现在，使用`pandas\
    \ 1.0`，可以加载包含`NaN`的列并将其作为整数类型。列表[9-1](#487367_1_En_9_Chapter.xhtml#PC1)是之前文本中列表[4-15](#487367_1_En_4_Chapter.xhtml#PC15)的相同示例；只是现在它利用了`pandas\
    \ 1.0`中新增的可空整数类型。请注意，这种新类型的内存使用量比数据类型指示的多一个字节。因此，当类型设置为`Int16Dtype`时，每个元素实际上占用三个字节而不是两个。额外的字节对应于`IntegerArray`实现中的一个布尔掩码，用于标记哪些值是`NA`。\n\
    \n```\n>> data = io.StringIO(\n\"\"\"\nid,age,height,weight\n129237,32,5.4,126\n\
    123083,20,6.1,\n123087,25,4.5,unknown\n\"\"\"\n)\n>> df = pd.read_csv(\ndata.\n\
    dtype={\n'id': np.int32,\n'age': np.int8,\n'height': np.float16,\n'weight': pd.Int16Dtype()},\n\
    na_values=[\"unknown\"],\nindex_col=[0],\n)\nage    height  weight\nid\n129237\
    \   32     5.4     126\n123083   20     6.1     \n123087   25     4.5     \n>>\
    \ df.memory_usage(deep=True)\nIndex     24\nage        3\nheight     6\nweight\
    \     9\n>> df.dtypes\nage       int8\nheight    float16\nweight    Int16\n>>\
    \ df.index.dtype\ndtype('int64')\nListing 9-1\nExample of how pandas handles NaNs\
    \ in the data in 1.0\n```\n\n随着`pd.NA`的引入，以及可空布尔数组和专用字符串数据类型的增加，所有数据类型的空值都可以使用相同的类型一致表示。这一看似简单的更改还修复了因空值类型不一致而导致的\
    \ API 中微妙的差异。例如，在列表[9-2](#487367_1_En_9_Chapter.xhtml#PC2)中，`Categorical.min()`现在返回期望的最小值，而不是`NaN`。\n\
    \n```\n>> pd.Categorical([1, 3, 5, np.nan], ordered=True).min()\nNaN\n>> pd.Categorical([1,\
    \ 3, 5, pd.NA], ordered=True).min() # 1.0\n\nListing 9-2\nBehavior change of pandas\
    \ 1.0 when computing the minimum of a Categorical\n```\n\n专用字符串数据类型（`StringDtype`）的引入本身也是巨大的进步。在`pandas\
    \ 0.25`中，字符串存储为对象，这不仅占用大量空间，而且由于对象可以容纳任何类型，无法保证数据一致性。使用新的显式`StringDtype`后，它将占用更少的空间，保证列内的一致性，并且会被识别为文本类型，而不是将文本值与所有属于通用对象容器类型的值混为一谈。列表[9-3](#487367_1_En_9_Chapter.xhtml#PC3)展示了新的`pandas`字符串类型节省了多少内存。使用新的字符串类型时，每个值仅占用\
    \ 8 字节，与之前每个对象值占用约 60 字节的版本相比，内存占用大幅减少。"
  raw: "By ensuring NumPy is using optimized dependencies NumExpr and BLAS, you can\
    \ significantly improve performance of certain pandas operations. These libraries\
    \ optimize operations to the particular hardware you are running on to ensure\
    \ you are getting the best performance possible. But be mindful of when they will\
    \ and will not boost performance. In the final chapter, we’ll look at the future\
    \ of pandas 1.0 and beyond.\n\n# 9. The Future of pandas\n\nThere are an increasing\
    \ number of packages that are built on top of or compatible with pandas. Some\
    \ of these like sklearn-pandas integrate with other packages like scikit-learn\
    \ to utilize DataFrames for machine learning. Others, like Plotly, provide interactive\
    \ plotting capabilities and online collaboration. pandas has recently made the\
    \ push in the last couple years to branch out into other languages. There is now\
    \ a pandas.js package and a ruby wrapper that enables ruby users to call into\
    \ the Python pandas API. There is also a push to optimize data analysis at a more\
    \ global scale using an up-and-coming LLVM called Weld. It takes an approach similar\
    \ to NumExpr but on an even larger scale. The idea is to combine all the data\
    \ analysis operations together lazily and only run them when an actual result\
    \ is needed. This allows the operations to be optimized for parallel compute and\
    \ loading of memory on a much grander scale.\n\n## `pandas 1.0`\n\nThe pandas\
    \ community has been feverishly working on pandas 1.0, the first big upgrade since\
    \ the initial release of pandas. It addresses a lot of the shortcomings in previous\
    \ versions.\n\npandas 1.0 adds a new pandas specific NA type. This new type will\
    \ make null values consistent across all types of columns. As you may recall from\
    \ Chapter [4](#487367_1_En_4_Chapter.xhtml), NaNs in pandas 0.25 must be stored\
    \ as floats; they cannot be Booleans, integers, or strings. Previously, it was\
    \ not possible to load a column with NaNs in it as an integer type—you had to\
    \ convert it to an integer after it was loaded. Now with pandas 1.0, it’s possible\
    \ to load a column with NaNs as an integer type. Listing [9-1](#487367_1_En_9_Chapter.xhtml#PC1)\
    \ is the same example presented earlier in the text in Listing [4-15](#487367_1_En_4_Chapter.xhtml#PC15);\
    \ only now it’s making use of the new nullable integer type available in pandas\
    \ 1.0\\. Note the memory usage of this new type takes up one more byte than is\
    \ indicated by the data type. So, while the type is set to an Int16Dtype, each\
    \ element actually takes up three bytes instead of two. The extra byte corresponds\
    \ to a Boolean mask in the IntegerArray implementation which marks which values\
    \ are NA.\n\n```\n>> data = io.StringIO(\n\"\"\"\nid,age,height,weight\n129237,32,5.4,126\n\
    123083,20,6.1,\n123087,25,4.5,unknown\n\"\"\"\n)\n>> df = pd.read_csv(\ndata.\n\
    dtype={\n'id': np.int32,\n'age': np.int8,\n'height': np.float16,\n'weight': pd.Int16Dtype()},\n\
    na_values=[\"unknown\"],\nindex_col=[0],\n)\nage    height  weight\nid\n129237\
    \   32     5.4     126\n123083   20     6.1     \n123087   25     4.5     \n>>\
    \ df.memory_usage(deep=True)\nIndex     24\nage        3\nheight     6\nweight\
    \     9\n>> df.dtypes\nage       int8\nheight    float16\nweight    Int16\n>>\
    \ df.index.dtype\ndtype('int64')\nListing 9-1\nExample of how pandas handles NaNs\
    \ in the data in 1.0\n```\n\nWith the introduction of pd.NA and the addition of\
    \ nullable Boolean arrays and a dedicated string data type, the null values can\
    \ be consistently represented using the same type across all data types. This\
    \ seemingly simple change also improves subtle inconsistencies across the API\
    \ due to having an inconsistent null type, for example, Categorical.min now returns\
    \ the expected minimum value instead of NaN as shown in Listing [9-2](#487367_1_En_9_Chapter.xhtml#PC2).\n\
    \n```\n>> pd.Categorical([1, 3, 5, np.nan], ordered=True).min()\nNaN\n>> pd.Categorical([1,\
    \ 3, 5, pd.NA], ordered=True).min() # 1.0\n\nListing 9-2\nBehavior change of pandas\
    \ 1.0 when computing the minimum of a Categorical\n```\n\nThe introduction of\
    \ a dedicated string data type (StringDtype) is also huge in itself. In pandas\
    \ 0.25, strings were stored as objects which take up a lot of space and do not\
    \ guarantee data consistency because an object can hold any type. With the new\
    \ explicit StringDtype, it will take up less space, guarantee consistency within\
    \ the column, and also identify as a text type rather than lumping text values\
    \ in with all values that are of the generic object container type. Listing [9-3](#487367_1_En_9_Chapter.xhtml#PC3)\
    \ demonstrates how much less memory the new pandas string type uses. When using\
    \ the new string type, each value takes up only 8 bytes, which is a huge decrease\
    \ in memory compared to previous versions where each object value took up about\
    \ 60 bytes."
