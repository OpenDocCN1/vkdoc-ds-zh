- fmt: "在清单[2-12](#487367_1_En_2_Chapter.xhtml#PC12)中，我们正在使用更准确的历史数据更新现代建筑记录。历史记录包含确切的建成日期，我们希望用其更新仅包含估算日期的现代记录。首先，我们使用左合并将更准确的新建成日期作为一个新列添加到数据集中（图[2-3](#487367_1_En_2_Chapter.xhtml#Fig3)）。在这种情况下，左合并非常有用，因为我们只关心更新现存建筑的现代记录中的建成日期。注意，我们还利用了`suffixes`参数为列名提供名称。这样做的好处是，在完成操作后，我们不必将列重命名为与原始列相同的名称。合并完成后，我们需要将两个`established`列的数据合并在一起。这是通过用现代记录中的值替换旧`established`列中的所有缺失值（即`NaN`）来完成的。因此，如果历史记录有建成日期，我们就使用它；否则，我们回退到现代记录的建成日期。最后，删除现代记录中原始的`established`列，转而使用包含来自现代记录和历史记录合并值的新列。\n\
    \n![../images/487367_1_En_2_Chapter/487367_1_En_2_Fig3_HTML.png](images/487367_1_En_2_Chapter/487367_1_En_2_Fig3_HTML.png)\n\
    \n图2-3  \n左合并的维恩图\n\n```\n>> import pandas as pd\n>> building_records_1844\nbuilding\
    \          established\nGrande Hotel      1832\nJone's Farm       1842\nPublic\
    \ Library    1836\nMarietta House    1823\n>> building_records_2020\nbuilding\
    \             established\nSam's Bakery         1962\nGrande Hotel         1830\n\
    Public Library       1836\nMayberry's Factory   1924\n>> merged_records = pd.merge(\n\
    building_records_2020,\nbuilding_records_1844,\nhow='left',\nright_on=\"building\"\
    ,\nleft_on=\"building\",\nsuffixes=(\"_2000\", \"\"),\n)\n>> merged_records\n\
    building             established_2000     established\nSam’s Bakery         1962\
    \                 NaN\nGrande Hotel         1830                 1832\nPublic\
    \ Library       1835                 1836\nMayberry’s Factory   1924         \
    \        NaN\n>> merged_records[\"established\"].fillna(\nmerged_records[\"established_2000\"\
    ],\ninplace=True,\n)\n>> del merged_records[\"established_2000\"]\n>> merged_records\n\
    building             established\nSam's Bakery         1962\nGrande Hotel    \
    \     1832\nPublic Library       1836\nMayberry's Factory   1924\n清单2-12  \n使用左合并以更准确的历史数据更新现代记录\n\
    ```\n\n在清单[2-13](#487367_1_En_2_Chapter.xhtml#PC13)中，我们计划进行第三次医疗试验，并且希望生成一份符合条件的参与者名单。只有参与过之前的试验a或b（但不能同时参与两者）的参与者才有资格参加第三次试验。为了生成符合条件的患者名单，在合并试验a和试验b的患者数据时，我们需要使用反连接方法（图[2-4](#487367_1_En_2_Chapter.xhtml#Fig4)）。`pandas`的`merge`方法提供了一个名为`indicator`的参数，它会在结果`DataFrame`中添加一个名为`_merge`的附加列，用于报告键是仅存在于左侧（`left_only`）、仅存在于右侧（`right_only`），还是两个`DataFrame`中都有（`both`）。在我们希望执行某种非常规合并的特定情况下，这非常有用。通过使用`query`方法，我们可以选择`_merge`值不是`both`的行，然后删除`_merge`列。这可以像清单[2-13](#487367_1_En_2_Chapter.xhtml#PC13)末尾所示在一行内完成，但为了让你了解其工作原理，我们先将其分解为两个步骤。\n\
    \n![../images/487367_1_En_2_Chapter/487367_1_En_2_Fig4_HTML.png](images/487367_1_En_2_Chapter/487367_1_En_2_Fig4_HTML.png)\n\
    \n图2-4  \n反连接的维恩图\n\n```\n>> import pandas as pd\n>> trial_a_records\nname\npatient\n\
    230858       John\n237340       May\n240932       Catherine\n124093       Ahmed\n\
    >> trial_b_records\nname\npatient\n210858       Abi\n237340       May\n240932\
    \       Catherine\n154093       Julia\n>> both_trials = pd.merge(\ntrial_a_records,\n\
    trial_b_records,\nhow='outer',\nindicator=True,\nright_index=True,\nleft_index=True,\n\
    on=\"name\",\n)\nname            _merge\npatient\n230858       John          \
    \  left_only\n237340       May             both\n240932       Catherine      \
    \ both\n124093       Ahmed           left_only\n210858       Abi             right_only\n\
    154093       Julia           right_only\n>> both_trials.query('_merge != \"both\"\
    ').drop('_merge', 1)\nname\npatient\n230858       John\n124093       Ahmed\n210858\
    \       Abi\n154093       Julia\n>> both_trials = pd.merge(\ntrial_a_records,\n\
    trial_b_records,\nhow='outer',\nindicator=True,\nright_index=True,\nleft_index=True,\n\
    on=\"name\",\n).query('_merge != \"both\"').drop('_merge', 1)\n清单2-13  \n使用反连接合并方法消除同时参与两项试验的患者\n\
    ```\n\n## 使用`join`方法合并`DataFrame`\n\n`pandas`的`join`方法只是`merge`的一个包装器，它提供相同的基本合并方法：左连接、右连接、外连接和内连接。它允许你自动对多索引`DataFrame`执行合并操作，而无需指定要合并的索引。执行左连接时，它会自动使用左侧`DataFrame`的索引进行连接；对于右侧`DataFrame`也是如此。由于`join`是在`DataFrame`上执行的，而`merge`则需要显式传入两个`DataFrame`，因此`join`的默认行为是合并到“右侧”`DataFrame`的索引上。在这种情况下，“右侧”是传入的`DataFrame`。这与`merge`的默认行为（内连接）相反。\n\
    \n使用`merge`时，可以不指定显式的键进行合并。在合并两个具有相同数据的`DataFrame`，并且不希望左右`DataFrame`出现重复列，而只是简单地将两个数据集合并在一起的情况下，`merge`比`join`更可取。因为`join`在底层调用了`merge`，它显式地指定了要合并的键，从而消除了对于共享相同列名的`DataFrame`不输出重复列的可能性。这里要遵循的基本规则是：如果不在索引上进行连接，则使用`merge`。\n\
    \n清单[2-14](#487367_1_En_2_Chapter.xhtml#PC14)沿用了之前清单[2-10](#487367_1_En_2_Chapter.xhtml#PC10)中的一个内连接合并示例，但与之前公共建筑记录完全匹配的示例不同，这次存在差异。在这种情况下，使用`join`有几个好处。首先，数据已经根据唯一的建筑名称建立了索引，`join`会自动识别这些索引并用于连接这两个数据集。其次，数据中存在差异，因此我们希望输出`DataFrame`能够并排显示两个`DataFrame`的列，以便进行比较。\n\
    \n```\n>> import pandas as pd\n>> building_records_1844\nestablished\nbuilding\
    \         location\nGrande Hotel     (4,5)        1831\nJone's Farm      (1,2)\
    \        1842\nPublic Library   (6,4)        1836\nMarietta House   (1,7)    \
    \    1823\n>> building_records_2020\nestablished\nbuilding           location\n\
    Sam's Bakery        (5,1)        1962\nGrande Hotel        (4,5)        1830\n\
    Public Library      (6,4)        1835\nMayberry's Factory  (3,2)        1924\n\
    >> building_records_1844.join(\nbuilding_records_2020,\nhow='inner',\nrsuffix=\"\
    _2000\",\n)\nestablished   established_2000\nbuilding          location\nGrande\
    \ Hotel      (4,5)     1831          1830\nPublic Library    (6,4)     1836  \
    \        1835\n清单2-14  \n使用内连接突出显示1844年建成并于2020年仍存在的建筑在建成日期上的差异\n```"
