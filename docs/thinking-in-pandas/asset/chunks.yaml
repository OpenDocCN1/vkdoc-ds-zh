    ## Combining DataFrames using the join method


    The pandas join method is just a wrapper around merge, and it provides the same
    basic merging methods: left, right, outer, and inner. It allows you to perform
    merge operations on multi-index DataFrames automatically without needing to specify
    the indexes to merge on. When doing a left join, it automatically uses the indexes
    from the left DataFrame to join on, and the same is true for the right DataFrame.
    Since join is performed on a DataFrame as opposed to merge where you pass in both
    DataFrames explicitly, join’s default is to merge on the “right” DataFrame’s indexes.
    In this case, “right” is the passed in DataFrame. This is in opposition to merge’s
    default which is an inner join.


    Using merge, it is possible to not specify an explicit key to merge on. In cases
    where you are merging two DataFrames with the same data and do not wish to have
    duplicated columns for the left and right DataFrames but simply merge the two
    data sets together, merge is preferable over join. Because join calls merge underneath,
    it explicitly specifies the keys to merge on, thus eliminating the possibility
    of not outputting duplicated columns for DataFrames that share common column names.
    A basic rule to follow here is use merge if you are not joining on the index.


    Listing [2-14](#487367_1_En_2_Chapter.xhtml#PC14) plays off of a previous inner
    merge example in Listing [2-10](#487367_1_En_2_Chapter.xhtml#PC10), but unlike
    the previous example where the records of the buildings in common matched, this
    time there are discrepancies. A join is desirable for a couple reasons in this
    scenario. Firstly, the data has already been indexed according to the unique building
    and join will automatically pick up the indexes and use those to join the two
    sets of data. Secondly, there are discrepancies in the data, and thus we wish
    to see columns from both DataFrames side by side in the output DataFrame so we
    can compare them.


    ```

    >> import pandas as pd

    >> building_records_1844

    established

    building         location

    Grande Hotel     (4,5)        1831

    Jone''s Farm      (1,2)        1842

    Public Library   (6,4)        1836

    Marietta House   (1,7)        1823

    >> building_records_2020

    established

    building           location

    Sam''s Bakery        (5,1)        1962

    Grande Hotel        (4,5)        1830

    Public Library      (6,4)        1835

    Mayberry''s Factory  (3,2)        1924

    >> building_records_1844.join(

    building_records_2020,

    how=''inner'',

    rsuffix="_2000",

    )

    established   established_2000

    building          location

    Grande Hotel      (4,5)     1831          1830

    Public Library    (6,4)     1836          1835

    Listing 2-14

    Highlighting discrepancies in established date of 1844 buildings that are still
    standing in 2020 using an inner join

