- fmt: 'As developers, we live in an age where compute resources are considered cheap.
    If a program is CPU heavy, it’s easier for us to simply upgrade our AWS instance
    to a larger machine and pay an extra couple bucks than it is to invest our time
    to root cause our program and address the overtaxing of the CPU. While it is wonderful
    to have such readily available compute resources, it also makes us lazy developers.
    We often forget that 50 years ago computers took up whole rooms and took several
    seconds just to add two numbers together. A lot of programs are simply fast enough
    and still meet performance requirements even though they are not written in the
    most optimal way. Compute resources for big data processing take up a significant
    amount of energy compared to a simple web service; they require large amounts
    of memory and CPU, often requiring large machines to run at their resource limits
    over multiple hours. These programs are taxing on the hardware, potentially resulting
    in faster aging, and require a large amount of energy both to keep the machines
    cool and also to keep the computation running. As developers we have a responsibility
    to write efficient programs, not just because they are faster and cost less but
    also because they will reduce compute resources which means less electricity,
    less hardware, and in general more sustainability.


    It is the goal of this book in the coming chapters to assist developers in implementing
    performant `pandas` programs and to help them develop an intuition for choosing
    efficient data processing techniques. Before we deep dive into the underlying
    data structures that `pandas` is built on, let’s take a look at how some existing
    impactful projects utilize `pandas`.


    ## How `pandas` helped build an image of a black hole


    `pandas` was used to normalize all the data collected from several large telescopes
    to construct the first image of a black hole. Since the black hole was so far
    away, it would have required a telescope as big as the Earth to capture an image
    of the black hole directly, so, instead, scientists came up with a way to piece
    one together using the largest telescopes we have today. In this international
    collaboration, the largest telescopes on Earth were used as a representative single
    mirror of a larger theoretical telescope that would be needed to capture the image
    of a black hole. Since the Earth turns, each telescope could act as more than
    one mirror, filling in a significant portion of the theoretical larger telescope
    image. Figure [1-2](#487367_1_En_1_Chapter.xhtml#Fig2) demonstrates this technique.
    These pieces of the larger theoretical image were then passed through several
    different image prediction algorithms trained to recognize different types of
    images. The idea was if each of these different image reproduction techniques
    outputs the same image, then they could be confident that the image of the black
    hole was the real image (or reasonably close).


    ![../images/487367_1_En_1_Chapter/487367_1_En_1_Fig2_HTML.jpg](images/487367_1_En_1_Chapter/487367_1_En_1_Fig2_HTML.jpg)


    Figure 1-2


    Using the telescopes on Earth to represent pieces of a larger theoretical telescope


    The library is open source and posted on GitHub.^([¹](#fn1)) The images from radio
    telescopes were captured on hard disks and flown across the world to a lab at
    the Massachusetts Institute of Technology where they were loaded into `pandas`.
    The data was then normalized, synchronizing the captures from the telescopes in
    time, removing things like interference from the Earth’s atmosphere, and calculating
    things like absolute phase of a single telescope over time. The data was then
    sent into the different image prediction algorithms, and finally the first image
    of a black hole was born.^([²](#fn2))


    ## How `pandas` helps financial institutions make more informed predictions about
    the future market


    Financial advisors are always looking for an edge up on the competition. Many
    financial institutions use `pandas` along with machine learning libraries to determine
    whether new data points may be relevant in helping financial advisors make better
    investment decisions. New data sets are often loaded into `pandas`, normalized,
    and then evaluated against historical market data to see if the data correlates
    to trends in the market. If it does, the data is then passed along to the advisors
    to be used in making financial investment decisions. It may also be passed along
    to their customers so they can make more informed decisions as well.


    Financial institutions also use `pandas` to monitor their systems. They look for
    outages or slowness in servers that might impact their trade performance.


    ## How `pandas` helps improve discoverability of content


    Companies collect tons of data on users every day. For broadcast companies'' viewership,
    data is particularly relevant both for showing relevant advertisements and for
    bringing the right content in front of interested users. Typically, the data collected
    about users is loaded into `pandas` and analyzed for viewership patterns in the
    content they watch. They may look for patterns such as when they watch certain
    content, what content they watch, and when they are finished watching certain
    content and looking for something new. Then, new content or relevant product advertisements
    are recommended based on those patterns. There has been a lot of work recently
    to also improve business models so that users don’t get put into a bubble (i.e.,
    recommended content isn’t just the same type of content they’ve been watching
    before or presenting the same opinions). Often this is done by avoiding content
    silos from the business side.


    Now that we’ve looked at some interesting use cases for `pandas`, in Chapter [2](#487367_1_En_2_Chapter.xhtml)
    we’ll take a look at how to use `pandas` to access and merge data.


    Footnotes [1](#487367_1_En_1_Chapter.xhtml#Fn1_source)   [2](#487367_1_En_1_Chapter.xhtml#Fn2_source)


    # 2. Basic Data Access and Merging


    There are many ways of accessing and merging `DataFrames` with `pandas`. This
    chapter will go over the basic methods for getting data out of a `DataFrame`,
    creating a sub-`DataFrame`, and merging `DataFrames` together.'
  raw: 'As developers, we live in an age where compute resources are considered cheap.
    If a program is CPU heavy, it’s easier for us to simply upgrade our AWS instance
    to a larger machine and pay an extra couple bucks than it is to invest our time
    to root cause our program and address the overtaxing of the CPU. While it is wonderful
    to have such readily available compute resources, it also makes us lazy developers.
    We often forget that 50 years ago computers took up whole rooms and took several
    seconds just to add two numbers together. A lot of programs are simply fast enough
    and still meet performance requirements even though they are not written in the
    most optimal way. Compute resources for big data processing take up a significant
    amount of energy compared to a simple web service; they require large amounts
    of memory and CPU, often requiring large machines to run at their resource limits
    over multiple hours. These programs are taxing on the hardware, potentially resulting
    in faster aging, and require a large amount of energy both to keep the machines
    cool and also to keep the computation running. As developers we have a responsibility
    to write efficient programs, not just because they are faster and cost less but
    also because they will reduce compute resources which means less electricity,
    less hardware, and in general more sustainability.


    It is the goal of this book in the coming chapters to assist developers in implementing
    performant pandas programs and to help them develop an intuition for choosing
    efficient data processing techniques. Before we deep dive into the underlying
    data structures that pandas is built on, let’s take a look at how some existing
    impactful projects utilize pandas.


    ## How pandas helped build an image of a black hole


    pandas was used to normalize all the data collected from several large telescopes
    to construct the first image of a black hole. Since the black hole was so far
    away, it would have required a telescope as big as the Earth to capture an image
    of the black hole directly, so, instead, scientists came up with a way to piece
    one together using the largest telescopes we have today. In this international
    collaboration, the largest telescopes on Earth were used as a representative single
    mirror of a larger theoretical telescope that would be needed to capture the image
    of a black hole. Since the Earth turns, each telescope could act as more than
    one mirror, filling in a significant portion of the theoretical larger telescope
    image. Figure [1-2](#487367_1_En_1_Chapter.xhtml#Fig2) demonstrates this technique.
    These pieces of the larger theoretical image were then passed through several
    different image prediction algorithms trained to recognize different types of
    images. The idea was if each of these different image reproduction techniques
    outputs the same image, then they could be confident that the image of the black
    hole was the real image (or reasonably close).


    ![../images/487367_1_En_1_Chapter/487367_1_En_1_Fig2_HTML.jpg](images/487367_1_En_1_Chapter/487367_1_En_1_Fig2_HTML.jpg)


    Figure 1-2


    Using the telescopes on Earth to represent pieces of a larger theoretical telescope


    The library is open source and posted on GitHub.^([¹](#fn1)) The images from radio
    telescopes were captured on hard disks and flown across the world to a lab at
    the Massachusetts Institute of Technology where they were loaded into pandas.
    The data was then normalized, synchronizing the captures from the telescopes in
    time, removing things like interference from the Earth’s atmosphere, and calculating
    things like absolute phase of a single telescope over time. The data was then
    sent into the different image prediction algorithms, and finally the first image
    of a black hole was born.^([²](#fn2))


    ## How pandas helps financial institutions make more informed predictions about
    the future market


    Financial advisors are always looking for an edge up on the competition. Many
    financial institutions use pandas along with machine learning libraries to determine
    whether new data points may be relevant in helping financial advisors make better
    investment decisions. New data sets are often loaded into pandas, normalized,
    and then evaluated against historical market data to see if the data correlates
    to trends in the market. If it does, the data is then passed along to the advisors
    to be used in making financial investment decisions. It may also be passed along
    to their customers so they can make more informed decisions as well.


    Financial institutions also use pandas to monitor their systems. They look for
    outages or slowness in servers that might impact their trade performance.


    ## How pandas helps improve discoverability of content


    Companies collect tons of data on users every day. For broadcast companies'' viewership,
    data is particularly relevant both for showing relevant advertisements and for
    bringing the right content in front of interested users. Typically, the data collected
    about users is loaded into pandas and analyzed for viewership patterns in the
    content they watch. They may look for patterns such as when they watch certain
    content, what content they watch, and when they are finished watching certain
    content and looking for something new. Then, new content or relevant product advertisements
    are recommended based on those patterns. There has been a lot of work recently
    to also improve business models so that users don’t get put into a bubble (i.e.,
    recommended content isn’t just the same type of content they’ve been watching
    before or presenting the same opinions). Often this is done by avoiding content
    silos from the business side.


    Now that we’ve looked at some interesting use cases for pandas, in Chapter [2](#487367_1_En_2_Chapter.xhtml)
    we’ll take a look at how to use pandas to access and merge data.


    Footnotes [1](#487367_1_En_1_Chapter.xhtml#Fn1_source)   [2](#487367_1_En_1_Chapter.xhtml#Fn2_source)


    # 2. Basic Data Access and Merging


    There are many ways of accessing and merging DataFrames with pandas. This chapter
    will go over the basic methods for getting data out of a DataFrame, creating a
    sub-DataFrame, and merging DataFrames together.'
  trans: '

    作为开发者，我们生活在一个计算资源被视为廉价的年代。如果某个程序对 CPU 的消耗很高，我们更倾向于简单地将 AWS 实例升级到更大的机器，每月多付几美元，而不愿投入时间去根因分析并解决
    CPU 过载的问题。虽然拥有如此随手可得的计算资源是件好事，但它也让我们变得懒惰。我们常常忘记，50 年前，计算机占据整间屋子，光是两个数字相加就需要几秒钟。许多程序即便没有以最优方式编写，也足够快，仍然能满足性能要求。与简单的网络服务相比，大数据处理所消耗的计算资源要庞大得多；它们需要大量的内存和
    CPU，通常需要大型机器在数小时内满负荷运行。这些程序对硬件要求严苛，可能导致硬件加速老化，并且无论是冷却机器还是维持计算运行，都需要消耗大量能源。作为开发者，我们有责任编写高效的代码，这不仅因为这样能更快、成本更低，还因为能减少计算资源的使用，这意味着更少的电力、更少的硬件，总体上也更具可持续性。


    本书后续章节的目标就是帮助开发者实现高性能的 `pandas` 程序，并培养他们选择高效数据处理技术的直觉。在深入探讨 `pandas` 所依赖的基础数据结构之前，让我们先来看看一些现有且影响深远的项目是如何使用
    `pandas` 的。


    ## `pandas` 如何帮助构建黑洞图像


    `pandas` 被用于将几个大型望远镜收集的所有数据进行标准化，以构建第一张黑洞图像。由于黑洞距离我们非常遥远，直接为其成像需要一台地球大小的望远镜，因此，科学家们想出了一个办法，利用我们现有最大的望远镜来拼接出图像。在这个国际合作项目中，地球上的最大望远镜被用作一个更大的理论望远镜的多个镜面。由于地球的自转，每个望远镜可以扮演多个镜面的角色，从而填补了理论大望远镜图像的很大一部分。图
    1-2 展示了这一技术。这些理论大图像的碎片随后被送入多个不同的、经过训练的能够识别不同类型图像的图像预测算法。其理念是，如果所有这些不同的图像重构技术都输出相同的图像，那么他们就可以确信这张黑洞图像是真实的（或相当接近真实）。


    ![../images/487367_1_En_1_Chapter/487367_1_En_1_Fig2_HTML.jpg](img/487367_1_En_1_Fig2_HTML.jpg)


    图 1-2


    利用地球上的望远镜代表一个更大理论望远镜的碎片


    该库是开源的，并发布在 GitHub 上。^(¹) 来自射电望远镜的图像被捕获到硬盘上，然后空运到麻省理工学院的一个实验室，在那里被加载到 `pandas`
    中。接着，数据被标准化处理，同步来自各望远镜在时间上的捕获，去除诸如地球大气层干扰等因素，并计算单个望远镜随时间变化的绝对相位等参数。随后，这些数据被送入不同的图像预测算法，最终，第一张黑洞图像诞生了。^(²)


    ## `pandas` 如何帮助金融机构对未来市场做出更明智的预测


    金融顾问总是在寻找竞争优势。许多金融机构使用 `pandas` 和机器学习库来判断新的数据点是否有助于金融顾问做出更好的投资决策。新的数据集通常被加载到 `pandas`
    中，进行标准化，然后与历史市场数据进行评估，以查看数据是否与市场趋势相关。如果存在关联，这些数据就会被传递给顾问，用于制定金融投资决策。它也可能会传递给客户，以便他们也能做出更明智的决策。


    金融机构也使用 `pandas` 来监控他们的系统。他们查找可能影响交易性能的服务器宕机或缓慢情况。


    ## `pandas` 如何帮助提升内容的可发现性


    公司每天都在收集海量的用户数据。对于广播公司的收视率而言，数据尤其重要，既用于展示相关广告，也用于将有价值的内容推送给感兴趣的用户。通常，收集到的用户数据会被加载到
    `pandas` 中，并分析观看内容的收视模式。他们寻找的模式包括：何时观看特定内容、观看什么内容、何时看完特定内容并寻找新内容。然后，根据这些模式推荐新内容或相关的产品广告。最近，人们也做了大量工作来改进商业模式，以避免用户陷入信息茧房（例如，推荐的内容不仅仅是他们之前看过的同类型内容或呈现相同观点）。通常，这通过避免业务层面的内容孤岛来实现。


    现在我们已经了解了 `pandas` 的一些有趣用例，在第 2 章中，我们将探讨如何使用 `pandas` 来访问和合并数据。


    脚注 1   2


    # 2. 基础数据访问与合并


    使用 `pandas` 访问和合并 `DataFrames` 有多种方法。本章将介绍从 `DataFrame` 中获取数据、创建子 `DataFrame`
    以及合并 `DataFrames` 的基本方法。

