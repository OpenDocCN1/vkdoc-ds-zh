    与`read_csv`类似，`read_json`有一个`chunksize`参数，允许您分块读取文件。但是，只有在`lines`选项也设置为`True`时才允许这样做，这意味着JSON格式是面向`records`的，但没有列表括号。清单[4-26](#487367_1_En_4_Chapter.xhtml#PC26)演示了这一点。


    ```

    >> data = io.StringIO(

    """

    {"location": "234unf923", "temp": 35.2}

    {"location": "340inf351", "temp": 32.5}

    {"location": "234abe045", "temp": 33.1}

    """

    )

    >> temperatures = pd.DataFrame({})

    >> reader = pd.read_json(

    data,

    lines=True,

    chunksize=2,

    )

    >> for chunk in reader:

    temperatures = temperatures.append(process(chunk))

    >> temperatures

    location       temp

    234unf923      35.200000

    340inf351      32.500000

    234abe045      33.100000

    Listing 4-26

    Loading the file in chunks

    ```


    默认情况下，JSON加载器根据列名（而不是像其他读取器那样查看值）来确定某些列是否类似日期。它接受一个`convert_dates`参数，该参数可以是一个列名列表或一个布尔值。如果设置为`True`，它会将以`_at`或`_time`结尾、以`timestamp`开头、或者名为`modified`或`date`的列转换为日期时间。要禁用自动检测日期列，可以将`keep_default_dates`设置为`False`。


    默认情况下，JSON加载器会尝试推断每个列和轴的类型，除非`orient`设置为`table`，在这种情况下，类型作为JSON模式的一部分提供。就像读取CSV文件一样，如果JSON文件中没有指定类型，那么提供类型可以节省大量内存。清单[4-27](#487367_1_En_4_Chapter.xhtml#PC27)展示了加载未指定类型的JSON文件时可能的内存占用，而清单[4-28](#487367_1_En_4_Chapter.xhtml#PC28)展示了指定了类型的同一JSON文件的内存占用。请注意，在清单[4-28](#487367_1_En_4_Chapter.xhtml#PC28)中，明确指定了类型，结果DataFrame的内存减少了约40%。


    ```

    >> data = io.StringIO(

    """

    {

    "birth": {

    "129237": "04/10/1999",

    "123083": "05/18/1989",

    },

    "height": {

    "129237": 5.4,

    "123083": 6.1,

    },

    "weight": {

    "129237": 126,

    "123083": 130,

    },

    }

    """

    )

    >> patient_info = pd.read_json(

    data,

    orient="columns",

    convert_dates=["birth"],

    dtype={"height": np.float16, "weight": np.int16},

    )

    birth          height  weight

    129237     1999-04-10     5.4     126

    123083     1989-05-18     6.1     130

    >> df.dtypes

    birth          datetime64[ns]

    height         float16

    weight         int16

