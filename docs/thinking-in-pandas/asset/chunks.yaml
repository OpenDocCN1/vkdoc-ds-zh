- fmt: '# CPython 解释器、Python 和 NumPy 的性能


    大多数开发者通常安装的 Python 解释器称为 CPython。它是推荐与 pandas 一起使用的解释器，因为 pandas 高度依赖 C 语言进行性能优化。CPython
    用 C 语言实现，并将 Python 代码转换为所谓的字节码（bytecode），这是一种在 Python 虚拟机上运行的中间低层格式。有许多不同的 Python
    解释器，包括 Jython、IronPython 和 PyPy，它们分别用 Java、C# 和 RPython（RPython 是 Python 的一个受限子集）实现。PyPy
    是一种即时编译器（Just-In-Time，JIT），这意味着它在运行时将 Python 代码编译为机器码。这与 CPython 相反，CPython 在
    Python 虚拟机上运行字节码并调用预编译的 C 扩展。PyPy 通常比 CPython 更快，因为它运行低层优化的机器码，而不是在 Python 虚拟机上解析字节码。不幸的是，PyPy
    目前并不完全支持 pandas。


    Python 是一种高级语言，这意味着它易于阅读且实现速度快。这也意味着它比某些低层语言慢，原因是这些自我管理的便利特性。这些便利特性包括垃圾回收器、全局解释器锁和动态类型，但它们并非没有代价。垃圾回收器负责释放不再使用的内存，以便可以再次使用。全局解释器锁（即
    GIL）保护对象不被多个线程同时访问。动态类型允许同一变量持有不同类型的值。由于 CPython 是用 C 语言实现的，它与 C 兼容，因此允许 Python
    调用用 C 编写的性能更高的扩展。但是为什么 C 语言比 Python 高效得多呢？Python 相对 C 较慢有几个原因：它是解释型而非编译型，它有一个全局解释器锁，它允许动态类型，并且它具有内置的垃圾回收器。


    将 Python 解释为字节码类似于将 C 编译为目标文件，只不过字节码在 Python 虚拟机上运行，而机器码在 CPU 上运行。在运行时解释 Python
    代码增加了额外的开销，使得 Python 通常比 C 运行得慢。解释过程分为几个阶段：词法分析器将 Python 代码转换为标记流；语法分析器进行语法分析；字节码生成器优化并将
    Python 代码转换为字节码（`.pyc` 文件）；字节码解释器解释字节码流并维护字节码解释器的状态。


    如果你曾经编辑过一个 Python 文件并重新运行程序，却发现程序没有使用你刚刚所做的更改，你就会理解 Python 解释器会将字节码缓存在 `.pyc`
    文件中。在重新运行之前删除 `.pyc` 文件会强制解释器将 Python 代码重新解释为字节码——本质上，就是强制 Python 解释器清除其字节码缓存。字节码缓存通过不重新将
    Python 代码解释为字节码（除非代码已更改），减少了运行时解释的开销。然而，在早于 3.3 的 Python 版本中，用于获取 `.py` 文件时间戳的方法与
    Windows 操作系统的时间戳不匹配，导致生成的时间戳比 `.pyc` 文件更年轻。这意味着解释器不会将 `.py` 文件重新解释为字节码。类似地，如果你删除了一个
    `.py` 文件，但仍然在代码中导入它，导入操作可能会继续工作，因为 `.pyc` 文件仍然存在于你的系统上。虽然这两个问题可能让你不想使用字节码缓存，但缓存在提高解释性能方面起着重要作用，并且通常会在后台运行，开发人员甚至察觉不到。字节码缓存对于第三方库尤其有利，这些库的代码已安装且预期不会更改，或者库所有者不希望暴露
    Python 源代码。


    Python 有一个全局解释器锁，大多数人称之为 GIL。为了理解 GIL 为何存在，你必须回到过去，探究 GIL 被发明时计算机科学领域正在发生什么。这一切始于线程的发明。预见到计算的未来，软件在多核
    CPU 出现之前就引入了多线程的概念。线程使程序能够并行运行操作同一内存空间的进程。这是提高 CPU 密集型计算性能的绝佳方法。


    例如，假设我们要计算名字"Tiffany"在列表中出现了多少次。你可以自己数出列表中"Tiffany"出现的次数，也可以将列表分成子列表，每个子列表交给一个朋友去数，每当有人看到"Tiffany"这个词时，就在白板上的运行总数上加一。在这个例子中，你和你的朋友们就是线程，白板上的计数就是共享内存。通常情况下，将问题分解成更小的块并使用线程来并行计算，比单线程计算整个任务要快。你可能会遇到的一个问题是，当你的一位朋友已经擦除了白板上的总数并正在更新时，你也想更新它。幸运的是，你很聪明，能意识到这一点，并在朋友完成更新总数后再尝试更新。然而，计算机需要被告知如何处理这种情况，或者说需要达到所谓线程安全的程度。如果软件遇到相同的情况，它只会简单地覆盖该值。这就是所谓的竞态条件。


    在图 [3-3](#487367_1_En_3_Chapter.xhtml#Fig3) 中，时间在 y 轴上表示为 t，有两个线程几乎同时想要增加总数。本例中的总数位于共享内存中，这意味着两个线程都可以访问该值。在这里，你可以看到线程
    1 首先增加了计数器，然后是线程 2。然而，线程 2 实际上并没有增加计数器，因为当它获取总数准备增加时，线程 1 的增量尚未生效。这导致最终结果比应有的总数少
    1（结果是 6，而不是 7）。


    ![../images/487367_1_En_3_Chapter/487367_1_En_3_Fig3_HTML.png](images/487367_1_En_3_Chapter/487367_1_En_3_Fig3_HTML.png)


    图 3-3'
  raw: '## The performance of the CPython interpreter, Python, and NumPy


    The Python interpreter that most developers typically install is called CPython.
    It is the interpreter that is recommended for use with pandas as pandas is highly
    dependent on C for performance optimizations. CPython is implemented in C and
    translates Python code into what’s called bytecode , an intermediate low-level
    format that is run on the Python Virtual Machine. There are many different Python
    interpreters including Jython, IronPython, and PyPy which are implemented in Java,
    C#, and RPython (a restricted subset of Python), respectively. PyPy is a Just-In-Time
    or JIT compiler, which means it compiles the Python code into machine code as
    it runs. This is in opposition to CPython that runs the bytecode on the Python
    Virtual Machine and calls into pre-compiled C extensions. PyPy is generally faster
    than CPython because it runs low-level optimized machine code as opposed to parsing
    the bytecode on the Python Virtual Machine. Unfortunately, PyPy does not fully
    support pandas at this time.


    Python is a high-level language, which means it’s easy to read and fast to implement.
    This also means it is slow compared to some lower-level languages because of all
    these self-managing niceties. These niceties include the garbage collector, the
    global interpreter lock, and dynamic typing, but they don’t come for free. The
    garbage collector is responsible for freeing memory that is no longer in use so
    that it can be used again. The global interpreter lock, also known as the GIL,
    protects objects from being accessed by multiple threads at the same time. Dynamic
    typing allows the same variable to hold different types of values. Because CPython
    is implemented in C, it is C compatible and thus allows Python to call into more
    performant extensions written in C. But why is C so much more performant than
    Python? There are a several reasons why Python is relatively slower than C; it
    is interpreted rather than compiled, it has a global interpreter lock, it allows
    dynamic typing , and it has a built-in garbage collector.


    Interpreting Python into bytecode is like compiling C into object files only bytecode
    is run on the Python Virtual Machine and machine code is run on the CPU. The interpretation
    of the Python code at runtime adds extra overhead that makes Python generally
    run slower than C. There are several phases of interpretation: a tokenizer that
    converts Python code to a token stream, a lexical analyzer that runs syntax analysis,
    a bytecode generator that optimizes and converts the Python code to bytecode (.pyc
    files), and the bytecode interpreter that interprets the bytecode stream and maintains
    the state of the bytecode interpreter.


    If you’ve ever edited a Python file and re-run your program only to notice that
    it didn’t run with the change you just made, you’ll understand that the Python
    interpreter caches the bytecode in .pyc files. Deleting the .pyc files before
    re-running forces the interpreter to re-interpret the Python code into bytecode—in
    essence, forcing the Python interpreter to clear its bytecode cache. The bytecode
    cache decreases the overhead of runtime interpretation by not re-interpreting
    the Python code into bytecode unless the Python code has changed. On versions
    of Python that pre-dated 3.3, however, the method used to obtain the timestamp
    on the .py file did not match the windows operating system timestamp which resulted
    in a timestamp that was younger than the .pyc file. This meant that the interpreter
    did not re-interpret the .py file into bytecode. Similarly, if you remove a .py
    file but still import it in your code, the imports may continue to work because
    the .pyc file is still present on your system. While these two issues may sway
    you from wanting to use the bytecode cache, the cache plays an important role
    in improving interpretation performance and typically operates in the background
    without developers being the wiser. The bytecode cache is particularly advantageous
    for third-party libraries where the code is installed and not expected to change
    or the library owners do not want to expose the Python source code.


    Python has a global interpreter lock or what’s known to most as the GIL. In order
    to understand why the GIL exists, you really have to take a step back in time
    and explore what was happening in computer science at the time the GIL was invented.
    It began with the invention of threads. Anticipating the future of computing,
    software introduced the concept of multi-threading prior to multi-core CPUs. Threading
    enabled a program to run processes in parallel that operated on the same memory
    space. It was a fantastic way to improve performance of CPU-intensive computation.


    For example, say we want to calculate how many times the name Tiffany appears
    in a list. You could do this by counting how many times Tiffany appears in the
    list all by yourself, or you could break up the list into sub-lists and give one
    to each of your friends, and each time one of you sees the word Tiffany, increase
    the running total on the whiteboard by one. In this example, you and your friends
    are the threads and the count on the whiteboard is the shared memory. Generally,
    breaking up the problem into smaller chunks and using threads to parallelize the
    computation is faster than computing the whole thing on one thread. The problem
    you may encounter here is when one of your friends has erased the total on the
    whiteboard and is updating it at the same time you wish to update it. Fortunately,
    you are smart enough to realize this is happening and wait until your friend has
    finish updating the total before you try to do so. Computers, on the other hand,
    need to be told how to handle this or need to be what’s called thread safe. If
    a piece of software encounters this same scenario, it’s going to simply squash
    the value. This is what’s known as a race condition.


    In Figure [3-3](#487367_1_En_3_Chapter.xhtml#Fig3), time is represented on the
    y axis as t, and there are two threads that each wish to increment the total at
    nearly the same time. Total in this example is located in shared memory, meaning
    both threads can access that value. Here you can see that Thread 1 increments
    the counter first, followed by Thread 2\. However, Thread 2 effectively does not
    increment the counter because at the time that it grabbed the total to increment,
    Thread 1’s increment had not taken effect yet. This has an end result of the total
    being one less than it should be (6 instead of 7).


    ![../images/487367_1_En_3_Chapter/487367_1_En_3_Fig3_HTML.png](images/487367_1_En_3_Chapter/487367_1_En_3_Fig3_HTML.png)


    Figure 3-3'
  trans: '

    # CPython 解释器、Python 和 NumPy 的性能


    大多数开发者通常安装的 Python 解释器称为 CPython。它是推荐与 pandas 一起使用的解释器，因为 pandas 高度依赖 C 语言进行性能优化。CPython
    用 C 语言实现，并将 Python 代码转换为所谓的字节码（bytecode），这是一种在 Python 虚拟机上运行的中间低层格式。有许多不同的 Python
    解释器，包括 Jython、IronPython 和 PyPy，它们分别用 Java、C# 和 RPython（RPython 是 Python 的一个受限子集）实现。PyPy
    是一种即时编译器（Just-In-Time，JIT），这意味着它在运行时将 Python 代码编译为机器码。这与 CPython 相反，CPython 在
    Python 虚拟机上运行字节码并调用预编译的 C 扩展。PyPy 通常比 CPython 更快，因为它运行低层优化的机器码，而不是在 Python 虚拟机上解析字节码。不幸的是，PyPy
    目前并不完全支持 pandas。


    Python 是一种高级语言，这意味着它易于阅读且实现速度快。这也意味着它比某些低层语言慢，原因是这些自我管理的便利特性。这些便利特性包括垃圾回收器、全局解释器锁和动态类型，但它们并非没有代价。垃圾回收器负责释放不再使用的内存，以便可以再次使用。全局解释器锁（即
    GIL）保护对象不被多个线程同时访问。动态类型允许同一变量持有不同类型的值。由于 CPython 是用 C 语言实现的，它与 C 兼容，因此允许 Python
    调用用 C 编写的性能更高的扩展。但是为什么 C 语言比 Python 高效得多呢？Python 相对 C 较慢有几个原因：它是解释型而非编译型，它有一个全局解释器锁，它允许动态类型，并且它具有内置的垃圾回收器。


    将 Python 解释为字节码类似于将 C 编译为目标文件，只不过字节码在 Python 虚拟机上运行，而机器码在 CPU 上运行。在运行时解释 Python
    代码增加了额外的开销，使得 Python 通常比 C 运行得慢。解释过程分为几个阶段：词法分析器将 Python 代码转换为标记流；语法分析器进行语法分析；字节码生成器优化并将
    Python 代码转换为字节码（`.pyc` 文件）；字节码解释器解释字节码流并维护字节码解释器的状态。


    如果你曾经编辑过一个 Python 文件并重新运行程序，却发现程序没有使用你刚刚所做的更改，你就会理解 Python 解释器会将字节码缓存在 `.pyc`
    文件中。在重新运行之前删除 `.pyc` 文件会强制解释器将 Python 代码重新解释为字节码——本质上，就是强制 Python 解释器清除其字节码缓存。字节码缓存通过不重新将
    Python 代码解释为字节码（除非代码已更改），减少了运行时解释的开销。然而，在早于 3.3 的 Python 版本中，用于获取 `.py` 文件时间戳的方法与
    Windows 操作系统的时间戳不匹配，导致生成的时间戳比 `.pyc` 文件更年轻。这意味着解释器不会将 `.py` 文件重新解释为字节码。类似地，如果你删除了一个
    `.py` 文件，但仍然在代码中导入它，导入操作可能会继续工作，因为 `.pyc` 文件仍然存在于你的系统上。虽然这两个问题可能让你不想使用字节码缓存，但缓存在提高解释性能方面起着重要作用，并且通常会在后台运行，开发人员甚至察觉不到。字节码缓存对于第三方库尤其有利，这些库的代码已安装且预期不会更改，或者库所有者不希望暴露
    Python 源代码。


    Python 有一个全局解释器锁，大多数人称之为 GIL。为了理解 GIL 为何存在，你必须回到过去，探究 GIL 被发明时计算机科学领域正在发生什么。这一切始于线程的发明。预见到计算的未来，软件在多核
    CPU 出现之前就引入了多线程的概念。线程使程序能够并行运行操作同一内存空间的进程。这是提高 CPU 密集型计算性能的绝佳方法。


    例如，假设我们要计算名字"Tiffany"在列表中出现了多少次。你可以自己数出列表中"Tiffany"出现的次数，也可以将列表分成子列表，每个子列表交给一个朋友去数，每当有人看到"Tiffany"这个词时，就在白板上的运行总数上加一。在这个例子中，你和你的朋友们就是线程，白板上的计数就是共享内存。通常情况下，将问题分解成更小的块并使用线程来并行计算，比单线程计算整个任务要快。你可能会遇到的一个问题是，当你的一位朋友已经擦除了白板上的总数并正在更新时，你也想更新它。幸运的是，你很聪明，能意识到这一点，并在朋友完成更新总数后再尝试更新。然而，计算机需要被告知如何处理这种情况，或者说需要达到所谓线程安全的程度。如果软件遇到相同的情况，它只会简单地覆盖该值。这就是所谓的竞态条件。


    在图 3-3 中，时间在 y 轴上表示为 t，有两个线程几乎同时想要增加总数。本例中的总数位于共享内存中，这意味着两个线程都可以访问该值。在这里，你可以看到线程
    1 首先增加了计数器，然后是线程 2。然而，线程 2 实际上并没有增加计数器，因为当它获取总数准备增加时，线程 1 的增量尚未生效。这导致最终结果比应有的总数少
    1（结果是 6，而不是 7）。


    ![../images/487367_1_En_3_Chapter/487367_1_En_3_Fig3_HTML.png](img/487367_1_En_3_Fig3_HTML.png)


    图 3-3

    '
- fmt: "# 线程1与线程2之间`total`递增的竞态条件演示\n\n与此运行总计示例类似，CPython解释器使用一种引用垃圾收集技术，跟踪引用某个对象的位置数量。垃圾收集器负责跟踪已分配的内存，并在其不再使用时释放内存。它通过维护程序中引用每个对象的所有位置的运行总计来实现这一点。当不再有引用时，即引用计数为零，则内存被释放，这意味着它被释放并可用于存储其他内容。在清单[3-8](#487367_1_En_3_Chapter.xhtml#PC8)中，字符串`foo`的引用计数将为2，因为有两个变量引用它。\n\
    \n```\nref1 = \"foo\"\nref2 = \"foo\"\n```\n\n**清单 3-8** 创建对字符串`foo`的两个引用的示例\n\
    \n回想一下，字符串缓存在此处起作用，正因为如此，`ref1`和`ref2`在底层指向同一个值。\n\n当我们删除`ref2`时，字符串`foo`的引用计数为1；当我们删除`ref1`时，字符串`foo`的引用计数为0，并且内存可以被释放。这在清单[3-9](#487367_1_En_3_Chapter.xhtml#PC9)中演示。\n\
    \n```\ndelete(ref2)       # 执行此行后 reference count = 1\ndelete(ref1)       # 执行此行后\
    \ reference count = 0\n```\n\n**清单 3-9** 删除在清单3-8中创建的`foo`引用的示例\n\n并非所有对象在其引用计数达到0时都会被释放，因为有些对象的引用计数永远不会达到0。例如，清单[3-10](#487367_1_En_3_Chapter.xhtml#PC10)中呈现的场景，这在使用Python的类和对象时经常发生。在此场景中，`exc_info`是一个元组，第三个索引处的值是回溯对象（`traceback\
    \ object`）。回溯对象包含对帧（`frame`）的引用，但帧也包含对`exc_info`变量的引用。这就是所谓的循环引用，由于无法在不破坏另一个的情况下删除其中一个，因此这两个对象必须被垃圾收集。垃圾收集器会定期运行，识别并删除像这样的循环引用对象。\n\
    \n```\nimport sys\ntry:\n    raise Exception(\"Something went wrong.\")\nexcept\
    \ Exception as e:\n    exc_info = sys.exc_info()\n    frame = exc_info[2].tb_frame\
    \   # 创建第三个引用\n    assert(sys.getrefcount(frame) == 3)\n    del(exc_info)\n  \
    \  assert(sys.getrefcount(frame) == 3)\n```\n\n**清单 3-10** 创建循环引用的示例\n\n跟踪这些引用并非没有代价。每个对象都有一个关联的引用计数器，它占用空间，并且代码中每次引用都需要CPU周期来计算对象引用计数的适当增减。这就是为什么，如果你比较Python中对象的大小和C中对象的大小，Python中的大小要大得多，也是为什么Python执行速度比C慢的部分原因。那些额外的字节和额外的CPU周期部分源于引用计数跟踪。虽然垃圾收集器确实对性能有影响，但它也使Python成为一种易于编程的语言。作为开发者，您不必担心跟踪内存分配和释放；Python垃圾收集器会为您处理这些。\n\
    \n在多线程应用程序中，引用计数与图[3-3](#487367_1_En_3_Chapter.xhtml#Fig3)中的`total`存在相同的问题。一个线程可能在与另一个线程同时向共享内存空间中的对象创建新引用，从而发生竞态条件，导致引用计数最终只增加一次而不是两次。发生这种情况时，最终可能导致对象过早地从内存中释放（因为竞态条件导致对象的引用计数增加了一次而不是两次）。在其他情况下，当引用计数器的递减出现竞态条件时，这可能导致内存泄漏，因为引用计数比应有的值大1，所以内存永远不会被销毁。因此，正如您在此处所见，运行多线程应用程序不仅会影响程序正在操作的数据，还会影响Python解释器本身。\n\
    \n传统上，竞态条件通过锁来解决。这实际上就是您下意识做的事情——也就是说，在您自己更新总计之前，等待您的朋友完成更新总计。在软件中，这是通过共享内存锁实现的。当一个线程需要更新总计时，它获取锁，更新总计，然后释放锁。与此同时，另一个线程等待锁空闲，获取锁，然后也更新总计。这种交互在图[3-4](#487367_1_En_3_Chapter.xhtml#Fig4)中演示。\n\
    \n![../images/487367_1_En_3_Chapter/487367_1_En_3_Fig4_HTML.png](images/487367_1_En_3_Chapter/487367_1_En_3_Fig4_HTML.png)\n\
    \n**图 3-4** 线程1与线程2之间共享`total`上的锁的演示\n\n太好了！我们已经解决了问题！或者我们解决了吗？考虑图[3-5](#487367_1_En_3_Chapter.xhtml#Fig5)中的场景，其中有两个锁和两个总计。\n\
    \n![../images/487367_1_En_3_Chapter/487367_1_En_3_Fig5_HTML.png](images/487367_1_En_3_Chapter/487367_1_En_3_Fig5_HTML.png)\n\
    \n**图 3-5** 线程1与线程2之间死锁的演示\n\n图[3-5](#487367_1_En_3_Chapter.xhtml#Fig5)就是所谓的死锁。当两个线程需要多段数据才能执行，但它们以不同的顺序请求这些数据时，就会发生死锁。为了完全避免此类问题，Python的作者在线程级别实现了一个锁，该锁只允许在任何给定时间运行一个线程。这是解决这个问题的一种简单而优雅的方式。当时，由于多核CPU相当罕见，这实际上并没有影响性能，因为在CPU中，这些线程的指令无论如何都是串行执行的。然而，随着计算机变得越来越先进，计算变得越来越密集，多核CPU已成为几乎所有现代计算平台的标准。当涉及大数据，需要进行大型CPU密集型计算时，不利用多核CPU意味着在某些情况下根本无法运行计算（至少无法在合理的时间内运行）。那么，我们如何才能打破GIL（全局解释器锁），真正运行多核大数据计算呢？\n\
    \nC扩展是用C语言编写的，而不是Python，因此不受GIL的限制。`pandas`构建在`NumPy`之上，而`NumPy`是一个Python包装器，它包装了完成所有繁重计算任务的C扩展。这意味着使用`pandas`时，所有密集型计算都是在C中完成的，由于该语言的特性，计算通常更快。这也意味着`pandas`能够打破GIL，真正在多个核心上同时运行多核计算。"
  raw: 'A demonstration of a race condition on increment of total between Thread 1
    and Thread 2


    Similar to this running total example, the CPython interpreter uses a reference
    garbage collector technique where it keeps track of the number of places that
    refer to an object. The garbage collector is responsible for keeping track of
    allocated memory and deallocating it when it is no longer used. It does this by
    keeping a running total of all the places that reference each object in the program.
    When there are no more references, meaning the reference count is zero, then the
    memory is deallocated, meaning it is freed and available to store something else.
    In Listing [3-8](#487367_1_En_3_Chapter.xhtml#PC8), string foo’s reference count
    would be two because there are two variables that reference it.


    ```

    ref1 = "foo"

    ref2 = "foo"

    Listing 3-8

    Example of creating two references to the string foo

    ```


    Recall that the string cache is at play here, and because of that, both ref1 and
    ref2 point to the same value underneath.


    When we delete ref2, string foo’s reference count is 1, and when we delete ref1,
    string foo’s reference count is 0 and the memory can be freed. This is demonstrated
    in Listing [3-9](#487367_1_En_3_Chapter.xhtml#PC9).


    ```

    delete(ref2)       # reference count = 1 after this line executes

    delete(ref1)       # reference count = 0 after this line executes

    Listing 3-9

    Example of deleting references to foo that were created in Listing 3-8

    ```


    Not all objects are freed when their references reach 0 though because some never
    reach 0\. Take, for example, the scenario presented in Listing [3-10](#487367_1_En_3_Chapter.xhtml#PC10)
    which tends to happen quite often when working with classes and objects in Python.
    In this scenario, exec_info is a tuple and the value at the third index is the
    traceback object. The traceback object contains a reference to the frame, but
    the frame also contains a reference to the exc_info variable. This is what’s known
    as a circular reference, and since there is no way to delete one without breaking
    the other, these two objects must be garbage collected. Periodically the garbage
    collector will run, identify, and delete circular referenced objects like this.


    ```

    import sys

    try:

    raise Exception("Something went wrong.")

    except Exception as e:

    exc_info = sys.exc_info()

    frame = exc_info[2].tb_frame # create a third reference

    assert(sys.getrefcount(frame) == 3)

    del(exc_info)

    assert(sys.getrefcount(frame) == 3)

    Listing 3-10

    Example of creating a circular reference

    ```


    Keeping track of these references does not come for free. Each object has an associated
    reference counter which takes up space, and each reference made in the code takes
    up CPU cycles to compute the appropriate increment or decrement of the object’s
    reference count. This is partially why, if you compare the size of an object in
    Python to the size of an object in C, the sizes are so much larger in Python and
    also why Python is slower to execute than C. Part of those extra bytes and extra
    CPU cycles are due to the reference count tracking. While the garbage collector
    does have performance implications, it also makes Python a simple language to
    program in. As a developer, you don’t have to worry about keeping track of memory
    allocation and deallocation; the Python garbage collector does that for you.


    In a multi-threaded application, reference counts have the same problem as the
    total has in Figure [3-3](#487367_1_En_3_Chapter.xhtml#Fig3). A thread may create
    a new reference to an object in the shared memory space at the same time as another
    thread and a race condition occurs where the reference count ends up only being
    incremented once instead of twice. When this happens, it can ultimately lead to
    the object being freed from memory before it should be (because the race condition
    leads to the object’s reference count being incremented by one instead of two).
    In other cases when there is a race condition on a decrement of the reference
    counter, this can lead to a memory leak where the memory is never destroyed because
    the reference count is one larger than it should be. So, as you can see here,
    running a multi-threaded application can not only have consequences on the data
    that the program is operating on but also within the Python interpreter itself.


    Traditionally, race conditions are solved through locks. This is effectively what
    you were doing subconsciously—that is, waiting for your friend to finish updating
    the total before you updated it yourself. In software, this is done through a
    shared memory lock. When a thread needs to update the total, it acquires the lock,
    updates the total, and then releases the lock. Meanwhile, the other thread waits
    until the lock is free, acquires the lock, and then also updates the total. This
    interaction is demonstrated in Figure [3-4](#487367_1_En_3_Chapter.xhtml#Fig4).


    ![../images/487367_1_En_3_Chapter/487367_1_En_3_Fig4_HTML.png](images/487367_1_En_3_Chapter/487367_1_En_3_Fig4_HTML.png)


    Figure 3-4


    A demonstration of a lock on total shared between Thread 1 and Thread 2


    This is great! We’ve solved the problem! Or have we? Consider the scenario in
    Figure [3-5](#487367_1_En_3_Chapter.xhtml#Fig5) where there are instead two locks
    and two totals.


    ![../images/487367_1_En_3_Chapter/487367_1_En_3_Fig5_HTML.png](images/487367_1_En_3_Chapter/487367_1_En_3_Fig5_HTML.png)


    Figure 3-5


    A demonstration of a deadlock between Thread 1 and Thread 2


    Figure [3-5](#487367_1_En_3_Chapter.xhtml#Fig5) is what’s known as deadlock .
    This happens when two threads require multiple pieces of data to execute, but
    they request them in different orders. In order to avoid these kinds of issues
    altogether, the author of Python implemented a lock at the thread level which
    only allowed one thread to run at any given time. This was a simple and elegant
    way to solve this problem. At the time, since multi-core CPUs were quite uncommon,
    it didn’t really impact performance since in the CPU, these threads’ instructions
    would be run serially anyway. However, as computers have become more advanced
    and computations have become more intensive, multi-core CPUs have become the standard
    in pretty much all modern computing platforms. When it comes to big data which
    involves running large CPU-intensive computations, not taking advantage of multi-core
    CPUs means in some cases not being able to run the computation at all (at least
    within a reasonable amount of time). So how can we break out of the GIL and truly
    run a multi-core big data computation?


    C extensions, being written in C and not in Python, are not subject to the GIL.
    pandas is built on NumPy which is a Python wrapper around C extensions that do
    all the heavy lifting for the computation. This means that all the intensive computation
    when using pandas is done in C, where the computations are just generally faster
    due to the properties of the language. This also means that pandas is able to
    break out of the GIL and truly run multi-core computation on multiple cores simultaneously.'
  trans: "\n# 线程 1 与线程 2 之间`total`递增的竞态条件演示\n\n与此运行总计示例类似，CPython 解释器使用一种引用垃圾收集技术，跟踪引用某个对象的位置数量。垃圾收集器负责跟踪已分配的内存，并在其不再使用时释放内存。它通过维护程序中引用每个对象的所有位置的运行总计来实现这一点。当不再有引用时，即引用计数为零，则内存被释放，这意味着它被释放并可用于存储其他内容。在清单\
    \ 3-8 中，字符串`foo`的引用计数将为 2，因为有两个变量引用它。\n\n```\nref1 = \"foo\"\nref2 = \"foo\"\n\
    ```\n\n**清单 3-8** 创建对字符串`foo`的两个引用的示例\n\n回想一下，字符串缓存在此处起作用，正因为如此，`ref1`和`ref2`在底层指向同一个值。\n\
    \n当我们删除`ref2`时，字符串`foo`的引用计数为 1；当我们删除`ref1`时，字符串`foo`的引用计数为 0，并且内存可以被释放。这在清单 3-9\
    \ 中演示。\n\n```\ndelete(ref2)       # 执行此行后 reference count = 1\ndelete(ref1)  \
    \     # 执行此行后 reference count = 0\n```\n\n**清单 3-9** 删除在清单 3-8 中创建的`foo`引用的示例\n\
    \n并非所有对象在其引用计数达到 0 时都会被释放，因为有些对象的引用计数永远不会达到 0。例如，清单 3-10 中呈现的场景，这在使用 Python 的类和对象时经常发生。在此场景中，`exc_info`是一个元组，第三个索引处的值是回溯对象（`traceback\
    \ object`）。回溯对象包含对帧（`frame`）的引用，但帧也包含对`exc_info`变量的引用。这就是所谓的循环引用，由于无法在不破坏另一个的情况下删除其中一个，因此这两个对象必须被垃圾收集。垃圾收集器会定期运行，识别并删除像这样的循环引用对象。\n\
    \n```\nimport sys\ntry:\n    raise Exception(\"Something went wrong.\")\nexcept\
    \ Exception as e:\n    exc_info = sys.exc_info()\n    frame = exc_info[2].tb_frame\
    \   # 创建第三个引用\n    assert(sys.getrefcount(frame) == 3)\n    del(exc_info)\n  \
    \  assert(sys.getrefcount(frame) == 3)\n```\n\n**清单 3-10** 创建循环引用的示例\n\n跟踪这些引用并非没有代价。每个对象都有一个关联的引用计数器，它占用空间，并且代码中每次引用都需要\
    \ CPU 周期来计算对象引用计数的适当增减。这就是为什么，如果你比较 Python 中对象的大小和 C 中对象的大小，Python 中的大小要大得多，也是为什么\
    \ Python 执行速度比 C 慢的部分原因。那些额外的字节和额外的 CPU 周期部分源于引用计数跟踪。虽然垃圾收集器确实对性能有影响，但它也使 Python\
    \ 成为一种易于编程的语言。作为开发者，您不必担心跟踪内存分配和释放；Python 垃圾收集器会为您处理这些。\n\n在多线程应用程序中，引用计数与图 3-3\
    \ 中的`total`存在相同的问题。一个线程可能在与另一个线程同时向共享内存空间中的对象创建新引用，从而发生竞态条件，导致引用计数最终只增加一次而不是两次。发生这种情况时，最终可能导致对象过早地从内存中释放（因为竞态条件导致对象的引用计数增加了一次而不是两次）。在其他情况下，当引用计数器的递减出现竞态条件时，这可能导致内存泄漏，因为引用计数比应有的值大\
    \ 1，所以内存永远不会被销毁。因此，正如您在此处所见，运行多线程应用程序不仅会影响程序正在操作的数据，还会影响 Python 解释器本身。\n\n传统上，竞态条件通过锁来解决。这实际上就是您下意识做的事情——也就是说，在您自己更新总计之前，等待您的朋友完成更新总计。在软件中，这是通过共享内存锁实现的。当一个线程需要更新总计时，它获取锁，更新总计，然后释放锁。与此同时，另一个线程等待锁空闲，获取锁，然后也更新总计。这种交互在图\
    \ 3-4 中演示。\n\n![../images/487367_1_En_3_Chapter/487367_1_En_3_Fig4_HTML.png](img/487367_1_En_3_Fig4_HTML.png)\n\
    \n**图 3-4** 线程 1 与线程 2 之间共享`total`上的锁的演示\n\n太好了！我们已经解决了问题！或者我们解决了吗？考虑图 3-5 中的场景，其中有两个锁和两个总计。\n\
    \n![../images/487367_1_En_3_Chapter/487367_1_En_3_Fig5_HTML.png](img/487367_1_En_3_Fig5_HTML.png)\n\
    \n**图 3-5** 线程 1 与线程 2 之间死锁的演示\n\n图 3-5 就是所谓的死锁。当两个线程需要多段数据才能执行，但它们以不同的顺序请求这些数据时，就会发生死锁。为了完全避免此类问题，Python\
    \ 的作者在线程级别实现了一个锁，该锁只允许在任何给定时间运行一个线程。这是解决这个问题的一种简单而优雅的方式。当时，由于多核 CPU 相当罕见，这实际上并没有影响性能，因为在\
    \ CPU 中，这些线程的指令无论如何都是串行执行的。然而，随着计算机变得越来越先进，计算变得越来越密集，多核 CPU 已成为几乎所有现代计算平台的标准。当涉及大数据，需要进行大型\
    \ CPU 密集型计算时，不利用多核 CPU 意味着在某些情况下根本无法运行计算（至少无法在合理的时间内运行）。那么，我们如何才能打破 GIL（全局解释器锁），真正运行多核大数据计算呢？\n\
    \nC 扩展是用 C 语言编写的，而不是 Python，因此不受 GIL 的限制。`pandas`构建在`NumPy`之上，而`NumPy`是一个 Python\
    \ 包装器，它包装了完成所有繁重计算任务的 C 扩展。这意味着使用`pandas`时，所有密集型计算都是在 C 中完成的，由于该语言的特性，计算通常更快。这也意味着`pandas`能够打破\
    \ GIL，真正在多个核心上同时运行多核计算。\n"
- fmt: 'Since NumPy runs the computations in C, it must translate all the Python objects
    into C-compatible types. According to the NumPy documentation, as long as an array’s
    types are translatable to C types, the GIL is released prior to the calculation.
    This means that when using NumPy, it’s important to operate on types that are
    translatable to C types. If you operate on Python objects that NumPy is unable
    to translate to C, the operation cannot compute the result in C. It must instead
    stay in Python where the GIL cannot be released until the computation has finished.


    The Appendix shows a detailed mapping of the types in Python to the types NumPy
    uses in its C extensions known as scalars. All of the NumPy types are referred
    to as `dtypes` within the NumPy API and are available as attributes of the `NumPy`
    library.


    NumPy’s main data structure is an N-dimensional array or `ndarray`. It is a special
    array structure that handles this Python-C boundary. It’s important to note that
    `ndarrays` in NumPy are homogeneous, meaning all the elements have the same type.
    This again has to do with Python vs. C. C is a lower-level language where the
    developer must manage the memory allocation and deallocation themselves, and it
    does not permit dynamic typing. In the case of an array in C, all the elements
    must be of consistent and known size or type in order to allocate the appropriate
    amount of memory for the input data arrays and the output data array in C. Listing
    [3-11](#487367_1_En_3_Chapter.xhtml#PC11) shows an example of how an array of
    floats is created in C. Note the memory must be explicitly allocated using `malloc`,
    and it is of fixed size 100—having only enough room for 100 floats.


    ```

    float* array = (float*) malloc(100 * sizeof(float));

    Listing 3-11

    Allocating memory for an array of 100 floats in C

    ```


    NumPy uses `ndarray` as shown in Listing [3-12](#487367_1_En_3_Chapter.xhtml#PC12)
    to build a fixed-size array where `dtype` is used to specify the type of each
    element in the array or how much memory each element in the array will take up.
    Recall from the previous section that Python’s `list` implementation is a dynamic
    array underneath. Python’s `list` type, in contrast to an `ndarray`, handles elements
    of any size by allocating space for the pointer to that data as opposed to the
    data itself. This leads to a Python `list` taking up more memory than an `ndarray`
    because there is a layer of indirection due to the list holding the pointers to
    the data rather than the data itself. In summary, `ndarrays` have a fixed length
    and each element has the same type, whereas Python’s `list` type has a dynamic
    length and elements can be many different types. This is an important distinction
    and why each column in `pandas` is assigned a particular `dtype`. This is also
    why it’s important to make sure `pandas` has the correct type for a particular
    column and why it’s important to normalize your data so that a type other than
    the all-encompassing `object` type is assigned. Figure [3-6](#487367_1_En_3_Chapter.xhtml#Fig6)
    shows how the `ndarray` created in Listing [3-12](#487367_1_En_3_Chapter.xhtml#PC11)
    is represented in memory.


    ```

    import numpy as np

    groups_waiting_for_a_table = np.ndarray(

    (3,0),

    buffer=np.array([4, 7, 21], dtype=np.uint8),

    dtype=np.uint8,

    )

    Listing 3-12

    ndarray of three unsigned 8-bit ints

    ```


    ![../images/487367_1_En_3_Chapter/487367_1_En_3_Fig6_HTML.jpg](images/487367_1_En_3_Chapter/487367_1_En_3_Fig6_HTML.jpg)


    Figure 3-6


    A representation of Listing [3-12](#487367_1_En_3_Chapter.xhtml#PC12) in memory.
    Compare this to Figure [3-2](#487367_1_En_3_Chapter.xhtml#Fig2)


    The CPython interpreter provides a C-API that exposes the ability to acquire and
    release the GIL. NumPy uses the macros `NPY_BEGIN_THREADS` and `NPY_END_THREADS`
    to denote when C code is able to run without the GIL. NumPy mathematical operations
    are instances of universal functions, known as `ufunc`s, implemented in C, and
    all of them call these macros. See the Appendix for a list of common `ufuncs`.


    Recall that running without the GIL means that the program can now execute instructions
    on multiple cores simultaneously. This means that intensive mathematical operations
    when using NumPy are able to break up the example of counting how many times Tiffany
    appears in a list, using multi-threading at the C level. While NumPy itself doesn’t
    typically implement multi-threaded computations (simply running the computation
    in C is enough of a performance improvement itself), there are other libraries
    which will do so when used in combination with NumPy.


    When NumPy is compiled to use the Basic Linear Algebra Subroutines, known as BLAS,
    or a Linear Algebra Package, known as LAPACK, it runs operations according to
    the size of the memory cache and the number of cores available on the system.
    By optimizing the calculation according to the resources on the machine, NumPy
    is able to run the computations much faster than it otherwise would. There are
    several different implementations of BLAS/LAPACK including OpenBLAS, ATLAS, and
    Intel MKL. We’ll explore how these libraries work to improve performance in more
    detail in later chapters, but for now, just know they exist and for large computations
    they can make a huge difference in performance.'
