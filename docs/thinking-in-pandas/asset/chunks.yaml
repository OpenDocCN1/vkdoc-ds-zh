    # DataFrame 的创建与访问


    `pandas` 采用类似字典的语法，这对于熟悉 Python 但不熟悉 `pandas` 的用户来说非常直观。每个列名被视为一个键，行值则作为对应的值返回。`DataFrame`
    对象的构造函数也支持以字典形式创建 `DataFrame`。需要注意的是，当你从 `DataFrame` 获取某一列时，该列指向原始的 `DataFrame`，这正是我们能够对原始数据进行修改的原因。即使语法上看起来像是在将数据存储到原始数据的子集中（如代码清单
    2-1 底部所示），实际上也是如此。这种机制有利于内存性能，因为我们不必频繁地创建数据的副本。


    ```

    >> import pandas as pd

    >> account_info = pd.DataFrame({

    "name": ["Bob", "Mary", "Mita"],

    "account": [123846, 123972, 347209],

    "balance": [123, 3972, 7209],

    })

    >> account_info["name"]

    0    Bob

    1    Mary

    2    Mita

    Name: name, dtype: object

    >> account_info["name"] = ["Smith", "Jane", "Patel"]

    >> account_info

    name  account     balance

    0    Smith 123846       123

    1    Jane  123972       3972

    2    Patel 347209       7209

    代码清单 2-1

    字典语法示例

    ```


    类似地，也可以通过传入一个列名列表来创建子`DataFrame`，如代码清单 2-2 所示。


    ```

    >> import pandas as pd

    >> account_info = pd.DataFrame({

    "name": ["Bob", "Mary", "Mita"],

    "account": [123846, 123972, 347209],

    "balance": [123, 3972, 7209],

    })

    >> account_info[["name", "balance"]]

    name  balance

    0     Bob   123

    1     Mary  3972

    2     Mita  7209

    代码清单 2-2

    创建子 DataFrame 示例

    ```


    如果从原始 `DataFrame` 创建子`DataFrame`，并期望修改子`DataFrame` 时原始数据不受影响，那么字典语法可能在不经意间导致混淆。`pandas`
    无法保证在代码清单 2-1 和 2-2 所展示的简单情况之外，字典语法返回的对象究竟是视图还是副本。这也正是对于具有多重索引或多级列标的 `DataFrame`，我们更推荐使用
    `loc` 方法而非字典语法的原因。我们将在下一节讨论的 `loc` 方法，能够确保你在原始 `DataFrame` 上操作，而非操作副本。同理，如果你确实需要一份
    `DataFrame` 的副本，应该显式地创建它。


    ## `iloc` 方法


    `DataFrame` 的行可以通过 `iloc` 方法访问，该方法采用类似列表的语法。代码清单 2-3 演示了这一用法。


    ```

    >> import pandas as pd

    >> account_info = pd.DataFrame({

    "name": ["Bob", "Mary", "Mita"],

    "account": [123846, 123972, 347209],

    "balance": [123, 3972, 7209],

    })

    >> account_info.iloc[1]

    name        Mary

    account     123972

    balance     3972

    >> account_info.iloc[0:2]

    name  account  balance

    0    Bob   123846   123

    1    Mary  123972   3972

    >> account_info.iloc[:]

    name  account  balance

    0    Bob   123846   123

    1    Mary  123972   3972

    2    Mita  347209   7209

    代码清单 2-3

    使用 iloc 访问 DataFrame 行示例

    ```


    `iloc` 用于通过基于整数位置的索引来索引 `DataFrame`。`iloc` 函数中的第一个位置指定行索引，第二个位置指定列索引。这意味着我们可以像代码清单
    2-4 那样同时选择行和列。


    ```

    >> import pandas as pd

    >> account_info = pd.DataFrame({

    "name": ["Bob", "Mary", "Mita"],

    "account": [123846, 123972, 347209],

    "balance": [123, 3972, 7209],

    })

    >> account_info.iloc[1, 2]


    >> account_info.iloc[1, 2] = 3975

    >> account_info.iloc[1, 2]


    >> account_info.iloc[:, [0, 2]]

    name  balance

    0    Bob   123

    1    Mary  3975

    2    Mita  7209

    代码清单 2-4

    使用 iloc 访问 DataFrame 行和列示例

    ```


    `iloc` 也接受布尔数组。在代码清单 2-5 中，我们通过对每个行索引取模并转换为布尔值，来获取所有奇数行。


    ```

    >> import pandas as pd

    >> account_info = pd.DataFrame({

    "name": ["Bob", "Mary", "Mita"],

    "account": [123846, 123972, 347209],

    "balance": [123, 3972, 7209],

    })

    >> account_info.iloc[account_info.index % 2 == 1]

    name  account    balance

    1    Mary  123972     3972

    代码清单 2-5

    使用 iloc 访问 DataFrame 行和列示例

    ```


    `iloc` 也可以接受一个函数；不过，该函数只会被调用一次，传入整个 `DataFrame`。将其直接传入与在调用 `iloc` 之前简单地调用该函数相比，差别不大，因此本文不再赘述。


    在处理多重索引和多级列标的 `DataFrame` 时，`iloc` 非常实用，因为级别本身就是整数值。我们来回顾一个示例并进行解析。这里我们通过 `":"`
    指定要获取所有行，并使用一个布尔数组来指定列。我们获取多级列标 `"data"` 下的值，即 `["score", "date", "score", "date"]`，然后通过指定值必须等于
    `"score"` 来创建一个布尔数组。代码清单 2-6 将此过程分阶段拆解，以便于理解。


    ```

    >> restaurant_inspections

    inspection             0                1

    data                 score date       score date

    restaurant location

    Diner      (4, 2)    90    02/18      100   05/18

    Pandas     (5, 4)    55    04/18      76    01/18

    >> score_columns = (

    restaurant_inspections.columns.get_level_values("data")

    == "score")

    >> score_columns

    [True, False, True, False]

    >> restaurant_inspections.iloc[:, score_columns]

    inspection                0          1

    data                      score      score

    restaurant location

    Diner      (4, 2)         90         100

    Pandas     (5, 4)         55         76

    代码清单 2-6

    使用 iloc 从多重索引多级列标 DataFrame 中提取子 DataFrame

    ```

    '
- fmt: '# The `loc` method


    `loc` is similar to `iloc`, but it allows you to index into a `DataFrame` via
    column names or labels. Listing [2-7](#487367_1_En_2_Chapter.xhtml#PC7) shows
    the `loc` equivalents to Listing [2-4](#487367_1_En_2_Chapter.xhtml#PC4).


    ```

    >> import pandas as pd

    >> account_info = pd.DataFrame({

    "name": ["Bob", "Mary", "Mita"],

    "account": [123846, 123972, 347209],

    "balance": [123, 3972, 7209],

    })

    >> account_info.loc[1, "balance"]


    >> account_info.loc[:, ["name", "balance"]]

    name  balance

    0    Bob   123

    1    Mary  3972

    2    Mita  7209

    Listing 2-7

    Example of accessing rows and columns in a DataFrame using loc

    ```


    `loc` can also be used on multi-indexed multi-level column `DataFrames` and just
    like `iloc` supports Boolean arrays. Listing [2-8](#487367_1_En_2_Chapter.xhtml#PC8)
    demonstrates this.


    ```

    >> import pandas as pd

    >> account_info

    account         0                    1

    account_info    number   balance     number   balance

    name  username

    Bob   smithb    123846   123         123847   450

    Mary  mj100     123972   3972        123973   222

    Mita  patelm    347209   7209

    >> account_info.loc[

    ("Mary", "mj100"), pd.IndexSlice[:, "balance"]

    ]

    0    balance    3972

    1    balance    222

    Listing 2-8

    Example of extracting a sub-DataFrame from a multi-indexed multi-level column
    DataFrame using loc

    ```


    At the end of the dictionary syntax section, it was mentioned that the `loc` method
    is preferred over the dictionary syntax for complex `DataFrames`. Let’s look at
    what’s happening underneath when we use each syntax to explain why that is. Listing
    [2-9](#487367_1_En_2_Chapter.xhtml#PC9) shows what each access method translates
    into underneath when operating on a more complex `DataFrame`. Note in the second
    half of Listing [2-9](#487367_1_En_2_Chapter.xhtml#PC9) where the dictionary syntax
    is used, the code underneath uses the `__getitem__` method and then calls `__setitem__`
    on it. This is in opposition to the `loc` method which calls `__setitem__` directly.
    It is the `__getitem__` that cannot be trusted here and makes no guarantees about
    whether it returns a copy or what’s called a view that points back to the original
    `DataFrame`. In simple cases where there are not multiple levels of columns, the
    code underneath in both these cases would look the same, but in the more complex
    case seen here, the dictionary syntax results in chained indexing and calls the
    unpredictable `__getitem__`.


    ```

    """

    The code below is equivalent to:

    account_info.__setitem__(

    (slice(None), (0, ''balance'')),

    NEW_BALANCE,

    )

    """

    account_info.loc[:, (0, "balance")] = NEW_BALANCE

    """

    The code below is equivalent to:

    account_info.__getitem__(0).__setitem__(''balance'', NEW_BALANCE )

    """

    account_info[0]["balance"] = NEW_BALANCE

    Listing 2-9

    A comparison of using loc vs. dictionary syntax to extract a sub-DataFrame

    ```


    Quite often you may have data from multiple sources that you need to combine into
    a single `DataFrame`. Now that you know how to do some basic data access, we’ll
    look at different methods for combining data from different `DataFrames` together.


    ## Combining DataFrames using the `merge` method


    `Merge` works the same way as a relational database join and even has the familiar
    options: outer, inner, left, and right. Merge right is essentially the same as
    merge left, but the `DataFrames` are simply passed in in reverse order so this
    chapter won’t provide an explicit example for merge right.


    Inner merge is used when you want to find the intersection between two pandas
    `DataFrames` (Figure [2-1](#487367_1_En_2_Chapter.xhtml#Fig1)). In Listing [2-10](#487367_1_En_2_Chapter.xhtml#PC10),
    for example, we are trying to find the data that is present in both data sets
    or in this case the buildings that were standing in 1844 that are still standing
    today.


    ![../images/487367_1_En_2_Chapter/487367_1_En_2_Fig1_HTML.png](images/487367_1_En_2_Chapter/487367_1_En_2_Fig1_HTML.png)


    Figure 2-1


    Venn diagram of inner merge


    ```

    >> import pandas as pd

    >> building_records_1844

    established

    building

    Grande Hotel      1830

    Jone''s Farm       1842

    Public Library    1836

    Marietta House    1823

    >> building_records_2020

    established

    building

    Sam''s Bakery         1962

    Grande Hotel         1830

    Public Library       1836

    Mayberry''s Factory   1924

    >> cols = building_records_2020.columns.difference(

    building_records_1844.columns

    )

    >> pd.merge(

    building_records_1844,

    building_records_2020[cols],

    how=''inner'',

    on=["building"],

    )

    established

    building

    Grande Hotel         1830

    Public Library       1836

    Listing 2-10

    Finding 1844 buildings that are still standing in 2020 using an inner merge

    ```


    In Listing [2-11](#487367_1_En_2_Chapter.xhtml#PC11), we are merging two data
    sets of gene samplings together, meaning we want all the data from both in the
    same data set without duplication. We can achieve this by doing an outer merge
    (Figure [2-2](#487367_1_En_2_Chapter.xhtml#Fig2)).


    ![../images/487367_1_En_2_Chapter/487367_1_En_2_Fig2_HTML.png](images/487367_1_En_2_Chapter/487367_1_En_2_Fig2_HTML.png)


    Figure 2-2


    Venn diagram of outer merge


    ```

    >> import pandas as pd

    >> gene_group1

    FC1           P1

    id

    Myc          2             0.05

    BRCA1        3             0.01

    BRCA2        8             0.02

    >> gene_group2

    FC2           P2

    id

    Myc          2             0.05

    BRCA1        3             0.01

    Notch1       2             0.03

    BRCA2        8             0.02

    >> pd.merge(

    gene_group1,

    gene_group2,

    how=''outer'',

    on=["id"],

    )

    FC1          P2            FC2           P2

    id

    Myc          2            0.05          2             0.05

    BRCA1        3            0.01          3             0.01

    BRCA2        8            0.02          8             0.02

    Notch1       NaN          NaN           2             0.03

    Listing 2-11

    Merging two gene samplings together without duplicating the data in common using
    outer merge

    ```'
