    file which will spin up a local Postgres database on your machine using the command
    in Listing [4-32](#487367_1_En_4_Chapter.xhtml#PC32). Note this database is configured
    to write the data to disk so you can kill the docker container at any time and
    the data will persist in the postgres-data directory and be there the next time
    you spin up the docker container.


    ```

    >> docker-compose up -d

    Listing 4-32

    Starting the Postgres database

    ```


    ```

    version: ''3''

    services:

    postgres:

    image: postgres:9.4-alpine

    ports:

    - ''127.0.0.1:5432:5432''

    volumes:

    - ./postgres-data:/var/lib/postgresql/data

    Listing 4-31

    The contents of the docker-compose.yml that will create a local Postgres database

    ```


    The SQL loaders generally can either load the whole table or load parts of the
    table based on a query. Although the SQL loaders accept a SQLAlchemy engine, they
    only accept a select statement rather than a query object. This means while you
    can use SQLAlchemy’s query API, you must convert it to a selectable before passing
    it into the loader as shown in Listing [4-34](#487367_1_En_4_Chapter.xhtml#PC34).
    A selectable is essentially the raw SQL query string. Listing [4-33](#487367_1_En_4_Chapter.xhtml#PC33)
    shows an example of how you would load all the user data from the database into
    a DataFrame, while Listing [4-34](#487367_1_En_4_Chapter.xhtml#PC34) shows how
    you might load the user with id=0 into a DataFrame.


    ```

    >> select_user0 = session.query(Patient).filter_by(id=0).selectable

    >> pd.read_sql(

    sql=select_user0,

    con=engine,

    columns=["id", "name"],

    )

    id   name

    0    0    Eric

    Listing 4-34

    Loading the user with id=0 into a DataFrame using read_sql

    ```


    ```

    >> pd.read_sql(

    sql=User.__tablename__,

    con=engine,

    columns=["id", "name"],

    )

    id   name

    0    0    Eric

    Listing 4-33

    Loading all the users into a DataFrame using read_sql

    ```


    The SQL loaders have similar options as the other loaders we’ve looked at, for
    example, loading the data chunks at a time or datetime conversion. However, there
    are differences as well. Unlike some of the other loaders we’ve looked at, the
    SQL loaders do not have an option for data type specification. This often poses
    a problem for pandas users working with databases as they may store a normalized
    version of the data in a database and then wish to load it back out only to find
    the data types are not the same. If you run into this situation, SQLAlchemy and
    some custom loading code can help. SQLAlchemy provides a custom types option which
    lets you convert between the database type and the Python type. As we’ve seen
    with other loaders where the types are not explicitly specified, pandas will store
    the id column as an int64\. Listing [4-35](#487367_1_En_4_Chapter.xhtml#PC35)
    shows an example of how we might specify the Python type for the integer id column
    as an int32 instead of a more generic and larger integer type. Using this table
    definition, now when we add a user, the id will be stored as an integer inside
    the database, but when we read it out, it will be a NumPy int32 type.


    ```

    from sqlalchemy import Column, String

    from sqlalchemy.ext.declarative import declarative_base

    import sqlalchemy.types as types

    import numpy as np

    Base = declarative_base()

    class Int32(types.TypeDecorator):

    impl = types.Integer

    def process_bind_param(self, value, dialect):

    return value

    def process_result_value(self, value, dialect):

    return np.int32(value)

    class User(Base):

    __tablename__ = ''user''

    id = Column(Int32, primary_key=True)

    name =  Column(String(50))

    Listing 4-35

    Using SQLAlchemy TypeDecorator to specify a data type for pandas

    ```


    Listing [4-36](#487367_1_En_4_Chapter.xhtml#PC36) shows a code snippet of the
    internal implementation of read_sql where self.pd_sql is the SQLAlchemy engine
    object, sql_select is the selectable passed in as the SQL parameter, and self.frame
    is the resulting DataFrame that is returned. Here you can see exactly how pandas
    is loading the data from the database and converting it into a DataFrame. The
    fetchall function returns the data as a list of tuples, for example, [(0, ‘Eric’)].
    This implementation is relevant for the next step in how we will get pandas to
    use the correct data types we defined in Listing [4-35](#487367_1_En_4_Chapter.xhtml#PC35).


    ```

    result = self.pd_sql.execute(sql_select)

    column_names = result.keys()

    data = result.fetchall()

    self.frame = DataFrame.from_records(

    data, columns=column_names, coerce_float=coerce_float

    )

    Listing 4-36

    Part of the pandas implementation of read_sql

    ```'
