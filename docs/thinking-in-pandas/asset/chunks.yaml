    如果JSON的格式提供了详细的数据模式，如清单[4-25](#487367_1_En_4_Chapter.xhtml#PC25)所示，则应使用`table`选项。


    ```

    >> data = io.StringIO(

    """

    {

    "schema": {

    "fields": [

    {"name": "location", "type": "string"},

    {"name": "temp", "type": "string"},

    ],

    "primaryKey": "location",

    },

    "data": [

    {"location": "234unf923", "temp": 35.2},

    {"location": "340inf351", "temp": 32.5},

    {"location": "234abe045", "temp": 33.1},

    ]

    }

    """

    )

    >> temperatures = pd.read_json(

    data,

    orient="table",

