- fmt: '## When to use `apply`


    So far, we’ve looked at some examples that don’t warrant the use of `apply`. Let’s
    take a look at one that does. Often the reality of working with data in the wild
    results in some much more complex scenarios. Say you want to calculate the percentile
    of score for each element in a `DataFrame`, the implementation of which is provided
    in Listing [6-11].


    ```

    def percentileofscore(a, score):

    """

    Three-quarters of the given values lie below a given score:

    >>> stats.percentileofscore([1, 2, 3, 4], 3)

    75.0

    With multiple matches, note how the scores of the two

    matches, 0.6 and 0.8 respectively, are averaged:

    >>> stats.percentileofscore([1, 2, 3, 3, 4], 3)

    70.0

    """

    n = len(a)

    left = np.count_nonzero(a < score)

    right = np.count_nonzero(a <= score)

    right_is_greater = (score > left else 0) * 50.0/n

    return pct

    Listing 6-11

    Implementation of `scipy.stats.percentileofscore`

    ```


    This means if we had the following input `DataFrame`, we would see the following
    output `DataFrame` after applying `scipy.stats.percentileofscore` using the pandas
    `apply` function (Listing [6-12]).


    ```

    >> from scipy import stats

    >> data = pd.DataFrame(np.arange(20).reshape(4,5))

    0   1   2   3   4

    0   0   1   2   3   4

    1   5   6   7   8   9

    2   10  11  12  13  14

    3   15  16  17  18  19

    >> def apply_percentileofscore(series):

    return series.apply(

    lambda x:stats.percentileofscore(series,x)

    )

    >> data.apply(apply_percentileofscore, axis=1)

    0     1     2     3      4

    0   20.0  40.0  60.0  80.0  100.0

    1   20.0  40.0  60.0  80.0  100.0

    2   20.0  40.0  60.0  80.0  100.0

    3   20.0  40.0  60.0  80.0  100.0

    Listing 6-12

    Applying `scipy.percentileofscore` to each element in a `DataFrame`

    ```


    This is a fairly complicated use case and a very non-performant implementation
    since it calls the `apply` method twice for each row. Unfortunately, there is
    no built-in pandas function that matches the behavior of SciPy’s `percentileofscore`
    function being applied to each element like we need to do in this example. While
    we could do this calculation individually on the `DataFrame` one column at a time
    and piece the results back together, that would be a very cumbersome implementation.
    Listing [6-13] demonstrates this approach.


    ```

    def percentileofscore(df):

    res_df = pd.DataFrame({})

    for col in df.columns:

    score = pd.DataFrame([df[col]]*5, index=df.columns).T

    left = df[df < score].count(axis=1)

    right = df[df <= score].count(axis=1)

    right_is_greater = (score > left else 0).astype(int)

    res_df[f''res{col}''] = (

    left + right + right_is_greater

    ) * 50.0 / len(df.columns)

    return res_df

    percentileofscore(data)

    Listing 6-13

    A more performant implementation of Listing 6-12

    ```


    Listing [6-13]’s implementation results in better performance since we have eliminated
    one of the loops in Python (the loop over the rows) by doing pandas operations
    on all the rows at once. However, we were also forced to create a duplicate `DataFrame`
    where all columns are populated with the score in order to achieve these row-wise
    operations which results in undesirable memory overhead. Note we are also not
    reusing the implementation from SciPy but have re-implemented it using pandas
    operations, which is less than ideal for readability and increases the complexity
    and possibly the fragility of implementation. Fortunately, there is yet another
    way to implement this as we’ll discuss in the next section.


    ## Improving performance of `apply` using Cython


    Taking a lesson from the previous example of a simple summation, if the pandas
    developers had provided this function for us off the `DataFrame`, it would have
    been implemented in C. So why don’t we just implement it in C ourselves? You might
    be saying to yourself, “I don’t know C—that sounds hard.” But, in fact, the Cython
    library makes it quite easy, and you don’t need to know C syntax to do it! Cython
    lets you write Python and compile it into C to be used as a C extension. First,
    we need to write our `percentileofscore` function that will operate on the entire
    `DataFrame` as shown in Listing [6-14]. Then, compile it as shown in Listing [6-15],
    and finally we can use it as shown in Listing [6-16].


    ```

    from percentileofscore import percentileofscore

    percentileofscore(data.values)

    Listing 6-16

    Using the compiled Cython function implemented in Listing 6-14

    ```


    ```

    import pyximport; pyximport.install(language_level=3)

    from distutils.core import setup

    from Cython.Build import cythonize

    setup(

    ext_modules = cythonize("percentileofscore.pyx")

    )

    >> python setup.py build_ext --inplace

    Listing 6-15

    `setup.py` for compiling Cython in Listing 6-14

    ```


    ```

    from scipy.stats import percentileofscore as pctofscore

    from copy import deepcopy

    def percentileofscore(values):

    percentiles = [0]*len(values[0])

    num_rows = len(values)

    for row_index in range(num_rows):

    row_vals = values[row_index]

    for col_index, col_val in enumerate(row_vals):

    percentiles[col_index] = \

    pctofscore(row_vals, col_val)

    values[row_index] = percentiles

    Listing 6-14

    A more performant implementation of Listing 6-12 using Cython

    ```


    Note that the Cython function accepts `values` and not the full pandas `DataFrame`;
    this is because `values` is a two-dimensional array and something that is easily
    translatable into C, whereas the pandas `DataFrame` is a Python object and is
    not. Also note that the function modifies the data in place as opposed to returning
    a whole new two-dimensional array. This is a performance benefit as we do not
    have to allocate new memory for the new array, and once the data has been converted,
    we no longer need the original data set (at least in this particular case).


    So how different is the performance of these approaches when run over 100,000
    rows? Using `apply` in Listing [6-12] averages around 58 seconds. Using pandas
    operations to effectively re-implement the SciPy equivalent as in Listing [6-13]
    averages around 24 seconds. The third approach of building a custom Cython function
    averages around 4 seconds. There are also other advantages of going with the Cython
    approach other than performance. The SciPy function could be used as is and did
    not have to be re-implemented, so from an effort of implementation and readability
    perspective, it looks very appealing as well.


    In conclusion, only when all other options have been exhausted should `apply`
    be used. It is equivalent in performance to `iterrows` and `itercolumns` and should
    be treated with the same level of precaution. In cases where `apply` needs to
    be used over a large data set and is causing a second or more slowdown, a customized
    Cython `apply` equivalent should be implemented instead so as to not degrade data
    analysis performance.


    # 7. `Groupby`


    Chances are at some point when working with data in pandas, you will need to do
    some sort of grouping and aggregation of data. This is what `Groupby` is for.
    It allows you to cluster your data into groups and run aggregated calculations
    on those groups.'
