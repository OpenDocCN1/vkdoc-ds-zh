    modern building records with more accurate historical data. The historical record
    contains the exact established date that we would like to use to update the modern
    record which contains only an estimate. First, we use a merge left to add the
    new more accurate established date as a new column in the data set (Figure [2-3](#487367_1_En_2_Chapter.xhtml#Fig3)).
    The merge left is useful in this case since we only care about updating the established
    date in the modern record for buildings that still exist. Note we are also taking
    advantage of the suffixes parameter to provide names for the column names. This
    is advantageous so we don’t have to rename the column to be the same as the original
    column after we’re done performing the operation. Once the merge is complete,
    then we need to merge the data from the two established columns together. This
    is done by replacing all the missing values (i.e., NaNs) in the old established
    column with the values in the modern record. So, if the historical record has
    an established date, then we use that; otherwise, we fall back on the modern record’s
    established date. Finally, the modern record’s original established column is
    deleted in favor of the new column that contains the merged values from the modern
    record and the historical record.


