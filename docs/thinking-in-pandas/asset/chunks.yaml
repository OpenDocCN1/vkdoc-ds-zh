    some sort of grouping and aggregation of data. This is what Groupby is for. It
    allows you to cluster your data into groups and run aggregated calculations on
    those groups.'
  trans: '好的，作为一名高级文档工程师和翻译员，我将遵循您的指示，在保留所有 Markdown 格式、代码块和内联代码的前提下，将给定的英文文本翻译为中文。



    ## 何时使用 `apply`


    到目前为止，我们已经看了一些不需要使用 `apply` 的例子。现在我们来看一个确实需要它的场景。处理现实世界中的数据通常会导致一些更复杂的情况。假设你想计算一个
    `DataFrame` 中每个元素在所在行的百分位数，其实现方式如代码清单 [6-11] 所示。


    ```

    def percentileofscore(a, score):

    """

    给定分数以下的值占所有值的四分之三：

    >>> stats.percentileofscore([1, 2, 3, 4], 3)

    75.0

    当有多个匹配项时，请注意两个匹配项的分数（分别为 0.6 和 0.8）是如何平均的：

    >>> stats.percentileofscore([1, 2, 3, 3, 4], 3)

    70.0

    """

    n = len(a)

    left = np.count_nonzero(a < score)

    right = np.count_nonzero(a <= score)

    right_is_greater = (score > left else 0) * 50.0/n

    return pct

    代码清单 6-11

    `scipy.stats.percentileofscore` 的实现

    ```


    这意味着，如果我们有以下输入的 `DataFrame`，在使用 pandas 的 `apply` 函数应用 `scipy.stats.percentileofscore`
    之后，我们会看到以下输出的 `DataFrame`（代码清单 [6-12]）。


    ```

    >> from scipy import stats

    >> data = pd.DataFrame(np.arange(20).reshape(4,5))

    0   1   2   3   4

    0   0   1   2   3   4

    1   5   6   7   8   9

    2   10  11  12  13  14

    3   15  16  17  18  19

    >> def apply_percentileofscore(series):

    return series.apply(

    lambda x:stats.percentileofscore(series,x)

    )

    >> data.apply(apply_percentileofscore, axis=1)

    0     1     2     3      4

    0   20.0  40.0  60.0  80.0  100.0

    1   20.0  40.0  60.0  80.0  100.0

    2   20.0  40.0  60.0  80.0  100.0

    3   20.0  40.0  60.0  80.0  100.0

    代码清单 6-12

    将 `scipy.percentileofscore` 应用于 `DataFrame` 中的每个元素

    ```


    这是一个相当复杂的用例，并且其实现性能非常不佳，因为它对每一行都调用了两次 `apply` 方法。不幸的是，pandas 中没有内置函数能够匹配本例中所需的
    SciPy 的 `percentileofscore` 函数逐元素应用的行为。虽然我们可以对 `DataFrame` 逐列进行单独计算，然后再将结果拼凑起来，但这将是一个非常笨拙的实现。代码清单
    [6-13] 演示了这种方法。


    ```

    def percentileofscore(df):

    res_df = pd.DataFrame({})

    for col in df.columns:

    score = pd.DataFrame([df[col]]*5, index=df.columns).T

    left = df[df < score].count(axis=1)

    right = df[df <= score].count(axis=1)

    right_is_greater = (score > left else 0).astype(int)

    res_df[f''res{col}''] = (

    left + right + right_is_greater

    ) * 50.0 / len(df.columns)

    return res_df

    percentileofscore(data)

    代码清单 6-13

    代码清单 6-12 的一个性能更优的实现

    ```


    代码清单 [6-13] 的实现带来了更好的性能，因为我们通过一次性对所有行执行 pandas 操作，消除了 Python 中的一个循环（即行循环）。然而，为了达成这种逐行操作，我们不得不创建一个重复的
    `DataFrame`，其中所有列都填充了分数值，这导致了不理想的内存开销。请注意，我们也没有复用 SciPy 的实现，而是使用 pandas 操作重新实现了它，这对可读性来说不太理想，并且增加了实现的复杂性和潜在的脆弱性。幸运的是，还有另一种实现方法，我们将在下一节中讨论。


    ## 使用 Cython 提升 `apply` 的性能


    从前一个简单求和的例子中汲取教训，如果 pandas 开发者在 `DataFrame` 上直接提供了这个函数，它可能会是用 C 语言实现的。那么，我们为什么不自己用
    C 语言实现呢？你可能会对自己说：“我不懂 C——这听起来很难。”但事实上，Cython 库让这件事变得非常简单，而且你甚至不需要了解 C 语言的语法！Cython
    允许你编写 Python 代码，并将其编译成 C 语言，作为 C 扩展来使用。首先，我们需要编写一个能操作整个 `DataFrame` 的 `percentileofscore`
    函数，如代码清单 [6-14] 所示。然后，按照代码清单 [6-15] 所示进行编译，最后我们就可以像代码清单 [6-16] 那样使用它了。


    ```

    from percentileofscore import percentileofscore

    percentileofscore(data.values)

    代码清单 6-16

    使用在代码清单 6-14 中实现并编译后的 Cython 函数

    ```


    ```

    import pyximport; pyximport.install(language_level=3)

    from distutils.core import setup

    from Cython.Build import cythonize

    setup(

    ext_modules = cythonize("percentileofscore.pyx")

    )

    >> python setup.py build_ext --inplace

    代码清单 6-15

    用于编译代码清单 6-14 中 Cython 代码的 `setup.py`

    ```


    ```

    from scipy.stats import percentileofscore as pctofscore

    from copy import deepcopy

    def percentileofscore(values):

    percentiles = [0]*len(values[0])

    num_rows = len(values)

    for row_index in range(num_rows):

    row_vals = values[row_index]

    for col_index, col_val in enumerate(row_vals):

    percentiles[col_index] = \

    pctofscore(row_vals, col_val)

    values[row_index] = percentiles

    代码清单 6-14

    使用 Cython 对代码清单 6-12 的性能更优的实现

    ```


    请注意，Cython 函数接受的是 `values` 而不是完整的 pandas `DataFrame`；这是因为 `values` 是一个二维数组，易于翻译成
    C 语言，而 pandas `DataFrame` 是一个 Python 对象，不容易翻译。同时也请注意，该函数是原地修改数据，而不是返回一个全新的二维数组。这是一个性能优势，因为我们不必为新数组分配新的内存，而且一旦数据被转换，我们就不再需要原始数据集了（至少在这个特定案例中是这样）。


    那么，这些方法在运行超过 10 万行时，性能差异有多大？使用代码清单 [6-12] 中的 `apply`，平均耗时约 58 秒。使用 pandas 操作来有效地重新实现与
    SciPy 等效功能的代码清单 [6-13]，平均耗时约 24 秒。第三种方法，即构建自定义 Cython 函数，平均耗时约 4 秒。选择 Cython 方法还有其他好处，而不仅仅是性能。我们可以直接使用
    SciPy 函数，而无需重新实现，因此从实现工作量和可读性的角度来看，这种方法也很有吸引力。


    总之，只有在所有其他选项都尝试过后，才应该使用 `apply`。它的性能与 `iterrows` 和 `itercolumns` 相当，并且应该以同样谨慎的态度对待它。如果需要在大型数据集上使用
    `apply`，并且会导致超过一秒钟的性能下降，那么应该实现一个定制的 Cython 版 `apply`，以免降低数据分析性能。


    # 7. `Groupby`


    很可能在某个时候，当你在 pandas 中处理数据时，你需要对数据进行某种形式的分组和聚合。这正是 `Groupby` 的用途。它允许你将数据聚类成组，并对这些组运行聚合计算。

