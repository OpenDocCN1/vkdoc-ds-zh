    \ development.\n\nWe won’t be stopping for long though – we still have plenty\
    \ to cover! We’ve created single rules, but there are often occasions where some\
    \ of the rules we create are duplicated in part (as they touch the same element,\
    \ class or selector ID). This can make developing styles repetitive – what if\
    \ we could nest our styles, or reuse existing styles more efficiently? We can –\
    \ you’ll learn all you need to started in the next chapter."
  trans: "\n# 跨多个文件工作\n\n在本章中，我们创建了简单的样式表——这些方法效果不错，但正如我们刚才提到的，如果它们变得过于庞大，就会引发真正的问题！\n\
    \n幸运的是，我们可以利用 Sass 的 `@import` 选项，将样式表拆分成更小、更易于管理的模块。这个功能在标准 CSS 中已经存在，但 Sass\
    \ 扩展了其功能。我们在“使用预构建混合宏”演示中简单介绍过它的用法；快速提醒一下，我们可以创建任意数量的 Sass 文件，其中包含变量、混合宏等内容：\n\
    \n```\n// _reset.scss\nhtml, body, ul, ol { margin:  0; padding: 0; }\n```\n\n\
    然后根据需要将它们导入到样式表中，如下例所示：\n\n```\n// base.scss\n@import 'reset';\nbody { font: 100%\
    \ Helvetica, sans-serif; background-color: #efefef; }\n```\n\n请注意，在我们的 `base.scss`\
    \ 示例文件中，我们没有指定文件扩展名？这些并非强制要求；Sass 会查找以 `.sass`（旧格式）或 `.scss`（当前格式）结尾的文件，并进行相应导入。在这种情况下，我们的代码示例将编译为：\n\
    \n```\nhtml, body, ul, ol { margin: 0; padding: 0; }\nbody { font: 100% Helvetica,\
    \ sans-serif; background-color: #efefef; }\n```\n\n这为我们提供了一个绝佳的理由，将样式分组到单独的文件中，例如变量、字体混合宏、重置样式等——然后我们可以根据需要将它们导入到项目中。\n\
    \n要了解有关导入的更多信息，请参考 Dart Sass 网站上的文档：[`http://sass-lang.com/documentation/file.SASS_REFERENCE.html#import`](http://sass-lang.com/documentation/file.SASS_REFERENCE.html#import)。\n\
    \n在下一个演示中，我们将通过将之前的按钮演示转换为使用导入文件来验证这一点——您将看到切换起来是多么简单！\n\n## 导入文件\n\n让我们开始更新之前的演示：\n\
    \n![../images/472539_1_En_2_Chapter/472539_1_En_2_Fig10_HTML.jpg](img/472539_1_En_2_Fig10_HTML.jpg)\n\
    \n图 2-10 – 我们（更新后的）样式化按钮\n\n1.  我们首先下载并解压 `import` 文件夹的副本，并将其保存到我们的项目区域。\n\n2.\
    \  我们需要从主 Sass 文件中提取混合宏，并将其移动到一个新文件中——为此，请继续创建一个名为 `mixins.scss` 的新文件；将其存储在 `import`\
    \ 文件夹下的 `scss` 子文件夹中。暂时保持打开状态，因为我们将在下一步中使用它。\n\n3.  在文本编辑器中打开 `importfile.scss`，然后将第\
    \ 1 到 11 行复制并粘贴到 `mixins.scss` 中。保存文件并关闭它。\n\n4.  回到 `importfile.scss`，然后删除第 1\
    \ 到 11 行。添加以下代码行（如高亮所示）：\n\n    ```\n    @import \"mixins\";\n    @font-face {\n\
    \    font-family: 'pt_sansregular';\n    src: url('../font/pt_sansregular.woff')\
    \ format('woff');\n    ```\n\n5.  保存 `importfile.scss` 并关闭它——我们现在可以编译该文件以生成样式表。\n\
    \n6.  接下来，启动一个终端会话，并将工作文件夹切换到项目区域下的 `import` 文件夹。在提示符处，键入以下命令并按 Enter：\n\n   \
    \ ```\n    sass sass\\importfile.scss css\\importfile.css\n    ```\n\n7.  如果一切顺利，我们将在\
    \ `css` 文件夹中看到 `importfile.css` 文件出现（与之前的练习方式相同），以及一个源映射——预览结果将显示与之前相同的样式化按钮集，如图\
    \ 2-10 所示。\n\n这是改进样式表管理的一种简单方法——但诀窍在于学习如何最好地将文件拆分成更小的文件，这样我们就不会不必要地导入文件！关于导入文件，有几个有用的提示需要我们了解，所以让我们更详细地看看它们。\n\
    \n## 探索代码如何工作\n\n尽管我们对代码做了一些更改，但这个相对简单的更改可能成为真正的救星！以 WordPress 等 CMS 应用程序的标准样式表为例——其样式表大约有\
    \ 4500 多行，因此能够将样式拆分成更小的文件是一个真正的福音。\n\n聚焦我们的演示，我们已将现有的 `button-bg` 混合宏移动到一个新文件中，并将其从原始主文件中删除。主文件中的原始行被一个适当命名的\
    \ `@import` 语句替换，该语句在编译期间调用该文件。然后 Sass 将内容合并到一个文件中，并在编译过程结束时生成一个完整的样式表。如果我们愿意，我们可以验证代码确实来自两个独立的文件，如图\
    \ 2-11 所示。\n\n![../images/472539_1_En_2_Chapter/472539_1_En_2_Fig11_HTML.jpg](img/472539_1_En_2_Fig11_HTML.jpg)\n\
    \n图 2-11 – 证明我们的混合宏文件正在被使用……\n\n然而，这确实引发了一些关于管理导入文件的重要问题——前面提到的 WordPress 文件不是一个长样式表，而是由多个导入的文件组成。这意味着我们可以用一个文件存储变量，另一个文件处理页眉，第三个文件处理文章，也许第四个文件处理响应式媒体查询，等等。真正的诀窍是确保我们在每个文件中存储正确的内容，以免导入那些又会导入其他文件的文件——如果我们不小心，这可能会变得非常混乱！\n\
    \n此外，在某些情况下，导入的文件不会编译为 Sass 文件，而是编译为 CSS 文件——这些情况包括：\n\n*   如果文件扩展名是 `.css`\n\
    *   如果文件名以 `http://` 开头\n*   如果文件名是一个 `url()`\n*   如果 `@import` 包含任何媒体查询\n\n只要扩展名以\
    \ `.scss`（或 `.sass`）结尾，Sass 就会在编译过程中尝试将该文件导入到主样式表中。\n\n## 总结\n\n呼——这是一次关于 Sass\
    \ 变量和混合宏的快速浏览之旅！我们在本章中涵盖了一些有用的关键主题，所以让我们花点时间回顾一下我们学到的内容。\n\n我们通过首先了解创建变量开启了 Sass\
    \ 世界的旅程；我们介绍了这些变量在实现时如何非常有用，特别是在处理颜色等值时。我们探讨了在选择名称时多加注意的好处，这样如果需要进行更改，就可以减少这些更改对代码的影响。\n\
    \n接下来，我们简要探讨了添加注释——我们看到这些注释主要与标准 CSS 类似，但在编译 Sass 代码时存在一些差异。\n\n然后，我们学习了混合宏——我们从创建一个基本的混合宏开始，然后学习了如何整合他人创建的混合宏，并研究了那些可以根据传递给混合宏的值生成不同代码的混合宏。最后，我们通过重新审视将独立文件导入到\
    \ Sass 开发中的主题来结束本章，以便我们能够在开发过程中更好地管理代码。\n\n我们不会停留太久——我们还有很多内容要覆盖！我们已经创建了单条规则，但经常会出现我们创建的某些规则部分重复的情况（因为它们涉及相同的元素、类或选择器\
    \ ID）。这可能会使样式开发变得重复——如果我们能够嵌套样式，或者更高效地重用现有样式呢？我们可以——您将在下一章中学习到开始所需的所有知识。\n"
- fmt: "# 3. Creating Nested Styles\n\nIf you spend any time writing CSS styles, I\
    \ have no doubt that sooner or later, you will have come across instances where\
    \ your code contains selectors or classes that go several levels deep. What do\
    \ I mean by this? Well, let me explain.\n\nTake, for example, a navigation bar.\
    \ This has been around for years – it’s a basic staple of websites, although how\
    \ we decide to skin it will differ between sites. However, the basic principle\
    \ uses unordered lists, which can go several levels deep:\n\n```\nHeading 1\n\n\
    Test link\nTest link \nTest link\nTest link\n\nHeading 2\n\nHeading 3\n\nTest\
    \ link\nTest link\nTest link\nTest link\n```\n\nGranted, our example is a little\
    \ simplistic, but hopefully you get the idea! To style our example, we would use\
    \ the following classes:\n\n```\nnav {...}\nnav li a {...}\nnav li ul {...}\n\
    nav li ul li a {...}\n```\n\nNotice any similarities between each style – say,\
    \ for example, how some of the element names repeat themselves …?\n\nThe elements\
    \ we’re using are fairly short, but if we had decided to reference longer class\
    \ names (such as `ul.navigation li a.about ul li a`, for example), then our code\
    \ will soon become awkward to read. This will cause a real problem – is there\
    \ a better way? Thankfully, with the power of Sass there is – let me introduce\
    \ you to the concept of nesting.\n\n## Breaking Apart the Concept of Nesting\n\
    \nPut simply, nesting allows us to store (or nest) styles within others, when\
    \ there is a clear sense of commonality between elements. This means that instead\
    \ of having to write the class or selector out in full for each rule, we can just\
    \ include the part is specific to our nested rule. At the point of compilation,\
    \ Sass will turn each declaration into a valid rule by referencing the parent\
    \ selector or class. To see what I mean, let’s take our simple example and convert\
    \ it to Sass:\n\n```\nnav {\n...\nli {\na {...}\nul {...}\nli a {...}\n}\n}\n\
    ```\n\nThere – that looks a little easier to read, right? Nesting is a great time\
    \ saver, as it helps cut down the number of times we have to repeat the same selector;\
    \ it also feels more natural and easier to understand when reading our code.\n\
    \nLet’s put this into practice and create – yes, you probably guessed what’s coming:\
    \ a basic navigation! Nesting can be used at any time when developing Sass – as\
    \ long as we have multiple styles that reference the same parent element or class,\
    \ then nesting can be applied. As it so happens, navigation lends itself really\
    \ well to nesting, so let’s dive in and see how this works in practice.\n\n###\
    \ Creating a Simple Menu Bar\n\nLet’s make a start on creating our demo:\n\n![../images/472539_1_En_3_Chapter/472539_1_En_3_Fig1_HTML.jpg](images/472539_1_En_3_Chapter/472539_1_En_3_Fig1_HTML.jpg)\n\
    \nFigure 3-1\n\nCreating a basic menu using nesting\n\n1. We’ll begin by downloading\
    \ and extracting a copy of the `nesting` folder from the code download that accompanies\
    \ this book – save it to our project area.\n\n2. Next, fire up your text editor\
    \ – we’re going to add in the styles needed for our demo.\n\n3. We’ll add the\
    \ code required, in blocks – go ahead and add the following base styles for our\
    \ demo:\n\n    ```\n    @font-face {\n    font-family: 'pt_sansregular';\n   \
    \ src: url('../font/pt_sansregular.woff') format('woff');\n    font-weight: normal;\n\
    \    font-style: normal;\n    }\n    body {\n    font-family: 'pt_sansregular',\
    \ sans-serif;\n    padding: 20px;\n    }\n    h1 {\n    font-size: 20px;\n   \
    \ }\n    ```\n\n4. The crux of our demo is the navigation bar we’re creating –\
    \ for this, add the following style rule below the previous `h1` tag, leaving\
    \ a blank line after that tag:\n\n    ```\n    nav {\n    width: 600px;\n    }\n\
    \    ```\n\n5. Next, we need to add in the style rule for our unordered list that\
    \ forms our navigation – for this, leave a blank line after the `width: 600px`\
    \ declaration, then add this:\n\n    ```\n    ul {\n    list-style: none;\n  \
    \  margin: 0 3%;\n    padding: 0;\n    }\n    ```\n\n6. With our unordered list\
    \ container in place, we can now style each of the menu items – for this, leave\
    \ a blank line after the closing bracket of the previous step, then add this:\n\
    \n    ```\n    li {\n    display: inline-block;\n    padding-right: 10px;\n  \
    \  }\n    ```\n\n7. To make our navigation work, we need to add links for each\
    \ entry – go ahead and leave a blank line after the closing bracket of step 6,\
    \ then add these styles:\n\n    ```\n    a {\n    background-color: #faebd7;\n\
    \    border: 1px solid #ccc;\n    color: #666;\n    display: block;\n    padding:\
    \ 6px 12px;\n    text-decoration: none;\n    font-size: 32px;\n    }\n    a:hover,\
    \ a:focus{\n    background-color: darken(#faebd7, 20%);\n    }\n    a:active {\n\
    \    background-color: #666;\n    border-color: #666;\n    color: #efefef;\n \
    \   }\n    ```\n\n8. Save the file as `nesting.scss` in the `scss` folder.\n\n\
    9. Next, fire up a terminal session and change the working folder to the `nesting`\
    \ folder under our project area.\n\n10. At the prompt, type the following command\
    \ and press Enter:\n\n    ```\n    sass sass\\nesting.scss css\\nesting.css\n\
    \    ```\n\n11. If all is well, we should see a `nesting.css` file appear in the\
    \ `css` folder, along with a source map.\n\n12. If we preview the results in a\
    \ browser, we will show a simple box with styled elements, as indicated in Figure\
    \ [3-1](#472539_1_En_3_Chapter.xhtml#Fig1):\n\nSee how easy it was to nest our\
    \ code? The basic principle of nesting is straightforward, but the real test of\
    \ applying nesting comes with making sure you use the right parent selector, so\
    \ that any nested style names are as short as possible and keep duplication to\
    \ a minimum. To see what I mean, let’s take a few moments to explore our demo’s\
    \ code in more detail, so you can see how we arrived at the structure used in\
    \ the code.\n\n## Breaking Apart Our Code\n\nOkay, granted, I may have been a\
    \ little too presumptuous with the beginning statement of that last paragraph,\
    \ but in reality, nesting isn’t a hard technique to understand. The skill lies\
    \ in making sure that we pick the right selector to form the basis for our nesting.\
    \ Let’s work through our example in a little more detail:\n\nWe kicked off this\
    \ demo by setting some styles to help with the presentation of our demo – the\
    \ crux of our demo kicks in with the initial `<nav>` statement on line 17. Any\
    \ styles we need to apply to the `<nav>` element sit immediately under it; styles\
    \ for child rules are then simply indented below this initial declaration. In\
    \ our case, this means that the `ul`, `li`, and `a` (and pseudo-its classes),\
    \ are all indented at the first level only. They will become `nav ul`, `nav li`,\
    \ `nav a`, and so on – Sass understanding that `nav` in this instance is the common\
    \ element and therefore acts as the parent."
