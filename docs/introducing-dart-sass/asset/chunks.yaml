    \ '(max-width: 480px)'\n    )\n    );\n    ```\n\n5.  We then need to add in our\
    \ mixin, which will be called on to create our styles:\n\n    ```\n    @mixin\
    \ media-query ($size) {\n    @each $item, $value in $media-queries {\n    @if\
    \ $item == $size {\n    @if map-get($value, breakpoint) != null {\n    @media\
    \ only screen and #{map-get($value, breakpoint)} {\n    @content;\n    }\n   \
    \ }\n    }\n    }\n    }\n    ```\n\n6.  We’re almost done with the styles – last,\
    \ but by no means least, comes the basic style for our responsive <div> element,\
    \ along with the calls to the mixin to add our responsive colors:\n\n    ```\n\
    \    .row { display: inline-block; width: 100%; font-size: 22.4px;\n    text-align:\
    \ center; color: #FFF; padding: 4% 10%; box-sizing: border-box; }\n    .row {\n\
    \    background: darkgrey;\n    @include media-query(mobile) {\n    background:\
    \ lightgrey;\n    }\n    @include media-query(tablet) {\n    background: darkgrey;\n\
    \    }\n    }\n    ```\n\n7.  Go ahead and save the file – next, fire up a terminal\
    \ session and change the working folder to the `breakpoints` folder under our\
    \ project area.\n\n8.  At the prompt, type the following command and press Enter:\n\
    \n    ```\n    sass sass\\breakpoints.scss css\\breakpoints.css\n    ```\n\n9.\
    \  If all is well, we should see a `breakpoints.css` file appear in the `css`\
    \ folder, along with a source map – previewing the results will show a simple\
    \ template page with styled elements, as indicated in Figure [4-12](#472539_1_En_4_Chapter.xhtml#Fig12).\n\
    \nAlthough our demo only contains one element, there is still a reasonable amount\
    \ of code that we’ve had to add to make it responsive! Our code shows off some\
    \ key techniques that are worth mastering; most of these you have already met\
    \ earlier in the book, but not in the context of making elements responsive. Let’s\
    \ take a few minutes to revisit the code to see how it works in more detail.\n\
    \n### Understanding What Happened\n\nAlthough we’ve met most of the techniques\
    \ used in this demo before, at first glance you might be confused for thinking\
    \ it looks harder than it first appears. In reality, it’s fairly straightforward\
    \ code, so let’s go through it step by step:\n\nThe real meat of our code starts\
    \ in step 4, where we’ve created that map of media breakpoints – we’ve specified\
    \ two typical ones (tablet and mobile), but could equally include breakpoints\
    \ for desktop and other devices as needed. Inside this map, we’ve specified a\
    \ breakpoint between `480px` and `768px`, alongside another to cater to devices\
    \ no wider than `480px`.\n\nNext up we have a mixin – into this we pass the size\
    \ as a text name, which in this case will be mobile or tablet. We then iterate\
    \ through each item within the map; if the map contains an item of the right size,\
    \ we `map-get` its breakpoint `$value`, provided a suitable value exists in the\
    \ map. Assuming such a value exists, then we use the special keyword content to\
    \ apply this media query across all declarations, right up to the top level of\
    \ that selector. This will give us something akin to the example shown in Figure\
    \ [4-13](#472539_1_En_4_Chapter.xhtml#Fig13).\n\n![../images/472539_1_En_4_Chapter/472539_1_En_4_Fig13_HTML.jpg](images/472539_1_En_4_Chapter/472539_1_En_4_Fig13_HTML.jpg)\n\
    \nFigure 4-13\n\nOur compiled media query\n\nOur code looks complex, but in reality,\
    \ the only parts we need to worry about are the Sass map and calls to the mixin –\
    \ the mixin itself won’t change, and can equally be imported from a separate style\
    \ sheet using the `@include` command . This lets us concentrate on providing the\
    \ right breakpoints for the media query map (which could equally be imported too),\
    \ and to ensure that calls are positioned at appropriate points in our style sheet.\n\
    \n## Summary\n\nPhew – what a ride! We’ve covered a huge amount of content throughout\
    \ this chapter, so before we move onto creating the demo in the next chapter,\
    \ let’s take a moment to review what we’ve learned in this chapter.\n\nWe kicked\
    \ off with a look at using functions within Sass – we saw how these can be used\
    \ for a variety of purposes but which are particularly suited to tasks such as\
    \ creating colors. We also explored the benefits of using functions in this manner,\
    \ and how this makes it easier to create code.\n\nNext up came a look at how we\
    \ might assign styles at compilation, based on evaluating certain conditions –\
    \ this included a look at Sass’s control directives and expressions, and the various\
    \ ways we can automate the creation of styles by iterating through groups of elements\
    \ in a loop. We also took a look at how we can either specify a known number of\
    \ items in that loop, or use a loop which will only run if certain conditions\
    \ can be met in our code.\n\nWe then moved on to explore the use of Sass maps\
    \ and saw how easy it is to assign values to a single placeholder, whereas before\
    \ we might have used multiple variables to perform the same task. We then rounded\
    \ out the chapter with a brief look at the @media directive, to see how Sass might\
    \ help with creating media queries for responsive sites or online applications.\n\
    \nWell – we’re almost at the end of the book, but we can’t leave without putting\
    \ some of what we’ve covered thus far into practice! To help with this, we’re\
    \ going to run through a mini case study to see how we might use some of the techniques\
    \ we’ve learned in a more practical example – it’s time to get those dummy credit\
    \ cards at the ready, as we’re going to create the user interface for a shopping\
    \ cart. If I were you, I would go get a coffee or drink first, as we have a lot\
    \ to cover over the next few pages …!"
