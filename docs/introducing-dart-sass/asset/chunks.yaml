    our compilation process; you might prefer to use something like Grunt or Webpack
    instead. The aim, though, is to consider what you may or may not already have,
    whether you have any preferences (if you’ve used a task runner before), and to
    decide if the nature of your projects mean that you can benefit from automating
    the process.


    As an aside, it’s worth noting that I will use this process for exercises throughout
    this book, unless specified otherwise. This is just personal preference; please
    feel free to use whichever compilation process works best for you.


    Right – enough chitchat: time to change tack! Hopefully you’ll have tried a few
    options and have found something that works for you, or is at least working. It’s
    time we focused more on Sass itself, so without further ado, let’s begin with
    covering some of the key terms you will meet when working with Sass.'
  trans: '

    ### 拆解流程详解


    在过去的几页中，我们利用 Node.js（及其包管理器 NPM）的强大功能，创建了一个能自动编译 Sass 的基础系统。为了实现这一目标，我们借助了一些预配置指令文件来安装
    Node 及若干 NPM 包。现在，让我们从 `package.json` 开始，详细审视这些指令文件。


    `package.json` 文件包含我们将使用的所有包的详细信息——在本例中，我们指定了 Gulp 作为任务运行器，以及 `gulp-sourcemaps`（提供源码映射）、必不可少的
    `gulp-dart-sass`（用于 Sass 支持）和 `gulp-autoprefixer`（根据需要添加或移除浏览器前缀）。你可能会注意到，练习中并没有单独为每个包执行安装命令：这是有意为之。运行
    `npm install` 效率更高，因为它默认会在同一文件夹中查找 `package.json` 文件，并安装其中列出的所有包。虽然这需要事先做好准备工作来创建
    `package.json` 文件，但能简化安装流程。


    深入探讨 `package.json` 的具体设置已超出本书范围——如果你有兴趣了解更多，建议前往 [`https://docs.npmjs.com/getting-started/using-a-package.json`](https://docs.npmjs.com/getting-started/using-a-package.json)
    查阅详情。


    安装完成包之后，我们便利用 `gulpfile.js` 文件来执行编译操作。该文件包含一组指令，每当检测到目标文件夹中有文件发生变更时就会执行这些指令。让我们看看这段代码，首先从一些声明开始——第一行是强制启用严格错误检查：


    ```

    ''use strict'';

    ```


    接着，我们设置了一些针对不同包的 require 声明，这些包会根据需要被调用：


    ```

    var gulp = require(''gulp'');

    var sass = require(''gulp-dart-sass'');

    var sourcemaps = require(''gulp-sourcemaps'');

    var autoprefixer = require(''gulp-autoprefixer'');

    ```


    下一个代码块是我们的 sass 任务——它负责将源文件编译为有效的 CSS 样式表文件：


    ```

    gulp.task(''sass'', function () {

    return gulp.src(''sass/*.scss'')

    .pipe(autoprefixer({ browsers: [''last 2 versions''] }))

    .pipe(sourcemaps.init(''/maps''))

    .pipe(sass().on(''error'', sass.logError))

    .pipe(sourcemaps.write(''./maps''))

    .pipe(gulp.dest(''./css'')) ;

    });

    ```


    它首先定位 `sass` 文件夹中扩展名为 `scss` 的文件；这是为了防止编译器尝试处理并非有效 Sass 源文件的文件！下一步是为尚未标准化的 CSS
    属性添加浏览器前缀；在本例中，我们支持每个浏览器最新的两个版本。


    接下来的步骤至关重要——它负责编译过程：要么成功编译文件，要么在屏幕上显示遇到的任何错误。我们最后会创建相应的源映射文件（方式类似于之前在终端会话中编译），然后将文件写入磁盘（存放到
    `css` 子文件夹中）。


    顺便提一下——默认情况下，输出格式是展开的；如果我们想改变输出格式，可以按如下方式修改代码：`sass({outputStyle: ''compressed''})`。


    如果没有最后一个任务——`default` 任务，上述所有操作都无法生效。当我们在终端提示符下输入 `gulp` 时，该任务就会立即运行。它会监视 `sass`
    文件夹中的任何 Sass 文件；任何更改都会触发 sass 任务：


    ```

    gulp.task(''default'', function () {

    gulp.watch(''sass/*.scss'', [''sass''])

    .on(''change'', function(evt) {

    console.log(

    ''\n[watcher] File '' + evt.path.replace(/.*(?=sass)/,") +

    '' was '' + evt.type + '', compiling...''

    );

    });

    });

    ```


    一旦发生更改，我们就会调用一个小函数来显示一条消息，确认哪个文件被修改了；然后代码会重新编译，并作为新的样式表和映射文件保存到磁盘。


    归根结底，搭建这套系统似乎需要不少工作量，但重要的是要意识到，你可能已经具备了部分基础。这只是实现编译流程自动化的一种方式；你或许更喜欢使用 Grunt 或
    Webpack 之类的工具。然而，目标在于评估你已具备或不具备的条件、你是否有任何偏好（如果你之前用过任务运行器），以及判断你的项目性质是否意味着你能从流程自动化中受益。


    顺便说一下，除非另有说明，整本书的练习都将使用这一流程。这纯属个人偏好；请随意使用最适合你的编译流程。


    好了，闲话少说——换换方向吧！希望你已尝试了几种方案，并找到了适合自己（或至少能正常运行）的方法。是时候更专注于 Sass 本身了，那么事不宜迟，让我们开始介绍使用
    Sass 时将会遇到的一些关键术语吧。

    '
- fmt: '# Getting Acquainted with Key Terms


    Over the course of this book, we’ll meet a host of different techniques and key
    terms when working with Sass – some will be easy to get to grips with, while others
    may take a little more time!


    We’ve already met the most important one – the compilation process. For us, it’s
    less about understanding the internal machinations of how it works, as it is a
    bit of a black box of tricks, so to speak! It’s more important to gain an appreciation
    of what we can do – for example, if we’re creating a set of buttons, we can write
    code that automates much of this for us, which Sass will compile (or transform)
    into valid CSS code.


    Compiling isn’t the only concept we cover, though – Sass has a number of key terms
    that we will explore throughout this book. Although many of these terms won’t
    mean anything just yet, I thought I would summarize some of the key ones here,
    so you can get a feel for what to expect later in the book. I will also include
    the relevant chapter number, so if you get stuck, you know which chapter to turn
    to for help:


    * **Comments** – this is one of the simplest techniques to use in Sass; it works
    just in the same way as you would for normal CSS. The key to using them though
    is in the type of comment you use – for example, single line comments are removed
    during compilation, while multi-line comments are preserved. We’ll cover this
    in more detail in the section “Adding Comments,” in Chapter [2](#472539_1_En_2_Chapter.xhtml).


    * **Variables** – think of these as placeholders for values; Sass looks for every
    single instance of a particular variable and replaces it with the real value that
    we set up at the start. It doesn’t matter how many instances we have of a particular
    variable in our code – Sass replaces them all! We’ll talk more on this subject
    in the section “Creating Variables in a Practical Context,” in Chapter [2](#472539_1_En_2_Chapter.xhtml).


    * **Mixins** – variables are a good start, but what if we wanted to define bigger
    blocks of code in the same way? Step up mixins – these act as predefined blocks
    of code we can literally “mix in” to our code. We can define them once and reuse
    them in multiple projects – turn to Chapter [2](#472539_1_En_2_Chapter.xhtml)
    to learn more about this useful technique.


    * **Importing and Partials** – if you’ve ever had to work on large spreadsheets
    (such as the monster that is WordPress, at 4,500+ lines!), then you will know
    only too well how painful it can get when managing so many lines of code. Sass
    has an `@import` function, similar to CSS; we can use it to create partials or
    fragments of CSS code that we can import to our main style sheet. We’ll cover
    this, and more, in Chapter [2](#472539_1_En_2_Chapter.xhtml).


    * **Nesting** – how many times have you written CSS code for something such as
    a menu system, only to find yourself repeating multiple styles? Well, with Sass,
    we can nest styles within a style – think of it as grouping styles together, inside
    a base style that is common to all. In a sense it’s a form of shorthand, which
    makes it easier to read the code – we’ll cover this in Chapter [3](#472539_1_En_3_Chapter.xhtml),
    “Creating Nesting Styles.”


    * **Inheritance** – this is a little more tricky: instead of rewriting code blocks
    with similar properties multiple times, how about inheriting one from another?
    A perfect example is creating buttons – we can write a base style rule to cover
    attributes such as size and font. Any buttons we create can then inherit this
    base style, plus any we specify for each button, such as its color. It’s a great
    technique to learn but takes time to really master – we’ll start that journey
    in Chapter [3](#472539_1_En_3_Chapter.xhtml), “Creating Nesting Styles.”


    * **Operators** – I suspect in many cases you might specify fixed values in your
    spreadsheet, such as `16px` for a `font-size` attribute, right? What if we could
    work out values dynamically, using nothing more than simple operations such as
    addition or subtraction? Gone are the days when we might have to specify a whole
    set of color palette values, for example – as long as we have one, we can use
    a little math to work out complementary colors automatically. I’ll reveal how,
    and more, in Chapter [4](#472539_1_En_4_Chapter.xhtml), “Calculating Values Using
    Operations.”


    * **Directives** – this is where things get really interesting! CSS already has
    several `@-`rules; Sass adds to these with some such as `@extend` or `@media`.
    Think of these as rules that help control the flow and logic in your Sass code
    – a great example is `@media`, which we use to specify which rules to apply for
    responsive site development. We’ll dive in to the world of directives in Chapter
    [4](#472539_1_En_4_Chapter.xhtml), “Calculating Values Using Operations.”


    Phew – there’s a real bunch of exciting techniques coming our way! Of course,
    we don’t have to cover them all in one go – the great thing about Sass is that
    we can start with simple techniques such as setting up variables, then gradually
    make use of more tools as we develop our style sheets. Before we start on that
    journey, though, there is one topic that I know will be of most benefit to anyone
    starting with Sass – where can I get help if something isn’t working or I get
    stuck?'
