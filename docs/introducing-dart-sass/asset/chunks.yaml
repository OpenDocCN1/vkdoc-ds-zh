    *This is dedicated to my family, with thanks for their love and support whilst
    writing this book.*


    Introduction


    *Introducing Dart Sass* is for people who want to quickly create valid CSS styles
    for use within websites.


    Originally written in Ruby, and released back in 2006, this new version has been
    rewritten from ground up to be faster and simpler to use, yet still retain the
    same features that users of Sass have come to know and love.


    Over the course of this book, I’ll take you on a journey through using the library,
    showing you how easy it is to quickly create reusable styles with the minimum
    of fuss – we’ll cover such diverse topics as operations, string interpolation,
    creating and manipulating content using functions, and more, with lots of simple
    exercises to help develop your skills using Sass as a tool.


    *Introducing Dart Sass* is for the website developer who is keen to learn how
    to quickly leverage the power of Sass to produce valid style sheet code, where
    pressure is on to produce results rapidly. It’s perfect for those in Agile teams
    where time is of the essence, or for developers keen to build reusable styles
    to help save development time and resources for present and future projects.


    Acknowledgments


    Writing a book can be a long but rewarding process; it is not possible to complete
    it without the help of other people. I would like to offer a huge vote of thanks
    to my editors – in particular, Nancy Chen and Louise Corrigan; my thanks also
    to Ferit Topcu as my technical reviewer, and James Markham for his help during
    the process. All four have made writing this book a painless and enjoyable process,
    even with the edits.


    My thanks also to my family for being understanding and supporting me while writing –
    I frequently spend lots of late nights writing alone, so their words of encouragement
    have been a real help in getting past those bumps in the road and producing the
    finished book that you now hold in your hands.


    ### About the Author and About the Technical Reviewer


    ### About the Author


    ### About the Technical Reviewer


    # 1. Introducing Sass


    > *Imagine the scene if you will – it’s late on Friday, and you’re ready to go
    home. Only your boss walks up to your desk and says there’s a last-minute change
    needed on some styles for the buttons in your latest project. Ugh – so much for
    finishing on time. …*


    Sound familiar? Ordinarily, we might have to spend hours poring through style
    sheets, working out which styles to change and where, hoping that we don’t miss
    anything in our hunt. This is a real drag, particularly when you had hopes to
    go on a night out – no problem if you use Sass!


    The term “Sass” has been floating around for a few years, with some well-known
    names as proponents of the technology. The real question I’ll bet you’re asking
    though is this: What is all of the hype about, and how will it help in my development?


    ## What Is Sass?


    These are two very good questions ask to really understand what Sass is all about;
    however, we must first answer one question: What is a CSS preprocessor?


    Put simply, a preprocessor is a scripting language that we can use to extend CSS;
    we use it to write code in one language before compiling it into CSS. Sass is
    arguably the most popular of these although others exist, such as Less or Stylus.
    Sass allows us to create all types of shortcuts: from simple placeholders to update
    multiple instances of a single value, through to creating new styles that subsume
    existing base styles.


    So now that we’ve been introduced to preprocessors, it’s time we answered those
    two questions: What is Sass all about, and how is it going to help in my development?


    First appearing back in 2006 and created by Hampton Catlin, Sass, or Syntactically
    Awesome Stylesheets (yes, it is a bit of a mouthful), is billed as an extension
    of CSS. It brings in the power of basic scripting tools such as variables and
    loops, to help keep your code more organized and create style sheets faster than
    with ordinary CSS. If the thought of creating variables or loops scares you, then
    don’t worry – they are much easier to use than the terms might imply! We will
    go through all of the core functions of Sass over the course of this book; by
    the end, you will be more at ease with Sass and wonder why you hadn’t made the
    change to using it sooner.


    Okay – let’s move on: now that we’ve been formally introduced, let’s answer the
    second question: How is Sass going to help me when it comes to developing style
    sheets?'
