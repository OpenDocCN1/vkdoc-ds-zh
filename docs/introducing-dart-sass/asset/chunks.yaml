    \ ability to import them into the master style sheet during compilation.\n\nIn\
    \ contrast, the second partial makes use of more Sass functions: we started with\
    \ defining a number of variables for colors used in the demo. We’ve used a mix\
    \ of static and dynamic values; it’s important to note that the order is critical,\
    \ as we make use of static variables to create subsequent colors.\n\nThe trick\
    \ to understanding how the functions work is something we covered back in Chapter\
    \ [4](#472539_1_En_4_Chapter.xhtml) – as a reminder, read the function from the\
    \ inside out. So, for example, the moderate cyan color used is first saturated\
    \ by `2.4%`, before being lightened by `10.39%`.\n\nThe reason the percentage\
    \ values are so precise? The values were generated using the Sass color tool at\
    \ [`http://razorltd.github.io/sasscolourfunctioncalculator/`](http://razorltd.github.io/sasscolourfunctioncalculator/)\
    \  – this tool is worth its weight in gold, when it comes to creating colors!\n\
    \nMoving on, we then assigned four different font families to variables, based\
    \ on the fonts we set up in the first partial – we make use of PT Sans and Open\
    \ Sans, the latter of which is in light, bold, and regular type faces. The style\
    \ sheet is then closed out with a single mixin to assign the right font color,\
    \ weight, and size, based on the calling declaration in the main style sheet.\
    \ This uses an `@if...@else` statement to determine that we should use the Light\
    \ family for a font-weight value of `300`, the Regular family for `400`, and Bold\
    \ for a weight value of `700` or higher.\n\nIt’s at this point we should point\
    \ out a particular feature in use within this mixin – we have a nested property.\
    \ This is a simple way to group together multiple styles under a single name (or\
    \ namespace): each property within that nested block is automatically preceded\
    \ with the parent name. Take a look at Figure [6-1](#472539_1_En_6_Chapter.xhtml#Fig1),\
    \ where we’ve grouped two font properties together – our Sassmeister example them\
    \ compiles them into the font-* properties we know in CSS.\n\n![../images/472539_1_En_6_Chapter/472539_1_En_6_Fig1_HTML.jpg](images/472539_1_En_6_Chapter/472539_1_En_6_Fig1_HTML.jpg)\n\
    \nFigure 6-1\n\nA namespaced nested property\n\n(In case you’re wondering – you\
    \ can do something similar with lots of properties in Sass, such as border, padding,\
    \ or margin!)\n\nOkay – it’s time, folks: we’re at the point where we can create\
    \ our master style sheet! If you’ve already read ahead and gasped at the amount\
    \ of code we’re going to cover, then don’t worry – it may look a lot, but we’ll\
    \ go through it bit by bit. Much of the code has been nested, with descendant\
    \ selectors within their respective parent elements – let’s dive in and take a\
    \ look at what we need to set up to make our demo work.\n\n### Setting Up the Main\
    \ Style Sheet\n\nThis is where all of the magic happens – there is a fair amount\
    \ of code, although if you scan through the code, you will hopefully see that\
    \ much of it has been nested. This makes it easier to read and understand what\
    \ has been assigned to each parent or descendant element.\n\nDepending on which\
    \ text editor you use, you may find you can collapse blocks of code – this will\
    \ also help make it easier to identify the main elements used in the demo."
  trans: "\n### 初始化变量\n\n我们开始设置文件：\n\n1.  在新文件中，添加以下变量块——这负责定义我们将在演示中使用的一些基础颜色：\n\n\
    \    ```\n    $color-black: #000000;\n    $color-yellow: #ffdb4d;\n    $color-pure-red:\
    \ #ff0000;\n    ```\n\n2.  接下来，空一行，然后添加以下代码行——这些颜色用于书籍上的删除悬停链接和主要结算按钮：\n\n   \
    \ ```\n    // 青色系\n    $color-dark-cyan: #429188;\n    $color-moderate-cyan: lighten(saturate($color-dark-cyan,\
    \ 2.40), 10.39);\n    ```\n\n3.  空一行，然后添加以下代码行——它们负责处理每本书籍文章内的背景颜色：\n\n    ```\n\
    \    // 白色系\n    $color-white: #ffffff;\n    $color-almost-white: darken($color-white,\
    \ 1.18);\n    ```\n\n4.  最后一组颜色将主要用于边框和总值的背景颜色：\n\n    ```\n    // 灰色系\n    $color-light-grey:\
    \ #eeeeee;\n    $color-description-grey: darken($color-light-grey, 13.33);\n \
    \   $color-very-light-grey: darken($color-light-grey, 7.06);\n    $color-dark-grey:\
    \ darken($color-light-grey, 33.33) ;\n    ```\n\n5.  我们可以使用普通字体，如无衬线字体，但那看起来会很无聊——为了让我们的演示更出彩，我们为变量分配了四种不同的字体系列：\n\
    \n    ```\n    // 字体系列\n    $pt-sans-family: 'pt_sansregular', sans-serif;\n \
    \   $open-sans-light-family: 'open_sanslight', sans-serif;\n    $open-sans-regular-family:\
    \ 'open_sansregular', sans-serif;\n    $open-sans-bold-family: 'open_sansbold',\
    \ sans-serif;\n    ```\n\n6.  我们的演示使用了一个单一的混入——它负责根据给定的字体粗细，分配正确的字体系列、大小和颜色：\n\
    \n    ```\n    @mixin fontdetail ($color, $size, $weight) {\n    @if $weight ==\
    \ 300 {\n    font-family: $open-sans-light-family;\n    } @else if $weight ==\
    \ 400 {\n    font-family: $open-sans-regular-family;\n    } @else {\n    font-family:\
    \ $open-sans-bold-family ;\n    }\n    color: $color;\n    font: {\n    size:\
    \ $size;\n    weight: $weight;\n    }\n    }\n    ```\n\n7.  继续，将文件保存为 `sass`\
    \ 文件夹下的 `_variables.scss`——你可以暂时关闭该文件，但我们在编译过程中还会用到它。\n\n虽然这个导入文件不算长，但它确实开始使用\
    \ Sass 的功能——例如，我们使用颜色函数来定义调色板中用到的一些颜色。花点时间更深入地理解这一点是值得的；当我们查看主样式表时，这些内容就会开始串起来。现在，我们先详细分解一下我们使用的代码。\n\
    \n#### 深入了解导入的代码\n\n在我们创建的第一个局部文件中，我们声明了一些 `@font-face` 规则——这些规则会根据分配给特定元素的字体粗细来使用。每个声明都使用\
    \ `@font-face` 的标准格式；我们只是利用 Sass 在编译时将其导入主样式表的能力。\n\n相比之下，第二个局部文件使用了更多的 Sass 函数：我们首先为演示中使用的颜色定义了许多变量。我们混合使用了静态值和动态值；需要注意的是，顺序至关重要，因为我们使用静态变量来创建后续的颜色。\n\
    \n理解这些函数如何工作的诀窍，我们在第 4 章中已经讲过——提醒一下，要从内向外阅读函数。例如，用于中等青色（moderate cyan）的颜色，首先被饱和了\
    \ `2.4%`，然后被提亮了 `10.39%`。\n\n为什么百分比值如此精确？这些值是通过 `http://razorltd.github.io/sasscolourfunctioncalculator/`\
    \ 上的 Sass 颜色工具生成的——在创建颜色时，这个工具的价值堪比黄金！\n\n接着，我们根据在第一个局部文件中设置的字体，为变量分配了四种不同的字体系列——我们使用了\
    \ PT Sans 和 Open Sans，其中 Open Sans 包含细体、粗体和常规体。然后，样式表以一个单一的混入结束，该混入根据主样式表中的调用声明来分配正确的字体颜色、粗细和大小。它使用一个\
    \ `@if...@else` 语句来判断：当字体粗细值为 `300` 时使用细体家族，`400` 时使用常规体家族，`700` 或更高时使用粗体家族。\n\
    \n此时，我们应该指出这个混入中使用的一个特定功能——我们有一个嵌套属性。这是一种将多个样式分组到单个名称（或命名空间）下的简单方法：嵌套块中的每个属性都会自动以父级名称开头。请看图\
    \ 6-1，我们将两个字体属性分组在一起——在我们的 Sassmeister 示例中，它们被编译成我们在 CSS 中熟知的 `font-*` 属性。\n\n\
    ![../images/472539_1_En_6_Chapter/472539_1_En_6_Fig1_HTML.jpg](img/472539_1_En_6_Fig1_HTML.jpg)\n\
    \n**图 6-1** 一个带命名空间的嵌套属性\n\n（如果你好奇的话——在 Sass 中，你可以对许多属性做类似的事情，比如 `border`、`padding`\
    \ 或 `margin`！）\n\n好了，各位，是时候了：我们已经可以创建主样式表了！如果你已经提前阅读过，并为我们将要介绍的代码量感到震惊，那么别担心——代码看起来可能很多，但我们会一点一点地讲解。大部分代码都是嵌套的，后代选择器位于它们各自的父元素内部——让我们开始看看我们需要设置什么才能使我们的演示工作。\n\
    \n### 设置主样式表\n\n这就是所有魔法发生的地方——代码量相当大，不过如果你通读代码，希望你能发现其中大部分都是嵌套的。这使得阅读和理清每个父元素或后代元素被分配了什么变得更容易。\n\
    \n根据你使用的文本编辑器，你可能会发现可以折叠代码块——这也有助于更容易地识别演示中使用的主要元素。\n"
- fmt: "### Putting Together The Master Style Sheet\n\nLet’s make a start:\n\n1. We’ll\
    \ start by creating a new file – go ahead and save it as `shoppingcart.scss` within\
    \ the `sass` subfolder of our `shoppingcart` folder.\n\n2. We have a fair amount\
    \ of code to cover, but we will go through it block by block – start by adding\
    \ these lines at the top of the file, to call in the import partials we created\
    \ earlier in this chapter:\n\n```\n@import \"fonts.scss\";\n@import \"variables.scss\"\
    ;\n```\n\n3. Our demo needs some base styles to prepare the ground – leave a line,\
    \ then add in the four following rules:\n\n```\n/* base styles */\nbody {\n  font-family:\
    \ $pt-sans-family;\n  margin: 32px;\n  background: $color-light-grey;\n  margin:\
    \ 0;\n  padding: 0;\n  overflow-x: hidden;\n  margin: 32px;\n}\n.container { margin:\
    \ 0 auto; width: 980px; }\n.clearfix { content: \"\"; display: table; clear: both;\
    \ }\nh2.exercise { margin-left: auto; margin-right: auto; width: 980px; }\n```\n\
    \n4. With the base rules in place, we can now cover each of the principal areas\
    \ of the cart – we’ll start by adding in the rules for the cart header:\n\n```\n\
    /* header */\n#site-header {\n  margin: 0 auto;\n  padding-left: 20px;\n  background:\
    \ $color-white;\n  h1 {\n    @include fontdetail($color-black, 31px, 300);\n \
    \   padding: 20px 0;\n    position: relative;\n    margin: 0;\n  }\n}\n```\n\n\
    5. Next up come the nested rules for the main cart area, including product details:\n\
    \n```\n/* shopping cart */\n#cart {\n  width: 100%;\n  h1 { @include fontdetail($color-black,\
    \ 25px, 300); }\n  p { @include fontdetail($color-black, 18px, 300); }\n}\n.product\
    \ {\n  border: 1px solid $color-light-grey;\n  margin: 20px 0;\n  width: 100%;\n\
    \  position: relative;\n  transition: margin .2s linear, opacity .2s linear;\n\
    \  clear: both;\n  & img { width: 100%; height: 100%; }\n  .content {\n    background-color:\
    \ $color-white;\n    border-bottom: 1px solid $color-description-grey;\n    float:\
    \ left;\n    box-sizing: border-box;\n    height: 171px;\n    padding: 0 20px\
    \ 0 10px;\n    width: 83%;\n  }\n}\n.product header {\n  background-color: $color-white\
    \ ;\n  border-bottom: 1px solid $color-description-grey;\n  float: left;\n  margin:\
    \ 0 1% 20px 0;\n  overflow: hidden;\n  padding: 0;\n  position: relative;\n  width:\
    \ 153px;\n  height: 218px;\n  h3 {\n    @include fontdetail($color-white, 22px,\
    \ 300);\n    background: $color-moderate-cyan;\n    line-height: 49px;\n    margin:\
    \ 0;\n    padding: 0 30px;\n    position: absolute;\n    bottom: -100px;\n   \
    \ right: 0;\n    left: 0;\n  }\n  &:hover img { opacity: .7; }\n  &:hover h3 {\
    \ bottom: 73px; }\n}\n```\n\n6. Within each product description, we have a details\
    \ block – this contains the type of book selected, the unit price, quantity selected,\
    \ and total price for that book. Go ahead and add the following block of code:\n\
    \n```\narticle footer {\n  margin: 0;\n  padding: 0;\n  background-color: $color-almost-white;\n\
    \  .price {\n    @include fontdetail($color-black, 15px, 300);\n    background:\
    \ #fcfcfc;\n    float: right;\n    line-height: 49px ;\n    margin: 0;\n    padding:\
    \ 0 30px;\n    &:before { content: \"$\"; }\n  }\n  .full-price {\n    @include\
    \ fontdetail($color-black, 22px, 400);\n    background: $color-yellow;\n    float:\
    \ right;\n    line-height: 39px;\n    margin: 5px;\n    padding: 0 30px;\n   \
    \ transition: margin .15s linear;\n    width: 125px;\n    text-align: right;\n\
    \    &:before { content: \"$\"; }\n  }\n}\n```\n\n7. The next section takes care\
    \ of styling the two buttons used to update quantities of items in our basket.\
    \ Go ahead and add the following lines after the previous section, leaving a blank\
    \ line first:\n\n```\n.qt {\n  @include fontdetail($color-black, 19px, 300);\n\
    \  line-height: 50px;\n  width: 70px;\n  text-align: center;\n  display: block;\n\
    \  float: left;\n}\n.qt-plus, .qt-minus {\n  @include fontdetail($color-black,\
    \ 30px, 300);\n  display: block;\n  float: left;\n  background: $color-almost-white;\n\
    \  border: none;\n  height: 100%;\n  padding: 0 20px ;\n  transition: background\
    \ .2s linear;\n  line-height: 39px;\n  margin: 5px;\n  &:hover { background: $color-moderate-cyan;\
    \ color: $color-white; cursor: pointer; }\n}\n```\n\n8. The next section of our\
    \ cart is the footer at the bottom of the cart – for this, go ahead and leave\
    \ a line, then add in the following styles, to take care of the subtotal, tax,\
    \ and shipping values:\n\n```\n/* shopping cart footer */\n#site-footer {\n  background:\
    \ $color-white;\n  margin: 30px 0 0 0;\n  padding: 40px 0px;\n  width: 100%;\n\
    \  margin-left: auto;\n  margin-right: auto;\n  clear: both;\n  h1 {\n    @include\
    \ fontdetail($color-black, 25px, 300);\n    background: $color-almost-white;\n\
    \    border-bottom: 1px solid $color-description-grey;\n    margin: 0 0 7px 0;\n\
    \    padding: 14px 40px;\n    text-align: center;\n    span:before { content:\
    \ \"$\"; }\n  }\n  h2 {\n    @include fontdetail($color-black, 24px, 300);\n \
    \   margin: 10px 0 0 0;\n  }\n  h3 {\n    @include fontdetail($color-black, 19px,\
    \ 300);\n    margin: 15px 0;\n  }\n  .left { float: left; }\n  .right { float:\
    \ right; }\n}\n```\n\n9. We have a few miscellaneous styles, which don’t fit in\
    \ with the nested styles already covered; go ahead and add in the following below\
    \ the previous style block:\n\n```\nbutton {\n  @include fontdetail($color-black,\
    \ 24px, 400) ;\n  background: $color-yellow;\n  border: 1px solid $color-dark-grey;\n\
    \  border-style: none none solid none;\n  cursor: pointer;\n  display: block;\n\
    \  padding: 16px 0;\n  width: 290px;\n  text-align: center;\n  transition: all\
    \ .2s linear;\n  &:hover { color: $color-white; background: $color-dark-cyan;\
    \ }\n}\n.small {\n  @include fontdetail($color-black, 13px, 300);\n  background:\
    \ $color-almost-white;\n  padding: 10px 16px;\n  line-height: 28px;\n  border:\
    \ none;\n  display: inline-block ;\n  line-height: 29px;\n}\n.contain { width:\
    \ 80%; margin-left: auto; margin-right: auto; }\n/* plus and minus buttons in\
    \ details */\n.minus { margin: 0 50px 0 0; }\n.added { margin: 0 -50px 0 0; }\n\
    ```\n\n10. We’re almost at the end – this next block styles the remove links and\
    \ buttons used on the site:\n\n```\n/* Remove link over books & remove button\
    \ in description */\na {\n  color: $color-black;\n  text-decoration: none;\n \
    \ transition: color .2s linear ;\n  &:hover { color: $color-moderate-cyan; cursor:\
    \ pointer; }\n}\n.removebtn {\n  @include fontdetail($color-black, 16px, bold);\n\
    \  width: 21px;\n  float: right;\n  margin-top: -72px;\n  background-color: $color-light-grey;\n\
    \  color: $color-white;\n  border-radius: 148px;\n  text-align: center;\n  height:\
    \ 20px;\n  line-height: 20px;\n  &:hover {\n    cursor: pointer;\n    background-color:\
    \ $color-pure-red;\n    transition: background-color 0.3s linear ;\n  }\n}\n```\n\
    \n11. The final block takes care of formatting the text displayed in the totals,\
    \ shipping, and tax values in our cart:\n\n```\n/* cart totals */\n.carttotal\
    \ {\n  margin: 20px;\n  display: inline-block;\n  float: right;\n  width: 110px;\n\
    \  margin-top: 13px;\n  & > img { width: 40px; height: auto; }\n  & > span {\n\
    \    background-color: $color-very-light-grey;\n    padding: 5px 10px;\n    border-radius:\
    \ 20px;\n    position: absolute;\n    margin-top: 25px;\n    margin-left: -20px\
    \ ;\n  }\n}\n.tax, .shipping, .subtotal {\n  span {\n    float: right;\n    &:before\
    \ { content: \"$\"; }\n  }\n  div { width: 100px; display: inline-block; }\n}\n\
    ```\n\n12. Go ahead and save the file – we can close it for the moment, but we\
    \ will make use of it shortly during the compilation process."
