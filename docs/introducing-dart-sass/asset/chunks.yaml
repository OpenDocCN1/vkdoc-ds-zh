    \ contains all of the markup, but this will be useless without our styling, so\
    \ let’s create a new file, saving it as `forloop.scss` in the `sass` folder for\
    \ this demo.\n\n3.  In the file, go ahead and add the following code blocks in\
    \ turn, beginning with some basic styles to set up our demo:\n\n    ```\n    $basecolor:\
    \ #213451;\n    @font-face {\n    font-family: 'pt_sansregular';\n    src: url('../font/pt_sansregular.woff')\
    \ format('woff');\n    font-weight: normal;\n    font-style: normal;\n    }\n\
    \    body { font-family: 'pt_sansregular', sans-serif; margin: 32px;}\n    ul\
    \ { width: 150px; background-color: rgba(0,0,0,0.6) }\n    ```\n\n4.  The remaining\
    \ rules form the crux of our demo – these take care of styling each list item:\n\
    \n    ```\n    $rainbow: silver slategrey antiquewhite darkgrey gainsboro;\n \
    \   @for $i from 1 through 5 {\n    li:nth-child(#{$i}) {\n    color: nth($rainbow,\
    \ $i);\n    font-size: 32px;\n    font-weight: bold;\n    }\n    }\n    ```\n\n\
    5.  Go ahead and save the file – next, fire up a terminal session and change the\
    \ working folder to the `forloop` folder under our project area.\n\n6.  At the\
    \ prompt, type the following command and press Enter:\n\n    ```\n    sass sass\\\
    forloop.scss css\\forloop.css\n    ```\n\n7.  If all is well, we should see a\
    \ `forloop.css` file appear in the `css` folder, along with a source map – previewing\
    \ the results will show a simple template page with styled elements, as indicated\
    \ in Figure [4-6](#472539_1_En_4_Chapter.xhtml#Fig6).\n\nHehe – I bet you didn’t\
    \ know a demo could be so friendly! Okay – yes, that was a terrible joke, but\
    \ leaving aside the content, our demo shows of a useful concept that is worth\
    \ coming to grips with when developing using Sass. Let’s take a look at that concept\
    \ in more detail.\n\n### Understanding How Our Code Works\n\nSo – what is that\
    \ concept that we speak of? It’s one of repetition – we have five items that form\
    \ a simple list: all of which need styling, but not all with the same values!\n\
    \nOur demo consists of five list items in a simple unordered list – as most of\
    \ the styles are similar, we only need write one instance of it and use a Sass\
    \ for loop to iterate through each item, in turn, to apply the appropriate styles:\n\
    \n```\n$rainbow: silver slategrey antiquewhite darkgrey gainsboro;\n@for $i from\
    \ 1 through 5 {\nli:nth-child(#{$i}) {\ncolor: nth($rainbow, $i);\nfont-size:\
    \ 32px;\nfont-weight: bold;\n}\n}\n```\n\nThe catch though is the color attribute\
    \  – as we want to apply different colors, we create a list, and assign this to\
    \ the variable `$rainbow`. In our for loop, we then count through this list and\
    \ apply a color to each in turn, which is formatted using string interpolation\
    \ (replacing `(#{$i})` with the appropriate number). When compiled, the code for\
    \ each of the list items will look something like the example shown in Figure\
    \ [4-7](#472539_1_En_4_Chapter.xhtml#Fig7).\n\n![../images/472539_1_En_4_Chapter/472539_1_En_4_Fig7_HTML.jpg](images/472539_1_En_4_Chapter/472539_1_En_4_Fig7_HTML.jpg)\n\
    \nFigure 4-7\n\nStyling a list item\n\nThis is a great way to apply styles, but\
    \ the key thing to remember is that of repetition – the items we are targeting\
    \ must be of the same type. In this instance, we were targeting list items; elements\
    \ of other types would have to be styled separately.\n\n### Looping Using @each\n\
    \nThis next looping function is a little more complex – it is not a loop function\
    \ as such, but we are looping through multiple items! Let me explain what I mean:\n\
    \nThe @each function allows us to set a variable to each item in a list or Sass\
    \ map – a list is just a comma-separated set of values. A map takes this up a\
    \ level – it allows us to assign multiple values to a single item, where they\
    \ relate to the same item. For example, we might be talking about a group of cars –\
    \ the properties could be color, make, model: these each apply to each car.\n\n\
    We will revisit the subject of Sass maps in more detail, later in this chapter.\n\
    \nTo see what this means in practice, we’re going to create a simple demo that\
    \ sets up a number of buttons using the `@each` function – for each, we’re going\
    \ to specify the color and button function using a Sass list, then iterate through\
    \ each to create our final style rules."
  trans: "\n### 理解发生了什么\n\n我们演示样式表的第一部分包含一些标准规则，用于定义演示和每个列表项的基本样式。不过，演示的关键从第 22 行开始，我们使用了三个`@if()`语句来创建颜色。\n\
    \n理解这些语句工作原理的最简单方法是：“如果条件为 X，则使用第一个值（真），否则使用第二个值（假）。”对于第一个语句，我们将“复古白”指定为真值颜色；由于我们的条件设置为真，这就是样式表中将使用的颜色。\n\
    \n对于第二种类型的`@if`语句（我们为第二个列表项设置了三个属性），只需要满足每个条件即可。如果答案正确（即为真），则应用方括号中显示的属性；如果不正确，则丢弃该属性。\n\
    \n剩下的两个示例与前两个的工作方式相同——第三个列表项遵循与第一个列表项相同的原理，第四个则采用与第二个列表项相同的技术。\n\n## 循环遍历样式\n\n\
    Sass 的关键能力之一是接管生成样式的工作——例如，我们可以使用函数创建整个调色板，或者让 Sass 选择应用于背景的颜色，使其不与前景色冲突。\n\n\
    但这只是 Sass 所能实现的一小部分——Sass 真正的强项在于遍历多个元素，从一组指令中为每个元素应用样式。例如，为电商网站创建一组支付卡图标——我们可以创建一组通用样式，但利用\
    \ Sass 从单个名称列表中为每个图像生成独特的样式。\n\nSass 有许多适合这类任务的函数——它们各有独特特性，但都遵循遍历一组元素的类似原理。让我们逐一了解，从`@for`函数开始。\n\
    \n### 使用`@for`\n\n我们的第一个函数`@for`用于重复创建一组样式——它使用一个计数器来遍历该样式的每个实例，并根据指令中的指定内容调整每个实例。该指令的语法非常简单：`@for\
    \ $var from <start> through <end>`，更改内容用花括号括起来。\n\n还有第二种格式可用——将单词`through`替换为`to`，效果同样良好。\n\
    \n让我们通过一个快速演示详细了解这个函数的工作原理。\n\n### 使用`@for`应用样式\n\n让我们开始设置我们的演示：\n\n![../images/472539_1_En_4_Chapter/472539_1_En_4_Fig6_HTML.jpg](img/472539_1_En_4_Fig6_HTML.jpg)\n\
    \n图 4-6\n\n使用`@for`循环遍历样式\n\n1.  我们首先从本书附带的代码下载中下载并解压`forloop`文件夹的副本；继续将其保存到我们的项目文件夹中。\n\
    \n2.  下载内容包含所有标记，但如果没有样式，这些将毫无用处，所以让我们创建一个新文件，将其保存为`sass`文件夹中的`forloop.scss`，用于此演示。\n\
    \n3.  在文件中，依次添加以下代码块，从一些设置演示的基本样式开始：\n\n    ```\n    $basecolor: #213451;\n  \
    \  @font-face {\n    font-family: 'pt_sansregular';\n    src: url('../font/pt_sansregular.woff')\
    \ format('woff');\n    font-weight: normal;\n    font-style: normal;\n    }\n\
    \    body { font-family: 'pt_sansregular', sans-serif; margin: 32px;}\n    ul\
    \ { width: 150px; background-color: rgba(0,0,0,0.6) }\n    ```\n\n4.  其余规则构成了我们演示的关键——这些规则负责为每个列表项设置样式：\n\
    \n    ```\n    $rainbow: silver slategrey antiquewhite darkgrey gainsboro;\n \
    \   @for $i from 1 through 5 {\n    li:nth-child(#{$i}) {\n    color: nth($rainbow,\
    \ $i);\n    font-size: 32px;\n    font-weight: bold;\n    }\n    }\n    ```\n\n\
    5.  继续保存文件——接下来，启动一个终端会话，并将工作文件夹更改为项目区域下的`forloop`文件夹。\n\n6.  在提示符下，输入以下命令并按回车键：\n\
    \n    ```\n    sass sass\\forloop.scss css\\forloop.css\n    ```\n\n7.  如果一切顺利，我们应该会看到`css`文件夹中出现一个`forloop.css`文件，以及一个源映射——预览结果将显示一个包含样式元素的简单模板页面，如图\
    \ 4-6 所示。\n\n嘿嘿——我打赌你没想到一个演示可以这么友好！好吧——是的，这是个很糟糕的笑话，但抛开内容不谈，我们的演示展示了一个有用的概念，在使用\
    \ Sass 进行开发时值得掌握。让我们更详细地看看这个概念。\n\n### 理解代码如何工作\n\n那么——我们说的这个概念是什么？是重复——我们有五个项目组成了一个简单的列表：所有这些都需要样式，但并非所有值都相同！\n\
    \n我们的演示包含一个简单无序列表中的五个列表项——由于大多数样式相似，我们只需编写一个实例，并使用 Sass 的 for 循环依次遍历每个项目，以应用适当的样式：\n\
    \n```\n$rainbow: silver slategrey antiquewhite darkgrey gainsboro;\n@for $i from\
    \ 1 through 5 {\nli:nth-child(#{$i}) {\ncolor: nth($rainbow, $i);\nfont-size:\
    \ 32px;\nfont-weight: bold;\n}\n}\n```\n\n但关键在于颜色属性——因为我们想应用不同的颜色，所以创建了一个列表，并将其赋值给变量`$rainbow`。在\
    \ for 循环中，我们遍历这个列表并为每个项目依次应用颜色，颜色值使用字符串插值（将`(#{$i})`替换为适当的数字）进行格式化。编译后，每个列表项的代码将类似于图\
    \ 4-7 中所示的示例。\n\n![../images/472539_1_En_4_Chapter/472539_1_En_4_Fig7_HTML.jpg](img/472539_1_En_4_Fig7_HTML.jpg)\n\
    \n图 4-7\n\n为列表项添加样式\n\n这是一种很好的应用样式的方式，但需要记住的关键点是重复——我们定位的项目必须是同一类型。在这个例子中，我们定位的是列表项；其他类型的元素必须单独设置样式。\n\
    \n### 使用`@each`进行循环\n\n下一个循环函数稍微复杂一些——它本身不是一个循环函数，但我们却在循环遍历多个项目！让我解释一下我的意思：\n\n\
    `@each`函数允许我们将一个变量设置为列表或 Sass 映射中的每个项目——列表只是一组逗号分隔的值。映射则将这一点提升到一个层次——它允许我们为单个项目分配多个值，这些值都关联到同一个项目。例如，我们可能正在讨论一组汽车——属性可能包括颜色、品牌、型号：这些属性分别适用于每辆汽车。\n\
    \n我们将在本章后面更详细地重新讨论 Sass 映射的主题。\n\n为了理解这在实践中意味着什么，我们将创建一个简单的演示，使用`@each`函数设置多个按钮——对于每个按钮，我们将使用\
    \ Sass 列表指定颜色和按钮功能，然后遍历每个按钮以创建最终的样式规则。\n"
- fmt: "### Styling Each Item\n\nLet's make a start on our demo:\n\n![../images/472539_1_En_4_Chapter/472539_1_En_4_Fig8_HTML.jpg](images/472539_1_En_4_Chapter/472539_1_En_4_Fig8_HTML.jpg)\n\
    \n**Figure 4-8** Creating button styles using `@each`\n\n1. We'll begin by downloading\
    \ a copy of the `eachitem` folder from the code download that accompanies this\
    \ book – save it to the root of our project folder.\n\n2. Next, we need to add\
    \ in our Sass styling – for this, go ahead and create a new file, saving it as\
    \ `eachitem.scss` in the `sass` subfolder in the `condition` folder we saved in\
    \ step 1.\n\n3. We have a few style rules to add in, which we will add in block\
    \ by block, starting with some basic styles required to set up our demo:\n\n \
    \   ```\n    @import url(https://fonts.googleapis.com/css?family=Poiret+One);\n\
    \    @font-face {\n    font-family: 'pt_sansregular';\n    src: url('../font/pt_sansregular.woff')\
    \ format('woff');\n    font-weight: normal;\n    font-style: normal;\n    }\n\
    \    body {\n    font-family: 'pt_sansregular', sans-serif;\n    margin: 32px;\n\
    \    }\n    ```\n\n4. Next up are some initial values we create, along with a\
    \ Sass list to store values in pairs (each pair containing the button type and\
    \ a variable pointing to its color):\n\n    ```\n    $publish: gainsboro;\n  \
    \  $postpone: antiquewhite;\n    $delete: silver;\n    $states: (publish, $publish),\n\
    \    (postpone, $postpone),\n    (delete, $delete);\n    ```\n\n5. With our base\
    \ values in place, we can now style our button – for this, go ahead and add the\
    \ following code:\n\n    ```\n    @each $buttonstate, $color in $states {\n  \
    \  button { color: #000; text-decoration: none; padding: 5px 10px; border-radius:\
    \ 3px; font-family: 'Poiret One', cursive; font-size: 32px; font-weight: bold;\
    \ outline: 0; }\n    .#{$buttonstate} {\n    padding: 10px 20px;\n    border:\
    \ none;\n    background-color: $color;\n    &:hover { background-color: darken(\
    \ $color, 10% );      transition: all 0.3s ease; }\n    &:active { background:\
    \ darken($color,25%); }\n    }\n    }\n    ```\n\n6. Go ahead and save the file\
    \ – next, fire up a terminal session and change the working folder to the `eachitem`\
    \ folder under our project area.\n\n7. At the prompt, type the following command\
    \ and press Enter:\n\n    ```\n    sass sass\\eachitem.scss css\\eachitem.css\n\
    \    ```\n\n8. If all is well, we should see a `colorfunctions.css` file appear\
    \ in the `css` folder, along with a source map – previewing the results will show\
    \ a simple template page with styled elements, as indicated in Figure [4-8](#472539_1_En_4_Chapter.xhtml#Fig8).\n\
    \nUp until now, we've talked about applying styles to items in an iterative process\
    \ – it doesn't matter how many items feature in our group; each will have the\
    \ same set of styles applied to them. This demo shows a different way of looping\
    \ through items; it has one key difference, so let's pause for a moment and reflect\
    \ on the code from our demo in more detail.\n\n### Dissecting the Demo\n\nThe\
    \ `@each` function is different – as a start, there is no emphasis on numbers;\
    \ `@each` will iterate through everything that is included in the targeted list.\
    \ However, where using `@each` helps, is in the ability to group properties together\
    \ for each item in a list; Sass will apply each property to that item in turn.\n\
    \nTake for example our demo – we created a set of three buttons, which had button\
    \ types and colors applied to them, in pairs:\n\n```\n$states: (publish, $publish),\n\
    (postpone, $postpone),\n(delete, $delete);\n@each $buttonstate, $color in $states\
    \ {\n...\n.#{$buttonstate} {\n...\n&:hover { background-color: darken( $color,\
    \ 10% );      transition: all 0.3s ease; }\n&:active { background: darken($color,25%);\
    \ }\n}\n}\n```\n\nWe started by creating a list of items for each button – the\
    \ list items are in pairs, with `$buttonstate` and `$color` values assigned to\
    \ each button. We then iterate through each pairing, using string interpolation\
    \ to create styles based on the button type. At the same time, we create hover\
    \ and active states for each button, using the supplied `$color` value which is\
    \ darkened by `10%` for hover and `25%` for active states respectively.\n\n##\
    \ Looping if a Condition Is True\n\nOn occasions we may not have a defined number\
    \ of items to iterate through, or that this number may vary – in these instances\
    \ using a `@for` loop or `@each` in an array will not work. Instead, we must use\
    \ another function – `@while`.\n\nSo – I hear you ask: What's the difference?\
    \ Well, the answer is simple – it works on the basis that it will keep loop *while\
    \ a given condition can be met*. The moment we can't satisfy this condition, then\
    \ the loop will stop, and Sass will move on to compile the next set of rules in\
    \ the style sheet. In many cases, a `@while` loop works in much the same way as\
    \ other languages such as JavaScript – to see what I mean, let's take a look at\
    \ a simple example, where we iterate through ten list items, styling each with\
    \ a darker shade of color.\n\n### Looping `@while` True\n\nOur demo is very simple\
    \ to put together, so let's make a start:\n\n![../images/472539_1_En_4_Chapter/472539_1_En_4_Fig9_HTML.jpg](images/472539_1_En_4_Chapter/472539_1_En_4_Fig9_HTML.jpg)\n\
    \n**Figure 4-9** Styling list items using a while loop\n\n1. We'll begin by downloading\
    \ a copy of the `whileloop` folder from the code download that accompanies this\
    \ book – save it to the root of our project folder.\n\n2. Next, we need to add\
    \ in our Sass styling – for this, go ahead and create a new file, saving it as\
    \ `whileloop.scss` in the `sass` subfolder in the `condition` folder we saved\
    \ in step 1.\n\n3. We have a few style rules to add in, which we will add in block\
    \ by block, starting with some basic styles required to set up our demo:\n\n \
    \   ```\n    $start-color: gainsboro;\n    $end-color: black;\n    $white: #ffffff;\n\
    \    $step: 1; // Set the initial step value\n    @font-face {\n    font-family:\
    \ 'pt_sansregular';\n    src: url('../font/pt_sansregular.woff') format('woff');\n\
    \    font-weight: normal;\n    font-style: normal;\n    }\n    body { font-family:\
    \ 'pt_sansregular', sans-serif; margin: 32px; padding: 32px 80px; width: 550px;\
    \ }\n    ```\n\n4. We're creating a set of list items, so for this we need to\
    \ apply some basic styling that is common to each list item, such as font size:\n\
    \n    ```\n    ul { margin: 0; padding: 0; }\n    li {\n    color: $white;\n \
    \   display: inline-block;\n    font-size: 24px;\n    list-style-type: none;\n\
    \    margin-bottom: 3.2px;\n    padding: 8px;\n    width: 80px;\n    }\n    ```\n\
    \n5. The last part of our Sass styling takes care of applying an increasingly\
    \ darker shade of color to each list item:\n\n    ```\n    @while $step <=10 \
    \ {\n    // changes from one color to another\n    .mix li:nth-child(#{$step})\
    \ {\n    background-color: mix($end-color, $start-color, ($step * 10));\n    }\n\
    \    $step: $step + 1;\n    }\n    ```\n\n6. Go ahead and save the file – next,\
    \ fire up a terminal session and change the working folder to the `whileloop`\
    \ folder under our project area.\n\n7. At the prompt, type the following command\
    \ and press Enter:\n\n    ```\n    sass sass\\whileloop.scss css\\whileloop.css\n\
    \    ```\n\n8. If all is well, we should see a `whileloop.css` file appear in\
    \ the `css` folder, along with a source map – previewing the results will show\
    \ a simple template page with styled elements, as indicated in Figure [4-9](#472539_1_En_4_Chapter.xhtml#Fig9).\n\
    \nWhen working with multiple items of the same type, using a loop is a great way\
    \ to apply styles iteratively, without the need to write out style declarations\
    \ for each item individually. This is a useful technique to learn, even if it\
    \ is not one you might use immediately when starting with Sass – let's take a\
    \ moment to explore how our code works in more detail."
