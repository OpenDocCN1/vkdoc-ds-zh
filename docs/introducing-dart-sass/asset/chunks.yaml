    # 5. 开始使用 Sass 进行转换


    在本书中，我们第一次接触了 Sass，并了解了多种用于编写有效 CSS 代码的新技术。我们编写的大部分代码都是从头开始的；我猜想很多人会问——如何将现有项目转换为使用
    Sass 呢？


    这是一个很好的问题：我们所学的很多内容都假设在一个理想世界中，我们会从头编写代码，这也是充分发挥 Sass 优势的最佳方式。显然，这种理想情况并不总是发生，因此我们在开发中必须考虑到这一点。将庞大的样式表转换为有效的
    Sass 代码可能看起来令人生畏，但只要有一点耐心和周密的计划，这是可以实现的。为此，需要牢记三个关键因素：


    - Sass 仅仅是 CSS 的一个超集——不要认为你必须一次性转换所有内容！相反，分阶段进行更改：可能需要更长的时间，但从长远来看会更有效。

    - 规划和有条不紊绝对是最关键的——确保你的代码格式一致：例如，颜色代码应使用相同的表示法（白色用 `#fff` 或 `#ffffff`，但不要混用）。

    - 尽可能实现自动化——有可用的工具可以提供帮助，例如使用 Autoprefixer 在编译期间处理所有浏览器前缀。


    样式表的长度并不重要——我们可以使用相同的技巧将其分解并转换为对应的 Sass 代码。事实上，你可能会发现样式表越长越好：以 WordPress 自己的样式表为例，它超过
    4,500 行，并且本身就是用 Sass 编写的。


    我们可以使用一些小技巧来帮助过渡到使用 Sass，所以无论项目是什么，让我们看看如何让转换过程变得更容易。


    ## 简化流程


    乍一看，转换一个庞大的样式表确实会令人生畏——在本章中，我将向你展示一些可以开始转换过程的技巧和技术，并将其分解为更易于管理的步骤。


    当然，首要任务是设置好我们的 Sass 开发工作流——我们已经使用过手动编译器来生成 CSS 代码，但我们很可能还需要更多；是时候更进一步了！此时我们需要自动化我们的流程：我建议使用
    Node.js 以及以下一些工具：


    - Autoprefixer 用于在需要时添加浏览器前缀：[`https://github.com/postcss/autoprefixer`](https://github.com/postcss/autoprefixer)；

    - 图片精灵/压缩工具——尝试这个用于创建精灵图的插件：[`https://www.npmjs.com/package/spritesmith`](https://www.npmjs.com/package/spritesmith)，或使用
    [`https://www.npmjs.com/package/imagemin`](https://www.npmjs.com/package/imagemin)
    作为图片压缩插件；

    - Live-Reload：前往 [`https://www.npmjs.com/package/livereload`](https://www.npmjs.com/package/livereload)
    获取与 Node.js 配合使用的版本；

    - 任务运行器——一个额外的可选工具；你可以使用任何此类工具，例如 Gulp ([`https://gulpjs.com`](https://gulpjs.com))
    或 Grunt ([`https://gruntjs.com`](https://gruntjs.com))，或者如果愿意，也可以只使用纯 Node.js；

    - 文本编辑器的语法检查器——我个人最喜欢的是 Sublime Text ([`https://www.sublimetext.com/3`](https://www.sublimetext.com/3))；它有一个可从
    [`https://packagecontrol.io/packages/Sass`](https://packagecontrol.io/packages/Sass)
    获取的 Sass 语法检查插件。


    当然，使用哪些工具很大程度上取决于你是否有现有的工作流程；Sass 是一种无需大量额外工具即可入门的库之一。假设我们已经设置了开发环境，这里有一个要点清单，可以帮助你进行使用
    Sass 的初步更改：


    - 在进行任何更改之前，我建议阅读 [`https://sass-guidelin.es/`](https://sass-guidelin.es/) 上的内容——由
    Hugo Giraudel 编写，提供了一些关于如何组织 Sass 样式表和代码的有用技巧。

    - 我们能做的最简单的更改是将样式表重命名为 `.scss` 扩展名——Sass 只是 CSS 的一个超集，因此其中的任何样式都可以正常编译（实际上，编译器会原封不动地保留它们！）。

    - 考虑删除代码中所有带浏览器前缀的声明；这将简化你的代码，并且稍后可以使用 Autoprefixer 工具自动添加这些前缀。

    - 确保你的所有值格式一致。这将使我们在开始添加变量时，能够更容易地使用文本编辑器中的查找和替换功能来替换代码。

    - 我建议检查并尽可能将代码重组为可识别的部分——这将使其更容易转换为在编译期间可以导入的局部文件。

    - 开始*仔细*阅读你的代码——你是否在代码中发现了重复的地方，即在多个位置指定了相同的值？


    至此，绝对值得花时间规划你的样式表在转换为 Sass 后的样子。我们应该充分利用 Sass 在编译过程中导入多个文件的能力，这样常见的元素就可以轻松地分组并存储在各个文件中。


    如何组织这些文件没有绝对的对错之分；这在很大程度上取决于个人需求，但随着时间的推移，你会发现自己形成一种适合在使用 Sass 时处理的大多数项目的结构。

