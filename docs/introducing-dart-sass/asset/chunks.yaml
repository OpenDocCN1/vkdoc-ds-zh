- fmt: '# 5. Making the Conversion to Using Sass


    Over the course of this book, we’ve met Sass for the first time and have been
    introduced to a number of new techniques to help with producing valid CSS code.
    Much of the code we’ve written has been from ground up; I suspect that many will
    ask – how do I convert an existing project to use Sass?


    It’s a great question: much of what we’ve learned assumes that in an ideal world,
    we’d be writing code from scratch, which is the best way to get the most out of
    Sass. Clearly this perfect scenario doesn’t always happen, so we must allow for
    this in our development. It might seem daunting to convert a monster style sheet
    into something resembling valid Sass code, but with a little patience and careful
    planning, it can happen. To help with this, there are three key factors to bear
    in mind:


    - Sass is just a superset of CSS – don’t think you have to convert everything
    in one go! Instead, make your changes in stages: it may take longer but will be
    more effective longer term.

    - Planning and being methodical is absolutely key – make sure your code is consistently
    formatted: for example, color codes should use the same notation (`#fff` or `#ffffff`
    for white, but not both).

    - Automate as much as you can – there are tools available to help, such as using
    Autoprefixer to cater for any vendor prefixes during compilation.


    It doesn’t matter how long or short a style sheet is – we can use the same techniques
    to break it down and convert it into its Sass equivalent. Indeed, you may find
    the longer the better: take, for example, WordPress’s own style sheet, which is
    over 4,500 lines long and is itself written using Sass.


    There are a few tricks we can use to help with making the transition to using
    Sass, so no matter what the project is, let’s take a look at how we can make the
    conversion process easier.


    ## Simplifying the Process


    At first glance, converting a monster-sized style sheet will indeed seem daunting
    – over the course of this chapter, I will show you a number of tips and techniques
    we can use to make a start on the conversion process, and break it down into more
    manageable steps.


    The first priority, of course, is to get our Sass development workflow set up
    – we’ve already used the manual compiler to produce CSS code, but it’s likely
    we will want more; it’s time to step things up a notch! It’s at this point we
    will need to automate our process: I would recommend using Node.js, along with
    some of these tools:


    - Autoprefixer for adding vendor prefixes where needed: [`https://github.com/postcss/autoprefixer`](https://github.com/postcss/autoprefixer);

    - Image spriting / minifier tools – try this plugin for creating sprites: [`https://www.npmjs.com/package/spritesmith`](https://www.npmjs.com/package/spritesmith),
    or [`https://www.npmjs.com/package/imagemin`](https://www.npmjs.com/package/imagemin)
    for an image minifier plugin;

    - Live-Reload: head over to [`https://www.npmjs.com/package/livereload`](https://www.npmjs.com/package/livereload)
    for a version that works with Node.js;

    - A task runner – an optional extra; you can use any such as Gulp ([`https://gulpjs.com`](https://gulpjs.com))
    or Grunt ([`https://gruntjs.com`](https://gruntjs.com)), or remain with pure Node.js
    if preferred;

    - Syntax checker for text editor – my personal favorite is Sublime Text ([`https://www.sublimetext.com/3`](https://www.sublimetext.com/3));
    this has a syntax checker plugin for Sass available from [`https://packagecontrol.io/packages/Sass`](https://packagecontrol.io/packages/Sass).


    Of course, a lot of what you use will depend on whether you have an existing workflow
    in place; Sass is one of those libraries that doesn’t require a lot of additional
    tools to get started. Assuming we’ve set up our development environment, here’s
    a checklist of pointers to help with the initial changes to using Sass:


    - Before we make any changes, I would recommend reading the content at [`https://sass-guidelin.es/`](https://sass-guidelin.es/)
    – written by Hugo Giraudel, this gives some useful tips on how to structure Sass
    style sheets and code.

    - The simplest change we can make is to rename our style sheet to have an `.scss`
    extension – Sass is just a superset of CSS, so any styles within will compile
    just fine (and in reality, will be left untouched by the compiler anyway!).

    - Consider removing any vendor prefixed versions declarations in your code; this
    will simplify your code, and these can be added later automatically using the
    Autoprefixer tool.

    - Make sure all of your values are consistently formatted. This will make it easier
    to replace code when we start to add variables, using the search and replace option
    in our text editor.

    - I would recommend checking and restructuring your code into recognizable sections
    where possible – this will make it easier to convert into partials, which can
    be imported during compilation.

    - Start reading through your code *carefully* – do you see any repetition in your
    code, where you’re specifying the same values in more than one place?


    At this point it’s absolutely worth spending time planning how your style sheet
    will look once converted to Sass. We should make full use of Sass’s ability to
    import multiple files during the compilation process, so common elements can easily
    be grouped together and stored in individual files.


    There is no right or wrong way to how you structure these files; much of it will
    depend on individual requirements, but over time you will find yourself developing
    a structure that suits most of the projects you work on when using Sass.'
