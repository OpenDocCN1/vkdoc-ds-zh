  trans: "\n然而，最终成功的关键在于你如何组织局部文件——目标是**将代码分离到不同的文件中**，从而将多次导入文件的需求降到最低。为了让您了解文件夹结构的一种组织方式，可以查看\
    \ Danny Huang 提供的示例——对于较小的项目，他使用一个基础文件（存放大部分代码，包括重置样式）、一个组件文件（存放可复用的代码，如按钮），以及一个布局文件来处理内容的整体布局。这些文件在编译时都会被合并到他的主文件中。\n\
    \n您可以在 [`https://medium.com/@dannyhuang_75970/sass-project-structure-for-big-projects-8c4a740846ee`](https://medium.com/@dannyhuang_75970/sass-project-structure-for-big-projects-8c4a740846ee)\
    \ 阅读 Danny 关于组织 Sass 代码结构的文章。\n\n不过，对于大型项目来说，这可能还不够——相反，我们可以采用类似他为大型项目设计的模型：\n\
    \n- `base/` - 用于动画、排版和工具类\n- `components/` - 每个组件存储为单独的 Sass 文件\n- `layout/` -\
    \ 用于存储头部、网格、页脚和导航样式\n- `pages/` - 根据结构，可能每个页面都有一个单独的 Sass 文件\n- `abstracts/` -\
    \ 用于函数、混合宏和变量\n- `vendors/` - 第三方 CSS\n- `main.scss`\n\n一切都关乎规划——现在做得越多，将来就越轻松！但要记住：结构不一定是僵化的——我们完全可以开发出适应项目需求的结构，并在情况变化时进行修改。\n\
    \n好了，让我们回到那个清单：\n\n- 假设你看到了重复的情况——多个样式之间有多少共同点？理想情况下，你要找的是 3-4 条声明完全相同（或非常接近）的情况：这些可以转化为混合宏，并在相关规则内调用。\n\
    - 检查像按钮这样的项目，其样式可能由一些通用的基础规则组成，仅有细微差别（如颜色）。如果是这种情况，那么考虑使用 `extend` 函数来减少内容重复。\n\
    - 如果你通读代码，是否发现有 CSS 规则嵌套了好几层的情况？一个典型的例子可能出现在导航中，你使用多个 `<li>` 元素来样式化无序列表的每个部分。考虑将这些转换为嵌套样式——这将使你的代码更易读，并有助于减少代码重复。\n\
    - 一个可以做的长期改变是考虑使用预构建的库，其他人已经开发了诸如混合宏或颜色变量之类的代码，你可以直接在代码中复用。\n- 图片——如果尚未使用，能否将它们转换为精灵图？Sass\
    \ 让精灵图的使用变得非常容易——它不适用于一些较大的图片，但对较小的图片来说非常完美。或者，考虑使用 SVG 图片作为图标——由于它们由 HTML 和 CSS\
    \ 组成，可以轻松地使用 Sass 设置样式，并且（取决于你如何调用它们），还可以减少我们对服务器的请求次数！\n\n看到了吗？只需做一些改动，开始使用 Sass\
    \ 是多么容易！诚然，随着时间的推移，我们还可以做其他改动，但当你最初改用 Sass 作为开发工具时，这些改动会让你领先一步。\n\n说到做改动——我们可以手动进行（因为这能让我们很好地体会到在哪里做改动），或者也可以利用一些转换工具替我们完成一些繁重的工作。虽然这些工具可能不会给我们最终成品，但至少会让我们有一个好的开端——在接下来的几页中，我们将更详细地了解其中一个工具，看看它们究竟是如何工作的。\n\
    \n## 开始转换\n\n好了，我们已经讨论了如何进行转换过程——现在是行动的时候了！\n\n在转换 Sass 时，应始终将其视为一个随时间演进的迭代过程；我们拥有一份极其简单的样式表的可能性可能几乎为零。当然，我们可以尝试手动转换，但这将是一个耗时的过程。\n\
    \n相反，为什么不使用几种现成的工具呢？这些工具可以替你完成一些繁重的工作。有几个现成的例子，包括 `css2scss` ( [`https://www.css2scss.com/`](https://www.css2scss.com/)\
    \ )，或者 [`http://css2sass.herokuapp.com/`](http://css2sass.herokuapp.com/) 上的 `css2sass`\
    \ 应用。\n\n不过，我个人最喜欢的是 `Styleflux` 工具，你可以通过 `Node.js` 从 [`https://www.npmjs.com/package/styleflux`](https://www.npmjs.com/package/styleflux)\
    \ 安装它。诚然，它可能不会产生完美的结果，但由于使用它的唯一成本是初始设置（只需一次），何不试一试呢？最坏的情况也就是它彻底失败，产生垃圾输出；在很多情况下，你会得到一些像样的结果，可能只需要稍作调整和整理。让我们在下一个演示中测试一下这个理论，看看它实际效果如何。\n\
    \n### 使用 Styleflux 转换为 Sass\n\n在这个练习中，我们假设你已经安装了第 1 章的 `Node.js`——如果没有，我建议你再回顾一下那一章！\n\
    \n假设我们已经安装了 `Node.js`，那么我们需要遵循以下步骤：\n\n1.  首先，在我们的项目区域创建一个新文件夹——命名为 `css2scss`。\n\
    2.  接下来，启动一个 `Node.js` 终端会话（不是标准终端！），并导航到我们的项目区域。\n3.  我们现在需要创建一个 `package.json`\
    \ 文件，`Node.js` 用它来告知使用哪些包——为此，在提示符下输入以下内容，然后按 Enter 键：\n\n    ```\n    npm init\
    \ –y\n    ```\n\n4.  当它确认 `package.json` 文件已创建后，在提示符下输入以下内容并按 Enter 键：\n\n   \
    \ ```\n    npm install styleflux –save\n    ```\n\n    如果 Node 提示创建了 `package-lock.json`\
    \ 文件，你可以阻止这种情况发生——将代码下载中的 `.npmrc` 和 `.gitignore` 文件复制到 `css2scss` 文件夹的根目录。\n\n\
    5.  接下来，我们需要创建转换脚本——为此，将以下代码添加到一个新文件中，并将其保存为项目区域中的 `styleflux.js`：\n\n    ```\n\
    \    const cssConverter = require('styleflux');\n    cssConverter.processCSSFile(\"\
    test.css\");\n    ```\n\n6.  我们现在可以测试文件转换了——为此，切换回终端会话，确保工作文件夹是 `css2scss` 文件夹。\n\
    7.  在提示符下，输入此命令并按 Enter 键：\n\n    ```\n    node styleflux.js\n    ```\n\n8.  如果一切顺利，我们应该会看到创建了一个包含我们\
    \ Sass 代码的新文件名，如图 5-1 所示。\n\n    ![../images/472539_1_En_5_Chapter/472539_1_En_5_Fig1_HTML.jpg](img/472539_1_En_5_Fig1_HTML.jpg)\n\
    \n    图 5-1\n\n    CSS 文件转换成功\n\n    顺便提一下——如果你想尝试不同的样式表，请在步骤 5 中更改高亮的文件名，然后在保存文件并从步骤\
    \ 6 开始运行之前进行修改。\n\n此时，我敢打赌你会问以下两个问题之一：这个工具处理大文件的效率如何？以及为什么我们不直接使用它……？这些都是非常相关的问题：第一个问题的答案可能会让你吃惊，而不直接使用这个工具有一个很好的理由。好奇吗？让我们深入了解并看看原因……\n"
- fmt: "### Using the `css2scss` Tool – a Postscript\n\nAnyone who knows me personally\
    \ will say that I’m a big fan of the KISS principle – for those of you who are\
    \ unaware, it means keep it simple, stu.....okay, I’ll let you fill in the rest!\n\
    \nBut seriously though: we live in an age where time is crucial, and I’m all for\
    \ automating those tasks that are time consuming and add little of value. That\
    \ said, I’ve also said we should absolutely read through our code to understand\
    \ where we can make changes. This would appear to contradict the previous approach,\
    \ so what gives?\n\nThere are several reasons why we should follow both approaches\
    \ – a conversion tool won’t be 100% perfect; it is reliant on us producing code\
    \ that uses consistent notation, such as using just 6-digit hex codes, or mixing\
    \ in color names. A read through the code to start with means we can check it\
    \ for consistency; we can also get a feel for where we will be able to convert\
    \ it to using Sass. Once this is done, we can then run it through the `css2scss`\
    \ tool before checking the results in a text editor.\n\nIn terms of how well it\
    \ works – this might surprise you: while researching for this book, I tested it\
    \ on a heavy style sheet from the `twentyseventeen` theme that comes with WordPress.\
    \ This beast weighs in at around 4,300 lines of code – it certainly is no lightweight.\
    \ However, it doesn’t seem to have caused any issue: the tool converted it with\
    \ little difficulty, producing a Sass style sheet that weighs in at just under\
    \ 2,000 lines! It has to be said this would need checking, but it’s definitely\
    \ worth giving it a try, if only to understand more about how we might make the\
    \ changes manually.\n\nOkay – let’s change tack: as part of converting a style\
    \ sheet to using Sass, we might decide to split it into smaller, more manageable\
    \ chunks, or partials. There is nothing wrong with this; it’s a perfectly acceptable\
    \ approach.\n\nHowever, I suspect you may find yourself creating code similar\
    \ to that created by other developers and who have posted it online – why not\
    \ have a look? Rather than reinvent the wheel, see what you can find that people\
    \ may have already created: there are dozens of libraries available online for\
    \ us to use. I would absolutely recommend taking time to research possible options;\
    \ who knows what you might find! Making use of prebuilt libraries is not without\
    \ its issues – to understand why, let’s dive in and take a look at what is involved\
    \ in more detail.\n\n### Using a Prebuilt Library\n\nCast your mind back to our\
    \ discussion earlier in this chapter, under “Simplifying the Process.” Remember\
    \ how we talked about using the `@import` function to break down larger style\
    \ sheets into more manageable chunks?\n\nThis is the basic principle of how we\
    \ create Sass libraries – they are nothing more than smaller files containing\
    \ code such as mixins, loops, variables, and the like, or even components relating\
    \ to a specific part of the site (such as navigation). The key though is that\
    \ if we import the file into our style sheet, Sass will only call code that is\
    \ directly referenced from the main style sheet.\n\nWe can take this a step further\
    \ – we can, of course, create our own libraries. In some cases, though, there\
    \ may be no need: others may have done something for us already that we can reuse\
    \ in our code. Instead of trying to reinvent the wheel, we can simply import their\
    \ file – Sass will use only those mixins, functions, and the like that are called\
    \ from our main style sheet, and the rest will be left untouched.\n\nTo really\
    \ understand how this works, let’s dive into a demo – it may be somewhat simplistic\
    \ in nature, but when using `@import`, it’s the *process* that counts, not the\
    \ end result.\n\n#### Exploring Prebuilt Options\n\n> *Process, process – surely\
    \ the end result is more important, I hear you ask?*\n\nYes – clearly, we want\
    \ to achieve the right result. However, the means by which we get there is arguably\
    \ more important. Let me explain what I mean.\n\nIf we opt to use a prebuilt library,\
    \ it’s an almost certain that we will find one that contains all of the mixins,\
    \ variables, or functions that we need for a project. The trick here is to find\
    \ the ones that strike the right balance of functionality we can use, against\
    \ options that are of no interest to us (at least for the project in hand).\n\n\
    We can, of course, simply import multiple libraries, but this is inefficient –\
    \ there is little point importing one if we only use a tiny proportion of the\
    \ functionality within it. We may also find others at a later date that contain\
    \ better versions of mixins, or include more functionality within – we can then\
    \ decide to refactor our code to do away with redundant libraries if we want to\
    \ use a better option.\n\nThis is just a scratch on the surface of what we might\
    \ have to consider when using `@import` – we’ll come back to this shortly; but\
    \ for now, let’s work through a simple example to show you how we can use `@import`\
    \ to reference libraries when working with Sass.\n\n#### Using a Prebuilt Library\n\
    \nThis demo assumes that you have installed Node.js from Chapter [1](#472539_1_En_1_Chapter.xhtml),\
    \ which we need to use to download Bourbon – if you’ve not already done it, make\
    \ sure you have installed it, before you continue with this exercise.\n\nAssuming\
    \ it is in place and working, these are the steps you need to follow:\n\n![../images/472539_1_En_5_Chapter/472539_1_En_5_Fig2_HTML.jpg](images/472539_1_En_5_Chapter/472539_1_En_5_Fig2_HTML.jpg)\n\
    \n*Figure 5-2 Switching to use a prebuilt library*\n\n1. We’ll begin by extracting\
    \ a copy of the `library-prebuilt` folder from the code download that accompanies\
    \ this book: go ahead and store it in our project folder.\n\n2. We now need to\
    \ download the Bourbon library, so fire up a Node.js terminal session and change\
    \ the working folder to the `library-prebuilt` folder in our project area.\n\n\
    3. At the terminal prompt, enter this command and press Enter:\n\n   ```\n   npm\
    \ install bourbon --save\n   ```\n\n4. When the download has completed, go ahead\
    \ and copy the `_bourbon.scss` file and bourbon folder from `node_modules\\bourbon\\\
    core` to the sass folder under the `library-prebuilt` folder.\n\n   We now have\
    \ Bourbon in place – if you’ve gotten this far: well done! It does raise some\
    \ questions about how we use libraries, but for now, let’s update our code to\
    \ use Bourbon:\n\n5. Go ahead and open `library-prebuilt.scss`, then add this\
    \ line at the very top of the file:\n\n   ```\n   @import \"_bourbon.scss\";\n\
    \   ```\n\n6. A little further down, drop this code in place of the comment at\
    \ line 10:\n\n   ```\n   $size: 200px;\n   ```\n\n7. On or around line 36, change\
    \ the declaration for background color to this:\n\n   ```\n   background-color:\
    \ tint(#6ecaa6, 40%);\n   ```\n\n8. Save the file, then fire up a terminal session\
    \ and change the working folder to the `library-prebuilt` folder under our project\
    \ area.\n\n9. At the prompt, type the following command and press Enter:\n\n \
    \  ```\n   sass sass\\skeleton.scss css\\skeleton.css\n   ```\n\n10. If all is\
    \ well, we should see a `library-prebuilt.css` file appear in the `css` folder,\
    \ along with a source map – previewing the results will show a simple template\
    \ page with styled elements, as indicated in Figure [5-2](#472539_1_En_5_Chapter.xhtml#Fig2).\n\
    \nAt face value, the steps we’ve worked through in this demo are relatively straightforward\
    \ – they illustrate the kind of changes we might have to make to existing Sass\
    \ code, if we decide to switch to using a prebuilt library of some description.\
    \ However, I intimated that this is just a small part of the overall process –\
    \ there are some key points we should be aware of when using `@import`, so let’s\
    \ dive in and find out how these might affect our development."
