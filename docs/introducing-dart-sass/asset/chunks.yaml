  trans: "\n### 演示 – 优化导入\n\n幸运的是，我们可以对代码做一个简单的改动来解决这个问题——让我们开始更新演示：\n\n1.  首先，从本书附带的代码下载中提取一份优化导入后的文件副本——将其保存到我们的项目目录中。\n\
    2.  接下来，在文本编辑器中打开 `font-sizes.scss` – 将第 7、12、17 和 22 行的句点改为 `%` 符号，这样代码的开头看起来类似这个示例：\n\
    \n    ```scss\n    %h1 {\n    color: $grey;\n    ...\n    ```\n\n3.  我们还需要更新 `page.scss`\
    \ 以使用重命名后的占位符——为此，请将第 4 行和第 8 行的句点改为 `%` 符号，类似于这样：\n\n    ```scss\n    .page_title\
    \ {\n    @extend %h1;\n    }\n    ```\n\n4.  启动一个终端会话，然后将工作文件夹更改为我们在步骤 1 中创建的\
    \ `import-original` 文件夹。\n5.  在提示符下，输入以下命令并按 Enter 键：\n\n    ```sh\n    sass page.scss\
    \ css\\page.css\n    ```\n\n6.  如果我们查看 `css` 文件夹内部，应该会看到两个新文件 – `page.css` 和 `page.css.map`；这些文件包含我们更新后的样式。\n\
    \n现在——还记得我们上一个练习结束时做了什么吗？这次，我们不会有之前那六个相同的规则——相反，我们只会得到三个规则，这正是我们在最终成品中期望看到的。\n\
    \n此时，打开您将在 `css` 子文件夹中看到的最终样式表 `page.css` – 在里面我们确实只看到三个规则，如图 5-4 所示。\n\n![../images/472539_1_En_5_Chapter/472539_1_En_5_Fig4_HTML.jpg](img/472539_1_En_5_Fig4_HTML.jpg)\n\
    \n**图 5-4** 我们优化文件的结果\n\n看到单个字符能带来多大差别了吗？这引出了关于优化代码的两个要点，有助于减少重复和臃肿——让我们更详细地了解一下。\n\
    \n### 理解这些改动\n\n如果我们回顾一下编译后代码的原始版本，我们期望看到三个规则，但实际得到了五个（其中两个共享相同的规则）。\n\n其原因在于\
    \ `font-sizes.scss` 文件中使用了句点（以及后续在 `page.scss` 文件中对这些样式的引用）。这会迫使 Sass 将它们视为应该被导入的新样式——例如，请注意，`page.scss`\
    \ 中没有对 `.copy` 的引用，但它仍然被导入了最终结果中吗？\n\n当我们在 `font-sizes.scss` 文件中将句点改为百分号时，我们告诉\
    \ Sass，这些样式不应作为独立样式被导入，而仅在调用文件中通过 `@extend` 语句*直接引用*时，才导入每个样式的内容。这就是为什么当我们查看优化版本的编译结果时，只看到对\
    \ `.page_cta`、`.page_title` 和 `.page_special_button` 的引用——例如，`.copy` 规则没有在 `@extend`\
    \ 中被引用，因此不会出现在这个版本的样式表中。\n\n使用百分号是我们减少代码臃肿的一种方法——另一种方法在于我们导入局部文件的顺序，以及每个局部文件中存储的内容。再次查看\
    \ `font-sizes.scss`：注意到我们在同一个文件中同时声明了变量和样式规则了吗？\n\n在我们的简单示例中，这没有问题，但在更复杂的样式表中可能会导致重复。更好的选择是将所有变量只放在一个文件中——尽早导入这个文件将使变量全局可用，如下例所示：\n\
    \n```scss\n@import 'base/reset';\n@import 'helpers/variables';\n@import 'helpers/mixins';\n\
    @import 'helpers/functions';\n@import 'helpers/helpers';\n@import 'helpers/placeholders';\n\
    @import 'base/typography';\n@import 'pages/versions';\n@import 'pages/recording';\n\
    @import 'pages/lists';\n@import 'pages/global';\n@import 'forms/buttons';\n@import\
    \ 'forms/inputs';\n@import 'forms/validators' ;\n@import 'forms/fieldsets';\n\
    @import 'sections/header';\n@import 'sections/navigation';\n@import 'sections/sidebar-a';\n\
    @import 'sections/sidebar-b';\n@import 'sections/footer';\n@import 'vendors/ui-grid';\n\
    @import 'components/modals';\n@import 'components/tooltip';\n@import 'components/tables';\n\
    @import 'components/datepickers';\n```\n\n看起来文件很多，但重要的是要记住，只要保持合适的顺序，将内容拆分到更小的文件中会使管理更容易。上述列表可以存储在主样式表中，同时您可以按需处理每个局部文件——Sass\
    \ 会在编译期间导入所有文件以生成最终版本。\n\n您可能看到其他开发人员使用下划线来表示 Sass 局部文件——这不是必须的，因为即使没有下划线，Sass\
    \ 也能正常工作。\n\n好了——我们该继续了：我们已经讨论了很多关于导入内容的重要性；我想，是时候行动一下了！为了真正理解如何使用导入，我们将以一个大型\
    \ CSS 样式表作为真实示例，并将其内容转换为更适合未来开发的形式。\n\n## 通过一个示例进行练习\n\n还记得我之前说过，在小样式表中使用 `@import`\
    \ 不太可能获得太多好处，样式表越大效果越好吗？样式表的大小并不重要——我们讨论过的相同原则仍然适用，尽管转换大型样式表会比转换小型样式表获得更多好处。\n\
    \n一个大型样式表的绝佳示例来自 WordPress 自托管版本自带的 TwentySeventeen 主题。这个主题的样式表是一个真正的庞然大物：它超过\
    \ 4000 行！\n\n转换这样一个大小的文件似乎是一项艰巨的任务，但我会向您展示，通过仔细的规划和准备，我们将能够驯服这个庞然大物，使其更易于管理。不过，选择\
    \ WordPress 的样式表作为我们下一个练习的基础有两个很好的理由：\n\n*   WordPress 的样式表最初是使用 Sass 创建的——这使其成为一个自然的选择。\n\
    *   大小不重要：WordPress 的样式表已经有注释块来拆分内容。这使得一次一个块地转换文件变得轻而易举。这只是一个规划更改内容和更改时机的问题。\n\
    *   如果我们仔细查看其中的代码，WordPress 的样式表包含大量可以转换的声明示例。一个很好的例子包括字体名称、颜色和大小，它们都可以转换成命名恰当的变量。\n\
    \n为了证明无论大小如何，我们都可以控制大型样式表，我们将直接进入下一个练习，并正是这样做：我们将使用前面提到的 TwentySeventeen 主题，并开始将其转换成更易于我们管理的形式。\n"
- fmt: "### Refactoring Wordpress\n\nFor this exercise, we’ll need a copy of the self-hosted\
    \ version of WordPress – you can download it from WordPress’s website at [`https://wordpress.org/latest.zip`](https://wordpress.org/latest.zip)\
    \ (Windows) or [`https://wordpress.org/latest.tar.gz`](https://wordpress.org/latest.tar.gz)\
    \ (Linux and MacOS). The current version at the time of writing is 4.9.8, although\
    \ we can apply the same principles to any WordPress theme.\n\nLet’s make a start:\n\
    \n1.  First, we need to create a working folder for our conversion – save it as\
    \ `theme` under our project area.\n2.  Next, go ahead and extract a copy of the\
    \ style sheet – you will find it in the `twentyseventeen` theme folder, which\
    \ is under `/wordpress/wp-content/themes`. I would recommend taking two copies:\
    \ save one in a new folder called `original` (under `wordpress`), and the second\
    \ in the root of the `wordpress` folder; rename this second one to `style.scss`.\n\
    3.  Have a look through, then choose a section to work on – I’ll assume you’ve\
    \ chosen `18.0 SVGs Fallbacks`, as it is nice and small; please alter accordingly\
    \ if you decide to go with a different section.\n4.  Within our `wordpress` folder,\
    \ create a new folder called `fallback`. Create a new file within it, saving it\
    \ as `fallback.scss`.\n5.  Next, open a copy of `style.scss`, then look for section\
    \ 18 – it will be around line 3149 onward. Copy and paste all lines from that\
    \ section into the `fallback.scss` file and save it.\n6.  Revert back to `style.scss`,\
    \ then remove the original lines from this section (around lines 3149 to 3206).\n\
    7.  In its place, add this code, on line 3149:\n    ```\n    @import \"fallback/svg.scss\"\
    \n    ```\n8.  Go ahead and save both `style.scss` and `fallback.scss`.\n9.  Fire\
    \ up a terminal session, then change the working folder to the `wordpress` folder\
    \ we created in step 1.\n10.  At the prompt, enter this command, and press Enter:\n\
    \    ```\n    sass style.scss csss\\style.css\n    ```\n11.  If we look inside\
    \ the `css` folder, we should see two new files – `style.css` and `style.css.map`;\
    \ these contain our updated styles.\n12.  Open the compiled file and press Ctrl+F\
    \ to search for “18.0 SVGs Fallbacks”; you should see our fallback block has been\
    \ recompiled into our master style sheet.\n\nNotice how the code doesn’t look\
    \ any different, but you can now manage it in smaller files? The real test though\
    \ will come if we were to fire up a copy of WordPress with that theme activated;\
    \ a successful test will be that we see no apparent changes in the theme, even\
    \ though it has been compiled using Sass.\n\nIf you compare a copy of the original\
    \ style sheet (in the `original` folder I hope you created in step 2) with the\
    \ recompiled version, you may see comments have been removed, but otherwise the\
    \ CSS should be the same. This is a good indicator that the conversion process\
    \ will have been successful, and that our theme will continue to function as prior\
    \ to the change.\n\nAssuming this initial change was successful, this is just\
    \ the start of our journey into converting the file – there still more we can\
    \ do! To give you a flavor of what is possible, let’s dive in and take a look\
    \ at our initial change in more detail, along with some suggestions on where we\
    \ can convert our theme to use Sass.\n\n### Exploring the Changes and More in\
    \ Detail\n\nIt may seem like we had a fair few steps to work through, but in reality,\
    \ we can simplify it by making the compilation process automatic – the addition\
    \ of the `--watch` switch at the end of the code in step 10 will suffice. Much\
    \ of what we do though will be a simple cut-and-paste job, as long as we do it\
    \ section by section (adding the relevant import statement after each). The key\
    \ is to be methodical and remain focused – it’s too easy to get distracted when\
    \ converting code!\n\nNow – how about continuing with those changes? We could\
    \ work through these on our own, but as it so happens, there is a version available\
    \ online that has already been converted to use Sass.\n\nThe code is hosted on\
    \ GitHub and was created by the developer Jim Frenette; you can see it at [`https://github.com/jimfrenette/twentyseventeen-sass`](https://github.com/jimfrenette/twentyseventeen-sass).\n\
    \nI would absolutely encourage you though to try converting the style sheet first\
    \ yourself though – there is no fun in getting the answer without at least giving\
    \ it a try! With this in mind, I’m going to pick out a few examples of what can\
    \ be changed with little difficulty:\n\n*   I would recommend adding a `variables.scss`\
    \ file – this could be saved into a folder called `base`, then imported using\
    \ `@import \"base/variables.scss\"` at the top of your style sheet. This would\
    \ be for storing all your initial variables, such as colors, font families, or\
    \ font sizes.\n*   We can then make use of this variables file – for example,\
    \ take a look at section 10, which takes care of styling links. The first few\
    \ lines look like this:\n    ```\n    a {\n    color: #222;\n    text-decoration:\
    \ none;\n    }\n    a:focus {\n    outline: thin dotted;\n    }\n    a:hover,\n\
    \    a:active {\n    color: #000;\n    outline: 0 ;\n    }\n    ```\n    We can\
    \ convert them to this – it uses nesting and variables (hence creating the `variables.scss`\
    \ file first!):\n    ```\n    a {\n    color: $black2;\n    text-decoration: none;\n\
    \    &:focus {\n    outline: thin dotted;\n    }\n    &:hover, &:active {\n  \
    \  color: $black1;\n    outline: 0;\n    }\n    }\n    ```\n*   Take, for example,\
    \ section 11 – Featured Image Hover; this could easily be converted to look like\
    \ this:\n    ```\n    /*-----------------------------------------------------\n\
    \    11.0 Featured Image Hover\n    -----------------------------------------------------*/\n\
    \    .post-thumbnail {\n    margin-bottom: 1em ;\n    a {\n    img {\n    -webkit-backface-visibility:\
    \ hidden;\n    transition: opacity 0.2s;\n    }\n    &:hover img, &:focus img\
    \ {\n    opacity: 0.7;\n    }\n    }\n    }\n    ```\n*   A little more complicated,\
    \ but something to try: how about a mixin to convert font sizes to their rem unit\
    \ equivalents? WordPress makes use of both pixel and rem values – a mixin such\
    \ as this will take care of this:\n    ```\n    // usage, x is the pixel size\
    \ needed: @include font-size(x);\n    @mixin font-size($sizeValue: 15) {\n   \
    \ font-size: $sizeValue + px;\n    font-size: ($sizeValue / 16) + rem;\n    }\n\
    \    ```\n*   So – where we might have something like this in the style sheet:\n\
    \    ```\n    .pagination, .comments-pagination {\n    border-top: 1px solid $silver2;\n\
    \    font-size: 14px;\n    font-size: 0.875rem;\n    font-weight: 800;\n    padding:\
    \ 2em 0 3em;\n    text-align: center ;\n    }\n    ```\n    ... we can update\
    \ it to use a mixin to provide the font sizes automatically and avoid the need\
    \ to calculate the relevant sizes manually:\n    ```\n    .pagination, .comments-pagination\
    \ {\n    @include font-size(14);\n    border-top: 1px solid $silver2;\n    font-weight:\
    \ 800;\n    padding: 2em 0 3em;\n    text-align: center;\n    }\n    ```\n\nThese\
    \ are just a few of the example changes we can make to our style sheet – in each\
    \ instance, I’ve tried to keep it simple for now, but as you get more used to\
    \ making the changes, I am sure you will find others that are more complex and\
    \ require more work! The trick though is to remain methodical throughout – treat\
    \ it as an evolving exercise that will require a few iterations before you reach\
    \ the completed solution."
