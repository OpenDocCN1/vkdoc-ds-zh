  raw: '### Using Extends or Mixins?


    Aha – there is a good reason for this: we’re deliberately stopping Sass from displaying
    it. However, there is more to it than just hiding code – it has much to do with
    how extends work, similarities with mixins, and why it is important to choose
    the right function when writing code.


    Although both mixins and extends are very similar, there are two key differences
    we should be aware of:


    *   The extend rule doesn’t take parameters – mixins do.


    *   The extend rule can combine selectors, whereas mixins don’t.


    Put simply, extends are more efficient than mixins, but they don’t give us any
    opportunity to be flexible about values that we might otherwise pass to mixins.
    The best way to illustrate this is with an example; here’s the Sass part of the
    code from the previous demo, rewritten using a mixin:


    ```

    @mixin imgeffect {

    height: 20%;

    width: 47%;

    bottom: 30px;

    right: 12px;

    box-shadow: 0 33.6px 32px rgba(0,0,0,0.4);

    }

    .item:nth-of-type(4n+1) .polaroid:before {

    @include imgeffect;

    transform: rotate(6deg);

    }

    .item:nth-of-type(4n+2) .polaroid:before {

    @include imgeffect;

    transform: rotate(-6deg);

    }

    .item:nth-of-type(4n+3) .polaroid:before {

    @include imgeffect;

    transform: rotate(-4deg);

    }

    ```


    Try dropping this into a Sassmeister session – notice how, although it compiles
    correctly (producing 26 lines of code), it contains a great deal of repetition?


    Clearly this isn’t ideal – it will work, but compiling code in this manner will
    soon add a lot of extra bloat to our style sheet, and slow our site down. It’s
    for this reason that we need to be careful about whether we use a mixin or extend –
    there are some other considerations we should take into account when choosing
    what to use:


    *   As extends can’t accept parameters, this makes them less flexible than mixins –
    they are best suited to replicating the same styles across multiple elements,
    and where different properties are set by exception.


    *   We can’t use extends when creating responsive media directives; only mixins
    can be used in this instance.


    *   When using classes that contain extended code, any subclasses we then specify
    will automatically contain the extended code too. This can make for some odd effects
    if we’re not careful!


    *   On a more technical note – many people will claim that extends are faster
    than mixins. However, with modern server technologies (such as file compression),
    this isn’t always the case; in fact, mixins can be more effective, as strings
    are frequently repeated, which works better for compression.


    So – thinking back to our code: we can use either an extend or mixin in our instance.
    I chose to use an extend rule to illustrate how they work, but if you have server-based
    compression enabled (as do many servers), then you might decide to use a mixin
    instead. Ultimately it is all about taking care; it will depend on how your code
    is set up, and the number of levels your styles are set, as to which route you
    take when using mixins or extends.


    ## Summary


    The art of nesting and inheriting styles in Sass is a key topic – it’s one where
    the basics might be easy to learn, but mastering it can be a real skill! Over
    the course of this chapter, we’ve been introduced to both nesting and use of the
    extend rule, so let’s take a moment to review what we have learned.


    We kicked off this chapter by exploring how to nest our code – we understood that
    it helped to avoid repetition and reduce the amount of code we have to write.
    This was swiftly followed by a look at some of the pitfalls we might encounter
    when nesting code; at the same time, we discussed whether nesting is a bad practice,
    or just one that requires a certain amount of care when used.


    Moving on, we then switched to covering the use of parent selectors; we examined
    how this is essential for instances such as nesting pseudo-elements in code. We
    then took an in-depth look at the basics around the @extend directive – this included
    working through a detailed example before weighing up the pros and cons of using
    extends or mixins, given the similarities between both in Sass.


    Okay – let’s move on: we often have to write code that determines the outcome
    only after satisfying a condition. It’s an all-too common technique when writing
    script, but what about if we were creating styles? Plain CSS doesn’t allow for
    this, so styles have to be written statically. Not anymore: it’s time to turn
    the tables and start to use scripting techniques to control our CSS styles too
    …


    # 4. Calculating Values Using Operations


    One of the key benefits to using Sass is the ability to calculate values dynamically –
    I don’t just mean by using something like percentage values, but working out values
    using operators such as addition or subtraction.


    Yes, you read correctly – using math! Now, before you run for the hills, this
    isn’t as crazy as it may seem: we can already write statements such as `font:
    10px/8px;` in our code. As Sass is an extension of CSS, Sass not only supports
    this, but takes it to a whole new level. The great thing about this though is
    that the math involved does not have to be complicated at all – it can be as simple
    as adding two numbers together, or dividing a number.


    With this in mind, let’s take a look at the different type of operations we can
    perform using Sass, starting with some number-based operations.


    ## Number-Based Operations


    All of the standard operations such as addition or division are supported (including
    relational operators such as >= ); it means we can write a declaration such as
    this:


    ```

    p {

    $width: 780px;

    width: $width/2;

    }

    ```


    … which will compile to:


    ```

    p { width: 390px; }

    ```


    ### Operators for String-Based Content


    There are two main uses for operators when working with strings: we can concatenate
    text together or perform inline calculations using string interpolation. The latter
    isn’t complicated – it requires us to place our calculation inside curly brackets
    and precede this with a `#`, which tells Sass to calculate the total, as shown
    in this example:


    ```

    p:before {

    content: "I ate #{5 + 10} large " + apples;

    }

    ```


    ### Boolean-Based Operators


    On occasion, it may be useful to include declarations based on a condition being
    true or false; the declaration will be included if true, otherwise it will be
    omitted. Our third operation type allows Boolean values to control what is displayed:


    ```

    p:before {

    $count: 5;

    $yes: 1;

    @if ($count > 3 and $yes == 1) {

    content: "I ate #{5 + 10} large " + apples;

    }

    }

    ```


    When compiled, we get the following result:


    ```

    p:before {

    content: "I ate 15 large apples";

    }

    ```'
  trans: "\n### 使用 Extends 还是 Mixins？\n\n啊哈——这背后有充分的理由：我们有意阻止 Sass 显示它。但这不仅仅是隐藏代码那么简单——它与\
    \ extends 的工作方式、与 mixins 的相似性，以及在编写代码时选择正确函数的重要性密切相关。\n\n尽管 mixins 和 extends 非常相似，但有两个关键区别值得我们注意：\n\
    \n- `extend` 规则不接受参数——而 mixins 接受。\n- `extend` 规则可以合并选择器，而 mixins 则不能。\n\n简而言之，extends\
    \ 比 mixins 更高效，但它们在值的灵活性方面不如 mixins——我们无法像向 mixins 传递参数那样灵活地传递值。通过一个例子可以最好地说明这一点；以下是前面演示代码中重写为\
    \ mixin 的 Sass 部分：\n\n```scss\n@mixin imgeffect {\n  height: 20%;\n  width: 47%;\n\
    \  bottom: 30px;\n  right: 12px;\n  box-shadow: 0 33.6px 32px rgba(0,0,0,0.4);\n\
    }\n.item:nth-of-type(4n+1) .polaroid:before {\n  @include imgeffect;\n  transform:\
    \ rotate(6deg);\n}\n.item:nth-of-type(4n+2) .polaroid:before {\n  @include imgeffect;\n\
    \  transform: rotate(-6deg);\n}\n.item:nth-of-type(4n+3) .polaroid:before {\n\
    \  @include imgeffect;\n  transform: rotate(-4deg);\n}\n```\n\n尝试将其放入 Sassmeister\
    \ 会话中——请注意，虽然它可以正确编译（生成 26 行代码），但其中包含大量重复内容？\n\n显然这并不理想——它能运行，但以这种方式编译代码很快就会给样式表增加大量不必要的臃肿，并拖慢网站速度。正因如此，我们需要谨慎选择使用\
    \ mixin 还是 extend——在选择使用时，还应考虑其他一些因素：\n\n- 由于 extends 不能接受参数，因此它们不如 mixins 灵活——它们最适合在多个元素之间复制相同的样式，并通过例外情况设置不同的属性。\n\
    - 在创建响应式媒体指令时不能使用 extends；这种情况下只能使用 mixins。\n- 当使用包含扩展代码的类时，我们随后指定的任何子类也会自动包含该扩展代码。如果不小心，这可能会产生一些奇怪的效果！\n\
    - 从更技术性的角度来说——许多人声称 extends 比 mixins 更快。然而，在现代服务器技术（如文件压缩）下，情况并非总是如此；事实上，mixins\
    \ 可能更有效，因为字符串会频繁重复，这更有利于压缩。\n\n那么——回到我们的代码：在我们的实例中，既可以使用 extend 也可以使用 mixin。我选择使用\
    \ extend 规则来说明它们的工作原理，但如果你启用了基于服务器的压缩（许多服务器都是如此），那么你可能会决定使用 mixin。归根结底，这都需要谨慎处理；具体采用\
    \ mixin 还是 extend，取决于代码的设置方式以及样式设置的层级数量。\n\n## 总结\n\n在 Sass 中嵌套和继承样式是一门关键课题——它的基础知识可能容易学习，但掌握它却需要真正的技巧！在本章中，我们了解了嵌套和\
    \ extend 规则的使用，现在让我们花点时间回顾一下所学内容。\n\n我们首先探讨了如何嵌套代码——我们理解了这有助于避免重复，并减少需要编写的代码量。紧接着，我们审视了嵌套代码时可能遇到的一些陷阱；同时，我们讨论了嵌套是否是一种不良实践，或者只是在使用时需要一定程度的谨慎。\n\
    \n接着，我们转而讨论了父选择器的使用；我们考察了这对于嵌套伪元素等情况的重要性。然后，我们深入研究了 `@extend` 指令的基础知识——包括通过一个详细的示例来进行实践，然后根据\
    \ Sass 中二者的相似性，权衡使用 extends 或 mixins 的利弊。\n\n好了——让我们继续：我们经常需要编写仅在满足条件后才会确定结果的代码。这在编写脚本时是一种非常常见的技术，但如果我们要创建样式呢？普通的\
    \ CSS 不允许这样做，因此样式必须静态地编写。但这种情况已经改变：是时候扭转局面，开始使用脚本技术来控制我们的 CSS 样式了……\n\n# 使用运算计算值\n\
    \n使用 Sass 的关键优势之一是能够动态计算值——我指的不只是使用像百分比这样的值，而是使用加、减等运算符来计算值。\n\n是的，你没看错——使用数学运算！不过，在您退缩之前，这并没有看上去那么疯狂：我们可以在代码中编写诸如\
    \ `font: 10px/8px;` 这样的语句。由于 Sass 是 CSS 的扩展，它不仅支持这一点，而且将其提升到了一个全新的水平。不过，它的好处在于涉及的数学运算根本不必复杂——可以简单到将两个数字相加，或者对一个数字进行除法。\n\
    \n考虑到这一点，让我们来看看可以使用 Sass 执行的不同类型的运算，从一些基于数字的运算开始。\n\n## 基于数字的运算\n\n所有标准运算（如加法或除法）都受支持（包括关系运算符，如\
    \ `>=`）；这意味着我们可以编写如下声明：\n\n```scss\np {\n  $width: 780px;\n  width: $width/2;\n\
    }\n```\n\n……它将编译为：\n\n```scss\np { width: 390px; }\n```\n\n### 字符串内容的运算符\n\n在处理字符串时，运算符主要有两种用途：我们可以将文本拼接在一起，或者使用字符串插值执行内联计算。后者并不复杂——它要求我们将计算放在花括号内，并在前面加上一个\
    \ `#`，这告诉 Sass 计算总数，如以下示例所示：\n\n```scss\np:before {\n  content: \"我吃了 #{5 + 10}\
    \ 个大型\" + 苹果;\n}\n```\n\n### 基于布尔值的运算符\n\n有时，根据条件为真或假来包含声明可能会很有用；如果条件为真，则包含该声明，否则将省略它。我们的第三种运算类型允许使用布尔值来控制显示的内容：\n\
    \n```scss\np:before {\n  $count: 5;\n  $yes: 1;\n  @if ($count > 3 and $yes ==\
    \ 1) {\n    content: \"我吃了 #{5 + 10} 个大型\" + 苹果;\n  }\n}\n```\n\n编译后，我们得到以下结果：\n\
    \n```scss\np:before {\n  content: \"我吃了 15 个大型苹果\";\n}\n```\n"
- fmt: "# List-Based Operators\n\nThe final category covers all of the types of operations\
    \ we can perform on lists of data used in Sass. Lists are a useful way to group\
    \ together similar properties we might use later in our code, such as colors or\
    \ border types, so that we can control what is used in our code:\n\n```\n$colors:\
    \ red green blue;\n$padding: 10px, 20px, 30px;\n$border: solid, dotted;\n```\n\
    \nWith the list defined, we can use a function such as `nth` to choose an item\
    \ from that list, in this case `green`:\n\n```\ndiv {\n  background: nth($colours,\
    \ 2);\n  padding: nth($padding, 2); // \"20px\"\n  border: 2px nth($border, 2);\n\
    }\n```\n\nThis results in the following code, when compiled:\n\n```\ndiv {\n \
    \ background: green;\n  padding: 20px;\n  border: 2px dotted;\n}\n```\n\nList\
    \ items can be delineated using commas or spaces, but if you are using the latter,\
    \ then properties should be encased in quotes, and the `unquote()` function should\
    \ be used to remove them in code.\n\nWe’ve only touched the surface of the different\
    \ types of operations that are possible using Sass – the main website documents\
    \ all of the functions available, at [`http://sass-lang.com/documentation/Sass/Script/Functions.html`](http://sass-lang.com/documentation/Sass/Script/Functions.html).\n\
    \nOkay – let’s move on: the examples we’ve used are somewhat theoretical; to really\
    \ see how they work, we should create something that shows off how they work.\
    \ A great example is by creating a grid-based page template, so without further\
    \ ado, let’s dive in and see how this works in practice.\n\n## Putting This Into\
    \ Practice\n\nFor our next demo, we’re going to make use of Sass’s operations\
    \ to create a basic skeleton page, where values for widths such as the main content\
    \ block are worked out automatically for us. We’ll make use of one additional\
    \ resource in this demo, in the form of a script font – Homemade Apple, which\
    \ is available for download from [`https://www.fontsquirrel.com/fonts/homemade-apple`](https://www.fontsquirrel.com/fonts/homemade-apple)\
    \ in WOFF format (which should cover most recent browsers).\n\n## Creating a Framework\n\
    \nLet’s make a start on building our demo:\n\n![../images/472539_1_En_4_Chapter/472539_1_En_4_Fig1_HTML.jpg](images/472539_1_En_4_Chapter/472539_1_En_4_Fig1_HTML.jpg)\n\
    \n**Figure 4-1** Creating a skeleton page template\n\n1. We’ll begin by extracting\
    \ a copy of the `skeleton` folder from the code download that accompanies this\
    \ book – go ahead and save it to the root of our project folder.\n\n2. Our demo\
    \ contains all of the relevant markup already in place, but if we were to run\
    \ it now, it will look awful! It’s at this point we need to add styling – for\
    \ this, we have a fair few rules to add, so let’s make a start with some basic\
    \ styles for fonts and links used in the site:\n\n```\n@font-face { font-family:\
    \ 'pt_sansregular'; src: url('../font/pt_sansregular.woff') format('woff'); font-weight:\
    \ normal; font-style: normal; }\n@font-face { font-family: 'homemade_appleregular';\
    \ src: url('../font/HomemadeApple-webfont.woff') format('woff'); font-weight:\
    \ normal; font-style: normal; }\nbody { font-family: 'pt_sansregular', sans-serif;\
    \ margin: 32px; width: 900px; }\na {\n  text-decoration: none;\n  &:hover {\n\
    \    color: #6db046;\n  }\n}\n#container {\n  width: 100%;\n  border: 1px solid\
    \ black;\n  min-height: 100px;\n  background-color: #f5f5f5;\n  > p > i {\n  \
    \  padding-right: 3px;\n  }\n}\n```\n\n3. Next up comes the key to this demo –\
    \ we’re adding the styles for the main part of the page, header, footer, and sidebar:\n\
    \n```\narticle[role=\"main\"], header {\n  float: left;\n  width: 600px / 960px\
    \ * 100%;\n  margin: 15px 0px 15px 15px;\n  padding: 10px;\n}\narticle[role=\"\
    main\"] {\n  min-height: 500px;\n  background-color: #fff;\n  padding: 15px;\n\
    }\nheader {\n  height: 55px; padding: 10px 10px 0 0px; margin: 15px 0 0 15px;\n\
    \  h2 {\n    font-family: 'homemade_appleregular'; font-size: 30px;\n    margin-top:\
    \ 5px; color: #6db046;\n  }\n}\naside {\n  float: right;\n  width: 200px / 960px\
    \ * 100%;\n  margin: 100px 15px 15px 10px;\n  float: left;\n  padding: 10px;\n\
    \  min-height: 200px;\n  background-color: #fff;\n  ul {\n    padding-left: 25px;\n\
    \    h3 {\n      border-bottom: 1px solid green;\n      margin-left: -20px;\n\
    \    }\n  }\n}\nfooter { clear: both; background-color: #6db046; padding: 10px;\
    \ width: 880px; }\n```\n\n4. We now need to add in styling for some of the detail –\
    \ the next three rules cover the images shown at the foot of the page, the comments\
    \ tag, and date of posting, respectively:\n\n```\nsection { margin-left: auto;\
    \ margin-right: auto; width: 600px; }\n.details { font-size: 14px; clear: both;\
    \ padding-top: 5px; border-top: 1px solid #6db046; }\n.date {\n  width: 250px\
    \ / 960px * 100%;\n  font-size: 14px;\n  clear: both;\n  padding-top: 5px;\n \
    \ margin-left: 15px;\n  border-top: 1px solid #000;\n}\n```\n\n5. Within the `<section>`\
    \ block at the foot of our page, we’ve added in images – these need adjusting,\
    \ using the following styles:\n\n```\n.subimage { width: 275px / 960px * 100%;\
    \ border: 1px solid brown; height: 175px; clear: both; display: inline-block;\
    \ margin-right: 15px; }\nimg { width: 100%; height: auto; }\n```\n\n6. Last, but\
    \ by no means least, we’ll add in the final rule to take care of styling the labeling\
    \ for each of the images:\n\n```\n.tileText { width: 100%; height: 30px; padding:\
    \ 0px 5px 0px 5px; display: block; font-weight: bold; }\n```\n\n7. Save the file\
    \ as `skeleton.scss` in the `scss` folder.\n\n8. Next, fire up a terminal session\
    \ and change the working folder to the `skeleton` folder under our project area.\n\
    \n9. At the prompt, type the following command and press Enter:\n\n```\nsass sass\\\
    skeleton.scss css\\skeleton.css\n```\n\n10. If all is well, we should see a `skeleton.css`\
    \ file appear in the `css` folder, along with a source map – previewing the results\
    \ will show a simple template page with styled elements, as indicated in Figure\
    \ [4-1](#472539_1_En_4_Chapter.xhtml#Fig1).\n\nOur demo shows how easy it is to\
    \ create templates when using Sass – indeed, the basic principles we’ve used here\
    \ can easily form the basis of many of the grid systems available for use today.\
    \ However, there are a couple of key points to note; before we cover them, let’s\
    \ take a look at the code we’ve created in more detail."
  raw: "### List-Based Operators\n\nThe final category covers all of the types of\
    \ operations we can perform on lists of data used in Sass. Lists are a useful\
    \ way to group together similar properties we might use later in our code, such\
    \ as colors or border types, so that we can control what is used in our code:\n\
    \n```\n$colors: red green blue;\n$padding: 10px, 20px, 30px;\n$border: solid,\
    \ dotted;\n```\n\nWith the list defined, we can use a function such as `nth` to\
    \ choose an item from that list, in this case `green`:\n\n```\ndiv {\nbackground:\
    \ nth($colours, 2);\npadding: nth($padding, 2); // \"20px\"\nborder: 2px nth($border,\
    \ 2));\n}\n```\n\nThis results in the following code, when compiled:\n\n```\n\
    div {\nbackground: green;\npadding: 20px;\nborder: 2px dotted;\n}\n```\n\nList\
    \ items can be delineated using commas or spaces, but if you are using the latter,\
    \ then properties should be encased in quotes, and the `unquote()` function should\
    \ be used to remove them in code.\n\nWe’ve only touched the surface of the different\
    \ types of operations that are p[possible using Sass – the main website documents\
    \ all of the functions available, at [`http://sass-lang.com/documentation/Sass/Script/Functions.html`](http://sass-lang.com/documentation/Sass/Script/Functions.html)\
    \ .\n\nOkay – let’s move on: the examples we’ve used are somewhat theoretical;\
    \ to really see how they work, we should create something that shows off how they\
    \ work. A great example is by creating a grid-based page template, so without\
    \ further ado, let’s dive in and see how this works in practice.\n\n### Putting\
    \ This Into Practice\n\nFor our next demo, we’re going to make use of Sass’s operations\
    \ to create a basic skeleton page, where values for widths such as the main content\
    \ block are worked out automatically for us. We’ll make use of one additional\
    \ resource in this demo, in the form of a script font – Homemade Apple, which\
    \ is available for download from [`https://www.fontsquirrel.com/fonts/homemade-apple`](https://www.fontsquirrel.com/fonts/homemade-apple)\
    \ in WOFF format (which should cover most recent browsers).\n\n### Creating a\
    \ Framework\n\nLet’s make a start on building our demo:\n\n![../images/472539_1_En_4_Chapter/472539_1_En_4_Fig1_HTML.jpg](images/472539_1_En_4_Chapter/472539_1_En_4_Fig1_HTML.jpg)\n\
    \nFigure 4-1\n\nCreating a skeleton page template\n\n1.  We’ll begin by extracting\
    \ a copy of the `skeleton` folder from the code download that accompanies this\
    \ book – go ahead and save it to the root of our project folder.\n\n2.  Our demo\
    \ contains all of the relevant markup already in place, but if we were to run\
    \ it now, it will look awful! It’s at this point we need to add styling – for\
    \ this, we have a fair few rules to add, so let’s make a start with some basic\
    \ styles for fonts and links used in the site:\n\n```\n    @font-face { font-family:\
    \ 'pt_sansregular'; src: url('../font/pt_sansregular.woff') format('woff'); font-weight:\
    \ normal; font-style: normal; }\n    @font-face { font-family: 'homemade_appleregular';\
    \ src: url('../font/HomemadeApple-webfont.woff') format('woff'); font-weight:\
    \ normal; font-style: normal; }\n    body { font-family: 'pt_sansregular', sans-serif;\
    \ margin: 32px;\n    width: 900px; }\n    a {\n    text-decoration: none;\n  \
    \  &:hover {\n    color: #6db046;\n    }\n    }\n    #container {\n    width:\
    \ 100%;\n    border: 1px solid black;\n    min-height: 100px;\n    background-color:\
    \ #f5f5f5;\n    > p > i {\n    padding-right: 3px;\n    }\n    }\n    ```\n\n\
    3.  Next up comes the key to this demo – we’re adding the styles for the main\
    \ part of the page, header, footer, and sidebar:\n\n```\n    article[role=\"main\"\
    ], header {\n    float: left;\n    width: 600px / 960px * 100%;\n    margin: 15px\
    \ 0px 15px 15px;\n    padding: 10px;\n    }\n    article[role=\"main\"] {\n  \
    \  min-height: 500px;\n    background-color: #fff;\n    padding: 15px;\n    }\n\
    \    header {\n    height: 55px; padding: 10px 10px 0 0px; margin: 15px 0 0 15px;\n\
    \    h2{\n    font-family: 'homemade_appleregular'; font-size: 30px;\n    margin-top:\
    \ 5px; color: #6db046;\n    }\n    }\n    aside {\n    float: right;\n    width:\
    \ 200px / 960px * 100%;\n    margin: 100px 15px 15px 10px;\n    float: left;\n\
    \    padding: 10px;\n    min-height: 200px;\n    background-color: #fff;\n   \
    \ ul {\n    padding-left: 25px;\n    h3 {\n    border-bottom: 1px solid green;\n\
    \    margin-left: -20px;\n    }\n    }\n    }\n    footer { clear: both; background-color:\
    \ #6db046; padding: 10px; width: 880px; }\n    ```\n\n4.  We now need to add in\
    \ styling for some of the detail – the next three rules cover the images shown\
    \ at the foot of the page, the comments tag, and date of posting, respectively:\n\
    \n```\n    section { margin-left: auto; margin-right: auto;\n    width: 600px;\
    \ }\n    .details { font-size: 14px; clear: both; padding-top: 5px;\n    border-top:\
    \ 1px solid #6db046; }\n    .date {\n    width: 250px / 960px * 100%;\n    font-size:\
    \ 14px;\n    clear: both;\n    padding-top: 5px;\n    margin-left: 15px;\n   \
    \ border-top: 1px solid #000;\n    }\n    ```\n\n5.  Within the `<section>` block\
    \ at the foot of our page, we’ve added in images – these need adjusting, using\
    \ the following styles:\n\n```\n    .subimage { width: 275px / 960px * 100%; border:\
    \ 1px solid brown; height: 175px; clear: both; display: inline-block;   margin-right:\
    \ 15px; }\n    img { width: 100%; height: auto; }\n    ```\n\n6.  Last, but by\
    \ no means least, we’ll add in the final rule to take care of styling the labeling\
    \ for each of the images:\n\n```\n    .tileText { width: 100%; height: 30px; padding:\
    \ 0px 5px 0px 5px; display: block; font-weight: bold; }\n    ```\n\n7.  Save the\
    \ file as `skeleton.scss` in the `scss` folder.\n\n8.  Next, fire up a terminal\
    \ session and change the working folder to the `skeleton` folder under our project\
    \ area.\n\n9.  At the prompt, type the following command and press Enter:\n\n\
    ```\n    sass sass\\skeleton.scss css\\skeleton.css\n    ```\n\n10.  If all is\
    \ well, we should see a `skeleton.css` file appear in the `css` folder, along\
    \ with a source map – previewing the results will show a simple template page\
    \ with styled elements, as indicated in Figure [4-1](#472539_1_En_4_Chapter.xhtml#Fig1).\n\
    \nOur demo shows how easy it is to create templates when using Sass – indeed,\
    \ the basic principles we’ve used here can easily form the basis of many of the\
    \ grid systems available for use today. However, there are a couple of key points\
    \ to note; before we cover them, let’s take a look at the code we’ve created in\
    \ more detail."
  trans: "\n# 基于列表的运算符\n\n最后一类涵盖了我们可以对 Sass 中使用的数据列表执行的所有操作类型。列表是将我们可能在代码中稍后使用的相似属性（如颜色或边框类型）组合在一起的有效方法，以便我们可以控制代码中使用的内容：\n\
    \n```\n$colors: red green blue;\n$padding: 10px, 20px, 30px;\n$border: solid,\
    \ dotted;\n```\n\n定义列表后，我们可以使用 `nth` 等函数从该列表中选择一个项目，在本例中选择 `green`：\n\n```\ndiv\
    \ {\n  background: nth($colours, 2);\n  padding: nth($padding, 2); // \"20px\"\
    \n  border: 2px nth($border, 2);\n}\n```\n\n编译后，这段代码会产生以下结果：\n\n```\ndiv {\n \
    \ background: green;\n  padding: 20px;\n  border: 2px dotted;\n}\n```\n\n列表项可以使用逗号或空格分隔，但如果您使用后者，则属性应用引号括起来，并在代码中使用\
    \ `unquote()` 函数来移除引号。\n\n我们只是浅尝辄止地了解了使用 Sass 可以进行的各种不同类型的操作——主要网站记录了所有可用的函数，网址为\
    \ [`http://sass-lang.com/documentation/Sass/Script/Functions.html`](http://sass-lang.com/documentation/Sass/Script/Functions.html)。\n\
    \n好了——我们继续：我们使用的示例有些理论化；要真正了解它们的工作原理，我们应该创建一些能展示其工作方式的东西。一个很好的例子是创建一个基于网格的页面模板，所以事不宜迟，让我们深入探究并看看它如何在实践中运作。\n\
    \n## 付诸实践\n\n在下一个演示中，我们将利用 Sass 的操作来创建一个基本的页面骨架，其中主内容块等元素的宽度值将自动为我们计算出来。在这个演示中，我们将额外使用一种资源，即一种手写字体——Homemade\
    \ Apple，它可以从 [`https://www.fontsquirrel.com/fonts/homemade-apple`](https://www.fontsquirrel.com/fonts/homemade-apple)\
    \ 以 WOFF 格式下载（该格式应覆盖大多数现代浏览器）。\n\n## 创建框架\n\n让我们开始构建我们的演示：\n\n![../images/472539_1_En_4_Chapter/472539_1_En_4_Fig1_HTML.jpg](img/472539_1_En_4_Fig1_HTML.jpg)\n\
    \n**图 4-1** 创建页面骨架模板\n\n1. 首先，从本书附带的代码下载中提取 `skeleton` 文件夹的副本——继续并将其保存到我们项目文件夹的根目录。\n\
    \n2. 我们的演示包含所有相关标记，但如果现在运行它，看起来会很糟糕！此时我们需要添加样式——为此，我们有相当多的规则要添加，让我们从站点中使用的字体和链接的一些基本样式开始：\n\
    \n```\n@font-face { font-family: 'pt_sansregular'; src: url('../font/pt_sansregular.woff')\
    \ format('woff'); font-weight: normal; font-style: normal; }\n@font-face { font-family:\
    \ 'homemade_appleregular'; src: url('../font/HomemadeApple-webfont.woff') format('woff');\
    \ font-weight: normal; font-style: normal; }\nbody { font-family: 'pt_sansregular',\
    \ sans-serif; margin: 32px; width: 900px; }\na {\n  text-decoration: none;\n \
    \ &:hover {\n    color: #6db046;\n  }\n}\n#container {\n  width: 100%;\n  border:\
    \ 1px solid black;\n  min-height: 100px;\n  background-color: #f5f5f5;\n  > p\
    \ > i {\n    padding-right: 3px;\n  }\n}\n```\n\n3. 接下来是这个演示的关键——我们添加页面主体部分、页眉、页脚和侧边栏的样式：\n\
    \n```\narticle[role=\"main\"], header {\n  float: left;\n  width: 600px / 960px\
    \ * 100%;\n  margin: 15px 0px 15px 15px;\n  padding: 10px;\n}\narticle[role=\"\
    main\"] {\n  min-height: 500px;\n  background-color: #fff;\n  padding: 15px;\n\
    }\nheader {\n  height: 55px; padding: 10px 10px 0 0px; margin: 15px 0 0 15px;\n\
    \  h2 {\n    font-family: 'homemade_appleregular'; font-size: 30px;\n    margin-top:\
    \ 5px; color: #6db046;\n  }\n}\naside {\n  float: right;\n  width: 200px / 960px\
    \ * 100%;\n  margin: 100px 15px 15px 10px;\n  float: left;\n  padding: 10px;\n\
    \  min-height: 200px;\n  background-color: #fff;\n  ul {\n    padding-left: 25px;\n\
    \    h3 {\n      border-bottom: 1px solid green;\n      margin-left: -20px;\n\
    \    }\n  }\n}\nfooter { clear: both; background-color: #6db046; padding: 10px;\
    \ width: 880px; }\n```\n\n4. 我们现在需要添加一些细节的样式——接下来的三条规则分别涵盖了页面底部显示的图像、评论标签和发布日期：\n\
    \n```\nsection { margin-left: auto; margin-right: auto; width: 600px; }\n.details\
    \ { font-size: 14px; clear: both; padding-top: 5px; border-top: 1px solid #6db046;\
    \ }\n.date {\n  width: 250px / 960px * 100%;\n  font-size: 14px;\n  clear: both;\n\
    \  padding-top: 5px;\n  margin-left: 15px;\n  border-top: 1px solid #000;\n}\n\
    ```\n\n5. 在页面底部的 `<section>` 块中，我们添加了图像——这些图像需要使用以下样式进行调整：\n\n```\n.subimage {\
    \ width: 275px / 960px * 100%; border: 1px solid brown; height: 175px; clear:\
    \ both; display: inline-block; margin-right: 15px; }\nimg { width: 100%; height:\
    \ auto; }\n```\n\n6. 最后但同样重要的是，我们将添加最后一条规则来处理每个图像标签的样式：\n\n```\n.tileText { width:\
    \ 100%; height: 30px; padding: 0px 5px 0px 5px; display: block; font-weight: bold;\
    \ }\n```\n\n7. 将文件保存为 `scss` 文件夹中的 `skeleton.scss`。\n\n8. 接下来，启动一个终端会话，并将工作文件夹更改为我们项目区域下的\
    \ `skeleton` 文件夹。\n\n9. 在提示符下，键入以下命令并按回车：\n\n```\nsass sass\\skeleton.scss css\\\
    skeleton.css\n```\n\n10. 如果一切顺利，我们应该会看到 `css` 文件夹中出现一个 `skeleton.css` 文件，以及一个源代码映射——预览结果将显示一个包含样式化元素的简单模板页面，如图\
    \ 4-1 所示。\n\n我们的演示展示了使用 Sass 创建模板是多么容易——事实上，我们在此使用的基本原则可以轻松地构成当今许多可用网格系统的基础。然而，有几个关键点需要注意；在介绍它们之前，让我们更详细地看看我们创建的代码。\n"
- fmt: '### Understanding What Happened


    Although the code we’ve used looks lengthy, in reality much of it is used to style
    existing elements such as font sizes or colors. We have, however, used standard
    Sass nesting to lay out each rule within our style sheet – Sass will recompile
    each into valid CSS during compilation.


    The key parts of interest to us though, lie on or around lines 40, 65, 101, and
    110, where we have code similar to this:


    ```

    width: 200px / 960px * 100%;

    ```


    Sass automatically calculates this equation during compilation; if we were to
    take the rule we created for `article[role="main"]` and `header` (which specifies
    `width: 600px / 960px * 100%`), and pasted it into Sassmeister, it would give
    us this compiled code (Figure [4-2](#472539_1_En_4_Chapter.xhtml#Fig2)).


    ![../images/472539_1_En_4_Chapter/472539_1_En_4_Fig2_HTML.jpg](images/472539_1_En_4_Chapter/472539_1_En_4_Fig2_HTML.jpg)


    Figure 4-2


    Viewing the results of a calculation


    Although it’s not 100% obvious, the calculation used is based on the principle
    of the Golden Ratio. This ratio has helped quantify what makes certain designs
    more pleasing than others – it’s all about ensuring that proportions of larger
    elements are twice that of smaller ones. In our case though, the numbers are not
    quite there – `62.5%` of `960px` (our base measurement) equates to `600px`, whereas
    if we follow the ratio exactly, it should be nearer `594px`. Hey – what’s 6px
    in a demo design?


    If you would like to learn more about this principle, then Google has plenty of
    references to articles online, such as [`https://www.interaction-design.org/literature/article/the-golden-ratio-principles-of-form-and-layout`](https://www.interaction-design.org/literature/article/the-golden-ratio-principles-of-form-and-layout).


    Performing simple math in Sass is just the tip of the iceberg, with regard to
    what is possible: there is a host of other functions we can use! They range from
    manipulating strings, to numbers, and even changing colors – we can work out the
    lengths of strings, cut them into smaller chunks, or even create a palette of
    new colors from existing values. This is one area that is well worth becoming
    familiar with, so let’s dive in and take a look at some examples in more detail.


    ## Defining Functions


    If you spend any time writing styles for websites, then I am sure you’ll appreciate
    the need to specify absolute values for properties, such as `background-color()`
    or `font-size()`. It’s a real drag, but what if I said you may not have to …?


    Yes – that’s right: once you start using Sass, there will be occasions where you
    don’t have to work out values manually: you can get Sass to do the heavy lifting
    for you. Sass borrows many of its function principles from scripting languages
    such as JavaScript – indeed, many will say that this is one area where the lines
    between JavaScript and CSS really begins to blur!


    That aside, functions within Sass can be split into several categories, which
    are summarized in Table [4-1](#472539_1_En_4_Chapter.xhtml#Tab1).


    Table 4-1


    Function Types Available in Sass


    | Group | Description (with examples) |

    | --- | --- |

    | Colors (including opacity) | This splits into three categories – RGB, HSL, and
    opacity; this grouping covers functions such as `saturation()` or `hsl()`, which
    are designed to get or manipulate colors. |

    | Strings | This group of functions allows us to manipulate strings using Sass
    – performing tasks such as changing text case, inserting characters into strings,
    and getting the length of a string. |

    | Numbers | We’ve already seen how you can use basic operators in Sass, such as
    addition – this group takes it up a level with functions such as `round()`, `abs()`,
    and `random()`. |

    | Lists | This group of functions allows us to manipulate Sass lists, such operations
    as `length()` or `nth()` to get a specific item from a list.**Note:** lists are
    immutable in Sass, so will return a new list, rather than update an existing one
    in place. |

    | Maps | Maps are a relatively new feature in Sass – they allow us to create a
    configuration area, rather than have to create multiple single variables. This
    group of functions allows us to get and manipulate content within maps, using
    functions such as `map-get()` or `map-values()`. |

    | Selectors | If we need to perform tasks such as joining selectors, or replacing
    one with another within our Sass code – this group of functions allows us to do
    this, using commands such as `selector-append()` or `selector-unify()`. |

    | Introspection | This group of functions helps determine if certain functions,
    variables, or mixins exist in the current scope within our code, or can return
    the type associated with a value. |

    | Miscellaneous | This contains two functions that don’t sit within any of the
    other groups – `if()` and `unique-id()`. Note: the `if()` function is a *ternary
    operator* in this context, and not a conditional function as we will see later
    in this chapter. |


    The full list of functions is available on the main Sass website at [`http://sass-lang.com/documentation/Sass/Script/Functions.html`](http://sass-lang.com/documentation/Sass/Script/Functions.html).


    To fully understand how these functions work, would be outside of the scope of
    this book – indeed, we could probably write a tome just on the subject in its
    own right!


    This said, it’s worth spending time on exploring at least part of what is available
    within the world of Sass functions. Over the course of the next few pages, we’re
    going to dive into manipulating Sass colors as a mini case study; it goes without
    saying that color is so important, and this is one area where Sass can really
    help with producing code in our development process.


    ### Working with Colors – a Mini Case Study


    A site without color would be like life without excitement – very boring! Indeed,
    not only does color add that extra sparkle to a site, it can also help convey
    a message: for example, red in China conveys a sense of happiness.


    In the past, we might have specified an array of colors in our palette – not only
    is this time consuming to get right, it is also a real pain to keep updated, particularly
    if clients change their mind at the last minute!


    To help with this, Sass contains a host of different functions that allow us to
    manipulate colors in a manner of different ways. For example, we can adjust the
    saturation levels, change the brightness, or alter the hue of a color – the list
    is endless. To see how this might look in action, take a look at [`http://jackiebalzer.com/color`](http://jackiebalzer.com/color):
    this only specifies two colors but contains over 30 different shades, created
    using Sass functions. This is just one example: a quick look online shows other
    similar examples, such as these:


    *   [`http://scg.ar-ch.org/`](http://scg.ar-ch.org/) – enter a color to get the
    hex codes for various shades, such as lighten or desaturate;

    *   [`http://jim-nielsen.com/sassme/`](http://jim-nielsen.com/sassme/) – use the
    sliders to generate a new color, and grab the code for use in a style sheet;

    *   [`https://codepen.io/KatieK2/pen/hbqsB`](https://codepen.io/KatieK2/pen/hbqsB)
    – more experiments using color functions;

    *   [`https://css-tricks.com/snippets/sass/tint-shade-functions/`](https://css-tricks.com/snippets/sass/tint-shade-functions/)
    – two custom functions created by Hugo Giraudel, to get a slightly lighter or
    darker shade of a color.


    Let’s put one of these functions to use, and adjust the color used to fill in
    an SVG image – the base color is a shade of light gray; we’ll make it even lighter
    using the `lighten()` function.'
