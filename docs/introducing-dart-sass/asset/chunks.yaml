- fmt: "The key to ultimate success, though, will be how your partials are structured\
    \ – your aim is to separate code into separate files, such that you keep the need\
    \ for importing files multiple times to a minimum. To give you a flavor of how\
    \ one might structure folders, you can check out the example given by Danny Huang\
    \ – for smaller projects, he uses a base file (for most of his code, including\
    \ resets), a components file (for reusable code such as buttons), and a layout\
    \ file to handle the overall layout of content. These are all combined into his\
    \ main file during compilation.\n\nYou can read Danny’s article on structuring\
    \ Sass code at [`https://medium.com/@dannyhuang_75970/sass-project-structure-for-big-projects-8c4a740846ee`](https://medium.com/@dannyhuang_75970/sass-project-structure-for-big-projects-8c4a740846ee).\n\
    \nFor larger projects, though, this might not be enough – instead, we can use\
    \ something akin to his model for larger projects:\n\n- `base/` - for animations,\
    \ typography, and utilities\n- `components/` - stored as single Sass files for\
    \ each component\n- `layout/` - used for storing header, grid, footer, and navigation\
    \ styles\n- `pages/` - depending on structure, we might have a single Sass file\
    \ for each page\n- `abstracts/` - for functions, mixins, and variables\n- `vendors/`\
    \ - third-party CSS\n- `main.scss`\n\nIt’s all about planning – the more you can\
    \ do now, the easier it will be later! Bear in mind, though: a structure doesn’t\
    \ have to be rigid – we can absolutely develop something to suit projects and\
    \ modify it if circumstances change.\n\nOkay – let’s return to that checklist:\n\
    \n- Assuming you’ve seen instances of repetition – how much is common between\
    \ multiple styles? In an ideal world, you’re looking for instances where 3–4 declarations\
    \ are the same (or very close): these could be turned into mixins and these called\
    \ from within the relevant rules.\n- Check items such as buttons, where styles\
    \ are likely to consist of some common base rules, with only minimal differences\
    \ such as colors. If this is the case, then consider using the `extend` function,\
    \ to reduce duplication of content.\n- If you read through your code, do you see\
    \ instances where you have CSS rules that go several levels deep? A typical example\
    \ might be within navigation, where you use multiple `<li>` elements to style\
    \ each part of an unordered list. Consider converting these to nested styles –\
    \ it will make it easier to read your content and help cut down on duplication\
    \ of code.\n- A longer-term change you can make is to consider making use of prebuilt\
    \ libraries where others have already developed code such as mixins or color variables\
    \ that you can reuse in your code.\n- Images – can any be converted to sprites,\
    \ if you aren’t already using them? Sass makes using sprites very easy – it won’t\
    \ suit some of the larger images, but it will be perfect for smaller ones. Alternatively,\
    \ consider using SVG images for icons – as these are made up of HTML and CSS,\
    \ they can be styled using Sass with ease, and (depending on how you call them),\
    \ can also reduce the number of requests we make of our server!\n\nSee how easy\
    \ it is to start using Sass, with just a few changes? Granted, there will be other\
    \ changes we can make over time, but these will give you a good head start when\
    \ making the initial change to using Sass as a development tool.\n\nTalking of\
    \ making changes – we can do these manually (as it gives us a great feel for where\
    \ we can make them), or we can make use of some conversion tools to do some of\
    \ the heavy lifting for us. Although these tools may not give us the finished\
    \ article, they will at least give us a good head start – over the next few pages,\
    \ we’ll take a look at one of these tools in more detail, to see just how they\
    \ work in action.\n\n## Making a Start on Conversion\n\nOkay – so we’ve talked\
    \ about how we might approach the conversion process: it’s time for action!\n\n\
    When converting Sass, one should always consider it to be an iterative process\
    \ that evolves over time; the likelihood of us having a really simple style sheet\
    \ is probably next to zero. We can, of course, try to convert it manually, but\
    \ this will be a time-consuming process.\n\nInstead, why not put it through one\
    \ of several tools already available for download, which can do some of the heavy\
    \ lifting for us? There are a couple of examples available, including `css2scss`\
    \ ( [`https://www.css2scss.com/`](https://www.css2scss.com/) ), or the `css2sass`\
    \ app available at [`http://css2sass.herokuapp.com/`](http://css2sass.herokuapp.com/)\
    \ .\n\nA personal favorite, though, is the `Styleflux` tool, which you can install\
    \ using `Node.js` from [`https://www.npmjs.com/package/styleflux`](https://www.npmjs.com/package/styleflux)\
    \ . Granted, it might not produce perfect results, but as the only cost to using\
    \ it is a the initial set-up (which only has to be done once), why not give it\
    \ a try? The worst that can happen is that it falls into a complete heap and produces\
    \ garbage; in many cases, you will get something respectable, which may only need\
    \ a little tweaking and tidying up. Let’s put this theory to the test, and see\
    \ how it works, as part of our next demo.\n\n### Convert To Sass Using Styleflux\n\
    \nFor this exercise, we’ll assume you have `Node.js` installed from Chapter [1](#472539_1_En_1_Chapter.xhtml)\
    \ – if you don’t, then I would recommend revisiting that chapter for a reminder!\n\
    \nAssuming we have `Node.js` installed, then we need to follow these steps:\n\n\
    1.  We’ll start by creating a new folder in our project area – call it `css2scss`.\n\
    2.  Next, fire up a `Node.js` terminal session (not a standard one!), and navigate\
    \ to our project area.\n3.  We now need to create a `package.json` file, which\
    \ `Node.js` uses to tell it which packages to use – for this, enter the following\
    \ at a prompt, and press Enter:\n\n    ```\n    npm init –y\n    ```\n\n4.  When\
    \ it confirms a `package.json` file has been created, then enter this at the prompt\
    \ and press Enter:\n\n    ```\n    npm install styleflux –save\n    ```\n\n  \
    \  If you get Node complaining of a `package-lock.json` file being created, then\
    \ you can stop this from happening – copy the `.npmrc` and `.gitignore` files\
    \ from the code download to the root of the `css2scss` folder.\n\n5.  Next, we\
    \ need to create our conversion script – for this, go ahead and add the following\
    \ code to a new file, saving it as `styleflux.js` in our project area:\n\n   \
    \ ```\n    const cssConverter = require('styleflux');\n    cssConverter.processCSSFile(\"\
    test.css\");\n    ```\n\n6.  We can now test our file conversion – for this, switch\
    \ back to the terminal session, then make sure the working folder is the `css2scss`\
    \ folder.\n7.  At the prompt, enter this command, and press Enter:\n\n    ```\n\
    \    node styleflux.js\n    ```\n\n8.  If all is well, we should see the name\
    \ of a new file being created with our Sass code, as indicated in Figure [5-1](#472539_1_En_5_Chapter.xhtml#Fig1).\n\
    \n    ![../images/472539_1_En_5_Chapter/472539_1_En_5_Fig1_HTML.jpg](images/472539_1_En_5_Chapter/472539_1_En_5_Fig1_HTML.jpg)\n\
    \n    Figure 5-1\n\n    Successful conversion of a CSS file\n\n    As an aside\
    \ – if you want to try different style sheets, please change the name highlighted\
    \ in step 5, before running saving the file and running it from step 6 onward.\n\
    \nAt this point, I’ll bet you’ll be asking either one of two questions – how effective\
    \ is this tool with larger files? And why didn’t we simply use it first ...? These\
    \ are equally pertinent questions: the answer to the first might surprise you,\
    \ and there is a good reason for not simply using the tool outright. Intrigued?\
    \ Let’s dive in and take a look at why. ..."
