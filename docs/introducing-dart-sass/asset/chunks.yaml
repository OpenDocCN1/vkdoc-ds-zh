  trans: "\n# 处理更复杂的示例\n\n上一个示例中的代码位于第一层级（或缩进）—— 在许多情况下，这对于你的项目可能适用，但如果我们需要深入一层（因为我们有更多子类需要处理）该怎么办呢？\n\
    \n我们可以使用 Sass 进行更深层次的嵌套，不过有一点需要提醒——一个好的经验法则是嵌套层级不要超过两到三层。更深层的嵌套在技术上是可行的，但我不推荐这样做——这样会导致\
    \ CSS 的特指度（specificity）过深，这也是一个明显的信号，说明我们需要重新审视样式类名的结构。\n\n假设我们将嵌套控制在合理层级内，以下是一个嵌套到三层代码块的示例：\n\
    \n```\n.sidebar {\n  position: fixed;\n  height: 100%;\n  &-list {\n    background-color:\
    \ white;\n    &-link {\n      text-decoration: none;\n    }\n  }\n}\n```\n\n在这个例子中，公共元素是\
    \ `.sidebar`；所有三个样式都使用了这个名称。不过，我注意到其中两个名称的开头有一个 & 符号和连字符——这代表什么呢？这些是占位符——在这种情况下，第二层和第三层的类名将分别被编译为\
    \ `.sidebar-list` 和 `.sidebar-list-link`。\n\n关于这种上下文中的占位符，我们将在本章稍后的“引用父选择器”部分进行更详细的介绍。\n\
    \n好了——借用一句常见的开车用语，是时候变道了：嵌套是一项值得学习的好技术，但它并非没有一些古怪之处。让我们看几个例子来理解我的意思——现在，你在刚开始使用\
    \ Sass 时可能还不会遇到它们，但迟早它们会露出它们丑陋的一面，可以这么说……\n\n# 探索嵌套的陷阱\n\n再看一下上一节中的代码示例——我们在上一节中提到，它会创建三条规则，而图\
    \ 3-2 确实证实了这一点。\n\n![../images/472539_1_En_3_Chapter/472539_1_En_3_Fig2_HTML.jpg](img/472539_1_En_3_Fig2_HTML.jpg)\n\
    \n图 3-2\n\n我们的编译示例，使用 Sassmeister\n\n我们的代码已编译为有效的 CSS，从嵌套三层深的代码中产出了三条规则示例。这效果很好，但可能会让我们产生一种错误的安全感！如果我们不小心，使用嵌套既有优点也有缺点，所以让我们先看看缺点，因为这些最容易解释。\n\
    \n## 嵌套是坏事吗？\n\n假设我们使用以下代码：\n\n```\n\nSome text\n\n```\n\n这会生成特指度极高的 CSS 代码——要引用此代码块中的\
    \ `a` 标签，我们必须使用 `main.one.two.a` 作为 CSS 规则：\n\n```\nmain {\n  .one {\n    .two\
    \ {\n      a {color: red}\n    }\n  }\n}\n```\n\n这种级别的特指度不推荐使用，应该避免，因为它会使我们的 CSS\
    \ 与 HTML 结构紧密耦合。要覆盖这段代码，我们就得创建更特指的 CSS 来修改它；这只会让原始问题雪上加霜！更麻烦的是，如果你使用 Sass 嵌套了这段代码，它看起来就像是你仅仅给一个简单的链接设置了样式。而现实是，Sass\
    \ 只是隐藏了问题，在编译期间仍然会生成同样特指度极高的代码。\n\n归根结底，如果谨慎使用，嵌套是一项很棒的功能——作为一个通用经验法则，我建议嵌套层数不要超过三层。这样能保持代码简单易读，并且不会生成特指度极高的代码，从而避免在后续开发中造成问题。\n\
    \n## 探索嵌套的优势\n\n哎——经过刚才的警告，有人可能会认为嵌套没那么好，这也是情有可原的！但事实是，就像任何被负责任地使用的工具一样，它也能对你的代码产生非常积极的影响。\n\
    \n在这种情况，使用嵌套的主要优势在于生成更易读、更易维护的代码。嵌套允许我们将所有继承自父选择器的子选择器分组在一起；同时还能节省打字量，因为我们不必在每个子选择器前重复编写父选择器。当然，诀窍在于确保我们不会嵌套得太深——极端嵌套可能很诱人，但请记住：嵌套并不能修复糟糕的代码——如果你输入的是垃圾，那么你只会得到垃圾输出！\n\
    \n好了——让我们快速推进：如果使用 Sass 嵌套代码，你可能会认为这同样适用于伪选择器，比如 `:hover` 和 `:focus`，对吗？不幸的是，不行——如果你尝试以这种方式嵌套它们，将会抛出错误。幸运的是，有一个解决方案——我们需要调整在代码嵌套时引用它们的方式。让我们更详细地了解一下具体内容。\n\
    \n# 引用父选择器\n\n在嵌套 Sass 语句时，很多语句可以放在代码中已有重复项的位置。但是，你无疑会在代码中使用某种伪选择器——那么这些伪选择器怎么办呢？\n\
    \n好吧，Sass 也可以嵌套它们——我们不是像普通语句那样简单地缩进它们，而是需要在冒号前立即放置一个占位符字符。以图 3-3 中显示的代码片段为例。\n\
    \n![../images/472539_1_En_3_Chapter/472539_1_En_3_Fig3_HTML.jpg](img/472539_1_En_3_Fig3_HTML.jpg)\n\
    \n图 3-3\n\n更新前的代码……\n\n这里完整写出了三种样式（`a`、`a:hover` 和 `a:focus`）——这是完全有效的代码，但有点浪费空间，并且重复了选择器名称。相反，我们可以简单地嵌套每个样式——为了向你展示其工作原理，我们可以通过一个快速演示来更新上一个菜单练习中的代码。\n"
- fmt: "### Referencing Parent Selectors\n\nLet’s see how easy it is to make the change\
    \ to our code:\n\n![../images/472539_1_En_3_Chapter/472539_1_En_3_Fig4_HTML.jpg](images/472539_1_En_3_Chapter/472539_1_En_3_Fig4_HTML.jpg)\n\
    \nFigure 3-4 – Updating our navigation demo\n\n1.  First, download and extract\
    \ a copy of the `parent` folder from the code download for this book – save this\
    \ to our project folder.\n\n2.  Next, open up the `parent.scss` file, and look\
    \ for these lines, on or around line 29:\n\n    ```\n    a {\n    background-color:\
    \ #faebd7;\n    border: 1px solid #ccc;\n    color: #666;\n    ```\n\n3.  Go ahead\
    \ and edit the `a` rule – we’re nesting the `hover` and `focus` declarations within\
    \ it, as indicated in bold:\n\n    ```\n    a {\n    background-color: #faebd7;\n\
    \    border: 1px solid #ccc;\n    color: #666;\n    display: block;\n    padding:\
    \ 6px 12px;\n    text-decoration: none;\n    font-size: 32px;\n    &:hover, &:focus\
    \ {\n    background-color: darken(#faebd7, 20%);\n    }\n    &:active{ background-color:\
    \ #666; border-color: #666; color: #efefef;   }\n    }\n    ```\n\n4.  Next, go\
    \ ahead and delete the stand-alone `active`, `hover`, and `focus` rules – we should\
    \ be left with the ones nested inside the parent `a` rule, and that the last line\
    \ of code will be a closing bracket from the nav rule.\n\n5.  Save the file as\
    \ `parent.scss` in the `scss` folder.\n\n6.  Next, fire up a terminal session\
    \ and change the working folder to the `parent` folder under our project area.\n\
    \n7.  At the prompt, type the following command and press Enter:\n\n    ```\n\
    \    sass sass\\parent.scss css\\parent.css\n    ```\n\n8.  If all is well, we\
    \ should see a `parent.css` file appear in the `css` folder, along with a source\
    \ map.\n\n9.  Try previewing the results in a browser – if all is well, it will\
    \ show a simple box with styled elements, as indicated in Figure 3-4.\n\nWhen\
    \ nesting, this is an important concept to understand – not getting it right,\
    \ or missing ampersands may at best produce code that is broken (but unlikely\
    \ to show any errors), or at worst, fail to compile.\n\nThe key thing to remember\
    \ is to include the placeholder – we may not get the right level of nesting immediately,\
    \ but with the placeholder, the code should at least compile correctly! In the\
    \ meantime, let’s take a quick look at our code in more detail – you will see\
    \ it uses the same principles as before, with just the addition of the ampersand\
    \ as a placeholder.\n\n### Exploring Our Code in Detail\n\nIf we had run a completed\
    \ version of this demo, without having seen the changes we’ve made, then you might\
    \ be forgiven for thinking that it looks no different to the original version\
    \ of this demo! Don’t worry – this is intentional: it shows that although changes\
    \ have been made to nest some of the classes we’ve used, the test shows that our\
    \ demo still runs correctly.\n\nSo – what did we change? Well, the changes in\
    \ this instance are minor – we moved the `hover`, `focus` and `active` pseudo-selectors\
    \ inside the parent `a` rule. In each instance, we’ve inserted an ampersand to\
    \ tell Sass to reference the parent class when compiling this rule; this will\
    \ transform it into the same valid CSS we used in the original nesting demo.\n\
    \n## Applying the `@extend` Directive\n\nThere are often cases during development,\
    \ where we might decide that to style an element, we first create a base class,\
    \ then add subsequent classes to cover variations of the base class. A good example\
    \ of this would be designing alert messages – our base class would include the\
    \ styles needed to create the shell, with the variations (in terms of styling,\
    \ icons) covered by the use of subsequent classes that inherit from the base class.\n\
    \nThe trouble is, this approach is not without its problems – it means we have\
    \ not one but at least two classes in use; this creates a maintenance burden and\
    \ can be tricky to debug at a later date. Question is: Can we get around this?\n\
    \nAbsolutely – let me introduce you to the `extend` keyword! This keyword takes\
    \ the following syntax:\n\n```\n@extend .classname;\n```\n\n… and allows classes\
    \ to share a set of properties with other classes. To use it, we would specify\
    \ the name of the extend class as a declaration within a CSS rule, thus:\n\n```\n\
    .classname {\nborder: 1px solid black;\nfont-weight: bold;\n}\n.foo {\n@extend\
    \ .classname;\ncolor: #fcc;\n...\n}\n```\n\nIn this instance, we will end up with\
    \ two classes – `.foo` and `.classname` - both sharing the same `font-weight`\
    \ and `border` properties. The `.foo` class will also have the `color` property\
    \ set as a separate declaration.\n\n### Working Through an Example\n\nMaking use\
    \ of `@extend` is perfect if we want to reduce the reliance on multiple classes;\
    \ we can instead create a rule that is inherited by others during compilation.\n\
    \nTo see what I mean, take a look at this example piece of code:\n\n```\n.error\
    \ {\nborder: 1px #f00;\nbackground-color: #fdd;\n}\n.seriousError {\n@extend .error;\n\
    border-width: 3px;\n}\n```\n\nWhen compiling (using a tool such as Sassmeister),\
    \ we get the CSS shown in Figure 3-5.\n\n![../images/472539_1_En_3_Chapter/472539_1_En_3_Fig5_HTML.jpg](images/472539_1_En_3_Chapter/472539_1_En_3_Fig5_HTML.jpg)\n\
    \nFigure 3-5 – The results of compiling an `@extend`\n\nSee how the second rule\
    \ (`.seriousError`) has inherited the properties defined in the first rule, as\
    \ well as kept the property specified in its own rule? This is perfect for styling\
    \ elements that share the same properties – we write one rule for our base declaration,\
    \ then use `@extend` in each class that needs to inherit this rule and specify\
    \ additional properties unique to that class.\n\nThis feature can be a little\
    \ tricky to get our heads around and fully understand its use, so let’s begin\
    \ with a demo to show off how it works in more detail.\n\n### A Practical Example\n\
    \nCast your minds back – anyone remember Polaroids? Yes, before the advent of\
    \ digital images, Polaroids were all the rage: no need to wait for films to be\
    \ developed, when the final picture appeared in just a few minutes, once we had\
    \ taken the shot!\n\nPolaroid cameras may not be as popular as they once were,\
    \ but the effect still lives on – it’s very easy to re-create the effect of a\
    \ Polaroid (the image look, not the developing process!). Let’s take a look at\
    \ how, using the power of Sass and its `@extend` function."
