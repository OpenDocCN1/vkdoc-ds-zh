- fmt: "### Demo – Optimized Importing\n\nFortunately, we can make a simple change\
    \ to our code to cure this problem – let’s make a start on updating our demo:\n\
    \n1.  We’ll begin by extracting a copy of the import-optimized file from the code\
    \ download that accompanies this book – go ahead and save it in our project area.\n\
    2.  Next, open `font-sizes.scss` in your text editor – change the full stops on\
    \ lines 7, 12, 17, and 22 to a `%` sign, so the start of the code looks similar\
    \ to this example:\n\n    ```scss\n    %h1 {\n    color: $grey;\n    ...\n   \
    \ ```\n\n3.  We also need to update `page.scss` to use the renamed placeholders\
    \ – for this go ahead and change the full stop in lines 4 and 8 to a `%` sign,\
    \ similar to this:\n\n    ```scss\n    .page_title {\n    @extend %h1;\n    }\n\
    \    ```\n\n4.  Fire up a terminal session, then change the working folder to\
    \ the `import-original` folder we created in step 1.\n5.  At the prompt, enter\
    \ this command, and press Enter:\n\n    ```sh\n    sass page.scss css\\page.css\n\
    \    ```\n\n6.  If we look inside the `css` folder, we should see two new files\
    \ – `page.css` and `page.css.map`; these contain our updated styles.\n\nNow –\
    \ remember what we did at the end of the previous exercise? This time around,\
    \ we won’t have the same six rules we had before – instead, we’ll have just three,\
    \ which is what we would expect to see in our finished article.\n\nAt this point,\
    \ go ahead and open the finished style sheet that you will see as `page.css` in\
    \ the `css` subfolder – inside we can indeed see just three rules, as indicated\
    \ in Figure [5-4](#472539_1_En_5_Chapter.xhtml#Fig4).\n\n![../images/472539_1_En_5_Chapter/472539_1_En_5_Fig4_HTML.jpg](images/472539_1_En_5_Chapter/472539_1_En_5_Fig4_HTML.jpg)\n\
    \n**Figure 5-4** The results of our optimized file\n\nSee how much of a difference\
    \ a single character can make? This raises two important points about optimizing\
    \ our code, which will help reduce duplication and bloat – let’s take a look at\
    \ these in more detail.\n\n### Understanding the Changes\n\nIf we take a look\
    \ back at the original version of the compiled code, we were expecting to see\
    \ three rules, but instead got five (with two sharing the same rule).\n\nThe reason\
    \ for this lies in the use of the full stop in the `font-sizes.scss` file (and\
    \ subsequent references to the styles from the `page.scss` file). This forces\
    \ Sass to treat them as new styles that should be imported – notice how, for example,\
    \ that there isn’t a reference to `.copy` in `page.scss`, but this is still imported\
    \ into the final result?\n\nWhen we changed the full stop over to a percentage\
    \ sign in the `font-sizes.scss` file, we told Sass that those styles should not\
    \ be imported as styles in their own right, but only import the content of each\
    \ style *where it is directly referenced* from an `@extend` statement in the calling\
    \ file. This is why when we look at the compiled result for the optimized version,\
    \ we only see references to `.page_cta`, `.page_title`, and `.page_special_button`\
    \ – the `.copy` rule, for example, is not referenced in an `@extend`, so will\
    \ not appear in this version of the style sheet.\n\nThe use of the percentage\
    \ sign is one way we can use to reduce code bloat – the other lies in the order\
    \ of how we import our partials, and what is stored within each partial. Take\
    \ a look at `font-sizes.scss` again: notice how we have variables and style rule\
    \ declarations within the same file?\n\nIn our small example, this works fine,\
    \ but it could well lead to duplication in more complex style sheets. A better\
    \ option is to keep all variables in one file only – importing this file early\
    \ in the list will make variables available globally, as in this example:\n\n\
    ```scss\n@import 'base/reset';\n@import 'helpers/variables';\n@import 'helpers/mixins';\n\
    @import 'helpers/functions';\n@import 'helpers/helpers';\n@import 'helpers/placeholders';\n\
    @import 'base/typography';\n@import 'pages/versions';\n@import 'pages/recording';\n\
    @import 'pages/lists';\n@import 'pages/global';\n@import 'forms/buttons';\n@import\
    \ 'forms/inputs';\n@import 'forms/validators' ;\n@import 'forms/fieldsets';\n\
    @import 'sections/header';\n@import 'sections/navigation';\n@import 'sections/sidebar-a';\n\
    @import 'sections/sidebar-b';\n@import 'sections/footer';\n@import 'vendors/ui-grid';\n\
    @import 'components/modals';\n@import 'components/tooltip';\n@import 'components/tables';\n\
    @import 'components/datepickers';\n```\n\nIt may seem a lot of files, but it is\
    \ important to remember that splitting content into smaller files will make it\
    \ easier to manage them, as long as we maintain a suitable order. The above list\
    \ can then be stored in the main style sheet while you work on each partial as\
    \ needed – Sass will import them all to produce the final version during compilation.\n\
    \nYou may see that other developers use the underscore to denote a Sass partial\
    \ file – this is not obligatory, as Sass will work just fine without them.\n\n\
    Okay – it’s time to move on: we’ve talked a lot about the importance of importing\
    \ content; time for a little action, methinks! To help really understand how we\
    \ can use importing, we’re going to work on a large CSS style sheet as a real-world\
    \ example, and transform the content into something more manageable for future\
    \ development.\n\n## Working Through an Example\n\nRemember how I said earlier\
    \ that you would be unlikely to get much benefit from using `@import` in a small\
    \ style sheet, and that the larger the style sheet, the better? It doesn’t matter\
    \ how large the style sheet is – the same principles we’ve talked about will still\
    \ apply, although we’ll get more benefit from converting a large style sheet than\
    \ a smaller one.\n\nA great example of a large style sheet is from the TwentySeventeen\
    \ theme that comes with the self-hosted version of WordPress. The style sheet\
    \ for this theme is a real monster: it comes in at over 4,000 lines!\n\nIt may\
    \ seem like a daunting task to convert a file of this size, but I will show you\
    \ that with some care and planning, we will begin to tame this beast into something\
    \ more manageable. There are, however, a couple of good reasons for picking WordPress’s\
    \ style sheet as the basis for what will be our next exercise:\n\n*   WordPress’s\
    \ style sheet was originally created using Sass – it makes it a natural choice.\n\
    *   Size should not matter: WordPress’s style sheet already has comment blocks\
    \ to split content. This makes it a cinch to convert the file, one block at a\
    \ time. It’s just a matter of planning what is changed and when we make the change.\n\
    *   If we take a closer look at the code within, WordPress’s style sheet contains\
    \ plenty of examples of declarations that can be converted. A good example would\
    \ include font names, colors, and sizes that can all be transformed into suitably\
    \ named variables.\n\nTo prove that we can bring a large style sheet under control,\
    \ no matter the size, we’re going to dive in to our next exercise, and do just\
    \ that: we’ll use the aforementioned TwentySeventeen theme, and begin to convert\
    \ it into something that is easier for us to manage."
