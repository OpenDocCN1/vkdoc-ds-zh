    None of this will work without the final task – the `default` one runs as soon
    as we enter gulp at the terminal session prompt. This watches out for any Sass
    files within the `sass` folder; any changes made will trigger the sass task:


    ```

    gulp.task(''default'', function () {

    gulp.watch(''sass/*.scss'', [''sass''])

    .on(''change'', function(evt) {

    console.log(

    ''\n[watcher] File '' + evt.path.replace(/.*(?=sass)/,") +

    '' was '' + evt.type + '', compiling...''

    );

