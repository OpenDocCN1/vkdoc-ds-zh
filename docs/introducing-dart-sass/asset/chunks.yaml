    \ of the cart – for this, go ahead and leave a line, then add in the following\
    \ styles, to take care of the subtotal, tax, and shipping values:\n\n```\n   \
    \ /* shopping cart footer */\n    #site-footer {\n    background: $color-white;\n\
    \    margin: 30px 0 0 0;\n    padding: 40px 0px;\n    width: 100%;\n    margin-left:\
    \ auto;\n    margin-right: auto;\n    clear: both;\n    h1 {\n    @include fontdetail($color-black,\
    \ 25px, 300);\n    background: $color-almost-white;\n    border-bottom: 1px solid\
    \ $color-description-grey;\n    margin: 0 0 7px 0;\n    padding: 14px 40px;\n\
    \    text-align: center;\n    span:before { content: \"$\"; }\n    }\n    h2 {\n\
    \    @include fontdetail($color-black, 24px, 300);\n    margin: 10px 0 0 0;\n\
    \    }\n    h3 {\n    @include fontdetail($color-black, 19px, 300);\n    margin:\
    \ 15px 0;\n    }\n    .left { float: left; }\n    .right { float: right; }\n \
    \   }\n    ```\n\n9.  We have a few miscellaneous styles, which don’t fit in with\
    \ the nested styles already covered; go ahead and add in the following below the\
    \ previous style block:\n\n```\n    button {\n    @include fontdetail($color-black,\
    \ 24px, 400) ;\n    background: $color-yellow;\n    border: 1px solid $color-dark-grey;\n\
    \    border-style: none none solid none;\n    cursor: pointer;\n    display: block;\n\
    \    padding: 16px 0;\n    width: 290px;\n    text-align: center;\n    transition:\
    \ all .2s linear;\n    &:hover { color: $color-white; background: $color-dark-cyan;\
    \ }\n    }\n    .small {\n    @include fontdetail($color-black, 13px, 300);\n\
    \    background: $color-almost-white;\n    padding: 10px 16px;\n    line-height:\
    \ 28px;\n    border: none;\n    display: inline-block ;\n    line-height: 29px;\n\
    \    }\n    .contain { width: 80%; margin-left: auto; margin-right: auto; }\n\
    \    /* plus and minus buttons in details */\n    .minus { margin: 0 50px 0 0;\
    \ }\n    .added { margin: 0 -50px 0 0; }\n    ```\n\n10.  We’re almost at the\
    \ end – this next block styles the remove links and buttons used on the site:\n\
    \n```\n    /* Remove link over books & remove button in description */\n    a\
    \ {\n    color: $color-black;\n    text-decoration: none;\n    transition: color\
    \ .2s linear ;\n    &:hover { color: $color-moderate-cyan; cursor: pointer; }\n\
    \    }\n    .removebtn {\n    @include fontdetail($color-black, 16px, bold);\n\
    \    width: 21px;\n    float: right;\n    margin-top: -72px;\n    background-color:\
    \ $color-light-grey;\n    color: $color-white;\n    border-radius: 148px;\n  \
    \  text-align: center;\n    height: 20px;\n    line-height: 20px;\n    &:hover\
    \ {\n    cursor: pointer;\n    background-color: $color-pure-red;\n    transition:\
    \ background-color 0.3s linear ;\n    }\n    }\n    ```\n\n11.  The final block\
    \ takes care of formatting the text displayed in the totals, shipping, and tax\
    \ values in our cart:\n\n```\n    /* cart totals */\n    .carttotal {\n    margin:\
    \ 20px;\n    display: inline-block;\n    float: right;\n    width: 110px;\n  \
    \  margin-top: 13px;\n    & > img { width: 40px; height: auto; }\n    & > span\
    \ {\n    background-color: $color-very-light-grey;\n    padding: 5px 10px;\n \
    \   border-radius: 20px;\n    position: absolute;\n    margin-top: 25px;\n   \
    \ margin-left: -20px ;\n    }\n    }\n    .tax, .shipping, .subtotal {\n    span\
    \ {\n    float: right;\n    &:before { content: \"$\"; }\n    }\n    div { width:\
    \ 100px; display: inline-block; }\n    }\n    ```\n\n12.  Go ahead and save the\
    \ file – we can close it for the moment, but we will make use of it shortly during\
    \ the compilation process."
  trans: "\n### 整合主样式表\n\n我们开始吧：\n\n1.  首先创建一个新文件 - 将其保存到 `shoppingcart` 文件夹下的 `sass`\
    \ 子文件夹中，文件名为 `shoppingcart.scss`。\n\n2.  虽然需要大量代码，但我们会逐块处理 - 首先在文件顶部添加以下几行，以引入我们在本章前面创建的导入部分文件：\n\
    \n```\n@import \"fonts.scss\";\n@import \"variables.scss\";\n```\n\n3.  我们的演示需要一些基础样式来铺垫\
    \ - 空一行，然后添加以下四条规则：\n\n```\n/* base styles */\nbody {\n  font-family: $pt-sans-family;\n\
    \  margin: 32px;\n  background: $color-light-grey;\n  margin: 0;\n  padding: 0;\n\
    \  overflow-x: hidden;\n  margin: 32px;\n}\n.container { margin: 0 auto; width:\
    \ 980px; }\n.clearfix { content: \"\"; display: table; clear: both; }\nh2.exercise\
    \ { margin-left: auto; margin-right: auto; width: 980px; }\n```\n\n4.  基础规则设置完毕后，我们现在可以覆盖购物车的每个主要区域\
    \ - 首先添加购物车头部规则：\n\n```\n/* header */\n#site-header {\n  margin: 0 auto;\n  padding-left:\
    \ 20px;\n  background: $color-white;\n  h1 {\n    @include fontdetail($color-black,\
    \ 31px, 300);\n    padding: 20px 0;\n    position: relative;\n    margin: 0;\n\
    \  }\n}\n```\n\n5.  接下来是购物车主区域的嵌套规则，包括商品详情：\n\n```\n/* shopping cart */\n#cart\
    \ {\n  width: 100%;\n  h1 { @include fontdetail($color-black, 25px, 300); }\n\
    \  p { @include fontdetail($color-black, 18px, 300); }\n}\n.product {\n  border:\
    \ 1px solid $color-light-grey;\n  margin: 20px 0;\n  width: 100%;\n  position:\
    \ relative;\n  transition: margin .2s linear, opacity .2s linear;\n  clear: both;\n\
    \  & img { width: 100%; height: 100%; }\n  .content {\n    background-color: $color-white;\n\
    \    border-bottom: 1px solid $color-description-grey;\n    float: left;\n   \
    \ box-sizing: border-box;\n    height: 171px;\n    padding: 0 20px 0 10px;\n \
    \   width: 83%;\n  }\n}\n.product header {\n  background-color: $color-white ;\n\
    \  border-bottom: 1px solid $color-description-grey;\n  float: left;\n  margin:\
    \ 0 1% 20px 0;\n  overflow: hidden;\n  padding: 0;\n  position: relative;\n  width:\
    \ 153px;\n  height: 218px;\n  h3 {\n    @include fontdetail($color-white, 22px,\
    \ 300);\n    background: $color-moderate-cyan;\n    line-height: 49px;\n    margin:\
    \ 0;\n    padding: 0 30px;\n    position: absolute;\n    bottom: -100px;\n   \
    \ right: 0;\n    left: 0;\n  }\n  &:hover img { opacity: .7; }\n  &:hover h3 {\
    \ bottom: 73px; }\n}\n```\n\n6.  在每个商品描述中，我们都有一个详情块 - 包含所选书籍类型、单价、数量和总价。请继续添加以下代码块：\n\
    \n```\narticle footer {\n  margin: 0;\n  padding: 0;\n  background-color: $color-almost-white;\n\
    \  .price {\n    @include fontdetail($color-black, 15px, 300);\n    background:\
    \ #fcfcfc;\n    float: right;\n    line-height: 49px ;\n    margin: 0;\n    padding:\
    \ 0 30px;\n    &:before { content: \"$\"; }\n  }\n  .full-price {\n    @include\
    \ fontdetail($color-black, 22px, 400);\n    background: $color-yellow;\n    float:\
    \ right;\n    line-height: 39px;\n    margin: 5px;\n    padding: 0 30px;\n   \
    \ transition: margin .15s linear;\n    width: 125px;\n    text-align: right;\n\
    \    &:before { content: \"$\"; }\n  }\n}\n```\n\n7.  下一部分负责设置购物篮中商品数量更新按钮的样式。在上一部分之后添加以下代码，并确保先空一行：\n\
    \n```\n.qt {\n  @include fontdetail($color-black, 19px, 300);\n  line-height:\
    \ 50px;\n  width: 70px;\n  text-align: center;\n  display: block;\n  float: left;\n\
    }\n.qt-plus, .qt-minus {\n  @include fontdetail($color-black, 30px, 300);\n  display:\
    \ block;\n  float: left;\n  background: $color-almost-white;\n  border: none;\n\
    \  height: 100%;\n  padding: 0 20px ;\n  transition: background .2s linear;\n\
    \  line-height: 39px;\n  margin: 5px;\n  &:hover { background: $color-moderate-cyan;\
    \ color: $color-white; cursor: pointer; }\n}\n```\n\n8.  购物车的下一部分是底部页脚 - 空一行，然后添加以下样式来处理小计、税费和运费：\n\
    \n```\n/* shopping cart footer */\n#site-footer {\n  background: $color-white;\n\
    \  margin: 30px 0 0 0;\n  padding: 40px 0px;\n  width: 100%;\n  margin-left: auto;\n\
    \  margin-right: auto;\n  clear: both;\n  h1 {\n    @include fontdetail($color-black,\
    \ 25px, 300);\n    background: $color-almost-white;\n    border-bottom: 1px solid\
    \ $color-description-grey;\n    margin: 0 0 7px 0;\n    padding: 14px 40px;\n\
    \    text-align: center;\n    span:before { content: \"$\"; }\n  }\n  h2 {\n \
    \   @include fontdetail($color-black, 24px, 300);\n    margin: 10px 0 0 0;\n \
    \ }\n  h3 {\n    @include fontdetail($color-black, 19px, 300);\n    margin: 15px\
    \ 0;\n  }\n  .left { float: left; }\n  .right { float: right; }\n}\n```\n\n9.\
    \  还有一些杂项样式，不适合放到已有嵌套样式中；在上一样式块后添加以下内容：\n\n```\nbutton {\n  @include fontdetail($color-black,\
    \ 24px, 400) ;\n  background: $color-yellow;\n  border: 1px solid $color-dark-grey;\n\
    \  border-style: none none solid none;\n  cursor: pointer;\n  display: block;\n\
    \  padding: 16px 0;\n  width: 290px;\n  text-align: center;\n  transition: all\
    \ .2s linear;\n  &:hover { color: $color-white; background: $color-dark-cyan;\
    \ }\n}\n.small {\n  @include fontdetail($color-black, 13px, 300);\n  background:\
    \ $color-almost-white;\n  padding: 10px 16px;\n  line-height: 28px;\n  border:\
    \ none;\n  display: inline-block ;\n  line-height: 29px;\n}\n.contain { width:\
    \ 80%; margin-left: auto; margin-right: auto; }\n/* plus and minus buttons in\
    \ details */\n.minus { margin: 0 50px 0 0; }\n.added { margin: 0 -50px 0 0; }\n\
    ```\n\n10. 我们快完成了 - 下一个块设置网站上删除链接和按钮的样式：\n\n```\n/* Remove link over books & remove\
    \ button in description */\na {\n  color: $color-black;\n  text-decoration: none;\n\
    \  transition: color .2s linear ;\n  &:hover { color: $color-moderate-cyan; cursor:\
    \ pointer; }\n}\n.removebtn {\n  @include fontdetail($color-black, 16px, bold);\n\
    \  width: 21px;\n  float: right;\n  margin-top: -72px;\n  background-color: $color-light-grey;\n\
    \  color: $color-white;\n  border-radius: 148px;\n  text-align: center;\n  height:\
    \ 20px;\n  line-height: 20px;\n  &:hover {\n    cursor: pointer;\n    background-color:\
    \ $color-pure-red;\n    transition: background-color 0.3s linear ;\n  }\n}\n```\n\
    \n11. 最后一个块负责格式化购物车中总计、运费和税费显示的文本：\n\n```\n/* cart totals */\n.carttotal {\n \
    \ margin: 20px;\n  display: inline-block;\n  float: right;\n  width: 110px;\n\
    \  margin-top: 13px;\n  & > img { width: 40px; height: auto; }\n  & > span {\n\
    \    background-color: $color-very-light-grey;\n    padding: 5px 10px;\n    border-radius:\
    \ 20px;\n    position: absolute;\n    margin-top: 25px;\n    margin-left: -20px\
    \ ;\n  }\n}\n.tax, .shipping, .subtotal {\n  span {\n    float: right;\n    &:before\
    \ { content: \"$\"; }\n  }\n  div { width: 100px; display: inline-block; }\n}\n\
    ```\n\n12. 保存文件 - 暂时可以关闭它，稍后在编译过程中我们会用到它。\n"
- fmt: "Phew – that was a monster lot of code! Well done if you managed to make it\
    \ thus far: we’ve done the hardest and most important part of our demo.\n\nWe\
    \ still have a couple of things to do, though, before we can compile the code\
    \ and admire our handiwork. First – let’s take a breather for a moment, and explore\
    \ our style sheet code in more detail: it illustrates a few key points you should\
    \ be aware of when it comes to creating Sass style sheets in your future projects.\n\
    \n### Breaking Apart the Code\n\nWe could dive straight into our code, but before\
    \ we do so, I’m going to recommend you do something first: take a breather! Go\
    \ make yourself a drink, get some fresh air – it does not matter what: the aim\
    \ though is to get away from the screen for a few minutes.\n\nThere is a good\
    \ reason for doing this: although much of the code we’ve used in our example is\
    \ standard CSS, it will at first glance look a little complicated. The key to\
    \ making it work though is the use of nesting – much of the code within this project\
    \ was nested to help with readability. With that in mind, let’s take a look at\
    \ the code in detail.\n\nWe start with two `@import` statements – one to import\
    \ our font declarations, and the second to handle the variables used in our style\
    \ sheet. We then set up some base styles for our page, including the background\
    \ for our cart and the title of our exercise.\n\nNext up comes a set of styles\
    \ for `#site-header` – this is where we start to use nesting, to include descendant\
    \ rules for a child `h1` element. We then follow this same principle for `.product`\
    \ – this includes a host of child rules to style elements within the product description\
    \ and price sections of the site. Notice though that we also make use of variables\
    \ for colors – these were defined in the `_variables.scss` file but are merged\
    \ in as part of the compilation process.\n\nWe then work through a set of declarations\
    \ for the footer part of each product description; the parent element is `article\
    \ footer`, under which we have rules for `.price` and `.full-price` classes. This\
    \ is swiftly followed by a nested block for the quantity buttons – notice how\
    \ this also includes a mixin for applying what will be the Open Sans Light font\
    \ family (as is the case at various points throughout the style sheet).\n\nThe\
    \ next block of nesting in our style sheet is for the `#site-footer` element;\
    \ this includes declarations for `h1`, `h2`, and `h3` elements, along with `.left`\
    \ and `.right` classes to define where the content will sit in the footer. The\
    \ last part of the style sheet covers a group of miscellaneous styles, before\
    \ we round out with nested blocks for the cart total values in the footer and\
    \ tax, shipping, and subtotal values in the footer of our cart.\n\n## Tying It\
    \ All Together\n\nWe’re almost ready to run the all-important compilation process,\
    \ but before we do so, there is one more important area to cover: the script code\
    \ used to make our basket work.\n\nThe code we’ve used is the same as the original\
    \ version of this cart, save for some minor tweaks and additions – it looks complicated\
    \ but can be broken down into some clear sections.\n\nThe first section (from\
    \ around lines 5 to 20), is the `changeVal()` function that we use to update prices,\
    \ depending on how many products have been selected; this is called from various\
    \ points in our code, as and when we make a change to the quantity of products\
    \ that have been selected in our cart (or removed). The second function we use\
    \ is the `changeTotal()` function – this updates the total values (both sub and\
    \ final), along with shipping and tax costs, before rendering the updated values\
    \ on screen.\n\nWe then have five event handlers set up: the first two take care\
    \ of responding to clicks on the Remove banner (that appears on books), and the\
    \ red remove cross in the top right of each product description. The next two\
    \ take care of clicks on the plus or minus buttons to add or remove products;\
    \ these adjust the quantities selected, before calling the `changeVal()` function\
    \ to update the total price for the number of copies of the selected book. Our\
    \ last event handler simply calls the remove function, to either show the placeholder\
    \ for the checkout process, or indicate if the cart is empty; and therefore, we\
    \ would not be able to complete the checkout process.\n\nRight – enough chitchat:\
    \ it’s time, folks … time to see if our demo really works! We’ve got all of our\
    \ code in place, so without further ado, let’s dive in and run the compilation\
    \ process.\n\n## Compiling Our Code\n\nThis is probably one of the easiest parts\
    \ of this chapter, yet the scariest – does our demo work? Hopefully it will do,\
    \ but before we find out, it’s worth checking through the code to make sure we\
    \ have everything in place.\n\nIf you take a look at the `sass` subfolder, you\
    \ should see three files with “finished version” in their names. These are pre-completed\
    \ versions – you can compare yours with these to see if everything is indeed in\
    \ place and ready for compilation.\n\n### Demo – Compiling Our Code\n\nOkay –\
    \ let’s make a start on compiling our code. For this, we’ll revert back to using\
    \ the Node.js set up we created at the start of this chapter; let’s make a start:\n\
    \n1.  Fire up a Node.js terminal session, or revert back to the previous one if\
    \ you still have it open – make sure the working folder is the `shoppingcart`\
    \ folder we set up at the start of this chapter.\n\n2.  At the prompt, go ahead\
    \ and enter `gulp`, then press Enter; you should see it show `Starting 'default'...`,\
    \ followed by `Finished 'default'` and a given time.\n\n3.  If you try saving\
    \ the main style sheet now, it will automatically kick in and recompile – an example\
    \ of this is shown in Figure [6-2](#472539_1_En_6_Chapter.xhtml#Fig2).\n\n   \
    \ ![../images/472539_1_En_6_Chapter/472539_1_En_6_Fig2_HTML.jpg](images/472539_1_En_6_Chapter/472539_1_En_6_Fig2_HTML.jpg)\n\
    \n    Figure 6-2\n\n    Compiling our code\n\nAssuming no errors were displayed,\
    \ then congratulations! You’ve completed your first project using Sass; sure,\
    \ there are improvements we can make, but that’s fine, as each project should\
    \ evolve and mature over time. There is just one last thing though…\n\n## The\
    \ Final Result\n\nHehe – if you were expecting something major, don’t worry! That\
    \ “one last thing” is actually the best part of the whole chapter; this is where\
    \ we get to see our final result in all its glory. Assuming you encountered no\
    \ issues, then Figure [6-3](#472539_1_En_6_Chapter.xhtml#Fig3) shows the final\
    \ article, as previewed in a browser.\n\n![../images/472539_1_En_6_Chapter/472539_1_En_6_Fig3_HTML.jpg](images/472539_1_En_6_Chapter/472539_1_En_6_Fig3_HTML.jpg)\n\
    \nFigure 6-3\n\nOur finished shopping cart\n\nIt goes to show that we can always\
    \ make use of Sass within our code – the exact amount will, of course, depend\
    \ on the nature of the project, but that over time we can begin to build up reusable\
    \ code that can be added to any number of future projects that make use of Sass."
