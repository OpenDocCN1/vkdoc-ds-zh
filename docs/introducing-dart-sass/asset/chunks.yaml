    \ book that you now hold in your hands.\n\n### About the Author and About the\
    \ Technical Reviewer\n\n### About the Author\n\n### About the Technical Reviewer\n\
    \n# 1. Introducing Sass\n\n> *Imagine the scene if you will – it's late on Friday,\
    \ and you're ready to go home. Only your boss walks up to your desk and says there's\
    \ a last-minute change needed on some styles for the buttons in your latest project.\
    \ Ugh – so much for finishing on time. …*\n\nSound familiar? Ordinarily, we might\
    \ have to spend hours poring through style sheets, working out which styles to\
    \ change and where, hoping that we don't miss anything in our hunt. This is a\
    \ real drag, particularly when you had hopes to go on a night out – no problem\
    \ if you use Sass!\n\nThe term \"Sass\" has been floating around for a few years,\
    \ with some well-known names as proponents of the technology. The real question\
    \ I'll bet you're asking though is this: What is all of the hype about, and how\
    \ will it help in my development?\n\n## What Is Sass?\n\nThese are two very good\
    \ questions ask to really understand what Sass is all about; however, we must\
    \ first answer one question: What is a CSS preprocessor?\n\nPut simply, a preprocessor\
    \ is a scripting language that we can use to extend CSS; we use it to write code\
    \ in one language before compiling it into CSS. Sass is arguably the most popular\
    \ of these although others exist, such as Less or Stylus. Sass allows us to create\
    \ all types of shortcuts: from simple placeholders to update multiple instances\
    \ of a single value, through to creating new styles that subsume existing base\
    \ styles.\n\nSo now that we've been introduced to preprocessors, it's time we\
    \ answered those two questions: What is Sass all about, and how is it going to\
    \ help in my development?\n\nFirst appearing back in 2006 and created by Hampton\
    \ Catlin, Sass, or Syntactically Awesome Stylesheets (yes, it is a bit of a mouthful),\
    \ is billed as an extension of CSS. It brings in the power of basic scripting\
    \ tools such as variables and loops, to help keep your code more organized and\
    \ create style sheets faster than with ordinary CSS. If the thought of creating\
    \ variables or loops scares you, then don't worry – they are much easier to use\
    \ than the terms might imply! We will go through all of the core functions of\
    \ Sass over the course of this book; by the end, you will be more at ease with\
    \ Sass and wonder why you hadn't made the change to using it sooner.\n\nOkay –\
    \ let's move on: now that we've been formally introduced, let's answer the second\
    \ question: How is Sass going to help me when it comes to developing style sheets?"
