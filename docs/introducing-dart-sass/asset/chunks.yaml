    \ you still have it open – make sure the working folder is the `shoppingcart`\
    \ folder we set up at the start of this chapter.\n\n2.  At the prompt, go ahead\
    \ and enter `gulp`, then press Enter; you should see it show `Starting 'default'...`,\
    \ followed by Finished 'default' and a given time.\n\n3.  If you try saving the\
    \ main style sheet now, it will automatically kick in and recompile – an example\
    \ of this is shown in Figure [6-2](#472539_1_En_6_Chapter.xhtml#Fig2).\n\n   \
    \ ![../images/472539_1_En_6_Chapter/472539_1_En_6_Fig2_HTML.jpg](images/472539_1_En_6_Chapter/472539_1_En_6_Fig2_HTML.jpg)\n\
    \n    Figure 6-2\n\n    Compiling our code\n\nAssuming no errors were displayed,\
    \ then congratulations! You’ve completed your first project using Sass; sure,\
    \ there are improvements we can make, but that’s fine, as each project should\
    \ evolve and mature over time. There is just one last thing though…\n\n## The\
    \ Final Result\n\nHehe – if you were expecting something major, don’t worry! That\
    \ “one last thing” is actually the best part of the whole chapter; this is where\
    \ we get to see our final result in all its glory. Assuming you encountered no\
    \ issues, then Figure [6-3](#472539_1_En_6_Chapter.xhtml#Fig3) shows the final\
    \ article, as previewed in a browser.\n\n![../images/472539_1_En_6_Chapter/472539_1_En_6_Fig3_HTML.jpg](images/472539_1_En_6_Chapter/472539_1_En_6_Fig3_HTML.jpg)\n\
    \nFigure 6-3\n\nOur finished shopping cart\n\nIt goes to show that we can always\
    \ make use of Sass within our code – the exact amount will, of course, depend\
    \ on the nature of the project, but that over time we can begin to build up reusable\
    \ code that can be added to any number of future projects that make use of Sass."
  trans: "\n唷——这真是一大堆代码！如果你能坚持到这里，那真是太棒了：我们已经完成了演示中最难、最重要的部分。\n\n不过，在编译代码并欣赏我们的杰作之前，我们还有几件事要做。首先——让我们稍作喘息，更详细地探索一下样式表代码：它阐述了在未来的项目中使用\
    \ Sass 创建样式表时，你应该注意的几个关键点。\n\n### 分解代码\n\n我们可以直接一头扎进代码，但在此之前，我建议你先做一件事：休息一下！去给自己倒杯饮料，呼吸点新鲜空气——做什么都行：目的是让自己离开屏幕几分钟。\n\
    \n这样做有个很好的理由：虽然我们示例中使用的大部分代码都是标准的 CSS，但乍一看会显得有些复杂。但它能工作的关键在于使用了嵌套（nesting）——该项目中的许多代码都采用了嵌套，以提高可读性。带着这个想法，让我们仔细看看代码。\n\
    \n我们从两条 `@import` 语句开始——一条用于导入字体声明，另一条用于处理样式表中使用的变量。然后，我们为页面设置了一些基础样式，包括购物车背景和练习标题。\n\
    \n接下来是一组针对 `#site-header` 的样式——从这里开始我们使用嵌套，为子元素 `h1` 包含后代规则。然后我们对 `.product` 遵循同样的原则——它包含大量的子规则，用于设置网站产品描述和价格部分的元素样式。注意，我们还使用了颜色变量——这些变量是在\
    \ `_variables.scss` 文件中定义的，但会在编译过程中合并进来。\n\n然后，我们处理每个产品描述页脚部分的一组声明；父元素是 `article\
    \ footer`，在其下方我们有针对 `.price` 和 `.full-price` 类的规则。紧接着是数量按钮的嵌套块——注意这里还包含了一个混入（mixin），用于应用\
    \ Open Sans Light 字体族（样式表中多次出现此情况）。\n\n样式表中的下一个嵌套块是针对 `#site-footer` 元素；它包括针对\
    \ `h1`、`h2` 和 `h3` 元素的声明，以及 `.left` 和 `.right` 类，用于定义内容在页脚中的位置。样式表的最后一部分涵盖了一组杂项样式，之后我们以购物车页脚中的总金额以及税金、运费和小计金额的嵌套块作为收尾。\n\
    \n## 整合所有内容\n\n我们即将运行至关重要的编译过程，但在此之前，还有一个重要的部分需要介绍：用于让购物车运行的脚本代码。\n\n我们使用的代码与购物车原始版本相同，只做了一些微小的调整和添加——它看起来复杂，但可以分解为几个清晰的部分。\n\
    \n第一部分（大约第 5 行到第 20 行）是 `changeVal()` 函数，我们用它来根据所选产品的数量更新价格；当购物车中选定产品的数量发生变化（或被移除）时，会在代码的不同位置调用这个函数。我们使用的第二个函数是\
    \ `changeTotal()` 函数——它会更新总金额（包括小计和最终金额）以及运费和税费，然后在屏幕上呈现更新后的数值。\n\n接着，我们设置了五个事件处理器：前两个负责响应“移除此横幅”（出现在书籍上）和每个产品描述右上角的红色“移除”叉号的点击事件。接下来的两个负责响应加号或减号按钮的点击，以添加或移除产品；它们会调整选中的数量，然后调用\
    \ `changeVal()` 函数来更新所选书籍对应数量的总价。最后一个事件处理器简单地调用移除函数，要么显示结账流程的占位符，要么指示购物车为空；因此，我们无法完成结账流程。\n\
    \n好了——闲话少说，朋友们，是时候了……是时候看看我们的演示是否真的有效了！所有代码都已就位，那么，闲话少叙，让我们直接进入并运行编译过程吧。\n\n##\
    \ 编译我们的代码\n\n这可能是本章中最简单的部分之一，但也是最令人紧张的部分——我们的演示能成功吗？希望可以，但在揭晓答案之前，最好检查一遍代码，确保一切就绪。\n\
    \n如果你查看 `sass` 子文件夹，应该会看到三个文件名中包含“finished version”的文件。这些是已完成版本——你可以将自己的版本与之比较，看看一切是否确实就绪，可以编译了。\n\
    \n### 示例——编译我们的代码\n\n好了——让我们开始编译代码吧。为此，我们将回到本章开始时创建的 Node.js 环境中；让我们开始：\n\n1.\
    \  启动一个 Node.js 终端会话，或者如果之前的会话还开着，切换回去——确保工作文件夹是我们本章开始时创建的 `shoppingcart` 文件夹。\n\
    \n2.  在提示符下，输入 `gulp`，然后按回车键；你应该会看到显示 `Starting 'default'...`，接着是 `Finished 'default'`\
    \ 和一个时间戳。\n\n3.  如果你现在尝试保存主样式表，它会自动触发并重新编译——如图 6-2 所示。\n\n    ![../images/472539_1_En_6_Chapter/472539_1_En_6_Fig2_HTML.jpg](img/472539_1_En_6_Fig2_HTML.jpg)\n\
    \n    图 6-2\n\n    编译我们的代码\n\n假设没有显示错误，那么恭喜你！你已经使用 Sass 完成了第一个项目；当然，我们还可以进行改进，但这没关系，因为每个项目都应该随着时间的推移而发展和成熟。不过，还有最后一件事……\n\
    \n## 最终成果\n\n嘿嘿——如果你期待什么重大事件，别担心！那个“最后一件事”实际上是整章中最棒的部分；这是我们终于能够一睹最终成果辉煌全貌的时刻。假设你没有遇到任何问题，那么图\
    \ 6-3 展示了在浏览器中预览的最终文章。\n\n![../images/472539_1_En_6_Chapter/472539_1_En_6_Fig3_HTML.jpg](img/472539_1_En_6_Fig3_HTML.jpg)\n\
    \n图 6-3\n\n我们完成的购物车\n\n这证明了我们总能在代码中使用 Sass——具体使用量当然取决于项目的性质，但随着时间的推移，我们能够开始构建可重用的代码，这些代码可以添加到任何将来使用\
    \ Sass 的项目中。\n"
- fmt: "# Future Changes\n\nWith our project now operational, the next question we\
    \ should answer is: Where next …?\n\nThere are a host of changes we could consider\
    \ – we are only limited by our imagination and the requirements for our project!\
    \ As Sass is a superset of CSS, it means that we can absolutely convert as much\
    \ or as little CSS to its Sass equivalent as we like. Once the initial hard work\
    \ of conversion is done, we can then add in new styles as needed – how about these\
    \ as a starter for ten?\n\n*   We could look at using more namespaced properties\
    \ – take a look at this extract from the `fontdetail` mixin:\n\n    ```\n    font:\
    \ {\n    size: $size;\n    weight: $weight;\n    }\n    ```\n\n    We already\
    \ make use of `padding` and `margin` throughout the demo, so perhaps there is\
    \ scope to use this feature?\n\n*   A more efficient way of writing colors would\
    \ be to use a Sass map – we can then group together shades of a color, which will\
    \ be a more efficient way to write our code. We should take it one step further,\
    \ though – when we assign color to variable names, use a common format, such as\
    \ `$border-blue-light` (generic to specific). It makes it easier to group names,\
    \ easier for your text editor to suggest color names, and easier to understand\
    \ where they are being used in your code.\n\n*   We could investigate the addition\
    \ of images such as credit card or security logos – there are several of tools\
    \ available that we can plug into our `Gulpfile.js` script, to generate the relevant\
    \ Sass code for our images.\n\n*   We’ve not really made any use of external libraries\
    \ in this demo – it doesn’t mean to say we shouldn’t; how about using the Scut\
    \ library ([`https://davidtheclark.github.io/scut/font-face.html`](https://davidtheclark.github.io/scut/font-face.html)),\
    \ to handle the `@font-face` code used in our `variables.scss` partial file?\n\
    \n*   Anyone remember using `rem` units, instead of pixels? We’ve used pixel values\
    \ for convenience throughout, but if you have a hankering for `rem` units, then\
    \ Sass can easily add these in using a mixin. Have a look on [Google.com](http://google.com)\
    \ for \"sass mixin for rem units\" – there are dozens of examples!\n\n*   We could\
    \ even go as far as adding in media breakpoints to make our page more responsive\
    \ – `@media` queries are handled natively in Sass (and can even be nested); [Medium.com](http://medium.com)\
    \ has a useful article that explains how you can implement them using Sass, at\
    \ [`https://medium.com/codeartisan/breakpoints-and-media-queries-in-scss-46e8f551e2f2`](https://medium.com/codeartisan/breakpoints-and-media-queries-in-scss-46e8f551e2f2)\
    \ .\n\n*   We’ve defined a base style `.qt` for our quantity buttons – this works\
    \ very well but requires us to assign two styles. How about using the `@extend`\
    \ function to create a base style, but then extend it into what we would see as\
    \ the plus or minus buttons?\n\nThese are just some of the ideas that are possible\
    \ when using Sass – we are, of course, only limited by our imagination! Hopefully\
    \ this has given you a flavor of what to expect when using Sass in a larger, real-world\
    \ project; as long as you take care over your planning, use an iterative approach\
    \ to converting code and are sensible in your choices, then you should have no\
    \ issue adapting existing projects to using Sass.\n\n## Summary\n\nThroughout\
    \ this book, we’ve covered a wealth of different features in Sass – from the humble\
    \ variable right through to building mixins and controlling the output using conditional\
    \ logic. Over the course of this chapter we’ve brought many of these features\
    \ together in the form of a real-world project – our shopping cart may not win\
    \ any awards, but we must start somewhere! We’ve covered a fair few tips throughout\
    \ these pages, so let’s take a moment to review what we’ve learned in this chapter.\n\
    \nWe kicked off by outlining details of our project for this chapter, before moving\
    \ swiftly on to set up our development environment and installing our HTML markup.\n\
    \nNext up, we then explored creating the styles for our project – we worked our\
    \ way through the two import partials, before assembling the main style sheet.\
    \ We then brought it all together with a brief look at the jQuery code required\
    \ to make our cart work, before running the compilation process and viewing the\
    \ results of our work in a browser.\n\nPhew – what a ride! We’ve covered a lot\
    \ throughout this book; I hope you’ve found it useful, and that you enjoy using\
    \ Sass just as much as I’ve enjoyed writing this book!\n\n### Index\n\n#### A\n\
    \nAssigning variables, Sass\n\n#### B\n\nBoolean-based operators Box-shadow effect\n\
    \n#### C, D\n\n`centerdiv` mixin `changeTotal()` function `changeVal()` function\
    \ Color Palettes website Colors, case study benefits creation manipulation palettes\
    \ Sass functions SVG image `$color` value Converting Sass changing code CSS file\
    \ `css2scss` tool importing files changing code demo updation prebuilt library\
    \ styleflux WordPress `css2scss` tool\n\n#### E\n\n`@each` function `@extend`\
    \ directive CSS example extend block mixins differences media directives parameters\
    \ Sass polaroid effect sass classes `.seriousError` syntax\n\n#### F\n\n`focus`\
    \ declaration `@for` function Functions, Sass colors ( *see* Colors, case study)\
    \ JavaScript types\n\n#### G\n\nGolden ratio\n\n#### H\n\nHomemade Apple `hover`\
    \ declaration\n\n#### I, J, K\n\n`@if` and `@if()` function `@import` function\
    \ `@include` command\n\n#### L\n\n`lighten()` function Linux List-based operators\n\
    \n#### M\n\nMac OS X Main style sheet, set up `map-get()` function `@media` directive\
    \ breakpoints creation mixin Menu bar creation, nested style Mixins centering\
    \ div compiled as CSS creation importing files library multiple files passing\
    \ values prebuilt reusable code usage\n\n#### N, O\n\nNested styles benefits concept\
    \ `<nav>` element navigation bar pitfalls property Sass three levels code Nesting\
    \ `nth-of-type()` declaration Number-based operations\n\n#### P, Q, R\n\n`package.json`\
    \ file Parametric mixins creation dissecting code Parent selectors, nesting placeholder\
    \ Polaroid cameras effect Prebuilt library exploring mixins pitfall assessment\
    \ Sass libraries Property list/map, styles `figcaption` rule key Sass maps pseudo-selectors\n\
    \n#### S\n\nSass advantages automating process breaking down process buttons compilation\
    \ process conversion process ( *see* Converting Sass) definition folder structure\
    \ installation key factors key terms output format parametric mixins properties\
    \ setting up simplifying process skeleton page source map support styleflux syntaxes\
    \ workflow ( *see* Setting up workflow, Sass) Sass code libraries Sassmeister\
    \ Sassy CSS Setting up font Setting up workflow, Sass choosing option code edit\
    \ compilation process folder structure output format source map Shopping cart\
    \ assigning variables code breaking compiling code completion future changes imported\
    \ code initial cart initializing variables Node.js set up Standard mixins `@import`\
    \ statement `@include` keyword prebuilt mixins reusable code Stinson mixin String-based\
    \ operators Stylelint tool Style sheet preparation Styles looping color attribute\
    \ `@each` function `@for` function Sublime Text\n\n#### T, U\n\nTwentySeventeen\
    \ theme\n\n#### V\n\nVariable creation, Sass adding comments compilation error\
    \ compiled CSS compiling comments mixins ( *see* Mixins) naming\n\n#### W, X,\
    \ Y, Z\n\n`@while` loop CSS demo `@while true` loop Windows WordPress’s style\
    \ sheet"
