    \ make use of an example palette from the Color Palettes website at [`http://colorpalettes.net/`](http://colorpalettes.net/)\
    \ and get Sass to generate the colors for us during compilation.\n\n### Part 2 –\
    \ Creating Colors\n\nLet’s begin creating our demo:\n\n![../images/472539_1_En_4_Chapter/472539_1_En_4_Fig4_HTML.jpg](images/472539_1_En_4_Chapter/472539_1_En_4_Fig4_HTML.jpg)\n\
    \nFigure 4-4\n\nCreating a color palette with Sass\n\n1.  We’ll start by downloading\
    \ and extracting a copy of the `palette` folder from the code download that accompanies\
    \ this book – go ahead and save it to our project folder.\n\n2.  We need to add\
    \ our styles; so for this, go ahead and open a new document. There are a good\
    \ few present, so we’ll add them block by block, starting with some base styles:\n\
    \n    ```\n    $basecolor: #213451;\n    @font-face { font-family: 'pt_sansregular';\
    \ src: url('../font/pt_sansregular.woff') format('woff'); font-weight: normal;\
    \ font-style: normal; }\n    body { font-family: 'pt_sansregular', sans-serif;\
    \ margin: 32px; width: 850px; }\n    #palette { margin-bottom: 15px; }\n    ```\n\
    \n3.  With the base styles in place, we can now add the rules to style each swatch:\n\
    \n    ```\n    .swatch { height: 125px; width: 75px; display: inline-block;  \
    \ margin-right: 17px; }\n    .swlabel { border: 1px solid #bfbfbf; width: 75px;\
    \ display: inline-block; margin-right: 15px; margin-top: -15px; text-align: center;\
    \ padding: 10px 0px 10px 0;}\n    ```\n\n4.  To give each swatch color, we need\
    \ to add in the following rules to our style sheet:\n\n    ```\n    .swatch:nth-child(1)\
    \ { background-color: $basecolor; }\n    .swatch:nth-child(2) {\n    background-color:\
    \ lighten(desaturate($basecolor, 22.27), 30.20);\n    }\n    .swatch:nth-child(3)\
    \ {\n    background-color: lighten(desaturate(adjust-hue($basecolor, 119), 15.54),\
    \ 52.55);\n    }\n    .swatch:nth-child(4) {\n    background-color: lighten(desaturate(adjust-hue($basecolor,\
    \ 114), 32.11), 73.73);\n    }\n    .swatch:nth-child(5) {\n    background-color:\
    \ lighten(saturate(adjust-hue(#213451, -131), 57.89), 4.90);\n    }\n    ```\n\
    \n5.  Save the file as `palette.scss` in the `scss` folder.\n\n6.  Next, fire\
    \ up a terminal session and change the working folder to the `palette` folder\
    \ under our project area.\n\n7.  At the prompt, type the following command and\
    \ press Enter:\n\n    ```\n    sass sass\\palette.scss css\\palette.css\n    ```\n\
    \n8.  If all is well, we should see a `palette.css` file appear in the `css` folder,\
    \ along with a source map – previewing the results will show a simple template\
    \ page with styled elements, as indicated in Figure [4-4](#472539_1_En_4_Chapter.xhtml#Fig4).\n\
    \nAlthough the Sass code in this demo may look complex, in reality we don’t have\
    \ to worry about the specifics, as most of the heavy lifting is done for via the\
    \ Sass color function tool we used in this demo. There are nevertheless some really\
    \ useful benefits to creating palettes in this manner, so let’s dive in and take\
    \ a look at our code in more detail.\n\n### Breaking Apart the Code in Detail\n\
    \nThe traditional approach to creating palettes would likely take the form of\
    \ choosing colors, then deciding which should be used and where, and hoping that\
    \ we retain some form of consistency during development! (I’m sure this sounds\
    \ worse than it really is, but nevertheless it is a manual approach that is opens\
    \ us to a degree of risk.)\n\nWhen you first start with Sass, though, the temptation\
    \ might be to assign different colors to variables – so you might have `$white`\
    \ for white, and `$desaturatedblue` would represent `#213451`. Creating variables\
    \ though is tedious – we have to make sure all of the colors complement each other,\
    \ and that our general palette looks sensible (and fits in with brand guidelines).\n\
    \nInstead, we can flip things entirely on its head – while a good chunk of code\
    \ sets up each swatch, we only specify one base color, at line 16. Although this\
    \ may seem crazy, there is a good reason for this – we transform the base color\
    \ to become each of the palette colors chosen for this demo. If we take a look\
    \ at the middle one, which has this set as its color:\n\n```\nbackground-color:\
    \ lighten(desaturate(adjust-hue($basecolor, 119), 15.54), 52.55);\n```\n\n… we\
    \ can break it down into its constituent parts:\n\n*   `adjust-hue($basecolor,\
    \ 119)` – this gives us our first intermediate color (or color1);\n\n*   `desaturate(color1,\
    \ 15.54)` – this results in our second color (or color2);\n\n*   `lighten(color2,\
    \ 52.55)` – our third and final color.\n\nIn this instance, we’ve created 3 new\
    \ colors that could be used in their own right; instead, we’re getting Sass to\
    \ automatically calculate color3 directly from our base color in a single pass.\
    \ The same principles apply to each of the colors we’ve created for the palette –\
    \ our calculations have resulted in a total of 11 colors that could be created\
    \ from just 1 color!\n\nTo see the effect of splitting this calculation, take\
    \ a look at [`https://gist.github.com/alexlibby/6fd1492781a08757c0112bb85c7a832a`](https://gist.github.com/alexlibby/6fd1492781a08757c0112bb85c7a832a)\
    \ . This shows the big calculation split into rheww separate entries. Notice how\
    \ `p:nth-child(3)` equals `p:nth-child(4)` – our code steps through each calculation,\
    \ using the results from the previous color change as the basis for the new one."
  trans: "\n### 操作颜色\n\n让我们开始创建演示示例：\n\n![../images/472539_1_En_4_Chapter/472539_1_En_4_Fig3_HTML.jpg](img/472539_1_En_4_Fig3_HTML.jpg)\n\
    \n图 4-3 – 在 SVG 图像中调整颜色\n\n1.  首先，从本书附带的代码下载中获取`colorfunctions`文件夹的副本，将其保存到我们的项目文件夹中。\n\
    \n2.  接着，新建一个文档并添加以下规则：\n\n    ```\n    @font-face { font-family: 'pt_sansregular';\
    \ src: url('../font/pt_sansregular.woff') format('woff'); font-weight: normal;\
    \ font-style: normal; }\n    body { font-family: 'pt_sansregular', sans-serif;\
    \ margin: 32px; width: 850px; }\n    ellipse { fill: lighten(#c6c6c6, 8); }\n\
    \    ```\n\n3.  将文件保存为`scss`文件夹中的`colorfunctions.scss`。\n\n4.  接下来，启动一个终端会话，将工作目录切换到项目区域下的`colorfunctions`文件夹。\n\
    \n5.  在提示符下，输入以下命令并按回车键：\n\n    ```\n    sass sass\\colorfunctions.scss css\\\
    colorfunctions.css\n    ```\n\n6.  如果一切顺利，我们应该会在`css`文件夹中看到`colorfunctions.css`文件以及一个源映射文件——预览结果会显示一个带有样式元素的简单模板页面，如图\
    \ 4-3 所示。\n\n这是一个非常基础的演示，旨在展示使用 Sass 颜色函数是多么简单。在这个例子中，我们使用了`fill:`属性，因为这是在处理 SVG\
    \ 图像时的必要操作；如果是针对标准 HTML 元素，我们完全可以改用`background-color`或`color`属性。我们的演示将初始值的亮度提高了\
    \ 8%，从`#c6c6c6`变为了`#dadada`——我们可以轻松将其指定为其他元素的新颜色，而无需创建会消耗资源的新变量。\n\n现在让我们更进一步，创建一个更实用的例子——比如为网站生成一个配色方案？是的，你没听错——这正是\
    \ Sass 大显身手的好机会；我们只需指定一种颜色，然后让 Sass 自动为我们生成其他所有颜色。\n\n更棒的是，我们甚至不需要自己计算目标颜色的数学公式——我们可以使用托管在[`http://razorltd.github.io/sasscolourfunctioncalculator/`](http://razorltd.github.io/sasscolourfunctioncalculator/)上的工具来帮我们完成转换。为了演示其工作原理，我们将使用\
    \ Color Palettes 网站（[`http://colorpalettes.net/`](http://colorpalettes.net/)）上的一个示例调色板，然后让\
    \ Sass 在编译过程中为我们生成颜色。\n\n### 第二部分 – 创建颜色\n\n让我们开始创建演示示例：\n\n![../images/472539_1_En_4_Chapter/472539_1_En_4_Fig4_HTML.jpg](img/472539_1_En_4_Fig4_HTML.jpg)\n\
    \n图 4-4 – 使用 Sass 创建调色板\n\n1.  首先，从本书附带的代码下载中获取并解压`palette`文件夹的副本，将其保存到我们的项目文件夹中。\n\
    \n2.  接下来，我们需要添加样式；为此，请新建一个文档。由于规则较多，我们将逐个代码块添加，先从一些基础样式开始：\n\n    ```\n    $basecolor:\
    \ #213451;\n    @font-face { font-family: 'pt_sansregular'; src: url('../font/pt_sansregular.woff')\
    \ format('woff'); font-weight: normal; font-style: normal; }\n    body { font-family:\
    \ 'pt_sansregular', sans-serif; margin: 32px; width: 850px; }\n    #palette {\
    \ margin-bottom: 15px; }\n    ```\n\n3.  基础样式设置完毕后，现在可以添加规则来设计每个色样：\n\n    ```\n\
    \    .swatch { height: 125px; width: 75px; display: inline-block;   margin-right:\
    \ 17px; }\n    .swlabel { border: 1px solid #bfbfbf; width: 75px; display: inline-block;\
    \ margin-right: 15px; margin-top: -15px; text-align: center; padding: 10px 0px\
    \ 10px 0;}\n    ```\n\n4.  为了给每个色样赋予颜色，我们需要在样式表中添加以下规则：\n\n    ```\n    .swatch:nth-child(1)\
    \ { background-color: $basecolor; }\n    .swatch:nth-child(2) {\n    background-color:\
    \ lighten(desaturate($basecolor, 22.27), 30.20);\n    }\n    .swatch:nth-child(3)\
    \ {\n    background-color: lighten(desaturate(adjust-hue($basecolor, 119), 15.54),\
    \ 52.55);\n    }\n    .swatch:nth-child(4) {\n    background-color: lighten(desaturate(adjust-hue($basecolor,\
    \ 114), 32.11), 73.73);\n    }\n    .swatch:nth-child(5) {\n    background-color:\
    \ lighten(saturate(adjust-hue(#213451, -131), 57.89), 4.90);\n    }\n    ```\n\
    \n5.  将文件保存为`scss`文件夹中的`palette.scss`。\n\n6.  接下来，启动一个终端会话，将工作目录切换到项目区域下的`palette`文件夹。\n\
    \n7.  在提示符下，输入以下命令并按回车键：\n\n    ```\n    sass sass\\palette.scss css\\palette.css\n\
    \    ```\n\n8.  如果一切顺利，我们应该会在`css`文件夹中看到`palette.css`文件以及一个源映射文件——预览结果会显示一个带有样式元素的简单模板页面，如图\
    \ 4-4 所示。\n\n尽管此演示中的 Sass 代码看起来可能很复杂，但实际上我们无需担心具体细节，因为大部分繁重的工作都是由我们在演示中使用的 Sass\
    \ 颜色函数工具完成的。不过，以这种方式创建调色板确实有一些非常实用的好处，所以让我们深入探讨，更详细地分析一下代码。\n\n### 详细拆解代码\n\n\
    传统创建调色板的方法通常包括选择颜色，然后决定哪些该用于何处，并希望在开发过程中能保持一致！（我敢肯定这听起来比实际情况更糟糕，但它确实是一种手动的、具有一定风险的方法。）\n\
    \n然而，当你刚开始使用 Sass 时，可能会倾向于将不同的颜色赋值给变量——比如用`$white`代表白色，用`$desaturatedblue`代表`#213451`。创建变量很繁琐——我们必须确保所有颜色都能相互协调，并且整体调色板看起来合理（同时符合品牌指南）。\n\
    \n相反，我们可以彻底颠覆这一思路——尽管有一大段代码用于设置每个色样，但我们在第 16 行只指定了一种基础颜色。虽然这看起来可能有些疯狂，但理由充分——我们对基础颜色进行变换，使其变成此演示中选定的每个调色板颜色。我们来看中间那个色样，它的颜色是这样设置的：\n\
    \n```\nbackground-color: lighten(desaturate(adjust-hue($basecolor, 119), 15.54),\
    \ 52.55);\n```\n\n……我们可以将其分解为以下几个部分：\n\n*   `adjust-hue($basecolor, 119)` – 这给了我们第一个中间色（或称为`color1`）；\n\
    \n*   `desaturate(color1, 15.54)` – 这得到了第二种颜色（或称为`color2`）；\n\n*   `lighten(color2,\
    \ 52.55)` – 这产生了我们最终的第三种颜色。\n\n在这个例子中，我们创建了 3 种可以独立使用的新颜色；但我们采用的是让 Sass 一步到位地根据基础颜色自动计算出`color3`。同样的原理也适用于我们为调色板创建的每一种颜色——经过计算，我们从仅仅\
    \ 1 种颜色中总共衍生出了 11 种颜色！\n\n要查看拆分这个计算过程的效果，请参阅[`https://gist.github.com/alexlibby/6fd1492781a08757c0112bb85c7a832a`](https://gist.github.com/alexlibby/6fd1492781a08757c0112bb85c7a832a)。该链接展示了将大型计算拆分成独立条目的结果。注意`p:nth-child(3)`如何等于`p:nth-child(4)`——我们的代码逐步执行每个计算，将前一次颜色变换的结果作为新变换的基础。\n"
- fmt: "### Assessing the Benefits from Using this Approach\n\nIt might seem a complex\
    \ way to create colors, but there are some good reasons for using this approach:\n\
    \n- We can always perform a search and replace, but what happens if our code uses\
    \ a slightly different spelling of a color or variable? The search and replace\
    \ may not pick it up, leading to unexpected effects in our code.\n- If a client\
    \ asks for a last-minute change, then you only have one value that needs updating;\
    \ everything else is worked out automatically during compilation.\n- We don’t\
    \ need to create variables for each color – although compiling a calculation such\
    \ as ours may take a few seconds more, we are not compiling code \"on-the-fly,\"\
    \ so we can live with the extra compiling time required.\n\nOf course, if we end\
    \ up with a monster style sheet (and I'm talking tens of thousands of lines),\
    \ then this extra compilation time may start to add up – if this is the case,\
    \ we may prefer to use variables instead.\n\nOkay – let's crack on: we've touched\
    \ on some of the functions available and explored how we might use them in a practical\
    \ context in our code. Although this introduces an element of dynamism to our\
    \ code, we're still limited in as much as our functions will result in one value\
    \ (as was the case in the last demo).\n\nWhat happens if we need to specify different\
    \ values, based on satisfying set conditions? Well, Sass can help here – it borrows\
    \ techniques from scripting language such as JavaScript to implement features\
    \ such as loops. It's an important part of the library that is well worth exploring,\
    \ so let's take a look at the features available that we can use to evaluate conditions\
    \ in our Sass code, in more detail.\n\n## Evaluating Conditions\n\n> *Decisions,\
    \ decisions – do we use this color, or another …? What about positioning that\
    \ content at the top of the page …?*\n\nOur lives are full of decisions that have\
    \ to be made – in most cases, we will make the right one, but sometimes we may\
    \ not! The same applies to styling content: we might choose a color that ends\
    \ up clashing with others used on the site, or a background color we apply ends\
    \ up making text illegible.\n\nOne of the key benefits of using Sass, though,\
    \ is that we can build in a certain amount of control to reduce these issues –\
    \ if the color of an element is particularly dark, then Sass can be told to select\
    \ a lighter color so our content remains legible.\n\nHow can we achieve this?\
    \ Well, it's time we met Sass's Control Directives and Expressions! This mouthful\
    \ of a name represents a group of functions that allow us to control which styles\
    \ are used and when – it's worth noting that they are intended more for use in\
    \ mixins, but can be used in day-to-day styling if required. Let's take a look\
    \ at each of them, beginning with the `@if` functions.\n\n### Applying `@if` and\
    \ `@if()`\n\nLet's say for argument's sake we had run into an issue of clashing\
    \ colors, caused as a result of insufficient contrast – how would we solve this\
    \ problem? Well, one way to solve it would, of course, be to replace the offending\
    \ color, but this is a manual task that requires effort. Instead, how about getting\
    \ Sass to choose for us?\n\nNo problem – Sass has two functions that can help\
    \ here: ironically both are called `@if`, but they each have different uses! The\
    \ first, `@if()`, takes this format: `if(true, 1px, 2px) => 1px` – it is used\
    \ to decide if we should apply the first value (`1px`), or choose `2px` if that\
    \ variable doesn't exist or might cause an error (such as divide by zero).\n\n\
    The second is more straightforward – we can use `@if` to decide if we include\
    \ a value or not, such as in this example: `@if 1 + 1 == 2 { border: 1px solid;\
    \ }`, which will render as true. If it had rendered as false, then the border\
    \ property simply wouldn't be set. Both can be a little tricky to fully understand,\
    \ so let's create a demo to explore how these two work in more detail.\n\n###\
    \ Using If Statements\n\nThe first step is to grab a copy of the download that\
    \ accompanies this book – once you have it, follow these steps:\n\n![../images/472539_1_En_4_Chapter/472539_1_En_4_Fig5_HTML.jpg](images/472539_1_En_4_Chapter/472539_1_En_4_Fig5_HTML.jpg)\n\
    \n**Figure 4-5**  \nUsing `@if...@else` statements\n\n1. We'll start by downloading\
    \ and extracting a copy of the example `condition` folder from the code download\
    \ that accompanies this book – go ahead and save it to our project folder.\n\n\
    2. Our demo doesn't contain the Sass styles needed to make it work – for this,\
    \ go ahead and create a new file, saving it as `condition.scss` in the `sass`\
    \ subfolder in the `condition` folder we saved in step 1.\n\n3. We have a few\
    \ style rules to add in, which we will add in block by block, starting with some\
    \ basic styles required to set up our demo:\n\n    ```\n    @font-face { font-family:\
    \ 'pt_sansregular'; src: url('../font/pt_sansregular.woff') format('woff'); font-weight:\
    \ normal; font-style: normal; }\n    body { font-family: 'pt_sansregular', sans-serif;\
    \ margin: 32px; font-size: 20px; }\n    li { padding: 20px 5px; margin: 10px;\
    \ color: white; width: 400px; list-style: none; }\n    ```\n\n4. Next up comes\
    \ the crux of our demo – we first specify three colors, which are defined by the\
    \ outcomes of three `if` statements:\n\n    ```\n    $first-color: if(true, antiquewhite,\
    \ black);\n    $second-color: if(false, black, slategrey);\n    $third-color:\
    \ if(4 > 2, silver, black);\n    ```\n\n5. We now need to add in the conditions\
    \ that determine some of the properties used in each of the four list items:\n\
    \n    ```\n    li:nth-of-type(1) {\n    background: $first-color;\n    @if (lightness($first-color)\
    \ > 75%) {\n    color: black;\n    } @else {\n    color: white;\n    }\n    }\n\
    \    li:nth-of-type(2) {\n    @if 1 + 1 == 2 { background: $second-color;  }\n\
    \    @if 5 > 3 { border: 3px dotted $third-color; width: 394px; }\n    @if true\
    \ { font-family: 'sans-serif'; }\n    }\n    li:nth-of-type(3) {\n    background:\
    \ $third-color;\n    @if (lightness($third-color) > 75%) {\n    color: black;\n\
    \    } @else {\n    color: white;\n    }\n    }\n    li:nth-of-type(4) {\n   \
    \ @if 1 + 1 == 2 { background: darken($second-color, 50%); }\n    @else if 1 +\
    \ 2 == 3 { background: $second-color; }\n    @else if 5 > 3{ border: 2px dotted\
    \ $third-color; }\n    }\n    ```\n\n6. Go ahead and save the file – next, fire\
    \ up a terminal session and change the working folder to the `condition` folder\
    \ under our project area.\n\n7. At the prompt, type the following command and\
    \ press Enter:\n\n    ```\n    sass sass\\condition.scss css\\condition.css\n\
    \    ```\n\n8. If all is well, we should see a `colorfunctions.css` file appear\
    \ in the `css` folder, along with a source map – previewing the results will show\
    \ a simple template page with styled elements, as indicated in Figure [4-5](#472539_1_En_4_Chapter.xhtml#Fig5).\n\
    \nAt first glance our demo looks very simple, with straightforward styling for\
    \ each list item. However, under the covers it hides a fair amount of decision\
    \ making that determines which color each list item should use! We've used two\
    \ key functions within this demo that are important to understand, so let's take\
    \ a few minutes to explore how they work in more detail."
