  trans: "\n### 引用父选择器\n\n让我们看看修改代码是多么简单：\n\n![../images/472539_1_En_3_Chapter/472539_1_En_3_Fig4_HTML.jpg](img/472539_1_En_3_Fig4_HTML.jpg)\n\
    \n图 3-4 – 更新导航演示\n\n1.  首先，从本书的代码下载中下载并解压 `parent` 文件夹的副本，并将其保存到我们的项目文件夹中。\n\n\
    2.  接着，打开 `parent.scss` 文件，在第 29 行附近找到以下代码行：\n\n    ```\n    a {\n    background-color:\
    \ #faebd7;\n    border: 1px solid #ccc;\n    color: #666;\n    ```\n\n3.  继续编辑\
    \ `a` 规则——我们将 `hover` 和 `focus` 声明嵌套在其中，如粗体所示：\n\n    ```\n    a {\n    background-color:\
    \ #faebd7;\n    border: 1px solid #ccc;\n    color: #666;\n    display: block;\n\
    \    padding: 6px 12px;\n    text-decoration: none;\n    font-size: 32px;\n  \
    \  &:hover, &:focus {\n    background-color: darken(#faebd7, 20%);\n    }\n  \
    \  &:active{ background-color: #666; border-color: #666; color: #efefef;   }\n\
    \    }\n    ```\n\n4.  接着，继续删除独立的 `active`、`hover` 和 `focus` 规则——我们应该只剩下嵌套在父 `a`\
    \ 规则中的那些规则，并且最后一行代码将是 `nav` 规则的右花括号。\n\n5.  将文件保存为 `scss` 文件夹中的 `parent.scss`。\n\
    \n6.  接下来，启动一个终端会话，并将工作文件夹切换到项目目录下的 `parent` 文件夹。\n\n7.  在提示符下，输入以下命令并按 Enter：\n\
    \n    ```\n    sass sass\\parent.scss css\\parent.css\n    ```\n\n8.  如果一切顺利，我们应该会在\
    \ `css` 文件夹中看到一个 `parent.css` 文件，以及一个源映射文件。\n\n9.  尝试在浏览器中预览结果——如果一切正常，它会显示一个包含样式化元素的简单框，如图\
    \ 3-4 所示。\n\n在嵌套时，这是一个需要理解的重要概念——如果处理不当或遗漏了与号，最好的情况是代码被破坏（但不太可能显示任何错误），最坏的情况则是编译失败。\n\
    \n关键是要记住包含占位符——我们可能无法立即获得正确的嵌套层级，但有了占位符，代码至少应该能正确编译！同时，让我们更详细地快速查看一下代码——你会看到它与之前的原则相同，只是新增了与号作为占位符。\n\
    \n### 深入探索我们的代码\n\n如果我们运行这个演示的完成版本，而没有看到我们所做的更改，那么你可能会认为它看起来与原始版本没有区别，这也是情有可原的！别担心——这是有意为之：这表明尽管我们对一些使用的类进行了嵌套修改，但测试显示我们的演示仍然能正确运行。\n\
    \n那么，我们更改了什么呢？实际上，这次的更改很小——我们将 `hover`、`focus` 和 `active` 伪选择器移到了父 `a` 规则内部。在每个实例中，我们都插入了一个与号，告诉\
    \ Sass 在编译此规则时引用父类；这会将其转换为与我们在原始嵌套演示中使用的相同有效的 CSS。\n\n## 应用 `@extend` 指令\n\n在开发过程中，经常会遇到这样的情况：我们决定先创建一个基类来样式化某个元素，然后添加后续类来涵盖基类的变体。设计警告消息就是一个很好的例子——我们的基类将包含创建外壳所需的样式，而变体（在样式、图标方面）则通过继承自基类的后续类来覆盖。\n\
    \n问题是，这种方法并非没有问题——这意味着我们至少要使用两个类，而不仅仅是一个；这会造成维护负担，并且在以后调试时可能会很棘手。问题是：我们能否解决这个问题？\n\
    \n当然可以——让我向你介绍 `extend` 关键字！该关键字的语法如下：\n\n```\n@extend .类名;\n```\n\n……它允许类与其他类共享一组属性。要使用它，我们需要在\
    \ CSS 规则中将扩展类的名称指定为声明，如下所示：\n\n```\n.类名 {\nborder: 1px solid black;\nfont-weight:\
    \ bold;\n}\n.foo {\n@extend .类名;\ncolor: #fcc;\n...\n}\n```\n\n在这个例子中，我们将得到两个类——`.foo`\
    \ 和 `.类名`——它们共享相同的 `font-weight` 和 `border` 属性。`.foo` 类还会有一个单独的 `color` 属性声明。\n\
    \n### 通过示例实践\n\n如果我们想减少对多个类的依赖，使用 `@extend` 是非常完美的选择；我们可以创建一个规则，让其他规则在编译期间继承它。\n\
    \n为了理解我的意思，请看这段示例代码：\n\n```\n.error {\nborder: 1px #f00;\nbackground-color: #fdd;\n\
    }\n.seriousError {\n@extend .error;\nborder-width: 3px;\n}\n```\n\n当编译时（使用诸如 Sassmeister\
    \ 之类的工具），我们得到如图 3-5 所示的 CSS。\n\n![../images/472539_1_En_3_Chapter/472539_1_En_3_Fig5_HTML.jpg](img/472539_1_En_3_Fig5_HTML.jpg)\n\
    \n图 3-5 – 编译 `@extend` 的结果\n\n看到第二个规则（`.seriousError`）是如何继承了第一个规则中定义的属性，同时又保留了自己规则中指定的属性了吗？这对于样式化共享相同属性的元素非常完美——我们为基类声明编写一个规则，然后在每个需要继承此规则并指定该规则特有附加属性的类中使用\
    \ `@extend`。\n\n这个特性可能有点难以理解其全部用途，所以让我们从一个演示开始，更详细地展示它的工作原理。\n\n### 一个实际示例\n\n\
    回想一下——还有人记得宝丽来相机吗？是的，在数码图像出现之前，宝丽来风靡一时：无需等待胶卷冲洗，拍摄后只需几分钟就能得到最终照片！\n\n宝丽来相机可能没有以前那么流行了，但这种效果依然存在——重现宝丽来效果（图像外观，而非显影过程！）非常容易。让我们看看如何利用\
    \ Sass 的强大功能及其 `@extend` 函数来实现这一点。\n"
- fmt: "### Extending sass Classes\n\nLet’s make a start on coding our demo:\n\n![../images/472539_1_En_3_Chapter/472539_1_En_3_Fig6_HTML.jpg](images/472539_1_En_3_Chapter/472539_1_En_3_Fig6_HTML.jpg)\n\
    \nFigure 3-6\n\nDisplaying images using `@extend`\n\n1. We’ll begin by downloading\
    \ and extracting a copy of the `extend` folder from the code download that accompanies\
    \ this book – go ahead and save the folder to our project folder.\n\n2. Next,\
    \ go ahead and open your text editor – we have a whole bunch of styles to add\
    \ to our demo! We’ll add them block by block, beginning with some basic styles\
    \ for our demo:\n\n    ```\n    %imgeffect {\n    height: 20%;\n    width: 47%;\n\
    \    bottom: 30px;\n    right: 12px;\n    box-shadow: 0 33.6px 32px rgba(0,0,0,0.4);\n\
    \    }\n    @font-face {\n    font-family: 'pt_sansregular';\n    src: url('../font/pt_sansregular.woff')\
    \ format('woff');\n    font-weight: normal;\n    font-style: normal;\n    }\n\
    \    * {\n    box-sizing: border-box;\n    }\n    body {\n    font-family: 'pt_sansregular',\
    \ sans-serif;\n    margin: 32px;\n    }\n    ```\n\n3. This next block adds a\
    \ set of styles common to each of the polaroid effect images:\n\n    ```\n   \
    \ .polaroid {\n    background: #fff;\n    padding: 16px;\n    box-shadow: 0 3.2px\
    \ 19.2px rgba(0,0,0,0.2);\n    }\n    .polaroid > img {\n    max-width: 100%;\n\
    \    height: auto;\n    }\n    .caption {\n    font-size: 28px;\n    text-align:\
    \ center;\n    line-height: 32px;\n    }\n    ```\n\n4. We now need to style each\
    \ of the images we’ve added using the Polaroid effect – this adds the initial\
    \ grayscale effect and rotates the images off their horizontal position:\n\n \
    \   ```\n    .item {\n    width: 30%;\n    display: inline-block;\n    filter:\
    \ grayscale(100%);\n    }\n    .item .polaroid:before {\n    content: \";\n  \
    \  position: absolute;\n    z-index: -1;\n    transition: all 0.35s;\n    }\n\
    \    .item:nth-of-type(4n+1) {\n    transform: scale(0.8, 0.8) rotate(5deg);\n\
    \    }\n    .item:nth-of-type(4n+1) .polaroid:before {\n    @extend %imgeffect;\n\
    \    transform: rotate(6deg);\n    }\n    .item:nth-of-type(4n+2) {\n    transform:\
    \ scale(0.8, 0.8) rotate(-5deg);\n    }\n    .item:nth-of-type(4n+2) .polaroid:before\
    \ {\n    @extend %imgeffect;\n    transform: rotate(-6deg);\n    }\n    .item:nth-of-type(4n+3)\
    \ {\n    transform: scale(0.8, 0.8) rotate(-3deg);\n    }\n    .item:nth-of-type(4n+3)\
    \ .polaroid:before {\n    @extend %imgeffect;\n    transform: rotate(-4deg);\n\
    \    }\n    ```\n\n5. This final set of rules applies a rotation and scaling effect\
    \ when we hover over each image; we also tweak the size and box-shadow effect\
    \ at the same time:\n\n    ```\n    .item:hover {\n    filter: none;\n    transform:\
    \ scale(1, 1) rotate(0deg);\n    transition: all 0.35s;\n    }\n    .item:hover\
    \ .polaroid:before {\n    z-index: -1;\n    transform: rotate(0deg);\n    height:\
    \ 90%;\n    width: 90%;\n    bottom: 0%;\n    right: 5%;\n    box-shadow: 0 16px\
    \ 48px rgba(0,0,0,0.2);\n    transition: all 0.35s;\n    }\n    ```\n\n6. Save\
    \ the file as `extend.scss` in the `scss` folder.\n\n7. Next, fire up a terminal\
    \ session and change the working folder to the `extend` folder under our project\
    \ area.\n\n8. At the prompt, type the following command and press Enter:\n\n \
    \   ```\n    sass sass\\extend.scss css\\extend.css\n    ```\n\n9. If all is well,\
    \ we should see a `extend.css` file appear in the `css` folder, along with a source\
    \ map – previewing the results will show our three images styled as Polaroids,\
    \ with the center one in mid-hover (Figure [3-6](#472539_1_En_3_Chapter.xhtml#Fig6)).\n\
    \nThis demo is something of trip down memory lane – this CSS styling effect has\
    \ been around for a few years. However, there is a little bit of a sting in this\
    \ tale though: before we discover what it is, let’s take a look at how our code\
    \ works in more detail.\n\n### Dissecting Our Code in Detail\n\nOur Polaroid-inspired\
    \ demo contains what at first glance looks like a good chunk of styling code,\
    \ but in reality, much of this is used to style each image. There are two key\
    \ declarations that we should explore, though, which use Sass and help make our\
    \ demo come to life. They are the extend block:\n\n```\n%imgeffect {\nheight:\
    \ 20%;\nwidth: 47%;\nbottom: 30px;\nright: 12px;\nbox-shadow: 0 33.6px 32px rgba(0,0,0,0.4);\n\
    }\n```\n\n... and the three declarations where we make use of this extend:\n\n\
    ```\n.item:nth-of-type(4n+1) .polaroid:before {\n@extend %imgeffect;\ntransform:\
    \ rotate(6deg);\n}\n.item:nth-of-type(4n+2) .polaroid:before {\n@extend %imgeffect;\n\
    transform: rotate(-6deg);\n}\n.item:nth-of-type(4n+3) .polaroid:before {\n@extend\
    \ %imgeffect;\ntransform: rotate(-4deg);\n}\n```\n\nIf we were to compile this\
    \ into valid CSS, we would end up with the code shown in Figure [3-7](#472539_1_En_3_Chapter.xhtml#Fig7).\n\
    \n![../images/472539_1_En_3_Chapter/472539_1_En_3_Fig7_HTML.jpg](images/472539_1_En_3_Chapter/472539_1_En_3_Fig7_HTML.jpg)\n\
    \nFigure 3-7\n\nCompiling code from our `@extend` demo\n\nIn our demo, we’ve specified\
    \ our initial extend in lines 1 to 7; this contains a standard set of CSS properties,\
    \ which are used in each Polaroid effect. The extend is called as part of defining\
    \ the three `.item:nth-of-type()` declarations , one for each instance of the\
    \ Polaroid effect. Figure [3-7](#472539_1_En_3_Chapter.xhtml#Fig7) shows a screenshot\
    \ of two instances of our `item:nth-of-type()` declarations compiled in Sassmeister\
    \ as an example of how it will look, where we can indeed see the common class\
    \ displayed before the additional variations.\n\nTry it for yourself using the\
    \ online tool at [Sassmeister.​com](http://sassmeister.com) – I’ve not included\
    \ the third instance as only two is enough to show the effect of using the extend\
    \ function.\n\nSome of you may have spotted something from earlier in this chapter,\
    \ where we talked about both the base class *and the extended class* being present.\
    \ I don’t see the base class present, although in theory it should be displayed\
    \ – why isn’t it?"
