  trans: '

    # 熟悉关键术语


    在本书的课程中，我们将接触到大量与 Sass 搭配使用的不同技术和关键术语——有些很容易上手，而另一些则可能需要花更多时间！


    我们已经遇到了最重要的一个——编译过程。对我们来说，这与其说是理解其内部运行机制（可以说它就像一个神奇的黑匣子），不如说是要了解我们能做什么——例如，如果我们要创建一组按钮，我们可以编写代码来自动完成大部分工作，然后由
    Sass 将其编译（或转换）为有效的 CSS 代码。


    然而，编译并非我们涉及的唯一概念——Sass 有许多关键术语，我们将在本书中逐一探索。尽管目前这些术语可能还毫无意义，但我想在此总结其中一些关键术语，以便你能对书中后续内容有所期待。我还会附上相关的章节编号，这样如果你遇到困难，就知道应查阅哪一章寻求帮助：


    *   **注释**——这是 Sass 中最简单的技术之一；它的使用方式与普通 CSS 完全相同。使用注释的关键在于你所用的注释类型——例如，单行注释在编译时会被移除，而多行注释则会保留。我们将在第
    2 章“添加注释”一节中更详细地介绍这一点。


    *   **变量**——可以将其视为值的占位符；Sass 会查找特定变量的每个实例，并将其替换为我们最初设置的真实值。无论我们在代码中有多少个特定变量的实例，Sass
    都会将它们全部替换！我们将在第 2 章“在实际环境中创建变量”一节中深入讨论这个主题。


    *   **混合**——变量是一个好的开始，但如果我们想以同样的方式定义更大的代码块呢？混合（mixins）应运而生——它们充当预定义的代码块，我们可以直接将其“混合”到代码中。我们可以定义一次，然后在多个项目中重复使用——请参阅第
    2 章，了解更多关于这项实用技术的信息。


    *   **导入与局部文件**——如果你曾经处理过大型电子表格（比如像 WordPress 那样超过 4500 行的庞然大物），那么你一定会深切体会到管理这么多行代码有多么痛苦。Sass
    有一个 `@import` 函数，类似于 CSS；我们可以用它创建 CSS 代码的局部文件或片段，然后将其导入到主样式表中。我们将在第 2 章及后续章节介绍这一点。


    *   **嵌套**——你曾有多少次为菜单系统之类的东西编写 CSS 代码，结果发现自己重复编写了多个样式？有了 Sass，我们可以将样式嵌套在另一个样式之内——可以将其视为将样式分组在一起，放在一个所有样式都通用的基础样式内部。从某种意义来说，这是一种简写形式，使得代码更易于阅读——我们将在第
    3 章“创建嵌套样式”中介绍这一点。


    *   **继承**——这稍微有点棘手：与其多次重写具有相似属性的代码块，不如让一个代码块继承另一个？一个完美的例子是创建按钮——我们可以编写基础样式规则来涵盖尺寸和字体等属性。我们创建的任何按钮都可以继承这个基础样式，再加上我们为每个按钮指定的特定样式（比如颜色）。这是一项值得学习的好技术，但需要时间才能真正掌握——我们将在第
    3 章“创建嵌套样式”中开启这段学习之旅。


    *   **运算符**——我猜想在很多情况下，你可能会在电子表格中指定固定值，比如为 `font-size` 属性指定 `16px`，对吧？如果我们能仅使用加、减等简单运算来动态计算出值呢？例如，我们不再需要指定一整组调色板值——只要我们有一个，就可以使用一点数学运算来自动计算出互补色。我将在第
    4 章“使用运算计算值”中揭示其原理以及更多内容。


    *   **指令**——这才是真正有趣的地方！CSS 已经有一些 `@-` 规则；Sass 在此基础上增加了一些，如 `@extend` 或 `@media`。可以将这些视为帮助控制
    Sass 代码中流程和逻辑的规则——`@media` 就是一个很好的例子，我们用它来指定在响应式网站开发中应应用哪些规则。我们将深入探讨第 4 章“使用运算计算值”中的指令世界。


    呼——我们即将面对一系列激动人心的技术！当然，我们不必一次性掌握所有内容——Sass 的妙处在于我们可以从简单的技术（比如设置变量）开始，然后在开发样式表的过程中逐步利用更多的工具。不过，在我们踏上这段旅程之前，有一个主题我知道对
    Sass 新手来说将是最有益处的——如果某些东西不起作用或者我卡住了，我可以在哪里获得帮助？

    '
- fmt: "# Getting Help\n\n*“Help! Why is my mixin not performing as it should …?”*\n\
    \nAlthough Sass is relatively easy to learn, there will come a time when you need\
    \ help – sure, there are lots of people online who have written about Sass, but\
    \ sometimes it helps to have someone get you out of that sticky problem! Don’t\
    \ worry – there are several ways of getting help; they include the following:\n\
    \n*   If you’re stuck on something, and am struggling to get it working, then\
    \ your first port of call should be the StackOverflow site, at [`https://stackoverflow.com`](https://stackoverflow.com).\
    \ This is managed by a community of volunteers, where anyone can post a question;\
    \ I would strongly recommend reading the guidelines available at [`https://stackoverflow.com/help/`](https://stackoverflow.com/help/)\
    \ to help improve the likelihood of getting a response that helps solve your issue.\n\
    \nIt’s also worth running a quick search to see if anyone else has come across\
    \ the same issue – try [`https://stackoverflow.com/search?q=Dart+Sass`](https://stackoverflow.com/search?q=Dart+Sass);\
    \ you never know, someone may already know the answer! Please be patient though:\
    \ it is a volunteer operation, so you may not get a response quickly.\n\n*   If,\
    \ however, you think you’ve identified a bug, where behavior is not working as\
    \ advertised or a core function is clearly faulty, then GitHub is a good place\
    \ to report them. The GitHub site for Dart Sass is at [`https://github.com/sass/dart-sass`](https://github.com/sass/dart-sass)\
    \ – make sure you get the right one though, as the Sass team run several GitHub\
    \ site for different versions of Sass.\n\nIf you do need to raise an issue, it\
    \ can seem a little daunting if you’ve not done it before. It’s worth noting that\
    \ GitHub sites are often maintained by volunteers who have seen issues before,\
    \ and they are always willing to help. There are some useful tips you can follow\
    \ to help with the process of logging an issue:\n    *   Do have a good look through\
    \ past issues – it is possible (although not always) that someone has already\
    \ logged a similar problem, which may help you, without the need to raise one\
    \ yourself.\n\n*   Do add a title and description, and be as detailed as you can\
    \ about the issue – include screenshots, steps to reproduce, what you’ve tried\
    \ so far, and the results, but don’t write an encyclopedia! GitHub volunteers’\
    \ time is precious, so keeping it detailed but concise is essential.\n\n*   Please\
    \ be polite and courteous when posting – GitHub sites are run by volunteers who\
    \ have families and paid jobs, and who are less likely to help you if you are\
    \ rude. If you treat them with respect, then they will only be too happy to help\
    \ guide you.\n\n*   If you’ve discovered something that you consider to be a bug,\
    \ but the response is that it is “by design,” then please respect their decision.\
    \ If however you feel strongly, then politely present your case, with detail,\
    \ and be willing to discuss the merits of your points. Maintainers can’t cater\
    \ for all circumstances and will always consider new evidence, but they won’t\
    \ be willing to help if you are abusive or rude. Equally, if a maintainer has\
    \ reviewed your request but come to the decision that no changes should be made,\
    \ then please respect their decision.\n\n*   Please allow a reasonable amount\
    \ of time before chasing a response – people may have other commitments, or time\
    \ differences may get in the way; you need to allow for this when posting issues.\n\
    \n*   Always try to respond quickly if suggestions have been made to help you;\
    \ no one likes responding to an issue only to find you can’t be bothered to try\
    \ things out!\n\nI could go on, but most of these guidelines can really be summarized\
    \ into three key points: always be polite and respectful, make sure you have sufficient\
    \ detail around your issue, and respond in a timely manner when appropriate. As\
    \ long as you follow these guidelines, then plenty of people will be willing to\
    \ help pass on their knowledge to someone who is just starting out in to the world\
    \ of Sass.\n\nAs an aside, you will see similar guidelines on the Sass site, at\
    \ [`http://sass-lang.com/community-guidelines`](http://sass-lang.com/community-guidelines).\n\
    \n## Summary\n\nThe discovery and exploring of a technology for the first time\
    \ can open up some real possibilities – this particularly applies to the world\
    \ of Sass! We’ve covered some useful tips and tricks in the first part of our\
    \ voyage through Sass, so let’s take a moment to recap what we’ve learned.\n\n\
    We kicked off with an introduction to Sass as a technology, exploring what it\
    \ is, and the reasons why we might want to use it in our projects. We then covered\
    \ some of the different versions and syntaxes associated with Sass, before making\
    \ sure we were clear on the one we’ll use in this book.\n\nNext up came the initial\
    \ installation of Sass; we saw how easy it was to compile our first file, before\
    \ exploring what happens during the compilation process. We then moved onto looking\
    \ at setting up a suitable workflow to get the best out of using Sass, before\
    \ covering how to automate the compilation process, so we can spend time on more\
    \ important tasks. We then rounded out the chapter with a quick look at some of\
    \ the key terms we’ll cover throughout this book and how to get help, in case\
    \ we get stuck.\n\nPhew – it’s a good start, but there is so much more to cover!\
    \ In the next chapter we’ll begin to really get stuck into using Sass; our first\
    \ port of call will be to learn how creating variables and mixins can help reduce\
    \ the amount of code and simplify the process of keeping values updated. All aboard\
    \ folks – the ship is about to depart…\n\n# 2. Introducing Variables and Mixins\n\
    \n> *It’s late on Friday, you’ve had a busy week and are looking forward to finishing\
    \ up for the day. In your mind, you can see a welcoming cold drink with your name\
    \ all over it, waiting for you at home ... except your boss enters the office,\
    \ and judging by the look on his face, any thought of finishing on time is rapidly\
    \ disappearing out the window. ...*\n\nI’ll bet this scenario sounds all too familiar:\
    \ customers who – shall we say, are challenging? – aren’t happy with a design,\
    \ and want to try changing the color scheme. However, their site is really complicated,\
    \ with different colors in use throughout the style sheet. Sure, you can do a\
    \ search and replace, but do you really want to have to wade through thousands\
    \ of lines of code to make sure you’ve changed all of the colors ...?"
