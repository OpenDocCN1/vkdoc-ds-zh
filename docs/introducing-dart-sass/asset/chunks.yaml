  trans: "\n# 未来变化\n\n随着我们的项目正式启动，接下来要回答的问题是：下一步该往哪走……？\n\n我们可以考虑一系列变化——唯一限制我们的只有想象力和项目需求！由于\
    \ Sass 是 CSS 的超集，这意味着我们可以随心所欲地将 CSS 代码部分或全部转换为 Sass 代码。一旦完成初期繁重的转换工作，我们就可以根据需要添加新样式——以下这些想法可以作为起步参考：\n\
    \n*   我们可以考虑使用更多带命名空间的属性——看看下面这段从 `fontdetail` 混入中摘取的代码：\n\n    ```\n    font:\
    \ {\n    size: $size;\n    weight: $weight;\n    }\n    ```\n\n    我们已经在整个演示中使用了\
    \ `padding` 和 `margin`，或许在命名空间方面还有进一步发挥的空间？\n\n*   一种更高效的色彩写法是使用 Sass 的映射（map）——这样我们可以将同一颜色的不同色调分组编码，使代码编写更高效。不过我们应该更进一步：当为颜色变量命名时，采用通用格式，例如\
    \ `$border-blue-light`（从通用到具体）。这样更便于分组、便于编辑器智能提示颜色名、也便于理解这些颜色在代码中的使用位置。\n\n* \
    \  我们可以研究如何添加诸如信用卡或安全标志之类的图片——有多个工具可集成到我们的 `Gulpfile.js` 脚本中，为图片生成对应的 Sass 代码。\n\
    \n*   在这个演示中，我们并没有真正使用外部库——但这并不意味着我们不应该使用；例如使用 Scut 库（[`https://davidtheclark.github.io/scut/font-face.html`](https://davidtheclark.github.io/scut/font-face.html)）来处理\
    \ `variables.scss` 局部文件中用到的 `@font-face` 代码？\n\n*   有人还记得使用 `rem` 单位代替像素吗？为了方便，我们全程使用了像素值，但如果您对\
    \ `rem` 单位情有独钟，Sass 可以轻松通过混入来添加这些单位。在 [Google.com](http://google.com) 上搜索“sass\
    \ mixin for rem units”——会有大量示例！\n\n*   我们甚至可以添加媒体断点来让页面更具响应性——Sass 原生支持 `@media`\
    \ 查询（甚至可以嵌套使用）；[Medium.com](http://medium.com) 上有一篇很有用的文章，介绍了如何使用 Sass 实现断点，链接为\
    \ [`https://medium.com/codeartisan/breakpoints-and-media-queries-in-scss-46e8f551e2f2`](https://medium.com/codeartisan/breakpoints-and-media-queries-in-scss-46e8f551e2f2)。\n\
    \n*   我们为数量按钮定义了基础样式 `.qt`——这虽然效果不错，但迫使我们分配两种样式。不妨考虑使用 `@extend` 函数创建一个基础样式，然后将其扩展为我们所需的加号或减号按钮样式？\n\
    \n以上仅是使用 Sass 时可能出现的一些想法——当然，我们的想象力才是唯一的限制！希望这能让你了解在大型真实项目中使用 Sass 的体验；只要你认真规划、采用迭代方式转换代码、做出明智的选择，那么在将现有项目改造为使用\
    \ Sass 的过程中应该不会遇到太多问题。\n\n## 总结\n\n在本书中，我们涵盖了 Sass 中大量不同的特性——从简单的变量到构建混入、再到使用条件逻辑控制输出。在本章中，我们通过一个真实项目将这些特性融会贯通——我们的购物车或许拿不了任何奖项，但总得有个起点！全书我们分享了大量实用技巧，现在让我们花点时间回顾一下本章所学内容。\n\
    \n我们首先概述了本章项目的具体细节，随后快速转向开发环境的搭建和 HTML 标记的安装。\n\n接下来，我们探索了为项目创建样式的过程——我们逐步完成了两个导入局部文件，然后组装了主样式表。最后，我们通过简要介绍使购物车生效所需的\
    \ jQuery 代码将所有内容整合在一起，接着运行编译过程，并在浏览器中查看成果。\n\n呼——真是段激动人心的旅程！我们在本书中涵盖了很多内容；希望你觉得它有用，并且能像我享受写作此书一样享受使用\
    \ Sass 的过程！\n\n### 索引\n\n#### A\n\n变量赋值，Sass\n\n#### B\n\n布尔运算符 盒阴影效果\n\n####\
