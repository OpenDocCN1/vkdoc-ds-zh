- fmt: "### Making a Choice\n\nI’m sure the question on everyone’s mind is this: With\
    \ all of those options, how do I choose which one to use?\n\nThe short but simple\
    \ answer is this: it depends. I know this might sound like a cop-out, but there\
    \ is no right or wrong answer to how Sass should be compiled. It all depends on\
    \ what you already have installed, what you feel comfortable using, and (to a\
    \ lesser extent) which platform you use.\n\nFor example, if you prefer using a\
    \ visual approach, then using one of the editors with dedicated support (such\
    \ as Prepos), then this will work fine. However, if you happen to use Node.js,\
    \ then it makes sense to consider adapting your workflow to incorporate a step\
    \ for compiling Sass. You might equally not want to have to install anything extra\
    \ at all – in this case, using a terminal approach is the simplest route (and\
    \ doesn’t require installing!). The key point being though is that there are plenty\
    \ of ways of editing Sass – don’t be afraid to try out different applications\
    \ until you find one that you like and works well for you.\n\nFor the purposes\
    \ of this book, I will use the terminal approach to keep things simple and the\
    \ focus on Sass code, not the compiling process – please feel free to switch to\
    \ using a visual editor if you prefer to use this option.\n\nOkay – let’s move\
    \ on; there is another part of this process we should consider. Remember how I\
    \ said it can be a pain to have to recompile code manually all of the time? Well,\
    \ we can automate the process using a task runner such as Gulp – let’s take a\
    \ look at what is involved in more detail.\n\n## Automating the Process\n\nAlthough\
    \ compiling Sass code manually is fine for light development, it will soon become\
    \ a pain for anything much larger! Surely there has to be a better way to do this\
    \ … absolutely – we could use a dedicated application such as Koala or Prepos,\
    \ or even compile directly in the browser, using SassMeister. However, it will\
    \ become tedious when switching between applications; it also opens the risk of\
    \ making mistakes in our code!\n\nThere is an alternative: Why not *automate*\
    \ the compilation process? Sure, it’s not essential for developing Sass code,\
    \ but creating something that can deal with low-value tasks, such as compiling,\
    \ presents several benefits:\n\n* We can set it up to run in the background –\
    \ any changes we make to code will be compiled automatically for us;\n* We can\
    \ link in other tasks as part of the process, such as compressing JavaScript files\
    \ or adding vendor prefixes to style rules;\n* It removes the need for us to be\
    \ involved in tasks of low value, allowing us to spend more time on important\
    \ matters.\n\nWith this in mind, our next exercise will set up an automatic compilation\
    \ process using Gulp and the `gulp-dart-sass` package, the latter of which is\
    \ a wrapper for the Dart Sass library. Once installed and running, this will then\
    \ happily sit running in the background; as soon as changes to a Sass file are\
    \ noted, it will automatically compile them into a valid CSS style sheet file.\
    \ Let’s take a look at what is involved in more detail.\n\n### Automating Process\n\
    \nTask runners such as Gulp need to be installed using the Node.js runtime environment\
    \ – this is available for the Windows, Mac, and Linux platforms, with binaries\
    \ available for others. We have a few steps to run through, so let’s make a start:\n\
    \n![../images/472539_1_En_1_Chapter/472539_1_En_1_Fig7_HTML.jpg](images/472539_1_En_1_Chapter/472539_1_En_1_Fig7_HTML.jpg)\n\
    \nFigure 1-7\n\nInstalling our packages\n\n1. The first step is to install Node.js\
    \ – for this, head over to [`https://nodejs.org`](https://nodejs.org), and download\
    \ the version appropriate for your platform. If prompted, accept all defaults;\
    \ this is sufficient for the purposes of this exercise.\n\n2. Once installed,\
    \ fire up a terminal session and enter this command to confirm Node and NPM have\
    \ been successfully installed:\n\n   ```\n   node –v && npm –v\n   ```\n\n   If\
    \ all is well, Node will return `v8.11.3` or higher, and NPM (Node’s package manager)\
    \ will display `5.6.0` or higher.\n\n3. Next, run this command at the prompt –\
    \ it turns off the creation of `package-lock.json` files, which are a new feature\
    \ of NPM version 5 or above, but are not needed for the demos in this book:\n\n\
    \   ```\n   npm config set package-lock false\n   ```\n\n4. Now go ahead and extract\
    \ a copy of the `automate` folder to your project area.\n\n5. We have a few things\
    \ to install, so for this, fire up terminal session, and first run this command\
    \ – this will install dependencies for Gulp:\n\n   ```\n   npm install –g gulp-cli\n\
    \   ```\n\n6. Once completed, go ahead and run this command at the prompt – this\
    \ will install the remaining packages (Sass, Gulp, Sourcemap support and Autoprefixer\
    \ for Gulp – a PostCSS tool, but works fine with standard CSS) listed in the `package.json`\
    \ file we copied over in the `automate` folder, as shown in Figure [1‑7](#472539_1_En_1_Chapter.xhtml#Fig7).\n\
    \n   ```\n   npm install\n   ```\n\nThe warnings about `fsevents` and deprecated\
    \ packages can be ignored for the purposes of this exercise.\n\nAt this stage,\
    \ our automated process is set up; let’s put it to the test by editing our test\
    \ file, and watch it compile. For this next step, I would recommend having the\
    \ `sass` and `css` folders open on screen, along with our terminal session:\n\n\
    1. Take a look inside the `css` folder – you will now see a newly compiled style\
    \ sheet and `map` folder, which contains our source map file.\n\n2. Go ahead and\
    \ enter `gulp` at the prompt, then press Enter.\n\n3. The initial default task\
    \ is run – this can be ignored. Open `test.scss` in the `sass` folder, and change\
    \ the hex code assigned to `$primary-color` to `#dcdcdc` (a light gray color).\n\
    \n4. Save the change – if all is well, Gulp’s watch facility will kick in and\
    \ automatically recompile our code, as shown in Figure [1‑8](#472539_1_En_1_Chapter.xhtml#Fig8).\n\
    \n   ![../images/472539_1_En_1_Chapter/472539_1_En_1_Fig8_HTML.jpg](images/472539_1_En_1_Chapter/472539_1_En_1_Fig8_HTML.jpg)\n\
    \n   Figure 1-8\n\n   Recompiling our code automatically\n\nHopefully that wasn’t\
    \ too painful – it may seem like a good few steps, but it opens up a host of possibilities\
    \ for later development. That aside, our process covers a number of key points\
    \ that we should be aware of, so let’s dive in and break down what happened in\
    \ more detail."
