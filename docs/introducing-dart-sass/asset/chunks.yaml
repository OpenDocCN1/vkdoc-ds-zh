    \n*   Always try to respond quickly if suggestions have been made to help you;\
    \ no one likes responding to an issue only to find you can’t be bothered to try\
    \ things out!\n\nI could go on, but most of these guidelines can really be summarized\
    \ into three key points: always be polite and respectful, make sure you have sufficient\
    \ detail around your issue, and respond in a timely manner when appropriate. As\
    \ long as you follow these guidelines, then plenty of people will be willing to\
    \ help pass on their knowledge to someone who is just starting out in to the world\
    \ of Sass.\n\nAs an aside, you will see similar guidelines on the Sass site, at\
    \ [`http://sass-lang.com/community-guidelines`](http://sass-lang.com/community-guidelines)\
    \ .\n\n## Summary\n\nThe discovery and exploring of a technology for the first\
    \ time can open up some real possibilities – this particularly applies to the\
    \ world of Sass! We’ve covered some useful tips and tricks in the first part of\
    \ our voyage through Sass, so let’s take a moment to recap what we’ve learned.\n\
    \nWe kicked off with an introduction to Sass as a technology, exploring what it\
    \ is, and the reasons why we might want to use it in our projects. We then covered\
    \ some of the different versions and syntaxes associated with Sass, before making\
    \ sure we were clear on the one we’ll use in this book.\n\nNext up came the initial\
    \ installation of Sass; we saw how easy it was to compile our first file, before\
    \ exploring what happens during the compilation process. We then moved onto looking\
    \ at setting up a suitable workflow to get the best out of using Sass, before\
    \ covering how to automate the compilation process, so we can spend time on more\
    \ important tasks. We then rounded out the chapter with a quick look at some of\
    \ the key terms we’ll cover throughout this book and how to get help, in case\
    \ we get stuck.\n\nPhew – it’s a good start, but there is so much more to cover!\
    \ In the next chapter we’ll begin to really get stuck into using Sass; our first\
    \ port of call will be to learn how creating variables and mixins can help reduce\
    \ the amount of code and simplify the process of keeping values updated. All aboard\
    \ folks – the ship is about to depart…\n\n# 2. Introducing Variables and Mixins\n\
    \n> *It’s late on Friday, you’ve had a busy week and are looking forward to finishing\
    \ up for the day. In your mind, you can see a welcoming cold drink with your name\
    \ all over it, waiting for you at home ... except your boss enters the office,\
    \ and judging by the look on his face, any thought of finishing on time is rapidly\
    \ disappearing out the window. ...*\n\nI’ll bet this scenario sounds all too familiar:\
    \ customers who – shall we say, are challenging? – aren’t happy with a design,\
    \ and want to try changing the color scheme. However, their site is really complicated,\
    \ with different colors in use throughout the style sheet. Sure, you can do a\
    \ search and replace, but do you really want to have to wade through thousands\
    \ of lines of code to make sure you’ve changed all of the colors ...?"
  trans: "\n# 获取帮助\n\n*“救命！为什么我的混合宏没有按预期运行……？”*\n\n尽管 Sass 相对容易学习，但总会有需要帮助的时候——当然，网上有很多人写过关于\
    \ Sass 的文章，但有时有人帮你解决棘手问题会更有帮助！别担心——有几种获取帮助的方式；其中包括：\n\n*   如果你在某件事上卡住了，努力让它运行起来，那么你的首选应该是\
    \ StackOverflow 网站，地址是 [`https://stackoverflow.com`](https://stackoverflow.com)。该网站由志愿者社区管理，任何人都可以在此提问；我强烈建议阅读\
    \ [`https://stackoverflow.com/help/`](https://stackoverflow.com/help/) 上的指南，以提高获得有助于解决问题的回复的可能性。\n\
    \n另外，值得快速搜索一下，看看是否有其他人遇到过同样的问题——试试 [`https://stackoverflow.com/search?q=Dart+Sass`](https://stackoverflow.com/search?q=Dart+Sass)；说不定已经有人知道答案了！不过请耐心等待：这是一个志愿者运营的平台，因此你可能不会很快得到回复。\n\
    \n*   然而，如果你认为自己发现了一个 Bug，即某个行为无法按预期工作或核心功能明显出错，那么 GitHub 是一个很好的报告地点。Dart Sass\
    \ 的 GitHub 仓库地址是 [`https://github.com/sass/dart-sass`](https://github.com/sass/dart-sass)——但请确保找对地方，因为\
    \ Sass 团队为不同版本的 Sass 运行着多个 GitHub 仓库。\n\n如果你确实需要提交一个问题，而此前从未做过，可能会觉得有些令人生畏。值得注意的是，GitHub\
    \ 仓库通常由志愿者维护，他们之前见过类似问题，并且总是愿意提供帮助。你可以遵循一些有用的建议来帮助完成记录问题的流程：\n    *   务必仔细查阅过往的问题——有可能（尽管并非总是如此）已经有人记录了类似的问题，这可能对你有帮助，而无需你自己再提交一个问题。\n\
    \n*   务必添加标题和描述，并尽可能详细地描述问题——包括截图、重现步骤、你迄今为止尝试过的方法以及结果，但不要写成长篇大论！GitHub 志愿者的时间很宝贵，因此详细但简洁至关重要。\n\
    \n*   发帖时请彬彬有礼——GitHub 仓库由志愿者运营，他们有自己的家庭和有偿工作，如果你态度粗暴，他们不太可能提供帮助。如果你尊重他们，他们会非常乐意为你提供指导。\n\
    \n*   如果你发现了一个你认为的 Bug，但回复说这是“设计如此”，那么请尊重他们的决定。然而，如果你强烈反对，请礼貌地陈述你的情况，附带细节，并愿意讨论你观点的合理性。维护者无法满足所有情况，他们会始终考虑新的证据，但如果你辱骂或无礼，他们就不愿意提供帮助。同样，如果维护者审查了你的请求但决定不做任何更改，请尊重他们的决定。\n\
    \n*   在催促回复之前，请留出合理的时间——人们可能有其他承诺，或者时差可能会造成阻碍；你在提交问题时需要考虑这一点。\n\n*   如果有人提出了帮助你解决问题的建议，请务必尽快回复；没有人喜欢回复一个问题，却发现你懒得尝试！\n\
    \n我可以继续列举，但这些指南大部分都可以概括为三个关键点：始终保持礼貌和尊重，确保问题描述足够详细，并在适当的时候及时回复。只要你遵循这些指南，就会有很多人愿意将自己的知识传授给刚刚踏入\
    \ Sass 世界的人。\n\n顺便提一下，你可以在 Sass 官网看到类似的指南，地址是 [`http://sass-lang.com/community-guidelines`](http://sass-lang.com/community-guidelines)。\n\
    \n## 总结\n\n初次发现和探索一项技术可以打开一些真正的可能性——这尤其适用于 Sass 的世界！在本次 Sass 之旅的第一部分，我们介绍了一些有用的技巧和诀窍，那么让我们花点时间回顾一下所学的内容。\n\
    \n我们从介绍 Sass 这项技术开始，探讨了它是什么，以及我们为何要将其用于项目中的原因。然后我们介绍了与 Sass 相关的一些不同版本和语法，并确保我们清楚本书将使用哪一种。\n\
    \n接下来是 Sass 的初始安装；我们看到了编译第一个文件是多么简单，然后探讨了编译过程中会发生什么。接着我们讨论了如何设置合适的工作流程以充分利用 Sass，然后介绍了如何自动化编译过程，以便我们可以将时间花在更重要的任务上。最后，我们快速浏览了本书将涉及的一些关键术语以及如何获取帮助，以防我们遇到困难。\n\
    \n呼——这是个不错的开始，但还有更多内容要介绍！在下一章中，我们将真正开始深入使用 Sass；我们的第一站将是学习如何创建变量和混合宏，以帮助减少代码量并简化保持值更新的过程。各位朋友们，请上车——船即将起航……\n\
    \n# 2. 介绍变量和混合宏\n\n> *星期五晚上，你度过了忙碌的一周，期待着结束一天的工作。在你的脑海里，你能看到一杯诱人的冷饮，上面还印着你的名字，正在家里等着你……但你的老板走进了办公室，从他脸上的表情来看，任何准时下班的念头都迅速从窗外消失了……*\n\
    \n我敢打赌这个场景听起来太熟悉了：那些——我们该说很有挑战性的？——客户对设计不满意，想要尝试改变配色方案。然而，他们的网站非常复杂，样式表中使用了不同的颜色。当然，你可以进行搜索和替换，但你真的想翻阅数千行代码来确保已经更改了所有颜色吗……？\n"
- fmt: '# Creating Variables in a Practical Context


    Absolutely not! There is indeed a better way to do this – enter the power of Sass.
    One of the key features of Sass is variables; they work in the same way as many
    scripting languages, such as JavaScript. Now – before you run screaming to the
    hills: don’t worry – it’s not as complicated as it sounds. Let me explain how
    this works, using colors as the basis for our example.


    When working in a style sheet, normal practice would be to assign colors where
    needed throughout our style sheet – if we had to change them, we’d likely perform
    a search and replace. There’s nothing wrong with this, provided we’ve used the
    same case throughout – clearly replacing `#fff` with `#000` won’t catch any instance
    where we’ve used `white` instead!


    Instead, we can simply set placeholder names for each instance of a color, such
    as `darkGrey` or `antiqueWhite` – for now, it doesn’t matter what names are provided
    (although I will revisit this later).


    The real magic comes at the start of our style sheet – we specify values for each
    of these placeholders, rather like a legend for a chart. At the point of compiling
    our code, Sass simply does a search and replace for each instance of our placeholder
    variable and replaces them with the appropriate value from our “legend” list.
    It means that if we do have a demanding customer, then we only have one change
    to make per color – we can change it at the start of our style sheet, and Sass
    will automatically update it during compilation.


    To see how easy it is, let’s take a look at a simple example – in our next exercise,
    we’re going to add some simple elements on a page but use variables to apply colors
    using Sass. I’ve used colors that work better in a black and white environment
    (for printing), but this will work with any color you choose.


    ## Assigning Variables


    Let’s make a start on our code:


    ![../images/472539_1_En_2_Chapter/472539_1_En_2_Fig1_HTML.jpg](images/472539_1_En_2_Chapter/472539_1_En_2_Fig1_HTML.jpg)


    Figure 2-1


    Creating basic variables


    1. We’ll start by downloading and extracting a copy of the `variables` folder
    from the code download that accompanies this book – go ahead and save this folder
    into our project area.


    2. Next, fire up your text editor – we can now add in our styles, so for this,
    go ahead and create a new file, saving it as `variables.scss` in the `scss` subfolder
    of the `variables` folder.


    3. We’ll be adding in a number of styles to our style sheet – the first group
    is a set of variables we’ll use to define colors in this demo:


    ```

    $color-gainsboro: #c0c0c0;

    $color-dimgrey: #696969;

    $color-slategrey: #708090;

    ```


    4. Leave a bank line, then add the following base styles:


    ```

    @font-face {  font-family: ''pt_sansregular''; src: url(''../font/pt_sansregular.woff'')
    format(''woff''); font-weight: normal; font-style: normal; }

    body {  font-family: ''pt_sansregular'', sans-serif; padding: 20px; }

    h2 { text-align: center; }

    section { border: 1px solid #000; width: 450px; padding: 20px; margin-left: auto;
    margin-right: auto; }

    ```


    5. Leave another blank line, then immediately below add in the following styles
    that will make use of Sass:


    ```

    section span { color: $color-dimgrey; font-size: 20px; font-weight: bold; }

    p { color: $color-gainsboro; font-size: 16px; font-weight: bold;}

    a { color: $color-slategrey; text-decoration: none; }

    a:hover { text-decoration: underline; background-color: antiquewhite; font-weight:
    bold; }

    ```


    6. Save the file as `variables.scss` in the `scss` folder.


    7. Next, fire up a terminal session and change the working folder to the `variables`
    folder under our project area.


    8. At the prompt, type the following command and press Enter:


    ```

    sass sass\variables.scss css\variables.css

    ```


    9. If all is well, we should see a `variables.css` file appear in the `css` folder,
    along with a source map – previewing the results will show a simple box with styled
    elements, as indicated in Figure [2-1](#472539_1_En_2_Chapter.xhtml#Fig1).


    See how easy that was? Granted, our example was very simplistic, but this doesn’t
    matter – we can use this in all types of different scenarios. This is an important
    feature to come to grips with, so let’s take a few moments to understand how this
    works in greater detail.


    ## Exploring What Happened


    Although the idea of using variables may scare some, creating and using variables
    isn’t as hard as it might look. We touched on this in our first demo back in Chapter
    [1](#472539_1_En_1_Chapter.xhtml), when we compiled a single style rule that used
    three variables.


    In reality, using variables is nothing more than a search and replace – our demo
    made use of three variables, namely `$color-gainsboro`, `$color-dimgrey`, and
    `$color-slategrey`. To each of these, we assign the relevant color code (we could
    use RGB, or even RGBA if we’d wanted). We then added the appropriate variable
    at the appropriate point in our code – so, for example `$color-gainsboro` appears
    against the color attribute at line 22. At the point of compilation, Sass looks
    for each variable used and simply replaces them with the appropriate value – in
    this instance, our value would become `color: #c0c0c0;` in the compiled style
    sheet.


    To prove this is the case, take a look at the compiled style sheet from within
    your browser’s DOM inspector – if we have source map support enabled, we’ll see
    the final compiled result, along with a link to the original source file, as indicated
    in Figure [2-2](#472539_1_En_2_Chapter.xhtml#Fig2).


    ![../images/472539_1_En_2_Chapter/472539_1_En_2_Fig2_HTML.jpg](images/472539_1_En_2_Chapter/472539_1_En_2_Fig2_HTML.jpg)


    Figure 2-2


    Viewing compiled CSS in a browser


    If we were to click on the `variables.scss` name shown in Figure [2-2](#472539_1_En_2_Chapter.xhtml#Fig2),
    we’d see the original Sass code, as shown in Figure [2-3](#472539_1_En_2_Chapter.xhtml#Fig3).


    ![../images/472539_1_En_2_Chapter/472539_1_En_2_Fig3_HTML.jpg](images/472539_1_En_2_Chapter/472539_1_En_2_Fig3_HTML.jpg)


    Figure 2-3


    Translating compiled CSS to original SCSS


    At this point, there are a couple of points we should be aware of: our naming
    convention, and making sure we use the right names! This is something that could
    easily trip you up, so let’s take a moment to cover this in more detail.'
