  trans: "\n### 创建可复用代码\n\n我们在引言中提到了几个非常适合使用 mixin 的用例场景——其中一个典型场景是让响应式内容在页面上居中，无论其如何缩放。\n\
    \n在创建响应式内容时，我们通常使用百分比值——[CSS-Tricks.com](http://css-tricks.com) 的 Chris Coyier\
    \ 编写了一个优秀的 mixin，可以让我们将任何内容居中，从而自由地按需设置样式。我将以此为基础进行下一个演示，该演示将在屏幕上居中显示一个标准的 `<div>`\
    \ 元素。\n\n你可以通过 [`https://codepen.io/chriscoyier/pen/BvdgL`](https://codepen.io/chriscoyier/pen/BvdgL)\
    \ 查看 Chris 的原始示例。\n\n### 创建 Mixin\n\n让我们开始编写这段代码：\n\n![../images/472539_1_En_2_Chapter/472539_1_En_2_Fig6_HTML.jpg](img/472539_1_En_2_Fig6_HTML.jpg)\n\
    \n图 2-6：使用 mixin 居中 div\n\n1.  首先，下载 `centerdiv` 文件夹并将其解压到我们的项目目录中。\n2.  在你常用的文本编辑器中，新建一个文档，然后添加以下几行代码——我们首先定义一个变量，然后是我们的\
    \ mixin：\n\n    ```\n    $color-slategrey: #708090;\n    @mixin centerdiv { position:\
    \ absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }\n    ```\n\
    \n3.  留一个空行，然后为演示添加以下基础样式：\n\n    ```\n    @font-face { font-family: 'pt_sansregular';\
    \ src: url('../font/pt_sansregular.woff') format('woff'); font-weight: normal;\
    \ font-style: normal; }\n    body { font-family: 'pt_sansregular', sans-serif;\
    \ background: #fff; }\n    h2 { text-align: center; }\n    ```\n\n4.  我们已经添加了\
    \ mixin，但如果不调用它，它就不会生效——为此，请在上一组规则下方添加以下样式规则：\n\n    ```\n    div {\n    @include\
    \ centerdiv ;\n    width: 40%; height: 50%; padding: 20px; background: $color-slategrey;\
    \ color: antiquewhite; text-align: center; box-shadow: 0 0 30px rgba(0, 0, 0,\
    \ 0.2); border-radius: 10px; font-size: 18px; font-weight: bold; letter-spacing:\
    \ 1px;\n    }\n    ```\n\n5.  将此文件保存为 `centerdiv.scss`，并放在步骤 1 中保存的 `centerdiv`\
    \ 文件夹内的 `scss` 子文件夹中。\n6.  接下来，启动终端会话，将工作目录切换到项目目录下的 `centerdiv` 文件夹。在提示符下，输入以下命令并按\
    \ Enter：\n\n    ```\n    sass sass\\centerdiv.scss css\\centerdiv.css\n    ```\n\
    \n7.  如果一切顺利，我们应该会在 `css` 文件夹中看到生成的 `centerdiv.css` 文件以及一个 source map——预览结果将显示一个始终在屏幕中居中的简单方框，如图\
    \ 2-6 所示。\n\n尝试调整浏览器窗口大小——请注意，无论窗口缩小或放大多少，div 元素是否始终在屏幕中居中？虽然我们在代码中为 left 和 top\
    \ 设置了适当的值，但它们本身无法生效——我们来快速了解一下真正让这个演示成功的关键。\n\n### 详细解析代码\n\n这个演示的关键在于 Sass 代码是如何被编译的——我们可以在图\
    \ 2-7 中看到其第一部分。\n\n![../images/472539_1_En_2_Chapter/472539_1_En_2_Fig7_HTML.jpg](img/472539_1_En_2_Fig7_HTML.jpg)\n\
    \n图 2-7：我们的 mixin，编译为 CSS\n\n我们的演示在编译过程中包含了 `centerdiv` mixin 的内容——mixin 是作为 CSS\
    \ 规则编写的，但必须使用关键字 `@mixin` 进行定义，并使用关键字 `@include` 加上 mixin 名称来引用。\n\n需要注意的关键点是，mixin\
    \ 本身不会被编译，但其内部的规则会被包含到任何调用该 mixin 的规则集中。这确实意味着我们的源文件可能比编译后的版本要大，但这无关紧要：只要我们创建合适的\
    \ mixin，它们只会被包含到调用它们的规则集中，而不会在样式表中被单独编译。\n\n## 使用预构建的 Mixin\n\n掌握了创建 mixin 的新知识后，我们可以继续为项目创建新的\
    \ mixin。不过，在重新发明轮子之前，不妨先上网看看？\n\n在谷歌上搜索一下，你会看到很多人编写并发布了可用的 mixin；很多时候，我们可能会发现有人已经编写了一个满足我们需求的\
    \ mixin。使用现有的 mixin 可以节省时间和开发精力——当然，我们可能需要对代码进行微调，但这省去了从头开发的麻烦。\n\n### 使用预构建的\
    \ Mixin\n\n网上有大量可用的 mixin，既有独立的，也有作为库一部分的——如果你在谷歌上搜索“sass mixin libraries”，会看到像\
    \ Bourbon、Scotch 和 Compass 等库的引用。其中一些已经存在了一段时间；随着 CSS 的进步，它们的使用价值逐渐降低（尤其是那些包含不再必要的厂商前缀代码的库）。\n\
    \n一个 mixin 库的例子是 CSSgram，由 Una Kravets 创建——它借鉴了流行应用 Instagram 中使用的滤镜效果。可以从 [`https://una.im/CSSgram/`](https://una.im/CSSgram/)\
    \ 获取，我们将使用其中一个滤镜来为一张复古风格图片制作前后对比效果。\n\n在此演示中，我们将使用来自 [`https://www.pexels.com/photo/camera-photography-vintage-old-36732/`](https://www.pexels.com/photo/camera-photography-vintage-old-36732/)\
    \ 的相机图片；如果你想使用其他图片，请随意调整。\n\n让我们开始创建演示：\n\n![../images/472539_1_En_2_Chapter/472539_1_En_2_Fig8_HTML.jpg](img/472539_1_En_2_Fig8_HTML.jpg)\n\
    \n图 2-8：使用 mixin 库应用滤镜\n\n1.  首先，下载 `prebuilt` 文件夹并将其解压到我们的项目目录中。\n2.  在你常用的文本编辑器中，新建一个文档，然后添加以下几行代码——我们将为演示添加一些基础样式：\n\
    \n    ```\n    @import \"cssgram.scss\";\n    @font-face { font-family: 'pt_sansregular';\
    \ src: url('../font/pt_sansregular.woff') format('woff'); font-weight: normal;\
    \ font-style: normal; }\n    body { font-family: 'pt_sansregular', sans-serif;\
    \ background: #fff; }\n    h2 { text-align: center; }\n    ```\n\n3.  现在我们需要添加将图片放置到页面上的样式：\n\
    \n    ```\n    p { width: 100px; display: inline-block; margin: 0; padding: 0;\
    \ }\n    section { width: 320px; margin-left: auto; margin-right: auto; }\n  \
    \  div.filter, div.nofilter { width: 300px; display: inline-block; margin: 10px;\
    \ }\n    ```\n\n4.  最后但同样重要的是，实现演示中使用的滤镜所需的样式：\n\n    ```\n    div.filter { @extend\
    \ %stinson; }\n    div.nofilter img { width: 100%; z-index: 1; }\n    ```\n\n\
    5.  将此文件保存为 `prebuilt.scss`，并放在步骤 1 中保存的 `prebuilt` 文件夹内的 `scss` 子文件夹中。\n6.  接下来，启动终端会话，将工作目录切换到项目目录下的\
    \ `prebuilt` 文件夹。在提示符下，输入以下命令并按 Enter：\n\n    ```\n    sass sass\\prebuilt.scss\
    \ css\\prebuilt.css\n    ```\n\n7.  如果一切顺利，我们应该会在 `css` 文件夹中看到生成的 `prebuilt.css`\
    \ 文件以及一个 source map——预览结果将显示两张图片，一张未应用滤镜，另一张应用了滤镜，如图 2-8 所示。\n\n尽管我们的演示创建起来相对简单，但有一个关键点值得进一步关注。如果你查看下载的\
    \ CSSgram 文件，会发现它非常庞大。其中包含大量不同的滤镜效果——如果你担心我们使用了过多的代码，这是可以理解的！幸运的是，我们实际使用的代码量远比看起来要少——让我们深入探讨，更详细地了解一下。\n"
- fmt: "### Understanding How the Code Works\n\nSo – even though we’re making use\
    \ of the CSSgram mixin library, how come our CSS style sheet isn’t larger than\
    \ it should be?\n\nThe trick behind making this work is the use of the `@import`\
    \ statement at the head of our style sheet – by default, Sass only imports mixins\
    \ *where there is a direct reference* to them from within our code. In this case\
    \ we’ve only called the `stinson` mixin, so Sass simply ignores all of the other\
    \ filter mixin files in the `scss` folder during compilation.\n\nIncluding the\
    \ file extension is not obligatory when importing files: in this instance, we\
    \ could use `@import \"cssgram\";` equally as well in our demo. We’ll touch on\
    \ this later in this chapter.\n\nHowever, there is a twist in this tale: the keen-eyed\
    \ among you should spot that our code doesn’t include the mixin keyword! What\
    \ gives? Well, we’re making use of another feature: `@extend`. We’ll cover this\
    \ in more detail in Chapter [3](#472539_1_En_3_Chapter.xhtml), “Creating Nesting\
    \ Styles,” but for now, it’s enough to know that it works in a similar fashion\
    \ to mixins but can produce more efficient code.\n\nIf you take a look at the\
    \ `stinson.scss` file, though, you will indeed see the `@include` keyword in use;\
    \ this calls a base filter mixin, which is used in all of the filters within the\
    \ CSSgram library. There are some key differences though to how mixins and the\
    \ `@extend` keyword work; we’ll explore this in more detail, when we take a look\
    \ at using `@extend` in the next chapter.\n\nOkay – let’s move on: creating or\
    \ importing base mixins is a great way to write more efficient code, but there\
    \ is one small limitation. There will come a point where you may have multiple\
    \ blocks of code that could be served by a single mixin, but different values\
    \ are needed. Ordinarily we might think there isn’t anything we can do, but as\
    \ we’re using Sass, there is – it’s time to learn about parametric mixins.\n\n\
    ## Passing Values to Mixins\n\nSo far, we’ve explored how to create and use mixins\
    \ – these are perfect for including reusable, static groups of rules, but what\
    \ if we had instances where we could use a mixin but can’t as values are not quite\
    \ the same?\n\nThere may be occasions where we might be able to fine tweak values\
    \ so that we can, but this is unlikely – a far better idea is to make use of parametric\
    \ mixins. These work in much the same way as standard mixins, but with one difference\
    \ – instead of containing a static set of values, we can pass different values\
    \ into the mixin and allow Sass to render it as standard CSS.\n\nThe syntax for\
    \ parametric mixins is very similar – we have the same `@mixin` keyword at the\
    \ start, but this time around we include the values we’ll be passing into the\
    \ mixin:\n\n```\n@mixin button-bg($bg, $fg) {\n...the values are used in the mixin...\n\
    }\n```\n\nAt the point of compilation, Sass inserts the different values into\
    \ the placeholders within the mixin and compiles it into valid CSS, ready for\
    \ use in our projects. We can see how this works in more detail, by creating a\
    \ demo around the humble button – we often have different colors in use in a site,\
    \ so this makes it a perfect fit for using mixins.\n\n### Creating Parametric\
    \ Mixins\n\nLet’s start creating our demo:\n\n![../images/472539_1_En_2_Chapter/472539_1_En_2_Fig9_HTML.jpg](images/472539_1_En_2_Chapter/472539_1_En_2_Fig9_HTML.jpg)\n\
    \n**Figure 2-9** Creating buttons with parametric mixins\n\n1. We’ll begin by\
    \ downloading and extracting a copy of the `parametric` folder to our project\
    \ area.\n2. In your usual text editor, go ahead and create a new document, then\
    \ add in the following lines of code – we’ll begin some base styles for our demo:\n\
    \n    ```\n    @mixin button-bg($bg, $fg) {\n    background: $bg;\n    color:\
    \ $fg;\n    &:hover {\n    background:darken($bg,8%);\n    transition: all 0.3s\
    \ ease ;\n    }\n    &:active {\n    background:darken($bg,30%);\n    }\n    }\n\
    \    @font-face { font-family: 'pt_sansregular'; src: url('../font/pt_sansregular.woff')\
    \ format('woff'); font-weight: normal; font-style: normal; }\n    body { font-family:\
    \ 'pt_sansregular', sans-serif; padding: 20px;}\n    h2 { text-align: center;\
    \ }\n    p { margin: 0; padding: 0; margin-bottom: 30px; width: 480px; margin-left:\
    \ auto; margin-right: auto;\n    ```\n\n3. We now need to add in the styles that\
    \ will place the buttons on the page:\n\n    ```\n    .wrap { margin:0 auto; width:\
    \ 800px; text-align:center; }\n    .btn { text-decoration: none; padding: 5px\
    \ 10px; border-radius: 4px; font-size: 22px; }\n    ```\n\n4. We’ve added the\
    \ base style for our button, but for them to resemble something useful, we need\
    \ to provide some color. The following rules will take care of this:\n\n    ```\n\
    \    .btn-antiquewhite { @include button-bg(#faebd7, #000); }\n    .btn-darkgrey\
    \ { @include button-bg(#a9a9a9, #000); }\n    .btn-gainsboro{ @include button-bg(#dcdcdc,\
    \ #000); }\n    .btn-slategrey { @include button-bg(#708090, #fff); }\n    ```\n\
    \n5. Save this file as `parametric.scss` in the `scss` subfolder within the `parametric`\
    \ folder we saved in step 1.\n6. Next, fire up a terminal session and change the\
    \ working folder to the `parametric` folder under our project area. At the prompt,\
    \ enter the following command and press Enter:\n\n    ```\n    sass sass\\parametric.scss\
    \ css\\parametric.css\n    ```\n\n7. If all is well, we should see a `parametric.css`\
    \ file appear in the `css` folder (in the same way as previous exercises), along\
    \ with a source map – previewing the results will show a series of styled buttons,\
    \ as indicated in Figure [2-9](#472539_1_En_2_Chapter.xhtml#Fig9).\n\nThis demo\
    \ may be simple, but it is a perfect way to illustrate the effectiveness of using\
    \ parametric mixins. We’ve created four different buttons using the same base\
    \ code but with different values passed in – let’s take a look at how this works\
    \ in practice.\n\n### Dissecting Our Code\n\nSo – how does our demo manage to\
    \ produce four identically shaped buttons, yet with different colors for each\
    \ one? The trick to making our demo work lies in this mixin:\n\n```\n@mixin button-bg($bg,\
    \ $fg) {\nbackground: $bg;\ncolor: $fg;\n&:hover {\nbackground:darken($bg,8%);\n\
    transition: all 0.3s ease;\n}\n&:active {\nbackground:darken($bg,30%);\n}\n}\n\
    ```\n\nBy itself, it won’t do anything, but once we call it from within our code,\
    \ it will compile into the styles required for each button. If we take the first\
    \ call as an example:\n\n```\n.btn-antiquewhite { @include button-bg(#faebd7,\
    \ #000); }\n```\n\n... we see that the first value passed in is `#faebd7`; this\
    \ represents an off-white (or antique) shade of white. The second value passed\
    \ into our mixin is black – this will be used to style the text shown in our button.\n\
    \nWhen we look at the hover function, this is where it gets interesting – we have\
    \ several new keywords in use. It starts with the use of `&:` - this is a reference\
    \ to the parent selector, so when compiled, it becomes `.btn-antiquewhite:hover`.\
    \ We then use the `$bg` variable (represents the first value passed to our mixin)\
    \ and the Sass `darken()` function to produce two new colors: `#f5d9b3` for the\
    \ hover state, and `#e9a74f` for our button’s active state.\n\nWe’ll revisit references\
    \ to parent selectors as part of nesting, in the next chapter.\n\nOkay – let’s\
    \ move on: we’re almost ready to start looking at a new part of Sass, but before\
    \ we do so, we need to revisit a feature we’ve touched on earlier in this chapter.\
    \ Managing Sass style sheets can get tricky, the larger they grow. The question\
    \ is how to best manage them before they do get too unwieldy?"
