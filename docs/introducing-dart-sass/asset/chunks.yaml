    \ it contains mappings from the compiled CSS file (`output.css`), which point\
    \ to the relevant code within our original source file, `test.scss`. Suffice to\
    \ say that we don’t need to worry about what is produced inside this file – the\
    \ compilation process takes care of this for us. As long as one is present, and\
    \ support is enabled in our browser, we will be able to relate compiled code back\
    \ to its original source.\n\n### Automating the Compilation Process\n\nIn the\
    \ *Our first compilation* demo, we used this line to compile our code:\n\n```\n\
    sass test.scss output.css\n```\n\nIt’s a simple command – it does the job with\
    \ no frills, assuming of course we’ve written valid Sass code! However, running\
    \ this each time will quickly get tedious; we can absolutely improve on this,\
    \ by use of the `--watch` parameter.\n\nThis requires a simple change to our command –\
    \ it’s almost worth getting into the habit of including it when running a compile\
    \ from a terminal session! Instead of the command we used, we can use this:\n\n\
    ```\nsass --watch test.scss output.css\n```\n\nThis will watch for changes and\
    \ recompile our source file automatically – there is something we need to look\
    \ out for though, but I will cover this in Chapter [2](#472539_1_En_2_Chapter.xhtml)\
    \ .\n\n### Adjusting the Output Format\n\nIf you take a look at a compiled CSS\
    \ file, you may notice that Sass has produced something that is easy to read but\
    \ takes a lot of space. This clearly isn’t ideal for use in production sites –\
    \ we want our files to be as small as possible! Fortunately there’s an easy change\
    \ we can make to our compilation process – remember our first compile command,\
    \ which looked like this?\n\n```\nsass test.scss output.css\n```\n\nIf we add\
    \ in the command highlighted in bold:\n\n```\nsass test.scss output.css --style=compressed\n\
    ```\n\n... this will compress our compiled style sheet, which will be ideal for\
    \ use on production sites.\n\nBy default, if you omit this command, Sass will\
    \ produce code in expanded format – if you prefer to specify this explicitly,\
    \ then use `--style=expanded` instead.\n\n### Editing Sass Code\n\nNow – this\
    \ might seem like an odd point to pick up on, but you’ll understand why in a moment:\
    \ although there is a good selection of tools that we can use to edit Sass code,\
    \ we don’t necessarily need them! Let me explain what I mean:\n\nAt a basic level,\
    \ Sass is nothing more than an extension of CSS – it means that pretty much any\
    \ text editor can be used to edit Sass code. I suspect many of you will already\
    \ have a favorite editor that will work fine with Sass. I personally use Sublime\
    \ Text 3, which is a commercial offering, but the 80USD price tag is definitely\
    \ worth the price!\n\nFor the purposes of this book, I will assume you already\
    \ have a suitable editor that already works well for you. If not, then it helps\
    \ to have one that has syntax support for Sass and can open and format multiple\
    \ files (not really a problem, as most do anyway). If you don’t already have something,\
    \ then one of these might be a good place to start:\n\n*   Atom (cross platform) –\
    \ available from [`https://atom.io/`](https://atom.io/)\n\n*   TextMate (Mac OS\
    \ only) – [`https://macromates.com`](https://macromates.com)\n\n*   Sublime Text\
    \ (cross platform, commercial) – downloadable from [`https://www.sublimetext.com`](https://www.sublimetext.com)\n\
    \n*   Visual Code (cross platform, free) – available from [`https://code.visualstudio.com/`](https://code.visualstudio.com/)\n\
    \nHowever, there is another option that will really turn things on their head:\
    \ if you want to use a dedicated **stand-alone** tool for compiling Sass, then\
    \ there is also a mix of open source and commercial offerings available. Some\
    \ will work across multiple platforms, while others target specific platforms\
    \ only. Let’s take a look at some of the options open to us:\n\n*   CodeKit –\
    \ this commercial offering is available from [`https://codekitapp.com/`](https://codekitapp.com/)\
    \ but is for Mac only\n\n*   GhostLab – available as a commercial application\
    \ for Mac or Windows, from [`http://www.vanamco.com/ghostlab/`](http://www.vanamco.com/ghostlab/)\n\
    \n*   Hammer – a Mac-only commercial editor, available from [`https://hammerformac.com/`](https://hammerformac.com/)\n\
    \n*   Koala – downloadable from [`http://koala-app.com/`](http://koala-app.com/)\
    \ , Koala is a cross-platform, open source editor, although it has not seen any\
    \ updates since late 2017\n\n*   Prepos – this shareware editor is available from\
    \ [`https://prepros.io/`](https://prepros.io/) with versions available for Mac,\
    \ Windows, and Linux\n\n*   Scout-App – an open source editor available for Mac,\
    \ Windows, and Linux, downloadable from [`http://scout-app.io/`](http://scout-app.io/)\n\
    \n    Note “All” in the above list refers to Mac, Windows, and Linux support.\n\
    \nOh – and guess what? There’s yet another route to compiling Sass that we can\
    \ choose! If your preference is to not install yet another tool into your development\
    \ workflow, then you can always choose to compile your code online.\n\nThere are\
    \ several options available for this, but one that is recommended is SassMeister,\
    \ hosted at [`https://www.sassmeister.com`](https://www.sassmeister.com) . This\
    \ gives you all of the benefit of compiling Sass in exactly the same way as if\
    \ we were doing so offline; it’s probably less suited to compiling lengthy, complex\
    \ blocks of code, but ideal if you want to try ideas out before committing changes\
    \ to your source code."
