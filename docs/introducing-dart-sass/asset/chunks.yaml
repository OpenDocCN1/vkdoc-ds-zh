    \ up clashing with others used on the site, or a background color we apply ends\
    \ up making text illegible.\n\nOne of the key benefits of using Sass, though,\
    \ is that we can build in a certain amount of control to reduce these issues –\
    \ if the color of an element is particularly dark, then Sass can be told to select\
    \ a lighter color so our content remains legible.\n\nHow can we achieve this?\
    \ Well, it’s time we met Sass’s Control Directives and Expressions! This mouthful\
    \ of a name represents a group of functions that allow us to control which styles\
    \ are used and when – it’s worth noting that they are intended more for use in\
    \ mixins, but can be used in day-to-day styling if required. Let’s take a look\
    \ at each of them, beginning with the `@if` functions.\n\n### Applying @if and\
    \ @if( ):\n\nLet’s say for argument’s sake we had run into an issue of clashing\
    \ colors, caused as a result of insufficient contrast – how would we solve this\
    \ problem? Well, one way to solve it would, of course, be to replace the offending\
    \ color, but this is a manual task that requires effort. Instead, how about getting\
    \ Sass to choose for us?\n\nNo problem – Sass has two functions that can help\
    \ here: ironically both are called @if, but they each have different uses! The\
    \ first, `@if()` , takes this format: `if(true, 1px, 2px) => 1px` – it is used\
    \ to decide if we should apply the first value `(1px)`, or choose `2px` if that\
    \ variable doesn’t exist or might cause an error (such as divide by zero).\n\n\
    The second is more straightforward – we can use `@if` to decide if we include\
    \ a value or not, such as in this example: `@if 1 + 1 == 2 { border: 1px solid;\
    \ }`, which will render as true. If it had rendered as false, then the border\
    \ property simply wouldn’t be set. Both can be a little tricky to fully understand,\
    \ so let’s create a demo to explore how these two work in more detail.\n\n###\
    \ Using If Statements\n\nThe first step is to grab a copy of the download that\
    \ accompanies this book – once you have it, follow these steps:\n\n![../images/472539_1_En_4_Chapter/472539_1_En_4_Fig5_HTML.jpg](images/472539_1_En_4_Chapter/472539_1_En_4_Fig5_HTML.jpg)\n\
    \nFigure 4-5\n\nUsing @if...@else statements\n\n1.  We’ll start by downloading\
    \ and extracting a copy of the example `condition` folder from the code download\
    \ that accompanies this book – go ahead and save it to our project folder.\n\n\
    2.  Our demo doesn’t contain the Sass styles needed to make it work – for this,\
    \ go ahead and create a new file, saving it as `condition.scss` in the sass subfolder\
    \ in the `condition` folder we saved in step 1.\n\n3.  We have a few style rules\
    \ to add in, which we will add in block by block, starting with some basic styles\
    \ required to set up our demo:\n\n    ```\n    @font-face { font-family: 'pt_sansregular';\
    \ src: url('../font/pt_sansregular.woff') format('woff'); font-weight: normal;\
    \ font-style: normal; }\n    body { font-family: 'pt_sansregular', sans-serif;\
    \ margin: 32px; font-size: 20px; }\n    li { padding: 20px 5px; margin: 10px;\
    \ color: white; width: 400px; list-style: none; }\n    ```\n\n4.  Next up comes\
    \ the crux of our demo – we first specify three colors, which are defined by the\
    \ outcomes of three if statements:\n\n    ```\n    $first-color: if(true, antiquewhite,\
    \ black);\n    $second-color: if(false, black, slategrey);\n    $third-color:\
    \ if(4 > 2, silver, black);\n    ```\n\n5.  We now need to add in the conditions\
    \ that determine some of the properties used in each of the four list items:\n\
    \n    ```\n    li:nth-of-type(1) {\n    background: $first-color;\n    @if (lightness($first-color)\
    \ > 75%) {\n    color: black;\n    } @else {\n    color: white;\n    }\n    }\n\
    \    li:nth-of-type(2) {\n    @if 1 + 1 == 2 { background: $second-color;  }\n\
    \    @if 5 > 3 { border: 3px dotted $third-color; width: 394px; }\n    @if true\
    \ { font-family: 'sans-serif'; }\n    }\n    li:nth-of-type(3) {\n    background:\
    \ $third-color;\n    @if (lightness($third-color) > 75%) {\n    color: black;\n\
    \    } @else {\n    color: white;\n    }\n    }\n    li:nth-of-type(4) {\n   \
    \ @if 1 + 1 == 2 { background: darken($second-color, 50%); }\n    @else if 1 +\
    \ 2 == 3 { background: $second-color; }\n    @else if 5 > 3{ border: 2px dotted\
    \ $third-color; }\n    }\n    ```\n\n6.  Go ahead and save the file – next, fire\
    \ up a terminal session and change the working folder to the `condition` folder\
    \ under our project area.\n\n7.  At the prompt, type the following command and\
    \ press Enter:\n\n    ```\n    sass sass\\condition.scss css\\condition.css\n\
    \    ```\n\n8.  If all is well, we should see a `colorfunctions.css` file appear\
    \ in the `css` folder, along with a source map – previewing the results will show\
    \ a simple template page with styled elements, as indicated in Figure [4-5](#472539_1_En_4_Chapter.xhtml#Fig5).\n\
    \nAt first glance our demo looks very simple, with straightforward styling for\
    \ each list item. However, under the covers it hides a fair amount of decision\
    \ making that determines which color each list item should use! We’ve used two\
    \ key functions within this demo that are important to understand, so let’s take\
    \ a few minutes to explore how they work in more detail."
  trans: "\n### 评估使用此方法的好处\n\n创建颜色的方法看似复杂，但采用此方法有一些充分的理由：\n\n-   我们总是可以执行查找和替换，但如果代码中对颜色或变量的拼写略有不同，会发生什么？查找和替换可能无法识别，从而导致代码中出现意外效果。\n\
    -   如果客户在最后一刻要求更改，那么你只需要更新一个值；其他一切都会在编译过程中自动计算出来。\n-   我们不需要为每种颜色创建变量——虽然像我们这样的计算编译可能需要多花几秒钟，但我们并不是“即时”编译代码，所以我们可以接受所需的额外编译时间。\n\
    \n当然，如果我们最终得到一个巨大的样式表（我指的是数万行代码），那么这些额外的编译时间可能会开始累积——如果是这种情况，我们可能更倾向于使用变量。\n\n\
    好了，让我们继续：我们已经接触了一些可用的函数，并探讨了如何在代码中实际使用它们。尽管这为代码引入了一定的动态性，但我们仍然受到限制，因为我们的函数只会产生一个值（就像上一个演示中的情况一样）。\n\
    \n如果我们需要根据满足特定条件来指定不同的值，该怎么办？嗯，Sass 可以提供帮助——它借鉴了诸如 JavaScript 等脚本语言的技术来实现循环等功能。这是该库中一个非常重要的部分，非常值得探索，所以让我们更详细地看看可用于评估\
    \ Sass 代码中条件的功能。\n\n## 评估条件\n\n> *决策，决策——我们用这种颜色，还是另一种……？把内容放在页面顶部怎么样……？*\n\n\
    我们的生活充满了必须做出的决定——在大多数情况下，我们会做出正确的选择，但有时也可能出错！样式化内容也是如此：我们选择的颜色可能会与网站上使用的其他颜色冲突，或者我们应用的背景颜色最终可能导致文本难以辨认。\n\
    \n不过，使用 Sass 的一个关键好处是，我们可以构建一定程度的控制来减少这些问题——如果某个元素的颜色特别暗，那么可以指示 Sass 选择较浅的颜色，以便我们的内容保持清晰易读。\n\
    \n我们如何实现这一点？好吧，是时候认识一下 Sass 的控制指令和表达式了！这个冗长的名称代表了一组函数，它们允许我们控制使用哪些样式以及何时使用——值得注意的是，它们更常用于\
    \ mixin 中，但也可以在需要时用于日常样式编写。让我们逐一看看它们，从 `@if` 函数开始。\n\n### 应用 `@if` 和 `@if()`\n\
    \n假设我们遇到了颜色冲突的问题，这是由于对比度不足造成的——我们该如何解决这个问题？嗯，一种解决方法当然是替换有问题的颜色，但这需要手动操作，比较费力。不如让\
    \ Sass 替我们选择？\n\n没问题——Sass 有两个函数可以提供帮助：讽刺的是，它们都叫 `@if`，但各有不同的用途！第一个是 `@if()`，格式如下：`if(true,\
    \ 1px, 2px) => 1px`——用于决定我们是应该应用第一个值 (`1px`)，还是在该变量不存在或可能导致错误（例如除以零）时选择 `2px`。\n\
    \n第二个更直接——我们可以使用 `@if` 来决定是否包含某个值，例如这个例子：`@if 1 + 1 == 2 { border: 1px solid;\
    \ }`，它会被判定为真。如果判定为假，那么 border 属性根本不会被设置。这两个函数可能都有点难以完全理解，所以让我们创建一个演示来更详细地探索它们的工作原理。\n\
    \n### 使用 If 语句\n\n第一步是获取本书附带的示例文件——有了它之后，请按照以下步骤操作：\n\n![../images/472539_1_En_4_Chapter/472539_1_En_4_Fig5_HTML.jpg](img/472539_1_En_4_Fig5_HTML.jpg)\n\
    \n**图 4-5**  \n使用 `@if...@else` 语句\n\n1.  首先，从本书附带的代码示例中下载并解压 `condition` 文件夹的副本——继续将其保存到我们的项目文件夹中。\n\
    \n2.  我们的演示不包含使其正常运行所需的 Sass 样式——为此，继续创建一个新文件，并将其保存为我们第 1 步中保存的 `condition` 文件夹下的\
    \ `sass` 子文件夹中的 `condition.scss`。\n\n3.  我们需要添加一些样式规则，我们将逐块添加，从设置演示所需的一些基本样式开始：\n\
    \n    ```\n    @font-face { font-family: 'pt_sansregular'; src: url('../font/pt_sansregular.woff')\
    \ format('woff'); font-weight: normal; font-style: normal; }\n    body { font-family:\
    \ 'pt_sansregular', sans-serif; margin: 32px; font-size: 20px; }\n    li { padding:\
    \ 20px 5px; margin: 10px; color: white; width: 400px; list-style: none; }\n  \
    \  ```\n\n4.  接下来是演示的核心——我们首先指定三种颜色，它们由三个 `if` 语句的结果定义：\n\n    ```\n    $first-color:\
    \ if(true, antiquewhite, black);\n    $second-color: if(false, black, slategrey);\n\
    \    $third-color: if(4 > 2, silver, black);\n    ```\n\n5.  现在，我们需要添加一些条件，这些条件决定了四个列表项中每个项所使用的某些属性：\n\
    \n    ```\n    li:nth-of-type(1) {\n    background: $first-color;\n    @if (lightness($first-color)\
    \ > 75%) {\n    color: black;\n    } @else {\n    color: white;\n    }\n    }\n\
    \    li:nth-of-type(2) {\n    @if 1 + 1 == 2 { background: $second-color;  }\n\
    \    @if 5 > 3 { border: 3px dotted $third-color; width: 394px; }\n    @if true\
    \ { font-family: 'sans-serif'; }\n    }\n    li:nth-of-type(3) {\n    background:\
    \ $third-color;\n    @if (lightness($third-color) > 75%) {\n    color: black;\n\
    \    } @else {\n    color: white;\n    }\n    }\n    li:nth-of-type(4) {\n   \
    \ @if 1 + 1 == 2 { background: darken($second-color, 50%); }\n    @else if 1 +\
    \ 2 == 3 { background: $second-color; }\n    @else if 5 > 3{ border: 2px dotted\
    \ $third-color; }\n    }\n    ```\n\n6.  继续保存文件——接下来，启动一个终端会话，并将工作文件夹更改为项目区域下的\
    \ `condition` 文件夹。\n\n7.  在提示符下，输入以下命令并按 Enter：\n\n    ```\n    sass sass\\condition.scss\
    \ css\\condition.css\n    ```\n\n8.  如果一切顺利，我们应该会在 `css` 文件夹中看到一个 `colorfunctions.css`\
    \ 文件以及一个 source map——预览结果将显示一个带有样式元素的简单模板页面，如图 4-5 所示。\n\n乍一看，我们的演示非常简单，每个列表项都有简单的样式。然而，在表面之下，它隐藏了大量的决策过程，这些过程决定了每个列表项应该使用哪种颜色！我们在本演示中使用了两个关键函数，理解它们很重要，所以让我们花几分钟时间更详细地探讨它们的工作原理。\n"
- fmt: "### Understanding What Happened\n\nThe first part of the style sheet for our\
    \ demo contains some standard rules that we use to define some basic styling for\
    \ the demo and each list item. The crux of our demo though starts on line 22,\
    \ where we use three `@if()` statements to create our colors.\n\nThe simplest\
    \ way to understand how these work, is to say, “If condition is X, we use the\
    \ first value (true), otherwise we use the second (false).” For the first one,\
    \ we specify antique white as the truthy color; as our condition is set to true,\
    \ this is the color that will be used in our style sheet.\n\nFor the second type\
    \ of `@if` statement, where we’re setting three properties for the second list\
    \ item, we simply need to satisfy each condition. If the answer is correct (i.e.,\
    \ true), then the attribute shown in brackets is applied; if not, it is discarded.\n\
    \nThe remaining two examples work in the same way as the first two – list item\
    \ three uses the same principle as the first list item, with the fourth following\
    \ the same technique as the second list item.\n\n## Looping Through Styles\n\n\
    One of Sass’s key abilities is taking over the effort of generating styles – for\
    \ example, we can use functions to create an entire color palette, or get Sass\
    \ to choose what color to apply to a background, so that it doesn’t clash with\
    \ foreground colors.\n\nThis is just a small part though of what Sass can achieve\
    \ – where Sass really comes into its own is iterating through multiple elements,\
    \ applying styles to each from a single set of instructions. For example, how\
    \ about creating a set of payment card icons for an e-commerce site – we can create\
    \ a common set of styles, but use Sass to create those styles unique to each image,\
    \ from a single list of names.\n\nSass has a number of functions that are suited\
    \ to this kind of task – they each have their own unique traits, but each work\
    \ on a similar principle of iterating through a group of items. Let’s take a look\
    \ at each in turn, beginning with the `@for` function.\n\n### Working with `@for`\n\
    \nThe first of our functions, `@for`, is used to repeatedly create a set of styles\
    \ – it uses a counter to iterate through each instance of that style, adjusting\
    \ each based on what is specified in the directive. The syntax for this directive\
    \ is very straightforward: `@for $var from <start> through <end>`, with the changes\
    \ enclosed in brackets.\n\nThere is a second format you can use – replace the\
    \ word `through` with `to`, which works equally well.\n\nLet’s take a look at\
    \ how this function works in detail, with a quick demo.\n\n### Applying Styles\
    \ Using `@for`\n\nLet’s make a start on setting up our demo:\n\n![../images/472539_1_En_4_Chapter/472539_1_En_4_Fig6_HTML.jpg](images/472539_1_En_4_Chapter/472539_1_En_4_Fig6_HTML.jpg)\n\
    \nFigure 4-6\n\nLooping through styles with `@for`\n\n1.  We’ll begin by downloading\
    \ and extracting a copy of the `forloop` folder from the code download that comes\
    \ with this book; go ahead and save it to our project folder.\n\n2.  The download\
    \ contains all of the markup, but this will be useless without our styling, so\
    \ let’s create a new file, saving it as `forloop.scss` in the `sass` folder for\
    \ this demo.\n\n3.  In the file, go ahead and add the following code blocks in\
    \ turn, beginning with some basic styles to set up our demo:\n\n    ```\n    $basecolor:\
    \ #213451;\n    @font-face {\n    font-family: 'pt_sansregular';\n    src: url('../font/pt_sansregular.woff')\
    \ format('woff');\n    font-weight: normal;\n    font-style: normal;\n    }\n\
    \    body { font-family: 'pt_sansregular', sans-serif; margin: 32px;}\n    ul\
    \ { width: 150px; background-color: rgba(0,0,0,0.6) }\n    ```\n\n4.  The remaining\
    \ rules form the crux of our demo – these take care of styling each list item:\n\
    \n    ```\n    $rainbow: silver slategrey antiquewhite darkgrey gainsboro;\n \
    \   @for $i from 1 through 5 {\n    li:nth-child(#{$i}) {\n    color: nth($rainbow,\
    \ $i);\n    font-size: 32px;\n    font-weight: bold;\n    }\n    }\n    ```\n\n\
    5.  Go ahead and save the file – next, fire up a terminal session and change the\
    \ working folder to the `forloop` folder under our project area.\n\n6.  At the\
    \ prompt, type the following command and press Enter:\n\n    ```\n    sass sass\\\
    forloop.scss css\\forloop.css\n    ```\n\n7.  If all is well, we should see a\
    \ `forloop.css` file appear in the `css` folder, along with a source map – previewing\
    \ the results will show a simple template page with styled elements, as indicated\
    \ in Figure [4-6](#472539_1_En_4_Chapter.xhtml#Fig6).\n\nHehe – I bet you didn’t\
    \ know a demo could be so friendly! Okay – yes, that was a terrible joke, but\
    \ leaving aside the content, our demo shows of a useful concept that is worth\
    \ coming to grips with when developing using Sass. Let’s take a look at that concept\
    \ in more detail.\n\n### Understanding How Our Code Works\n\nSo – what is that\
    \ concept that we speak of? It’s one of repetition – we have five items that form\
    \ a simple list: all of which need styling, but not all with the same values!\n\
    \nOur demo consists of five list items in a simple unordered list – as most of\
    \ the styles are similar, we only need write one instance of it and use a Sass\
    \ for loop to iterate through each item, in turn, to apply the appropriate styles:\n\
    \n```\n$rainbow: silver slategrey antiquewhite darkgrey gainsboro;\n@for $i from\
    \ 1 through 5 {\nli:nth-child(#{$i}) {\ncolor: nth($rainbow, $i);\nfont-size:\
    \ 32px;\nfont-weight: bold;\n}\n}\n```\n\nThe catch though is the color attribute\
    \ – as we want to apply different colors, we create a list, and assign this to\
    \ the variable `$rainbow`. In our for loop, we then count through this list and\
    \ apply a color to each in turn, which is formatted using string interpolation\
    \ (replacing `(#{$i})` with the appropriate number). When compiled, the code for\
    \ each of the list items will look something like the example shown in Figure\
    \ [4-7](#472539_1_En_4_Chapter.xhtml#Fig7).\n\n![../images/472539_1_En_4_Chapter/472539_1_En_4_Fig7_HTML.jpg](images/472539_1_En_4_Chapter/472539_1_En_4_Fig7_HTML.jpg)\n\
    \nFigure 4-7\n\nStyling a list item\n\nThis is a great way to apply styles, but\
    \ the key thing to remember is that of repetition – the items we are targeting\
    \ must be of the same type. In this instance, we were targeting list items; elements\
    \ of other types would have to be styled separately.\n\n### Looping Using `@each`\n\
    \nThis next looping function is a little more complex – it is not a loop function\
    \ as such, but we are looping through multiple items! Let me explain what I mean:\n\
    \nThe `@each` function allows us to set a variable to each item in a list or Sass\
    \ map – a list is just a comma-separated set of values. A map takes this up a\
    \ level – it allows us to assign multiple values to a single item, where they\
    \ relate to the same item. For example, we might be talking about a group of cars\
    \ – the properties could be color, make, model: these each apply to each car.\n\
    \nWe will revisit the subject of Sass maps in more detail, later in this chapter.\n\
    \nTo see what this means in practice, we’re going to create a simple demo that\
    \ sets up a number of buttons using the `@each` function – for each, we’re going\
    \ to specify the color and button function using a Sass list, then iterate through\
    \ each to create our final style rules."
