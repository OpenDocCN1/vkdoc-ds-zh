  trans: "\n### 理解已发生之事\n\n在本书的编写过程中，我们主要使用命令行来编译 Sass；在很多情况下，这已经足够完美了。然而，当我们必须手动运行编译过程时，这就会变得繁琐——我们可以使用\
    \ `--watch` 功能来自动化编译，但它仍然是一个独立的进程！\n\n正是由于这个原因，我们选择使用 Node.js 和 Gulp（作为任务运行器）——后者可以用来自动化数十种不同的任务，让我们可以专注于开发代码。在我们的案例中，我们使用了一个\
    \ `package.json` 文件来告知 Node.js 安装 Gulp、Autoprefixer（用于提供供应商前缀支持）、源地图支持，当然还有 Dart\
    \ Sass。值得注意的是，我们也可以使用其他任务运行器，例如 Grunt 甚至 Broccoli——这仅仅是个人偏好问题；它们各自都会以类似的方式工作。\n\
    \n注意——在此演示中，Gulp 默认安装在项目文件夹内以供使用；你可能更倾向于全局安装它，特别是如果你之前已经使用过它的话。有关如何执行此操作的详细信息，请参阅本书第\
    \ 1 章中的“自动化流程”演示。\n\n目前，我们的项目只有几个与编译过程绑定的包——这是为了保持现状的简单性，但我们很容易将其发展成更全面的东西。例如，我们可能会安装一个\
    \ CSS 检查工具，如 Stylelint（[`stylelint.io`](https://stylelint.io)），或者一个图片精灵工具（如 Spritesmith，可从\
    \ [`github.com/twolfson/gulp.spritesmith`](https://github.com/twolfson/gulp.spritesmith)\
    \ 获取）。但关键在于，只要我们考虑好各个步骤的顺序，就可以开始自动化那些价值较低、但显然是开发项目中必要组成部分的任务。\n\n好了，我们继续吧：希望你在上一个练习结束时没有看到任何错误？假设没有，那么我们就可以继续演示的下一部分：为我们的购物车添加至关重要的样式。\n\
    \n## 准备样式表\n\n是的：是时候让我们的演示看起来像样了！我们将这部分分为三个步骤——第一步处理一些简单的字体声明，第二步专注于变量声明，最后一步创建主样式表。\n\
    \n我们将从设置字体声明开始：它们对于演示并非必须，但包含它们是一种展示如何在 Sass 中将此类样式导入项目的有用方式。\n\n我们将使用的字体是 PT\
    \ Sans 和 Open Sans——它们包含在本书附带的代码下载中，或者你也可以分别从 FontSquirrel 网站 [`www.fontsquirrel.com/fonts/pt-sans`](https://www.fontsquirrel.com/fonts/pt-sans)\
    \ 和 [`www.fontsquirrel.com/fonts/open-sans`](https://www.fontsquirrel.com/fonts/open-sans)\
    \ 下载。让我们继续演示吧。\n\n### 准备字体\n\n我们从 Sass 样式表中最简单的部分开始——设置字体声明。我们将把它作为一个单独的文件或部分文件，在编译时将其导入主样式表：\n\
    \n1.  在一个新文件中，继续添加以下 PT Sans 字体的声明——这主要用于练习标题：\n\n    ```\n    @font-face {\n\
    \    font-family: 'pt_sansregular';\n    src: url('../font/pt_sansregular.woff')\
    \ format('woff');\n    font-weight: normal;\n    font-style: normal;\n    }\n\
    \    ```\n\n2.  接下来，留一行，然后添加以下三个 Open Sans 字体的声明——它们将在购物车的各个地方使用：\n\n    ```\n\
    \    @font-face {\n    font-family: 'open_sanslight';\n    src: url('../font/openSans-light-webfont.woff')\
    \ format('woff');\n    font-weight: normal;\n    font-style: normal;\n    }\n\
    \    @font-face {\n    font-family: 'open_sansregular ';\n    src: url('../font/openSans-regular-webfont.woff')\
    \ format('woff');\n    font-weight: normal;\n    font-style: normal;\n    }\n\
    \    @font-face {\n    font-family: 'open_sansbold';\n    src: url('../font/openSans-bold-webfont.woff')\
    \ format('woff');\n    font-weight: normal;\n    font-style: normal;\n    }\n\
    \    ```\n\n3.  将文件保存为 sass 文件夹中的 `_fonts.scss`——你现在可以关闭该文件，但我们稍后会在编译阶段再次用到它。\n\
    \n现在我们有了第一个导入文件——但我们还没有完成导入！我们还有第二个文件要设置，它将包含声明为变量的值，这些值将用在我们的主样式表中。此外，这个导入文件将使用多个\
    \ Sass 函数——我们稍后会详细介绍，但现在，让我们直接开始设置变量。\n\n你可能已经注意到 `fonts.scss` 文件名中使用了下划线——这是可选的；这是一种判断你处理的是部分文件还是主样式表的好方法。如果你更喜欢使用更传统的命名格式，可以省略它。\n\
    \n### 分配变量\n\n在本演示中，这个文件可能是我们创建的三个样式表文件中最重要的一——它包含我们使用的所有值，这些值都被分配为变量。没有它，我们的演示在代码编译后显然会看起来很糟糕！这个导入文件包含为我们的演示定义的所有颜色，以及字体属性的声明。\n"
- fmt: "### Initializing Our Variables\n\nLet’s make a start on setting up our file:\n\
    \n1.  In a new file, add the following block of variables – this takes care of\
    \ defining some of the base colors we’ll use in our demo:\n\n    ```\n    $color-black:\
    \ #000000;\n    $color-yellow: #ffdb4d;\n    $color-pure-red: #ff0000;\n    ```\n\
    \n2.  Next up, leave a line, then add the following lines of code – these colors\
    \ are for the remove hover link over the book and the main checkout button:\n\n\
    \    ```\n    // Cyans\n    $color-dark-cyan: #429188;\n    $color-moderate-cyan:\
    \ lighten(saturate($color-dark-cyan, 2.40), 10.39);\n    ```\n\n3.  Leave a line\
    \ blank, then add the following lines of code – they take care of the background\
    \ colors within each book article:\n\n    ```\n    // Whites\n    $color-white:\
    \ #ffffff;\n    $color-almost-white: darken($color-white, 1.18);\n    ```\n\n\
    4.  This last group of colors will be used primarily for borders and as a background\
    \ color for the total value:\n\n    ```\n    // Greys\n    $color-light-grey:\
    \ #eeeeee;\n    $color-description-grey: darken($color-light-grey, 13.33);\n \
    \   $color-very-light-grey: darken($color-light-grey, 7.06);\n    $color-dark-grey:\
    \ darken($color-light-grey, 33.33) ;\n    ```\n\n5.  We could use an ordinary\
    \ font such as Sans Serif, but that would look boring – to give our demo a little\
    \ extra lift, we assign four different font families to variables:\n\n    ```\n\
    \    // Font families\n    $pt-sans-family: 'pt_sansregular', sans-serif;\n  \
    \  $open-sans-light-family: 'open_sanslight', sans-serif;\n    $open-sans-regular-family:\
    \ 'open_sansregular', sans-serif;\n    $open-sans-bold-family: 'open_sansbold',\
    \ sans-serif;\n    ```\n\n6.  Our demo makes use of a solitary mixin – this takes\
    \ care of assigning the right font family, size, and color to use, based on the\
    \ given weight of the font:\n\n    ```\n    @mixin fontdetail ($color, $size,\
    \ $weight) {\n    @if $weight == 300 {\n    font-family: $open-sans-light-family;\n\
    \    } @else if $weight == 400 {\n    font-family: $open-sans-regular-family;\n\
    \    } @else {\n    font-family: $open-sans-bold-family ;\n    }\n    color: $color;\n\
    \    font: {\n    size: $size;\n    weight: $weight;\n    }\n    }\n    ```\n\n\
    7.  Go ahead and save the file as `_variables.scss` in the `sass` folder – you\
    \ can close the file for now, but we will return to it during the compilation\
    \ process.\n\nAlthough this import file isn’t that long, it does start to make\
    \ use of Sass functionality – for example, we’re using color functions to define\
    \ some of the colors used in the palette. It’s worth taking a moment to work through\
    \ this in greater depth; it will start to come together when we look at the main\
    \ style sheet. For now, let’s break down the code we’ve used in more detail.\n\
    \n#### Understanding the Imported Code in Detail\n\nIn the first partial file\
    \ we created, we assigned a number of `@font-face` declarations – these are used\
    \ depending on what font weight is assigned to a particular element. Each declaration\
    \ uses the standard format for `@font-face`; we’re merely making use of Sass’s\
    \ ability to import them into the master style sheet during compilation.\n\nIn\
    \ contrast, the second partial makes use of more Sass functions: we started with\
    \ defining a number of variables for colors used in the demo. We’ve used a mix\
    \ of static and dynamic values; it’s important to note that the order is critical,\
    \ as we make use of static variables to create subsequent colors.\n\nThe trick\
    \ to understanding how the functions work is something we covered back in Chapter\
    \ 4 – as a reminder, read the function from the inside out. So, for example, the\
    \ moderate cyan color used is first saturated by `2.4%`, before being lightened\
    \ by `10.39%`.\n\nThe reason the percentage values are so precise? The values\
    \ were generated using the Sass color tool at `http://razorltd.github.io/sasscolourfunctioncalculator/`\
    \ – this tool is worth its weight in gold, when it comes to creating colors!\n\
    \nMoving on, we then assigned four different font families to variables, based\
    \ on the fonts we set up in the first partial – we make use of PT Sans and Open\
    \ Sans, the latter of which is in light, bold, and regular type faces. The style\
    \ sheet is then closed out with a single mixin to assign the right font color,\
    \ weight, and size, based on the calling declaration in the main style sheet.\
    \ This uses an `@if...@else` statement to determine that we should use the Light\
    \ family for a font-weight value of `300`, the Regular family for `400`, and Bold\
    \ for a weight value of `700` or higher.\n\nIt’s at this point we should point\
    \ out a particular feature in use within this mixin – we have a nested property.\
    \ This is a simple way to group together multiple styles under a single name (or\
    \ namespace): each property within that nested block is automatically preceded\
    \ with the parent name. Take a look at Figure 6-1, where we’ve grouped two font\
    \ properties together – our Sassmeister example them compiles them into the `font-*`\
    \ properties we know in CSS.\n\n![../images/472539_1_En_6_Chapter/472539_1_En_6_Fig1_HTML.jpg](images/472539_1_En_6_Chapter/472539_1_En_6_Fig1_HTML.jpg)\n\
    \n**Figure 6-1** A namespaced nested property\n\n(In case you’re wondering – you\
    \ can do something similar with lots of properties in Sass, such as `border`,\
    \ `padding`, or `margin`!)\n\nOkay – it’s time, folks: we’re at the point where\
    \ we can create our master style sheet! If you’ve already read ahead and gasped\
    \ at the amount of code we’re going to cover, then don’t worry – it may look a\
    \ lot, but we’ll go through it bit by bit. Much of the code has been nested, with\
    \ descendant selectors within their respective parent elements – let’s dive in\
    \ and take a look at what we need to set up to make our demo work.\n\n### Setting\
    \ Up the Main Style Sheet\n\nThis is where all of the magic happens – there is\
    \ a fair amount of code, although if you scan through the code, you will hopefully\
    \ see that much of it has been nested. This makes it easier to read and understand\
    \ what has been assigned to each parent or descendant element.\n\nDepending on\
    \ which text editor you use, you may find you can collapse blocks of code – this\
    \ will also help make it easier to identify the main elements used in the demo."
