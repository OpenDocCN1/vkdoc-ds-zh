  trans: "好的，作为高级文档工程师和翻译员，我将严格按照您提供的注意事项和示例，将给定的英文文本翻译成中文。\n\n\n# 总结\n\n管理样式显然是构建任何在线项目的重要部分——我们不太可能一直只做非常小的网站；更有可能的是，我们会有一个冗长的样式表，如果不加小心管理，它很快就会陷入混乱！在本章中，我们介绍了一些有用的技巧，帮助使基于\
    \ Sass 的样式表更易于管理——让我们花点时间回顾一下本章的内容。\n\n我们从介绍如何开始将现有项目转换为使用 Sass 开始——在开始第一轮类型转换（使用在线提供的转换工具之一）之前，我们探讨了一些需要牢记的关键点。\n\
    \n接下来，我们讨论了如何开始将代码分解成更小、更易于管理的块，并作为其中的一部分，可以利用外部库来帮助缩短开发时间。我们探讨了使用这种方法时可能遇到的一些陷阱，以及如何通过精细的管理，开始将代码转变成更易于管理的形式。\n\
    \n然后，我们继续介绍了导入库的一个重要部分——优化过程，我们学习了两个关键技巧，以帮助开始习惯优化我们的代码。最后，我们通过一个实际案例结束了本章，该案例将一个大型样式表转换为可以在\
    \ Sass 中使用的形式，并了解到无论样式表有多大，我们仍然可以利用一些基本原则将其转换为使用 Sass。\n\n我们快要读完这本书了，但在那之前，是时候投入一个真正的项目了！Sass\
    \ 的用途数不胜数——几乎在任何有 CSS 的地方，都可以使用 Sass。在下一章中，我们将把本书中介绍的一些技能整合起来，并用它们来创建一个在任何电子商务网站上都能看到的东西——一个购物车。准备好开始了吗……？\n\
    \n# 6. 项目介绍\n\n在本书中，我们介绍了 Sass 的许多不同特性，并开始探索如何在项目中利用它们。然而，真正的考验来自于我们开始将所有内容整合在一起并构建一些更实用的东西时。问题是——我们应该构建什么？\n\
    \n嗯，考虑到我有着电子商务的背景，研究构建与电子商务相关的东西是有意义的，对吧？毕竟，根据 eMarketeer 在 2016 年的一项研究，电子商务预计将经历两位数的增长，直到\
    \ 2020 年——销售额预计将达到 27 万亿美元！我想到了“无需动脑”这个词……\n\n如果您想了解更多信息，该报告可在 eMarkeeter 网站上找到，网址为\
    \ [`https://bit.ly/2b9RZHd`](https://bit.ly/2b9RZHd)。\n\n除此之外，在接下来的几页中，我们确实将专注于一个与电子商务相关的主题——我们将制作一个演示版购物车。由于篇幅原因，我们将更多地关注\
    \ Sass 样式（因为它当然是本书的主题）；我们还会涉及一些用于驱动网站的 HTML 标记和 JavaScript。考虑到这一点，让我们开始设置我们的购物车——我们首先来看看如何设置开发环境并放置\
    \ HTML 标记。\n\n## 设置初始购物车\n\n在互联网时代，试图重新发明轮子似乎并不明智，对吧？网上有几十种购物车示例，它们各有特色，并使用各种技术来驱动。\n\
    \n出于此演示的目的，我选择基于 Žiga Miklič 创建的一个购物车，它使用纯 HTML 标记以及标准 CSS 和 jQuery 来驱动网站。我们的版本将转换为使用\
    \ Sass；我还简化了外观，并更新了 CSS，移除了一些过时的厂商前缀。这将带来额外的好处，向您展示如何将现有网站转换为使用 Sass，而不是从头开始构建解决方案。\n\
    \n您可以在 [`https://codepen.io/ziga-miklic/pen/xhpob`](https://codepen.io/ziga-miklic/pen/xhpob)\
    \ 查看此购物车的原始版本。\n\n好的——第一步是放置好我们的标记并设置编译过程。对于此演示，我们将使用 Node.js——这不仅是为了编译 Sass，也是为了添加源映射（将编译后的\
    \ CSS 转换为 Sass 代码中对应的源代码位置）。我们还将利用 Autoprefixer 自动添加任何厂商前缀——现在应该没有了，但这在使用 Sass\
    \ 时仍然是推荐做法。\n\n### 准备工作\n\n假设 Node.js 已安装，让我们开始：\n\n1.  首先，解压 `shoppingcart` 文件夹的副本——将其保存在我们的项目文件夹中。它包含了我们的标记（`shoppingcart.html`），以及演示所需的字体、图像和\
    \ JavaScript 文件。\n\n2.  接下来，以管理员身份启动一个 Node.js 终端会话，并将工作目录更改为我们在步骤 1 中保存的 `shoppingcart`\
    \ 文件夹。\n\n3.  启动一个 Node.js 终端会话，然后在提示符下输入此命令并按 Enter 键：`npm install`——这将使用提供的\
    \ `package.json` 文件安装一些包：\n    -   Gulp – 用于自动化任务，\n    -   Autoprefixer（用于 Gulp）–\
    \ 用于处理任何厂商前缀，\n    -   Dart Sass，\n    -   用于 Gulp 的 Sourcemaps – 用于提供源映射，将编译后的\
    \ CSS 转换为相关的源 Sass 代码。\n    \n    可能需要重新安装——它可能会显示一些警告，但为了此演示的目的，可以忽略这些警告。\n\n\
    4.  安装完成后，在提示符下输入 `gulp` 并按 Enter 键。\n\n5.  如果没有显示错误，那么您可以暂时关闭终端会话。\n\n此时，Gulp\
    \ 任务将运行，但 `css` 文件夹中不会出现任何内容——别担心：这样做看起来可能有点奇怪，但这纯粹是为了证明我们的编译过程正在工作！不过，这里有几个需要注意的地方，所以在继续设置样式表之前，让我们先暂停一下，更详细地了解一下初始设置。\n"
- fmt: "### Understanding What Has Happened\n\nOver the course of this book, we’ve\
    \ primarily used the command line to compile Sass; in many cases, this is perfectly\
    \ adequate. However, it becomes tedious as we must run the compilation process\
    \ manually – we can use the `--watch` facility to automate compilation, but it\
    \ is still a stand-alone process!\n\nIt’s for this reason that we’ve selected\
    \ to use Node.js and Gulp (as a task runner) – the latter can be used to automate\
    \ dozens of different tasks, leaving us to concentrate on developing our code.\
    \ In our case, we’ve used a `package.json` file to tell Node.js to install Gulp,\
    \ Autoprefixer (for vendor prefix support), source map support, and of course\
    \ Dart Sass. It’s worth noting that we could use a different task runner such\
    \ as Grunt or even Broccoli – this is just a matter of personal preference; each\
    \ will work in a similar manner.\n\nNote – in this demo, Gulp was installed for\
    \ use within the project folder by default; you may prefer to install it globally,\
    \ particularly if you’ve already used it previously. For details on how to do\
    \ this, please refer to the “Automating the Process” demo in Chapter [1](#472539_1_En_1_Chapter.xhtml)\
    \ of this book.\n\nFor the moment, our project only has a few packages tied into\
    \ the compilation process – this is to keep things simple for now, but we can\
    \ easily develop this into something more comprehensive. We might, for example,\
    \ install a CSS linting tool such as Stylelint ( [https://stylelint.io](https://stylelint.io)\
    \ ), or an image spriting tool (such as Spritesmith, available from [https://github.com/twolfson/gulp.spritesmith](https://github.com/twolfson/gulp.spritesmith)\
    \ ). The key though being that as long as we consider which steps should come\
    \ in which order, then we can begin to automate some of those tasks that have\
    \ less value, but which are clearly a necessary part of developing our projects.\n\
    \nOkay – let’s move on: hopefully you didn’t see any errors at the end of the\
    \ previous exercise? Assuming we didn’t, then we can continue with the next section\
    \ of our demo: adding the all-important styles for our cart.\n\n## Preparing Our\
    \ Style Sheet\n\nYes: it’s time to start making our demo look presentable! We’ll\
    \ break this into three parts – the first will take care of some simple font declarations,\
    \ with part two focusing on declaring variables, and the final part creating the\
    \ main style sheet.\n\nWe’ll start by setting up our font declarations: they are\
    \ not obligatory for the demo, but including them is a useful way to show how\
    \ we might import such styles into our project when using Sass.\n\nThe fonts we’ll\
    \ make use of are PT Sans and Open Sans – they are included in the code download\
    \ that accompanies this book, or you can download them from the FontSquirrel website\
    \ at [https://www.fontsquirrel.com/fonts/pt-sans](https://www.fontsquirrel.com/fonts/pt-sans)\
    \ and [https://www.fontsquirrel.com/fonts/open-sans](https://www.fontsquirrel.com/fonts/open-sans)\
    \ respectively. Let’s crack on with the demo.\n\n### Preparing The Fonts\n\nWe’ll\
    \ start with the simplest part of our Sass style sheet – setting up the font declarations.\
    \ This we will do as a separate file or partial, which we will import into the\
    \ main style sheet during compilation:\n\n1.  In a new file, go ahead and add\
    \ the following declaration for the PT Sans font – this is primarily for the exercise\
    \ title:\n\n    ```\n    @font-face {\n    font-family: 'pt_sansregular';\n  \
    \  src: url('../font/pt_sansregular.woff') format('woff');\n    font-weight: normal;\n\
    \    font-style: normal;\n    }\n    ```\n\n2.  Next, leave a line, then add the\
    \ following three declarations for the Open Sans font – these are used in various\
    \ places throughout the cart:\n\n    ```\n    @font-face {\n    font-family: 'open_sanslight';\n\
    \    src: url('../font/openSans-light-webfont.woff') format('woff');\n    font-weight:\
    \ normal;\n    font-style: normal;\n    }\n    @font-face {\n    font-family:\
    \ 'open_sansregular ';\n    src: url('../font/openSans-regular-webfont.woff')\
    \ format('woff');\n    font-weight: normal;\n    font-style: normal;\n    }\n\
    \    @font-face {\n    font-family: 'open_sansbold';\n    src: url('../font/openSans-bold-webfont.woff')\
    \ format('woff');\n    font-weight: normal;\n    font-style: normal;\n    }\n\
    \    ```\n\n3.  Save the file as `_fonts.scss` within the sass folder – you can\
    \ close the file for now, but we will revisit it later at the compilation stage.\n\
    \nWe now have the first of our import files in place – we aren’t done though with\
    \ imports! We have a second file to set up, which will contain values declared\
    \ as variables that we will use in our main style sheet. In addition, this imported\
    \ file will make use of several Sass functions – we’ll go into detail shortly,\
    \ but for now, let’s dive in and set up the variables.\n\nYou may have noticed\
    \ the use of the underscore in the `fonts.scss` filename – this is optional; it’s\
    \ a good way to tell if you’re working with a partial or the main style sheet.\
    \ It can be omitted if you prefer to use a more conventional naming format.\n\n\
    ### Assigning Our Variables\n\nThis file is probably the most important out of\
    \ all three of the style sheet files we create in this demo – it contains all\
    \ of the values we use, assigned as variables. Without it, our demo will clearly\
    \ look like rubbish when the code is compiled! This import contains all of the\
    \ colors defined for our demo, along with declarations for font attributes."
  raw: "### Understanding What Has Happened\n\nOver the course of this book, we’ve\
    \ primarily used the command line to compile Sass; in many cases, this is perfectly\
    \ adequate. However, it becomes tedious as we must run the compilation process\
    \ manually – we can use the `--watch` facility to automate compilation, but it\
    \ is still a stand-alone process!\n\nIt’s for this reason that we’ve selected\
    \ to use Node.js and Gulp (as a task runner) – the latter can be used to automate\
    \ dozens of different tasks, leaving us to concentrate on developing our code.\
    \ In our case, we’ve used a `package.json` file to tell Node.js to install Gulp,\
    \ Autoprefixer (for vendor prefix support), source map support, and of course\
    \ Dart Sass. It’s worth noting that we could use a different task runner such\
    \ as Grunt or even Broccoli – this is just a matter of personal preference; each\
    \ will work in a similar manner.\n\nNote – in this demo, Gulp was installed for\
    \ use within the project folder by default; you may prefer to install it globally,\
    \ particularly if you’ve already used it previously. For details on how to do\
    \ this, please refer to the “Automating the Process” demo in Chapter [1](#472539_1_En_1_Chapter.xhtml)\
    \ of this book.\n\nFor the moment, our project only has a few packages tied into\
    \ the compilation process – this is to keep things simple for now, but we can\
    \ easily develop this into something more comprehensive. We might, for example,\
    \ install a CSS linting tool such as Stylelint ( [`https://stylelint.io`](https://stylelint.io)\
    \ ), or an image spriting tool (such as Spritesmith, available from [`https://github.com/twolfson/gulp.spritesmith`](https://github.com/twolfson/gulp.spritesmith)\
    \ ). The key though being that as long as we consider which steps should come\
    \ in which order, then we can begin to automate some of those tasks that have\
    \ less value, but which are clearly a necessary part of developing our projects.\n\
    \nOkay – let’s move on: hopefully you didn’t see any errors at the end of the\
    \ previous exercise? Assuming we didn’t, then we can continue with the next section\
    \ of our demo: adding the all-important styles for our cart.\n\n## Preparing Our\
