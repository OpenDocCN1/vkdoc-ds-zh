    \ the `automate` folder, as shown in Figure [1-7](#472539_1_En_1_Chapter.xhtml#Fig7).\n\
    \n    ```\n    npm install\n    ```\n\nThe warnings about `fsevents` and deprecated\
    \ packages can be ignored for the purposes of this exercise.\n\nAt this stage,\
    \ our automated process is set up; let’s put it to the test by editing our test\
    \ file, and watch it compile. For this next step, I would recommend having the\
    \ `sass` and `css` folders open on screen, along with our terminal session:\n\n\
    1.  Take a look inside the `css` folder – you will now see a newly compiled style\
    \ sheet and `map` folder, which contains our source map file.\n\n1.  Go ahead\
    \ and enter `gulp` at the prompt, then press Enter.\n\n2.  The initial default\
    \ task is run – this can be ignored. Open `test.scss` in the `sass` folder, and\
    \ change the hex code assigned to `$primary-color` to `#dcdcdc` (a light gray\
    \ color) .\n\n3.  Save the change – if all is well, Gulp’s watch facility will\
    \ kick in and automatically recompile our code, as shown in Figure [1-8](#472539_1_En_1_Chapter.xhtml#Fig8).\n\
    \n    ![../images/472539_1_En_1_Chapter/472539_1_En_1_Fig8_HTML.jpg](images/472539_1_En_1_Chapter/472539_1_En_1_Fig8_HTML.jpg)\n\
    \n    Figure 1-8\n\n    Recompiling our code automatically\n\nHopefully that wasn’t\
    \ too painful – it may seem like a good few steps, but it opens up a host of possibilities\
    \ for later development. That aside, our process covers a number of key points\
    \ that we should be aware of, so let’s dive in and break down what happened in\
    \ more detail."
  trans: "\n### 做出选择\n\n我相信大家心中都有这样一个问题：面对这么多选项，我该如何选择使用哪一个？\n\n简短而直接的答案是：视情况而定。我知道这听起来可能像是在推脱，但\
    \ Sass 的编译方式没有绝对的对错。这完全取决于你已经安装了哪些工具、你习惯使用什么，以及（在较小程度上）你使用哪个平台。\n\n例如，如果你喜欢直观的操作方式，那么使用带有专属支持功能的编辑器（如\
    \ Prepos）会是不错的选择。不过，如果你恰好在使用 Node.js，那么考虑调整你的工作流程，加入编译 Sass 的步骤就很有意义。同样，你可能根本不想额外安装任何东西——在这种情况下，使用终端方法是最简单的途径（而且无需安装！）。关键在于，编辑\
    \ Sass 的方法有很多种——不要害怕尝试不同的应用程序，直到找到你喜欢且适合你的那一款。\n\n为了本书的编写目的，我将使用终端方法来保持简洁，并将重点放在\
    \ Sass 代码上，而不是编译过程——如果你更喜欢使用可视化编辑器，请随意切换。\n\n好了——我们继续吧；流程中还有另一个部分需要考虑。还记得我说过每次都手动重新编译代码会很麻烦吗？我们可以使用像\
    \ Gulp 这样的任务运行器来自动化这个过程——让我们来更详细地了解一下具体内容。\n\n## 自动化流程\n\n虽然手动编译 Sass 代码适合轻量级开发，但对于规模稍大的项目很快就会变得令人头疼！当然必须有更好的方法……绝对有——我们可以使用像\
    \ Koala 或 Prepos 这样的专用应用程序，甚至可以直接在浏览器中使用 SassMeister 进行编译。然而，在应用程序之间来回切换会变得繁琐，而且还会增加代码出错的风险！\n\
    \n还有另一种选择：为什么不*自动化*编译过程呢？当然，这对于开发 Sass 代码来说并非必需，但创建能够处理编译这类低价值任务的东西，有几个好处：\n\n\
    * 我们可以将其设置为在后台运行——我们对代码所做的任何更改都会自动编译；\n* 我们可以在流程中关联其他任务，例如压缩 JavaScript 文件或为样式规则添加供应商前缀；\n\
    * 它免去了我们参与低价值任务的需要，让我们有更多时间处理重要事务。\n\n考虑到这一点，我们的下一个练习将使用 Gulp 和`gulp-dart-sass`包来设置一个自动编译流程，后者是\
    \ Dart Sass 库的包装器。安装并运行后，它将愉快地在后台运行；一旦检测到 Sass 文件发生更改，它就会自动将其编译成有效的 CSS 样式表文件。让我们更详细地了解一下具体内容。\n\
    \n### 自动化流程\n\n像 Gulp 这样的任务运行器需要使用 Node.js 运行时环境来安装——该环境适用于 Windows、Mac 和 Linux\
    \ 平台，其他平台也有可用的二进制文件。我们需要执行几个步骤，让我们开始吧：\n\n![../images/472539_1_En_1_Chapter/472539_1_En_1_Fig7_HTML.jpg](img/472539_1_En_1_Fig7_HTML.jpg)\n\
    \n图 1-7\n\n安装我们的包\n\n1. 第一步是安装 Node.js——为此，请前往[`https://nodejs.org`](https://nodejs.org)，下载适合你平台的版本。如果出现提示，请接受所有默认设置；这对于本练习的目的来说已经足够了。\n\
    \n2. 安装完成后，启动一个终端会话，输入以下命令以确认 Node 和 NPM 已成功安装：\n\n   ```\n   node –v && npm –v\n\
    \   ```\n\n   如果一切顺利，Node 将返回`v8.11.3`或更高版本，而 NPM（Node 的包管理器）将显示`5.6.0`或更高版本。\n\
    \n3. 接下来，在提示符处运行以下命令——它会关闭`package-lock.json`文件的创建，这是 NPM 5 或更高版本的新功能，但在本书的演示中并不需要：\n\
    \n   ```\n   npm config set package-lock false\n   ```\n\n4. 现在，将`automate`文件夹的副本解压到你的项目区域。\n\
    \n5. 我们还有一些东西要安装，为此，启动终端会话，首先运行以下命令——这将安装 Gulp 的依赖项：\n\n   ```\n   npm install\
    \ –g gulp-cli\n   ```\n\n6. 完成后，继续在提示符处运行以下命令——这将安装我们在`automate`文件夹中复制过来的`package.json`文件中列出的其余包（Sass、Gulp、Sourcemap\
    \ 支持和用于 Gulp 的 Autoprefixer——一个 PostCSS 工具，但能与标准 CSS 很好地配合），如图 1-7 所示。\n\n   ```\n\
    \   npm install\n   ```\n\n   关于`fsevents`和废弃包的警告可以忽略，这对本练习没有影响。\n\n至此，我们的自动化流程已经设置完毕；让我们通过编辑测试文件并观察其编译过程来测试一下。在下一步中，我建议在屏幕上打开`sass`和`css`文件夹以及终端会话：\n\
    \n1. 查看一下`css`文件夹——你现在会看到一个新编译的样式表和`map`文件夹，其中包含我们的源映射文件。\n\n2. 在提示符处输入`gulp`，然后按回车键。\n\
    \n3. 初始默认任务会运行——这可以忽略。打开`sass`文件夹中的`test.scss`，将分配给`$primary-color`的十六进制代码更改为`#dcdcdc`（一种浅灰色）。\n\
    \n4. 保存更改——如果一切顺利，Gulp 的监视功能就会启动并自动重新编译我们的代码，如图 1-8 所示。\n\n   ![../images/472539_1_En_1_Chapter/472539_1_En_1_Fig8_HTML.jpg](img/472539_1_En_1_Fig8_HTML.jpg)\n\
    \n   图 1-8\n\n   自动重新编译我们的代码\n\n希望这不会太痛苦——步骤可能看起来不少，但它为后续开发打开了众多可能性。除此之外，我们的流程涵盖了多个我们应该注意的关键点，所以让我们深入探讨并分解一下具体发生了什么。\n"
- fmt: '### Breaking Down Our Process


    Over the course of the last few pages, we’ve created a basic system that can automatically
    compile Sass, using the power of Node.js (and its package manager, NPM). To achieve
    this, we’ve installed Node and some NPM packages using some preconfigured instruction
    files. Let’s take a look at these instruction files in detail, starting with `package.json`.


    The `package.json` file contains details of all of the packages we will use –
    in this case, we’ve specified Gulp as our task runner, along with `gulp-sourcemaps`
    (to provide source maps), our obligatory `gulp-dart-sass` (for Sass support),
    and `gulp-autoprefixer` (to add or remove vendor prefixes as needed). You will
    notice that the exercise didn’t run through the install for each separately: this
    is by design. It’s more efficient to run `npm install` that will look for the
    presence of any `package.json` file in the same folder and install listed packages
    within, by default. It does require some pre-work to create our `package.json`
    file beforehand, but this will simplify the installation process.


    Exploring the specifics of setting up the `package.json` is outside of the scope
    of this book – if you are interested in learning more, then I would recommend
    heading over to [`https://docs.npmjs.com/getting-started/using-a-package.json`](https://docs.npmjs.com/getting-started/using-a-package.json)
    for more details.


    Once the packages were installed, we then made use of the `gulpfile.js` file to
    perform the compilation. This file contains a set of instructions to perform each
    time it detects the presence of a file change within our targeted folder. Let’s
    take a look at that code, starting with a handful of declarations – the first
    is to enforce strict error checking:


    ```

    ''use strict'';

    ```


    We then set up some require declarations to various packages, which are called
    as and when required:


    ```

    var gulp = require(''gulp'');

    var sass = require(''gulp-dart-sass'');

    var sourcemaps = require(''gulp-sourcemaps'');

    var autoprefixer = require(''gulp-autoprefixer'');

    ```


    The next block down is our sass task – this takes care of compiling our source
    files into valid CSS style sheet files:


    ```

    gulp.task(''sass'', function () {

    return gulp.src(''sass/*.scss'')

    .pipe(autoprefixer({ browsers: [''last 2 versions''] }))

    .pipe(sourcemaps.init(''/maps''))

    .pipe(sass().on(''error'', sass.logError))

    .pipe(sourcemaps.write(''./maps''))

    .pipe(gulp.dest(''./css'')) ;

    });

    ```


    It starts off by targeting files in the `sass` folder with the `scss` extension;
    this is to prevent the compiler from trying to work on files that are not valid
    Sass source files! The next step is to then add vendor prefixes for CSS properties
    that are yet to be standardized; in this case, we’re supporting the latest two
    releases of each browser.


    The next step is the crucial one – this takes care of the compilation process;
    it will either compile our file or display any errors it encounters on screen.
    We then finish off by creating the appropriate source map file (in a similar way
    to when we compiled in a terminal session), before writing the files to disk (in
    the `css` subfolder).


    As an aside – by default, the output format will be expanded; if we want to change
    the output format, then alter the code as indicated: `sass({outputStyle: ''compressed''})`.


    None of this will work without the final task – the `default` one runs as soon
    as we enter `gulp` at the terminal session prompt. This watches out for any Sass
    files within the `sass` folder; any changes made will trigger the sass task:


    ```

    gulp.task(''default'', function () {

    gulp.watch(''sass/*.scss'', [''sass''])

    .on(''change'', function(evt) {

    console.log(

    ''\n[watcher] File '' + evt.path.replace(/.*(?=sass)/,") +

    '' was '' + evt.type + '', compiling...''

    );

    });

    });

    ```


    As soon as a change is made, we call a small function to display a message to
    confirm a named file has been changed; the code is then recompiled before saved
    to disk as new style sheet and map files.


    Ultimately this might seem a lot of work to get set up, but it is important to
    note that you may have part of this in place already. It’s just one way of automating
    our compilation process; you might prefer to use something like Grunt or Webpack
    instead. The aim, though, is to consider what you may or may not already have,
    whether you have any preferences (if you’ve used a task runner before), and to
    decide if the nature of your projects mean that you can benefit from automating
    the process.


    As an aside, it’s worth noting that I will use this process for exercises throughout
    this book, unless specified otherwise. This is just personal preference; please
    feel free to use whichever compilation process works best for you.


    Right – enough chitchat: time to change tack! Hopefully you’ll have tried a few
    options and have found something that works for you, or is at least working. It’s
    time we focused more on Sass itself, so without further ado, let’s begin with
    covering some of the key terms you will meet when working with Sass.'
