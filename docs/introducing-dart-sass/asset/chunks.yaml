  trans: "\n# 3. 创建嵌套样式\n\n如果你花时间编写过 CSS 样式，我毫不怀疑你迟早会遇到代码中包含多层级选择器或类的情况。这是什么意思呢？好吧，让我来解释一下。\n\
    \n以导航栏为例。导航栏已经存在多年——它是网站的基本组成部分，尽管我们决定如何美化它的方式在不同网站上会有所差异。然而，其基本原理是使用可以多层级嵌套的无序列表：\n\
    \n```\n标题 1\n\n测试链接\n测试链接\n测试链接\n测试链接\n\n标题 2\n\n标题 3\n\n测试链接\n测试链接\n测试链接\n测试链接\n\
    ```\n\n诚然，我们的例子有点过于简单，但希望你明白了其中的意思！要为我们的示例添加样式，我们会使用以下类：\n\n```\nnav {...}\nnav\
    \ li a {...}\nnav li ul {...}\nnav li ul li a {...}\n```\n\n注意到每个样式之间的相似之处了吗？比如说，一些元素名称是不是重复出现了……？\n\
    \n我们使用的元素名称相当简短，但如果我们决定引用更长的类名（例如 `ul.navigation li a.about ul li a`），那么我们的代码很快就会变得难以阅读。这会造成一个真正的问题——有没有更好的方法呢？值得庆幸的是，借助\
    \ Sass 的强大功能，我们确实有——让我向你介绍嵌套的概念。\n\n## 解析嵌套概念\n\n简单来说，当元素之间存在清晰的共性时，嵌套允许我们在其他样式中存储（或嵌套）样式。这意味着我们不必为每条规则完整写出类或选择器，而只需包含嵌套规则特有的部分。在编译时，Sass\
    \ 会通过引用父选择器或类，将每条声明转换为有效的规则。为了让你明白我的意思，让我们用我们的简单示例并将其转换为 Sass：\n\n```\nnav {\n\
    ...\nli {\na {...}\nul {...}\nli a {...}\n}\n}\n```\n\n你看——这样读起来是不是更容易了？嵌套是一个很好的省时工具，因为它有助于减少我们重复相同选择器的次数；并且在阅读代码时，它也感觉更自然、更容易理解。\n\
    \n让我们付诸实践，创建——是的，你可能已经猜到接下来要做什么了：一个基本的导航！在开发 Sass 时，任何时候都可以使用嵌套——只要我们有多个引用相同父元素或类的样式，就可以应用嵌套。巧合的是，导航非常适合嵌套，所以让我们深入探讨，看看它在实践中是如何运作的。\n\
    \n### 创建一个简单的菜单栏\n\n让我们开始创建我们的演示：\n\n![../images/472539_1_En_3_Chapter/472539_1_En_3_Fig1_HTML.jpg](img/472539_1_En_3_Fig1_HTML.jpg)\n\
    \n图 3-1\n\n使用嵌套创建基本菜单\n\n1. 我们首先从本书附带的代码下载中下载并解压 `nesting` 文件夹的副本——将其保存到我们的项目区域。\n\
    \n2. 接下来，启动你的文本编辑器——我们将添加演示所需的样式。\n\n3. 我们将分块添加所需的代码——继续为我们的演示添加以下基本样式：\n\n  \
    \  ```\n    @font-face {\n    font-family: 'pt_sansregular';\n    src: url('../font/pt_sansregular.woff')\
    \ format('woff');\n    font-weight: normal;\n    font-style: normal;\n    }\n\
    \    body {\n    font-family: 'pt_sansregular', sans-serif;\n    padding: 20px;\n\
    \    }\n    h1 {\n    font-size: 20px;\n    }\n    ```\n\n4. 我们演示的核心是我们正在创建的导航栏——为此，在前面的\
    \ `h1` 标签下方添加以下样式规则，并在该标签后留一行空行：\n\n    ```\n    nav {\n    width: 600px;\n  \
    \  }\n    ```\n\n5. 接下来，我们需要为构成导航的无序列表添加样式规则——为此，在 `width: 600px` 声明后面留一个空行，然后添加：\n\
    \n    ```\n    ul {\n    list-style: none;\n    margin: 0 3%;\n    padding: 0;\n\
    \    }\n    ```\n\n6. 有了无序列表容器之后，我们现在可以设置每个菜单项的样式——为此，在上一步的右花括号后留一个空行，然后添加：\n\n\
    \    ```\n    li {\n    display: inline-block;\n    padding-right: 10px;\n   \
    \ }\n    ```\n\n7. 为了使我们的导航生效，我们需要为每个条目添加链接——继续在第 6 步的右花括号后留一个空行，然后添加这些样式：\n\n\
    \    ```\n    a {\n    background-color: #faebd7;\n    border: 1px solid #ccc;\n\
    \    color: #666;\n    display: block;\n    padding: 6px 12px;\n    text-decoration:\
    \ none;\n    font-size: 32px;\n    }\n    a:hover, a:focus{\n    background-color:\
    \ darken(#faebd7, 20%);\n    }\n    a:active {\n    background-color: #666;\n\
    \    border-color: #666;\n    color: #efefef;\n    }\n    ```\n\n8. 将文件另存为 `scss`\
    \ 文件夹中的 `nesting.scss`。\n\n9. 接下来，启动终端会话，并将工作文件夹更改为项目区域下的 `nesting` 文件夹。\n\n10.\
    \ 在提示符下，键入以下命令并按回车：\n\n    ```\n    sass sass\\nesting.scss css\\nesting.css\n\
    \    ```\n\n11. 如果一切顺利，我们应该会在 `css` 文件夹中看到一个 `nesting.css` 文件，以及一个源映射文件。\n\n12.\
    \ 如果在浏览器中预览结果，我们会看到一个包含样式化元素的简单框，如图 3-1 所示：\n\n看到嵌套代码有多么简单了吗？嵌套的基本原理很直接，但应用嵌套的真正考验在于确保使用正确的父选择器，以便任何嵌套的样式名称尽可能短，并将重复降到最低。为了让你明白我的意思，让我们花一点时间更详细地探讨我们的演示代码，这样你就可以看到我们是如何得出代码中所用结构的。\n\
    \n## 解析我们的代码\n\n好吧，我承认，上一段开头的说法可能有点武断，但实际上，嵌套并不是一种难以理解的技术。技巧在于确保我们选择正确的选择器来构成嵌套的基础。让我们更详细地分析一下我们的例子：\n\
    \n我们开始这个演示时设置了一些样式来辅助演示的呈现——演示的核心从第 17 行的初始 `<nav>` 声明开始。我们需要应用于 `<nav>` 元素的任何样式都直接位于其下；子规则的样式则简单地缩进在这个初始声明下方。在我们的案例中，这意味着\
    \ `ul`、`li` 和 `a`（及其伪类）都只缩进到第一级。它们会变成 `nav ul`、`nav li`、`nav a` 等等——Sass 会理解 `nav`\
    \ 在这个实例中是公共元素，因此充当父元素。\n"
- fmt: '# Working a More Complex Example


    Our previous example was hosted at the first level (or indent) – in many cases
    this may work for your projects, but what if we needed to go a level lower (as
    we had more subclasses to contend with)?


    Well, we can nest more deeply using Sass, although a word of caution – a good
    rule of thumb is to nest no more than two or three levels deep. Anything else
    is technically possible, but I would not recommend it – the level of CSS specificity
    will be too deep, and a good indicator that we should revisit how our style class
    names are structured.


    Assuming we’re nesting to sensible levels, then this is an example of how a nested
    block of code to three levels might work:


    ```

    .sidebar {

    position: fixed;

    height: 100%;

    &-list {

    background-color: white;

    &-link {

    text-decoration: none;

    }

    }

    }

    ```


    In this case, the common element is `.sidebar`; all three styles use this in their
    names. However, I see an ampersand and hyphen at the start of two of the names
    – what’s that all about? These are placeholders – in this instance, the second-
    and third-level class names will become `.sidebar-list` and `.sidebar-list-link`
    respectively.


    We’ll cover placeholders in this context in a little more detail later in this
    chapter, in “Referencing Parent Selectors.”


    Okay – to use a common driving expression, it’s time to change lanes: nesting
    is a great technique to learn, but it is not without some quirks. Let’s take a
    look at a few to see what I mean – for now, you may not come across them when
    starting out with Sass, but sooner or later they may well rear their ugly heads,
    so to speak ...


    # Exploring the Pitfalls of Nesting


    Take a look at the code example in the previous section again – we mentioned in
    the previous section that it would create three rules, and Figure [3-2](#472539_1_En_3_Chapter.xhtml#Fig2)
    indeed confirms this is the case.


    ![../images/472539_1_En_3_Chapter/472539_1_En_3_Fig2_HTML.jpg](images/472539_1_En_3_Chapter/472539_1_En_3_Fig2_HTML.jpg)


    Figure 3-2


    Our compiled example, using Sassmeister


    Our code has compiled to valid CSS, producing three example rules from code that
    is nested to three levels deep. This works very well, but can lead us into a false
    sense of security! There are advantages and drawbacks to using nesting, if we’re
    not careful, so let’s take a look at the downsides first as these are the easiest
    to explain.


    ## Is Nesting a Bad Thing?


    Let’s say we’re using the following code:


    ```


    Some text


    ```


    This produces overly specific CSS code – to reference the `a` tag inside this
    block of code, we would have to use `main.one.two.a` as a CSS rule:


    ```

    main {

    .one {

    .two {

    a {color: red}

    }

    }

    }

    ```


    This level of specificity is not recommended and should be avoided, as it makes
    our CSS very tightly coupled to our HTML structure. To override this code, we
    would have to create even more specific CSS to change this code; this only serves
    to compound the original problem! What doesn’t help is that if you had nested
    this code using Sass, it would make it appear as if you had styled a simple link.
    The reality is that Sass just hides the problem, which will still produce the
    same overly specific code during compilation.


    Ultimately, nesting can be a great feature when used with care – as a general
    rule of thumb, I would recommend using no more than three levels of nesting. This
    keeps the code simple and easy to read, and it won’t produce overly specific code
    that would otherwise create problems later during development.


    ## Exploring the Benefits of Nesting


    Ouch – one might be forgiven for thinking that nesting isn’t that great, particularly
    after that warning! The truth though is that like any tool used responsibly, it
    can have a very positive impact on your code.


    In this instance, the principal benefit of using nesting is in producing code
    that is easier to read and maintain. Nesting allows us to group all of the child
    selectors that inherit from a parent together; it also saves on typing, as we
    don’t have to write the parent selector in front of each child selector at the
    same time. The trick of course is to make sure we don’t nest our code too deeply
    – it may be tempting to go to the extreme, but remember: nesting doesn’t fix bad
    code – if you put rubbish in, then you will only get rubbish out!


    Okay – let’s move swiftly on: if we’re nesting code using Sass, then you might
    assume that this can cover pseudo-selectors, such as `:hover` and `:focus`, right?
    Unfortunately not – this will throw an error if you try to nest them in this way.
    Fortunately there is a solution to this – we need to tweak how we reference them
    when nesting our code. Let’s take a look at what is involved in more detail.


    # Referencing Parent Selectors


    When nesting Sass statements, many will fit in where there is already duplication
    within our code. However, you will no doubt be using pseudo-selectors of some
    description in your code – what about these?


    Well, Sass can nest them too – instead of simply indenting them in the same way
    as normal statements, we have to put a placeholder character immediately before
    the colon. Take for example the extract of code shown in Figure [3-3](#472539_1_En_3_Chapter.xhtml#Fig3).


    ![../images/472539_1_En_3_Chapter/472539_1_En_3_Fig3_HTML.jpg](images/472539_1_En_3_Chapter/472539_1_En_3_Fig3_HTML.jpg)


    Figure 3-3


    Our code, before the update ...


    This shows all three styles (`a`, `a:hover`, and `a:focus`) written out in full
    – it’s perfectly valid code, but is a little wasteful on space, and repeats the
    selector name. Instead, we can simply nest each style – to show you how this works,
    we can dive into a quick demo to update the code from the previous menu exercise.'
