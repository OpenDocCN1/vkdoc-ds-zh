- fmt: "# Taking Care Over Variable Names\n\nNames, names – surely all we need is\
    \ something to identify a value, right ...?\n\nWell, yes – and no. Sure, any name\
    \ we give must give some indication of what it relates to, but there is more to\
    \ it than that when using Sass. Let me explain what I mean:\n\nIn our example,\
    \ we’ve used the format `$color-XXXXX` to name three colors. By themselves, they\
    \ seem reasonable: there’s something of a naming convention in place, and the\
    \ format is consistent.\n\nBut – I’m sure we know what `dimgrey` is as a color:\
    \ Could you tell what `gainsboro` is though? All three colors are various shades\
    \ of gray; however, what indication do we have that this is the case? None – to\
    \ get around this, there are a couple of changes we can consider making:\n\n*\
    \ When creating colors, consider reordering the names used, so instead of `$color-dimgrey`,\
    \ have something such as `$grey-dim`, or `$grey-dark`. This makes the name more\
    \ modular – we’re sharing common terms, and describing their function means we’re\
    \ going from generic to specific, in much the same way as CSS works with specificity.\n\
    \n* We can take it a step further though – instead of putting the color directly\
    \ into our Sass rules, we can create a variable to describe the color according\
    \ to its function in our code. When it comes to editing, most editors will automatically\
    \ display suggested colors, based on what we’ve defined in our variable list.\
    \ So, to rewrite our previous example, it would look something like this:\n\n\
    \    ```\n    $grey-dim: #696969;\n    $color-title: $grey-dim;\n    section span\
    \ { color: $color-title; font-size: 20px; font-weight: bold; }\n    ```\n\n* It\
    \ has the added bonus that if we decide to change the shade of color for `$color-title`,\
    \ then we can do this in one go: we only need to change one entry, rather than\
    \ change multiple entries throughout our code.\n\nThere is not necessarily any\
    \ right or wrong way to write variables, particularly where colors are involved;\
    \ it makes sense, though, to ensure you use a consistent naming convention. Making\
    \ it modular, as we have done here, means that we can even define a small palette\
    \ of colors and use functions to create completely different colors!\n\nTo see\
    \ what I mean, check out the examples by Jackie Balzer at [`http://jackiebalzer.com/color`](http://jackiebalzer.com/color)\
    \ – all of them have been created from just one color - `#f8af1e`, or a deep shade\
    \ of yellow. We’ll revisit this idea in Chapter [4](#472539_1_En_4_Chapter.xhtml),\
    \ “Calculating Values Using Observations.”\n\nThere is a more serious side though\
    \ to using variables – when writing code for this book, I came across the compilation\
    \ error shown in Figure [2-4](#472539_1_En_2_Chapter.xhtml#Fig4).\n\n![../images/472539_1_En_2_Chapter/472539_1_En_2_Fig4_HTML.jpg](images/472539_1_En_2_Chapter/472539_1_En_2_Fig4_HTML.jpg)\n\
    \nFigure 2-4\n\nDealing with a compilation error\n\nAt first glance it looks a\
    \ little blunt, but in reality, there is a simple cause.\n\nIn this example, I\
    \ had used the `--watch` parameter to automatically compile the code when changes\
    \ were made. However, the colors used in the demo weren’t suitable; I had to change\
    \ them. I’d removed the `$color-antiqueyellow` variable but not updated a rule\
    \ that still referred to this variable. Sass quite rightly complained – the fix,\
    \ of course, is to make sure the style rule is updated.\n\nIn this case, if we\
    \ had used the example we covered at the start of this section, then potentially\
    \ we could avoid generating the error – as long as we don’t remove one of the\
    \ other variables too! Variables make managing code much easier, but it does pay\
    \ to take care over the use of a naming convention, and how your code is updated\
    \ during development.\n\n# Adding Comments\n\nUp until now, we’ve written very\
    \ simple CSS rules – the rule name should be reasonably self-explanatory as to\
    \ how it might be used. Trouble is, what happens if we start to add more and more\
    \ rules, particularly if some of those rules aren’t as self-explanatory?\n\nClearly,\
    \ we need comments – thankfully Sass supports them in much the same way as we\
    \ would use them in CSS. There are a couple of things we need to be aware of though:\n\
    \n* If we use single line comments, these will be removed by default at compilation;\n\
    * If we use multi-line comments, these will be removed if the output style is\
    \ set to compressed, but left untouched when set to expanded.\n\nTo see what I\
    \ mean, let’s dive in and put this to the test.\n\n## Compiling Comments\n\n1.\
    \ Try running the compile command, but this time with a slight change:\n\n   \
    \ ```\n    sass --style=compressed sass\\variables.scss css\\variables.css\n \
    \   ```\n\n    If we take a look at the compiled file, notice how it has disappeared?\n\
    \n2. This time, try replacing the multi-line comment with this single line one:\n\
    \n    ```\n    // This is a test comment\n    @font-face {\n    ```\n\n3. Try\
    \ compiling the code now – notice how the comment is removed, and that if you\
    \ run the compilation again with `style=compressed` attribute set, the comment\
    \ is still removed.\n\n1. Go ahead and open up one of the Sass files from a previous\
    \ demo – I’ve used the one from the variables folder.\n\n2. Add the following\
    \ code as highlighted, then save the file:\n\n    ```\n    /* This is a test comment\n\
    \    * over several lines, which\n    * uses the standard CSS comment\n    * syntax,\
    \ and will appear in\n    * compiled output */\n    $color-gainsboro: #c0c0c0;\n\
    \    ```\n\n3. Next, fire up a terminal session and change the working folder\
    \ to the `variables` folder under our project area.\n\n4. At the prompt, type\
    \ the following command and press Enter:\n\n    ```\n    sass sass\\variables.scss\
    \ css\\variables.css\n    ```\n\n5. If all is well, we should see a `variables.css`\
    \ and source map files appear in the `css` folder as before – if you open it up\
    \ this time though, you will see the comment appear at the start of our style\
    \ sheet (Figure [2-5](#472539_1_En_2_Chapter.xhtml#Fig5)).\n\n    ![../images/472539_1_En_2_Chapter/472539_1_En_2_Fig5_HTML.jpg](images/472539_1_En_2_Chapter/472539_1_En_2_Fig5_HTML.jpg)\n\
    \n    Figure 2-5\n\n    The results of compiling with comments\n\nSee how easy\
    \ it is to manage comments? Adding comments is an important part of writing a\
    \ style sheet; the key point though is that we should be careful about which style\
    \ of comment to use, so that we strike the right balance between adding comments\
    \ throughout our source, and those that remain in our compiled style sheet. Okay\
    \ – time for us to change tack: let’s take a look at our next feature in Sass.\
    \ How many times have you written code that could be reusable, with or without\
    \ tweaking it?\n\n# Making Use of Standard Mixins\n\nIf you spend time writing\
    \ CSS, I am sure you will come across occasions where it can get a little tedious\
    \ – creating font styles, animating using `transform`, scalable elements such\
    \ as videos, dealing with vendor prefixes (where they still apply), and the like.\n\
    \nTo remove some of this tedium, we can make use of a great feature in Sass: mixins.\
    \ These allow us to group together CSS declarations into blocks of code that we\
    \ can reuse throughout our projects. We can use one of two types – basic mixins\
    \ are simply slotted into our code, whereas parametric mixins allow us to pass\
    \ in values, but still use the same core styles. We’ll cover how these work shortly,\
    \ but let’s first take a look at implement reusable code, with basic mixins."
