  trans: "\n### 使用 `css2scss` 工具——补充说明\n\n凡是我认识的人都会说我奉行“KISS”原则——不了解的朋友可以搜一下，意思是“保持简单，傻瓜……”好吧，剩下的你自己去猜！\n\
    \n不过说真的：我们生活在一个时间无比宝贵的时代，我完全支持把那些耗时又没什么价值的任务自动化。不过，我也说过，我们绝对应该通读代码，以便了解哪些地方可以修改。这似乎与之前的观点相矛盾，那到底是怎么回事呢？\n\
    \n我们之所以应该采取这两种方法，有以下几方面原因：转换工具不可能做到 100%完美；它依赖于我们编写的代码使用一致的符号规则，比如只使用 6 位十六进制颜色码，或者混用颜色名称。先通读一遍代码，我们就能检查其一致性；同时也能大致判断哪些部分可以转换成\
    \ Sass 代码。完成这一步后，我们就可以用 `css2scss` 工具运行代码，最后在文本编辑器中检查结果。\n\n至于这个工具的效果如何——可能会让你意外：在创作本书的过程中，我曾在\
    \ WordPress 自带的 `twentyseventeen` 主题的一个庞大样式表上测试过它。这个文件的代码量高达约 4300 行——绝对是个庞然大物。不过它似乎没遇到什么问题：该工具轻松完成了转换，生成的\
    \ Sass 样式表还不到 2000 行！需要说明的是，转换结果还需要检查，但绝对值得一试，哪怕只是为了更好地理解如何手动进行修改。\n\n好吧——我们换个话题：在将样式表转换为\
    \ Sass 时，我们或许会决定将其拆分成更小、更易管理的片段（即局部文件）。这完全没问题，是一种完全可以接受的方法。\n\n不过，我猜你可能会发现自己正在编写与其他开发者在网上发布过的代码相似的代码——为什么不看看呢？与其重复造轮子，不如看看别人已经创造了什么：网上有几十个现成的库供我们使用。我强烈建议花点时间研究一下可用的选项——谁知道你会发现什么！使用预建库并非毫无问题——为了解其中缘由，让我们深入探讨一下其中的细节。\n\
    \n### 使用预建库\n\n回想一下本章前面“简化流程”部分的讨论：还记得我们如何讨论使用 `@import` 函数将大型样式表拆分成更易管理的片段吗？\n\
    \n这就是我们创建 Sass 库的基本原理——它们不过是一些包含混合宏、循环、变量等代码的小文件，甚至包含与网站特定部分（如导航）相关的组件。关键在于，如果我们把文件导入到样式表中，Sass\
    \ 只会调用主样式表直接引用的代码。\n\n我们还可以更进一步——当然可以创建自己的库。但在某些情况下，可能没有这个必要：别人可能已经为我们做了一些工作，我们可以直接在代码中复用。与其试图重复造轮子，不如直接导入他们的文件——Sass\
    \ 只会使用主样式表调用到的那些混合宏、函数等内容，其余部分则原封不动。\n\n为了真正理解其工作原理，让我们深入一个演示——它可能本身比较简单，但使用 `@import`\
    \ 时，*过程*才是关键，而不是最终结果。\n\n#### 探索预建选项\n\n> *过程、过程——我猜你会问，难道最终结果不是更重要吗？*\n\n是的——显然我们应该得到正确的结果。不过，实现结果的方法可以说更为重要。让我解释一下我的意思。\n\
    \n如果我们选择使用预建库，几乎可以肯定能找到包含项目所需的所有混合宏、变量或函数的库。诀窍在于找到那些在可用功能和与我们无关的选项（至少对当前项目而言）之间取得恰当平衡的库。\n\
    \n当然，我们可以简单地导入多个库，但这并不高效——如果只用到其中很小一部分功能，导入一个库就没什么意义。日后我们可能还会发现包含更好版本的混合宏或更多功能的库——到时我们可以决定重构代码，淘汰冗余的库，以便使用更好的选项。\n\
    \n这只是我们在使用 `@import` 时需要考虑的问题的冰山一角——我们稍后会再讨论这个问题；但首先，让我们通过一个简单示例来展示如何在 Sass 中使用\
    \ `@import` 引用库。\n\n#### 使用预建库\n\n本演示假设你已经从第 1 章安装了 Node.js，我们需要用它来下载 Bourbon——如果还没安装，请先确保完成安装，然后再继续练习。\n\
    \n假设已经安装并正常运行，请按以下步骤操作：\n\n![../images/472539_1_En_5_Chapter/472539_1_En_5_Fig2_HTML.jpg](img/472539_1_En_5_Fig2_HTML.jpg)\n\
    \n*图 5-2 切换为使用预建库*\n\n1. 首先，从本书附带的代码下载中提取 `library-prebuilt` 文件夹的副本：将其存储到项目文件夹中。\n\
    \n2. 现在需要下载 Bourbon 库，因此启动一个 Node.js 终端会话，并将工作文件夹切换到项目目录下的 `library-prebuilt`\
    \ 文件夹。\n\n3. 在终端提示符下，输入以下命令并按 Enter 键：\n\n   ```\n   npm install bourbon --save\n\
    \   ```\n\n4. 下载完成后，将 `node_modules\\bourbon\\core` 中的 `_bourbon.scss` 文件和 bourbon\
    \ 文件夹复制到 `library-prebuilt` 文件夹下的 sass 文件夹中。\n\n   现在 Bourbon 已就位——如果你做到了这一步：干得漂亮！这确实引发了一些关于如何使用库的问题，但暂时先不管，我们开始更新代码以使用\
    \ Bourbon：\n\n5. 打开 `library-prebuilt.scss`，然后在文件最顶部添加以下代码行：\n\n   ```\n   @import\
    \ \"_bourbon.scss\";\n   ```\n\n6. 在稍微靠下的位置，用以下代码替换第 10 行的注释：\n\n   ```\n   $size:\
    \ 200px;\n   ```\n\n7. 在第 36 行附近，将背景颜色的声明改为以下代码：\n\n   ```\n   background-color:\
    \ tint(#6ecaa6, 40%);\n   ```\n\n8. 保存文件，然后启动终端会话，将工作文件夹切换到项目目录下的 `library-prebuilt`\
    \ 文件夹。\n\n9. 在提示符下，输入以下命令并按 Enter 键：\n\n   ```\n   sass sass\\skeleton.scss css\\\
    skeleton.css\n   ```\n\n10. 如果一切顺利，我们应该会在 `css` 文件夹中看到一个 `library-prebuilt.css`\
    \ 文件以及一个 source map——预览结果将显示一个包含样式元素的简单模板页面，如图 5-2 所示。\n\n表面上看，本演示中我们完成的步骤相对简单——它们说明了如果我们决定改用某种类型的预建库，可能需要对现有\
    \ Sass 代码进行的修改。然而，我之前提到这只是整个流程中的一小部分——在使用 `@import` 时，我们需要注意一些关键点，那么让我们深入了解一下这些点会如何影响我们的开发。\n"
- fmt: '# Assessing the Pitfalls – a Postscript


    If you plug in the phrase “sass code libraries” into a browser, you will get dozens
    of results – some will be reviews of libraries, or you may see links for individual
    sites such as Bourbon (`https://bourbon.io`) and Saffron (`http://colindresj.github.io/saffron/`),
    or some of the lesser-known ones such as Sassmatic (`http://sassmatic.com/`) or
    Scut (`http://davidtheclark.github.io/scut/`).


    Trouble is – how to decide which one to use? It’s a good question: this is one
    process that takes time, patience, and lots of testing before you find the right
    answer! To help with the process, there are a few tips I can recommend:


    * Have a good look online at articles where people have selected libraries for
    review – you may find some names appearing more than once, which is a good indicator
    of their popularity. Alternatively look for curated lists such as the one at `https://github.com/Famolus/awesome-sass`
    – this will contain some useful starting links, although some may now be out of
    date!

    * Many libraries are open source – this means that while others may have contributed
    fixes and improvements, there will not likely be any form of formal support offer
    in place. It means you will be reliant on the goodwill of others to help resolve
    problems, and that there is no guarantee a fix will be implemented quickly if
    you have a time-sensitive issue! This may not be a problem, but it is something
    to bear in mind.

    * On a more serious note, as Dart Sass is still relatively new, you will find
    that many libraries still refer to the older Ruby method of installing them. This
    isn’t necessary, but it does mean you may be limited in terms of which library
    you use, or how you install it – not every library may have versions available
    for NPM, Yarn, or the like.

    * You may find people have created libraries that offer mixins that cater to your
    need, but which work slightly differently to achieve the same result – bear in
    mind that you may have to adapt your code first to match it, **before** you switch
    to using the prebuilt version.

    * Although Sass will only use import mixins where they are directly referenced
    in code, there is little benefit in referencing a large library for a small amount
    of code, such as one or two mixins only! In this case, it’s better to copy them
    into your own library – it will make it easier to manage and keep the compilation
    times down.

    * Many libraries contain mixins solely for the purpose of providing vendor support,
    which isn’t necessary, for all but the newest of CSS properties. We can use a
    tool such as Autoprefixer during compilation (although this will require Node.js)
    – this tool will take care of vendor prefixes automatically. A good example of
    this are the mixins provided by the Compass library at `http://www.compass-style.org`,
    for properties such as `background-clip`; this is now supported without the need
    for vendor prefixes.

    * Consider this as an evolving process – it’s rare that you will find all of the
    mixins, functions, variables, and the like already in a prebuilt library. You
    may need to go through several iterations of libraries before you find the right
    combination that best serves the needs of your project.


    These are just a few of the considerations we will likely need to bear in mind
    when choosing prebuilt libraries – hopefully you will see that the process of
    choosing is just as important as the end result, if not more so!


    Whichever library (or libraries) you choose to use in your project, there is one
    thing that we absolutely must do: ensure our import process has been optimized.
    Optimization can mean the difference between compiling concise code and code with
    hundreds of extra lines of bloat – clearly not something we need. It’s a key part
    of importing, so let’s dive in and see what this means in practice for us.


    ## Optimizing the Import Process


    Over the last few pages, we’ve talked about importing files, and how this powerful
    tool can really help with managing your style sheets – instead of having to try
    to manage a monster file as one, we can break it down into smaller, more manageable
    chunks that make it easier to maintain.


    There is a risk, though, when using the `@import` function – if we’re not careful
    about how we structure it, we can end up creating more styles than intended! For
    a small project, this is less of an issue; but, for larger ones, this could have
    a real impact on speed, particularly if our browser has to wade through hundreds
    of extra lines of code that are redundant.


    To understand what an impact this can have, we’re going to turn our attention
    to a small demo – the main style sheet only has three style rules within it, but
    as you will shortly see, this is not what we get once our file is compiled.


    ### Careless Importing


    I have a small confession to make – I am sure the title of this demo will not
    apply to you, but once you’ve seen the result of this demo, I’m sure you will
    understand the significance! With that in mind, let’s make a start on our demo:


    1. We’ll begin by extracting a copy of the `import-original` file from the code
    download that accompanies this book – go ahead and save it in our project area.

    2. Next, open your text editor, and add the following code to a new file, saving
    it as `font-sizes.scss` in our project folder:


    ```

    $h1-size: 36px;

    $h2-size: 24px;

    $h3-size: 18px;

    $grey: #212121;

    $lightgrey: #616161;

    .h1 {

    color: $grey;

    font-size: $h1-size ;

    }

    .h2 {

    color: $grey;

    font-size: $h2-size;

    }

    .h3 {

    color: $lightgrey;

    font-size: $h3-size;

    }

    .copy {

    color: $grey;

    font-size: $h3-size * 0.5;

    }

    ```


    3. We need to add one more file – for this, add the following styles to a new
    file, saving it as `page.scss` in our project folder:


    ```

    @import "font-sizes";

    .page_title { @extend .h1; }

    .page_cta { @extend .h3; }

    .page_special_button { background-color: black; color: white; }

    ```


    4. Fire up a terminal session, then change the working folder to the `import-original`
    folder we created in step 1.

    5. At the prompt, enter this command, and press Enter:


    ```

    sass page.scss css\page.css

    ```


    6. If we look inside the `css` folder, we should see two files – `page.css` and
    `page.css.map`; these contain our compiled styles. Don’t open the file just yet
    – we will do that in a moment!


    At this point we should have a compiled style sheet in the `css` folder – before
    you open the file up, any idea on how many rules you would expect to see? If the
    answer is three, then I am sorry to disappoint – the true answer is five with
    two shared rules, as indicated in Figure 5-3.


    ![../images/472539_1_En_5_Chapter/472539_1_En_5_Fig3_HTML.jpg](images/472539_1_En_5_Chapter/472539_1_En_5_Fig3_HTML.jpg)


    Figure 5-3


    The results of not properly importing files


    Ouch – our style sheet has nearly doubled! We originally wanted three compiled
    styles, but thanks to how we’ve set up our style sheet, Sass has treated the extra
    code as additional style rules and added them during compilation.


    The real irony though is that the cause of these extra styles appearing is down
    to one character that is repeated multiple times in this style sheet, but which
    forces Sass to add these extra styles during compilation. Yes – the humble full
    stop is to blame; just like in normal punctuation, its position can make a real
    difference!'
