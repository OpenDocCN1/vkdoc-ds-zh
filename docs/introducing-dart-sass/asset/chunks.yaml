    \ styles to each automatically.\n\nOkay – let’s move on: it’s time to turn our\
    \ attention to a more recent addition to Sass. When styling elements, we might\
    \ create a “palette” of styles that should be kept for certain elements, such\
    \ as headings or tables. Instead of creating a host of different variables, we\
    \ can use a more efficient process: we can create a map. Okay – I don’t mean trying\
    \ to replicate cartographers have been doing for years, but something different:\
    \ a way of referring to particular properties that have been grouped together.\
    \ Let’s dive in and take a look to see what this means in practice.\n\n## Applying\
    \ Styles to a Property List or Map\n\nAlthough Sass maps are a relatively new\
    \ concept to Sass (having been introduced in version 3.3 of Ruby Sass, the predecessor\
    \ to Dart Sass), it is worth its weight in gold – why? Well, let me explain how\
    \ they work:\n\nHistorically, we would likely have created multiple variables\
    \ to store values – this works, but is a very manual, inefficient way to store\
    \ values: in addition, we can’t really group each item, save for where they might\
    \ appear in a style sheet.\n\nInstead, we can use a map – these consist of a minimum\
    \ of two parts: the initial map variable and the block where we call each reference.\
    \ In the single variable, we can assign multiple key pairings, using this syntax:\n\
    \n```\n$map: (key1: value1, key2: value2, key3: value3);\n```\n\n… where the key\
    \ is the map reference, and the value is the attribute we want to display in our\
    \ style sheet at compilation. When we need to call a value, we would use something\
    \ akin to this:\n\n```\ntext-align: map-get(, )\n```\n\nLet’s put this into practice,\
    \ by revisiting one of my favorite effects – we’ll style an image of a vintage\
    \ camera, using the classic Polaroid effect.\n\n### Creating And Using Sass Maps\n\
    \nFor this next demo, we’ll use a premade demo that already uses Sass but which\
    \ can easily be converted to use a Sass map. Our vintage camera image was sourced\
    \ from the Pexels website at [`https://www.pexels.com/photo/antique-camera-classic-lens-242433/`](https://www.pexels.com/photo/antique-camera-classic-lens-242433/)\
    \ .\n\nLet’s update the demo to use a Sass map:\n\n![../images/472539_1_En_4_Chapter/472539_1_En_4_Fig11_HTML.jpg](images/472539_1_En_4_Chapter/472539_1_En_4_Fig11_HTML.jpg)\n\
    \nFigure 4-11\n\nCreating a Polaroid image using a map\n\n1.  We’ll begin by downloading\
    \ a copy of the `sassmap` folder from the code download that accompanies this\
    \ book – save it to the root of our project folder.\n\n2.  This time around, our\
    \ demo already has Sass styling, but we’re going to modify it – for this, open\
    \ the `sassmap.scss` file in the sass subfolder in the `sassmap` folder we saved\
    \ in step 1.\n\n3.  At the top of the file, go ahead and insert this, before the\
    \ opening `@font-face` declaration:\n\n    ```\n    $styling-figcaption: (\n \
    \   'text-align': center,\n    'font-family': Reenie Beanie,\n    'font-size':\
    \ 20.8px,\n    'color': #454f40,\n    'letter-spacing': 1.44px,\n    );\n    ```\n\
    \n4.  Scroll down until you see `figcaption{`, on or around line 69.\n\n5.  Go\
    \ ahead and replace the contents of this style rule, so it looks like this:\n\n\
    \    ```\n    figcaption {\n    text-align: map-get($styling-figcaption, 'text-align');\n\
    \    font-family: map-get($styling-figcaption, 'font-family');\n    font-size:\
    \ map-get($styling-figcaption, 'font-size');\n    color: map-get($styling-figcaption,\
    \ 'color');\n    letter-spacing: map-get($styling-figcaption, 'letter-spacing');\n\
    \    }\n    ```\n\n6.  Go ahead and save the file – next, fire up a terminal session\
    \ and change the working folder to the `sassmap` folder under our project area.\n\
    \n7.  At the prompt, type the following command and press Enter:\n\n    ```\n\
    \    sass sass\\sassmap.scss css\\sassmap.css\n    ```\n\n8.  If all is well,\
    \ we should see a `sassmap.css` file appear in the `css` folder, along with a\
    \ source map – previewing the results will show a simple template page with styled\
    \ elements, as indicated in Figure [4-11](#472539_1_En_4_Chapter.xhtml#Fig11).\n\
    \nA really simple change to make, but one which makes our code infinitely easier\
    \ to manage – not only can we now access each property from a single variable,\
    \ we can do so multiple times throughout our code. We’ve only scratched the surface\
    \ of how maps work in Sass, though: there is a lot more we can do! Nevertheless,\
    \ it’s worth spending a moment going through our code, to see just how powerful\
    \ maps really are in Sass development.\n\n### Breaking Down Our Code\n\nAt first\
    \ glance, our updated code may look more “wordy” (i.e., there is more code there\
    \ than previously). However, bear in mind that Sass often has instances where\
    \ this is the case – in this case, it’s all about making it easier to get a sense\
    \ of which value we are using in our code.\n\nOur code starts by adding in a map,\
    \ which is a group of paired properties; this is assigned to a single variable.\
    \ Think of it as an array, for those of you who are familiar with this technique;\
    \ it works in much the same way. Maps are perfect for grouping together common\
    \ styles for particular elements on a page, such as titles or an `<h2>` tag.\n\
    \nWe then make reference to this map when we create the `figcaption` rule  – instead\
    \ of entering the values directly into the rule, we simply replace them with calls\
    \ to the `$styling-figcaption` map, with appropriate references to the attribute\
    \ we want to retrieve.\n\nThe grouping together makes it easier to identify what\
    \ that property relates to, and eliminates the need for multiple variables in\
    \ our code. So – for example, if we were to call `map-get($styling-figcaption,\
    \ 'text-align')`, we would get back center as the attribute. We might have initially\
    \ set as one of several attributes for titles (as mentioned previously), but we\
    \ can call this `map-get()`function and use it for any example in our code, not\
    \ just for titles!"
  trans: "\n# 深入探究代码细节\n\n那么，我们的代码是如何工作的呢？其实，大部分样式声明都是标准的 CSS – 让演示生效的关键在于这个函数：\n\n\
    ```scss\n@while $step <=10  {\n// changes from one color to another\n.mix li:nth-child(#{$step})\
    \ {\nbackground-color: mix($end-color, $start-color, ($step * 10));\n}\n$step:\
    \ $step + 1;\n}\n```\n\n在这段代码中，我们创建了一个循环，变量 `$step` 的（隐式）初始值设为零。然后我们用这个值替换粗体高亮部分（一个插值字符串），来创建我们的规则——这条规则包含一个\
    \ `background-color` 声明，它是由两种颜色（浅灰色和黑色）混合而成。我们通过将 `$step` 的值增加 1 来结束循环——这使我们移动到组中的下一个列表项。我们可以在图\
    \ 4-10 所示的示例代码中看到这个函数的效果。\n\n![../images/472539_1_En_4_Chapter/472539_1_En_4_Fig10_HTML.jpg](img/472539_1_En_4_Fig10_HTML.jpg)\n\
    \n**图 4-10** 从 `@while` 循环编译生成的代码\n\n看，为每个列表项设置样式是多么简单？诚然，我们的代码可能过于简化了，但可重复性的原则同样适用——只要我们有一个合适的元素组（例如列表项），我们就可以使用\
    \ Sass 自动为它们应用样式。\n\n好了，让我们继续：现在是将注意力转向 Sass 中一个较新功能的时候了。当为元素设置样式时，我们可能会创建一组样式“调色板”，用于某些特定元素，如标题或表格。与其创建一堆不同的变量，我们可以使用一种更高效的方法：创建一个映射。注意，我不是指要复制制图师多年来的做法，而是指别的东西：一种引用已分组特定属性的方式。让我们深入探讨一下，看看这在实际中意味着什么。\n\
    \n## 为属性列表或映射应用样式\n\n尽管 Sass 映射对 Sass 来说是一个相对较新的概念（在 Dart Sass 的前身 Ruby Sass 3.3\
    \ 版本中引入），但它价值连城——为什么？好吧，让我解释一下它们是如何工作的：\n\n在过去，我们可能会创建多个变量来存储值——这虽然可行，但是一种非常手动、低效的存储值的方式：此外，除了它们在样式表中可能出现的位置之外，我们实际上无法对每个项进行分组。\n\
    \n相反，我们可以使用映射——它至少由两部分组成：初始映射变量和调用每个引用的代码块。在单个变量中，我们可以使用以下语法分配多个键值对：\n\n```\n\
    $map: (key1: value1, key2: value2, key3: value3);\n```\n\n……其中 `key` 是映射的引用，`value`\
    \ 是我们在编译时希望在样式表中显示的值。当我们需要调用一个值时，我们会使用类似这样的语法：\n\n```\ntext-align: map-get(<map>,\
    \ <key>)\n```\n\n让我们通过重温我最喜欢的效果之一来实践一下——我们将使用经典的宝丽来效果来设置一张老式相机图片的样式。\n\n### 创建和使用\
    \ Sass 映射\n\n对于下一个演示，我们将使用一个已预先使用 Sass 但可以轻松转换为使用 Sass 映射的演示。我们的老式相机图片来源于 Pexels\
    \ 网站，网址是 [`https://www.pexels.com/photo/antique-camera-classic-lens-242433/`](https://www.pexels.com/photo/antique-camera-classic-lens-242433/)。\n\
    \n让我们更新演示以使用 Sass 映射：\n\n![../images/472539_1_En_4_Chapter/472539_1_En_4_Fig11_HTML.jpg](img/472539_1_En_4_Fig11_HTML.jpg)\n\
    \n**图 4-11** 使用映射创建宝丽来图片\n\n1.  首先，从本书附带的代码下载中下载 `sassmap` 文件夹的副本——将其保存到项目文件夹的根目录。\n\
    \n2.  这次，我们的演示已经包含了 Sass 样式，但我们打算对其进行修改——为此，请打开我们在步骤 1 中保存的 `sassmap` 文件夹中 `sass`\
    \ 子文件夹下的 `sassmap.scss` 文件。\n\n3.  在文件的顶部，在 `@font-face` 声明之前，插入如下代码：\n\n    ```scss\n\
    \    $styling-figcaption: (\n    'text-align': center,\n    'font-family': Reenie\
    \ Beanie,\n    'font-size': 20.8px,\n    'color': #454f40,\n    'letter-spacing':\
    \ 1.44px,\n    );\n    ```\n\n4.  向下滚动，直到找到 `figcaption{`，大约在第 69 行。\n\n5.  替换这个样式规则的内容，使其看起来像这样：\n\
    \n    ```scss\n    figcaption {\n    text-align: map-get($styling-figcaption,\
    \ 'text-align');\n    font-family: map-get($styling-figcaption, 'font-family');\n\
    \    font-size: map-get($styling-figcaption, 'font-size');\n    color: map-get($styling-figcaption,\
    \ 'color');\n    letter-spacing: map-get($styling-figcaption, 'letter-spacing');\n\
    \    }\n    ```\n\n6.  保存文件——接下来，打开一个终端会话，将工作目录切换到项目区域下的 `sassmap` 文件夹。\n\n7.\
    \  在提示符下，输入以下命令并按 Enter：\n\n    ```bash\n    sass sass\\sassmap.scss css\\sassmap.css\n\
    \    ```\n\n8.  如果一切顺利，我们应该会看到 `css` 文件夹中出现一个 `sassmap.css` 文件以及一个源映射文件——预览结果将显示一个带有样式元素的简单模板页面，如图\
    \ 4-11 所示。\n\n这是一个非常简单的修改，但它使我们的代码管理起来轻松了无数倍——现在，我们不仅可以从单个变量中访问每个属性，还可以在代码中多次这样做。然而，我们仅仅触及了\
    \ Sass 映射工作原理的表面：我们还能做更多！尽管如此，花点时间仔细梳理一下我们的代码，看看映射在 Sass 开发中究竟有多强大，是值得的。\n\n###\
    \ 解析我们的代码\n\n乍一看，我们更新后的代码可能看起来更“冗长”（即，代码比以前多了）。但请记住，Sass 经常会有这种情况——在这种情况下，一切旨在让我们更容易了解代码中使用的是哪个值。\n\
    \n我们的代码首先添加了一个映射，它是一组成对的属性；这被赋值给一个变量。如果你熟悉这种技术，可以把它想象成一个数组；其工作方式非常相似。映射非常适合将页面上特定元素（如标题或\
    \ `<h2>` 标签）的通用样式分组在一起。\n\n然后，当我们创建 `figcaption` 规则时，我们引用了这个映射——我们没有直接将值输入到规则中，而是简单地用对\
    \ `$styling-figcaption` 映射的调用替换它们，并传入我们想要获取的属性的适当引用。\n\n这种分组方式使得识别属性关联的内容变得更加容易，并消除了在代码中使用多个变量的需要。所以——例如，如果我们调用\
    \ `map-get($styling-figcaption, 'text-align')`，我们会得到 `center` 这个值。我们最初可能会将其设置为标题的多个属性之一（如前所述），但我们可以在代码中的任何示例中调用这个\
    \ `map-get()` 函数并使用它，而不仅仅是用于标题！\n"
- fmt: '# Creating Breakpoints Using @media


    Throughout the course of this chapter, we’ve touched on the various ways we can
    use Sass functions to perform tasks (such as generating colors), or its control
    directives to determine what should be written to our style sheet.


    There is however one more control directive we’ve yet to cover – and one which
    should be instantly recognizable to anyone who has spent time developing for responsive
    sites. Yes, I am talking about `@media` – this works in much the same way as in
    standard CSS, with one extra capability: media directives can be nested within
    Sass content.


    Put simply, this means that any which appear in a CSS rule will bubble up to the
    top level of the style sheet – it makes it easy to add in media-specific styles
    without having to repeat selectors or wreck the flow of our style sheet. Let’s
    take a look at what this means in practice, with a simple proof of concept to
    show off how we might implement media directives using Sass.


    ## Creating Breakpoints


    For the purposes of this demo, we’re going to keep it super simple in terms of
    elements – we’ll have a single `<div>` that will change color when the screen
    width has been resized. Let’s make a start on setting up our exercise:


    ![../images/472539_1_En_4_Chapter/472539_1_En_4_Fig12_HTML.jpg](images/472539_1_En_4_Chapter/472539_1_En_4_Fig12_HTML.jpg)


    Figure 4-12


    Our finished breakpoint example, at table width


    1. We’ll begin by downloading a copy of the `breakpoints` folder from the code
    download that accompanies this book – save it to the root of our project folder.

    2. The download contains all of the markup, but this will be useless without our
    styling, so let’s create a new file, saving it as `breakpoints.scss` in the `sass`
    folder for this demo.

    3. We have a few style rules to add in, which we will add in block by block, starting
    with some basic styles required to set up our demo:


    ```

    @font-face {

    font-family: ''pt_sansregular'';

    src: url(''../font/pt_sansregular.woff'') format(''woff'');

    font-weight: normal;

    font-style: normal;

    }

    body { font-family: ''pt_sansregular'', sans-serif; margin: 32px; font-size: 20.8px;
    }

    ```


    4. Next up come the styles required to set our breakpoints – we first set a Sass
    map to store our breakpoints:


    ```

    $media-queries: (

    tablet: (

    breakpoint: ''(min-width: 480px) and (max-width: 768px)'',

    ),

    mobile: (

    breakpoint: ''(max-width: 480px)''

    )

    );

    ```


    5. We then need to add in our mixin, which will be called on to create our styles:


    ```

    @mixin media-query ($size) {

    @each $item, $value in $media-queries {

    @if $item == $size {

    @if map-get($value, breakpoint) != null {

    @media only screen and #{map-get($value, breakpoint)} {

    @content;

    }

    }

    }

    }

    }

    ```


    6. We’re almost done with the styles – last, but by no means least, comes the
    basic style for our responsive `<div>` element, along with the calls to the mixin
    to add our responsive colors:


    ```

    .row { display: inline-block; width: 100%; font-size: 22.4px;

    text-align: center; color: #FFF; padding: 4% 10%; box-sizing: border-box; }

    .row {

    background: darkgrey;

    @include media-query(mobile) {

    background: lightgrey;

    }

    @include media-query(tablet) {

    background: darkgrey;

    }

    }

    ```


    7. Go ahead and save the file – next, fire up a terminal session and change the
    working folder to the `breakpoints` folder under our project area.

    8. At the prompt, type the following command and press Enter:


    ```

    sass sass\breakpoints.scss css\breakpoints.css

    ```


    9. If all is well, we should see a `breakpoints.css` file appear in the `css`
    folder, along with a source map – previewing the results will show a simple template
    page with styled elements, as indicated in Figure 4-12.


    Although our demo only contains one element, there is still a reasonable amount
    of code that we’ve had to add to make it responsive! Our code shows off some key
    techniques that are worth mastering; most of these you have already met earlier
    in the book, but not in the context of making elements responsive. Let’s take
    a few minutes to revisit the code to see how it works in more detail.


    ## Understanding What Happened


    Although we’ve met most of the techniques used in this demo before, at first glance
    you might be confused for thinking it looks harder than it first appears. In reality,
    it’s fairly straightforward code, so let’s go through it step by step:


    The real meat of our code starts in step 4, where we’ve created that map of media
    breakpoints – we’ve specified two typical ones (tablet and mobile), but could
    equally include breakpoints for desktop and other devices as needed. Inside this
    map, we’ve specified a breakpoint between `480px` and `768px`, alongside another
    to cater to devices no wider than `480px`.


    Next up we have a mixin – into this we pass the size as a text name, which in
    this case will be mobile or tablet. We then iterate through each item within the
    map; if the map contains an item of the right size, we `map-get` its breakpoint
    `$value`, provided a suitable value exists in the map. Assuming such a value exists,
    then we use the special keyword content to apply this media query across all declarations,
    right up to the top level of that selector. This will give us something akin to
    the example shown in Figure 4-13.


    ![../images/472539_1_En_4_Chapter/472539_1_En_4_Fig13_HTML.jpg](images/472539_1_En_4_Chapter/472539_1_En_4_Fig13_HTML.jpg)


    Figure 4-13


    Our compiled media query


    Our code looks complex, but in reality, the only parts we need to worry about
    are the Sass map and calls to the mixin – the mixin itself won’t change, and can
    equally be imported from a separate style sheet using the `@include` command.
    This lets us concentrate on providing the right breakpoints for the media query
    map (which could equally be imported too), and to ensure that calls are positioned
    at appropriate points in our style sheet.


    ## Summary


    Phew – what a ride! We’ve covered a huge amount of content throughout this chapter,
    so before we move onto creating the demo in the next chapter, let’s take a moment
    to review what we’ve learned in this chapter.


    We kicked off with a look at using functions within Sass – we saw how these can
    be used for a variety of purposes but which are particularly suited to tasks such
    as creating colors. We also explored the benefits of using functions in this manner,
    and how this makes it easier to create code.


    Next up came a look at how we might assign styles at compilation, based on evaluating
    certain conditions – this included a look at Sass’s control directives and expressions,
    and the various ways we can automate the creation of styles by iterating through
    groups of elements in a loop. We also took a look at how we can either specify
    a known number of items in that loop, or use a loop which will only run if certain
    conditions can be met in our code.


    We then moved on to explore the use of Sass maps and saw how easy it is to assign
    values to a single placeholder, whereas before we might have used multiple variables
    to perform the same task. We then rounded out the chapter with a brief look at
    the `@media` directive, to see how Sass might help with creating media queries
    for responsive sites or online applications.


    Well – we’re almost at the end of the book, but we can’t leave without putting
    some of what we’ve covered thus far into practice! To help with this, we’re going
    to run through a mini case study to see how we might use some of the techniques
    we’ve learned in a more practical example – it’s time to get those dummy credit
    cards at the ready, as we’re going to create the user interface for a shopping
    cart. If I were you, I would go get a coffee or drink first, as we have a lot
    to cover over the next few pages …!'
