    # 评估陷阱——后记


    如果在浏览器中搜索"sass 代码库"这个短语，你会得到数十个结果——有些是代码库的评测，也可能看到诸如 Bourbon（`https://bourbon.io`）和
    Saffron（`http://colindresj.github.io/saffron/`）等独立网站的链接，或是 Sassmatic（`http://sassmatic.com/`）和
    Scut（`http://davidtheclark.github.io/scut/`）等相对小众的代码库。


    问题在于——如何决定使用哪一个？这是个好问题：找到正确答案需要时间、耐心和大量测试！为了帮助你做出选择，我推荐几个小技巧：


    *   在网上仔细查找那些有人挑选代码库进行评测的文章——你可能会发现某些名字重复出现，这很好地说明了它们的受欢迎程度。或者寻找类似`https://github.com/Famolus/awesome-sass`这样的精选列表——其中会包含一些有用的入门链接，尽管有些可能已经过时！

    *   许多代码库是开源的——这意味着虽然可能有人贡献了修复和改进，但很可能没有正式的技术支持。这意味着你要依赖他人的善意来帮助解决问题，而且如果你遇到时间紧迫的问题，无法保证修复能快速实施！这可能不是问题，但需要牢记。

    *   更严肃地说，由于 Dart Sass 仍相对较新，你会发现许多代码库仍沿用旧的 Ruby 安装方法。这并非必要，但确实意味着你在选择代码库或安装方式上可能受限——并非每个代码库都有适用于
    NPM、Yarn 等的版本。

    *   你可能会发现有人创建了提供满足你需求的混入的代码库，但实现相同结果的方式略有不同——请记住，在切换到使用预制版本**之前**，你可能需要先调整代码以匹配它。

    *   尽管 Sass 只会导入代码中直接引用的混入，但为了少量代码（例如只使用一两个混入）而引用一个大型代码库几乎毫无益处！在这种情况下，更好的做法是将它们复制到你自己的代码库中——这样更易于管理，也能缩短编译时间。

    *   许多代码库包含仅用于提供厂商支持的混入，这对于除最新 CSS 属性之外的所有属性都是不必要的。我们可以在编译过程中使用 Autoprefixer 等工具（尽管这需要
    Node.js）——该工具会自动处理厂商前缀。一个很好的例子是 Compass 代码库（`http://www.compass-style.org`）为`background-clip`等属性提供的混入；现在该属性已获得支持，无需厂商前缀。

    *   将其视为一个不断演进的过程——很少能在预制代码库中找到所有需要的混入、函数、变量等。你可能需要经历多次代码库迭代，才能找到最适合项目需求的最佳组合。


    以上只是我们在选择预制代码库时可能需要牢记的一些考量——希望你能看到，选择的过程即使不比最终结果更重要，也至少同样重要！


    无论你在项目中选择使用哪个（或多个）代码库，有一件事我们必须做到：确保导入过程已优化。优化意味着编译出简洁代码与含有数百行多余冗余代码之间的区别——显然我们不需要后者。这是导入的关键环节，让我们深入探讨，看看这对我们实际意味着什么。


    ## 优化导入过程


    在之前的章节中，我们讨论了导入文件，以及这个强大工具如何真正帮助你管理样式表——无需试图将巨无霸文件当作一个整体来管理，我们可以将其拆分成更小、更易于管理的块，使维护更加容易。


    不过，使用`@import`函数存在一个风险——如果我们不注意如何组织它，最终可能会创建出比预期更多的样式！对于小型项目，这问题不大；但对于大型项目，这可能会对速度产生实质性影响，特别是当浏览器需要处理数百行冗余代码时。


    为了理解这可能产生的影响，我们将注意力转向一个小型演示——主样式表中只有三条样式规则，但很快你就会看到，这并非文件编译后得到的结果。


    ### 粗心导入


    我要坦白一个事实——我确信这个演示的标题并不适用于你，但一旦你看到演示结果，我确信你会明白其重要性！有了这个前提，让我们开始演示：


    1.  我们首先从本书附带的代码下载中提取一份`import-original`文件的副本——继续将其保存到我们的项目目录中。

    2.  接下来，打开文本编辑器，将以下代码添加到一个新文件中，并将其保存为项目文件夹中的`font-sizes.scss`：


    ```

    $h1-size: 36px;

    $h2-size: 24px;

    $h3-size: 18px;

    $grey: #212121;

    $lightgrey: #616161;

    .h1 {

    color: $grey;

    font-size: $h1-size ;

    }

    .h2 {

    color: $grey;

    font-size: $h2-size;

    }

    .h3 {

    color: $lightgrey;

    font-size: $h3-size;

    }

    .copy {

    color: $grey;

    font-size: $h3-size * 0.5;

    }

    ```


    3.  我们还需要再添加一个文件——为此，将以下样式添加到一个新文件中，并将其保存为项目文件夹中的`page.scss`：


    ```

    @import "font-sizes";

    .page_title { @extend .h1; }

    .page_cta { @extend .h3; }

    .page_special_button { background-color: black; color: white; }

    ```


    4.  打开终端会话，然后将工作目录更改为我们在步骤 1 中创建的`import-original`文件夹。

    5.  在提示符下输入以下命令，然后按回车：


    ```

    sass page.scss css\page.css

    ```


    6.  查看`css`文件夹，我们应该会看到两个文件——`page.css`和`page.css.map`；它们包含我们编译后的样式。先不要打开文件——我们稍后再做！


    此时，我们应该在`css`文件夹中有一个编译好的样式表——在你打开文件之前，猜测一下会看到多少条规则？如果答案是三条，那么很抱歉让你失望了——实际答案是五条，其中两条共享规则，如图
    5-3 所示。


    ![../images/472539_1_En_5_Chapter/472539_1_En_5_Fig3_HTML.jpg](img/472539_1_En_5_Fig3_HTML.jpg)


    图 5-3


    未正确导入文件的结果


    哎呀——我们的样式表几乎翻倍了！我们原本想要三条编译后的样式，但得益于我们设置样式表的方式，Sass 将额外代码视为附加样式规则，并在编译期间将它们添加了进来。


    但真正具有讽刺意味的是，导致这些额外样式出现的原因，竟然是在这个样式表中多次重复的一个字符，它迫使 Sass 在编译期间添加这些额外样式。没错——就是不起眼的点号；就像普通标点符号一样，它的位置至关重要！

