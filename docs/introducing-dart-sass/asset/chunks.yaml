  trans: "\n### 扩展 Sass 类\n\n让我们开始编写演示代码：\n\n![../images/472539_1_En_3_Chapter/472539_1_En_3_Fig6_HTML.jpg](img/472539_1_En_3_Fig6_HTML.jpg)\n\
    \n**图 3-6**\n\n使用 `@extend` 显示图片\n\n1. 首先，从本书附带的代码下载中下载并解压 `extend` 文件夹——继续将该文件夹保存到我们的项目文件夹中。\n\
    \n2. 接下来，打开你的文本编辑器——我们有一大堆样式要添加到演示中！我们将逐块添加它们，首先从演示的一些基础样式开始：\n\n    ```\n   \
    \ %imgeffect {\n    height: 20%;\n    width: 47%;\n    bottom: 30px;\n    right:\
    \ 12px;\n    box-shadow: 0 33.6px 32px rgba(0,0,0,0.4);\n    }\n    @font-face\
    \ {\n    font-family: 'pt_sansregular';\n    src: url('../font/pt_sansregular.woff')\
    \ format('woff');\n    font-weight: normal;\n    font-style: normal;\n    }\n\
    \    * {\n    box-sizing: border-box;\n    }\n    body {\n    font-family: 'pt_sansregular',\
    \ sans-serif;\n    margin: 32px;\n    }\n    ```\n\n3. 接下来这个代码块为每张宝丽来效果图片添加了一组通用样式：\n\
    \n    ```\n    .polaroid {\n    background: #fff;\n    padding: 16px;\n    box-shadow:\
    \ 0 3.2px 19.2px rgba(0,0,0,0.2);\n    }\n    .polaroid > img {\n    max-width:\
    \ 100%;\n    height: auto;\n    }\n    .caption {\n    font-size: 28px;\n    text-align:\
    \ center;\n    line-height: 32px;\n    }\n    ```\n\n4. 现在我们需要为每张应用了宝丽来效果的图片设置样式——这将添加初始灰度效果，并旋转图片使其偏离水平位置：\n\
    \n    ```\n    .item {\n    width: 30%;\n    display: inline-block;\n    filter:\
    \ grayscale(100%);\n    }\n    .item .polaroid:before {\n    content: \";\n  \
    \  position: absolute;\n    z-index: -1;\n    transition: all 0.35s;\n    }\n\
    \    .item:nth-of-type(4n+1) {\n    transform: scale(0.8, 0.8) rotate(5deg);\n\
    \    }\n    .item:nth-of-type(4n+1) .polaroid:before {\n    @extend %imgeffect;\n\
    \    transform: rotate(6deg);\n    }\n    .item:nth-of-type(4n+2) {\n    transform:\
    \ scale(0.8, 0.8) rotate(-5deg);\n    }\n    .item:nth-of-type(4n+2) .polaroid:before\
    \ {\n    @extend %imgeffect;\n    transform: rotate(-6deg);\n    }\n    .item:nth-of-type(4n+3)\
    \ {\n    transform: scale(0.8, 0.8) rotate(-3deg);\n    }\n    .item:nth-of-type(4n+3)\
    \ .polaroid:before {\n    @extend %imgeffect;\n    transform: rotate(-4deg);\n\
    \    }\n    ```\n\n5. 最后一组规则在我们将鼠标悬停在每张图片上时应用旋转和缩放效果；同时我们还调整了尺寸和阴影效果：\n\n    ```\n\
    \    .item:hover {\n    filter: none;\n    transform: scale(1, 1) rotate(0deg);\n\
    \    transition: all 0.35s;\n    }\n    .item:hover .polaroid:before {\n    z-index:\
    \ -1;\n    transform: rotate(0deg);\n    height: 90%;\n    width: 90%;\n    bottom:\
    \ 0%;\n    right: 5%;\n    box-shadow: 0 16px 48px rgba(0,0,0,0.2);\n    transition:\
    \ all 0.35s;\n    }\n    ```\n\n6. 将文件保存为 `scss` 文件夹中的 `extend.scss`。\n\n7. 接下来，启动一个终端会话，并将工作文件夹切换到项目区域下的\
    \ `extend` 文件夹。\n\n8. 在提示符下，输入以下命令并按回车：\n\n    ```\n    sass sass\\extend.scss\
    \ css\\extend.css\n    ```\n\n9. 如果一切顺利，我们应该会在 `css` 文件夹中看到一个 `extend.css` 文件，以及一个源映射文件——预览结果将显示三张图片被样式化为宝丽来相片，中间那张处于悬停中态（图\
    \ 3-6）。\n\n这个演示算是一次回忆之旅——这种 CSS 样式效果已经存在好几年了。不过，这个故事里还有一点小波折：在我们发现它是什么之前，先来更详细地了解一下我们的代码是如何工作的。\n\
    \n### 详细剖析代码\n\n我们这个宝丽来风格演示中的代码乍看之下似乎有不少样式代码，但实际上，大部分代码都用于为每张图片设置样式。不过，有两个关键声明值得我们探索，它们使用了\
    \ Sass 并让我们的演示栩栩如生。它们分别是扩展块：\n\n```\n%imgeffect {\nheight: 20%;\nwidth: 47%;\n\
    bottom: 30px;\nright: 12px;\nbox-shadow: 0 33.6px 32px rgba(0,0,0,0.4);\n}\n```\n\
    \n...以及我们使用这个扩展的三个声明：\n\n```\n.item:nth-of-type(4n+1) .polaroid:before {\n@extend\
    \ %imgeffect;\ntransform: rotate(6deg);\n}\n.item:nth-of-type(4n+2) .polaroid:before\
    \ {\n@extend %imgeffect;\ntransform: rotate(-6deg);\n}\n.item:nth-of-type(4n+3)\
    \ .polaroid:before {\n@extend %imgeffect;\ntransform: rotate(-4deg);\n}\n```\n\
    \n如果我们将它编译成有效的 CSS，最终会得到如图 3-7 所示的代码。\n\n![../images/472539_1_En_3_Chapter/472539_1_En_3_Fig7_HTML.jpg](img/472539_1_En_3_Fig7_HTML.jpg)\n\
    \n**图 3-7**\n\n从 `@extend` 演示中编译代码\n\n在我们的演示中，我们在第 1 到第 7 行指定了初始扩展；它包含一组标准的 CSS\
    \ 属性，这些属性在每个宝丽来效果中都会用到。在定义三个 `.item:nth-of-type()` 声明时分别调用了这个扩展，每个声明对应一个宝丽来效果实例。图\
    \ 3-7 展示了在 Sassmeister 中编译的两个 `item:nth-of-type()` 声明实例的截图，以此展示其效果外观，我们确实可以看到在附加变体之前显示了通用类。\n\
    \n你可以使用 [Sassmeister.​com](http://sassmeister.com) 上的在线工具亲自尝试——我没有包含第三个实例，因为两个就足以展示使用扩展函数的效果了。\n\
    \n你们中的一些人可能已经注意到了本章前面提到的一点，我们讨论了基础类*和扩展类*都会出现。我并没有看到基础类的存在，尽管理论上它应该被显示——为什么没有呢？\n"
- fmt: "### Using Extends or Mixins?\n\nAha – there is a good reason for this: we’re\
    \ deliberately stopping Sass from displaying it. However, there is more to it\
    \ than just hiding code – it has much to do with how extends work, similarities\
    \ with mixins, and why it is important to choose the right function when writing\
    \ code.\n\nAlthough both mixins and extends are very similar, there are two key\
    \ differences we should be aware of:\n\n- The `extend` rule doesn’t take parameters\
    \ – mixins do.\n- The `extend` rule can combine selectors, whereas mixins don’t.\n\
    \nPut simply, extends are more efficient than mixins, but they don’t give us any\
    \ opportunity to be flexible about values that we might otherwise pass to mixins.\
    \ The best way to illustrate this is with an example; here’s the Sass part of\
    \ the code from the previous demo, rewritten using a mixin:\n\n```scss\n@mixin\
    \ imgeffect {\n  height: 20%;\n  width: 47%;\n  bottom: 30px;\n  right: 12px;\n\
    \  box-shadow: 0 33.6px 32px rgba(0,0,0,0.4);\n}\n.item:nth-of-type(4n+1) .polaroid:before\
    \ {\n  @include imgeffect;\n  transform: rotate(6deg);\n}\n.item:nth-of-type(4n+2)\
    \ .polaroid:before {\n  @include imgeffect;\n  transform: rotate(-6deg);\n}\n\
    .item:nth-of-type(4n+3) .polaroid:before {\n  @include imgeffect;\n  transform:\
    \ rotate(-4deg);\n}\n```\n\nTry dropping this into a Sassmeister session – notice\
    \ how, although it compiles correctly (producing 26 lines of code), it contains\
    \ a great deal of repetition?\n\nClearly this isn’t ideal – it will work, but\
    \ compiling code in this manner will soon add a lot of extra bloat to our style\
    \ sheet, and slow our site down. It’s for this reason that we need to be careful\
    \ about whether we use a mixin or extend – there are some other considerations\
    \ we should take into account when choosing what to use:\n\n- As extends can’t\
    \ accept parameters, this makes them less flexible than mixins – they are best\
    \ suited to replicating the same styles across multiple elements, and where different\
    \ properties are set by exception.\n- We can’t use extends when creating responsive\
    \ media directives; only mixins can be used in this instance.\n- When using classes\
    \ that contain extended code, any subclasses we then specify will automatically\
    \ contain the extended code too. This can make for some odd effects if we’re not\
    \ careful!\n- On a more technical note – many people will claim that extends are\
    \ faster than mixins. However, with modern server technologies (such as file compression),\
    \ this isn’t always the case; in fact, mixins can be more effective, as strings\
    \ are frequently repeated, which works better for compression.\n\nSo – thinking\
    \ back to our code: we can use either an extend or mixin in our instance. I chose\
    \ to use an extend rule to illustrate how they work, but if you have server-based\
    \ compression enabled (as do many servers), then you might decide to use a mixin\
    \ instead. Ultimately it is all about taking care; it will depend on how your\
    \ code is set up, and the number of levels your styles are set, as to which route\
    \ you take when using mixins or extends.\n\n## Summary\n\nThe art of nesting and\
    \ inheriting styles in Sass is a key topic – it’s one where the basics might be\
    \ easy to learn, but mastering it can be a real skill! Over the course of this\
    \ chapter, we’ve been introduced to both nesting and use of the extend rule, so\
