    \    ```\n\n8.  If all is well, we should see a `colorfunctions.css` file appear\
    \ in the `css` folder, along with a source map – previewing the results will show\
    \ a simple template page with styled elements, as indicated in Figure [4-8](#472539_1_En_4_Chapter.xhtml#Fig8).\n\
    \nUp until now, we’ve talked about applying styles to items in an iterative process –\
    \ it doesn’t matter how many items feature in our group; each will have the same\
    \ set of styles applied to them. This demo shows a different way of looping through\
    \ items; it has one key difference, so let’s pause for a moment and reflect on\
    \ the code from our demo in more detail.\n\n### Dissecting the Demo\n\nThe `@each`\
    \ function is different – as a start, there is no emphasis on numbers; `@each`\
    \ will iterate through everything that is included in the targeted list. However,\
    \ where using `@each` helps, is in the ability to group properties together for\
    \ each item in a list; Sass will apply each property to that item in turn.\n\n\
    Take for example our demo – we created a set of three buttons, which had button\
    \ types and colors applied to them, in pairs:\n\n```\n$states: (publish, $publish),\n\
    (postpone, $postpone),\n(delete, $delete);\n@each $buttonstate, $color in $states\
    \ {\n...\n.#{$buttonstate} {\n...\n&:hover { background-color: darken( $color,\
    \ 10% );      transition: all 0.3s ease; }\n&:active { background: darken($color,25%);\
    \ }\n}\n}\n```\n\nWe started by creating a list of items for each button – the\
    \ list items are in pairs, with `$buttonstate` and $color values assigned to each\
    \ button. We then iterate through each pairing, using string interpolation to\
    \ create styles based on the button type. At the same type, we create hover and\
    \ active states for each button, using the supplied $color value which is darkened\
    \ by `10%` for hover and `25%` for active states respectively.\n\n## Looping if\
    \ a Condition Is True\n\nOn occasions we may not have a defined number of items\
    \ to iterate through, or that this number may vary – in these instances using\
    \ a `@for` loop or `@each` in an array will not work. Instead, we must use another\
    \ function – `@while`.\n\nSo – I hear you ask: What’s the difference? Well, the\
    \ answer is simple – it works on the basis that it will keep loop *while a given\
    \ condition can be met*. The moment we can’t satisfy this condition, then the\
    \ loop will stop, and Sass will move on to compile the next set of rules in the\
    \ style sheet. In many cases, a `@while` loop works in much the same way as other\
    \ languages such as JavaScript – to see what I mean, let’s take a look at a simple\
    \ example, where we iterate through ten list items, styling each with a darker\
    \ shade of color.\n\n### Looping @while True\n\nOur demo is very simple to put\
    \ together, so let’s make a start:\n\n![../images/472539_1_En_4_Chapter/472539_1_En_4_Fig9_HTML.jpg](images/472539_1_En_4_Chapter/472539_1_En_4_Fig9_HTML.jpg)\n\
    \nFigure 4-9\n\nStyling list items using a while loop\n\n1.  We’ll begin by downloading\
    \ a copy of the `whileloop` folder from the code download that accompanies this\
    \ book – save it to the root of our project folder.\n\n2.  Next, we need to add\
    \ in our Sass styling – for this, go ahead and create a new file, saving it as\
    \ `whileloop.scss` in the `sass` subfolder in the condition folder we saved in\
    \ step 1.\n\n3.  We have a few style rules to add in, which we will add in block\
    \ by block, starting with some basic styles required to set up our demo:\n\n \
    \   ```\n    $start-color: gainsboro;\n    $end-color: black;\n    $white: #ffffff;\n\
    \    $step: 1; // Set the initial step value\n    @font-face {\n    font-family:\
    \ 'pt_sansregular';\n    src: url('../font/pt_sansregular.woff') format('woff');\n\
    \    font-weight: normal;\n    font-style: normal;\n    }\n    body { font-family:\
    \ 'pt_sansregular', sans-serif; margin: 32px; padding: 32px 80px; width: 550px;\
    \ }\n    ```\n\n4.  We’re creating a set of list items, so for this we need to\
    \ apply some basic styling that is common to each list item, such as font size:\n\
    \n    ```\n    ul { margin: 0; padding: 0; }\n    li {\n    color: $white;\n \
    \   display: inline-block;\n    font-size: 24px;\n    list-style-type: none;\n\
    \    margin-bottom: 3.2px;\n    padding: 8px;\n    width: 80px;\n    }\n    ```\n\
    \n5.  The last part of our Sass styling takes care of applying an increasingly\
    \ darker shade of color to each list item:\n\n    ```\n    @while $step <=10 \
    \ {\n    // changes from one color to another\n    .mix li:nth-child(#{$step})\
    \ {\n    background-color: mix($end-color, $start-color, ($step * 10));\n    }\n\
    \    $step: $step + 1;\n    }\n    ```\n\n6.  Go ahead and save the file – next,\
    \ fire up a terminal session and change the working folder to the `whileloop`\
    \ folder under our project area.\n\n7.  At the prompt, type the following command\
    \ and press Enter:\n\n    ```\n    sass sass\\whileloop.scss css\\whileloop.css\n\
    \    ```\n\n8.  If all is well, we should see a `whileloop.css` file appear in\
    \ the `css` folder, along with a source map – previewing the results will show\
    \ a simple template page with styled elements, as indicated in Figure [4-9](#472539_1_En_4_Chapter.xhtml#Fig9).\n\
    \nWhen working with multiple items of the same type, using a loop is a great way\
    \ to apply styles iteratively, without the need to write out style declarations\
    \ for each item individually. This is a useful technique to learn, even if it\
    \ is not one you might use immediately when starting with Sass – let’s take a\
    \ moment to explore how our code works in more detail."
  trans: "\n### 为每个项目设置样式\n\n让我们开始演示：\n\n![../images/472539_1_En_4_Chapter/472539_1_En_4_Fig8_HTML.jpg](img/472539_1_En_4_Fig8_HTML.jpg)\n\
    \n**图 4-8** 使用 `@each` 创建按钮样式\n\n1. 首先，从本书附带的代码下载中获取 `eachitem` 文件夹的副本，并将其保存到项目文件夹的根目录下。\n\
    \n2. 接下来，我们需要添加 Sass 样式——为此，请创建一个新文件，将其命名为 `eachitem.scss`，并保存在步骤 1 中创建的 `condition`\
    \ 文件夹下的 `sass` 子文件夹中。\n\n3. 我们需要添加几条样式规则，我们将逐块添加，首先从设置演示所需的一些基本样式开始：\n\n    ```\n\
    \    @import url(https://fonts.googleapis.com/css?family=Poiret+One);\n    @font-face\
    \ {\n    font-family: 'pt_sansregular';\n    src: url('../font/pt_sansregular.woff')\
    \ format('woff');\n    font-weight: normal;\n    font-style: normal;\n    }\n\
    \    body {\n    font-family: 'pt_sansregular', sans-serif;\n    margin: 32px;\n\
    \    }\n    ```\n\n4. 接下来是一些我们创建的初始值，以及一个用于成对存储值的 Sass 列表（每对包含按钮类型和指向其颜色的变量）：\n\
    \n    ```\n    $publish: gainsboro;\n    $postpone: antiquewhite;\n    $delete:\
    \ silver;\n    $states: (publish, $publish),\n    (postpone, $postpone),\n   \
    \ (delete, $delete);\n    ```\n\n5. 基础值设置好后，我们现在可以设置按钮的样式——为此，请继续添加以下代码：\n\n \
    \   ```\n    @each $buttonstate, $color in $states {\n    button { color: #000;\
    \ text-decoration: none; padding: 5px 10px; border-radius: 3px; font-family: 'Poiret\
    \ One', cursive; font-size: 32px; font-weight: bold; outline: 0; }\n    .#{$buttonstate}\
    \ {\n    padding: 10px 20px;\n    border: none;\n    background-color: $color;\n\
    \    &:hover { background-color: darken( $color, 10% );      transition: all 0.3s\
    \ ease; }\n    &:active { background: darken($color,25%); }\n    }\n    }\n  \
    \  ```\n\n6. 保存文件——接下来，打开一个终端会话，将工作目录切换到项目区域下的 `eachitem` 文件夹。\n\n7. 在提示符下，输入以下命令并按回车键：\n\
    \n    ```\n    sass sass\\eachitem.scss css\\eachitem.css\n    ```\n\n8. 如果一切顺利，我们应该会在\
    \ `css` 文件夹中看到一个 `colorfunctions.css` 文件，以及一个源映射文件——预览结果将显示一个带有样式元素的简单模板页面，如图\
    \ 4-8 所示。\n\n到目前为止，我们讨论了在迭代过程中为项目应用样式——无论组中有多少个项目，每个项目都会应用相同的样式集。本演示展示了一种遍历项目的不同方式；它有一个关键区别，所以让我们暂停片刻，更详细地回顾一下我们演示中的代码。\n\
    \n### 剖析演示\n\n`@each` 函数有所不同——首先，它不强调数字；`@each` 会遍历目标列表中的所有内容。然而，`@each` 的好处在于，它能够为列表中的每个项目将属性分组在一起；Sass\
    \ 会依次将每个属性应用于该项目。\n\n以我们的演示为例——我们创建了一组三个按钮，它们成对地应用了按钮类型和颜色：\n\n```\n$states: (publish,\
    \ $publish),\n(postpone, $postpone),\n(delete, $delete);\n@each $buttonstate,\
    \ $color in $states {\n...\n.#{$buttonstate} {\n...\n&:hover { background-color:\
    \ darken( $color, 10% );      transition: all 0.3s ease; }\n&:active { background:\
    \ darken($color,25%); }\n}\n}\n```\n\n我们首先为每个按钮创建一个项目列表——列表项是成对的，每个按钮都分配了 `$buttonstate`\
    \ 和 `$color` 值。然后，我们遍历每一对，使用字符串插值根据按钮类型创建样式。同时，我们为每个按钮创建悬停和激活状态，使用提供的 `$color`\
    \ 值，悬停时颜色变深 `10%`，激活时颜色变深 `25%`。\n\n## 在条件为真时循环\n\n有时，我们可能没有定义要遍历的项目数量，或者这个数量可能会变化——在这些情况下，使用\
    \ `@for` 循环或数组中的 `@each` 将不起作用。相反，我们必须使用另一个函数——`@while`。\n\n那么——我听到你在问：有什么区别？答案很简单——它基于“只要满足给定条件就继续循环”的原则。一旦我们无法满足这个条件，循环就会停止，Sass\
    \ 将继续编译样式表中的下一组规则。在许多情况下，`@while` 循环的工作方式与其他语言（如 JavaScript）非常相似——为了理解我的意思，让我们看一个简单的示例，其中我们遍历十个列表项，并为每个项应用更深的颜色阴影。\n\
    \n### 循环 `@while` 真\n\n我们的演示非常容易搭建，让我们开始：\n\n![../images/472539_1_En_4_Chapter/472539_1_En_4_Fig9_HTML.jpg](img/472539_1_En_4_Fig9_HTML.jpg)\n\
    \n**图 4-9** 使用 while 循环设置列表项样式\n\n1. 首先，从本书附带的代码下载中获取 `whileloop` 文件夹的副本，并将其保存到项目文件夹的根目录下。\n\
    \n2. 接下来，我们需要添加 Sass 样式——为此，请创建一个新文件，将其命名为 `whileloop.scss`，并保存在步骤 1 中创建的 `condition`\
    \ 文件夹下的 `sass` 子文件夹中。\n\n3. 我们需要添加几条样式规则，我们将逐块添加，首先从设置演示所需的一些基本样式开始：\n\n    ```\n\
    \    $start-color: gainsboro;\n    $end-color: black;\n    $white: #ffffff;\n\
    \    $step: 1; // 设置初始步骤值\n    @font-face {\n    font-family: 'pt_sansregular';\n\
    \    src: url('../font/pt_sansregular.woff') format('woff');\n    font-weight:\
    \ normal;\n    font-style: normal;\n    }\n    body { font-family: 'pt_sansregular',\
    \ sans-serif; margin: 32px; padding: 32px 80px; width: 550px; }\n    ```\n\n4.\
    \ 我们正在创建一组列表项，因此需要应用一些每个列表项共有的基本样式，例如字体大小：\n\n    ```\n    ul { margin: 0; padding:\
    \ 0; }\n    li {\n    color: $white;\n    display: inline-block;\n    font-size:\
    \ 24px;\n    list-style-type: none;\n    margin-bottom: 3.2px;\n    padding: 8px;\n\
    \    width: 80px;\n    }\n    ```\n\n5. Sass 样式的最后一部分负责为每个列表项应用逐渐加深的颜色阴影：\n\n\
    \    ```\n    @while $step <=10  {\n    // 从一种颜色渐变到另一种颜色\n    .mix li:nth-child(#{$step})\
    \ {\n    background-color: mix($end-color, $start-color, ($step * 10));\n    }\n\
    \    $step: $step + 1;\n    }\n    ```\n\n6. 保存文件——接下来，打开一个终端会话，将工作目录切换到项目区域下的\
    \ `whileloop` 文件夹。\n\n7. 在提示符下，输入以下命令并按回车键：\n\n    ```\n    sass sass\\whileloop.scss\
    \ css\\whileloop.css\n    ```\n\n8. 如果一切顺利，我们应该会在 `css` 文件夹中看到一个 `whileloop.css`\
    \ 文件，以及一个源映射文件——预览结果将显示一个带有样式元素的简单模板页面，如图 4-9 所示。\n\n当处理多个相同类型的项目时，使用循环是一种以迭代方式应用样式的好方法，无需为每个项目单独编写样式声明。这是一项值得学习的有用技术，即使你在刚开始使用\
    \ Sass 时可能不会立即用到它——让我们花点时间更详细地探讨我们的代码是如何工作的。\n"
- fmt: "# Exploring the Code in Detail\n\nSo – how does our code work? Well, most\
    \ of the style declarations are standard CSS – the key to making our demo work\
    \ lies in this function:\n\n```\n@while $step <=10  {\n// changes from one color\
    \ to another\n.mix li:nth-child(#{$step}) {\nbackground-color: mix($end-color,\
    \ $start-color, ($step * 10));\n}\n$step: $step + 1;\n}\n```\n\nIn this code,\
    \ we create a loop, with a variable `$step` set to an (implied) value of zero.\
    \ We then use this value to replace the code highlighted in bold (an interpolated\
    \ string), to create our rule – this rule contains a declaration for `background-color`,\
    \ which is a mix of two colors (gainsboro – or very light gray - and black). We\
    \ then round out the loop by increasing the value of `$step` by 1 – this moves\
    \ us onto the next list item in the group. We can see the effects of this function\
    \ in the example code shown in Figure [4-10](#472539_1_En_4_Chapter.xhtml#Fig10).\n\
    \n![../images/472539_1_En_4_Chapter/472539_1_En_4_Fig10_HTML.jpg](images/472539_1_En_4_Chapter/472539_1_En_4_Fig10_HTML.jpg)\n\
    \n**Figure 4-10** Compiled code from a `@while` loop\n\nSee how easy that was\
    \ to style each item? Granted, our code is probably a little over-simplistic,\
    \ but the same principle of repeatability applies here too – as long as we have\
    \ a suitable group of elements (such as list items), we can then use Sass to apply\
    \ styles to each automatically.\n\nOkay – let’s move on: it’s time to turn our\
    \ attention to a more recent addition to Sass. When styling elements, we might\
    \ create a “palette” of styles that should be kept for certain elements, such\
    \ as headings or tables. Instead of creating a host of different variables, we\
    \ can use a more efficient process: we can create a map. Okay – I don’t mean trying\
    \ to replicate cartographers have been doing for years, but something different:\
    \ a way of referring to particular properties that have been grouped together.\
    \ Let’s dive in and take a look to see what this means in practice.\n\n## Applying\
    \ Styles to a Property List or Map\n\nAlthough Sass maps are a relatively new\
    \ concept to Sass (having been introduced in version 3.3 of Ruby Sass, the predecessor\
    \ to Dart Sass), it is worth its weight in gold – why? Well, let me explain how\
    \ they work:\n\nHistorically, we would likely have created multiple variables\
    \ to store values – this works, but is a very manual, inefficient way to store\
    \ values: in addition, we can’t really group each item, save for where they might\
    \ appear in a style sheet.\n\nInstead, we can use a map – these consist of a minimum\
    \ of two parts: the initial map variable and the block where we call each reference.\
    \ In the single variable, we can assign multiple key pairings, using this syntax:\n\
    \n```\n$map: (key1: value1, key2: value2, key3: value3);\n```\n\n… where the key\
    \ is the map reference, and the value is the attribute we want to display in our\
    \ style sheet at compilation. When we need to call a value, we would use something\
    \ akin to this:\n\n```\ntext-align: map-get(, )\n```\n\nLet’s put this into practice,\
    \ by revisiting one of my favorite effects – we’ll style an image of a vintage\
    \ camera, using the classic Polaroid effect.\n\n### Creating And Using Sass Maps\n\
    \nFor this next demo, we’ll use a premade demo that already uses Sass but which\
    \ can easily be converted to use a Sass map. Our vintage camera image was sourced\
    \ from the Pexels website at [`https://www.pexels.com/photo/antique-camera-classic-lens-242433/`](https://www.pexels.com/photo/antique-camera-classic-lens-242433/).\n\
    \nLet’s update the demo to use a Sass map:\n\n![../images/472539_1_En_4_Chapter/472539_1_En_4_Fig11_HTML.jpg](images/472539_1_En_4_Chapter/472539_1_En_4_Fig11_HTML.jpg)\n\
    \n**Figure 4-11** Creating a Polaroid image using a map\n\n1.  We’ll begin by\
    \ downloading a copy of the `sassmap` folder from the code download that accompanies\
    \ this book – save it to the root of our project folder.\n\n2.  This time around,\
    \ our demo already has Sass styling, but we’re going to modify it – for this,\
    \ open the `sassmap.scss` file in the `sass` subfolder in the `sassmap` folder\
    \ we saved in step 1.\n\n3.  At the top of the file, go ahead and insert this,\
    \ before the opening `@font-face` declaration:\n\n    ```\n    $styling-figcaption:\
    \ (\n    'text-align': center,\n    'font-family': Reenie Beanie,\n    'font-size':\
    \ 20.8px,\n    'color': #454f40,\n    'letter-spacing': 1.44px,\n    );\n    ```\n\
    \n4.  Scroll down until you see `figcaption{`, on or around line 69.\n\n5.  Go\
    \ ahead and replace the contents of this style rule, so it looks like this:\n\n\
    \    ```\n    figcaption {\n    text-align: map-get($styling-figcaption, 'text-align');\n\
    \    font-family: map-get($styling-figcaption, 'font-family');\n    font-size:\
    \ map-get($styling-figcaption, 'font-size');\n    color: map-get($styling-figcaption,\
    \ 'color');\n    letter-spacing: map-get($styling-figcaption, 'letter-spacing');\n\
    \    }\n    ```\n\n6.  Go ahead and save the file – next, fire up a terminal session\
    \ and change the working folder to the `sassmap` folder under our project area.\n\
    \n7.  At the prompt, type the following command and press Enter:\n\n    ```\n\
    \    sass sass\\sassmap.scss css\\sassmap.css\n    ```\n\n8.  If all is well,\
    \ we should see a `sassmap.css` file appear in the `css` folder, along with a\
    \ source map – previewing the results will show a simple template page with styled\
    \ elements, as indicated in Figure [4-11](#472539_1_En_4_Chapter.xhtml#Fig11).\n\
    \nA really simple change to make, but one which makes our code infinitely easier\
    \ to manage – not only can we now access each property from a single variable,\
    \ we can do so multiple times throughout our code. We’ve only scratched the surface\
    \ of how maps work in Sass, though: there is a lot more we can do! Nevertheless,\
    \ it’s worth spending a moment going through our code, to see just how powerful\
    \ maps really are in Sass development.\n\n### Breaking Down Our Code\n\nAt first\
    \ glance, our updated code may look more “wordy” (i.e., there is more code there\
    \ than previously). However, bear in mind that Sass often has instances where\
    \ this is the case – in this case, it’s all about making it easier to get a sense\
    \ of which value we are using in our code.\n\nOur code starts by adding in a map,\
    \ which is a group of paired properties; this is assigned to a single variable.\
    \ Think of it as an array, for those of you who are familiar with this technique;\
    \ it works in much the same way. Maps are perfect for grouping together common\
    \ styles for particular elements on a page, such as titles or an `<h2>` tag.\n\
    \nWe then make reference to this map when we create the `figcaption` rule – instead\
    \ of entering the values directly into the rule, we simply replace them with calls\
    \ to the `$styling-figcaption` map, with appropriate references to the attribute\
    \ we want to retrieve.\n\nThe grouping together makes it easier to identify what\
    \ that property relates to, and eliminates the need for multiple variables in\
    \ our code. So – for example, if we were to call `map-get($styling-figcaption,\
    \ 'text-align')`, we would get back `center` as the attribute. We might have initially\
    \ set that as one of several attributes for titles (as mentioned previously),\
    \ but we can call this `map-get()` function and use it for any example in our\
    \ code, not just for titles!"
