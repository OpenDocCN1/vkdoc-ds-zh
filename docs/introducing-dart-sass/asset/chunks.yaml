  trans: "\n### 重构 WordPress\n\n在本练习中，我们需要一份自托管版本的 WordPress 副本——你可以从 WordPress 官网下载：Windows\
    \ 版本请访问[`https://wordpress.org/latest.zip`](https://wordpress.org/latest.zip)，Linux\
    \ 和 macOS 版本请访问[`https://wordpress.org/latest.tar.gz`](https://wordpress.org/latest.tar.gz)。撰写本文时的当前版本是\
    \ 4.9.8，不过同样的原理适用于任何 WordPress 主题。\n\n让我们开始吧：\n\n1.  首先，我们需要为转换过程创建一个工作文件夹——将其保存为项目目录下的\
    \ `theme` 文件夹。\n2.  接着，解压一份样式表副本——你会在 `/wordpress/wp-content/themes` 下的 `twentyseventeen`\
    \ 主题文件夹中找到它。我建议保留两份副本：一份保存在名为 `original` 的新文件夹中（位于 `wordpress` 目录下），另一份保存在 `wordpress`\
    \ 文件夹的根目录下；将第二份重命名为 `style.scss`。\n3.  浏览一番后，选择一个章节来处理——我假设你选择了 `18.0 SVGs Fallbacks`，因为它内容简洁明了；如果你决定选择其他章节，请相应调整。\n\
    4.  在我们的 `wordpress` 文件夹中，创建一个名为 `fallback` 的新文件夹。在其中创建一个新文件，并将其保存为 `fallback.scss`。\n\
    5.  接着，打开 `style.scss` 的副本，找到第 18 节——它大约从第 3149 行开始。将该节中的所有行复制并粘贴到 `fallback.scss`\
    \ 文件中，然后保存。\n6.  回到 `style.scss`，删除本节中的原始行（大约第 3149 行到第 3206 行）。\n7.  在原来的位置（第\
    \ 3149 行）添加以下代码：\n    ```\n    @import \"fallback/svg.scss\"\n    ```\n8.  继续保存\
    \ `style.scss` 和 `fallback.scss` 两个文件。\n9.  启动一个终端会话，然后将工作文件夹切换为我们在步骤 1 中创建的 `wordpress`\
    \ 文件夹。\n10. 在提示符下输入以下命令并按回车键：\n    ```\n    sass style.scss css\\style.css\n \
    \   ```\n11. 如果我们查看 `css` 文件夹内部，应该会看到两个新文件——`style.css` 和 `style.css.map`；它们包含了更新后的样式。\n\
    12. 打开编译后的文件，按 Ctrl+F 搜索“18.0 SVGs Fallbacks”；你应该会看到我们的回退代码块已被重新编译到主样式表中。\n\n\
    注意到代码看起来没什么不同，但你现在可以用更小的文件来管理它了吗？真正的考验在于，如果我们在激活了该主题的 WordPress 环境中运行它，成功的测试结果将是：即使主题已通过\
    \ Sass 编译，我们也看不到任何明显变化。\n\n如果你将原始样式表副本（我希望你已经在步骤 2 中创建的 `original` 文件夹中）与重新编译后的版本进行比较，可能会发现注释已被移除，但除此之外\
    \ CSS 应该是一致的。这是转换过程成功的良好指标，表明我们的主题将继续像改动前一样正常运行。\n\n假设首次改动能成功，这只是我们文件转换之旅的开端——我们还可以做更多事情！为了让你领略一下可能实现的效果，让我们深入探讨一下首次改动的细节，并就如何将主题转换为使用\
    \ Sass 提出一些建议。\n\n### 深入探索改动与更多细节\n\n看起来我们经历了不少步骤，但实际上，我们可以通过让编译过程自动化来简化操作——在步骤\
    \ 10 的代码末尾添加 `--watch` 参数即可。不过，只要逐节操作（每节之后添加相应的 import 语句），我们的大部分工作只是简单的剪切粘贴。关键在于有条不紊并保持专注——在转换代码时很容易分心！\n\
    \n那么——继续这些改动如何？我们可以自己逐一处理，但恰好有一个已经转换为使用 Sass 的在线版本可供参考。\n\n代码托管在 GitHub 上，由开发者\
    \ Jim Frenette 创建；你可以在这里看到：[`https://github.com/jimfrenette/twentyseventeen-sass`](https://github.com/jimfrenette/twentyseventeen-sass)。\n\
    \n但我绝对鼓励你先亲自尝试转换样式表——不尝试就直接拿到答案可没什么乐趣！考虑到这一点，我将挑选几个示例，说明哪些内容可以轻松改动：\n\n*   我建议添加一个\
    \ `variables.scss` 文件——可以将其保存到名为 `base` 的文件夹中，然后在样式表顶部用 `@import \"base/variables.scss\"\
    ` 导入。这个文件用于存储所有初始变量，比如颜色、字体系列或字体大小。\n*   然后我们可以利用这个变量文件——例如，查看第 10 节，这部分负责链接的样式。开头的几行代码如下：\n\
    \    ```\n    a {\n    color: #222;\n    text-decoration: none;\n    }\n    a:focus\
    \ {\n    outline: thin dotted;\n    }\n    a:hover,\n    a:active {\n    color:\
    \ #000;\n    outline: 0 ;\n    }\n    ```\n    我们可以将其转换为以下形式——它使用了嵌套和变量（所以得先创建好\
    \ `variables.scss` 文件！）：\n    ```\n    a {\n    color: $black2;\n    text-decoration:\
    \ none;\n    &:focus {\n    outline: thin dotted;\n    }\n    &:hover, &:active\
    \ {\n    color: $black1;\n    outline: 0;\n    }\n    }\n    ```\n*   再比如第 11\
    \ 节——特色图片悬停效果；这可以很容易地转换为如下形式：\n    ```\n    /*-----------------------------------------------------\n\
    \    11.0 Featured Image Hover\n    -----------------------------------------------------*/\n\
    \    .post-thumbnail {\n    margin-bottom: 1em ;\n    a {\n    img {\n    -webkit-backface-visibility:\
    \ hidden;\n    transition: opacity 0.2s;\n    }\n    &:hover img, &:focus img\
    \ {\n    opacity: 0.7;\n    }\n    }\n    }\n    ```\n*   稍微复杂一点，但值得一试：创建一个 mixin\
    \ 来将字体大小转换为对应的 rem 单位？WordPress 同时使用了像素值和 rem 值——像这样的 mixin 就能处理这个问题：\n    ```\n\
    \    // 用法：x 是所需的像素尺寸：@include font-size(x);\n    @mixin font-size($sizeValue:\
    \ 15) {\n    font-size: $sizeValue + px;\n    font-size: ($sizeValue / 16) + rem;\n\
    \    }\n    ```\n*   那么——当样式表中可能有这样的代码时：\n    ```\n    .pagination, .comments-pagination\
    \ {\n    border-top: 1px solid $silver2;\n    font-size: 14px;\n    font-size:\
    \ 0.875rem;\n    font-weight: 800;\n    padding: 2em 0 3em;\n    text-align: center\
    \ ;\n    }\n    ```\n    ...我们可以更新它，使用 mixin 自动提供字体大小，从而避免手动计算相关尺寸：\n    ```\n\
    \    .pagination, .comments-pagination {\n    @include font-size(14);\n    border-top:\
    \ 1px solid $silver2;\n    font-weight: 800;\n    padding: 2em 0 3em;\n    text-align:\
    \ center;\n    }\n    ```\n\n这些只是我们可以对样式表进行改动的几个示例——在每种情况下，我都尽量保持简单，但随着你越来越熟悉这些改动，我相信你会发现更多更复杂、需要更多工作的改动！但诀窍在于始终有条不紊——将其视为一个逐步演进的过程，在得到最终解决方案之前需要多次迭代。\n"
- fmt: "# Summary\n\nManaging styles is clearly an important part of building any\
    \ online-based project – it’s unlikely that we’ll ever have a really small site;\
    \ it’s more probable that we’ll have a lengthy style sheet that will soon collapse\
    \ into chaos without careful management! Over the course of this chapter, we’ve\
    \ covered some useful tricks to help make Sass-based style sheets easier to manage\
    \ – let’s take a moment to review what we’ve covered in this chapter.\n\nWe kicked\
    \ off with an introduction to how we might begin to convert an existing project\
    \ to use Sass – we explored some of the key points that we need to bear in mind,\
    \ before making a start on a first-pass type transformation, using one of the\
    \ conversion tools available online.\n\nNext up, we moved to how we might begin\
    \ to break down our code into smaller, more manageable chunks, and that as part\
    \ of this, we may make use of external libraries to help cut down the development\
    \ time. We explored some of the pitfalls we might encounter when using this approach,\
    \ and how with careful management we can begin to transform our code into something\
    \ that is easier to manage.\n\nWe then moved onto covering an important part of\
    \ importing libraries – the optimization process, where we learned two key tricks\
    \ to help get started with getting used to optimizing our code. We then rounded\
    \ out the chapter with a real-world example of converting a large style sheet\
    \ into something we can use with Sass, and learned how no matter what the size\
    \ of the style sheet, we can still make use of some basic principles to convert\
    \ it to using Sass.\n\nWe’re almost at the end of this book, but before we reach\
    \ that point, it’s time to get stuck into a real project! There are countless\
    \ uses for Sass – pretty much wherever we might have CSS, Sass can be used. Over\
    \ the course of the next chapter, we’re going to bring together some of skills\
    \ we’ve covered over the course of this book and use them to create something\
    \ that we’ll see on any e-commerce-based site – a shopping cart. Ready to make\
    \ a start ...?\n\n# 6. Introducing Our Project\n\nOver the course of this book,\
    \ we’ve introduced a host of different features of Sass and begun to explore how\
    \ we might make use of them in our projects. The real test, though, comes when\
    \ we start to tie everything together and begin to build something more practical.\
    \ The question is – what should we build?\n\nWell, coming from an e-commerce background,\
    \ it makes sense to investigate building something e-commerce related, right?\
    \ After all, e-commerce (according to a study by eMarketeer in 2016), is expected\
    \ to experience double-digit growth until 2020 – with sales estimated to top 27\
    \ trillion dollars! I think the phrase “no-brainer” comes to mind…\n\nIf you would\
    \ like to learn more, the report is available on the eMarkeeter website, at [`https://bit.ly/2b9RZHd`](https://bit.ly/2b9RZHd).\n\
    \nThat aside, over the next few pages, we will indeed focus on an e-commerce-related\
    \ theme – we’re going to mock up a demo shopping cart. For reasons of space, we’ll\
    \ focus more on the Sass styling (as it is, of course, the theme for this book);\
    \ we will touch on some of the HTML markup and JavaScript used to power the site.\
    \ With this in mind, let’s make a start on setting up our cart – we’ll begin with\
    \ a look at setting up our development environment and getting the HTML markup\
    \ in place.\n\n## Setting Up Our Initial Cart\n\nIn the age of the Internet, it\
    \ doesn’t seem sensible to try to reinvent the wheel, right? There are dozens\
    \ of examples of carts available online, all of which have their own features,\
    \ and which use a variety of technologies to power the cart.\n\nFor the purposes\
    \ of this demo, I’ve elected to base ours on one created by Žiga Miklič, which\
    \ uses plain HTML markup along with standard CSS and jQuery to power the site.\
    \ Our version will have been converted to use Sass; I’ve also simplified the look\
    \ and feel and updated the CSS to remove some of the outdated vendor prefixes.\
    \ This will have the added benefit of showing you how one might convert an existing\
    \ site to using Sass, rather than building a solution from scratch.\n\nYou can\
    \ see the original version of this cart at [`https://codepen.io/ziga-miklic/pen/xhpob`](https://codepen.io/ziga-miklic/pen/xhpob).\n\
    \nOkay – the first stage is to get our markup in place and set up our compilation\
    \ process. For this demo, we’ll use Node.js – this is not only for the purposes\
    \ of compiling Sass, but to also add a source map (to translate our compiled CSS\
    \ into the equivalent source location in the Sass code). We’ll also make use of\
    \ Autoprefixer to add in any vendor prefixes automatically – there shouldn’t be\
    \ any now, but it is nevertheless preferred practice when working with Sass.\n\
    \n### Getting Set Up\n\nAssuming Node.js is installed, let’s make a start:\n\n\
    1. We’ll start by extracting a copy of the `shoppingcart` folder – go ahead and\
    \ save it locally in our project folder. This contains our markup (`shoppingcart.html`),\
    \ along with the requisite font, image, and JavaScript files needed for our demo.\n\
    \n2. Next, fire up a Node.js terminal session as administrator, and change the\
    \ working folder to the `shoppingcart` folder we saved in step 1.\n\n3. Start\
    \ a Node.js terminal session, then at the prompt enter this command and press\
    \ Enter: `npm install` – this will install a number of packages using the supplied\
    \ `package.json` file:\n   - Gulp – for automating tasks,\n   - Autoprefixer (for\
    \ Gulp) – for handling any vendor prefixes,\n   - Dart Sass,\n   - Sourcemaps\
    \ for Gulp – to provide source maps for translating compiled CSS into the relevant\
    \ source Sass code.\n   \n   Re-install required – it might show a few warnings,\
    \ but these can be ignored for the purposes of this demo.\n\n4. Once installation\
    \ has completed, enter `gulp` at the prompt and press Enter.\n\n5. If no errors\
    \ are displayed, then you can close the terminal session for now.\n\nAt this point\
    \ the Gulp task will run but we won’t get anything to appear in the `css` folder\
    \ – don’t worry: it might seem a little odd to do this, but it’s purely to prove\
    \ that our compilation process is working! There are a couple of points of note\
    \ here, though, so before we move onto setting up our style sheet, let’s pause\
    \ for a moment to understand the initial setup in more detail."
