    \ move on: we’re almost ready to start looking at a new part of Sass, but before\
    \ we do so, we need to revisit a feature we’ve touched on earlier in this chapter.\
    \ Managing Sass style sheets can get tricky, the larger they grow. The question\
    \ is how to best manage them before they do get too unwieldy?"
  trans: "\n### 理解代码的工作原理\n\n那么，尽管我们使用了 CSSgram 混合宏库，为什么我们的 CSS 样式表并没有变得比预期更大呢？\n\n\
    实现这一效果的诀窍在于样式表开头使用了 `@import` 语句——默认情况下，Sass 只会导入代码中*有直接引用*的混合宏。在这个例子中，我们只调用了\
    \ `stinson` 混合宏，因此 Sass 在编译期间会直接忽略 `scss` 文件夹中所有其他的滤镜混合宏文件。\n\n导入文件时，文件扩展名并非必须包含：在本例中，我们同样可以在演示中使用\
    \ `@import \"cssgram\";`。我们将在本章后面部分提到这一点。\n\n然而，这里有一个转折：眼尖的你应该会发现，我们的代码中没有包含 `@mixin`\
    \ 关键字！这是怎么回事？其实，我们使用了另一个特性：`@extend`。我们将在第 3 章“创建嵌套样式”中详细讨论这一点，但现在，只需知道它的工作方式与混合宏类似，但可以生成更高效的代码即可。\n\
    \n不过，如果你查看一下 `stinson.scss` 文件，确实会看到使用中的 `@include` 关键字；它调用了一个基础滤镜混合宏，该混合宏被用于\
    \ CSSgram 库中的所有滤镜。然而，混合宏和 `@extend` 关键字的工作方式存在一些关键区别；我们将在下一章探讨 `@extend` 的使用时，更详细地研究这一点。\n\
    \n好吧，我们继续：创建或导入基础混合宏是编写更高效代码的绝佳方式，但有一个小小的限制。有时，你可能会遇到多个代码块本可由同一个混合宏处理，但所需的值却不同。通常我们可能会认为无能为力，但既然我们使用的是\
    \ Sass，那就有办法——是时候了解一下带参数混合宏了。\n\n## 向混合宏传递值\n\n到目前为止，我们已经探讨了如何创建和使用混合宏——这些宏非常适合包含可重用的静态规则组，但如果我们遇到本可以使用混合宏，却因值不完全相同而无法使用的情况，该怎么办呢？\n\
    \n有时我们或许可以微调值来达到目的，但这不太可能——更好的方法是使用带参数混合宏。它们的工作方式与标准混合宏非常相似，但有一个区别：不是包含一组静态值，而是可以向混合宏传递不同的值，并让\
    \ Sass 将其渲染为标准 CSS。\n\n带参数混合宏的语法非常相似——开头同样是 `@mixin` 关键字，但这次我们会在其中包含要传递给混合宏的值：\n\
    \n```\n@mixin button-bg($bg, $fg) {\n...值在混合宏中使用...\n}\n```\n\n在编译时，Sass 会将不同的值插入到混合宏中的占位符，并将其编译为有效的\
    \ CSS，以便在项目中使用。我们可以通过创建一个围绕普通按钮的演示来更详细地了解其工作原理——网站中经常使用不同的颜色，因此这非常适合使用混合宏。\n\n\
    ### 创建带参数混合宏\n\n让我们开始创建演示：\n\n![../images/472539_1_En_2_Chapter/472539_1_En_2_Fig9_HTML.jpg](img/472539_1_En_2_Fig9_HTML.jpg)\n\
    \n**图 2-9** 使用带参数混合宏创建按钮\n\n1. 首先，我们将 `parametric` 文件夹的副本下载并解压到项目区域。\n2. 在你常用的文本编辑器中，创建一个新文档，然后添加以下几行代码——我们将为演示添加一些基础样式：\n\
    \n    ```\n    @mixin button-bg($bg, $fg) {\n    background: $bg;\n    color:\
    \ $fg;\n    &:hover {\n    background:darken($bg,8%);\n    transition: all 0.3s\
    \ ease ;\n    }\n    &:active {\n    background:darken($bg,30%);\n    }\n    }\n\
    \    @font-face { font-family: 'pt_sansregular'; src: url('../font/pt_sansregular.woff')\
    \ format('woff'); font-weight: normal; font-style: normal; }\n    body { font-family:\
    \ 'pt_sansregular', sans-serif; padding: 20px;}\n    h2 { text-align: center;\
    \ }\n    p { margin: 0; padding: 0; margin-bottom: 30px; width: 480px; margin-left:\
    \ auto; margin-right: auto;\n    ```\n\n3. 现在，我们需要添加将按钮放置到页面上的样式：\n\n    ```\n\
    \    .wrap { margin:0 auto; width: 800px; text-align:center; }\n    .btn { text-decoration:\
    \ none; padding: 5px 10px; border-radius: 4px; font-size: 22px; }\n    ```\n\n\
    4. 我们已经为按钮添加了基础样式，但要让它们看起来像样，我们需要提供一些颜色。以下规则将实现这一点：\n\n    ```\n    .btn-antiquewhite\
    \ { @include button-bg(#faebd7, #000); }\n    .btn-darkgrey { @include button-bg(#a9a9a9,\
    \ #000); }\n    .btn-gainsboro{ @include button-bg(#dcdcdc, #000); }\n    .btn-slategrey\
    \ { @include button-bg(#708090, #fff); }\n    ```\n\n5. 将此文件保存为 `parametric.scss`，放在我们在步骤\
    \ 1 中保存的 `parametric` 文件夹下的 `scss` 子文件夹中。\n6. 接下来，打开一个终端会话，将工作目录切换到项目区域下的 `parametric`\
    \ 文件夹。在提示符下，输入以下命令并按回车键：\n\n    ```\n    sass sass\\parametric.scss css\\parametric.css\n\
    \    ```\n\n7. 如果一切顺利，我们应该会在 `css` 文件夹中看到一个 `parametric.css` 文件（与之前的练习一样），以及一个源映射——预览结果将显示一系列样式化的按钮，如图\
    \ 2-9 所示。\n\n这个演示可能很简单，但它是说明使用带参数混合宏有效性的绝佳方式。我们使用相同的基础代码创建了四个不同的按钮，但传入了不同的值——让我们看看这在实践中是如何工作的。\n\
    \n### 剖析我们的代码\n\n那么，我们的演示是如何成功创建四个形状相同、但颜色各异的按钮的呢？使演示生效的诀窍在于这个混合宏：\n\n```\n@mixin\
    \ button-bg($bg, $fg) {\nbackground: $bg;\ncolor: $fg;\n&:hover {\nbackground:darken($bg,8%);\n\
    transition: all 0.3s ease;\n}\n&:active {\nbackground:darken($bg,30%);\n}\n}\n\
    ```\n\n它本身不会做任何事情，但一旦我们在代码中调用它，它就会编译成每个按钮所需的样式。以第一次调用为例：\n\n```\n.btn-antiquewhite\
    \ { @include button-bg(#faebd7, #000); }\n```\n\n...我们看到传入的第一个值是 `#faebd7`；这代表一种米白色（或古董白）。传入混合宏的第二个值是黑色——这将用于设置按钮中文本的样式。\n\
    \n当我们查看悬停函数时，情况变得有趣起来——这里使用了几个新关键字。首先是 `&:` 的使用——这是对父选择器的引用，因此在编译后，它变成了 `.btn-antiquewhite:hover`。然后我们使用\
    \ `$bg` 变量（代表传入混合宏的第一个值）和 Sass 的 `darken()` 函数来生成两种新颜色：用于悬停状态的 `#f5d9b3` 和用于按钮激活状态的\
    \ `#e9a74f`。\n\n我们将在下一章中作为嵌套的一部分，重新讨论父选择器的引用。\n\n好吧，我们继续：我们差不多准备好开始学习 Sass 的新内容了，但在那之前，我们需要重新回顾一下本章前面提到的一个特性。管理\
    \ Sass 样式表可能会变得棘手，尤其是在它们变得越来越大时。问题在于，在它们变得过于庞大笨重之前，如何最好地管理它们呢？\n"
- fmt: "# Working Across Multiple Files\n\nOver the course of this chapter, we’ve\
    \ created simple style sheets – these work well, but as we’ve just mentioned,\
    \ they can cause real problems if they get too large!\n\nThankfully we can make\
    \ use of Sass’s `@import` option to help break down our style sheet into smaller,\
    \ more manageable chunks. This function already exists within standard CSS, but\
    \ Sass extends its functionality. We touched on how to use it back in the “Using\
    \ prebuilt mixins” demo; as a quick reminder, we can create any number of Sass\
    \ files, which contain variables, mixins, and the like:\n\n```\n// _reset.scss\n\
    html, body, ul, ol { margin:  0; padding: 0; }\n```\n\nWe then import them into\
    \ our style sheet as needed, as indicated in this example:\n\n```\n// base.scss\n\
    @import 'reset';\nbody { font: 100% Helvetica, sans-serif; background-color: #efefef;\
    \ }\n```\n\nNotice how in our `base.scss` example file, we’re not specifying a\
    \ file extension? These are not obligatory; Sass will look for files that end\
    \ in either `.sass` (the old format), or `.scss` (the current format) and import\
    \ them accordingly. In this case, our code example would compile to this:\n\n\
    ```\nhtml, body, ul, ol { margin: 0; padding: 0; }\nbody { font: 100% Helvetica,\
    \ sans-serif; background-color: #efefef; }\n```\n\nThis gives us a perfect excuse\
    \ to group styles together in separate files, such as variables, font mixins,\
    \ resets, and so on – we can then import them as needed into our project.\n\n\
    To learn more about importing, please refer to the documentation on the Dart Sass\
    \ site at [`http://sass-lang.com/documentation/file.SASS_REFERENCE.html#import`](http://sass-lang.com/documentation/file.SASS_REFERENCE.html#import).\n\
    \nIn our next demo, we’ll put this to the test by converting our previous buttons\
    \ demo to use an imported file – you’ll see how easy it is to make the switch!\n\
    \n## Importing Files\n\nLet’s make a start on updating the previous demo:\n\n\
    ![../images/472539_1_En_2_Chapter/472539_1_En_2_Fig10_HTML.jpg](images/472539_1_En_2_Chapter/472539_1_En_2_Fig10_HTML.jpg)\n\
    \nFigure 2-10 – Our (updated) styled buttons\n\n1.  We’ll begin by downloading\
    \ and extracting a copy of the `import` folder and saving it to our project area.\n\
    \n2.  We need to extract the mixin from our main Sass file and move it to a new\
    \ one – for this, go ahead and create a new file called `mixins.scss`; store this\
    \ in the `scss` subfolder within the `import` folder. Leave it open for the moment,\
    \ as we will use it in the next step.\n\n3.  Go ahead and open `importfile.scss`\
    \ in your text editor, then copy lines 1 to 11 and paste them in `mixins.scss`.\
    \ Save the file, and close it.\n\n4.  Revert back to `importfile.scss`, then delete\
    \ lines 1 to 11. Add in the following line of code, as highlighted:\n\n    ```\n\
    \    @import \"mixins\";\n    @font-face {\n    font-family: 'pt_sansregular';\n\
    \    src: url('../font/pt_sansregular.woff') format('woff');\n    ```\n\n5.  Save\
    \ `importfile.scss` and close it – we can now compile the file to produce our\
    \ style sheet.\n\n6.  Next, fire up a terminal session and change the working\
    \ folder to the `import` folder under our project area. At the prompt, type the\
    \ following command and press Enter:\n\n    ```\n    sass sass\\importfile.scss\
    \ css\\importfile.css\n    ```\n\n7.  If all is well, we should see a `importfile.css`\
    \ file appear in the `css` folder (in the same way as previous exercises), along\
    \ with a source map – previewing the results will show the same set of styled\
    \ buttons from before, as indicated in Figure 2-10.\n\nThis is an easy way to\
    \ improve the management of our style sheet – the trick though is to learn how\
    \ best to manage the breakdown of files into smaller ones, so that we don’t end\
    \ up importing files unnecessarily! There are a couple of useful tips around importing\
    \ files that we should be aware of, so let’s take a look at them in more detail.\n\
    \n## Exploring How Our Code Works\n\nAlthough we’ve had to make a few changes\
    \ to our code, this relatively straightforward change can be a real life saver!\
    \ Take, for example, a standard style sheet for a CMS application such as WordPress\
    \ – its style sheet weighs into some 4,500+ lines, so the ability to break down\
    \ our styles into smaller files is a real boon.\n\nFocusing on our demo, we’ve\
    \ moved the existing `button-bg` mixin into a new file, and removed it from the\
    \ original master file. The original lines in the master file were replaced with\
    \ an appropriately named `@import` statement, which calls the file in during compilation.\
    \ Sass then merges the content into one file and produces one finished style sheet\
    \ at the end of the compilation process. If we wanted to, we can verify that the\
    \ code is indeed coming from two separate files, as indicated in Figure 2-11.\n\
    \n![../images/472539_1_En_2_Chapter/472539_1_En_2_Fig11_HTML.jpg](images/472539_1_En_2_Chapter/472539_1_En_2_Fig11_HTML.jpg)\n\
    \nFigure 2-11 – Proving our mixin file is being used ...\n\nIt does raise some\
    \ important questions though about managing imported files – the aforementioned\
    \ WordPress file isn’t one long style sheet but is made up from multiple imported\
    \ files. It means that we can use one to store variables, another to deal with\
    \ the header, a third for posts, and perhaps a fourth for responsive media queries,\
    \ and so on. The real trick is to make sure that we store the right content in\
    \ each file, so that we’re not importing files that then import others – that\
    \ can become really messy if we’re not careful!\n\nIn addition, there are some\
    \ occasions though where imported files will not be compiled as a Sass file, but\
    \ as a CSS file – they are:\n\n*   If the file’s extension is `.css`\n*   If the\
    \ filename begins with `http://`\n*   If the filename is a `url()`\n*   If the\
    \ `@import` has any media queries\n\nProvided the extension ends in `.scss` (or\
    \ `.sass`) then Sass will attempt to import the file into the master style sheet\
    \ during the compilation process.\n\n## Summary\n\nPhew – that was a bit of a\
    \ whistle-stop tour through Sass variables and mixins! We’ve covered some useful\
    \ key topics throughout this chapter, so let’s take a moment to review what we’ve\
    \ learned.\n\nWe kicked off our journey through the world of Sass with a look\
    \ first at creating variables; we covered how these can be really useful to implement,\
    \ particularly when working with values such as colors. We explored how it pays\
    \ to take care over our choice of names, so that if changes are needed, then we\
    \ can reduce the impact of those changes to our code.\n\nNext up came a quick\
    \ exploration of adding comments – we saw how these in the main are similar to\
    \ standard CSS, but that there are some differences when compiling Sass code.\n\
    \nWe then moved onto learning about mixins – we started with creating a basic\
    \ mixin, before learning how to incorporate mixins created by others, and taking\
    \ a look at ones that can produce different code based on values passed into the\
    \ mixin. We then rounded out the chapter by revisiting the subject of importing\
    \ separate files into our Sass development, so we can better manage our code during\
    \ development.\n\nWe won’t be stopping for long though – we still have plenty\
    \ to cover! We’ve created single rules, but there are often occasions where some\
    \ of the rules we create are duplicated in part (as they touch the same element,\
    \ class or selector ID). This can make developing styles repetitive – what if\
    \ we could nest our styles, or reuse existing styles more efficiently? We can\
    \ – you’ll learn all you need to get started in the next chapter."
