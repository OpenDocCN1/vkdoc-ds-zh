  trans: "\n# 谨慎对待变量命名\n\n名称，名称——我们需要的不过是用来标识某个值的符号，对吧……？\n\n嗯，既对也不对。诚然，我们给出的任何名称都应表明其关联内容，但在使用\
    \ Sass 时，需要考虑的远不止于此。让我解释一下我的意思：\n\n在我们的示例中，我们使用 `$color-XXXXX` 格式为三种颜色命名。单独看，这些名称似乎合理：存在某种命名约定，且格式保持一致。\n\
    \n但是——我敢肯定我们都知道 `dimgrey` 是什么颜色：但你能说出 `gainsboro` 是什么颜色吗？这三种颜色都是灰色的不同深浅；然而，我们有什么依据表明它们确实如此？没有——为了解决这个问题，我们可以考虑进行一些调整：\n\
    \n*   创建颜色变量时，考虑调整名称的顺序，例如用 `$grey-dim` 或 `$grey-dark` 来代替 `$color-dimgrey`。这样命名更具模块化——我们共享通用术语，并通过描述其功能，实现从通用到具体的过渡，这很像\
    \ CSS 处理特异性的方式。\n\n*   我们还可以更进一步——与其将颜色直接放入 Sass 规则中，不如根据颜色在代码中的功能来创建描述性变量。在编辑时，大多数编辑器会根据我们在变量列表中定义的内容，自动显示建议的颜色。因此，重写前面的示例，结果如下：\n\
    \n    ```\n    $grey-dim: #696969;\n    $color-title: $grey-dim;\n    section\
    \ span { color: $color-title; font-size: 20px; font-weight: bold; }\n    ```\n\
    \n*   这样做还有一个额外好处：如果我们决定更改 `$color-title` 的颜色深浅，可以一次性完成：只需修改一个条目，而无需修改代码中的多个条目。\n\
    \n变量的写法没有绝对的对错之分，尤其是涉及颜色时；不过，确保使用一致的命名约定是明智之举。像我们这样使其模块化，意味着我们甚至可以定义一个小的调色板，并使用函数创建完全不同的颜色！\n\
    \n要了解我的意思，可以查看 Jackie Balzer 在 [`http://jackiebalzer.com/color`](http://jackiebalzer.com/color)\
    \ 上的示例——所有这些颜色都仅由一种颜色 `#f8af1e`（一种深黄色）创建而成。我们将在第 4 章“使用观察结果计算值”中再次探讨这个想法。\n\n\
    然而，使用变量还有更严肃的一面——在编写本书代码时，我遇到了如图 2-4 所示的编译错误。\n\n![../images/472539_1_En_2_Chapter/472539_1_En_2_Fig4_HTML.jpg](img/472539_1_En_2_Fig4_HTML.jpg)\n\
    \n图 2-4\n\n处理编译错误\n\n乍一看有点突兀，但实际上原因很简单。\n\n在此示例中，我使用了 `--watch` 参数，以便在更改时自动编译代码。但演示中使用的颜色并不合适；我必须更改它们。我移除了\
    \ `$color-antiqueyellow` 变量，但没有更新仍引用此变量的规则。Sass 理所当然地报错了——解决方法当然是确保更新样式规则。\n\n\
    在这种情况下，如果我们使用了本节开头介绍的示例，那么只要我们不删除其他变量，就很有可能避免出现此错误！变量使代码管理变得容易得多，但在使用命名约定以及开发过程中如何更新代码方面，确实需要多加注意。\n\
    \n# 添加注释\n\n到目前为止，我们编写的 CSS 规则都非常简单——规则名称应该能合理地说明其用法。问题是，如果我们开始添加越来越多的规则，尤其是一些规则不那么直观时，会发生什么情况？\n\
    \n显然，我们需要注释——幸运的是，Sass 对注释的支持方式与我们在 CSS 中使用注释的方式大致相同。不过，有几件事需要注意：\n\n*   如果使用单行注释，编译时默认会将其移除；\n\
    *   如果使用多行注释，当输出样式设置为 compressed 时，注释会被移除，但当设置为 expanded 时，注释会保留。\n\n为了说明我的意思，让我们深入实践一下。\n\
    \n## 编译注释\n\n1.  尝试运行编译命令，但这次稍作修改：\n\n    ```\n    sass --style=compressed sass\\\
    variables.scss css\\variables.css\n    ```\n\n    如果查看编译后的文件，注意到注释是如何消失的吗？\n\n\
    2.  这次，尝试将多行注释替换为以下单行注释：\n\n    ```\n    // 这是一个测试注释\n    @font-face {\n    ```\n\
    \n3.  现在尝试编译代码——注意注释被移除了，并且如果再次使用 `style=compressed` 属性运行编译，注释仍然会被移除。\n\n1.  打开之前演示中的一个\
    \ Sass 文件——我使用的是 variables 文件夹中的文件。\n\n2.  添加以下高亮显示的代码，然后保存文件：\n\n    ```\n  \
    \  /* 这是一个测试注释\n    * 跨越几行，使用了\n    * 标准 CSS 注释\n    * 语法，并会出现在\n    * 编译后的输出中\
    \ */\n    $color-gainsboro: #c0c0c0;\n    ```\n\n3.  接下来，启动终端会话，将工作文件夹切换到项目目录下的\
    \ `variables` 文件夹。\n\n4.  在提示符下，键入以下命令并按 Enter 键：\n\n    ```\n    sass sass\\\
    variables.scss css\\variables.css\n    ```\n\n5.  如果一切顺利，我们应该会像之前一样看到 `variables.css`\
    \ 和源映射文件出现在 `css` 文件夹中——但这次如果你打开它，会看到注释出现在样式表的开头（图 2-5）。\n\n    ![../images/472539_1_En_2_Chapter/472539_1_En_2_Fig5_HTML.jpg](img/472539_1_En_2_Fig5_HTML.jpg)\n\
    \n    图 2-5\n\n    编译结果（含注释）\n\n看到管理注释有多容易了吗？添加注释是编写样式表的重要组成部分；但关键在于，我们应该谨慎选择使用哪种注释风格，以便在向源代码中添加注释和保留编译后样式表中的注释之间取得适当平衡。好了——是时候改变策略了：让我们看看\
    \ Sass 的下一个特性。有多少次你编写的代码可以直接复用，或者稍加调整就能复用？\n\n# 使用标准混合宏\n\n如果你花时间编写 CSS，我敢肯定你遇到过一些略显繁琐的场景——创建字体样式、使用\
    \ `transform` 制作动画、处理可缩放元素（如视频）、处理供应商前缀（在仍然需要的地方）等等。\n\n为了减少这种繁琐，我们可以利用 Sass 的一个强大特性：混合宏。它允许我们将\
    \ CSS 声明分组到代码块中，以便在项目中复用。我们可以使用两种类型之一——基本混合宏只是简单地嵌入到代码中，而参数化混合宏允许我们传入值，但仍使用相同的核心样式。我们稍后将介绍它们的工作原理，但首先让我们看看如何使用基本混合宏实现可复用代码。\n"
- fmt: "### Creating Reusable Code\n\nWe touched on a couple of use case scenarios\
    \ in our introduction, where mixins would be a perfect solution – one in particular\
    \ is to center responsive content on the page, no matter how it is scaled.\n\n\
    When creating responsive content, we would typically use percentage values – Chris\
    \ Coyier of [CSS-Tricks.com](http://css-tricks.com) came up with a great mixin\
    \ that allows us to center any content, leaving us free to style it as we wish.\
    \ I’ve used this as a basis for our next demo, which will center a standard `<div>`\
    \ element on screen.\n\nYou can see Chris’s original example at [`https://codepen.io/chriscoyier/pen/BvdgL`](https://codepen.io/chriscoyier/pen/BvdgL).\n\
    \n### Creating Mixins\n\nLet’s make a start on that code:\n\n![../images/472539_1_En_2_Chapter/472539_1_En_2_Fig6_HTML.jpg](images/472539_1_En_2_Chapter/472539_1_En_2_Fig6_HTML.jpg)\n\
    \nFigure 2-6: Centering a div using a mixin\n\n1.  We’ll begin by downloading\
    \ and extracting a copy of the `centerdiv` folder to our project area.\n2.  In\
    \ your usual text editor, go ahead and create a new document, then add in the\
    \ following lines of code – we’ll begin with a variable followed by our mixin:\n\
    \n    ```\n    $color-slategrey: #708090;\n    @mixin centerdiv { position: absolute;\
    \ left: 50%; top: 50%; transform: translate(-50%, -50%); }\n    ```\n\n3.  Leave\
    \ a blank line, then add in the following base styles for our demo:\n\n    ```\n\
    \    @font-face { font-family: 'pt_sansregular'; src: url('../font/pt_sansregular.woff')\
    \ format('woff'); font-weight: normal; font-style: normal; }\n    body { font-family:\
    \ 'pt_sansregular', sans-serif; background: #fff; }\n    h2 { text-align: center;\
    \ }\n    ```\n\n4.  We’ve added in our mixin, but it won’t be used unless we make\
    \ a call to it – for this, add the following style rule below the previous set\
    \ of rules:\n\n    ```\n    div {\n    @include centerdiv ;\n    width: 40%; height:\
    \ 50%; padding: 20px; background: $color-slategrey; color: antiquewhite; text-align:\
    \ center; box-shadow: 0 0 30px rgba(0, 0, 0, 0.2); border-radius: 10px; font-size:\
    \ 18px; font-weight: bold; letter-spacing: 1px;\n    }\n    ```\n\n5.  Save this\
    \ file as `centerdiv.scss` in the `scss` subfolder within the `centerdiv` folder\
    \ we saved in step 1.\n6.  Next, fire up a terminal session and change the working\
    \ folder to the `centerdiv` folder under our project area. At the prompt, enter\
    \ the following command and press Enter:\n\n    ```\n    sass sass\\centerdiv.scss\
    \ css\\centerdiv.css\n    ```\n\n7.  If all is well, we should see a `centerdiv.css`\
    \ file appear in the `css` folder, along with a source map – previewing the results\
    \ will show a simple box that remains centered on screen, as indicated in Figure\
    \ 2-6.\n\nTry resizing your browser window – notice that no matter how small or\
    \ large you make it, the div element is always centered on screen? Although we’ve\
    \ set suitable values for left and top in our code, they won’t work by themselves\
    \ – let’s quickly cover what really makes this demo come together.\n\n### Exploring\
    \ Our Code in Detail\n\nThe test of our demo lies in how our Sass code has been\
    \ compiled – we can see the first part of it in Figure 2-7.\n\n![../images/472539_1_En_2_Chapter/472539_1_En_2_Fig7_HTML.jpg](images/472539_1_En_2_Chapter/472539_1_En_2_Fig7_HTML.jpg)\n\
    \nFigure 2-7: Our mixin, compiled as CSS\n\nOur demo incorporated the contents\
    \ of the `centerdiv` mixin during compilation – mixins are written as CSS rules\
    \ but must be proceeded with the keyword `@mixin` and referenced using the keyword\
    \ `@include` with the mixin name.\n\nThe key thing to note is that mixins will\
    \ not themselves be compiled, but the rules within will be included into any ruleset\
    \ that calls the mixin. It does mean that our source file may be larger than the\
    \ compiled version, but this doesn’t matter: as long as we create suitable mixins,\
    \ they will only be included in rulesets that call them, and not be compiled themselves\
    \ in our style sheet.\n\n## Using Prebuilt Mixins\n\nArmed with our newfound knowledge\
    \ of creating mixins, we can go ahead and create new ones for use in our projects.\
    \ However, before we go and reinvent the wheel, why not take a look online?\n\n\
    A look on Google will show dozens of people who have written mixins and released\
    \ them for use; more often than not, we may find someone who has written a mixin\
    \ already that would serve our needs. Using existing mixins will save us time\
    \ and development effort – granted, we may have to tweak the code, but it will\
    \ remove the need to develop something from scratch.\n\n### Using Prebuilt Mixins\n\
    \nThere are dozens of mixins available online, either single or as part of libraries\
    \ – if you search on Google for \"sass mixin libraries,\" you will see references\
    \ to the likes of Bourbon, Scotch, and Compass, among others. Some of these have\
    \ been around for some time; with the advances of CSS, they become less and less\
    \ useful (primarily if they contain vendor-prefixed versions of code that are\
    \ no longer necessary).\n\nOne example of a mixin library is CSSgram, created\
    \ by Una Kravets – this is a take on the filters used in the popular Instagram\
    \ applet. Available from [`https://una.im/CSSgram/`](https://una.im/CSSgram/),\
    \ we’re going to make use of one of the filters to style a before and after of\
    \ a vintage image.\n\nFor this demo, we’ll be using the image of a camera from\
    \ [`https://www.pexels.com/photo/camera-photography-vintage-old-36732/`](https://www.pexels.com/photo/camera-photography-vintage-old-36732/);\
    \ please feel free to adjust if you want to use another image.\n\nLet’s start\
    \ creating our demo:\n\n![../images/472539_1_En_2_Chapter/472539_1_En_2_Fig8_HTML.jpg](images/472539_1_En_2_Chapter/472539_1_En_2_Fig8_HTML.jpg)\n\
    \nFigure 2-8: Applying a filter using a mixin library\n\n1.  We’ll begin by downloading\
    \ and extracting a copy of the `prebuilt` folder to our project area.\n2.  In\
    \ your usual text editor, go ahead and create a new document, then add in the\
    \ following lines of code – we’ll begin some base styles for our demo:\n\n   \
    \ ```\n    @import \"cssgram.scss\";\n    @font-face { font-family: 'pt_sansregular';\
    \ src: url('../font/pt_sansregular.woff') format('woff'); font-weight: normal;\
    \ font-style: normal; }\n    body { font-family: 'pt_sansregular', sans-serif;\
    \ background: #fff; }\n    h2 { text-align: center; }\n    ```\n\n3.  We now need\
    \ to add in the styles that will place the images on the page:\n\n    ```\n  \
    \  p { width: 100px; display: inline-block; margin: 0; padding: 0; }\n    section\
    \ { width: 320px; margin-left: auto; margin-right: auto; }\n    div.filter, div.nofilter\
    \ { width: 300px; display: inline-block; margin: 10px; }\n    ```\n\n4.  Last\
    \ but by no means least come the styles required to implement the filter used\
    \ in our demo:\n\n    ```\n    div.filter { @extend %stinson; }\n    div.nofilter\
    \ img { width: 100%; z-index: 1; }\n    ```\n\n5.  Save this file as `prebuilt.scss`\
    \ in the `scss` subfolder within the `prebuilt` folder we saved in step 1.\n6.\
    \  Next, fire up a terminal session and change the working folder to the `prebuilt`\
    \ folder under our project area. At the prompt enter the following command and\
    \ press Enter:\n\n    ```\n    sass sass\\prebuilt.scss css\\prebuilt.css\n  \
    \  ```\n\n7.  If all is well, we should see a `prebuilt.css` file appear in the\
    \ `css` folder, along with a source map – previewing the results will show two\
    \ images, one without a filter and one with, as indicated in Figure 2-8.\n\nAlthough\
    \ our demo is relatively straightforward to create, there is a key point that\
    \ deserves further attention. If you take a look at the CSSgram file download,\
    \ you’ll see it is huge. It is full of different filter effects – it would be\
    \ understandable if you had become concerned at just how much code we’re using!\
    \ Fortunately, we’re using a lot less than it would initially appear – let’s dive\
    \ in and take a look in more detail."
