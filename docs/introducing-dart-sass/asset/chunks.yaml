    \n*谨以此书献给我的家人，感谢他们在本书写作过程中给予的爱与支持。*\n\n## 引言\n\n《**Dart Sass 入门**》面向希望快速为网站创建有效\
    \ CSS 样式的读者。这个新版本最初于 2006 年用 Ruby 编写发布，现已从头重写，使其更快速、更易用，同时仍保留了 Sass 用户所熟悉和喜爱的所有功能。\n\
    \n在本书中，我将带领您踏上使用该库的旅程，向您展示如何以最少的麻烦快速创建可重用的样式——我们将涵盖诸如运算、字符串插值、使用函数创建和操作内容等多种主题，并通过大量简单练习帮助您掌握使用\
    \ Sass 这一工具的技能。\n\n《**Dart Sass 入门**》适合那些渴望快速学习如何利用 Sass 的强大功能生成有效样式表代码的网站开发者，尤其是那些面临快速交付压力的场景。它非常适合时间紧迫的敏捷团队成员，或希望为当前和未来项目构建可重用样式以节省开发时间和资源的开发者。\n\
    \n### 致谢\n\n写书是一个漫长但富有回报的过程；没有他人的帮助无法完成。我要向我的编辑们表示衷心的感谢——特别是 Nancy Chen 和 Louise\
    \ Corrigan；还要感谢技术审稿人 Ferit Topcu，以及 James Markham 在整个过程中给予的帮助。这四位让本书的写作过程变得轻松愉快，即使面对编辑修改也是如此。\n\
    \n我还要感谢我的家人在写作期间的理解与支持——我经常独自熬夜写作，他们的鼓励之词对于我克服写作中的障碍、完成你们手中这本成品书起到了真正的帮助。\n\n\
    ### 关于作者与关于技术审稿人\n\n### 关于作者\n\n### 关于技术审稿人\n\n# 1. 认识 Sass\n\n> *想象一下这个场景：周五夜晚，你正准备下班回家。偏偏老板走到你桌前，说最新项目的按钮样式需要做最后一刻的修改。唉——准时下班的美梦破碎了……*\n\
    \n听起来很熟悉？通常情况下，我们可能不得不花上几个小时埋头研究样式表，找出需要修改的样式及其位置，并希望查找过程中没有遗漏任何东西。这真是令人沮丧，特别是当你原本还盼着晚上出去浪的时候——但只要使用\
    \ Sass，这都不是问题！\n\n\"Sass\"这个术语已经流传了好几年，一些知名人士也倡导这项技术。不过我敢打赌，你真正想问的问题是：这些炒作到底是怎么回事？它对我的开发工作有何帮助？\n\
    \n## 什么是 Sass？\n\n为了真正理解 Sass 的本质，这两个问题问得非常好；然而，我们必须首先回答一个问题：什么是 CSS 预处理器？\n\n\
    简单来说，预处理器是一种我们可以用来扩展 CSS 的脚本语言；我们用它以一种语言编写代码，然后编译成 CSS。Sass 可以说是其中最流行的，尽管也有其他预处理器存在，例如\
    \ Less 或 Stylus。Sass 允许我们创建各种快捷方式：从简单的占位符来更新单个值的多个实例，到创建继承现有基础样式的新样式。\n\n既然我们已经了解了预处理器，那么是时候回答那两个问题了：Sass\
    \ 到底是什么？它将对我的开发工作有何帮助？\n\nSass 最早于 2006 年出现，由 Hampton Catlin 创建，全称是 Syntactically\
    \ Awesome Stylesheets（是的，名字有点长），它被标榜为 CSS 的扩展。它引入了基本脚本工具（如变量和循环）的强大功能，帮助你的代码保持更好的组织性，并比普通\
    \ CSS 更快地创建样式表。如果创建变量或循环的想法让你感到害怕，不用担心——它们实际上比这些术语所暗示的要容易使用得多！在本书中，我们将逐一介绍 Sass\
    \ 的所有核心功能；到本书结束时，你将更自如地使用 Sass，并会奇怪自己为什么没有早点改用 Sass。\n\n好了——让我们继续：既然已经正式介绍过，那么让我们来回答第二个问题：在开发样式表时，Sass\
    \ 将如何帮助我？\n"
- fmt: "# Understanding the Advantages of Using Sass\n\nWhen working with Sass over\
    \ time, it would be easy to understand why some consider it to be a real Swiss\
    \ army knife of a toolbox. Although it contains a healthy selection of tools,\
    \ its power is only really limited by one’s imagination! Taking a step back, though,\
    \ there are some key advantages to using the library, so let’s take a look at\
    \ them in detail:\n\n- Sass allows us to break large style sheet files into smaller,\
    \ more manageable files; we can work on individual files and let Sass compile\
    \ all of them into one larger file. Take a look at WordPress, for example – it’s\
    \ lengthy style sheet (which weighs in at 4,500+ lines) makes use of Sass to help\
    \ break this monster into smaller, easier-to-edit files.\n- Traditional development\
    \ might have involved us creating multiple style sheets, particularly if we’re\
    \ catering for specific browsers, such as IE9 or below. Although this principle\
    \ works, it results in increased HTTP requests, which all require resources. Sass\
    \ allows us to make use of the `@import` statement to not only break the style\
    \ sheet into smaller files, but which also helps to reduce the number of HTTP\
    \ requests made to the server.\n- One of the most important benefits of Sass,\
    \ though, is reducing repetition. Put simply, we can create styles that are extensions\
    \ of existing ones; the new ones contain the same attributes as the base style,\
    \ without us having to repeat them.\n- We can incorporate as little or as much\
    \ of Sass-style code into our style sheet as we like; Sass will ignore any standard\
    \ CSS rules, so as long as the file structure is in place, then we can update\
    \ rules in stages, and not in one large change.\n- Another benefit of using Sass\
    \ is the ability to create variables or placeholders for values. These placeholders\
    \ can be reused throughout our projects – if we need to change a value, we change\
    \ it once, and this ripples throughout the style sheet during compilation. A great\
    \ example of this comes when working with colors – if we need to change a shade\
    \ of red, for example, we can do it once; Sass updates each instance of this shade\
    \ throughout our style sheet automatically.\n\nOkay – enough chitchat: it’s time\
    \ to get stuck into the detail! We’ve explored a number of key benefits of using\
    \ Sass; these will come to life throughout the course of this book. But – as they\
    \ say – we must start somewhere, and the best place is with the different syntaxes\
    \ and implementations available when using Sass, and why it really pays to take\
    \ care when writing Sass code…\n\n## The Different Syntaxes of Sass\n\nHold on\
    \ – did you just say different … *syntaxes*? Yes, you heard correctly: Sass does\
    \ indeed have two syntaxes, but before you run to the hills, don’t fret. We’re\
    \ not going to learn both! It’s worth clarifying what is available though, so\
    \ let me explain:\n\n- The original, or indented syntax, uses something similar\
    \ to the Haml scripting language – it uses indentation to separate code blocks\
    \ and newline characters to separate rules. This uses the `.sass` file extension.\n\
    - The newer syntax, “SCSS” (or Sassy CSS), uses block formatting similar to that\
    \ of CSS; it uses braces to denote code blocks and semicolons to separate lines\
    \ within a block. This uses the `.scss` file extension.\n\nTo complicate matters\
    \ further, there are also different implementations of Sass available, including\
    \ ones written in C, PHP, and Java – it’s no wonder things might seem a little\
    \ confusing!\n\nThroughout the course of this book, we’ll use the latest version\
    \ of Sass, which has been rewritten using Dart; you may see references to Ruby\
    \ Sass, but this has been deprecated in favor of Dart Sass, and it will go out\
    \ of support. At the same time, we will use the newer syntax – its proximity to\
    \ vanilla CSS makes it much easier to learn.\n\nThe original syntax for Sass is\
    \ still available – it requires the use of indents and newline characters to format\
    \ code, which makes it harder to learn for those new to using Sass.\n\nOkay –\
    \ hopefully that has cleared up some of the confusion about the various implementations\
    \ of Sass; it’s time we moved on and got stuck into more practical matters! There\
    \ is no better place to start than to get ourselves set up with Sass; before we\
    \ do so, there is a little housekeeping task we must perform first.\n\n## Some\
    \ Project Housekeeping\n\nWhen you start on a project for the first time, there\
    \ is nearly always some form of housekeeping to be done, right?\n\nWell, we’re\
    \ not going to break with tradition here – we have one simple task to do: go ahead\
    \ and create a folder called `dart-sass`, which we will use to store the code\
    \ from each exercise throughout this book. It doesn’t matter where it is stored,\
    \ although I will assume for our purposes that it is stored at the root of your\
    \ PC or laptop; we’ll refer to it as our project folder throughout this book.\
    \ With that in place, let’s make a start on our first exercise, which is to install\
    \ and configure Sass for use.\n\n## Setting Up Sass\n\nAlthough we talk of “setting\
    \ up” Sass, there is nothing complicated to do – there are very few steps involved!\
    \ Gone are the days of having to install big dependencies such as Ruby (if you\
    \ happened to have used older versions of Sass); the Dart version of Sass is based\
    \ entirely on JavaScript so is a cinch to install.\n\nOver the course of the next\
    \ few pages, we’ll go through the process step by step – at the end of this chapter\
    \ you will have a basic system in place that can easily be extended, along with\
    \ an understanding of what is required to work with Sass.\n\n### Installing Sass\n\
    \nLet’s make a start on installing Sass:\n\n1. For now, keep the terminal node\
    \ session open – we will revert back to it very shortly in the next exercise.\n\
    1. We’re ready to test that Sass has been installed correctly – for this, fire\
    \ up a terminal session and change the working folder to the `firstcompile` folder\
    \ we created in step 1.\n2. At the prompt, enter `sass --version` and press Enter\
    \ – if all is well, we should see it return a number, indicating the version installed,\
    \ similar to that shown in Figure [1-1](#472539_1_En_1_Chapter.xhtml#Fig1).\n\n\
    \   ![../images/472539_1_En_1_Chapter/472539_1_En_1_Fig1_HTML.jpg](images/472539_1_En_1_Chapter/472539_1_En_1_Fig1_HTML.jpg)\n\
    \n   Figure 1-1\n   Checking that Sass is installed\n\n1. We’ll start by downloading\
    \ Sass from [`https://github.com/sass/dart-sass/releases/`](https://github.com/sass/dart-sass/releases/)\
    \ ; make sure you choose the appropriate version for your platform. Save the compressed\
    \ file into a new folder called `firstcompile`, at the root of our project area.\n\
    2. Next, open the compressed file, and extract the contents into the same `firstcompile`\
    \ folder.\n3. We now need to add the location to your `Path` variable for your\
    \ platform.\n\n   If you’re unsure how to do this, then take a look at the appendix\
    \ at the end of this book, which details the procedure for Mac, Windows, and Linux\
    \ platforms.\n\nThat was really easy – if you were expecting more, then I am sorry\
    \ to disappoint! There’s no need to install any dependencies (unlike in the days\
    \ of working with Ruby Sass, which required Ruby); instead, it’s just a matter\
    \ of unzipping an archive file in a folder of our choice.\n\nThis is all very\
    \ well, but as they say, the proof of the pudding is in its tasting – it’s only\
    \ good if it compiles a Sass file to valid CSS! This should be a formality though:\
    \ to prove this is indeed the case, let’s take a look at testing the compilation\
    \ process in more detail."
  raw: "## Understanding the Advantages of Using Sass\n\nWhen working with Sass over\
    \ time, it would be easy to understand why some consider it to be a real Swiss\
    \ army knife of a toolbox. Although it contains a healthy selection of tools,\
    \ its power is only really limited by one’s imagination! Taking a step back, though,\
    \ there are some key advantages to using the library, so let’s take a look at\
    \ them in detail:\n\n*   Sass allows us to break large style sheet files into\
    \ smaller, more manageable files; we can work on individual files and let Sass\
    \ compile all of them into one larger file. Take a look at WordPress, for example –\
    \ it’s lengthy style sheet (which weighs in at 4,500+ lines) makes use of Sass\
    \ to help break this monster into smaller, easier-to-edit files.\n\n*   Traditional\
    \ development might have involved us creating multiple style sheets, particularly\
    \ if we’re catering for specific browsers, such as IE9 or below. Although this\
    \ principle works, it results in increased HTTP requests, which all require resources.\
    \ Sass allows us to make use of the @import statement to not only break the style\
    \ sheet into smaller files, but which also helps to reduce the number of HTTP\
    \ requests made to the server.\n\n*   One of the most important benefits of Sass,\
    \ though, is reducing repetition. Put simply, we can create styles that are extensions\
    \ of existing ones; the new ones contain the same attributes as the base style,\
    \ without us having to repeat them.\n\n*   We can incorporate as little or as\
    \ much of Sass-style code into our style sheet as we like; Sass will ignore any\
    \ standard CSS rules, so as long as the file structure is in place, then we can\
    \ update rules in stages, and not in one large change.\n\n*   Another benefit\
    \ of using Sass is the ability to create variables or placeholders for values.\
    \ These placeholders can be reused throughout our projects – if we need to change\
    \ a value, we change it once, and this ripples throughout the style sheet during\
    \ compilation. A great example of this comes when working with colors – if we\
    \ need to change a shade of red, for example, we can do it once; Sass updates\
    \ each instance of this shade throughout our style sheet automatically.\n\nOkay –\
    \ enough chitchat: it’s time to get stuck into the detail! We’ve explored a number\
    \ of key benefits of using Sass; these will come to life throughout the course\
    \ of this book. But – as they say – we must start somewhere, and the best place\
    \ is with the different syntaxes and implementations available when using Sass,\
    \ and why it really pays to take care when writing Sass code…\n\n## The Different\
    \ Syntaxes of Sass\n\nHold on – did you just say different … *syntaxes* ? Yes,\
    \ you heard correctly: Sass does indeed have two syntaxes, but before you run\
    \ to the hills, don’t fret. We’re not going to learn both! It’s worth clarifying\
    \ what is available though, so let me explain:\n\n*   The original, or indented\
    \ syntax, uses something similar to the Haml scripting language – it uses indentation\
    \ to separate code blocks and newline characters to separate rules. This uses\
    \ the `.sass` file extension.\n\n*   The newer syntax, “SCSS” (or Sassy CSS),\
    \ uses block formatting similar to that of CSS; it uses braces to denote code\
    \ blocks and semicolons to separate lines within a block. This uses the `.scss`\
    \ file extension.\n\nTo complicate matters further, there are also different implementations\
    \ of Sass available, including ones written in C, PHP, and Java – it’s no wonder\
    \ things might seem a little confusing!\n\nThroughout the course of this book,\
    \ we’ll use the latest version of Sass, which has been rewritten using Dart; you\
    \ may see references to Ruby Sass, but this has been deprecated in favor of Dart\
    \ Sass, and it will go out of support. At the same time, we will use the newer\
    \ syntax – its proximity to vanilla CSS makes it much easier to learn.\n\nThe\
    \ original syntax for Sass is still available – it requires the use of indents\
    \ and newline characters to format code, which makes it harder to learn for those\
    \ new to using Sass.\n\nOkay – hopefully that has cleared up some of the confusion\
    \ about the various implementations of Sass; it’s time we moved on and got stuck\
    \ into more practical matters! There is no better place to start than to get ourselves\
    \ set up with Sass; before we do so, there is a little housekeeping task we must\
    \ perform first.\n\n## Some Project Housekeeping\n\nWhen you start on a project\
    \ for the first time, there is nearly always some form of housekeeping to be done,\
    \ right?\n\nWell, we’re not going to break with tradition here – we have one simple\
    \ task to do: go ahead and create a folder called `dart-sass`, which we will use\
    \ to store the code from each exercise throughout this book. It doesn’t matter\
    \ where it is stored, although I will assume for our purposes that it is stored\
    \ at the root of your PC or laptop; we’ll refer to it as our project folder throughout\
    \ this book. With that in place, let’s make a start on our first exercise, which\
    \ is to install and configure Sass for use.\n\n## Setting Up Sass\n\nAlthough\
    \ we talk of “setting up” Sass, there is nothing complicated to do – there are\
    \ very few steps involved! Gone are the days of having to install big dependencies\
    \ such as Ruby (if you happened to have used older versions of Sass); the Dart\
    \ version of Sass is based entirely on JavaScript so is a cinch to install.\n\n\
    Over the course of the next few pages, we’ll go through the process step by step –\
    \ at the end of this chapter you will have a basic system in place that can easily\
    \ be extended, along with an understanding of what is required to work with Sass.\n\
    \n### Installing Sass\n\nLet’s make a start on installing Sass:\n\n1.  For now,\
    \ keep the terminal node session open – we will revert back to it very shortly\
    \ in the next exercise.\n\n1.  We’re ready to test that Sass has been installed\
    \ correctly – for this, fire up a terminal session and change the working folder\
    \ to the `firstcompile` folder we created in step 1.\n\n2.  At the prompt, enter\
    \ `sass --version` and press Enter – if all is well, we should see it return a\
    \ number, indicating the version installed, similar to that shown in Figure [1-1](#472539_1_En_1_Chapter.xhtml#Fig1).\n\
    \n    ![../images/472539_1_En_1_Chapter/472539_1_En_1_Fig1_HTML.jpg](images/472539_1_En_1_Chapter/472539_1_En_1_Fig1_HTML.jpg)\n\
    \n    Figure 1-1\n\n    Checking that Sass is installed\n\n1.  We’ll start by\
    \ downloading Sass from [`https://github.com/sass/dart-sass/releases/`](https://github.com/sass/dart-sass/releases/)\
    \ ; make sure you choose the appropriate version for your platform. Save the compressed\
    \ file into a new folder called `firstcompile`, at the root of our project area.\n\
    \n2.  Next, open the compressed file, and extract the contents into the same `firstcompile`\
    \ folder.\n\n3.  We now need to add the location to your `Path` variable for your\
    \ platform.\n\n    If you’re unsure how to do this, then take a look at the appendix\
    \ at the end of this book, which details the procedure for Mac, Windows, and Linux\
    \ platforms.\n\nThat was really easy – if you were expecting more, then I am sorry\
    \ to disappoint! There’s no need to install any dependencies (unlike in the days\
    \ of working with Ruby Sass, which required Ruby); instead, it’s just a matter\
    \ of unzipping an archive file in a folder of our choice.\n\nThis is all very\
    \ well, but as they say, the proof of the pudding is in its tasting – it’s only\
    \ good if it compiles a Sass file to valid CSS! This should be a formality though:\
    \ to prove this is indeed the case, let’s take a look at testing the compilation\
    \ process in more detail."
  trans: "\n# 理解使用 Sass 的优势\n\n长期使用 Sass 后，你很容易理解为什么有些人将其视为工具箱中的瑞士军刀。尽管它包含了一系列实用的工具，但其真正的力量只受限于使用者的想象力！不过，退一步来看，使用这个库也有一些关键优势，让我们来详细了解一下：\n\
    \n- Sass 允许我们将庞大的样式表文件拆分为更小、更易于管理的文件；我们可以分别编辑各个文件，然后让 Sass 将它们编译成一个更大的文件。以 WordPress\
    \ 为例——它冗长的样式表（超过 4500 行）就利用了 Sass 来帮助将这个庞然大物分解成更小、更容易编辑的文件。\n- 传统开发中，我们可能需要创建多个样式表，尤其是在需要针对特定浏览器（如\
    \ IE9 或更低版本）时。虽然这种方法可行，但它会导致 HTTP 请求增加，而每个请求都需要消耗资源。Sass 允许我们使用 `@import` 语句，不仅可以将样式表拆分成更小的文件，还有助于减少对服务器的\
    \ HTTP 请求次数。\n- 不过，Sass 最重要的好处之一是减少重复。简单来说，我们可以创建现有样式的扩展；新样式包含基础样式的相同属性，而无需我们重复书写。\n\
    - 我们可以随心所欲地在样式表中加入少量或大量 Sass 风格的代码；Sass 会忽略所有标准的 CSS 规则，因此只要文件结构正确，我们就可以逐步更新规则，而无需一次性进行大规模修改。\n\
    - 使用 Sass 的另一个好处是能够为值创建变量或占位符。这些占位符可以在整个项目中重复使用——如果我们需要修改某个值，只需修改一次，编译时该修改就会自动传递到整个样式表。一个很好的例子是处理颜色时——例如，如果需要修改某种红色调，我们只需修改一次；Sass\
    \ 会自动在整个样式表中更新该色调的每个实例。\n\n好了，闲话少说：是时候深入细节了！我们已经探讨了使用 Sass 的若干关键优势；这些优势将在本书的阅读过程中逐渐显现。但正如他们所说，我们必须有个起点，最佳起点就是了解使用\
    \ Sass 时可用的不同语法和实现方式，以及为什么在编写 Sass 代码时细心处理真的很重要……\n\n## Sass 的不同语法\n\n等等——你刚才是说不同的……*语法*吗？是的，你没听错：Sass\
    \ 确实有两种语法，但在你惊慌失措之前，别担心。我们并不需要学习两种！不过，了解一下有哪些选择还是值得的，让我来解释一下：\n\n- 原始语法（缩进语法）使用类似于\
    \ Haml 脚本语言的方式——它使用缩进来分隔代码块，使用换行符来分隔规则。这种语法使用 `.sass` 文件扩展名。\n- 较新的语法“SCSS”（即\
    \ Sassy CSS）使用类似 CSS 的块格式；它使用花括号来表示代码块，使用分号来分隔块内的行。这种语法使用 `.scss` 文件扩展名。\n\n更复杂的是，Sass\
    \ 还有不同的实现版本，包括用 C、PHP 和 Java 编写的版本——难怪事情看起来有点令人困惑！\n\n在本书中，我们将使用最新版本的 Sass，它已用\
    \ Dart 重写；你可能会看到对 Ruby Sass 的引用，但它已被弃用，转而支持 Dart Sass，并且将停止支持。同时，我们将使用较新的语法——它更接近原生\
    \ CSS，因此更容易学习。\n\nSass 的原始语法仍然可用——它需要使用缩进和换行符来格式化代码，这使得初学者学习 Sass 时更加困难。\n\n好了——希望这已经澄清了关于\
    \ Sass 各种实现的一些困惑；是时候继续前进，投入到更实际的问题中了！最好的起点莫过于先安装好 Sass；不过在此之前，我们还有一项小小的整理工作要做。\n\
    \n## 一些项目整理工作\n\n当你第一次开始一个项目时，几乎总是需要做一些整理工作，对吧？\n\n好吧，我们这次也不例外——我们有一项简单的任务要做：创建一个名为\
    \ `dart-sass` 的文件夹，我们将用它来存储本书中每个练习的代码。它存储在什么地方并不重要，但为了方便，我假设它存储在 PC 或笔记本电脑的根目录下；在本书中，我们将它称为项目文件夹。完成这一步后，让我们开始第一个练习：安装和配置\
    \ Sass。\n\n## 设置 Sass\n\n虽然我们说的是“设置”Sass，但并没有什么复杂的事要做——涉及的步骤非常少！那些需要安装诸如 Ruby\
    \ 等大型依赖项的日子已经一去不复返了（如果你曾使用过旧版本 Sass 的话）；Dart 版本的 Sass 完全基于 JavaScript，因此安装起来非常简单。\n\
    \n在接下来的几页中，我们将逐步完成整个过程——在本章结束时，你将拥有一个可以轻松扩展的基本系统，并了解使用 Sass 所需的必要知识。\n\n### 安装\
    \ Sass\n\n让我们开始安装 Sass：\n\n1. 暂时保持终端节点会话打开——我们将在下一个练习中很快再次用到它。\n1. 我们准备测试 Sass\
    \ 是否正确安装——为此，打开一个终端会话，并将工作文件夹切换到我们在步骤 1 中创建的 `firstcompile` 文件夹。\n2. 在提示符下，输入\
    \ `sass --version` 并按回车键——如果一切正常，我们应该会看到一个返回的数字，指示已安装的版本，类似于图 1-1 所示。\n\n   ![../images/472539_1_En_1_Chapter/472539_1_En_1_Fig1_HTML.jpg](img/472539_1_En_1_Fig1_HTML.jpg)\n\
    \n   图 1-1\n   检查 Sass 是否已安装\n\n1. 首先，从 [`https://github.com/sass/dart-sass/releases/`](https://github.com/sass/dart-sass/releases/)\
    \ 下载 Sass；请确保为你的平台选择合适的版本。将压缩文件保存到项目区域根目录下一个名为 `firstcompile` 的新文件夹中。\n2. 接下来，打开压缩文件，并将内容解压到同一个\
    \ `firstcompile` 文件夹中。\n3. 现在，我们需要为你的平台将路径添加到 `Path` 变量中。\n\n   如果你不确定如何操作，请查看本书末尾的附录，其中详细介绍了\
    \ Mac、Windows 和 Linux 平台的操作步骤。\n\n这真的非常简单——如果你期待更复杂的内容，那么抱歉让你失望了！我们不需要安装任何依赖项（与使用\
    \ Ruby Sass 时需要安装 Ruby 的日子不同）；相反，只需将压缩文件解压到我们选择的文件夹中即可。\n\n这一切都很好，但正如他们所说，实践是检验真理的唯一标准——只有能将\
    \ Sass 文件编译成有效的 CSS 才算好用！不过这应该只是形式上的步骤：为了证明这一点，让我们更详细地测试编译过程。\n"
- fmt: "### Our First Compilation\n\nAt this stage don’t worry if the Sass code doesn’t\
    \ make sense just yet – all we’re interested in is making sure that our compilation\
    \ process produces a valid style sheet. We have a couple of steps to go through,\
    \ so let’s make a start:\n\n![../images/472539_1_En_1_Chapter/472539_1_En_1_Fig2_HTML.jpg](images/472539_1_En_1_Chapter/472539_1_En_1_Fig2_HTML.jpg)\n\
    \n**Figure 1-2** Our first compilation\n\n1.  First, go ahead and open a new document\
    \ in your usual text editor, and add the following lines. Don’t worry about them\
    \ not making sense just yet; we will go into detail at the end of the exercise:\n\
    \n    ```\n    $font-stack: Helvetica, sans-serif;\n    $primary-color: #ccc;\n\
    \    $decoration-color: #0cf;\n    body { font: 100% $font-stack; color: $primary-color;\
    \ text-decoration-color: $decoration-color}\n    ```\n\n2.  Save this as `test.scss`\
    \ at the root of our `dart-sass` folder, then go ahead and fire up a terminal\
    \ session.\n\n3.  Change the working folder to your `dart-sass` folder, then enter\
    \ this command and press Enter:\n\n    ```\n    sass test.scss output.css\n  \
    \  ```\n\n4.  At this stage, we won’t see any message appear to confirm success\
    \ – for this, we need to look in our `dart-sass` folder, where we can see two\
    \ new files have appeared, plus our `test.scss` file (Figure 1-2).\n\nSee how\
    \ easy that was? Granted, our demo did make use of a terminal session, which might\
    \ scare some; there are ways to get around this, which we will go through later\
    \ in this chapter. For now, our demo has touched on some key points we should\
    \ explore, so let’s break down our compilation process in more detail, to understand\
    \ how we arrived at our compiled style sheet.\n\n## Understanding What Happened\n\
    \nAt first glance, our demo looks simple enough (at least in terms of quantity),\
    \ even if we might not be sure about exactly what has taken place! Let me reveal\
    \ all – our demo has covered two key steps upon which we will elaborate later\
    \ in this book. For now, they can be summarized as the following:\n\n-   Compiling\
    \ code from Sass to CSS.\n-   Creating and reusing variables (or placeholders).\n\
    \nLet’s first take a look at the compilation process – at a very basic level,\
    \ we simply need to specify a source file (in this case, `test.scss`), and the\
    \ name of the output file we want to create (`output.css`). It doesn’t matter\
    \ where we run the compilation process – the key things, though, are that we clearly\
    \ specify the right file names, and that the Sass compiler will automatically\
    \ replace existing files in the destination folder.\n\nWe touched on the second\
    \ key point being the creation of variables – this might seem a little scary for\
    \ those of you not familiar with programming techniques, but trust me: they are\
    \ easier to use than it might sound! If we take a look at the contents of `test.scss`,\
    \ we will see the code listed in Figure 1-3.\n\n![../images/472539_1_En_1_Chapter/472539_1_En_1_Fig3_HTML.jpg](images/472539_1_En_1_Chapter/472539_1_En_1_Fig3_HTML.jpg)\n\
    \n**Figure 1-3** Examining our source Sass file\n\nSass will not attempt to try\
    \ to compile CSS rules already in the Sass file; these will be copied across to\
    \ the destination file untouched. It’s a useful point to bear in mind – we will\
    \ explore why, later in this book.\n\nLet’s go though it line by line:\n\n-  \
    \ We then open a rule for `body` – inside of which we specify properties for font,\
    \ font color, and text decoration. Instead of specifying fixed values, we’ve inserted\
    \ placeholders that correspond to the variables listed in lines 1 to 3 of our\
    \ code.\n-   Our first three lines specify placeholder values, or variables –\
    \ one for our font-family name, with two for colors (one as the font color, and\
    \ the second as a text-decoration color). Sass is pretty flexible when it comes\
    \ to naming conventions; you can use any name that is appropriate, as long as\
    \ it is not an existing keyword; any variable must start with a `$` symbol to\
    \ signify it as such.\n\nThink of variables as buckets or placeholders – these\
    \ tell Sass where to insert the real value during compilation. To prove this,\
    \ go ahead and open up `output.css`; inside you will see our three properties\
    \ now have human-readable values, as indicated in Figure 1-4.\n\n![../images/472539_1_En_1_Chapter/472539_1_En_1_Fig4_HTML.jpg](images/472539_1_En_1_Chapter/472539_1_En_1_Fig4_HTML.jpg)\n\
    \n**Figure 1-4** … and the output file\n\nThe compilation process performs a number\
    \ of tasks, one of which is replacing variables with proper values. Our example\
    \ only had three, but imagine if this were repeated multiple times in a lengthy\
    \ style sheet (such as WordPress)? At a stroke, we can update a single instance\
    \ of a variable and recompile our file – we eliminate any risk of missing a variable,\
    \ as Sass will update every instance it finds automatically.\n\nWe will revisit\
    \ the concept of variables in Chapter 2, \"Introducing Variables and Mixins.\"\
    \n\nOkay – let’s change tack: our process works, but it will get a little tedious\
    \ if we have to continue compiling code by hand all of the time. In addition,\
    \ we can definitely improve on our folder structure; it’s time we took a look\
    \ at how we might set up a suitable workflow to help with the compilation process.\n\
    \n## Setting Up a Workflow\n\nWhen working with Sass, it pays to be organized\
    \ – we might get away with what we’ve set up thus far if we’re only going to work\
    \ on a couple of files. If, however, we need to work on anything more substantial,\
    \ then this clearly won’t work: it’s time we got ourselves organized.\n\nI’m a\
    \ great believer in keeping things simple – after all, there is no benefit in\
    \ making something more complicated than it needs to be! There are a few changes\
    \ we can make that will certainly help us, so let’s take a look:\n\n-   Setting\
    \ up a suitable folder structure to store our assets.\n-   Enabling CSS source\
    \ map support.\n-   Automating the compilation process.\n-   Adjusting the output\
    \ format of our code.\n-   Making sure we have a good text editor available.\n\
    \nWe will add to this over the course of this book, by exploring ways of producing\
    \ reusable code, or extra tips to help with the development process. The important\
    \ thing to understand though is that although we may not need anything complicated\
    \ to get started, it is important to get them configured correctly; let’s dive\
    \ in and explore this in more detail.\n\n### Setting Up a Folder Structure\n\n\
    I would absolutely recommend creating a folder structure to store your assets;\
    \ as a starting point, I would suggest one folder for Sass source files and another\
    \ for the compiled CSS style sheet files. One of the key benefits of Sass is the\
    \ ability to break a larger style sheet into smaller files; over time we could\
    \ build up a folder structure similar to that shown in Figure 1-5.\n\n![../images/472539_1_En_1_Chapter/472539_1_En_1_Fig5_HTML.jpg](images/472539_1_En_1_Chapter/472539_1_En_1_Fig5_HTML.jpg)\n\
    \n**Figure 1-5** A typical folder structure for Sass development\n\nOf course,\
    \ this takes time to develop, so if we start with a simple folder for source files\
    \ (in this example, `sass`), and a separate one (such as `stylesheets` from our\
    \ example), then this will put us in good stead for developing Sass code."
  raw: "### Our First Compilation\n\nAt this stage don’t worry if the Sass code doesn’t\
    \ make sense just yet – all we’re interested in is making sure that our compilation\
    \ process produces a valid style sheet. We have a couple of steps to go through,\
    \ so let’s make a start:\n\n![../images/472539_1_En_1_Chapter/472539_1_En_1_Fig2_HTML.jpg](images/472539_1_En_1_Chapter/472539_1_En_1_Fig2_HTML.jpg)\n\
    \nFigure 1-2\n\nOur first compilation\n\n1.  First, go ahead and open a new document\
    \ in your usual text editor, and add the following lines. Don’t worry about them\
    \ not making sense just yet; we will go into detail at the end of the exercise:\n\
    \n    ```\n    $font-stack: Helvetica, sans-serif;\n    $primary-color: #ccc;\n\
    \    $decoration-color: #0cf;\n    body { font: 100% $font-stack; color: $primary-color;\
    \ text-decoration-color: $decoration-color}\n    ```\n\n2.  Save this as `test.scss`\
    \ at the root of our `dart-sass` folder, then go ahead and fire up a terminal\
    \ session.\n\n3.  Change the working folder to your `dart-sass` folder, then enter\
    \ this command and press Enter:\n\n    ```\n    sass test.scss output.css\n  \
    \  ```\n\n4.  At this stage, we won’t see any message appear to confirm success –\
    \ for this, we need to look in our `dart-sass` folder, where we can see two new\
    \ files have appeared, plus our `test.scss` file (Figure [1-2](#472539_1_En_1_Chapter.xhtml#Fig2)).\n\
    \nSee how easy that was? Granted, our demo did make use of a terminal session,\
    \ which might scare some; there are ways to get around this, which we will go\
    \ through later in this chapter. For now, our demo has touched on some key points\
    \ we should explore, so let’s break down our compilation process in more detail,\
    \ to understand how we arrived at our compiled style sheet.\n\n## Understanding\
    \ What Happened\n\nAt first glance, our demo looks simple enough (at least in\
    \ terms of quantity), even if we might not be sure about exactly what has taken\
    \ place! Let me reveal all – our demo has covered two key steps upon which we\
    \ will elaborate later in this book. For now, they can be summarized as the following:\n\
    \n*   Compiling code from Sass to CSS,\n\n*   Creating and reusing variables (or\
    \ placeholders).\n\nLet’s first take a look at the compilation process – at a\
    \ very basic level, we simply need to specify a source file (in this case, `test.scss`),\
    \ and the name of the output file we want to create (`output.css`). It doesn’t\
    \ matter where we run the compilation process – the key things, though, are that\
    \ we clearly specify the right file names, and that the Sass compiler will automatically\
    \ replace existing files in the destination folder.\n\nWe touched on the second\
    \ key point being the creation of variables – this might seem a little scary for\
    \ those of you not familiar with programming techniques, but trust me: they are\
    \ easier to use than it might sound! If we take a look at the contents of `test.scss`,\
    \ we will see the code listed in Figure [1-3](#472539_1_En_1_Chapter.xhtml#Fig3).\n\
    \n![../images/472539_1_En_1_Chapter/472539_1_En_1_Fig3_HTML.jpg](images/472539_1_En_1_Chapter/472539_1_En_1_Fig3_HTML.jpg)\n\
    \nFigure 1-3\n\nExamining our source Sass file …\n\nSass will not attempt to try\
    \ to compile CSS rules already in the Sass file; these will be copied across to\
    \ the destination file untouched. It’s a useful point to bear in mind – we will\
    \ explore why, later in this book.\n\nLet’s go though it line by line –\n\n* \
    \  We then open a rule for `body` – inside of which we specify properties for\
    \ font, font color, and text decoration. Instead of specifying fixed values, we’ve\
    \ inserted placeholders that correspond to the variables listed in lines 1 to\
    \ 3 of our code.\n\n*   Our first three lines specify placeholder values, or **variables** –\
    \ one for our font-family name, with two for colors (one as the font color, and\
    \ the second as a text-decoration color). Sass is pretty flexible when it comes\
    \ to naming conventions; you can use any name that is appropriate, as long as\
    \ it is not an existing keyword; any variable must start with a $ symbol to signify\
    \ it as such.\n\nThink of variables as buckets or placeholders – these tell Sass\
    \ where to insert the real value during compilation. To prove this, go ahead and\
    \ open up `output.css`; inside you will see our three properties now have human-readable\
    \ values, as indicated in Figure [1-4](#472539_1_En_1_Chapter.xhtml#Fig4).\n\n\
    ![../images/472539_1_En_1_Chapter/472539_1_En_1_Fig4_HTML.jpg](images/472539_1_En_1_Chapter/472539_1_En_1_Fig4_HTML.jpg)\n\
    \nFigure 1-4\n\n... and the output file\n\nThe compilation process performs a\
    \ number of tasks, one of which is replacing variables with proper values. Our\
    \ example only had three, but imagine if this were repeated multiple times in\
    \ a lengthy style sheet (such as WordPress)? At a stroke, we can update a single\
    \ instance of a variable and recompile our file – we eliminate any risk of missing\
    \ a variable, as Sass will update every instance it finds automatically.\n\nWe\
    \ will revisit the concept of variables in Chapter [2](#472539_1_En_2_Chapter.xhtml),\
    \ “Introducing Variables and Mixins.”\n\nOkay – let’s change tack: our process\
    \ works, but it will get a little tedious if we have to continue compiling code\
    \ by hand all of the time. In addition, we can definitely improve on our folder\
    \ structure; it’s time we took a look at how we might set up a suitable workflow\
    \ to help with the compilation process.\n\n## Setting Up a Workflow\n\nWhen working\
    \ with Sass, it pays to be organized – we might get away with what we’ve set up\
    \ thus far if we’re only going to work on a couple of files. If, however, we need\
    \ to work on anything more substantial, then this clearly won’t work: it’s time\
    \ we got ourselves organized.\n\nI’m a great believer in keeping things simple –\
    \ after all, there is no benefit in making something more complicated than it\
    \ needs to be! There are a few changes we can make that will certainly help us,\
    \ so let’s take a look:\n\n*   Setting up a suitable folder structure to store\
    \ our assets,\n\n*   Enabling CSS source map support,\n\n*   Automating the compilation\
    \ process,\n\n*   Adjusting the output format of our code,\n\n*   Making sure\
    \ we have a good text editor available.\n\nWe will add to this over the course\
    \ of this book, by exploring ways of producing reusable code, or extra tips to\
    \ help with the development process. The important thing to understand though\
    \ is that although we may not need anything complicated to get started, it is\
    \ important to get them configured correctly; let’s dive in and explore this in\
    \ more detail.\n\n### Setting Up a Folder Structure\n\nI would absolutely recommend\
    \ creating a folder structure to store your assets; as a starting point, I would\
    \ suggest one folder for Sass source files and another for the compiled CSS style\
    \ sheet files. One of the key benefits of Sass is the ability to break a larger\
    \ style sheet into smaller files; over time we could build up a folder structure\
    \ similar to that shown in Figure [1-5](#472539_1_En_1_Chapter.xhtml#Fig5).\n\n\
    ![../images/472539_1_En_1_Chapter/472539_1_En_1_Fig5_HTML.jpg](images/472539_1_En_1_Chapter/472539_1_En_1_Fig5_HTML.jpg)\n\
    \nFigure 1-5\n\nA typical folder structure for Sass development\n\nOf course,\
    \ this takes time to develop, so if we start with a simple folder for source files\
    \ (in this example, sass), and a separate one (such as stylesheets from our example),\
    \ then this will put us in good stead for developing Sass code."
  trans: "\n### 首次编译\n\n在这个阶段，即使 Sass 代码看起来不易理解也不必担心——我们当前的目标只是确保编译过程能生成一个有效的样式表。我们需要完成几个步骤，现在就开始吧：\n\
    \n![../images/472539_1_En_1_Chapter/472539_1_En_1_Fig2_HTML.jpg](img/472539_1_En_1_Fig2_HTML.jpg)\n\
    \n**图 1-2** 首次编译\n\n1.  首先，在常用文本编辑器中打开一个新文档，并添加以下几行。暂时不必理解它们的具体含义，我们将在练习末尾详细解释：\n\
    \n    ```\n    $font-stack: Helvetica, sans-serif;\n    $primary-color: #ccc;\n\
    \    $decoration-color: #0cf;\n    body { font: 100% $font-stack; color: $primary-color;\
    \ text-decoration-color: $decoration-color}\n    ```\n\n2.  将此文件以 `test.scss`\
    \ 名称保存到 `dart-sass` 文件夹的根目录下，然后启动一个终端会话。\n3.  将工作目录切换到 `dart-sass` 文件夹，输入以下命令并按下回车键：\n\
    \n    ```\n    sass test.scss output.css\n    ```\n\n4.  此时，我们不会看到任何确认成功的提示信息——要查看结果，需要回到\
    \ `dart-sass` 文件夹中，此时会发现除了 `test.scss` 文件之外，还新增了两个文件（如图 1-2 所示）。\n\n您看，是不是很简单？诚然，我们的演示使用了终端会话，这可能会让一些人感到畏惧；不过有办法可以绕过这一环节，我们将在本章后面部分介绍。现在，我们的演示已经触及了一些需要探索的关键点，下面让我们更详细地剖析编译过程，了解最终样式表是如何生成的。\n\
    \n## 理解发生了什么\n\n乍一看，这个演示似乎很简单（至少从代码量上看如此），尽管我们可能还不清楚具体发生了什么！让我来揭示一切——我们的演示涵盖了将在本书后面详细阐述的两个关键步骤。现阶段，可以将其概括如下：\n\
    \n-   将 Sass 代码编译为 CSS 代码。\n-   创建并复用变量（或称占位符）。\n\n先来看看编译过程——在最基本的层面上，我们只需要指定源文件（此处为\
    \ `test.scss`）和想要创建的输出文件名（`output.css`）。在哪里执行编译过程并不重要，关键在于务必正确指定文件名，并且 Sass 编译器会自动覆盖目标文件夹中的现有文件。\n\
    \n我们提到的第二个关键点是变量的创建——对于不熟悉编程技术的读者来说，这可能有些吓人，但请相信我：它们用起来比听起来要简单！如果查看 `test.scss`\
    \ 的内容，会看到图 1-3 中列出的代码。\n\n![../images/472539_1_En_1_Chapter/472539_1_En_1_Fig3_HTML.jpg](img/472539_1_En_1_Fig3_HTML.jpg)\n\
    \n**图 1-3** 检查我们的 Sass 源文件\n\nSass 不会尝试编译 Sass 文件中已有的 CSS 规则；这些规则原封不动地会被复制到目标文件中。这是一个值得记住的要点——我们将在本书后面探讨其原因。\n\
    \n让我们逐行分析：\n\n-   随后，我们为 `body` 开启了一条规则——在其中指定了字体、字体颜色和文本装饰的属性。我们没有使用固定值，而是插入了与代码第\
    \ 1 到第 3 行列出的变量相对应的占位符。\n-   前三行指定了占位值，即变量——一个用于字体族名称，两个用于颜色（一个作为字体颜色，另一个作为文本装饰颜色）。Sass\
    \ 在命名约定方面相当灵活；只要不占用现有的关键字，可以使用任何合适的名称；但任何变量都必须以 `$` 符号开头，以此表明它是变量。\n\n可以将变量视为桶或占位符——它们告诉\
    \ Sass 在编译时在哪里插入实际值。为了验证这一点，请打开 `output.css` 文件；您会看到三个属性现在都有了易于理解的值，如图 1-4 所示。\n\
    \n![../images/472539_1_En_1_Chapter/472539_1_En_1_Fig4_HTML.jpg](img/472539_1_En_1_Fig4_HTML.jpg)\n\
    \n**图 1-4** ……以及输出文件\n\n编译过程会执行多项任务，其中之一就是用实际值替换变量。我们的示例只有三个变量，但想象一下，如果在一个很长的样式表（例如\
    \ WordPress 的样式表）中多次重复使用变量会怎样？只需一次性更新一个变量的实例并重新编译文件——就能消除遗漏变量的风险，因为 Sass 会自动更新它找到的每一个实例。\n\
    \n我们将在第 2 章“变量与混入入门”中重新讨论变量的概念。\n\n好了——让我们换个话题：我们的流程虽然可行，但如果总是需要手动编译代码，会变得有些乏味。此外，我们的文件夹结构也肯定可以改进；是时候考虑如何建立一个合适的工作流程来辅助编译过程了。\n\
    \n## 设置工作流程\n\n在使用 Sass 时，有条理地进行组织会大有裨益——如果只处理几个文件，我们目前这样的设置或许还能应付。但如果需要处理更庞大的项目，这种方式显然就行不通了：是时候让自己井井有条了。\n\
    \n我坚信保持简单——毕竟，把本不需要复杂的事情变得复杂毫无益处！我们可以做一些改进，这对我们肯定有帮助，让我们来看看：\n\n-   建立合适的文件夹结构来存放资源文件。\n\
    -   启用 CSS 源映射支持。\n-   自动化编译过程。\n-   调整代码的输出格式。\n-   确保拥有一个得心应手的文本编辑器。\n\n在本书后续内容中，我们还将探索如何生成可复用的代码，或提供一些有助于开发流程的额外技巧。不过，需要理解的关键一点是，虽然刚开始我们可能不需要什么复杂的东西，但正确配置它们至关重要；让我们深入探讨，详细了解这些内容。\n\
    \n### 设置文件夹结构\n\n我强烈建议创建一个文件夹结构来存放你的资源文件；作为起点，我建议创建一个 Sass 源文件文件夹和一个已编译的 CSS 样式表文件夹。Sass\
    \ 的主要优势之一就是能够将较大的样式表拆分成更小的文件；随着时间的推移，我们可以建立一个类似于图 1-5 所示的文件夹结构。\n\n![../images/472539_1_En_1_Chapter/472539_1_En_1_Fig5_HTML.jpg](img/472539_1_En_1_Fig5_HTML.jpg)\n\
    \n**图 1-5** Sass 开发的典型文件夹结构\n\n当然，这需要时间来逐步形成，所以如果我们从一个简单的源文件文件夹（本例中为 `sass`）和一个单独的目标文件夹（比如本例中的\
    \ `stylesheets`）开始，这将为我们后续开发 Sass 代码打下良好基础。\n"
- fmt: '### Enabling Source Map Support


    Take another look at the bottom of our compiled `test.css` file – did you notice
    the presence of this line?


    ```

    /*# sourceMappingURL=maps/test.css.map */

    ```


    This is a link to a CSS source map – this is an indispensable tool when it comes
    to working with Sass. Put simply, it translates each compiled rule in our style
    sheet back to the original Sass code; we can use it to identify exactly where
    an issue might be in our code.


    Source maps are automatically produced when compiling via the command line (or
    terminal session). To use them, we have to enable browser support – let’s run
    through how, using Chrome as our example browser:


    ![../images/472539_1_En_1_Chapter/472539_1_En_1_Fig6_HTML.jpg](images/472539_1_En_1_Chapter/472539_1_En_1_Fig6_HTML.jpg)


    *Figure 1-6 Enabling CSS source maps option*


    - Fire up the browser and then press `Ctrl + Shift + I` (or `Command + Apple +
    I` for Macs), to bring up the Developer Console.

    - Click on the three dots to the top right of Console, then hit Settings.

    - Look for the Enable CSS source maps entry, under Sources (Figure [1-6](#472539_1_En_1_Chapter.xhtml#Fig6)).


    If you take a look at Figure [1-2](#472539_1_En_1_Chapter.xhtml#Fig2) again, you’ll
    see the presence of a `output.css.map` file – this was created automatically when
    we compiled our first file on the command line. Opening the file in a text editor,
    we will see something akin to this:


    ```

    {"version":3,"sourceRoot":"","sources":["../sass/test.scss"],"names":[],"mappings":"AAIA;EACE;EACA,OALc;EAMd,uBALiB","file":"output.css"}

    ```


    It probably looks like meaningless code, but it contains mappings from the compiled
    CSS file (`output.css`), which point to the relevant code within our original
    source file, `test.scss`. Suffice to say that we don’t need to worry about what
    is produced inside this file – the compilation process takes care of this for
    us. As long as one is present, and support is enabled in our browser, we will
    be able to relate compiled code back to its original source.


    ### Automating the Compilation Process


    In the *Our first compilation* demo, we used this line to compile our code:


    ```

    sass test.scss output.css

    ```


    It’s a simple command – it does the job with no frills, assuming of course we’ve
    written valid Sass code! However, running this each time will quickly get tedious;
    we can absolutely improve on this, by use of the `--watch` parameter.


    This requires a simple change to our command – it’s almost worth getting into
    the habit of including it when running a compile from a terminal session! Instead
    of the command we used, we can use this:


    ```

    sass --watch test.scss output.css

    ```


    This will watch for changes and recompile our source file automatically – there
    is something we need to look out for though, but I will cover this in Chapter
    [2](#472539_1_En_2_Chapter.xhtml).


    ### Adjusting the Output Format


    If you take a look at a compiled CSS file, you may notice that Sass has produced
    something that is easy to read but takes a lot of space. This clearly isn’t ideal
    for use in production sites – we want our files to be as small as possible! Fortunately
    there’s an easy change we can make to our compilation process – remember our first
    compile command, which looked like this?


    ```

    sass test.scss output.css

    ```


    If we add in the command highlighted in bold:


    ```

    sass test.scss output.css --style=compressed

    ```


    ... this will compress our compiled style sheet, which will be ideal for use on
    production sites.


    By default, if you omit this command, Sass will produce code in expanded format
    – if you prefer to specify this explicitly, then use `--style=expanded` instead.


    ### Editing Sass Code


    Now – this might seem like an odd point to pick up on, but you’ll understand why
    in a moment: although there is a good selection of tools that we can use to edit
    Sass code, we don’t necessarily need them! Let me explain what I mean:


    At a basic level, Sass is nothing more than an extension of CSS – it means that
    pretty much any text editor can be used to edit Sass code. I suspect many of you
    will already have a favorite editor that will work fine with Sass. I personally
    use Sublime Text 3, which is a commercial offering, but the 80USD price tag is
    definitely worth the price!


    For the purposes of this book, I will assume you already have a suitable editor
    that already works well for you. If not, then it helps to have one that has syntax
    support for Sass and can open and format multiple files (not really a problem,
    as most do anyway). If you don’t already have something, then one of these might
    be a good place to start:


    - Atom (cross platform) – available from [`https://atom.io/`](https://atom.io/)

    - TextMate (Mac OS only) – [`https://macromates.com`](https://macromates.com)

    - Sublime Text (cross platform, commercial) – downloadable from [`https://www.sublimetext.com`](https://www.sublimetext.com)

    - Visual Code (cross platform, free) – available from [`https://code.visualstudio.com/`](https://code.visualstudio.com/)


    However, there is another option that will really turn things on their head: if
    you want to use a dedicated stand-alone tool for compiling Sass, then there is
    also a mix of open source and commercial offerings available. Some will work across
    multiple platforms, while others target specific platforms only. Let’s take a
    look at some of the options open to us:


    - CodeKit – this commercial offering is available from [`https://codekitapp.com/`](https://codekitapp.com/)
    but is for Mac only

    - GhostLab – available as a commercial application for Mac or Windows, from [`http://www.vanamco.com/ghostlab/`](http://www.vanamco.com/ghostlab/)

    - Hammer – a Mac-only commercial editor, available from [`https://hammerformac.com/`](https://hammerformac.com/)

    - Koala – downloadable from [`http://koala-app.com/`](http://koala-app.com/) ,
    Koala is a cross-platform, open source editor, although it has not seen any updates
    since late 2017

    - Prepos – this shareware editor is available from [`https://prepros.io/`](https://prepros.io/)
    with versions available for Mac, Windows, and Linux

    - Scout-App – an open source editor available for Mac, Windows, and Linux, downloadable
    from [`http://scout-app.io/`](http://scout-app.io/)


    *Note: “All” in the above list refers to Mac, Windows, and Linux support.*


    Oh – and guess what? There’s yet another route to compiling Sass that we can choose!
    If your preference is to not install yet another tool into your development workflow,
    then you can always choose to compile your code online.


    There are several options available for this, but one that is recommended is SassMeister,
    hosted at [`https://www.sassmeister.com`](https://www.sassmeister.com) . This
    gives you all of the benefit of compiling Sass in exactly the same way as if we
    were doing so offline; it’s probably less suited to compiling lengthy, complex
    blocks of code, but ideal if you want to try ideas out before committing changes
    to your source code.'
