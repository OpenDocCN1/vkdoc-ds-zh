- "# 1. 认识 Sass\n\n> *想象一下这个场景：周五夜晚，你正准备下班回家。偏偏老板走到你桌前，说最新项目的按钮样式需要做最后一刻的修改。唉——准时下班的美梦破碎了……*\n\
  \n听起来很熟悉？通常情况下，我们可能不得不花上几个小时埋头研究样式表，找出需要修改的样式及其位置，并希望查找过程中没有遗漏任何东西。这真是令人沮丧，特别是当你原本还盼着晚上出去浪的时候——但只要使用\
  \ Sass，这都不是问题！\n\n\"Sass\"这个术语已经流传了好几年，一些知名人士也倡导这项技术。不过我敢打赌，你真正想问的问题是：这些炒作到底是怎么回事？它对我的开发工作有何帮助？\n\
  \n## 什么是 Sass？\n\n为了真正理解 Sass 的本质，这两个问题问得非常好；然而，我们必须首先回答一个问题：什么是 CSS 预处理器？\n\n简单来说，预处理器是一种我们可以用来扩展\
  \ CSS 的脚本语言；我们用它以一种语言编写代码，然后编译成 CSS。Sass 可以说是其中最流行的，尽管也有其他预处理器存在，例如 Less 或 Stylus。Sass\
  \ 允许我们创建各种快捷方式：从简单的占位符来更新单个值的多个实例，到创建继承现有基础样式的新样式。\n\n既然我们已经了解了预处理器，那么是时候回答那两个问题了：Sass\
  \ 到底是什么？它将对我的开发工作有何帮助？\n\nSass 最早于 2006 年出现，由 Hampton Catlin 创建，全称是 Syntactically\
  \ Awesome Stylesheets（是的，名字有点长），它被标榜为 CSS 的扩展。它引入了基本脚本工具（如变量和循环）的强大功能，帮助你的代码保持更好的组织性，并比普通\
  \ CSS 更快地创建样式表。如果创建变量或循环的想法让你感到害怕，不用担心——它们实际上比这些术语所暗示的要容易使用得多！在本书中，我们将逐一介绍 Sass\
  \ 的所有核心功能；到本书结束时，你将更自如地使用 Sass，并会奇怪自己为什么没有早点改用 Sass。\n\n好了——让我们继续：既然已经正式介绍过，那么让我们来回答第二个问题：在开发样式表时，Sass\
  \ 将如何帮助我？\n\n\n\n### 理解使用 Sass 的优势\n\n长期使用 Sass 后，你很容易理解为什么有些人将其视为工具箱中的瑞士军刀。尽管它包含了一系列实用的工具，但其真正的力量只受限于使用者的想象力！不过，退一步来看，使用这个库也有一些关键优势，让我们来详细了解一下：\n\
  \n- Sass 允许我们将庞大的样式表文件拆分为更小、更易于管理的文件；我们可以分别编辑各个文件，然后让 Sass 将它们编译成一个更大的文件。以 WordPress\
  \ 为例——它冗长的样式表（超过 4500 行）就利用了 Sass 来帮助将这个庞然大物分解成更小、更容易编辑的文件。\n- 传统开发中，我们可能需要创建多个样式表，尤其是在需要针对特定浏览器（如\
  \ IE9 或更低版本）时。虽然这种方法可行，但它会导致 HTTP 请求增加，而每个请求都需要消耗资源。Sass 允许我们使用 `@import` 语句，不仅可以将样式表拆分成更小的文件，还有助于减少对服务器的\
  \ HTTP 请求次数。\n- 不过，Sass 最重要的好处之一是减少重复。简单来说，我们可以创建现有样式的扩展；新样式包含基础样式的相同属性，而无需我们重复书写。\n\
  - 我们可以随心所欲地在样式表中加入少量或大量 Sass 风格的代码；Sass 会忽略所有标准的 CSS 规则，因此只要文件结构正确，我们就可以逐步更新规则，而无需一次性进行大规模修改。\n\
  - 使用 Sass 的另一个好处是能够为值创建变量或占位符。这些占位符可以在整个项目中重复使用——如果我们需要修改某个值，只需修改一次，编译时该修改就会自动传递到整个样式表。一个很好的例子是处理颜色时——例如，如果需要修改某种红色调，我们只需修改一次；Sass\
  \ 会自动在整个样式表中更新该色调的每个实例。\n\n好了，闲话少说：是时候深入细节了！我们已经探讨了使用 Sass 的若干关键优势；这些优势将在本书的阅读过程中逐渐显现。但正如他们所说，我们必须有个起点，最佳起点就是了解使用\
  \ Sass 时可用的不同语法和实现方式，以及为什么在编写 Sass 代码时细心处理真的很重要……\n\n## Sass 的不同语法\n\n等等——你刚才是说不同的……*语法*吗？是的，你没听错：Sass\
  \ 确实有两种语法，但在你惊慌失措之前，别担心。我们并不需要学习两种！不过，了解一下有哪些选择还是值得的，让我来解释一下：\n\n- 原始语法（缩进语法）使用类似于\
  \ Haml 脚本语言的方式——它使用缩进来分隔代码块，使用换行符来分隔规则。这种语法使用 `.sass` 文件扩展名。\n- 较新的语法“SCSS”（即 Sassy\
  \ CSS）使用类似 CSS 的块格式；它使用花括号来表示代码块，使用分号来分隔块内的行。这种语法使用 `.scss` 文件扩展名。\n\n更复杂的是，Sass\
  \ 还有不同的实现版本，包括用 C、PHP 和 Java 编写的版本——难怪事情看起来有点令人困惑！\n\n在本书中，我们将使用最新版本的 Sass，它已用 Dart\
  \ 重写；你可能会看到对 Ruby Sass 的引用，但它已被弃用，转而支持 Dart Sass，并且将停止支持。同时，我们将使用较新的语法——它更接近原生 CSS，因此更容易学习。\n\
  \nSass 的原始语法仍然可用——它需要使用缩进和换行符来格式化代码，这使得初学者学习 Sass 时更加困难。\n\n好了——希望这已经澄清了关于 Sass\
  \ 各种实现的一些困惑；是时候继续前进，投入到更实际的问题中了！最好的起点莫过于先安装好 Sass；不过在此之前，我们还有一项小小的整理工作要做。\n\n##\
  \ 一些项目整理工作\n\n当你第一次开始一个项目时，几乎总是需要做一些整理工作，对吧？\n\n好吧，我们这次也不例外——我们有一项简单的任务要做：创建一个名为\
  \ `dart-sass` 的文件夹，我们将用它来存储本书中每个练习的代码。它存储在什么地方并不重要，但为了方便，我假设它存储在 PC 或笔记本电脑的根目录下；在本书中，我们将它称为项目文件夹。完成这一步后，让我们开始第一个练习：安装和配置\
  \ Sass。\n\n## 设置 Sass\n\n虽然我们说的是“设置”Sass，但并没有什么复杂的事要做——涉及的步骤非常少！那些需要安装诸如 Ruby 等大型依赖项的日子已经一去不复返了（如果你曾使用过旧版本\
  \ Sass 的话）；Dart 版本的 Sass 完全基于 JavaScript，因此安装起来非常简单。\n\n在接下来的几页中，我们将逐步完成整个过程——在本章结束时，你将拥有一个可以轻松扩展的基本系统，并了解使用\
  \ Sass 所需的必要知识。\n\n### 安装 Sass\n\n让我们开始安装 Sass：\n\n1. 暂时保持终端节点会话打开——我们将在下一个练习中很快再次用到它。\n\
  1. 我们准备测试 Sass 是否正确安装——为此，打开一个终端会话，并将工作文件夹切换到我们在步骤 1 中创建的 `firstcompile` 文件夹。\n\
  2. 在提示符下，输入 `sass --version` 并按回车键——如果一切正常，我们应该会看到一个返回的数字，指示已安装的版本，类似于图 1-1 所示。\n\
  \n   ![../images/472539_1_En_1_Chapter/472539_1_En_1_Fig1_HTML.jpg](img/472539_1_En_1_Fig1_HTML.jpg)\n\
  \n   图 1-1\n   检查 Sass 是否已安装\n\n1. 首先，从 [`https://github.com/sass/dart-sass/releases/`](https://github.com/sass/dart-sass/releases/)\
  \ 下载 Sass；请确保为你的平台选择合适的版本。将压缩文件保存到项目区域根目录下一个名为 `firstcompile` 的新文件夹中。\n2. 接下来，打开压缩文件，并将内容解压到同一个\
  \ `firstcompile` 文件夹中。\n3. 现在，我们需要为你的平台将路径添加到 `Path` 变量中。\n\n   如果你不确定如何操作，请查看本书末尾的附录，其中详细介绍了\
  \ Mac、Windows 和 Linux 平台的操作步骤。\n\n这真的非常简单——如果你期待更复杂的内容，那么抱歉让你失望了！我们不需要安装任何依赖项（与使用\
  \ Ruby Sass 时需要安装 Ruby 的日子不同）；相反，只需将压缩文件解压到我们选择的文件夹中即可。\n\n这一切都很好，但正如他们所说，实践是检验真理的唯一标准——只有能将\
  \ Sass 文件编译成有效的 CSS 才算好用！不过这应该只是形式上的步骤：为了证明这一点，让我们更详细地测试编译过程。\n\n\n\n### 首次编译\n\n\
  在这个阶段，即使 Sass 代码看起来不易理解也不必担心——我们当前的目标只是确保编译过程能生成一个有效的样式表。我们需要完成几个步骤，现在就开始吧：\n\n\
  ![../images/472539_1_En_1_Chapter/472539_1_En_1_Fig2_HTML.jpg](img/472539_1_En_1_Fig2_HTML.jpg)\n\
  \n**图 1-2** 首次编译\n\n1.  首先，在常用文本编辑器中打开一个新文档，并添加以下几行。暂时不必理解它们的具体含义，我们将在练习末尾详细解释：\n\
  \n    ```\n    $font-stack: Helvetica, sans-serif;\n    $primary-color: #ccc;\n\
  \    $decoration-color: #0cf;\n    body { font: 100% $font-stack; color: $primary-color;\
  \ text-decoration-color: $decoration-color}\n    ```\n\n2.  将此文件以 `test.scss` 名称保存到\
  \ `dart-sass` 文件夹的根目录下，然后启动一个终端会话。\n3.  将工作目录切换到 `dart-sass` 文件夹，输入以下命令并按下回车键：\n\
  \n    ```\n    sass test.scss output.css\n    ```\n\n4.  此时，我们不会看到任何确认成功的提示信息——要查看结果，需要回到\
  \ `dart-sass` 文件夹中，此时会发现除了 `test.scss` 文件之外，还新增了两个文件（如图 1-2 所示）。\n\n您看，是不是很简单？诚然，我们的演示使用了终端会话，这可能会让一些人感到畏惧；不过有办法可以绕过这一环节，我们将在本章后面部分介绍。现在，我们的演示已经触及了一些需要探索的关键点，下面让我们更详细地剖析编译过程，了解最终样式表是如何生成的。\n\
  \n### 理解发生了什么\n\n乍一看，这个演示似乎很简单（至少从代码量上看如此），尽管我们可能还不清楚具体发生了什么！让我来揭示一切——我们的演示涵盖了将在本书后面详细阐述的两个关键步骤。现阶段，可以将其概括如下：\n\
  \n-   将 Sass 代码编译为 CSS 代码。\n-   创建并复用变量（或称占位符）。\n\n先来看看编译过程——在最基本的层面上，我们只需要指定源文件（此处为\
  \ `test.scss`）和想要创建的输出文件名（`output.css`）。在哪里执行编译过程并不重要，关键在于务必正确指定文件名，并且 Sass 编译器会自动覆盖目标文件夹中的现有文件。\n\
  \n我们提到的第二个关键点是变量的创建——对于不熟悉编程技术的读者来说，这可能有些吓人，但请相信我：它们用起来比听起来要简单！如果查看 `test.scss`\
  \ 的内容，会看到图 1-3 中列出的代码。\n\n![../images/472539_1_En_1_Chapter/472539_1_En_1_Fig3_HTML.jpg](img/472539_1_En_1_Fig3_HTML.jpg)\n\
  \n**图 1-3** 检查我们的 Sass 源文件\n\nSass 不会尝试编译 Sass 文件中已有的 CSS 规则；这些规则原封不动地会被复制到目标文件中。这是一个值得记住的要点——我们将在本书后面探讨其原因。\n\
  \n让我们逐行分析：\n\n-   随后，我们为 `body` 开启了一条规则——在其中指定了字体、字体颜色和文本装饰的属性。我们没有使用固定值，而是插入了与代码第\
  \ 1 到第 3 行列出的变量相对应的占位符。\n-   前三行指定了占位值，即变量——一个用于字体族名称，两个用于颜色（一个作为字体颜色，另一个作为文本装饰颜色）。Sass\
  \ 在命名约定方面相当灵活；只要不占用现有的关键字，可以使用任何合适的名称；但任何变量都必须以 `$` 符号开头，以此表明它是变量。\n\n可以将变量视为桶或占位符——它们告诉\
  \ Sass 在编译时在哪里插入实际值。为了验证这一点，请打开 `output.css` 文件；您会看到三个属性现在都有了易于理解的值，如图 1-4 所示。\n\
  \n![../images/472539_1_En_1_Chapter/472539_1_En_1_Fig4_HTML.jpg](img/472539_1_En_1_Fig4_HTML.jpg)\n\
  \n**图 1-4** ……以及输出文件\n\n编译过程会执行多项任务，其中之一就是用实际值替换变量。我们的示例只有三个变量，但想象一下，如果在一个很长的样式表（例如\
  \ WordPress 的样式表）中多次重复使用变量会怎样？只需一次性更新一个变量的实例并重新编译文件——就能消除遗漏变量的风险，因为 Sass 会自动更新它找到的每一个实例。\n\
  \n我们将在第 2 章“变量与混入入门”中重新讨论变量的概念。\n\n好了——让我们换个话题：我们的流程虽然可行，但如果总是需要手动编译代码，会变得有些乏味。此外，我们的文件夹结构也肯定可以改进；是时候考虑如何建立一个合适的工作流程来辅助编译过程了。\n\
  \n## 设置工作流程\n\n在使用 Sass 时，有条理地进行组织会大有裨益——如果只处理几个文件，我们目前这样的设置或许还能应付。但如果需要处理更庞大的项目，这种方式显然就行不通了：是时候让自己井井有条了。\n\
  \n我坚信保持简单——毕竟，把本不需要复杂的事情变得复杂毫无益处！我们可以做一些改进，这对我们肯定有帮助，让我们来看看：\n\n-   建立合适的文件夹结构来存放资源文件。\n\
  -   启用 CSS 源映射支持。\n-   自动化编译过程。\n-   调整代码的输出格式。\n-   确保拥有一个得心应手的文本编辑器。\n\n在本书后续内容中，我们还将探索如何生成可复用的代码，或提供一些有助于开发流程的额外技巧。不过，需要理解的关键一点是，虽然刚开始我们可能不需要什么复杂的东西，但正确配置它们至关重要；让我们深入探讨，详细了解这些内容。\n\
  \n### 设置文件夹结构\n\n我强烈建议创建一个文件夹结构来存放你的资源文件；作为起点，我建议创建一个 Sass 源文件文件夹和一个已编译的 CSS 样式表文件夹。Sass\
  \ 的主要优势之一就是能够将较大的样式表拆分成更小的文件；随着时间的推移，我们可以建立一个类似于图 1-5 所示的文件夹结构。\n\n![../images/472539_1_En_1_Chapter/472539_1_En_1_Fig5_HTML.jpg](img/472539_1_En_1_Fig5_HTML.jpg)\n\
  \n**图 1-5** Sass 开发的典型文件夹结构\n\n当然，这需要时间来逐步形成，所以如果我们从一个简单的源文件文件夹（本例中为 `sass`）和一个单独的目标文件夹（比如本例中的\
  \ `stylesheets`）开始，这将为我们后续开发 Sass 代码打下良好基础。\n\n\n\n### 启用源映射支持\n\n再看一眼我们编译后的 `test.css`\
  \ 文件底部——你是否注意到这一行的存在？\n\n```\n/*# sourceMappingURL=maps/test.css.map */\n```\n\n\
  这是一个指向 CSS 源映射的链接——在处理 Sass 时，这是一个不可或缺的工具。简单来说，它能将样式表中的每条编译规则回溯到原始的 Sass 代码；我们可以用它来精确定位代码中可能出现问题的具体位置。\n\
  \n通过命令行（或终端会话）编译时，会自动生成源映射。要使用它们，我们需要启用浏览器支持——让我们以 Chrome 为例，演示如何操作：\n\n![../images/472539_1_En_1_Chapter/472539_1_En_1_Fig6_HTML.jpg](img/472539_1_En_1_Fig6_HTML.jpg)\n\
  \n*图 1-6 启用 CSS 源映射选项*\n\n-   启动浏览器，然后按下 `Ctrl + Shift + I`（或 Mac 上的 `Command +\
  \ Apple + I`），调出开发者控制台。\n-   点击控制台右上角的三个点，然后选择设置。\n-   在“来源”下，找到“启用 CSS 源映射”条目（图\
  \ 1-6）。\n\n如果你再回头看一下图 1-2，你会看到一个 `output.css.map` 文件——这是我们在命令行编译第一个文件时自动创建的。用文本编辑器打开这个文件，我们会看到类似这样的内容：\n\
  \n```\n{\"version\":3,\"sourceRoot\":\"\",\"sources\":[\"../sass/test.scss\"],\"\
  names\":[],\"mappings\":\"AAIA;EACE;EACA,OALc;EAMd,uBALiB\",\"file\":\"output.css\"\
  }\n```\n\n它看起来可能像无意义的代码，但它包含了从编译后的 CSS 文件 (`output.css`) 到原始源文件 `test.scss` 中相关代码的映射关系。可以说，我们无需担心这个文件里生成了什么——编译过程会替我们处理这一切。只要存在这个文件，并且在我们的浏览器中启用了支持，我们就能够将编译后的代码关联回其原始源文件。\n\
  \n### 自动化编译过程\n\n在*初次编译*演示中，我们使用了这行命令来编译代码：\n\n```\nsass test.scss output.css\n\
  ```\n\n这是一个简单的命令——它能毫不花哨地完成任务，当然前提是我们编写了有效的 Sass 代码！然而，每次运行时很快会变得繁琐；我们可以通过使用 `--watch`\
  \ 参数来彻底改善这一点。\n\n这只需要对我们的命令做一个简单的修改——在终端会话中运行编译时，几乎值得养成包含它的习惯！我们可以使用以下命令，替代之前使用的命令：\n\
  \n```\nsass --watch test.scss output.css\n```\n\n这将监视文件变化并自动重新编译我们的源文件——不过有件事我们需要注意，但我会在第\
  \ 2 章中说明。\n\n### 调整输出格式\n\n如果你查看一个编译后的 CSS 文件，可能会注意到 Sass 生成了易于阅读但占用大量空间的代码。这显然不适用于生产环境——我们希望文件尽可能小！幸运的是，我们可以对编译过程做一个简单的更改——还记得我们的第一个编译命令吗？它看起来是这样的：\n\
  \n```\nsass test.scss output.css\n```\n\n如果我们加入下面加粗的命令：\n\n```\nsass test.scss output.css\
  \ --style=compressed\n```\n\n... 这将压缩编译后的样式表，使其非常适合在生产环境中使用。\n\n默认情况下，如果你省略此命令，Sass\
  \ 将以展开格式生成代码——如果你希望明确指定这一点，则使用 `--style=expanded` 代替。\n\n### 编辑 Sass 代码\n\n现在——这看起来可能有点奇怪，但你一会儿就会明白为什么：虽然有很多不错的工具可以用来编辑\
  \ Sass 代码，但我们并不一定需要它们！让我解释一下我的意思：\n\n在基本层面上，Sass 只不过是 CSS 的扩展——这意味着几乎任何文本编辑器都可以用来编辑\
  \ Sass 代码。我想你们中的许多人已经有一个最喜欢的编辑器，并且它完全适用于 Sass。我个人使用 Sublime Text 3，这是一个商业软件，但 80\
  \ 美元的价格绝对物有所值！\n\n为了本书的目的，我将假设你已经有一个适合你的编辑器。如果没有，那么有一个支持 Sass 语法并能打开和格式化多个文件的编辑器会很有帮助（这其实不是问题，因为大多数编辑器都支持）。如果你还没有合适的工具，以下这些可能是一个不错的起点：\n\
  \n-   Atom（跨平台）——可从 [`https://atom.io/`](https://atom.io/) 获取\n-   TextMate（仅限 Mac\
  \ OS）——[`https://macromates.com`](https://macromates.com)\n-   Sublime Text（跨平台，商业）——可从\
  \ [`https://www.sublimetext.com`](https://www.sublimetext.com) 下载\n-   Visual Studio\
  \ Code（跨平台，免费）——可从 [`https://code.visualstudio.com/`](https://code.visualstudio.com/)\
  \ 获取\n\n然而，还有另一个选择会彻底改变局面：如果你想使用一个专门的独立工具来编译 Sass，也有一些开源和商业软件可供选择。有些可以跨多个平台使用，而另一些则仅针对特定平台。让我们看看其中一些可选方案：\n\
  \n-   CodeKit – 这款商业软件可从 [`https://codekitapp.com/`](https://codekitapp.com/) 获取，但仅适用于\
  \ Mac\n-   GhostLab – 作为 Mac 或 Windows 的商业应用，可从 [`http://www.vanamco.com/ghostlab/`](http://www.vanamco.com/ghostlab/)\
  \ 获取\n-   Hammer – 一款仅限 Mac 的商业编辑器，可从 [`https://hammerformac.com/`](https://hammerformac.com/)\
  \ 获取\n-   Koala – 可从 [`http://koala-app.com/`](http://koala-app.com/) 下载，Koala 是一款跨平台的开源编辑器，尽管自\
  \ 2017 年底以来没有更新过\n-   Prepros – 这款共享软件编辑器可从 [`https://prepros.io/`](https://prepros.io/)\
  \ 获取，并提供适用于 Mac、Windows 和 Linux 的版本\n-   Scout-App – 一款适用于 Mac、Windows 和 Linux 的开源编辑器，可从\
  \ [`http://scout-app.io/`](http://scout-app.io/) 下载\n\n*注意：上表中的“全部”指的是支持 Mac、Windows\
  \ 和 Linux。*\n\n哦——你猜怎么着？还有一种编译 Sass 的途径供我们选择！如果你更倾向于不在开发工作流中安装另一个工具，那么你总是可以选择在线编译你的代码。\n\
  \n有几个选项可用于此目的，但其中一个推荐的是 SassMeister，托管在 [`https://www.sassmeister.com`](https://www.sassmeister.com)。它提供与离线编译完全相同的\
  \ Sass 编译体验；它可能不太适合编译冗长、复杂的代码块，但如果你想在将更改提交到源代码之前尝试一些想法，它是理想的选择。\n\n\n\n### 做出选择\n\
  \n我相信大家心中都有这样一个问题：面对这么多选项，我该如何选择使用哪一个？\n\n简短而直接的答案是：视情况而定。我知道这听起来可能像是在推脱，但 Sass\
  \ 的编译方式没有绝对的对错。这完全取决于你已经安装了哪些工具、你习惯使用什么，以及（在较小程度上）你使用哪个平台。\n\n例如，如果你喜欢直观的操作方式，那么使用带有专属支持功能的编辑器（如\
  \ Prepos）会是不错的选择。不过，如果你恰好在使用 Node.js，那么考虑调整你的工作流程，加入编译 Sass 的步骤就很有意义。同样，你可能根本不想额外安装任何东西——在这种情况下，使用终端方法是最简单的途径（而且无需安装！）。关键在于，编辑\
  \ Sass 的方法有很多种——不要害怕尝试不同的应用程序，直到找到你喜欢且适合你的那一款。\n\n为了本书的编写目的，我将使用终端方法来保持简洁，并将重点放在\
  \ Sass 代码上，而不是编译过程——如果你更喜欢使用可视化编辑器，请随意切换。\n\n好了——我们继续吧；流程中还有另一个部分需要考虑。还记得我说过每次都手动重新编译代码会很麻烦吗？我们可以使用像\
  \ Gulp 这样的任务运行器来自动化这个过程——让我们来更详细地了解一下具体内容。\n\n### 自动化流程\n\n虽然手动编译 Sass 代码适合轻量级开发，但对于规模稍大的项目很快就会变得令人头疼！当然必须有更好的方法……绝对有——我们可以使用像\
  \ Koala 或 Prepos 这样的专用应用程序，甚至可以直接在浏览器中使用 SassMeister 进行编译。然而，在应用程序之间来回切换会变得繁琐，而且还会增加代码出错的风险！\n\
  \n还有另一种选择：为什么不*自动化*编译过程呢？当然，这对于开发 Sass 代码来说并非必需，但创建能够处理编译这类低价值任务的东西，有几个好处：\n\n*\
  \ 我们可以将其设置为在后台运行——我们对代码所做的任何更改都会自动编译；\n* 我们可以在流程中关联其他任务，例如压缩 JavaScript 文件或为样式规则添加供应商前缀；\n\
  * 它免去了我们参与低价值任务的需要，让我们有更多时间处理重要事务。\n\n考虑到这一点，我们的下一个练习将使用 Gulp 和`gulp-dart-sass`包来设置一个自动编译流程，后者是\
  \ Dart Sass 库的包装器。安装并运行后，它将愉快地在后台运行；一旦检测到 Sass 文件发生更改，它就会自动将其编译成有效的 CSS 样式表文件。让我们更详细地了解一下具体内容。\n\
  \n### 自动化流程\n\n像 Gulp 这样的任务运行器需要使用 Node.js 运行时环境来安装——该环境适用于 Windows、Mac 和 Linux\
  \ 平台，其他平台也有可用的二进制文件。我们需要执行几个步骤，让我们开始吧：\n\n![../images/472539_1_En_1_Chapter/472539_1_En_1_Fig7_HTML.jpg](img/472539_1_En_1_Fig7_HTML.jpg)\n\
  \n图 1-7\n\n安装我们的包\n\n1. 第一步是安装 Node.js——为此，请前往[`https://nodejs.org`](https://nodejs.org)，下载适合你平台的版本。如果出现提示，请接受所有默认设置；这对于本练习的目的来说已经足够了。\n\
  \n2. 安装完成后，启动一个终端会话，输入以下命令以确认 Node 和 NPM 已成功安装：\n\n   ```\n   node –v && npm –v\n\
  \   ```\n\n   如果一切顺利，Node 将返回`v8.11.3`或更高版本，而 NPM（Node 的包管理器）将显示`5.6.0`或更高版本。\n\n\
  3. 接下来，在提示符处运行以下命令——它会关闭`package-lock.json`文件的创建，这是 NPM 5 或更高版本的新功能，但在本书的演示中并不需要：\n\
  \n   ```\n   npm config set package-lock false\n   ```\n\n4. 现在，将`automate`文件夹的副本解压到你的项目区域。\n\
  \n5. 我们还有一些东西要安装，为此，启动终端会话，首先运行以下命令——这将安装 Gulp 的依赖项：\n\n   ```\n   npm install –g\
  \ gulp-cli\n   ```\n\n6. 完成后，继续在提示符处运行以下命令——这将安装我们在`automate`文件夹中复制过来的`package.json`文件中列出的其余包（Sass、Gulp、Sourcemap\
  \ 支持和用于 Gulp 的 Autoprefixer——一个 PostCSS 工具，但能与标准 CSS 很好地配合），如图 1-7 所示。\n\n   ```\n\
  \   npm install\n   ```\n\n   关于`fsevents`和废弃包的警告可以忽略，这对本练习没有影响。\n\n至此，我们的自动化流程已经设置完毕；让我们通过编辑测试文件并观察其编译过程来测试一下。在下一步中，我建议在屏幕上打开`sass`和`css`文件夹以及终端会话：\n\
  \n1. 查看一下`css`文件夹——你现在会看到一个新编译的样式表和`map`文件夹，其中包含我们的源映射文件。\n\n2. 在提示符处输入`gulp`，然后按回车键。\n\
  \n3. 初始默认任务会运行——这可以忽略。打开`sass`文件夹中的`test.scss`，将分配给`$primary-color`的十六进制代码更改为`#dcdcdc`（一种浅灰色）。\n\
  \n4. 保存更改——如果一切顺利，Gulp 的监视功能就会启动并自动重新编译我们的代码，如图 1-8 所示。\n\n   ![../images/472539_1_En_1_Chapter/472539_1_En_1_Fig8_HTML.jpg](img/472539_1_En_1_Fig8_HTML.jpg)\n\
  \n   图 1-8\n\n   自动重新编译我们的代码\n\n希望这不会太痛苦——步骤可能看起来不少，但它为后续开发打开了众多可能性。除此之外，我们的流程涵盖了多个我们应该注意的关键点，所以让我们深入探讨并分解一下具体发生了什么。\n\
  \n\n\n### 拆解流程详解\n\n在过去的几页中，我们利用 Node.js（及其包管理器 NPM）的强大功能，创建了一个能自动编译 Sass 的基础系统。为了实现这一目标，我们借助了一些预配置指令文件来安装\
  \ Node 及若干 NPM 包。现在，让我们从 `package.json` 开始，详细审视这些指令文件。\n\n`package.json` 文件包含我们将使用的所有包的详细信息——在本例中，我们指定了\
  \ Gulp 作为任务运行器，以及 `gulp-sourcemaps`（提供源码映射）、必不可少的 `gulp-dart-sass`（用于 Sass 支持）和\
  \ `gulp-autoprefixer`（根据需要添加或移除浏览器前缀）。你可能会注意到，练习中并没有单独为每个包执行安装命令：这是有意为之。运行 `npm\
  \ install` 效率更高，因为它默认会在同一文件夹中查找 `package.json` 文件，并安装其中列出的所有包。虽然这需要事先做好准备工作来创建 `package.json`\
  \ 文件，但能简化安装流程。\n\n深入探讨 `package.json` 的具体设置已超出本书范围——如果你有兴趣了解更多，建议前往 [`https://docs.npmjs.com/getting-started/using-a-package.json`](https://docs.npmjs.com/getting-started/using-a-package.json)\
  \ 查阅详情。\n\n安装完成包之后，我们便利用 `gulpfile.js` 文件来执行编译操作。该文件包含一组指令，每当检测到目标文件夹中有文件发生变更时就会执行这些指令。让我们看看这段代码，首先从一些声明开始——第一行是强制启用严格错误检查：\n\
  \n```\n'use strict';\n```\n\n接着，我们设置了一些针对不同包的 require 声明，这些包会根据需要被调用：\n\n```\nvar\
  \ gulp = require('gulp');\nvar sass = require('gulp-dart-sass');\nvar sourcemaps\
  \ = require('gulp-sourcemaps');\nvar autoprefixer = require('gulp-autoprefixer');\n\
  ```\n\n下一个代码块是我们的 sass 任务——它负责将源文件编译为有效的 CSS 样式表文件：\n\n```\ngulp.task('sass', function\
  \ () {\nreturn gulp.src('sass/*.scss')\n.pipe(autoprefixer({ browsers: ['last 2\
  \ versions'] }))\n.pipe(sourcemaps.init('/maps'))\n.pipe(sass().on('error', sass.logError))\n\
  .pipe(sourcemaps.write('./maps'))\n.pipe(gulp.dest('./css')) ;\n});\n```\n\n它首先定位\
  \ `sass` 文件夹中扩展名为 `scss` 的文件；这是为了防止编译器尝试处理并非有效 Sass 源文件的文件！下一步是为尚未标准化的 CSS 属性添加浏览器前缀；在本例中，我们支持每个浏览器最新的两个版本。\n\
  \n接下来的步骤至关重要——它负责编译过程：要么成功编译文件，要么在屏幕上显示遇到的任何错误。我们最后会创建相应的源映射文件（方式类似于之前在终端会话中编译），然后将文件写入磁盘（存放到\
  \ `css` 子文件夹中）。\n\n顺便提一下——默认情况下，输出格式是展开的；如果我们想改变输出格式，可以按如下方式修改代码：`sass({outputStyle:\
  \ 'compressed'})`。\n\n如果没有最后一个任务——`default` 任务，上述所有操作都无法生效。当我们在终端提示符下输入 `gulp` 时，该任务就会立即运行。它会监视\
  \ `sass` 文件夹中的任何 Sass 文件；任何更改都会触发 sass 任务：\n\n```\ngulp.task('default', function\
  \ () {\ngulp.watch('sass/*.scss', ['sass'])\n.on('change', function(evt) {\nconsole.log(\n\
  '\\n[watcher] File ' + evt.path.replace(/.*(?=sass)/,\") +\n' was ' + evt.type +\
  \ ', compiling...'\n);\n});\n});\n```\n\n一旦发生更改，我们就会调用一个小函数来显示一条消息，确认哪个文件被修改了；然后代码会重新编译，并作为新的样式表和映射文件保存到磁盘。\n\
  \n归根结底，搭建这套系统似乎需要不少工作量，但重要的是要意识到，你可能已经具备了部分基础。这只是实现编译流程自动化的一种方式；你或许更喜欢使用 Grunt 或\
  \ Webpack 之类的工具。然而，目标在于评估你已具备或不具备的条件、你是否有任何偏好（如果你之前用过任务运行器），以及判断你的项目性质是否意味着你能从流程自动化中受益。\n\
  \n顺便说一下，除非另有说明，整本书的练习都将使用这一流程。这纯属个人偏好；请随意使用最适合你的编译流程。\n\n好了，闲话少说——换换方向吧！希望你已尝试了几种方案，并找到了适合自己（或至少能正常运行）的方法。是时候更专注于\
  \ Sass 本身了，那么事不宜迟，让我们开始介绍使用 Sass 时将会遇到的一些关键术语吧。\n\n\n\n## 熟悉关键术语\n\n在本书的课程中，我们将接触到大量与\
  \ Sass 搭配使用的不同技术和关键术语——有些很容易上手，而另一些则可能需要花更多时间！\n\n我们已经遇到了最重要的一个——编译过程。对我们来说，这与其说是理解其内部运行机制（可以说它就像一个神奇的黑匣子），不如说是要了解我们能做什么——例如，如果我们要创建一组按钮，我们可以编写代码来自动完成大部分工作，然后由\
  \ Sass 将其编译（或转换）为有效的 CSS 代码。\n\n然而，编译并非我们涉及的唯一概念——Sass 有许多关键术语，我们将在本书中逐一探索。尽管目前这些术语可能还毫无意义，但我想在此总结其中一些关键术语，以便你能对书中后续内容有所期待。我还会附上相关的章节编号，这样如果你遇到困难，就知道应查阅哪一章寻求帮助：\n\
  \n*   **注释**——这是 Sass 中最简单的技术之一；它的使用方式与普通 CSS 完全相同。使用注释的关键在于你所用的注释类型——例如，单行注释在编译时会被移除，而多行注释则会保留。我们将在第\
  \ 2 章“添加注释”一节中更详细地介绍这一点。\n\n*   **变量**——可以将其视为值的占位符；Sass 会查找特定变量的每个实例，并将其替换为我们最初设置的真实值。无论我们在代码中有多少个特定变量的实例，Sass\
  \ 都会将它们全部替换！我们将在第 2 章“在实际环境中创建变量”一节中深入讨论这个主题。\n\n*   **混合**——变量是一个好的开始，但如果我们想以同样的方式定义更大的代码块呢？混合（mixins）应运而生——它们充当预定义的代码块，我们可以直接将其“混合”到代码中。我们可以定义一次，然后在多个项目中重复使用——请参阅第\
  \ 2 章，了解更多关于这项实用技术的信息。\n\n*   **导入与局部文件**——如果你曾经处理过大型电子表格（比如像 WordPress 那样超过 4500\
  \ 行的庞然大物），那么你一定会深切体会到管理这么多行代码有多么痛苦。Sass 有一个 `@import` 函数，类似于 CSS；我们可以用它创建 CSS 代码的局部文件或片段，然后将其导入到主样式表中。我们将在第\
  \ 2 章及后续章节介绍这一点。\n\n*   **嵌套**——你曾有多少次为菜单系统之类的东西编写 CSS 代码，结果发现自己重复编写了多个样式？有了 Sass，我们可以将样式嵌套在另一个样式之内——可以将其视为将样式分组在一起，放在一个所有样式都通用的基础样式内部。从某种意义来说，这是一种简写形式，使得代码更易于阅读——我们将在第\
  \ 3 章“创建嵌套样式”中介绍这一点。\n\n*   **继承**——这稍微有点棘手：与其多次重写具有相似属性的代码块，不如让一个代码块继承另一个？一个完美的例子是创建按钮——我们可以编写基础样式规则来涵盖尺寸和字体等属性。我们创建的任何按钮都可以继承这个基础样式，再加上我们为每个按钮指定的特定样式（比如颜色）。这是一项值得学习的好技术，但需要时间才能真正掌握——我们将在第\
  \ 3 章“创建嵌套样式”中开启这段学习之旅。\n\n*   **运算符**——我猜想在很多情况下，你可能会在电子表格中指定固定值，比如为 `font-size`\
  \ 属性指定 `16px`，对吧？如果我们能仅使用加、减等简单运算来动态计算出值呢？例如，我们不再需要指定一整组调色板值——只要我们有一个，就可以使用一点数学运算来自动计算出互补色。我将在第\
  \ 4 章“使用运算计算值”中揭示其原理以及更多内容。\n\n*   **指令**——这才是真正有趣的地方！CSS 已经有一些 `@-` 规则；Sass 在此基础上增加了一些，如\
  \ `@extend` 或 `@media`。可以将这些视为帮助控制 Sass 代码中流程和逻辑的规则——`@media` 就是一个很好的例子，我们用它来指定在响应式网站开发中应应用哪些规则。我们将深入探讨第\
  \ 4 章“使用运算计算值”中的指令世界。\n\n呼——我们即将面对一系列激动人心的技术！当然，我们不必一次性掌握所有内容——Sass 的妙处在于我们可以从简单的技术（比如设置变量）开始，然后在开发样式表的过程中逐步利用更多的工具。不过，在我们踏上这段旅程之前，有一个主题我知道对\
  \ Sass 新手来说将是最有益处的——如果某些东西不起作用或者我卡住了，我可以在哪里获得帮助？\n\n\n\n## 获取帮助\n\n*“救命！为什么我的混合宏没有按预期运行……？”*\n\
  \n尽管 Sass 相对容易学习，但总会有需要帮助的时候——当然，网上有很多人写过关于 Sass 的文章，但有时有人帮你解决棘手问题会更有帮助！别担心——有几种获取帮助的方式；其中包括：\n\
  \n*   如果你在某件事上卡住了，努力让它运行起来，那么你的首选应该是 StackOverflow 网站，地址是 [`https://stackoverflow.com`](https://stackoverflow.com)。该网站由志愿者社区管理，任何人都可以在此提问；我强烈建议阅读\
  \ [`https://stackoverflow.com/help/`](https://stackoverflow.com/help/) 上的指南，以提高获得有助于解决问题的回复的可能性。\n\
  \n另外，值得快速搜索一下，看看是否有其他人遇到过同样的问题——试试 [`https://stackoverflow.com/search?q=Dart+Sass`](https://stackoverflow.com/search?q=Dart+Sass)；说不定已经有人知道答案了！不过请耐心等待：这是一个志愿者运营的平台，因此你可能不会很快得到回复。\n\
  \n*   然而，如果你认为自己发现了一个 Bug，即某个行为无法按预期工作或核心功能明显出错，那么 GitHub 是一个很好的报告地点。Dart Sass 的\
  \ GitHub 仓库地址是 [`https://github.com/sass/dart-sass`](https://github.com/sass/dart-sass)——但请确保找对地方，因为\
  \ Sass 团队为不同版本的 Sass 运行着多个 GitHub 仓库。\n\n如果你确实需要提交一个问题，而此前从未做过，可能会觉得有些令人生畏。值得注意的是，GitHub\
  \ 仓库通常由志愿者维护，他们之前见过类似问题，并且总是愿意提供帮助。你可以遵循一些有用的建议来帮助完成记录问题的流程：\n    *   务必仔细查阅过往的问题——有可能（尽管并非总是如此）已经有人记录了类似的问题，这可能对你有帮助，而无需你自己再提交一个问题。\n\
  \n*   务必添加标题和描述，并尽可能详细地描述问题——包括截图、重现步骤、你迄今为止尝试过的方法以及结果，但不要写成长篇大论！GitHub 志愿者的时间很宝贵，因此详细但简洁至关重要。\n\
  \n*   发帖时请彬彬有礼——GitHub 仓库由志愿者运营，他们有自己的家庭和有偿工作，如果你态度粗暴，他们不太可能提供帮助。如果你尊重他们，他们会非常乐意为你提供指导。\n\
  \n*   如果你发现了一个你认为的 Bug，但回复说这是“设计如此”，那么请尊重他们的决定。然而，如果你强烈反对，请礼貌地陈述你的情况，附带细节，并愿意讨论你观点的合理性。维护者无法满足所有情况，他们会始终考虑新的证据，但如果你辱骂或无礼，他们就不愿意提供帮助。同样，如果维护者审查了你的请求但决定不做任何更改，请尊重他们的决定。\n\
  \n*   在催促回复之前，请留出合理的时间——人们可能有其他承诺，或者时差可能会造成阻碍；你在提交问题时需要考虑这一点。\n\n*   如果有人提出了帮助你解决问题的建议，请务必尽快回复；没有人喜欢回复一个问题，却发现你懒得尝试！\n\
  \n我可以继续列举，但这些指南大部分都可以概括为三个关键点：始终保持礼貌和尊重，确保问题描述足够详细，并在适当的时候及时回复。只要你遵循这些指南，就会有很多人愿意将自己的知识传授给刚刚踏入\
  \ Sass 世界的人。\n\n顺便提一下，你可以在 Sass 官网看到类似的指南，地址是 [`http://sass-lang.com/community-guidelines`](http://sass-lang.com/community-guidelines)。\n\
  \n### 总结\n\n初次发现和探索一项技术可以打开一些真正的可能性——这尤其适用于 Sass 的世界！在本次 Sass 之旅的第一部分，我们介绍了一些有用的技巧和诀窍，那么让我们花点时间回顾一下所学的内容。\n\
  \n我们从介绍 Sass 这项技术开始，探讨了它是什么，以及我们为何要将其用于项目中的原因。然后我们介绍了与 Sass 相关的一些不同版本和语法，并确保我们清楚本书将使用哪一种。\n\
  \n接下来是 Sass 的初始安装；我们看到了编译第一个文件是多么简单，然后探讨了编译过程中会发生什么。接着我们讨论了如何设置合适的工作流程以充分利用 Sass，然后介绍了如何自动化编译过程，以便我们可以将时间花在更重要的任务上。最后，我们快速浏览了本书将涉及的一些关键术语以及如何获取帮助，以防我们遇到困难。\n\
  \n呼——这是个不错的开始，但还有更多内容要介绍！在下一章中，我们将真正开始深入使用 Sass；我们的第一站将是学习如何创建变量和混合宏，以帮助减少代码量并简化保持值更新的过程。各位朋友们，请上车——船即将起航……\n\
  \n"
- "# 2. 介绍变量和混合宏\n\n> *星期五晚上，你度过了忙碌的一周，期待着结束一天的工作。在你的脑海里，你能看到一杯诱人的冷饮，上面还印着你的名字，正在家里等着你……但你的老板走进了办公室，从他脸上的表情来看，任何准时下班的念头都迅速从窗外消失了……*\n\
  \n我敢打赌这个场景听起来太熟悉了：那些——我们该说很有挑战性的？——客户对设计不满意，想要尝试改变配色方案。然而，他们的网站非常复杂，样式表中使用了不同的颜色。当然，你可以进行搜索和替换，但你真的想翻阅数千行代码来确保已经更改了所有颜色吗……？\n\
  \n\n\n## 在实际场景中创建变量\n\n绝非如此！实际上有更好的方法——请进入 Sass 的领域。Sass 的关键特性之一就是变量；它们的工作原理与许多脚本语言（如\
  \ JavaScript）类似。现在，在你惊慌失措之前：别担心——它并没有听起来那么复杂。让我以颜色为例，解释一下它是如何工作的。\n\n在样式表中工作时，通常的做法是在整个样式表中根据需要分配颜色——如果需要修改，我们可能会执行查找和替换操作。这本身并无不妥，前提是我们始终使用相同的大小写——显然，用\
  \ `#000` 替换 `#fff` 不会捕捉到任何我们使用了 `white` 的地方！\n\n相反，我们可以为每种颜色的实例简单地设置占位符名称，比如 `darkGrey`\
  \ 或 `antiqueWhite`——目前，使用什么名称并不重要（尽管我稍后会再次讨论这个问题）。\n\n真正的魔法发生在样式表的开头——我们为每个占位符指定值，就像图表的图例一样。在编译代码时，Sass\
  \ 只需对每个占位符变量实例进行查找和替换，并用“图例”列表中的相应值替换它们。这意味着如果我们遇到苛刻的客户，那么我们每种颜色只需要修改一次——我们可以在样式表的开头修改它，而\
  \ Sass 将在编译期间自动更新。\n\n为了看看它有多简单，让我们看一个简单的例子——在下一个练习中，我们将向页面添加一些简单的元素，但使用变量通过 Sass\
  \ 应用颜色。我使用了在黑白环境（用于打印）中效果更好的颜色，但这适用于你选择的任何颜色。\n\n### 分配变量\n\n让我们开始编写代码：\n\n![../images/472539_1_En_2_Chapter/472539_1_En_2_Fig1_HTML.jpg](img/472539_1_En_2_Fig1_HTML.jpg)\n\
  \n图 2-1\n\n创建基本变量\n\n1. 首先，从本书附带的代码下载中下载并解压 `variables` 文件夹的副本——继续将此文件夹保存到我们的项目区域中。\n\
  \n2. 接下来，启动你的文本编辑器——我们现在可以添加样式，所以请创建一个新文件，并将其保存为 `variables` 文件夹的 `scss` 子文件夹中的\
  \ `variables.scss`。\n\n3. 我们将在样式表中添加许多样式——第一组是我们将在本演示中用于定义颜色的变量集合：\n\n```\n$color-gainsboro:\
  \ #c0c0c0;\n$color-dimgrey: #696969;\n$color-slategrey: #708090;\n```\n\n4. 留一个空行，然后添加以下基础样式：\n\
  \n```\n@font-face {  font-family: 'pt_sansregular'; src: url('../font/pt_sansregular.woff')\
  \ format('woff'); font-weight: normal; font-style: normal; }\nbody {  font-family:\
  \ 'pt_sansregular', sans-serif; padding: 20px; }\nh2 { text-align: center; }\nsection\
  \ { border: 1px solid #000; width: 450px; padding: 20px; margin-left: auto; margin-right:\
  \ auto; }\n```\n\n5. 再留一个空行，然后在其下方立即添加以下将使用 Sass 的样式：\n\n```\nsection span { color:\
  \ $color-dimgrey; font-size: 20px; font-weight: bold; }\np { color: $color-gainsboro;\
  \ font-size: 16px; font-weight: bold;}\na { color: $color-slategrey; text-decoration:\
  \ none; }\na:hover { text-decoration: underline; background-color: antiquewhite;\
  \ font-weight: bold; }\n```\n\n6. 将文件保存为 `scss` 文件夹中的 `variables.scss`。\n\n7. 接下来，启动一个终端会话，并将工作文件夹更改为项目区域下的\
  \ `variables` 文件夹。\n\n8. 在提示符下，键入以下命令并按 Enter：\n\n```\nsass sass\\variables.scss\
  \ css\\variables.css\n```\n\n9. 如果一切顺利，我们应该会在 `css` 文件夹中看到一个 `variables.css` 文件，以及一个源映射——预览结果将显示一个包含样式化元素的简单框，如图\
  \ 2-1 所示。\n\n看到了吧，是多么简单？诚然，我们的示例非常简单，但这没关系——我们可以在各种不同的场景中使用它。这是一个需要掌握的重要功能，所以让我们花点时间更详细地了解它是如何工作的。\n\
  \n### 探索发生了什么\n\n尽管使用变量的想法可能会吓到一些人，但创建和使用变量并没有看起来那么难。我们在第一章 1 的第一个演示中已经接触过这一点，当时我们编译了一个使用了三个变量的单一样式规则。\n\
  \n实际上，使用变量不过就是查找和替换——我们的演示使用了三个变量，即 `$color-gainsboro`、`$color-dimgrey` 和 `$color-slategrey`。我们为每个变量分配了相应的颜色代码（如果需要，我们可以使用\
  \ RGB，甚至 RGBA）。然后，我们在代码中的适当位置添加了相应的变量——例如，`$color-gainsboro` 出现在第 22 行的颜色属性处。在编译时，Sass\
  \ 会查找每个使用的变量，并用相应的值替换它们——在此例中，我们的值将在编译后的样式表中变为 `color: #c0c0c0;`。\n\n为了证明这一点，请通过浏览器的\
  \ DOM 检查器查看编译后的样式表——如果我们启用了源映射支持，我们将看到最终编译的结果，以及指向原始源文件的链接，如图 2-2 所示。\n\n![../images/472539_1_En_2_Chapter/472539_1_En_2_Fig2_HTML.jpg](img/472539_1_En_2_Fig2_HTML.jpg)\n\
  \n图 2-2\n\n在浏览器中查看编译后的 CSS\n\n如果我们点击图 2-2 中显示的 `variables.scss` 名称，我们将看到原始的 Sass\
  \ 代码，如图 2-3 所示。\n\n![../images/472539_1_En_2_Chapter/472539_1_En_2_Fig3_HTML.jpg](img/472539_1_En_2_Fig3_HTML.jpg)\n\
  \n图 2-3\n\n将编译后的 CSS 转换为原始 SCSS\n\n此时，有几点需要注意：我们的命名约定，以及确保使用正确的名称！这很容易让你出错，所以让我们花点时间更详细地讨论一下这一点。\n\
  \n\n\n## 谨慎对待变量命名\n\n名称，名称——我们需要的不过是用来标识某个值的符号，对吧……？\n\n嗯，既对也不对。诚然，我们给出的任何名称都应表明其关联内容，但在使用\
  \ Sass 时，需要考虑的远不止于此。让我解释一下我的意思：\n\n在我们的示例中，我们使用 `$color-XXXXX` 格式为三种颜色命名。单独看，这些名称似乎合理：存在某种命名约定，且格式保持一致。\n\
  \n但是——我敢肯定我们都知道 `dimgrey` 是什么颜色：但你能说出 `gainsboro` 是什么颜色吗？这三种颜色都是灰色的不同深浅；然而，我们有什么依据表明它们确实如此？没有——为了解决这个问题，我们可以考虑进行一些调整：\n\
  \n*   创建颜色变量时，考虑调整名称的顺序，例如用 `$grey-dim` 或 `$grey-dark` 来代替 `$color-dimgrey`。这样命名更具模块化——我们共享通用术语，并通过描述其功能，实现从通用到具体的过渡，这很像\
  \ CSS 处理特异性的方式。\n\n*   我们还可以更进一步——与其将颜色直接放入 Sass 规则中，不如根据颜色在代码中的功能来创建描述性变量。在编辑时，大多数编辑器会根据我们在变量列表中定义的内容，自动显示建议的颜色。因此，重写前面的示例，结果如下：\n\
  \n    ```\n    $grey-dim: #696969;\n    $color-title: $grey-dim;\n    section span\
  \ { color: $color-title; font-size: 20px; font-weight: bold; }\n    ```\n\n*   这样做还有一个额外好处：如果我们决定更改\
  \ `$color-title` 的颜色深浅，可以一次性完成：只需修改一个条目，而无需修改代码中的多个条目。\n\n变量的写法没有绝对的对错之分，尤其是涉及颜色时；不过，确保使用一致的命名约定是明智之举。像我们这样使其模块化，意味着我们甚至可以定义一个小的调色板，并使用函数创建完全不同的颜色！\n\
  \n要了解我的意思，可以查看 Jackie Balzer 在 [`http://jackiebalzer.com/color`](http://jackiebalzer.com/color)\
  \ 上的示例——所有这些颜色都仅由一种颜色 `#f8af1e`（一种深黄色）创建而成。我们将在第 4 章“使用观察结果计算值”中再次探讨这个想法。\n\n然而，使用变量还有更严肃的一面——在编写本书代码时，我遇到了如图\
  \ 2-4 所示的编译错误。\n\n![../images/472539_1_En_2_Chapter/472539_1_En_2_Fig4_HTML.jpg](img/472539_1_En_2_Fig4_HTML.jpg)\n\
  \n图 2-4\n\n处理编译错误\n\n乍一看有点突兀，但实际上原因很简单。\n\n在此示例中，我使用了 `--watch` 参数，以便在更改时自动编译代码。但演示中使用的颜色并不合适；我必须更改它们。我移除了\
  \ `$color-antiqueyellow` 变量，但没有更新仍引用此变量的规则。Sass 理所当然地报错了——解决方法当然是确保更新样式规则。\n\n在这种情况下，如果我们使用了本节开头介绍的示例，那么只要我们不删除其他变量，就很有可能避免出现此错误！变量使代码管理变得容易得多，但在使用命名约定以及开发过程中如何更新代码方面，确实需要多加注意。\n\
  \n## 添加注释\n\n到目前为止，我们编写的 CSS 规则都非常简单——规则名称应该能合理地说明其用法。问题是，如果我们开始添加越来越多的规则，尤其是一些规则不那么直观时，会发生什么情况？\n\
  \n显然，我们需要注释——幸运的是，Sass 对注释的支持方式与我们在 CSS 中使用注释的方式大致相同。不过，有几件事需要注意：\n\n*   如果使用单行注释，编译时默认会将其移除；\n\
  *   如果使用多行注释，当输出样式设置为 compressed 时，注释会被移除，但当设置为 expanded 时，注释会保留。\n\n为了说明我的意思，让我们深入实践一下。\n\
  \n### 编译注释\n\n1.  尝试运行编译命令，但这次稍作修改：\n\n    ```\n    sass --style=compressed sass\\\
  variables.scss css\\variables.css\n    ```\n\n    如果查看编译后的文件，注意到注释是如何消失的吗？\n\n2.\
  \  这次，尝试将多行注释替换为以下单行注释：\n\n    ```\n    // 这是一个测试注释\n    @font-face {\n    ```\n\
  \n3.  现在尝试编译代码——注意注释被移除了，并且如果再次使用 `style=compressed` 属性运行编译，注释仍然会被移除。\n\n1.  打开之前演示中的一个\
  \ Sass 文件——我使用的是 variables 文件夹中的文件。\n\n2.  添加以下高亮显示的代码，然后保存文件：\n\n    ```\n    /*\
  \ 这是一个测试注释\n    * 跨越几行，使用了\n    * 标准 CSS 注释\n    * 语法，并会出现在\n    * 编译后的输出中 */\n\
  \    $color-gainsboro: #c0c0c0;\n    ```\n\n3.  接下来，启动终端会话，将工作文件夹切换到项目目录下的 `variables`\
  \ 文件夹。\n\n4.  在提示符下，键入以下命令并按 Enter 键：\n\n    ```\n    sass sass\\variables.scss\
  \ css\\variables.css\n    ```\n\n5.  如果一切顺利，我们应该会像之前一样看到 `variables.css` 和源映射文件出现在\
  \ `css` 文件夹中——但这次如果你打开它，会看到注释出现在样式表的开头（图 2-5）。\n\n    ![../images/472539_1_En_2_Chapter/472539_1_En_2_Fig5_HTML.jpg](img/472539_1_En_2_Fig5_HTML.jpg)\n\
  \n    图 2-5\n\n    编译结果（含注释）\n\n看到管理注释有多容易了吗？添加注释是编写样式表的重要组成部分；但关键在于，我们应该谨慎选择使用哪种注释风格，以便在向源代码中添加注释和保留编译后样式表中的注释之间取得适当平衡。好了——是时候改变策略了：让我们看看\
  \ Sass 的下一个特性。有多少次你编写的代码可以直接复用，或者稍加调整就能复用？\n\n## 使用标准混合宏\n\n如果你花时间编写 CSS，我敢肯定你遇到过一些略显繁琐的场景——创建字体样式、使用\
  \ `transform` 制作动画、处理可缩放元素（如视频）、处理供应商前缀（在仍然需要的地方）等等。\n\n为了减少这种繁琐，我们可以利用 Sass 的一个强大特性：混合宏。它允许我们将\
  \ CSS 声明分组到代码块中，以便在项目中复用。我们可以使用两种类型之一——基本混合宏只是简单地嵌入到代码中，而参数化混合宏允许我们传入值，但仍使用相同的核心样式。我们稍后将介绍它们的工作原理，但首先让我们看看如何使用基本混合宏实现可复用代码。\n\
  \n\n\n### 创建可复用代码\n\n我们在引言中提到了几个非常适合使用 mixin 的用例场景——其中一个典型场景是让响应式内容在页面上居中，无论其如何缩放。\n\
  \n在创建响应式内容时，我们通常使用百分比值——[CSS-Tricks.com](http://css-tricks.com) 的 Chris Coyier 编写了一个优秀的\
  \ mixin，可以让我们将任何内容居中，从而自由地按需设置样式。我将以此为基础进行下一个演示，该演示将在屏幕上居中显示一个标准的 `<div>` 元素。\n\n\
  你可以通过 [`https://codepen.io/chriscoyier/pen/BvdgL`](https://codepen.io/chriscoyier/pen/BvdgL)\
  \ 查看 Chris 的原始示例。\n\n### 创建 Mixin\n\n让我们开始编写这段代码：\n\n![../images/472539_1_En_2_Chapter/472539_1_En_2_Fig6_HTML.jpg](img/472539_1_En_2_Fig6_HTML.jpg)\n\
  \n图 2-6：使用 mixin 居中 div\n\n1.  首先，下载 `centerdiv` 文件夹并将其解压到我们的项目目录中。\n2.  在你常用的文本编辑器中，新建一个文档，然后添加以下几行代码——我们首先定义一个变量，然后是我们的\
  \ mixin：\n\n    ```\n    $color-slategrey: #708090;\n    @mixin centerdiv { position:\
  \ absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }\n    ```\n\n\
  3.  留一个空行，然后为演示添加以下基础样式：\n\n    ```\n    @font-face { font-family: 'pt_sansregular';\
  \ src: url('../font/pt_sansregular.woff') format('woff'); font-weight: normal; font-style:\
  \ normal; }\n    body { font-family: 'pt_sansregular', sans-serif; background: #fff;\
  \ }\n    h2 { text-align: center; }\n    ```\n\n4.  我们已经添加了 mixin，但如果不调用它，它就不会生效——为此，请在上一组规则下方添加以下样式规则：\n\
  \n    ```\n    div {\n    @include centerdiv ;\n    width: 40%; height: 50%; padding:\
  \ 20px; background: $color-slategrey; color: antiquewhite; text-align: center; box-shadow:\
  \ 0 0 30px rgba(0, 0, 0, 0.2); border-radius: 10px; font-size: 18px; font-weight:\
  \ bold; letter-spacing: 1px;\n    }\n    ```\n\n5.  将此文件保存为 `centerdiv.scss`，并放在步骤\
  \ 1 中保存的 `centerdiv` 文件夹内的 `scss` 子文件夹中。\n6.  接下来，启动终端会话，将工作目录切换到项目目录下的 `centerdiv`\
  \ 文件夹。在提示符下，输入以下命令并按 Enter：\n\n    ```\n    sass sass\\centerdiv.scss css\\centerdiv.css\n\
  \    ```\n\n7.  如果一切顺利，我们应该会在 `css` 文件夹中看到生成的 `centerdiv.css` 文件以及一个 source map——预览结果将显示一个始终在屏幕中居中的简单方框，如图\
  \ 2-6 所示。\n\n尝试调整浏览器窗口大小——请注意，无论窗口缩小或放大多少，div 元素是否始终在屏幕中居中？虽然我们在代码中为 left 和 top\
  \ 设置了适当的值，但它们本身无法生效——我们来快速了解一下真正让这个演示成功的关键。\n\n### 详细解析代码\n\n这个演示的关键在于 Sass 代码是如何被编译的——我们可以在图\
  \ 2-7 中看到其第一部分。\n\n![../images/472539_1_En_2_Chapter/472539_1_En_2_Fig7_HTML.jpg](img/472539_1_En_2_Fig7_HTML.jpg)\n\
  \n图 2-7：我们的 mixin，编译为 CSS\n\n我们的演示在编译过程中包含了 `centerdiv` mixin 的内容——mixin 是作为 CSS\
  \ 规则编写的，但必须使用关键字 `@mixin` 进行定义，并使用关键字 `@include` 加上 mixin 名称来引用。\n\n需要注意的关键点是，mixin\
  \ 本身不会被编译，但其内部的规则会被包含到任何调用该 mixin 的规则集中。这确实意味着我们的源文件可能比编译后的版本要大，但这无关紧要：只要我们创建合适的\
  \ mixin，它们只会被包含到调用它们的规则集中，而不会在样式表中被单独编译。\n\n### 使用预构建的 Mixin\n\n掌握了创建 mixin 的新知识后，我们可以继续为项目创建新的\
  \ mixin。不过，在重新发明轮子之前，不妨先上网看看？\n\n在谷歌上搜索一下，你会看到很多人编写并发布了可用的 mixin；很多时候，我们可能会发现有人已经编写了一个满足我们需求的\
  \ mixin。使用现有的 mixin 可以节省时间和开发精力——当然，我们可能需要对代码进行微调，但这省去了从头开发的麻烦。\n\n### 使用预构建的 Mixin\n\
  \n网上有大量可用的 mixin，既有独立的，也有作为库一部分的——如果你在谷歌上搜索“sass mixin libraries”，会看到像 Bourbon、Scotch\
  \ 和 Compass 等库的引用。其中一些已经存在了一段时间；随着 CSS 的进步，它们的使用价值逐渐降低（尤其是那些包含不再必要的厂商前缀代码的库）。\n\n\
  一个 mixin 库的例子是 CSSgram，由 Una Kravets 创建——它借鉴了流行应用 Instagram 中使用的滤镜效果。可以从 [`https://una.im/CSSgram/`](https://una.im/CSSgram/)\
  \ 获取，我们将使用其中一个滤镜来为一张复古风格图片制作前后对比效果。\n\n在此演示中，我们将使用来自 [`https://www.pexels.com/photo/camera-photography-vintage-old-36732/`](https://www.pexels.com/photo/camera-photography-vintage-old-36732/)\
  \ 的相机图片；如果你想使用其他图片，请随意调整。\n\n让我们开始创建演示：\n\n![../images/472539_1_En_2_Chapter/472539_1_En_2_Fig8_HTML.jpg](img/472539_1_En_2_Fig8_HTML.jpg)\n\
  \n图 2-8：使用 mixin 库应用滤镜\n\n1.  首先，下载 `prebuilt` 文件夹并将其解压到我们的项目目录中。\n2.  在你常用的文本编辑器中，新建一个文档，然后添加以下几行代码——我们将为演示添加一些基础样式：\n\
  \n    ```\n    @import \"cssgram.scss\";\n    @font-face { font-family: 'pt_sansregular';\
  \ src: url('../font/pt_sansregular.woff') format('woff'); font-weight: normal; font-style:\
  \ normal; }\n    body { font-family: 'pt_sansregular', sans-serif; background: #fff;\
  \ }\n    h2 { text-align: center; }\n    ```\n\n3.  现在我们需要添加将图片放置到页面上的样式：\n\n  \
  \  ```\n    p { width: 100px; display: inline-block; margin: 0; padding: 0; }\n\
  \    section { width: 320px; margin-left: auto; margin-right: auto; }\n    div.filter,\
  \ div.nofilter { width: 300px; display: inline-block; margin: 10px; }\n    ```\n\
  \n4.  最后但同样重要的是，实现演示中使用的滤镜所需的样式：\n\n    ```\n    div.filter { @extend %stinson;\
  \ }\n    div.nofilter img { width: 100%; z-index: 1; }\n    ```\n\n5.  将此文件保存为 `prebuilt.scss`，并放在步骤\
  \ 1 中保存的 `prebuilt` 文件夹内的 `scss` 子文件夹中。\n6.  接下来，启动终端会话，将工作目录切换到项目目录下的 `prebuilt`\
  \ 文件夹。在提示符下，输入以下命令并按 Enter：\n\n    ```\n    sass sass\\prebuilt.scss css\\prebuilt.css\n\
  \    ```\n\n7.  如果一切顺利，我们应该会在 `css` 文件夹中看到生成的 `prebuilt.css` 文件以及一个 source map——预览结果将显示两张图片，一张未应用滤镜，另一张应用了滤镜，如图\
  \ 2-8 所示。\n\n尽管我们的演示创建起来相对简单，但有一个关键点值得进一步关注。如果你查看下载的 CSSgram 文件，会发现它非常庞大。其中包含大量不同的滤镜效果——如果你担心我们使用了过多的代码，这是可以理解的！幸运的是，我们实际使用的代码量远比看起来要少——让我们深入探讨，更详细地了解一下。\n\
  \n\n\n### 理解代码的工作原理\n\n那么，尽管我们使用了 CSSgram 混合宏库，为什么我们的 CSS 样式表并没有变得比预期更大呢？\n\n实现这一效果的诀窍在于样式表开头使用了\
  \ `@import` 语句——默认情况下，Sass 只会导入代码中*有直接引用*的混合宏。在这个例子中，我们只调用了 `stinson` 混合宏，因此 Sass\
  \ 在编译期间会直接忽略 `scss` 文件夹中所有其他的滤镜混合宏文件。\n\n导入文件时，文件扩展名并非必须包含：在本例中，我们同样可以在演示中使用 `@import\
  \ \"cssgram\";`。我们将在本章后面部分提到这一点。\n\n然而，这里有一个转折：眼尖的你应该会发现，我们的代码中没有包含 `@mixin` 关键字！这是怎么回事？其实，我们使用了另一个特性：`@extend`。我们将在第\
  \ 3 章“创建嵌套样式”中详细讨论这一点，但现在，只需知道它的工作方式与混合宏类似，但可以生成更高效的代码即可。\n\n不过，如果你查看一下 `stinson.scss`\
  \ 文件，确实会看到使用中的 `@include` 关键字；它调用了一个基础滤镜混合宏，该混合宏被用于 CSSgram 库中的所有滤镜。然而，混合宏和 `@extend`\
  \ 关键字的工作方式存在一些关键区别；我们将在下一章探讨 `@extend` 的使用时，更详细地研究这一点。\n\n好吧，我们继续：创建或导入基础混合宏是编写更高效代码的绝佳方式，但有一个小小的限制。有时，你可能会遇到多个代码块本可由同一个混合宏处理，但所需的值却不同。通常我们可能会认为无能为力，但既然我们使用的是\
  \ Sass，那就有办法——是时候了解一下带参数混合宏了。\n\n## 向混合宏传递值\n\n到目前为止，我们已经探讨了如何创建和使用混合宏——这些宏非常适合包含可重用的静态规则组，但如果我们遇到本可以使用混合宏，却因值不完全相同而无法使用的情况，该怎么办呢？\n\
  \n有时我们或许可以微调值来达到目的，但这不太可能——更好的方法是使用带参数混合宏。它们的工作方式与标准混合宏非常相似，但有一个区别：不是包含一组静态值，而是可以向混合宏传递不同的值，并让\
  \ Sass 将其渲染为标准 CSS。\n\n带参数混合宏的语法非常相似——开头同样是 `@mixin` 关键字，但这次我们会在其中包含要传递给混合宏的值：\n\
  \n```\n@mixin button-bg($bg, $fg) {\n...值在混合宏中使用...\n}\n```\n\n在编译时，Sass 会将不同的值插入到混合宏中的占位符，并将其编译为有效的\
  \ CSS，以便在项目中使用。我们可以通过创建一个围绕普通按钮的演示来更详细地了解其工作原理——网站中经常使用不同的颜色，因此这非常适合使用混合宏。\n\n###\
  \ 创建带参数混合宏\n\n让我们开始创建演示：\n\n![../images/472539_1_En_2_Chapter/472539_1_En_2_Fig9_HTML.jpg](img/472539_1_En_2_Fig9_HTML.jpg)\n\
  \n**图 2-9** 使用带参数混合宏创建按钮\n\n1. 首先，我们将 `parametric` 文件夹的副本下载并解压到项目区域。\n2. 在你常用的文本编辑器中，创建一个新文档，然后添加以下几行代码——我们将为演示添加一些基础样式：\n\
  \n    ```\n    @mixin button-bg($bg, $fg) {\n    background: $bg;\n    color: $fg;\n\
  \    &:hover {\n    background:darken($bg,8%);\n    transition: all 0.3s ease ;\n\
  \    }\n    &:active {\n    background:darken($bg,30%);\n    }\n    }\n    @font-face\
  \ { font-family: 'pt_sansregular'; src: url('../font/pt_sansregular.woff') format('woff');\
  \ font-weight: normal; font-style: normal; }\n    body { font-family: 'pt_sansregular',\
  \ sans-serif; padding: 20px;}\n    h2 { text-align: center; }\n    p { margin: 0;\
  \ padding: 0; margin-bottom: 30px; width: 480px; margin-left: auto; margin-right:\
  \ auto;\n    ```\n\n3. 现在，我们需要添加将按钮放置到页面上的样式：\n\n    ```\n    .wrap { margin:0 auto;\
  \ width: 800px; text-align:center; }\n    .btn { text-decoration: none; padding:\
  \ 5px 10px; border-radius: 4px; font-size: 22px; }\n    ```\n\n4. 我们已经为按钮添加了基础样式，但要让它们看起来像样，我们需要提供一些颜色。以下规则将实现这一点：\n\
  \n    ```\n    .btn-antiquewhite { @include button-bg(#faebd7, #000); }\n    .btn-darkgrey\
  \ { @include button-bg(#a9a9a9, #000); }\n    .btn-gainsboro{ @include button-bg(#dcdcdc,\
  \ #000); }\n    .btn-slategrey { @include button-bg(#708090, #fff); }\n    ```\n\
  \n5. 将此文件保存为 `parametric.scss`，放在我们在步骤 1 中保存的 `parametric` 文件夹下的 `scss` 子文件夹中。\n\
  6. 接下来，打开一个终端会话，将工作目录切换到项目区域下的 `parametric` 文件夹。在提示符下，输入以下命令并按回车键：\n\n    ```\n\
  \    sass sass\\parametric.scss css\\parametric.css\n    ```\n\n7. 如果一切顺利，我们应该会在\
  \ `css` 文件夹中看到一个 `parametric.css` 文件（与之前的练习一样），以及一个源映射——预览结果将显示一系列样式化的按钮，如图 2-9\
  \ 所示。\n\n这个演示可能很简单，但它是说明使用带参数混合宏有效性的绝佳方式。我们使用相同的基础代码创建了四个不同的按钮，但传入了不同的值——让我们看看这在实践中是如何工作的。\n\
  \n### 剖析我们的代码\n\n那么，我们的演示是如何成功创建四个形状相同、但颜色各异的按钮的呢？使演示生效的诀窍在于这个混合宏：\n\n```\n@mixin\
  \ button-bg($bg, $fg) {\nbackground: $bg;\ncolor: $fg;\n&:hover {\nbackground:darken($bg,8%);\n\
  transition: all 0.3s ease;\n}\n&:active {\nbackground:darken($bg,30%);\n}\n}\n```\n\
  \n它本身不会做任何事情，但一旦我们在代码中调用它，它就会编译成每个按钮所需的样式。以第一次调用为例：\n\n```\n.btn-antiquewhite {\
  \ @include button-bg(#faebd7, #000); }\n```\n\n...我们看到传入的第一个值是 `#faebd7`；这代表一种米白色（或古董白）。传入混合宏的第二个值是黑色——这将用于设置按钮中文本的样式。\n\
  \n当我们查看悬停函数时，情况变得有趣起来——这里使用了几个新关键字。首先是 `&:` 的使用——这是对父选择器的引用，因此在编译后，它变成了 `.btn-antiquewhite:hover`。然后我们使用\
  \ `$bg` 变量（代表传入混合宏的第一个值）和 Sass 的 `darken()` 函数来生成两种新颜色：用于悬停状态的 `#f5d9b3` 和用于按钮激活状态的\
  \ `#e9a74f`。\n\n我们将在下一章中作为嵌套的一部分，重新讨论父选择器的引用。\n\n好吧，我们继续：我们差不多准备好开始学习 Sass 的新内容了，但在那之前，我们需要重新回顾一下本章前面提到的一个特性。管理\
  \ Sass 样式表可能会变得棘手，尤其是在它们变得越来越大时。问题在于，在它们变得过于庞大笨重之前，如何最好地管理它们呢？\n\n\n\n## 跨多个文件工作\n\
  \n在本章中，我们创建了简单的样式表——这些方法效果不错，但正如我们刚才提到的，如果它们变得过于庞大，就会引发真正的问题！\n\n幸运的是，我们可以利用 Sass\
  \ 的 `@import` 选项，将样式表拆分成更小、更易于管理的模块。这个功能在标准 CSS 中已经存在，但 Sass 扩展了其功能。我们在“使用预构建混合宏”演示中简单介绍过它的用法；快速提醒一下，我们可以创建任意数量的\
  \ Sass 文件，其中包含变量、混合宏等内容：\n\n```\n// _reset.scss\nhtml, body, ul, ol { margin:  0;\
  \ padding: 0; }\n```\n\n然后根据需要将它们导入到样式表中，如下例所示：\n\n```\n// base.scss\n@import 'reset';\n\
  body { font: 100% Helvetica, sans-serif; background-color: #efefef; }\n```\n\n请注意，在我们的\
  \ `base.scss` 示例文件中，我们没有指定文件扩展名？这些并非强制要求；Sass 会查找以 `.sass`（旧格式）或 `.scss`（当前格式）结尾的文件，并进行相应导入。在这种情况下，我们的代码示例将编译为：\n\
  \n```\nhtml, body, ul, ol { margin: 0; padding: 0; }\nbody { font: 100% Helvetica,\
  \ sans-serif; background-color: #efefef; }\n```\n\n这为我们提供了一个绝佳的理由，将样式分组到单独的文件中，例如变量、字体混合宏、重置样式等——然后我们可以根据需要将它们导入到项目中。\n\
  \n要了解有关导入的更多信息，请参考 Dart Sass 网站上的文档：[`http://sass-lang.com/documentation/file.SASS_REFERENCE.html#import`](http://sass-lang.com/documentation/file.SASS_REFERENCE.html#import)。\n\
  \n在下一个演示中，我们将通过将之前的按钮演示转换为使用导入文件来验证这一点——您将看到切换起来是多么简单！\n\n### 导入文件\n\n让我们开始更新之前的演示：\n\
  \n![../images/472539_1_En_2_Chapter/472539_1_En_2_Fig10_HTML.jpg](img/472539_1_En_2_Fig10_HTML.jpg)\n\
  \n图 2-10 – 我们（更新后的）样式化按钮\n\n1.  我们首先下载并解压 `import` 文件夹的副本，并将其保存到我们的项目区域。\n\n2. \
  \ 我们需要从主 Sass 文件中提取混合宏，并将其移动到一个新文件中——为此，请继续创建一个名为 `mixins.scss` 的新文件；将其存储在 `import`\
  \ 文件夹下的 `scss` 子文件夹中。暂时保持打开状态，因为我们将在下一步中使用它。\n\n3.  在文本编辑器中打开 `importfile.scss`，然后将第\
  \ 1 到 11 行复制并粘贴到 `mixins.scss` 中。保存文件并关闭它。\n\n4.  回到 `importfile.scss`，然后删除第 1 到\
  \ 11 行。添加以下代码行（如高亮所示）：\n\n    ```\n    @import \"mixins\";\n    @font-face {\n \
  \   font-family: 'pt_sansregular';\n    src: url('../font/pt_sansregular.woff')\
  \ format('woff');\n    ```\n\n5.  保存 `importfile.scss` 并关闭它——我们现在可以编译该文件以生成样式表。\n\
  \n6.  接下来，启动一个终端会话，并将工作文件夹切换到项目区域下的 `import` 文件夹。在提示符处，键入以下命令并按 Enter：\n\n    ```\n\
  \    sass sass\\importfile.scss css\\importfile.css\n    ```\n\n7.  如果一切顺利，我们将在\
  \ `css` 文件夹中看到 `importfile.css` 文件出现（与之前的练习方式相同），以及一个源映射——预览结果将显示与之前相同的样式化按钮集，如图\
  \ 2-10 所示。\n\n这是改进样式表管理的一种简单方法——但诀窍在于学习如何最好地将文件拆分成更小的文件，这样我们就不会不必要地导入文件！关于导入文件，有几个有用的提示需要我们了解，所以让我们更详细地看看它们。\n\
  \n### 探索代码如何工作\n\n尽管我们对代码做了一些更改，但这个相对简单的更改可能成为真正的救星！以 WordPress 等 CMS 应用程序的标准样式表为例——其样式表大约有\
  \ 4500 多行，因此能够将样式拆分成更小的文件是一个真正的福音。\n\n聚焦我们的演示，我们已将现有的 `button-bg` 混合宏移动到一个新文件中，并将其从原始主文件中删除。主文件中的原始行被一个适当命名的\
  \ `@import` 语句替换，该语句在编译期间调用该文件。然后 Sass 将内容合并到一个文件中，并在编译过程结束时生成一个完整的样式表。如果我们愿意，我们可以验证代码确实来自两个独立的文件，如图\
  \ 2-11 所示。\n\n![../images/472539_1_En_2_Chapter/472539_1_En_2_Fig11_HTML.jpg](img/472539_1_En_2_Fig11_HTML.jpg)\n\
  \n图 2-11 – 证明我们的混合宏文件正在被使用……\n\n然而，这确实引发了一些关于管理导入文件的重要问题——前面提到的 WordPress 文件不是一个长样式表，而是由多个导入的文件组成。这意味着我们可以用一个文件存储变量，另一个文件处理页眉，第三个文件处理文章，也许第四个文件处理响应式媒体查询，等等。真正的诀窍是确保我们在每个文件中存储正确的内容，以免导入那些又会导入其他文件的文件——如果我们不小心，这可能会变得非常混乱！\n\
  \n此外，在某些情况下，导入的文件不会编译为 Sass 文件，而是编译为 CSS 文件——这些情况包括：\n\n*   如果文件扩展名是 `.css`\n* \
  \  如果文件名以 `http://` 开头\n*   如果文件名是一个 `url()`\n*   如果 `@import` 包含任何媒体查询\n\n只要扩展名以\
  \ `.scss`（或 `.sass`）结尾，Sass 就会在编译过程中尝试将该文件导入到主样式表中。\n\n### 总结\n\n呼——这是一次关于 Sass\
  \ 变量和混合宏的快速浏览之旅！我们在本章中涵盖了一些有用的关键主题，所以让我们花点时间回顾一下我们学到的内容。\n\n我们通过首先了解创建变量开启了 Sass\
  \ 世界的旅程；我们介绍了这些变量在实现时如何非常有用，特别是在处理颜色等值时。我们探讨了在选择名称时多加注意的好处，这样如果需要进行更改，就可以减少这些更改对代码的影响。\n\
  \n接下来，我们简要探讨了添加注释——我们看到这些注释主要与标准 CSS 类似，但在编译 Sass 代码时存在一些差异。\n\n然后，我们学习了混合宏——我们从创建一个基本的混合宏开始，然后学习了如何整合他人创建的混合宏，并研究了那些可以根据传递给混合宏的值生成不同代码的混合宏。最后，我们通过重新审视将独立文件导入到\
  \ Sass 开发中的主题来结束本章，以便我们能够在开发过程中更好地管理代码。\n\n我们不会停留太久——我们还有很多内容要覆盖！我们已经创建了单条规则，但经常会出现我们创建的某些规则部分重复的情况（因为它们涉及相同的元素、类或选择器\
  \ ID）。这可能会使样式开发变得重复——如果我们能够嵌套样式，或者更高效地重用现有样式呢？我们可以——您将在下一章中学习到开始所需的所有知识。\n\n\n\n"
- "# 3. 创建嵌套样式\n\n如果你花时间编写过 CSS 样式，我毫不怀疑你迟早会遇到代码中包含多层级选择器或类的情况。这是什么意思呢？好吧，让我来解释一下。\n\
  \n以导航栏为例。导航栏已经存在多年——它是网站的基本组成部分，尽管我们决定如何美化它的方式在不同网站上会有所差异。然而，其基本原理是使用可以多层级嵌套的无序列表：\n\
  \n```\n标题 1\n\n测试链接\n测试链接\n测试链接\n测试链接\n\n标题 2\n\n标题 3\n\n测试链接\n测试链接\n测试链接\n测试链接\n\
  ```\n\n诚然，我们的例子有点过于简单，但希望你明白了其中的意思！要为我们的示例添加样式，我们会使用以下类：\n\n```\nnav {...}\nnav\
  \ li a {...}\nnav li ul {...}\nnav li ul li a {...}\n```\n\n注意到每个样式之间的相似之处了吗？比如说，一些元素名称是不是重复出现了……？\n\
  \n我们使用的元素名称相当简短，但如果我们决定引用更长的类名（例如 `ul.navigation li a.about ul li a`），那么我们的代码很快就会变得难以阅读。这会造成一个真正的问题——有没有更好的方法呢？值得庆幸的是，借助\
  \ Sass 的强大功能，我们确实有——让我向你介绍嵌套的概念。\n\n## 解析嵌套概念\n\n简单来说，当元素之间存在清晰的共性时，嵌套允许我们在其他样式中存储（或嵌套）样式。这意味着我们不必为每条规则完整写出类或选择器，而只需包含嵌套规则特有的部分。在编译时，Sass\
  \ 会通过引用父选择器或类，将每条声明转换为有效的规则。为了让你明白我的意思，让我们用我们的简单示例并将其转换为 Sass：\n\n```\nnav {\n...\n\
  li {\na {...}\nul {...}\nli a {...}\n}\n}\n```\n\n你看——这样读起来是不是更容易了？嵌套是一个很好的省时工具，因为它有助于减少我们重复相同选择器的次数；并且在阅读代码时，它也感觉更自然、更容易理解。\n\
  \n让我们付诸实践，创建——是的，你可能已经猜到接下来要做什么了：一个基本的导航！在开发 Sass 时，任何时候都可以使用嵌套——只要我们有多个引用相同父元素或类的样式，就可以应用嵌套。巧合的是，导航非常适合嵌套，所以让我们深入探讨，看看它在实践中是如何运作的。\n\
  \n### 创建一个简单的菜单栏\n\n让我们开始创建我们的演示：\n\n![../images/472539_1_En_3_Chapter/472539_1_En_3_Fig1_HTML.jpg](img/472539_1_En_3_Fig1_HTML.jpg)\n\
  \n图 3-1\n\n使用嵌套创建基本菜单\n\n1. 我们首先从本书附带的代码下载中下载并解压 `nesting` 文件夹的副本——将其保存到我们的项目区域。\n\
  \n2. 接下来，启动你的文本编辑器——我们将添加演示所需的样式。\n\n3. 我们将分块添加所需的代码——继续为我们的演示添加以下基本样式：\n\n    ```\n\
  \    @font-face {\n    font-family: 'pt_sansregular';\n    src: url('../font/pt_sansregular.woff')\
  \ format('woff');\n    font-weight: normal;\n    font-style: normal;\n    }\n  \
  \  body {\n    font-family: 'pt_sansregular', sans-serif;\n    padding: 20px;\n\
  \    }\n    h1 {\n    font-size: 20px;\n    }\n    ```\n\n4. 我们演示的核心是我们正在创建的导航栏——为此，在前面的\
  \ `h1` 标签下方添加以下样式规则，并在该标签后留一行空行：\n\n    ```\n    nav {\n    width: 600px;\n    }\n\
  \    ```\n\n5. 接下来，我们需要为构成导航的无序列表添加样式规则——为此，在 `width: 600px` 声明后面留一个空行，然后添加：\n\n\
  \    ```\n    ul {\n    list-style: none;\n    margin: 0 3%;\n    padding: 0;\n\
  \    }\n    ```\n\n6. 有了无序列表容器之后，我们现在可以设置每个菜单项的样式——为此，在上一步的右花括号后留一个空行，然后添加：\n\n\
  \    ```\n    li {\n    display: inline-block;\n    padding-right: 10px;\n    }\n\
  \    ```\n\n7. 为了使我们的导航生效，我们需要为每个条目添加链接——继续在第 6 步的右花括号后留一个空行，然后添加这些样式：\n\n    ```\n\
  \    a {\n    background-color: #faebd7;\n    border: 1px solid #ccc;\n    color:\
  \ #666;\n    display: block;\n    padding: 6px 12px;\n    text-decoration: none;\n\
  \    font-size: 32px;\n    }\n    a:hover, a:focus{\n    background-color: darken(#faebd7,\
  \ 20%);\n    }\n    a:active {\n    background-color: #666;\n    border-color: #666;\n\
  \    color: #efefef;\n    }\n    ```\n\n8. 将文件另存为 `scss` 文件夹中的 `nesting.scss`。\n\
  \n9. 接下来，启动终端会话，并将工作文件夹更改为项目区域下的 `nesting` 文件夹。\n\n10. 在提示符下，键入以下命令并按回车：\n\n   \
  \ ```\n    sass sass\\nesting.scss css\\nesting.css\n    ```\n\n11. 如果一切顺利，我们应该会在\
  \ `css` 文件夹中看到一个 `nesting.css` 文件，以及一个源映射文件。\n\n12. 如果在浏览器中预览结果，我们会看到一个包含样式化元素的简单框，如图\
  \ 3-1 所示：\n\n看到嵌套代码有多么简单了吗？嵌套的基本原理很直接，但应用嵌套的真正考验在于确保使用正确的父选择器，以便任何嵌套的样式名称尽可能短，并将重复降到最低。为了让你明白我的意思，让我们花一点时间更详细地探讨我们的演示代码，这样你就可以看到我们是如何得出代码中所用结构的。\n\
  \n### 解析我们的代码\n\n好吧，我承认，上一段开头的说法可能有点武断，但实际上，嵌套并不是一种难以理解的技术。技巧在于确保我们选择正确的选择器来构成嵌套的基础。让我们更详细地分析一下我们的例子：\n\
  \n我们开始这个演示时设置了一些样式来辅助演示的呈现——演示的核心从第 17 行的初始 `<nav>` 声明开始。我们需要应用于 `<nav>` 元素的任何样式都直接位于其下；子规则的样式则简单地缩进在这个初始声明下方。在我们的案例中，这意味着\
  \ `ul`、`li` 和 `a`（及其伪类）都只缩进到第一级。它们会变成 `nav ul`、`nav li`、`nav a` 等等——Sass 会理解 `nav`\
  \ 在这个实例中是公共元素，因此充当父元素。\n\n\n\n## 处理更复杂的示例\n\n上一个示例中的代码位于第一层级（或缩进）—— 在许多情况下，这对于你的项目可能适用，但如果我们需要深入一层（因为我们有更多子类需要处理）该怎么办呢？\n\
  \n我们可以使用 Sass 进行更深层次的嵌套，不过有一点需要提醒——一个好的经验法则是嵌套层级不要超过两到三层。更深层的嵌套在技术上是可行的，但我不推荐这样做——这样会导致\
  \ CSS 的特指度（specificity）过深，这也是一个明显的信号，说明我们需要重新审视样式类名的结构。\n\n假设我们将嵌套控制在合理层级内，以下是一个嵌套到三层代码块的示例：\n\
  \n```\n.sidebar {\n  position: fixed;\n  height: 100%;\n  &-list {\n    background-color:\
  \ white;\n    &-link {\n      text-decoration: none;\n    }\n  }\n}\n```\n\n在这个例子中，公共元素是\
  \ `.sidebar`；所有三个样式都使用了这个名称。不过，我注意到其中两个名称的开头有一个 & 符号和连字符——这代表什么呢？这些是占位符——在这种情况下，第二层和第三层的类名将分别被编译为\
  \ `.sidebar-list` 和 `.sidebar-list-link`。\n\n关于这种上下文中的占位符，我们将在本章稍后的“引用父选择器”部分进行更详细的介绍。\n\
  \n好了——借用一句常见的开车用语，是时候变道了：嵌套是一项值得学习的好技术，但它并非没有一些古怪之处。让我们看几个例子来理解我的意思——现在，你在刚开始使用\
  \ Sass 时可能还不会遇到它们，但迟早它们会露出它们丑陋的一面，可以这么说……\n\n## 探索嵌套的陷阱\n\n再看一下上一节中的代码示例——我们在上一节中提到，它会创建三条规则，而图\
  \ 3-2 确实证实了这一点。\n\n![../images/472539_1_En_3_Chapter/472539_1_En_3_Fig2_HTML.jpg](img/472539_1_En_3_Fig2_HTML.jpg)\n\
  \n图 3-2\n\n我们的编译示例，使用 Sassmeister\n\n我们的代码已编译为有效的 CSS，从嵌套三层深的代码中产出了三条规则示例。这效果很好，但可能会让我们产生一种错误的安全感！如果我们不小心，使用嵌套既有优点也有缺点，所以让我们先看看缺点，因为这些最容易解释。\n\
  \n### 嵌套是坏事吗？\n\n假设我们使用以下代码：\n\n```\n\nSome text\n\n```\n\n这会生成特指度极高的 CSS 代码——要引用此代码块中的\
  \ `a` 标签，我们必须使用 `main.one.two.a` 作为 CSS 规则：\n\n```\nmain {\n  .one {\n    .two {\n\
  \      a {color: red}\n    }\n  }\n}\n```\n\n这种级别的特指度不推荐使用，应该避免，因为它会使我们的 CSS 与 HTML\
  \ 结构紧密耦合。要覆盖这段代码，我们就得创建更特指的 CSS 来修改它；这只会让原始问题雪上加霜！更麻烦的是，如果你使用 Sass 嵌套了这段代码，它看起来就像是你仅仅给一个简单的链接设置了样式。而现实是，Sass\
  \ 只是隐藏了问题，在编译期间仍然会生成同样特指度极高的代码。\n\n归根结底，如果谨慎使用，嵌套是一项很棒的功能——作为一个通用经验法则，我建议嵌套层数不要超过三层。这样能保持代码简单易读，并且不会生成特指度极高的代码，从而避免在后续开发中造成问题。\n\
  \n### 探索嵌套的优势\n\n哎——经过刚才的警告，有人可能会认为嵌套没那么好，这也是情有可原的！但事实是，就像任何被负责任地使用的工具一样，它也能对你的代码产生非常积极的影响。\n\
  \n在这种情况，使用嵌套的主要优势在于生成更易读、更易维护的代码。嵌套允许我们将所有继承自父选择器的子选择器分组在一起；同时还能节省打字量，因为我们不必在每个子选择器前重复编写父选择器。当然，诀窍在于确保我们不会嵌套得太深——极端嵌套可能很诱人，但请记住：嵌套并不能修复糟糕的代码——如果你输入的是垃圾，那么你只会得到垃圾输出！\n\
  \n好了——让我们快速推进：如果使用 Sass 嵌套代码，你可能会认为这同样适用于伪选择器，比如 `:hover` 和 `:focus`，对吗？不幸的是，不行——如果你尝试以这种方式嵌套它们，将会抛出错误。幸运的是，有一个解决方案——我们需要调整在代码嵌套时引用它们的方式。让我们更详细地了解一下具体内容。\n\
  \n### 引用父选择器\n\n在嵌套 Sass 语句时，很多语句可以放在代码中已有重复项的位置。但是，你无疑会在代码中使用某种伪选择器——那么这些伪选择器怎么办呢？\n\
  \n好吧，Sass 也可以嵌套它们——我们不是像普通语句那样简单地缩进它们，而是需要在冒号前立即放置一个占位符字符。以图 3-3 中显示的代码片段为例。\n\n\
  ![../images/472539_1_En_3_Chapter/472539_1_En_3_Fig3_HTML.jpg](img/472539_1_En_3_Fig3_HTML.jpg)\n\
  \n图 3-3\n\n更新前的代码……\n\n这里完整写出了三种样式（`a`、`a:hover` 和 `a:focus`）——这是完全有效的代码，但有点浪费空间，并且重复了选择器名称。相反，我们可以简单地嵌套每个样式——为了向你展示其工作原理，我们可以通过一个快速演示来更新上一个菜单练习中的代码。\n\
  \n\n\n### 引用父选择器\n\n让我们看看修改代码是多么简单：\n\n![../images/472539_1_En_3_Chapter/472539_1_En_3_Fig4_HTML.jpg](img/472539_1_En_3_Fig4_HTML.jpg)\n\
  \n图 3-4 – 更新导航演示\n\n1.  首先，从本书的代码下载中下载并解压 `parent` 文件夹的副本，并将其保存到我们的项目文件夹中。\n\n2.\
  \  接着，打开 `parent.scss` 文件，在第 29 行附近找到以下代码行：\n\n    ```\n    a {\n    background-color:\
  \ #faebd7;\n    border: 1px solid #ccc;\n    color: #666;\n    ```\n\n3.  继续编辑 `a`\
  \ 规则——我们将 `hover` 和 `focus` 声明嵌套在其中，如粗体所示：\n\n    ```\n    a {\n    background-color:\
  \ #faebd7;\n    border: 1px solid #ccc;\n    color: #666;\n    display: block;\n\
  \    padding: 6px 12px;\n    text-decoration: none;\n    font-size: 32px;\n    &:hover,\
  \ &:focus {\n    background-color: darken(#faebd7, 20%);\n    }\n    &:active{ background-color:\
  \ #666; border-color: #666; color: #efefef;   }\n    }\n    ```\n\n4.  接着，继续删除独立的\
  \ `active`、`hover` 和 `focus` 规则——我们应该只剩下嵌套在父 `a` 规则中的那些规则，并且最后一行代码将是 `nav` 规则的右花括号。\n\
  \n5.  将文件保存为 `scss` 文件夹中的 `parent.scss`。\n\n6.  接下来，启动一个终端会话，并将工作文件夹切换到项目目录下的 `parent`\
  \ 文件夹。\n\n7.  在提示符下，输入以下命令并按 Enter：\n\n    ```\n    sass sass\\parent.scss css\\\
  parent.css\n    ```\n\n8.  如果一切顺利，我们应该会在 `css` 文件夹中看到一个 `parent.css` 文件，以及一个源映射文件。\n\
  \n9.  尝试在浏览器中预览结果——如果一切正常，它会显示一个包含样式化元素的简单框，如图 3-4 所示。\n\n在嵌套时，这是一个需要理解的重要概念——如果处理不当或遗漏了与号，最好的情况是代码被破坏（但不太可能显示任何错误），最坏的情况则是编译失败。\n\
  \n关键是要记住包含占位符——我们可能无法立即获得正确的嵌套层级，但有了占位符，代码至少应该能正确编译！同时，让我们更详细地快速查看一下代码——你会看到它与之前的原则相同，只是新增了与号作为占位符。\n\
  \n### 深入探索我们的代码\n\n如果我们运行这个演示的完成版本，而没有看到我们所做的更改，那么你可能会认为它看起来与原始版本没有区别，这也是情有可原的！别担心——这是有意为之：这表明尽管我们对一些使用的类进行了嵌套修改，但测试显示我们的演示仍然能正确运行。\n\
  \n那么，我们更改了什么呢？实际上，这次的更改很小——我们将 `hover`、`focus` 和 `active` 伪选择器移到了父 `a` 规则内部。在每个实例中，我们都插入了一个与号，告诉\
  \ Sass 在编译此规则时引用父类；这会将其转换为与我们在原始嵌套演示中使用的相同有效的 CSS。\n\n## 应用 `@extend` 指令\n\n在开发过程中，经常会遇到这样的情况：我们决定先创建一个基类来样式化某个元素，然后添加后续类来涵盖基类的变体。设计警告消息就是一个很好的例子——我们的基类将包含创建外壳所需的样式，而变体（在样式、图标方面）则通过继承自基类的后续类来覆盖。\n\
  \n问题是，这种方法并非没有问题——这意味着我们至少要使用两个类，而不仅仅是一个；这会造成维护负担，并且在以后调试时可能会很棘手。问题是：我们能否解决这个问题？\n\
  \n当然可以——让我向你介绍 `extend` 关键字！该关键字的语法如下：\n\n```\n@extend .类名;\n```\n\n……它允许类与其他类共享一组属性。要使用它，我们需要在\
  \ CSS 规则中将扩展类的名称指定为声明，如下所示：\n\n```\n.类名 {\nborder: 1px solid black;\nfont-weight:\
  \ bold;\n}\n.foo {\n@extend .类名;\ncolor: #fcc;\n...\n}\n```\n\n在这个例子中，我们将得到两个类——`.foo`\
  \ 和 `.类名`——它们共享相同的 `font-weight` 和 `border` 属性。`.foo` 类还会有一个单独的 `color` 属性声明。\n\n\
  ### 通过示例实践\n\n如果我们想减少对多个类的依赖，使用 `@extend` 是非常完美的选择；我们可以创建一个规则，让其他规则在编译期间继承它。\n\n\
  为了理解我的意思，请看这段示例代码：\n\n```\n.error {\nborder: 1px #f00;\nbackground-color: #fdd;\n\
  }\n.seriousError {\n@extend .error;\nborder-width: 3px;\n}\n```\n\n当编译时（使用诸如 Sassmeister\
  \ 之类的工具），我们得到如图 3-5 所示的 CSS。\n\n![../images/472539_1_En_3_Chapter/472539_1_En_3_Fig5_HTML.jpg](img/472539_1_En_3_Fig5_HTML.jpg)\n\
  \n图 3-5 – 编译 `@extend` 的结果\n\n看到第二个规则（`.seriousError`）是如何继承了第一个规则中定义的属性，同时又保留了自己规则中指定的属性了吗？这对于样式化共享相同属性的元素非常完美——我们为基类声明编写一个规则，然后在每个需要继承此规则并指定该规则特有附加属性的类中使用\
  \ `@extend`。\n\n这个特性可能有点难以理解其全部用途，所以让我们从一个演示开始，更详细地展示它的工作原理。\n\n### 一个实际示例\n\n回想一下——还有人记得宝丽来相机吗？是的，在数码图像出现之前，宝丽来风靡一时：无需等待胶卷冲洗，拍摄后只需几分钟就能得到最终照片！\n\
  \n宝丽来相机可能没有以前那么流行了，但这种效果依然存在——重现宝丽来效果（图像外观，而非显影过程！）非常容易。让我们看看如何利用 Sass 的强大功能及其 `@extend`\
  \ 函数来实现这一点。\n\n\n\n### 扩展 Sass 类\n\n让我们开始编写演示代码：\n\n![../images/472539_1_En_3_Chapter/472539_1_En_3_Fig6_HTML.jpg](img/472539_1_En_3_Fig6_HTML.jpg)\n\
  \n**图 3-6**\n\n使用 `@extend` 显示图片\n\n1. 首先，从本书附带的代码下载中下载并解压 `extend` 文件夹——继续将该文件夹保存到我们的项目文件夹中。\n\
  \n2. 接下来，打开你的文本编辑器——我们有一大堆样式要添加到演示中！我们将逐块添加它们，首先从演示的一些基础样式开始：\n\n    ```\n    %imgeffect\
  \ {\n    height: 20%;\n    width: 47%;\n    bottom: 30px;\n    right: 12px;\n  \
  \  box-shadow: 0 33.6px 32px rgba(0,0,0,0.4);\n    }\n    @font-face {\n    font-family:\
  \ 'pt_sansregular';\n    src: url('../font/pt_sansregular.woff') format('woff');\n\
  \    font-weight: normal;\n    font-style: normal;\n    }\n    * {\n    box-sizing:\
  \ border-box;\n    }\n    body {\n    font-family: 'pt_sansregular', sans-serif;\n\
  \    margin: 32px;\n    }\n    ```\n\n3. 接下来这个代码块为每张宝丽来效果图片添加了一组通用样式：\n\n    ```\n\
  \    .polaroid {\n    background: #fff;\n    padding: 16px;\n    box-shadow: 0 3.2px\
  \ 19.2px rgba(0,0,0,0.2);\n    }\n    .polaroid > img {\n    max-width: 100%;\n\
  \    height: auto;\n    }\n    .caption {\n    font-size: 28px;\n    text-align:\
  \ center;\n    line-height: 32px;\n    }\n    ```\n\n4. 现在我们需要为每张应用了宝丽来效果的图片设置样式——这将添加初始灰度效果，并旋转图片使其偏离水平位置：\n\
  \n    ```\n    .item {\n    width: 30%;\n    display: inline-block;\n    filter:\
  \ grayscale(100%);\n    }\n    .item .polaroid:before {\n    content: \";\n    position:\
  \ absolute;\n    z-index: -1;\n    transition: all 0.35s;\n    }\n    .item:nth-of-type(4n+1)\
  \ {\n    transform: scale(0.8, 0.8) rotate(5deg);\n    }\n    .item:nth-of-type(4n+1)\
  \ .polaroid:before {\n    @extend %imgeffect;\n    transform: rotate(6deg);\n  \
  \  }\n    .item:nth-of-type(4n+2) {\n    transform: scale(0.8, 0.8) rotate(-5deg);\n\
  \    }\n    .item:nth-of-type(4n+2) .polaroid:before {\n    @extend %imgeffect;\n\
  \    transform: rotate(-6deg);\n    }\n    .item:nth-of-type(4n+3) {\n    transform:\
  \ scale(0.8, 0.8) rotate(-3deg);\n    }\n    .item:nth-of-type(4n+3) .polaroid:before\
  \ {\n    @extend %imgeffect;\n    transform: rotate(-4deg);\n    }\n    ```\n\n\
  5. 最后一组规则在我们将鼠标悬停在每张图片上时应用旋转和缩放效果；同时我们还调整了尺寸和阴影效果：\n\n    ```\n    .item:hover {\n\
  \    filter: none;\n    transform: scale(1, 1) rotate(0deg);\n    transition: all\
  \ 0.35s;\n    }\n    .item:hover .polaroid:before {\n    z-index: -1;\n    transform:\
  \ rotate(0deg);\n    height: 90%;\n    width: 90%;\n    bottom: 0%;\n    right:\
  \ 5%;\n    box-shadow: 0 16px 48px rgba(0,0,0,0.2);\n    transition: all 0.35s;\n\
  \    }\n    ```\n\n6. 将文件保存为 `scss` 文件夹中的 `extend.scss`。\n\n7. 接下来，启动一个终端会话，并将工作文件夹切换到项目区域下的\
  \ `extend` 文件夹。\n\n8. 在提示符下，输入以下命令并按回车：\n\n    ```\n    sass sass\\extend.scss css\\\
  extend.css\n    ```\n\n9. 如果一切顺利，我们应该会在 `css` 文件夹中看到一个 `extend.css` 文件，以及一个源映射文件——预览结果将显示三张图片被样式化为宝丽来相片，中间那张处于悬停中态（图\
  \ 3-6）。\n\n这个演示算是一次回忆之旅——这种 CSS 样式效果已经存在好几年了。不过，这个故事里还有一点小波折：在我们发现它是什么之前，先来更详细地了解一下我们的代码是如何工作的。\n\
  \n### 详细剖析代码\n\n我们这个宝丽来风格演示中的代码乍看之下似乎有不少样式代码，但实际上，大部分代码都用于为每张图片设置样式。不过，有两个关键声明值得我们探索，它们使用了\
  \ Sass 并让我们的演示栩栩如生。它们分别是扩展块：\n\n```\n%imgeffect {\nheight: 20%;\nwidth: 47%;\nbottom:\
  \ 30px;\nright: 12px;\nbox-shadow: 0 33.6px 32px rgba(0,0,0,0.4);\n}\n```\n\n...以及我们使用这个扩展的三个声明：\n\
  \n```\n.item:nth-of-type(4n+1) .polaroid:before {\n@extend %imgeffect;\ntransform:\
  \ rotate(6deg);\n}\n.item:nth-of-type(4n+2) .polaroid:before {\n@extend %imgeffect;\n\
  transform: rotate(-6deg);\n}\n.item:nth-of-type(4n+3) .polaroid:before {\n@extend\
  \ %imgeffect;\ntransform: rotate(-4deg);\n}\n```\n\n如果我们将它编译成有效的 CSS，最终会得到如图 3-7\
  \ 所示的代码。\n\n![../images/472539_1_En_3_Chapter/472539_1_En_3_Fig7_HTML.jpg](img/472539_1_En_3_Fig7_HTML.jpg)\n\
  \n**图 3-7**\n\n从 `@extend` 演示中编译代码\n\n在我们的演示中，我们在第 1 到第 7 行指定了初始扩展；它包含一组标准的 CSS\
  \ 属性，这些属性在每个宝丽来效果中都会用到。在定义三个 `.item:nth-of-type()` 声明时分别调用了这个扩展，每个声明对应一个宝丽来效果实例。图\
  \ 3-7 展示了在 Sassmeister 中编译的两个 `item:nth-of-type()` 声明实例的截图，以此展示其效果外观，我们确实可以看到在附加变体之前显示了通用类。\n\
  \n你可以使用 [Sassmeister.​com](http://sassmeister.com) 上的在线工具亲自尝试——我没有包含第三个实例，因为两个就足以展示使用扩展函数的效果了。\n\
  \n你们中的一些人可能已经注意到了本章前面提到的一点，我们讨论了基础类*和扩展类*都会出现。我并没有看到基础类的存在，尽管理论上它应该被显示——为什么没有呢？\n\
  \n\n\n### 使用 Extends 还是 Mixins？\n\n啊哈——这背后有充分的理由：我们有意阻止 Sass 显示它。但这不仅仅是隐藏代码那么简单——它与\
  \ extends 的工作方式、与 mixins 的相似性，以及在编写代码时选择正确函数的重要性密切相关。\n\n尽管 mixins 和 extends 非常相似，但有两个关键区别值得我们注意：\n\
  \n- `extend` 规则不接受参数——而 mixins 接受。\n- `extend` 规则可以合并选择器，而 mixins 则不能。\n\n简而言之，extends\
  \ 比 mixins 更高效，但它们在值的灵活性方面不如 mixins——我们无法像向 mixins 传递参数那样灵活地传递值。通过一个例子可以最好地说明这一点；以下是前面演示代码中重写为\
  \ mixin 的 Sass 部分：\n\n```scss\n@mixin imgeffect {\n  height: 20%;\n  width: 47%;\n\
  \  bottom: 30px;\n  right: 12px;\n  box-shadow: 0 33.6px 32px rgba(0,0,0,0.4);\n\
  }\n.item:nth-of-type(4n+1) .polaroid:before {\n  @include imgeffect;\n  transform:\
  \ rotate(6deg);\n}\n.item:nth-of-type(4n+2) .polaroid:before {\n  @include imgeffect;\n\
  \  transform: rotate(-6deg);\n}\n.item:nth-of-type(4n+3) .polaroid:before {\n  @include\
  \ imgeffect;\n  transform: rotate(-4deg);\n}\n```\n\n尝试将其放入 Sassmeister 会话中——请注意，虽然它可以正确编译（生成\
  \ 26 行代码），但其中包含大量重复内容？\n\n显然这并不理想——它能运行，但以这种方式编译代码很快就会给样式表增加大量不必要的臃肿，并拖慢网站速度。正因如此，我们需要谨慎选择使用\
  \ mixin 还是 extend——在选择使用时，还应考虑其他一些因素：\n\n- 由于 extends 不能接受参数，因此它们不如 mixins 灵活——它们最适合在多个元素之间复制相同的样式，并通过例外情况设置不同的属性。\n\
  - 在创建响应式媒体指令时不能使用 extends；这种情况下只能使用 mixins。\n- 当使用包含扩展代码的类时，我们随后指定的任何子类也会自动包含该扩展代码。如果不小心，这可能会产生一些奇怪的效果！\n\
  - 从更技术性的角度来说——许多人声称 extends 比 mixins 更快。然而，在现代服务器技术（如文件压缩）下，情况并非总是如此；事实上，mixins\
  \ 可能更有效，因为字符串会频繁重复，这更有利于压缩。\n\n那么——回到我们的代码：在我们的实例中，既可以使用 extend 也可以使用 mixin。我选择使用\
  \ extend 规则来说明它们的工作原理，但如果你启用了基于服务器的压缩（许多服务器都是如此），那么你可能会决定使用 mixin。归根结底，这都需要谨慎处理；具体采用\
  \ mixin 还是 extend，取决于代码的设置方式以及样式设置的层级数量。\n\n### 总结\n\n在 Sass 中嵌套和继承样式是一门关键课题——它的基础知识可能容易学习，但掌握它却需要真正的技巧！在本章中，我们了解了嵌套和\
  \ extend 规则的使用，现在让我们花点时间回顾一下所学内容。\n\n我们首先探讨了如何嵌套代码——我们理解了这有助于避免重复，并减少需要编写的代码量。紧接着，我们审视了嵌套代码时可能遇到的一些陷阱；同时，我们讨论了嵌套是否是一种不良实践，或者只是在使用时需要一定程度的谨慎。\n\
  \n接着，我们转而讨论了父选择器的使用；我们考察了这对于嵌套伪元素等情况的重要性。然后，我们深入研究了 `@extend` 指令的基础知识——包括通过一个详细的示例来进行实践，然后根据\
  \ Sass 中二者的相似性，权衡使用 extends 或 mixins 的利弊。\n\n好了——让我们继续：我们经常需要编写仅在满足条件后才会确定结果的代码。这在编写脚本时是一种非常常见的技术，但如果我们要创建样式呢？普通的\
  \ CSS 不允许这样做，因此样式必须静态地编写。但这种情况已经改变：是时候扭转局面，开始使用脚本技术来控制我们的 CSS 样式了……\n\n"
- "# 使用运算计算值\n\n使用 Sass 的关键优势之一是能够动态计算值——我指的不只是使用像百分比这样的值，而是使用加、减等运算符来计算值。\n\n是的，你没看错——使用数学运算！不过，在您退缩之前，这并没有看上去那么疯狂：我们可以在代码中编写诸如\
  \ `font: 10px/8px;` 这样的语句。由于 Sass 是 CSS 的扩展，它不仅支持这一点，而且将其提升到了一个全新的水平。不过，它的好处在于涉及的数学运算根本不必复杂——可以简单到将两个数字相加，或者对一个数字进行除法。\n\
  \n考虑到这一点，让我们来看看可以使用 Sass 执行的不同类型的运算，从一些基于数字的运算开始。\n\n## 基于数字的运算\n\n所有标准运算（如加法或除法）都受支持（包括关系运算符，如\
  \ `>=`）；这意味着我们可以编写如下声明：\n\n```scss\np {\n  $width: 780px;\n  width: $width/2;\n\
  }\n```\n\n……它将编译为：\n\n```scss\np { width: 390px; }\n```\n\n### 字符串内容的运算符\n\n在处理字符串时，运算符主要有两种用途：我们可以将文本拼接在一起，或者使用字符串插值执行内联计算。后者并不复杂——它要求我们将计算放在花括号内，并在前面加上一个\
  \ `#`，这告诉 Sass 计算总数，如以下示例所示：\n\n```scss\np:before {\n  content: \"我吃了 #{5 + 10}\
  \ 个大型\" + 苹果;\n}\n```\n\n### 基于布尔值的运算符\n\n有时，根据条件为真或假来包含声明可能会很有用；如果条件为真，则包含该声明，否则将省略它。我们的第三种运算类型允许使用布尔值来控制显示的内容：\n\
  \n```scss\np:before {\n  $count: 5;\n  $yes: 1;\n  @if ($count > 3 and $yes == 1)\
  \ {\n    content: \"我吃了 #{5 + 10} 个大型\" + 苹果;\n  }\n}\n```\n\n编译后，我们得到以下结果：\n\n\
  ```scss\np:before {\n  content: \"我吃了 15 个大型苹果\";\n}\n```\n\n\n\n## 基于列表的运算符\n\n\
  最后一类涵盖了我们可以对 Sass 中使用的数据列表执行的所有操作类型。列表是将我们可能在代码中稍后使用的相似属性（如颜色或边框类型）组合在一起的有效方法，以便我们可以控制代码中使用的内容：\n\
  \n```\n$colors: red green blue;\n$padding: 10px, 20px, 30px;\n$border: solid, dotted;\n\
  ```\n\n定义列表后，我们可以使用 `nth` 等函数从该列表中选择一个项目，在本例中选择 `green`：\n\n```\ndiv {\n  background:\
  \ nth($colours, 2);\n  padding: nth($padding, 2); // \"20px\"\n  border: 2px nth($border,\
  \ 2);\n}\n```\n\n编译后，这段代码会产生以下结果：\n\n```\ndiv {\n  background: green;\n  padding:\
  \ 20px;\n  border: 2px dotted;\n}\n```\n\n列表项可以使用逗号或空格分隔，但如果您使用后者，则属性应用引号括起来，并在代码中使用\
  \ `unquote()` 函数来移除引号。\n\n我们只是浅尝辄止地了解了使用 Sass 可以进行的各种不同类型的操作——主要网站记录了所有可用的函数，网址为\
  \ [`http://sass-lang.com/documentation/Sass/Script/Functions.html`](http://sass-lang.com/documentation/Sass/Script/Functions.html)。\n\
  \n好了——我们继续：我们使用的示例有些理论化；要真正了解它们的工作原理，我们应该创建一些能展示其工作方式的东西。一个很好的例子是创建一个基于网格的页面模板，所以事不宜迟，让我们深入探究并看看它如何在实践中运作。\n\
  \n### 付诸实践\n\n在下一个演示中，我们将利用 Sass 的操作来创建一个基本的页面骨架，其中主内容块等元素的宽度值将自动为我们计算出来。在这个演示中，我们将额外使用一种资源，即一种手写字体——Homemade\
  \ Apple，它可以从 [`https://www.fontsquirrel.com/fonts/homemade-apple`](https://www.fontsquirrel.com/fonts/homemade-apple)\
  \ 以 WOFF 格式下载（该格式应覆盖大多数现代浏览器）。\n\n## 创建框架\n\n让我们开始构建我们的演示：\n\n![../images/472539_1_En_4_Chapter/472539_1_En_4_Fig1_HTML.jpg](img/472539_1_En_4_Fig1_HTML.jpg)\n\
  \n**图 4-1** 创建页面骨架模板\n\n1. 首先，从本书附带的代码下载中提取 `skeleton` 文件夹的副本——继续并将其保存到我们项目文件夹的根目录。\n\
  \n2. 我们的演示包含所有相关标记，但如果现在运行它，看起来会很糟糕！此时我们需要添加样式——为此，我们有相当多的规则要添加，让我们从站点中使用的字体和链接的一些基本样式开始：\n\
  \n```\n@font-face { font-family: 'pt_sansregular'; src: url('../font/pt_sansregular.woff')\
  \ format('woff'); font-weight: normal; font-style: normal; }\n@font-face { font-family:\
  \ 'homemade_appleregular'; src: url('../font/HomemadeApple-webfont.woff') format('woff');\
  \ font-weight: normal; font-style: normal; }\nbody { font-family: 'pt_sansregular',\
  \ sans-serif; margin: 32px; width: 900px; }\na {\n  text-decoration: none;\n  &:hover\
  \ {\n    color: #6db046;\n  }\n}\n#container {\n  width: 100%;\n  border: 1px solid\
  \ black;\n  min-height: 100px;\n  background-color: #f5f5f5;\n  > p > i {\n    padding-right:\
  \ 3px;\n  }\n}\n```\n\n3. 接下来是这个演示的关键——我们添加页面主体部分、页眉、页脚和侧边栏的样式：\n\n```\narticle[role=\"\
  main\"], header {\n  float: left;\n  width: 600px / 960px * 100%;\n  margin: 15px\
  \ 0px 15px 15px;\n  padding: 10px;\n}\narticle[role=\"main\"] {\n  min-height: 500px;\n\
  \  background-color: #fff;\n  padding: 15px;\n}\nheader {\n  height: 55px; padding:\
  \ 10px 10px 0 0px; margin: 15px 0 0 15px;\n  h2 {\n    font-family: 'homemade_appleregular';\
  \ font-size: 30px;\n    margin-top: 5px; color: #6db046;\n  }\n}\naside {\n  float:\
  \ right;\n  width: 200px / 960px * 100%;\n  margin: 100px 15px 15px 10px;\n  float:\
  \ left;\n  padding: 10px;\n  min-height: 200px;\n  background-color: #fff;\n  ul\
  \ {\n    padding-left: 25px;\n    h3 {\n      border-bottom: 1px solid green;\n\
  \      margin-left: -20px;\n    }\n  }\n}\nfooter { clear: both; background-color:\
  \ #6db046; padding: 10px; width: 880px; }\n```\n\n4. 我们现在需要添加一些细节的样式——接下来的三条规则分别涵盖了页面底部显示的图像、评论标签和发布日期：\n\
  \n```\nsection { margin-left: auto; margin-right: auto; width: 600px; }\n.details\
  \ { font-size: 14px; clear: both; padding-top: 5px; border-top: 1px solid #6db046;\
  \ }\n.date {\n  width: 250px / 960px * 100%;\n  font-size: 14px;\n  clear: both;\n\
  \  padding-top: 5px;\n  margin-left: 15px;\n  border-top: 1px solid #000;\n}\n```\n\
  \n5. 在页面底部的 `<section>` 块中，我们添加了图像——这些图像需要使用以下样式进行调整：\n\n```\n.subimage { width:\
  \ 275px / 960px * 100%; border: 1px solid brown; height: 175px; clear: both; display:\
  \ inline-block; margin-right: 15px; }\nimg { width: 100%; height: auto; }\n```\n\
  \n6. 最后但同样重要的是，我们将添加最后一条规则来处理每个图像标签的样式：\n\n```\n.tileText { width: 100%; height:\
  \ 30px; padding: 0px 5px 0px 5px; display: block; font-weight: bold; }\n```\n\n\
  7. 将文件保存为 `scss` 文件夹中的 `skeleton.scss`。\n\n8. 接下来，启动一个终端会话，并将工作文件夹更改为我们项目区域下的 `skeleton`\
  \ 文件夹。\n\n9. 在提示符下，键入以下命令并按回车：\n\n```\nsass sass\\skeleton.scss css\\skeleton.css\n\
  ```\n\n10. 如果一切顺利，我们应该会看到 `css` 文件夹中出现一个 `skeleton.css` 文件，以及一个源代码映射——预览结果将显示一个包含样式化元素的简单模板页面，如图\
  \ 4-1 所示。\n\n我们的演示展示了使用 Sass 创建模板是多么容易——事实上，我们在此使用的基本原则可以轻松地构成当今许多可用网格系统的基础。然而，有几个关键点需要注意；在介绍它们之前，让我们更详细地看看我们创建的代码。\n\
  \n\n\n### 理解发生了什么\n\n虽然我们使用的代码看起来很冗长，但实际上，大部分代码都用于给字体大小或颜色等已有元素设置样式。不过，我们确实使用了标准的\
  \ Sass 嵌套来在样式表中布局每条规则——Sass 在编译过程中会将其重新编译为有效的 CSS。\n\n不过，我们感兴趣的关键部分位于第 40、65、101\
  \ 和 110 行附近，那里有类似下面的代码：\n\n```\nwidth: 200px / 960px * 100%;\n```\n\nSass 会在编译期间自动计算这个等式；如果我们把为\
  \ `article[role=\"main\"]` 和 `header`（其中指定了 `width: 600px / 960px * 100%`）创建的规则粘贴到\
  \ Sassmeister 中，它会给我们编译后的代码（图 4-2）。\n\n![../images/472539_1_En_4_Chapter/472539_1_En_4_Fig2_HTML.jpg](img/472539_1_En_4_Fig2_HTML.jpg)\n\
  \n图 4-2\n\n查看计算的结果\n\n虽然这一点并非显而易见，但这个计算是基于**黄金比例**原理的。这个比例有助于量化为什么某些设计比其他设计更令人赏心悦目——这都关乎确保较大元素的比例是较小元素的两倍。不过，在我们的例子中，数字还不太精准——`960px`（我们的基础测量值）的\
  \ `62.5%` 等于 `600px`，然而如果我们严格遵循该比例，它应该接近 `594px`。嘿——在一个演示设计中，6 像素算什么？\n\n如果你想了解更多关于这个原理的信息，谷歌上有大量在线文章的参考资料，例如\
  \ [`https://www.interaction-design.org/literature/article/the-golden-ratio-principles-of-form-and-layout`](https://www.interaction-design.org/literature/article/the-golden-ratio-principles-of-form-and-layout)。\n\
  \n在 Sass 中执行简单的数学运算只是冰山一角，关于其可能性还有很多：我们还可以使用许多其他函数！它们包括操作字符串、数字，甚至改变颜色——我们可以计算字符串的长度，将其切成更小的块，甚至可以基于现有值创建新的调色板。这是一个非常值得熟悉的方向，所以让我们深入探讨，更详细地看一些例子。\n\
  \n## 定义函数\n\n如果你花时间编写网站样式，那么我相信你会理解需要为 `background-color()` 或 `font-size()` 等属性指定绝对值的必要性。这确实很麻烦，但如果我告诉你，你可能不必这样做呢……？\n\
  \n是的——没错：一旦你开始使用 Sass，有时你将不必手动计算值：你可以让 Sass 替你完成繁重的工作。Sass 的许多函数原理借鉴了诸如 JavaScript\
  \ 等脚本语言——事实上，很多人会说，这正是 JavaScript 和 CSS 之间的界限开始真正模糊的一个领域！\n\n除此之外，Sass 中的函数可以分为几类，总结在表\
  \ 4-1 中。\n\n表 4-1\n\nSass 中可用的函数类型\n\n| 组别 | 描述（附示例） |\n| --- | --- |\n| 颜色（包含透明度）\
  \ | 这分为三类——RGB、HSL 和透明度；此分组涵盖了诸如 `saturation()` 或 `hsl()` 等函数，这些函数旨在获取或操作颜色。 |\n\
  | 字符串 | 这组函数允许我们使用 Sass 操作字符串——执行诸如更改文本大小写、在字符串中插入字符以及获取字符串长度等任务。 |\n| 数字 | 我们已经看到了如何在\
  \ Sass 中使用基本运算符，例如加法——这个组通过 `round()`、`abs()` 和 `random()` 等函数将其提升了一个层次。 |\n| 列表\
  \ | 这组函数允许我们操作 Sass 列表，例如使用 `length()` 或 `nth()` 等操作从列表中获取特定项。**注意：** 列表在 Sass 中是不可变的，因此会返回一个新列表，而不是就地更新现有列表。\
  \ |\n| 映射 | 映射是 Sass 中相对较新的特性——它们允许我们创建一个配置区域，而不必创建多个单独的变量。这组函数允许我们使用 `map-get()`\
  \ 或 `map-values()` 等函数获取和操作映射中的内容。 |\n| 选择器 | 如果我们需要在我们的 Sass 代码中执行诸如连接选择器或用一个选择器替换另一个选择器等任务——这组函数允许我们使用诸如\
  \ `selector-append()` 或 `selector-unify()` 等命令来执行此操作。 |\n| 内省 | 这组函数有助于确定某些函数、变量或混合宏在我们的代码的当前作用域内是否存在，或者可以返回与值关联的类型。\
  \ |\n| 其他 | 这包含两个不属于其他任何组的函数——`if()` 和 `unique-id()`。注意：在此上下文中，`if()` 函数是一个*三元运算符*，而不是我们将在本章后面看到的条件函数。\
  \ |\n\n完整的函数列表可在 Sass 主网站上找到，网址是 [`http://sass-lang.com/documentation/Sass/Script/Functions.html`](http://sass-lang.com/documentation/Sass/Script/Functions.html)。\n\
  \n要完全理解这些函数的工作原理，将超出本书的范围——事实上，我们很可能会就这个主题本身写出一本大部头！\n\n尽管如此，花点时间探索 Sass 函数世界中至少一部分可用功能是值得的。在接下来的几页中，我们将深入探索操作\
  \ Sass 颜色作为一个小型案例研究；毋庸置疑，颜色非常重要，而 Sass 正是能够在我们开发过程中帮助生成代码的一个领域。\n\n### 处理颜色——一个微型案例研究\n\
  \n没有颜色的网站就像没有激情的生活——非常枯燥！事实上，颜色不仅为网站增添了额外的光彩，还有助于传达信息：例如，在中国，红色传达了一种幸福感。\n\n过去，我们可能已经在调色板中指定了一组颜色——这不仅耗时才能调对，而且要保持更新也很痛苦，特别是如果客户在最后一刻改变主意的话！\n\
  \n为了帮助解决这个问题，Sass 包含了许多不同的函数，允许我们以多种不同的方式操作颜色。例如，我们可以调整饱和度级别、更改亮度或改变颜色的色调——功能列表不胜枚举。要了解这在实践中的效果，可以看看\
  \ [`http://jackiebalzer.com/color`](http://jackiebalzer.com/color)：这个网站只指定了两种颜色，却包含了超过\
  \ 30 种不同的色调，都是使用 Sass 函数创建的。这只是一个例子：快速在线搜索会显示其他类似的例子，例如：\n\n*   [`http://scg.ar-ch.org/`](http://scg.ar-ch.org/)\
  \ – 输入一种颜色以获取各种色调的十六进制代码，例如变亮或降低饱和度；\n*   [`http://jim-nielsen.com/sassme/`](http://jim-nielsen.com/sassme/)\
  \ – 使用滑块生成一种新颜色，并抓取代码以用于样式表；\n*   [`https://codepen.io/KatieK2/pen/hbqsB`](https://codepen.io/KatieK2/pen/hbqsB)\
  \ – 更多使用颜色函数的实验；\n*   [`https://css-tricks.com/snippets/sass/tint-shade-functions/`](https://css-tricks.com/snippets/sass/tint-shade-functions/)\
  \ – 由 Hugo Giraudel 创建的两个自定义函数，用于获取稍微更亮或更暗的颜色色调。\n\n让我们一起使用其中一个函数，调整用于填充 SVG 图像的颜色——基础颜色是一种浅灰色调；我们将使用\
  \ `lighten()` 函数使其变得更亮。\n\n\n\n### 操作颜色\n\n让我们开始创建演示示例：\n\n![../images/472539_1_En_4_Chapter/472539_1_En_4_Fig3_HTML.jpg](img/472539_1_En_4_Fig3_HTML.jpg)\n\
  \n图 4-3 – 在 SVG 图像中调整颜色\n\n1.  首先，从本书附带的代码下载中获取`colorfunctions`文件夹的副本，将其保存到我们的项目文件夹中。\n\
  \n2.  接着，新建一个文档并添加以下规则：\n\n    ```\n    @font-face { font-family: 'pt_sansregular';\
  \ src: url('../font/pt_sansregular.woff') format('woff'); font-weight: normal; font-style:\
  \ normal; }\n    body { font-family: 'pt_sansregular', sans-serif; margin: 32px;\
  \ width: 850px; }\n    ellipse { fill: lighten(#c6c6c6, 8); }\n    ```\n\n3.  将文件保存为`scss`文件夹中的`colorfunctions.scss`。\n\
  \n4.  接下来，启动一个终端会话，将工作目录切换到项目区域下的`colorfunctions`文件夹。\n\n5.  在提示符下，输入以下命令并按回车键：\n\
  \n    ```\n    sass sass\\colorfunctions.scss css\\colorfunctions.css\n    ```\n\
  \n6.  如果一切顺利，我们应该会在`css`文件夹中看到`colorfunctions.css`文件以及一个源映射文件——预览结果会显示一个带有样式元素的简单模板页面，如图\
  \ 4-3 所示。\n\n这是一个非常基础的演示，旨在展示使用 Sass 颜色函数是多么简单。在这个例子中，我们使用了`fill:`属性，因为这是在处理 SVG\
  \ 图像时的必要操作；如果是针对标准 HTML 元素，我们完全可以改用`background-color`或`color`属性。我们的演示将初始值的亮度提高了\
  \ 8%，从`#c6c6c6`变为了`#dadada`——我们可以轻松将其指定为其他元素的新颜色，而无需创建会消耗资源的新变量。\n\n现在让我们更进一步，创建一个更实用的例子——比如为网站生成一个配色方案？是的，你没听错——这正是\
  \ Sass 大显身手的好机会；我们只需指定一种颜色，然后让 Sass 自动为我们生成其他所有颜色。\n\n更棒的是，我们甚至不需要自己计算目标颜色的数学公式——我们可以使用托管在[`http://razorltd.github.io/sasscolourfunctioncalculator/`](http://razorltd.github.io/sasscolourfunctioncalculator/)上的工具来帮我们完成转换。为了演示其工作原理，我们将使用\
  \ Color Palettes 网站（[`http://colorpalettes.net/`](http://colorpalettes.net/)）上的一个示例调色板，然后让\
  \ Sass 在编译过程中为我们生成颜色。\n\n### 第二部分 – 创建颜色\n\n让我们开始创建演示示例：\n\n![../images/472539_1_En_4_Chapter/472539_1_En_4_Fig4_HTML.jpg](img/472539_1_En_4_Fig4_HTML.jpg)\n\
  \n图 4-4 – 使用 Sass 创建调色板\n\n1.  首先，从本书附带的代码下载中获取并解压`palette`文件夹的副本，将其保存到我们的项目文件夹中。\n\
  \n2.  接下来，我们需要添加样式；为此，请新建一个文档。由于规则较多，我们将逐个代码块添加，先从一些基础样式开始：\n\n    ```\n    $basecolor:\
  \ #213451;\n    @font-face { font-family: 'pt_sansregular'; src: url('../font/pt_sansregular.woff')\
  \ format('woff'); font-weight: normal; font-style: normal; }\n    body { font-family:\
  \ 'pt_sansregular', sans-serif; margin: 32px; width: 850px; }\n    #palette { margin-bottom:\
  \ 15px; }\n    ```\n\n3.  基础样式设置完毕后，现在可以添加规则来设计每个色样：\n\n    ```\n    .swatch { height:\
  \ 125px; width: 75px; display: inline-block;   margin-right: 17px; }\n    .swlabel\
  \ { border: 1px solid #bfbfbf; width: 75px; display: inline-block; margin-right:\
  \ 15px; margin-top: -15px; text-align: center; padding: 10px 0px 10px 0;}\n    ```\n\
  \n4.  为了给每个色样赋予颜色，我们需要在样式表中添加以下规则：\n\n    ```\n    .swatch:nth-child(1) { background-color:\
  \ $basecolor; }\n    .swatch:nth-child(2) {\n    background-color: lighten(desaturate($basecolor,\
  \ 22.27), 30.20);\n    }\n    .swatch:nth-child(3) {\n    background-color: lighten(desaturate(adjust-hue($basecolor,\
  \ 119), 15.54), 52.55);\n    }\n    .swatch:nth-child(4) {\n    background-color:\
  \ lighten(desaturate(adjust-hue($basecolor, 114), 32.11), 73.73);\n    }\n    .swatch:nth-child(5)\
  \ {\n    background-color: lighten(saturate(adjust-hue(#213451, -131), 57.89), 4.90);\n\
  \    }\n    ```\n\n5.  将文件保存为`scss`文件夹中的`palette.scss`。\n\n6.  接下来，启动一个终端会话，将工作目录切换到项目区域下的`palette`文件夹。\n\
  \n7.  在提示符下，输入以下命令并按回车键：\n\n    ```\n    sass sass\\palette.scss css\\palette.css\n\
  \    ```\n\n8.  如果一切顺利，我们应该会在`css`文件夹中看到`palette.css`文件以及一个源映射文件——预览结果会显示一个带有样式元素的简单模板页面，如图\
  \ 4-4 所示。\n\n尽管此演示中的 Sass 代码看起来可能很复杂，但实际上我们无需担心具体细节，因为大部分繁重的工作都是由我们在演示中使用的 Sass\
  \ 颜色函数工具完成的。不过，以这种方式创建调色板确实有一些非常实用的好处，所以让我们深入探讨，更详细地分析一下代码。\n\n### 详细拆解代码\n\n传统创建调色板的方法通常包括选择颜色，然后决定哪些该用于何处，并希望在开发过程中能保持一致！（我敢肯定这听起来比实际情况更糟糕，但它确实是一种手动的、具有一定风险的方法。）\n\
  \n然而，当你刚开始使用 Sass 时，可能会倾向于将不同的颜色赋值给变量——比如用`$white`代表白色，用`$desaturatedblue`代表`#213451`。创建变量很繁琐——我们必须确保所有颜色都能相互协调，并且整体调色板看起来合理（同时符合品牌指南）。\n\
  \n相反，我们可以彻底颠覆这一思路——尽管有一大段代码用于设置每个色样，但我们在第 16 行只指定了一种基础颜色。虽然这看起来可能有些疯狂，但理由充分——我们对基础颜色进行变换，使其变成此演示中选定的每个调色板颜色。我们来看中间那个色样，它的颜色是这样设置的：\n\
  \n```\nbackground-color: lighten(desaturate(adjust-hue($basecolor, 119), 15.54),\
  \ 52.55);\n```\n\n……我们可以将其分解为以下几个部分：\n\n*   `adjust-hue($basecolor, 119)` – 这给了我们第一个中间色（或称为`color1`）；\n\
  \n*   `desaturate(color1, 15.54)` – 这得到了第二种颜色（或称为`color2`）；\n\n*   `lighten(color2,\
  \ 52.55)` – 这产生了我们最终的第三种颜色。\n\n在这个例子中，我们创建了 3 种可以独立使用的新颜色；但我们采用的是让 Sass 一步到位地根据基础颜色自动计算出`color3`。同样的原理也适用于我们为调色板创建的每一种颜色——经过计算，我们从仅仅\
  \ 1 种颜色中总共衍生出了 11 种颜色！\n\n要查看拆分这个计算过程的效果，请参阅[`https://gist.github.com/alexlibby/6fd1492781a08757c0112bb85c7a832a`](https://gist.github.com/alexlibby/6fd1492781a08757c0112bb85c7a832a)。该链接展示了将大型计算拆分成独立条目的结果。注意`p:nth-child(3)`如何等于`p:nth-child(4)`——我们的代码逐步执行每个计算，将前一次颜色变换的结果作为新变换的基础。\n\
  \n\n\n### 评估使用此方法的好处\n\n创建颜色的方法看似复杂，但采用此方法有一些充分的理由：\n\n-   我们总是可以执行查找和替换，但如果代码中对颜色或变量的拼写略有不同，会发生什么？查找和替换可能无法识别，从而导致代码中出现意外效果。\n\
  -   如果客户在最后一刻要求更改，那么你只需要更新一个值；其他一切都会在编译过程中自动计算出来。\n-   我们不需要为每种颜色创建变量——虽然像我们这样的计算编译可能需要多花几秒钟，但我们并不是“即时”编译代码，所以我们可以接受所需的额外编译时间。\n\
  \n当然，如果我们最终得到一个巨大的样式表（我指的是数万行代码），那么这些额外的编译时间可能会开始累积——如果是这种情况，我们可能更倾向于使用变量。\n\n好了，让我们继续：我们已经接触了一些可用的函数，并探讨了如何在代码中实际使用它们。尽管这为代码引入了一定的动态性，但我们仍然受到限制，因为我们的函数只会产生一个值（就像上一个演示中的情况一样）。\n\
  \n如果我们需要根据满足特定条件来指定不同的值，该怎么办？嗯，Sass 可以提供帮助——它借鉴了诸如 JavaScript 等脚本语言的技术来实现循环等功能。这是该库中一个非常重要的部分，非常值得探索，所以让我们更详细地看看可用于评估\
  \ Sass 代码中条件的功能。\n\n## 评估条件\n\n> *决策，决策——我们用这种颜色，还是另一种……？把内容放在页面顶部怎么样……？*\n\n我们的生活充满了必须做出的决定——在大多数情况下，我们会做出正确的选择，但有时也可能出错！样式化内容也是如此：我们选择的颜色可能会与网站上使用的其他颜色冲突，或者我们应用的背景颜色最终可能导致文本难以辨认。\n\
  \n不过，使用 Sass 的一个关键好处是，我们可以构建一定程度的控制来减少这些问题——如果某个元素的颜色特别暗，那么可以指示 Sass 选择较浅的颜色，以便我们的内容保持清晰易读。\n\
  \n我们如何实现这一点？好吧，是时候认识一下 Sass 的控制指令和表达式了！这个冗长的名称代表了一组函数，它们允许我们控制使用哪些样式以及何时使用——值得注意的是，它们更常用于\
  \ mixin 中，但也可以在需要时用于日常样式编写。让我们逐一看看它们，从 `@if` 函数开始。\n\n### 应用 `@if` 和 `@if()`\n\n\
  假设我们遇到了颜色冲突的问题，这是由于对比度不足造成的——我们该如何解决这个问题？嗯，一种解决方法当然是替换有问题的颜色，但这需要手动操作，比较费力。不如让 Sass\
  \ 替我们选择？\n\n没问题——Sass 有两个函数可以提供帮助：讽刺的是，它们都叫 `@if`，但各有不同的用途！第一个是 `@if()`，格式如下：`if(true,\
  \ 1px, 2px) => 1px`——用于决定我们是应该应用第一个值 (`1px`)，还是在该变量不存在或可能导致错误（例如除以零）时选择 `2px`。\n\
  \n第二个更直接——我们可以使用 `@if` 来决定是否包含某个值，例如这个例子：`@if 1 + 1 == 2 { border: 1px solid; }`，它会被判定为真。如果判定为假，那么\
  \ border 属性根本不会被设置。这两个函数可能都有点难以完全理解，所以让我们创建一个演示来更详细地探索它们的工作原理。\n\n### 使用 If 语句\n\
  \n第一步是获取本书附带的示例文件——有了它之后，请按照以下步骤操作：\n\n![../images/472539_1_En_4_Chapter/472539_1_En_4_Fig5_HTML.jpg](img/472539_1_En_4_Fig5_HTML.jpg)\n\
  \n**图 4-5**  \n使用 `@if...@else` 语句\n\n1.  首先，从本书附带的代码示例中下载并解压 `condition` 文件夹的副本——继续将其保存到我们的项目文件夹中。\n\
  \n2.  我们的演示不包含使其正常运行所需的 Sass 样式——为此，继续创建一个新文件，并将其保存为我们第 1 步中保存的 `condition` 文件夹下的\
  \ `sass` 子文件夹中的 `condition.scss`。\n\n3.  我们需要添加一些样式规则，我们将逐块添加，从设置演示所需的一些基本样式开始：\n\
  \n    ```\n    @font-face { font-family: 'pt_sansregular'; src: url('../font/pt_sansregular.woff')\
  \ format('woff'); font-weight: normal; font-style: normal; }\n    body { font-family:\
  \ 'pt_sansregular', sans-serif; margin: 32px; font-size: 20px; }\n    li { padding:\
  \ 20px 5px; margin: 10px; color: white; width: 400px; list-style: none; }\n    ```\n\
  \n4.  接下来是演示的核心——我们首先指定三种颜色，它们由三个 `if` 语句的结果定义：\n\n    ```\n    $first-color: if(true,\
  \ antiquewhite, black);\n    $second-color: if(false, black, slategrey);\n    $third-color:\
  \ if(4 > 2, silver, black);\n    ```\n\n5.  现在，我们需要添加一些条件，这些条件决定了四个列表项中每个项所使用的某些属性：\n\
  \n    ```\n    li:nth-of-type(1) {\n    background: $first-color;\n    @if (lightness($first-color)\
  \ > 75%) {\n    color: black;\n    } @else {\n    color: white;\n    }\n    }\n\
  \    li:nth-of-type(2) {\n    @if 1 + 1 == 2 { background: $second-color;  }\n \
  \   @if 5 > 3 { border: 3px dotted $third-color; width: 394px; }\n    @if true {\
  \ font-family: 'sans-serif'; }\n    }\n    li:nth-of-type(3) {\n    background:\
  \ $third-color;\n    @if (lightness($third-color) > 75%) {\n    color: black;\n\
  \    } @else {\n    color: white;\n    }\n    }\n    li:nth-of-type(4) {\n    @if\
  \ 1 + 1 == 2 { background: darken($second-color, 50%); }\n    @else if 1 + 2 ==\
  \ 3 { background: $second-color; }\n    @else if 5 > 3{ border: 2px dotted $third-color;\
  \ }\n    }\n    ```\n\n6.  继续保存文件——接下来，启动一个终端会话，并将工作文件夹更改为项目区域下的 `condition` 文件夹。\n\
  \n7.  在提示符下，输入以下命令并按 Enter：\n\n    ```\n    sass sass\\condition.scss css\\condition.css\n\
  \    ```\n\n8.  如果一切顺利，我们应该会在 `css` 文件夹中看到一个 `colorfunctions.css` 文件以及一个 source\
  \ map——预览结果将显示一个带有样式元素的简单模板页面，如图 4-5 所示。\n\n乍一看，我们的演示非常简单，每个列表项都有简单的样式。然而，在表面之下，它隐藏了大量的决策过程，这些过程决定了每个列表项应该使用哪种颜色！我们在本演示中使用了两个关键函数，理解它们很重要，所以让我们花几分钟时间更详细地探讨它们的工作原理。\n\
  \n\n\n### 理解发生了什么\n\n我们演示样式表的第一部分包含一些标准规则，用于定义演示和每个列表项的基本样式。不过，演示的关键从第 22 行开始，我们使用了三个`@if()`语句来创建颜色。\n\
  \n理解这些语句工作原理的最简单方法是：“如果条件为 X，则使用第一个值（真），否则使用第二个值（假）。”对于第一个语句，我们将“复古白”指定为真值颜色；由于我们的条件设置为真，这就是样式表中将使用的颜色。\n\
  \n对于第二种类型的`@if`语句（我们为第二个列表项设置了三个属性），只需要满足每个条件即可。如果答案正确（即为真），则应用方括号中显示的属性；如果不正确，则丢弃该属性。\n\
  \n剩下的两个示例与前两个的工作方式相同——第三个列表项遵循与第一个列表项相同的原理，第四个则采用与第二个列表项相同的技术。\n\n## 循环遍历样式\n\n\
  Sass 的关键能力之一是接管生成样式的工作——例如，我们可以使用函数创建整个调色板，或者让 Sass 选择应用于背景的颜色，使其不与前景色冲突。\n\n但这只是\
  \ Sass 所能实现的一小部分——Sass 真正的强项在于遍历多个元素，从一组指令中为每个元素应用样式。例如，为电商网站创建一组支付卡图标——我们可以创建一组通用样式，但利用\
  \ Sass 从单个名称列表中为每个图像生成独特的样式。\n\nSass 有许多适合这类任务的函数——它们各有独特特性，但都遵循遍历一组元素的类似原理。让我们逐一了解，从`@for`函数开始。\n\
  \n### 使用`@for`\n\n我们的第一个函数`@for`用于重复创建一组样式——它使用一个计数器来遍历该样式的每个实例，并根据指令中的指定内容调整每个实例。该指令的语法非常简单：`@for\
  \ $var from <start> through <end>`，更改内容用花括号括起来。\n\n还有第二种格式可用——将单词`through`替换为`to`，效果同样良好。\n\
  \n让我们通过一个快速演示详细了解这个函数的工作原理。\n\n### 使用`@for`应用样式\n\n让我们开始设置我们的演示：\n\n![../images/472539_1_En_4_Chapter/472539_1_En_4_Fig6_HTML.jpg](img/472539_1_En_4_Fig6_HTML.jpg)\n\
  \n图 4-6\n\n使用`@for`循环遍历样式\n\n1.  我们首先从本书附带的代码下载中下载并解压`forloop`文件夹的副本；继续将其保存到我们的项目文件夹中。\n\
  \n2.  下载内容包含所有标记，但如果没有样式，这些将毫无用处，所以让我们创建一个新文件，将其保存为`sass`文件夹中的`forloop.scss`，用于此演示。\n\
  \n3.  在文件中，依次添加以下代码块，从一些设置演示的基本样式开始：\n\n    ```\n    $basecolor: #213451;\n    @font-face\
  \ {\n    font-family: 'pt_sansregular';\n    src: url('../font/pt_sansregular.woff')\
  \ format('woff');\n    font-weight: normal;\n    font-style: normal;\n    }\n  \
  \  body { font-family: 'pt_sansregular', sans-serif; margin: 32px;}\n    ul { width:\
  \ 150px; background-color: rgba(0,0,0,0.6) }\n    ```\n\n4.  其余规则构成了我们演示的关键——这些规则负责为每个列表项设置样式：\n\
  \n    ```\n    $rainbow: silver slategrey antiquewhite darkgrey gainsboro;\n   \
  \ @for $i from 1 through 5 {\n    li:nth-child(#{$i}) {\n    color: nth($rainbow,\
  \ $i);\n    font-size: 32px;\n    font-weight: bold;\n    }\n    }\n    ```\n\n\
  5.  继续保存文件——接下来，启动一个终端会话，并将工作文件夹更改为项目区域下的`forloop`文件夹。\n\n6.  在提示符下，输入以下命令并按回车键：\n\
  \n    ```\n    sass sass\\forloop.scss css\\forloop.css\n    ```\n\n7.  如果一切顺利，我们应该会看到`css`文件夹中出现一个`forloop.css`文件，以及一个源映射——预览结果将显示一个包含样式元素的简单模板页面，如图\
  \ 4-6 所示。\n\n嘿嘿——我打赌你没想到一个演示可以这么友好！好吧——是的，这是个很糟糕的笑话，但抛开内容不谈，我们的演示展示了一个有用的概念，在使用\
  \ Sass 进行开发时值得掌握。让我们更详细地看看这个概念。\n\n### 理解代码如何工作\n\n那么——我们说的这个概念是什么？是重复——我们有五个项目组成了一个简单的列表：所有这些都需要样式，但并非所有值都相同！\n\
  \n我们的演示包含一个简单无序列表中的五个列表项——由于大多数样式相似，我们只需编写一个实例，并使用 Sass 的 for 循环依次遍历每个项目，以应用适当的样式：\n\
  \n```\n$rainbow: silver slategrey antiquewhite darkgrey gainsboro;\n@for $i from\
  \ 1 through 5 {\nli:nth-child(#{$i}) {\ncolor: nth($rainbow, $i);\nfont-size: 32px;\n\
  font-weight: bold;\n}\n}\n```\n\n但关键在于颜色属性——因为我们想应用不同的颜色，所以创建了一个列表，并将其赋值给变量`$rainbow`。在\
  \ for 循环中，我们遍历这个列表并为每个项目依次应用颜色，颜色值使用字符串插值（将`(#{$i})`替换为适当的数字）进行格式化。编译后，每个列表项的代码将类似于图\
  \ 4-7 中所示的示例。\n\n![../images/472539_1_En_4_Chapter/472539_1_En_4_Fig7_HTML.jpg](img/472539_1_En_4_Fig7_HTML.jpg)\n\
  \n图 4-7\n\n为列表项添加样式\n\n这是一种很好的应用样式的方式，但需要记住的关键点是重复——我们定位的项目必须是同一类型。在这个例子中，我们定位的是列表项；其他类型的元素必须单独设置样式。\n\
  \n### 使用`@each`进行循环\n\n下一个循环函数稍微复杂一些——它本身不是一个循环函数，但我们却在循环遍历多个项目！让我解释一下我的意思：\n\n\
  `@each`函数允许我们将一个变量设置为列表或 Sass 映射中的每个项目——列表只是一组逗号分隔的值。映射则将这一点提升到一个层次——它允许我们为单个项目分配多个值，这些值都关联到同一个项目。例如，我们可能正在讨论一组汽车——属性可能包括颜色、品牌、型号：这些属性分别适用于每辆汽车。\n\
  \n我们将在本章后面更详细地重新讨论 Sass 映射的主题。\n\n为了理解这在实践中意味着什么，我们将创建一个简单的演示，使用`@each`函数设置多个按钮——对于每个按钮，我们将使用\
  \ Sass 列表指定颜色和按钮功能，然后遍历每个按钮以创建最终的样式规则。\n\n\n\n### 为每个项目设置样式\n\n让我们开始演示：\n\n![../images/472539_1_En_4_Chapter/472539_1_En_4_Fig8_HTML.jpg](img/472539_1_En_4_Fig8_HTML.jpg)\n\
  \n**图 4-8** 使用 `@each` 创建按钮样式\n\n1. 首先，从本书附带的代码下载中获取 `eachitem` 文件夹的副本，并将其保存到项目文件夹的根目录下。\n\
  \n2. 接下来，我们需要添加 Sass 样式——为此，请创建一个新文件，将其命名为 `eachitem.scss`，并保存在步骤 1 中创建的 `condition`\
  \ 文件夹下的 `sass` 子文件夹中。\n\n3. 我们需要添加几条样式规则，我们将逐块添加，首先从设置演示所需的一些基本样式开始：\n\n    ```\n\
  \    @import url(https://fonts.googleapis.com/css?family=Poiret+One);\n    @font-face\
  \ {\n    font-family: 'pt_sansregular';\n    src: url('../font/pt_sansregular.woff')\
  \ format('woff');\n    font-weight: normal;\n    font-style: normal;\n    }\n  \
  \  body {\n    font-family: 'pt_sansregular', sans-serif;\n    margin: 32px;\n \
  \   }\n    ```\n\n4. 接下来是一些我们创建的初始值，以及一个用于成对存储值的 Sass 列表（每对包含按钮类型和指向其颜色的变量）：\n\n\
  \    ```\n    $publish: gainsboro;\n    $postpone: antiquewhite;\n    $delete: silver;\n\
  \    $states: (publish, $publish),\n    (postpone, $postpone),\n    (delete, $delete);\n\
  \    ```\n\n5. 基础值设置好后，我们现在可以设置按钮的样式——为此，请继续添加以下代码：\n\n    ```\n    @each $buttonstate,\
  \ $color in $states {\n    button { color: #000; text-decoration: none; padding:\
  \ 5px 10px; border-radius: 3px; font-family: 'Poiret One', cursive; font-size: 32px;\
  \ font-weight: bold; outline: 0; }\n    .#{$buttonstate} {\n    padding: 10px 20px;\n\
  \    border: none;\n    background-color: $color;\n    &:hover { background-color:\
  \ darken( $color, 10% );      transition: all 0.3s ease; }\n    &:active { background:\
  \ darken($color,25%); }\n    }\n    }\n    ```\n\n6. 保存文件——接下来，打开一个终端会话，将工作目录切换到项目区域下的\
  \ `eachitem` 文件夹。\n\n7. 在提示符下，输入以下命令并按回车键：\n\n    ```\n    sass sass\\eachitem.scss\
  \ css\\eachitem.css\n    ```\n\n8. 如果一切顺利，我们应该会在 `css` 文件夹中看到一个 `colorfunctions.css`\
  \ 文件，以及一个源映射文件——预览结果将显示一个带有样式元素的简单模板页面，如图 4-8 所示。\n\n到目前为止，我们讨论了在迭代过程中为项目应用样式——无论组中有多少个项目，每个项目都会应用相同的样式集。本演示展示了一种遍历项目的不同方式；它有一个关键区别，所以让我们暂停片刻，更详细地回顾一下我们演示中的代码。\n\
  \n### 剖析演示\n\n`@each` 函数有所不同——首先，它不强调数字；`@each` 会遍历目标列表中的所有内容。然而，`@each` 的好处在于，它能够为列表中的每个项目将属性分组在一起；Sass\
  \ 会依次将每个属性应用于该项目。\n\n以我们的演示为例——我们创建了一组三个按钮，它们成对地应用了按钮类型和颜色：\n\n```\n$states: (publish,\
  \ $publish),\n(postpone, $postpone),\n(delete, $delete);\n@each $buttonstate, $color\
  \ in $states {\n...\n.#{$buttonstate} {\n...\n&:hover { background-color: darken(\
  \ $color, 10% );      transition: all 0.3s ease; }\n&:active { background: darken($color,25%);\
  \ }\n}\n}\n```\n\n我们首先为每个按钮创建一个项目列表——列表项是成对的，每个按钮都分配了 `$buttonstate` 和 `$color`\
  \ 值。然后，我们遍历每一对，使用字符串插值根据按钮类型创建样式。同时，我们为每个按钮创建悬停和激活状态，使用提供的 `$color` 值，悬停时颜色变深 `10%`，激活时颜色变深\
  \ `25%`。\n\n## 在条件为真时循环\n\n有时，我们可能没有定义要遍历的项目数量，或者这个数量可能会变化——在这些情况下，使用 `@for` 循环或数组中的\
  \ `@each` 将不起作用。相反，我们必须使用另一个函数——`@while`。\n\n那么——我听到你在问：有什么区别？答案很简单——它基于“只要满足给定条件就继续循环”的原则。一旦我们无法满足这个条件，循环就会停止，Sass\
  \ 将继续编译样式表中的下一组规则。在许多情况下，`@while` 循环的工作方式与其他语言（如 JavaScript）非常相似——为了理解我的意思，让我们看一个简单的示例，其中我们遍历十个列表项，并为每个项应用更深的颜色阴影。\n\
  \n### 循环 `@while` 真\n\n我们的演示非常容易搭建，让我们开始：\n\n![../images/472539_1_En_4_Chapter/472539_1_En_4_Fig9_HTML.jpg](img/472539_1_En_4_Fig9_HTML.jpg)\n\
  \n**图 4-9** 使用 while 循环设置列表项样式\n\n1. 首先，从本书附带的代码下载中获取 `whileloop` 文件夹的副本，并将其保存到项目文件夹的根目录下。\n\
  \n2. 接下来，我们需要添加 Sass 样式——为此，请创建一个新文件，将其命名为 `whileloop.scss`，并保存在步骤 1 中创建的 `condition`\
  \ 文件夹下的 `sass` 子文件夹中。\n\n3. 我们需要添加几条样式规则，我们将逐块添加，首先从设置演示所需的一些基本样式开始：\n\n    ```\n\
  \    $start-color: gainsboro;\n    $end-color: black;\n    $white: #ffffff;\n  \
  \  $step: 1; // 设置初始步骤值\n    @font-face {\n    font-family: 'pt_sansregular';\n\
  \    src: url('../font/pt_sansregular.woff') format('woff');\n    font-weight: normal;\n\
  \    font-style: normal;\n    }\n    body { font-family: 'pt_sansregular', sans-serif;\
  \ margin: 32px; padding: 32px 80px; width: 550px; }\n    ```\n\n4. 我们正在创建一组列表项，因此需要应用一些每个列表项共有的基本样式，例如字体大小：\n\
  \n    ```\n    ul { margin: 0; padding: 0; }\n    li {\n    color: $white;\n   \
  \ display: inline-block;\n    font-size: 24px;\n    list-style-type: none;\n   \
  \ margin-bottom: 3.2px;\n    padding: 8px;\n    width: 80px;\n    }\n    ```\n\n\
  5. Sass 样式的最后一部分负责为每个列表项应用逐渐加深的颜色阴影：\n\n    ```\n    @while $step <=10  {\n    //\
  \ 从一种颜色渐变到另一种颜色\n    .mix li:nth-child(#{$step}) {\n    background-color: mix($end-color,\
  \ $start-color, ($step * 10));\n    }\n    $step: $step + 1;\n    }\n    ```\n\n\
  6. 保存文件——接下来，打开一个终端会话，将工作目录切换到项目区域下的 `whileloop` 文件夹。\n\n7. 在提示符下，输入以下命令并按回车键：\n\
  \n    ```\n    sass sass\\whileloop.scss css\\whileloop.css\n    ```\n\n8. 如果一切顺利，我们应该会在\
  \ `css` 文件夹中看到一个 `whileloop.css` 文件，以及一个源映射文件——预览结果将显示一个带有样式元素的简单模板页面，如图 4-9 所示。\n\
  \n当处理多个相同类型的项目时，使用循环是一种以迭代方式应用样式的好方法，无需为每个项目单独编写样式声明。这是一项值得学习的有用技术，即使你在刚开始使用 Sass\
  \ 时可能不会立即用到它——让我们花点时间更详细地探讨我们的代码是如何工作的。\n\n\n\n## 深入探究代码细节\n\n那么，我们的代码是如何工作的呢？其实，大部分样式声明都是标准的\
  \ CSS – 让演示生效的关键在于这个函数：\n\n```scss\n@while $step <=10  {\n// changes from one color\
  \ to another\n.mix li:nth-child(#{$step}) {\nbackground-color: mix($end-color, $start-color,\
  \ ($step * 10));\n}\n$step: $step + 1;\n}\n```\n\n在这段代码中，我们创建了一个循环，变量 `$step` 的（隐式）初始值设为零。然后我们用这个值替换粗体高亮部分（一个插值字符串），来创建我们的规则——这条规则包含一个\
  \ `background-color` 声明，它是由两种颜色（浅灰色和黑色）混合而成。我们通过将 `$step` 的值增加 1 来结束循环——这使我们移动到组中的下一个列表项。我们可以在图\
  \ 4-10 所示的示例代码中看到这个函数的效果。\n\n![../images/472539_1_En_4_Chapter/472539_1_En_4_Fig10_HTML.jpg](img/472539_1_En_4_Fig10_HTML.jpg)\n\
  \n**图 4-10** 从 `@while` 循环编译生成的代码\n\n看，为每个列表项设置样式是多么简单？诚然，我们的代码可能过于简化了，但可重复性的原则同样适用——只要我们有一个合适的元素组（例如列表项），我们就可以使用\
  \ Sass 自动为它们应用样式。\n\n好了，让我们继续：现在是将注意力转向 Sass 中一个较新功能的时候了。当为元素设置样式时，我们可能会创建一组样式“调色板”，用于某些特定元素，如标题或表格。与其创建一堆不同的变量，我们可以使用一种更高效的方法：创建一个映射。注意，我不是指要复制制图师多年来的做法，而是指别的东西：一种引用已分组特定属性的方式。让我们深入探讨一下，看看这在实际中意味着什么。\n\
  \n### 为属性列表或映射应用样式\n\n尽管 Sass 映射对 Sass 来说是一个相对较新的概念（在 Dart Sass 的前身 Ruby Sass 3.3\
  \ 版本中引入），但它价值连城——为什么？好吧，让我解释一下它们是如何工作的：\n\n在过去，我们可能会创建多个变量来存储值——这虽然可行，但是一种非常手动、低效的存储值的方式：此外，除了它们在样式表中可能出现的位置之外，我们实际上无法对每个项进行分组。\n\
  \n相反，我们可以使用映射——它至少由两部分组成：初始映射变量和调用每个引用的代码块。在单个变量中，我们可以使用以下语法分配多个键值对：\n\n```\n$map:\
  \ (key1: value1, key2: value2, key3: value3);\n```\n\n……其中 `key` 是映射的引用，`value`\
  \ 是我们在编译时希望在样式表中显示的值。当我们需要调用一个值时，我们会使用类似这样的语法：\n\n```\ntext-align: map-get(<map>,\
  \ <key>)\n```\n\n让我们通过重温我最喜欢的效果之一来实践一下——我们将使用经典的宝丽来效果来设置一张老式相机图片的样式。\n\n### 创建和使用\
  \ Sass 映射\n\n对于下一个演示，我们将使用一个已预先使用 Sass 但可以轻松转换为使用 Sass 映射的演示。我们的老式相机图片来源于 Pexels\
  \ 网站，网址是 [`https://www.pexels.com/photo/antique-camera-classic-lens-242433/`](https://www.pexels.com/photo/antique-camera-classic-lens-242433/)。\n\
  \n让我们更新演示以使用 Sass 映射：\n\n![../images/472539_1_En_4_Chapter/472539_1_En_4_Fig11_HTML.jpg](img/472539_1_En_4_Fig11_HTML.jpg)\n\
  \n**图 4-11** 使用映射创建宝丽来图片\n\n1.  首先，从本书附带的代码下载中下载 `sassmap` 文件夹的副本——将其保存到项目文件夹的根目录。\n\
  \n2.  这次，我们的演示已经包含了 Sass 样式，但我们打算对其进行修改——为此，请打开我们在步骤 1 中保存的 `sassmap` 文件夹中 `sass`\
  \ 子文件夹下的 `sassmap.scss` 文件。\n\n3.  在文件的顶部，在 `@font-face` 声明之前，插入如下代码：\n\n    ```scss\n\
  \    $styling-figcaption: (\n    'text-align': center,\n    'font-family': Reenie\
  \ Beanie,\n    'font-size': 20.8px,\n    'color': #454f40,\n    'letter-spacing':\
  \ 1.44px,\n    );\n    ```\n\n4.  向下滚动，直到找到 `figcaption{`，大约在第 69 行。\n\n5.  替换这个样式规则的内容，使其看起来像这样：\n\
  \n    ```scss\n    figcaption {\n    text-align: map-get($styling-figcaption, 'text-align');\n\
  \    font-family: map-get($styling-figcaption, 'font-family');\n    font-size: map-get($styling-figcaption,\
  \ 'font-size');\n    color: map-get($styling-figcaption, 'color');\n    letter-spacing:\
  \ map-get($styling-figcaption, 'letter-spacing');\n    }\n    ```\n\n6.  保存文件——接下来，打开一个终端会话，将工作目录切换到项目区域下的\
  \ `sassmap` 文件夹。\n\n7.  在提示符下，输入以下命令并按 Enter：\n\n    ```bash\n    sass sass\\sassmap.scss\
  \ css\\sassmap.css\n    ```\n\n8.  如果一切顺利，我们应该会看到 `css` 文件夹中出现一个 `sassmap.css` 文件以及一个源映射文件——预览结果将显示一个带有样式元素的简单模板页面，如图\
  \ 4-11 所示。\n\n这是一个非常简单的修改，但它使我们的代码管理起来轻松了无数倍——现在，我们不仅可以从单个变量中访问每个属性，还可以在代码中多次这样做。然而，我们仅仅触及了\
  \ Sass 映射工作原理的表面：我们还能做更多！尽管如此，花点时间仔细梳理一下我们的代码，看看映射在 Sass 开发中究竟有多强大，是值得的。\n\n###\
  \ 解析我们的代码\n\n乍一看，我们更新后的代码可能看起来更“冗长”（即，代码比以前多了）。但请记住，Sass 经常会有这种情况——在这种情况下，一切旨在让我们更容易了解代码中使用的是哪个值。\n\
  \n我们的代码首先添加了一个映射，它是一组成对的属性；这被赋值给一个变量。如果你熟悉这种技术，可以把它想象成一个数组；其工作方式非常相似。映射非常适合将页面上特定元素（如标题或\
  \ `<h2>` 标签）的通用样式分组在一起。\n\n然后，当我们创建 `figcaption` 规则时，我们引用了这个映射——我们没有直接将值输入到规则中，而是简单地用对\
  \ `$styling-figcaption` 映射的调用替换它们，并传入我们想要获取的属性的适当引用。\n\n这种分组方式使得识别属性关联的内容变得更加容易，并消除了在代码中使用多个变量的需要。所以——例如，如果我们调用\
  \ `map-get($styling-figcaption, 'text-align')`，我们会得到 `center` 这个值。我们最初可能会将其设置为标题的多个属性之一（如前所述），但我们可以在代码中的任何示例中调用这个\
  \ `map-get()` 函数并使用它，而不仅仅是用于标题！\n\n\n\n## 使用 @media 创建断点\n\n在本章中，我们已经探讨了使用 Sass\
  \ 函数执行各种任务（例如生成颜色）的不同方式，以及如何使用其控制指令来决定样式表中应写入的内容。\n\n不过，还有一个控制指令我们尚未介绍——对于任何从事响应式网站开发的开发者来说，这个指令应该一眼就能认出来。是的，我指的是\
  \ `@media`——它的工作方式与标准 CSS 中的 `@media` 基本相同，但有一个额外的功能：媒体指令可以嵌套在 Sass 内容中。\n\n简而言之，这意味着任何出现在\
  \ CSS 规则中的 `@media` 都会提升到样式表的顶层——这使得添加特定于媒体的样式变得容易，而无需重复选择器或破坏样式表的流程。让我们通过一个简单的概念验证，看看这在实践中意味着什么，展示如何使用\
  \ Sass 实现媒体指令。\n\n### 创建断点\n\n为了演示的目的，我们将在元素方面保持非常简单——只有一个 `<div>`，当屏幕宽度调整时它会改变颜色。让我们开始设置练习：\n\
  \n![../images/472539_1_En_4_Chapter/472539_1_En_4_Fig12_HTML.jpg](img/472539_1_En_4_Fig12_HTML.jpg)\n\
  \n图 4-12\n\n我们完成的断点示例，处于平板宽度\n\n1. 首先，从本书附带的代码下载中下载 `breakpoints` 文件夹的副本——将其保存到我们项目文件夹的根目录。\n\
  2. 下载内容包含所有标记，但如果没有样式，这些标记将毫无用处，因此让我们创建一个新文件，将其保存为 `sass` 文件夹中的 `breakpoints.scss`\
  \ 用于此演示。\n3. 我们需要添加一些样式规则，我们将逐块添加，首先从设置演示所需的一些基本样式开始：\n\n```\n@font-face {\nfont-family:\
  \ 'pt_sansregular';\nsrc: url('../font/pt_sansregular.woff') format('woff');\nfont-weight:\
  \ normal;\nfont-style: normal;\n}\nbody { font-family: 'pt_sansregular', sans-serif;\
  \ margin: 32px; font-size: 20.8px; }\n```\n\n4. 接下来是设置断点所需的样式——我们首先设置一个 Sass 映射来存储我们的断点：\n\
  \n```\n$media-queries: (\ntablet: (\nbreakpoint: '(min-width: 480px) and (max-width:\
  \ 768px)',\n),\nmobile: (\nbreakpoint: '(max-width: 480px)'\n)\n);\n```\n\n5. 然后我们需要添加一个混入（mixin），它将被调用来创建样式：\n\
  \n```\n@mixin media-query ($size) {\n@each $item, $value in $media-queries {\n@if\
  \ $item == $size {\n@if map-get($value, breakpoint) != null {\n@media only screen\
  \ and #{map-get($value, breakpoint)} {\n@content;\n}\n}\n}\n}\n}\n```\n\n6. 样式部分快要完成了——最后但同样重要的是，为我们的响应式\
  \ `<div>` 元素添加基本样式，以及调用混入来添加响应式颜色：\n\n```\n.row { display: inline-block; width:\
  \ 100%; font-size: 22.4px;\ntext-align: center; color: #FFF; padding: 4% 10%; box-sizing:\
  \ border-box; }\n.row {\nbackground: darkgrey;\n@include media-query(mobile) {\n\
  background: lightgrey;\n}\n@include media-query(tablet) {\nbackground: darkgrey;\n\
  }\n}\n```\n\n7. 保存文件——接下来，启动一个终端会话，并将工作文件夹切换到项目区域下的 `breakpoints` 文件夹。\n8. 在提示符下，输入以下命令并按\
  \ Enter：\n\n```\nsass sass\\breakpoints.scss css\\breakpoints.css\n```\n\n9. 如果一切顺利，我们应该会看到\
  \ `css` 文件夹中出现一个 `breakpoints.css` 文件，以及一个源映射——预览结果将显示一个包含样式元素的简单模板页面，如图 4-12 所示。\n\
  \n尽管我们的演示只包含一个元素，但我们仍然需要添加相当数量的代码来使其具有响应性！我们的代码展示了一些值得掌握的关键技术；其中大多数你已经在本书前面遇到过，但不是在使元素具有响应性的上下文中。让我们花几分钟重新审视代码，更详细地了解其工作方式。\n\
  \n### 理解发生了什么\n\n尽管我们之前已经见过此演示中使用的大多数技术，但乍一看，你可能会觉得它看起来比实际复杂。实际上，这是相当直接的代码，让我们一步步地过一遍：\n\
  \n我们代码的核心从步骤 4 开始，在那里我们创建了一个媒体断点映射——我们指定了两个典型的断点（平板和移动端），但同样可以根据需要包含桌面和其他设备的断点。在这个映射中，我们指定了一个介于\
  \ `480px` 和 `768px` 之间的断点，以及另一个用于适应宽度不超过 `480px` 的设备的断点。\n\n接下来是一个混入——我们将断点大小作为文本名称传入，这里可能是\
  \ mobile 或 tablet。然后我们遍历映射中的每个条目；如果映射包含一个正确大小的条目，我们使用 `map-get` 获取其断点 `$value`，前提是映射中存在合适的值。假设存在这样的值，那么我们使用特殊关键字\
  \ `content` 将此媒体查询应用于所有声明，直到该选择器的顶层。这将得到类似于图 4-13 所示的结果。\n\n![../images/472539_1_En_4_Chapter/472539_1_En_4_Fig13_HTML.jpg](img/472539_1_En_4_Fig13_HTML.jpg)\n\
  \n图 4-13\n\n我们编译后的媒体查询\n\n我们的代码看起来很复杂，但实际上，我们只需要关心的部分是 Sass 映射和对混入的调用——混入本身不会改变，并且同样可以使用\
  \ `@include` 命令从单独的样式表中导入。这让我们可以专注于为媒体查询映射提供正确的断点（也可以导入），并确保在样式表中的适当位置放置调用。\n\n\
  ### 总结\n\n呼——真是精彩纷呈！我们在本章中涵盖了大量的内容，所以在进入下一章创建演示之前，让我们花点时间回顾一下本章学到的内容。\n\n我们首先了解了如何在\
  \ Sass 中使用函数——我们看到了这些函数如何用于各种目的，但特别适用于诸如创建颜色之类的任务。我们还探讨了以这种方式使用函数的好处，以及它如何使创建代码更加容易。\n\
  \n接下来，我们研究了如何在编译时根据评估某些条件来分配样式——这包括查看 Sass 的控制指令和表达式，以及通过循环遍历元素组来自动创建样式的各种方法。我们还了解了如何指定循环中已知数量的项目，或者使用仅在代码中满足特定条件时才会运行的循环。\n\
  \n然后，我们继续探索 Sass 映射的使用，并看到将值分配给单个占位符是多么容易，而以前我们可能需要使用多个变量来执行相同的任务。最后，我们通过简要介绍 `@media`\
  \ 指令来结束本章，了解 Sass 如何帮助为响应式网站或在线应用程序创建媒体查询。\n\n好了——我们几乎到了本书的结尾，但在离开之前，我们必须将所学的一些内容付诸实践！为了帮助实现这一点，我们将进行一个微型案例研究，看看如何在更实际的示例中使用我们学到的一些技术——是时候准备好那些模拟信用卡了，因为我们要创建一个购物车的用户界面。如果我是你，我会先去喝杯咖啡或饮料，因为在接下来的几页中我们要涵盖很多内容……！\n\
  \n\n\n"
- "# 5. 开始使用 Sass 进行转换\n\n在本书中，我们第一次接触了 Sass，并了解了多种用于编写有效 CSS 代码的新技术。我们编写的大部分代码都是从头开始的；我猜想很多人会问——如何将现有项目转换为使用\
  \ Sass 呢？\n\n这是一个很好的问题：我们所学的很多内容都假设在一个理想世界中，我们会从头编写代码，这也是充分发挥 Sass 优势的最佳方式。显然，这种理想情况并不总是发生，因此我们在开发中必须考虑到这一点。将庞大的样式表转换为有效的\
  \ Sass 代码可能看起来令人生畏，但只要有一点耐心和周密的计划，这是可以实现的。为此，需要牢记三个关键因素：\n\n- Sass 仅仅是 CSS 的一个超集——不要认为你必须一次性转换所有内容！相反，分阶段进行更改：可能需要更长的时间，但从长远来看会更有效。\n\
  - 规划和有条不紊绝对是最关键的——确保你的代码格式一致：例如，颜色代码应使用相同的表示法（白色用 `#fff` 或 `#ffffff`，但不要混用）。\n-\
  \ 尽可能实现自动化——有可用的工具可以提供帮助，例如使用 Autoprefixer 在编译期间处理所有浏览器前缀。\n\n样式表的长度并不重要——我们可以使用相同的技巧将其分解并转换为对应的\
  \ Sass 代码。事实上，你可能会发现样式表越长越好：以 WordPress 自己的样式表为例，它超过 4,500 行，并且本身就是用 Sass 编写的。\n\
  \n我们可以使用一些小技巧来帮助过渡到使用 Sass，所以无论项目是什么，让我们看看如何让转换过程变得更容易。\n\n## 简化流程\n\n乍一看，转换一个庞大的样式表确实会令人生畏——在本章中，我将向你展示一些可以开始转换过程的技巧和技术，并将其分解为更易于管理的步骤。\n\
  \n当然，首要任务是设置好我们的 Sass 开发工作流——我们已经使用过手动编译器来生成 CSS 代码，但我们很可能还需要更多；是时候更进一步了！此时我们需要自动化我们的流程：我建议使用\
  \ Node.js 以及以下一些工具：\n\n- Autoprefixer 用于在需要时添加浏览器前缀：[`https://github.com/postcss/autoprefixer`](https://github.com/postcss/autoprefixer)；\n\
  - 图片精灵/压缩工具——尝试这个用于创建精灵图的插件：[`https://www.npmjs.com/package/spritesmith`](https://www.npmjs.com/package/spritesmith)，或使用\
  \ [`https://www.npmjs.com/package/imagemin`](https://www.npmjs.com/package/imagemin)\
  \ 作为图片压缩插件；\n- Live-Reload：前往 [`https://www.npmjs.com/package/livereload`](https://www.npmjs.com/package/livereload)\
  \ 获取与 Node.js 配合使用的版本；\n- 任务运行器——一个额外的可选工具；你可以使用任何此类工具，例如 Gulp ([`https://gulpjs.com`](https://gulpjs.com))\
  \ 或 Grunt ([`https://gruntjs.com`](https://gruntjs.com))，或者如果愿意，也可以只使用纯 Node.js；\n\
  - 文本编辑器的语法检查器——我个人最喜欢的是 Sublime Text ([`https://www.sublimetext.com/3`](https://www.sublimetext.com/3))；它有一个可从\
  \ [`https://packagecontrol.io/packages/Sass`](https://packagecontrol.io/packages/Sass)\
  \ 获取的 Sass 语法检查插件。\n\n当然，使用哪些工具很大程度上取决于你是否有现有的工作流程；Sass 是一种无需大量额外工具即可入门的库之一。假设我们已经设置了开发环境，这里有一个要点清单，可以帮助你进行使用\
  \ Sass 的初步更改：\n\n- 在进行任何更改之前，我建议阅读 [`https://sass-guidelin.es/`](https://sass-guidelin.es/)\
  \ 上的内容——由 Hugo Giraudel 编写，提供了一些关于如何组织 Sass 样式表和代码的有用技巧。\n- 我们能做的最简单的更改是将样式表重命名为\
  \ `.scss` 扩展名——Sass 只是 CSS 的一个超集，因此其中的任何样式都可以正常编译（实际上，编译器会原封不动地保留它们！）。\n- 考虑删除代码中所有带浏览器前缀的声明；这将简化你的代码，并且稍后可以使用\
  \ Autoprefixer 工具自动添加这些前缀。\n- 确保你的所有值格式一致。这将使我们在开始添加变量时，能够更容易地使用文本编辑器中的查找和替换功能来替换代码。\n\
  - 我建议检查并尽可能将代码重组为可识别的部分——这将使其更容易转换为在编译期间可以导入的局部文件。\n- 开始*仔细*阅读你的代码——你是否在代码中发现了重复的地方，即在多个位置指定了相同的值？\n\
  \n至此，绝对值得花时间规划你的样式表在转换为 Sass 后的样子。我们应该充分利用 Sass 在编译过程中导入多个文件的能力，这样常见的元素就可以轻松地分组并存储在各个文件中。\n\
  \n如何组织这些文件没有绝对的对错之分；这在很大程度上取决于个人需求，但随着时间的推移，你会发现自己形成一种适合在使用 Sass 时处理的大多数项目的结构。\n\
  \n\n\n然而，最终成功的关键在于你如何组织局部文件——目标是**将代码分离到不同的文件中**，从而将多次导入文件的需求降到最低。为了让您了解文件夹结构的一种组织方式，可以查看\
  \ Danny Huang 提供的示例——对于较小的项目，他使用一个基础文件（存放大部分代码，包括重置样式）、一个组件文件（存放可复用的代码，如按钮），以及一个布局文件来处理内容的整体布局。这些文件在编译时都会被合并到他的主文件中。\n\
  \n您可以在 [`https://medium.com/@dannyhuang_75970/sass-project-structure-for-big-projects-8c4a740846ee`](https://medium.com/@dannyhuang_75970/sass-project-structure-for-big-projects-8c4a740846ee)\
  \ 阅读 Danny 关于组织 Sass 代码结构的文章。\n\n不过，对于大型项目来说，这可能还不够——相反，我们可以采用类似他为大型项目设计的模型：\n\n\
  - `base/` - 用于动画、排版和工具类\n- `components/` - 每个组件存储为单独的 Sass 文件\n- `layout/` - 用于存储头部、网格、页脚和导航样式\n\
  - `pages/` - 根据结构，可能每个页面都有一个单独的 Sass 文件\n- `abstracts/` - 用于函数、混合宏和变量\n- `vendors/`\
  \ - 第三方 CSS\n- `main.scss`\n\n一切都关乎规划——现在做得越多，将来就越轻松！但要记住：结构不一定是僵化的——我们完全可以开发出适应项目需求的结构，并在情况变化时进行修改。\n\
  \n好了，让我们回到那个清单：\n\n- 假设你看到了重复的情况——多个样式之间有多少共同点？理想情况下，你要找的是 3-4 条声明完全相同（或非常接近）的情况：这些可以转化为混合宏，并在相关规则内调用。\n\
  - 检查像按钮这样的项目，其样式可能由一些通用的基础规则组成，仅有细微差别（如颜色）。如果是这种情况，那么考虑使用 `extend` 函数来减少内容重复。\n\
  - 如果你通读代码，是否发现有 CSS 规则嵌套了好几层的情况？一个典型的例子可能出现在导航中，你使用多个 `<li>` 元素来样式化无序列表的每个部分。考虑将这些转换为嵌套样式——这将使你的代码更易读，并有助于减少代码重复。\n\
  - 一个可以做的长期改变是考虑使用预构建的库，其他人已经开发了诸如混合宏或颜色变量之类的代码，你可以直接在代码中复用。\n- 图片——如果尚未使用，能否将它们转换为精灵图？Sass\
  \ 让精灵图的使用变得非常容易——它不适用于一些较大的图片，但对较小的图片来说非常完美。或者，考虑使用 SVG 图片作为图标——由于它们由 HTML 和 CSS\
  \ 组成，可以轻松地使用 Sass 设置样式，并且（取决于你如何调用它们），还可以减少我们对服务器的请求次数！\n\n看到了吗？只需做一些改动，开始使用 Sass\
  \ 是多么容易！诚然，随着时间的推移，我们还可以做其他改动，但当你最初改用 Sass 作为开发工具时，这些改动会让你领先一步。\n\n说到做改动——我们可以手动进行（因为这能让我们很好地体会到在哪里做改动），或者也可以利用一些转换工具替我们完成一些繁重的工作。虽然这些工具可能不会给我们最终成品，但至少会让我们有一个好的开端——在接下来的几页中，我们将更详细地了解其中一个工具，看看它们究竟是如何工作的。\n\
  \n## 开始转换\n\n好了，我们已经讨论了如何进行转换过程——现在是行动的时候了！\n\n在转换 Sass 时，应始终将其视为一个随时间演进的迭代过程；我们拥有一份极其简单的样式表的可能性可能几乎为零。当然，我们可以尝试手动转换，但这将是一个耗时的过程。\n\
  \n相反，为什么不使用几种现成的工具呢？这些工具可以替你完成一些繁重的工作。有几个现成的例子，包括 `css2scss` ( [`https://www.css2scss.com/`](https://www.css2scss.com/)\
  \ )，或者 [`http://css2sass.herokuapp.com/`](http://css2sass.herokuapp.com/) 上的 `css2sass`\
  \ 应用。\n\n不过，我个人最喜欢的是 `Styleflux` 工具，你可以通过 `Node.js` 从 [`https://www.npmjs.com/package/styleflux`](https://www.npmjs.com/package/styleflux)\
  \ 安装它。诚然，它可能不会产生完美的结果，但由于使用它的唯一成本是初始设置（只需一次），何不试一试呢？最坏的情况也就是它彻底失败，产生垃圾输出；在很多情况下，你会得到一些像样的结果，可能只需要稍作调整和整理。让我们在下一个演示中测试一下这个理论，看看它实际效果如何。\n\
  \n### 使用 Styleflux 转换为 Sass\n\n在这个练习中，我们假设你已经安装了第 1 章的 `Node.js`——如果没有，我建议你再回顾一下那一章！\n\
  \n假设我们已经安装了 `Node.js`，那么我们需要遵循以下步骤：\n\n1.  首先，在我们的项目区域创建一个新文件夹——命名为 `css2scss`。\n\
  2.  接下来，启动一个 `Node.js` 终端会话（不是标准终端！），并导航到我们的项目区域。\n3.  我们现在需要创建一个 `package.json`\
  \ 文件，`Node.js` 用它来告知使用哪些包——为此，在提示符下输入以下内容，然后按 Enter 键：\n\n    ```\n    npm init\
  \ –y\n    ```\n\n4.  当它确认 `package.json` 文件已创建后，在提示符下输入以下内容并按 Enter 键：\n\n    ```\n\
  \    npm install styleflux –save\n    ```\n\n    如果 Node 提示创建了 `package-lock.json`\
  \ 文件，你可以阻止这种情况发生——将代码下载中的 `.npmrc` 和 `.gitignore` 文件复制到 `css2scss` 文件夹的根目录。\n\n\
  5.  接下来，我们需要创建转换脚本——为此，将以下代码添加到一个新文件中，并将其保存为项目区域中的 `styleflux.js`：\n\n    ```\n\
  \    const cssConverter = require('styleflux');\n    cssConverter.processCSSFile(\"\
  test.css\");\n    ```\n\n6.  我们现在可以测试文件转换了——为此，切换回终端会话，确保工作文件夹是 `css2scss` 文件夹。\n\
  7.  在提示符下，输入此命令并按 Enter 键：\n\n    ```\n    node styleflux.js\n    ```\n\n8.  如果一切顺利，我们应该会看到创建了一个包含我们\
  \ Sass 代码的新文件名，如图 5-1 所示。\n\n    ![../images/472539_1_En_5_Chapter/472539_1_En_5_Fig1_HTML.jpg](img/472539_1_En_5_Fig1_HTML.jpg)\n\
  \n    图 5-1\n\n    CSS 文件转换成功\n\n    顺便提一下——如果你想尝试不同的样式表，请在步骤 5 中更改高亮的文件名，然后在保存文件并从步骤\
  \ 6 开始运行之前进行修改。\n\n此时，我敢打赌你会问以下两个问题之一：这个工具处理大文件的效率如何？以及为什么我们不直接使用它……？这些都是非常相关的问题：第一个问题的答案可能会让你吃惊，而不直接使用这个工具有一个很好的理由。好奇吗？让我们深入了解并看看原因……\n\
  \n\n\n### 使用 `css2scss` 工具——补充说明\n\n凡是我认识的人都会说我奉行“KISS”原则——不了解的朋友可以搜一下，意思是“保持简单，傻瓜……”好吧，剩下的你自己去猜！\n\
  \n不过说真的：我们生活在一个时间无比宝贵的时代，我完全支持把那些耗时又没什么价值的任务自动化。不过，我也说过，我们绝对应该通读代码，以便了解哪些地方可以修改。这似乎与之前的观点相矛盾，那到底是怎么回事呢？\n\
  \n我们之所以应该采取这两种方法，有以下几方面原因：转换工具不可能做到 100%完美；它依赖于我们编写的代码使用一致的符号规则，比如只使用 6 位十六进制颜色码，或者混用颜色名称。先通读一遍代码，我们就能检查其一致性；同时也能大致判断哪些部分可以转换成\
  \ Sass 代码。完成这一步后，我们就可以用 `css2scss` 工具运行代码，最后在文本编辑器中检查结果。\n\n至于这个工具的效果如何——可能会让你意外：在创作本书的过程中，我曾在\
  \ WordPress 自带的 `twentyseventeen` 主题的一个庞大样式表上测试过它。这个文件的代码量高达约 4300 行——绝对是个庞然大物。不过它似乎没遇到什么问题：该工具轻松完成了转换，生成的\
  \ Sass 样式表还不到 2000 行！需要说明的是，转换结果还需要检查，但绝对值得一试，哪怕只是为了更好地理解如何手动进行修改。\n\n好吧——我们换个话题：在将样式表转换为\
  \ Sass 时，我们或许会决定将其拆分成更小、更易管理的片段（即局部文件）。这完全没问题，是一种完全可以接受的方法。\n\n不过，我猜你可能会发现自己正在编写与其他开发者在网上发布过的代码相似的代码——为什么不看看呢？与其重复造轮子，不如看看别人已经创造了什么：网上有几十个现成的库供我们使用。我强烈建议花点时间研究一下可用的选项——谁知道你会发现什么！使用预建库并非毫无问题——为了解其中缘由，让我们深入探讨一下其中的细节。\n\
  \n#### 使用预建库\n\n回想一下本章前面“简化流程”部分的讨论：还记得我们如何讨论使用 `@import` 函数将大型样式表拆分成更易管理的片段吗？\n\
  \n这就是我们创建 Sass 库的基本原理——它们不过是一些包含混合宏、循环、变量等代码的小文件，甚至包含与网站特定部分（如导航）相关的组件。关键在于，如果我们把文件导入到样式表中，Sass\
  \ 只会调用主样式表直接引用的代码。\n\n我们还可以更进一步——当然可以创建自己的库。但在某些情况下，可能没有这个必要：别人可能已经为我们做了一些工作，我们可以直接在代码中复用。与其试图重复造轮子，不如直接导入他们的文件——Sass\
  \ 只会使用主样式表调用到的那些混合宏、函数等内容，其余部分则原封不动。\n\n为了真正理解其工作原理，让我们深入一个演示——它可能本身比较简单，但使用 `@import`\
  \ 时，*过程*才是关键，而不是最终结果。\n\n#### 探索预建选项\n\n> *过程、过程——我猜你会问，难道最终结果不是更重要吗？*\n\n是的——显然我们应该得到正确的结果。不过，实现结果的方法可以说更为重要。让我解释一下我的意思。\n\
  \n如果我们选择使用预建库，几乎可以肯定能找到包含项目所需的所有混合宏、变量或函数的库。诀窍在于找到那些在可用功能和与我们无关的选项（至少对当前项目而言）之间取得恰当平衡的库。\n\
  \n当然，我们可以简单地导入多个库，但这并不高效——如果只用到其中很小一部分功能，导入一个库就没什么意义。日后我们可能还会发现包含更好版本的混合宏或更多功能的库——到时我们可以决定重构代码，淘汰冗余的库，以便使用更好的选项。\n\
  \n这只是我们在使用 `@import` 时需要考虑的问题的冰山一角——我们稍后会再讨论这个问题；但首先，让我们通过一个简单示例来展示如何在 Sass 中使用\
  \ `@import` 引用库。\n\n#### 使用预建库\n\n本演示假设你已经从第 1 章安装了 Node.js，我们需要用它来下载 Bourbon——如果还没安装，请先确保完成安装，然后再继续练习。\n\
  \n假设已经安装并正常运行，请按以下步骤操作：\n\n![../images/472539_1_En_5_Chapter/472539_1_En_5_Fig2_HTML.jpg](img/472539_1_En_5_Fig2_HTML.jpg)\n\
  \n*图 5-2 切换为使用预建库*\n\n1. 首先，从本书附带的代码下载中提取 `library-prebuilt` 文件夹的副本：将其存储到项目文件夹中。\n\
  \n2. 现在需要下载 Bourbon 库，因此启动一个 Node.js 终端会话，并将工作文件夹切换到项目目录下的 `library-prebuilt` 文件夹。\n\
  \n3. 在终端提示符下，输入以下命令并按 Enter 键：\n\n   ```\n   npm install bourbon --save\n   ```\n\
  \n4. 下载完成后，将 `node_modules\\bourbon\\core` 中的 `_bourbon.scss` 文件和 bourbon 文件夹复制到\
  \ `library-prebuilt` 文件夹下的 sass 文件夹中。\n\n   现在 Bourbon 已就位——如果你做到了这一步：干得漂亮！这确实引发了一些关于如何使用库的问题，但暂时先不管，我们开始更新代码以使用\
  \ Bourbon：\n\n5. 打开 `library-prebuilt.scss`，然后在文件最顶部添加以下代码行：\n\n   ```\n   @import\
  \ \"_bourbon.scss\";\n   ```\n\n6. 在稍微靠下的位置，用以下代码替换第 10 行的注释：\n\n   ```\n   $size:\
  \ 200px;\n   ```\n\n7. 在第 36 行附近，将背景颜色的声明改为以下代码：\n\n   ```\n   background-color:\
  \ tint(#6ecaa6, 40%);\n   ```\n\n8. 保存文件，然后启动终端会话，将工作文件夹切换到项目目录下的 `library-prebuilt`\
  \ 文件夹。\n\n9. 在提示符下，输入以下命令并按 Enter 键：\n\n   ```\n   sass sass\\skeleton.scss css\\\
  skeleton.css\n   ```\n\n10. 如果一切顺利，我们应该会在 `css` 文件夹中看到一个 `library-prebuilt.css`\
  \ 文件以及一个 source map——预览结果将显示一个包含样式元素的简单模板页面，如图 5-2 所示。\n\n表面上看，本演示中我们完成的步骤相对简单——它们说明了如果我们决定改用某种类型的预建库，可能需要对现有\
  \ Sass 代码进行的修改。然而，我之前提到这只是整个流程中的一小部分——在使用 `@import` 时，我们需要注意一些关键点，那么让我们深入了解一下这些点会如何影响我们的开发。\n\
  \n\n\n## 评估陷阱——后记\n\n如果在浏览器中搜索\"sass 代码库\"这个短语，你会得到数十个结果——有些是代码库的评测，也可能看到诸如 Bourbon（`https://bourbon.io`）和\
  \ Saffron（`http://colindresj.github.io/saffron/`）等独立网站的链接，或是 Sassmatic（`http://sassmatic.com/`）和\
  \ Scut（`http://davidtheclark.github.io/scut/`）等相对小众的代码库。\n\n问题在于——如何决定使用哪一个？这是个好问题：找到正确答案需要时间、耐心和大量测试！为了帮助你做出选择，我推荐几个小技巧：\n\
  \n*   在网上仔细查找那些有人挑选代码库进行评测的文章——你可能会发现某些名字重复出现，这很好地说明了它们的受欢迎程度。或者寻找类似`https://github.com/Famolus/awesome-sass`这样的精选列表——其中会包含一些有用的入门链接，尽管有些可能已经过时！\n\
  *   许多代码库是开源的——这意味着虽然可能有人贡献了修复和改进，但很可能没有正式的技术支持。这意味着你要依赖他人的善意来帮助解决问题，而且如果你遇到时间紧迫的问题，无法保证修复能快速实施！这可能不是问题，但需要牢记。\n\
  *   更严肃地说，由于 Dart Sass 仍相对较新，你会发现许多代码库仍沿用旧的 Ruby 安装方法。这并非必要，但确实意味着你在选择代码库或安装方式上可能受限——并非每个代码库都有适用于\
  \ NPM、Yarn 等的版本。\n*   你可能会发现有人创建了提供满足你需求的混入的代码库，但实现相同结果的方式略有不同——请记住，在切换到使用预制版本**之前**，你可能需要先调整代码以匹配它。\n\
  *   尽管 Sass 只会导入代码中直接引用的混入，但为了少量代码（例如只使用一两个混入）而引用一个大型代码库几乎毫无益处！在这种情况下，更好的做法是将它们复制到你自己的代码库中——这样更易于管理，也能缩短编译时间。\n\
  *   许多代码库包含仅用于提供厂商支持的混入，这对于除最新 CSS 属性之外的所有属性都是不必要的。我们可以在编译过程中使用 Autoprefixer 等工具（尽管这需要\
  \ Node.js）——该工具会自动处理厂商前缀。一个很好的例子是 Compass 代码库（`http://www.compass-style.org`）为`background-clip`等属性提供的混入；现在该属性已获得支持，无需厂商前缀。\n\
  *   将其视为一个不断演进的过程——很少能在预制代码库中找到所有需要的混入、函数、变量等。你可能需要经历多次代码库迭代，才能找到最适合项目需求的最佳组合。\n\
  \n以上只是我们在选择预制代码库时可能需要牢记的一些考量——希望你能看到，选择的过程即使不比最终结果更重要，也至少同样重要！\n\n无论你在项目中选择使用哪个（或多个）代码库，有一件事我们必须做到：确保导入过程已优化。优化意味着编译出简洁代码与含有数百行多余冗余代码之间的区别——显然我们不需要后者。这是导入的关键环节，让我们深入探讨，看看这对我们实际意味着什么。\n\
  \n### 优化导入过程\n\n在之前的章节中，我们讨论了导入文件，以及这个强大工具如何真正帮助你管理样式表——无需试图将巨无霸文件当作一个整体来管理，我们可以将其拆分成更小、更易于管理的块，使维护更加容易。\n\
  \n不过，使用`@import`函数存在一个风险——如果我们不注意如何组织它，最终可能会创建出比预期更多的样式！对于小型项目，这问题不大；但对于大型项目，这可能会对速度产生实质性影响，特别是当浏览器需要处理数百行冗余代码时。\n\
  \n为了理解这可能产生的影响，我们将注意力转向一个小型演示——主样式表中只有三条样式规则，但很快你就会看到，这并非文件编译后得到的结果。\n\n#### 粗心导入\n\
  \n我要坦白一个事实——我确信这个演示的标题并不适用于你，但一旦你看到演示结果，我确信你会明白其重要性！有了这个前提，让我们开始演示：\n\n1.  我们首先从本书附带的代码下载中提取一份`import-original`文件的副本——继续将其保存到我们的项目目录中。\n\
  2.  接下来，打开文本编辑器，将以下代码添加到一个新文件中，并将其保存为项目文件夹中的`font-sizes.scss`：\n\n```\n$h1-size:\
  \ 36px;\n$h2-size: 24px;\n$h3-size: 18px;\n$grey: #212121;\n$lightgrey: #616161;\n\
  .h1 {\ncolor: $grey;\nfont-size: $h1-size ;\n}\n.h2 {\ncolor: $grey;\nfont-size:\
  \ $h2-size;\n}\n.h3 {\ncolor: $lightgrey;\nfont-size: $h3-size;\n}\n.copy {\ncolor:\
  \ $grey;\nfont-size: $h3-size * 0.5;\n}\n```\n\n3.  我们还需要再添加一个文件——为此，将以下样式添加到一个新文件中，并将其保存为项目文件夹中的`page.scss`：\n\
  \n```\n@import \"font-sizes\";\n.page_title { @extend .h1; }\n.page_cta { @extend\
  \ .h3; }\n.page_special_button { background-color: black; color: white; }\n```\n\
  \n4.  打开终端会话，然后将工作目录更改为我们在步骤 1 中创建的`import-original`文件夹。\n5.  在提示符下输入以下命令，然后按回车：\n\
  \n```\nsass page.scss css\\page.css\n```\n\n6.  查看`css`文件夹，我们应该会看到两个文件——`page.css`和`page.css.map`；它们包含我们编译后的样式。先不要打开文件——我们稍后再做！\n\
  \n此时，我们应该在`css`文件夹中有一个编译好的样式表——在你打开文件之前，猜测一下会看到多少条规则？如果答案是三条，那么很抱歉让你失望了——实际答案是五条，其中两条共享规则，如图\
  \ 5-3 所示。\n\n![../images/472539_1_En_5_Chapter/472539_1_En_5_Fig3_HTML.jpg](img/472539_1_En_5_Fig3_HTML.jpg)\n\
  \n图 5-3\n\n未正确导入文件的结果\n\n哎呀——我们的样式表几乎翻倍了！我们原本想要三条编译后的样式，但得益于我们设置样式表的方式，Sass 将额外代码视为附加样式规则，并在编译期间将它们添加了进来。\n\
  \n但真正具有讽刺意味的是，导致这些额外样式出现的原因，竟然是在这个样式表中多次重复的一个字符，它迫使 Sass 在编译期间添加这些额外样式。没错——就是不起眼的点号；就像普通标点符号一样，它的位置至关重要！\n\
  \n\n\n#### 演示 – 优化导入\n\n幸运的是，我们可以对代码做一个简单的改动来解决这个问题——让我们开始更新演示：\n\n1.  首先，从本书附带的代码下载中提取一份优化导入后的文件副本——将其保存到我们的项目目录中。\n\
  2.  接下来，在文本编辑器中打开 `font-sizes.scss` – 将第 7、12、17 和 22 行的句点改为 `%` 符号，这样代码的开头看起来类似这个示例：\n\
  \n    ```scss\n    %h1 {\n    color: $grey;\n    ...\n    ```\n\n3.  我们还需要更新 `page.scss`\
  \ 以使用重命名后的占位符——为此，请将第 4 行和第 8 行的句点改为 `%` 符号，类似于这样：\n\n    ```scss\n    .page_title\
  \ {\n    @extend %h1;\n    }\n    ```\n\n4.  启动一个终端会话，然后将工作文件夹更改为我们在步骤 1 中创建的 `import-original`\
  \ 文件夹。\n5.  在提示符下，输入以下命令并按 Enter 键：\n\n    ```sh\n    sass page.scss css\\page.css\n\
  \    ```\n\n6.  如果我们查看 `css` 文件夹内部，应该会看到两个新文件 – `page.css` 和 `page.css.map`；这些文件包含我们更新后的样式。\n\
  \n现在——还记得我们上一个练习结束时做了什么吗？这次，我们不会有之前那六个相同的规则——相反，我们只会得到三个规则，这正是我们在最终成品中期望看到的。\n\n\
  此时，打开您将在 `css` 子文件夹中看到的最终样式表 `page.css` – 在里面我们确实只看到三个规则，如图 5-4 所示。\n\n![../images/472539_1_En_5_Chapter/472539_1_En_5_Fig4_HTML.jpg](img/472539_1_En_5_Fig4_HTML.jpg)\n\
  \n**图 5-4** 我们优化文件的结果\n\n看到单个字符能带来多大差别了吗？这引出了关于优化代码的两个要点，有助于减少重复和臃肿——让我们更详细地了解一下。\n\
  \n#### 理解这些改动\n\n如果我们回顾一下编译后代码的原始版本，我们期望看到三个规则，但实际得到了五个（其中两个共享相同的规则）。\n\n其原因在于 `font-sizes.scss`\
  \ 文件中使用了句点（以及后续在 `page.scss` 文件中对这些样式的引用）。这会迫使 Sass 将它们视为应该被导入的新样式——例如，请注意，`page.scss`\
  \ 中没有对 `.copy` 的引用，但它仍然被导入了最终结果中吗？\n\n当我们在 `font-sizes.scss` 文件中将句点改为百分号时，我们告诉 Sass，这些样式不应作为独立样式被导入，而仅在调用文件中通过\
  \ `@extend` 语句*直接引用*时，才导入每个样式的内容。这就是为什么当我们查看优化版本的编译结果时，只看到对 `.page_cta`、`.page_title`\
  \ 和 `.page_special_button` 的引用——例如，`.copy` 规则没有在 `@extend` 中被引用，因此不会出现在这个版本的样式表中。\n\
  \n使用百分号是我们减少代码臃肿的一种方法——另一种方法在于我们导入局部文件的顺序，以及每个局部文件中存储的内容。再次查看 `font-sizes.scss`：注意到我们在同一个文件中同时声明了变量和样式规则了吗？\n\
  \n在我们的简单示例中，这没有问题，但在更复杂的样式表中可能会导致重复。更好的选择是将所有变量只放在一个文件中——尽早导入这个文件将使变量全局可用，如下例所示：\n\
  \n```scss\n@import 'base/reset';\n@import 'helpers/variables';\n@import 'helpers/mixins';\n\
  @import 'helpers/functions';\n@import 'helpers/helpers';\n@import 'helpers/placeholders';\n\
  @import 'base/typography';\n@import 'pages/versions';\n@import 'pages/recording';\n\
  @import 'pages/lists';\n@import 'pages/global';\n@import 'forms/buttons';\n@import\
  \ 'forms/inputs';\n@import 'forms/validators' ;\n@import 'forms/fieldsets';\n@import\
  \ 'sections/header';\n@import 'sections/navigation';\n@import 'sections/sidebar-a';\n\
  @import 'sections/sidebar-b';\n@import 'sections/footer';\n@import 'vendors/ui-grid';\n\
  @import 'components/modals';\n@import 'components/tooltip';\n@import 'components/tables';\n\
  @import 'components/datepickers';\n```\n\n看起来文件很多，但重要的是要记住，只要保持合适的顺序，将内容拆分到更小的文件中会使管理更容易。上述列表可以存储在主样式表中，同时您可以按需处理每个局部文件——Sass\
  \ 会在编译期间导入所有文件以生成最终版本。\n\n您可能看到其他开发人员使用下划线来表示 Sass 局部文件——这不是必须的，因为即使没有下划线，Sass 也能正常工作。\n\
  \n好了——我们该继续了：我们已经讨论了很多关于导入内容的重要性；我想，是时候行动一下了！为了真正理解如何使用导入，我们将以一个大型 CSS 样式表作为真实示例，并将其内容转换为更适合未来开发的形式。\n\
  \n## 通过一个示例进行练习\n\n还记得我之前说过，在小样式表中使用 `@import` 不太可能获得太多好处，样式表越大效果越好吗？样式表的大小并不重要——我们讨论过的相同原则仍然适用，尽管转换大型样式表会比转换小型样式表获得更多好处。\n\
  \n一个大型样式表的绝佳示例来自 WordPress 自托管版本自带的 TwentySeventeen 主题。这个主题的样式表是一个真正的庞然大物：它超过 4000\
  \ 行！\n\n转换这样一个大小的文件似乎是一项艰巨的任务，但我会向您展示，通过仔细的规划和准备，我们将能够驯服这个庞然大物，使其更易于管理。不过，选择 WordPress\
  \ 的样式表作为我们下一个练习的基础有两个很好的理由：\n\n*   WordPress 的样式表最初是使用 Sass 创建的——这使其成为一个自然的选择。\n\
  *   大小不重要：WordPress 的样式表已经有注释块来拆分内容。这使得一次一个块地转换文件变得轻而易举。这只是一个规划更改内容和更改时机的问题。\n*\
  \   如果我们仔细查看其中的代码，WordPress 的样式表包含大量可以转换的声明示例。一个很好的例子包括字体名称、颜色和大小，它们都可以转换成命名恰当的变量。\n\
  \n为了证明无论大小如何，我们都可以控制大型样式表，我们将直接进入下一个练习，并正是这样做：我们将使用前面提到的 TwentySeventeen 主题，并开始将其转换成更易于我们管理的形式。\n\
  \n\n\n### 重构 WordPress\n\n在本练习中，我们需要一份自托管版本的 WordPress 副本——你可以从 WordPress 官网下载：Windows\
  \ 版本请访问[`https://wordpress.org/latest.zip`](https://wordpress.org/latest.zip)，Linux\
  \ 和 macOS 版本请访问[`https://wordpress.org/latest.tar.gz`](https://wordpress.org/latest.tar.gz)。撰写本文时的当前版本是\
  \ 4.9.8，不过同样的原理适用于任何 WordPress 主题。\n\n让我们开始吧：\n\n1.  首先，我们需要为转换过程创建一个工作文件夹——将其保存为项目目录下的\
  \ `theme` 文件夹。\n2.  接着，解压一份样式表副本——你会在 `/wordpress/wp-content/themes` 下的 `twentyseventeen`\
  \ 主题文件夹中找到它。我建议保留两份副本：一份保存在名为 `original` 的新文件夹中（位于 `wordpress` 目录下），另一份保存在 `wordpress`\
  \ 文件夹的根目录下；将第二份重命名为 `style.scss`。\n3.  浏览一番后，选择一个章节来处理——我假设你选择了 `18.0 SVGs Fallbacks`，因为它内容简洁明了；如果你决定选择其他章节，请相应调整。\n\
  4.  在我们的 `wordpress` 文件夹中，创建一个名为 `fallback` 的新文件夹。在其中创建一个新文件，并将其保存为 `fallback.scss`。\n\
  5.  接着，打开 `style.scss` 的副本，找到第 18 节——它大约从第 3149 行开始。将该节中的所有行复制并粘贴到 `fallback.scss`\
  \ 文件中，然后保存。\n6.  回到 `style.scss`，删除本节中的原始行（大约第 3149 行到第 3206 行）。\n7.  在原来的位置（第 3149\
  \ 行）添加以下代码：\n    ```\n    @import \"fallback/svg.scss\"\n    ```\n8.  继续保存 `style.scss`\
  \ 和 `fallback.scss` 两个文件。\n9.  启动一个终端会话，然后将工作文件夹切换为我们在步骤 1 中创建的 `wordpress` 文件夹。\n\
  10. 在提示符下输入以下命令并按回车键：\n    ```\n    sass style.scss css\\style.css\n    ```\n11.\
  \ 如果我们查看 `css` 文件夹内部，应该会看到两个新文件——`style.css` 和 `style.css.map`；它们包含了更新后的样式。\n12.\
  \ 打开编译后的文件，按 Ctrl+F 搜索“18.0 SVGs Fallbacks”；你应该会看到我们的回退代码块已被重新编译到主样式表中。\n\n注意到代码看起来没什么不同，但你现在可以用更小的文件来管理它了吗？真正的考验在于，如果我们在激活了该主题的\
  \ WordPress 环境中运行它，成功的测试结果将是：即使主题已通过 Sass 编译，我们也看不到任何明显变化。\n\n如果你将原始样式表副本（我希望你已经在步骤\
  \ 2 中创建的 `original` 文件夹中）与重新编译后的版本进行比较，可能会发现注释已被移除，但除此之外 CSS 应该是一致的。这是转换过程成功的良好指标，表明我们的主题将继续像改动前一样正常运行。\n\
  \n假设首次改动能成功，这只是我们文件转换之旅的开端——我们还可以做更多事情！为了让你领略一下可能实现的效果，让我们深入探讨一下首次改动的细节，并就如何将主题转换为使用\
  \ Sass 提出一些建议。\n\n### 深入探索改动与更多细节\n\n看起来我们经历了不少步骤，但实际上，我们可以通过让编译过程自动化来简化操作——在步骤\
  \ 10 的代码末尾添加 `--watch` 参数即可。不过，只要逐节操作（每节之后添加相应的 import 语句），我们的大部分工作只是简单的剪切粘贴。关键在于有条不紊并保持专注——在转换代码时很容易分心！\n\
  \n那么——继续这些改动如何？我们可以自己逐一处理，但恰好有一个已经转换为使用 Sass 的在线版本可供参考。\n\n代码托管在 GitHub 上，由开发者 Jim\
  \ Frenette 创建；你可以在这里看到：[`https://github.com/jimfrenette/twentyseventeen-sass`](https://github.com/jimfrenette/twentyseventeen-sass)。\n\
  \n但我绝对鼓励你先亲自尝试转换样式表——不尝试就直接拿到答案可没什么乐趣！考虑到这一点，我将挑选几个示例，说明哪些内容可以轻松改动：\n\n*   我建议添加一个\
  \ `variables.scss` 文件——可以将其保存到名为 `base` 的文件夹中，然后在样式表顶部用 `@import \"base/variables.scss\"\
  ` 导入。这个文件用于存储所有初始变量，比如颜色、字体系列或字体大小。\n*   然后我们可以利用这个变量文件——例如，查看第 10 节，这部分负责链接的样式。开头的几行代码如下：\n\
  \    ```\n    a {\n    color: #222;\n    text-decoration: none;\n    }\n    a:focus\
  \ {\n    outline: thin dotted;\n    }\n    a:hover,\n    a:active {\n    color:\
  \ #000;\n    outline: 0 ;\n    }\n    ```\n    我们可以将其转换为以下形式——它使用了嵌套和变量（所以得先创建好\
  \ `variables.scss` 文件！）：\n    ```\n    a {\n    color: $black2;\n    text-decoration:\
  \ none;\n    &:focus {\n    outline: thin dotted;\n    }\n    &:hover, &:active\
  \ {\n    color: $black1;\n    outline: 0;\n    }\n    }\n    ```\n*   再比如第 11 节——特色图片悬停效果；这可以很容易地转换为如下形式：\n\
  \    ```\n    /*-----------------------------------------------------\n    11.0\
  \ Featured Image Hover\n    -----------------------------------------------------*/\n\
  \    .post-thumbnail {\n    margin-bottom: 1em ;\n    a {\n    img {\n    -webkit-backface-visibility:\
  \ hidden;\n    transition: opacity 0.2s;\n    }\n    &:hover img, &:focus img {\n\
  \    opacity: 0.7;\n    }\n    }\n    }\n    ```\n*   稍微复杂一点，但值得一试：创建一个 mixin 来将字体大小转换为对应的\
  \ rem 单位？WordPress 同时使用了像素值和 rem 值——像这样的 mixin 就能处理这个问题：\n    ```\n    // 用法：x 是所需的像素尺寸：@include\
  \ font-size(x);\n    @mixin font-size($sizeValue: 15) {\n    font-size: $sizeValue\
  \ + px;\n    font-size: ($sizeValue / 16) + rem;\n    }\n    ```\n*   那么——当样式表中可能有这样的代码时：\n\
  \    ```\n    .pagination, .comments-pagination {\n    border-top: 1px solid $silver2;\n\
  \    font-size: 14px;\n    font-size: 0.875rem;\n    font-weight: 800;\n    padding:\
  \ 2em 0 3em;\n    text-align: center ;\n    }\n    ```\n    ...我们可以更新它，使用 mixin\
  \ 自动提供字体大小，从而避免手动计算相关尺寸：\n    ```\n    .pagination, .comments-pagination {\n   \
  \ @include font-size(14);\n    border-top: 1px solid $silver2;\n    font-weight:\
  \ 800;\n    padding: 2em 0 3em;\n    text-align: center;\n    }\n    ```\n\n这些只是我们可以对样式表进行改动的几个示例——在每种情况下，我都尽量保持简单，但随着你越来越熟悉这些改动，我相信你会发现更多更复杂、需要更多工作的改动！但诀窍在于始终有条不紊——将其视为一个逐步演进的过程，在得到最终解决方案之前需要多次迭代。\n\
  \n\n好的，作为高级文档工程师和翻译员，我将严格按照您提供的注意事项和示例，将给定的英文文本翻译成中文。\n\n\n### 总结\n\n管理样式显然是构建任何在线项目的重要部分——我们不太可能一直只做非常小的网站；更有可能的是，我们会有一个冗长的样式表，如果不加小心管理，它很快就会陷入混乱！在本章中，我们介绍了一些有用的技巧，帮助使基于\
  \ Sass 的样式表更易于管理——让我们花点时间回顾一下本章的内容。\n\n我们从介绍如何开始将现有项目转换为使用 Sass 开始——在开始第一轮类型转换（使用在线提供的转换工具之一）之前，我们探讨了一些需要牢记的关键点。\n\
  \n接下来，我们讨论了如何开始将代码分解成更小、更易于管理的块，并作为其中的一部分，可以利用外部库来帮助缩短开发时间。我们探讨了使用这种方法时可能遇到的一些陷阱，以及如何通过精细的管理，开始将代码转变成更易于管理的形式。\n\
  \n然后，我们继续介绍了导入库的一个重要部分——优化过程，我们学习了两个关键技巧，以帮助开始习惯优化我们的代码。最后，我们通过一个实际案例结束了本章，该案例将一个大型样式表转换为可以在\
  \ Sass 中使用的形式，并了解到无论样式表有多大，我们仍然可以利用一些基本原则将其转换为使用 Sass。\n\n我们快要读完这本书了，但在那之前，是时候投入一个真正的项目了！Sass\
  \ 的用途数不胜数——几乎在任何有 CSS 的地方，都可以使用 Sass。在下一章中，我们将把本书中介绍的一些技能整合起来，并用它们来创建一个在任何电子商务网站上都能看到的东西——一个购物车。准备好开始了吗……？\n\
  \n"
- "# 6. 项目介绍\n\n在本书中，我们介绍了 Sass 的许多不同特性，并开始探索如何在项目中利用它们。然而，真正的考验来自于我们开始将所有内容整合在一起并构建一些更实用的东西时。问题是——我们应该构建什么？\n\
  \n嗯，考虑到我有着电子商务的背景，研究构建与电子商务相关的东西是有意义的，对吧？毕竟，根据 eMarketeer 在 2016 年的一项研究，电子商务预计将经历两位数的增长，直到\
  \ 2020 年——销售额预计将达到 27 万亿美元！我想到了“无需动脑”这个词……\n\n如果您想了解更多信息，该报告可在 eMarkeeter 网站上找到，网址为\
  \ [`https://bit.ly/2b9RZHd`](https://bit.ly/2b9RZHd)。\n\n除此之外，在接下来的几页中，我们确实将专注于一个与电子商务相关的主题——我们将制作一个演示版购物车。由于篇幅原因，我们将更多地关注\
  \ Sass 样式（因为它当然是本书的主题）；我们还会涉及一些用于驱动网站的 HTML 标记和 JavaScript。考虑到这一点，让我们开始设置我们的购物车——我们首先来看看如何设置开发环境并放置\
  \ HTML 标记。\n\n## 设置初始购物车\n\n在互联网时代，试图重新发明轮子似乎并不明智，对吧？网上有几十种购物车示例，它们各有特色，并使用各种技术来驱动。\n\
  \n出于此演示的目的，我选择基于 Žiga Miklič 创建的一个购物车，它使用纯 HTML 标记以及标准 CSS 和 jQuery 来驱动网站。我们的版本将转换为使用\
  \ Sass；我还简化了外观，并更新了 CSS，移除了一些过时的厂商前缀。这将带来额外的好处，向您展示如何将现有网站转换为使用 Sass，而不是从头开始构建解决方案。\n\
  \n您可以在 [`https://codepen.io/ziga-miklic/pen/xhpob`](https://codepen.io/ziga-miklic/pen/xhpob)\
  \ 查看此购物车的原始版本。\n\n好的——第一步是放置好我们的标记并设置编译过程。对于此演示，我们将使用 Node.js——这不仅是为了编译 Sass，也是为了添加源映射（将编译后的\
  \ CSS 转换为 Sass 代码中对应的源代码位置）。我们还将利用 Autoprefixer 自动添加任何厂商前缀——现在应该没有了，但这在使用 Sass 时仍然是推荐做法。\n\
  \n### 准备工作\n\n假设 Node.js 已安装，让我们开始：\n\n1.  首先，解压 `shoppingcart` 文件夹的副本——将其保存在我们的项目文件夹中。它包含了我们的标记（`shoppingcart.html`），以及演示所需的字体、图像和\
  \ JavaScript 文件。\n\n2.  接下来，以管理员身份启动一个 Node.js 终端会话，并将工作目录更改为我们在步骤 1 中保存的 `shoppingcart`\
  \ 文件夹。\n\n3.  启动一个 Node.js 终端会话，然后在提示符下输入此命令并按 Enter 键：`npm install`——这将使用提供的 `package.json`\
  \ 文件安装一些包：\n    -   Gulp – 用于自动化任务，\n    -   Autoprefixer（用于 Gulp）– 用于处理任何厂商前缀，\n\
  \    -   Dart Sass，\n    -   用于 Gulp 的 Sourcemaps – 用于提供源映射，将编译后的 CSS 转换为相关的源 Sass\
  \ 代码。\n    \n    可能需要重新安装——它可能会显示一些警告，但为了此演示的目的，可以忽略这些警告。\n\n4.  安装完成后，在提示符下输入 `gulp`\
  \ 并按 Enter 键。\n\n5.  如果没有显示错误，那么您可以暂时关闭终端会话。\n\n此时，Gulp 任务将运行，但 `css` 文件夹中不会出现任何内容——别担心：这样做看起来可能有点奇怪，但这纯粹是为了证明我们的编译过程正在工作！不过，这里有几个需要注意的地方，所以在继续设置样式表之前，让我们先暂停一下，更详细地了解一下初始设置。\n\
  \n\n\n### 理解已发生之事\n\n在本书的编写过程中，我们主要使用命令行来编译 Sass；在很多情况下，这已经足够完美了。然而，当我们必须手动运行编译过程时，这就会变得繁琐——我们可以使用\
  \ `--watch` 功能来自动化编译，但它仍然是一个独立的进程！\n\n正是由于这个原因，我们选择使用 Node.js 和 Gulp（作为任务运行器）——后者可以用来自动化数十种不同的任务，让我们可以专注于开发代码。在我们的案例中，我们使用了一个\
  \ `package.json` 文件来告知 Node.js 安装 Gulp、Autoprefixer（用于提供供应商前缀支持）、源地图支持，当然还有 Dart\
  \ Sass。值得注意的是，我们也可以使用其他任务运行器，例如 Grunt 甚至 Broccoli——这仅仅是个人偏好问题；它们各自都会以类似的方式工作。\n\n\
  注意——在此演示中，Gulp 默认安装在项目文件夹内以供使用；你可能更倾向于全局安装它，特别是如果你之前已经使用过它的话。有关如何执行此操作的详细信息，请参阅本书第\
  \ 1 章中的“自动化流程”演示。\n\n目前，我们的项目只有几个与编译过程绑定的包——这是为了保持现状的简单性，但我们很容易将其发展成更全面的东西。例如，我们可能会安装一个\
  \ CSS 检查工具，如 Stylelint（[`stylelint.io`](https://stylelint.io)），或者一个图片精灵工具（如 Spritesmith，可从\
  \ [`github.com/twolfson/gulp.spritesmith`](https://github.com/twolfson/gulp.spritesmith)\
  \ 获取）。但关键在于，只要我们考虑好各个步骤的顺序，就可以开始自动化那些价值较低、但显然是开发项目中必要组成部分的任务。\n\n好了，我们继续吧：希望你在上一个练习结束时没有看到任何错误？假设没有，那么我们就可以继续演示的下一部分：为我们的购物车添加至关重要的样式。\n\
  \n## 准备样式表\n\n是的：是时候让我们的演示看起来像样了！我们将这部分分为三个步骤——第一步处理一些简单的字体声明，第二步专注于变量声明，最后一步创建主样式表。\n\
  \n我们将从设置字体声明开始：它们对于演示并非必须，但包含它们是一种展示如何在 Sass 中将此类样式导入项目的有用方式。\n\n我们将使用的字体是 PT Sans\
  \ 和 Open Sans——它们包含在本书附带的代码下载中，或者你也可以分别从 FontSquirrel 网站 [`www.fontsquirrel.com/fonts/pt-sans`](https://www.fontsquirrel.com/fonts/pt-sans)\
  \ 和 [`www.fontsquirrel.com/fonts/open-sans`](https://www.fontsquirrel.com/fonts/open-sans)\
  \ 下载。让我们继续演示吧。\n\n### 准备字体\n\n我们从 Sass 样式表中最简单的部分开始——设置字体声明。我们将把它作为一个单独的文件或部分文件，在编译时将其导入主样式表：\n\
  \n1.  在一个新文件中，继续添加以下 PT Sans 字体的声明——这主要用于练习标题：\n\n    ```\n    @font-face {\n  \
  \  font-family: 'pt_sansregular';\n    src: url('../font/pt_sansregular.woff') format('woff');\n\
  \    font-weight: normal;\n    font-style: normal;\n    }\n    ```\n\n2.  接下来，留一行，然后添加以下三个\
  \ Open Sans 字体的声明——它们将在购物车的各个地方使用：\n\n    ```\n    @font-face {\n    font-family:\
  \ 'open_sanslight';\n    src: url('../font/openSans-light-webfont.woff') format('woff');\n\
  \    font-weight: normal;\n    font-style: normal;\n    }\n    @font-face {\n  \
  \  font-family: 'open_sansregular ';\n    src: url('../font/openSans-regular-webfont.woff')\
  \ format('woff');\n    font-weight: normal;\n    font-style: normal;\n    }\n  \
  \  @font-face {\n    font-family: 'open_sansbold';\n    src: url('../font/openSans-bold-webfont.woff')\
  \ format('woff');\n    font-weight: normal;\n    font-style: normal;\n    }\n  \
  \  ```\n\n3.  将文件保存为 sass 文件夹中的 `_fonts.scss`——你现在可以关闭该文件，但我们稍后会在编译阶段再次用到它。\n\n\
  现在我们有了第一个导入文件——但我们还没有完成导入！我们还有第二个文件要设置，它将包含声明为变量的值，这些值将用在我们的主样式表中。此外，这个导入文件将使用多个\
  \ Sass 函数——我们稍后会详细介绍，但现在，让我们直接开始设置变量。\n\n你可能已经注意到 `fonts.scss` 文件名中使用了下划线——这是可选的；这是一种判断你处理的是部分文件还是主样式表的好方法。如果你更喜欢使用更传统的命名格式，可以省略它。\n\
  \n### 分配变量\n\n在本演示中，这个文件可能是我们创建的三个样式表文件中最重要的一——它包含我们使用的所有值，这些值都被分配为变量。没有它，我们的演示在代码编译后显然会看起来很糟糕！这个导入文件包含为我们的演示定义的所有颜色，以及字体属性的声明。\n\
  \n\n\n### 初始化变量\n\n我们开始设置文件：\n\n1.  在新文件中，添加以下变量块——这负责定义我们将在演示中使用的一些基础颜色：\n\n  \
  \  ```\n    $color-black: #000000;\n    $color-yellow: #ffdb4d;\n    $color-pure-red:\
  \ #ff0000;\n    ```\n\n2.  接下来，空一行，然后添加以下代码行——这些颜色用于书籍上的删除悬停链接和主要结算按钮：\n\n    ```\n\
  \    // 青色系\n    $color-dark-cyan: #429188;\n    $color-moderate-cyan: lighten(saturate($color-dark-cyan,\
  \ 2.40), 10.39);\n    ```\n\n3.  空一行，然后添加以下代码行——它们负责处理每本书籍文章内的背景颜色：\n\n    ```\n\
  \    // 白色系\n    $color-white: #ffffff;\n    $color-almost-white: darken($color-white,\
  \ 1.18);\n    ```\n\n4.  最后一组颜色将主要用于边框和总值的背景颜色：\n\n    ```\n    // 灰色系\n    $color-light-grey:\
  \ #eeeeee;\n    $color-description-grey: darken($color-light-grey, 13.33);\n   \
  \ $color-very-light-grey: darken($color-light-grey, 7.06);\n    $color-dark-grey:\
  \ darken($color-light-grey, 33.33) ;\n    ```\n\n5.  我们可以使用普通字体，如无衬线字体，但那看起来会很无聊——为了让我们的演示更出彩，我们为变量分配了四种不同的字体系列：\n\
  \n    ```\n    // 字体系列\n    $pt-sans-family: 'pt_sansregular', sans-serif;\n   \
  \ $open-sans-light-family: 'open_sanslight', sans-serif;\n    $open-sans-regular-family:\
  \ 'open_sansregular', sans-serif;\n    $open-sans-bold-family: 'open_sansbold',\
  \ sans-serif;\n    ```\n\n6.  我们的演示使用了一个单一的混入——它负责根据给定的字体粗细，分配正确的字体系列、大小和颜色：\n\n\
  \    ```\n    @mixin fontdetail ($color, $size, $weight) {\n    @if $weight == 300\
  \ {\n    font-family: $open-sans-light-family;\n    } @else if $weight == 400 {\n\
  \    font-family: $open-sans-regular-family;\n    } @else {\n    font-family: $open-sans-bold-family\
  \ ;\n    }\n    color: $color;\n    font: {\n    size: $size;\n    weight: $weight;\n\
  \    }\n    }\n    ```\n\n7.  继续，将文件保存为 `sass` 文件夹下的 `_variables.scss`——你可以暂时关闭该文件，但我们在编译过程中还会用到它。\n\
  \n虽然这个导入文件不算长，但它确实开始使用 Sass 的功能——例如，我们使用颜色函数来定义调色板中用到的一些颜色。花点时间更深入地理解这一点是值得的；当我们查看主样式表时，这些内容就会开始串起来。现在，我们先详细分解一下我们使用的代码。\n\
  \n#### 深入了解导入的代码\n\n在我们创建的第一个局部文件中，我们声明了一些 `@font-face` 规则——这些规则会根据分配给特定元素的字体粗细来使用。每个声明都使用\
  \ `@font-face` 的标准格式；我们只是利用 Sass 在编译时将其导入主样式表的能力。\n\n相比之下，第二个局部文件使用了更多的 Sass 函数：我们首先为演示中使用的颜色定义了许多变量。我们混合使用了静态值和动态值；需要注意的是，顺序至关重要，因为我们使用静态变量来创建后续的颜色。\n\
  \n理解这些函数如何工作的诀窍，我们在第 4 章中已经讲过——提醒一下，要从内向外阅读函数。例如，用于中等青色（moderate cyan）的颜色，首先被饱和了\
  \ `2.4%`，然后被提亮了 `10.39%`。\n\n为什么百分比值如此精确？这些值是通过 `http://razorltd.github.io/sasscolourfunctioncalculator/`\
  \ 上的 Sass 颜色工具生成的——在创建颜色时，这个工具的价值堪比黄金！\n\n接着，我们根据在第一个局部文件中设置的字体，为变量分配了四种不同的字体系列——我们使用了\
  \ PT Sans 和 Open Sans，其中 Open Sans 包含细体、粗体和常规体。然后，样式表以一个单一的混入结束，该混入根据主样式表中的调用声明来分配正确的字体颜色、粗细和大小。它使用一个\
  \ `@if...@else` 语句来判断：当字体粗细值为 `300` 时使用细体家族，`400` 时使用常规体家族，`700` 或更高时使用粗体家族。\n\n\
  此时，我们应该指出这个混入中使用的一个特定功能——我们有一个嵌套属性。这是一种将多个样式分组到单个名称（或命名空间）下的简单方法：嵌套块中的每个属性都会自动以父级名称开头。请看图\
  \ 6-1，我们将两个字体属性分组在一起——在我们的 Sassmeister 示例中，它们被编译成我们在 CSS 中熟知的 `font-*` 属性。\n\n![../images/472539_1_En_6_Chapter/472539_1_En_6_Fig1_HTML.jpg](img/472539_1_En_6_Fig1_HTML.jpg)\n\
  \n**图 6-1** 一个带命名空间的嵌套属性\n\n（如果你好奇的话——在 Sass 中，你可以对许多属性做类似的事情，比如 `border`、`padding`\
  \ 或 `margin`！）\n\n好了，各位，是时候了：我们已经可以创建主样式表了！如果你已经提前阅读过，并为我们将要介绍的代码量感到震惊，那么别担心——代码看起来可能很多，但我们会一点一点地讲解。大部分代码都是嵌套的，后代选择器位于它们各自的父元素内部——让我们开始看看我们需要设置什么才能使我们的演示工作。\n\
  \n### 设置主样式表\n\n这就是所有魔法发生的地方——代码量相当大，不过如果你通读代码，希望你能发现其中大部分都是嵌套的。这使得阅读和理清每个父元素或后代元素被分配了什么变得更容易。\n\
  \n根据你使用的文本编辑器，你可能会发现可以折叠代码块——这也有助于更容易地识别演示中使用的主要元素。\n\n\n\n### 整合主样式表\n\n我们开始吧：\n\
  \n1.  首先创建一个新文件 - 将其保存到 `shoppingcart` 文件夹下的 `sass` 子文件夹中，文件名为 `shoppingcart.scss`。\n\
  \n2.  虽然需要大量代码，但我们会逐块处理 - 首先在文件顶部添加以下几行，以引入我们在本章前面创建的导入部分文件：\n\n```\n@import \"\
  fonts.scss\";\n@import \"variables.scss\";\n```\n\n3.  我们的演示需要一些基础样式来铺垫 - 空一行，然后添加以下四条规则：\n\
  \n```\n/* base styles */\nbody {\n  font-family: $pt-sans-family;\n  margin: 32px;\n\
  \  background: $color-light-grey;\n  margin: 0;\n  padding: 0;\n  overflow-x: hidden;\n\
  \  margin: 32px;\n}\n.container { margin: 0 auto; width: 980px; }\n.clearfix { content:\
  \ \"\"; display: table; clear: both; }\nh2.exercise { margin-left: auto; margin-right:\
  \ auto; width: 980px; }\n```\n\n4.  基础规则设置完毕后，我们现在可以覆盖购物车的每个主要区域 - 首先添加购物车头部规则：\n\
  \n```\n/* header */\n#site-header {\n  margin: 0 auto;\n  padding-left: 20px;\n\
  \  background: $color-white;\n  h1 {\n    @include fontdetail($color-black, 31px,\
  \ 300);\n    padding: 20px 0;\n    position: relative;\n    margin: 0;\n  }\n}\n\
  ```\n\n5.  接下来是购物车主区域的嵌套规则，包括商品详情：\n\n```\n/* shopping cart */\n#cart {\n  width:\
  \ 100%;\n  h1 { @include fontdetail($color-black, 25px, 300); }\n  p { @include\
  \ fontdetail($color-black, 18px, 300); }\n}\n.product {\n  border: 1px solid $color-light-grey;\n\
  \  margin: 20px 0;\n  width: 100%;\n  position: relative;\n  transition: margin\
  \ .2s linear, opacity .2s linear;\n  clear: both;\n  & img { width: 100%; height:\
  \ 100%; }\n  .content {\n    background-color: $color-white;\n    border-bottom:\
  \ 1px solid $color-description-grey;\n    float: left;\n    box-sizing: border-box;\n\
  \    height: 171px;\n    padding: 0 20px 0 10px;\n    width: 83%;\n  }\n}\n.product\
  \ header {\n  background-color: $color-white ;\n  border-bottom: 1px solid $color-description-grey;\n\
  \  float: left;\n  margin: 0 1% 20px 0;\n  overflow: hidden;\n  padding: 0;\n  position:\
  \ relative;\n  width: 153px;\n  height: 218px;\n  h3 {\n    @include fontdetail($color-white,\
  \ 22px, 300);\n    background: $color-moderate-cyan;\n    line-height: 49px;\n \
  \   margin: 0;\n    padding: 0 30px;\n    position: absolute;\n    bottom: -100px;\n\
  \    right: 0;\n    left: 0;\n  }\n  &:hover img { opacity: .7; }\n  &:hover h3\
  \ { bottom: 73px; }\n}\n```\n\n6.  在每个商品描述中，我们都有一个详情块 - 包含所选书籍类型、单价、数量和总价。请继续添加以下代码块：\n\
  \n```\narticle footer {\n  margin: 0;\n  padding: 0;\n  background-color: $color-almost-white;\n\
  \  .price {\n    @include fontdetail($color-black, 15px, 300);\n    background:\
  \ #fcfcfc;\n    float: right;\n    line-height: 49px ;\n    margin: 0;\n    padding:\
  \ 0 30px;\n    &:before { content: \"$\"; }\n  }\n  .full-price {\n    @include\
  \ fontdetail($color-black, 22px, 400);\n    background: $color-yellow;\n    float:\
  \ right;\n    line-height: 39px;\n    margin: 5px;\n    padding: 0 30px;\n    transition:\
  \ margin .15s linear;\n    width: 125px;\n    text-align: right;\n    &:before {\
  \ content: \"$\"; }\n  }\n}\n```\n\n7.  下一部分负责设置购物篮中商品数量更新按钮的样式。在上一部分之后添加以下代码，并确保先空一行：\n\
  \n```\n.qt {\n  @include fontdetail($color-black, 19px, 300);\n  line-height: 50px;\n\
  \  width: 70px;\n  text-align: center;\n  display: block;\n  float: left;\n}\n.qt-plus,\
  \ .qt-minus {\n  @include fontdetail($color-black, 30px, 300);\n  display: block;\n\
  \  float: left;\n  background: $color-almost-white;\n  border: none;\n  height:\
  \ 100%;\n  padding: 0 20px ;\n  transition: background .2s linear;\n  line-height:\
  \ 39px;\n  margin: 5px;\n  &:hover { background: $color-moderate-cyan; color: $color-white;\
  \ cursor: pointer; }\n}\n```\n\n8.  购物车的下一部分是底部页脚 - 空一行，然后添加以下样式来处理小计、税费和运费：\n\n\
  ```\n/* shopping cart footer */\n#site-footer {\n  background: $color-white;\n \
  \ margin: 30px 0 0 0;\n  padding: 40px 0px;\n  width: 100%;\n  margin-left: auto;\n\
  \  margin-right: auto;\n  clear: both;\n  h1 {\n    @include fontdetail($color-black,\
  \ 25px, 300);\n    background: $color-almost-white;\n    border-bottom: 1px solid\
  \ $color-description-grey;\n    margin: 0 0 7px 0;\n    padding: 14px 40px;\n  \
  \  text-align: center;\n    span:before { content: \"$\"; }\n  }\n  h2 {\n    @include\
  \ fontdetail($color-black, 24px, 300);\n    margin: 10px 0 0 0;\n  }\n  h3 {\n \
  \   @include fontdetail($color-black, 19px, 300);\n    margin: 15px 0;\n  }\n  .left\
  \ { float: left; }\n  .right { float: right; }\n}\n```\n\n9.  还有一些杂项样式，不适合放到已有嵌套样式中；在上一样式块后添加以下内容：\n\
  \n```\nbutton {\n  @include fontdetail($color-black, 24px, 400) ;\n  background:\
  \ $color-yellow;\n  border: 1px solid $color-dark-grey;\n  border-style: none none\
  \ solid none;\n  cursor: pointer;\n  display: block;\n  padding: 16px 0;\n  width:\
  \ 290px;\n  text-align: center;\n  transition: all .2s linear;\n  &:hover { color:\
  \ $color-white; background: $color-dark-cyan; }\n}\n.small {\n  @include fontdetail($color-black,\
  \ 13px, 300);\n  background: $color-almost-white;\n  padding: 10px 16px;\n  line-height:\
  \ 28px;\n  border: none;\n  display: inline-block ;\n  line-height: 29px;\n}\n.contain\
  \ { width: 80%; margin-left: auto; margin-right: auto; }\n/* plus and minus buttons\
  \ in details */\n.minus { margin: 0 50px 0 0; }\n.added { margin: 0 -50px 0 0; }\n\
  ```\n\n10. 我们快完成了 - 下一个块设置网站上删除链接和按钮的样式：\n\n```\n/* Remove link over books & remove\
  \ button in description */\na {\n  color: $color-black;\n  text-decoration: none;\n\
  \  transition: color .2s linear ;\n  &:hover { color: $color-moderate-cyan; cursor:\
  \ pointer; }\n}\n.removebtn {\n  @include fontdetail($color-black, 16px, bold);\n\
  \  width: 21px;\n  float: right;\n  margin-top: -72px;\n  background-color: $color-light-grey;\n\
  \  color: $color-white;\n  border-radius: 148px;\n  text-align: center;\n  height:\
  \ 20px;\n  line-height: 20px;\n  &:hover {\n    cursor: pointer;\n    background-color:\
  \ $color-pure-red;\n    transition: background-color 0.3s linear ;\n  }\n}\n```\n\
  \n11. 最后一个块负责格式化购物车中总计、运费和税费显示的文本：\n\n```\n/* cart totals */\n.carttotal {\n  margin:\
  \ 20px;\n  display: inline-block;\n  float: right;\n  width: 110px;\n  margin-top:\
  \ 13px;\n  & > img { width: 40px; height: auto; }\n  & > span {\n    background-color:\
  \ $color-very-light-grey;\n    padding: 5px 10px;\n    border-radius: 20px;\n  \
  \  position: absolute;\n    margin-top: 25px;\n    margin-left: -20px ;\n  }\n}\n\
  .tax, .shipping, .subtotal {\n  span {\n    float: right;\n    &:before { content:\
  \ \"$\"; }\n  }\n  div { width: 100px; display: inline-block; }\n}\n```\n\n12. 保存文件\
  \ - 暂时可以关闭它，稍后在编译过程中我们会用到它。\n\n\n\n唷——这真是一大堆代码！如果你能坚持到这里，那真是太棒了：我们已经完成了演示中最难、最重要的部分。\n\
  \n不过，在编译代码并欣赏我们的杰作之前，我们还有几件事要做。首先——让我们稍作喘息，更详细地探索一下样式表代码：它阐述了在未来的项目中使用 Sass 创建样式表时，你应该注意的几个关键点。\n\
  \n### 分解代码\n\n我们可以直接一头扎进代码，但在此之前，我建议你先做一件事：休息一下！去给自己倒杯饮料，呼吸点新鲜空气——做什么都行：目的是让自己离开屏幕几分钟。\n\
  \n这样做有个很好的理由：虽然我们示例中使用的大部分代码都是标准的 CSS，但乍一看会显得有些复杂。但它能工作的关键在于使用了嵌套（nesting）——该项目中的许多代码都采用了嵌套，以提高可读性。带着这个想法，让我们仔细看看代码。\n\
  \n我们从两条 `@import` 语句开始——一条用于导入字体声明，另一条用于处理样式表中使用的变量。然后，我们为页面设置了一些基础样式，包括购物车背景和练习标题。\n\
  \n接下来是一组针对 `#site-header` 的样式——从这里开始我们使用嵌套，为子元素 `h1` 包含后代规则。然后我们对 `.product` 遵循同样的原则——它包含大量的子规则，用于设置网站产品描述和价格部分的元素样式。注意，我们还使用了颜色变量——这些变量是在\
  \ `_variables.scss` 文件中定义的，但会在编译过程中合并进来。\n\n然后，我们处理每个产品描述页脚部分的一组声明；父元素是 `article\
  \ footer`，在其下方我们有针对 `.price` 和 `.full-price` 类的规则。紧接着是数量按钮的嵌套块——注意这里还包含了一个混入（mixin），用于应用\
  \ Open Sans Light 字体族（样式表中多次出现此情况）。\n\n样式表中的下一个嵌套块是针对 `#site-footer` 元素；它包括针对 `h1`、`h2`\
  \ 和 `h3` 元素的声明，以及 `.left` 和 `.right` 类，用于定义内容在页脚中的位置。样式表的最后一部分涵盖了一组杂项样式，之后我们以购物车页脚中的总金额以及税金、运费和小计金额的嵌套块作为收尾。\n\
  \n## 整合所有内容\n\n我们即将运行至关重要的编译过程，但在此之前，还有一个重要的部分需要介绍：用于让购物车运行的脚本代码。\n\n我们使用的代码与购物车原始版本相同，只做了一些微小的调整和添加——它看起来复杂，但可以分解为几个清晰的部分。\n\
  \n第一部分（大约第 5 行到第 20 行）是 `changeVal()` 函数，我们用它来根据所选产品的数量更新价格；当购物车中选定产品的数量发生变化（或被移除）时，会在代码的不同位置调用这个函数。我们使用的第二个函数是\
  \ `changeTotal()` 函数——它会更新总金额（包括小计和最终金额）以及运费和税费，然后在屏幕上呈现更新后的数值。\n\n接着，我们设置了五个事件处理器：前两个负责响应“移除此横幅”（出现在书籍上）和每个产品描述右上角的红色“移除”叉号的点击事件。接下来的两个负责响应加号或减号按钮的点击，以添加或移除产品；它们会调整选中的数量，然后调用\
  \ `changeVal()` 函数来更新所选书籍对应数量的总价。最后一个事件处理器简单地调用移除函数，要么显示结账流程的占位符，要么指示购物车为空；因此，我们无法完成结账流程。\n\
  \n好了——闲话少说，朋友们，是时候了……是时候看看我们的演示是否真的有效了！所有代码都已就位，那么，闲话少叙，让我们直接进入并运行编译过程吧。\n\n## 编译我们的代码\n\
  \n这可能是本章中最简单的部分之一，但也是最令人紧张的部分——我们的演示能成功吗？希望可以，但在揭晓答案之前，最好检查一遍代码，确保一切就绪。\n\n如果你查看\
  \ `sass` 子文件夹，应该会看到三个文件名中包含“finished version”的文件。这些是已完成版本——你可以将自己的版本与之比较，看看一切是否确实就绪，可以编译了。\n\
  \n### 示例——编译我们的代码\n\n好了——让我们开始编译代码吧。为此，我们将回到本章开始时创建的 Node.js 环境中；让我们开始：\n\n1.  启动一个\
  \ Node.js 终端会话，或者如果之前的会话还开着，切换回去——确保工作文件夹是我们本章开始时创建的 `shoppingcart` 文件夹。\n\n2. \
  \ 在提示符下，输入 `gulp`，然后按回车键；你应该会看到显示 `Starting 'default'...`，接着是 `Finished 'default'`\
  \ 和一个时间戳。\n\n3.  如果你现在尝试保存主样式表，它会自动触发并重新编译——如图 6-2 所示。\n\n    ![../images/472539_1_En_6_Chapter/472539_1_En_6_Fig2_HTML.jpg](img/472539_1_En_6_Fig2_HTML.jpg)\n\
  \n    图 6-2\n\n    编译我们的代码\n\n假设没有显示错误，那么恭喜你！你已经使用 Sass 完成了第一个项目；当然，我们还可以进行改进，但这没关系，因为每个项目都应该随着时间的推移而发展和成熟。不过，还有最后一件事……\n\
  \n## 最终成果\n\n嘿嘿——如果你期待什么重大事件，别担心！那个“最后一件事”实际上是整章中最棒的部分；这是我们终于能够一睹最终成果辉煌全貌的时刻。假设你没有遇到任何问题，那么图\
  \ 6-3 展示了在浏览器中预览的最终文章。\n\n![../images/472539_1_En_6_Chapter/472539_1_En_6_Fig3_HTML.jpg](img/472539_1_En_6_Fig3_HTML.jpg)\n\
  \n图 6-3\n\n我们完成的购物车\n\n这证明了我们总能在代码中使用 Sass——具体使用量当然取决于项目的性质，但随着时间的推移，我们能够开始构建可重用的代码，这些代码可以添加到任何将来使用\
  \ Sass 的项目中。\n\n\n\n## 未来变化\n\n随着我们的项目正式启动，接下来要回答的问题是：下一步该往哪走……？\n\n我们可以考虑一系列变化——唯一限制我们的只有想象力和项目需求！由于\
  \ Sass 是 CSS 的超集，这意味着我们可以随心所欲地将 CSS 代码部分或全部转换为 Sass 代码。一旦完成初期繁重的转换工作，我们就可以根据需要添加新样式——以下这些想法可以作为起步参考：\n\
  \n*   我们可以考虑使用更多带命名空间的属性——看看下面这段从 `fontdetail` 混入中摘取的代码：\n\n    ```\n    font: {\n\
  \    size: $size;\n    weight: $weight;\n    }\n    ```\n\n    我们已经在整个演示中使用了 `padding`\
  \ 和 `margin`，或许在命名空间方面还有进一步发挥的空间？\n\n*   一种更高效的色彩写法是使用 Sass 的映射（map）——这样我们可以将同一颜色的不同色调分组编码，使代码编写更高效。不过我们应该更进一步：当为颜色变量命名时，采用通用格式，例如\
  \ `$border-blue-light`（从通用到具体）。这样更便于分组、便于编辑器智能提示颜色名、也便于理解这些颜色在代码中的使用位置。\n\n*   我们可以研究如何添加诸如信用卡或安全标志之类的图片——有多个工具可集成到我们的\
  \ `Gulpfile.js` 脚本中，为图片生成对应的 Sass 代码。\n\n*   在这个演示中，我们并没有真正使用外部库——但这并不意味着我们不应该使用；例如使用\
  \ Scut 库（[`https://davidtheclark.github.io/scut/font-face.html`](https://davidtheclark.github.io/scut/font-face.html)）来处理\
  \ `variables.scss` 局部文件中用到的 `@font-face` 代码？\n\n*   有人还记得使用 `rem` 单位代替像素吗？为了方便，我们全程使用了像素值，但如果您对\
  \ `rem` 单位情有独钟，Sass 可以轻松通过混入来添加这些单位。在 [Google.com](http://google.com) 上搜索“sass mixin\
  \ for rem units”——会有大量示例！\n\n*   我们甚至可以添加媒体断点来让页面更具响应性——Sass 原生支持 `@media` 查询（甚至可以嵌套使用）；[Medium.com](http://medium.com)\
  \ 上有一篇很有用的文章，介绍了如何使用 Sass 实现断点，链接为 [`https://medium.com/codeartisan/breakpoints-and-media-queries-in-scss-46e8f551e2f2`](https://medium.com/codeartisan/breakpoints-and-media-queries-in-scss-46e8f551e2f2)。\n\
  \n*   我们为数量按钮定义了基础样式 `.qt`——这虽然效果不错，但迫使我们分配两种样式。不妨考虑使用 `@extend` 函数创建一个基础样式，然后将其扩展为我们所需的加号或减号按钮样式？\n\
  \n以上仅是使用 Sass 时可能出现的一些想法——当然，我们的想象力才是唯一的限制！希望这能让你了解在大型真实项目中使用 Sass 的体验；只要你认真规划、采用迭代方式转换代码、做出明智的选择，那么在将现有项目改造为使用\
  \ Sass 的过程中应该不会遇到太多问题。\n\n### 总结\n\n在本书中，我们涵盖了 Sass 中大量不同的特性——从简单的变量到构建混入、再到使用条件逻辑控制输出。在本章中，我们通过一个真实项目将这些特性融会贯通——我们的购物车或许拿不了任何奖项，但总得有个起点！全书我们分享了大量实用技巧，现在让我们花点时间回顾一下本章所学内容。\n\
  \n我们首先概述了本章项目的具体细节，随后快速转向开发环境的搭建和 HTML 标记的安装。\n\n接下来，我们探索了为项目创建样式的过程——我们逐步完成了两个导入局部文件，然后组装了主样式表。最后，我们通过简要介绍使购物车生效所需的\
  \ jQuery 代码将所有内容整合在一起，接着运行编译过程，并在浏览器中查看成果。\n\n呼——真是段激动人心的旅程！我们在本书中涵盖了很多内容；希望你觉得它有用，并且能像我享受写作此书一样享受使用\
