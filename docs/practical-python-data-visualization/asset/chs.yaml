  plt.show()\n```\n\n结果如图 8-9 所示。\n\n*图 8-9.* 饼图\n\n## 总结\n\n本章探讨了 SciPy 的数据科学库 pandas\
  \ 的基础知识。你学习了基本 pandas 数据结构（Series 和数据框）的创建与操作基础，还掌握了数据框数据可视化的基本方法，以及如何从 CSV 文件读取数据。\n\
  \n所有这些概念对于完成下一章的练习将非常有用。下一章将通过处理与当前 COVID-19 疫情相关的数据，为我们数据可视化的学习之旅画上句点，并提供一个有趣的现实案例研究。\n\
  \n## 第 9 章：处理 COVID-19 数据\n\n第 8 章介绍了 SciPy 数据科学库 pandas 的基础知识。你学习了 Series 和数据框数据结构的基础，以及如何对数据框和\
  \ Series 中的数据进行可视化。\n\n本章是你在前几章所学知识的集大成者。在本章中，我们将检索真实世界的数据并对其进行可视化。学完本章后，你应该能够熟练地对真实数据集进行可视化。\n\
  \n## COVID-19 疫情与数据集\n\n在本书撰写之际，世界正面临一场前所未有的自然灾害——一场由严重急性呼吸综合征冠状病毒 2 型（SARS-CoV-2）及其引发的疾病\
  \ COVID-19 所造成的疫情（一种跨越各大洲传播的传染病）。这种病毒与导致普通感冒等非致命疾病以及非典和中东呼吸综合征等更致命疾病的病毒同属一个病毒家族（冠状病毒）。这些病毒会感染哺乳动物和人类的呼吸道，若未及时治疗，可能致命。\n\
