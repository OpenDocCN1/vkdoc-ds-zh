  \n## COVID-19 数据源\n\n许多组织都在追踪全球 COVID-19 病例，并定期在其网站和网络服务上更新数据。其中最著名的是约翰霍普金斯大学（[`coronavirus.jhu.edu/map.html`](https://coronavirus.jhu.edu/map.html)）和\
  \ World-O-Meter（[`www.worldometers.info/coronavirus/`](https://www.worldometers.info/coronavirus/)）。这些是非常可靠的\
  \ COVID-19 数据来源，并且它们会非常频繁地（至少每 24 小时一次）更新统计数据，以便下游系统获取最新数据。\n\n我们可以使用 Python 中的自定义库来检索这些数据。其中一个库可以在\
  \ [`ahmednafies.github.io/covid/`](https://ahmednafies.github.io/covid/) 找到。它可以从约翰霍普金斯大学和\
  \ World-O-Meter 两者中检索数据。\n\n要安装它，请为本章创建一个新笔记本，并在代码单元格中运行以下命令：\n\n```\n!pip3 install\
  \ covid\n```\n\n接着，按如下方式导入库：\n\n```\nfrom covid import Covid\n```\n\n你可以使用以下代码获取数据：\n\
  \n```\ncovid = Covid()\n```\n\n默认情况下，它会从约翰霍普金斯大学获取数据。你也可以显式指定数据源：\n\n```\ncovid\
  \ = Covid(source=\"john_hopkins\")\n```\n\n要获取 World-O-Meter 的数据，请更改源值：`covid =\
  \ Covid(source=\"worldometers\")`\n\n你可以使用以下命令显示所有数据：\n\n```\ncovid.get_data()\n\
  ```\n\n\n\n这将返回一个字典列表，如图 9-1 所示。\n\n***图 9-1.** COVID-19 数据*\n\n我们可以通过以下方式确定数据来源：\n\
