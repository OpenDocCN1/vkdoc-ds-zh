  four      2010  Hyderabad        5.2  NaN\nfive      2011  Hyderabad        5.3\
  \  NaN\nsix       2012  Hyderabad        5.5  NaN\n```\n\n使用以下命令打印列的列表：\n\n```\n\
  print(df3.columns)\n```\n\n输出结果如下：\n\n```\nIndex(['year', 'city', 'population',\
  \ 'GDP'], dtype='object')\n```\n\n我们可以按如下方式打印索引的列表：\n\n```\nprint(df3.index)\n```\n\
  \n这将输出：\n\n```\nIndex(['one', 'two', 'three', 'four', 'five', 'six'], dtype='object')\n\
  ```\n\n你可以使用以下语句显示某一列的数据：`print(df3.year)`。另外，你也可以使用以下语句：\n\n```\nprint(df3['year'])\n\
  ```\n\n输出如下：\n\n```\none      2010\ntwo      2011\nthree    2012\nfour     2010\n\
  five     2011\nsix      2012\nName: year, dtype: int64\n```\n\n你可以使用以下语句显示某一列的数据类型：`print(df3['year'].dtype)`。你也可以使用这段代码：\n\
  \n```\nprint(df3.year.dtype)\n```\n\n将输出：\n\n```\nint64\n```\n\n要显示所有列的数据类型，请使用此语句：`print(df3.dtypes)`。输出如下：\n\
  \n```\nyear           int64\ncity          object\npopulation   float64\nGDP   \
  \        object\ndtype: object\n```\n\n我们可以按如下方式使用索引检索任何记录：\n\n```\ndf3.loc['one']\n\
  ```\n\n输出结果如下：\n\n```\nyear           2010\ncity         Mumbai\npopulation    \
  \   10\nGDP             NaN\nName: one, dtype: object\n```\n\n你可以按如下方式为某一列的所有成员分配相同的值：\n\
  \n```\ndf3.GDP = 10\nprint(df3)\n```\n\n输出如下所示：\n\n```\n          year       city\
  \  population  GDP\none       2010    Mumbai        10.0   10\ntwo       2011  \
  \  Mumbai        10.1   10\nthree     2012    Mumbai        10.2   10\nfour    \
  \  2010  Hyderabad        5.2   10\nfive      2011  Hyderabad        5.3   10\n\
  six       2012  Hyderabad        5.5   10\n```\n\n我们可以按如下方式将一个 ndarray 分配给 GDP 列：\n\
  \n```\nimport numpy as np\ndf3.GDP = np.arange(6)\nprint(df3)\n```\n\n这将输出：\n\n\
  ```\n          year       city  population  GDP\none       2010    Mumbai      \
  \  10.0    0\ntwo       2011    Mumbai        10.1    1\nthree     2012    Mumbai\
  \        10.2    2\nfour      2010  Hyderabad        5.2    3\nfive      2011  Hyderabad\
  \        5.3    4\nsix       2012  Hyderabad        5.5    5\n```\n\n你也可以按如下方式为其分配一个列表：\n\
  \n```\ndf3.GDP = [3, 2, 0, 9, -0.4, 7]\nprint(df3)\n```\n\n输出如下：\n\n```\n      \
  \    year       city  population  GDP\none       2010    Mumbai        10.0  3.0\n\
  two       2011    Mumbai        10.1  2.0\nthree     2012    Mumbai        10.2\
  \  0.0\nfour      2010  Hyderabad        5.2  9.0\nfive      2011  Hyderabad   \
