- "# 第 3 章：使用 Leather 进行数据可视化\n\n在第 2 章中，我们使用 Jupyter Notebook 熟悉了 Python 编程。现在，你应该能熟练地使用\
  \ Jupyter Notebook 编写交互式 Python 程序了。\n\n在本章中，我们将使用 Jupyter Notebook 和 Python，并结合数据可视化库\
  \ `leather` 来生成基本的可视化图表。以下是本章将涵盖的主题列表：\n\n- `leather` 简介\n- 更多可视化类型\n- 比例\n- 样式设置\n\
  \n## 在 Jupyter Notebook 中运行操作系统命令\n\n你已经了解了如何使用 Jupyter Notebook 进行 Python 编程。现在我们将探讨如何在笔记本中执行操作系统命令。这很有用，因为我们需要使用\
  \ `pip` 来安装许多实用程序，我们可以在笔记本中直接运行它。\n\n© Ashwin Pajankar 2021  \nA. Pajankar, *实用\
  \ Python 数据可视化*,  \n[`doi.org/10.1007/978-1-4842-6455-3_3`](https://doi.org/10.1007/978-1-4842-6455-3_3#DOI)\n\
  \n---\n\n第 3 章：使用 Leather 进行数据可视化\n\n为本章所有代码创建一个新的 Jupyter 笔记本。我们将在所有章节中遵循此流程，因此到本书结束时，我们将按章节将所有程序都保存在笔记本中。\n\
  \n要在笔记本单元格中执行操作系统命令，我们必须使用 `!` 符号作为前缀，如下所示：\n\n```\n!dir\n```\n\n该命令的输出如图 3-1 所示。\n\
  \n**图 3-1.** Jupyter Notebook 中操作系统命令的输出\n\n你可以通过运行以下语句来升级 `pip` 工具：\n\n```\n!pip3\
  \ install --upgrade pip\n```\n\n使用以下语句安装用于数据可视化演示的 `leather` 库：\n\n```\n!pip3 install\
  \ leather\n```\n\n这将在计算机上安装 `leather` 数据可视化库。在下一节中，我们将开始使用笔记本进行 Python 和 `leather`\
  \ 的可视化操作。\n\n---\n\n第 3 章：使用 Leather 进行数据可视化\n\n## Leather 简介\n\n`leather` 是一个易于使用、广受欢迎的\
  \ Python 数据可视化库。你可以在 Python 包索引 (PyPI) 上找到它，网址为 [`pypi.org/project/leather/`](https://pypi.org/project/leather/)。\n\
  \n\n\n"
- "# 第 3 章 使用 leather 进行数据可视化\n\n[org/project/leather/](https://pypi.org/project/leather/)。`PyPI`是一个第三方软件包仓库，可以使用`pip3`工具进行下载。我们也可以在\
  \ PyPI 上搜索某个包是否可用。在笔记本中运行以下命令：\n\n```\n!pip3 search leather\n```\n\n输出结果如图 3-2 所示。\n\
  \n***图 3-2.** 使用 pip3 搜索软件包*\n\n在继续之前，我们需要事先了解一些关于 Python 编程语言的知识。在 Python 中，缩进用于表示代码块。在\
  \ C、C++和 Java 等几种流行的编程语言中，多行代码块用花括号`{}`括起来。Python 则强制程序员缩进代码块，没有其他表示方法。以下面的代码为例。\n\
  \n```\na = 3\n\nif a%2 == 0:\n\nprint('Even')\n\nelse:\n\nprint('Odd')\n```\n\n\
  在笔记本中运行该代码并查看结果。还有一件有趣的事情可以尝试。我们已经了解了《Python 之禅》（PEP 20）。Python 的创建者将其作为彩蛋添加在解释器中，你可以通过以下语句调用它：\n\
  \n```\nimport this\n```\n\n如果在笔记本中运行这行语句，它会在输出中打印《Python 之禅》的所有箴言。\n\n请注意，我们使用 Jupyter\
  \ Notebook 演示的所有程序，稍加修改后也可以在 IDLE 中运行。我们之所以使用 Jupyter Notebook，是因为它具有即时反馈和交互式功能。现在，让我们使用`import`语句将\
  \ leather 库添加到笔记本中。\n\n每个会话只需导入一次，它在整个会话期间都可使用。使用以下语句：\n\n```\nimport leather\n\
  ```\n\n运行后，它会将该库导入到当前的笔记本会话中。最好为每个新主题添加一个标题，但这由你自己决定。你会发现，我在本书配套代码的笔记本中经常使用标题，以便为演示的内容提供上下文和参考。这是一个好习惯，你可能也想效仿。\n\
  \n让我们编写简单的代码来可视化一些数据点。我们可以在 X-Y 坐标系中定义这些点。我们可以使用元组列表来定义点，如下所示：\n\n```\ndata1 = [(1.5,\
  \ 2), (2, 3), (4.5, 6), (7.5, 4)]\n```\n\n我们也可以将它们定义为列表的列表：\n\n```\ndata1 = [[1.5,\
  \ 2], [2, 3], [4.5, 6], [7.5, 4]]\n```\n\n我们还可以将它们定义为元组的元组：\n\n```\ndata1 = ((1.5,\
  \ 2), (2, 3), (4.5, 6), (7.5, 4))\n```\n\n![](img/index-46_1.jpg)\n\n我们也可以将它们定义为列表的元组：\n\
  \n```\ndata1 = ([1.5, 2], [2, 3], [4.5, 6], [7.5, 4])\n```\n\n正如你所看到的，leather 库在数据定义方式上并不苛刻，非常灵活。\n\
  \n让我们按如下方式定义一个图表对象：\n\n```\nchart = leather.Chart('简单的 x-y 坐标对')\n```\n\n接下来，创建一个散点图：\n\
  \n```\nchart.add_dots(data1)\n```\n\n然后，按如下方式可视化图表：\n\n```\nchart.to_svg()\n```\n\
  \n它会在同一个笔记本中显示输出结果，如图 3-3 所示。\n\n***图 3-3.** 绘制数据点*\n\n![](img/index-47_1.jpg)\n\
  \n我们可以使用以下语句将图像保存到磁盘：\n\n```\nchart.to_svg('image1.svg')\n```\n\n然后，我们可以如下方式自定义散点：\n\
  \n```\nchart = leather.Chart('自定义散点')\nchart.add_dots(data1, fill_color='#00ff00',\
  \ radius=10)\nchart.to_svg()\n```\n\n让我们定义更多的数据点：\n\n```\ndata2 = [(2, 3), (4, 5),\
  \ (5, 6), (7, 5)]\n```\n\n我们还可以按如下方式可视化多个序列：\n\n```\nchart = leather.Chart('可视化多个序列')\n\
  chart.add_dots(data1)\nchart.add_dots(data2)\nchart.to_svg()\n```\n\n输出结果如图 3-4\
  \ 所示。\n\n***图 3-4.** 绘制多个序列*\n\n![](img/index-48_1.jpg)\n\n如图 3-4 所示，leather 会根据数据点所属的序列自动为它们分配不同的颜色。\n\
  \n## 更多可视化类型\n\n\n\n我们可以使用连接各点的线段来可视化数据，如下所示：`chart = leather.Chart('Visualizing\
  \ Lines')`\n\n`chart.add_line(data1)`\n\n`chart.to_svg()`\n\n输出结果如图 3-5 所示。\n\n\
