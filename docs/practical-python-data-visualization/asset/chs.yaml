- "# 第 8 章 Pandas 入门\n\n第一步，通过在 Jupyter Notebook 中运行以下命令来将其安装在计算机上：\n\n```\n!pip3\
  \ install pandas\n```\n\n你可以通过运行以下命令将其导入当前会话：\n\n```\nimport pandas as pd\n```\n\
  \n你可以在 [`pandas.pydata.org/`](https://pandas.pydata.org/) 上阅读更多关于 pandas 的信息。\n\n\
  ## Pandas 中的 Series（序列）\n\n序列是一种带标签的一维数组。它可以保存任何类型的数据。这些标签统称为索引。\n\n我们可以按如下方式创建一个序列：\n\
  \n```\ns1 = pd.Series([1, 2, 3, 5, -3])\n```\n\n要确定其数据类型，请使用以下命令：\n\n```\ntype(s1)\n\
  ```\n\n你可以使用以下语句查看与其关联的值和索引：\n\n```\nprint(s1)\n```\n\n你可以按如下方式显式指定数据类型：\n\n```\n\
  s2 = pd.Series([1, 2, 3, 5, -3], dtype=np.int32)\nprint(s2)\n```\n\n要将列表作为参数传递给构造函数以创建序列，请使用以下代码：\n\
  \n```\nx = [1, 2, 3, 5, -3]\ns3 = pd.Series(x)\n```\n\n我们甚至可以将 NumPy 的 `ndarray`\
  \ 作为参数传递给构造函数来创建序列，如下所示：\n\n```\nimport numpy as np\ny = np.array(x)\ns4 = pd.Series(y)\n\
  ```\n\n要显示值，请使用以下代码：\n\n```\nprint(s4.values)\n```\n\n这将提供以下输出：\n\n```\n[ 1 2 3\
  \ 5 -3]\n```\n\n你可以按如下方式检索索引：\n\n```\nprint(s4.index)\n```\n\n这将产生以下输出：\n\n```\n\
  RangeIndex(start=0, stop=5, step=1)\n```\n\n要分配自定义索引，请使用以下代码：\n\n```\ns5 = pd.Series(x,\
  \ index=['a', 'b', 'c', 'd', 'e'])\nprint(s5)\n```\n\n这将提供以下输出：\n\n```\na    1\n\
  b    2\nc    3\nd    5\ne   -3\ndtype: int64\n```\n\n## Series 上的基本操作\n\n我们可以对序列执行一些基本操作。例如，我们可以按如下方式显示负数：\n\
  \n```\nprint(s5[s5 < 0])\n```\n\n这将产生以下输出：\n\n```\ne   -3\ndtype: int64\n```\n\n\
  我们也可以按如下方式检索正数：\n\n```\nprint(s5[s5 > 0])\n```\n\n输出如下所示：\n\n```\na    1\nb    2\n\
  c    3\nd    5\ndtype: int64\n```\n\n这些是比较操作的示例。要执行乘法运算，请使用以下语法：\n\n```\nc = 3\n\
  print(s5 * c)\n```\n\n输出如下：\n\n```\na     3\nb     6\nc     9\nd    15\ne    -9\n\
  dtype: int64\n```\n\n## Pandas 中的 DataFrame（数据框）\n\n数据框是一种带有标签的二维数据结构，其列可以是不同的数据类型。我们可以从序列、`ndarrays`、列表和字典创建数据框。数据框具有标签，这些标签统称为索引。我们可以轻松地查看和操作数据框中的数据。数据以矩形网格格式存储在数据框中。\n\
  \n我们可以按如下方式从字典数据列表创建数据框：\n\n```\ndata = {'city': ['Mumbai', 'Mumbai', 'Mumbai',\n\
  \                 'Hyderabad', 'Hyderabad', 'Hyderabad'],\n        'year': [2010,\
  \ 2011, 2012, 2010, 2011, 2012],\n        'population': [10.0, 10.1, 10.2, 5.2,\
  \ 5.3, 5.5]}\n```\n\n要由此创建数据框，请使用以下代码：\n\n```\ndf1 = pd.DataFrame(data)\nprint(df1)\n\
  ```\n\n输出如下：\n\n```\n        city  year  population\n0     Mumbai  2010        10.0\n\
  1     Mumbai  2011        10.1\n2     Mumbai  2012        10.2\n3  Hyderabad  2010\
  \         5.2\n4  Hyderabad  2011         5.3\n5  Hyderabad  2012         5.5\n\
  ```\n\n使用以下代码行显示前五条记录：\n\n```\ndf1.head()\n```\n\n输出如下：\n\n```\n        city  year\
  \  population\n0     Mumbai  2010        10.0\n1     Mumbai  2011        10.1\n\
  2     Mumbai  2012        10.2\n3  Hyderabad  2010         5.2\n4  Hyderabad  2011\
  \         5.3\n```\n\n你也可以将其他数字作为参数传递给函数 `head()`，它将显示数据框中相应数量的顶部记录。\n\n类似地，你可以使用\
  \ `df1.tail()` 来显示末尾的记录。它的默认参数是 5，但你可以自定义传递给它的参数。\n\n\n\n你可以按如下方式创建一个具有特定列顺序的数据框：\n\
  \n```\ndf2 = pd.DataFrame(data, columns=['year', 'city', 'population'])\nprint(df2)\n\
  ```\n\n这将产生以下输出：\n\n```\nyear city population\n0 2010 Mumbai 10.0\n1 2011 Mumbai\
  \ 10.1\n2 2012 Mumbai 10.2\n3 2010 Hyderabad 5.2\n4 2011 Hyderabad 5.3\n5 2012 Hyderabad\
  \ 5.5\n```\n\n接下来，让我们创建一个带有额外列和自定义索引的数据框：\n\n```\ndf3 = pd.DataFrame(data, columns=['year',\
  \ 'city', 'population', 'GDP'],\n                   index = ['one', 'two', 'three',\
  \ 'four', 'five', 'six'])\nprint(df3)\n```\n\n以下是新的数据框：\n\n```\n          year \
  \      city  population  GDP\none       2010    Mumbai        10.0  NaN\ntwo   \
