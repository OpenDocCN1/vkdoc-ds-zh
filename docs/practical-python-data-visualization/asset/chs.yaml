  \        5.2  1.5\nfive      2011  Hyderabad        5.3 -1.3\nsix       2012  Hyderabad\
  \        5.5  NaN\n```\n\n## 读取以 CSV 格式存储的数据\n\n我们可以使用 `read_csv()` 方法读取以逗号分隔值（CSV）格式存储的数据。CSV\
  \ 文件可以存储在远程 URL 或磁盘上的某个位置。以下是一个读取托管在互联网 URL 上的 CSV 文件的示例：\n\n```\ndf = pd.read_csv('https://raw.githubusercontent.com/cs109/2014_data/master/countries.csv')\n\
  df.head(5)\n```\n\n输出如下：\n\n```\n      Country    Region\n0     Algeria    AFRICA\n\
  1      Angola    AFRICA\n2       Benin    AFRICA\n3    Botswana    AFRICA\n4   \
  \  Burkina    AFRICA\n```\n\n我们可以用同样的方式将存储在磁盘上某个文件中的数据读取到数据框中。\n\n## 使用 Pandas 进行可视化\n\
  \nPandas 数据框具有类似 Matplotlib 的可视化方法。\n\n\n\n基本上，这些方法是对`Matplotlib`中方法的包装。\n\n让我们看看如何使用这些方法来可视化存储在`pandas`数据帧中的数据。\n\
  \n首先导入`Matplotlib`的`pyplot`模块，并使用魔法命令在笔记本中启用`Matplotlib`可视化，如下所示：\n\n```\n%matplotlib\
  \ inline\nimport matplotlib.pyplot as plt\n```\n\n`NumPy`函数`randn()`生成一个具有标准正态随机分布的`NumPy`数组。我们将用它来创建一个序列并绘制它，如下所示：\n\
  \n```\nts = pd.Series(np.random.randn(5))\nts\n```\n\n输出如下（每次执行代码时都会不同，因为它在执行时是随机生成的）：\n\
  ```\n0    0.257543\n1    1.405170\n2    1.290728\n3    0.068451\n4   -0.923677\n\
  dtype: float64\n```\n\n![](img/index-138_1.jpg)\n\n**第 8 章 开始使用 pandas**\n\n可以将其可视化为：\n\
  \n```\nts.plot()\nplt.grid(True)\nplt.show()\n```\n\n它产生如图 8-1 所示的输出。\n\n***图 8-1.**\
  \ 简单线图*\n\n我们可以使用函数`cumsum()`计算累积和，并将其可视化如下：\n\n```\nts.cumsum().plot()\nplt.grid(True)\n\
  plt.show()\n```\n\n![](img/index-139_1.jpg)\n\n**第 8 章 开始使用 pandas**\n\n输出如图 8-2\
  \ 所示。\n\n***图 8-2.** 累积和的简单线图*\n\n现在，像这样创建一个数据帧：\n\n```\ndf1 = pd.DataFrame(np.random.randn(10,\
  \ 4),\n                   columns=['A', 'B', 'C', 'D'])\nprint(df1)\n```\n\n以下输出是结果：\n\
  \n```\n          A         B         C         D\n0  0.474219  1.821673 -0.296638\
  \ -0.566934\n1  1.820044  2.199264  2.196097  0.203744\n2  0.086325 -1.056730  0.937690\
  \ -1.283733\n3  0.087798  1.145512 -0.407545  0.747684\n4 -0.179241  0.290476  1.823487\
  \ -0.059593\n5  1.964211 -0.525957  1.615896  0.046840\n6 -0.463331  0.032999  1.130027\
  \  1.151667\n7  1.805051 -0.338121 -0.397105  0.487373\n8 -1.212102 -0.610992  0.258653\
  \ -1.885551\n9 -1.052613  1.624191  0.529037  1.081536\n```\n\n![](img/index-140_1.jpg)\n\
  \n**第 8 章 开始使用 pandas**\n\n我们可以用垂直条形图将其可视化，如下所示：\n\n```\ndf1.plot.bar()\nplt.grid(True)\n\
  plt.show()\n```\n\n输出如图 8-3 所示。\n\n***图 8-3.** 垂直条形图*\n\n你甚至可以使用水平条形图，如下所示：\n\n\
  ```\ndf1.plot.barh()\nplt.grid(True)\nplt.show()\n```\n\n![](img/index-141_1.jpg)\n\
  \n**第 8 章 开始使用 pandas**\n\n图 8-4 显示了输出。\n\n***图 8-4.** 水平条形图*\n\n让我们创建另一个具有相似维度的数据帧。我们将使用`rand()`函数，该函数使用均匀正态分布生成一个`NumPy`\
  \ ndarray。示例如下：\n\n```\ndf2 = pd.DataFrame(np.random.rand(10, 4), columns=['A',\
  \ 'B',\n                                                    'C', 'D'])\nprint(df2)\n\
  ```\n\n输出如下所示：\n\n```\n          A         B         C         D\n0  0.416596  0.725513\
