- "# 第一章：Python 入门\n\n欢迎大家开启使用 Python 3 学习数据可视化的激动之旅。本章将详细介绍如何入门 `Python` 编程语言，包括其历史、特性及应用场景。\n\
  \n本章重点介绍 `Python` 3 的通用信息，以及如何在各种主流操作系统平台上进行安装，例如 Microsoft Windows、Ubuntu 和 Raspberry\
  \ Pi Raspbian。我们将编写几个基本的 Python 程序，并学习如何在不同的平台上执行它们。以下是本章将要涵盖的主题列表。\n\n-   Python\
  \ 编程语言\n-   在不同平台上安装 Python\n-   Python 模式\n\n完成本章学习后，你将能够熟练地在各种模式下安装和使用 `Python`\
  \ 3 编程语言。\n\n## Python 编程语言\n\n`Python` 3 是一种高级、解释型、通用编程语言。本节将围绕 `Python` 编程语言及其设计理念展开一般性讨论。\n\
  \n© Ashwin Pajankar 2021  \nA. Pajankar 著，《实用 Python 数据可视化》，  \n[`doi.org/10.1007/978-1-4842-6455-3_1`](https://doi.org/10.1007/978-1-4842-6455-3_1#DOI)\n\
  \n### Python 历史\n\n`Python` 是 `ABC` 编程语言的继任者，而 `ABC` 本身又受到 `ALGOL 68` 和 `SETL` 编程语言的启发。`Python`\
  \ 由**吉多·范罗苏姆**在 1980 年代末期休假期间作为个人副业项目创建，当时他就职于荷兰的 CWI 数学与信息学中心。从 `Python` 首次发布至\
  \ 2018 年 7 月，范罗苏姆一直是该项目的主要开发者及终身仁慈独裁者。此后，他进入了永久休假状态，目前担任 `Python` 指导委员会的成员。以下时间线详细列出了\
  \ `Python` 发布过程中的重要里程碑。\n\n-   1991 年 2 月：范罗苏姆将代码（标记为 0.9.0 版本）发布到 `alt.sources`。\n\
  -   1994 年 1 月：1.0 版本发布。\n-   2000 年 10 月：Python 2.0 发布。\n-   2006 年 12 月：Python\
  \ 3.0 发布。\n-   2019 年 12 月：Python 2.x 正式退役，Python 软件基金会不再对其提供支持。\n\n\n\n"
- '# Python 2.x 版本已退役，不再受支持。此外，`Python 3` 与 `Python 2` 不向后兼容。`Python 3` 是语言的最新且当前受支持的版本。因此，我们在本书中全程使用
  `Python 3` 来演示数据可视化的程序。


  除非特别说明，本书中提到的 `Python` 均指代 `Python 3`。


  ## 第 1 章 Python 入门


  ### Python 增强提案


  为了引导 `Python` 的开发、维护和支持，`Python` 领导团队提出了 `Python` 增强提案（`PEP`）的概念。这是为 `Python` 项目建议新特性和修复问题的主要机制。您可以在以下
  `URL` 中阅读更多关于 `PEP` 的信息：


  - [`www.python.org/dev/peps/`](https://www.python.org/dev/peps/)

  - [`www.python.org/dev/peps/pep-0001/`](https://www.python.org/dev/peps/pep-0001/)


  ### Python 的哲学


  `Python` 的哲学在 `PEP20` 中进行了详细阐述，被称为“Python 之禅”，可在 [`www.python.org/dev/peps/pep-0020/`](https://www.python.org/dev/peps/pep-0020/)
  获取。以下是该 `PEP` 中的一些要点：


  1.  优美胜于丑陋。

  2.  显式胜于隐式。

  3.  简单胜于复杂。

  4.  复杂胜于凌乱。

  5.  扁平胜于嵌套。

  6.  稀疏胜于密集。

  7.  可读性至关重要。

  8.  特殊情况不应特殊到足以违反规则。

  9.  尽管实用性胜过纯粹性。

  10. 错误不应默默无声地传递。

  11. 除非明确需要静默。

  12. 面对歧义，拒绝猜测的诱惑。

  13. 应该有一种——并且最好只有一种——显而易见的方式来做这件事。

  14. 尽管那种方式一开始可能并不明显，除非你是荷兰人。

  15. 现在做总比永远不做好。

  16. 虽然“永远不做”通常比“*现在*就做”要好。

  17. 如果实现难以解释，那可能是个坏主意。

  18. 如果实现易于解释，那可能是个好主意。

  19. 命名空间是个绝妙的主意——让我们更多地使用它们！


  这些是影响 `Python` 编程语言发展并持续发挥作用的一般性哲学指南。


  ### Python 的应用


  由于 `Python` 是一种通用编程语言，它在以下领域有众多应用：


  1.  网页开发。

  2.  图形用户界面（`GUI`）开发。

  3.  科学与数值计算。

  4.  软件开发。

  5.  系统管理。


  有关 `Python` 在各种项目中的案例研究，可在 [`www.python.org/success-stories/`](https://www.python.org/success-stories/)
  获取。


