  \n## 第 5 章 使用 `numpy` 和 `matplotlib` 进行数据可视化\n\n在本书的后续章节中，我们将使用 Matplotlib 和 NumPy\
  \ 来演示数据可视化。\n\n## Matplotlib\n\nMatplotlib 是 SciPy 的重要组成部分，用于数据可视化。它是 NumPy 的扩展，提供了类似\
  \ MATLAB 的绘图和可视化接口。它最初由 John D Hunter 开发，作为 Python 可用的开源替代方案。\n\n我们可以通过 Jupyter\
  \ Notebook 按如下方式安装它：\n\n```\n!pip3 install matplotlib\n```\n\n要在 notebook 中使用它进行基本绘图，我们必须按如下方式导入其\
  \ `pyplot` 模块：\n\n```\nimport matplotlib.pyplot as plt\n```\n\n此外，要在 notebook 中显示\
  \ Matplotlib 的可视化结果，我们必须运行以下命令：\n\n```\n%matplotlib inline\n```\n\n这强制 Matplotlib\
  \ 将输出内联显示，直接位于生成该可视化的代码单元格下方。当我们需要使用 Matplotlib 时，总会使用此命令。\n\n我们也来导入 NumPy，如下所示：\n\
  \n```\nimport numpy as np\n```\n\n你可以在 [`matplotlib.org/`](https://matplotlib.org/)\
  \ 上阅读关于 Matplotlib 的更多信息。\n\n### 使用 NumPy 和 Matplotlib 进行可视化\n\n现在我们将学习如何使用 `ndarray`\
  \ 创建例程来创建 NumPy ndarray，然后使用 Matplotlib 对其进行可视化。让我们从创建 `ndarray` 的例程开始。\n\n第一个例程是\
  \ `arange()`。它使用给定的步长创建均匀间隔的值。必须提供一个终止值参数。起始值和步长参数分别有默认参数 0 和 1。\n\n让我们看一个例子。\n\n\
  ```\nx = np.arange(5)\n```\n\n在此示例中，终止值为 5，因此它会创建一个从 0 开始到 4 结束的 `ndarray`。该函数返回一个具有半开区间的序列，这意味着终止值不包含在输出中。因为我们没有指定步长，它默认为\
  \ 1。我们可以查看输出及其数据类型，如下所示：\n\n```\nprint(x)\ntype(x)\n```\n\n输出如下：\n\n```\n[0 1 2\
  \ 3 4]\nnumpy.ndarray\n```\n\n让我们继续绘制这些数字。对于二维绘图，我们需要 X-Y 对。\n\n我们保持简单，通过运行以下语句设置\
  \ `y = f(x) = x`：`y=x`\n\n现在，使用函数 `plot()` 来可视化它。它需要 X、Y 的值以及绘图选项。我们将在本章后面学习更多关于绘图选项的内容。\n\
