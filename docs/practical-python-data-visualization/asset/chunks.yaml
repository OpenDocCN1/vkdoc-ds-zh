    ## Chapter 5 Data Visualization with `numpy` and `matplotlib`


    Throughout the remaining chapters of this book, we will use Matplotlib and NumPy
    to demonstrate data visualization.


    ### Matplotlib


    Matplotlib is an integral part of SciPy and it is used for visualization. It is
    an extension of NumPy. It provides a MATLAB-like interface for plotting and visualization.
    It was originally developed by John D Hunter as an open source alternative usable
    with Python.


    We can install it using Jupyter Notebook as follows:


    ```

    !pip3 install matplotlib

    ```


    To use it in the notebook for basic plotting, we must import its`pyplot`module
    as follows:


    ```

    import matplotlib.pyplot as plt

    ```


    Also, to show the Matplotlib visualizations in the notebook, we must run the following
    command:


    ```

    %matplotlib inline

    ```


    This forces Matplotlib to show the output inline, directly below the code cell
    that produces the visualization. We will always use this when we need to use Matplotlib.


    Let’s import NumPy, too, as follows:


    ```

    import numpy as np

    ```


    You can read more about Matplotlib at [https://matplotlib.org/](https://matplotlib.org/).


    ### Visualization with NumPy and Matplotlib


    We are now going to learn how to create NumPy ndarrays with`ndarray`creation routines
    and then use Matplotlib to visualize them. Let’s begin with the routines to create`ndarray`s.


    The first routine is`arange()`. It creates evenly spaced values with the given
    interval. A stop value argument is compulsory. The start value and interval parameters
    have default arguments of 0 and 1, respectively.


    Let’s look at an example.


    ```

    x = np.arange(5)

    ```


