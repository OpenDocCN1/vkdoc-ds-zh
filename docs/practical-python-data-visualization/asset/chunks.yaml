    !dir


    The output of this command is shown in Figur[e 3-1.](#index_split_000.html#p43)


    ***Figure 3-1.** Output of an OS command in Jupyter Notebook* You can upgrade
    the pip utility by running the following statement:


    !pip3 install --upgrade pip


    Install the library leather for data visualization demonstrations, using this
    statement:


    !pip3 install leather


    This installs the leather data visualization library on the computer. In the next
    section, we will get started with visualization with Python and leather using
    a notebook.


    ![](index-44_1.png)


