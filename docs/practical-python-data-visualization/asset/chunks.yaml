- fmt: '# Chapter 5 Data Visualization with numpy and matplotlib


    The first pair `(0, 2)` refers to the limits for the x axis and the second pair
    `(0, 8)` refers to the limits for the y axis. We can write this code with different
    syntax using the functions `xlim()` and `ylim()` as follows:


    ```python

    x = np.arange(3)


    plt.plot(x, x**2, x, x**3, x, 2*x, x, 2**x)


    plt.grid(True)

    ```


    ![Figure 5-12](index-81_1.jpg)


    ```python

    plt.xlim([0, 2])


    plt.ylim([0, 8])


    plt.show()

    ```


    This code produces exactly the same output as Figure 5-12. You can add the title
    and labels for the axes as follows:


    ```python

    x = np.arange(3)


    plt.plot(x, x**2, x, x**3, x, 2*x, x, 2**x)


    plt.grid(True)


    plt.xlabel(''x = np.arange(3)'')


    plt.xlim([0, 2])


    plt.ylabel(''y = f(x)'')


    plt.ylim([0, 8])


    plt.title(''Simple Plot Demo'')


    plt.show()

    ```


    That produces an output that includes the labels and the title as shown in Figure
    5-13.


    **Figure 5-13.** Title and labels for axes


    ![Figure 5-13](index-82_1.jpg)


    We can pass an argument for the parameter `label` in the `plot()` function and
    then call the function `legend()` to create a legend as follows:


    ```python

    x = np.arange(3)


    plt.plot(x, x**2, label=''x**2'')


    plt.plot(x, x**3, label=''x**3'')


    plt.plot(x, 2*x, label=''2*x'')


    plt.plot(x, 2**x, label=''2**x'')


    plt.legend()


    plt.grid(True)


    plt.xlabel(''x = np.arange(3)'')


    plt.xlim([0, 2])


    plt.ylabel(''y = f(x)'')


    plt.ylim([0, 8])


    plt.title(''Simple Plot Demo'')


    plt.show()

    ```


    That produces an output with legends for the curves as shown in Figure 5-14.


    **Figure 5-14.** Output with legends


    Instead of passing the legend string as an argument to the function `plot()`,
    we can pass the list of strings as an argument to the function `legend()` as follows:


    ```python

    x = np.arange(3)


    plt.plot(x, x**2, x, x**3, x, 2*x, x, 2**x)


    plt.legend([''x**2'', ''x**3'', ''2*x'', ''2**x''])


    plt.grid(True)


    plt.xlabel(''x = np.arange(3)'')


    plt.xlim([0, 2])


    plt.ylabel(''y = f(x)'')


    plt.ylim([0, 8])


    plt.title(''Simple Plot Demo'')


    plt.show()

    ```


    It produces exactly same output as displayed in Figure 5-14.


    We can also change the location of the legend box by making the following change
    to the preceding code:


    ```python

    plt.legend([''x**2'', ''x**3'', ''2*x'', ''2**x''], loc=''upper center'')

    ```


    The output is shown in Figure 5-15.


    ![Figure 5-15](index-84_1.jpg)


    **Figure 5-15.** Output with legends in upper middle position


    ## Colors, Styles, and Markers


    Thus far, in case of multiline plots, we have seen that Matplotlib automatically
    assigns colors, styles, and markers. We have also seen a few examples of customizing
    them. In this section, we will look at how to customize them in detail.


    Let’s start with colors. The following code lists all the primary colors supported
    by Matplotlib (we are not customizing styles and markers in this example).


    ```python

    x = np.arange(5)


    y = x


    plt.plot(x, y+1, ''g'')


    plt.plot(x, y+0.5, ''y'')


    plt.plot(x, y, ''r'')


    plt.plot(x, y-0.2, ''c'')


    plt.plot(x, y-0.4, ''k'')


    plt.plot(x, y-0.6, ''m'')


    plt.plot(x, y-0.8, ''w'')


    plt.plot(x, y-1, ''b'')


    plt.show()

    ```


    The output is displayed in Figure 5-16.


    ![Figure 5-16](index-85_1.jpg)


    We can also write the preceding code as follows:


    ```python

    plt.plot(x, y+1, ''g'', x, y+0.5, ''y'', x, y, ''r'', x, y-0.2, ''c'', x, y-0.4,
    ''k'', x, y-0.6, ''m'', x, y-0.8, ''w'', x, y-1, ''b'')


    plt.show()

    ```


    The output will be exactly same as Figure 5-16.


    **Figure 5-16.** Demo of colors


    We can customize the line style as follows:


    ```python

    plt.plot(x, y, ''-'', x, y+1, ''--'', x, y+2, ''-.'', x, y+3, '':'')


    plt.show()

    ```


    ![Figure 5-17](index-86_1.jpg)


    **Figure 5-17.** Line styles


    You can even change the markers as follows:


    ```python

    plt.plot(x, y, ''.'')


    plt.plot(x, y+0.5, '','')


    plt.plot(x, y+1, ''o'')


    plt.plot(x, y+2, ''<'')


    plt.plot(x, y+3, ''>'')


    plt.plot(x, y+4, ''v'')


    plt.plot(x, y+5, ''^'')

    ```'
