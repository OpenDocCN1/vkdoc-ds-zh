    \ 编程语言及其设计理念展开一般性讨论。\n\n© Ashwin Pajankar 2021  \nA. Pajankar 著，《实用 Python 数据可视化》，\
    \  \n[`doi.org/10.1007/978-1-4842-6455-3_1`](https://doi.org/10.1007/978-1-4842-6455-3_1#DOI)\n\
    \n### Python 历史\n\n`Python` 是 `ABC` 编程语言的继任者，而 `ABC` 本身又受到 `ALGOL 68` 和 `SETL`\
    \ 编程语言的启发。`Python` 由**吉多·范罗苏姆**在 1980 年代末期休假期间作为个人副业项目创建，当时他就职于荷兰的 CWI 数学与信息学中心。从\
