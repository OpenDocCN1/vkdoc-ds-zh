- fmt: "# We will mostly use this notebook format to store our code snippets for interactive\
    \ sessions because everything is saved in a single file, which can be shared easily\
    \ as discussed earlier.\n\nWe can clear the output of a cell or the entire notebook.\
    \ On the menu bar, select `Cell`. On the drop-down menu, `Current Outputs` and\
    \ `All Output` have `Clear` option that clears the output of cells. Figure 2-13\
    \ is a screenshot of the available options.\n\n**Figure 2-13.** Clearing the output\
    \ in Jupyter\n\n## Chapter 2: Exploring Jupyter Notebook\n\nOne of the most significant\
    \ advantages of Jupyter Notebook is that you can edit an already executed cell\
    \ if there is any syntax error or you simply want to change the code. Jupyter\
    \ Notebook is like an IDE that runs within a web browser and produces the output\
    \ in the same window. This interactivity and the ability to keep code, rich text,\
    \ and output in the same file has made Jupyter Notebook hugely popular worldwide.\
    \ The kernel for running Python programs comes from the IPython project. As I\
    \ mentioned earlier, we can use it for other programming languages, too. I have\
    \ used it for running GNU Octave programs as well.\n\n**Note:** You can find more\
    \ information about Jupyter Notebook and IPython at the following URLs:\n\n- [https://jupyter.org/](https://jupyter.org/)\n\
    - [https://ipython.org/](https://ipython.org/)\n\n## Summary\n\nIn this chapter,\
    \ we got started with installation of Jupyter Notebook on various platforms. We\
    \ then explored how we can run simple Python statements in Jupyter Notebook. We\
    \ learned that we can store the code and the output of that code in a single file\
    \ that can be shared easily over the Internet.\n\nIn the next chapter, we will\
    \ use Jupyter Notebook to work with simple visualizations using Python and a popular\
    \ data visualization library, `leather`.\n\n# CHAPTER 3: Data Visualization with\
    \ Leather\n\nIn Chapter 2, we acquainted ourselves with Python programming using\
    \ Jupyter Notebook. You should now be comfortable writing interactive Python programs\
    \ with Jupyter Notebook.\n\nIn this chapter, we will use Jupyter Notebook and\
    \ Python with a data visualization library, `leather`, to produce basic visualizations.\
    \ Here is the list of topics we will cover in this chapter:\n\n- Introduction\
    \ to `leather`\n- More types of visualizations\n- Scales\n- Styling\n\n## Running\
    \ OS Commands in Jupyter Notebook\n\nYou have seen how to use Jupyter Notebook\
    \ for Python programming. We will now explore how to execute an OS command in\
    \ the notebook. This is useful, as we need to use `pip` to install many utilities\
    \ and we can run it right from within the notebook.\n\n© Ashwin Pajankar 2021\
    \  \nA. Pajankar, *Practical Python Data Visualization*,  \n[https://doi.org/10.1007/978-1-4842-6455-3_3](https://doi.org/10.1007/978-1-4842-6455-3_3#DOI)\n\
    \n---\n\nChapter 3: Data Visualization with Leather\n\nCreate a new Jupyter notebook\
    \ for all the code in this chapter. We will follow this process for all of the\
