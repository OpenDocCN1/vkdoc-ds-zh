- fmt: "# Chapter 1: Introduction to Python\n\nI welcome you all to the exciting journey\
    \ of learning data visualization with Python 3. This chapter provides details\
    \ to get you started with the `Python` programming language, including its history,\
    \ features, and applications.\n\nThis chapter is focused on general information\
    \ about `Python` 3 and its installation on various popular operating system (OS)\
    \ platforms, such as Microsoft Windows, Ubuntu, and Raspberry Pi Raspbian. We\
    \ will be writing a few basic Python programs and learn how to execute them on\
    \ various platforms. Here is the list of topics that we will cover in this chapter.\n\
    \n- Python programming language  \n- Installing Python on various platforms  \n\
    - Python modes  \n\nAfter completing this chapter, you should be comfortable with\
    \ installation and usage of `Python` 3 programming language in various modes.\n\
    \n## Python Programming Language\n\n`Python` 3 is a high-level, interpreted, general-purpose\
    \ programming language. This section provides a general discussion about the `Python`\
    \ programming language and its philosophy.\n\n© Ashwin Pajankar 2021  \nA. Pajankar,\
    \ *Practical Python Data Visualization*,  \n[https://doi.org/10.1007/978-1-4842-6455-3_1](https://doi.org/10.1007/978-1-4842-6455-3_1#DOI)\n\
    \n### History of Python\n\n`Python` is a successor to the `ABC` programming language,\
    \ which itself was inspired by the `ALGOL 68` and `SETL` programming languages.\
    \ It was created by `Guido Van Rossum` as a personal side project during vacations\
    \ in the late 1980s while he was working at CWI Centrum Wiskunde & Informatica\
    \ in the Netherlands. From the initial release of `Python` through July 2018,\
    \ Van Rossum was the lead developer and Benevolent Dictator for Life for this\
    \ project. Since then, he has gone into a state of permanent vacation and now\
    \ works on a steering committee for `Python`. The following timeline details the\
    \ important milestones in `Python`'s release.\n\n- February 1991: Van Rossum published\
    \ the code (labeled version 0.9.0) to `alt.sources`.  \n- January 1994: Version\
    \ 1.0 was released.  \n- October 2000: Python 2.0 was released.  \n- December\
    \ 2006: Python 3.0 was released.  \n- December 2019: Python 2.x was officially\
    \ retired and is no longer supported by the Python Software Foundation."
