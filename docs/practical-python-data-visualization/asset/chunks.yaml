    ### 网格、坐标轴和标签


    之前，我们了解了如何在可视化图形中启用网格。这可以通过语句 `plt.grid(True)` 实现。现在，我们将学习如何操作坐标轴的界限。不过在此之前，我们先快速学习如何将可视化图形保存为图片。请看以下代码：

    ```

    x = np.arange(3)

