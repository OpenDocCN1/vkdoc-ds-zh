  raw: 'Basically, these methods are wrappers over the methods in Matplotlib.


    Let’s look at how we can use these methods to visualize the data stored in the
    pandas dataframes.


    Let’s import the pyplot module of Matplotlib and use the magic command to enable
    Matplotlib visualization in the notebook as follows:


    %matplotlib inline


    import matplotlib.pyplot as plt


    The NumPy function randn() generates a NumPy array with a


    standard normal random distribution. We will use this to create a series and plot
    it as follows:


    ts = pd.Series(np.random.randn(5))


    ts


    The output is as follows (it will be different every time you execute the code,
    as it is randomly generated at the time of execution): 0 0.257543


    1 1.405170


    2 1.290728


    3 0.068451


    4 -0.923677


    dtype: float64


    ![](index-138_1.jpg)


    Chapter 8 GettinG Started with pandaS


    This can be visualized as follows:


    ts.plot()


    plt.grid(True)


    plt.show()


    It produces the output shown in Figur[e 8-1.](#index_split_000.html#p138)


    ***Figure 8-1.** Simple plot*


    We can compute the cumulative sum with the function cumsum() and visualize it
    as follows:


    ts.cumsum().plot()


    plt.grid(True)


    plt.show()


    ![](index-139_1.jpg)


