    ## Chapter 1 Introduction to Python


    ***Figure 1-3.** Python installation options*


    Select all the check boxes and click `Next` to continue the setup.


    Complete the setup. The name of the binary executable program for Python is `python`
    on Windows OS. Once installation is finished, run the following command at the
    Windows command prompt `cmd`.


    ```

    python -V

    ```


    It will return the version of Python 3 as follows:


    ```

    Python 3.8.1

    ```


    We can also check the version of `pip3` as follows:


    ```

    pip3 -V

    ```


    `pip` stands for Pip installs Python or Pip installs Packages; its name is a recursive
    acronym. It is a package manager for the Python programming language. We can install
    the other needed Python libraries for our demonstrations using the `pip` utility.


    ## Chapter 1 Introduction to Python


    To determine the exact locations of Python, you can run the `where` command as
    follows:


    ```

    where python

    ```


    It returns the following result:


    ```

    C:\Users\Ashwin\AppData\Local\Programs\Python\Python38-32\

    python.exe

    ```


    Similarly, we can learn the location of the `pip3` utility by running the following
    command:


    ```

    where pip3

    ```


    ## Installing on Ubuntu and Debian Derivatives


    Debian is a popular distribution. Ubuntu Linux and Raspberry Pi OS are other popular
    distributions based on Debian. Python 3 and `pip3` come preinstalled on all the
    Debian distributions and derivatives like Ubuntu or Raspberry Pi OS, so we do
    not have to install them separately. I use Raspberry Pi OS on a Raspberry Pi 4B
    with 4 GB RAM. Both the major Python versions, Python 2 and Python 3, come preinstalled
    on Debian derivatives. Their executables are named `python` and `python3` for
    Python 2 and Python 3, respectively. We must use `python3` for our demonstrations.


    To determine the versions and locations of the needed binary executable files,
    run the following commands one by one.


    ```

    python3 -V

    pip3 -V

    which python3

    which pip3

    ```


    Almost all the other popular Linux distributions come with Python preinstalled,
    too.


    ![](index-21_1.jpg)


    ## Chapter 1 Introduction to Python


    ## Python Modes


    Python has various modes that we will discuss one by one. First, though, we need
    to learn about the integrated development and learning environment (IDLE). This
    is an integrated development environment (IDE) developed by the Python Software
    Foundation for Python programming. When we install the CPython implementation
    of Python 3 on Windows, IDLE is also installed.


    We can launch it on the Windows OS in various ways. The first way is to search
    for it in the Windows Search bar by typing `IDLE` as shown in Figure [1-4.](#index_split_000.html#p21)


    ***Figure 1-4.** Python IDLE on Windows*


    ![](index-22_1.png)


    ![](index-22_2.jpg)


    ## Chapter 1 Introduction to Python


    The other way is to launch it from the command prompt (`cmd`) by running the following
    command:


    ```

    idle

    ```


    This will launch the window shown in Figure [1-5](#index_split_000.html#p22).


    ***Figure 1-5.** Python IDLE*


    Before we proceed, we need to configure it to be easy to read. We can change the
    font by selecting `Options` ➤ `Configure IDLE` as shown in Figure [1-6.](#index_split_000.html#p22)


    ***Figure 1-6.** Configuring IDLE*


    The window shown in Figure [1-7 op](#index_split_000.html#p23)ens. There you can
    change the font and size of the characters in IDLE.


    ![](index-23_1.png)


    ## Chapter 1 Introduction to Python


    ***Figure 1-7.** IDLE configuration*


    ![](index-24_1.jpg)


    ## Chapter 1 Introduction to Python


    Adjust the font settings according to your own preferences.


    All the Linux distributions might not come with IDLE preinstalled. We can install
    it on Debian and its derivatives (Ubuntu and Raspberry Pi OS) by running the following
    commands in sequence.


    ```

    sudo apt-get update

    sudo apt-get install idle3

    ```


    Once the installation is complete, we can find IDLE on the menu (in this case
    the Raspberry Pi OS menu) as shown in Figure [1-8](#index_split_000.html#p24).


    ***Figure 1-8.** IDLE on the Raspberry Pi OS menu*


