    a node in a graph is known as the degree of that node. We can say that a path
    graph is a graph that has two nodes of degree one and the rest of the nodes have
    degree two. If we arrange a path graph visually, it looks like a segmented line.
    To create a path graph, run the following code: G = nx.path_graph(4)


