    \ 你可以在以下网址找到关于 Jupyter Notebook 和 IPython 的更多信息：\n\n- [`jupyter.org/`](https://jupyter.org/)\n\
    - [`ipython.org/`](https://ipython.org/)\n\n## 本章小结\n\n在本章中，我们开始在各平台上安装 Jupyter\
    \ Notebook。接着探讨了如何在 Jupyter Notebook 中运行简单的 Python 语句。我们了解到，可以将代码及其输出存储在单个文件中，便于在互联网上分享。\n\
    \n在下一章中，我们将使用 Jupyter Notebook，结合 Python 和一款流行的数据可视化库 `leather`，进行简单的可视化操作。\n\n\
    # 第 3 章：使用 Leather 进行数据可视化\n\n在第 2 章中，我们使用 Jupyter Notebook 熟悉了 Python 编程。现在，你应该能熟练地使用\
    \ Jupyter Notebook 编写交互式 Python 程序了。\n\n在本章中，我们将使用 Jupyter Notebook 和 Python，并结合数据可视化库\
    \ `leather` 来生成基本的可视化图表。以下是本章将涵盖的主题列表：\n\n- `leather` 简介\n- 更多可视化类型\n- 比例\n- 样式设置\n\
    \n## 在 Jupyter Notebook 中运行操作系统命令\n\n你已经了解了如何使用 Jupyter Notebook 进行 Python 编程。现在我们将探讨如何在笔记本中执行操作系统命令。这很有用，因为我们需要使用\
    \ `pip` 来安装许多实用程序，我们可以在笔记本中直接运行它。\n\n© Ashwin Pajankar 2021  \nA. Pajankar, *实用\
    \ Python 数据可视化*,  \n[`doi.org/10.1007/978-1-4842-6455-3_3`](https://doi.org/10.1007/978-1-4842-6455-3_3#DOI)\n\
    \n---\n\n第 3 章：使用 Leather 进行数据可视化\n\n为本章所有代码创建一个新的 Jupyter 笔记本。我们将在所有章节中遵循此流程，因此到本书结束时，我们将按章节将所有程序都保存在笔记本中。\n\
    \n要在笔记本单元格中执行操作系统命令，我们必须使用 `!` 符号作为前缀，如下所示：\n\n```\n!dir\n```\n\n该命令的输出如图 3-1\
    \ 所示。\n\n**图 3-1.** Jupyter Notebook 中操作系统命令的输出\n\n你可以通过运行以下语句来升级 `pip` 工具：\n\n\
    ```\n!pip3 install --upgrade pip\n```\n\n使用以下语句安装用于数据可视化演示的 `leather` 库：\n\n```\n\
    !pip3 install leather\n```\n\n这将在计算机上安装 `leather` 数据可视化库。在下一节中，我们将开始使用笔记本进行 Python\
    \ 和 `leather` 的可视化操作。\n\n---\n\n第 3 章：使用 Leather 进行数据可视化\n\n## Leather 简介\n\n\
    `leather` 是一个易于使用、广受欢迎的 Python 数据可视化库。你可以在 Python 包索引 (PyPI) 上找到它，网址为 [`pypi.org/project/leather/`](https://pypi.org/project/leather/)。\n"
- fmt: '# Chapter 3 Data Visualization with leather


    [org/project/leather/](https://pypi.org/project/leather/). `PyPI` is a repository
    of third-party packages that can be downloaded using the `pip3` utility. We can
    also search for availability of a package on PyPI. Run the following command in
    the notebook:


    ```

    !pip3 search leather

    ```


    The output is shown in Figure [3-2](#index_split_000.html#p44).


    ***Figure 3-2.** Searching for a package with pip3*


    Before we can proceed further, we need to know a few things about the Python programming
    language in advance. In Python, tabs or indentations are used to denote code blocks.
    In a few popular programming languages like C, C++, and Java, multiline code blocks
    are enclosed in curly brackets `{}`. Python instead forces programmers to indent
    the code blocks and there is no other way to denote them. Consider the following
    code as an example.


    ```

    a = 3


    if a%2 == 0:


    print(''Even'')


    else:


    print(''Odd'')

    ```


    Run that code in the notebook and see the result. There is also a fun thing you
    can try. We have already learned about PEP 20, the Zen of Python. The Python creator
    added it as an Easter egg in the interpreter, and you can invoke it with the following
    statement:


    ```

    import this

    ```


    If you run the statement in the notebook, it prints all the statements in the
    Zen of Python in the output.


    Note that whatever program we are going to demonstrate with Jupyter Notebook can
    also be run with the IDLE with a few changes. We are using Jupyter Notebook for
    its immediate feedback and interactive features. Now let’s use the `import` statement
    to add the leather library to our notebook.


    We just need to import it once per session and it will be available to us throughout
    the session. Use this statement:


    ```

    import leather

    ```


    Run this and it imports the library to the current notebook session. It is a good
    idea to use a heading for every new topic, but I leave it to your discretion.
    You will find that I use headings quite often in the notebooks for the code bundle
    of this book to provide context and reference to whatever I am demonstrating.
    It is a good practice and you might want to follow it.


    Let us write simple code for visualization of a few points. We can define the
    points in an X-Y coordinate system. We can use a list of tuples to define points
    as follows:


    ```

    data1 = [(1.5, 2), (2, 3), (4.5, 6), (7.5, 4)]

    ```


    We can also define them as a list of lists:


    ```

    data1 = [[1.5, 2], [2, 3], [4.5, 6], [7.5, 4]]

    ```


    We can also define them as a tuple of tuples:


    ```

    data1 = ((1.5, 2), (2, 3), (4.5, 6), (7.5, 4))

    ```


    ![](index-46_1.jpg)


    We can also define them as a tuple of lists:


    ```

    data1 = ([1.5, 2], [2, 3], [4.5, 6], [7.5, 4])

    ```


    As you can see, the leather library is not very particular and is very flexible
    about how we define our data.


    Let us define a chart object as follows:


    ```

    chart = leather.Chart(''Simple pairs of x-y'')

    ```


    Next, create a dot chart:


    ```

    chart.add_dots(data1)

    ```


    Then let’s visualize the chart as follows:


    ```

    chart.to_svg()

    ```


    It will display the output in the same notebook, as shown in Figure [3-3](#index_split_000.html#p46).


    ***Figure 3-3.** Plotting the points*


    ![](index-47_1.jpg)


    We can save the image to disk with the following statement:


    ```

    chart.to_svg(''image1.svg'')

    ```


    We can then customize dots as follows:


    ```

    chart = leather.Chart(''Customised Dots'')

    chart.add_dots(data1, fill_color=''#00ff00'', radius=10)

    chart.to_svg()

    ```


    Let us define more data points:


    ```

    data2 = [(2, 3), (4, 5), (5, 6), (7, 5)]

    ```


    We can also visualize multiple series as follows:


    ```

    chart = leather.Chart(''Visualizing Multiple series'')

    chart.add_dots(data1)

    chart.add_dots(data2)

    chart.to_svg()

    ```


    The output is shown in Figure [3-4](#index_split_000.html#p47).


    ***Figure 3-4.** Plotting the multiple series*


    ![](index-48_1.jpg)


    As we can see in Figure [3-4](#index_split_000.html#p47), leather automatically
    assigns different colors to the points based on the series to which they belong.


    ## More Types of Visualizations'
