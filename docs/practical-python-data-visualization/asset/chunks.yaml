    **CHAPTER 2**


    **Exploring Jupyter**


    **Notebook**


    In Chapter [1](#index_split_000.html#p13), we acquainted ourselves with Python
    and learned how to write a very simple program with Python. We also saw how to
    use Python in both interactive mode and script mode. In this chapter, we explore
    Jupyter Notebook. In Chapter [1 w](#index_split_000.html#p13)e saw that interactive
    mode offers us the immediate feedback of Python statements. We will continue using
    the interactive mode of Python throughout the book almost all of the demonstrations.
    However, rather than using Python’s built-in interactive mode with an interpreter,
    we will use another and much better tool known as the Jupyter tool. This entire
    chapter is dedicated to this topic.


    You will learn about the following topics in this chapter:


    • Overview of Jupyter Notebook.


    • Setting up Jupyter Notebook.


    • Running code in Jupyter Notebook.


    After you complete this chapter, you should be comfortable with Python programming
    using Jupyter Notebook.


    © Ashwin Pajankar 2021


    A. Pajankar, *Practical Python Data Visualization*,


    [https://doi.org/10.1007/978-1-4842-6455-3_2](https://doi.org/10.1007/978-1-4842-6455-3_2#DOI)


    Chapter 2 exploring Jupyter notebook


    **Overview of Jupyter Notebook**


    In Chapter [1](#index_split_000.html#p13), you learned various ways to run Python
    statements. We ran Python statements in a script and in the interpreter’s interactive
    mode. The main advantage of using interactive mode is the immediate feedback.
    The main disadvantage of this mode is that, if we make any mistakes in typing
    the statements while and then execute the erroneous statement, we must rewrite
    the entire statement to reexecute it. It is also difficult to save it as a program.
    The option for saving the statements run on the interpreter can be found under
    the File menu option. However, all the statements and their outputs will be saved
    in plain text format with a .py extension.


    If there is any graphical output, it is displayed separately and cannot be stored
    along with the statements.


    Owing to these limitations of interactive mode with interpreter, we will use a
    better tool for running the Python statements interactively in the web browser:
    Jupyter Notebook. Jupyter is a server program that can create interactive notebooks
    in a web browser.


    A Jupyter notebook is a web-based notebook that is used for interactive programming
    with various languages, including Python, Octave, Julia, and R. It is very popular
    with people working in research domains. A Jupyter notebook can have code, visualizations,
    output, and rich text in a single file. The advantage of Jupyter Notebook over
    Python’s own interactive prompt is that, users can edit the code and see the new
    output instantly, which is not possible in Python interactive mode. Another advantage
    is that we have the code, rich text elements, and the code’s output (which could
    be in graphical or rich text format) in the same file on the disk. This makes
    it easy to distribute. We can save and share these notebooks over the Internet
    or using portable storage equipment. There are many services online that help
    us to store and execute Jupyter Notebook scripts on cloud servers.


    ![](index-31_1.jpg)


    Chapter 2 exploring Jupyter notebook


    **Setting up Jupyter Notebook**


    We can easily install the Jupyter Notebook server program on any computer by running
    the following command at the command prompt: pip3 install jupyter


    Let’s explore how we can use Jupyter Notebook for writing and executing Python
    statements. Run the following command at the OS


    command prompt to launch the Jupyter Notebook server process there: jupyter notebook


    Once the Jupyter notebook server process is launched, the command prompt window
    shows a server log, as displayed in Figure [2-1](#index_split_000.html#p31).


    ***Figure 2-1.** Launching a new Jupyter Notebook process* 19


    ![](index-32_1.jpg)'
