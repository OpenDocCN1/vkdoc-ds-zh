    \n`chart.add_line(data1)`\n\n`chart.add_line(data2)`\n\n`chart.to_svg()`\n\n![](index-50_1.jpg)\n\
    \nChapter 3 Data Visualization with leather\n\nFigure [3-7](#index_split_000.html#p50)\
    \ shows the output.\n\n***Figure 3-7.** Visualizing multiple lines*\n\nWe can\
