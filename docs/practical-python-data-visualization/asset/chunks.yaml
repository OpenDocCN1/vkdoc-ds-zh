- fmt: '# Chapter 1 Introduction to Python


    We can also launch `IDLE` on Linux by running the following command: `idle`


    Now let us discuss the various Python modes.


    ## Interactive Mode


    Python’s interactive mode is a command-line type of shell that executes the current
    statement and gives immediate feedback in the console. It runs the previously
    fed statements in active memory. As new statements are fed into and executed by
    the interpreter, the code is evaluated. When we open `IDLE`, we see a command-line
    prompt that is Python’s interactive mode.


    Let’s look at a simple example. Let’s type in the customary Hello World program
    in the interactive prompt as follows:


    ```

    print(''Hello World!'')

    ```


    Press Enter to feed the line to the interpreter and execute it. [Figure 1-9](#index_split_000.html#p25)
    presents a screenshot of the output.


    **Figure 1-9.** Python interactive mode on IDLE


    ![](index-26_1.png)


    We can launch Python interactive mode from the command prompt, too. At the Linux
    command prompt (e.g., `lxterminal`), we must run the command `python3` and at
    the Windows command prompt `cmd`, we have to run the command `python` to launch
    it. [Figure 1-10](#index_split_000.html#p26) is a screenshot of the interactive
    mode at the Windows command prompt.


    **Figure 1-10.** Python interactive mode at the Windows command prompt


    ## Script Mode


    We can write a Python program and save it to disk. Then we can launch it in multiple
    ways. This is known as script mode. Let us demonstrate it in `IDLE`. We can use
    any text editor to write the Python program, but because `IDLE` is an IDE, it
    is convenient to write and run the Python programs with `IDLE`. Let’s look at
    that first. In `IDLE`, select File ➤ New File to create a blank new file. Add
    the following code to that:


    ```

    print(''Hello World!'')

    ```


    Save it with the name `prog01.py` on the disk ([Figure 1-11](#index_split_000.html#p27)).


    ![](index-27_1.jpg)


    ![](index-27_2.png)


    **Figure 1-11.** A Python program in the IDLE code editor


    On the menu, click Run ➤ Run Module. This executes the program at the IDLE’s prompt,
    as shown in [Figure 1-12](#index_split_000.html#p27).


    **Figure 1-12.** A Python program under execution at the IDLE prompt


    We can even launch the program with Python’s interpreter at the command prompt
    of the OS, too. Open the command prompt of the OS and navigate to the directory
    where the program is stored. At the Windows command prompt, run the following
    command:


    ```

    python prog01.py

    ```


    On the Linux terminal, we must run the following command prompt: `python3 prog01.py`


    Then the interpreter will run the program at the command prompt and the output
    (if any) will appear there.


    In Linux, there is another way we can run the program without explicitly using
    the interpreter. We must add a shebang line to the beginning of the code file.
    For example, our code file looks like this:


    ```

    #!/usr/bin/python3


    print(''Hello World!'')

    ```


    The first line of this code is known as a shebang line. It tells the shell what
    interpreter to use and its location. Run the following command to change the file
    permission to make it executable for the owner as follows: `chmod 755 prog01.py`


    Then we can directly launch our Python program file like any other executable
    with `./` as follows:


    ```

    ./prog01.py

    ```


    The shell will execute the program and print the output to the terminal.


    Note that this is applicable only for Unix-like systems (Linux and macOS) as they
    support executing programs like this. We will learn more about the Python programming
    as and when we need from the next chapter onward.


    ## Summary


    This chapter started with the basics of the Python programming language.


    You learned how to write basic Python programs and execute them in various ways.
    You learned to work with Python on various OSs, including Windows and Linux. You
    also learned about various Python modes and how to launch them from the command
    prompts of various OSs.'
