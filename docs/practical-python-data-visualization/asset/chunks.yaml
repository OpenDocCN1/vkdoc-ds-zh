    with ./ as follows:


    ./prog01.py


    The shell will execute the program and print the output to the terminal.


    Note that this is applicable only for Unix-like systems (Linux and macOS) as they
    support executing programs like this. We will learn more about the Python programming
    as and when we need from the next chapter onward.


    **Summary**


    This chapter started with the basics of the Python programming language.


    You learned how to write basic Python programs and execute them in various ways.
    You learned to work with Python on various OSs, including Windows and Linux. You
    also learned about various Python modes and how to launch them from the command
    prompts of various OSs.'
  trans: '

    # 第 1 章 Python 简介


    我们也可以在 Linux 上通过运行以下命令来启动 `IDLE`：`idle`


    现在让我们来讨论 Python 的各种模式。


    ## 交互模式


    Python 的交互模式是一种命令行式的 shell，它能执行当前语句并在控制台中立即给出反馈。它会将之前输入的语句保存在活动内存中运行。当新语句被输入并由解释器执行时，代码会被求值。当我们打开
    `IDLE` 时，会看到一个命令行提示符，这就是 Python 的交互模式。


    让我们看一个简单的例子。在交互式提示符中输入常规的 Hello World 程序，如下所示：


    ```

    print(''Hello World!'')

    ```


    按下回车键，将这一行输入到解释器中并执行它。图 1-9 展示了输出的截图。


    **图 1-9.** IDLE 中的 Python 交互模式


    ![](img/index-26_1.png)


    我们也可以从命令提示符启动 Python 交互模式。在 Linux 命令提示符（例如 `lxterminal`）下，必须运行命令 `python3`；而在
    Windows 命令提示符 `cmd` 下，则需运行命令 `python` 来启动它。图 1-10 是 Windows 命令提示符下交互模式的截图。


    **图 1-10.** Windows 命令提示符下的 Python 交互模式


    ## 脚本模式


    我们可以编写一个 Python 程序并将其保存到磁盘。然后可以通过多种方式启动它。这被称为脚本模式。让我们在 `IDLE` 中演示一下。我们可以使用任何文本编辑器来编写
    Python 程序，但由于 `IDLE` 是一个 IDE，使用 `IDLE` 编写和运行 Python 程序非常方便。我们先来看这个。在 `IDLE` 中，选择
    File ➤ New File 来创建一个新的空白文件。在其中添加以下代码：


    ```

    print(''Hello World!'')

    ```


    将其保存为 `prog01.py` 文件到磁盘上（图 1-11）。


    ![](img/index-27_1.jpg)


    ![](img/index-27_2.png)


    **图 1-11.** IDLE 代码编辑器中的 Python 程序


    在菜单中，点击 Run ➤ Run Module。这会在 IDLE 的提示符下执行该程序，如图 1-12 所示。


    **图 1-12.** 在 IDLE 提示符下执行的 Python 程序


    我们甚至可以在操作系统的命令提示符下，使用 Python 解释器来启动该程序。打开操作系统的命令提示符，并导航到程序存储的目录。在 Windows 命令提示符下，运行以下命令：


    ```

    python prog01.py

    ```


    在 Linux 终端上，必须运行以下命令提示符：`python3 prog01.py`


    然后解释器会在命令提示符下运行该程序，输出（如果有）会出现在那里。


    在 Linux 中，还有一种无需显式使用解释器即可运行程序的方法。我们必须在代码文件的开头添加一个 shebang 行。例如，我们的代码文件如下所示：


    ```

    #!/usr/bin/python3


    print(''Hello World!'')

    ```


    这段代码的第一行被称为 shebang 行。它告诉 shell 要使用哪个解释器及其位置。运行以下命令来更改文件权限，使其对所有者可执行：`chmod 755
    prog01.py`


    然后，我们可以像运行其他可执行文件一样，使用 `./` 直接启动我们的 Python 程序文件，如下所示：


    ```

    ./prog01.py

    ```


    shell 将执行该程序并将输出打印到终端。


    请注意，这仅适用于类 Unix 系统（Linux 和 macOS），因为它们支持以这种方式执行程序。从下一章开始，我们将根据需要逐步学习更多关于 Python
    编程的知识。


    ## 总结


    本章从 Python 编程语言的基础知识开始。


    你学习了如何编写基本的 Python 程序并以多种方式执行它们。你学习了如何在包括 Windows 和 Linux 在内的各种操作系统上使用 Python。你还了解了
    Python 的各种模式，以及如何从不同操作系统的命令提示符中启动它们。

    '
- fmt: "# Chapter 2: Exploring Jupyter Notebook\n\nIn the next chapter, we will learn\
    \ how to install `Jupyter Notebook` and take a brief tour of `Jupyter Notebook`.\n\
    \nIn Chapter 1, we acquainted ourselves with Python and learned how to write a\
    \ very simple program with Python. We also saw how to use Python in both interactive\
    \ mode and script mode. In this chapter, we explore `Jupyter Notebook`. In Chapter\
    \ 1 we saw that interactive mode offers us the immediate feedback of Python statements.\
    \ We will continue using the interactive mode of Python throughout the book almost\
    \ all of the demonstrations. However, rather than using Python’s built-in interactive\
    \ mode with an interpreter, we will use another and much better tool known as\
    \ the `Jupyter` tool. This entire chapter is dedicated to this topic.\n\nYou will\
    \ learn about the following topics in this chapter:\n\n- Overview of `Jupyter\
    \ Notebook`.\n- Setting up `Jupyter Notebook`.\n- Running code in `Jupyter Notebook`.\n\
    \nAfter you complete this chapter, you should be comfortable with Python programming\
    \ using `Jupyter Notebook`.\n\n© Ashwin Pajankar 2021  \nA. Pajankar, *Practical\
    \ Python Data Visualization*,  \n[https://doi.org/10.1007/978-1-4842-6455-3_2](https://doi.org/10.1007/978-1-4842-6455-3_2#DOI)\n\
    \n## Overview of `Jupyter Notebook`\n\nIn Chapter 1, you learned various ways\
    \ to run Python statements. We ran Python statements in a script and in the interpreter’s\
    \ interactive mode. The main advantage of using interactive mode is the immediate\
    \ feedback. The main disadvantage of this mode is that, if we make any mistakes\
    \ in typing the statements while and then execute the erroneous statement, we\
    \ must rewrite the entire statement to reexecute it. It is also difficult to save\
    \ it as a program. The option for saving the statements run on the interpreter\
    \ can be found under the File menu option. However, all the statements and their\
    \ outputs will be saved in plain text format with a `.py` extension.\n\nIf there\
    \ is any graphical output, it is displayed separately and cannot be stored along\
    \ with the statements.\n\nOwing to these limitations of interactive mode with\
    \ interpreter, we will use a better tool for running the Python statements interactively\
    \ in the web browser: `Jupyter Notebook`. `Jupyter` is a server program that can\
    \ create interactive notebooks in a web browser.\n\nA `Jupyter` notebook is a\
    \ web-based notebook that is used for interactive programming with various languages,\
    \ including Python, Octave, Julia, and R. It is very popular with people working\
    \ in research domains. A `Jupyter` notebook can have code, visualizations, output,\
    \ and rich text in a single file. The advantage of `Jupyter Notebook` over Python’s\
    \ own interactive prompt is that, users can edit the code and see the new output\
    \ instantly, which is not possible in Python interactive mode. Another advantage\
    \ is that we have the code, rich text elements, and the code’s output (which could\
    \ be in graphical or rich text format) in the same file on the disk. This makes\
    \ it easy to distribute. We can save and share these notebooks over the Internet\
    \ or using portable storage equipment. There are many services online that help\
    \ us to store and execute `Jupyter Notebook` scripts on cloud servers.\n\n## Setting\
    \ up `Jupyter Notebook`\n\nWe can easily install the `Jupyter Notebook` server\
    \ program on any computer by running the following command at the command prompt:\n\
    \n```\npip3 install jupyter\n```\n\nLet’s explore how we can use `Jupyter Notebook`\
    \ for writing and executing Python statements. Run the following command at the\
    \ OS command prompt to launch the `Jupyter Notebook` server process there:\n\n\
    ```\njupyter notebook\n```\n\nOnce the `Jupyter notebook` server process is launched,\
    \ the command prompt window shows a server log, as displayed in Figure 2-1.\n\n\
    **Figure 2-1.** Launching a new Jupyter Notebook process"
