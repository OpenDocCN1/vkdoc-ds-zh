    \n`chart.add_line(data1, stroke_color='#0000ff', width=3)`\n\n`chart.to_svg()`\n\
    \n![](index-49_1.jpg)\n\nChapter 3 Data Visualization with leather\n\nFigure [3-6](#index_split_000.html#p49)\
    \ displays the output.\n\n***Figure 3-6.** Customizing the line*\n\nWe can visualize\
