    \n`leather.theme.default_series_colors = ['#ff0000', '#00ff00']`\n\n`chart = leather.Chart('自定义字体')`\n\
    \n`chart.add_line(data1)`\n\n`chart.add_line(data2)`\n\n`chart.to_svg()`\n\n![](img/index-58_1.jpg)\n\
    \n## 第 3 章 使用 leather 进行数据可视化\n\n图 3-16 展示了此示例的输出结果。\n\n***图 3-16.** 自定义字体与颜色*\n\
    \n我们还可以通过以下代码根据数据点的位置为其着色。首先在笔记本中导入随机库：`import random`\n\n我们将使用它生成如下数据点：\n\n```python\n\
    data = [(random.randint(0, 250),\n         random.randint(0, 250)) for i in range(100)]\n\
    ```\n\n这会创建 100 个数据点。这 100 个点的 x 轴和 y 轴值均从 0 到 250 的区间中随机选取。我们可以编写一个颜色函数，根据点的位置返回\
    \ RGB 格式的颜色值。\n\n```python\ndef colorizer(location):\n    return 'rgb(%i, %i,\
    \ %i)' % (location.x, location.y, 150)\n```\n\n![](img/index-59_1.jpg)\n\n## 第\
    \ 3 章 使用 leather 进行数据可视化\n\n调用此函数来定义点的填充颜色，具体如下：\n\n```python\nchart = leather.Chart('着色点')\n\
    chart.add_dots(data, fill_color=colorizer)\nchart.to_svg()\n```\n\n输出结果如图 3-17\
    \ 所示。\n\n***图 3-17.** 数据点的自定义颜色*\n\n## 本章小结\n\n本章通过使用流行的数据可视化库 leather 演示了如何用\
    \ Python 进行数据可视化。我们介绍了不同类型的可视化图表、样式和刻度。Leather 是一个非常简单的数据可视化库，仅能可视化简单的图形。\n\n\
    你的业务需求或科学可视化可能需要更复杂精细的图表。为此，你需要熟悉科学 Python 生态系统。下一章将详细探讨科学 Python 生态系统。我们还将学习\
    \ NumPy N 维数组（也称为 ndarray）的基础知识。\n\n## 第 4 章\n\n## 科学 Python 生态系统与 NumPy\n\n在第\
    \ 3 章中，你学习了如何使用 Python 3 和 leather 数据可视化库创建简单的可视化图表。你还了解到，使用 leather 数据可视化库只能准备基本的可视化图表。对于更复杂精细的可视化，我们需要使用具有高级数据处理和可视化功能的库。\n\
    \n本章将探讨科学 Python 生态系统及其组成部分。它还将通过几个代码演示简要介绍 NumPy 库。本章探讨以下主题：\n\n- 科学 Python 生态系统\n\
    - NumPy 与 ndarray\n- Ndarray 属性\n- NumPy 常量\n\n在本书的剩余章节中，我们将逐一探讨科学 Python 生态系统的许多组成部分。在整本书中，我们将使用属于这个科学\
    \ Python 生态系统的不同库。本章获得的有价值知识将为后续章节奠定基础。由于本章是为一个广泛的生态系统编写的入门章节，我将其保持得简短而实用。\n\n\
    © Ashwin Pajankar 2021  \nA. Pajankar 著，《实用 Python 数据可视化》，  \n<https://doi.org/10.1007/978-1-4842-6455-3_4>\n\
    \n## 科学 Python 生态系统\n\n科学 Python 生态系统（SciPy）是一个用于数学、科学和工程的 Python 库集合。SciPy 拥有以下核心组件：\n\
    \n1.  *Python 编程语言：* 我们在第 1 章中探讨了 Python 3 编程语言的安装和一些基础知识。\n2.  *NumPy：* 这是数值\
    \ Python 库，是 Python 中进行数值计算的基础包。它定义了一种 *N* 维数据类型，可用于对多维数据进行数值计算。\n3.  *SciPy 库：*\
    \ 它包含许多用于数学和科学计算的例程，可用于科学应用。\n4.  *Matplotlib：* 这是一个受 MATLAB 启发的 Python 3 数据可视化库。\n\
    \n该生态系统中还有几个额外的重要成员库。\n\n1.  *Pandas：* 代表 Python 数据分析。它提供了灵活的数据结构，如序列和数据帧。\n2.\
    \  *SymPy：* 代表符号 Python。它用于符号数学和代数。\n3.  *scikit-image：* 该库包含用于图像处理的例程。\n4.  *scikit-learn：*\
    \ 该库包含用于机器学习的例程。\n\n通常与 SciPy 一起使用的交互环境是 IPython 或 Jupyter Notebook。我们在第 2 章中详细了解了\
    \ Jupyter Notebook，并在第 3 章中也使用了它。在本书的其余部分我们将继续使用它。\n\n下一节将更详细地介绍 NumPy 库。\n\n\
    ## NumPy 与 Ndarrays\n\n如前所述，NumPy 是 Python 中进行数值计算的基础包。NumPy 库最有用的特性是称为 ndarray\
    \ 的多维容器数据结构。\n\nndarray 是一个多维数组（也称为容器），其中包含具有相同数据类型和大小的元素。我们可以在创建 ndarray 时定义元素的大小和数据类型。就像列表等其他数据结构一样，我们可以通过索引访问\
    \ ndarray 的内容。ndarray 中的索引范围从 0 开始（类似于 C 语言中的数组或 Python 中的列表）。我们可以将 ndarray 用于各种计算。\n\
    \nSciPy 中的所有其他库以及其他库也能识别并使用 NumPy ndarray 及相关例程来表示其自身的数据结构并对其进行操作。\n\n让我们从一个动手示例开始。为此章创建一个新的\
    \ Jupyter 笔记本，然后运行以下命令安装 NumPy 库：\n\n`!pip3 install numpy`\n\n通过运行以下命令将其导入当前笔记本：\n\
    \n```python\nimport numpy as np\n```\n\n你可以创建一个列表，然后像这样用它来创建一个简单的 ndarray：\n\n\
    ```python\nl1 = [1, 2, 3]\nx = np.array(l1, dtype=np.int16)\n```\n\n这里我们从一个列表创建一个\
    \ ndarray。成员的数据类型是 16 位整数。你可以在 <https://numpy.org/devdocs/user/basics.types.html>\
    \ 找到所支持数据类型的详细列表。\n\n我们可以将前面的代码写成单行，如下所示：\n\n```python\nx = np.array(l1, dtype=np.int16)\n\
    ```\n\n让我们打印 ndarray 的值及其类型（我们知道，类型是 ndarray）。\n\n```python\nprint(x)\nprint(type(x))\n\
    ```\n\n输出如下：\n\n```\n[1 2 3]\n<class 'numpy.ndarray'>\n```\n\n正如我们在输出中观察到的，它属于类\
    \ `numpy.ndarray`。正如我们之前所学，索引从 0 开始。让我们通过如下方式访问 ndarray 的元素来演示这一点：\n\n```python\n\
    print(x[0]); print(x[1]); print(x[2])\n```\n\n输出如下：\n\n```\n1\n2\n3\n```\n\n我们甚至可以使用负索引：-1\
