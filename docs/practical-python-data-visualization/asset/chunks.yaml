- fmt: "# Introduction to Pandas\n\nPandas is the data analytics component and an\
    \ integral part of the SciPy ecosystem. It includes very versatile data structures\
    \ and routines to manage them. It also has the capability to visualize the data\
    \ in a scientific data format.\n\n© Ashwin Pajankar 2021\n\nA. Pajankar, *Practical\
    \ Python Data Visualization*,\n[https://doi.org/10.1007/978-1-4842-6455-3_8](https://doi.org/10.1007/978-1-4842-6455-3_8#DOI)\n\
    \n# Chapter 8 Getting Started with Pandas\n\nThe first step is to install it on\
    \ the computer by running the following command in Jupyter Notebook:\n\n```\n\
    !pip3 install pandas\n```\n\nYou can import it to the current session by running\
    \ the following command:\n\n```\nimport pandas as pd\n```\n\nYou can read more\
    \ about pandas at [https://pandas.pydata.org/](https://pandas.pydata.org/).\n\n\
    ## Series in Pandas\n\nA series is a one-dimensional array with labels. It can\
    \ hold data of any type. The labels are collectively known as the index.\n\nWe\
    \ can create a series as follows:\n\n```\ns1 = pd.Series([1, 2, 3, 5, -3])\n```\n\
    \nTo determine its datatypes, use the following command:\n\n```\ntype(s1)\n```\n\
    \nYou can see the values and index associated with them using the following statement:\n\
    \n```\nprint(s1)\n```\n\nYou can explicitly mention the datatype as follows:\n\
    \n```\ns2 = pd.Series([1, 2, 3, 5, -3], dtype=np.int32)\nprint(s2)\n```\n\nTo\
    \ pass a list as an argument to the constructor function to create a series, use\
    \ this code:\n\n```\nx = [1, 2, 3, 5, -3]\ns3 = pd.Series(x)\n```\n\nWe can even\
    \ pass a NumPy `ndarray` as an argument to the constructor function to create\
    \ a series as follows:\n\n```\nimport numpy as np\ny = np.array(x)\ns4 = pd.Series(y)\n\
    ```\n\nTo display the values, use this code:\n\n```\nprint(s4.values)\n```\n\n\
    This provides the following output:\n\n```\n[ 1 2 3 5 -3]\n```\n\nYou can retrieve\
    \ the index as follows:\n\n```\nprint(s4.index)\n```\n\nThis results in the following\
    \ output:\n\n```\nRangeIndex(start=0, stop=5, step=1)\n```\n\nTo assign a custom\
    \ index, use the following code:\n\n```\ns5 = pd.Series(x, index=['a', 'b', 'c',\
    \ 'd', 'e'])\nprint(s5)\n```\n\nThis provides the following output:\n\n```\na\
    \    1\nb    2\nc    3\nd    5\ne   -3\ndtype: int64\n```\n\n## Basic Operations\
    \ on Series\n\nWe can perform a few basic operations on series. For example, we\
    \ can display the negative numbers as follows:\n\n```\nprint(s5[s5 < 0])\n```\n\
    \nThis results in the following output:\n\n```\ne   -3\ndtype: int64\n```\n\n\
    We can also retrieve the positive numbers as follows:\n\n```\nprint(s5[s5 > 0])\n\
    ```\n\nThe output is shown here:\n\n```\na    1\nb    2\nc    3\nd    5\ndtype:\
    \ int64\n```\n\nThese are examples of comparison operations. To perform a multiplication\
    \ operation, use this syntax:\n\n```\nc = 3\nprint(s5 * c)\n```\n\nThe output\
    \ is as follows:\n\n```\na     3\nb     6\nc     9\nd    15\ne    -9\ndtype: int64\n\
    ```\n\n## Dataframes in Pandas\n\nA dataframe is a two-dimensional labeled data\
    \ structure with columns that can be of different datatypes. We can create dataframes\
    \ from series, `ndarrays`, lists, and dictionaries. Dataframes have labels, and\
    \ they are collectively referred to as an index. We can easily view and manipulate\
    \ data in the dataframes. The data is stored in a rectangular grid format in dataframes.\n\
    \nWe can create a dataframe from a list of dictionary data as follows:\n\n```\n\
    data = {'city': ['Mumbai', 'Mumbai', 'Mumbai',\n                 'Hyderabad',\
    \ 'Hyderabad', 'Hyderabad'],\n        'year': [2010, 2011, 2012, 2010, 2011, 2012],\n\
    \        'population': [10.0, 10.1, 10.2, 5.2, 5.3, 5.5]}\n```\n\nTo create a\
    \ dataframe from this, use the following code:\n\n```\ndf1 = pd.DataFrame(data)\n\
    print(df1)\n```\n\nThe output is as follows:\n\n```\n        city  year  population\n\
    0     Mumbai  2010        10.0\n1     Mumbai  2011        10.1\n2     Mumbai \
    \ 2012        10.2\n3  Hyderabad  2010         5.2\n4  Hyderabad  2011       \
    \  5.3\n5  Hyderabad  2012         5.5\n```\n\nUse the following line of code\
    \ to display the top five records:\n\n```\ndf1.head()\n```\n\nThe output is as\
    \ follows:\n\n```\n        city  year  population\n0     Mumbai  2010        10.0\n\
    1     Mumbai  2011        10.1\n2     Mumbai  2012        10.2\n3  Hyderabad \
    \ 2010         5.2\n4  Hyderabad  2011         5.3\n```\n\nYou can also pass other\
    \ numbers as arguments to the function `head()`, and it will show that number\
    \ of the top records from the dataframe.\n\nSimilarly, you can use `df1.tail()`\
    \ to show the last records. It has 5 as the default argument, but you can customize\
    \ the argument passed to it."
