    ## CHAPTER 7


    ## Visualizing Graphs and Networks


    In Chapter [6](index_split_000.html#p91), we demonstrated the visualization of
    images and 3D objects with Python 3 and Matplotlib. We also learned a bit of image
    processing.


    This chapter focuses on the visualization of the data structure known as a graph
    or a network. Let’s continue our data visualization journey with the following
    topics:


    - Graphs and networks

    - Visualizing graphs in Python 3

    - More types of graphs

    - Assigning custom labels to nodes


    After completing this chapter, you will be able to visualize graphs and networks
    with Python 3.


    ### Graphs and Networks


    A graph is an abstract datatype. It is also known as a network. It consists of
    a finite set of vertices (also known as nodes) and a finite set of edges (also
    known as links). The terms vertices and edges are used when we refer to a graph.
    Nodes and links are the terms used when we refer to the same structure as a network.
    Throughout the chapter, I use the terms graphs, nodes, and edges to refer this
    data structure for consistency.


    In a graph, vertices are connected to each other by edges. Trees are a subtype
    of graphs. In graphs we can have cycles, but in trees we cannot.


    We can also have directed graphs and undirected graphs. Edges can be assigned
    values in the graphs, and such graphs are known as weighted graphs. In this chapter,
    we discuss visualization of undirected and unweighted graphs.


    ### Graphs in Python 3


    To work with and visualize graphs, there is an easy-to-use library for Python
    3, known as `networkx`. You can install it by running the following command in
    a Jupyter Notebook cell:


    ```

    !pip3 install network

    ```


    Now, import it and the other library, Matplotlib. We also will enable plotting
    in the notebook:


    ```

    %matplotlib inline

    import networkx as nx

    import matplotlib.pyplot as plt

    ```


    You can create a new empty graph as follows:


    ```

    G = nx.Graph()

    ```


    Let us determine its type as follows:


    ```

    type(G)

    ```


    Here is the output:


    ```

    networkx.classes.graph.Graph

    ```


    You can see the list of nodes and edges, and you can also see their datatype as
    follows:


    ```

    print(G.nodes())

    print(G.edges())

    print(type(G.nodes()))

    print(type(G.edges()))

    ```


    This produces the following output:


    ```

    []

    []

    <class ''networkx.classes.reportviews.NodeView''>

    <class ''networkx.classes.reportviews.EdgeView''>

    ```


    You can add a node as follows:


    ```

    G.add_node(''a'')

    ```


    Alternatively, you can also add multiple nodes specified in a list:


    ```

    G.add_nodes_from([''b'', ''c''])

    ```


    We will again print the list of nodes and the list of edges (which should be empty,
    as we have not added any edges yet):


    ```

    print(''Nodes of the graph G: '')

    print(G.nodes())

    print(''Edges of the graph G: '')

    print(G.edges())

    ```


    The output looks like this:


    ```

    Nodes of the graph G:

    [''a'', ''b'', ''c'']

    Edges of the graph G:

    []

    ```


    Look at the following statement:


    ```

    G.add_edge(1, 2)

    ```


    It adds two nodes and a corresponding edge. If the argument in the function call
    is already part of the list of nodes of the graph, then it is not added twice.
    The following is another way to add it:


    ```

    edge = (''d'', ''e'')

    G.add_edge(*edge)

    edge = (''a'', ''b'')

    G.add_edge(*edge)

    ```


    Let’s again print the list of nodes and edges as follows:


    ```

    print(''Nodes of the graph G: '')

    print(G.nodes())

    print(''Edges of the graph G: '')

    print(G.edges())

    ```'
