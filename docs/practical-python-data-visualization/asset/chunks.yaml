- fmt: '# Chapter 2: Exploring Jupyter Notebook


    It launches a web page in the default browser in the OS. If the browser window
    is already open, it launches the page on a new tab of the same browser window.
    Another way to open the page (in case you accidentally close this browser window)
    is to visit `http://localhost:8888/` in your browser, which displays a page similar
    to the one shown in Figure 2-2.


    **Figure 2-2. Logging in with a token**


    The token can be found in the server logs. The following is a sample server log
    with tokens.


    To access the notebook, open this file in a browser:


    `file:///C:/Users/Ashwin/AppData/Roaming/jupyter/runtime/nbserver-8420-open.html`


    Or copy and paste one of these URLs:


    `http://localhost:8888/?token=e4a4fab0d8c22cd01b6530d5daced19d32d7e0c3a56f925c`


    or `http://127.0.0.1:8888/?token=e4a4fab0d8c22cd01b6530d5daced19d32d7e0c3a56f925c`


    In this log, we can see a couple of URLs. They refer to the same page (`localhost`
    and `127.0.0.1` are the same hosts). We can either copy and paste any of these
    URLs directly in the address bar of the browser tab and open the Jupyter Notebook
    home page or we can visit `http://localhost:8888/` as previously mentioned and
    then paste the token in the server log (in our case it is `e4a4fab0d8c22cd01b6530d5daced19d32d7e0c3a56f925c`)
    and log in, which will take us to the same home page.


    Note that every instance of the Jupyter Notebook server will have its own token
    and the token here will not work with your Jupyter Notebook. The token is only
    valid for that server process.


    After you follow any one of the routes just explained, you will see a home page
    tab in the browser window that looks like Figure 2-3.


    **Figure 2-3. A new home page tab of Jupyter Notebook**


    You can see that there are three tabs on the web page itself: Files, Running,
    and Clusters. The Files tab shows the directories and files in the directory from
    where we launched the notebook server at the command prompt. In this example,
    I have executed the command `jupyter notebook` from `lxterminal` of my Raspberry
    Pi. The present working directory is the home directory of the pi user (`/home/pi`).
    That is why we can see all the files and directories in the home directory of
    my RPi computer in the screenshot in Figure 2-3.


    In the top right corner, there are Quit and Logout buttons. If you click the Logout
    button, it logs out from the current session. To log in again, you will again
    need the token or URL with the embedded token from the notebook server log as
    discussed earlier. If you click Quit, that stops the notebook server process running
    at the command prompt and displays the modal message box shown in Figure 2-4.


    **Figure 2-4. The message shown after clicking Quit**


    To work with it again, we need to execute the command `jupyter notebook` again
    at the command prompt.


    On the top right, just below the Quit and Logout buttons, there is a small refresh
    button. Clicking that refreshes the home page. Next to that is the New button.
    Once it is clicked, it displays a drop-down menu, as shown in Figure 2-5.


    **Figure 2-5. Options for a new notebook**


    As you can see, the drop-down menu is divided into two sections, Notebook and
    Other. In this example, you can choose to create Octave and Python 3 notebooks.
    If your computer has more programming languages installed that are supported by
    Jupyter Notebook, those additional languages will be displayed here as well. We
    can also create text files and folders. We can open a command prompt in the web
    browser by clicking Terminal. Figure 2-6 is a screenshot of `lxterminal` running
    in a separate web browser tab.


    **Figure 2-6. A new lxterminal window within the browser**


    Selecting Python 3 from the drop-down menu creates a new Python 3 notebook as
    shown in Figure 2-7.


    **Figure 2-7. A new Python 3 notebook**


    If you return to the home page by clicking the home page tab in the browser and
    then click the Running tab, you can see the entries corresponding to the terminal
    and the Python 3 notebook as shown in Figure 2-8.


    **Figure 2-8. Summary of current Jupyter Notebook subprocesses**


    ## Running Code in Jupyter Notebook


    Go to the Python 3 Untitled1 tab again and type the following statement in the
    text area (also known as a cell):


    ```

    printf("Hello, World!\n");

    ```


    Click Run. Jupyter will execute that as a Python 3 statement and show the result
    immediately below the cell as shown in Figure 2-9.


    **Figure 2-9. Code output in Jupyter Notebook**


    As you can see, after execution, it automatically creates a new cell below the
    result and places the cursor there. Let’s discuss the menu bar and the icons above
    the programming cells. We can save the file by clicking the floppy disk icon.
    We can add a new empty cell after the current cell by clicking the `+` icon. The
    next three icons are for cut, copy, and paste. Up and down arrows can shift the
    position of the current cell up and down, respectively. The next option is to
    run the cell, which we already saw. The next three icons are used to interrupt
    the kernel, restart the kernel, and restart the kernel and rerun all the cells
    in the notebook. Next to that, we have a drop-down menu that allows us to select
    what type of cell it should be. Figure 2-10 is a screenshot of the drop-down menu
    when clicked.


    **Figure 2-10. Types of cells in Jupyter Notebook**


    The cell is treated as a Python 3 code cell when you select the Code option. It
    is treated as a Markdown cell when you choose the Markdown option. Markdown is
    a markup language that can create rich text output.


    For example, anything followed by `#` creates a heading, anything followed by
    `##` creates a subheading, and so on. Just type the following lines in a Markdown
    cell and execute it:


    ```

    # Heading 1

    ## Heading 2

    ```


    During our Python 3 demonstrations, we use the Markdown cells primarily for headings.
    However, you can further explore Markdown on your own. You can find more information
    about it at [https://jupyter-notebook.readthedocs.io/en/stable/examples/Notebook/Working%20With%20Markdown%20Cells.html](https://jupyter-notebook.readthedocs.io/en/stable/examples/Notebook/Working%20With%20Markdown%20Cells.html).
    The output of the preceding demonstration is shown in Figure 2-11.


    **Figure 2-11. Headings in Markdown**


    You can even change the name of the notebook file by clicking its name in the
    top part of the notebook. Once you click, it displays a modal box for renaming
    as shown in Figure 2-12.


    **Figure 2-12. Rename a notebook in Jupyter**


    Rename it if you wish to do so. If we browse the location on disk from where we
    launched Jupyter Notebook at the command prompt, we will find the file with an
    `ipynb` extension, which stands for IPython Notebook.


    In the same way, we can use Jupyter Notebook for interactive programming with
    the other programming languages that support Jupyter.'
