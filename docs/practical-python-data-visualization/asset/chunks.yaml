  trans: '

    # 第 3 章 使用 leather 进行数据可视化


    [org/project/leather/](https://pypi.org/project/leather/)。`PyPI`是一个第三方软件包仓库，可以使用`pip3`工具进行下载。我们也可以在
    PyPI 上搜索某个包是否可用。在笔记本中运行以下命令：


    ```

    !pip3 search leather

    ```


    输出结果如图 3-2 所示。


    ***图 3-2.** 使用 pip3 搜索软件包*


    在继续之前，我们需要事先了解一些关于 Python 编程语言的知识。在 Python 中，缩进用于表示代码块。在 C、C++和 Java 等几种流行的编程语言中，多行代码块用花括号`{}`括起来。Python
    则强制程序员缩进代码块，没有其他表示方法。以下面的代码为例。


    ```

    a = 3


    if a%2 == 0:


    print(''Even'')


    else:


    print(''Odd'')

    ```


    在笔记本中运行该代码并查看结果。还有一件有趣的事情可以尝试。我们已经了解了《Python 之禅》（PEP 20）。Python 的创建者将其作为彩蛋添加在解释器中，你可以通过以下语句调用它：


    ```

    import this

    ```


    如果在笔记本中运行这行语句，它会在输出中打印《Python 之禅》的所有箴言。


    请注意，我们使用 Jupyter Notebook 演示的所有程序，稍加修改后也可以在 IDLE 中运行。我们之所以使用 Jupyter Notebook，是因为它具有即时反馈和交互式功能。现在，让我们使用`import`语句将
    leather 库添加到笔记本中。


    每个会话只需导入一次，它在整个会话期间都可使用。使用以下语句：


    ```

    import leather

    ```


    运行后，它会将该库导入到当前的笔记本会话中。最好为每个新主题添加一个标题，但这由你自己决定。你会发现，我在本书配套代码的笔记本中经常使用标题，以便为演示的内容提供上下文和参考。这是一个好习惯，你可能也想效仿。


    让我们编写简单的代码来可视化一些数据点。我们可以在 X-Y 坐标系中定义这些点。我们可以使用元组列表来定义点，如下所示：


    ```

    data1 = [(1.5, 2), (2, 3), (4.5, 6), (7.5, 4)]

    ```


    我们也可以将它们定义为列表的列表：


    ```

    data1 = [[1.5, 2], [2, 3], [4.5, 6], [7.5, 4]]

    ```


    我们还可以将它们定义为元组的元组：


    ```

    data1 = ((1.5, 2), (2, 3), (4.5, 6), (7.5, 4))

    ```


    ![](img/index-46_1.jpg)


    我们也可以将它们定义为列表的元组：


    ```

    data1 = ([1.5, 2], [2, 3], [4.5, 6], [7.5, 4])

    ```


    正如你所看到的，leather 库在数据定义方式上并不苛刻，非常灵活。


    让我们按如下方式定义一个图表对象：


    ```

    chart = leather.Chart(''简单的 x-y 坐标对'')

    ```


    接下来，创建一个散点图：


    ```

    chart.add_dots(data1)

    ```


    然后，按如下方式可视化图表：


    ```

    chart.to_svg()

    ```


    它会在同一个笔记本中显示输出结果，如图 3-3 所示。


    ***图 3-3.** 绘制数据点*


    ![](img/index-47_1.jpg)


    我们可以使用以下语句将图像保存到磁盘：


    ```

    chart.to_svg(''image1.svg'')

    ```


    然后，我们可以如下方式自定义散点：


    ```

    chart = leather.Chart(''自定义散点'')

    chart.add_dots(data1, fill_color=''#00ff00'', radius=10)

    chart.to_svg()

    ```


    让我们定义更多的数据点：


    ```

    data2 = [(2, 3), (4, 5), (5, 6), (7, 5)]

    ```


    我们还可以按如下方式可视化多个序列：


    ```

    chart = leather.Chart(''可视化多个序列'')

    chart.add_dots(data1)

    chart.add_dots(data2)

    chart.to_svg()

    ```


    输出结果如图 3-4 所示。


    ***图 3-4.** 绘制多个序列*


    ![](img/index-48_1.jpg)


    如图 3-4 所示，leather 会根据数据点所属的序列自动为它们分配不同的颜色。


    ## 更多可视化类型

