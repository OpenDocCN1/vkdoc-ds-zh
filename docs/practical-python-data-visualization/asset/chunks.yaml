    `chart.to_svg()`\n\n![](index-51_1.jpg)\n\nChapter 3 Data Visualization with leather\n\
    \nFigure [3-8](#index_split_000.html#p51) displays the output.\n\n***Figure 3-8.**\
    \ Visualizing multiple types*\n\nWe can visualize with bars as follows:\n\n```\n\
    data = [[1, 'A'], [2, 'B'], [3, 'C'], [4, 'D']]\nchart = leather.Chart('Visualizing\
    \ Bars')\nchart.add_bars(data)\nchart.to_svg()\n```\n\nIn our data set, one of\
    \ the dimensions is the text data. The visualization is shown in Figure [3-9](#index_split_000.html#p52).\n\
    \n![](index-52_1.png)\n![](index-52_2.jpg)\n\nChapter 3 Data Visualization with\
    \ leather\n\n***Figure 3-9.** Visualizing bar charts*\n\nWe can customize it as\
    \ follows:\n\n`chart = leather.Chart('Customizing Bars')`\n\n`chart.add_bars(data,\
    \ fill_color='#777777')`\n\n`chart.to_svg()`\n\nThe output is displayed in Figure\
    \ [3-10.](#index_split_000.html#p52)\n\n***Figure 3-10.** Customizing bar charts*\n\
    \n![](index-53_1.png)\n\nChapter 3 Data Visualization with leather\n\nWe can visualize\
    \ with horizontal columns as follows:\n\n```\ndata = [('A', 1), ('B', 2), ('C',\
    \ 3), ('D', 4)]\nchart = leather.Chart('Visualizing Columns')\nchart.add_columns(data)\n\
    chart.to_svg()\n```\n\nThe output is shown in Figure [3-11.](#index_split_000.html#p53)\n\
    \n***Figure 3-11.** Vertical columns*\n\nWe can customize the columns as follows:\n\
    \n`chart = leather.Chart('Customizing Columns')`\n\n`chart.add_columns(data, fill_color='#77ff77')`\n\
    \n`chart.to_svg()`\n\n![](index-54_1.jpg)\n\nChapter 3 Data Visualization with\
    \ leather\n\nThe output is displayed in Figure [3-12.](#index_split_000.html#p54)\n\
    \n***Figure 3-12.** Customizing vertical columns*\n\n## Scales\n\nThere are various\
    \ types of scales that the `leather` library can create automatically and programmatically.\
    \ An ordinal scale is automatically created for the text data. The example is\
    \ the same as we saw earlier: `chart = leather.Chart('The Ordinal Scale')`\n\n\
    `chart.add_columns(data)`\n\n`chart.to_svg()`\n\nLinear scales are created automatically\
    \ when the data is numeric. We can set the limit of scales as follows:\n\n```\n\
    chart = leather.Chart('Linear Scale')\nchart.add_x_scale(1, 8)\nchart.add_y_scale(1,\
    \ 7)\nchart.add_line(data1)\nchart.to_svg()\n```\n\n![](index-55_1.jpg)\n\nChapter\
    \ 3 Data Visualization with leather\n\nFigure [3-13](#index_split_000.html#p55)\
    \ displays the output.\n\n***Figure 3-13.** Linear scale with custom limits*\n\
    \nA temporal scale is automatically created for temporal (time-related) data:\n\
    \n```\nfrom datetime import date\n\ndata = [\n    (date(2020, 1, 1), 4),\n   \
    \ (date(2020, 3, 1), 6),\n    (date(2020, 6, 1), 2),\n    (date(2020, 9, 1), 1)\n\
    ]\n\nchart = leather.Chart('Temporal Scale')\nchart.add_x_scale(date(2019, 9,\
    \ 1), date(2020, 12, 1))\nchart.add_line(data)\nchart.to_svg()\n```\n\n![](index-56_1.jpg)\n\
    \nChapter 3 Data Visualization with leather\n\nThe output is shown in Figure [3-14.](#index_split_000.html#p56)\n\
    \n***Figure 3-14.** Temporal scale with custom limits*\n\n## Styling\n\nLeather\
    \ provides a lot of styling options. We can set the tick values on the axes as\
    \ per our requirements as follows:\n\n```\nchart = leather.Chart('Ticks Demo')\n\
    chart.add_x_scale(1, 8)\nchart.add_x_axis(ticks=[1, 2, 3, 4, 5, 6, 7, 8])\nchart.add_y_scale(1,\
    \ 7)\n```"
