    vii


    **About the Author**


    **Ashwin Pajankar** holds a Master of Technology from IIIT Hyderabad, and he has
    more than 25 years of programming experience. He started his journey in programming
    and electronics at the tender age of seven with the BASIC programming language
    and is now proficient in Assembly programming, C, C++, Java, Shell scripting,
    and Python. His other technical experience includes single-board computers such
    as Raspberry Pi and Banana Pro, and Arduino. He is currently a freelance online
    instructor teaching programming bootcamps to more than 60,000


    students from tech companies and colleges. His YouTube channel has an audience
    of 10,000 subscribers and he has published more than 15 books on programming and
    electronics with many additional international publications.


    ix


    ![](index-9_1.jpg)


    ![](index-9_2.jpg)


    **About the Technical Reviewers**


    **Lentin Joseph** is an author, roboticist, and


    robotics entrepreneur from India. He runs


    robotics software company Qbotics Labs


    in Kochi and Kerala. He has ten years of


    experience in the robotics domain, primarily


    in Robot Operating System (ROS), OpenCV,


    and PCL. He has authored eight books on ROS,


    including *Learning Robotics Using Python,*


    *Mastering ROS for Robotics Programming*, *ROS*


    *Robotics Projects,* and *Robot Operating System for Absolute Beginners. H* e
    has pursued his master’s degress in robotics and automation in India and also
    worked at the Robotics Institute at Carnegie Mellon University. He has also been
    a TEDx speaker.


    **Aarthi Elumalai** is a programmer, educator,


    entrepreneur, and innovator. She has a


    Bachelor of Engineering degree in computer


    science from Anna University, Chennai,


    India. She has launched a dozen web apps,


    plug-ins, and software applications that are


    being used by thousands of customers online.


    She has more than 15 years of experience in


    programming. She is the founder of DigiFisk,


    an e-learning platform that has more than 70,000 students worldwide.


    xi


    abouT The TeChniCal RevieweRs


    Her courses are well-received by the masses, and her unique, project-based approach
    is a refreshing change for many. She teaches the complex world of programming
    by using practical exercises and puzzles along the way. Her courses and books
    always come with hands-on training in creating real- world projects so her students
    are better equipped for the real world.


    xii


    **Acknowledgments**


    I want to express my gratitude to all of the technical reviewers for helping me
    to make this book better. I would also like to express my gratitude to the team
    from Apress. Aditee Mirashi helped us to coordinate the entire book process. I
    am also grateful to Celestin Suresh for giving me the opportunity to write this
    book.


    xiii


    **Introduction**


    I have been working with the Python programming language for more than 15 years
    now. I have used it for a variety of tasks like automation, graphics, Internet
    of Things (IoT), and data science. I have found that it is a very good tool for
    generating scientific and data-driven business visualizations.


    It takes fewer lines of code to generate visualizations with Python. Python is
    capable of fetching data from various type of sources. Combining this feature
    with various third-party visualization libraries makes Python the perfect tool
    for various types of visualization requirements.


    This book covers the basics of Python, including setup and various modes, and
    many visualization libraries. I have also made a modest attempt to visualize real-life
    data related to the ongoing COVID-19


    pandemic.


    I encourage readers to read all of the material and not to skip anything, even
    if you are familiar with the particular topic. I have written this book in such
    a way that every topic and demonstration builds confidence in the reader for the
    next topic. This truly is a step-by-step guide for beginners and experts alike.


    After reading this book, you will be empowered by the knowledge of data visualization
    with Python and will be able to apply this knowledge in real-life projects at
    your workplace. It will also instill confidence in you to explore more libraries
    for data visualization in Python, as most of the support the scientific Python
    ecosystem and NumPy library discussed in detail in this book.


    I hope that readers of this book will enjoy reading it and following the demonstrations
    as much as I enjoyed writing it.


    xv


    **CHAPTER 1**


    **Introduction to**


    **Python**


    I welcome you all to the exciting journey of learning data visualization with
    Python 3\. This chapter provides details to get you started with the Python programming
    language, including its history, features, and applications.


    This chapter is focused on general information about Python 3 and its installation
    on various popular operating system (OS) platforms, such as Microsoft Windows,
    Ubuntu, and Raspberry Pi Raspbian. We will be writing a few basic Python programs
    and learn how to execute them on various platforms. Here is the list of topics
    that we will cover in this chapter.


    • Python programming language


    • Installing Python on various platforms


    • Python modes


    After completing this chapter, you should be comfortable with installation and
    usage of Python 3 programming language in various modes.


    **Python Programming Language**


    Python 3 is a high-level, interpreted, general-purpose programming language. This
    section provides a general discussion about the Python programming language and
    its philosophy.


    © Ashwin Pajankar 2021


    A. Pajankar, *Practical Python Data Visualization*,


    [https://doi.org/10.1007/978-1-4842-6455-3_1](https://doi.org/10.1007/978-1-4842-6455-3_1#DOI)


    Chapter 1 IntroduCtIon to python


    **History of Python**


    Python is a successor to the **ABC** programming language, which itself was inspired
    by the **ALGOL 68** and **SETL** programming languages. It was created by **Guido
    Van Rossum** as a personal side project during vacations in the late 1980s while
    he was working at CWI Centrum Wiskunde & Informatica in the Netherlands. From
    the initial release of Python through July 2018, Van Rossum was the lead developer
    and Benevolent Dictator for Life for this project. Since then, he has gone into
    a state of permanent vacation and now works on a steering committee for Python.
    The following timeline details the important milestones in Python’s release.


    • February 1991: Van Rossum published the code


    (labeled version 0.9.0) to alt.sources.


    • January 1994: Version 1.0 was released.


    • October 2000: Python 2.0 was released.


    • December 2006: Python 3.0 was released.


    • December 2019: Python 2.x was officially retired


    and is no longer supported by the Python Software


    Foundation.'
