    # Python 2.x 版本已退役，不再受支持。此外，`Python 3` 与 `Python 2` 不向后兼容。`Python 3` 是语言的最新且当前受支持的版本。因此，我们在本书中全程使用
    `Python 3` 来演示数据可视化的程序。


    除非特别说明，本书中提到的 `Python` 均指代 `Python 3`。


    ## 第 1 章 Python 入门


    ### Python 增强提案


    为了引导 `Python` 的开发、维护和支持，`Python` 领导团队提出了 `Python` 增强提案（`PEP`）的概念。这是为 `Python`
    项目建议新特性和修复问题的主要机制。您可以在以下 `URL` 中阅读更多关于 `PEP` 的信息：


    - [`www.python.org/dev/peps/`](https://www.python.org/dev/peps/)

    - [`www.python.org/dev/peps/pep-0001/`](https://www.python.org/dev/peps/pep-0001/)


    ### Python 的哲学


    `Python` 的哲学在 `PEP20` 中进行了详细阐述，被称为“Python 之禅”，可在 [`www.python.org/dev/peps/pep-0020/`](https://www.python.org/dev/peps/pep-0020/)
    获取。以下是该 `PEP` 中的一些要点：


    1.  优美胜于丑陋。

    2.  显式胜于隐式。

    3.  简单胜于复杂。

    4.  复杂胜于凌乱。

    5.  扁平胜于嵌套。

    6.  稀疏胜于密集。

    7.  可读性至关重要。

    8.  特殊情况不应特殊到足以违反规则。

    9.  尽管实用性胜过纯粹性。

    10. 错误不应默默无声地传递。

    11. 除非明确需要静默。

    12. 面对歧义，拒绝猜测的诱惑。

    13. 应该有一种——并且最好只有一种——显而易见的方式来做这件事。

    14. 尽管那种方式一开始可能并不明显，除非你是荷兰人。

    15. 现在做总比永远不做好。

    16. 虽然“永远不做”通常比“*现在*就做”要好。

    17. 如果实现难以解释，那可能是个坏主意。

    18. 如果实现易于解释，那可能是个好主意。

    19. 命名空间是个绝妙的主意——让我们更多地使用它们！


    这些是影响 `Python` 编程语言发展并持续发挥作用的一般性哲学指南。


    ### Python 的应用


    由于 `Python` 是一种通用编程语言，它在以下领域有众多应用：


    1.  网页开发。

    2.  图形用户界面（`GUI`）开发。

    3.  科学与数值计算。

    4.  软件开发。

    5.  系统管理。


    有关 `Python` 在各种项目中的案例研究，可在 [`www.python.org/success-stories/`](https://www.python.org/success-stories/)
    获取。


