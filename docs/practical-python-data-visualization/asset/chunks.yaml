- fmt: '# Python 2.x 版本已退役，不再受支持。此外，`Python 3` 与 `Python 2` 不向后兼容。`Python 3` 是语言的最新且当前受支持的版本。因此，我们在本书中全程使用
    `Python 3` 来演示数据可视化的程序。


    除非特别说明，本书中提到的 `Python` 均指代 `Python 3`。


    ## 第 1 章 Python 入门


    ### Python 增强提案


    为了引导 `Python` 的开发、维护和支持，`Python` 领导团队提出了 `Python` 增强提案（`PEP`）的概念。这是为 `Python`
    项目建议新特性和修复问题的主要机制。您可以在以下 `URL` 中阅读更多关于 `PEP` 的信息：


    - [https://www.python.org/dev/peps/](https://www.python.org/dev/peps/)

    - [https://www.python.org/dev/peps/pep-0001/](https://www.python.org/dev/peps/pep-0001/)


    ### Python 的哲学


    `Python` 的哲学在 `PEP20` 中进行了详细阐述，被称为“Python 之禅”，可在 [https://www.python.org/dev/peps/pep-0020/](https://www.python.org/dev/peps/pep-0020/)
    获取。以下是该 `PEP` 中的一些要点：


    1.  优美胜于丑陋。

    2.  显式胜于隐式。

    3.  简单胜于复杂。

    4.  复杂胜于凌乱。

    5.  扁平胜于嵌套。

    6.  稀疏胜于密集。

    7.  可读性至关重要。

    8.  特殊情况不应特殊到足以违反规则。

    9.  尽管实用性胜过纯粹性。

    10. 错误不应默默无声地传递。

    11. 除非明确需要静默。

    12. 面对歧义，拒绝猜测的诱惑。

    13. 应该有一种——并且最好只有一种——显而易见的方式来做这件事。

    14. 尽管那种方式一开始可能并不明显，除非你是荷兰人。

    15. 现在做总比永远不做好。

    16. 虽然“永远不做”通常比“*现在*就做”要好。

    17. 如果实现难以解释，那可能是个坏主意。

    18. 如果实现易于解释，那可能是个好主意。

    19. 命名空间是个绝妙的主意——让我们更多地使用它们！


    这些是影响 `Python` 编程语言发展并持续发挥作用的一般性哲学指南。


    ### Python 的应用


    由于 `Python` 是一种通用编程语言，它在以下领域有众多应用：


    1.  网页开发。

    2.  图形用户界面（`GUI`）开发。

    3.  科学与数值计算。

    4.  软件开发。

    5.  系统管理。


    有关 `Python` 在各种项目中的案例研究，可在 [https://www.python.org/success-stories/](https://www.python.org/success-stories/)
    获取。


    ![] (index-17_1.jpg)


    ## 第 1 章 Python 入门


    ### 在各种平台上安装 Python


    `Python` 实现是一个支持执行用 `Python` 编写的程序的程序或环境。由 Van Rossum 创建的原始实现被称为 `CPython`，并作为参考实现。本书中我们全程使用
    `CPython`。它可以在 `Python` 官方网站上获得，我们将在本节学习如何安装它。


    我倾向于在 `Windows` 电脑或运行 `Raspberry Pi OS` 的 `Raspberry Pi` 电脑上编写 `Python` 程序。让我们学习如何在这两个平台上安装
    `Python`。


    #### 在 Windows 电脑上安装


    访问位于 [https://www.python.org/downloads/](https://www.python.org/downloads/) 的
    `Python 3` 下载页面，下载适用于您电脑的 `Python 3` 安装文件。它会自动检测您电脑上的操作系统并显示合适的可下载文件，如图 [1-1]
    (#index_split_000.html#p17) 所示。


    ***图 1-1.** 带有下载选项的 Python 项目主页* 5


    ![] (index-18_1.jpg)


    ## 第 1 章 Python 入门


    运行安装文件以安装 `Python 3`。在安装过程中，选中与将 `Python 3` 添加到 `PATH` 变量（图 [1-2](#index_split_000.html#p18)）相关的复选框。'
  raw: 'Python 2.x versions are retired and no longer supported. In addition, Python
    3 is not backward compatible with Python 2\. Python 3 is the latest and currently
    supported version the language. We therefore use Python 3 throughout the book
    to demonstrate programs for data visualization.


    Unless explicitly mentioned, Python denotes Python 3 throughout this book.


    Chapter 1 IntroduCtIon to python


    **Python Enhancement Proposals**


    To steer the development, maintenance, and support of Python, the Python leadership
    team came up with the concept of Python Enhancement Proposals (PEPs). These are
    the primary mechanism for suggesting new features and fixing issues in Python
    project. You can read more about the PEPs at the following URLs:


    • [https://www.python.org/dev/peps/](https://www.python.org/dev/peps/)


    • [https://www.python.org/dev/peps/pep-0001/](https://www.python.org/dev/peps/pep-0001/)


    **Philosophy of Python**


    The philosophy of Python is detailed in PEP20, known as **The Zen of** **Python,**
    available a[t https://www.python.org/dev/peps/pep-0020/](https://www.python.org/dev/peps/pep-0020/).
    Here are some of the points from that PEP.


    1\. Beautiful is better than ugly.


    2\. Explicit is better than implicit.


    3\. Simple is better than complex.


    4\. Complex is better than complicated.


    5\. Flat is better than nested.


    6\. Sparse is better than dense.


    7\. Readability counts.


    8\. Special cases aren’t special enough to break the rules.


    9\. Although practicality beats purity.


    10\. Errors should never pass silently.


    11\. Unless explicitly silenced.


    12\. In the face of ambiguity, refuse the temptation to guess.


    Chapter 1 IntroduCtIon to python


    13\. There should be one—and preferably only


    one—obvious way to do it.


    14\. Although that way may not be obvious at first unless


    you’re Dutch.


    15\. Now is better than never.


    16\. Although never is often better than *right* now.


    17\. If the implementation is hard to explain, it’s a bad


    idea.


    18\. If the implementation is easy to explain, it may be a


    good idea.


    19\. Namespaces are one honking great idea—let’s do


    more of those!


    These are among the general philosophical guidelines that influenced the development
    of the Python programming language and continue to do so.


    **Applications of Python**


    Because Python is a general-purpose programming language, it has numerous applications
    in the following areas:


    1\. Web development.


    2\. Graphical user interface (GUI) development.


    3\. Scientific and numerical computing.


    4\. Software development.


    5\. System administration.


    Case studies of Python for various projects are available a[t https://](https://www.python.org/success-stories/)


    [www.python.org/success-stories/.](https://www.python.org/success-stories/)


    ![](index-17_1.jpg)


    Chapter 1 IntroduCtIon to python


    **Installing Python on Various Platforms**


    A Python implementation is a program or an environment that supports the execution
    of programs written in Python. The original implementation created by Van Rossum
    is known as CPython and serves as a reference implementation. Throughout the book,
    we use CPython. It is available on the Python website and we will learn how to
    install it in this section.


    I prefer to write Python programs on a Windows computer or a Raspberry Pi computer
    with Raspberry Pi OS. Let us learn how to install Python on both of these platforms.


    **Installing on a Windows Computer**


    Visit the Python 3 download page located at [https://www.python.org/](https://www.python.org/downloads/)


