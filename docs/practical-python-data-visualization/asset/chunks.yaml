    of the available options.


    ***Figure 2-13.** Clearing the output in Jupyter*


    Chapter 2 exploring Jupyter notebook


    One of the most significant advantages of Jupyter Notebook is that you can edit
    an already executed cell if there is any syntax error or you simply want to change
    the code. Jupyter Notebook is like an IDE that runs within a web browser and produces
    the output in the same window. This interactivity and the ability to keep code,
    rich text, and output in the same file has made Jupyter Notebook hugely popular
    worldwide. The kernel for running Python programs comes from the IPython project.
    As I mentioned earlier, we can use it for other programming languages, too. I
    have used it for running GNU Octave programs as well.


    **Note** you can find more information about Jupyter notebook and ipython at the
    following urls:


    [https://jupyter.org/](https://jupyter.org/)


    [https://ipython.org/](https://ipython.org/)


    **Summary**


    In this chapter, we got started with installation of Jupyter Notebook on various
    platforms. We then explored how we can run simple Python statements in Jupyter
    Notebook. We learned that we can store the code and the output of that code in
    a single file that can be shared easily over the Internet.


    In the next chapter, we will use Jupyter Notebook to work with simple visualizations
    using Python and a popular data visualization library, leather.


    **CHAPTER 3**


    **Data Visualization**


    **with Leather**


    In Chapter [2](#index_split_000.html#p29), we acquainted ourselves with Python
    programming using Jupyter Notebook. You should now be comfortable writing interactive
    Python programs with Jupyter Notebook.


    In this chapter, we will use Jupyter Notebook and Python with a data visualization
    library, leather, to produce basic visualizations. Here is the list of topics
    we will cover in this chapter:


    • Introduction to leather


    • More types of visualizations


    • Scales


    • Styling


    **Running OS Commands in Jupyter Notebook**


    You have seen how to use Jupyter notebook for Python programming. We will now
    explore how to execute an OS command in the notebook. This is useful, as we need
    to use pip to install many utilities and we can run it right from within the notebook.


    © Ashwin Pajankar 2021


    A. Pajankar, *Practical Python Data Visualization*,


    [https://doi.org/10.1007/978-1-4842-6455-3_3](https://doi.org/10.1007/978-1-4842-6455-3_3#DOI)


    ![](index-43_1.png)


    Chapter 3 Data Visualization with leather


    Create a new Jupyter notebook for all the code in this chapter. We will follow
    this process for all of the chapters, so by the end of the book, we will have
    all the programs in notebooks by chapter.


    To execute an OS command in a notebook cell, we have to use the **!**


