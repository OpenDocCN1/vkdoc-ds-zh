  ## Apache Pig 简介


  `Apache Pig` 是一个用于对海量数据执行数据分析的数据流框架。它由 `Yahoo!` 开发，并开源给了 `Apache 软件基金会`。现在它基于 `Apache
  许可证 2.0 版` 提供。`Pig` 编程语言是一种 `Pig Latin` 脚本语言。`Pig` 与 `Hadoop` 是松耦合关系，这意味着我们可以将它连接到
  `Hadoop` 并执行许多分析任务。但 `Pig` 也可以与 `Apache Tez` 和 `Apache Spark` 等其他工具一起使用。


  `Apache Hive` 被用作报表工具，而 `Apache Pig` 则用于数据提取、转换和加载（`ETL`）。我们可以通过用户自定义函数（`UDF`）来扩展
  `Pig` 的功能。用户自定义函数可以用多种语言编写，包括 `Java`、`Python`、`Ruby`、`JavaScript`、`Groovy` 和 `Jython`。


  `Apache Pig` 使用 `HDFS` 来读取和存储数据，并使用 `Hadoop` 的 `MapReduce` 来执行算法。在使用 `Hadoop` 集群方面，`Apache
  Pig` 与 `Apache Hive` 类似。如**图 1-5** 所示，在 `Hadoop` 上，`Pig Latin` 命令首先被转换为 `Hadoop`
  的 `MapReduce` 代码。然后它们被转换为 `MapReduce` 代码，并在 `Hadoop` 集群上运行。


  ![../images/469054_1_En_1_Chapter/469054_1_En_1_Fig5_HTML.png](img/469054_1_En_1_Fig5_HTML.png)


  **图 1-5** — Apache Pig 中的代码执行流程


  `Pig` 最棒的地方在于其代码经过优化和测试，可以处理日常问题。因此，用户可以直接安装 `Pig` 并开始使用它。`Pig` 提供了 `Grunt` shell
  来运行交互式的 `Pig` 命令。所以，任何了解 `Pig Latin` 的人都可以享受 `HDFS` 和 `MapReduce` 带来的好处，而无需了解 `Java`
  或 `Python` 等高级编程语言。


