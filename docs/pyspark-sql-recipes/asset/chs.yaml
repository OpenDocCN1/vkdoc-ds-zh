  pysparksqlbook@localhost binaries]$ sudo  mv  hadoop-2.7.7   /allBigData/hadoop

  ```


  #### 步骤 2-1-7：修改 Hadoop 环境文件


  我们需要对 Hadoop 环境文件做一些修改。Hadoop 环境文件位于 Hadoop 配置目录中。在我们的案例中，Hadoop 配置目录是 `/allBigData/hadoop/etc/hadoop/`。在以下代码行中，我们将
  `JAVA_HOME` 添加到 `hadoop-env.sh` 文件中。


  ```

  [pysparksqlbook@localhost binaries]$ vim /allBigData/hadoop/etc/hadoop/hadoop-env.sh

  ```


  打开 Hadoop 环境文件后，添加以下行。


  ```

  ##### The java implementation to use.

  export JAVA_HOME=/usr/lib/jvm/java-1.8.0-openjdk-1.8.0.181-3.b13.el7_5.x86_64/jre

  ```


  #### 步骤 2-1-8：修改 Hadoop 属性文件


  我们将重点关注三个属性文件：


  *   `hdfs-site.xml`：HDFS 属性

  *   `core-site.xml`：与集群相关的核心属性

  *   `mapred-site.xml`：MapReduce 框架的属性


  这些属性文件位于 Hadoop 配置目录中。在上一章中，我们讨论了 HDFS。我们发现 HDFS 有两个组件——`NameNode` 和 `DataNode`。我们还讨论了
  HDFS 会进行数据复制以实现容错。在我们的 `hdfs-site.xml` 文件中，我们将使用 `dfs.name.dir` 参数设置 `namenode`
  目录，使用 `dfs.data.dir` 参数设置 `datanode` 目录，并使用 `dfs.replication` 参数设置复制因子。


  让我们修改 `hdfs-site.xml`。


  ```

  [pysparksqlbook@localhost binaries]$ vim /allBigData/hadoop/etc/hadoop/hdfs-site.xml

  ```


  打开 `hdfs-site.xml` 后，我们必须在该文件中添加以下行。


  ```

  dfs.name.dir

  file:/allBigData/hdfs/namenode

  NameNode location


  dfs.data.dir

  file:/allBigData/hdfs/datanode

  DataNode location


  dfs.replication

  Number of block replication

  ```


  更新 `hdfs-site.xml` 后，我们将更新 `core-site.xml`。在 `core-site.xml` 中，我们将更新两个属性——`fs.default.name`
  和 `hadoop.tmp.dir`。`fs.default.name` 属性用于确定文件系统的主机、端口等。`hadoop.tmp.dir` 属性确定 Hadoop
  的临时目录。我们必须将以下行添加到 `core-site.xml` 中。


  ```

  fs.default.name

  hdfs://localhost:9745

  Host port of file system


  hadoop.tmp.dir

  /application/hadoop/tmp

  Temp directory for other working and tmp directories

  ```


  最后，我们将修改 `mapred-site.xml`。我们将修改 `mapreduce.framework.name`，它将决定使用哪个运行时框架。可能的值有
  local、classic 或 yarn。我们必须将以下代码添加到 `mapred-site.xml` 文件中。


  ```

  [pysparksqlbook@localhost binaries]$ cp /allBigData/hadoop/etc/hadoop/mapred-site.xml.template
  /allBigData/hadoop/etc/hadoop/mapred-site.xml

  [pysparksqlbook@localhost binaries]$vim /allBigData/hadoop/etc/hadoop/mapred-site.xml

  ```


  以下是 XML 内容：


  ```

  mapreduce.framework.name

  yarn

  ```


  让我们创建临时目录：


  ```

  [pysparksqlbook@localhost binaries]$ sudo mkdir -p  /application/hadoop/tmp

  [pysparksqlbook@localhost binaries]$ sudo chown pysparksqlbook:pysparksqlbook -R
  /application/hadoop

  ```


  #### 步骤 2-1-9：更新 .bashrc 文件


  以下行必须添加到 `.bashrc` 文件中。打开 `.bashrc` 并通过添加以下行来追加内容。


  ```

  [pysparksqlbook@localhost binaries]$ vim  ~/.bashrc

  ```


  在 `.bashrc` 文件中，在末尾添加以下行。


  ```

  export HADOOP_HOME=/allBigData/hadoop

  export PATH=$PATH:$HADOOP_HOME/sbin

  export PATH=$PATH:$HADOOP_HOME/bin

  export JAVA_HOME=/usr/lib/jvm/java-1.8.0-openjdk-1.8.0.181-3.b13.el7_5.x86_64/jre

  export PATH=$PATH:$JAVA_HOME/bin

  ```


  然后，我们必须执行 `.bashrc` 文件。执行该文件后，新的更新值将在控制台中生效。


  ```

  [pysparksqlbook@localhost binaries]$ source ~/.bashrc

  ```


  #### 步骤 2-1-10：运行 Namenode 格式化


  我们已经更新了一些属性文件。我们需要运行 `namenode` 格式化，以便所有更改都能在我们的框架中生效。以下命令将格式化 `namenode`。


