  ## Apache Hive 简介


  计算机科学是一个抽象的世界。众所周知，数据是以比特为形式的信息。像 `C` 这样的编程语言提供了对机器和汇编语言的抽象。其他高级语言则提供了更多的抽象。结构化查询语言（`SQL`）就是这些抽象之一。`SQL`
  被世界上许多数据建模专家所使用。`Hadoop` 擅长处理大数据分析。那么，如何让众多了解 `SQL` 的人能利用 `Hadoop` 对大数据的计算能力呢？为了编写
  `Hadoop` 的 `MapReduce` 程序，用户必须掌握一种可用于编写 `Hadoop` 的 `MapReduce` 程序的语言。


  现实世界中的日常问题遵循着某些模式。有些问题在日常生活中很常见，例如数据操作、处理缺失值、数据转换和数据汇总。对于非程序员来说，为这些日常问题编写 `MapReduce`
  代码是一件非常令人头疼的工作。编写代码来解决问题并非总是明智之举。但编写具有性能可扩展性且易于扩展的高效代码则很有价值。带着这个问题的思考，`Apache Hive`
  在 `Facebook` 被开发出来，这样就不必为通用问题编写 `MapReduce` 代码，从而解决日常问题。


  根据 `Hive` 维基文档的语言描述，“`Hive` 是一个基于 `Apache Hadoop` 的数据仓库基础设施”。`Hive` 有自己的 `SQL` 方言，称为
  `Hive 查询语言`。它被称为 `HiveQL`，有时也称为 `HQL`。`Hive` 使用 `HiveQL` 查询 `HDFS` 中的数据。`Hive` 不仅可以在
  `HDFS` 上运行，还可以在 `Spark` 以及其他大数据框架如 `Apache Tez` 上运行。


  `Hive` 为用户在 `HDFS` 中处理结构化数据提供了类似`关系数据库管理系统`的抽象。您可以创建表并对它们运行类似 `SQL` 的查询。`Hive` 将表模式保存在某个
  `RDBMS` 中。`Apache Derby` 是 `Apache Hive` 发行版自带的默认 `RDBMS`。`Apache Derby` 完全用 `Java`
  编写，是一个基于 `Apache 许可证 2.0 版` 的开源 `RDBMS`。


  `HiveQL` 命令会被转换为 `Hadoop` 的 `MapReduce` 代码，然后在 `Hadoop` 集群上运行。您可以在**图 1-4** 中看到
  `Hive` 命令的执行流程。


  ![../images/469054_1_En_1_Chapter/469054_1_En_1_Fig4_HTML.png](img/469054_1_En_1_Fig4_HTML.png)


  **图 1-4** — Apache Hive 中的代码执行流程


  了解 `SQL` 的人可以轻松学习 `Apache Hive` 和 `HiveQL`，并在其日常大数据数据分析工作中利用 `Hadoop` 的存储和计算能力。`PySpark
  SQL` 也支持 `HiveQL`。您可以在 `PySpark SQL` 中运行 `HiveQL` 命令。除了执行 `HiveQL` 查询之外，您还可以直接从
  `Hive` 读取数据到 `PySpark SQL`，并将结果写回 `Hive`。请参见**图 1-4**。


