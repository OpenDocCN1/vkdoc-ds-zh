- '# 秘诀 5-2. 对多个键进行数据聚合


  ### 问题


  你想要对一个 DataFrame 进行数据聚合，并按多个键进行分组。


  ### 解决方案


  我们将使用前一个秘诀中的录取数据。为了根据多列条件进行数据聚合，我们必须按多列进行分组。我们可以使用 `groupby()` 函数来按多列条件对数据进行分组。我们通过以下步骤来实现：


  -   按 `admit` 和 `gender` 列对数据进行分组，并找出申请入学的平均值。

  -   按 `admit` 和 `department` 列对数据进行分组，并找出申请入学的平均值。


