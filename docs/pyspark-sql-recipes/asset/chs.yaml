  您想要从数据框中删除某些列。


  ### 解决方案


  数据科学家可能会遇到结构化数据集中存在一些冗余列的情况，这些列必须在分析之前移除。


  在本食谱中，您需要完成以下任务：


  *   从 `swimmerDf2` 数据框中删除 `id` 列。


  *   从 `swimmerDf2` 数据框中删除 `id` 和 `Occupation` 列。


