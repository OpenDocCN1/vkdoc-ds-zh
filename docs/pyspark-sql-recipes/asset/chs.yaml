  *   配方 4-6\. 标记数据

  *   配方 4-7\. 对 DataFrame 的列执行描述性统计

  *   配方 4-8\. 计算协方差

  *   配方 4-9\. 计算相关性

  *   配方 4-10\. 描述 DataFrame

