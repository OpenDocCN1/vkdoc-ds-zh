  ## Apache Spark 简介


  Apache Spark 是一个通用的分布式编程框架。它被认为非常适合迭代数据处理和批处理数据。它由 AMP 实验室开发。它提供了一个内存计算框架。它是一个开源软件。一方面，它最适合批处理；另一方面，它在处理实时或近实时数据方面也表现非常出色。机器学习和图算法本质上是迭代的，这正是
  Spark 展现其魔力之处。根据其研究论文，它比其同类 Hadoop 快得多。数据可以缓存在内存中。在迭代算法中缓存中间数据可提供惊人的快速处理能力。Spark
  可以使用 Java、Scala 和 R 进行编程。


  您可以在以下研究论文中了解更多关于 Apache Spark 运行时效率的信息：


  *   “弹性分布式数据集：一种面向内存集群计算的容错抽象”，作者：Matei Zaharia、Mosharaf Chowdhury、Tathagata Das、Ankur
  Dave、Justin Ma、Murphy McCauley、Michael J. Franklin、Scott Shenker 和 Ion Stoica。

  *   “Spark：使用工作集进行集群计算”，作者：Matei Zaharia、Mosharaf Chowdhury、Michael J. Franklin、Scott
  Shenker 和 Ion Stoica。

  *   “MLlib：Apache Spark 中的机器学习”，作者：Xiangrui Meng、Joseph Bradley、Burak Yavuz、Evan
  Sparks、Shivaram Venkataraman、Davies Liu、Jeremy Freeman、DB Tsai、Manish Amde、Sean
  Owen、Doris Xin、Reynold Xin、Michael J. Franklin、Reza Zadeh、Matei Zaharia 和 Ameet
  Talwalkar。


  如果你认为 Spark 是改进版的 Hadoop，在某种程度上，我认为这也没问题。因为我们可以在 Spark 中实现 MapReduce 算法，Spark 利用了
  HDFS 的优势。这意味着它可以从 HDFS 读取数据并将数据存储到 HDFS，并且它能够高效地处理迭代计算，因为数据可以持久化在内存中。除了内存计算之外，它也非常适合交互式数据分析。


  还有许多其他的库也依附于 PySpark，使得使用 PySpark 更加容易。我们将在下面讨论一些这样的库。


  *   `MLlib`：MLlib 是 PySpark 核心之上的一个封装库，它处理机器学习算法。MLlib 库提供的机器学习 API 非常易于使用。MLlib
  支持许多机器学习算法，包括分类、聚类、文本分析等等。

  *   `ML`：ML 也是一个机器学习库，位于 PySpark 核心之上。ML 的机器学习 API 可以作用于 DataFrames 上。

  *   `GraphFrames`：GraphFrames 库提供了一组 API，用于使用 PySpark 核心和 PySpark SQL 高效地进行图分析。在编写本书时，DataFrames
  是一个外部库。您需要单独下载并安装它。


  ## PySpark SQL 简介


  数据科学家处理的大部分数据本质上是结构化或半结构化的。PySpark SQL 模块是在 PySpark 核心之上的一个更高级抽象，用于处理结构化和半结构化数据集。我们将在整本书中学习
  PySpark SQL。它是 PySpark 的内置模块，这意味着它不需要任何额外的安装。


  PySpark SQL 可以使用领域特定语言进行编程。就我们而言，我们将使用 Python 来编写 PySpark SQL 程序。除了领域特定语言外，我们还可以运行结构化查询语言
  (SQL) 和 HiveQL 查询。使用 SQL 和 HiveQL 使 PySpark SQL 在数据库程序员和 Apache Hive 用户中备受欢迎。


  使用 PySpark SQL，您可以从多种来源读取数据。PySpark SQL 支持从多种文件格式系统读取数据，包括文本文件、CSV、ORC、Parquet、JSON
  等。您可以从关系数据库管理系统 (RDBMS) 读取数据，例如 MySQL 和 PostgreSQL。您也可以将分析报告保存到多种系统和文件格式中。


  PySpark SQL 引入了 DataFrames，它创建结构化数据的表格表示，并在 RDBMS 中提供表。另一种数据抽象数据集是在 Spark 1.6 中引入的，但它不适用于
  PySpark SQL。


  ### DataFrames 简介


  DataFrames 是一种类似于关系数据库系统中表的抽象。它们由命名列组成。DataFrames 是行对象的集合，在 PySpark SQL 中定义。DataFrames
  也包含命名列对象。用户知道表格形式的模式，因此操作 DataFrames 变得很容易。


  DataFrame 列中的元素将具有相同的数据类型。DataFrame 中的行可能包含不同数据类型的元素。基本的数据结构称为弹性分布式数据集 (RDD)。DataFrames
  是 RDD 上的封装。它们是 RDD 或行对象。我们将在接下来的章节中了解更多关于 `Row` 类的信息。参见图 1-7。


  ![../images/469054_1_En_1_Chapter/469054_1_En_1_Fig7_HTML.png](img/469054_1_En_1_Fig7_HTML.png)


  图 1-7


  DataFrames


  图 1-7 展示了一个包含四列的 DataFrame。列的名称分别是 `id`、`Gender`、`Occupation` 和 `swimTimeInSecond`。前三列的数据类型是
  `String`，而最后一列包含浮点数据。DataFrame 有两个组成部分——数据和它的模式。应该清楚的是，这与 RDBMS 表或 R 语言的 DataFrames
  类似。


