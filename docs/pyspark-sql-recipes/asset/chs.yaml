  ## Apache Kafka 简介


  `Apache Kafka` 是一个发布-订阅式的分布式消息平台。它由 `LinkedIn` 开发，并进一步开源给了 `Apache` 基金会。它具有容错性、可扩展性和快速性。在
  `Kafka` 术语中，消息是数据的最小单元，它从生产者流向消费者，经过 `Kafka 服务器`，并且可以被持久化以备后续使用。您可能对*生产者*和*消费者*这些术语感到困惑。我们很快就会讨论这些术语。在
  `Kafka` 的上下文中，我们将使用的另一个关键术语是*主题*。主题是一类相似的连续消息流。`Kafka` 自带一套内置的 `API`，开发人员可以使用它来构建自己的应用程序。主题是由我们来定义的。接下来，我们将讨论
  `Apache Kafka` 的三个主要组件。


  ### 生产者


  `Kafka` 生产者将消息生成到某个 `Kafka` 主题。它可以将数据发布到多个主题。


  ### 代理


  这是运行在专用机器上的主要 `Kafka` 服务器。生产者将消息推送到代理。代理将主题持久化到不同的分区中，并且这些分区会被复制到不同的代理以应对故障。代理本质上是无状态的，因此消费者必须跟踪它所消费的消息。


  ### 消费者


  消费者从 `Kafka 代理`获取消息。请记住，是它去获取消息。`Kafka 代理`不会将消息推送给消费者；而是消费者从 `Kafka 代理`拉取数据。消费者订阅了
  `Kafka 代理`上的一个或多个主题，并读取其中的消息。代理还会跟踪所有已经被消费的消息。数据在代理中会持久化一段指定的时间。如果消费者发生故障，它可以在重启后获取数据。


  **图 1-6** 展示了 `Apache Kafka` 的消息流。生产者将消息发布到主题。然后，消费者从代理拉取数据。在发布和拉取之间，消息由 `Kafka
  代理`进行持久化。


