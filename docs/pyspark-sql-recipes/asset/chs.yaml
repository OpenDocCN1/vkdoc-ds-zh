  |           15.56|

  |           15.15|

  |           15.27|

  |           15.65|

  |           15.74|

  +----------------+

  only showing top 6 rows

  ```


  输出结果显示在 `swimmerDf3` 数据框中。


  #### 步骤 4-2-2. 选择 `id` 和 `swimmerSpeed` 列


  现在，是时候选择 `id` 和 `swimmerSpeed` 列了。以下代码将实现该操作。


  ```

  In [3]: swimmerDf4 = swimmerDf2.select("id","swimmerSpeed")

  In [4]: swimmerDf4.show(6)

  ```


  以下是输出结果：


