  ### SparkSession


  `SparkSession` 对象是入口点，它取代了 `SQLContext` 和 `HiveContext`。为了使 PySpark SQL 代码与早期版本兼容，`SQLContext`
  和 `HiveContext` 在 PySpark 中继续存在。在 PySpark 控制台中，我们可以获取 `SparkSession` 对象。我们可以使用以下代码创建一个
  `SparkSession` 对象。


  为了创建 `SparkSession` 对象，我们必须按如下方式导入 SparkSession：


  ```

  from pyspark.sql import SparkSession

  ```


  导入 SparkSession 后，我们可以使用 `SparkSession.builder` 如下所示创建它的对象：


  ```

  spark = SparkSession.builder.appName("PythonSQLAPP") .getOrCreate()

  ```


  `appName` 函数将设置应用程序的名称。`getOrCreate()` 函数将返回一个现有的 `SparkSession` 对象。如果不存在 `SparkSession`
  对象，`getOrCreate()` 函数将创建一个新对象并返回它。


  ### 结构化流


  我们可以使用结构化流框架进行流数据分析，该框架是 PySpark SQL 之上的一个封装。我们可以使用结构化流对流数据进行分析，就像使用 PySpark SQL
  对静态数据进行批处理分析一样。


  就像 Spark 流式处理模块对微批次执行流式处理操作一样，结构化流引擎也对微批次执行流式处理操作。


  结构化流的最佳之处在于它使用与 PySpark SQL 类似的 API。因此，学习曲线较高。对 DataFrames 的操作已经过优化，类似地，结构化流 API
  也在性能方面进行了优化。




  ## Catalyst 优化器


  SQL 是一种声明式语言。使用 SQL 时，我们告诉 SQL 引擎**要做什么**，而不告诉它**如何**执行任务。类似地，PySpark SQL 命令也不会告诉系统如何执行任务，这些命令仅指明要执行的内容。因此，PySpark
  SQL 查询在执行任务时需要进行优化。`catalyst optimizer`（催化剂优化器）在 PySpark SQL 中执行查询优化。PySpark SQL
  查询会被转换为低层级的弹性分布式数据集（`RDD`）操作。`catalyst optimizer`首先将 PySpark SQL 查询转换为逻辑计划，然后将此逻辑计划转换为优化后的逻辑计划。根据此优化后的逻辑计划，会生成一个物理计划。实际上会生成多个物理计划。通过使用代价分析器，会选择出最优化的物理计划。最后，生成低层级的`RDD`操作代码。


  ## 集群管理器简介


  在分布式系统中，一个作业或应用程序会被分解为不同的任务，这些任务可以在集群中的不同机器上并行运行。如果机器出现故障，你必须在另一台机器上重新调度该任务。


  由于资源管理不善，分布式系统通常会面临可扩展性问题。设想一个已经在集群上运行的作业。另一个人想要运行另一个作业。第二个作业必须等待第一个作业完成。但这样，我们并没有最优地利用资源。资源管理说起来容易，但在分布式系统上实现起来却很困难。为了最优地管理集群资源，集群管理器应运而生。Spark
  有三种可用的集群管理器——独立模式（Standalone）、Apache Mesos 和 YARN。这些集群管理器最大的优点在于，它们在用户和集群之间提供了一个抽象层。由于集群管理器提供的这种抽象，用户的使用体验就像在单机上工作一样，尽管他们实际上是在集群上工作。集群管理器负责将集群资源调度给正在运行的应用程序。


  ### Standalone 集群管理器


  Apache Spark 自带一个 Standalone 集群管理器。它为 Spark 集群提供了主从架构。这是一个仅适用于 Spark 的集群管理器。你只能使用此
  Standalone 集群管理器运行 Spark 应用程序。其组件包括主节点（master）和工作节点（workers）。工作节点是主进程的从节点。这是最简单的集群管理器。Spark
  Standalone 集群管理器可以通过 Spark 的 `sbin` 目录中的脚本进行配置。我们将在后续章节中配置 Spark Standalone 集群管理器，并使用
  Standalone 集群管理器部署 PySpark 应用程序。


  ### Apache Mesos 集群管理器


  Apache Mesos 是一个通用的集群管理器。它由加州大学伯克利分校 AMP 实验室开发。Apache Mesos 帮助分布式解决方案高效扩展。使用 Mesos，你可以在同一集群上通过不同的框架运行不同的应用程序。来自不同框架的不同应用程序是什么意思？这意味着你可以在
  Mesos 上同时运行一个 Hadoop 应用程序和一个 Spark 应用程序。当多个应用程序在 Mesos 上运行时，它们共享集群资源。Apache Mesos
  有两个重要的组件——主节点（master）和从节点（slaves）。这种主从架构类似于 Spark Standalone 集群管理器。在 Mesos 上运行的应用程序被称为框架（frameworks）。从节点会以资源邀约（resource
  offer）的形式，将其可用的资源告知主节点。从节点机器会周期性地提供资源邀约。主节点的分配模块（allocation module）决定哪个框架获得这些资源。


  ### YARN 集群管理器


  YARN 代表“另一种资源协调器”（Yet Another Resource Negotiator）。YARN 是在 Hadoop 2 中引入的，用于扩展 Hadoop。它将资源管理和作业管理分离开来。分离这两个组件使
  Hadoop 具有更好的可扩展性。YARN 的主要组件是 `ResourceManager`、`ApplicationMaster` 和 `NodeManager`。每个集群有一个全局的
  `ResourceManager` 和多个 `NodeManager` 在运行。`NodeManager` 是 `ResourceManager` 的从节点。`Scheduler`（调度器）是
  `ResourceManager` 的一个组件，它为集群上运行的不同应用程序分配资源。最棒的一点是，你可以在 YARN 管理的集群上同时运行 Spark 应用程序和任何其他应用程序（如
  Hadoop 或 MPI）。每个应用程序有一个 `ApplicationMaster`，它负责处理在分布式系统上并行运行的任务。请记住，Hadoop 和 Spark
  有各自的 `ApplicationMaster`。


  ### 注意


  你可以通过以下网页了解更多关于 Standalone、Apache Mesos 和 YARN 集群管理器的信息。


  [`https://spark.apache.org/docs/2.0.0/spark-standalone.html`](https://spark.apache.org/docs/2.0.0/spark-standalone.html)


  [`https://spark.apache.org/docs/2.0.0/running-on-mesos.html`](https://spark.apache.org/docs/2.0.0/running-on-mesos.html)


  [`https://spark.apache.org/docs/2.0.0/running-on-yarn.html`](https://spark.apache.org/docs/2.0.0/running-on-yarn.html)


  ## PostgreSQL 简介


  关系型数据库管理系统在许多组织中仍然非常普遍。这里的*关系*是什么意思？关系指的是表。PostgreSQL 是一个关系型数据库管理系统。它运行在所有主流操作系统上，如
  Microsoft Windows、基于 UNIX 的操作系统、MacOS X 等。它是一个开源程序，其代码在 PostgreSQL 许可下可用。因此，你可以自由地使用它，并根据你的需求进行修改。


  PostgreSQL 数据库可以通过其他编程语言连接，如 Java、Perl、Python、C 和 C++，以及通过不同的编程接口连接许多其他语言。它还可以使用一种称为
  `PL/pgSQL`（过程化语言/PostgreSQL）的过程化编程语言进行编程，该语言类似于 `PL/SQL`。你可以向此数据库添加自定义函数。你可以用 C/C++
  和其他编程语言编写自定义函数。你还可以使用 JDBC 连接器从 PySpark SQL 读取 PostgreSQL 中的数据。在后续章节中，我们将使用 PySpark
  SQL 从 PostgreSQL 读取数据表。我们还将进一步探讨 PostgreSQL 的其他一些方面。


  PostgreSQL 遵循 ACID（原子性、一致性、隔离性和持久性）原则。它附带了许多特性，其中一些是 PostgreSQL 独有的。它支持可更新视图、事务完整性、复杂查询、触发器等功能。PostgreSQL
  使用多版本并发控制模型进行并发管理。


  PostgreSQL 拥有广泛的社区支持。PostgreSQL 被设计和开发为可扩展的数据库。


