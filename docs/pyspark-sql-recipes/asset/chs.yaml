  ## 配方 8-3. 对流数据应用 PySparkSQL


  ### 问题

  你想对流数据应用 SQL 过滤条件。


  ### 解决方案

  我们需要对同一个表应用过滤条件。


  ### 工作原理


  以下是查询语句，我们过滤出 `tempInCelsius` 大于 13 的天数。由于 `tempInCelsius` 列是字符串类型，我们将其转换为 `double`
  类型。


  ```

  >>> spark.sql("select * from TemperatureData where cast(tempInCelsius as double)
  > 13").show()

  ```


  以下是输出结果：


  ```

  +-----+-------------+

  |  day|tempInCelsius|

  +-----+-------------+

  | day9|         13.1|

  |day12|           14|

  |day13|         13.9|

  | day2|         13.1|

  | day5|           14|

  | day6|         13.9|

  +-----+-------------+

  ```


  因此，借助 Spark 的结构化流，我们可以将其视为一个表，而 Spark 提供了类似 SQL 的数据处理能力。类似地，我们可以在这个表上执行任何 SQL 操作。你可能希望将这些数据与静态数据连接，以便将传入的数据进行映射，从而进行分析并生成特定方面的趋势报告。


  ## 配方 8-4. 连接流式数据与静态数据


  ### 问题

  你需要将流式数据与静态数据连接。


  ### 解决方案

  在本配方中，你需要将流式数据与静态数据连接，以便从流式数据中获取更多信息。为了完成这个配方，我对数据做了一些微调。


