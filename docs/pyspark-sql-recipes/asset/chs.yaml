  ```

  >>> city_zipcode_df = spark.read.csv(''city-zipcode.csv'',header=True, inferSchema=True)

  >>> city_zipcode_df.createOrReplaceTempView("CityZipcode")

  >>> spark.sql("select * from CityZipcode").show()

