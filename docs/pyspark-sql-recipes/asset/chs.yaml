  ## 引言


  本书将带您踏上一段有趣的旅程，通过问题解决方案的方式来学习 PySparkSQL 和大数据。每个问题都附有详细、逐步的解答，这将提升您使用 PySparkSQL
  解决大数据问题的思维能力。以下是各章的简要介绍：


  *   第 1 章“PySparkSQL 简介”介绍了许多大数据处理工具，如 Apache Hadoop、Apache Pig、Apache Hive 和 Apache
  Spark。讨论了 Hadoop 的缺点和 Spark 的演进。它还讨论了 PySparkSQL，包括 DataFrame 的介绍，并涵盖了结构化流处理。本章还包含了关于
  Apache Kafka 的讨论，并阐明了 MongoDB 和 Cassandra 等 NoSQL 数据库。


  *   第 2 章“安装”将带您进入实战演练场。您将学习如何安装许多大数据处理工具，如 Hadoop、Hive、Spark、MongoDB 和 Apache Cassandra。


  *   第 3 章“PySparkSQL 中的输入输出”将带您了解许多使用 PySparkSQL 从多种数据源读取数据的方案。您将从 CSV、JSON、ORC
  和 Parquet 等多种文件格式读取数据，然后从 MySQL 和 PostgreSQL 等多种关系型数据库管理系统读取数据。本章还讨论了如何使用 PySparkSQL
  从 MongoDB 和 Cassandra 等 NoSQL 数据库读取数据。最后，您将看到如何将数据保存到多种目标，如文件、关系型数据库或 NoSQL 数据库。


  *   第 4 章“PySparkSQL DataFrame 上的操作”解释了在 DataFrame 上进行的不同操作，如数据过滤、数据转换和数据排序。


  *   第 5 章“使用 PySparkSQL 进行数据合并与数据聚合”展示了如何在 DataFrame 上执行数据聚合和数据合并。


  *   第 6 章“SQL、NoSQL 与 PySparkSQL”展示了如何在 DataFrame 上执行 SQL 操作。它包含多个方案，帮助您将 DataFrame
  转换为类似表的结构，然后对其应用 SQL 查询。


  *   第 7 章“优化 PySparkSQL”将向您展示如何执行更快的优化连接。您将了解 Spark 在后台运行的基本原理，并基于此看到多个帮助您优化 DataFrame
  上 SQL 查询的方案。


  *   第 8 章“结构化流处理”展示了如何将 Spark 流处理应用于流式数据。本章提供了多个方案，帮助您将 Spark 的结构化流处理 API 和 SQL
  应用于流式数据。


  *   第 9 章“GraphFrames”展示了如何在 DataFrame 上执行图操作。包括 PageRank 在内的多个 GraphFrame 方案将帮助您理解并应用使用
  Spark GraphFrame 的复杂图操作。


