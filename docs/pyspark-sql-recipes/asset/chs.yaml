- "# 配方 6-3：从 DataFrame 创建简单 SQL\n\n### 问题\n\n到目前为止，我们一直在为使用 Spark SQL 打好基础。我们从数据文件创建了\
  \ DataFrame，并将该 DataFrame 注册为临时视图。现在，我们使用这个临时视图来应用我们的第一个简单 SQL 查询。\n\n### 解决方案\n\
  \n我们需要创建一个简单的查询。对任何人来说，一个简单的查询就是 `select * from table`。我们在这里执行这个操作。\n\n```python\n\
  >>> outputDf = spark.sql(\"select * from students\")\n>>> outputDf.show()\n```\n\
  \n这是输出结果：\n\n```text\n+---------+-------+------+\n|studentId|   name|gender|\n+---------+-------+------+\n\
  |      si1|  Robin|     M|\n|      si2|  Maria|     F|\n|      si3|  Julie|    \
  \ F|\n|      si4|    Bob|     M|\n|      si6|William|     M|\n+---------+-------+------+\n\
  ```\n\n注意，我们能够使用 SQL 查询对数据进行查询。输出结果与我们之前看到的相同。\n\n### 工作原理\n\n#### 步骤 6-3-1：在 Spark\
  \ SQL 中使用列名\n\n既然我们已经应用了一个简单的 SQL 查询，现在让我们在查询中使用列名。\n\n让我们看看 `students` 视图中有哪些可用的列名。回想一下，DataFrame\
  \ 的 `printSchema` 方法可以用来显示模式。对于 SQL 爱好者来说，还有另一种查看和分析细节的方法。\n\nSpark 提供了 `Describe`，它可用于查看表/视图的列、数据类型以及任何注释（通常指示该列是否允许空值）。\n\
  \n让我们在 `students` 视图上应用 `Describe` 关键字。\n\n```python\n>>> spark.sql(\"Describe students\"\
  ).show()\n```\n\n这是输出结果：\n\n```text\n+---------+---------+-------+\n| col_name|data_type|comment|\n\
  +---------+---------+-------+\n|studentId|   string|   null|\n|     name|   string|\
  \   null|\n|   gender|   string|   null|\n+---------+---------+-------+\n```\n\n\
  从输出结果可以看出，列名与我们通过 `printSchema` 方法看到的名称相同。`Describe` 选项提供了一种获取表模式的 SQL 风格方式。\n\n\
  接下来，我们使用这些列来应用一个查询。让我们获取一份只包含姓名和性别的学生报告，因为通常做报告时我们不需要 ID。\n\n我们将要运行的查询是“获取所有学生的姓名和性别报告”。\n\
  \n```python\n>>> spark.sql(\"select name,gender from students\").show()\n```\n\n\
  这是输出结果：\n\n```text\n+-------+------+\n|   name|gender|\n+-------+------+\n|  Robin|\
  \     M|\n|  Maria|     F|\n|  Julie|     F|\n|    Bob|     M|\n|William|     M|\n\
  +-------+------+\n```\n\n根据输出结果，我们可以看到只显示了 `name` 和 `gender` 两列。\n\n#### 步骤 6-3-2：为列名创建别名\n\
  \n从报告的角度来看，我们希望报告能提供格式化的列名和易于理解的列名。假设我们的报告需要以下格式：\n\n- `\"name\"` 应显示为 `\"Name\"\
  `（N 大写）。\n- `gender` 应显示为 `\"Sex\"`\n\n为此，Spark 允许我们创建别名，以便按照我们需要的格式显示列名。\n\n```python\n\
  >>> spark.sql(\"select name as Name,gender as Sex from students\").show()\n```\n\
  \n这是输出结果：\n\n```text\n+-------+----+\n|   Name| Sex|\n+-------+----+\n|  Robin|\
  \   M|\n|  Maria|   F|\n|  Julie|   F|\n|    Bob|   M|\n|William|   M|\n+-------+----+\n\
  ```\n\n分析输出结果，我们发现列名按预期显示。要创建别名，我们需要将别名放在原始列名旁边。关键字 `as` 是可选的。这种别名概念在复杂查询中将非常有用，我们将在本章后面看到。\n\
  \n#### 步骤 6-3-3：使用 Where 子句过滤数据\n\n在本配方中，我们将对数据应用过滤器，只选择女性学生，即性别设置为 `F` 的学生。`where`\
  \ 子句用于对列值应用过滤。\n\n```python\n>>> spark.sql(\"select name ,gender from students where\
  \ gender = 'F'\").show()\n```\n\n让我们看看这里的输出：\n\n```text\n+-------+-------+\n|  \
  \ name| gender|\n+-------+-------+\n|  Maria|      F|\n|  Julie|      F|\n+-------+-------+\n\
  ```\n\n正如你可以从输出中观察到的，我们只得到了女性学生。此时需要注意，Spark 在处理过滤条件时非常高效。如果在程序执行过程中，在多个时间点对同一个\
  \ DataFrame 应用了多个过滤条件，Spark 知道如何合并这些过滤条件，以便一次性全部应用。原因是 Spark 在内部会扫描每一行，根据过滤条件识别匹配的行。当某些条件对同一数据集多次应用时，代价会非常高。Spark\
  \ 使用一种名为 Catalyst 的特殊查询优化器，以便在此过程中理解此类过滤条件。\n\n虽然我们看到了一些工作良好的示例，但对于来自 RDBMS SQL\
  \ 背景的读者来说，也存在一些陷阱。接下来我们来看看这些陷阱。\n\n\n\n#### 第 6-3-4 步：对大小写敏感的列值进行筛选\n\n在上一步中，查询筛选出了女性学生。女性性别由列值\
  \ `F` 表示，请注意是大写。如果碰巧我们根据 `f` 进行筛选，那么查询将不会输出任何结果，因为性别列中没有值为 `f` 的记录。接下来，让我们根据 `f`\
  \ 条件进行筛选。\n\n```\n>>> spark.sql(\"select name ,gender from Students where Gender\
  \ = 'f'\").show()\n```\n\n以下是输出，我们可以看到没有打印任何记录：\n\n```\n+----+------+\n|name|gender|\n\
  +----+------+\n+----+------+\n```\n\n有些情况下，我们不知道列值的大小写（值是大写还是小写）。在这些情况下，我们需要对列应用函数，如下所示。\n\
  \n让我们继续使用 `lower` 函数，该函数会在比较之前将值转换为小写。在 Spark SQL 中，这被称为 UDF，即用户自定义函数。Spark 提供了多种预定义的\
  \ UDF。`lower` 就是这样一个 UDF，用于将值从大写转换为小写。我们来使用 `lower` 函数并查看结果。\n\n```\n>>> spark.sql(\"\
  select name ,gender from Students where lower(gender) = 'f'\").show()\n```\n\n以下是输出，你可以看到筛选出女性学生的结果：\n\
  \n```\n+-----+------+\n| name|gender|\n+-----+------+\n|Maria|     F|\n|Julie| \
  \    F|\n+-----+------+\n```\n\n#### 第 6-3-5 步：尝试在 Where 子句中使用别名列\n\n通常，许多 RDBMS\
  \ 数据库允许我们在 `where` 子句、`group by` 子句以及其他类似子句中使用别名。但如果我们尝试在 Spark SQL 中做同样的事情，将会看到一个奇怪的错误。输出提示无法解析列名。这是因为\
  \ Spark SQL 不允许在同一 SQL 语句中使用别名列名。\n\n让我们在 SQL 中使用别名并查看输出：\n\n```\n>>> spark.sql(\"\
  select name ,gender Sex from Students where Lower(Sex) = 'f'\").show()\n```\n\n\
  以下是输出：\n\n```\nraise AnalysisException(s.split(': ', 1)[1], stackTrace)\npyspark.sql.utils.AnalysisException:\
  \ \"cannot resolve '`Sex`' given input columns: [students.studentId, students.name,\
  \ students.gender]; line 1 pos 44;\\n'Project ['name, 'gender AS Sex#163]\\n +-\
  \ 'Filter ('Sex = f)\\n +- SubqueryAlias students\\n +- Relation[studentId#0,name#1,gender#2]\
  \ parquet\\n\"\n```\n\n虽然我们可能会看到一长串异常堆栈，但不要被吓到。在最末尾处，请注意那条友好的消息，它提到给定的列无法解析。也就是说，Spark\
  \ SQL 无法识别 SQL 中的别名列。\n\n## 食谱 6-4. 在 Spark SQL 中应用 Spark UDF 方法\n\n### 问题\n\n你想在\
  \ Spark SQL 中使用 Spark UDF 函数。\n\n### 解决方案\n\n用户自定义函数（UDF）是特殊的函数，有助于将数据从一种表示形式转换为另一种表示形式。在上一节中，我们使用了\
  \ `lower` UDF 将字符转换为小写。其他类似的例子包括将日期字符串从一种格式转换为另一种格式，以及将字符转换为其详细值，例如将 `M` 转换为 Male，将\
  \ `F` 转换为 Female。\n\n### 工作原理\n\n让我们应用一个 UDF 来将日期从一种格式转换为另一种格式。\n\n本问题中使用的数据包含一个额外的列，用于记录每个学生的出生日期。让我们加载数据并查看其内容。\n\
  \n```\n>>> studentDf = spark.read.csv('studentData_dateofbirth.csv',header=True,\
  \ inferSchema=True)\n>>> studentDf.printSchema()\n```\n\n让我们打印新数据 `studentData_dateofbirth.csv`\
  \ 的架构。\n\n```\nroot\n|-- studentId: string (nullable = true)\n|-- name: string (nullable\
  \ = true)\n|-- gender: string (nullable = true)\n|-- dateofbirth: string (nullable\
  \ = true)\n```\n\n新数据已加载，打印架构后，我们得到如图 6-2 所示的输出。请注意，现在多了一个名为 `dateofbirth` 的列。\n\
  \n![../images/469054_1_En_6_Chapter/469054_1_En_6_Fig2_HTML.jpg](img/469054_1_En_6_Fig2_HTML.jpg)\n\
  \n图 6-2\n\n添加了出生日期列的学生数据\n\n我们引入了一个名为 `dateofbirth` 的新列，以便在该列上应用 UDF。Spark 默认提供了许多日期函数，可以应用于日期值，例如将字符串值转换为日期、显示两个日期之间的差异、增加和减少日期等。所有这些功能在\
  \ Spark 中都作为用户自定义函数提供。\n\n\n\n#### 步骤 6-4-1：将字符串值表示为日期值\n\n我们需要查看视图中 `dateofbirth`\
  \ 列的默认数据类型。在此之前，需要先为更新后的数据创建一个临时视图。\n\n让我们继续操作：\n\n```\n>>> studentDf.createOrReplaceTempView(\"\
  Students\")\n```\n\n这样，我们在 Spark 中创建了一个名为 `Students` 的视图。\n\n接下来，查看新创建表中的列及其各自的数据类型。\n\
  \n```\n>>> spark.sql(\"Describe students\").show()\n```\n\n输出如下：\n\n```\n+-----------+---------+-------+\n\
  |   col_name|data_type|comment|\n+-----------+---------+-------+\n|  studentId|\
  \   string|   null|\n|       name|   string|   null|\n|     gender|   string|  \
  \ null|\n|dateofbirth|   string|   null|\n+-----------+---------+-------+\n```\n\
  \n这里我们可以注意到 `dateofbirth` 列的数据类型是 `string`。这是因为 Spark 会将 CSV 文件的内容视为 `string` 数据类型。让我们使用\
  \ Spark 的 `Date` UDF 将此列转换为 `Date` 数据类型。\n\n```\n>>> spark.sql(\"select studentid,\
  \ name, gender, to_date(dateofbirth) from students\").show()\n```\n\n输出如下：\n\n```\n\
  +----------+-------+-------+--------------------------------+\n| studentid|   name|\
  \ gender| to_date(students.`dateofbirth`)|\n+----------+-------+-------+--------------------------------+\n\
  |       si1|  Robin|      M|                      1981-12-13|\n|       si2|  Maria|\
  \      F|                      1986-06-06|\n|       si3|  Julie|      F|       \
  \               1988-09-05|\n|       si4|    Bob|      M|                      1987-05-04|\n\
  |       si6|William|      M|                      1980-11-12|\n+----------+-------+-------+--------------------------------+\n\
  ```\n\n从输出中注意到，`dateofbirth` 列被作为 `to_date` UDF 的输入，该函数返回数据类型为 `Date` 的值。让我们验证一下该列的数据类型。\n\
  \n```\n>>> studentDf_dob = spark.sql(\"select studentid, name, gender, to_date(dateofbirth)\
  \ from students\")\n>>> studentDf_dob.createOrReplaceTempView(\"StudentsDob\")\n\
  ```\n\n这里我们创建了另一个表，其中包含了转换后的 `dateofbirth` 列。\n\n让我们使用 `describe` 关键字查看新创建的表及其模式。\n\
  \n```\n>>> spark.sql(\"Describe studentsDob\").show()\n```\n\n输出如下：\n\n```\n+--------------------+---------+-------+\n\
  |            col_name|data_type|comment|\n+--------------------+---------+-------+\n\
  |           studentid|   string|   null|\n|                name|   string|   null|\n\
  |              gender|   string|   null|\n|to_date(students....|     date|   null|\n\
  +--------------------+---------+-------+\n```\n\n你可以清楚地注意到有一列的数据类型是 `date`。但列名仍然不够清晰易懂。让我们使用别名来创建一个更好的列名。\n\
  \n这里我们执行相同的步骤，只是对 `dateofbirth` 列应用了别名。\n\n```\n>>> studentDf_dob = spark.sql(\"\
  select studentid, name, gender, to_date(dateofbirth) dateOfBirth from students\"\
  )\n>>> studentDf_dob.createOrReplaceTempView(\"StudentsDob\")\n>>> spark.sql(\"\
  Describe studentsDob\").show()\n```\n\n输出如下：\n\n```\n+-----------+---------+-------+\n\
  |   col_name|data_type|comment|\n+-----------+---------+-------+\n|  studentid|\
  \   string|   null|\n|       name|   string|   null|\n|     gender|   string|  \
  \ null|\n|dateOfBirth|     date|   null|\n+-----------+---------+-------+\n```\n\
  \n新创建表的模式现在便于使用，因为它有清晰的列名 `dateOfBirth`。\n\n#### 步骤 6-4-2：使用日期函数进行多种日期处理\n\n在这一步中，我们将使用各种\
  \ `Date` 用户定义函数来分离日、月和年的值。为了便于理解，我们选取了一些所有读者都能理解的示例。\n\n让我们先定义 SQL 来分离 `Date` 列的各个值。\n\
  \n```\n>>> spark.sql(\"select dateofbirth,dayofmonth(dateofbirth) day, month(dateofbirth)\
  \ month, year(dateofbirth) year from  studentsdob\").show()\n```\n\n上述查询提取了各个值，如下所示：\n\
  \n- `日` 使用 `dayofmonth`\n- `月` 使用 `month`\n- `年` 使用 `year`\n\n输出如下：\n\n```\n+-----------+---+-----+----+\n\
  |dateofbirth|day|month|year|\n+-----------+---+-----+----+\n| 1981-12-13| 13|  \
  \ 12|1981|\n| 1986-06-06|  6|    6|1986|\n| 1988-09-05|  5|    9|1988|\n| 1987-05-04|\
  \  4|    5|1987|\n| 1980-11-12| 12|   11|1980|\n+-----------+---+-----+----+\n```\n\
  \n可以清楚地看到，这些用户定义函数非常有价值，因为它们使我们能够对单个列进行操作并处理其值。\n\n用户定义函数本质上是使用 Java、Scala 或 Python\
  \ 语言在 Spark 内部定义的程序。这些函数将给定的列作为输入值，并对表中的每一行应用其功能。例如，`year` UDF 获取 `dateofbirth`\
  \ 列的值，提取日期中的年份部分，并返回日期的 `year` 值。这将对表中的每一行应用。同样地，`month` 和 `dayofmonth` 是 Spark\
  \ SQL 内部定义的 UDF，它们分别返回 `month` 和 `date` 值。\n\n在本节中，我们看到了许多与日期相关的 UDF。与此类似，还有多个字符串相关函数以及统计函数。所有这些\
  \ UDF 都可以在 Spark SQL 查询中使用。\n\n你可能会想，如果需要对列值进行聚合的函数该怎么办。\n\n## 配方 6-5：创建一个新的 PySpark\
  \ UDF\n\n### 问题\n\n你需要创建一个新的自定义 UDF。`Students` 数据中的 `gender` 列包含 `M` 或 `F`，分别代表男性或女性。你需要创建一个\
  \ UDF，能够返回 `Male` 或 `Female` 作为值，而不是 `M` 或 `F`。\n\n### 解决方案\n\n让我们开始创建 UDF。添加可在\
  \ SQL 查询中使用的功能是非常有趣的。\n\n### 工作原理\n\n#### 步骤 6-5-1：创建一个接受值并返回所需值的常规 Python 函数\n\n\
  创建 Python 函数需要一点点 Python 知识，但并不是很复杂。所以让我们创建一个。为函数提供一个有意义的名称非常重要。\n\n```\n>>> def\
  \ genderCodeToValue(code):\n...     return('FEMALE' if code == 'F' else 'MALE' if\
  \ code == 'M' else 'NA')\n```\n\n这里我们创建了一个简单的函数，它接受一个代码并返回相应的值。如果代码不是 `M` 或 `F`，则返回\
  \ `NA` 作为值。我将其保持得非常简单，以便你理解这个概念。\n\n让我们通过提供一些值来测试这个函数。\n\n以下是测试结果。\n\n```\n>>> print(genderCodeToValue('M'))\n\
  使用代码 'M' 进行测试\n```\n\n输出如下：\n\n```\nMALE\n使用代码 'F' 进行测试。\n>>> print(genderCodeToValue('F'))\n\
  ```\n\n输出如下：\n\n```\nFEMALE\n使用代码 'K' 作为值，既不是 'M' 也不是 'F' 进行测试\n>>> print(genderCodeToValue('K'))\n\
  ```\n\n输出如下：\n\n```\nNA\n```\n\n因此，我们成功测试了这个简单的函数。在将函数应用于数据集之前，先进行测试总是一个好做法。这被称为*单元测试*，它有助于你在编写代码后立即发现并修复错误。想象一下，如果你直接将代码用于大量数据，你可能无法看到错误或其根本原因。特别是由于\
  \ Spark 通常用于处理海量数据，UDF 中的错误非常难以发现。在将 Python 函数应用于数据之前，用所有可能的输入对其进行测试是非常重要的。\n\n\n\
  \n#### 步骤 6-5-2：在 Spark SQL 会话中注册 Python 函数\n\n创建 Python 函数后，下一步是将该函数作为 UDF 注册到\
  \ Spark SQL 中。具体操作如下。\n\n```python\n>>> from pyspark.sql.functions import udf\n\
  >>> from pyspark.sql.types import StringType\n```\n\n在将 `genderCodeToValue` 注册为\
  \ UDF 之前，需要将这些类型导入到 Python 中。首先，需要从 `pyspark.sql.functions` 包中导入 `udf` 函数，然后需要从\
  \ `pyspark.sql.types` 包中导入 `StringType`。Spark 需要使用 `StringType` 来验证 SQL 与用户定义函数的返回类型是否一致。\n\
  \n现在让我们注册这个 UDF。\n\n```python\n>>> spark.udf.register(\"genderCodeToValue\", genderCodeToValue,\
  \ StringType())\n```\n\n以下输出表示 UDF 已成功注册到 Spark SQL：\n\n这是注册 UDF 最简单的方法。这种注册方式使用了\
  \ `spark.udf.register` 函数。让我们看看传入该函数的各个参数。\n\n第一个参数是 `genderCodeToValue`。这是 UDF\
  \ 的名称。此名称将用于在 Spark SQL 中调用此函数。\n\n第二个参数是 `genderCodeToValue`。这是我们刚刚创建的、实现了所需功能的方法。请注意，这是一个对方法的引用。在这种情况下，该方法是作为引用传递的。这里非常重要的一点是，调用此\
  \ UDF 时遇到的任何问题都只会在函数被应用时才会暴露，也就是当 Spark 对 DataFrame 执行操作时。因此，务必确保该函数已经过将要操作的所有数据类型的测试。\n\
  \n同时，一个好的做法是在 UDF 内部妥善处理错误。很多时候，UDF 是在较小的数据集上进行测试的，开发者很高兴发现函数运行完美。但在典型的大数据世界中，数据容易出现错误，很难确定流程在何处失败以及是什么数据导致了错误。当使用\
  \ UDF 处理数百万行数据时，仅仅因为一个未妥善处理的错误而导致处理停止，这在生产环境中将是一场噩梦。\n\n第三个参数是 `StringType()`。这表示\
  \ UDF 将返回一个 `string` 类型的值。Spark SQL 使用此返回类型来正确验证和应用 UDF。\n\n#### 步骤 6-5-3：从 PySpark\
  \ SQL 调用已注册的 UDF\n\n现在，我们将使用我们刚刚在 Spark SQL 中创建的 UDF `genderCodeToValue`。让我们开始吧。\n\
  \n假设我们需要获取一份包含学生姓名及其性别全称的学生报告。查询如下：\n\n```python\n>>> spark.sql(\"select name, \
  \ genderCodeToValue(gender) from  studentsdob\").show()\n```\n\n以下是输出结果：\n\n```\n\
  +-------+-------------------------+\n|   name|genderCodeToValue(gender)|\n+-------+-------------------------+\n\
  |  Robin|                     MALE|\n|  Maria|                   FEMALE|\n|  Julie|\
  \                   FEMALE|\n|    Bob|                     MALE|\n|William|    \
  \                 MALE|\n+-------+-------------------------+\n```\n\n可以清楚地看到，性别已通过\
  \ UDF 的输出显示出来。列标题不太清晰，因此我们使用以下别名来修正它：\n\n```python\n>>> spark.sql(\"select name\
  \ as Name,  genderCodeToValue(gender) as Gender from  studentsdob\").show()\n```\n\
  \n以下是输出结果：\n\n```\n+-------+------+\n|   Name|Gender|\n+-------+------+\n|  Robin|\
  \  MALE|\n|  Maria|FEMALE|\n|  Julie|FEMALE|\n|    Bob|  MALE|\n|William|  MALE|\n\
  +-------+------+\n```\n\n请注意，我们现在得到了更清晰的输出，并带有正确的列别名。至此，我们已成功完成了创建自定义 UDF 的任务。\n\
  \n### 配方 6-6：使用 SQL 连接两个 DataFrame\n\n### 问题\n\n您希望使用 Spark SQL 连接两个 DataFrame。在任何数据转换过程中，连接两个或多个数据集都是一个非常重要的步骤。作为\
  \ ETL 开发者，我们经常需要连接多个表来获得所需的输出报告。在典型的数据仓库中，通常采用星型模式或雪花模式的数据建模技术。无论是哪种数据建模技术，都涉及大量的连接操作。对于大数据，由于连接庞大的数据集会降低查询性能，因此首选非规范化数据模型。尽管如此，我们必须清楚地了解如何连接数据集并生成报告。\n\
  \n### 解决方案\n\n让我们从连接两个数据集开始。为此，我们将向您介绍另一个基于学生的数据集，称为 `Subjects`（科目）。\n\n![图 6-3\
  \ subjects 数据集](img/469054_1_En_6_Fig3_HTML.jpg)\n\n我们将获取学生在各个科目中取得的分数。为此，我们首先需要将此数据作为\
  \ DataFrame 加载。由于我们已经多次执行此操作，所以如果您能尝试不参考以下代码来完成，将是一个很好的练习。\n\n### 工作原理\n\n让我们进入代码部分。我们将从\
  \ `subjects` 数据中创建一个临时视图。\n\n```python\n>>> subjectsDf = spark.read.csv('subjects.csv',header=True,\
  \ inferSchema=True)\n>>> subjectsDf.createOrReplaceTempView(\"subjects\")\n>>> spark.sql(\"\
  select * from subjects\").show()\n```\n\n是的，仅需这三行 Spark 代码，就能从 CSV 加载数据并使用 SQL 进行查询。正是\
  \ Spark 的这一特性使其如此强大。如果使用任何其他语言或工具，则需要编写大量样板代码才能开始基于 SQL 查询此数据。\n\n以下是输出结果：\n\n```\n\
  +---------+-------+-----+\n|studentId|subject|marks|\n+---------+-------+-----+\n\
  |      si1| Python|   75|\n|      si3|   Java|   76|\n|      si1|   Java|   81|\n\
  |      si2| Python|   85|\n|      si3|   Ruby|   72|\n|      si4|    C++|   78|\n\
  |      si5|      C|   77|\n|      si4| Python|   84|\n|      si2|   Java|   83|\n\
  +---------+-------+-----+\n```\n\n让我们再看看学生数据：\n\n```python\n>>> spark.sql(\"select\
  \ studentId,name,gender  from studentsdob\").show()\n```\n```\n+---------+-------+------+\n\
  |studentId|   name|gender|\n+---------+-------+------+\n|      si1|  Robin|    \
  \ M|\n|      si2|  Maria|     F|\n|      si3|  Julie|     F|\n|      si4|    Bob|\
  \     M|\n|      si6|William|     M|\n+---------+-------+------+\n```\n\n通过观察这两个数据集，请注意\
  \ `studentId` 是可用于连接这两个数据集的列。让我们编写连接这些数据集的查询。\n\n```python\n>>> spark.sql(\"select\
  \ * from studentsdob st join subjects sb on (st.studentId = sb.studentId)\").show()\n\
  ```\n\n运行此查询会产生以下结果：\n\n```\n+---------+-----+------+-------------------+----------+-------+------+\n\
  |studentId| name|gender|        dateofbirth| studentId|subject| marks|\n+---------+-----+------+-------------------+----------+-------+------+\n\
  |      si1|Robin|     M|1981-12-13 00:00:00|       si1|   Java|    81|\n|      si1|Robin|\
  \     M|1981-12-13 00:00:00|       si1| Python|    75|\n|      si2|Maria|     F|1986-06-06\
  \ 00:00:00|       si2|   Java|    83|\n|      si2|Maria|     F|1986-06-06 00:00:00|\
  \       si2| Python|    85|\n|      si3|Julie|     F|1988-09-05 00:00:00|      \
  \ si3|   Ruby|    72|\n|      si3|Julie|     F|1988-09-05 00:00:00|       si3| \
  \  Java|    76|\n|      si4|  Bob|     M|1987-05-04 00:00:00|       si4| Python|\
  \    84|\n|      si4|  Bob|     M|1987-05-04 00:00:00|       si4|    C++|    78|\n\
  +---------+-----+------+-------------------+----------+-------+------+\n```\n\n\
  在进行分析之前，让我们先尝试理解这个查询。从查询中可以看出\n\n```sql\nselect * from studentsdob st join subjects\
  \ sb on (st.studentId = sb.studentId)\n```\n\n在 `studentsdob` 和 `subjects` 表之间使用了一个新的关键字\
  \ `join`。我们为表起了别名。最后还有一个 `on` 子句，用于比较公共列。我们将详细探讨这些 `join` 查询的具体细节。\n\n-   **连接（Joins）：**\
  \ 通过在表之间使用 `join` 关键字来连接表。Spark SQL 支持多种连接类型。最传统和最常用的是内连接、左外连接和右外连接。默认情况下，当提供 `join`\
  \ 关键字时，Spark 执行内连接。对于内连接，Spark 会比较查询中指定列两侧表中每一行的列值。只有满足条件的行才会被选中。左外连接选择左表中的所有行，右表中不匹配的行将被标记为\
  \ null。右外连接选择右表中的所有行，左表中不匹配的行将被标记为 null。\n-   **表别名：** 在本章前面，我们探讨过列别名。同样，也可以为表提供别名。当连接列名在两个表中相同时，这将非常有用。以下没有使用别名的查询会因列名不明确而报错：\n\
  \n```python\n>>> spark.sql(\"select * from studentsdob  join subjects on (studentId\
  \ = studentId)\").show()\npyspark.sql.utils.AnalysisException: \"Reference 'studentId'\
  \ is ambiguous, could be: studentsdob.studentId, subjects.studentId.\n```\n\n在此错误之前，您可能会看到一长串堆栈跟踪信息。但最终，错误指出\
  \ `studentId` 在 `studentsdob` 和 `subjects` 表之间是模糊不清的。\n\n-   **On 子句：** 熟悉关系型数据库\
  \ SQL 的读者可能更倾向于在 `where` 子句中而非 `on` 子句中应用 `join` 条件。虽然在 `where` 子句中比较列在语法上是正确的，但我们不会得到正确的结果。这是因为\
  \ Spark 实现连接的方式。因此，始终将 `join` 条件应用于 `on` 子句。\n\n现在我们对查询有了更好的理解，让我们也分析一下结果以便更好地理解。结果看起来不错，我们得到了想要的内容，但我们可以从这些数据中观察到一些现象。\n\
  \n-   **观察点 1：** 此报告中缺少一些学生。例如，名为 William 的学生没有出现在此输出中。\n-   **观察点 2：** `subjects`\
  \ 数据集中有一个标记为 `studentId si5` 的记录，在此输出中丢失了。\n\n让我们更详细地探讨这些问题。\n\n### 观察点 1\n\n我们无法在输出中看到\
  \ William 的原因是因为 `studentId` 为 `si6` 的 William 不在 `subjects` 数据集中。因此，当 Spark 应用内连接时，它找不到\
  \ `studentId si6`，于是将其从输出中移除。如果报告需要列出所有学生，无论他们是否出现在 subjects 数据集中，我们都需要使用左连接或左外连接。\n\
  \n让我们使用左连接来列出输出。以下是使用左连接的查询：\n\n```python\n>>> spark.sql(\"select * from studentsdob\
  \ st left join subjects sb on (st.studentId = sb.studentId)\").show()\n```\n\n以下是输出结果：\n\
  \n```\n+---------+-------+------+-------------------+---------+-------+-----+\n\
  |studentId|   name|gender|        dateofbirth|studentId|subject|marks|\n+---------+-------+------+-------------------+---------+-------+-----+\n\
  |      si1|  Robin|     M|1981-12-13 00:00:00|      si1|   Java|   81|\n|      si1|\
  \  Robin|     M|1981-12-13 00:00:00|      si1| Python|   75|\n|      si2|  Maria|\
  \     F|1986-06-06 00:00:00|      si2|   Java|   83|\n|      si2|  Maria|     F|1986-06-06\
  \ 00:00:00|      si2| Python|   85|\n|      si3|  Julie|     F|1988-09-05 00:00:00|\
  \      si3|   Ruby|   72|\n|      si3|  Julie|     F|1988-09-05 00:00:00|      si3|\
  \   Java|   76|\n|      si4|    Bob|     M|1987-05-04 00:00:00|      si4| Python|\
  \   84|\n|      si4|    Bob|     M|1987-05-04 00:00:00|      si4|    C++|   78|\n\
  |      si6|William|     M|1980-11-12 00:00:00|     null|   null| null|\n+---------+-------+------+-------------------+---------+-------+-----+\n\
  ```\n\n在输出的最后，请注意 William 的行是存在的，但其 subject 字段为 null。这对于显示学生缺席且未参加考试的场景非常有用且必要。\n\
  \n输出中常常包含一些不需要的列。因此，我们只显示需要的列。例如，为了生成报告，我们将仅选择 `studentId`、`name`、`subject` 和 `marks`\
  \ 列。\n\n运行此查询：\n\n```python\n>>> spark.sql(\"select studentid,name,subject,marks\
  \ from studentsdob st left join subjects sb on (st.studentId = sb.studentId)\").show()\n\
  ```\n\n我们得到以下输出并伴有错误：\n\n```\npyspark.sql.utils.AnalysisException: \"Reference 'studentid'\
  \ is ambiguous, could be: st.studentid, sb.studentid.\n```\n\n您现在应该已经明白，这是因为 `studentId`\
  \ 没有使用别名进行限定。因此，让我们使用别名来限定这些列：\n\n```python\n>>> spark.sql(\"select st.studentid,name,subject,marks\
  \ from studentsdob st left join subjects sb on (st.studentId = sb.studentId)\").show()\n\
  ```\n\n以下是减少列数后的输出：\n\n```\n+---------+-------+-------+-----+\n|studentid|   name|subject|marks|\n\
  +---------+-------+-------+-----+\n|      si1|  Robin|   Java|   81|\n|      si1|\
  \  Robin| Python|   75|\n|      si2|  Maria|   Java|   83|\n|      si2|  Maria|\
  \ Python|   85|\n|      si3|  Julie|   Ruby|   72|\n|      si3|  Julie|   Java|\
  \   76|\n|      si4|    Bob| Python|   84|\n|      si4|    Bob|    C++|   78|\n\
  |      si6|William|   null| null|\n+---------+-------+-------+-----+\n```\n\n###\
  \ 观察点 2\n\n现在让我们看第二个观察点，`subjects` 数据集中有一条记录未出现在输出中。这可能是由多种原因造成的，例如学生数据维护不当、输入 `studentId`\
  \ 值时出现数据录入错误等。所有这些类型的错误在大数据量中都非常常见。这些错误不容忽视，因为它们会引入数据错误并导致不正确的数据报告。因此，让我们尝试使用右外连接将该值包含在报告中。\n\
  \n以下查询使用了右外连接：\n\n```python\n>>> spark.sql(\"select st.studentid,name,sb.studentid,subject,marks\
  \ from studentsdob st right join subjects sb on (st.studentId = sb.studentId)\"\
  ).show()\n```\n\n请注意，左外连接和右外连接之间的唯一区别是将单词 \"left\" 替换为 \"right\"。\n\n以下是输出结果：\n\n\
  ```\n+---------+-----+---------+-------+-----+\n|studentid| name|studentid|subject|marks|\n\
  +---------+-----+---------+-------+-----+\n|      si1|Robin|      si1| Python| \
  \  75|\n|      si3|Julie|      si3|   Java|   76|\n|      si1|Robin|      si1| \
  \  Java|   81|\n|      si2|Maria|      si2| Python|   85|\n|      si3|Julie|   \
  \   si3|   Ruby|   72|\n|      si4|  Bob|      si4|    C++|   78|\n|     null| null|\
  \      si5|      C|   77|\n|      si4|  Bob|      si4| Python|   84|\n|      si2|Maria|\
  \      si2|   Java|   83|\n+---------+-----+---------+-------+-----+\n```\n\n请注意，科目\
  \ C 在输出中是可用的。但 `name` 和 `studentid` 字段为 null。这是因为 `studentId si5` 不在 `students`\
  \ 数据集中。\n\n现在，我们可以使用左外连接或右外连接来显示缺失的科目。但仅输出一个科目用途不大。我们需要能够在一个输出中列出所有缺失的实体。在这种情况下，我们需要使用全外连接，它将基于\
  \ `join` 条件进行匹配，并从两个表中选择行。\n\n让我们使用全外连接应用相同的查询。\n\n```python\n>>> spark.sql(\"select\
  \ st.studentid,name,sb.studentid,subject,marks from studentsdob st FULL OUTER JOIN\
  \ subjects sb on (st.studentId = sb.studentId)\").show()\n```\n\n请注意，全外连接是一个非常昂贵的操作。对大数据量应用全外连接将消耗大量资源和时间。因此，在基于\
  \ SLA 的时间关键型应用中，最好避免使用全外连接。\n\n以下是输出结果：\n\n```\n+---------+-------+---------+-------+-----+\n\
  |studentid|   name|studentid|subject|marks|\n+---------+-------+---------+-------+-----+\n\
  |     null|   null|      si5|      C|   77|\n|      si2|  Maria|      si2| Python|\
  \   85|\n|      si2|  Maria|      si2|   Java|   83|\n|      si4|    Bob|      si4|\
  \    C++|   78|\n|      si4|    Bob|      si4| Python|   84|\n|      si3|  Julie|\
  \      si3|   Java|   76|\n|      si3|  Julie|      si3|   Ruby|   72|\n|      si6|William|\
  \     null|   null| null|\n|      si1|  Robin|      si1| Python|   75|\n|      si1|\
  \  Robin|      si1|   Java|   81|\n+---------+-------+---------+-------+-----+\n\
  ```\n\n请注意，William 和科目 C 现在都出现了。既然我们能够看到这些不一致之处，我们就可以与数据源合作来修复它们。\n\n在应用连接时，我们需要确定可以用于连接的列。如果能够使用数值列，那会更好，因为比较速度更快，且不易出现数据问题。通常，当处理大数据量时，您会发现字符串列不太干净。例如，可能存在尾随空格或前导空格、大小写敏感问题等，这些都会导致连接失败。因此，您需要首先清理这些数据差异，然后再应用连接。\n\
  \n至此，我们已成功完成了连接两个 DataFrame 的任务。\n\n### 配方 6-7：使用 SQL 连接多个 DataFrame\n\n### 问题\n\
  \n您希望连接两个以上的 DataFrame 并查看输出。\n\n### 解决方案\n\n为简单起见，我们使用与学生们相关的简单数据集。到目前为止，我们已经了解了学生和科目。现在我们添加一个新的数据集，称为\
  \ `attendance`（出勤率）。让我们一起来看这三个数据集，如图 6-4 所示。\n\n![图 6-4 新增了出勤率数据集](img/469054_1_En_6_Fig4_HTML.jpg)\n\
  \n该数据集有一个 `attendance` 列，记录了每个学生在每门课程 40 节课中的出勤天数。\n\n既然您现在知道如何使用左连接、右连接和全外连接来处理数据中的错误，我已经清理了数据并进行了简化。\n\
  \n图 6-5 和 6-6 显示了清理后的学生和科目数据。\n\n![图 6-6 学生数据](img/469054_1_En_6_Fig6_HTML.jpg)\n\
  \n![图 6-5 科目数据](img/469054_1_En_6_Fig5_HTML.jpg)\n\n### 工作原理\n\n为了能够开始应用查询，我们首先需要加载出勤率数据。让我们继续加载\
  \ `attendance` 数据集。\n\n以下是加载 `attendance` 数据集的步骤：\n\n```python\n>>> attendanceDf\
  \ = spark.read.csv('attendance.csv',header=True, inferSchema=True)\n>>> attendanceDf.createOrReplaceTempView(\"\
  attendance\")\n>>> spark.sql(\"select * from attendance\").show()\n```\n\n以下是输出结果：\n\
  \n```\n+---------+-------+----------+\n|studentId|subject|attendance|\n+---------+-------+----------+\n\
  |      si1| Python|        30|\n|      si3|   Java|        22|\n|      si1|   Java|\
  \        34|\n|      si2| Python|        39|\n|      si3|   Ruby|        25|\n|\
  \      si4|    C++|        38|\n|      si5|      C|        35|\n|      si4| Python|\
  \        39|\n|      si2|   Java|        39|\n|      si6|   Java|        35|\n+---------+-------+----------+\n\
  ```\n\n在生成最终报告之前，让我们先合并所有三个表以验证连接。以下是连接多个 DataFrame 的查询：\n\n```python\n>>> spark.sql(\"\
  select * from studentsdob st Join subjects sb on (st.studentId = sb.studentId) Join\
  \ attendance at on (at.studentId = st.studentId)\").show()\n```\n\n此查询将第三个数据集作为现有连接的延续进行连接。类似地，您可以用相同的方式连接任意数量的表。\n\
  \n以下是输出结果：\n\n```\n+---------+-------+------+-------------------+---------+-------+-----+---------+-------+----------+\n\
  |studentId|   name|gender|        dateofbirth|studentId|subject|marks|studentId|subject|attendance|\n\
  +---------+-------+------+-------------------+---------+-------+-----+---------+-------+----------+\n\
  |      si1|  Robin|     M|1981-12-13 00:00:00|      si1|   Java|   81|      si1|\
  \   Java|        34|\n|      si1|  Robin|     M|1981-12-13 00:00:00|      si1| \
  \  Java|   81|      si1| Python|        30|\n|      si1|  Robin|     M|1981-12-13\
  \ 00:00:00|      si1| Python|   75|      si1|   Java|        34|\n|      si1|  Robin|\
  \     M|1981-12-13 00:00:00|      si1| Python|   75|      si1| Python|        30|\n\
  |      si2|  Maria|     F|1986-06-06 00:00:00|      si2|   Java|   83|      si2|\
