  #### 步骤 2-1-6：将 Hadoop 二进制文件移动到安装目录


  我们的安装目录名为 `allBigData`。下载的软件位于 `hadoop-2.7.7.tar.gz` 中，这是一个压缩目录。因此，我们首先需要解压它。我们可以使用
