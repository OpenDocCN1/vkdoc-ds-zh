  ## Hadoop 简介


  Hadoop 是一个解决大数据问题的分布式可扩展框架。Hadoop 由 Doug Cutting 和 Mark Cafarella 开发。Hadoop 是用 Java
  编写的。它可以安装在商用硬件集群上，并在分布式系统上水平扩展。Hadoop 的开发灵感来自谷歌的两篇研究论文：


  *   Jeffrey Dean 和 Sanjay Ghemawat 的《MapReduce：大规模集群上的简化数据处理》

  *   Sanjay Ghemawat、Howard Gobioff 和 Shun-Tak Leung 的《谷歌文件系统》


  在商用硬件上工作使其非常具有成本效益。如果我们在商用硬件上工作，故障是不可避免的问题。但 Hadoop 为数据存储和计算提供了一个容错系统。这种容错能力使得 Hadoop
  非常受欢迎。


  Hadoop 有两个组件（见图 1-2）。第一个组件，Hadoop 分布式文件系统（HDFS），是一个分布式文件系统。第二个组件是 MapReduce。HDFS
  用于分布式数据存储，而 MapReduce 用于对存储在 HDFS 中的数据进行计算。


  ![../images/469054_1_En_1_Chapter/469054_1_En_1_Fig2_HTML.png](img/469054_1_En_1_Fig2_HTML.png)


  图 1-2


  Hadoop 组件


  ## HDFS 简介


  HDFS 用于以分布式和容错的方式存储大量数据。HDFS 是用 Java 编写的，运行在商用硬件上。其灵感来自谷歌关于谷歌文件系统（GFS）的研究论文。它是一种一次写入、多次读取的系统，对处理大量数据非常有效。


  HDFS 有两个组件——NameNode 和 DataNode。这两个组件是 Java 守护进程。NameNode 维护分布在集群上的文件的元数据，作为许多 DataNode
  的主节点。HDFS 将一个大文件分割成小数据块，并将这些数据块保存在不同的 DataNode 上。实际的文件数据块驻留在 DataNode 上。


  HDFS 提供了一组类似于 UNIX shell 的命令。但我们也可以使用 HDFS 提供的 Java 文件系统 API 来更精细地处理大型文件。容错是通过数据块的复制来实现的。


  我们可以使用并行单线程进程访问 HDFS 文件。HDFS 提供了一个非常有用的工具，称为 `distcp`，它通常用于以并行方式将数据从一个 HDFS 系统传输到另一个系统。它使用并行的
  map 任务来复制数据。我们可以在图 1-3 的简单示意图中看到 HDFS 的组件。


  ![../images/469054_1_En_1_Chapter/469054_1_En_1_Fig3_HTML.png](img/469054_1_En_1_Fig3_HTML.png)


  图 1-3


  HDFS 的组件


  ## MapReduce 简介


  MapReduce 计算模型首次出现在谷歌的一篇研究论文中。该研究论文在 Hadoop 中被实现为 Hadoop 的 MapReduce。Hadoop 的 MapReduce
  是 Hadoop 框架的计算引擎，它对 HDFS 中的分布式数据进行计算。MapReduce 已被发现在商用硬件的分布式系统上具有水平可扩展性。它也能向上扩展以解决大型问题。在
  MapReduce 中，问题解决方案被分成两个阶段——Map 阶段和 Reduce 阶段。在 Map 阶段，处理数据块；在 Reduce 阶段，对 Map 阶段的结果进行聚合或归约操作。Hadoop
  的 MapReduce 框架是用 Java 编写的。


  MapReduce 是一种主从模型。在 Hadoop 1 中，这种 MapReduce 计算由两个守护进程管理——Jobtracker 和 Tasktracker。Jobtracker
  是处理众多 Tasktracker 的主进程。Tasktracker 是 Jobtracker 的从属进程。但在 Hadoop 2 中，Jobtracker 和
  Tasktracker 被 YARN 取代。


  Hadoop 的 MapReduce 框架是用 Java 编写的。我们可以使用该框架提供的 API 并用 Java 编写我们的 MapReduce 代码。Hadoop
  streaming 模块使掌握 Python 和 Ruby 的程序员也能编写 MapReduce 程序。


  MapReduce 算法有很多用途。许多机器学习算法被实现为 Apache Mahout，它作为 Pig 和 Hive 在 Hadoop 上运行。


  但是 MapReduce 对于迭代算法并不非常适用。在每个 Hadoop 作业结束时，MapReduce 会将数据保存到 HDFS，并在下一个作业时再次读取。我们知道，读写文件是代价高昂的操作。Apache
  Spark 通过提供内存数据持久化和计算，缓解了 MapReduce 的缺点。


