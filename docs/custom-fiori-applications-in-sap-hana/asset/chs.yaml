- "# 单一产品品牌分析\n\n我想分析的一个单一产品品牌，是生产电动工具、建筑工具和工具存储设备等产品的品牌。这些工具质量非常高，且使用寿命极长。它们是大多数建筑专业人士的选择，处于其行业产品的高端定位。十多年前我结婚时，为了房屋装修项目购置了各种类型的工具。当我开始学习如何完成一些小型家庭项目时，我的第一套工具表现得非常出色。随着我积累经验并进一步了解工具质量，我意识到，合适的工具才能正确完成工作。是的，我本可以购买更便宜的工具，但那和使用正确工具的效果完全不同。我开始投资更多这种黑黄配色的工具。我最新入手的一套工具是钻头和冲击钻的套装，配有一个电池充电器和两块电池。与我的旧工具相比，历经多年发展，新工具变得更轻、动力更强、电池续航时间得到改善，而且一些不同的工具可以共享电池。在我看来，这家公司开展了广泛的用户体验研究、工具设计以及对工具进行了大量改进，从而实现了客户满意度、提高了产品采用率并获得了回头客；所有这些，都是大多数公司期望看到的。所有这些令人满意的举措，为这家公司带来了巨大的投资回报率。我不介意多花一点钱来获得高质量的工具。正如你在这段文字中所看到的，其中涉及了可能的用户画像（建筑专业人士）、关于客户如何使用工具的客户研究，以及识别这些用户的一些痛点，例如工具重量、电池续航时间以及工具部件之间的兼容性。所有这些概念都是产品从设计到开发和生产过程中的一部分。SAP\
  \ 也推荐了这样一个流程；它被称为设计思维，这是一个经过验证的流程，贯穿于产品创建的整个生命周期。设计思维流程始于发现阶段，在此阶段，各种事物被呈现和分析，并在创建产品时记录大量笔记；设计阶段包括多种呈现创意和制作原型的方法，以观察该创意将如何被使用，并被团队中的许多协作者观察，其目的是提供反馈并捕捉用户将如何使用该产品：基本上是全员参与。开发阶段是人员创建产品，向客户方展示产品以获取反馈，并在多次迭代中进行改进；最后是交付，这是流程中回报丰厚的部分，此时产品离开团队并投入生产使用。\n\
  \n## Fiori 的五项设计原则\n\nFiori 用户体验有五项设计原则，必须应用于所有应用程序，如图 1-8 所示：\n\n![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig8_HTML.jpg](img/502765_1_En_1_Fig8_HTML.jpg)\n\
  \n*图 1-8*  \n*Fiori 的五项设计原则*\n\n1. 基于角色\n2. 一致性\n3. 简洁\n4. 响应式\n5. 愉悦\n\n**基于角色**\
  \ 与设计原则中的其他特性同等重要；然而，在我看来，它是最重要的一个，因为它似乎是大多数客户真正要求的功能。基于角色的特性可以将控件属性设置为只读、启用/禁用可见性，或允许用户提供输入。Fiori\
  \ 应用程序的另一个基于角色的用例是，公司内不同部门的用户能够看到应用程序的不同部分；例如，人力资源部门的用户与财务部门的用户，以及其他部门的用户相比，对同一个应用程序会有不同的视图。此外，这些角色可以与非\
  \ Fiori 应用程序中的 Active Directory 角色进行比较。在设计 Fiori 应用程序时，你可以将此属性视为一种方式，为拥有读写权限的用户与另一个只能读取某些数据而无法交互的用户展示同一个应用程序。如果你能理解只读与读写之间的区别，那么你就在思考基于角色的特性。当\
  \ Fiori 应用程序被添加到 SAP Fiori 启动板中时，角色还可以允许或阻止用户访问 Fiori 应用程序。在本书中，我们不会深入讲解启动板的配置；相反，我们将在第\
  \ 5 章中将我们的 Fiori 应用程序部署到 SAP HANA XSA 环境中。\n\n**一致性** 是设计原则的一部分，它强制要求应用程序的设计在其所做的每一件事以及其行为方式上都合乎逻辑。在旧的\
  \ SAP R/3 中，某些事务需要输入非常多的参数，以至于用户有时不明白为什么应用程序需要它们；有时，用户甚至需要点击一个元素才能显示附加信息。此外，一致性原则在为这些业务场景设计新软件时，会带来额外的流程改进。这个特性可以被想象成一个向导，或者一个带有默认过滤器的智能表格，这些过滤器显示在智能过滤器栏中，或者当在按钮中使用\
  \ `type` 属性来显示接受（显示为绿色）、拒绝（显示为红色）或默认（默认颜色）时。其他 UI5 控件可能使用 `state` 属性来显示其他状态，例如警告、启用或禁用，仅举几例。\n\
  \n**简洁** 是我最喜欢的特性之一，因为作为 SAP 世界中的开发人员，某些 SAP 事务非常复杂，即使我们不知道某些字段的用途，也需要提供大量的字段。这里的简洁特性指的是尽量减少点击次数，让用户保持更高的生产力，并使他们的流程尽可能高效。允许用户完成一项任务时，在一个流程或事务中应包含的最大点击次数应少于三次。\n\
  \n\n\n**响应式**指的是传统软件必须针对不同平台进行编写；然而，SAP Fiori 利用了软件的响应式特性，只需编写单一的代码库，就能让软件在不同屏幕尺寸和设备上自适应，且从技术角度来说几乎不需要额外投入。Fiori\
  \ 应用的响应式特性能够立即为企业带来投资回报，因为它们可以同时为办公环境或生产车间开发这些应用。出色的响应式应用还能在移动浏览器中运行，让用户随时了解业务情况，如图\
  \ 1-2 所示。`SAP Web IDE` 和 `SAP Build` 工具都具备“设备预览”功能，您可以立即看到设计在不同设备上的显示效果。\n\n**愉悦性**意味着，如果用户喜欢某个应用，他们很可能会再次回来完成工作或使用它。美观的应用更有可能提高生产力，让用户保持愉悦心情，这就是为什么包含这一原则如此重要。在设计新软件时，让用户接受它是非常困难的任务。用户会抱怨，并声称当前系统虽然低效但也能工作，从而抵制变革。从过往在其他平台（设计自由度极高）的经验来看，缺乏这部分框架也会让工作变得更加繁琐和复杂。\n\
  \n通过对比图 1-9 和图 1-10，可以直观地看到 Fiori 的五大设计原则。图 1-9 展示了一个 SAP GUI 事务，而图 1-10 则展示了一个带有对象页面和图标标签栏的\
  \ Fiori 应用。\n\n![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig10_HTML.jpg](img/502765_1_En_1_Fig10_HTML.jpg)\n\
  \n图 1-10\n\nSAP Fiori 标准应用\n\n![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig9_HTML.jpg](img/502765_1_En_1_Fig9_HTML.jpg)\n\
  \n图 1-9\n\nSAP GUI\n\n## 为 Fiori 应用准备好您的系统\n\n虽然理解 Fiori 设计、用户体验以及创建优秀产品的所有初始概念是必要的，但作为开发者的您可能想知道何时才能进入系统，开始原型设计和开发一些\
  \ Fiori 应用。\n\nFiori 提供了一套样板文件，助您为 Fiori 应用的世界做好准备。您可以在 [`https://experience.sap.com/fiori-design-web/downloads/#top`](https://experience.sap.com/fiori-design-web/downloads/%2523top)\
  \ 找到这些样板文件。这些样板包含了模板、控件、颜色、字体、图标以及您开始设计所需的一切。无论是 Mac 用户还是 Windows 用户，都有相应的样板和程序可用。我不会深入设计方面，因为我更熟悉开发领域。当设计完成后，设计团队的原型图和其他交付成果就可以移交给开发人员，以便他们开始开发。\n\
  \n有多种工具可用于开发 Fiori 应用。如图 1-11 所示，诸如 `SAP Web IDE`（可在 SAP 云平台、本地部署或 Web IDE 个人版中找到）和\
  \ `Business Application Studio` 等工具，都用于此类 Fiori 开发。\n\n![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig11_HTML.jpg](img/502765_1_En_1_Fig11_HTML.jpg)\n\
  \n图 1-11\n\nSAP Web IDE\n\n`Business Application Studio` 是用于 Fiori 和 HANA 开发的最新工具，它是\
  \ `Visual Studio IDE` 的一组插件（也可在 SAP 云平台上找到：位于 `Cloud Foundry 平台` ➤ `订阅` ➤ `SAP Business\
  \ Application Studio` 下，然后点击订阅），如图 1-12 所示。如果您无法访问，请检查您的用户是否具有 `Business Application\
  \ Studio 开发者` 角色模板。\n\n![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig12_HTML.jpg](img/502765_1_En_1_Fig12_HTML.jpg)\n\
  \n图 1-12\n\nSAP Business Application Studio\n\n如果您决定使用 `Visual Studio Code IDE`，还可以获得一些\
  \ SAP Fiori 插件。\n\n这些插件可以在扩展中找到，如图 1-13 所示。\n\n![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig13_HTML.jpg](img/502765_1_En_1_Fig13_HTML.jpg)\n\
  \n图 1-13\n\n适用于 `Visual Studio Code` 的 SAP Fiori 插件\n\n既然我已经介绍了开发工具，那么现在重要的是了解如何开始为您的自定义\
  \ Fiori 应用进行开发。\n\nFiori 应用构建于 `SAPUI5` JavaScript 库之上。`SAPUI5` JS 库是一套由 SAP 构建的\
  \ HTML5 控件和 CSS3 样式，用于创建 Fiori 应用。所有拥有付费许可证的 SAP 用户都可以访问并创建这些 `SAPUI5` / Fiori 应用。另一方面，如果您不是\
  \ SAP 客户，但希望使用 UI5 构建类似 SAP 的 Fiori 应用，还有一个名为 `OpenUI5` 的开源版本。这两个库的一些差异在表 1-1 中已突出显示。\n\
  \n表 1-1\n\n`SAPUI5` 与 `OpenSAPUI5` 对比\n\n| | `SAPUI5` | `OpenUI5` |\n| --- | ---\
  \ | --- |\n| 库类型 | 对 SAP 客户可用 | 开源库 |\n| 许可证类型 | SAP | Apache 2.0 |\n| 运行平台 | SAP\
  \ HANA、SAP 云平台 或 SAP NetWeaver 前端服务器 | 任意 Web 服务器 |\n| 网站 | [`https://sapui5.hana.ondemand.com/`](https://sapui5.hana.ondemand.com/)\
  \ | [`https://openui5.org/`](https://openui5.org/) |\n| 应用类型 | SAP 前端服务器• SAP Fiori\
  \ 应用• SAP Fiori 自由式应用 SAP HANA 扩展应用服务（XS 引擎）• 自定义 Fiori 应用 | 任意 Web 应用或 Web 组件 |\n\
  | 开发者 | SAP | SAP 及开源社区 |\n\n\n在之前的表格对比之外，我们不妨花点时间了解一下 `SAPUI5 SDK`（软件开发工具包）页面，因为我将着重介绍其中重要的内容，以及那些试图进入\
  \ `SAPUI5` / Fiori 开发的读者应该注意的事项。\n\n在图 1-14 和图 1-15 中，我们可以分别看到 `SAPUI5 SDK` 和 `OpenUI5\
  \ SDK` 页面。它们具有相似的外观与风格，以及相同的结构；再次说明，这些不同的库分别用于 SAP 许可的开发或 UI5 框架的开源等价物。\n\n![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig15_HTML.jpg](img/502765_1_En_1_Fig15_HTML.jpg)\n\
  \n图 1-15\n\nOpen UI5 SDK\n\n![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig14_HTML.jpg](img/502765_1_En_1_Fig14_HTML.jpg)\n\
  \n图 1-14\n\nSAPUI5 SDK\n\n在图 1-16 中，你可以看到 `SAPUI5 SDK` 页面。页面顶部有一些章节（选项卡），内容被划分其中。\n\
  \n### 文档\n\n在本节中，读者可以找到与 `SAPUI5` 应用程序相关的所有重要文档，内容涵盖从创建第一个 Fiori 应用程序的入门教程，到深入理解\
  \ Fiori 应用程序的深层概念。\n\n本节中其他值得记住的重要信息包括：版本特性、版本支持、如何开发自定义控件、主题、SAP Fiori CSS 类以及浏览器兼容性等。\n\
  \n花时间学习入门教程部分非常重要，因为它展示了如何从头到尾构建一个 Fiori 应用程序。它还展示了使用 `MVC`（模型-视图-控制器）模式的不同场景。无论你是构建新应用程序还是扩展现有\
  \ SAP 交付的应用程序，`SDK` 的这一部分都很有用，并且建议熟悉它。\n\n![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig16_HTML.jpg](img/502765_1_En_1_Fig16_HTML.jpg)\n\
  \n图 1-16\n\nSAPUI5 SDK 文档页面\n\n### API 参考\n\nAPI 参考非常有帮助，因为它解释了所有 `SAPUI5` 控件：控件被分解为属性、事件、构造函数、关联、聚合及其基数。如图\
  \ 1-17 所示。\n\n在这个 `SAPUI5 SDK` 部分中，开发人员可以全面了解每个控件的所有必要属性、继承关系和行为。此外，本节还根据命名空间（`sap.m`、`sap.apf`、`sap.ui`、`sap.f`...）对\
  \ `SAPUI5` 控件进行了分类。\n\n当你决定开始构建 Fiori 应用程序，并且需要在 `XML` 视图中使用来自不同命名空间的控件时，请确保包含对这些命名空间的引用。遗漏命名空间是开发人员开始涉足\
  \ `SAPUI5` 时常犯的错误。另一个常见的疏忽是缺乏对可用属性的理解；花些时间阅读 API 参考，熟悉一些常用控件，例如表格、按钮和输入字段。\n\n![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig17_HTML.jpg](img/502765_1_En_1_Fig17_HTML.jpg)\n\
  \n图 1-17\n\nSAPUI5 SDK API 参考\n\n![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig18_HTML.jpg](img/502765_1_En_1_Fig18_HTML.jpg)\n\
  \n图 1-18\n\nSAPUI5 SDK 示例页面\n\n### 示例\n\n是的，SDK 页面提供了示例应用程序和代码片段，开发人员可以快速在用户界面上看到它们，如图\
  \ 1-18 所示。随着开发人员学习得越来越多，某些代码片段会很容易记住，但在开发新应用程序需要新控件时，知道从哪里获取这些控件仍然非常有帮助。此选项卡中的重要部分包括：\n\
  1.  应用程序左侧显示的控件导航列表\n2.  列表项中展示的不同场景数量\n3.  所使用的 `SAPUI5` 库的版本（屏幕右上角）\n4.  代码片段图标，显示为\
  \ `{ = }`，位于“更改版本”图标和放大镜图标下方（图 1-18 的右上角）\n\n![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig19_HTML.jpg](img/502765_1_En_1_Fig19_HTML.jpg)\n\
  \n图 1-19\n\nSAPUI5 SDK 演示应用程序\n\n### 演示应用\n\nSAP 提供了一些演示应用程序，如图 1-19 所示，以便开发人员可以看到已完成的工作以及实现方式。如果需要，他们可以获取代码库，以防需求与演示应用程序类似。我强烈建议首先访问并学习入门教程应用程序，以全面了解\
  \ SAP Fiori 应用程序中存在的所有动态部分。如果你能跟随此应用程序并理解众多部分如何协调配合，那么无论是修改现有 Fiori 应用程序还是从头创建新应用程序，都会变得非常容易。\n\
  \n请确保在此演示应用部分投入足够时间，尤其在图 1-19 所示的入门教程中。\n\n![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig20_HTML.jpg](img/502765_1_En_1_Fig20_HTML.jpg)\n\
  \n图 1-20\n\nSAPUI5 SDK 工具页面\n\n### 工具\n\n本部分指出了构建 SAP Fiori 应用程序所需的主要工具，如图 1-20\
  \ 所示。这些工具用于开发（`SAP Web IDE` 或 UI5 工具）、调试（`UI5 inspector`）、主题设计器（如果需要自定义主题）以及图标。接下来对这些工具进行补充说明。\n\
  \n在图 1-20 中，你可以看到主要工具的说明以及了解更多相关信息的链接。\n\n![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig21_HTML.jpg](img/502765_1_En_1_Fig21_HTML.jpg)\n\
  \n图 1-21\n\nSAP Cloud Platform 自定义主题设计器\n\n### SAP Web IDE\n\n这是 SAP Fiori 应用程序的主要开发工具。它是一个基于浏览器的工具，用于开发\
  \ Web 和数据库应用程序。此类工具有多个版本，因此请检查开发所需的版本和许可证要求。`SAP Web IDE` 可以本地安装（`SAP Web IDE` 个人版），在\
  \ SAP Cloud Platform 上有一个名为 `SAP Web IDE Full stack` 的版本，同时还有一个适用于本地部署开发的版本，也可以通过\
  \ `SAP HANA Express` 版访问。\n\n### UI 主题设计器\n\n如果待开发的 `SAPUI5` 应用程序需要自定义主题，并且该 Fiori\
  \ 应用程序不遵循标准的 Fiori 概念，则建议使用此工具，如图 1-21 所示。在 SAP Cloud Platform（或 SAP Cloud Platform\
  \ 试用版）中查看此工具，看看是否能设计出自己的自定义品牌主题。此工具非常有帮助，因为它允许开发人员重用类名，并且开发人员可以动态更改颜色，快速查看如果使用自定义主题作为最终产品，他们的应用程序可能是什么样子。\n\
  \n\n![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig22_HTML.jpg](img/502765_1_En_1_Fig22_HTML.jpg)\n\
  \n图 1-22\n\nUI5 工具 CLI\n\n1.  **UI5 工具**\n\n这是一个命令行界面(CLI)工具，如图 1-22 所示，该工具利用`Node\
  \ J`S 和`NPM`（Node 包管理器）加速应用程序的开发。CLI 工具在 Web 开发中非常流行，因此`SAPUI5`也提供了该工具也就不足为奇了。\n\
  \n![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig23_HTML.jpg](img/502765_1_En_1_Fig23_HTML.jpg)\n\
  \n图 1-23\n\nSAPUI5 检查器\n\n1.  **UI5 检查器**\n\n该工具是一个 Chrome 浏览器附加组件，允许开发者在应用程序于浏览器中运行时，对其中的`SAPUI5`控件进行调试和分析。该工具如图\
  \ 1-23 所示。此工具可显示应用程序内控件的层级结构，以及分配给它的所有`css`类和任何其他属性/特性。在尝试调试特定控件的行为或在应用程序中查找内容时，此工具非常有用。由于不同浏览器的行为和显示方式不同，在比较某些控件的渲染效果以及它们在不同浏览器上的表现时，可以使用此工具。\n\
  \n![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig24_HTML.jpg](img/502765_1_En_1_Fig24_HTML.jpg)\n\
  \n图 1-24\n\nSAPUI5 图标浏览器\n\n1.  **图标浏览器**\n\n到目前为止，这是我最喜欢的工具，因为它能让我在同一框架内找到可用的图标。有时，在其他技术框架中，开发者需要集成额外的`js`库来获取图标，而在`SAPUI5`中，图标库已经包含在内。该工具允许开发者搜索图标，并且图标可以以多种形式呈现，例如不同的大小。此外，图标还带有一些关键词标记，如图\
  \ 1-24 所示，在此工具中搜索时可以轻松找到它们。\n\n## 理解元素、布局和页面模板\n\n随着我们对 Fiori 的深入了解，理解 Fiori 应用程序是如何设计和开发的变得至关重要。如果你以前从未开发过\
  \ Fiori 应用程序，你很可能会先看一些示例，然后尝试模仿它们。这是学习新技能或技术，或者第一次尝试新事物时的正常过程。经验丰富的开发者也会寻找构成某种应用程序的模式和组件。我们试图理解页面由哪些元素组成，使用了哪些控件，并通过某些\
  \ API 或文档熟悉它们。开发 Fiori 应用程序时也是如此。\n\n**SAPUI5 控件** 包含了 Web 应用程序中最常见的控件，例如输入字段、标签、组合框、表格和复选框等等。请访问`SAPUI5\
  \ SDK`页面，以了解更多关于不同类型控件的信息、它们的文档及其代码示例。\n\nSAP Fiori **元素**，以前称为智能模板，为您提供了 Fiori\
  \ 应用程序中最常用的一套模板。其中一些模板包括概览页面、列表报表、工作清单和对象页面。此外，其中一些 Fiori 元素几乎不需要或完全不需要开发，它们是元数据驱动的应用程序。本书将展示如何使用`MVC`框架、`XML`视图和控制器中的\
  \ JavaScript 编程语言来创建这些应用程序。\n\n![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig25_HTML.jpg](img/502765_1_En_1_Fig25_HTML.jpg)\n\
  \n图 1-25\n\n概览模板\n\n1.  **概览页面：** 此模板包含可能带有一些重要指标（如分析型卡片）的智能磁贴，允许用户快速查看并导航以查看更多详细信息。顾名思义，概览页面的目的是无需深入到应用程序的每个区域/页面来查找系统问题，就能快速提供重要信息的概览。这种类型的页面/模板用作应用程序的入口点，如图\
  \ 1-25 所示。该模板展示了卡片、磁贴、列表和一些图表，以便快速可视化。一张图胜过千言万语，这种类型的模板正是做到了这一点。它不会让用户感到不知所措，并且清晰地指明了要寻找的目标。\n\
  \n![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig26_HTML.jpg](img/502765_1_En_1_Fig26_HTML.jpg)\n\
  \n图 1-26\n\n工作清单模板\n\n1.  **工作清单：** 这种类型的页面/模板用于向用户分配工作，并且通常允许用户深入查看详细信息以执行某些操作。它是一个从简单列表到详情页的页面。该模板展示了一个列表、一个导航以及一个可以查看项目详情并对其采取操作的详情页面。图\
  \ 1-26 展示了这样一个模板。\n\n![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig27_HTML.jpg](img/502765_1_En_1_Fig27_HTML.jpg)\n\
  \n图 1-27\n\n列表报表模板\n\n1.  **列表报表：** 这种类型的模板与工作清单模板非常相似；然而，此模板通常用于包含更多项目的数据集，用户可以通过包含筛选条件来最小化显示的记录数量。该模板还允许进行多选，以便对特定记录执行一组操作。与工作清单相比，它通常用于向用户提供数据集更高层级的可见性，而工作清单通常用于专属于特定用户的较小数据集。该模板如图\
  \ 1-27 所示。\n\n![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig28_HTML.jpg](img/502765_1_En_1_Fig28_HTML.jpg)\n\
  \n图 1-28\n\n对象视图模板\n\n\n\n## 对象页面\n\n**对象页面：** 此模板用于提供特定记录的详细信息。它作为详细步骤使用，当用户从列表项点击导航并进入此处时生效。该模板用于提供关于某条记录的具体细节，包含标题级别的数据属性，如对象标题、编号、对象图片、名称、状态以及对象属性。\n\
  \n此模板还可以包含选项卡，用于分隔并逻辑地显示与当前项相关的特定子类别的数据。某些 Fiori 应用在需要提供记录的详尽视图时会使用此类模板。如图 1-28\
  \ 所示。\n\n**布局** 从宏观上看，是供开发人员在屏幕上放置内容的占位符。布局有多种类型：例如，用于全屏的动态布局，如图 1-29 所示；以及具有两列或三列的灵活列布局，如图\
  \ 1-30 所示。\n\n![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig30_HTML.jpg](img/502765_1_En_1_Fig30_HTML.jpg)\n\
  \n图 1-30\n\n包含两列或三列的灵活布局\n\n![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig29_HTML.jpg](img/502765_1_En_1_Fig29_HTML.jpg)\n\
  \n图 1-29\n\n全屏布局\n\n**页面方案** 指的是如何将元素放置在布局内，以构建更完整的应用程序。根据所选布局的不同，布局内部可能会添加一个或多个页面方案。全屏布局可以包含一种类型的元素，例如工作清单。\n\
  \n灵活列布局通常由主/详细模板组成，其中**主（UI）**视图包含用于导航的列表，而模板的详细侧则显示与从 **(UI)** 视图中选择的项相关的详情。与两列的灵活列布局非常相似，三列布局通常用于主-详细-详细场景。采用这些两列或三列布局的原因，是为了避免应用中的多次导航，让用户始终专注于同一个屏幕，同时在各个布局上呈现相关信息。\n\
  \n强调 **智能控件** 作为 Fiori 应用中使用组件的一部分非常重要。智能控件是指当 Fiori 应用中存在 OData 服务时，利用该服务的元数据来构建的控件。智能控件包括智能过滤器、用于包含可见字段的控件配置以及导出到\
  \ Excel 等功能，仅举几例，如图 1-18 所示。智能过滤器栏可以生成智能输入字段控件，并提供应用程序过滤功能，而无需编写一行代码。它完全由框架管理。如果您的应用程序需要对智能过滤器栏进行自定义过滤或额外增强，则可以利用提供的功能，并自行添加自定义处理程序作为代码的自定义扩展。这些智能控件的大部分配置是在将控件放入\
  \ XML 视图时完成的，并包含最终绑定到 OData 服务的控件属性。\n\n**OData** 服务在 Fiori 应用中至关重要，因为这些服务用于通过 HTTP(s)\
  \ 从 Web 客户端暴露或消费数据。OData 是一种协议，在 Fiori 应用以及其他 Web 技术中得到了广泛应用。SAP Fiori (UI5) 控件主要使用两个不同版本的\
  \ OData：v2 和 v4。OData 以 atom XML 和 JSON 格式返回数据。OData 服务可以根据 OData 协议中记录的 OData 语法规则进行查询。在创建某些\
  \ Fiori 应用程序时，也存在向导来包含 OData 端点（URL），该向导会包含 OData 模型和元数据文件，并准备好应用程序以消费此类服务。OData\
  \ 将在第 2 章中深入讨论。\n\n## 结论\n\n在结束我们第一章的内容时，我希望您能理解为什么 Fiori 设计是开始任何应用程序开发之前的一项重要任务，并且是软件产品开发成功的基本支柱。\n\
  \n在最初设计产品时投入更多时间，将减少开发团队与产品所有者或客户之间的不必要迭代。在项目初期付出更大的努力将使产品更成功，并提高其投资回报率。第一章中的第二个学习点是熟悉\
  \ SAP Fiori 原则和 SAP Fiori 概念，例如组件、元素、布局和页面方案，以便向客户推荐它们，并在设计和开发 SAP Fiori 应用程序时加以应用。最后，理解\
  \ SAP Fiori 应用之间的集成点，以及了解某些相关技术的预期，对于让您的团队准备好迎接一段有趣而激动人心的旅程至关重要。熟悉各种开发工具，进行比较，并选择正确的工具，这样您就能知道在您的场景中何时使用它们。感谢您完成本章，事不宜迟，请准备好进入下一章，在下一章中，我们将深入探讨\
  \ OData 协议和 RESTful API。\n\n"
- '# 2. 在 Fiori 应用中消费数据


  欢迎来到第 2 章！本章将解释所有关于数据和数据模型的内容。您将学习如何消费数据，如何在数据不存在时模拟数据，如何从本地 JSON 模型模拟数据，以及如何暴露数据。通过
  OData（由 Microsoft 创建并被他方采用的开放数据协议）和 JSON（JavaScript 对象表示法）模型消费数据模型是 SAP Fiori 中的关键概念。有时，需要从您的
  SAP Fiori 应用程序中消费外部 REST API（**R**epresentational **S**tate **T**ransfer，具象状态传输）服务。本章将从
  SAP Fiori 应用程序的角度，以及从一个名为 `POSTMAN` REST 客户端的单元测试工具的角度，探讨所有这些要点。该工具可以在开发前端应用的同时并行使用，但您可能尚未准备好实现所有必要的
  XML 视图和 JavaScript 代码以进行数据集成。准备好深入技术概念，让我们一起学习吧。




  ## 理解数据并在数据不可用时进行模拟


  在第 1 章中，本书描述了使用不同工具设计应用程序并与关键用户协作以创建成功设计的多种方法。在设计步骤中，有时用户会提供包含数据样本的电子表格，以便设计人员和开发人员能够在需要表示数据列表、单条数据或通过用户交互从屏幕输入的数据时进行可视化。在本章中，本书将逐步从设计概念过渡到更好地理解数据。理解数据非常重要，因为它适用于后端数据库系统，也适用于创建前端应用程序，使其能够高效运行，并仅呈现所开发应用程序/产品中的相关数据。在设计和创建应用程序时，理解数据是一个关键组成部分。


  开发人员有时会想知道，如果后端系统没有数据，他们应该如何开始开发应用程序。有时，开发人员会通过在应用程序中模拟硬编码的 `JSON` 对象来开始工作。幸运的是，对于大多数企业项目来说，数据通常来自
  ERP（企业资源规划）系统，并且有大量数据可供使用。这些系统中的数据模型通常创建为 CDS（核心数据服务视图，如果来自 SAP 或 SAP HANA），并作为
  `OData` 服务端点公开，这些端点可以轻松地从 `REST` 客户端或应用程序中使用。


  `CDS` 是 SAP 创建的一种脚本语言，允许开发人员创建设计时对象（例如实体（表）和数据模型（视图）），目的是在更接近数据库的位置完成大部分工作。`CDS`
  视图可能包含由 `UI5` 控件利用的附加注释，以减少前端编码量，并且这些数据注释由后端控制。即使后端系统表中没有数据，但只要数据模型已创建，`OData` 服务就会生成一个元数据文件，该文件提供有关端点的信息，其中公开了数据模型，并且已知不同数据实体的数据类型。此外，`OData`
  服务有时可能包含供应用程序使用的数据注释。


  让我将上一段分解为更小的部分：


  **表 2-1** OData V2 与 OData V4 对比


  | OData V2 | OData V4 |

  | --- | --- |

  | 微软开放规范承诺 (OPS) | 已通过 OASIS 和 ISO 批准 |

  | 数据以 atom/XML（默认）或 JSON 格式公开 | 数据以 JSON（默认）格式公开，XML 为可选 |

  | | `DateTime` 数据类型已弃用 |

  | | 改进了数据类型，例如 `Edm.Time` 已被 `Edm.Duration` 和 `Edm.Time of Day` 取代 |

  | 日期格式不存在 | 已添加 `Edm.Date` |

  | | `Edm.Float` 已被淘汰 |

  | | 允许同步请求 |


  ## OData


  这是一种（开放数据）协议/技术，可生成可由 Web 应用程序或其他 REST 客户端轻松使用的 `OData` 服务。`OData` 在 SAP Fiori 中被广泛采用。它是在
  SAP Fiori 应用程序中公开和使用数据的主要且首选方式。它也存在于其他技术栈中。`OData` API（也称为 `OData` 服务）已发布多个版本。最常见的版本是
  `OData v2`。`OData` 服务的最新版本是 `OData v4`。


  这两个版本具有以下相似点和不同点。Fiori 应用程序中使用的大多数 `SAPUI5` 控件都使用 `OData v2`。在表 2-1 中，我们可以看到这种比较。


  以下请求比较显示了相同类型请求的 `OData V2` 服务与 `OData V4` 服务请求的性能改进，并使用了名为 Northwind 的免费在线 `OData`
  服务，如图 2-1 和 2-2 所示。


  这两个版本之间性能改进的主要区别之一在于，`JSON` 格式的有效负载大小与返回 `XML` 有效负载的相同请求相比相对较小，如下所示。


  ![../images/502765_1_En_2_Chapter/502765_1_En_2_Fig2_HTML.jpg](img/502765_1_En_2_Fig2_HTML.jpg)


  **图 2-2** OData 服务 v4


  ![../images/502765_1_En_2_Chapter/502765_1_En_2_Fig1_HTML.jpg](img/502765_1_En_2_Fig1_HTML.jpg)


  **图 2-1** OData 服务 v2


  ![../images/502765_1_En_2_Chapter/502765_1_En_2_Fig3_HTML.jpg](img/502765_1_En_2_Fig3_HTML.jpg)


  **图 2-3** 显示实体集的 OData 服务元数据


  ## OData 实体


  `OData` 服务中公开的实体是指向已公开的后端数据模型的指针，这些模型可进一步用于 CRUD（创建、读取、更新、删除）操作。后端数据模型代表 `CDS` 视图、表或其他入口点，客户端应用程序可以通过
  HTTP(s) 协议与后端交互。您可以在 `OData` 服务中将不同的端点识别为实体集。如图 2-3 所示，您可以在请求 `OData` 服务的元数据时看到这些实体集。


  ## OData 元数据


  创建 `OData` 服务时，其契约表示为同一服务的元数据。`OData` 服务元数据可以通过将 `/$metadata` 附加到 `OData` 服务 URI
  的末尾来定位。元数据文件是一个 `XML` 生成的文件，如图 2-3 所示。


  在将 SAP Fiori 应用程序映射到控件（如列表或表格）时，会使用应用程序的元数据，它利用服务的元数据来确定控件类型以及一些要绑定的属性，例如记录计数、要表示的数据标题、过滤器标签，以及在列表报告或工作列表模板中智能表格的情况下，能够为过滤器栏中使用的控件解释数据类型。这些附加属性可在图
  2-4 中看到。


  ![../images/502765_1_En_2_Chapter/502765_1_En_2_Fig4_HTML.jpg](img/502765_1_En_2_Fig4_HTML.jpg)


  **图 2-4** OData 元数据


  除了**实体集**（端点）和**实体类型**（端点定义）之外，`OData` 服务还提供导航属性。对于 Products 实体集，我们可以观察到它在图 2-5
  中有三个导航属性绑定。


  ![../images/502765_1_En_2_Chapter/502765_1_En_2_Fig5_HTML.jpg](img/502765_1_En_2_Fig5_HTML.jpg)


  **图 2-5** 显示实体集的 OData 服务元数据


  1. 导航属性绑定到 Category 目标

  2. 导航属性绑定到 `Order_Details` 目标

  3. 导航属性绑定到 Supplier 目标


  拥有导航绑定意味着什么？如果您猜到这允许这些实体在端点之间定义关系，那么您猜对了。导航属性是理解和跟踪从一个端点到另一个端点的数据关系的简单方法。这在应用程序中是一种非常常见的场景：显示数据列表，然后应用程序的用户希望向下钻取或*导航*到一个项目以查找有关特定记录的更多详细信息。


  另一个常用的 URL 语法特性是需要知道实体的记录数。要检索记录数，请参见图 2-6。




  ![../images/502765_1_En_2_Chapter/502765_1_En_2_Fig6_HTML.jpg](img/502765_1_En_2_Fig6_HTML.jpg)


  **图 2-6** — 显示记录数的 OData 服务


  在测试这些 OData 服务时，开发者可以执行多种类型的请求以验证他们正在使用的 Web 服务。这些验证 OData 服务的不同方式使用了 OData 协议提供的不同查询语法
  URL。最常见的方式如表 2-2 所示：


  **表 2-2** — OData 操作与运算符


  | 测试描述 | URL 语法 |

  | --- | --- |

  | 获取服务定义 | `URL/Path` |

  | 获取元数据 | `URL/Path/$metadata` |

  | 获取前 N 条结果 | `URL/Path?$top=N` → N 为正整数 |

  | 获取实体 | `URL/Path/Entity` → 从实体中获取所有记录。检索整个实体集时请务必小心 |

  | 按属性筛选实体 | `URL/Path/Entity?$filter={Prop} eq ''{SomeValue}''` • `$filter` 运算符允许按属性
  `{Prop}` 进行筛选 • `{SomeValue}` 表示一个能被筛选的 `{Prop}` 理解的值 • `eq`（等于）是可应用于筛选查询的众多运算符之一；其他可用的运算符包括
  `ne`（不等于）、`gt`（大于）、`lt`（小于）、`contains`（包含） |

  | 获取记录数 | `URL/Path/$count` → 返回某个实体的记录数量 |

  | 将数据格式化为 JSON 或 XML | `URL/Path?$format=json` → XML 是 OData v2 的默认格式，JSON 是 V4
  的默认格式 |


  关于 OData 协议和 OData 服务规范的更多信息，请访问其网站 [`www.odata.org/`](https://www.odata.org/)。


  在将数据绑定到任何 SAPUI5 表格控件时能够使用 OData 的一个好处是，UI5 框架知道如何构建这些请求，并在后台自动完成，从而减轻了开发构建应用程序的开发者的复杂度。此外，表格控件以及其他具有列表行为的控件，可以设置为分页、滚动加载，以及其他触发类似
  OData 请求的事件，以便在需要时从 OData 服务检索数据。发起较小请求的背后原因是避免拉取巨大的数据集，并在用户浏览数据和按需加载数据时提升性能。在第
  3 章中，我们将展示其中一些控件如何构建较小的 OData 请求，并将在浏览器的“网络”选项卡中比较网络请求及其响应时间。


  目前为止，本书已经解释了 OData 协议以及大多数开发者都熟悉的一个非常常见的免费示例 OData 服务；其唯一目的是演示该协议，以及这些服务的请求和响应操作如何工作。


  然而，如果我们开始开发一个应用程序，但在某些情况下，开发者可能无法直接连接到 OData 服务，我们该如何处理相同的情况呢？这些都是每天都会发生的真实场景，开发者在开始开发新应用时可能会遇到。如果你能生成一个元数据文件，那么你就可以使用
  SAP Web IDE 的模拟数据功能来模拟数据。


  让我们继续展示这个模拟数据的场景。如果你有一个 OData 服务，并且可以查询其元数据 XML 文件，那么就从这个文件开始。在下一个例子中，我将使用一个 SAP
  HANA XSA OData 服务，稍后会详细介绍。现在，让我们分析元数据文件，看看如何模拟这些数据。


  ![../images/502765_1_En_2_Chapter/502765_1_En_2_Fig7_HTML.jpg](img/502765_1_En_2_Fig7_HTML.jpg)


  **图 2-7** — 作为 `localService` 添加的 OData 元数据文件


  1.  访问服务并检索元数据文件，如图 2-7 所示。

  2.  将元数据 XML 文件复制到记事本文件中。确保生成的 XML 负载中没有特殊字符，例如箭头或编码后的 XML。

  3.  在 SAP Web IDE 中，于你的项目内 SAPUI5 模块的 `localService` 文件夹下创建一个新文件，命名为 `metadata.xml`，并将你之前复制到记事本文件中的
  XML 内容粘贴进去。

  4.  保存 `metadata.xml` 文件。


