  其他功能，如排序、创建和删除，在此仅作说明；我邀请您去探索它们，并了解其他功能，例如保存变式（显示在上图左上角的标准下拉菜单中），或与其他人共享应用（如右上角头像图标下方所示）。可能还有一些较小的应用配置设置需要处理，例如更改表格类型（`GridTable`
  代替 `Responsive`）、隐藏应用的某些部分（如不显示变式），或隐藏应用的某些区域；所有这些配置设置都是可能的，但有些繁琐，因为开发者需要修改 `manifest`
  配置文件中的应用设置。


  到现在，您可能会问，为什么在第 2 章中，我们使用 SAP Web IDE 创建 sapui5 应用的一种方法，需要编写视图、片段和控制器，而在这里的第 3 章中，本书展示了包含相同
  OData 服务的元数据定义的简单方法，并且不需要添加任何代码。事实上，这是许多 SAP 客户最常问的问题之一。客户通常会问，是否可以直接跳过编码？为什么他们需要采用更费时的方法？就像软件中的其他所有事情一样，不同的用例需要不同的开发方法。




  如果你正在开发一个非常标准的应用程序，且确实不需要定制化，那么使用第 3 章中介绍的采用 `Fiori elements` 的方法是最佳选择。这种方法将为你节省大量时间和开发投入，但不会为轻松定制化提供太多自由度。在这种方法中，定制化是通过修改
  `manifest.json` 文件配置和在 XML 中添加注解来实现的。


  相反，如果你的团队正在开发的应用程序需要定制化、引入业务规则和灵活性，并且它基本上不会是一个标准的展示型应用程序，那么你的团队或组织需要考虑采用第 2 章中展示的定制化方法。


  有一些 `Fiori` 指南可供参考，以确定哪种开发类型适合你和你的组织。请在 SAP Fiori 指南网页 URL：[`https://experience.sap.com/fiori-design/`](https://experience.sap.com/fiori-design/)
  中查看这些 Fiori 指南。


  ## 将外部 JS 库集成到 (SAPUI5) Fiori 中


  熟悉了开发工具，并开始使用其中一个应用程序工具后，很可能有时需要集成额外的 JavaScript 库，例如当 SAPUI5 库未提供某些功能时，或者需要利用其他库来构建更健壮的
  Fiori 应用程序时。第三方库通常作为 Web 应用程序的依赖项被包含进来，在我们的案例中，本书将展示一个过去使用过的此类库。


  本书要演示的第三方库叫做 `moment.js`。`moment.js` 是一个免费的 JavaScript 库，用于处理日期对象。通常，在 JavaScript
  中处理日期对象并不简单也不直接。可能需要使用这个第三方库的原因有很多，包括：


  1.  日期加法

  2.  日期比较

  3.  处理时区和偏移量


  图 3-30 是 `moment.js` 网站的一张图片，开发者可以在此下载这个第三方库。


  *请阅读文档和任何许可信息，以确保你的项目可以使用此库。*


  ![../images/502765_1_En_3_Chapter/502765_1_En_3_Fig30_HTML.jpg](img/502765_1_En_3_Fig30_HTML.jpg)


  图 3-30

  `moment.js` 网站


  要将此库添加到项目中，首先从其网站下载。然后将其作为依赖项包含进来。在图 3-31 中，添加了一个名为 `externalLibs` 的文件夹；其中包含了 `moment.js`
  库。该依赖项被注入到细节控制器文件中，并作为 `moment.js` 引用。


  ![../images/502765_1_En_3_Chapter/502765_1_En_3_Fig31_HTML.jpg](img/502765_1_En_3_Fig31_HTML.jpg)


  图 3-31

  加载 `moment.js` 作为依赖项


  一旦 `moment` 库被加载到项目中，开发者就可以引用其不同的操作，如图 3-32 所示。


  ![../images/502765_1_En_3_Chapter/502765_1_En_3_Fig32_HTML.jpg](img/502765_1_En_3_Fig32_HTML.jpg)


