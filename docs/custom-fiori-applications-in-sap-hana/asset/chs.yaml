  \n**图 5-12** 设置试用账户\n\n创建账户后，浏览器将重定向至图 5-13 所示的 SCP Cockpit 界面。请仔细查看该仪表盘中的各项功能，以便后续参考，或在不再使用时删除试用账户。\n\
