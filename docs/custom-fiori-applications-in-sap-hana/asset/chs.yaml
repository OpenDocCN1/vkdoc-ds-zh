  \n**图 5-13** 显示全局账户设置的 SCP Cockpit\n\n选择\"trial\"全局账户磁贴，进入子账户。\n\n在接下来的界面中，您将看到部署所需的所有云设置。图\
  \ 5-14 所示的图像可谓\"一图胜千言\"，因为其中的信息将对您的部署、维护乃至任何未来的开发工作都大有裨益。请仔细分析这个仪表盘并熟悉图 5-14 中的界面，以及所有与\
