  \ `test/qunitTest.js` 文件，查看 `QUnit` 框架的结构。在图 4-2 中，你可以看到以下内容：\n\n![../images/502765_1_En_4_Chapter/502765_1_En_4_Fig2_HTML.jpg](img/502765_1_En_4_Fig2_HTML.jpg)\n\
  \n**图 4-2** QUnit 输出示例\n\n1.  单元测试套件的标题，来自 `qunitTest.html` 文件。\n2.  复选框，用于在开发者只想显示错误的测试时隐藏通过的测试。另一个复选框用于检查全局设置。最后还有一个复选框，用于禁用代码中的\
