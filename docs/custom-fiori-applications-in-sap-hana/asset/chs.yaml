  \n**图 5-18** SCP 云层级结构\n\n在我的示例中，部署因数据库配置设置而失败；但是，如果您仅部署自定义的 Fiori 应用程序，则应该能够顺利完成部署。请查看如图\
  \ 5-19 所示的控制台日志，以了解部署是否完成，或者您的 Fiori 应用程序中是否有任何设置需要编辑。\n\n![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig19_HTML.jpg](img/502765_1_En_5_Fig19_HTML.jpg)\n\
  \n**图 5-19** SAP Web IDE 部署期间出现的错误\n\n\n\n## 部署到 SAP Cloud 和 AWS 等不同平台\n\n上一小节描述了开发者可以在\
  \ SAP Web IDE 中构建并部署 Fiori 应用到 SAP Cloud Platform 的步骤。还有其他一些云提供商也可以用来托管 Fiori 应用。本章的这一部分将解释如何将同一个\
  \ Fiori 应用部署到 AWS 环境。在 AWS 上，需要一个付费账户来获得一个 `EC2` 实例，以便在其上加载 SAP HANA XSA 快速版镜像。\n\
  \n在本书中，我选择了 AWS，是因为我对这个过程已经比较熟悉，并且已经实施过几次。不管你信不信，每次我执行这些步骤时，我都能学到新东西，在撰写本书期间也不例外。就像本书解释了\
  \ CF 的架构和层级一样，我认为也应该介绍一下来自 AWS 云平台的几个概念。\n\nAWS 提供了大量的服务，供全球各地的公司用于日常业务的运营。无论从开发者、云客户还是从他们所提供的服务的角度来看，AWS\
  \ 都是一个非常出色的平台。无论是为了我自己的目的，还是为了撰写本书，我对所探索的各种 AWS 服务都非常满意。\n\n对于组织来说，选择云提供商可能是一项挑战，因为他们将其部分基础设施（有时还包括他们的数据）托付给了云提供商；然而，如果你对比一下使用云服务的利弊，你就会意识到这样做有很多好处。仅举几例：\n\
  \n1.  **几分钟内全球化。** 你可以只需点击几下，即可在世界各地部署你的基础设施、软件和其他服务，并快速投入生产。无需像过去本地部署时代那样，等待漫长数日/数周来订购和交付硬件。\n\
  2.  **基础设施零维护，按用量付费。** 补丁或其他维护费用由云提供商承担。你（客户）只需为使用中的计算能力和数据检索付费。\n3.  **“对云”负责 vs\
  \ “在云中”负责。** 你（客户）必须对你在云中放置的内容负责，例如保护你的应用程序、数据库、用户等安全。AWS 对云本身负责，确保其正常运行，其托管服务是安全的，并且你的账户不会与其他账户混淆。\n\
  4.  **通过标签跟踪服务产生的费用。** 你的云账户可以设置预算告警，并且可以标记每个服务，让你了解你和你的客户正在使用的各个服务分别产生了多少成本。\n\n\
  一旦你充分了解了云的优势，并准备好在云平台运行你的应用程序，你会发现你还需要了解额外的 AWS 概念。在设置某些服务时，并为了理解月底的账单，需要了解以下术语。设置服务时请密切留意：\n\
  \n1.  **区域** - 这是世界上一个拥有集群数据中心的独立地理区域。北美有多个区域；例如，美国东部、美国西部、加拿大。建议客户选择一个靠近其客户所在地的区域，以尽量减少对其软件性能和网络延迟的影响。区域概念对软件和云服务的使用方式有重大影响。您希望尽可能保持您的运营距离最近。\n\
  2.  **可用区** – AZ 是区域内的一个或多个数据中心。一个区域内存在多个 AZ 的目的是为了冗余，从而实现高可用性，进而达到容错、独立供电、独立冷却、安全和数据保护。美国东部区域内的\
  \ AZ 是 `us-east-1`、`us-east-2`。请确认您部署软件的区域内有哪些 AZ。\n\n这些概念在图 5-20 中进行了高级别展示。\n\n\
  ![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig20_HTML.jpg](img/502765_1_En_5_Fig20_HTML.jpg)\n\
  \n图 5-20\n\nAWS 区域和可用区\n\n接下来的概念与 AWS 服务相关。这些服务必须部署在某个 AWS 区域内。\n\n1.  **弹性计算云**\
  \ - EC2。\n\n这是最初且最流行的服务之一，允许公司运行虚拟计算能力。你可以将一个 `EC2` 实例视为运行在云端网络中的虚拟机。有各种类型的 `EC2`\
  \ 实例，提供计算能力、高内存、专用实例或竞价实例。所有这些实例都具备并提供了许多特性和功能，并按使用量计费。\n\n2.  **弹性块存储** – EBS\n\
  \n该服务提供块存储，作为允许 `EC2` 实例存储数据的方法之一。AWS 提供多种提供存储解决方案的服务。有些服务用于大容量存储，有些用于持久化存储，另一些用于内存存储。就部署我们的应用程序而言，你需要了解此服务的关键点是，练习中使用的\
  \ `EC2` 实例使用了 SAP HANA XSA 镜像。此镜像需要 `EBS` 服务。在为您的应用程序使用 AWS 之前，请熟悉此服务及其他存储服务，以了解相关特性和成本。\n\
  \n3.  **简单存储服务** - S3\n\n该服务是最流行的 AWS 服务之一，大多数云客户的使用率都很高。简单存储服务用于对象存储，例如文件、代码、备份和镜像。从\
  \ AWS UI 的角度来看，`S3` 服务显示为文件夹层级结构；然而，这些对象是以扁平层级结构存储的。该服务为客户提供无限的存储空间，并且根据其消费者所需的检索时间，提供多种类型的存储。再次强调，请熟悉不同的\
  \ `S3` 存储桶类型，以确定哪种最适合您。在本书的练习中，我们将使用 `S3` 服务来存储和备份我们的代码版本。\n\n本书不会深入探讨与 AWS、`EC2`、`EBS`\
  \ 或网络相关的细节；但是，为了将自定义应用程序部署到这个平台，有必要对这些托管服务进行高级别的说明。如果您需要有关 AWS 的更深入知识，请咨询 AWS 专业人员。请参见图\
  \ 5-21 以了解此设置的高级视图。\n\n![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig21_HTML.jpg](img/502765_1_En_5_Fig21_HTML.jpg)\n\
  \n图 5-21\n\n托管了一个连接到 `EBS` 的 `EC2` 实例的 AWS 区域\n\n对于我们此次的练习，我们按照 SAP 提供的教程中所述设置了推荐的\
  \ AWS 基础设施：[`https://developers.sap.com/tutorials/hxe-xsa-aws-setup.html`](https://developers.sap.com/tutorials/hxe-xsa-aws-setup.html)。\n\
  \n\n\n## AWS 上的 SAP HANA XSA\n\nSAP HANA XSA（免费）映像可在 AWS Marketplace 中找到，如图 5-22\
  \ 所示。选择映像后，您需要选择要部署到的区域。该映像是一个预构建的实例，已包含一些必需的设置。使用映像可以加快启动和运行的速度。该映像已配置好的一些设置包括安全组网络规则以及卷存储，下文将进一步讨论。\n\
  \n![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig22_HTML.jpg](img/502765_1_En_5_Fig22_HTML.jpg)\n\
  \n**图 5-22** – SAP HANA XSA 快捷版\n\n此 SAP HANA XSA 映像使用一个 `EC2` 实例 `m4.2xlarge`，该实例仅使用\
  \ `EBS` 存储，如图 5-23 所示。\n\n![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig23_HTML.jpg](img/502765_1_En_5_Fig23_HTML.jpg)\n\
  \n**图 5-23** – SAP HANA XSA – EC2 实例设置\n\n按照提示设置您的 XSA 环境。最终，您需要配置安全设置并开放一些端口，以连接到某些\
  \ HANA XSA 服务和将在 AWS 中托管的 SAP HANA XSA Web IDE；由于您使用了 SAP HANA XSA 映像，这些设置已就绪。您还需要生成或选择现有的密钥对，以便使用\
  \ Linux（如果使用 Windows，则使用 `Putty`）连接到您的实例。如果您已有生成的密钥对，则可以使用该密钥对。我建议您创建一个新的密钥对，以便对整个环境进行一次干净的安装。\n\
  \n上述 URL 包含了 SAP 官方网站上的所有步骤。如果操作正确，完成设置可能需要 30 分钟到 1 小时。\n\n我在设置过程中遇到的一些常见错误是：\n\
  \n1.  理解 `Putty` 和 `Putty Key Gen` 之间的区别\n2.  基本了解如何使用 `XS CLI`\n3.  理解连接到 AWS 账户时使用密钥对证书的原因\n\
  4.  从 `pem` 密钥生成 `ppk` 文件。在此步骤中，请确保选择私钥（而非公钥）\n5.  理解终端设置步骤，并确保知道在何时使用哪些命令\n\n请记住，尽管\
  \ HANA XSA 映像是免费的，但在使用过程中您仍然需要为 `EC2` 实例以及 `EBS` 存储付费。停止 `EC2` 实例并不会停止 `EBS` 存储；因此，如果您决定停止\
  \ `EC2` 实例，除非您终止 `EC2` 实例和 `EBS` 卷，否则您仍需支付 `EBS` 服务的费用——您可能也会在月底收到账单时，通过这种惨痛的方式学到这一点。\n\
  \n图 5-24 展示了终止 `EC2` 实例和 `EBS` 卷时的情形。执行此操作将清除您的所有数据，因此仅当您完全完成练习后，才可继续执行此步骤。\n\n\
