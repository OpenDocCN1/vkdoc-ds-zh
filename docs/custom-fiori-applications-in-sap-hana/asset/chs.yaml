  \ AWS 平台\n2.  美国东部（弗吉尼亚州）使用 `https://api.cf.us10.hana.ondemand.com` AWS 平台\n3. \
  \ 美国中部使用 `https://api.cf.us20.hana.ondemand.com` Azure 平台\n\n选择与您的 SAP 账户匹配的端点后，输入图\
  \ 5-17 所示的账户凭证。\n\n![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig17_HTML.jpg](img/502765_1_En_5_Fig17_HTML.jpg)\n\
  \n**图 5-17** SCP 账户凭证\n\n在`SAP Web IDE`通过 SCP 对您进行身份验证后，将出现下一个提示，要求部署者选择组织和空间，如图\
  \ 5-18 所示。请记住，一个组织可能包含一个或多个空间。以下练习仅显示默认的`dev`空间以供说明——如果您的组织为开发或部署创建了其他空间，请选择相应的空间。\n\
