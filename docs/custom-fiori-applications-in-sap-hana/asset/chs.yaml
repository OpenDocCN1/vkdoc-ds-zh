  \ `mtar` 文件，就像我们之前所做的那样，如图 5-29 所示。\n\n请密切关注 SAP Web IDE 控制台，以确保您的模块和项目构建成功（图 5-30）。如果出现任何问题，请先解决它们，然后再继续。只有当项目构建成功时，您才能进行部署。\n\
  \n![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig30_HTML.jpg](img/502765_1_En_5_Fig30_HTML.jpg)\n\
  \n**图 5-30** – 从 SAP Web IDE 部署项目后的成功消息\n\n![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig29_HTML.jpg](img/502765_1_En_5_Fig29_HTML.jpg)\n\
  \n**图 5-29** – SAP Web IDE 在 AWS 中生成 mtar 文件\n\n### 步骤 5：部署并验证\n\n打开 HANA XS Advanced\
  \ Cockpit，查看此应用部署到的 URL，如图 5-31 所示。\n\n![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig31_HTML.jpg](img/502765_1_En_5_Fig31_HTML.jpg)\n\
  \n**图 5-31** – 用于 Fiori 应用程序的 HANA XSA URL\n\n然后，从您的浏览器导航到该 URL，以验证应用程序是否确实已部署（或者您可以使用第\
  \ 4 章的 Puppeteer 脚本来自动执行此步骤），如图 5-32 所示。\n\n![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig32_HTML.jpg](img/502765_1_En_5_Fig32_HTML.jpg)\n\
  \n**图 5-32** – 在 AWS 上运行的自定义 Fiori 应用程序\n\n图 5-32 中的屏幕显示了一个空列表和一个空详情页面，这是因为 HANA\
  \ 数据库目前不包含任何数据，毕竟这是一个全新的部署。但是，您可以通过使用 Puppeteer 脚本并编辑 URL 值，或通过手动打开浏览器的网络选项卡并查看生成的请求（如图\
  \ 5-33 所示），来验证 OData 服务是否确实已从自定义 Fiori 应用程序中调用。\n\n![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig33_HTML.jpg](img/502765_1_En_5_Fig33_HTML.jpg)\n\
  \n**图 5-33** – 网络选项卡请求标头和响应\n\n注意，图 5-33 中的远程地址显示我们的 XSA 应用程序正在 AWS 实例中运行。\n\n\n\
  \n虽然在 AWS 中运行 HANA XSA 应用的实践练习，看起来与在本地场景中运行应用几乎如出一辙，本质上确实非常接近；但你可以看到，我们定制的 Fiori\
  \ 应用在云端的运行情况，既可以通过浏览器进行验证，也可以使用本书第 4 章中来自 Puppeteer 的单元测试脚本来验证。\n\n此外，AWS 实例必须在\
  \ EC2 仪表盘中处于运行状态，才能在浏览器中运行。在此温馨提醒一下，完成开发后请记得停止（或终止）你的 EC2 实例，以避免在 AWS 中产生不必要的费用。同时请记住，EBS\
  \ 卷（存储）是独立于 EC2 实例运行的；因此，如果你希望终止 EC2 实例，也请分离并删除该卷，以避免为你未使用的服务付费。\n\n## GIT 仓库\n\n\
  在前文关于 AWS 云的小节中曾简要提及，如何使用 GIT 仓库将开发工作保存在外部企业仓库中。使用外部仓库的原因是允许代码在 SAP HANA 外部进行维护。此外，像\
  \ GIT 这样的外部代码仓库是一种行业标准，它允许开发团队使用不同的分支策略并行进行软件开发，并保持其部署的整洁性。有几种不同的外部仓库；然而，本书使用 GIT\
  \ 是为了与本书练习中提供的工具保持更紧密的集成。\n\n为简单起见，假设所有跟随练习的人都有一个有效的 GIT 账户，并且能够使用自己的许可证从 GIT 仓库进行连接、提交和克隆——本书将演示使用一个拥有免费许可证的账户。\n\
  \n为了使用 GIT，开发者必须能够访问此仓库，熟悉 GIT 命令，并且要么通过命令行执行（如果你采用此方法，则需要下载 GIT CLI），要么通过 SAP Web\
  \ IDE 与之交互，后者已经具备与 GIT 仓库的接口。在上一节中，练习使用了克隆功能来从 GIT 仓库检索代码，并使用检索到的代码将其部署到 AWS 实例。\n\
  \nGIT 命令在包括 SAP Fiori 应用、单元测试以及此处展示或你在日常工作中所见到的其他软件开发在内的现代软件开发和维护中是基础。需要理解每个命令的工作原理、何时以及如何使用它们，以便在进行\
  \ Fiori 开发时提高效率。理解这些命令还能让你与其他团队成员并行工作，也能让你理解代码版本控制和软件部署，并最终能够跟踪分配的新任务或错误修复。\n\n\
  还有更多可用的命令，但并未全部列在表 5-2 中。以下是最常用命令的列表（排名不分先后）：\n\n**表 5-2** 从 SAP Web IDE 使用的 GIT\
  \ 命令\n\n| 命令 | 描述 | 示例 |\n| --- | --- | --- |\n| `Clone` | 将外部仓库克隆到本地工作区 | `git\
  \ clone <url>` |\n| `Commit` | 将本地工作区的更改提交到远程仓库 | `git commit -m <提交注释>` |\n| `Stash`\
  \ | 保存你不想立即提交的更改 | `git stash` |\n| `Push` | 将你的更改推送到远程（主）分支 | `git push <远程仓库>\
  \ <分支>` |\n| `Pull` | 从远程分支拉取更改 | `git pull <远程仓库> <分支>` |\n| `Rebase` | 将一系列提交移动或合并到新的基础提交的过程。Rebase\
  \ 的主要目的是维护项目历史 | `git rebase <基础>` |\n\n如果你选择 GIT 窗格（位于浏览器屏幕右侧顶部算起的第二个图标），则所有这些命令都可以从\
  \ SAP Web IDE 中运行。任何待处理的更改都会显示在更改表格中，如图 5-34 所示。\n\n![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig34_HTML.jpg](img/502765_1_En_5_Fig34_HTML.jpg)\n\
  \n**图 5-34** SAP Web IDE 中的 GIT 窗格\n\n要将更改保存到仓库，开发者必须保存对 SAP Web IDE 中文件所做的更改，这些更改会以待处理状态显示在\
  \ GIT 窗格中。然后，开发者必须选择要暂存的文件，在 GIT 窗格底部的注释输入框中输入注释，最后选择 `commit` 和 `push` 按钮，将这些更改推送到外部仓库。\n\
  \n在构建此定制 Fiori 应用的不同阶段，都执行了这些步骤，你可以从 GITHUB 仓库页面看到更改日志，如图 5-35 所示（共 23 次提交，包括一些测试提交和一些小提交）。\n\
  \n![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig35_HTML.jpg](img/502765_1_En_5_Fig35_HTML.jpg)\n\
  \n**图 5-35** 仓库中显示的 GITHUB 代码提交\n\n无论你是进行定制 Fiori 开发还是任何其他类型的软件开发，你都很有可能与外部代码仓库交互。花些时间熟悉仓库命令。其他类似\
  \ GITHUB 的外部仓库包括 Bitbucket 和 MSFT TFS，仅举两例。这两个额外外部代码仓库也可以作为你 Fiori 开发的代码仓库，并且当你与它们交互时，遵循与\
  \ GITHUB 仓库相同的命令。根据你使用的工具，有相应的插件用于与这些外部仓库交互。在本书前面部分，我们还演示了 Visual Studio Code 编辑器，它也可以与\
  \ GITHUB、Bitbucket 和 MSFT TFS 交互。\n\n## 自动化部署\n\n这可能是本书阅读量最大的部分。每个人都希望自己的团队能够搭上持续集成和持续交付（CI/CD）的顺风车。这意味着什么？\n\
  \n1.  持续集成是一种实践，即频繁地向仓库提交代码，以确保代码能够与软件的其他部分“契合”。拥有自动化单元测试有助于运行持续集成管道。如果开发者更改代码、部署，并且他们的软件能够工作，那么他们就在遵循这一实践。\n\
  \n2.  持续交付依赖于持续集成。负责部署开发者代码的软件工程师必须始终能够进行部署，并且保持其部署的代码持续工作，以确保交付新代码不会破坏现有的软件系统。尽管代码在不断集成，但没有理由不能让软件在可工作状态下交付。运行持续交付管道可能看起来有风险；这需要极大的纪律性和全体人员的参与，以确保\
  \ CI/CD 过程能够尽可能顺畅地运行，但这是可行的。这种类型的操作可以在大型组织中实现，这些组织有专门的工程师团队负责协调不同的组成部分。\n\n在我们的练习中，实现\
  \ CI/CD 的理想情况是，所有软件的修改都通过一个自动化的单元测试过程运行，例如第 4 章中所示的过程。如果自动化测试通过了所有验证，那么代码就会被提交到\
  \ GITHUB，并且代码提交会通过一个验证软件语法规则、代码覆盖率等的过程来运行，以确保其符合一定的标准集。如果这一步成功了，那么该提交就可以通过某个工具或脚本部署到上游环境。\n\
  \n\n\n## 结论\n\n在本章结尾，我很高兴能够将这个应用部署到不同的云提供商。本章首先解释了软件版本管理，并提供了关于软件发布以及维护软件时应注意的事项。在介绍软件版本管理之后，本书解释并比较了`CF`架构，以及不同云平台（包括基于云原则的`SAP\
  \ HANA XSA`）是如何遵循该架构的。不同提供商的步骤可能略有差异；然而，各个平台之间的概念遵循着非常相似的步骤。毕竟，目标云平台是基于`CF`架构的。希望你能跟随这些步骤，在你选择的任何目标平台上完成部署。完成练习的方法和工具有很多，本书仅展示了其中一部分。\n\
  \n"
- '# 全书结语


  在结束本书的写作时，我对贯穿练习中的各个主题感到非常欣慰。仿佛就在不久前，我还在撰写关于创建自定义`Fiori`应用并从白板设计开始的内容。之后，我迅速转向了可以为`Fiori`应用开发的各种平面图和应用类型。接着，本书介绍了使用
  SAP 提供的工具（如`SAP Web IDE`、`SAP Web IDE 个人版`）以及外部 IDE 工具（如安装了 SAP 提供的一些扩展的`Visual
  Studio Code`编辑器）来开发、设置和扩展`Fiori`应用的各种工具。在介绍了工具和`Fiori`应用的开发（展示了使用`XML`视图、`JavaScript`控制器以及各种呈现和建模数据方式的`MVS`模式）之后，本书转而介绍了单元测试框架，我认为这是一个需要各公司越来越多地探索的领域。最后，我通过解释所需步骤、介绍软件版本管理，并将我们开发的自定义`Fiori`应用部署到各种平台来结束本书。希望你能够跟上思路，并从至少部分章节中学到一些技巧，无论你是在设计、集成第三方`JavaScript`库、添加软件版本管理，还是部署到不同平台方面有所收获。非常感谢你抽出时间跟随我的旅程，祝你在自定义`Fiori`开发中一切顺利。



  好的，作为一名高级文档工程师和翻译员，我将根据您提供的注意事项和示例，将给定的英文文本翻译成中文。



