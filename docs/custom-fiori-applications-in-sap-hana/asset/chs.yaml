  \n**图 5-28** – GIT 仓库 URL\n\n![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig27_HTML.jpg](img/502765_1_En_5_Fig27_HTML.jpg)\n\
  \n**图 5-27** – 克隆仓库\n\n### 步骤 3：克隆仓库\n\n返回工作区，右键单击并选择“克隆仓库”。出现提示时，提供用于克隆 GIT 仓库的\
  \ URL，如图 5-27 和图 5-28 所示。\n\n### 步骤 4：构建模块\n\n克隆仓库后，自定义 Fiori 应用程序项目将出现在 SAP Web\
