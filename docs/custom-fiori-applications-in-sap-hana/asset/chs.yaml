  \ 部分接受两个参数：测试的名称以及将在其中执行断言的函数。在图 4-2 中，读者可以看到同一个模块（`unitTestSample`）中的两个测试场景。\n\n\
  在每个测试的正下方，读者还可以看到每个测试所在的源代码和行号。\n\n输出屏幕是根据图 4-3 中所示的测试用例生成的。\n\n![../images/502765_1_En_4_Chapter/502765_1_En_4_Fig3_HTML.jpg](img/502765_1_En_4_Fig3_HTML.jpg)\n\
