  \ 行）开始记录 `startTime`，然后在成功回调内部（第 37 行）记录 `endTime`，以便能够计算时间差（第 38 行）。\n\n图 4-5 显示了当预期的对象结构与\
  \ `OData` 服务的响应不匹配时发生的失败，这对应了测试用例中的第三个断言。`OData` 服务响应的预期结果与图 4-5 中显示的内容之间的差异，正是开发者应该理解并解决的失败。\n\
  \n![../images/502765_1_En_4_Chapter/502765_1_En_4_Figa_HTML.jpg](img/502765_1_En_4_Figa_HTML.jpg)\n\
  \n**图 4-5** 预期对象结构与 OData 服务的响应结构不匹配时显示的失败信息\n\n\n\n### 单元测试调试\n\n在编写这些单元测试用例时，开发人员可能也需要对自己的代码进行调试。\n\
  \n要调试单元测试用例，开发人员需要像开发解决方案一样查看浏览器开发者工具。要启动开发者工具，请打开浏览器窗口找到单元测试 HTML 页面所在位置，按下 `F12`\
  \ 启动开发者工具，然后导航至存放源代码的 `Sources` 标签页。在 `Sources` 标签页中，打开你的 JavaScript 文件并设置断点，即可逐步调试你的开发代码。就像通常从控制器\
  \ JS 文件中导航和移动 JavaScript 代码一样，开发人员可以使用同样的浏览器工具来帮助自己导航和调试单元测试脚本（使用键盘快捷键 `F10`、`F11`、`F8`）或使用浏览器右下角的导航图标。\n\
  \n本章稍后部分会深入介绍 Chrome 开发者工具，所以请确保你已经充分理解开发者工具中的这一部分内容，以便后续能很好地运用它。\n\n![../images/502765_1_En_4_Chapter/502765_1_En_4_Fig5_HTML.jpg](img/502765_1_En_4_Fig5_HTML.jpg)\n\
  \n**图 4-6** – 调试 QUnit 测试用例\n\n## 从该单元测试框架中学到的\n\n1.  设置和上手非常容易：[`qunitjs.com/intro/`](https://qunitjs.com/intro/)\n\
  2.  文档易于理解：[`api.qunitjs.com/QUnit/`](https://api.qunitjs.com/QUnit/)\n3.  大多数 Fiori\
  \ 应用模板都使用该框架：[`sapui5.hana.ondemand.com/1.36.6/docs/guide/e1ce1de315994a02bf162f4b3b5a9f09.html`](https://sapui5.hana.ondemand.com/1.36.6/docs/guide/e1ce1de315994a02bf162f4b3b5a9f09.html)\n\
  4.  开发人员熟悉该框架中使用的大多数概念，包括调试\n\n请花额外时间查阅 QUnit 文档，熟悉该框架提供的其他类型的测试、断言以及操作或功能。如果你决定实现这个框架，祝你好运！\n\
  \n## Nightmare JS\n\n接下来本书要重点介绍的另一个单元测试框架是 Nightmare JS。选择这个单元测试框架的原因在于它是一个流行的 JavaScript\
  \ 框架，并且不属于常规的 Fiori 开发范畴。我通常喜欢体验 SAP 技术及其产品所提供的功能，但自己主动研究网络上可用的其他选项也是一个好习惯。毕竟，本书提供的是另一种信息来源，它呈现不同视角，与读者分享那些或许尚未被探索过的信息。可惜的是，这个单元测试框架的最终效果并不理想；不过，我决定将其保留在文中，以便与其他框架进行对比。该框架的某些命令和特性与本章记录的最后一个单元框架相似，这也是将其保留于此的主要原因，即使它只能呈现一个不完整的单元测试场景。这个框架中仍有一些有价值的信息值得了解。\n\
  \nNightmare JS 是一个开源的高级单元测试浏览器自动化框架。在底层，Nightmare JS 使用了 Electron JS 框架。Electron\
  \ JS（访问 [`www.electronjs.org/`](https://www.electronjs.org/)）是一个允许开发者使用 JavaScript、HTML\
  \ 和 CSS 创建跨平台桌面应用的框架。请允许我再重复一遍：使用 JS、HTML 和 CSS 创建跨平台桌面应用。如果你了解 Web 开发，就会知道 JavaScript、HTML\
  \ 和 CSS 是运行在浏览器上的语言，因此与桌面应用程序不同。Electron JS 也是一个流行的框架，因为 Web 开发者现在可以用他们熟悉的技术来创建桌面应用了。带着这个想法，接下来让我们定义、解释并展示\
  \ Nightmare JS 框架如何作为我们 Fiori 应用单元测试的第二个选项。\n\nNightmare JS 使用模拟用户与软件交互的函数，例如 `type`、`click`\
  \ 和 `goto`，并提供一个看似同步的 API，而不是像其他框架那样使用嵌套回调。请查看他们的 GitHub Read Me 页面以了解关于该框架的更多信息：[`github.com/segmentio/nightmare/blob/master/Readme.md`](https://github.com/segmentio/nightmare/blob/master/Readme.md)\n\
  \nNightmare JS 可以作为使用 Node JS 的项目添加，也可以作为独立的单元测试（Node JS）应用程序进行开发。按照 Nightmare JS\
  \ 框架的步骤，使用以下命令行从 npm 包安装该框架：\n\n```\nnpm install nightmare\n```\n\n运行安装命令后，请确保使用以下命令行安装所有依赖项：\n\
  \n```\nnpm install\n```\n\n在继续单元测试开发之前，请记住该框架具有模拟用户对网站操作的功能；因此，开始思考你的软件可能实现的用户自动化操作。可能还有其他框架能实现相同的步骤；不过，我将其包含在内是为了对比，看看它如何工作，以及用户在与不同单元测试框架交互以及使用开源软件时可能遇到哪些问题。\n\
  \n本书将尝试展示以下内容：\n\n1.  打开自定义应用并输入凭据进行身份验证\n2.  验证数据已加载到应用的主列表\n3.  从列表中点击某个项目以查看其详情\n\
  \n**图 4-7** 展示了演示第一个测试场景的初始 Nightmare JS 脚本。让我们仔细看看这个脚本中发生了什么。\n\n![../images/502765_1_En_4_Chapter/502765_1_En_4_Fig6_HTML.jpg](img/502765_1_En_4_Fig6_HTML.jpg)\n\
  \n**图 4-7** – Nightmare JS 单元测试框架\n\n1.  第 1 行加载了 `nightmare` JS 库\n\n\n\n2.  `Line\
  \ 7` 有一个对象，用于脚本内部的应用程序配置设置。该对象包含的 `username`、`password` 和 `home page URL` 等设置均在测试中使用。\n\
  \n3.  `Line 14` 初始化测试。\n    1.  `Line 15` 的 `show` 属性允许框架打开一个窗口实例，向用户展示整个测试的自动化过程。\n\
  \n2.  `Line 16` 传递 `switches`；由于我们没有安全套接层（SSL），该练习必须提供一个标志来忽略此类证书验证。\n\n3.  `Line\
  \ 20` 使用 `goto` 命令打开应用程序。\n\n4.  `Line 21` 和 `Line 22` 自动执行应用程序的输入操作，将值分别设置到名为 `username`\
  \ 和 `password` 的输入字段中。\n\n5.  `Line 23` 点击提交按钮（该按钮包含 CSS 类 `.island-button`）。\n\n\
  6.  `evaluation` 函数调用页面中的一个函数，用于从 `goto` 步骤访问的页面中检索信息。\n\n7.  `then` 函数返回一个承诺（`line\
  \ 29`），我们可以看到，如果用户已通过身份验证，则在控制台打印显示用户名；否则，在我们的负面测试场景中，显示一条错误信息，如图 4-8 所示。\n\n![../images/502765_1_En_4_Chapter/502765_1_En_4_Fig7_HTML.jpg](img/502765_1_En_4_Fig7_HTML.jpg)\n\
  \n**图 4-8**\nNightmare JS 脚本的控制台输出\n\n这是运行同一测试用例时交互式窗口的外观（窗口自动打开，脚本填充输入字段，并点击“登录”按钮）。请注意，这不是浏览器窗口，而是由\
  \ Nightmare 在后台运行 Electron 框架打开的窗口，如图 4-9 所示。\n\n![../images/502765_1_En_4_Chapter/502765_1_En_4_Fig8_HTML.jpg](img/502765_1_En_4_Fig8_HTML.jpg)\n\
  \n**图 4-9**\n使用 Nightmare JS 自动填充表单\n\n在多次尝试继续使用 Nightmare JS 框架后，我不断遇到与安全设置相关的问题。我尝试向\
  \ `switch` 对象添加属性以忽略这些证书错误；尽管如此，在运行回调时，Nightmare JS 框架无法渲染单元测试的下一步。\n\n我尝试过的几种方法包括：在点击“登录”按钮后等待主列表选择器，但由于应用程序渲染存在安全问题，该选择器从未渲染到\
  \ Electron 窗口中。我尝试的下一步是在其他用户代理（如 Firefox 或 Chrome）中打开 Nightmare JS 应用程序，但由于同样的安全问题，用户代理无法工作，代码立即停止执行。我尝试添加开发者工具，以查看是否有其他来自应用程序的错误阻止了框架打开\
  \ Fiori 应用程序。我在 `switches` 语句内部使用了 `openDevTools` 设置，如图 4-10 所示。\n\n![../images/502765_1_En_4_Chapter/502765_1_En_4_Fig9_HTML.jpg](img/502765_1_En_4_Fig9_HTML.jpg)\n\
  \n**图 4-10**\nNightmare JS 的 switches 设置\n\n这个 `switch` 语句成功打开了开发者工具，如图 4-11 所示；然而，开发者工具在应用程序的组件预加载阶段挂起，不幸的是，该练习无法继续使用此框架。这对我以及尝试评估各种框架的其他读者来说都是一个很好的教训。问题就变成了：开发者应该在什么时候继续在当前框架上投入时间，而不是转而评估和实施其他框架？\n\
  \n![../images/502765_1_En_4_Chapter/502765_1_En_4_Fig10_HTML.jpg](img/502765_1_En_4_Fig10_HTML.jpg)\n\
  \n**图 4-11**\nNightmare JS 打开 devTools\n\n鉴于前述 Nightmare JS 的所有问题和设置，现在是时候进入下一个单元测试框架了。该框架拥有大量追随者，并因其久经考验的能力而成为最流行的框架之一。此外，该框架之所以获得认可，是因为它提供了许多大多数开发者在手动测试自定义\
  \ Fiori 应用程序开发时已经熟悉的功能。\n\n\n\n## Puppeteer\n\n`Puppeteer` 是由谷歌开发的优秀 JavaScript\
  \ 框架，也是目前可用的最佳测试框架之一。`Puppeteer` 使用 `Node.js` 作为其 JavaScript 语言，可用于在我们的 Fiori 应用程序及任何其他\
  \ Web 应用程序中自动化执行单元测试。探索此工具的开发者还需要了解 DOM 选择器以及 Google Chrome 浏览器提供的常用浏览器开发者工具。该框架的主要特性在于，它提供了一套\
  \ API 用于控制 DevTools 协议。请查看图 4-12，了解 `Node.js` 脚本如何与 `Puppeteer` API 交互，进而与 Chrome\
  \ 开发者协议（`CDP`）以及无头 Chrome 进程交互的不同层级。\n\n![../images/502765_1_En_4_Chapter/502765_1_En_4_Fig11_HTML.jpg](img/502765_1_En_4_Fig11_HTML.jpg)\n\
  \n**图 4-12** Puppeteer 架构\n\n### 无头浏览器与有头浏览器\n\n您可能会好奇无头浏览器是什么意思。这意味着脚本可以自动化执行，而无需打开浏览器窗口。使用\
  \ `CDP`，`Puppeteer` API 可以模拟浏览器所具备的一切功能，而无需实际打开它。有时，我们需要使用有头浏览器（即打开窗口）来查看脚本与浏览器本身之间的自动化交互。此外，有头\
  \ `Puppeteer` 进程可以附加浏览器开发者工具，以便用户能在运行时进行交互并更新数值。\n\nDevTools 协议页面对其自身描述如下：*“开发者可以使用此\
  \ DevTools 协议来检查、交互、调试和分析 Chromium、Chrome 以及其他基于 Blink 的浏览器。”*\n\n在本章前文，我们还提到了单元测试、负责验证开发工作的不同角色，以及用于完成这些任务的一些工具。大多数\
  \ Web 开发者都熟悉按下 `F12` 键后弹出的浏览器工具。有些开发者使用此工具已久，但只关注其中部分用于调试代码的功能——例如查看文件在特定网络请求期间何时加载——也有一些开发者在开发完成并验证后，使用浏览器来截图。某些流程有时要求截图，以证明开发工作确已进行、已经过验证，并可参考程序的代码在变更前后的运行状况。开发者工具中还有其他标签页，提供了额外的功能，但开发者通常不会深入接触，或者尚未有机会探索。借助\
  \ `Puppeteer`，这些工具及其特性与功能均可通过编程方式进行交互。\n\n### 安装 Puppeteer\n\n安装 `Puppeteer` 需要使用\
  \ `npm` 命令，如图 4-13 所示。\n\n![../images/502765_1_En_4_Chapter/502765_1_En_4_Fig12_HTML.jpg](img/502765_1_En_4_Fig12_HTML.jpg)\n\
  \n**图 4-13** 使用 `npm` 安装 `Puppeteer` API\n\n安装完成后，一个 `node` 脚本如图 4-14 所示。此脚本将用于演示如何在自定义的\
  \ Fiori 示例应用程序中使用 `Puppeteer`。请注意，此 `Puppeteer` 脚本是作为独立于自定义 Fiori 应用程序的程序开发的，本书展示了使用\
  \ Visual Studio Code 编辑器来开发它。该脚本如图 4-14 所示。\n\n![../images/502765_1_En_4_Chapter/502765_1_En_4_Fig13_HTML.jpg](img/502765_1_En_4_Fig13_HTML.jpg)\n\
  \n**图 4-14** 示例 `Puppeteer` 脚本\n\n您可能会好奇为什么本书使用 Visual Studio Code。这是因为这是一款免费的编辑器工具，在开发和使用\
  \ `Node.js` 及其他编程语言时，通过启用相应的扩展，它拥有出色的特性。\n\n此外，我很高兴地告诉大家，使用 `Puppeteer` 框架是多么简单。它比本章介绍的其他框架都要容易上手。`Puppeteer`\
  \ 官方网站上有大量的文档，地址如下：[`https://devdocs.io/puppeteer/`](https://devdocs.io/puppeteer/)，此外在本书编写过程中查阅的其他来源，如\
  \ YouTube 视频和谷歌搜索结果等，也提供了丰富资料。\n\n### 探索 Puppeteer 脚本\n\n现在，让我们来探索上述脚本包含的内容及其功能。\n\
  \n![../images/502765_1_En_4_Chapter/502765_1_En_4_Fig14_HTML.jpg](img/502765_1_En_4_Fig14_HTML.jpg)\n\
  \n**图 4-15** 有头 `Puppeteer` 脚本启动 Fiori 应用程序\n\n1.  **第 1 行** 加载了 `Puppeteer` Node.js\
  \ 库（安装之后）\n2.  **第 3–5 行** 用于应用程序配置。为简化练习步骤，配置包含在同一个脚本中；不过，它也可以重构或从其他文件读取\n3.  **第\
  \ 9 行及以下** 包含了正在被单元测试的主函数\n    1.  请注意，该框架从入口点开始就采用了异步编程；因此，您会在后续代码行中看到 `await`\
  \ 关键字。\n4.  **第 10 行** 初始化 `Puppeteer` 框架的一个新实例，并使用一些默认设置启动它，例如以**有头**模式启动（`headless:\
  \ false`），并忽略 HTTPS 错误（由于缺少证书）。\n5.  由于我们的自定义 Fiori 应用程序启用了路由认证，练习从打开应用程序的主页开始，并且必须先进行认证才能打开应用程序本身，如图\
  \ 4-15 所示。\n6.  使用 `headless: false` 标志是为了可视化应用程序的运行过程，如图 4-15 所示。请注意在打开的浏览器窗口中，地址栏正上方有一条消息显示“Chrome\
  \ is being controlled by automated test software”（Chrome 正由自动化测试软件控制），这意味着它确实是在运行我们的脚本。\n\
  \n脚本打开有头浏览器后，立即输入用户名和密码，并点击“登录”按钮，应用程序随后会重定向到自定义的 Fiori 应用程序，如图 4-16 所示。\n\n![../images/502765_1_En_4_Chapter/502765_1_En_4_Fig15_HTML.jpg](img/502765_1_En_4_Fig15_HTML.jpg)\n\
  \n**图 4-16** 认证后由 `Puppeteer` 脚本打开的 Fiori 应用程序\n\n### 验证主列表控件\n\n`Puppeteer` 脚本中下一个要验证的单元测试是确保主列表控件包含一个设备列表。请确保您知道列表控件的选择器标识符。在此例中，选择器是\
  \ `#__xmlview1--masterList-listUl`。该选择器被识别为 SAPUI5 框架赋予的 ID。使用 `Puppeteer` 的 `waitForSelector`\
  \ 函数，传入我们在 `appSettings.masterListSelector` 中定义的选择器，并传递给该函数。在回调函数中，我们简单地将结果元素输出到控制台，以确保该项存在。如果您好奇回调函数中还有哪些其他属性，可以在调用\
  \ `waitForSelector` 函数之前以及 `then` 回调内部设置断点，以检查这些对象。请查看图 4-17，了解等待选择器并对其进行检查的更多实现细节。\n\
  \n![../images/502765_1_En_4_Chapter/502765_1_En_4_Fig16_HTML.jpg](img/502765_1_En_4_Fig16_HTML.jpg)\n\
  \n**图 4-17** `Puppeteer` 脚本等待选择器\n\n\n\n### 在 Puppeteer 脚本中需要验证的下一个单元测试是：确保点击设备列表项会填充详细信息视图（屏幕右侧）。这个测试非常强大，因为我们模拟了用户与应用程序显示界面交互，以及点击列表项查看其详细信息的操作流程。\n\
  \n这里的棘手之处在于要理解列表可能包含 1 个、2 个或 100 个列表项，我们需要确保不仅能选中第一个列表项，还能选中列表中的任意一个列表项。我的第一个想法是基于\
  \ jQuery 规则或某些选择器来选取列表的子元素，并获取第 `n` 个元素。然后，我进一步思考，记起了 JavaScript 语言的 `Math` 库中有一个\
  \ `random` 函数。于是我加入了一个变量，用于获取一个介于 0 和列表项长度之间的随机数。一旦随机数确定，我们就需要点击该元素——没错！大声说出这个想法感觉非常好，但下一个障碍是如何从列表中获取随机元素，然后以某种方式点击它。\n\
  \n在图 4-18 中，你可以看到我新增的函数，它让 Puppeteer 框架根据元素 `ul`（一个无序列表）和列表项 `li`（基于指定的 CSS 类）来等待选择器。这个\
  \ CSS 类是 SAPUI5 框架提供的，我通过打开开发者工具并识别出来。\n\n![../images/502765_1_En_4_Chapter/502765_1_En_4_Fig17_HTML.jpg](img/502765_1_En_4_Fig17_HTML.jpg)\n\
  \n**图 4-18** Puppeteer 脚本等待选择器、计算随机值并点击列表项\n\n在 Puppeteer 框架等待列表项后，这些列表项会被传递给回调函数，以便进一步检查，例如查看存在多少条记录。接下来，我在控制台中显示了这些列表项中的第一个。\n\
  \n然后，我计算了之前描述的随机值，并使用了 `return` 关键字，因为我希望在下一次回调中使用这个元素，我在下一次回调中基于当前回调函数返回的元素添加了\
  \ `click` 函数。这个框架确实允许对这些元素进行异步操作，同时还允许我们识别和计算一个场景后，将元素链式传递到下一个场景进行进一步检查和剖析，这真是太棒了。\n\
  \n我建议你仔细查看图 4-18 几次，了解所有 JavaScript 概念如何在这个框架中协同工作。\n\n![../images/502765_1_En_4_Chapter/502765_1_En_4_Fig18_HTML.jpg](img/502765_1_En_4_Fig18_HTML.jpg)\n\
  \n**图 4-19** Puppeteer 脚本选择随机列表项以显示其详细信息\n\n下一张截图，图 4-19，向读者展示了可以通过脚本方式完成的强大功能，同时我们也可以在真实窗口中看到这些操作，就像用户正在与我们自定义的\
  \ Fiori 应用程序进行交互一样。\n\n为了方便读者，在运行完上述场景后，Visual Studio Code 控制台显示的内容如图 4-20 所示。\n\
  \n![../images/502765_1_En_4_Chapter/502765_1_En_4_Fig19_HTML.jpg](img/502765_1_En_4_Fig19_HTML.jpg)\n\
  \n**图 4-20** Puppeteer 脚本的控制台输出\n\n最后但同样重要的是，我们可以编写 Puppeteer 单元测试脚本，使其在完成后自动关闭，方法是在主函数末尾取消注释\
  \ `await browser.close()` 这一行，如图 4-21 所示。\n\n![../images/502765_1_En_4_Chapter/502765_1_En_4_Fig20_HTML.jpg](img/502765_1_En_4_Fig20_HTML.jpg)\n\
  \n**图 4-21** 在 Puppeteer 脚本末尾关闭浏览器\n\n这次脚本运行后，它会快速打开窗口，运行不同的场景，并在执行结束时自行关闭。在图 4-22\
  \ 中，我们可以看到单元测试的日志，但由于脚本运行速度很快，人工因素未能捕获到运行时的截图。\n\n![../images/502765_1_En_4_Chapter/502765_1_En_4_Fig21_HTML.jpg](img/502765_1_En_4_Fig21_HTML.jpg)\n\
  \n**图 4-22** 运行完整脚本后的最终控制台输出\n\n到目前为止，我们已经使用 Puppeteer 框架运行了几个单元测试用例来展示用户与软件的交互；然而，没有一个测试场景显示网络请求，也没有显示应用与\
  \ OData 服务之间传输的数据。\n\n我将继续包含其中一个测试，以便我们拥有一个更完整的单元测试框架；这也是我们正在编写的自动化脚本的一部分。归根结底，我们还需要验证应用程序与后端系统之间来回发送的数据。话不多说，请看下文。让我们暂时移除浏览器的关闭命令，以便在关闭有头浏览器窗口之前，允许应用程序拦截和分析\
  \ API 的请求/响应，如图 4-23 所示。\n\n开发者可以观察到 Puppeteer 脚本显示以下内容：\n\n1. `page.on(‘request’,\
  \ InterceptedRequest => ...)` – 此回调允许开发者在请求发送到后端 API 之前对其进行分析。开发者可以查看当前值、编辑请求头、请求参数以及与\
  \ HTTP(s) 请求相关的任何其他设置。\n\n2. `page.on(‘response’, InterceptResponse => ...)` – 此回调允许开发者分析响应对象，包括响应本身、头信息、cookie、实际的响应数据，以及你在接收\
  \ HTTP(s) 响应对象时能想到的任何其他设置。\n\n为简化练习，Puppeteer 脚本还执行了一些 `console.log()` 语句，以便开发者在其单元测试期间看到这些值，如图\
  \ 4-23 所示。\n\n如果任何开发者希望查看回调中的其他值，他们还可以将鼠标悬停在请求/响应变量上来分析这些属性，或者在调试控制台中输入命令以查看特定对象的运行时值。\n\
  \n![../images/502765_1_En_4_Chapter/502765_1_En_4_Fig22_HTML.jpg](img/502765_1_En_4_Fig22_HTML.jpg)\n\
  \n**图 4-23** Puppeteer 脚本拦截网络请求和响应\n\n在本书前面，我们介绍了一个生成随机索引的函数，用于选择主列表控件。现在，让我们与自定义\
  \ Fiori 应用程序交互，从当前的 Puppeteer 窗口中手动选择一个记录，该记录在被拦截的 API 请求中包含附加记录。没错：在应用程序执行单元测试时，用户也可以与这个有头会话进行交互。\n\
  \n在图 4-24 中，用户已手动从主列表中选择了 DEVICE ONE 记录，你可以在后台应用程序（左侧白底图像）中看到所选项目的详细信息显示在应用程序中，同时\
  \ Visual Studio Code 控制台（图 4-24 右侧黑底部分）也显示了被拦截的请求（记录了请求方法 `GET`），以及被拦截的响应（状态 `200\
  \ OK` 并返回了 7 条记录，其中只有 5 条包含 Activity 属性，而这些正是显示在应用程序 Activity 选项卡下的记录）。\n\n![../images/502765_1_En_4_Chapter/502765_1_En_4_Fig23_HTML.jpg](img/502765_1_En_4_Fig23_HTML.jpg)\n\
  \n**图 4-24** 手动选择的列表项用于分析被拦截的响应对象\n\n\n\n### Puppeteer 练习总结\n\n因此，Puppeteer 的练习到此结束；我真心相信这个框架为我们的单元测试章节增添了巨大的优势和好处。从`QUnit`框架开始，它与我们的应用程序非常接近，并很好地集成了`SAPUI5`框架，大多数开发者可能会感到舒适，无需进行任何额外设置或配置——这些有时可能过于繁琐或耗时，就像我遇到的`Nightmare\
  \ JS`框架那样。接着谈到`Puppeteer`框架，我发现这个框架拥有一些高级功能，同时在大多数我研究或偶然发现的在线资源中都有非常完善的文档记录。我由衷地并强烈推荐`Puppeteer`给任何从事\
  \ Web 开发的人，因为它是一个如此干净且易于使用的框架，几乎涵盖了开发者在软件开发过程中需要测试的所有可能测试用例：从通过输入用户名和密码来验证用户，到触发按钮或链接的点击事件，再到拦截加载或发布数据时的`http(s)`请求。这个框架确实赢得了我心中最佳单元测试框架的选票，我很高兴能在构建和验证自定义\
  \ Fiori 应用程序时将其作为一个外部选项来使用。如果用户需要查看测试过程中发生的情况，使用有头和无头功能的选项极其重要。一旦他们对开发感到满意，他们可以选择在单元测试脚本中使用无头模式来最小化处理过程。向`Puppeteer`团队致敬，打造出如此出色的产品。\n\
  \n## 单元测试带来的改进\n\n单元测试在开发软件应用程序时是有益的；然而，对于开发者来说，这不仅仅是证明他们的工作正确无误。开发者有时会觉得这类任务很繁琐，而客户有时则认为这是一项不必要的开支。在本节中，本书将展示几个场景，证明之前的这些假设是错误的。\n\
  \n1.  **单元测试如何让我的代码变得更好？**\n\n理解任务并能够测试它，让开发者能够根据需求展示其工作。编写单元测试允许开发者以编程方式双倍检查自己的工作，以防由于需求变更或软件产品增强而需要多次更新。如果开发者不仅开发需求，而且理解其软件必须接受的测试场景，他们会在自己的技艺上变得越来越好。此外，自动化工作对于注入不同的测试值至关重要，例如在`Puppeteer`示例中展示的那样，其中利用生成随机数来触发读取\
  \ API 操作，以检索链接到列表项的详细信息。\n\n2.  **单元测试如何节省我的项目时间？**\n\n有些情况下，软件产品需要以增量阶段构建。如今，大多数公司遵循敏捷方法论，软件产品经过多次迭代和业务用户的反馈而发展。手头有一个脚本化的单元测试框架将减少交付这些增强功能所需的时间，以及验证新软件添加或更改所需的时间。消除人工运行这些单元测试的因素是节省总体时间的一种方式，并使项目在引入这些更改/集成时更加稳健。此外，如果我们软件的多个部分都遵循这些单元测试框架，那么我们还可以自动化测试，以最小化开发后和部署后的时间，就像大多数公司在集成和回归测试期间所做的那样。\n\
  \n3.  **我的单元测试如何为我的软件带来改进？**\n\n性能改进可以通过不同的方式展示：\n    -   应用程序启动时的性能\n    -   加载\
  \ (MVC) 视图时的性能\n    -   访问外部资源（如图像或其他脚本）时的性能\n    -   从 Web 服务加载数据时的性能\n\n请记住，在软件项目初期创建单元测试脚本会需要一些额外的时间，而同一软件产品的后续增强可以利用这些测试用例场景，从长远来看使开发及其与其他系统的集成更加稳健。\n\
  \n根据其他自定义 Fiori 应用程序的经验，其他改进包括但不限于以下内容：\n\n![../images/502765_1_En_4_Chapter/502765_1_En_4_Fig26_HTML.jpg](img/502765_1_En_4_Fig26_HTML.jpg)\n\
  \n图 4-27\n精简的外部库\n\n1.  将`SAPUI5`应用程序设置为异步加载，如图 [4-25] 所示。\n\n![../images/502765_1_En_4_Chapter/502765_1_En_4_Fig24_HTML.jpg](img/502765_1_En_4_Fig24_HTML.jpg)\n\
  \n图 4-25\n异步引导`SAPUI5`\n\n您也可以在“网络”选项卡中观察正在加载的资源，如图 [4-26] 所示。\n\n![../images/502765_1_En_4_Chapter/502765_1_En_4_Fig25_HTML.jpg](img/502765_1_En_4_Fig25_HTML.jpg)\n\
  \n图 4-26\n显示预加载资源的“网络”选项卡\n\n2.  精简 JavaScript 文件以改善应用程序加载性能（确保您的文件经过精简过程；它们的扩展名可能是`*.min.js`）。精简过程也可以应用于样式表文件。在本书的练习中，使用了两个`js`库：`jQuery`库和`moment.js`库。两者都已精简，如图\
  \ [4-27] 所示。\n\n![../images/502765_1_En_4_Chapter/502765_1_En_4_Fig28_HTML.jpg](img/502765_1_En_4_Fig28_HTML.jpg)\n\
  \n图 4-29\n异步资源加载\n\n![../images/502765_1_En_4_Chapter/502765_1_En_4_Fig27_HTML.jpg](img/502765_1_En_4_Fig27_HTML.jpg)\n\
  \n图 4-28\nOData 服务发起批处理请求\n\n3.  如果您的自定义应用程序使用图像文件，请确保图像质量良好且其大小能够快速读取并加载到应用程序中。运行浏览器开发者工具查看加载这些图像的时间，可以改善您的加载时间。\n\
  \n4.  利用 SAP 图标执行应用程序中所需的某些操作。由于`SAPUI5`框架提供的图标已经是同一库的一部分，您可以利用这些图标。此外，使用这些图标（如练习中图标标签栏中包含的图标）也有利于您的\
  \ Fiori 开发，因为您所包含的资源符合框架的规则和指南。\n\n5.  从 OData 服务加载数据的改进包括：能够设置`SAPUI5`控件聚合器以按需加载此类数据，并设置一个可见元素数量作为阈值，从而使控件仅加载最终用户所需或可见的内容。遵循这条建议，确实使我们的自定义\
  \ Fiori 应用程序具有现代快速 Web 应用程序的外观和感觉，如图 [4-28] 和 [4-29] 所示。\n\n\n\n## 结语\n\n在本章即将结束之际，我怀着苦乐参半的心情，想与所有读者分享这些经验。有些开发框架（无论是用于单元测试还是非单元测试的）只需简单配置即可使用，而使用这些框架时，有时可能需要掌握更多高深和精深的技术知识。我建议所有开发者在决定采用、研究并推行某个框架之前，先熟悉几个备选方案。在我们的项目中，还有其他因素（如时间和资源）可能会限制我们，而这些额外因素正是导致项目有时最终采用简单的单元测试框架，有时却采用更优雅解决方案的主要原因——正如我发现\
  \ Puppeteer 是目前最优雅且最简单的解决方案之一。\n\n分析每个框架的优缺点应当成为单元测试设计的一部分。此外，当开发者涉足全新领域时，查阅现有文档应当成为采用某个框架的驱动因素。我发现\
  \ Puppeteer 是我最偏爱的单元测试框架，尽管由于本文篇幅和时间所限，我只触及了该框架的皮毛。希望你能利用练习中分享的一些脚本，入门或拓展你在单元测试框架方面的知识。最后但同样重要的是，如果你仍对自动化测试感到不适应，还有一些手动方式供你入门单元测试：我们都是从某个起点开始的，希望你先掌握手动步骤，然后再涉足这些企业级信誉良好的选项。如果你决定深入研究\
  \ QUnit、Nightmare JS 或 Puppeteer，我期待听到你的反馈。祝你实施顺利！\n\n"
- "# 5. 部署自定义 Fiori 应用\n\n欢迎来到《自定义 Fiori 应用》的最后一章。这一章令人兴奋，因为迄今为止所介绍的所有内容，现在都将被提升到另一个环境，以便供开发者之外的人员使用。部署应用不仅仅是复制文件或点击按钮，让软件从本地工作区或开发环境迁移到质量环境，甚至最终迁移到生产环境。在将软件部署到上游环境之前，可能有一系列项目需要验证。根据公司的政策，在软件开发生命周期中可能会遵循某些步骤，包括审批和发布软件的相关步骤。在发布此应用或其他\
  \ Web 应用之前，可能需要满足某些非技术性要求。\n\n本书假设在执行后续步骤之前，先决条件已经满足——文档已更新、质量保证测试已通过、用户验收测试已完成、且已获得管理层的批准。此外，在\
  \ SAP Cloud Platform 或 Amazon Web Service 环境中使用的任何外部账户都已被创建。\n\n## 准备部署和软件版本管理\n\
  \n在准备和发布软件时，可以在多个位置跟踪应用本身的版本，以及用于审计目的。作为软件的开发者和技术负责人，我们还必须跟踪与外部软件库的不同集成点。在这个自定义\
  \ Fiori 应用中，本书使用了表 5-1 所示的版本。\n\n表 5-1\n\nFiori 应用开发过程中使用的软件版本\n\n| 软件或库 | 版本 |\
  \ 如何确定版本 |\n| --- | --- | --- |\n| HANA XSA | HANA 2 SPS 04 | HANA XSA 安装 |\n| Fiori\
  \ UX | 3 | 在 `index.html` 中配置 |\n| SAPUI5 | 1.80.1 | 浏览器中按 `Ctrl + Shift + Alt +\
  \ P` |\n| Node JS | 12.16.1 | 命令行中执行 `cmd node -v` |\n| NPM | 6.13.4 | 命令行中执行 `cmd\
  \ npm -v` |\n| JQuery | 3.1.0 | 从 IDE 中打开文件 |\n| Moment.JS | 2.27.0 | 从 IDE 中打开文件\
  \ |\n| QUnit | 2.10.1 | 从 IDE 中打开文件 |\n| Nightmare JS | 3.0.2 | 从 IDE 中的 `node_module`\
  \ |\n| Puppeteer JS | 5.2.1 | 从 IDE 中的 `node_module` |\n| OData | v2 和 v4 | 浏览器中文件的元数据\
  \ |\n| `mta.yaml` | 0.0.1 | 由开发者在 SAP Web IDE 中配置 |\n\n如你所见，示例自定义 Fiori 应用中有许多集成点，需要关注和维护它们，同时确保无论用什么开发，当它到达生产环境时也能得到维护。当由于问题（可能并非\
  \ Fiori 开发者实现的功能的一部分）而报告问题和错误时，保留软件版本信息极为重要；有时，这些问题可能源于这些外部库或模块的依赖关系。通常，公司可能会对遵循合规流程的公司进行审计，在这种情况下，拥有此类文档证据总是非常有用的。\n\
  \n你可能想知道，在开发自定义 Fiori 应用时，还有哪些其他原因需要保留版本信息。通常，外部依赖也可能发布新版本，在这种情况下，开发者可能需要查阅其文档和日志，以验证当前拥有的版本，并判断是否值得升级到新版本，或者新版本是否与其环境的其余部分兼容。当软件普遍可用时，有一些通用指导原则；有时，新功能甚至可能需要新的硬件。有时，软件的小版本发布或补丁可能对自定义应用的开发和集成影响不大；在这种情况下，影响可能很小甚至没有，集成可以安全地采用。如果依赖项的升级是主版本发布，则建议分析新功能的影响、优缺点以及所带来的好处，以了解是否有必要计划升级。这是\
  \ SAP 软件或其他付费软件的常见场景，它们会经历发布周期，为其客户提供最新、最强大的功能。\n\n如表 5-1 所示，软件有多种版本。软件版本管理的最佳实践将版本模式描述为\
  \ `X.Y.Z`，其中\n\n1.  **X** 代表主版本号。主版本意味着软件中增加了多种功能并已发布。\n\n2.  **Y** 代表次版本号。次版本意味着软件中增加了一个小功能并已发布。\n\
  \n3.  **Z** 代表补丁号。补丁号意味着软件的一个不同构建版本已被添加并发布。\n\n\n\n如果您想知道如何维护我们的自定义 Fiori 应用程序，请查看`mta.yaml`文件，它位于\
  \ SAP Web IDE 中 Fiori 项目的 SAPUI5 模块内。打开 SAP Web IDE，导航到该项目，打开名为`waveui`的 UI5 模块，然后双击`mta.yaml`文件，如图\
  \ 5-1 所示。\n\n![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig1_HTML.jpg](img/502765_1_En_5_Fig1_HTML.jpg)\n\
  \n*图 5-1 `mta.yaml`版本*\n\n在此图中，读者可以看到*应用程序版本*被标识为`0.0.1`；这意味着这是正在开发的软件的初始版本。开发人员需要提出的下一个问题是，随着新功能的添加或产品在其生命周期中的演进，这个工作的版本如何递增。这是通过在`mta.yaml`文件中将版本`0.0.1`递增为`0.0.2`、`0.0.3`等来完成的，如图\
  \ 5-2 所示。此`mta.yaml`文件仅当开发在遵循 Cloud Foundry（CF）原则的 XSA 环境中进行时才存在。请注意，此开发工件（文件）在\
  \ SAPUI5 应用程序的 XS 经典版本中不存在。\n\n![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig2_HTML.jpg](img/502765_1_En_5_Fig2_HTML.jpg)\n\
  \n*图 5-2 构建项目以生成`mtar`文件*\n\n在项目级别运行构建过程的结果是创建一个`mtar`文件（MTA = 多目标应用程序归档），这是用于将软件从\
  \ SAP Web IDE 部署到目标环境的主要文件，如图 5-3 所示。这是一个二进制文件，仅用于部署目的。\n\n![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig3_HTML.jpg](img/502765_1_En_5_Fig3_HTML.jpg)\n\
  \n*图 5-3 `mtar`生成的文件*\n\nSAP Web IDE 具有通过选择部署代码（`mtar`文件）然后从 SAP Web IDE 中选择`Deploy`菜单来部署此开发代码的功能，如图\
  \ 5-4 所示。一旦选择了`Deploy`菜单，开发人员就可以选择是部署到 SAP Cloud Platform，还是部署到 XS Advanced 环境（本地部署），如图\
  \ 5-4 所示。在本章末尾，将有一个类似的练习，使用相同的工具 SAP Web IDE；然而，它将用于部署到 Amazon Web Services（AWS）。\n\
  \n![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig4_HTML.jpg](img/502765_1_En_5_Fig4_HTML.jpg)\n\
  \n*图 5-4 选择部署 Fiori 应用程序的目标环境*\n\n下面展示了部署到本地 XS Advanced 环境的过程，以查看开发实例（由唯一标识符以及`sapui5`模块`waveui`的名称标识）如何与由其模块名称`waveui`标识的已发布实例一起显示，如图\
  \ 5-5 所示。\n\n![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig5_HTML.jpg](img/502765_1_En_5_Fig5_HTML.jpg)\n\
  \n*图 5-5 部署到 XSA 后 Fiori 应用程序的多个实例*\n\n部署到 XSA 环境后，开发人员和用户会收到一个与开发期间使用的`URL:PORT`组合不同的`URL:PORT`组合，以此区分他们的应用程序部署到了哪里。访问这个新的\
  \ URL 将把他们带到目标环境中的应用程序。请记住，这两个应用程序都保存在控制台的`Applications`页面中，因为它们并行运行，并部署到不同的端口，就像它们是微服务一样。这是一个非常令人兴奋的话题，最近获得了很大的关注。请查阅我的书*《Microservices\
  \ in SAP HANA XSA》*（Apress, 2020）以了解更多关于微服务的信息。\n\n如果您想了解 Fiori 应用程序如何开发到 SAP Cloud\
  \ Platform，请继续执行接下来的几个步骤。请注意，同一个应用程序可以部署到多个端点；但是，开发人员必须确保他们的 Web 应用程序能够访问其正在使用的任何\
  \ OData 服务。当您的 OData 服务和 Fiori 应用程序具有不同域时，请运行一些集成验证。可能还需要执行其他步骤，例如，在 SAP Cloud Platform\
  \ 中创建目标（`Destination`）以信任目标 URL，启用 CORS（跨域资源共享），甚至让您的网络团队参与进来，以允许 Fiori 应用程序进行外部域调用。要创建目标，请转到\
  \ SAP Cloud Platform Cockpit，并从左侧导航列表中选择`Destinations`菜单项，如图 5-6 所示。\n\n![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig6_HTML.jpg](img/502765_1_En_5_Fig6_HTML.jpg)\n\
  \n*图 5-6 SCP 中的目标*\n\n然后，按照图 5-7 中的步骤，提供必要的信息以从 SAP Cloud Platform 访问和测试目标。同一个屏幕允许\
  \ SCP 管理员设置受信任的证书。\n\n![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig7_HTML.jpg](img/502765_1_En_5_Fig7_HTML.jpg)\n\
  \n*图 5-7 创建目标、导入目标或证书的目标详情*\n\n要将 Fiori 应用程序部署到 SAP Cloud Platform，开发人员必须在该平台中拥有一个账户，允许他们创建、部署和维护应用程序，并进一步在云环境中设置其他设置。SAP\
  \ Cloud Platform 架构基于 CF 架构。SAP Cloud Platform 的 Neo 版本不遵循这些标准。在展示将 Fiori 应用程序部署到\
  \ SCP 的步骤之前，请确保理解并掌握 CF 架构模型。在我的另一本书*《Building Microservices in SAP HANA XSA》*（[`https://www.apress.com/us/book/9781484261170`](https://www.apress.com/us/book/9781484261170)）中，有更多关于\
  \ CF 以及使用 SAP HANA XSA 构建微服务的信息。\n\nCF 是一个开源的云应用平台。CF 由 IBM、SAP、Microsoft、Google\
  \ 等公司组成，共同制定行业标准，使应用程序能够在云提供商之间运行，从而让开发人员专注于应用程序开发，而不是创建云。创建 CF 就绪的应用程序的好处之一是，这些应用程序本质上与基础设施解耦，因此当它们准备好迁移到本地部署、公共云或其他私有云时，这些应用程序可以轻松地从一种环境/云迁移到另一种环境/云。在开始介绍应用程序之前，有必要先了解\
  \ CF 的层次组织以及我们将要交互的一些重要概念：组织（`Organization`）、空间（`Space`）、应用程序（`Application`）、服务（`Service`）和角色（`Role`），如图\
  \ 5-8 中的截图所示。\n\n![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig8_HTML.jpg](img/502765_1_En_5_Fig8_HTML.jpg)\n\
  \n*图 5-8 CF 层次结构架构*\n\n1.  一个组织（`org`）被定义为一个开发账户，其中拥有一个或多个开发者（称为贡献者），他们通过用户账户拥有访问权限。这些贡献者被分配了特殊角色，以管理、审计和构建云就绪应用程序，或授予他人访问权限。为了演示目的，本书提供的示例将有一个已经创建且处于活动状态的组织。只有管理员可以更改此`org`的状态；但是，我们将在剩余练习中假设它处于活动状态。\n\
  \n\n\n2.  在一个组织内，可以包含一个或多个空间。空间被定义为组织内的一个分区，专门用于构建、部署和维护应用程序。每个应用程序都归属于一个空间。拥有应用程序最终需要授予访问该应用程序的角色。应用程序角色属于且仅属于一个空间。\n\
  \n3.  应用程序和服务是 CF 层级结构中的下一级。这些应用程序和服务允许用户展示和使用数据。\n\n4.  用户可能被分配一个或多个角色（角色集合是模板）。这些角色允许用户开发、访问、管理或审计应用程序、空间甚至组织。应用程序安全是软件系统中非常复杂的部分。云（以及\
  \ HANA XSA）中的安全性本身就是一个广泛的话题。目前已有几本其他书籍详细解释了 SAP HANA XSA 的安全性。对于本书，其中已实现了足够的安全性来从\
  \ Fiori 应用程序访问 OData 服务。\n\n有多种方式可以与 CF 实例进行交互。其中一种是通过命令行界面（CLI）。CLI 可以与 Linux 命令结合使用，例如\
  \ `pipe`、`grep` 等。我们需要使用各种命令与云/XSA 架构进行交互，例如登录、设置服务，以及创建、编辑、构建、部署甚至扩展应用程序或服务。CF\
  \ CLI 是一个多功能工具，允许开发者与其云实例进行交互。它易于自动化和编写其他流程的脚本，否则这些流程需要人工输入命令。它最大限度地降低了与云交互时引入错误的风险，并使其对需要了解云容器细节的开发者和管理员保持可用性。\n\
  \n此类命令的示例如下\n\n```\ncf login           # 登录云实例\ncf apps | grep      # 从应用程序列表中检索应用程序\n\
  cf push             # 将应用程序推送到 cf 实例\ncf scale -m -i \n```\n\n可用命令的完整列表在此处显示： [`http://cli.cloudfoundry.org/en-US/cf/`](http://cli.cloudfoundry.org/en-US/cf/)\n\
  \n此外，一旦在系统上安装了 CF CLI，可以运行 `cf --help` 命令来查看如何使用一个命令及其可用的标志，如图 5-9 所示。\n\n![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig9_HTML.jpg](img/502765_1_En_5_Fig9_HTML.jpg)\n\
  \n图 5-9\n\nCF CLI\n\n要将我们的 Fiori 应用程序部署到 SCP，请选择从工作区项目生成的 `.mtar` 文件，然后选择“Deploy\
  \ to”并选择 SAP Cloud Platform。当你了解了 CF 架构后，接下来需要选择要将应用程序部署到的空间。如果你正在运行 SAP Cloud 试用版，默认情况下，当你在平台内启用\
  \ CF 模式时，SCP 已经为你提供了一个组织。让我们看看在 SAP Cloud Platform 中检索所需设置的步骤。转到你的 SCP 账户（或免费注册一个）。登录后，你将看到如图\
  \ 5-10 所示的屏幕。\n\n![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig10_HTML.jpg](img/502765_1_En_5_Fig10_HTML.jpg)\n\
  \n图 5-10\n\nSAP Cloud Platform 试用账户\n\n然后，注意 SCP 在后台使用了 AWS，如图 5-11 所示。本书将在本章后面介绍\
  \ AWS。记住这些资源被创建的区域非常重要。\n\n![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig11_HTML.jpg](img/502765_1_En_5_Fig11_HTML.jpg)\n\
  \n图 5-11\n\n使用 AWS East（VA）区域的 SCP\n\n此过程如图 5-12 所示，可能需要几分钟才能完成。完成后，你将可以继续操作。\n\n\
