  \ 行的非常简单的测试。请注意，在第 11 行，该示例使用了一个函数，该函数进一步使用了一个名为 `moment` 的外部库。这个库帮助开发者处理 JavaScript\
  \ 中的日期和时间对象。`moment.js` 库与 `JQuery` 库一起被加载到 `qunitTest.html` 文件的 `head` 元素 XML 标签中。\n\
  \n第 14-29 行由于测试场景设置不正确而被注释掉了。这部分代码保留了下来，以展示开发者在设置测试用例时可能犯的一个典型错误。这段代码失败的原因是 `QUnit`\
  \ 测试用例与 `JQuery` 的 `getJSON` 函数一同执行，而 `getJSON` 是异步执行的，导致 `QUnit` 测试部分在到达成功回调之前就结束了，从而产生了错误的测试用例。\n\
  \n更深入地看一下图 4-4 中的函数，它展示了测试异步 JavaScript（`AJAX`）调用时的正确方法。这个 `QUnit` 测试嵌套在 `JQuery`\
  \ 的 `getJSON` 函数调用中。\n\n展示这个测试的目的是为了演示在 `QUnit` 框架上下文中调用异步 Web 服务的用法，以验证以下需求：\n\n\
  1.  执行 `OData` 调用（或 `REST API`）所需的时间\n2.  Web 开发的异步特性与单元测试协同工作\n3.  在一个测试中验证多个断言：\n\
  \    1.  通常，软件必须符合在软件产品创建之前建立的服务水平协议（`SLA`）。在我们的场景中，我们测试以确保 `OData` 服务的消耗时间少于约定的某个执行时间。\n\
  \    2.  本书在此场景中提出的第二个断言是 `OData` 调用包含至少一条记录（不应返回空数组）。\n    3.  第三个也是最后一个（但并非最不重要的）测试场景是用预期的对象结构来验证其中一个响应对象。\n\
  \n![../images/502765_1_En_4_Chapter/502765_1_En_4_Fig4_HTML.jpg](img/502765_1_En_4_Fig4_HTML.jpg)\n\
