  trans: '

    # 理解数据并在数据不可用时进行模拟


    在第 1 章中，本书描述了使用不同工具设计应用程序并与关键用户协作以创建成功设计的多种方法。在设计步骤中，有时用户会提供包含数据样本的电子表格，以便设计人员和开发人员能够在需要表示数据列表、单条数据或通过用户交互从屏幕输入的数据时进行可视化。在本章中，本书将逐步从设计概念过渡到更好地理解数据。理解数据非常重要，因为它适用于后端数据库系统，也适用于创建前端应用程序，使其能够高效运行，并仅呈现所开发应用程序/产品中的相关数据。在设计和创建应用程序时，理解数据是一个关键组成部分。


    开发人员有时会想知道，如果后端系统没有数据，他们应该如何开始开发应用程序。有时，开发人员会通过在应用程序中模拟硬编码的 `JSON` 对象来开始工作。幸运的是，对于大多数企业项目来说，数据通常来自
    ERP（企业资源规划）系统，并且有大量数据可供使用。这些系统中的数据模型通常创建为 CDS（核心数据服务视图，如果来自 SAP 或 SAP HANA），并作为
    `OData` 服务端点公开，这些端点可以轻松地从 `REST` 客户端或应用程序中使用。


    `CDS` 是 SAP 创建的一种脚本语言，允许开发人员创建设计时对象（例如实体（表）和数据模型（视图）），目的是在更接近数据库的位置完成大部分工作。`CDS`
    视图可能包含由 `UI5` 控件利用的附加注释，以减少前端编码量，并且这些数据注释由后端控制。即使后端系统表中没有数据，但只要数据模型已创建，`OData`
    服务就会生成一个元数据文件，该文件提供有关端点的信息，其中公开了数据模型，并且已知不同数据实体的数据类型。此外，`OData` 服务有时可能包含供应用程序使用的数据注释。


    让我将上一段分解为更小的部分：


    **表 2-1** OData V2 与 OData V4 对比


    | OData V2 | OData V4 |

    | --- | --- |

    | 微软开放规范承诺 (OPS) | 已通过 OASIS 和 ISO 批准 |

    | 数据以 atom/XML（默认）或 JSON 格式公开 | 数据以 JSON（默认）格式公开，XML 为可选 |

    | | `DateTime` 数据类型已弃用 |

    | | 改进了数据类型，例如 `Edm.Time` 已被 `Edm.Duration` 和 `Edm.Time of Day` 取代 |

    | 日期格式不存在 | 已添加 `Edm.Date` |

    | | `Edm.Float` 已被淘汰 |

    | | 允许同步请求 |


    ## OData


    这是一种（开放数据）协议/技术，可生成可由 Web 应用程序或其他 REST 客户端轻松使用的 `OData` 服务。`OData` 在 SAP Fiori
    中被广泛采用。它是在 SAP Fiori 应用程序中公开和使用数据的主要且首选方式。它也存在于其他技术栈中。`OData` API（也称为 `OData`
    服务）已发布多个版本。最常见的版本是 `OData v2`。`OData` 服务的最新版本是 `OData v4`。


    这两个版本具有以下相似点和不同点。Fiori 应用程序中使用的大多数 `SAPUI5` 控件都使用 `OData v2`。在表 2-1 中，我们可以看到这种比较。


    以下请求比较显示了相同类型请求的 `OData V2` 服务与 `OData V4` 服务请求的性能改进，并使用了名为 Northwind 的免费在线 `OData`
    服务，如图 2-1 和 2-2 所示。


    这两个版本之间性能改进的主要区别之一在于，`JSON` 格式的有效负载大小与返回 `XML` 有效负载的相同请求相比相对较小，如下所示。


    ![../images/502765_1_En_2_Chapter/502765_1_En_2_Fig2_HTML.jpg](img/502765_1_En_2_Fig2_HTML.jpg)


    **图 2-2** OData 服务 v4


    ![../images/502765_1_En_2_Chapter/502765_1_En_2_Fig1_HTML.jpg](img/502765_1_En_2_Fig1_HTML.jpg)


    **图 2-1** OData 服务 v2


    ![../images/502765_1_En_2_Chapter/502765_1_En_2_Fig3_HTML.jpg](img/502765_1_En_2_Fig3_HTML.jpg)


    **图 2-3** 显示实体集的 OData 服务元数据


    ## OData 实体


    `OData` 服务中公开的实体是指向已公开的后端数据模型的指针，这些模型可进一步用于 CRUD（创建、读取、更新、删除）操作。后端数据模型代表 `CDS`
    视图、表或其他入口点，客户端应用程序可以通过 HTTP(s) 协议与后端交互。您可以在 `OData` 服务中将不同的端点识别为实体集。如图 2-3 所示，您可以在请求
    `OData` 服务的元数据时看到这些实体集。


    ## OData 元数据


    创建 `OData` 服务时，其契约表示为同一服务的元数据。`OData` 服务元数据可以通过将 `/$metadata` 附加到 `OData` 服务 URI
    的末尾来定位。元数据文件是一个 `XML` 生成的文件，如图 2-3 所示。


    在将 SAP Fiori 应用程序映射到控件（如列表或表格）时，会使用应用程序的元数据，它利用服务的元数据来确定控件类型以及一些要绑定的属性，例如记录计数、要表示的数据标题、过滤器标签，以及在列表报告或工作列表模板中智能表格的情况下，能够为过滤器栏中使用的控件解释数据类型。这些附加属性可在图
    2-4 中看到。


    ![../images/502765_1_En_2_Chapter/502765_1_En_2_Fig4_HTML.jpg](img/502765_1_En_2_Fig4_HTML.jpg)


    **图 2-4** OData 元数据


    除了**实体集**（端点）和**实体类型**（端点定义）之外，`OData` 服务还提供导航属性。对于 Products 实体集，我们可以观察到它在图 2-5
    中有三个导航属性绑定。


    ![../images/502765_1_En_2_Chapter/502765_1_En_2_Fig5_HTML.jpg](img/502765_1_En_2_Fig5_HTML.jpg)


    **图 2-5** 显示实体集的 OData 服务元数据


    1. 导航属性绑定到 Category 目标

    2. 导航属性绑定到 `Order_Details` 目标

    3. 导航属性绑定到 Supplier 目标


    拥有导航绑定意味着什么？如果您猜到这允许这些实体在端点之间定义关系，那么您猜对了。导航属性是理解和跟踪从一个端点到另一个端点的数据关系的简单方法。这在应用程序中是一种非常常见的场景：显示数据列表，然后应用程序的用户希望向下钻取或*导航*到一个项目以查找有关特定记录的更多详细信息。


    另一个常用的 URL 语法特性是需要知道实体的记录数。要检索记录数，请参见图 2-6。

    '
- fmt: '![../images/502765_1_En_2_Chapter/502765_1_En_2_Fig6_HTML.jpg](images/502765_1_En_2_Chapter/502765_1_En_2_Fig6_HTML.jpg)


    **Figure 2-6** — OData service showing record count


    When testing out these OData services, developers can perform several types of
    requests to validate the web service they are consuming. These different ways
    to validate an OData service use different query syntax URLs provided by the OData
    protocol. The most common ones are shown in Table 2-2:


    **Table 2-2** — OData Operations and Operators


    | Description of test | URL Syntax |

    | --- | --- |

    | Get Service definition | `URL/Path` |

    | Get metadata | `URL/Path/$metadata` |

    | Get top N results | `URL/Path?$top=N` → N is a positive integer |

    | Get Entity | `URL/Path/Entity` → Get all records from Entity. Be careful when
    retrieving an entire Entity Set |

    | Filter Entity by property | `URL/Path/Entity?$filter={Prop} eq ''{SomeValue}''`
    • The `$filter` operator allows filtering by a property `{Prop}` • `{SomeValue}`
    represents a value than can be understood by the `{Prop}` being filtered by •
    `eq` (equal) is one of many operators that can be applied to a filter query; other
    operators that can be used are `ne` (not equal), `gt` (greater than), `lt` (less
    than), `contains` |

    | Get count of records | `URL/Path/$count` → returns the number of records from
    an entity |

    | Formatting data to JSON or XML | `URL/Path?$format=json` → XML is the default
    format in OData v2 or JSON is default in V4 |


    More information about the OData protocol and the OData service specification
    is found on their website at [https://www.odata.org/](https://www.odata.org/).


    One benefit of being able to use OData while binding data to any of the SAPUI5
    tables is that the UI5 framework understands how to build these requests and it
    makes them behind the scenes, taking the complexity away from the developer building
    the application. Further, the table control, as well as other controls that represent
    a list-like behavior, can be set for pagination, scroll to load, and other events
    triggering similar OData requests to retrieve data from the OData service when
    it is required. The reason behind making smaller requests is to avoid a huge data
    set being pulled and to increase performance while the user is navigating the
    data and loading data on demand. In Chapter 3, we will showcase how some of these
    controls build smaller OData requests, and we will show the Network tab from the
    browser to compare network requests and their response times.


    So far, the book has explained the OData protocol and a very common free sample
    OData service most developers are familiar with; the only purpose of it was to
    demonstrate the protocol, and how the request and response operations from these
    services work.


    How would we approach the same situation if we were starting to develop an application,
    however, in a case in which certain situations may prevent a developer from connecting
    directly to an OData service? These are real scenarios that happen every day and
    that developers may encounter when starting to develop new applications. If you
    can generate a metadata file, then you could simulate the data with the mock data
    feature of the SAP Web IDE.


    Let us proceed to showcase this same scenario of mocking the data. If you have
    an OData service and you can query its metadata XML file, start from there. In
    the next example, I am going to use an SAP HANA XSA OData service, which is explained
    with more details in the following. For now, let us analyze the metadata file
    and see how we can mock this data.


