    # AWS 上的 SAP HANA XSA


    SAP HANA XSA（免费）映像可在 AWS Marketplace 中找到，如图 5-22 所示。选择映像后，您需要选择要部署到的区域。该映像是一个预构建的实例，已包含一些必需的设置。使用映像可以加快启动和运行的速度。该映像已配置好的一些设置包括安全组网络规则以及卷存储，下文将进一步讨论。


    ![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig22_HTML.jpg](img/502765_1_En_5_Fig22_HTML.jpg)


    **图 5-22** – SAP HANA XSA 快捷版


    此 SAP HANA XSA 映像使用一个 `EC2` 实例 `m4.2xlarge`，该实例仅使用 `EBS` 存储，如图 5-23 所示。


    ![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig23_HTML.jpg](img/502765_1_En_5_Fig23_HTML.jpg)


    **图 5-23** – SAP HANA XSA – EC2 实例设置


    按照提示设置您的 XSA 环境。最终，您需要配置安全设置并开放一些端口，以连接到某些 HANA XSA 服务和将在 AWS 中托管的 SAP HANA XSA
    Web IDE；由于您使用了 SAP HANA XSA 映像，这些设置已就绪。您还需要生成或选择现有的密钥对，以便使用 Linux（如果使用 Windows，则使用
    `Putty`）连接到您的实例。如果您已有生成的密钥对，则可以使用该密钥对。我建议您创建一个新的密钥对，以便对整个环境进行一次干净的安装。


    上述 URL 包含了 SAP 官方网站上的所有步骤。如果操作正确，完成设置可能需要 30 分钟到 1 小时。


    我在设置过程中遇到的一些常见错误是：


    1.  理解 `Putty` 和 `Putty Key Gen` 之间的区别

    2.  基本了解如何使用 `XS CLI`

    3.  理解连接到 AWS 账户时使用密钥对证书的原因

    4.  从 `pem` 密钥生成 `ppk` 文件。在此步骤中，请确保选择私钥（而非公钥）

    5.  理解终端设置步骤，并确保知道在何时使用哪些命令


    请记住，尽管 HANA XSA 映像是免费的，但在使用过程中您仍然需要为 `EC2` 实例以及 `EBS` 存储付费。停止 `EC2` 实例并不会停止 `EBS`
    存储；因此，如果您决定停止 `EC2` 实例，除非您终止 `EC2` 实例和 `EBS` 卷，否则您仍需支付 `EBS` 服务的费用——您可能也会在月底收到账单时，通过这种惨痛的方式学到这一点。


    图 5-24 展示了终止 `EC2` 实例和 `EBS` 卷时的情形。执行此操作将清除您的所有数据，因此仅当您完全完成练习后，才可继续执行此步骤。


    请勿在生产环境中执行此步骤，除非您完全确定要永久删除所有内容！


    ![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig24_HTML.jpg](img/502765_1_En_5_Fig24_HTML.jpg)


    **图 5-24** – 终止 EC2 实例和 EBS 卷


    ## 部署您的应用程序


    在 AWS 中设置好 XSA 环境后，将应用程序部署到该环境的最简单方法是连接到您的 GIT 账户并检索自定义 Fiori 应用程序的代码。请参阅接下来的几个步骤，了解如何连接到
    GIT、拉取代码，然后使用在 AWS 中运行的 SAP Web IDE 将代码部署到 XSA 环境。


    ![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig25_HTML.jpg](img/502765_1_En_5_Fig25_HTML.jpg)


    **图 5-25** – 通过 XS CLI 验证 SAP Web IDE 的状态


    ### 步骤 1：验证 SAP Web IDE 状态


    确保 SAP Web IDE 已启动并正在运行。运行以下 `XS CLI` 命令，并注意状态显示为 `RUNNING Instances 1/1`，如图 5-25
    所示。


    ![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig26_HTML.jpg](img/502765_1_En_5_Fig26_HTML.jpg)


    **图 5-26** – GIT 账户详细信息


    ### 步骤 2：在 Web IDE 中配置 GIT


    打开浏览器，导航至 `hxehost:53075`（Web IDE 的默认端口），并以 `XSA_ADMIN` 或 `XSA_DEV` 账户登录。进入 SAP
    Web IDE 后，打开设置齿轮（左侧导航图标），并提供您的 GIT 提交者邮箱地址和用户名（它们必须与 GIT 账户详细信息匹配），如图 5-26 所示。


    ![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig28_HTML.jpg](img/502765_1_En_5_Fig28_HTML.jpg)


    **图 5-28** – GIT 仓库 URL


    ![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig27_HTML.jpg](img/502765_1_En_5_Fig27_HTML.jpg)


    **图 5-27** – 克隆仓库


    ### 步骤 3：克隆仓库


    返回工作区，右键单击并选择“克隆仓库”。出现提示时，提供用于克隆 GIT 仓库的 URL，如图 5-27 和图 5-28 所示。


    ### 步骤 4：构建模块


    克隆仓库后，自定义 Fiori 应用程序项目将出现在 SAP Web IDE 中。依次构建每个模块，从数据库模块开始，然后是 API 模块，最后是 UI 模块。如果提示您选择空间，请选择（默认的）开发空间，最后构建项目以生成
    `mtar` 文件，就像我们之前所做的那样，如图 5-29 所示。


    请密切关注 SAP Web IDE 控制台，以确保您的模块和项目构建成功（图 5-30）。如果出现任何问题，请先解决它们，然后再继续。只有当项目构建成功时，您才能进行部署。


    ![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig30_HTML.jpg](img/502765_1_En_5_Fig30_HTML.jpg)


    **图 5-30** – 从 SAP Web IDE 部署项目后的成功消息


    ![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig29_HTML.jpg](img/502765_1_En_5_Fig29_HTML.jpg)


    **图 5-29** – SAP Web IDE 在 AWS 中生成 mtar 文件


    ### 步骤 5：部署并验证


    打开 HANA XS Advanced Cockpit，查看此应用部署到的 URL，如图 5-31 所示。


    ![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig31_HTML.jpg](img/502765_1_En_5_Fig31_HTML.jpg)


    **图 5-31** – 用于 Fiori 应用程序的 HANA XSA URL


    然后，从您的浏览器导航到该 URL，以验证应用程序是否确实已部署（或者您可以使用第 4 章的 Puppeteer 脚本来自动执行此步骤），如图 5-32 所示。


    ![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig32_HTML.jpg](img/502765_1_En_5_Fig32_HTML.jpg)


    **图 5-32** – 在 AWS 上运行的自定义 Fiori 应用程序


    图 5-32 中的屏幕显示了一个空列表和一个空详情页面，这是因为 HANA 数据库目前不包含任何数据，毕竟这是一个全新的部署。但是，您可以通过使用 Puppeteer
    脚本并编辑 URL 值，或通过手动打开浏览器的网络选项卡并查看生成的请求（如图 5-33 所示），来验证 OData 服务是否确实已从自定义 Fiori 应用程序中调用。


    ![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig33_HTML.jpg](img/502765_1_En_5_Fig33_HTML.jpg)


    **图 5-33** – 网络选项卡请求标头和响应


    注意，图 5-33 中的远程地址显示我们的 XSA 应用程序正在 AWS 实例中运行。

