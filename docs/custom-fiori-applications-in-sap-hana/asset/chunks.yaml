  trans: '

    # 对象页面


    **对象页面：** 此模板用于提供特定记录的详细信息。它作为详细步骤使用，当用户从列表项点击导航并进入此处时生效。该模板用于提供关于某条记录的具体细节，包含标题级别的数据属性，如对象标题、编号、对象图片、名称、状态以及对象属性。


    此模板还可以包含选项卡，用于分隔并逻辑地显示与当前项相关的特定子类别的数据。某些 Fiori 应用在需要提供记录的详尽视图时会使用此类模板。如图 1-28
    所示。


    **布局** 从宏观上看，是供开发人员在屏幕上放置内容的占位符。布局有多种类型：例如，用于全屏的动态布局，如图 1-29 所示；以及具有两列或三列的灵活列布局，如图
    1-30 所示。


    ![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig30_HTML.jpg](img/502765_1_En_1_Fig30_HTML.jpg)


    图 1-30


    包含两列或三列的灵活布局


    ![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig29_HTML.jpg](img/502765_1_En_1_Fig29_HTML.jpg)


    图 1-29


    全屏布局


    **页面方案** 指的是如何将元素放置在布局内，以构建更完整的应用程序。根据所选布局的不同，布局内部可能会添加一个或多个页面方案。全屏布局可以包含一种类型的元素，例如工作清单。


    灵活列布局通常由主/详细模板组成，其中**主（UI）**视图包含用于导航的列表，而模板的详细侧则显示与从 **(UI)** 视图中选择的项相关的详情。与两列的灵活列布局非常相似，三列布局通常用于主-详细-详细场景。采用这些两列或三列布局的原因，是为了避免应用中的多次导航，让用户始终专注于同一个屏幕，同时在各个布局上呈现相关信息。


    强调 **智能控件** 作为 Fiori 应用中使用组件的一部分非常重要。智能控件是指当 Fiori 应用中存在 OData 服务时，利用该服务的元数据来构建的控件。智能控件包括智能过滤器、用于包含可见字段的控件配置以及导出到
    Excel 等功能，仅举几例，如图 1-18 所示。智能过滤器栏可以生成智能输入字段控件，并提供应用程序过滤功能，而无需编写一行代码。它完全由框架管理。如果您的应用程序需要对智能过滤器栏进行自定义过滤或额外增强，则可以利用提供的功能，并自行添加自定义处理程序作为代码的自定义扩展。这些智能控件的大部分配置是在将控件放入
    XML 视图时完成的，并包含最终绑定到 OData 服务的控件属性。


    **OData** 服务在 Fiori 应用中至关重要，因为这些服务用于通过 HTTP(s) 从 Web 客户端暴露或消费数据。OData 是一种协议，在
    Fiori 应用以及其他 Web 技术中得到了广泛应用。SAP Fiori (UI5) 控件主要使用两个不同版本的 OData：v2 和 v4。OData
    以 atom XML 和 JSON 格式返回数据。OData 服务可以根据 OData 协议中记录的 OData 语法规则进行查询。在创建某些 Fiori
    应用程序时，也存在向导来包含 OData 端点（URL），该向导会包含 OData 模型和元数据文件，并准备好应用程序以消费此类服务。OData 将在第 2
    章中深入讨论。


    ## 结论


    在结束我们第一章的内容时，我希望您能理解为什么 Fiori 设计是开始任何应用程序开发之前的一项重要任务，并且是软件产品开发成功的基本支柱。


    在最初设计产品时投入更多时间，将减少开发团队与产品所有者或客户之间的不必要迭代。在项目初期付出更大的努力将使产品更成功，并提高其投资回报率。第一章中的第二个学习点是熟悉
    SAP Fiori 原则和 SAP Fiori 概念，例如组件、元素、布局和页面方案，以便向客户推荐它们，并在设计和开发 SAP Fiori 应用程序时加以应用。最后，理解
    SAP Fiori 应用之间的集成点，以及了解某些相关技术的预期，对于让您的团队准备好迎接一段有趣而激动人心的旅程至关重要。熟悉各种开发工具，进行比较，并选择正确的工具，这样您就能知道在您的场景中何时使用它们。感谢您完成本章，事不宜迟，请准备好进入下一章，在下一章中，我们将深入探讨
    OData 协议和 RESTful API。


    # 2. 在 Fiori 应用中消费数据


    欢迎来到第 2 章！本章将解释所有关于数据和数据模型的内容。您将学习如何消费数据，如何在数据不存在时模拟数据，如何从本地 JSON 模型模拟数据，以及如何暴露数据。通过
    OData（由 Microsoft 创建并被他方采用的开放数据协议）和 JSON（JavaScript 对象表示法）模型消费数据模型是 SAP Fiori
    中的关键概念。有时，需要从您的 SAP Fiori 应用程序中消费外部 REST API（**R**epresentational **S**tate **T**ransfer，具象状态传输）服务。本章将从
    SAP Fiori 应用程序的角度，以及从一个名为 `POSTMAN` REST 客户端的单元测试工具的角度，探讨所有这些要点。该工具可以在开发前端应用的同时并行使用，但您可能尚未准备好实现所有必要的
    XML 视图和 JavaScript 代码以进行数据集成。准备好深入技术概念，让我们一起学习吧。

    '
- fmt: '# Understanding Data and Mocking It When Not Available


    In Chapter [1](#502765_1_En_1_Chapter.xhtml), the book described various ways
    to design your applications using different tools and collaborating with key users
    to create a successful design. Within the design step, sometimes users provide
    data samples using spreadsheets to be used within the design so that designers
    and developers can visualize when they need to represent as a list of data, a
    single entry of data, or data being inputted from a screen via user interaction.
    In this chapter, the book is gradually moving from the design concept into being
    able to understand data a little better. Understanding data is very important,
    as it applies to a back-end database system and also while creating front-end
    applications so that they can be performant and able to present only relevant
    data within the application/product being developed. Understanding data is a key
    component while designing and while creating an application.


    Developers sometimes wonder how they should start developing an application if
    data is not available from a back-end system. Sometimes developers start their
    work simulating data as hard-coded `JSON` objects in their application. Luckily
    for most enterprise projects, data usually comes from an ERP (Enterprise Resource
    Planning) system and there is plenty of data available to be consumed. Data models
    in these systems are usually created as CDS (Core Data Services views) if they
    come from SAP or SAP HANA and are exposed as `OData` service endpoints that are
    easily consumed from a `REST` client or application.


    `CDS` is a scripted language created by SAP that allows developers to create design-time
    objects such as entities (tables) and data models (views) with the purpose of
    doing most of the work closer to the database. `CDS` views may contain additional
    annotations that are leveraged by `UI5` controls to achieve less coding in the
    front end and these data annotations are controlled from the back end. Even if
    data is nonexistent in the back-end system table, but the data model is created,
    the `OData` service generates a metadata file that provides information about
    the endpoint, where the data model is exposed, the data types for the different
    data entities are known, and further, the `OData` service sometimes can contain
    data annotations that are used by applications.


    Let me break down the previous paragraph into smaller chunks:


    **Table 2-1** OData V2 vs OData V4 comparison


    | OData V2 | OData V4 |

    | --- | --- |

    | Microsoft Open Specification Promise (OPS) | Approved by OASIS and ISO |

    | Data exposed as atom/XML (default) or JSON | Data exposed as JSON (default)
    XML is optional |

    | | `DateTime` data type has been deprecated |

    | | Improved data types such as `Edm.Time` have been replaced with `Edm.Duration`
    and `Edm.Time of Day` |

    | Date format was not existing | `Edm.Date` has been added |

    | | `Edm.Float` has been eliminated |

    | | Allows synchronous requests |


    ## OData


    This is the (open data) protocol/technology that generates an `OData` service
    that can be easily consumed by web applications or other REST clients. `OData`
    has a huge adoption in SAP Fiori. It is the main and preferred way to expose and
    consume data in SAP Fiori applications. It is also present in other technology
    stacks. `OData` APIs, also known as `OData` services, have been released in different
    versions. The most common version is `OData v2`. The latest version of `OData`
    services is `OData v4`.


    These two versions have the following similarities and differences. Most of the
    `SAPUI5` controls that are used in Fiori applications use `OData v2`. In Table
    [2-1](#502765_1_En_2_Chapter.xhtml#Tab1) we can see this comparison.


    The following request comparisons show the performance improvements from an `OData
    V2` service compared to an `OData V4` service request for the same type of request
    and using a free online `OData` service called Northwind and showcased in Figures
    [2-1](#502765_1_En_2_Chapter.xhtml#Fig1) and [2-2](#502765_1_En_2_Chapter.xhtml#Fig2).


    One of the main differences in performance improvement between these two versions
    is the fact that the payload size in `JSON` format is relatively smaller in comparison
    to the same request returning an `XML` payload, as shown next.


    ![../images/502765_1_En_2_Chapter/502765_1_En_2_Fig2_HTML.jpg](images/502765_1_En_2_Chapter/502765_1_En_2_Fig2_HTML.jpg)


    **Figure 2-2** OData service v4


    ![../images/502765_1_En_2_Chapter/502765_1_En_2_Fig1_HTML.jpg](images/502765_1_En_2_Chapter/502765_1_En_2_Fig1_HTML.jpg)


    **Figure 2-1** OData service v2


    ![../images/502765_1_En_2_Chapter/502765_1_En_2_Fig3_HTML.jpg](images/502765_1_En_2_Chapter/502765_1_En_2_Fig3_HTML.jpg)


    **Figure 2-3** OData service metadata showing an Entity Set


    ## OData Entities


    The entities exposed in an `OData` service are pointers to exposed back-end data
    models that can further be used for CRUD (Create, Read, Update, Delete) operations.
    The back-end data models represent `CDS` views, tables, or other entry points
    that a client application can interact with the back end via the HTTP(s) protocol.
    You can identify the different endpoints as Entity Sets in an `OData` Service.
    You can see these Entity Sets while requesting the metadata for the `OData` service
    as shown in Figure [2-3](#502765_1_En_2_Chapter.xhtml#Fig3).


    ## OData Metadata


    When an `OData` service is created, its contract is represented as metadata of
    the same service. The `OData` service metadata can be located by appending `/$metadata`
    to the end of the `OData` service URI. The metadata file is an `XML` generated
    file, as shown in Figure [2-3](#502765_1_En_2_Chapter.xhtml#Fig3).


    The metadata of the application is used when mapping an SAP Fiori application
    to a control such as a list or a table, and it uses the metadata of the service
    to type of control and some of the properties to be bound, such as record count,
    title of the data to be represented, labels for the filters, and also ability
    to interpret data type for the control(s) to be used in the filter bar in the
    case of a smart table in a List Report or Worklist template. These additional
    properties can be seen in Figure [2-4](#502765_1_En_2_Chapter.xhtml#Fig4).


    ![../images/502765_1_En_2_Chapter/502765_1_En_2_Fig4_HTML.jpg](images/502765_1_En_2_Chapter/502765_1_En_2_Fig4_HTML.jpg)


    **Figure 2-4** OData metadata


    In addition to the **Entity Set** (endpoint) and the **Entity Type** (endpoint
    definition), the `OData` service also provides navigation properties. In the case
    of the Products Entity Set, we can observe that it has three navigation property
    bindings in Figure [2-5](#502765_1_En_2_Chapter.xhtml#Fig5).


    ![../images/502765_1_En_2_Chapter/502765_1_En_2_Fig5_HTML.jpg](images/502765_1_En_2_Chapter/502765_1_En_2_Fig5_HTML.jpg)


    **Figure 2-5** OData service metadata showing Entity Set


    1. Navigation property binding to the Category target

    2. Navigation property binding to the `Order_Details` target

    3. Navigation property binding to the Supplier target


    What does it mean to have a navigation binding? If you guessed that it allows
    these entities to have relationships defined between the endpoints, you guessed
    correctly. The navigation property is a simple way to understand and follow data
    relationships from one endpoint to another. This is a very common scenario on
    applications where a list of data is displayed, then the user of the application
    wishes to drill down or *navigate* to an item to find out more details about a
    specific record.


    One of the other used URL syntax features is the need to know the record count
    of an entity. In order to retrieve the record count, please see Figure [2-6](#502765_1_En_2_Chapter.xhtml#Fig6).'
