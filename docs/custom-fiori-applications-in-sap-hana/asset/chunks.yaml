    After the cloning of the repository, the custom Fiori application project will
    appear in the SAP Web IDE. Proceed to build each module, starting with the database
    module, then the api module, and finally the ui module. If you are prompted to
    select a space, choose the (default) development space and finally, build the
    project to generate the `mtar` file as we did before, as shown in Figure [5-29](#502765_1_En_5_Chapter.xhtml#Fig29).


