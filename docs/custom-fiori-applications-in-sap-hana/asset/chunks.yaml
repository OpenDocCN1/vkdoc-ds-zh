- fmt: '# OData-Driven Design Approaches


    Thus far we have discussed the OData services when there is data available and
    mocking data when we do not have data directly accessible, but we can also generate
    data from an OData metadata file. We also consumed data from a REST API microservice.
    Wouldn’t it also make sense to have our SAP Fiori application to provide a data-driven
    solution to be able to create these Enterprise applications with little to no
    effort?


    **Smart Controls** are control templates within the SAPUI5 SDK (Software Development
    Kit) that provide this type of feature and behavior. These templates use metadata
    XML files and annotations that understand the metadata and can transform these
    XML annotations and metadata into actual SAPUI5 applications and Fiori elements.


    Annotations are additional properties that use a semantic meaning to properties
    within an OData endpoint. The sole purpose of giving additional meaning to some
    data is to enrich the meaning of the data itself; for example, adding currency
    symbols to a decimal number that truly represents a currency amount, or displaying
    a label in a different format such as all caps. Annotations in SAP HANA CDS contain
    limited set types of annotations compared to those in SAP ABAP CDS. `HANA CDS`
    and `ABAP CDS` are very similar in the sense that they derive from the same scripting
    language; however, they are very different in the sense that not all annotation
    types apply in both technologies.


    When should these types of applications be built (using metadata and annotations
    instead of actual XML and JavaScript)? There are design guidelines to consider
    if the desired behavior is to follow this path. If the development of applications
    is very standard, design consistency is needed, and not much customization is
    required, then the suggested way to create these applications is to follow these
    predefined templates. When you start your design phase and you notice some customization
    of your application, then the application being built may not be a good candidate
    for smart template development. Keep in mind that this type of development has
    a mandatory requirement of using OData services and the application to be built
    follows one of the Fiori elements discussed in Chapter [1](#502765_1_En_1_Chapter.xhtml)
    (List Report, Worklist, Overview page).


    Let us proceed to build an Overview page using our existing OData service. As
    mentioned in Chapter [1](#502765_1_En_1_Chapter.xhtml), an Overview page is a
    quick look of the system with the purpose of giving the user a glance at what
    is going on in the data, in this case devices, without having to drill down into
    each specific app or tile to find out more.


    In our data set represented by `DEVICES`, we also have a table that contains device
    metrics. The metrics captured here are temperature and date recorded. This data
    is simply for the exercise. I will start by building additional data models to
    represent the data we want to represent in the Overview page. In the Overview
    page, let’s display the average temperature of the devices; in another section,
    we will display the cost of the devices in descending order. By looking at an
    example of the Overview page, we need to build sections called **cards**.


    Cards represent a small section of data within an Overview page and they contain
    a header where we can set the title, and then a content area to represent a table,
    a chart or graph, or some other text. There are a few different types of cards:
    analytical (has title and a measure), list, bar chart, table, and quick view (information
    content like a form).


    Let’s start by designing the data models in the database and adding them to the
    OData Service in order for the application to use them as cards in the Overview
    page. Figure [2-24](#502765_1_En_2_Chapter.xhtml#Fig24) shows the data architecture
    at a high level using the `DEVICE` and `DEVICE_METRICS` tables, the `CV_DEVICES`
    and `CV_AVG_TEMP_DEVICES` calculation views, and finally the additional endpoint
    in the OData service.


    ![../images/502765_1_En_2_Chapter/502765_1_En_2_Fig24_HTML.jpg](images/502765_1_En_2_Chapter/502765_1_En_2_Fig24_HTML.jpg)


    Figure 2-24 Data architecture for AvgTmpDevices


    In the OData service, it looks like Figure [2-25](#502765_1_En_2_Chapter.xhtml#Fig25).


    ![../images/502765_1_En_2_Chapter/502765_1_En_2_Fig25_HTML.jpg](images/502765_1_En_2_Chapter/502765_1_En_2_Fig25_HTML.jpg)


    Figure 2-25 XSOData service including additional endpoints


    And once they are exposed, the metadata file looks like Figure [2-26](#502765_1_En_2_Chapter.xhtml#Fig26).


    ![../images/502765_1_En_2_Chapter/502765_1_En_2_Fig26_HTML.jpg](images/502765_1_En_2_Chapter/502765_1_En_2_Fig26_HTML.jpg)


    Figure 2-26 OData service metadata


    Retrieving the data shows as Figure [2-27](#502765_1_En_2_Chapter.xhtml#Fig27).
    From the data generated in the following, we need to leverage the SAPUI5 controls,
    binding to the data and sorting the data in descending order using the `TEMP`
    property.


    ![../images/502765_1_En_2_Chapter/502765_1_En_2_Fig27_HTML.jpg](images/502765_1_En_2_Chapter/502765_1_En_2_Fig27_HTML.jpg)


    Figure 2-27 OData AvgTmpDevices endpoint


    From here, then the metadata file and the annotations need to be generated (if
    doing local development; otherwise, developers can proceed and connect to an existing
    OData service).


    Using the SAP Web IDE (either personal edition or full stack version from SAP
    Cloud or the SAP Business Application Studio), we can use the `Create new application`
    wizard as shown in Figure [2-28](#502765_1_En_2_Chapter.xhtml#Fig28).


    ![../images/502765_1_En_2_Chapter/502765_1_En_2_Fig28_HTML.jpg](images/502765_1_En_2_Chapter/502765_1_En_2_Fig28_HTML.jpg)


    Figure 2-28 Template Selection wizard


    From this screen, select the `Overview page` and follow the wizard to create the
    Overview page as shown in Figure [2-29](#502765_1_En_2_Chapter.xhtml#Fig29).


    ![../images/502765_1_En_2_Chapter/502765_1_En_2_Fig29_HTML.jpg](images/502765_1_En_2_Chapter/502765_1_En_2_Fig29_HTML.jpg)


    Figure 2-29 New Overview page step


    Once the properties are added, then select the OData service or a metadata file
    as shown in Figure [2-30](#502765_1_En_2_Chapter.xhtml#Fig30).


    ![../images/502765_1_En_2_Chapter/502765_1_En_2_Fig30_HTML.jpg](images/502765_1_En_2_Chapter/502765_1_En_2_Fig30_HTML.jpg)


    Figure 2-30 Data connection step


    After selecting the endpoints, then the user can create an annotation file as
    shown in Figure [2-31](#502765_1_En_2_Chapter.xhtml#Fig31), or this step can be
    skipped now and created later.


    ![../images/502765_1_En_2_Chapter/502765_1_En_2_Fig31_HTML.jpg](images/502765_1_En_2_Chapter/502765_1_En_2_Fig31_HTML.jpg)


    Figure 2-31 Annotation selection step


    Continue by selecting the `Datasource Alias` and the `EntityType` as shown in
    Figure [2-32](#502765_1_En_2_Chapter.xhtml#Fig32). These properties are saved
    to the `manifest.json` file.


    ![../images/502765_1_En_2_Chapter/502765_1_En_2_Fig32_HTML.jpg](images/502765_1_En_2_Chapter/502765_1_En_2_Fig32_HTML.jpg)


    Figure 2-32 Template customization step


    After finishing those steps, the developer can see the additional changes reflected
    in the workspace project, as shown in Figure [2-33](#502765_1_En_2_Chapter.xhtml#Fig33).


    ![../images/502765_1_En_2_Chapter/502765_1_En_2_Fig33_HTML.jpg](images/502765_1_En_2_Chapter/502765_1_En_2_Fig33_HTML.jpg)


    Figure 2-33 Project structure


    Since we are going to be using the XML metadata file, then proceed to edit the
    mock data, and we should be able to follow the steps shown in Figure [2-34](#502765_1_En_2_Chapter.xhtml#Fig34).'
