- fmt: "# QUnit\n\nKeeping these three test cases in mind, let us proceed to analyzing\
    \ and setting up the `QUnit` framework in our application. The `QUnit` framework\
    \ requires zero configuration if it will be used within the `Node JS` language\
    \ or minimal configuration if it will be used within a browser-based application\
    \ (this is our case). The reason I mentioned `Node JS` is because we will also\
    \ use it later for some of the other frameworks. To be successful in this framework,\
    \ developers must have a good handle on the JavaScript language, might well have\
    \ a good understanding of the arrow functions in `ES6`, and should also have a\
    \ good understanding of the browser developer tools.\n\nNormally, the `SAPUI5`\
    \ templates contain a `test` folder to implement these test cases. If your project\
    \ did not include such a folder, then follow the next steps to include a unit\
    \ testing framework.\n\nThis first exercise will showcase the `QUnit` framework.\n\
    \n![../images/502765_1_En_4_Chapter/502765_1_En_4_Fig1_HTML.jpg](images/502765_1_En_4_Chapter/502765_1_En_4_Fig1_HTML.jpg)\n\
    \n**Figure 4-1** Local QUnit framework\n\n1.  First, create a `test` folder as\
    \ shown in Figure 4-1. You may include a local `QUnit` framework as shown in the\
    \ following exercise, or if you prefer to use a Content Delivery Network resource\
    \ (`CDN`), then you will need to reflect that URL in the `script` tag of the `html`\
    \ file (line 10). In this exercise, we downloaded the `QUnit` framework (version\
    \ `2.10.1`) files from their website and included them locally in our project.\n\
    2.  Next, we created a `qunit.html` file, shown on the right half of Figure 4-1,\
    \ that will be the entry point for our unit test scenario. This file shows the\
    \ output of the unit test **modules** that will be explained further. There is\
    \ also a reference to the `qunit-2.10.1.css` file, which is used for styling the\
    \ output screen of the `QUnit` test suite.\n3.  Finally, there is a reference\
    \ to the test scenarios in a separate `qunitTest.js` file, as displayed on line\
    \ 16 of Figure 4-1. It is in your best interest to modularize your unit tests\
    \ so that not all your code lives in the same files. It makes life easier to have\
    \ a modular approach during testing and development.\n\nAfter loading the external\
    \ references for the `QUnit` scenarios, the book also references the local `JQuery`\
    \ version `3.1.0` JavaScript file that the book will showcase to invoke a call\
    \ to an `OData` service, and the book includes a reference to the `moment.js`\
    \ library, as one of the exercises demonstrates the use of an external library\
    \ to do formatting of the `date` object data type.\n\nDouble-click the `test/qunitTest.js`\
    \ file to open it up to see the structure of the `QUnit` framework. In Figure\
    \ 4-2, you can see the following:\n\n![../images/502765_1_En_4_Chapter/502765_1_En_4_Fig2_HTML.jpg](images/502765_1_En_4_Chapter/502765_1_En_4_Fig2_HTML.jpg)\n\
    \n**Figure 4-2** Sample QUnit output\n\n1.  The title given to the unit test suite,\
    \ which comes from the `qunitTest.html` file.\n2.  The check boxes to hide the\
    \ passed tests in case the developer only wants to display erroneous tests. Another\
    \ check box to check for global settings. Finally, another check box to disable\
    \ `try-catch` code blocks within the code.\n3.  The framework itself displays\
    \ the number of tests completed, the time taken to complete, the breakdown of\
    \ failed, passed, and skipped tests, and the total number of assertions.\n4. \
    \ Observing deeper into the output, the reader can also see the hierarchy output\
    \ of the framework, such as:\n    1.  `QUnit.module` – allows developers to group\
    \ one or more test cases. The `QUnit.module` accepts two arguments, the first\
    \ one being the name of the module and the second one a callback function to execute\
    \ its tests. There can be one or more modules within an application to separate\
    \ unit tests. In Figure 4-2, the reader can see the module name highlighted (`unitTestSample`).\n\
    \    2.  `QUnit.test` – part of a module and can contain one or more assertions.\
    \ The `test` section accepts two arguments: the name of the test and the function\
    \ that will execute assertions within. In Figure 4-2, the reader can see the two\
    \ test scenarios that exist within the same module (`unitTestSample`).\n\nRight\
    \ below from each of the tests, the reader can also observe the source code and\
    \ line where each test is located.\n\nThe output screen is generated from the\
    \ test cases shown in Figure 4-3.\n\n![../images/502765_1_En_4_Chapter/502765_1_En_4_Fig3_HTML.jpg](images/502765_1_En_4_Chapter/502765_1_En_4_Fig3_HTML.jpg)\n\
    \n**Figure 4-3** QUnit test cases\n\nAssertions are statements in the code to\
    \ ensure the validity of what is being tested. The preceding two highlighted tests\
    \ showcase a very simple test on lines 5–7 and then on lines 10–12. Notice that\
    \ on line 11, the example uses a function that further uses an external library\
    \ named `moment`. This library helps developers with the use of date and time\
    \ objects in JavaScript. The `moment.js` library was loaded in the `qunitTest.html`\
    \ file along with the `JQuery` library in the `head` element XML tag of the HTML\
    \ file.\n\nLines 14–29 are commented out due to an incorrect setup of a test scenario.\
    \ This section is left in the code to demonstrate a typical error made by developers\
    \ when setting up their test cases. The reason this piece of code failed is that\
    \ the `QUnit` test case was executed along with the `JQuery` `getJSON` function,\
    \ which executes asynchronously, while the `QUnit` test section ended before reaching\
    \ the success callback, resulting in an incorrect test case.\n\nTake a deeper\
    \ look into the function in Figure 4-4 to showcase the correct approach while\
    \ testing an asynchronous JavaScript (`AJAX`) call. This `QUnit` test is nested\
    \ within the `JQuery` `getJSON` function call.\n\nThe reason to show this test\
    \ is to demonstrate the use of invoking asynchronous web services within the context\
    \ of the `QUnit` framework to validate the following requirements:\n\n1.  The\
    \ time to execute an `OData` call (or a `REST API`)\n2.  The asynchronous nature\
    \ of web development and unit testing working together\n3.  Multiple assertion\
    \ tests being validated within one test:\n    1.  Often, software must comply\
    \ with Software Level Agreements (`SLAs`) established before the creation of a\
    \ software product. In our scenario, we are testing to make sure the consumption\
    \ of the `OData` service takes less than some agreed time to execute.\n    2.\
    \  The second assertion the book is presenting in this scenario is that the `OData`\
    \ call contains at least one record (should not return empty array).\n    3. \
    \ The third and last (but not least) test scenario is to validate one of the response\
    \ objects with an expected object structure.\n\n![../images/502765_1_En_4_Chapter/502765_1_En_4_Fig4_HTML.jpg](images/502765_1_En_4_Chapter/502765_1_En_4_Fig4_HTML.jpg)\n\
    \n**Figure 4-4** QUnit test using an AJAX call\n\nOther things to note within\
    \ the third test case is that the exercise started tracking the `startTime` before\
    \ the `getJSON` function (on line 31), and then it tracked the `endTime` right\
    \ inside the success callback (on line 37) to be able to calculate the difference\
    \ of time (line 38).\n\nFigure 4-5 shows the failures that occurred when the expected\
    \ object structure did not match the response from the `OData` service, which\
    \ references the third assertion within the test case. The difference between\
    \ what was expected from the `OData` service response and what is displayed in\
    \ Figure 4-5 is the failure that the developer should understand and address.\n\
    \n![../images/502765_1_En_4_Chapter/502765_1_En_4_Figa_HTML.jpg](images/502765_1_En_4_Chapter/502765_1_En_4_Figa_HTML.jpg)\n\
    \n**Figure 4-5** Failure shown when expected object structure did not match the\
    \ response structure from the OData service"
