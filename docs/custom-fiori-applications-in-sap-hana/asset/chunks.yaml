    and log in as `XSA_ADMIN` or `XSA_DEV` account. Once in the SAP Web IDE, open
    the settings gear (left navigation icon) and provide the GIT committer your email
    address and username (they must match the GIT account details), as shown in Figure
    [5-26](#502765_1_En_5_Chapter.xhtml#Fig26).


