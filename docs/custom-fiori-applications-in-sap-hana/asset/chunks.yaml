    **图 5-12** 设置试用账户


    创建账户后，浏览器将重定向至图 5-13 所示的 SCP Cockpit 界面。请仔细查看该仪表盘中的各项功能，以便后续参考，或在不再使用时删除试用账户。


    ![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig13_HTML.jpg](img/502765_1_En_5_Fig13_HTML.jpg)


    **图 5-13** 显示全局账户设置的 SCP Cockpit


    选择"trial"全局账户磁贴，进入子账户。


    在接下来的界面中，您将看到部署所需的所有云设置。图 5-14 所示的图像可谓"一图胜千言"，因为其中的信息将对您的部署、维护乃至任何未来的开发工作都大有裨益。请仔细分析这个仪表盘并熟悉图
    5-14 中的界面，以及所有与 CF 架构相关的重要设置，例如`Org Name`（组织名称）、`Space Name`（空间名称）以及`API endpoint`（API
    端点），当您决定从`SAP Web IDE`进行部署时，将需要用到这些信息。


    ![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig14_HTML.jpg](img/502765_1_En_5_Fig14_HTML.jpg)


    **图 5-14** 子账户试用中的 SCP CF 设置


    请注意，目前仅创建了一个空间，且其中尚未部署任何应用程序。完成部署后，该数字应会增长。如果您在 SCP 试用账户中进行此练习，您还会看到云实例的启用天数，该信息显示在浏览器的右上角（默认为
    30 天）。如果您的演示需要更多天数，可以向 SCP 申请。正如我接下来将要展示的，试用账户可能功能受限。在了解了上一段所述的云平台设置后，请返回您的`SAP
    Web IDE`，按照以下步骤将应用程序部署到 SCP 环境：


    ![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig15_HTML.jpg](img/502765_1_En_5_Fig15_HTML.jpg)


    **图 5-15** SAP Web IDE 部署至 SCP


    1.  假设您已生成了一个`mtar`文件，请选择您要部署的`mtar`文件。

    2.  选择"部署"菜单，然后选择"Deploy to SAP Cloud Platform"，如图 5-15 所示。


    在 SCP 教程中创建示例云应用程序[`https://developers.sap.com/tutorials/s4sdk-cloud-foundry-sample-application.html`](https://developers.sap.com/tutorials/s4sdk-cloud-foundry-sample-application.html)时，开发人员还可以观察到以下端点会根据所选区域而有所不同——您的端点将如图
    5-16 所示。如果未显示，请在下拉控件中键入以下端点之一。


    ![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig16_HTML.jpg](img/502765_1_En_5_Fig16_HTML.jpg)


    **图 5-16** SAP Web IDE 显示云平台上的端点


    1.  欧洲地区使用 `https://api.cf.eu10.hana.ondemand.com` AWS 平台

    2.  美国东部（弗吉尼亚州）使用 `https://api.cf.us10.hana.ondemand.com` AWS 平台

    3.  美国中部使用 `https://api.cf.us20.hana.ondemand.com` Azure 平台


    选择与您的 SAP 账户匹配的端点后，输入图 5-17 所示的账户凭证。


    ![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig17_HTML.jpg](img/502765_1_En_5_Fig17_HTML.jpg)


    **图 5-17** SCP 账户凭证


    在`SAP Web IDE`通过 SCP 对您进行身份验证后，将出现下一个提示，要求部署者选择组织和空间，如图 5-18 所示。请记住，一个组织可能包含一个或多个空间。以下练习仅显示默认的`dev`空间以供说明——如果您的组织为开发或部署创建了其他空间，请选择相应的空间。


    ![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig18_HTML.jpg](img/502765_1_En_5_Fig18_HTML.jpg)


    **图 5-18** SCP 云层级结构


    在我的示例中，部署因数据库配置设置而失败；但是，如果您仅部署自定义的 Fiori 应用程序，则应该能够顺利完成部署。请查看如图 5-19 所示的控制台日志，以了解部署是否完成，或者您的
    Fiori 应用程序中是否有任何设置需要编辑。


    ![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig19_HTML.jpg](img/502765_1_En_5_Fig19_HTML.jpg)


    **图 5-19** SAP Web IDE 部署期间出现的错误

