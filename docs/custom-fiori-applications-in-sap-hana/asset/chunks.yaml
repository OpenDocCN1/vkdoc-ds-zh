    Ensure the SAP Web IDE is up and running. Run the following `XS CLI` command and
    notice the status as `RUNNING Instances 1/1`, as shown in Figure [5-25](#502765_1_En_5_Chapter.xhtml#Fig25).


    ![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig26_HTML.jpg](images/502765_1_En_5_Chapter/502765_1_En_5_Fig26_HTML.jpg)


    **Figure 5-26** – GIT account details


    ### Step 2: Configure GIT in Web IDE


