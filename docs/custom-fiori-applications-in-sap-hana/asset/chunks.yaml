    JS 文件中导航和移动 JavaScript 代码一样，开发人员可以使用同样的浏览器工具来帮助自己导航和调试单元测试脚本（使用键盘快捷键 `F10`、`F11`、`F8`）或使用浏览器右下角的导航图标。


