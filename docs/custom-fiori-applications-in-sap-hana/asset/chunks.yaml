    Introduction


    For many years, creating software applications in the SAP ecosystem was a headache;
    however, Fiori applications have changed the game when it comes to developing
    enterprise business applications that are simple to develop and meet complex rules
    across the enterprise. With their initial release over seven years ago and their
    fast adoption by many customers, Fiori applications are continuing to gain popularity
    due to Fiori’s delightful UX and proven capabilities. Many customers focus on
    application integration, application and data security, ease of use, business
    adoption, and features that are offered by other modern, high-quality, and competitive
    frameworks. SAP Fiori stands tall among its peers and offers a world-class framework
    to create similar products. This book walks you through the journey of designing,
    collaborating, developing, testing, and deploying Fiori applications to on-premise
    and cloud environments. Various IDE tools are showcased to inform the reader of
    the many available ways to develop, extend, test, and enhance Fiori applications.
    By the end of the book, the reader will have been informed of all the phases,
    tools, and features and will have completed a sample Fiori application developed
    in the SAP Web IDE and deployed to the SAP HANA XSA environments on-premise and
    also to the AWS Cloud Platform.


    Chapter [1](#502765_1_En_1_Chapter.xhtml) provides an explanation of what SAP
    Fiori applications are and it presents the five design principles for Fiori applications.


    Chapters [2](#502765_1_En_2_Chapter.xhtml) and [3](#502765_1_En_3_Chapter.xhtml)
    relate to consuming data from a remote OData service and also mocking data when
    it is not available. The data models are consumed and presented in a Model View
    Controller (MVC) design pattern, which is a common pattern used in Fiori applications.
    External JavaScript libraries are integrated into the Fiori applications and presented
    in various devices to show its responsive features.


    Chapter [4](#502765_1_En_4_Chapter.xhtml) shows and compares different unit testing
    frameworks used within the Fiori applications and also other open source frameworks,
    such as Nightmare and Puppeteer.


    The book closes with Chapter [5](#502765_1_En_5_Chapter.xhtml) and the deployment
    of the sample Fiori application into an on-premise environment, and presents the
    steps to deploy the same application to the SAP Cloud Platform and also into Amazon
    Web Services.


    All source code is available to readers on GitHub via the book’s product page,
    located at [`www.apress.com/978-1-4842-6357-0`](http://www.apress.com/978-1-4842-6357-0)
    . For more detailed information, please visit [`http://www.apress.com/source-code`](http://www.apress.com/source-code)
    .


    Acknowledgments


    I am thankful to my wife, Amy, and the people who are always there during the
    difficult times in my life. I am, again, very honored, humbled, and grateful for
    the Apress team and their valuable time: Divya, Laura, and Jose Ferez. Thank you
    for trusting me, and providing your guidance and different perspectives while
    I was writing this Fiori book. It has been a great journey and achievement.


    About the Author About the Technical Reviewer


    # 1. Fiori Applications in SAP HANA


    Welcome to building custom Fiori applications in SAP HANA. In this introductory
    chapter, I will explain what Fiori is, what concepts are important when starting
    the development of a product, why the initial design is very important, different
    design methodologies, understanding its current and future users, and how users
    will utilize the product during a process. Eventually a product moves from design
    into development and deployment. This book will conclude with a full exercise
    showcasing an entire Fiori application developed with all the concepts discussed
    throughout the book.'
