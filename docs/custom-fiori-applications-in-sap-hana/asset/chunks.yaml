  raw: 'If you are developing for a very standard application and there is not really
    a need for customization, then the approach of Chapter [3](#502765_1_En_3_Chapter.xhtml)
    using Fiori elements is the way to go. It will save you a lot of time and development
    investment, but there will not be a lot of freedom for easy customization. Customization
    in this approach is done by modifying the manifest.json file configuration and
    by adding annotations in XML.


    In contrast, if the application your team is trying to develop requires customization,
    introduction of business rules, and flexibility, and pretty much it is not going
    to be a standard display application, then your team/organization needs to be
    thinking in terms of the customization approach shown in Chapter [2](#502765_1_En_2_Chapter.xhtml).


    There are Fiori guidelines that can be followed to see which type of development
    is the one you and your organization need to follow. Check those Fiori guidelines
    in the SAP Fiori guideline web URL: [`https://experience.sap.com/fiori-design/`](https://experience.sap.com/fiori-design/).


    ## Integrating External JS Libraries into (SAPUI5) Fiori


    After familiarizing ourselves with the development tools, and starting to work
    with one of the application tools, it is very likely that sometimes there is a
    need to integrate additional JavaScript libraries when the SAPUI5 library does
    not provide certain functionality or if there is a need to leverage other libraries
    with the purpose of making a more robust Fiori application. Third-party libraries
    are commonly included as dependencies of web applications, and in our case, the
    book will showcase one of them that it used in the past.


    The third-party library the book would like to demonstrate is called moment.js.
    Moment.js is a free JavaScript library that is used for dealing with date objects.
    Typically, in JavaScript it is not easy or straightforward to work with date objects.
    There are many reasons why there may be a need to use this third-party library,
    including


    1.  Adding dates


    2.  Comparing dates


    3.  Dealing with time zones and offsets


    Figure [3-30](#502765_1_En_3_Chapter.xhtml#Fig30) is a picture of the moment.js
    website, where developers can download this third-party library.


    *Read the documentation and any license information to make sure your project
    is ok to use this library*.


    ![../images/502765_1_En_3_Chapter/502765_1_En_3_Fig30_HTML.jpg](images/502765_1_En_3_Chapter/502765_1_En_3_Fig30_HTML.jpg)


    Figure 3-30


    Moment.js website


    To add this library into our project, first download it from their website. Then
    include it as a dependency. In Figure [3-31](#502765_1_En_3_Chapter.xhtml#Fig31),
    there was a folder added called ***externalLibs*** ; included inside of it is
    the moment.js library. The dependency is injected in the detail controller file
    and then referenced as moment.js.


    ![../images/502765_1_En_3_Chapter/502765_1_En_3_Fig31_HTML.jpg](images/502765_1_En_3_Chapter/502765_1_En_3_Fig31_HTML.jpg)


    Figure 3-31


    Loading moment.js as a dependency


    Once the moment library is loaded into our project, developers may be able to
    reference its different operation, as shown in Figure [3-32](#502765_1_En_3_Chapter.xhtml#Fig32).


    ![../images/502765_1_En_3_Chapter/502765_1_En_3_Fig32_HTML.jpg](images/502765_1_En_3_Chapter/502765_1_En_3_Fig32_HTML.jpg)


    Figure 3-32


    Moment.js library is ready


    To include other third-party libraries, follow the same approach of downloading
    them locally, adding them to the project, and then including them as a reference
    to the library location within the project. Make sure you read the license terms
    before utilizing some of the open source libraries to avoid any potential issues.


