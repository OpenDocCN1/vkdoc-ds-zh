- fmt: '# Object Page


    **Object page:** This template is used to provide details about a specific record.
    It is used as the detailed step where navigation from a list item is clicked and
    navigated to here. This template is used to provide concrete details about a record.
    This template is composed of header-level data attributes such as object header,
    number, image of the object, title, status, and object attributes.


    This template can also contain tabs to separate and logically display data related
    to specific subcategories related to the item in context. Some of the Fiori apps
    use this type of template when needing to provide an extensive detail view of
    a record. This template can be seen in Figure [1-28](#502765_1_En_1_Chapter.xhtml#Fig28).


    **Layouts** at a high level are placeholders for the developers to place content
    on the screen. There are various types of layouts: for example, dynamic layout
    for the full screen as shown in Figure [1-29](#502765_1_En_1_Chapter.xhtml#Fig29),
    the flexible column layout with two or three columns as shown in Figure [1-30](#502765_1_En_1_Chapter.xhtml#Fig30).


    ![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig30_HTML.jpg](images/502765_1_En_1_Chapter/502765_1_En_1_Fig30_HTML.jpg)


    Figure 1-30


    Flexible layout with two or three columns


    ![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig29_HTML.jpg](images/502765_1_En_1_Chapter/502765_1_En_1_Fig29_HTML.jpg)


    Figure 1-29


    Full-screen layout


    **Floor plans** refer to how the elements can be placed inside the layouts to
    be able to create a more complete application. Depending on the layout selection,
    there may be one or more floor plans that could be added inside the layouts. The
    full-screen layout can have one type of element, for example the Worklist.


    The flexible column layout is usually made up of a master/detail template, in
    which the **Master (UI)** view contains a list that is used for navigation, while
    the detail side of the template shows the details related to the selected item
    from the **(UI)** view. Very similar to the flexible column layout of two columns,
    the layout with three columns is often used for a master-detail-detail scenario.
    The reason to have some of these two- and three-column layouts is to avoid multiple
    navigations of the app keeping the user focused on the same screen while presenting
    related information on the various layouts.


    It is important to highlight **Smart controls** as part of the components used
    within the Fiori applications. Smart controls are those that are created from
    when an OData service is present in the Fiori application and the metadata of
    this service is used to build Smart controls. The Smart controls include smart
    filters, control configuration to include visible fields, and export to Excel,
    just to mention a few of the features, as shown in Figure [1-18](#502765_1_En_1_Chapter.xhtml#Fig18)
    as well. The smart filter bar can generate the smart input field controls and
    provides application filtering capability without the need to code a single line
    of code. It is managed entirely by the framework. Should your application require
    custom filtering or additional enhancements to the smart filter bar, then it is
    possible to leverage the functionality provided and include the custom handlers
    ourselves as custom extensions to the code. Most of the configurations for these
    Smart controls is done when placing the controls in the XML view and include the
    control attributes that are eventually bound to an OData service.


    **OData** services are fundamental in Fiori applications, as these services are
    used to expose or consume data from web clients via HTTP(s). OData is a protocol
    that has a very heavy use in Fiori applications as well as in other web technologies.
    SAP Fiori (UI5) controls primarily use two different versions of OData, v2 and
    v4. OData returns data in atom XML and in JSON formatted data. OData services
    can be queried based on the OData syntax rules as documented in the OData protocol.
    When creating some Fiori applications, there are also wizards to include an OData
    endpoint (URL), and the wizard includes the OData model and the metadata file
    and prepares the application to consume this type of service. OData will be discussed
    in depth in Chapter [2](#502765_1_En_2_Chapter.xhtml).


    ## Conclusion


    As we conclude our initial chapter, I hope you can understand the reasons that
    Fiori design is an important task prior to commencing any development of an application
    and is a fundamental pillar to the success of a software product development.


    Spending more time when initially designing a product will reduce unnecessary
    iterations between development teams and product owners or customers. Greater
    effort spent at the beginning of your project will allow the product to be more
    successful and increase its ROI. A second learning point within the first chapter
    is to become familiar with the SAP Fiori principles and SAP Fiori concepts such
    as components, elements, layouts, and floor plans in order to suggest them to
    clients and apply them when designing and developing SAP Fiori applications. Finally,
    understanding the integration points between SAP Fiori applications and what to
    expect from certain technologies involved will be fundamental to prepare your
    teams for a fun and exciting adventure. Familiarize yourself with various development
    tools, compare them, and choose the right ones, so you know when to use each of
    them for your scenarios. Thank you for completing this chapter and without further
    delay get ready to jump into the next chapter, where we will dive deep into the
    OData protocol and RESTful APIs.


    # 2. Consuming Data in Fiori Applications


    Welcome to Chapter [2](#502765_1_En_2_Chapter.xhtml)! This chapter will explain
    all about data and data models. You will learn how to consume data, how to mock
    data when it is not present, how to simulate data from a local JSON model, and
    how to expose data. Consuming data models via OData (Open Data protocol created
    by Microsoft and adopted by others) and JSON (JavaScript Object Notation) models
    are key concepts in SAP Fiori. Sometimes, it is necessary to consume external
    REST API (**R**epresentational **S**tate **T**ransfer) services from your SAP
    Fiori application. This chapter will touch on all these points from the SAP Fiori
    application point of view and also from a unit testing tool called `POSTMAN` REST
    client, which can be used in parallel while developing your front-end application,
    but you may not be ready to implement all of the XML views and JavaScript code
    necessary to make the data integration. Get ready to jump into technical concepts
    and let us learn together.'
