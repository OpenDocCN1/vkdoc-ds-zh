    ## Fiori Application on Various Devices


    One of the featured benefits of using a framework such as `SAPUI5` is that it
    is a responsive framework. Being responsive means that there is a single code
    base and the code may be able to adapt to most device screen sizes without the
    need to write additional custom code to make it work. As explained in Chapter
    [1](#502765_1_En_1_Chapter.xhtml), Fiori applications contain this feature of
    being responsive applications by nature. Within this section, we can observe that
