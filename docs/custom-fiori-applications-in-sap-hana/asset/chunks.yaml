- fmt: '# What Is Fiori?


    `Fiori` refers to the User Experience (UX) design language created by SAP and
    adopted in their current and all future software products: for example, the `Fiori
    Launchpad` in `S/4 HANA`, the `Fiori application library`, the `SAP HANA Cockpit`
    for `XSA`, just to mention a few. An example is shown in Figure [1-1](#502765_1_En_1_Chapter.xhtml#Fig1).


    ![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig1_HTML.jpg](images/502765_1_En_1_Chapter/502765_1_En_1_Fig1_HTML.jpg)


    Figure 1-1


    Sample SAP Fiori application


    `SAP Fiori` had its initial version in 2013; since then, three major versions
    have been released, and their themes are known as `Gold Reflection` (black & gold),
    `Belize` (blue), and `Quartz` (silver). The latest improved version, known as
    `Fiori 3`, was released in 2019, and it has the look and feel as shown in Figure
    [1-2](#502765_1_En_1_Chapter.xhtml#Fig2).


    ![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig2_HTML.jpg](images/502765_1_En_1_Chapter/502765_1_En_1_Fig2_HTML.jpg)


    Figure 1-2


    Fiori 3 UX


    The `Fiori UX` has also been extended to be included in mobile platforms such
    as `IOS` and `Android` for native devices. Developing applications for these devices
    requires additional programming languages, language runtimes, and simulators depending
    on the desired platform (as well as licensing if developing on the `IOS` platform).
    `IOS` devices use the `SAP Fiori for IOS Guidelines` and can be found here: [`https://experience.sap.com/fiori-design-ios/`](https://experience.sap.com/fiori-design-ios/),
    while the `Android` devices use the `SAP Fiori Guidelines for Android` and can
    be found here: [`https://help.sap.com/doc/c2d571df73104f72b9f1b73e06c5609a/Latest/en-US/docs/index.html`](https://help.sap.com/doc/c2d571df73104f72b9f1b73e06c5609a/Latest/en-US/docs/index.html).
    Furthermore, there are hybrid applications that maintain the look and feel of
    the `Fiori UX`, and they are relevant due to the fact that they enhance and leverage
    the functionality provided by the mobile features.


    Keep in mind that applications being built for `IOS` devices are required to be
    submitted to the app store for verification on the app store’s specific rules,
    licensing, and other platform-dependent checks before they can be published. There
    are various types of `IOS` licenses that need to be considered if this is the
    desired end goal. Licenses for `IOS` apps can be found on the Apple developer
    website: [`https://developer.apple.com/support/compare-memberships/`](https://developer.apple.com/support/compare-memberships/).


    For the purpose of this book, only the web version of the `SAP Fiori UX` will
    be covered, and I point out the `URLs` for native development for the reader to
    learn where to find additional information related to specific mobile platform
    versions. Whether you are developing a `Fiori` application for web or mobile platforms,
    the following steps will be similar. Let’s begin!


    The first and foremost important step of any product is the **Design** step. It
    does not matter if the product is a consumer product, a software product, or any
    other type of product: all products should go through this step. I cannot emphasize
    this step enough – cutting corners during this step will result in additional
    work later.


    Prior to creating a product, market research has to take place: Q&A sessions with
    possible users to see how the product will be utilized, how it can be beneficial
    for the users, and how to improve an initial prototype and eventually get as many
    details needed to help a company feel comfortable before starting to produce the
    product. The same concepts should also apply when creating a software product
    such as a `Fiori` application for the enterprise. Unfortunately, if you have been
    in the industry for a few years, you are probably familiar with some of the struggles
    that some development teams face when starting a new software application. If
    you noticed the last sentence, I went from analyzing a product, its users, and
    its potential uses to drastically showcasing a development team struggling, as
    is the situation in some companies. The reason I mentioned that is because it
    is a cruel reality that many teams face, and as developers working in the enterprise,
    we need to make sure we understand users’ needs before starting any development
    efforts to minimize rework and increase software adoption in the long run. Software
    adoption is not easy, and it needs to be done carefully.'
