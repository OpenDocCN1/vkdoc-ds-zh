  trans: '

    安装这些插件后，开发者可以使用 Visual Studio Code 创建他们的 Fiori elements 应用，如图 3-20 所示。


    ![../images/502765_1_En_3_Chapter/502765_1_En_3_Fig20_HTML.jpg](img/502765_1_En_3_Fig20_HTML.jpg)


    **图 3-20** 安装了 Fiori 工具的 Visual Studio Code


    从命令面板（`Ctrl + Shift + P`）中选择 `SAP Fiori Tool Generator` 来生成一个 SAP Fiori 应用，然后点击
    Visual Studio Code 右下角的**下一步**按钮。


    按照向导操作，开发者必须选择一个可用的模板。在此案例中，本书将展示来自 Fiori 应用的**工作清单**模板。然后选择**下一步**，如图 3-21 所示。


    ![../images/502765_1_En_3_Chapter/502765_1_En_3_Fig21_HTML.jpg](img/502765_1_En_3_Fig21_HTML.jpg)


    **图 3-21** 选择工作清单应用


    选择模板后，开发者必须选择将用于绑定到应用中的 OData 服务（或其元数据文件）。由于应用未直接连接到后端系统，本书将展示如何导入一个 XML 元数据文件作为替代方案。从
    OData 服务定义中，获取元数据内容（在服务托管的 URL 后追加 `/$metadata`），并将其保存为本地文件到您的计算机上。将此文件保存为 `metadata.xml`
    后，从向导的数据源部分选择它，如图 3-22 所示。您还必须在此 OData 元数据文件中选择一个端点。


    ![../images/502765_1_En_3_Chapter/502765_1_En_3_Fig22_HTML.jpg](img/502765_1_En_3_Fig22_HTML.jpg)


    **图 3-22** 数据源配置


    配置数据源后，继续下一步设置项目配置，如图 3-23 所示。


    ![../images/502765_1_En_3_Chapter/502765_1_En_3_Fig23_HTML.jpg](img/502765_1_En_3_Fig23_HTML.jpg)


    **图 3-23** 项目配置


    向导配置完所有设置后，便会创建您指定的应用。Visual Studio Code 会提示您打开新创建的应用。同意提示并打开新 Fiori 应用中的任意文件。以下打开的
    `package.json` 文件展示了应用配置、可从 CLI 执行的脚本，以及项目结构、依赖项或任何其他设置。请注意，*工作区*（左侧的文件夹层次结构和文件）中的
    UI5 应用显示 `metadata.xml` 文件已上传到 `localService` 文件夹；其中包含 `Component.js` 和 `manifest.json`（应用配置）文件。


    这些是所有 Fiori 应用中非常重要的文件。图 3-24 包含了许多需要观察和理解的重要配置项。请花些时间查看所有附加设置。


    ![../images/502765_1_En_3_Chapter/502765_1_En_3_Fig24_HTML.jpg](img/502765_1_En_3_Fig24_HTML.jpg)


    **图 3-24** Visual Code 内的 `package.json` 文件


    当应用准备好展示时，在 sapui5 中打开终端窗口，首先确保所有依赖项都已包含在内。开发者可以使用 `npm install` 命令来运行 npm 命令以安装它们。等待所有依赖项被下载到本地。在
    `npm install` 命令之后执行 `npm run start-mock` 命令，如图 3-25 所示。由于我们没有直接连接到 OData 服务，此命令将使用模拟数据运行
    Fiori 应用。此外，您可以观察到应用正在运行一个本地 node 服务器，并且应用从此处提供。


    ![../images/502765_1_En_3_Chapter/502765_1_En_3_Fig25_HTML.jpg](img/502765_1_En_3_Fig25_HTML.jpg)


    **图 3-25** 运行 `npm run start-mock` 命令


    图 3-26 显示了执行 `start-mock` 命令后的默认 Fiori 应用。


    最初，此应用不显示任何数据（或列），直到开发者访问屏幕右侧的**配置齿轮图标**。弹出窗口打开后，选择您希望显示的列。由于我们选择了**工作清单**模板应用，**工作清单**模板显示了绑定到
    OData 服务的网格，并根据服务的元数据定义使用**智能控件**显示列。


    ![../images/502765_1_En_3_Chapter/502765_1_En_3_Fig26_HTML.jpg](img/502765_1_En_3_Fig26_HTML.jpg)


    **图 3-26** **工作清单**模板上的列配置


    行分组是另一个开箱即用的重要功能。此功能由图 3-27 中高亮的图标表示。当用户选择该图标时，他们必须选择要按之分组项的列。当某一列中存在重复数据时，通常会使用此功能。以下是选择某一列进行分组后的输出结果。


    ![../images/502765_1_En_3_Chapter/502765_1_En_3_Fig27_HTML.jpg](img/502765_1_En_3_Fig27_HTML.jpg)


    **图 3-27** 分组


    同样重要的是，该模板还提供了其他开箱即用的功能，例如筛选。选择位于**齿轮图标**旁边的**漏斗图标**，查看如何将筛选应用于同一个 Fiori 应用，如图
    3-28 所示，以及其输出结果，如图 3-29 所示。如前所述，所有这些功能都是开箱即用的，无需任何额外的开发工作量。


    ![../images/502765_1_En_3_Chapter/502765_1_En_3_Fig29_HTML.jpg](img/502765_1_En_3_Fig29_HTML.jpg)


    **图 3-29** 应用筛选后的数据输出


    ![../images/502765_1_En_3_Chapter/502765_1_En_3_Fig28_HTML.jpg](img/502765_1_En_3_Fig28_HTML.jpg)


    **图 3-28** 智能模板筛选


    其他功能，如排序、创建和删除，在此仅作说明；我邀请您去探索它们，并了解其他功能，例如保存变式（显示在上图左上角的标准下拉菜单中），或与其他人共享应用（如右上角头像图标下方所示）。可能还有一些较小的应用配置设置需要处理，例如更改表格类型（`GridTable`
    代替 `Responsive`）、隐藏应用的某些部分（如不显示变式），或隐藏应用的某些区域；所有这些配置设置都是可能的，但有些繁琐，因为开发者需要修改 `manifest`
    配置文件中的应用设置。


    到现在，您可能会问，为什么在第 2 章中，我们使用 SAP Web IDE 创建 sapui5 应用的一种方法，需要编写视图、片段和控制器，而在这里的第 3
    章中，本书展示了包含相同 OData 服务的元数据定义的简单方法，并且不需要添加任何代码。事实上，这是许多 SAP 客户最常问的问题之一。客户通常会问，是否可以直接跳过编码？为什么他们需要采用更费时的方法？就像软件中的其他所有事情一样，不同的用例需要不同的开发方法。

    '
- fmt: '如果你正在开发一个非常标准的应用程序，且确实不需要定制化，那么使用第 [3](#502765_1_En_3_Chapter.xhtml) 章中介绍的采用
    `Fiori elements` 的方法是最佳选择。这种方法将为你节省大量时间和开发投入，但不会为轻松定制化提供太多自由度。在这种方法中，定制化是通过修改
    `manifest.json` 文件配置和在 XML 中添加注解来实现的。


    相反，如果你的团队正在开发的应用程序需要定制化、引入业务规则和灵活性，并且它基本上不会是一个标准的展示型应用程序，那么你的团队或组织需要考虑采用第 [2](#502765_1_En_3_Chapter.xhtml)
    章中展示的定制化方法。


    有一些 `Fiori` 指南可供参考，以确定哪种开发类型适合你和你的组织。请在 SAP Fiori 指南网页 URL：[`https://experience.sap.com/fiori-design/`](https://experience.sap.com/fiori-design/)
    中查看这些 Fiori 指南。


    ## 将外部 JS 库集成到 (SAPUI5) Fiori 中


    熟悉了开发工具，并开始使用其中一个应用程序工具后，很可能有时需要集成额外的 JavaScript 库，例如当 SAPUI5 库未提供某些功能时，或者需要利用其他库来构建更健壮的
    Fiori 应用程序时。第三方库通常作为 Web 应用程序的依赖项被包含进来，在我们的案例中，本书将展示一个过去使用过的此类库。


    本书要演示的第三方库叫做 `moment.js`。`moment.js` 是一个免费的 JavaScript 库，用于处理日期对象。通常，在 JavaScript
    中处理日期对象并不简单也不直接。可能需要使用这个第三方库的原因有很多，包括：


    1.  日期加法

    2.  日期比较

    3.  处理时区和偏移量


    图 [3-30](#502765_1_En_3_Chapter.xhtml#Fig30) 是 `moment.js` 网站的一张图片，开发者可以在此下载这个第三方库。


    *请阅读文档和任何许可信息，以确保你的项目可以使用此库。*


    ![../images/502765_1_En_3_Chapter/502765_1_En_3_Fig30_HTML.jpg](images/502765_1_En_3_Chapter/502765_1_En_3_Fig30_HTML.jpg)


    图 3-30

    `moment.js` 网站


    要将此库添加到项目中，首先从其网站下载。然后将其作为依赖项包含进来。在图 [3-31](#502765_1_En_3_Chapter.xhtml#Fig31)
    中，添加了一个名为 `externalLibs` 的文件夹；其中包含了 `moment.js` 库。该依赖项被注入到细节控制器文件中，并作为 `moment.js`
    引用。


    ![../images/502765_1_En_3_Chapter/502765_1_En_3_Fig31_HTML.jpg](images/502765_1_En_3_Chapter/502765_1_En_3_Fig31_HTML.jpg)


    图 3-31

    加载 `moment.js` 作为依赖项


    一旦 `moment` 库被加载到项目中，开发者就可以引用其不同的操作，如图 [3-32](#502765_1_En_3_Chapter.xhtml#Fig32)
    所示。


    ![../images/502765_1_En_3_Chapter/502765_1_En_3_Fig32_HTML.jpg](images/502765_1_En_3_Chapter/502765_1_En_3_Fig32_HTML.jpg)


    图 3-32

    `moment.js` 库已就绪


    要包含其他第三方库，请遵循相同的方法：将其下载到本地，添加到项目中，然后在项目中将其作为对库位置的引用包含进来。在利用某些开源库之前，请确保阅读许可条款，以避免任何潜在问题。


    ## 浏览器差异、限制与特性


    如今，在开发现代 Web 应用程序时，期望是能够部署我们的 Web 应用程序，并使其能够在不同设备、浏览器和屏幕尺寸上正常工作。大多数公司使用 Google
    Chrome、Mozilla Firefox 和 Microsoft 的 Internet Explorer。


