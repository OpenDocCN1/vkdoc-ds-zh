  trans: "\n# Puppeteer\n\n`Puppeteer` 是由谷歌开发的优秀 JavaScript 框架，也是目前可用的最佳测试框架之一。`Puppeteer`\
    \ 使用 `Node.js` 作为其 JavaScript 语言，可用于在我们的 Fiori 应用程序及任何其他 Web 应用程序中自动化执行单元测试。探索此工具的开发者还需要了解\
    \ DOM 选择器以及 Google Chrome 浏览器提供的常用浏览器开发者工具。该框架的主要特性在于，它提供了一套 API 用于控制 DevTools\
    \ 协议。请查看图 4-12，了解 `Node.js` 脚本如何与 `Puppeteer` API 交互，进而与 Chrome 开发者协议（`CDP`）以及无头\
    \ Chrome 进程交互的不同层级。\n\n![../images/502765_1_En_4_Chapter/502765_1_En_4_Fig11_HTML.jpg](img/502765_1_En_4_Fig11_HTML.jpg)\n\
    \n**图 4-12** Puppeteer 架构\n\n## 无头浏览器与有头浏览器\n\n您可能会好奇无头浏览器是什么意思。这意味着脚本可以自动化执行，而无需打开浏览器窗口。使用\
    \ `CDP`，`Puppeteer` API 可以模拟浏览器所具备的一切功能，而无需实际打开它。有时，我们需要使用有头浏览器（即打开窗口）来查看脚本与浏览器本身之间的自动化交互。此外，有头\
    \ `Puppeteer` 进程可以附加浏览器开发者工具，以便用户能在运行时进行交互并更新数值。\n\nDevTools 协议页面对其自身描述如下：*“开发者可以使用此\
    \ DevTools 协议来检查、交互、调试和分析 Chromium、Chrome 以及其他基于 Blink 的浏览器。”*\n\n在本章前文，我们还提到了单元测试、负责验证开发工作的不同角色，以及用于完成这些任务的一些工具。大多数\
    \ Web 开发者都熟悉按下 `F12` 键后弹出的浏览器工具。有些开发者使用此工具已久，但只关注其中部分用于调试代码的功能——例如查看文件在特定网络请求期间何时加载——也有一些开发者在开发完成并验证后，使用浏览器来截图。某些流程有时要求截图，以证明开发工作确已进行、已经过验证，并可参考程序的代码在变更前后的运行状况。开发者工具中还有其他标签页，提供了额外的功能，但开发者通常不会深入接触，或者尚未有机会探索。借助\
    \ `Puppeteer`，这些工具及其特性与功能均可通过编程方式进行交互。\n\n## 安装 Puppeteer\n\n安装 `Puppeteer` 需要使用\
    \ `npm` 命令，如图 4-13 所示。\n\n![../images/502765_1_En_4_Chapter/502765_1_En_4_Fig12_HTML.jpg](img/502765_1_En_4_Fig12_HTML.jpg)\n\
    \n**图 4-13** 使用 `npm` 安装 `Puppeteer` API\n\n安装完成后，一个 `node` 脚本如图 4-14 所示。此脚本将用于演示如何在自定义的\
    \ Fiori 示例应用程序中使用 `Puppeteer`。请注意，此 `Puppeteer` 脚本是作为独立于自定义 Fiori 应用程序的程序开发的，本书展示了使用\
    \ Visual Studio Code 编辑器来开发它。该脚本如图 4-14 所示。\n\n![../images/502765_1_En_4_Chapter/502765_1_En_4_Fig13_HTML.jpg](img/502765_1_En_4_Fig13_HTML.jpg)\n\
    \n**图 4-14** 示例 `Puppeteer` 脚本\n\n您可能会好奇为什么本书使用 Visual Studio Code。这是因为这是一款免费的编辑器工具，在开发和使用\
    \ `Node.js` 及其他编程语言时，通过启用相应的扩展，它拥有出色的特性。\n\n此外，我很高兴地告诉大家，使用 `Puppeteer` 框架是多么简单。它比本章介绍的其他框架都要容易上手。`Puppeteer`\
    \ 官方网站上有大量的文档，地址如下：[`https://devdocs.io/puppeteer/`](https://devdocs.io/puppeteer/)，此外在本书编写过程中查阅的其他来源，如\
    \ YouTube 视频和谷歌搜索结果等，也提供了丰富资料。\n\n## 探索 Puppeteer 脚本\n\n现在，让我们来探索上述脚本包含的内容及其功能。\n\
    \n![../images/502765_1_En_4_Chapter/502765_1_En_4_Fig14_HTML.jpg](img/502765_1_En_4_Fig14_HTML.jpg)\n\
    \n**图 4-15** 有头 `Puppeteer` 脚本启动 Fiori 应用程序\n\n1.  **第 1 行** 加载了 `Puppeteer` Node.js\
    \ 库（安装之后）\n2.  **第 3–5 行** 用于应用程序配置。为简化练习步骤，配置包含在同一个脚本中；不过，它也可以重构或从其他文件读取\n3.\
    \  **第 9 行及以下** 包含了正在被单元测试的主函数\n    1.  请注意，该框架从入口点开始就采用了异步编程；因此，您会在后续代码行中看到 `await`\
    \ 关键字。\n4.  **第 10 行** 初始化 `Puppeteer` 框架的一个新实例，并使用一些默认设置启动它，例如以**有头**模式启动（`headless:\
    \ false`），并忽略 HTTPS 错误（由于缺少证书）。\n5.  由于我们的自定义 Fiori 应用程序启用了路由认证，练习从打开应用程序的主页开始，并且必须先进行认证才能打开应用程序本身，如图\
    \ 4-15 所示。\n6.  使用 `headless: false` 标志是为了可视化应用程序的运行过程，如图 4-15 所示。请注意在打开的浏览器窗口中，地址栏正上方有一条消息显示“Chrome\
    \ is being controlled by automated test software”（Chrome 正由自动化测试软件控制），这意味着它确实是在运行我们的脚本。\n\
    \n脚本打开有头浏览器后，立即输入用户名和密码，并点击“登录”按钮，应用程序随后会重定向到自定义的 Fiori 应用程序，如图 4-16 所示。\n\n![../images/502765_1_En_4_Chapter/502765_1_En_4_Fig15_HTML.jpg](img/502765_1_En_4_Fig15_HTML.jpg)\n\
    \n**图 4-16** 认证后由 `Puppeteer` 脚本打开的 Fiori 应用程序\n\n## 验证主列表控件\n\n`Puppeteer` 脚本中下一个要验证的单元测试是确保主列表控件包含一个设备列表。请确保您知道列表控件的选择器标识符。在此例中，选择器是\
    \ `#__xmlview1--masterList-listUl`。该选择器被识别为 SAPUI5 框架赋予的 ID。使用 `Puppeteer` 的 `waitForSelector`\
    \ 函数，传入我们在 `appSettings.masterListSelector` 中定义的选择器，并传递给该函数。在回调函数中，我们简单地将结果元素输出到控制台，以确保该项存在。如果您好奇回调函数中还有哪些其他属性，可以在调用\
    \ `waitForSelector` 函数之前以及 `then` 回调内部设置断点，以检查这些对象。请查看图 4-17，了解等待选择器并对其进行检查的更多实现细节。\n\
    \n![../images/502765_1_En_4_Chapter/502765_1_En_4_Fig16_HTML.jpg](img/502765_1_En_4_Fig16_HTML.jpg)\n\
    \n**图 4-17** `Puppeteer` 脚本等待选择器\n"
- fmt: '# The next unit test to validate within the Puppeteer script is to make sure
    that clicking a device list item will populate the details view (right-hand side
    of the screen). This test is very powerful because we are mimicking the user interaction
    between the displaying of the app and the user clicking a list item to see its
    details.


    The tricky part here is to understand that the list may have 1, 2, or 100 items
    in it and we want to make sure we can select not only the first one but any of
    the list items in the list. My first thought was to select the children on the
    list and get the `nth` child based on jQuery rules or some selector. Then, I let
    my brain work a little bit more and I remembered that the JavaScript language
    has a `random` function in its `Math` library. I went ahead and included a variable
    to obtain a random number between 0 and the length of the list items. Once the
    random number was identified, then we needed to click such an element – yes!!!
    It sounds extremely good thinking it out loud, but the next hurdle is to get the
    random item from the list and then somehow click it.


    In Figure [4-18](#502765_1_En_4_Chapter.xhtml#Fig17), you can observe the new
    function I added to let the Puppeteer framework wait for the selector based on
    the element `ul`, which is an unordered list, and the list item `li`, based on
    an assigned CSS class. This CSS class is one provided by the SAPUI5 framework,
    and I was able to obtain it by opening the dev tools and identifying it.


    ![../images/502765_1_En_4_Chapter/502765_1_En_4_Fig17_HTML.jpg](images/502765_1_En_4_Chapter/502765_1_En_4_Fig17_HTML.jpg)


    **Figure 4-18** Puppeteer script waiting on a selector, calculating a random value,
    and clicking a list item


    After the Puppeteer framework waits for the list items, these items are passed
    to the callback function for further investigation to see how many records exist,
    for example. The next thing I did was to display into the console the first item
    from these list items.


    Then, I calculated the random value I described before and I used the `return`
    key because I wanted to use this element into my next callback, where I added
    the `click` function based on the returned element from the current callback function.
    It is amazing how the framework really allows asynchronous operations on these
    elements, plus it also allows the chaining of the elements as we identify and
    calculate one scenario and can pass it into the next for further investigation
    and profiling.


    I suggest you carefully examine Figure [4-18](#502765_1_En_4_Chapter.xhtml#Fig17)
    a few times to see how all the JavaScript concepts play well in this framework.


    ![../images/502765_1_En_4_Chapter/502765_1_En_4_Fig18_HTML.jpg](images/502765_1_En_4_Chapter/502765_1_En_4_Fig18_HTML.jpg)


    **Figure 4-19** Puppeteer script selecting random list item to display its details


    The next screenshot, Figure [4-19](#502765_1_En_4_Chapter.xhtml#Fig18), is displayed
    to show the readers the powerful things that can be accomplished in a scripted
    way, but also we can see them in the real window as if a user would be performing
    this interaction with our custom Fiori application.


    For the purpose of the reader, the Visual Studio Code console looks like this
    after having run the preceding scenario, and it is shown in Figure [4-20](#502765_1_En_4_Chapter.xhtml#Fig19).


    ![../images/502765_1_En_4_Chapter/502765_1_En_4_Fig19_HTML.jpg](images/502765_1_En_4_Chapter/502765_1_En_4_Fig19_HTML.jpg)


    **Figure 4-20** Console output from Puppeteer script


    Last but not least, we can script the Puppeteer unit test to close itself when
    it has completed by uncommenting the line `await browser.close()` at the end of
    the main function, as shown in Figure [4-21](#502765_1_En_4_Chapter.xhtml#Fig20).


    ![../images/502765_1_En_4_Chapter/502765_1_En_4_Fig20_HTML.jpg](images/502765_1_En_4_Chapter/502765_1_En_4_Fig20_HTML.jpg)


    **Figure 4-21** Closing browser at the end of the Puppeteer script


    This time the script was run, and it quickly opened the window, ran the different
    scenarios, and closed itself at the end of execution. In Figure [4-22](#502765_1_En_4_Chapter.xhtml#Fig21),
    we can see the log of the unit test, but the human factor was not able to capture
    the screenshot during the quick run of the script.


    ![../images/502765_1_En_4_Chapter/502765_1_En_4_Fig21_HTML.jpg](images/502765_1_En_4_Chapter/502765_1_En_4_Fig21_HTML.jpg)


    **Figure 4-22** Final console output after running entire script


    So far we have run several unit test cases using the Puppeteer framework to show
    the user interaction with the software; however, none of the test scenarios showed
    the network requests nor the data being transferred from the app to the OData
    service and vice versa.


    I will proceed to include one of these tests so that we can have a more complete
    unit test framework; it is also part of the automated script we are writing. At
    the end of the day, we need to also validate the data being sent back and forth
    from the application with a back-end system. Without further ado, here it is.
    Let us temporarily remove the browser close command so that we can allow the application
    to do the interception and analysis of the API request/response before closing
    the headful browser window, as shown in Figure [4-23](#502765_1_En_4_Chapter.xhtml#Fig22).


    Developers can observe the Puppeteer script showing the following:


    1. `page.on(‘request’, InterceptedRequest => ...)` – This callback allows the
    developer to analyze the request before it is sent to the back-end API. Developers
    can see current values, edit request headers, and request parameters and any other
    setting related to the HTTP(s) request.


    2. `page.on(‘response’, InterceptResponse => ...)` – This callback allows developers
    to analyze the response object, including the response, headers, cookies, and
    response actual data, among any other setting you can think of when receiving
    an HTTP(s) response object.


    For simplicity of the exercise, the Puppeteer script is also doing a few `console.log()`
    statements so that developers can see those values during their unit testing as
    shown in Figure [4-23](#502765_1_En_4_Chapter.xhtml#Fig22).


    Should any developer wish to see other values in the callback, they can also hover
    over the request/response variables to analyze those properties or also type in
    the debugging console to view the runtime values of specific objects.


    ![../images/502765_1_En_4_Chapter/502765_1_En_4_Fig22_HTML.jpg](images/502765_1_En_4_Chapter/502765_1_En_4_Fig22_HTML.jpg)


    **Figure 4-23** Puppeteer script intercepting network request and response


    Earlier in the book, we introduced a function to generate a random index as the
    selection of the master list control. Let us now interact with the custom Fiori
    application and make a manual selection from the current Puppeteer window to select
    a record which has additional records in the API request that is being intercepted.
    That''s right: the headful session can also be interacted by the user while performing
    the unit test of the application.


    In Figure [4-24](#502765_1_En_4_Chapter.xhtml#Fig23), the user has manually selected
    the DEVICE ONE record from the master list, and you can observe on the background
    application (left side of the image with white background) that the details of
    the item selected are displayed in the application while the Visual Code console
    (right side of Figure [4-24](#502765_1_En_4_Chapter.xhtml#Fig23) in black background)
    is also showing the intercepted request where the request method was logged (`GET`),
    as well as the intercepted response (status `200 OK` and seven records being returned,
    of which only five contain the Activity, which moreover are the records being
    displayed under the Activity tab of the application).


    ![../images/502765_1_En_4_Chapter/502765_1_En_4_Fig23_HTML.jpg](images/502765_1_En_4_Chapter/502765_1_En_4_Fig23_HTML.jpg)


    **Figure 4-24** Manually selected list item to analyze the intercepted response
    object'
