    system that exposes endpoints as entities. All interaction from OData models is
    done from the client (browser or application) and the server that is exposing
    these endpoints. There may be use cases where a developer needs to simulate some
    data, update it, and reflect it on the screen without having to post it to the
    back-end server. In these types of situations, developers can use a different
    model called a JSON model. A JSON model is a client-side model that allows manipulation
    of data from an application and does not necessarily require it to be sent it
    back to a server. Scenarios such as those requiring client-side data simulations
    are perfect for this type of use case.


    From the point of view of the SAPUI5 controls, it does not matter if the controls
    need to use an OData model or a JSON model. SAPUI5 applications support both JSON
    and OData models. The only differentiator when multiple models are present is
    that there needs to be named models when binding to a control or aggregation.


    A named model is one that has a specific name (instead of the default empty string).
    Named models are specified in the SAPUI5 application manifest file and then referenced
    from the XML views in an SAP Fiori application.


    Continue to create an OData service to demonstrate the setup of an OData service.
    This example is done in an SAP HANA express edition landscape running in XS Advance
    HANA 2 SPS04\. The book assumes the developer already has access to this type
    of system whether it is in an on-premise environment or in some cloud instance.
    The setup for an SAP HANA XSA API can also be read from my other book titled *Microservices
    in SAP HANA XSA* (Apress, 2020).


    Assume you have created an application in HANA XSA, and you have created an OData
    service called shockwaveSvc.xsodata. Following the preceding steps to see the
    metadata and the endpoints exposed first, let us look at this OData service metadata
    and definition in Figure [2-12](#502765_1_En_2_Chapter.xhtml#Fig12).


    ![../images/502765_1_En_2_Chapter/502765_1_En_2_Fig12_HTML.jpg](images/502765_1_En_2_Chapter/502765_1_En_2_Fig12_HTML.jpg)


    Figure 2-12


    OData service definition


    Currently, there is a single endpoint called ***DEVICE*** and it was exposed in
    the ***shockwaveSvc***.***xsodata*** service, as shown in Figure [2-13](#502765_1_En_2_Chapter.xhtml#Fig13).


    Notice that an XSA OData service can be defined as a single XSOData service, or
    an SAP HANA XS OData service can also contain multiple entities. Within this service
    we have an entity called ***wavex20.wavedb.data::tbls.DEVICE**.* This entity represents
    a CDS HANA table, called *tbls.DEVICE*, inside the ***wavedb*** database module
    of my ***wavex20*** MTA (**M**ulti-**T**argeted **A**pplication) project.


    By default, the XSOData service accepts all CRUD (Create, Read, Update, and Delete)
    operations; however, I have added a line of code to forbid the deletion of records
    from this endpoint. We will explore more about the forbidden command in the next
    chapter.


    ![../images/502765_1_En_2_Chapter/502765_1_En_2_Fig13_HTML.jpg](images/502765_1_En_2_Chapter/502765_1_En_2_Fig13_HTML.jpg)


    Figure 2-13


    XS OData service


    After creating the XSOData service, setting up a route in the xs-app.json file
    of the HTML5 module and activating the service, we can then navigate to it from
    the browser (or POSTMAN REST client).


    Figure [2-14](#502765_1_En_2_Chapter.xhtml#Fig14) shows the GET request from the
    Chrome browser.


    ![../images/502765_1_En_2_Chapter/502765_1_En_2_Fig14_HTML.jpg](images/502765_1_En_2_Chapter/502765_1_En_2_Fig14_HTML.jpg)


    Figure 2-14


    OData GET request


    In the sample request, we can observe a few more things:


    1.  The ***DEVICE*** endpoint has the ***ID*** property as ***key**.*


    2.  The ***key*** property is used for navigation to a single entry as well.


    3.  The properties for each record are also shown in the metadata operation and
    the data types are shown correctly.


    The table definition for the same endpoint is shown in Figure [2-15](#502765_1_En_2_Chapter.xhtml#Fig15).


    ![../images/502765_1_En_2_Chapter/502765_1_En_2_Fig15_HTML.jpg](images/502765_1_En_2_Chapter/502765_1_En_2_Fig15_HTML.jpg)


    Figure 2-15


    SAP HANA CDS table


    Within an SAPUI5 application, the OData service can be set up as a (named) model.
    To set up the OData model, we need to configure it from the manifest.json file.


    The ***manifest.json*** file, shown in Figure [2-16](#502765_1_En_2_Chapter.xhtml#Fig16),
    is the application configuration file that holds all the information necessary
    to create the SAP Fiori application, to configure the OData service, and it is
    used for all other application configurations necessary. The manifest.json file
    exists within the HTML5 module of an MTA application.


    ![../images/502765_1_En_2_Chapter/502765_1_En_2_Fig16_HTML.jpg](images/502765_1_En_2_Chapter/502765_1_En_2_Fig16_HTML.jpg)


    Figure 2-16


    manifest.json file


    The manifest file is broken down into three sections:


    1.  The **sap.app** section contains information about the ui5 version, any dependencies,
    and data sources.


    2.  The **sap.ui** section contains information about the user interface and setup,
    including what types of devices can display it.


    3.  The **sap.ui5** section contains details about the SAPUI5 application and
    its views, among other properties.


    To set up the named model, you must include the data source within the sap.app
    section and specify the URL where this OData service is located. There are a few
    scenarios that can be set up here:


    1.  In an SAP HANA XSA application where the OData service exists in a module
    within the same project, we can reference the OData service via a relative path.


    2.  In an SAP Fiori application running in the front-end server (NetWeaver front
    end and ABAP back end), we can also reference the relative path of the OData service
    as long as the application and the OData service live in the same domain/host.
    The same concept applies if the Fiori application is deployed to the SAP Cloud
    Platform in a neo-app.json file.


    3.  In the scenario where the OData we need exists outside of our domain/landscape,
    then we must include the fully qualified URL of that OData service as is the case
    for the Northwind OData service we used in the previous section as an example.


    Once the OData service is included in the manifest file, then we can reference
    it as a named model using the correct name from the sap.ui5/***models*** section,
    as shown in Figure [2-16](#502765_1_En_2_Chapter.xhtml#Fig16). Notice also we
    have another named model called i18n; this model is used in most UI5 applications
    when internationalization is required.


    In Chapter [3](#502765_1_En_3_Chapter.xhtml) we will go deeper into the named
    models and how they work in an SAPUI5 Fiori application; however, as a quick reference,
    the user interface binds to the named model as shown in the code snipper in Figure
    [2-17](#502765_1_En_2_Chapter.xhtml#Fig17).


    The example uses an SAPUI5 list control to show a list of ***DEVICE*** records,
    and the items in the list are bound to the ***shockwave>*** named model and the
    ***DEVICE*** endpoint. Each of the items is a Standard List Item control, and
    the title is bound to the ***shockwave>*** named model, using the ***SERIAL_NUMBER***
    and ***DESCRIPTION*** properties of the model.


    ![../images/502765_1_En_2_Chapter/502765_1_En_2_Fig17_HTML.jpg](images/502765_1_En_2_Chapter/502765_1_En_2_Fig17_HTML.jpg)


    Figure 2-17


    SAPUI5 list control


    When the named model is used in the SAPUI5 application, we can see the OData request
    from the browser by using the browser developer tools (F12) and clicking the network
    tab.'
