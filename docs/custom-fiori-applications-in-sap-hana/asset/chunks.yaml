    efforts to minimize rework and increase software adoption in the long run. Software
    adoption is not easy, and it needs to be done carefully.'
  trans: '

    # 什么是 Fiori？


    `Fiori` 指的是 SAP 创建的用户体验（UX）设计语言，并被其当前及未来的所有软件产品所采用：例如 `S/4 HANA` 中的 `Fiori 启动板`、`Fiori
    应用程序库`、`XSA` 的 `SAP HANA 驾驶舱`等，仅举几例。示例如图 1-1 所示。


    ![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig1_HTML.jpg](img/502765_1_En_1_Fig1_HTML.jpg)


    图 1-1


    SAP Fiori 应用程序示例


    `SAP Fiori` 于 2013 年推出首个版本；此后发布了三个主要版本，其主题分别称为 `Gold Reflection`（黑金色）、`Belize`（蓝色）和
    `Quartz`（银色）。最新改进版本称为 `Fiori 3`，于 2019 年发布，其外观和感觉如图 1-2 所示。


    ![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig2_HTML.jpg](img/502765_1_En_1_Fig2_HTML.jpg)


    图 1-2


    Fiori 3 用户体验


    `Fiori UX` 也已扩展至移动平台，例如支持原生设备的 `IOS` 和 `Android`。为这些设备开发应用程序需要额外的编程语言、语言运行时和模拟器，具体取决于目标平台（若在
    `IOS` 平台上开发，还需考虑许可问题）。`IOS` 设备使用 `SAP Fiori for IOS 指南`，可访问以下链接：[`https://experience.sap.com/fiori-design-ios/`](https://experience.sap.com/fiori-design-ios/)；而
    `Android` 设备则使用 `SAP Fiori for Android 指南`，可访问以下链接：[`https://help.sap.com/doc/c2d571df73104f72b9f1b73e06c5609a/Latest/en-US/docs/index.html`](https://help.sap.com/doc/c2d571df73104f72b9f1b73e06c5609a/Latest/en-US/docs/index.html)。此外，还有一些混合应用程序保持了
    `Fiori UX` 的外观和感觉，它们之所以重要，是因为它们增强并利用了移动设备提供的功能。


    请记住，为 `IOS` 设备构建的应用程序在发布前，必须提交至应用商店，并接受其特定规则、许可及其他平台相关检查的验证。如果这是最终目标，则需要考虑各种类型的
    `IOS` 许可证。`IOS` 应用的许可证信息可在 Apple 开发者网站上找到：[`https://developer.apple.com/support/compare-memberships/`](https://developer.apple.com/support/compare-memberships/)。


    就本书而言，仅涵盖 `SAP Fiori UX` 的 Web 版本，我会为原生开发提供 `URL` 链接，供读者了解如何查找与特定移动平台版本相关的更多信息。无论你是为
    Web 还是移动平台开发 `Fiori` 应用程序，后续步骤都将类似。让我们开始吧！


    任何产品首要且最重要的步骤都是**设计**阶段。无论产品是消费品、软件产品还是任何其他类型的产品：所有产品都应经历这一步骤。我怎么强调这一步骤都不为过——在此阶段偷工减料，只会导致后期额外工作量的增加。


    在创建产品之前，必须进行市场调研：与潜在用户进行问答环节，了解产品将如何被使用、如何对用户有益、如何改进初始原型，并最终收集尽可能多的细节，以帮助公司在开始生产产品前感到放心。同样的概念也应适用于创建像企业级
    `Fiori` 应用程序这样的软件产品。不幸的是，如果你在行业内工作过几年，可能对某些开发团队在启动新软件应用时面临的困境有所了解。如果你注意到最后一句话，我从分析产品、用户及其潜在用途，急剧转向展示开发团队
    struggling 的现状，正如某些公司中的情况一样。我之所以提到这一点，是因为这是许多团队面临的残酷现实，而作为企业中的开发者，我们需要确保在开始任何开发工作之前理解用户的需求，以最小化返工，并长期提高软件采纳率。软件采纳并非易事，必须谨慎进行。

    '
- fmt: '# Fiori Design


    As mentioned in the previous paragraph, design is a fundamental key component
    of the many steps to make a product succeed or fail. The more time invested upfront,
    the better prepared teams will be to develop products that will be adopted by
    users.


    Design does not only imply that there has to be only a graphic designer prototyping,
    sketching, or performing any other type of drawing; designing means that there
    are design thinking sessions using Post-Its, whiteboard drawings, and whatever
    it takes to understand the use and/or flow of the product by its user(s). Do not
    attempt to solve a problem or try to come up with a solution at this point yet.
    This activity is strictly to understand a users’ needs. (**Note** for developers)
    There will be enough time for solution solving later.


    It is very important that during this step the entire team (technical and nontechnical
    resources) can participate. Using tools such as a plain **Whiteboard** can benefit
    the product team and the business as they can and should all participate in design
    ideas. With this approach, the design can easily be changed, and the design team
    should be able and open to receive constant feedback. This exercise may seem too
    simple sometimes; however, it is crucial for the contributors of any new product
    to gather ideas and quickly change things before committing to sketching or prototyping
    to understand the business need. This is shown in Figure [1-3](#502765_1_En_1_Chapter.xhtml#Fig3).


    ![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig3_HTML.jpg](images/502765_1_En_1_Chapter/502765_1_En_1_Fig3_HTML.jpg)


    Figure 1-3


    Whiteboard design


    If the product team already has enough confidence in some of the design patterns
    for SAP Fiori, then they could proceed and move into sketching. There is one method
    called **Low-level design**, shown in Figure [1-4](#502765_1_En_1_Chapter.xhtml#Fig4),
    which means that sketching can be achieved, and a designer usually mocks up what
    the screen high-level components will be (boxes, grids, lists, and other placeholders).
    Designers can also show application navigation from this type of design. Because
    it is simple enough and it gives the idea, it can be a quick gain for product
    teams. In the other hand, one of the drawbacks for this type of design method
    is that the customer may not fully understand the low-level design and they could
    become overwhelmed by not seeing the clear and wider picture of the prototype.
    Often, in our day and age where we have so many tools and applications that can
    be leveraged for this purpose, customers like to see what their product will look
    like. In my opinion the low-level design has a lesser adoption rate than the whiteboard
    or high-level design approach, which is discussed in the next paragraph.


    ![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig4_HTML.jpg](images/502765_1_En_1_Chapter/502765_1_En_1_Fig4_HTML.jpg)


    Figure 1-4


    Low-level design


    A third method of design is **High-level design**, and it is shown in Figure [1-5](#502765_1_En_1_Chapter.xhtml#Fig5).
    This type of design means that a designer or a developer can start putting application
    controls (`SAPUI5`) on the screen and quickly build prototypes. Some RAD tools
    (Rapid Application Development) can be used for this purpose. This approach quickly
    shows the quicker application design to the customer. Most importantly, it shows
    exactly what the application will look like (not necessarily its behavior yet).
    Quite often customers wish to see exactly what they will receive at the end of
    development, and they assume that due to the prototype being done, then there
    is nothing else to do: wrong! Your team must let the customer know ahead of time
    about the prototype, and that development efforts are still needed on data integration,
    data binding, consuming data from web services, and moreover, adding any custom
    behavior such as business rules on the Fiori application.


    Tools such as the `SAP Web IDE` (Integrated Development Environment), `SAP Build`
    (shown in Figure [1-6](#502765_1_En_1_Chapter.xhtml#Fig6)), and others can help
    you quickly complete high-level design prototypes using drag-and-drop features
    within these tools or WYSIWYG (**W**hat **Y**ou **S**ee **I**s **W**hat **Y**ou
    **G**et) editors.


    *Each of the tools mentioned here may require some license for production use.
    Please verify license requirements before using these tools.*


    ![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig5_HTML.jpg](images/502765_1_En_1_Chapter/502765_1_En_1_Fig5_HTML.jpg)


    Figure 1-5


    SAP Web IDE layout editor


    If you decide to use the `SAP Build` tool, you will need to create an account
    and verify the license choices. The benefit of using the `SAP Build` tools is
    that you can prototype some of these applications, and including router navigation
    can also be achieved. `SAP Build` is simple enough to use even for nontechnical
    users. Many customers like the idea of having less technical dependency and having
    self-service tools; I think `SAP Build` could be a good tool for that purpose.
    There is a great feature within the `SAP Build` tool that allows the user to upload
    a spreadsheet to include data and immediately reflect it on the prototype that
    is being built. Once the prototype is close enough to what is needed, then it
    can be passed to the technical team to be integrated into the rest of the technical
    world.


    With the paid license of the `SAP Build` tool, a user may create multiple projects
    and keep them in their account. These prototypes/projects can then be imported
    into the `SAP Web IDE` where a web developer can continue their work by adding
    JavaScript code to the rest of the application. Also, if the user has not had
    a lot of exposure with `SAP Build` or `SAP Fiori`, there are some templates in
    the Gallery section that can be leveraged as starting points of someone’s prototyping
    learnings. There are also blogs, and a community page where users can participate,
    ask questions, and even benefit from blogs. With the free trial license in `SAP
    Build`, designers/developers can only create one application project. There are
    plenty of online resources to become familiar with and join in these online communities.
    If you do not know where to begin, explore within the `SAP Build` community.


    ![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig6_HTML.jpg](images/502765_1_En_1_Chapter/502765_1_En_1_Fig6_HTML.jpg)


    Figure 1-6


    SAP Build tool


    Whether the design is done with a whiteboard or a low- or high-level design, the
    end goal of this step is to understand users and how they will interact with a
    product; therefore, your team needs to focus on such a goal. It is beneficial
    to include targeted audience users and create a fictitious persona.


    A **persona** identifies an ideal fictitious user, their working environment,
    their gender, their tasks, how they will use the product, and any external factors,
    impediments, possible restrictions, or other metadata about this user in relationship
    to their interaction with a product (in our case it is software) as shown in Figure
    [1-7](#502765_1_En_1_Chapter.xhtml#Fig7). In addition to understanding the user
    needs, there also must be some research about any pain points that are currently
    encountered by the user community and how this new product can minimize, or even
    better, eliminate them. The goals for a Fiori design are to make the best and
    most efficient product that users are glad to have and that they will enjoy using
    to accomplish their day-to-day tasks.


    ![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig7_HTML.jpg](images/502765_1_En_1_Chapter/502765_1_En_1_Fig7_HTML.jpg)


    Figure 1-7


    Persona


    Although this book is related to software, the same principles apply to any other
    products, so let us analyze some successful products currently in the market.
    People may wonder, why are some of these products so successful? Overhead research
    and good design result in great ROI (return on investment).'
