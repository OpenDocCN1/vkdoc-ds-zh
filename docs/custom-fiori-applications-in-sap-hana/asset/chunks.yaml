    在图 2-18 中，你可以看到通过调用下方位置的`XSOData`服务从应用程序中初始获取数据的过程，同时包含请求方法、状态码以及`XSOData`服务所在的远程地址。在开发或使用`OData`服务和`SAP
    Fiori`应用程序时，了解所有这些属性非常重要。


    ![../images/502765_1_En_2_Chapter/502765_1_En_2_Fig18_HTML.jpg](img/502765_1_En_2_Fig18_HTML.jpg)


    图 2-18 Chrome 浏览器网络请求


    由于此场景使用的是真实的`OData`服务，当我们将`SAPUI5`控件绑定到命名模型时，可以立即看到数据。图 2-19 使用了与图 2-17 相同的控件。


    ![../images/502765_1_En_2_Chapter/502765_1_En_2_Fig19_HTML.jpg](img/502765_1_En_2_Fig19_HTML.jpg)


    图 2-19 在`SAPUI5`应用程序中使用的`OData`


    ## 使用 REST API


    表述性状态传递（REST）应用程序编程接口（API）是用于在请求 API 数据时处理自定义逻辑的 Web 服务。这与`OData`服务不同，后者仅接收 HTTP(s)请求，并在查询与后端数据匹配时返回数据，如果没有匹配的请求则返回零条记录。


    在下面的示例中，本书使用了一个`NodeJS`微服务（REST API）来从同一实体`DEVICE`返回数据。`OData`端点直接从表中返回数据与`Node
    JS`微服务 API 之间的区别在于：`Node JS` API 会接收传入的请求，对其进行分析，然后调用一个在`SAP HANA`中构建为计算视图的数据模型，查询同一张表，最后以`JSON`数组的形式返回数据。


    为什么开发者想要从自定义端点（例如使用`Node JS` API 描述的端点）开发和获取数据？原因是`OData`服务不允许自定义验证，并且 API 会根据
    HTTP 请求返回所有匹配的记录。在某些场景下，当 API 需要验证输入、包含业务逻辑或拥有自定义响应时，这些自定义 API 是更好的选择。为 API 的调用者提供自定义响应，比仅仅得到一个空响应（不知道过滤参数是否正确或有效，或者请求是否缺少必要信息）要好得多。在由`ABAP`堆栈提供的`OData`服务中，可以通过`ABAP`类提供自定义验证。这超出了本书的范围，但在此提及以供参考。


    当从`SAP HANA`或任何其他系统使用这些自定义 API 或微服务时，有多种方法可以实现这些操作：


    1.  使用`SAUI5`框架并采用`JSON`模型

    2.  使用`JQuery`异步 JavaScript（AJAX）操作，从`Fiori`应用程序向`REST` API 发起异步调用


    由于我们已经比较了`SAPUI5`框架和`JQuery` JavaScript 框架，下面让我们在表 2-3 中比较它们的异同。


    表 2-3 `SAPUI5`与`JQuery`框架比较


    | `SAPUI5` | `JQuery` AJAX |

    | --- | --- |

    | 这是一个由 SAP 开发的框架，提供 HTML5/CSS3 控件，SAP 用它来创建 Fiori 应用程序。其控件具有可以是同步或异步的事件。 | 这是一个小巧、快速的
    JavaScript 框架，允许跨浏览器操作 DOM、处理事件和动画。它支持 AJAX 调用，并被 JavaScript 开发者广泛采用。 |

    | 它有一个名为`openui5`的开源版本。 | 它是一个开源库。 |

    | 它不依赖于`JQuery`，但可以与之集成。 | 它有多个版本，适用于 Web、移动端和单元测试。 |


    在使用 REST API 时可能会遇到一些常见问题。一些常见场景包括向我们的网络外部发起请求，从而导致跨域请求错误。为防止跨域请求并最小化攻击风险，可以在服务/API
    中包含某些措施。这些措施包括：能够防御跨域请求、根据请求头拒绝请求、仅接受来自特定域的请求、以及接受包含特定令牌的请求等。从`SAP HANA XSA`应用程序中，我们可以将身份验证类型设置为路由、证书或基本身份验证。


    路由身份验证意味着发往/来自应用程序的请求需要由`UAA`（用户身份验证和授权）服务进行验证，正如 Cloud Foundry 规范中所述，并且`SAP HANA
    XSA`也采用了相同的实现方式。在我的书《*Microservices in SAP HANA XSA*》（Apress, 2020）中，我深入详细地解释了`UAA`服务以及它如何在`SAP
    HANA XSA`环境中使用。


    在`Fiori`应用程序中使用模型的其他情况还包括，当没有`OData`模型（服务器端）时，需要一个本地（客户端）模型。这种模型被称为`JSON`模型。`JSON`模型允许模拟数据，并且该模型中的数据不需要绑定到服务器。开发者可以通过以下两种方式创建`JSON`模型：


    ![../images/502765_1_En_2_Chapter/502765_1_En_2_Fig23_HTML.jpg](img/502765_1_En_2_Fig23_HTML.jpg)


    图 2-23 设置设备模型的`models.js`文件


    1.  在`manifest.json`文件中指定`JSON`模型，如图 2-20 所示。


    ![../images/502765_1_En_2_Chapter/502765_1_En_2_Fig20_HTML.jpg](img/502765_1_En_2_Fig20_HTML.jpg)


    图 2-20 显示本地模型的`manifest.json`文件


    然后从应用程序中使用该模型来读取、设置或获取命名模型中的特定属性，如图 2-21 所示。


    ![../images/502765_1_En_2_Chapter/502765_1_En_2_Fig21_HTML.jpg](img/502765_1_En_2_Fig21_HTML.jpg)


    图 2-21 从浏览器控制台查询命名模型


    2.  从 Component 文件中创建`JSON`模型，例如图 2-22 中所示的`i18n`设备模型。


    ![../images/502765_1_En_2_Chapter/502765_1_En_2_Fig22_HTML.jpg](img/502765_1_En_2_Fig22_HTML.jpg)


    图 2-22 `i18n`设备模型


    使用如图 2-23 所示的`models.js`文件。

