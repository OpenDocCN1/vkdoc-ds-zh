    ## Tools for Developing and Debugging Fiori Applications


    In Chapters [2](#502765_1_En_2_Chapter.xhtml) and [3](#502765_1_En_3_Chapter.xhtml),
    we have been showcasing several tools that are used for development, and we have
    also shown debugging steps while developing an SAP Fiori application. Next, we
    would like to introduce some additional tools that developers may encounter, maybe
    on their next project.


    The first, and most common, tool is the SAP Web IDE. There are several versions
    of this tool. Depending on the type of application you are going to build, there
    may be different license types that need to be considered. Look at the SAP Web
    IDE licensing details to decide which version is right for you or your organization.


    The SAP Web IDE personal edition is one of the versions of the SAP Web IDE, and
    it is used for local development. It can be downloaded from the SAP tools page
    at [`https://tools.hana.ondemand.com/#sapui5`](https://tools.hana.ondemand.com/%2523sapui5).
    The login page looks like Figure [3-16](#502765_1_En_3_Chapter.xhtml#Fig16).


    ![../images/502765_1_En_3_Chapter/502765_1_En_3_Fig16_HTML.jpg](images/502765_1_En_3_Chapter/502765_1_En_3_Fig16_HTML.jpg)


    Figure 3-16


    SAP Web IDE personal edition


    After logging in to the `SAP Web IDE personal edition`, a developer is presented
    with the welcome page. From there, the developer can navigate to the workspace
    area where he/she will be working for the most part. Within the workspace, developers
    can create projects based on templates or create freestyle custom applications,
    as shown in Chapter [2](#502765_1_En_2_Chapter.xhtml) and in Figure [3-17](#502765_1_En_3_Chapter.xhtml#Fig17).


    ![../images/502765_1_En_3_Chapter/502765_1_En_3_Fig17_HTML.jpg](images/502765_1_En_3_Chapter/502765_1_En_3_Fig17_HTML.jpg)


    Figure 3-17


    Personal Web IDE workspace


    One or more projects can be created inside the workspace. All of these projects
    contain very similar project structures.


    The next tool I would like to describe here is the `SAP Web IDE full stack` from
    the SAP cloud (and trial) platform (Figure [3-18](#502765_1_En_3_Chapter.xhtml#Fig18)).
    This version is a free version, and it is for the purpose of coming up with a
    sample SAP Fiori application to share with the readers of this book. Full stack
    means that developers can use it to develop UI5 applications, HANA database development
    objects, and Node JS APIs. There are many features offered from this tool, and
    I highly recommend that other developers invest time in understanding them (GIT
    integration, connecting to a HANA database, connecting to back-end ABAP systems,
    and debugging, just to mention a few of the many features offered).


    ![../images/502765_1_En_3_Chapter/502765_1_En_3_Fig18_HTML.jpg](images/502765_1_En_3_Chapter/502765_1_En_3_Fig18_HTML.jpg)


    Figure 3-18


    SAP Web IDE full stack


    An additional advantage of using the SAP Web IDE tool is that it has a uniform
    look and feel across the different versions that it offers (cloud, on-premise,
    or personal edition). This is a huge plus, allowing developers to switch tools
    and still be able to continue their development as they progress from project
    to project or from client to client.


    Another popular tool is Microsoft Visual Studio Code. This is a free code editor
    and IDE that can be used along with Fiori plug-ins that can be optionally installed.
    Visual Studio Code is probably the most robust IDE to date and it also can also
    be used for development in other languages (node, JavaScript, Go, Python). It
    is displayed in Figure [3-19](#502765_1_En_3_Chapter.xhtml#Fig19). To install
    these plug-ins, open the Visual Studio Code extensions and install them. Make
    sure your system has `node` and `npm` installed if you have not installed them.
    These open source packages are required.


    ![../images/502765_1_En_3_Chapter/502765_1_En_3_Fig19_HTML.jpg](images/502765_1_En_3_Chapter/502765_1_En_3_Fig19_HTML.jpg)


    Figure 3-19


    Visual Studio Code with Fiori plug-ins'
