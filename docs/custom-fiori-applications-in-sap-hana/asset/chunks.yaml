    ## Conclusion


    Thank you for arriving at the conclusion of Chapter [3](#502765_1_En_3_Chapter.xhtml).
    The main purposes of this chapter were to showcase custom applications built in
    SAP HANA XSA and some of the minor possible customizations that can be done in
    SAP Fiori applications that use Fiori elements. Presenting the two types of applications
    was to inform you and make you aware of when to use Fiori elements (minor to zero
    customizations) and also when you should consider some of the SAP custom Fiori
    applications to be developed as freestyle applications (which results in a lot
    more flexibility with design and development). The chapter also touched on the
    various tools that can be used while developing Fiori applications; some of these
    tools are open source, some are SAP licensed. Understanding and knowing what tool
    to use for the right approach will also help developers be more productive during
    their development cycle. Finally, the book showed a comparison of how the same
    applications display differently on the different browsers and made you aware
    of certain performance and visual degradations while using these browsers. I hope
    this chapter was to your liking and that you received enough information to guide
    you in deciding the tools for your next development adventure.


    # 4. Unit Testing of Fiori Applications


    Welcome to Chapter [4](#502765_1_En_4_Chapter.xhtml). In this chapter, the book
    progresses from the development stage that was shared in Chapter [3](#502765_1_En_3_Chapter.xhtml),
    evolving into unit testing. You may wonder if unit testing is part of development
    and if it needs to be accomplished by the developer. Let us start with an initial
    response of yes. The developer is in charge of creating a piece of software and
    they are indeed in charge of unit testing their code to ensure the next set of
    people that their development is completed and that it has no bugs. The next set
    of people looking at the software (with or without user interface) will naturally
    interact with this software and perform additional steps of testing if you will.
    Whether these people are intentionally trying to test the software or not, any
    interaction with the software is still considered testing.


    If the people that are interacting with our software find an issue, then they
    may report it, and as a result, a bug is created and tracked with the purpose
    of fixing it before then releasing the software again. It becomes a cycle where
    the developer is constantly writing new software, adding fixes, or enhancing the
    original piece they created or continue to maintain. Most developers enjoy writing
    new software and new features – creating something new – rather than going back
    and fixing bugs they did not find or bugs they did not create. This chapter is
    to help developers with setting up their unit testing environment so that they
    can spend more time developing new features and hopefully less time doing repeated
    testing. That is right: one of the goals of unit testing and automating testing
    is to leverage tools and frameworks to set up and execute these repeated tasks,
    saving the developer’s time and keeping the business in a continuous integration/delivery
    mode.


    ## Unit Testing Frameworks


    There are many ways to skin a cat, and in software development, there are many
    ways to perform unit testing. In this section, the book introduces a few different
    unit testing frameworks that have been used in prior experiences. Further, these
    unit testing frameworks are used in Fiori development for the user interfaces,
    for the consumption of OData services, and to evaluate the completeness of the
    application. Table [4-1](#502765_1_En_4_Chapter.xhtml#Tab1) shows the different
    frameworks that are going to be discussed in this chapter.


    **Table 4-1** Different JS Unit Test Frameworks


    | Framework Name | Description | URL |

    | --- | --- | --- |

    | `QUnit` | Powerful and easy-to-use JS framework | [`https://qunitjs.com/`](https://qunitjs.com/)
    |

    | `Nightmare JS` | High-level browser automation library | [`http://www.nightmarejs.org/`](http://www.nightmarejs.org/)
    |

    | `Puppeteer` | High-level node library API to control headless Chrome dev tools
    | [`https://developers.google.com/web/tools/puppeteer`](https://developers.google.com/web/tools/puppeteer)
    |


    ## Fiori Application Unit Testing


    Fiori (`SAPUI5`) applications use the `QUnit` framework just out of the box; however,
    other unit testing frameworks may also provide similar features to your team if
    you are considering other unit testing framework solutions.


    Before getting into testing, developers must understand the requirement of what
    they are developing and what they are testing. During development, developers
    need to know the expected inputs and outputs they need to create meaningful and
    successful test cases. Understanding a unit testing scenario also requires understanding
    other situations of how the users will utilize their software and which devices
    will be used for testing.


    In the first exercise, the book goes over three different test cases:


    1.  The first test case is to compare `1` being equal to `1` just to get us started
    with the framework.


    2.  The second test case is to compare two dates in short format.


    3.  The third test case contains a group of three validations (called assertions).
    These assertions are broken down to invoke an OData web service, to ensure the
    time to get data is under one second, to make sure there is at least one record
    being returned, and finally to compare the object structure to an expected object
    structure a developer has set up.'
