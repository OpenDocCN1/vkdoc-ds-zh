    \n图 4-29\n异步资源加载\n\n![../images/502765_1_En_4_Chapter/502765_1_En_4_Fig27_HTML.jpg](img/502765_1_En_4_Fig27_HTML.jpg)\n\
    \n图 4-28\nOData 服务发起批处理请求\n\n3.  如果您的自定义应用程序使用图像文件，请确保图像质量良好且其大小能够快速读取并加载到应用程序中。运行浏览器开发者工具查看加载这些图像的时间，可以改善您的加载时间。\n\
    \n4.  利用 SAP 图标执行应用程序中所需的某些操作。由于`SAPUI5`框架提供的图标已经是同一库的一部分，您可以利用这些图标。此外，使用这些图标（如练习中图标标签栏中包含的图标）也有利于您的\
    \ Fiori 开发，因为您所包含的资源符合框架的规则和指南。\n\n5.  从 OData 服务加载数据的改进包括：能够设置`SAPUI5`控件聚合器以按需加载此类数据，并设置一个可见元素数量作为阈值，从而使控件仅加载最终用户所需或可见的内容。遵循这条建议，确实使我们的自定义\
    \ Fiori 应用程序具有现代快速 Web 应用程序的外观和感觉，如图 [4-28] 和 [4-29] 所示。\n"
- fmt: '# Conclusion


    As I arrive to the end of this chapter, there is a bittersweet memory of the experiences
    I want to share with all the readers; there are some development frameworks (for
    unit testing and for non-unit testing) which require simple configuration, and
    sometimes there may be a lot of more advanced and deeper technical knowledge required
    when using these frameworks. I suggest that all developers become familiar with
    a couple of choices before deciding on which framework they are willing to implement,
    study, and run with. There are other factors in our projects that may limit us
    from time and resources and those extra factors are the main reasons why projects
    sometimes end up with simple unit testing frameworks, while other times they end
    up with more elegant solutions, as I have discovered Puppeteer to be one of the
    most elegant and simple solutions currently available.


    Analyzing pros and cons for each framework should be part of your unit test design.
    Further, looking at the available documentation should be a driving factor to
    adopt a framework when developers are getting into newer territory. I found Puppeteer
    to be my favorite choice of unit testing framework, even though I only touched
    on the surface of the framework due to limitations on space and time for the writing
    of this text. I hope you can use some of the scripts shared during the exercise
    to get into or expand your knowledge of the unit testing frameworks. Last but
    not least, there are other manual alternatives for you to get started into unit
    testing if you are still not comfortable with automated testing; we all start
    somewhere and I hope you can master the manual steps first and then get into one
    of these enterprise-level reputable options. I cannot wait to hear feedback from
    you if you decide to expand on QUnit, Nightmare JS, or Puppeteer. I wish you good
    luck in your implementation!


    # 5. Deploying Custom Fiori Applications


    Welcome to the final chapter of *Custom Fiori Applications*. This is an exciting
    chapter because everything that has been presented thus far is now going to be
    promoted to a different environment so that it can be used by people other than
    developers. Deploying an application involves more than copying files or clicking
    buttons to make our software move from a local workspace or development environment
    into a quality environment or, even better, eventually into a production environment.
    There is probably a set of items that need to be verified before software is deployed
    to upstream environments. Depending on the company’s policies, certain steps may
    be followed during the software development life cycle, including related steps
    to approve and release software. There may be certain nontechnical requirements
    that need to be met prior to the release of this or other web applications.


    The book assumes that pre-requirements have been met – documentation updated,
    quality assurance (QA) testing met, user acceptance testing (UAT) completed, and
    approvals from managers received – before the next set of steps is executed. Also,
    any external accounts used are already created in the SAP Cloud Platform or the
    Amazon Web Service (AWS) environments.


    ## Preparing the Deployment and Software Versioning


    When preparing and releasing software, there are various places where versioning
    can be tracked for the application itself and for auditing purposes. As developers
    and technical owners of software, we also must keep track of the different integration
    points we have with other external software libraries. Within this custom Fiori
    application, the book used the versions shown in Table [5-1](#502765_1_En_5_Chapter.xhtml#Tab1).


    Table 5-1


    Software Versions Used during the Development of the Fiori Application


    | Software or library | Version | How to figure out version |

    | --- | --- | --- |

    | HANA XSA | HANA 2 SPS 04 | HANA XSA installation |

    | Fiori UX | 3 | Configured in `index.html` |

    | SAPUI5 | 1.80.1 | `Ctrl + Shift + Alt + P` from browser |

    | Node JS | 12.16.1 | `cmd node -v` from cmd line |

    | NPM | 6.13.4 | `cmd npm -v` from cmd line |

    | JQuery | 3.1.0 | Open file from IDE |

    | Moment.JS | 2.27.0 | Open file from IDE |

    | QUnit | 2.10.1 | Open file from IDE |

    | Nightmare JS | 3.0.2 | `node_module` from IDE |

    | Puppeteer JS | 5.2.1 | `node_module` from IDE |

    | OData | v2 and v4 | Metadata of the file from browser |

    | `mta.yaml` | 0.0.1 | Configured by developer from SAP Web IDE |


    As you can see, there are many integrations in the example custom Fiori application,
    and they need to be looked at and maintained while making sure that whatever it
    is developed with, is also maintained when it reaches the production environment.
    Keeping software versioning handy is extremely important when issues and bugs
    are reported due to issues that may not be part of a feature implemented by the
    Fiori developer; sometimes, these issues may arise from a dependency of these
    external libraries or modules. Often, companies may conduct audits against a company
    that follows compliance processes, and it is always very useful to have proof
    of documentation for such situations.


    You may wonder what other reasons are required to keep the versioning available
    when developing custom Fiori applications. Generally, there can also be new releases
    of the external dependencies, and in that situation, developers may need to consult
    their documentation and logs to verify which versions they currently have and
    to see if it is worth upgrading to a newer release or if the newer release is
    compatible with the rest of their environment. There are general guidelines when
    software is generally available and from time to time, newer features may even
    require newer hardware. Sometimes, there are minor releases or even patches in
    software that may not have a huge impact in the development and integration of
    custom applications; in such situations, there may be little to no impact and
    the integration may be safe to adopt. If the upgrade of a dependency is coming
    in the form of a major release, then it is advisable to analyze the impact of
    the new features, pros/cons, and what benefits are being offered to understand
    if it makes sense to plan for an upgrade. This is a common scenario with SAP software
    or other paid software that goes through a release cycle providing its customers
    with the latest and greatest features available.


    As displayed in Table [5-1](#502765_1_En_5_Chapter.xhtml#Tab1), software comes
    in a variety of versions. Best practices in software versioning describe the version
    pattern as `X.Y.Z`, where


    1. **X** represents a major release number. A major release means that various
    features were added to the software and released.


    2. **Y** represents a minor release number. A minor release means that a small
    feature was added to the software and released.


    3. **Z** represents a patch number. A patch number means that a different build
    of the software was added and released.'
