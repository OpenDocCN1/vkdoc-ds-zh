    ## Consuming REST APIs


    **RE**presentational **S**tate **T**ransfer (REST) Application Programming Interfaces
    (APIs) are web services that are used for handling custom logic when requesting
    data from an API call, unlike OData services, which only take the HTTP(s) request
    and return data when a query matches data in the back end or returns zero records
    if no matching requests exist.


    In the following example, the book uses a NodeJS microservice (REST API) to return
    data from the same entity, DEVICE. The difference between the OData endpoint returning
    the data directly from the table and the Node JS microservice API is that the
    Node JS API takes the incoming request, analyzes it, and then calls a data model
    built as a calculation view in SAP HANA, querying the same table and then returning
    the data as a JSON array.


    Why would a developer want to develop and consume data from a custom endpoint
    such as the one described using a Node JS API? The reason is that the OData service
    does not allow custom validation and the API returns all the matching records
    according to the HTTP request. In certain scenarios when the API requires to validate
    inputs, include business logic, or have a custom response, then these custom APIs
    are a better approach to consider. Giving the caller of the API a custom response
    makes a bigger difference than simply getting an empty response not knowing if
    the filter parameters were correct or valid or if the request may have been missing
    required information. In an OData service provided by an ABAP stack, the OData
    service can provide custom validation from an ABAP class. This is out of the scope
    of the book, but included for your reference.


    When consuming these custom APIs or microservices from SAP HANA or any other system,
    there are multiple ways in which these operations can be achieved:


    1.  Using the SAUI5 framework and considering a JSON model


    2.  Using a JQuery asynchronous JavaScript (AJAX) operation for asynchronous calls
    from the Fiori application toward a REST API


    Since we have included a comparison between the SAPUI5 framework and the JQuery
    JavaScript framework, let us compare similarities and differences in Table [2-3](#502765_1_En_2_Chapter.xhtml#Tab3).


    Table 2-3


    SAPUI5 vs JQuery framework comparison


    | SAPUI5 | JQuery AJAX |

    | --- | --- |

    | It is a framework developed by SAP that provides HTML5/CSS3 controls and is
    used by SAP to create Fiori applications.Its controls have events that can be
    synchronous or asynchronous. | It is a small, fast JavaScript framework that allows
    manipulation of the DOM, event handling, and animation across browsers.It allows
    AJAX calls and it has a wide adoption by JavaScript developers. |

    | It has an open source version called openui5. | It is an open source library.
    |

    | It does not require JQuery but it can integrate with it. | It has different
    versions, for web, mobile, and unit testing. |


    There may be some issues that come up when consuming REST APIs. Some of the common
    scenarios include making requests outside of our network resulting in cross-domain
    request errors. To prevent cross-domain requests and to minimize the risk of attacks,
    certain measures can be included within a service/API. These measures include
    being able to guard against cross-domain requests, reject requests based on request
    headers, accept only requests from a specific domain, and accept requests that
    contain specific tokens, just to mention a few. From an SAP HANA XSA application
    we can set up the authentication type as route, certificate, or basic.


    Route authentication means that the request made to/from an application needs
    to be validated by the UAA (user authentication and authorization) service as
    described in the Cloud Foundry specifications and as the same implementation is
    adopted by SAP HANA XSA. In my book *Microservices in SAP HANA XSA* (Apress, 2020),
    I explained in deep detail about the UAA service and how it is used within an
    SAP HANA XSA environment.


    Additional situations for using models in a Fiori application can also include
    situations when there is no OData model (server side) and there needs to be a
    local (client-side) model. This type of model is known as a JSON model. JSON models
    allow for simulation of data, and the data in such a model does not need to be
    bound to the server. Developers can create JSON models in the following two ways:


    ![../images/502765_1_En_2_Chapter/502765_1_En_2_Fig23_HTML.jpg](images/502765_1_En_2_Chapter/502765_1_En_2_Fig23_HTML.jpg)


    Figure 2-23


    models.js file setting the device model


    1.  Specifying the JSON model in the manifest.json file as shown in Figure [2-20](#502765_1_En_2_Chapter.xhtml#Fig20).


    ![../images/502765_1_En_2_Chapter/502765_1_En_2_Fig20_HTML.jpg](images/502765_1_En_2_Chapter/502765_1_En_2_Fig20_HTML.jpg)


    Figure 2-20


    manifest.json file showing a local model


    Then using it from the application to read the model, set or get a specific property
    in the named model as shown in Figure [2-21](#502765_1_En_2_Chapter.xhtml#Fig21).


    ![../images/502765_1_En_2_Chapter/502765_1_En_2_Fig21_HTML.jpg](images/502765_1_En_2_Chapter/502765_1_En_2_Fig21_HTML.jpg)


    Figure 2-21


    Querying the named model from the browser console


    2.  Creating a JSON model from the Component file like the i18n device model shown
    in Figure [2-22](#502765_1_En_2_Chapter.xhtml#Fig22).


    ![../images/502765_1_En_2_Chapter/502765_1_En_2_Fig22_HTML.jpg](images/502765_1_En_2_Chapter/502765_1_En_2_Fig22_HTML.jpg)


    Figure 2-22


    i18n device model


    Using the models.js file as shown in Figure [2-23](#502765_1_En_2_Chapter.xhtml#Fig23).'
