  trans: "\n# QUnit\n\n在牢记这三个测试用例的同时，让我们继续分析和在我们的应用程序中设置 `QUnit` 框架。如果要在 `Node JS`\
    \ 环境中使用 `QUnit` 框架，则无需任何配置；如果要在基于浏览器的应用程序中使用（我们的情况就是如此），则只需极少的配置。我之所以提到 `Node\
    \ JS`，是因为稍后我们也会在其他一些框架中使用它。要成功使用该框架，开发者必须熟练掌握 JavaScript 语言，最好对 `ES6` 中的箭头函数有良好的理解，并且还应该对浏览器开发者工具有一定的了解。\n\
    \n通常，`SAPUI5` 模板包含一个 `test` 文件夹用于实现这些测试用例。如果你的项目没有包含这样一个文件夹，那么请按照后续步骤来引入一个单元测试框架。\n\
    \n第一个练习将展示 `QUnit` 框架。\n\n![../images/502765_1_En_4_Chapter/502765_1_En_4_Fig1_HTML.jpg](img/502765_1_En_4_Fig1_HTML.jpg)\n\
    \n**图 4-1** 本地 QUnit 框架\n\n1.  首先，创建一个如图 4-1 所示的 `test` 文件夹。你可以像下面的练习那样包含一个本地的\
    \ `QUnit` 框架，或者如果你更喜欢使用内容分发网络资源（`CDN`），那么你需要在 `html` 文件的 `script` 标签中体现该 URL（第\
    \ 10 行）。在本练习中，我们从 QUnit 官网下载了 `QUnit` 框架（版本 `2.10.1`）的文件，并将其本地包含在我们的项目中。\n2. \
    \ 接下来，我们创建了一个 `qunit.html` 文件，如图 4-1 右半部分所示，该文件将是我们单元测试场景的入口点。这个文件展示了单元测试**模块**的输出，这些模块将在后面进一步解释。文件中还引用了\
    \ `qunit-2.10.1.css` 文件，该文件用于设置 `QUnit` 测试套件输出屏幕的样式。\n3.  最后，如图 4-1 的第 16 行所示，在一个单独的\
    \ `qunitTest.js` 文件中引用了测试场景。将单元测试模块化对你最有利，这样你的所有代码就不会都存在于同一个文件中。在测试和开发过程中采用模块化方法会使工作更轻松。\n\
    \n在加载了 `QUnit` 场景的外部引用之后，本书还引用了本地的 `JQuery` 版本 `3.1.0` JavaScript 文件，该书将用它来演示调用\
    \ `OData` 服务，并且书中还引用了 `moment.js` 库，因为其中一个练习演示了使用外部库来格式化 `date` 对象数据类型。\n\n双击打开\
    \ `test/qunitTest.js` 文件，查看 `QUnit` 框架的结构。在图 4-2 中，你可以看到以下内容：\n\n![../images/502765_1_En_4_Chapter/502765_1_En_4_Fig2_HTML.jpg](img/502765_1_En_4_Fig2_HTML.jpg)\n\
    \n**图 4-2** QUnit 输出示例\n\n1.  单元测试套件的标题，来自 `qunitTest.html` 文件。\n2.  复选框，用于在开发者只想显示错误的测试时隐藏通过的测试。另一个复选框用于检查全局设置。最后还有一个复选框，用于禁用代码中的\
    \ `try-catch` 代码块。\n3.  框架本身显示完成的测试数量、完成所花费的时间、失败、通过和跳过的测试的详细情况，以及断言的总数。\n4. \
    \ 深入观察输出结果，读者还可以看到框架的层级输出，例如：\n    1.  `QUnit.module` – 允许开发者对一个或多个测试用例进行分组。`QUnit.module`\
    \ 接受两个参数，第一个是模块的名称，第二个是执行其测试的回调函数。一个应用程序中可以有一个或多个模块来分离单元测试。在图 4-2 中，读者可以看到高亮显示的模块名称（`unitTestSample`）。\n\
    \    2.  `QUnit.test` – 属于模块的一部分，可以包含一个或多个断言。`test` 部分接受两个参数：测试的名称以及将在其中执行断言的函数。在图\
    \ 4-2 中，读者可以看到同一个模块（`unitTestSample`）中的两个测试场景。\n\n在每个测试的正下方，读者还可以看到每个测试所在的源代码和行号。\n\
    \n输出屏幕是根据图 4-3 中所示的测试用例生成的。\n\n![../images/502765_1_En_4_Chapter/502765_1_En_4_Fig3_HTML.jpg](img/502765_1_En_4_Fig3_HTML.jpg)\n\
    \n**图 4-3** QUnit 测试用例\n\n断言是代码中的语句，用于确保所测试内容的有效性。前面高亮显示的两个测试展示了第 5-7 行以及第 10-12\
    \ 行的非常简单的测试。请注意，在第 11 行，该示例使用了一个函数，该函数进一步使用了一个名为 `moment` 的外部库。这个库帮助开发者处理 JavaScript\
    \ 中的日期和时间对象。`moment.js` 库与 `JQuery` 库一起被加载到 `qunitTest.html` 文件的 `head` 元素 XML\
    \ 标签中。\n\n第 14-29 行由于测试场景设置不正确而被注释掉了。这部分代码保留了下来，以展示开发者在设置测试用例时可能犯的一个典型错误。这段代码失败的原因是\
    \ `QUnit` 测试用例与 `JQuery` 的 `getJSON` 函数一同执行，而 `getJSON` 是异步执行的，导致 `QUnit` 测试部分在到达成功回调之前就结束了，从而产生了错误的测试用例。\n\
    \n更深入地看一下图 4-4 中的函数，它展示了测试异步 JavaScript（`AJAX`）调用时的正确方法。这个 `QUnit` 测试嵌套在 `JQuery`\
    \ 的 `getJSON` 函数调用中。\n\n展示这个测试的目的是为了演示在 `QUnit` 框架上下文中调用异步 Web 服务的用法，以验证以下需求：\n\
    \n1.  执行 `OData` 调用（或 `REST API`）所需的时间\n2.  Web 开发的异步特性与单元测试协同工作\n3.  在一个测试中验证多个断言：\n\
    \    1.  通常，软件必须符合在软件产品创建之前建立的服务水平协议（`SLA`）。在我们的场景中，我们测试以确保 `OData` 服务的消耗时间少于约定的某个执行时间。\n\
    \    2.  本书在此场景中提出的第二个断言是 `OData` 调用包含至少一条记录（不应返回空数组）。\n    3.  第三个也是最后一个（但并非最不重要的）测试场景是用预期的对象结构来验证其中一个响应对象。\n\
    \n![../images/502765_1_En_4_Chapter/502765_1_En_4_Fig4_HTML.jpg](img/502765_1_En_4_Fig4_HTML.jpg)\n\
    \n**图 4-4** 使用 AJAX 调用的 QUnit 测试\n\n在第三个测试用例中，还有其他需要注意的地方：练习在 `getJSON` 函数之前（第\
    \ 31 行）开始记录 `startTime`，然后在成功回调内部（第 37 行）记录 `endTime`，以便能够计算时间差（第 38 行）。\n\n图\
    \ 4-5 显示了当预期的对象结构与 `OData` 服务的响应不匹配时发生的失败，这对应了测试用例中的第三个断言。`OData` 服务响应的预期结果与图\
    \ 4-5 中显示的内容之间的差异，正是开发者应该理解并解决的失败。\n\n![../images/502765_1_En_4_Chapter/502765_1_En_4_Figa_HTML.jpg](img/502765_1_En_4_Figa_HTML.jpg)\n\
    \n**图 4-5** 预期对象结构与 OData 服务的响应结构不匹配时显示的失败信息\n"
- fmt: '# Unit Test Debugging


    When writing these unit test cases, developers may also need to perform debugging
    of their own code.


    To debug unit test cases, developers need to also look at the browser developer
    tools as if they were also developing a solution. To launch the developer tools,
    open the browser window to where the unit test HTML page is located, press `F12`
    to launch the developer tools, and then navigate to the `Sources` tab where the
    source code is located. From the `Sources` tab, open your JavaScript file and
    set breakpoints to navigate through your development. Like navigating and moving
    around the JavaScript code, which is normally done from the controller JS file,
    developers can use this browser tool in the same way to help themselves navigate
    and debug their unit test scripts (using keyboard `F10`, `F11`, `F8`) or the browser
    navigation icons on the bottom right-hand side section.


    Later in the chapter, the book will dive deeper into the Chrome developer tools,
    so make sure you have a good understanding of this section within the developer
    tools so that they will be of good use later as well.


    ![../images/502765_1_En_4_Chapter/502765_1_En_4_Fig5_HTML.jpg](images/502765_1_En_4_Chapter/502765_1_En_4_Fig5_HTML.jpg)


    **Figure 4-6** – Debugging a QUnit test case


    ## Learnings from this Unit Test Framework


    1.  It is very easy to set up and get started: [https://qunitjs.com/intro/](https://qunitjs.com/intro/)

    2.  Documentation is easy to follow: [https://api.qunitjs.com/QUnit/](https://api.qunitjs.com/QUnit/)

    3.  It is used in most Fiori application templates: [https://sapui5.hana.ondemand.com/1.36.6/docs/guide/e1ce1de315994a02bf162f4b3b5a9f09.html](https://sapui5.hana.ondemand.com/1.36.6/docs/guide/e1ce1de315994a02bf162f4b3b5a9f09.html)

    4.  Developers are familiar with most of the concepts used in the framework, including
    debugging


    Spend additional time in the QUnit documentation to familiarize yourself with
    other types of tests, other assertions, and other operations or features offered
    by the QUnit framework. I wish you good luck if you decide to implement this framework!


    ## Nightmare JS


    The next unit test framework the book would like to highlight here is Nightmare
    JS. The reason to choose this unit testing framework is because it is a popular
    JavaScript framework and it is not part of the normal Fiori development. Often,
    I like to sample what is being offered by SAP technologies and its products, but
    it is also a good habit to investigate by yourself the other options available
    out there on the net. After all, the book is another source of information that
    provides different viewpoints, sharing information with the reader that may otherwise
    have not been explored. The result of this unit test framework is unfortunately
    not a good approach; however, I decided to keep it in the text to see comparisons
    with other frameworks. There are certain commands and features similar to the
    last unit framework that is documented in this chapter, and that is one of the
    main reasons to keep this one here, even though it yields an incomplete unit test
    scenario. There are some informative pieces that are relevant from the framework.


    Nightmare JS is an open source high-level unit test browser automation framework.
    Behind the scenes, Nightmare JS uses the Electron JS framework. Electron JS (found
    at [https://www.electronjs.org/](https://www.electronjs.org/)) is a framework
    that allows developers to create cross-platform desktop apps with JavaScript,
    HTML, and CSS. Let me repeat that statement: cross-platform desktop apps with
    JS, HTML, and CSS. If you understand web development, you know that JavaScript,
    HTML, and CSS are languages which run on the browser and therefore are not the
    same as desktop applications. Electron JS is also a popular framework since web
    developers can now create desktop applications with familiar technologies. Having
    this thought in mind, let us proceed to define, explain, and showcase the Nightmare
    JS framework for our Fiori application unit testing as our second option.


    Nightmare JS uses functions that mimic user interaction with software such as
    `type`, `click`, and `goto` with an API that feels synchronously, rather than
    having nested callbacks as done in other frameworks. Take a look at their GitHub
    Read Me page to learn more about this framework: [https://github.com/segmentio/nightmare/blob/master/Readme.md](https://github.com/segmentio/nightmare/blob/master/Readme.md)


    Nightmare JS can be added as a project using Node JS or it can be developed as
    a stand-alone unit test (Node JS) application. Following the steps from the Nightmare
    JS framework, install the framework from npm package using the following as the
    command line:


    ```

    npm install nightmare

    ```


    After running the installation command, make sure to install any dependencies
    using the following command line:


    ```

    npm install

    ```


    Before continuing with your unit test development, keep in mind that this framework
    has features that can mimic the user actions against the site; therefore, start
    thinking about the possible user automation of your software. There may be other
    frameworks that accomplish the same steps; however, I am including this one as
    a comparison to see how it works and what possible issues a user can face when
    interacting with various unit testing frameworks and also when using open source
    software.


    The book will try to showcase the following:


    1.  Opening the custom application and entering credentials to authenticate

    2.  Verifying that the data has loaded into the master list of the application

    3.  Clicking an item from the list to see its details


    **Figure [4-7](#502765_1_En_4_Chapter.xhtml#Fig6)** shows the initial Nightmare
    JS script that demonstrates the first test scenario. Let us take a closer look
    at what is happening in this script.


    ![../images/502765_1_En_4_Chapter/502765_1_En_4_Fig6_HTML.jpg](images/502765_1_En_4_Chapter/502765_1_En_4_Fig6_HTML.jpg)


    **Figure 4-7** – Nightmare JS unit testing framework


    1.  Line 1 loads the `nightmare` JS library'
