    ## Nightmare JS


    接下来本书要重点介绍的另一个单元测试框架是 Nightmare JS。选择这个单元测试框架的原因在于它是一个流行的 JavaScript 框架，并且不属于常规的
    Fiori 开发范畴。我通常喜欢体验 SAP 技术及其产品所提供的功能，但自己主动研究网络上可用的其他选项也是一个好习惯。毕竟，本书提供的是另一种信息来源，它呈现不同视角，与读者分享那些或许尚未被探索过的信息。可惜的是，这个单元测试框架的最终效果并不理想；不过，我决定将其保留在文中，以便与其他框架进行对比。该框架的某些命令和特性与本章记录的最后一个单元框架相似，这也是将其保留于此的主要原因，即使它只能呈现一个不完整的单元测试场景。这个框架中仍有一些有价值的信息值得了解。


    Nightmare JS 是一个开源的高级单元测试浏览器自动化框架。在底层，Nightmare JS 使用了 Electron JS 框架。Electron
    JS（访问 [`www.electronjs.org/`](https://www.electronjs.org/)）是一个允许开发者使用 JavaScript、HTML
    和 CSS 创建跨平台桌面应用的框架。请允许我再重复一遍：使用 JS、HTML 和 CSS 创建跨平台桌面应用。如果你了解 Web 开发，就会知道 JavaScript、HTML
    和 CSS 是运行在浏览器上的语言，因此与桌面应用程序不同。Electron JS 也是一个流行的框架，因为 Web 开发者现在可以用他们熟悉的技术来创建桌面应用了。带着这个想法，接下来让我们定义、解释并展示
    Nightmare JS 框架如何作为我们 Fiori 应用单元测试的第二个选项。


    Nightmare JS 使用模拟用户与软件交互的函数，例如 `type`、`click` 和 `goto`，并提供一个看似同步的 API，而不是像其他框架那样使用嵌套回调。请查看他们的
    GitHub Read Me 页面以了解关于该框架的更多信息：[`github.com/segmentio/nightmare/blob/master/Readme.md`](https://github.com/segmentio/nightmare/blob/master/Readme.md)


    Nightmare JS 可以作为使用 Node JS 的项目添加，也可以作为独立的单元测试（Node JS）应用程序进行开发。按照 Nightmare JS
    框架的步骤，使用以下命令行从 npm 包安装该框架：


    ```

    npm install nightmare

    ```


    运行安装命令后，请确保使用以下命令行安装所有依赖项：


    ```

    npm install

    ```


    在继续单元测试开发之前，请记住该框架具有模拟用户对网站操作的功能；因此，开始思考你的软件可能实现的用户自动化操作。可能还有其他框架能实现相同的步骤；不过，我将其包含在内是为了对比，看看它如何工作，以及用户在与不同单元测试框架交互以及使用开源软件时可能遇到哪些问题。


