    确认卡片属性，以便分别为设备设置*平均温度*，如图 2-39 和 2-40 所示。


    ![../images/502765_1_En_2_Chapter/502765_1_En_2_Fig40_HTML.jpg](img/502765_1_En_2_Fig40_HTML.jpg)


    **图 2-40** 卡片配置（续）


    ![../images/502765_1_En_2_Chapter/502765_1_En_2_Fig39_HTML.jpg](img/502765_1_En_2_Fig39_HTML.jpg)


    **图 2-39** 卡片模板配置


    在我看来，卡片设置中最重要的部分与下一个截图有关，我们在其中配置了列表项信息以及显示和排序配置。


    相同的配置存储在 `manifest.json` 文件中，如图 2-41 所示。


    ![../images/502765_1_En_2_Chapter/502765_1_En_2_Fig41_HTML.jpg](img/502765_1_En_2_Fig41_HTML.jpg)


    **图 2-41** 显示卡片配置的 Manifest 文件


    由于在初始项目设置时未添加注释，现在是时候添加了。选择项目，右键点击并选择添加注释选项。图 2-42 展示的是注释配置向导。如果您之前没有注释文件，通常需要执行此步骤。


    ![../images/502765_1_En_2_Chapter/502765_1_En_2_Fig42_HTML.jpg](img/502765_1_En_2_Fig42_HTML.jpg)


    **图 2-42** 注释文件配置


    选择如图 2-43 所示的注释类型。


    ![../images/502765_1_En_2_Chapter/502765_1_En_2_Fig43_HTML.jpg](img/502765_1_En_2_Fig43_HTML.jpg)


    **图 2-43** 注释类型


    然后确认注释完成。


    打开注释 XML 文件，注意 XML 文件中的 **Selection fields** 和 **LineItem** 占位符。`UI.SelectionField`
    表示用于数据过滤的字段，而 `UI.LineItem` 注释则表示将被过滤的对象集合。您需要添加以下部分，以便能够在概览页面的卡片控件中搜索和显示数据，如图
    2-44 所示。


    ![../images/502765_1_En_2_Chapter/502765_1_En_2_Fig44_HTML.jpg](img/502765_1_En_2_Fig44_HTML.jpg)


    **图 2-44** 注释 XML 文件


    添加完这些属性后，选择项目，并以概览测试页面的方式运行，查看其在 Fiori Launchpad 中的显示效果，这与我们当前练习的设置一致。目前的数据没有实际意义，因为它是由
    Web IDE 生成的 JSON 文件；但是，您可以在 JSON 文件中添加相关文本，或者当直接连接到后端服务时，只要数据能够显示相关信息即可（图 2-45）。


    ![../images/502765_1_En_2_Chapter/502765_1_En_2_Fig45_HTML.jpg](img/502765_1_En_2_Fig45_HTML.jpg)


    **图 2-45** 概览页面中显示的卡片


    ## 结论


    在本书本章结尾处，我想强调在应用程序中使用数据的重要性，以及使用数据的不同方式，例如 OData 服务和 REST API。当没有数据时，开发人员仍然可以生成本地
    JSON 模型或使用元数据文件从 SAP Web IDE 模拟一些数据。本地模拟数据功能益处巨大，并且在实际数据不可用时，应用开发人员开始开发活动的情况也时常发生。此外，本章中另一个极其重要的内容是实现与
    SAP Fiori 应用程序数据集成的各个部分。理解不同类型的应用程序模板、Fiori 元素和布局，将有助于我们在下一章深入探讨更多自定义 Fiori 开发时获得启发。同时请牢记数据是如何作为数据模型呈现的，以及这些数据模型是如何绑定到应用程序的。


    # 3. 构建 Fiori 应用程序


    欢迎来到第 3 章，这是关于开发者的章节。感谢您跟随前两章的阅读，书中解释了从头开始创建自定义 SAP Fiori 应用程序所需的步骤，从设计阶段开始，然后分析和处理数据，甚至在数据不可用时模拟数据。本章侧重于
    SAP Fiori 应用程序的实际实现，并主要针对开发人员。在本章中，本书将深入探讨构成 Fiori 应用程序的不同领域；解释被称为 MVC（模型-视图-控制器）的软件设计模式，以及用于开发和调试的不同工具，例如
    SAP Web IDE。此外，还讨论了如何将第三方 JavaScript 库集成到我们的 SAP Fiori Web 应用程序中，然后展示了 Fiori 应用程序在桌面、平板电脑和手机等不同设备上呈现的各种场景。

