    ![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig22_HTML.jpg](img/502765_1_En_1_Fig22_HTML.jpg)


    图 1-22


    UI5 工具 CLI


    1.  **UI5 工具**


    这是一个命令行界面(CLI)工具，如图 1-22 所示，该工具利用`Node J`S 和`NPM`（Node 包管理器）加速应用程序的开发。CLI 工具在
    Web 开发中非常流行，因此`SAPUI5`也提供了该工具也就不足为奇了。


    ![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig23_HTML.jpg](img/502765_1_En_1_Fig23_HTML.jpg)


    图 1-23


    SAPUI5 检查器


    1.  **UI5 检查器**


    该工具是一个 Chrome 浏览器附加组件，允许开发者在应用程序于浏览器中运行时，对其中的`SAPUI5`控件进行调试和分析。该工具如图 1-23 所示。此工具可显示应用程序内控件的层级结构，以及分配给它的所有`css`类和任何其他属性/特性。在尝试调试特定控件的行为或在应用程序中查找内容时，此工具非常有用。由于不同浏览器的行为和显示方式不同，在比较某些控件的渲染效果以及它们在不同浏览器上的表现时，可以使用此工具。


    ![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig24_HTML.jpg](img/502765_1_En_1_Fig24_HTML.jpg)


    图 1-24


    SAPUI5 图标浏览器


    1.  **图标浏览器**


    到目前为止，这是我最喜欢的工具，因为它能让我在同一框架内找到可用的图标。有时，在其他技术框架中，开发者需要集成额外的`js`库来获取图标，而在`SAPUI5`中，图标库已经包含在内。该工具允许开发者搜索图标，并且图标可以以多种形式呈现，例如不同的大小。此外，图标还带有一些关键词标记，如图
    1-24 所示，在此工具中搜索时可以轻松找到它们。


    ## 理解元素、布局和页面模板


    随着我们对 Fiori 的深入了解，理解 Fiori 应用程序是如何设计和开发的变得至关重要。如果你以前从未开发过 Fiori 应用程序，你很可能会先看一些示例，然后尝试模仿它们。这是学习新技能或技术，或者第一次尝试新事物时的正常过程。经验丰富的开发者也会寻找构成某种应用程序的模式和组件。我们试图理解页面由哪些元素组成，使用了哪些控件，并通过某些
    API 或文档熟悉它们。开发 Fiori 应用程序时也是如此。


    **SAPUI5 控件** 包含了 Web 应用程序中最常见的控件，例如输入字段、标签、组合框、表格和复选框等等。请访问`SAPUI5 SDK`页面，以了解更多关于不同类型控件的信息、它们的文档及其代码示例。


    SAP Fiori **元素**，以前称为智能模板，为您提供了 Fiori 应用程序中最常用的一套模板。其中一些模板包括概览页面、列表报表、工作清单和对象页面。此外，其中一些
    Fiori 元素几乎不需要或完全不需要开发，它们是元数据驱动的应用程序。本书将展示如何使用`MVC`框架、`XML`视图和控制器中的 JavaScript
    编程语言来创建这些应用程序。


    ![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig25_HTML.jpg](img/502765_1_En_1_Fig25_HTML.jpg)


    图 1-25


    概览模板


    1.  **概览页面：** 此模板包含可能带有一些重要指标（如分析型卡片）的智能磁贴，允许用户快速查看并导航以查看更多详细信息。顾名思义，概览页面的目的是无需深入到应用程序的每个区域/页面来查找系统问题，就能快速提供重要信息的概览。这种类型的页面/模板用作应用程序的入口点，如图
    1-25 所示。该模板展示了卡片、磁贴、列表和一些图表，以便快速可视化。一张图胜过千言万语，这种类型的模板正是做到了这一点。它不会让用户感到不知所措，并且清晰地指明了要寻找的目标。


    ![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig26_HTML.jpg](img/502765_1_En_1_Fig26_HTML.jpg)


    图 1-26


    工作清单模板


    1.  **工作清单：** 这种类型的页面/模板用于向用户分配工作，并且通常允许用户深入查看详细信息以执行某些操作。它是一个从简单列表到详情页的页面。该模板展示了一个列表、一个导航以及一个可以查看项目详情并对其采取操作的详情页面。图
    1-26 展示了这样一个模板。


    ![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig27_HTML.jpg](img/502765_1_En_1_Fig27_HTML.jpg)


    图 1-27


    列表报表模板


    1.  **列表报表：** 这种类型的模板与工作清单模板非常相似；然而，此模板通常用于包含更多项目的数据集，用户可以通过包含筛选条件来最小化显示的记录数量。该模板还允许进行多选，以便对特定记录执行一组操作。与工作清单相比，它通常用于向用户提供数据集更高层级的可见性，而工作清单通常用于专属于特定用户的较小数据集。该模板如图
    1-27 所示。


    ![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig28_HTML.jpg](img/502765_1_En_1_Fig28_HTML.jpg)


    图 1-28


    对象视图模板

