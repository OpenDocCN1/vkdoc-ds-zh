    ## Conclusion


    As the book concludes this chapter, I would like to highlight the importance of
    using data in an application and the various ways to consume data, such as OData
    services and REST APIs. When there is no data present, developers can still generate
    local JSON models or use the metadata file to mock some data from the SAP Web
    IDE. The local mock data feature has huge benefits and it is sometimes common
    to start development activities when actual data is not present for the application
    developer. Moreover, additional points within the chapter that are of huge importance
    are the different pieces of making data integration to an SAP Fiori application.
    Understanding the different types of application templates, Fiori elements, and
    layouts will be helpful in the next chapter, when we dive deeper into more custom
    Fiori development. Keep also in mind how data is represented as data models and
    how those data models are bound to applications.


    # 3. Building the Fiori Application


    Welcome to Chapter [3](#502765_1_En_3_Chapter.xhtml), the developer chapter. Thank
    you for following along the first two chapters, where the book explained the required
    steps to start a custom SAP Fiori application starting from the design phase and
    then analyzing and playing with data or even simulating it when data is not available.
    This chapter focuses on the actual implementation of an SAP Fiori application
    and primarily focuses on the developer. In this chapter, the book dives deeper
    into the different areas that make up a Fiori application; it explains the software
    design pattern known as MVC (Model View Controller) and the different tools for
    developing and debugging such as the SAP Web IDE. It also talks about integrating
    third-party JavaScript libraries into our SAP Fiori web application, and then
    it shows various scenarios as to how the Fiori application is seen from different
    devices such as desktops, tablets, and phone devices.'
