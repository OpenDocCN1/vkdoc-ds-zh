    现在，`MasterList` 视图定义位于 `View` 文件夹中，如图 3-7 所示。要生成新视图，请右键单击 `View` 文件夹，选择 `New`，`File`，并提供文件名以及文件内容（您需要将
    `Home` 视图中的视图声明复制到新创建的视图中）。另一种方法是使用 SAP Web IDE 提供的“New SAPUI5 view”选项，在各自的文件夹中创建视图和控制器文件。


    ![../images/502765_1_En_3_Chapter/502765_1_En_3_Fig7_HTML.jpg](img/502765_1_En_3_Fig7_HTML.jpg)


    **图 3-7** 显示 `View` 文件夹的项目


    `MasterList` 视图定义看起来与之前在 `Home` 视图中的完全相同。对 Home 控制器的引用保持不变，因为这是一个相当小的示例，如有需要，开发者可以在
    `Controller` 文件夹中添加一个新的控制器文件，并进一步将视图引用更新到所需的控制器文件位置。此功能（新视图和新控制器）将在后面的 `Detail`
    视图示例中展示。


    `Detail` 视图可以包含任何控件、表单、选项卡栏或图表，以显示所选项目的详细数据。在此视图中，开发者可以观察到选项卡（选项卡栏控件）使用 `items`
    聚合，并且可以触发诸如选择项目之类的事件。当使用这些控件时，诸如包含过滤器之类的情况会很有帮助。`Detail` 视图（重构后）如图 3-8 所示。


    ![../images/502765_1_En_3_Chapter/502765_1_En_3_Fig8_HTML.jpg](img/502765_1_En_3_Fig8_HTML.jpg)


    **图 3-8** `Detail` 视图


    并且这个（嵌套的）`Detail` 视图也在 `Home` 视图中被引用，如图 3-9 所示。


    ![../images/502765_1_En_3_Chapter/502765_1_En_3_Fig9_HTML.jpg](img/502765_1_En_3_Fig9_HTML.jpg)


    **图 3-9** 重构后的 `Detail` 视图引用


    这是一个很好的练习，既展示了重构，也向开发者表明，在开发周期中，可以继续向 Fiori 应用添加内容的同时进行重构。您可能已经注意到，`Detail` 视图引用的是
    Detail 控制器而不是 Home 控制器，如图 3-8 的第 2 行所示。此外，Detail 控制器位于 `Controller` 文件夹中，如图 3-10
    所示。


    ![../images/502765_1_En_3_Chapter/502765_1_En_3_Fig10_HTML.jpg](img/502765_1_En_3_Fig10_HTML.jpg)


    **图 3-10** Detail 控制器


    此外，MVC 的另一个好处是它的组件是松散耦合的，可以在应用的多个部分中重用。假设我们有额外的选项卡，并且在这些选项卡中，应用需要在多个选项卡之间显示相同的控件。您可能会想，应用能否将（UI5）控件从
    `Detail` 视图解耦到一个单独的视图中，然后将包含该控件的视图嵌入到 `Detail` 视图中。是的，可以。


    在重构我们想要拆分为其自己视图的控件之前，本书将描述 SAPUI5 库的一个特性，称为 `Fragment`。正如您在之前的段落中看到的，本书展示了各个视图，并且每个视图可能包含一个同名的控制器。请参阅图
    3-10 以查看相应文件夹中的视图/控制器。在开发这些应用时，开发者应该知道，大多数情况下，每个视图文件都包含一个对应的控制器文件。Fragments 的行为类似于视图；但是，它们不包含控制器文件。相反，它们被嵌入到视图中，并且在这些
    fragments 中引用的任何事件都可以从视图的控制器中执行。


    在图 3-11 中，您可以看到我们有一个响应式表格控件。该表格控件将在从主列表中选择一个设备后，在 Activity 选项卡下显示该设备的活动。此外，此表格还将在下一个选项卡中用于显示设备的不活动状态。为了避免引入重复的代码，本练习将重构这段包含响应式表格的
    XML 代码片段，并将其重构为一个 XML fragment。


    ![../images/502765_1_En_3_Chapter/502765_1_En_3_Fig11_HTML.jpg](img/502765_1_En_3_Fig11_HTML.jpg)


    **图 3-11** 使用 fragment 之前的 `Detail` 视图代码


    在图 3-12 中，您可以再次看到 `Detail` 视图中重构后、干净的代码片段。使用 fragment 时，开发者必须确保 fragment 包含独特的概念，并且应为
    fragment 提供一个名称，以便稍后从 JavaScript 控制器中轻松访问。


    ![../images/502765_1_En_3_Chapter/502765_1_En_3_Fig12_HTML.jpg](img/502765_1_En_3_Fig12_HTML.jpg)


    **图 3-12** 创建 fragment 后的 `Detail` 视图代码


    如果您好奇 fragment 代码的定义，可以查看图 3-13，以了解将代码从视图中剪切并移动到 fragment 中以实现重用是多么容易。


    ![../images/502765_1_En_3_Chapter/502765_1_En_3_Fig13_HTML.jpg](img/502765_1_En_3_Fig13_HTML.jpg)


    **图 3-13** Fragment 定义

