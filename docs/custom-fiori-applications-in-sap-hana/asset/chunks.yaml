- fmt: "# Puppeteer 练习总结\n\n因此，Puppeteer 的练习到此结束；我真心相信这个框架为我们的单元测试章节增添了巨大的优势和好处。从`QUnit`框架开始，它与我们的应用程序非常接近，并很好地集成了`SAPUI5`框架，大多数开发者可能会感到舒适，无需进行任何额外设置或配置——这些有时可能过于繁琐或耗时，就像我遇到的`Nightmare\
    \ JS`框架那样。接着谈到`Puppeteer`框架，我发现这个框架拥有一些高级功能，同时在大多数我研究或偶然发现的在线资源中都有非常完善的文档记录。我由衷地并强烈推荐`Puppeteer`给任何从事\
    \ Web 开发的人，因为它是一个如此干净且易于使用的框架，几乎涵盖了开发者在软件开发过程中需要测试的所有可能测试用例：从通过输入用户名和密码来验证用户，到触发按钮或链接的点击事件，再到拦截加载或发布数据时的`http(s)`请求。这个框架确实赢得了我心中最佳单元测试框架的选票，我很高兴能在构建和验证自定义\
    \ Fiori 应用程序时将其作为一个外部选项来使用。如果用户需要查看测试过程中发生的情况，使用有头和无头功能的选项极其重要。一旦他们对开发感到满意，他们可以选择在单元测试脚本中使用无头模式来最小化处理过程。向`Puppeteer`团队致敬，打造出如此出色的产品。\n\
    \n## 单元测试带来的改进\n\n单元测试在开发软件应用程序时是有益的；然而，对于开发者来说，这不仅仅是证明他们的工作正确无误。开发者有时会觉得这类任务很繁琐，而客户有时则认为这是一项不必要的开支。在本节中，本书将展示几个场景，证明之前的这些假设是错误的。\n\
    \n1.  **单元测试如何让我的代码变得更好？**\n\n理解任务并能够测试它，让开发者能够根据需求展示其工作。编写单元测试允许开发者以编程方式双倍检查自己的工作，以防由于需求变更或软件产品增强而需要多次更新。如果开发者不仅开发需求，而且理解其软件必须接受的测试场景，他们会在自己的技艺上变得越来越好。此外，自动化工作对于注入不同的测试值至关重要，例如在`Puppeteer`示例中展示的那样，其中利用生成随机数来触发读取\
    \ API 操作，以检索链接到列表项的详细信息。\n\n2.  **单元测试如何节省我的项目时间？**\n\n有些情况下，软件产品需要以增量阶段构建。如今，大多数公司遵循敏捷方法论，软件产品经过多次迭代和业务用户的反馈而发展。手头有一个脚本化的单元测试框架将减少交付这些增强功能所需的时间，以及验证新软件添加或更改所需的时间。消除人工运行这些单元测试的因素是节省总体时间的一种方式，并使项目在引入这些更改/集成时更加稳健。此外，如果我们软件的多个部分都遵循这些单元测试框架，那么我们还可以自动化测试，以最小化开发后和部署后的时间，就像大多数公司在集成和回归测试期间所做的那样。\n\
    \n3.  **我的单元测试如何为我的软件带来改进？**\n\n性能改进可以通过不同的方式展示：\n    -   应用程序启动时的性能\n    -  \
    \ 加载 (MVC) 视图时的性能\n    -   访问外部资源（如图像或其他脚本）时的性能\n    -   从 Web 服务加载数据时的性能\n\n\
    请记住，在软件项目初期创建单元测试脚本会需要一些额外的时间，而同一软件产品的后续增强可以利用这些测试用例场景，从长远来看使开发及其与其他系统的集成更加稳健。\n\
    \n根据其他自定义 Fiori 应用程序的经验，其他改进包括但不限于以下内容：\n\n![../images/502765_1_En_4_Chapter/502765_1_En_4_Fig26_HTML.jpg](images/502765_1_En_4_Chapter/502765_1_En_4_Fig26_HTML.jpg)\n\
    \n图 4-27\n精简的外部库\n\n1.  将`SAPUI5`应用程序设置为异步加载，如图 [4-25] 所示。\n\n![../images/502765_1_En_4_Chapter/502765_1_En_4_Fig24_HTML.jpg](images/502765_1_En_4_Chapter/502765_1_En_4_Fig24_HTML.jpg)\n\
    \n图 4-25\n异步引导`SAPUI5`\n\n您也可以在“网络”选项卡中观察正在加载的资源，如图 [4-26] 所示。\n\n![../images/502765_1_En_4_Chapter/502765_1_En_4_Fig25_HTML.jpg](images/502765_1_En_4_Chapter/502765_1_En_4_Fig25_HTML.jpg)\n\
    \n图 4-26\n显示预加载资源的“网络”选项卡\n\n2.  精简 JavaScript 文件以改善应用程序加载性能（确保您的文件经过精简过程；它们的扩展名可能是`*.min.js`）。精简过程也可以应用于样式表文件。在本书的练习中，使用了两个`js`库：`jQuery`库和`moment.js`库。两者都已精简，如图\
    \ [4-27] 所示。\n\n![../images/502765_1_En_4_Chapter/502765_1_En_4_Fig28_HTML.jpg](images/502765_1_En_4_Chapter/502765_1_En_4_Fig28_HTML.jpg)\n\
    \n图 4-29\n异步资源加载\n\n![../images/502765_1_En_4_Chapter/502765_1_En_4_Fig27_HTML.jpg](images/502765_1_En_4_Chapter/502765_1_En_4_Fig27_HTML.jpg)\n\
    \n图 4-28\nOData 服务发起批处理请求\n\n3.  如果您的自定义应用程序使用图像文件，请确保图像质量良好且其大小能够快速读取并加载到应用程序中。运行浏览器开发者工具查看加载这些图像的时间，可以改善您的加载时间。\n\
    \n4.  利用 SAP 图标执行应用程序中所需的某些操作。由于`SAPUI5`框架提供的图标已经是同一库的一部分，您可以利用这些图标。此外，使用这些图标（如练习中图标标签栏中包含的图标）也有利于您的\
    \ Fiori 开发，因为您所包含的资源符合框架的规则和指南。\n\n5.  从 OData 服务加载数据的改进包括：能够设置`SAPUI5`控件聚合器以按需加载此类数据，并设置一个可见元素数量作为阈值，从而使控件仅加载最终用户所需或可见的内容。遵循这条建议，确实使我们的自定义\
    \ Fiori 应用程序具有现代快速 Web 应用程序的外观和感觉，如图 [4-28] 和 [4-29] 所示。"
  raw: "Thus, the Puppeteer exercise concludes; I truly believe this framework has\
    \ added great advantages and benefits to our unit testing chapter. Starting from\
    \ the QUnit framework, which is very close to our application and nicely integrates\
    \ with the SAPUI5 framework, most developers will probably feel comfortable without\
    \ needing to do any additional setup or configuration, which sometimes can be\
    \ overwhelming or too time consuming, such as what occurred with the Nightmare\
    \ JS framework in my instance. Moving on to the Puppeteer framework, I found this\
    \ framework to have some advanced features while being extremely well documented\
    \ in most of the online resources that I have researched or stumbled upon when\
    \ building various test cases. I would gladly and highly recommend Puppeteer to\
    \ anyone doing web development, because it is such a clean and easy-to-use framework\
    \ that covers most if not all of the possible test cases that developers need\
    \ to test doing their software development; anything from being able to authenticate\
    \ users by typing usernames and passwords, to being able to trigger click events\
    \ into buttons or links, to intercepting the http(s) requests when loading or\
    \ posting data. This framework has truly gained my vote as the best unit testing\
    \ framework, and I am glad that I can use it as an external option while building\
    \ and validating custom Fiori applications. The options to use headful and headless\
    \ features are extremely important if the users require seeing what is happening\
    \ during their test. Once they feel comfortable with their development, they can\
    \ choose to minimize processing by going headless in their unit testing scripts.\
    \ Hats off to the Puppeteer team for such a slick product.\n\n## Improvements\
    \ Resulting from Unit Testing\n\nUnit testing is beneficial when developing software\
    \ applications; however, for developers there should be more than just being able\
    \ to prove their work is correct. Developers sometimes find this type of task\
    \ to be tedious and customers sometimes think this is an unnecessary expense.\
    \ In this section, the book will showcase a few scenarios that have proven the\
    \ previous assumptions to be wrong.\n\n1.  How does unit testing make my code\
    \ better?\n\nUnderstanding a task and being able to test it out allows the developer\
    \ to showcase his/her work as per the requirement. Writing unit tests allows developers\
    \ to double-check their own work programmatically in case it needs to be updated\
    \ several times due to a change in requirement or enhancement of the software\
    \ product. Developers get better and better at their craft if they not only develop\
    \ their requirements but understand the testing scenarios their software must\
    \ be submitted to. In addition, automation of one’s work is crucial to inject\
    \ different test values, such as the one presented in the Puppeteer example, where\
    \ generation of a random number was utilized to trigger a read of an API operation\
    \ to retrieve the details linked to a list item.\n\n2.  How does unit testing\
    \ save my project time?\n\nThere are situations where a software product needs\
    \ to be built in incremental phases. Nowadays, most companies are following an\
    \ Agile methodology, and software products evolve after many iterations and feedback\
    \ from their business users. Having a scripted unit test framework at hand will\
    \ reduce the time to deliver these enhancements and the necessary time to validate\
    \ new software additions or changes. Eliminating the human factor to run these\
    \ unit tests is one way to save overall time and make the project more robust\
    \ when these changes/integrations are introduced. Moreover, if we have several\
    \ pieces of our software following these unit test frameworks, then we can also\
    \ automate our testing to minimize time after development and after deployment,\
    \ as most companies do during integration and regression testing.\n\n3.  How does\
    \ my unit testing generate improvements to my software?\n\nImprovements in performance\
    \ can be demonstrated in different ways:\n    1.  Performance when starting an\
    \ application\n\n2.  Performance when loading (MVC) views\n\n3.  Performance when\
    \ accessing external resources such as images or other scripts\n\n4.  Performance\
    \ when loading data from a web service\n\nKeep in mind that the initial overhead\
    \ of creating unit testing scripts requires some extra time at the beginning of\
    \ a software project, while additional enhancements to the same software product\
    \ can leverage these test case scenarios, making development and its integration\
    \ with other systems more robust in the long run.\n\nAdditional improvements resulting\
    \ from experience in other custom Fiori applications include but are not limited\
    \ to the following:\n\n![../images/502765_1_En_4_Chapter/502765_1_En_4_Fig26_HTML.jpg](images/502765_1_En_4_Chapter/502765_1_En_4_Fig26_HTML.jpg)\n\
    \nFigure 4-27\n\nMinified external libraries\n\n1.  Setting the sapui5 application\
    \ to load asynchronously, as shown in Figure [4-25](#502765_1_En_4_Chapter.xhtml#Fig24).\n\
    \n![../images/502765_1_En_4_Chapter/502765_1_En_4_Fig24_HTML.jpg](images/502765_1_En_4_Chapter/502765_1_En_4_Fig24_HTML.jpg)\n\
    \nFigure 4-25\n\nAsynchronously bootstrapping sapui5\n\nYou can also observe this\
    \ in the Network tab to visualize the resources being loaded, as also shown in\
    \ Figure [4-26](#502765_1_En_4_Chapter.xhtml#Fig25).\n\n![../images/502765_1_En_4_Chapter/502765_1_En_4_Fig25_HTML.jpg](images/502765_1_En_4_Chapter/502765_1_En_4_Fig25_HTML.jpg)\n\
    \nFigure 4-26\n\nNetwork tab showing the preloaded resources\n\n2.  Minifying\
    \ JavaScript files to improve application load performance (make sure your files\
    \ run through a minification process; their extension names could be *.min.js).\
    \ The minification process can also be applied to style sheet files. In the exercise\
    \ presented in this book, there are two js libraries being used: the jquery library\
    \ and the moment.js library. Both are minified and shown in Figure [4-27](#502765_1_En_4_Chapter.xhtml#Fig26).\n\
    \n![../images/502765_1_En_4_Chapter/502765_1_En_4_Fig28_HTML.jpg](images/502765_1_En_4_Chapter/502765_1_En_4_Fig28_HTML.jpg)\n\
    \nFigure 4-29\n\nAsync resource loading\n\n![../images/502765_1_En_4_Chapter/502765_1_En_4_Fig27_HTML.jpg](images/502765_1_En_4_Chapter/502765_1_En_4_Fig27_HTML.jpg)\n\
    \nFigure 4-28\n\nOData service making batch requests\n\n1.  If your custom application\
    \ uses image files, make sure the images are of good quality and their size can\
    \ quickly be read and loaded into the application. Running your browser developer\
    \ tools to see the time to load these images can improve your loading time.\n\n\
    2.  Utilize sap icons for some of the actions that are required in your application.\
    \ Since the icons provided by the SAPUI5 framework are already part of the same\
    \ library, you can take advantage of using these icons. Moreover, using these\
    \ icons such as the ones included in the icon tab bar of the exercise also benefits\
    \ your Fiori development, since you are including resources that are within the\
    \ rules and guidelines of the framework.\n\n3.  Improvements while loading data\
    \ from OData services include being able to set up the SAPUI5 control aggregator\
    \ to load such data on demand and also to include a number of visible elements\
    \ as a threshold, resulting in the control only loading what is needed or what\
    \ is visible for the end user. Following this advice has truly made our custom\
    \ Fiori applications have the look and feel of modern and fast web applications,\
    \ as shown in Figures [4-28](#502765_1_En_4_Chapter.xhtml#Fig27) and [4-29](#502765_1_En_4_Chapter.xhtml#Fig28)."
