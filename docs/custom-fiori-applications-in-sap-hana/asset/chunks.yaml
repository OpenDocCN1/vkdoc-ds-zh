- fmt: 'After installing these plug-ins, developers can use Visual Studio Code to
    create their Fiori elements applications, as shown in Figure [3-20](#502765_1_En_3_Chapter.xhtml#Fig20).


    ![../images/502765_1_En_3_Chapter/502765_1_En_3_Fig20_HTML.jpg](images/502765_1_En_3_Chapter/502765_1_En_3_Fig20_HTML.jpg)


    **Figure 3-20** Visual Studio Code with Fiori tools installed


    Select the `SAP Fiori Tool Generator` from the command palette (`Ctrl + Shift
    + P`) to generate an SAP Fiori application, and then select the button **Next**
    from the bottom right-hand side of Visual Studio Code.


    Following the wizard, developers must select one of the available templates. In
    this case, the book will showcase the **Worklist** template from a Fiori application.
    Then select **Next**, as shown in Figure [3-21](#502765_1_En_3_Chapter.xhtml#Fig21).


    ![../images/502765_1_En_3_Chapter/502765_1_En_3_Fig21_HTML.jpg](images/502765_1_En_3_Chapter/502765_1_En_3_Fig21_HTML.jpg)


    **Figure 3-21** Selecting worklist app


    After selecting the template, the developer must select the OData service (or
    its metadata file) that will be used to bind into the application. Since the application
    is not directly connected to the back-end system, the book will showcase how to
    import an XML metadata file as an alternative solution. From the OData service
    definition, get the metadata content (append `/$metadata` to the URL where the
    service is hosted) and save it as a local file into your computer. Once you save
    this file as `metadata.xml`, then select it from the data source section in the
    wizard, as shown in Figure [3-22](#502765_1_En_3_Chapter.xhtml#Fig22). You must
    also select an endpoint within this OData metadata file.


    ![../images/502765_1_En_3_Chapter/502765_1_En_3_Fig22_HTML.jpg](images/502765_1_En_3_Chapter/502765_1_En_3_Fig22_HTML.jpg)


    **Figure 3-22** Data source configuration


    After configuring the data source, proceed to set the project configuration in
    the next step, as shown in Figure [3-23](#502765_1_En_3_Chapter.xhtml#Fig23).


    ![../images/502765_1_En_3_Chapter/502765_1_En_3_Fig23_HTML.jpg](images/502765_1_En_3_Chapter/502765_1_En_3_Fig23_HTML.jpg)


    **Figure 3-23** Project configuration


    After the wizard configures all the settings, it creates the application you instructed
    it to create. Visual Studio Code will prompt you to open the newly created application.
    Agree to the prompt and open any of the files within the new Fiori application.
    The following `package.json` file is opened to show the application configuration,
    along with any scripts that can be executed from the CLI, and to show the project
    structure, dependencies, or any other setup. Notice that the UI5 application in
    the *Workspace* (left-hand folder hierarchy and files) shows that the `metadata.xml`
    file was uploaded to the `localService` folder; there is a `Component.js` and
    a `manifest.json` (application configuration) file.


    These are very important files in all Fiori applications. Figure [3-24](#502765_1_En_3_Chapter.xhtml#Fig24)
    has many important configuration items to observe and understand. Spend some time
    here to see all additional settings.


    ![../images/502765_1_En_3_Chapter/502765_1_En_3_Fig24_HTML.jpg](images/502765_1_En_3_Chapter/502765_1_En_3_Fig24_HTML.jpg)


    **Figure 3-24** `package.json` file inside Visual Code


    Once the application is ready to be shown, open the terminal window within sapui5
    and first make sure all dependencies have been included. Developers may use the
    `npm install` command to run the npm command to install them. Wait until all the
    dependencies have been downloaded locally. Follow the `npm install` command with
    the `npm run start-mock` command, as shown in Figure [3-25](#502765_1_En_3_Chapter.xhtml#Fig25).
    This command runs the Fiori application using the mock data since we are not directly
    connected to the OData service. Moreover, you can observe that the application
    is running a local node server and the application is served from there.


    ![../images/502765_1_En_3_Chapter/502765_1_En_3_Fig25_HTML.jpg](images/502765_1_En_3_Chapter/502765_1_En_3_Fig25_HTML.jpg)


    **Figure 3-25** Running `npm run start-mock` command


    Figure [3-26](#502765_1_En_3_Chapter.xhtml#Fig26) shows the default Fiori application
    after the `start-mock` command is executed.


    Initially, this application shows no data (or columns) until the developer visits
    the **configuration gear icon** located on the right-hand side of the screen.
    Once the pop-up opens, select the columns you wish to display. Since we selected
    a **Worklist** template application, the **Worklist** template shows the grid
    that we bound to the OData service, and it uses **Smart controls** to display
    the columns based on the metadata definition of our service.


    ![../images/502765_1_En_3_Chapter/502765_1_En_3_Fig26_HTML.jpg](images/502765_1_En_3_Chapter/502765_1_En_3_Fig26_HTML.jpg)


    **Figure 3-26** Column configuration on **Worklist** template


    Row grouping is also another important feature that comes out of the box. This
    feature is represented by the highlighted icon in Figure [3-27](#502765_1_En_3_Chapter.xhtml#Fig27).
    When the user selects the icon, then they must select the column to group items
    by. This feature is typically used when there are some repeated data on one of
    the columns. The following is the reflected output from selecting one of the columns
    to be grouped by.


    ![../images/502765_1_En_3_Chapter/502765_1_En_3_Fig27_HTML.jpg](images/502765_1_En_3_Chapter/502765_1_En_3_Fig27_HTML.jpg)


    **Figure 3-27** Grouping


    Equally important, there are other features that come out of the box with this
    template, such as filtering. Select the **funnel icon** right next to the **gear
    icon** to see how filtering can be applied to the same Fiori application, as shown
    in Figure [3-28](#502765_1_En_3_Chapter.xhtml#Fig28), and to its output, as shown
    in Figure [3-29](#502765_1_En_3_Chapter.xhtml#Fig29). As mentioned before, all
    these features come out of the box and require not a single line of additional
    development efforts.


    ![../images/502765_1_En_3_Chapter/502765_1_En_3_Fig29_HTML.jpg](images/502765_1_En_3_Chapter/502765_1_En_3_Fig29_HTML.jpg)


    **Figure 3-29** Data output after applying filtering


    ![../images/502765_1_En_3_Chapter/502765_1_En_3_Fig28_HTML.jpg](images/502765_1_En_3_Chapter/502765_1_En_3_Fig28_HTML.jpg)


    **Figure 3-28** Smart template filtering


    The other features such as sorting, create, and delete are there for illustration
    purposes; I invite you to explore them and see others such as saving the variant
    (showing as standard drop-down on the top left-hand side of the prior image),
    or sharing the application with others as shown in the top right-hand side right
    below the avatar icon. There may also be smaller application configuration settings
    that could be requested, such as changing the type of table (`GridTable` instead
    of `Responsive`), hiding parts of the application such as not displaying the variants,
    or hiding some parts of the applications; all these configuration settings are
    possible but somewhat tedious as the developers will be required to modify the
    application settings in the `manifest` configuration file.


    By now you may be asking why in Chapter [2](#502765_1_En_2_Chapter.xhtml) we used
    one method of creating sapui5 applications with the SAP Web IDE, coding views,
    fragments, and controllers, but here in Chapter [3](#502765_1_En_3_Chapter.xhtml),
    the book is showing the simple approach to include the metadata definition for
    the same OData service and it did not require any added code. Truly, this is one
    of the most asked questions by many SAP customers. Usually customers even ask
    if coding can be skipped altogether; why would they need to use the more time-consuming
    approach? As everything else in software, different use cases call for different
    development approaches.'
