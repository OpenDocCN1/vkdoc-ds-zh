    ## Deploying Your Application


    After setting up the XSA environment in AWS, the easiest way to get your application
    into that environment is to connect to your GIT account and retrieve the code
    for your custom Fiori application. See the next few steps on how to connect to
    GIT, pull the code, and then deploy to the XSA environment using the SAP Web IDE
    running in AWS.


    ![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig25_HTML.jpg](images/502765_1_En_5_Chapter/502765_1_En_5_Fig25_HTML.jpg)


