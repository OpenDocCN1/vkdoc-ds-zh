    # 结语


    在本章即将结束之际，我怀着苦乐参半的心情，想与所有读者分享这些经验。有些开发框架（无论是用于单元测试还是非单元测试的）只需简单配置即可使用，而使用这些框架时，有时可能需要掌握更多高深和精深的技术知识。我建议所有开发者在决定采用、研究并推行某个框架之前，先熟悉几个备选方案。在我们的项目中，还有其他因素（如时间和资源）可能会限制我们，而这些额外因素正是导致项目有时最终采用简单的单元测试框架，有时却采用更优雅解决方案的主要原因——正如我发现
    Puppeteer 是目前最优雅且最简单的解决方案之一。


    分析每个框架的优缺点应当成为单元测试设计的一部分。此外，当开发者涉足全新领域时，查阅现有文档应当成为采用某个框架的驱动因素。我发现 Puppeteer 是我最偏爱的单元测试框架，尽管由于本文篇幅和时间所限，我只触及了该框架的皮毛。希望你能利用练习中分享的一些脚本，入门或拓展你在单元测试框架方面的知识。最后但同样重要的是，如果你仍对自动化测试感到不适应，还有一些手动方式供你入门单元测试：我们都是从某个起点开始的，希望你先掌握手动步骤，然后再涉足这些企业级信誉良好的选项。如果你决定深入研究
    QUnit、Nightmare JS 或 Puppeteer，我期待听到你的反馈。祝你实施顺利！


    # 5. 部署自定义 Fiori 应用


    欢迎来到《自定义 Fiori 应用》的最后一章。这一章令人兴奋，因为迄今为止所介绍的所有内容，现在都将被提升到另一个环境，以便供开发者之外的人员使用。部署应用不仅仅是复制文件或点击按钮，让软件从本地工作区或开发环境迁移到质量环境，甚至最终迁移到生产环境。在将软件部署到上游环境之前，可能有一系列项目需要验证。根据公司的政策，在软件开发生命周期中可能会遵循某些步骤，包括审批和发布软件的相关步骤。在发布此应用或其他
    Web 应用之前，可能需要满足某些非技术性要求。


    本书假设在执行后续步骤之前，先决条件已经满足——文档已更新、质量保证测试已通过、用户验收测试已完成、且已获得管理层的批准。此外，在 SAP Cloud Platform
    或 Amazon Web Service 环境中使用的任何外部账户都已被创建。


    ## 准备部署和软件版本管理


    在准备和发布软件时，可以在多个位置跟踪应用本身的版本，以及用于审计目的。作为软件的开发者和技术负责人，我们还必须跟踪与外部软件库的不同集成点。在这个自定义
    Fiori 应用中，本书使用了表 5-1 所示的版本。


    表 5-1


    Fiori 应用开发过程中使用的软件版本


    | 软件或库 | 版本 | 如何确定版本 |

    | --- | --- | --- |

    | HANA XSA | HANA 2 SPS 04 | HANA XSA 安装 |

    | Fiori UX | 3 | 在 `index.html` 中配置 |

    | SAPUI5 | 1.80.1 | 浏览器中按 `Ctrl + Shift + Alt + P` |

    | Node JS | 12.16.1 | 命令行中执行 `cmd node -v` |

    | NPM | 6.13.4 | 命令行中执行 `cmd npm -v` |

    | JQuery | 3.1.0 | 从 IDE 中打开文件 |

    | Moment.JS | 2.27.0 | 从 IDE 中打开文件 |

    | QUnit | 2.10.1 | 从 IDE 中打开文件 |

    | Nightmare JS | 3.0.2 | 从 IDE 中的 `node_module` |

    | Puppeteer JS | 5.2.1 | 从 IDE 中的 `node_module` |

    | OData | v2 和 v4 | 浏览器中文件的元数据 |

    | `mta.yaml` | 0.0.1 | 由开发者在 SAP Web IDE 中配置 |


    如你所见，示例自定义 Fiori 应用中有许多集成点，需要关注和维护它们，同时确保无论用什么开发，当它到达生产环境时也能得到维护。当由于问题（可能并非 Fiori
    开发者实现的功能的一部分）而报告问题和错误时，保留软件版本信息极为重要；有时，这些问题可能源于这些外部库或模块的依赖关系。通常，公司可能会对遵循合规流程的公司进行审计，在这种情况下，拥有此类文档证据总是非常有用的。


    你可能想知道，在开发自定义 Fiori 应用时，还有哪些其他原因需要保留版本信息。通常，外部依赖也可能发布新版本，在这种情况下，开发者可能需要查阅其文档和日志，以验证当前拥有的版本，并判断是否值得升级到新版本，或者新版本是否与其环境的其余部分兼容。当软件普遍可用时，有一些通用指导原则；有时，新功能甚至可能需要新的硬件。有时，软件的小版本发布或补丁可能对自定义应用的开发和集成影响不大；在这种情况下，影响可能很小甚至没有，集成可以安全地采用。如果依赖项的升级是主版本发布，则建议分析新功能的影响、优缺点以及所带来的好处，以了解是否有必要计划升级。这是
    SAP 软件或其他付费软件的常见场景，它们会经历发布周期，为其客户提供最新、最强大的功能。


    如表 5-1 所示，软件有多种版本。软件版本管理的最佳实践将版本模式描述为 `X.Y.Z`，其中


    1.  **X** 代表主版本号。主版本意味着软件中增加了多种功能并已发布。


    2.  **Y** 代表次版本号。次版本意味着软件中增加了一个小功能并已发布。


    3.  **Z** 代表补丁号。补丁号意味着软件的一个不同构建版本已被添加并发布。

    '
- fmt: '如果您想知道如何维护我们的自定义Fiori应用程序，请查看`mta.yaml`文件，它位于SAP Web IDE中Fiori项目的SAPUI5模块内。打开SAP
    Web IDE，导航到该项目，打开名为`waveui`的UI5模块，然后双击`mta.yaml`文件，如图[5-1](#502765_1_En_5_Chapter.xhtml#Fig1)所示。


    ![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig1_HTML.jpg](images/502765_1_En_5_Chapter/502765_1_En_5_Fig1_HTML.jpg)


    *图5-1 `mta.yaml`版本*


    在此图中，读者可以看到*应用程序版本*被标识为`0.0.1`；这意味着这是正在开发的软件的初始版本。开发人员需要提出的下一个问题是，随着新功能的添加或产品在其生命周期中的演进，这个工作的版本如何递增。这是通过在`mta.yaml`文件中将版本`0.0.1`递增为`0.0.2`、`0.0.3`等来完成的，如图[5-2](#502765_1_En_5_Chapter.xhtml#Fig2)所示。此`mta.yaml`文件仅当开发在遵循Cloud
    Foundry（CF）原则的XSA环境中进行时才存在。请注意，此开发工件（文件）在SAPUI5应用程序的XS经典版本中不存在。


    ![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig2_HTML.jpg](images/502765_1_En_5_Chapter/502765_1_En_5_Fig2_HTML.jpg)


    *图5-2 构建项目以生成`mtar`文件*


    在项目级别运行构建过程的结果是创建一个`mtar`文件（MTA = 多目标应用程序归档），这是用于将软件从SAP Web IDE部署到目标环境的主要文件，如图[5-3](#502765_1_En_5_Chapter.xhtml#Fig3)所示。这是一个二进制文件，仅用于部署目的。


    ![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig3_HTML.jpg](images/502765_1_En_5_Chapter/502765_1_En_5_Fig3_HTML.jpg)


    *图5-3 `mtar`生成的文件*


    SAP Web IDE具有通过选择部署代码（`mtar`文件）然后从SAP Web IDE中选择`Deploy`菜单来部署此开发代码的功能，如图[5-4](#502765_1_En_5_Chapter.xhtml#Fig4)所示。一旦选择了`Deploy`菜单，开发人员就可以选择是部署到SAP
    Cloud Platform，还是部署到XS Advanced环境（本地部署），如图[5-4](#502765_1_En_5_Chapter.xhtml#Fig4)所示。在本章末尾，将有一个类似的练习，使用相同的工具SAP
    Web IDE；然而，它将用于部署到Amazon Web Services（AWS）。


    ![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig4_HTML.jpg](images/502765_1_En_5_Chapter/502765_1_En_5_Fig4_HTML.jpg)


    *图5-4 选择部署Fiori应用程序的目标环境*


    下面展示了部署到本地XS Advanced环境的过程，以查看开发实例（由唯一标识符以及`sapui5`模块`waveui`的名称标识）如何与由其模块名称`waveui`标识的已发布实例一起显示，如图[5-5](#502765_1_En_5_Chapter.xhtml#Fig5)所示。


    ![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig5_HTML.jpg](images/502765_1_En_5_Chapter/502765_1_En_5_Fig5_HTML.jpg)


    *图5-5 部署到XSA后Fiori应用程序的多个实例*


    部署到XSA环境后，开发人员和用户会收到一个与开发期间使用的`URL:PORT`组合不同的`URL:PORT`组合，以此区分他们的应用程序部署到了哪里。访问这个新的URL将把他们带到目标环境中的应用程序。请记住，这两个应用程序都保存在控制台的`Applications`页面中，因为它们并行运行，并部署到不同的端口，就像它们是微服务一样。这是一个非常令人兴奋的话题，最近获得了很大的关注。请查阅我的书*《Microservices
    in SAP HANA XSA》*（Apress, 2020）以了解更多关于微服务的信息。


    如果您想了解Fiori应用程序如何开发到SAP Cloud Platform，请继续执行接下来的几个步骤。请注意，同一个应用程序可以部署到多个端点；但是，开发人员必须确保他们的Web应用程序能够访问其正在使用的任何OData服务。当您的OData服务和Fiori应用程序具有不同域时，请运行一些集成验证。可能还需要执行其他步骤，例如，在SAP
    Cloud Platform中创建目标（`Destination`）以信任目标URL，启用CORS（跨域资源共享），甚至让您的网络团队参与进来，以允许Fiori应用程序进行外部域调用。要创建目标，请转到SAP
    Cloud Platform Cockpit，并从左侧导航列表中选择`Destinations`菜单项，如图[5-6](#502765_1_En_5_Chapter.xhtml#Fig6)所示。


    ![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig6_HTML.jpg](images/502765_1_En_5_Chapter/502765_1_En_5_Fig6_HTML.jpg)


    *图5-6 SCP中的目标*


    然后，按照图[5-7](#502765_1_En_5_Chapter.xhtml#Fig7)中的步骤，提供必要的信息以从SAP Cloud Platform访问和测试目标。同一个屏幕允许SCP管理员设置受信任的证书。


    ![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig7_HTML.jpg](images/502765_1_En_5_Chapter/502765_1_En_5_Fig7_HTML.jpg)


    *图5-7 创建目标、导入目标或证书的目标详情*


    要将Fiori应用程序部署到SAP Cloud Platform，开发人员必须在该平台中拥有一个账户，允许他们创建、部署和维护应用程序，并进一步在云环境中设置其他设置。SAP
    Cloud Platform架构基于CF架构。SAP Cloud Platform的Neo版本不遵循这些标准。在展示将Fiori应用程序部署到SCP的步骤之前，请确保理解并掌握CF架构模型。在我的另一本书*《Building
    Microservices in SAP HANA XSA》*（[`https://www.apress.com/us/book/9781484261170`](https://www.apress.com/us/book/9781484261170)）中，有更多关于CF以及使用SAP
    HANA XSA构建微服务的信息。


    CF是一个开源的云应用平台。CF由IBM、SAP、Microsoft、Google等公司组成，共同制定行业标准，使应用程序能够在云提供商之间运行，从而让开发人员专注于应用程序开发，而不是创建云。创建CF就绪的应用程序的好处之一是，这些应用程序本质上与基础设施解耦，因此当它们准备好迁移到本地部署、公共云或其他私有云时，这些应用程序可以轻松地从一种环境/云迁移到另一种环境/云。在开始介绍应用程序之前，有必要先了解CF的层次组织以及我们将要交互的一些重要概念：组织（`Organization`）、空间（`Space`）、应用程序（`Application`）、服务（`Service`）和角色（`Role`），如图[5-8](#502765_1_En_5_Chapter.xhtml#Fig8)中的截图所示。


    ![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig8_HTML.jpg](images/502765_1_En_5_Chapter/502765_1_En_5_Fig8_HTML.jpg)


    *图5-8 CF层次结构架构*


    1.  一个组织（`org`）被定义为一个开发账户，其中拥有一个或多个开发者（称为贡献者），他们通过用户账户拥有访问权限。这些贡献者被分配了特殊角色，以管理、审计和构建云就绪应用程序，或授予他人访问权限。为了演示目的，本书提供的示例将有一个已经创建且处于活动状态的组织。只有管理员可以更改此`org`的状态；但是，我们将在剩余练习中假设它处于活动状态。'
  raw: 'If you are wondering how to maintain our custom Fiori application, then look
    at the mta.yaml file, which is part of the SAPUI5 module inside the Fiori project
    in the SAP Web IDE. Open the SAP Web IDE, navigate to the project, open the UI5
    module named waveui, and then double-click the mta.yaml file, as shown in Figure
    [5-1](#502765_1_En_5_Chapter.xhtml#Fig1).


    ![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig1_HTML.jpg](images/502765_1_En_5_Chapter/502765_1_En_5_Fig1_HTML.jpg)


    Figure 5-1


    mta.yaml version


    In this image, the reader can observe that the *application version* is identified
    as 0.0.1; that means that this is the initial version of the software being developed.
    The next question the developer needs to raise is how the version of this piece
    of work increments as new features are added or the product evolves over its lifetime.
    That is done in the mta.yaml file by increasing the 0.0.1 version to 0.0.2, 0.0.3,
    and so on, as shown in Figure [5-2](#502765_1_En_5_Chapter.xhtml#Fig2). This mta
    yaml file only exists if the development occurs in the XSA environment, which
    follows the Cloud Foundry (CF) principles. Be aware that this development artifact
    (file) does not exist in the XS classic version of SAPUI5 applications.


    ![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig2_HTML.jpg](images/502765_1_En_5_Chapter/502765_1_En_5_Fig2_HTML.jpg)


    Figure 5-2


    Building the project to generate an mtar file


    The result of running the build process at the project level creates an mtar file
    (MTA = Multi-Targeted Application archive), which is the main file that is used
    to deploy software from the SAP Web IDE to the targeted environment, as shown
    in Figure [5-3](#502765_1_En_5_Chapter.xhtml#Fig3). This is a binary file and
    it is used for deployment purposes only.


    ![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig3_HTML.jpg](images/502765_1_En_5_Chapter/502765_1_En_5_Fig3_HTML.jpg)


    Figure 5-3


    mtar generated files


    The SAP Web IDE has functionality to be able to deploy this development code (mtar
    file) by selecting it and then selecting the Deploy menu from the SAP Web IDE,
    as shown in Figure [5-4](#502765_1_En_5_Chapter.xhtml#Fig4). Once the Deploy menu
    is selected, then developers can choose if they will deploy to the SAP Cloud Platform,
    or to the XS Advanced environment (on premise), as shown in Figure [5-4](#502765_1_En_5_Chapter.xhtml#Fig4).
    Toward the end of the chapter, there will be a similar exercise running the same
    tool, SAP Web IDE; however, it will be used to deploy into Amazon Web Services
    (AWS).


    ![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig4_HTML.jpg](images/502765_1_En_5_Chapter/502765_1_En_5_Fig4_HTML.jpg)


    Figure 5-4


    Selecting a target environment to deploy the Fiori application


    Deploying to an on-premise XS Advanced environment is shown in the following to
    see how the development instance (identified by a unique identifier and also the
    name of the sapui5 module waveui) is shown alongside of the released instance
    identified by its module name waveui in Figure [5-5](#502765_1_En_5_Chapter.xhtml#Fig5).


    ![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig5_HTML.jpg](images/502765_1_En_5_Chapter/502765_1_En_5_Fig5_HTML.jpg)


    Figure 5-5


    Multiple instances of the Fiori application after being deployed to XSA


    After deploying to the XSA environment, developers and users receive a URL : PORT
    combination different from the URL : PORT they used during development, differentiating
    where their application was deployed to. Visiting this new URL will bring them
    to the application in the targeted environment. Keep in mind that both applications
    are kept in the Applications page of the cockpit since they are running in parallel
    and they are deployed to different ports as if they were microservices. This is
    a very exciting topic that has gained a lot of popularity lately. Check out my
    book *Microservices in SAP HANA XSA* (Apress, 2020) to learn more about microservices.


    Should you want to see how the Fiori application is developed to the SAP Cloud
    Platform, please proceed with the next few steps. Beware that the same application
    can be deployed to multiple endpoints; however, developers must ensure that their
    web applications can reach any OData services that are consuming. Run a few integration
    validations when you have different domains for your OData service and for your
    Fiori application. There may be additional steps to perform, for example, creating
    a Destination in the SAP Cloud Platform to trust the destination URL, enabling
    CORS (cross-origin resource sharing), or even getting your network team involved
    to allow the Fiori application to make external domain calls. To create a destination,
    go to the SAP Cloud Platform Cockpit and select the Destinations menu item from
    the left navigation list, as shown in Figure [5-6](#502765_1_En_5_Chapter.xhtml#Fig6).


    ![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig6_HTML.jpg](images/502765_1_En_5_Chapter/502765_1_En_5_Fig6_HTML.jpg)


    Figure 5-6


    Destinations in SCP


    Then, follow the steps in Figure [5-7](#502765_1_En_5_Chapter.xhtml#Fig7) and
    provide the necessary information to reach and test the destination from the SAP
    Cloud Platform. The same screen allows SCP admins to set up trusted certificates.


    ![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig7_HTML.jpg](images/502765_1_En_5_Chapter/502765_1_En_5_Fig7_HTML.jpg)


    Figure 5-7


    Destination details to create, import destinations or certificates


    To achieve a deployment of the Fiori application into the SAP Cloud Platform,
    developers must have an account in the platform itself allowing them to create,
    deploy, and maintain applications, and further, to set up other settings within
    the cloud environment. The SAP Cloud Platform architecture is based on the CF
    architecture. The Neo version of the SAP Cloud Platform does not follow these
    standards. Before showing the steps to deploy the Fiori application to the SCP,
    make sure to understand and grasp the CF architecture model. In my other book,
    *Building Microservices in SAP HANA XSA*, [`https://www.apress.com/us/book/9781484261170`](https://www.apress.com/us/book/9781484261170),
    there is more information about CF and about the microservices that can be built
    using SAP HANA XSA.


    CF is an open source cloud application platform. CF is made up of a group of companies
    such as IBM, SAP, Microsoft, Google, and others, coming together to set up industry
    standards allowing applications to be runnable across cloud providers so that
    developers can focus on application development and not on creating the cloud.
    One of the benefits of creating applications that are CF ready is that these applications
    are essentially decoupled from the infrastructure, so when they are ready to be
    moved to on-premise, public, or other private clouds, these applications are easily
    migrated from one environment/cloud to another. Before getting into applications,
    it is appropriate to look at CF’s hierarchical organization and some important
    concepts we will be interacting with: organization, space, application, services,
    and roles, as presented in the screenshot in Figure [5-8](#502765_1_En_5_Chapter.xhtml#Fig8).


    ![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig8_HTML.jpg](images/502765_1_En_5_Chapter/502765_1_En_5_Fig8_HTML.jpg)


    Figure 5-8


    CF hierarchy architecture


    1.  An organization (org) is defined as a development account where one or more
    developers (known as contributors) with access known as user accounts. These contributors
    have special roles assigned to them to manage, audit, and build cloud-ready applications
    or grant access to others. For demonstration purposes, the examples provided in
    this book will have an organization already created, and it is in an active status.
    Only an admin can change the status of this org; however, we will assume it is
    active for the rest of our exercises.'
  trans: '

    如果您想知道如何维护我们的自定义 Fiori 应用程序，请查看`mta.yaml`文件，它位于 SAP Web IDE 中 Fiori 项目的 SAPUI5
    模块内。打开 SAP Web IDE，导航到该项目，打开名为`waveui`的 UI5 模块，然后双击`mta.yaml`文件，如图 5-1 所示。


    ![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig1_HTML.jpg](img/502765_1_En_5_Fig1_HTML.jpg)


    *图 5-1 `mta.yaml`版本*


    在此图中，读者可以看到*应用程序版本*被标识为`0.0.1`；这意味着这是正在开发的软件的初始版本。开发人员需要提出的下一个问题是，随着新功能的添加或产品在其生命周期中的演进，这个工作的版本如何递增。这是通过在`mta.yaml`文件中将版本`0.0.1`递增为`0.0.2`、`0.0.3`等来完成的，如图
    5-2 所示。此`mta.yaml`文件仅当开发在遵循 Cloud Foundry（CF）原则的 XSA 环境中进行时才存在。请注意，此开发工件（文件）在
    SAPUI5 应用程序的 XS 经典版本中不存在。


    ![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig2_HTML.jpg](img/502765_1_En_5_Fig2_HTML.jpg)


    *图 5-2 构建项目以生成`mtar`文件*


    在项目级别运行构建过程的结果是创建一个`mtar`文件（MTA = 多目标应用程序归档），这是用于将软件从 SAP Web IDE 部署到目标环境的主要文件，如图
    5-3 所示。这是一个二进制文件，仅用于部署目的。


    ![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig3_HTML.jpg](img/502765_1_En_5_Fig3_HTML.jpg)


    *图 5-3 `mtar`生成的文件*


    SAP Web IDE 具有通过选择部署代码（`mtar`文件）然后从 SAP Web IDE 中选择`Deploy`菜单来部署此开发代码的功能，如图 5-4
    所示。一旦选择了`Deploy`菜单，开发人员就可以选择是部署到 SAP Cloud Platform，还是部署到 XS Advanced 环境（本地部署），如图
    5-4 所示。在本章末尾，将有一个类似的练习，使用相同的工具 SAP Web IDE；然而，它将用于部署到 Amazon Web Services（AWS）。


    ![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig4_HTML.jpg](img/502765_1_En_5_Fig4_HTML.jpg)


    *图 5-4 选择部署 Fiori 应用程序的目标环境*


    下面展示了部署到本地 XS Advanced 环境的过程，以查看开发实例（由唯一标识符以及`sapui5`模块`waveui`的名称标识）如何与由其模块名称`waveui`标识的已发布实例一起显示，如图
    5-5 所示。


    ![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig5_HTML.jpg](img/502765_1_En_5_Fig5_HTML.jpg)


    *图 5-5 部署到 XSA 后 Fiori 应用程序的多个实例*


    部署到 XSA 环境后，开发人员和用户会收到一个与开发期间使用的`URL:PORT`组合不同的`URL:PORT`组合，以此区分他们的应用程序部署到了哪里。访问这个新的
    URL 将把他们带到目标环境中的应用程序。请记住，这两个应用程序都保存在控制台的`Applications`页面中，因为它们并行运行，并部署到不同的端口，就像它们是微服务一样。这是一个非常令人兴奋的话题，最近获得了很大的关注。请查阅我的书*《Microservices
    in SAP HANA XSA》*（Apress, 2020）以了解更多关于微服务的信息。


    如果您想了解 Fiori 应用程序如何开发到 SAP Cloud Platform，请继续执行接下来的几个步骤。请注意，同一个应用程序可以部署到多个端点；但是，开发人员必须确保他们的
    Web 应用程序能够访问其正在使用的任何 OData 服务。当您的 OData 服务和 Fiori 应用程序具有不同域时，请运行一些集成验证。可能还需要执行其他步骤，例如，在
    SAP Cloud Platform 中创建目标（`Destination`）以信任目标 URL，启用 CORS（跨域资源共享），甚至让您的网络团队参与进来，以允许
    Fiori 应用程序进行外部域调用。要创建目标，请转到 SAP Cloud Platform Cockpit，并从左侧导航列表中选择`Destinations`菜单项，如图
    5-6 所示。


    ![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig6_HTML.jpg](img/502765_1_En_5_Fig6_HTML.jpg)


    *图 5-6 SCP 中的目标*


    然后，按照图 5-7 中的步骤，提供必要的信息以从 SAP Cloud Platform 访问和测试目标。同一个屏幕允许 SCP 管理员设置受信任的证书。


    ![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig7_HTML.jpg](img/502765_1_En_5_Fig7_HTML.jpg)


    *图 5-7 创建目标、导入目标或证书的目标详情*


    要将 Fiori 应用程序部署到 SAP Cloud Platform，开发人员必须在该平台中拥有一个账户，允许他们创建、部署和维护应用程序，并进一步在云环境中设置其他设置。SAP
    Cloud Platform 架构基于 CF 架构。SAP Cloud Platform 的 Neo 版本不遵循这些标准。在展示将 Fiori 应用程序部署到
    SCP 的步骤之前，请确保理解并掌握 CF 架构模型。在我的另一本书*《Building Microservices in SAP HANA XSA》*（[`https://www.apress.com/us/book/9781484261170`](https://www.apress.com/us/book/9781484261170)）中，有更多关于
    CF 以及使用 SAP HANA XSA 构建微服务的信息。


    CF 是一个开源的云应用平台。CF 由 IBM、SAP、Microsoft、Google 等公司组成，共同制定行业标准，使应用程序能够在云提供商之间运行，从而让开发人员专注于应用程序开发，而不是创建云。创建
    CF 就绪的应用程序的好处之一是，这些应用程序本质上与基础设施解耦，因此当它们准备好迁移到本地部署、公共云或其他私有云时，这些应用程序可以轻松地从一种环境/云迁移到另一种环境/云。在开始介绍应用程序之前，有必要先了解
    CF 的层次组织以及我们将要交互的一些重要概念：组织（`Organization`）、空间（`Space`）、应用程序（`Application`）、服务（`Service`）和角色（`Role`），如图
    5-8 中的截图所示。


    ![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig8_HTML.jpg](img/502765_1_En_5_Fig8_HTML.jpg)


    *图 5-8 CF 层次结构架构*


    1.  一个组织（`org`）被定义为一个开发账户，其中拥有一个或多个开发者（称为贡献者），他们通过用户账户拥有访问权限。这些贡献者被分配了特殊角色，以管理、审计和构建云就绪应用程序，或授予他人访问权限。为了演示目的，本书提供的示例将有一个已经创建且处于活动状态的组织。只有管理员可以更改此`org`的状态；但是，我们将在剩余练习中假设它处于活动状态。

    '
- fmt: "2.  Within an organization, there can be one or more spaces. A space is defined\
    \ as a partition within the org dedicated to building, deploying, and maintaining\
    \ applications. Every application is scoped to one space. Having an application\
    \ will eventually require granting roles for access to that application. Application\
    \ roles belong to one and only one space.\n\n3.  Applications and services are\
    \ the next level within the hierarchy of CF. These applications and services allow\
    \ users to display and consume data.\n\n4.  Users may have one or more roles (role\
    \ collections are templates) assigned to them. These roles allow the users to\
    \ develop, access, manage, or audit applications, spaces, or even orgs. Application\
    \ security is a very complex part of software systems. Security in the cloud (and\
    \ in HANA XSA) can be its very own extensive topic. There are several other books\
    \ currently available that explain SAP HANA XSA security in extensive detail.\
    \ For this book, there will be enough security already implemented to access an\
    \ OData service from the Fiori application.\n\nThere are different ways to interact\
    \ with the CF instances. One of them is via the command-line interface (CLI).\
    \ The CLI can be combined with Linux commands, such as `pipe`, `grep`, and others.\
    \ There are various commands which we will have to interact with the cloud/XSA\
    \ architecture, such as logging in, setting up services, and creating, editing,\
    \ building, deploying, or even scaling an application or service. The CF CLI is\
    \ a versatile tool that allows developers to interact with their cloud instance.\
    \ It is easy to automate and script other processes that otherwise would require\
    \ a human to type commands. It minimizes the risk of introducing errors, while\
    \ interacting with the cloud and keeping it available for developers and admins\
    \ who would require knowing cloud container details.\n\nExamples of such commands\
    \ are\n\n```\ncf login           # to log in to the cloud instance\ncf apps |\
    \ grep      # to retrieve an application from the list of applications\ncf push\
    \             # pushing an application to the cf instance\ncf scale -m -i \n```\n\
    \nA comprehensive list of available commands is shown here: [`http://cli.cloudfoundry.org/en-US/cf/`](http://cli.cloudfoundry.org/en-US/cf/)\n\
    \nOtherwise, once CF CLI is installed on a system, one can run the command `cf\
    \ --help` to see how to utilize a command and to see what flags it has, as shown\
    \ in Figure [5-9](#502765_1_En_5_Chapter.xhtml#Fig9).\n\n![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig9_HTML.jpg](images/502765_1_En_5_Chapter/502765_1_En_5_Fig9_HTML.jpg)\n\
    \nFigure 5-9\n\nCF CLI\n\nTo deploy our Fiori application to SCP, select the `.mtar`\
    \ file generated from the workspace project, then select “Deploy to” and select\
    \ SAP Cloud Platform. As you become aware of the CF architecture, you will need\
    \ to choose the space to deploy your application to next. If you are running the\
    \ SAP Cloud trial edition, by default, the SCP already provided an org for you\
    \ when you enabled your CF mode within the platform. Let us see the steps in the\
    \ SAP Cloud Platform to retrieve the settings you will need. Go to your SCP account\
    \ (or register one for free). Once you enter, you will see the screen shown in\
    \ Figure [5-10](#502765_1_En_5_Chapter.xhtml#Fig10).\n\n![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig10_HTML.jpg](images/502765_1_En_5_Chapter/502765_1_En_5_Fig10_HTML.jpg)\n\
    \nFigure 5-10\n\nSAP Cloud Platform trial account\n\nThen, observe that the SCP\
    \ uses AWS behind the scenes, as shown in Figure [5-11](#502765_1_En_5_Chapter.xhtml#Fig11).\
    \ The book will go over AWS later at the end of this chapter. It is important\
    \ to remember the region where these resources are being created.\n\n![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig11_HTML.jpg](images/502765_1_En_5_Chapter/502765_1_En_5_Fig11_HTML.jpg)\n\
    \nFigure 5-11\n\nSCP using AWS East (VA) region\n\nThis process, shown in Figure\
    \ [5-12](#502765_1_En_5_Chapter.xhtml#Fig12), may take a few minutes to complete.\
    \ Once it finishes, you will be able to continue."
  raw: "2.  Within an organization, there can be one or more spaces. A space is defined\
    \ as a partition within the org dedicated to building, deploying, and maintaining\
    \ applications. Every application is scoped to one space. Having an application\
    \ will eventually require granting roles for access to that application. Application\
    \ roles belong to one and only one space.\n\n3.  Applications and services are\
    \ the next level within the hierarchy of CF. These applications and services allow\
    \ users to display and consume data.\n\n4.  Users may have one or more roles (role\
    \ collections are templates) assigned to them. These roles allow the users to\
    \ develop, access, manage, or audit applications, spaces, or even orgs. Application\
    \ security is a very complex part of software systems. Security in the cloud (and\
    \ in HANA XSA) can be its very own extensive topic. There are several other books\
    \ currently available that explain SAP HANA XSA security in extensive detail.\
    \ For this book, there will be enough security already implemented to access an\
    \ OData service from the Fiori application.\n\nThere are different ways to interact\
    \ with the CF instances. One of them is via the command-line interface (CLI) .\
    \ The CLI can be combined with Linux commands, such as pipe, grep, and others.\
    \ There are various commands which we will have to interact with the cloud/XSA\
    \ architecture, such as logging in, setting up services, and creating, editing,\
    \ building, deploying, or even scaling an application or service. The CF CLI is\
    \ a versatile tool that allows developers to interact with their cloud instance.\
    \ It is easy to automate and script other processes that otherwise would require\
    \ a human to type commands. It minimizes the risk of introducing errors, while\
    \ interacting with the cloud and keeping it available for developers and admins\
    \ who would require knowing cloud container details.\n\nExamples of such commands\
    \ are\n\n```\ncf login           # to log in to the cloud instance\ncf apps |\
    \ grep      # to retrieve an application from the list of applications\ncf push\
    \             # pushing an application to the cf instance\ncf scale  -m  -i \n\
    ```\n\nA comprehensive list of available commands is shown here: [`http://cli.cloudfoundry.org/en-US/cf/`](http://cli.cloudfoundry.org/en-US/cf/)\n\
    \nOtherwise, once CF CLI is installed on a system, one can run the command cf\
    \ --help to see how to utilize a command and to see what flags it has, as shown\
    \ in Figure [5-9](#502765_1_En_5_Chapter.xhtml#Fig9).\n\n![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig9_HTML.jpg](images/502765_1_En_5_Chapter/502765_1_En_5_Fig9_HTML.jpg)\n\
    \nFigure 5-9\n\nCF CLI\n\nTo deploy our Fiori application to SCP, select the mtar\
    \ file generated from the workspace project, then select “Deploy to” and select\
    \ SAP Cloud Platform. As you become aware of the CF architecture, you will need\
    \ to choose the space to deploy your application to next. If you are running the\
    \ SAP Cloud trial edition, by default, the SCP already provided an org for you\
    \ when you enabled your CF mode within the platform. Let us see the steps in the\
    \ SAP Cloud Platform to retrieve the settings you will need. Go to your SCP account\
    \ (or register one for free). Once you enter, you will see the screen shown in\
    \ Figure [5-10](#502765_1_En_5_Chapter.xhtml#Fig10).\n\n![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig10_HTML.jpg](images/502765_1_En_5_Chapter/502765_1_En_5_Fig10_HTML.jpg)\n\
    \nFigure 5-10\n\nSAP Cloud Platform trial account\n\nThen, observe that the SCP\
    \ uses AWS behind the scenes, as shown in Figure [5-11](#502765_1_En_5_Chapter.xhtml#Fig11).\
    \ The book will go over AWS later at the end of this chapter. It is important\
    \ to remember the region where these resources are being created.\n\n![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig11_HTML.jpg](images/502765_1_En_5_Chapter/502765_1_En_5_Fig11_HTML.jpg)\n\
    \nFigure 5-11\n\nSCP using AWS East (VA) region\n\nThis process, shown in Figure\
    \ [5-12](#502765_1_En_5_Chapter.xhtml#Fig12), may take a few minutes to complete.\
    \ Once it finishes, you will be able to continue."
  trans: "\n2.  在一个组织内，可以包含一个或多个空间。空间被定义为组织内的一个分区，专门用于构建、部署和维护应用程序。每个应用程序都归属于一个空间。拥有应用程序最终需要授予访问该应用程序的角色。应用程序角色属于且仅属于一个空间。\n\
    \n3.  应用程序和服务是 CF 层级结构中的下一级。这些应用程序和服务允许用户展示和使用数据。\n\n4.  用户可能被分配一个或多个角色（角色集合是模板）。这些角色允许用户开发、访问、管理或审计应用程序、空间甚至组织。应用程序安全是软件系统中非常复杂的部分。云（以及\
    \ HANA XSA）中的安全性本身就是一个广泛的话题。目前已有几本其他书籍详细解释了 SAP HANA XSA 的安全性。对于本书，其中已实现了足够的安全性来从\
    \ Fiori 应用程序访问 OData 服务。\n\n有多种方式可以与 CF 实例进行交互。其中一种是通过命令行界面（CLI）。CLI 可以与 Linux\
    \ 命令结合使用，例如 `pipe`、`grep` 等。我们需要使用各种命令与云/XSA 架构进行交互，例如登录、设置服务，以及创建、编辑、构建、部署甚至扩展应用程序或服务。CF\
    \ CLI 是一个多功能工具，允许开发者与其云实例进行交互。它易于自动化和编写其他流程的脚本，否则这些流程需要人工输入命令。它最大限度地降低了与云交互时引入错误的风险，并使其对需要了解云容器细节的开发者和管理员保持可用性。\n\
    \n此类命令的示例如下\n\n```\ncf login           # 登录云实例\ncf apps | grep      # 从应用程序列表中检索应用程序\n\
    cf push             # 将应用程序推送到 cf 实例\ncf scale -m -i \n```\n\n可用命令的完整列表在此处显示：\
    \ [`http://cli.cloudfoundry.org/en-US/cf/`](http://cli.cloudfoundry.org/en-US/cf/)\n\
    \n此外，一旦在系统上安装了 CF CLI，可以运行 `cf --help` 命令来查看如何使用一个命令及其可用的标志，如图 5-9 所示。\n\n![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig9_HTML.jpg](img/502765_1_En_5_Fig9_HTML.jpg)\n\
    \n图 5-9\n\nCF CLI\n\n要将我们的 Fiori 应用程序部署到 SCP，请选择从工作区项目生成的 `.mtar` 文件，然后选择“Deploy\
    \ to”并选择 SAP Cloud Platform。当你了解了 CF 架构后，接下来需要选择要将应用程序部署到的空间。如果你正在运行 SAP Cloud\
    \ 试用版，默认情况下，当你在平台内启用 CF 模式时，SCP 已经为你提供了一个组织。让我们看看在 SAP Cloud Platform 中检索所需设置的步骤。转到你的\
    \ SCP 账户（或免费注册一个）。登录后，你将看到如图 5-10 所示的屏幕。\n\n![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig10_HTML.jpg](img/502765_1_En_5_Fig10_HTML.jpg)\n\
    \n图 5-10\n\nSAP Cloud Platform 试用账户\n\n然后，注意 SCP 在后台使用了 AWS，如图 5-11 所示。本书将在本章后面介绍\
    \ AWS。记住这些资源被创建的区域非常重要。\n\n![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig11_HTML.jpg](img/502765_1_En_5_Fig11_HTML.jpg)\n\
    \n图 5-11\n\n使用 AWS East（VA）区域的 SCP\n\n此过程如图 5-12 所示，可能需要几分钟才能完成。完成后，你将可以继续操作。\n"
- fmt: '![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig12_HTML.jpg](images/502765_1_En_5_Chapter/502765_1_En_5_Fig12_HTML.jpg)


    **Figure 5-12** Setting up the trial account


    After the account is created, the browser will redirect you to the SCP Cockpit
    screen shown in Figure [5-13](#502765_1_En_5_Chapter.xhtml#Fig13). Take a careful
    look at the different features in this dashboard so that you can reference it
    later or even delete the trial account in case you do not use it.


    ![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig13_HTML.jpg](images/502765_1_En_5_Chapter/502765_1_En_5_Fig13_HTML.jpg)


    **Figure 5-13** SCP Cockpit showing the global account settings


    Select the tile "trial" global account to proceed to your subaccount.


    In the following screen, you can see all the cloud settings that you will need
    to use for the deployment. The image shown in Figure [5-14](#502765_1_En_5_Chapter.xhtml#Fig14)
    is one of those that should considered as worth a thousand words, since this information
    is going to be useful for your deployments, for your maintenance, and more importantly
    for any other future development. Analyze this dashboard and familiarize yourself
    with this screen in Figure [5-14](#502765_1_En_5_Chapter.xhtml#Fig14), and all
    the important settings related to the CF architecture such as `Org Name`, `Space
    Name`, and the `API endpoint`, which will be needed on the `SAP Web IDE` when
    you decide to deploy from that IDE tool.


    ![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig14_HTML.jpg](images/502765_1_En_5_Chapter/502765_1_En_5_Fig14_HTML.jpg)


    **Figure 5-14** SCP CF settings in subaccount trial


    Notice that there is only a single space created; moreover, no applications live
    in it yet. That number should increase after completing the deployment. If you
    are doing this exercise in an SCP trial account, you will also see the number
    of days your cloud instance is enabled for, which is shown on the top right-hand
    corner of your browser (30 days by default). Should you require additional days
    to use for your demo, you may request that from SCP. There may be limited features
    if you are in a trial account, as I will show next. Since you have the Cloud Platform
    settings described in the previous paragraph, return to your `SAP Web IDE` and
    follow the next steps to deploy your application to the SCP environment:


    ![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig15_HTML.jpg](images/502765_1_En_5_Chapter/502765_1_En_5_Fig15_HTML.jpg)


    **Figure 5-15** SAP Web IDE deploying to SCP


    1.  Assuming you have already generated an `mtar` file, select the `mtar` file
    you wish to deploy.

    2.  Select the Deploy menu, then select "Deploy to SAP Cloud Platform" as shown
    in Figure [5-15](#502765_1_En_5_Chapter.xhtml#Fig15).


    In the create sample cloud application in the SCP tutorial, [`https://developers.sap.com/tutorials/s4sdk-cloud-foundry-sample-application.html`](https://developers.sap.com/tutorials/s4sdk-cloud-foundry-sample-application.html),
    developers can also observe that the following endpoints apply depending on the
    region selected – your endpoint will show as displayed in Figure [5-16](#502765_1_En_5_Chapter.xhtml#Fig16).
    If it does not show, type one of the following endpoints in the drop-down control.


    ![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig16_HTML.jpg](images/502765_1_En_5_Chapter/502765_1_En_5_Fig16_HTML.jpg)


    **Figure 5-16** SAP Web IDE showing endpoint on the Cloud Platform


    1.  For EU (Europe) use `https://api.cf.eu10.hana.ondemand.com` AWS platform

    2.  For US East (VA) use `https://api.cf.us10.hana.ondemand.com` AWS platform

    3.  For US central use `https://api.cf.us20.hana.ondemand.com` Azure platform


    After selecting the endpoint (which matches your SAP account), enter the account
    credentials as presented in Figure [5-17](#502765_1_En_5_Chapter.xhtml#Fig17).


    ![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig17_HTML.jpg](images/502765_1_En_5_Chapter/502765_1_En_5_Fig17_HTML.jpg)


    **Figure 5-17** SCP account credentials


    After the `SAP Web IDE` authenticates you against the SCP, then the next prompt
    will be presented, so that the deployer selects the organization and a space,
    as shown in Figure [5-18](#502765_1_En_5_Chapter.xhtml#Fig18). Keep in mind that
    an organization may have one or more spaces. The following exercise only shows
    the default `dev` space for illustration purposes – choose a different space if
    your org has created a different space for your development or your deployments.


    ![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig18_HTML.jpg](images/502765_1_En_5_Chapter/502765_1_En_5_Fig18_HTML.jpg)


    **Figure 5-18** SCP cloud hierarchy


    In my case, my deployment failed due to a database configuration setting; however,
    if you are deploying only your custom Fiori application, you should be able to
    complete the deployment. Look at the console log, as in Figure [5-19](#502765_1_En_5_Chapter.xhtml#Fig19),
    to understand if the deployment was completed or if any settings in your Fiori
    application need to be edited.


    ![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig19_HTML.jpg](images/502765_1_En_5_Chapter/502765_1_En_5_Fig19_HTML.jpg)


    **Figure 5-19** SAP Web IDE error during deployment'
