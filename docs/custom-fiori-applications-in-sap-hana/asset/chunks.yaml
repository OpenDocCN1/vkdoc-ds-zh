    虽然在 AWS 中运行 HANA XSA 应用的实践练习，看起来与在本地场景中运行应用几乎如出一辙，本质上确实非常接近；但你可以看到，我们定制的 Fiori
    应用在云端的运行情况，既可以通过浏览器进行验证，也可以使用本书第 4 章中来自 Puppeteer 的单元测试脚本来验证。


    此外，AWS 实例必须在 EC2 仪表盘中处于运行状态，才能在浏览器中运行。在此温馨提醒一下，完成开发后请记得停止（或终止）你的 EC2 实例，以避免在 AWS
    中产生不必要的费用。同时请记住，EBS 卷（存储）是独立于 EC2 实例运行的；因此，如果你希望终止 EC2 实例，也请分离并删除该卷，以避免为你未使用的服务付费。


    ## GIT 仓库


    在前文关于 AWS 云的小节中曾简要提及，如何使用 GIT 仓库将开发工作保存在外部企业仓库中。使用外部仓库的原因是允许代码在 SAP HANA 外部进行维护。此外，像
    GIT 这样的外部代码仓库是一种行业标准，它允许开发团队使用不同的分支策略并行进行软件开发，并保持其部署的整洁性。有几种不同的外部仓库；然而，本书使用 GIT
    是为了与本书练习中提供的工具保持更紧密的集成。


    为简单起见，假设所有跟随练习的人都有一个有效的 GIT 账户，并且能够使用自己的许可证从 GIT 仓库进行连接、提交和克隆——本书将演示使用一个拥有免费许可证的账户。


    为了使用 GIT，开发者必须能够访问此仓库，熟悉 GIT 命令，并且要么通过命令行执行（如果你采用此方法，则需要下载 GIT CLI），要么通过 SAP Web
    IDE 与之交互，后者已经具备与 GIT 仓库的接口。在上一节中，练习使用了克隆功能来从 GIT 仓库检索代码，并使用检索到的代码将其部署到 AWS 实例。


    GIT 命令在包括 SAP Fiori 应用、单元测试以及此处展示或你在日常工作中所见到的其他软件开发在内的现代软件开发和维护中是基础。需要理解每个命令的工作原理、何时以及如何使用它们，以便在进行
    Fiori 开发时提高效率。理解这些命令还能让你与其他团队成员并行工作，也能让你理解代码版本控制和软件部署，并最终能够跟踪分配的新任务或错误修复。


    还有更多可用的命令，但并未全部列在表 5-2 中。以下是最常用命令的列表（排名不分先后）：


    **表 5-2** 从 SAP Web IDE 使用的 GIT 命令


    | 命令 | 描述 | 示例 |

    | --- | --- | --- |

    | `Clone` | 将外部仓库克隆到本地工作区 | `git clone <url>` |

    | `Commit` | 将本地工作区的更改提交到远程仓库 | `git commit -m <提交注释>` |

    | `Stash` | 保存你不想立即提交的更改 | `git stash` |

    | `Push` | 将你的更改推送到远程（主）分支 | `git push <远程仓库> <分支>` |

    | `Pull` | 从远程分支拉取更改 | `git pull <远程仓库> <分支>` |

    | `Rebase` | 将一系列提交移动或合并到新的基础提交的过程。Rebase 的主要目的是维护项目历史 | `git rebase <基础>` |


    如果你选择 GIT 窗格（位于浏览器屏幕右侧顶部算起的第二个图标），则所有这些命令都可以从 SAP Web IDE 中运行。任何待处理的更改都会显示在更改表格中，如图
    5-34 所示。


    ![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig34_HTML.jpg](img/502765_1_En_5_Fig34_HTML.jpg)


    **图 5-34** SAP Web IDE 中的 GIT 窗格


    要将更改保存到仓库，开发者必须保存对 SAP Web IDE 中文件所做的更改，这些更改会以待处理状态显示在 GIT 窗格中。然后，开发者必须选择要暂存的文件，在
    GIT 窗格底部的注释输入框中输入注释，最后选择 `commit` 和 `push` 按钮，将这些更改推送到外部仓库。


    在构建此定制 Fiori 应用的不同阶段，都执行了这些步骤，你可以从 GITHUB 仓库页面看到更改日志，如图 5-35 所示（共 23 次提交，包括一些测试提交和一些小提交）。


    ![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig35_HTML.jpg](img/502765_1_En_5_Fig35_HTML.jpg)


    **图 5-35** 仓库中显示的 GITHUB 代码提交


    无论你是进行定制 Fiori 开发还是任何其他类型的软件开发，你都很有可能与外部代码仓库交互。花些时间熟悉仓库命令。其他类似 GITHUB 的外部仓库包括
    Bitbucket 和 MSFT TFS，仅举两例。这两个额外外部代码仓库也可以作为你 Fiori 开发的代码仓库，并且当你与它们交互时，遵循与 GITHUB
    仓库相同的命令。根据你使用的工具，有相应的插件用于与这些外部仓库交互。在本书前面部分，我们还演示了 Visual Studio Code 编辑器，它也可以与
    GITHUB、Bitbucket 和 MSFT TFS 交互。


    ## 自动化部署


    这可能是本书阅读量最大的部分。每个人都希望自己的团队能够搭上持续集成和持续交付（CI/CD）的顺风车。这意味着什么？


    1.  持续集成是一种实践，即频繁地向仓库提交代码，以确保代码能够与软件的其他部分“契合”。拥有自动化单元测试有助于运行持续集成管道。如果开发者更改代码、部署，并且他们的软件能够工作，那么他们就在遵循这一实践。


    2.  持续交付依赖于持续集成。负责部署开发者代码的软件工程师必须始终能够进行部署，并且保持其部署的代码持续工作，以确保交付新代码不会破坏现有的软件系统。尽管代码在不断集成，但没有理由不能让软件在可工作状态下交付。运行持续交付管道可能看起来有风险；这需要极大的纪律性和全体人员的参与，以确保
    CI/CD 过程能够尽可能顺畅地运行，但这是可行的。这种类型的操作可以在大型组织中实现，这些组织有专门的工程师团队负责协调不同的组成部分。


    在我们的练习中，实现 CI/CD 的理想情况是，所有软件的修改都通过一个自动化的单元测试过程运行，例如第 4 章中所示的过程。如果自动化测试通过了所有验证，那么代码就会被提交到
    GITHUB，并且代码提交会通过一个验证软件语法规则、代码覆盖率等的过程来运行，以确保其符合一定的标准集。如果这一步成功了，那么该提交就可以通过某个工具或脚本部署到上游环境。

    '
- fmt: '# Conclusion


    As I arrive at the end of the chapter, I am pleased to say that I have enjoyed
    being able to deploy this application to different cloud providers. This chapter
    started by explaining the versioning of software and provided some explanation
    about software releases and what to look for when maintaining software. After
    the software versioning, the book explained and compared the `CF` architecture
    and how it is followed from the different Cloud Platforms including the `SAP HANA
    XSA`, which is based on cloud principles. The steps may be a little different
    from provider to provider; however, the concepts between the various platforms
    follow very similar steps. After all, the target Cloud Platform is based on the
    `CF` architecture. I hope that you can follow the steps and that you can complete
    your deployment in whatever target platform you choose. There are many tools and
    approaches to complete your exercise, and this book showed only a few of them.


    # Closing Thoughts on the Book


    As I conclude the writing of the book, I feel extremely glad about the various
    topics shared throughout the exercises. It seems like a long time ago I was writing
    about creating custom `Fiori` applications and starting with a whiteboard design.
    Shortly after that, I quickly moved into the various floor plans and application
    types that can be developed for the purpose of `Fiori` applications. Then, the
    book introduced various tools to develop, set up, and extend `Fiori` applications
    using SAP-provided tools such as the `SAP Web IDE`, the `SAP Web IDE personal
    edition`, and also external IDE tools such as the `Visual Studio Code` editor
    with some extensions provided by SAP. After presenting the tools and the development
    of the `Fiori` application showing the `MVS` pattern with `XML` views, `JavaScript`
    controllers, and the various ways to present and model data, the book then made
    a turn into the unit testing frameworks, which I believe comprise an area that
    needs to be explored more and more by companies. I concluded the book by explaining
    the steps required, introducing software versioning, and deploying our developed
    custom `Fiori` application to various platforms. I hope you were able to follow
    along and learn a few tricks from at least some of the chapters, whether you learned
    something in terms of design, the integration to third-party `JavaScript` libraries,
    adding software versioning, or even deploying to the different platforms. Thank
    you very much for the time you took to follow my journey, and I wish you the best
    of luck on your custom `Fiori` development.'
