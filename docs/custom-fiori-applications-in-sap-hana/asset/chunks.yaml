- fmt: '# Deploying to Different Platforms Such as SAP Cloud and AWS


    The previous subsection described the steps that developers can follow to build
    and deploy the Fiori application from the SAP Web IDE into the SAP Cloud Platform.
    There are other cloud providers that can also be used to host Fiori applications.
    This section of the chapter will explain how to deploy the same Fiori application
    to an AWS environment. AWS requires a paid account for an `EC2` instance to be
    able to load the SAP HANA XSA express edition image on top of it.


    For this book, I chose AWS, because I am already familiar with this process and
    I have done this implementation a few times. Believe it or not, every time I run
    these steps, I learn something new, and it has been no different during the writing
    of this book. Just like the book explained the CF architecture and hierarchy,
    I think it is only fair to introduce a few concepts that are used from the AWS
    Cloud Platform.


    AWS offers a huge list of services that are used for companies around the world
    to run their day-to-day businesses. AWS is an amazing platform from the point
    of view of a developer, from the point of view of a cloud customer, and from the
    point of view of the offerings they have. I have been extremely satisfied with
    the various services I have explored for my own purposes as well as in writing
    this book.


    Selecting a cloud provider can be challenging for organizations because they are
    trusting part of their infrastructure (and sometimes their data) to the cloud
    providers; however, if you make a comparison of going to the cloud, you will realize
    the many benefits of doing so. Among many benefits, here are a few that come to
    mind:


    1.  **Going global in minutes.** You can deploy your infrastructure, software,
    and other services around the world within a few clicks and be production ready
    quickly. No need to wait for long days/weeks to get your hardware ordered and
    delivered as it was in the on-premise days.

    2.  **Zero maintenance of infrastructure and pay only for what you use.** Patches
    or other maintenance are costs that the cloud provider incurs. You (the customer)
    are only responsible for the computing power and data retrieval while in use.

    3.  **Responsibility “for the cloud” vs. “in the cloud.”** You (the customer)
    must be responsible for what you put in the cloud, such as securing your application,
    database, users, and so on. AWS is responsible for the cloud, making sure it is
    up and running, that its managed services are secure, and that there is no mix
    of your account with other accounts.

    4.  **Keeping track of the expenses incurred by your services via tags.** Your
    cloud account can set alarms for budgeting purposes and also flag each service
    to let you know what costs are associated with which services you and your customers
    are using.


    Once you have a good understanding of the benefits of the cloud and you are ready
    to run your applications in this platform, you will find out that you also need
    to understand additional AWS concepts. Knowledge of the following terms is required
    when you are setting up certain services and to understand your billing invoice
    at the end of the month. Pay close attention when setting up your services:


    1.  **Region** - this is an isolated geographical area in the world with clustered
    data centers. There are several regions in North America; for example, US East,
    US West, Canada. It is recommended for customers to select a region nearby to
    where their customers are in relationship to this area to minimize the impact
    on performance and network delays on their software. The concept of regionalism
    has a great impact on how software and cloud services are consumed. You would
    want to keep your operations as close to you as possible.

    2.  **Availability Zone** – an AZ is one or more data centers within the regions.
    The reason why there are multiple AZs within a region is to have redundancy which
    yields high availability, resulting in fault-tolerant proof, independent power,
    independent cooling, security, and data protection. AZs within the US East region
    are `us-east-1`, `us-east-2`. Verify the AZs within the regions where you are
    deploying your software.


    These concepts are shown at a high level in Figure [5-20](#502765_1_En_5_Chapter.xhtml#Fig20).


    ![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig20_HTML.jpg](images/502765_1_En_5_Chapter/502765_1_En_5_Fig20_HTML.jpg)


    Figure 5-20


    AWS region and AZs


    The next concepts are related to the AWS services. These services must be deployed
    to within an AWS region.


    1.  **Elastic Computing Cloud** - EC2.


    This is one of the original and most popular services, allowing companies to run
    virtual computing power. You can think of an `EC2` instance as a virtual machine
    running within a network in the cloud. There are various types of `EC2` instances
    that feature computing power, high memory, and dedicated or spot instances. There
    are many benefits and features that are set up and available within all these
    instances, and they are charged on a per-consumption basis.


    2.  **Elastic Block Store** – EBS


    This service features a block storage as one of the methods that allow `EC2` instances
    to store data. There are various services offering storage solutions. Some services
    are used for large-volume storage, some services are used for persistent storage,
    and other services are used for memory storage. What you should understand from
    this service in relation to deploying our application is that the `EC2` instance
    shown in the exercise uses the SAP HANA XSA image. This image requires the `EBS`
    service. Familiarize yourself with this and other storage services to understand
    features and costs before using AWS for your applications.


    3.  **Simple Storage Service** - S3


    This service is one of the most popular AWS services, and it has a high utilization
    by most cloud customers. A simple storage service is used for object storage such
    as files, code, backups, and images. The `S3` service displays as a folder hierarchy
    from the AWS UI point of view; however, these objects are stored in a flat hierarchy.
    This service offers unlimited storage for customers and there are various types
    of storage depending on the retrieval time required by its consumers. Once again,
    please familiarize yourself with the different `S3` bucket types to decide which
    one is right for you. In this book’s exercises, we will use the `S3` service to
    store and back up our code versioning.


    This book will not go into too much depth related to AWS, `EC2`, `EBS`, or networking;
    however, it needs to present a high-level explanation of these managed services
    for the interest of deploying the custom application into this platform. Should
    you ever require more in-depth knowledge related to AWS, please consult with an
    AWS professional. See Figure [5-21](#502765_1_En_5_Chapter.xhtml#Fig21) to see
    how this setup is visualized at a high level.


    ![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig21_HTML.jpg](images/502765_1_En_5_Chapter/502765_1_En_5_Fig21_HTML.jpg)


    Figure 5-21


    AWS region hosting an `EC2` instance connected to an `EBS`


    For our exercise, we set up the recommended AWS infrastructure as noted in an
    SAP-provided tutorial: [`https://developers.sap.com/tutorials/hxe-xsa-aws-setup.html`](https://developers.sap.com/tutorials/hxe-xsa-aws-setup.html).'
