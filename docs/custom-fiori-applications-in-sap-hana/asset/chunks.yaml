- fmt: "# One Product Brand Analysis\n\nOne product brand I would like to analyze\
    \ is one that builds power tools, construction tools, and tool storage, just to\
    \ mention a few. These tools are of very high quality and they can last for a\
    \ very long time. These tools are the choice of most construction professionals.\
    \ They are on the higher end of products of their industry. When I got married\
    \ over a decade ago, I acquired different types of tools for home improvement\
    \ projects. My first set of tools was great when I started learning how to do\
    \ some of the smaller home projects. As I have gained experience and learned more\
    \ about tool quality, I have noticed that the right tool will get the job done\
    \ correctly. Yes, I could have had a cheaper tool, but it is not the same as using\
    \ the correct tool. I started investing in more of these black and yellow tools.\
    \ The latest toolkit I got was a set of drills and impact drills with a battery\
    \ charger and two batteries. Compared to my older tools and throughout the years,\
    \ the new tools have gotten lighter, they have more power than before, the battery\
    \ life has been improved, and some of different tools can share batteries. In\
    \ my opinion, this company has done extensive UX research, tool design, and a\
    \ vast number of improvements on their tools, resulting in customer satisfaction,\
    \ increasing product adoption, and returning customers; all of this is what most\
    \ companies want to see. All these satisfactory measures resulted in great ROI\
    \ for this company. I do not mind spending a few extra dollars to be able to get\
    \ a good-quality tool. As you can read in this paragraph, there were possible\
    \ personas (construction professionals), customer research as to how customers\
    \ use these tools, and identifying some of the pain points for these users such\
    \ as tool weight, battery life, and compatibility of tool parts between tools.\
    \ All these concepts are part of the design to development and production of a\
    \ product. Such a process is also recommended by SAP; it is known as design thinking\
    \ and it is a proven process that spans throughout the life cycle of creating\
    \ a product. The design thinking process starts in the discovery phase, where\
    \ things are presented and analyzed, and many notes are taken when creating a\
    \ product; the design phase includes various methods of presenting and prototyping\
    \ an idea to see how it will be used and observed by many collaborators in the\
    \ team with the purpose of providing feedback and capture how users will use this\
    \ product: basically all hands on board. Develop is the part in which the people\
    \ create the product, present it to their customer counterpart for feedback, and\
    \ enhance it during several iterations; and finally Deliver, which is the rewarding\
    \ part of the process when the product leaves the team and is put into productive\
    \ use.\n\n## Five Design Principles of Fiori\n\nThe Fiori UX has five design principles\
    \ that must apply to all applications, and they are shown in Figure [1-8](#502765_1_En_1_Chapter.xhtml#Fig8):\n\
    \n![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig8_HTML.jpg](images/502765_1_En_1_Chapter/502765_1_En_1_Fig8_HTML.jpg)\n\
    \n*Figure 1-8*  \n*Five Fiori design principles*\n\n1. Role-based\n2. Coherent\n\
    3. Simple\n4. Responsive\n5. Delightful\n\n**Role-based** is an equally important\
    \ feature as the other ones in the design principle; however, in my opinion it\
    \ is the most important one, as it seems to be the one that most customers really\
    \ ask for. The role-based feature can set control properties to read-only, enable/disable\
    \ visibility, or allow users to be able to provide inputs. Another role-based\
    \ use case of Fiori applications is for users from different departments within\
    \ a company to be able to see different parts of an application; for example,\
    \ Human Resource users will have a different view of the same app than a user\
    \ from Accounting than a user from another department. Further, these roles can\
    \ be compared to roles from Active Directory on non-Fiori applications. When designing\
    \ Fiori applications, you may think of this property as a way to show the same\
    \ application for a user who has read and write access vs. a different user who\
    \ can only read some data and cannot interact with it. If you can imagine read-only\
    \ vs. read and write, then you are thinking about the role-based feature. When\
    \ the Fiori applications are added into the SAP Fiori Launchpad, roles can also\
    \ allow or prevent users from accessing Fiori applications. In this book, we will\
    \ not go into the Launchpad configuration; instead, we will deploy our Fiori application\
    \ into an SAP HANA XSA environment in chapter [5](#502765_1_En_5_Chapter.xhtml).\n\
    \n**Coherent** is the part of the design principle that forces the design of the\
    \ application to make sense in every aspect that it does and how it behaves. In\
    \ old SAP R/3, some transactions required so many input parameters that sometimes\
    \ the user did not understand why the app required them; sometimes, the users\
    \ even needed to click an element to show additional information. Moreover, the\
    \ coherent principle results in additional process improvements when designing\
    \ new software for these business scenarios. This feature can be thought of as\
    \ a wizard or a smart table with default filters shown in the smart filter bar\
    \ or when using the `type` property in a button to show accept (displayed in green),\
    \ reject (displayed in red), or default (default color). Other UI5 controls may\
    \ use the `state` property to show other statuses, such as warnings, enabled,\
    \ or disabled, just to mention a few.\n\n**Simple** is one of my favorite features\
    \ because as developers in the SAP world, some SAP transactions are very complex\
    \ and they require many fields to be provided even if we did not know what those\
    \ fields were supposed to be used for. The simple feature here refers to minimizing\
    \ the number of clicks, keeping the user more productive, and making their process\
    \ as efficient as possible. The maximum number of clicks to be included within\
    \ a process or transaction to allow the user to accomplish a task is supposed\
    \ to be less than three."
  raw: 'One product brand I would like to analyze is one that builds power tools,
    construction tools, and tool storage, just to mention a few. These tools are of
    very high quality and they can last for a very long time. These tools are the
    choice of most construction professionals. They are on the higher end of products
    of their industry. When I got married over a decade ago, I acquired different
    types of tools for home improvement projects. My first set of tools was great
    when I started learning how to do some of the smaller home projects. As I have
    gained experience and learned more about tool quality, I have noticed that the
    right tool will get the job done correctly. Yes, I could have had a cheaper tool,
    but it is not the same as using the correct tool. I started investing in more
    of these black and yellow tools. The latest toolkit I got was a set of drills
    and impact drills with a battery charger and two batteries. Compared to my older
    tools and throughout the years, the new tools have gotten lighter, they have more
    power than before, the battery life has been improved, and some of different tools
    can share batteries. In my opinion, this company has done extensive UX research,
    tool design, and a vast number of improvements on their tools, resulting in customer
    satisfaction, increasing product adoption, and returning customers; all of this
    is what most companies want to see. All these satisfactory measures resulted in
    great ROI for this company. I do not mind spending a few extra dollars to be able
    to get a good-quality tool. As you can read in this paragraph, there were possible
    personas (construction professionals), customer research as to how customers use
    these tools, and identifying some of the pain points for these users such as tool
    weight, battery life, and compatibility of tool parts between tools. All these
    concepts are part of the design to development and production of a product. Such
    a process is also recommended by SAP; it is known as design thinking and it is
    a proven process that spans throughout the life cycle of creating a product. The
    design thinking process starts in the discovery phase, where things are presented
    and analyzed, and many notes are taken when creating a product; the design phase
    includes various methods of presenting and prototyping an idea to see how it will
    be used and observed by many collaborators in the team with the purpose of providing
    feedback and capture how users will use this product: basically all hands on board.
    Develop is the part in which the people create the product, present it to their
    customer counterpart for feedback, and enhance it during several iterations; and
    finally Deliver, which is the rewarding part of the process when the product leaves
    the team and is put into productive use.


    ## Five Design Principles of Fiori


    The Fiori UX has five design principles that must apply to all applications, and
    they are shown in Figure [1-8](#502765_1_En_1_Chapter.xhtml#Fig8):


    ![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig8_HTML.jpg](images/502765_1_En_1_Chapter/502765_1_En_1_Fig8_HTML.jpg)


    Figure 1-8


    Five Fiori design principles


    1.  Role-based


    2.  Coherent


    3.  Simple


    4.  Responsive


    5.  Delightful


    **Role-based** is an equally important feature as the other ones in the design
    principle; however, in my opinion it is the most important one, as it seems to
    be the one that most customers really ask for. The role-based feature can set
    control properties to read-only, enable/disable visibility, or allow users to
    be able to provide inputs. Another role-based use case of Fiori applications is
    for users from different departments within a company to be able to see different
    parts of an application; for example, Human Resource users will have a different
    view of the same app than a user from Accounting than a user from another department.
    Further, these roles can be compared to roles from Active Directory on non-Fiori
    applications. When designing Fiori applications, you may think of this property
    as a way to show the same application for a user who has read and write access
    vs. a different user who can only read some data and cannot interact with it.
    If you can imagine read-only vs. read and write, then you are thinking about the
    role-based feature. When the Fiori applications are added into the SAP Fiori Launchpad,
    roles can also allow or prevent users from accessing Fiori applications. In this
    book, we will not go into the Launchpad configuration; instead, we will deploy
    our Fiori application into an SAP HANA XSA environment in chapter [5](#502765_1_En_5_Chapter.xhtml).


    **Coherent** is the part of the design principle that forces the design of the
    application to make sense in every aspect that it does and how it behaves. In
    old SAP R/3, some transactions required so many input parameters that sometimes
    the user did not understand why the app required them; sometimes, the users even
    needed to click an element to show additional information. Moreover, the coherent
    principle results in additional process improvements when designing new software
    for these business scenarios. This feature can be thought of as a wizard or a
    smart table with default filters shown in the smart filter bar or when using the
    type property in a button to show accept (displayed in green), reject (displayed
    in red), or default (default color). Other UI5 controls may use the state property
    to show other statuses, such as warnings, enabled, or disabled, just to mention
    a few.


    **Simple** is one of my favorite features because as developers in the SAP world,
    some SAP transactions are very complex and they require many fields to be provided
    even if we did not know what those fields were supposed to be used for. The simple
    feature here refers to minimizing the number of clicks, keeping the user more
    productive, and making their process as efficient as possible. The maximum number
    of clicks to be included within a process or transaction to allow the user to
    accomplish a task is supposed to be less than three.'
  trans: "\n# 单一产品品牌分析\n\n我想分析的一个单一产品品牌，是生产电动工具、建筑工具和工具存储设备等产品的品牌。这些工具质量非常高，且使用寿命极长。它们是大多数建筑专业人士的选择，处于其行业产品的高端定位。十多年前我结婚时，为了房屋装修项目购置了各种类型的工具。当我开始学习如何完成一些小型家庭项目时，我的第一套工具表现得非常出色。随着我积累经验并进一步了解工具质量，我意识到，合适的工具才能正确完成工作。是的，我本可以购买更便宜的工具，但那和使用正确工具的效果完全不同。我开始投资更多这种黑黄配色的工具。我最新入手的一套工具是钻头和冲击钻的套装，配有一个电池充电器和两块电池。与我的旧工具相比，历经多年发展，新工具变得更轻、动力更强、电池续航时间得到改善，而且一些不同的工具可以共享电池。在我看来，这家公司开展了广泛的用户体验研究、工具设计以及对工具进行了大量改进，从而实现了客户满意度、提高了产品采用率并获得了回头客；所有这些，都是大多数公司期望看到的。所有这些令人满意的举措，为这家公司带来了巨大的投资回报率。我不介意多花一点钱来获得高质量的工具。正如你在这段文字中所看到的，其中涉及了可能的用户画像（建筑专业人士）、关于客户如何使用工具的客户研究，以及识别这些用户的一些痛点，例如工具重量、电池续航时间以及工具部件之间的兼容性。所有这些概念都是产品从设计到开发和生产过程中的一部分。SAP\
    \ 也推荐了这样一个流程；它被称为设计思维，这是一个经过验证的流程，贯穿于产品创建的整个生命周期。设计思维流程始于发现阶段，在此阶段，各种事物被呈现和分析，并在创建产品时记录大量笔记；设计阶段包括多种呈现创意和制作原型的方法，以观察该创意将如何被使用，并被团队中的许多协作者观察，其目的是提供反馈并捕捉用户将如何使用该产品：基本上是全员参与。开发阶段是人员创建产品，向客户方展示产品以获取反馈，并在多次迭代中进行改进；最后是交付，这是流程中回报丰厚的部分，此时产品离开团队并投入生产使用。\n\
    \n## Fiori 的五项设计原则\n\nFiori 用户体验有五项设计原则，必须应用于所有应用程序，如图 1-8 所示：\n\n![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig8_HTML.jpg](img/502765_1_En_1_Fig8_HTML.jpg)\n\
    \n*图 1-8*  \n*Fiori 的五项设计原则*\n\n1. 基于角色\n2. 一致性\n3. 简洁\n4. 响应式\n5. 愉悦\n\n**基于角色**\
    \ 与设计原则中的其他特性同等重要；然而，在我看来，它是最重要的一个，因为它似乎是大多数客户真正要求的功能。基于角色的特性可以将控件属性设置为只读、启用/禁用可见性，或允许用户提供输入。Fiori\
    \ 应用程序的另一个基于角色的用例是，公司内不同部门的用户能够看到应用程序的不同部分；例如，人力资源部门的用户与财务部门的用户，以及其他部门的用户相比，对同一个应用程序会有不同的视图。此外，这些角色可以与非\
    \ Fiori 应用程序中的 Active Directory 角色进行比较。在设计 Fiori 应用程序时，你可以将此属性视为一种方式，为拥有读写权限的用户与另一个只能读取某些数据而无法交互的用户展示同一个应用程序。如果你能理解只读与读写之间的区别，那么你就在思考基于角色的特性。当\
    \ Fiori 应用程序被添加到 SAP Fiori 启动板中时，角色还可以允许或阻止用户访问 Fiori 应用程序。在本书中，我们不会深入讲解启动板的配置；相反，我们将在第\
    \ 5 章中将我们的 Fiori 应用程序部署到 SAP HANA XSA 环境中。\n\n**一致性** 是设计原则的一部分，它强制要求应用程序的设计在其所做的每一件事以及其行为方式上都合乎逻辑。在旧的\
    \ SAP R/3 中，某些事务需要输入非常多的参数，以至于用户有时不明白为什么应用程序需要它们；有时，用户甚至需要点击一个元素才能显示附加信息。此外，一致性原则在为这些业务场景设计新软件时，会带来额外的流程改进。这个特性可以被想象成一个向导，或者一个带有默认过滤器的智能表格，这些过滤器显示在智能过滤器栏中，或者当在按钮中使用\
    \ `type` 属性来显示接受（显示为绿色）、拒绝（显示为红色）或默认（默认颜色）时。其他 UI5 控件可能使用 `state` 属性来显示其他状态，例如警告、启用或禁用，仅举几例。\n\
    \n**简洁** 是我最喜欢的特性之一，因为作为 SAP 世界中的开发人员，某些 SAP 事务非常复杂，即使我们不知道某些字段的用途，也需要提供大量的字段。这里的简洁特性指的是尽量减少点击次数，让用户保持更高的生产力，并使他们的流程尽可能高效。允许用户完成一项任务时，在一个流程或事务中应包含的最大点击次数应少于三次。\n"
- fmt: '**Responsive** means that traditional software had to be written for different
    platforms; however, SAP Fiori leverages the responsiveness feature of its software
    to be able to write a single code base and be able to adapt this software on different
    screen sizes and devices with little to no additional effort from the technical
    point of view. The responsive feature of Fiori applications immediately reflects
    ROI for companies, as they can develop these applications for the office environment
    or the manufacturing floor at the same time. The very good responsive applications
    will also be able to run in a mobile browser allowing users to be informed about
    their business on the go as shown in Figure [1-2](#502765_1_En_1_Chapter.xhtml#Fig2).
    The `SAP Web IDE` and the `SAP Build` tool have “Device Preview” features where
    you can immediately see how the design will look in different devices.


    **Delightful** means that if the user likes it, chances are they will be coming
    back to do their work or to use their application. It is more likely to be productive
    and keep users happy with good-looking applications, and that is why it is so
    important to include this principle. Customer adoption of software is a very difficult
    task to achieve when designing and developing new software. Users will complain
    and say that the current system works, even if it is inefficient, and they will
    resist change. From prior experience in other platforms where there is too much
    freedom on design and development, it is also more tedious and complex not having
    this part of the framework.


    The five Fiori principles can be visualized from a comparison of the Figures [1-9](#502765_1_En_1_Chapter.xhtml#Fig9)
    and [1-10](#502765_1_En_1_Chapter.xhtml#Fig10). Figure [1-9](#502765_1_En_1_Chapter.xhtml#Fig9)
    showcases the SAP GUI transaction, and Figure [1-10](#502765_1_En_1_Chapter.xhtml#Fig10)
    displays a Fiori application with an Object page and an icon tab bar.


    ![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig10_HTML.jpg](images/502765_1_En_1_Chapter/502765_1_En_1_Fig10_HTML.jpg)


    Figure 1-10


    SAP Fiori standard application


    ![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig9_HTML.jpg](images/502765_1_En_1_Chapter/502765_1_En_1_Fig9_HTML.jpg)


    Figure 1-9


    SAP GUI


    ## Getting Your System Ready for Fiori Applications


    While all the explanations to understand Fiori design, UX, and all the initial
    concepts to create a great product are necessary, your developer side may be wondering
    when to get into the system and start prototyping and developing some of these
    Fiori applications.


    Fiori provides a set of stencils to get you ready for the world of Fiori applications.
    These stencils are found at [`https://experience.sap.com/fiori-design-web/downloads/#top`](https://experience.sap.com/fiori-design-web/downloads/%2523top).
    These stencils contain templates, controls, colors, fonts, icons, and everything
    you will need to get started with your design. There are stencils and programs
    for Mac and Windows-based users. I will not get too deep into the design aspect
    as I am more familiar with the development side of the house. When the design
    is completed, then those mockups and other deliverables from the design team can
    be passed to a developer to start their development.


    There are various tools to develop the Fiori application. Tools such as the `SAP
    Web IDE` (found on SAP Cloud Platform, on premise, or in the Web IDE personal
    edition) shown in Figure [1-11](#502765_1_En_1_Chapter.xhtml#Fig11) and the `Business
    Application Studio` are used for this type of Fiori development.


    ![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig11_HTML.jpg](images/502765_1_En_1_Chapter/502765_1_En_1_Fig11_HTML.jpg)


    Figure 1-11


    SAP Web IDE


    The `Business Application Studio` is the newest tool for Fiori and HANA development
    and is a set of plug-ins for `Visual Studio IDE` (it can also be found on the
    SAP Cloud Platform: look under the `Cloud Foundry Platform` ➤ `Subscriptions`
    ➤ `SAP Business Application Studio` and then click subscribe), and it is shown
    in Figure [1-12](#502765_1_En_1_Chapter.xhtml#Fig12). If you are not able to access
    it, then check that your user has the `Business Application Studio Developer`
    role template.


    ![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig12_HTML.jpg](images/502765_1_En_1_Chapter/502765_1_En_1_Fig12_HTML.jpg)


    Figure 1-12


    SAP Business Application Studio


    There are also some SAP Fiori plug-ins available for SAP Fiori if you decide to
    use `Visual Studio Code IDE`.


    These plug-ins are found in the extensions as shown in Figure [1-13](#502765_1_En_1_Chapter.xhtml#Fig13).


    ![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig13_HTML.jpg](images/502765_1_En_1_Chapter/502765_1_En_1_Fig13_HTML.jpg)


    Figure 1-13


    SAP Fiori plug-in for `Visual Studio Code`


    Since I have introduced the tools for development, now it is important to know
    how to start the development for your custom Fiori application.


    Fiori applications are built on top of the `SAPUI5` JavaScript library. The `SAPUI5`
    JS library is a set of HTML5 controls and CSS3 styles built by SAP for the purpose
    of creating Fiori applications. All SAP consumers with a paid license can get
    access to create these `SAPUI5` / Fiori applications. On the other hand, if you
    are not an SAP customer and would like to build some SAP like Fiori applications
    using UI5, there is an open source version called `OpenUI5`. Some differences
    of these two libraries are highlighted in Table [1-1](#502765_1_En_1_Chapter.xhtml#Tab1).


    Table 1-1


    Comparison between `SAPUI5` and `OpenSAPUI5`


    | | `SAPUI5` | `OpenUI5` |

    | --- | --- | --- |

    | Library type | Available for SAP customers | Open source library |

    | License type | SAP | Apache 2.0 |

    | Runs on | SAP HANA, SAP Cloud Platform or SAP NetWeaver front-end server | Any
    web server |

    | Website | [`https://sapui5.hana.ondemand.com/`](https://sapui5.hana.ondemand.com/)
    | [`https://openui5.org/`](https://openui5.org/) |

    | Application types | SAP front-end server• SAP Fiori apps• SAP Fiori freestyle
    appsSAP HANA eXtended Application Services (XS engine)• Custom Fiori apps | Any
    web application or web component |

    | Developed by | SAP | SAP and open source community |'
  raw: '**Responsive** means that traditional software had to be written for different
    platforms; however, SAP Fiori leverages the responsiveness feature of its software
    to be able to write a single code base and be able to adapt this software on different
    screen sizes and devices with little to no additional effort from the technical
    point of view. The responsive feature of Fiori applications immediately reflects
    ROI for companies, as they can develop these applications for the office environment
    or the manufacturing floor at the same time. The very good responsive applications
    will also be able to run in a mobile browser allowing users to be informed about
    their business on the go as shown in Figure [1-2](#502765_1_En_1_Chapter.xhtml#Fig2).
    The SAP Web IDE and the SAP Build tool have “Device Preview” features where you
    can immediately see how the design will look in different devices.


    **Delightful** means that if the user likes it, chances are they will be coming
    back to do their work or to use their application. It is more likely to be productive
    and keep users happy with good-looking applications, and that is why it is so
    important to include this principle. Customer adoption of software is a very difficult
    task to achieve when designing and developing new software. Users will complain
    and say that the current system works, even if it is inefficient, and they will
    resist change. From prior experience in other platforms where there is too much
    freedom on design and development, it is also more tedious and complex not having
    this part of the framework.


    The five Fiori principles can be visualized from a comparison of the Figures [1-9](#502765_1_En_1_Chapter.xhtml#Fig9)
    and [1-10](#502765_1_En_1_Chapter.xhtml#Fig10). Figure [1-9](#502765_1_En_1_Chapter.xhtml#Fig9)
    showcases the SAP GUI transaction, and Figure [1-10](#502765_1_En_1_Chapter.xhtml#Fig10)
    displays a Fiori application with an Object page and an icon tab bar.


    ![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig10_HTML.jpg](images/502765_1_En_1_Chapter/502765_1_En_1_Fig10_HTML.jpg)


    Figure 1-10


    SAP Fiori standard application


    ![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig9_HTML.jpg](images/502765_1_En_1_Chapter/502765_1_En_1_Fig9_HTML.jpg)


    Figure 1-9


    SAP GUI


    ## Getting Your System Ready for Fiori Applications


    While all the explanations to understand Fiori design, UX, and all the initial
    concepts to create a great product are necessary, your developer side may be wondering
    when to get into the system and start prototyping and developing some of these
    Fiori applications.


    Fiori provides a set of stencils to get you ready for the world of Fiori applications.
    These stencils are found at [`https://experience.sap.com/fiori-design-web/downloads/#top`](https://experience.sap.com/fiori-design-web/downloads/%2523top).
    These stencils contain templates, controls, colors, fonts, icons, and everything
    you will need to get started with your design. There are stencils and programs
    for Mac and Windows-based users. I will not get too deep into the design aspect
    as I am more familiar with the development side of the house. When the design
    is completed, then those mockups and other deliverables from the design team can
    be passed to a developer to start their development.


    There are various tools to develop the Fiori application. Tools such as the SAP
    Web IDE (found on SAP Cloud Platform, on premise, or in the Web IDE personal edition)
    shown in Figure [1-11](#502765_1_En_1_Chapter.xhtml#Fig11) and the Business Application
    Studio are used for this type of Fiori development.


    ![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig11_HTML.jpg](images/502765_1_En_1_Chapter/502765_1_En_1_Fig11_HTML.jpg)


    Figure 1-11


    SAP Web IDE


    The Business Application Studio is the newest tool for Fiori and HANA development
    and is a set of plug-ins for Visual Studio IDE (it can also be found on the SAP
    Cloud Platform: look under the Cloud Foundry Platform ➤ Subscriptions ➤ SAP Business
    Application Studio and then click subscribe), and it is shown in Figure [1-12](#502765_1_En_1_Chapter.xhtml#Fig12).
    If you are not able to access it, then check that your user has the *Business
    Application Studio Developer* role template.


    ![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig12_HTML.jpg](images/502765_1_En_1_Chapter/502765_1_En_1_Fig12_HTML.jpg)


    Figure 1-12


    SAP Business Application Studio


    There are also some SAP Fiori plug-ins available for SAP Fiori if you decide to
    use Visual Studio Code IDE.


    These plug-ins are found in the extensions as shown in Figure [1-13](#502765_1_En_1_Chapter.xhtml#Fig13).


    ![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig13_HTML.jpg](images/502765_1_En_1_Chapter/502765_1_En_1_Fig13_HTML.jpg)


    Figure 1-13


    SAP Fiori plug-in for Visual Studio Code


    Since I have introduced the tools for development, now it is important to know
    how to start the development for your custom Fiori application.


    Fiori applications are built on top of the **SAPUI5** JavaScript library. The
    SAPUI5 JS library is a set of HTML5 controls and CSS3 styles built by SAP for
    the purpose of creating Fiori applications. All SAP consumers with a paid license
    can get access to create these SAPUI5 / Fiori applications. On the other hand,
    if you are not an SAP customer and would like to build some SAP like Fiori applications
    using UI5, there is an open source version called OpenUI5\. Some differences of
    these two libraries are highlighted in Table [1-1](#502765_1_En_1_Chapter.xhtml#Tab1).


    Table 1-1


    Comparison between SAPUI5 and OpenSAPUI5


    |   | SAPUI5 | OpenUI5 |

    | --- | --- | --- |

    | Library type | Available for SAP customers | Open source library |

    | License type | SAP | Apache 2.0 |

    | Runs on | SAP HANA, SAP Cloud Platform or SAP NetWeaver front-end server | Any
    web server |

    | Website | [`https://sapui5.hana.ondemand.com/`](https://sapui5.hana.ondemand.com/)
    | [`https://openui5.org/`](https://openui5.org/) |

    | Application types | SAP front-end server• SAP Fiori apps• SAP Fiori freestyle
    appsSAP HANA eXtended Application Services (XS engine)• Custom Fiori apps | Any
    web application or web component |

    | Developed by | SAP | SAP and open source community |'
  trans: '

    **响应式**指的是传统软件必须针对不同平台进行编写；然而，SAP Fiori 利用了软件的响应式特性，只需编写单一的代码库，就能让软件在不同屏幕尺寸和设备上自适应，且从技术角度来说几乎不需要额外投入。Fiori
    应用的响应式特性能够立即为企业带来投资回报，因为它们可以同时为办公环境或生产车间开发这些应用。出色的响应式应用还能在移动浏览器中运行，让用户随时了解业务情况，如图
    1-2 所示。`SAP Web IDE` 和 `SAP Build` 工具都具备“设备预览”功能，您可以立即看到设计在不同设备上的显示效果。


    **愉悦性**意味着，如果用户喜欢某个应用，他们很可能会再次回来完成工作或使用它。美观的应用更有可能提高生产力，让用户保持愉悦心情，这就是为什么包含这一原则如此重要。在设计新软件时，让用户接受它是非常困难的任务。用户会抱怨，并声称当前系统虽然低效但也能工作，从而抵制变革。从过往在其他平台（设计自由度极高）的经验来看，缺乏这部分框架也会让工作变得更加繁琐和复杂。


    通过对比图 1-9 和图 1-10，可以直观地看到 Fiori 的五大设计原则。图 1-9 展示了一个 SAP GUI 事务，而图 1-10 则展示了一个带有对象页面和图标标签栏的
    Fiori 应用。


    ![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig10_HTML.jpg](img/502765_1_En_1_Fig10_HTML.jpg)


    图 1-10


    SAP Fiori 标准应用


    ![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig9_HTML.jpg](img/502765_1_En_1_Fig9_HTML.jpg)


    图 1-9


    SAP GUI


    ## 为 Fiori 应用准备好您的系统


    虽然理解 Fiori 设计、用户体验以及创建优秀产品的所有初始概念是必要的，但作为开发者的您可能想知道何时才能进入系统，开始原型设计和开发一些 Fiori
    应用。


    Fiori 提供了一套样板文件，助您为 Fiori 应用的世界做好准备。您可以在 [`https://experience.sap.com/fiori-design-web/downloads/#top`](https://experience.sap.com/fiori-design-web/downloads/%2523top)
    找到这些样板文件。这些样板包含了模板、控件、颜色、字体、图标以及您开始设计所需的一切。无论是 Mac 用户还是 Windows 用户，都有相应的样板和程序可用。我不会深入设计方面，因为我更熟悉开发领域。当设计完成后，设计团队的原型图和其他交付成果就可以移交给开发人员，以便他们开始开发。


    有多种工具可用于开发 Fiori 应用。如图 1-11 所示，诸如 `SAP Web IDE`（可在 SAP 云平台、本地部署或 Web IDE 个人版中找到）和
    `Business Application Studio` 等工具，都用于此类 Fiori 开发。


    ![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig11_HTML.jpg](img/502765_1_En_1_Fig11_HTML.jpg)


    图 1-11


    SAP Web IDE


    `Business Application Studio` 是用于 Fiori 和 HANA 开发的最新工具，它是 `Visual Studio IDE`
    的一组插件（也可在 SAP 云平台上找到：位于 `Cloud Foundry 平台` ➤ `订阅` ➤ `SAP Business Application
    Studio` 下，然后点击订阅），如图 1-12 所示。如果您无法访问，请检查您的用户是否具有 `Business Application Studio
    开发者` 角色模板。


    ![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig12_HTML.jpg](img/502765_1_En_1_Fig12_HTML.jpg)


    图 1-12


    SAP Business Application Studio


    如果您决定使用 `Visual Studio Code IDE`，还可以获得一些 SAP Fiori 插件。


    这些插件可以在扩展中找到，如图 1-13 所示。


    ![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig13_HTML.jpg](img/502765_1_En_1_Fig13_HTML.jpg)


    图 1-13


    适用于 `Visual Studio Code` 的 SAP Fiori 插件


    既然我已经介绍了开发工具，那么现在重要的是了解如何开始为您的自定义 Fiori 应用进行开发。


    Fiori 应用构建于 `SAPUI5` JavaScript 库之上。`SAPUI5` JS 库是一套由 SAP 构建的 HTML5 控件和 CSS3 样式，用于创建
    Fiori 应用。所有拥有付费许可证的 SAP 用户都可以访问并创建这些 `SAPUI5` / Fiori 应用。另一方面，如果您不是 SAP 客户，但希望使用
    UI5 构建类似 SAP 的 Fiori 应用，还有一个名为 `OpenUI5` 的开源版本。这两个库的一些差异在表 1-1 中已突出显示。


    表 1-1


    `SAPUI5` 与 `OpenSAPUI5` 对比


    | | `SAPUI5` | `OpenUI5` |

    | --- | --- | --- |

    | 库类型 | 对 SAP 客户可用 | 开源库 |

    | 许可证类型 | SAP | Apache 2.0 |

    | 运行平台 | SAP HANA、SAP 云平台 或 SAP NetWeaver 前端服务器 | 任意 Web 服务器 |

    | 网站 | [`https://sapui5.hana.ondemand.com/`](https://sapui5.hana.ondemand.com/)
    | [`https://openui5.org/`](https://openui5.org/) |

    | 应用类型 | SAP 前端服务器• SAP Fiori 应用• SAP Fiori 自由式应用 SAP HANA 扩展应用服务（XS 引擎）• 自定义
    Fiori 应用 | 任意 Web 应用或 Web 组件 |

    | 开发者 | SAP | SAP 及开源社区 |

