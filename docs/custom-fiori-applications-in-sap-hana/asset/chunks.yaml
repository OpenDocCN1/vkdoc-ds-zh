    \ `switch` 对象添加属性以忽略这些证书错误；尽管如此，在运行回调时，Nightmare JS 框架无法渲染单元测试的下一步。\n\n我尝试过的几种方法包括：在点击“登录”按钮后等待主列表选择器，但由于应用程序渲染存在安全问题，该选择器从未渲染到\
    \ Electron 窗口中。我尝试的下一步是在其他用户代理（如 Firefox 或 Chrome）中打开 Nightmare JS 应用程序，但由于同样的安全问题，用户代理无法工作，代码立即停止执行。我尝试添加开发者工具，以查看是否有其他来自应用程序的错误阻止了框架打开\
    \ Fiori 应用程序。我在 `switches` 语句内部使用了 `openDevTools` 设置，如图 4-10 所示。\n\n![../images/502765_1_En_4_Chapter/502765_1_En_4_Fig9_HTML.jpg](img/502765_1_En_4_Fig9_HTML.jpg)\n\
    \n**图 4-10**\nNightmare JS 的 switches 设置\n\n这个 `switch` 语句成功打开了开发者工具，如图 4-11 所示；然而，开发者工具在应用程序的组件预加载阶段挂起，不幸的是，该练习无法继续使用此框架。这对我以及尝试评估各种框架的其他读者来说都是一个很好的教训。问题就变成了：开发者应该在什么时候继续在当前框架上投入时间，而不是转而评估和实施其他框架？\n\
    \n![../images/502765_1_En_4_Chapter/502765_1_En_4_Fig10_HTML.jpg](img/502765_1_En_4_Fig10_HTML.jpg)\n\
    \n**图 4-11**\nNightmare JS 打开 devTools\n\n鉴于前述 Nightmare JS 的所有问题和设置，现在是时候进入下一个单元测试框架了。该框架拥有大量追随者，并因其久经考验的能力而成为最流行的框架之一。此外，该框架之所以获得认可，是因为它提供了许多大多数开发者在手动测试自定义\
    \ Fiori 应用程序开发时已经熟悉的功能。\n"
- fmt: "# Puppeteer\n\n`Puppeteer` is a great JavaScript framework developed by Google,\
    \ and it is one of the best testing frameworks available now. `Puppeteer` uses\
    \ `Node.js` as its JavaScript language and can be used to automate unit testing\
    \ in our Fiori application and any other web application. Developers exploring\
    \ this tool also need to be aware of the DOM selectors, and the common browser\
    \ developer tools offered by the Google Chrome browser. The main feature of this\
    \ framework is that it provides an API to control the DevTools Protocol. Look\
    \ at Figure [4-12](#502765_1_En_4_Chapter.xhtml#Fig11) to see the different levels\
    \ of how your `Node.js` script interacts with the `Puppeteer` API as it then interacts\
    \ with the Chrome Developer Protocol (`CDP`) and the headless Chrome process.\n\
    \n![../images/502765_1_En_4_Chapter/502765_1_En_4_Fig11_HTML.jpg](images/502765_1_En_4_Chapter/502765_1_En_4_Fig11_HTML.jpg)\n\
    \n**Figure 4-12** Puppeteer architecture\n\n## Headless vs. Headful\n\nYou may\
    \ wonder what it means to have a headless browser. It means that the script can\
    \ be automated in such a way as to not have to open the browser window. Using\
    \ the `CDP`, the `Puppeteer` API can simulate everything the browser has without\
    \ the need to open it. Sometimes, it is needed to use a headful browser (using\
    \ a window) to see the automated interaction between the script and the browser\
    \ itself. Additionally, the headful `Puppeteer` process can attach the browser\
    \ developer tools so that the user can interact and update values at runtime.\n\
    \nThe DevTools Protocol page describes itself as follows: *“Developers can use\
    \ this DevTools Protocol to inspect, interact, debug and profile Chromium, Chrome,\
    \ and other Blink-based browsers.”*\n\nEarlier in this chapter, we referenced\
    \ unit testing as well, the different personas validating the development, and\
    \ some of the tools involved to accomplish these tasks. Most web developers are\
    \ familiar with the browser tools that come up when they hit the `F12` tool. Some\
    \ developers have been using this tool for a while and only focus on some of the\
    \ functionality to debug their code – to see when their files are being loaded\
    \ during certain network requests – and some also use the browser to capture screenshots\
    \ when their development is completed and validated. Capturing screenshots is\
    \ sometimes required by certain processes to show that the development took place,\
    \ that it was validated, and to reference how a program’s code worked before and\
    \ after code changes. There are other tabs within the developer tools that have\
    \ additional functionality but which developers normally do not get into or that\
    \ they have not had the opportunity to explore yet. With `Puppeteer`, these tools,\
    \ their features, and their functionality are available to be interacted with\
    \ programmatically.\n\n## Installing Puppeteer\n\nInstalling `Puppeteer` requires\
    \ the `npm` command shown in Figure [4-13](#502765_1_En_4_Chapter.xhtml#Fig12).\n\
    \n![../images/502765_1_En_4_Chapter/502765_1_En_4_Fig12_HTML.jpg](images/502765_1_En_4_Chapter/502765_1_En_4_Fig12_HTML.jpg)\n\
    \n**Figure 4-13** Installing `Puppeteer` API using `npm`\n\nOnce installed, a\
    \ `node` script looks like Figure [4-14](#502765_1_En_4_Chapter.xhtml#Fig13).\
    \ This script will be used to showcase the use of `Puppeteer` with the custom\
    \ Fiori sample application. Notice that this `Puppeteer` script was developed\
    \ as an independent program from the custom Fiori application, and the book is\
    \ showcasing the Visual Studio Code editor to develop it. This script is shown\
    \ in Figure [4-14](#502765_1_En_4_Chapter.xhtml#Fig13).\n\n![../images/502765_1_En_4_Chapter/502765_1_En_4_Fig13_HTML.jpg](images/502765_1_En_4_Chapter/502765_1_En_4_Fig13_HTML.jpg)\n\
    \n**Figure 4-14** Sample `Puppeteer` script\n\nYou might wonder why the book is\
    \ using Visual Studio Code. It is because this is a free editor tool that has\
    \ excellent features when developing and working with `Node.js` and other programming\
    \ languages by enabling their corresponding extensions.\n\nMoreover, I am pleased\
    \ to announce how easy it is to work with the `Puppeteer` framework. It was much\
    \ easier than working with the other frameworks presented in this chapter. There\
    \ is a great amount of documentation on the `Puppeteer` site, which is found at\
    \ the following URL: [`https://devdocs.io/puppeteer/`](https://devdocs.io/puppeteer/)\
    \ as well as in other sources investigated during the writing of the book such\
    \ as YouTube videos and Google searches, just to mention a few.\n\n## Exploring\
    \ the Puppeteer Script\n\nNow, let us explore what this preceding script has and\
    \ what it does.\n\n![../images/502765_1_En_4_Chapter/502765_1_En_4_Fig14_HTML.jpg](images/502765_1_En_4_Chapter/502765_1_En_4_Fig14_HTML.jpg)\n\
    \n**Figure 4-15** Headful `Puppeteer` script launching the Fiori application\n\
    \n1.  **Line 1** loads the `Puppeteer` Node.js library (after it was installed)\n\
    \n2.  **Lines 3–5** are for the application configuration. For the simplicity\
    \ of the exercise it is included in the same script; however, it can be refactored\
    \ or read from a different file\n\n3.  **Line 9 and below** contain the main function\
    \ that it is being unit tested against\n    1.  Notice the framework uses asynchronous\
    \ programming from the entry point of view; therefore, you will also notice the\
    \ `await` keyword on the following lines of code.\n\n4.  **Line 10** initializes\
    \ a new instance of the `Puppeteer` framework and launches it using a few default\
    \ settings, such as launching it head**ful** (`headless: false`), ignoring the\
    \ HTTPS errors (due to a missing certificate).\n\n5.  Since our custom Fiori application\
    \ has route authentication enabled, the exercise starts by opening the homepage\
    \ of the application and it must authenticate to open the application itself,\
    \ as shown in Figure [4-15](#502765_1_En_4_Chapter.xhtml#Fig14).\n\n6.  The `headless:\
    \ false` flag is used to visualize the application in action, as shown in Figure\
    \ [4-15](#502765_1_En_4_Chapter.xhtml#Fig14). Notice within the browser window\
    \ that opened, right before the address bar, there is a message that reads *“Chrome\
    \ is being controlled by automated test software”*, which means it is truly running\
    \ from our script.\n\nRight after the script opens the headful browser, types\
    \ the username and password, and clicks the Log On button, the application itself\
    \ redirects to the custom Fiori application, as seen in Figure [4-16](#502765_1_En_4_Chapter.xhtml#Fig15).\n\
    \n![../images/502765_1_En_4_Chapter/502765_1_En_4_Fig15_HTML.jpg](images/502765_1_En_4_Chapter/502765_1_En_4_Fig15_HTML.jpg)\n\
    \n**Figure 4-16** Fiori application opened by the `Puppeteer` script after authentication\n\
    \n## Validating the Master List Control\n\nThe next unit test to validate within\
    \ the `Puppeteer` script is to make sure that the master list control has a list\
    \ of devices. Make sure you know the selector identifier for the list control.\
    \ In this case, the selector is `#__xmlview1--masterList-listUl`. The selector\
    \ was identified as the ID given by the SAPUI5 framework. The `Puppeteer` function\
    \ `waitForSelector` is used to provide the selector we identified in our `appSettings.masterListSelector`,\
    \ and it was passed to the function. Inside the callback function, we simply displayed\
    \ the resulting element into the console to make sure the item existed. If you\
    \ are curious about what other properties exist inside the callback, set a breakpoint\
    \ inside the script before invoking the `waitForSelector` function and inside\
    \ the `then` callback to inspect these objects. Look at Figure [4-17](#502765_1_En_4_Chapter.xhtml#Fig16)\
    \ to learn more about the implementation to wait for the selector and then running\
    \ an investigation of it.\n\n![../images/502765_1_En_4_Chapter/502765_1_En_4_Fig16_HTML.jpg](images/502765_1_En_4_Chapter/502765_1_En_4_Fig16_HTML.jpg)\n\
    \n**Figure 4-17** `Puppeteer` script waiting for selector"
