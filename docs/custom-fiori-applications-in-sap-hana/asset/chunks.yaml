    ## OData 与 JSON 模型


    如前所述，OData 协议支持从后端系统快速检索数据，后端系统将端点暴露为实体。OData 模型的所有交互均在客户端（浏览器或应用程序）与暴露这些端点的服务器之间进行。在某些用例中，开发者可能需要模拟一些数据、更新数据并将其反映到屏幕上，而无需将其发送到后端服务器。在这种情况下，开发者可以使用一种称为
    JSON 模型的不同模型。JSON 模型是一种客户端模型，支持从应用程序操作数据，且不一定需要将数据发送回服务器。需要客户端数据模拟的场景非常适合此类用例。


    从 SAPUI5 控件的角度来看，控件使用 OData 模型还是 JSON 模型并无区别。SAPUI5 应用程序同时支持 JSON 和 OData 模型。当存在多个模型时，唯一的区别在于绑定到控件或聚合时需要指定命名模型。


    命名模型是指具有特定名称（而非默认的空字符串）的模型。命名模型在 SAPUI5 应用程序的清单文件中指定，然后在 SAP Fiori 应用程序的 XML 视图中进行引用。


    接下来，我们将创建一个 OData 服务来演示 OData 服务的设置过程。此示例在运行于 XS Advance HANA 2 SPS04 的 SAP HANA
    Express Edition 环境中完成。本书假设开发者已经可以访问此类系统，无论是本地环境还是云实例。SAP HANA XSA API 的设置过程也可以在我著的另一本书《*Microservices
    in SAP HANA XSA*》（Apress，2020）中查阅。


    假设您已在 HANA XSA 中创建了一个应用程序，并创建了一个名为 `shockwaveSvc.xsodata` 的 OData 服务。按照前述步骤先查看元数据和暴露的端点，我们先来看一下这个
    OData 服务的元数据和定义，如图 2-12 所示。


    ![../images/502765_1_En_2_Chapter/502765_1_En_2_Fig12_HTML.jpg](img/502765_1_En_2_Fig12_HTML.jpg)


    **图 2-12** OData 服务定义


    目前，有一个名为 `DEVICE` 的端点暴露在 `shockwaveSvc.xsodata` 服务中，如图 2-13 所示。


    请注意，一个 XSA OData 服务可以定义为一个单独的 XSOData 服务，或者一个 SAP HANA XS OData 服务也可以包含多个实体。在此服务中，我们有一个名为
    `wavex20.wavedb.data::tbls.DEVICE` 的实体。此实体表示我的 `wavex20` MTA（**多**目标**应用**程序）项目中
    `wavedb` 数据库模块内的一个 CDS HANA 表，名为 `tbls.DEVICE`。


    默认情况下，XSOData 服务接受所有 CRUD（创建、读取、更新和删除）操作；但是，我添加了一行代码来禁止从此端点删除记录。我们将在下一章中详细探讨禁止命令。


    ![../images/502765_1_En_2_Chapter/502765_1_En_2_Fig13_HTML.jpg](img/502765_1_En_2_Fig13_HTML.jpg)


    **图 2-13** XS OData 服务


    创建 XSOData 服务后，在 HTML5 模块的 `xs-app.json` 文件中设置路由并激活服务，然后我们就可以从浏览器（或 POSTMAN REST
    客户端）导航到该服务。


    图 2-14 展示了来自 Chrome 浏览器的 GET 请求。


    ![../images/502765_1_En_2_Chapter/502765_1_En_2_Fig14_HTML.jpg](img/502765_1_En_2_Fig14_HTML.jpg)


    **图 2-14** OData GET 请求


    在这个示例请求中，我们可以观察到更多细节：


    1.  `DEVICE` 端点将 `ID` 属性作为 `key`。

    2.  `key` 属性也用于导航到单个条目。

    3.  元数据操作中显示了每个记录的属性，并且数据类型也正确显示。


    同一端点的表定义如图 2-15 所示。


    ![../images/502765_1_En_2_Chapter/502765_1_En_2_Fig15_HTML.jpg](img/502765_1_En_2_Fig15_HTML.jpg)


    **图 2-15** SAP HANA CDS 表


    在 SAPUI5 应用程序中，可以将 OData 服务设置为一个（命名）模型。要设置 OData 模型，我们需要在 `manifest.json` 文件中进行配置。


    `manifest.json` 文件（如图 2-16 所示）是应用程序配置文件，它包含了创建 SAP Fiori 应用程序、配置 OData 服务以及所有其他应用程序配置所需的信息。此文件存在于
    MTA 应用程序的 HTML5 模块中。


    ![../images/502765_1_En_2_Chapter/502765_1_En_2_Fig16_HTML.jpg](img/502765_1_En_2_Fig16_HTML.jpg)


    **图 2-16** `manifest.json` 文件


    清单文件分为三个部分：


    1.  `sap.app` 部分包含关于 UI5 版本、依赖项和数据源的信息。

    2.  `sap.ui` 部分包含关于用户界面和设置的信息，包括哪些设备类型可以显示它。

    3.  `sap.ui5` 部分包含关于 SAPUI5 应用程序、其视图以及其他属性的详细信息。


    要设置命名模型，您必须在 `sap.app` 部分中包含数据源，并指定此 OData 服务所在的 URL。这里可以设置几种场景：


    1.  在 SAP HANA XSA 应用程序中，如果 OData 服务位于同一项目的模块内，则可以通过相对路径引用该 OData 服务。

    2.  在运行于前端服务器（NetWeaver 前端和 ABAP 后端）的 SAP Fiori 应用程序中，只要应用程序和 OData 服务位于同一域/主机中，我们也可以引用
    OData 服务的相对路径。如果 Fiori 应用程序部署到 SAP Cloud Platform 的 `neo-app.json` 文件中，则同样适用此概念。

    3.  如果所需的 OData 服务存在于我们的域/环境之外，则必须包含该 OData 服务的完整 URL，就像我们在上一节示例中使用的 Northwind
    OData 服务一样。


    一旦 OData 服务被包含在清单文件中，我们就可以从 `sap.ui5/models` 部分使用正确的名称将其引用为命名模型，如图 2-16 所示。另请注意，我们还有一个名为
    `i18n` 的命名模型；当需要国际化时，大多数 UI5 应用程序中都会使用此模型。


    在第 3 章中，我们将深入探讨命名模型及其在 SAPUI5 Fiori 应用程序中的工作方式；不过，作为快速参考，用户界面绑定到命名模型的方式如图 2-17
    中的代码片段所示。


    该示例使用 SAPUI5 列表控件来显示 `DEVICE` 记录的列表，列表中的项绑定到命名模型 `shockwave>` 和 `DEVICE` 端点。每个项都是一个标准列表项控件，其标题绑定到命名模型
    `shockwave>`，并使用模型的 `SERIAL_NUMBER` 和 `DESCRIPTION` 属性。


    ![../images/502765_1_En_2_Chapter/502765_1_En_2_Fig17_HTML.jpg](img/502765_1_En_2_Fig17_HTML.jpg)


    **图 2-17** SAPUI5 列表控件


    当命名模型在 SAPUI5 应用程序中使用时，我们可以通过浏览器开发者工具（F12）并点击网络选项卡，从浏览器中查看 OData 请求。

