    # 基于 OData 驱动的设计方法


    至此，我们已经讨论了在有数据可用时使用 OData 服务，以及在没有直接数据源时模拟数据的方法。但我们也可以从 OData 元数据文件中生成数据。我们还从
    REST API 微服务中消费了数据。那么，让我们的 SAP Fiori 应用程序提供一种数据驱动的解决方案，从而能够几乎不费力气地创建这些企业应用程序，是不是也很有意义呢？


    **智能控件** 是 SAPUI5 SDK（软件开发工具包）中的控件模板，它们提供了此类特性和行为。这些模板使用能够理解元数据的元数据 XML 文件和注解，并将这些
    XML 注解和元数据转换为实际的 SAPUI5 应用程序和 Fiori 元素。


    注解是附加属性，它们为 OData 端点中的属性赋予了语义含义。赋予数据额外含义的唯一目的是丰富数据本身的含义；例如，为真正代表货币金额的十进制数字添加货币符号，或者以全大写等不同格式显示标签。SAP
    HANA CDS 中的注解所包含的注解类型集，与 SAP ABAP CDS 中的相比是有限的。`HANA CDS`和`ABAP CDS`在源于同一种脚本语言这点上非常相似；然而，它们又非常不同，因为并非所有注解类型都适用于这两种技术。


    那么，何时应该构建这类应用程序（使用元数据和注解，而非实际的 XML 和 JavaScript）？如果要遵循此路径，需要考虑一些设计指南。如果应用程序的开发非常标准化，需要设计一致性，并且不需要太多定制，那么建议按照这些预定义模板来创建应用程序。当您开始设计阶段，并注意到应用程序需要进行一些定制时，那么正在构建的应用程序可能不适合采用智能模板开发。请记住，这类开发有一个强制要求，即必须使用
    OData 服务，并且要构建的应用程序必须遵循第 1 章中讨论的 Fiori 元素之一（列表报表、工作清单、概览页面）。


    现在，让我们使用现有的 OData 服务来构建一个概览页面。如第 1 章所述，概览页面是对系统的快速浏览，目的是让用户快速了解数据（在本例中是设备）的概况，而无需深入每个特定的应用程序或磁贴来查找详细信息。


    在由`DEVICES`表示的数据集中，我们还有一个包含设备指标的表。这里捕获的指标是温度和记录日期。这些数据仅用于练习。我将首先构建额外的数据模型，以表示我们想在概览页面中展示的数据。在概览页面中，我们显示设备的平均温度；在另一部分中，我们按降序显示设备的成本。通过查看概览页面的示例，我们需要构建名为**卡片**的部分。


    卡片代表概览页面内的一小段数据，它们包含一个标题区域（我们可以在其中设置标题），以及一个内容区域，用于表示表格、图表、图形或其他文本。有几种不同类型的卡片：分析型（包含标题和度量）、列表、柱状图、表格和快速查看（类似于表单的信息内容）。


    我们首先在数据库中设计数据模型，并将其添加到 OData 服务中，以便应用程序将它们作为概览页面中的卡片使用。图 2-24 展示了使用`DEVICE`和`DEVICE_METRICS`表、`CV_DEVICES`和`CV_AVG_TEMP_DEVICES`计算视图以及
    OData 服务中额外端点的高级数据架构。


    ![../images/502765_1_En_2_Chapter/502765_1_En_2_Fig24_HTML.jpg](img/502765_1_En_2_Fig24_HTML.jpg)


    图 2-24 AvgTmpDevices 的数据架构


    在 OData 服务中，它看起来如图 2-25 所示。


    ![../images/502765_1_En_2_Chapter/502765_1_En_2_Fig25_HTML.jpg](img/502765_1_En_2_Fig25_HTML.jpg)


