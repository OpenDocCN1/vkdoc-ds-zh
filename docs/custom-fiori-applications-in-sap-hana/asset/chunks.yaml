- fmt: '花点时间打开 SAP Web IDE，分析一些 XML 视图，以理解 MVC 模式并了解它在 SAPUI5 中的应用方式。我们将从分析一个在 SAP
    HANA XSA express edition（HANA 2 XSA SPS04）上构建的应用开始。该应用展示了一个主-从（master-detail）模板方法。这个
    Fiori 应用使用了多个视图。该视图包含多个 UI5 控件。


    主列表包含来自第 [2](#502765_1_En_2_Chapter.xhtml) 章介绍的 XSOData 服务的 `Devices` 列表。`Master`
    视图有一个 `List` 控件，每个列表项都绑定到 `items` 聚合。此视图中可能发生多个事件。此主列表示例如图 [3-4](#502765_1_En_3_Chapter.xhtml#Fig4)
    所示。


    ![../images/502765_1_En_3_Chapter/502765_1_En_3_Fig4_HTML.jpg](images/502765_1_En_3_Chapter/502765_1_En_3_Fig4_HTML.jpg)


    **图 3-4** 主-从应用


    1.  在绑定项目之前（例如，如果需要在显示到用户界面之前格式化项目）

    2.  点击某个项目（用于导航或显示其在 `Detail` 视图中的详细信息）

    3.  在列表中进行搜索（以缩小显示的列表范围）


    生成上述主-从模板 UI 的代码如图 [3-5](#502765_1_En_3_Chapter.xhtml#Fig5) 所示。


    ![../images/502765_1_En_3_Chapter/502765_1_En_3_Fig5_HTML.jpg](images/502765_1_En_3_Chapter/502765_1_En_3_Fig5_HTML.jpg)


    **图 3-5** 显示主-从模板的 XML 视图


    请注意，随着应用包含更多功能，上述 `Home` 视图可能会变得过于繁杂和复杂，以至于任何开发者都难以理解。在图 [3-6](#502765_1_En_3_Chapter.xhtml#Fig6)
    中，练习展示了将 `Master` 视图页面重构到其自己的视图后的同一个应用，以显示更清晰的视图设置——当视图或控制器在应用开发过程中开始变得杂乱或过于繁忙时，重构是一种常见的做法。经验丰富的开发者可以轻松地在应用的不同文件/模块的重构和初始软件设计方面提供帮助。


    ![../images/502765_1_En_3_Chapter/502765_1_En_3_Fig6_HTML.jpg](images/502765_1_En_3_Chapter/502765_1_En_3_Fig6_HTML.jpg)


    **图 3-6** `MasterList` XML 视图引用


    现在，`MasterList` 视图定义位于 `View` 文件夹中，如图 [3-7](#502765_1_En_3_Chapter.xhtml#Fig7)
    所示。要生成新视图，请右键单击 `View` 文件夹，选择 `New`，`File`，并提供文件名以及文件内容（您需要将 `Home` 视图中的视图声明复制到新创建的视图中）。另一种方法是使用
    SAP Web IDE 提供的“New SAPUI5 view”选项，在各自的文件夹中创建视图和控制器文件。


    ![../images/502765_1_En_3_Chapter/502765_1_En_3_Fig7_HTML.jpg](images/502765_1_En_3_Chapter/502765_1_En_3_Fig7_HTML.jpg)


    **图 3-7** 显示 `View` 文件夹的项目


    `MasterList` 视图定义看起来与之前在 `Home` 视图中的完全相同。对 Home 控制器的引用保持不变，因为这是一个相当小的示例，如有需要，开发者可以在
    `Controller` 文件夹中添加一个新的控制器文件，并进一步将视图引用更新到所需的控制器文件位置。此功能（新视图和新控制器）将在后面的 `Detail`
    视图示例中展示。


    `Detail` 视图可以包含任何控件、表单、选项卡栏或图表，以显示所选项目的详细数据。在此视图中，开发者可以观察到选项卡（选项卡栏控件）使用 `items`
    聚合，并且可以触发诸如选择项目之类的事件。当使用这些控件时，诸如包含过滤器之类的情况会很有帮助。`Detail` 视图（重构后）如图 [3-8](#502765_1_En_3_Chapter.xhtml#Fig8)
    所示。


    ![../images/502765_1_En_3_Chapter/502765_1_En_3_Fig8_HTML.jpg](images/502765_1_En_3_Chapter/502765_1_En_3_Fig8_HTML.jpg)


    **图 3-8** `Detail` 视图


    并且这个（嵌套的）`Detail` 视图也在 `Home` 视图中被引用，如图 [3-9](#502765_1_En_3_Chapter.xhtml#Fig9)
    所示。


    ![../images/502765_1_En_3_Chapter/502765_1_En_3_Fig9_HTML.jpg](images/502765_1_En_3_Chapter/502765_1_En_3_Fig9_HTML.jpg)


    **图 3-9** 重构后的 `Detail` 视图引用


    这是一个很好的练习，既展示了重构，也向开发者表明，在开发周期中，可以继续向 Fiori 应用添加内容的同时进行重构。您可能已经注意到，`Detail` 视图引用的是
    Detail 控制器而不是 Home 控制器，如图 [3-8](#502765_1_En_3_Chapter.xhtml#Fig8) 的第 2 行所示。此外，Detail
    控制器位于 `Controller` 文件夹中，如图 [3-10](#502765_1_En_3_Chapter.xhtml#Fig10) 所示。


    ![../images/502765_1_En_3_Chapter/502765_1_En_3_Fig10_HTML.jpg](images/502765_1_En_3_Chapter/502765_1_En_3_Fig10_HTML.jpg)


    **图 3-10** Detail 控制器


    此外，MVC 的另一个好处是它的组件是松散耦合的，可以在应用的多个部分中重用。假设我们有额外的选项卡，并且在这些选项卡中，应用需要在多个选项卡之间显示相同的控件。您可能会想，应用能否将（UI5）控件从
    `Detail` 视图解耦到一个单独的视图中，然后将包含该控件的视图嵌入到 `Detail` 视图中。是的，可以。


    在重构我们想要拆分为其自己视图的控件之前，本书将描述 SAPUI5 库的一个特性，称为 `Fragment`。正如您在之前的段落中看到的，本书展示了各个视图，并且每个视图可能包含一个同名的控制器。请参阅图
    [3-10](#502765_1_En_3_Chapter.xhtml#Fig10) 以查看相应文件夹中的视图/控制器。在开发这些应用时，开发者应该知道，大多数情况下，每个视图文件都包含一个对应的控制器文件。Fragments
    的行为类似于视图；但是，它们不包含控制器文件。相反，它们被嵌入到视图中，并且在这些 fragments 中引用的任何事件都可以从视图的控制器中执行。


    在图 [3-11](#502765_1_En_3_Chapter.xhtml#Fig11) 中，您可以看到我们有一个响应式表格控件。该表格控件将在从主列表中选择一个设备后，在
    Activity 选项卡下显示该设备的活动。此外，此表格还将在下一个选项卡中用于显示设备的不活动状态。为了避免引入重复的代码，本练习将重构这段包含响应式表格的
    XML 代码片段，并将其重构为一个 XML fragment。


    ![../images/502765_1_En_3_Chapter/502765_1_En_3_Fig11_HTML.jpg](images/502765_1_En_3_Chapter/502765_1_En_3_Fig11_HTML.jpg)


    **图 3-11** 使用 fragment 之前的 `Detail` 视图代码


    在图 [3-12](#502765_1_En_3_Chapter.xhtml#Fig12) 中，您可以再次看到 `Detail` 视图中重构后、干净的代码片段。使用
    fragment 时，开发者必须确保 fragment 包含独特的概念，并且应为 fragment 提供一个名称，以便稍后从 JavaScript 控制器中轻松访问。


    ![../images/502765_1_En_3_Chapter/502765_1_En_3_Fig12_HTML.jpg](images/502765_1_En_3_Chapter/502765_1_En_3_Fig12_HTML.jpg)


    **图 3-12** 创建 fragment 后的 `Detail` 视图代码


    如果您好奇 fragment 代码的定义，可以查看图 [3-13](#502765_1_En_3_Chapter.xhtml#Fig13)，以了解将代码从视图中剪切并移动到
    fragment 中以实现重用是多么容易。


    ![../images/502765_1_En_3_Chapter/502765_1_En_3_Fig13_HTML.jpg](images/502765_1_En_3_Chapter/502765_1_En_3_Fig13_HTML.jpg)


    **图 3-13** Fragment 定义'
  raw: 'Take a moment to open the SAP Web IDE and analyze some of the XML views to
    understand the MVC pattern and see how it applies when using SAPUI5\. We will
    start by analyzing an application built in SAP HANA XSA express edition – HANA
    2 XSA SPS04\. This application showcases a master detail template approach. There
    are several views used within this Fiori application. The view contains several
    UI5 controls.


    The master list contains a list of ***Devices*** from our XSOData service presented
    in Chapter [2](#502765_1_En_2_Chapter.xhtml). The **Master** view has a ***List***
    control, and each of the list items is bound to the *items* aggregation. There
    are several events that can occur in this view. This master list can be seen in
    Figure [3-4](#502765_1_En_3_Chapter.xhtml#Fig4).


    ![../images/502765_1_En_3_Chapter/502765_1_En_3_Fig4_HTML.jpg](images/502765_1_En_3_Chapter/502765_1_En_3_Fig4_HTML.jpg)


    Figure 3-4


    Master detail app


    1.  Before binding the items (such is the case if the items need to be formatted
    before displaying them to the user interface)


    2.  Pressing on an item (for navigation or to display its details in the **Detail**
    view)


    3.  Searching on the list (to narrow down the displayed list)


    The code to generate the preceding master detail template UI is shown in Figure
    [3-5](#502765_1_En_3_Chapter.xhtml#Fig5).


    ![../images/502765_1_En_3_Chapter/502765_1_En_3_Fig5_HTML.jpg](images/502765_1_En_3_Chapter/502765_1_En_3_Fig5_HTML.jpg)


    Figure 3-5


    XML view showing master detail template


    Notice that as more features are included into the application, the preceding
    **Home** view can get to be too busy and complex for any developer to understand.
    In Figure [3-6](#502765_1_En_3_Chapter.xhtml#Fig6), the exercise shows the same
    application after refactoring the **Master** view page into its own view to show
    a cleaner setup of the view – refactoring is a normal practice during development
    when views or controllers start to get polluted or too busy during the application
    development. More experienced developers can easily help with refactoring and
    with the initial software design of the different files/modules of the application.


    ![../images/502765_1_En_3_Chapter/502765_1_En_3_Fig6_HTML.jpg](images/502765_1_En_3_Chapter/502765_1_En_3_Fig6_HTML.jpg)


    Figure 3-6


    **MasterList** XML view reference


    And the **MasterList** view definition is now located in the **View** folder,
    as shown in Figure [3-7](#502765_1_En_3_Chapter.xhtml#Fig7). To generate the new
    view, right-click the **View** folder, select New, File, and provide the file
    name as well as the file content (you will need to copy the view declaration from
    the **Home** view into the newly created view). An alternative would be to use
    the provided “New SAPUI5 view” option from the SAP Web IDE to create the view
    and controller files into their respective folders.


    ![../images/502765_1_En_3_Chapter/502765_1_En_3_Fig7_HTML.jpg](images/502765_1_En_3_Chapter/502765_1_En_3_Fig7_HTML.jpg)


    Figure 3-7


    Project showing the **View** folder


    The **MasterList** view definition looks exactly as it did in the **Home** view
    before. The controller reference to the Home controller was kept as it was since
    this was a rather small example, and if required, the developer can add a new
    controller file inside the **Controller** folder and further update the view reference
    to the desired controller file location. This feature (new view and new controller)
    is shown in the **Detail** view example further in the following.


    The **Detail** view may contain any control, form, item tab bar, or charts to
    display the selected item’s detailed data. In this view, developers can observe
    that the tabs (item tab bar control) use the items aggregation and that there
    are events that can be triggered such as selecting an item. Situations such as
    including a filter can be helpful when these controls are used. The **Detail**
    view is shown in Figure [3-8](#502765_1_En_3_Chapter.xhtml#Fig8) (after being
    refactored).


    ![../images/502765_1_En_3_Chapter/502765_1_En_3_Fig8_HTML.jpg](images/502765_1_En_3_Chapter/502765_1_En_3_Fig8_HTML.jpg)


    Figure 3-8


    **Detail** view


    And this (nested) **Detail** view is also referenced in the **Home** view, as
    shown in Figure [3-9](#502765_1_En_3_Chapter.xhtml#Fig9).


    ![../images/502765_1_En_3_Chapter/502765_1_En_3_Fig9_HTML.jpg](images/502765_1_En_3_Chapter/502765_1_En_3_Fig9_HTML.jpg)


    Figure 3-9


    **Detail** view reference after refactoring


    This is a great exercise to show case refactoring as well as to show developers
    that during development cycles, one can continue to refactor as one continues
    adding content to Fiori applications. You probably noticed that the **Detail**
    view is referencing the Detail controller and not the Home controller, as shown
    in line 2 of Figure [3-8](#502765_1_En_3_Chapter.xhtml#Fig8). Moreover, the Detail
    controller lives inside the **Controller** folder, as shown in Figure [3-10](#502765_1_En_3_Chapter.xhtml#Fig10).


    ![../images/502765_1_En_3_Chapter/502765_1_En_3_Fig10_HTML.jpg](images/502765_1_En_3_Chapter/502765_1_En_3_Fig10_HTML.jpg)


    Figure 3-10


    Detail controller


    Furthermore, an additional benefit of MVC is that its components are loosely coupled,
    and they can be reused in several parts of the application. Imagine that we have
    additional tabs, and within these tabs, the application requires to display the
    same control across tabs. You may wonder if the application could decouple the
    (UI5) control from the **Detail** view into a separate view and then embed the
    view that contains such a control inside the **Detail** view. Yes, it can.


    Before refactoring the control that we want to split into its own view, the book
    will describe one feature of the SAPUI5 library, known as **Fragment**. As you
    have seen in the previous paragraphs, the book showed the views and each view
    may contain a controller with the same name. See Figure [3-10](#502765_1_En_3_Chapter.xhtml#Fig10)
    to observe the view/controller in their corresponding folders. When developing
    these applications, developers should know that most times, each view file contains
    a corresponding controller file. Fragments behave like views; however, they do
    not contain a controller file. Instead, they are embedded within views and any
    events referenced within these fragments can be executed from the view’s controller.


    In Figure [3-11](#502765_1_En_3_Chapter.xhtml#Fig11), you can observe that we
    have a responsive table control. This table control will display the activity
    for the devices under the Activity tab upon selection of a device from the master
    list. Furthermore, this table will also be used in the next tab to show inactivity
    of the devices. Instead of introducing repeated code, the exercise will refactor
    this snippet of XML code for the responsive table and it will refactor it into
    an XML fragment.


    ![../images/502765_1_En_3_Chapter/502765_1_En_3_Fig11_HTML.jpg](images/502765_1_En_3_Chapter/502765_1_En_3_Fig11_HTML.jpg)


    Figure 3-11


    **Detail** view with code before fragment


    In Figure [3-12](#502765_1_En_3_Chapter.xhtml#Fig12), you can observe the refactored
    and clean piece of code within the **Detail** view again. When using a fragment,
    developers must ensure that the fragments contain unique ideas and they should
    provide a fragment name for easy access later from the JavaScript controller.


    ![../images/502765_1_En_3_Chapter/502765_1_En_3_Fig12_HTML.jpg](images/502765_1_En_3_Chapter/502765_1_En_3_Fig12_HTML.jpg)


    Figure 3-12


    **Detail** view with code after creating fragment


    If you are curious to see the fragment code definition, then look at Figure [3-13](#502765_1_En_3_Chapter.xhtml#Fig13)
    to observe how easy it was to cut and move the code from the view into the fragment
    for reusability.


    ![../images/502765_1_En_3_Chapter/502765_1_En_3_Fig13_HTML.jpg](images/502765_1_En_3_Chapter/502765_1_En_3_Fig13_HTML.jpg)


    Figure 3-13


    Fragment definition'
