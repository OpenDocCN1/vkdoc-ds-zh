    \ shows and compares different unit testing frameworks used within the Fiori applications\
    \ and also other open source frameworks, such as Nightmare and Puppeteer.\n\n\
    The book closes with Chapter [5](#502765_1_En_5_Chapter.xhtml) and the deployment\
