    tools so that they will be of good use later as well.


    ![../images/502765_1_En_4_Chapter/502765_1_En_4_Fig5_HTML.jpg](images/502765_1_En_4_Chapter/502765_1_En_4_Fig5_HTML.jpg)


    Figure 4-6


