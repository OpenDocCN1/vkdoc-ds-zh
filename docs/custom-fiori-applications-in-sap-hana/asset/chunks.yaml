    Learnings from this unit test framework:


    1.  It is very easy to set up and get started [`https://qunitjs.com/intro/`](https://qunitjs.com/intro/)


    2.  Documentation is easy to follow [`https://api.qunitjs.com/QUnit/`](https://api.qunitjs.com/QUnit/)


    3.  It is used in most Fiori application templates [`https://sapui5.hana.ondemand.com/1.36.6/docs/guide/e1ce1de315994a02bf162f4b3b5a9f09.html`](https://sapui5.hana.ondemand.com/1.36.6/docs/guide/e1ce1de315994a02bf162f4b3b5a9f09.html)


    4.  Developers are familiar with most of the concepts used in the framework, including
    debugging


    Spend additional time in the QUnit documentation to familiarize yourself with
    other types of tests, other assertions, and other operations or features offered
    by the QUnit framework. I wish you good luck if you decide to implement this framework!


    ## Nightmare JS


    The next unit test framework the book would like to highlight here is Nightmare
    JS. The reason to choose this unit testing framework is because it is a popular
    JavaScript framework and it is not part of the normal Fiori development. Often,
    I like to sample what is being offered by SAP technologies and its products, but
    it is also a good habit to investigate by yourself the other options available
    out there on the net. After all, the book is another source of information that
    provides different viewpoints, sharing information with the reader that may otherwise
    have not been explored. The result of this unit test framework is unfortunately
    not a good approach; however, I decided to keep it in the text to see comparisons
    with other frameworks. There are certain commands and features similar to the
    last unit framework that is documented in this chapter, and that is one of the
    main reasons to keep this one here, even though it yields an incomplete unit test
    scenario. There are some informative pieces that are relevant from the framework.


    Nightmare JS is an open source high-level unit test browser automation framework.
    Behind the scenes, Nightmare JS uses the Electron JS framework. Electron JS (found
    at [`https://www.electronjs.org/`](https://www.electronjs.org/)) is a framework
    that allows developers to create cross-platform desktop apps with JavaScript,
    HTML, and CSS. Let me repeat that statement: cross-platform desktop apps with
    JS, HTML, and CSS. If you understand web development, you know that JavaScript,
    HTML, and CSS are languages which run on the browser and therefore are not the
    same as desktop applications. Electron JS is also a popular framework since web
    developers can now create desktop applications with familiar technologies. Having
    this thought in mind, let us proceed to define, explain, and showcase the Nightmare
    JS framework for our Fiori application unit testing as our second option.


    Nightmare JS uses functions that mimic user interaction with software such as
    *type*, *click*, and *goto* with an API that feels synchronously, rather than
    having nested callbacks as done in other frameworks. Take a look at their GitHub
    Read Me page to learn more about this framework: [`https://github.com/segmentio/nightmare/blob/master/Readme.md`](https://github.com/segmentio/nightmare/blob/master/Readme.md)


    Nightmare JS can be added as a project using Node JS or it can be developed as
    a stand-alone unit test (Node JS) application. Following the steps from the Nightmare
    JS framework, install the framework from npm package using the following as the
    command line:


    ```

    npm install nightmare

    ```


    After running the installation command, make sure to install any dependencies
    using the following command line:


    ```

    npm install

    ```


    Before continuing with your unit test development, keep in mind that this framework
    has features that can mimic the user actions against the site; therefore, start
    thinking about the possible user automation of your software. There may be other
    frameworks that accomplish the same steps; however, I am including this one as
    a comparison to see how it works and what possible issues a user can face when
    interacting with various unit testing frameworks and also when using open source
    software.


    The book will try to showcase the following:


    1.  Opening the custom application and entering credentials to authenticate


    2.  Verifying that the data has loaded into the master list of the application


    3.  Clicking an item from the list to see its details


