    # 图 3-39


    Chrome 浏览器调试


    接下来介绍的浏览器是微软的 Edge，在打开开发者工具时，其功能在外观和操作上与 Chrome 非常相似。事实上，我们也可以使用键盘上的 `F12` 键来打开开发者工具。如图
    3-40 所示。


    ![../images/502765_1_En_3_Chapter/502765_1_En_3_Fig40_HTML.jpg](img/502765_1_En_3_Fig40_HTML.jpg)


    **图 3-40** Edge 浏览器调试


    ## 各种设备上的 Fiori 应用


    使用 `SAPUI5` 这样的框架的一大优势是它具有响应式特性。响应式意味着只需一套代码库，该代码便能适应大多数设备的屏幕尺寸，无需编写额外的自定义代码来实现适配。正如第
    1 章所述，Fiori 应用天生就具备响应式应用的特点。在本节中，我们可以观察到我们正在构建的 `SAPUI5` 应用在不同设备上的显示效果如下。


    ![../images/502765_1_En_3_Chapter/502765_1_En_3_Fig41_HTML.jpg](img/502765_1_En_3_Fig41_HTML.jpg)


    **图 3-41** 平板电脑视图


    1.  **桌面视图** – 此视图可在之前的所有图像中看到，例如图 3-40。


    2.  **平板电脑视图** 如图 3-41 所示。如果您打开开发者工具，然后选择设备图标以显示响应式设备，您的浏览器也可以模拟此视图。在选择图标后，您还可以在平板电脑和其他设备之间切换。


    ![../images/502765_1_En_3_Chapter/502765_1_En_3_Fig42_HTML.jpg](img/502765_1_En_3_Fig42_HTML.jpg)


    **图 3-42** 手机视图


    1.  **手机视图** 如图 3-42 所示。此图像同样来自打开开发者工具时的浏览器模拟器功能。


    ## 结论


    感谢您阅读至此，即将完成第 3 章。本章的主要目的是展示在 SAP HANA XSA 中构建的自定义应用，以及在使用了 Fiori elements 的 SAP
    Fiori 应用中可以完成的一些小幅自定义修改。介绍这两种类型的应用是为了让您了解并意识到何时使用 Fiori elements（少量自定义甚至零自定义），以及何时应考虑将某些
    SAP 自定义 Fiori 应用开发为自由式应用（这样在设计和开发上具有更大的灵活性）。本章还涉及了开发 Fiori 应用时可以使用的各种工具；其中一些是开源工具，另一些则是
    SAP 授权工具。理解并知道在合适的场景下使用哪种工具，也将帮助开发者在开发周期中提高效率。最后，本书展示了同一应用在不同浏览器上显示效果的差异，并让您了解到使用这些浏览器时可能出现的性能下降和视觉差异。希望本章符合您的喜好，并且您已获得足够的信息，能够指导您为下一个开发项目选择工具。


    # 4. Fiori 应用的单元测试


    欢迎来到第 4 章。在本章中，本书将从第 3 章中介绍的开发阶段继续推进，进入到单元测试环节。您可能会想，单元测试是否属于开发的一部分，并且是否需要由开发人员来完成。让我们从一个初步的“是”来回答。开发人员负责创建软件，他们也确实负责对其代码进行单元测试，以确保下一批相关人员确认他们的开发已完成且没有错误。下一批查看该软件（无论有无用户界面）的人员自然会与这个软件交互，如果您愿意，他们还会执行额外的测试步骤。无论这些人员是有意测试软件，还是无意为之，任何与软件的交互仍被视为测试。


    如果与我们的软件交互的人员发现了问题，他们可能会报告，于是就会创建并跟踪一个错误（bug），目的是在软件再次发布前修复它。这就形成了一个循环：开发人员不断地编写新软件、添加修复或增强他们最初创建或持续维护的代码。大多数开发人员喜欢编写新软件和新功能——创造新事物——而不是回头去修复他们没发现或并非他们造成的错误。本章旨在帮助开发人员搭建起他们的单元测试环境，以便他们能将更多时间用于开发新功能，并希望能减少花在重复测试上的时间。没错：单元测试和自动化测试的目标之一，就是利用工具和框架来设置并执行这些重复性任务，从而节省开发人员的时间，并使业务保持持续集成/交付模式。


    ## 单元测试框架


    解决问题的方法有很多种，在软件开发中，执行单元测试的方法也有很多种。在本节中，本书将介绍一些基于过往经验中使用过的不同单元测试框架。此外，这些单元测试框架还用于
    Fiori 开发中，对用户界面进行测试、对 OData 服务的使用进行测试，以及评估应用的完整性。表 4-1 列出了本章将要讨论的不同框架。


    **表 4-1** 不同的 JS 单元测试框架


    | 框架名称 | 描述 | 网址 |

    | --- | --- | --- |

    | `QUnit` | 功能强大且易于使用的 JS 框架 | [`https://qunitjs.com/`](https://qunitjs.com/)
    |

    | `Nightmare JS` | 高级浏览器自动化库 | [`http://www.nightmarejs.org/`](http://www.nightmarejs.org/)
    |

    | `Puppeteer` | 用于控制无头 Chrome 开发工具的高级 Node 库 API | [`https://developers.google.com/web/tools/puppeteer`](https://developers.google.com/web/tools/puppeteer)
    |


    ## Fiori 应用单元测试


    Fiori（`SAPUI5`）应用开箱即用地使用了 `QUnit` 框架；但是，如果您正在考虑其他单元测试框架解决方案，其他框架也可能为您的团队提供类似的功能。


    在进入测试之前，开发人员必须理解他们要开发的内容以及要测试的内容的需求。在开发过程中，开发人员需要知道创建有意义且成功的测试用例所需的预期输入和输出。理解单元测试场景还需要了解其他情况，例如用户将如何使用他们的软件，以及将使用哪些设备进行测试。


    在第一个练习中，本书介绍了三个不同的测试用例：


    1.  第一个测试用例是比较 `1` 是否等于 `1`，这只是为了让我们开始使用这个框架。


    2.  第二个测试用例是比较短格式的两个日期。


    3.  第三个测试用例包含一组三个验证（称为断言）。这些断言被分解为：调用一个 OData Web 服务，确保获取数据的时间在一秒以内，确保至少有一条记录被返回，最后将对象结构与开发人员设定的预期对象结构进行比较。

