    an exact exercise from the application being run from the on-premise scenario,
    this is indeed very close in nature; however, you can tell that running our custom
    Fiori application in the cloud can be verified from the browser and also using
    the unit testing scripts from Puppeteer in Chapter [4](#502765_1_En_4_Chapter.xhtml)
    of this book.


    Moreover, the AWS instance must be running in the EC2 dashboard to be able to
    run on the browser. A gentle reminder at this point is to remember to stop (or
    terminate) your EC2 instance when you have completed your development to avoid
    paying for unnecessary costs in AWS. Keep in mind also that the EBS volume (storage)
    is running independently from the EC2 instance; therefore, if you wish to terminate
    your EC2 instance also detach and delete the volume to avoid paying for services
    you are not using.


    ## GIT Repository


    It was briefly mentioned in the subsection about the AWS cloud how the GIT repository
    can be used to keep development efforts in an external enterprise repository.
    The reason to use an external repository is to allow the code to be maintained
    externally to SAP HANA. Furthermore, an external code repository such as GIT is
    an industry standard that allows teams of developers to work concurrently on their
    software development using different branching strategies and to keep their deployments
    clean. There are a few different external repositories; however, the book uses
    GIT to keep a closer integration with the tools that are provided throughout the
    exercises of this book.


    For simplicity, it is assumed that everyone following the exercises has a valid
    GIT account and can connect, commit, and clone from a GIT repository using their
    own license – the book will showcase the use of an account with a free license.


    In order to work with GIT, a developer must have access to this repository, be
    familiar with the GIT commands, and either execute from the command line (if you
    use this approach you will need to download the GIT CLI) or interact with them
    from the SAP Web IDE, which already has an interface to a GIT repository. In the
    previous section, the exercise used the cloning feature to retrieve the code from
    the GIT repository and used the retrieved code to deploy it to the AWS instance.


    The GIT commands are fundamental in the development and maintenance of modern
    software including SAP Fiori applications, unit testing, and other software development
    shown here or seen during your day-to-day work. It is required to understand how
    each of these commands work, and when and how to use them to make yourself more
    productive when doing your Fiori development. Understanding the commands will
    also allow you to work with other team members concurrently and it will also allow
    you to understand code versioning and software deployment and eventually to keep
    track of new tasks assigned or bug fixes.


    Many more commands are available, but not all are shown in Table [5-2](#502765_1_En_5_Chapter.xhtml#Tab2).
    This is a list of the most often used (and not in order):


    **Table 5-2** GIT Commands Used from SAP Web IDE


    | Command | Description | Example |

    | --- | --- | --- |

    | `Clone` | Clones the external repository to a local workspace | `git clone <url>`
    |

    | `Commit` | Submits changes from local workspace to the remote repository | `git
    commit -m <comment for commit>` |

    | `Stash` | Saves the changes you do not want to commit immediately | `git stash`
    |

    | `Push` | Pushes your changes to a remote (master) branch | `git push <remote>
    <branch>` |

    | `Pull` | Pulls the changes from the remote branch | `git pull <remote> <branch>`
    |

    | `Rebase` | Process of moving or combining a sequence of commits to a new base
    commit. The main purpose of a rebase is to maintain project history | `git rebase
    <base>` |


    All these commands can be run from the SAP Web IDE if you select the GIT pane,
    which is located on the second icon from the top on the right-hand side of your
    browser screen. Any pending changes will show in the changes table, as shown in
    Figure [5-34](#502765_1_En_5_Chapter.xhtml#Fig34).


    ![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig34_HTML.jpg](images/502765_1_En_5_Chapter/502765_1_En_5_Fig34_HTML.jpg)


    **Figure 5-34** GIT pane in the SAP Web IDE


    To save the changes to the repository, a developer must save changes made to the
    files in the SAP Web IDE, which will show them in the GIT pane with pending changes.
    Then, the developer must select the file to stage them, enter a comment in the
    comment input box at the bottom of the GIT pane, and finally select the `commit`
    and `push` button to push these changes into the external repository.


    During the different phases of building this custom Fiori application, these steps
    were executed, and you can see the change logs from the GITHUB repository page,
    as shown in Figure [5-35](#502765_1_En_5_Chapter.xhtml#Fig35) (23 commits, some
    test commits, some small commits).


    ![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig35_HTML.jpg](images/502765_1_En_5_Chapter/502765_1_En_5_Fig35_HTML.jpg)


    **Figure 5-35** GITHUB code commits showing in the repository


    Whether you are doing custom Fiori development or any other type of software development,
    chances are that you will interact with an external code repository. Dedicate
    some time to familiarize yourself with the repository commands. The other external
    repositories like GITHUB include Bitbucket and MSFT TFS, just to mention two.
    Both additional external code repositories also work as code repositories for
    your Fiori development and follow the same commands as the GITHUB repositories
    when you interact with them. There are plug-ins depending on the tools you are
    using to interface with these external repositories. Earlier in the book, we also
    demonstrated the Visual Studio Code editor, which can also interact with GITHUB,
    Bitbucket, and MSFT TFS.


    ## Automating the Deployment


    This is probably going to be the most read section of the book. Everyone wants
    to make their teams jump on the bandwagon of continuous integration and continuous
    delivery (CI/CD). What does that mean?


    1.  Continuous integration is a practice to make frequent commits of code to the
    repository to make sure the code can “fit in” with the other pieces of the software.
    Having automated unit testing facilitates the process to run a continuous integration
    pipeline. If developers make changes to code, deploy, and their software works,
    then they are following this practice.


    2.  Continuous delivery relies on continuous integration. Software engineers in
    charge of deploying developer code must always be able to deploy and have their
    deployed code to continue to work to ensure delivering new code does not break
    existing software systems. Although code is being integrated constantly, there
    should not be a reason why software cannot be delivered in working condition.
    It may seem dangerous to run a continuous delivery pipeline; it takes a lot of
    discipline and all hands on board to ensure that the CI/CD process can run as
    smoothly as possible, but it is doable. This type of operation can be achieved
    at bigger organizations where there are specialized teams of engineers facilitating
    the different moving pieces.


    The ideal situation to have CI/CD in our exercise would require that all modifications
    of software be run through an automated unit testing process, such as the ones
    shown in Chapter [4](#502765_1_En_4_Chapter.xhtml). If the automated test passes
    all validation, then code is submitted to GITHUB and code commits are run through
    a process that verifies software syntax rules, code coverage, and so on to ensure
    that it meets a certain set of standards. If this step is achieved, then the commit
    could be deployed to the upstream environment via some tool or script.'
