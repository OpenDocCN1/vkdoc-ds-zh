- fmt: '# MVC


    The `MVC` architectural design pattern has been around for a very long time. Its
    popularity in software has been incredible since its introduction in the 70s–80s.
    It was originally developed with the intent of decoupling software, to allow separation
    of concerns from the code point of view, and it has evolved into different flavors
    of the initial pattern, such as `MVP` (Model View Presenter) and `MVVM` (Model
    View View Model). This architectural pattern has been adopted by various programming
    languages such as C#, JavaScript, PHP, NodeJS, and Java, just to mention a few.


    This book will focus on `MVC` and how it applies to SAP Fiori applications using
    the `SAPUI5` library. In Table [3-1](#502765_1_En_3_Chapter.xhtml#Tab1), we can
    observe some advantages and disadvantages of the design pattern.


    **Table 3-1** Advantages and Disadvantages of Using MVC


    | Advantages | Disadvantages |

    | --- | --- |

    | Loose coupling of code files | It can be overwhelming depending on the complexity/size
    of the project |

    | Multiple developers working simultaneously | Keeping track of who is doing what
    and code merging can be hectic |

    | Multiple versions of a model | Learning curve can be challenging for new teams
    |

    | Easier unit testing | Some less experienced developers struggle with the idea
    of decoupling code and modularization |

    | Code reuse due to modularization |  |


    The `MVC` pattern is usually depicted as a connected line between three sections,
    as shown in Figure [3-1](#502765_1_En_3_Chapter.xhtml#Fig1).


    ![../images/502765_1_En_3_Chapter/502765_1_En_3_Fig1_HTML.jpg](images/502765_1_En_3_Chapter/502765_1_En_3_Fig1_HTML.jpg)


    **Figure 3-1** MVC architecture pattern


    1.  The **Model** represents the data that comes from an API, a web service, or
    a local `JSON` model. In the case of Fiori applications, most of the time, the
    application references an OData service (server-side models), as shown in Chapter
    [2](#502765_1_En_2_Chapter.xhtml). These models can also be local to the application
    as `JSON` models (client-side models). The data models can be bound to the views
    part of the pattern and reflect how the models are updated directly when the view
    uses a two-way binding. Binding can be done as a one-way binding, which means
    the application does a read-only of the model, or a two-way binding, which means
    the model can get updated from the view and the model always reflects the changes
    done by the views.


    2.  The **View** represents the HTML5 controls that are visualized by a user when
    working on an SAP Fiori application. The views bind to the model and immediately
    reflect the data model to the user. The user interface allows the user to interact
    with the model, and through events, the views call (notify) the controller to
    execute some behavior (such as calling a JavaScript function).


    Views can be created as HTML, XML, JSON, and JavaScript views. `XML` views is
    the preferred and suggested method by SAP. The reason to use `XML` views is that
    the application structure is more readable, and the `XML` views are also easily
    shown in the layout editor. Years ago, when `SAPUI5` was introduced, JavaScript
    views were the original way of creating applications; however, due to complexity
    and language syntax, then they immediately became option number two.


    3.  The **Controller** gets triggered as a response to one or more events bound
    to the views. The view (HTML/XML/JavaScript) controls have different types of
    events depending on the control type. When the views trigger the events, JavaScript
    functions get executed in the corresponding `controller.js` file.


    As mentioned in the previous paragraph, depending on the type of control used,
    they may have different types of events. Some of the common controls and events
    are presented in Table [3-2](#502765_1_En_3_Chapter.xhtml#Tab2).


    **Table 3-2** Common SAPUI5 controls


    | Control Type | Event | Comment |

    | --- | --- | --- |

    | `Button` | `Press` | When the user clicks the button |

    | `Input` | `onKeyUp`, `onKeyDown` | When the user types |

    | `ComboBox` | `onSelectionChanged` | When the user changes the item selection
    |

    | `Table` | `onItemPressed` | When an item (row) is selected |

    | `List` | `onItemPressed` | When a list item is pressed; this event is very similar
    in nature to the event in the responsive table control |


    These events can be used directly from the framework or from additional custom
    binding from within the application. Binding custom events to controls is a common
    activity if the desired event is not offered by the framework. It could be the
    case if we wanted to bind a scroll event to the application or invoke multiple
    events from the same control. Some use cases could be adding a `keyUp`, `keyDown`,
    mouse-over (hovering over the input element), or `blur` (when it loses focus)
    event on an `SAPUI5` input field.


    When working with the `SAPUI5` library, developers can see the control-specific
    events if they navigate to the (UI5) *API Reference* tab. Look for a specific
    control from the Master list (shown on the left side navigation) and then you
    can see the control *Events* (shown in the detail section of the application at
    the right-hand side), as shown in Figure [3-2](#502765_1_En_3_Chapter.xhtml#Fig2).


    ![../images/502765_1_En_3_Chapter/502765_1_En_3_Fig2_HTML.jpg](images/502765_1_En_3_Chapter/502765_1_En_3_Fig2_HTML.jpg)


    **Figure 3-2** SAPUI5 SDK API Reference tab


    Dedicate some time and navigate through a few of the other controls to familiarize
    yourself with the different types of events, and the difference in events from
    one control to another. You do not need to memorize each one of these events or
    properties of each control; however, it is helpful to understand where to find
    more information related to it within the SDK. Moreover, each UI5 element can
    also be attached to a browser element. The framework is very flexible in such
    a way that custom events can be included to these controls, such as scrolling
    of the page, mouse events, and before/after rendering.


    Apart from single controls having these events, there are also events that occur
    during the life cycle of the application as is the case for views. Each view has
    a life cycle. Displayed in Table [3-3](#502765_1_En_3_Chapter.xhtml#Tab3) are
    the view lifecycle events.


    **Table 3-3** SAPUI5 view lifecycle events


    | View event | When to use it |

    | --- | --- |

    | `onInit` | When the view gets initialized after navigating to it. This event
    is commonly used to initialize certain values to be used by the application. On
    certain occasions, the data model or the controls are not initialized yet until
    the next set of events. Beware and debug when using this event. |

    | `beforeRendering` | The view has been initialized but not all the controls have
    been rendered to the screen. This event can be used if the data model is not ready
    yet during the `onInit` event and right before the controls are displayed on the
    screen. Other use cases can be to unbind events from controls. |

    | `afterRendering` | The view was initialized, and the controls have been rendered
    to the screen and right before releasing control to the user. This event is helpful
    when the application needs to modify a control’s behavior after those controls
    have been rendered to the screen. Further, this event can be used if we need to
    query the OData service and apply additional logic to the app. |

    | `beforeExit` | Right before navigating away from or closing the view. |


    The same events can be found in the `SAPUI5` SDK by looking up the `XML` view
    within the *API Reference* tab as shown in the following. Keep in mind that there
    may be events borrowed from other controls, as shown in Figure [3-3](#502765_1_En_3_Chapter.xhtml#Fig3).


    ![../images/502765_1_En_3_Chapter/502765_1_En_3_Fig3_HTML.jpg](images/502765_1_En_3_Chapter/502765_1_En_3_Fig3_HTML.jpg)


    **Figure 3-3** XML view borrowed events'
