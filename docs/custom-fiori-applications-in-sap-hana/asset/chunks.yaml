    \nFigure 1-16\n\nSAPUI5 SDK documentation page\n\n2.  **API Reference**\n\nThe\
    \ API reference is very helpful since all the SAPUI5 controls are explained: the\
    \ controls are broken down into properties, events, constructors, associations,\
    \ aggregations, and their cardinality. This is shown in Figure [1-17](#502765_1_En_1_Chapter.xhtml#Fig17).\n\
    \nIn this SAPUI5 SDK section, the developer can obtain a full understanding of\
    \ all the necessary attributes, inheritance, and behavior of each control. Furthermore,\
    \ this section breaks down the SAPUI5 controls based on the namespace (sap.m,\
    \ sap.apf, sap.ui, sap.f…).\n\nWhen you decide to start building your Fiori applications\
    \ and it requires controls from different namespaces in your XML views, make sure\
    \ to include references to those namespaces. Missing namespaces is a common mistake\
    \ done by developers when they start their venture in SAPUI5\\. Another common\
    \ missed step is the lack of understanding of the available properties; spend\
    \ some time reading through the API reference and familiarize yourself with some\
    \ of the common controls such as tables, buttons, and input fields.\n\n![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig17_HTML.jpg](images/502765_1_En_1_Chapter/502765_1_En_1_Fig17_HTML.jpg)\n\
    \nFigure 1-17\n\nSAPUI5 SDK API reference\n\n![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig18_HTML.jpg](images/502765_1_En_1_Chapter/502765_1_En_1_Fig18_HTML.jpg)\n\
    \nFigure 1-18\n\nSAPUI5 SDK sample page\n\n1.  **Samples**\n\nYes, the SDK page\
    \ provides sample application and code snippets that a developer can quickly see\
    \ on the user interface, as shown in Figure [1-18](#502765_1_En_1_Chapter.xhtml#Fig18).\
    \ As a developer learns more and more, some of the code snippets will be easy\
    \ to remember, but it is still very helpful to know where to get these controls\
    \ in case a new control is required when developing a new application. The important\
    \ sections within this tab are\n    1.  The control navigation list shown on the\
    \ left side of the application\n\n2.  The number of different scenarios shown\
    \ in the list item\n\n3.  The version of the SAPUI5 library being used (top right-hand\
    \ side of the screen)\n\n4.  Code snippet icon shown as a { = } right under the\
    \ Change version and the magnifying glass icon on the top right-hand corner of\
    \ Figure [1-18](#502765_1_En_1_Chapter.xhtml#Fig18)\n\n![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig19_HTML.jpg](images/502765_1_En_1_Chapter/502765_1_En_1_Fig19_HTML.jpg)\n\
    \nFigure 1-19\n\nSAPUI5 SDK demo apps\n\n1.  **Demo Apps**\n\nSAP has provided\
    \ some demo apps as shown in Figure [1-19](#502765_1_En_1_Chapter.xhtml#Fig19)\
    \ so that developers can see what has been done, and how it was done, and if they\
    \ need to, they get the code base in case their requirement is similar to the\
    \ demo applications. I would like to highly recommend visiting and going over\
    \ the Walkthrough application first to get a full understanding of all the moving\
    \ pieces that exist in an SAP Fiori application. If you are able to follow this\
    \ application and understand how the many pieces coordinate and work with each\
    \ other, then it will be very easy to understand any other Fiori application whether\
    \ you will be modifying an existing one or creating new from scratch.\n\nMake\
    \ sure to spend enough time in this demo app section, especially in the *Walkthrough*\
    \ as shown in Figure [1-19](#502765_1_En_1_Chapter.xhtml#Fig19).\n\n![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig20_HTML.jpg](images/502765_1_En_1_Chapter/502765_1_En_1_Fig20_HTML.jpg)\n\
    \nFigure 1-20\n\nSAPUI5 SDK tools page\n\n1.  **Tools**\n\nThis section points\
    \ out the main tools required to build SAP Fiori applications, as shown in Figure\
    \ [1-20](#502765_1_En_1_Chapter.xhtml#Fig20). These tools are used for development\
    \ (SAP Web IDE or UI5 tooling), debugging (UI5 inspector), theme designer (in\
    \ case you need a custom theme), and icons. Additional description of these tools\
    \ is found next.\n\nIn Figure [1-20](#502765_1_En_1_Chapter.xhtml#Fig20), you\
    \ can see the description of the main tools and a link to learn more about them.\n\
    \n![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig21_HTML.jpg](images/502765_1_En_1_Chapter/502765_1_En_1_Fig21_HTML.jpg)\n\
    \nFigure 1-21\n\nSAP Cloud Platform custom theme designer\n\n1.  **SAP Web IDE**\n\
    \nThis is the main development tool for SAP Fiori applications. It is a browser-based\
    \ tool used to develop web and database applications. There are several versions\
    \ of this type of tool, so please check out the required version and license requirements\
    \ for your development. The SAP Web IDE can be installed locally (SAP Web IDE\
    \ personal edition), there is a version on the SAP Cloud Platform called SAP Web\
    \ IDE Full stack, and there is also a version for on-premise development which\
    \ can also be accessed from the SAP HANA Express edition.\n\n2.  **UI Theme designer**\n\
    \nThis tool, shown in Figure [1-21](#502765_1_En_1_Chapter.xhtml#Fig21), is recommended\
    \ to be used if the SAPUI5 application to be developed requires a custom theme\
    \ and the Fiori application will not follow the standard Fiori concepts. Look\
    \ inside this tool in the SAP Cloud Platform (or SAP Cloud Platform trial edition)\
    \ and see if you can come up with your own custom-branded theme. This tool is\
    \ extremely helpful as it allows the developer to reuse the class names and the\
    \ developer may be able to change the colors dynamically and quickly see what\
    \ their application may look like if the custom theme was utilized as the end\
    \ product."
  trans: '在之前的表格对比之外，我们不妨花点时间了解一下 `SAPUI5 SDK`（软件开发工具包）页面，因为我将着重介绍其中重要的内容，以及那些试图进入
    `SAPUI5` / Fiori 开发的读者应该注意的事项。


    在图 1-14 和图 1-15 中，我们可以分别看到 `SAPUI5 SDK` 和 `OpenUI5 SDK` 页面。它们具有相似的外观与风格，以及相同的结构；再次说明，这些不同的库分别用于
    SAP 许可的开发或 UI5 框架的开源等价物。


    ![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig15_HTML.jpg](img/502765_1_En_1_Fig15_HTML.jpg)


    图 1-15


    Open UI5 SDK


    ![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig14_HTML.jpg](img/502765_1_En_1_Fig14_HTML.jpg)


    图 1-14


    SAPUI5 SDK


    在图 1-16 中，你可以看到 `SAPUI5 SDK` 页面。页面顶部有一些章节（选项卡），内容被划分其中。


    ### 文档


    在本节中，读者可以找到与 `SAPUI5` 应用程序相关的所有重要文档，内容涵盖从创建第一个 Fiori 应用程序的入门教程，到深入理解 Fiori 应用程序的深层概念。


    本节中其他值得记住的重要信息包括：版本特性、版本支持、如何开发自定义控件、主题、SAP Fiori CSS 类以及浏览器兼容性等。


    花时间学习入门教程部分非常重要，因为它展示了如何从头到尾构建一个 Fiori 应用程序。它还展示了使用 `MVC`（模型-视图-控制器）模式的不同场景。无论你是构建新应用程序还是扩展现有
    SAP 交付的应用程序，`SDK` 的这一部分都很有用，并且建议熟悉它。


    ![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig16_HTML.jpg](img/502765_1_En_1_Fig16_HTML.jpg)


    图 1-16


    SAPUI5 SDK 文档页面


    ### API 参考


    API 参考非常有帮助，因为它解释了所有 `SAPUI5` 控件：控件被分解为属性、事件、构造函数、关联、聚合及其基数。如图 1-17 所示。


    在这个 `SAPUI5 SDK` 部分中，开发人员可以全面了解每个控件的所有必要属性、继承关系和行为。此外，本节还根据命名空间（`sap.m`、`sap.apf`、`sap.ui`、`sap.f`...）对
    `SAPUI5` 控件进行了分类。


    当你决定开始构建 Fiori 应用程序，并且需要在 `XML` 视图中使用来自不同命名空间的控件时，请确保包含对这些命名空间的引用。遗漏命名空间是开发人员开始涉足
    `SAPUI5` 时常犯的错误。另一个常见的疏忽是缺乏对可用属性的理解；花些时间阅读 API 参考，熟悉一些常用控件，例如表格、按钮和输入字段。


    ![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig17_HTML.jpg](img/502765_1_En_1_Fig17_HTML.jpg)


    图 1-17


    SAPUI5 SDK API 参考


    ![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig18_HTML.jpg](img/502765_1_En_1_Fig18_HTML.jpg)


    图 1-18


    SAPUI5 SDK 示例页面


    ### 示例


    是的，SDK 页面提供了示例应用程序和代码片段，开发人员可以快速在用户界面上看到它们，如图 1-18 所示。随着开发人员学习得越来越多，某些代码片段会很容易记住，但在开发新应用程序需要新控件时，知道从哪里获取这些控件仍然非常有帮助。此选项卡中的重要部分包括：

    1.  应用程序左侧显示的控件导航列表

    2.  列表项中展示的不同场景数量

    3.  所使用的 `SAPUI5` 库的版本（屏幕右上角）

    4.  代码片段图标，显示为 `{ = }`，位于“更改版本”图标和放大镜图标下方（图 1-18 的右上角）


    ![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig19_HTML.jpg](img/502765_1_En_1_Fig19_HTML.jpg)


    图 1-19


    SAPUI5 SDK 演示应用程序


    ### 演示应用


    SAP 提供了一些演示应用程序，如图 1-19 所示，以便开发人员可以看到已完成的工作以及实现方式。如果需要，他们可以获取代码库，以防需求与演示应用程序类似。我强烈建议首先访问并学习入门教程应用程序，以全面了解
    SAP Fiori 应用程序中存在的所有动态部分。如果你能跟随此应用程序并理解众多部分如何协调配合，那么无论是修改现有 Fiori 应用程序还是从头创建新应用程序，都会变得非常容易。


    请确保在此演示应用部分投入足够时间，尤其在图 1-19 所示的入门教程中。


    ![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig20_HTML.jpg](img/502765_1_En_1_Fig20_HTML.jpg)


    图 1-20


    SAPUI5 SDK 工具页面


    ### 工具


    本部分指出了构建 SAP Fiori 应用程序所需的主要工具，如图 1-20 所示。这些工具用于开发（`SAP Web IDE` 或 UI5 工具）、调试（`UI5
    inspector`）、主题设计器（如果需要自定义主题）以及图标。接下来对这些工具进行补充说明。


    在图 1-20 中，你可以看到主要工具的说明以及了解更多相关信息的链接。


    ![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig21_HTML.jpg](img/502765_1_En_1_Fig21_HTML.jpg)


    图 1-21


    SAP Cloud Platform 自定义主题设计器


    ### SAP Web IDE


    这是 SAP Fiori 应用程序的主要开发工具。它是一个基于浏览器的工具，用于开发 Web 和数据库应用程序。此类工具有多个版本，因此请检查开发所需的版本和许可证要求。`SAP
    Web IDE` 可以本地安装（`SAP Web IDE` 个人版），在 SAP Cloud Platform 上有一个名为 `SAP Web IDE Full
    stack` 的版本，同时还有一个适用于本地部署开发的版本，也可以通过 `SAP HANA Express` 版访问。


    ### UI 主题设计器


    如果待开发的 `SAPUI5` 应用程序需要自定义主题，并且该 Fiori 应用程序不遵循标准的 Fiori 概念，则建议使用此工具，如图 1-21 所示。在
    SAP Cloud Platform（或 SAP Cloud Platform 试用版）中查看此工具，看看是否能设计出自己的自定义品牌主题。此工具非常有帮助，因为它允许开发人员重用类名，并且开发人员可以动态更改颜色，快速查看如果使用自定义主题作为最终产品，他们的应用程序可能是什么样子。'
- fmt: '![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig22_HTML.jpg](images/502765_1_En_1_Chapter/502765_1_En_1_Fig22_HTML.jpg)


    Figure 1-22


    UI5 tooling CLI


    1.  **UI5 Tooling**


    This is a command-line interface (CLI) tool, shown in Figure [1-22](#502765_1_En_1_Chapter.xhtml#Fig22),
    that allows quicker development of applications leveraging `Node J`S and `NPM`
    (Node Package Manager). CLI tools have gained a lot of popularity in web development
    and it is no surprise that this is available in `SAPUI5.`


    ![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig23_HTML.jpg](images/502765_1_En_1_Chapter/502765_1_En_1_Fig23_HTML.jpg)


    Figure 1-23


    SAPUI5 inspector


    1.  **UI5 Inspector**


    This tool is a Chrome browser add-on tool that allows developers to debug and
    analyze `SAPUI5` controls on their application when it is running on the browser.
    This tool is shown in Figure [1-23](#502765_1_En_1_Chapter.xhtml#Fig23). This
    tool displays the hierarchical representation of a control within the application
    as well as all the `css` classes and any other attribute/property assigned to
    it. This tool is helpful when trying to debug a specific control behavior or look
    within an application. Since different browsers behave and display differently,
    this tool may be used in cases when comparing different browser behaviors while
    comparing certain controls and how they render on the screen.


    ![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig24_HTML.jpg](images/502765_1_En_1_Chapter/502765_1_En_1_Fig24_HTML.jpg)


    Figure 1-24


    SAPUI5 icon explorer


    1.  **Icon explorer**


    By far this is my favorite tool, as it allows me to find available icons within
    the same framework. Sometimes, in other technology frameworks, developers need
    to integrate additional `js` libraries for icons, while in `SAPUI5`, the icon
    library is already included. This tool allows a developer to search for icons
    and the icons can be presented in various forms such as different icon sizes.
    Moreover, the icons are tagged with some keywords to easily find them while searching
    them in this tool as shown in Figure [1-24](#502765_1_En_1_Chapter.xhtml#Fig24).


    ## Understanding Elements, Layouts, and Floor Plans


    As we dive deeper and deeper into Fiori, it is important to understand how Fiori
    applications are designed and developed. If you have not developed a Fiori application
    before, most likely you are going to see examples and try to mimic them. This
    is a normal process when learning a new skill or technology or when trying something
    new for the first time. Experienced developers also look for patterns and components
    that make up a type of application. We try to understand what elements make up
    a page and what controls are used and become familiar with them via some API or
    documentation. This is also the case when developing Fiori applications.


    **SAPUI5 controls** include the most common controls in web applications, such
    as input fields, labels, combo boxes, tables, and check boxes, among many others.
    Please visit the `SAPUI5 SDK` page to learn more about the different types of
    controls, their documentation, and their code samples.


    SAP Fiori **Elements**, formerly known as Smart templates, provide you with the
    most common set of templates that are used in Fiori applications. Some of these
    templates include the Overview page, the List Report, the Worklist, and the Object
    page. Moreover, some of these Fiori elements require little to no development,
    and they are metadata-driven applications. This book will show the use of creating
    these applications using the `MVC` framework, `XML` views, and the JavaScript
    programming language in controllers.


    ![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig25_HTML.jpg](images/502765_1_En_1_Chapter/502765_1_En_1_Fig25_HTML.jpg)


    Figure 1-25


    Overview template


    1.  **Overview:** This template contains smart tiles that may have some important
    metrics such as analytical cards, allowing a user to quickly see and navigate
    to see more details. The purpose of an Overview page is as the name describes,
    to provide a quick view of important information without the need to drill down
    into every area/page of an application to find out an issue with the system. This
    type of page/template is used as an entry point of an application, as shown in
    Figure [1-25](#502765_1_En_1_Chapter.xhtml#Fig25). This template showcases cards,
    tiles, lists, and some graphs for quick visuals. A picture is worth a thousand
    words and this type of template does exactly that. It does not overwhelm the user
    and it provides a clear idea of what to look for.


    ![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig26_HTML.jpg](images/502765_1_En_1_Chapter/502765_1_En_1_Fig26_HTML.jpg)


    Figure 1-26


    Worklist template


    1.  **Worklist:** This type of page/template is used for assigning work to a user,
    and often it lets the user drill down into details to take some action. It is
    a simple list to detail page. This template showcases a list, a navigation, and
    a detail page where item details can be seen and acted upon. Figure [1-26](#502765_1_En_1_Chapter.xhtml#Fig26)
    shows such a template.


    ![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig27_HTML.jpg](images/502765_1_En_1_Chapter/502765_1_En_1_Fig27_HTML.jpg)


    Figure 1-27


    List Report template


    1.  **List Report:** This type of template is very similar to the Worklist template;
    however, this template is often used for a larger data set of items where the
    user can include filters to minimize the number of records displayed. The template
    also allows multiple selection to perform a set of actions against specific records,
    and it is normally used to give a higher-level visibility of the data set to the
    user in comparison to the Worklist, which is normally used for a smaller set of
    data dedicated to a specific user. This template can be seen in Figure [1-27](#502765_1_En_1_Chapter.xhtml#Fig27).


    ![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig28_HTML.jpg](images/502765_1_En_1_Chapter/502765_1_En_1_Fig28_HTML.jpg)


    Figure 1-28


    Object view template'
