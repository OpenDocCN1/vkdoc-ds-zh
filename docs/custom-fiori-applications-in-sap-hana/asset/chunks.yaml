  trans: '

    # 部署到 SAP Cloud 和 AWS 等不同平台


    上一小节描述了开发者可以在 SAP Web IDE 中构建并部署 Fiori 应用到 SAP Cloud Platform 的步骤。还有其他一些云提供商也可以用来托管
    Fiori 应用。本章的这一部分将解释如何将同一个 Fiori 应用部署到 AWS 环境。在 AWS 上，需要一个付费账户来获得一个 `EC2` 实例，以便在其上加载
    SAP HANA XSA 快速版镜像。


    在本书中，我选择了 AWS，是因为我对这个过程已经比较熟悉，并且已经实施过几次。不管你信不信，每次我执行这些步骤时，我都能学到新东西，在撰写本书期间也不例外。就像本书解释了
    CF 的架构和层级一样，我认为也应该介绍一下来自 AWS 云平台的几个概念。


    AWS 提供了大量的服务，供全球各地的公司用于日常业务的运营。无论从开发者、云客户还是从他们所提供的服务的角度来看，AWS 都是一个非常出色的平台。无论是为了我自己的目的，还是为了撰写本书，我对所探索的各种
    AWS 服务都非常满意。


    对于组织来说，选择云提供商可能是一项挑战，因为他们将其部分基础设施（有时还包括他们的数据）托付给了云提供商；然而，如果你对比一下使用云服务的利弊，你就会意识到这样做有很多好处。仅举几例：


    1.  **几分钟内全球化。** 你可以只需点击几下，即可在世界各地部署你的基础设施、软件和其他服务，并快速投入生产。无需像过去本地部署时代那样，等待漫长数日/数周来订购和交付硬件。

    2.  **基础设施零维护，按用量付费。** 补丁或其他维护费用由云提供商承担。你（客户）只需为使用中的计算能力和数据检索付费。

    3.  **“对云”负责 vs “在云中”负责。** 你（客户）必须对你在云中放置的内容负责，例如保护你的应用程序、数据库、用户等安全。AWS 对云本身负责，确保其正常运行，其托管服务是安全的，并且你的账户不会与其他账户混淆。

    4.  **通过标签跟踪服务产生的费用。** 你的云账户可以设置预算告警，并且可以标记每个服务，让你了解你和你的客户正在使用的各个服务分别产生了多少成本。


    一旦你充分了解了云的优势，并准备好在云平台运行你的应用程序，你会发现你还需要了解额外的 AWS 概念。在设置某些服务时，并为了理解月底的账单，需要了解以下术语。设置服务时请密切留意：


    1.  **区域** - 这是世界上一个拥有集群数据中心的独立地理区域。北美有多个区域；例如，美国东部、美国西部、加拿大。建议客户选择一个靠近其客户所在地的区域，以尽量减少对其软件性能和网络延迟的影响。区域概念对软件和云服务的使用方式有重大影响。您希望尽可能保持您的运营距离最近。

    2.  **可用区** – AZ 是区域内的一个或多个数据中心。一个区域内存在多个 AZ 的目的是为了冗余，从而实现高可用性，进而达到容错、独立供电、独立冷却、安全和数据保护。美国东部区域内的
    AZ 是 `us-east-1`、`us-east-2`。请确认您部署软件的区域内有哪些 AZ。


    这些概念在图 5-20 中进行了高级别展示。


    ![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig20_HTML.jpg](img/502765_1_En_5_Fig20_HTML.jpg)


    图 5-20


    AWS 区域和可用区


    接下来的概念与 AWS 服务相关。这些服务必须部署在某个 AWS 区域内。


    1.  **弹性计算云** - EC2。


    这是最初且最流行的服务之一，允许公司运行虚拟计算能力。你可以将一个 `EC2` 实例视为运行在云端网络中的虚拟机。有各种类型的 `EC2` 实例，提供计算能力、高内存、专用实例或竞价实例。所有这些实例都具备并提供了许多特性和功能，并按使用量计费。


    2.  **弹性块存储** – EBS


    该服务提供块存储，作为允许 `EC2` 实例存储数据的方法之一。AWS 提供多种提供存储解决方案的服务。有些服务用于大容量存储，有些用于持久化存储，另一些用于内存存储。就部署我们的应用程序而言，你需要了解此服务的关键点是，练习中使用的
    `EC2` 实例使用了 SAP HANA XSA 镜像。此镜像需要 `EBS` 服务。在为您的应用程序使用 AWS 之前，请熟悉此服务及其他存储服务，以了解相关特性和成本。


    3.  **简单存储服务** - S3


    该服务是最流行的 AWS 服务之一，大多数云客户的使用率都很高。简单存储服务用于对象存储，例如文件、代码、备份和镜像。从 AWS UI 的角度来看，`S3`
    服务显示为文件夹层级结构；然而，这些对象是以扁平层级结构存储的。该服务为客户提供无限的存储空间，并且根据其消费者所需的检索时间，提供多种类型的存储。再次强调，请熟悉不同的
    `S3` 存储桶类型，以确定哪种最适合您。在本书的练习中，我们将使用 `S3` 服务来存储和备份我们的代码版本。


    本书不会深入探讨与 AWS、`EC2`、`EBS` 或网络相关的细节；但是，为了将自定义应用程序部署到这个平台，有必要对这些托管服务进行高级别的说明。如果您需要有关
    AWS 的更深入知识，请咨询 AWS 专业人员。请参见图 5-21 以了解此设置的高级视图。


    ![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig21_HTML.jpg](img/502765_1_En_5_Fig21_HTML.jpg)


    图 5-21


    托管了一个连接到 `EBS` 的 `EC2` 实例的 AWS 区域


    对于我们此次的练习，我们按照 SAP 提供的教程中所述设置了推荐的 AWS 基础设施：[`https://developers.sap.com/tutorials/hxe-xsa-aws-setup.html`](https://developers.sap.com/tutorials/hxe-xsa-aws-setup.html)。

    '
- fmt: '# SAP HANA XSA on AWS


    The SAP HANA XSA (free) image can be found in the AWS Marketplace, as displayed
    in Figure [5-22](#502765_1_En_5_Chapter.xhtml#Fig22). After selecting the image,
    you will need to select the region you want to deploy to. The image is a prebuilt
    instance with some required settings already in place. Using images speeds up
    the process to get you up and running. Some of the settings already in place for
    this image are within the security group network rules as well as the volume storage
    discussed further in the following.


    ![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig22_HTML.jpg](images/502765_1_En_5_Chapter/502765_1_En_5_Fig22_HTML.jpg)


    **Figure 5-22** – SAP HANA XSA express edition


    This SAP HANA XSA image uses an `EC2` instance, `m4.2xlarge`, which uses `EBS`
    storage only, as shown in Figure [5-23](#502765_1_En_5_Chapter.xhtml#Fig23).


    ![../images/502765_1_En_5_Chapter/502765_1_En_5_Fig23_HTML.jpg](images/502765_1_En_5_Chapter/502765_1_En_5_Fig23_HTML.jpg)


    **Figure 5-23** – SAP HANA XSA – EC2 instance setup


    Follow the prompts to set up your XSA environment. Eventually you will need to
    set up security settings and open some ports to be able to connect to some HANA
    XSA services and the SAP HANA XSA Web IDE, which will be hosted in AWS; since
    you used the SAP HANA XSA image, these settings are already in place. You will
    also need to generate or select an existing key/value pair to connect to your
    instance using Linux (or `Putty` if you are using Windows). If you already have
    a key pair generated, you may be able to use that one. I suggest you create a
    new one just to have a clean installation of the environment as a whole.


    The preceding URL contains all the steps from the SAP official website. If done
    correctly, it could take 30 mins to 1 hour to complete the setup.


    Some of the common errors I encountered when doing the setup were:


    1. Understanding the difference between `Putty` and `Putty Key Gen`

    2. Having a basic understanding of using the `XS CLI`

    3. Understanding the reason to use the key pair cert when connecting to your AWS
    account

    4. Generating the `ppk` file from the `pem` key. During this step, make sure to
    select the private key (not public)

    5. Understanding the terminal setup steps and making sure you know which commands
    to use when


    Keep in mind that even though the HANA XSA image is free, you still have to pay
    for the `EC2` instance while using it, along with `EBS` storage. Stopping the
    `EC2` instances does not stop the `EBS` storage; therefore if you decide to stop
    your `EC2` instance you will still be paying for the `EBS` service unless you
    terminate your `EC2` instance and `EBS` volume – you can also learn this the hard
    way at the end of the month when you receive your bill.


    Figure [5-24](#502765_1_En_5_Chapter.xhtml#Fig24) shows what it looks like when
    terminating the `EC2` instance and `EBS` volume. Performing this operation will
    wipe all your data out, so only proceed with this step when you are completely
    done with your exercise.


    Do not execute this step in a production environment, unless you are completely
    sure that you want to delete it ALL forever!


