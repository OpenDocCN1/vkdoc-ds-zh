  trans: '

    # MVC


    `MVC`（模型-视图-控制器）架构设计模式已有非常悠久的历史。自 20 世纪 70 至 80 年代问世以来，它就在软件领域取得了令人难以置信的普及。该模式最初是为了解耦软件、从代码层面实现关注点分离而设计的，随后演化出多种变体，例如`MVP`（模型-视图-表示器）和`MVVM`（模型-视图-视图模型）。这种架构模式已被多种编程语言采用，包括
    C#、JavaScript、PHP、NodeJS 和 Java，此处仅举几例。


    本书将重点讨论`MVC`以及它如何应用于使用`SAPUI5`库的 SAP Fiori 应用。在表 3-1 中，我们可以观察到该设计模式的一些优缺点。


    **表 3-1** 使用 MVC 的优缺点


    | 优点 | 缺点 |

    | --- | --- |

    | 代码文件松散耦合 | 根据项目的复杂程度/规模，可能让人难以承受 |

    | 支持多位开发者同时工作 | 跟踪每个人的工作以及代码合并可能非常繁琐 |

    | 支持模型的多个版本 | 对新团队来说，学习曲线可能具有挑战性 |

    | 更容易进行单元测试 | 一些经验较少的开发者难以理解代码解耦和模块化的概念 |

    | 由于模块化而实现代码复用 |  |


    `MVC`模式通常被描绘成三个部分之间的连接线，如图 3-1 所示。


    ![../images/502765_1_En_3_Chapter/502765_1_En_3_Fig1_HTML.jpg](img/502765_1_En_3_Fig1_HTML.jpg)


    **图 3-1** MVC 架构模式


    1.  **模型**表示来自 API、Web 服务或本地`JSON`模型的数据。就 Fiori 应用而言，大多数情况下，应用会引用一个 OData 服务（服务器端模型），如第
    2 章所示。这些模型也可以是应用本地的`JSON`模型（客户端模型）。数据模型可以绑定到该模式的视图部分，当视图使用双向绑定时，模型会直接反映更新。绑定可以是单向绑定，即应用只对模型进行只读操作；也可以是双向绑定，即模型可以从视图更新，并且模型始终反映视图所做的更改。


    2.  **视图**表示用户在操作 SAP Fiori 应用时可视化的 HTML5 控件。视图绑定到模型，并立即向用户展示数据模型。用户界面允许用户与模型交互，并通过事件，视图调用（通知）控制器执行某些行为（例如调用
    JavaScript 函数）。


    视图可以创建为 HTML 视图、XML 视图、JSON 视图和 JavaScript 视图。`XML`视图是 SAP 推荐和首选的方法。使用`XML`视图的原因是应用结构更具可读性，而且`XML`视图也很容易在布局编辑器中显示。多年前，当`SAPUI5`刚推出时，JavaScript
    视图是创建应用的原始方式；然而，由于其复杂性和语言语法的原因，JavaScript 视图很快就成为了备选方案。


    3.  **控制器**作为对一个或多个绑定到视图的事件的响应而被触发。视图（HTML/XML/JavaScript）控件根据控件类型拥有不同类型的事件。当视图触发事件时，相应的`controller.js`文件中的
    JavaScript 函数会被执行。


    如上一段所述，根据所使用的控件类型，它们可能拥有不同类型的事件。一些常见的控件和事件如表 3-2 所示。


    **表 3-2** 常见的 SAPUI5 控件


    | 控件类型 | 事件 | 说明 |

    | --- | --- | --- |

    | `Button` | `Press` | 当用户点击按钮时 |

    | `Input` | `onKeyUp`、`onKeyDown` | 当用户输入时 |

    | `ComboBox` | `onSelectionChanged` | 当用户更改所选项目时 |

    | `Table` | `onItemPressed` | 当选中某个项目（行）时 |

    | `List` | `onItemPressed` | 当按下列表项时；此事件本质上与响应式表格控件中的事件非常相似 |


    这些事件可以直接从框架中使用，也可以通过应用内的额外自定义绑定来使用。如果框架没有提供所需事件，那么将自定义事件绑定到控件是一种常见操作。例如，我们可能希望将滚动事件绑定到应用，或从同一个控件调用多个事件。一些用例可能包括在`SAPUI5`输入字段上添加`keyUp`、`keyDown`、鼠标悬停（悬停在输入元素上）或`blur`（失去焦点时）事件。


    当使用`SAPUI5`库时，如果开发者导航到（UI5）*API 参考*选项卡，就能看到控件特有的事件。在主列表（左侧导航栏）中查找特定控件，然后即可看到该控件的*事件*（显示在应用右侧的详细信息部分），如图
    3-2 所示。


    ![../images/502765_1_En_3_Chapter/502765_1_En_3_Fig2_HTML.jpg](img/502765_1_En_3_Fig2_HTML.jpg)


    **图 3-2** SAPUI5 SDK API 参考选项卡


    花些时间浏览一下其他一些控件，以熟悉不同类型的事件，以及不同控件之间事件的差异。你不需要记住每个控件的每个事件或属性；但是，了解如何在 SDK 中找到与之相关的更多信息会很有帮助。此外，每个
    UI5 元素也可以附加到浏览器元素。框架非常灵活，可以将自定义事件包含到这些控件中，例如页面滚动、鼠标事件以及渲染前后的事件。


    除了单个控件拥有这些事件之外，在应用的生命周期中也会发生一些事件，视图的情况就是如此。每个视图都有一个生命周期。表 3-3 列出了视图的生命周期事件。


    **表 3-3** SAPUI5 视图生命周期事件


    | 视图事件 | 使用时机 |

    | --- | --- |

    | `onInit` | 在导航到视图后，视图被初始化时。此事件通常用于初始化应用要使用的某些值。在某些情况下，数据模型或控件直到下一组事件发生时才会被初始化。使用此事件时请注意调试。
    |

    | `beforeRendering` | 视图已被初始化，但并非所有控件都已渲染到屏幕上。如果在`onInit`事件期间数据模型尚未准备好，并且正好在控件显示到屏幕之前，可以使用此事件。其他用例可能包括从控件解绑事件。
    |

    | `afterRendering` | 视图已被初始化，控件已渲染到屏幕上，并且正好在将控制权交给用户之前。当应用需要在控件渲染到屏幕后修改控件行为时，此事件非常有用。此外，如果我们需要查询
    OData 服务并对应用应用额外逻辑，也可以使用此事件。 |

    | `beforeExit` | 在导航离开或关闭视图之前。 |


    通过在下图所示的*API 参考*选项卡中查找`XML`视图，可以在`SAPUI5` SDK 中找到相同的事件。请记住，可能存在从其他控件借用的事件，如图 3-3
    所示。


    ![../images/502765_1_En_3_Chapter/502765_1_En_3_Fig3_HTML.jpg](img/502765_1_En_3_Fig3_HTML.jpg)


    **图 3-3** XML 视图借用的控件事件

