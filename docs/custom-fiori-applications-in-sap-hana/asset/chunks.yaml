- fmt: 'In addition to the preceding table comparison, let us take a moment to understand
    the `SAPUI5 SDK` (Software Development Kit) page, as I will highlight important
    content and what readers trying to get into `SAPUI5` / Fiori development should
    be aware of.


    In Figures [1-14](#502765_1_En_1_Chapter.xhtml#Fig14) and [1-15](#502765_1_En_1_Chapter.xhtml#Fig15),
    we can observe the `SAPUI5 SDK` and the `OpenUI5 SDK` pages, respectively. They
    both have similar look and feel as well as the same structure; again, these different
    libraries are used for either SAP licensed development or for the open source
    equivalent of the UI5 framework.


    ![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig15_HTML.jpg](images/502765_1_En_1_Chapter/502765_1_En_1_Fig15_HTML.jpg)


    Figure 1-15


    Open UI5 SDK


    ![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig14_HTML.jpg](images/502765_1_En_1_Chapter/502765_1_En_1_Fig14_HTML.jpg)


    Figure 1-14


    SAPUI5 SDK


    In Figure [1-16](#502765_1_En_1_Chapter.xhtml#Fig16), you can see the `SAPUI5
    SDK` page. At the top of the page, there are some sections (tabs) into which the
    content is divided.


    ### Documentation


    In this section, the reader can find all the important documentation related to
    `SAPUI5` applications from walkthrough to create their first Fiori application,
    to understanding the deep concepts of Fiori applications.


    Other important information valuable to remember from this section is the version
    features, the version support, how to develop custom controls, themes, SAP Fiori
    CSS classes, and browser compatibility to mention some.


    Spending time in the Walkthrough section is extremely important as it shows how
    to build a Fiori application from beginning to end. It also shows different scenarios
    with the use of the `MVC` (Model View Controller) pattern. Whether you are building
    a new application or extending an SAP-delivered application, this section of the
    `SDK` is useful, and it is recommended to become familiar with it.


    ![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig16_HTML.jpg](images/502765_1_En_1_Chapter/502765_1_En_1_Fig16_HTML.jpg)


    Figure 1-16


    SAPUI5 SDK documentation page


    ### API Reference


    The API reference is very helpful since all the SAPUI5 controls are explained:
    the controls are broken down into properties, events, constructors, associations,
    aggregations, and their cardinality. This is shown in Figure [1-17](#502765_1_En_1_Chapter.xhtml#Fig17).


    In this `SAPUI5 SDK` section, the developer can obtain a full understanding of
    all the necessary attributes, inheritance, and behavior of each control. Furthermore,
    this section breaks down the `SAPUI5` controls based on the namespace (`sap.m`,
    `sap.apf`, `sap.ui`, `sap.f`…).


    When you decide to start building your Fiori applications and it requires controls
    from different namespaces in your `XML` views, make sure to include references
    to those namespaces. Missing namespaces is a common mistake done by developers
    when they start their venture in `SAPUI5`. Another common missed step is the lack
    of understanding of the available properties; spend some time reading through
    the API reference and familiarize yourself with some of the common controls such
    as tables, buttons, and input fields.


    ![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig17_HTML.jpg](images/502765_1_En_1_Chapter/502765_1_En_1_Fig17_HTML.jpg)


    Figure 1-17


    SAPUI5 SDK API reference


    ![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig18_HTML.jpg](images/502765_1_En_1_Chapter/502765_1_En_1_Fig18_HTML.jpg)


    Figure 1-18


    SAPUI5 SDK sample page


    ### Samples


    Yes, the SDK page provides sample application and code snippets that a developer
    can quickly see on the user interface, as shown in Figure [1-18](#502765_1_En_1_Chapter.xhtml#Fig18).
    As a developer learns more and more, some of the code snippets will be easy to
    remember, but it is still very helpful to know where to get these controls in
    case a new control is required when developing a new application. The important
    sections within this tab are:

    1.  The control navigation list shown on the left side of the application

    2.  The number of different scenarios shown in the list item

    3.  The version of the `SAPUI5` library being used (top right-hand side of the
    screen)

    4.  Code snippet icon shown as a `{ = }` right under the Change version and the
    magnifying glass icon on the top right-hand corner of Figure [1-18](#502765_1_En_1_Chapter.xhtml#Fig18)


    ![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig19_HTML.jpg](images/502765_1_En_1_Chapter/502765_1_En_1_Fig19_HTML.jpg)


    Figure 1-19


    SAPUI5 SDK demo apps


    ### Demo Apps


    SAP has provided some demo apps as shown in Figure [1-19](#502765_1_En_1_Chapter.xhtml#Fig19)
    so that developers can see what has been done, and how it was done, and if they
    need to, they get the code base in case their requirement is similar to the demo
    applications. I would like to highly recommend visiting and going over the Walkthrough
    application first to get a full understanding of all the moving pieces that exist
    in an SAP Fiori application. If you are able to follow this application and understand
    how the many pieces coordinate and work with each other, then it will be very
    easy to understand any other Fiori application whether you will be modifying an
    existing one or creating new from scratch.


    Make sure to spend enough time in this demo app section, especially in the Walkthrough
    as shown in Figure [1-19](#502765_1_En_1_Chapter.xhtml#Fig19).


    ![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig20_HTML.jpg](images/502765_1_En_1_Chapter/502765_1_En_1_Fig20_HTML.jpg)


    Figure 1-20


    SAPUI5 SDK tools page


    ### Tools


    This section points out the main tools required to build SAP Fiori applications,
    as shown in Figure [1-20](#502765_1_En_1_Chapter.xhtml#Fig20). These tools are
    used for development (`SAP Web IDE` or UI5 tooling), debugging (`UI5 inspector`),
    theme designer (in case you need a custom theme), and icons. Additional description
    of these tools is found next.


    In Figure [1-20](#502765_1_En_1_Chapter.xhtml#Fig20), you can see the description
    of the main tools and a link to learn more about them.


    ![../images/502765_1_En_1_Chapter/502765_1_En_1_Fig21_HTML.jpg](images/502765_1_En_1_Chapter/502765_1_En_1_Fig21_HTML.jpg)


    Figure 1-21


    SAP Cloud Platform custom theme designer


    ### SAP Web IDE


    This is the main development tool for SAP Fiori applications. It is a browser-based
    tool used to develop web and database applications. There are several versions
    of this type of tool, so please check out the required version and license requirements
    for your development. The `SAP Web IDE` can be installed locally (`SAP Web IDE`
    personal edition), there is a version on the SAP Cloud Platform called `SAP Web
    IDE Full stack`, and there is also a version for on-premise development which
    can also be accessed from the `SAP HANA Express` edition.


    ### UI Theme designer


    This tool, shown in Figure [1-21](#502765_1_En_1_Chapter.xhtml#Fig21), is recommended
    to be used if the `SAPUI5` application to be developed requires a custom theme
    and the Fiori application will not follow the standard Fiori concepts. Look inside
    this tool in the SAP Cloud Platform (or SAP Cloud Platform trial edition) and
    see if you can come up with your own custom-branded theme. This tool is extremely
    helpful as it allows the developer to reuse the class names and the developer
    may be able to change the colors dynamically and quickly see what their application
    may look like if the custom theme was utilized as the end product.'
