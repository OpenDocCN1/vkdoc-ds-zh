    two complex numbers. This can be checked for two complex numbers, ![ $$ {z}_1=2+3i
    $$ ](A458922_1_En_2_Chapter_IEq19.gif) and ![ $$ {z}_2=-3+4i $$ ](A458922_1_En_2_Chapter_IEq20.gif),
    as follows:


    ```

    1  −−>z1 = complex(2,3)

    2  z1 =

    3  2\. + 3.i

    4  −−>z2 = complex(−3,4)

    5  z2 =

    6  −3\. + 4.i

    7  −−>z1+z2 // summing two complex numbers

    8  ans =

    9  −1\. + 7.i

    10  −−>z1−z2 // subtracting two complex numbers

    11  ans =

    12  5\. − i

    13  −−>z1∗z2 // multiplying two complex numbers

    14  ans =

    15  −18\. − i

    16  −−>z1/z2 // dividing two complex numbers

    17  ans =

    18  0.24−0.68i

    19  −−>z1ˆ2 // complex number raised to the power 2

    20  ans =

    21  −5\. + 12.i

    22  −−>z1ˆz2 // complex number raised to the power another complex number

    23  ans =

    24  −2.0D−04 + 3.0D−04i

    25  −−>2∗z1 // complex number multiplied by a real number

    26  ans =

    27  4\. + 6.i

    28  −−>z1/2 // complex number divided by a real number

    29  ans =

    30  1\. + 1.5i

    31  −−>z1+2 // complex number added with a real number

    32  ans =

    33  4\. + 3.i

    34  −−>z1−2 // complex number and real number subtracted

    35  ans =

    36  3.i

    ```


    A real number can be understood as a complex number with the imaginary part as
    zero. When addition and subtraction of a complex number is performed, only the
    real part is operated. When a complex number is multiplied and/or divided by a
    real number, each real and imaginary part is operated accordingly.


    ## 2.15 Summary


    In this chapter, we have discussed the usage of different types of numbers and
    strings. We have illustrated operating on numbers and strings. It is important
    to keep in mind that all numerical computations are approximations because, due
    to the finite precision of numbers expressed on a computing machine, errors are
    introduced in the computation. Users can choose the precision of a number before
    a computation, but this should be done cautiously. Working with low-precision
    numbers occupies less storage and also computes faster; however, it is more inaccurate.
    Scilab enables defining complex numbers and these defined complex numbers can
    be operated using the same arithmetic operators as that of real numbers without
    any modification even though their rules of arithmetic are different.


    # 3. Working with Arrays


    ## 3.1 Introduction


    Matrix formulation of mathematical problems enables faster numerical computations.
    For a two-dimensional matrix, elements have a unique row and column index through
    which users can access them. Rows and columns can be attributed to different properties
    under study. In this way, users can fit data for two properties as a matrix and
    then use these matrices for numerical calculations. For example, suppose an element
    of a row is defined as 1 if a compound is a conductor, 2 if it is a semiconductor,
    and 3 if it is an insulator. Then the row vector (a matrix composed of only one
    row) `[1 0 0 3 2 1 3 0 1 0 3 2 1]` has information about 13 compounds. In a numerical
    calculation involving the conductive nature of a compound, this row vector (a
    13 × 1 matrix) can be utilized where 13 compounds can be simultaneously scanned
    mathematically.


    Scilab objects named `arrays` deal with defining matrices. Using different properties
    of this object, users can define various kinds of matrices. Built-in functions
    for matrix operations make it easier for a programmer to deal with large numbers
    of data by arranging them as a matrix in the desired format and performing array
    operations.'
  trans: '

    ### 2.14.5 复数运算


    复数运算涉及与实数类似的运算，例如加法、减法、乘法、除法、乘幂等。这些运算对于复数的规则略有不同。


    两个复数相加涉及将它们的实部和虚部分别相加，减法也是如此。假设我们定义两个复数如下：


    ![ $$ {\displaystyle \begin{array}{l}{z}_1={a}_1+{b}_1i\\ {}{z}_2={a}_2+{b}_2i\end{array}}
    $$ ](img/A458922_1_En_2_Chapter_Eque.gif)


    那么你可以定义它们的加法和减法：


    ![ $$ {\displaystyle \begin{array}{l}{z}_1+{z}_2=\left({a}_1+{a}_2\right)+\left({b}_1+{b}_2\right)i\\
    {}{z}_1-{z}_2=\left({a}_1+{a}_2\right)-\left({b}_1+{b}_2\right)i\end{array}} $$
    ](img/A458922_1_En_2_Chapter_Equf.gif)


    复数的乘法和除法运算则不是那么直接：


    ![ $$ {z}_1\times {z}_2=\left({a}_1\times {a}_2\right)+\left({a}_1\times {b}_2\right)i+\left({a}_2\times
    {b}_2\right)+\left({b}_1\times {b}_2\right)\left({i}²\right) $$ ](img/A458922_1_En_2_Chapter_Equg.gif)


    通过合并实部项和虚部项可以简化：


    ![ $$ {z}_1\times {z}_2=\left({a}_1{a}_2-{b}_1{b}_2\right)+\left({a}_1{b}_2+{a}_2{b}_1\right)i
    $$ ](img/A458922_1_En_2_Chapter_Equh.gif)


    因为 ![ $$ {i}²=-1 $$ ](img/A458922_1_En_2_Chapter_IEq14.gif)。将复数乘以或除以一个实数可以通过分别对实部和虚部进行乘法或除法来更简单地完成。


    一个复数 ![ $$ {z}_1={a}_1+{b}_1i $$ ](img/A458922_1_En_2_Chapter_IEq15.gif) 的共轭复数定义为
    ![ $$ {z}_1^{\ast }={a}_1-{b}_1i $$ ](img/A458922_1_En_2_Chapter_IEq16.gif)。从几何上看，![
    $$ {z}_1^{\ast } $$ ](img/A458922_1_En_2_Chapter_IEq17.gif) 是 z [1] 关于实轴的“反射”。因此，如果我们计算共轭两次，就会得到原来的数：


    ![ $$ {\left({z}_1^{\ast}\right)}^{\ast }={z}_1 $$ ](img/A458922_1_En_2_Chapter_IEq18.gif).


    复数的除法可以如下使用其共轭来进行：


    ![ $$ \frac{a_1+{b}_1i}{a_2+{b}_2i}=\frac{a_1+{b}_1i}{a_2+{b}_2i}\times \frac{a_2-{b}_2i}{a_2-{b}_2i}=\frac{a_1{a}_2+b{{}_1{}b}_2}{a_2²+b{2}²}+\frac{b_1{a}_2-{a}_1{b}_2}{a_2²+b{2}²}i
    $$ ](img/A458922_1_En_2_Chapter_Equi.gif)


    因此，将分母的共轭复数与分子和分母相乘，得到一个新的复数，这就是两个复数相除的结果。这可以用两个复数来检验：![ $$ {z}_1=2+3i $$ ](img/A458922_1_En_2_Chapter_IEq19.gif)
    和 ![ $$ {z}_2=-3+4i $$ ](img/A458922_1_En_2_Chapter_IEq20.gif)，如下所示：


    ```

    1  −−>z1 = complex(2,3)

    2  z1 =

    3  2\. + 3.i

    4  −−>z2 = complex(−3,4)

    5  z2 =

    6  −3\. + 4.i

    7  −−>z1+z2 // 两个复数相加

    8  ans =

    9  −1\. + 7.i

    10  −−>z1−z2 // 两个复数相减

    11  ans =

    12  5\. − i

    13  −−>z1∗z2 // 两个复数相乘

    14  ans =

    15  −18\. − i

    16  −−>z1/z2 // 两个复数相除

    17  ans =

    18  0.24−0.68i

    19  −−>z1ˆ2 // 复数求 2 次幂

    20  ans =

    21  −5\. + 12.i

    22  −−>z1ˆz2 // 复数求另一个复数的幂

    23  ans =

    24  −2.0D−04 + 3.0D−04i

    25  −−>2∗z1 // 复数乘以实数

    26  ans =

    27  4\. + 6.i

    28  −−>z1/2 // 复数除以实数

    29  ans =

    30  1\. + 1.5i

    31  −−>z1+2 // 复数与实数相加

    32  ans =

    33  4\. + 3.i

    34  −−>z1−2 // 复数与实数相减

    35  ans =

    36  3.i

    ```


    一个实数可以理解为虚部为零的复数。当复数进行加法和减法时，只对实部进行操作。当复数与实数相乘和/或相除时，实部和虚部都会相应地进行操作。


    ### 2.15 本章小结


    在本章中，我们讨论了不同类型数字和字符串的用法。我们演示了如何对数字和字符串进行操作。需要注意的是，所有数值计算都是近似值，因为由于计算设备上数字的有限精度，计算中会引入误差。用户可以在计算前选择数字的精度，但应谨慎操作。使用低精度数字占用的存储空间更小，计算速度也更快；但结果更不准确。Scilab
    能够定义复数，并且这些定义的复数可以使用与实数相同的算术运算符进行操作，无需任何修改，即使它们的算术规则不同。


    # 3. 使用数组


    ### 3.1 引言


    数学问题的矩阵化表述能够实现更快的数值计算。对于二维矩阵，元素具有唯一的行索引和列索引，用户可以通过它们来访问元素。行和列可以归因于研究中不同的属性。这样，用户可以将两个属性的数据拟合成一个矩阵，然后使用这些矩阵进行数值计算。例如，假设行中的一个元素定义为：如果某化合物是导体则为
    1，如果是半导体则为 2，如果是绝缘体则为 3。那么，行向量（仅由一行组成的矩阵）`[1 0 0 3 2 1 3 0 1 0 3 2 1]` 就包含了 13
    种化合物的信息。在涉及化合物导电性质的数值计算中，可以利用这个行向量（一个 13×1 矩阵），从而可以在数学上同时对 13 种化合物进行扫描。


    名为 `arrays` 的 Scilab 对象用于定义矩阵。利用该对象的不同属性，用户可以定义各种类型的矩阵。用于矩阵运算的内置函数使得程序员能够通过将大量数据按照所需格式排列成矩阵并执行数组操作，从而更容易地处理这些数据。

