- fmt: '# 1.6 Command Prompt


    Scilab presents a full-featured, interactive, command-line REPL (read-eval-print
    loop). The interactive shell of the Scilab programming language is commonly known
    as REPL because it does the following:


    - Reads what a user types

    - Evaluates what it reads

    - Prints out the return value after evaluation

    - Loops back and does it all over again


    This kind of interactive working environment proves very useful for interactive
    coding as well as for debugging. You can check the results of a particular code
    as soon as you finish writing it. The way to work with Scilab''s REPL is to write
    the code, analyze the results, and continue this process until the final result
    is computed. In addition to allowing a quick and easy evaluation of Scilab statements,
    it also showcases the following:


    - A searchable history

    - Tab completion

    - Many helpful key bindings

    - Help and documentation


    A section of the left side of a Scilab window shows the command `history`, which
    shows all the commands used at the command prompt. Clicking a particular command
    enables its execution at Scilab''s command prompt. This is a quick way to repeat
    commands. Alternatively, users can use the Up and Down arrow keys on a traditional
    keyboard of a computer to browse through the commands.


    The option of tab completion allows users to just type a few characters for a
    command and then press the Tab key to obtain either a list of options to choose
    from if there is more than one option, or it just completes the right syntax of
    the command. This feature is extremely useful since it avoids syntax errors, which
    are one of the leading causes of bugs.


    The key bindings depend on the operating systems. When you click various items
    on the menu bar (the top of Scilab''s main window), you can see the key bindings
    alongside the name of the options.


    Getting help with various topics and locating documentation is also quite easy
    in Scilab. You can simply put any argument as a string (characters enclosed within
    double quotes `" "`) to the built-in function `help()`. For example, we used the
    function `ver` earlier. Suppose you wish to know its proper usage and wish to
    see the complete documentation. You can type the following at the Scilab command
    prompt:


    ```

    1   −−>help("ver")

    ```


    This will open up a `help browser` window, as shown in Figure [1-2](#A458922_1_En_1_Chapter.html#Fig2).


    ![A458922_1_En_1_Fig2_HTML.jpg](A458922_1_En_1_Fig2_HTML.jpg)


    Figure 1-2


    Help browser window


    The help browser hosts all the built-in functions as well as other topics. You
    can learn Scilab using this browser window and can consult this window in case
    any questions come up during the development process. The Scilab community maintains
    very high-quality documentation, which has helped Scilab to become popular.


    Another way to get help on a topic is by clicking the `?` symbol in the menu bar,
    which opens up `Scilab Help` as one of the options. This requires the use of a
    mouse to locate the symbol and click.


    Sometimes users need to obtain a clear screen. To do this, they can use the `clc`
    command. This command presents a fresh command prompt, just as in the case of
    opening Scilab for the first time. It is worth noting that Scilab does not restart
    during this process. It stores all the variables and their respective values;
    it just clears the screen of all the previous content. Users can also use this
    command as a function by typing `clc(n)` where `n` can be an integer so that the
    command will clear those many numbers of lines from the previous session. If users
    type `clc()` instead, all lines are cleared from the screen.


    The symbol used for this Scilab command is `-->` to distinguish it from the MATLAB
    or Octave command prompt. This information is stored in the `prompt` variable
    and can be scanned as follows:


    ```

    1   −−>prompt

    2   ans =


    4   −−>

    ```


    REPL replies with the value `-->` i.e. symbol for Scilab prompt.


    ## 1.7 Variable Browser


    The variable browser lists the variables (explained later) used, their sizes,
    types, and visibility. Having this information on the screen helps users to track
    the memory usage and also avoid mixing up variable names. The variable browser
    is appended with new information when users add new variables or remove the same
    ones from calculations. The variable list can be emptied by the command `clear`,
    which removes the variables from the computer memory. This action can be verified
    by the empty contents of the variable browser.


    After any kind of activity at the variable browser, there is at least one variable
    named `ans` created in a Scilab session that stores the value of the last evaluated
    expression at the command, as verified by the following code:


    ```

    1   −−>2+2

    2   ans =


    4   4.


    7   −−>ans

    8   ans =


    10   4.

    ```


    ## 1.8 SciNotes


    SciNotes is an embedded Scilab text editor. The `SciNotes` window can be used
    to write multiline programs and can be opened via `Application -> SciNotes` from
    the menu bar. (See Figure [1-3](#A458922_1_En_1_Chapter.html#Fig3).)


    ![A458922_1_En_1_Fig3_HTML.jpg](A458922_1_En_1_Fig3_HTML.jpg)


    Figure 1-3


    SciNotes window


    It can also be opened using the command prompt by either typing `scinotes` or
    `editor`. The editor has features to create new windows, save the present session,
    cut, copy, and paste, as well as play the program (in other words, run the program).
    The output of the code is seen at Scilab''s command prompt. The command `scinote()`
    makes use of the built-in function. When an argument is given as the filename
    or filepath, then that particular file opens in the `SciNotes` environment. The
    filename must be given as a string. If an additional option, `''readonly''`, is
    added, then the file is opened in read-only mode; it cannot be edited. This prohibits
    unwanted editing of the code.


    ## 1.9 Summary


    Scilab offers an open source alternative for numerical computing. Even though
    users have to convert MATLAB code to make it compatible to Scilab, it is sometimes
    an exercise worthwhile since Scilab provides a rich ecosystem of engineering modules
    to perform complex mathematical calculations. In case of confusion, documentation
    for particular commands can be easily available using the `help` command. In this
    chapter, we have outlined the importance of using Scilab. Subsequent chapters
    will explain its usage for scientific computing.


    # 2. Working with Scilab


    ## 2.1 Working with Scilab


    As explained in Chapter [1](#A458922_1_En_1_Chapter.html), there are two ways
    to work within Scilab. The first way is to work at the command line by typing
    one command at a time. The partition titled "Scilab 6.0.0 Console" (shown in the
    middle part of Figure [1-1](#A458922_1_En_1_Chapter.html#Fig1)) presents the command
    line where the cursor is shaped as `-->`. You can write commands here for immediate
    execution. As an example, let''s start with writing the first program of any programming
    language—printing the words `Hello World` at the command prompt.


    ![A458922_1_En_2_Fig1_HTML.jpg](A458922_1_En_2_Fig1_HTML.jpg)


    Figure 2-1


    Variable browser window showing two variables


    This can be done by simply writing the following at the command prompt:


    ```

    1  −−>message = "Hello World!"

    2  message =

    3  Hello World!

    4  −−>disp(message)

    5  Hello World!

    ```


    As soon as the first command `message = "Hello World!"` is given, you can see
    that the window titled `Variable Browser` is populated by two variables: `ans`
    and `message`.


    The window also states properties of values stored in these variables. Both of
    them store the same value, which is a string of characters. The `ans` variable
    will get appended with new values depending on what is typed next at the command
    prompt, but the variable `message` will remain until it is assigned another value.'
