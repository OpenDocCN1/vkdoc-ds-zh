- fmt: "# Mesh Plots\n\nMesh plots are generated by joining mesh points defined by\
    \ coordinates. As an example, consider the code in Listing [4-23](#A458922_1_En_4_Chapter.html#Par76).\n\
    \n```\n// Program to explain the usage of mesh function\n\n[X,Y] = meshgrid(−5:0.5:5,\
    \ −5:.5:5);\nZ = sin(X)+cos(Y);\nmesh(X,Y,Z);\nListing 4-23\nmesh.sce\n```\n\n\
    Here, a 2D coordinate system is generated and stored in two arrays named `X` and\
    \ `Y`. For these points defining x and y, an equation is defined as follows:\n\
    \n![$$ z=\\mathit{\\sin}(x)+\\mathit{\\cos}(x) $$](A458922_1_En_4_Chapter_Equ2.gif)\n\
    \n(4.2)\n\nThese three values (one each from arrays `x`, `y`, and `z`) are fed\
    \ to the `mesh` function.\n\nThe result is shown in Figure [4-26](#A458922_1_En_4_Chapter.html#Fig26).\
    \ The three coordinates (`x`, `y`, and `z`) are defined by the corresponding elements\
    \ of vectors `X`, `Y`, and `Z`. These points are used to create the mesh plot.\n\
    \n![A458922_1_En_4_Fig26_HTML.gif](A458922_1_En_4_Fig26_HTML.gif)\n\nFigure 4-26\n\
    \n3D plot of an equation\n\n# 3D Histogram\n\nJust like 2D histograms, 3D histograms\
    \ give visual clues about segregation of data having 2D dependency. 3D visualization\
    \ is presented as vertical solid bars, as demonstrated in Listing [4-24](#A458922_1_En_4_Chapter.html#Par81).\n\
    \n```\n// Program to make a 3D histogram\n\nhist3d(5∗rand(10,10));\nhist3d(−5∗rand(10,10));\n\
    title('3D histogram')\nListing 4-24\nhist3d.sce\n```\n\nIn `hist3d.sce`, random\
    \ numbers are amplified and plotted on a 2D matrix. The random numbers generate\
    \ the height of the bar. Two histograms, one in the positive quadrant and one\
    \ in the negative quadrant, are generated. The result is shown in Figure [4-27](#A458922_1_En_4_Chapter.html#Fig27).\n\
    \n![A458922_1_En_4_Fig27_HTML.gif](A458922_1_En_4_Fig27_HTML.gif)\n\nFigure 4-27\n\
    \n3D histogram\n\n# Summary\n\nIn this chapter, we have presented a variety of\
    \ built-in functions for 2D and 3D plotting as well as for animations. With these\
    \ rich features, Scilab provides a nice developing environment for scientists\
    \ and engineers. The visualization tools presented in the chapter are comparable\
    \ to many commercial alternatives. Explaining each and every option for the plots\
    \ is beyond the scope of this chapter so we have only discussed the most relevant\
    \ functions. We advise users to study the documentation using the command `help\
    \ plot` and see the variety of options for 2D and 3D plotting along with options\
    \ to modify plot properties.\n\n# Data Through File Reading and Writing\n\n##\
    \ Introduction\n\nUsing the information in Chapter [4](#A458922_1_En_4_Chapter.html),\
    \ you can now formulate physical problems in terms of numerical computations and\
    \ solve them on digital computers. This process calls for the following requirements:\n\
    \n- Data should be in digital form (a digital file).\n- Computer programs should\
    \ be able to read the file and make arrays without errors.\n  - Error correction\
    \ will be an added feature in this case.\n  - If errors have been made, a mechanism\
    \ to check for those errors and give a warning to the user should be in place.\n\
    - Data should be stored as an array as per the data type and should be displayed\
    \ on demand in proper format.\n- Array operations on data will result in memory\
    \ usage in terms of reading and writing data on disks. This should be facilitated\
    \ by the system. Users should be able to check the status of memory as and when\
    \ required.\n- Post-processing tasks include visualizing data in various formats:\
    \ as a printout from a printer, as a graph on a terminal or printer/plotter, and\
    \ so on.\n- If a report for a particular experiment having input parameters, processing\
    \ data, and output as a file or graph can be generated, the task is made easier\
    \ for the user.\n\nScilab has some features for each of these requirements. In\
    \ this chapter, we will discuss some of the features that are related to handling\
    \ files both for inputting and outputting data in various formats.\n\n## File\
    \ Operations\n\nFile operations constitute an important part of solving computations.\
    \ It is important to note that the file system is OS (Operating System) dependent.\
    \ Since Unix/Linux has been the popular operating system for scientific and engineering\
    \ work, Scilab supports Unix/Linux commands for file management. When Scilab is\
    \ installed on Windows, you use the same commands for dealing with files as you\
    \ would with Linux since you always work in a Scilab micro-environment. The codes\
    \ in the following sections have been tested on Windows 8, MacOSX 10.12, and Ubuntu\
    \ 16.04 systems.\n\n### Users\n\nA computing system is accessed by different users\
    \ using an operating system. Each user defines and then works in a workspace to\
    \ avoid damaging another user’s files. After login, a user’s workspace becomes\
    \ active for that user. Scilab does not provide the facility of login for the\
    \ software, but when users log into their OS, their workspace for Scilab is activated\
    \ as well. (A public computer does not provide this facility.) A workspace is\
    \ made up of various files and folders. Files store data, and folders/directories\
    \ are just special files that store links to other files. Hence, multiple files\
    \ can be stored in one folder.\n\nThere are many operations that you can do with\
    \ a file object. Reading a file involves inputting the data in the file to a desired\
    \ location. When this location is the computer monitor and you have a text-visualization\
    \ tool, you can see the data as characters or symbols. When this location is a\
    \ program to accept the data in the file, it is read by the program and fed to\
    \ the desired function. Data come in a variety of formats if format interchanging\
    \ is required as per the requirement of input and output ends. Some files (Scilab’s\
    \ `.sci` and `.sce` files in the present case) need to be executed (that is, run\
    \ the program).\n\nFor all of the purposes mentioned, files are opened before\
    \ an operation and must be closed after an operation. The status of a file (whether\
    \ it’s open or closed) is shown by a flag (usually an integer number).\n\nSome\
    \ files are essential for the OS to define the behavior of a system. As a result,\
    \ these files should not be altered. Unwanted alterations are prevented by giving\
    \ permissions to users. “Reading” and “writing” a file are restricted by permissions.\
    \ The “administrator” (fondly called `admin`) is also called the “super user”\
    \ and has all the privileges and permissions to edit any file/folder. You need\
    \ to understand the defined user type on a particular computer system and then\
    \ issue commands accordingly. If you are not permitted to access certain folders\
    \ and input data is placed inside those files/folders, then, unless you ask the\
    \ `admin` to change the permission parameters, you will always get an error.\n\
    \nOn a public computer, `admin` privileges are usually not given. This restricts\
    \ `read`, `write`, and `execute` operations. When users are on a personal computer,\
    \ they usually declare themselves the super user and, thus, their account has\
    \ all the required privileges. On a computer shared by many users, the `admin`\
    \ assigns privileges to `read`, `write`, and `execute` selectively. Users must\
    \ seek the appropriate permission for a desired operation."
