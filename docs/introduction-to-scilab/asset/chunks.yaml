    矩阵对角线元素之和称为矩阵的迹。这由内置函数`trace()`给出，如下所示：


    ```

    1  −−>a = [1, 2, 3;2, 4, 6;3, 6, 9]

    2  a =

    3  1\.   2\.   3.

    4  2\.   4\.   6.

    5  3\.   6\.   9.

    6  −−>trace(a)

    7  ans =

    8  14.

    ```


    单位矩阵的自动生成是通过使用命令`eye(a,b)`完成的，其中`a`和`b`是行数和列数的值：


    ```

    1  −−>eye(2,3)

    2  ans =

    3  1\.     0\.     0.

    4  0\.     1\.     0.

    5  −−>a = eye(4,4)

    6  a =

    7  1\.    0\.    0\.    0.

    8  0\.    1\.    0\.    0.

    9  0\.    0\.    1\.    0.

    10  0\.    0\.    0\.    1.

    11  −−>det(a)

    12  ans =

    13  1.

    ```


    ### 3.3.7 向量模


    一个数学向量可以被定义为一个 1 × 3 的数组。内置函数`norm()`给出向量的模（大小）。这是从原点到向量的欧几里得距离。因此，如果一个向量定义如下：


    ![ $$ \overrightarrow{a}=A\overrightarrow{x}+B\overrightarrow{y}+C\overrightarrow{z}
    $$ ](A458922_1_En_3_Chapter_Equa.gif)


    其模可以定义为：


    ![ $$ N=\sqrt{A^2+{B}^2+{C}^2} $$ ](A458922_1_En_3_Chapter_Equb.gif)


    一个向量的单位向量是通过将该向量除以其模/大小得到的。在 Scilab 中可以轻松执行此操作：


    ```

    1  −−>a = [1 2 3]

    2  a =

    3  1\.    2\.    3.

    4  −−>norm(a)

    5  ans =

    6  3.74166

    7  −−>a = [1 2 3]/norm(a)

    8  a =

    9  0.26726    0.53452    0.80178

    ```


    ### 3.3.8 随机矩阵


    使用随机数生成器，可以通过命令`rand(a,b)`创建一个随机矩阵：


    ```

    1  −−>rand(4,5)

    2  ans =

    3  0.21132      0.66538      0.87822      0.72635      0.23122

    4  0.75604      0.62839      0.06837      0.19851      0.21646

    5  0.00022      0.84975      0.56085      0.54426      0.88339

    6  0.33033      0.68573      0.66236      0.23207      0.65251

    7  −−>rand(4,5)

    8  ans =

    9  0.30761      0.36164      0.33217      0.26931      0.04373

    10  0.93296      0.29223      0.59351      0.63257      0.48185

    11  0.21460      0.56642      0.50153      0.40520      0.26396

    12  0.31264      0.48265      0.43686      0.91847      0.41481

    13  −−>rand(1)

    14  ans =

    15  0.28065

    16  −−>rand(4,1)

    17  ans =

    18  0.12801

    19  0.77831

    20  0.21190

    21  0.11214

    22  −−>rand(1,4)

    23  ans =

    24  0.68569      0.15312      0.69709      0.84155

    ```


    请注意，上一个示例中生成的数字每次都会不同，即使在同一台机器上也是如此，因为它们本质上是随机的。默认情况下，它们均匀分布在区间 (0, 1) 内。向量就是一个行向量，因此可以通过命令`rand(a)`随机生成。`help("rand")`提供了关于随机数生成器的各种其他特性和参数的详细描述：


    ```

    1  −−>rand(4,5, ''uniform'')

    2  ans =

    3  0.11384      0.68540      0.38738      0.37601      0.26386

    4  0.19983      0.89062      0.92229      0.73409      0.52536

    5  0.56187      0.50422      0.94882      0.26158      0.53762

    6  0.58962      0.34936      0.34353      0.49935      0.11999

    7  −−>rand(4,5, ''normal'')

    8  ans =

    9  − 1.28586   − 0.37782   − 0.45753    0.01164     1.74874

    10    0.59712       1.14562       0.56232    0.22327      1.86518

    11    0.61078       2.57491   − 0.64533  − 1.43445      0.16459

    12  − 1.05679   − 0.50056   − 0.36478    1.73638    − 1.03589

    ```


    `''normal''`和`''uniform''`函数提供正态分布和均匀分布的随机数。正态分布的均值为 0，方差为 1。所有随机数遵循高斯分布，其均值为
    0，分布在 -1 和 1 之间。另一方面，默认的随机数分布是`''uniform''`，这些数字在 0 和 1 之间生成。


    一个更精细的内置函数叫做`grand()`，它提供了多种选择分布和设置数字集限制的选项。只需输入`help("grand")`即可获得其用法的详细文档。


    ### 3.3.9 索引


    矩阵的每个元素由两个数字表征：行号和列号。这些数字用于精确定位一个元素并对其进行操作。它们被称为元素的索引。赋值运算符可用于设置特定索引处的值，以生成具有更新值的新矩阵。以下示例说明了这些概念：


    ```

    1 −−>a = rand(3,4)

    2 a =

    3 0.38850    0.04070    0.44219     0.01109

    4 0.67899    0.64673    0.48739     0.84484

    5 0.37286    0.81418    0.76592     0.89999

    6 −−>a(2,1) // 位于第2行第1列的元素

    7 ans =

    8 0.67899

    9 −−>a(4,2) // 位于第4行第2列的元素不存在

    10  Invalid index.

    11  −−>a(2,2)=0 // 将第2行第2列的元素设置为0

    12  a =

    13  0.38850    0.04070    0.44219    0.01109

    14  0.67899    0\.         0.48739    0.84484

    15  0.37286    0.81418    0.76592    0.89999

    ```


    需要注意的是，与某些编程语言中索引从 0 开始不同，在 Scilab 中索引从 1 开始，并且 Scilab 不接受负数作为索引。


    ### 3.3.10 使用索引创建新向量


    在以下示例中，`b`是由向量`a`形成的新向量，其连续元素由取自`a`的索引向量`[2 4 2 4]`的元素组成：


    ```

    1  −−>a = [1 4 1 3 1 4 1 4 2 4 5]

    2  a =

    3  1\.   4\.   1\.   3\.   1\.   4\.   1\.   4\.   2\.   4\.   5.

    4  −−>b = a([2 4 2 4])

    5  b =

    6  4\.   3\.   4\.   3.

    ```


    相同的方法可以用于二维和更高维度的矩阵：


    ```

    1  −−>a

    2  a =

    3  0.61618   0.38019   0.76251   0.40089

    4  0.63517   0.35260   0.7284    0.55388

    5  0.15988   0.91202   0.27883   0.27174

    6  −−>a([1, 2], [2, 3])

    7  ans =

    8  0.38019   0.76251

    9  0.35260   0.7284

    ```


    请注意，由于逗号运算符的使用是可选的，向量和矩阵将通过简单地插入一个空白来定义。'
  raw: '### 3.3.6 trace()


    The sum of the diagonal elements of a matrix is called the trace of the matrix.
    This is given by the built-in `trace()` function as follows:


    ```

    1  −−>a = [1, 2, 3;2, 4, 6;3, 6, 9]

    2  a =

    3  1\.   2\.   3.

    4  2\.   4\.   6.

    5  3\.   6\.   9.

    6  −−>trace(a)

    7  ans =

    8  14.

    ```


    The automatic generation of an identity matrix is done by using the command `eye(a,b)`
    where `a` and `b` are values of the number of rows and columns:


    ```

    1  −−>eye(2,3)

    2  ans =

    3  1\.     0\.     0.

    4  0\.     1\.     0.

    5  −−>a = eye(4,4)

    6  a =

    7  1\.    0\.    0\.    0.

    8  0\.    1\.    0\.    0.

    9  0\.    0\.    1\.    0.

    10  0\.    0\.    0\.    1.

    11  −−>det(a)

    12  ans =

    13  1.

    ```


    ### 3.3.7 Magnitude of a Vector


    A mathematical vector can be defined as a 1 × 3 array. The built-in function `norm()`
    gives the magnitude of a vector. This is the Euclidean distance from the origin
    to the vector. So, if a vector is defined as the following:


    ![ $$ \overrightarrow{a}=A\overrightarrow{x}+B\overrightarrow{y}+C\overrightarrow{z}
    $$ ](A458922_1_En_3_Chapter_Equa.gif)


    its magnitude can be defined as:


    ![ $$ N=\sqrt{A^2+{B}^2+{C}^2} $$ ](A458922_1_En_3_Chapter_Equb.gif)


    A unit vector for a vector is obtained by dividing the vector by its own norm/magnitude.
    This operation can be performed with ease in Scilab:


    ```

    1  −−>a = [1 2 3]

    2  a =

    3  1\.    2\.    3.

    4  −−>norm(a)

    5  ans =

    6  3.74166

    7  −−>a = [1 2 3]/norm(a)

    8  a =

    9  0.26726    0.53452    0.80178

    ```


    ### 3.3.8 Random Matrix


    Using random number generators, a random matrix can be created by the command
    `rand(a,b)`:


    ```

    1  −−>rand(4,5)

    2  ans =

    3  0.21132      0.66538      0.87822      0.72635      0.23122

    4  0.75604      0.62839      0.06837      0.19851      0.21646

    5  0.00022      0.84975      0.56085      0.54426      0.88339

    6  0.33033      0.68573      0.66236      0.23207      0.65251

    7  −−>rand(4,5)

    8  ans =

    9  0.30761      0.36164      0.33217      0.26931      0.04373

    10  0.93296      0.29223      0.59351      0.63257      0.48185

    11  0.21460      0.56642      0.50153      0.40520      0.26396

    12  0.31264      0.48265      0.43686      0.91847      0.41481

    13  −−>rand(1)

    14  ans =

    15  0.28065

    16  −−>rand(4,1)

    17  ans =

    18  0.12801

    19  0.77831

    20  0.21190

    21  0.11214

    22  −−>rand(1,4)

    23  ans =

    24  0.68569      0.15312      0.69709      0.84155

    ```


    Please note that the numbers generated in the previous example will be different
    each time, even on the same machine, since they are supposed to be random in nature.
    By default, they are uniformly distributed over the interval (0, 1). A vector
    is simply a row vector so it can be generated randomly by the command `rand(a)`.
    `help(“rand”)` gives a detailed description about various other features and arguments
    of a random number generator:


    ```

    1  −−>rand(4,5, ''uniform'')

    2  ans =

    3  0.11384      0.68540      0.38738      0.37601      0.26386

    4  0.19983      0.89062      0.92229      0.73409      0.52536

    5  0.56187      0.50422      0.94882      0.26158      0.53762

    6  0.58962      0.34936      0.34353      0.49935      0.11999

    7  −−>rand(4,5, ''normal'')

    8  ans =

    9  − 1.28586   − 0.37782   − 0.45753    0.01164     1.74874

    10    0.59712       1.14562       0.56232    0.22327      1.86518

    11    0.61078       2.57491   − 0.64533  − 1.43445      0.16459

    12  − 1.05679   − 0.50056   − 0.36478    1.73638    − 1.03589

    ```


    The `''normal''` and `''uniform''` functions provide normal and uniform distributions
    of random numbers. The normal distribution has a mean at 0 and variance 1\. All
    the random numbers follow Gaussian distribution with their mean at 0 and distributed
    between −1 and 1\. On the other hand, default random number distribution is `''uniform''`
    and these numbers are generated between 0 and 1.


    A more refined built-in function named `grand()` gives a variety of options to
    choose distributions and set limits for the set of numbers. Simply typing `help("grand")`
    provides detailed documentation for its usage.


    ### 3.3.9 Indexing


    Each element of the matrix is characterized by two numbers, the row number and
    the column number. These numbers are used to pinpoint an element and operate on
    that. They are called an index of elements. The assignment operator can be used
    to set the value at a particular index to produce a new matrix with updated value(s).
    The following example illustrates these concepts:


    ```

    1 −−>a = rand(3,4)

    2 a =

    3 0.38850    0.04070    0.44219     0.01109

    4 0.67899    0.64673    0.48739     0.84484

    5 0.37286    0.81418    0.76592     0.89999

    6 −−>a(2,1) // element at row 2 and column 1

    7 ans =

    8 0.67899

    9 −−>a(4,2) // element at row 4 and column 2 does not exist

    10  Invalid index.

    11  −−>a(2,2)=0 // setting element at row 2 column 2 to 0

    12  a =

    13  0.38850    0.04070    0.44219    0.01109

    14  0.67899    0\.         0.48739    0.84484

    15  0.37286    0.81418    0.76592    0.89999

    ```


    It is important to note that, unlike some programming languages where indices
    start from 0, in Scilab indices start from 1 and Scilab does not take negative
    numbers as indices.


    ### 3.3.10 Using Indices to Make New Vectors


    In the following example, `b` is a new vector formed from vector `a` where successive
    elements are made up of elements taken from `a` index vector `[2 4 2 4]`:


    ```

    1  −−>a = [1 4 1 3 1 4 1 4 2 4 5]

    2  a =

    3  1\.   4\.   1\.   3\.   1\.   4\.   1\.   4\.   2\.   4\.   5.

    4  −−>b = a([2 4 2 4])

    5  b =

    6  4\.   3\.   4\.   3.

    ```


    The same method can be employed for two-dimensional and higher-dimensional matrices:


    ```

    1  −−>a

    2  a =

    3  0.61618   0.38019   0.76251   0.40089

    4  0.63517   0.35260   0.7284    0.55388

    5  0.15988   0.91202   0.27883   0.27174

    6  −−>a([1, 2], [2, 3])

    7  ans =

    8  0.38019   0.76251

    9  0.35260   0.7284

    ```


    Please note that since the use of the comma operator is optional, vectors and
    matrices will be defined by simply inserting a whitespace.'
  trans: '

    ### 3.3.6 `trace()`


    矩阵对角线元素之和称为矩阵的迹。这由内置函数`trace()`给出，如下所示：


    ```

    1  −−>a = [1, 2, 3;2, 4, 6;3, 6, 9]

    2  a =

    3  1\.   2\.   3.

    4  2\.   4\.   6.

    5  3\.   6\.   9.

    6  −−>trace(a)

    7  ans =

    8  14.

    ```


    单位矩阵的自动生成是通过使用命令`eye(a,b)`完成的，其中`a`和`b`是行数和列数的值：


    ```

    1  −−>eye(2,3)

    2  ans =

    3  1\.     0\.     0.

    4  0\.     1\.     0.

    5  −−>a = eye(4,4)

    6  a =

    7  1\.    0\.    0\.    0.

    8  0\.    1\.    0\.    0.

    9  0\.    0\.    1\.    0.

    10  0\.    0\.    0\.    1.

    11  −−>det(a)

    12  ans =

    13  1.

    ```


    ### 3.3.7 向量模


    一个数学向量可以被定义为一个 1 × 3 的数组。内置函数`norm()`给出向量的模（大小）。这是从原点到向量的欧几里得距离。因此，如果一个向量定义如下：


    ![ $$ \overrightarrow{a}=A\overrightarrow{x}+B\overrightarrow{y}+C\overrightarrow{z}
    $$ ](img/A458922_1_En_3_Chapter_Equa.gif)


    其模可以定义为：


    ![ $$ N=\sqrt{A²+{B}²+{C}²} $$ ](img/A458922_1_En_3_Chapter_Equb.gif)


    一个向量的单位向量是通过将该向量除以其模/大小得到的。在 Scilab 中可以轻松执行此操作：


    ```

    1  −−>a = [1 2 3]

    2  a =

    3  1\.    2\.    3.

    4  −−>norm(a)

    5  ans =

    6  3.74166

    7  −−>a = [1 2 3]/norm(a)

    8  a =

    9  0.26726    0.53452    0.80178

    ```


    ### 3.3.8 随机矩阵


    使用随机数生成器，可以通过命令`rand(a,b)`创建一个随机矩阵：


    ```

    1  −−>rand(4,5)

    2  ans =

    3  0.21132      0.66538      0.87822      0.72635      0.23122

    4  0.75604      0.62839      0.06837      0.19851      0.21646

    5  0.00022      0.84975      0.56085      0.54426      0.88339

    6  0.33033      0.68573      0.66236      0.23207      0.65251

    7  −−>rand(4,5)

    8  ans =

    9  0.30761      0.36164      0.33217      0.26931      0.04373

    10  0.93296      0.29223      0.59351      0.63257      0.48185

    11  0.21460      0.56642      0.50153      0.40520      0.26396

    12  0.31264      0.48265      0.43686      0.91847      0.41481

    13  −−>rand(1)

    14  ans =

    15  0.28065

    16  −−>rand(4,1)

    17  ans =

    18  0.12801

    19  0.77831

    20  0.21190

    21  0.11214

    22  −−>rand(1,4)

    23  ans =

    24  0.68569      0.15312      0.69709      0.84155

    ```


    请注意，上一个示例中生成的数字每次都会不同，即使在同一台机器上也是如此，因为它们本质上是随机的。默认情况下，它们均匀分布在区间 (0, 1) 内。向量就是一个行向量，因此可以通过命令`rand(a)`随机生成。`help("rand")`提供了关于随机数生成器的各种其他特性和参数的详细描述：


    ```

    1  −−>rand(4,5, ''uniform'')

    2  ans =

    3  0.11384      0.68540      0.38738      0.37601      0.26386

    4  0.19983      0.89062      0.92229      0.73409      0.52536

    5  0.56187      0.50422      0.94882      0.26158      0.53762

    6  0.58962      0.34936      0.34353      0.49935      0.11999

    7  −−>rand(4,5, ''normal'')

    8  ans =

    9  − 1.28586   − 0.37782   − 0.45753    0.01164     1.74874

    10    0.59712       1.14562       0.56232    0.22327      1.86518

    11    0.61078       2.57491   − 0.64533  − 1.43445      0.16459

    12  − 1.05679   − 0.50056   − 0.36478    1.73638    − 1.03589

    ```


    `''normal''`和`''uniform''`函数提供正态分布和均匀分布的随机数。正态分布的均值为 0，方差为 1。所有随机数遵循高斯分布，其均值为
    0，分布在 -1 和 1 之间。另一方面，默认的随机数分布是`''uniform''`，这些数字在 0 和 1 之间生成。


    一个更精细的内置函数叫做`grand()`，它提供了多种选择分布和设置数字集限制的选项。只需输入`help("grand")`即可获得其用法的详细文档。


    ### 3.3.9 索引


    矩阵的每个元素由两个数字表征：行号和列号。这些数字用于精确定位一个元素并对其进行操作。它们被称为元素的索引。赋值运算符可用于设置特定索引处的值，以生成具有更新值的新矩阵。以下示例说明了这些概念：


    ```

    1 −−>a = rand(3,4)

    2 a =

    3 0.38850    0.04070    0.44219     0.01109

    4 0.67899    0.64673    0.48739     0.84484

    5 0.37286    0.81418    0.76592     0.89999

    6 −−>a(2,1) // 位于第 2 行第 1 列的元素

    7 ans =

    8 0.67899

    9 −−>a(4,2) // 位于第 4 行第 2 列的元素不存在

    10  Invalid index.

    11  −−>a(2,2)=0 // 将第 2 行第 2 列的元素设置为 0

    12  a =

    13  0.38850    0.04070    0.44219    0.01109

    14  0.67899    0\.         0.48739    0.84484

    15  0.37286    0.81418    0.76592    0.89999

    ```


    需要注意的是，与某些编程语言中索引从 0 开始不同，在 Scilab 中索引从 1 开始，并且 Scilab 不接受负数作为索引。


    ### 3.3.10 使用索引创建新向量


    在以下示例中，`b`是由向量`a`形成的新向量，其连续元素由取自`a`的索引向量`[2 4 2 4]`的元素组成：


    ```

    1  −−>a = [1 4 1 3 1 4 1 4 2 4 5]

    2  a =

    3  1\.   4\.   1\.   3\.   1\.   4\.   1\.   4\.   2\.   4\.   5.

    4  −−>b = a([2 4 2 4])

    5  b =

    6  4\.   3\.   4\.   3.

    ```


    相同的方法可以用于二维和更高维度的矩阵：


    ```

    1  −−>a

    2  a =

    3  0.61618   0.38019   0.76251   0.40089

    4  0.63517   0.35260   0.7284    0.55388

    5  0.15988   0.91202   0.27883   0.27174

    6  −−>a([1, 2], [2, 3])

    7  ans =

    8  0.38019   0.76251

    9  0.35260   0.7284

    ```


    请注意，由于逗号运算符的使用是可选的，向量和矩阵将通过简单地插入一个空白来定义。

