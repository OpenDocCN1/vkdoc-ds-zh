    polarplot.sce

    ```


    ## 4.3 特殊图表


    ### 4.3.1 直方图


    直方图传统上用于可视化不同范围内发生的事件数量。Scilab 为此提供了一个有用的函数 `histplot()`，它接收表示区间数量的输入和以数组形式提供的数据。例如，在代码清单
    4-6 中名为 `hist.sce` 的代码中，随机数的归一化分布图如图 4-9 所示。


    ![A458922_1_En_4_Fig9_HTML.gif](img/A458922_1_En_4_Fig9_HTML.gif)


    图 4-9

    直方图


    ```

    1  // 绘制直方图的程序

    2  n = rand(1,10e4,''normal'');   // 归一化高斯随机样本

    3  bins=20

    4  histplot(bins,n)

    5  title(''绘制随机数的直方图'')

    6  xlabel(''x'')

    7  ylabel(''y'')

    代码清单 4-6

    hist.sce

    ```


    直方图用于展示采样数据。从数据集中，我们可以根据数据点的值将其划分到指定数量的区间中，并可视化哪些值域占主导地位。这提供了关于系统的有用信息。例如，遵循正态分布的值代表了那些总是遵循某种统计规律的系统。在图
    4-9 所示的当前示例中，大部分数据事件发生在中间区域。如果此图表示在两个原子之间找到电子的概率，那么我们可以得出结论，电子主要被发现于两个原子的中间。如果此图表示班级学生获得的成绩，那么我们可以推断，获得非常好或非常差（图的两端）成绩的学生很少，而大多数学生的成绩接近
    50%。


    ### 4.3.2 `matplot`


    为了绘制代表特定值的颜色，使用 `matplot` 命令，如代码清单 4-7 所示，并在图 4-10 中加以说明。


    ![A458922_1_En_4_Fig10_HTML.gif](img/A458922_1_En_4_Fig10_HTML.gif)


    图 4-10

    矩阵 `[1 2 3 4;5 4 3 6]` 的 `matplot` 图


    ```

    1  // 使用 Matplot 函数绘图的程序

    2  x = [1 2 3 4;5 4 3 6]

    3  Matplot(x)

    4  grayplot(x,y,m)

    5  xtitle(''使用 Matplot'')

    6  xlabel(''x'')

    7  ylabel(''y'')

    代码清单 4-7

    matplot.sce

    ```


    ### 4.3.3 `grayplot`


    有时，我们需要在二维图上观察一个二维函数的值。这通过可视化函数值 `z` 在 `x` 和 `y` 坐标上的分量来实现。`grayplot` 在由 `x` 和
    `y` 定义的网格上，绘制一个由 `z` 给出的表面的二维图。网格上的每个矩形根据矩形四个角上 `z` 的平均值，填充以灰度或颜色级别。（参见代码清单 4-8
    和图 4-11。）


    ![A458922_1_En_4_Fig11_HTML.gif](img/A458922_1_En_4_Fig11_HTML.gif)


    图 4-11

    随机数的 `grayplot` 图


    ```

    1  // 使用 grayplot 函数绘图的程序

    2  x = −10:10;

    3  y = −10:10;

    4  m = rand(21,21);

    5  grayplot(x,y,m)

    6  xtitle(''对随机数使用 grayplot'')

    7  xlabel(''x'')

    8  ylabel(''y'')

    代码清单 4-8

    grayplot.sce

    ```


    图 4-11 显示了根据 `z` 值（在此例中由随机数给出）的颜色值。每次运行该图时，都会得到不同的结果，因为 `z` 值是由随机数给出的。实际上，随机数生成算法的效果可以通过
    `grayplot` 检查两种颜色是否临近分布来进行可视化检验。


    ### 4.3.4 `champ`


    科学和工程研究涉及矢量场的理论研究。在理论和实践研究中，根据给定的方程绘制矢量场有时非常重要。矢量最好用箭头来描述。为了提供此功能，`champ` 绘制二维矢量场。箭头的长度与场强成正比。（参见代码清单
    4-9 和图 4-12。）


    ![A458922_1_En_4_Fig12_HTML.gif](img/A458922_1_En_4_Fig12_HTML.gif)


    图 4-12

    使用 `champ` 绘制矢量场


    ```

    1  // 使用 champ 函数绘制矢量场的程序

    2  x = linspace(−1,1,10);

    3  y = linspace(−1,1,10);

