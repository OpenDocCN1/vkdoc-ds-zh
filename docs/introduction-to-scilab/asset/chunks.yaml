  raw: '## 3.10 Finding Roots for Sets of Linear Equations


    As an example to practically apply arrays to solve real-world problems, let’s
    use arrays to find roots of a set of linear equations. Let’s assume that we have
    the following:


    ![ $$ 2x+4y-3z=4 $$ ](A458922_1_En_3_Chapter_Equ1.gif)


    (3.1)


    ![ $$ -2x-3y+2z=-3 $$ ](A458922_1_En_3_Chapter_Equ2.gif)


    (3.2)


    ![ $$ 4x+6y-8z=1 $$ ](A458922_1_En_3_Chapter_Equ3.gif)


    (3.3)


    We wish to find those values of x, y, and z for which all three equations hold
    true. To do the same, the first matrix form of these equations can be written
    as follows:


    ![ $$ \left[\begin{array}{ccc}2& 4& -4\\ {}-2& -3& 2\\ {}4& 6& -8\end{array}\right]\times
    \left[\begin{array}{c}x\\ {}y\\ {}z\end{array}\right]=\left[\begin{array}{c}4\\
    {}-3\\ {}1\end{array}\right] $$ ](A458922_1_En_3_Chapter_Equ4.gif)


    (3.4)


    If we assume that


    ![ $$ A=\left[\begin{array}{ccc}2& 4& -4\\ {}-2& -3& 2\\ {}4& 6& -8\end{array}\right]
    $$ ](A458922_1_En_3_Chapter_Equ5.gif)


    (3.5)


    ![ $$ X=\left[\begin{array}{c}x\\ {}y\\ {}z\end{array}\right] $$ ](A458922_1_En_3_Chapter_Equ6.gif)


    (3.6)


    ![ $$ B=\left[\begin{array}{c}4\\ {}-3\\ {}1\end{array}\right] $$ ](A458922_1_En_3_Chapter_Equ7.gif)


    (3.7) then we can write


    ![ $$ Ax=B $$ ](A458922_1_En_3_Chapter_Equ8.gif)


    (3.8) for which the solution is


    ![ $$ X={A}^{-1}B $$ ](A458922_1_En_3_Chapter_Equ9.gif)


    (3.9)


    This can be found with ease in Scilab using just a one-line command:


    ```

    1  −−>A = [2,4,−4;−2,−3,2;4,6,−8]

    2  A =


    4  2\.    4\.    −4.

    5  −2\.   −3\.    2.

    6  4\.    6\.    −8.


    9  −−>B = [4; − 3;1]

    10  B =


    12  4.

    13  −3.

    14  1.


    16  −−>A\B

    17  ans =


    19  −2.5

    20  3.5

    21  1.25

    ```


    Thus, x = −2.5, y = 3.5, and z = 1.25 satisfy the equations. In this way, Scilab
    can help perform complex matrix calculations with ease.


    ## 3.11 Summary


    Array-based computing lies at the very heart of modern computational techniques.
    Scilab presents a very suitable platform to perform these techniques with ease.
    A variety of predefined functions enable users to save time while prototyping
    a problem. Flexible methods to define multidimensional arrays and performing fast
    computation are the main necessitites of our times. Most of the time spent during
    a simulation is either in loops or in array operations. Predefined array operations
    have been optimized with algorithms for reliability, time efficiency, and effective
    memory management.


    # 4. Plotting


    ## 4.1 Introduction


    Without visualization, numerical computations are difficult to understand and
    eventually judge. Producing publication-quality images of complex plots that give
    a meaningful analysis of numerical results has been a challenge for scientists
    all over the world. Many commercial softwares satisfy this need. Scilab also provides
    this facility quite efficiently. Its plotting features includs choosing from various
    types of plots in 2D and 3D regimes; decorating plots with additional information
    such as titles, labeled axes, grids, and data labels; and writing equations and
    other important information about the data. The following sections will describe
    these actions in detail. It is worth mentioning that plotting capabilities are
    essential to certain numerical analysis experiments since visual directions from
    the progressive steps give an intuitive understanding of the problem under consideration.


    ## 4.2 2D Plotting


    ### 4.2.1 plot(x,y)


    Since we need data on two axes to be plotted, we first need to create them. Let’s
    assume that the x`-`axis has 100 linearly spaced data points and the points on
    the y-axis are defined by an equation, as illustrated in Figure [4-1](#A458922_1_En_4_Chapter.html#Fig1):


    ![ $$ y={x}^2 $$ ](A458922_1_En_4_Chapter_Equa.gif)


    ![A458922_1_En_4_Fig1_HTML.gif](A458922_1_En_4_Fig1_HTML.gif)


    Figure 4-1


    y = x²


    ```

    1  >> x = linspace(0,100,100);

    2  >> y = x.ˆ2

    3  >> plot(x,y)

    ```


    First, we define a variable `x` and place 100 equally spaced data points from
    0 to 100\. This makes a 1 x 100 matrix. Using a scalar operation of exponentiation,
    we define a variable `y` as x². It is important to note that this operation is
    defined using an elementwise operator so that each element of matrix `x` is operated
    by the operator. Without this approach, the array would have to be squared, that
    is, multipled by itself. This would produce an error since an n × m matrix can
    only be multipled by a m × n matrix. Finally, one can use the function `plot()`,
    which takes two arguments as the x-axis and y-axis data points.


    Typing `help plot` or `help''plot''` at the command prompt gives useful insight
    into this wonderful function written to plot two-dimensional data. By default,
    successive plots are superposed. To clear the previous plot, use `clf()`. Also,
    the plot function can evaluate the input arguments:


    ```

    1  −−>plot(x = linspace(0,100,100),x.ˆ2.5,''r∗'')

    ```


    The result of this line code is shown in Figure [4-2](#A458922_1_En_4_Chapter.html#Fig2).
    Please note that the third argument, a string: `"r*"`, plots the data with * at
    each point of input array.


    ![A458922_1_En_4_Fig2_HTML.gif](A458922_1_En_4_Fig2_HTML.gif)


    Figure 4-2


    y = x²


    Multiple plots can be plotted using the `plot()` command. As an example, let’s
    plot sin(x) and cos(x) functions between −π and π. The following is the first
    version of the code:


    ```

    1  −−>x = linspace(−%pi,%pi,100);

    2  −−>plot(x,sin(x),''r∗'',x,cos(x),''b−'')

    ```


    The following code is the second version of the code:


    ```

    1  −−>x = linspace(−%pi,%pi,100);

    2  −−>plot(x,sin(x),''r∗'')

    3  −−>plot(x,cos(x),''b−'')

    ```


    Both codes produce similar figures because, in the second version, the second
    plot is overwritten on the first plot to produce multiple plots on the same figure
    window. Figure [4-3](#A458922_1_En_4_Chapter.html#Fig3) shows the result where
    sin(x) and cos(x) are plotted with * and - markers.


    ![A458922_1_En_4_Fig3_HTML.gif](A458922_1_En_4_Fig3_HTML.gif)


    Figure 4-3


    sin(x) and cos(x)


    ### 4.2.2 plot2d(), plot2d2(), plot2d3(), and plot2d4()


    The `plot2d` command works similarly to the `plot` command. In addition, some
    other variations of these functions exist with respect to specialized way in which
    plots are plotted:


    1.  `plot2d2` same as `plot2d,` but the curve is supposed to be piecewise constant
     

    2.  `plot2d3` same as `plot2d,` but the curve is plotted with vertical bars  

    3.  `plot2d4` same as `plot2d,` but the curve is plotted with arrows  


    Listings [4-1](#A458922_1_En_4_Chapter.html#Par17), [4-2](#A458922_1_En_4_Chapter.html#Par18),
    [4-3](#A458922_1_En_4_Chapter.html#Par19), and [4-4](#A458922_1_En_4_Chapter.html#Par20)
    illustrate their usage. Figures [4-4](#A458922_1_En_4_Chapter.html#Fig4) and [4-5](#A458922_1_En_4_Chapter.html#Fig5)
    show how they are represented graphically.


    ```

    1  // Program to plot using plot2d function

    2  x = linspace(−%pi,%pi,20)

    3  plot2d(x,sin(x))

    4  xtitle(''Graph for plotting sin(x) using plot2d'')

    5  xlabel(''angle'')

    6  ylabel(''sin(x)'')

    Listing 4-1

    plot2d.sce

    ```


    ```

    1  // Program to plot using plot2d2 function

    2  x = linspace(−%pi,%pi,20)

    3  plot2d2(x,sin(x))

    4  xtitle(''Graph for plotting sin(x) using plot2d2'')

    5  xlabel(''angle'')

    6  ylabel(''sin(x)'')

    Listing 4-2

    plot2d2.sce

    ```


    ```

    1  // Program to plot using plot2d3 function

    2  x = linspace(−%pi,%pi,20)

    3  plot2d3(x,sin(x))

    4  xtitle(''Graph for plotting sin(x) using plot2d3'')

    5  xlabel(''angle'')

    6  ylabel(''sin(x)'')

    Listing 4-3

    plot2d3.sce

    ```


    ![A458922_1_En_4_Fig5_HTML.gif](A458922_1_En_4_Fig5_HTML.gif)


    Figure 4-5


    sin(x) and cos(x)


    ![A458922_1_En_4_Fig4_HTML.gif](A458922_1_En_4_Fig4_HTML.gif)


    Figure 4-4


    sin(x) and cos(x)


    ```

    1  // Program to plot using plot2d4 function

    2  x = linspace(−%pi,%pi,20)

    3  plot2d4(x,sin(x))

    4  xtitle(''Graph for plotting sin(x) using plot2d4'')

    5  xlabel(''angle'')

    6  ylabel(''sin(x)'')

    Listing 4-4

