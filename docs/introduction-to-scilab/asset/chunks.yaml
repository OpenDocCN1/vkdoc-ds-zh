    2.  Double precision:\n    *   Occupies 8 bytes = 64 bits \n3.  Extended double\
    \ precision:\n    *   Occupies 80 bits \n4.  Quadruple precision:\n    *   Occupies\
    \ 16 bytes = 128 bits \n\nOn a 64-bit operating system machine having Scilab software,\
    \ real variables are stored as 64 bit floating point numbers (double precision,\
    \ hence, the name `double` for the data type). This format includes the following:\n\
    \n*   One bit to store the sign of the number\n    *   2¹ = 2 possible values\
    \ (0 and 1, which are used to represent sign)\n*   52 significant bits\n    *\
    \   2^(52) possible values\n*   11 for exponent\n    *   2^(11) possible values\n\
    \nThis complies with IEEE 754 standard.\n\nConverting between a higher-precision\
    \ data type to a lower-precision data type can result in saving the computer’s\
    \ memory and speeding up calculations at the cost of precision. These decisions\
    \ must be taken by the developer beforehand. You do not always need higher precisions.\
    \ For example, if you are working with dimensions of a bridge and the numbers\
    \ are represented in units of meters, you can usually work with a precisionof\
    \ ![ $$ {\\frac{1}{10}}^{th}m $$ ](A458922_1_En_2_Chapter_IEq11.gif) for most\
    \ measurements involved in civil engineering. However, if you are working with\
    \ nano materials or talking about atoms when calculations involve precision around\
    \ Å= 10^(−9) m, you obviously need better precision. It is important to perform\
    \ back-of-the-envelop calculations for a particular problem to get an idea about\
    \ the maximum and minimum numbers expected during the running of a program. Accordingly,\
    \ you can assign data types. But what if you don’t set a data type? In this case,\
    \ default data types are used like floating point numbers on a 64-bit machine\
    \ are stored with double-precision floating point numbers by default.\n\nSpecialized\
    \ packages exist for Scilab where arbitrary precision can be used for more accurate\
    \ mathematical calculations. Even though a detailed discussion of this topic is\
    \ beyond the scope of this book, users are advised to check out the packages Xnum\
    \ (maximum precision of 200 digits) [[1](#A458922_1_En_2_Chapter.html#Par200)]\
    \ and Mupat [[2](#A458922_1_En_2_Chapter.html#Par201)]. Precision plays an important\
    \ role in producing meaningfully reliable numerical values for critical applications\
    \ so data types in such cases must be used judiciously.\n\n### 2.11.3 Formatted\
    \ Display of Numbers\n\nControlling the format of displaying the number of digits\
    \ of a numerical value is one of the most significant abilities of an advanced\
    \ programming environment. Scilab provides the command `format`. Its description\
    \ can be obtained using the command `help format`. The command `format()` takes\
    \ integer values as arguments for displaying the number of digits in a numerical\
    \ value. The range for this input argument is [2, 25]:\n\n```\n1  −−>exp(1)\n\
    2  ans =\n3  2.7182818\n4  −−>format(5)\n5  −−>exp(1)\n6  ans =\n7  2.72\n8  −−>format(25)\n\
    9  −−>exp(1)\n10  ans =\n11  2.7182818284590450907956\n```\n\n`exp(1)` represents\
    \ e ¹ = 2.7182818, which is also called Euler’s number . When `format(5)` is issued\
    \ as a command, then the answer to e ¹ is shown as 2.72, whereas `format(255)`\
    \ reveals 2.7182818284590450907956.\n\nIt is important to note that the stored\
    \ value is unaffected by the fact that it is being represented on a graphic terminal\
    \ with fewer digits. The symbolic representation of a number on a computer terminal\
    \ is independent of the way it is stored (which is determined entirely by its\
    \ data type).\n\n## 2.12 Boolean Data\n\n`help(boolean)` provides a detailed description\
    \ about boolean variables namely `\\%T` for `true` and `\\%F` for `false`. Boolean\
    \ variables must be operated using boolean operators such as the following:\n\n\
    *   NOT\n    *   Represented by the symbolic operator `~`\n    *   Negates an\
    \ input (`~%T=%F` and `~%F=%T)`\n*   AND\n    *   Represented by either the symbolic\
    \ operator `&` or the function `or()`\n    *   Behavior is shown in Table [2-2](#A458922_1_En_2_Chapter.html#Tab2)\n\
    \    *   Bitwise operations are done by the `bitand()` function\n*   OR\n    *\
    \   Represented by either the symbolic operator `|` or the function `or()`\n \
    \   *   Behavior is shown in Table [2-3](#A458922_1_En_2_Chapter.html#Tab3)\n\
    \    *   Bitwise operations are done by `bitor()` function\n*   XOR\n    *   Represented\
    \ by the function `bitxor()`\n    *   Behavior is shown in Table [2-4](#A458922_1_En_2_Chapter.html#Tab4)\n\
    \n        Table 2-4\n\n        Truth Table for XOR Operator\n\n        | XOR |\
    \ T | F |\n        | --- | --- | --- |\n        | T | F | T |\n        | F | T\
    \ | F |\n\n        Table 2-3\n\n        Truth Table for OR Operator\n\n      \
    \  | OR | T | F |\n        | --- | --- | --- |\n        | T | T | T |\n      \
    \  | F | T | F |\n\n        Table 2-2\n\n        Truth Table for AND Operator\n\
    \n        | AND | T | F |\n        | --- | --- | --- |\n        | T | T | F |\n\
    \        | F | F | F |\n\n```\n1  −−>a = %T // a is give value True\n2  a =\n\
    3  T\n4  −−>b = ˜a // b is NOT a\n5  b =\n6  F\n7  −−>a&b // a AND b\n8  ans =\n\
    9  F\n10  −−>a|b // a OR b\n11  ans =\n12  T\n```\n\nThe `bitxor()` operator works\
    \ bitwise, so it converts an input into its binary representation and performs\
    \ the computation. Let’s understand this concept by using an example. `bitxor(1000,1001)`\
    \ is 1 because binary representations (obtained by the function `dec2bin()`) show\
    \ that only the last bit is different and, hence, the result is the binary number\
    \ whose decimal equivalent is 1:\n\n```\n1  −−>bitxor(1000,1001)\n2  ans =\n3\
    \  1.\n4  −−>dec2bin([1000;1001;1])\n5  ans =\n\n7  !1111101000   !\n8  !    \
    \         !\n9  !1111101001   !\n10  !             !\n11  !0000000001   !\n12\
    \  −−>bin2dec(\"0000000001\")\n13  ans =\n14  1.\n```\n\nIt is important to note\
    \ that, in binary logic, the values `True` and `False` are equivalently used with\
    \ `1` and `0`. So Tables [2-2](#A458922_1_En_2_Chapter.html#Tab2), [2-3](#A458922_1_En_2_Chapter.html#Tab3)\
    \ and [2-4](#A458922_1_En_2_Chapter.html#Tab4) would simply replace the value\
    \ `T` with `1` and `F` with `0`.\n\nSimilarly, the `bitand()` and `bitor()` operators\
    \ can be understood with the following example:\n\n```\n1  −−>bitor(100,99)\n\
    2  ans =\n3  103.\n4  −−>bitand(100,99)\n5  ans =\n6  96.\n7  −−>dec2bin([100;99;103;96])\n\
    8  ans =\n\n10  !1100100  !\n11  !         !\n12  !1100011  !\n13  !         !\n\
    14  !1100111  !\n15  !         !\n16  !1100000  !\n```"
  trans: "\n### 2.11.2 如何存储浮点数\n\n计算机可以将数字存储为浮点数对象。一个浮点数对象按如下方式存储数字：\n\n![ $$ \\pm\
    \ {d}_1{d}_2\\dots {d}_s\\times {\\beta}^e $$ ](img/A458922_1_En_2_Chapter_Equ1.gif)\n\
    \n(2.1) 其中 ![ $$ {d}_i=0,1,2\\dots \\beta -1 $$ ](img/A458922_1_En_2_Chapter_IEq7.gif)\
    \ 但 ![ $$ {d}_1\\ne 0 $$ ](img/A458922_1_En_2_Chapter_IEq8.gif) 且 m ≤ e ≤ M，其中\
    \ ![ $$ m\\in {I}^{-} $$ ](img/A458922_1_En_2_Chapter_IEq9.gif) 且 ![ $$ M\\in\
    \ {I}^{+} $$ ](img/A458922_1_En_2_Chapter_IEq10.gif)。\n\n浮点数由以下三部分组成：\n\n- 符号（±）\n\
    - 尾数（`d[1]d[2]…d[s]`）\n- 指数（`β`）\n\n浮点数的每个部分都存储在不同的内存位置，并占用指定位数的比特。哪些部分各占多少比特？这些问题已由名为\
    \ **IEEE754** 的 IEEE 标准解答。首先，我们来看一下数字表示精度的概念：\n\n1.  单精度：\n    - 占用 4 字节 = 32\
    \ 比特\n2.  双精度：\n    - 占用 8 字节 = 64 比特\n3.  扩展双精度：\n    - 占用 80 比特\n4.  四精度：\n\
    \    - 占用 16 字节 = 128 比特\n\n在安装了 Scilab 软件的 64 位操作系统上，实型变量存储为 64 位浮点数（双精度，因此该数据类型名称为\
    \ `double`）。该格式包含以下部分：\n\n- 1 比特用于存储数字的符号\n    - 2¹ = 2 种可能值（0 和 1，用于表示符号）\n-\
    \ 52 个有效位\n    - 2⁵² 种可能值\n- 11 个指数位\n    - 2¹¹ 种可能值\n\n这符合 IEEE 754 标准。\n\n将高精度数据类型转换为低精度数据类型，可以节省计算机内存并加快计算速度，但会牺牲精度。这些决策必须由开发人员预先做出。你并不总是需要更高精度。例如，如果你在处理桥梁的尺寸，并且数字以米为单位表示，那么在土木工程涉及的大多数测量中，通常使用\
    \ ![ $$ {\\frac{1}{10}}^{th}m $$ ](img/A458922_1_En_2_Chapter_IEq11.gif) 的精度即可。然而，如果你在处理纳米材料，或者谈论原子，且计算精度需要达到\
    \ Å = 10^(−9) m 量级，那么显然需要更好的精度。针对特定问题进行粗略估算，以了解程序运行期间预期的最大和最小值，这非常重要。然后，你可以据此分配数据类型。但是，如果你不设置数据类型呢？在这种情况下，会使用默认数据类型，例如\
    \ 64 位机器上的浮点数默认以双精度浮点数存储。\n\nScilab 中存在专门的软件包，可以使用任意精度进行更准确的数学计算。尽管对此主题的详细讨论超出了本书的范围，但建议用户查看\
    \ `Xnum` 软件包（最高精度为 200 位数字）[1] 和 `Mupat` 软件包 [2]。对于关键应用而言，精度在生成有意义的可靠数值方面起着重要作用，因此在这些情况下，必须明智地使用数据类型。\n\
    \n### 2.11.3 数字的格式化显示\n\n控制数值显示位数的格式是高级编程环境最重要的能力之一。Scilab 提供了 `format` 命令。其描述可通过\
    \ `help format` 命令获取。`format()` 命令接受整数值作为参数，用于设置数值显示的数字位数。该输入参数的取值范围是 [2, 25]：\n\
    \n```\n1  −−>exp(1)\n2  ans =\n3  2.7182818\n4  −−>format(5)\n5  −−>exp(1)\n6\
    \  ans =\n7  2.72\n8  −−>format(25)\n9  −−>exp(1)\n10  ans =\n11  2.7182818284590450907956\n\
    ```\n\n`exp(1)` 表示 e¹ = 2.7182818，也称为欧拉数。当执行命令 `format(5)` 时，e¹ 的答案显示为 2.72，而\
    \ `format(25)` 则显示为 2.7182818284590450907956。\n\n需要注意的是，存储的值不会因其在图形终端上以较少位数显示而受到影响。数字在计算机终端上的符号表示与其存储方式（完全由其数据类型决定）无关。\n\
    \n## 2.12 布尔数据\n\n`help(boolean)` 提供了关于布尔变量的详细描述，即用 `\\%T` 表示 `true`，用 `\\%F`\
    \ 表示 `false`。必须使用布尔运算符来操作布尔变量，例如：\n\n- 非 (NOT)\n    - 由符号运算符 `~` 表示\n    - 对输入取反（`~%T=%F`\
    \ 且 `~%F=%T`）\n- 与 (AND)\n    - 由符号运算符 `&` 或函数 `or()` 表示\n    - 其行为如表 2-2 所示\n\
    \    - 按位运算由 `bitand()` 函数执行\n- 或 (OR)\n    - 由符号运算符 `|` 或函数 `or()` 表示\n    -\
    \ 其行为如表 2-3 所示\n    - 按位运算由 `bitor()` 函数执行\n- 异或 (XOR)\n    - 由函数 `bitxor()` 表示\n\
    \    - 其行为如表 2-4 所示\n\n表 2-4: 异或运算符真值表\n\n| XOR | T | F |\n| --- | --- | --- |\n\
    | T | F | T |\n| F | T | F |\n\n表 2-3: 或运算符真值表\n\n| OR | T | F |\n| --- | ---\
    \ | --- |\n| T | T | T |\n| F | T | F |\n\n表 2-2: 与运算符真值表\n\n| AND | T | F |\n\
    | --- | --- | --- |\n| T | T | F |\n| F | F | F |\n\n```\n1  −−>a = %T // 给 a\
    \ 赋值为 True\n2  a =\n3  T\n4  −−>b = ˜a // b 是 a 取反\n5  b =\n6  F\n7  −−>a&b //\
    \ a AND b\n8  ans =\n9  F\n10  −−>a|b // a OR b\n11  ans =\n12  T\n```\n\n`bitxor()`\
    \ 运算符是按位工作的，因此它会把输入转换为二进制表示再执行计算。让我们通过一个例子来理解这个概念。`bitxor(1000, 1001)` 的结果是 1，因为二进制表示（通过函数\
    \ `dec2bin()` 获得）表明只有最后一位不同，因此结果是二进制数，其十进制等效值为 1：\n\n```\n1  −−>bitxor(1000, 1001)\n\
    2  ans =\n3  1.\n4  −−>dec2bin([1000; 1001; 1])\n5  ans =\n\n7  !1111101000  \
    \ !\n8  !             !\n9  !1111101001   !\n10  !             !\n11  !0000000001\
    \   !\n12  −−>bin2dec(\"0000000001\")\n13  ans =\n14  1.\n```\n\n需要注意的是，在二进制逻辑中，值\
    \ `True` 和 `False` 分别与 `1` 和 `0` 等效使用。因此，表 2-2、2-3 和 2-4 只需将值 `T` 替换为 `1`，`F`\
    \ 替换为 `0`。\n\n类似地，`bitand()` 和 `bitor()` 运算符可以通过以下示例来理解：\n\n```\n1  −−>bitor(100,\
    \ 99)\n2  ans =\n3  103.\n4  −−>bitand(100, 99)\n5  ans =\n6  96.\n7  −−>dec2bin([100;\
    \ 99; 103; 96])\n8  ans =\n\n10  !1100100  !\n11  !         !\n12  !1100011  !\n\
    13  !         !\n14  !1100111  !\n15  !         !\n16  !1100000  !\n```\n"
- fmt: '## 2.13 Strings


    Alphabets along with special characters are treated as string data types. The
    built-in function `string()` converts a given value to string data type. As shown
    in the following example, the numerical value 2 is converted to a string data
    type when the `string()` function is applied to it and remains an integer type
    otherwise:


    ```

    1  −−>a = string(2)

    2  a =

    3  2

    4  −−>b = string(3)

    5  b =

    6  3

    7  −−>a+b

    8  ans =

    9  23

    ```


    It is worth noting that binary data for 2 as a string (stored in variable `a`)
    and as a number will be quite different and, thus, the numerical computations
    will treat them differently even if it is always displayed as 2. When it is represented
    as a string, operators will first understand the data type and then operate. An
    addition operator is simply a concatenation operator for strings. Hence, `a+b`
    equals `23`. A numerical computation of 2 + 3 results in the value 5.


    Without the `string()` function, strings can be defined by enclosing them in single
    quotes (`"`) or double quotes (`""`). Strings are case-sensitive, too. This can
    be verified by the following code:


    ```

    1  −−>a = "hello world"

    2  a =

    3  hello world

    4  −−>b = ''Hello World''

    5  b =

    6  Hello World

    7  −−>a==b

    8  ans =

    9  F

    ```


    `a` contains `h` and `w` characters (lowercase) while `b` contains `H` and `W`
    characters. For this reason, `a==b` gives `F` (`false`) since their values are
    different.


    ## 2.14 Complex Numbers


    One of the most important parts of doing mathematical calculations on computers
    is the ability to work with complex numbers and their algebra. Computations involving
    complex numbers can be found in almost all branches of science and mathematics.
    Finding flexible ways of defining complex numbers and their mathematics is an
    art that all developers must employ to compute efficiently.


    A graphical description of a complex number is shown in Figure [2-2](#A458922_1_En_2_Chapter.html#Fig2).
    On a real-imaginary axis-based complex plane, a particular point is defined by
    a complex number a + ib where a is the magnitude of the projection of a point
    on real axis and b is the magnitude of projection of a point on imaginary axis.


    ![A458922_1_En_2_Fig2_HTML.jpg](A458922_1_En_2_Fig2_HTML.jpg)


    Figure 2-2


    Complex number depicted on complex plane [[3](#A458922_1_En_2_Chapter.html#Par202)]


    Figure [2-2](#A458922_1_En_2_Chapter.html#Fig2) shows a point depicting the complex
    number ![ $$ z=x+ iy $$ ](A458922_1_En_2_Chapter_IEq12.gif). The value of ![ $$
    r=\mid z\mid $$ ](A458922_1_En_2_Chapter_IEq13.gif) (absolute value) and ϕ (argument)
    are given by the following:


    ![ $$ r=\sqrt{x^2+{y}^2} $$ ](A458922_1_En_2_Chapter_Equ2.gif)


    (2.2)


    ![ $$ \phi = ta{n}^{-1}\left(\frac{y}{x}\right) $$ ](A458922_1_En_2_Chapter_Equ3.gif)


    (2.3)


    The absolute value of a complex number is simply its distance from its origin.
    The argument of a complex number is simply the angle it makes with the horizontal
    axis in a counterclockwise direction. The absolute value of a complex number can
    be calculated using the `abs()` function:


    ```

    1  −−>complex(2,3)

    2  ans =

    3  2\. + 3.i

    4  −−>abs(complex(2,3))

    5  ans =

    6  3.61

    ```


    The angle can be calculated by using real and imaginary parts of the complex number
    as follows:


    ```

    1  −−>a = complex(2,3)

    2  a

    3  2\. + 3.i

    4  −−>type(a)

    5  ans =

    6  1.

    7  −−>real(a)

    8  ans =

    9  2.

    10  −−>imag(a)

    11  ans =

    12  3.

    13  −−>atan(imag(a)/real(a))

    14  ans =

    15  0.98

    ```


    ### 2.14.1 Real and Imaginary Parts


    Real and imaginary parts of a real number are given by the built-in functions
    `real()` and `imag()` as follows:


    ```

    1  −−>r = real(complex(2,3))

    2  r =

    3  2.

    4  −−>i = imag(complex(2,3))

    5  i =

    6  3.

    7  −−>r = real(complex([2,3],[−3,−4]))

    8  r =

    9  2\. 3.

    10  −−>i = imag(complex([2,3],[−3,−4]))

    11  i =

    12  −3\. −4.

    ```


    ### 2.14.2 Complex Conjugates


    The complex conjugate of a complex number `x + iy` is `x − iy` and that of `x
    − iy` is `x + iy`. The built-in function `conj()` produces the complex conjugate
    of a given complex number:


    ```

    1  −−>a = complex(2,3)

    2  a =

    3  2\. + 3.i

    4  −−>b = conj(a)

    5  b =

    6  2\. − 3.i

    7  −−>a∗b

    8  ans =

    9  13.

    ```


    The product of a complex number with its conjugate can be understood as:


    ![ $$ \prod \left(\left(a+ ib\right),\left(a- ib\right)\right)={a}^2+{b}^2 $$
    ](A458922_1_En_2_Chapter_Equ4.gif)


    (2.4) where a and `b` are real and imaginary parts.


    For multiple entries (complex numbers) as array elements:


    ```

    1  −−>a = complex([1 2 3],[4 5 6])

    2  a =

    3  1\. + 4.i     2\. + 5.i     3\. + 6.i

    4  −−>b = conj(a)

    5  b =

    6  1\. − 4.i     2\. − 5.i     3\. − 6.i

    7  −−>a.∗b

    8  ans =

    9  17\.   29\.   45.

    ```


    ### 2.14.3 `imult`


    The built-in function `imult()` is an efficient way of multiplying a real number
    with i (the imaginary unitary) especially when `%inf` and `%nan` are present in
    the calculation:


    ```

    1  −−>imult(%nan)

    2  ans =

    3  Nani

    4  −−>imult(%inf)

    5  ans =

    6  Inf i

    7  −−>%i∗%nan

    8  ans =

    9  Nan + Nani

    10  −−>%i∗%inf

    11  ans =

    12  Nan + Inf i

    13  −−>imult(4)

    14  ans =

    15  4.i

    16  −−>imult(complex(4,4))

    17  ans =

    18  −4\. + 4.i

    ```


    As seen when:


    ![ $$ 4\times i=4i $$ ](A458922_1_En_2_Chapter_Equc.gif)


    and


    ![ $$ \left(4+4i\right)\times i=4i-4=-4+4i $$ ](A458922_1_En_2_Chapter_Equd.gif)


    ### 2.14.4 Checking If a Variable Has Complex Components


    The built-in function `isreal()` checks if a variable has complex components.
    It produces a boolean output `T` if the input variable does not have complex numbers
    and outputs `F` otherwise:


    ```

    1  −−>a = [1 2 3]

    2  a =

    3  1\.     2\.     3.

    4  −−>a1 = complex(a,a)

    5  a1 =

    6  1\. + i      2\. + 2.i       3\. + 3.i

    7  −−>isreal(a)

    8  ans =

    9  T

    10  −−>isreal(a1)

    11  ans =

    12  F

    ```'
