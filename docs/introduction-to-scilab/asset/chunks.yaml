    2  x = linspace(−2,2,10);

    3  y = linspace(−2,2,10);

    4  [X,Y] = meshgrid(x,y);

    5  fy = X.ˆ3−2.∗X.ˆ2+4.∗X−10;

    6  fx = X.ˆ3+2.∗X.ˆ2−4.∗X+10;

    7  champ(x,y,fx'',fy'')

    8  xtitle(''Using champ function to plot vector f ield'')

    9  xlabel(''x'')

    10  ylabel(''y'')

    Listing 4-10

    champ1.sce

    ```


    Adding color (indicating field intensity) to the arrows gives a more meaningful
    visual presentation, as shown in Listing [4-11](#A458922_1_En_4_Chapter.html#Par39)
    and Figure [4-14](#A458922_1_En_4_Chapter.html#Fig14).


    ![A458922_1_En_4_Fig14_HTML.gif](A458922_1_En_4_Fig14_HTML.gif)


    Figure 4-14

    Plotting a vector field using `champ`


    ```

    1  // Program to plot using champ function for plotting a vector f ield

    2  x = linspace(−1,1,20);

    3  y = linspace(−1,1,20);

    4  [X,Y] = meshgrid(x,y);

    5  fy = 3.∗Y;

    6  fx = 0.5.∗X;

    7  champ1(x,y,fx'',fy'')

    8  xtitle(''Using champ function to plot vector f ield'')

    9  xlabel(''x'')

    10  ylabel(''y'')

    Listing 4-11

    champcolor.sce

    ```'
