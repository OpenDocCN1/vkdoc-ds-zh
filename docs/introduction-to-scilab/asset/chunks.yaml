    # 1.6 命令提示符


    Scilab 提供了一个功能齐全、交互式的命令行 REPL（读取-求值-打印循环）。Scilab 编程语言的交互式 shell 通常被称为 REPL，因为它执行以下操作：


    - 读取用户输入的内容

    - 求值读取的内容

    - 打印求值后的返回值

    - 循环并重复以上所有步骤


    这种交互式工作环境对于交互式编码和调试都非常有用。你可以在写完特定代码后立即检查其结果。使用 Scilab REPL 的方式是：编写代码、分析结果，并持续此过程直到计算出最终结果。除了允许快速简便地求值
    Scilab 语句外，它还具备以下特点：


    - 可搜索的历史记录

    - Tab 补全

    - 许多有用的快捷键绑定

    - 帮助和文档


    Scilab 窗口左侧的一部分显示了命令 `history`，其中列出了在命令提示符下使用过的所有命令。单击某个特定命令即可在 Scilab 命令提示符下执行它。这是一种快速重复执行命令的方法。或者，用户也可以使用计算机传统键盘上的**上**和**下**箭头键来浏览这些命令。


    Tab 补全功能允许用户为某个命令仅键入几个字符，然后按 Tab 键，如果存在多个选项，则会获得一个可供选择的选项列表，否则它会自动补全命令的正确语法。此功能非常有用，因为它可以避免语法错误，而语法错误是导致程序错误的常见原因之一。


    快捷键绑定取决于操作系统。当你单击菜单栏（Scilab 主窗口的顶部）上的各个项目时，可以在选项名称旁边看到对应的快捷键绑定。


    在 Scilab 中，获取关于各种主题的帮助和查找文档也非常容易。你可以简单地将任何参数作为字符串（用双引号 `" "` 括起来的字符）传递给内置函数 `help()`。例如，我们之前使用了
    `ver` 函数。假设你想了解其正确用法并查看完整的文档。你可以在 Scilab 命令提示符下键入以下内容：


    ```

    1   −−>help("ver")

    ```


    这将打开一个`帮助浏览器`窗口，如图 1-2 所示。


    ![A458922_1_En_1_Fig2_HTML.jpg](img/A458922_1_En_1_Fig2_HTML.jpg)


    图 1-2


    帮助浏览器窗口


    帮助浏览器包含了所有内置函数以及其他主题。你可以使用此浏览器窗口学习 Scilab，并且如果在开发过程中出现任何问题，都可以查阅此窗口。Scilab 社区维护着非常高质量的文档，这帮助
    Scilab 变得流行起来。


    另一种获取主题帮助的方法是单击菜单栏中的 `?` 符号，这将打开 `Scilab 帮助`作为其中一个选项。这需要使用鼠标来定位并单击该符号。


    有时用户需要获取一个干净的屏幕。为此，他们可以使用 `clc` 命令。此命令会呈现一个全新的命令提示符，就像第一次打开 Scilab 时一样。值得注意的是，Scilab
    在此过程中不会重新启动。它会存储所有变量及其各自的值；它只是清除屏幕上之前的所有内容。用户也可以将此命令作为函数使用，通过键入 `clc(n)`，其中 `n`
    可以是一个整数，这样该命令将清除上次会话中相应行数的内容。如果用户键入的是 `clc()`，则会清除屏幕上的所有行。


    用于此 Scilab 命令的符号是 `-->`，以区别于 MATLAB 或 Octave 的命令提示符。此信息存储在 `prompt` 变量中，可以通过以下方式查看：


    ```

    1   −−>prompt

    2   ans =


    4   −−>

    ```


    REPL 回复的值为 `-->`，即 Scilab 提示符的符号。


    ## 1.7 变量浏览器


    变量浏览器列出了所使用的变量（将在后面解释）、它们的大小、类型和可见性。在屏幕上显示这些信息有助于用户跟踪内存使用情况，并避免混淆变量名。当用户添加新变量或从计算中移除已有变量时，变量浏览器会添加新信息。变量列表可以通过
    `clear` 命令清空，该命令会从计算机内存中移除这些变量。此操作可以通过变量浏览器的内容为空来验证。


    在变量浏览器中进行任何操作后，Scilab 会话中至少会创建一个名为 `ans` 的变量，该变量存储了在命令提示符下最后求值的表达式的结果，如下代码所示：


    ```

    1   −−>2+2

    2   ans =


    4   4.


    7   −−>ans

    8   ans =


    10   4.

    ```


    ## 1.8 SciNotes


    SciNotes 是 Scilab 内置的文本编辑器。`SciNotes` 窗口可用于编写多行程序，可以通过菜单栏中的 `应用程序 -> SciNotes`
    打开。（见图 1-3。）


    ![A458922_1_En_1_Fig3_HTML.jpg](img/A458922_1_En_1_Fig3_HTML.jpg)


    图 1-3


    SciNotes 窗口


    它也可以使用命令提示符打开，只需键入 `scinotes` 或 `editor` 即可。该编辑器具有创建新窗口、保存当前会话、剪切、复制、粘贴以及运行程序（换句话说，就是执行程序）的功能。代码的输出可以在
    Scilab 的命令提示符中看到。命令 `scinote()` 使用了内置函数。当给定文件名或文件路径作为参数时，该特定文件将在 `SciNotes` 环境中打开。文件名必须以字符串形式给出。如果添加了额外的选项
    `''readonly''`，则文件将以只读模式打开，无法进行编辑。这可以防止对代码进行不必要的修改。


    ## 1.9 本章小结


    Scilab 为数值计算提供了一种开源替代方案。尽管用户需要转换 MATLAB 代码以使其与 Scilab 兼容，但这有时是一项值得的工作，因为 Scilab
    提供了丰富的工程模块生态系统来执行复杂的数学计算。如有疑问，可以使用 `help` 命令轻松获取特定命令的文档。在本章中，我们概述了使用 Scilab 的重要性。后续章节将解释其在科学计算中的用法。


    # 2. 使用 Scilab


    ## 2.1 使用 Scilab


    如第 1 章所述，在 Scilab 中有两种工作方式。第一种方式是逐条在命令行键入命令。标题为“Scilab 6.0.0 Console”（如图 1-1 中间部分所示）的区域提供了命令行，其光标形状为
    `-->`。你可以在此处编写命令以立即执行。例如，让我们从编写任何编程语言的第一个程序开始——在命令提示符下打印单词 `Hello World`。


    ![A458922_1_En_2_Fig1_HTML.jpg](img/A458922_1_En_2_Fig1_HTML.jpg)


    图 2-1


    显示两个变量的变量浏览器窗口


    这可以通过简单地在命令提示符下编写以下内容来完成：


    ```

    1  −−>message = "Hello World!"

    2  message =

    3  Hello World!

    4  −−>disp(message)

    5  Hello World!

    ```


    当输入第一个命令 `message = "Hello World!"` 时，你可以看到标题为 `变量浏览器` 的窗口中填充了两个变量：`ans` 和 `message`。


    该窗口还说明了存储在这些变量中的值的属性。两者存储相同的值，即一个字符串。`ans` 变量将根据接下来在命令提示符下键入的内容被追加新值，但变量 `message`
    将保持不变，直到它被赋予另一个值为止。

