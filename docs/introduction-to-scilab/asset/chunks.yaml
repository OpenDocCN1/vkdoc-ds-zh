    ## 2.13 字符串


    字母以及特殊字符均被视为字符串数据类型。内置函数 `string()` 可将给定值转换为字符串数据类型。如下例所示，当数值 2 应用 `string()`
    函数时，会被转换为字符串数据类型，否则其类型保持为整数：


    ```

    1  −−>a = string(2)

    2  a =

    3  2

    4  −−>b = string(3)

    5  b =

    6  3

    7  −−>a+b

    8  ans =

    9  23

    ```


    值得注意的是，数字 2 作为字符串（存储在变量 `a` 中）和作为数字时的二进制数据差异很大，因此数值计算会以不同方式处理它们，即使显示结果始终为 2。当它表示为字符串时，运算符会首先识别数据类型，然后执行操作。对于字符串，加法运算符仅仅是连接运算符。因此，`a+b`
    等于 `23`。而数值计算 2 + 3 的结果是 5。


    如果不使用 `string()` 函数，可以通过将字符串括在单引号（`"`）或双引号（`""`）中来定义。字符串同样区分大小写。这一点可通过以下代码验证：


    ```

    1  −−>a = "hello world"

    2  a =

    3  hello world

    4  −−>b = ''Hello World''

    5  b =

    6  Hello World

    7  −−>a==b

    8  ans =

    9  F

    ```


    `a` 包含字符 `h` 和 `w`（小写），而 `b` 包含字符 `H` 和 `W`。因此，由于它们的值不同，`a==b` 的结果为 `F`（`false`）。


    ## 2.14 复数


    在计算机上进行数学计算的一个最重要方面是处理复数及其代数运算的能力。涉及复数的计算几乎存在于所有科学和数学分支中。找到定义复数及其数学运算的灵活方法，是所有开发者进行高效计算必须掌握的艺术。


    复数的图形描述如图 2-2 所示。在基于实轴和虚轴的复平面上，一个特定点由复数 a + ib 定义，其中 a 是该点在实轴上投影的大小，b 是该点在虚轴上投影的大小。


    ![A458922_1_En_2_Fig2_HTML.jpg](img/A458922_1_En_2_Fig2_HTML.jpg)


    图 2-2


    在复平面上描绘的复数 [3]


    图 2-2 展示了一个表示复数 ![ $$ z=x+ iy $$ ](img/A458922_1_En_2_Chapter_IEq12.gif) 的点。![
    $$ r=\mid z\mid $$ ](img/A458922_1_En_2_Chapter_IEq13.gif)（绝对值）和 ϕ（幅角）的值由以下公式给出：


    ![ $$ r=\sqrt{x²+{y}²} $$ ](img/A458922_1_En_2_Chapter_Equ2.gif)


    (2.2)


    ![ $$ \phi = ta{n}^{-1}\left(\frac{y}{x}\right) $$ ](img/A458922_1_En_2_Chapter_Equ3.gif)


    (2.3)


    复数的绝对值就是它到原点的距离。复数的幅角就是它与水平轴逆时针方向所成的角度。可以使用 `abs()` 函数计算复数的绝对值：


    ```

    1  −−>complex(2,3)

    2  ans =

    3  2\. + 3.i

    4  −−>abs(complex(2,3))

    5  ans =

    6  3.61

    ```


    该角度可以通过使用复数的实部和虚部计算，如下所示：


    ```

    1  −−>a = complex(2,3)

    2  a

    3  2\. + 3.i

    4  −−>type(a)

    5  ans =

    6  1.

    7  −−>real(a)

    8  ans =

    9  2.

    10  −−>imag(a)

    11  ans =

    12  3.

    13  −−>atan(imag(a)/real(a))

    14  ans =

    15  0.98

    ```


    ### 2.14.1 实部和虚部


    实数的实部和虚部由内置函数 `real()` 和 `imag()` 提供，如下所示：


    ```

    1  −−>r = real(complex(2,3))

    2  r =

    3  2.

    4  −−>i = imag(complex(2,3))

    5  i =

    6  3.

    7  −−>r = real(complex([2,3],[−3,−4]))

    8  r =

    9  2\. 3.

    10  −−>i = imag(complex([2,3],[−3,−4]))

    11  i =

    12  −3\. −4.

    ```


    ### 2.14.2 复共轭


    复数 `x + iy` 的复共轭是 `x − iy`，而 `x − iy` 的复共轭是 `x + iy`。内置函数 `conj()` 生成给定复数的复共轭：


    ```

    1  −−>a = complex(2,3)

    2  a =

    3  2\. + 3.i

    4  −−>b = conj(a)

    5  b =

    6  2\. − 3.i

    7  −−>a∗b

    8  ans =

    9  13.

    ```


    复数与其共轭的乘积可以理解为：


    ![ $$ \prod \left(\left(a+ ib\right),\left(a- ib\right)\right)={a}²+{b}² $$ ](img/A458922_1_En_2_Chapter_Equ4.gif)


    (2.4) 其中 a 和 `b` 分别为实部和虚部。


    对于多个条目（复数）作为数组元素的情况：


    ```

    1  −−>a = complex([1 2 3],[4 5 6])

    2  a =

    3  1\. + 4.i     2\. + 5.i     3\. + 6.i

    4  −−>b = conj(a)

    5  b =

    6  1\. − 4.i     2\. − 5.i     3\. − 6.i

    7  −−>a.∗b

    8  ans =

    9  17\.   29\.   45.

    ```


    ### 2.14.3 `imult`


    内置函数 `imult()` 是将实数乘以 i（虚数单位）的一种高效方式，尤其是在计算涉及 `%inf` 和 `%nan` 时：


    ```

    1  −−>imult(%nan)

    2  ans =

    3  Nani

    4  −−>imult(%inf)

    5  ans =

    6  Inf i

    7  −−>%i∗%nan

    8  ans =

    9  Nan + Nani

    10  −−>%i∗%inf

    11  ans =

    12  Nan + Inf i

    13  −−>imult(4)

    14  ans =

    15  4.i

    16  −−>imult(complex(4,4))

    17  ans =

    18  −4\. + 4.i

    ```


    如以下公式所示：


    ![ $$ 4\times i=4i $$ ](img/A458922_1_En_2_Chapter_Equc.gif)


    和


    ![ $$ \left(4+4i\right)\times i=4i-4=-4+4i $$ ](img/A458922_1_En_2_Chapter_Equd.gif)


    ### 2.14.4 检查变量是否包含复数分量


    内置函数 `isreal()` 用于检查变量是否包含复数分量。如果输入变量不包含复数，则输出布尔值 `T`，否则输出 `F`：


    ```

    1  −−>a = [1 2 3]

    2  a =

    3  1\.     2\.     3.

    4  −−>a1 = complex(a,a)

    5  a1 =

    6  1\. + i      2\. + 2.i       3\. + 3.i

    7  −−>isreal(a)

    8  ans =

    9  T

    10  −−>isreal(a1)

    11  ans =

    12  F

    ```

