- fmt: '## 6.4 Summary


    Defining functions is the key to modular programming. `Scilab` presents an elegant
    way to define and use functions both inline and in separate files. When combined
    with the ability to write functions inside a loop, complex problems can be implemented
    in a few lines of codes. It requires an artistic attitude while designing an algorithm
    where functions and loops are the paintbrush to devise an elegant solution to
    a given numerical problem.


    # 7. Numerical Computing Formalism


    ## 7.1 Introduction


    Numerical computation enables us to compute solutions for physical problems, provided
    we can frame them into a proper format. This process requires certain considerations.
    First and foremost is the understanding of approximate solutions. For example,
    if we digitize continuous functions, then we are going to introduce certain errors
    due to the sampling at a finite frequency. Hence, a very accurate result would
    require a very fast sampling rate. In cases when a large data set needs to be
    computed, it becomes computationally an intensive and time-consuming task. Users
    need to understand that the numerical solutions are an approximation at best when
    compared to analytical solutions. The onus of finding their physical meaning and
    significance lies with user. The art of discarding solutions that do not have
    a meaning for real-world scenarios is a skill that a scientist or engineer develops
    over the years. Also, a computational device is just as intelligent as its operator.
    The law of GIGO (garbage in, garbage out) is followed very strictly in this domain.


    In this chapter, we will discuss some of the important steps involved in solving
    a physical problem using numerical computation. Defining a problem in proper terms
    is just the first step. Making the right model and then using the right method
    to solve (solver) the problem distinguishes the experienced scientist/engineer
    from the naïve one.


    ## 7.2 Physical Problems


    Everything in our physical world is governed by physical laws. Thanks to scientists
    who toiled under difficult circumstances and came up with fine solutions to phenomena
    happening around us, we obtained mathematical theories for physical laws. To test
    these mathematical formalisms of physical laws, we use computational techniques.
    Analytical computation involves the use of symbols. Numerical computation, instead,
    involves the use of computers, which follow binary logic. Both approaches have
    their limitations. Even though analytical solutions are very accurate, they are
    difficult to derive, especially if a predefined framework is absent. On the other
    hand, numerical solutions are always an approximation of real values. In any case,
    if the computation yields the same results as that of a real experiment, the two
    results validate each other. Numerical simulations can remove the need of doing
    an experiment altogether provided we have a well-tested mathematical formalism.
    For example, nuclear powers of our times don’t test nuclear bombs “for real” any
    more. The data about nuclear explosion, which were obtained during real nuclear
    explosions, enabled scientists to model these physical systems quite accurately,
    thus eliminating the need for real testing.


    In addition to applications like simulating a real experiment, modeling physical
    problems is a good educational exercise. While modeling, hands-on exercises enable
    students to explore a subject in depth and give proper meaning to the topic being
    investigated. Solving numerical problems and the visualization of results make
    the learning permanent and also ignites research regarding flaws in mathematical
    theory, which ultimately leads to new discoveries.


    ## 7.3 Defining a Model


    Modeling means writing equations for a physical system. As the name suggests,
    an equation is about equating two sides. An equation is written using an `=` sign
    where terms on the left-hand side equal terms on the right-hand side. The terms
    on either side of equations can be numbers or expressions. For example:


    ```

    $$ 3x+4y+9z=10 $$

    ```


    This is an equation having one term, `3x + 4y + 9z`, on the left-hand side (LHS)
    and one term, `10`, on the right-hand side (RHS). Please note that whereas LHS
    is an algebraic expression, RHS is a number.


    Expressions are written using functions, which are simply relations between two
    domains. The function `f(x) = y` is a relation between `y` and `x` using rules
    of algebra. Mathematics has a rich library of functions that we can use to make
    expressions. The function we choose depends on the problem. Some functions describe
    certain situations better than others. For example, oscillatory behavior can be
    described in a reasonable manner using trigonometric functions like `sin(x)` and
    `cos(x)`. Objects moving in straight lines can be described well using linear
    equations like `y = mx + c` where `x` is their present position, `m` is the constant
    rate of change of `x` with respect to `y`, and `c` is the offset position. Objects
    moving in a curved fashion can be described by various nonlinear functions (where
    the power of the dependent variable, like `x` in the previous example, is not
    1).


    In real life, we can have situations that are a mixture of these scenarios. For
    example, an object can oscillate and move in curved fashion at the same time.
    In this case, we would write an expression using a mixture of functions or find
    new functions that could explain the behavior of the object. Verification of these
    choices of functions is done by finding solutions to equations describing the
    behavior and matching it with observations made about an object. If they match
    perfectly, we obtain perfect solutions. In most cases, an exact solution might
    be difficult to obtain. In these cases, we get an “approximate” solution. If the
    errors involved while obtaining an approximate solution are within tolerance limits,
    the models can be acceptable.


    As previously discussed, physical situations can be analytically solved by writing
    mathematical expressions in terms of functions involving dependent variables.
    The simplest problems have simple functions between dependent variables with a
    single equation. There can be situations where multiple equations are needed to
    explain a physical behavior. In cases of multiple equations being solved, the
    theory of matrices comes in handy.


    Suppose Equations [7.1] and [7.2] define the physical behavior of a system:


    ```

    $$ -x+3y=4 $$

    ```


    (7.1)


    ```

    $$ 2x-4y=-3 $$

    ```


    (7.2)


    Then this system of two equations can be represented by a matrix equation, as
    follows:


    ```

    $$ \left[\begin{array}{cc}-1& 3\\ {}2& -4\end{array}\right]+\left[\begin{array}{c}x\\
    {}y\end{array}\right]=\left[\begin{array}{c}4\\ {}3\end{array}\right] $$

    ```


    Now, using matrix algebra, the values of variables `x` and `y` can be found such
    that they satisfy the equations. Those values are called roots of these equations.
    These roots are the point in 2D space (because we have two dependent variables)
    where the system will find stability for that physical problem. In this way, we
    can predict the behavior of a system without actually doing an experiment.'
