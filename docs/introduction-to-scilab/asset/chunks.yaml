    \ output for each block\n    *   Define the nature of each block in terms of number\
    \ of channels, type of data at each channel, frequency of data, and so on\n* \
    \  Choose XCOS blocks that match these requirements and connect them as per model\
    \ requirements\n*   Tune the model by changing the properties of the block(s)\
    \ as required\n\nVery complicated models would require defining a superblock.\
    \ A superblock is a fully functional XCOS diagram that can be further made as\
    \ a single block and used in other simulation diagrams. This way, you can break\
    \ a bigger problem into blocks and their sub-blocks. This modular approach enables\
    \ easy debugging provided all blocks are well labeled and th edeveloper is well\
    \ informed about the capabilities of a particular block.\n\n## 8.9 Summary\n\n\
    In this chapter, we have discussed the usage of the XCOS module available with\
    \ Scilab. It provides the capabilities to program a physical problem in a graphical\
    \ way. The physical problems must be chopped up in pieces of code. These blocks\
    \ must explicitly define the input and output ports and the purpose as a code\
    \ development process provided the developers know which block to find, where\
    \ to find it, and how to use it. The documentation for each block is quite extensive\
    \ and can be found using the `help` window. With this final chapter about XCOS,\
    \ our introduction to Scilab is complete.\n\nIndex A 2D Animation comet() function\
