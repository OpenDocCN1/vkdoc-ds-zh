- fmt: '# Differentiation and Integration in Dynamic Systems


    The mathematical concept of differentiation and integration becomes very important
    when we need to work with a dynamic system. When the system is constantly changing
    the values of dependent variables to produce a scenario, it becomes important
    to know the rate of change of these variables. When these variables are independent
    of each other, we use simple derivatives to define their rate of change. When
    they are not independent of each other, we use partial derivatives for the same.


    For example, Newton’s second law of motion indicates that the rate of change of
    velocity of an object is directly proportional to the force applied on it. Equation [7.3](#A458922_1_En_7_Chapter.html#Equ3)
    demonstrates this concept mathematically:


    ![ $$ F\propto \frac{dv}{dx} $$ ](A458922_1_En_7_Chapter_Equ3.gif)


    (7.3)


    The proportionality is turned into equality by substituting for a constant of
    multiplication `m` such that


    ![ $$ F=m\times \frac{dy}{dx} $$ ](A458922_1_En_7_Chapter_Equ4.gif)


    (7.4)


    If we know the values or expressions for `F`, this equation can be solved analytically
    and solutions can be found to this equation. But, in some cases, the analytical
    solution may be too difficult to obtain. In such cases, we digitize the system
    and find a numerical solution.


    There are many methods to digitize and numerically solve a given function. Programs
    to implement a particular method to solve a function numerically are called solvers.
    Many solvers exist to solve a function. The choice of solver is critical to successfully
    obtain a solution. For example, Equation [7.4](#A458922_1_En_7_Chapter.html#Equ4)
    is a differential equation. It is a first-order ordinary differential equation.
    A number of solvers exist to solve it including Euler and Runge-Kutta. The choice
    of a particular solver depends on the accuracy of its solution, the time taken
    for obtaining a solution, and the amount of memory used during the process. The
    latter is important where memory is not a freely expendable commodity like microcomputers
    with limited memory storage (for example, RaspberryPi).


    The advantage of using Scilab to perform a numerical computation lies in the fact
    that it has a very rich library of functions to perform various tasks required.
    The predefined functions have been optimized for speed and accuracy (in some cases,
    accuracy can be predefined). This enables the user to rapidly prototype the problem
    instead of concentrating on writing functions to do basic tasks and optimizing
    them for speed, accuracy, and memory usage.


    ## Scilab Packages


    A number of packages exists to perform numerical computations in a particular
    scientific domain. Scilab uses the `Atoms` package manager for managing (installing,
    deleting, and updating) a Scilab package. The web site [`https://wiki.scilab.org/ATOMS`](https://wiki.scilab.org/ATOMS)
    describes its usage.


    Clicking the menu item `Applications -> Module Manager ATOMS` opens up the `Atoms`
    (AuTomatic mOdules Management for Scilab) package manager. It lists a variety
    of specialized modules for Scilab. It is frequently updated with new developments.
    You can select a package by clicking its name and install it using the `Install`
    button. In a similar way, you can uninstall the package. You can also perform
    these actions using a Scilab command line.


    ### Searching a Package


    If you know the name of the package, you can search for the same using the following
    command:


    ```

    1  −−>atomsSearch("coselica")

    2  ans =

    3  !coselica Standard Open Modelica Blocks   !

    4  −−>atomsSearch("arduino")

    5  ans =

    6  !arduino Arduino Communication through Serial   !

    7  −−>atomsSearch("raspberrypi")

    8  ans  =

    9  []

    ```


    Whereas the modules named `coselica` and `arduino` could be found, the module
    named `raspberrypi` returned an empty string. (In other words, it could not be
    found.)


    ### Installing a Package


    The commands to install a module use the built-in function `atomInstall()` as
    follows:


    ```

    1  −−>atomsInstall("scidemo")

    2  ans =


    4  !scidemo 0.2.2  allusers    SCI/contrib/scidemo/0.2.2  I   !

    5  !                                                          !

    6  !apifun  0.4.2  allusers    SCI/contrib/apifun/0.4.2   A   !

    ```


    The returned argument shows the version number of the module as well as the path
    at which it is stored. The module is loaded during the next startup run of Scilab
    automatically. To load a module manually, you can use the command `atomsLoad("scidemo")`.


    ### Removing a Package


    The built-in function `atomsRemove("scidemo")` can be used to remove the package
    `arduino`:


    ```

    1  −−>atomsRemove("scidemo")

    2  ans =


    4  !scidemo 0.2.2  allusers    SCI/contrib/scidemo/0.2.2   I    !

    5  !                                                          !

    6  !apifun  0.4.2  allusers    SCI/contrib/apifun/0.4.2    A    !

    ```


    ### Listing Packages


    The built-in function `atomsList()` can be issued at the command line to obtain
    a detailed list of packages sorted in alphabetical order. For example, the following
    output is produced at the time of writing:


    ```

    1  −−>atomsList

    2  apifun − Check input arguments in macros

    3  assert − A collection of predicate functions

    4  condnb − Evaluates the condition number of functions.

    5  coselica − Standard Open Modelica Blocks

    6  CPGE − CPGE dedicated Xcos blocks

    7  dbldbl − Double−Double floating point numbers

    8  diffcode − Automatic differentiation

    9  dispmat − Display matrices graphically

    10  Dynpeak − Scilab toolbox for the detection of pulses in hormonal signals

    11  FACT − a toolbox for chemometric applications, e.g. regressions, discriminant
    analysis, multiway analysis

    12  floatingpoint − Functions to manage floating point numbers

    13  guibuilder − A Graphic User Interface Builder

    14  helptbx − Update the help of a module automatically .

    15  iodelay − manipulation and frequency analysis of linear dynamical systems
    with input or output delays

    16  makematrix − A collection of test matrices .

    17  Mathieu − Solve Mathieu equations, calculate Mathieu functions

    18  mingw − Dynamic link with MinGW for Scilab on Windows

    19  neuralnetwork − This is a Scilab Neural Network Module which covers supervised
    and unsupervised training algorithms

    20  number − Integers algorithms

    21  optkelley − Scilab software for Iterative Methods for Optimization

    22  removed − All pages of functions removed from Scilab 4.1.2 to 6.0 gathered
    in a single place

    23  scibench − A collection of benchmarks

    24  scicv − Interface to the Computer Vision library OpenCV

    25  scidemo − A collection of demonstrations

    26  serial − A toolbox for communication over a Serial Port in Scilab

    27  specfun − A collection of special functions

    28  stixbox − Statistics toolbox

    29  uman − User MANual in console + online + browser, easy languages switch, related
    bugs, comb mailing lists ...

    30  uncprb − Provide 35 unconstrained optimization problems

    ```


    ## XCOS


    One of the most attractive features of Scilab (which is absent in both MATLAB
    and Octave) is an XCOS graphical programming environment. It is similar to MATLAB’s
    graphical programming environment called Simulink. A detailed discussion of XCOS
    is the topic of Chapter [8](#A458922_1_En_8_Chapter.html).


    ## Summary


    Almost all branches of science and engineering require the performance of numerical
    computations. Scilab is one of the alternatives for doing such computations. Scilab
    has a rich library of optimized functions for general computation that is growing
    day-by-day as developers all around the world are contributing to the effort.
    Also, it has a variety of packages for performing specialized jobs. This makes
    Scilab an ideal choice for prototyping a numerical computation problem efficiently.


