    # 6. Functions and Loops


    ## 6.1 Introduction


    When a particular numerical task needs to be “repeated” over different data points,
    digital computers become a useful tool since they can perform this action with
    greater speeds than humans. Loops perform exactly this task. Using a condition
    to check the start and termination rules, users can perform repetitive parts of
    a process as desired. Different programming languages and environments have different
    rules for defining loops. Scilab provides a simple way to define and run loops.
    In addition to loops, functions also define an important part of modern programming
    architecture. A big program may require a set of instructions to be called at
    different times. Hence, this set of instructions can be defined as a subprogram,
    which can be requested to perform the computation at a desired time. In this way,
    a complicated task can be divided into many small parts. This architecture of
    programming is called modular programming. It is the most popular way of programming
    since it is quite logical, good at visualizing the problem, and easy to debug.
    The most popular way of defining these small sets of instructions is to define
    them as functions. Together, functions and loops break a numerical computation
    problem into a series of simpler problems that can be accessed as required. In
    this chapter, we will discuss both of these concepts in detail.


    ## 6.2 Loops


    Loops form an essential part of an algorithm since they perform the tasks that
    computers perform best: doing repetitive actions in a very fast manner. Loops
    can come in many flavors such as `for` loop, which repeats certain tasks over
    a list of variable values; `while` loop, which checks a logical condition before
    executing a certain task; and `if-then-else` loop, which checks a condition and
    directs the flow of an algorithm. The loop you choose depends on the problem at
    hand.


    A variety of functions and their usage are described in the following sections.
    Judging their usage critically becomes supremely important because the looping
    part of an algorithm consumes most of the execution time.


    ### 6.2.1 while


    `while` loop defines a logical condition and, until it is satisfied, it runs a
    block of code. The syntax for `while` loop is the following:


    ```

    1  while condition

    2  BODY

    3  endwhile

    ```


    Here, the keyword `while` initiates the execution of a `while` loop. The `condition`
    is a logical condition whose answer can be ''`true`'' (1) or ''`false`'' (0).
    The `BODY` encompasses the string of commands that is executed until the condition
    holds `true`, as shown in Listing [6-1](#A458922_1_En_6_Chapter.html#Par7).


    ```

    1  i = 1

    2  while i<20

    3      disp(i);

    4      i = i∗2;

    5   end

    Listing 6-1

    while.sce

    ```


    The result is shown as follows:


    ```

    1  −−>exec(''/Users/sandeepnagar/.../while.sce'', −1)

    2  1.

    3  2.

    4  4.

    5  8.

    6  16

    ```


    The code `while.sce` first initializes the variable i to the numerical value 1\.
    It then checks the condition i < 20\. This is true at the first step when i =
    1\. Consequently, it enters the loop and executes the command `disp(i)`. (The
    numerical value 1 is printed on the terminal.) Then the next line is executed
    ( i = i * 2 ), which makes the new value of i = 2\. At the end of the loop, the
    control is further taken by the condition statement ( i < 20). Until this holds
    `true`, the loop runs and, hence, 1, 2, 4, 8, 16 are printed. When i = 16 and
    the statement i = i * 2 is executed, the new value of i becomes 32\. Now the condition
    is not satisfied and the loop is terminated.


    ### 6.2.2 Infinite Loops


    Some loops can run infinitely so they are called infinite loops. Try the code
    `while.sce` by initializing i = 0 instead of i = 1\. In this case, the value of
    i will always be 0 inside the loop and the condition i < 20 will always be `true`.
    Hence, the code will run forever if it is not interrupted. Infinite loops can
    be interrupted by the `Ctrl+C` key combination on an an ASCII keyboard.


    The onus of avoiding infinite loops lies with the user. Scilab will simply execute
    the statements mindlessly without showing a warning or error message. Technically,
    infinite loops are not programming errors as they are syntactically correct. In
    fact, infinite loops can be used if you need to generate an infinite stream of
    data or if you need to execute a Scilab program infinitely. For example, suppose
    a Scilab program reports the status of a remote wind turbine. This code needs
    to run infinitely unless interrupted. In another scenario, suppose an application
    requires a stream of random numbers. In this case, a Scilab code can be written
    to generate an infinite sequence of random numbers.'
