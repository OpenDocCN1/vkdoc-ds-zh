  trans: "\n# 网格图\n\n网格图是通过连接由坐标定义的网格点生成的。例如，请考虑清单 4-23 中的代码。\n\n```\n// 用于解释网格函数用法的程序\n\
    \n[X,Y] = meshgrid(−5:0.5:5, −5:.5:5);\nZ = sin(X)+cos(Y);\nmesh(X,Y,Z);\n清单 4-23\n\
    mesh.sce\n```\n\n这里，生成了一个二维坐标系，并存放在两个名为 `X` 和 `Y` 的数组中。对于这些定义 x 和 y 的点，定义了一个方程如下：\n\
    \n![$$ z=\\mathit{\\sin}(x)+\\mathit{\\cos}(x) $$](img/A458922_1_En_4_Chapter_Equ2.gif)\n\
    \n(4.2)\n\n这三个值（分别来自数组 `x`、`y` 和 `z`）被输入到 `mesh` 函数中。\n\n结果如图 4-26 所示。这三个坐标（`x`、`y`\
    \ 和 `z`）由向量 `X`、`Y` 和 `Z` 的对应元素定义。这些点用于创建网格图。\n\n![A458922_1_En_4_Fig26_HTML.gif](img/A458922_1_En_4_Fig26_HTML.gif)\n\
    \n图 4-26\n\n方程的 3D 图\n\n# 3D 直方图\n\n与二维直方图类似，三维直方图提供了关于具有二维依赖关系的数据分组的直观线索。3D 可视化以垂直实心条的形式呈现，如清单\
    \ 4-24 所示。\n\n```\n// 制作 3D 直方图的程序\n\nhist3d(5∗rand(10,10));\nhist3d(−5∗rand(10,10));\n\
    title('3D 直方图')\n清单 4-24\nhist3d.sce\n```\n\n在 `hist3d.sce` 中，随机数被放大并绘制在一个二维矩阵上。这些随机数生成了条柱的高度。生成了两个直方图，一个位于正象限，一个位于负象限。结果如图\
    \ 4-27 所示。\n\n![A458922_1_En_4_Fig27_HTML.gif](img/A458922_1_En_4_Fig27_HTML.gif)\n\
    \n图 4-27\n\n3D 直方图\n\n# 总结\n\n在本章中，我们介绍了用于二维和三维绘图以及动画的各种内置函数。凭借这些丰富的功能，Scilab\
    \ 为科学家和工程师提供了一个出色的开发环境。本章介绍的可视化工具可与许多商业软件相媲美。解释绘图的每一个选项超出了本章的范围，因此我们只讨论了最相关的函数。我们建议用户使用命令\
    \ `help plot` 来研究文档，并查看二维和三维绘图的多种选项以及修改绘图属性的选项。\n\n# 通过文件读写处理数据\n\n## 引言\n\n利用第\
    \ 4 章中的信息，您现在可以将物理问题用数值计算的形式表述出来，并在数字计算机上求解。这个过程需要满足以下要求：\n\n- 数据应为数字形式（一个数字文件）。\n\
    - 计算机程序应能够读取该文件并无错误地创建数组。\n  - 在这种情况下，错误纠正将是一个附加功能。\n  - 如果发生错误，应具备检查这些错误并向用户发出警告的机制。\n\
    - 数据应根据数据类型存储为数组，并能在需要时以适当的格式显示。\n- 对数据进行的数组操作会占用内存，这体现在磁盘上数据的读写方面。系统应为此提供支持。用户应能在需要时检查内存状态。\n\
    - 后处理任务包括以各种格式可视化数据：作为打印机的打印输出，作为终端或打印机/绘图仪上的图形，等等。\n- 如果能够为某个包含输入参数、处理数据以及输出文件或图形的特定实验生成报告，那么用户的这项任务就变得更容易了。\n\
    \nScilab 针对这些需求中的每一项都具备一些功能。在本章中，我们将讨论与处理各种格式数据输入和输出文件相关的一些功能。\n\n## 文件操作\n\n\
    文件操作是解决计算问题的重要组成部分。需要重点注意的是，文件系统依赖于操作系统。由于 Unix/Linux 一直是科学和工程领域流行的操作系统，因此 Scilab\
    \ 支持用于文件管理的 Unix/Linux 命令。当 Scilab 安装在 Windows 上时，您可以使用与 Linux 相同的命令来处理文件，因为您始终在\
    \ Scilab 微环境中工作。以下各节中的代码已在 Windows 8、MacOSX 10.12 和 Ubuntu 16.04 系统上测试过。\n\n###\
    \ 用户\n\n计算系统由不同的用户通过操作系统访问。每个用户定义一个工作区，然后在该工作区内工作，以避免损坏其他用户的文件。登录后，用户的工作区即对该用户激活。Scilab\
    \ 不提供针对该软件的登录功能，但当用户登录其操作系统时，他们的 Scilab 工作区也会被激活。（公用计算机不提供此功能。）工作区由各种文件和文件夹组成。文件存储数据，而文件夹/目录只是存储指向其他文件链接的特殊文件。因此，一个文件夹中可以存储多个文件。\n\
    \n您可以对文件对象执行许多操作。读取文件涉及将文件中的数据输入到所需位置。当该位置是计算机显示器并且您拥有文本可视化工具时，您可以以字符或符号的形式看到数据。当该位置是一个程序以接受文件中的数据时，数据被程序读取并输入到所需函数中。如果根据输入和输出端的要求需要格式转换，那么数据会有多种格式。某些文件（在本例中是\
    \ Scilab 的 `.sci` 和 `.sce` 文件）需要被执行（即运行程序）。\n\n对于上述所有目的，文件在操作之前被打开，并且必须在操作之后关闭。文件的状态（是打开还是关闭）由一个标志（通常是一个整数）来指示。\n\
    \n有些文件对于操作系统定义系统的行为至关重要。因此，不应更改这些文件。通过对用户授予权限，可以防止不必要的更改。“读取”和“写入”文件受到权限的限制。“管理员”（常被称为\
    \ `admin`）也称为“超级用户”，拥有编辑任何文件/文件夹的所有特权和权限。您需要了解特定计算机系统上定义的用户类型，然后相应地发出命令。如果您没有访问某些文件夹的权限，而输入数据存放在这些文件/文件夹内，那么除非您请求\
    \ `admin` 更改权限参数，否则您总会遇到错误。\n\n在公用计算机上，通常不授予 `admin` 权限。这限制了 `读取`、`写入` 和 `执行`\
    \ 操作。当用户使用个人计算机时，他们通常将自己声明为超级用户，因此其账户拥有所有必需的权限。在多人共享的计算机上，`admin` 有选择地分配 `读取`、`写入`\
    \ 和 `执行` 的权限。用户必须为所需操作寻求适当的权限。\n"
- fmt: '### 5.2.2 File Path


    Directories/folders can contain subdirectories/subfolders and files. This behavior
    can go to any level if this process is not restricted by the administrator. The
    `pwd` command stands for print working directory. On a Scilab terminal, typing
    `pwd` displays the path of the present working directory as shown in the following
    example:


    ```

    1  −−>pwd

    2  ans =

    3  /Users/

    ```


    Under the user, the `/Users` directory contains another directory named by the
    username (shown by `<userName>`) given to the user while installing the operating
    system. This is the primary workshop assigned to a Scilab session. Unless the
    user changes the directory, the user performs all tasks in this workspace. When
    `pwd` is typed in the terminal, a variable named `ans` stores the data (file path).
    As illustrated before, `ans` stores the last output at Scilab REPL. A variable
    (name chosen by the user) can be assigned to store the file name as a string.


    A file/folder is accessed by writing the file path on the terminal. Let’s do a
    small exercise to understand this process. To make a new directory, use `mkdir
    ''name''` as shown the following code:


    ```

    1  −>mkdir scilab // make new directory called ''scilab''

    2   ans =

    3  1.

    4  −−>cd scilab /// change present directory to the directory name ''scilab''

    5  ans =

    6  /Users/sandeepnagar/scilab

    7  −−>mkdir test // make a directory named ''test''

    8  ans =

    9  1.

    10  −−>cd test // change present directory to the directory name ''test''

    11  ans =

    12  /Users/sandeepnagar/scilab/test

    13  −−>ls // List the contents of present directory i.e ''test''

    14  ans =

    15  []

    16  −−>mkdir new // make a directory here named ''new''

    17  ans =

    18  1.

    19  −−>ls // List the contents of present directory i.e ''test''

    20  ans =

    21  new

    22  −−>rmdir new // remove the directory named ''new''

    23  ans =

    24  1.

    25  −−>ls // List the contents of present directory i.e ''test''

    26  ans =

    27  []

    28  −−>isdir(''/Users/sandeepnagar/scilab/test'') // Checking if a directory ''test''
    exists

    29  ans =

    30  T

    ```


    At line number 1, `mkdir scilab` makes a directory named `''scilab''`. To see
    the contents of the present directory, we can use the command `ls`, which stands
    for list. To change the directory, we can use the command `cd "file path"`. We
    will work in this directory for the rest of the exercises in this book.


    We can create a directory named `test` in the directory named `scilab`. We can
    see the list of its contents by using the command `ls`. When the directory is
    empty, `ans=[]` is displayed. If we now create a new directory named `new` within
    the subdirectory `test` by issuing the command `mkdir new` and then check for
    the list of contents, the result is shown as `ans=new`. To remove a directory,
    we can use the command `rmdir`. So, by executing `rmdir new`, we can see that
    the user has removed the directory named `new`.


    The command `isdir` checks whether the input argument (path) directs to a directory.
    When a directory is found at the input path, the output is the boolean variable
    `T` (True); otherwise, the output is `F` (False).


    ### 5.2.3 Creating Files and Saving Them


    The `save` and `load` commands enable us to write and read data to the memory:


    ```

    1  −−>a = rand(3,3)

    2  a =

    3  0.2113249    0.3303271    0.8497452

    4  0.7560439    0.6653811    0.6857310

    5  0.0002211    0.6283918    0.8782165

    6  −−>save(''rand_matrix.dat'',''a'')

    7  −−>ls

    8  ans =

    9  ! rand_matrix.dat   !

    10  −−>load(''rand_matrix.dat'',''a'')

    11  −−>a =

    12  0.2113249    0.3303271    0.8497452

    13  0.7560439    0.6653811    0.6857310

    14  0.0002211    0.6283918    0.8782165

    ```


    At line number 1, a variable named `a`, which stores a random value 3 × 3 matrix,
    is created first. At line number 2, this data is stored as a `.dat` file (data
    file) named `rand_matrix.dat`, which passes the variable name as the argument.
    When required, this file can be loaded in the workspace using the `load` command.
    Please note that the data don’t always have to be comprised of numbers.


    The data can be anything that a digital computer can handle, including pictures,
    videos, strings, and characters, just to name a few.


    Multiple variables can be stored in the same file by passing the name of variables
    at the time of saving:


    ```

    1  −−>a = rand(2,2)

    2  a =

    3  0.0683740    0.6623569

    4  0.5608486    0.7263507

    5  −−>b = rand(3,3)

    6  b =

    7  0.1985144    0.2312237    0.6525135

    8  0.5442573    0.2164633    0.3076091

    9  0.2320748    0.8833888    0.9329616

    10  −−>c = rand(3,2)

    11  c =

    12  0.2146008    0.2922267

    13  0.312642     0.5664249

    14  0.3616361    0.4826472

    15  −−>save(''rand_matrix1.dat'',''a'',''b'',''c'')

    16  −−>ls

    17  ans =

    18  !rand_matrix1.dat   !

    19  !                   !

    20  !rand_matrix.dat    !

    21  −−>load(''rand_matrix1.dat'',''a'',''b'',''c'')

    22  −−>a

    23  a =

    24  0.0683740    0.6623569

    25  0.5608486    0.7263507

    26  −−>b

    27  b =

    28  0.1985144    0.2312237    0.6525135

    29  0.5442573    0.216463     0.3076091

    30  0.2320748    0.8833888    0.9329616

    31  −−>c

    32  c =

    33  0.2146008    0.2922267

    34  0.312642     0.5664249

    35  0.3616361    0.4826472

    ```


    `help("save")` and `help("load")` give very useful instructions about using these
    commands.


    The `load()` function follows the same logic as the `save()` function. Data can
    be unzipped and loaded from a particular formatted file as an array. An array,
    thus populated, can be used for computation, and resultant files can be made using
    the `save()` function again (if required). Elaborate computations require this
    procedure to be repeated successively many times. Thus, the functions have been
    optimized to locate and load required data in a short time.


    #### 5.2.3.1 Opening and Closing Files


    To read and write data files, they must be opened and defined as readable and/or
    writeable. The command `mopen()` is used to create a nonexistent file or to open
    an existing file. For example, the following code shows how to create a file named
    `test.sce` in `write` mode. A variable named `file_handle` is used to store the
    event. Looking at the list of contents of the folder, you can see that a file
    by this name is indeed created. Similar to the `mopen()` command, the `mclose()`
    command is used to close the file:


    ```

    1  −−>f ile_handle = mopen(''test.sce'',''w'') // creates the f ile in ''write''
    mode

    2  f ile_handle =

    3  1.

    4  −−>ls

    5  ans =

    6  test.sce

    7  −−>mclose(f ile_handle) // close the f ile and an integer 0 is returned signifying
    successful closing of f ile

    8  ans =

    9  0.

    ```


    The `mode` parameter controls the access type for the file that can have one of
    the values found in Table [5-1](#A458922_1_En_5_Chapter.html#Tab1).


    **Table 5-1** Different File Modes


    | `r` | opens for reading (default). The file must exist; otherwise, it fails.
    |

    | :--- | :--- |

    | `w` | opens for writing. If the file exists, its contents are destroyed. |

    | `a` | opens for appending. It creates the file if it does not exist. |

    | `r+` | opens for both reading and writing. The file must exist; otherwise, it
    fails. |

    | `w+` | opens for both reading and writing. If the file exists, its contents
    are destroyed. |

    | `a+` | opens for both reading and appending. It creates the file if it does
    not exist. |


    In addition, the characters in Table [5-2](#A458922_1_En_5_Chapter.html#Tab2)
    can be used to specify the type of file.


    **Table 5-2** Different File Types


    | `t` | text file |

    | :--- | :--- |

    | `b` | binary file (default) |


    The default access mode is `''rb''` (binary file reading).'
