  trans: '

    ## 8.5 XCOS 编辑器


    编辑窗口是 Xcos 用于开发新模型（图示）的工作区。XCOS 编辑器窗口（如图 8-5 所示）允许你通过从调色板窗口选择调色板，用鼠标拖拽并释放到编辑器中来设计模型。你也可以通过在库中右键点击模块并选择
    `Add to ->` “图示名称”来将模块添加到图示中。


    ![A458922_1_En_8_Fig5_HTML.jpg](img/A458922_1_En_8_Fig5_HTML.jpg)


    图 8-5


    XCOS 编辑器窗口截图


    编辑器窗口上会出现多个模块，它们带有输入和输出端口。这些端口可以被连接起来构成一个模型。多个模块可以按所需方式连接，以定义特定的仿真。然后可以通过点击编辑器窗口工具栏上的箭头图标来运行仿真。如果仿真未设置停止时间，它将持续运行。你可以通过点击
    `Stop` 按钮来停止它，该按钮位于 `Start` 按钮旁边。编辑器中还按从左到右的顺序排列着以下按钮：


    *   `New`：新建一个图示

    *   `Open`：打开计算机上任意位置保存的现有图示

    *   `Open file in Scilab Current Directory`：打开当前工作目录中保存的现有图示

    *   `Save`：将图示保存到计算机中

    *   `Save as`：将图示保存为其他格式，例如 `zcos`（压缩的 XCOS 文件）、`xcos`（XCOS 文件）、`xmi`（Eclipse
    EMF 文件）

    *   `Print`：将图示打印到打印机或保存为 PDF 文件

    *   `Delete`：删除一个模块

    *   `Undo`：撤销上一步执行的操作。此操作可以连续进行。

    *   `Redo`：在执行 `Undo` 操作后恢复之前的状态。此操作也可以连续进行。

    *   `Fit diagram or blocks to view`：有时制作图示所需的区域会超出屏幕范围，此窗口会出现滚动条。使用此按钮，可使整个图示适配窗口大小。

    *   `Start`：启动一个仿真

    *   `Stop`：停止一个仿真

    *   `Zoom in`：放大图示视图

    *   `Zoom out`：缩小图示视图

    *   `Xcos Demonstrations`：运行一些基本演示

    *   `Help`：寻求关于 XCOS 命令的帮助，你可以在此输入查询内容，然后被引导至有用且相关的文档


    让我们点击 `Xcos Demonstrations` 按钮来启动一个简单的演示图示。我们会看到一个类似于图 8-6 所示的窗口。


    ![A458922_1_En_8_Fig6_HTML.jpg](img/A458922_1_En_8_Fig6_HTML.jpg)


    图 8-6


    显示 XCOS 演示选项的窗口


    通过点击 `Standard Demos` 然后点击 `Bouncing Balls`，我们会看到一个类似于图 8-7 所示的窗口。


    ![A458922_1_En_8_Fig7_HTML.jpg](img/A458922_1_En_8_Fig7_HTML.jpg)


    图 8-7


    显示 XCOS 演示 ⇒ 标准演示 ⇒ 弹球的窗口


    当我们运行这个仿真时，会观察到一个仿真模型：四个不同大小和颜色的球以不同速度在窗口壁之间弹跳。此窗口的截图如图 8-8 所示。


    ![A458922_1_En_8_Fig8_HTML.jpg](img/A458922_1_En_8_Fig8_HTML.jpg)


    图 8-8


    显示弹球动画的窗口截图


    ## 8.6 XCOS 菜单栏


    在本节中，我们将介绍 XCOS 的菜单栏，以便初学者能高效地导航他们的工作流程。XCOS 菜单栏位于 XCOS 窗口的顶部。快捷键显示在命令旁边，此处也已提及。大多数情况下，这些键使用键盘上的
    `Control` 键，用 `Ctrl` 表示。当需要同时按键时，组合键会用加号显示在中间。例如 `Ctrl+N` 表示同时按下 `Control` 键和
    `N` 键。

    '
- fmt: "*   File\n    *   `New` (`Ctrl+N`): This menu item opens a new empty Xcos\
    \ diagram in a new window.\n    *   `Open` (`Ctrl+O`): This item is used to load\
    \ an XML (`.zcos`) or a binary file (`.cos`), which contains a saved block diagram\
    \ or a palette. The command opens a dialog box that allows you to choose the folder\
    \ and the file.\n    *   `Save` (`Ctrl+S`): Select the `Save` menu item to save\
    \ the diagram in an XML file. When this is done for the first time or if the `Save\
    \ As` menu item has not been operated upon, a dialog allows you to choose a directory\
    \ and specify a file name without extension. The default extension is `.zcos`.\
    \ The diagram takes the name of the file (without the extension).\n    *   `Save\
    \ as` (`Ctrl+Shift+S`): This menu item is used to save the block diagram or palette\
    \ in a file with a new name. A dialog box allows specifying a file name without\
    \ the extension and a saving folder. The default extension is `.zcos`. The diagram\
    \ takes the name of the file (without the extension).\n    *   `Export` (`Ctrl+E`):\
    \ This item is used to export a figure of the current XCOS diagram. The export\
    \ can be done in the `wbmp`, `gif`, `html`, `JPEG`, `JPG`, `png`, `svg`, and `vml`\
    \ formats.\n    *   `Recent Files`: This menu item allows quick access to the\
    \ recent opened files.\n    *   `Print` (`Ctrl+P`): This item prints the current\
    \ diagram onto a printer.\n    *   `Close` (`Ctrl+W`): When several diagrams are\
    \ opened, this item closes the current diagram.\n    *   `Quit` (`Ctrl+Q`): The\
    \ menu item will close XCOS.\n*   Edit\n    *   `Undo` (`Ctrl+Z`): Select the\
    \ `Undo` menu item to undo the last edit operation in case of a mistake.\n   \
    \ *   `Redo` (`Ctrl+Y`): Select the `Redo` menu item to redo the last undo edit\
    \ operation.\n    *   `Cut` (`Ctrl+X`): This item is used to remove the selected\
    \ objects from the diagram and to copy them in the clipboard. When you cut a block,\
    \ all links connected to it are deleted as well.\n    *   `Copy` (`Ctrl+C`): `Copy`\
    \ is used to place a copy of the selected item in the clipboard.\n    *   `Paste`\
    \ (`Ctrl+V`): `Paste` places the content of the clipboard in the current diagram.\n\
    \    *   `Delete` (`Delete`): To delete blocks or links, select objects to be\
    \ deleted and then the `Delete` menu item. When you delete a block, all links\
    \ connected to it are deleted as well.\n    *   `Select all` (`Ctrl+A`): This\
    \ menu item selects all the blocks in the current diagram.\n    *   `Invert selection`:\
    \ This menu item inverts the current selection.\n    *   `Block Parameters` (`Ctrl+B`):\
    \ This item opens the block configuration dialog for the current selected block.\
    \ The configuration depends on the used block (see the `Block Help` menu item\
    \ to obtain more information on its configuration).\n    *   `Selection to superblock`:\
    \ This menu item converts a selection of blocks into a superblock.\n*   View\n\
    \    *   `Zoom in` (`Ctrl+Plus`): When you select this menu item, the diagram\
    \ is zoomed in by a factor of 10.\n    *   `Zoom out` (`Ctrl+Minus`): When you\
    \ select this menu item, the diagram is zoomed out by a factor of 10.\n    * \
    \  `Fit diagram to view`: When you select this menu item, the diagram is fit to\
    \ the size of the current window.\n    *   `Normal 100%`: This menu item resize\
    \ the diagram components at their normal displaying dimensions.\n    *   `Palette\
    \ browser`: This menu item opens the palette browser.\n    *   `Diagram browser`:\
    \ This menu item displays a window that lists the global properties of a diagram\
    \ and all its objects (blocks and links).\n    *   `Viewport`: This menu item\
    \ displays the Viewport window. With Viewport, you can move the working area onto\
    \ a part of the diagram. You can zoom and unzoom parts of a diagram.\n    *  \
    \ `Details`: This menu item displays a window by a selected block that lists properties\
    \ of a block.\n*   Simulation:\n    *   `Setup`: In the main XCOS window, clicking\
    \ the `Setup` menu item invokes the dialog box, which allows changing governing\
    \ parameters.\n    *   `Execution Trace and Debug`: This menu item sets XCOS in\
    \ debug mode. It opens a dialog box in which you can choose the debugging mode.\n\
    \    *   `Set Context`: With this menu item, you obtain a dialog box where you\
    \ can enter Scilab instructions for defining the symbolic XCOS parameters used\
    \ in block definitions. These instructions will be evaluated each time the diagram\
    \ is loaded. If you change the value of a symbolic XCOS parameter in the context,\
    \ all the blocks that contains this symbolic parameter are updated when you click\
    \ `OK`.\n    *   `Compile`: This menu item compiles the block diagram. This doesn’t\
    \ need to be used because compilation is done automatically. Normally, a new compilation\
    \ is not needed if only system parameters and internal states are modified.\n\
    \    *   `Modelica initialize`: This menu item opens a specific dialog to the\
    \ Modelica compiler, where you can see the components of a drawn model and also\
    \ select the solvers.\n    *   `Start`: This menu item starts the simulation.\
    \ If the system has already been simulated, a dialog box appears where you can\
    \ choose to continue, restart, or end the simulation.\n    *   `Stop`: You can\
    \ interrupt the simulation by clicking the `Stop` menu item. Block parameters\
    \ can be changed and then simulation can be continued again.\n*   Format:\n  \
    \  *   `Rotate` (`Ctrl+R`): `Rotate` allows you to turn a block on the left with\
    \ an angle of 90°. Rotation affects all the selected blocks.\n    *   `Flip` (`Ctrl+F`):\
    \ To reverse the positions of the activation inputs and outputs set at the top\
    \ and the bottom of a block, select a block and select the `Flip` menu item. This\
    \ neither affects the order nor the position of the input and output event ports,\
    \ which are numbered from left to right. Flipping affects all the selected blocks.\n\
    \    *   `Mirror` (`Ctrl+M`): To reverse the positions of the (regular) inputs\
    \ and outputs set on the left and the right of a block, select a block and select\
    \ the `Mirror` menu item. This does not affect the order or the position of the\
    \ input and output ports, which are numbered from top to bottom. Mirroring affects\
    \ all the selected blocks.\n    *   `Show/Hide shadow`: This menu item allows\
    \ you to select 3D shapes for selected blocks and associated parameters.\n   \
    \ *   `Align Blocks`: When you select several blocks, it is possible to align\
    \ them on a horizontal axis (top, bottom, and middle) or on vertical axis (left,\
    \ right, center).\n    *   `Border Color`: This menu item allows you to change\
    \ the border color of the selected blocks.\n    *   `Fill Color`: This menu item\
    \ allows you to change the fill color of the selected blocks.\n    *   `Auto-Position`:\
    \ This menu item allows you to change the position of the block. First, select\
    \ the block(s) and select the appropriate menu item or use the shortcut (`P`).\n\
    \    *   `Link Style`: This menu item allows you to change the style of the link.\
    \ First, select the link and select the appropriate menu item or use the shortcuts\
    \ (`H`), (`S`), (`V`), and (`O`).\n    *   `Diagram background`: This menu item\
    \ allows you to change the background color.\n    *   `Grid`: This menu item allows\
    \ you to activate/de-activate the grid. With the grid, the block and link placement\
    \ on the working area is easier and you obtain a more readable diagram.\n*   Help\n\
    \    *   `Xcos Help` (`F1`): This menu item opens the main help browser (if it\
    \ is not open) on the XCOS help chapter.\n    *   `Block Help`: To get help on\
    \ a XCOS block, select the block and then click this menu item.\n    *   `XCOS\
    \ Demonstrations`: This item allows you to open some examples of XCOS diagrams.\n\
    \    *   `About XCOS`: The `About XCOS` item displays the current version of XCOS\
    \ in a dialog."
