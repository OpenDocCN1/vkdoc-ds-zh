- fmt: '### 4.3.5 Contour Maps


    Contour maps are frequently used to visualize the projection of a function on
    a 2D surface. They are used in various branches of science and engineering, especially
    geophysics where information of measurement parameters like temperature, pressure,
    and humidity is projected onto a map. In addition, contour maps are also used
    to visualize the 2D mathematical projection on a plane.


    Scilab provides the built-in function `contour2d()` for this purpose. Its usage
    is explained in the example code in Listing [4-12](#A458922_1_En_4_Chapter.html#Par42).
    Detailed usage of the function can be learned by using the command `help contour2d`.
    Essentially, the function takes x, y, and z values and the value for the number
    of levels. The code produces random numbers and plots them as per their value
    on a 2D matrix.


    ```

    1  // Program to plot 2D contours

    2  x = 1:10;

    3  y = 1:10;

    4  z = rand(10,10);

    5  level_number = 8;

    6  contour2d(x,y,z, level_number)

    7  title(''Plotting contour map'')

    8  xlabel(''x'')

    9  ylabel(''y'')

    Listing 4-12

    contour.sce

    ```


    Figure [4-15](#A458922_1_En_4_Chapter.html#Fig15) shows the result of the code.


    ![A458922_1_En_4_Fig15_HTML.gif](A458922_1_En_4_Fig15_HTML.gif)


    Figure 4-15


    Plotting a vector field using champ


    Instead of contour outlines, filled contours can be obtained using the built-in
    function `contourf()`. It follows a similar syntax as the `contour2d()` function.
    (See Listing [4-13](#A458922_1_En_4_Chapter.html#Par45) and Figure [4-16](#A458922_1_En_4_Chapter.html#Fig16).)


    ![A458922_1_En_4_Fig16_HTML.gif](A458922_1_En_4_Fig16_HTML.gif)


    Figure 4-16


    Plotting a vector field using champ


    ```

    1  // Program to plot 2D contours

    2  x = 1:10;

    3  y = 1:10;

    4  z = rand(10,10);

    5  level_number = 8;

    6  contourf(x,y,z, level_number)

    7  title(''Plotting contour map'')

    8  xlabel(''x'')

    9  ylabel(''y'')

    Listing 4-13

    contourf.sce

    ```


    The color-coded areas are on the same level in Figure [4-16](#A458922_1_En_4_Chapter.html#Fig16).
    Since the z values are taken from a random number generator function, `rand()`,
    the figure will be different each time the code `contourf.sce` is run.


    Contour maps are an easy way to visualize the smoothness of 2D data. Smooth data
    will have little variation and, hence, will fall under the same level. The choice
    of the level range will define the degree of smoothness. For example, suppose
    an infrared camera measures the temperature of a room and the data are color-coded
    for visual display. Contours will be defined by the different levels of temperature
    ranges. If the temperature is uniform in a region, it will be coded with a similar
    color. The difference in temperature of that region will be within the range defined
    and, thus, the definition of the range will become critical. If the minimum and
    maximum values of temperature are T [1] and T [2] and the number of levels are
    n, then the temperature range of a zone is given by


    ```

    |T_2 - T_1| / n

    ```


    ## 4.4 2D Animation


    During simulation, it is sometimes useful to animate an equation to understand
    its evolution. Scilab contains very useful functions for this purpose. Please
    note that figures provided are snapshots-at-the-end for the animations. Users
    should write the code as discussed and test it on their own to see the animation
    on a computer monitor. Animations are found to be particularly useful for teaching
    concepts to students.


    ### 4.4.1 comet


    The `comet()` function comes in handy in such cases. In Listing [4-14](#A458922_1_En_4_Chapter.html#Par50),
    we animate the equation `x^5 - x^3 + x + 5` using the `comet` function.


    ```

    1  // Program to demonstarte usage of comet


    3  x = linspace(−%pi,%pi,500);

    4  comet(x,%sˆ5−%sˆ3+%s+5)

    5  xtitle(''Using comet function to animate an equation'')

    6  xlabel(''x'')

    7  ylabel(''y'')

    Listing 4-14

    comet.sce

    ```


    ### 4.4.2 paramfplot2d()


    Time evolution of a function at multiple points can be represented by the `paramfplot2d()`
    function. Let’s consider the evolution of the function `y = sin(x) + sin(2x) +
    sin(4x)` (mixing of a signal with double and four times its own frequency). The
    resulting signal is the complex waves combining these three primary waves (`sin(x)`,
    `sin(2x)`, and `sin(4x)`), as shown in Figure [4-17](#A458922_1_En_4_Chapter.html#Fig17)
    and Listing [4-15](#A458922_1_En_4_Chapter.html#Par52).


    ![A458922_1_En_4_Fig17_HTML.gif](A458922_1_En_4_Fig17_HTML.gif)


    Figure 4-17


    Plotting using the comet function


    ```

    1  deff(''y=f(x,t)'',''y=t∗sin(x)+sin(2∗x)+sin(4∗x)'') // Def ining equation

    2  x = linspace(−4∗%pi,4∗%pi,10e3); // def ining spatial steps

    3  t = 100;

    4  time_speed = 0:0.05:1; // step size determines speed of animation

    5  paramfplot2d(f,x,time_speed);

    6  xtitle(''Using paramfplot2d function to animate an equation'')

    7  xlabel(''x'')

    8  ylabel(''y'')

    Listing 4-15

    paramfplot2d.sce

    ```


    Please note that `deff` is used to define a function. Its usage can be checked
    from `help deff`. Its detailed usage will be discussed in the chapter concerning
    the definition of Scilab function.


    ## 4.5 Plotting Multiple Plots in the Same Graph


    Multiple plots can be plotted within the same figure by simply supplying x-axis
    and y-axis vectors, as shown in Listing [4-16](#A458922_1_En_4_Chapter.html#Par55)
    and Figure [4-18](#A458922_1_En_4_Chapter.html#Fig18).


    ![A458922_1_En_4_Fig18_HTML.gif](A458922_1_En_4_Fig18_HTML.gif)


    Figure 4-18


    Plotting using the paramfplot2d function


    ```

    1  // Program for multiple plots with legends


    3  x = linspace(1,10,30);

    4  plot(x,x.ˆ2,''k∗'')

    5  plot(x,x.ˆ2.5,''r−'')

    6  plot(x,x.ˆ3,''b−−'')

    7  legend([''xˆ2'';''xˆ3'';''xˆ4'']);

    8  title(''Plotting multiple plots in same window'')

    9  xlabel(''x'')

    10  ylabel(''y'')

    Listing 4-16

    multi.sce

    ```


    Figure [4-18](#A458922_1_En_4_Chapter.html#Fig18) is obtained by running the code
    in Listing [4-16](#A458922_1_En_4_Chapter.html#Par55). These types of plots are
    generally used to check the variation of results by varying a particular parameter.'
