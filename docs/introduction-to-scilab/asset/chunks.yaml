- fmt: '### 4.5.1 Plotting Multiple Plots Separately


    The `subplot(row,column,index)` command is used to plot multiple plots within
    the same figure separately. `subplot(2,2,4)` means that the plot will be on the
    second row, second column, and fourth index. (See Listing [4-17](#A458922_1_En_4_Chapter.html#Par58)
    and Figure [4-19](#A458922_1_En_4_Chapter.html#Fig19).)


    ![A458922_1_En_4_Fig19_HTML.gif](A458922_1_En_4_Fig19_HTML.gif)


    Figure 4-19

    Multiple plots within the same figure


    ```

    1  // Program to show usage of subplot function

    2  // subplot function produces a f igure as a matrix


    4  x = linspace(−2∗%pi,2∗%pi,1000);

    5  //1st f igure of a 2X2 f igure matrix

    6  subplot(221)

    7  plot(x,sin(x),''r∗'')

    8  title(''Plot for sin(x)'')

    9  xlabel(''x'')

    10  ylabel(''sin(x)'')


    12  //2nd f igure of a 2X2 f igure matrix

    13  subplot(222)

    14  plot(x,sin(x)+sin(2.∗x),''b∗'')

    15  title(''Plot for sin(x) + sin(2x)'')

    16  xlabel(''x'')

    17  ylabel(''sin(x) + sin(2x)'')


    19  //3rd f igure of a 2X2 f igure matrix

    20  subplot(2,2,3)

    21  plot(x,sin(x) + sin(3.∗ x),''g∗'')

    22  title(''Plot for sin(x) + sin(3x)'')

    23  xlabel(''x'')

    24  ylabel(''sin(x) + sin(3x)'')


    26  //4th f igure of a 2X2 f igure matrix

    27  subplot(2,2,4)

    28  plot(x,sin(x) + sin(4.∗x),''k∗'')

    29  title(''Plot for sin(x) + sin(4x)'')

    30  xlabel(''x'')

    31  ylabel(''sin(x) + sin(4x)'')

    Listing 4-17

    subplot.sce

    ```


    As seen in Figure [4-20](#A458922_1_En_4_Chapter.html#Fig20), plots are organized
    as a matrix where the row number as well as the column number dictate its position.
    The index of the plot can then be used to treat it as an object for further processing
    on a graphical object. Theoretically, the limit of the number of rows and columns
    depends on the memory of computer but, while printing, users must understand that
    according to the size of plots, some of them will go outside the print area. Hence,
    judicious usage of this command is recommended. The automatic generation of a
    figure matrix can be achieved by generating the index of plots using a loop.


    ![A458922_1_En_4_Fig20_HTML.gif](A458922_1_En_4_Fig20_HTML.gif)


    Figure 4-20

    Separate multiple plots within the same figure using a subplot


    ## 4.6 3D Plots


    There are various functions available for 3D plotting in Scilab. Choosing one
    of them depends on your particular problem.


    ### 4.6.1 plot3d


    The built-in function `plot3d()` plots a 3D plot for the given values of x, y,
    and z defined as arrays. One of its uses is shown in Listing [4-18](#A458922_1_En_4_Chapter.html#Par61),
    where the equation [4.1](#A458922_1_En_4_Chapter.html#Equ1) is plotted.


    ![ $$ z=\sqrt{x^2+{y}^2} $$ ](A458922_1_En_4_Chapter_Equ1.gif)

    (4.1)


    ```

    1  // Program to plot 3D graph using plot3d


    3  a = linspace(−8,8,41)'';

    4  b = linspace(−8,8,41)''

    5  [xx, yy] = meshgrid(a,b);

    6  c = sqrt(xx.ˆ2 + yy.ˆ2)+%eps;

    7  plot3d(a,b,c)

    Listing 4-18

    plot3d.sce

    ```


    ### 4.6.2 plot3d1()


    The built-in function `plot3d1()` plots a colored 3D plot for the given values
    of x, y, and z defined as arrays. The color of cells indicates the z value range.
    Its usage is shown in Listing [4-19](#A458922_1_En_4_Chapter.html#Par63) and Figure
    [4-21](#A458922_1_En_4_Chapter.html#Fig21), where Equation [4.1](#A458922_1_En_4_Chapter.html#Equ1)
    is plotted.


    ![A458922_1_En_4_Fig21_HTML.gif](A458922_1_En_4_Fig21_HTML.gif)


    Figure 4-21

    3D plot of an equation


    ```

    1  // Program to plot 3D graph using plot3d1


    3  a = linspace(−8,8,41)'';

    4  b = linspace(−8,8,41)''

    5  [xx, yy] = meshgrid(a,b);

    6  c = sqrt(xx.ˆ2 + yy.ˆ2)+%eps;

    7  plot3d1(a,b,c)

    Listing 4-19

    plot3d1.sce

    ```


    The color coding provided by `plot3d1()` becomes an additional feature in some
    critical analyses. The contours in a 3D plot give the shape of projection areas
    where the value of the measured system is the same. For example, suppose Figure
    [4-22](#A458922_1_En_4_Chapter.html#Fig22) represents the electric field near
    a charged particle placed at its center. The color represents the zone in 3D where
    the force on that charged particle will be within a certain range.


    ![A458922_1_En_4_Fig22_HTML.gif](A458922_1_En_4_Fig22_HTML.gif)


    Figure 4-22

    3D plot of an equation


    ### 4.6.3 plot3d2()


    Another built-in function `plot3d2()` builds the 3D graph using rectangular facets.
    One example is shown in Listing [4-20](#A458922_1_En_4_Chapter.html#Par66).


    ```

    1  // Program to plot 3D graph using plot3d2


    3  u = linspace(−%pi/2,%pi/2,40);

    4  v = linspace(0,2∗%pi,20);

    5  X = cos(u)''∗cos(v);

    6  Y = cos(u)''∗sin(v);

    7  Z = sin(u)''∗ones(v);

    8  plot3d2(X,Y,Z);

    Listing 4-20

    plot3d2.sce

    ```


    The result is shown in Figure [4-23](#A458922_1_En_4_Chapter.html#Fig23). It is
    important to note that a finer mesh will make the figure have better resolution
    of its 3D feature. For a finer mesh, the `linspace()` arguments should be defined
    with a smaller step size. However, at the same time, having a finer mesh increases
    the computational time. Thus, 3D rendering is a computationally intensive task,
    but it is sometimes desired. The choice of parameters depends upon the requirements
    of data analysis. When a finer resolution of 3D surface features is sought, users
    have to go for higher rendering power (which directly results in high computational
    power requirements).


    ![A458922_1_En_4_Fig23_HTML.gif](A458922_1_En_4_Fig23_HTML.gif)


    Figure 4-23

    3D plot of an equation


    ### 4.6.4 plot3d3()


    Another built-in function, `plot3d3()`, builds the 3D mesh graph using rectangular
    facets. The only difference between `plot3d2` and `plot3d3` is that the former
    produces a surface plot and the latter produces a mesh plot on rectangular facets.
    One example is shown in Listing [4-21](#A458922_1_En_4_Chapter.html#Par69).


    ```

    1  // Program to plot 3D graph using plot3d3


    3  u = linspace(−%pi/2,%pi/2,40);

    4  v = linspace(0,2∗%pi,20);

    5  X = cos(u)''∗cos(v);

    6  Y = cos(u)''∗sin(v);

    7  Z = sin(u)''∗ones(v);

    8  plot3d3(X,Y,Z);

    Listing 4-21

    plot3d3.sce

    ```


    The same arguments apply for the resolution of mesh as that for surface. It is,
    however, important to note that rendering a mesh is a bit less computationally
    intensive than rendering a surface.


    ### 4.6.5 Surface Plots


    Surface plots are obtained using the built-in function `surf()`, which takes a
    single argument of the height of the mesh point. By connecting these mesh points,
    a surface is created. By default, surface facets are color-coded differently to
    identify them. This can be checked in the code shown in Listing [4-22](#A458922_1_En_4_Chapter.html#Par72)
    and Figure [4-24](#A458922_1_En_4_Chapter.html#Fig24).


    ![A458922_1_En_4_Fig24_HTML.gif](A458922_1_En_4_Fig24_HTML.gif)


    Figure 4-24

    3D plot of an equation


    ```

    1  // Program to plot 3D graph using surf

    2  subplot(2,2,1)

    3  z = rand(10,10);

    4  surf(z)

    5  title(''surf'')


    7  subplot(2,2,2)

    8  surf(z,''facecol'',''red'',''edgecol'',''blu'')

    9  title(''surf function with face and edge color'')


    11  subplot(2,2,3)

    12  surf(z,''facecol'',''interp'')

    13  title(''surf function interpolated'')


    15  subplot(2,2,4)

    16  x=rand(10,10);

    17  y=rand(10,10);

    18  z=rand(10,10);

    19  surf(z,''facecol'',''red'',''edgecol'',''blu'')

    20  title(''surf function with each coordinated def ined seperately'')

    Listing 4-22

    surf.sce

    ```


    Note that when additional arguments about face color being red and edge colors
    being blue are fed, the plot is plotted with a red-colored surface having blue-colored
    edges, as shown in Figure [4-25](#A458922_1_En_4_Chapter.html#Fig25). The input
    to the `surf()` command is an array. It is created by the built-in function `rand()`
    in this case, but it can be created externally and fed to the `surf()` function.


    ![A458922_1_En_4_Fig25_HTML.jpg](A458922_1_En_4_Fig25_HTML.jpg)


    Figure 4-25

    3D plot of an equation


    In the third subplot, random mesh values are defined by the `rand()` function,
    but intermediate values between the two mesh points are interpolated. This results
    in color coding of contours. In the fourth subplot, individual Cartesian coordinates
    for x, y, and z taken from the `rand()` function are fed to the `surf` function
    seperately.'
