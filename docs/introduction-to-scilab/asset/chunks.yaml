- fmt: '# 1. Introduction to Scilab


    ## 1.1 Introduction to Numerical Computing


    Numerical computing is a field of mathematics where problems are made to be solved
    on a computing device. A variety of software tools exists for this purpose. In
    fact, `MATLAB`, `Mathematica`, `Octave`, and `Scilab` are specialized softwares
    for this purpose. A developer can also use general-purpose programming languages
    such as `C`, `C++`, `Python`, and `Julia` to define mathematical problems, but
    specialized softwares present predefined libraries that have been either optimized
    for stability or speed or, in same cases, for both. They can also be produced
    on targeted hardware for a chosen hardware platform. Thus, using specialized software
    is a good way to learn the numerical recipes for physical problems in an easy
    fashion. But, the primary question is why we should go for a numerical solution
    at all.


    The postwar era has seen tremendous advances in computing technologies as well
    as in associated software development for specific purposes. Cost-effective computing
    resources have made it possible to simulate almost all physical problems. As a
    result, numerical computing has developed as a separate area of mathematics that
    constantly borrows and contributes to other areas of mathematics, creating an
    ecosystem of computing resources for model-based simulation of physical reality.


    The need for numerical computing has its roots in the difficulty of deriving analytical
    solutions for problems. Analytical solutions start with a super-simplified version
    of physical reality. Such solution are then refined by adding complexities and
    defining additional parameters to the governing equation(s). But, most of the
    time, the efforts to just define the problem grow exponentially to the point that
    it becomes difficult even when you have a team of humans, let alone one person.
    Thus, the need for an alternative way became apparent, which came in the form
    of numerical computing.


    While analytical computation requires only a pencil, paper, and the human mind,
    numerical computation requires a calculating device, or a computer. Successful
    implementation of a computing device to solve problems (especially involving repeated
    tasks) over a large array of data points was first observed in many fields of
    science and engineering, for example, when breaking an enemy’s secret codes and
    simulating nuclear reactions before nuclear explosions. The scope of numerical
    computation was further expanded for civilian purposes. Designing and simulating
    waterways, dams, electric power stations, and urban roadways are just a few areas
    of engineering where similar techniques were utilized. All of these applications
    needed to solve an equation or system of equations for a physical model representing
    a physical problem.


    There are two ways in which we can solve these equations—namely, by using analytical
    methods and by implementing numerical techniques. We will only concentrate on
    numerical methods of solving equations in this book.


    As time progressed, various schemes to define analytical functions — like differentiation,
    integration, and trigonometric—were written for digital computers. This involved
    their digitization, which certainly introduced some errors. Knowledge of the introduced
    errors and their proper nullification yielded valuable information quicker than
    analytical results. Thus, it became one of the most actively researched fields
    of science and continues to be one to this day. The search for faster and accurate
    algorithms continues to drive innovation in the field of numerical computing and
    enables humanity to simulate otherwise impossible tasks.


    ## 1.2 Various Software Alternatives


    A number of alternatives exists to perform numerical computation. Programming
    languages written to handle mathematical functions, such as `FORTRAN`, `C`, `Python`,
    and `Java`, can be used to write algorithms for numerical computation. A set of
    specialized softwares exists that include `MATLAB`, `Scilab`, and `Mathematica`.
    Their rich libraries now run in many GBs of data. `MATLAB` has been tremendously
    popular among the scientific community since 1984. The cheap availability of digital
    computing resources propelled its usage in industry and academia to such an extent
    that virtually every lab needed `MATLAB`. Even though it wasn’t very expensive
    for a relatively rich western world, it proved to be a costly piece of software
    for the rest of the world, particularly third-world countries. This part of the
    world, which has a rich pool of scientists, needed an open source alternative
    to `MATLAB`. The solution came in the form of `Octave` and `Scilab`. `Scilab`
    is extremely powerful, yet it was not designed exactly along the lines of `MATLAB`,
    syntax-wise. On the other hand, `Octave` was developed so that `MATLAB`’s `.m`
    files could directly run on `Octave`. `Scilab` is now being developed for developers
    who would like to shift their work to an open source platform completely but do
    not mind editing their `MATLAB` files if required.


    When compared to the `MATLAB` package , including specialized packages for various
    engineering domains and `Simulink` for the graphical programming paradigm, `Octave`
    presents a limited variety of solutions. It includes almost all the functions
    found in `MATLAB`’s basic package and some specialized packages, but it does not
    provide `Simulink`’s equivalent. One the other hand, `Scilab` proves to be a complete
    alternative since `Scilab`’s `XCOS` provides `Simulink`’s equivalent, and specialized
    packages of `Scilab` can rival the packages provided by `MATLAB`’s functionalities.
    In this book, we will introduce their basic usage.


    Other alternatives include programming languages such as `Python`, `C`, `C++`,
    and `Java`. They each have advantages as well as disadvantages, so we advise users
    to consider their own needs when they make their choice. `Scilab` is a good choice
    for prototyping a problem quickly and checking the results. General-purpose programming
    languages turn out to be a better alternative while working with web-based data
    collection, analysis and visualization, and implementation of a physical problem
    on a physical computing platform like `FPGA` boards, microcontrollers, and so
    on. `Scilab` is a high-level language, primarily intended for numerical computation,
    and it has a rich library of tools for solving numerical linear algebra problems,
    finding the roots of nonlinear equations, integrating ordinary functions, manipulating
    polynomials, and solving ordinary as well as partial-differential and differential
    algebraic equations. This makes it suitable for most basic numerical computational
    work.'
  raw: '# 1. Introduction to Scilab


    ## 1.1 Introduction to Numerical Computing


    Numerical computing is a field of mathematics where problems are made to be solved
    on a computing device. A variety of software tools exists for this purpose. In
    fact, MATLAB, Mathematica, Octave, and Scilab are specialized softwares for this
    purpose. A developer can also use general-purpose programming languages such as
    C, C++, Python, and Julia to define mathematical problems, but specialized softwares
    present predefined libraries that have been either optimized for stability or
    speed or, in same cases, for both. They can also be produced on targeted hardware
    for a chosen hardware platform. Thus, using specialized software is a good way
    to learn the numerical recipes for physical problems in an easy fashion. But,
    the primary question is why we should go for a numerical solution at all.


    The postwar era has seen tremendous advances in computing technologies as well
    as in associated software development for specific purposes. Cost-effective computing
    resources have made it possible to simulate almost all physical problems. As a
    result, numerical computing has developed as a separate area of mathematics that
    constantly borrows and contributes to other areas of mathematics, creating an
    ecosystem of computing resources for model-based simulation of physical reality.


    The need for numerical computing has its roots in the difficulty of deriving analytical
    solutions for problems. Analytical solutions start with a super-simplified version
    of physical reality. Such solution are then refined by adding complexities and
    defining additional parameters to the governing equation(s). But, most of the
    time, the efforts to just define the problem grow exponentially to the point that
    it becomes difficult even when you have a team of humans, let alone one person.
    Thus, the need for an alternative way became apparent, which came in the form
    of numerical computing.


    While analytical computation requires only a pencil, paper, and the human mind,
    numerical computation requires a calculating device, or a computer. Successful
    implementation of a computing device to solve problems (especially involving repeated
    tasks) over a large array of data points was first observed in many fields of
    science and engineering, for example, when breaking an enemy’s secret codes and
    simulating nuclear reactions before nuclear explosions. The scope of numerical
    computation was further expanded for civilian purposes. Designing and simulating
    waterways, dams, electric power stations, and urban roadways are just a few areas
    of engineering where similar techniques were utilized. All of these applications
    needed to solve an equation or system of equations for a physical model representing
    a physical problem.


    There are two ways in which we can solve these equations—namely, by using analytical
    methods and by implementing numerical techniques. We will only concentrate on
    numerical methods of solving equations in this book.


    As time progressed, various schemes to define analytical functions — like differentiation,
    integration, and trigonometric—were written for digital computers. This involved
    their digitization, which certainly introduced some errors. Knowledge of the introduced
    errors and their proper nullification yielded valuable information quicker than
    analytical results. Thus, it became one of the most actively researched fields
    of science and continues to be one to this day. The search for faster and accurate
    algorithms continues to drive innovation in the field of numerical computing and
    enables humanity to simulate otherwise impossible tasks.


    ## 1.2 Various Software Alternatives


    A number of alternatives exists to perform numerical computation. Programming
    languages written to handle mathematical functions, such as FORTRAN, C, Python,
    and Java, can be used to write algorithms for numerical computation. A set of
    specialized softwares exists that include MATLAB, Scilab, and Mathematica. Their
    rich libraries now run in many GBs of data. MATLAB has been tremendously popular
    among the scientific community since 1984\. The cheap availability of digital
    computing resources propelled its usage in industry and academia to such an extent
    that virtually every lab needed MATLAB. Even though it wasn’t very expensive for
    a relatively rich western world, it proved to be a costly piece of software for
    the rest of the world, particularly third-world countries. This part of the world,
    which has a rich pool of scientists, needed an open source alternative to MATLAB.
    The solution came in the form of Octave and Scilab. Scilab is extremely powerful,
    yet it was not designed exactly along the lines of MATLAB, syntax-wise. On the
    other hand, Octave was developed so that MATLAB’s `.m` files could directly run
    on Octave. Scilab is now being developed for developers who would like to shift
    their work to an open source platform completely but do not mind editing their
    MATLAB files if required.


    When compared to the MATLAB package , including specialized packages for various
    engineering domains and Simulink for the graphical programming paradigm, Octave
    presents a limited variety of solutions. It includes almost all the functions
    found in MATLAB’s basic package and some specialized packages, but it does not
    provide Simulink’s equivalent. One the other hand, Scilab proves to be a complete
    alternative since Scilab’s XCOS provides Simulink’s equivalent, and specialized
    packages of Scilab can rival the packages provided by MATLAB’s functionalities.
    In this book, we will introduce their basic usage.


    Other alternatives include programming languages such as Python, C, C++, and Java.
    They each have advantages as well as disadvantages, so we advise users to consider
    their own needs when they make their choice. Scilab is a good choice for prototyping
    a problem quickly and checking the results. General-purpose programming languages
    turn out to be a better alternative while working with web-based data collection,
    analysis and visualization, and implementation of a physical problem on a physical
    computing platform like FPGA boards, microcontrollers, and so on. Scilab is a
    high-level language, primarily intended for numerical computation, and it has
    a rich library of tools for solving numerical linear algebra problems, finding
    the roots of nonlinear equations, integrating ordinary functions, manipulating
    polynomials, and solving ordinary as well as partial-differential and differential
    algebraic equations. This makes it suitable for most basic numerical computational
    work.'
  trans: '

    # 1. Scilab 简介


    ## 1.1 数值计算简介


    数值计算是数学领域的一个分支，其目标是在计算设备上解决问题。为此，存在多种软件工具。事实上，`MATLAB`、`Mathematica`、`Octave`
    和 `Scilab` 都是专门用于此目的的软件。开发者也可以使用通用编程语言（例如 `C`、`C++`、`Python` 和 `Julia`）来定义数学问题，但专业软件提供了预定义的库，这些库要么针对稳定性进行了优化，要么针对速度进行了优化，有时甚至两者兼顾。它们还可以针对所选的硬件平台在目标硬件上生成。因此，使用专业软件是轻松学习物理问题数值方法的好方法。但首要的问题是，我们究竟为什么要寻求数值解法。


    战后时代见证了计算技术以及用于特定目的的配套软件开发取得了巨大进步。成本效益高的计算资源使得模拟几乎所有物理问题成为可能。因此，数值计算已发展成为数学的一个独立领域，它不断从数学的其他领域汲取养分并做出贡献，为基于模型的物理现实模拟创造了一个计算资源生态系统。


    对数值计算的需求源于推导问题解析解的困难性。解析解始于一个超级简化的物理现实版本。然后通过增加复杂性并为控制方程定义附加参数来完善此类解。但大多数情况下，仅仅定义问题的努力就会呈指数级增长，以至于即使拥有一个团队也难以应对，更不用说单个人了。因此，对替代方法的需求变得显而易见，数值计算应运而生。


    虽然解析计算只需要铅笔、纸和人脑，但数值计算则需要计算设备或计算机。成功利用计算设备解决涉及大量数据点的问题（尤其是涉及重复性任务的问题）最早出现在许多科学和工程领域，例如破译敌方密码以及在核爆炸前模拟核反应。数值计算的应用范围进一步扩展到民用领域。设计模拟水道、水坝、发电站和城市道路只是应用了类似技术的工程领域的几个例子。所有这些应用都需要为表示物理问题的物理模型求解一个或多个方程。


    我们有两种方法可以求解这些方程——即使用解析方法和实施数值技术。本书中，我们将只专注于求解方程的数值方法。


    随着时间的推移，各种定义解析函数（如微分、积分和三角函数）的方案被编写出来用于数字计算机。这涉及它们的数字化，这必然会引入一些误差。了解引入的误差及其适当的消除方法，能够比解析结果更快地提供有价值的信息。因此，它成为科学研究中最活跃的领域之一，并且至今仍是如此。对更快、更精确算法的追求持续推动着数值计算领域的创新，使人类能够模拟原本不可能完成的任务。


    ## 1.2 各种软件替代方案


    执行数值计算有多种选择。为处理数学函数而编写的编程语言，如 `FORTRAN`、`C`、`Python` 和 `Java`，可用于编写数值计算的算法。还存在一套专业软件，包括
    `MATLAB`、`Scilab` 和 `Mathematica`。它们丰富的库现在已占用数 GB 的数据。自 1984 年以来，`MATLAB` 在科学界一直非常受欢迎。数字计算资源的廉价可用性，使其在工业界和学术界的应用达到了几乎每个实验室都需要
    `MATLAB` 的程度。尽管对于相对富裕的西方世界来说，它并不非常昂贵，但对于世界其他地区，特别是第三世界国家来说，它却是一款昂贵的软件。而世界这片土地拥有丰富的科学家资源，需要
    `MATLAB` 的开源替代品。`Octave` 和 `Scilab` 的出现解决了这个问题。`Scilab` 非常强大，但其语法设计并不完全与 `MATLAB`
    相同。另一方面，`Octave` 的开发目标是使 `MATLAB` 的 `.m` 文件可以直接在 `Octave` 上运行。`Scilab` 现在正为那些希望将工作完全迁移到开源平台，但不介意在必要时编辑其
    `MATLAB` 文件的开发者而开发。


    与包含各个工程领域专业包和用于图形化编程范式的 `Simulink` 的 `MATLAB` 软件包相比，`Octave` 提供的解决方案种类有限。它包含了
    `MATLAB` 基本包和某些专业包中几乎所有的函数，但并未提供与 `Simulink` 等价的功能。另一方面，`Scilab` 被证明是一个完整的替代方案，因为
    `Scilab` 的 `XCOS` 提供了与 `Simulink` 等价的功能，并且 `Scilab` 的专业包可以与 `MATLAB` 提供的功能相媲美。本书中，我们将介绍它们的基本用法。


    其他替代方案包括诸如 `Python`、`C`、`C++` 和 `Java` 等编程语言。它们各有优缺点，因此我们建议用户根据自己的需求进行选择。`Scilab`
    是快速构建问题原型并检查结果的不错选择。而在处理基于 Web 的数据收集、分析和可视化，以及在物理计算平台（如 `FPGA` 板、微控制器等）上实现物理问题时，通用编程语言则是更好的选择。`Scilab`
    是一种高级语言，主要用于数值计算，拥有丰富的工具库，可用于解决数值线性代数问题、求非线性方程的根、积分普通函数、处理多项式以及求解常微分方程、偏微分方程和微分代数方程。这使得它适用于大多数基本的数值计算工作。

    '
- fmt: '# 1.3 History


    The history of Scilab’s creation starts in the 1980s. It was inspired by MATLAB’s
    Fortran code, which was developed by Cleve Moler. Moler later cofounded the MathWorks
    company with John Little. Scilab initially started as Blaise, a CACSD (computer-aided
    control system design) software. It was created at the IRIA (French Institute
    for Research in Computer Science and Control) by François Delebecque and Serge
    Steer. In 1984, Blaise became Basile and was distributed for a few years by Simulog,
    the first Inria (French National Institute for Research in Computer Science and
    Control) startup.


    In the 1990s, Simulog stopped distributing Basile. Inria renamed the software
    Scilab and continued its development with just six researchers. Scilab 1.1 was
    released on January 2, 1994, under an open source license. Until version 2.7,
    the Scilab community grew quite large. With support from companies and institutions,
    the Scilab Consortium was created in 2003 by Inria. In June 2017, Scilab Enterprises
    was formed and took charge of development. Based on the classic open source business
    model, Scilab Enterprises also offered professional services and support for Scilab.
    Scilab Enterprises joined the ESI group in 2017 and now develops as well as provides
    services related to Scilab. Scilab is in use in every strategic domain of science,
    industry, and services including space, aeronautics, automobile, energy, defense,
    finance, and transport.


    ## 1.4 Installation


    Scilab is an open source software distributed under CeCILL license, which is a
    version of GNU-GPL compatible licenses for free software. Please note that the
    following instructions have been tested on version 6.0.0. It can be downloaded
    from its web site as per the requirements of the operating system. Installation
    is quite straightforward and user forums and simple Google searches yield answers
    to common problems encountered by users. Scilab includes a GUI-based console for
    easy user interface.


    The online implementation of software is available at an Indian web site. In this
    case, users do not need to install the software on their own systems. They simply
    need to connect to a remote server using a web browser and they can run the Scilab
    program in a manner similar to local installation. This does, of course, require
    a rather fast Internet connection. (Users are encouraged to test this facility.)
    For the purpose of this book, we will recommend a local installation and work
    on the same.


    After proper installation at a Windows OS, users can see a Scilab icon among the
    list of installed programs. Double-clicking the icon will open a Scilab session.
    The same is true for MacOSX. For Linux-based OS distributions, you can choose
    either to click a desktop icon or simply to type `scilab` at the command line.


    ## 1.5 Workspace


    Figure 1-1 presents a screenshot of installed Scilab version 6.0.0. You can observe
    various partitions in the main windows:


    ![A458922_1_En_1_Fig1_HTML.jpg](A458922_1_En_1_Fig1_HTML.jpg)


    Figure 1-1


    Scilab screenshot


    *   File browser

    *   SCILAB 6.0.0 console

    *   Variable browser

    *   Command history

    *   News feed


    All these partitions have options of undocking (separating from the main window
    and opening it in another window) and closing as per requirements. We recommend
    keeping all these partitions open for now so first-time users can observe the
    computation and their results in an interactive way.


    To check if installation has been done for the version selected for download,
    we can type a simple command `ver` at the Scilab command prompt (shown as `-->`
    at the Scilab console window). The following output is displayed at the time of
    writing:


    ```

