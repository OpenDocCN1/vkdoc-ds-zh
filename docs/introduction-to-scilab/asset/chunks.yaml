    ### 4.2.3 `polarplot()`


    在数学分析中，当某些情况在笛卡尔坐标系中不表现出对称性，但在极坐标系中却表现出对称性时，极坐标就变得重要起来。在这些情况下，我们更倾向于使用极坐标而非笛卡尔坐标进行绘图。因此，我们的坐标不再是
    `x`、`y`，而是 `r`、`θ`，它们通过方程相互关联，如图 4-6 和 4-7 所示。


    ![A458922_1_En_4_Fig7_HTML.gif](img/A458922_1_En_4_Fig7_HTML.gif)


