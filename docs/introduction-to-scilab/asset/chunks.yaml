    9  xlabel(''x'')

    10  ylabel(''y'')

    代码清单 4-9

    champ.sce

    ```


    复数多项式可用于表示矢量场的水平和垂直分量，这些分量通常是测量得到的。`champ` 提供了一种简单的方法来可视化矢量场，然后对由此产生的力进行推断。（参见代码清单
    4-10 和图 4-13。）


