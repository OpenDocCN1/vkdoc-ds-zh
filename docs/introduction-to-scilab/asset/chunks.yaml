  trans: "\n# 3.10 求解线性方程组的根\n\n作为将数组实际应用于解决现实问题的一个例子，我们使用数组来求解线性方程组的根。假设我们有如下方程：\n\
    \n![ $$ 2x+4y-3z=4 $$ ](img/A458922_1_En_3_Chapter_Equ1.gif)\n\n(3.1)\n\n![ $$\
    \ -2x-3y+2z=-3 $$ ](img/A458922_1_En_3_Chapter_Equ2.gif)\n\n(3.2)\n\n![ $$ 4x+6y-8z=1\
    \ $$ ](img/A458922_1_En_3_Chapter_Equ3.gif)\n\n(3.3)\n\n我们希望找到使这三个方程同时成立的 `x`、`y`\
    \ 和 `z` 的值。为此，这些方程的第一种矩阵形式可以写成如下：\n\n![ $$ \\left[\\begin{array}{ccc}2& 4& -4\\\
    \\ {}-2& -3& 2\\\\ {}4& 6& -8\\end{array}\\right]\\times \\left[\\begin{array}{c}x\\\
    \\ {}y\\\\ {}z\\end{array}\\right]=\\left[\\begin{array}{c}4\\\\ {}-3\\\\ {}1\\\
    end{array}\\right] $$ ](A458922_1_En_3_Chapter_Equ4.gif)\n\n(3.4)\n\n如果我们假设\n\n\
    ![ $$ A=\\left[\\begin{array}{ccc}2& 4& -4\\\\ {}-2& -3& 2\\\\ {}4& 6& -8\\end{array}\\\
    right] $$ ](A458922_1_En_3_Chapter_Equ5.gif)\n\n(3.5)\n\n![ $$ X=\\left[\\begin{array}{c}x\\\
    \\ {}y\\\\ {}z\\end{array}\\right] $$ ](A458922_1_En_3_Chapter_Equ6.gif)\n\n(3.6)\n\
    \n![ $$ B=\\left[\\begin{array}{c}4\\\\ {}-3\\\\ {}1\\end{array}\\right] $$ ](A458922_1_En_3_Chapter_Equ7.gif)\n\
    \n(3.7)\n\n那么我们可以写成\n\n![ $$ Ax=B $$ ](img/A458922_1_En_3_Chapter_Equ8.gif)\n\n\
    (3.8)\n\n其解为\n\n![ $$ X={A}^{-1}B $$ ](img/A458922_1_En_3_Chapter_Equ9.gif)\n\n\
    (3.9)\n\n在 Scilab 中，只需一行命令即可轻松实现：\n\n```\n1  −−>A = [2,4,−4;−2,−3,2;4,6,−8]\n\
    2  A =\n\n4  2\\.    4\\.    −4.\n5  −2\\.   −3\\.    2.\n6  4\\.    6\\.    −8.\n\
    \n9  −−>B = [4; − 3;1]\n10  B =\n\n12  4.\n13  −3.\n14  1.\n\n16  −−>A\\B\n17\
    \  ans =\n\n19  −2.5\n20  3.5\n21  1.25\n```\n\n因此，`x = -2.5`、`y = 3.5` 和 `z =\
    \ 1.25` 满足这些方程。通过这种方式，Scilab 可以轻松地帮助执行复杂的矩阵计算。\n\n## 3.11 总结\n\n基于数组的计算是现代计算技术的核心。Scilab\
    \ 为轻松执行这些技术提供了一个非常合适的平台。各种预定义函数使用户能够在原型设计问题时节省时间。灵活定义多维数组和执行快速计算的方法是我们这个时代的主要需求。模拟过程中大部分时间要么花在循环中，要么花在数组操作上。预定义的数组操作已经过算法优化，确保了可靠性、时间效率和有效的内存管理。\n\
    \n# 4. 绘图\n\n## 4.1 引言\n\n没有可视化，数值计算就难以理解并最终做出判断。生成能够对数值结果进行有意义分析的复杂图形的出版级图像，一直是全世界科学家面临的挑战。许多商业软件满足了这一需求。Scilab\
    \ 也非常高效地提供了这一功能。其绘图功能包括从二维和三维的各种图形类型中进行选择；使用标题、带标签的坐标轴、网格和数据标签等附加信息装饰图形；以及编写方程和其他有关数据的重要信息。以下各节将详细描述这些操作。值得一提的是，绘图能力对于某些数值分析实验至关重要，因为渐进步骤的可视化指导能让人直观地理解所研究的问题。\n\
    \n## 4.2 二维绘图\n\n### 4.2.1 plot(x,y)\n\n由于我们需要在两个坐标轴上绘制数据，首先需要创建它们。假设 `x` 轴有 100\
    \ 个线性间隔的数据点，`y` 轴上的点由方程定义，如图 4-1 所示：\n\n![ $$ y={x}² $$ ](img/A458922_1_En_4_Chapter_Equa.gif)\n\
    \n![A458922_1_En_4_Fig1_HTML.gif](img/A458922_1_En_4_Fig1_HTML.gif)\n\n**图 4-1**\
    \ `y = x²`\n\n```\n1  >> x = linspace(0,100,100);\n2  >> y = x.ˆ2\n3  >> plot(x,y)\n\
    ```\n\n首先，我们定义一个变量 `x`，并放置从 0 到 100 的 100 个等间隔数据点。这构成了一个 1 x 100 的矩阵。通过指数运算的标量操作，我们定义一个变量\
    \ `y` 为 `x²`。需要注意，此操作是使用逐元素运算符定义的，以便矩阵 `x` 的每个元素都进行该运算。如果不这样，数组就需要进行平方运算，即自身相乘。这将产生错误，因为一个\
    \ n x m 矩阵只能与 m x n 矩阵相乘。最后，可以使用函数 `plot()`，它接受两个参数作为 x 轴和 y 轴的数据点。\n\n在命令提示符下输入\
    \ `help plot` 或 `help 'plot'` 可以深入了解这个用于绘制二维数据的强大函数。默认情况下，后续的绘图会叠加。要清除之前的绘图，请使用\
    \ `clf()`。此外，`plot` 函数可以计算输入参数：\n\n```\n1  −−>plot(x = linspace(0,100,100),x.ˆ2.5,'r∗')\n\
    ```\n\n这行代码的结果如图 4-2 所示。请注意，第三个参数，即字符串 `\"r*\"`，会在输入数组的每个数据点处用 `*` 来绘制数据。\n\n\
    ![A458922_1_En_4_Fig2_HTML.gif](img/A458922_1_En_4_Fig2_HTML.gif)\n\n**图 4-2**\
    \ `y = x²`\n\n可以使用 `plot()` 命令绘制多个图形。例如，让我们在 `-π` 和 `π` 之间绘制 `sin(x)` 和 `cos(x)`\
    \ 函数。以下是代码的第一个版本：\n\n```\n1  −−>x = linspace(−%pi,%pi,100);\n2  −−>plot(x,sin(x),'r∗',x,cos(x),'b−')\n\
    ```\n\n以下是代码的第二个版本：\n\n```\n1  −−>x = linspace(−%pi,%pi,100);\n2  −−>plot(x,sin(x),'r∗')\n\
    3  −−>plot(x,cos(x),'b−')\n```\n\n两个代码产生相似的图形，因为在第二个版本中，第二个图形覆盖在第一个图形之上，从而在同一个图形窗口上生成多个图形。图\
    \ 4-3 显示了结果，其中 `sin(x)` 和 `cos(x)` 分别用 `*` 和 `-` 标记绘制。\n\n![A458922_1_En_4_Fig3_HTML.gif](img/A458922_1_En_4_Fig3_HTML.gif)\n\
    \n**图 4-3** `sin(x)` 和 `cos(x)`\n\n### 4.2.2 plot2d(), plot2d2(), plot2d3(), 和\
    \ plot2d4()\n\n`plot2d` 命令的工作方式与 `plot` 命令类似。此外，这些函数还存在一些其他的变体，与绘图的具体方式有关：\n\n\
    1.  `plot2d2` 与 `plot2d` 相同，但曲线被假定为分段常数  \n2.  `plot2d3` 与 `plot2d` 相同，但曲线用垂直条绘制\
    \  \n3.  `plot2d4` 与 `plot2d` 相同，但曲线用箭头绘制  \n\n代码清单 4-1、4-2、4-3 和 4-4 说明了它们的用法。图\
    \ 4-4 和图 4-5 展示了它们如何在图形中表示。\n\n```\n1  // 使用 plot2d 函数绘图的程序\n2  x = linspace(−%pi,%pi,20)\n\
    3  plot2d(x,sin(x))\n4  xtitle('使用 plot2d 绘制 sin(x) 的图形')\n5  xlabel('角度')\n6\
    \  ylabel('sin(x)')\n代码清单 4-1\nplot2d.sce\n```\n\n```\n1  // 使用 plot2d2 函数绘图的程序\n\
    2  x = linspace(−%pi,%pi,20)\n3  plot2d2(x,sin(x))\n4  xtitle('使用 plot2d2 绘制 sin(x)\
    \ 的图形')\n5  xlabel('角度')\n6  ylabel('sin(x)')\n代码清单 4-2\nplot2d2.sce\n```\n\n\
    ```\n1  // 使用 plot2d3 函数绘图的程序\n2  x = linspace(−%pi,%pi,20)\n3  plot2d3(x,sin(x))\n\
    4  xtitle('使用 plot2d3 绘制 sin(x) 的图形')\n5  xlabel('角度')\n6  ylabel('sin(x)')\n\
    代码清单 4-3\nplot2d3.sce\n```\n\n![A458922_1_En_4_Fig5_HTML.gif](img/A458922_1_En_4_Fig5_HTML.gif)\n\
    \n**图 4-5** `sin(x)` 和 `cos(x)`\n\n![A458922_1_En_4_Fig4_HTML.gif](img/A458922_1_En_4_Fig4_HTML.gif)\n\
    \n**图 4-4** `sin(x)` 和 `cos(x)`\n\n```\n1  // 使用 plot2d4 函数绘图的程序\n2  x = linspace(−%pi,%pi,20)\n\
    3  plot2d4(x,sin(x))\n4  xtitle('使用 plot2d4 绘制 sin(x) 的图形')\n5  xlabel('角度')\n\
    6  ylabel('sin(x)')\n代码清单 4-4\nplot2d4.sce\n```\n"
- fmt: '### 4.2.3 `polarplot()`


    During mathematical analysis, polar coordinates become important in cases that
    do not exhibit symmetry in Cartesian systems, but that show symmetry in polar
    coordinates. In these cases, we prefer to plot in polar coordinates rather than
    Cartesian coordinates. So, instead of `x`, `y` our coordinates are `r`, `θ`, which
    are related by equations, as shown in Figures [4-6](#A458922_1_En_4_Chapter.html#Fig6)
    and [4-7](#A458922_1_En_4_Chapter.html#Fig7).


    ![A458922_1_En_4_Fig7_HTML.gif](A458922_1_En_4_Fig7_HTML.gif)


    Figure 4-7

    `sin(x)` and `cos(x)`


    ![A458922_1_En_4_Fig6_HTML.gif](A458922_1_En_4_Fig6_HTML.gif)


    Figure 4-6

    `sin(x)` and `cos(x)`


    `x = r × cos(θ)`

    `y = r × sin(θ)`


    The code given by `polarplot.sce` plots one such case, as shown in Listing [4-5](#A458922_1_En_4_Chapter.html#Par25).
    The result is given in Figure [4-8](#A458922_1_En_4_Chapter.html#Fig8).


    ![A458922_1_En_4_Fig8_HTML.gif](A458922_1_En_4_Fig8_HTML.gif)


    Figure 4-8

    Polar graph


    ```

    1  // Program to plot using polarplot function

    2  theta= 0:.01:3∗%pi;

    3  polarplot(sin(2∗theta), cos((2∗theta)))

    4  xtitle(''Using polarplot'')

    Listing 4-5

    polarplot.sce

    ```


    ## 4.3 Special Plots


    ### 4.3.1 Histograms


    Histograms are traditionally used to visualize the number of events occurring
    within different ranges. Scilab provides a useful function, `histplot()`, for
    this purpose that takes input for the number of bins and data provided as an array.
    For example, in the code titled `hist.sce` found in Listing [4-6](#A458922_1_En_4_Chapter.html#Par27),
    the normalized distribution of random numbers is plotted in Figure [4-9](#A458922_1_En_4_Chapter.html#Fig9).


    ![A458922_1_En_4_Fig9_HTML.gif](A458922_1_En_4_Fig9_HTML.gif)


    Figure 4-9

    Histogram plot


    ```

    1  // Program to plot histogram

    2  n = rand(1,10e4,''normal'');   // normalized gaussian random sample

    3  bins=20

    4  histplot(bins,n)

    5  title(''Histogram plotting random numbers'')

    6  xlabel(''x'')

    7  ylabel(''y'')

    Listing 4-6

    hist.sce

    ```


    Histograms are used to show the sampled data. From a dataset, one can segregate
    the data points according to their values into the number of bins and visualize
    which range of values dominate the profile. This provides useful information about
    the system. For example, values following normalized distribution represent systems
    that always follow certain kinds of statistics. In the present case depicted in
    Figure [4-9](#A458922_1_En_4_Chapter.html#Fig9), most of the data events occur
    in the middle. If this graph represents the probability of finding an electron
    between two atoms, then we can conclude that the electron is found mostly in the
    middle of the atoms. If this graph represents grades obtained by students in a
    class, then we can deduce that very few students obtain either very good or very
    bad grades (extremes of graph) and that most of the students got close to grades
    of 50 percent.


    ### 4.3.2 `matplot`


    To plot colors representing certain values, the `matplot` command is used, as
    shown in Listing [4-7](#A458922_1_En_4_Chapter.html#Par30) and illustrated in
    Figure [4-10](#A458922_1_En_4_Chapter.html#Fig10).


    ![A458922_1_En_4_Fig10_HTML.gif](A458922_1_En_4_Fig10_HTML.gif)


