    Matplot figure for `[1 2 3 4;5 4 3 6]`


    ```

    1  // Program to plot using Matplot function

    2  x = [1 2 3 4;5 4 3 6]

    3  Matplot(x)

    4  grayplot(x,y,m)

    5  xtitle(''Using Matplot'')

    6  xlabel(''x'')

    7  ylabel(''y'')

    Listing 4-7

    matplot.sce

    ```


    ### 4.3.3 `grayplot`


    Sometimes, we need to see the value of a two-dimensional function on a 2D plot.
    This is done by visualizing the components of the functional value `z` on `x`
    and `y` coordinates. `grayplot` plots a graph window for a 2D plot of the surface
    given by `z` on a grid defined by `x` and `y`. Each rectangle on the grid is filled
    with a gray or color level depending on the average value of `z` on the corners
    of the rectangle. (See Listing [4-8](#A458922_1_En_4_Chapter.html#Par32) and Figure
    [4-11](#A458922_1_En_4_Chapter.html#Fig11).)


    ![A458922_1_En_4_Fig11_HTML.gif](A458922_1_En_4_Fig11_HTML.gif)


    Figure 4-11

    `grayplot` figure for random numbers


    ```

    1  // Program to plot using grayplot function

    2  x = −10:10;

    3  y = −10:10;

    4  m = rand(21,21);

    5  grayplot(x,y,m)

    6  xtitle(''Using grayplot for random numbers'')

    7  xlabel(''x'')

    8  ylabel(''y'')

    Listing 4-8

    grayplot.sce

    ```


    Figure [4-11](#A458922_1_En_4_Chapter.html#Fig11) shows the color value as per
    the value of `z` (which is given by a random number in this case). The graph will
    result in different plots each time it is run because the value `z` is given by
    a random number. In fact, the effectiveness of random-number-generating algorithms
    can be visually inspected using `grayplot` by checking if two colors are situated
    close to each other.


    ### 4.3.4 `champ`


    Scientific and engineering studies employ the theoretical study of vector fields.
    Both in theoretical and practical studies, it is sometimes important to plot vector
    fields as per a given equation. Vectors are best described by arrows. To provide
    this facility, `champ` draws a 2D vector field. The length of the arrows is proportional
    to the intensity of the field. (See Listing [4-9](#A458922_1_En_4_Chapter.html#Par35)
    and Figure [4-12](#A458922_1_En_4_Chapter.html#Fig12).)


    ![A458922_1_En_4_Fig12_HTML.gif](A458922_1_En_4_Fig12_HTML.gif)


    Figure 4-12

    Plotting a vector field using `champ`


    ```

    1  // Program to plot using champ function for plotting a vector f ield

    2  x = linspace(−1,1,10);

    3  y = linspace(−1,1,10);

    4  [X,Y] = meshgrid(x,y);

    5  fy = 3.∗Y;

    6  fx = 0.5.∗X;

    7  champ(x,y,fx'',fy'')

    8  xtitle(''Using champ function to plot vector f ield'')

    9  xlabel(''x'')

    10  ylabel(''y'')

    Listing 4-9

    champ.sce

    ```


    Complex polynomials can be used to represent the horizontal and vertical components
    of the vector field, which are usually measured. `champ` provides an easy way
    to visualize the vector field and then make deductions about forces arising out
    of it. (See Listing [4-1](#A458922_1_En_4_Chapter.html#Par17) and Figure [4-13](#A458922_1_En_4_Chapter.html#Fig13).)


    ![A458922_1_En_4_Fig13_HTML.gif](A458922_1_En_4_Fig13_HTML.gif)


    Figure 4-13

    Plotting a vector field using `champ`


    ```

