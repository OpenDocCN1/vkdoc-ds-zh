    \ the block(s) and select the appropriate menu item or use the shortcut (P).\n\
    \    *   `Link Style`: This menu item allows you to change the style of the link.\
    \ First, select the link and select the appropriate menu item or use the shortcuts\
    \ (H), (S), (V), and (O).\n    *   `Diagram background`: This menu item allows\
    \ you to change the background color.\n    *   `Grid`: This menu item allows you\
    \ to activate/de-activate the grid. With the grid, the block and link placement\
    \ on the working area is easier and you obtain a more readable diagram.\n*   Help\n\
    \    *   `Xcos Help` (F1): This menu item opens the main help browser (if it is\
    \ not open) on the XCOS help chapter.\n    *   `Block Help`: To get help on a\
    \ XCOS block, select the block and then click this menu item.\n    *   `XCOS Demonstrations`:\
    \ This item allows you to open some examples of XCOS diagrams.\n    *   `About\
    \ XCOS`: The `About XCOS` item displays the current version of XCOS in a dialog."
  trans: "\n*   **文件**\n    *   `新建` (`Ctrl+N`): 该菜单项会在新窗口中打开一个新的空白 Xcos 图表。\n   \
    \ *   `打开` (`Ctrl+O`): 该菜单项用于加载包含已保存框图或模块库的 XML 文件 (`.zcos`) 或二进制文件 (`.cos`)。此命令会打开一个对话框，允许您选择文件夹和文件。\n\
    \    *   `保存` (`Ctrl+S`): 选择 `保存` 菜单项可将图表保存为 XML 文件。首次执行此操作或未使用过`另存为`菜单项时，对话框会允许您选择目录并指定不带扩展名的文件名。默认扩展名为\
    \ `.zcos`。图表将采用文件名（不带扩展名）作为其名称。\n    *   `另存为` (`Ctrl+Shift+S`): 该菜单项用于将框图或模块库以新名称保存到文件中。对话框允许指定不带扩展名的文件名和保存文件夹。默认扩展名为\
    \ `.zcos`。图表将采用文件名（不带扩展名）作为其名称。\n    *   `导出` (`Ctrl+E`): 该菜单项用于导出当前 XCOS 图表图形。可导出为\
    \ `wbmp`、`gif`、`html`、`JPEG`、`JPG`、`png`、`svg` 和 `vml` 格式。\n    *   `最近文件`: 该菜单项允许快速访问最近打开过的文件。\n\
    \    *   `打印` (`Ctrl+P`): 该菜单项将当前图表打印到打印机上。\n    *   `关闭` (`Ctrl+W`): 当打开多个图表时，该菜单项关闭当前图表。\n\
    \    *   `退出` (`Ctrl+Q`): 该菜单项将关闭 XCOS。\n*   **编辑**\n    *   `撤销` (`Ctrl+Z`):\
    \ 选择 `撤销` 菜单项可撤销上一步的编辑操作，以纠正错误。\n    *   `重做` (`Ctrl+Y`): 选择 `重做` 菜单项可重做上一步被撤销的编辑操作。\n\
    \    *   `剪切` (`Ctrl+X`): 该菜单项用于从图表中移除选中的对象，并将其复制到剪贴板。剪切一个模块时，与其连接的所有连线也将被删除。\n\
    \    *   `复制` (`Ctrl+C`): `复制` 用于将选中项的副本放入剪贴板。\n    *   `粘贴` (`Ctrl+V`): `粘贴`\
    \ 将剪贴板中的内容放入当前图表。\n    *   `删除` (`Delete`): 要删除模块或连线，先选中要删除的对象，然后选择 `删除` 菜单项。删除一个模块时，与其连接的所有连线也将被删除。\n\
    \    *   `全选` (`Ctrl+A`): 该菜单项选中当前图表中的所有模块。\n    *   `反选`: 该菜单项反转当前的选择状态。\n  \
    \  *   `模块参数` (`Ctrl+B`): 该菜单项为当前选中的模块打开模块配置对话框。配置取决于所使用的模块（请参阅 `模块帮助` 菜单项以获取关于其配置的更多信息）。\n\
    \    *   `选中项转为超模块`: 该菜单项将选中的一组模块转换为一个超模块。\n*   **视图**\n    *   `放大` (`Ctrl+加号`):\
    \ 选择此菜单项时，图表将放大 10%。\n    *   `缩小` (`Ctrl+减号`): 选择此菜单项时，图表将缩小 10%。\n    *   `适合窗口`:\
    \ 选择此菜单项时，图表将适应当前窗口的大小。\n    *   `正常 100%`: 该菜单项将图表组件调整为其正常显示尺寸。\n    *   `模块库浏览器`:\
    \ 该菜单项打开模块库浏览器。\n    *   `图表浏览器`: 该菜单项显示一个窗口，其中列出了图表的全局属性及其所有对象（模块和连线）。\n    *\
    \   `视口`: 该菜单项显示视口窗口。使用视口，您可以将工作区移动到图表的某一部分。您可以放大或缩小图表的各个部分。\n    *   `详情`: 选中一个模块后，该菜单项会显示一个窗口，列出该模块的属性。\n\
    *   **仿真**:\n    *   `设置`: 在主 XCOS 窗口中，点击 `设置` 菜单项会调用对话框，允许更改控制参数。\n    *   `执行跟踪与调试`:\
    \ 该菜单项将 XCOS 设置为调试模式。它会打开一个对话框，您可以在其中选择调试模式。\n    *   `设置上下文`: 通过此菜单项，您可以打开一个对话框，在其中输入\
    \ Scilab 指令以定义模块定义中使用的符号化 XCOS 参数。每次加载图表时都将评估这些指令。如果您在上下文中更改了某个符号化 XCOS 参数的值，点击\
    \ `确定` 后，所有包含此符号化参数的模块都将更新。\n    *   `编译`: 该菜单项编译框图。通常无需使用此功能，因为编译是自动完成的。通常，如果只修改了系统参数和内部状态，则无需新编译。\n\
    \    *   `Modelica 初始化`: 该菜单项为 Modelica 编译器打开一个特定对话框，您可以在其中查看绘制模型的组件，并选择求解器。\n\
    \    *   `启动`: 该菜单项启动仿真。如果系统已经仿真过，会弹出一个对话框，您可以在其中选择继续、重新启动或结束仿真。\n    *   `停止`:\
    \ 您可以通过点击 `停止` 菜单项来中断仿真。可以更改模块参数，然后再次继续仿真。\n*   **格式**:\n    *   `旋转` (`Ctrl+R`):\
    \ `旋转` 允许您将模块向左旋转 90°。旋转会影响所有选中的模块。\n    *   `翻转` (`Ctrl+F`): 要反转模块顶部和底部的使能输入输出位置，请选中一个模块并选择\
    \ `翻转` 菜单项。这不会影响输入和输出事件端口的顺序和位置，其编号从左到右。翻转会影响所有选中的模块。\n    *   `镜像` (`Ctrl+M`):\
    \ 要反转模块左侧和右侧的（常规）输入输出位置，请选中一个模块并选择 `镜像` 菜单项。这不会影响输入和输出端口的顺序和位置，其编号从上到下。镜像会影响所有选中的模块。\n\
    \    *   `显示/隐藏阴影`: 该菜单项允许您为选中的模块和相关参数选择 3D 形状。\n    *   `对齐模块`: 当您选择多个模块时，可以将其在水平轴（顶部、底部和中间）或垂直轴（左侧、右侧、中心）上对齐。\n\
    \    *   `边框颜色`: 该菜单项允许您更改选中模块的边框颜色。\n    *   `填充颜色`: 该菜单项允许您更改选中模块的填充颜色。\n  \
    \  *   `自动定位`: 该菜单项允许您更改模块的位置。首先选中一个或多个模块，然后选择相应的菜单项或使用快捷键 (`P`)。\n    *   `连线样式`:\
    \ 该菜单项允许您更改连线的样式。首先选中连线，然后选择相应的菜单项或使用快捷键 (`H`)、(`S`)、(`V`) 和 (`O`)。\n    *   `图表背景`:\
    \ 该菜单项允许您更改背景颜色。\n    *   `网格`: 该菜单项允许您激活/停用网格。使用网格，模块和连线在工作区上的放置更容易，并且可以获得更易读的图表。\n\
    *   **帮助**\n    *   `Xcos 帮助` (`F1`): 该菜单项在 XCOS 帮助章节打开主帮助浏览器（如果尚未打开）。\n    *\
    \   `模块帮助`: 要获取 XCOS 模块的帮助，请选中该模块，然后点击此菜单项。\n    *   `XCOS 演示`: 该菜单项允许您打开一些 XCOS\
    \ 图表示例。\n    *   `关于 XCOS`: `关于 XCOS` 项在一个对话框中显示 XCOS 的当前版本。\n"
- fmt: "# 8.7 Reconstructing the Bouncing Balls Example from Scratch\n\nAs an example,\
    \ let’s try to reconstruct the bouncing ball example discussed earlier from scratch.\
    \ We will start with the option `Demonstration blocks` in the left pane of the\
    \ XCOS palette window. Clicking this option presents three blocks, as shown in\
    \ Figure [8-9](#A458922_1_En_8_Chapter.html#Fig9). This example presents an XCOS\
    \ simulation for visualizing three colored balls that bounce from the walls of\
    \ their environment. One of the blocks, `Bounce`, produces the input, and another\
    \ block, `BounceXY`, produces the output. For this reason, the former has two\
    \ output ports on its right-hand side, whereas the latter has two input ports\
    \ on its left-hand side.\n\n![A458922_1_En_8_Fig9_HTML.jpg](A458922_1_En_8_Fig9_HTML.jpg)\n\
    \n**Figure 8-9**  \nScreenshot of XCOS’s screen for the bouncing balls example\n\
    \nNow, let’s drag and drop the blocks titled `Bounce` and `BounceXY` on the XCOS\
    \ editor window. The block `Bounce` has two output options, while `BouncyXY` has\
    \ two input options. The `BounceXY` block actually has a third port for timer.\
    \ The timer block can be collected from the section `Event Handling`. When all\
    \ three are dragged and dropped at the editor window, you get a screen similar\
    \ to the one shown in Figure [8-9](#A458922_1_En_8_Chapter.html#Fig9).\n\nAs soon\
    \ as you click one of the outputs of the `Bounce` block, a small, green colored\
    \ square is highlighted around it. A connector can be clicked and dragged until\
    \ the output of `BouncyXY` block and in this way a connection can be made. You\
    \ also need a timing block, which controls the timing parameters for this simulation.\
    \ This can be found in the `Event Handing` section of the left pane of the palette\
    \ window.\n\nNow these three blocks can be connected to obtain a connected diagram,\
    \ as shown in Figure [8-10](#A458922_1_En_8_Chapter.html#Fig10).\n\n![A458922_1_En_8_Fig10_HTML.jpg](A458922_1_En_8_Fig10_HTML.jpg)\n\
    \n**Figure 8-10**  \nXCOS palette window’s section named “Event Handling”\n\n\
    You can save this simulation with a name, say `BouncingBalls.zcos` file. This\
    \ simulation can then be made to run by clicking the `Start` button. As opposed\
    \ to the simulation model in Section 8.8, here you observe only two balls bouncing\
    \ off very fast.\n\nThe properties of a block can be changed by right-clicking\
    \ a block and choosing `Block Parameters`. For example, for all three blocks in\
    \ the current simulation, you can see that a list of parameters (as shown in Figures\
    \ [8-12](#A458922_1_En_8_Chapter.html#Fig12), [8-13](#A458922_1_En_8_Chapter.html#Fig13),\
    \ and [8-14](#A458922_1_En_8_Chapter.html#Fig14)) can be changed for running the\
    \ simulation.\n\n![A458922_1_En_8_Fig14_HTML.jpg](A458922_1_En_8_Fig14_HTML.jpg)\n\
    \n**Figure 8-14**  \nChanging the parameters of “CLOCKc” block\n\n![A458922_1_En_8_Fig13_HTML.jpg](A458922_1_En_8_Fig13_HTML.jpg)\n\
    \n**Figure 8-13**  \nChanging the parameters of “BOUNCEXY” block\n\n![A458922_1_En_8_Fig12_HTML.jpg](A458922_1_En_8_Fig12_HTML.jpg)\n\
    \n**Figure 8-12**  \nChanging the parameters of the “bouncing balls” block\n\n\
    ![A458922_1_En_8_Fig11_HTML.jpg](A458922_1_En_8_Fig11_HTML.jpg)\n\n**Figure 8-11**\
    \  \nScreenshot of XCOS’s screen for the bouncing balls diagram made from scratch\n\
    \n## 8.8 Making Simulations Using XCOS\n\nSimulation can prove to be a very powerful\
    \ tool to both teach and quickly make scientific simulations. Since they are graphical\
    \ in nature, the problems are quite intuitive to design. While teaching, you can\
    \ avoid technical parts about defining the code at first. Also, the animations\
    \ are quite visually appealing.\n\nSince the primary task of this chapter has\
    \ been to demonstrate a very primary usage of XCOS, outlining the usage of all\
    \ blocks has been skipped. Users are encouraged to explore other blocks as needed.\
    \ Each simulation model has different needs, but they can follow a similar pattern\
    \ as follows:\n\n- Break down the physical problem into smaller blocks\n  - Each\
    \ block must define the specific task to be performed in terms of well-defined\
    \ input + operation + output.\n- Define the input and output for each block\n\
    \  - Define the nature of each block in terms of number of channels, type of data\
    \ at each channel, frequency of data, and so on\n- Choose XCOS blocks that match\
    \ these requirements and connect them as per model requirements\n- Tune the model\
    \ by changing the properties of the block(s) as required\n\nVery complicated models\
    \ would require defining a superblock. A superblock is a fully functional XCOS\
    \ diagram that can be further made as a single block and used in other simulation\
    \ diagrams. This way, you can break a bigger problem into blocks and their sub-blocks.\
    \ This modular approach enables easy debugging provided all blocks are well labeled\
    \ and the developer is well informed about the capabilities of a particular block.\n\
    \n## 8.9 Summary\n\nIn this chapter, we have discussed the usage of the XCOS module\
    \ available with Scilab. It provides the capabilities to program a physical problem\
    \ in a graphical way. The physical problems must be chopped up in pieces of code.\
    \ These blocks must explicitly define the input and output ports and the purpose\
    \ as a code development process provided the developers know which block to find,\
    \ where to find it, and how to use it. The documentation for each block is quite\
    \ extensive and can be found using the `help` window. With this final chapter\
    \ about XCOS, our introduction to Scilab is complete.\n\n## Index\n\nA  \n2D Animation\
    \  \n`comet()` function  \n`paramfplot2d()` function  \n\nArrays  \nlogical operations\
    \  \nmatrices operations  \nconcatenation  \ndelete matrix  \n`det()`  \nelement\
    \ wise indexing  \ninversion  \nmathematical vector  \nmatrix multiplication \
    \ \n`pinv()` function  \nrandom matrix  \n`rank()` function  \nrows and columns\
    \  \nslicing  \n`trace()` function  \nunit vector  \nvectors  \n\nB  \n`bitxor()`\
    \ function  \nBoolean data  \n\nC  \nComments  \nComplex numbers  \n`abs()` function\
    \  \narithmetic  \ncomplex components  \nconjugates  \ngraphical description \
    \ \n`imult` method  \nreal and imaginary parts  \n\nD  \nData types  \nfloating\
    \ point objects  \nnumbers  \nnumerical data  \nDiscrete mathematics  \n`factor`\
    \ derives  \nfactorial  \noutputs  \npermutations  \nprimes  \noutputs  \n`rat()`\
    \ derives  \n\nE  \nExponent  \nEuler’s number  \n\nF, G  \nFloating point representation\
    \  \n\nH, I, J, K  \nHistogram plot  \n\nL  \nLinear equations  \n\nM  \nMathematical\
    \ calculation  \n`addsub.sce`  \ncalculator command prompt  \ndemonstration programs\
    \  \nvariable  \nMatrix manipulations  \ndiagonal matrices  \nmathematical operations\
    \  \n`cross()` function  \ndot products  \nones and zeros  \nreshape  \nscalar\
    \ multiplication  \nspecial matrices  \nupper and lower triangular  \n\nN  \n\
    Numerical computing  \n\nO  \nOperator precedence  \n\nP, Q  \nPlotting  \n3D\
    \ plotting: `multi.sce`, `paramfplot2d` function, `subplot(row, column, index)`\
    \ command  \n2D Plotting: `champ`, `contour2d()` function, contour maps, `grayplot`,\
    \ histograms, `matplot` command, `plot2d()`, `plot2d2()`, `plot2d3()` and `plot2d4()`,\
    \ `plot(x, y)`, polar graph, `polarplot()`  \n3D Plotting: histograms, mesh plots,\
    \ `plot3d`, `plot3d1()` function, `plot3d2()`, `plot3d3()`, surface plots  \n\
    Predefined constants  \n`complexCal.sce`  \n`constants.sce`  \nmathematical functions\
    \  \noutput  \n\nR  \nRead-eval-print loop (REPL)  \n\nS  \nScilab application\
    \  \nanalytical functions  \ncommand prompt files  \nformat command prompt  \n\
    default mode  \n`format()` function  \nsource code  \nHello World  \nhelp browser\
    \ window  \nhistory of  \ninstallation  \nMATLAB package  \nnumerical computing\
    \  \nSciNotes window  \nvariable browser  \nvariable browser window  \nworkspace\
    \  \nStrings  \n\nT, U  \n`testmatrix()` function  \n\nV, W, X, Y, Z  \nVariable\
    \ browser window  \nVariables  \nassignment operator (`=`)  \nglobal and local\
    \ variables  \nlist of  \nnaming conventions  \nstrings  \nVectors  \nautomatic\
