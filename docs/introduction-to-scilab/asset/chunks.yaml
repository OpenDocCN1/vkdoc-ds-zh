  trans: "\n# 8.1 简介\n\n历史上，MATLAB 有一个特性使其在教学计算便利性方面脱颖而出——Simulink。Simulink 并非基础 MATLAB\
    \ 的一部分，因此需要单独购买。借助 Simulink，你可以通过可视化的方式连接代码块来编写程序。Scilab 则提供了一个与之对应的工具 XCOS。XCOS\
    \ 是一个用于对动态（连续和离散）系统进行建模和仿真的工具箱。尽管其主要用途是仿真动态系统，但 XCOS 也可用于信号生成、数据可视化以及简单的代数运算。当仿真涉及互联的连续时间和离散时间组件的系统时，XCOS\
    \ 将完美适用于建模和仿真工作。\n\n对于新用户而言，XCOS 是 Scilab 中最强大的工具之一。由于它是一个基于图形用户界面的编程环境，用户只需连接各个模块即可编写代码。这些代码块可以按用户意愿进行拖拽和连接。代码内部的信息流由代码块之间连接器的方向和使用方式定义。这些模块实际上是通用化代码的图形化表示，其输入和输出可根据使用情况进行更改。\n\
    \nXCOS 提供了一种使用模块图可视编辑器的模块化方法来对复杂系统进行建模。模块化方法使得开发仿真的过程变得非常简单，因为用户只需将一个模块替换为另一个模块，即可在不同场景下测试系统。XCOS\
    \ 模型在单次运行中完成编译和仿真。生成的数学方程由具有可配置参数的数值求解器进行积分求解。\n\n# 8.2 安装 XCOS\n\n最新版本的 Scilab\
    \ 预装了 XCOS，但如果你使用的是旧版本，可以像安装其他软件包一样，使用 `Atoms` 包管理器轻松安装它。图形化安装方式是：点击菜单栏中的 `Applications`，然后点击\
    \ `module manager Atoms`。接着，找到 XCOS 并点击 `Install`。此操作需要有效的互联网连接，安装时间取决于下载软件包所需的时间以及计算资源的速度。\n\
    \n离线安装则需要你先将 XCOS 软件包作为 `.zip` 文件下载到指定位置，然后在 Scilab 命令终端中执行以下命令：\n\n```\n1  −−>atomsInstall(\"\
    download_path\\file_name_zip_\")\n```\n\n在此，你需要替换为已下载的 `.zip` 文件的实际下载路径。\n\n#\
    \ 8.3 启动 XCOS\n\nXCOS 可以通过命令行启动，也可以通过点击工具栏中的图标启动。需要注意的是，执行此操作需要图形终端。大多数运行最新操作系统的现代计算机都具备图形处理能力。XCOS\
    \ 的图形化显示依赖于本地操作系统的图形配置。通常，新用户无需调整图形配置即可使用 XCOS，但如果问题持续存在，咨询系统管理员是一个不错的选择。\n\n\
    ## 8.3.1 使用命令行\n\n在 Scilab 命令行中，你只需输入命令 `xcos` 即可启动 XCOS 环境。此时会打开一个模块浏览器和一个仿真编辑器供用户编辑。计算机屏幕的示例截图如图\
    \ 8-1 所示。\n\n![A458922_1_En_8_Fig1_HTML.jpg](img/A458922_1_En_8_Fig1_HTML.jpg)\n\
    \n图 8-1 XCOS 窗口截图\n\n## 8.3.2 使用图形符号\n\n你也可以通过点击 Scilab 主工具栏中的符号来打开 XCOS，正如图 8-2\
    \ 中箭头所示。工具栏中的符号看起来像图 8-3。\n\n![A458922_1_En_8_Fig3_HTML.jpg](img/A458922_1_En_8_Fig3_HTML.jpg)\n\
    \n图 8-3 XCOS 窗口截图\n\n![A458922_1_En_8_Fig2_HTML.jpg](img/A458922_1_En_8_Fig2_HTML.jpg)\n\
    \n图 8-2 XCOS 窗口截图\n\n## 8.3.3 通过菜单栏\n\n在 Scilab 菜单栏中，你可以点击 `Applications`，然后点击\
    \ `XCOS` 来打开一个 XCOS 会话。\n\n# 8.4 XCOS 模块库\n\nXCOS 模块库窗口（如图 8-4 所示）允许你选择按各种应用场景分类的模块。\n\
    \n![A458922_1_En_8_Fig4_HTML.jpg](img/A458922_1_En_8_Fig4_HTML.jpg)\n\n图 8-4 XCOS\
    \ 模块库窗口截图\n\nXCOS 模块库窗口显示了所有可供使用的模块库。它们可以被拖拽到 XCOS 编辑器窗口（8.5）中并放置，以便相互连接。模块浏览器有两个窗格。左侧窗格根据不同的功能列出了可用的预定义模块库（库）的分区列表。（参见图\
    \ 8-2。）\n\n*   最近使用的模块\n    *   随着你使用 XCOS，某些模块的使用频率会高于其他模块。它们会保存在此处，这样你就不必每次都去寻找了。\n\
    *   连续时间系统\n*   非连续性\n*   离散时间系统\n*   查找表\n*   事件处理\n*   数学运算\n*   矩阵\n*   电气\n\
    *   整数\n*   端口与子系统\n*   过零检测\n*   信号路由\n*   信号处理\n*   隐式\n*   注解\n*   数据接收器\n\
    *   信号源\n*   热工水力学\n*   演示模块\n*   用户自定义函数\n\n右侧窗格包含每个模块库中可用的模块。通过点击左侧窗格中的另一个模块库，右侧窗格中将会显示一组新的模块。\n"
- fmt: '## 8.5 XCOS Editor


    The editing window is the Xcos workspace for developing new models (diagrams).
    The XCOS editor window (as seen in Figure [8-5](#A458922_1_En_8_Chapter.html#Fig5))
    allows you to design a model by choosing palettes from the palette window, dragging
    them with a mouse, and releasing them at the editor. You can also add block to
    the diagram by right-clicking the block in the library and `Add to ->` “name of
    the diagram”.


    ![A458922_1_En_8_Fig5_HTML.jpg](A458922_1_En_8_Fig5_HTML.jpg)


    Figure 8-5


    Screenshot of XCOS’s editor window


    Multiple blocks appear on editor windows and they have input and output ports.
    These ports can be connected to make a model. Multiple blocks can be connected
    in a desired way to define a particular simulation. A simulation can then be run
    by clicking the arrow icon on the toolbar of the editor window. If the simulation
    is not timed to stop, it will keep running. You can stop it by clicking the `Stop`
    button, which is placed next to the `Start` button. The following buttons are
    also found in the editor in order from left to right:


    *   `New`: To start a new diagram

    *   `Open`: To open an existing diagram saved anywhere on computer

    *   `Open file in Scilab Current Directory`: To open an existing diagram saved
    in the current working directory

    *   `Save`: To save a diagram in the computer

    *   `Save as`: To save a diagram in any other format such as `zcos` (Zipped XCOS
    file), `xcos` (XCOS file), `xmi` (Eclipse EMF file)

    *   `Print`: To print the diagram to a printer or as a PDF file

    *   `Delete`: To delete a block

    *   `Undo`: To undo the last action performed. This can be done successively.

    *   `Redo`: To restore the previous state after performing an `Undo` action. This
    action can also be done successively.

    *   `Fit diagram or blocks to view`: Sometimes the area required to make the diagram
    extends the screen area and scroll bars appear on this window. By using this button,
    the whole diagram can be made to fit the size of window.

    *   `Start`: To start a simulation

    *   `Stop`: To stop a simulation

    *   `Zoom in`: To zoom in the view of diagram

    *   `Zoom out`: To zoom out the view of diagram

    *   `Xcos Demonstrations`: To run some basic demonstrations

    *   `Help`: To seek help on XCOS commands where you can type queries and then
    be directed to useful and relevant documentation


    Let’s start a simple demonstration diagram by clicking the `Xcos Demonstrations`
    button. We will get a window similar to the one shown in Figure [8-6](#A458922_1_En_8_Chapter.html#Fig6).


    ![A458922_1_En_8_Fig6_HTML.jpg](A458922_1_En_8_Fig6_HTML.jpg)


    Figure 8-6


    Window showing XCOS demonstration options


    By clicking `Standard Demos` and then `Bouncing Balls`, we get a window similar
    to the one shown in Figure [8-7](#A458922_1_En_8_Chapter.html#Fig7).


    ![A458922_1_En_8_Fig7_HTML.jpg](A458922_1_En_8_Fig7_HTML.jpg)


    Figure 8-7


    Window showing XCOS demonstration ⇒ standard demos ⇒ bouncing balls


    When we run this simulation, we observe a simulation model where four balls of
    different sizes and colors bounce off the walls of their window at different rates.
    The screenshot of this window is presented in Figure [8-8](#A458922_1_En_8_Chapter.html#Fig8).


    ![A458922_1_En_8_Fig8_HTML.jpg](A458922_1_En_8_Fig8_HTML.jpg)


    Figure 8-8


    Screenshot of window showing bouncing ball animation


    ## 8.6 XCOS Menu Bar


    In this section, we will describe the menu bar of XCOS so that beginners can navigate
    their workflow efficiently. The XCOS menu bar exists at the top of the XCOS window.
    Shortcut keys are displayed by the side of the command and they have been mentioned
    here as well. Most of the time, these keys use the `Control` key on the keyboard,
    which is depicted by `Ctrl`. When keys must be pressed together, the key combinations
    are shown by a plus sign in between. For example `Ctrl+N` means pressing the `Control`
    and `N` keys together.'
  raw: '## 8.5 XCOS Editor


    The editing window is the Xcos workspace for developing new models (diagrams).
    The XCOS editor window (as seen in Figure [8-5](#A458922_1_En_8_Chapter.html#Fig5))
    allows you to design a model by choosing palettes from the palette window, dragging
    them with a mouse, and releasing them at the editor. You can also add block to
    the diagram by right-clicking the block in the library and `Add to ->` “name of
    the diagram”.


    ![A458922_1_En_8_Fig5_HTML.jpg](A458922_1_En_8_Fig5_HTML.jpg)


    Figure 8-5


    Screenshot of XCOS’s editor window


    Multiple blocks appear on editor windows and they have input and output ports.
    These ports can be connected to make a model. Multiple blocks can be connected
    in a desired way to define a particular simulation. A simulation can then be run
    by clicking the arrow icon on the toolbar of the editor window. If the simulation
    is not timed to stop, it will keep running. You can stop it by clicking the `Stop`
    button, which is placed next to the `Start` button. The following buttons are
    also found in the editor in order from left to right:


    *   `New`: To start a new diagram

    *   `Open`: To open an existing diagram saved anywhere on computer

