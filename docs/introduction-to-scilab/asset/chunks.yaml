    (4.1)


    ```

    1  // Program to plot 3D graph using plot3d


    3  a = linspace(−8,8,41)'';

    4  b = linspace(−8,8,41)''

    5  [xx, yy] = meshgrid(a,b);

    6  c = sqrt(xx.ˆ2 + yy.ˆ2)+%eps;

    7  plot3d(a,b,c)

    清单 4-18

    plot3d.sce

    ```


    ### 4.6.2 plot3d1()


    内置函数 `plot3d1()` 根据给定的定义为数组的 x、y 和 z 值绘制彩色 3D 图形。单元格的颜色指示 z 值的范围。其用法如清单 4-19 和图
    4-21 所示，其中绘制了公式 4.1。


    ![A458922_1_En_4_Fig21_HTML.gif](img/A458922_1_En_4_Fig21_HTML.gif)


    图 4-21

    公式的 3D 图形


    ```

    1  // Program to plot 3D graph using plot3d1


    3  a = linspace(−8,8,41)'';

    4  b = linspace(−8,8,41)''

    5  [xx, yy] = meshgrid(a,b);

    6  c = sqrt(xx.ˆ2 + yy.ˆ2)+%eps;

    7  plot3d1(a,b,c)

    清单 4-19

    plot3d1.sce

    ```


    `plot3d1()` 提供的颜色编码在某些关键分析中成为了一个附加特性。3D 图形中的等高线给出了测量系统值相同的投影区域的形状。例如，假设图 4-22
    表示一个位于其中心的带电粒子附近的电场。颜色表示在 3D 空间中该带电粒子受到的力在某个范围内的区域。


    ![A458922_1_En_4_Fig22_HTML.gif](img/A458922_1_En_4_Fig22_HTML.gif)


    图 4-22

    公式的 3D 图形


    ### 4.6.3 plot3d2()


    另一个内置函数 `plot3d2()` 使用矩形面片构建 3D 图形。示例如清单 4-20 所示。


    ```

    1  // Program to plot 3D graph using plot3d2


    3  u = linspace(−%pi/2,%pi/2,40);

    4  v = linspace(0,2∗%pi,20);

    5  X = cos(u)''∗cos(v);

    6  Y = cos(u)''∗sin(v);

    7  Z = sin(u)''∗ones(v);

    8  plot3d2(X,Y,Z);

    清单 4-20

    plot3d2.sce

    ```


    结果如图 4-23 所示。需要注意的是，更精细的网格将使图形具有更好的 3D 特征分辨率。为了获得更精细的网格，`linspace()` 参数应使用更小的步长来定义。然而，同时，使用更精细的网格会增加计算时间。因此，3D
    渲染是一项计算密集型任务，但有时又是必要的。参数的选择取决于数据分析的要求。当需要更精细的 3D 表面特征分辨率时，用户必须选择更高的渲染能力（这直接导致对高计算能力的需求）。


    ![A458922_1_En_4_Fig23_HTML.gif](img/A458922_1_En_4_Fig23_HTML.gif)


    图 4-23

    公式的 3D 图形


    ### 4.6.4 plot3d3()


    另一个内置函数 `plot3d3()` 使用矩形面片构建 3D 网格图。`plot3d2` 和 `plot3d3` 之间的唯一区别在于，前者生成表面图，而后者在矩形面片上生成网格图。示例如清单
    4-21 所示。


    ```

    1  // Program to plot 3D graph using plot3d3


    3  u = linspace(−%pi/2,%pi/2,40);

    4  v = linspace(0,2∗%pi,20);

    5  X = cos(u)''∗cos(v);

    6  Y = cos(u)''∗sin(v);

    7  Z = sin(u)''∗ones(v);

    8  plot3d3(X,Y,Z);

    清单 4-21

    plot3d3.sce

    ```


    关于网格分辨率，其参数选择与表面图相同。然而，需要注意的是，渲染网格的计算强度略低于渲染表面。


    ### 4.6.5 表面图


    表面图通过使用内置函数 `surf()` 获得，该函数接受网格点高度作为单个参数。通过连接这些网格点，可以创建一个表面。默认情况下，表面面片使用不同的颜色编码以便区分。这可以在清单
    4-22 和图 4-24 所示的代码中查看。


    ![A458922_1_En_4_Fig24_HTML.gif](img/A458922_1_En_4_Fig24_HTML.gif)


    图 4-24

    公式的 3D 图形


    ```

    1  // Program to plot 3D graph using surf

    2  subplot(2,2,1)

    3  z = rand(10,10);

    4  surf(z)

    5  title(''surf'')


    7  subplot(2,2,2)

    8  surf(z,''facecol'',''red'',''edgecol'',''blu'')

    9  title(''surf function with face and edge color'')


    11  subplot(2,2,3)

    12  surf(z,''facecol'',''interp'')

    13  title(''surf function interpolated'')


    15  subplot(2,2,4)

    16  x=rand(10,10);

    17  y=rand(10,10);

    18  z=rand(10,10);

    19  surf(z,''facecol'',''red'',''edgecol'',''blu'')

    20  title(''surf function with each coordinated def ined seperately'')

    清单 4-22

    surf.sce

    ```


    注意，当提供关于面颜色为红色、边颜色为蓝色的额外参数时，图形会绘制成具有蓝色边缘的红色表面，如图 4-25 所示。`surf()` 命令的输入是一个数组。本例中由内置函数
    `rand()` 创建，但它也可以从外部创建并输入到 `surf()` 函数中。


    ![A458922_1_En_4_Fig25_HTML.jpg](img/A458922_1_En_4_Fig25_HTML.jpg)


    图 4-25

    公式的 3D 图形


    在第三个子图中，随机网格值由 `rand()` 函数定义，但两个网格点之间的中间值被插值。这导致了等高线的颜色编码。在第四个子图中，从 `rand()` 函数中获取的
    x、y、z 各个笛卡尔坐标被分别输入到 `surf` 函数中。

