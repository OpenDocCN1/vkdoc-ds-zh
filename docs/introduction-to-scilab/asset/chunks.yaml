    11  Inconsistent row/column dimensions.

    ```


    Elements of an array can be any data type as defined in Chapter [2](#A458922_1_En_2_Chapter.html),
    Section 2.11\. The built-in function `type()` can be used to determine the data
    type of stored values. All elements of an array can be set to a particular data
    type by the following commands:


    ```

    1  −−>a = uint8([1 2 3])

    2  a  =

    3  1  2  3

    4  −−>b = uint16([1 2 3])

    5  b  =

    6  1  2  3

    7  −−>c = uint32([1 2 3])

    8  c  =

    9  1  2  3

    10  −−>type(a)

    11  ans  =

    12  8.

    13  −−>type(b)

    14  ans  =

    15  8.

    16  −−>type(c)

    17  ans  =

    18  8.

    ```


    ## 3.3 Operations on Arrays and Vectors


    Operating on arrays has two aspects:


    *   Operating on two or more arrays

    *   Elementwise operations


    ### 3.3.1 Elementwise Operations


    All arithmetic operators—such as `+`,`-`,`*`,`/`,`ˆ`, and so on—can be used in
    both cases. When we need to do elementwise operations, `a .` is placed before
    the operator so that elementwise operators become `.+`,`.-`,`.*`,`./`, and `.ˆ`.
    This will become more clear in the following example:


    ```

    1  −−>a = [1 2 3; 4 5 6; 7 8 9]

    2  a  =

    3  1\.    2\.    3.

    4  4\.    5\.    6.

    5  7\.    8\.    9.

    6  −−>b = a

    7  b  =

    8  1\.    2\.    3.

    9  4\.    5\.    6.

    10  7\.    8\.    9.

    11  −−>a. / b

    12  ans   =

    13  1\.    1\.    1.

    14  1\.    1\.    1.

    15  1\.    1\.    1.

    16  −−>aˆb

    17  !−−error 43

    18  Not implemented in scilab ...

    19  at line 61 of function %s_pow called by:

    20  aˆb

    21  −−>a.ˆb // Element wise operation

    22  ans =


    24  1\.     4\.     27.

    25  256\.   3.0 D+03   4.0 D+04

    26  8.0 D+05   1.0 D+07   3.0 D+08

    ```


    ### 3.3.2 Matrix Multiplication


    A matrix of dimensions a × b can only be multiplied by a matrix of dimensions
    b × c, which results in a matrix of dimensions a × c. It is performed by multiplying
    elements of rows by elements of columns to get new elements.


    The following code will illustrate this matrix multiplication method:


    ```

    1  −−>a = [1, 2; 3, 4; 5, 6] // Def ining a 3 X 3 matrix

    2  a =

    3  1\.   2.

    4  3\.   4.

    5  5\.   6.

    6  −−>size(a) // size is found to be 3 X 2

    7  ans =

    8  3\.   2.

    9  −−>a_t = a'' // def ining transpose

    10  a_t =

    11  1\.   3\.   5.

    12  2\.   4\.   6.

    13  −−>size(a_t) // size of transpose is 2 X 3

    14  ans =

    15  2\.   3.

    16  −−>mul=a∗a_t // multiplying two matrices

    17  ans =

    18  5\.    11\.   17.

    19  11\.   25\.   39.

    20  17\.   39\.   61.

    21  −−>size(mul) // size of multiplication matrix is 3 X 3

    22  ans =

    23  3\.   3.

    ```


    `a''` gives the transpose of a matrix (rows are made columns and vice versa).
    This makes a 3 × 2 matrix become a 2 × 3 matrix. When they are multiplied, you
    get a 3 × 3 matrix.


    ### 3.3.3 Inverse of Matrices


    Performing division of a matrix involves matrix inversion . An inverse matrix
    is such that its multiplication with the original matrix yields an identity matrix
    (a matrix with determinant as 1), that is, a matrix with 1 at its diagonal elements
    and 0 otherwise:


    ```

    1  −−>a = [2 5 4;−4 6 −3;4 7 −1] // Def ining a 3 X 3 matrix

    2  a =

    3  2\.   5\.  4.

    4  −4\.  6\.  −3.

    5  4\.   7\.  −1.

    6  −−>inverse = inv(a) // calculating inverse of matrix a

    7  inverse =

    8  −0.06   −0.13   0.15

    9  0.06    0.07    0.04

    10  0.2    −0.02    −0.12

    11  −−>a∗inverse // matrix multiplied by inverse is identity matrix

    12  ans =

    13  1\.   0\.   0.

    14  0\.   1\.   0.

    15  0\.   0\.   1.

    ```


    The function `pinv()` is used if the input matrix is a nonsquare matrix. In other
    words, the number of rows and the number of columns are not equal. The `pinv()`
    function gives a psuedo-inverse of a matrix such that if `X=pinv(a)`, then a ×
    X × a = a, X × a × X = X, and both a × X and X × a are a Hermitian matrix:


    ```

    1  −−>a = [1,2,3; −5 4 −7]

    2  a =

    3  1\.   2\.   3.

    4  −5\.   4\.  −7.

    5  −−>inverse = pinv(a)

    6  inverse =

    7  0\.    −0.06

    8  0.27   0.1

    9  0.15  −0.05

    10  −−>a∗inverse

    11  ans =

    12  1\.   0.

    13  0\.   1.

    ```


    I is known as an identity matrix because all its diagonal elements are 1 and all
    its nondiagonal elements are zero, which makes its determinant 1.


    ### 3.3.4 det()


    The determinant of a matrix `a` is calculated by the command `det(a)`:


    ```

    1  −−>a = [1 2 3;4 5 6;7 8 9]

    2  a =

    3  1\.   2\.   3.

    4  4\.   5\.   6.

    5  7\.   8\.   9.

    6  −−>det(a)

    7  ans =

    8  −9.0 D−16

    ```


    ### 3.3.5 rank()


    The rank of a matrix (the number of linearly independent rows or columns) can
    be determined by the built-in `rank()` function:


    ```

    1  −−>a = eye(3,3)

    2  a =

    3  1\.   0\.   0.

    4  0\.   1\.   0.

    5  0\.   0\.   1.

    6  −−>rank(a) // all rows are linearly independent

    7  ans =

    8  3.

    9  −−>a = [1, 2, 3;2, 4, 6;4, 6, 3] // second row in just f irst rwo multiplied
    by 2

    10  a =

    11  1\.   2\.   3.

    12  2\.   4\.   6.

    13  4\.   6\.   3.

    14  −−>rank(a)

    15  ans =

    16  2.

    17  −−>a = [1, 2, 3;2, 4, 6;3, 6, 9] // second and third row are merely f irst
    row multiplied by 2 and 3 res pectively

    18  a =

    19  1\.   2\.   3.

    20  2\.   4\.   6.

    21  3\.   6\.   9.

    22  −−>rank(a)

    23  ans =

    24  1.

    ```'
