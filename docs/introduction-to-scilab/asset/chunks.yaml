    \ provide faculties to trim the data so that only the useful part of the data\
    \ is fed as an array. Further trimming can be performed by slicing operations.\
    \ With the art of handling files, you can confidently proceed to handling sophisticated\
    \ numerical computations.\n\n# 6. Functions and Loops\n\n## 6.1 Introduction\n\
    \nWhen a particular numerical task needs to be “repeated” over different data\
    \ points, digital computers become a useful tool since they can perform this action\
    \ with greater speeds than humans. Loops perform exactly this task. Using a condition\
    \ to check the start and termination rules, users can perform repetitive parts\
    \ of a process as desired. Different programming languages and environments have\
    \ different rules for defining loops. Scilab provides a simple way to define and\
    \ run loops. In addition to loops, functions also define an important part of\
    \ modern programming architecture. A big program may require a set of instructions\
    \ to be called at different times. Hence, this set of instructions can be defined\
    \ as a subprogram, which can be requested to perform the computation at a desired\
    \ time. In this way, a complicated task can be divided into many small parts.\
    \ This architecture of programming is called modular programming. It is the most\
    \ popular way of programming since it is quite logical, good at visualizing the\
    \ problem, and easy to debug. The most popular way of defining these small sets\
    \ of instructions is to define them as functions. Together, functions and loops\
    \ break a numerical computation problem into a series of simpler problems that\
    \ can be accessed as required. In this chapter, we will discuss both of these\
    \ concepts in detail.\n\n## 6.2 Loops\n\nLoops form an essential part of an algorithm\
    \ since they perform the tasks that computers perform best: doing repetitive actions\
    \ in a very fast manner. Loops can come in many flavors such as `for` loop, which\
    \ repeats certain tasks over a list of variable values; `while` loop, which checks\
    \ a logical condition before executing a certain task; and `if-then-else` loop,\
    \ which checks a condition and directs the flow of an algorithm. The loop you\
    \ choose depends on the problem at hand.\n\nA variety of functions and their usage\
