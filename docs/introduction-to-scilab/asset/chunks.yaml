- fmt: "### 2.11.2 How to Store Floating Point Numbers\n\nComputers can store numbers\
    \ as floating point objects. A floating point object stores a number as follows:\n\
    \n![ $$ \\pm {d}_1{d}_2\\dots {d}_s\\times {\\beta}^e $$ ](A458922_1_En_2_Chapter_Equ1.gif)\n\
    \n(2.1) where ![ $$ {d}_i=0,1,2\\dots \\beta -1 $$ ](A458922_1_En_2_Chapter_IEq7.gif)\
    \ but ![ $$ {d}_1\\ne 0 $$ ](A458922_1_En_2_Chapter_IEq8.gif) and m ≤ e ≤ M where\
    \ ![ $$ m\\in {I}^{-} $$ ](A458922_1_En_2_Chapter_IEq9.gif) and ![ $$ M\\in {I}^{+}\
    \ $$ ](A458922_1_En_2_Chapter_IEq10.gif).\n\nFollowing are the three parts of\
    \ a floating point:\n\n- Sign (±)\n- Significand (Mantisa) (`d[1]d[2]…d[s]`)\n\
    - Exponent (`β`)\n\nEach part of a floating point number is stored at different\
    \ memory locations and occupies a specified number of bits. How many bits are\
    \ defined to which part? These questions have been answered by IEEE standards\
    \ known as IEEE754. First, let’s look at the concept of precision of a number\
    \ representation:\n\n1.  Single precision:\n    - Occupies 4 bytes = 32 bits\n\
    2.  Double precision:\n    - Occupies 8 bytes = 64 bits\n3.  Extended double precision:\n\
    \    - Occupies 80 bits\n4.  Quadruple precision:\n    - Occupies 16 bytes = 128\
    \ bits\n\nOn a 64-bit operating system machine having Scilab software, real variables\
    \ are stored as 64 bit floating point numbers (double precision, hence, the name\
    \ `double` for the data type). This format includes the following:\n\n- One bit\
    \ to store the sign of the number\n    - 2¹ = 2 possible values (0 and 1, which\
    \ are used to represent sign)\n- 52 significant bits\n    - 2^(52) possible values\n\
    - 11 for exponent\n    - 2^(11) possible values\n\nThis complies with IEEE 754\
    \ standard.\n\nConverting between a higher-precision data type to a lower-precision\
    \ data type can result in saving the computer’s memory and speeding up calculations\
    \ at the cost of precision. These decisions must be taken by the developer beforehand.\
    \ You do not always need higher precisions. For example, if you are working with\
    \ dimensions of a bridge and the numbers are represented in units of meters, you\
    \ can usually work with a precision of ![ $$ {\\frac{1}{10}}^{th}m $$ ](A458922_1_En_2_Chapter_IEq11.gif)\
    \ for most measurements involved in civil engineering. However, if you are working\
    \ with nano materials or talking about atoms when calculations involve precision\
    \ around Å = 10^(−9) m, you obviously need better precision. It is important to\
    \ perform back-of-the-envelop calculations for a particular problem to get an\
    \ idea about the maximum and minimum numbers expected during the running of a\
    \ program. Accordingly, you can assign data types. But what if you don’t set a\
    \ data type? In this case, default data types are used like floating point numbers\
    \ on a 64-bit machine are stored with double-precision floating point numbers\
    \ by default.\n\nSpecialized packages exist for Scilab where arbitrary precision\
    \ can be used for more accurate mathematical calculations. Even though a detailed\
    \ discussion of this topic is beyond the scope of this book, users are advised\
    \ to check out the packages `Xnum` (maximum precision of 200 digits) [[1](#A458922_1_En_2_Chapter.html#Par200)]\
    \ and `Mupat` [[2](#A458922_1_En_2_Chapter.html#Par201)]. Precision plays an important\
    \ role in producing meaningfully reliable numerical values for critical applications\
    \ so data types in such cases must be used judiciously.\n\n### 2.11.3 Formatted\
    \ Display of Numbers\n\nControlling the format of displaying the number of digits\
    \ of a numerical value is one of the most significant abilities of an advanced\
    \ programming environment. Scilab provides the command `format`. Its description\
    \ can be obtained using the command `help format`. The command `format()` takes\
    \ integer values as arguments for displaying the number of digits in a numerical\
    \ value. The range for this input argument is [2, 25]:\n\n```\n1  −−>exp(1)\n\
    2  ans =\n3  2.7182818\n4  −−>format(5)\n5  −−>exp(1)\n6  ans =\n7  2.72\n8  −−>format(25)\n\
    9  −−>exp(1)\n10  ans =\n11  2.7182818284590450907956\n```\n\n`exp(1)` represents\
    \ e¹ = 2.7182818, which is also called Euler’s number. When `format(5)` is issued\
    \ as a command, then the answer to e¹ is shown as 2.72, whereas `format(255)`\
    \ reveals 2.7182818284590450907956.\n\nIt is important to note that the stored\
    \ value is unaffected by the fact that it is being represented on a graphic terminal\
    \ with fewer digits. The symbolic representation of a number on a computer terminal\
    \ is independent of the way it is stored (which is determined entirely by its\
    \ data type).\n\n## 2.12 Boolean Data\n\n`help(boolean)` provides a detailed description\
    \ about boolean variables namely `\\%T` for `true` and `\\%F` for `false`. Boolean\
    \ variables must be operated using boolean operators such as the following:\n\n\
    - NOT\n    - Represented by the symbolic operator `~`\n    - Negates an input\
    \ (`~%T=%F` and `~%F=%T`)\n- AND\n    - Represented by either the symbolic operator\
    \ `&` or the function `or()`\n    - Behavior is shown in Table [2-2](#A458922_1_En_2_Chapter.html#Tab2)\n\
    \    - Bitwise operations are done by the `bitand()` function\n- OR\n    - Represented\
    \ by either the symbolic operator `|` or the function `or()`\n    - Behavior is\
    \ shown in Table [2-3](#A458922_1_En_2_Chapter.html#Tab3)\n    - Bitwise operations\
    \ are done by `bitor()` function\n- XOR\n    - Represented by the function `bitxor()`\n\
    \    - Behavior is shown in Table [2-4](#A458922_1_En_2_Chapter.html#Tab4)\n\n\
    Table 2-4: Truth Table for XOR Operator\n\n| XOR | T | F |\n| --- | --- | ---\
    \ |\n| T | F | T |\n| F | T | F |\n\nTable 2-3: Truth Table for OR Operator\n\n\
    | OR | T | F |\n| --- | --- | --- |\n| T | T | T |\n| F | T | F |\n\nTable 2-2:\
    \ Truth Table for AND Operator\n\n| AND | T | F |\n| --- | --- | --- |\n| T |\
    \ T | F |\n| F | F | F |\n\n```\n1  −−>a = %T // a is give value True\n2  a =\n\
    3  T\n4  −−>b = ˜a // b is NOT a\n5  b =\n6  F\n7  −−>a&b // a AND b\n8  ans =\n\
    9  F\n10  −−>a|b // a OR b\n11  ans =\n12  T\n```\n\nThe `bitxor()` operator works\
    \ bitwise, so it converts an input into its binary representation and performs\
    \ the computation. Let’s understand this concept by using an example. `bitxor(1000,\
    \ 1001)` is 1 because binary representations (obtained by the function `dec2bin()`)\
    \ show that only the last bit is different and, hence, the result is the binary\
    \ number whose decimal equivalent is 1:\n\n```\n1  −−>bitxor(1000, 1001)\n2  ans\
    \ =\n3  1.\n4  −−>dec2bin([1000; 1001; 1])\n5  ans =\n\n7  !1111101000   !\n8\
    \  !             !\n9  !1111101001   !\n10  !             !\n11  !0000000001 \
    \  !\n12  −−>bin2dec(\"0000000001\")\n13  ans =\n14  1.\n```\n\nIt is important\
    \ to note that, in binary logic, the values `True` and `False` are equivalently\
    \ used with `1` and `0`. So Tables [2-2](#A458922_1_En_2_Chapter.html#Tab2), [2-3](#A458922_1_En_2_Chapter.html#Tab3)\
    \ and [2-4](#A458922_1_En_2_Chapter.html#Tab4) would simply replace the value\
    \ `T` with `1` and `F` with `0`.\n\nSimilarly, the `bitand()` and `bitor()` operators\
    \ can be understood with the following example:\n\n```\n1  −−>bitor(100, 99)\n\
    2  ans =\n3  103.\n4  −−>bitand(100, 99)\n5  ans =\n6  96.\n7  −−>dec2bin([100;\
    \ 99; 103; 96])\n8  ans =\n\n10  !1100100  !\n11  !         !\n12  !1100011  !\n\
    13  !         !\n14  !1100111  !\n15  !         !\n16  !1100000  !\n```"
