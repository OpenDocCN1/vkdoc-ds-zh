    # 1.3 历史


    Scilab 的创建历史始于 20 世纪 80 年代。其灵感来源于克利夫·莫勒（Cleve Moler）开发的 MATLAB Fortran 代码。莫勒后来与约翰·利特尔（John
    Little）共同创立了 MathWorks 公司。Scilab 最初以 Blaise 之名起步，是一款 CACSD（计算机辅助控制系统设计）软件。它由弗朗索瓦·德勒贝克（François
    Delebecque）和塞尔日·斯蒂尔（Serge Steer）在 IRIA（法国信息与自动化研究所）创建。1984 年，Blaise 更名为 Basile，并由
    Simulog（法国国家信息与自动化研究所的首家初创公司）分发数年。


    20 世纪 90 年代，Simulog 停止分发 Basile。法国国家信息与自动化研究所将软件更名为 Scilab，并仅由六名研究人员继续开发。Scilab
    1.1 于 1994 年 1 月 2 日以开源许可证发布。直到 2.7 版本，Scilab 社区规模已相当庞大。在企业和机构的支持下，法国国家信息与自动化研究所于
    2003 年成立了 Scilab 联盟。2017 年 6 月，Scilab Enterprises 成立并负责开发工作。基于经典的开源商业模式，Scilab
    Enterprises 还提供与 Scilab 相关的专业服务和支持。Scilab Enterprises 于 2017 年加入 ESI 集团，目前继续开发和提供与
    Scilab 相关的服务。Scilab 广泛应用于科学、工业和服务业的各个战略领域，包括航天、航空、汽车、能源、国防、金融和交通。


    ## 1.4 安装


    Scilab 是一款根据 CeCILL 许可证分发的开源软件，该许可证是 GNU-GPL 兼容许可证的一个版本，适用于自由软件。请注意，以下说明已在 6.0.0
    版本上测试通过。用户可根据操作系统的要求从其官方网站下载。安装过程非常简单，用户论坛和简单的谷歌搜索即可解答用户遇到的常见问题。Scilab 包含一个基于图形用户界面的控制台，便于用户操作。


    该软件的在线版本可在印度的一个网站上使用。在这种情况下，用户无需在自己的系统上安装软件。他们只需通过网页浏览器连接到远程服务器，即可像本地安装一样运行 Scilab
    程序。当然，这需要相当快的网络连接。（鼓励用户尝试这项功能。）就本书而言，我们推荐在本地进行安装并使用。


    在 Windows 操作系统上正确安装后，用户可以在已安装程序列表中看到 Scilab 图标。双击该图标即可打开一个 Scilab 会话。MacOSX 系统也是如此。对于基于
    Linux 的操作系统发行版，您可以选择点击桌面图标，或者直接在命令行输入 `scilab`。


    ## 1.5 工作区


    图 1-1 展示了已安装的 Scilab 6.0.0 版本的屏幕截图。您可以在主窗口中看到不同的分区：


    ![A458922_1_En_1_Fig1_HTML.jpg](img/A458922_1_En_1_Fig1_HTML.jpg)


    图 1-1

    Scilab 截图


    *   文件浏览器

    *   SCILAB 6.0.0 控制台

