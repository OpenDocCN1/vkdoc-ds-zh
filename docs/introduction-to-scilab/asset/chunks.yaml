  trans: '

    ### 2.10.1 赋值运算符 =


    符号 `=` 用作赋值运算符，它将右侧的值赋给左侧的变量名。在数学中，该符号用于表示等式两边的相等关系，但在 Scilab 中，该符号用于赋值。数学中表示相等的符号等价于
    `==`，它用于检查两侧数据值是否相等：


    ```

    1  −−>1==2

    2  ans =

    3  F

    4  −−>1==1.0

    5  ans =

    6  T

    7  −−>a=1

    8  a =

    9  1.

    10  −−>b=2

    11  b =

    12  2.

    13  −−>a==b

    14  ans =

    15  F

    ```


    在这个例子中，![ $$ 1\ne 2 $$ ](img/A458922_1_En_2_Chapter_IEq3.gif)。因此，结果是布尔值 `F`，表示`假`。1
    和 1.0 的数值相同，所以当检查它们的相等性时，你会得到 `T`，表示该表达式被求值为`真`。变量也可用于求值。在这种情况下，变量中存储的最新值会被用于求值，结果被声明为布尔值。


    通过使用逗号（`,`）运算符可以执行多重赋值。此外，如果我们不希望结果在屏幕上显示，可以使用 `;` 运算符来抑制输出：


    ```

    1  −−>a1=10, a2=20, a3=30

    2  a1 =

    3  10.

    4  a2 =

    5  20.

    6  a3 =

    7  30.

    ```


    使用命令前的 `;` 运算符可以抑制打印输出。在下面的例子中，`a3` 的赋值没有在终端显示，因为它被 `;` 运算符抑制了。在第二个例子中，所有输出都被抑制：


    ```

    1  −−>a1=10, a2=20, a3=30;

    2  a1 =

    3  10.

    4  a2 =

    5  20.

    6  −−>a3

    7  a3 =

    8  30.

    9  −−>a1=10; a2=20; a3=30;

    10  −−>

    ```


    请注意，只有终端输出的打印被抑制了，但赋值操作不受 `;` 运算符的影响。它仍然可以被访问，如第二个终端命令所示。


    ### 2.10.2 变量命名规范


    为避免错误，变量名必须遵守以下命名规范：


    * 名称不能以数字开头；但数字可以在名称的其他任何位置使用。

    * 变量名区分大小写。

    * 关键字不能用作变量名。

    * 名称可以包含下划线（`_`），但不能包含空格。


    ### 2.10.3 全局变量与局部变量


    在主程序中全局声明的变量称为全局变量，而在函数内部局部声明的变量称为局部变量。全局变量对所有函数可用，而局部变量仅对特定函数可用。它们通过 `global`
    声明语句来定义。一旦定义，无论是否有新的定义，它们都保持不变，除非使用 `clear` 命令从内存中清除变量名和值。另一个命令 `clearglobal`
    用于有选择地清除全局变量。用户可以使用 `isglobal()` 函数来检查一个变量是否为全局变量。


    全局变量用于在数值计算中定义常量。假设我们希望除少数选定的变量外，其他所有变量都改变值。那么我们将那些不变的值命名为全局变量，并赋予我们自己选择的名称。预定义的变量如
    `%pi` 和 `%e` 就是以类似方式定义的。


    ### 2.10.4 变量列表


    所有变量的列表可以通过 `who` 和 `whos` 命令获取，其中 `who` 仅显示工作区中的变量列表，而 `whos` 则显示更详细的信息，如变量大小、存储变量所用的字节数以及变量类型。`who(''local'')`
    或 `who(''get'')` 返回当前变量名以及以双精度字为单位的内存使用量。`who(''global'')` 返回全局变量名以及以双精度字为单位的内存使用量。`who(''sorted'')`
    按字母顺序显示所有变量。通过使用 `who` 和 `whos`，你可以合理地跟踪内存需求。这在像 Raspberry Pi 这样内存和速度受限的系统中至关重要。


    ## 2.11 数据类型


    在为变量赋值时，理解数据可以定义为由其数据类型决定的各种对象是重要的。命令 `help(type)` 提供关于各种数据类型的详细文档。

    '
- fmt: '### 2.11.1 Numerical Data


    Numbers are the basic building blocks of numerical analysis. The representation
    of numbers as computable quantities for a computer requires them to be stored
    as data in the computer’s memory and represent them by a predefined system on
    various output terminals. Since the memory is limited in nature, fixed spaces
    of memory are assigned for various number types like integers, real numbers, and
    complex numbers. In the same manner, various output terminals have fixed capabilities
    to represent numbers. For example, if the fraction ![ $$ -\frac{2}{3} $$ ](A458922_1_En_2_Chapter_IEq4.gif)
    must be displayed, then Scilab must be able to print the numerator and denominator
    separated by a horizontal line matching the size of both numerals, and the negative
    sign should be placed at the same height as the horizontal bar, but separated
    by a distance to distinguish it clearly. Similarly, showing the number as `2 ×10^(−3)`
    includes storing information about the numbers `2`, `10`, and `−3` separately
    and displaying them accordingly where `−3` must be superscript of `10`, and so
    on. The graphic capabilities of Scilab are quite limited and this topic is out
    of the scope of this book. Consequently, we will concentrate on the topics related
    to the storage of numerals.


    In the era of cheap computer memory, why should we care to seek less of it for
    the data? If we have a machine with 64-bit architecture, then it can assign 64
    bits for each entity. But would it be wise to use 64 bits to store the small values
    (say `0`)? Automatic assignment faces this inefficient way of computation. Hence,
    it remains a developer’s choice to either declare the data type strictly or let
    Scilab take care of it. When used judiciously, this quality speeds up computation
    and lessens the requirements of memory space.


    Table [2-1](#A458922_1_En_2_Chapter.html#Tab1) shows how signed and unsigned integers
    are stored.


    **Table 2-1** Number Datatypes for Integers with Varying Precision


    | Data type | Meaning | Range |

    | --- | --- | --- |

    | `int8` | Signed integer of 8 bits | `±2⁸ − 1` |

    | `uint8` | Unsigned integer of 8 bits | `[0, 2⁸]` |

    | `int16` | Signed integer of 16 bits | `±2^(15) − 1` |

    | `uint16` | Unsigned integer of 16 bits | `[0, 2^(16)]` |

    | `int32` | Signed integer of 32 bits | `±2^(31) − 1` |

    | `uint32` | Unsigned integer of 32 bits | `[0, 2^(32)]` |

    | `int64` | Signed integer of 64 bits | `±2^(63) − 1` |

    | `uint64` | Unsigned integer of 64 bits | `[0, 2^(64)]` |


    Let’s test these limits starting with the `int8` and `unit8` data types. They
    can be used to convert an input number into an object of the their type by using
    functions `int8()` and `uint8()`, respectively:


    ```

    1  −−>2ˆ8

    2  ans =

    3  256.

    4  −−>int8(2ˆ8)

    5  ans =

    6  0

    7  −−>uint8(2ˆ8)

    8  ans =

    9  0

    10  −−>uint8(2ˆ8−1)

    11  ans =

    12  255

    13  −−>int8(2ˆ8−1)

    14  ans =

    15  −1

    16  −−>uint8(2ˆ8+1)

    17  ans =

    18  1

    19  −−>int8(2ˆ8+1)

    20  ans =

    21  1

    ```


    `2⁸ = 256` so, with 8 bits, this is the biggest number you can store. However,
    since the numbers also include `0`, an 8-bit storage system can store a maximum
    of `0` to `255` as numeral values. When you use `int8` representation, then one
    of the bits is used up to represent the signed bit. This leaves the range of ![
    $$ \pm {2}^8-1 $$ ](A458922_1_En_2_Chapter_IEq5.gif). For this reason, `int8(2ˆ8)`
    does not equal `256`. But even `unit8(2ˆ8)` does not equal `256` because the maximum
    number that can be stored is `255`. Why, then, is `0` is shown as answer?


    The system of storage follows a cyclic nature where the next number after the
    maximum number `255` is `0`. This can be verified by the fact that `uint8(2ˆ8-1)`
    equals `255`. On the other hand, `int8(2ˆ8-1)` is `−1` because `int8` data type
    can also store the negative numbers and, hence, `−1`. Both `uint8(2ˆ8+1)` and
    `int8(2ˆ8+1)` results in `1` since `1` comes after `0`.


    For storing numbers beyond the range allowed by a particular precision, you must
    use data types with more precision (more numbers of bits used to store digits).
    For example:


    ```

    1  −−>a = int8(2ˆ10)

    2  a =

    3  0

    4  −−>a = int16(2ˆ10)

    5  a =

    6  1024

    7  −−>a = int32(2ˆ10)

    8  a =

    9  1024

    ```


    Since `2^(10) = 1024`, which is beyond the range of `int8` data type, it results
    in the storage of `0` as its value, whereas it can be stored in `int16`, `int32`
    data types.


    Other data types for numerical values are `double` and `float`, which store real
    numbers. Real numbers are represented as floating point numbers in a computer.
    The mapping of a real number to a computer’s storage system is a formulaic representation
    (called floating point representation). For example, the value of ![ $$ \frac{1}{3}
    $$ ](A458922_1_En_2_Chapter_IEq6.gif) is `0.3333333…`. Let’s suppose that we have
    only four significant digits for a particular calculations. If so, the value can
    be rewritten as `3.3333 × 10^(−1)` where `3.3333` is called the significand, `10`
    is called the base, and `−1` is called the exponent. This is further explained
    in Section 2.11.2.


    While assigning a number to the significand, the information about the number
    of significant digits is used. The significant figures of a number are digits
    that carry meaningful contribution to its measurement resolution. In the previous
    case, we assumed only four significant digits, depending on requirements of calculations/measurements.
    The term floating point refers to the fact that a number’s radix point (decimal
    point) can “float”; that is, it can be placed anywhere relative to the significant
    digits of the number. This position is indicated as the exponent component. Thus,
    the floating-point representation can be thought of as a kind of scientific notation.'
  raw: '### 2.11.1 Numerical Data


    Numbers are the basic building blocks of numerical analysis. The representation
    of numbers as computable quantities for a computer requires them to be stored
    as data in the computer’s memory and represent them by a predefined system on
    various output terminals. Since the memory is limited in nature, fixed spaces
    of memory are assigned for various number types like integers, real numbers, and
    complex numbers. In the same manner, various output terminals have fixed capabilities
    to represent numbers. For example, if the fraction ![ $$ -\frac{2}{3} $$ ](A458922_1_En_2_Chapter_IEq4.gif)
    must be displayed, then Scilab must be able to print the numerator and denominator
    separated by a horizontal line matching the size of both numerals, and the negative
    sign should be placed at the same height as the horizontal bar, but separated
    by a distance to distinguish it clearly. Similarly, showing the number as 2 ×10^(−3)
    includes storing information about the numbers 2, 10, and −3 separately and displaying
    them accordingly where −3 must be superscript of 10, and so on. The graphic capabilities
    of Scilab are quite limited and this topic is out of the scope of this book. Consequently,
    we will concentrate on the topics related to the storage of numerals.


    In the era of cheap computer memory, why should we care to seek less of it for
    the data? If we have a machine with 64-bit architecture, then it can assign 64
    bits for each entity. But would it be wise to use 64 bits to store the small values
    (say 0)? Automatic assignment faces this inefficient way of computation. Hence,
    it remains a developer’s choice to either declare the data type strictly or let
    Scilab take care of it. When used judiciously, this quality speeds up computation
    and lessens the requirements of memory space.


    Table [2-1](#A458922_1_En_2_Chapter.html#Tab1) shows how signed and unsigned integers
    are stored.


    Table 2-1


    Number Datatypes for Integers with Varying Precision


    | Data type | Meaning | Range |

    | --- | --- | --- |

    | int8 | Signed integer of 8 bits | ±2⁸ − 1 |

    | uint8 | Unsigned integer of 8 bits | [0, 2⁸] |

    | int16 | Signed integer of 16 bits | ±2^(15) − 1 |

    | uint16 | Unsigned integer of 16 bits | [0, 2^(16)] |

    | int32 | Signed integer of 32 bits | ±2^(31) − 1 |

    | uint32 | Unsigned integer of 32 bits | [0, 2^(32)] |

    | int64 | Signed integer of 64 bits | ±2^(63) − 1 |

    | uint64 | Unsigned integer of 64 bits | [0, 2^(64)] |


    Let’s test these limits starting with the `int8` and `unit8` data types. They
    can be used to convert an input number into an object of the their type by using
    functions `int8()` and `uint8()`, respectively:


    ```

    1  −−>2ˆ8

    2  ans =

    3  256.

    4  −−>int8(2ˆ8)

    5  ans =

    6  0

    7  −−>uint8(2ˆ8)

    8  ans =

    9  0

    10  −−>uint8(2ˆ8−1)

    11  ans =

    12  255

    13  −−>int8(2ˆ8−1)

    14  ans =

    15  −1

    16  −−>uint8(2ˆ8+1)

    17  ans =

    18  1

    19  −−>int8(2ˆ8+1)

    20  ans =

    21  1

    ```


    2⁸ = 256 so, with 8 bits, this is the biggest number you can store. However, since
    the numbers also include 0, an 8-bit storage system can store a maximum of 0 to
    255 as numeral values. When you use `int8` representation, then one of the bits
    is used up to represent the signed bit. This leaves the range of ![ $$ \pm {2}^8-1
    $$ ](A458922_1_En_2_Chapter_IEq5.gif). For this reason, `int8(2ˆ8)` does not equal
    256\. But even `unit8(2ˆ8)` does not equal 256 because the maximum number that
    can be stored is 255\. Why, then, is 0 is shown as answer?


    The system of storage follows a cyclic nature where the next number after the
    maximum number 255 is 0\. This can be verified by the fact that `uint8(2ˆ8-1)`
    equals 255\. On the other hand, `int8(2ˆ8-1)` is −1 because `int8` data type can
    also store the negative numbers and, hence, −1\. Both `uint8(2ˆ8+1)` and `int8(2ˆ8+1)`
    results in 1 since 1 comes after 0.


    For storing numbers beyond the range allowed by a particular precision, you must
    use data types with more precision (more numbers of bits used to store digits).
    For example:


    ```

    1  −−>a = int8(2ˆ10)

    2  a =

    3  0

    4  −−>a = int16(2ˆ10)

    5  a =

    6  1024

    7  −−>a = int32(2ˆ10)

    8  a =

    9  1024

    ```


    Since 2^(10) = 1024, which is beyond the range of `int8` data type, it results
    in the storage of 0 as its value, whereas it can be stored in `int16`, `int32`
    data types.


    Other data types for numerical values are `double` and `float`, which store real
    numbers. Real numbers are represented as floating point numbers in a computer.
    The mapping of a real number to a computer’s storage system is a formulaic representation
    (called floating point representation ). For example, the value of ![ $$ \frac{1}{3}
    $$ ](A458922_1_En_2_Chapter_IEq6.gif) is 0.3333333… . Let’s suppose that we have
    only four significant digits for a particular calculations. If so, the value can
    be rewritten as 3.3333 × 10^(−1) where 3.3333 is called the significand, 10 is
    called the base, and −1 is called the exponent . This is further explained in
    Section 2.11.2.


    While assigning a number to the significand, the information about the number
    of significant digits is used. The significant figures of a number are digits
    that carry meaningful contribution to its measurement resolution. In the previous
    case, we assumed only four significant digits, depending on requirements of calculations/measurements.
    The term floating point refers to the fact that a number’s radix point (decimal
    point) can “float”; that is, it can be placed anywhere relative to the significant
    digits of the number. This position is indicated as the exponent component Thus,
    the floating-point representation can be thought of as a kind of scientific notation.'
  trans: '

    ### 2.11.1 数值数据


    数字是数值分析的基本构建块。将数字表示为计算机可计算的量，需要将其作为数据存储在计算机内存中，并通过预定义系统在各种输出终端上显示。由于内存本质上是有限的，因此会为整数、实数、复数等不同数字类型分配固定的内存空间。同样，各种输出终端也有固定的数字显示能力。例如，如果要显示分数
    ![ $$ -\frac{2}{3} $$ ](img/A458922_1_En_2_Chapter_IEq4.gif)，那么 Scilab 必须能够打印分子和分母，并用一条与两者大小匹配的水平线分隔，负号应放置在与水平线相同的高度，但要有一定间距以清晰区分。类似地，显示数字
    `2 ×10^(−3)` 需要分别存储关于数字 `2`、`10` 和 `−3` 的信息，并相应地进行显示，其中 `−3` 必须是 `10` 的上标，以此类推。Scilab
    的图形能力相当有限，且该主题超出了本书的范围。因此，我们将专注于与数字存储相关的主题。


    在计算机内存廉价的今天，我们为何还要费心为数据寻求更少的内存？如果我们有一台 64 位架构的机器，它可以为每个实体分配 64 位。但使用 64 位来存储小值（例如
    `0`）是否明智？自动分配会面临这种低效的计算方式。因此，是严格声明数据类型，还是让 Scilab 自行处理，仍是开发者的选择。合理使用这一特性可以加速计算并减少内存空间需求。


    表 2-1 显示了有符号和无符号整数的存储方式。


    **表 2-1** 不同精度的整数数值数据类型


    | 数据类型 | 含义 | 范围 |

    | --- | --- | --- |

    | `int8` | 8 位有符号整数 | `±2⁸ − 1` |

    | `uint8` | 8 位无符号整数 | `[0, 2⁸]` |

    | `int16` | 16 位有符号整数 | `±2¹⁵ − 1` |

    | `uint16` | 16 位无符号整数 | `[0, 2¹⁶]` |

    | `int32` | 32 位有符号整数 | `±2³¹ − 1` |

    | `uint32` | 32 位无符号整数 | `[0, 2³²]` |

    | `int64` | 64 位有符号整数 | `±2⁶³ − 1` |

    | `uint64` | 64 位无符号整数 | `[0, 2⁶⁴]` |


    让我们从 `int8` 和 `uint8` 数据类型开始测试这些极限。它们可以分别通过使用函数 `int8()` 和 `uint8()` 将输入数字转换为其类型的对象：


    ```

    1  −−>2ˆ8

    2  ans =

    3  256.

    4  −−>int8(2ˆ8)

    5  ans =

    6  0

    7  −−>uint8(2ˆ8)

    8  ans =

    9  0

    10  −−>uint8(2ˆ8−1)

    11  ans =

    12  255

    13  −−>int8(2ˆ8−1)

    14  ans =

    15  −1

    16  −−>uint8(2ˆ8+1)

    17  ans =

    18  1

    19  −−>int8(2ˆ8+1)

    20  ans =

    21  1

    ```


    `2⁸ = 256`，因此对于 8 位而言，这是可以存储的最大数字。然而，由于数字还包括 `0`，一个 8 位存储系统最多可以存储从 `0` 到 `255`
    的数值。当你使用 `int8` 表示时，其中一个位被用于表示符号位。这使得范围为 ![ $$ \pm {2}⁸-1 $$ ](img/A458922_1_En_2_Chapter_IEq5.gif)。因此，`int8(2ˆ8)`
    不等于 `256`。但即使是 `uint8(2ˆ8)` 也不等于 `256`，因为可以存储的最大数字是 `255`。那么，为什么显示答案 `0`？


    存储系统遵循一种循环性质，其中最大数字 `255` 之后的下一个数字是 `0`。这可以通过 `uint8(2ˆ8-1)` 等于 `255` 这一事实来验证。另一方面，`int8(2ˆ8-1)`
    是 `−1`，因为 `int8` 数据类型也可以存储负数，因此是 `−1`。`uint8(2ˆ8+1)` 和 `int8(2ˆ8+1)` 的结果都是 `1`，因为
    `0` 之后是 `1`。


    对于存储超出特定精度允许范围的数字，必须使用更高精度的数据类型（用于存储数字的位数更多）。例如：


    ```

    1  −−>a = int8(2ˆ10)

    2  a =

    3  0

    4  −−>a = int16(2ˆ10)

    5  a =

    6  1024

    7  −−>a = int32(2ˆ10)

    8  a =

    9  1024

    ```


    由于 `2¹⁰ = 1024`，超出了 `int8` 数据类型的范围，因此其值存储为 `0`，而它可以存储在 `int16`、`int32` 数据类型中。


    其他数值数据类型是 `double` 和 `float`，它们用于存储实数。实数在计算机中表示为浮点数。实数到计算机存储系统的映射是一种公式化表示（称为浮点表示）。例如，![
    $$ \frac{1}{3} $$ ](img/A458922_1_En_2_Chapter_IEq6.gif) 的值是 `0.3333333…`。假设对于特定计算，我们只有四位有效数字。如果是这样，该值可以重写为
    `3.3333 × 10^(−1)`，其中 `3.3333` 称为尾数，`10` 称为基数，`−1` 称为指数。这将在第 2.11.2 节中进一步解释。


    在给尾数赋值时，会用到有效数字位数的信息。一个数字的有效数字是指那些对其测量分辨率有有意义贡献的数字。在前面的例子中，根据计算/测量的需求，我们假设只有四位有效数字。术语“浮点”指的是数字的小数点可以“浮动”；也就是说，它可以相对于数字的有效数字放置在任何位置。这个位置由指数分量指示。因此，浮点表示可以被看作是一种科学记数法。

