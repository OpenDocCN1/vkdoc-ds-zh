    ```


    ### 3.3.12 Appending Rows and Columns


    When an entire row or column of a matrix needs to be appended, only one thing
    must be taken into consideration. The size of the new matrix, which is used for
    this purpose, must match the row and column requirement. As an example, let’s
    define an array `A,B,D` with sizes 2 × 2, 1 × 2, and 2 × 1, respectively. Row
    matrix `B` can be inserted as a row to `A` and column matrix `D` can be inserted
    as a row to `A`:


    ```

    1  −−>A = [4,−3;5,−5]

    2  A =

    3  4\.   −3.

    4  5\.   −5.

    5  −−>B = [−9,1]

    6  B =

    7  −9\.   1.

    8  −−>size(A)

    9  ans =

    10  2\.   2.

    11  −−>size(B)

    12  ans =

    13  1\.   2.

    14  −−>C = [A;B]

    15  C =

    16  4\.   −3.

    17  5\.   −5.

    18  −9\.   1.

    19  −−>size(C)

    20  ans =

    21  3\.   2.

    22  −−>D = [5;6]

    23  D =

    24  5.

    25  6.

    26  −−>size(D)

    27  ans =

    28  2\.   1.

    29  −−>E = [A,D]

    30  E =

    31  4\.   −3\.   5.

    32  5\.   −5\.   6.

    33  −−>size(E)

    34  ans =

    35  2\.   3.

    ```


    ### 3.3.13 Deleting a Row and/or Column of a Matrix


    Rows and columns can be deleted by assigning null matrices `[]` to them. For example,
    `()1,:)=[]` deletes the first row, and `():,1)` deletes the first column of a
    matrix:


    ```

    1  −−>A = rand(3,3)

    2  A =

    3  0.88   0.93   0.36

    4  0.65   0.21   0.29

    5  0.31   0.31   0.57

    6  −−>A (1,:)=[]

    7  A =

    8  0.65   0.21   0.29

    9  0.31   0.31   0.57

    10  −−>A(:,1)=[]

    11  A =

    12  0.21   0.29

    13  0.31   0.57

    ```


