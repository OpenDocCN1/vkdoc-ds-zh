  trans: '

    ### 5.2.2 文件路径


    目录/文件夹可以包含子目录/子文件夹和文件。如果管理员不限制此过程，这种行为可以达到任意层级。`pwd` 命令代表打印当前工作目录。在 Scilab 终端中，输入
    `pwd` 会显示当前工作目录的路径，如下例所示：


    ```

    1  −−>pwd

    2  ans =

    3  /Users/

    ```


    在用户目录下，`/Users` 目录包含一个以用户名（用户安装操作系统时给定的`<userName>`）命名的子目录。这是分配给 Scilab 会话的主要工作区。除非用户更改目录，否则用户在此工作区中执行所有任务。当在终端中输入
    `pwd` 时，一个名为 `ans` 的变量会存储数据（文件路径）。如前所述，`ans` 存储 Scilab REPL 中的最后一个输出。可以分配一个变量（名称由用户选择）将文件名存储为字符串。


    通过在终端中写入文件路径来访问文件/文件夹。让我们做一个小练习来理解这个过程。要创建一个新目录，请使用 `mkdir ''name''`，如下所示：


    ```

    1  −>mkdir scilab // 创建一个名为 ''scilab'' 的新目录

    2   ans =

    3  1.

    4  −−>cd scilab /// 将当前目录更改为目录名 ''scilab''

    5  ans =

    6  /Users/sandeepnagar/scilab

    7  −−>mkdir test // 创建一个名为 ''test'' 的目录

    8  ans =

    9  1.

    10  −−>cd test // 将当前目录更改为目录名 ''test''

    11  ans =

    12  /Users/sandeepnagar/scilab/test

    13  −−>ls // 列出当前目录（即 ''test''）的内容

    14  ans =

    15  []

    16  −−>mkdir new // 在此处创建一个名为 ''new'' 的目录

    17  ans =

    18  1.

    19  −−>ls // 列出当前目录（即 ''test''）的内容

    20  ans =

    21  new

    22  −−>rmdir new // 删除名为 ''new'' 的目录

    23  ans =

    24  1.

    25  −−>ls // 列出当前目录（即 ''test''）的内容

    26  ans =

    27  []

    28  −−>isdir(''/Users/sandeepnagar/scilab/test'') // 检查目录 ''test'' 是否存在

    29  ans =

    30  T

    ```


    在第 1 行，`mkdir scilab` 创建了一个名为 `''scilab''` 的目录。要查看当前目录的内容，我们可以使用命令 `ls`，它代表列表（list）。要更改目录，我们可以使用命令
    `cd "file path"`。我们将在本书的其余练习中使用此目录。


    我们可以在名为 `scilab` 的目录中创建一个名为 `test` 的目录。我们可以使用 `ls` 命令查看其内容列表。当目录为空时，显示 `ans=[]`。如果我们现在通过执行
    `mkdir new` 命令在子目录 `test` 内创建一个名为 `new` 的新目录，然后检查内容列表，结果显示为 `ans= new`。要删除目录，我们可以使用
    `rmdir` 命令。因此，通过执行 `rmdir new`，我们可以看到用户已删除名为 `new` 的目录。


    命令 `isdir` 检查输入参数（路径）是否指向一个目录。当在输入路径处找到一个目录时，输出为布尔变量 `T` (真)；否则，输出为 `F` (假)。


    ### 5.2.3 创建文件并保存


    `save` 和 `load` 命令使我们能够向内存写入数据和从内存读取数据：


    ```

    1  −−>a = rand(3,3)

    2  a =

    3  0.2113249    0.3303271    0.8497452

    4  0.7560439    0.6653811    0.6857310

    5  0.0002211    0.6283918    0.8782165

    6  −−>save(''rand_matrix.dat'',''a'')

    7  −−>ls

    8  ans =

    9  ! rand_matrix.dat   !

    10  −−>load(''rand_matrix.dat'',''a'')

    11  −−>a =

    12  0.2113249    0.3303271    0.8497452

    13  0.7560439    0.6653811    0.6857310

    14  0.0002211    0.6283918    0.8782165

    ```


    在第 1 行，首先创建了一个名为 `a` 的变量，该变量存储一个随机的 3×3 矩阵。在第 2 行，这个数据被存储为一个名为 `rand_matrix.dat`
    的 `.dat` 文件（数据文件），它将变量名作为参数传递。需要时，可以使用 `load` 命令将此文件加载到工作区中。请注意，数据并不一定非得是数字。


    数据可以是数字计算机能够处理的任何东西，包括图片、视频、字符串和字符等等。


    通过保存时传递变量名，可以将多个变量存储在同一个文件中：


    ```

    1  −−>a = rand(2,2)

    2  a =

    3  0.0683740    0.6623569

    4  0.5608486    0.7263507

    5  −−>b = rand(3,3)

    6  b =

    7  0.1985144    0.2312237    0.6525135

    8  0.5442573    0.2164633    0.3076091

    9  0.2320748    0.8833888    0.9329616

    10  −−>c = rand(3,2)

    11  c =

    12  0.2146008    0.2922267

    13  0.312642     0.5664249

    14  0.3616361    0.4826472

    15  −−>save(''rand_matrix1.dat'',''a'',''b'',''c'')

    16  −−>ls

    17  ans =

    18  !rand_matrix1.dat   !

    19  !                   !

    20  !rand_matrix.dat    !

    21  −−>load(''rand_matrix1.dat'',''a'',''b'',''c'')

    22  −−>a

    23  a =

    24  0.0683740    0.6623569

    25  0.5608486    0.7263507

    26  −−>b

    27  b =

    28  0.1985144    0.2312237    0.6525135

    29  0.5442573    0.216463     0.3076091

    30  0.2320748    0.8833888    0.9329616

    31  −−>c

    32  c =

    33  0.2146008    0.2922267

    34  0.312642     0.5664249

    35  0.3616361    0.4826472

    ```


    `help("save")` 和 `help("load")` 提供了关于如何使用这些命令的非常有用的说明。


    `load()` 函数遵循与 `save()` 函数相同的逻辑。数据可以从特定格式的文件中解压缩并加载为数组。这样填充的数组可用于计算，如果需要，可以使用
    `save()` 函数再次生成结果文件。复杂的计算需要多次重复这个过程。因此，这些函数已经优化，可以在短时间内定位和加载所需数据。


    #### 5.2.3.1 打开和关闭文件


    要读取和写入数据文件，必须打开它们并将其定义为可读和/或可写。命令 `mopen()` 用于创建一个不存在的文件或打开一个现有文件。例如，以下代码展示了如何在
    `write` (写入) 模式下创建一个名为 `test.sce` 的文件。一个名为 `file_handle` 的变量用于存储该事件。查看文件夹的内容列表，您可以看到确实创建了一个此名称的文件。与
    `mopen()` 命令类似，`mclose()` 命令用于关闭文件：


    ```

    1  −−>f ile_handle = mopen(''test.sce'',''w'') // 以 ''write''（写入）模式创建文件

    2  f ile_handle =

    3  1.

    4  −−>ls

    5  ans =

    6  test.sce

    7  −−>mclose(f ile_handle) // 关闭文件，返回整数 0 表示文件成功关闭

    8  ans =

    9  0.

    ```


    `mode` (模式) 参数控制文件的访问类型，其值可以在表 5-1 中找到。


    **表 5-1** 不同的文件模式


    | `r` | 以读取模式打开 (默认)。文件必须存在；否则，操作失败。 |

    | :--- | :--- |

    | `w` | 以写入模式打开。如果文件存在，其内容将被销毁。 |

    | `a` | 以追加模式打开。如果文件不存在，则创建它。 |

    | `r+` | 以读写模式打开。文件必须存在；否则，操作失败。 |

    | `w+` | 以读写模式打开。如果文件存在，其内容将被销毁。 |

    | `a+` | 以读写和追加模式打开。如果文件不存在，则创建它。 |


    此外，表 5-2 中的字符可用于指定文件类型。


    **表 5-2** 不同的文件类型


    | `t` | 文本文件 |

    | :--- | :--- |

    | `b` | 二进制文件 (默认) |


    默认的访问模式是 `''rb''` (读取二进制文件)。

