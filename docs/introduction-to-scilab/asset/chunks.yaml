    \ condition and, until it is satisfied, it runs a block of code. The syntax for\
    \ `while` loop is the following:\n\n```\n1  while condition\n2  BODY\n3  endwhile\n\
    ```\n\nHere, the keyword `while` initiates the execution of a `while` loop. The\
    \ `condition` is a logical condition whose answer can be '`true`' (1) or '`false`'\
    \ (0). The `BODY` encompasses the string of commands that is executed until the\
    \ condition holds `true`, as shown in Listing 6-1.\n\n```\n1  i = 1\n2  while\
    \ i<20\n3      disp(i);\n4      i = i∗2;\n5   end\nListing 6-1\nwhile.sce\n```\n\
    \nThe result is shown as follows:\n\n```\n1  −−>exec('/Users/sandeepnagar/.../while.sce',\
    \ −1)\n2  1.\n3  2.\n4  4.\n5  8.\n6  16\n```\n\nThe code `while.sce` first initializes\
    \ the variable `i` to the numerical value 1. It then checks the condition `i <\
    \ 20`. This is true at the first step when `i = 1`. Consequently, it enters the\
    \ loop and executes the command `disp(i)`. (The numerical value 1 is printed on\
    \ the terminal.) Then the next line is executed (`i = i * 2`), which makes the\
    \ new value of `i = 2`. At the end of the loop, the control is further taken by\
    \ the condition statement (`i < 20`). Until this holds `true`, the loop runs and,\
    \ hence, 1, 2, 4, 8, 16 are printed. When `i = 16` and the statement `i = i *\
    \ 2` is executed, the new value of `i` becomes 32. Now the condition is not satisfied\
    \ and the loop is terminated.\n\n### 6.2.2 Infinite Loops\n\nSome loops can run\
    \ infinitely so they are called infinite loops. Try the code `while.sce` by initializing\
    \ `i = 0` instead of `i = 1`. In this case, the value of `i` will always be 0\
