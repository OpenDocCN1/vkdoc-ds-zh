  trans: "\n## 2.2 处理 Scilab 文件\n\n第二种方法是编写一个脚本（即一组多条命令）并保存为文件。Scilab 提供两种脚本文件。`.sci`\
    \ 和 `.sce` 两种格式明确区分了它们：\n\n- `.sci` 文件包含 Scilab 和/或用户定义的函数。\n  - 执行此类文件只是将它们加载到\
    \ Scilab 环境中，但并不会执行它们。\n- `.sce` 文件同时包含 Scilab 函数和可执行命令。当调用这些文件时，它们会被执行。\n\n拥有两种文件类型是\
    \ Scilab 与 MATLAB 的区别之一。在 MATLAB 中，并不区分函数文件和用于执行的文件，所有文件都简单地以 `.m` 扩展名表示。\n\n\
    在代码清单 2-1 中，我们将编写一个名为 `hello.sce` 的 Scilab 文件并运行它。该文件使用了与我们在第 2.1 节中看到的类似代码，当时我们在命令提示符下打印了\
    \ `Hello World!`。\n\n```\n1  message = \"Hello World\"\n2  disp(message)\n代码清单\
    \ 2-1\nhello.sce\n```\n\n要运行此文件，您可以简单地点击 `SciNotes` 窗口菜单栏上的“播放”图标。或者，您可以指定文件的完整路径来运行它。如果您正在与文件相同的目录下工作，您只需在命令\
    \ `exec()` 中打印文件名，无需提及扩展名。\n\n文件命名遵循常规惯例。首字母不应是特殊字符或数字，并且文件名区分大小写。命名文件时应避免使用关键字。也建议用户在特定项目中，将工作文件保存在单个文件夹中。这样做的优点是，为了运行程序，用户只需编写程序名称，而不需要文件的完整路径。此外，也更容易共享代码供执行，因为不同计算机的路径会不同。\n\
    \n## 2.3 第二个示例：一个数学计算\n\n您可以通过在命令提示符下键入以下内容来编写第一个程序，打印字符串 “Hello World!”：\n\n\
    ```\n1  −−>a = 2\n2  a =\n3  2.\n4  −−>b = 3\n5  b =\n6  3.\n7  −−>a+b\n8  ans\
    \ =\n9  5.\n10  −−>a−b\n11  ans =\n12  −1.\n```\n\n首先，变量 `a` 被赋值为数值 `2`。尽管它被定义为整数，但它被视作浮点数\
    \ `2`，表示数值 2.0。同样地，名为 `b` 的变量被存储为数值 3.0。然后，可以使用这些变量执行计算。“变量”一词意味着它们可以存储各种值。在任何时刻，它们存储的值都将用于计算。因此，`a+b`\
    \ 计算为 2.0 + 3.0 = 5.0，`a-b` 计算为 2.0 - 3.0 = -1.0。名为 `ans` 的变量存储最后求值的 Scilab 表达式的结果。这些概念在代码清单\
    \ 2-2 中进行了演示。\n\n```\n1  a = 2\n2  b = 3\n3  summing = a+b\n4  subtracting = a−b\n\
    5  disp(summing)\n6  disp(subtracting)\n代码清单 2-2\naddsub.sce\n```\n\n或者，您可以通过赋值、计算，然后将这些命令存储在一个文件中，比如\
    \ `addsub.sce`。您可以通过键入 `exec(addsub.sce)` 来运行此文件。您也可以通过简单地点击菜单栏上的“播放”按钮来运行该程序。结果可以在\
    \ Scilab 的命令提示符中看到，并且会符合预期。\n\n若要编辑文件内容，您需要打开编辑器（`SciNotes`）。您可以使用菜单卡片左上角提供的图标打开它，也可以在命令提示符下输入\
    \ `edit addsub.sce`。会弹出一个新窗口，您可以在其中编写代码，并将其保存为 `addsub.sce` 或所需的其它名称。如果您没有将文件格式定义为\
    \ `.sce`，Scilab 会默认使用 `.sci` 格式，因为它将该文件视为 Scilab 函数。\n\nScilab 命令提示符默认用符号 `-->`\
    \ 表示。Scilab 是一种具有动态类型对象的解释型语言。这意味着在命令提示符下输入命令后，如果按下键盘上的回车键，命令就会执行。您可以一次编写一行代码并执行它。代码会一直执行，直到出现错误为止。\n\
    \n学习 Scilab 的一种方法是运行演示程序。点击主窗口顶部菜单列表中的 `?` 符号。选择“演示”，然后点击“介绍：Scilab 入门”。选择相应的主题进行学习。这种方法要求用户自己安排学习体验；因此，不建议首次使用用户采用。本书将在这方面提供帮助，因为学习结构是为首次使用用户设计的。\n\
    \n### 2.3.1 计算器\n\n因为 Scilab 命令提示符会`执行`命令提示符下的任何表达式，所以 Scilab 可以有效地充当计算器，其数学运算符包括乘法（符号为\
    \ `*`）、除法（符号为 `/`）、加法（符号为 `+`）、减法（符号为 `-`）和乘方（符号为 `^`）：\n\n```\n1  −−>2+4.2\n\
    2  ans =\n3  6.2\n4  −−>2+4\n5  ans =\n6  6.\n7  −−>2−4.2\n8  ans =\n9  − 2.2\n\
    10  −−>2∗4.2\n11  ans =\n12  8.4\n13  −−>2/4.2\n14  ans =\n15  0.4761905\n16 \
    \ −−>2ˆ4\n17  ans =\n18  16.\n```\n\n此示例显示，当在命令提示符 `-->` 下输入命令时，它会被执行，并在下一行显示结果，格式为\
    \ `ans =`。\n\n## 2.4 格式化命令提示符显示\n\n命令提示符下的数字显示可以通过两种方式进行格式化：科学记数法（也称为指数记数法）或普通记数法。这通过发出\
    \ `format e` 命令来实现，该命令会以科学记数法打印所有答案。任何时候，如果发出 `format v` 命令，则会选择变量自适应格式化。这里，Scilab\
    \ 会选择直接表示法或指数/工程/科学记数法，以适应每个处理后的值以及所需的宽度，并保持最大的输出位数。此行为在以下代码中展示：\n\n```\n1  −−>format\
    \ e\n2  −−>2/4.2\n3  ans =\n4  4.762D−01\n5  −−>format v\n6  −−>2/4.2\n7  ans\
    \ =\n8  0.4761905\n```\n\n当使用 `format()` 函数时，它可以接受两个输入参数——模式和字符宽度——以进行显示。数字的宽度表示使用的输出字符数。这包括以下内容：\n\
    \n- 尾数的符号\n- 其数字\n- 小数点分隔符\n- 指数符号\n- 指数符号\n- 指数的数字\n\n默认宽度为 10，`'e'` 模式下的最小宽度为\
    \ 8。以下示例代码解释了此行为：\n\n```\n1  −−>format('e',10)\n2  −−>2/4.2\n3  ans =\n4  4.762D−01\n\
    5  −−>format('e',20)\n6  −−>2/4.2\n7  ans =\n8  4.7619047619048D−01\n9  −−>format('v',20)\n\
    10  −−>2/4.2\n11  ans =\n12  0.4761904761904762\n```\n\n当发出 `--> format('e',20)`\
    \ 命令时，可以使用 20 位数字来显示结果，因此屏幕上会显示更多数字。显示更多位数的结果并不会改变结果的存储方式。结果是以固定位数的精度存储的，我们将在第\
    \ 2.11.1 节中讨论。只有其显示方式受到了影响。\n\n## 2.5 运算符优先级\n\n当需要执行多个运算时，遵循 BODMAS 规则。数学运算的优先级顺序如下：\n\
    \n- 括号内的任何表达式最先求解。\n  - 如果括号内还有括号，则先求解最内层的括号，然后依次求解外层的括号。\n- 除法\n- 乘法\n- 加法\n\
    - 减法\n\n如下面代码所示，放置括号会立即对计算产生影响，因为括号内的内容会先被求解。因此，我们建议将较长的数学语句适当地用括号括起来：\n\n```\n\
    1  −−>(2ˆ2)/3\n2  ans =\n3  1.3333333\n4  −−>2ˆ(2/3)\n5  ans =\n6  1.5874011\n\
    ```\n"
- fmt: '# 2.6 Variable Browser Window


    As soon as the answer is displayed, the variable browser window shows that a new
    variable named `ans` has been created and the value of calculations is stored
    by this variable name. `ans` is the default variable name for Scilab. During the
    course of programming, all variables and their values as well as their type are
    displayed at the variable browser window.


    Double clicking a variable name or any of its properties opens the same as in
    a graphic interface, which looks similar to an Excel sheet. This is because Scilab
    performs matrix calculations and, hence, stores values as matrices. A single value
    is a 1 × 1 matrix (a matrix having one row and one column). When users learn to
    define arrays, they can correlate the fact that variables will store values as
    an n × m dimensional matrix where data is stored in n rows and m columns. Apart
    from these two-dimensional arrays, users can also define multidimensional arrays.


    # 2.7 Clearing Variables


    Variable values are stored at specific memory locations. The command `clear` kills
    these variables, unless they are protected. Protected variables are standard libraries
    and variables with the percent prefix. As soon as you type `clear` at the command
    prompt, you can see that the variable browser is cleared of all values and information.


    If three variables `a`, `b`, and `c` have been defined so that they can be selectively
    killed by issuing the command `clear a` where only the variable named `a` is killed,
    the other two safe. The function `isdef()` checks whether a variable is live.
    Listing [2-3](#A458922_1_En_2_Chapter.html#Par51) illustrates this point.


    ```

    1  disp("Def ine three vaiables named a,b,c")

    2  a = 10;

    3  b = 12.2;

    4  c = a∗b;

    5  disp("Checking if variables have been def ined as a,b,c")

    6  disp(isdef("a"))

    7  disp(isdef("b"))

    8  disp(isdef("b"))

    9  disp("After clearing the variable a")

    10  clear a

    11  disp(isdef("a"))

    12  disp(isdef("b"))

    13  disp(isdef("b"))

    Listing 2-3

    clear.sce

    ```


    When executed (by typing `exec(clear.sce)`), it produces the following output:


    ```

    1  −−>exec(''clear.sce'')

    2  −−>disp("Def ine three vaiables named a,b,c")

    3  Def ine three vaiables named a,b,c

    4  −−>a = 10;

    5  −−>b = 12.2;

    6  −−>c = a∗b;

    7  −−>disp("Checking if variables have been def ined as a,b,c")

    8  Checking if variables have been def ined as a,b,c

    9  −−>disp(isdef("a"))

    10  T

    11  −−>disp(isdef("b"))

    12  T

    13  −−>disp(isdef("b"))

    14  T

    15  −−>disp("After clearing the variable a")

    16  After clearing the variable a

    17  −−>clear a

    18  −−>disp(isdef("a"))

    19  F

    20  −−>disp(isdef("b"))

    21  T

    22  −−>disp(isdef("b"))

    23  T

    ```


    # 2.8 Comments


    All programming languages are designed to encourage programmers to put comments
    at desired places in the program so that they can be understood by humans. Scilab
    uses the double forward slash (`//`) for this purpose. Anything written in front
    of a comment is not executed by the interpreter. Comments are used as texts explaining
    the flow of information and for tagging information at specific locations in the
    program.


    It is a good practice to write comments for each relevant line of code for better
    understanding. This is particularly important if more than one person shares the
    code. The end user can understand the usage of variables and the logic behind
    calculation by reading the comments.


    # 2.9 Predefined Constants


    Scientific computing requires some predefined constants that are frequently used.
    They are preceded by the `%` sign, as shown in Listing [2-4](#A458922_1_En_2_Chapter.html#Par57).


    ```

    1  disp("value of pi:")

    2  disp(%pi)

    3  disp("value of eps:")

    4  disp(%eps)

    5  disp("Value of inf inity:")

    6  disp(%inf)

    7  disp("Value of e:")

    8  disp(%e)

    9  disp("Value of imaginary number i:")

    10  disp(%i)

    11  disp("value of boolean True:")

    12  disp(%t)

    13  disp("Value of boolean False:")

    14  disp(%f)

    15  disp("value of Not−a−number variable i.e. nan:")

    16  disp(%nan)

    Listing 2-4

    constants.sce

    ```


    When executed (by typing `exec(constants.sce)`), it produces the following output:


    ```

    1  value of pi:

    2  3.1415927

    3  value of eps:

    4  2.220D−16

    5  Value of inf inity:

    6  Inf

    7  Value of e:

    8  2.7182818

    9  Value of imaginary number i:

    10  i

    11  value of boolean True:

    12  T

    13  Value of boolean False:

    14  F

    15  value of Not−a−number variable i.e. nan:

    16  Nan

    ```


    A number of physical constants are predefined:


    - `pi`

    - `e` (Euler’s number)

    - `i` is the imaginary number `$$ =\sqrt{-1} $$`

    - `inf` (infinity = ∞)

    - `NaN` (Not a Number—resulting from undefined operations, such as `Inf/Inf`)
    and `eps`, which is defined as 2^(−52)


    ## 2.9.1 Common Mathematical Functions


    A number of predefined mathematical functions exists in Scilab. Following are
    some of them:


    - Absolute value: `abs()` gives the positive value of argument

    - Logarithm: Natural logarithm `log()`, Base 10 logarithm `log10()`

    - Trigonometric functions: `sin()`, `cos()`, `tan()` (Arguments are taken in radians.)

    - Inverse-trigonometric functions: `asin()`, `acos()`, `atan()`


    ```

    1  −−>abs(%i) // absolute value of sqrt(−1)

    2  ans =

    3  1.

    4  −−>abs(%pi) // absolute value of pi

    5  ans =

    6  3.1415927

    7  −−>abs(−%pi)

    8  ans =

    9  3.1415927

    10  −−>log(10) // logarithmic valaue to the base e

    11  ans =

    12  2.3025851

    13  −−>log(−10)

    14  ans =

    15  2.3025851 + 3.1415927i

    16  −−>log(%e)

    17  ans =

    18  1.

    19  −−>log(−%e)

    20  ans =

    21  1\. + 3.1415927i

    22  −−>log10(10) // logarithmic valaue to the base 10

    23  ans =

    24  1.

    25  −−>log10(−10)

    26  ans =

    27  1\. + 1.3643764i

    28  −−>sin(45) // sine value

    29  ans =

    30  0.8509035

    31  −−>sin((45∗%pi)/180) // argument converted to degrees

    32  ans =

    33  0.7071068

    34  −−>sqrt(2) // square root

    35  ans =

    36  1.4142136

    37  −−>acos(1) // inverse cosine

    38  ans =

    39  0.

    ```


    Complex calculations using these functions and operations can be performed with
    ease, as demonstrated in Listing [2-5](#A458922_1_En_2_Chapter.html#Par73).


    `$$ \sqrt{\mathit{\sin}{(10)}^2+\mathit{\cos}{(10)}^2} $$`


    ```

    1  theta = 10; // Theta is taken as 10 here

    2  s = sin(theta);

    3  s_sq = sˆ2;

    4  c = cos(theta);

    5  c_sq = cˆ2;

    6  result = sqrt(s_sq + c_sq); // Variable named "result" stores value of answer

    7  disp(result)

    Listing 2-5

    complexCal.sce

    ```


    The result is displayed as 1 in compliance with trigonometric identity:


    `$$ \sqrt{\mathit{\sin}{\left(\theta \right)}^2+\mathit{\cos}{\left(\theta \right)}^2}=1
    $$`


    # 2.10 Variable


    Variables are used to store values temporarily at computer memory locations. They
    are actually references to memory locations that store the data. They are addressed
    using a alphanumeric symbol or set of symbols called strings. The example of this
    approach is given in Scilab code `complexCalc.sce` (see Section 2.9.1) where the
    numeric value 10 is stored in the variable named `theta`. Then sin(`θ`) is calculated
    and stored in the variable named `s`. Similarly cos(`θ`) is stored as `c`. Their
    respective squares are stored in variables named `s_sq` and `c_sq`. Finally, a
    variable named `result` stores the calculation `$$ \sqrt{\mathit{\sin}{\left(\theta
    \right)}^2+\mathit{\cos}{\left(\theta \right)}^2} $$`, and this variable name
    is used to print the final answer of the calculation. The main advantage of using
    this approach is that value allocation to a variable is a dynamic process. If
    a user changes the value of the variable `theta` to 5 instead of 10, the value
    changes at all places where this variable is called.'
