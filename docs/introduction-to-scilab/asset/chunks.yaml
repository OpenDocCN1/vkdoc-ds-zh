    \ by the `Ctrl+C` key combination on an ASCII keyboard.\n\nThe onus of avoiding\
    \ infinite loops lies with the user. Scilab will simply execute the statements\
    \ mindlessly without showing a warning or error message. Technically, infinite\
    \ loops are not programming errors as they are syntactically correct. In fact,\
    \ infinite loops can be used if you need to generate an infinite stream of data\
    \ or if you need to execute a Scilab program infinitely. For example, suppose\
    \ a Scilab program reports the status of a remote wind turbine. This code needs\
    \ to run infinitely unless interrupted. In another scenario, suppose an application\
    \ requires a stream of random numbers. In this case, a Scilab code can be written\
    \ to generate an infinite sequence of random numbers."
