    \ 并不关心数据的来源。它根据数据的类型和文件类型来处理数据。用户需要根据实际情况，自行判断使用哪个合适的函数来操作文件。文件操作提供了裁剪数据的能力，以便仅将数据中有用的部分作为数组输入。进一步的裁剪可以通过切片操作来完成。掌握了文件处理的技巧，你就能自信地处理复杂的数值计算。\n\
    \n# 6. 函数与循环\n\n## 6.1 引言\n\n当某个特定的数值计算任务需要在不同的数据点上“重复”执行时，数字计算机就成为了一个有用的工具，因为它们能以比人类更快的速度执行这种操作。循环正是执行此任务的。通过使用条件来检查开始和终止规则，用户可以按需执行过程中的重复部分。不同的编程语言和环境对定义循环有不同的规则。Scilab\
    \ 提供了一种简单的方式来定义和运行循环。除了循环，函数也构成了现代编程架构的重要部分。一个大型程序可能需要在不同时间调用一组指令。因此，可以将这组指令定义为一个子程序，以便在需要时请求其执行计算。通过这种方式，一个复杂的任务可以被分解成许多小部分。这种编程架构被称为模块化编程。它是最流行的编程方式，因为它逻辑清晰、善于可视化问题，并且易于调试。定义这些小型指令集最流行的方法是将它们定义为函数。函数和循环共同将一个数值计算问题分解为一系列更简单的问题，从而可以根据需要随时调用。在本章中，我们将详细讨论这两个概念。\n\
    \n## 6.2 循环\n\n循环构成了算法的重要组成部分，因为它们执行计算机最擅长的任务：以非常快速的方式执行重复性操作。循环有多种形式，例如 `for`\
    \ 循环，它遍历一系列变量值并重复执行某些任务；`while` 循环，它在执行某任务之前检查一个逻辑条件；以及 `if-then-else` 循环，它检查一个条件并引导算法的流程。你选择的循环类型取决于手头的问题。\n\
    \n后续章节中描述了各种函数及其用法。批判性地判断其用法至关重要，因为循环部分会消耗大部分执行时间。\n\n### 6.2.1 `while`\n\n`while`\
    \ 循环定义一个逻辑条件，并在该条件满足之前，持续运行一段代码块。`while` 循环的语法如下：\n\n```\n1  while 条件\n2  循环体\n\
    3  endwhile\n```\n\n这里，关键字 `while` 启动 `while` 循环的执行。`条件` 是一个逻辑条件，其答案可以是 '`true`'（1）或\
    \ '`false`'（0）。`循环体` 包含一串命令，这些命令在条件保持为 `true` 期间被执行，如清单 6-1 所示。\n\n```\n1  i =\
    \ 1\n2  while i<20\n3      disp(i);\n4      i = i*2;\n5   end\n清单 6-1\nwhile.sce\n\
    ```\n\n结果如下所示：\n\n```\n1  -->exec('/Users/sandeepnagar/.../while.sce', -1)\n2\
    \  1.\n3  2.\n4  4.\n5  8.\n6  16\n```\n\n代码 `while.sce` 首先将变量 `i` 初始化为数值 1。然后检查条件\
    \ `i < 20`。这在第一步 `i = 1` 时为真。因此，它进入循环并执行命令 `disp(i)`。（数值 1 被打印在终端上。）接着执行下一行（`i\
    \ = i * 2`），使得 `i` 的新值变为 2。在循环结束时，控制权再次交给条件语句（`i < 20`）。只要此条件为 `true`，循环就会运行，因此会打印出\
    \ 1、2、4、8、16。当 `i = 16` 并执行语句 `i = i * 2` 后，`i` 的新值变为 32。此时条件不再满足，循环终止。\n\n###\
    \ 6.2.2 无限循环\n\n有些循环可以无限运行，因此被称为无限循环。尝试通过将 `i` 初始化为 `0` 而不是 `i = 1` 来测试代码 `while.sce`。在这种情况下，循环内\
    \ `i` 的值将始终为 0，并且条件 `i < 20` 将始终为 `true`。因此，如果不中断，代码将永远运行下去。在 ASCII 键盘上，可以通过 `Ctrl+C`\
    \ 组合键来中断无限循环。\n\n避免无限循环的责任在于用户。Scilab 只会机械地执行语句，而不会显示警告或错误消息。从技术上讲，无限循环并不是编程错误，因为它们在语法上是正确的。实际上，如果你需要生成无限的数据流，或者需要无限地执行一个\
    \ Scilab 程序，那么可以使用无限循环。例如，假设一个 Scilab 程序报告远程风力涡轮机的状态。此代码需要无限运行，除非被中断。再比如，假设某个应用程序需要源源不断的随机数流。在这种情况下，可以编写一个\
    \ Scilab 代码来生成无限的随机数序列。\n"
- fmt: '### 6.2.3 `for`


    `for` loop is used to perform computation on a list of known values. The syntax
    of `for` loop is the following:


    ```

    1  for variable = vector

    2    BODY

    3  end

    ```


    The keyword `for` declares the starting of the loop where a variable takes the
    values stored in a vector. Then a body of code (represented by `BODY`) is executed.
    The keyword `end` declares the end of `for` loop. This is explained in Listing
    [6-2](#A458922_1_En_6_Chapter.html#Par16).


    ```

    1  for i = 1:10

    2      square_root = sqrt(i);

    3      disp(square_root)

    4  end


    6  disp("Program f inished")

    Listing 6-2

    for.sce

    ```


    Executing `for1.m` yields:


    ```

    1  −−−>exec(''/Users/sandeepnag.../for.sce'', −1)

    2  1.

    3  1.4142136

    4  1.7320508

    5  2.

    6  2.236068

    7  2.4494897

    8  2.6457513

    9  2.8284271

    10  3.

    11  3.1622777

    12  Program f inished

    ```


    The `for` statement creates a vector of numerals from 1 to 10 and stores it in
    a variable named `i`. Each member of this vector is fed to the body of the loop.
    A variable named `square_root` stores the square root of the value stored in the
    array. It is then printed on a Scilab terminal using the command `disp(square_root)`.
    When these two commands are finished, the next member of the vector is picked
    and the same is repeated. This is continued until the last member of the vector
    is stored in the variable named `i` (`i = 10`).


    ### 6.2.4 `if-elseif-else`


    In situations where a number of conditions needs to be checked at different points
    of time, `if-elseif-else` loop works well. The syntax for this loop is given by
    the following:


    ```

    1  if condition1

    2  BODY1

    3  elseif condition2

    4  BODY2

    5  else

    6  BODY3

    7  endif

    ```


    At line 1, a condition is defined. If this condition is satisfied, then line 2
    is executed or else line 3 is executed. Hence, `BODY1` and `BODY2` are the blocks
    of codes that are executed by checking for different set of conditions, and `BODY3`
    set of codes is executed in the case when none of the condition is executed. (See
    Listing [6-3](#A458922_1_En_6_Chapter.html#Par23).)


    ```

    1  i = rand(1,1);

    2  if i>0.5 then

    3  disp(i);

    4  disp("True");

    5  else

    6  disp(i);

    7  disp("False");

    8  end

    Listing 6-3

    ifelse.sce

    ```


    Running the code yields the following:


    ```

    1  −−−>exec(''/Users/sandeepnagar/.../ ifelse.sce'', −1)

    2  0.5376230

    3  True

    4  −−−>exec(''/Users/sandeepnagar/.../ifelse.sce'', −1)

    5  0.1199926

    6  False

    7  −−−>exec(''/Users/sandeepnagar/.../ifelse.sce'', −1)

    8  0.2256303

    9  False

    ```


    Whenever the value of a random number is more than 0.5, `True` is printed; `False`
    is printed otherwise. (See Listing [6-4](#A458922_1_En_6_Chapter.html#Par27).)


    ```

    1  i = rand(1,1);

    2  if i>0.5 then

    3  disp(i);

    4  disp("Value is larger then 0.5");

    5  elseif i>0.3 then

    6  disp(i);

    7  disp("value is larger than 0.5 and 0.3");

    8  else

    9  disp(i)

    10  disp("value is smaller than 0.5")

    11  end

    Listing 6-4

    ifelseif.sce

    ```


    When executing the code `ifelseif.sce`, we obtain the following results on a Scilab
    terminal:


    ```

    1  −3−>exec(''/Users/sandeepnagar/.../ifelseif.sce'', −1)

    2  0.0485566

    3  value is smaller than 0.5

    4  −3−>exec(''/Users/sandeepnagar/.../ifelseif.sce'', −1)

    5  0.6723950

    6  Value is larger then 0.5

    7  −3−>exec(''/Users/sandeepnagar/.../ifelseif.sce'', −1)

    8  0.2017173

    9  value is smaller than 0.5

    10  −3−>exec(''/Users/sandeepnagar/.../ifelseif.sce'', −1)

    11  0.3911574

    12  value is larger than 0.5 and

    13  0.3

    ```


    ## 6.3 Functions


    A function is a set of codes that can be called when required. As a result, it
    can be defined separately either its own file or within the body of the program.
    A script file is similar in nature. A script file stores a sequence of commands
    to be executed. It seems that a function and a script have a similar nature, but,
    unlike MATLAB and Octave, Scilab provides separate kinds of files for each one
    of them. This is based on the nature of their behavior with the core Scilab program.


    Whereas a script file (with extension `.sce`) is an executable file, a function
    file (with extension `.sci`) stores a set of instructions. The function file behaves
    like a black box where input is fed and output is obtained. On the other hand,
    a script file changes its behavior as per input values. Whatever input data a
    script file accesses is taken from the Scilab workspace. Output data from a script
    file is put into the Scilab workspace. The semantics of input data, local variables,
    are visible only within the function.


    The definition of a function follows this syntax:


    ```

    1  function [o1,o2,...] = function_name (i1,i2,...)

    2  statement_1

    3  statement_2

    4  ...

    5  statement_n

    6  endfunction

    ```


    Here the `function` keyword defines the object types as function. Then a set of
    variables is defined that this function is expected to return (`o1,o2,...` signifying
    output1, output2,…). Next comes an `=` operator and then the name of the function.
    In the previous case, it is `function_name`. A function take inputs (`i1,i2,...`
    signifying input1, input2,...) to produce an output according to calculation defined
    in its body. Then comes the main body of the function where commands for executing
    the purpose of the function are mentioned. The last statement, `endfunction`,
    signifies the end of the function.


    For example, we can write a function to find `x² − y²` and assign it to variable
    name `z`, as shown in Listing [6-5](#A458922_1_En_6_Chapter.html#Par37).


    ```

    1  function y = fn1(a,b)

    2  y = aˆ2−bˆ2;

    3  endfunction

    Listing 6-5

    fn1.sci

    ```


    Notice that the extension of this code is `.sci`. This file must first be loaded
    in a Scilab workspace. We need to provide the full path of the file to the built-in
    function `exec()` first and then use the function by providing its name with input
    arguments:


    ```

    1  −−−>exec(''/Users/sandeepnagar/.../fn1.sci'', −1)

    2  −−−>fn1(2,3)

    3  ans =

    4  −5.

    ```


    It is good practice to define the program as a group of function files and call
    them in the master program stored as a script file. This modular approach makes
    it easy to experiment with the idea and also makes it easier to debug and test
    the code. A function can return more than two values as well, as shown in Listing
    [6-6](#A458922_1_En_6_Chapter.html#Par41).


    ```

    1  function[y1,y2,y3] = fn2(x,y)

    2  y1 = x − y;

    3  y2 = x + y;

    4  y3 = y − x;

    5  endfunction

    Listing 6-6

    fn2.sci

    ```


    This gives the following result:


    ```

    1  −−−>exec(''/Users/sandeepnagar/.../fn2.sci'', −1)

    2  −−−>[a,b,c] = fn2(2,3)

    3  c =

    4  1.

    5  b =

    6  5.

    7  a =

    8  −1.

    ```


    Functions can incorporate loops to regulate the repetitive tasks inside the program.
    For example, the factorial of a number can be calculated using a function given
    in Listing [6-7](#A458922_1_En_6_Chapter.html#Par45).


    ```

    1  function result = factorial1(n)

    2    if(n == 0)

    3       result = 1;

    4       return;

    5    else

    6      result = prod(1:n);

    7    end

    8  endfunction

    Listing 6-7

    factorial1.sci

    ```


    A function named `factorial1`, which takes a number `n` as an argument, calculates
    the product of the number with all its successive numbers. When called from a
    Scilab command line, the function yields the following result:


    ```

    1  −−−>exec(''/Users/sandeepnagar/.../factorial1.sci'', −1)

    2  −−−>factorial1(10)

    3  ans =

    4  3628800.

    5  −−−>factorial1(10e5)

    6  ans =

    7  Inf

    ```


    ### 6.3.1 Inline Functions


    An inline function is a short function that can be defined without having to use
    the function skeleton discussed previously. This is useful only when the body
    of the function is short:


    ```

    1  −−−>deff(''[x] = mult(y,z)'',''x=y∗z'')

    2  −−−>mult(2,3)

    3  ans =

    4  6

    ```


    The built-in function `deff()` is used to define another built-in function. The
    first argument of `deff` defines the output variable (`x` in this case), function
    name (`mult`), and input variables (`y` and `z`). The second argument defines
    the body of the function (`x=y*z`). This kind of function is defined in a `.sce`
    file, just like a command, and thus does not need a separate loading action. Once
    defined, functions can be called by their function name along with input parameters.'
