- fmt: "## 2.2 Working with Scilab Files\n\nThe second method is to write a script\
    \ (in other words, a set of multiple commands) as a file. Scilab provides two\
    \ kinds of script files. Two formats, `.sci` and `.sce`, differentiate them explicitly:\n\
    \n- `.sci` files contain Scilab and/or user-defined functions.  \n  - The execution\
    \ of such files simply loads them in the Scilab environment but does not execute\
    \ them.\n- `.sce` files contain both Scilab functions and executable commands.\
    \ When these files are called, they are executed.\n\nHaving two types of files\
    \ is what differentiates Scilab from MATLAB. The distinction between a function\
    \ file and a file for execution is not present in MATLAB, where all files are\
    \ simply denoted by an `.m` extension.\n\nIn Listing [2-1](#A458922_1_En_2_Chapter.html#Par12),\
    \ we will write a Scilab file named `hello.sce` and run it. The file uses a similar\
    \ code to what we saw in Section 2.1, where we printed `Hello World!` at the command\
    \ prompt.\n\n```\n1  message = \"Hello World\"\n2  disp(message)\nListing 2-1\n\
    hello.sce\n```\n\nTo run this file, you can simply click the Play icon on the\
    \ menu bar in the `SciNotes` window. Alternatively, you can mention the full path\
    \ of the file to run it. If you are working in the same directory as that of the\
    \ file, you simply have to print the name of the file without mentioning its extension\
    \ within the command `exec()`.\n\nThe usual conventions of naming the files are\
    \ followed. The first letter should not be a special character or a numeric value,\
    \ and file names are case-sensitive. Keywords should be avoided when naming files.\
    \ It is also recommended that users should work in a single folder for a particular\
    \ project. The advantage of this approach is that to run programs, users only\
    \ need to write the name of the program instead of the full path of the file.\
    \ Also, it is easier to share the codes for executions because paths will differ\
    \ with different computers.\n\n## 2.3 Second Example: A Mathematical Calculation\n\
    \nYou can write the first program printing the string “Hello World!” by typing\
    \ the following at the command prompt:\n\n```\n1  −−>a = 2\n2  a =\n3  2.\n4 \
    \ −−>b = 3\n5  b =\n6  3.\n7  −−>a+b\n8  ans =\n9  5.\n10  −−>a−b\n11  ans =\n\
    12  −1.\n```\n\nFirst, the variable `a` is assigned to a numeric value, `2`. Even\
    \ though it was defined as an integer, it was treated as the floating point number\
    \ `2`, signifying the numeric value 2.0. Similarly, the variable named `b` is\
    \ stored as the numeric value 3.0. These values can then be used to perform calculations\
    \ using these variables. The word variable means that they can store various values.\
    \ At any instant of time, the values that they store will be used for calculations.\
    \ Hence, `a+b` is calculated as 2.0 + 3.0 = 5.0, and `a-b` is evaluated as 2.0\
    \ − 3.0 = −1.0. The variable named `ans` stores the value of the last evaluated\
    \ Scilab expression. These concepts are demonstrated in Listing [2-2](#A458922_1_En_2_Chapter.html#Par18).\n\
    \n```\n1  a = 2\n2  b = 3\n3  summing = a+b\n4  subtracting = a−b\n5  disp(summing)\n\
    6  disp(subtracting)\nListing 2-2\naddsub.sce\n```\n\nAlternatively, you can store\
    \ these commands by assigning values, calculating them, and then printing them\
    \ in a file, namely `addsub.sce`. You can run this file by typing `exec(addsub.sce)`.\
    \ You can also run the program by simply clicking the Play button in the menu\
    \ bar. The results can be seen in Scilab’s command prompt and found to match the\
    \ expectations.\n\nTo edit the contents of a file, you need to open the editor\
    \ (`SciNotes`). You can either open it using the icon provided at the top-left\
    \ corner of the menu card, or you can type `edit addsub.sce` at the command prompt.\
    \ A new window pops up where you can write the code and save it as `addsub.sce`\
    \ or a different name as desired. If you don’t define the format of the file as\
    \ `.sce`, Scilab gives if the format `.sci` since it treats the file as a Scilab\
    \ function.\n\nThe Scilab command prompt is represented by the symbol `-->` by\
    \ default. Scilab is an interpreted language with dynamically typed objects. This\
    \ implies that after entering a command at the command prompt, if the Enter key\
    \ is pressed on a keyboard, the command is executed. You can write the code one\
    \ line at a time and execute the same. The code executes well until an error is\
    \ presented.\n\nOne way to learn Scilab is to run demonstration programs. Click\
    \ the `?` symbol in the list the menu presents at the top of the main window.\
    \ Choose Demonstrations and click Introduction: Getting started with Scilab. Choose\
    \ the appropriate topic to learn the same. This approach requires users to structure\
    \ their learning experience themselves; thus, it is not recommended for the first-time\
    \ user. This book will help with this aspect since the learning structure has\
    \ been devised for the first-time user.\n\n### 2.3.1 Calculator\n\nBecause the\
    \ Scilab command prompt `executes` any expression at the command prompt, Scilab\
    \ effectively works as a calculator with mathematical operators including multiplication\
    \ (symbol is `*`), division (symbol is `/`), addition (symbol is `+`), subtraction\
    \ (symbol is `-`), and exponentiation (symbol is `^`):\n\n```\n1  −−>2+4.2\n2\
    \  ans =\n3  6.2\n4  −−>2+4\n5  ans =\n6  6.\n7  −−>2−4.2\n8  ans =\n9  − 2.2\n\
    10  −−>2∗4.2\n11  ans =\n12  8.4\n13  −−>2/4.2\n14  ans =\n15  0.4761905\n16 \
    \ −−>2ˆ4\n17  ans =\n18  16.\n```\n\nThis example shows that when a command is\
    \ fed at the command prompt `-->`, it is executed and the answer is given by displaying\
    \ the results in the next line as `ans =`.\n\n## 2.4 Formatting Command Prompt\
    \ Display\n\nThe display of numbers at the command prompt can be formatted in\
    \ two ways: in scientific notations (also known as exponent notation) or in normal\
    \ notations. This is done by issuing the command `format e`, which prints all\
    \ answers in scientific notation. At any point, if the command `format v` is issued,\
    \ variable adaptive formatting is chosen. Here Scilab chooses either the direct\
    \ representation or the exponential/engineering/scientific notation in order to\
    \ cope with each processed value, as well as with the required width, with a maximal\
    \ number of output digits. This behavior is shown in the following code:\n\n```\n\
    1  −−>format e\n2  −−>2/4.2\n3  ans =\n4  4.762D−01\n5  −−>format v\n6  −−>2/4.2\n\
    7  ans =\n8  0.4761905\n```\n\nWhen the `format()` function is used, it can take\
    \ two inputs—the mode and width of characters—to display. The width of numbers\
    \ denotes the number of output characters used. This includes the following:\n\
    \n- Sign of the mantissa\n- Its digits\n- Decimal separator\n- Exponent symbol\n\
    - Sign\n- Digits of the exponent\n\nThe default width is 10 and the minimal width\
    \ in `'e'` mode is 8. The following sample code explains this behavior:\n\n```\n\
    1  −−>format('e',10)\n2  −−>2/4.2\n3  ans =\n4  4.762D−01\n5  −−>format('e',20)\n\
    6  −−>2/4.2\n7  ans =\n8  4.7619047619048D−01\n9  −−>format('v',20)\n10  −−>2/4.2\n\
    11  ans =\n12  0.4761904761904762\n```\n\nWhen the `--> format('e',20)` command\
    \ is issued, 20 digits can be used to display the result so more digits get represented\
    \ on the screen. Displaying the result with more digits does not alter the storage\
    \ of the result. The result is stored with a precision of a fixed number of bits,\
    \ as we will discuss in Section 2.11.1. Merely its display is affected.\n\n##\
    \ 2.5 Operator Precedence\n\nWhen a number of operations needs to be performed,\
    \ the BODMAS rule is followed. Mathematical operations have a precedence order\
    \ as follows:\n\n- Any expression in brackets is solved first.  \n  - If brackets\
    \ further enclose brackets, the inner brackets are solved first and then the successive\
    \ outer brackets are solved.\n- Division\n- Multiplication\n- Addition\n- Subtraction\n\
    \nAs shown in the following code, placing brackets has an immediate effect in\
    \ calculations as brackets are solved first. Hence, we advise that longer mathematical\
    \ statements are enclosed in brackets appropriately:\n\n```\n1  −−>(2ˆ2)/3\n2\
    \  ans =\n3  1.3333333\n4  −−>2ˆ(2/3)\n5  ans =\n6  1.5874011\n```"
