    # 2.6 变量浏览器窗口


    一旦显示答案，变量浏览器窗口就会显示已创建一个名为 `ans` 的新变量，并且计算结果存储在此变量名下。`ans` 是 Scilab 的默认变量名。在编程过程中，所有变量及其值和类型都会显示在变量浏览器窗口中。


    双击变量名或其任何属性，会以图形界面打开相同的内容，界面类似于 Excel 表格。这是因为 Scilab 执行矩阵计算，因此将值存储为矩阵。单个值就是一个
    1 × 1 的矩阵（具有一行一列的矩阵）。当用户学习定义数组时，他们可以关联这样一个事实：变量会将值存储为一个 n × m 维矩阵，其中数据存储在 n 行和
    m 列中。除了这些二维数组，用户还可以定义多维数组。


    # 2.7 清除变量


    变量值存储在特定的内存位置。命令 `clear` 会清除这些变量，除非它们受到保护。受保护的变量是标准库和带有百分号前缀的变量。一旦你在命令提示符下输入 `clear`，你就能看到变量浏览器中所有值和信息都被清除了。


    如果已经定义了三个变量 `a`、`b` 和 `c`，可以通过发出命令 `clear a` 来选择性地清除它们，这样只有名为 `a` 的变量被清除，另外两个则保持不变。函数
    `isdef()` 用于检查变量是否存在。清单 2-3 说明了这一点。


    ```

    1  disp("定义三个变量 a、b、c")

    2  a = 10;

    3  b = 12.2;

    4  c = a∗b;

    5  disp("检查变量是否已被定义为 a、b、c")

    6  disp(isdef("a"))

    7  disp(isdef("b"))

    8  disp(isdef("b"))

    9  disp("清除变量 a 之后")

    10  clear a

    11  disp(isdef("a"))

    12  disp(isdef("b"))

    13  disp(isdef("b"))

    清单 2-3

    clear.sce

    ```


    执行时（通过输入 `exec(clear.sce)`），会产生以下输出：


    ```

    1  −−>exec(''clear.sce'')

    2  −−>disp("定义三个变量 a、b、c")

    3  定义三个变量 a、b、c

    4  −−>a = 10;

    5  −−>b = 12.2;

    6  −−>c = a∗b;

    7  −−>disp("检查变量是否已被定义为 a、b、c")

    8  检查变量是否已被定义为 a、b、c

    9  −−>disp(isdef("a"))

    10  T

    11  −−>disp(isdef("b"))

    12  T

    13  −−>disp(isdef("b"))

    14  T

    15  −−>disp("清除变量 a 之后")

    16  清除变量 a 之后

    17  −−>clear a

    18  −−>disp(isdef("a"))

    19  F

    20  −−>disp(isdef("b"))

    21  T

    22  −−>disp(isdef("b"))

    23  T

    ```


    # 2.8 注释


    所有编程语言都旨在鼓励程序员在程序的期望位置添加注释，以便程序能够被人类理解。Scilab 使用双斜杠（`//`）来实现此目的。注释前面的任何内容都不会被解释器执行。注释用作解释信息流向的文本，并用于在程序的特定位置标记信息。


    为了更好的理解，为每一行相关代码编写注释是一种良好的实践。如果代码由多人共享，这一点尤其重要。最终用户可以通过阅读注释来理解变量的用法以及计算背后的逻辑。


    # 2.9 预定义常量


    科学计算需要一些经常使用的预定义常量。它们前面带有 `%` 符号，如清单 2-4 所示。


    ```

    1  disp("pi 的值：")

    2  disp(%pi)

    3  disp("eps 的值：")

    4  disp(%eps)

    5  disp("无穷大的值：")

    6  disp(%inf)

    7  disp("e 的值：")

    8  disp(%e)

    9  disp("虚数 i 的值：")

    10  disp(%i)

    11  disp("布尔值 True 的值：")

    12  disp(%t)

    13  disp("布尔值 False 的值：")

    14  disp(%f)

    15  disp("非数字变量即 nan 的值：")

    16  disp(%nan)

    清单 2-4

    constants.sce

    ```


    执行时（通过输入 `exec(constants.sce)`），会产生以下输出：


    ```

    1  pi 的值：

    2  3.1415927

    3  eps 的值：

    4  2.220D−16

    5  无穷大的值：

    6  Inf

    7  e 的值：

    8  2.7182818

    9  虚数 i 的值：

    10  i

    11  布尔值 True 的值：

    12  T

    13  布尔值 False 的值：

    14  F

    15  非数字变量即 nan 的值：

    16  Nan

    ```


    许多物理常量是预定义的：


    - `pi`

    - `e`（欧拉数）

    - `i` 是虚数 `$$ =\sqrt{-1} $$`

    - `inf`（无穷大 = ∞）

    - `NaN`（非数字——由未定义操作产生，例如 `Inf/Inf`）和 `eps`，其定义为 2^(−52)


    ## 2.9.1 常用数学函数


    Scilab 中存在许多预定义的数学函数。以下是一些示例：


    - 绝对值：`abs()` 返回参数的正值

    - 对数：自然对数 `log()`，以 10 为底的对数 `log10()`

    - 三角函数：`sin()`、`cos()`、`tan()`（参数以弧度为单位。）

    - 反三角函数：`asin()`、`acos()`、`atan()`


    ```

    1  −−>abs(%i) // sqrt(−1) 的绝对值

    2  ans =

    3  1.

    4  −−>abs(%pi) // pi 的绝对值

    5  ans =

    6  3.1415927

    7  −−>abs(−%pi)

    8  ans =

    9  3.1415927

    10  −−>log(10) // 以 e 为底的对数值

    11  ans =

    12  2.3025851

    13  −−>log(−10)

    14  ans =

    15  2.3025851 + 3.1415927i

    16  −−>log(%e)

    17  ans =

    18  1.

    19  −−>log(−%e)

    20  ans =

    21  1\. + 3.1415927i

    22  −−>log10(10) // 以 10 为底的对数值

    23  ans =

    24  1.

    25  −−>log10(−10)

    26  ans =

    27  1\. + 1.3643764i

    28  −−>sin(45) // 正弦值

    29  ans =

    30  0.8509035

    31  −−>sin((45∗%pi)/180) // 参数转换为度

    32  ans =

    33  0.7071068

    34  −−>sqrt(2) // 平方根

    35  ans =

    36  1.4142136

    37  −−>acos(1) // 反余弦

    38  ans =

    39  0.

    ```


    使用这些函数和运算符可以轻松执行复数计算，如清单 2-5 所示。


    `$$ \sqrt{\mathit{\sin}{(10)}²+\mathit{\cos}{(10)}²} $$`


    ```

    1  theta = 10; // 此处 Theta 取值为 10

    2  s = sin(theta);

    3  s_sq = sˆ2;

    4  c = cos(theta);

    5  c_sq = cˆ2;

    6  result = sqrt(s_sq + c_sq); // 名为 "result" 的变量存储计算结果

    7  disp(result)

    清单 2-5

    complexCal.sce

    ```


    结果显示为 1，这符合三角恒等式：


    `$$ \sqrt{\mathit{\sin}{\left(\theta \right)}²+\mathit{\cos}{\left(\theta \right)}²}=1
    $$`


    # 2.10 变量


    变量用于在计算机内存位置临时存储值。它们实际上是对存储数据的内存位置的引用。它们使用字母数字符号或一组称为字符串的符号来寻址。Scilab 代码 `complexCalc.sce`（见第
    2.9.1 节）中给出了这种方法的一个示例，其中数值 10 存储在名为 `theta` 的变量中。然后计算 sin(`θ`) 并将其存储在名为 `s` 的变量中。类似地，cos(`θ`)
    存储为 `c`。它们各自的平方存储在名为 `s_sq` 和 `c_sq` 的变量中。最后，一个名为 `result` 的变量存储了计算 `$$ \sqrt{\mathit{\sin}{\left(\theta
    \right)}²+\mathit{\cos}{\left(\theta \right)}²} $$` 的结果，并且使用这个变量名来打印计算的最终答案。使用这种方法的主要优点是，变量值的分配是一个动态过程。如果用户将变量
    `theta` 的值从 10 改为 5，该值在调用此变量的所有位置都会发生变化。

    '
- fmt: '### 2.10.1 Assignment Operator =


    The symbol `=` works as an assignment operator that assigns the value present
    on the right-hand side to the variable name on the left-hand side. In mathematics,
    the symbol is used to equate two sides of an equation, but in Scilab, the symbol
    is used for assigning values. The equivalent of a mathematical symbol for equality
    is the symbol `==`, which checks the equality of data value for quantities on
    both sides:


    ```

    1  −−>1==2

    2  ans =

    3  F

    4  −−>1==1.0

    5  ans =

    6  T

    7  −−>a=1

    8  a =

    9  1.

    10  −−>b=2

    11  b =

    12  2.

    13  −−>a==b

    14  ans =

    15  F

    ```


    In this case, ![ $$ 1\ne 2 $$ ](A458922_1_En_2_Chapter_IEq3.gif). Hence, the result
    is the boolean value `F`, signifying `false`. The numerical values of 1 and 1.0
    are the same, so when their equality is probed, you obtain `T`, signifying the
    expression is evaluated to be `True`. Variables can also be used for evaluation.
    In this case, the latest value stored in a variable is used for evaluation, and
    the result is declared as a boolean value.


    Multiple assignments can be performed by using the comma (`,`) operator. Also,
    if we do not wish to produce the results on screen, we can suppress this by using
    the `;` operator:


    ```

    1  −−>a1=10, a2=20, a3=30

    2  a1 =

    3  10.

    4  a2 =

    5  20.

    6  a3 =

    7  30.

    ```


    Printing output can be suppressed using the `;` operator in front of the command.
    In the following case, the assignment for `a3` is not produced on the terminal
    since it is suppressed with the `;` operator. In the second case, all outputs
    are suppressed:


    ```

    1  −−>a1=10, a2=20, a3=30;

    2  a1 =

    3  10.

    4  a2 =

    5  20.

    6  −−>a3

    7  a3 =

    8  30.

    9  −−>a1=10; a2=20; a3=30;

    10  −−>

    ```


    Note that the only printing of the output at the terminal is suppressed, but the
    assignment operation is unaffected by the `;` operator. It can still be accessed
    as shown by the second command at the terminal.


    ### 2.10.2 Naming Conventions for Variables


    There are some naming conventions for variables names that must be respected to
    avoid errors:


    * Names should not start with a number; however, numbers can be used anywhere
    afterward.

    * Variable names are case-sensitive.

    * Keywords cannot be used as names.

    * Names can include underscore (`_`) but cannot include a whitespace.


    ### 2.10.3 Global and Local Variables


    A variable declared globally within the main program is known as a global variable,
    whereas a variable declared locally within a function is known as local variable.
    Global variables are available to all functions, while local variables are available
    only for particular functions. They are defined using a `global` declaration statement.
    Once defined, they remain the same irrespective of any new definition unless the
    `clear` command is issued for clearing variable names and values from the memory.
    Another command, `clearglobal`, performs the task of killing global variables
    selectively. To check if a variable is global, users can use the `isglobal()`
    function.


    Global variables are used to define constants during numerical calculations. Suppose
    we wish that all variables except a select few should change values. We then name
    those unchanging values to be global variables by giving the name of our choice.
    The predefined variables such as `%pi` and `%e` have been defined in a similar
    manner.


    ### 2.10.4 List of Variables


    A list of all variables can be obtained by the commands `who` and `whos` where
    `who` simply presents the list of variables in the workspace and `whos` presents
    the same with more details such as the size of the variable, the number of bytes
    used to store the variable, and the variable type. `who(''local'')` or `who(''get'')`
    returns current variable names and the memory used in double precision words.
    `who(''global'')` returns global variable names and the memory used in double
    precision words. `who(''sorted'')` displays all variables in alphabetical order.
    By using `who` and `whos`, you can keep track of memory requirements judiciously.
    This is critical in memory- and speed-starved systems like Raspberry Pi.


    ## 2.11 Data Types


    While assigning data to a variable, it is important to understand that data can
    be defined as a variety of an object defined by its data type. The command `help(type)`
    gives detailed documentation about various data types.'
