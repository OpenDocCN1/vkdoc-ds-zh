    Here the matrix `a` has elements 1`,` 2`,` 3 in the first row and then a row separator
    `;` defines the next row of elements 4`,` 5`,` 6\. Similarly, matrix `B` is defined
    by rows defined by commands:


    *   (1 : 3), which results in (1, 2, 3)

    *   (4 : 6), which results in (4, 5, 6)

