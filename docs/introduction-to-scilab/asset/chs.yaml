  \n\n### 4.2.3 `polarplot()`\n\n在数学分析中，当某些情况在笛卡尔坐标系中不表现出对称性，但在极坐标系中却表现出对称性时，极坐标就变得重要起来。在这些情况下，我们更倾向于使用极坐标而非笛卡尔坐标进行绘图。因此，我们的坐标不再是\
  \ `x`、`y`，而是 `r`、`θ`，它们通过方程相互关联，如图 4-6 和 4-7 所示。\n\n![A458922_1_En_4_Fig7_HTML.gif](img/A458922_1_En_4_Fig7_HTML.gif)\n\
  \n图 4-7\n`sin(x)` 和 `cos(x)`\n\n![A458922_1_En_4_Fig6_HTML.gif](img/A458922_1_En_4_Fig6_HTML.gif)\n\
  \n图 4-6\n`sin(x)` 和 `cos(x)`\n\n`x = r × cos(θ)`\n`y = r × sin(θ)`\n\n由 `polarplot.sce`\
  \ 提供的代码绘制了这样一个示例，如代码清单 4-5 所示。结果如图 4-8 所示。\n\n![A458922_1_En_4_Fig8_HTML.gif](img/A458922_1_En_4_Fig8_HTML.gif)\n\
  \n图 4-8\n极坐标图\n\n```\n1  // 使用 polarplot 函数绘图的程序\n2  theta= 0:.01:3∗%pi;\n3  polarplot(sin(2∗theta),\
  \ cos((2∗theta)))\n4  xtitle('使用 polarplot 函数')\n代码清单 4-5\npolarplot.sce\n```\n\n\
  ## 4.3 特殊图表\n\n### 4.3.1 直方图\n\n直方图传统上用于可视化不同范围内发生的事件数量。Scilab 为此提供了一个有用的函数 `histplot()`，它接收表示区间数量的输入和以数组形式提供的数据。例如，在代码清单\
  \ 4-6 中名为 `hist.sce` 的代码中，随机数的归一化分布图如图 4-9 所示。\n\n![A458922_1_En_4_Fig9_HTML.gif](img/A458922_1_En_4_Fig9_HTML.gif)\n\
  \n图 4-9\n直方图\n\n```\n1  // 绘制直方图的程序\n2  n = rand(1,10e4,'normal');   // 归一化高斯随机样本\n\
  3  bins=20\n4  histplot(bins,n)\n5  title('绘制随机数的直方图')\n6  xlabel('x')\n7  ylabel('y')\n\
  代码清单 4-6\nhist.sce\n```\n\n直方图用于展示采样数据。从数据集中，我们可以根据数据点的值将其划分到指定数量的区间中，并可视化哪些值域占主导地位。这提供了关于系统的有用信息。例如，遵循正态分布的值代表了那些总是遵循某种统计规律的系统。在图\
  \ 4-9 所示的当前示例中，大部分数据事件发生在中间区域。如果此图表示在两个原子之间找到电子的概率，那么我们可以得出结论，电子主要被发现于两个原子的中间。如果此图表示班级学生获得的成绩，那么我们可以推断，获得非常好或非常差（图的两端）成绩的学生很少，而大多数学生的成绩接近\
  \ 50%。\n\n### 4.3.2 `matplot`\n\n为了绘制代表特定值的颜色，使用 `matplot` 命令，如代码清单 4-7 所示，并在图 4-10\
