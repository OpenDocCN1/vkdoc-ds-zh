  \n图 8-8\n\n显示弹球动画的窗口截图\n\n## 8.6 XCOS 菜单栏\n\n在本节中，我们将介绍 XCOS 的菜单栏，以便初学者能高效地导航他们的工作流程。XCOS\
  \ 菜单栏位于 XCOS 窗口的顶部。快捷键显示在命令旁边，此处也已提及。大多数情况下，这些键使用键盘上的 `Control` 键，用 `Ctrl` 表示。当需要同时按键时，组合键会用加号显示在中间。例如\
  \ `Ctrl+N` 表示同时按下 `Control` 键和 `N` 键。\n\n\n\n*   **文件**\n    *   `新建` (`Ctrl+N`):\
  \ 该菜单项会在新窗口中打开一个新的空白 Xcos 图表。\n    *   `打开` (`Ctrl+O`): 该菜单项用于加载包含已保存框图或模块库的 XML\
  \ 文件 (`.zcos`) 或二进制文件 (`.cos`)。此命令会打开一个对话框，允许您选择文件夹和文件。\n    *   `保存` (`Ctrl+S`):\
  \ 选择 `保存` 菜单项可将图表保存为 XML 文件。首次执行此操作或未使用过`另存为`菜单项时，对话框会允许您选择目录并指定不带扩展名的文件名。默认扩展名为\
  \ `.zcos`。图表将采用文件名（不带扩展名）作为其名称。\n    *   `另存为` (`Ctrl+Shift+S`): 该菜单项用于将框图或模块库以新名称保存到文件中。对话框允许指定不带扩展名的文件名和保存文件夹。默认扩展名为\
  \ `.zcos`。图表将采用文件名（不带扩展名）作为其名称。\n    *   `导出` (`Ctrl+E`): 该菜单项用于导出当前 XCOS 图表图形。可导出为\
  \ `wbmp`、`gif`、`html`、`JPEG`、`JPG`、`png`、`svg` 和 `vml` 格式。\n    *   `最近文件`: 该菜单项允许快速访问最近打开过的文件。\n\
  \    *   `打印` (`Ctrl+P`): 该菜单项将当前图表打印到打印机上。\n    *   `关闭` (`Ctrl+W`): 当打开多个图表时，该菜单项关闭当前图表。\n\
  \    *   `退出` (`Ctrl+Q`): 该菜单项将关闭 XCOS。\n*   **编辑**\n    *   `撤销` (`Ctrl+Z`): 选择\
  \ `撤销` 菜单项可撤销上一步的编辑操作，以纠正错误。\n    *   `重做` (`Ctrl+Y`): 选择 `重做` 菜单项可重做上一步被撤销的编辑操作。\n\
  \    *   `剪切` (`Ctrl+X`): 该菜单项用于从图表中移除选中的对象，并将其复制到剪贴板。剪切一个模块时，与其连接的所有连线也将被删除。\n\
  \    *   `复制` (`Ctrl+C`): `复制` 用于将选中项的副本放入剪贴板。\n    *   `粘贴` (`Ctrl+V`): `粘贴` 将剪贴板中的内容放入当前图表。\n\
  \    *   `删除` (`Delete`): 要删除模块或连线，先选中要删除的对象，然后选择 `删除` 菜单项。删除一个模块时，与其连接的所有连线也将被删除。\n\
  \    *   `全选` (`Ctrl+A`): 该菜单项选中当前图表中的所有模块。\n    *   `反选`: 该菜单项反转当前的选择状态。\n    *\
  \   `模块参数` (`Ctrl+B`): 该菜单项为当前选中的模块打开模块配置对话框。配置取决于所使用的模块（请参阅 `模块帮助` 菜单项以获取关于其配置的更多信息）。\n\
  \    *   `选中项转为超模块`: 该菜单项将选中的一组模块转换为一个超模块。\n*   **视图**\n    *   `放大` (`Ctrl+加号`):\
  \ 选择此菜单项时，图表将放大 10%。\n    *   `缩小` (`Ctrl+减号`): 选择此菜单项时，图表将缩小 10%。\n    *   `适合窗口`:\
  \ 选择此菜单项时，图表将适应当前窗口的大小。\n    *   `正常 100%`: 该菜单项将图表组件调整为其正常显示尺寸。\n    *   `模块库浏览器`:\
  \ 该菜单项打开模块库浏览器。\n    *   `图表浏览器`: 该菜单项显示一个窗口，其中列出了图表的全局属性及其所有对象（模块和连线）。\n    * \
  \  `视口`: 该菜单项显示视口窗口。使用视口，您可以将工作区移动到图表的某一部分。您可以放大或缩小图表的各个部分。\n    *   `详情`: 选中一个模块后，该菜单项会显示一个窗口，列出该模块的属性。\n\
  *   **仿真**:\n    *   `设置`: 在主 XCOS 窗口中，点击 `设置` 菜单项会调用对话框，允许更改控制参数。\n    *   `执行跟踪与调试`:\
  \ 该菜单项将 XCOS 设置为调试模式。它会打开一个对话框，您可以在其中选择调试模式。\n    *   `设置上下文`: 通过此菜单项，您可以打开一个对话框，在其中输入\
  \ Scilab 指令以定义模块定义中使用的符号化 XCOS 参数。每次加载图表时都将评估这些指令。如果您在上下文中更改了某个符号化 XCOS 参数的值，点击\
  \ `确定` 后，所有包含此符号化参数的模块都将更新。\n    *   `编译`: 该菜单项编译框图。通常无需使用此功能，因为编译是自动完成的。通常，如果只修改了系统参数和内部状态，则无需新编译。\n\
  \    *   `Modelica 初始化`: 该菜单项为 Modelica 编译器打开一个特定对话框，您可以在其中查看绘制模型的组件，并选择求解器。\n \
  \   *   `启动`: 该菜单项启动仿真。如果系统已经仿真过，会弹出一个对话框，您可以在其中选择继续、重新启动或结束仿真。\n    *   `停止`: 您可以通过点击\
  \ `停止` 菜单项来中断仿真。可以更改模块参数，然后再次继续仿真。\n*   **格式**:\n    *   `旋转` (`Ctrl+R`): `旋转` 允许您将模块向左旋转\
  \ 90°。旋转会影响所有选中的模块。\n    *   `翻转` (`Ctrl+F`): 要反转模块顶部和底部的使能输入输出位置，请选中一个模块并选择 `翻转`\
  \ 菜单项。这不会影响输入和输出事件端口的顺序和位置，其编号从左到右。翻转会影响所有选中的模块。\n    *   `镜像` (`Ctrl+M`): 要反转模块左侧和右侧的（常规）输入输出位置，请选中一个模块并选择\
  \ `镜像` 菜单项。这不会影响输入和输出端口的顺序和位置，其编号从上到下。镜像会影响所有选中的模块。\n    *   `显示/隐藏阴影`: 该菜单项允许您为选中的模块和相关参数选择\
  \ 3D 形状。\n    *   `对齐模块`: 当您选择多个模块时，可以将其在水平轴（顶部、底部和中间）或垂直轴（左侧、右侧、中心）上对齐。\n    *\
  \   `边框颜色`: 该菜单项允许您更改选中模块的边框颜色。\n    *   `填充颜色`: 该菜单项允许您更改选中模块的填充颜色。\n    *   `自动定位`:\
  \ 该菜单项允许您更改模块的位置。首先选中一个或多个模块，然后选择相应的菜单项或使用快捷键 (`P`)。\n    *   `连线样式`: 该菜单项允许您更改连线的样式。首先选中连线，然后选择相应的菜单项或使用快捷键\
  \ (`H`)、(`S`)、(`V`) 和 (`O`)。\n    *   `图表背景`: 该菜单项允许您更改背景颜色。\n    *   `网格`: 该菜单项允许您激活/停用网格。使用网格，模块和连线在工作区上的放置更容易，并且可以获得更易读的图表。\n\
  *   **帮助**\n    *   `Xcos 帮助` (`F1`): 该菜单项在 XCOS 帮助章节打开主帮助浏览器（如果尚未打开）。\n    *  \
  \ `模块帮助`: 要获取 XCOS 模块的帮助，请选中该模块，然后点击此菜单项。\n    *   `XCOS 演示`: 该菜单项允许您打开一些 XCOS 图表示例。\n\
  \    *   `关于 XCOS`: `关于 XCOS` 项在一个对话框中显示 XCOS 的当前版本。\n\n\n\n## 8.7 从零复现弹球示例\n\n\
  作为示例，我们尝试从零复现前面讨论过的弹球示例。首先，在 XCOS 调色板窗口的左侧窗格中选择 `演示模块` 选项。点击该选项后，会显示三个模块，如图 8-9\
  \ 所示。本示例展示了一个 XCOS 仿真，用于可视化三个彩色球体在其环境墙壁上的弹跳过程。其中一个模块 `Bounce` 生成输入，另一个模块 `BounceXY`\
  \ 生成输出。因此，前者在其右侧有两个输出端口，而后者在其左侧有两个输入端口。\n\n![A458922_1_En_8_Fig9_HTML.jpg](img/A458922_1_En_8_Fig9_HTML.jpg)\n\
  \n**图 8-9**  \n弹球示例的 XCOS 屏幕截图\n\n现在，我们将标题为 `Bounce` 和 `BounceXY` 的模块拖放到 XCOS 编辑器窗口中。模块\
  \ `Bounce` 有两个输出选项，而 `BouncyXY` 有两个输入选项。`BounceXY` 模块实际上还有第三个用于定时器的端口。定时器模块可以从 `事件处理`\
  \ 部分获取。当这三个模块都被拖放到编辑器窗口后，你会看到与图 8-9 类似的界面。\n\n一旦你点击了 `Bounce` 模块的某个输出，其周围会高亮显示一个小绿色方块。可以点击并拖动连接线，直到到达\
  \ `BouncyXY` 模块的输出端，从而建立连接。你还需要一个定时模块，它控制此仿真的定时参数。这可以在调色板窗口左侧窗格的 `事件处理` 部分找到。\n\n\
  现在，这三个模块可以连接起来，形成一个连接的示意图，如图 8-10 所示。\n\n![A458922_1_En_8_Fig10_HTML.jpg](img/A458922_1_En_8_Fig10_HTML.jpg)\n\
  \n**图 8-10**  \n名为“事件处理”的 XCOS 调色板窗口部分\n\n你可以将此仿真保存为一个名称，例如 `BouncingBalls.zcos`\
  \ 文件。然后可以通过点击 `启动` 按钮来运行此仿真。与 8.8 节中的仿真模型不同，此处你只会观察到两个球体快速弹跳。\n\n可以通过右键点击模块并选择 `模块参数`\
  \ 来更改模块的属性。例如，对于当前仿真中的所有三个模块，你可以看到一系列参数（如图 8-12、8-13 和 8-14 所示）可以被更改以运行仿真。\n\n![A458922_1_En_8_Fig14_HTML.jpg](img/A458922_1_En_8_Fig14_HTML.jpg)\n\
  \n**图 8-14**  \n更改“CLOCKc”模块的参数\n\n![A458922_1_En_8_Fig13_HTML.jpg](img/A458922_1_En_8_Fig13_HTML.jpg)\n\
  \n**图 8-13**  \n更改“BOUNCEXY”模块的参数\n\n![A458922_1_En_8_Fig12_HTML.jpg](img/A458922_1_En_8_Fig12_HTML.jpg)\n\
  \n**图 8-12**  \n更改“弹球”模块的参数\n\n![A458922_1_En_8_Fig11_HTML.jpg](img/A458922_1_En_8_Fig11_HTML.jpg)\n\
  \n**图 8-11**  \n从零搭建的弹球示意图的 XCOS 屏幕截图\n\n## 8.8 使用 XCOS 进行仿真\n\n仿真可以证明是教学和快速制作科学模拟的一个非常强大工具。由于它们本质上是图形化的，问题设计起来非常直观。在教学时，你可以先避免涉及定义代码的技术部分。此外，动画在视觉上也很有吸引力。\n\
  \n由于本章的主要任务是演示 XCOS 最基本的用法，因此省略了所有模块用法的介绍。鼓励用户根据需要探索其他模块。每个仿真模型都有不同的需求，但可以遵循如下类似模式：\n\
  \n- 将物理问题分解为更小的模块\n  - 每个模块必须根据明确定义的输入 + 操作 + 输出来定义要执行的特定任务。\n- 定义每个模块的输入和输出\n \
  \ - 根据通道数量、每个通道的数据类型、数据频率等定义每个模块的性质。\n- 选择符合这些要求的 XCOS 模块，并根据模型要求连接它们。\n- 根据需要更改模块的属性来调整模型。\n\
  \n非常复杂的模型需要定义超级模块。超级模块是一个功能完整的 XCOS 图，可以进一步作为一个单一的模块，并用于其他的仿真图中。通过这种方式，你可以将更大的问题分解为模块及其子模块。这种模块化方法便于调试，前提是所有模块都标记良好，并且开发者充分了解特定模块的能力。\n\
  \n## 8.9 总结\n\n在本章中，我们讨论了使用 Scilab 附带的 XCOS 模块。它提供了以图形方式编程物理问题的能力。物理问题必须分解成代码片段。这些模块必须明确定义输入和输出端口，并且其用途应作为代码开发过程的一部分，前提是开发者知道要查找哪个模块、在哪里查找以及如何使用它。每个模块的文档都非常详尽，可以通过\
  \ `帮助` 窗口找到。通过这最后关于 XCOS 的一章，我们对 Scilab 的介绍就结束了。\n\n## 索引\n\nA  \n二维动画  \n`comet()`\
