  *   `Undo`：撤销上一步执行的操作。此操作可以连续进行。\n*   `Redo`：在执行 `Undo` 操作后恢复之前的状态。此操作也可以连续进行。\n\
  *   `Fit diagram or blocks to view`：有时制作图示所需的区域会超出屏幕范围，此窗口会出现滚动条。使用此按钮，可使整个图示适配窗口大小。\n\
  *   `Start`：启动一个仿真\n*   `Stop`：停止一个仿真\n*   `Zoom in`：放大图示视图\n*   `Zoom out`：缩小图示视图\n\
  *   `Xcos Demonstrations`：运行一些基本演示\n*   `Help`：寻求关于 XCOS 命令的帮助，你可以在此输入查询内容，然后被引导至有用且相关的文档\n\
