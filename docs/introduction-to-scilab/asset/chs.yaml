  10  −−>2/4.2\n11  ans =\n12  0.4761904761904762\n```\n\n当发出 `--> format('e',20)`\
  \ 命令时，可以使用 20 位数字来显示结果，因此屏幕上会显示更多数字。显示更多位数的结果并不会改变结果的存储方式。结果是以固定位数的精度存储的，我们将在第 2.11.1\
  \ 节中讨论。只有其显示方式受到了影响。\n\n## 2.5 运算符优先级\n\n当需要执行多个运算时，遵循 BODMAS 规则。数学运算的优先级顺序如下：\n\
  \n- 括号内的任何表达式最先求解。\n  - 如果括号内还有括号，则先求解最内层的括号，然后依次求解外层的括号。\n- 除法\n- 乘法\n- 加法\n- 减法\n\
  \n如下面代码所示，放置括号会立即对计算产生影响，因为括号内的内容会先被求解。因此，我们建议将较长的数学语句适当地用括号括起来：\n\n```\n1  −−>(2ˆ2)/3\n\
  2  ans =\n3  1.3333333\n4  −−>2ˆ(2/3)\n5  ans =\n6  1.5874011\n```\n\n\n\n## 2.6\
