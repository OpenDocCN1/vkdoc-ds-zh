- '# 3D 直方图


  与二维直方图类似，三维直方图提供了关于具有二维依赖关系的数据分组的直观线索。3D 可视化以垂直实心条的形式呈现，如清单 4-24 所示。


  ```

  // 制作 3D 直方图的程序


  hist3d(5∗rand(10,10));

  hist3d(−5∗rand(10,10));

  title(''3D 直方图'')

  清单 4-24

