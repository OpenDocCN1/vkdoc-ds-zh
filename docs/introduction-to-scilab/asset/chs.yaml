- '# 1. Scilab 简介


  ## 1.1 数值计算简介


  数值计算是数学领域的一个分支，其目标是在计算设备上解决问题。为此，存在多种软件工具。事实上，`MATLAB`、`Mathematica`、`Octave` 和
  `Scilab` 都是专门用于此目的的软件。开发者也可以使用通用编程语言（例如 `C`、`C++`、`Python` 和 `Julia`）来定义数学问题，但专业软件提供了预定义的库，这些库要么针对稳定性进行了优化，要么针对速度进行了优化，有时甚至两者兼顾。它们还可以针对所选的硬件平台在目标硬件上生成。因此，使用专业软件是轻松学习物理问题数值方法的好方法。但首要的问题是，我们究竟为什么要寻求数值解法。


  战后时代见证了计算技术以及用于特定目的的配套软件开发取得了巨大进步。成本效益高的计算资源使得模拟几乎所有物理问题成为可能。因此，数值计算已发展成为数学的一个独立领域，它不断从数学的其他领域汲取养分并做出贡献，为基于模型的物理现实模拟创造了一个计算资源生态系统。


  对数值计算的需求源于推导问题解析解的困难性。解析解始于一个超级简化的物理现实版本。然后通过增加复杂性并为控制方程定义附加参数来完善此类解。但大多数情况下，仅仅定义问题的努力就会呈指数级增长，以至于即使拥有一个团队也难以应对，更不用说单个人了。因此，对替代方法的需求变得显而易见，数值计算应运而生。


  虽然解析计算只需要铅笔、纸和人脑，但数值计算则需要计算设备或计算机。成功利用计算设备解决涉及大量数据点的问题（尤其是涉及重复性任务的问题）最早出现在许多科学和工程领域，例如破译敌方密码以及在核爆炸前模拟核反应。数值计算的应用范围进一步扩展到民用领域。设计模拟水道、水坝、发电站和城市道路只是应用了类似技术的工程领域的几个例子。所有这些应用都需要为表示物理问题的物理模型求解一个或多个方程。


  我们有两种方法可以求解这些方程——即使用解析方法和实施数值技术。本书中，我们将只专注于求解方程的数值方法。


  随着时间的推移，各种定义解析函数（如微分、积分和三角函数）的方案被编写出来用于数字计算机。这涉及它们的数字化，这必然会引入一些误差。了解引入的误差及其适当的消除方法，能够比解析结果更快地提供有价值的信息。因此，它成为科学研究中最活跃的领域之一，并且至今仍是如此。对更快、更精确算法的追求持续推动着数值计算领域的创新，使人类能够模拟原本不可能完成的任务。


  ## 1.2 各种软件替代方案


  执行数值计算有多种选择。为处理数学函数而编写的编程语言，如 `FORTRAN`、`C`、`Python` 和 `Java`，可用于编写数值计算的算法。还存在一套专业软件，包括
  `MATLAB`、`Scilab` 和 `Mathematica`。它们丰富的库现在已占用数 GB 的数据。自 1984 年以来，`MATLAB` 在科学界一直非常受欢迎。数字计算资源的廉价可用性，使其在工业界和学术界的应用达到了几乎每个实验室都需要
  `MATLAB` 的程度。尽管对于相对富裕的西方世界来说，它并不非常昂贵，但对于世界其他地区，特别是第三世界国家来说，它却是一款昂贵的软件。而世界这片土地拥有丰富的科学家资源，需要
  `MATLAB` 的开源替代品。`Octave` 和 `Scilab` 的出现解决了这个问题。`Scilab` 非常强大，但其语法设计并不完全与 `MATLAB`
  相同。另一方面，`Octave` 的开发目标是使 `MATLAB` 的 `.m` 文件可以直接在 `Octave` 上运行。`Scilab` 现在正为那些希望将工作完全迁移到开源平台，但不介意在必要时编辑其
  `MATLAB` 文件的开发者而开发。


  与包含各个工程领域专业包和用于图形化编程范式的 `Simulink` 的 `MATLAB` 软件包相比，`Octave` 提供的解决方案种类有限。它包含了 `MATLAB`
  基本包和某些专业包中几乎所有的函数，但并未提供与 `Simulink` 等价的功能。另一方面，`Scilab` 被证明是一个完整的替代方案，因为 `Scilab`
  的 `XCOS` 提供了与 `Simulink` 等价的功能，并且 `Scilab` 的专业包可以与 `MATLAB` 提供的功能相媲美。本书中，我们将介绍它们的基本用法。


  其他替代方案包括诸如 `Python`、`C`、`C++` 和 `Java` 等编程语言。它们各有优缺点，因此我们建议用户根据自己的需求进行选择。`Scilab`
  是快速构建问题原型并检查结果的不错选择。而在处理基于 Web 的数据收集、分析和可视化，以及在物理计算平台（如 `FPGA` 板、微控制器等）上实现物理问题时，通用编程语言则是更好的选择。`Scilab`
  是一种高级语言，主要用于数值计算，拥有丰富的工具库，可用于解决数值线性代数问题、求非线性方程的根、积分普通函数、处理多项式以及求解常微分方程、偏微分方程和微分代数方程。这使得它适用于大多数基本的数值计算工作。




  ## 1.3 历史


  Scilab 的创建历史始于 20 世纪 80 年代。其灵感来源于克利夫·莫勒（Cleve Moler）开发的 MATLAB Fortran 代码。莫勒后来与约翰·利特尔（John
  Little）共同创立了 MathWorks 公司。Scilab 最初以 Blaise 之名起步，是一款 CACSD（计算机辅助控制系统设计）软件。它由弗朗索瓦·德勒贝克（François
  Delebecque）和塞尔日·斯蒂尔（Serge Steer）在 IRIA（法国信息与自动化研究所）创建。1984 年，Blaise 更名为 Basile，并由
  Simulog（法国国家信息与自动化研究所的首家初创公司）分发数年。


  20 世纪 90 年代，Simulog 停止分发 Basile。法国国家信息与自动化研究所将软件更名为 Scilab，并仅由六名研究人员继续开发。Scilab
  1.1 于 1994 年 1 月 2 日以开源许可证发布。直到 2.7 版本，Scilab 社区规模已相当庞大。在企业和机构的支持下，法国国家信息与自动化研究所于
  2003 年成立了 Scilab 联盟。2017 年 6 月，Scilab Enterprises 成立并负责开发工作。基于经典的开源商业模式，Scilab Enterprises
  还提供与 Scilab 相关的专业服务和支持。Scilab Enterprises 于 2017 年加入 ESI 集团，目前继续开发和提供与 Scilab 相关的服务。Scilab
  广泛应用于科学、工业和服务业的各个战略领域，包括航天、航空、汽车、能源、国防、金融和交通。


  ## 1.4 安装


  Scilab 是一款根据 CeCILL 许可证分发的开源软件，该许可证是 GNU-GPL 兼容许可证的一个版本，适用于自由软件。请注意，以下说明已在 6.0.0
  版本上测试通过。用户可根据操作系统的要求从其官方网站下载。安装过程非常简单，用户论坛和简单的谷歌搜索即可解答用户遇到的常见问题。Scilab 包含一个基于图形用户界面的控制台，便于用户操作。


  该软件的在线版本可在印度的一个网站上使用。在这种情况下，用户无需在自己的系统上安装软件。他们只需通过网页浏览器连接到远程服务器，即可像本地安装一样运行 Scilab
  程序。当然，这需要相当快的网络连接。（鼓励用户尝试这项功能。）就本书而言，我们推荐在本地进行安装并使用。


  在 Windows 操作系统上正确安装后，用户可以在已安装程序列表中看到 Scilab 图标。双击该图标即可打开一个 Scilab 会话。MacOSX 系统也是如此。对于基于
  Linux 的操作系统发行版，您可以选择点击桌面图标，或者直接在命令行输入 `scilab`。


