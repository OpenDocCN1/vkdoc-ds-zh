  24  ylabel('sin(x) + sin(3x)')\n\n26  //4th f igure of a 2X2 f igure matrix\n27\
  \  subplot(2,2,4)\n28  plot(x,sin(x) + sin(4.∗x),'k∗')\n29  title('Plot for sin(x)\
  \ + sin(4x)')\n30  xlabel('x')\n31  ylabel('sin(x) + sin(4x)')\n清单 4-17\nsubplot.sce\n\
  ```\n\n如图 4-20 所示，图形按矩阵方式组织，行号和列号决定了其位置。然后，可以使用图形的索引将其视为一个对象，以便在图形对象上进行进一步处理。理论上，行数和列数的限制取决于计算机的内存，但在打印时，用户必须了解，根据图形的大小，其中一些图形可能会超出打印区域。因此，建议明智地使用此命令。可以通过使用循环生成图形索引来实现图形矩阵的自动生成。\n\
  \n![A458922_1_En_4_Fig20_HTML.gif](img/A458922_1_En_4_Fig20_HTML.gif)\n\n图 4-20\n\
  使用子图在同一图形窗口中分别绘制多个图形\n\n## 4.6 3D 图形\n\nScilab 中有多种可用于 3D 绘图的函数。选择其中哪一个取决于您的具体问题。\n\
  \n### 4.6.1 plot3d\n\n内置函数 `plot3d()` 根据给定的定义为数组的 x、y 和 z 值绘制 3D 图形。其用途之一如清单 4-18\
  \ 所示，其中绘制了公式 4.1。\n\n![ $$ z=\\sqrt{x²+{y}²} $$ ](img/A458922_1_En_4_Chapter_Equ1.gif)\n\
  (4.1)\n\n```\n1  // Program to plot 3D graph using plot3d\n\n3  a = linspace(−8,8,41)';\n\
  4  b = linspace(−8,8,41)'\n5  [xx, yy] = meshgrid(a,b);\n6  c = sqrt(xx.ˆ2 + yy.ˆ2)+%eps;\n\
  7  plot3d(a,b,c)\n清单 4-18\nplot3d.sce\n```\n\n### 4.6.2 plot3d1()\n\n内置函数 `plot3d1()`\
  \ 根据给定的定义为数组的 x、y 和 z 值绘制彩色 3D 图形。单元格的颜色指示 z 值的范围。其用法如清单 4-19 和图 4-21 所示，其中绘制了公式\
  \ 4.1。\n\n![A458922_1_En_4_Fig21_HTML.gif](img/A458922_1_En_4_Fig21_HTML.gif)\n\n\
  图 4-21\n公式的 3D 图形\n\n```\n1  // Program to plot 3D graph using plot3d1\n\n3  a =\
  \ linspace(−8,8,41)';\n4  b = linspace(−8,8,41)'\n5  [xx, yy] = meshgrid(a,b);\n\
  6  c = sqrt(xx.ˆ2 + yy.ˆ2)+%eps;\n7  plot3d1(a,b,c)\n清单 4-19\nplot3d1.sce\n```\n\
  \n`plot3d1()` 提供的颜色编码在某些关键分析中成为了一个附加特性。3D 图形中的等高线给出了测量系统值相同的投影区域的形状。例如，假设图 4-22\
  \ 表示一个位于其中心的带电粒子附近的电场。颜色表示在 3D 空间中该带电粒子受到的力在某个范围内的区域。\n\n![A458922_1_En_4_Fig22_HTML.gif](img/A458922_1_En_4_Fig22_HTML.gif)\n\
  \n图 4-22\n公式的 3D 图形\n\n### 4.6.3 plot3d2()\n\n另一个内置函数 `plot3d2()` 使用矩形面片构建 3D 图形。示例如清单\
  \ 4-20 所示。\n\n```\n1  // Program to plot 3D graph using plot3d2\n\n3  u = linspace(−%pi/2,%pi/2,40);\n\
  4  v = linspace(0,2∗%pi,20);\n5  X = cos(u)'∗cos(v);\n6  Y = cos(u)'∗sin(v);\n7\
  \  Z = sin(u)'∗ones(v);\n8  plot3d2(X,Y,Z);\n清单 4-20\nplot3d2.sce\n```\n\n结果如图 4-23\
  \ 所示。需要注意的是，更精细的网格将使图形具有更好的 3D 特征分辨率。为了获得更精细的网格，`linspace()` 参数应使用更小的步长来定义。然而，同时，使用更精细的网格会增加计算时间。因此，3D\
  \ 渲染是一项计算密集型任务，但有时又是必要的。参数的选择取决于数据分析的要求。当需要更精细的 3D 表面特征分辨率时，用户必须选择更高的渲染能力（这直接导致对高计算能力的需求）。\n\
  \n![A458922_1_En_4_Fig23_HTML.gif](img/A458922_1_En_4_Fig23_HTML.gif)\n\n图 4-23\n\
  公式的 3D 图形\n\n### 4.6.4 plot3d3()\n\n另一个内置函数 `plot3d3()` 使用矩形面片构建 3D 网格图。`plot3d2`\
  \ 和 `plot3d3` 之间的唯一区别在于，前者生成表面图，而后者在矩形面片上生成网格图。示例如清单 4-21 所示。\n\n```\n1  // Program\
  \ to plot 3D graph using plot3d3\n\n3  u = linspace(−%pi/2,%pi/2,40);\n4  v = linspace(0,2∗%pi,20);\n\
  5  X = cos(u)'∗cos(v);\n6  Y = cos(u)'∗sin(v);\n7  Z = sin(u)'∗ones(v);\n8  plot3d3(X,Y,Z);\n\
  清单 4-21\nplot3d3.sce\n```\n\n关于网格分辨率，其参数选择与表面图相同。然而，需要注意的是，渲染网格的计算强度略低于渲染表面。\n\n\
  ### 4.6.5 表面图\n\n表面图通过使用内置函数 `surf()` 获得，该函数接受网格点高度作为单个参数。通过连接这些网格点，可以创建一个表面。默认情况下，表面面片使用不同的颜色编码以便区分。这可以在清单\
  \ 4-22 和图 4-24 所示的代码中查看。\n\n![A458922_1_En_4_Fig24_HTML.gif](img/A458922_1_En_4_Fig24_HTML.gif)\n\
  \n图 4-24\n公式的 3D 图形\n\n```\n1  // Program to plot 3D graph using surf\n2  subplot(2,2,1)\n\
  3  z = rand(10,10);\n4  surf(z)\n5  title('surf')\n\n7  subplot(2,2,2)\n8  surf(z,'facecol','red','edgecol','blu')\n\
  9  title('surf function with face and edge color')\n\n11  subplot(2,2,3)\n12  surf(z,'facecol','interp')\n\
  13  title('surf function interpolated')\n\n15  subplot(2,2,4)\n16  x=rand(10,10);\n\
  17  y=rand(10,10);\n18  z=rand(10,10);\n19  surf(z,'facecol','red','edgecol','blu')\n\
  20  title('surf function with each coordinated def ined seperately')\n清单 4-22\n\
  surf.sce\n```\n\n注意，当提供关于面颜色为红色、边颜色为蓝色的额外参数时，图形会绘制成具有蓝色边缘的红色表面，如图 4-25 所示。`surf()`\
  \ 命令的输入是一个数组。本例中由内置函数 `rand()` 创建，但它也可以从外部创建并输入到 `surf()` 函数中。\n\n![A458922_1_En_4_Fig25_HTML.jpg](img/A458922_1_En_4_Fig25_HTML.jpg)\n\
  \n图 4-25\n公式的 3D 图形\n\n在第三个子图中，随机网格值由 `rand()` 函数定义，但两个网格点之间的中间值被插值。这导致了等高线的颜色编码。在第四个子图中，从\
  \ `rand()` 函数中获取的 x、y、z 各个笛卡尔坐标被分别输入到 `surf` 函数中。\n\n\n\n"
- '# 网格图


  网格图是通过连接由坐标定义的网格点生成的。例如，请考虑清单 4-23 中的代码。


  ```

  // 用于解释网格函数用法的程序


  [X,Y] = meshgrid(−5:0.5:5, −5:.5:5);

  Z = sin(X)+cos(Y);

  mesh(X,Y,Z);

  清单 4-23

  mesh.sce

  ```


  这里，生成了一个二维坐标系，并存放在两个名为 `X` 和 `Y` 的数组中。对于这些定义 x 和 y 的点，定义了一个方程如下：


  ![$$ z=\mathit{\sin}(x)+\mathit{\cos}(x) $$](img/A458922_1_En_4_Chapter_Equ2.gif)


  (4.2)


  这三个值（分别来自数组 `x`、`y` 和 `z`）被输入到 `mesh` 函数中。


  结果如图 4-26 所示。这三个坐标（`x`、`y` 和 `z`）由向量 `X`、`Y` 和 `Z` 的对应元素定义。这些点用于创建网格图。


