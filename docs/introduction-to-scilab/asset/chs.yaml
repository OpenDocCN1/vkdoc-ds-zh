  代码清单 4-11\nchampcolor.sce\n```\n\n\n\n### 4.3.5 等高线图\n\n等高线图常用于可视化函数在二维平面上的投影。它们广泛应用于科学和工程的各个领域，特别是地球物理学中，将温度、压力和湿度等测量参数的信息投影到地图上。此外，等高线图也用于可视化二维数学在平面上的投影。\n\
  \nScilab 为此提供了内置函数 `contour2d()`。其用法在清单 4-12 的示例代码中进行了说明。该函数的详细用法可通过命令 `help contour2d`\
  \ 学习。本质上，该函数接收 x、y 和 z 值以及层级数量作为参数。代码生成随机数，并根据其在二维矩阵中的值进行绘制。\n\n```\n1  // 绘制二维等高线的程序\n\
  2  x = 1:10;\n3  y = 1:10;\n4  z = rand(10,10);\n5  level_number = 8;\n6  contour2d(x,y,z,\
  \ level_number)\n7  title('绘制等高线图')\n8  xlabel('x')\n9  ylabel('y')\n清单 4-12\ncontour.sce\n\
  ```\n\n图 4-15 展示了代码的运行结果。\n\n![A458922_1_En_4_Fig15_HTML.gif](img/A458922_1_En_4_Fig15_HTML.gif)\n\
  \n图 4-15\n\n使用 champ 函数绘制向量场\n\n除了等高线轮廓外，还可以使用内置函数 `contourf()` 获取填充等高线图。其语法与 `contour2d()`\
  \ 函数类似。（参见清单 4-13 和图 4-16。）\n\n![A458922_1_En_4_Fig16_HTML.gif](img/A458922_1_En_4_Fig16_HTML.gif)\n\
  \n图 4-16\n\n使用 champ 函数绘制向量场\n\n```\n1  // 绘制二维填充等高线的程序\n2  x = 1:10;\n3  y = 1:10;\n\
  4  z = rand(10,10);\n5  level_number = 8;\n6  contourf(x,y,z, level_number)\n7 \
  \ title('绘制填充等高线图')\n8  xlabel('x')\n9  ylabel('y')\n清单 4-13\ncontourf.sce\n```\n\
  \n图 4-16 中颜色编码的区域处于相同层级。由于 z 值取自随机数生成器函数 `rand()`，因此每次运行代码 `contourf.sce` 时，生成的图形都会不同。\n\
  \n等高线图是可视化二维数据平滑度的简单方法。平滑的数据变化很小，因此会落在同一个层级内。层级范围的选择将定义平滑度。例如，假设红外摄像机测量房间的温度，并且数据被颜色编码用于视觉显示。等高线将由不同的温度范围层级定义。如果某个区域的温度是均匀的，它将被编码为相似的颜色。该区域的温差将在定义的范围内，因此范围的定义变得至关重要。如果温度的最小值和最大值分别为\
  \ T[1] 和 T[2]，层级数量为 n，则一个区域的温度范围由下式给出：\n\n```\n|T_2 - T_1| / n\n```\n\n## 4.4 二维动画\n\
  \n在仿真过程中，有时通过动画形式展示方程以理解其演变过程会非常有用。Scilab 包含一些对此非常有用的函数。请注意，提供的图形是动画结束时的快照。用户应按照讨论编写代码并在自己的电脑上测试，以在显示器上看到动画效果。动画在向学生教授概念时尤其有用。\n\
  \n### 4.4.1 comet 函数\n\n`comet()` 函数在这种情况下非常有用。在清单 4-14 中，我们使用 `comet` 函数对方程 `x⁵\
  \ - x³ + x + 5` 进行了动画演示。\n\n```\n1  // 演示 comet 用法的程序\n\n3  x = linspace(−%pi,%pi,500);\n\
  4  comet(x,%sˆ5−%sˆ3+%s+5)\n5  xtitle('使用 comet 函数对方程进行动画演示')\n6  xlabel('x')\n\
  7  ylabel('y')\n清单 4-14\ncomet.sce\n```\n\n### 4.4.2 paramfplot2d() 函数\n\n函数在多点的时间演变可以通过\
  \ `paramfplot2d()` 函数来表示。让我们考虑函数 `y = sin(x) + sin(2x) + sin(4x)`（一个信号与其双倍及四倍频率信号的混合）的演变过程。得到的信号是由这三个基本波（`sin(x)`、`sin(2x)`\
  \ 和 `sin(4x)`）组合而成的复杂波，如图 4-17 和清单 4-15 所示。\n\n![A458922_1_En_4_Fig17_HTML.gif](img/A458922_1_En_4_Fig17_HTML.gif)\n\
  \n图 4-17\n\n使用 comet 函数绘图\n\n```\n1  deff('y=f(x,t)','y=t∗sin(x)+sin(2∗x)+sin(4∗x)')\
  \ // 定义方程\n2  x = linspace(−4∗%pi,4∗%pi,10e3); // 定义空间步长\n3  t = 100;\n4  time_speed\
  \ = 0:0.05:1; // 步长决定动画速度\n5  paramfplot2d(f,x,time_speed);\n6  xtitle('使用 paramfplot2d\
  \ 函数对方程进行动画演示')\n7  xlabel('x')\n8  ylabel('y')\n清单 4-15\nparamfplot2d.sce\n```\n\
  \n请注意，`deff` 用于定义函数。其用法可以通过 `help deff` 查看。其详细用法将在关于 Scilab 函数定义的章节中讨论。\n\n## 4.5\
  \ 在同一个图形中绘制多个图表\n\n只需提供 x 轴和 y 轴向量，即可在同一个图形中绘制多个图表，如清单 4-16 和图 4-18 所示。\n\n![A458922_1_En_4_Fig18_HTML.gif](img/A458922_1_En_4_Fig18_HTML.gif)\n\
