- "# 4. 脚本任务\n\n**电子补充材料** 本章的在线版本 (doi:[10.1007/978-1-4842-0638-6_4](http://dx.doi.org/10.1007/978-1-4842-0638-6_4))\
  \ 包含补充材料，可供授权用户使用。\n\n如果您想通过 SFTP（SSH 文件传输协议）工作，或者想自动发送高度自定义的电子邮件、对文件应用密码、检查文件属性（如创建日期和修改日期），那么脚本任务是您的最佳选择之一。本章将深入探讨脚本任务及其一些最常见的用法，包括如何将其与变量和连接管理器一起使用，如何将其用于日志记录和错误处理，以及如何引用自定义程序集。\n\
  \n### 编辑器\n\n当您将脚本任务添加到控制流并进行编辑时，首先必须选择脚本语言：C# 或 VB.NET（见图 4-1）。如果您仍在使用 SSIS 2005，则只能选择\
  \ VB.NET。此选项是一次性的。点击“编辑脚本...”按钮后，此选项将变为灰色，您无法再更改脚本语言。更改它的唯一方法是删除整个脚本任务，向控制流添加一个新的脚本任务，然后重新开始。\n\
  \n![A978-1-4842-0638-6_4_Fig1_HTML.jpg](img/A978-1-4842-0638-6_4_Fig1_HTML.jpg)\n\
  \n**图 4-1.** 脚本任务编辑器\n\n您可以根据自己的偏好更改默认编程语言。在 Visual Studio 中，转到 `工具` 菜单并选择 `选项...`。展开\
  \ `商业智能设计器` 部分，然后展开 `集成服务设计器`。默认语言选项出现在右侧（见图 4-2）。\n\n![A978-1-4842-0638-6_4_Fig2_HTML.jpg](img/A978-1-4842-0638-6_4_Fig2_HTML.jpg)\n\
  \n**图 4-2.** 更改默认脚本语言\n\n编辑器中的第二个属性是 `入口点`。使用此属性，您可以更改将成为脚本起点的方法的名称。默认是 `Main` 方法。除非有充分的理由，否则更改它可能会给其他人带来一些困惑。`ReadOnlyVariables`\
  \ 和 `ReadWriteVariables` 允许您读取和更改脚本任务代码中的变量，但如果您使用的是项目部署模型（自 SSIS 2012 起可用），您也可以使用它们来读取包和项目参数。您可以手动输入变量名称，也可以使用弹出窗口。这些字段是可选的，但本章后面将提供更多信息和示例。\n\
  \n\n\n### 脚本布局\n\n点击“编辑脚本...”按钮会启动 VSTA 编辑器，使您能够编写 .NET 代码。该编辑器是 Visual Studio 在\
  \ VSTA 项目中的一个新实例，支持 C# 或 VB.NET 代码。VSTA 代表 Visual Studio Tools for Applications（应用程序级\
  \ Visual Studio 工具）。如果您仍在使用 SSIS 2005，那么 VSA（Visual Studio for Applications，应用程序级\
  \ Visual Studio）编辑器仅支持您编写 VB.NET 代码。VSA 编辑器是 Visual Studio 的精简版，缺少许多功能，包括编写 C# 代码的能力。\n\
  \n首次为脚本任务启动 VSTA 编辑器时，它会生成默认代码以帮助您入门。VSTA 环境包含三个主要部分（见图 4-3）。\n\n- A. **ScriptMain**：您在其中键入代码的编辑器。关闭\
  \ VSTA 环境时会自动保存。\n- B. **解决方案资源管理器**：在此部分，您可以向其他 .NET 库（例如 LINQ 或自定义库）添加额外引用。您还可以更改项目属性（例如目标框架），并可选择添加额外的\
  \ C# 或 VB.NET 文件。更改应通过“全部保存”按钮保存；否则，关闭 VSTA 编辑器时更改将丢失。\n- C. **属性**：此处您可以查看在解决方案资源管理器中所选项目的属性。例如，您可以查看（临时）VSTA\
  \ 项目在磁盘上的存储位置。\n\n![A978-1-4842-0638-6_4_Fig3_HTML.jpg](img/A978-1-4842-0638-6_4_Fig3_HTML.jpg)\n\
  \n图 4-3. 脚本任务的 VSTA 编辑器\n\nA 部分中的脚本是自动生成的，其代码因 SSIS 版本以及脚本语言而异（见图 4-4 和 4-5）。\n\n\
