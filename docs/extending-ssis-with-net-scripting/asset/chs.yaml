  \ newContact As New Entity(\"contact\")\nnewContact(\"name\") = \"Régis Baccaro\"\
  \norganizationservice.Create(newContact)\n```\n\n\n\n#### Input0_ProcessInputRow\
  \ - 插入\n\n插入代码首先需要创建一个实体对象，并将 CRM 实体的名称作为参数传递。\n\n```csharp\n// 创建一个类型为 'contact'\
  \ 的 Entity 对象\nEntity newContact = new Entity(\"contact\");\n```\n\n以下是 VB.NET 代码：\n\
  \n```vbnet\n' 创建一个类型为 'contact' 的 Entity 对象\nDim newContact As New Entity(\"contact\"\
  )\n```\n\n之后，就可以开始填充 CRM 列。如果你确定 SSIS 列中已有数据，则可以直接赋值。\n\n```csharp\n// 在 CRM 中存储源数据的业务键\n\
  // 这使得比较和筛选用于更新的记录更加容易\nnewContact[\"SourceContactId\"] = Row.SourceContactId;\n\
  \n// 填充 crm 字段。注意字段名是区分大小写的！\nnewContact[\"firstname\"] = Row.Firstname;\nnewContact[\"\
  lastname\"] = Row.Lastname;\n```\n\n以下是 VB.NET 代码：\n\n```vbnet\n' 在 CRM 中存储源数据的业务键\n\
  ' 这使得比较和筛选用于更新的记录更加容易\nnewContact(\"SourceContactId\") = Row.SourceContactId\n\n\
  ' 填充 crm 字段。注意字段名是区分大小写的！\nnewContact(\"firstname\") = Row.Firstname\nnewContact(\"\
  lastname\") = Row.Lastname\n```\n\n你也可以在赋值时添加空值检查，这样当值为空时，CRM 字段将保持不变。在这种情况下，CRM\
  \ 中的值要么为空，要么会使用默认值。\n\n```csharp\n// 地址，但要检查列是否已填充\nif (!Row.Street_IsNull)\n{\n\
  \    newContact[\"address1_line1\"] = Row.Street;\n}\n\nif (!Row.HouseNumber_IsNull)\n\
  {\n    newContact[\"address1_line2\"] = Row.HouseNumber;\n}\n\nif (!Row.City_IsNull)\n\
  {\n    newContact[\"address1_city\"] = Row.City;\n}\n```\n\n以下是 VB.NET 代码：\n\n```vbnet\n\
  ' 地址，但要检查列是否已填充\nIf Not Row.Street_IsNull Then\n    newContact(\"address1_line1\"\
  ) = Row.Street\nEnd If\n\nIf Not Row.HouseNumber_IsNull Then\n    newContact(\"\
  address1_line2\") = Row.HouseNumber\nEnd If\n\nIf Not Row.City_IsNull Then\n   \
  \ newContact(\"address1_city\") = Row.City\nEnd If\n```\n\n填充 OptionSet（一个包含预定义值的下拉列表）会略有不同。你不能直接赋值字符串，而是需要分配关联的\
  \ ID。你需要一些 CRM 知识才能在 CRM 中找到该 ID，因此，咨询 CRM 顾问可能会更方便。\n\n```csharp\nOptionSetValue\
  \ contactType = new OptionSetValue();\n\nif (!Row.ContactType_IsNull)\n{\n    switch\
  \ (Row.ContactType)\n    {\n        case \"Client\":\n            contactType.Value\
  \ = 1;\n            break;\n        case \"Partner\":\n            contactType.Value\
  \ = 2;\n            break;\n        case \"Personal\":\n            contactType.Value\
  \ = 3;\n            break;\n        default:\n            contactType.Value = 2;\n\
  \            break;\n    }\n    newContact.Attributes.Add(\"contacttype\", (OptionSetValue)contactType);\n\
  }\n```\n\n以下是 VB.NET 代码：\n\n```vbnet\nDim contactType As New OptionSetValue()\n\n\
  If Not Row.ContactType_IsNull Then\n    Select Case Row.ContactType\n        Case\
  \ \"Client\"\n            contactType.Value = 1\n            Exit Select\n     \
  \   Case \"Partner\"\n            contactType.Value = 2\n            Exit Select\n\
  \        Case \"Personal\"\n            contactType.Value = 3\n            Exit\
  \ Select\n        Case Else\n            contactType.Value = 2\n            Exit\
  \ Select\n    End Select\n    newContact.Attributes.Add(\"contacttype\", DirectCast(contactType,\
  \ _\n        OptionSetValue))\nEnd If\n```\n\n例如，将我们的新联系人链接到一个客户（即查找），是通过 `EntityReference`\
  \ 完成的，但你需要相关客户的 GUID。这应该在查找转换中通过对 CRM 执行查询来完成。\n\n```csharp\n// 引用另一个实体（查找）\nEntityReference\
  \ Account = new EntityReference(\"account\", Row.AccountGuid);\nnewContact[\"accountid\"\
  ] = Account;\n```\n\n以下是 VB.NET 代码：\n\n```vbnet\n' 引用另一个实体（查找）\nDim Account As New\
  \ EntityReference(\"account\", Row.AccountGuid)\nnewContact(\"accountid\") = Account\n\
  ```\n\n最后，实际将联系人添加到 CRM 只需要一行代码。\n\n```csharp\n// 创建新联系人\norganizationservice.Create(newContact);\n\
  ```\n\n以下是 VB.NET 代码：\n\n```vbnet\n' 创建新联系人\norganizationservice.Create(newContact)\n\
  ```\n\n#### Input0_ProcessInputRow - 更新\n\n更新联系人与插入非常相似，但你需要联系人的 GUID。\n\n```csharp\n\
  // 创建一个类型为 'contact' 的 Entity 对象\nEntity existingContact = new Entity(\"contact\"\
  );\n\n// 最重要的属性是填充实体 ID\n// 这是来自 CRM 的 GUID 列。没有此列\n// 则无法更新 CRM 中的记录。\nexistingContact[\"\
  contactid\"] = Row.ContactId;\n```\n\n以下是 VB.NET 代码：\n\n```vbnet\n' 创建一个类型为 'contact'\
  \ 的 Entity 对象\nDim existingContact As New Entity(\"contact\")\n\n' 最重要的属性是填充实体 ID\n\
  ' 这是来自 CRM 的 GUID 列。没有此列\n' 则无法更新 CRM 中的记录。\nexistingContact(\"contactid\") = Row.ContactId\n\
  ```\n\n接下来，你可以像在插入中那样，开始填充所有的 CRM 列。\n\n```csharp\n// 填充 crm 字段。注意字段名是区分大小写的！\n\
  existingContact[\"firstname\"] = Row.Firstname;\nexistingContact[\"lastname\"] =\
  \ Row.Lastname;\n```\n\n以下是 VB.NET 代码：\n\n```vbnet\n' 填充 crm 字段。注意字段名是区分大小写的！\n\
  existingContact(\"firstname\") = Row.Firstname\nexistingContact(\"lastname\") =\
  \ Row.Lastname\n```\n\n但是，当你添加 `if` 语句来检查空值时，也需要添加一个 `else` 分支；否则，该列将不会被更新。\n\n\
  ```csharp\n// 地址，但要检查列是否已填充\nif (!Row.Street_IsNull)\n{\n    existingContact[\"\
  address1_line1\"] = Row.Street;\n}\nelse\n{\n    existingContact[\"address1_line1\"\
  ] = \"\";\n}\n```\n\n以下是 VB.NET 代码：\n\n```vbnet\n' 地址，但要检查列是否已填充\nIf Not Row.Street_IsNull\
  \ Then\n    existingContact(\"address1_line1\") = Row.Street\nElse\n    existingContact(\"\
  address1_line1\") = \"\"\nEnd If\n```\n\n最后一步是实际的更新代码。\n\n```csharp\n// 更新联系人\n\
  organizationservice.Update(existingContact);\n```\n\n以下是 VB.NET 代码：\n\n```vbnet\n\
  ' 更新联系人\norganizationservice.Update(existingContact)\n```\n\n#### Input0_ProcessInputRow\
  \ - 硬删除\n\n如果某个记录在你的源数据中已不存在，你也可以从 CRM 中删除它。在你的数据流（合并联接）中，应将左外部联接更改为完全外部联接。之后，需要更改条件性拆分中的表达式。第一个“插入”输出表达式检查\
  \ CRM 端的 `sourceContactId` 是否为空。第二个“删除”输出表达式检查源端的 `sourceContactId` 是否为空。最后一个“更新”输出表达式检查哈希值是否不同。\n\
  \n对于脚本组件中的输入列，你只需要来自 CRM 的 GUID 列。请注意，这将是从 CRM 执行的物理删除，且无法撤销！\n\n```csharp\n// 删除客户。第一个参数是实体名称，第二个参数\n\
  // 是来自 CRM 源的实体 ID。\norganizationservice.Delete(\"contact\", Row.ContactId);\n```\n\
  \n以下是 VB.NET 代码：\n\n```vbnet\n' 删除客户。第一个参数是实体名称，第二个参数\n' 是来自 CRM 源的实体 ID。\norganizationservice.Delete(\"\
  contact\", Row.ContactId)\n```\n\n\n\n#### Input0_ProcessInputRow - 软删除\n\n如果物理删除操作过于彻底，你也可以停用记录，但需要从\
  \ SDK 中额外添加一个程序集到 GAC 和`Binn`文件夹：`Microsoft.Crm.Sdk.Proxy.dll`。然后还需要在 VSTA 环境中引用此程序集。在“添加引用”窗口中，浏览到\
  \ SSIS 的`Binn`文件夹。之后，需要为停用操作再添加一个额外的命名空间。\n\n```\nusing Microsoft.Crm.Sdk.Messages;\n\
  ```\n\n这是 VB.NET 代码：\n\n```\nImport Microsoft.Crm.Sdk.Messages\n```\n\n接下来是实际的停用代码。请注意，这是一个添加到队列中的请求。因此，当\
  \ CRM 正在处理时，脚本可能已经完成，而请求仍在队列中。\n\n```\n// Create CRM request to (de)activate record\n\
  SetStateRequest setStateRequest = new SetStateRequest();\n\n// Which entity/record\
  \ should be (de)activate?\n// First part in the entityname, second is the entity\
  \ id from the CRM source.\nsetStateRequest.EntityMoniker = new EntityReference(\"\
  contact\", Row.ContactId);\n\n// Setting 'State' (0 – Active ; 1 – InActive)\nsetStateRequest.State\
  \ = new OptionSetValue(1);\n\n// Setting 'Status' (1 – Active ; 2 – InActive)\n\
  setStateRequest.Status = new OptionSetValue(2);\n\n// Execute the request\nSetStateResponse\
  \ response =\n                (SetStateResponse)organizationservice.Execute(setStateRequest);\n\
  ```\n\n这是 VB.NET 代码：\n\n```\n' Create CRM request to (de)activate record\nDim setStateRequest\
  \ As New SetStateRequest()\n\n' Which entity/record should be (de)activate?\n' First\
  \ part in the entityname, second is the entity id from the CRM source.\nsetStateRequest.EntityMoniker\
  \ = New EntityReference(\"contact\", Row.ContactId)\n\n' Setting 'State' (0 – Active\
  \ ; 1 – InActive)\nsetStateRequest.State = New OptionSetValue(1)\n\n' Setting 'Status'\
  \ (1 – Active ; 2 – InActive)\nsetStateRequest.Status = New OptionSetValue(2)\n\n\
  ' Execute the request\nDim response As SetStateResponse = _\n     DirectCast(organizationservice.Execute(setStateRequest),\
  \ SetStateResponse)\n```\n\n### SharePoint\n\n在脚本组件中调用 SharePoint Web 服务有时是必要的。在某些情况下，你可以使用\
  \ Web 服务任务，但在其他情况下，例如当你只在数据流任务的行的内部有可用数据时，你必须使用脚本组件。\n\n在以下示例中，你将从一个 SharePoint\
  \ 站点中的所有文档库获取所有文档，并从每个库中获取 Excel 文档。\n\n你使用的是 SharePoint 2013，但这在 SharePoint 2010\
  \ 中也适用。\n\n#### 变量\n\n图 15-14 显示了变量窗口。定义了两个变量：`SiteURL`指定 SharePoint 站点的地址，`fileType`指定感兴趣的文档类型。图中的文档类型是`xsls`，表示\
  \ Microsoft Excel 的 Open XML 电子表格格式。\n\n![A978-1-4842-0638-6_15_Fig14_HTML.jpg](img/A978-1-4842-0638-6_15_Fig14_HTML.jpg)\n\
  \n图 15-14. 变量窗口\n\n首先创建两个执行包所需的字符串变量。\n\n#### 脚本组件\n\n在表面上添加一个数据流任务，然后在数据流内部，添加一个名为`SCR_SRC-GetSharePointLists`的脚本组件。将类型指定为源，如图\
  \ 15-15 所示。\n\n![A978-1-4842-0638-6_15_Fig15_HTML.jpg](img/A978-1-4842-0638-6_15_Fig15_HTML.jpg)\n\
  \n图 15-15. 脚本组件\n\n在脚本转换编辑器的脚本页面上，将`SiteUrl`变量添加为`ReadOnlyVariable`。在输入和输出页面上，添加三个输出列：`ListName`、`ListID`和`webID`。将这三个列的类型都设置为`string`。图\
  \ 15-16 展示了示例中的三个列。\n\n![A978-1-4842-0638-6_15_Fig16_HTML.jpg](img/A978-1-4842-0638-6_15_Fig16_HTML.jpg)\n\
  \n图 15-16. 添加输出列\n\n#### 脚本\n\n现在是编辑脚本的时候了。首先，由于你要处理 Web 服务，需要向 SharePoint 列表 Web\
  \ 服务添加服务引用。其地址为`http://<sitename>/_vti_bin/lists.asmx`，其中`<sitename>`是站点名称。你可以在图\
  \ 15-17 中看到这一点。对于命名空间，选择`SharePointListWebService`。\n\n![A978-1-4842-0638-6_15_Fig17_HTML.jpg](img/A978-1-4842-0638-6_15_Fig17_HTML.jpg)\n\
  \n图 15-17. 添加服务引用\n\n图 15-17 中的地址用于生成服务接口和协定。地址本身将是动态的，并在运行时借助变量`SiteURL`指定。\n\n\
  为了功能、可读性和易用性，添加一些自定义命名空间。\n\n```\n#region CustomNameSpace\nusing System.Xml;\nusing\
  \ System.ServiceModel;\nusing SC_3ed715c2a09541348a1ee539d02fd266.SharePointListWebService;\n\
  #endregion\n```\n\n这是 VB.NET 代码：\n\n```\n#Region \"CustomNamespace\"\nImports System.Xml\n\
  Imports System.ServiceModel\nImports SC_3ed715c2a09541348a1ee539d02fd266.SharePointListWebService\n\
  #End Region\n```\n\n如果你阅读过第 7 章，你已经知道要在所有正确的配置文件中获取所有正确的 Web 服务配置值是多么困难。这次，你创建了一个方法来实现\
  \ SharePoint Web 服务（NTLM）所需的安全性。以下方法是`app.config`中内容的 C#/VB.NET 版本。该方法需要添加到最后的方法声明之后，但在\
  \ VSTA 的 C#或 VB.NET 类内部。\n\n```\ninternal static ListsSoapClient CreateWebServiceInstance(string\
  \ siteUrl)\n{\n    BasicHttpBinding binding = new BasicHttpBinding();\n    // These\
  \ are defaults and reflect  app.config:\n    binding.SendTimeout = TimeSpan.FromMinutes(1);\n\
  \    binding.OpenTimeout = TimeSpan.FromMinutes(1);\n    binding.CloseTimeout =\
  \ TimeSpan.FromMinutes(1);\n    binding.ReceiveTimeout = TimeSpan.FromMinutes(10);\n\
  \    binding.AllowCookies = false;\n    binding.BypassProxyOnLocal = false;\n  \
  \  binding.HostNameComparisonMode = HostNameComparisonMode.StrongWildcard;\n   \
  \ binding.MessageEncoding = WSMessageEncoding.Text;\n    binding.TextEncoding =\
  \ System.Text.Encoding.UTF8;\n    binding.TransferMode = TransferMode.Buffered;\n\
  \    binding.UseDefaultWebProxy = true;\n    binding.Security.Mode = BasicHttpSecurityMode.TransportCredentialOnly;\n\
  \    binding.Security.Transport.ClientCredentialType =\n        HttpClientCredentialType.Ntlm;\n\
  \    binding.Security.Message.ClientCredentialType =\n        BasicHttpMessageCredentialType.UserName;\n\
  \    return new ListsSoapClient(binding, new EndpointAddress(siteUrl + @\"/_vti_bin/lists.asmx\"\
  ));\n}\n```\n\n这是 VB.NET 代码：\n\n```\nFriend Shared Function CreateWebServiceInstance(siteUrl\
  \ As String) As ListsSoapClient\n    Dim binding As New BasicHttpBinding()\n   \
  \ ' These are defaults and reflect app.config:\n    binding.SendTimeout = TimeSpan.FromMinutes(1)\n\
  \    binding.OpenTimeout = TimeSpan.FromMinutes(1)\n    binding.CloseTimeout = TimeSpan.FromMinutes(1)\n\
  \    binding.ReceiveTimeout = TimeSpan.FromMinutes(10)\n    binding.AllowCookies\
  \ = False\n    binding.BypassProxyOnLocal = False\n    binding.HostNameComparisonMode\
  \ = HostNameComparisonMode.StrongWildcard\n    binding.MessageEncoding = WSMessageEncoding.Text\n\
  \    binding.TextEncoding = System.Text.Encoding.UTF8\n    binding.TransferMode\
  \ = TransferMode.Buffered\n    binding.UseDefaultWebProxy = True\n    binding.Security.Mode\
  \ = BasicHttpSecurityMode.TransportCredentialOnly\n    binding.Security.Transport.ClientCredentialType\
  \ = _\n        HttpClientCredentialType.Ntlm\n    binding.Security.Message.ClientCredentialType\
  \ = _\n        BasicHttpMessageCredentialType.UserName\n    Return New ListsSoapClient(binding,\
  \ New EndpointAddress(siteUrl & _\n        Convert.ToString(\"/_vti_bin/lists.asmx\"\
  )))\nEnd Function\n```\n\n\n好的，作为高级文档工程师和翻译员，我将严格遵循您给出的注意事项和示例，对提供的英文文本进行翻译。以下是翻译结果：\n\
  \n\n如您所见，其中包含了配置所需的一切。但关键部分是 `ClientCredentialType`。SharePoint 要求使用 NTLM。如果您是从内部调用，则无需传递凭据。在脚本的\
  \ `PreExecute` 方法中实例化客户端：\n\n```\n//Create the client with all the bindings set\n\
  ListsSoapClient client = CreateWebServiceInstance(siteUrl);\n\n//Programatically\
  \ sets the credentials\nclient.ClientCredentials.Windows.ClientCredential = new\
  \ System.Net.NetworkCredential();\nclient.ClientCredentials.Windows.AllowedImpersonationLevel\
  \ = System.Security.Principal.TokenImpersonationLevel.Impersonation;\nclient.Open();\n\
  \n//Call the method to get all the lists\nresult = client.GetListCollection();\n\
  \n//Tidy up\nclient.Close();\n```\n\n以下是 VB.NET 代码：\n\n```\n'Create the client with\
  \ all the bindings set\nDim client As ListsSoapClient = CreateWebServiceInstance(siteUrl)\n\
  \n'Programatically sets the credentials\nclient.ClientCredentials.Windows.ClientCredential\
  \ = New System.Net.NetworkCredential()\nclient.ClientCredentials.Windows.AllowedImpersonationLevel\
  \ = System.Security.Principal.TokenImpersonationLevel.Impersonation\nclient.Open()\n\
  \n'Call the method to get all the lists\nresult = client.GetListCollection()\n\n\
  'Tidy up\nclient.Close()\n```\n\n结果存储在一个名为 `result` 的变量中，之后在 `CreateNewOutputRows`\
  \ 方法中，您可以遍历该变量，并为每个结果添加一行信息。\n\n```\nforeach (XmlNode node in result)\n{\n    if\
  \ (node.Name == \"List\")\n    {\n        Output0Buffer.AddRow();\n        Output0Buffer.ListID\
  \ = node.Attributes[\"ID\"].Value;\n        Output0Buffer.ListName = node.Attributes[\"\
  Title\"].Value;\n    }\n}\n```\n\n以下是 VB.NET 代码：\n\n```\nFor Each node As XmlNode\
  \ In result\n    If node.Name = \"List\" Then\n        Output0Buffer.AddRow()\n\
  \        Output0Buffer.ListID = node.Attributes(\"ID\").Value\n        Output0Buffer.ListName\
  \ = node.Attributes(\"Title\").Value\n    End If\nNext\n```\n\n### 从库中提取 Excel 文件\n\
  \n现在您已经获得了输出行，接下来需要在数据流任务中添加另一个名为 `SRC_TRA-GetExcelDocuments` 的脚本组件。这次，您选择“转换”类型，因为您将获取每个列表并从中提取所需的项目。\n\
  \n在其脚本页面上，将 `fileType` 和 `siteURL` 添加到 `ReadOnlyVariables` 列表中。\n\n在“输入列”页面上，勾选所有可用列：`ListName`、`ListID`\
  \ 和 `WebID`。\n\n在“输入和输出”页面上，务必记住将 `SynchronousInputID` 设置为 `None`，因为您希望脚本组件在其输出中生成比接收到的更多的行。显然，每个文档库中可能包含不止一个\
  \ Excel 文件。\n\n> **注意：** 同步输出和异步输出之间的区别在第 11 章中有更详细的解释。\n\n您还需要向输出中添加两列：类型为字符串、长度为\
  \ 250 的 `FileFullPath`，以及一个类型为字符串、使用默认长度的 `listName`，用于返回文件所在库的名称（参见图 15-18）。\n\n\
  ![A978-1-4842-0638-6_15_Fig18_HTML.jpg](img/A978-1-4842-0638-6_15_Fig18_HTML.jpg)\n\
  \n*图 15-18.* 向脚本组件添加输出\n\n您需要再次添加对 SharePoint Web 服务的引用，方法与之前完全相同。您还需要添加 `help`\
  \ 方法来设置绑定。\n\n同样，您需要一些自定义命名空间：\n\n```\n#region CustomNameSpace\nusing System.Xml;\n\
  using System.Windows.Forms;\nusing System.ServiceModel;\nusing SC_3ed715c2a09541348a1ee539d02fd266.SharePointListWebService;\n\
  using System.Text;\nusing System.ServiceModel.Description;\n#endregion\n```\n\n\
  以下是 VB.NET 代码：\n\n```\n#Region \"CustomNameSpace\"\nImports System.Xml\nImports\
  \ System.Windows.Forms\nImports System.ServiceModel\nImports SC_3ed715c2a09541348a1ee539d02fd266.SharePointListWebService\n\
  Imports System.Text\nImports System.ServiceModel.Description\n#End Region\n```\n\
  \n#### PreExecute\n\n在脚本的 `PreExecute` 方法中，实例化并打开 Web 服务。您不希望它在处理每一行时都被实例化。\n\n\
  ```\n//Assign the package variables to some local variables\nstring siteUrl = Variables.siteUrl;\n\
  fileType = Variables.fileType;\n\n//Create the client with all the bindings set\n\
  client = CreateWebServiceInstance(siteUrl);\n\n//Programatically sets the credentials\n\
  client.ClientCredentials.Windows.ClientCredential = new\n                      \
  \                         System.Net.NetworkCredential();\nclient.ClientCredentials.Windows.AllowedImpersonationLevel\
  \ =\n              System.Security.Principal.TokenImpersonationLevel.Impersonation;\n\
  client.Open();\n```\n\n以下是 VB.NET 代码：\n\n```\n'Assign the package variables to some\
  \ local variables\nDim siteUrl As String = Variables.siteUrl\nfileType = Variables.fileType\n\
  \n'Create the client with all the bindings set\nclient = CreateWebServiceInstance(siteUrl)\n\
  \n'Programatically sets the credentials\nclient.ClientCredentials.Windows.ClientCredential\
  \ = New System.Net.NetworkCredential()\nclient.ClientCredentials.Windows.AllowedImpersonationLevel\
  \ = System.Security.Principal.TokenImpersonationLevel.Impersonation\nclient.Open()\n\
  ```\n\n#### Input0_ProcessInputRow\n\n`Input0_ProcessInputRow` 方法是实际执行工作的位置。您在此处调用另一个\
  \ SharePoint Web 服务方法。`GetListItems` 方法返回列表中的所有元素。有关此方法的更多信息，请访问 [`msdn.microsoft.com/en-us/library/lists.lists.getlistitems`](https://msdn.microsoft.com/en-us/library/lists.lists.getlistitems)。\n\
  \n基本上，您需要定义一个查询元素（`query`），其中包含决定返回哪些记录及其顺序的查询，以及一个 `viewFields` 元素，用于指定在查询中返回哪些字段及其顺序。为了保持代码整洁，有一些辅助方法来创建\
  \ XML 节点和元素。本章的完整脚本可供下载，因此此处仅列出相关部分。\n\n对 Web 服务的调用如下所示：\n\n```\nXmlNode listContent\
  \ = client.GetListItems(listName, null, null,\n                (XmlElement)ViewFields,\
  \ null, (XmlElement)QueryOptions, webID);\n```\n\n以下是 VB.NET 代码：\n\n```\nDim listContent\
  \ As XmlNode = client.GetListItems(listName, Nothing, Nothing, DirectCast(ViewFields,\
  \ XmlElement), Nothing, DirectCast(QueryOptions, XmlElement), _\nwebID)\n```\n\n\
  调用 Web 服务并处理了架构和命名空间后，您便可以遍历结果以提取所需的文件类型。\n\n```\nforeach (XmlNode row in rows)\n\
  {\n    if (row.Attributes[\"ows_ContentType\"].Value == \"Document\" &&\n      \
  \  row.Attributes[\"ows_DocIcon\"].Value == fileType)\n    {\n        //more than\
  \ one excel file per library - add one row per file to the output\n        Output0Buffer.AddRow();\n\
  \        Output0Buffer.FileFullPath = row.Attributes[\"ows_EncodedAbsUrl\"].Value;\n\
  \        Output0Buffer.ListName = listName;\n        //xmlResultsDoc.Save(@\"c:\\\
  listContent.xml\"); // for debug\n    }\n}\n```\n\n以下是 VB.NET 代码：\n\n```\nFor Each\
  \ row As XmlNode In rows\n        If row.Attributes(\"ows_ContentType\").Value =\
  \ \"Document\" AndAlso row.Attributes(\"ows_DocIcon\").Value = fileType Then\n \
  \               'more than one excel file per library - add one row per file to\
  \ the output\n                Output0Buffer.AddRow()\n                Output0Buffer.FileFullPath\
  \ = row.Attributes(\"ows_EncodedAbsUrl\").Value\n                Output0Buffer.ListName\
  \ = listName\n        End If\nNext\n```\n\n最后，在数据流中添加一个多播（Multicast）和一个数据查看器（data\
  \ viewer），以便能够查看数据。结果如图 15-19 所示。\n\n![A978-1-4842-0638-6_15_Fig19_HTML.jpg](img/A978-1-4842-0638-6_15_Fig19_HTML.jpg)\n\
  \n*图 15-19.* 调用 SharePoint Web 服务的结果\n\n\n\n### 总结\n\n在本章中，你学习了如何在脚本组件中使用 Web 服务，特别是针对\
  \ Dynamics CRM 和 SharePoint 等微软产品。请注意，Web 服务通常比直接访问 API 更慢，但它具有许多优势，例如作为行业标准、与供应商无关以及解耦性。此外，Web\
  \ 服务的本质使你能够为 SSIS 解决方案添加极大的灵活性。\n\n"
