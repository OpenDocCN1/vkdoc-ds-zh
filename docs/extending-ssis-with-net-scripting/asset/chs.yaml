  \ = CrmPassWord;\n  organizationservice = new OrganizationServiceProxy(new Uri(CrmUrl),\
  \ null\n                                                     , credentials, null);\n\
  }\n```\n\n以下是 VB.NET 代码：\n\n```\nPublic Overrides Sub PreExecute()\n  ' 用包中的变量值填充字符串变量\n\
