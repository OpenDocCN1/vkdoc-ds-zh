  City\"].Value.ToString();\nstring Country = Dts.Variables[\"Country\"].Value.ToString();\n\
  \n// 指定地址是什么\nstring epAdr = Dts.Variables[\"WeatherServiceURL\"].Value.ToString();\n\
  \ntry\n{\n    // 获取正确的绑定\n    BasicHttpBinding httpb = new BasicHttpBinding();\n\
  \    channelFactory = new ChannelFactory<GlobalWeatherSoap>(httpb);\n    // 使用我们的地址创建必要的终结点\n\
  \    ep = new EndpointAddress(epAdr);\n    // 准备创建 Web 服务的表示\n    GlobalWeatherSoap\
  \ weatherSvcObj = channelFactory.CreateChannel(ep);\n    // 获取某个国家的地理信息\n    string\
  \ result = weatherSvcObj.GetWeather(City, Country);\n    //// 确保处理的是 XML 文档\n  \
  \  // XmlDocument doc = new XmlDocument();\n    // doc.LoadXml(result);\n    ValidateXML(result);\n\
  \    // 将结果保存到变量中供以后使用。\n    Dts.Variables[\"ResultString\"].Value = result;\n \
  \   MessageBox.Show(result);\n}\ncatch (Exception ex)\n{\n    Dts.TaskResult = (int)ScriptResults.Failure;\n\
  \    throw ex;\n}\n```\n\n以下是 VB.NET 中的写法：\n\n```vb\n' 创建正确类型的 ChannelFactory –\
  \ 需要 using 才能在代码中使用服务引用\n' 在我们的例子中为：\n' using ST_751e10ef586a4cd9ac45c6d1c84c526c.GetWeather;\n\
  Dim channelFactory As ChannelFactory(Of GlobalWeatherSoap) = Nothing\nDim ep As\
  \ EndpointAddress = Nothing\nDim City As String = Dts.Variables(\"City\").Value.ToString()\n\
  Dim Country As String = Dts.Variables(\"Country\").Value.ToString()\n\n' 指定地址是什么\n\
  Dim epAdr As String = Dts.Variables(\"WeatherServiceURL\").Value.ToString()\n\n\
  Try\n    ' 获取正确的绑定\n    Dim httpb As New BasicHttpBinding()\n    channelFactory\
  \ = New ChannelFactory(Of GlobalWeatherSoap)(httpb)\n    ' 使用我们的地址创建必要的终结点\n   \
  \ ep = New EndpointAddress(epAdr)\n    ' 准备创建 Web 服务的表示\n    Dim weatherSvcObj As\
  \ GlobalWeatherSoap = channelFactory.CreateChannel(ep)\n    ' 获取某个国家的地理信息\n    Dim\
  \ result As String = weatherSvcObj.GetWeather(City, Country)\n    '/确保处理的是 XML 文档\n\
  \    ' XmlDocument doc = new XmlDocument();\n    ' doc.LoadXml(result);\n    ValidateXML(result)\n\
  \    ' 将结果保存到变量中供以后使用。\n    Dts.Variables(\"ResultString\").Value = result\n   \
  \ MessageBox.Show(result)\nCatch ex As Exception\n    Dts.TaskResult = CInt(ScriptResults.Failure)\n\
  \    Throw ex\nEnd Try\n```\n\n一旦你按照此处的说明调用了 Web 服务，你应该会得到类似于以下的结果（为简洁起见已缩短）：\n\n\
  ```xml\n<NewDataSet>\n  <Table>\n    <Country>France</Country>\n    <City>Le Touquet</City>\n\
  \  </Table>\n  <Table>\n    <Country>France</Country>\n    <City>Agen</City>\n \
  \ </Table>\n  ...\n</NewDataSet>\n```\n\n现在，你已经获得了一个表示法国城市（该 Web 服务提供其天气数据）的 XML\
  \ 结构，接下来需要遍历每个 `City` 元素，并获取每个城市的天气。\n\n#### 用于处理 XML 的 Foreach 循环\n\n在创建 Foreach\
  \ 循环容器时，需要指定所处理的枚举类型。该容器需要在脚本上设置一个优先约束。图 7-4 显示了该容器的集合设置。\n\n![A978-1-4842-0638-6_7_Fig4_HTML.jpg](img/A978-1-4842-0638-6_7_Fig4_HTML.jpg)\n\
  \n**图 7-4.** Foreach 循环容器集合设置\n\n以下是对图 7-4 中标注的说明：\n\n1. 你想要遍历一个节点列表 (NodeList)，以获取\
  \ XML 节点列表中的每个城市。\n2. 节点列表在变量中指定。\n3. 保存 XML 的变量名称（类型为 string 或甚至 Object，因为所有类型都继承自\
  \ Object 类型）。\n4. 枚举类型是元素集合 (element collection)。\n5. 元素的位置。从根节点（由第一个 `/` 指示）开始，向下逐节点遍历（由第二个\
  \ `/` 指示）。\n6. 节点中的每个元素都是基于索引的，并在 Foreach 循环编辑器的下一个窗格中指定。\n\n现在你可以在 XML 文档的 `<Table>`\
  \ 元素上进行循环，接下来需要获取所需的元素。在本例中，即 `<City>` 元素。它是在 Foreach 循环编辑器的“变量映射”(Variable Mappings)\
  \ 中指定的。\n\n\n\n##### 变量映射\n\n变量映射基于 XML 节点中元素的索引。\n\n在此案例中，您有一个名为 `<Table>` 的节点，其结构如下：\n\
  \n```\n<Table>\n    <Country>France</Country>   ß 索引 0\n    <City>Le Touquet</City>\
  \     ß 索引 1\n</Table>\n```\n\n由于国家/地区已保存在某个变量中，您只需获取城市（索引 1）。图 7-5 展示了变量映射。\n\n\
  ![A978-1-4842-0638-6_7_Fig5_HTML.jpg](img/A978-1-4842-0638-6_7_Fig5_HTML.jpg)\n\n\
  **图 7-5.** Foreach 循环编辑器中的“变量映射”窗格\n\n至此，Foreach 循环中的所有内容均已设置完毕，您可以遍历 XML 节点列表并获取每个城市名称。这演示了如何针对架构验证\
  \ XML。\n\n### 针对架构验证 XML\n\n在处理 XML 文档之前，验证内容并确保所提供的 XML 能够遵循其所应表示的架构，通常非常有用。XML\
  \ 架构语法和用法超出了本书的讨论范围，但这部分信息非常有趣且实用；如果您想了解有关该主题的更多信息，建议参考以下内容：\n\n- W3C 架构推荐标准：[`www.w3.org/TR/xmlschema-1/`](http://www.w3.org/TR/xmlschema-1/)\n\
  - 关于 XML 架构的更多信息，请访问 MSDN（位于 `System.XML.Schema` 命名空间）：[`https://msdn.microsoft.com/en-us/library/System.Xml.Schema(v=vs.110).aspx`](https://msdn.microsoft.com/en-us/library/System.Xml.Schema(v=vs.110).aspx)\n\
  \nXML 架构可以包含以声明方式包含在架构中的子部分；这些子部分被称为架构 `include` 元素，如下所示：\n\n```\n<xs:include schemaLocation=\"\
  CityWeather_include.xsd\"/>\n```\n\n`schemaLocation` 属性指向要包含的文件。其他属性包括 `id` 和“任意属性”。\n\
  \n> **注意：** `include` 元素用于将具有相同目标命名空间的多个架构添加到文档中。\n\nXML 源能够处理架构的 `include` 元素。但如果您使用\
  \ XML 任务，则会失败，并收到一条说明 `include` 元素不是有效元素的语句。这正是脚本任务的用武之地。在以下示例中，您将使用两个架构以及来自 GetWeather\
  \ Web 服务的 XML 输入，该服务针对您选择的国家/地区返回所有城市。\n\n第一个架构用于验证 `WeatherSchema.xsd` 中的 `<CurrentWeather>`\
  \ 元素。\n\n```xml\n<?xml version=\"1.0\"?>\n<xs:schema xmlns:xs=\"http://www.w3.org/2001/XMLSchema\"\
  >\n  <xs:include schemaLocation=\"CityWeather_include.xsd\"/>\n  <xs:element name=\"\
  CurrentWeather\">\n    <xs:complexType>\n      <xs:sequence>\n        <xs:element\
  \ name=\"Location\" type=\"LimitedString\" />\n        <xs:element name=\"Time\"\
  \ type=\"xs:string\" />\n        <xs:element name=\"Wind\" type=\"xs:string\" />\n\
  \        <xs:element name=\"Visibility\" type=\"xs:string\" />\n        <xs:element\
  \ name=\"Temperature\" type=\"xs:string\" />\n        <xs:element name=\"DewPoint\"\
  \ type=\"xs:string\" />\n        <xs:element name=\"RelativeHumidity\" type=\"xs:string\"\
  \ />\n        <xs:element name=\"Pressure\" type=\"xs:string\" />\n        <xs:element\
  \ name=\"Status\" type=\"xs:string\" />\n      </xs:sequence>\n    </xs:complexType>\n\
  \  </xs:element>\n</xs:schema>\n```\n\n第二个架构是包含在第一个架构中的：`CityWeather_include.xsd`。\n\
  \n```xml\n<?xml version=\"1.0\"?>\n<xs:schema xmlns:xs=\"http://www.w3.org/2001/XMLSchema\"\
  >\n  <xs:simpleType name=\"LimitedString\">\n    <xs:restriction base=\"xs:string\"\
  >\n      <xs:maxLength value=\"200\" />\n    </xs:restriction>\n  </xs:simpleType>\n\
  </xs:schema>\n```\n\n它定义了一个名为 `LimitedString` 的字符串类型的长度。该长度不应超过 200 个字符。\n\n用于验证的\
  \ XML 如下所示：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<CurrentWeather>\n\
  \  <Location>Le Touquet, France (LFAT) 50-31N 001-37E 14M</Location>\n  <Time>Apr\
  \ 27, 2015 - 04:00 PM EDT / 2015.04.27 2000 UTC</Time>\n  <Wind> from the NNW (330\
  \ degrees) at 3 MPH (3 KT):0</Wind>\n  <Visibility> greater than 7 mile(s):0</Visibility>\n\
  \  <Temperature> 46 F (8 C)</Temperature>\n  <DewPoint> 33 F (1 C)</DewPoint>\n\
  \  <RelativeHumidity> 61%</RelativeHumidity>\n  <Pressure> 29.91 in. Hg (1013 hPa)</Pressure>\n\
  \  <Status>Success</Status>\n</CurrentWeather>\n```\n\n如您所见，它包含了架构中指定的所有元素。\n\n\
  #### 使用架构验证 XML\n\n有多种不同的方法来验证 XML。让我们来看一个相对简单的方法，通过连接来获取架构文件。\n\n##### 连接\n\n首先，您需要连接到架构文件，因此为此创建一个名为\
  \ `WeatherSchema` 的连接管理器，如图 7-6 所示。\n\n![A978-1-4842-0638-6_7_Fig6_HTML.jpg](img/A978-1-4842-0638-6_7_Fig6_HTML.jpg)\n\
  \n**图 7-6.** 指向 XSD 文件的连接管理器\n\n您不需要为第二个架构创建连接管理器，因为它以声明方式包含在第一个架构中。\n\n#### 代码\n\
  \n在 Foreach 循环内部添加一个脚本任务，并按如下方式配置其变量：\n\n- 只读变量：`User::City` 和 `User::Country`\n\
  - 读写变量：`User::ResultString`\n\n选择要使用的语言（C# 或 VB.NET）后，单击 **编辑脚本...** 并按照“服务引用”部分所述，创建对\
  \ GetWeather 服务的服务引用。将该引用命名为 `GetWeather`。\n\n\n\n##### 自定义命名空间\n\n你需要引用以下命名空间。这是\
  \ C# 的写法：\n\n```\n#region CustomNamespace\nusing System.ServiceModel;\nusing System.Xml;\n\
  using ST_1211e492c97246a9947e241a0234dce6.GetWeather;\nusing System.IO;\n#endregion\n\
  ```\n\n这是 VB.NET 的写法：\n\n```\n#Region \"CustomNameSpace\"\nImports ST_64feb36f55b24388a6c2553c036e36a6.GetWeather\n\
  Imports System.ServiceModel\nImports System.Xml\n#End Region\n```\n\n**注意**\n\n\
  `ST_1211e492c97246a9947e241a0234dce6` 是作者项目自动生成的名称，在你的脚本中会有所不同。我们引用它只是为了在必须使用 Web\
  \ 服务引用自动生成的命名空间时，使代码更具可读性。\n\n调用 Web 服务相当直接。\n\n```\nstring City = Dts.Variables[\"\
  City\"].Value.ToString();\nstring Country = Dts.Variables[\"Country\"].Value.ToString();\n\
  //Create a ChannelFactory of the right type\nChannelFactory<GlobalWeatherSoap> channelFactory\
  \ = null;\nEndpointAddress ep = null;\n//Specify what the address is\nstring epAdr\
  \ = Dts.Variables[\"WeatherServiceURL\"].Value.ToString();\ntry\n  {\n     //Get\
  \ the right binding\n     BasicHttpBinding httpb = new BasicHttpBinding();\n   \
  \  channelFactory = new ChannelFactory<GlobalWeatherSoap>(httpb);\n     //The necessary\
  \ endpoint with our address\n     ep = new EndpointAddress(epAdr);\n     //Ready\
  \ to create the representation of the web svc\n     GlobalWeatherSoap weatherSvcObj\
  \ = channelFactory.CreateChannel(ep);\n     //Getting some geographic info about\
  \ a country\n     string result = weatherSvcObj.GetWeather(City, Country);\n   \
  \  //Calling the validation method\n     ValidateXML(result);\n     //Save the result\
  \ in a variable for later use.\n     Dts.Variables[\"ResultString\"].Value = result;\n\
  \     Boolean fireagain = false;\n     Dts.Events.FireInformation(0,\"Calling web\
  \ service\",result,String.Empty,0, ref fireagain);\n   }\n   catch (Exception ex)\n\
  \   {\n     Dts.TaskResult = (int)ScriptResults.Failure;\n     throw ex;\n   }\n\
  ```\n\n以下是 VB.NET 中的写法：\n\n```\n'Create a ChannelFactory of the right type\nDim\
  \ channelFactory As ChannelFactory(Of GlobalWeatherSoap) = Nothing\nDim ep As EndpointAddress\
  \ = Nothing\n'Specify what the address is\nDim epAdr As String = Dts.Variables(\"\
  WeatherServiceURL\").Value.ToString\nDim city As String = Dts.Variables(\"City\"\
  ).Value.ToString\nDim country As String = Dts.Variables(\"Country\").Value.ToString\n\
  Try\n    'Get the right binding\n    Dim httpb As New BasicHttpBinding()\n    channelFactory\
  \ = New ChannelFactory(Of GlobalWeatherSoap)(httpb)\n    'The necessary endpoint\
  \ with our address\n    ep = New EndpointAddress(epAdr)\n    'Ready to create the\
  \ representation of the web svc\n    Dim weatherSvcObj As GlobalWeatherSoap = channelFactory.CreateChannel(ep)\n\
  \    'Getting some weather info about the city\n    Dim result As String = weatherSvcObj.GetWeather(city,\
  \ country)\n    Validate(result)\n    'Save the result in a variable for later use.\n\
  \    Dts.Variables(\"ResultString\").Value = result\n    Dim fireagain As [Boolean]\
  \ = False\n   Dts.Events.FireInformation(0, \"Calling web service\", result, [String].Empty,\
  \ 0, fireagain)\nCatch ex As Exception\n    Dts.TaskResult = CInt(ScriptResults.Failure)\n\
  \    Throw ex\nEnd Try\n```\n\n#### 验证 XML\n\n在代码中，你添加了一个名为 `ValidateXML` 的方法，该方法接收一个字符串作为输入，并根据提供的架构对\
  \ XML 进行验证。以下是该方法的完整代码：\n\n```\nprivate void ValidateXML(string xmlToValidate)\n\
  {\n// Try reading the XML file using the XSD. Use the\n// Connection Manager to\
  \ get the path from the XML file\ntry\n{\n    // create object for the XSD file\
  \ that will be used\n    // for validating the XML file. Use the Connection\n  \
  \  // Manager to get the path from the XSD file.\n    XmlReaderSettings xmlrs =\
  \ new XmlReaderSettings();\n    xmlrs.ValidationType = ValidationType.Schema;\n\
  \    xmlrs.Schemas.Add(null, Dts.Connections[\"WeatherSchema\"].ConnectionString);\n\
  \    xmlrs.Schemas.Compile();\n    XmlReader xmlr = XmlReader.Create(new StringReader(xmlToValidate),xmlrs);\n\
  \    while (xmlr.Read())\n    {\n    }\n    // The XML file was succesfully read.\n\
  \    // Close XML file\n    xmlr.Close();\n}\ncatch (Exception ex)\n{\n    // Validation\
  \ failed, throw error\n    Dts.Events.FireError(-1, \"Validate XML\", \"Validation\
  \ error: \" + ex.Message, string.Empty, 0);\n}\n}\n```\n\n以下是 VB.NET 中的写法：\n\n```\n\
  Private Sub ValidateXML(xmlToValidate As String)\n        ' Try reading the XML\
  \ file using the XSD. Use the\n        ' Connection Manager to get the path from\
  \ the XML file\n        Try\n                ' create object for the XSD file that\
  \ will be used\n                ' for validating the XML file. Use the Connection\n\
  \                ' Manager to get the path from the XSD file.\n                Dim\
  \ xmlrs As New XmlReaderSettings()\n                xmlrs.ValidationType = ValidationType.Schema\n\
  \                xmlrs.Schemas.Add(Nothing, Dts.Connections(\"WeatherSchema\").ConnectionString)\n\
  \                xmlrs.Schemas.Compile()\n                Dim xmlr As XmlReader\
  \ = XmlReader.Create(New StringReader(xmlToValidate), xmlrs)\n                While\
  \ xmlr.Read()\n                End While\n                ' The XML file was succesfully\
  \ read.\n                ' Close XML file\n                xmlr.Close()\n      \
  \  Catch ex As Exception\n                ' Validation failed, throw error\n   \
  \     Dts.Events.FireError(-1, \"Validate XML\", \"Validation error: \" + ex.Message,\
  \ String.Empty, 0)\n        End Try\nEnd Sub\n```\n\nXML 验证中的关键元素包括要添加到 `XmlReaderSettings`\
  \ 对象中的架构。\n\n```\nxmlrs.Schemas.Add(null, Dts.Connections[\"WeatherSchema\"].ConnectionString);\n\
  ```\n\n（这是 VB.NET 中的写法）：\n\n```\nxmlrs.Schemas.Add(Nothing, Dts.Connections(\"WeatherSchema\"\
  ).ConnectionString)\n```\n\n以及将 `XmlReaderSettings` 添加到 `XmlReader` 中，从而强制其根据架构进行验证。\n\
  \n```\nXmlReader xmlr = XmlReader.Create(new StringReader(xmlToValidate),xmlrs);\n\
  ```\n\n以下是 VB.NET 中的写法：\n\n```\nDim xmlr As XmlReader = XmlReader.Create(New System.IO.StreamReader(xmltoValidate),\
  \ xmlrs)\n```\n\n如果你要读取一个文件，而不是将 XML 字符串传递给 `XmlReader.Create` 方法，代码会更直接（无需使用 `System.IO`\
  \ 命名空间），`XmlReader` 将如下所示：\n\n```\nXmlReader xmlr = XmlReader.Create(pathToXmlFile,xmlrs);\n\
  ```\n\n这是 VB.NET 中的写法：\n\n```\nDim xmlr As XmlReader = XmlReader.Create(PathtoXmlFile,\
  \ xmlrs)\n```\n\n如果你现在运行包，它将能够通过验证而不会出现任何错误。但是，如果你修改 `CityWeather_include.xsd` 文件，并将\
  \ `maxLength` 从 200 改为 10，你将看到以下错误：\n\n```\nError: 0xFFFFFFFF at SCR_GetCityWeather_CSharp,\
  \ Validate XML: Validation error: The 'Location' element is invalid - The value\
  \ 'Le Touquet, France (LFAT) 50-31N 001-37E 14M' is invalid according to its datatype\
  \ 'LimitedString' - The actual length is greater than the MaxLength value.\n```\n\
  \n本章的完整代码和所有文件可在 第 7 章 的书籍解决方案中找到。\n\n### 总结\n\n在本章中，你学习了在 Web 服务任务无法解决问题的情况下，如何使用脚本任务。你还了解了如何在\
  \ XML 任务无法实现的方式下验证 XML。此外，你探索了需要和生成了哪类 .config 文件，并找到了避免这种情况的方法。下次在 SSIS 中处理 XML\
  \ 和 Web 服务时，请务必牢记这一点。\n\n\n\n"
- "# 脚本任务的进阶解决方案\n\n电子补充材料 本章在线版本（doi:[10.1007/978-1-4842-0638-6_8](http://dx.doi.org/10.1007/978-1-4842-0638-6_8)）包含补充材料，仅供授权用户使用。\n\
  \n本章将探讨 ETL 中常见的实际应用场景，例如文件的压缩与解压，以及加密与解密。利用.NET 脚本可以大大简化这些场景的实现。此外，如何在`Foreach`循环中使用正则表达式进行筛选呢？\n\
  \n### 正则表达式\n\n正则表达式在数据验证或清洗方面非常实用，而这些操作使用 SSIS 表达式几乎无法实现或极其困难。你可能会认为它们应该出现在数据流任务中（在第\
  \ 13 章中你将看到一些非常有帮助的示例），但它们在控制流中同样非常有用。让我们通过一个非常简化的筛选示例来比较这些表达式类型；首先使用正则表达式，然后使用\
  \ SSIS 表达式。它们都筛选`actual*.csv`和`budget*.csv`文件：\n\n```\n^(actuals|budget).*\\.csv$\n\
  ```\n\n```\nLOWER(LEFT(@[User::FilePath], 7)) == \"actuals\" || LOWER(LEFT(@[User::FilePath],\
  \ 6)) == \"budget\"\n```\n\n但如果接下来的四个字符必须是数字（如年份）呢？SSIS 表达式会变得相当复杂且难以阅读/维护，而使用正则表达式则容易得多：\n\
  \n```\n^(actuals|budget)[0-9]{4}.*\\.csv$\n```\n\n那么，如何在`Foreach`循环容器中使用正则表达式进行筛选呢？`Foreach`文件枚举器仅支持简单的通配符，例如`*.csv`，但无法通过单个`Foreach`循环容器同时筛选`actuals*.csv`和`budget*.csv`，或`*.csv`和`*.txt`。在本示例中，你在`Foreach`循环内添加一个脚本任务，用于验证由`Foreach`循环填充的变量（图\
  \ 8-1 展示了此工作流）。你需要所有`budget[年份]*.csv`和`actuals[年份]*.csv`文件，但排除其他`.csv`文件。筛选条件中的`[年份]`表示文本后应跟四位数字：例如`actuals2016.csv`或`budget2017.csv`。将`Foreach`循环中的筛选器设置为`*.csv`以尽可能筛选。当文件数量较大时，这能提供更好的性能。\n\
  \n![A978-1-4842-0638-6_8_Fig1_HTML.jpg](img/A978-1-4842-0638-6_8_Fig1_HTML.jpg)\n\
  \n图 8-1. 循环中的正则表达式筛选器\n\n#### 变量\n\n`Foreach`循环文件枚举器使用当前文件的文件路径填充字符串变量`FilePath`，但对于正则表达式筛选器，你需要两个额外的变量：\n\
  \n![A978-1-4842-0638-6_8_Fig2_HTML.jpg](img/A978-1-4842-0638-6_8_Fig2_HTML.jpg)\n\
  \n图 8-2. 正则表达式筛选器的变量\n\n- `RegexFilter`：一个字符串变量，包含用于筛选的正则表达式：`^(actuals|budget)[0-9]{4}.*\\\
  .csv$`\n- `PassRegex`：一个布尔变量，如果当前文件名通过正则表达式，则填充为`True`\n\n#### 脚本任务\n\n在你的`Foreach`循环容器中添加一个脚本任务作为首个任务。在脚本任务编辑器中，在`ReadOnlyVariables`中添加两个字符串变量：`FilePath`和`RegexFilter`，在`ReadWriteVariables`中添加布尔变量`PassRegex`（见图\
  \ 8-3）。\n\n![A978-1-4842-4842-0638-6_8_Fig3_HTML.jpg](img/A978-1-4842-0638-6_8_Fig3_HTML.jpg)\n\
  \n图 8-3. 只读与读写变量\n\n#### 脚本\n\n进入 VSTA 环境，添加以下命名空间以简化代码：\n\n```\n#region customNamespaces\n\
  \nusing System.Text.RegularExpressions;\n\nusing System.IO;\n\n#endregion\n```\n\
  \n以下是 VB.NET 代码：\n\n```\n#Region \"customNamespaces\"\n\nImports System.Text.RegularExpressions\n\
  \nImports System.IO\n\n#End Region\n```\n\n然后在`Main`方法中添加以下代码。请注意可选的`RegexOptions`，可用于使正则表达式不区分大小写。\n\
  \n```\npublic void Main()\n{\n  // 将 SSIS 变量的值存储到.NET 变量中\n  string currentFile\
  \ = Dts.Variables[\"User::FilePath\"].Value.ToString();\n  string regexPattern =\
  \ Dts.Variables[\"User::RegexFilter\"].Value.ToString();\n\n  // 从当前文件路径中移除路径\n\
  \  // d:\\sources\\myFile.csv => myFile.csv\n  currentFile = Path.GetFileName(currentFile);\n\
  \n  // 使用 SSIS 变量中的模式创建正则表达式对象。如果需要区分大小写的筛选器，可以移除 RegexOptions。\n  Regex FileFilterRegex\
  \ = new Regex(regexPattern, RegexOptions.IgnoreCase);\n\n  // 检查是否匹配，并将结果（布尔值）返回给\
  \ SSIS 变量\n  Dts.Variables[\"User::PassRegex\"].Value = FileFilterRegex.IsMatch(currentFile);\n\
  \n  // 仅为测试目的添加日志记录\n  bool fireAgain = true;\n  Dts.Events.FireInformation(0, \"\
  RegexFilter\", currentFile + \" \" + \n                     Dts.Variables[\"User::PassRegex\"\
  ].Value.ToString(), string.Empty, 0, ref fireAgain);\n\n  // 脚本任务成功完成\n  Dts.TaskResult\
  \ = (int)ScriptResults.Success;\n}\n```\n\n以下是 VB.NET 代码：\n\n```\nPublic Sub Main()\n\
  \  ' 将 SSIS 变量的值存储到.NET 变量中\n  Dim currentFile As String = Dts.Variables(\"User::FilePath\"\
  ).Value.ToString()\n  Dim regexPattern As String = Dts.Variables(\"User::RegexFilter\"\
  ).Value.ToString()\n\n  ' 从当前文件路径中移除路径\n  ' d:\\sources\\myFile.csv => myFile.csv\n\
  \  currentFile = Path.GetFileName(currentFile)\n\n  ' 使用 SSIS 变量中的模式创建正则表达式对象。如果需要区分大小写的筛选器，可以移除\
  \ RegexOptions。\n  Dim FileFilterRegex As New Regex(regexPattern, RegexOptions.IgnoreCase)\n\
  \n  ' 检查是否匹配，并将结果（布尔值）返回给 SSIS 变量\n  Dts.Variables(\"User::PassRegex\").Value =\
  \ FileFilterRegex.IsMatch(currentFile)\n\n  ' 仅为测试目的添加日志记录\n  Dim fireAgain As Boolean\
  \ = True\n  Dts.Events.FireInformation(0, \"RegexFilter\", currentFile + \" \" +\
  \ _\n                     Dts.Variables(\"User::PassRegex\").Value.ToString(), String.Empty,\
  \ 0, fireAgain)\n\n  ' 脚本任务成功完成\n  Dts.TaskResult = ScriptResults.Success\nEnd Sub\n\
  ```\n\n#### 优先约束\n\n脚本任务将`PassRegex`变量填充为`True`或`False`。你可以在优先约束的表达式中使用此变量，以决定在脚本任务之后是停止还是继续。将包含正则表达式的脚本任务连接到`Foreach`循环中的下一个任务。然后，在优先约束编辑器（见图\
  \ 8-4）中，将\"求值操作\"更改为`表达式`，并将表达式设置为以下内容：`@[User::PassRegex] == true`。或者，更简短地写成：`@[User::PassRegex]`。\n\
  \n![A978-1-4842-0638-6_8_Fig4_HTML.jpg](img/A978-1-4842-0638-6_8_Fig4_HTML.jpg)\n\
  \n图 8-4. 在优先约束编辑器中添加表达式\n\n#### 测试\n\n现在执行包，并观察\"执行结果\"选项卡。你会看到脚本任务的执行次数多于数据流任务。为了测试，你在脚本任务中添加了一些代码（见第\
  \ 4 章），用于记录哪些文件通过了正则表达式，哪些没有。\n\n![A978-1-4842-0638-6_8_Fig5_HTML.jpg](img/A978-1-4842-0638-6_8_Fig5_HTML.jpg)\n\
  \n图 8-5. 执行结果（带额外日志记录）\n\n### 压缩/解压缩\n\n在.NET Framework 4.5.3 之前，压缩和解压缩文件需要第三方程序集，因为\
  \ zip 文件并非\"开箱即用\"支持。在 4.5.3 框架中，微软终于添加了对 zip 文件的支持；但截至本书编写时，SSIS 2014 仅支持 4.5.1。如果你能升级到\
  \ 4.5.3，则这将是首选方式。\n\n\n\n#### 下载库\n\n有多种免费开源的库可用于压缩和解压缩；例如，`SharpZipLib` 和 `DotNetZip`。本示例使用\
  \ `DotNetZip`，你可以从 CodePlex 网站 [`http://dotnetzip.codeplex.com`](http://dotnetzip.codeplex.com)\
  \ 下载它。\n\n在下载的文件中搜索 `Ionic.Zip.dll`。找到如图 8-6 所示的文件。根据版本不同，它可能位于 `\\DotNetZipLib-DevKit-vX.X\\\
  zip-vX.X\\` 子文件夹中。要将此程序集注册到全局程序集缓存 (GAC)，请以管理员模式打开 Visual Studio 命令提示符（参见第 4 章）。转到程序集位置，并执行\
  \ `gacutil /i Ionic.Zip.dll`，如图 8-7 所示。\n\n![A978-1-4842-0638-6_8_Fig7_HTML.jpg](img/A978-1-4842-0638-6_8_Fig7_HTML.jpg)\n\
  \n*图 8-7.* `gacutil /i Ionic.Zip.dll`\n\n![A978-1-4842-0638-6_8_Fig6_HTML.jpg](img/A978-1-4842-0638-6_8_Fig6_HTML.jpg)\n\
  \n*图 8-6.* 在 zip 文件中，使用 `zip-v1.9/Release` 文件夹来安装 `Ionic.Zip.dll`\n\n#### 解压缩\n\n\
  在此解压缩示例中，你有一个指向 zip 文件的文件连接管理器，以及一个指向解压缩后的 `.csv` 文件的平面文件连接管理器。`Products.zip` 将被解压缩然后删除。解压缩后的\
  \ `.csv` 文件由数据流任务处理。控制流看起来类似于图 8-8。\n\n![A978-1-4842-0638-6_8_Fig8_HTML.jpg](img/A978-1-4842-0638-6_8_Fig8_HTML.jpg)\n\
  \n*图 8-8.* 控制流和连接\n\n#### 添加引用\n\n编辑脚本任务，然后打开 VSTA 环境，如图 8-9 所示，以添加对新程序集（现在位于 GAC\
  \ 中）的引用。有关添加引用的更多信息，请参见第 4 章。\n\n![A978-1-4842-0638-6_8_Fig9_HTML.jpg](img/A978-1-4842-0638-6_8_Fig9_HTML.jpg)\n\
  \n*图 8-9.* 对 `Ionic.Zip` 的引用\n\n#### 解压缩脚本\n\n在此解压缩示例中，你将使用指向 zip 文件的文件连接管理器。解压缩位置源自\
  \ zip 文件位置，但如有必要，你也可以使其可配置。\n\n此脚本逐个提取压缩文件，并过滤 `.csv` 文件。但如果你需要所有文件，也可以一次性提取所有压缩文件。该代码作为注释包含在脚本中，应替换\
  \ Foreach 循环。选择适合你的方法。你还可以检查 `myZipFile` 中的属性来设置 zip 文件属性，例如密码，以及用于大文件（>4GB）的 zip64，但这些选项未包含在示例脚本中。\n\
  \n转到 VSTA 环境并添加以下命名空间以缩短代码：\n\n```\n#region customNamespaces\nusing Ionic.Zip;\n\
  using System.IO;\n#endregion\n```\n\n以及 VB.NET 代码：\n\n```\n#Region \"customNamespaces\"\
  \nImports Ionic.Zip\nImports System.IO\n#End Region\n```\n\n接下来，将以下代码添加到 `Main`\
  \ 方法中。在此示例中，所有 `.csv` 文件都将被解压缩，并且它们会覆盖任何现有文件。\n\n```\npublic void Main()\n{\n  //\
  \ 获取 zip 文件和解压缩文件夹的文件路径\n  string myZipFilePath = Dts.Connections[\"products.zip\"\
  ].AcquireConnection(null).ToString();\n  // 确定解压缩位置。本例中为\n  // zip 文件所在的文件夹。你可以用变量或\n\
  \  // 连接管理器替换它\n  string myUnzipfolder = new FileInfo(myZipFilePath).Directory.FullName;\n\
  \n  // 创建指向实际 zip 文件的 zip 文件对象\n  using (ZipFile myZipFile = ZipFile.Read(myZipFilePath))\n\
  \  {\n    // 一次性提取所有文件（替代 foreach 循环）\n    //myZipFile.ExtractAll(myUnzipfolder,\
  \ ExtractExistingFileAction.OverwriteSilently);\n\n    // 逐个遍历 zip 文件中的所有条目\n  \
  \  foreach (ZipEntry myZipEntry in myZipFile)\n    {\n      // 过滤：仅提取 CSV 文件\n \
  \     if (myZipEntry.FileName.EndsWith(\".csv\"))\n      {\n        // 提取文件并覆盖现有文件\n\
  \        myZipEntry.Extract(myUnzipfolder, ExtractExistingFileAction.OverwriteSilently);\n\
  \      }\n    }\n  }\n  // 脚本任务成功\n  Dts.TaskResult = (int)ScriptResults.Success;\n\
  }\n```\n\n这是 VB.NET 代码：\n\n```\nPublic Sub Main()\n  ' 获取 zip 文件和解压缩文件夹的文件路径\n \
  \ Dim myZipFilePath As String = _\n                   Dts.Connections(\"products.zip\"\
  ).AcquireConnection(Nothing).ToString()\n  ' 确定解压缩位置。本例中为\n  ' zip 文件所在的文件夹。你可以用变量或\n\
  \  ' 连接管理器替换它\n  Dim myUnzipfolder As String = New FileInfo(myZipFilePath).Directory.FullName\n\
  \n  ' 创建指向实际 zip 文件的 zip 文件对象\n  Using myZipFile As ZipFile = ZipFile.Read(myZipFilePath)\n\
  \    ' 一次性提取所有文件（替代 foreach 循环）\n    'myZipFile.ExtractAll(myUnzipfolder, ExtractExistingFileAction.OverwriteSilently);\n\
  \n    ' 逐个遍历 zip 文件中的所有条目\n    For Each myZipEntry As ZipEntry In myZipFile\n  \
  \    ' 过滤：仅提取 CSV 文件\n      If myZipEntry.FileName.ToLower().EndsWith(\".csv\")\
  \ Then\n        ' 提取文件并覆盖现有文件\n        myZipEntry.Extract(myUnzipfolder, ExtractExistingFileAction.OverwriteSilently)\n\
  \      End If\n    Next\n  End Using\n  ' 脚本任务成功\n  Dts.TaskResult = ScriptResults.Success\n\
  End Sub\n```\n\n> **提示：** 你也可以使用正则表达式进行过滤。\n\n#### 压缩\n\n在此压缩示例中，你将从数据流任务中压缩平面文件指定项。为此，你将使用来自平面文件目标的平面文件连接管理器。要指定\
  \ zip 文件的名称和路径，你将使用一个指向（不存在的）zip 文件的文件连接管理器。数据流任务完成后，你将压缩所创建的 `.csv` 文件，以便进行归档、上传或通过电子邮件发送。简化的控制流可能类似于图\
  \ 8-10。\n\n![A978-1-4842-0638-6_8_Fig10_HTML.jpg](img/A978-1-4842-0638-6_8_Fig10_HTML.jpg)\n\
  \n*图 8-10.* 压缩文件\n\n#### 引用\n\n编辑脚本任务，然后打开 VSTA 环境以添加对新 `Ionic.Zip` 程序集的引用。有关添加引用的更多信息，请参见第\
  \ 4 章。另请参阅使用相同引用的解压缩示例。\n\n\n\n#### 压缩脚本\n\n如之前所述，你需要使用连接管理器来指定源文件（`Flat File: products`）和压缩文件（`File:\
  \ products.zip`）的位置。首先，添加以下命名空间以精简代码：\n\n```csharp\n#region customNamespaces\nusing\
  \ Ionic.Zip;\nusing System.IO;\n#endregion\n```\n\n以下是相应的 VB.NET 代码：\n\n```vb\n\
  #Region \"customNamespaces\"\nImports Ionic.Zip\nImports System.IO\n#End Region\n\
  ```\n\n接下来，将以下代码复制到你的 `Main` 方法中。`myZipFile` 对象拥有许多可用于调整压缩文件的属性。在下面的脚本中，我们只展示了最常用的属性，实际上还有更多。请使用\
  \ IntelliSense 探索所有属性和方法。你也可以在代码中添加一些日志记录（参见第 4 章），并在 `save` 方法周围添加 `try-catch`\
  \ 块，使你的代码更加健壮。\n\n```csharp\npublic void Main()\n{\n    // 从连接管理器中获取源文件和压缩文件名\n\
  \    string mySource = Dts.Connections[\"products\"].AcquireConnection(null).ToString();\n\
  \    string myZipFilePath = Dts.Connections[\"products.zip\"].AcquireConnection(null).ToString();\n\
  \n    // 创建一个新的压缩文件\n    using (ZipFile myZipFile = new ZipFile(myZipFilePath))\n\
  \    {\n        // 为压缩文件设置密码保护\n        myZipFile.Password = \"53cr3t!\";\n\n  \
  \      // 设置压缩级别\n        myZipFile.CompressionLevel = Ionic.Zlib.CompressionLevel.Level9;\n\
  \n        // 处理文件名中的特殊字符\n        myZipFile.AlternateEncoding = Encoding.UTF8;\n\
  \        myZipFile.AlternateEncodingUsage = ZipOption.AsNecessary;\n\n        //\
  \ 处理超大文件\n        myZipFile.UseZip64WhenSaving = Zip64Option.AsNecessary;\n\n  \
  \      // 将文件添加到压缩包的根目录\n        myZipFile.AddFile(mySource, \"\\\\\");\n\n    \
  \    // 保存压缩文件\n        myZipFile.Save();\n    }\n\n    // 脚本任务成功\n    Dts.TaskResult\
  \ = (int)ScriptResults.Success;\n}\n```\n\n以下是相应的 VB.NET 代码：\n\n```vb\nPublic Sub\
  \ Main()\n    ' 从连接管理器中获取源文件和压缩文件名\n    Dim mySource As String = _\n        Dts.Connections(\"\
