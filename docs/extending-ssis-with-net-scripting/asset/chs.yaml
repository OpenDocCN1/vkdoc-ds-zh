  \        // 失败关闭脚本任务\n        Dts.TaskResult = (int)ScriptResults.Failure;\n   \
  \ }\n}\n```\n\n这是 VB.Net 代码：\n\n```vbnet\nPublic Sub Main()\n    ' 将 SSIS 变量存储在\
  \ .Net 变量中。你可以跳过此步骤，\n    ' 并在实际的邮件代码中直接调用 SSIS 变量以减少代码行数，\n    ' 但这样做会让代码看起来更有条理。\n\
