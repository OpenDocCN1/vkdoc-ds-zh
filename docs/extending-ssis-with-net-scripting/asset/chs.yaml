  \ New CryptoStream(fsOut, alg.CreateEncryptor(), CryptoStreamMode.Write)\n\n   \
  \             ' 初始化缓冲区并分块处理输入文件。\n                ' 这样做是为了避免将整个文件（可能很大）读入内存。\n \
  \               Dim bufferLen As Integer = 4096\n                Dim buffer As Byte()\
  \ = New Byte(bufferLen - 1) {}\n                Dim bytesRead As Integer\n     \
  \           Do\n                    ' 从输入文件中读取一块数据\n                    bytesRead\
  \ = fsIn.Read(buffer, 0, bufferLen)\n                    ' 加密它\n               \
