  <Assembly: ComVisible(False)>\n\n' 如果该项目对 COM 公开，则以下 GUID 用于类型库的 ID\n<Assembly:\
  \ Guid(\"4d9b8fe7-8cfa-45ea-98e5-0eec88be0a93\")>\n\n' 程序集的版本信息包含以下四个值：\n'\n'  \
  \    主版本\n'      次版本\n'      内部版本号\n'      修订号\n'\n' 你可以指定所有值，也可以使用 '*' 为内部版本号和修订号指定默认值，如下所示：\n\
  ' <Assembly: AssemblyVersion(\"1.0.*\")>\n<Assembly: AssemblyVersion(\"1.0.0.0\"\
  )>\n<Assembly: AssemblyFileVersion(\"1.0.0.0\")>\n```\n\n第二个文件是 `main.cs`。同样，只需打开你的示例脚本并将内容复制到\
  \ BIMLScript 中，但首先要将 `<` 和 `>` 替换为 `&gt；` 和 `&lt；`；否则，XML 标签会混乱。将其粘贴到第二个文件标签中：\n\
  \n```csharp\n#region Namespaces\nusing System;\nusing System.Data;\nusing Microsoft.SqlServer.Dts.Pipeline.Wrapper;\n\
  using Microsoft.SqlServer.Dts.Runtime.Wrapper;\n#endregion\n\n/// <summary>\n///\
  \ 行号转换，用于创建标识列\n/// </summary>\n[Microsoft.SqlServer.Dts.Pipeline.SSISScriptComponentEntryPointAttribute]\n\
  public class ScriptMain : UserComponent\n{\n    int rownumber = 0;\n\n    /// <summary>\n\
  \    /// 从变量获取起始行号\n    /// </summary>\n    public override void PreExecute()\n\
  \    {\n        rownumber = this.Variables.Seed;\n    }\n\n    /// <summary>\n \
  \   /// 填充行号列，然后递增行号\n    /// </summary>\n    /// <param name=\"Row\">当前正在通过组件的行</param>\n\
  \    public override void Input0_ProcessInputRow(Input0Buffer Row)\n    {\n    \
  \    Row.SurrogateKey = rownumber;\n        rownumber++;\n    }\n}\n```\n\n以下是 VB.NET\
  \ 代码：\n\n```vbnet\n#Region \"Imports\"\nImports System\nImports System.Data\nImports\
  \ System.Math\nImports Microsoft.SqlServer.Dts.Pipeline.Wrapper\nImports Microsoft.SqlServer.Dts.Runtime.Wrapper\n\
  #End Region\n\n'行号转换，用于创建标识列\n<Microsoft.SqlServer.Dts.Pipeline.SSISScriptComponentEntryPointAttribute>\
  \ _\n<CLSCompliant(False)> _\nPublic Class ScriptMain\n    Inherits UserComponent\n\
  \n    Dim rownumber As Integer = 0\n\n    '从变量获取起始行号\n    Public Overrides Sub PreExecute()\n\
  \        rownumber = Me.Variables.Seed\n    End Sub\n\n    '填充行号列，然后递增行号\n    Public\
  \ Overrides Sub Input0_ProcessInputRow(ByVal Row As Input0Buffer)\n        Row.SurrogateKey\
  \ = rownumber\n        rownumber = rownumber + 1\n    End Sub\nEnd Class\n```\n\n\
  \"内部\"项目的最后一步是添加输入和输出列。在此示例中，只有一个名为 `SurrogateKey` 的输出列。这也应添加到 `ScriptComponentProject`\
  \ 标签内。\n\n```xml\n<InputBuffer Name=\"Input0\">\n  <Columns>\n    <!-- 没有输入列 -->\n\
  \  </Columns>\n</InputBuffer>\n<OutputBuffers>\n  <OutputBuffer Name=\"Output0\"\
  >\n    <Columns>\n      <Column Name=\"SurrogateKey\" DataType=\"Int32\"></Column>\n\
  \    </Columns>\n  </OutputBuffer>\n</OutputBuffers>\n```\n\n在 `Data Flow Task`\
  \ 中，你可以添加对你刚创建的项目的引用。由于输出列的名称与添加到目标表的新列名称相同，因此你无需添加任何映射。将此内容添加到 `Row Count` 转换和\
  \ `OLE DB Destination` 之间：\n\n```xml\n<ScriptComponentTransformation Name=\"SCR\
  \ - Rownumber\">\n  <ScriptComponentProjectReference ScriptComponentProjectName=\"\
  SurrogateKeyScript\" />\n</ScriptComponentTransformation>\n```\n\n现在，通过右键单击杂项文件夹中的\
  \ BIMLScript 来重新生成包。替换现有包。最好先关闭这些包，如果它们仍在 Visual Studio 中打开的话；否则，你会收到重新加载请求。\n\n\
  如果 BIMLScript 变得太大，你可以将部分内容（例如 `ScriptProjects`）移动到一个单独的 BIML 文件中，然后使用包含标签将此文件嵌入到主\
  \ BIML 文件中。\n\n```html\n<#@ include file=\"ScriptProjects.biml\" #>\n```\n\n当然，`ScriptProjects.biml`\
  \ 文件包含在生成包时替换包含标签的确切 XML。这使你的 BIMLScript 更加紧凑和清晰。此外，这也使得在其他 BIML 文件中重用部分内容变得更加容易。\n\
  \n\n#### BIMLScript：主包\n\n既然你已经创建了几十个阶段包，还需要生成一个主包；否则，你最终将不得不手动添加大量执行包任务。以下是一个简单主包的基本\
  \ BIML 代码。它生成一个名为`Master.dtsx`的包，并包含一个执行包任务。\n\n```\n<Biml ExternalRef\"> http://schemas.varigence.com/biml.xsd`\
  \ `\">\n  <Packages>\n    <Package\n      Name=\"Master\"\n      ConstraintMode=\"\
  Parallel\"\n      AutoCreateConfigurationsType=\"None\"\n      ProtectionLevel=\"\
  EncryptSensitiveWithUserKey\">\n      <Tasks>\n        <!--执行项目包-->\n        <ExecutePackage\
  \ Name=\"EPT - stg_Person\">\n          <ExternalProjectPackage Package=\"stg_Person.dtsx\"\
  \ />\n        </ExecutePackage >\n      </Tasks>\n    </Package>\n  </Packages>\n\
  </Biml>\n```\n\n首先，在底部指定编程语言并添加对`System.IO`的导入。如果你更偏好 VB 语言，请将`C#`替换为`VB`。\n\n```\n\
  <!--C#的包含/导入-->\n<#@ template language=\"C#\" hostspecific=\"true\"#>\n<#@ import\
  \ namespace=\"System.IO\"#>\n```\n\n接下来，在`Tasks`标签内部以及执行包任务周围添加一个循环。此循环可能与第一个示例中的循环类似，但您也可以遍历文件。在本例中，您将遍历当前\
  \ SSIS 项目的项目文件夹。如有必要，请更改`D:\\stageAW\\`路径。\n\n```\n<!-- 从文件系统中的 SSIS 项目文件夹获取所有暂存包\
  \ -->\n<#\nstring[] myStagingfiles = Directory.GetFiles(@\"D:\\stageAW\\\", \"stg_*.dtsx\"\
  );\nforeach(string fileName in myStagingfiles) {\n  FileInfo stagePackage = new\
  \ FileInfo(fileName);\n  // 移除扩展名，因为任务名中不允许包含\".\" \n  string nameOnly = Path.GetFileNameWithoutExtension(stagePackage.Name);\n\
  #>\n<!--执行项目包-->\n<ExecutePackage Name=\"EPT - <#=nameOnly#>\">\n  <ExternalProjectPackage\
  \ Package=\"<#=stagePackage.Name#>\" />\n</ExecutePackage>\n<# } #>\n```\n\n这是 VB.NET\
  \ 代码：\n\n```\n<!-- 从文件系统中的 SSIS 项目文件夹获取所有暂存包 -->\n<#\nDim myStagingfiles As String()\
  \ = Directory.GetFiles(\"D:\\stageAW\\\",\"stg_*.dtsx\")\nFor Each fileName As String\
  \ In myStagingfiles\n  Dim stagePackage As New FileInfo(fileName)\n  ' 移除扩展名，因为任务名中不允许包含\"\
  .\" \n  Dim nameOnly As String = Path.GetFileNameWithoutExtension(stagePackage.Name)\n\
  #>\n<!--执行项目包-->\n<ExecutePackage Name=\"EPT - <#=nameOnly#>\">\n  <ExternalProjectPackage\
  \ Package=\"<#=stagePackage.Name#>\" />\n</ExecutePackage>\n<# Next #>\n```\n\n\
  图 18-4 展示了包含执行包任务的简化主包。\n\n![A978-1-4842-0638-6_18_Fig4_HTML.jpg](img/A978-1-4842-0638-6_18_Fig4_HTML.jpg)\n\
  \n**图 18-4.** 包含执行包任务的简化主包\n\n> **提示：** 如果你想在将.NET 代码添加到 BIML 之前进行测试，可以使用类似 LINQPad\
  \ ([`www.linqpad.net`](http://www.linqpad.net/)) 的工具来测试代码片段。\n\n### 总结\n\n在本章中，你学习了如何生成包。第一个包可能比使用拖放操作花费的时间稍长，但如果你必须手动创建几十个乏味的包，那么生成方式是最佳选择。\n\
  \n有两种方式：.NET 程序集和 BIML。坚定的.NET 开发者可能更喜欢第一种，但 BIML 正变得越来越流行。作为一名 ETL 顾问，你应该掌握其中一种方法。本章中的所有示例都非常简单，但目的是向你展示最基础的内容。网上有大量可用的资源，特别是关于\
  \ BIML 的（[`http://bimlscript.com`](http://bimlscript.com/)）。\n\n---\n\n"
- "# 19. 在.NET 中执行包\n\n**电子补充材料** 本章的在线版本 (doi:[10.1007/978-1-4842-0638-6_19](http://dx.doi.org/10.1007/978-1-4842-0638-6_19))\
  \ 包含补充材料，仅供授权用户使用。\n\n本章将向你展示如何从.NET 应用程序执行包，该应用程序可以是 Web 应用程序、Web 服务、Windows 服务或\
  \ Windows 应用程序。由于有两种部署模型，因此也有两种不同的方式来执行包；但有一个要求：你需要在与应用程序相同的机器上安装 SQL Server Integration\
  \ Services。包将在此机器上运行。如果在你的环境中无法做到这一点，你可以在机器 A 上创建一个 Web 服务来本地执行包，然后从运行在机器 B 的应用程序调用该\
  \ Web 服务。另一种替代方案是让机器 B 上的代码在机器 A 上执行一个远程 SQL Server 代理作业，以在本地执行包。在这两种情况下，应用程序都在机器\
  \ B 上运行，但包在机器 A 上运行。\n\n如果你使用的是 Integration Services 目录（项目部署模型），你也可以远程执行该数据库中的存储过程。\n\
  \n### 包部署模型\n\n第一个示例使用了一个 Windows 应用程序来运行存储在文件系统中的包。请确保你有一个可用于操作的虚拟包。你可以创建一个新包，并添加一个触发警告事件的脚本任务（示例见第\
  \ 4 章）。\n\n要创建此 Windows 应用程序，你需要一个包含 C#或 VB.NET 模板的 Visual Studio 版本；仅 SSDT for\
  \ BI 或 BIDS 是不够的（更多细节见第 16 章）。\n\n启动 Visual Studio 并创建一个名为`MySsisApplication`的新\
  \ Windows 窗体应用程序项目。确保选择适当的.NET Framework 版本。在此示例中，你将使用.NET Framework 4 来执行一个 SSIS\
  \ 2012 包。从图 19-1 开始的截图来自 Visual Studio 2013。\n\n![A978-1-4842-0638-6_19_Fig1_HTML.jpg](img/A978-1-4842-0638-6_19_Fig1_HTML.jpg)\n\
  \n**图 19-1** 用于执行 SSIS 包的 Windows 窗体应用程序\n\n#### 添加引用\n\n首先，你需要添加对 SSIS 的引用，特别是对`Microsoft.SqlServer.ManagedDTS.dll`的引用，该\
  \ DLL 位于 Windows 的全局程序集缓存中。在解决方案资源管理器中，右键单击“引用”（在 VB 中，右键单击项目），然后选择**添加引用...**。接着浏览到正确的程序集。如果你的开发机器上安装了多个版本的\
  \ SSIS，请确保选择正确的版本。每个 SSIS 版本都有其自己的文件夹。文件路径中的`X`因版本而异。\n\n`C:\\Windows\\Microsoft.NET\\\
  assembly\\GAC_MSIL\\Microsoft.SqlServer.ManagedDTS\\v4.0_1X.0.0.0__89845dcd8080cc91\\\
  Microsoft.SqlServer.ManagedDTS.dll`\n\n在图 19-2 中，你看到了三个版本：`v4.0_11` (SSIS 2012)、`v4.0_12`\
  \ (SSIS 2014) 和 `v4.0_13` (SSIS 2016)。\n\n![A978-1-4842-0638-6_19_Fig2_HTML.jpg](img/A978-1-4842-0638-6_19_Fig2_HTML.jpg)\n\
  \n**图 19-2** 添加对 `Microsoft.SqlServer.ManagedDTS.dll` 的引用\n\n#### 创建窗体\n\n打开`Form1`文件，添加一个名为`btnStart`的按钮和一个名为`lblStatus`的标签。你可以在工具箱中找到它们。完成后，你的窗体应类似于图\
  \ 19-3 所示。\n\n![A978-1-4842-0638-6_19_Fig3_HTML.jpg](img/A978-1-4842-0638-6_19_Fig3_HTML.jpg)\n\
  \n**图 19-3** 一个仅包含一个按钮和一个标签的简单窗体\n\n\n\n#### 代码\n\n现在双击 Start 按钮（`btnStart`）来创建一个\
  \ `onClick` 事件处理程序。代码页面将打开，并创建一个名为 `btnStart_Click` 的新方法。\n\n```\nprivate void btnStart_Click(object\
  \ sender, EventArgs e)\n\n{\n\n}\n```\n\n这是 VB.NET 代码：\n\n```\nPrivate Sub btnStart_Click(sender\
  \ As Object, e As EventArgs) Handles _\n                                       \
  \                      btnStart.Click\nEnd Sub\n```\n\n你需要将代码添加到此方法中，但首先需要添加一个额外的命名空间来缩短代码。对于\
  \ VB.NET 项目，导入的命名空间是项目的属性，但你也可以像在脚本任务或脚本组件中那样，将导入代码添加到代码顶部。\n\n```\n#region CustomNamespace\n\
  using Microsoft.SqlServer.Dts.Runtime;\n#endregion\n```\n\n这是 VB.NET 代码：\n\n```\n\
  #Region \"CustomNamespace\"\nImports Microsoft.SqlServer.Dts.Runtime\n#End Region\n\
  ```\n\n现在回到按钮的代码。此示例使用 `myApplication.LoadPackage` 从文件系统加载包，但你也可以使用 `LoadFromSqlServer`\
  \ 或 `LoadFromDtsServer` 从 MSDB 或包存储区加载包。如果你在 `myApplication` 后面输入一个点，IntelliSense\
  \ 将显示所有可能的选项。\n\n在这段代码中，你需要将引用修改为你自己的示例包。在下面那一行，有一段用于设置变量值的代码。要么删除该行，要么向示例包中添加一个变量。\n\
  \n```\nprivate void btnStart_Click(object sender, EventArgs e)\n{\n    // 实例化 SSIS\
  \ 应用程序对象\n    Microsoft.SqlServer.Dts.Runtime.Application myApplication =\n    \
  \                    new Microsoft.SqlServer.Dts.Runtime.Application();\n\n    //\
  \ 从文件系统加载包\n    //（对于基于 SQL Server 的包，请使用 LoadFromSqlServer）\n    lblStatus.Text\
  \ = \"Loading package from file system.\";\n    Package myPackage = myApplication.LoadPackage(@\"\
  D:\\myPackage.dtsx\", null);\n\n    // 可选：设置其中一个 SSIS 包变量的值\n    myPackage.Variables[\"\
  User::myVar\"].Value = \"test123\";\n\n    // 执行包\n    lblStatus.Text = \"Executing\
  \ package\";\n    DTSExecResult myResult = myPackage.Execute();\n\n    // 显示执行结果\n\
  \    lblStatus.Text = \"Package result: \" + myResult.ToString();\n}\n```\n\n这是\
  \ VB.NET 代码：\n\n```\nPrivate Sub btnStart_Click(sender As Object, e As EventArgs)\
  \ Handles btnStart.Click\n    ' 实例化 SSIS 应用程序对象\n    Dim myApplication As Application\
  \ = New Application()\n\n    ' 从文件系统加载包\n    '（对于基于 SQL Server 的包，请使用 LoadFromSqlServer）\n\
  \    lblStatus.Text = \"Loading package from file system.\"\n    Dim myPackage As\
  \ Package = _\n                     myApplication.LoadPackage(\"D:\\myPackage.dtsx\"\
  , Nothing)\n\n    ' 可选：设置其中一个 SSIS 包变量的值\n    myPackage.Variables(\"User::myVar\"\
  ).Value = \"test123\"\n\n    ' 执行包\n    lblStatus.Text = \"Executing package\"\n\
  \    Dim myResult As DTSExecResult = myPackage.Execute()\n\n    ' 显示执行结果\n    lblStatus.Text\
  \ = \"Package result: \" + myResult.ToString()\nEnd Sub\n```\n\n#### 日志记录\n\n由于此示例适用于使用包部署模型的包，因此没有像目录中那样的默认日志记录可用。如果你要记录到表、文本文件等，并希望在\
  \ Windows 应用程序中显示这些信息，则需要为此添加自定义代码。不过，也可以从包中获取警告和错误，并在简单的列表框中显示这些消息，例如。首先，向表单中添加一个名为\
  \ `lbLog` 的列表框。它应该看起来类似于图 19-4 所示。\n\n![A978-1-4842-0638-6_19_Fig4_HTML.jpg](img/A978-1-4842-0638-6_19_Fig4_HTML.jpg)\n\
  \n图 19-4.\n\n扩展了用于日志消息的列表框的简单表单\n\n接下来，你需要将警告和错误添加到列表框中。一个缺点是它们来自两个不同的集合。如果你想按出现的顺序显示它们，则必须合并并排序。在此示例中，你将错误和警告都存储在一个临时数据表中，以便将它们排序后添加到列表框中。你可以将此代码添加到\
  \ `btnStart_Click` 方法的底部。请注意，这是一种快速但不完善的显示日志的方式，它确实有效，但还有更复杂的方法或更方便的控件来完成此操作。然而，我们还是把重点放在\
  \ SSIS 内容上。\n\n```\n// 创建一个临时表来存储警告和错误\nDataTable myLogTable = new DataTable(\"\
  myLogTable\");\nmyLogTable.Columns.Add(\"LogTime\", typeof(DateTime));\nmyLogTable.Columns.Add(\"\
  Source\", typeof(string));\nmyLogTable.Columns.Add(\"Message\", typeof(string));\n\
  \n// 遍历所有警告并将其添加到表中\nforeach (DtsWarning packageWarning in myPackage.Warnings)\n\
  {\n    myLogTable.Rows.Add(Convert.ToDateTime(packageWarning.TimeStamp), packageWarning.Source,\
  \ packageWarning.Description);\n}\n\n// 遍历所有错误并将其添加到表中\nforeach (DtsError packageError\
  \ in myPackage.Errors)\n{\n    myLogTable.Rows.Add(Convert.ToDateTime(packageError.TimeStamp),\
  \ packageError.Source, packageError.Description);\n}\n\n// 创建排序视图，然后利用它创建一个新的数据表\n\
  myLogTable.DefaultView.Sort = \"LogTime\";\nDataTable myLogTableSorted = myLogTable.DefaultView.ToTable();\n\
  \n// 清理资源\nmyLogTable.Dispose();\n\n// 遍历新的排序数据集并将行添加到列表框中\nforeach (DataRow row\
  \ in myLogTableSorted.Rows)\n{\n    lbLog.Items.Add(row.Field<DateTime>(0).ToLongTimeString()\
  \ + \" - \" + row.Field<string>(1) + \" - \" + row.Field<string>(2));\n}\n\n// 清理资源\n\
  myLogTableSorted.Dispose();\n```\n\n这是 VB.NET 代码：\n\n```\n' 创建一个临时表来存储警告和错误\nDim\
  \ myLogTable As DataTable = New DataTable(\"myLogTable\")\nmyLogTable.Columns.Add(\"\
  LogTime\", GetType(DateTime))\nmyLogTable.Columns.Add(\"Source\", GetType(String))\n\
  myLogTable.Columns.Add(\"Message\", GetType(String))\n\n' 遍历所有警告并将其添加到表中\nFor Each\
  \ packageWarning As DtsWarning In myPackage.Warnings\n    myLogTable.Rows.Add(Convert.ToDateTime(packageWarning.TimeStamp),\
  \ packageWarning.Source, packageWarning.Description)\nNext\n\n' 遍历所有错误并将其添加到表中\n\
  For Each packageError As DtsError In myPackage.Errors\n    myLogTable.Rows.Add(Convert.ToDateTime(packageError.TimeStamp),\
  \ packageError.Source, packageError.Description)\nNext\n\n' 创建排序视图，然后利用它创建一个新的数据表\n\
  myLogTable.DefaultView.Sort = \"LogTime\"\nDim myLogTableSorted As DataTable = myLogTable.DefaultView.ToTable()\n\
  \n' 清理资源\nmyLogTable.Dispose()\n\n' 遍历新的排序数据集并将行添加到列表框中\nFor Each row As DataRow\
  \ In myLogTableSorted.Rows\n    lbLog.Items.Add(row.Field(Of DateTime)(0).ToLongTimeString()\
  \ + \" - \" + row.Field(Of String)(1) + \" - \" + row.Field(Of String)(2))\nNext\n\
  \n' 清理资源\nmyLogTableSorted.Dispose()\n```\n\n\n\n#### 结果\n\n现在运行应用程序并点击“开始”按钮。检查包日志，确认包是否确实已执行。如前所述，验证日志是否正常工作的一个简单方法是在示例包中添加一个脚本任务来触发一些警告和/或错误（有关触发事件的示例，请参见第\
  \ 4 章）。\n\n如果您遇到以下错误，说明您可能正在使用旧版本的 Visual Studio（2010）：\n\n`The Execute method on\
  \ the task returned error code 0x80131621 (Mixed mode assembly is built against\
  \ version 'v2.0.50727' of the runtime and cannot be loaded in the 4.0 runtime without\
  \ additional configuration information.). The Execute method must succeed, and indicate\
  \ the result using an \"out\" parameter.`\n\n解决方案是告知 Visual Studio，允许在 4.0 应用程序中使用\
  \ .NET Framework 2.0 代码。您可以通过在 `App.config` 文件的 startup 标记中添加 `useLegacyV2RuntimeActivationPolicy=\"\
  true\"` 属性来实现。如果您没有 `App.config` 文件，可以在解决方案资源管理器中右键单击项目，然后依次选择**添加** > **新建项** >\
  \ **应用程序配置文件** > **App.config** 来添加一个，该文件的外观应类似于图 19-5。\n\n![A978-1-4842-0638-6_19_Fig5_HTML.jpg](img/A978-1-4842-0638-6_19_Fig5_HTML.jpg)\n\
