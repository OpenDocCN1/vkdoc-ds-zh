  \ `Dts.TaskResult = Dts.TaskResult.Failure`。\n\n\n\n### 变量与参数\n\nSSIS 2012 的包变量引入了可在脚本任务中使用的参数。您可以使用它们来避免在脚本中硬编码值，或者调整脚本中的变量值，以便在其他任务或表达式中使用。有两种不同的方法。在此示例中，您将统计一个文件夹中的文件数量。文件夹路径将由字符串变量或参数提供，文件数量将存储在一个整数变量中。\n\
  \n**注意**：参数是只读的。您无法更改它们，如果尝试更改，将会出现以下错误：`Exception has been thrown by the target\
  \ of an invocation.`\n\n首先，创建一个名为 `variables.dtsx` 的新包，并在控制流中添加一个脚本任务。为脚本任务取一个有用的名称，如\
  \ `SCR – Count Files`。接下来，创建一个字符串变量（或字符串包参数，或字符串项目参数），将其命名为 `FolderPath`，并填入一个现有目录的路径。同时创建一个名为\
  \ `FileCount` 的整数（`Int32`）变量，用于存储文件数量。图 4-6 显示了这两个变量。\n\n![A978-1-4842-0638-6_4_Fig6_HTML.jpg](img/A978-1-4842-0638-6_4_Fig6_HTML.jpg)\n\
  \n图 4-6. 为 `FileCount` 和 `FolderPath` 使用变量\n\n#### 方法 1：ReadOnlyVariables 和 ReadWriteVariables\n\
  \n对于第一种方法，您需要在脚本任务编辑器中填写 `ReadOnlyVariables` 和 `ReadWriteVariables` 属性，以便这些变量在运行时被脚本任务锁定。可以通过键入名称或使用选择窗口（点击选中字段时出现的带三个点的按钮）来完成。将字符串变量名称\
  \ `FolderPath`（或其中一个字符串参数）添加为只读变量，并将整数变量 `FileCount` 添加为读写变量。\n\n![A978-1-4842-0638-6_4_Fig7_HTML.jpg](img/A978-1-4842-0638-6_4_Fig7_HTML.jpg)\n\
  \n图 4-7. 选择您想要使用的变量（或参数）\n\n填写完 `ReadOnlyVariables` 和 `ReadWriteVariables` 属性后，您可以单击\
