  \ VB.NET 代码：\n\n```vbnet\n#Region \"Imports\"\nImports System\nImports System.Data\n\
  Imports System.Math\nImports Microsoft.SqlServer.Dts.Runtime\n#End Region\n\n#Region\
  \ \"customNamespaces\"\nImports System.IO\n#End Region\n\n' 这是一个关于如何在脚本任务中使用变量和参数的示例。\n\
  ' 它从变量或参数中获取文件夹路径，统计其中的文件数量，\n' 并将文件计数填充到读写整数变量中。\n<Microsoft.SqlServer.Dts.Tasks.ScriptTask.SSISScriptTaskEntryPointAttribute()>\
  \ _\n<System.CLSCompliantAttribute(False)> _\nPartial Public Class ScriptMain\n\
  \    Inherits Microsoft.SqlServer.Dts.Tasks.ScriptTask.VSTARTScriptObjectModelBase\n\
  \n    ' 获取文件夹并统计其中的文件数量，将文件计数传递给 SSIS 变量\n    Public Sub Main()\n        ' 锁定变量以供读取或写入\n\
  \        Dts.VariableDispenser.LockForRead(\"User::FolderPath\")\n        Dts.VariableDispenser.LockForRead(\"\
  $Package::FolderPath\")\n        Dts.VariableDispenser.LockForRead(\"$Project::FolderPath\"\
  )\n        Dts.VariableDispenser.LockForWrite(\"User::FileCount\")\n\n        '\
  \ 创建一个变量“容器”来存储变量\n        Dim vars As Variables = Nothing\n\n        ' 从 VariableDispenser\
  \ 将变量添加到变量容器中\n        Dts.VariableDispenser.GetVariables(vars)\n\n        ' 首先创建一个\
  \ .NET 字符串变量来存储路径。在本示例中虽然有些冗余，\n        ' 但您可以添加额外步骤，例如验证文件夹是否存在。\n        ' 然后选择要用来获取路径的变量或参数。此处我使用了变量。\n\
  \        Dim myFolder As String = vars(\"User::FolderPath\").Value.ToString()\n\n\
  \        ' 从我的文件夹中获取文件计数，并将该数字存储到\n        ' SSIS 整数变量中。\n        vars(\"User::FileCount\"\
  ).Value = Directory.GetFiles(myFolder, \"*.*\",  _\n            SearchOption.TopDirectoryOnly).Length\n\
  \n        ' 释放锁\n        vars.Unlock()\n\n        ' 以成功结果关闭脚本\n        Dts.TaskResult\
  \ = ScriptResults.Success\n    End Sub\nEnd Class\n```\n\n如果只需锁定一个变量进行读取或写入，可以使用\
  \ `LockOneForRead` 和 `LockOneForWrite` 方法。这样代码会少一些，但结果类似。这里仅展示 `Main` 方法中的替代代码。额外的\
  \ using/import 语句与之前相同。\n\n```csharp\npublic void Main()\n{\n    // 创建一个变量“容器”来存储变量\n\
  \    Variables vars = null;\n\n    // 锁定变量以供读取，并将其添加到变量“容器”中\n    Dts.VariableDispenser.LockOneForRead(\"\
  User::FolderPath\", ref vars);\n\n    // 首先创建一个 .NET 字符串变量来存储路径。在本示例中虽然有些冗余，\n \
  \   // 但您可以添加额外步骤，例如验证文件夹是否存在。\n    // 然后选择要用来获取路径的变量或参数。此处我使用了变量\n    string myFolder\
  \ = vars[\"User::FolderPath\"].Value.ToString();\n\n    // 释放锁\n    vars.Unlock();\n\
  \n    // 锁定变量以供写入，并将其添加到变量容器中\n    Dts.VariableDispenser.LockOneForWrite(\"User::FileCount\"\
  , ref vars);\n\n    // 从我的文件夹中获取文件计数，并将该数字存储到\n    // SSIS 整数变量中。\n    vars[\"User::FileCount\"\
  ].Value = Directory.GetFiles(myFolder, \"*.*\",\n        SearchOption.TopDirectoryOnly).Length;\n\
  \n    // 释放锁\n    vars.Unlock();\n\n    // 以成功结果关闭脚本\n    Dts.TaskResult = (int)ScriptResults.Success;\n\
  }\n```\n\n以下是 VB.NET 代码：\n\n```vbnet\nPublic Sub Main()\n    ' 创建一个变量“容器”来存储变量\n\
  \    Dim vars As Variables = Nothing\n\n    ' 锁定变量以供读取，并将其添加到变量“容器”中\n    Dts.VariableDispenser.LockOneForRead(\"\
  User::FolderPath\", vars)\n    ' Dts.VariableDispenser.LockOneForRead(\"$Package::FolderPath\"\
  , vars)\n    ' Dts.VariableDispenser.LockOneForRead(\"$Project::FolderPath\", vars)\n\
  \n    ' 首先创建一个 .NET 字符串变量来存储路径。在本示例中虽然有些冗余，\n    ' 但您可以添加额外步骤，例如验证文件夹是否存在。\n   \
  \ ' 然后选择要用来获取路径的变量或参数。此处我使用了变量\n    Dim myFolder As String = vars(\"User::FolderPath\"\
  ).Value.ToString()\n\n    ' 释放锁\n    vars.Unlock()\n\n    ' 锁定变量以供写入，并将其添加到变量“容器”中\n\
  \    Dts.VariableDispenser.LockOneForWrite(\"User::FileCount\", vars)\n\n    ' 从我的文件夹中获取文件计数，并将该数字存储到\n\
  \    ' SSIS 整数变量中。\n    vars(\"User::FileCount\").Value = Directory.GetFiles(myFolder,\
  \ \"*.*\", SearchOption.TopDirectoryOnly).Length\n\n    ' 释放锁\n    vars.Unlock()\n\
  \n    ' 以成功结果关闭脚本\n    Dts.TaskResult = ScriptResults.Success\nEnd Sub\n```\n\n\
  #### 两种方法的优缺点\n\n使用变量分配器方法时，在锁定和解锁变量方面有更多控制权。其最大缺点是无法快速查看正在使用哪些变量，必须检查整个代码。另一个缺点是完成相同功能需要更多代码。因此，第一种方法应是首选方法。并且，使用第一种方法时也可以手动解锁变量：\n\
  \n```csharp\nif (Dts.Variables.Count > 0)\n{\n    Dts.Variables.Unlock();\n}\n```\n\
  \n以下是 VB.NET 代码：\n\n```vbnet\nIf (Dts.Variables.Count > 0) Then\n    Dts.Variables.Unlock()\n\
  End If\n```\n\n#### 父包变量\n\n父包是指通过执行包任务执行另一个包（子包）的包。在子包中，可以通过脚本任务读取和写入父包中的变量，但这些变量仅在运行时模式下可用，在设计时模式下不可用。这意味着无法使用选择窗口，但可以手动输入。在脚本任务中，两种方法都可用于读取/写入父包变量。\n\
  \n但有一个缺点：如果没有适当的错误处理，在没有父包的情况下将无法运行子包，因为它期望的变量不可用。读取父包变量的另一种方法是使用父包配置，但这种方式仅支持读取，不支持写入。\n\
  \n### 引用程序集\n\n有时你会在多个脚本任务中重复使用同一段代码。如果由于某种原因需要更改这段代码，则必须编辑所有使用该代码的脚本任务。为避免这种情况，可以创建程序集并在脚本任务中引用它。程序集是一段可供\
  \ .NET 应用程序使用的预编译代码。你可以创建程序集来存储常用的方法。如果需要更改其中某个方法，则只需更改程序集（而无需更改所有脚本任务）。\n\n第三方公司（包括\
  \ Microsoft）也可以为你创建程序集；例如，用于解压缩文件或通过 SFTP 下载文件的程序集。因此，你无需重复造轮子。在后续的某些章节中，你将学习如何使用这些第三方程序集。在本章中，你将学习如何创建一个简单的程序集并在脚本任务中使用它。\n\
  \n\n#### 创建程序集\n\n若要创建自己的程序集，则需要使用 Visual Studio 的“完整”版本，或者至少是支持 C# 或 VB.NET 项目的版本（仅限\
  \ BIDS 或 SSDT BI 是不够的）。在此示例中，你将创建一个包含用于验证电子邮件地址格式方法的程序集。启动 Visual Studio 并创建一个名为\
  \ `myMethodsForSSIS` 的新类库项目。此模板可在 Visual Basic 和 Visual C# 下找到（参见图 4-8）。确保选择了正确的\
  \ .NET Framework 版本（参见表 4-1）；否则将无法引用它。通过一些额外步骤，可以引用较低版本的 .NET，但无法引用更高 .NET 版本的程序集。\n\
  \n**表 4-1.** 选择正确的 .NET Framework 版本\n\n| SSIS 版本 | 支持的框架 |\n| --- | --- |\n| 2005\
  \ | 2.0 |\n| 2008 (R2) | 2.0 => 3.5 |\n| 2012 | 2.0 => 4.0 |\n| 2014 | 2.0 => 4.5.1\
  \ |\n\n![A978-1-4842-0638-6_4_Fig8_HTML.jpg](img/A978-1-4842-0638-6_4_Fig8_HTML.jpg)\n\
  \n**图 4-8.** 新建类库项目\n\n创建新项目时，`Class1.cs` 或 `Class1.vb` 文件几乎是空的。首先在 `Class1` 文件的顶部添加\
  \ `usings` 或 `imports`。C# 文件已经有一些 `using` 语句，但 VB.NET 文件没有。它们位于项目属性中，但为了保持示例一致，我们也将其添加到文件中。\n\
  \n```csharp\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\n\
  using System.Text;\nusing System.Text.RegularExpressions;   // 已添加\n```\n\n这是 VB.NET\
  \ 代码：\n\n```vb\nImports System\nImports System.Collections.Generic\nImports System.Linq\n\
  Imports System.Text\nImports System.Text.RegularExpressions  ' 已添加\n```\n\n下一步是命名空间和类声明。你将使用一个包含静态方法的静态类，以便在脚本任务中直接调用这些方法。VB.NET\
  \ 中静态类的等价物是包含函数的模块。有关静态类的更多信息，请参阅 [`http://msdn.microsoft.com/en-us/library/79b3xss3.aspx`](http://msdn.microsoft.com/en-us/library/79b3xss3.aspx)。有关模块的更多信息，请参阅\
  \ [`http://msdn.microsoft.com/en-us/library/aaxss7da.aspx`](http://msdn.microsoft.com/en-us/library/aaxss7da.aspx)。类名/模块名为\
  \ `EmailMethods`，命名空间为 `myMethodsForSSIS`。\n\n```csharp\nnamespace myMethodsForSSIS\n\
  {\n    // 一个包含电子邮件方法的静态类\n    public static class EmailMethods\n    {\n    }\n}\n\
  ```\n\n这是 VB.NET 代码：\n\n```vb\nNamespace myMethodsForSSIS\n    ' 一个包含电子邮件方法的模块\n\
  \    Public Module EmailMethods\n    End Module\nEnd Namespace\n```\n\n代码的最后一步是将一个用于验证电子邮件地址格式的公共静态方法添加到\
  \ C# 类，或将一个公共函数添加到 VB.NET 模块。它被命名为 `IsCorrectEmail`，接收一个电子邮件地址作为输入并返回布尔值 `true`\
  \ 或 `false`，指示格式是否正确。你可以从本书附带的源代码中复制该方法。完成后，完整代码如下所示。\n\n```csharp\nusing System;\n\
  using System.Collections.Generic;\nusing System.Linq;\nusing System.Text;\nusing\
  \ System.Text.RegularExpressions;   // 已添加\n\nnamespace myMethodsForSSIS\n{\n  \
  \  // 一个包含电子邮件方法的静态类\n    public static class EmailMethods\n    {\n        // 一个通过正则表达式模式验证电子邮件地址的布尔方法。\n\
  \        public static bool IsCorrectEmail(String emailAddress)\n        {\n   \
  \         // 电子邮件地址的正则表达式模式\n            string emailAddressPattern = @\"^(([^<>()[\\\
  ]\\\\.,;:\\s@\\\"\"]+\"\n                + @\"(\\.[^<>()[\\]\\\\.,;:\\s@\\\"\"]+)*)|(\\\
  \"\".+\\\"\"))@\"\n                + @\"((\\[[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\"\
  \n                + @\"\\.[0-9]{1,3}\\])|(([a-zA-Z\\-0-9]+\\.)+\"\n            \
  \    + @\"[a-zA-Z]{2,}))$\";\n\n            // 使用模式创建一个正则表达式对象\n            Regex\
  \ emailAddressRegex = new Regex(emailAddressPattern);\n\n            // 检查是否匹配并返回该值（布尔值）\n\
  \            return emailAddressRegex.IsMatch(emailAddress);\n        }\n    }\n\
  }\n```\n\n这是 VB.NET 代码：\n\n```vb\nImports System.Collections.Generic\nImports System.Linq\n\
  Imports System.Text\nImports System.Text.RegularExpressions  ' 已添加\n\nNamespace\
  \ myMethodsForSSIS\n    ' 一个包含电子邮件方法的模块\n    Public Module EmailMethods\n      \
  \  ' 一个通过正则表达式模式验证电子邮件地址的布尔方法。\n        Public Function IsCorrectEmail(emailAddress\
  \ As [String]) As Boolean\n            ' 电子邮件地址的正则表达式模式\n            Dim emailAddressPattern\
  \ As String = \"^(([^<>()[\\]\\\\.,;:\\s@\\\"\"]+\" &\n                \"(\\.[^<>()[\\\
  ]\\\\.,;:\\s@\\\"\"]+)*)|(\\\"\".+\\\"\"))@\" &\n                \"((\\[[0-9]{1,3}\\\
  .[0-9]{1,3}\\.[0-9]{1,3}\" &\n                \"\\.[0-9]{1,3}\\])|(([a-zA-Z\\-0-9]+\\\
  .)+\" &\n                \"[a-zA-Z]{2,}))$\"\n\n            ' 使用模式创建一个正则表达式对象\n\
  \            Dim emailAddressRegex As New Regex(emailAddressPattern)\n\n       \
  \     ' 检查是否匹配并返回该值（布尔值）\n            Return emailAddressRegex.IsMatch(emailAddress)\n\
  \        End Function\n    End Module\nEnd Namespace\n```\n\n##### 强名称\n\n在 SSIS\
  \ 脚本任务中使用新程序集之前，必须先为其赋予强名称。进入项目属性，然后转到“签名”页面。选中“为程序集签名”复选框，然后在下拉列表中添加一个新的密钥文件。此示例的名称为\
  \ `PublicPrivateKeyFile.snk`，签名算法为 `sha256RSA`，不设置密码（参见图 4-9）。单击“确定”按钮后，新的密钥文件将在解决方案资源管理器中可见。\n\
  \n![A978-1-4842-0638-6_4_Fig9_HTML.jpg](img/A978-1-4842-0638-6_4_Fig9_HTML.jpg)\n\
  \n**图 4-9.** 添加密钥文件（C# 项目，VB.NET 与此类似）\n\n现在关闭项目属性，并将项目生成为 Release 版本，而不是默认的 Debug\
  \ 模式。你可以在 Visual Studio 工具栏中进行更改。生成项目时，程序集将使用此新密钥文件进行签名。\n\n**注意：**添加强名称并非安全措施，它仅提供唯一标识。\n\
  \n##### 全局程序集缓存\n\n准备程序集的最后一步是将其添加到 SSIS 计算机的全局程序集缓存 (GAC) 中。SSIS 只能使用通过 GAC 可用的程序集。以管理员身份打开\
  \ Visual Studio（2008/2010 等）命令提示符；否则无法将程序集添加到 GAC。进入项目的 `Bin\\Release` 文件夹，你将在此处找到新创建的程序集的\
  \ `.dll` 文件。执行以下命令将其添加到 GAC（参见图 4-10）：\n\n![A978-1-4842-0638-6_4_Fig10_HTML.jpg](img/A978-1-4842-0638-6_4_Fig10_HTML.jpg)\n\
  \n**图 4-10.** .NET 全局程序集缓存实用工具\n\n```\ngacutil /i myMethodsForSSIS.dll\n```\n\n\
  如果服务器上没有 `gacutil`（通常服务器未安装 Visual Studio 时会出现此情况），则可以使用 PowerShell 部署程序集（本书附带的源代码中提供了示例脚本），或者可以在\
  \ Visual Studio 中创建一个安装和部署项目来为程序集创建安装程序。根据 Visual Studio 版本，安装程序项目位于**其他项目类型** >\
  \ **安装程序** > **部署项目**中。对于 Visual Studio 2013 及更高版本，你需要下载此项目模板：[`https://visualstudiogallery.msdn.microsoft.com/9abe329c-9bba-44a1-be59-0fbf6151054d`](https://visualstudiogallery.msdn.microsoft.com/9abe329c-9bba-44a1-be59-0fbf6151054d)。\n\
  \n\n\n#### 生成事件\n\n如果你不想在每次更改程序集后都通过命令提示符将其添加到 GAC，你也可以在 Visual Studio 项目中添加一个生成后事件。在解决方案资源管理器中右键单击你的程序集项目，进入其属性。对于\
  \ C#，你可以转到“生成事件”选项卡，找到生成后事件命令行（见图 4-11）。对于 VB.NET，你需要转到“编译”选项卡，点击右下角的“生成事件”按钮，然后找到相同的生成后事件命令行（见图\
  \ 4-12）。\n\n![A978-1-4842-0638-6_4_Fig12_HTML.jpg](img/A978-1-4842-0638-6_4_Fig12_HTML.jpg)\n\
  \n图 4-12. VB.NET 的生成后事件\n\n![A978-1-4842-0638-6_4_Fig11_HTML.jpg](img/A978-1-4842-0638-6_4_Fig11_HTML.jpg)\n\
  \n图 4-11. C# 的生成后事件\n\n现在复制以下命令，但请修改`gacutil`的路径。该路径取决于.NET Framework 的版本，甚至 Windows\
  \ 的版本。此示例适用于 Windows 7 上的.NET 3.5。\n\n```\ncd $(ProjectDir)\n\n@SET GACUTIL=\"C:\\\
  Program Files (x86)\\Microsoft SDKs\\Windows\\v7.0A\\bin\\gacutil.exe\"\n\nEcho\
  \ 将 dll 安装到 GAC 中\n\nEcho $(OutDir)\n\nEcho $(TargetFileName)\n\n%GACUTIL% -if \"\
  $(OutDir)$(TargetFileName)\"\n```\n\n以下是一些备选路径：\n\n```\nC:\\Program Files (x86)\\\
  Microsoft SDKs\\Windows\\v7.0A\\Bin\\NETFX 4.0 Tools\\gacutil.exe (Win7 上的 .NET\
  \ 4.0)\n\nC:\\Program Files (x86)\\Microsoft SDKs\\Windows\\v8.1A\\bin\\NETFX 4.5.1\
  \ Tools\\gacutil.exe (Win8.1 上的 .NET 4.5.1)\n```\n\n现在，你可以通过生成程序集项目来将其添加到 GAC，但你需要以管理员身份运行\
  \ Visual Studio，否则无法生效。要在脚本任务中使用该程序集，你还需要考虑实际 dll 文件的位置。对于 SSIS 2005，必须将`.dll`文件放入\
  \ SQL Server 的 Assemblies 文件夹：`C:\\Program Files\\Microsoft SQL Server\\90\\SDK\\\
  Assemblies\\`。对于较新版本，你可以将其放在任何位置。你可以手动完成此操作，但也可以向生成后事件添加一些额外的行：\n\n```\n@SET DLLDIR=\"\
  C:\\Program Files (x86)\\Microsoft SQL Server\\100\\DTS\\Assemblies\\\"\n\nEcho\
  \ 将文件复制到 Assemblies\n\ncopy \"$(OutDir)$(TargetFileName)\" %DLLDIR%\n```\n\n####\
  \ 在脚本任务中添加引用\n\n现在，你可以在脚本任务中添加对新创建程序集的引用。对于 C#，在解决方案资源管理器中右键单击“引用”，然后选择“添加引用”（见图\
  \ 4-13）。对于 VB.NET，在解决方案资源管理器中右键单击项目，然后选择“添加引用”（见图 4-14）。现在浏览到你的`.dll`文件，然后点击“确定”以添加它。“浏览”按钮的位置因\
  \ Visual Studio 版本而异。添加新引用后，你需要点击“全部保存”以保存内部项目及其新引用。在较新版本的 Visual Studio（2014）中，这个强制的“全部保存”步骤不再是必需的。\n\
  \n![A978-1-4842-0638-6_4_Fig14_HTML.jpg](img/A978-1-4842-0638-6_4_Fig14_HTML.jpg)\n\
  \n图 4-14. 在 VB.NET 脚本任务中添加引用\n\n![A978-1-4842-0638-6_4_Fig13_HTML.jpg](img/A978-1-4842-0638-6_4_Fig13_HTML.jpg)\n\
  \n图 4-13. 在 C#脚本任务中添加引用\n\n注意：添加对第三方程序集的引用与添加对你自己程序集的引用方式相同。\n\n以下是在脚本任务中使用该程序集的示例代码。要测试此代码，你首先需要创建一个名为`emailaddress`的\
  \ SSIS 字符串变量，并用有效的电子邮件地址填充它。然后添加一个新的脚本任务，并在脚本任务编辑器中选择该字符串变量作为 ReadOnlyVariable。\n\
  \n现在进入 VSTA 环境，并将程序集`myMethodsForSSIS`添加为引用。为了编写更紧凑的代码，你可以添加一个额外的 using/import。请注意，在\
  \ VB.NET 代码中导入 VB 程序集的方式略有不同。\n\n```\n#region customNamespaces\n\nusing myMethodsForSSIS;\n\
  \n#endregion\n```\n\n这是 VB.NET 代码：\n\n```\n#region customNamespaces\n\nImports myMethodsForSSIS.myMethodsForSSIS\n\
  \n#End Region\n```\n\n现在是在`Main`方法中的实际代码。脚本使用一个变量作为电子邮件方法的参数，该方法使用正则表达式检查格式。如果格式正确，则脚本任务成功。如果不正确，则脚本任务失败，同时还会触发一个错误事件，说明脚本任务失败的原因。有关为了日志记录目的而触发事件的详细说明，请参阅本章的最后一部分。\n\
  \n```\npublic void Main()\n{\n  // 从变量中获取电子邮件地址\n  string email = Dts.Variables[\"\
  User::emailaddress\"].Value.ToString();\n\n  // 如果电子邮件的格式不正确，则让脚本任务失败\n  if (EmailMethods.IsCorrectEmail(email))\n\
  \  {\n    Dts.TaskResult = (int)ScriptResults.Success;\n  }\n  else\n  {\n    //\
  \ 通过触发错误事件来显示脚本任务失败的原因\n    Dts.Events.FireError(0, \"电子邮件检查\", \"格式不正确:\" + email,\
  \ string.Empty, 0);\n    Dts.TaskResult = (int)ScriptResults.Failure;\n  }\n}\n\
  ```\n\n这是 VB.NET 代码：\n\n```\nPublic Sub Main()\n  ' 从变量中获取电子邮件地址\n  Dim email As\
  \ String = Dts.Variables(\"User::emailaddress\").Value.ToString()\n\n  ' 如果电子邮件地址的格式不正确，则让脚本任务失败\n\
  \  If (IsCorrectEmail(email)) Then\n    Dts.TaskResult = ScriptResults.Success\n\
  \  Else\n    Dts.Events.FireError(0, \"电子邮件检查\", \"格式不正确:\" + email, String.Empty,\
  \ 0)\n    Dts.TaskResult = ScriptResults.Failure\n  End If\nEnd Sub\n```\n\n###\
  \ 连接管理器\n\n集成服务使用连接管理器来提供对各种数据源的访问，例如平面文件和数据库，也包括 Web 服务器或 FTP 服务器，或消息队列。你可以在脚本任务中使用这些连接管理器，以避免硬编码的路径和连接字符串。如果以正确的方式使用，你甚至可以让他们参与\
  \ MSDTC 事务，但仅限于支持它的连接管理器。\n\n\n\n#### 文件连接管理器\n\n首先，我们来介绍用于文件和文件夹的连接管理器，例如文件、平面文件和\
  \ Excel。在脚本任务中使用连接管理器有两种不同的方法。第一种方法是仅从连接管理器中获取属性，例如从平面文件连接管理器中获取 `ConnectionString`\
  \ 属性，或从 Excel 连接管理器中获取 `ExcelFilePath` 属性。\n\n在第一个代码示例中，您需要一个指向现有文本文件的文件或平面文件连接管理器。只要连接管理器名为\
  \ `myFlatFile` 并且文件中包含一些数据，其内容就无关紧要。脚本将获取文件路径，并通过检查文件大小来判断文件是否包含数据。它使用了 `System.IO`\
  \ 命名空间中的 `FileInfo`，您需要将其添加为 using/import 指令。\n\n```\n#region customNamespaces\n\
  using System.IO;\n#endregion\n```\n\n以下是 VB.NET 代码：\n\n```\n#region customNamespaces\n\
  Imports System.IO\n#End Region\n```\n\n现在来看 `Main` 方法中的实际代码：\n\n```csharp\npublic\
  \ void Main()\n{\n    // 声明字符串变量，并用平面文件的连接字符串填充它。\n    string filePath = Dts.Connections[\"\
  myFlatFile\"].ConnectionString;\n\n    // 声明文件信息对象，并用字符串变量中的文件路径填充它。\n    // 然后将实际文件大小填充到一个\
  \ bigint 变量中，用于下一个 if 语句\n    FileInfo fi = new FileInfo(filePath);\n    Int64 length\
  \ = fi.Length;\n\n    // 当文件大小为 0 字节时，使脚本失败\n    if (length.Equals(0))\n    {\n\
  \        Dts.TaskResult = (int)ScriptResults.Failure;\n    }\n    else\n    {\n\
  \        Dts.TaskResult = (int)ScriptResults.Success;\n    }\n}\n```\n\n以下是 VB.NET\
  \ 代码：\n\n```vbnet\nPublic Sub Main()\n    ' 声明字符串变量，并用平面文件的连接字符串填充它。\n    Dim filePath\
  \ As String = Dts.Connections(\"myFlatFile\").ConnectionString\n\n    ' 声明文件信息对象，并用字符串变量中的文件路径填充它。\n\
  \    ' 然后将实际文件大小填充到一个 bigint 变量中，用于下一个 if 语句\n    Dim fi As FileInfo = New FileInfo(filePath)\n\
  \    Dim length As Int64 = fi.Length\n\n    ' 当文件大小为 0 字节时，使脚本失败\n    If (length.Equals(0))\
  \ Then\n        Dts.TaskResult = ScriptResults.Failure\n    Else\n        Dts.TaskResult\
  \ = ScriptResults.Success\n    End If\nEnd Sub\n```\n\n当您使用 Excel 文件时，不能使用整个 `ConnectionString`\
  \ 属性，因为它包含的不仅仅是文件路径。下一个示例通过使用子字符串方法，从名为 `myExcel` 的 Excel 连接管理器的连接字符串中提取文件路径。它被存储在一个字符串变量中，您可以在实际代码中使用该变量。\n\
  \n```csharp\n// 声明字符串变量，并用 Excel 文件的连接字符串填充它。\nstring filePath = Dts.Connections[\"\
  myExcel\"].ConnectionString;\n\n// 对于 Excel 连接，您只需要连接字符串的一部分：\n// ======================================================================\n\
  // Provider=Microsoft.Jet.OLEDB.4.0;Data Source=D:\\MyExcelFile.xls;\n// Extended\
  \ Properties=\"Excel 8.0;HDR=YES\";\n// Provider=Microsoft.ACE.OLEDB.12.0;Data Source=D:\\\
  MyExcelFile.xlsx;\n// Extended Properties=\"Excel 12.0 XML;HDR=YES\";\n// ======================================================================\n\
  // 您只需要 'Source=' 之后到下一个分号 (;) 之前的部分\nfilePath = filePath.Substring(filePath.IndexOf(\"\
  Source=\") + 6);\nfilePath = filePath.Substring(1, filePath.IndexOf(\";\") - 1);\n\
  ```\n\n以下是 VB.NET 代码：\n\n```vbnet\n' 声明字符串变量，并用 Excel 文件的连接字符串填充它。\nDim filePath\
  \ As String = Dts.Connections(\"myExcel\").ConnectionString\n\n' 对于 Excel 连接，您只需要连接字符串的一部分：\n\
  ' ======================================================================\n' Provider=Microsoft.Jet.OLEDB.4.0;Data\
  \ Source=D:\\MyExcelFile.xls;\n' Extended Properties=\"Excel 8.0;HDR=YES\";\n' Provider=Microsoft.ACE.OLEDB.12.0;Data\
  \ Source=D:\\MyExcelFile.xlsx;\n' Extended Properties=\"Excel 12.0 XML;HDR=YES\"\
  ;\n' ======================================================================\n' 您只需要\
  \ 'Source=' 之后到下一个分号 (;) 之前的部分\nfilePath = filePath.Substring(filePath.IndexOf(\"\
  Source=\") + 6)\nfilePath = filePath.Substring(1, filePath.IndexOf(\";\") - 1)\n\
  ```\n\n另一个技巧是先创建一个连接管理器变量，并用对 Excel 连接管理器的引用来填充它。然后，您可以读取 `ExcelFilePath` 属性来获取文件路径，而不是完整的连接字符串。然后它将文件路径存储在一个字符串变量中，您可以在实际代码中使用该变量。\n\
  \n```csharp\n// 获取 Excel 连接管理器以读取其属性\nConnectionManager myExcelConn = Dts.Connections[\"\
  myExcel\"];\n\n// 声明字符串变量，并用 Excel 连接管理器的 ExcelFilePath 属性填充它。\nstring filePath\
  \ = myExcelConn.Properties[\"ExcelFilePath\"].GetValue(myExcelConn).ToString();\n\
  ```\n\n以下是 VB.NET 代码：\n\n```vbnet\n' 获取 Excel 连接管理器以读取其属性\nDim myExcelConn As ConnectionManager\
  \ = Dts.Connections(\"myExcel\")\n\n' 声明字符串变量，并用 Excel 连接管理器的 ExcelFilePath 属性填充它。\n\
  Dim filePath As String = myExcelConn.Properties(\"ExcelFilePath\").GetValue(myExcelConn).ToString()\n\
  ```\n\n第一种方法的一个很大缺点是它不会验证连接管理器上的表达式。如果您在 Foreach 循环容器中使用它，可能会导致一些意外结果。通过使用 `AcquireConnection`\
  \ 方法，您可以克服这个问题，因为它会强制 SSIS 重新评估连接管理器上的任何表达式。以下两个示例用平面文件的文件路径填充了同一个字符串变量：\n\n```csharp\n\
  // 声明字符串变量，并用平面文件的连接字符串填充它。\nstring filePath = Dts.Connections[\"myFlatFile\"].AcquireConnection(Dts.Transaction).ToString();\n\
  \n// 或者一个稍微复杂一些但适用于更多连接管理器类型的版本\n// 声明对象变量以引用连接管理器\nobject rawConnection = Dts.Connections[\"\
  myFlatFile\"].AcquireConnection(Dts.Transaction);\n\n// 声明字符串变量，并用平面文件的连接字符串填充它。\n\
  string filePath = rawConnection.ToString();\n```\n\n以下是 VB.NET 代码：\n\n```vbnet\n\
  ' 声明字符串变量，并用平面文件的连接字符串填充它。\nDim filePath As String = Dts.Connections(\"myFlatFile\"\
  ).AcquireConnection(Dts.Transaction).ToString()\n\n' 或者一个稍微复杂一些但适用于更多连接管理器类型的版本\n\
  ' 声明对象变量以存储连接管理器\nDim rawConnection As Object = Dts.Connections(\"myFlatFile\").AcquireConnection(Dts.Transaction)\n\
  \n' 声明字符串变量，并用平面文件的连接字符串填充它。\nDim filePath As String = rawConnection.ToString()\n\
  \n' 还有，可选地手动释放连接管理器，以让 SSIS 知道您已完成操作\nDts.Connections(\"myFlatFile\").ReleaseConnection(rawConnection)\n\
  ```\n\n> **注意**：如果您不想使用 MSDTC 事务，则可以将 `AcquireConnection` 的参数 `Dts.Transaction`\
  \ 替换为 `null`。\n\n\n\n对于`OLE DB`和`ADO.NET 连接管理器`也可以采用相同的方法，但要注意在`脚本任务`中使用数据库连接管理器。如果可以使用`执行\
  \ SQL 任务`（例如执行查询或存储过程），则不要不必要地使用它们。在`脚本任务`中连接数据库的首选连接管理器是`ADO.NET 连接管理器`。`OLE DB`也可以使用，但难度要大得多，并且有一些限制，例如无法传递当前事务，并且不遵守`保留同一连接`属性。这是因为`脚本任务`具有托管代码，可以更好地与其他托管代码交互，而`OLE\
  \ DB`提供程序是使用非托管代码制作的。\n\n以下代码是在`脚本任务`中使用数据库连接管理器的一个非常简化的示例。使用`执行 SQL 任务`可以更轻松地完成此操作，但本书后面将介绍更复杂的示例。在此示例中，您在`ReadWriteVariables`属性中添加了一个名为`sqlServerVersion`的\
  \ SSIS 字符串变量。它将被`脚本任务`填充 SQL Server 版本信息。另外，请确保您的包中有一个名为`myADONETConnection`的`ADO.NET\
  \ 连接管理器`。\n\n此示例使用`SqlClient`程序集，您将添加它作为使用/导入以缩短代码。\n\n```\n#region customNamespaces\n\
  using System.Data.SqlClient;\n#endregion\n```\n\n以下是 VB.NET 代码：\n\n```\n#region\
  \ customNamespaces\nImports System.Data.SqlClient\n#End Region\n```\n\n现在来看`Main`方法中的实际代码。\n\
  \n```\npublic void Main()\n{\n    // 声明一个 SqlClient 连接，并将您的 ADO.NET 连接管理器分配到此连接。\n\
  \    SqlConnection myADONETConnection = (SqlConnection)\n    Dts.Connections[\"\
  myADONETConnection\"].AcquireConnection(Dts.Transaction);\n\n    // 使用查询创建字符串变量\n\
  \    string myQueryText = \"SELECT @@version as SqlVersion\";\n\n    // 创建一个 SqlClient\
  \ 命令以在其中存储查询。本例中是一个获取 SQL 版本的简单查询\n    SqlCommand myQuery = new SqlCommand(myQueryText,\
  \ myADONETConnection);\n\n    // 执行查询并将结果存储在 SqlClient 数据读取器对象中\n    SqlDataReader\
  \ myQueryResult = myQuery.ExecuteReader();\n\n    // 转到数据读取器的第一条记录\n    myQueryResult.Read();\n\
  \n    // 将 'SqlVersion' 列的值存储在 SSIS 字符串变量中\n    Dts.Variables[\"User::sqlServerVersion\"\
  ].Value = myQueryResult[\"SqlVersion\"].ToString();\n\n    // 成功关闭脚本任务\n    Dts.TaskResult\
  \ = (int)ScriptResults.Success;\n}\n```\n\n这是 VB.NET 代码：\n\n```\nPublic Sub Main()\n\
  \    ' 声明一个 SqlClient 连接，并将您的 ADO.NET 连接管理器分配到此连接\n    Dim myADONETConnection As\
  \ SqlConnection = DirectCast(Dts.Connections(\"myADONETConnection\") _\n    .AcquireConnection(Dts.Transaction),\
  \ SqlConnection)\n\n    ' 使用查询创建字符串变量\n    Dim myQueryText As String = \"SELECT\
  \ @@version as SqlVersion\"\n\n    ' 创建一个 SqlClient 命令以在其中存储查询。本例中是一个获取 SQL 版本的简单查询\n\
  \    Dim myQuery As SqlCommand = New SqlCommand(myQueryText, myADONETConnection)\n\
  \n    ' 执行查询并将结果存储在 SqlClient 数据读取器对象中\n    Dim myQueryResult As SqlDataReader =\
  \ myQuery.ExecuteReader()\n\n    ' 转到数据读取器的第一条记录\n    myQueryResult.Read()\n\n \
  \   ' 将 SqlVersion 列的值存储在 SSIS 字符串变量中\n    Dts.Variables(\"User::sqlServerVersion\"\
  ).Value = myQueryResult(\"SqlVersion\").ToString()\n\n    ' 成功关闭脚本任务\n    Dts.TaskResult\
  \ = ScriptResults.Success\nEnd Sub\n```\n\n正如我之前所说，让`OLE DB`版本正常工作要困难得多。`AcquireConnection`方法不能用于`OLE\
  \ DB`连接管理器，因为它返回一个本机 COM 对象。在此示例中，您需要一个名为`myOLEDBConnection`的`OLE DB 连接管理器`，以及在`ReadWriteVariable`属性中与上一个示例相同的`sqlServerVersion`字符串变量。解决方法是，将`OLE\
  \ DB`连接管理器的`InnerObject`强制转换为`IDTSConnectionManagerDatabaseParameters100`接口（SSIS\
  \ 2005 使用 90 而不是 100）。为此，您首先必须在 VSTA 项目中添加对`Microsoft.SqlServer.DTSRuntimeWrap.dll`的引用。该程序集可以在\
  \ GAC 64 位文件夹中找到。文件夹路径应类似于：`C:\\Windows\\Microsoft.NET\\assembly\\GAC_64\\Microsoft.SqlServer.DTSRuntimeWrap\\\
  v4.0_11.0.0.0__89845dcd8080cc91\\`。\n\n对于 C#，转到 VSTA 项目的解决方案资源管理器，右键单击“引用”。选择“添加引用”以打开“添加引用”窗口（参见图\
  \ 4-15）。您可以在较新版本的 Visual Studio 中搜索它，或浏览到它。在“浏览”选项卡中，您可以浏览到正确的文件夹。选择程序集并单击“确定”以添加新引用。添加引用后，如果您使用的是\
  \ Visual Studio 2010 或更低版本，则必须单击“全部保存”按钮！\n\n![A978-1-4842-0638-6_4_Fig15_HTML.jpg](img/A978-1-4842-0638-6_4_Fig15_HTML.jpg)\n\
  \n**图 4-15.** 在 C# 项目中添加对`DTSRuntimeWrap.dll`的引用\n\n对于 VB.NET，转到 VSTA 项目的解决方案资源管理器，右键单击该项目。选择“添加引用”以打开“添加引用”窗口（参见图\
  \ 4-16）。在“浏览”选项卡中，您可以浏览到正确的文件夹。选择程序集并单击“确定”以添加新引用。添加引用后，必须单击“全部保存”按钮！\n\n![A978-1-4842-0638-6_4_Fig16_HTML.jpg](img/A978-1-4842-0638-6_4_Fig16_HTML.jpg)\n\
  \n**图 4-16.** 在 VB 项目中添加对`DTSRuntimeWrap.dll`的引用\n\n添加两个额外的 using/imports 以缩短代码：一个用于`OLE\
  \ DB`，另一个用于新添加的引用。\n\n```\n#region customNamespaces\nusing System.Data.SqlClientOleDb;\n\
  using Microsoft.SqlServer.Dts.Runtime.Wrapper;\n#endregion\n```\n\n以下是 VB.NET 代码：\n\
  \n```\n#region customNamespaces\nImports System.Data.SqlClient\nusing Microsoft.SqlServer.Dts.Runtime.Wrapper\n\
  #End Region\n```\n\n接下来是`Main`方法的实际代码。主要的代码差异主要体现在代码的开头部分。其余部分看起来与 ADO.NET 示例非常相似。\n\
  \n```\npublic void Main()\n{\n    // 将连接存储在连接管理器对象中\n    ConnectionManager myConnectionManager\
  \ = Dts.Connections[\"myOLEDBConnection\"];\n\n    // 将连接管理器的 InnerObject 强制转换为\n\
  \    // IDTSConnectionManagerDatabaseParameters100\n    // 接口（SSIS 2005 使用 90 而不是\
  \ 100）。\n    IDTSConnectionManagerDatabaseParameters100 cmParams;\n    cmParams\
  \ = myConnectionManager.InnerObject as IDTSConnectionManagerDatabaseParameters100;\n\
  \n    // 从 IDTSConnectionManagerDatabaseParameters100 对象获取连接\n    OleDbConnection\
  \ myConnection = cmParams.GetConnectionForSchema() as OleDbConnection;\n\n    //\
  \ 使用查询创建字符串变量\n    string myQueryText = \"SELECT @@version as SqlVersion\";\n\n\
  \    // 创建一个新的 OleDbCommand 对象以在其中存储查询。\n    OleDbCommand myQuery = new OleDbCommand(myQueryText,\
  \ myConnection);\n\n    // 执行查询并将结果存储在 OleDb DataReader 对象中\n    OleDbDataReader\
  \ myQueryResult = myQuery.ExecuteReader();\n\n    // 转到数据读取器的第一条记录\n    myQueryResult.Read();\n\
  \n    // 将 SqlVersion 列的值存储在 SSIS\n    // 字符串变量中\n    Dts.Variables[\"User::sqlServerVersion\"\
  ].Value = myQueryResult[\"SqlVersion\"].ToString();\n\n    // 成功关闭脚本任务\n    Dts.TaskResult\
  \ = (int)ScriptResults.Success;\n}\n```\n\n以下是 VB.NET 代码：\n\n```\nPublic Sub Main()\n\
  \    ' 将连接存储在连接管理器对象中\n    Dim myConnectionManager As ConnectionManager = Dts.Connections(\"\
  myOLEDBConnection\")\n\n    ' 将连接管理器的 InnerObject 强制转换为\n    ' IDTSConnectionManagerDatabaseParameters100\n\
  \    ' 接口（SSIS 2005 使用 90 而不是 100）。\n    Dim cmParams As IDTSConnectionManagerDatabaseParameters100\n\
  \    cmParams = CType(myConnectionManager.InnerObject, IDTSConnectionManagerDatabaseParameters100)\n\
  \n    ' 从 IDTSConnectionManagerDatabaseParameters100 对象获取连接\n    Dim myConnection\
  \ As OleDbConnection = CType(cmParams.GetConnectionForSchema(), OleDbConnection)\n\
  \n    ' 使用查询创建字符串变量\n    Dim myQueryText As String = \"SELECT @@version as SqlVersion\"\
  \n\n    ' 创建一个新的 OleDbCommand 对象以在其中存储查询。\n    Dim myQuery As OleDbCommand = New\
  \ OleDbCommand(myQueryText, myConnection)\n\n    ' 执行查询并将结果存储在 OleDb DataReader\
  \ 对象中\n    Dim myQueryResult As OleDbDataReader = myQuery.ExecuteReader()\n\n  \
  \  ' 转到数据读取器的第一条记录\n    myQueryResult.Read()\n\n    ' 将 SqlVersion 列的值存储在 SSIS 字符串变量中\n\
  \    Dts.Variables(\"User::sqlServerVersion\").Value = myQueryResult(\"SqlVersion\"\
  ).ToString()\n\n    ' 成功关闭脚本任务\n    Dts.TaskResult = ScriptResults.Success\nEnd\
  \ Sub\n```\n\n\n以下是根据您的要求翻译的中文版本：\n\n\n```vb\nDim myConnectionManager As ConnectionManager\
  \ = Dts.Connections(\"myOLEDBConnection\")\n' 将连接管理器的 InnerObject 转换为 IDTSConnectionManagerDatabaseParameters100\n\
  ' 接口（SSIS 2005 使用 90 而非 100）。\nDim cmParams As IDTSConnectionManagerDatabaseParameters100\n\
  cmParams = TryCast(myConnectionManager.InnerObject, IDTSConnectionManagerDatabaseParameters100)\n\
  ' 从 IDTSConnectionManagerDatabaseParameters100 对象获取连接\nDim myConnection As OleDbConnection\
  \ = DirectCast(cmParams.GetConnectionForSchema(), OleDbConnection)\n' 创建一个新的 OleDbCommand\
  \ 对象以存储查询。\nDim myQuery As OleDbCommand = New OleDbCommand(\"SELECT @@version as\
  \ SqlVersion\", myConnection)\n' 执行查询并将结果存储在 OleDb DataReader 对象中\nDim myQueryResult\
  \ As OleDbDataReader = myQuery.ExecuteReader()\n' 移动到 DataReader 的第一条记录\nmyQueryResult.Read()\n\
  ' 将 SqlVersion 列的值存储在 SSIS 字符串变量中\nDts.Variables(\"User::sqlServerVersion\").Value\
  \ = myQueryResult(\"SqlVersion\").ToString()\n' 成功关闭脚本任务\nDts.TaskResult = ScriptResults.Success\n\
  End Sub\n```\n\n> **注意：** 如果不希望使用这种复杂的方法，也可以直接使用 OLE DB 连接管理器的 `ConnectionString`\
  \ 属性来创建新连接。\n\n### 日志记录事件\n\n当你想将脚本任务的消息记录到 SSIS 日志时，必须通过代码引发事件。这些消息是否显示在日志中取决于所选的日志级别（项目部署）或日志记录配置（包部署）。脚本任务可以通过调用\
  \ `Dts` 对象的 `Events` 属性上的事件触发方法来引发事件。在此示例中，你将检查文件连接管理器中的文件是否存在且包含数据。\n\n创建一个名为 `myFile`\
  \ 的文件或平面文件连接管理器，指向一个任意文本文件。文件内容无关紧要。由于你将尝试获取某些文件属性，因此需要 `System.IO` 程序集。你需要将其添加到\
  \ using/imports 中。\n\n```csharp\n#region customNamespaces\nusing System.IO;\n#endregion\n\
  ```\n\n以下是 VB.NET 代码：\n\n```vb\n#region customNamespaces\nImports System.IO\n#End\
  \ Region\n```\n\n接下来是 `Main` 方法的实际代码。首先从连接管理器获取文件路径，然后检查文件是否存在且包含数据。\n\n```csharp\n\
  public void Main()\n{\n    // 从文件连接管理器获取文件路径并存储在字符串变量中\n    string filePath = Dts.Connections[\"\
  myFile\"].AcquireConnection(Dts.Transaction).ToString();\n\n    // 使用文件路径变量创建 FileInfo\
  \ 对象\n    FileInfo fi = new FileInfo(filePath);\n\n    // 检查文件是否存在\n    if (fi.Exists)\n\
  \    {\n        // 文件存在，但检查大小\n        if (fi.Length > 0)\n        {\n         \
  \   // 布尔变量，指示相同事件是否可以触发多次\n            bool fireAgain = true;\n\n            //\
  \ 文件存在且包含数据。触发 Information 事件\n            Dts.Events.FireInformation(0, \"Script\
  \ Task File Check\", \"File exists and contains data.\",\n                string.Empty,\
  \ 0, ref fireAgain);\n        }\n        else\n        {\n            // 文件存在但不包含数据。触发\
  \ Warning 事件\n            Dts.Events.FireWarning(0, \"Script Task File Check\",\
  \ \"File exists, but contains no data.\", string.Empty, 0);\n        }\n\n     \
  \   // 成功完成脚本任务\n        Dts.TaskResult = (int)ScriptResults.Success;\n    }\n \
  \   else\n    {\n        // 文件不存在。触发 Error 事件并让脚本任务失败\n        Dts.Events.FireError(0,\
  \ \"Script Task File Check\", \"File doesn't exists.\", string.Empty, 0);\n\n  \
  \      // 脚本任务失败\n        Dts.TaskResult = (int)ScriptResults.Failure;\n    }\n\
  }\n```\n\n以下是 VB.NET 代码：\n\n```vb\nPublic Sub Main()\n    ' 从文件连接管理器获取文件路径并存储在字符串变量中\n\
  \    Dim filePath As String = Dts.Connections(\"myFile\").AcquireConnection(Dts.Transaction).ToString()\n\
  \n    ' 使用文件路径变量创建 FileInfo 对象\n    Dim fi As FileInfo = New FileInfo(filePath)\n\
  \n    ' 检查文件是否存在\n    If (fi.Exists) Then\n        ' 文件存在，但检查大小\n        If (fi.Length\
  \ > 0) Then\n            ' 布尔变量，指示相同事件是否可以触发多次\n            Dim fireAgain As Boolean\
  \ = True\n\n            ' 文件存在且包含数据。触发 Information 事件\n            Dts.Events.FireInformation(0,\
  \ \"Script Task File Check\", \"File exists and contains data.\", _\n          \
  \      String.Empty, 0, fireAgain)\n        Else\n            ' 文件存在但不包含数据。触发 Warning\
  \ 事件\n            Dts.Events.FireWarning(0, \"Script Task File Check\", \"File exists,\
  \ but contains no data.\", _\n                String.Empty, 0)\n        End If\n\
  \n        ' 成功完成脚本任务\n        Dts.TaskResult = ScriptResults.Success\n    Else\n\
  \        ' 文件不存在。触发 Error 事件并让脚本任务失败\n        Dts.Events.FireError(0, \"Script Task\
  \ File Check\", \"File doesn't exists.\", String.Empty, 0)\n\n        ' 脚本任务失败\n\
  \        Dts.TaskResult = ScriptResults.Failure\n    End If\nEnd Sub\n```\n\n现在，你可以通过清空或删除连接管理器中引用的文件来测试脚本，然后运行包并查看“执行结果”选项卡。除了常见的\
  \ `FireInformation`、`FireWarning` 和 `FireError` 之外，还有更多可用的触发事件方法，但它们使用较少：\n\n- `FireBreakpointHit`：引发一个事件，指示脚本任务中的断点已命中。\n\
  - `FireCustomEvents`：引发自定义事件。\n- `FireProgress`：引发一个显示脚本任务进度的事件。\n- `FileQueryCancel`：引发一个指示脚本任务是否应提前关闭的事件。\n\
  \n> **注意：** 由于触发事件开销较大，不应过度使用。某些触发事件方法包含一个布尔参数 `fireAgain`，用于抑制相同事件的多次触发。\n\n###\
  \ FireCustomEvents\n\n有时候你会遇到 SSIS 缺乏完整 ETL 解决方案所提供的某些企业功能的情况，例如当你想实现一个自定义的元数据驱动日志记录解决方案时。\n\
  \n假设你想集中配置所有正在运行包的日志记录设置。日志记录逻辑如何处理必须对所有子包透明。\n\n包唯一需要做的是通过触发自定义事件来通知主包。在主包上处理此问题的一个好方法是使用事件处理功能。有几种类型的事件可供你使用（参见图\
  \ 4-17）。\n\n![A978-1-4842-0638-6_4_Fig17_HTML.jpg](img/A978-1-4842-0638-6_4_Fig17_HTML.jpg)\n\
  \n**图 4-17.** 可供使用的事件\n\n本示例中，`OnVariableValueChanged` 是一个很好的候选事件，原因如下：\n\n- 它包含一些可以直接使用的内置变量。\n\
  - 即使变量发生变化，它也不会自动触发。\n\n基本上，你希望能够通过使用父包的事件处理程序来捕获子包中触发的自定义事件。\n\n让我们从构建子包开始。\n\n\
  ### 子包\n\n创建一个名为 `Child` 的新 SSIS 包，并向其中添加一个名为 `SCR_FireCustomEvent` 的脚本任务。\n\n事件的代码很简单，它只做一件事：获取包中一些可用的变量，并将它们作为事件触发。\n\
  \n\n\n#### 脚本\n\n在该类的 `Main` 方法中，添加以下代码：\n\n```\n// 触发一次或多次\nbool fireAgain = false;\n\
  \n// 我们希望在自定义事件中展示的值\nobject[] parameters = new object[] { \"This is the value I\
  \ want to log\", \"Second value to log\", DateTime.Now.ToLongDateString(), \"More\
  \ value to log\" };\n\n// 触发正确的事件类型：OnVariableValueChanged\nDts.Events.FireCustomEvent(\"\
  OnVariableValueChanged\", \"\", ref parameters, \"\", ref fireAgain);\n\nDts.TaskResult\
  \ = (int)ScriptResults.Success;\n```\n\n以及 VB.NET 代码：\n\n```\n' 触发一次或多次\nDim fireAgain\
  \ As Boolean = False\n\n' 我们希望在自定义事件中展示的值\nDim parameters As Object() = New Object()\
  \ {\"This is the value I want to log\", _\n\"Second value to log\", DateTime.Now.ToLongDateString(),\
  \ \"More value to log\"}\n\n' 触发正确的事件类型：OnVariableValueChanged\nDts.Events.FireCustomEvent(\"\
  OnVariableValueChanged\", \"\", parameters, \"\", fireAgain)\n\nDts.TaskResult =\
  \ CInt(ScriptResults.Success)\n```\n\n如你所见，这非常简单。你只需调用 SSIS 方法 `FireCustomEvent`，并指定：\n\
  \n- 要触发的事件的名称：`OnVariableValueChanged`\n- 事件文本，你不需要它，因此为 `\"\"`\n- 一个包含字符串参数的对象数组（也可以是其他类型）\n\
  - 子组件的名称（不需要）\n- 关于是否再次触发事件的指令，此处为 `false`\n\n这就是脚本任务所需的全部内容。\n\n现在，我们来创建第二个名为 `Parent`\
  \ 的包。\n\n#### 父包\n\n该包用于调用子包；因此，你需要一个“执行包任务”，并将子包指定为目标，如图 4-18 所示。\n\n![A978-1-4842-0638-6_4_Fig18_HTML.jpg](img/A978-1-4842-0638-6_4_Fig18_HTML.jpg)\n\
  \n图 4-18. 执行包任务编辑器\n\n在包设计图面的“事件处理程序”选项卡上，从下拉列表中选择 `OnVariableValueChanged` 事件。这将为此特定事件打开设计器图面，你可以在事件处理程序图面上放置一个“脚本组件”（见图\
  \ 4-19）。\n\n![A978-1-4842-0638-6_4_Fig19_HTML.jpg](img/A978-1-4842-0638-6_4_Fig19_HTML.jpg)\n\
  \n图 4-19. 配置事件处理程序\n\n以下是图 4-19 的标注：\n\n可执行文件设置为顶层元素（包）。事件处理程序是 `OnVariableValueChanged`。你使用脚本任务来捕获此事件。\n\
  \n#### 脚本任务\n\n你在事件处理程序图面上添加了一个脚本任务，并将其命名为 `SCR_CaptureEvent`。\n\n在脚本内部，你需要将一些可用的系统变量设置为只读：\n\
  \n- `System::TaskName`\n- `System::SourceName`\n- `System::VariableDescription`\n\
  - `System::VariableID`\n- `System::VariableName`\n- `System::VariableValue`\n\n\
  最后四个变量就是你用来自子包的对象数组填充的变量。\n\n#### 代码\n\n你通过单击脚本组件编辑器“脚本”页面上的 `编辑脚本...` 按钮来打开脚本。接下来，向\
  \ `Main` 方法中添加以下代码行：\n\n```\n//构建一个字符串，用于获取子包触发的事件中的变量值\nstring result = \"VariableName:\
  \ \" + Dts.Variables[\"System::VariableName\"].Value.ToString() +\nEnvironment.NewLine;\n\
  \nresult += \"VariableID: \" + Dts.Variables[\"System::VariableID\"].Value.ToString()\
  \ + Environment.NewLine;\n\nresult += \"VariableDescription: \" + Dts.Variables[\"\
  System::VariableDescription\"].Value.ToString() + Environment.NewLine;\n\nresult\
  \ += \"VariableValue: \" + Dts.Variables[\"System::VariableValue\"].Value.ToString()\
  \ +\nEnvironment.NewLine;\n\nresult += \"TaskName: \" + Dts.Variables[\"System::TaskName\"\
  ].Value.ToString() + Environment.NewLine;\n\nresult += \"SourceName: \" + Dts.Variables[\"\
  System::SourceName\"].Value.ToString();\n\n//以消息框形式显示字符串值\nMessageBox.Show(result);\n\
  ```\n\n以及 VB.NET 代码：\n\n```\n'构建一个字符串，用于获取子包触发的事件中的变量值\nDim result As String = \"\
  VariableName: \" + Dts.Variables(\"System::VariableName\").Value.ToString() + Environment.NewLine\n\
  \nresult += \"VariableID: \" + Dts.Variables(\"System::VariableID\").Value.ToString()\
  \ + Environment.NewLine\n\nresult += \"VariableDescription: \" + Dts.Variables(\"\
  System::VariableDescription\").Value.ToString() + Environment.NewLine\n\nresult\
  \ += \"VariableValue: \" + Dts.Variables(\"System::VariableValue\").Value.ToString()\
  \ + _\nEnvironment.NewLine\n\nresult += \"TaskName: \" + Dts.Variables(\"System::TaskName\"\
  ).Value.ToString() + Environment.NewLine\n\nresult += \"SourceName: \" + Dts.Variables(\"\
  System::SourceName\").Value.ToString()\n\n'以消息框形式显示字符串值\nMessageBox.Show(result)\n\
  ```\n\n运行父包会调用子包，子包随后会触发一个自定义事件，该事件被父包的事件处理程序捕获，并显示图 4-20 中的结果。\n\n![A978-1-4842-0638-6_4_Fig20_HTML.jpg](img/A978-1-4842-0638-6_4_Fig20_HTML.jpg)\n\
  \n图 4-20. 运行包的结果\n\n在这个示例中，我们保持得非常简单，但创建一个元数据框架来控制日志记录或使用 `FireCustomEvent` 实现自定义审计也并非难事。\n\
  \n### 总结\n\n在本章中，你学习了脚本任务的基本功能，例如使用变量和连接管理器避免在脚本中硬编码值，以及通过触发事件来记录有用的信息。并且你了解了如何引用自定义或第三方程序集。\n\
  \n在接下来的几章中，你将会看到所有常见问题的解决方案。结合本章脚本任务的知识，现在你可以通过添加日志记录或使用不同的连接管理器来自定义这些示例。\n\n"
- "# 5. 文件属性\n\n电子补充材料 本章的在线版本 (doi:[10.​1007/​978-1-4842-0638-6_​5](http://dx.doi.org/10.1007/978-1-4842-0638-6_5))\
  \ 包含补充材料，仅供授权用户使用。\n\nSSIS 内置的文件系统任务可执行基本的文件操作，例如复制、移动和删除。然而，有时（尤其是在数据传输场景中），你可能希望找到最新的文件，或者检查文件是否被锁定或是否为只读。在这些情况下，脚本任务在从\
  \ .NET 库（如 `System.IO.File`）获取帮助时非常有用。本章介绍了在脚本任务中处理文件的一些非常常见的用法示例。\n\n\n\n### 获取所有属性\n\
  \n如图 5-1 所示，内置的文件系统任务适用于复制/移动文件和目录，以及设置属性，但它无法处理诸如按修改日期排序等文件属性。\n\n![A978-1-4842-0638-6_5_Fig1_HTML.jpg](img/A978-1-4842-0638-6_5_Fig1_HTML.jpg)\n\
  \n图 5-1. 内置文件系统任务的操作\n\n其局限性之一在于，你无法读取所有的文件属性（即文件系统信息，如只读标志或权限）和特性（即文件本身的元数据）。该内置任务使用\
  \ `System.IO.File` 和 `System.IO.Directory` 作为操作核心，但这两个命名空间包含了更多功能，当你在 .NET 脚本中直接使用它们时，这些功能也能派上用场。\n\
  \n在本节中，你将学习如何从 .NET 脚本中读取文件和目录的属性及特性。本章使用的脚本采用了 `System.IO.File` 和 `System.IO.Directory`，它们存在于\
  \ .NET 框架的所有版本中（存在一些细微差别）。\n\n通常，文件包含详细的属性，例如属性、创建日期、修改日期、所有者、文件大小等。图 5-2 展示了如何查看文件属性。\n\
  \n![A978-1-4842-0638-6_5_Fig2_HTML.jpg](img/A978-1-4842-0638-6_5_Fig2_HTML.jpg)\n\
  \n图 5-2. 文件属性\n\n内置的文件系统任务不会提供这些信息。在实际的 ETL 或数据转换场景中，你需要查找最近修改的文件、属于特定所有者的所有文件，或仅查找小于特定大小的文件。因此，读取文件属性详细信息的能力至关重要，幸运的是，通过几行\
  \ .NET 脚本代码即可实现。\n\n#### 检查文件是否存在\n\n强烈建议在任何文件操作之前检查文件是否存在。这有助于在文件不存在时降低错误捕获的风险。检查文件是否存在非常简单；`System.IO.File`\
  \ 为此提供了一个方法：`Exists`。该方法以文件路径作为输入，并返回一个布尔值，指示文件是否存在。\n\n```csharp\nstring FilePath\
  \ = @\"C:\\APRESS\\SSIS Scripting Book\\02_Code\\Chapter 05\\Source Files\\Customers_1.csv\"\
  ;\n\nif (System.IO.File.Exists(FilePath))\n{ \\\\ 一些代码\n}\n```\n\n在上述代码中，字符串开头使用了\
  \ `@` 字符，以避免与原本需要转义的字符（如 `\"` 或 `\\`）发生冲突，因为这些字符在代码中是保留字符。\n\n此处的示例使用 `System.IO.File`\
  \ 类来确定给定文件是否存在于磁盘上。其他类和方法也很有用。表 5-1 列出了其中一些。\n\n表 5-1. 处理文件时有用的方法和属性\n\n| 方法或属性名称\
  \ | 类名 | 数据类型 |\n| --- | --- | --- |\n| `Name` | `System.IO.FileInfo` | `String`\
  \ |\n| `Extension` | `System.IO.FileInfo` | `String` |\n| `Directory.FullName` |\
  \ `System.IO.FileInfo` | `System.IO.Directory` |\n| `CreationTime` | `System.IO.FileInfo`\
  \ | `Datetime` |\n| `LastWriteTime` | `System.IO.FileInfo` | `Datetime` |\n| `GetAccessControl(filePath)`\
  \ | `System.IO.File` | `FileSecurity` |\n| `FileAttributes` | `System.IO.File` |\
  \ `FileAttributes` |\n| `FileSize` | `System.IO.FileInfo` | `FileInfo` |\n\n####\
  \ 文件名、扩展名和路径\n\n在 SSIS 中，利用完整的文件名和路径，可以找到文件名、扩展名和文件路径。要找到这些信息，你需要使用文件路径中最后一个反斜杠的位置，以及字符串中最后一个点的位置。\n\
  \n例如，如果你有一个名为 `strFilePath` 的变量，用于存储完整的文件路径，可以使用以下表达式获取文件名：\n\n`REVERSE(SUBSTRING(REVERSE(\
  \ @[User::strFilePath] ), 1, FINDSTRING(REVERSE( @[User::strFilePath] ),\"\\\\\"\
  , 1)-1))`\n\n这是一个不太易读的解决方案！.NET 通过使用 `System.IO.FileInfo` 提供了一个可读性更高且更优雅的解决方案。\n\
  \n#### 文件创建与修改时间\n\n`System.IO.FileInfo` 还提供了四个属性，用于读取文件的创建时间和最后修改时间。关于创建时间，有两个属性：`CreationTime`\
  \ 和 `CreationTimeUtc`。同样，修改时间也有对应的 UTC 和本地时间属性：`LastWriteTime` 和 `LastWriteTimeUtc`。\n\
  \n#### 文件所有者\n\n关于文件所有者的信息，可以通过 `System.IO.File` 类的 `GetAccessControl` 方法获取。该方法以文件路径作为输入参数，并返回一个\
  \ `FileSecurity` 类型的对象。该对象有一个用于获取文件所有者的方法：`GetOwner`。`GetOwner` 返回用户的安全标识符（SID），然后可以将其转换为网络账户。\n\
  \n#### 文件属性和只读状态\n\n`GetAttributes` 是 `System.IO.File` 类中的一个方法，它返回文件属性的枚举。`System.IO.FileInfo`\
  \ 中还有一个 `IsReadOnly` 属性，它返回一个布尔值，指示文件的 `ReadOnly` 属性。\n\n#### 文件大小\n\n你可以通过 `System.IO.FileInfo`\
  \ 对象的 `Length` 属性读取文件的大小。长度值以字节为单位返回，因此如果你想将其转换为千字节、兆字节或其他单位，需要在获取该值后进行转换。\n\n####\
  \ 所提文件属性的示例\n\n为了使以下脚本正常工作，你首先需要添加对 `System.Security.Principal` 命名空间的引用。\n\n以下代码显示了本示例中使用的脚本任务的\
  \ `Main` 方法。图 5-3 显示了 `FireInformation` 事件的输出窗口：\n\n![A978-1-4842-0638-6_5_Fig3_HTML.jpg](img/A978-1-4842-0638-6_5_Fig3_HTML.jpg)\n\
  \n图 5-3. 包含 FireInformation 文本和文件属性的输出窗口\n\n```csharp\npublic void Main()\n{\n \
  \   string FilePath = @\"C:\\APRESS\\SSIS Scripting Book\\02_Code\\Chapter 05\\\
  Source Files\\Customers_1.csv\";\n\n    //检查文件是否存在\n    if (File.Exists(strFilePath))\n\
  \    {\n        //获取文件信息\n        FileInfo objFileInfo = new FileInfo(strFilePath);\n\
  \n        //获取创建时间\n        DateTime createdTime = objFileInfo.CreationTime;\n\n\
  \        // 文件的长度（以字节为单位）\n        long FileLength = objFileInfo.Length;\n\n   \
  \     //获取文件名（含扩展名）\n        string fileName = objFileInfo.Name;\n\n        //获取目录\n\
  \        string Directory = objFileInfo.Directory.Name;\n\n        //获取文件路径和名称\n\
  \        string PathAndName = objFileInfo.FullName;\n\n        //获取文件的扩展名\n    \
  \    string Extension = objFileInfo.Extension;\n\n        //文件是否为只读？\n        bool\
  \ isReadOnly = objFileInfo.IsReadOnly;\n\n        //上次打开文件的时间（及日期）\n        DateTime\
  \ lastAccessTime = objFileInfo.LastAccessTime;\n\n        //上次写入文件的时间（及日期）\n   \
  \     DateTime lastWriteTime = objFileInfo.LastWriteTime;\n\n        //获取所有者\n \
  \       string owner = System.IO.File.GetAccessControl(strFilePath).GetOwner(typeof(System.Security.Principal.NTAccount)).ToString();\n\
  \n        string status = \"创建时间: \" + createdTime.ToString() + Environment.NewLine\
  \ +\n            \"目录: \" + Directory + Environment.NewLine +\n            \"所有者:\
  \ \" + owner + Environment.NewLine +\n            \"扩展名: \" + Extension + Environment.NewLine\
  \ +\n            \"路径名称: \" + PathAndName + Environment.NewLine +\n            \"\
  文件是否只读: \" + isReadOnly.ToString() + Environment.NewLine +\n            \"上次访问时间:\
  \ \" + lastAccessTime.ToString() + Environment.NewLine +\n            \"上次写入时间:\
  \ \" + lastWriteTime.ToString() + Environment.NewLine +\n            \"大小（字节）: \"\
  \ + FileLength.ToString() + Environment.NewLine +\n            \"文件名: \" + fileName;\n\
  \n        bool fireagain = false;\n        Dts.Events.FireInformation(0, \"文件属性示例\"\
  , status, string.Empty, 0, ref fireagain);\n    }\n}\n```\n\n\n\n### 删除早于 X 天的文件\n\
  \n如果你熟悉 SSIS 中的 `Foreach 循环容器`，就会知道其中有一个用于遍历目录中文件的枚举器，称为 `Foreach 文件枚举器`。该选项在大多数场景下都适用，但有时你也希望进行条件搜索（例如在文件夹中），以查找在特定日期范围内修改过的文件。或者你可能想要读取某些无法通过\
  \ `文件系统任务` 实现的文件夹属性。在处理文件夹时，`System.IO.Directory` 和 `System.IO.DirectoryInfo` 能为你提供最大的实用性。\n\
  \n条件循环的一个例子是遍历那些早于 X 天前的文件。通过一个 `脚本任务` 和几行 .NET 代码，你可以遍历目录中的文件，检查它们的 `LastWriteTime`，然后删除所有最后修改时间早于\
  \ X 天前的文件。\n\n以下示例在包中使用了两个变量：一个用于 `FolderPath`，另一个用于 `DaysToKeep`。图 5-4 显示了变量定义。\n\
  \n![A978-1-4842-0638-6_5_Fig4_HTML.jpg](img/A978-1-4842-0638-6_5_Fig4_HTML.jpg)\n\
  \n**图 5-4.** 变量定义\n\n使用一个 `脚本任务` 来接受这两个变量作为输入参数。图 5-5 显示了 `脚本任务` 的输入参数。\n\n![A978-1-4842-0638-6_5_Fig5_HTML.jpg](img/A978-1-4842-0638-6_5_Fig5_HTML.jpg)\n\
  \n**图 5-5.** 脚本任务的输入参数\n\n> **注意：** 完整代码包含在本书的可下载代码中。在以下内容中，仅突出显示了相关部分。\n\n首先，两行代码从包中读取输入变量的值（还有其他读取包变量值的方法，会在后续章节中描述）：\n\
  \n```\nstring DirectoryPath = Dts.Variables[\"User::FolderPath\"].Value.ToString();\n\
  int DaysToKeep=(int) Dts.Variables[\"User::DaysToKeep\"].Value;\n```\n\n在检查目录是否存在之后，将现有文件列表提取到一个字符串数组中。这一防御性编程代码行允许你在目录不存在时采取其他操作。\n\
  \n```\n//检查目录是否存在\nif (System.IO.Directory.Exists(DirectoryPath))\n{\n    //读取文件\n\
  \    string[] files=System.IO.Directory.GetFiles(DirectoryPath);\n```\n\n然后在循环结构中，逐个检查所有文件，为指定的文件路径创建一个\
  \ `FileInfo` 对象。\n\n```\n    //遍历文件\n    foreach (var file in files)\n    {\n  \
  \      //读取文件信息\n        System.IO.FileInfo finf = new System.IO.FileInfo(file);\n\
  ```\n\n接着，`FileInfo` 对象能够返回文件的 `LastWriteTime`。使用 `TimeSpan` 对象来识别文件的 `LastWriteTime`\
  \ 与当前日期之间的差值，这表示文件自上次修改以来已经过了多久。如果距离上次修改日期的天数大于 `DaysToKeep` 的值，则删除该文件。`TimeSpan`\
  \ 是一个表示时间间隔的结构。\n\n```\n        //计算文件创建日期与今天的差值\n        TimeSpan span = DateTime.Now.Subtract(finf.LastWriteTime);\n\
  \        //将差值与 DaysToKeep 变量进行比较\n        if ((int)span.TotalDays>DaysToKeep)\n\
  \        {\n            //删除旧文件\n            System.IO.File.Delete(file);\n    \
  \    }\n```\n\n以下是完整的 VB.NET 代码：\n\n```\n'读取参数\nDim DirectoryPath As String = Dts.Variables(\"\
  User::FolderPath\").Value.ToString\nDim DaysToKeep As Integer = Convert.ToInt32(Dts.Variables(\"\
  User::DaysToKeep\").Value)\n\n'检查目录是否存在\nIf System.IO.Directory.Exists(DirectoryPath)\
  \ Then\n\n    '获取目录中的文件\n    Dim files() As String = System.IO.Directory.GetFiles(DirectoryPath)\n\
  \n    '遍历文件\n    For Each file As String In files\n\n        '读取文件信息\n        Dim\
  \ finf As System.IO.FileInfo = New System.IO.FileInfo(file)\n\n        '计算文件修改日期与今天的差值\n\
  \        Dim span As TimeSpan = DateTime.Now.Subtract(finf.LastWriteTime)\n\n  \
  \      '将差值与 DaysToKeep 变量进行比较\n        If Convert.ToInt32(span.TotalDays) > DaysToKeep\
  \ Then\n\n            '删除旧文件\n            System.IO.File.Delete(file)\n\n      \
  \  End If\n    Next\nEnd If\n\nDts.TaskResult = ScriptResults.Success\n```\n\n>\
  \ **注意：** 屏幕截图显示的是 2014 年 12 月 22 日的一个运行示例，因此你预计两个较旧的文件将被删除。如果你想自行运行此包，建议使用更近的日期；否则，所有文件都将被移动/删除。\n\
  \n图 5-6 显示了运行包之前示例目录中的文件列表。\n\n![A978-1-4842-0638-6_5_Fig6_HTML.jpg](img/A978-1-4842-0638-6_5_Fig6_HTML.jpg)\n\
  \n**图 5-6.** 目录中的所有文件列表\n\n图 5-7 显示了运行包后同一个文件夹的情况。\n\n![A978-1-4842-0638-6_5_Fig7_HTML.jpg](img/A978-1-4842-0638-6_5_Fig7_HTML.jpg)\n\
  \n**图 5-7.** 运行包后剩余的文件\n\n\n\n### 检查文件是否被锁定\n\nETL 流程或数据传输流程可能会因为作为数据源的一个（或多个）文件处于打开或使用状态而导致文件被锁定，从而失败。因此，在您的\
  \ ETL 方案中加入检查文件是否被锁定的环节至关重要。幸运的是，通过几行 `C#` 或 `VB.NET` 代码，您就能判断一个文件是否被锁定。\n\n在本示例中，您将使用一个名为\
  \ `FilePath` 的变量来存储文件路径，然后在脚本中检查该文件是否存在；检查结果会存储在另一个名为 `Exists` 的包变量中。接着，您会检查文件是否被锁定，如果文件被锁定，则一个名为\
  \ `IsLocked` 的变量会被赋值为 `true`。针对文件进行此项检查的结果将用于后续操作的优先约束：\n\n-   如果文件存在且未被锁定，则将其移至归档文件夹。\n\
  -   如果文件不存在或已被锁定，则将此情况记录到日志表中，记录内容包括检查的日期时间以及文件存在性和锁定状态。\n-   添加两个变量，如图 5-8 所示。将\
  \ `FilePath` 变量的值设置为 `Customers_1.csv` 文件。\n\n![A978-1-4842-0638-6_5_Fig5-8a_HTML.jpg](img/A978-1-4842-0638-6_5_Fig5-8a_HTML.jpg)![A978-1-4842-0638-6_5_Fig5-8b_HTML.jpg](img/A978-1-4842-0638-6_5_Fig5-8b_HTML.jpg)\n\
  \n图 5-8. 变量\n\n图 5-8 显示了包中使用的变量。\n\n在控制流中添加一个新的脚本任务。将语言设置为 `C#` 或 `VB.NET`。其中 `FilePath`\
  \ 变量为 `ReadOnlyVariables`（因为您只想读取它），而 `Exists` 和 `IsLocked` 为 `ReadWriteVariables`（因为您要向这些变量中写入数据），如图\
  \ 5-9 所示。\n\n![A978-1-4842-0638-6_5_Fig9_HTML.jpg](img/A978-1-4842-0638-6_5_Fig9_HTML.jpg)\n\
  \n图 5-9. 为脚本任务定义输入变量\n\n单击**编辑脚本…**按钮。在脚本编辑器的命名空间区域，添加一行 `System.IO`。如需自定义命名空间，请添加以下内容：\n\
  \n```csharp\nusing System.IO;\n```\n\n在 `VB.NET` 中，添加以下内容：\n\n```vbnet\nImports\
  \ System.IO\n```\n\n在 `Main` 方法中，检查文件是否存在：\n\n```csharp\nstring filepath = Dts.Variables[\"\
  User::FilePath\"].Value.ToString();\nbool exists = Dts.Variables[\"User::Exists\"\
  ].Value;\n```\n\n以下是 `VB.NET` 版本：\n\n```vbnet\nDim filepath As String = Dts.Variables(\"\
  User::FilePath\").Value.ToString()\nDim exists As Boolean = File.Exists(filepath)\n\
  ```\n\n相应地设置 `Exists` 包变量：\n\n```csharp\nif (File.Exists(filepath))\n{\n    Dts.Variables[\"\
  User::Exists\"].Value = true;\n    // 其余代码将写在这里\n}\nelse\n{\n    Dts.Variables[\"\
  User::Exists\"].Value = false;\n}\n```\n\n以下是 `VB.NET` 版本：\n\n```vbnet\nIf exists\
  \ Then\n    Dts.Variables(\"User::Exists\").Value = True\n    ' 其余代码将写在这里\nElse\n\
  \    Dts.Variables(\"User::Exists\").Value = False\nEnd If\n```\n\n如果文件存在，您需要检查它是否被锁定，因此定义一个\
  \ `FileStream` 变量并尝试填充它。如果您遇到类型为 `IOException` 的错误，则意味着文件已被锁定，无法读取或写入，或者有进程正在使用它。\n\
  \n```csharp\nFileStream fs = null;\ntry\n{\n    fs = File.Open(filepath, FileMode.Open,\
  \ FileAccess.ReadWrite, FileShare.None);\n}\ncatch (IOException ex)\n{\n    Dts.Variables[\"\
  User::IsLocked\"].Value = true;\n}\n```\n\n以下是 `VB.NET` 版本：\n\n```vbnet\nDim fs\
  \ As FileStream = Nothing\nTry\n    fs = File.Open(filepath, FileMode.Open, FileAccess.ReadWrite,\
  \ FileShare.None)\nCatch ex As IOException\n    Dts.Variables(\"User::IsLocked\"\
  ).Value = True\nEnd Try\n```\n\n如果文件成功打开，它将返回一个 `FileStream` 类型的对象，这意味着文件未被锁定。使用\
  \ `finally` 块可确保在脚本任务退出前释放该文件。\n\n```csharp\nFinally\n{\n    if (fs != null)\n \
  \   {\n        fs.Close();\n        Dts.Variables[\"User::IsLocked\"].Value = false;\n\
  \    }\n}\n```\n\n以下是 `VB.NET` 版本：\n\n```vbnet\nIf Not (fs Is Nothing) Then\n  \
  \  fs.Close()\n    Dts.Variables(\"User::IsLocked\").Value = False\nEnd If\n```\n\
  \n\n\n#### 移动文件\n\n之前的脚本已经识别出文件是否存在或是否被锁定，`Exists` 和 `IsLocked` 包变量也会相应地显示这些值。通过检查这些值，你可以采取必要操作：移动文件或不移动。\n\
  \n你需要定义一个名为 `Archive` 的连接管理器，用于指定移动文件的存储位置。完成后，在脚本任务之后添加一个文件系统任务，并连接一个从脚本任务到该任务的优先约束。接着，进入任务编辑器，分配正确的连接以将文件移动到归档文件夹，如图\
  \ 5-10 所示。\n\n![A978-1-4842-0638-6_5_Fig10_HTML.jpg](img/A978-1-4842-0638-6_5_Fig10_HTML.jpg)\n\
  \n图 5-10. 配置“文件系统任务编辑器”以移动文件\n\n右键单击脚本任务和文件系统任务之间的优先约束。从上下文菜单中选择**编辑**。在“优先约束编辑器”中，将**求值操作**更改为**表达式和约束**。确认值为“成功”，并编写以下表达式来检查文件是否存在且未被锁定：\n\
  \n`@[User::Exists] && !(@[User::IsLocked])`\n\n图 5-11 显示了已填写表达式的“优先约束编辑器”。\n\n![A978-1-4842-0638-6_5_Fig11_HTML.jpg](img/A978-1-4842-0638-6_5_Fig11_HTML.jpg)\n\
  \n图 5-11. 文件存在且未被锁定\n\n如果文件不存在或已被锁定，你需要将此状态（包含日期和时间）记录到数据库的日志表中；在本例中，数据库为 `Apress_SSIS_Scripting`。运行以下脚本以创建\
  \ `FileCheckLog` 表（在 Management Studio 中运行该脚本）。\n\n> **注意：** 表创建脚本也包含在第 5 章的源代码中。\n\
  \n```\nCREATE TABLE [dbo].FileCheckLog NOT NULL,\n    [FilePath] varchar NULL,\n\
  \    [Locked] [bit] NULL,\n    [Exists] [bit] NULL,\n    [CheckedDateTime] [datetime]\
  \ NULL,\n    CONSTRAINT [PK_FileCheckLog] PRIMARY KEY CLUSTERED\n    (\n       \
  \ [ID] ASC\n    )WITH (PAD_INDEX = OFF, STATISTICS_NORECOMPUTE = OFF, IGNORE_DUP_KEY\
  \ = OFF, ALLOW_ROW_LOCKS = ON, ALLOW_PAGE_LOCKS = ON) ON [PRIMARY]\n) ON [PRIMARY]\n\
  ```\n\n在包的控制流中，添加一个执行 SQL 任务，并将其配置为向 `FileCheckLog` 表插入一条日志记录。\n\n你需要一个 OLE DB 连接管理器，指向创建了上述表的数据库。\n\
  \n以下是“执行 SQL 任务编辑器”的其他必需属性：\n\n*   `SQLSourceType` = 直接输入\n*   `ConnectionType`\
  \ = OLE DB\n*   `SQLStatement` = `insert into FileCheckLog (FilePath, Locked, [Exists],\
  \ CheckedDateTime) values (?,?,?,getdate())`\n\n图 5-12 列出了所有属性。\n\n![A978-1-4842-0638-6_5_Fig12_HTML.jpg](img/A978-1-4842-0638-6_5_Fig12_HTML.jpg)\n\
  \n图 5-12. 配置执行 SQL 任务以写入日志条目\n\n由于 `FilePath`、`Locked` 状态和 `Exists` 状态来自包变量，请转到**参数映射**选项卡并添加映射，如图\
  \ 5-13 所示。\n\n![A978-1-4842-0638-6_5_Fig13_HTML.jpg](img/A978-1-4842-0638-6_5_Fig13_HTML.jpg)\n\
  \n图 5-13. 文件检查日志的参数映射\n\n由于此示例中使用了 OLE DB 连接，参数名称应从 0 开始索引（`0`、`1`、`2`……）。要详细了解其他连接类型的参数名称，请阅读\
  \ [`http://msdn.microsoft.com/en-us/library/ms140355.aspx`](http://msdn.microsoft.com/en-us/library/ms140355.aspx)\
  \ 上的文章。\n\n将脚本任务的“成功”优先约束连接到执行 SQL 任务。转到“优先约束编辑器”窗口进行配置（参见图 5-14），并判断文件是否不存在或已被锁定。表达式为：`!(@[User::Exists])\
  \ && @[User::IsLocked]`。\n\n![A978-1-4842-0638-6_5_Fig14_HTML.jpg](img/A978-1-4842-0638-6_5_Fig14_HTML.jpg)\n\
  \n图 5-14. 检查文件是否不存在或已被锁定\n\n图 5-15 显示了该包的控制流架构（即添加了一个注释以更清楚地解释行为）。\n\n![A978-1-4842-0638-6_5_Fig15_HTML.jpg](img/A978-1-4842-0638-6_5_Fig15_HTML.jpg)\n\
  \n图 5-15. “检查文件是否锁定”包的控制流架构\n\n现在可以运行并测试该示例了。如果在未打开 `Customers_1.csv` 文件的情况下运行代码，你会看到控制流沿着路径到达“移动文件”任务，并且该文件将被移动到归档目录。\n\
