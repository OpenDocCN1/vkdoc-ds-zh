  \n    ' 创建一个新的压缩文件\n    Using myZipFile As New ZipFile(myZipFilePath)\n        '\
  \ 为压缩文件设置密码保护\n        myZipFile.Password = \"53cr3t!\"\n\n        ' 设置压缩级别\n  \
