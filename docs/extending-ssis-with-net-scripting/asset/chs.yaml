  \n图 19-7. 只有一个按钮和一个标签的简单窗体\n\n#### 代码\n\n双击“开始”按钮 (`btnStart`) 以创建一个 `onClick` 事件处理程序。代码页面打开，并创建了一个名为\
  \ `btnStart_Click` 的新方法。\n\n```\nprivate void btnStart_Click(object sender, EventArgs\
