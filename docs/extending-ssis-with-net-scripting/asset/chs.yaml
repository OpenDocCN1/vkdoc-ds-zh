  \n图 14-10. 添加新的哈希输出列\n\n#### 脚本\n\n在本例中，你使用了所有默认方法，包括`PreExecute`和`PostExecute`，但首先需要将`System.Security.Cryptography`添加到命名空间中以缩短代码。\n\
