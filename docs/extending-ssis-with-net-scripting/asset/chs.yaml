- "# 16. 创建自定义任务\n\n电子补充材料 本章在线版本 (doi:[10.​1007/​978-1-4842-0638-6_​16](http://dx.doi.org/10.1007/978-1-4842-0638-6_16))\
  \ 包含补充材料，仅供授权用户使用。\n\n在前面的章节中，你创建了一些非常有用的脚本任务来帮助你处理各类任务。使用脚本任务的缺点在于代码存储在包本身中。如果你有多个包使用同一个脚本任务，那么最终会得到一大堆脚本任务——每个任务都使用自己的代码副本。当你需要修复\
  \ bug 或添加额外功能时，你必须先找到所有使用该特定脚本任务的包，然后逐个修改它们。\n\n脚本任务的另一个问题是它需要一些 .NET 知识。这对你来说可能不是问题，但大多数\
  \ SSIS 开发者并不具备 .NET 编程技能。如果他们想使用你便捷的脚本任务代码，那么像使用另一个变量或连接管理器这样简单的事情，也需要你编辑脚本。当你创建自定义任务时，你可以添加一个用户界面，这样使用你任务的人就不需要特定的编程技能了（参见图\
  \ 16-1）。\n\n![A978-1-4842-0638-6_16_Fig1_HTML.jpg](img/A978-1-4842-0638-6_16_Fig1_HTML.jpg)\n\
  \n**图 16-1.** 用于控制流的自定义任务\n\n在 SSIS 中使用自定义任务有一个缺点。你需要在所有使用该任务的服务器和开发工作站上安装你的任务。在某些组织中，这可能是一个巨大的挑战，因为一些服务器管理员不喜欢将程序集添加到全局程序集缓存中。\n\
  \n### 自定义任务准备\n\n在本例中，你将创建一个检查文件是否存在的任务。它使用连接管理器或变量来获取要检查的文件路径。为此，你需要一个支持 C# 和 VB.NET\
  \ 项目的 Visual Studio 版本。BIDS 或 SSDT 是不够的，因为它们只支持 BI 项目。我们在此示例中使用了 Visual Studio Professional\
  \ 2013，但也有支持 C# 和 VB.NET 的较便宜版本；例如，Visual Studio Community 或 Visual Studio Express。\n\
  \n当然，你需要安装你想用自定义任务支持的所有 SSIS 版本。如果你想让你的任务适用于多个版本的 SSIS，你需要使用不同的引用重新编译代码。\n\n####\
  \ 创建 Visual Studio 项目\n\n对于这个自定义任务，你将使用两个类库项目：一个用于实际任务，一个用于用户界面。确保为任务选择合适的 .NET\
  \ 版本（SSIS 2005：2.0，SSIS 2008：3.5，SSIS 2012：4.0，SSIS 2014 也是 4.0）。首先，创建一个名为 `myTask`\
  \ 的新项目（参见图 16-2），然后向同一解决方案中添加第二个类库项目，名为 `myTaskUI`。\n\n![A978-1-4842-0638-6_16_Fig2_HTML.jpg](img/A978-1-4842-0638-6_16_Fig2_HTML.jpg)\n\
  \n**图 16-2.** 类库项目\n\n在开始编码之前，你还需要处理许多其他事项，例如引用、强名称、生成事件和图标。\n\n#### 默认命名空间和程序集名称\n\
  \n进入你的项目属性。在“应用程序”页面中，你需要在两个项目中更改程序集名称和默认命名空间。默认命名空间将是 `ScriptingBook.myTask`，程序集名称将是默认命名空间加上项目名称：`ScriptingBook.myTask.myTask`\
  \ 和 `ScriptingBook.myTask.myTaskUI`（参见图 16-3）。\n\n![A978-1-4842-0638-6_16_Fig3_HTML.jpg](img/A978-1-4842-0638-6_16_Fig3_HTML.jpg)\n\
  \n**图 16-3.** 设置命名空间和程序集名称\n\n#### 为强名称创建密钥\n\nSSIS 运行时对程序集的要求是它们必须位于 GAC 中。GAC\
  \ 要求程序集具有强名称。这提供了唯一的标识以及保证的位置（GAC），SSIS 运行时可以在该位置找到它需要的可执行文件。因此，你需要为程序集赋予强名称。进入其中一个项目的属性，然后转到“签名”页面。勾选“为程序集签名”复选框，然后从下拉列表中添加一个新的密钥文件。本例中的名称为\
  \ `myTask.snk`，签名算法为 `sha256RSA`，无密码（参见图 16-4）。单击“确定”按钮后，新的密钥文件将在解决方案资源管理器中可见。接下来，将相同的\
  \ `.snk` 文件复制到另一个项目，然后用相同的密钥为该项目签名。\n\n![A978-1-4842-0638-6_16_Fig4_HTML.jpg](img/A978-1-4842-0638-6_16_Fig4_HTML.jpg)\n\
  \n**图 16-4.** 添加密钥文件（C# 项目，VB.NET 相似）\n\n#### 获取公钥令牌\n\n对于运行时代码，你需要 GUI 程序集的公钥令牌。因此，首先使用\
  \ Release 配置生成项目，然后打开 Visual Studio 命令提示符。使用 `CD` 命令（更改目录）转到其中一个项目的 `Bin\\Release`\
  \ 文件夹。执行以下命令以获取 `publicKeyToken`：\n\n`sn.exe -t ScriptingBook.myTask.myTask.dll`\n\
  \n（参见图 16-5）。复制此密钥令牌以备后用。\n\n![A978-1-4842-0638-6_16_Fig5_HTML.jpg](img/A978-1-4842-0638-6_16_Fig5_HTML.jpg)\n\
  \n**图 16-5.** 用于获取公钥令牌的强名称工具\n\n#### 图标\n\n当然，你需要为任务准备一个合适的图标。网上有大量免费图标可用，也有创建新图标的工具。通过解决方案资源管理器向两个项目添加图标文件。添加图标文件后，确保将“生成操作”属性更改为\
  \ `Embedded Resource`，如图 16-6 所示；否则，图标将不会显示。稍后，你可以在 UI 项目的 Windows 窗体中使用此图标。这样，当你编辑任务时它就会显示出来。\n\
  \n![A978-1-4842-0638-6_16_Fig6_HTML.jpg](img/A978-1-4842-0638-6_16_Fig6_HTML.jpg)\n\
  \n**图 16-6.** 设置图标的生成操作\n\n在运行时项目中，你可以使用此文件为你的任务提供自定义图标，而不是默认图标。该图标将显示在 SSIS 工具箱和控制流中。相关代码将在后面解释。\n\
  \n\n\n#### 生成事件\n\n要在 SSIS 中使用程序集，你需要将它们安装到全局程序集缓存（GAC）中以供运行时使用，并复制到 SSIS 的任务文件夹中以供设计时使用。通过“生成事件”页面，你可以在生成\
  \ Visual Studio 项目时自动完成此操作。但是，由于要将程序集添加到 GAC，因此需要以管理员身份运行 Visual Studio。转到项目属性，然后转到“生成事件”页面。C#\
  \ 项目有一个名为“生成事件”的单独选项卡，但 VB.NET 项目在“编译”选项卡上有一个“生成事件”按钮。将以下命令添加到生成后事件。请注意，SQL Server\
  \ 文件夹中的数字对于不同 SSIS 版本是不同的：2005：90、2008：100、2012：110、2014：120 和 2016：130。\n\n`SSIS\
  \ 2008`\n\n```\ncd $(ProjectDir)\n@SET TASKDIR=\"C:\\Program Files (x86)\\Microsoft\
  \ SQL Server\\100\\DTS\\Tasks\\\"\n@SET GACUTIL=\"C:\\Program Files (x86)\\Microsoft\
  \ SDKs\\Windows\\v7.0A\\bin\\gacutil.exe\"\nEcho Installing dll in GAC\nEcho $(OutDir)\n\
  Echo $(TargetFileName)\n%GACUTIL% -if \"$(OutDir)$(TargetFileName)\"\nEcho Copying\
  \ files to Tasks\ncopy \"$(OutDir)$(TargetFileName)\" %TASKDIR%\n```\n\n`SSIS 2012\
  \ with SSDT 2010`\n\n```\ncd $(ProjectDir)\n@SET TASKDIR=\"C:\\Program Files (x86)\\\
  Microsoft SQL Server\\110\\DTS\\Tasks\\\"\n@SET GACUTIL=\"C:\\Program Files (x86)\\\
  Microsoft SDKs\\Windows\\v7.0A\\Bin\\NETFX 4.0 Tools\\gacutil.exe\"\nEcho Installing\
  \ dll in GAC\nEcho $(OutDir)\nEcho $(TargetFileName)\n%GACUTIL% -if \"$(OutDir)$(TargetFileName)\"\
  \nEcho Copying files to Tasks\ncopy \"$(OutDir)$(TargetFileName)\" %TASKDIR%\n```\n\
  \n**注意：** 如果你使用的是 Visual Studio 2012，那么 `gacutil` 位于 v8.0a 而不是 v7.0a。对于其他版本，这也可能有所不同。也可以下载\
  \ `gactuil`。它是 Microsoft Windows SDK 的一部分。\n\n### 自定义任务运行时代码\n\n你首先从执行和验证任务时使用的代码入手。由于完整代码太大，无法在书中全部展示，因此你将专注于最重要的\
  \ SSIS 内容。但本书附带该代码，因此你可以从示例代码中复制 `myTask.cs` 文件并将其添加到项目中。\n\n首先，你需要将 `Microsoft.SqlServer.Dts.Runtime`\
  \ 添加到命名空间以缩短代码。以下是此项目使用的完整列表：\n\n```\nusing System;\nusing System.ComponentModel;\n\
  using System.IO;\nusing System.Xml;\nusing Microsoft.SqlServer.Dts.Runtime;\n```\n\
  \n现在介绍任务最重要的代码：你可以在其中命名任务，为其添加图标，并将其连接到编辑器程序集：`DtsTask`。以下是代码；请注意，为了便于阅读，`UITypeName`\
  \ 赋值已被换行，但在你的代码中应该是一行长字符串。\n\n```\nnamespace ScriptingBook.myTask\n{\n    // 连接到编辑器程序集。从上一步复制\
  \ PublicKeyToken。\n    [DtsTask(\n    DisplayName = \"My Task\",\n    TaskType =\
  \ \"myTask\",\n    TaskContact = \"ScriptingBook Example\",\n    IconResource =\
  \ \"ScriptingBook.myTask.myTask.ico\",\n    UITypeName = \"ScriptingBook.myTask.myTaskInterface,\n\
  \                  ScriptingBook.myTask.myTaskUI,\n                  Version=1.0.0.0,\n\
  \                  Culture=Neutral,\n                  PublicKeyToken=80664248b6de6485\"\
  ,\n    RequiredProductLevel = DTSProductLevel.None)]\n    public class myTask :\
  \ Task, IDTSComponentPersist\n    }\n```\n\n`DtsTask` 标签有多个可以更改的属性：\n\n*   `DisplayName`：你在工具箱中看到的名称；这是将任务拖到控制流时的默认名称。\n\
  *   `TaskType`：任务的技术名称。\n*   `TaskContact`：你的姓名和联系信息。在发生致命错误时，会显示此信息。用户便能够联系到你。\n\
  *   `IconResource`：嵌入图标的完全限定名称。这会在工具箱中以及将任务拖到控制流时显示。尝试找到一个描述你的任务并与其余图标匹配的图标。这可不是一项简单的任务。\n\
  *   `UITypeName`：这是与编辑器的连接，你可以在其中命名接口类和 UI 类。在此字符串中，你还需要粘贴通过 `sn` 命令检索到的公钥令牌。\n\
  *   `RequiredProductLevel`：最好将其保留为默认值，但你可以选择其他产品级别（Enterprise、Standard、Workgroup），之后你的任务将仅适用于该版本的\
  \ SQL Server。\n\n还要注意类名后面的接口和基类名称。`IDTSComponentPersist` 是一个接口，声明了你作为实现该接口的类的一部分来实现的方法。`Task`\
  \ 是一个基类，实现了某些默认方法，你可以重写这些方法并在自己的代码中以稍微不同的方式实现。\n\n#### 任务属性\n\n接下来是任务的属性（见图 16-7）。这些属性用于存储从任务编辑器中选择的值。除了每个任务的名称和数据类型外，你还可以添加额外的元数据，例如用于阐明属性用途的描述、默认值，或用于对所有属性进行排序的类别。\n\
  \n![A978-1-4842-0638-6_16_Fig7_HTML.jpg](img/A978-1-4842-0638-6_16_Fig7_HTML.jpg)\n\
  \n**图 16-7.** 自定义任务属性\n\n以下代码显示了您在此任务中使用的三个属性：\n\n```\nprivate bool _hasConnectionmanagerSource\
  \ = true;\n[CategoryAttribute(\"my Task Source\")]\n[Description(\"True if a connectionmanager\
  \ is used for the task as source.\")]\n[DefaultValue(true)]\npublic bool HasConnectionmanagerSource\n\
  {\n  get { return this._hasConnectionmanagerSource; }\n  set  {this._hasConnectionmanagerSource\
  \ = value; }\n}\n\nprivate string _selectedConnectionManagerIDSource = \"\";\n[CategoryAttribute(\"\
  my Task Source\")]\n[Description(\"GUID of the selected source connectionmanager.\"\
  )]\npublic string SelectedConnectionManagerIDSource\n{\n  get { return this._selectedConnectionManagerIDSource;\
  \ }\n  set { this._selectedConnectionManagerIDSource = value; }\n}\n\nprivate string\
  \ _selectedVariableIDSource = \"\";\n[CategoryAttribute(\"my Task Source\")]\n[Description(\"\
  GUID of the selected source variable.\")]\npublic string SelectedVariableIDSource\n\
  {\n  get { return this._selectedVariableIDSource; }\n  set { this._selectedVariableIDSource\
  \ = value; }\n}\n```\n\n\n\n#### 验证任务\n\n要验证自定义任务，您需要重写 `Validate` 方法。基本上，您需要检查上一段落中所述属性的值。当这些值与您的预期不符时，您可以触发一个错误或警告，并返回\
  \ `Failure` 作为结果。验证方法在设计时（即关闭编辑器时）执行，在运行时执行两次：一次是在包初始化时，另一次是在任务执行时。\n\n![A978-1-4842-0638-6_16_Fig8_HTML.jpg](img/A978-1-4842-0638-6_16_Fig8_HTML.jpg)\
  \  \n图 16-8. 设计时错误\n\n在此示例中，您将检查用户是否已选择连接管理器或变量。如果未选择，则触发一个错误。您还会检查所选变量或连接管理器是否仍然存在。这是通过遍历所有变量或连接管理器来验证\
  \ GUID 是否存在来实现的。\n\n也可以添加其他检查。例如，检查变量或连接管理器中的文件路径是否存在。\n\n```csharp\npublic override\
  \ DTSExecResult Validate(Connections connections,\n                            \
  \           VariableDispenser variableDispenser,\n                             \
  \          IDTSComponentEvents componentEvents,\n                              \
  \         IDTSLogging log)\n{\n    // 如果您使用了连接管理器，那么请检查它是否有效！\n    if (HasConnectionmanagerSource)\n\
  \    {\n        // 检查下拉列表中是否选择了连接管理器\n        if (String.IsNullOrEmpty(_selectedConnectionManagerIDSource))\n\
  \        {\n            componentEvents.FireError(0, \"MyTask\",\n             \
  \                            \"连接管理器是必填项。\",\n                                 \
  \        \"\", 0);\n            return DTSExecResult.Failure;\n        }\n     \
  \   // 检查所选连接管理器是否仍然存在\n        if (FindConnectionManager(connections,\n       \
  \                           _selectedConnectionManagerIDSource)\n              \
  \                    == null)\n        {\n            componentEvents.FireError(0,\
  \ \"MyTask\",\n                                         \"连接管理器不存在。\",\n       \
  \                                  \"\", 0);\n            return DTSExecResult.Failure;\n\
  \        }\n    }\n    else\n    {\n                // 对变量执行相同的检查\n    }\n     \
  \   // 未遇到错误\n    return DTSExecResult.Success;\n}\n\n// 将 GUID 转换为实际连接管理器的方法。\n\
  // 它遍历所有连接管理器并比较 GUID。\nprivate ConnectionManager FindConnectionManager(Connections\
  \ connections,\n                                                string connectionManagerID)\n\
  {\n  ConnectionManager tempConnManager = null;\n  foreach (ConnectionManager connManager\
  \ in connections)\n  {\n    if (connManager.ID == connectionManagerID)\n    {\n\
  \      tempConnManager = connManager;\n      return tempConnManager;\n    }\n  }\n\
  \  return tempConnManager;\n}\n```\n\n#### 执行代码\n\n任务的实际代码在名为 `Execute` 的重写方法中执行。在此示例中，您首先检查是否使用了连接管理器或变量。然后，您将\
  \ GUID 转换为实际的连接管理器或变量，以从中提取文件路径。这使用了与前文编辑器代码中类似的方法完成。\n\n最后，您使用一个简单的 `File.Exists`\
  \ 来检查文件路径是否指向一个存在的文件。如果文件不存在，您将触发一个包含描述性错误消息的错误事件，并返回 `Failure` 作为执行结果，从而导致任务失败。\n\
  \n```csharp\n// 用于存储文件路径的类变量\nprivate string _filePathSource = \"\";\n\npublic override\
  \ DTSExecResult Execute(Connections connections,\n                           VariableDispenser\
  \ variableDispenser,\n                           IDTSComponentEvents componentEvents,\n\
  \                           IDTSLogging log,\n                           object\
  \ transaction)\n{\n  // 将 GUID 转换为实际的变量或连接管理器\n  // 并从连接管理器或变量中获取文件路径\n  if (HasConnectionmanagerSource)\n\
  \  {\n         _selectedConnectionManagerSource = FindConnectionManager\n      \
  \                                   (connections,_selectedConnectionManagerIDSource);\n\
  \         _filePathSource = GetFilePathSource(\n                          _selectedConnectionManagerSource);\n\
  \  }\n  else\n  {\n         _selectedVariableSource = FindVariable(\n          \
  \                      variableDispenser,\n                                    _selectedVariableIDSource);\n\
  \         _filePathSource = GetFilePathSource(_selectedVariableSource);\n  }\n\n\
  \  if (!File.Exists(_filePathSource))\n  {\n         componentEvents.FireError(0,\
  \ \"My Task\", \"文件 \"\n                                   + _filePathSource\n \
  \                                        + \" 不存在\", \"\", 0);\n         return\
  \ DTSExecResult.Failure;\n  }\n  else\n  {\n         return DTSExecResult.Success;\n\
  \  }\n}\n```\n\n#### SaveToXML 和 LoadFromXml\n\n在类定义中，您继承了 `Task` 以执行和验证您的任务，同时还实现了\
  \ `IDTSComponentPersist` 接口，用于将编辑器中的更改保存到包 XML 中，以及从包 XML 中加载更改。\n\n```csharp\n\
  void IDTSComponentPersist.LoadFromXML(System.Xml.XmlElement node,\n            \
  \                          IDTSInfoEvents infoEvents)\n{\n  // 当任务的 XML 在 BIDS/SSDT\
  \ 之外被修改时可能会发生此情况\n  if (node.Name != \"MyTask\")\n  {\n    throw new Exception(string.Format(\n\
  \        \"加载任务时出现意外的任务元素 - {0}.\", \"MyTask\"));\n  }\n  else\n  {\n    // 使用包\
  \ XML 中的值填充私有属性变量。\n    _hasConnectionmanagerSource = Convert.ToBoolean(\n     \
  \                             node.Attributes.GetNamedItem(\n                  \
  \                \"HasConnectionmanagerSource\").Value);\n    _selectedConnectionManagerIDSource\
  \ = node.Attributes.GetNamedItem(\n                               \"SelectedConnectionManagerIDSource\"\
  ).Value;\n    _selectedVariableIDSource = node.Attributes.GetNamedItem(\n      \
  \                         \"SelectedVariableIDSource\").Value;\n  }\n}\n\nvoid IDTSComponentPersist.SaveToXML(System.Xml.XmlDocument\
  \ doc,\n                                    IDTSInfoEvents infoEvents)\n{\n  //\
  \ 在包 XML 中创建节点\n  XmlElement taskElement = doc.CreateElement(string.Empty, \"MyTask\"\
  ,\n                                             string.Empty);\n  // 在节点中创建代表自定义属性的属性\n\
  \  // 并将每个属性添加到元素中\n  // 指示您使用的是连接管理器还是变量的布尔值\n  XmlAttribute MyTaskXmlAttribute\
  \ = doc.CreateAttribute(string.Empty,\n                             \"HasConnectionmanagerSource\"\
  , string.Empty);\n  MyTaskXmlAttribute.Value = _hasConnectionmanagerSource.ToString();\n\
  \  taskElement.Attributes.Append(MyTaskXmlAttribute);\n  // 来自连接管理器的 GUID\n  MyTaskXmlAttribute\
  \ = doc.CreateAttribute(string.Empty,\n                           \"SelectedConnectionManagerIDSource\"\
  ,\n                            string.Empty);\n  MyTaskXmlAttribute.Value = _selectedConnectionManagerIDSource.ToString();\n\
  \  taskElement.Attributes.Append(MyTaskXmlAttribute);\n  // 来自变量的 GUID\n  MyTaskXmlAttribute\
  \ = doc.CreateAttribute(string.Empty,\n                                \"SelectedVariableIDSource\"\
  , string.Empty);\n  MyTaskXmlAttribute.Value = _selectedVariableIDSource.ToString();\n\
  \  taskElement.Attributes.Append(MyTaskXmlAttribute);\n  // 将新元素添加到包文档中\n  doc.AppendChild(taskElement);\n\
  }\n```\n\n\n\n### 自定义任务窗体\n\n为了便于说明，窗体布局设计得非常简单（见图 16-9）。用户应当能够选择一个`File`、`Flat\
  \ File`或`Excel Connection Manager`来指定需要检查的文件，或者能够选择一个（包含文件路径的）字符串变量。为了提升用户体验，用户还应当能够在任务中直接创建新的连接管理器或新变量。\n\
  \n![A978-1-4842-0638-6_16_Fig9_HTML.jpg](img/A978-1-4842-0638-6_16_Fig9_HTML.jpg)\n\
  \n图 16-9. 基础窗体\n\n即使是这样一个非常简单的任务，其代码量也可能轻松超过 30 页，这对于一本图书来说可能并不实用。因此，我们只会展示与 SSIS\
  \ 相关部分的代码，当然，完整代码可随本书获取。你可以通过以下四个步骤，将示例项目中的窗体添加到你的 UI 项目中：\n\n- 在 UI 项目中添加对`System.Drawing`和`System.Windows.Forms`的引用。\n\
  - 将三个窗体文件——`myTaskEditor.cs`、`myTaskEditor.Designer.cs`和`myTaskEditor.resx`——复制到你自己的\
  \ UI 项目文件夹中。\n- 右键单击你的 UI 项目，选择“添加，现有项”，添加`myTaskEditor.cs`、`myTaskEditor.Designer.cs`和`myTaskEditor.resx`。\n\
  - 关闭并重新打开你的解决方案。然后，打开窗体查看添加的内容。\n\n### 窗体代码\n\n首先，使用 using 指令来精简代码。这里只需要六个命名空间。默认情况下会多一些，但你可以移除它们。Visual\
  \ Studio 甚至提供了移除未使用 using 的选项：右键单击某个 using，选择“组织 using”（具体操作可能因 Visual Studio 版本而异）。\n\
  \n```\nusing System;\nusing System.Collections;\nusing System.Drawing;\nusing System.Windows.Forms;\n\
  using Microsoft.SqlServer.Dts.Runtime;\nusing Microsoft.SqlServer.Dts.Runtime.Design;\n\
  ```\n\n#### TaskHost 和 ServiceProvider\n\n`taskHost`属性用于获取和设置当前任务的属性。这里的“属性”指的是所有你希望在关闭编辑器时保存的内容，例如选择了哪个变量或连接管理器。或者，如果你想为示例扩展重试功能，则需要存储重试次数和重试间隔。在运行时代码中，你看到过这些属性在`Validate`和`Execute`方法中被用于检查正确的文件路径。但是，`TaskHost`也可用于获取当前包的属性，例如该特定包中所有可用变量的列表。而`ServiceProvider`属性用于添加新变量或连接管理器，或获取当前连接管理器的列表。以下代码被添加到类代码的顶部。\n\
  \n```\n// 设置和获取 taskhost\nprivate TaskHost _taskHost;\npublic TaskHost TaskHost\n\
  {\n  get { return _taskHost; }\n  set { _taskHost = value; }\n}\n\n// 获取连接，设置在 ServiceProvider\
  \ 方法中完成\nprivate Connections _connections;\npublic Connections connections\n{\n\
  \  get { return _connections; }\n}\n\n// 获取或设置 serviceprovider。用于获取\n// 例如 VariablesProvider\
  \ 和 ConnectionsProvider\nprivate IServiceProvider _serviceProvider = null;\npublic\
  \ IServiceProvider ServiceProvider\n{\n  get\n  {\n    return _serviceProvider;\n\
  \  }\n  set\n  {\n    _serviceProvider = value;\n    // 从服务提供者获取连接\n    // 代码看起来复杂，但实际上只是类型转换\n\
  \    _connections = ((IDtsConnectionService)\n                    (value.GetService(typeof(IDtsConnectionService))))\n\
  \                    .GetConnections();\n  }\n}\n```\n\n在该类的构造函数中，对 taskhost 和 serviceprovider\
  \ 属性进行了设置。这是通过`myTaskInterface.cs`中的代码完成的，稍后会对此进行说明。现在，你可以在所有其他方法中使用这些属性。\n\n```\n\
  // 构造函数，用于设置 taskhost 和 serviceprovider\n// 参见 myTaskInterface.cs 中的 GetView 方法\n\
  public myTaskEditor(TaskHost taskHost,\n                         IServiceProvider\
  \ serviceprovider)\n{\n        InitializeComponent();\n        this.TaskHost = taskHost;\n\
  \        this.ServiceProvider = serviceprovider;\n}\n```\n\n#### PageLoad\n\n在`PageLoad`方法中，你需要用变量或连接管理器填充下拉框，以便用户进行选择。为此，你可以使用`TaskHost`。第一个示例用一个字符串变量（非系统变量）填充下拉框。在下拉框中，变量名称属性是可见的，但`QualifiedName`属性被用作键值。\n\
  \n```\n// 用字符串变量填充下拉框\ncmbVariablesSource.Items.Clear();\ncmbVariablesSource.DisplayMember\
  \ = \"Name\";\ncmbVariablesSource.ValueMember = \"QualifiedName\";\ncmbVariablesSource.Items.Add(\"\
  <选择变量>\");\ncmbVariablesSource.Items.Add(\"<新建变量>\");  // 打开新建弹出窗口\n\n// 遍历所有包变量\n\
  foreach (Variable variable in _taskHost.Variables)\n{\n  // 仅限非系统变量且为字符串类型的变量\n\
  \  if ((!variable.SystemVariable) && (variable.DataType == TypeCode.String))\n \
  \ {\n    cmbVariablesSource.Items.Add(variable);\n  }\n}\n```\n\n连接管理器也可以采用相同的方式处理。在这个示例中，你只希望包含带有文件路径的连接管理器（`File`、`Flat\
  \ File`和`Excel`）。同样，列表中显示的是名称属性，但 ID（一个 GUID）被用作键值。\n\n```\ncmbConnectionsSource.Items.Clear();\n\
  cmbConnectionsSource.DisplayMember = \"Name\";\ncmbConnectionsSource.ValueMember\
  \ = \"ID\";\ncmbConnectionsSource.Items.Add(\"<选择连接管理器>\");\n// 此选项将打开新建连接管理器弹出窗口\n\
  cmbConnectionsSource.Items.Add(\"<新建连接管理器>\");\n\nforeach (ConnectionManager connection\
  \ in this._connections)\n{\n    string ConnectionType = connection.CreationName;\n\
  \    if (ConnectionType == \"FILE\" ||\n        ConnectionType == \"EXCEL\" ||\n\
  \        ConnectionType == \"FLATFILE\")\n    {\n        cmbConnectionsSource.Items.Add(connection);\n\
  \    }\n}\n```\n\n\n\n##### 将 GUID 转换为变量\n\n稍后，在“确定”按钮的 `OnClick` 事件中，您会看到存储的是变量的\
  \ GUID 而不是名称。若要在组合框中选择正确的变量，您必须先从任务中检索 GUID 变量，然后遍历所有变量并逐一比较其 GUID 以找到正确的变量。找到后，便可在打开表单时用它来选择组合框中的正确变量。\n\
  \n但首先，您需要从任务中检索 GUID 变量。以下代码用于检索存储在任务中的属性值，如图 16-10 所示：\n\n![A978-1-4842-0638-6_16_Fig10_HTML.jpg](img/A978-1-4842-0638-6_16_Fig10_HTML.jpg)\n\
  \n图 16-10.\n\n需要检索的属性\n\n```csharp\n_taskHost.Properties[\"SelectedVariableIDSource].GetValue(_taskHost);\n\
  ```\n\n这是完整的代码。`FindVariable` 方法将此 GUID 转换为实际的变量对象，您可以用它来选择组合框中的正确项。\n\n```csharp\n\
  Variable var = FindVariable(_taskHost.Properties[\"SelectedVariableIDSource\"]\n\
  \                                        .GetValue(_taskHost).ToString().Trim());\n\
  \nif (var != null)\n{\n  // 找到变量，现在在组合框中选择它\n  cmbVariablesSource.SelectedItem =\
  \ var;\n}\nelse\n{\n  // 未找到变量，选择组合框中的第一项\n  cmbVariablesSource.SelectedIndex =\
  \ 0;\n}\n```\n\n以下是一个额外的方法，用于遍历所有包变量以比较 GUID。如果找到 GUID，则返回正确的变量；否则返回 `null`。\n\n\
  ```csharp\nprivate Variable FindVariable(string variableID)\n{\n  // 此方法遍历所有变量\n\
  \  // 并返回与 GUID 匹配的变量。\n  foreach (Variable var in _taskHost.Variables)\n  {\n \
  \   if (var.ID == variableID)\n    {\n      return var;\n    }\n  }\n\n  return\
  \ null;\n}\n```\n\n相同的方法可用于查找正确的连接管理器。您可以在示例任务中找到该代码。\n\n##### 添加变量\n\n在变量组合框的 `onChange`\
  \ 事件中，当选中列表中的第二项 `<New variable>` 时，您想要添加一个新变量。如果是这种情况，您使用 `serviceProvider` 打开默认的\
  \ SSIS“添加变量”对话框（参见图 16-11）。点击“确定”关闭对话框后，新变量会被添加到包中，然后您可以将新变量添加到组合框中并选中它。如果点击“取消”，则关闭对话框并选中组合框中的默认项。\n\
  \n![A978-1-4842-0638-6_16_Fig11_HTML.jpg](img/A978-1-4842-0638-6_16_Fig11_HTML.jpg)\n\
  \n图 16-11.\n\n添加变量对话框\n\n```csharp\n// 类变量用于存储选中的变量。它由 SelectedIndexChange 事件填充，\n\
  // 并被“确定”按钮点击事件使用。\nprivate Variable selectedVariableSource = null;\n\n// 设置所选变量的方法\n\
  private void cmbVariablesSource_SelectedIndexChanged(object sender, EventArgs e)\n\
  {\n    ComboBox combobox = (ComboBox)sender;\n\n    // 如果选中了 <Choose variable>，则清空路径文本框\n\
  \    if (combobox.SelectedIndex == 0)\n    {\n        this.txtFilePathFinalSource.Text\
  \ = \"\";\n        return;\n    }\n\n    // 如果选中了 <New variable>，则弹出窗口以创建新变量\n \
  \   if (combobox.SelectedIndex == 1)\n    {\n        int currentdIndex = -1;\n \
  \       IDtsVariableService _dtsVariableService = _serviceProvider\n           \
  \                  .GetService(typeof(IDtsVariableService))\n                  \
  \           as IDtsVariableService;\n        Variable newVariable = _dtsVariableService\n\
  \                                .PromptAndCreateVariable(this, null,\n        \
  \                        \"FilePath\", \"User\", typeof(String));\n        if (newVariable\
  \ != null)\n        {\n            currentdIndex = combobox.Items.Add(newVariable);\n\
  \            combobox.SelectedIndex = currentdIndex;\n            return;\n    \
  \    }\n        else\n        {\n            // 弹窗中点击了取消\n            combobox.SelectedIndex\
  \ = 0;\n            return;\n        }\n    }\n\n    // 填充私有变量以存储选中的变量\n    selectedVariableSource\
  \ = (Variable)combobox.SelectedItem;\n\n    // 如果变量仍为 null，则清空表单\n    if (selectedVariableSource\
  \ == null)\n    {\n        this.cmbVariablesSource.SelectedIndex = 0;\n        this.txtFilePathFinalSource.Text\
  \ = \"\";\n        return;\n    }\n\n    // 在文本框中显示路径\n    this.txtFilePathFinalSource.Text\
  \ = (String)selectedVariableSource.Value;\n}\n```\n\n\n###### 添加连接管理器\n\n添加连接管理器时，构造过程类似，但由于需要先在文件、平面文件或\
  \ Excel 之间进行选择，因此在显示标准 SSIS“添加连接管理器”对话框之前，会额外弹出一个自定义对话框（见图 16-12）。该对话框`Prompt.ShowConnectionManagerTypeDialog()`会返回一个字符串，其值为`\"\
  FILE\"`、`\"FLATFILE\"`或`\"EXCEL\"`。此字符串用于打开 SSIS 中相应类型的“添加连接管理器”对话框。\n\n![A978-1-4842-0638-6_16_Fig12_HTML.jpg](img/A978-1-4842-0638-6_16_Fig12_HTML.jpg)\n\
  \n图 16-12. 连接管理器对话框前的自定义对话框\n\n```\n// 用于存储所选连接管理器的类变量。\n// 该变量将由 SelectedIndexChange\
  \ 事件填充，并在“确定”按钮单击事件中使用。\nprivate ConnectionManager selectedConnectionManagerSource\
  \ = null;\n\n// 设置所选连接管理器的方法\nprivate void cmbConnectionsSource_SelectedIndexChanged(object\
  \ sender,\n                                                       EventArgs e)\n\
  {\n    ComboBox combobox = (ComboBox)sender;\n    // 如果选择了 <选择连接管理器>\n    // 则清空存储路径的文本框\n\
  \    if (combobox.SelectedIndex == 0)\n    {\n        this.txtFilePathFinalSource.Text\
  \ = \"\";\n        return;\n    }\n    // 如果选择了 <新建连接管理器>\n    // 则弹出对话框以创建新的连接管理器\n\
  \    if (combobox.SelectedIndex == 1)\n    {\n        int currentIndex = -1;\n \
  \       IDtsConnectionService _dtsConnectionService = _serviceProvider\n       \
  \                        .GetService(typeof(IDtsConnectionService))\n          \
  \                     as IDtsConnectionService;\n        ArrayList createdConnection\
  \ = _dtsConnectionService\n                                .CreateConnection\n \
  \                               (Prompt.ShowConnectionManagerTypeDialog());\n  \
  \      if (createdConnection.Count > 0)\n        {\n            ConnectionManager\
  \ newConnectionManager = (ConnectionManager)\n                                 \
  \                     createdConnection[0];\n           _dtsConnectionService.AddConnectionToPackage(\n\
  \                                    newConnectionManager);\n            currentIndex\
  \ = combobox.Items.Add(newConnectionManager);\n            combobox.SelectedIndex\
  \ = currentIndex;\n            return;\n        }\n        else\n        {\n   \
  \         // 在弹出对话框中点击了“取消”\n            combobox.SelectedIndex = 0;\n         \
  \   return;\n        }\n    }\n    // 填充私有变量以存储所选连接管理器\n    selectedConnectionManagerSource\
  \ = (ConnectionManager)\n                                       combobox.SelectedItem;\n\
  \    // 如果变量仍为 null，则清空表单\n    if (selectedConnectionManagerSource == null)\n  \
  \  {\n        this.cmbConnectionsSource.SelectedIndex = 0;\n        this.txtFilePathFinalSource.Text\
  \ = \"\";\n        return;\n    }\n    // 获取连接管理器的路径。对于 Excel 连接管理器，\n    // 应使用\
  \ ExcelFilePath 属性而非连接字符串\n    if (selectedConnectionManagerSource.CreationName\
  \ == \"EXCEL\")\n    {\n        this.txtFilePathFinalSource.Text = selectedConnectionManagerSource\n\
  \                                  .Properties[\"ExcelFilePath\"]\n            \
  \                      .GetValue(selectedConnectionManagerSource)\n            \
  \                      .ToString();\n    }\n    else\n    {\n        this.txtFilePathFinalSource.Text\
  \ = selectedConnectionManagerSource\n                                          \
  \ .ConnectionString;\n    }\n}\n```\n\n##### 关闭编辑器并保存更改\n\n当您使用“确定”按钮关闭编辑器时，需要将表单中的值保存到任务的属性中，以便在重新打开编辑器或执行任务时使用这些值。而当您单击“取消”按钮时，只需关闭编辑器并返回“取消”作为对话框结果即可。\n\
  \n```\nprivate void btnCancel_Click(object sender, EventArgs e)\n{\n  // 以“取消”状态关闭编辑器\n\
  \  this.DialogResult = DialogResult.Cancel;\n  this.Close();\n}\n\nprivate void\
  \ btnSave_Click(object sender, EventArgs e)\n{\n  // 将值（连接管理器和变量 GUID）保存到任务属性中。\n\
  \  if (this.cmbConnectionsSource.SelectedIndex != 0)\n  {\n    // 已选择某项，从私有类变量中获取所选连接管理器\n\
  \    _taskHost.Properties[\"SelectedConnectionManagerIDSource\"]\n             .SetValue(_taskHost,\
  \ selectedConnectionManagerSource.ID);\n  }\n  else\n  {\n    // 未选择任何内容，保存空字符串\n\
  \    _taskHost.Properties[\"SelectedConnectionManagerIDSource\"]\n             \
  \           .SetValue(_taskHost, string.Empty);\n  }\n  if (this.cmbVariablesSource.SelectedIndex\
  \ != 0)\n  {\n    // 已选择某项，从私有类变量中获取所选变量\n    _taskHost.Properties[\"SelectedVariableIDSource\"\
  ]\n                        .SetValue(_taskHost, selectedVariableSource.ID);\n  }\n\
  \  else\n  {\n    // 未选择任何内容，保存空字符串\n    _taskHost.Properties[\"SelectedVariableIDSource\"\
  ].SetValue(_taskHost,\n                                                        \
  \      string.Empty);\n  }\n  // 以“确定”状态关闭编辑器\n  this.DialogResult = DialogResult.OK;\n\
  \  this.Close();\n}\n```\n\n### 接口类代码\n\n下一个类文件实现了`IDtsTaskUI`接口。它唯一的作用是将`taskHost`和`serviceProvider`传递给编辑器。此类文件名为`myTaskInterface.cs`，位于\
  \ UI 项目中。\n\n```\nusing System;\nusing System.Windows.Forms;\nusing Microsoft.SqlServer.Dts.Runtime;\n\
  using Microsoft.SqlServer.Dts.Runtime.Design;\n\n// 类，为任务编辑器提供接口\nnamespace ScriptingBook.myTask\n\
  {\n  public class myTaskInterface : IDtsTaskUI\n  {\n    private TaskHost _taskHost;\n\
  \    private IServiceProvider _serviceProvider;\n    public myTaskInterface()\n\
  \    {\n    }\n    public void Initialize(TaskHost taskHost,\n                 \
  \          IServiceProvider serviceProvider)\n    {\n      // 获取 taskHost 和 serviceProvider\n\
  \      // 并填充类变量\n      taskHost = taskHost;\n      serviceProvider = serviceProvider;\n\
  \    }\n    public ContainerControl GetView()\n    {\n      // 将 taskHost 和 serviceProvider\
  \ 传递给编辑器\n      myTaskEditor editor = new myTaskEditor();\n      editor.TaskHost\
  \ = this._taskHost;\n      editor.ServiceProvider = this._serviceProvider;\n   \
  \   return editor;\n    }\n    public void Delete(IWin32Window parentWindow)\n \
  \   {\n    }\n    public void New(IWin32Window parentWindow)\n    {\n    }\n  }\n\
  }\n```\n\n#### 表达式生成器\n\n也可以在自定义任务中使用内置的表达式生成器（见图 16-13）。但是，这是一个不受支持的功能，这意味着不能保证它在下次\
  \ SSIS 更新后仍能正常工作。该代码未包含在示例任务中，但可以在单独的文本文件中找到。\n\n![A978-1-4842-0638-6_16_Fig13_HTML.jpg](img/A978-1-4842-0638-6_16_Fig13_HTML.jpg)\n\
  \n图 16-13. 自定义任务中的表达式生成器\n\n##### Using 指令\n\n为了使代码更紧凑，您需要在 UI 项目的代码中添加两个额外的 using\
  \ 指令。由于不同命名空间中存在重复名称，包装器 using 指令略有不同。\n\n```\nusings Microsoft.DataTransformationServices.Control;\n\
  usings Wrapper = Microsoft.SqlServer.Dts.Runtime.Wrapper;\n```\n\n好的，作为一名高级文档工程师和翻译员，我将遵循您提供的注意事项和示例，将给定的英文文本翻译成中文。\n\
  \n\n##### 表单控件\n\n在这个简化示例中，您需要添加一个按钮（用于打开表达式生成器）、一个只读文本框（用于显示表达式）和一个标签（用于显示计算结果）。\n\
  \n![A978-1-4842-0638-6_16_Fig14_HTML.jpg](img/A978-1-4842-0638-6_16_Fig14_HTML.jpg)\n\
  \n图 16-14. 用于打开表达式生成器的表单控件\n\n#### 代码\n\n要打开表达式生成器，您需要使用以下代码为按钮添加一个 `onclick` 事件处理程序。\n\
  \n```csharp\nprivate void btnExpression_Click(object sender, EventArgs e)\n{\n \
  \   try\n    {\n        // 创建一个表达式生成器弹窗，确保表达式可以被\n        // 评估为字符串，或者如果您希望返回布尔值，则将其改为\
  \ System.Boolean。\n        // 最后一个属性是包含您要编辑的表达式的文本框。\n        using (var expressionBuilder\
  \ = ExpressionBuilder.Instantiate(\n                                         _taskHost.Variables,\n\
  \                                         _taskHost.VariableDispenser,\n       \
  \                                  Type.GetType(\"System.String\"),\n          \
  \                               txtExpression.Text))\n        {\n            //\
  \ 打开带有表达式生成器的窗口/对话框\n            if (expressionBuilder.ShowDialog() == DialogResult.OK)\n\
  \            {\n                // 如果点击了“确定”，则文本框将被填入已创建的表达式，\n                //\
  \ 并且标签将被清空\n                txtExpression.Text = expressionBuilder.Expression;\n\
  \                lblExpressionEvaluated.Text = \"\";\n\n                // 创建用于计算表达式的对象\n\
  \                Wrapper.ExpressionEvaluator evaluator =\n                     \
  \                 new Wrapper.ExpressionEvaluator();\n\n                // 添加表达式\n\
  \                evaluator.Expression = txtExpression.Text;\n\n                //\
  \ 用于存储计算结果的变量\n                object result = null;\n\n                try\n  \
  \              {\n                    // 计算表达式并将结果存储在 result 变量中\n             \
  \       evaluator.Evaluate(DtsConvert.GetExtendedInterface(\n                  \
  \                     _taskHost.VariableDispenser),\n                          \
  \                  out result, false);\n                }\n                catch\
  \ (Exception ex)\n                {\n                    // 在标签中存储错误信息\n       \
  \             // 在这个例子中可能有点多余，因为表达式生成器窗口已经验证过表达式了。\n                    // 但您也可以让文本框可编辑，并在此处更改表达式（无需打开表达式生成器窗口）\n\
  \                    lblExpressionEvaluated.Text = ex.Message;\n               \
  \ }\n\n                // 如果表达式包含错误，\"result\" 将为 <null>。\n                if (result\
  \ != null)\n                {\n                    // 将计算结果添加到标签中\n            \
  \        lblExpressionEvaluated.Text = result.ToString();\n                }\n \
  \           }\n        }\n    }\n    catch (Exception ex)\n    {\n        MessageBox.Show(ex.Message);\n\
  \    }\n}\n```\n\n现在，您可以将该表达式存储在一个属性中，并在运行时检索它。在运行时，您可以使用相同的代码来计算该表达式。\n\n### 本章小结\n\
  \n在本章中，您学习了创建自定义任务的基础知识。我们鼓励您先学习一些基本的 .NET 编码知识，之后再着手创建大量的自定义任务。\n\n"
- "# 17. 创建自定义转换\n\n电子补充材料 本章的在线版本 (doi: [10.1007/978-1-4842-0638-6_17](http://dx.doi.org/10.1007/978-1-4842-0638-6_17))\
  \ 包含补充材料，供授权用户使用。\n\n本章向您展示如何为数据流创建自定义转换。与自定义任务相比，这稍微复杂一些，因为需要处理更多的方法和要点。为了便于理解，您将使用在脚本组件章节中看到的行号脚本。这是一个非常基础的转换，但易于扩展，可以添加您在各类博客和论坛上找到的各种高级功能。\n\
  \n与使用脚本组件相比，创建自定义转换的利弊与自定义任务和脚本任务之间的比较类似（参见图 17-1）。然而，由于这更困难，您决定采用自定义转换而非脚本组件的临界点可能会向脚本组件方向略微偏移。\n\
  \n![A978-1-4842-0638-6_17_Fig1_HTML.jpg](img/A978-1-4842-0638-6_17_Fig1_HTML.jpg)\n\
  \n图 17-1. 数据流的自定义转换\n\n### 自定义转换的准备\n\n在本示例中，您将创建一个转换，该转换会添加一个包含代理键（或行号）的新列。为此，您需要一个支持\
  \ C# 和 VB.NET 项目的 Visual Studio 版本。仅凭 BIDS 或 SSDT 是不够的，因为它们只支持 BI 项目。本示例使用 Visual\
  \ Studio Professional 2013，但也有支持 C# 和 VB.NET 的更便宜的版本，例如 Visual Studio Community\
  \ 或 Visual Studio Express。示例代码包含一个额外的安装程序项目。该项目的模板可以从 [`https://visualstudiogallery.msdn.microsoft.com/9abe329c-9bba-44a1-be59-0fbf6151054d`](https://visualstudiogallery.msdn.microsoft.com/9abe329c-9bba-44a1-be59-0fbf6151054d)\
  \ 下载。\n\n当然，您还需要安装要支持自定义转换的所有 SSIS 版本。如果您希望您的转换能在多个 SSIS 版本上工作，则需要使用不同的引用重新编译代码。\n\
  \n#### 创建 Visual Studio 项目\n\n对于此自定义转换，您将使用两个类库项目。一个用于实际的转换，另一个用于用户界面。请确保为转换选择了正确的\
  \ .NET 版本。SSIS 2005: 2.0, SSIS 2008: 3.5, SSIS 2012: 4.0, SSIS 2014: 4.0。首先创建一个名为\
  \ `RowNumber` 的新项目，然后向同一解决方案中添加第二个类库项目，命名为 `RowNumberUI`，如图 17-2 所示。\n\n![A978-1-4842-0638-6_17_Fig2_HTML.jpg](img/A978-1-4842-0638-6_17_Fig2_HTML.jpg)\n\
  \n图 17-2. 类库项目\n\n在开始编码之前，您首先需要处理许多其他事项，例如引用、强名称、生成事件，当然还有图标。\n\n#### 默认命名空间和程序集名称\n\
  \n转到您项目的属性。在“应用程序”页面中，您需要更改两个项目的程序集名称和默认命名空间（参见图 17-3）。默认命名空间将为 `ScriptingBook.RowNumber`。程序集名称将是默认命名空间加上项目名称：`RowNumber`\
  \ 项目和 `RowNumberUI` 项目分别对应 `ScriptingBook.RowNumber.RowNumber` 和 `ScriptingBook.RowNumber.RowNumberUI`。\n\
  \n![A978-1-4842-0638-6_17_Fig3_HTML.jpg](img/A978-1-4842-0638-6_17_Fig3_HTML.jpg)\n\
  \n图 17-3. 设置命名空间和程序集名称\n\n#### 创建强名称密钥\n\nSSIS 运行时要求程序集位于 GAC 中。GAC 要求程序集具有强名称。这提供了唯一的标识。因此，您需要为程序集提供一个强名称。转到其中一个项目的属性，然后转到“签名”页面。勾选“为程序集签名”复选框，然后在下拉列表中添加一个新的密钥文件。本例中的名称是\
  \ `RowNumber.snk`，签名算法为 `sha256RSA`，无密码（参见图 17-4）。单击“确定”按钮后，新的密钥文件将出现在解决方案资源管理器中。接下来，您需要将相同的\
  \ `.snk` 文件复制到另一个项目，然后使用相同的密钥文件对该项目进行签名。您也可以通过将密钥文件复制到当前项目中来重用自定义任务项目中的密钥文件。\n\n\
  ![A978-1-4842-0638-6_17_Fig4_HTML.jpg](img/A978-1-4842-0638-6_17_Fig4_HTML.jpg)\n\
  \n图 17-4. 添加密钥文件 (C# 项目，但 VB.NET 看起来类似)\n\n\n\n#### 获取公钥令牌\n\n对于运行时代码，你需要获取 GUI\
  \ 程序集的公钥令牌（PublicKeyToken）。因此，请先使用发布配置生成项目，然后打开 Visual Studio 命令提示符（见图 17-5）。使用\
  \ `cd`（更改目录）命令导航到某个项目的 `Bin\\Release` 文件夹，并执行以下命令以获取公钥令牌：\n\n![A978-1-4842-0638-6_17_Fig5_HTML.jpg](img/A978-1-4842-0638-6_17_Fig5_HTML.jpg)\n\
  \n图 17-5.\n\n用于获取公钥令牌的强名称工具\n\n```\nsn.exe -T ScriptingBook.RowNumber.RowNumber.dll\n\
  ```\n\n复制此密钥令牌以备将来使用。\n\n如果您复用了自定义任务项目中的密钥文件，那么公钥令牌是相同的，可以跳过此步骤。\n\n#### 图标\n\n\
  当然，你需要一个漂亮的图标来代表我们的转换。网上有很多免费的图标，也有创建新图标的工具。通过解决方案资源管理器将 `.ico` 文件添加到两个项目中。添加图标文件后，请确保将\
  \ **`Build Action`** 属性更改为 `Embedded Resource`；否则，图标将不会显示。稍后，你可以在 UI 项目的 Windows\
  \ 窗体中使用此图标。这样，当你编辑转换时，它就会显示出来（见图 17-6）。\n\n![A978-1-4842-0638-6_17_Fig6_HTML.jpg](img/A978-1-4842-0638-6_17_Fig6_HTML.jpg)\n\
  \n图 17-6.\n\n设置图标的 **`Build Action`**\n\n在运行时项目中，你可以使用此文件为你的转换提供自定义图标，而不是默认图标。这将在\
  \ SSIS 工具箱和数据流中显示。实现此功能的代码将在后面解释。\n\n#### 生成事件\n\n要在 SSIS 中使用这些程序集，你需要将它们安装到 GAC（全局程序集缓存）中供运行时使用，并将它们复制到\
  \ SSIS 的设计时 `PipelineComponents` 文件夹。你可以在生成 Visual Studio 项目时，通过生成事件自动完成此操作。但由于要将程序集添加到\
  \ GAC，因此需要以管理员身份运行 Visual Studio。转到项目属性，然后转到生成事件。C# 项目有一个单独的“生成事件”选项卡，而 VB.NET 项目在“编译”选项卡上有一个\
  \ **`Build Events`** 按钮。将以下命令添加到后期生成事件中。请注意，SQL Server 文件夹中的编号因 SSIS 版本而异：2005：90，2008：100，2012：110，2014：120，2016：130。另请注意，在后期生成事件命令行文本框中，路径应位于一行。此处为适应页面排版而换行。\n\
  \nSSIS 2008\n\n```\ncd $(ProjectDir)\n@SET PIPEDIR=\"C:\\Program Files (x86)\\Microsoft\
  \ SQL Server\\100\\DTS\\PipelineComponents\\\"\n@SET GACUTIL=\"C:\\Program Files\
  \ (x86)\\Microsoft SDKs\\Windows\\v7.0A\\bin\\gacutil.exe\"\nEcho Installing dll\
  \ in GAC\nEcho $(OutDir)\nEcho $(TargetFileName)\n%GACUTIL% -if \"$(OutDir)$(TargetFileName)\"\
  \nEcho Copying files to Tasks\ncopy \"$(OutDir)$(TargetFileName)\" %PIPEDIR%\n```\n\
  \nSSIS 2012 与 Visual Studio 2010\n\n```\ncd $(ProjectDir)\n@SET PIPEDIR=\"C:\\Program\
  \ Files (x86)\\Microsoft SQL Server\\110\\DTS\\PipelineComponents\\\"\n@SET GACUTIL=\"\
  C:\\Program Files (x86)\\Microsoft SDKs\\Windows\\v7.0A\\Bin\\NETFX 4.0 Tools\\\
  gacutil.exe\"\nEcho Installing dll in GAC\nEcho $(OutDir)\nEcho $(TargetFileName)\n\
  %GACUTIL% -if \"$(OutDir)$(TargetFileName)\"\nEcho Copying files to Tasks\ncopy\
  \ \"$(OutDir)$(TargetFileName)\" %PIPEDIR%\n```\n\n注意\n\n如果你使用的是 Visual Studio 2012\
  \ 或 Visual Studio 2013，则 `gacutil.exe` 位于 v8.0a 文件夹而不是 v7.0a 中。其他版本的路径也可能不同。`gacutil.exe`\
  \ 也可以下载；它是 Microsoft Windows SDK 的一部分。\n\n### 自定义转换运行时代码\n\n你将从执行转换时使用的代码开始。由于完整代码太多，无法在书中全部展示，因此你将重点关注最重要的\
  \ SSIS 内容。但本书附带了代码。你可以从示例代码中复制 `RowNumber.cs` 文件并将其添加到你的项目中。\n\n首先，你需要添加一些额外的 SSIS\
  \ 命名空间来简化代码。这是你将在本项目中使用的完整列表：\n\n```\nusing System;\nusing Microsoft.SqlServer.Dts.Pipeline;\n\
  using Microsoft.SqlServer.Dts.Pipeline.Wrapper;\nusing Microsoft.SqlServer.Dts.Runtime.Wrapper;\n\
  ```\n\n现在是你转换中最重要的代码——在这里命名它、赋予其图标并将其连接到编辑器程序集：`DtsPipelineComponent`。此属性允许你设置组件的所有元数据。\n\
  \n```\nnamespace ScriptingBook.RowNumber\n{\n    [DtsPipelineComponent(\n    DisplayName\
  \ = \"Row Number\",\n    ComponentType = ComponentType.Transform,\n    Description\
  \ = \"Adds a rownumber to the output\",\n    IconResource = \"ScriptingBook.RowNumber.RowNumber.ico\"\
  ,\n    UITypeName = \"ScriptingBook.RowNumber.RowNumberInterface, ScriptingBook.RowNumber.RowNumberUI,\
  \ Version=1.0.0.0, Culture=Neutral, PublicKeyToken=80664248b6de6485\",\n    CurrentVersion\
  \ = 1\n    )]\n    public class RowNumber : PipelineComponent\n    {\n```\n\n`DtsPipelineComponent`\
  \ 标签具有可以更改的属性，如下所示：\n\n- `DisplayName`：这是你在工具箱中看到的名称；它是你将转换拖到数据流时的默认名称。\n- `ComponentType`：通过此属性，你可以告知\
  \ SSIS 它是转换、源还是目标。\n- `Description`：用作转换默认描述的文本。\n- `IconResource`：嵌入图标的完全限定名称。这在工具箱中以及当你将转换拖到数据流中时显示。尝试找到一个能够描述你的任务并与其他图标风格相符的图标。这是一项相当艰巨的任务。\n\
  - `UITypeName`：这是与编辑器的连接，你可以在其中命名接口类和 UI 类。在此字符串中，你还需要粘贴通过 `sn` 命令检索到的公钥令牌。请注意，这虽然是一行代码，但在此处为适应页面排版而换行。\n\
  - `CurrentVersion`：这可以在名为 `PerformUpgrade` 的方法中使用，以处理当你添加额外属性时发生的更改，这些属性在使用旧版本转换的包中不存在。如果你不处理这些更改，则在使用旧版本的包中会出现错误。更多信息见后文。\n\
  \n另外要注意类名之后的接口：`PipelineComponent`。这允许你用自己的代码覆盖接口中的方法。代码中每个带有 `override` 修饰符的方法都来自此接口。\n\
  \n\n\n### 组件属性及输入输出端口\n\n第一种方法是 `ProvideComponentProperties`，在组件添加到数据流界面时被调用。在该方法中，您通过添加输入端口、输出端口、自定义属性以及一个用于存储行号的新输出列来初始化组件。\n\
  \n在输入端口中，您告知组件哪些数据将进入组件，以及当输入失败时应如何处理。在本例中，您不需要输入列，因为您不使用上游数据，也不需要错误输出。\n\n在输出端口中，您告知组件输出是否为同步，以及添加了哪些新输出列。我们的示例是同步的，并且您需要一个新输出列来存储新的行号。\n\
  \n自定义属性端口是您向组件添加属性（`Increment` 和 `Seed`）的地方（参见图 17-7）。这与自定义任务示例中的方式完全不同。除了名称、描述和初始值之外，您还可以指示用户是否可以在属性中使用表达式。\n\
  \n![A978-1-4842-0638-6_17_Fig7_HTML.jpg](img/A978-1-4842-0638-6_17_Fig7_HTML.jpg)\n\
  \n图 17-7. 自定义属性与元数据版本\n\n此外还有一个补充。组件的版本号存储在一个属性中。如果之后安装了组件的新版本，则可以在 `PerformUpgrade`\
  \ 方法中将此初始（元数据）版本号与当前（二进制）版本号进行比较。更多细节将在后续说明。\n\n```\n// 用于存储自定义属性默认值的类变量\nprivate\
  \ Int64 _seed = 1;\nprivate int _increment = 1;\nprivate string _newColumnName =\
  \ \"RowNumber\";\n\npublic override void ProvideComponentProperties()\n{\n    //\
  \ 当组件初始添加到数据流任务时调用此方法。\n    // 添加输入\n    IDTSInput100 input = ComponentMetaData.InputCollection.New();\n\
  \    input.Name = \"RowNumberInput\";\n    // 不使用 ErrorRowDisposition。\n    // 如果在行处理过程中失败，不希望其进入备用输出缓冲区。\n\
  \    input.ErrorRowDisposition = DTSRowDisposition.RD_NotUsed;\n\n    // 添加输出（同步）\n\
  \    // 异步会创建新的缓冲区\n    // 同步将列添加到现有缓冲区\n    // SynchronousInputID 连接同步组件的输入和输出\n\
  \    IDTSOutput100 output = ComponentMetaData.OutputCollection.New();\n    output.Name\
  \ = \"RowNumberOutput\";\n    output.SynchronousInputID = input.ID;\n    output.ExclusionGroup\
  \ = 1;\n\n    // 添加列\n    // 初始时使用默认名称创建一个新的输出列\n    // 在 UI 中您可以更改此名称。默认数据类型为 DT_I8。\n\
  \    // 您可以添加一个数据类型下拉框，让用户选择要使用的数据类型。\n    IDTSOutputColumn100 outputColumn = output.OutputColumnCollection.New();\n\
  \    outputColumn.Name = _newColumnName;\n    outputColumn.Description = \"生成的行号\"\
  ;\n    outputColumn.SetDataTypeProperties(DataType.DT_I8, 0, 0, 0, 0);\n\n    //\
  \ 定义此组件的自定义属性\n    AddProperty(\"Seed\", \"起始数字。\", _seed, false);\n    AddProperty(\"\
  Increment\", \"增量大小。\", _increment, false);\n\n    // 针对版本控制错误的变通方案（由 Todd McDermid\
  \ 提供）\n    // 当组件添加到数据流时，版本号会保存在包中。\n    // 当安装了新版本的组件时，PerformUpgrade 方法可以处理这些更改。\n\
  \    DtsPipelineComponentAttribute componentAttribute =\n        (DtsPipelineComponentAttribute)\n\
  \        Attribute.GetCustomAttribute(this.GetType(),\n        typeof(DtsPipelineComponentAttribute),\
  \ false);\n    ComponentMetaData.Version = componentAttribute.CurrentVersion;\n\
  }\n\n// 添加自定义属性的辅助方法\nprivate void AddProperty(string name,\n    string description,\n\
  \    object value,\n    bool supportsExpression)\n{\n    // 向组件添加自定义属性\n    IDTSCustomProperty100\
  \ commandProp = this.ComponentMetaData.CustomPropertyCollection.New();\n    commandProp.Name\
  \ = name;\n    commandProp.Description = description;\n    if (supportsExpression)\n\
  \    {\n        // 告知 SSIS 您允许对我们的属性使用表达式\n        commandProp.ExpressionType =\
  \ DTSCustomPropertyExpressionType.CPET_NOTIFY;\n    }\n    commandProp.Value = value;\n\
  \    return;\n}\n```\n\n### 验证转换\n\n为了验证自定义转换，您需要重写 `Validate` 方法。就像在自定义任务中一样，您可以检查自定义属性的值，看它们是否符合预期。但您也可以验证输入和输出：输出列的数量是否正确？某个输入列是可读/写的吗？或者输入数量是否多于一个？验证方法在设计时关闭编辑器时执行，以及在运行时初始化包和执行数据流任务时各执行一次（参见图\
  \ 17-8）。\n\n![A978-1-4842-0638-6_17_Fig8_HTML.jpg](img/A978-1-4842-0638-6_17_Fig8_HTML.jpg)\n\
  \n图 17-8. 设计时错误\n\n以下是您可以返回的四种不同状态：\n\n* `VS_ISBROKEN`: 组件的元数据不正常。用户应在数据流中解决此问题。示例：`increment\
  \ = 0`。\n* `VS_ISCORRUPT`: 存在无法修复的错误。最好通过删除并重新添加组件来重新开始。示例：输入或输出数量不正确。\n* `VS_ISVALID`:\
  \ 一切正常。\n* `VS_NEEDSNEWMETADATA`: 列的元数据存在问题，需要修复。示例：上游列被删除或更改。\n\n```\npublic override\
  \ DTSValidationStatus Validate()\n{\n    // 用于 FireError 的布尔值，指示是否取消执行\n    bool\
  \ pbCancel = false;\n\n    // 如果您使用了输入列并且输入流\n    // 被删除或更改，则可能会影响我们的\n    // 代码。因此，检查输入列是否\n\
  \    // 仍然有效\n    if (!ComponentMetaData.AreInputColumnsValid)\n    {\n        return\
  \ DTSValidationStatus.VS_NEEDSNEWMETADATA;\n    }\n\n    // 验证是否只有 1 个输入\n    if\
  \ (ComponentMetaData.InputCollection.Count != 1)\n    {\n        ComponentMetaData.FireError(0,\
  \ ComponentMetaData.Name,\n        \"输入数量不正确。\", \"\", 0, out pbCancel);\n     \
  \   return DTSValidationStatus.VS_ISCORRUPT;\n    }\n\n    // 验证没有输入列\n    if (ComponentMetaData.InputCollection[0].InputColumnCollection.Count\
  \ !=\n        0)\n    {\n        ComponentMetaData.FireError(0, ComponentMetaData.Name,\n\
  \        \"输入列数量不正确。\", \"\", 0, out pbCancel);\n        return DTSValidationStatus.VS_ISCORRUPT;\n\
  \    }\n\n    // 验证是否只有 1 个输出\n    if (ComponentMetaData.OutputCollection.Count\
  \ != 1)\n    {\n        ComponentMetaData.FireError(0, ComponentMetaData.Name,\n\
  \        \"输出数量不正确。\", \"\", 0, out pbCancel);\n        return DTSValidationStatus.VS_ISCORRUPT;\n\
  \    }\n\n    // 验证是否有 1 个输出列\n    if (ComponentMetaData.OutputCollection[0].OutputColumnCollection.Count\n\
  \        != 1)\n    {\n        ComponentMetaData.FireError(0, ComponentMetaData.Name,\n\
  \        \"输出列数量不正确\", \"\", 0, out pbCancel);\n        return DTSValidationStatus.VS_ISCORRUPT;\n\
  \    }\n\n    // 验证增量不为零\n    if (_increment == 0)\n    {\n        ComponentMetaData.FireError(0,\
  \ ComponentMetaData.Name,\n        \"增量不能为零\", \"\", 0, out pbCancel);\n       \
  \ return DTSValidationStatus.VS_ISBROKEN;\n    }\n\n    return base.Validate();\n\
  }\n```\n\n\n\n#### 执行代码\n\n此转换的实际代码在名为 `ProcessInput` 的重写方法中执行。对于这个示例，由于没有输入列且只有一个输出列，因此代码相当简单。该方法会针对传递给组件的每个缓冲区执行。你需要遍历当前缓冲区中的行，填充新列，然后递增行号以处理下一行。\n\
  \n此外，还可以对新的值进行验证。如果新列是 `DT_I4` 类型，则需要确保新的行号能够被容纳。本示例使用了 `DT_I8` 类型，其最大值非常大，不太可能很快达到上限。\n\
  \n```\npublic override void ProcessInput(int inputID, PipelineBuffer buffer)\n{\n\
  \  // 遍历缓冲区中的行\n  while (buffer.NextRow())\n  {\n    // 检查新数字是否超出范围。对于最大值为 9,223,372,036,854,775,807\
  \ 的 bigint 来说，\n    // 这个检查可能不太有用。\n    if (_currentRowNumber < Int64.MinValue ||\n\
  \        _currentRowNumber > Int64.MaxValue)\n    {\n      // 抛出错误，该值无法被所选变量类型容纳！\n\
  \      bool pbCancel = true;\n      ComponentMetaData.FireError(0, this.ComponentMetaData.Name,\n\
  \      \"行号不在所选变量类型 DT_I8 (Int64) 的范围内\", string.Empty, 0, out pbCancel);\n    \
  \  throw new ApplicationException(\"行号不在所选变量类型 'DT_I8 (Int64)' 的范围内。\");\n    }\n\
  \    // 用行号填充第一个（索引为 0 的）输出列\n    buffer.SetInt64(0, _currentRowNumber);\n    //\
  \ 准备就绪后递增\n    _currentRowNumber = _currentRowNumber + _increment;\n    // 将行定向到\
  \ defaultOutput\n    buffer.DirectRow(ComponentMetaData.OutputCollection[0].ID);\n\
  \  }\n}\n```\n\n#### PreExecute\n\n`PreExecute` 方法仅在 `ProcessInput` 方法启动前执行一次。它是执行任何可以预先完成并缓存以供其他方法使用的处理的好地方。对于此示例，你只需从属性中获取值，以便在\
  \ `ProcessInput` 方法中用于添加行号。如果你还有输入列，那么这也是映射输入和输出的位置。\n\n```\npublic override void\
  \ PreExecute()\n{\n  // 从属性中获取值，以便在 ProcessInput 中使用\n  _currentRowNumber = Int64.Parse(this.ComponentMetaData\n\
  \                      .CustomPropertyCollection[\"Seed\"].Value.ToString());\n\
  \  _increment = (int)this.ComponentMetaData\n               .CustomPropertyCollection[\"\
  Increment\"].Value;\n}\n```\n\n#### PerformUpgrade\n\n如果你想要扩展自定义转换，这是一个重要的方法。你需要将代码中的版本与包中的版本进行比较（参见图\
  \ 17-9）。如果转换的版本 0 没有更改增量的属性，而版本 1 引入了该属性，那么你不希望使用版本 0 创建的现有包因此失败。\n\n![A978-1-4842-0638-6_17_Fig9_HTML.jpg](img/A978-1-4842-0638-6_17_Fig9_HTML.jpg)\n\
  \n图 17-9. 带有增量选项的新版本\n\n如果元数据版本低于二进制版本，则可以添加带有默认值的附加属性。这应该可以防止因升级而导致的错误。\n\n而且，如果你（例如）忘记了升级生产服务器上的转换，那么元数据版本可能高于二进制版本。在这种情况下，你也应该抛出一个错误。\n\
  \n```\npublic override void PerformUpgrade(int pipelineVersion)\n{\n  // 从属性中获取当前组件版本。\n\
  \  DtsPipelineComponentAttribute componentAttribute =\n      (DtsPipelineComponentAttribute)Attribute.GetCustomAttribute(\n\
  \       this.GetType(), typeof(DtsPipelineComponentAttribute), false);\n  int binaryVersion\
  \ = componentAttribute.CurrentVersion;\n  int metaDataVersion = ComponentMetaData.Version;\n\
  \n  // 如果包中保存的组件版本低于当前版本（版本 2），则执行升级。\n  if (metaDataVersion < binaryVersion)\n\
  \  {\n    // 从版本 0 升级到 1\n    if (metaDataVersion == 0)\n    {\n      if (ComponentMetaData.CustomPropertyCollection[\"\
  Increment\"] == null)\n      {\n        // 添加具有默认值的新属性\n        AddProperty(\"Increment\"\
  , \"增量大小。\", 1, false);\n      }\n    }\n    // 更新元数据版本，否则版本仍然不同，\n    // 下次打开包时会再次执行升级，导致错误。\n\
  \    ComponentMetaData.Version = binaryVersion;\n  }\n\n  // 忘记升级服务器上的转换了？\n  if\
  \ (metaDataVersion > binaryVersion)\n  {\n      throw new Exception(\"组件的运行时版本已过期。\"\
  \n      + \"升级安装程序可能会解决此问题。\");\n  }\n}\n```\n\n#### 禁用高级编辑器\n\n如果你已为转换添加了自定义编辑器，则可能不希望用户使用高级编辑器并可能弄乱你的组件。你可以重写这些处理程序并抛出错误。以下是删除输出端口的一个示例，但代码中还有更多类似操作。\n\
  \n```\npublic override void DeleteOutput(int outputID)\n{\n  throw new Exception(string.Format(\"\
  不允许从 '{0}' 中删除输出。\", ComponentMetaData.Name), null);\n}\n```\n\n### 自定义转换窗体\n\n\
  为了便于解释，窗体布局再次保持非常简单（参见图 17-10）。为了添加行号，用户可以指定包含行号的新列的名称。并且用户可以在编辑器中更改起始编号和增量。\n\n\
  ![A978-1-4842-0638-6_17_Fig10_HTML.jpg](img/A978-1-4842-0638-6_17_Fig10_HTML.jpg)\n\
  \n图 17-10. 基本窗体\n\n此编辑器的完整代码随书提供。你可以通过以下四个步骤将示例项目中的窗体添加到你的 UI 项目：\n\n1.  在 UI 项目中添加对\
  \ `System.Drawing` 和 `System.Windows.Forms` 的引用。\n2.  将三个窗体文件 `RowNumberEditor.cs`、`RowNumberEditor.resx`\
  \ 和 `RowNumberEditor.Designer.cs` 复制到你的 UI 项目文件夹。\n3.  右键单击你的 UI 项目，然后选择 **添加**\
  \ > **现有项** 以添加以下文件：`RowNumberEditor.cs`、`RowNumberEditor.Designer.cs` 和 `RowNumberEditor.resx`。\n\
  4.  关闭并重新打开你的解决方案。然后打开窗体以查看你添加的内容。\n\n### 窗体代码\n\n首先，是用于简化代码的 using 指令。你在此处只需要四个命名空间。默认情况下会有更多，但你可以删除它们。Visual\
  \ Studio 甚至提供了一个选项来删除未使用的 using：右键单击 using 并选择 **组织 Using**（这可能因 Visual Studio 版本而异）。\n\
  \n```\nusing System;\nusing System.Windows.Forms;\nusing Microsoft.SqlServer.Dts.Pipeline.Wrapper;\n\
  using Microsoft.SqlServer.Dts.Runtime;\n```\n\n\n\n#### ServiceProvider、Connections、Variables\
  \ 和 Metadata\n\n该组件提供了一些对象，可用于获取变量或连接管理器，以及获取和设置自定义属性。这些对象将由实现 `IDtsComponentUI`\
  \ 的 `RowNumberInterface` 类进行设置。\n\n在此示例中，您仅使用 `IDTSComponentMetaData100` 从自定义属性中获取值。`IServiceProvider`\
  \ 可以创建变量。`Variables` 对象可用于遍历所有变量，而 `Connections` 可用于遍历所有连接管理器。\n\n```\nprivate Variables\
  \ _vars = null;\n\npublic Variables Variables\n{\n  get { return _vars; }\n  set\
  \ { _vars = value; }\n}\n\nprivate Connections _conns = null;\n\npublic Connections\
  \ Connections\n{\n  get { return _conns; }\n  set { _conns = value; }\n}\n\nprivate\
  \ IServiceProvider _sp = null;\n\npublic IServiceProvider ServiceProvider\n{\n \
  \ get { return _sp; }\n  set { _sp = value; }\n}\n\nprivate IDTSComponentMetaData100\
  \ _cmd = null;\n\npublic IDTSComponentMetaData100 ComponentMetadata\n{\n  get {\
  \ return _cmd; }\n  set { _cmd = value; }\n}\n```\n\n#### FormLoad\n\n在窗体加载方法 `RowNumberEditor_Load`\
  \ 中，您将从自定义属性中获取值，并将其用于填充编辑器中的字段。\n\n```\nprivate void RowNumberEditor_Load(object\
  \ sender, EventArgs e)\n{\n  // 获取新列的名称并填充文本框\n  txtColumnName.Text = _cmd.OutputCollection[0]\n\
  \                       .OutputColumnCollection[0].Name;\n  // 将自定义属性中的种子值转换为 bigint\
  \ 类型\n  // 并填充数值调节钮\n  numSeed.Value = Int64.Parse(_cmd\n                  .CustomPropertyCollection[\"\
  Seed\"].Value.ToString());\n  // 将自定义属性中的增量值转换为 int 类型\n  // 并填充数值调节钮\n  numIncrement.Value\
  \ = (int)_cmd\n                       .CustomPropertyCollection[\"Increment\"].Value;\n\
  }\n```\n\n此示例未使用变量，但如果您需要一个包含变量的组合框，那么此处就是填充该组合框的位置。以下是一些基本的示例代码（未包含在示例代码中）：\n\n\
  ```\n// 额外的命名空间\nusing Microsoft.SqlServer.Dts.Runtime;\n\n// 遍历所有变量\nforeach (Microsoft.SqlServer.Dts.Runtime.Variable\
  \ variable in Variables)\n{\n  // 过滤系统变量\n  if (!variable.SystemVariable)\n  {\n\
  \    // 填充组合框\n    cmbMyVariables.Items.Add(variable);\n    // 从组合框中选择自定义属性中的变量\n\
  \    if (variable.QualifiedName ==\n                       (string)_cmd.CustomPropertyCollection[\"\
  myVar\"].Value)\n    {\n      cmbMyVariables.SelectedItem = variable;\n    }\n \
  \ }\n}\n```\n\n并且，在编辑器中添加变量也是可行的，其方式与自定义任务示例类似。以下代码未包含在示例代码中：\n\n```\n// 用于存储变量在组合框中索引的整数\n\
  int currentdIndex = -1;\n// 打开新的添加变量屏幕以添加整数变量\nIDtsVariableService _dtsVariableService\
  \ = _sp.GetService(\n                    typeof(IDtsVariableService)) as IDtsVariableService;\n\
  Variable newVariable = _dtsVariableService.PromptAndCreateVariable(this,\n     \
  \                  null, \"StartNumber\", \"User\", typeof(Int32));\n// 检查是否创建了新变量\n\
  if (newVariable != null)\n{\n  // 将变量添加到组合框\n  currentdIndex = combobox.Items.Add(newVariable);\n\
  \  // 在组合框中选择新变量\n  combobox.SelectedIndex = currentdIndex;\n}\n```\n\n##### 关闭编辑器并保存更改\n\
  \n当您通过单击“确定”按钮关闭编辑器时，您希望将表单中的值保存到转换的自定义属性中，以便在重新打开编辑器或执行转换时能够使用它们。而当您单击“取消”按钮时，则只需关闭编辑器。\n\
  \n```\n// DTSComponent 的包装类\nprivate CManagedComponentWrapper _designTimeInstance;\n\
  \nprivate void btnOK_Click(object sender, EventArgs e)\n{\n  // 仅实例化一次。您不希望每次关闭编辑器时都添加输出和列\n\
  \  if (_designTimeInstance == null)\n  {\n      _designTimeInstance = _cmd.Instantiate();\n\
  \  }\n  // 检查列名是否已存在\n  // 如果不存在，则更改输出列的名称\n  IDTSOutputColumn100 outputColumn =\
  \ _cmd.OutputCollection[0]\n                                     .OutputColumnCollection[0];\n\
  \  if (outputColumn.Name != txtColumnName.Text)\n  {\n      outputColumn.Name =\
  \ txtColumnName.Text;\n  }\n  // 将种子值传递给组件属性\n  _designTimeInstance.SetComponentProperty(\"\
  Seed\", (Int64)numSeed.Value);\n  // 将增量值传递给组件属性\n  _designTimeInstance.SetComponentProperty(\"\
  Increment\",\n                                           (int)numIncrement.Value);\n\
  }\n\nprivate void btnCancel_Click(object sender, EventArgs e)\n{\n  // 关闭窗口并撤销更改\n\
  \  this.Close();\n}\n```\n\n### 接口类代码\n\n下一个类文件实现了 `IDtsComponentUI`。它所做的工作仅仅是将变量和\
  \ `serviceProvider` 等对象传递给编辑器。它在 SSIS 逻辑和您的自定义代码之间充当交互点。此类文件名为 `RowNumberInterface.cs`，位于\
  \ UI 项目中。\n\n此处包含空方法是因为它们是接口 `IDtsComponentUI` 所要求的，但在此示例中，您并未为它们实现任何自定义代码。如果您省略它们，将会收到一个生成错误，提示您忘记实现接口成员。\n\
  \n```\nusing System;\nusing System.Windows.Forms;\nusing Microsoft.SqlServer.Dts.Pipeline.Design;\n\
  using Microsoft.SqlServer.Dts.Pipeline.Wrapper;\nusing Microsoft.SqlServer.Dts.Runtime;\n\
  \n// 类，为转换编辑器提供接口\nnamespace ScriptingBook.RowNumber\n{\n  public class RowNumberInterface\
  \ : IDtsComponentUI\n  {\n    IDTSComponentMetaData100 _cmd;\n    IServiceProvider\
  \ _sp;\n\n    public void Help(System.Windows.Forms.IWin32Window parentWindow)\n\
  \    {\n    }\n\n    public void New(System.Windows.Forms.IWin32Window parentWindow)\n\
  \    {\n    }\n\n    public void Delete(System.Windows.Forms.IWin32Window parentWindow)\n\
  \    {\n    }\n\n    public bool Edit(System.Windows.Forms.IWin32Window parentWindow,\n\
  \                     Variables variables, Connections connections)\n    {\n   \
  \   // 创建并显示用户界面的窗体。\n      RowNumberEditor componentEditor = new RowNumberEditor();\n\
  \      componentEditor.Connections = connections;\n      componentEditor.Variables\
  \ = variables;\n      componentEditor.ComponentMetadata = _cmd;\n      componentEditor.ServiceProvider\
  \ = _sp;\n      return componentEditor.ShowDialog(parentWindow) == DialogResult.OK;\n\
  \    }\n\n    public void Initialize(IDTSComponentMetaData100 dtsComponentMetadata,\n\
  \                           IServiceProvider serviceProvider)\n    {\n      // 存储组件元数据。\n\
  \      _cmd = dtsComponentMetadata;\n      _sp = serviceProvider;\n    }\n  }\n\
  }\n```\n\n当使用新的自定义转换运行数据流时，您可以添加一个数据查看器来查看您辛勤工作的成果，如图 17-11 所示。\n\n![A978-1-4842-0638-6_17_Fig11_HTML.jpg](img/A978-1-4842-0638-6_17_Fig11_HTML.jpg)\n\
  \n图 17-11.\n\n最终结果\n\n### 总结\n\n在本章中，您了解了生成自定义转换的基础知识。我们鼓励您在急于创建大量自定义任务和组件之前，先学习一些基本的\
  \ .NET 编码知识。MSDN 上充满了示例代码，您可以使用它们来扩展这个基础示例，使其功能更加完善。\n\n"
