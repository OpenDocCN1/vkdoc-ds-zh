- "# 第一部分  \n入门指南  \n\n"
- "# 第 1 章 SSIS 与脚本入门  \n\n电子补充材料 本章的在线版本（doi:`10.1007/978-1-4842-0638-6_1`）包含补充材料，仅供授权用户使用。\
  \  \n\n本章将引导您完成一个简单场景，您将使用 `.NET` 脚本实现所需功能。希望您能了解使用 `.NET` 脚本实现场景是多么简单而强大。每个 `.NET`\
  \ 版本都会新增功能。您还将了解这些版本如何与 `SSIS` 版本相关联。  \n\n在本章中，您将学习如何使用 `SSIS` 执行基本任务，以及如何利用脚本简化这些基本任务。\
  \  \n\n## 使用 SSIS 内置组件执行基本操作  \n\n边做边学通常是理解功能最简便的方式。因此，让我们先看看如何通过 `.NET` 脚本构建一个基本操作。但在开始之前，我们先设定场景，正式介绍\
  \ `SSIS`。  \n\n### 什么是 SSIS？  \n\n`SQL Server Integration Services (SSIS)` 是 `SQL\
  \ Server` 的一项服务。其历史始于 `SQL Server 2000` 中的 `DTS`（数据转换服务）。`SSIS` 首次随 `SQL Server\
  \ 2005` 发布，此后在 `SQL Server` 的每个版本中（2008、2008 R2、2012，以及本书撰写时的 2014）都得到了增强。`SSIS`\
  \ 是 `BI`（商业智能）开发人员进行 `ETL`（数据提取、转换和加载）的首选工具。`SQL` 开发人员用它进行数据转换，`DBA` 用它自动化部分管理任务，程序员则用它避免编写大量代码。\
  \  \n\n一个 `SSIS` 项目包含一个或多个包。`SSIS` 项目在 `Business Intelligence Development Studio\
  \ (BIDS)` 中开发，较新版本则在安装了 `BI` 模板的 `SQL Server Data Tools (SSDT)` 中开发。开发 `SSIS` 包所需的工具可能让人有些困惑。因此，为了彻底澄清，以下是关于\
  \ `SSDT` 的事实，以便您能快速上手并创建第一个 `SSIS` 包：  \n\n*   `SSDT` 作为 `SQL Server` 平台的免费组件提供，所有\
  \ `SQL Server` 用户均可使用。它支持 `SQL Server 2005`、2008、2008 R2、2012、2014 和 `Azure`。  \n\
  *   `SSDT` 完整版本及更新可在线获取：[`https://msdn.microsoft.com/en-us/library/mt204009.aspx`](https://msdn.microsoft.com/en-us/library/mt204009.aspx)。\
  \  \n*   `SSDT` 可以独立安装，也可与 `Visual Studio` 一同安装。  \n\n要使用 `SSIS` 包，您需要下载与 `SSDT`\
  \ 版本匹配的 `BI` 模板。  \n\n*   `SSDT 2012`：[`https://www.microsoft.com/en-us/download/details.aspx?id=36843`](https://www.microsoft.com/en-us/download/details.aspx?id=36843)\
  \  \n*   `SSDT 2014`：[`https://www.microsoft.com/en-us/download/details.aspx?id=42313`](https://www.microsoft.com/en-us/download/details.aspx?id=42313)\
  \  \n\n以下是一些下载不同版本 `BIDS` 和 `SSDT` 的有用链接。本书重点介绍 `SSDT 2013`。  \n\n*   `BIDS 2005`：[`http://www.microsoft.com/en-us/download/details.aspx?id=19413`](http://www.microsoft.com/en-us/download/details.aspx?id=19413).\
  \ `SQL Server 2005` 的 Express 版不包含 `BIDS`。  \n*   `BIDS 2008` 和 `2008 R2` 需要 `Visual\
  \ Studio 2010`。  \n\n此网页 [`https://msdn.microsoft.com/en-us/data/hh297027`](https://msdn.microsoft.com/en-us/data/hh297027)\
  \ 总结了多种下载方式，但所列版本可能有些令人困惑。  \n\n### 开发工具  \n\n图 1-1 展示了 `SSDT` 的不同元素（`BIDS` 具有相同的默认布局，但颜色不同）。\
  \  \n\n![A978-1-4842-0638-6_1_Fig1_HTML.jpg](img/A978-1-4842-0638-6_1_Fig1_HTML.jpg)\
  \  \n\n图 1-1. SSDT 开发工作室  \n\n图 1-1 中的标注突出显示了界面的以下区域和方面：  \n\n*   `SSIS 工具箱`：包含所有可用组件和任务。\
  \  \n*   变量窗格：可在此创建新变量并编辑现有变量。  \n*   主设计窗格：可在此添加组件和任务，处理包参数（SSIS 2012 及更高版本）并定义事件处理程序。\
  \  \n*   连接管理器窗格：用于管理当前 SSIS 包到外部资源的所有连接。  \n*   解决方案资源管理器：用于管理解决方案、项目、文件、连接管理器以及项目内的项目参数。\
  \  \n*   属性窗格：列出并管理所选对象的所有属性。  \n\n### 控制流任务  \n\n一个 `SSIS` 包包含一个控制流，并可选择包含一个或多个数据流。`SSIS`\
  \ 提供三种类型的控制流元素：  \n\n*   提供包结构的容器  \n*   提供功能的任务  \n*   连接可执行文件的优先约束  \n\n图 1-2\
  \ 展示了设计器窗格中控制流的示例。  \n\n![A978-1-4842-0638-6_1_Fig2_HTML.jpg](img/A978-1-4842-0638-6_1_Fig2_HTML.jpg)\
  \  \n\n图 1-2. 控制流设计区域  \n\n以下是图 1-2 中的标注：  \n\n*   一个提供包结构并管理控制流功能的容器。  \n*   一个实现功能的任务。\
  \  \n*   一个定义执行流的优先约束。  \n\n> 注意  \n> 随着 `SSIS` 新版本的发布，会出现新的控制流任务，其图形布局也略有不同。  \n\
  \n图 1-3 展示了 `SSIS 工具箱` 中可用的控制流任务示例。  \n\n![A978-1-4842-0638-6_1_Fig3_HTML.jpg](img/A978-1-4842-0638-6_1_Fig3_HTML.jpg)\
  \  \n\n图 1-3. 控制流任务  \n\n如前所述，控制流任务包含三种类型的元素：用于结构的容器、用于连接可执行文件的优先约束，以及提供功能的任务。在提供功能的任务中，有用于数据库操作的元素，例如\
  \ `执行 SQL 任务`、`大容量插入任务` 和 `Analysis Services 处理任务`；用于操作外部系统的元素包括 `文件系统任务` 和 `Web\
  \ 服务任务`；数据库管理任务包括 `备份数据库任务` 和 `收缩数据库任务`。`执行包任务` 用于调用其他包。`数据流任务` 通过多种转换管理源与目标之间的数据传输。`脚本任务`\
  \ 用于编写 `.NET` 脚本（这也是本书的主要主题之一）。  \n\n所有可用控制流任务的列表位于 [`http://msdn.microsoft.com/en-us/library/ms139892.aspx`](http://msdn.microsoft.com/en-us/library/ms139892.aspx)。\
  \  \n\n另外值得注意的是，控制流中还有一些可用于分组和循环的结构元素。有关 `SSIS` 中容器的更多信息，请访问 [`https://msdn.microsoft.com/en-us/library/ms137728.aspx`](https://msdn.microsoft.com/en-us/library/ms137728.aspx)。\
  \  \n\n### 数据流组件  \n\n数据流可能是 `SSIS` 中最重要的任务。数据流是定义数据通过多种转换从一个或多个源传输到一个或多个目标的任务。数据流是构建\
  \ `ETL` 和数据集成解决方案的基石。数据流和控制流之间存在根本区别。控制流使用优先约束来结构化流程，而数据流组件则使用数据路径将数据从一个元素流向另一个元素。如图\
  \ 1-4 所示。  \n\n![A978-1-4842-0638-6_1_Fig4_HTML.jpg](img/A978-1-4842-0638-6_1_Fig4_HTML.jpg)\
  \  \n\n图 1-4. 数据流设计窗格  \n\n如前所述，`ETL` 包含三个主要阶段：提取、转换和加载。这三个阶段可以与数据流的组件类型相对应。  \n\
  \n\n\n##### 提取\n\n第一阶段旨在根据不同的数据提供者，从不同的数据源获取数据。源数据可以来自 SQL Server、DB2、Oracle、MySQL\
  \ 等数据库，也可以来自文本文件、XML 数据集、Excel 文件等。图 1-5 展示了 SSIS 数据流任务中可用的源组件列表（此列表针对 SQL Server\
  \ 2012/2014，早期版本略有不同）。\n\n![A978-1-4842-0638-6_1_Fig5_HTML.jpg](img/A978-1-4842-0638-6_1_Fig5_HTML.jpg)\n\
  \n图 1-5. 数据流中的源组件\n\n##### 转换\n\nETL 的第二阶段，也可能是最具挑战性的阶段，是在从源中提取数据后对其进行转换。SSIS 数据流中有多种可用的转换；本书无法一一详述。一些最常用的转换包括：创建新列或替换现有列（派生列）、转换数据（数据转换）、不同类型的连接（查找）、数据透视与逆透视、以及数据集的合并与排序。图\
  \ 1-6 展示了 SQL Server 2012/2014 的 SSIS 中可用的一些数据转换组件。您可以在 [`http://msdn.microsoft.com/en-us/library/ms141713.aspx`](http://msdn.microsoft.com/en-us/library/ms141713.aspx)\
  \ 找到完整列表。\n\n![A978-1-4842-0638-6_1_Fig6_HTML.jpg](img/A978-1-4842-0638-6_1_Fig6_HTML.jpg)\n\
  \n图 1-6. 数据流中的转换组件\n\n##### 加载（目标）\n\nETL 的最后阶段是将数据加载到目标中。与存在多种可用源的方式类似，也存在多种目标。图\
  \ 1-7 是 SQL Server 2012/2014 的截图，显示了一些可用的目标。\n\n![A978-1-4842-0638-6_1_Fig7_HTML.jpg](img/A978-1-4842-0638-6_1_Fig7_HTML.jpg)\n\
  \n图 1-7. SSIS 中的目标组件\n\n#### 示例 1：将 .csv 文件加载到数据库\n\n以下示例是对使用 SSIS 任务和组件的介绍。本示例的目的是构建一个简单的\
  \ SSIS 包，并说明如何通过使用脚本更好地实现某些功能。它还指出了哪些功能只能通过 SSIS 中的脚本来实现。\n\n**注意：** 本示例对应的包名为 `Package1.dtsx`，您可以在第\
  \ 1 章的代码中找到它。\n\n在此练习中，您将把一个 `.csv` 文件加载到数据库中。在 SQL Server Management Studio (SSMS)\
  \ 中，使用默认的 SQL Server 实例，通过以下脚本创建一个名为 `Apress_SSIS_Scripting` 的数据库：\n\n```sql\nCREATE\
  \ DATABASE [Apress_SSIS_Scripting]\nCONTAINMENT = NONE\n```\n\n在 `Apress_SSIS_Scripting`\
  \ 数据库中，使用以下脚本创建一个表：\n\n```sql\nUSE [Apress_SSIS_Scripting]\nGO\n\nCREATE TABLE [dbo].Customer\
  \ NOT NULL,\n    [GeographyKey] varchar NULL,\n    [CustomerAlternateKey] varchar\
  \ NULL,\n    [Title] varchar NULL,\n    [FirstName] varchar NULL,\n    [MiddleName]\
  \ varchar NULL,\n    [LastName] varchar NULL,\n    [NameStyle] varchar NULL,\n \
  \   [BirthDate] varchar NULL,\n    [MaritalStatus] varchar NULL,\n    [Suffix] varchar\
  \ NULL,\n    [Gender] varchar NULL,\n    [EmailAddress] varchar NULL,\n    [YearlyIncome]\
  \ varchar NULL,\n    [TotalChildren] varchar NULL,\n    [NumberChildrenAtHome] varchar\
  \ NULL,\n    [EnglishEducation] varchar NULL,\n    [SpanishEducation] varchar NULL,\n\
  \    [FrenchEducation] varchar NULL,\n    [EnglishOccupation] varchar NULL,\n  \
  \  [SpanishOccupation] varchar NULL,\n    [FrenchOccupation] varchar NULL,\n   \
  \ [HouseOwnerFlag] varchar NULL,\n    [NumberCarsOwned] varchar NULL,\n    [AddressLine1]\
  \ varchar NULL,\n    [AddressLine2] varchar NULL,\n    [Phone] varchar NULL,\n \
  \   [DateFirstPurchase] varchar NULL,\n    [CommuteDistance] varchar NULL,\n   \
  \ [SourceFile] varchar NULL\n) ON [PRIMARY]\n```\n\n打开 SSDT 或 BIDS 并创建一个新的 SSIS\
  \ 项目，如图 1-8a 所示。在新的 SSIS 包（默认创建）中，从 SSIS 工具箱将一个数据流任务拖放到主窗格中，然后双击它以进入数据流选项卡。图 1-8b\
  \ 展示了如何在 Visual Studio 2013 的 SSDT-BI 中创建新的 SSIS 项目。\n\n![A978-1-4842-0638-6_1_Fig1-8b_HTML.jpg](img/A978-1-4842-0638-6_1_Fig1-8b_HTML.jpg)\n\
  \n图 1-8b. 创建平面文件源\n\n![A978-1-4842-0638-6_1_Fig1-8a_HTML.jpg](img/A978-1-4842-0638-6_1_Fig1-8a_HTML.jpg)\n\
  \n图 1-8a. 平面文件连接管理器\n\n在设计图面上拖放一个数据流任务并双击它。在数据流任务中，拖放一个平面文件源并双击它以打开其属性对话框。\n\n单击“新建”以创建一个新的平面文件连接管理器，指向本书源代码包中位于\
  \ `Chapter 01\\Source Files\\Customers.csv` 的 `.csv` 文件。\n\n配置平面文件连接管理器的“常规”选项卡，如图\
  \ 1-9 所示。\n\n![A978-1-4842-0638-6_1_Fig9_HTML.jpg](img/A978-1-4842-0638-6_1_Fig9_HTML.jpg)\n\
  \n图 1-9. 平面文件连接管理器\n\n单击“列”页面以从文件中加载可用列。单击“确定”并关闭平面文件连接管理器编辑器。在平面文件源编辑器中，从源中选择“保留空值”选项，以处理数据流中的空值。\n\
  \n单击“确定”关闭平面文件源编辑器。\n\n在平面文件源之后创建一个 OLE DB 目标，并将数据路径从平面文件源连接到该组件。选择平面文件数据输出（而非错误输出）。双击\
