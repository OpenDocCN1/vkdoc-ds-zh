  \ myZipFile.AlternateEncodingUsage = ZipOption.AsNecessary\n\n        ' 处理超大文件\n\
  \        myZipFile.UseZip64WhenSaving = Zip64Option.AsNecessary\n\n        ' 将文件添加到压缩包的根目录\n\
