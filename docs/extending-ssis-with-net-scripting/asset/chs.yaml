  \n![A978-1-4842-0638-6_6_Fig4_HTML.jpg](img/A978-1-4842-0638-6_6_Fig4_HTML.jpg)\n\
  \n图 6-4. 来自 Régis 的电子邮件\n\n### 从 Web 服务器下载文件\n\n使用 FTP 任务从 FTP 服务器下载文件很容易，但有时你需要从\
  \ Web 服务器获取文件。这个例子展示了如何使用脚本任务来实现这一点。登录或其他手动操作超出了本书的范围。一个简单的起点是公开可下载的文件。出于测试目的，你可以使用以下\
  \ URL：[`https://sites.google.com/site/ssisblogspot/products.csv`](https://sites.google.com/site/ssisblogspot/products.csv)。\n\
  \n#### 数据流任务\n\n起始情况是一个简单的数据流任务，如图 6-5 所示，它读取一个平面文件，但你需要刷新该平面文件并从网站下载一个新版本。你将使用名为\
  \ `Products` 的平面文件连接管理器来确定下载位置。有一个入门包可用，其中已经包含了数据流。\n\n![A978-1-4842-0638-6_6_Fig5_HTML.jpg](img/A978-1-4842-0638-6_6_Fig5_HTML.jpg)\n\
  \n图 6-5. 带有平面文件源的简单数据流任务\n\n\n\n#### HTTP 连接管理器\n\n要存储源文件的 URL，请使用 HTTP 连接管理器。在此示例中，只需填写要下载的文件的\
  \ URL；其他所有值均保留为默认值。示例如图 6-6 所示。\n\n![A978-1-4842-0638-6_6_Fig6_HTML.jpg](img/A978-1-4842-0638-6_6_Fig6_HTML.jpg)\n\
  \n图 6-6. 包含下载 URL 的 HTTP 连接管理器\n\n#### 脚本任务\n\n现在，在数据流任务上方添加一个脚本任务，并用优先约束将其连接起来。编辑该脚本任务。为其指定一个合适的名称，例如\
  \ `SCR – Download Products`，并选择你的脚本语言。之后，单击 `Edit Script...` 按钮打开 VSTA 环境。你应该会看到如图\
  \ 6-7 所示的流程。\n\n![A978-1-4842-0638-6_6_Fig7_HTML.jpg](img/A978-1-4842-0638-6_6_Fig7_HTML.jpg)\n\
  \n图 6-7. 添加脚本任务\n\n#### 代码\n\n现在，转到 `Main` 方法并添加以下代码：\n\n```\npublic void Main()\n\
  {\n  // 获取你新添加的 HTTP 连接管理器\n  Object HTTPConnectionManager =\n              Dts.Connections[\"\
  WebProducts\"].AcquireConnection(null);\n  // 创建一个新连接\n  HttpClientConnection WebProductConnection\
  \ =\n                            new HttpClientConnection(HTTPConnectionManager);\n\
