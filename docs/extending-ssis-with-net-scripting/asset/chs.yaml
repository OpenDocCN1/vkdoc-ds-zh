  \nFTP 任务是一个常用的任务，用于从 FTP 服务器下载特定文件。但如果你想从 FTP 文件夹下载最新文件，而又不知道确切文件名，该怎么办？开箱即用的 FTP\
  \ 任务无法实现这一点。在此示例中，你使用通配符过滤器来选择所有合适的文件，然后遍历这些文件以确定最新文件。此示例适用于基于 Windows 的 FTP 服务器。如果有多个文件具有相同的最大文件日期，你只会得到一个。\n\
  \n#### 变量\n\n在大多数情况下，最好使用连接管理器将登录信息传递给脚本，但在本例中，你需要密码，而由于密码是敏感属性，无法从 FTP 连接管理器对象中提取。在这种情况下，你将使用变量（或参数）来存储连接数据。准备就绪后，请务必从密码变量中移除该值。用配置替换其值，否则密码将在你的包中可见。\n\
  \n首先，创建五个 SSIS 字符串变量，并用你自有 FTP 服务器中的正确连接数据填充它们。名称和示例值如图 6-8 所示。\n\n![A978-1-4842-0638-6_6_Fig8_HTML.jpg](img/A978-1-4842-0638-6_6_Fig8_HTML.jpg)\n\
  \n图 6-8. SSIS 字符串变量\n\n#### 脚本任务\n\n向控制流添加一个脚本任务，用于下载最新文件。为其指定一个合适的名称，例如 `SCR –\
  \ Get Latest FTP File`。接下来，编辑它并将这五个 SSIS 字符串变量添加为 `ReadOnlyVariables`。参见图 6-9。\n\
  \n![A978-1-4842-0638-6_6_Fig9_HTML.jpg](img/A978-1-4842-0638-6_6_Fig9_HTML.jpg)\n\
  \n图 6-9. 脚本任务及其只读变量\n\n\n\n#### 脚本部分\n\n现在点击**编辑脚本...**按钮打开 VSTA 环境。首先，添加额外的命名空间来精简代码。\n\
  \n```\n#region customNamespaces\nusing System.Globalization;\nusing System.IO;\n\
  using System.Text.RegularExpressions;\n#endregion\n```\n\n以下是 VB.NET 代码：\n\n```\n\
  #Region \"customNamespaces\"\nImports System.Globalization\nImports System.IO\n\
  Imports System.Text.RegularExpressions\n#End Region\n```\n\n现在，将以下代码添加到 `Main` 方法中；同时将两个额外的方法添加到类中。第一个自定义方法用于确定\
  \ FTP 服务器上的最新文件。请确保该方法中的 `ListDirectoryDetails` 输出格式与你的服务器一致；否则，你需要更改日期时间格式。第二个自定义方法用于从\
  \ FTP 服务器下载文件。\n\n```\npublic void Main()\n{\n    // 用于存储 FTP 连接数据的字符串变量\n    string\
  \ ftpFolderPath = Dts.Variables[\"User::ftpFolderPath\"].Value.ToString();\n   \
  \ string ftpUser = Dts.Variables[\"User::ftpUser\"].Value.ToString();\n    string\
  \ ftpPassword = Dts.Variables[\"User::ftpPassword\"].Value.ToString();\n    string\
  \ ftpWildcard = Dts.Variables[\"User::ftpWildcard\"].Value.ToString();\n    string\
  \ downloadFolder = Dts.Variables[\"User::downloadPath\"].Value.ToString();\n\n \
  \   try\n    {\n        // 确定最新文件\n        string latestFile = GetLatestFile(ftpFolderPath,\
  \ ftpUser, ftpPassword, ftpWildcard);\n\n        // 现在，你可以填充一个 SSIS 字符串变量（参见第 4\
  \ 章）并使用\n        // FTP 任务来下载文件，或者使用一段代码来\n        // 下载它。\n        DownloadFile(latestFile,\
  \ ftpUser, ftpPassword, downloadFolder);\n\n        // 脚本任务成功\n        Dts.TaskResult\
  \ = (int)ScriptResults.Success;\n    }\n    catch (Exception ex)\n    {\n      \
  \  // 未找到文件\n        Dts.Events.FireError(0, \"最新文件\", ex.Message + Environment.NewLine\
  \ + ex.InnerException.Message, string.Empty, 0);\n\n        // 脚本任务失败\n        Dts.TaskResult\
  \ = (int)ScriptResults.Failure;\n    }\n}\n\n// 确定最新文件的方法\nprivate string GetLatestFile(string\
  \ ftpFolderPath,\n                             string ftpUser,\n               \
  \              string ftpPassword,\n                             string ftpWildcard)\n\
  {\n    // 用于检查最大日期的 DateTime 变量\n    DateTime highestDateTime = Convert.ToDateTime(\"\
  1-1-1900\");\n\n    // 用于存储最新文件的字符串变量\n    string fileWithHighestDate = \"\";\n\n\
  \    // 创建一个 FTP Web 请求\n    FtpWebRequest ftpRequest;\n    ftpRequest = (FtpWebRequest)FtpWebRequest.Create(ftpFolderPath);\n\
  \n    // 提供凭据并设置属性\n    ftpRequest.Credentials = new NetworkCredential(ftpUser,\
  \ ftpPassword);\n    ftpRequest.UseBinary = true;\n    ftpRequest.UsePassive = true;\n\
  \    ftpRequest.KeepAlive = true;\n\n    // 指定 FTP 请求的类型。该类型\n    // 返回包含文件详细信息的字符串。\n\
  \    // 对于基于 Windows 的 FTP 站点，格式如下：\n    // 08-09-14  07:35PM               435279\
  \ fileA.csv\n    // 08-10-15  07:34PM               443808 fileB.csv\n    // 08-11-16\
  \  07:33PM               424118 fileC.csv\n    // 07-06-13  03:53PM       <DIR>\
  \          foldername\n    ftpRequest.Method = WebRequestMethods.Ftp.ListDirectoryDetails;\n\
  \n    // 尝试连接服务器\n    try\n    {\n        // 建立连接并返回通信\n        FtpWebResponse ftpResponse;\n\
  \        ftpResponse = (FtpWebResponse)ftpRequest.GetResponse();\n\n        // 创建流并获取\
  \ FTP 服务器的响应流\n        Stream ftpStream;\n        ftpStream = ftpResponse.GetResponseStream();\n\
  \n        // 将流放入流读取器\n        StreamReader ftpReader = new StreamReader(ftpStream);\n\
  \n        // 设置日期时间格式：08-09-14 07:35PM\n        // 确保你的 FTP 服务器使用相同的格式\n       \
  \ string dtFormat = \"MM-dd-yy hh:mmtt\";\n        CultureInfo ci = CultureInfo.InvariantCulture;\n\
  \n        // 读取响应的每一行，并检查\n        // 哪个文件是最新的\n        while (ftpReader.Peek()\
  \ != -1)\n        {\n            // 将一行响应内容存入变量\n            string textLine = ftpReader.ReadLine();\n\
  \n            // 如果你想要检查行布局，可以\n            // 添加类似下面的代码，并注释掉\n            // while\
  \ 循环及其之后代码的其余部分：\n            // MessageBox.Show(textLine);\n\n            // 删除所有重复的空格\n\
  ```\n\n\n\n```csharp\ntextLine = Regex.Replace(textLine, @\"\\s+\", \" \");\n```\n\
  \n```csharp\n// 以空格分隔 textLine 并填充数组\nstring[] fileDetails = textLine.Split(\" \"\
  .ToCharArray());\n```\n\n```csharp\n// 将通配符转换为正则表达式模式\nstring wildcardPattern =\
  \ \"^\" + Regex.Escape(ftpWildcard).Replace(\"\\\\*\", \".*\").Replace(\"\\\\?\"\
  , \".\") + \"$\";\n```\n\n```csharp\n// 创建通配符正则表达式\nRegex wildcardRegex = new Regex(wildcardPattern,\
  \ RegexOptions.IgnoreCase);\n```\n\n```csharp\n// 检查文件是否匹配通配符，并跳过子文件夹\nif (wildcardRegex.IsMatch(fileDetails[3])\
  \ && !fileDetails[2].Trim().ToLower().Equals(\"<dir>\"))\n{\n    // 将日期和时间列组合成文件日期时间字符串\n\
  \    string fileDateTxt = fileDetails[0] + \" \" + fileDetails[1];\n    DateTime\
  \ fileDate = DateTime.ParseExact(fileDateTxt, dtFormat, ci);\n\n    // 检查当前文件是否为最新文件\n\
  \    if (fileDate > highestDateTime)\n    {\n        // 如果是，则替换最新文件的变量\n       \
  \ highestDateTime = fileDate;\n        fileWithHighestDate = fileDetails[3];\n \
  \   }\n}\n```\n\n```csharp\n// 资源清理\nftpReader.Close();\nftpStream.Close();\nftpResponse.Close();\n\
  ftpRequest = null;\n```\n\n```csharp\ncatch (Exception ex)\n{\n    // FTP 响应或峰值错误\n\
  \    throw new Exception(\"FTP 响应或峰值时出错\", ex);\n}\n```\n\n```csharp\nif (fileWithHighestDate.Equals(\"\
  \"))\n{\n    // 未找到文件\n    throw new Exception(\"未找到匹配通配符的文件\");\n}\n\nreturn ftpFolderPath\
  \ + fileWithHighestDate;\n```\n\n```csharp\n// 下载文件的方法\nprivate void DownloadFile(string\
  \ ftpFilePath, string ftpUser, string ftpPassword, string downloadFolder)\n{\n \
  \   // 创建一个 FTP Web 请求\n    FtpWebRequest ftpRequest;\n    ftpRequest = (FtpWebRequest)FtpWebRequest.Create(ftpFilePath);\n\
  \n    // 提供凭据并设置参数\n    ftpRequest.Credentials = new NetworkCredential(ftpUser,\
  \ ftpPassword);\n    ftpRequest.UseBinary = true;\n    ftpRequest.UsePassive = true;\n\
  \    ftpRequest.KeepAlive = true;\n\n    // 指定 FTP 请求的类型\n    ftpRequest.Method\
  \ = WebRequestMethods.Ftp.DownloadFile;\n\n    // 尝试连接到服务器\n    try\n    {\n   \
  \     // 建立连接并返回通信\n        FtpWebResponse ftpResponse;\n        ftpResponse = (FtpWebResponse)ftpRequest.GetResponse();\n\
  \n        // 创建流并获取 FTP 服务器的响应流\n        Stream ftpStream;\n        ftpStream =\
  \ ftpResponse.GetResponseStream();\n\n        // 确定 FTP 路径中的文件名\n        string\
  \ downloadFile = Path.Combine(downloadFolder, Path.GetFileName(ftpFilePath));\n\n\
  \        // 指定缓冲区大小\n        int bufferSize = 2048;\n\n        // 创建文件流以保存 FTP 文件\n\
  \        FileStream localFileStream = new FileStream(downloadFile, FileMode.Create);\n\
  \n        // 创建缓冲区用于下载数据\n        byte[] byteBuffer = new byte[bufferSize];\n\n\
  \        // 整数变量，用于存储读取的字节数\n        int bytesRead = ftpStream.Read(byteBuffer,\
  \ 0, bufferSize);\n\n        // 开始下载，直到所有字节下载完毕\n        while (bytesRead > 0)\n\
  \        {\n            // 将当前缓冲区写入本地文件\n            localFileStream.Write(byteBuffer,\
  \ 0, bytesRead);\n            // 下载下一个缓冲区\n            bytesRead = ftpStream.Read(byteBuffer,\
  \ 0, bufferSize);\n        }\n\n        // 资源清理\n        localFileStream.Close();\n\
  \        ftpStream.Close();\n        ftpResponse.Close();\n        ftpRequest =\
  \ null;\n    }\n    catch (Exception ex)\n    {\n        // FTP 响应或峰值错误\n      \
  \  throw new Exception(\"FTP 响应或峰值时出错\", ex);\n    }\n}\n```\n\n以下是 VB.NET 代码：\n\
