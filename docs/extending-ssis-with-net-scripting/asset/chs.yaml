  \n![A978-1-4842-0638-6_1_Fig10_HTML.jpg](img/A978-1-4842-0638-6_1_Fig10_HTML.jpg)\n\
  \n图 1-10. 创建 OLE DB 连接\n\n在表/视图下拉菜单中选择 `[dbo].[Customer]`，如图 1-11 所示。\n\n![A978-1-4842-0638-6_1_Fig11_HTML.jpg](img/A978-1-4842-0638-6_1_Fig11_HTML.jpg)\n\
  \n图 1-11. OLE DB 目标编辑器配置\n\n单击左侧窗格中的“映射”项，并确保每一列都已映射，如图 1-12 所示。\n\n![A978-1-4842-0638-6_1_Fig12_HTML.jpg](img/A978-1-4842-0638-6_1_Fig12_HTML.jpg)\n\
  \n图 1-12. 目标组件中的列映射\n\n在解决方案资源管理器中右键单击该包，并通过单击“执行包”菜单项来执行它。您将看到 1,000 行数据已成功从 `.csv`\
  \ 文件传输到数据库表中（参见图 1-13）。\n\n![A978-1-4842-0638-6_1_Fig13_HTML.jpg](img/A978-1-4842-0638-6_1_Fig13_HTML.jpg)\n\
  \n图 1-13. 执行结果\n\n\n\n### 使用 SSIS 内置组件组合执行操作\n\n在前一节中，您学习了如何创建一个包含源和目标组件的简单数据流任务。您还了解了\
  \ SSIS 如何帮助减少编程和编码工作。在之前的实验室中，您通过拖放和用户界面上的简单配置完成了任务。本实验的目的之一（除了作为入门介绍外）是为了说明 SSIS\
  \ 如何轻松帮助减少数据传输和合并的开发时间。\n\n在接下来的部分中，您将演练一个示例，其中 SSIS 通过内置组件帮助构建解决方案。您将使用与之前相同的数据流任务，并添加一个\
  \ Foreach 循环容器和一个表达式任务。您还将向包中添加一个变量，以使这些组件能够以更动态的方式相互通信。\n\nForeach 循环容器在包中定义了一个重复的控制流。循环实现与编程语言中的\
  \ `For` 循环非常相似。该容器枚举集合中的每个项。在此示例中，您将使用文件枚举器来循环遍历指定目录中的所有文件。\n\n表达式任务（仅在 SSIS 2012\
  \ 及更高版本中可用）在运行时创建并计算表达式的值。表达式任务使用 SSIS 表达式语言。该语言包含用于处理日期、字符串、数字和转换数据类型等操作的运算符和函数。该语言的完整描述可在\
  \ [`http://msdn.microsoft.com/en-us/library/ms137547.aspx`](http://msdn.microsoft.com/en-us/library/ms137547.aspx)\
  \ 找到。在本实验中，您将编写一个表达式来比较两个变量的值，以查找最新的文件。\n\n#### 示例 2：使用内置组件查找文件夹中的文件并将其加载到数据库\n\n\
  请在 SSMS 中运行以下代码以清空目标表：\n\n`Truncate table dbo.Customer`\n\n复制并粘贴上一个示例中的包。转到控制流设计器，然后将一个\
  \ Foreach 循环容器拖放到主设计区域。\n\n创建一个具有数据类型的新变量，并按图 1-14 所示进行命名。如果看不到变量窗口，请右键单击控制流中的空白区域，然后从上下文菜单中选择“变量”。\n\
  \n![A978-1-4842-0638-6_1_Fig14_HTML.jpg](img/A978-1-4842-0638-6_1_Fig14_HTML.jpg)\n\
  \n图 1-14. 变量定义\n\n转到 Foreach 循环编辑器（双击 Foreach 循环容器），然后转到“集合”页面。将枚举器设置为 Foreach 文件枚举器，该枚举器会显示其选项。然后将文件夹设置为\
  \ [Chapter 01](http://dx.doi.org/10.1007/978-1-4842-0638-6_01)\\Source Files（来自本书的源代码包），并确保您获取了完全限定的文件名，如图\
  \ 1-15 所示。\n\n![A978-1-4842-0638-6_1_Fig15_HTML.jpg](img/A978-1-4842-0638-6_1_Fig15_HTML.jpg)\n\
  \n图 1-15. Foreach 文件枚举器\n\n为了实现更精细的筛选，您可以在“文件”字段中添加通配符（例如 `*.csv`）。\n\n转到“变量映射”页面，然后从“变量”列中选择\
  \ `User::FullFilePath`。确保索引为 0（本次自动设置），如图 1-16 所示。\n\n![A978-1-4842-0638-6_1_Fig16_HTML.jpg](img/A978-1-4842-0638-6_1_Fig16_HTML.jpg)\n\
  \n图 1-16. 变量映射\n\n单击“确定”关闭 Foreach 循环编辑器。\n\n将上一章中的数据流任务和文件目标拖放到 Foreach 循环容器中，使其看起来如图\
  \ 1-17 所示。\n\n![A978-1-4842-0638-6_1_Fig17_HTML.jpg](img/A978-1-4842-0638-6_1_Fig17_HTML.jpg)\n\
  \n图 1-17. 控制流布局\n\n双击打开数据流任务。它应该看起来如图 1-18 所示。\n\n![A978-1-4842-0638-6_1_Fig18_HTML.jpg](img/A978-1-4842-0638-6_1_Fig18_HTML.jpg)\n\
