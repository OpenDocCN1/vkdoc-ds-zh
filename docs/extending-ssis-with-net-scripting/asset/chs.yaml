  \ fileInfo.Name, fileInfo.CreationTime)\nNext\n```\n\n根据所需的筛选条件和文件顺序（本例中为 `FileDate\
  \ ASC`）定义一组新的 `DataRow`：\n\n```csharp\nDataRow[] rows = dsUnsorted.Tables[0].Select(\"\
  FileName like '*.csv'\", \"FileDate ASC\");\n```\n\n在 VB.NET 中相应代码为：\n\n```vb\n\
  Dim rows As DataRow() = dsUnsorted.Tables(0).Select\n```\n\n创建一个新的数据集和一个仅包含 `FilePath`\
  \ 列的数据表（此新数据集将用于存储有序且经过筛选的列表）：\n\n```csharp\nDataSet dsSorted = new DataSet();\n\
  DataTable filelistTableSorted = dsSorted.Tables.Add();\nfilelistTableSorted.Columns.Add(\"\
