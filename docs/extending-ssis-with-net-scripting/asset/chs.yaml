- "# 7. 使用 Web 服务和 XML\n\n电子补充材料 本章的在线版本 (doi:[10.1007/978-1-4842-0638-6_7](http://dx.doi.org/10.1007/978-1-4842-0638-6_7))\
  \ 包含补充材料，仅供授权用户使用。\n\n根据万维网联盟 (W3C) 的定义，Web 服务是一种软件系统，旨在支持网络中机器与机器之间的可互操作交互。此外，W3C\
  \ 规定，Web 服务必须具有描述的接口，其他系统通过简单对象访问协议 (SOAP) 与该 Web 服务进行交互，通常通过 HTTP 并使用 XML 序列化。这个简短介绍清楚地表明，没有\
  \ XML 就没有 Web 服务。在 SSIS 中，你可以使用脚本任务和 .NET Framework（即使用 .NET 和 Windows Communication\
  \ Foundation）来使用 Web 服务。\n\n### Windows Communication Foundation\n\nWindows Communication\
  \ Foundation (WCF) 是一个用于构建面向服务的应用程序的框架。WCF 简化了 Web 服务的开发和运用，因为它提供了一种可管理的方法来创建 Web\
  \ 服务和 Web 服务客户端。\n\nWCF 提供以下功能：\n\n- 面向服务\n- 安全性\n- 互操作性\n- 多种消息模式\n- 服务元数据\n- 数据协定\n\
  - 多种传输和编码方式\n- 持久、可靠和排队的消息\n- 事务\n- 支持 REST 和 AJAX\n- 可扩展性\n\n关于 WCF 的论述已经很多；这是一个非常广泛的课题。如需更多信息，你可以在\
  \ MSDN 上阅读相关内容：[`https://msdn.microsoft.com/en-us/library/ms730846(v=vs.110).aspx`](https://msdn.microsoft.com/en-us/library/ms730846(v=vs.110).aspx)，或阅读\
  \ Nishith Pathak 所著的 *Pro WCF 4*（Apress，2011 年）。\n\n### Web 服务\n\n在 SSIS 中，有一个内置的\
  \ Web 服务任务可用于调用 Web 服务。该组件非常简单直接。你可以将结果保存到文件或变量，如图 7-1 所示。\n\n![A978-1-4842-0638-6_7_Fig1_HTML.jpg](img/A978-1-4842-0638-6_7_Fig1_HTML.jpg)\n\
  \n图 7-1. 内置的 Web 服务任务\n\n正如你在前几章中多次看到的，有时 SSIS 中内置任务的功能并不足够；这时你就需要脚本的灵活性和强大功能。\n\
  \n假设你想调用一个通过 NetTCP 而非 HTTP 进行通信的 WCF Web 服务。NetTCP 的优势在于二进制编码通信，并支持通过 TCP 协议进行进程间和跨计算机通信。标准\
  \ Web 服务任务不提供此选项。\n\n图 7-2 是一个示意图，显示了在何种情况下使用何种协议。在所有 HTTP 不可行的情况下，你需要使用脚本任务组件来调用你的\
  \ Web 服务。\n\n![A978-1-4842-0638-6_7_Fig2_HTML.jpg](img/A978-1-4842-0638-6_7_Fig2_HTML.jpg)\n\
  \n图 7-2. WCF 协议图表\n\n#### 创建变量\n\n你需要以下变量才能开始操作：\n\n- `City`：字符串类型，用于存储城市名称\n- `Country`：字符串类型，用于存储国家名称\n\
  - `ResultString`：字符串类型，用于存储来自 Web 服务调用的 XML 结果\n- `WeatherServiceURL`：也是字符串类型，用于存储\
  \ Web 服务 URL。将 Web 服务 URL 地址保存在变量中的主要优势是，你无需打开包即可更改它。例如，当 Web 服务（或包）从开发环境进入生产环境时，你可能希望控制使用哪个地址；实现此目的的一种方法是使用参数或动态配置它。\n\
  \n\n\n#### 脚本\n\n创建一个新的脚本任务组件，将其命名为`SCR_GetWeather`。添加之前创建的四个变量。`City`、`Country`和`ResultString`应设为`ReadWrite`，而`WeatherServiceURL`应设为`ReadOnly`。\n\
  \n#### 服务引用\n\n处理 Web 服务时，需要生成一个协定。这可以通过在 VSTA 项目中添加服务引用来实现。服务引用会生成调用 Web 服务所需的接口，其中包含可供调用的方法和类型。\n\
  \n> **注意：** 此功能仅在 SQL Server 2008 及更高版本的 SSIS 中可用。在此之前，VSTA 不支持添加服务引用。\n\n添加服务引用时，有几个需要注意的地方。在下面的示例中，你将使用对[`http://www.webservicex.net/globalweather.asmx?WSDL`](http://www.webservicex.net/globalweather.asmx?WSDL)上天气\
  \ Web 服务的引用。\n\n最初，没有`Service Reference`文件夹——只有`Reference`文件夹。你需要添加一个服务引用，该文件夹才会显示。要添加对\
  \ Web 服务的引用，请在 VSTA 解决方案资源管理器中右键单击`Reference`文件夹，然后选择**添加服务引用**。这将打开如图 7-3 所示的对话框窗口。\n\
  \n![A978-1-4842-0638-6_7_Fig3_HTML.jpg](img/A978-1-4842-0638-6_7_Fig3_HTML.jpg)\n\
  \n**图 7-3.** 添加服务引用对话框\n\n以下是图 7-3 所示的**添加服务引用**对话框中需要完成的步骤：\n\n- 输入要连接的 Web 服务的地址。\n\
  - 在**服务**中，由于你使用的是 WCF，请选择 SOAP 实现。\n- 在**操作**中，你可以选择两种方法。\n- 输入一个命名空间，这是你从脚本中调用服务时将使用的名称。\n\
  \n填写完对话框后，按下**确定**按钮。在此过程中，VSTA 会生成使用 Web 服务所需的元数据。所有用于调用 Web 服务的方法、属性、签名、接口及其他构件都会自动生成。\n\
  \n> **注意：** 由于这是自动生成的代码，你不应对其进行修改，因为刷新服务引用后，更改将会丢失。\n\n如果你想了解元数据是如何生成的，并探究 Web 服务的本质，可以查看自动生成的文件。大多数情况下，这并非必需，因为\
  \ VSTA 提供了必要的 IntelliSense 来调用服务。与代码文件一起，一个`app.config`文件也会被添加到项目中，其中包含协定和 Web 服务绑定所需的信息。\n\
  \n以下是天气 Web 服务引用的`app.config`：\n\n```\n<?xml version=\"1.0\" encoding=\"utf-8\"\
  \ ?>\n<configuration>\n  <system.serviceModel>\n    <bindings>\n      <basicHttpBinding>\n\
  \        <binding name=\"GetCitiesByCountry\" />\n      </basicHttpBinding>\n  \
  \  </bindings>\n    <client>\n      <endpoint address=\"http://www.webservicex.net/globalweather.asmx\"\
  \n          binding=\"basicHttpBinding\" bindingConfiguration=\"GlobalWeatherSoap\"\
  \n          contract=\"GetCitiesByCountry.GlobalWeatherSoap\" name=\"GlobalWeatherSoap\"\
  \ />\n    </client>\n  </system.serviceModel>\n</configuration>\n```\n\n##### 自定义命名空间\n\
  \n`System.ServiceModel` 是所有 WCF 实现所在的命名空间。你需要将其添加到命名空间区域；或者更好的做法是，添加一个自定义命名空间区域，如下所示：\n\
  \n```\n#region CustomNamespace\nusing System.ServiceModel;\nusing System.Xml;\n\
  using ST_1211e492c97246a9947e241a0234dce6.GetWeather;\nusing System.IO;\n#endregion\n\
  ```\n\n`System.ServiceModel` 首次引入于 .NET Framework 3.0。\n\n> **注意：** 如果你使用的是较旧版本的\
  \ .NET Framework，则需要手动生成 WSDL、`.disco` 文件、XSD 模式及其他构件。有关如何执行此操作的更多信息，请访问[`https://msdn.microsoft.com/en-us/library/7h3ystb6%28v=vs.80%29.aspx`](https://msdn.microsoft.com/en-us/library/7h3ystb6%28v=vs.80%29.aspx)。\n\
  \n#### 配置还是非配置\n\n生成代码后，情况会变得稍微复杂一些，因为有两种调用 WCF Web 服务的方法。现在你有两个选项进行配置和调试：修改一堆`.config`文件，或者在\
  \ C#/VB.NET 中进行配置。前者可移植性最好，而后者最适合调试。以下将介绍这两种解决方案。\n\n#### 解决方案 1：修改 .config 文件\n\
  \n此解决方案包括两个步骤。\n\n##### 调试所需的更改\n\n调试时，你需要修改 `DtsDebugHost.exe.Config` 文件。`DtsDebugHost.exe`\
  \ 是 SSDT 在调试模式下执行包时使用的文件。因此，需要修改其`.config`文件，以反映对 VSTA 项目中 `app.config` 所做的更改。该文件可在\
  \ 64 位文件夹和 32 位文件夹中找到。SSDT 仅支持 32 位，但调试器支持两种模式，这使得事情更加混乱。在项目属性的**调试**窗格中可以更改 `Run64BitRuntime`。在\
  \ SQL Server 2014 安装中，该文件位于 `C:\\Program Files\\Microsoft SQL Server\\120\\DTS\\\
  Binn`。\n\n##### 调试完成后的更改\n\n这一部分或许应该称为“我的 `app.config` 在哪里？”，因为根据你调用包的方式，可能需要更改其他几个文件。\n\
  \n- `DTExec.exe.config`：用于调用包的独立 `DTExec.exe` 应用程序的`.config`文件。它同时具有 32 位和 64 位版本；在\
  \ SQL Server 2014 中，位于 `C:\\ProgramFiles\\MicrosoftSQLServer\\120\\DTS\\Binn`。\n\
  - `DtsHost.exe.config`：SQL Server 代理在调用包时使用的文件。该文件有 32 位和 64 位版本。在 SQL Server 2014\
  \ 上，通常位于 `C:\\ProgramFiles\\MicrosoftSQLServer\\120\\DTS\\Binn`。\n- `DTExecUI.exe.config`：`DTExec.exe`\
  \ 用户界面使用的文件。在 SQL Server 2014 安装中，通常也位于 `C:\\ProgramFiles\\MicrosoftSQLServer\\\
  120\\DTS\\Binn`。\n- `ISServer.exe.config`：在使用包部署模型并从 SSMS 执行包时，SSISDB 和 `ISServer.exe`\
  \ 使用的文件。该文件位于 `C:\\Program Files\\Microsoft SQL Server\\120\\DTS\\Binn`。\n\n可以想象，保持所有这些文件同步更新是相当困难的。\n\
  \n表 7-1 列出了所有文件及其位置。\n\n**表 7-1.** .config 文件及其位置\n\n| 文件名 | 32 位 | 64 位 |\n| ---\
  \ | --- | --- |\n| `DtsDebugHost.exe.config` | `C:\\Program Files (x86)\\Microsoft\
  \ SQL Server\\120\\DTS\\Binn` | `C:\\Program Files\\Microsoft SQL Server\\120\\\
  DTS\\Binn` |\n| `DTExec.exe.config` | `C:\\Program Files (x86))\\Microsoft SQL Server\\\
  120\\DTS\\Binn` | `C:\\Program Files\\Microsoft SQL Server\\120\\DTS\\Binn` |\n\
  | `DtsHost.exe.config` | `C:\\Program Files (x86))\\Microsoft SQL Server\\120\\\
  DTS\\Binn` | `C:\\Program Files\\Microsoft SQL Server\\120\\DTS\\Binn` |\n| `ISServer.exe.config`\
  \ | `C:\\Program Files (x86))\\Microsoft SQL Server\\120\\DTS\\Binn` | `C:\\Program\
  \ Files\\Microsoft SQL Server\\120\\DTS\\Binn` |\n\n> **注意：** 名为 `120` 的文件夹对应 SQL\
  \ Server 2014，`110` 对应 SQL Server 2012，`100` 对应 SQL Server 2008。\n\n由此引入在脚本任务中实现\
  \ Web 服务调用的解决方案 2。\n\n#### 解决方案 2：代码内方法\n\n使用此方法，你无需更改任何一个`.config`文件。这也是一种无需保持多个`.config`文件同步更新的同时，轻松了解如何配置和调用\
  \ Web 服务的方法。唯一的缺点是，如果服务更改了其终结点地址或身份验证方法，则需要重新编译脚本。\n\n代码基本上是 `.config` 文件中所述内容的\
  \ C# 或 VB.NET 表现形式。`GetWeather` 应用程序的代码如下所示。\n\n\n\n#### 代码\n\n> **注意**：以下代码片段展示了脚本的不同部分。完整脚本将在下文展示；同时也可在第\
  \ 7 章的源代码中找到。\n\n所使用的 `ChannelFactory` 类型是添加 Web 服务引用时生成的接口。此处为 `GlobalWeatherSoap`\
  \ 公共接口。\n\n```csharp\n// 使用 Web 服务的类型创建 Channel Factory。\nChannelFactory<GlobalWeatherSoap>\
  \ channelFactory = null;\n```\n\n以下是 VB.NET 中的写法：\n\n```vb\n' 创建正确类型的 ChannelFactory\n\
  Dim channelFactory As ChannelFactory(Of GlobalWeatherSoap) = Nothing\n```\n\n你还需要一个变量来存储终结点，以便后续使用。\n\
  \n```csharp\nEndpointAddress ep = null;\n```\n\n以下是 VB.NET 中的写法：\n\n```vb\nDim ep\
  \ As EndpointAddress = Nothing\n```\n\n要调用 Web 服务，你需要一个终结点地址，这基本上就是添加服务引用时使用的地址。使用变量可以提高灵活性。\n\
  \n```csharp\n// 指定地址是什么\nstring epAdr = \"http://www.webservicex.net/globalweather.asmx\"\
  ;\n```\n\n以下是 VB.NET 中的写法：\n\n```vb\n' 指定地址是什么\nDim epAdr As String = \"http://www.webservicex.net/globalweather.asmx\"\
  \n```\n\n之后，你可以开始指定要使用的绑定，并创建用于 `ChannelFactory` 的终结点：\n\n```csharp\n// 获取正确的绑定\n\
  BasicHttpBinding httpb = new BasicHttpBinding();\nchannelFactory = new ChannelFactory<GlobalWeatherSoap>(httpb);\n\
  // 使用我们的地址创建必要的终结点\nep = new EndpointAddress(epAdr);\n```\n\n以下是 VB.NET 中的写法：\n\n\
  ```vb\n' 获取正确的绑定\nDim httpb As New BasicHttpBinding()\nchannelFactory = New ChannelFactory(Of\
  \ GlobalWeatherSoap)(httpb)\n' 使用我们的地址创建必要的终结点\nep = New EndpointAddress(epAdr)\n\
  ```\n\n一旦准备好这些元素，你就可以进入 Web 服务的重要部分：调用服务本身并获取结果。\n\n```csharp\n// 准备创建 Web 服务的表示\n\
  GlobalWeatherSoap weatherSvcObj = channelFactory.CreateChannel(ep);\n// 获取某个国家的地理信息\n\
  string result = weatherSvcObj.GetCitiesByCountry(\"France\");\n// 将结果保存到变量中供以后使用。\n\
  Dts.Variables[\"ResultString\"].Value = result;\n```\n\n以下是 VB.NET 中的写法：\n\n```vb\n\
  ' 使用我们的地址创建必要的终结点\n' 准备创建 Web 服务的表示\nDim weatherSvcObj As GlobalWeatherSoap = channelFactory.CreateChannel(ep)\n\
  ' 获取某个国家的地理信息\nDim result As String = weatherSvcObj.GetCitiesByCountry(\"France\"\
  )\n' 将结果保存到变量中供以后使用。\nDts.Variables(\"ResultString\").Value = result\n```\n\n由于\
  \ Web 服务通常不受你控制，因此最好做好处理错误的准备，因为沿着连接终结点路径的许多地方都可能出错。所以，`try-catch` 在这里非常必要。\n\n\
  以下是 C# 中完整的 `Main` 方法：\n\n```csharp\n// 创建正确类型的 ChannelFactory – 需要 using 才能在代码中使用服务引用\n\
  // 在我们的例子中为：\n// using ST_751e10ef586a4cd9ac45c6d1c84c526c.GetWeather;\nChannelFactory<GlobalWeatherSoap>\
