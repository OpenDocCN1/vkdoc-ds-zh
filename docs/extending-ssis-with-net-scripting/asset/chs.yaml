  \ 50，`DT_STR` 1252）\n\n#### 创建连接管理器\n\n在此示例中，您将从`脚本组件编辑器`内部创建一个新的连接管理器，但您也可以预先创建，然后在此编辑器中使用该连接管理器。转到“连接管理器”选项卡并添加一个新连接(1)，以避免在脚本中对连接字符串进行硬编码。连接管理器类型(2)应为`FILE`，使用类型(3)应为“现有文件”。接下来，将默认名称从`Connection`更改为`myFile`。这些步骤如图\
