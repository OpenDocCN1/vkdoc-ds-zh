  \ SSIS 字符串变量，示例如下：\n\n`Dts.Variables[\"NewestFile\"].Value = Path.Combine(downloadFolder,\
  \ latestFile);`\n\n以下是 VB.NET 代码：\n\n`Dts.Variables(\"NewestFile\").Value = Path.Combine(downloadFolder,\
  \ latestFile)`\n\n### 从 SFTP 服务器下载文件\n\nSSIS FTP 任务不支持安全 FTP，.NET Framework 本身也不支持。因此，本示例需要在脚本任务中使用第三方\
  \ SFTP 库。市面上有很多商业库可供选择，但本示例将使用 CodePlex 上的 SSH.NET 库（`http://sshnet.codeplex.com`）。\n\
  \nCodePlex 是微软的开源项目托管站点。虽然所有项目都是开源项目，但在使用某个程序集或代码片段之前，请检查项目许可证。某些项目对商业使用有限制。\n\n\
  #### 下载与安装\n\n访问 `http://sshnet.codeplex.com`，下载合适的 SSHNet 二进制文件（SSIS 2008 使用 SSHNet\
  \ .NET 3.5 二进制文件，SSIS 2012 及更高版本使用 SSHNet .NET 4.0 二进制文件）。通过 Visual Studio 命令提示符，可以使用\
  \ `gacutil` 将该库添加到全局程序集缓存：`gacutil -i Renci.SshNet.dll`（请参阅第 4 章）。之后，即可在脚本任务中使用该库。\n\
  \n\n#### 变量\n\n大多数情况下，使用连接管理器是更优的选择，但由于没有可用的 SFTP 连接管理器，你需要使用变量（或参数）。在本示例中，你将使用变量来存储连接数据。准备好后，请务必从变量值中移除敏感数据，例如密码和密钥。将这些值替换为配置项；否则，它们将在你的包中可见。\n\
  \n首先，创建五个 SSIS 字符串变量，并用正确的连接数据填充它们。表 6-1 描述了这些变量及其用途。图 6-10 显示了已填充数据的变量。\n\n![A978-1-4842-0638-6_6_Fig10_HTML.jpg](img/A978-1-4842-0638-6_6_Fig10_HTML.jpg)\n\
  \n图 6-10. SFTP 连接变量：下载\n\n表 6-1. 用于存储连接数据的变量\n\n| 名称 | 数据类型 | 描述 |\n| --- | ---\
  \ | --- |\n| `sftpServer` | String | 包含 SFTP 服务器的名称或 IP 地址 |\n| `sftpUser` | String\
  \ | 包含有权访问 SFTP 服务器的用户名 |\n| `sftpPassword` | String | 对应的密码 |\n| `sftpFilePath`\
  \ | String | 你需要下载的文件路径：`/export/source.zip` |\n| `downloadPath` | String | 本地下载文件夹的路径：`d:\\\
  downloadfolder` |\n\n#### 脚本任务\n\n在控制流中添加一个脚本任务，用于从 SFTP 服务器下载文件。为其指定一个合适的名称，例如\
  \ `SCR – Download SFTP File`。然后，编辑该脚本任务，并将五个 SSIS 字符串变量添加为 `ReadOnlyVariables`。图\
