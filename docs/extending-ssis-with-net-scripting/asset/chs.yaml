  #### 脚本组件


  '
- "# 9. 脚本组件基础\n\n电子补充材料 本章的在线版本 (doi:[10.​1007/​978-1-4842-0638-6_​9](http://dx.doi.org/10.1007/978-1-4842-0638-6_9))\
  \ 包含补充材料，可供授权用户使用。\n\n如果您有不规则的平面文件格式，或者想要使用正则表达式清理数据，或者需要 XML 目标，那么脚本组件是您的最佳选择之一。脚本组件是\
  \ SSIS 数据流的一部分；它为您提供了一个脚本编辑器。它可以用作源、转换或目标。在本章中，您将深入研究脚本组件以及该组件的一些最常见用法。您将学习如何在脚本组件中使用变量、连接管理器、日志记录方法和错误处理。\n\
  \n\n\n### 编辑器\n\n由于脚本组件可用于多种目的，因此当您将其添加到数据流任务的设计界面时，首先必须选择脚本类型（`Source`、`Destination`\
  \ 或 `Transformation`）（参见图 9-1）。这是一个“一次性选择”选项，这意味着只能在创建组件时进行选择。如果您想要更改它，则必须删除并重新创建该组件。根据您选择的类型，为该组件生成的默认代码会发生变化，但其他特性（例如添加输入列或输出列的能力）也会随之改变。\n\
  \n![A978-1-4842-0638-6_9_Fig1_HTML.jpg](img/A978-1-4842-0638-6_9_Fig1_HTML.jpg)\n\
  \n图 9-1. 脚本组件类型\n\n脚本组件编辑器与脚本任务编辑器类似，但它拥有更多选项和页面（参见图 9-2）。在第一页上，您可以添加 `ReadOnly`\
  \ 和 `ReadWrite` 变量，以避免在代码中出现硬编码值。您还可以选择脚本语言：`C#` 或 `VB.NET`。如果您仍在使用 SSIS 2005，则唯一的选择是\
  \ `VB.NET`。此语言选项是“一次写入”的。在点击 `Edit Script...` 按钮后，该选项将变为灰色，并且您无法再更改脚本语言。更改它的唯一方法是删除整个脚本组件，将新的组件添加到您的数据流中，然后重新开始。\n\
  \n![A978-1-4842-0638-6_9_Fig2_HTML.jpg](img/A978-1-4842-0638-6_9_Fig2_HTML.jpg)\n\
  \n图 9-2. 脚本组件编辑器\n\n#### 输入列\n\n只有在您选择 `Transformation` 或 `Destination` 作为脚本组件类型时，“输入列”页面才可见。在此页面上，您可以选择需要在\
  \ .NET 代码中交互的所有列（参见图 9-3）。默认情况下，所有列都是 `ReadOnly` 的，但在 `Usage Type` 列中，您可以将某列设置为\
  \ `ReadWrite`。\n\n![A978-1-4842-0638-6_9_Fig3_HTML.jpg](img/A978-1-4842-0638-6_9_Fig3_HTML.jpg)\n\
  \n图 9-3. 输入列\n\n脚本组件无法处理不以字母开头的名称。当列名以数字或标点符号开头时，它会在内部名称中将其移除。因此，`1stResult` 在代码中变成了\
  \ `Row.stResult`。如果您有两个名称相同但数字前缀不同的列，这可能会导致问题。在 `Output Alias` 列中，您可以重命名列。此重命名操作不仅适用于脚本，也适用于数据流的其余部分。\n\
  \n#### 输入和输出\n\n在第三页上，您可以添加可由 .NET 脚本填充的新列。例如，您可以添加一个数据类型为 `DT_I4` 的 `RowNumber`\
  \ 列，并在脚本中为其填充一个序列号（参见图 9-4）。而且，还可以添加一个额外的输出，这允许您将行分割到多个输出中；不过，有关此内容的更多信息将在本章后面介绍。\n\
  \n![A978-1-4842-0638-6_9_Fig4_HTML.jpg](img/A978-1-4842-0638-6_9_Fig4_HTML.jpg)\n\
  \n图 9-4. 添加新的 RowNumber 列\n\n### 连接管理器\n\n在最后一页上，您可以添加希望在脚本代码中使用的连接管理器（参见图 9-5）。您可以使用连接管理器来防止代码中出现硬编码路径。在代码中使用连接管理器之前，必须先将其添加到该列表中。这与脚本任务编辑器不同，在脚本任务编辑器中，您可以直接在代码中添加连接管理器。在\
  \ `Name` 列中，您可以为其添加一个别名，该别名将在脚本代码中使用。空格会被移除，就像带有数字或标点符号的前缀一样。\n\n![A978-1-4842-0638-6_9_Fig5_HTML.jpg](img/A978-1-4842-0638-6_9_Fig5_HTML.jpg)\n\
  \n图 9-5. 选择连接管理器\n\n为了存储文件或文件夹路径，您最可能使用文件连接管理器，但您可以使用所有类型的连接管理器。但是，在脚本组件中使用数据库连接管理器来执行查询时需要谨慎，因为可能存在不需要编码的更简单的解决方案；例如，使用\
  \ `Execute SQL Task` 甚至 `OLE DB` 命令。\n\n\n### 脚本布局\n\n当您完成变量、列和连接管理器的设置后，可以点击`编辑脚本...`按钮打开\
  \ VSTA 编辑器（见图 9-6）。该编辑器是 Visual Studio 的一个新实例，其中包含一个使用 C# 或 VB.NET 代码的 VSTA 项目。`VSTA`\
  \ 代表 Visual Studio Tools for Applications。根据脚本类型（源、转换或目标），VSTA 编辑器会添加带有不同方法的默认代码。SSIS\
  \ 2005 使用的是 Visual Studio for Applications (VSA)。与 VSTA 相比，最大的区别在于它不支持 C# 语言。\n\n\
  ![A978-1-4842-0638-6_9_Fig6_HTML.jpg](img/A978-1-4842-0638-6_9_Fig6_HTML.jpg)\n\n\
  图 9-6. VSTA 编辑器\n\n下面介绍图 9-6 中编辑器的各个部分。这与脚本任务章节类似，因为它们都使用相同的 VSTA 环境。\n\n- **A.\
  \ 主窗口**：您在此处编写代码。当您关闭 VSTA 编辑器时，保存操作会自动完成。\n- **B. 解决方案资源管理器**：在此部分中，您可以添加额外的引用、更改项目属性（例如目标框架），还可以选择性地添加额外的\
  \ C# 或 VB.NET 文件。更改应使用`全部保存`按钮保存；否则，当您关闭 VSTA 编辑器时，这些更改将丢失。\n- **C. 属性**：在此处，您可以查看在解决方案资源管理器中所选项目的属性；例如，您可以查看（临时）VSTA\
  \ 项目在磁盘上的存储位置。\n\nA 部分的脚本是自动生成的，其代码根据脚本类型、SSIS 版本以及脚本语言的不同而有所差异。脚本组件始终以一条通用注释开头。SSIS\
  \ 不同版本间的文本会发生变化。要么删除这些注释，更好做法是用关于文件/脚本的有用注释来替换它们。您为什么使用脚本组件？您的代码在做什么？在 2012 版本中，加入了\
  \ `regions` 以使代码更有序。您也可以手动将它们添加到 SSIS 2008 的脚本中。\n\n```\n#region Help:  Introduction\
  \ to the Script Component\n\n/* The Script Component allows you to perform virtually\
  \ any operation that can\n* be accomplished in a .Net application within the context\
  \ of an Integration\n* Services data flow.\n*\n* Expand the other regions which\
  \ have \"Help\" prefixes for examples of specific\n* ways to use Integration Services\
  \ features within this script component. */\n#endregion\n```\n\n这是 VB.NET 代码：\n\n\
  ```\n#Region \"Help:  Introduction to the Script Component\"\n\n' The Script Component\
  \ allows you to perform virtually any operation that can\n' be accomplished in a\
  \ .Net application within the context of an Integration\n' Services data flow.\n\
  ' Expand the other regions which have \"Help\" prefixes for examples of specific\n\
  ' ways to use Integration Services features within this script component.\n#End\
  \ Region\n```\n\n接下来是 `using` 指令或 `import` 语句。在 C# 中，它们被称为 `using` 指令；例如：\n\n```\n\
  #region Namespaces\n\nusing System;\nusing System.Data;\nusing Microsoft.SqlServer.Dts.Pipeline.Wrapper;\n\
  using Microsoft.SqlServer.Dts.Runtime.Wrapper;\n#endregion\n```\n\n在 VB.NET 中，它们被称为\
  \ `Import` 语句；例如：\n\n```\n#Region \"Imports\"\n\nImports System\nImports System.Data\n\
  Imports System.Math\nImports Microsoft.SqlServer.Dts.Pipeline.Wrapper\nImports Microsoft.SqlServer.Dts.Runtime.Wrapper\n\
  #End Region\n```\n\n包含哪些命名空间因 SSIS 版本而异，甚至因脚本语言而异。您可以添加额外的 `using`/`imports` 以使代码更简洁。它们启用/允许使用给定命名空间中的类型，而无需完全限定引用它们（关于\
  \ .NET 基础知识的更多信息，请参见第 3 章）。\n\n第三部分是命名空间和类声明。这些是自动生成的。除非您是经验丰富的 .NET 开发人员并且有充分的理由进行更改，否则请不要修改它们。\n\
  \n```\n/// <summary>\n/// This is the class to which to add your code.  Do not change\
  \ the name,\n/// attributes, or parent of this class.\n/// </summary>\n[Microsoft.SqlServer.Dts.Pipeline.SSISScriptComponentEntryPointAttribute]\n\
  public class ScriptMain : UserComponent\n{\n```\n\n这是 VB.NET 代码：\n\n```\n' This\
  \ is the class to which to add your code.  Do not change the name,\n' attributes,\
  \ or parent of this class.\n<Microsoft.SqlServer.Dts.Pipeline.SSISScriptComponentEntryPointAttribute>\
  \ _\n<CLSCompliant(False)> _\nPublic Class ScriptMain\nInherits UserComponent\n\
  ```\n\n接下来是关于变量、连接管理器和事件的大量帮助文本，这些文本被包裹在区域中。您可以删除这些内容以获得更清晰的代码，因为它们对于实际代码并非必需。在所有帮助文本之后，您会看到实际的方法。以下部分描述了六个最常用/最常重写的方法：`AcquireConnections`、`ReleaseConnections`、`PreExecute`、`PostExecute`、`CreateNewOutputRows`\
  \ 和 `Input0_ProcessInputRow`。默认情况下并非所有这些方法都会包含在内，但您可以手动添加它们。或者，如果您不想在代码中包含太多方法，也可以合并代码——例如，合并\
  \ `AcquireConnections` 和 `PreExecute` 方法，仅使用 `PreExecute` 方法。您在互联网上的许多代码示例中都能看到这种用法。\n\
  \n如果您重写了一个方法，您会自动获得一些默认代码，这些代码执行来自被重写方法的基础代码。该行以 `base.` 开头，后跟方法名。您可以删除它，因为它在 SSIS\
  \ 中不执行任何操作。大多数 MSDN 示例也不包含它们。或者您也可以保留它，因为它不会对代码造成损害。\n\n#### AcquireConnections\n\
  \n此方法不在默认代码中。顾名思义，`AcquireConnections` 方法用于从连接管理器中获取连接。在此示例中，您将从 ADO.NET 连接管理器获取连接，并将其存储在一个类变量中，以便在其他方法中使用。\n\
  \n```\n// Create class variables so that they can be used in all methods.\n// Added\
  \ System.Data.SqlClient to usings.\n\nIDTSConnectionManager100 myAdoConnectionManager;\n\
  System.Data.SqlClient.SqlConnection myDbConnection;\n\npublic override void AcquireConnections(object\
  \ Transaction)\n{\n  // Fill connection manager object with a Package connection\
  \ manager\n  myAdoConnectionManager = this.Connections.myADOConn;\n\n  // Fill connection\
  \ object with connection from the\n  // ADO.NET connection manager object.\n  myDbConnection\
  \ = (System.Data.SqlClient.SqlConnection)myAdoConnectionManager\n              \
  \            .AcquireConnection(Transaction);\n}\n```\n\n这是 VB.NET 代码：\n\n```\n\
  ' Create class variables so that they can be used in all\n' Added System.Data.SqlClient\
  \ to imports.\n\nPrivate myAdoConnectionManager As IDTSConnectionManager100\nPrivate\
  \ myDbConnection As System.Data.SqlClient.SqlConnection\n\nPublic Overrides Sub\
  \ AcquireConnections(Transaction As Object)\n  ' Fill connection manager object\
  \ with a Package connection manager\n  myAdoConnectionManager = Me.Connections.myADOConn\n\
  \n  ' Fill connection object with connection from the\n  ' ADO.NET connection manager\
  \ object.\n  myDbConnection = DirectCast(myAdoConnectionManager _\n        .AcquireConnection(Transaction),\
  \ System.Data.SqlClient.SqlConnection)\nEnd Sub\n```\n\n#### ReleaseConnections\n\
  \n`ReleaseConnections` 是 `AcquireConnections` 方法的对应方法。在此方法中，当您不再需要连接时释放它。此代码使用与\
  \ `AcquireConnections` 方法代码相同的类变量。\n\n```\npublic override void ReleaseConnections()\n\
  {\n  // Release the connection when finished\n  myAdoConnectionManager.ReleaseConnection(myDbConnection);\n\
  }\n```\n\n这是 VB.NET 代码：\n\n```\nPublic Overrides Sub ReleaseConnections()\n  ' Release\
  \ the connection when finished\n  myAdoConnectionManager.ReleaseConnection(myDbConnection)\n\
  End Sub\n```\n\n\n\n#### PreExecute\n\n`PreExecute`方法在任意行通过组件之前执行。它常用于获取变量或连接管理器，或执行一些初始代码，例如以下示例中启动一个新的\
  \ XML 文档。\n\n```\n// Variable that contains the XML document  \n// Added System.Xml\
  \ to usings  \nXmlTextWriter textWriter;  \n\n// Start of XML document  \npublic\
  \ override void PreExecute()  \n{  \n    // Create a new XML document and use the\
  \ filepath  \n    // from a FILE connection manager named xmldocument as XML-file\
  \  \n    textWriter = new XmlTextWriter(  \n                 this.Connections.xmldocument.ConnectionString.ToString(),\
  \ null);  \n    // Start writing the XML document:  \n    textWriter.WriteStartDocument();\
  \  \n    // Create root element <root>  \n    textWriter.WriteStartElement(\"ROOT\"\
  );  \n}\n```\n\n以下是 VB.NET 代码：\n\n```\n' Variable that contains the XML document\
  \  \n' Added System.Xml to imports  \nDim textWriter As XmlTextWriter  \n\nPublic\
  \ Overrides Sub PreExecute()  \n    MyBase.PreExecute()  \n    ' Create a new XML\
  \ document and use the filepath  \n    ' from a file connection manager named xmldocument\
  \ as XML-file  \n    textWriter = New XmlTextWriter( _  \n                 Me.Connections.xmldocument.ConnectionString.ToString(),\
  \ _  \n                 System.Text.Encoding.Default)  \n    'Start writing the\
  \ XML document:  \n    textWriter.WriteStartDocument()  \n    'Create root element\
  \ <root>  \n    textWriter.WriteStartElement(\"ROOT\")  \nEnd Sub\n```\n\n#### PostExecute\n\
  \n`PostExecute`方法在所有行通过组件之后执行。它常用于设置变量或释放连接管理器，或执行一些最终代码。在此示例中，您将关闭在`PreExecute`方法中打开的\
  \ XML 文档。在第 12 章中，您将看到此 XML 目标的完整示例。\n\n```\n// Close of XML document  \npublic\
  \ override void PostExecute()  \n{  \n    // Close root element: </root>  \n   \
  \ textWriter.WriteEndElement();  \n    // Stop writing the XML document  \n    textWriter.WriteEndDocument();\
  \  \n    // Close document  \n    textWriter.Close();  \n}\n```\n\n以下是 VB.NET 代码：\n\
  \n```\nPublic Overrides Sub PostExecute()  \n    'Close root element: </root>  \n\
  \    textWriter.WriteEndElement()  \n    'Stop writing the XML document  \n    textWriter.WriteEndDocument()\
  \  \n    'Close document  \n    textWriter.Close()  \nEnd Sub\n```\n\n#### Input0_ProcessInputRow\n\
  \n`Input0_ProcessInputRow`方法仅在脚本组件转换和目标中可用。它针对进入脚本组件的每条记录执行一次。在此方法中，您将处理每行中的列值。在此示例中，您将使用序列号填充一个名为`RowNumber`的新输出列。您可以在第\
  \ 11 章中找到完整示例。\n\n```\n// New internal variable to store the rownumber  \nprivate\
  \ int sequenceNumber = 0;  \n\n// Method that will be started for each record in\
  \ your dataflow  \npublic override void Input0_ProcessInputRow(Input0Buffer Row)\
  \  \n{  \n    // Seed counter  \n    sequenceNumber++;  \n    // Fill the new column\
  \  \n    Row.RowNumber = sequenceNumber;  \n}\n```\n\n以下是 VB.NET 代码：\n\n```\n' New\
  \ internal variable to store the rownumber  \nPrivate sequenceNumber As Integer\
  \ = 0  \n\n' Method that will be started for each record in your dataflow  \nPublic\
  \ Overrides Sub Input0_ProcessInputRow(ByVal Row As Input0Buffer)  \n    'Seed counter\
  \  \n    sequenceNumber = sequenceNumber + 1  \n    ' Fill the new column  \n  \
  \  Row.RowNumber = sequenceNumber  \nEnd Sub\n```\n\n#### CreateNewOutputRows\n\n\
  `CreateNewOutputRows`方法是脚本组件源的等效于`Input0_ProcessInputRow`的方法，但它也可用于具有异步输出的转换。通过此方法，您可以创建新行，但该方法仅执行一次。因此，您需要添加一个循环结构来添加多行。在此基础示例中，您将添加\
  \ 10 行，每行包含一个整数列（数字 1 到 10）和一个字符串列（根据数字值显示\"even\"或\"uneven\"）。在第 10 章中，您可以找到此方法的多个示例。\n\
  \n```\npublic override void CreateNewOutputRows()  \n{  \n    // Add 10 rows  \n\
  \    for (int i = 1; i <= 10; i++)  \n    {  \n        // Add a new row  \n    \
  \    Output0Buffer.AddRow();  \n        // Fill two columns with data  \n      \
  \  Output0Buffer.myIntegerColumn = i;  \n        Output0Buffer.myStringColumn =\
  \ (i % 2) == 1 ? \"uneven\" : \"even\";  \n    }  \n}\n```\n\n以下是 VB.NET 代码：\n\n\
  ```\nPublic Overrides Sub CreateNewOutputRows()  \n    ' Add 10 rows  \n    For\
  \ i As Integer = 1 To 10  \n        ' Add a new row  \n        Output0Buffer.AddRow()\
  \  \n        ' Fill two columns with data  \n        Output0Buffer.myIntegerColumn\
  \ = i  \n        Output0Buffer.myStringColumn = If((i Mod 2) = 1, \"uneven\", \"\
  even\")  \n    Next  \nEnd Sub\n```\n\n### 变量和参数\n\n与脚本任务类似，您可以在脚本组件中使用变量（和参数），但存在一些差异。首先，获取变量值只能在`PreExecute`方法中完成，设置变量值只能在`PostExecute`方法中完成；否则，会出现运行时错误。例如，如果您需要在`Input0_ProcessInputRow`或`CreateNewOutputRows`方法中使用变量值，则必须创建一个类变量来存储来自\
  \ SSIS 变量的值，然后在其他方法中使用该类变量。\n\n有两种不同的方法。在此示例中，您将填充一个新的`RowNumber`列（请参阅“输入和输出”部分），但起始序列来自一个\
  \ SSIS 整数变量（见图 9-7）。此变量可以通过配置或通过执行如下查询的`Execute SQL Task`来填充：\n\n![A978-1-4842-0638-6_9_Fig7_HTML.jpg](img/A978-1-4842-0638-6_9_Fig7_HTML.jpg)\n\
  \n图 9-7. 名为`StartingSequence`的整数变量\n\n```\nSELECT ISNULL(MAX(rownumber),0) + 1 as\
  \ NextRowNumber FROM myTable\n```\n\n\n\n#### 方法一：`ReadOnlyVariables` 与 `ReadWriteVariables`\n\
  \n此示例可供下载。在数据源后添加一个类型为“转换”的脚本组件。在“输入和输出”页面上，添加一个名为 `RowNumber` 的新输出列。在编辑器的第一页，你需要将\
  \ `StartingSequence` 变量添加为 `ReadWrite` 变量（参见图 9-8）。在此示例中，你首先读取起始序列，完成后，再将最后一行行号填充到该变量中。\n\
  \n![A978-1-4842-0638-6_9_Fig8_HTML.jpg](img/A978-1-4842-0638-6_9_Fig8_HTML.jpg)\n\
  \n图 9-8.  \n`ReadWriteVariables`\n\n现在，点击 `Edit Script...` 按钮，并创建一个整数类变量，该类变量存在于类中，但不属于任一方法。最合适的位置是在类声明之后；但这并非强制要求。\n\
  \n```\n// 用于存储行号的类变量，\n// 该变量可在所有方法中使用\nprivate int rowNumber = 0;\n```\n\n以下是 VB.NET\
  \ 代码：\n\n```\n' 用于存储行号的类变量，\n' 该变量可在所有方法中使用\nPrivate rowNumber as Int32 = 0\n```\n\
  \n在 `PreExecute` 方法中，你可以使用 SSIS 整数变量的值来填充这个类变量。如果你键入 `Variables`，那么 IntelliSense\
  \ 将显示可用变量的完整列表。这些变量是你选择作为 `ReadOnly` 或 `ReadWrite` 变量的那些。你可能已经注意到，这与脚本任务有所不同。\n\n\
  ```\npublic override void PreExecute()\n{\n  // 使用 SSIS 整数变量的值\n  // 填充类变量\n  rowNumber\
  \ = Variables.StartingSequence;\n}\n```\n\n以下是 VB.NET 代码：\n\n```\nPublic Overrides\
  \ Sub PreExecute()\n  ' 使用 SSIS 整数变量的值\n  ' 填充类变量\n  rowNumber = Variables.StartingSequence\n\
  End Sub\n```\n\n在 `Input0_ProcessInputRow` 方法中，你递增该值，然后为每一行填充新的输出行号列。\n\n```\npublic\
  \ override void Input0_ProcessInputRow(Input0Buffer Row)\n{\n  // 行号递增 1\n  rowNumber++;\n\
  \  // 使用行号填充新列\n  Row.RowNumber = rowNumber;\n}\n```\n\n以下是 VB.NET 代码：\n\n```\n\
  Public Overrides Sub Input0_ProcessInputRow(ByVal Row As Input0Buffer)\n  ' 行号递增\
  \ 1\n  rowNumber = rowNumber + 1\n  ' 使用行号填充新列\n  Row.RowNumber = rowNumber\nEnd\
  \ Sub\n```\n\n在 `PostExecute` 方法中（该方法在所有行处理完毕后执行），你可以为下一个数据流或出于日志记录目的，使用最后一行行号设置\
  \ SSIS 整数变量。\n\n```\npublic override void PostExecute()\n{\n  // 使用最终行号填充 SSIS 变量\n\
  \  Variables.StartingSequence = rowNumber;\n}\n```\n\n以下是 VB.NET 代码：\n\n```\nPublic\
  \ Overrides Sub PostExecute()\n  ' 使用最终行号填充 SSIS 变量\n  Variables.StartingSequence\
  \ = rowNumber\nEnd Sub\n```\n\n#### 方法二：变量分配器\n\n第二种方法与脚本任务的第二种变量方法非常相似。不同之处在于，你不是在编辑器中使用\
  \ `ReadOnly` 和 `ReadWrite` 变量字段，而是在代码中锁定变量。在此示例中，你只需要更改 `PreExecute` 和 `PostExecute`\
  \ 方法。其余代码完全相同。在 `PreExecute` 方法中，你锁定 SSIS 整数变量以进行读取，在用 SSIS 变量中的值填充类变量后，你释放锁。同时，还添加了一个显式转换（`Convert.ToInt32`），因为从对象到整数的转换是不安全的，数据可能会丢失。`Convert.ToInt32`\
  \ 的替代方法是 `Int32.TryParse`，如果你不确定数据类型，使用后者会更安全。在这种情况下，你可以确定它是整数。\n\n```\npublic override\
  \ void PreExecute()\n{\n// 锁定变量以进行读取\nVariableDispenser variableDispenser = (VariableDispenser)VariableDispenser;\n\
  variableDispenser.LockForRead(\"User::StartingSequence\");\n// 创建一个变量“容器”来存储变量\n\
  IDTSVariables100 vars;\nvariableDispenser.GetVariables(out vars);\n// 使用 SSIS 整数变量的值填充类变量\n\
  // 因为使用此方法时数据类型始终是 Object，\n// 所以你首先需要使用转换将其转换为适当的数据类型。\nrowNumber = Convert.ToInt32(vars[\"\
  User::StartingSequence\"].Value);\n// 解锁变量\nvars.Unlock();\n}\n```\n\n以下是 VB.NET\
  \ 代码：\n\n```\nPublic Overrides Sub PreExecute()\n' 锁定变量以进行读取\nDim variableDispenser\
  \ As VariableDispenser = _\nCType(Me.VariableDispenser, VariableDispenser)\nvariableDispenser.LockForRead(\"\
  User::StartingSequence\")\n' 创建一个变量“容器”来存储变量\nDim vars As IDTSVariables100\nvariableDispenser.GetVariables(vars)\n\
  ' 使用 SSIS 整数变量的值填充类变量\n' 因为使用此方法时数据类型始终是 Object，\n' 所以你首先需要使用转换将其转换为适当的数据类型。\nrowNumber\
  \ = Convert.ToInt32(vars(\"User::StartingSequence\").Value)\n' 解锁变量\nvars.Unlock()\n\
  End Sub\n```\n\n在 `PostExecute` 方法中，你需要锁定变量以进行写入，从而使用最终的行号填充该变量。无需添加额外的转换，因为从整数到对象的转换是隐式转换，不会丢失数据。\n\
  \n```\npublic override void PostExecute()\n{\n// 锁定变量以进行写入\nVariableDispenser variableDispenser\
  \ = (VariableDispenser)VariableDispenser;\nvariableDispenser.LockForWrite(\"User::StartingSequence\"\
  );\n// 创建一个变量“容器”来存储变量\nIDTSVariables100 vars;\nvariableDispenser.GetVariables(out\
  \ vars);\n// 使用最终行号填充 SSIS 变量\nvars[\"User::StartingSequence\"].Value = rowNumber;\n\
  // 解锁变量\nvars.Unlock();\n}\n```\n\n以下是 VB.NET 代码：\n\n```\nPublic Overrides Sub PostExecute()\n\
  ' 锁定变量以进行写入\nDim variableDispenser As VariableDispenser = _\nCType(Me.VariableDispenser,\
  \ VariableDispenser)\nvariableDispenser.LockForWrite(\"User::StartingSequence\"\
  )\n' 创建一个变量“容器”来存储变量\nDim vars As IDTSVariables100\nvariableDispenser.GetVariables(vars)\n\
  ' 使用最终行号填充 SSIS 变量\nvars(\"User::StartingSequence\").Value = rowNumber\n' 解锁变量\n\
  vars.Unlock()\nEnd Sub\n```\n\n注意\n\n如果在脚本组件中设置了变量值，则新值仅在数据流任务完成后才可用。  \n如果你仍在使用\
  \ SSIS 2005，则 `IDTSVariables100` 应为 `IDTSVariables90`。  \n不能在脚本组件中读取敏感参数；这仅在脚本任务中可行。\n\
  \n#### 结论\n\n在第二个使用变量分配器的示例中，锁定和解锁变量时似乎有更多的控制权。其最大缺点是你无法快速查看正在使用的变量；必须检查整个代码。其他缺点包括：需要编写更多代码来完成相同任务，必须将\
  \ Object 数据类型转换为有用的类型，并且无法使用 IntelliSense 获取变量名称。因此，首选方法应为第一种方法。\n\n\n\n### 连接管理器\n\
  \nIntegration Services 使用连接管理器来提供对各种数据源的访问，例如平面文件和数据库，同时也包括 Web 服务器和消息队列。你可以在脚本组件中使用这些连接管理器，以避免硬编码路径和连接字符串。但在使用数据库连接管理器时要保守一些，因为可能存在现成的替代方案，例如\
  \ `Execute SQL Task`、`OLE DB Source`、`OLE DB Command` 和 `OLE DB Destination`。如果你确实需要在脚本中使用数据库连接管理器，那么\
  \ ADO.NET 是首选连接管理器类型，因为像 OLE DB、ADO 和 ODBC 这样的连接管理器不会返回 .NET 托管对象。相反，它们返回 COM 对象，使用起来比较困难。\n\
  \n在目标脚本中，你可以使用 `PreExecute` 方法或 `AcquireConnections` 方法来获取连接，但在源脚本中，也可以使用 `CreateNewOutputRows`\
  \ 方法，因为它只执行一次。不过，最好使用 `AcquireConnections` 方法，因为它是唯一可以启动事务的地方。\n\n在开始编码之前，你首先需要将你的连接管理器添加到脚本组件编辑器的连接管理器列表中。完成此操作后，你就可以在脚本组件中使用别名（名称列）。如果你输入\
  \ `This.Connections.`，可以使用 IntelliSense 获取连接管理器名称。\n\n第一个示例是简单地获取连接字符串属性以提取文件路径，并将其用于\
  \ `StreamReader` 中。\n\n```\nusing (StreamReader sr = new StreamReader(\nthis.Connections.MyProducts.ConnectionString))\n\
  {\n    String line;\n    // 从文件中读取行，直到到达文件末尾。\n    while ((line = sr.ReadLine())\
  \ != null)\n    {\n        // 对 line 变量执行某些操作\n    }\n}\n```\n\n这是 VB.NET 代码：\n\n\
  ```\nUsing sr As New StreamReader(Me.Connections.MyProducts.ConnectionString)\n\
  \    Dim line As String = sr.ReadLine\n    ' 从文件中读取行，直到到达文件末尾。\n    Do While (Not\
  \ line Is Nothing)\n        ' 对 line 变量执行某些操作\n        ' 并以读取下一行结束循环\n        line\
  \ = sr.ReadLine\n    Loop\nEnd Using\n```\n\n与其使用连接字符串属性，不如使用 `AcquireConnection`。这将会处理连接管理器上的表达式（如果有的话）。\n\
  \n```\nthis.Connections.MyProducts.AcquireConnection(null).ToString()\n```\n\n这是\
  \ VB.NET 代码：\n\n```\nMe.Connections.MyProducts.AcquireConnection(Nothing).ToString()\n\
  ```\n\n返回值因连接管理器类型而异。例如，平面文件连接管理器返回包含文件路径的字符串，而 ADO.NET 连接管理器返回一个 `SqlConnection`\
  \ 对象。搜索\"以编程方式处理连接管理器\"或访问 BOL 页面 [`https://msdn.microsoft.com/en-us/library/cc645942.aspx`](https://msdn.microsoft.com/en-us/library/cc645942.aspx)\
  \ 以获取完整概述。\n\n```\n// 将连接管理器存储在本地连接管理器对象中\nIDTSConnectionManager100 myADONETConnectionManager\
  \ =\nthis.Connections.AdvantureWorks;\n// 获取连接\nSqlConnection myADONETConnection\
  \ = (SqlConnection)myADONETConnectionManager.\nAcquireConnection(null);\n// 创建包含查询的字符串\n\
  string QueryString = \"SELECT count(*) as NumberOfStores FROM [Sales].[Store]\"\
  ;\n// 创建包含查询和连接的命令\nSqlCommand myCommand = new SqlCommand(QueryString, myADONETConnection);\n\
  // 执行查询并遍历记录\nSqlDataReader dr = myCommand.ExecuteReader();\nwhile (dr.Read())\n\
  {\n    // 使用 dr.GetValue(x) 执行某些操作\n}\n```\n\n创建所有这些变量/对象的更好替代方案是使用 `using`，以确保所有对象在使用完毕后被释放。\n\
  \n```\nusing (SqlConnection myADONETConnection = (SqlConnection)\nmyADONETConnectionManager.AcquireConnection(null))\n\
  {\n    // 对 myADONETConnection 执行某些操作\n}\n// myADONETConnection 现在已释放\n```\n\n这是\
  \ VB.NET 代码：\n\n```\n' 将连接管理器存储在本地连接管理器对象中\nDim myADONETConnectionManager As IDTSConnectionManager100\
  \ = Me.Connections.AdvantureWorks\n' 获取连接\nDim myADONETConnection As SqlConnection\
  \ = CType(myADONETConnectionManager.AcquireConnection(Nothing), SqlConnection)\n\
  ' 创建包含查询的字符串\nDim QueryString As String = \"SELECT count(*) as NumberOfStores FROM\
  \ [Sales].[Store]\"\n' 创建包含查询和连接的命令\nDim myCommand As New SqlCommand(QueryString,\
  \ myADONETConnection)\n' 执行查询并遍历记录\nDim dr As SqlDataReader = myCommand.ExecuteReader()\n\
  While dr.Read()\n    ' 使用 dr.GetValue(x) 执行某些操作\n    MessageBox.Show(dr.GetValue(0).ToString())\n\
  End While\n```\n\n这是 VB.NET 中相同的示例：\n\n```\nUsing myADONETConnection As SqlConnection\
  \ = CType(myADONETConnectionManager. _\nAcquireConnection(Nothing), SqlConnection)\n\
  \    ' 对 myADONETConnection 执行某些操作\nEnd Using\n' myADONETConnection 现在已释放\n```\n\
  \n\n\n### 记录事件\n\n在脚本组件中，您可以触发/引发事件以进行日志记录。但是，例如，触发一个信息事件并不会自动记录该消息。您仍然需要在包日志记录中捕获这些事件。触发事件的工作方式与脚本任务事件类似，但可触发的事件更少：\n\
  \n- `FireCustomEvent`\n- `FireError`\n- `FireInformation`\n- `FireProgress`\n- `FireWarning`\n\
  \n接下来是几个触发事件的示例。不要触发过多事件，因为这会污染日志记录，使其失去价值，并降低脚本组件的性能。所有方法（除了`FireProgress`）都具有类似的结构。\n\
  \n第一个整数是错误/警告/信息代码。您可以将其保持为零，除非您希望维护所有代码的完整列表。第二个参数是包含转换（子）名称的字符串。在大多数情况下，这可以是脚本组件的名称，除非您有一个包含多个日志条目的大型代码片段；例如，届时您可以使用代码部分区的名称。第三个参数是您想要记录的实际消息。对于其他参数，您可以按所示使用值。在大多数情况下，它们的用处较小。\n\
  \n在脚本组件中，您可以使用以下代码触发一个错误，这将导致在“进度/执行结果”选项卡中生成一条日志行（见图 9-9）。\n\n![A978-1-4842-0638-6_9_Fig9_HTML.jpg](img/A978-1-4842-0638-6_9_Fig9_HTML.jpg)\n\
  \n图 9-9. `FireError` 结果（来自“进度/执行结果”选项卡）\n\n最后的参数是`string.Empty`和 0，因为您没有可用的帮助文件引用。\n\
  \n```\n// 出错时取消组件\nbool bpCancel = true;\n\n// 触发错误\nComponentMetaData.FireError(0,\
  \ \"MyTransformation\", \"发生错误！\",\nstring.Empty, 0, out bpCancel);\n```\n\n这是 VB.NET\
  \ 代码：\n\n```\n' 出错时取消组件\nDim bpCancel As Boolean = True\n\n' 触发错误\nComponentMetaData.FireError(0,\
  \ \"MyTransformation\", \"发生错误！\", _\nString.Empty, 0, bpCancel)\n```\n\n您可以将 `FireError`\
  \ 方法与 `try-catch` 语句结合使用，以处理意外错误。\n\n```\n//C# 代码\ntry\n{\n    // 您的代码\n}\ncatch(Exception\
  \ ex)\n{\n    bool pbCancel = True;\n    this.ComponentMetaData.FireError(0, \"\
  MyTransformation\",\n    \"发生错误：\" + ex.Message,\n    string.Empty, 0, out pbCancel);\n\
  }\n```\n\n这是 VB.NET 代码：\n\n```\nTry\n    ' 您的代码\nCatch ex As Exception\n    Dim\
  \ bpCancel As Boolean = True\n    ComponentMetaData.FireError(0, \"MyTransformation\"\
  , _\n    \"发生错误：\" + ex.Message, _\n    String.Empty, 0, bpCancel)\nEnd Try\n```\n\
  \n触发警告没有取消选项；它会导致在“进度/执行结果”选项卡中出现一个感叹号图标和警告文本，如图 9-10 所示。\n\n![A978-1-4842-0638-6_9_Fig10_HTML.jpg](img/A978-1-4842-0638-6_9_Fig10_HTML.jpg)\n\
  \n图 9-10. `FireWarning` 结果（来自“进度/执行结果”选项卡）\n\n```\n// 触发警告\nComponentMetaData.FireWarning(0,\
  \ \"MyTransformation\", \"发生错误！\",\nstring.Empty, 0);\n```\n\n这是 VB.NET 代码：\n\n\
  ```\n' 触发警告\nComponentMetaData.FireWarning(0, \"MyTransformation\", \"发生错误！\", _\n\
  String.Empty, 0)\n```\n\n触发信息事件具有一个 `FireAgain` 选项，用于防止在“进度/执行结果”选项卡中产生多行日志，如图 9-11\
  \ 所示。\n\n![A978-1-4842-0638-6_9_Fig11_HTML.jpg](img/A978-1-4842-0638-6_9_Fig11_HTML.jpg)\n\
  \n图 9-11. `FireInformation` 结果（来自“进度/执行结果”选项卡）\n\n```\n// 指定未来是否应再次引发该事件\nbool pbFireAgain\
  \ = true;\n\n// 触发信息\nComponentMetaData.FireInformation(0, \"MyTransformation\"\
  , \"供您参考！\",\nstring.Empty, 0, ref pbFireAgain);\n```\n\n这是 VB.NET 代码：\n\n```\n\
  ' 指定未来是否应再次引发该事件\nDim pbFireAgain As Boolean = True\n\n' 触发信息\nComponentMetaData.FireInformation(0,\
  \ \"MyTransformation\", \"供您参考！\", _\nString.Empty, 0, pbFireAgain)\n```\n\n如果您有一个循环结构或一个为每一行执行的方法，那么您可以使用\
  \ `FireProgress` 事件来让您了解进度百分比（见图 9-12）。这可能只对可能需要一些时间的过程有用。在此示例中，0 是下限，100 是上限，25\
  \ 是实际值。\n\n![A978-1-4842-0638-6_9_Fig12_HTML.jpg](img/A978-1-4842-0638-6_9_Fig12_HTML.jpg)\n\
  \n图 9-12. `FireProgress` 结果\n\n```\n// 指定未来是否应再次引发该事件\nbool pbFireAgain = false;\n\
  \n// 触发进度\nComponentMetaData.FireProgress(\"正在执行操作\", 25, 0, 100,\n\"MyTransformation\"\
  , ref pbFireAgain);\n```\n\n这是 VB.NET 代码：\n\n```\n' 指定未来是否应再次引发该事件\nDim pbFireAgain2\
  \ As Boolean = True\n\n' 触发进度\nComponentMetaData.FireProgress(\"正在执行操作\", 25, 0,\
  \ 100, _\n\"MyTransformation\", pbFireAgain)\n```\n\n#### 更改 .NET 版本\n\n每个版本的 SSIS\
  \ 都有其自己支持的 .NET Framework 范围（见表 9-1）。这意味着您不能在 SSIS 2005 中使用诸如 LINQ（语言集成查询）之类的 .NET\
  \ 3.5 功能，因为它只支持 .NET 2.0。在 SSIS 2008 中，Microsoft 增加了对 .NET 3.5 及更高版本的支持；但是，SSIS\
  \ 2008 的默认目标框架是 .NET 2.0，您可以在 VSTA 编辑器中更改它。\n\n表 9-1. SSIS 版本与支持的框架\n\n| SSIS 版本\
  \ | 支持的框架 |\n| --- | --- |\n| 2005 | 2.0 |\n| 2008 (R2) | 2.0 => 3.5 |\n| 2012 |\
  \ 2.0 => 4.0 |\n| 2014 | 2.0 => 4.5.1 |\n| 2016 | 2.0 => 4.5.2 |\n\n要更改目标框架，请转到\
  \ VSTA 编辑器，在解决方案资源管理器中右键单击项目。然后选择属性。在 C# 项目中，您可以在第一页上找到目标框架（应用程序，如图 9-13 所示）。\n\n\
  ![A978-1-4842-0638-6_9_Fig13_HTML.jpg](img/A978-1-4842-0638-6_9_Fig13_HTML.jpg)\n\
  \n图 9-13. 为 C# 更改目标框架\n\n在 VB.NET 中，目标框架位于不同的位置，具体取决于 SSIS 或 Visual Studio 的版本（见图\
  \ 9-14）。在较旧的版本中，您可以在“编译”页面的“高级”选项中找到它。而在较新的版本中，Microsoft 将其位置与 C# 项目对齐，并将其移到了“应用程序”页面。\n\
  \n![A978-1-4842-0638-6_9_Fig14_HTML.jpg](img/A978-1-4842-0638-6_9_Fig14_HTML.jpg)\n\
  \n图 9-14. 为 VB.NET 更改目标框架\n\n### 总结\n\n在本章中，您学习了脚本组件的基础知识，例如如何使用变量或连接管理器。在接下来的章节中，您将了解更多关于它们如何在各种示例中使用的内容。\n\
  \n"
- "# 10. 脚本组件作为源\n\n*电子补充材料* 本章的在线版本 (doi:[10.1007/978-1-4842-0638-6_10](http://dx.doi.org/10.1007/978-1-4842-0638-6_10))\
  \ 包含补充材料，仅供授权用户使用。\n\n本章重点介绍脚本组件作为源的使用。数据流任务中有许多不同的可用源，但有时您会遇到，例如，格式不正确而无法被平面文件源读取的文件。那么，如果您没有数据来测试数据流，使用脚本组件生成随机测试数据呢？\n\
  \n\n\n### 列数不等的平面文件\n\n有些 `.csv` 文件的行中，末尾的列并没有全部填充。这些列没有被留空，而是被省略了。这会导致平面文件连接管理器中出现一些奇怪的行为，某些行和列会合并。以下是用于此示例的示例数据：\n\
  \n`\"test1\";\"abc\";\"xyz\";\"123\"`\n\n`\"test2\";\"cba\";\"zyx\";\"321\"`\n\n\
  `\"test3\";\"abc\"`\n\n`\"test4\";\"efg\";\"zyx\"`\n\n`\"test5\";\"cba\";\"zyx\"\
  ;\"321\"`\n\n如果你在平面文件连接管理器中预览，它会将较短的行与下一行合并，并显示错误。图 10-1 展示了这种情况。你可以看到 \"test4\"\
  \ 是如何与来自 \"test3\" 行的 \"abc\" 相邻的。图 10-2 展示了你会收到的错误消息。\n\n![A978-1-4842-0638-6_10_Fig2_HTML.jpg](img/A978-1-4842-0638-6_10_Fig2_HTML.jpg)\n\
  \n图 10-2. 平面文件连接管理器编辑器中的错误\n\n![A978-1-4842-0638-6_10_Fig1_HTML.jpg](img/A978-1-4842-0638-6_10_Fig1_HTML.jpg)\n\
  \n图 10-1. 合并的列和行\n\n#### 脚本组件源\n\n这个问题在 SSIS 2012 中通过添加一个名为 `AlwaysCheckForRowDelimiters`\
  \ 的新平面文件连接管理器属性得到了修复；但对于旧版本，当你尝试读取包含此类数据的文件时，会在平面文件连接管理器编辑器中收到错误。使用脚本组件作为数据源可以帮助你读取此文件。你将使用一个指向同一个具有可变列数的\
  \ CSV 文件、但未定义列的文件连接管理器，而不是使用平面文件连接管理器。\n\n转到数据流任务，并将一个脚本组件添加到设计图面上。系统会要求你在源、转换和目标之间进行选择。如图\
  \ 10-3 所示，选择**源**，并为任务起一个有用的名称。建议添加一个关于使用脚本组件原因的说明或注释。\n\n![A978-1-4842-0638-6_10_Fig3_HTML.jpg](img/A978-1-4842-0638-6_10_Fig3_HTML.jpg)\n\
  \n图 10-3. 脚本组件源\n\n#### 创建输出列\n\n打开脚本转换编辑器，并转到**输入和输出**页面。向输出 0 添加四个字符串列。在单击**添加列**按钮添加第二列之前，应先单击**输出列**；否则，新列将被添加到顶部而不是底部。\n\
  \n你可能需要在脚本中将数据从字符串转换为整数。最佳实践是使用正确的数据类型；否则，你将需要在数据流的下游转换这些值。图 10-4 高亮显示了数据类型下拉列表字段。\n\
  \n![A978-1-4842-0638-6_10_Fig4_HTML.jpg](img/A978-1-4842-0638-6_10_Fig4_HTML.jpg)\n\
  \n图 10-4. 添加新的输出列\n\n#### 创建文件连接管理器\n\n为了避免在脚本中使用硬编码的连接字符串，你需要一个连接管理器。在此示例中，你将直接从脚本组件编辑器中创建一个新的连接管理器，但你也可以事先创建它，然后在编辑器中使用该连接管理器。转到**连接管理器**页面并添加一个新连接\
  \ (1)。连接管理器类型 (2) 应为 **FILE**，使用类型 (3) 应为**现有文件**。接着，在**名称**列中将默认名称从 Connection\
  \ 更改为 myFile。这些步骤如图 10-5 所示。\n\n![A978-1-4842-0638-6_10_Fig5_HTML.jpg](img/A978-1-4842-0638-6_10_Fig5_HTML.jpg)\n\
  \n图 10-5. 添加新的连接管理器\n\n#### 代码\n\n现在你可以回到**脚本**页面，并选择**编辑脚本...** 以打开 VSTA 环境。首先，你需要添加一个额外的命名空间来简化代码。\n\
  \n```\n#region CustomNamespace\nusing System.IO;\n#endregion\n```\n\n这是 VB.NET 代码：\n\
  \n```\n#Region \"CustomNamespace\"\nImports System.IO\n#End Region\n```\n\n接下来，你可以将以下代码复制到\
  \ `CreateNewOutputRows` 方法中。此方法创建新记录。\n\n```\npublic override void CreateNewOutputRows()\n\
  {\n    // 从连接管理器获取文件路径\n    string filePath = this.Connections.myFile\n        .AcquireConnection(null).ToString();\n\
  \n    // 通过流读取文件\n    // 编码是可选的\n    using (StreamReader sr = new StreamReader(filePath,\n\
  \        System.Text.Encoding.UTF7))\n    {\n        // 临时存储一行内容的字符串变量\n       \
  \ string line;\n\n        // 逐行从文件读取，直到文件末尾\n        while ((line = sr.ReadLine())\
  \ != null)\n        {\n            // 将行拆分为列\n            string[] columns = line.Split(';');\n\
