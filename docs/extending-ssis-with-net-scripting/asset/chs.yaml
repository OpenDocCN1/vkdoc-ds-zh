- "# 6. 在互联网和 Web 上工作\n\n电子补充材料 本章的在线版本 (doi:[10.1007/978-1-4842-0638-6_6](http://dx.doi.org/10.1007/978-1-4842-0638-6_6))\
  \ 包含补充材料，可供授权用户使用。\n\nWeb 是数据的重要来源。数据可能来自位于网站或 (S)FTP 服务器上的文件。在本章中，你将学习如何通过 Web\
  \ 处理文件、如何下载文件以及如何使用 FTP 和 SFTP。本章中的场景无法使用内置任务（例如 FTP 任务）轻松完成。\n\n### 发送 HTML 格式的电子邮件\n\
  \n开箱即用的发送邮件任务的一个缺点是它不支持 HTML 格式的电子邮件。关联的 SMTP 连接管理器不支持更高级的设置，例如更改端口和设置基本凭据。不过，脚本任务可以在这里帮助你。\n\
  \n另一种方法是使用调用 `sp_send_dbmail` 的执行 SQL 任务，但脚本任务提供了更多可能性，并且你无需请求数据库管理员 (DBA) 在数据库中启用此功能。\n\
  \n#### SMTP 连接管理器\n\n为了存储 SMTP 服务器地址，我们使用图 6-1 中所示的 SMTP 连接管理器。你可以通过右键单击连接管理器窗格，选择“新建连接”，然后选择\
  \ SMTP 来添加它。输入服务器地址，并可选择更改其他设置。确保连接管理器的名称是 SMTP Mail Server。你可以更改它，但请记得也要在脚本中进行更改。另一种方法是在下一步中使用额外的\
  \ SSIS 字符串变量来存储 SMTP 服务器名称或 IP 地址。\n\n![A978-1-4842-0638-6_6_Fig1_HTML.jpg](img/A978-1-4842-0638-6_6_Fig1_HTML.jpg)\n\
  \n图 6-1. SMTP 连接管理器\n\n如果你的公司或提供商没有 SMTP 服务器，那么你可以搜索公共 SMTP 服务器，例如 `gmail.com` 或\
  \ `outlook.com`，但通常它们需要身份验证或具有其他限制。\n\n注意：如果发送 HTML 格式的电子邮件是你使用脚本任务的唯一原因，那么最佳实践是使用\
  \ SMTP 连接管理器。如果你还想更改端口或凭据，那么同时使用变量和 SMTP 连接管理器作为脚本任务的输入可能会有些混乱。\n\n\n\n#### 变量\n\
  \n要存储电子邮件中的发件人、收件人、主题和正文，你需要四个 `String` 变量，如图 6-2 所示。如果你还想更改默认端口号，则需要一个额外的 `Integer`\
  \ 变量。添加身份验证时也是如此，为此需要额外的 `String` 变量来存储用户名和密码。\n\n![A978-1-4842-0638-6_6_Fig2_HTML.jpg](img/A978-1-4842-0638-6_6_Fig2_HTML.jpg)\n\
  \n图 6-2. 用于存储电子邮件各部分的字符串变量\n\n#### 脚本任务\n\n向控制流（或者事件处理程序之一，如果你更喜欢的话）添加一个脚本任务，并为其指定一个合适的名称，例如\
  \ `SCR - 发送错误邮件`。你不需要额外的任务来测试这个，但你可以将其与数据流任务连接，并设置一个错误优先级约束。编辑脚本任务，并添加上一步中的变量，如图\
  \ 6-3 所示。将这些变量设置为 `ReadOnlyVariables`，以便可以在脚本代码中使用它们。\n\n![A978-1-4842-0638-6_6_Fig3_HTML.jpg](img/A978-1-4842-0638-6_6_Fig3_HTML.jpg)\n\
  \n图 6-3. 向脚本任务添加变量（或参数）\n\n#### 代码\n\n点击 **编辑脚本...** 按钮打开 VSTA 环境。首先，添加额外的命名空间以简化代码：\n\
  \n```csharp\n#region customNamespaces\nusing System.Net;\nusing System.Net.Mail;\n\
  #endregion\n```\n\n这是 VB.NET 代码：\n\n```vbnet\n#Region \"customNamespaces\"\nImports\
  \ System.Net\nImports System.Net.Mail\n#End Region\n```\n\n现在是时候将以下代码添加到你的 `Main`\
  \ 方法中了。有一些代码行被注释掉了，用于提供额外功能的代码，例如更改端口号或添加凭据。\n\n```csharp\npublic void Main()\n\
  {\n    // 将 SSIS 变量存储在 .Net 变量中。你可以跳过此步骤，\n    // 并在实际的邮件代码中直接调用 SSIS 变量以减少代码行数，\n\
  \    // 但这样做会让代码看起来更有条理。\n    String SendMailFrom = Dts.Variables[\"EmailFrom\"\
  ].Value.ToString();\n    String SendMailTo = Dts.Variables[\"EmailTo\"].Value.ToString();\n\
  \    String SendMailSubject = Dts.Variables[\"EmailSubject\"].Value.ToString();\n\
  \    String SendMailBody = Dts.Variables[\"EmailBody\"].Value.ToString();\n    \n\
  \    // 获取 SMTP 连接管理器并读取其属性\n    ConnectionManager mySmtpConn = Dts.Connections[\"\
  SMTP Mail Server\"];\n    string SmtpServer = mySmtpConn.Properties[\"SmtpServer\"\
  ]\n        .GetValue(mySmtpConn).ToString();\n    int Timeout = Convert.ToInt32(mySmtpConn.Properties[\"\
  Timeout\"]\n        .GetValue(mySmtpConn));\n    bool EnableSsl = Convert.ToBoolean(mySmtpConn\n\
  \        .Properties[\"EnableSsl\"].GetValue(mySmtpConn));\n    bool UseWinAut =\
  \ Convert.ToBoolean(mySmtpConn\n        .Properties[\"UseWindowsAuthentication\"\
  ]\n        .GetValue(mySmtpConn));\n    \n    // 创建一封电子邮件并将格式更改为 HTML\n    MailMessage\
  \ myHtmlFormattedMail = new MailMessage(SendMailFrom\n        , SendMailTo\n   \
