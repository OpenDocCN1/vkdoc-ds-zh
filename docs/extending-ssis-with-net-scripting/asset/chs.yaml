  \        MessageBox.Show(myVar.Name)\n    End If\nNext\n```\n\n如果要获取敏感参数的值，则需要稍微修改代码。不要使用\
  \ `.Value.toString()`，而需要使用 `.GetSensitiveValue().ToString()`。但请注意，您现在有责任防止意外泄露密码等敏感值。\n\
  \n```\n// Create string variable to store the parameter value\nstring mySecretPassword\
