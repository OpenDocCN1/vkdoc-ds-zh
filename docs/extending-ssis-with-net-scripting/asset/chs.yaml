  \n图 14-5.\n将所有文本列转换为大写的结果\n\n### 计算行的哈希值\n\n哈希可用于更安全地存储密码和其他敏感数据，也可用于检测记录中的更改。例如，如果要检查是否应使用源数据更新目标表中的记录，则可以逐一比较所有列值。如果只有四或五列，这还可以接受，但如果有\
  \ 20 列，则很繁琐。诀窍是计算并存储所有列值的哈希值（也称为校验和）。下次要检查更改时，只需要检查该哈希列即可。\n\n请注意，在 SSIS 中计算哈希会消耗额外的时间，并且在目标表中填充哈希也会消耗额外的空间和时间，但在大多数情况下，这些额外的时间和空间是值得的。有多种哈希算法。例如，MD5（消息摘要\
  \ 5 算法）比 SHA512（安全哈希算法，512 字节）消耗的时间更少、空间更小，但安全性也更低，并且存在（可忽略不计的）极小可能性使两个不同的字符串产生相同的哈希值。这称为哈希冲突。因此，请花时间研究哪种算法最适合您的情况，并明智地选择。相比之下，MD5\
  \ 对于保护敏感数据来说是可以的，但您应该考虑更安全的算法。并且要小心处理非常大的 (n)text 列。对它们进行哈希运算可能会花费太多时间。\n\n\n\n\
  #### 变量\n\n如果你使用此脚本计算的是安全哈希值而非仅校验和，则需要添加一个字符串变量来存储盐值。对于校验和，你可以跳过此部分。请确保使用配置信息，避免在包中硬编码值。该字符串变量的名称为`saltValue`。请务必添加一个虚拟/测试值（参见图\
  \ 14-6）。\n\n![A978-1-4842-0638-6_14_Fig6_HTML.jpg](img/A978-1-4842-0638-6_14_Fig6_HTML.jpg)\n\
  \n图 14-6. 用于存储盐值的变量\n\n#### 脚本组件\n\n在本例中，你将复用前面示例中的数据源。你可以使用入门包或自己的数据源。在你的数据流中添加一个脚本组件（类型为转换）（参见图\
  \ 14-7）。为其指定一个合适的名称，例如`SCR – Hash All`，并将其连接到其他组件。\n\n![A978-1-4842-0638-6_14_Fig7_HTML.jpg](img/A978-1-4842-0638-6_14_Fig7_HTML.jpg)\n\
  \n图 14-7. 数据流\n\n#### 只读变量\n\n如果你想使用盐值，则需要将`saltValue`变量添加为只读变量。脚本组件不支持敏感参数，但你可以使用脚本任务来读取敏感参数，然后将其值存储在一个字符串变量中作为一种变通方法（参见图\
  \ 14-8）。之后，你就可以在脚本组件中使用该变量了。请注意，这仍然存在一些安全风险，因为包在运行时该值会驻留在内存中。但至少它没有硬编码在包中。\n\n![A978-1-4842-0638-6_14_Fig8_HTML.jpg](img/A978-1-4842-0638-6_14_Fig8_HTML.jpg)\n\
  \n图 14-8. 作为只读变量的盐值变量\n\n#### 输入列\n\n转到“输入列”选项卡，并选择你需要的所有列为只读（默认设置）；但选择键列没有意义，因为它们不会改变。如果这个包不是唯一计算哈希值的地方，请确保始终使用相同的列顺序。否则，生成的哈希值将不相同。在本例中，由于`EmployeeId`是唯一键，因此你选择除`EmployeeId`之外的所有列（参见图\
  \ 14-9）。\n\n![A978-1-4842-0638-6_14_Fig9_HTML.jpg](img/A978-1-4842-0638-6_14_Fig9_HTML.jpg)\n\
  \n图 14-9. 选择输入列为只读\n\n#### 输出列\n\n你需要一个新的字符串列来存储计算出的哈希值。其长度可能在 MD5 的 32 位到 SHA512\
  \ 的 128 位之间变化。在本例中，你将使用 MD5 哈希，其长度为 32 个字符。转到“输入和输出”页面。展开“输出 0”，然后选择“输出列”。点击“添加列”按钮来添加新的字符串列（参见图\
