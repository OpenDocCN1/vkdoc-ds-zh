  \n**图 14-2.** 在 Internet Explorer 中查看的 XML 文件\n\n### 所有列的转换\n\n在脚本组件中使用反射的另一个好用途是对所有列执行“某种操作”。例如，修剪所有列或替换所有空值。当然，你可以使用派生列来完成此操作，但如果有大量列，则可能会变得繁琐且容易出错。在此示例中，你将把所有字符串列转换为大写。你可以使用与上一个示例相同的数据源，也可以使用“Upper\
