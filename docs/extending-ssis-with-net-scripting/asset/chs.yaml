  End Function\n\n' 计算哈希值并创建哈希字符串的哈希方法\nPublic Function GetHash(bytes As Byte()) As\
  \ String\n    ' 对字节进行哈希计算\n    Dim hash As Byte() = hashingObject.ComputeHash(bytes)\n\
  \    ' 将字节格式化为字符串\n    Dim hashString As String = String.Empty\n    For Each x As\
  \ Byte In hash\n        ' 将字节格式化为十六进制字节\n        ' X = 十六进制格式\n        ' 2 = 2 个字符\n\
  \        hashString += [String].Format(\"{0:x2}\", x)\n    Next\n    Return hashString\n\
  End Function\n```\n\n#### 结果\n\n现在运行数据流并检查结果。如果在脚本组件后添加数据查看器，即可看到新创建并填充的哈希列（参见图\
  \ 14-11）。\n\n![A978-1-4842-0638-6_14_Fig11_HTML.jpg](img/A978-1-4842-0638-6_14_Fig11_HTML.jpg)\n\
  \n图 14-11. 新的哈希列\n\n可以在此脚本组件后添加一个查找转换，检查 `EmployeeId` 是否存在于目标表中。如果在同一查找中也获取了哈希值，则可以将该哈希值与新创建的哈希值进行比较，以确定是否需要更新数据。请注意，不应使用\
  \ OLE DB 命令更新记录，因为其速度较慢。插入到临时表中，然后通过执行 SQL 任务进行批量更新，可能会更快。\n\n### 小结\n\n在本章中，你了解了反射的各种可能性。当需要对大量列执行大量重复操作时，反射非常方便。添加或删除列无需大量工作，只需打开并关闭\
  \ VSTA 环境，让 SSIS 生成标准代码即可。\n\n其缺点是代码略为复杂，且性能略逊于对所有列操作进行硬编码。可以通过在 `PreExecute` 方法中将列对象移动到自定义对象，并使用该对象替代速度较慢的\
  \ COM 对象，来解决部分性能下降问题。在 Todd McDermid 的 Dimension Merge SCD 组件的 CodePlex 项目中，可以找到一个极佳的示例，但这需要一些复杂的编码工作（参见\
  \ `http://dimensionmergescd.codeplex.com`）。你需要权衡这是否适用于自己的情况。\n\n"
- "# 15. Web 服务\n\n电子补充材料 本章的在线版本（doi:10.1007/978-1-4842-0638-6_15）包含补充材料，可供授权用户使用。\n\
  \n第 7 章解释了如何在脚本任务中使用 Web 服务，但 Web 服务在数据流任务中也同样有用，可用于丰富数据、作为目标，甚至作为源。许多产品都使用 Web\
  \ 服务作为接口。Microsoft Dynamics CRM 和 SharePoint 等工具将所有数据存储在 SQL Server 数据库中，但不允许直接编辑数据库中的数据。相反，供应商会提供\
  \ Web 服务来修改数据。本章提供了一些常用 Microsoft 产品和互联网上可用的 Web 服务的示例。\n\n### 使用天气数据丰富数据\n\n第一个示例使用了第\
  \ 7 章中介绍的公共天气 Web 服务。关于 Web 服务的详细信息和理论，应阅读该章节。在此示例中，你将使用 Web 服务中的天气信息来丰富来自平面文件的地理数据。创建一个包含空数据流的包。添加一个名为\
  \ `FF_SRC – Cities` 的平面文件源组件，并将其连接到包含以下数据的平面文件。对于本示例中的列，默认的 50 个字符串大小即可。示例包中的文件名为\
  \ `Weather.csv`。\n\n```\nCountry,City\nnetherlands,amsterdam\nnetherlands,maastricht\n\
  belgium,antwerp\nfrance,le touquet\nfrance,agen\ngermany,hamburg\ngermany,munich\n\
  denmark,alborg\n```\n\n#### 变量\n\n向包中添加一个名为 `WebserviceUrl` 的字符串变量，并填入以下 Web 服务\
  \ URL：`http://www.webservicex.net/globalweather.asmx`。这使得配置 URL 变得更容易，如图 15-1 所示。\n\
  \n![A978-1-4842-0638-6_15_Fig1_HTML.jpg](img/A978-1-4842-0638-6_15_Fig1_HTML.jpg)\n\
  \n图 15-1. 用于配置 Web 服务的字符串变量\n\n#### 脚本组件\n\n向数据流中添加一个脚本组件（类型：转换），并将其连接到源，如图 15-2\
  \ 所示。为其指定一个有意义的名称，例如 `SCR - Get weather`。然后编辑脚本组件，并将上一步中的变量添加到 `ReadOnlyVariables`\
  \ 属性中。\n\n![A978-1-4842-0638-6_15_Fig2_HTML.jpg](img/A978-1-4842-0638-6_15_Fig2_HTML.jpg)\n\
  \n图 15-2. 脚本组件转换\n\n\n\n#### 输入列\n\n在脚本组件编辑器中，进入 `Input Columns` 选项卡，并将 `Country`\
  \ 和 `City` 列作为只读输入列添加到脚本中；图 15-3 展示了一个示例。\n\n![A978-1-4842-0638-6_15_Fig3_HTML.jpg](img/A978-1-4842-0638-6_15_Fig3_HTML.jpg)\n\
  \n图 15-3. 输入列\n\n#### 输入和输出\n\n你需要创建一个新的字符串列来存储天气信息。Web 服务返回一个 XML 文档，你将把它存储在字符串列中。你也可以将\
  \ XML 拆分到单独的列中，使其更加整洁。进入 `Inputs and Outputs` 选项卡，添加一个名为 `Weather` 的新字符串列，数据类型为\
  \ `string`，长度为 1000。它应该被添加到 `Output 0` 中，如图 15-4 所示。\n\n![A978-1-4842-0638-6_15_Fig4_HTML.jpg](img/A978-1-4842-0638-6_15_Fig4_HTML.jpg)\n\
  \n图 15-4. 新的输出列\n\n#### 添加服务引用\n\n下一步是通过右键单击 `References`，然后选择 `Add Service Reference…`\
  \ 来添加一个新的服务引用。在地址栏中，粘贴 Web 服务的 URL（`http://www.webservicex.net/globalweather.asmx`），然后点击\
  \ `Go` 查找该 Web 服务。图 15-6 展示了一个示例。\n\n![A978-1-4842-0638-6_15_Fig6_HTML.jpg](img/A978-1-4842-0638-6_15_Fig6_HTML.jpg)\n\
  \n图 15-6. 添加服务引用\n\n在 `NameSpace` 字段中，输入 `GlobalWeather`，然后点击 `OK`。现在你已经将 Web 服务作为设计时代码的引用添加进来了。确保在旧版\
  \ Visual Studio 中点击 `Save All` 按钮。\n\n#### 命名空间\n\n为了缩短代码，添加以下命名空间。第二个命名空间 `GlobalWeather`\
  \ 的前缀来自内部 VSTA 项目名称。每个脚本组件都会不同，但可以开始输入 `SC_`，IntelliSense 会帮你完成剩下的工作。\n\n```csharp\n\
  #region CustomNamespace\n\nusing System.ServiceModel;\n\nusing SC_a064a2a5a804496ca3277204de13f199.GlobalWeather;\n\
  \n#endregion\n```\n\n以下是 VB.NET 代码：\n\n```vbnet\n#Region \"CustomNamespace\"\n\n\
  Imports System.ServiceModel\n\nImports SC_f27cac918ef84ea4bd35b959b1971ecf.GlobalWeather\n\
  \n#End Region\n```\n\n#### 类变量\n\n为通道工厂和天气 Web 服务对象添加类变量。你将在各种方法中使用这些对象。\n\n```csharp\n\
  [Microsoft.SqlServer.Dts.Pipeline.SSISScriptComponentEntryPointAttribute]\npublic\
  \ class ScriptMain : UserComponent\n{\n    // Create a Channel Factory with the\
  \ type of the Web Service.\n    ChannelFactory<GlobalWeatherSoap> channelFactory;\n\
  \    // Create a GlobalWeatherSoap object to call the web service\n    GlobalWeatherSoap\
  \ weatherSvcObj;\n```\n\n以下是 VB.NET 代码：\n\n```vbnet\n<Microsoft.SqlServer.Dts.Pipeline.SSISScriptComponentEntryPointAttribute>\
  \ _\n<CLSCompliant(False)> _\nPublic Class ScriptMain\n  Inherits UserComponent\n\
  \  ' Create a Channel Factory with the type of the Web Service.\n  Dim channelFactory\
  \ As ChannelFactory(Of GlobalWeatherSoap)\n  ' Create a GlobalWeatherSoap object\
  \ to call the web service\n  Dim weatherSvcObj As GlobalWeatherSoap\n```\n\n####\
  \ PreExecute\n\n在 `PreExecute` 方法中，你从 SSIS 字符串变量中获取 Web 服务 URL。这个 URL 在运行时使用。\n\n\
  ```csharp\npublic override void PreExecute()\n{\n    // Get the right binding: basicHttp\n\
  \    BasicHttpBinding httpb = new BasicHttpBinding();\n    // And initiate the channelFactory\
  \ with this binding\n    channelFactory = new ChannelFactory<GlobalWeatherSoap>(httpb);\n\
  \    // The necessary endpoint with our address from the variable\n    EndpointAddress\
  \ ep = new EndpointAddress(Variables.WebserviceUrl.ToString());\n    // Create the\
  \ representation of the web service\n    weatherSvcObj = channelFactory.CreateChannel(ep);\n\
  }\n```\n\n以下是 VB.NET 代码：\n\n```vbnet\nPublic Overrides Sub PreExecute()\n    ' Get\
  \ the right binding: basicHttp\n    Dim httpb As New BasicHttpBinding()\n    ' And\
  \ initiate the channelFactory with this binding\n    channelFactory = New ChannelFactory(Of\
  \ GlobalWeatherSoap)(httpb)\n    ' The necessary endpoint with our address from\
  \ the variable\n    Dim ep As New EndpointAddress(Variables.WebserviceUrl.ToString())\n\
  \    ' Create the representation of the webservice\n    weatherSvcObj = channelFactory.CreateChannel(ep)\n\
  End Sub\n```\n\n#### Input0_ProcessInputRow\n\n在 `ProcessInputRow` 方法中，你使用两个输入列作为\
  \ `GetWeather` 方法的参数来调用 Web 服务。结果存储在新的输出列中。如果你想将 XML 文档拆分为单独的列，就在这里进行。你可能还想添加一个\
  \ `try-catch` 结构来捕获这个公共 Web 服务可能导致的意外错误。示例包中包含了一个额外的 `try-catch`。\n\n```csharp\n\
  public override void Input0_ProcessInputRow(Input0Buffer Row)\n{\n    // Call Web\
  \ service with city and country parameters\n    Row.Weather = weatherSvcObj.GetWeather(Row.City,\
  \ Row.Country);\n}\n```\n\n以下是 VB.NET 代码：\n\n```vbnet\nPublic Overrides Sub Input0_ProcessInputRow(ByVal\
  \ Row As Input0Buffer)\n    ' Call Web service with city and country parameters\n\
  \    Row.Weather = weatherSvcObj.GetWeather(Row.City, Row.Country)\nEnd Sub\n```\n\
  \n#### PostExecute\n\n当操作完成时，你可以在 `PostExecute` 方法中关闭通信。\n\n```csharp\npublic override\
  \ void PostExecute()\n{\n    // Close the communication\n    channelFactory.Close();\n\
  }\n```\n\n以下是 VB.NET 代码：\n\n```vbnet\nPublic Overrides Sub PostExecute()\n    '\
  \ Close the communication\n    channelFactory.Close()\nEnd Sub\n```\n\n#### 结果\n\
  \n现在添加一个虚拟的派生列，并将其连接到脚本组件。添加一个数据查看器，如图 15-7 所示，以查看 Web 服务调用的结果。\n\n![A978-1-4842-0638-6_15_Fig7_HTML.jpg](img/A978-1-4842-0638-6_15_Fig7_HTML.jpg)\n\
  \n图 15-7. 数据查看器\n\n\n\n### Dynamics CRM\n\n本章节演示如何在 Microsoft Dynamics CRM 2013\
  \ 中插入或更新数据，但其他版本也提供类似的 Web 服务及代码。如果您没有使用 Microsoft Dynamics CRM，可以跳过此部分。如前所述，不允许直接在数据库中编辑\
  \ CRM 数据。更新操作需通过 Web 服务完成。但对于读取数据，您可以使用 CRM 数据库中的视图。\n\n由于每个 CRM 解决方案使用不同的实体及属性集，因此无法提供分步示例。取而代之的是针对不同字段类型（如常规文本字段、选项集和查找字段）提供的一组指南和代码示例。数据流因用户和解决方案而异，但基于\
  \ Web 服务的脚本设计大致相同。首先，提供一些指南：\n\n*   为避免插入重复数据，需检查源数据中是否有唯一键可与 CRM 中的键进行比对。若没有，则可将源数据的业务键存储在\
  \ CRM 的（隐藏）列中，以便在下次运行时轻松比对数据。\n*   要更新或删除 CRM 中的数据，需要记录的 GUID（唯一键或实体 ID）。因此，需通过\
  \ CRM 视图上的查找转换（数据流示例 2）或与使用同一 CRM 视图的 OLE DB 源（数据流示例 1）进行联接来获取此数据。\n*   应避免不必要地更新\
  \ CRM 中的记录，这会降低性能并污染 CRM 历史信息。因此，需要检查数据是否变更。可通过从 CRM 获取所有要比较的列，利用业务键将其与源数据库联接，然后使用一个大型表达式比较每一列来实现。另一种技巧是对源视图和\
  \ CRM 视图的所有列进行哈希处理，这样只需比较一个哈希列即可。上一章提供了相关示例。\n\n接下来介绍两种可将数据从源迁移到 CRM 的数据流设计方案。两种方案的底层部分（含脚本组件）相同。如果有多个源向同一\
  \ CRM 实体插入和更新记录，则需在将数据迁移到 CRM 之前确定哪个源（甚至哪条记录）具有优先权。\n\n#### 数据流示例 1\n\n示例 1 使用合并联接来比较源数据与\
  \ CRM 数据。图 15-8 显示了该示例的完整数据流。\n\n![A978-1-4842-0638-6_15_Fig8_HTML.jpg](img/A978-1-4842-0638-6_15_Fig8_HTML.jpg)\n\
  \n图 15-8.\n\n数据流示例 1\n\n在第一个示例中，从源（我的联系人）获取所有列，包括业务键。同时添加一个哈希值以一次性比较所有列。除了使用 `hashbytes`，您还可以使用第\
  \ 14 章中的脚本组件示例来计算所有列的哈希值，或使用第三方校验和转换。查询示例如下：\n\n```\nSELECT          ContactId as\
  \ SourceContactId\n,               Column1\n,               Column2\n,         \
  \      HASHBYTES('MD5', Column1 + '|' + Column2) as hash\nFROM            myTable\n\
  ORDER BY        ContactId       -- For join in SSIS\n```\n\n所有数据转换应在合并联接和计算哈希值之前完成。否则会对比两个不同的对象，导致始终更新所有现有记录。本示例未包含转换，因此可以在源查询中直接计算哈希值。\n\
  \n在 CRM 源（CRM 联系人）中，选择 CRM 的 GUID（用于更新/删除）、源 ID（用于联接）和哈希值（用于比较）。仅选择具有源 ID 的联系人。\n\
  \n```\nSELECT          ContactId              -- GUID (entity ID)\n,           \
  \    SourceContactId -- ID from source\n,               HASHBYTES('MD5', Column1\
  \ + '|' + Column2) as hash\nFROM            myCrmContactsView\nWHERE           SourceContactId\
  \ is not null    -- Only contacts from this source\nORDER BY        SourceContactId\
  \                -- For join in SSIS\n```\n\n在合并联接中，对源数据与 CRM 数据基于源 ID 执行左外部联接（获取源的所有行，以及\
  \ CRM 中具有匹配 `sourceid` 的行）。在接下来的条件性拆分中，检查哪些行需要插入、更新或忽略。如果 CRM 侧的源 ID 为空，则需要插入该记录。如果哈希值不同，则需要更新\
  \ CRM 中的记录。其余所有行均被忽略，因为它们已存在于 CRM 中且未发生变化。\n\n#### 数据流示例 2\n\n第二个示例使用查找转换来比较源数据与\
  \ CRM 数据。图 15-9 显示了该示例的数据流。\n\n![A978-1-4842-0638-6_15_Fig9_HTML.jpg](img/A978-1-4842-0638-6_15_Fig9_HTML.jpg)\n\
  \n图 15-9.\n\n使用查找转换的数据流示例 2\n\n在第二个示例中，通过查找转换获取 CRM 数据，而不是使用 OLE DB 源和合并联接。查询语句与第一个示例相同，但无需排序（排序仅合并联接需要）。选择哪种方案取决于从\
  \ CRM 获取的记录数量（如果使用查找，记录数最好能放入内存），以及 CRM 记录的长度（因为 `hashbytes` 输入限制为 8000 字节）。若超过限制，需使用其他方法计算哈希值，例如通过脚本组件。此外，如果还需要删除或停用\
  \ CRM 中不再存在于源数据中的记录，则需使用完全外部联接，而这仅能通过合并联接实现。\n\n#### 下载 CRM SDK\n\n在执行脚本组件之前，需先下载\
  \ Microsoft CRM 2013 软件开发包 (SDK)，下载地址为 [`http://www.microsoft.com/en-us/download/details.aspx?id=40321`](http://www.microsoft.com/en-us/download/details.aspx?id=40321)（对于\
  \ 2011 版，将 URL 中的 ID 值改为 24004；2015 版 ID 为 44567）。运行下载的文件以解压所有文件。您只需用到 `SDK\\Bin`\
  \ 文件夹中的 `Microsoft.Xrm.Sdk.dll` 程序集。\n\n下一步是将该程序集添加到 SSIS 计算机的全局程序集缓存 (GAC) 中，并将其复制到\
  \ SSIS 的 Binn 文件夹 `C:\\Program Files (x86)\\Microsoft SQL Server\\110\\DTS\\Binn\\\
  `（文件夹名称 110 对应 SQL Server 版本：100 对应 2008，110 对应 2012，120 对应 2014）。在开发机器上，可使用 `gacutil`\
  \ 将程序集添加到 GAC。在生产服务器上，需要创建安装程序、禁用 UAC 并通过 Windows 资源管理器将程序集拖入 GAC，或使用 PowerShell\
  \ 脚本将其添加到 GAC。注意，向 GAC 添加内容需要管理员权限。\n\n#### Windows Identity Foundation\n\nCRM SDK\
  \ 还需要 Windows Identity Foundation。请从 [`http://www.microsoft.com/en-US/download/details.aspx?id=17331`](http://www.microsoft.com/en-US/download/details.aspx?id=17331)\
  \ 下载并安装。标准安装即可满足要求。\n\n#### 变量\n\n为避免硬编码用户名、域名、密码和 Web 服务地址，建议使用变量或参数，并在脚本组件中引用它们。本示例使用了四个字符串变量，如图\
  \ 15-10 所示。\n\n![A978-1-4842-0638-6_15_Fig10_HTML.jpg](img/A978-1-4842-0638-6_15_Fig10_HTML.jpg)\n\
  \n图 15-10.\n\n用于存储 Web 服务连接信息的变量\n\nCRM Web 服务 URL 格式为 `http://<servername>:5555/<sitename>/XRMServices/Organization.svc`，端口号可能有所不同。\n\
  \n\n\n#### 添加脚本组件\n\n添加一个脚本组件（目标类型），用于插入或更新操作，并将上一步中的四个字符串变量添加为 `ReadOnlyVariables`。此步骤对所有脚本通用，如图\
  \ 15-11 所示。\n\n![A978-1-4842-0638-6_15_Fig11_HTML.jpg](img/A978-1-4842-0638-6_15_Fig11_HTML.jpg)\n\
  \n图 15-11. `ReadOnlyVariables`\n\n#### 输入列\n\n当向 CRM 插入记录时，你需要源的唯一 ID，以便将其存储在（隐藏的）CRM\
  \ 列中，同时需要所有你想插入到 CRM 的源数据列（见图 15-12）。对于此脚本，你不需要哈希值或来自 CRM 的列（它们本来就是空的）。\n\n![A978-1-4842-0638-6_15_Fig12_HTML.jpg](img/A978-1-4842-0638-6_15_Fig12_HTML.jpg)\n\
  \n图 15-12. 用于向 CRM 插入记录的列\n\n当更新记录时，你还需要来自 CRM 的 GUID 列（`ContactId`），因为它是唯一键，但不需要来自源的业务键（`SourceContactId`），因为它已在\
  \ CRM 中。\n\n#### 添加命名空间\n\n为简化代码，在 CRM SDK 命名空间和 `ServiceModel.Description`（用于 `ClientCredentials`）顶部添加额外的\
  \ `using`/`imports` 语句。\n\n```\n#region customNamespaces\nusing Microsoft.Xrm.Sdk;\n\
  using Microsoft.Xrm.Sdk.Client;\nusing Microsoft.Xrm.Sdk.Query;\nusing System.ServiceModel.Description;\n\
  #endregion\n```\n\n以下是 VB.NET 代码：\n\n```\n#Region \"CustomNamespace\"\nImports Microsoft.Xrm.Sdk\n\
  Imports Microsoft.Xrm.Sdk.Client\nImports Microsoft.Xrm.Sdk.Query\nImports System.ServiceModel.Description\n\
  #End Region\n```\n\n#### 类变量\n\n对于 Web 服务，你需要一个 `IOrganizationService` 类变量。该变量的值在\
  \ `PreExecute` 方法中赋值；在 `Input0_ProcessInputRow` 方法中，它用于在 CRM 中提交操作。\n\n```\nIOrganizationService\
  \ organizationservice;\n```\n\n以下是 VB.NET 代码：\n\n```\nDim organizationservice As\
  \ IOrganizationService\n```\n\n#### PreExecute\n\n在 `PreExecute` 方法中，你将读取 SSIS 变量以获取\
  \ Web 服务调用的凭据。创建新的 Web 服务代理并赋值给类变量，以便稍后用于提交插入和更新操作。\n\n```\npublic override void\
  \ PreExecute()\n{\n  // 用包中的变量值填充字符串变量\n  string CrmUrl = this.Variables.CrmWebservice.ToString();\n\
  \  string CrmDomainName = this.Variables.CrmDomain.ToString();\n  string CrmUserName\
  \ = this.Variables.CrmUser.ToString();\n  string CrmPassWord = this.Variables.CrmPassword.ToString();\n\
