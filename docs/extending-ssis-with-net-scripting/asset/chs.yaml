  \n图 5-17. 已添加到 `FileCheckLog` 表的日志条目\n\n你可以在数据传输场景中使用本练习中学到的方法来判断文件是否被锁定。\n\n###\
  \ Foreach 循环有序文件枚举器\n\nSSIS 控制流中有一个名为 **Foreach 循环**的容器。Foreach 循环允许你开发一个控制流，该控制流循环遍历枚举器的各项。共有七种枚举器类型，其中包括用于循环遍历目录中文件的**文件枚举器**，以及用于循环遍历对象变量中数据表记录的\
  \ **ADO 枚举器**。\n\n文件枚举器提供基本的搜索功能，例如基于文件名或扩展名的掩码，或遍历子文件夹的能力。但是，有些需求无法通过内置的文件枚举器处理；例如，当你需要按特定顺序（例如按创建日期，即希望基于其日期时间顺序将文件加载到数据库中）加载文件夹中的文件时。\n\
  \n在下一节中，你将学习如何使用脚本（你在本章前面的示例中已经熟悉了其中的大部分内容）来增强 Foreach 循环容器的功能，以创建一个包含列和行的数据表，然后将该数据表用作\
  \ Foreach 循环中枚举的源对象。\n\n\n\n#### Foreach 有序文件枚举器\n\n在此示例中，你将遍历指定目录中的 `.csv` 文件，并根据其创建日期和时间顺序加载它们。你将归档每个文件，然后在操作结束时将一条日志条目写入文件加载表。\n\
  \n创建包变量，并将目录路径设置为本书代码包中包含 `.csv` 文件的文件夹。\n\n以下是所使用的值和名称列表。请根据你的设置进行相应修改。如图 5-18\
  \ 所示。\n\n![A978-1-4842-0638-6_5_Fig18_HTML.jpg](img/A978-1-4842-0638-6_5_Fig18_HTML.jpg)\n\
  \n图 5-18。\n\n变量定义\n\n*   `FilePath` (String): `C:\\APress\\02_Code\\2014\\Extending\
  \ SSIS with .NET\\BookCode\\Chapter 5\\ContentFolder\\Customer.csv`\n*   `OrderedeFiles`\
  \ (Object): 默认为 `System.Object`\n*   `SourceFolder` (String): `C:\\APress\\02_Code\\\
  2014\\Extending SSIS with .NET\\Chapter 5\\ContentFolder`\n\n创建一个脚本任务，将 `User::SourceFolder`\
  \ 设置为 `ReadOnlyVariables`，将 `User::OrderedFiles` 设置为 `ReadWriteVariables`，如图 5-19\
  \ 所示。\n\n![A978-1-4842-0638-6_5_Fig19_HTML.jpg](img/A978-1-4842-0638-6_5_Fig19_HTML.jpg)\n\
  \n图 5-19。\n\n设置变量\n\n选择语言，然后点击**编辑脚本**打开脚本编辑器。\n\n将 `System.IO` 命名空间添加到**命名空间 (C#)**\
  \ 或 **Imports (VB)** 区域。自定义命名空间应如下所示：\n\n```csharp\nusing System.IO;\n```\n\n在 VB.NET\
  \ 中则为：\n\n```vb\nImports System.IO\n```\n\n#### 创建数据集\n\n在 `Main` 方法中，创建一个 `DataSet`\
  \ 对象。一个数据集对象可以包含一个或多个数据表。\n\n```csharp\nDataSet dsUnsorted = new DataSet();\n```\n\
  \n在 VB.NET 中相应代码为：\n\n```vb\nDim dsUnsorted As New DataSet()\n```\n\n添加一个用于保存文件信息的数据表：\n\
  \n```csharp\nDataTable filelistTable = dsUnsorted.Tables.Add();\n```\n\n添加表之后，可以向表中添加列，并为列指定名称和数据类型：\n\
  \n```csharp\nfilelistTable.Columns.Add(\"FilePath\", typeof(string));\nfilelistTable.Columns.Add(\"\
  FileName\", typeof(string));\nfilelistTable.Columns.Add(\"FileDate\", typeof(DateTime));\n\
  ```\n\n在 VB.NET 中相应代码为：\n\n```vb\nDim filelistTable As DataTable = dsUnsorted.Tables.Add()\n\
  filelistTable.Columns.Add(\"FilePath\", GetType(String))\nfilelistTable.Columns.Add(\"\
  FileName\", GetType(String))\nfilelistTable.Columns.Add(\"FileDate\", GetType(DateTime))\n\
  ```\n\n#### 加载文件\n\n读取目录中的所有文件，并将它们加载到一个字符串数组中：\n\n```csharp\nstring[] allFiles\
  \ = Directory.GetFiles(Dts.Variables[\"User::DirectoryPath\"].Value.ToString());\n\
  ```\n\n在 VB.NET 中相应代码为：\n\n```vb\nDim allFiles As String() = Directory.GetFiles(Dts.Variables(\"\
  User::DirectoryPath\").Value.ToString())\n```\n\n遍历数组中的每个文件，然后创建每个文件的 `FileInfo`\
  \ 对象。接下来，在数据表中插入一条新记录，其中包含从 `FileInfo` 对象加载的信息。\n\n```csharp\nFileInfo fileInfo;\n\
