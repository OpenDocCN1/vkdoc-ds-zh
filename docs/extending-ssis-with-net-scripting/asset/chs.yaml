  \ Sub\n```\n\n### 加密/解密文件\n\n有时你需要对文件进行加密，以便安全地存储或发送。`System.Security.Cryptography`\
  \ 命名空间提供了多种加密方式，但其中（撰写本书时）最好的一种是 **RijnDael**。在此示例中，你将通过连接管理器对文件进行加密和解密。我们将使用如图\
  \ 8-11 所示的流程。\n\n![A978-1-4842-0638-6_8_Fig11_HTML.jpg](img/A978-1-4842-0638-6_8_Fig11_HTML.jpg)\n\
  \n**图 8-11.** 文件加密与解密\n\n> **注意：** 在对高度敏感的数据实施加密之前，请全面研究各种加密方法的所有可能性、优缺点；不要想当然地直接使用这些代码。此外，加密与安全技术发展迅速。本书撰写时安全的方法，当你阅读本书时可能已经过时。\n\
  \n### 连接管理器\n\n要加密由数据流任务创建的平面文件，你可以使用名为 `MyProducts` 的平面文件连接管理器作为脚本任务的源。名为 `MyProducts_encrypted`\
  \ 的文件连接管理器用作目标，其中包含加密文件的文件路径。\n\n解密则相反。名为 `MyProducts_encrypted` 的文件连接管理器用作源，名为\
  \ `MyProducts_decrypted` 的平面文件连接管理器用作目标。解密文件后，此连接管理器即可用作数据流任务的源。\n\n#### 变量\n\n\
  为了存储密码，你需要一个变量，例如图 8-12 中的 `MyPassword` 变量。务必将包部署到生产环境时移除该默认值；否则，安全性将大打折扣。请改用配置或参数。\n\
  \n![A978-1-4842-0638-6_8_Fig12_HTML.jpg](img/A978-1-4842-0638-6_8_Fig12_HTML.jpg)\n\
  \n**图 8-12.** 你的秘密密码\n\n#### 脚本任务\n\n对于加密，请在数据流之后添加一个脚本任务；对于解密，请在数据流之前添加。在脚本任务编辑器中，将密码变量添加到\
  \ `ReadOnlyVariables`（参见图 8-13）。\n\n![A978-1-4842-0638-6_8_Fig13_HTML.jpg](img/A978-1-4842-0638-6_8_Fig13_HTML.jpg)\n\
  \n**图 8-13.** `ReadOnlyVariables` 中的秘密密码\n\n\n\n#### 脚本\n\n进入 VSTA 环境并添加以下命名空间以简化代码：\n\
  \n```csharp\n#region customNamespaces\nusing System.Security.Cryptography;\nusing\
  \ System.IO;\n#endregion\n```\n\n这是 VB.NET 代码：\n\n```vbnet\n#Region \"customNamespaces\"\
  \nImports System.Security.Cryptography\nImports System.IO\n#End Region\n```\n\n\
  加密和解密需要一个盐值（salt），该盐值存储在静态类变量中。盐值是一些随机数据，与密码一起用于加密数据。其主要功能是防御常用密码列表攻击。将此变量添加到类内部，但位于\
  \ `Main` 方法之外。\n\n```csharp\n// 盐值是一些随机数据，与密码一起用于加密数据。\n// 其主要功能是防御常用密码列表攻击。\nprivate\
  \ static readonly byte[] SALT = new byte[] { 0x26, 0xdc, 0xff, 0x76,\n         \
  \                                          0xad, 0xed, 0x7a, 0x64, 0xc5, 0xfe,\n\
  \                                                   0x20, 0xaf, 0x4d, 0x08, 0x22,\
  \ 0x3c };\n```\n\n以下是 VB.NET 代码：\n\n```vbnet\n' 盐值是一些随机数据，与密码一起用于加密数据。\n' 其主要功能是防御常用密码列表攻击。\n\
  Private Shared ReadOnly SALT As Byte() = New Byte() {&H26, &HDC, &HFF, &H76,_\n\
  \                                                     &HAD, &HED, &H7A, &H64,_\n\
  \                                                     &HC5, &HFE, &H20, &HAF,_\n\
  \                                                     &H4D, &H8, &H22, &H3C}\n```\n\
  \n接下来是两个静态方法：一个用于加密，一个用于解密。将它们添加到你的类中。放在现有的 `Main` 方法下方可能是最有条理的位置。这些方法将从 `Main`\
  \ 方法中被调用。\n\n```csharp\n// 使用 Rijndael 加密算法解密文本文件\npublic static void Decrypt(string\
  \ fileIn, string fileOut, string Password)\n{\n    // 为加密的源文件打开文件流\n    using (FileStream\
  \ fsIn = new FileStream(fileIn, FileMode.Open, FileAccess.Read))\n    {\n      \
  \  // 为解密后的文件打开文件流\n        using (FileStream fsOut = new FileStream(fileOut, FileMode.OpenOrCreate,\
  \ FileAccess.Write))\n        {\n            // 利用盐值技术从密码创建密钥和初始化向量\n          \
  \  Rfc2898DeriveBytes pdb = new Rfc2898DeriveBytes(Password, SALT);\n          \
  \  // 使用 Rijndael 创建对称算法\n            Rijndael alg = Rijndael.Create();\n      \
  \      // 设置密钥和初始化向量\n            alg.Key = pdb.GetBytes(32);\n            alg.IV\
  \ = pdb.GetBytes(16);\n\n            // 创建一个 CryptoStream\n            using (CryptoStream\
  \ cs = new CryptoStream(fsOut, alg.CreateDecryptor(),\n                        \
  \                               CryptoStreamMode.Write))\n            {\n      \
  \          // 初始化一个缓冲区，并分块处理输入文件。\n                // 这样做是为了避免将整个文件（可能很大）读入内存。\n\
  \                int bufferLen = 4096;\n                byte[] buffer = new byte[bufferLen];\n\
  \                int bytesRead;\n                do\n                {\n       \
  \             // 从输入文件中读取一块数据\n                    bytesRead = fsIn.Read(buffer,\
  \ 0, bufferLen);\n                    // 解密它\n                    cs.Write(buffer,\
  \ 0, bytesRead);\n                } while (bytesRead != 0);\n\n                //\
  \ 关闭所有资源\n                cs.Close();\n                fsOut.Close();\n        \
  \        fsIn.Close();\n            }\n        }\n    }\n}\n\n// 使用 Rijndael 加密算法加密文本文件\n\
  public static void Encrypt(string fileIn, string fileOut, string Password)\n{\n\
  \    // 为源文件打开文件流\n    using (FileStream fsIn = new FileStream(fileIn, FileMode.Open,\n\
  \                                             FileAccess.Read))\n    {\n       \
  \ // 为加密后的文件打开文件流\n        using (FileStream fsOut = new FileStream(fileOut, FileMode.OpenOrCreate,\n\
  \                                                  FileAccess.Write))\n        {\n\
  \            // 利用盐值技术从密码创建密钥和初始化向量\n            Rfc2898DeriveBytes pdb = new Rfc2898DeriveBytes(Password,\
  \ SALT);\n            // 使用 Rijndael 创建对称算法\n            Rijndael alg = Rijndael.Create();\n\
  \            // 设置密钥和初始化向量\n            alg.Key = pdb.GetBytes(32);\n          \
  \  alg.IV = pdb.GetBytes(16);\n\n            // 创建一个 CryptoStream\n            using\
  \ (CryptoStream cs = new CryptoStream(fsOut, alg.CreateEncryptor(),\n          \
  \                                             CryptoStreamMode.Write))\n       \
  \     {\n                // 初始化一个缓冲区，并分块处理输入文件。\n                // 这样做是为了避免将整个文件（可能很大）读入内存。\n\
  \                int bufferLen = 4096;\n                byte[] buffer = new byte[bufferLen];\n\
  \                int bytesRead;\n                do\n                {\n       \
  \             // 从输入文件中读取一块数据\n                    bytesRead = fsIn.Read(buffer,\
  \ 0, bufferLen);\n                    // 加密它\n                    cs.Write(buffer,\
  \ 0, bytesRead);\n                } while (bytesRead != 0);\n\n                //\
  \ 关闭所有资源\n                cs.Close();\n```\n\n\n\n`fsOut.Close();`\n\n`fsIn.Close();`\n\
  \n`}`\n\n`}`\n\n`}`\n\n`}`\n\n这是 VB.NET 代码：\n\n```vb.net\n' 使用 Rijndael 加密解密文本文件\n\
