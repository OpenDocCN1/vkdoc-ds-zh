  \ fileInfo.Name, fileInfo.CreationTime);\n}\n```\n\n在 VB.NET 中相应代码为：\n\n```vb\n\
  Dim fileInfo As FileInfo\nFor Each currentFile As String In allFiles\n    fileInfo\
