  \n图 10-9. 添加新的连接管理器\n\n#### 代码\n\n现在您可以返回“脚本”页面，并选择“编辑脚本...”以打开 VSTA 环境。首先，您需要添加一个额外的命名空间来缩短代码。\n\
  \n```csharp\n#region CustomNamespace\nusing System.IO;\n#endregion\n```\n\n以下是 VB.NET\
  \ 代码：\n\n```vbnet\n#Region \"CustomNamespace\"\nImports System.IO\n#End Region\n\
  ```\n\n在此示例中，您在`PreExecute`方法中添加了文件大小检查。当文件中没有可用数据时，会触发一个警告。还有一个名为`filePath`的类变量，用于在各个方法之间进行通信。`脚本组件编辑器`会在代码执行前检查连接管理器中的文件是否存在。这意味着文件存在性检查会重复现有逻辑，因此不会增加任何价值。\n\
  \n```csharp\n// 用于存储连接管理器文件路径的变量\nprivate string filePath;\n\npublic override void\
  \ PreExecute()\n{\n    // 填充类变量\n    filePath = this.Connections.myFile.AcquireConnection(null).ToString();\n\
  \n    // 检查文件是否包含数据，如果为空则触发警告。\n    FileInfo fi = new FileInfo(filePath);\n    if\
  \ (fi.Length == 0)\n    {\n        this.ComponentMetaData.FireWarning(0, \"myFile\"\
  , \"空文件: \" +\n            filePath, \"\", 0);\n    }\n}\n```\n\n以下是 VB.NET 代码：\n\
  \n```vbnet\n' 用于存储连接管理器文件路径的变量\nPrivate filePath As String\n\nPublic Overrides Sub\
  \ PreExecute()\n    ' 填充类变量\n    filePath = Me.Connections.myFile.AcquireConnection(Nothing).ToString()\n\
  \n    ' 检查文件是否包含数据，如果为空则触发警告。\n    Dim fi As New FileInfo(filePath)\n    If fi.Length\
  \ = 0 Then\n        Me.ComponentMetaData.FireWarning(0, \"myFile\", \"空文件: \" &\
  \ _\n            filePath, \"\", 0)\n    End If\nEnd Sub\n```\n\n接下来，您可以将以下代码复制到`CreateNewOutputRows`方法中。此方法创建新记录。它遍历文件中的所有行，并统计字段数量。当达到总字段数时，它会在\
  \ SSIS 中创建一条新记录，然后重置计数器。\n\n```csharp\npublic override void CreateNewOutputRows()\n\
  {\n    // 用于存储字段值的变量\n    int ID = 0;             // 字段 1\n    string Name = \"\"\
  ;       // 字段 2\n    string Address = \"\";    // 字段 3\n    int NumberOfColumns\
  \ = 3;\n\n    // 用于跟踪当前行/字段的计数器\n    int rowCounter = 0;\n\n    // 通过流读取文件。编码是可选的\n\
  \    using (StreamReader sr = new StreamReader(filePath,\n        System.Text.Encoding.UTF7))\n\
  \    {\n        String line;\n\n        // 读取文件中的行，直到到达文件末尾。\n        while ((line\
  \ = sr.ReadLine()) != null)\n        {\n            // 增加计数器\n            rowCounter++;\n\
  \n            // 将行拆分为字段和值\n            string[] columns = line.Split(',');\n\n\
  \            // 填充正确的变量\n            // 第 1 行: ID, 第 2 行: Name, 第 3 行: Address\n\
  \            switch (rowCounter)\n            {\n                case 1:\n     \
  \               // 字段 1\n                    ID = System.Convert.ToInt32(columns[1]);\n\
  \                    break;\n                case 2:\n                    // 字段\
  \ 2\n                    Name = columns[1];\n                    break;\n      \
  \          case 3:\n                    // 字段 3\n                    Address = columns[1];\n\
  \                    break;\n                default:\n                    // 不正确\n\
  \                    break;\n            }\n\n            // 如果已到达最后一个字段，则添加新行\n\
  \            if (rowCounter.Equals(NumberOfColumns))\n            {\n          \
  \      // 添加一个新行并填充字段\n                this.Output0Buffer.AddRow();\n          \
  \      Output0Buffer.ID = ID;\n                Output0Buffer.Name = Name;\n    \
  \            Output0Buffer.Address = Address;\n\n                // 最后一个字段，重置计数器并从下一组行开始\n\
  \                rowCounter = 0;\n            }\n        }\n    }\n}\n```\n\n以下是\
  \ VB.NET 代码：\n\n```vbnet\nPublic Overrides Sub CreateNewOutputRows()\n    ' 用于存储字段值的变量\n\
  \    Dim ID As Integer = 0                     ' 字段 1\n    Dim Name As String =\
  \ \"\"                   ' 字段 2\n    Dim Address As String = \"\"              \
  \  ' 字段 3\n    Dim NumberOfColumns As Integer = 3\n\n    ' 用于跟踪当前行/字段的计数器\n    Dim\
  \ rowCounter As Integer = 0\n\n    ' 通过流读取文件。编码是可选的\n    Using sr As New StreamReader(filePath,\
  \ System.Text.Encoding.UTF7)\n        Dim line As String\n\n        ' 读取第一行\n  \
  \      line = sr.ReadLine()\n\n        ' 从文件中逐行读取，直到到达文件末尾。\n        While (line\
  \ <> Nothing)\n            ' 增加计数器\n            rowCounter += 1\n\n            '\
  \ 将行拆分为字段和值\n            Dim columns As String() = line.Split(\",\"c)\n\n      \
  \      ' 填充正确的变量\n            ' 第 1 行: ID, 第 2 行: Name, 第 3 行: Address\n       \
  \     Select Case rowCounter\n                Case 1\n                    ' 字段 1\n\
  \                    ID = System.Convert.ToInt32(columns(1))\n                Case\
  \ 2\n                    ' 字段 2\n                    Name = columns(1)\n       \
  \         Case 3\n                    ' 字段 3\n                    Address = columns(1)\n\
  \                Case Else\n                    ' 不正确\n            End Select\n\n\
  \            ' 如果已到达最后一个字段，则添加新行\n            If rowCounter.Equals(NumberOfColumns)\
  \ Then\n                ' 添加一个新行并填充字段\n                Me.Output0Buffer.AddRow()\n\
  \                Output0Buffer.ID = ID\n                Output0Buffer.Name = Name\n\
  \                Output0Buffer.Address = Address\n\n                ' 最后一个字段，重置计数器并从下一组行开始\n\
  \                rowCounter = 0\n            End If\n\n            ' 从文件中读取一行\n\
  \            line = sr.ReadLine()\n        End While\n    End Using\nEnd Sub\n```\n\
  \n#### 结果\n\n当您执行数据流任务时，可以添加数据查看器（如图 10-10 所示）来检查结果。如果您有更多字段，只需扩展`switch`语句并增加`NumberOfColumns`整数变量即可。\n\
  \n![A978-1-4842-0638-6_10_Fig10_HTML.jpg](img/A978-1-4842-0638-6_10_Fig10_HTML.jpg)\n\
  \n图 10-10. 结果\n\n### 使用脚本组件作为源生成随机数据\n\n如果您知道源的格式，但没有实际数据进行测试怎么办？使用`脚本组件`作为源，您可以轻松生成随机数据，例如介于最小值和最大值之间的数字、介于开始日期和结束日期之间的日期、包含随机字符的文本，或者从列表中随机选取的文本。您可以使用此`脚本组件`示例来替换源，或者生成数据并填充源。\n\
  \n\n\n#### 脚本组件源\n\n转到数据流任务，将脚本组件添加到设计图面。系统会询问您选择源、转换还是目标。选择“源”并为其指定一个有用的名称。示例如图\
  \ 10-11 所示。\n\n![A978-1-4842-0638-6_10_Fig11_HTML.jpg](img/A978-1-4842-0638-6_10_Fig11_HTML.jpg)\n\
  \n图 10-11.\n\n作为源的脚本组件\n\n#### 输出列\n\n编辑脚本组件，然后转到“输入和输出”页面（见图 10-12）。添加您需要的列并设置适当的数据类型。在此示例中，您使用了字符串、整数、日期、货币和数值类型，但也可以使用其他数据类型。您可能需要在代码中添加额外的强制类型转换。\n\
  \n![A978-1-4842-0638-6_10_Fig12_HTML.jpg](img/A978-1-4842-0638-6_10_Fig12_HTML.jpg)\n\
  \n图 10-12.\n\n输出列\n\n该示例的列如下所示：\n\n*   `Name` （字符串 [DT_STR] 50）\n*   `Street` （字符串\
  \ [DT_STR] 50）\n*   `HouseNumber`（四字节有符号整数 [DT_I4]）\n*   `DateOfBirth`（日期 [DT_DATE]）\n\
  *   `Price`（货币 [DT_CY]）\n*   `Percentage`（数值 [DT_NUMERIC] 5,2）\n*   `Gender`（字符串\
  \ [DT_STR] 1）\n\n图 10-12 显示了脚本转换编辑器中的这些列。\n\n#### 代码\n\n在此示例中，您不必使用任何额外的命名空间，但使用了三个类变量。第一个整数用于指定要生成的行数。两个字符串变量用于随机单词或随机字符。您可以创建这些字符串的多个版本，每个版本包含不同的单词或字符集。\n\
  \n```\n// 配置要生成的行数\nprivate int numberOfRows = 1000;\n\n// 用于选取的逗号分隔字符串值列表\nprivate\
  \ string randomNames = \"Smith,Johnson,Williams,Brown,Jones,\" +\n    \"Miller,Davis,Garcia,Rodriguez,Wilson\"\
  ;\n\n// 用于创建字符串的字符列表\nprivate string chars = \"0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ\"\
  \ +\n    \"abcdefghijklmnopqrstuvwxyz\";\n```\n\n以下是 VB.NET 代码：\n\n```\n' 配置要生成的行数\n\
  Private numberOfRows As Integer = 1000\n\n' 用于选取的逗号分隔字符串值列表\nPrivate randomNames\
  \ As String = \"Smith,Johnson,Williams,Brown,Jones,\" + _\n    \"Miller,Davis,Garcia,Rodriguez,Wilson\"\
  \n\n' 用于创建字符串的字符列表\nPrivate chars As String = \"0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ\"\
  \ + _\n    \"abcdefghijklmnopqrstuvwxyz\"\n```\n\n接下来是几个新方法，您将它们放在了名为 `RandomMethods`\
  \ 的区域中。这些额外的方法从 `CreateNewOutputRows` 方法中调用，用于生成随机数据。最清晰的位置可能是在 `CreateNewOutputRows`\
  \ 方法的下方。\n\n```\n#region RandomMethods\n\n// 传入一个字符串，随机选取其中一个元素\nprivate string\
  \ pickRandomString(string stringlist, Random rndNumber)\n{\n    // 将字符串拆分为字符串数组\n\
  \    string[] strings = stringlist.Split(',');\n    // 随机选取一个并返回\n    return strings[rndNumber.Next(strings.Length)];\n\
  }\n\n// 从字符集合中创建具有随机字符的字符串\nprivate string createRandomString(string chars, int\
  \ max, Random rndNumber)\n{\n    // 注释掉此行可创建\n    // 长度相同的字符串\n    max = rndNumber.Next(1,\
  \ max);\n    // 创建一个指定长度的字符数组\n    char[] stringChars = new char[max];\n    // 用随机字符填充每个数组元素\n\
  \    for (int i = 0; i < stringChars.Length; i++)\n    {\n        stringChars[i]\
  \ = chars[rndNumber.Next(chars.Length)];\n    }\n    // 将字符数组转换为字符串并返回\n    return\
  \ new String(stringChars);\n}\n\n// 在最小值和最大值之间随机选取一个数字\nprivate int pickRandomNumber(int\
  \ min, int max, Random rndNumber)\n{\n    // 随机选取一个整数\n    return rndNumber.Next(min,\
  \ max);\n}\n\n// 在最小值和最大值之间随机选取一个数字\npublic double pickRandomNumber(double min,\
  \ double max, Random rndNumber)\n{\n    // 随机选取一个双精度浮点数\n    return rndNumber.NextDouble()\
  \ * (max - min) + min;\n}\n\n// 在最小日期和最大日期之间随机选取一个日期\npublic static DateTime pickRandomDate(DateTime\
  \ from, DateTime to,\n    Random rndNumber)\n{\n    // 计算 to 与 from 之间的差值\n    TimeSpan\
  \ range = to - from;\n    // 确定随机增量\n    TimeSpan randTimeSpan = new TimeSpan((long)(rndNumber.NextDouble()\
  \ *\n        range.Ticks));\n    // 返回 from 加上随机增量的结果\n    return (from + randTimeSpan).Date;\n\
  }\n\n#endregion\n```\n\n以下是 VB.NET 代码：\n\n```\n#Region \"RandomMethods\"\n\n' 传入一个字符串，随机选取其中一个元素\n\
  Private Function pickRandomString(stringlist As String, _\n    rndNumber As Random)\
  \ As String\n    ' 将字符串拆分为字符串数组\n    Dim strings As String() = stringlist.Split(\"\
  ,\"c)\n    ' 随机选取一个并返回\n    Return strings(rndNumber.Next)\nEnd Function\n\n' 从字符集合中创建具有随机字符的字符串\n\
  Private Function createRandomString(chars As String, max As Integer, _\n    rndNumber\
  \ As Random) As String\n    ' 注释掉此行可创建\n    ' 长度相同的字符串\n    max = rndNumber.Next\n\
  \    ' 创建一个指定长度的字符数组\n    Dim stringChars As Char() = New Char(max - 1) {}\n   \
  \ ' 用随机字符填充每个数组元素\n    For i As Integer = 0 To stringChars.Length - 1\n        stringChars(i)\
  \ = chars(rndNumber.Next)\n    Next\n```\n\n\n```vbnet\n' 将字符数组转换为字符串并返回\nReturn\
  \ New String\nEnd Function\n\n' 在最小值和最大值之间选取一个随机整数\nPrivate Function pickRandomNumber(min\
  \ As Integer, max As Integer, _\nrndNumber As Random) As Integer\n' 选取一个随机整数\nReturn\
  \ rndNumber.Next\nEnd Function\n\n' 在最小值和最大值之间选取一个随机双精度浮点数\nPublic Function pickRandomNumber(min\
  \ As Double, max As Double, _\nrndNumber As Random) As Double\n' 选取一个随机双精度浮点数\n\
  Return rndNumber.NextDouble() * (max - min) + min\nEnd Function\n\n' 在最小日期和最大日期之间选取一个随机日期\n\
  Public Shared Function pickRandomDate(from As DateTime, [to] As DateTime, _\nrndNumber\
  \ As Random) As DateTime\n' 计算截止日期与起始日期之间的差值\nDim range As TimeSpan = [to] - from\n\
  ' 确定随机增量\nDim randTimeSpan As New TimeSpan(CLng(rndNumber.NextDouble() * range.Ticks))\n\
  ' 返回起始日期 + 随机增量的和\nReturn (from + randTimeSpan).[Date]\nEnd Function\n\n#End Region\n\
  ```\n\n现在是将代码添加到`CreateNewOutputRows`方法中的时候了。其中包含一个`for`循环，该循环会一直执行，直到达到请求的记录数。在循环内部，各列将被填充随机数据。\n\
  \n```csharp\n// 生成新行的标准方法\npublic override void CreateNewOutputRows()\n{\n    //\
  \ 循环直到 numberOfRows 被满足。变量 i 还会\n    // 用于为每行生成不同的随机值。\n    for (int i = 0; i <\
  \ numberOfRows; i++)\n    {\n        // 添加一个新行\n        Output0Buffer.AddRow();\n\
  \n        // 数据类型: string [DT_STR]\n        Output0Buffer.Name = pickRandomString(randomNames,\
  \ new Random(i));\n\n        // 数据类型: string [DT_STR]\n        Output0Buffer.Street\
  \ = createRandomString(chars, 10, new Random(i));\n\n        // 数据类型: four-byte\
  \ signed integer [DT_I4]\n        Output0Buffer.HouseNumber = pickRandomNumber(1,\
  \ 10, new Random(i));\n\n        // 数据类型: date [DT_DATE]\n        Output0Buffer.DateOfBirth\
  \ = pickRandomDate(new DateTime(1974, 01, 01),\n        new DateTime(1999, 12, 31),\
  \ new Random(i));\n\n        // 数据类型: currency [DT_CY]\n        Output0Buffer.Price\
  \ = Convert.ToDecimal(pickRandomNumber(\n        Convert.ToDouble(0), Convert.ToDouble(10000),\n\
  \        new Random(i)));\n\n        // 数据类型: numeric [DT_NUMERIC]\n        Output0Buffer.Percentage\
  \ = Convert.ToDecimal(pickRandomNumber(\n        Convert.ToDouble(0), Convert.ToDouble(100),\n\
  \        new Random(i)));\n\n        // 数据类型: string [DT_STR]\n        Output0Buffer.Gender\
  \ = pickRandomString(\"M,F\", new Random(i));\n    }\n}\n```\n\n以下是 VB.NET 代码：\n\
  \n```vbnet\n' 生成新行的标准方法\nPublic Overrides Sub CreateNewOutputRows()\n    ' 循环直到\
  \ numberOfRows 被满足。变量 i 还会\n    ' 用于为每行生成不同的随机值。\n    For i As Integer = 0 To numberOfRows\
  \ - 1\n        ' 添加一个新行\n        Output0Buffer.AddRow()\n\n        ' 数据类型: string\
  \ [DT_STR]\n        Output0Buffer.Name = pickRandomString(randomNames, New Random(i))\n\
  \n        ' 数据类型: string [DT_STR]\n        Output0Buffer.Street = createRandomString(chars,\
  \ 10, New Random(i))\n\n        ' 数据类型: four-byte signed integer [DT_I4]\n     \
  \   Output0Buffer.HouseNumber = pickRandomNumber(1, 10, New Random(i))\n\n     \
  \   ' 数据类型: date [DT_DATE]\n        Output0Buffer.DateOfBirth = pickRandomDate(New\
  \ DateTime(1974, 1, 1), _\n        New DateTime(1999, 12, 31), New Random(i))\n\n\
  \        ' 数据类型: currency [DT_CY]\n        Output0Buffer.Price = Convert.ToDecimal(pickRandomNumber(\
  \ _\n        Convert.ToDouble(0), Convert.ToDouble(10000), _\n        New Random(i)))\n\
  \n        ' 数据类型: numeric [DT_NUMERIC]\n        Output0Buffer.Percentage = Convert.ToDecimal(pickRandomNumber(\
  \ _\n        Convert.ToDouble(0), Convert.ToDouble(100), _\n        New Random(i)))\n\
  \n        ' 数据类型: string [DT_STR]\n        Output0Buffer.Gender = pickRandomString(\"\
  M,F\", New Random(i))\n    Next\nEnd Sub\n```\n\n请注意，如果你重新运行数据流，你会得到相同的随机数据。这是因为你正在使用行号\
  \ `i` 作为种子来计算随机值：`New Random(i)`。如果你不希望这样，你可以通过向种子添加毫秒之类的内容来改变行为：\n\n```csharp\n\
  new Random(i + DateTime.Now.Millisecond)\n```\n\n#### 结果\n\n当你执行数据流任务时，可以添加一个数据查看器来检查结果。你可以在图\
  \ 10-13 中看到这样的查看器。你可以将数据移动到表或平面文件中，并将其作为另一个数据流中的源来测试它。通过添加额外的列或其他字符串集，可以很容易地对其进行扩展。\n\
  \n![A978-1-4842-0638-6_10_Fig13_HTML.jpg](img/A978-1-4842-0638-6_10_Fig13_HTML.jpg)\n\
  \n**图 10-13.** 结果\n\n### 总结\n\n在本章中，你学习了如何将脚本组件用作不同格式文本文件的源。只要你能够想出一个规则，其可能性就是无限的。你看到的第二件事是如何生成用于测试目的的随机数据。当你没有数据时，这很方便。在第\
  \ 15 章中，你会看到你甚至可以像使用网络服务作为源。\n\n"
- "# 11. 脚本组件转换\n\n电子补充材料 本章的在线版本 (doi:[10.1007/978-1-4842-0638-6_11](http://dx.doi.org/10.1007/978-1-4842-0638-6_11))\
  \ 包含补充材料，可供授权用户使用。\n\n使用标准转换可以完成很多事情，但有时脚本组件提供了更简单的解决方案。例如，在派生列中实现嵌套的 `if` 结构是可能的，但如果你有很多层级或条件，它会变得难以阅读和维护。并且某些功能在开箱即用的组件中是不可用的。本章展示了脚本组件有用的一些情况。\n\
  \n### 脚本组件转换\n\n脚本组件转换的基本结构是让你能够逐行访问来自上游的数据。针对输出的转换会应用于输入中的每一行。这种转换也可以以非同步方式发生，这意味着输入中的每一行不需要在输出行中都有匹配项（它们可以在输出中产生零行或多行）。例如，一个文件夹名称输入行可以返回多个包含该文件夹中文件名的输出行。输出设置的控制是在脚本组件的“输入和输出”窗格中完成的，如图\
  \ 11-1 所示。\n\n![A978-1-4842-0638-6_11_Fig1_HTML.jpg](img/A978-1-4842-0638-6_11_Fig1_HTML.jpg)\n\
  \n**图 11-1.** 脚本组件同步输入\n\n如果一个组件有多个输入，你可以创建多个输出并匹配输入和输出，甚至添加一些异步输出。\n\n### ProperCase\n\
  \n有时你会得到格式非常糟糕的数据，而且你没有机会访问数据源来重新格式化它。你可能希望对它应用适当的首字母大写格式。在下面的例子中，你有一个客户表，其中的 `FirstName`\
  \ 和 `LastName` 列都是大写字母。你希望将它们重新格式化为适当的大小写格式。\n\n有一个名为 `StrConv` 的 VB.NET 函数可以为你转换大小写。在\
  \ C# 中，这稍微复杂一些。你首先向包中添加一个数据流任务，然后使用源助手来获取数据。\n\n\n#### 数据源\n\n为简化操作，在 `APRESS_SSIS_Scripting`\
  \ 数据库中创建一个名为 `Chapter_11` 的表，定义如下：\n\n```\nCREATE TABLE [dbo].Chapter 11 NOT NULL,\n\
  \    [FirstName] nvarchar NULL,\n    [LastName] nvarchar NULL,\n    [YearlyIncome]\
  \ [int] NULL,\n    [TeamName] varchar NULL\n) ON [PRIMARY]\n```\n\n该表需填充一些全大写的名字和姓氏，作为数据源。\n\
  \n```\nINSERT INTO [dbo].[Chapter 11] ([FirstName], [LastName]) VALUES (N'JON',\
  \ N'YANG')\nINSERT INTO [dbo].[Chapter 11] ([FirstName], [LastName]) VALUES (N'EUGENE',\
  \ N'HUANG')\nINSERT INTO [dbo].[Chapter 11] ([FirstName], [LastName]) VALUES (N'RUBEN',\
  \ N'TORRES')\nINSERT INTO [dbo].[Chapter 11] ([FirstName], [LastName]) VALUES (N'CHRISTY',\
  \ N'ZHU')\nINSERT INTO [dbo].[Chapter 11] ([FirstName], [LastName]) VALUES (N'ELIZABETH',\
  \ N'JOHNSON')\nINSERT INTO [dbo].[Chapter 11] ([FirstName], [LastName]) VALUES (N'JULIO',\
  \ N'RUIZ')\nINSERT INTO [dbo].[Chapter 11] ([FirstName], [LastName]) VALUES (N'JANET',\
  \ N'ALVAREZ')\n```\n\n> **注意：** 第 11 章的源代码包含表架构和填充表的脚本。\n\n#### 脚本转换\n\n首先，在包的设计界面上添加一个数据流任务。在此数据流任务中，添加一个\
  \ OLE DB 源组件，指向刚创建的表：`Chapter_11`。\n\n添加一个名为 `SCR_TRA_ProperCasing` 的脚本组件，如图 11-2\
  \ 所示。在“输入”窗格中，勾选要更改的列，并将其使用类型更改为 `ReadWrite`（默认是 `ReadOnly`）。将脚本组件连接到 OLE DB 源组件的输出。\n\
  \n![A978-1-4842-0638-6_11_Fig2_HTML.jpg](img/A978-1-4842-0638-6_11_Fig2_HTML.jpg)\n\
  \n*图 11-2. ReadWrite 变量*\n\n在创建的 VSTA 脚本中，需要找到 `Input0_ProcessInputRow` 方法并执行一些字符串转换。\n\
  \nC# 没有内置方法将字符串转换为 `ProperCase`，因此需要自行实现。最简单的方法可能是先将所有字符转换为小写，然后对小写字符串应用 `TitleCase`\
  \ 方法。\n\n```\n//先转换为小写\nstring firstName = Row.FirstName.ToLower();\nstring lastName\
  \ = Row.LastName.ToLower();\n\n//实际的 Proper Casing 转换\nRow.FirstName = new System.Globalization.CultureInfo(\"\
  en\").TextInfo.ToTitleCase(firstName);\nRow.LastName = new System.Globalization.CultureInfo(\"\
  en\").TextInfo.ToTitleCase(lastName);\n```\n\n> **注意：** 另一种方法是在自定义命名空间中添加对 Visual\
  \ Basic DLL 的引用，然后从 C# 调用 VBScript 方法。但我们认为，混合编程语言并非优雅方式。\n\nVB.NET 中的解决方案与 C# 类似：\n\
  \n```\nRow.FirstName = StrConv(Row.FirstName, VbStrConv.ProperCase)\nRow.LastName\
  \ = StrConv(Row.LastName, VbStrConv.ProperCase)\n```\n\n编写完脚本后，可以向数据流中添加一个多播组件，并将其连接到脚本组件的输出。在两者之间的连接中添加数据查看器；图\
  \ 11-3 显示了结果。\n\n![A978-1-4842-0638-6_11_Fig3_HTML.jpg](img/A978-1-4842-0638-6_11_Fig3_HTML.jpg)\n\
  \n*图 11-3. Proper casing*\n\n### 加密与解密数据\n\n有时需要从表或文件中提取数据，但希望在导出前对数据进行加密，以保护敏感信息不被泄露。例如，社会保险号、密码或薪资。之后可能需要解密数据以显示原始值。\n\
  \n为此，使用前面示例中创建的表的 `YearlyIncome` 列，该列需要加密，并在某时刻解密。\n\n然后向表中添加一些数据：\n\n```\nINSERT\
  \ INTO [dbo].[Chapter 11] ([FirstName], [LastName], [YearlyIncome]) VALUES (N'Leonardo',\
  \ N'Mc Cormick', 145872)\nINSERT INTO [dbo].[Chapter 11] ([FirstName], [LastName],\
  \ [YearlyIncome]) VALUES (N'Josh', N'Cortez', 292927)\nINSERT INTO [dbo].[Chapter\
  \ 11] ([FirstName], [LastName], [YearlyIncome]) VALUES (N'Andres', N'Wall', 318002)\n\
  INSERT INTO [dbo].[Chapter 11] ([FirstName], [LastName], [YearlyIncome]) VALUES\
  \ (N'Leonard', N'Chambers', 255004)\nINSERT INTO [dbo].[Chapter 11] ([FirstName],\
  \ [LastName], [YearlyIncome]) VALUES (N'Miguel', N'Kelly', 71128)\nINSERT INTO [dbo].[Chapter\
  \ 11] ([FirstName], [LastName], [YearlyIncome]) VALUES (N'Jerry', N'Fox', 180525)\n\
  ```\n\n#### 解决方案包\n\n在一个名为 `EncryptDecrypt` 的新包中，添加一个数据流任务 `DFT_EncryptData`。在此数据流任务中，添加一个名为\
  \ `OLE_SRC_GetDataToEncrypt` 的 OLE DB 源组件。将源连接指向 第 11 章 的表，并选择所有列，如图 11-4 所示。\n\n\
  ![A978-1-4842-0638-6_11_Fig4_HTML.jpg](img/A978-1-4842-0638-6_11_Fig4_HTML.jpg)\n\
  \n*图 11-4. OLE DB 源连接窗口*\n\n.NET Framework 支持两种加密方式：对称加密和非对称加密。\n\n它们使用不同的过程执行。对称加密在流上执行，因此适用于加密大量数据。非对称加密在少量字节上执行，因此仅适用于小数据量。由于我们逐行处理单个列，因此将使用非对称加密。\n\
  \n对称加密通常用于加密整个文件。\n\n第 8 章 包含一些关于使用脚本任务加密和解密整个文件的注意事项。\n\n#### 变量\n\n加密首先需要一个加密密钥。创建一个名为\
  \ `EncryptionKey` 的字符串变量，并使用经典的包含所有字母的句子为其赋值：`\"The quick fox jumps over the lazy\
  \ dog.\"`。\n\n配置好 OLE DB 源后，接下来添加一个用于转换的脚本组件；将其命名为 `SCR_TRA_EncryptIncome`。\n\n\
  在组件的“脚本”页面中，将 `User::EncryptionKey` 变量添加为 `Read-only`，如图 11-5 所示。\n\n![A978-1-4842-0638-6_11_Fig5_HTML.jpg](img/A978-1-4842-0638-6_11_Fig5_HTML.jpg)\n\
  \n*图 11-5. ReadOnly 变量*\n\n在组件的“输入列”页面中，选择 `YearlyIncome`，即要加密的列（见图 11-6）。\n\n![A978-1-4842-0638-6_11_Fig6_HTML.jpg](img/A978-1-4842-0638-6_11_Fig6_HTML.jpg)\n\
  \n*图 11-6. 脚本转换编辑器输入页面*\n\n#### 脚本\n\n点击 **Edit Script...** 按钮启动 VSTA。首先，可以移除自动生成类中不需要的方法：`PreExecute`\
  \ 和 `PostExecute`。\n\n接下来添加加密和解密文本所需的命名空间。以下是 C# 脚本的开头部分：\n\n```\n#region CustomNamespaces\n\
  using System.IO;\nusing System.Security.Cryptography;\n#endregion\n```\n\n以下是 VB.NET\
  \ 版本：\n\n```\nImports System.IO\nImports System.Security.Cryptography\n```\n\n在脚本中添加两个方法：一个用于加密，一个用于解密。它们都接受两个参数：一个待加密字符串和一个加密密钥字符串。\n\
  \n这两个方法具有相同的接口：\n\n```csharp\npublic static string Encrypt(string clearText, string\
  \ Password)\npublic static string Decrypt(string cipherText, string Password)\n\
  ```\n\n在 VB.NET 中，可以按如下方式添加这两个方法：\n\n```vbnet\nPublic Shared Function Encrypt(ByVal\
  \ clearText As String, ByVal Password As String)\nPublic Shared Function Decrypt(ByVal\
  \ cipherText As String, ByVal Password As String)\n```\n\n\n\n#### 为密码加盐\n\n`encrypt`\
  \ 和 `decrypt` 方法的核心思路是传入一个密码和一个密码盐，并利用密码盐从密码中派生密钥。当然，在 `encrypt` 方法和 `decrypt` 方法中使用的盐必须是相同的。这一步是在类级别完成的，而不是在方法中，因为只需要在类实例化时执行一次。\n\
  \n在 C# 中，密码盐定义如下：\n\n```\n// 使用加盐技术从密码创建密钥和 IV\nPasswordDeriveBytes pdb = new PasswordDeriveBytes(Password,\
  \ new byte[] { 0x49, 0x76, 0x61, 0x6e, 0x20, 0x4d, 0x65, 0x64, 0x76, 0x65, 0x64,\
  \ 0x65, 0x76 });\n```\n\nVB.NET 读者可以在代码中编写以下内容：\n\n```\n' 使用加盐技术从密码创建密钥和 IV\nDim\
  \ pdb As New PasswordDeriveBytes(Password, New Byte() {&H49, &H76, &H61, &H6E, &H20,\
  \ &H4D, &H65, &H64, &H76, &H65, &H64, &H65, &H76})\n```\n\n#### 加密流\n\n然后，您需要创建一个\
  \ `CryptoStream`，它包含一个目标流（`MemoryStream`）、一个加密算法（为简单起见，这里使用 Rijndael 算法，但也可以使用其他算法）以及流模式。在加密和解密值时，`CryptoStreamMode`\
  \ 都设置为 `Write`。\n\n以下是在 C# 中创建该流的代码：\n\n```\n// 创建一个 CryptoStream\nCryptoStream\
  \ cs = new CryptoStream(ms, alg.CreateDecryptor(), CryptoStreamMode.Write);\n```\n\
  \nVB.NET 的实现如下：\n\n```\n' 创建一个 CryptoStream\nDim cs As CryptoStream = New CryptoStream(ms,\
  \ alg.CreateEncryptor(), CryptoStreamMode.Write)\n```\n\n加密和解密之间的唯一区别在于操作写入 `MemoryStream`\
  \ 之后。\n\n#### 加密数据\n\n对于加密，您需要将字节数组转换为 Base64 字符串。在 C# 中通过以下方式实现：\n\n```\n// 将加密数据作为字符串返回\n\
  return Convert.ToBase64String(encryptedData);\n```\n\n使用以下代码在 VB.NET 中执行相同的转换：\n\
  \n```\n' 将加密数据作为字符串返回\nEncrypt = Convert.ToBase64String(encryptedData)\n```\n\n\
  #### 解密数据\n\n对于解密，您需要将内容转换回普通的人类可读字符串。在 C# 中，编写如下代码：\n\n```\n// 将解密数据作为字符串返回\nreturn\
  \ System.Text.Encoding.Unicode.GetString(decryptedData);\n```\n\n而在 VB.NET 中，您可以这样编写：\n\
  \n```\n' 将解密数据作为字符串返回\nDecrypt = System.Text.Encoding.Unicode.GetString(decryptedData)\n\
  ```\n\n**注意**  \n完整的脚本可在第 11 章的可下载代码中找到。\n\n如果您向脚本组件转换的输出添加一个多播，您就可以添加一个数据查看器并检查返回的数据，以确保所有内容都按预期解密。图\
  \ 11-7 展示了脚本的结果。\n\n![A978-1-4842-0638-6_11_Fig7_HTML.jpg](img/A978-1-4842-0638-6_11_Fig7_HTML.jpg)\
  \  \n**图 11-7.** 加密和解密的收入\n\n加密和解密可以通过多种不同的方式进行。我们仅仅触及了这个主题的表面，单靠一个例子远不足以全面阐述。如果您对\
  \ .NET 中加密功能的更多信息感兴趣，我们建议您进一步查阅 MSDN 上的系统密码命名空间，网址为 [`msdn.microsoft.com/en-us/library/System.Security.Cryptography(v=vs.110).aspx`](https://msdn.microsoft.com/en-us/library/System.Security.Cryptography(v=vs.110).aspx)。\n\
  \n### 比较行\n\n继续使用员工收入的例子，假设每个员工都属于一个团队，您希望能够检查谁在团队中收入最高，以及收入最高的成员与团队其他成员之间的收入差距。\n\
  \n让我们将员工分配到十个不同的团队中。\n\n```\nUPDATE dbo.Chapter 11 SET TeamName = 'Team ' + CAST(RIGHT(ID,1)\
  \ AS VARCHAR(1))\n```\n\n在一个空白包的设计界面上，添加一个名为 `DFT_CompareRows` 的数据流。在此数据流中，添加一个\
  \ OLE DB 源连接，并连接到 `APRESS_SSIS_Scripting` 数据库。为了进行逐行比较，您需要首先按 `TeamName` 排序输入，然后按\
  \ `Income` 排序，因此您需要将数据访问模式设置为 SQL 命令，并将命令文本设置如下：\n\n```\nSELECT [FirstName]\n  \
  \    ,[LastName]\n      ,[YearlyIncome]\n      ,[ID]\n      ,[TeamName]\n  FROM\
  \ [dbo].[Chapter 11]\nORDER BY TeamName, YearlyIncome DESC\n```\n\n在“列”页面上，选择所有列，如图\
  \ 11-8 所示。\n\n![A978-1-4842-0638-6_11_Fig8_HTML.jpg](img/A978-1-4842-0638-6_11_Fig8_HTML.jpg)\
  \  \n**图 11-8.** OLE DB 源编辑器\n\n然后，您在数据流中添加一个用于转换的脚本组件（重命名为 `SCR_TRA_CompareRows`），并将其连接到\
  \ OLE DB 源输出。\n\n在“脚本组件输入列”页面上，您需要将 `YearlyIncome` 和 `TeamName` 添加为只读输入列，因为您在脚本中会用到它们。\n\
  \n接下来，为 `Output0` 添加两个类型为 `DT_I4`（四字节有符号整数）的列，分别命名为 `HighestIncome` 和 `IncomeDifference`。这些是您将在脚本中写入的列。\n\
  \n在组件的“脚本”页面上单击**编辑脚本…**，然后启动 VSTA。首先，删除您不使用的 `PostExecute` 和 `PreExecute` 方法。此处重要的方法是\
  \ `Input0_ProcessInputRow`，您可以在其中对通过的数据进行逐行比较。\n\n因为输入已排序，您可以放心逐行比较的操作会成功。在这类脚本中，这是一个非常重要的点。输入是否已排序对于比较的成功至关重要。\n\
  \n以下是用于比较行的 C# 版本脚本：\n\n```\n// 将当前行与上一行进行比较\nif (Row.TeamName == teamname)\n{\n\
  \    // 匹配，将收入与上一行的收入进行比较\n    Row.IncomeDifference = Row.YearlyIncome - highestincome;\n\
  }\nelse\n{\n    // TeamName 不匹配，这是新团队的第一行\n    highestincome = Row.YearlyIncome;\n\
  }\n// 将当前行的值存储到变量中，供下一行使用。\nteamname = Row.TeamName;\nRow.HighestIncome = highestincome;\n\
  ```\n\n而 VB.NET 中的代码如下：\n\n```\n' 将当前行与上一行进行比较\nIf Row.TeamName = teamname Then\n\
  \    ' 匹配，将收入与上一行的收入进行比较\n    Row.IncomeDifference = Row.YearlyIncome - highestincome\n\
  Else\n    ' TeamName 不匹配，这是新团队的第一行\n    highestincome = Row.YearlyIncome\nEnd If\n\
  ' 将当前行的值存储到变量中，供下一行使用。\nteamname = Row.TeamName\nRow.HighestIncome = highestincome\n\
  ```\n\n通过向数据流添加一个多播和一个数据查看器，您可以检查脚本是否正常工作。图 11-9 展示了比本章源代码中更大的数据样本的结果。\n\n![A978-1-4842-0638-6_11_Fig9_HTML.jpg](img/A978-1-4842-0638-6_11_Fig9_HTML.jpg)\
  \  \n**图 11-9.** 带有结果的数据查看器\n\n\n\n### IsNumeric\n\n.NET Framework 具备多种检测数据类型、空值等功能。尽管\
  \ SQL Server 2012 允许使用 `TryCast` 等部分功能，但由于我们并非总能使用最新版本的 SQL Server，因此并非总有条件使用此方法。这时，脚本组件的功能就派上了用场。\n\
  \n为便于演示，我们使用一个仅包含单列数据的简易文本文件作为输入。数据如下：\n\n`TextNumber`\n\n`1`\n\n`42`\n\n`3`\n\n\
  `4`\n\n`Hello world!`\n\n`7`\n\n`I love SSIS`\n\n如你所见，其中有一些行并非数值型。\n\n数值检测的实现非常简单。在界面上添加一个新包和一个数据流。\n\
  \n在该数据流中，添加平面文件源：`FFS_TextNumbers`，并创建一个指向上述文本文档的连接管理器。所有配置保留默认值。点击“列”页面确认数值。图 11-10\
  \ 展示了平面文件连接管理器的设置。\n\n![A978-1-4842-0638-6_11_Fig10_HTML.jpg](img/A978-1-4842-0638-6_11_Fig10_HTML.jpg)\n\
  \n图 11-10. 平面文件连接管理器编辑器\n\n有了平面文件源后，添加一个用于转换的脚本组件，命名为 `SCR_TRA_TextNumber`。\n\n\
  在组件的“输入”页面，将 `TextNumber` 列设为“只读”。\n\n在“输入和输出列”页面，添加一个布尔类型（`DT_BOOL`）的输出列 `isNumeric`，用于存储结果。\n\
  \n在“脚本”页面点击“编辑脚本...”按钮后，移除不需要的 `PreExecute` 和 `PostExecute` 方法，并在 `Input0_ProcessInputRow`\
  \ 方法中添加以下两行代码：\n\n```\n//检查值是否为数值型\nint result;\nRow.isNumeric = Int32.TryParse(Row.TextNumber,\
  \ out result);\n```\n\n如果使用 VB.NET 编写，则添加以下两行：\n\n```\nDim result As Int32\n' 如果解析成功则返回\
  \ true，否则返回 false\nRow.isNumeric = Int32.TryParse(Row.TextNumber, result)\n```\n\
  \n确实既简单又强大。结果如图 11-11 所示。\n\n![A978-1-4842-0638-6_11_Fig11_HTML.jpg](img/A978-1-4842-0638-6_11_Fig11_HTML.jpg)\n\
  \n图 11-11. `int32.TryParse` 方法的执行结果\n\n### 创建代理键\n\n在某些情况下，你需要在数据流中生成一个唯一的连续数字作为某种键。它还可用于排名、消除重复项等。当数据来自半结构化源（例如，一个没有连续标识或行号信息的文本文件）时，脚本转换是理想的解决方案。\n\
  \n我们继续以上一节检测数值的示例为基础进行构建。假设你想确保所有获取的数值行都添加一个行号。\n\n注意：如果你尚未了解上一节的解决方案，可以从本书网站下载代码。\n\
  \n在名为 `SCR_TRA_TextNumber` 的脚本组件的“输入和输出列”页面中，添加一个四字节有符号整数（`DT_I4`）类型的输出列，命名为 `RowNumber`。\n\
  \n点击“编辑脚本...”按钮打开脚本。在 C# 解决方案中，在类声明的正下方添加以下代码行：\n\n```\nint rownumber = 0; // 在类级别定义，每行都会保留其值\n\
  ```\n\nVB.NET 读者请执行以下操作：\n\n```\nDim rownumber As Integer = 0\n```\n\n将 `Input0_ProcessInputrow`\
  \ 方法中的现有代码替换为以下内容：\n\n```\nint result;\nbool isNumeric = Int32.TryParse(Row.TextNumber,\
  \ out result);\nif (isNumeric)\n{\n    Row.isNumeric = isNumeric;\n    rownumber++;\n\
  \    Row.RowNumber = rownumber;\n}\n```\n\n如果使用 VB.NET，请编写以下代码：\n\n```\nDim result\
  \ As Integer\nDim isNumeric As Boolean = Int32.TryParse(Row.TextNumber, result)\n\
  If isNumeric Then\n        Row.isNumeric = isNumeric\n        rownumber += 1\n \
  \       Row.RowNumber = rownumber\nEnd If\n```\n\n运行包时，你可以看到所有数值行都添加了连续的行号。所有非数值行的\
  \ `RowNumber` 列值均为 0。结果如图 11-12 所示。\n\n![A978-1-4842-0638-6_11_Fig12_HTML.jpg](img/A978-1-4842-0638-6_11_Fig12_HTML.jpg)\n\
  \n图 11-12. `RowNumber` 附加到数值行\n\n脚本组件再次帮你完成了对数据执行的、非直接或 SSIS 中不可用的任务。\n\n### 创建\
  \ GUID\n\nSSIS 中没有内置函数或表达式可用于创建新的 GUID。如果你已有以字符串形式存储的 GUID，则可以在派生列中使用强制转换将其转换为真正的\
  \ GUID 数据类型；或者，如果你有 SQL Server 数据源，则可以在源查询中使用 `NEWID()` 函数。\n\n就像上一个创建 `RowNumber`\
  \ 的示例一样，你可以使用 .NET 中的脚本组件通过一行代码创建一个 GUID。\n\n#### 创建包\n\n首先创建一个新的 SSIS 包，并在界面上添加一个数据流。在此数据流中，添加一个指向先前示例中文件的平面文件源连接，如图\
  \ 11-13 所示。\n\n![A978-1-4842-0638-6_11_Fig13_HTML.jpg](img/A978-1-4842-0638-6_11_Fig13_HTML.jpg)\n\
  \n图 11-13. 平面文件连接管理器配置\n\n#### 添加脚本组件\n\n在源之后添加一个脚本组件，并将脚本类型选择为“转换”。将其连接到其他组件，并命名为\
  \ `SCR_CreateGUID`。在“输入和输出”页面，转到“输出 0”，选择“输出列”，然后添加一个名为 `RowGUID` 的新列。将其类型更改为 `DT_GUID`（唯一标识符），如图\
  \ 11-14 所示。\n\n![A978-1-4842-0638-6_11_Fig14_HTML.jpg](img/A978-1-4842-0638-6_11_Fig14_HTML.jpg)\n\
  \n图 11-14. 添加新输出列\n\n在组件的“脚本”页面，点击“编辑脚本...”。在 VSTA 编辑器中，移除你不需要的 `PreExecute` 和 `PostExecute`\
  \ 方法。在 `Input0_ProcessInputRow` 方法中，添加一行 C# 代码来创建一个随机 GUID 并将其赋值给你之前创建的列。\n\n```\n\
  \  //创建并分配一个 GUID\n        Row.RowGUID = Guid.NewGuid();\n```\n\n在 VB.NET 中，代码如下：\n\
  \n```\n    ' 使用 SSIS 创建全局唯一标识符\n    Row.Guid2 = System.Guid.NewGuid()\n```\n\n####\
  \ 结果\n\n关闭 VSTA 编辑器和脚本转换编辑器。向数据流添加一个多播，并将其连接到脚本组件。如果添加数据查看器（右键单击脚本组件和多播之间的连接），你应该会看到如图\
  \ 11-15 所示的结果。由于 GUID 是全局唯一的，每次运行生成的 GUID 都应不同。\n\n![A978-1-4842-0638-6_11_Fig15_HTML.jpg](img/A978-1-4842-0638-6_11_Fig15_HTML.jpg)\n\
  \n图 11-15. 新添加的 GUID 列\n\n\n\n### 条件多播\n\n处理 SSIS 包中的事实表时，你可能需要处理空值。此外，一个需求可能是出于审计目的记录空值行。使用内置组件可以实现这一点，但这非常繁琐，因为它涉及条件拆分、多个多播和一个\
  \ Union All 组件。\n\n此时，脚本组件具备多个输出的功能就非常实用了。这种方法有两个好处。第一个好处是，你可以比使用大量条件转换更优雅地处理复杂的\
  \ `if` 语句；在一个脚本中处理所有条件比多个 SSIS 条件表达式更具可读性。第二个好处是，单行数据可以被重定向到多个输出，无需使用多播。\n\n在以下示例中，你将遍历表的所有行，并将其中一些行重定向到输出以用于审计，因为某些列的值是错误的（你也可以检查值是否超过阈值、质量不佳，或任何其他想保存特定数据行的特殊原因；但这不属于此示例的内容）。\n\
  \n#### 数据源\n\n对于数据源，你使用之前用过的第 11 章 数据。此表中包含一些员工的收入信息。由于公司今年业绩非常好，管理层决定将所有员工的收入提高\
  \ 20%，同时指出所有年收入低于 20 万美元的员工。\n\n首先，向一个空白包中添加一个数据流。在此数据流中，添加一个 OLE DB 源，连接到书籍代码中的\
  \ chapter 11 表。\n\n注意\n\n此示例的完整代码可在本书网站上获取。\n\n选择表中所有可用的列。\n\n#### 脚本\n\n添加一个脚本组件，并在“脚本类型”对话框中选择“转换”。将组件重命名为\
  \ `SCR_EnsureIncomeRaise`，并将数据源的输出连接到其输入。\n\n在脚本组件的“输入列”页面上，选择 `YearlyIncome` 作为只读输入列。\n\
  \n在脚本组件的“输入和输出”页面上，将第一个输出重命名为 `GiveARaise`，并添加第二个名为 `LessThan200K` 的输出。\n\n还需要执行几个步骤来确保输出按预期工作。首先，你需要将两个输出的\
  \ `ExclusionGroup` 属性都更改为 1（或其他非零值）。\n\n默认情况下，所有输入行都被定向到所有可用输出，除非你指明要将每一行重定向到某个特定输出。这是通过为输出的\
  \ `ExclusionGroup` 属性指定一个非零值来实现的。该整数值具体是多少并不重要，但对于所有指定的输出组，该值必须相同。\n\n配置如图 11-16\
  \ 所示。\n\n![A978-1-4842-0638-6_11_Fig16_HTML.jpg](img/A978-1-4842-0638-6_11_Fig16_HTML.jpg)\n\
  \n图 11-16. 输出配置\n\n以下是该配置的详细说明：\n\n- `ExclusionGroup` 设置为 1，并且对于所有输出，该值必须相同。\n-\
  \ 将 `SynchronousOuputID` 设置为 0（无）会创建异步输出，其中输出行与输入行没有任何关系，从而创建新的内存缓冲区并将值复制到其中。由于并非输出缓冲区中的所有行都会进入此输出，这使得我们可以实现条件重定向。\n\
  \n设置完成后，通过单击“脚本”页面上的 **Edit Script...** 打开脚本编辑器。移除 `PreExecute` 和 `PostExecute`\
  \ 方法。然后输入以下 C# 代码：\n\n```\n在脚本的 Input0_ProcessInputRow 方法中添加以下几行代码：\n\nif (Row.YearlyIncome\
  \ < 200000)\n{\n    Row.DirectRowToLessThan200K();\n}\n    Row.DirectRowToGiveARaise();\n\
  ```\n\n或者以下 VB.NET 代码：\n\n```\nIf Row.YearlyIncome < 200000 Then\n        Row.DirectRowToLessThan200K()\n\
  End If\n\nRow.DirectRowToGiveARaise()\n```\n\n指示脚本仅将 `YearlyIncome` 小于 20 万的行用于一个输出，而将所有行用于另一个输出。如你所见，该逻辑非常易于实现，并且比使用\
  \ SSIS 条件拆分更具可读性。\n\n关闭脚本组件，并向数据流中添加一个派生列 `DER_GiveARaise`。该派生列用于将 `YearlyIncome`\
  \ 提高（并替换）20%。配置如图 11-17 所示。\n\n![A978-1-4842-0638-6_11_Fig17_HTML.jpg](img/A978-1-4842-0638-6_11_Fig17_HTML.jpg)\n\
  \n图 11-17. 使用派生列提高 20%\n\n将派生列的输入连接到脚本组件的 `GiveARaise` 输出。\n\n完成后，向派生列的输出添加一个多播，并向脚本组件的\
  \ `LessThan200K` 输出添加另一个多播。通过向多播连接添加数据查看器，你可以看到 `YearlyIncome` 符合脚本组件中条件的行，以及收入提高后的行。\n\
  \n图 11-18 显示了收入提高后的数据查看器。\n\n![A978-1-4842-0638-6_11_Fig18_HTML.jpg](img/A978-1-4842-0638-6_11_Fig18_HTML.jpg)\n\
  \n图 11-18. 所有收入提高 20%\n\n### 总结\n\n在本章中，你看到了几个示例，说明脚本组件可以执行 SSIS 中原本无法完成的任务。你还看到了脚本组件比内置任务更灵活、更易于使用和理解的示例。\n\
  \n"
- "# 脚本组件作为目标\n\n电子补充材料 本章的在线版本 (doi:[10.1007/978-1-4842-0638-6_12](http://dx.doi.org/10.1007/978-1-4842-0638-6_12))\
  \ 包含补充材料，仅供授权用户使用。\n\n本章重点介绍脚本组件作为目标。虽然有很多现成的目标可用，但有时你需要一些特殊的目标——例如包含额外页眉和页脚的自定义平面文件、跨多行的记录，以及\
  \ XML 目标。\n\n但在将脚本组件用作目标时请务必小心。由于记录是逐行处理的，因此，通过存储过程调用或大量单条查询命令将大量数据插入数据库可能不是个好主意。启用快速加载的\
  \ OLE DB 目标可能快得多；如果你确实需要存储过程调用，那么 OLE DB 命令更易于理解和维护。但对于自定义文本文件，脚本组件作为目标非常有用。Web\
  \ 服务对于脚本组件目标也有实际用途。第 15 章 中提供了一些 Web 服务示例。\n\n### 带页眉和页脚的基本平面文件目标\n\n第一个示例是一个基本的平面文件目标。它与常规平面文件目标非常相似，但增加了额外的页眉和页脚。你可以轻松地根据自身需求扩展此示例。\n\
  \n#### 创建文件连接管理器\n\n由于你不想在脚本中对平面文件的路径进行硬编码，因此将使用文件连接管理器。创建一个指向现有或不存在的文件的文件连接管理器。示例请参见图\
  \ 12-1。\n\n![A978-1-4842-0638-6_12_Fig1_HTML.jpg](img/A978-1-4842-0638-6_12_Fig1_HTML.jpg)\n\
  \n图 12-1. 指向 CSV 文件的文件连接管理器\n\n\n\n#### 数据源\n\n在本示例中，你将使用第 10 章的随机测试数据作为数据源。你可以使用入门包，也可以使用自己的数据作为数据源。以下是输出的列：\n\
  \n-   `FirstName`（`DT_STR`，1252，50）\n-   `LastName`（`DT_STR`，1252，50）\n-   `EmployeeId`（`DT_I4`）\n\
  -   `DateOfBirth`（`DT_DATE`）\n-   `Salary`（`DT_NUMERIC`，6，2）\n-   `Gender`（`DT_STR`，1252，1）\n\
  \n图 12-2 展示了本章示例的随机数据源入门包。\n\n![A978-1-4842-0638-6_12_Fig2_HTML.jpg](img/A978-1-4842-0638-6_12_Fig2_HTML.jpg)\n\
  \n图 12-2. 随机数据源入门包\n\n#### 脚本组件\n\n将一个脚本组件拖到数据流的设计界面上，然后选择`Destination`（目标）类型，如图\
  \ 12-3 所示。为其指定一个合适的名称，并将其连接到数据流中的最后一个转换。\n\n![A978-1-4842-0638-6_12_Fig3_HTML.jpg](img/A978-1-4842-0638-6_12_Fig3_HTML.jpg)\n\
  \n图 12-3. 脚本组件类型：目标\n\n#### 添加入站列\n\n编辑脚本组件，转到`Input Columns`（入站列）页面。选择`.csv`文件中需要的所有列，如图\
  \ 12-4 所示。以数字或标点符号开头的列应在`Output Alias`（输出别名）列中进行重命名，因为这些列会在脚本代码中被移除。\n\n![A978-1-4842-0638-6_12_Fig4_HTML.jpg](img/A978-1-4842-0638-6_12_Fig4_HTML.jpg)\n\
  \n图 12-4. 选择所需的入站列\n\n以下是入站列：\n\n-   `FirstName`\n-   `LastName`\n-   `EmployeeId`\n\
  -   `DateOfBirth`\n-   `Salary`\n-   `Gender`\n\n#### 选择连接管理器\n\n转到`Connection Manager`（连接管理器）页面，选择新创建的文件连接管理器。如图\
  \ 12-5 所示添加后，将其命名为`myFile`。你也可以通过下拉列表添加一个新的连接管理器。\n\n![A978-1-4842-0638-6_12_Fig5_HTML.jpg](img/A978-1-4842-0638-6_12_Fig5_HTML.jpg)\n\
  \n图 12-5. 添加连接管理器\n\n#### 代码\n\n现在，你可以回到`Script`（脚本）页面，点击`Edit Script...`（编辑脚本...）按钮打开\
  \ VSTA 环境。首先，你需要添加一个额外的命名空间来简化代码。\n\n```\n#region CustomNamespace\nusing System.IO;\n\
  #endregion\n```\n\n这是 VB.NET 代码：\n\n```\n#Region \"CustomNamespace\"\nImports System.IO\n\
  #End Region\n```\n\n接下来，你需要几个类变量来存储 CSV 数据和页脚信息。\n\n```csharp\n// 指向 CSV 文件的流\n\
  private StreamWriter textWriter;\n\n// 用于定义列分隔符的字符串变量\nprivate string ColumnDelimiter\
  \ = \";\";\n\n// 用于跟踪行数的计数器\nprivate int TotalRows = 0;\n\n// 用于统计总薪水的十进制变量\nprivate\
  \ decimal TotalSalary = 0;\n```\n\n以下是 VB.NET 代码：\n\n```vbnet\n' 指向 CSV 文件的流\nPrivate\
  \ textWriter As StreamWriter\n\n' 用于定义列分隔符的字符串变量\nPrivate ColumnDelimiter As String\
  \ = \";\"\n\n' 用于跟踪行数的计数器\nPrivate TotalRows As Integer = 0\n\n' 用于统计总薪水的十进制变量\n\
  Private TotalSalary As Decimal = 0\n```\n\n在`PreExecute`方法中，你要打开流并开始写入标头。但此时还不能写入总计、计数或求和信息，因为还没有得到相关数据。\n\
  \n```csharp\npublic override void PreExecute()\n{\n    // 创建一个新的 CSV 文件，并使用\n  \
  \  // 连接管理器中的文件路径\n    textWriter = new StreamWriter(\n        this.Connections.myFile.AcquireConnection(null).ToString());\n\
  \n    // 写入包含当前日期的标头\n    textWriter.WriteLine(\"ExportDate: \" + DateTime.Now.ToShortDateString());\n\
  \n    // 写入包含列名的标头\n    textWriter.Write(\"EmployeeId\" + ColumnDelimiter);\n  \
  \  textWriter.Write(\"FirstName\" + ColumnDelimiter);\n    textWriter.Write(\"LastName\"\
  \ + ColumnDelimiter);\n    textWriter.Write(\"DateOfBirth\" + ColumnDelimiter);\n\
  \    textWriter.Write(\"Gender\" + ColumnDelimiter);\n    textWriter.WriteLine(\"\
  Salary\");\n}\n```\n\n这是 VB.NET 代码：\n\n```vbnet\nPublic Overrides Sub PreExecute()\n\
  \n    ' 创建一个新的 CSV 文件，并使用\n    ' 连接管理器中的文件路径\n    textWriter = New StreamWriter(\
  \ _\n        Me.Connections.myFile.AcquireConnection(Nothing).ToString())\n\n  \
  \  ' 写入包含当前日期的标头\n    textWriter.WriteLine(\"ExportDate: \" + DateTime.Now.ToShortDateString())\n\
  \n    ' 写入包含列名的标头\n    textWriter.Write(Convert.ToString(\"EmployeeId\") & ColumnDelimiter)\n\
  \    textWriter.Write(Convert.ToString(\"FirstName\") & ColumnDelimiter)\n    textWriter.Write(Convert.ToString(\"\
  LastName\") & ColumnDelimiter)\n    textWriter.Write(Convert.ToString(\"DateOfBirth\"\
  ) & ColumnDelimiter)\n    textWriter.Write(Convert.ToString(\"Gender\") & ColumnDelimiter)\n\
  \    textWriter.WriteLine(\"Salary\")\n\nEnd Sub\n```\n\n在`PostExecute`方法中，你需要添加页脚并关闭`.csv`文件。在脚本的这个阶段，你可以使用总计和求和值，因为`Input0_ProcessInputRow`方法已经计算出了这些值。\n\
  \n```csharp\npublic override void PostExecute()\n{\n    // 添加页脚\n    textWriter.WriteLine(\"\
  Rows: \" + TotalRows.ToString());\n    textWriter.WriteLine(\"Total Salary: \" +\
  \ TotalSalary.ToString());\n\n    // 关闭文件\n    textWriter.Close();\n}\n```\n\n以下是\
  \ VB.NET 代码：\n\n```vbnet\nPublic Overrides Sub PostExecute()\n\n    ' 添加页脚\n   \
  \ textWriter.WriteLine(\"Rows: \" + TotalRows.ToString())\n    textWriter.WriteLine(\"\
  Total Salary: \" + TotalSalary.ToString())\n\n    ' 关闭文件\n    textWriter.Close()\n\
  \nEnd Sub\n```\n\n在`Input0_ProcessInputRow`方法中，你需要处理所有记录。每个列值与列分隔符组合，被写入到`.csv`文件中。最后一列使用`WriteLine`而非`Write`来添加行分隔符。在这里，你也可以计算可在页脚中使用的项目。\n\
  \n```csharp\npublic override void Input0_ProcessInputRow(Input0Buffer Row)\n{\n\
  \    // 使用列分隔符写入列值\n    textWriter.Write(Row.EmployeeId.ToString() + ColumnDelimiter);\n\
  \    textWriter.Write(Row.FirstName.ToString() + ColumnDelimiter);\n    textWriter.Write(Row.LastName.ToString()\
  \ + ColumnDelimiter);\n    textWriter.Write(Row.DateOfBirth.ToShortDateString()\
  \ + ColumnDelimiter);\n    textWriter.Write(Row.Gender.ToString() + ColumnDelimiter);\n\
  \n    // 对最后一列使用 WriteLine 作为行分隔符\n    textWriter.WriteLine(Row.Salary.ToString());\n\
  \n    // 用于页脚的计算\n    TotalRows++;\n    TotalSalary = TotalSalary + Row.Salary;\n\
  }\n```\n\n这是 VB.NET 代码：\n\n```vbnet\nPublic Overrides Sub Input0_ProcessInputRow(ByVal\
  \ Row As Input0Buffer)\n\n    ' 使用列分隔符写入列值\n    textWriter.Write(Row.EmployeeId.ToString()\
  \ & ColumnDelimiter)\n    textWriter.Write(Row.FirstName.ToString() & ColumnDelimiter)\n\
  \    textWriter.Write(Row.LastName.ToString() & ColumnDelimiter)\n    textWriter.Write(Row.DateOfBirth.ToShortDateString()\
  \ & ColumnDelimiter)\n    textWriter.Write(Row.Gender.ToString() & ColumnDelimiter)\n\
  \n    ' 对最后一列使用 WriteLine 作为行分隔符\n    textWriter.WriteLine(Row.Salary.ToString())\n\
  \n    ' 用于页脚的计算\n    TotalRows += 1\n    TotalSalary = TotalSalary + Row.Salary\n\
  \nEnd Sub\n```\n\n#### 结果\n\n现在运行包并检查平面文件的结果。请注意，这是一个非常基础的示例，但非常容易根据你的需求进行扩展。图 12-6\
  \ 展示了本章示例的结果。\n\n![A978-1-4842-0638-6_12_Fig6_HTML.jpg](img/A978-1-4842-0638-6_12_Fig6_HTML.jpg)\n\
  \n图 12-6. 文本文件的一部分\n\n\n\n### 基本 XML 目标\n\n遗憾的是，目前仍没有现成的 XML 文件目标可用。如果你的源是 SQL Server\
  \ 表，则可以在 OLE DB 源组件中使用 `FOR XML` 查询，然后将结果写入无标题的平面文件目标。如果你使用不同的源或进行了大量转换，则 `FOR XML`\
  \ 查询不再适用。此时，脚本组件可以帮你解决问题。\n\n#### 创建文件连接管理器\n\n由于你不希望在脚本中对 XML 文件的路径进行硬编码，因此将使用文件连接管理器。创建一个指向现有或非现有文件的文件连接管理器。图\
  \ 12-7 显示了一个示例。\n\n![A978-1-4842-0638-6_12_Fig7_HTML.jpg](img/A978-1-4842-0638-6_12_Fig7_HTML.jpg)\n\
  \n图 12-7. 指向 XML 文件的文件连接管理器\n\n#### 源\n\n在此示例中，你使用的是之前平面文件目标示例中的随机测试数据，这些数据来自第 10\
  \ 章。以下是输出列：\n\n- `FirstName` (`DT_STR`, 1252, 50)\n- `LastName` (`DT_STR`, 1252,\
  \ 50)\n- `EmployeeId` (`DT_I4`)\n- `DateOfBirth` (`DT_DATE`)\n- `Salary` (`DT_NUMERIC`,\
  \ 6, 2)\n- `Gender` (`DT_STR`, 1252, 1)\n\n#### 脚本组件\n\n将一个“脚本组件”拖到数据流的设计图面上，然后选择“目标”作为类型，如图\
  \ 12-8 所示。为其指定一个合适的名称，并将其连接到数据流中的最后一个转换。\n\n![A978-1-4842-0638-6_12_Fig8_HTML.jpg](img/A978-1-4842-0638-6_12_Fig8_HTML.jpg)\n\
  \n图 12-8. 脚本组件类型：目标\n\n#### 输入列\n\n编辑脚本组件并转到“输入列”页面。选择 XML 中需要的所有列，如图 12-9 所示。以数字或标点符号开头的列应在“输出别名”列中重命名，因为这些列会在脚本代码中被移除。\n\
  \n![A978-1-4842-0638-6_12_Fig9_HTML.jpg](img/A978-1-4842-0638-6_12_Fig9_HTML.jpg)\n\
  \n图 12-9. 选择所需的输入列\n\n以下是输入列：\n\n- `FirstName`\n- `LastName`\n- `EmployeeId`\n-\
  \ `DateOfBirth`\n- `Salary`\n- `Gender`\n\n#### 选择连接管理器\n\n转到“连接管理器”页面并选择新创建的文件连接管理器。添加后（如图\
  \ 12-10 所示），将其命名为 `xmlFile`。你也可以通过下拉列表添加新的连接管理器。\n\n![A978-1-4842-0638-6_12_Fig10_HTML.jpg](img/A978-1-4842-0638-6_12_Fig10_HTML.jpg)\n\
  \n图 12-10. 添加连接管理器\n\n#### 代码\n\n现在，你可以回到“脚本”页面，单击“编辑脚本...”按钮打开 VSTA 环境。首先，你需要添加一个额外的命名空间以简化代码。\n\
  \n```csharp\n#region CustomNamespace\n\nusing System.Xml;\n\n#endregion\n```\n\n\
  以下是 VB.NET 代码：\n\n```vbnet\n#Region \"CustomNamespace\"\n\nImports System.Xml\n\n\
  #End Region\n```\n\n接下来，你需要一个用于存储 XML 数据的类变量。在此示例中，你使用 `XmlTextWriter` 命名空间。\n\n\
  ```csharp\n// XmlTextWriter (stream) object to write the XML\nXmlTextWriter textWriter;\n\
  ```\n\n这是 VB.NET 代码：\n\n```vbnet\n' File stream object to write the XML\nPrivate\
  \ xmlFile As StreamWriter\n```\n\n在 `PreExecute` 方法中，你打开流并开始写入 XML 结构的开始标签。\n\n\
  ```csharp\npublic override void PreExecute()\n{\n    // Create a new XML document\
  \ and use the\n    // filepath in the connection as XML-file\n    textWriter = new\
  \ XmlTextWriter(this.Connections.\n    xmlFile.AcquireConnection(null).ToString(),\
  \ null);\n    // Start writing the XML document:\n    textWriter.WriteStartDocument();\n\
  \    // Create root element <Employees>\n    textWriter.WriteStartElement(\"Employees\"\
  );\n}\n```\n\n以下是 VB.NET 代码：\n\n```vbnet\nPublic Overrides Sub PreExecute()\n  \
  \  ' Create a new XML document and use the\n    ' filepath in the connection as\
  \ XML-file\n    textWriter = New XmlTextWriter(Me.Connections. _\n    xmlFile.AcquireConnection(Nothing).ToString(),\
  \ _\n    System.Text.Encoding.Default)\n    ' Start writing the XML document:\n\
  \    textWriter.WriteStartDocument()\n    ' Create root element <Employees>\n  \
  \  textWriter.WriteStartElement(\"Employees\")\nEnd Sub\n```\n\n在 `PostExecute`\
  \ 方法中，你关闭 XML 标签并清理资源。\n\n```csharp\npublic override void PostExecute()\n{\n   \
  \ // Close root element: </Employees>\n    textWriter.WriteEndElement();\n    //\
  \ Stop writing the XML document\n    textWriter.WriteEndDocument();\n    // Close\
  \ document and clean up resources\n    textWriter.Close();\n}\n```\n\n这是 VB.NET\
  \ 代码：\n\n```vbnet\nPublic Overrides Sub PostExecute()\n    'Close root element:\
  \ </Employees>\n    textWriter.WriteEndElement()\n    'Stop writing the XML document\n\
  \    textWriter.WriteEndDocument()\n    'Close document and clean up resources\n\
  \    textWriter.Close()\nEnd Sub\n```\n\n在 `Input0_ProcessInputRow` 方法中，你处理所有记录。每个列都作为\
  \ Employee 的一个元素提及，但 ID 列作为 Employee 的一个属性使用。\n\n```csharp\npublic override void\
  \ Input0_ProcessInputRow(Input0Buffer Row)\n{\n    // Opening tag employee with\
  \ ID as attribute\n    textWriter.WriteStartElement(\"Employee\");\n    textWriter.WriteStartAttribute(\"\
  id\");\n    textWriter.WriteString(Row.EmployeeId.ToString());\n    textWriter.WriteEndAttribute();\n\
  \    // Writing elements within the Employee tag\n    textWriter.WriteStartElement(\"\
  FirstName\");\n    textWriter.WriteString(Row.FirstName.ToString());\n    textWriter.WriteEndElement();\n\
  \    textWriter.WriteStartElement(\"LastName\");\n    textWriter.WriteString(Row.LastName.ToString());\n\
  \    textWriter.WriteEndElement();\n    textWriter.WriteStartElement(\"DateOfBirth\"\
  );\n    textWriter.WriteString(Row.DateOfBirth.ToShortDateString());\n    textWriter.WriteEndElement();\n\
  \    textWriter.WriteStartElement(\"Gender\");\n    textWriter.WriteString(Row.Gender.ToString());\n\
  \    textWriter.WriteEndElement();\n    textWriter.WriteStartElement(\"Salary\"\
  );\n    textWriter.WriteString(Row.Salary.ToString());\n    textWriter.WriteEndElement();\n\
  \    // Closing tag employee\n    textWriter.WriteEndElement();\n}\n```\n\n这是 VB.NET\
  \ 代码：\n\n```vbnet\nPublic Overrides Sub Input0_ProcessInputRow(ByVal Row As Input0Buffer)\n\
  \    ' Write opening tag for row with id property\n    xmlFile.WriteLine(\"<Employee\
  \ id=\"\"\" & Row.EmployeeId.ToString() & \"\"\">\")\n    ' Extra columns\n    xmlFile.WriteLine(\"\
  <FirstName>\" & Row.FirstName.ToString() _\n    & \"</FirstName>\")\n    xmlFile.WriteLine(\"\
  <LastName>\" & Row.LastName.ToString() & \"</LastName>\")\n    xmlFile.WriteLine(\"\
  <DateOfBirth>\" & Row.DateOfBirth.ToShortDateString() _\n    & \"</DateOfBirth>\"\
  )\n    xmlFile.WriteLine(\"<Gender>\" & Row.Gender.ToString() & \"</Gender>\")\n\
  \    xmlFile.WriteLine(\"<Salary>\" & Row.Salary.ToString() & \"</Salary>\")\n \
  \   ' Closing tag for row\n    xmlFile.WriteLine(\"</Employee>\")\nEnd Sub\n```\n\
  \n#### 结果\n\n现在运行包并检查 XML 文件的结果。（图 12-11 显示了我们的结果）。这是一个非常基础的示例，没有错误处理，也没有转义像 `<`\
  \ 和 `>` 这样的受限字符。并且，如果列很多，可能会非常耗时。第 14 章 展示了一个更灵活的示例，它会遍历列集合。\n\n![A978-1-4842-0638-6_12_Fig11_HTML.jpg](img/A978-1-4842-0638-6_12_Fig11_HTML.jpg)\n\
  \n图 12-11. 在 Internet Explorer 中查看的 XML 文件\n\n### 总结\n\n在本章中，你学习了如何使用脚本组件创建自己的文本文件（`.csv`\
  \ 和 `.xml`）。虽然非常基础，但易于扩展。如果列很多，这两种方法可能都比较耗时，但在第 14 章中，你将学习如何使用反射来遍历所有列。\n\n\n\n"
- "# 13. 正则表达式\n\n电子补充材料 本章的在线版本（doi:[10.​1007/​978-1-4842-0638-6_​13](http://dx.doi.org/10.1007/978-1-4842-0638-6_13)）包含补充材料，供授权用户使用。\n\
  \n许多 ETL 应用程序和流程通常处理字符串或需要解析大量文本；你常会遇到需要从文本块中剥离某些元素，或验证电子邮件地址格式是否有效的情况。\n\n正则表达式提供了一种灵活、强大且高效的处理文本的方法。正则表达式模式匹配引擎使你能够：\n\
  \n- 解析大量文本以查找特定的字符模式\n- 验证文本以确保其符合预定义模式\n- 提取、编辑或删除文本子串，并将这些子串添加到集合中以生成报告\n\n正则表达式的核心是其引擎，在.NET\
  \ Framework 中由`System.Text.RegularExpression.Regex`对象表示。\n\n使用正则表达式处理文本要求正则表达式引擎至少有两个参数：\n\
  \n- 要在文本中查找的正则表达式模式\n- 用于解析正则表达式模式的文本\n\n关于正则表达式对象模型的更多信息，请参阅 MSDN 上的[`https://msdn.microsoft.com/en-us/library/30wbz966(v=vs.110).aspx`](https://msdn.microsoft.com/en-us/library/30wbz966(v=vs.110).aspx)。\n\
  \n如前所述，正则表达式是引擎尝试匹配的模式。一个模式由以下三个部分中的一个或多个组成：\n\n- 字符文本\n- 运算符\n- 构造\n\n正则表达式语法的完整列表，包括字符转义、字符类、定位点、分组构造、限定符、反向引用构造、替换构造、替换、正则表达式选项和其他构造，可在\
  \ MSDN 上参考：[`https://msdn.microsoft.com/en-us/library/az24scfc(v=vs.110).aspx`](https://msdn.microsoft.com/en-us/library/az24scfc(v=vs.110).aspx)。\n\
  \n以下是一些寻找正则表达式示例和资源的优秀网站列表：\n\n- [`http://www.regexr.com`](http://www.regexr.com/)\n\
  - [`http://www.regular-expressions.info/`](http://www.regular-expressions.info/)\n\
  - [`http://rubular.com`](http://rubular.com)\n- [`http://regexone.com`](http://regexone.com)\n\
  \n`Regex`类提供了执行前面所述操作的方法。\n\n- `IsMatch`方法用于确定正则表达式是否出现在输入文本中；例如，验证电子邮件地址格式是否正确时使用。\n\
  - `Match`或`Matches`方法用于检索一个对象或对象集合，其中包含所有匹配正则表达式模式的文本出现。\n- `Replace`方法用于替换匹配正则表达式模式的文本。\n\
  \n本章将通过三个示例，演示如何解析、验证以及提取子串。\n\n### 先决条件\n\n本章所有示例均基于示例文件`ProductList.csv`，该文件可在本章的源代码中找到。\n\
  \n以下是用于存储信息的六列：\n\n- 产品 ID\n- 产品名称，即产品的名称\n- 创建日期\n- 产品生产国家\n- 产品负责人的电子邮件地址（包含一些格式错误）\n\
  - 产品的 HTML 描述（HTML 描述取自维基百科）\n\n图 13-1 是在 Excel 中打开的`.csv`文件的部分截图。\n\n![A978-1-4842-0638-6_13_Fig1_HTML.jpg](img/A978-1-4842-0638-6_13_Fig1_HTML.jpg)\n\
  \n图 13-1. 产品列表.csv 文档\n\n### 验证电子邮件地址\n\n正则表达式在处理数据时的一个重要应用是确保更高的数据质量。根据国际数据公司（IDC）的估计，数据质量差每年给企业造成\
  \ 65 亿美元的损失。无效的电子邮件地址是一种可以通过正则表达式捕捉到的错误类型。\n\n首先创建一个新的包，并在设计界面上添加一个数据流任务。在数据流任务内部，添加一个平面文件源和一个指向之前提到的`.csv`文档（`ProductList.csv`，位于本章源代码中）的新平面文件连接管理器。将“常规”页面的所有设置保留为默认值，如图\
  \ 13-2 所示。\n\n![A978-1-4842-0638-6_13_Fig2_HTML.jpg](img/A978-1-4842-0638-6_13_Fig2_HTML.jpg)\n\
  \n图 13-2. 平面文件连接管理器编辑器\n\n访问“列”页面，确保已获取元数据并且列被正确解析。\n\n在平面文件连接管理器的“高级”页面中，更改“摘要”列的长度，因为如果数据长度超过\
  \ 50 个字符，将会发生截断，从而在运行包时触发错误。将数据类型更改为宽度为 4000 的字符串`DT_STR`，如图 13-3 所示。该宽度应足够大，以防止截断发生。\n\
  \n![A978-1-4842-0638-6_13_Fig3_HTML.jpg](img/A978-1-4842-0638-6_13_Fig3_HTML.jpg)\n\
  \n图 13-3. 更改数据类型\n\n在数据流设计界面上添加一个用于转换的脚本组件，名为`SCR_ValidateEmail`，并在其与之前创建的平面文件源之间添加一条数据流路径。配置“输入列”页面，以只读模式接受来自平面文件源的所有可用列，如图\
  \ 13-4 所示。在此示例中，你仅使用电子邮件列，因此最佳实践是只获取所需的列，但由于你将在其他示例中使用其他一些列，这里将获取所有可用列。\n\n![A978-1-4842-0638-6_13_Fig4_HTML.jpg](img/A978-1-4842-0638-6_13_Fig4_HTML.jpg)\n\
  \n图 13-4. 脚本任务转换编辑器的输入页面\n\n在编辑器的“输入和输出”页面上，你基本上需要两个输出：`ValidEmail`和`InvalidEmail`。第一个用于有效的电子邮件地址，第二个用于无效的电子邮件地址。首先将输出\
  \ 0 重命名为`ValidEmail`。对于这两个输出，你需要将`ExclusionGroup`设置为 1，将`SynchronousInputID`设置为输入\
  \ 0（因为每个输入对应一个输出）。输出 1 重命名为`InvalidEmail`。这两个输出如图 13-5 所示。\n\n![A978-1-4842-0638-6_13_Fig5_HTML.jpg](img/A978-1-4842-0638-6_13_Fig5_HTML.jpg)\n\
  \n图 13-5. 输出列\n\n\n\n#### 脚本\n\n在脚本页面上点击“编辑脚本...”按钮，即可打开 VSTA 编辑器；你可以开始添加代码来执行验证，以保留行数据。首先，你可以安全地删除\
  \ `PreExecute` 和 `PostExecute` 方法，因为你不需要它们。然后，你需要添加对正则表达式命名空间的引用。\n\n```\n#region\
  \ CustomNamespace\nusing System.Text.RegularExpressions;\n#endregion\n```\n\n通过将所有验证步骤封装在函数中，可以保持接口的简洁。你实现的第一个函数用于验证给定的电子邮件地址。\n\
  \n以下是 C# 实现：\n\n```\n// 一个布尔方法，用于根据正则表达式模式验证电子邮件地址\npublic bool IsCorrectEmail(String\
  \ emailAddress)\n{\n     // 电子邮件模式\n     string emailAddressPattern = @\"^(([^<>()[\\\
  ]\\\\.,;:\\s@\\\"\"]+\"\n                             + @\"(\\.[^<>()[\\]\\\\.,;:\\\
  s@\\\"\"]+)*)|(\\\"\".+\\\"\"))@\"\n                             + @\"((\\[[0-9]{1,3}\\\
  .[0-9]{1,3}\\.[0-9]{1,3}\"\n                             + @\"\\.[0-9]{1,3}\\])|(([a-zA-Z\\\
  -0-9]+\\.)+\"\n                             + @\"[a-zA-Z]{2,}))$\";\n     // 检查是否匹配并返回该值（布尔值）\n\
  \     return Regex.IsMatch(emailAddress,emailAddressPattern,RegexOptions.IgnoreCase);\n\
  }\n```\n\n以下是 VB.NET 实现：\n\n```\n' 一个布尔方法，用于根据正则表达式模式验证电子邮件地址\nPublic Function IsCorrectEmail(emailAddress\
  \ As [String]) As Boolean\n' 电子邮件模式\nDim emailAddressPattern As String = \"^(([^<>()[\\\
  ]\\\\.,;:\\s@\\\"\"]+\" + _\n        \"(\\.[^<>()[\\]\\\\.,;:\\s@\\\"\"]+)*)|(\\\
  \"\".+\\\"\"))@\" + _\n        \"((\\[[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\" + _\n\
  \        \"\\.[0-9]{1,3}\\])|(([a-zA-Z\\-0-9]+\\.)+\" + _\n        \"[a-zA-Z]{2,}))$\"\
  \n' 检查是否匹配并返回该值（布尔值）\nReturn Regex.IsMatch(emailAddress, emailAddressPattern, RegexOptions.IgnoreCase)\n\
  End Function\n```\n\n这个模式并非十分复杂，但它能够根据电子邮件地址的标准定义，匹配大多数有效的电子邮件地址。请注意，该模式不能判断电子邮件地址是否存在，只能判断其格式是否有效。此外，该模式也不会检查顶级域名是否是一个已存在的域名。\n\
  \n> **注意：** 模式可能会变得非常复杂，特别是如果你之前从未接触过正则表达式。对于验证电子邮件地址，有一种更简单的方法——使用 `System.Net.Mail.MailAddress`\
  \ 类。要判断电子邮件地址是否有效，可以将该地址传递给 `MailAddress.MailAddress(String)` 类构造方法。我们强烈建议你查阅互联网上可用的正则表达式资源和示例。\n\
  \n#### 调用方法\n\n添加方法后，你需要对脚本中处理的每一行包含电子邮件地址的数据调用该方法。如果方法返回 `true`，则电子邮件有效，并将其定向到\
  \ `ValidEmail` 输出；否则，电子邮件无效，需要将其定向到 `InvalidEmail` 输出。\n\n以下是在 C# 中调用该方法的方式：\n\n\
  ```\npublic override void Input0_ProcessInputRow(Input0Buffer Row)\n{\n    bool\
  \ isEmailValid = false;\n    //如果没有提供电子邮件，则视为无效\n    if (!Row.Email_IsNull)\n  \
  \  {\n        isEmailValid = IsCorrectEmail(Row.Email);\n    }\n    if (isEmailValid)\n\
  \    {\n        Row.DirectRowToValidEmail();\n    }\n    else\n    {\n        Row.DirectRowToInvalidEmail();\n\
  \    }\n}\n```\n\n在 VB.NET 中，你可以按如下方式调用该方法：\n\n```\nPublic Overrides Sub Input0_ProcessInputRow(Row\
  \ As Input0Buffer)\n        Dim isEmailValid As Boolean = False\n        '如果没有提供电子邮件，则视为无效\n\
  \        If Not Row.Email_IsNull Then\n                isEmailValid = IsCorrectEmail(Row.Email)\n\
  \        End If\n        If isEmailValid Then\n                Row.DirectRowToValidEmail()\n\
  \        Else\n                Row.DirectRowToInvalidEmail()\n        End If\nEnd\
  \ Sub\n```\n\n关闭脚本编辑器，并向包中添加两个多播组件：一个连接到 `ValidEmail` 输出，另一个连接到 `InvalidEmail` 输出。在实际场景中，你可能希望记录无效电子邮件的行并停止处理该行。\n\
  \n如果你为两个优先约束添加数据查看器，并使用本章代码示例中提供的输入文件运行包，你可以看到无效电子邮件被验证方法捕获，如图 13-6 所示。\n\n![A978-1-4842-0638-6_13_Fig6_HTML.jpg](img/A978-1-4842-0638-6_13_Fig6_HTML.jpg)\n\
  \n**图 13-6.** 成功运行包并显示数据查看器\n\n#### 移除 HTML 标签\n\n在 SSIS 中处理文本时，有时会遇到包含大量标记的 HTML\
  \ 格式文本，而你并不希望保留这些标记。从文本中去除标记是一个常见问题，使用正则表达式可以轻松实现。你需要做的就是指定 HTML 标签的模式，这非常简单：\n\n\
  它从 `<` 开始，并且必须匹配任意单个字符，甚至换行符，一次或多次。这种包含一个或多个字符的模式可以重复一次或完全不重复，从而产生如下的表达式：\n\n```\n\
  <(.|\\n)+?>\n```\n\n#### 包\n\n从前一个示例（或第 13 章 的示例代码）开始，在包的设计界面上添加一个“数据流任务”，并将其命名为\
  \ `DFT_RemoveHTML`。\n\n在“数据流任务”内部，按照前一个示例（验证电子邮件地址）所述添加一个“平面文件源”，并将其配置为从源文件中获取所有列。\n\
  \n在界面上添加一个名为 `Scr_RemoveHTML` 的“脚本组件”，选择“转换”作为其类型，并将其输入连接到“平面文件源”的输出。双击“脚本组件”，仅将\
  \ `Summary` 列设为 `ReadWrite`，如图 13-7 所示。\n\n![A978-1-4842-0638-6_13_Fig7_HTML.jpg](img/A978-1-4842-0638-6_13_Fig7_HTML.jpg)\n\
  \n**图 13-7.** 配置输入列\n\n在“脚本”页面上，点击“编辑脚本...”以打开 VSTA。从脚本中删除 `PreExecute` 和 `PostExecute`\
  \ 方法。\n\n\n\n#### 脚本\n\n在代码中使用正则表达式之前，需要先通过 `Using` 或 `Imports` 指令添加对命名空间的引用。如果使用\
  \ C#，请编写以下代码：\n\n```\n#region CustomNamespace\nusing System.Text.RegularExpressions;\n\
  #endregion\n```\n\n你需要一个能使用前述模式来移除 HTML 代码的方法。\n\n```\n// 在类级别创建以提升性能\n// HTML 标签的模式\n\
  public static String htmlTagPattern = \"<(.|\\n)+?>\";\n\n// 使用该模式创建正则表达式对象\npublic\
  \ Regex objRegExp = new Regex(htmlTagPattern);\n\n// 一个使用正则表达式模式去除 HTML 的布尔方法\n\
  public String RemoveHtml(String message)\n{\n    // 将 HTML 标签替换为空字符串\n    message\
  \ = objRegExp.Replace(message, String.Empty);\n    // 返回不含 HTML 标签的消息\n    return\
  \ message;\n}\n```\n\n以下是在 VB.NET 中使用的代码：\n\n```\n' 在类级别创建以提升性能\n' HTML 标签的模式\n\
  Public Shared htmlTagPattern As [String] = \"<(.|\" & vbLf & \")+?>\"\n\n' 使用该模式创建正则表达式对象\n\
  Public objRegExp As New Regex(htmlTagPattern)\n\n' 一个使用正则表达式模式去除 HTML 的函数\nPublic\
  \ Function RemoveHtml(message As [String]) As [String]\n        ' 将 HTML 标签替换为空字符串\n\
  \        message = objRegExp.Replace(message, [String].Empty)\n        ' 返回不含 HTML\
  \ 标签的消息\n        Return message\nEnd Function\n```\n\n在上述函数中，你使用正则表达式的 `Replace`\
  \ 方法移除 HTML 标记并将其替换为空字符串，而在第一个示例中，你只关心匹配操作。\n\n然后，你可以在 `Input0_ProcessInputRow`\
  \ 方法中调用该方法，C# 的实现如下：\n\n```\npublic override void Input0_ProcessInputRow(Input0Buffer\
  \ Row)\n{\n    Row.Summary = RemoveHtml(Row.Summary);\n}\n```\n\nVB.NET 的调用方式如下：\n\
  \n```\nPublic Overrides Sub Input0_ProcessInputRow(Row As Input0Buffer)\n      \
  \  Row.Summary = RemoveHtml(Row.Summary)\nEnd Sub\n```\n\n关闭 VSTA 编辑器，并向脚本组件的输出添加多播，同时启用优先级约束上的数据查看器。运行包时，你应该能够看到不含\
  \ HTML 标记的摘要，如图 13-8 所示。\n\n![A978-1-4842-0638-6_13_Fig8_HTML.jpg](img/A978-1-4842-0638-6_13_Fig8_HTML.jpg)\n\
  \n图 13-8. 显示结果的数据查看器\n\n在此示例中，你了解了如何使用正则表达式的 `Replace` 方法从文本中去除 HTML 代码。在下一个示例中，你将了解如何验证日期，并在日期不符合所需格式时将其替换为默认值。\n\
  \n### 清理/验证\n\n正则表达式也是确保数据质量的绝佳工具。基于清理和验证规则实现模式非常直接。在前面的示例代码中，有一个日期列。该列的唯一问题是数据质量。有时日期的各部分用正斜杠（`/`）分隔，有时用短划线（`-`）分隔。在其他情况下，根本没有日期，只有一连串的\
  \ `#` 符号。让我们实现一个脚本，确保日期始终以正确的方式表示，以便最终可以转换为 datetime 格式。此外，约定将空或无效的日期字符串替换为 `9999-12-31`。\n\
  \n#### 包\n\n从上一个示例（或第 13 章的示例代码）开始，在包的设计图面上添加一个数据流任务，并将其命名为 `DFT_CleanseDate`。\n\
  \n在数据流任务内部，按照上一个示例（验证电子邮件地址）的描述添加一个平面文件源，并将其配置为从源文件中获取所有列。\n\n在设计图面上添加一个名为 `SCR_CleanseDate`\
  \ 的脚本组件，选择转换类型，并将其输入连接到平面文件源的输出。双击脚本组件，仅选择所需的列以提升性能——在本例中是 `Date` 列，并将其标记为 `ReadWrite`，如图\
  \ 13-9 所示。单击脚本页面上的 `Edit Script…` 按钮以打开 VSTA。\n\n![A978-1-4842-0638-6_13_Fig9_HTML.jpg](img/A978-1-4842-0638-6_13_Fig9_HTML.jpg)\n\
  \n图 13-9. 日期列已更改为 ReadWrite\n\n\n\n#### 脚本\n\n首先，移除不必要的 `PreExecute` 和 `PostExecute`\
  \ 方法。要在代码中使用正则表达式，需要先使用 `Using` 或 `Imports` 指令添加对命名空间的引用。以下是实现此功能的 C# 代码：\n\n```\n\
  #region CustomNamespace\nusing System.Text.RegularExpressions;\n#endregion\n```\n\
  \n你需要一个方法来验证输入字符串的格式是否正确。`DateTime.TryParse` 方法正具备此功能。`TryParse` 会将指定的日期和时间字符串表示形式转换为其等效的\
  \ `DateTime` 对象，并返回一个指示转换是否成功的值，这比返回错误信息更容易处理。所使用的正则表达式十分简单；你需要查找所有出现的正斜杠、点、逗号和破折号，并将它们替换为破折号。再次给出\
  \ C# 中的实现：\n\n```\n//在类级别创建以提高性能\n// 查找日期字符串中出现的 / , . - 字符\nRegex rgx = new Regex(\"\
  ([-/,.])\");\n\n// 此方法使用 TryParse 检查日期是否有效，\n// 如果无效则使用并返回一个通用值。\npublic string\
  \ CheckDate(String date)\n{\n    string CleanedDate;\n    // 将它们替换为 -\n    CleanedDate\
  \ = rgx.Replace(date, \"-\");\n    DateTime parsedDate;\n    if (DateTime.TryParse(CleanedDate,\
  \ out parsedDate) == true)\n    {\n        //如果是日期，则以格式良好的方式返回\n        // 日期格式化为\
  \ ISO 格式以避免混淆\n        return parsedDate.ToString(\"yyyy-MM-dd\");\n    }\n    else\n\
  \    {\n        //不是有效日期，则返回 ISO 格式的通用值\n        return \"9999-12-31\";\n    }\n\
  }\n```\n\n与往常一样，使用 VB.NET 可以轻松地表达该实现：\n\n```\n'在类级别创建以提高性能\n' 查找日期字符串中出现的 / , .\
  \ - 字符\nPrivate rgx As New Regex(\"([-/,.])\")\n\n' 此方法使用 TryParse 检查日期是否有效，\n'\
  \ 如果无效则使用并返回一个通用值。\nPublic Function CheckDate([date] As [String]) As String\n  \
  \   Dim CleanedDate As String\n     ' 将它们替换为 -\n     CleanedDate = rgx.Replace([date],\
  \ \"-\")\n     Dim parsedDate As DateTime\n     If DateTime.TryParse(CleanedDate,\
  \ parsedDate) = True Then\n         '如果是日期，则以格式良好的方式返回\n         ' 日期格式化为 ISO 格式以避免混淆\n\
  \         Return parsedDate.ToString(\"yyyy-MM-dd\")\n     Else\n         '不是有效日期，则返回\
  \ ISO 格式的通用值\n         Return \"9999-12-31\"\n     End If\nEnd Function\n```\n\n\
  现在，从 `Main` 方法中，可以轻松地为每一行调用该帮助方法。在 C# 中，编写如下代码：\n\n```\npublic override void Input0_ProcessInputRow(Input0Buffer\
  \ Row)\n{\n            if (!Row.Date_IsNull)\n       {\n           Row.Date = CheckDate(Row.Date);\n\
  \       }\n       else\n       {\n           Row.Date = \"9999-12-31\";\n      \
  \ }\n}\n```\n\n在 VB.NET 中，编写如下代码：\n\n```\nPublic Overrides Sub Input0_ProcessInputRow(Row\
  \ As Input0Buffer)\n        If Not Row.Date_IsNull Then\n        Row.Date = CheckDate(Row.Date)\n\
  \        Else\n        Row.Date = \"9999-12-31\"\n        End If\nEnd Sub\n```\n\
  \n关闭 VSTA 编辑器，并向脚本组件的输出添加一个多播，以便在优先约束上启用数据查看器。运行包时，您应该能够看到经过验证和清理的日期，如图 13-10 所示。\n\
  \n![A978-1-4842-0638-6_13_Fig10_HTML.jpg](img/A978-1-4842-0638-6_13_Fig10_HTML.jpg)\n\
  \n图 13-10. 展示清理后日期的数据查看器\n\n### 总结\n\n通过使用正则表达式，您可以以一种非常直接的方式对数据进行匹配、格式化、清洗和验证。这些示例演示了正则表达式的一些基本功能。通过组合更复杂的模式，您可以释放高性能正则表达式引擎的真正力量。\n\
  \n此外，还有一些工具可以帮助您构建表达式，这样您就不必自己费力解决了。其中最好用的工具之一是 RegExr，访问地址为 [`regexr.com`](http://regexr.com/)。\n\
  \n如果您更喜欢离线工具，RegexMagic 也是一个不错的选择；您可以在 [www.regular-expressions.info/regexmagic.html](http://www.regular-expressions.info/regexmagic.html)\
  \ 找到它。\n\n"
- "# 14. 脚本组件反射\n\n电子补充材料 本章的在线版本 (doi:[10.1007/978-1-4842-0638-6_14](http://dx.doi.org/10.1007/978-1-4842-0638-6_14))\
  \ 包含补充材料，可供授权用户使用。\n\n本章重点介绍脚本组件的灵活性，因为有时您需要对大量列执行相同的转换，这可能会有点繁琐。第 12 章 中带有大量列的\
  \ XML 目标呢？您肯定不想逐个编码几十个列名。通过反射，您可以在运行时遍历所有输入列。因此，您不必硬编码所有这些列。使用反射的另一个绝佳机会是计算所有列的哈希值。\n\
  \n然而，这种灵活性是有代价的，因为如果性能是您最关心的问题，那么反射并非最佳技术。在这种情况下，您需要多次枚举这些列，而这是基于 COM 的对象。在本章末尾，您将找到针对此问题的解决方案。\n\
  \n开始之前有两点需要注意。首先，脚本按照您在编辑器中选择的顺序遍历输入列的集合。其次，当您更改列名、数据类型甚至列的顺序时，您必须编辑脚本并让 SSIS 更改生成的脚本。\n\
  \n### 灵活的 XML 目标\n\n第一个示例延续了第 12 章 中的基本 XML 目标示例（见图 14-1）。唯一的区别在于脚本本身。您可以继续使用该包，也可以使用示例项目中名为\
  \ `XML Starter.dtsx` 的起始包。确保已按照正确顺序选择了 XML 文件中所需的所有输入列，然后单击 `Edit Script...` 按钮。\n\
  \n![A978-1-4842-0638-6_14_Fig1_HTML.jpg](img/A978-1-4842-0638-6_14_Fig1_HTML.jpg)\n\
  \n图 14-1. XML 目标\n\n\n\n#### 脚本\n\n在本示例中，你将使用所有默认方法，包括 `PreExecute` 和 `PostExecute`，但首先需要将\
  \ `System.XML` 添加到命名空间中以简化代码。\n\n```\n#region customNamespaces\nusing System.Xml;\n\
  #endregion\n```\n\n这是 VB.NET 代码：\n\n```\n#Region \"customNamespaces\"\nImports System.Xml\n\
  #End Region\n```\n\n你还需要一些类变量，以便在各个方法中使用。\n\n```\n// XmlTextWriter (stream) object\
  \ to write the XML\nXmlTextWriter textWriter;\n// Boolean variable to do something\
  \ only onces\nBoolean FirstRow = true;\n// Variable to store the row type\nType\
  \ rowType;\n// Variable to store the input columns\nIDTSInputColumnCollection100\
  \ InputColumnCollection;\n// Variable to store the value of the column\nString columnValue\
  \ = \"\";\n```\n\n这是对应的 VB.NET 代码：\n\n```\n' XmlTextWriter (stream) object to write\
  \ the XML\nDim textWriter As XmlTextWriter\n' Boolean variable to do something only\
  \ onces\nDim FirstRow As Boolean = True\n' Variable to store the row type\nDim rowType\
  \ As Type\n' Variable to store the input columns\nDim InputColumnCollection As IDTSInputColumnCollection100\n\
  ' Variable to store the value of the column\nDim columnValue As String = \"\"\n\
  ```\n\n在 `PreExecute` 方法中，你将创建 XML 文件，同时还会获取输入列。稍后你需要用这些列来遍历所有列。出于性能考虑，你只在 `PreExecute`\
  \ 中获取一次。\n\n```\npublic override void PreExecute()\n{\n    // Get collection of\
  \ input columns\n    InputColumnCollection = this.ComponentMetaData\n        .InputCollection[0].InputColumnCollection;\n\
  \    // Create a new XML document and use the filepath\n    //in the connection\
  \ as XML-file\n    textWriter = new XmlTextWriter(this.Connections.xmlFile\n   \
  \     .AcquireConnection(null).ToString(), null);\n    // Start writing the XML\
  \ document:\n    textWriter.WriteStartDocument();\n    // Create root element <Employees>\n\
  \    textWriter.WriteStartElement(\"Employees\");\n}\n```\n\n这是对应的 VB.NET 代码：\n\n\
  ```\nPublic Overrides Sub PreExecute()\n    ' Get collection of input columns\n\
  \    InputColumnCollection = Me.ComponentMetaData _\n        .InputCollection(0).InputColumnCollection\n\
  \    ' Create a new XML document and use the\n    ' filepath in the connection as\
  \ XML-file\n    textWriter = New XmlTextWriter(Me.Connections.xmlFile _\n      \
  \  .AcquireConnection(Nothing).ToString(), _\n        System.Text.Encoding.Default)\n\
  \    ' Start writing the XML document:\n    textWriter.WriteStartDocument()\n  \
  \  ' Create root element <Employees>\n    textWriter.WriteStartElement(\"Employees\"\
  )\nEnd Sub\n```\n\n`PostExecute` 方法用于关闭 XML 文档。\n\n```\npublic override void PostExecute()\n\
  {\n    // Close root element: </Employees>\n    textWriter.WriteEndElement();\n\
  \    // Stop writing the XML document\n    textWriter.WriteEndDocument();\n    //\
  \ Close document and clean up resources\n    textWriter.Close();\n}\n```\n\n这是对应的\
  \ VB.NET 代码：\n\n```\nPublic Overrides Sub PostExecute()\n    'Close root element:\
  \ </Employees>\n    textWriter.WriteEndElement()\n    'Stop writing the XML document\n\
  \    textWriter.WriteEndDocument()\n    'Close document and clean up resources\n\
  \    textWriter.Close()\nEnd Sub\n```\n\n接下来是 `ProcessInputRow` 方法，它为每一行添加 XML 标签。该方法包含一个\
  \ `foreach` 循环，用于遍历输入列集合中的所有列。然后，它尝试从每个列获取值，并为 XML 文档添加一个 XML 标签。在 `try-catch` 中，你会看到“反射”代码：`.GetProperty(_____)`。另请注意额外的辅助方法，用于从\
  \ XML 文档中移除“非法”字符。这些字符会破坏 XML 标签，导致文档无法读取。\n\n```\npublic override void Input0_ProcessInputRow(Input0Buffer\
  \ Row)\n{\n    // Do only onces\n    if (FirstRow)\n    {\n        // Row type to\
  \ get the value of a column\n        rowType = Row.GetType();\n    }\n    FirstRow\
  \ = false;\n    // Create row element: <Employee>\n    textWriter.WriteStartElement(\"\
  Employee\");\n    // Loop through all columns and create a column element:\n   \
  \ // <col1>value</col1><col2>value</col2>\n    foreach (IDTSInputColumn100 column\
  \ in InputColumnCollection)\n    {\n        // Use the SSIS column name as element\
  \ name: <col1>\n        textWriter.WriteStartElement(column.Name);\n        // Get\
  \ column value, will fail if null\n        try\n        {\n            columnValue\
  \ = rowType.GetProperty(column.Name)\n                .GetValue(Row, null).ToString();\n\
  \        }\n        catch\n        {\n            // Default value for null values:\
  \ \"null\", \"\" or string.Empty\n            columnValue = string.Empty;\n    \
  \    }\n        finally\n        {\n            textWriter.WriteString(removeForbiddenXmlChars(columnValue));\n\
  \        }\n        // Close column element: </col1>\n        textWriter.WriteEndElement();\n\
  \    }\n    // Close row element: </Employee>\n    textWriter.WriteEndElement();\n\
  \    // Extra: output the number of processed rows. 103 = RowsWritten\n    this.ComponentMetaData.IncrementPipelinePerfCounter(103,\
  \ 1);\n}\n\nprivate string removeForbiddenXmlChars(string columnValue)\n{\n    //\
  \ Remove forbidden chars that could damage your XML document\n    return columnValue.Replace(\"\
  &\", \"&amp;\")\n        .Replace(\"<\", \"&lt;\")\n        .Replace(\">\", \"&gt;\"\
  );\n}\n```\n\n这是对应的 VB.NET 代码：\n\n```\nPublic Overrides Sub Input0_ProcessInputRow(Row\
  \ As Input0Buffer)\n    ' Do only onces\n    If FirstRow Then\n        ' Row type\
  \ to get the value of a column\n        rowType = Row.GetType()\n    End If\n  \
  \  FirstRow = False\n    ' Create row element: <Employee>\n    textWriter.WriteStartElement(\"\
  Employee\")\n    ' Loop through all columns and create a column element:\n    '\
  \ <col1>value</col1><col2>value</col2>\n    For Each column As IDTSInputColumn100\
  \ In InputColumnCollection\n        ' Use the SSIS column name as element name:\
  \ <col1>\n        textWriter.WriteStartElement(column.Name)\n        ' Get column\
  \ value, will fail if null\n        Try\n            columnValue = rowType.GetProperty(column.Name)\
  \ _\n                .GetValue(Row, Nothing).ToString()\n        Catch\n       \
  \     ' Default value for null values: \"null\", \"\" or string.Empty\n        \
  \    columnValue = String.Empty\n        Finally\n            textWriter.WriteString(removeForbiddenXmlChars(columnValue))\n\
  \        End Try\n        ' Close column element: </col1>\n        textWriter.WriteEndElement()\n\
  \    Next\n    ' Close row element: </Employee>\n    textWriter.WriteEndElement()\n\
  \    ' Extra: output the number of processed rows. 103 = RowsWritten\n    Me.ComponentMetaData.IncrementPipelinePerfCounter(103,\
  \ 1)\nEnd Sub\n\nPrivate Function removeForbiddenXmlChars(columnValue As String)\
  \ As String\n    ' Remove forbidden chars that could damage your XML document\n\
