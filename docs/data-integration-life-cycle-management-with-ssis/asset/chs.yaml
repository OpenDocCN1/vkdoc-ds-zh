- '# 1. DILM 简介


  *DevOps* 是“开发”（Development）和“运维”（Operations）两个词的组合。DevOps 关乎流程改进，体现为更快的上市时间、更高的质量、可重复的自动化，以及更易于支持和维护的代码。软件测试是
  DevOps 的主要部分，从软件开发人员进行的单元测试开始。软件测试发生在所有企业应用层级（开发、质量保证、用户验收、生产等）。DevOps 开发人员通过展现流程仪表化并构建可重复的配置脚本，来支持运维工作。配置脚本有助于提高质量、加快灾难恢复，并快速可靠地增加企业应用层级。


  软件开发人员遵循最佳实践来构建健壮的企业软件。数十年来，开发人员在构建应用时一直应用一套称为**应用生命周期管理**（应用生命周期管理，简称*ALM*）的最佳实践。什么是
  ALM？应用生命周期管理包含支持 DevOps 的设计原则。一个重要的开发概念是**关注点分离**，即包括外部化（参数化）和解耦在内的设计最佳实践。


  *数据集成* 是将数据从一个位置移动到另一个位置。数据通常从不同来源收集并加载到数据库中，以支持集中式报告。这些报告数据库在不同企业中有不同名称：操作数据存储（ODS）、临时数据库、中央存储库、数据仓库（DW）或企业数据仓库（EDW）等。


  数据集成*就是*软件开发。数据集成生命周期管理（简称*DILM*）是在现代 DevOps 企业中管理数据集成的艺术与科学。在本书中，我将分享我在大小企业中管理
  SQL Server 集成服务（SSIS）数据集成解决方案所学到的经验。


  我撰写本书的目标是教您如何在您的企业中管理 SSIS。与所有其他软件开发平台一样，生命周期管理是 SSIS 的最佳实践。与所有其他软件开发一样，使用 SSIS
  实践 DevOps 是可行的。


  ## 一些历史


  SQL Server 集成服务（SSIS）于 2005 年 11 月发布。SSIS 的开发远在此之前就开始了，据我所知，该产品最初计划命名为数据转换服务（DTS）2.0。许多程序集都带有命名空间`Dts`。


  我想通过关于 SSIS 的几点声明来介绍本书。


  ### SSIS 是一个软件开发平台


  我记不清多少次看到招聘“具有 SSIS 经验”的数据库管理员职位了。


  数据库管理员、数据库开发人员和 SSIS 开发人员是不同的角色。


  每当我看到这样的招聘信息时，都会有些皱眉。SSIS 是一个软件开发平台，我是一名软件开发人员。我也是一名数据库开发人员。我*不是*数据库管理员。我曾尝试担任 DBA
  的工作，但惨遭失败。这并不是说我不欣赏 DBA 的角色；我保证我欣赏。我的一些最好的朋友就是 DBA。我想首先向您传达这个简单的事实：DBA、数据库开发人员和
  SSIS 开发人员是不同的角色。




  ### SSIS 是一款企业级数据集成引擎


  SSIS 旨在将数据从一个位置迁移到另一个位置，这正是数据集成的本质。数据集成可以包括数据重塑、清理和转换；但其核心仍是将数据重新定位。`SSIS 数据流任务`
  在推出时具有革命性意义。以我拙见，它至今仍是一项非常精巧的技术。其管道架构提供了实现企业级规模所需调优的大部分控制杆。


  SSIS 是满足*所有*数据集成需求的完美引擎吗？并非如此。但针对大多数数据集成需求，它都是一种极其灵活的解决方案。


  我曾多次用 SSIS 完成过那些看似“不可能完成的任务”。多年前，我甚至与一位非常聪明、在互联网上颇具名气的软件开发人员发生过线上争论，他写了一篇文章列举 SSIS
  的各种问题。我告诉这位开发者，我教人们使用 SSIS，而我的所有学生都知道如何解决他文章中列出的几乎所有问题。


  > *最近有人问我：“微软什么时候才能推出企业级数据集成引擎？”我的回答是：“2005 年。”*

  >

  > – 安迪·伦纳德


  ### SSIS 难以学习


  我是怎么知道的？十多年来，我（和其他人）一直以教人们如何使用 SSIS 为生。


  所有软件平台都有“死角”——即该语言不擅长处理的怪癖和边缘情况。SSIS 大约有 30 个这样的死角。我这样向学生描述数据流任务：“SSIS 希望你去*思考*数据流，而像数据流一样思考是很困难的。”


  “SSIS 希望你去像数据流一样思考。”


  ### 生命周期管理


  即使在撰写本文时，SSIS 在企业生命周期中的管理仍然很困难。典型的例子是比较 SSIS 包。SSIS 基于 XML。XML 是一种自描述的数据格式，它对顺序的尊重程度低于传统数据存储。例如，以下
  XML 片段是等效的：


  ```

  Data Integration Lifecycle Management

  Andy Leonard


  Andy Leonard

  Data Integration Lifecycle Management

  ```


  你看到这个例子可能会打趣说：“但是安迪，我一眼就能看出这些数据是等效的。”你说得对；检查五行数据非常简单。想象一下检查五百行 XML，其中的标签和属性顺序不同，你就能开始理解比较
  XML 数据的复杂性了。


  XML 本身并不坏，也没有错。正是 XML 的半结构化特性使得 SSIS 难以进行比较。


  ### 解决方案与致谢


  本书其余部分将重点介绍解决方案。除 `BimlExpress Metadata Framework` 之外，本书中包含的解决方案均由肯特·布拉德肖、凯文·哈泽德和我本人开发。Varigence
  公司的斯科特·库里及其团队构建了商业智能标记语言（Biml），并教会了我们如何编写 Biml。斯科特及其团队教给我们的一些内容被融入了 `BimlExpress
  Metadata Framework`。


  更准确地说，肯特、凯文和我都是从经验以及他人那里学习到现有知识的。从真正意义上讲，我们中没有谁是*自学成才*的。相反，我们是*由社区共同教导而成*的。


  其中一些解决方案仅仅是使用微软随 SSIS 一起提供的“内置”技术的方法。一些是实践最佳做法。一些是手动的，另一些则是自动化的。一些是供应商提供的免费工具和实用程序，一些是
  Enterprise Data & Analytics（`entdna.com`）、Tudor Data Solutions（`tudords.com`）和 DevJourney（`devjourney.com`）团队开发的免费实用程序和工具；其中许多是
  DILM Suite（`dilmsuite.com`）的一部分。BimlExpress 是来自 Varigence（`varigence.com`）的第三方产品。另外，`SSIS
  Framework Community Edition` 和 `BimlExpress Metadata Framework` 是某些付费商业解决方案的免费版本，Enterprise
  Data & Analytics 将其作为咨询服务的一部分进行销售。


  我们是否掌握了所有答案？天哪，当然没有！我们只掌握了一些。像你一样，我们每天都在学习新东西。本书所载内容就是我们目前所知道的一部分。


