- '# SSIS 目录比较器


  查看 SSIS 目录内容，包括 SSIS 目录项目、包、环境、环境变量、引用和引用映射，以及 SSIS 包和 SSIS 目录属性，这很有帮助。但如果你想查看一个
  SSIS 目录实例与另一个实例之间的内容差异呢？或者，也许更有用的是，你如何才能*知道*企业 QA 和生产环境中的 SSIS 目录实例是匹配的？


  ## 作者 Andy Leonard 分享：为何构建 SSIS 目录比较器


  我的团队使用 SSIS 为客户构建了一个相当复杂的数据集成解决方案。我们在两个 DevOps 层级（测试环境和 UAT（用户验收测试）环境）中测试了该解决方案。我们发现了一些问题并进行了修正。然后到了部署到生产环境的时候。在生产部署和初始生产测试期间，我和我的团队处于待命状态。


  起初，一切均告失败。


  我们找出了根本原因并修正了问题，但我们在业务方面丢了面子，而且理由充分。我们曾向他们保证“我们做得对”。我们确实做得对，但有一个例外。企业数据架构师提出了一个很好的问题，指出了差距：“我们如何*知道*生产环境和
  UAT 环境的 SSIS 目录是相同的？”我当时回应道：“（沉思片刻……然后）我不知道。”


  我构建了 `SSIS Catalog Compare（SSIS 目录比较器）`，这样我——以及我的客户，还有你——就能够回答这个问题了。




  '
- '# SSIS 目录比较


  你可以将 `SSIS 目录比较` 视作两个目录浏览器。与 `目录浏览器` 类似，`SSIS 目录比较` 使用 `目录基础` 这一自定义目录对象。在 `SSIS
  目录比较` 中，`目录基础` 用于填充两个树形结构，每个树代表一个不同的 SSIS 目录，如图 7-1 所示。


  ![../images/459435_1_En_7_Chapter/459435_1_En_7_Fig1_HTML.jpg](img/459435_1_En_7_Fig1_HTML.jpg)


  图 7-1 `SSIS 目录比较`


  加载两个目录后，点击**比较**按钮即可进行比较。如图 7-2 所示，`SSIS 目录比较` 使用斜体字体表示在某个节点*下方*检测到差异，并使用不同的背景色表示存在于一个
  SSIS 目录中但另一个目录中缺失的工件。


  ![../images/459435_1_En_7_Chapter/459435_1_En_7_Fig2_HTML.jpg](img/459435_1_En_7_Fig2_HTML.jpg)


  图 7-2 比较操作之后


  `VmDemo\Demo` 目录中的 `Test` 目录文件夹在 `vmDemo\Dev` 目录中不存在，因此 `vmDemo\Demo\SSISDB\Test`
  节点具有背景色。图 7-2 中显示的“更深层差异”指示（斜体字体）表示 `Framework` 目录文件夹内部以及目录属性之间的差异。


  ## 展开差异


  一项省时功能是 `展开差异`，如图 7-3 所示。


  ![../images/459435_1_En_7_Chapter/459435_1_En_7_Fig3_HTML.jpg](img/459435_1_En_7_Fig3_HTML.jpg)


  图 7-3 `展开差异`


  `展开差异` 会展开差异*上方*的节点以及*存在差异*的节点。在大型 SSIS 目录项目、含有大量配置元数据的目录项目或两者兼有的情况下，`展开差异` 可以减少展开的节点数量。展开两个目录的
  `Framework` 目录文件夹中的差异，你会看到 `Parent.dtsx` SSIS 包的 SSISDB 连接管理器的 `ConnectionString`
  属性已根据每个服务器的本地 SQL Server 实例进行了配置，如图 7-4 所示。


  ![../images/459435_1_En_7_Chapter/459435_1_En_7_Fig4_HTML.jpg](img/459435_1_En_7_Fig4_HTML.jpg)


  图 7-4 不同的 `ConnectionString` 属性值


  这是一件非常好的事情，因为如果这些值匹配，一个目录中的框架应用程序执行会启动另一个目录中的 SSIS 执行。那可能很糟糕。


  ## 目录属性


  我在关于 `目录浏览器` 的部分中没有讨论目录属性，因为我想在此处更详细地介绍目录属性。如果折叠 `Framework` 目录文件夹并展开**目录属性**，你会看到差异在于
  `架构版本` 属性，如图 7-5 所示。


  ![../images/459435_1_En_7_Chapter/459435_1_En_7_Fig5_HTML.jpg](img/459435_1_En_7_Fig5_HTML.jpg)


  图 7-5 SSIS 目录 `架构版本` 属性的不同值


  请注意 `架构版本` 正下方的属性，这两个 SSIS 目录均为 SSIS 2016。`vmDemo\Demo` 的 `架构版本` 告诉我们此目录是 SSIS 2016
  的通用发布版。`vmDemo\Dev` 的目录是 SSIS 2016 SP1 `架构版本`。


  `目录基础` 对象的构建目的是允许 `SSIS 目录比较` 比较不同版本和不同 SQL Server 版本的 SSIS 目录。例如，我可以将 SSIS 2012
  目录的内容与 SSIS 2016 目录的内容进行比较。SSIS 2016 为目录属性添加了几个属性，所以你会在比较的 2016 一侧看到几个属性被标记为 2012
  一侧缺失。但比较操作会成功，并产生准确且有用的结果。


  ## SSIS 目录比较脚本


  在拥有两名或更多 IT 专业人员的许多企业中，开发软件的专业人员不被允许部署该软件。大型企业拥有专门负责发布管理的整个团队。生命周期管理将帮助任何规模的企业减少停机时间，并提高代码的可支持性和可维护性。这同样适用于
  SSIS，因为数据集成生命周期管理与 Web、GUI 和中间件软件生命周期管理同样重要。


  `SSIS 目录比较` 旨在支持 DevOps 和企业 DILM。


  你可以使用 `SSIS 目录比较` 为单个工件编写脚本，但或许更有用（且更快）的功能是为一个目录文件夹及其所有内容编写脚本，如图 7-6 所示。


  ![../images/459435_1_En_7_Chapter/459435_1_En_7_Fig6_HTML.jpg](img/459435_1_En_7_Fig6_HTML.jpg)


  图 7-6 准备为目录文件夹及其内容生成脚本


  当你点击“**为文件夹和内容生成脚本**”时，`SSIS 目录比较` 会提示你选择一个文件系统文件夹来存储脚本，如图 7-7 所示。


  ![../images/459435_1_En_7_Chapter/459435_1_En_7_Fig7_HTML.jpg](img/459435_1_En_7_Fig7_HTML.jpg)


  图 7-7 为脚本选择目标文件系统文件夹


  当你选择一个文件系统文件夹时，`SSIS 目录比较` 会生成用于创建目录文件夹及其所有内容的脚本和 ISPAC 文件，如图 7-8 所示。


  ![../images/459435_1_En_7_Chapter/459435_1_En_7_Fig8_HTML.jpg](img/459435_1_En_7_Fig8_HTML.jpg)


  图 7-8 查看脚本的目标文件系统文件夹


  脚本按顺序编号，表示依赖关系。例如，在脚本编号 1 的 SSIS 目录文件夹存在之前，你无法使用编号 2 的 ISPAC 文件部署 SSIS 项目。


  按列出的顺序双击文件将创建目标 SSIS 目录上的 `Test` 目录文件夹（脚本 1），使用**集成服务部署向导** GUI 部署 `DILMSample`
  SSIS 项目（你需要在部署期间选择 `Test` 目录文件夹作为目标目录文件夹），创建 `envConnection1` 目录环境及其目录环境变量，在 `DILMSample`
  SSIS 项目和 `envConnection1` 之间创建引用，并创建*另一个*包含 `SimplePackage.dtsx` SSIS 包与 `envConnection1`
  目录环境之间引用映射的引用。


  为什么需要两个引用文件？因为在 SSIS 目录中，对 SSIS 目录项目和 SSIS 包的引用是不同的工件。




  ### 创建目录文件夹


  这些脚本（以及 `ISPAC`）是幂等的，或者说可以重复执行，如图 7-9 所示。


  ![../images/459435_1_En_7_Chapter/459435_1_En_7_Fig9_HTML.jpg](img/459435_1_En_7_Fig9_HTML.jpg)


  **图 7-9** 幂等的 Transact-SQL 脚本


  如果 `Test` 目录文件夹不存在，脚本会创建它。如果 `Test` 目录文件夹已存在，脚本会输出一条消息，告知执行者这一事实。


  输出消息旨在被复制并粘贴到工单的“备注”字段中，然后才能关闭工单。这些消息提供了关于脚本如何以及何时生成、由谁生成、脚本何时何地执行以及由谁执行的详细信息，如图
  7-10 所示。


  ![../images/459435_1_En_7_Chapter/459435_1_En_7_Fig10_HTML.jpg](img/459435_1_En_7_Fig10_HTML.jpg)


  **图 7-10** 脚本输出消息


  在 `SSMS 对象资源管理器` 中刷新 `SSIS` 目录节点，将显示 `Test` 目录文件夹已被创建，如图 7-11 所示。


  ![../images/459435_1_En_7_Chapter/459435_1_En_7_Fig11_HTML.jpg](img/459435_1_En_7_Fig11_HTML.jpg)


