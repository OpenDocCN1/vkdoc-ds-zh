  \n图 10-39\n\n正在执行 `30_Build_Destination_Tables.dtsx` SSIS 包\n\n如果一切顺利，`30_Build_Destination_Tables.dtsx`\
  \ SSIS 包将成功执行，如图 10-40 所示。\n\n![../images/459435_1_En_10_Chapter/459435_1_En_10_Fig40_HTML.jpg](img/459435_1_En_10_Fig40_HTML.jpg)\n\
  \n图 10-40\n\n`30_Build_Destination_Tables.dtsx` SSIS 包执行成功\n\n返回 SSMS 并刷新对象资源管理器中的\
  \ `AdventureWorks2014_Staging Tables` 节点，如图 10-41 所示。\n\n![../images/459435_1_En_10_Chapter/459435_1_En_10_Fig41_HTML.jpg](img/459435_1_En_10_Fig41_HTML.jpg)\n\
  \n图 10-41\n\n刷新 `AdventureWorks2014_Staging Tables` 节点\n\n`AdventureWorks2014_Staging`\
  \ 数据库现在包含架构和表，如图 10-42 所示。\n\n![../images/459435_1_En_10_Chapter/459435_1_En_10_Fig42_HTML.jpg](img/459435_1_En_10_Fig42_HTML.jpg)\n\
  \n图 10-42\n\n包含架构和表的 `AdventureWorks2014_Staging` 数据库\n\n### 删除现有项目\n\n从 SSIS 项目中删除现有的\
  \ SSIS 包和项目连接管理器，如图 10-43 所示。\n\n![../images/459435_1_En_10_Chapter/459435_1_En_10_Fig43_HTML.jpg](img/459435_1_En_10_Fig43_HTML.jpg)\n\
  \n图 10-43\n\n删除现有项目\n\n您不必删除现有项目。如果您不删除现有项目，BimlExpress 将提示您确认覆盖现有项目。\n\n### 生成\
  \ SSIS 包\n\n多选 `0_00_BuildConnections.biml`、`0_10_BuildDestinationDatabaseMain.biml`、`0_20_BuildDestinationSchemasMain.biml`、`0_30_BuildDestinationTablesMain.biml`\
  \ 和 `1_99_Main.biml`。右键单击并选择“生成 SSIS 包”，如图 10-44 所示。\n\n![../images/459435_1_En_10_Chapter/459435_1_En_10_Fig44_HTML.jpg](img/459435_1_En_10_Fig44_HTML.jpg)\n\
  \n图 10-44\n\n生成 SSIS 包\n\n与之前一样，在生成目标表 SSIS 包时，系统会提示您覆盖 `AdventureWorks2014_Stage`\
  \ 项目连接管理器及其文件。该过程总共生成 75 个 SSIS 包：\n\n- 1 个创建目标数据库的包\n- 1 个创建目标架构的包\n- 1 个创建目标表的包\n\
  - 71 个 SSIS 加载器，`AdventureWorks2014` 数据库中的每个表对应一个\n- 1 个控制器，其中包含 71 个执行包任务，每个 SSIS\
  \ 加载器对应一个\n\n请参见图 10-45。\n\n![../images/459435_1_En_10_Chapter/459435_1_En_10_Fig45_HTML.jpg](img/459435_1_En_10_Fig45_HTML.jpg)\n\
  \n图 10-45\n\nAdventureWorks2014 Staging SSIS 完成！\n\n### 执行控制器\n\n执行名为 `99_Execute_AdventureWorks2014_Stage_Loader_Staging_Packages.dtsx`\
  \ 的控制器 SSIS 包，如图 10-46 所示。\n\n![../images/459435_1_En_10_Chapter/459435_1_En_10_Fig46_HTML.jpg](img/459435_1_En_10_Fig46_HTML.jpg)\n\
  \n图 10-46\n\n正在执行控制器 SSIS 包\n\n### 验证加载\n\n在 SSMS 中，运行一些测试查询以验证加载过程是否成功执行，如图 10-47\
  \ 所示。\n\n![../images/459435_1_En_10_Chapter/459435_1_En_10_Fig47_HTML.jpg](img/459435_1_En_10_Fig47_HTML.jpg)\n\
  \n图 10-47\n\n验证加载\n\n加载过程已验证。现在，您应该能够部署 BimlExpressMetadataFramework SSIS 项目的 ISPAC\
  \ 文件，如图 10-48 所示。\n\n![../images/459435_1_En_10_Chapter/459435_1_En_10_Fig48_HTML.jpg](img/459435_1_En_10_Fig48_HTML.jpg)\n\
  \n图 10-48\n\n准备部署 BimlExpressMetadataFramework ISPAC 文件\n\n### 圆满闭环\n\n在这个演示中，您已经完成了一个完整的闭环。在第\
  \ 3 章中，您将一个 SSIS 项目部署到了 SSIS 目录。在第 7 章中，您执行了一个脚本，该脚本为 SSIS 框架社区版添加了元数据，涉及一个已部署到\
  \ SSIS 目录的 SSIS 项目，这样您就可以通过调用单个存储过程并传递单个参数值来执行该 SSIS 目录项目中的所有 SSIS 包。\n\n"
- '# 11. 结论


  就原样提供的 SQL Server Integration Services (SSIS) 而言，它已为企业数据集成做好了准备，但在企业 DevOps 和数据集成生命周期管理
  (DILM) 方面尚不够成熟。使用本书中概述的最佳实践、工具和实用程序，您可以提供参与企业 DevOps 的数据集成解决方案。


  DILM Suite 提供的免费、免费开源以及付费实用程序集，旨在支持使用 SSIS 进行数据集成的企业的企业级数据集成生命周期管理。




  '
