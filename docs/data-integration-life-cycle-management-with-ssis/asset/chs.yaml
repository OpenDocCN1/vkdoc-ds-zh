  SSIS 目录项目下，除了 `Packages` 虚拟文件夹外，还存在 `Project Parameters` 和 `Project References`
  虚拟文件夹。


  展开这些虚拟文件夹，即可查看 SSIS 目录项目参数和引用，如图 6-7 所示。


