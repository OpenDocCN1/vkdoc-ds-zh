- "# 2. SSIS\n\n本书并非旨在教你 SSIS。如果你阅读本书并实践其中的示例，你可能会对 SSIS 有更多了解。这是我的希望，但本书的目标并不是教会你\
  \ SSIS。我的目标是教会你如何管理企业中的 SSIS。如果你希望学习 SSIS，我推荐初学者阅读 *SQL Server Central 上的 Integration\
  \ Services 阶梯教程*（`sqlservercentral.com/stairway/72494/`），进阶学习者可阅读 *SQL Server Integration\
  \ Services 设计模式*（`amazon.com/Server-Integration-Services-Design-Patterns/dp/1484200837`）。\n\
  \n通过示例学习是最好的方式。在本章中，你将构建一个用于演示目的的 SSIS 项目。该 SSIS 项目将包含一个 SSIS 包、一个连接管理器、变量、项目参数和包参数。你将在本书后续章节中持续使用这个名为\
  \ `DILMSample` 的 SSIS 项目。该 SSIS 项目在 SQL Server Data Tools（`SSDT`）中构建。请参阅附录 A，获取你将在本书中使用的工具和实用程序的链接。\n\
  \n我将讨论数据集成检测和消息传递，以便在 SSIS 包执行期间输出日志消息。这些消息有助于对执行失败进行故障排除的人员，并输出重要的数据集成检测元数据。\n\n\
  ## 演示示例\n\n打开 `SSDT` 并创建一个名为 `DILMSample` 的新 SSIS 项目。当 `SSDT` 创建新 SSIS 项目时，它会加载一个默认的\
  \ SSIS 项目。默认的 SSIS 项目包括：\n\n*   项目参数，存储在 `Project.params` 文件中\n*   用于项目级连接管理器的虚拟文件夹\n\
  *   用于包部件的虚拟文件夹\n    *   用于控制流包部件的虚拟文件夹\n*   用于杂项项目的虚拟文件夹\n*   一个名为 `Package.dtsx`\
  \ 的默认（空）SSIS 包\n\n如图 2-1 所示，将 `Package.dtsx` 重命名为 `SimplePackage.dtsx`。\n\n![../images/459435_1_En_2_Chapter/459435_1_En_2_Fig1_HTML.jpg](img/459435_1_En_2_Fig1_HTML.jpg)\n\
  \n**图 2-1** DILMSample SSIS 项目\n\n重命名包表明了意图；而保留默认包名则显得懒惰。\n\n## 添加包参数\n\n由于我们计划使用此项目和包来演示生命周期管理，让我们添加一些参数。首先，单击\
  \ `SimplePackage.dtsx` 包上的“参数”选项卡。添加两个包参数，其设置如表 2-1 所示。\n\n表 2-1 包参数设置\n\n完成后，你的“参数”选项卡应类似于图\
  \ 2-2 所示。\n\n![../images/459435_1_En_2_Chapter/459435_1_En_2_Fig2_HTML.jpg](img/459435_1_En_2_Fig2_HTML.jpg)\n\
  \n**图 2-2** 包参数\n\n你将这些演示参数添加在包作用域（Scope）。*作用域* 是软件开发*和*生命周期管理中的一个重要概念。DevOps 中的“Dev”部分侧重于构建运维团队易于管理的代码。作用域如何帮助实现这一点？稍后，你将把参数值*外部化*到\
  \ Transact-SQL（`T-SQL`）脚本中。运维人员最终将通过部署和维护 `T-SQL` 脚本来管理这些外部化的值。DevOps 开发的一个目标是将尽可能多的信息传达给运维人员，尤其是那些不了解\
  \ SSIS 工作原理的运维人员。将参数和变量限定在适当的级别（不要更高，也不要更低），可以传达参数值在 SSIS 应用程序中的使用位置和方式，从而为数据集成项目的“黑箱”带来一些光明。\n\
  \n\n\n## 添加项目参数\n\n在解决方案资源管理器中双击 `Project.params` 工件，打开项目参数窗口，如图 2-3 所示。\n\n![../images/459435_1_En_2_Chapter/459435_1_En_2_Fig3_HTML.jpg](img/459435_1_En_2_Fig3_HTML.jpg)\n\
  \n图 2-3\n\n项目参数\n\n根据表 2-2 中的设置添加两个项目参数。\n\n表 2-2\n\n项目参数设置\n\n完成后，“项目参数”选项卡应类似于图\
  \ 2-4 所示。\n\n![../images/459435_1_En_2_Chapter/459435_1_En_2_Fig4_HTML.jpg](img/459435_1_En_2_Fig4_HTML.jpg)\n\
  \n图 2-4\n\n项目参数\n\nSSIS 参数的工作原理与 SSIS 变量非常相似。两者有两个重要区别：\n\n1. SSIS 变量值可以在任何时间更改（无论是在\
  \ SSIS 包执行之前还是执行期间）。SSIS 参数值可以在 SSIS 包执行之前更改，但不能在执行期间更改。\n2. SSIS 参数值可以标记为*敏感*或*必需*。敏感参数会被加密。必需参数必须在\
  \ SSIS 包执行之前进行替代。\n\n## 关于变量、参数和作用域的说明\n\n为将在 SSIS 包执行期间更改的值创建 SSIS 变量，例如在 Foreach\
  \ 循环容器分配中使用的变量。\n\n为单个 SSIS 包中使用的值创建包作用域参数。包作用域参数的值在 SSIS 包执行期间不能更改。为 SSIS 项目中所有（或几个）SSIS\
  \ 包共享的值创建项目作用域参数。\n\n保存并关闭“项目参数”窗口。\n\n## 添加执行 SQL 任务\n\n向 `SimplePackage.dtsx`\
  \ SSIS 包的控制流中添加一个执行 SQL 任务。打开执行 SQL 任务编辑器，并将 `ConnectionType` 属性设置为 ADO.NET。单击 `Connection`\
  \ 属性，然后单击 `<新连接...>`。此时会打开 ADO.Net 连接管理器编辑器。您可以配置 ADO.Net 连接管理器以连接到任何所需的 SQL Server\
  \ 数据库。您将执行一个通用查询，该查询适用于任何 SQL Server 关系数据库。\n\n我使用了一个名为 `vmDemo` 的虚拟机。我安装了一个 SQL\
  \ Server 2016 实例，名为 `vmDemo\\Demo`。我将 ADO.Net 连接管理器配置为连接到一个名为 `TestDB` 的数据库，如图 2-5\
  \ 所示。\n\n![../images/459435_1_En_2_Chapter/459435_1_En_2_Fig5_HTML.jpg](img/459435_1_En_2_Fig5_HTML.jpg)\n\
  \n图 2-5\n\n配置 ADO.Net 连接管理器\n\n单击“确定”，直到返回到执行 SQL 任务编辑器。在 `SQLStatement` 属性的“值”文本框中单击，然后单击省略号按钮打开“输入\
  \ SQL 查询”对话框。在此对话框中输入以下 Transact-SQL 语句：\n\n```\nSelect Count(*) As TableCount From\
  \ [sys].[tables]\n```\n\n为什么要为 `Count(*)` 的值设置别名？执行 SQL 任务期望返回值采用带有列名的表格格式（尤其是当分配给了\
  \ SSIS 变量时，下一步就会进行分配）。\n\n将 `ResultSet` 属性从“无”改为“单行”。单击执行 SQL 任务编辑器左侧列表框中的“结果集”页面。单击“添加”按钮，并将“结果名称”从\
  \ `NewResultName` 改为 `0`。单击 `0` 结果名称旁边的“变量名称”列中的下拉菜单，然后单击 `<新建变量...>` 打开“添加变量”对话框。确保“容器”设置为\
  \ `SimplePackage`。将变量命名为 `TableCount`，并将“值类型”属性设置为 Int32。提供默认值为 `0`。您的“添加变量”对话框应如图\
  \ 2-6 所示。\n\n![../images/459435_1_En_2_Chapter/459435_1_En_2_Fig6_HTML.jpg](img/459435_1_En_2_Fig6_HTML.jpg)\n\
  \n图 2-6\n\n添加新的 SSIS 变量\n\n您可以使用“添加变量”对话框中的“容器”下拉菜单选择 SSIS 变量的作用域。请注意此设置。如果执行 SQL\
  \ 任务位于序列容器中，则很容易错误地将变量的作用域限定为主机序列容器，而不是 SSIS 包。\n\n## 关于 SSIS 变量作用域的说明\n\n由于 SSIS\
