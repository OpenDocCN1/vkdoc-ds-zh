  Integration Services 目录节点下的 `SSISDB` 节点，将鼠标悬停在“报告”上，再悬停在“标准报告”上，然后单击“所有执行”，如图 8-3
  所示。


  ![../images/459435_1_En_8_Chapter/459435_1_En_8_Fig3_HTML.jpg](img/459435_1_En_8_Fig3_HTML.jpg)


