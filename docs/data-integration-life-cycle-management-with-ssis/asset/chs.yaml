- '# 3. 源代码管理


  在本书后面，我将讨论为什么通过备份和还原 `SSISDB` 数据库并非 SSIS 代码提升的可行方法。你应该像备份所有数据库一样备份 `SSISDB` 数据库。你不应该为了代码提升而备份
  `SSISDB` 数据库，也不应该用备份 `SSISDB` 数据库来替代源代码管理。


  开发者分为两类：正在使用源代码管理的，以及将要使用源代码管理的。有人问我：“Andy，哪种源代码管理引擎最好？”我的回答是：“你正在用的那个。”请务必使用源代码管理。


  本节并非关于源代码管理或使用 Team Foundation Services 的详尽教程。我不主张某一种源代码管理引擎优于另一种。


  在本章中，我将演示通过 Visual Studio Online (`visualstudio.com`) 使用 Team Foundation Services。我会交替使用“源代码管理”和“版本控制”这两个术语，因为现代的源代码管理引擎也同时管理软件版本。




  ## 源代码管理客户端


  根据你希望使用的源代码管理（或版本控制）引擎，你可能需要也可能不需要 Visual Studio 插件（或扩展）。许多开发者使用 Subversion（一种流行的开源版本控制系统）以及
  Tortoise SVN（一个实现为 Windows 外壳扩展的 Subversion 客户端）。Tortoise 是一个高度直观的界面，它集成到 Windows
  资源管理器中，通过右键单击包含受 Subversion 源代码管理的项目工件的文件系统文件夹，提供上下文相关的菜单。


  Git 是由 Linus Torvalds（Linux 的创建者）创建的流行版本控制系统。Git 是一个分布式源代码管理系统，这意味着每个开发者都维护着仓库的本地工作副本。Git
  在很大程度上依赖于*分支*（创建代码当前版本的另一个（通常是本地的）副本）和*合并*（将更改添加到代码的另一个（通常是本地的）已编辑版本的过程）。


  在本章中，我使用 Team Explorer，它是 Team Foundation Services (TFS) 的 Visual Studio 插件。你可以在
  `visualstudio.com/en-us/docs/tools` 上了解有关用于 TFS 的 Visual Studio 插件的更多信息。


