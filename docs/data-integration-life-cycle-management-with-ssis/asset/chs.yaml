  **图 7-12** Test 目录文件夹诞生了！


  我在本节开头提到，“这些脚本（以及 `ISPAC`）是幂等的……” 如果你重新执行刚刚用于创建 `Test` 目录文件夹的脚本，会发生什么？让我们回到 `SSMS`
