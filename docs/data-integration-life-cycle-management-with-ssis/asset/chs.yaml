  ## 部署失败


  有时，顺利的部署也会遭遇不测。你阅读本书可能是因为你遇到了由于善意地尝试还原 SSIS 目录数据库 `SSISDB` 而触发的部署失败。


  不建议使用备份和还原作为在 SSIS 目录之间提升或传输 SSIS 项目的方法！


  当你尝试在 `SSISDB` 被不当还原后向其部署 SSIS 项目（或包）时，部署将*不会*成功。相反，你的集成服务部署向导结果页面将显示如图 4-13 所示。


  ![../images/459435_1_En_4_Chapter/459435_1_En_4_Fig13_HTML.jpg](img/459435_1_En_4_Fig13_HTML.jpg)


  **图 4-13** 失败的 SSIS 项目部署


  当你单击“失败”链接时，图 4-13 中的消息框将显示错误消息：


  - 请先在该数据库中创建一个主密钥，或在会话中打开主密钥，然后执行此操作。(Microsoft SQL Server, Error: 15581)


  请在 SSIS 目录页面上标题为“备份、还原和移动 SSIS 目录”（`docs.microsoft.com/en-us/sql/integration-services/service/ssis-catalog`）的部分中查找有关备份和还原
  SSIS 目录数据库 (`SSISDB`) 的更多信息。我曾就此场景写过博客，该博文中包含一个可用于还原 `SSISDB` 的脚本。你可以在 `andyleonard.blog/2017/07/29/deploying-ssis-projects-to-a-restored-ssis-catalog-ssisdb`
  找到我题为“将 SSIS 项目部署到已还原的 SSIS 目录”的博文。我使用的脚本如下：




  ```sql

  /*

  用于将 SSISDB 恢复到 SQL Server 2016 SP1 实例的脚本。

  我遵循了 https://msdn.microsoft.com/en-us/library/hh213291(v=sql.130).aspx 上的说明。

  希望对您有所帮助，

  Andy Leonard

  *** 看到三个星号 "***" 处需要您执行操作

  */

  -- 如果 ##MS_SSISServerCleanupJobLogin## 登录名不存在，则创建该登录名。

  USE [master]

  GO

  print ''##MS_SSISServerCleanupJobLogin## 登录名''

  If Not Exists(Select [name]

  From sys.sql_logins

  Where [name] = ''##MS_SSISServerCleanupJobLogin##'')

  begin

  print '' – 正在创建 ##MS_SSISServerCleanupJobLogin## 登录名''

  CREATE LOGIN [##MS_SSISServerCleanupJobLogin##] WITH PASSWORD=N''DWehrJfiRgMxEFaE=KxomUkF7fnV3poW/ZQPJ''
  -- *** 请更改此密码 – Andy

  , DEFAULT_DATABASE=[master]

  , DEFAULT_LANGUAGE=[us_english]

  , CHECK_EXPIRATION=OFF

  , CHECK_POLICY=OFF

  print '' – ##MS_SSISServerCleanupJobLogin## 登录名已创建''

  end

  Else

  print '' – ##MS_SSISServerCleanupJobLogin## 已存在。''

  GO

  print ''''

  print '' – 正在禁用 ##MS_SSISServerCleanupJobLogin## 登录名''

  ALTER LOGIN [##MS_SSISServerCleanupJobLogin##] DISABLE

  print '' – ##MS_SSISServerCleanupJobLogin## 登录名已禁用''

  GO

  USE [master]

  GO

  SET ANSI_NULLS ON

  GO

  SET QUOTED_IDENTIFIER ON

  GO

  print ''dbo.sp_ssis_startup 存储过程''

  If Exists(Select s.name + ''.'' + p.name

  From sys.procedures p

  Join sys.schemas s

  On s.[schema_id] = p.[schema_id]

  Where s.[name] = ''dbo''

  And p.name = ''sp_ssis_startup'')

  begin

  print '' – 正在删除 dbo.sp_ssis_startup 存储过程''

  Drop PROCEDURE [dbo].[sp_ssis_startup]

  print '' – dbo.sp_ssis_startup 存储过程已删除''

  end

  print '' – 正在创建 dbo.sp_ssis_startup 存储过程''

  go

  CREATE PROCEDURE [dbo].[sp_ssis_startup]

  AS

  SET NOCOUNT ON

  /* 当前，IS 存储名称为 ''SSISDB'' */

  IF DB_ID(''SSISDB'') IS NULL

  RETURN

  IF NOT EXISTS(SELECT name FROM [SSISDB].sys.procedures WHERE name=N''startup'')

  RETURN

  /* 调用 SSISDB 中的存储过程 */

  /* 使用动态 SQL 处理 AlwaysOn 非可读模式*/

  DECLARE @script nvarchar(500)

  SET @script = N''EXEC [SSISDB].[catalog].[startup]''

  EXECUTE sp_executesql @script

  GO

  print '' – dbo.sp_ssis_startup 存储过程已创建''

  print ''''

  use master

  go

  print ''正在启用 SQLCLR''

  exec sp_configure ''clr enabled'', 1

  reconfigure

  print ''SQLCLR 已启用''

  print ''''

  print ''MS_SQLEnableSystemAssemblyLoadingKey 非对称密钥''

  If Not Exists(Select [name]

  From sys.asymmetric_keys

  Where [name] = ''MS_SQLEnableSystemAssemblyLoadingKey'')

  begin

  print '' – 正在创建 MS_SQLEnableSystemAssemblyLoadingKey''

  Create Asymmetric key MS_SQLEnableSystemAssemblyLoadingKey

  From Executable File = ''E:\Program Files\Microsoft SQL Server\130\DTS\Binn\Microsoft.SqlServer.IntegrationServices.Server.dll''  --
  *** 请检查此路径 – Andy

  print '' – MS_SQLEnableSystemAssemblyLoadingKey 已创建''

  end

  Else

  print '' – MS_SQLEnableSystemAssemblyLoadingKey 已存在。''

  go

  print ''''

  print ''MS_SQLEnableSystemAssemblyLoadingUser SQL 登录名''

  If Not Exists(Select [name]

  From sys.sql_logins

  Where [name] = ''MS_SQLEnableSystemAssemblyLoadingUser'')

  begin

  print '' – 正在尝试创建 MS_SQLEnableSystemAssemblyLoadingUser SQL 登录名''

  begin try

  Create Login MS_SQLEnableSystemAssemblyLoadingUser

  From Asymmetric key MS_SQLEnableSystemAssemblyLoadingKey

  print '' – MS_SQLEnableSystemAssemblyLoadingUser SQL 登录名已创建''

  print '' – 授予 MS_SQLEnableSystemAssemblyLoadingUser Unsafe Assembly 权限''

  Grant unsafe Assembly to MS_SQLEnableSystemAssemblyLoadingUser

  print '' – 已授予 MS_SQLEnableSystemAssemblyLoadingUser Unsafe Assembly 权限''

  end try

  begin catch

  print '' – 尝试创建 MS_SQLEnableSystemAssemblyLoadingUser SQL 登录名时出现问题，但这可能没问题...''

  -- 暂不处理

  end catch

  end

  Else

  print '' – MS_SQLEnableSystemAssemblyLoadingUser SQL 登录名已存在。''

  go

  print ''''

  print ''正在恢复 SSISDB''

  USE [master]

  begin try

  ALTER DATABASE [SSISDB] SET SINGLE_USER WITH ROLLBACK IMMEDIATE

  end try

  begin catch

  -- 忽略错误（通常因为数据库不存在而发生...）

  end catch

  RESTORE DATABASE [SSISDB]

  FROM DISK = N''E:\Andy\backup\SSISDB_SP1.bak''  -- *** 请检查此路径 – Andy

  WITH FILE = 1,

  MOVE N''data'' To N''E:\Program Files\Microsoft SQL Server\MSSQL13.TEST\MSSQL\DATA\SSISDB.mdf'',   --
  *** 请检查此路径 – Andy

  MOVE N''log'' TO N''E:\Program Files\Microsoft SQL Server\MSSQL13.TEST\MSSQL\DATA\SSISDB.ldf'',   --
  *** 请检查此路径 – Andy

  NOUNLOAD

  , REPLACE

  , STATS = 5

  ALTER DATABASE [SSISDB] SET MULTI_USER

  GO

  print '' – SSISDB 恢复完成''

  print ''''

  print ''为 dbo.sp_ssis_startup 存储过程设置 ProcOption 为 1''

  EXEC sp_procoption N''[dbo].[sp_ssis_startup]'', ''startup'', ''1''

  print ''已为 dbo.sp_ssis_startup 存储过程设置 ProcOption 为 1''

  GO

  print ''''

  Use SSISDB

  go

  print ''SSISDB 数据库中的 ##MS_SSISServerCleanupJobUser## 用户''

  If Not Exists(Select *

  From sys.sysusers

  Where [name] = ''##MS_SSISServerCleanupJobUser##'')

  begin

  print '' – 正在创建 ##MS_SSISServerCleanupJobUser## 用户''

  CREATE USER [##MS_SSISServerCleanupJobUser##] FOR LOGIN [##MS_SSISServerCleanupJobLogin##]
  WITH DEFAULT_SCHEMA=[dbo]

  print '' – ##MS_SSISServerCleanupJobUser## 用户已创建''

  end

  Else

  print '' – ##MS_SSISServerCleanupJobUser## 已存在。''

  GO

  print ''''

  /*

  -- 从文件中恢复主密钥的一种方法。

  -- 注意：您必须拥有原始的 SSISDB 加密密码！

  Restore master key from file = ''E:\Andy\backup\SSISDB_SP1_key''    -- *** 请检查此路径
  – Andy

  Decryption by password = ''SuperSecretPassword'' -- ''SSISDB 备份期间用于加密主密钥的密码''    --
  *** 请检查此密码 – Andy

  Encryption by password = ''SuperSecretPassword'' -- ''新密码''    -- *** 请检查此密码 – Andy

  Force

  go

  */

  -- 从文件中恢复主密钥的另一种方法。

  -- 注意：您必须拥有原始的 SSISDB 加密密码！

  print ''正在打开主密钥''

  Open master key decryption by password = ''SuperSecretPassword'' --''创建 SSISDB 时使用的密码''   --
  *** 请检查此密码 – Andy

  Alter Master Key

  Add encryption by Service Master Key

  go

  print ''主密钥已打开''

  print ''''

  print ''正在检查 SSIS 目录架构版本''

  exec [catalog].check_schema_version @use32bitruntime = 0

  ```


  上面列出的 Transact-SQL 脚本要求您提供用于创建 SSIS 目录的密码；请将文本 `“SuperSecretPassword”` 替换为您 SSIS
  目录的密码。每当您看到注释 `-- *** check this, please – Andy` 时，请检查前面的 T-SQL 行。


  ## 结论


  在本章中，我演示了将 SSIS 项目部署到 SSIS 目录。您学习了 Integration Services 部署向导的 GUI 和 CLI。我讨论了在践行
  DevOps 的任何企业中部署的重要性。




  '
- "# 5. 配置 SSIS 目录项目\n\n企业级 DevOps 的一个关键原则是*外部化*，即对代码进行配置或参数化。配置与代码本身分开存储。外部化促进了代码复用并支持解耦，这两者都是软件开发中的最佳实践。在本章中，我将重点介绍如何外部化\
  \ SSIS 连接管理器连接字符串属性，因为我相信通过外部配置来管理 SSIS 项目和包连接字符串是一项 SSIS 最佳实践。\n\n你的 `DILMSample`\
  \ SSIS 项目已部署到你的 SSIS 目录中。在 SSMS 对象资源管理器中展开 Integration Services Catalogs 节点，会显示出如图\
  \ 5-1 所示的视图。\n\n![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig1_HTML.jpg](img/459435_1_En_5_Fig1_HTML.jpg)\n\
  \n图 5-1  \nSSMS 对象资源管理器显示的 Integration Services Catalogs 节点中的 `DILMSample` SSIS\
  \ 项目\n\n你可以看到 SSIS 目录（`SSISDB`）、两个 SSIS 目录文件夹（`Framework` 和 `Test`）、`Test` 目录文件夹中的一个\
  \ SSIS 目录项目（`DILMSample`），以及 `DILMSample` 目录项目中的一个 SSIS 包（`SimplePackage.dtsx`）。\n\
  \n为什么我在某些地方写 *SSIS 项目*，而在其他地方写 *SSIS 目录项目*？我指的是两个不同的对象。\n\n1.  SSIS 项目存在于 SQL Server\
  \ Data Tools (SSDT) 环境中。它是一个正在开发中的项目（希望是受源代码控制的）。\n2.  SSIS 目录项目是一个已部署到 SSIS 目录中的\
  \ SSIS 项目。\n\n将 SSIS 目录项目视为独立且不同的对象，与存在于 SSIS 目录外部的 SSIS 项目区分开，这将有助于理解，尤其是在考虑 SSIS\
  \ 目录项目配置时。两者之间的耦合关系很弱：对 SSIS 项目所做的更改可能会影响其相关的 SSIS 目录项目，并且仅在部署到 SSIS 目录之后才会生效。对\
  \ SSIS 目录项目所做的更改绝不会影响 SSIS 项目。\n\n## 配置项目\n\n你有多个选项来配置你的 SSIS 目录项目。在 SSMS 对象资源管理器的\
  \ Integration Services Catalogs 节点中，展开子节点直到 `DILMSample` 项目级别。右键单击 `DILMSample`\
  \ SSIS 目录项目，然后点击“配置”，如图 5-2 所示。\n\n![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig2_HTML.jpg](img/459435_1_En_5_Fig2_HTML.jpg)\n\
  \n图 5-2  \n准备配置 `DILMSample` 目录项目\n\n“配置 – `DILMSample`”对话框随即打开。\n\n## 配置连接\n\n\
  SSIS 目录将连接管理器属性视为参数。实际上，如果你查询 `[catalog].[object_parameters]` 视图，你会发现一些名称类似于 `CM.<SSIS\
  \ 连接管理器名称>.ConnectionString` 的参数。这是一个连接管理器参数。我很确定 `CM` 代表“连接管理器”。`<SSIS 连接管理器名称>.ConnectionString`\
  \ 无疑是连接管理器的 `ConnectionString` 属性。\n\n当“配置 – `DILMSample`”窗口显示时，单击“连接管理器”选项卡以查看连接的配置，如图\
  \ 5-3 所示。\n\n![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig3_HTML.jpg](img/459435_1_En_5_Fig3_HTML.jpg)\n\
  \n图 5-3  \n查看连接管理器的配置\n\n请注意“参数”和“连接管理器”选项卡下方的列表框。它显示了容器（一个目录项目工件）和名称（连接管理器的名称）。我的\
  \ SSIS 项目在 `SimplePackage.dtsx` 中包含一个连接管理器，因此 `SimplePackage.dtsx` 是容器，连接管理器名称是\
  \ `vmDemo\\Demo.TestDB1`。你的连接管理器名称几乎肯定会不同，你的 `ConnectionString` 属性也会不同，接下来你将关注这一点。\n\
  \n`ConnectionString` 属性中的值是在设计时配置的值。SSIS 目录始终可以访问设计时的默认值。如果我按当前配置在 SSIS 目录中执行 `SimplePackage.dtsx`\
  \ SSIS 包，它将执行并尝试连接到 SQL Server 的 `vmDemo\\Demo` 实例和 `TestDB` 数据库。由于我已将此 SSIS 项目部署到托管在\
  \ `vmDemo\\Demo` SQL Server 实例上的 SSIS 目录，`SimplePackage.dtsx` 包应该可以正常执行。\n\n但是，当我将\
  \ `DILMSample` SSIS 项目部署到*不同*的 SSIS 目录时会发生什么？`SimplePackage.dtsx` 可能成功执行，也可能不成功，这取决于许多影响一台服务器上运行的进程能否连接到其他服务器上托管的\
  \ SQL Server 实例的因素。\n\n需要记住的一个关键点是：按照当前的 SSIS 项目配置，每次我部署 `DILMSample` SSIS 项目时，`SimplePackage.dtsx`\
  \ 中 `vmDemo\\Demo.TestDB1` 连接管理器的默认值将*始终*被配置为连接到 SQL Server 的 `vmDemo\\Demo` 实例以及该实例上的\
  \ `TestDB` 数据库。\n\n\n\n### 重写连接配置\n\n如何更改连接配置？点击图 5-4 中圈出的`ConnectionString`属性`Value`文本框右侧的省略号。\n\
  \n![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig4_HTML.jpg](img/459435_1_En_5_Fig4_HTML.jpg)\n\
  \n*图 5-4 – 准备打开 ConnectionString 值的配置*\n\n**设置参数值**对话框随之打开。\n\n在 SSIS 目录中，项目参数、包参数以及连接管理器属性均被视为参数。\n\
  \n选中并复制`ConnectionString`属性的设计时默认值（位于“使用包中的默认值”选项旁的文本框内），然后将其粘贴到“编辑值”文本框中，如图 5-5\
  \ 所示。\n\n![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig5_HTML.jpg](img/459435_1_En_5_Fig5_HTML.jpg)\n\
  \n*图 5-5 – 编辑 ConnectionString 属性值*\n\n将`ConnectionString`粘贴到**编辑值**文本框后，我做了一些修改。我删除了`Application\
  \ Name`设置中的一个`Guid`值，并将数据源从`vmDemo\\Demo`更改为`(local)\\Demo`。从技术上讲，数据源与之前相同。我这样做是为了之后能明确判断正在使用的是哪一个值：设计时默认值还是此*字面量重写*。\n\
  \n点击**确定**按钮，进入图 5-6 所示的重写页面。\n\n![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig6_HTML.jpg](img/459435_1_En_5_Fig6_HTML.jpg)\n\
  \n*图 5-6 – 目录项目字面量重写*\n\n`ConnectionString`的值已被 SSIS 目录字面量重写所覆盖。这通过值的**粗体文字样式**来表示。你可以将字面量重写理解为在\
  \ SSIS 目录中硬编码一个配置值。后续将`DILMSample` SSIS 项目部署到此 SSIS 目录时，即使你更改了连接管理器的设计时默认`ConnectionString`值，字面量重写的值*也不会*改变。这就是为什么我将\
  \ SSDT 中的项目称为*SSIS 项目*，而将其部署到 SSIS 目录后称为*SSIS 目录项目*或*目录项目*的原因之一。\n\n作为拥有 SSIS 目录配置权限的人，你随时可以通过在**设置参数值**对话框中选择“使用包中的默认值”选项，将任何字面量重写恢复为设计时默认值，如图\
  \ 5-7 所示。\n\n![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig7_HTML.jpg](img/459435_1_En_5_Fig7_HTML.jpg)\n\
  \n*图 5-7 – 重新选择设计时默认值*\n\n值的文字样式恢复为无样式，并且值恢复为设计时默认值，如图 5-8 所示。\n\n![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig8_HTML.jpg](img/459435_1_En_5_Fig8_HTML.jpg)\n\
  \n*图 5-8 – 恢复为设计时默认值*\n\n### 外部化连接配置\n\n到目前为止，你已经了解了 SSIS 目录项目配置设置的两个来源：设计时默认值和字面量重写。你可能注意到**设置参数值**对话框上第三个选项是禁用的。“使用环境变量”是第三个选项，但需要额外配置才能启用。\n\
  \n在进入下一个演示之前，我们来讨论一下 SSIS 目录如何管理*外部化*。外部化是指将值存储在其他位置，以便在运行时使用。SSIS 目录的外部化机制是 SSIS\
  \ 目录环境。目录环境包含一系列目录环境变量，这些变量又包含在运行时用于覆盖目录项目参数值的值。\n\n鉴于上一段所包含信息的深度和重要性，其篇幅相对较短。在继续之前，请先充分理解。\n\
  \n我们来更详细地讨论 SSIS 目录的外部化机制。先从 SSIS 目录环境开始，如图 5-9 所示。\n\n![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig9_HTML.jpg](img/459435_1_En_5_Fig9_HTML.jpg)\n\
  \n*图 5-9 – 一个目录环境（示意）*\n\nSSIS 目录环境包含零个或多个 SSIS 目录环境变量，如图 5-10 所示。\n\n![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig10_HTML.jpg](img/459435_1_En_5_Fig10_HTML.jpg)\n\
  \n*图 5-10 – 目录环境中的目录环境变量*\n\n要将 SSIS 目录环境连接到 SSIS 目录项目，SSIS 目录使用*引用*。引用简单来说就是将目录项目与目录环境关联起来的关系，如图\
  \ 5-11 所示。\n\n![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig11_HTML.jpg](img/459435_1_En_5_Fig11_HTML.jpg)\n\
  \n*图 5-11 – 关联 SSIS 目录项目与 SSIS 目录环境的引用*\n\n为了使目录项目中的参数能够使用目录环境变量的值，需要创建*引用映射*。引用映射将存储在\
  \ SSIS 目录环境变量中的值映射到 SSIS 目录项目中的参数，如图 5-12 所示。\n\n![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig12_HTML.jpg](img/459435_1_En_5_Fig12_HTML.jpg)\n\
  \n*图 5-12 – SSIS 目录项目参数与 SSIS 目录环境变量之间的引用映射*\n\n重申一下，由于这可能是一个具有挑战性的话题：首先，您需要创建并配置一个\
  \ SSIS 目录环境。配置目录环境包括定义 SSIS 目录环境变量。这是外部化的第一步。\n\n接下来，您需要创建一个 SSIS 目录环境与 SSIS 目录项目之间的引用。创建引用是外部化的第二步。\n\
  \n然后，您可以通过引用将 SSIS 目录环境变量分配给 SSIS 目录项目参数。这就是引用映射。通过引用将参数值映射到目录环境变量值是外部化的第三步。\n\n\
  让我们通过一个演示来演练这个过程。\n\n## 创建环境\n\n在 SSIS 目录中，右键单击`Test`目录文件夹下的`Environments`虚拟文件夹，然后点击**创建环境**，如图\
  \ 5-13 所示。\n\n![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig13_HTML.jpg](img/459435_1_En_5_Fig13_HTML.jpg)\n\
  \n*图 5-13 – 准备创建目录环境*\n\n当**创建环境**对话框显示时，提供环境名称和可选的描述，如图 5-14 所示。\n\n![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig14_HTML.jpg](img/459435_1_En_5_Fig14_HTML.jpg)\n\
  \n*图 5-14 – 创建 SSIS 目录环境*\n\n点击**确定**关闭**创建环境**对话框。\n\n\n\n### 配置环境\n\n在 SSIS 目录中展开\
  \ `Environments` 虚拟文件夹。右键单击新建的目录环境，然后单击“属性”，如图 5-15 所示。\n\n![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig15_HTML.jpg](img/459435_1_En_5_Fig15_HTML.jpg)\n\
  \n图 5-15 — 准备配置 SSIS 目录环境变量\n\n单击“变量”页面。为目录环境变量添加名称（我将其命名为 `ConnectionString`）。将类型设置为\
  \ String。在“值”字段中添加一个有效的连接字符串，如图 5-16 所示。\n\n![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig16_HTML.jpg](img/459435_1_En_5_Fig16_HTML.jpg)\n\
  \n图 5-16 — 配置 SSIS 目录环境变量\n\n单击“确定”按钮关闭“环境属性”对话框。\n\n### 配置引用\n\n右键单击 DILMSample\
  \ 目录项目，然后单击“配置”。当“配置 – DILMSample”对话框打开时，单击“引用”页面。单击“添加”按钮，在“浏览环境”对话框中的 `Local Folder\
  \ (Test)` 虚拟文件夹下选择刚刚创建的目录环境，如图 5-17 所示。\n\n![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig17_HTML.jpg](img/459435_1_En_5_Fig17_HTML.jpg)\n\
  \n图 5-17 — 选择用于引用的目录环境\n\n在“浏览环境”对话框中，实际上有两个“路径”可以访问 `envConnection1` 目录环境。`Local\
  \ Folder` 路径在 SSIS 目录术语中创建了一个“相对”引用。如果展开 SSISDB ➤ Test 文件夹，你可以选择*相同*的 `envConnection1`\
  \ 目录环境。这将创建一个“绝对”引用。\n\n单击“确定”按钮选择用于引用的目录环境。“配置 – DILMSample”引用页面将类似于图 5-18 所示。\n\
  \n![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig18_HTML.jpg](img/459435_1_En_5_Fig18_HTML.jpg)\n\
  \n图 5-18 — 引用已配置！\n\n请注意“环境文件夹”列中的“.”；它表示你选择了一个本地目录环境，或者一个与目录项目来自*相同*目录文件夹的目录环境。\n\
  \n### 配置引用映射\n\n单击“参数”页面，然后单击“连接管理器”选项卡。单击唯一连接管理器的 `ConnectionString` 属性旁边的省略号，打开“设置参数值”对话框。请注意，所有三个值配置选项现在都已启用。选择“使用环境变量”选项，然后从下拉列表中选择\
  \ `ConnectionString` 目录环境变量，如图 5-19 所示。\n\n![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig19_HTML.jpg](img/459435_1_En_5_Fig19_HTML.jpg)\n\
  \n图 5-19 — 为引用映射选择目录环境变量\n\n单击“确定”按钮，在 SSIS 目录项目参数、`SimplePackage.dtsx` 的 `vmDemo\\\
  Demo\\testDB1` 连接管理器 `ConnectionString`，以及你几分钟前创建的目录环境引用中名为 `ConnectionString` 的\
  \ SSIS 目录环境变量之间创建引用映射。你的“配置 – DILMSample”对话框现在应该类似于图 5-20 所示。\n\n![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig20_HTML.jpg](img/459435_1_En_5_Fig20_HTML.jpg)\n\
  \n图 5-20 — 引用映射完成！\n\n请注意，`ConnectionString` 属性的值现在是 SSIS 目录环境变量的名称，并且文本带有下划线修饰。\n\
  \n## 测试配置\n\n要测试配置，你需要在 SSIS 目录中执行 SSIS 包。右键单击 `SimplePackage.dtsx`，然后单击“执行”，如图\
  \ 5-21 所示。\n\n![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig21_HTML.jpg](img/459435_1_En_5_Fig21_HTML.jpg)\n\
  \n图 5-21 — 执行 `SimplePackage.dtsx`\n\n当“执行包”对话框显示时，你会在对话框顶部看到一个错误消息。单击该错误，可在消息框中显示错误消息，如图\
  \ 5-22 所示。\n\n![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig22_HTML.jpg](img/459435_1_En_5_Fig22_HTML.jpg)\n\
  \n图 5-22 — 显示执行包错误消息\n\n要清除错误，请按照错误消息中的说明进行操作。选中“环境”复选框，然后从下拉列表中选择一个 SSIS 目录环境，如图\
  \ 5-23 所示。\n\n![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig23_HTML.jpg](img/459435_1_En_5_Fig23_HTML.jpg)\n\
  \n图 5-23 — 选择一个 SSIS 目录环境\n\n执行包错误已清除。单击“确定”按钮执行 `SimplePackage.dtsx` SSIS 包。一个类似于图\
  \ 5-24 所示的消息框会通知你包执行已开始，并询问你是否要查看概述报告。\n\n![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig24_HTML.jpg](img/459435_1_En_5_Fig24_HTML.jpg)\n\
  \n图 5-24 — 概述报告提示\n\n单击“是”按钮显示概述报告，如图 5-25 所示。\n\n![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig25_HTML.jpg](img/459435_1_En_5_Fig25_HTML.jpg)\n\
  \n图 5-25 — 概述报告\n\n请注意 `vmDemo\\Demo.TestDB1.ConnectionString` 参数的值。运行时的值是你在名为 `envConnection1`\
  \ 的目录环境中配置的 `ConnectionString` 目录环境变量的值。此测试验证引用映射已正确配置且正常工作。\n\n## 结论\n\n以下是 SSIS\
  \ 目录中 SSIS 参数的三个值来源（附带匹配的文本修饰）：\n\n1.  设计时默认值\n2.  文本替代值\n3.  引用映射\n\n设计时默认值仍存储在\
  \ SSIS 目录中，但可以使用文本替代值或引用以及引用映射分别覆盖到目录环境和环境变量。\n\n"
- '# 6. 目录浏览器


  我很荣幸连续五年（2007-2012）成为微软 SQL Server MVP。成为微软 MVP 的一个好处是可以接触到内部开发团队。每个人都可以提交 Microsoft
  Connect 项来报告错误或提出产品改进建议。许多 MVP 这样做后，他们的错误报告被标记为“按设计工作”或“不修复”，而建议也得到类似回复。这令人沮丧。许多
  Connect 项以这种方式处理是有原因的。我很高兴地报告，根本原因（基于性能的管理，即 PBM）已被放弃，*并且*微软开发团队确实在倾听并响应来自实际需求的请求。




  ## 我为何构建 DILM Suite —— 作者：安迪·伦纳德


  这并非意味着每一条建议都会得到采纳（我保证这不是抱怨）。事实证明，微软是一家软件开发企业。即便微软规模如此庞大，也不可能对*每一条*请求都做出回应。当我意识到这一点时，我开始思考如何弥补我所察觉到的这些缺口。我曾与人共同创立了一家咨询公司，而我们（集体而言）对成为一家软件产品公司并不感兴趣。但我对开发产品来解决数据集成生命周期管理（`DILM`）方面的缺口*非常*感兴趣。


  2015 年，我离开了共同创立的咨询公司，并立即开始开发我梦想已久的软件。在我看来，对于“为什么？”这个问题，最公平的回答如下：


  1.  我开始相信微软 SSIS 开发团队永远不会解决那些我认为是产品故事中“缺口”的问题。

  2.  我开始相信，我与共同创立的咨询公司对于如何解决 `DILM` 问题，持有不可调和的分歧。


  时隔两年回顾，我相信专注于 `DILM` 对我来说是长期最佳的选择。我创办了另一家咨询公司——Enterprise Data & Analytics (`entdna.com`)，主要是为了资助我的编码爱好。


  ### 展示 SSIS 目录


  让我们看看 SSMS 对象浏览器的“Integration Services 目录”节点中展示的 SSIS 目录表面，如图 6-1 所示。


  ![../images/459435_1_En_6_Chapter/459435_1_En_6_Fig1_HTML.jpg](img/459435_1_En_6_Fig1_HTML.jpg)


  **图 6-1** —— SSMS 对象浏览器“Integration Services 目录”节点中显示的 SSIS 目录


  在“Integration Services 目录”节点下，我们找到了名为 `SSISDB` 的 SSIS 目录。显示了两个目录文件夹：`Framework`
  和 `Test`。`Test` 文件夹包含 `Projects` 和 `Environments` 虚拟文件夹。`Projects` 虚拟文件夹包含名为 `DILMSample`
  的 SSIS 目录项目，该项目又包含名为 `SimplePackage.dtsx` 的 SSIS 包。`Environments` 虚拟文件夹包含名为 `envConnection1`
  的目录环境。


  因为您已经完成了相关工作，所以您知道这里的信息远不止表面上看到的这些。


  ### SSIS 目录环境配置


  如果双击 `envConnection1`，您可以在“变量”页面上看到目录环境变量的详细信息，如图 6-2 所示。


