- '# 4. 部署到 SSIS 目录


  SSIS 目录随 SSIS 2012 一起发布。自 2012 年以来，SSIS 的每个版本都对目录功能进行了升级。有几种方法可以将 SSIS 项目部署到 SSIS
  目录。在本章中，我将介绍两种部署选项：


  * 从 SSDT 部署

  * 从 ISPAC 文件部署


  DevOps 的一个关键原则是自动化，在本章中，我将讨论并演示自动化的 SSIS 部署。


  ## 从 SSDT 部署


  自 SSIS 目录首次发布以来，SSIS 一直保持向后兼容。在 2012 年之前，SSIS 的部署模型没有名称；只有一种部署 SSIS 的方式和三个目标：文件系统、MSDB
  数据库和“SSIS 包存储区”（默认情况下，它是文件系统中的一个文件夹和 MSDB 数据库的组合）。部署到 SSIS 目录是一种部署 SSIS 包的新方式，因此我们需要为“旧方式”和“新方式”命名。新方式称为“项目部署模型”，旧方式称为“包部署模型”。


  在本章（以及本书）中，我将重点介绍项目部署模型。将 SSIS 包部署到 SSIS 目录需要使用项目部署模型。


  要部署你的演示项目，请在 SSDT 中打开该项目，右键单击解决方案资源管理器中的项目名称，然后单击“部署”，如图 4-1 所示。


  ![../images/459435_1_En_4_Chapter/459435_1_En_4_Fig1_HTML.jpg](img/459435_1_En_4_Fig1_HTML.jpg)


  **图 4-1** 从 SSDT 部署 DILMSuite SSIS 项目


  Integration Services 部署向导是一个*非常*实用的软件。其底层可执行文件 `ISDeploymentWizard.exe` 具有图形用户界面
  (GUI) *和*命令行界面 (CLI)。该实用程序支持从 ISPAC 文件部署到 SSIS 目录，以及从 SSIS 目录部署到 SSIS 目录；并且从 SSIS
  2016 开始，它同时支持包部署和项目部署。我不会深入探讨这个出色的应用程序；只要知道我非常欣赏 Integration Services 部署向导所体现出的卓越性能即可。


  Integration Services 部署向导会显示“简介”页面或“选择目标”页面（如果你之前在“简介”页面上选中了“不再显示此页面”复选框），如图 4-2
  所示。


  ![../images/459435_1_En_4_Chapter/459435_1_En_4_Fig2_HTML.jpg](img/459435_1_En_4_Fig2_HTML.jpg)


  **图 4-2** Integration Services 部署向导的“简介”页面


  如果显示了“简介”页面，请单击“下一步”按钮，继续进入“选择目标”页面。


  我是不是跳过了“选择源”页面？是的。从 SSDT 内部启动时，Integration Services 部署向导已经拥有所需关于源的信息。


  输入托管你的 SSIS 目录的服务器名称。单击“浏览”按钮以选择目标目录文件夹。完成后，你的“选择目标”页面应类似于图 4-3 所示。


  ![../images/459435_1_En_4_Chapter/459435_1_En_4_Fig3_HTML.jpg](img/459435_1_En_4_Fig3_HTML.jpg)


  **图 4-3** Integration Services 部署向导的“选择目标”页面


  “选择目标”页面上显示的“路径”值是指 SSIS 项目的 SSIS 目录路径。SSIS 目录项目包含在 SSIS 目录文件夹中，而该文件夹又包含在 SSIS 目录中（该目录始终命名为
  SSISDB）。SSIS 包包含在 SSIS 目录项目中。


  单击“下一步”按钮继续进入“审阅”页面，如图 4-4 所示。


  ![../images/459435_1_En_4_Chapter/459435_1_En_4_Fig4_HTML.jpg](img/459435_1_En_4_Fig4_HTML.jpg)


  **图 4-4** 审阅部署选择项和选项


  很容易对 Integration Services 部署向导的“审阅”页面一扫而过，但我想请你在此稍作停留，因为这里有一些信息可能在将来（或现在）对你有用。




  ## 通过命令行部署


  通过 CLI 进行部署功能强大，对于 DevOps 自动化非常有用。源和目标信息不言自明。请注意，在截图中，我右键单击了命令行，弹出了一个仅有一个“复制”选项的上下文菜单。我已将命令行粘贴在此处：


  ```

  Command line: /Silent /ModelType:Project /SourcePath:"E:\Projects\DILMSample\DILMSample\bin\Development\DILMSample.ispac"
  /DestinationServer:"vmDemo\Demo" /DestinationPath:"/SSISDB/Test/DILMSample"

  ```


  SSIS 附带了大量实用工具，其中一些可以从命令提示符调用。任何可以从命令提示符调用的实用工具都可以通过 SQL 代理（前提是启用了命令行执行）、Windows
  计划程序或几乎任何其他计划服务或实用工具进行调度。


  为了使用集成服务部署向导审阅页面上共享的命令行，你需要了解两件事：


  1. 可执行文件的位置

  2. 开关和值的含义


  我将 SQL Server 的 Demo 实例安装在 `vmDemo` 的 `E:` 盘上，因此 `ISDeploymentWizard.exe` 的位置是 `E:\Program
  Files\Microsoft SQL Server\130\DTS\Binn\ISDeploymentWizard.exe`，如图 4-5 所示。


  ![../images/459435_1_En_4_Chapter/459435_1_En_4_Fig5_HTML.jpg](img/459435_1_En_4_Fig5_HTML.jpg)


  **图 4-5** `ISDeploymentWizard.exe` 文件的位置


  这正是当前已打开并正在执行的同一应用程序；它是集成服务部署向导的可执行文件。如前所述，该可执行文件提供了两个接口：一个 GUI 和一个 CLI。你可以通过打开命令提示符，提供
  `ISDeploymentWizard.exe` 的路径，然后跟上上述命令行，来执行整个 SSIS 项目 DILMSuite 的部署。不相信？看看图 4-6。


  ![../images/459435_1_En_4_Chapter/459435_1_En_4_Fig6_HTML.jpg](img/459435_1_En_4_Fig6_HTML.jpg)


  **图 4-6** 通过命令行进行部署


  这里有好消息也有坏消息。好消息是此次执行成功了。坏消息呢？如果执行成功，不会提供任何反馈。你如何判断它成功了？嗯，它没有失败。失败是什么样子的？失败可能会导致
  CLI 弹出一条提示，给出可接受的开关列表，如图 4-7 所示。


