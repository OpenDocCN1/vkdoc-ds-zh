  **图 6-2** —— 查看 SSIS 目录环境的“变量”页面


  “变量”页面包含 SSIS 目录环境变量的详细信息，包括名称、数据类型、描述、值以及该变量是否为敏感变量。


  ### SSIS 目录项目配置


  在“SSIS 目录项目配置”对话框的“参数”页面上，“参数”选项卡列出了 SSIS 项目和包参数、它们的容器名称以及默认值，如图 6-3 所示。


