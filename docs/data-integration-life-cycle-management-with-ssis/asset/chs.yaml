  ## SSIS Framework Community Edition


  SSIS 开发中的一个最佳实践是构建小型的、面向工作单元的 SSIS 包。这样做的原因有如下几个：


  -   **解耦**：SSIS 是软件开发，而软件开发的最佳实践之一就是关注点分离。关注点分离主要通过解耦来实现。解耦 SSIS 的一种方法是构建小型的、单一功能的
  SSIS 包。

  -   **测试**：如果一个 SSIS 包包含七个数据流任务，并且源表的设计发生了变化导致其中一个数据流任务中断，那么该 SSIS 包中的所有任务都应该进行测试。数据流任务越少，意味着测试工作量越小、速度越快。

  -   **支持**：如果所有 SSIS 包都包含最少的数据流任务（理想情况下是一个），并且某个包在半夜执行失败，那么值班支持人员就能很好地知道从何处开始进行故障排除。


  尽管这些是使用多个较小的 SSIS 包来构建 SSIS 解决方案的充分且合理的理由，但遵循此建议会引发其他问题。一个问题是，您现在有了一堆需要按某种顺序执行的
  SSIS 包。数据集成开发人员该怎么办呢？


  ## SSIS Framework Community Edition


  考虑一下 SSIS Framework Community Edition，这是一个免费的开源解决方案，可在 `dilmsuite.com/ssis-framework-community-edition`
  获取。SSIS Framework Community Edition 允许通过执行单个存储过程并向其传递单个参数，以指定的执行顺序执行一个或多个 SSIS 包。例如，我可以使用以下
  Transact-SQL 语句执行一个测试框架应用程序：


  ```

  exec custom.execute_catalog_parent_package @application_name = ''Framework Test
  ''

  ```


  延续我“天下没有免费的午餐”这一主题，SSIS 执行框架极大地简化了像上面列出的那种执行命令，但它们也带来了另一个问题：需要管理大量的元数据。SSIS Framework
  Community Edition 依赖元数据来构建前面提到的 *框架应用程序*。框架应用程序是配置为按指定顺序执行的一组 SSIS 包。如果您构建包含 `print`
  语句（以便让您了解 T-SQL 正在执行什么操作）并使用某种格式的幂等（可重新执行）Transact-SQL，那么每个 SSIS 包大约需要 30-40 行 Transact-SQL。这是大量的
  T-SQL。


  ### 对已部署的 SSIS 目录项目的帮助


  也许您正在读到这里并想：“这太棒了，但我的 SSIS 目录中已经部署了海量的 SSIS 包。它们该怎么办？”我在 `andyleonard.blog/2017/07/26/adding-an-ssis-application-to-ssis-framework-community-edition`
  写了一篇题为“将 SSIS 应用程序添加到 SSIS Framework Community Edition”的博文。我在那篇文章的末尾包含了一个脚本，该脚本使用三个参数（框架应用程序名称、目录文件夹名称和目录项目名称），并利用这三条元数据将新框架应用程序的元数据加载到
  SSIS Framework Community Edition 的元数据表中，如图 8-1 所示。


  ![../images/459435_1_En_8_Chapter/459435_1_En_8_Fig1_HTML.jpg](img/459435_1_En_8_Fig1_HTML.jpg)


  **图 8-1** 从 SSIS 目录项目构建框架应用程序


  该脚本读取图 8-2 所示的 SSIS 目录项目元数据，并在几秒钟内将框架应用程序元数据加载到 SSIS Framework Community Edition
  的元数据表中。


  ![../images/459435_1_En_8_Chapter/459435_1_En_8_Fig2_HTML.jpg](img/459435_1_En_8_Fig2_HTML.jpg)


  **图 8-2** SSIS 目录项目


  名为“Load AdventureWorks2014 Stage”的框架应用程序包含 71 个 SSIS 包，现在可以使用以下 Transact-SQL 语句来执行：


  ```

  exec custom.execute_catalog_parent_package @application_name = ''Load AdventureWorks2014
  Stage''

  ```


