    Andy`, please check the preceding line of T-SQL.


    ## Conclusion


    In this chapter, I demonstrated deploying an SSIS project to the SSIS catalog.
    You examined the Integration Services Deployment Wizard’s GUI and CLI. I discussed
    the importance of deployment in any enterprise that practices DevOps.'
