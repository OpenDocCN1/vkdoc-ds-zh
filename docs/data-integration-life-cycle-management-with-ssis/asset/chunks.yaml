    ## 通过命令行部署


    通过 CLI 进行部署功能强大，对于 DevOps 自动化非常有用。源和目标信息不言自明。请注意，在截图中，我右键单击了命令行，弹出了一个仅有一个“复制”选项的上下文菜单。我已将命令行粘贴在此处：


    ```

    Command line: /Silent /ModelType:Project /SourcePath:"E:\Projects\DILMSample\DILMSample\bin\Development\DILMSample.ispac"
    /DestinationServer:"vmDemo\Demo" /DestinationPath:"/SSISDB/Test/DILMSample"

    ```


    SSIS 附带了大量实用工具，其中一些可以从命令提示符调用。任何可以从命令提示符调用的实用工具都可以通过 SQL 代理（前提是启用了命令行执行）、Windows
    计划程序或几乎任何其他计划服务或实用工具进行调度。


    为了使用集成服务部署向导审阅页面上共享的命令行，你需要了解两件事：


    1. 可执行文件的位置

    2. 开关和值的含义


    我将 SQL Server 的 Demo 实例安装在 `vmDemo` 的 `E:` 盘上，因此 `ISDeploymentWizard.exe` 的位置是
    `E:\Program Files\Microsoft SQL Server\130\DTS\Binn\ISDeploymentWizard.exe`，如图
    4-5 所示。


    ![../images/459435_1_En_4_Chapter/459435_1_En_4_Fig5_HTML.jpg](img/459435_1_En_4_Fig5_HTML.jpg)


    **图 4-5** `ISDeploymentWizard.exe` 文件的位置


    这正是当前已打开并正在执行的同一应用程序；它是集成服务部署向导的可执行文件。如前所述，该可执行文件提供了两个接口：一个 GUI 和一个 CLI。你可以通过打开命令提示符，提供
    `ISDeploymentWizard.exe` 的路径，然后跟上上述命令行，来执行整个 SSIS 项目 DILMSuite 的部署。不相信？看看图 4-6。


    ![../images/459435_1_En_4_Chapter/459435_1_En_4_Fig6_HTML.jpg](img/459435_1_En_4_Fig6_HTML.jpg)


    **图 4-6** 通过命令行进行部署


    这里有好消息也有坏消息。好消息是此次执行成功了。坏消息呢？如果执行成功，不会提供任何反馈。你如何判断它成功了？嗯，它没有失败。失败是什么样子的？失败可能会导致
    CLI 弹出一条提示，给出可接受的开关列表，如图 4-7 所示。


    ![../images/459435_1_En_4_Chapter/459435_1_En_4_Fig7_HTML.jpg](img/459435_1_En_4_Fig7_HTML.jpg)


    **图 4-7** 使用 CLI 部署失败


    这并非唯一的失败响应。例如，如果你错误地键入了目标服务器的名称，在 `ISDeploymentWizard.exe` 尝试联系服务器 30 秒后，你会收到一条“连接失败”的消息。该消息显示效果类似于图
    4-8。


    ![../images/459435_1_En_4_Chapter/459435_1_En_4_Fig8_HTML.jpg](img/459435_1_En_4_Fig8_HTML.jpg)


    **图 4-8** 因连接错误导致的部署失败


    另一种检测是否成功的方法是使用 SSMS 连接到 SSIS 目录并检查你的 SSIS 项目是否存在，如图 4-9 所示。


    ![../images/459435_1_En_4_Chapter/459435_1_En_4_Fig9_HTML.jpg](img/459435_1_En_4_Fig9_HTML.jpg)


    **图 4-9** 已部署到 SSIS 目录的 SSIS 项目


    不过，如果 SSIS 项目之前已经部署过，你可以通过右键单击目录中的 SSIS 项目并单击“版本”来进行检查，如图 4-10 所示。


    ![../images/459435_1_En_4_Chapter/459435_1_En_4_Fig10_HTML.jpg](img/459435_1_En_4_Fig10_HTML.jpg)


    **图 4-10** 打开 SSIS 目录项目版本


    “项目版本”对话框显示如图 4-11 所示。


    ![../images/459435_1_En_4_Chapter/459435_1_En_4_Fig11_HTML.jpg](img/459435_1_En_4_Fig11_HTML.jpg)


    **图 4-11** 查看 SSIS 目录项目版本


    最后一次部署被标记为“当前”。


    回到你在 SSDT 中的部署，如果你在集成服务部署向导审阅页面上单击“部署”按钮，部署向导将尝试将你的 SSIS 项目部署到你选择的 SSIS 目录中，并放入你指定的
    SSIS 目录文件夹内，如图 4-12 所示。


    ![../images/459435_1_En_4_Chapter/459435_1_En_4_Fig12_HTML.jpg](img/459435_1_En_4_Fig12_HTML.jpg)


    **图 4-12** 成功部署


    如果一切顺利，部署将成功完成。


    ## 部署失败


    有时，顺利的部署也会遭遇不测。你阅读本书可能是因为你遇到了由于善意地尝试还原 SSIS 目录数据库 `SSISDB` 而触发的部署失败。


    不建议使用备份和还原作为在 SSIS 目录之间提升或传输 SSIS 项目的方法！


    当你尝试在 `SSISDB` 被不当还原后向其部署 SSIS 项目（或包）时，部署将*不会*成功。相反，你的集成服务部署向导结果页面将显示如图 4-13 所示。


    ![../images/459435_1_En_4_Chapter/459435_1_En_4_Fig13_HTML.jpg](img/459435_1_En_4_Fig13_HTML.jpg)


    **图 4-13** 失败的 SSIS 项目部署


    当你单击“失败”链接时，图 4-13 中的消息框将显示错误消息：


    - 请先在该数据库中创建一个主密钥，或在会话中打开主密钥，然后执行此操作。(Microsoft SQL Server, Error: 15581)


    请在 SSIS 目录页面上标题为“备份、还原和移动 SSIS 目录”（`docs.microsoft.com/en-us/sql/integration-services/service/ssis-catalog`）的部分中查找有关备份和还原
    SSIS 目录数据库 (`SSISDB`) 的更多信息。我曾就此场景写过博客，该博文中包含一个可用于还原 `SSISDB` 的脚本。你可以在 `andyleonard.blog/2017/07/29/deploying-ssis-projects-to-a-restored-ssis-catalog-ssisdb`
    找到我题为“将 SSIS 项目部署到已还原的 SSIS 目录”的博文。我使用的脚本如下：

