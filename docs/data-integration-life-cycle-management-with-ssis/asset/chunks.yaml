    print ''Opening the master key''

    Open master key decryption by password = ''SuperSecretPassword'' --''Password
    used when creating SSISDB''   -- *** check this, please – Andy

    Alter Master Key

    Add encryption by Service Master Key

    go

    print ''Master key opened''

    print ''''

    print ''Checking the SSIS Catalog Schema Version''

    exec [catalog].check_schema_version @use32bitruntime = 0

    ```


    The Transact-SQL script listed above requires you to supply the password used
    to create the SSIS catalog; replace the text “SuperSecretPassword” with the password
