    ### Deleting Existing Artifacts


    Delete the existing SSIS packages and project connection managers from the SSIS
    project, as shown in Figure [10-43](#459435_1_En_10_Chapter.xhtml#Fig43).


    ![../images/459435_1_En_10_Chapter/459435_1_En_10_Fig43_HTML.jpg](images/459435_1_En_10_Chapter/459435_1_En_10_Fig43_HTML.jpg)


    Figure 10-43


    Deleting the existing artifacts


    You do not have to delete the existing artifacts. If you do not delete the existing
    artifacts, BimlExpress will prompt you to confirm overwrites of existing artifacts.


    ### Generating SSIS Packages


    Multi-select `0_00_BuildConnections.biml`, `0_10_BuildDestinationDatabaseMain.biml`,
    `0_20_BuildDestinationSchemasMain.biml`, `0_30_BuildDestinationTablesMain.biml`,
    and `1_99_Main.biml`. Right-click and select Generate SSIS Packages, as shown
    in Figure [10-44](#459435_1_En_10_Chapter.xhtml#Fig44).


    ![../images/459435_1_En_10_Chapter/459435_1_En_10_Fig44_HTML.jpg](images/459435_1_En_10_Chapter/459435_1_En_10_Fig44_HTML.jpg)


    Figure 10-44


    Generating SSIS packages


    As before, when generating the Destination Tables SSIS package, you will be prompted
    to overwrite the `AdventureWorks2014_Stage` project connection manager and its
    file. The process generates 75 SSIS packages in all:


    - 1 Create Destination database

    - 1 Create Destination schemas

    - 1 Create Destination tables

    - 71 SSIS loaders, one for each table in the `AdventureWorks2014` database

    - 1 controller that contains 71 Execute Package tasks, one for each SSIS loader


    Please see Figure [10-45](#459435_1_En_10_Chapter.xhtml#Fig45).


    ![../images/459435_1_En_10_Chapter/459435_1_En_10_Fig45_HTML.jpg](images/459435_1_En_10_Chapter/459435_1_En_10_Fig45_HTML.jpg)


    Figure 10-45


    AdventureWorks2014 Staging SSIS complete!


