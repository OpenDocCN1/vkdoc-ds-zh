    as shown in Figure [10-46](#459435_1_En_10_Chapter.xhtml#Fig46).


    ![../images/459435_1_En_10_Chapter/459435_1_En_10_Fig46_HTML.jpg](images/459435_1_En_10_Chapter/459435_1_En_10_Fig46_HTML.jpg)


    Figure 10-46


    Executing the Controller SSIS package


    ### Validating the Load


    In SSMS, run a few test queries to validate the load process executed successfully,
    as shown in Figure [10-47](#459435_1_En_10_Chapter.xhtml#Fig47).


    ![../images/459435_1_En_10_Chapter/459435_1_En_10_Fig47_HTML.jpg](images/459435_1_En_10_Chapter/459435_1_En_10_Fig47_HTML.jpg)


    Figure 10-47


    Validating the load


    The load process is validated. You should now be able to deploy the ISPAC file
    for the BimlExpressMetadataFramework SSIS project, as shown in Figure [10-48](#459435_1_En_10_Chapter.xhtml#Fig48).


    ![../images/459435_1_En_10_Chapter/459435_1_En_10_Fig48_HTML.jpg](images/459435_1_En_10_Chapter/459435_1_En_10_Fig48_HTML.jpg)


    Figure 10-48


    Preparing to deploy the BimlExpressMetadataFramework ISPAC file


    ### Full Circle


    You’ve come full circle in this demo. You deployed an SSIS project to an SSIS
    catalog in Chapter [3](#459435_1_En_3_Chapter.xhtml). In Chapter [7](#459435_1_En_7_Chapter.xhtml),
    you executed a script that added metadata to SSIS Framework Community Edition
    for an SSIS catalog project, an SSIS project already deployed to an SSIS catalog,
    which allowed you to execute all of the SSIS packages that were part of the SSIS
    catalog project by calling a single stored procedure and passing it a single parameter
    value.


    # 11. Conclusion


    As shipped, SQL Server Integration Services (SSIS) is ready for enterprise data
    integration, but not as ready for enterprise DevOps and data integration lifecycle
    management (DILM). Using the best practices, tools, and utilities outlined in
    this book, you can deliver data integration solutions that participate in enterprise
    DevOps.


    The collection of free, free and open-source, and for-sale utilities available
    at DILM Suite are built to support enterprise data integration lifecycle management
    for enterprises using SSIS for data integration.'
