    \n![../images/459435_1_En_2_Chapter/459435_1_En_2_Fig2_HTML.jpg](images/459435_1_En_2_Chapter/459435_1_En_2_Fig2_HTML.jpg)\n\
    \nFigure 2-2\n\nPackage parameters\n\nYou add these demo parameters at the package\
    \ scope. *Scope* is an important concept in software development *and* lifecycle\
