- fmt: "### Why `ProjectName` and `TaskName` ?\n\nAs the code below will reveal, you\
    \ will use these variables to construct a value in the `subComponent`.Net variable\
    \ in your code. Do you absolutely *need* this variable for SSIS development? No.\
    \ But you absolutely need this variable if you are going to help the Operations\
    \ team monitor and report messages and failures from SSIS logs. For the developer\
    \ side of DevOps, it’s a few lines of code. For the Operations side of DevOps,\
    \ it surfaces one more piece of execution metadata in the logs. Providing this\
    \ kind and level of process instrumentation is vital to the successful integration\
    \ of DevOps and SSIS.\n\nClick the **OK** button to close the **Select Variables**\
    \ dialog. Your **Script Task Editor** should now appear as shown in Figure [2-9](#459435_1_En_2_Chapter.xhtml#Fig9).\n\
    \n![../images/459435_1_En_2_Chapter/459435_1_En_2_Fig9_HTML.jpg](images/459435_1_En_2_Chapter/459435_1_En_2_Fig9_HTML.jpg)\n\
    \nFigure 2-9\n\nThe Script Task Editor\n\nClick the **Edit Script** button to\
    \ open the **Visual Studio Tools for Applications (VSTA)** Editor. Edit the `public\
    \ void Main()` method to read as follows:\n\n```\npublic void Main()\n{\nstring\
    \ packageName = Dts.Variables[\"System::PackageName\"].Value.ToString();\nstring\
    \ taskName = Dts.Variables[\"System::TaskName\"].Value.ToString();\nstring subComponent\
    \ = packageName + \".\" + taskName;\nbool fireAgain = true;\nint tableCount =\
    \ Convert.ToInt32(Dts.Variables[\"User::TableCount\"].Value);\nint intPkgParam\
    \ = Convert.ToInt32(Dts.Variables[\"$Package::IntPkgParam\"].Value);\nstring stringPkgParam\
    \ = Dts.Variables[\"$Package::StringPkgParam\"].Value.ToString();\nint intProjParam\
    \ = Convert.ToInt32(Dts.Variables[\"$Project::IntProjParam\"].Value);\nstring\
    \ stringProjParam = Dts.Variables[\"$Project::StringProjParam\"].Value.ToString();\n\
    string msg = \"Table Count: \" + tableCount.ToString();\nDts.Events.FireInformation(1001,\
    \ subComponent, msg, \"\", 0, ref fireAgain);\nmsg = \"Package Parameters: IntPkgParam\
    \ = \" + intPkgParam.ToString() + \" ; StringPkgParam = \" + stringPkgParam;\n\
    Dts.Events.FireInformation(1001, subComponent, msg, \"\", 0, ref fireAgain);\n\
    msg = \"Project Parameters: IntProjParam = \" + intProjParam.ToString() + \" ;\
    \ StringProjParam = \" + stringProjParam;\nDts.Events.FireInformation(1001, subComponent,\
    \ msg, \"\", 0, ref fireAgain);\nDts.TaskResult = (int)ScriptResults.Success;\n\
    }\n```\n\nWhen completed, the code in your VSTA Editor should appear similar to\
    \ that shown in Figure [2-10](#459435_1_En_2_Chapter.xhtml#Fig10).\n\n![../images/459435_1_En_2_Chapter/459435_1_En_2_Fig10_HTML.jpg](images/459435_1_En_2_Chapter/459435_1_En_2_Fig10_HTML.jpg)\n\
    \nFigure 2-10\n\nCode in Your VSTA Editor\n\n### Testing .Net Code Compiles Before\
    \ Closing the VSTA Editor\n\nHave you ever coded away in an SSIS Script task,\
    \ only to close the VSTA Editor and then close the Script Task Editor to see the\
    \ error shown in Figure [2-11](#459435_1_En_2_Chapter.xhtml#Fig11)?\n\n![../images/459435_1_En_2_Chapter/459435_1_En_2_Fig11_HTML.jpg](images/459435_1_En_2_Chapter/459435_1_En_2_Fig11_HTML.jpg)\n\
    \nFigure 2-11\n\nScript task error in VSTA .Net code\n\nKevin Hazzard shared a\
    \ handy way to test the viability of the .Net code contained in the VSTA Editor\
    \ *before* closing the editor. Click **Build** ➤ **Build ST_…** (VSTA scripts\
    \ are uniquely named), as shown in Figure [2-12](#459435_1_En_2_Chapter.xhtml#Fig12).\n\
    \n![../images/459435_1_En_2_Chapter/459435_1_En_2_Fig12_HTML.jpg](images/459435_1_En_2_Chapter/459435_1_En_2_Fig12_HTML.jpg)\n\
    \nFigure 2-12\n\nPreparing to build a VSTA script\n\nWhen you click **Build ST_…**,\
    \ the VSTA Editor attempts to build the script. In the lower left corner of the\
    \ screen you will see “Build started,” as shown in Figure [2-13](#459435_1_En_2_Chapter.xhtml#Fig13).\n\
    \n![../images/459435_1_En_2_Chapter/459435_1_En_2_Fig13_HTML.jpg](images/459435_1_En_2_Chapter/459435_1_En_2_Fig13_HTML.jpg)\n\
    \nFigure 2-13\n\nBuild started\n\nIf there is a bug in the .Net code, the build\
    \ will fail. If there are no bugs in the .Net code, the build will succeed, as\
    \ shown in Figure [2-14](#459435_1_En_2_Chapter.xhtml#Fig14).\n\n![../images/459435_1_En_2_Chapter/459435_1_En_2_Fig14_HTML.jpg](images/459435_1_En_2_Chapter/459435_1_En_2_Fig14_HTML.jpg)\n\
    \nFigure 2-14\n\nBuild succeeds or fails\n\nClose the VSTA Editor and click the\
    \ **OK** button in the **Script Task Editor**. `SimplePackage.dtsx` should now\
    \ appear as shown in Figure [2-15](#459435_1_En_2_Chapter.xhtml#Fig15).\n\n![../images/459435_1_En_2_Chapter/459435_1_En_2_Fig15_HTML.jpg](images/459435_1_En_2_Chapter/459435_1_En_2_Fig15_HTML.jpg)\n\
    \nFigure 2-15\n\n`SimplePackage.dtsx`\n\nThe demonstration SSIS package and project\
    \ are complete.\n\n## Testing Progress\n\n> *“All software is tested. Some intentionally.”*\n\
    > \n> – Andy Leonard, circa 2005\n\nIt’s a good idea to always execute your package\
    \ in the SSIS debugger. How else will you know that what you built works?\n\n\
    Press the **F5** key to start the SSIS debugger. If all goes as planned, you should\
    \ see both tasks succeed, as shown in Figure [2-16](#459435_1_En_2_Chapter.xhtml#Fig16).\n\
    \n![../images/459435_1_En_2_Chapter/459435_1_En_2_Fig16_HTML.jpg](images/459435_1_En_2_Chapter/459435_1_En_2_Fig16_HTML.jpg)\n\
    \nFigure 2-16\n\nSuccess!\n\nIf you click the **Progress** tab, you should see\
    \ the `OnInformation` messages raised by your script, as shown in Figure [2-17](#459435_1_En_2_Chapter.xhtml#Fig17).\n\
    \n![../images/459435_1_En_2_Chapter/459435_1_En_2_Fig17_HTML.jpg](images/459435_1_En_2_Chapter/459435_1_En_2_Fig17_HTML.jpg)\n\
    \nFigure 2-17\n\n`OnInformation` messages\n\nYour demo is now ready to begin an\
    \ epic journey into data integration lifecycle management.\n\n## Conclusion\n\n\
    In this chapter, you built an SSIS package that you will use for the lessons throughout\
    \ this book. I discussed data integration instrumentation and messaging to surface\
    \ SSIS package execution log messages. It’s important for us on the Dev side of\
    \ DevOps to signal supporting personnel on the Ops side. It takes minutes to write\
    \ this code that may save hours of troubleshooting.\n\n# 3. Source Control\n\n\
    Later in this book, I will discuss why SQL Server database backup and restore\
    \ of the `SSISDB` database is not a viable method of SSIS code promotion. You\
    \ should back up the `SSISDB` database just like you should back up all databases.\
    \ You should not back up the `SSISDB` database for code promotion, and you should\
    \ not back up the `SSISDB` database in lieu of source control.\n\nThere are two\
    \ types of developers: those who use source control and those who will. People\
    \ ask me, “Which source control engine is best, Andy?” My response is, “The one\
    \ that you use.” Please use source control.\n\nThis section is not an exhaustive\
    \ tutorial on source control or using Team Foundation Services. I do not advocate\
    \ one source control engine over another.\n\nIn this chapter, I will demonstrate\
    \ using Team Foundation Services via Visual Studio Online (`visualstudio.com`).\
    \ I will use the terms “source control” and “version control” interchangeably\
    \ because modern source control engines also manage software versions."
  raw: "### Why ProjectName and TaskName ?\n\nAs the code below will reveal, you will\
    \ use these variables to construct a value in the `subComponent` .Net variable\
    \ in your code. Do you absolutely *need* this variable for SSIS development? No.\
    \ But you absolutely need this variable if you are going to help the Operations\
    \ team monitor and report messages and failures from SSIS logs. For the developer\
    \ side of DevOps, it’s a few lines of code. For the Operations side of DevOps,\
    \ it surfaces one more piece of execution metadata in the logs. Providing this\
    \ kind and level of process instrumentation is vital to the successful integration\
    \ of DevOps and SSIS.\n\nClick the OK button to close the Select Variables dialog.\
    \ Your Script Task Editor should now appear as shown in Figure [2-9](#459435_1_En_2_Chapter.xhtml#Fig9).\n\
    \n![../images/459435_1_En_2_Chapter/459435_1_En_2_Fig9_HTML.jpg](images/459435_1_En_2_Chapter/459435_1_En_2_Fig9_HTML.jpg)\n\
    \nFigure 2-9\n\nThe Script Task Editor\n\nClick the Edit Script button to open\
    \ the Visual Studio Tools for Applications (VSTA) Editor. Edit the public void\
    \ `Main()` method to read as follows:\n\n```\npublic void Main()\n{\nstring packageName\
    \ = Dts.Variables[\"System::PackageName\"].Value.ToString();\nstring taskName\
    \ = Dts.Variables[\"System::TaskName\"].Value.ToString();\nstring subComponent\
    \ = packageName + \".\" + taskName;\nbool fireAgain = true;\nint tableCount =\
    \ Convert.ToInt32(Dts.Variables[\"User::TableCount\"].Value);\nint intPkgParam\
    \ = Convert.ToInt32(Dts.Variables[\"$Package::IntPkgParam\"].Value);\nstring stringPkgParam\
    \ = Dts.Variables[\"$Package::StringPkgParam\"].Value.ToString();\nint intProjParam\
    \ = Convert.ToInt32(Dts.Variables[\"$Project::IntProjParam\"].Value);\nstring\
    \ stringProjParam = Dts.Variables[\"$Project::StringProjParam\"].Value.ToString();\n\
    string msg = \"Table Count: \" + tableCount.ToString();\nDts.Events.FireInformation(1001,\
    \ subComponent, msg, \"\", 0, ref fireAgain);\nmsg = \"Package Parameters: IntPkgParam\
    \ = \" + intPkgParam.ToString() + \" ; StringPkgParam = \" + stringPkgParam;\n\
    Dts.Events.FireInformation(1001, subComponent, msg, \"\", 0, ref fireAgain);\n\
    msg = \"Project Parameters: IntProjParam = \" + intProjParam.ToString() + \" ;\
    \ StringProjParam = \" + stringProjParam;\nDts.Events.FireInformation(1001, subComponent,\
    \ msg, \"\", 0, ref fireAgain);\nDts.TaskResult = (int)ScriptResults.Success;\n\
    }\n```\n\nWhen completed the code in your VSTA Editor should appear similar to\
    \ that shown in Figure [2-10](#459435_1_En_2_Chapter.xhtml#Fig10).\n\n![../images/459435_1_En_2_Chapter/459435_1_En_2_Fig10_HTML.jpg](images/459435_1_En_2_Chapter/459435_1_En_2_Fig10_HTML.jpg)\n\
    \nFigure 2-10\n\nCode in Your VSTA Editor\n\n### Testing .Net Code Compiles Before Closing\
    \ the VSTA Editor\n\nHave you ever coded away in an SSIS Script task, only to\
    \ close the VSTA Editor and then close the Script Task Editor to see the error\
    \ shown in Figure [2-11](#459435_1_En_2_Chapter.xhtml#Fig11)?\n\n![../images/459435_1_En_2_Chapter/459435_1_En_2_Fig11_HTML.jpg](images/459435_1_En_2_Chapter/459435_1_En_2_Fig11_HTML.jpg)\n\
    \nFigure 2-11\n\nScript task error in VSTA .Net code\n\nKevin Hazzard shared a\
    \ handy way to test the viability of the .Net code contained in the VSTA Editor\
    \ *before* closing the editor. Click Build ➤ Build ST_… (VSTA scripts are uniquely\
    \ named), as shown in Figure [2-12](#459435_1_En_2_Chapter.xhtml#Fig12).\n\n![../images/459435_1_En_2_Chapter/459435_1_En_2_Fig12_HTML.jpg](images/459435_1_En_2_Chapter/459435_1_En_2_Fig12_HTML.jpg)\n\
    \nFigure 2-12\n\nPreparing to build a VSTA script\n\nWhen you click Build ST_…,\
    \ the VSTA Editor attempts to build the script. In the lower left corner of the\
    \ screen you will see “Build started,” as shown in Figure [2-13](#459435_1_En_2_Chapter.xhtml#Fig13).\n\
    \n![../images/459435_1_En_2_Chapter/459435_1_En_2_Fig13_HTML.jpg](images/459435_1_En_2_Chapter/459435_1_En_2_Fig13_HTML.jpg)\n\
    \nFigure 2-13\n\nBuild started\n\nIf there is a bug in the .Net code, the build\
    \ will fail. If there are no bugs in the .Net code, the build will succeed, as\
    \ shown in Figure [2-14](#459435_1_En_2_Chapter.xhtml#Fig14).\n\n![../images/459435_1_En_2_Chapter/459435_1_En_2_Fig14_HTML.jpg](images/459435_1_En_2_Chapter/459435_1_En_2_Fig14_HTML.jpg)\n\
    \nFigure 2-14\n\nBuild succeeds or fails\n\nClose the VSTA Editor and click the\
    \ OK button in the Script Task Editor. `SimplePackage.dtsx` should now appear\
    \ as shown in Figure [2-15](#459435_1_En_2_Chapter.xhtml#Fig15).\n\n![../images/459435_1_En_2_Chapter/459435_1_En_2_Fig15_HTML.jpg](images/459435_1_En_2_Chapter/459435_1_En_2_Fig15_HTML.jpg)\n\
    \nFigure 2-15\n\nSimplePackage.dtsx\n\nThe demonstration SSIS package and project\
    \ are complete.\n\n## Testing Progress\n\n> *“All software is tested. Some intentionally.”*\n\
    > \n> – Andy Leonard, circa 2005\n\nIt’s a good idea to always execute your package\
    \ in the SSIS debugger. How else will you know that what you built works?\n\n\
    Press the F5 key to start the SSIS debugger. If all goes as planned, you should\
