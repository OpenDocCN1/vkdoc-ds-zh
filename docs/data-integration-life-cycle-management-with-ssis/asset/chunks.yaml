    as shown in Figure [10-3](#459435_1_En_10_Chapter.xhtml#Fig3).


    ![../images/459435_1_En_10_Chapter/459435_1_En_10_Fig3_HTML.jpg](images/459435_1_En_10_Chapter/459435_1_En_10_Fig3_HTML.jpg)


