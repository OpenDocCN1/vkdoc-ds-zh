  trans: '

    # 我为何构建 DILM Suite —— 作者：安迪·伦纳德


    这并非意味着每一条建议都会得到采纳（我保证这不是抱怨）。事实证明，微软是一家软件开发企业。即便微软规模如此庞大，也不可能对*每一条*请求都做出回应。当我意识到这一点时，我开始思考如何弥补我所察觉到的这些缺口。我曾与人共同创立了一家咨询公司，而我们（集体而言）对成为一家软件产品公司并不感兴趣。但我对开发产品来解决数据集成生命周期管理（`DILM`）方面的缺口*非常*感兴趣。


    2015 年，我离开了共同创立的咨询公司，并立即开始开发我梦想已久的软件。在我看来，对于“为什么？”这个问题，最公平的回答如下：


    1.  我开始相信微软 SSIS 开发团队永远不会解决那些我认为是产品故事中“缺口”的问题。

    2.  我开始相信，我与共同创立的咨询公司对于如何解决 `DILM` 问题，持有不可调和的分歧。


    时隔两年回顾，我相信专注于 `DILM` 对我来说是长期最佳的选择。我创办了另一家咨询公司——Enterprise Data & Analytics (`entdna.com`)，主要是为了资助我的编码爱好。


    ## 展示 SSIS 目录


    让我们看看 SSMS 对象浏览器的“Integration Services 目录”节点中展示的 SSIS 目录表面，如图 6-1 所示。


    ![../images/459435_1_En_6_Chapter/459435_1_En_6_Fig1_HTML.jpg](img/459435_1_En_6_Fig1_HTML.jpg)


    **图 6-1** —— SSMS 对象浏览器“Integration Services 目录”节点中显示的 SSIS 目录


    在“Integration Services 目录”节点下，我们找到了名为 `SSISDB` 的 SSIS 目录。显示了两个目录文件夹：`Framework`
    和 `Test`。`Test` 文件夹包含 `Projects` 和 `Environments` 虚拟文件夹。`Projects` 虚拟文件夹包含名为 `DILMSample`
    的 SSIS 目录项目，该项目又包含名为 `SimplePackage.dtsx` 的 SSIS 包。`Environments` 虚拟文件夹包含名为 `envConnection1`
    的目录环境。


    因为您已经完成了相关工作，所以您知道这里的信息远不止表面上看到的这些。


    ## SSIS 目录环境配置


    如果双击 `envConnection1`，您可以在“变量”页面上看到目录环境变量的详细信息，如图 6-2 所示。


    ![../images/459435_1_En_6_Chapter/459435_1_En_6_Fig2_HTML.jpg](img/459435_1_En_6_Fig2_HTML.jpg)


    **图 6-2** —— 查看 SSIS 目录环境的“变量”页面


    “变量”页面包含 SSIS 目录环境变量的详细信息，包括名称、数据类型、描述、值以及该变量是否为敏感变量。


    ## SSIS 目录项目配置


    在“SSIS 目录项目配置”对话框的“参数”页面上，“参数”选项卡列出了 SSIS 项目和包参数、它们的容器名称以及默认值，如图 6-3 所示。


    ![../images/459435_1_En_6_Chapter/459435_1_En_6_Fig3_HTML.jpg](img/459435_1_En_6_Fig3_HTML.jpg)


    **图 6-3** —— 查看 SSIS 目录项目的项目参数及其值


    “参数”页面上的“连接管理器”选项卡包含 SSIS 项目和包连接管理器及其属性的列表，如图 6-4 所示。


    ![../images/459435_1_En_6_Chapter/459435_1_En_6_Fig4_HTML.jpg](img/459435_1_En_6_Fig4_HTML.jpg)


    **图 6-4** —— 查看 SSIS 目录项目的连接管理器参数及其值


    “SSIS 目录项目配置”对话框的“引用”页面包含 SSIS 目录项目在运行时可能引用的 SSIS 目录环境列表，如图 6-5 所示。


    ![../images/459435_1_En_6_Chapter/459435_1_En_6_Fig5_HTML.jpg](img/459435_1_En_6_Fig5_HTML.jpg)


    **图 6-5** —— 查看 SSIS 目录项目的项目引用


    这需要大量右击和双击操作，才能看清 SSIS 目录项目中配置了什么。

    '
- fmt: '# Catalog Browser


    The SSIS catalog is filled with really cool and useful configuration information,
    but one has to know where to look and, in some cases, *where to look* isn’t so
    obvious.


    Enter `Catalog Browser`, a free utility that is part of the DILM Suite and available
    at `dilmsuite.com/catalog-browser`. `Catalog Browser` was built to surface the
    contents of the SSIS catalog in a single view: a tree that exposes all relevant
    SSIS catalog artifacts, properties, and configurations.


    As shown in Figure [6-6](#459435_1_En_6_Chapter.xhtml#Fig6), `Catalog Browser`
    surfaces the same metadata as the SSMS Object Explorer Integration Services Catalogs
    node.


    ![../images/459435_1_En_6_Chapter/459435_1_En_6_Fig6_HTML.jpg](images/459435_1_En_6_Chapter/459435_1_En_6_Fig6_HTML.jpg)


    Figure 6-6


    `Catalog Browser` surfacing part of the SSIS project and configurations metadata


    Looking at Figure [6-6](#459435_1_En_6_Chapter.xhtml#Fig6), though, you probably
    already see some differences between `Catalog Browser` and the SSMS Object Explorer
    Integration Services Catalogs node. Note the `Project Parameters` and `Project
    References` virtual folders present beneath the SSIS catalog project, in addition
    to the `Packages` virtual folder.


    Expanding these virtual folders reveals the SSIS catalog project parameters and
    reference, as shown in Figure [6-7](#459435_1_En_6_Chapter.xhtml#Fig7).


    ![../images/459435_1_En_6_Chapter/459435_1_En_6_Fig7_HTML.jpg](images/459435_1_En_6_Chapter/459435_1_En_6_Fig7_HTML.jpg)


    Figure 6-7


    SSIS catalog project parameters and references


    Remember in Figure [6-3](#459435_1_En_6_Chapter.xhtml#Fig3) the SSMS Object Explorer
    Integration Services Catalogs node surfaced *all* parameters: SSIS catalog project
    parameters and SSIS package parameters. Where are the package parameters? They’re
    here in `Catalog Browser`. To view the package parameters, expand the `SimplePackage.dtsx`
    SSIS package node, as shown in Figure [6-8](#459435_1_En_6_Chapter.xhtml#Fig8).


    ![../images/459435_1_En_6_Chapter/459435_1_En_6_Fig8_HTML.jpg](images/459435_1_En_6_Chapter/459435_1_En_6_Fig8_HTML.jpg)


    Figure 6-8


    Viewing SSIS package parameters


    Recall that connection manager properties are treated as parameters in the SSIS
    catalog. They are prefixed with “CM.”. You can see that the SSIS package connection
    manager `vmDemo\Demo.TestDB1` connection string property is mapped to an SSIS
    catalog environment variable named `ConnectionString`.


    To surface the reference used for the reference mapping, expand the `Package References`
    virtual folder, as shown in Figure [6-9](#459435_1_En_6_Chapter.xhtml#Fig9).


    ![../images/459435_1_En_6_Chapter/459435_1_En_6_Fig9_HTML.jpg](images/459435_1_En_6_Chapter/459435_1_En_6_Fig9_HTML.jpg)


    Figure 6-9


    Viewing the package reference


    Expanding the `Package Reference` virtual folder surfaces the `Test/envConection1`
    catalog environment. Expanding the `Test/envConection1` catalog environment reveals
    that the catalog environment variable named `ConnectionString` is mapped to the
    `vmDemo\Demo.TestDB1` connection string property.


    But what’s the value of the `ConnectionString` catalog environment variable? Expand
    the `envConnection1` catalog environment in the `Environments` virtual folder
    to view the collection of catalog environment variables, their data types, and
    their values, as shown in Figure [6-10](#459435_1_En_6_Chapter.xhtml#Fig10).


    ![../images/459435_1_En_6_Chapter/459435_1_En_6_Fig10_HTML.jpg](images/459435_1_En_6_Chapter/459435_1_En_6_Fig10_HTML.jpg)


    Figure 6-10


    Catalog environment variables, data types, and values


    SSIS package properties includes a `Package Version` property constructed from
    the `Version Major`, `Version Minor`, and `Version Build` properties of the SSIS
    package. Every time a developer saves an SSIS package, the `Version Build` property
    increments. It’s possible to revise an SSIS package and “trick” the `Version Build`
    property by manually setting it. I have not yet found a valid use case for doing
    so to SSIS catalog-deployed SSIS packages.


    The `Package Version` property can be used to detect different versions of SSIS
    packages deployed to an SSIS catalog. Because SSIS developers can manually set
    the `Version Build` property, `Package Version` is not a reliable indication.


    The `Package Properties` virtual folder surfaces SSIS package metadata, as shown
    in Figure [6-11](#459435_1_En_6_Chapter.xhtml#Fig11).


    ![../images/459435_1_En_6_Chapter/459435_1_En_6_Fig11_HTML.jpg](images/459435_1_En_6_Chapter/459435_1_En_6_Fig11_HTML.jpg)


    Figure 6-11


    SSIS package properties


    Catalog properties are handy for detecting differences in patch levels (via the
    `Schema Build` property). `Catalog Version` is a property exposed by `Catalog
    Base`, the custom catalog object that lies beneath `Catalog Browser`.


    `Catalog Base` works with SSIS 2012, 2014, and 2016 catalogs.


    The `Catalog Properties` virtual folder surfaces SSIS catalog metadata, as shown
    in Figure [6-12](#459435_1_En_6_Chapter.xhtml#Fig12).


    ![../images/459435_1_En_6_Chapter/459435_1_En_6_Fig12_HTML.jpg](images/459435_1_En_6_Chapter/459435_1_En_6_Fig12_HTML.jpg)


    Figure 6-12


    SSIS catalog properties


    ## Conclusion


    `Catalog Browser` surfaces SSIS catalog artifacts, configurations metadata, and
    artifact properties in a single view.


    # SSIS Catalog Compare


    Viewing the SSIS catalog contents, including SSIS catalog projects, packages,
    environments, environment variables, references, and reference mappings along
    with SSIS package and SSIS catalog properties, is helpful. But what if you want
    to see the differences between the contents of one SSIS catalog instance and another?
    Or, perhaps even more useful, how can you *know* the enterprise QA and Production
    SSIS catalog instances match?


    ## Why I Built SSIS Catalog Compare, by Andy Leonard


    My team built a fairly complex data integration solution for a client using SSIS.
    We tested the solution in two DevOps tiers, Test and UAT (User Acceptance Testing).
    We identified some issues and corrected them. It was then time to deploy to Production.
    My team and I were on standby during the Production deployment and initial Production
    tests.


    Initially, everything failed.


    We identified the root causes and corrected the issues, but we had egg on our
    collective faces with the business, and for good reason. We had assured them “we
    were doing it right.” We were, with one exception. The enterprise data architect
    identified the gap with one very good question, “How can we *know* the Production
    and UAT SSIS catalogs are the same?” My response at the time, “[Pregnant pause
    while thinking… then] I don’t know.”


    I built `SSIS Catalog Compare` so I—and my customers, and you—can answer that
    question.'
