    准备创建新的团队项目


    你可以将 Visual Studio Online 源代码管理视为 Visual 范式的扩展。图 3-2 中的红色框圈出了一个 SSIS 包，它可以被视为
    Visual Studio 的*项目工件*。项目工件是 Visual Studio 对象层次结构中的最低级别。下一级别是*项目*，在图 3-2 中用蓝色框圈出。Visual
    Studio 项目包含一个或多个项目工件。Visual Studio *解决方案*，例如图 3-2 中用绿色圈出的 DILMSuite 解决方案，包含一个或多个项目。


