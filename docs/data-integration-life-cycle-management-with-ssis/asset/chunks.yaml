    项目参数


    SSIS 参数的工作原理与 SSIS 变量非常相似。两者有两个重要区别：


    1. SSIS 变量值可以在任何时间更改（无论是在 SSIS 包执行之前还是执行期间）。SSIS 参数值可以在 SSIS 包执行之前更改，但不能在执行期间更改。

    2. SSIS 参数值可以标记为*敏感*或*必需*。敏感参数会被加密。必需参数必须在 SSIS 包执行之前进行替代。


    ## 关于变量、参数和作用域的说明


    为将在 SSIS 包执行期间更改的值创建 SSIS 变量，例如在 Foreach 循环容器分配中使用的变量。


    为单个 SSIS 包中使用的值创建包作用域参数。包作用域参数的值在 SSIS 包执行期间不能更改。为 SSIS 项目中所有（或几个）SSIS 包共享的值创建项目作用域参数。


    保存并关闭“项目参数”窗口。


    # 添加执行 SQL 任务


    向 `SimplePackage.dtsx` SSIS 包的控制流中添加一个执行 SQL 任务。打开执行 SQL 任务编辑器，并将 `ConnectionType`
    属性设置为 ADO.NET。单击 `Connection` 属性，然后单击 `<新连接...>`。此时会打开 ADO.Net 连接管理器编辑器。您可以配置
    ADO.Net 连接管理器以连接到任何所需的 SQL Server 数据库。您将执行一个通用查询，该查询适用于任何 SQL Server 关系数据库。


    我使用了一个名为 `vmDemo` 的虚拟机。我安装了一个 SQL Server 2016 实例，名为 `vmDemo\Demo`。我将 ADO.Net 连接管理器配置为连接到一个名为
    `TestDB` 的数据库，如图 2-5 所示。


    ![../images/459435_1_En_2_Chapter/459435_1_En_2_Fig5_HTML.jpg](img/459435_1_En_2_Fig5_HTML.jpg)


    图 2-5


    配置 ADO.Net 连接管理器


    单击“确定”，直到返回到执行 SQL 任务编辑器。在 `SQLStatement` 属性的“值”文本框中单击，然后单击省略号按钮打开“输入 SQL 查询”对话框。在此对话框中输入以下
    Transact-SQL 语句：


    ```

    Select Count(*) As TableCount From [sys].[tables]

    ```


    为什么要为 `Count(*)` 的值设置别名？执行 SQL 任务期望返回值采用带有列名的表格格式（尤其是当分配给了 SSIS 变量时，下一步就会进行分配）。


    将 `ResultSet` 属性从“无”改为“单行”。单击执行 SQL 任务编辑器左侧列表框中的“结果集”页面。单击“添加”按钮，并将“结果名称”从 `NewResultName`
    改为 `0`。单击 `0` 结果名称旁边的“变量名称”列中的下拉菜单，然后单击 `<新建变量...>` 打开“添加变量”对话框。确保“容器”设置为 `SimplePackage`。将变量命名为
    `TableCount`，并将“值类型”属性设置为 Int32。提供默认值为 `0`。您的“添加变量”对话框应如图 2-6 所示。


    ![../images/459435_1_En_2_Chapter/459435_1_En_2_Fig6_HTML.jpg](img/459435_1_En_2_Fig6_HTML.jpg)


    图 2-6


    添加新的 SSIS 变量


    您可以使用“添加变量”对话框中的“容器”下拉菜单选择 SSIS 变量的作用域。请注意此设置。如果执行 SQL 任务位于序列容器中，则很容易错误地将变量的作用域限定为主机序列容器，而不是
    SSIS 包。


    ## 关于 SSIS 变量作用域的说明


    由于 SSIS 变量很少限定在 SSIS 包之下，因此 Microsoft SSIS 开发团队更改了 SSIS 变量作用域的默认行为。在更改之前，SSIS
    变量作用域默认为具有焦点的可执行文件。现在，SSIS 变量作用域默认为 SSIS 包，*但在“添加变量”对话框中除外*。


    单击“确定”按钮。您的执行 SQL 任务编辑器的“结果集”页面应如图 2-7 所示。


    ![../images/459435_1_En_2_Chapter/459435_1_En_2_Fig7_HTML.jpg](img/459435_1_En_2_Fig7_HTML.jpg)


    图 2-7


    配置后的结果集


    单击“确定”按钮关闭执行 SQL 任务编辑器。右键单击执行 SQL 任务并单击“重命名”。将任务重命名为“SQL 获取表计数”。


    # 添加脚本任务


    向 `SimplePackage.dtsx` 的控制流中添加一个脚本任务。将其重命名为“SCR 记录值”，然后从“SQL 获取表计数”执行 SQL 任务连接一个“成功”优先约束到“SCR
    记录值”脚本任务。打开脚本任务编辑器。您可以选择 Microsoft Visual Basic 作为 `ScriptLanguage` 属性，也可以接受默认的
    Microsoft Visual C#。本书中的演示将使用 C#。


    ## 为什么选择 C#？


    自 2016 年底以来，Microsoft 多次重申 Visual Basic 和 C# 的语言功能将*分化*（`blogs.msdn.microsoft.com/dotnet/2017/02/01/the-net-language-strategy/`）。Microsoft
    的官方观点（来自该链接）是，它将继续将 C# 发展为“最先进的编程语言”，而其他功能将不会添加到 Visual Basic 中，因为“它们不会满足需求或自然融入
    VB”。请阅读该文章及其包含的链接。C# 和 VB 在未来将有所不同，并且 C# 将获得 VB 不具备的功能。


    有关 C# 的优质教程，请访问 `bimlscript.com`，然后点击“立即学习 Biml!”课程中的“C# 入门”链接。


    单击脚本任务编辑器的 `ReadOnlyVariables` 属性的“值”文本框，然后单击省略号按钮打开“选择变量”对话框。勾选以下变量的复选框：


    * `System::TaskName`

