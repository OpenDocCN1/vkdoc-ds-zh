  trans: '

    # 重写连接配置


    如何更改连接配置？点击图 5-4 中圈出的`ConnectionString`属性`Value`文本框右侧的省略号。


    ![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig4_HTML.jpg](img/459435_1_En_5_Fig4_HTML.jpg)


    *图 5-4 – 准备打开 ConnectionString 值的配置*


    **设置参数值**对话框随之打开。


    在 SSIS 目录中，项目参数、包参数以及连接管理器属性均被视为参数。


    选中并复制`ConnectionString`属性的设计时默认值（位于“使用包中的默认值”选项旁的文本框内），然后将其粘贴到“编辑值”文本框中，如图 5-5
    所示。


    ![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig5_HTML.jpg](img/459435_1_En_5_Fig5_HTML.jpg)


    *图 5-5 – 编辑 ConnectionString 属性值*


    将`ConnectionString`粘贴到**编辑值**文本框后，我做了一些修改。我删除了`Application Name`设置中的一个`Guid`值，并将数据源从`vmDemo\Demo`更改为`(local)\Demo`。从技术上讲，数据源与之前相同。我这样做是为了之后能明确判断正在使用的是哪一个值：设计时默认值还是此*字面量重写*。


    点击**确定**按钮，进入图 5-6 所示的重写页面。


    ![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig6_HTML.jpg](img/459435_1_En_5_Fig6_HTML.jpg)


    *图 5-6 – 目录项目字面量重写*


    `ConnectionString`的值已被 SSIS 目录字面量重写所覆盖。这通过值的**粗体文字样式**来表示。你可以将字面量重写理解为在 SSIS 目录中硬编码一个配置值。后续将`DILMSample`
    SSIS 项目部署到此 SSIS 目录时，即使你更改了连接管理器的设计时默认`ConnectionString`值，字面量重写的值*也不会*改变。这就是为什么我将
    SSDT 中的项目称为*SSIS 项目*，而将其部署到 SSIS 目录后称为*SSIS 目录项目*或*目录项目*的原因之一。


    作为拥有 SSIS 目录配置权限的人，你随时可以通过在**设置参数值**对话框中选择“使用包中的默认值”选项，将任何字面量重写恢复为设计时默认值，如图 5-7
    所示。


    ![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig7_HTML.jpg](img/459435_1_En_5_Fig7_HTML.jpg)


    *图 5-7 – 重新选择设计时默认值*


    值的文字样式恢复为无样式，并且值恢复为设计时默认值，如图 5-8 所示。


    ![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig8_HTML.jpg](img/459435_1_En_5_Fig8_HTML.jpg)


    *图 5-8 – 恢复为设计时默认值*


    # 外部化连接配置


    到目前为止，你已经了解了 SSIS 目录项目配置设置的两个来源：设计时默认值和字面量重写。你可能注意到**设置参数值**对话框上第三个选项是禁用的。“使用环境变量”是第三个选项，但需要额外配置才能启用。


    在进入下一个演示之前，我们来讨论一下 SSIS 目录如何管理*外部化*。外部化是指将值存储在其他位置，以便在运行时使用。SSIS 目录的外部化机制是 SSIS
    目录环境。目录环境包含一系列目录环境变量，这些变量又包含在运行时用于覆盖目录项目参数值的值。


    鉴于上一段所包含信息的深度和重要性，其篇幅相对较短。在继续之前，请先充分理解。


    我们来更详细地讨论 SSIS 目录的外部化机制。先从 SSIS 目录环境开始，如图 5-9 所示。


    ![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig9_HTML.jpg](img/459435_1_En_5_Fig9_HTML.jpg)


    *图 5-9 – 一个目录环境（示意）*


    SSIS 目录环境包含零个或多个 SSIS 目录环境变量，如图 5-10 所示。


    ![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig10_HTML.jpg](img/459435_1_En_5_Fig10_HTML.jpg)


    *图 5-10 – 目录环境中的目录环境变量*


    要将 SSIS 目录环境连接到 SSIS 目录项目，SSIS 目录使用*引用*。引用简单来说就是将目录项目与目录环境关联起来的关系，如图 5-11 所示。


    ![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig11_HTML.jpg](img/459435_1_En_5_Fig11_HTML.jpg)


    *图 5-11 – 关联 SSIS 目录项目与 SSIS 目录环境的引用*


    为了使目录项目中的参数能够使用目录环境变量的值，需要创建*引用映射*。引用映射将存储在 SSIS 目录环境变量中的值映射到 SSIS 目录项目中的参数，如图
    5-12 所示。


    ![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig12_HTML.jpg](img/459435_1_En_5_Fig12_HTML.jpg)


    *图 5-12 – SSIS 目录项目参数与 SSIS 目录环境变量之间的引用映射*


    重申一下，由于这可能是一个具有挑战性的话题：首先，您需要创建并配置一个 SSIS 目录环境。配置目录环境包括定义 SSIS 目录环境变量。这是外部化的第一步。


    接下来，您需要创建一个 SSIS 目录环境与 SSIS 目录项目之间的引用。创建引用是外部化的第二步。


    然后，您可以通过引用将 SSIS 目录环境变量分配给 SSIS 目录项目参数。这就是引用映射。通过引用将参数值映射到目录环境变量值是外部化的第三步。


    让我们通过一个演示来演练这个过程。


    ## 创建环境


    在 SSIS 目录中，右键单击`Test`目录文件夹下的`Environments`虚拟文件夹，然后点击**创建环境**，如图 5-13 所示。


    ![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig13_HTML.jpg](img/459435_1_En_5_Fig13_HTML.jpg)


    *图 5-13 – 准备创建目录环境*


    当**创建环境**对话框显示时，提供环境名称和可选的描述，如图 5-14 所示。


    ![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig14_HTML.jpg](img/459435_1_En_5_Fig14_HTML.jpg)


    *图 5-14 – 创建 SSIS 目录环境*


    点击**确定**关闭**创建环境**对话框。

    '
- fmt: '### Configuring an Environment


    Expand the `Environments` virtual folder in the SSIS catalog. Right-click the
    new catalog environment and click Properties, as shown in Figure [5-15](#459435_1_En_5_Chapter.xhtml#Fig15).


    ![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig15_HTML.jpg](images/459435_1_En_5_Chapter/459435_1_En_5_Fig15_HTML.jpg)


    Figure 5-15 — Preparing to configure the SSIS catalog environment variables


    Click the Variables page. Add a name for your catalog environment variable (I
    named mine `ConnectionString`). Set the type to String. Add a valid connection
    string to the Value field, as shown in Figure [5-16](#459435_1_En_5_Chapter.xhtml#Fig16).


    ![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig16_HTML.jpg](images/459435_1_En_5_Chapter/459435_1_En_5_Fig16_HTML.jpg)


    Figure 5-16 — Configuring an SSIS catalog environment variable


    Click the OK button to close the Environment Properties dialog.


    ### Configuring a Reference


    Right-click the DILMSample catalog project and click Configure. When the Configure
    – DILMSample dialog opens, click the References page. Click the Add button and
    select the catalog environment you just created beneath the `Local Folder (Test)`
    virtual folder in the Browse Environments dialog, as shown in Figure [5-17](#459435_1_En_5_Chapter.xhtml#Fig17).


    ![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig17_HTML.jpg](images/459435_1_En_5_Chapter/459435_1_En_5_Fig17_HTML.jpg)


    Figure 5-17 — Selecting the catalog environment for the reference


    There are actually two “paths” to the `envConnection1` catalog environment available
    in the Browse Environments dialog. The `Local Folder` path creates a “relative”
    reference in SSIS catalog parlance. If you expand the SSISDB ➤ Test folder, you
    could select the *same* `envConnection1` catalog environment. This would create
    an “absolute” reference.


    Click the OK button to select the catalog environment for the reference. The Configure
    – DILMSample references page will appear similar to that shown in Figure [5-18](#459435_1_En_5_Chapter.xhtml#Fig18).


    ![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig18_HTML.jpg](images/459435_1_En_5_Chapter/459435_1_En_5_Fig18_HTML.jpg)


    Figure 5-18 — Reference configured!


    Please note the “.” in the Environment Folder column; it indicates you selected
    a local catalog environment, or a catalog environment from the *same* catalog
    folder as the catalog project.


    ### Configuring a Reference Mapping


    Click the Parameters page and then click the Connection Managers tab. Click the
    ellipsis beside the `ConnectionString` property for your lone connection manager
    to open the Set Parameter Value dialog. Please note all three value configuration
    options are now enabled. Select the “Use environment variable” option and then
    select the `ConnectionString` catalog environment variable from the dropdown,
    as shown in Figure [5-19](#459435_1_En_5_Chapter.xhtml#Fig19).


    ![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig19_HTML.jpg](images/459435_1_En_5_Chapter/459435_1_En_5_Fig19_HTML.jpg)


    Figure 5-19 — Selecting the catalog environment variable for the reference mapping


    Click the OK button to create the reference mapping between the SSIS catalog project
    parameter, `SimplePackage.dtsx`’s `vmDemo\Demo\testDB1` connection manager `ConnectionString`,
    and the SSIS catalog environment variable named `ConnectionString` found in the
    reference to the SSIS catalog environment you created a few minutes ago. Your
    Configure – DILMSample dialog should now appear similar to that shown in Figure
    [5-20](#459435_1_En_5_Chapter.xhtml#Fig20).


    ![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig20_HTML.jpg](images/459435_1_En_5_Chapter/459435_1_En_5_Fig20_HTML.jpg)


    Figure 5-20 — Completed reference mapping!


    Please note that the value of the `ConnectionString` property is now the name
    of the SSIS catalog environment variable, and the text is decorated with an underline.


    ## Testing the Configuration


    To test your configuration, you will execute the SSIS package in the SSIS catalog.
    Right-click `SimplePackage.dtsx` and click Execute, as shown in Figure [5-21](#459435_1_En_5_Chapter.xhtml#Fig21).


    ![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig21_HTML.jpg](images/459435_1_En_5_Chapter/459435_1_En_5_Fig21_HTML.jpg)


    Figure 5-21 — Executing `SimplePackage.dtsx`


    You’ll see an error message at the top of the Execute Package dialog when the
    Execute Package dialog displays. Click the error to see the error message displayed
    in a message box, as shown in Figure [5-22](#459435_1_En_5_Chapter.xhtml#Fig22).


    ![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig22_HTML.jpg](images/459435_1_En_5_Chapter/459435_1_En_5_Fig22_HTML.jpg)


    Figure 5-22 — Displaying the execute package error message


    To clear the error, follow the instructions included in the error message. Check
    the Environment checkbox and select an SSIS catalog environment from the dropdown,
    as shown in Figure [5-23](#459435_1_En_5_Chapter.xhtml#Fig23).


    ![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig23_HTML.jpg](images/459435_1_En_5_Chapter/459435_1_En_5_Fig23_HTML.jpg)


    Figure 5-23 — Select an SSIS catalog environment


    The execute package error clears. Click the OK button to execute the `SimplePackage.dtsx`
    SSIS package. A message box similar to that shown in Figure [5-24](#459435_1_En_5_Chapter.xhtml#Fig24)
    informs you that package execution has started and asks if you would like to view
    the Overview Report.


    ![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig24_HTML.jpg](images/459435_1_En_5_Chapter/459435_1_En_5_Fig24_HTML.jpg)


    Figure 5-24 — Overview Report prompt


    Click the Yes button to display the Overview Report, shown in Figure [5-25](#459435_1_En_5_Chapter.xhtml#Fig25).


    ![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig25_HTML.jpg](images/459435_1_En_5_Chapter/459435_1_En_5_Fig25_HTML.jpg)


    Figure 5-25 — The Overview Report


    Please note the value for the `vmDemo\Demo.TestDB1.ConnectionString` parameter.
    The value at runtime is the value of the `ConnectionString` catalog environment
    variable you configured in the catalog environment named `envConnection1`. This
    test verifies that the reference mapping is configured and working properly.


    ## Conclusion


    These are the three sources of values for SSIS parameters in the SSIS catalog
    (with matching text decoration):


    1.  Design-time defaults

    2.  Literal overrides

    3.  Reference mappings


    Design-time defaults remain stored in the SSIS catalog but may be overridden using
    literal overrides or references and reference mappings to catalog environments
    and environment variables, respectively.


    # 6. Catalog Browser


    I was honored to be a Microsoft SQL Server MVP for five years (2007-2012). One
    cool thing about being a Microsoft MVP was access to the internal developer teams.
    Everyone could file Microsoft Connect items to report bugs and make suggestions
    for product improvements. Many MVPs did so only to have their bug reports marked
    as “works as designed” or “won’t fix” and suggestions responded to with something
    similar. It was discouraging. There are reasons many Connect items were addressed
    in this way. I am happy to report the root cause (performance-based management,
    or PBM) has been abandoned *and* the Microsoft Developer Teams are really and
    truly listening and responding to requests from the field.'
