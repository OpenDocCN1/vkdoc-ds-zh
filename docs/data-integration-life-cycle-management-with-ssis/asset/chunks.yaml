    The first step is to download BimlExpress from varigence.com, as shown in Figure
    [10-2](#459435_1_En_10_Chapter.xhtml#Fig2).


    ![../images/459435_1_En_10_Chapter/459435_1_En_10_Fig2_HTML.jpg](images/459435_1_En_10_Chapter/459435_1_En_10_Fig2_HTML.jpg)


