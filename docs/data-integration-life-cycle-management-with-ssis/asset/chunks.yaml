  trans: '

    ### 配置环境


    在 SSIS 目录中展开 `Environments` 虚拟文件夹。右键单击新建的目录环境，然后单击“属性”，如图 5-15 所示。


    ![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig15_HTML.jpg](img/459435_1_En_5_Fig15_HTML.jpg)


    图 5-15 — 准备配置 SSIS 目录环境变量


    单击“变量”页面。为目录环境变量添加名称（我将其命名为 `ConnectionString`）。将类型设置为 String。在“值”字段中添加一个有效的连接字符串，如图
    5-16 所示。


    ![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig16_HTML.jpg](img/459435_1_En_5_Fig16_HTML.jpg)


    图 5-16 — 配置 SSIS 目录环境变量


    单击“确定”按钮关闭“环境属性”对话框。


    ### 配置引用


    右键单击 DILMSample 目录项目，然后单击“配置”。当“配置 – DILMSample”对话框打开时，单击“引用”页面。单击“添加”按钮，在“浏览环境”对话框中的
    `Local Folder (Test)` 虚拟文件夹下选择刚刚创建的目录环境，如图 5-17 所示。


    ![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig17_HTML.jpg](img/459435_1_En_5_Fig17_HTML.jpg)


    图 5-17 — 选择用于引用的目录环境


    在“浏览环境”对话框中，实际上有两个“路径”可以访问 `envConnection1` 目录环境。`Local Folder` 路径在 SSIS 目录术语中创建了一个“相对”引用。如果展开
    SSISDB ➤ Test 文件夹，你可以选择*相同*的 `envConnection1` 目录环境。这将创建一个“绝对”引用。


    单击“确定”按钮选择用于引用的目录环境。“配置 – DILMSample”引用页面将类似于图 5-18 所示。


    ![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig18_HTML.jpg](img/459435_1_En_5_Fig18_HTML.jpg)


    图 5-18 — 引用已配置！


    请注意“环境文件夹”列中的“.”；它表示你选择了一个本地目录环境，或者一个与目录项目来自*相同*目录文件夹的目录环境。


    ### 配置引用映射


    单击“参数”页面，然后单击“连接管理器”选项卡。单击唯一连接管理器的 `ConnectionString` 属性旁边的省略号，打开“设置参数值”对话框。请注意，所有三个值配置选项现在都已启用。选择“使用环境变量”选项，然后从下拉列表中选择
    `ConnectionString` 目录环境变量，如图 5-19 所示。


    ![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig19_HTML.jpg](img/459435_1_En_5_Fig19_HTML.jpg)


    图 5-19 — 为引用映射选择目录环境变量


    单击“确定”按钮，在 SSIS 目录项目参数、`SimplePackage.dtsx` 的 `vmDemo\Demo\testDB1` 连接管理器 `ConnectionString`，以及你几分钟前创建的目录环境引用中名为
    `ConnectionString` 的 SSIS 目录环境变量之间创建引用映射。你的“配置 – DILMSample”对话框现在应该类似于图 5-20 所示。


    ![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig20_HTML.jpg](img/459435_1_En_5_Fig20_HTML.jpg)


    图 5-20 — 引用映射完成！


    请注意，`ConnectionString` 属性的值现在是 SSIS 目录环境变量的名称，并且文本带有下划线修饰。


    ## 测试配置


    要测试配置，你需要在 SSIS 目录中执行 SSIS 包。右键单击 `SimplePackage.dtsx`，然后单击“执行”，如图 5-21 所示。


    ![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig21_HTML.jpg](img/459435_1_En_5_Fig21_HTML.jpg)


    图 5-21 — 执行 `SimplePackage.dtsx`


    当“执行包”对话框显示时，你会在对话框顶部看到一个错误消息。单击该错误，可在消息框中显示错误消息，如图 5-22 所示。


    ![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig22_HTML.jpg](img/459435_1_En_5_Fig22_HTML.jpg)


    图 5-22 — 显示执行包错误消息


    要清除错误，请按照错误消息中的说明进行操作。选中“环境”复选框，然后从下拉列表中选择一个 SSIS 目录环境，如图 5-23 所示。


    ![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig23_HTML.jpg](img/459435_1_En_5_Fig23_HTML.jpg)


    图 5-23 — 选择一个 SSIS 目录环境


    执行包错误已清除。单击“确定”按钮执行 `SimplePackage.dtsx` SSIS 包。一个类似于图 5-24 所示的消息框会通知你包执行已开始，并询问你是否要查看概述报告。


    ![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig24_HTML.jpg](img/459435_1_En_5_Fig24_HTML.jpg)


    图 5-24 — 概述报告提示


    单击“是”按钮显示概述报告，如图 5-25 所示。


    ![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig25_HTML.jpg](img/459435_1_En_5_Fig25_HTML.jpg)


    图 5-25 — 概述报告


    请注意 `vmDemo\Demo.TestDB1.ConnectionString` 参数的值。运行时的值是你在名为 `envConnection1` 的目录环境中配置的
    `ConnectionString` 目录环境变量的值。此测试验证引用映射已正确配置且正常工作。


    ## 结论


    以下是 SSIS 目录中 SSIS 参数的三个值来源（附带匹配的文本修饰）：


    1.  设计时默认值

    2.  文本替代值

    3.  引用映射


    设计时默认值仍存储在 SSIS 目录中，但可以使用文本替代值或引用以及引用映射分别覆盖到目录环境和环境变量。


    # 6. 目录浏览器


    我很荣幸连续五年（2007-2012）成为微软 SQL Server MVP。成为微软 MVP 的一个好处是可以接触到内部开发团队。每个人都可以提交 Microsoft
    Connect 项来报告错误或提出产品改进建议。许多 MVP 这样做后，他们的错误报告被标记为“按设计工作”或“不修复”，而建议也得到类似回复。这令人沮丧。许多
    Connect 项以这种方式处理是有原因的。我很高兴地报告，根本原因（基于性能的管理，即 PBM）已被放弃，*并且*微软开发团队确实在倾听并响应来自实际需求的请求。

    '
- fmt: '# Why I Built DILM Suite, by Andy Leonard


    That doesn’t mean every suggestion is acted upon (I promise this is not a complaint).
    It turns out that Microsoft is a software development enterprise. As big as Microsoft
    is, it can’t possibly respond to *every* request. When I realized this, I began
    thinking about how I might address gaps I perceived. I’d cofounded a consulting
    company and we (collectively) weren’t interested in becoming a software product
    company. But I was *very* interested in developing products to address gaps in
    data integration lifecycle management (`DILM`).


    In 2015 I left the consulting company I cofounded and immediately began developing
    the software I’d dreamed of building. In my opinion, the most fair answers to
    the question of “Why?” are the following:


    1. I came to believe the Microsoft SSIS Developer Team would never address the
    things I perceived as “gaps” in the product story.

    2. I came to believe that the consulting company I cofounded and I held irreconcilable
    visions of how to address `DILM` issues.


    Looking back with two years of perspective, I believe focusing on `DILM` was the
    best long-term move for me. I started another consulting company, Enterprise Data
    & Analytics (`entdna.com`), mostly to fund my coding habit.


    ## Surfacing the SSIS Catalog


    Let’s examine the SSIS catalog surface in the SSMS Object Explorer’s Integration
    Services Catalogs node, shown in Figure [6-1](#459435_1_En_6_Chapter.xhtml#Fig1).


    ![../images/459435_1_En_6_Chapter/459435_1_En_6_Fig1_HTML.jpg](images/459435_1_En_6_Chapter/459435_1_En_6_Fig1_HTML.jpg)


    **Figure 6-1** — The SSIS catalog as shown in the SSMS Object Explorer Integration
    Services Catalogs node


    Beneath the Integration Services Catalogs node we find the SSIS catalog named
    `SSISDB`. Two catalog folders are displayed, `Framework` and `Test`. The `Test`
    folder contains the `Projects` and `Environments` virtual folders. The `Projects`
    virtual folder contains the SSIS catalog project named `DILMSample`, which in
    turn contains the SSIS package named `SimplePackage.dtsx`. The `Environments`
    virtual folder contains the catalog environment named `envConnection1`.


    You know, because you’ve done the work, that there’s more there than meets the
    eye.


    ## SSIS Catalog Environment Configuration


    If you double-click `envConnection1`, you can see details of your catalog environment
    variable on the Variables page, shown in Figure [6-2](#459435_1_En_6_Chapter.xhtml#Fig2).


    ![../images/459435_1_En_6_Chapter/459435_1_En_6_Fig2_HTML.jpg](images/459435_1_En_6_Chapter/459435_1_En_6_Fig2_HTML.jpg)


    **Figure 6-2** — Viewing the Variables page of an SSIS catalog environment


    The Variables page contains details about SSIS catalog environment variables including
    name, data type, description, value, and whether the variable is sensitive.


    ## SSIS Catalog Project Configuration


    The Parameters tab on the Parameters page of the SSIS Catalog Project Configuration
    dialog lists SSIS project and package parameters, their container name, and value
    by default, as shown in Figure [6-3](#459435_1_En_6_Chapter.xhtml#Fig3).


    ![../images/459435_1_En_6_Chapter/459435_1_En_6_Fig3_HTML.jpg](images/459435_1_En_6_Chapter/459435_1_En_6_Fig3_HTML.jpg)


    **Figure 6-3** — Viewing project parameters and values for an SSIS catalog project


    The Connection Managers tab of the Parameters page contains a list of SSIS project
    and package connection managers and their properties, as shown in Figure [6-4](#459435_1_En_6_Chapter.xhtml#Fig4).


    ![../images/459435_1_En_6_Chapter/459435_1_En_6_Fig4_HTML.jpg](images/459435_1_En_6_Chapter/459435_1_En_6_Fig4_HTML.jpg)


    **Figure 6-4** — Viewing connection manager parameters and values for an SSIS
    catalog project


    The References page of the SSIS Catalog Project Configure dialog contains a list
    of SSIS catalog environments the SSIS catalog project may reference at runtime,
    as shown in Figure [6-5](#459435_1_En_6_Chapter.xhtml#Fig5).


    ![../images/459435_1_En_6_Chapter/459435_1_En_6_Fig5_HTML.jpg](images/459435_1_En_6_Chapter/459435_1_En_6_Fig5_HTML.jpg)


    **Figure 6-5** — Viewing project references for an SSIS catalog project


    That’s a lot of right- and double-clicking just to see what’s configured in an
    SSIS catalog project.'
  raw: '## Why I Built DILM Suite, by Andy Leonard


    That doesn’t mean every suggestion is acted upon (I promise this is not a complaint).
    It turns out that Microsoft is a software development enterprise. As big as Microsoft
    is, it can’t possibly respond to *every* request. When I realized this, I began
    thinking about how I might address gaps I perceived. I’d cofounded a consulting
    company and we (collectively) weren’t interested in becoming a software product
    company. But I was *very* interested in developing products to address gaps in
    data integration lifecycle management (DILM) .


    In 2015 I left the consulting company I cofounded and immediately began developing
    the software I’d dreamed of building. In my opinion, the most fair answers to
    the question of “Why?” are the following:


    1.  I came to believe the Microsoft SSIS Developer Team would never address the
    things I perceived as “gaps” in the product story.


    2.  I came to believe that the consulting company I cofounded and I held irreconcilable
    visions of how to address DILM issues.


    Looking back with two years of perspective, I believe focusing on DILM was the
