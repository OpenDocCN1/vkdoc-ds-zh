    \ Inc (SSBM Finance Inc)。SSBM Finance Inc 是特拉华州的一家公司。\n\n*献给克里斯蒂。*\n\n## 前言\n\n\
    我有幸与安迪·伦纳德相识并共事多年。大部分时间里，我们以独立承包人的身份合作项目。我们目睹并学习了 SSIS 多年来如何逐步成熟。安迪是我合作过的最知识渊博、技术精湛的人之一。而在这个领域工作了近\
    \ 40 年后，我合作过的人非常多。\n\n本书充满了我们在多年实践中通过试用 SSIS 解决实际问题而学到的**最佳实践**。我们通过实践、反思并寻找更优解决方案来学习。事物变化很快，所以我们一直在学习新东西。我们不断重新评估过去的做法，并将其与后来学到的新知进行比较。\n\
    \n《SSIS 数据集成生命周期管理》源于多个项目反复迭代的经验。它不仅关乎开发，还涉及持续的维护工作。理解这两个方面对于在 DevOps 企业中开发高效的流程至关重要。这种方法论有助于使开发和部署流程更高效、更有效、更具可预测性。这让我们所有人都更快乐一点。\n\
    \n这本书也旨在分享一路走来的学习心得，让其他人从中受益。安迪正是这样的践行者，这也是我最欣赏他的一点。我真诚希望您能从本书中获得帮助，并长久受益。\n\n\
    祝阅读愉快！\n\n肯特·布拉德肖  \n2017 年夏季\n\n## 致谢\n\n我首先感谢上帝，因祂为自己的名引导我走义路（诗篇 23:3）。感谢我的爱妻克里斯蒂，以及我们的孩子——史蒂维·雷、艾玛和赖利——为我牺牲了部分父亲陪伴时间。感谢企业数据与分析团队的出色成员——肯特·布拉德肖、尼克·哈里斯和彭妮·特鲁普——在我写作期间的耐心与辛勤工作。我在\
    \ Apress 也拥有一个出色的团队：吉尔·巴尔扎诺让一切顺利运转，乔纳森·詹尼克是业内最优秀的编辑。\n\n## 关于作者\n\n# 1. DILM 简介\n\
    \n*DevOps* 是“开发”（Development）和“运维”（Operations）两个词的组合。DevOps 关乎流程改进，体现为更快的上市时间、更高的质量、可重复的自动化，以及更易于支持和维护的代码。软件测试是\
    \ DevOps 的主要部分，从软件开发人员进行的单元测试开始。软件测试发生在所有企业应用层级（开发、质量保证、用户验收、生产等）。DevOps 开发人员通过展现流程仪表化并构建可重复的配置脚本，来支持运维工作。配置脚本有助于提高质量、加快灾难恢复，并快速可靠地增加企业应用层级。\n\
    \n软件开发人员遵循最佳实践来构建健壮的企业软件。数十年来，开发人员在构建应用时一直应用一套称为**应用生命周期管理**（应用生命周期管理，简称*ALM*）的最佳实践。什么是\
    \ ALM？应用生命周期管理包含支持 DevOps 的设计原则。一个重要的开发概念是**关注点分离**，即包括外部化（参数化）和解耦在内的设计最佳实践。\n\
    \n*数据集成* 是将数据从一个位置移动到另一个位置。数据通常从不同来源收集并加载到数据库中，以支持集中式报告。这些报告数据库在不同企业中有不同名称：操作数据存储（ODS）、临时数据库、中央存储库、数据仓库（DW）或企业数据仓库（EDW）等。\n\
    \n数据集成*就是*软件开发。数据集成生命周期管理（简称*DILM*）是在现代 DevOps 企业中管理数据集成的艺术与科学。在本书中，我将分享我在大小企业中管理\
    \ SQL Server 集成服务（SSIS）数据集成解决方案所学到的经验。\n\n我撰写本书的目标是教您如何在您的企业中管理 SSIS。与所有其他软件开发平台一样，生命周期管理是\
    \ SSIS 的最佳实践。与所有其他软件开发一样，使用 SSIS 实践 DevOps 是可行的。\n\n## 一些历史\n\nSQL Server 集成服务（SSIS）于\
    \ 2005 年 11 月发布。SSIS 的开发远在此之前就开始了，据我所知，该产品最初计划命名为数据转换服务（DTS）2.0。许多程序集都带有命名空间`Dts`。\n\
    \n我想通过关于 SSIS 的几点声明来介绍本书。\n\n### SSIS 是一个软件开发平台\n\n我记不清多少次看到招聘“具有 SSIS 经验”的数据库管理员职位了。\n\
    \n数据库管理员、数据库开发人员和 SSIS 开发人员是不同的角色。\n\n每当我看到这样的招聘信息时，都会有些皱眉。SSIS 是一个软件开发平台，我是一名软件开发人员。我也是一名数据库开发人员。我*不是*数据库管理员。我曾尝试担任\
    \ DBA 的工作，但惨遭失败。这并不是说我不欣赏 DBA 的角色；我保证我欣赏。我的一些最好的朋友就是 DBA。我想首先向您传达这个简单的事实：DBA、数据库开发人员和\
    \ SSIS 开发人员是不同的角色。\n"
- fmt: "### SSIS Is an Enterprise Data Integration Engine\n\nSSIS is designed to move\
    \ data from one location to another, which is the essence of data integration.\
    \ Data integration can include reshaping, cleansing, and transformation of data;\
    \ but at its heart, data integration is data relocation. The `SSIS Data Flow Task`\
    \ was revolutionary when it was introduced. In my humble opinion, it remains pretty\
    \ slick technology. The pipeline architecture surfaces most of the levers one\
    \ needs to tweak to achieve enterprise scale.\n\nIs SSIS the perfect data integration\
    \ engine for *every* data integration need? No. But it is an amazingly flexible\
    \ solution to most data integration requirements.\n\nA number of times I’ve accomplished\
    \ what-cannot-be-done with SSIS. Years ago I even got into a flame war online\
    \ with a really smart, internet-famous software developer who wrote a post listing\
    \ all the things wrong with SSIS. I shared with this individual that I teach people\
    \ SSIS and all my students know the solution to almost every item listed in the\
    \ post.\n\n> *Someone recently asked me, “When is Microsoft going to deliver an\
    \ enterprise data integration engine?” My response? “2005.”*\n> \n> – Andy Leonard\n\
    \n### SSIS Is Difficult to Learn\n\nHow do I know? I (and others) have made a\
    \ living for more than a decade teaching people how to use SSIS.\n\nAll software\
    \ platforms have “corners,” - quirks and edge cases that the language just isn’t\
    \ the best at managing. SSIS has about 30 corners. I describe the data flow task\
    \ to students in this manner: “SSIS wants you to *think* like a data flow and\
    \ thinking like a data flow is hard.”\n\n“SSIS wants you to think like a data\
    \ flow.”\n\n### Lifecycle Management\n\nSSIS, even at the time of this writing,\
    \ is difficult to manage in the enterprise lifecycle. Exhibit A is comparing SSIS\
    \ packages. SSIS is XML-based. XML is a self-describing data format with less\
    \ respect for order than traditional data stores. For example, the following XML\
    \ snippets are equivalent:\n\n```\nData Integration Lifecycle Management\nAndy\
    \ Leonard\n\nAndy Leonard\nData Integration Lifecycle Management\n```\n\nYou may\
    \ look at this example and quip, “But Andy, I can figure out that these data are\
    \ equivalent just by looking at them.” You are correct; examining five rows of\
    \ data is pretty simple. Imagine looking at five hundred rows of XML, with tags\
    \ and attributes in a different order, and you begin to understand the complexity\
    \ of comparing XML data.\n\nXML is not bad or wrong. XML’s semi-structured nature\
    \ makes SSIS difficult to compare.\n\n### Solutions and Credit Where Credit Is\
    \ Due\n\nThe remainder of this book focuses on solutions. With the exception of\
    \ the `BimlExpress Metadata Framework`, Kent Bradshaw, Kevin Hazzard, and I developed\
    \ the solutions contained in this book. Scott Currie and his team at Varigence,\
    \ Inc. built Business Intelligence Markup Language (Biml) and taught us how to\
    \ author Biml. Some of what Scott and his team taught us made its way into the\
    \ `BimlExpress Metadata Framework`.\n\nA more accurate rendering of the facts\
    \ is that Kent, Kevin, and I learned what we know from experience and from others.\
    \ In a very real sense, none of us is *self-taught*. Rather, we are *community-taught*.\n\
    \nSome of these solutions are simply ways of using the technology Microsoft shipped\
    \ “in the box” with SSIS. Some are best practices. Some are manual and others\
    \ are automated. Some are free tools and utilities by vendors. Some are free utilities\
    \ and tools the team at Enterprise Data & Analytics (`entdna.com`), Tudor Data\
    \ Solutions (`tudords.com`), and DevJourney (`devjourney.com`) have developed;\
    \ many are part of the DILM Suite (`dilmsuite.com`). One, BimlExpress, is a third-party\
    \ product from Varigence (`varigence.com`). A couple, `SSIS Framework Community\
    \ Edition` and `BimlExpress Metadata Framework`, are free versions of for-sale\
    \ implemented solutions that Enterprise Data & Analytics sells as part of consulting\
    \ engagements.\n\nDo we have all the answers? Goodness no! We have some. Like\
    \ you, we learn new stuff every day. Here in this book is some of what we know\
    \ today.\n\n# 2. SSIS\n\nThis book is not intended to teach you SSIS. If you read\
    \ this book and work through the examples, you may learn more about SSIS. That\
    \ is my hope, but it’s not my goal in writing this book to teach you SSIS. My\
    \ goal is teach you how to *manage* SSIS in your enterprise. If you desire to\
    \ learn SSIS, I recommend the *Stairway to Integration Services at SQL Server\
    \ Central* (`sqlservercentral.com/stairway/72494/`) for beginners and *SQL Server\
    \ Integration Services Design Patterns* (`amazon.com/Server-Integration-Services-Design-Patterns/dp/1484200837`)\
    \ for more advanced learning.\n\nLearning by example is best. In this chapter,\
    \ you will build an SSIS project for demonstration purposes. This SSIS project\
    \ will include one SSIS package, a connection manager, variables, project parameters,\
    \ and package parameters. You will use this SSIS project, `DILMSample`, throughout\
    \ the remainder of this book. The SSIS project is built in SQL Server Data Tools\
    \ (`SSDT`). Please see Appendix A for links to the tools and utilities you will\
    \ use throughout this book.\n\nI will discuss data integration instrumentation\
    \ and messaging to surface log messages during the execution of the SSIS package.\
    \ These messages serve people troubleshooting failed executions and surface important\
    \ data integration instrumentation metadata.\n\n## The Demo\n\nOpen `SSDT` and\
    \ create a new SSIS project named `DILMSample`. When `SSDT` creates a new SSIS\
    \ project, it loads a default SSIS project. The default SSIS project includes:\n\
    \n*   Project parameters, stored in the `Project.params` file\n*   A virtual folder\
    \ for project-scope connection managers\n*   A virtual folder for package parts\n\
    \    *   A virtual folder for control flow package parts\n*   A virtual folder\
    \ for miscellaneous items\n*   A default (empty) SSIS package named `Package.dtsx`\n\
    \nRename `Package.dtsx` as `SimplePackage.dtsx`, as shown in Figure [2-1](#459435_1_En_2_Chapter.xhtml#Fig1).\n\
    \n![../images/459435_1_En_2_Chapter/459435_1_En_2_Fig1_HTML.jpg](images/459435_1_En_2_Chapter/459435_1_En_2_Fig1_HTML.jpg)\n\
    \n**Figure 2-1** The DILMSample SSIS project\n\nRenaming the package communicates\
    \ intent; leaving the default package name communicates laziness.\n\n## Adding\
    \ Package Parameters\n\nSince we plan to use this project and package to demonstrate\
    \ lifecycle management, let’s add parameters. To start, click the Parameters tab\
    \ on the `SimplePackage.dtsx` package. Add two package parameters with the settings\
    \ shown in Table [2-1](Table_01_0002_0001.xhtml).\n\n[Table 2-1](Table_01_0002_0001.xhtml)\
    \ Package Parameter Settings\n\nWhen completed, your Parameters tab should appear\
    \ similar to that shown in Figure [2-2](#459435_1_En_2_Chapter.xhtml#Fig2).\n\n\
    ![../images/459435_1_En_2_Chapter/459435_1_En_2_Fig2_HTML.jpg](images/459435_1_En_2_Chapter/459435_1_En_2_Fig2_HTML.jpg)\n\
    \n**Figure 2-2** Package parameters\n\nYou add these demo parameters at the package\
    \ scope. *Scope* is an important concept in software development *and* lifecycle\
    \ management. The “Dev” part of DevOps focuses on building code that is easily\
    \ manageable by Operations. How does scope help? Later you will *externalize*\
    \ parameter values into Transact-SQL (`T-SQL`) scripts. Operations personnel will\
    \ ultimately manage externalized values by deploying and maintaining `T-SQL` scripts.\
    \ One goal of DevOps development is to communicate as much information as possible\
    \ to Operations people, especially Operations people who have no idea how SSIS\
    \ works. Scoping parameters and variables to their proper level (no higher or\
    \ lower) communicates where and how parameter values are used in the SSIS application,\
    \ thus shedding some light on the “black box” of the data integration project."
  raw: "### SSIS Is an Enterprise Data Integration Engine\n\nSSIS is designed to move\
    \ data from one location to another, which is the essence of data integration.\
    \ Data integration can include reshaping, cleansing, and transformation of data;\
    \ but at its heart, data integration is data relocation. The SSIS Data Flow Task\
    \ was revolutionary when it was introduced. In my humble opinion, it remains pretty\
    \ slick technology. The pipeline architecture surfaces most of the levers one\
    \ needs to tweak to achieve enterprise scale.\n\nIs SSIS the perfect data integration\
    \ engine for *every* data integration need? No. But it is an amazingly flexible\
    \ solution to most data integration requirements.\n\nA number of times I’ve accomplished\
    \ what-cannot-be-done with SSIS. Years ago I even got into a flame war online\
    \ with a really smart, internet-famous software developer who wrote a post listing\
    \ all the things wrong with SSIS. I shared with this individual that I teach people\
    \ SSIS and all my students know the solution to almost every item listed in the\
    \ post.\n\n> *Someone recently asked me, “When is Microsoft going to deliver an\
    \ enterprise data integration engine?” My response? “2005.”*\n> \n> – Andy Leonard\n\
    \n### SSIS Is Difficult to Learn\n\nHow do I know? I (and others) have made a\
    \ living for more than a decade teaching people how to use SSIS.\n\nAll software\
    \ platforms have “corners,” - quirks and edge cases that the language just isn’t\
    \ the best at managing. SSIS has about 30 corners. I describe the data flow task\
    \ to students in this manner: “SSIS wants you to *think* like a data flow and\
    \ thinking like a data flow is hard.”\n\n“SSIS wants you to think like a data\
    \ flow.”\n\n### Lifecycle Management\n\nSSIS, even at the time of this writing,\
    \ is difficult to manage in the enterprise lifecycle. Exhibit A is comparing SSIS\
    \ packages. SSIS is XML-based. XML is a self-describing data format with less\
    \ respect for order than traditional data stores. For example, the following XML\
    \ snippets are equivalent:\n\n```\nData Integration Lifecycle Management\nAndy\
    \ Leonard\n\nAndy Leonard\nData Integration Lifecycle Management\n\n```\n\nYou\
    \ may look at this example and quip, “But Andy, I can figure out that these data\
    \ are equivalent just by looking at them.” You are correct; examining five rows\
    \ of data is pretty simple. Imagine looking at five hundred rows of XML, with\
    \ tags and attributes in a different order, and you begin to understand the complexity\
    \ of comparing XML data.\n\nXML is not bad or wrong. XML’s semi-structured nature\
    \ makes SSIS difficult to compare.\n\n### Solutions and Credit Where Credit Is\
    \ Due\n\nThe remainder of this book focuses on solutions. With the exception of\
    \ the BimlExpress Metadata Framework, Kent Bradshaw, Kevin Hazzard, and I developed\
    \ the solutions contained in this book. Scott Currie and his team at Varigence,\
    \ Inc. built Business Intelligence Markup Language (Biml) and taught us how to\
    \ author Biml. Some of what Scott and his team taught us made its way into the\
    \ BimlExpress Metadata Framework.\n\nA more accurate rendering of the facts is\
    \ that Kent, Kevin, and I learned what we know from experience and from others.\
    \ In a very real sense, none of us is *self-taught*. Rather, we are *community-taught*.\n\
    \nSome of these solutions are simply ways of using the technology Microsoft shipped\
    \ “in the box” with SSIS. Some are best practices. Some are manual and others\
    \ are automated. Some are free tools and utilities by vendors. Some are free utilities\
    \ and tools the team at Enterprise Data & Analytics (`entdna.com`), Tudor Data\
    \ Solutions (`tudords.com`), and DevJourney (`devjourney.com`) have developed;\
    \ many are part of the DILM Suite (`dilmsuite.com`). One, BimlExpress, is a third-party\
    \ product from Varigence (`varigence.com`). A couple, SSIS Framework Community\
    \ Edition and BimlExpress Metadata Framework, are free versions of for-sale implemented\
    \ solutions that Enterprise Data & Analytics sells as part of consulting engagements.\n\
    \nDo we have all the answers? Goodness no! We have some. Like you, we learn new\
    \ stuff every day. Here in this book is some of what we know today.\n\n# 2. SSIS\n\
    \nThis book is not intended to teach you SSIS. If you read this book and work\
    \ through the examples, you may learn more about SSIS. That is my hope, but it’s\
    \ not my goal in writing this book to teach you SSIS. My goal is teach you how\
    \ to *manage* SSIS in your enterprise. If you desire to learn SSIS, I recommend\
    \ the *Stairway to Integration Services at SQL Server Central* (`sqlservercentral.com/stairway/72494/`)\
    \ for beginners and *SQL Server Integration Services Design Patterns* (`amazon.com/Server-Integration-Services-Design-Patterns/dp/1484200837`)\
    \ for more advanced learning.\n\nLearning by example is best. In this chapter,\
    \ you will build an SSIS project for demonstration purposes. This SSIS project\
    \ will include one SSIS package, a connection manager, variables, project parameters,\
    \ and package parameters. You will use this SSIS project, DILMSample, throughout\
    \ the remainder of this book. The SSIS project is built in SQL Server Data Tools\
    \ (SSDT). Please see Appendix A for links to the tools and utilities you will\
    \ use throughout this book.\n\nI will discuss data integration instrumentation\
    \ and messaging to surface log messages during the execution of the SSIS package.\
    \ These messages serve people troubleshooting failed executions and surface important\
    \ data integration instrumentation metadata.\n\n## The Demo\n\nOpen SSDT and create\
    \ a new SSIS project named DILMSample. When SSDT creates a new SSIS project, it\
    \ loads a default SSIS project. The default SSIS project includes\n\n*   Project\
    \ parameters, stored in the `Project.params` file\n\n*   A virtual folder for\
    \ project-scope connection managers\n\n*   A virtual folder for package parts\n\
    \    *   A virtual folder for control flow package parts\n\n*   A virtual folder\
    \ for miscellaneous items\n\n*   A default (empty) SSIS package named `Package.dtsx`\n\
    \nRename `Package.dtsx` as `SimplePackage.dtsx`, as shown in Figure [2-1](#459435_1_En_2_Chapter.xhtml#Fig1).\n\
    \n![../images/459435_1_En_2_Chapter/459435_1_En_2_Fig1_HTML.jpg](images/459435_1_En_2_Chapter/459435_1_En_2_Fig1_HTML.jpg)\n\
    \nFigure 2-1\n\nThe DILMSample SSIS project\n\nRenaming the package communicates\
    \ intent; leaving the default package name communicates laziness.\n\n## Adding\
    \ Package Parameters\n\nSince we plan to use this project and package\n\nto demonstrate\
    \ lifecycle management, let’s add parameters. To start, click the Parameters tab\
    \ on the `SimplePackage.dtsx` package. Add two package parameters with the settings\
