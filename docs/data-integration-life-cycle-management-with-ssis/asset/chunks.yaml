  trans: '

    ### 查看 SSIS 框架社区版元数据


    如前所述，SSIS 框架社区版需要相当多的元数据。我们之前使用的脚本是一种很好的自动化输入 SSIS 框架社区版元数据的方式，但当我们想要*查看*已存储的框架应用程序时，该怎么办呢？


    这时可以借助 `Framework Browser`，这是 DILM Suite 中的另一个免费实用工具，你可以从 `dilmsuite.com/framework-browser`
    下载，如图 8-5 所示。


    ![../images/459435_1_En_8_Chapter/459435_1_En_8_Fig5_HTML.jpg](img/459435_1_En_8_Fig5_HTML.jpg)


    **图 8-5** 框架应用程序的 Load AdventureWorks2014 阶段


    框架应用程序是一组 SSIS 包的集合，在框架中被称为*应用程序包*，它们按指定顺序执行。`Framework Browser` 会按照执行顺序列出应用程序包。


    如果你展开 `Application Properties` 虚拟文件夹，就会看到框架应用程序元数据。展开 `Application Package` 节点和
    `Application Package Properties` 节点，可以显示应用程序包元数据，如图 8-6 所示。


    ![../images/459435_1_En_8_Chapter/459435_1_En_8_Fig6_HTML.jpg](img/459435_1_En_8_Fig6_HTML.jpg)


    **图 8-6** 显示应用程序和应用程序包框架元数据


    `Framework Browser` 是 DILM Suite 中的另一个免费实用工具。


    # 9. 目录报表


    在迄今为止的学习过程中，你已经多次接触过 SQL Server Management Studio (SSMS) 内置的 SSMS 目录报表解决方案，最近一次是在上一章。作为一名数据集成架构师，我发现这些报表非常棒，但存在两个小问题：


    1.  我无法选择文本进行复制粘贴。

    2.  要查看 SSMS 目录报表，必须安装 SSMS。


    关于第二点，企业中有些人确实需要查看生产环境中数据集成流程的执行情况，但他们没有理由在自己的机器上安装完整的 SSMS，更不用说获得企业生产环境的访问权限了。SSMS
    是管理数据和全面管理 SQL Server 的极佳工具。仅为了授予某人访问 SSMS 目录报表的权限而安装 SSMS，实在是小题大做。


    请看看 `Catalog Reports`，这是 DILM Suite 中的一个免费开源解决方案，网址是 `dilmsuite.com/catalog-reports`。


    `Catalog Reports` 的设计在外观和感觉上都与 SSMS 版本相似，但它们位于 SQL Server Reporting Services (SSRS)
    中。请看图 9-1 所示的执行报表。


    ![../images/459435_1_En_9_Chapter/459435_1_En_9_Fig1_HTML.jpg](img/459435_1_En_9_Fig1_HTML.jpg)


    **图 9-1** DILM Suite 目录报表——执行报表


    DILM Suite 目录报表展示了与 SSMS 目录报表相同的日志和数据，且无需安装 SSMS。由于该解决方案是开源的，SSRS 开发人员可以编辑报表以添加公司徽标、应用企业配色方案或包含额外数据。


    报表查看者可以从显示报表的浏览器中选择并复制文本。还提供了导出报表内容的选项，如图 9-2 所示。


    ![../images/459435_1_En_9_Chapter/459435_1_En_9_Fig2_HTML.jpg](img/459435_1_En_9_Fig2_HTML.jpg)


    **图 9-2** 报表导出选项


    执行报表的右侧包含指向该解决方案中其他报表的链接：`Overview`、`Messages` 和 `Performance`（如图 9-3 所示）。


    ![../images/459435_1_En_9_Chapter/459435_1_En_9_Fig3_HTML.jpg](img/459435_1_En_9_Fig3_HTML.jpg)


    **图 9-3** 执行报表中的更多字段


    点击最上面 SSIS 包执行的 `Overview` 链接，打开概览报表。概览报表在报表左侧的表格中按执行路径（SSIS 包中的各个可执行文件）分组显示 SSIS
    包执行摘要。该表格对于确定 SSIS 包中运行时间最长的部分非常有用。执行信息表显示操作日志数据，例如 SSIS 包执行状态、持续时间、开始时间以及本次执行所引用的目录环境名称。执行参数表显示
    SSIS 目录执行参数设置以及任何被覆盖或引用的参数，如图 9-4 所示。


    ![../images/459435_1_En_9_Chapter/459435_1_En_9_Fig4_HTML.jpg](img/459435_1_En_9_Fig4_HTML.jpg)


    **图 9-4** DILM Suite 目录报表——概览报表


    DILM Suite 概览报表顶部有导航链接，方便导航至 `Executions`、`Performance` 和 `Messages` 报表。点击 `Messages`
    链接查看消息报表，如图 9-5 所示。


    ![../images/459435_1_En_9_Chapter/459435_1_En_9_Fig5_HTML.jpg](img/459435_1_En_9_Fig5_HTML.jpg)


    **图 9-5** DILM Suite 目录报表——消息报表


    消息报表列出了 SSIS 包执行过程中记录的所有消息、消息记录时间、引发消息的事件以及引发该事件的可执行文件名称。


    性能报表以图表形式显示之前成功执行的持续时间，如图 9-6 所示。


    ![../images/459435_1_En_9_Chapter/459435_1_En_9_Fig6_HTML.jpg](img/459435_1_En_9_Fig6_HTML.jpg)


    **图 9-6** DILM Suite 目录报表——性能报表


    DILM Suite 目录报表解决方案是免费且开源的，并且解决了 SSMS 目录报表的几个问题。


    # 10. BimlExpress 元数据框架


    商业智能标记语言 (Biml) 是一种基于 XML 的语言，它能提高数据集成开发人员的生产力并改进 SSIS 代码质量。`BimlExpress` 是免费的，并能集成到
    SQL Server Data Tools (SSDT) 中。BimlExpress 元数据框架旨在鼓励思考将 Biml 的强大功能与元数据相结合的可能性。


    你可以在 `varigence.com/biml` 和 `bimlscript.com` 了解更多关于 Biml 的信息。你可以在 `varigence.com/bimlexpress`
    获取 `BimlExpress`。你可以在 `dilmsuite.com/biml-express-metadata-framework` 获取一份 BimlExpress
    元数据框架项目的副本。


    安装 `BimlExpress` 后，开发人员可以在 SSDT 中访问 `BimlExpress` 菜单。开发人员应首先打开的文档是 `README` 文件，如图
    10-1 所示。


    ![../images/459435_1_En_10_Chapter/459435_1_En_10_Fig1_HTML.jpg](img/459435_1_En_10_Fig1_HTML.jpg)


    **图 10-1** 在 SSDT 中查看 BimlExpress 元数据框架项目


    `README` 文件中的说明会指导开发人员完成使用 BimlExpress 元数据框架所需的步骤。我将在本章中遵循其中的大多数步骤。如果你想使用 BimlExpress
    元数据框架，也应该遵循这些步骤。

    '
- fmt: "# Downloading and Installing BimlExpress\n\nThe first step is to download\
    \ BimlExpress from varigence.com, as shown in Figure [10-2](#459435_1_En_10_Chapter.xhtml#Fig2).\n\
    \n![../images/459435_1_En_10_Chapter/459435_1_En_10_Fig2_HTML.jpg](images/459435_1_En_10_Chapter/459435_1_En_10_Fig2_HTML.jpg)\n\
    \nFigure 10-2\n\nDownloading BimlExpress\n\nWhen the download is complete, execute\
    \ the `.vsix` file to install BimlExpress, as shown in Figure [10-3](#459435_1_En_10_Chapter.xhtml#Fig3).\n\
    \n![../images/459435_1_En_10_Chapter/459435_1_En_10_Fig3_HTML.jpg](images/459435_1_En_10_Chapter/459435_1_En_10_Fig3_HTML.jpg)\n\
    \nFigure 10-3\n\nInstalling BimlExpress\n\nAccept the License Agreement, as shown\
    \ in Figure [10-4](#459435_1_En_10_Chapter.xhtml#Fig4).\n\n![../images/459435_1_En_10_Chapter/459435_1_En_10_Fig4_HTML.jpg](images/459435_1_En_10_Chapter/459435_1_En_10_Fig4_HTML.jpg)\n\
    \nFigure 10-4\n\nAccepting the License Agreement\n\nClick the Install button to\
    \ install BimlExpress.\n\nWhen the installation completes, the VSIX Installer\
    \ will display a notification similar to that shown in Figure [10-5](#459435_1_En_10_Chapter.xhtml#Fig5).\n\
    \n![../images/459435_1_En_10_Chapter/459435_1_En_10_Fig5_HTML.jpg](images/459435_1_En_10_Chapter/459435_1_En_10_Fig5_HTML.jpg)\n\
    \nFigure 10-5\n\nBimlExpress installation is complete\n\nClick the Close button\
    \ and open SQL Server Data Tools (SSDT).\n\nClick Tools ➤ Extensions and Updates,\
    \ as shown in Figure [10-6](#459435_1_En_10_Chapter.xhtml#Fig6).\n\n![../images/459435_1_En_10_Chapter/459435_1_En_10_Fig6_HTML.jpg](images/459435_1_En_10_Chapter/459435_1_En_10_Fig6_HTML.jpg)\n\
    \nFigure 10-6\n\nOpening Extensions and Updates\n\nThe Extensions and Updates\
    \ dialog is where you manage BimlExpress and other SSDT plugins, as shown in Figure\
    \ [10-7](#459435_1_En_10_Chapter.xhtml#Fig7).\n\n![../images/459435_1_En_10_Chapter/459435_1_En_10_Fig7_HTML.jpg](images/459435_1_En_10_Chapter/459435_1_En_10_Fig7_HTML.jpg)\n\
    \nFigure 10-7\n\nThe Extensions and Updates dialog\n\nIf you see the BimlExpress\
    \ menu item shown in Figure [10-8](#459435_1_En_10_Chapter.xhtml#Fig8), BimlExpress\
    \ is installed and enabled.\n\n![../images/459435_1_En_10_Chapter/459435_1_En_10_Fig8_HTML.jpg](images/459435_1_En_10_Chapter/459435_1_En_10_Fig8_HTML.jpg)\n\
    \nFigure 10-8\n\nBimlExpress installed and enabled\n\n## Downloading BimlExpress\
    \ Metadata Framework\n\nLet’s next download the BimlExpress Metadata Framework\
    \ code from `dilmsuite.com/biml-express-metadata-framework`, as shown in Figure\
    \ [10-9](#459435_1_En_10_Chapter.xhtml#Fig9).\n\n![../images/459435_1_En_10_Chapter/459435_1_En_10_Fig9_HTML.jpg](images/459435_1_En_10_Chapter/459435_1_En_10_Fig9_HTML.jpg)\n\
    \nFigure 10-9\n\nDownloading BimlExpress Metadata Framework\n\nThe BimlExpress\
    \ Metadata Framework file is a text file named `BimlExpressMetadataFramewor.renametozip.txt`,\
    \ shown in Figure [10-10](#459435_1_En_10_Chapter.xhtml#Fig10).\n\n![../images/459435_1_En_10_Chapter/459435_1_En_10_Fig10_HTML.jpg](images/459435_1_En_10_Chapter/459435_1_En_10_Fig10_HTML.jpg)\n\
    \nFigure 10-10\n\nThe BimlExpress Metadata Framework file\n\nOne the file is downloaded,\
    \ rename it as shown in Figure [10-11](#459435_1_En_10_Chapter.xhtml#Fig11).\n\
    \n![../images/459435_1_En_10_Chapter/459435_1_En_10_Fig11_HTML.jpg](images/459435_1_En_10_Chapter/459435_1_En_10_Fig11_HTML.jpg)\n\
    \nFigure 10-11\n\nPreparing to rename the Biml Express Metadata Framework Download\
    \ file\n\nChanging the file extension to \"zip\" will trigger the warning shown\
    \ in Figure [10-12](#459435_1_En_10_Chapter.xhtml#Fig12).\n\n![../images/459435_1_En_10_Chapter/459435_1_En_10_Fig12_HTML.jpg](images/459435_1_En_10_Chapter/459435_1_En_10_Fig12_HTML.jpg)\n\
    \nFigure 10-12\n\nWarning about renaming a file and changing the extension\n\n\
    After renaming, the Biml Express Metadata Framework Download file appears as shown\
    \ in Figure [10-13](#459435_1_En_10_Chapter.xhtml#Fig13).\n\n![../images/459435_1_En_10_Chapter/459435_1_En_10_Fig13_HTML.jpg](images/459435_1_En_10_Chapter/459435_1_En_10_Fig13_HTML.jpg)\n\
    \nFigure 10-13\n\nThe renamed Biml Express Metadata Framework Download file\n\n\
    Right-click the Biml Express Metadata Framework file and click Extract All, as\
    \ shown in Figure [10-14](#459435_1_En_10_Chapter.xhtml#Fig14).\n\n![../images/459435_1_En_10_Chapter/459435_1_En_10_Fig14_HTML.jpg](images/459435_1_En_10_Chapter/459435_1_En_10_Fig14_HTML.jpg)\n\
    \nFigure 10-14\n\nPreparing to extract the Biml Express Metadata Framework file\n\
    \nThe Extract Compressed (Zipped) Folders dialog displays as shown in Figure [10-15](#459435_1_En_10_Chapter.xhtml#Fig15).\n\
    \n![../images/459435_1_En_10_Chapter/459435_1_En_10_Fig15_HTML.jpg](images/459435_1_En_10_Chapter/459435_1_En_10_Fig15_HTML.jpg)\n\
    \nFigure 10-15\n\nChoosing a folder for the extracted files\n\nClick the Extract\
    \ button to extract the compressed files.\n\nAfter the contents of the zip file\
    \ have been extracted, browse to the folder and open the `BimlExpressMetadataFramework.sln`\
    \ file, as shown in Figure [10-16](#459435_1_En_10_Chapter.xhtml#Fig16).\n\n![../images/459435_1_En_10_Chapter/459435_1_En_10_Fig16_HTML.jpg](images/459435_1_En_10_Chapter/459435_1_En_10_Fig16_HTML.jpg)\n\
    \nFigure 10-16\n\nOpening the `BimlExpressMetadataFramework.sln` file\n\n## Following\
    \ the README File Instructions\n\nAt the time of this writing, the README file\
    \ included with the BimlExpressMetadataFramework project reads as follows:\n\n\
    ```\nBimlExpressMetadataFramework Notes\n0. Download and install BimlExpress (https://varigence.com/BimlExpress)\n\
    1. Restore the BimlMetadata database.\n2. Update the connection string in params.biml\
    \ to aim it at your BimlMetadata database.\n3. Update connection strings in the\
    \ di.Connections table aim them at your AdventureWorks2014 database.\n4. In Solution\
    \ Explorer, multi-select the following Biml files in the Miscellaneous virtual\
    \ folder to create the destination Database:\n   - 0_00_BuildConnections.biml\n\
    \   - 0_10_BuildDestinationDatabaseMain.biml\n4a. Right-click in Solution Explorer\
    \ (or dropdown the BimlExpress menu) and click Generate SSIS Packages.\n5. In\
    \ Solution Explorer, multi-select the following Biml files in the Miscellaneous\
    \ virtual folder to create the destination Schemas:\n   - 0_00_BuildConnections.biml\n\
    \   - 0_20_BuildDestinationSchemasMain.biml\n5a. Right-click in Solution Explorer\
    \ (or dropdown the BimlExpress menu) and click Generate SSIS Packages.\n6. In\
    \ Solution Explorer, multi-select the following Biml files in the Miscellaneous\
    \ virtual folder to create the destination Tables:\n   - 0_00_BuildConnections.biml\n\
    \   - 0_30_BuildDestinationTablesMain.biml\n6a. Right-click in Solution Explorer\
    \ (or dropdown the BimlExpress menu) and click Generate SSIS Packages.\n7. Execute\
    \ the packages:\n   - 10_Build_Destination_Databases.dtsx\n   - 20_Build_Destination_Schemas.dtsx\n\
    \   - 30_Build_Destination_Tables.dtsx\n8. Delete all Project Connection Managers\
    \ and Packages.\n9. In Solution Explorer, multi-select the following Biml files\
    \ in the Miscellaneous virtual folder to create the SSIS Packages:\n   - 0_00_BuildConnections.biml\n\
    \   - 0_10_BuildDestinationDatabaseMain.biml\n   - 0_20_BuildDestinationSchemasMain.biml\n\
    \   - 0_30_BuildDestinationTablesMain.biml\n   - 1_99_Main.biml\n9a. Right-click\
    \ in Solution Explorer (or dropdown the BimlExpress menu) and click Generate SSIS\
    \ Packages.\n```\n\nWe have completed Step 0 already."
