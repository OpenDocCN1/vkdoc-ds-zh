    # SSIS Framework Community Edition


    A best practice in SSIS development is to build small, unit-of-work SSIS packages.
    There are several reasons for this:


    - **Decoupling**: SSIS is software development and a best practice with software
    development is separation of concerns. Separation of concerns is primarily achieved
    by decoupling. One way to decouple SSIS is to build small, single-function SSIS
    packages.

    - **Testing**: If an SSIS package contains seven data flow tasks and the design
    of a source table changes and breaks one data flow task, all tasks in the SSIS
    package should be tested. Fewer data flow tasks means less and quicker testing.

    - **Support**: If all SSIS packages contain the minimum number of data flow tasks
    (optimally one) and a package execution fails in the middle of the night, on-call
    support has a pretty good idea where to begin troubleshooting.


    While these are good and valid reasons to build SSIS solutions with several smaller
    SSIS packages, following this advice causes other issues. One issue is you now
    have a bunch of SSIS packages that require executing in some order. What’s a data
    integration developer to do?


    ## SSIS Framework Community Edition


    Consider the SSIS Framework Community Edition, a free and open-source solution
    available at `dilmsuite.com/ssis-framework-community-edition`. SSIS Framework
    Community Edition allows the execution of one or more SSIS packages in a specified
    execution order by executing a single stored procedure and passing it a single
    argument. For example, I can execute a test framework application with the following
    Transact-SQL statement:


    ```

    exec custom.execute_catalog_parent_package @application_name = ''Framework Test
    ''

    ```


    Continuing my theme of “there’s no free lunch,” SSIS execution frameworks greatly
    simplify execution commands like the one listed above but they create another
    issue: the need to manage a lot of metadata. SSIS Framework Community Edition
    relies on metadata to build a *framework application*, mentioned earlier. A framework
    application is a collection of SSIS packages configured to execute in a specified
    order. If you build idempotent (re-executable) Transact-SQL that includes `print`
    statements (to inform you of what the T-SQL is doing) and use any kind of formatting,
    you’re looking at 30-40 lines of Transact-SQL per SSIS package. That’s a lot of
    T-SQL.


    ### Help for SSIS Catalog Projects Already Deployed


    Perhaps you are reading this and thinking, “That’s awesome, but I have a bajillion
    SSIS packages already deployed to my SSIS catalog. What about them?” I wrote a
    blog post called “Adding an SSIS Application to SSIS Framework Community Edition”
    at `andyleonard.blog/2017/07/26/adding-an-ssis-application-to-ssis-framework-community-edition`.
    I included a script at the end of that post that uses three parameters (Framework
    Application Name, Catalog Folder Name, and Catalog Project Name) and from those
    three pieces of metadata loads the metadata for a new framework application into
    SSIS Framework Community Edition’s metadata tables, as shown in Figure 8-1.


    ![../images/459435_1_En_8_Chapter/459435_1_En_8_Fig1_HTML.jpg](images/459435_1_En_8_Chapter/459435_1_En_8_Fig1_HTML.jpg)


    **Figure 8-1** Building a framework application from an SSIS catalog project


    The script reads the SSIS catalog project metadata shown in Figure 8-2 and loads
    the framework application metadata into SSIS Framework Community Edition metadata
    tables in a few seconds.


    ![../images/459435_1_En_8_Chapter/459435_1_En_8_Fig2_HTML.jpg](images/459435_1_En_8_Chapter/459435_1_En_8_Fig2_HTML.jpg)


    **Figure 8-2** The SSIS catalog project


    The framework application named “Load AdventureWorks2014 Stage” that contains
    71 SSIS packages can now be executed with the following Transact-SQL statement:


    ```

    exec custom.execute_catalog_parent_package @application_name = ''Load AdventureWorks2014
    Stage''

    ```


    ### Viewing SSIS Catalog Reports


    You can view the executions of these 71 SSIS packages using the Catalog Reporting
    solution built into SSMS. To view all SSIS package executions, right-click the
    SSMS Object Explorer Integration Services Catalogs node’s `SSISDB` node, hover
    over Reports, hover over Standard Reports, and click All Executions, as shown
    in Figure 8-3.


    ![../images/459435_1_En_8_Chapter/459435_1_En_8_Fig3_HTML.jpg](images/459435_1_En_8_Chapter/459435_1_En_8_Fig3_HTML.jpg)


    **Figure 8-3** Opening the built-in SSIS catalog reports


    The All Executions report displays and surfaces SSIS package execution logs, as
    shown in Figure 8-4.


    ![../images/459435_1_En_8_Chapter/459435_1_En_8_Fig4_HTML.jpg](images/459435_1_En_8_Chapter/459435_1_En_8_Fig4_HTML.jpg)


    **Figure 8-4** The All Executions report


    To summarize, you supplied three pieces of metadata to a Transact-SQL script that
    built a framework application containing 71 SSIS packages, and then executed those
    71 SSIS packages by starting a single stored procedure and passing it one parameter
    value.'
