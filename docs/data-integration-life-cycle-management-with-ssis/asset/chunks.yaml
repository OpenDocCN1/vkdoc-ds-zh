    # 使用 SSIS Catalog Compare 进行测试


    返回 SSIS Catalog Compare，右键单击“比较”按钮，选择“刷新两个树视图并比较”，如图 7-29 所示。


    ![../images/459435_1_En_7_Chapter/459435_1_En_7_Fig29_HTML.jpg](img/459435_1_En_7_Fig29_HTML.jpg)


    **图 7-29** 刷新两个树视图并进行比较


    这是怎么回事？我不是刚刚将所有这些脚本化的人工制品部署到目标 SSIS 目录中了吗？为什么图 7-30 没有显示所有内容都匹配？请记住，在执行目录环境脚本之前，您已经更新了
    `ConnectionString` 目录环境变量的值。图 7-30 显示了 SSIS 目录实例中 `Test` 目录文件夹之间存在的差异。


    ![../images/459435_1_En_7_Chapter/459435_1_En_7_Fig30_HTML.jpg](img/459435_1_En_7_Fig30_HTML.jpg)


    **图 7-30** 不同的数据源值


    接下来做什么？这些值毕竟是 *应该* 不同的。事实上，如果它们相同，那反而是 *糟糕的*。别担心。单击“视图”➤“选项”，如图 7-31 所示。


    ![../images/459435_1_En_7_Chapter/459435_1_En_7_Fig31_HTML.jpg](img/459435_1_En_7_Fig31_HTML.jpg)


    **图 7-31** 打开 SSIS Catalog Compare 选项


    您可以通过勾选图 7-32 所示的复选框来忽略目录环境变量值。


    ![../images/459435_1_En_7_Chapter/459435_1_En_7_Fig32_HTML.jpg](img/459435_1_En_7_Fig32_HTML.jpg)


    **图 7-32** SSIS Catalog Compare 选项


    一旦忽略目录环境变量值，重新比较操作将显示您目录中的 `Test` 目录文件夹是匹配的。展开 `envConnection1` 目录环境以查看 `ConnectionString`
    目录环境变量的值，会发现这些值并未改变；它们仍然不同，只是被忽略了，如图 7-33 所示。


    ![../images/459435_1_En_7_Chapter/459435_1_En_7_Fig33_HTML.jpg](img/459435_1_En_7_Fig33_HTML.jpg)


    **图 7-33** 被忽略的目录环境变量值


    SSIS Catalog Compare 可在 `dilmsuite.com/ssis-catalog-compare` 购买。


    本书未讨论 CatCompare，即 SSIS Catalog Compare 的 CLI（命令行界面）。了解更多信息，请访问 `dilmsuite.com/ssis-catalog-compare`。


    # SSIS Framework Community Edition


    SSIS 开发中的一个最佳实践是构建小型的、面向工作单元的 SSIS 包。这样做的原因有如下几个：


    -   **解耦**：SSIS 是软件开发，而软件开发的最佳实践之一就是关注点分离。关注点分离主要通过解耦来实现。解耦 SSIS 的一种方法是构建小型的、单一功能的
    SSIS 包。

    -   **测试**：如果一个 SSIS 包包含七个数据流任务，并且源表的设计发生了变化导致其中一个数据流任务中断，那么该 SSIS 包中的所有任务都应该进行测试。数据流任务越少，意味着测试工作量越小、速度越快。

    -   **支持**：如果所有 SSIS 包都包含最少的数据流任务（理想情况下是一个），并且某个包在半夜执行失败，那么值班支持人员就能很好地知道从何处开始进行故障排除。


    尽管这些是使用多个较小的 SSIS 包来构建 SSIS 解决方案的充分且合理的理由，但遵循此建议会引发其他问题。一个问题是，您现在有了一堆需要按某种顺序执行的
    SSIS 包。数据集成开发人员该怎么办呢？


    ## SSIS Framework Community Edition


    考虑一下 SSIS Framework Community Edition，这是一个免费的开源解决方案，可在 `dilmsuite.com/ssis-framework-community-edition`
    获取。SSIS Framework Community Edition 允许通过执行单个存储过程并向其传递单个参数，以指定的执行顺序执行一个或多个 SSIS
    包。例如，我可以使用以下 Transact-SQL 语句执行一个测试框架应用程序：


    ```

    exec custom.execute_catalog_parent_package @application_name = ''Framework Test
    ''

    ```


    延续我“天下没有免费的午餐”这一主题，SSIS 执行框架极大地简化了像上面列出的那种执行命令，但它们也带来了另一个问题：需要管理大量的元数据。SSIS Framework
    Community Edition 依赖元数据来构建前面提到的 *框架应用程序*。框架应用程序是配置为按指定顺序执行的一组 SSIS 包。如果您构建包含 `print`
    语句（以便让您了解 T-SQL 正在执行什么操作）并使用某种格式的幂等（可重新执行）Transact-SQL，那么每个 SSIS 包大约需要 30-40 行
    Transact-SQL。这是大量的 T-SQL。


    ### 对已部署的 SSIS 目录项目的帮助


    也许您正在读到这里并想：“这太棒了，但我的 SSIS 目录中已经部署了海量的 SSIS 包。它们该怎么办？”我在 `andyleonard.blog/2017/07/26/adding-an-ssis-application-to-ssis-framework-community-edition`
    写了一篇题为“将 SSIS 应用程序添加到 SSIS Framework Community Edition”的博文。我在那篇文章的末尾包含了一个脚本，该脚本使用三个参数（框架应用程序名称、目录文件夹名称和目录项目名称），并利用这三条元数据将新框架应用程序的元数据加载到
    SSIS Framework Community Edition 的元数据表中，如图 8-1 所示。


    ![../images/459435_1_En_8_Chapter/459435_1_En_8_Fig1_HTML.jpg](img/459435_1_En_8_Fig1_HTML.jpg)


    **图 8-1** 从 SSIS 目录项目构建框架应用程序


    该脚本读取图 8-2 所示的 SSIS 目录项目元数据，并在几秒钟内将框架应用程序元数据加载到 SSIS Framework Community Edition
    的元数据表中。


    ![../images/459435_1_En_8_Chapter/459435_1_En_8_Fig2_HTML.jpg](img/459435_1_En_8_Fig2_HTML.jpg)


    **图 8-2** SSIS 目录项目


    名为“Load AdventureWorks2014 Stage”的框架应用程序包含 71 个 SSIS 包，现在可以使用以下 Transact-SQL 语句来执行：


    ```

    exec custom.execute_catalog_parent_package @application_name = ''Load AdventureWorks2014
    Stage''

    ```


    ### 查看 SSIS 目录报告


    您可以使用 SSMS 内置的目录报告解决方案来查看这 71 个 SSIS 包的执行情况。要查看所有 SSIS 包执行情况，请右键单击 SSMS 对象资源管理器中
    Integration Services 目录节点下的 `SSISDB` 节点，将鼠标悬停在“报告”上，再悬停在“标准报告”上，然后单击“所有执行”，如图
    8-3 所示。


    ![../images/459435_1_En_8_Chapter/459435_1_En_8_Fig3_HTML.jpg](img/459435_1_En_8_Fig3_HTML.jpg)


    **图 8-3** 打开内置的 SSIS 目录报告


    “所有执行”报告会显示并提供 SSIS 包执行日志，如图 8-4 所示。


    ![../images/459435_1_En_8_Chapter/459435_1_En_8_Fig4_HTML.jpg](img/459435_1_En_8_Fig4_HTML.jpg)


    **图 8-4** “所有执行”报告


    总而言之，您向一个 Transact-SQL 脚本提供了三条元数据，该脚本构建了一个包含 71 个 SSIS 包的框架应用程序，然后通过启动一个存储过程并传递一个参数值来执行了这
    71 个 SSIS 包。

    '
- fmt: '### Viewing SSIS Framework Community Edition Metadata


    As mentioned, there’s quite a bit of metadata required for the SSIS Framework
    Community Edition. The script we used earlier is a nice piece of automation for
    entering SSIS Framework Community Edition metadata, but what happens when we want
    to *view* the framework applications already stored?


    Enter `Framework Browser`, another free utility from DILM Suite that you can download
    at `dilmsuite.com/framework-browser`, shown in Figure [8-5](#459435_1_En_8_Chapter.xhtml#Fig5).


    ![../images/459435_1_En_8_Chapter/459435_1_En_8_Fig5_HTML.jpg](images/459435_1_En_8_Chapter/459435_1_En_8_Fig5_HTML.jpg)


    **Figure 8-5** The framework application’s Load AdventureWorks2014 stage


    A framework application is a collection of SSIS packages, called *application
    packages* in the framework, that execute in a specified order. `Framework Browser`
    lists application packages in the order they execute.


    If you expand the `Application Properties` virtual folder, you see framework application
    metadata. Expand the `Application Package` node and the `Application Package Properties`
    node to surface application package metadata, as shown in Figure [8-6](#459435_1_En_8_Chapter.xhtml#Fig6).


    ![../images/459435_1_En_8_Chapter/459435_1_En_8_Fig6_HTML.jpg](images/459435_1_En_8_Chapter/459435_1_En_8_Fig6_HTML.jpg)


    **Figure 8-6** Surfacing application and application package framework metadata


    `Framework Browser` is another free utility from DILM Suite.


    # 9. Catalog Reports


    You’ve looked at the SSMS Catalog Reports solution built into SQL Server Management
    Studio (SSMS) a few times in your journey thus far, most recently in the previous
    chapter. As a data integration architect, I find these reports awesome, with a
    couple caveats:


    1.  I cannot select text for copy and paste.

    2.  In order to view SSMS Catalog Reports, one must install SSMS.


    Regarding the second point, there are people in the enterprise who have a legitimate
    need to view the execution of data integration processes in the enterprise Production
    environment, but have no business having the remainder of SSMS installed on their
    machine, much less with access to the enterprise Production environment. SSMS
    is a fantastic utility for managing data and administering all aspects of SQL
    Server. To install SSMS for the sole purpose of granting someone access to the
    SSMS Catalog Reports is overkill.


    Please take a look at `Catalog Reports`, a free and open-source solution that’s
    part of the DILM Suite, at `dilmsuite.com/catalog-reports`.


    `Catalog Reports` are designed to look and feel similar to the SSMS version, but
    they reside in SQL Server Reporting Services (SSRS). Look at the Executions Report
    shown in Figure [9-1](#459435_1_En_9_Chapter.xhtml#Fig1).


    ![../images/459435_1_En_9_Chapter/459435_1_En_9_Fig1_HTML.jpg](images/459435_1_En_9_Chapter/459435_1_En_9_Fig1_HTML.jpg)


    **Figure 9-1** DILM Suite Catalog Reports Executions Report


    DILM Suite Catalog Reports surface the same logs and data shown in the SSMS Catalog
    Reports without requiring the installation of SSMS. Because the solution is open
    source, SSRS developers can edit the reports to add corporate logos, apply enterprise
    color schemes, or include additional data.


    Report viewers can select and copy text from their browser displaying the reports.
    There are options for exporting the contents of the report, as shown in Figure
    [9-2](#459435_1_En_9_Chapter.xhtml#Fig2).


    ![../images/459435_1_En_9_Chapter/459435_1_En_9_Fig2_HTML.jpg](images/459435_1_En_9_Chapter/459435_1_En_9_Fig2_HTML.jpg)


    **Figure 9-2** Report export options


    The right side of the Executions Report contains links to other reports in the
    solution: `Overview`, `Messages`, and `Performance` (shown in Figure [9-3](#459435_1_En_9_Chapter.xhtml#Fig3)).


    ![../images/459435_1_En_9_Chapter/459435_1_En_9_Fig3_HTML.jpg](images/459435_1_En_9_Chapter/459435_1_En_9_Fig3_HTML.jpg)


    **Figure 9-3** More fields in the Executions Report


    Click the `Overview` link for the top-most SSIS package execution to open the
    Overview Report. The Overview Report surfaces a summary of SSIS package execution
    grouped by execution path (individual executables in the SSIS package) in the
    table on the left side of the report. This table is useful for determining the
    longest-running part of your SSIS package. The Execution Information table displays
    operational log data such as SSIS package execution status, duration, start time,
    and the name of the catalog environment referenced for this execution. The Execution
    Parameters table displays SSIS catalog execution parameter settings and any parameters
    overridden or referenced for this execution, as shown in Figure [9-4](#459435_1_En_9_Chapter.xhtml#Fig4).


    ![../images/459435_1_En_9_Chapter/459435_1_En_9_Fig4_HTML.jpg](images/459435_1_En_9_Chapter/459435_1_En_9_Fig4_HTML.jpg)


    **Figure 9-4** DILM Suite Catalog Reports Overview Report


    The DILM Suite Overview Report includes navigation links at the top of the report
    to facilitate navigation to the `Executions`, `Performance`, and `Messages` reports.
    Click the `Messages` link to view the Messages Report, as shown in Figure [9-5](#459435_1_En_9_Chapter.xhtml#Fig5).


    ![../images/459435_1_En_9_Chapter/459435_1_En_9_Fig5_HTML.jpg](images/459435_1_En_9_Chapter/459435_1_En_9_Fig5_HTML.jpg)


    **Figure 9-5** DILM Suite Catalog Reports Messages Report


    The Messages report lists every message logged by the execution of the SSIS package,
    when it was logged, the event that raised the message, and the name of the executable
    that raised the event.


    The Performance report displays a graph of execution durations for previous successful
    executions, as shown in Figure [9-6](#459435_1_En_9_Chapter.xhtml#Fig6).


    ![../images/459435_1_En_9_Chapter/459435_1_En_9_Fig6_HTML.jpg](images/459435_1_En_9_Chapter/459435_1_En_9_Fig6_HTML.jpg)


    **Figure 9-6** DILM Suite Catalog Reports Performance Report


    The DILM Suite Catalog Reports solution is free and open-source, and addresses
    a couple issues with SSMS Catalog Reports.


    # 10. BimlExpress Metadata Framework


    Business Intelligence Markup Language (Biml) is an XML-based language that increases
    data integration developer productivity and improves SSIS code quality. `BimlExpress`
    is free and integrates into SQL Server Data Tools (SSDT). The BimlExpress Metadata
    Framework is designed to encourage thinking about the possibilities when one combines
    the power of Biml with metadata.


    You can learn more about Biml at `varigence.com/biml` and at `bimlscript.com`.
    You can obtain `BimlExpress` at `varigence.com/bimlexpress`. You can obtain a
    copy of the BimlExpress Metadata Framework project at `dilmsuite.com/biml-express-metadata-framework`.


    When `BimlExpress` is installed, a developer can access the `BimlExpress` menu
    in SSDT. The first document a developer should open is the `README` file, shown
    in Figure [10-1](#459435_1_En_10_Chapter.xhtml#Fig1).


    ![../images/459435_1_En_10_Chapter/459435_1_En_10_Fig1_HTML.jpg](images/459435_1_En_10_Chapter/459435_1_En_10_Fig1_HTML.jpg)


    **Figure 10-1** Viewing the BimlExpress Metadata Framework project in SSDT


    The instructions in the `README` file walk a developer through the steps required
    to use the BimlExpress Metadata Framework. I will follow most of those steps in
    this chapter. You should follow them, too, if you desire to use the BimlExpress
    Metadata Framework.'
