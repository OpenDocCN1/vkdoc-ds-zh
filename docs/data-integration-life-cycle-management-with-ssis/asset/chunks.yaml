  trans: "\n### 为什么使用 `ProjectName` 和 `TaskName`？\n\n如下方代码所示，你将使用这些变量在代码中的 `subComponent`.Net\
    \ 变量内构建一个值。对于 SSIS 开发来说，你绝对*需要*这个变量吗？不。但如果你要帮助运维团队监控和报告来自 SSIS 日志的消息与失败情况，那么你绝对需要这个变量。对于\
    \ DevOps 中的开发端而言，这只是几行代码。对于 DevOps 中的运维端而言，它能在日志中多呈现一条执行元数据。提供这种类型和级别的流程检测，对于\
    \ DevOps 与 SSIS 的成功集成至关重要。\n\n点击 **确定** 按钮关闭 **选择变量** 对话框。此时你的 **脚本任务编辑器** 应如图\
    \ 2-9 所示。\n\n![../images/459435_1_En_2_Chapter/459435_1_En_2_Fig9_HTML.jpg](img/459435_1_En_2_Fig9_HTML.jpg)\n\
    \n图 2-9\n\n脚本任务编辑器\n\n点击 **编辑脚本** 按钮打开 **Visual Studio Tools for Applications\
    \ (VSTA)** 编辑器。编辑 `public void Main()` 方法，使其内容如下：\n\n```\npublic void Main()\n\
    {\nstring packageName = Dts.Variables[\"System::PackageName\"].Value.ToString();\n\
    string taskName = Dts.Variables[\"System::TaskName\"].Value.ToString();\nstring\
    \ subComponent = packageName + \".\" + taskName;\nbool fireAgain = true;\nint\
    \ tableCount = Convert.ToInt32(Dts.Variables[\"User::TableCount\"].Value);\nint\
    \ intPkgParam = Convert.ToInt32(Dts.Variables[\"$Package::IntPkgParam\"].Value);\n\
    string stringPkgParam = Dts.Variables[\"$Package::StringPkgParam\"].Value.ToString();\n\
    int intProjParam = Convert.ToInt32(Dts.Variables[\"$Project::IntProjParam\"].Value);\n\
    string stringProjParam = Dts.Variables[\"$Project::StringProjParam\"].Value.ToString();\n\
    string msg = \"Table Count: \" + tableCount.ToString();\nDts.Events.FireInformation(1001,\
    \ subComponent, msg, \"\", 0, ref fireAgain);\nmsg = \"Package Parameters: IntPkgParam\
    \ = \" + intPkgParam.ToString() + \" ; StringPkgParam = \" + stringPkgParam;\n\
    Dts.Events.FireInformation(1001, subComponent, msg, \"\", 0, ref fireAgain);\n\
    msg = \"Project Parameters: IntProjParam = \" + intProjParam.ToString() + \" ;\
    \ StringProjParam = \" + stringProjParam;\nDts.Events.FireInformation(1001, subComponent,\
    \ msg, \"\", 0, ref fireAgain);\nDts.TaskResult = (int)ScriptResults.Success;\n\
    }\n```\n\n完成后，你的 VSTA 编辑器中的代码应类似于图 2-10 所示。\n\n![../images/459435_1_En_2_Chapter/459435_1_En_2_Fig10_HTML.jpg](img/459435_1_En_2_Fig10_HTML.jpg)\n\
    \n图 2-10\n\nVSTA 编辑器中的代码\n\n### 在关闭 VSTA 编辑器前测试 .Net 代码是否编译通过\n\n你是否曾在 SSIS 脚本任务中编写过代码，然后关闭\
    \ VSTA 编辑器，接着关闭脚本任务编辑器，却看到了如图 2-11 所示的错误？\n\n![../images/459435_1_En_2_Chapter/459435_1_En_2_Fig11_HTML.jpg](img/459435_1_En_2_Fig11_HTML.jpg)\n\
    \n图 2-11\n\nVSTA .Net 代码中的脚本任务错误\n\nKevin Hazzard 分享了一个便捷方法，可以在*关闭*编辑器之前测试 VSTA\
    \ 编辑器中 .Net 代码的可行性。点击 **生成** ➤ **生成 ST_…**（VSTA 脚本具有唯一名称），如图 2-12 所示。\n\n![../images/459435_1_En_2_Chapter/459435_1_En_2_Fig12_HTML.jpg](img/459435_1_En_2_Fig12_HTML.jpg)\n\
    \n图 2-12\n\n准备生成 VSTA 脚本\n\n当你点击 **生成 ST_…** 时，VSTA 编辑器会尝试生成脚本。在屏幕左下角，你会看到“生成已启动”，如图\
    \ 2-13 所示。\n\n![../images/459435_1_En_2_Chapter/459435_1_En_2_Fig13_HTML.jpg](img/459435_1_En_2_Fig13_HTML.jpg)\n\
    \n图 2-13\n\n生成已启动\n\n如果 .Net 代码中存在错误，生成将失败。如果 .Net 代码没有错误，生成将成功，如图 2-14 所示。\n\n\
    ![../images/459435_1_En_2_Chapter/459435_1_En_2_Fig14_HTML.jpg](img/459435_1_En_2_Fig14_HTML.jpg)\n\
    \n图 2-14\n\n生成成功或失败\n\n关闭 VSTA 编辑器，然后在 **脚本任务编辑器** 中点击 **确定** 按钮。此时 `SimplePackage.dtsx`\
    \ 应如图 2-15 所示。\n\n![../images/459435_1_En_2_Chapter/459435_1_En_2_Fig15_HTML.jpg](img/459435_1_En_2_Fig15_HTML.jpg)\n\
    \n图 2-15\n\n`SimplePackage.dtsx`\n\n演示用的 SSIS 包和项目已完成。\n\n## 测试进展\n\n> *“所有软件都会经过测试。有些是有意为之。”*\n\
    > \n> – Andy Leonard，约 2005 年\n\n始终在 SSIS 调试器中执行你的包是个好习惯。否则你如何知道你所构建的内容能够正常工作？\n\
    \n按 **F5** 键启动 SSIS 调试器。如果一切顺利，你应该会看到两个任务都成功执行，如图 2-16 所示。\n\n![../images/459435_1_En_2_Chapter/459435_1_En_2_Fig16_HTML.jpg](img/459435_1_En_2_Fig16_HTML.jpg)\n\
    \n图 2-16\n\n成功！\n\n如果你点击 **进度** 选项卡，你应该会看到由脚本触发的 `OnInformation` 消息，如图 2-17 所示。\n\
    \n![../images/459435_1_En_2_Chapter/459435_1_En_2_Fig17_HTML.jpg](img/459435_1_En_2_Fig17_HTML.jpg)\n\
    \n图 2-17\n\n`OnInformation` 消息\n\n你的演示现在已准备好开始一段关于数据集成生命周期管理的史诗之旅。\n\n## 结论\n\n\
    在本章中，你构建了一个 SSIS 包，它将用于本书后续的所有课程。我讨论了数据集成的检测和消息传递，以呈现 SSIS 包执行的日志消息。对于我们 DevOps\
    \ 开发端的人员来说，向运维端的支持人员发送信号非常重要。编写这段代码只需几分钟，却可能节省数小时的故障排查时间。\n\n# 3. 源代码管理\n\n在本书后面，我将讨论为什么通过备份和还原\
    \ `SSISDB` 数据库并非 SSIS 代码提升的可行方法。你应该像备份所有数据库一样备份 `SSISDB` 数据库。你不应该为了代码提升而备份 `SSISDB`\
    \ 数据库，也不应该用备份 `SSISDB` 数据库来替代源代码管理。\n\n开发者分为两类：正在使用源代码管理的，以及将要使用源代码管理的。有人问我：“Andy，哪种源代码管理引擎最好？”我的回答是：“你正在用的那个。”请务必使用源代码管理。\n\
    \n本节并非关于源代码管理或使用 Team Foundation Services 的详尽教程。我不主张某一种源代码管理引擎优于另一种。\n\n在本章中，我将演示通过\
    \ Visual Studio Online (`visualstudio.com`) 使用 Team Foundation Services。我会交替使用“源代码管理”和“版本控制”这两个术语，因为现代的源代码管理引擎也同时管理软件版本。\n"
- fmt: '# Source Control Client


    Depending on which source control (or version control) engine you desire to use,
    you may or may not require a Visual Studio plug-in (or extension). Many developers
    use Subversion, a popular open-source version control system, with Tortoise SVN,
    a Subversion client implemented as a Windows shell. Tortoise is a highly intuitive
    interface that integrates into Windows Explorer to provide context-sensitive menus
    available by right-clicking file system folders that contain project artifacts
    under Subversion source control.


    Git is a popular version control system created by Linus Torvalds (the creator
    of Linux). Git is a distributed source control system, which means each developer
    maintains a local working copy of the repository. Git relies heavily on *branching*
    (making another - usually local - copy of the current version of the code) and
    *merging* (the process of adding changes to the - usually local - edited version
    into another version of the code).


    In this chapter I use Team Explorer, the Visual Studio plug-in for Team Foundation
    Services (TFS). You can learn more about Visual Studio plug-ins for TFS at `visualstudio.com/en-us/docs/tools`.


    ## Creating a Team Project


    In this section, I demonstrate how I use the free source control available at
    Visual Studio Online. I like Visual Studio Online because it’s difficult to beat
    the price (free) and the total cost of ownership (also free). After setting up
    an account you can create a New Team Project from the dashboard. Mine is shown
    in Figure [3-1](#459435_1_En_3_Chapter.xhtml#Fig1).


    ![../images/459435_1_En_3_Chapter/459435_1_En_3_Fig1_HTML.jpg](images/459435_1_En_3_Chapter/459435_1_En_3_Fig1_HTML.jpg)


    Figure 3-1


    Preparing to create a new team project


    You can think of Visual Studio Online source control as an extension of the Visual
    paradigm. The red box in Figure [3-2](#459435_1_En_3_Chapter.xhtml#Fig2) is drawn
    around an SSIS package, which can be considered a Visual Studio *project artifact*.
    Project artifacts are lowest in the hierarchy of Visual Studio objects. The next
    level is the *project*, surrounded by a blue box in Figure [3-2](#459435_1_En_3_Chapter.xhtml#Fig2).
    Visual Studio projects contain one or more project artifacts. Visual Studio *solutions*,
    such as the DILMSuite solution circled in green in Figure [3-2](#459435_1_En_3_Chapter.xhtml#Fig2),
    contain one or more projects.


    ![../images/459435_1_En_3_Chapter/459435_1_En_3_Fig2_HTML.jpg](images/459435_1_En_3_Chapter/459435_1_En_3_Fig2_HTML.jpg)


    Figure 3-2


    The Visual Studio paradigm


    Team Foundation Server extends this paradigm an additional level: TFS *team projects*
    contain one or more Visual Studio solutions.


    Click the "Create team project" link to proceed to the Create New Project page,
    shown in Figure [3-3](#459435_1_En_3_Chapter.xhtml#Fig3).


    ![../images/459435_1_En_3_Chapter/459435_1_En_3_Fig3_HTML.jpg](images/459435_1_En_3_Chapter/459435_1_En_3_Fig3_HTML.jpg)


    Figure 3-3


    Creating a new team project


    To configure the new team project, add a name and optional description, and then
    select a version control engine (Team Foundation Version Control or Git) and a
    work item process. Click the Create button to create the team project and proceed
    to the Team Project page, as shown in Figure [3-4](#459435_1_En_3_Chapter.xhtml#Fig4).


    ![../images/459435_1_En_3_Chapter/459435_1_En_3_Fig4_HTML.jpg](images/459435_1_En_3_Chapter/459435_1_En_3_Fig4_HTML.jpg)


    Figure 3-4


    New team project


    A new team project is now ready to go.


    ## Configuring SSDT to Use TFS Online


    Returning to SSDT, you next configure a connection to TFS Online. Begin by clicking
    the Team dropdown and clicking Manage Connections, as shown in Figure [3-5](#459435_1_En_3_Chapter.xhtml#Fig5).


    ![../images/459435_1_En_3_Chapter/459435_1_En_3_Fig5_HTML.jpg](images/459435_1_En_3_Chapter/459435_1_En_3_Fig5_HTML.jpg)


    Figure 3-5


    Managing source control connections


    If you haven''t configured a connection already, you may first see the Connect
    to Team Foundation Server window shown in Figure [3-6](#459435_1_En_3_Chapter.xhtml#Fig6).


