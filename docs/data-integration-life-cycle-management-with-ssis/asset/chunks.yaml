    # 4. Deploy to the SSIS Catalog


    The SSIS catalog was released with SSIS 2012\. Each release of SSIS since 2012
    has featured upgrades to catalog functionality. There are several ways to deploy
    an SSIS project to the SSIS catalog. In this chapter, I will present two deployment
    options:


    *   Deploy from SSDT


    *   Deploy from an ISPAC file


    A key tenet of DevOps is automation, and in this chapter I will discuss and demonstrate
    automated SSIS deployments.


    ## Deploying from SSDT


    Since the first release of the SSIS catalog, SSIS has been backwards-compatible.
    Prior to 2012, the deployment model for SSIS had no name; there was only one way
    to deploy SSIS and three targets: the file system, the MSDB database, and the
    “SSIS Package Store” (which was, by default, one folder in the file system and
    the MSDB database combined). Deployment to the SSIS catalog is a new way to deploy
    SSIS packages, so we needed a name for the “old way” as well as a name for the
    “new way.” The new way is called “project deployment model” and the old way is
    called “package deployment model.”


    In this chapter (and book), I focus on the project deployment model. The project
    deployment model is required to deploy SSIS packages to the SSIS catalog.


    To deploy your demo project, open the project in SSDT, right-click the project
    name in Solution Explorer, and click Deploy, as shown in Figure [4-1](#459435_1_En_4_Chapter.xhtml#Fig1).


    ![../images/459435_1_En_4_Chapter/459435_1_En_4_Fig1_HTML.jpg](images/459435_1_En_4_Chapter/459435_1_En_4_Fig1_HTML.jpg)


    Figure 4-1


    Deploying the DILMSuite SSIS project from SSDT


    The Integration Services Deployment Wizard is an *extremely* functional piece
    of software. The underlying executable, `ISDeploymentWizard.exe`, sports a graphical
    user interface (GUI) *and* a command-line interface (CLI) . The utility supports
    deployment from ISPAC file to SSIS catalog as well as SSIS catalog to SSIS catalog
    and, starting with SSIS 2016, supports package deployment as well as project deployment.
    I won’t dive deeply into this awesome application; just know that I truly appreciate
    the excellence apparent in the Integration Services Deployment Wizard.


    The Integration Services Deployment Wizard displays the Introduction page or the
    Select Destination page (if you previously checked the “Do not show this page
    again” checkbox on the Introduction page), as shown in Figure [4-2](#459435_1_En_4_Chapter.xhtml#Fig2).


    ![../images/459435_1_En_4_Chapter/459435_1_En_4_Fig2_HTML.jpg](images/459435_1_En_4_Chapter/459435_1_En_4_Fig2_HTML.jpg)


    Figure 4-2


    The Integration Services Deployment Wizard Introduction page


    If the Introduction page is displayed, click the Next button to proceed to the
    Select Destination page.


    Did I skip over the Select Source page? Yes. When started from inside SSDT, the
    Integration Services Deployment Wizard already has the information it needs about
    the source.


    Enter the name of server that hosts your SSIS catalog. Click the Browse button
    to select the target catalog folder. When completed your Select Destination page
    should appear similar to that shown in Figure [4-3](#459435_1_En_4_Chapter.xhtml#Fig3).


    ![../images/459435_1_En_4_Chapter/459435_1_En_4_Fig3_HTML.jpg](images/459435_1_En_4_Chapter/459435_1_En_4_Fig3_HTML.jpg)


