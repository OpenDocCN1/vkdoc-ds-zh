    Initially, everything failed.


    We identified the root causes and corrected the issues, but we had egg on our
    collective faces with the business, and for good reason. We had assured them “we
    were doing it right.” We were, with one exception. The enterprise data architect
    identified the gap with one very good question, “How can we *know* the Production
    and UAT SSIS catalogs are the same?” My response at the time, “[Pregnant pause
    while thinking… then] I don’t know.”


    I built SSIS Catalog Compare so I—and my customers, and you—can answer that question.'
  trans: '

    # 目录浏览器


    SSIS 目录中充满了非常实用且有用的配置信息，但你必须知道去哪里查找，而在某些情况下，*去哪里查找*这件事并不那么显而易见。


    `Catalog Browser（目录浏览器）`应运而生，这是一款免费实用工具，属于 DILM 套件的一部分，可从 `dilmsuite.com/catalog-browser`
    获取。`Catalog Browser` 旨在通过单一视图展示 SSIS 目录的内容：一个树形结构，其中展示了所有相关的 SSIS 目录工件、属性和配置。


    如图 6-6 所示，`Catalog Browser` 展示的元数据与 SSMS 对象资源管理器中的 Integration Services 目录节点相同。


    ![../images/459435_1_En_6_Chapter/459435_1_En_6_Fig6_HTML.jpg](img/459435_1_En_6_Fig6_HTML.jpg)


    图 6-6


    `Catalog Browser` 展示部分 SSIS 项目和配置元数据


    不过，观察图 6-6，你可能已经发现 `Catalog Browser` 与 SSMS 对象资源管理器中的 Integration Services 目录节点之间存在一些差异。注意，在
    SSIS 目录项目下，除了 `Packages` 虚拟文件夹外，还存在 `Project Parameters` 和 `Project References`
    虚拟文件夹。


    展开这些虚拟文件夹，即可查看 SSIS 目录项目参数和引用，如图 6-7 所示。


    ![../images/459435_1_En_6_Chapter/459435_1_En_6_Fig7_HTML.jpg](img/459435_1_En_6_Fig7_HTML.jpg)


    图 6-7


    SSIS 目录项目参数和引用


    回想一下图 6-3 中，SSMS 对象资源管理器中的 Integration Services 目录节点展示了 *所有* 参数：SSIS 目录项目参数和 SSIS
    包参数。那么包参数在哪里呢？它们就在 `Catalog Browser` 中。要查看包参数，请展开 `SimplePackage.dtsx` SSIS 包节点，如图
    6-8 所示。


    ![../images/459435_1_En_6_Chapter/459435_1_En_6_Fig8_HTML.jpg](img/459435_1_En_6_Fig8_HTML.jpg)


    图 6-8


    查看 SSIS 包参数


    回想一下，连接管理器属性在 SSIS 目录中被视为参数。它们带有“CM.”前缀。你可以看到，SSIS 包连接管理器 `vmDemo\Demo.TestDB1`
    的连接字符串属性被映射到了一个名为 `ConnectionString` 的 SSIS 目录环境变量。


    要查看引用映射所使用的引用，请展开 `Package References` 虚拟文件夹，如图 6-9 所示。


    ![../images/459435_1_En_6_Chapter/459435_1_En_6_Fig9_HTML.jpg](img/459435_1_En_6_Fig9_HTML.jpg)


    图 6-9


    查看包引用


    展开 `Package Reference` 虚拟文件夹，会显示 `Test/envConection1` 目录环境。展开 `Test/envConection1`
    目录环境，可以看到名为 `ConnectionString` 的目录环境变量已映射到 `vmDemo\Demo.TestDB1` 连接字符串属性。


    但是，`ConnectionString` 目录环境变量的值是多少呢？展开 `Environments` 虚拟文件夹中的 `envConnection1`
    目录环境，即可查看目录环境变量集合、它们的数据类型和值，如图 6-10 所示。


    ![../images/459435_1_En_6_Chapter/459435_1_En_6_Fig10_HTML.jpg](img/459435_1_En_6_Fig10_HTML.jpg)


    图 6-10


    目录环境变量、数据类型和值


    SSIS 包属性包含一个由 SSIS 包的 `Version Major`、`Version Minor` 和 `Version Build` 属性构建而成的
    `Package Version` 属性。每当开发人员保存 SSIS 包时，`Version Build` 属性就会递增。可以通过手动设置 `Version
    Build` 属性来修改 SSIS 包并“欺骗”该属性。我尚未发现对已部署到 SSIS 目录的 SSIS 包执行此操作的有效用例。


    `Package Version` 属性可用于检测部署到 SSIS 目录中的 SSIS 包的不同版本。由于 SSIS 开发人员可以手动设置 `Version
    Build` 属性，因此 `Package Version` 并不是一个可靠的指示。


    `Package Properties` 虚拟文件夹展示了 SSIS 包的元数据，如图 6-11 所示。


    ![../images/459435_1_En_6_Chapter/459435_1_En_6_Fig11_HTML.jpg](img/459435_1_En_6_Fig11_HTML.jpg)


    图 6-11


    SSIS 包属性


    目录属性对于检测补丁级别的差异非常方便（通过 `Schema Build` 属性）。`Catalog Version` 是由 `Catalog Base`（位于
    `Catalog Browser` 底层的自定义目录对象）公开的一个属性。


    `Catalog Base` 适用于 SSIS 2012、2014 和 2016 目录。


    `Catalog Properties` 虚拟文件夹展示了 SSIS 目录的元数据，如图 6-12 所示。


    ![../images/459435_1_En_6_Chapter/459435_1_En_6_Fig12_HTML.jpg](img/459435_1_En_6_Fig12_HTML.jpg)


    图 6-12


    SSIS 目录属性


    ## 结论


    `Catalog Browser` 在单一视图中展示了 SSIS 目录工件、配置元数据和工件属性。


    # SSIS 目录比较器


    查看 SSIS 目录内容，包括 SSIS 目录项目、包、环境、环境变量、引用和引用映射，以及 SSIS 包和 SSIS 目录属性，这很有帮助。但如果你想查看一个
    SSIS 目录实例与另一个实例之间的内容差异呢？或者，也许更有用的是，你如何才能*知道*企业 QA 和生产环境中的 SSIS 目录实例是匹配的？


    ## 作者 Andy Leonard 分享：为何构建 SSIS 目录比较器


    我的团队使用 SSIS 为客户构建了一个相当复杂的数据集成解决方案。我们在两个 DevOps 层级（测试环境和 UAT（用户验收测试）环境）中测试了该解决方案。我们发现了一些问题并进行了修正。然后到了部署到生产环境的时候。在生产部署和初始生产测试期间，我和我的团队处于待命状态。


    起初，一切均告失败。


    我们找出了根本原因并修正了问题，但我们在业务方面丢了面子，而且理由充分。我们曾向他们保证“我们做得对”。我们确实做得对，但有一个例外。企业数据架构师提出了一个很好的问题，指出了差距：“我们如何*知道*生产环境和
    UAT 环境的 SSIS 目录是相同的？”我当时回应道：“（沉思片刻……然后）我不知道。”


    我构建了 `SSIS Catalog Compare（SSIS 目录比较器）`，这样我——以及我的客户，还有你——就能够回答这个问题了。

    '
- fmt: '# SSIS Catalog Compare


    You can begin by thinking of `SSIS Catalog Compare` as two Catalog Browsers. Like
    `Catalog Browser`, `SSIS Catalog Compare` uses `Catalog Base`, a custom catalog
    object. In `SSIS Catalog Compare`, `Catalog Base` is used to populate two trees,
    each representing a different SSIS catalog, as shown in Figure [7-1](#459435_1_En_7_Chapter.xhtml#Fig1).


    ![../images/459435_1_En_7_Chapter/459435_1_En_7_Fig1_HTML.jpg](images/459435_1_En_7_Chapter/459435_1_En_7_Fig1_HTML.jpg)


    Figure 7-1 `SSIS Catalog Compare`


    Once two catalogs are loaded, they may be compared by clicking the **Compare**
    button. As shown in Figure [7-2](#459435_1_En_7_Chapter.xhtml#Fig2), `SSIS Catalog
    Compare` uses the italics font to indicate that a difference has been detected
    *beneath* a node and a different background color to indicate artifacts that are
    present in one SSIS catalog but missing from the other.


    ![../images/459435_1_En_7_Chapter/459435_1_En_7_Fig2_HTML.jpg](images/459435_1_En_7_Chapter/459435_1_En_7_Fig2_HTML.jpg)


    Figure 7-2 After a Compare operation


    The `Test` catalog folder in the `VmDemo\Demo` catalog does not exist in the `vmDemo\Dev`
    catalog, hence the background color on the `vmDemo\Demo\SSISDB\Test` node. The
    “deeper differences” indications (italics fonts) shown in Figure [7-2](#459435_1_En_7_Chapter.xhtml#Fig2)
    indicate differences within the `Framework` catalog folders and between the catalog
    properties.


    ## Expanding the Differences


    One time-saver is `Expand Differences`, shown in Figure [7-3](#459435_1_En_7_Chapter.xhtml#Fig3).


    ![../images/459435_1_En_7_Chapter/459435_1_En_7_Fig3_HTML.jpg](images/459435_1_En_7_Chapter/459435_1_En_7_Fig3_HTML.jpg)


    Figure 7-3 `Expand Differences`


    `Expand Differences` will expand nodes *above* differences and the nodes that
    *are* different. In large SSIS catalog projects, catalog projects with lots of
    configurations metadata, or both, `Expand Differences` can reduce the number of
    nodes expanded. Expanding the differences in the `Framework` catalog folder for
    both catalogs, you see the `Parent.dtsx` SSIS package SSISDB connection manager’s
    `ConnectionString` property is configured for each server’s local SQL Server instance,
    as shown in Figure [7-4](#459435_1_En_7_Chapter.xhtml#Fig4).


    ![../images/459435_1_En_7_Chapter/459435_1_En_7_Fig4_HTML.jpg](images/459435_1_En_7_Chapter/459435_1_En_7_Fig4_HTML.jpg)


    Figure 7-4 Different `ConnectionString` property values


    This is a really good thing because, if these values matched, framework application
    executions in one catalog would start SSIS executions in another catalog. That
    could be bad.


    ## Catalog Properties


    I didn’t discuss catalog properties in the section about `Catalog Browser` because
    I wanted to cover catalog properties here in more detail. If you collapse the
    `Framework` catalog folder and expand **Catalog Properties**, you see the difference
    is the `Schema Build` property, shown in Figure [7-5](#459435_1_En_7_Chapter.xhtml#Fig5).


    ![../images/459435_1_En_7_Chapter/459435_1_En_7_Fig5_HTML.jpg](images/459435_1_En_7_Chapter/459435_1_En_7_Fig5_HTML.jpg)


    Figure 7-5 Different values for the SSIS catalog `Schema Build` property


    Note from the property just beneath `Schema Build` that both of these SSIS catalogs
    are SSIS 2016. `vmDemo\Demo`’s `Schema Build` version tells us that this catalog
    is the General Availability (or GA, formerly known as RTM [Release to Manufacturing])
    version of SSIS 2016. `vmDemo\Dev`’s catalog is an SSIS 2016 SP1 `Schema Build`
    version.


    The `Catalog Base` object is built to allow `SSIS Catalog Compare` to compare
    SSIS catalogs from different releases and versions of SQL Server. For example,
    I could compare the contents of an SSIS 2012 catalog to those of an SSIS 2016
    catalog. SSIS 2016 added a couple properties to the catalog properties, so you
    would see a couple properties marked on the 2016 side of the compare as missing
    from the 2012 side. But the Compare operation would succeed and produce accurate
    and useful results.


    ## SSIS Catalog Compare Scripting


    In many enterprises with two or more IT professionals, the professional who develops
    the software is not permitted to deploy that software. Large enterprises have
    entire teams dedicated to release management. Lifecycle management will help enterprises
    of any size reduce downtime and improve code supportability and maintainability.
    This holds for SSIS because data integration lifecycle management is just as vital
    as web, GUI, and middle-tier software lifecycle management.


    `SSIS Catalog Compare` is designed to support DevOps and enterprise DILM.


    You can script individual artifacts using `SSIS Catalog Compare`, but perhaps
    the more useful (and quicker) functionality is to script a catalog folder and
    all its contents, as shown in Figure [7-6](#459435_1_En_7_Chapter.xhtml#Fig6).


    ![../images/459435_1_En_7_Chapter/459435_1_En_7_Fig6_HTML.jpg](images/459435_1_En_7_Chapter/459435_1_En_7_Fig6_HTML.jpg)


    Figure 7-6 Preparing to generate scripts for a catalog folder and its contents


    When you click “**Generate Scripts for Folder and Contents**,” `SSIS Catalog Compare`
    prompts you for a file system folder in which to store the scripts, as show in
    Figure [7-7](#459435_1_En_7_Chapter.xhtml#Fig7).


    ![../images/459435_1_En_7_Chapter/459435_1_En_7_Fig7_HTML.jpg](images/459435_1_En_7_Chapter/459435_1_En_7_Fig7_HTML.jpg)


    Figure 7-7 Selecting a target file system folder for the scripts


    When you select a file system folder, `SSIS Catalog Compare` generates the scripts
    and ISPAC files to create the catalog folder and all its contents, as shown in
    Figure [7-8](#459435_1_En_7_Chapter.xhtml#Fig8).


    ![../images/459435_1_En_7_Chapter/459435_1_En_7_Fig8_HTML.jpg](images/459435_1_En_7_Chapter/459435_1_En_7_Fig8_HTML.jpg)


    Figure 7-8 Viewing the target file system folder for the scripts


    The scripts are numbered in an order that represents dependencies. For example,
    you cannot deploy an SSIS project using the ISPAC file, number 2, unless and until
    the SSIS catalog folder for that SSIS catalog project exists, script number 1.


    Double-clicking the files in the order listed will create the `Test` catalog folder
    (script 1) on the target SSIS catalog, deploy the `DILMSample` SSIS project using
    the **Integration Services Deployment Wizard** GUI (you will need to select the
    `Test` catalog folder as the target catalog folder during deployment), create
    the `envConnection1` catalog environment and its catalog environment variable(s),
    create a reference between the `DILMSample` SSIS project and `envConnection1`,
    and create *another* reference with reference mapping(s) between the `SimplePackage.dtsx`
    SSIS package and the `envConnection1` catalog environment.


    Why two reference files? Inside the SSIS catalog references for SSIS catalog projects
    and SSIS packages are distinct artifacts.'
