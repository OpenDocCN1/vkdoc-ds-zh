    *For Christy.*


    Foreword


    I’ve had the honor and privilege of knowing and working with Andy Leonard for
    several years. Most of that time has been spent collaborating on projects as independent
    contractors. We’ve watched and learned as SSIS has matured through the years.
    Andy is one of the most knowledgeable and technically savvy people that I’ve had
    the pleasure of working with. And, with close to 40 years in the field, I’ve worked
    with a lot of people.


    This book is filled with best practices we learned through years of trial and
    error with the practical application of SSIS to solve real problems. We learned
    by doing and then rethinking to look for better solutions. Things change quickly
    so we learn new things all the time. We are constantly reevaluating what we’ve
    done in the past and comparing it with what we’ve learned since then.


    *Data Integration Life Cycle Management with SSIS* grew out of the many iterations
    working on various projects. It’s not just about development but also the effort
    of ongoing maintenance. Understanding both sides is critical in developing processes
    that work well in the DevOps enterprise. This approach is a methodology that helps
    make the development and deployment processes more efficient, effective, and predictable.
    That makes us all a little happier.


    This book is also about sharing what has been learned along the journey with others
    who can benefit from it. Andy is all about that, and it’s one of the things that
    I appreciate most about him. I sincerely hope that you find this book helpful
    now and for a long to come.


    Enjoy!


    Kent Bradshaw Summer, 2017Acknowledgments


    I thank God first for He leads me in right paths for his name’s sake (Psalm 23:3).
    I thank Christy, my lovely bride, and our children—Stevie Ray, Emma, and Riley—for
    sacrificing some Dad time. Thanks to the awesome team at Enterprise Data & Analytics
    for their patience and hard work while I wrote: Kent Bradshaw, Nick Harris, and
    Penny Trupe. I also have an awesome team at Apress: Jill Balzano kept the wheels
    on the bus going ‘round and ‘round and Jonathan Gennick is the best editor in
    the business.


    ### About the Author


    # 1. Introduction to DILM


    *DevOps* is a combination of the words “Development” and “Operations.” DevOps
    is about process improvement, which manifests in faster time to market, higher
    quality, repeatable automation, and code that is easier to support and maintain.
    Software testing is a major part of DevOps, starting with unit-testing conducted
    by software developers. Software testing occurs at all enterprise application
    tiers (Development, Quality Assurance, User Acceptance, Production, etc.). DevOps
    developers support Operations by surfacing process instrumentation and building
    repeatable configurations scripts. Configurations scripting supports higher quality
    and faster disaster recovery, and rapidly and reliably adding enterprise application
    tiers.


    Software developers follow best practices to build robust enterprise software.
    For decades, developers have applied a collection of best practices called application
    lifecycle management, or *ALM*, when building applications. What is ALM? Application
    lifecycle management includes design principles that support DevOps. An important
    development concept is *separation of concerns*, design best practices including
    externalization (parameterization) and decoupling.


    *Data integration* is moving data from one location to another. Data is often
    collected from disparate sources and loaded into a database to support centralized
    reporting. The reporting databases are known by different names in different enterprises:
    operational data store (ODS) , staging database, central repository, data warehouse
    (DW) , or enterprise data warehouse (EDW) , to list a few.


    Data integration *is* software development. Data integration lifecycle management,
    or *DILM*, is the art and science of managing data integration in the modern DevOps
    enterprise. In this book, I share what I’ve learned managing SQL Server Integration
    Services (SSIS) data integration solutions in enterprises large and small.


    My goal in writing this book is to teach you how to manage SSIS in your enterprise.
    As with all other software development platforms, lifecycle management is a best
    practice with SSIS. As with all other software development, it’s possible to practice
    DevOps with SSIS.


    ## Some History


    SQL Server Integration Services (SSIS) was released in November 2005\. Development
    on SSIS started long before, and I’m told the product was originally slated to
    be dubbed Data Transformation Services (DTS) 2.0\. Many assemblies sport the namespace
    “Dts.”


    I want to introduce this book by making a few statements about SSIS.


    ### SSIS Is a Software Development Platform


    I cannot recall how many times I’ve seen job postings for database administrators
    “with SSIS experience.”


    Database administrator, database developer, and SSIS developer are different roles.


    I cringe a little when I read said postings. SSIS is a software development platform
    and I am a software developer. I am also a database developer. I am *not* a database
    administrator (DBA). I’ve tried to do the job of a DBA and failed. Miserably.
    It’s not that I don’t appreciate the role of a DBA; I promise I do. Some of my
    best friends are DBAs . I want to begin by expressing to you this simple truth:
    DBA, database developer, and SSIS developer are different roles.'
