  raw: '## Source Control Client


    Depending on which source control (or version control) engine you desire to use,
    you may or may not require a Visual Studio plug-in (or extension). Many developers
    use Subversion, a popular open-source version control system, with Tortoise SVN,
    a Subversion client implemented as a Windows shell. Tortoise is a highly intuitive
    interface that integrates into Windows Explorer to provide context-sensitive menus
    available by right-clicking file system folders that contain project artifacts
    under Subversion source control.


    Git is a popular version control system created by Linus Torvalds (the creator
    of Linux). Git is a distributed source control system, which means each developer
    maintains a local working copy of the repository. Git relies heavily on *branching*
    (making another - usually local - copy of the current version of the code) and
    *merging* (the process of adding changes to the - usually local - edited version
    into another version of the code).


    In this chapter I use Team Explorer, the Visual Studio plug-in for Team Foundation
    Services (TFS). You can learn more about Visual Studio plug-ins for TFS at `visualstudio.com/en-us/docs/tools`.


    ## Creating a Team Project


    In this section, I demonstrate how I use the free source control available at
    Visual Studio Online. I like Visual Studio Online because it’s difficult to beat
    the price (free) and the total cost of ownership (also free). After setting up
    an account you can create a New Team Project from the dashboard. Mine is shown
    in Figure [3-1](#459435_1_En_3_Chapter.xhtml#Fig1).


    ![../images/459435_1_En_3_Chapter/459435_1_En_3_Fig1_HTML.jpg](images/459435_1_En_3_Chapter/459435_1_En_3_Fig1_HTML.jpg)


    Figure 3-1


    Preparing to create a new team project


    You can think of Visual Studio Online source control as an extension of the Visual
    paradigm. The red box in Figure [3-2](#459435_1_En_3_Chapter.xhtml#Fig2) is drawn
    around an SSIS package, which can be considered a Visual Studio *project artifact*.
    Project artifacts are lowest in the hierarchy of Visual Studio objects. The next
    level is the *project*, surrounded by a blue box in Figure [3-2](#459435_1_En_3_Chapter.xhtml#Fig2).
    Visual Studio projects contain one or more project artifacts. Visual Studio *solutions*,
    such as the DILMSuite solution circled in green in Figure [3-2](#459435_1_En_3_Chapter.xhtml#Fig2),
    contain one or more projects.


    ![../images/459435_1_En_3_Chapter/459435_1_En_3_Fig2_HTML.jpg](images/459435_1_En_3_Chapter/459435_1_En_3_Fig2_HTML.jpg)


