    `AdventureWorks2014_Stage` 的项目连接管理器和名为 `20_Build_Destination_Schemas.dtsx` 的 SSIS
    包，如图 10-29 所示。


    ![../images/459435_1_En_10_Chapter/459435_1_En_10_Fig29_HTML.jpg](img/459435_1_En_10_Fig29_HTML.jpg)


    图 10-29: 创建用于构建目标架构的 SSIS 包


    # 生成目标表


    在 `BimlExpressMetadataFramework` 项目中，多选 `0_00_BuildConnections.biml` 和 `0_30_BuildDestinationTablesMain.biml`
    文件。右键点击并选择 `Generate SSIS Packages`，如图 10-30 所示。


    ![../images/459435_1_En_10_Chapter/459435_1_En_10_Fig30_HTML.jpg](img/459435_1_En_10_Fig30_HTML.jpg)


    图 10-30: 构建目标表 SSIS 包


