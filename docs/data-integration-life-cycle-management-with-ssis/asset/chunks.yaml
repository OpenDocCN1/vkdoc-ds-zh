- fmt: '### Creating a Catalog Folder


    The scripts (and `ISPAC`) are idempotent, or re-executable, as shown in Figure
    [7-9](#459435_1_En_7_Chapter.xhtml#Fig9).


    ![../images/459435_1_En_7_Chapter/459435_1_En_7_Fig9_HTML.jpg](images/459435_1_En_7_Chapter/459435_1_En_7_Fig9_HTML.jpg)


    **Figure 7-9** Idempotent Transact-SQL scripts


    If the `Test` catalog folder does not exist, the script creates it. If the `Test`
    catalog folder exists, the script outputs a message informing the executor of
    this fact.


    The output messages are written to be copied and pasted into a ticket’s Notes
    field before the ticket is closed. The messages provide detailed information about
    how and when the script was generated, by whom, when and where the script was
    executed, and by whom, as shown in Figure [7-10](#459435_1_En_7_Chapter.xhtml#Fig10).


    ![../images/459435_1_En_7_Chapter/459435_1_En_7_Fig10_HTML.jpg](images/459435_1_En_7_Chapter/459435_1_En_7_Fig10_HTML.jpg)


    **Figure 7-10** Script output messages


    Refreshing the `SSIS` catalog node in `SSMS Object Explorer` will reveal the `Test`
    catalog folder has been created, as show in Figure [7-11](#459435_1_En_7_Chapter.xhtml#Fig11).


    ![../images/459435_1_En_7_Chapter/459435_1_En_7_Fig11_HTML.jpg](images/459435_1_En_7_Chapter/459435_1_En_7_Fig11_HTML.jpg)


    **Figure 7-11** Refreshing the SSIS catalog node


    Figure [7-12](#459435_1_En_7_Chapter.xhtml#Fig12) shows the results of the refresh:
    the `Test` catalog folder has been created by the script.


    ![../images/459435_1_En_7_Chapter/459435_1_En_7_Fig12_HTML.jpg](images/459435_1_En_7_Chapter/459435_1_En_7_Fig12_HTML.jpg)


    **Figure 7-12** The Test catalog folder lives!


    I began this section stating, “The scripts (and `ISPAC`) are idempotent…” What
    happens if you re-execute the script you just used to create the `Test` catalog
    folder? Let’s return to `SSMS` and try it. The results are shown in Figure [7-13](#459435_1_En_7_Chapter.xhtml#Fig13).


    ![../images/459435_1_En_7_Chapter/459435_1_En_7_Fig13_HTML.jpg](images/459435_1_En_7_Chapter/459435_1_En_7_Fig13_HTML.jpg)


    **Figure 7-13** Re-executing the Catalog Folder script


    Please note the message returned: “Test folder already exists.” The `Test` catalog
    folder was not harmed by re-executing the script. The script simply checks for
    the existence of the catalog folder and creates it if it does not exist. If the
    catalog folder exists, the script returns a message. The `Transact-SQL` that performs
    this operation is shown in Figure [7-14](#459435_1_En_7_Chapter.xhtml#Fig14).


    ![../images/459435_1_En_7_Chapter/459435_1_En_7_Fig14_HTML.jpg](images/459435_1_En_7_Chapter/459435_1_En_7_Fig14_HTML.jpg)


    **Figure 7-14** Transact-SQL that first checks for catalog folder existence


    If you refresh `SSIS` catalog Compare Catalog 2, you now see the `Test` catalog
    folder, as shown in Figure [7-15](#459435_1_En_7_Chapter.xhtml#Fig15).


    ![../images/459435_1_En_7_Chapter/459435_1_En_7_Fig15_HTML.jpg](images/459435_1_En_7_Chapter/459435_1_En_7_Fig15_HTML.jpg)


    **Figure 7-15** The Test catalog folder created


    ### Deploying the SSIS Project


    To deploy the `SSIS` project, double-click (or right-click and click Open) the
    `ISPAC` file, as shown in Figure [7-16](#459435_1_En_7_Chapter.xhtml#Fig16).


    ![../images/459435_1_En_7_Chapter/459435_1_En_7_Fig16_HTML.jpg](images/459435_1_En_7_Chapter/459435_1_En_7_Fig16_HTML.jpg)


    **Figure 7-16** Opening the ISPAC file


    The `Integration Services Deployment Wizard` starts; this is the same wizard used
    to deploy `SSIS` projects from `SQL Server Data Tools (SSDT)`. Stepping through
    the wizard, the first stop is the `Select Source` page shown in Figure [7-17](#459435_1_En_7_Chapter.xhtml#Fig17).


    ![../images/459435_1_En_7_Chapter/459435_1_En_7_Fig17_HTML.jpg](images/459435_1_En_7_Chapter/459435_1_En_7_Fig17_HTML.jpg)


    **Figure 7-17** The Integration Services Deployment Wizard Select Source page


    This page surfaces a lot of functionality. The `Deployment Model` dropdown is
    used to select project or package deployment. Beginning with `SSIS 2016`, operators
    have the option of deploying the entire `SSIS` project, which was the only option
    available in `SSIS 2012` and `2014`, or deploying a single `SSIS` package. Operators
    may also select the type of `SSIS` project source. There are two options available:
    a project deployment file or an `Integration Services` catalog. Since you started
    this exercise by opening an `ISPAC` file, the project deployment file option is
    selected for you.


    If you select the `Integration Services` catalog option, the `Select Source` page
    presents catalog project settings that may be configured for an `SSIS` catalog
    project deployed to a different `SSIS` catalog, as shown in Figure [7-18](#459435_1_En_7_Chapter.xhtml#Fig18).


    ![../images/459435_1_En_7_Chapter/459435_1_En_7_Fig18_HTML.jpg](images/459435_1_En_7_Chapter/459435_1_En_7_Fig18_HTML.jpg)


    **Figure 7-18** Deploying from one SSIS catalog to another


    The remainder of the `Integration Services Deployment Wizard` pages and process
    are the same as those covered in Chapter [4](#459435_1_En_4_Chapter.xhtml). On
    the `Select Destination` page, enter the name of the `SQL Server` instance that
    hosts the target `SSIS` catalog. You can then browse to the newly-created catalog
    folder, shown in Figure [7-19](#459435_1_En_7_Chapter.xhtml#Fig19).


    ![../images/459435_1_En_7_Chapter/459435_1_En_7_Fig19_HTML.jpg](images/459435_1_En_7_Chapter/459435_1_En_7_Fig19_HTML.jpg)


    **Figure 7-19** Browsing to the Test catalog folder recently created


    Step through the remainder of the `Integration Services Deployment Wizard` until
    the `SSIS` project has been deployed, as shown in Figure [7-20](#459435_1_En_7_Chapter.xhtml#Fig20).


    ![../images/459435_1_En_7_Chapter/459435_1_En_7_Fig20_HTML.jpg](images/459435_1_En_7_Chapter/459435_1_En_7_Fig20_HTML.jpg)


    **Figure 7-20** A successful deployment


    Refresh `SSIS Catalog Compare` to see that the `SSIS` catalog project now exists,
    as shown in Figure [7-21](#459435_1_En_7_Chapter.xhtml#Fig21).


    ![../images/459435_1_En_7_Chapter/459435_1_En_7_Fig21_HTML.jpg](images/459435_1_En_7_Chapter/459435_1_En_7_Fig21_HTML.jpg)


    **Figure 7-21** Viewing the DILMSample SSIS catalog project


    As with the Catalog Folder script, `ISPAC` files are re-executable. When an `ISPAC`
    file is re-executed, a new version of the `SSIS` project is deployed to the target
    `SSIS` catalog.


    ### Deploying the Literal Overrides and Catalog Environment


    `SSIS` catalog literal overrides and environment scripts are similar because both
    contain values, either literal override values or values for catalog environment
    variables. Value parameters reside at the top of the `Transact-SQL` script generated
    and may be modified by the operator prior to deployment to the target `SSIS` catalog,
    as shown in Figure [7-22](#459435_1_En_7_Chapter.xhtml#Fig22).


    ![../images/459435_1_En_7_Chapter/459435_1_En_7_Fig22_HTML.jpg](images/459435_1_En_7_Chapter/459435_1_En_7_Fig22_HTML.jpg)


    **Figure 7-22** Editing an SSIS catalog environment script prior to execution


    As with the `SSIS Catalog Folder` script, the `Catalog Environment` script provides
    rich feedback messages, as shown in Figure [7-23](#459435_1_En_7_Chapter.xhtml#Fig23).


    ![../images/459435_1_En_7_Chapter/459435_1_En_7_Fig23_HTML.jpg](images/459435_1_En_7_Chapter/459435_1_En_7_Fig23_HTML.jpg)


    **Figure 7-23** Messages from the Catalog Environment Script execution


    Please note the `Catalog Environment` script first checks for the existence on
    the target catalog folder and provides feedback in message on its existence. If
    the target folder does not exist, the `Catalog Environment` script will fail.
    Catalog environment variables are created in the `Catalog Environment` script.'
