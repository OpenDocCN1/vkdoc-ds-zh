    \n![../images/459435_1_En_2_Chapter/459435_1_En_2_Fig16_HTML.jpg](images/459435_1_En_2_Chapter/459435_1_En_2_Fig16_HTML.jpg)\n\
    \nFigure 2-16\n\nSuccess!\n\nIf you click the Progress tab, you should see the\
    \ OnInformation messages raised by your script, as shown in Figure [2-17](#459435_1_En_2_Chapter.xhtml#Fig17).\n\
    \n![../images/459435_1_En_2_Chapter/459435_1_En_2_Fig17_HTML.jpg](images/459435_1_En_2_Chapter/459435_1_En_2_Fig17_HTML.jpg)\n\
    \nFigure 2-17\n\nOnInformation messages\n\nYour demo is now ready to begin an\
    \ epic journey into data integration lifecycle management.\n\n## Conclusion\n\n\
    In this chapter, you built an SSIS package that you will use for the lessons throughout\
    \ this book. I discussed data integration instrumentation and messaging to surface\
    \ SSIS package execution log messages. It’s important for us on the Dev side of\
    \ DevOps to signal supporting personnel on the Ops side. It takes minutes to write\
    \ this code that may save hours of troubleshooting.\n\n# 3. Source Control\n\n\
    Later in this book, I will discuss why SQL Server database backup and restore\
    \ of the SSISDB database is not a viable method of SSIS code promotion. You should\
    \ back up the SSISDB database just like you should back up all databases. You\
