- fmt: "# 5. Configure the SSIS Catalog Project\n\nA key tenet of enterprise DevOps\
    \ is *externalization*, which is the configuration or parameterization of code.\
    \ The configuration is stored apart from the code itself. Externalization promotes\
    \ code reuse and supports decoupling, both best practices in software development.\
    \ In this chapter, I focus on externalizing SSIS connection manager connection\
    \ string properties because I believe it is an SSIS best practice to manage SSIS\
    \ project and package connection strings via external configurations.\n\nYour\
    \ `DILMSample` SSIS project is deployed to your SSIS catalog. Expanding the Integration\
    \ Services Catalogs node in SSMS’s Object Explorer surfaces the view shown in\
    \ Figure 5-1.\n\n![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig1_HTML.jpg](images/459435_1_En_5_Chapter/459435_1_En_5_Fig1_HTML.jpg)\n\
    \nFigure 5-1  \nThe `DILMSample` SSIS project in the Integration Services Catalogs\
    \ node, as shown by SSMS’s Object Explorer\n\nYou see the SSIS catalog (`SSISDB`),\
    \ two SSIS catalog folders (`Framework` and `Test`), one SSIS catalog project\
    \ in the `Test` catalog folder (`DILMSample`), and one SSIS package in the `DILMSample`\
    \ catalog project (`SimplePackage.dtsx`).\n\nWhy do I write *SSIS project* in\
    \ some places and *SSIS catalog project* in other places? I am referring to two\
    \ distinct objects.\n\n1.  An SSIS project exists in the context of SQL Server\
    \ Development Tools (SSDT). It is a (hopefully source-controlled) project under\
    \ development.\n\n2.  An SSIS catalog project is an SSIS project that has been\
    \ deployed to an SSIS catalog.\n\nIt will help to think of SSIS catalog projects\
    \ as separate and distinct objects, separated from the SSIS projects that exist\
    \ outside the SSIS catalog, especially when thinking of SSIS catalog project configuration.\
    \ The two are weakly coupled in this fashion: changes made to the SSIS project\
    \ may impact its related SSIS catalog project, and then only after deployment\
    \ to the SSIS catalog. Changes made to the SSIS catalog project in no way impact\
    \ the SSIS project.\n\n## Configuring Projects\n\nYou have several options for\
    \ configuring your SSIS catalog project. In SSMS Object Explorer’s Integration\
    \ Services Catalogs node, expand the subnodes to the `DILMSample` project level.\
    \ Right-click the `DILMSample` SSIS catalog project and click Configure, as shown\
    \ in Figure 5-2.\n\n![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig2_HTML.jpg](images/459435_1_En_5_Chapter/459435_1_En_5_Fig2_HTML.jpg)\n\
    \nFigure 5-2  \nPreparing to configure the `DILMSample` catalog project\n\nThe\
    \ Configure – `DILMSample` dialog opens.\n\n## Configuring Connections\n\nThe\
    \ SSIS catalog treats connection manager properties like parameters. In fact,\
    \ if you query the `[catalog].[object_parameters]` view, you will find parameters\
    \ with names like `CM.<SSIS Connection Manager Name>.ConnectionString`. This is\
    \ a connection manager parameter. I’m pretty sure `CM` indicates “connection manager.”\
    \ `<SSIS Connection Manager Name>.ConnectionString` is a connection manager’s\
    \ `ConnectionString` property, for sure.\n\nWhen the Configure – `DILMSample`\
    \ window displays, click the Connection Managers tab to view the connection’s\
    \ configuration, as shown in Figure 5-3.\n\n![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig3_HTML.jpg](images/459435_1_En_5_Chapter/459435_1_En_5_Fig3_HTML.jpg)\n\
    \nFigure 5-3  \nViewing the connection manager’s configuration\n\nNote the listbox\
    \ below the Parameters and Connection Managers tabs. It surfaces the container\
    \ (a catalog project artifact) and name (of the connection manager). My SSIS project\
    \ contains a single connection manager in `SimplePackage.dtsx`, so `SimplePackage.dtsx`\
    \ is the container and the connection manager name is `vmDemo\\Demo.TestDB1`.\
    \ The name of your connection manager will almost certainly differ, as will your\
    \ `ConnectionString` property, to which you next turn your attention.\n\nThe value\
    \ in the `ConnectionString` property is the value configured at design time. The\
    \ SSIS catalog will always have access to design-time default values. If I execute\
    \ the `SimplePackage.dtsx` SSIS package in the SSIS catalog as it is currently\
    \ configured, it will execute and attempt to connect to the `vmDemo\\Demo` instance\
    \ of SQL Server and the `TestDB` database. Because I’ve deployed this SSIS project\
    \ to the SSIS catalog hosted on the `vmDemo\\Demo` SQL Server instance, the `SimplePackage.dtsx`\
    \ package should execute without issue.\n\nBut what happens when I deploy the\
    \ `DILMSample` SSIS project to a *different* SSIS catalog? `SimplePackage.dtsx`\
    \ may or may not execute successfully, depending on a number of factors that impact\
    \ whether processes executing on one server can connect to SQL Server instances\
    \ hosted on other servers.\n\nOne key thing to remember is this: as the SSIS project\
    \ is configured at this time, each time I deploy the `DILMSample` SSIS project,\
    \ the default value of the `vmDemo\\Demo.TestDB1` connection manager in `SimplePackage.dtsx`\
    \ will *always* be configured to connect to the `vmDemo\\Demo` instance of SQL\
    \ Server and the `TestDB` database on that instance."
  raw: '# 5. Configure the SSIS Catalog Project


    A key tenet of enterprise DevOps is *externalization*, which is the configuration
    or parameterization of code. The configuration is stored apart from the code itself.
    Externalization promotes code reuse and supports decoupling, both best practices
    in software development. In this chapter, I focus on externalizing SSIS connection
    manager connection string properties because I believe it is an SSIS best practice
    to manage SSIS project and package connection strings via external configurations.


    Your DILMSample SSIS project is deployed to your SSIS catalog. Expanding the Integration
    Services Catalogs node in SSMS’s Object Explorer surfaces the view shown in Figure
    [5-1](#459435_1_En_5_Chapter.xhtml#Fig1).


    ![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig1_HTML.jpg](images/459435_1_En_5_Chapter/459435_1_En_5_Fig1_HTML.jpg)


    Figure 5-1


    The DILMSample SSIS project in the Integration Services Catalogs node, as shown
    by SSMS’s Object Explorer


    You see the SSIS catalog (SSISDB), two SSIS catalog folders (`Framework` and `Test`),
    one SSIS catalog project in the `Test` catalog folder (DILMSample), and one SSIS
    package in the DILMSample catalog project (`SimplePackage.dtsx`).


    Why do I write *SSIS project* in some places and *SSIS catalog project* in other
    places? I am referring to two distinct objects.


    1.  An SSIS project exists in the context of SQL Server Development Tools (SSDT).
    It is a (hopefully source-controlled) project under development.


    2.  An SSIS catalog project is an SSIS project that has been deployed to an SSIS
    catalog.


    It will help to think of SSIS catalog projects as separate and distinct objects,
    separated from the SSIS projects that exist outside the SSIS catalog, especially
    when thinking of SSIS catalog project configuration. The two are weakly coupled
    in this fashion: changes made to the SSIS project may impact its related SSIS
    catalog project, and then only after deployment to the SSIS catalog. Changes made
    to the SSIS catalog project in no way impact the SSIS project.


    ## Configuring Projects


    You have several options for configuring your SSIS catalog project. In SSMS Object
    Explorer’s Integration Services Catalogs node, expand the subnodes to the DILMSample
    project level. Right-click the DILMSample SSIS catalog project and click Configure,
    as shown in Figure [5-2](#459435_1_En_5_Chapter.xhtml#Fig2).


    ![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig2_HTML.jpg](images/459435_1_En_5_Chapter/459435_1_En_5_Fig2_HTML.jpg)


    Figure 5-2


    Preparing to configure the DILMSample catalog project


    The Configure – DILMSample dialog opens.


    ## Configuring Connections


    The SSIS catalog treats connection manager properties like parameters. In fact,
    if you query the `[catalog].[object_parameters]` view, you will find parameters
    with names like “CM.<*SSIS Connection Manager Name*>.ConnectionString”. This is
    a connection manager parameter. I’m pretty sure “CM” indicates “connection manager.”
    “<*SSIS Connection Manager Name*>.ConnectionString” is a connection manager’s
    ConnectionString property, for sure.


    When the Configure – DILMSample window displays, click the Connection Managers
    tab to view the connection’s configuration, as shown in Figure [5-3](#459435_1_En_5_Chapter.xhtml#Fig3).


    ![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig3_HTML.jpg](images/459435_1_En_5_Chapter/459435_1_En_5_Fig3_HTML.jpg)


    Figure 5-3


    Viewing the connection manager’s configuration


    Note the listbox below the Parameters and Connection Managers tabs. It surfaces
    the container (a catalog project artifact) and name (of the connection manager).
    My SSIS project contains a single connection manager in `SimplePackage.dtsx`,
    so `SimplePackage.dtsx` is the container and the connection manager name is `vmDemo\Demo.TestDB1`.
    The name of your connection manager will almost certainly differ, as will your
    ConnectionString property, to which you next turn your attention.


    The value in the ConnectionString property is the value configured at design time.
    The SSIS catalog will always have access to design-time default values. If I execute
    the `SimplePackage.dtsx` SSIS package in the SSIS catalog as it is currently configured,
    it will execute and attempt to connect to the `vmDemo\Demo` instance of SQL Server
    and the `TestDB` database. Because I’ve deployed this SSIS project to the SSIS
    catalog hosted on the `vmDemo\Demo` SQL Server instance, the `SimplePackage.dtsx`
    package should execute without issue.


    But what happens when I deploy the DILMSample SSIS project to a *different* SSIS
    catalog? `SimplePackage.dtsx` may or may not execute successfully, depending on
    a number of factors that impact whether processes executing on one server can
    connect to SQL Server instances hosted on other servers.


    One key thing to remember is this: as the SSIS project is configured at this time,
    each time I deploy the DILMSample SSIS project, the default value of the `vmDemo\Demo.TestDB1`
    connection manager in `SimplePackage.dtsx` will *always* be configured to connect
    to the `vmDemo\Demo` instance of SQL Server and the `TestDB` database on that
    instance.'
  trans: "\n# 5. 配置 SSIS 目录项目\n\n企业级 DevOps 的一个关键原则是*外部化*，即对代码进行配置或参数化。配置与代码本身分开存储。外部化促进了代码复用并支持解耦，这两者都是软件开发中的最佳实践。在本章中，我将重点介绍如何外部化\
    \ SSIS 连接管理器连接字符串属性，因为我相信通过外部配置来管理 SSIS 项目和包连接字符串是一项 SSIS 最佳实践。\n\n你的 `DILMSample`\
    \ SSIS 项目已部署到你的 SSIS 目录中。在 SSMS 对象资源管理器中展开 Integration Services Catalogs 节点，会显示出如图\
    \ 5-1 所示的视图。\n\n![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig1_HTML.jpg](img/459435_1_En_5_Fig1_HTML.jpg)\n\
    \n图 5-1  \nSSMS 对象资源管理器显示的 Integration Services Catalogs 节点中的 `DILMSample` SSIS\
    \ 项目\n\n你可以看到 SSIS 目录（`SSISDB`）、两个 SSIS 目录文件夹（`Framework` 和 `Test`）、`Test` 目录文件夹中的一个\
    \ SSIS 目录项目（`DILMSample`），以及 `DILMSample` 目录项目中的一个 SSIS 包（`SimplePackage.dtsx`）。\n\
    \n为什么我在某些地方写 *SSIS 项目*，而在其他地方写 *SSIS 目录项目*？我指的是两个不同的对象。\n\n1.  SSIS 项目存在于 SQL\
    \ Server Data Tools (SSDT) 环境中。它是一个正在开发中的项目（希望是受源代码控制的）。\n2.  SSIS 目录项目是一个已部署到\
    \ SSIS 目录中的 SSIS 项目。\n\n将 SSIS 目录项目视为独立且不同的对象，与存在于 SSIS 目录外部的 SSIS 项目区分开，这将有助于理解，尤其是在考虑\
    \ SSIS 目录项目配置时。两者之间的耦合关系很弱：对 SSIS 项目所做的更改可能会影响其相关的 SSIS 目录项目，并且仅在部署到 SSIS 目录之后才会生效。对\
    \ SSIS 目录项目所做的更改绝不会影响 SSIS 项目。\n\n## 配置项目\n\n你有多个选项来配置你的 SSIS 目录项目。在 SSMS 对象资源管理器的\
    \ Integration Services Catalogs 节点中，展开子节点直到 `DILMSample` 项目级别。右键单击 `DILMSample`\
    \ SSIS 目录项目，然后点击“配置”，如图 5-2 所示。\n\n![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig2_HTML.jpg](img/459435_1_En_5_Fig2_HTML.jpg)\n\
    \n图 5-2  \n准备配置 `DILMSample` 目录项目\n\n“配置 – `DILMSample`”对话框随即打开。\n\n## 配置连接\n\n\
    SSIS 目录将连接管理器属性视为参数。实际上，如果你查询 `[catalog].[object_parameters]` 视图，你会发现一些名称类似于 `CM.<SSIS\
    \ 连接管理器名称>.ConnectionString` 的参数。这是一个连接管理器参数。我很确定 `CM` 代表“连接管理器”。`<SSIS 连接管理器名称>.ConnectionString`\
    \ 无疑是连接管理器的 `ConnectionString` 属性。\n\n当“配置 – `DILMSample`”窗口显示时，单击“连接管理器”选项卡以查看连接的配置，如图\
    \ 5-3 所示。\n\n![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig3_HTML.jpg](img/459435_1_En_5_Fig3_HTML.jpg)\n\
    \n图 5-3  \n查看连接管理器的配置\n\n请注意“参数”和“连接管理器”选项卡下方的列表框。它显示了容器（一个目录项目工件）和名称（连接管理器的名称）。我的\
    \ SSIS 项目在 `SimplePackage.dtsx` 中包含一个连接管理器，因此 `SimplePackage.dtsx` 是容器，连接管理器名称是\
    \ `vmDemo\\Demo.TestDB1`。你的连接管理器名称几乎肯定会不同，你的 `ConnectionString` 属性也会不同，接下来你将关注这一点。\n\
    \n`ConnectionString` 属性中的值是在设计时配置的值。SSIS 目录始终可以访问设计时的默认值。如果我按当前配置在 SSIS 目录中执行\
    \ `SimplePackage.dtsx` SSIS 包，它将执行并尝试连接到 SQL Server 的 `vmDemo\\Demo` 实例和 `TestDB`\
    \ 数据库。由于我已将此 SSIS 项目部署到托管在 `vmDemo\\Demo` SQL Server 实例上的 SSIS 目录，`SimplePackage.dtsx`\
    \ 包应该可以正常执行。\n\n但是，当我将 `DILMSample` SSIS 项目部署到*不同*的 SSIS 目录时会发生什么？`SimplePackage.dtsx`\
    \ 可能成功执行，也可能不成功，这取决于许多影响一台服务器上运行的进程能否连接到其他服务器上托管的 SQL Server 实例的因素。\n\n需要记住的一个关键点是：按照当前的\
    \ SSIS 项目配置，每次我部署 `DILMSample` SSIS 项目时，`SimplePackage.dtsx` 中 `vmDemo\\Demo.TestDB1`\
    \ 连接管理器的默认值将*始终*被配置为连接到 SQL Server 的 `vmDemo\\Demo` 实例以及该实例上的 `TestDB` 数据库。\n"
- fmt: '# Overriding the Connection Configuration


    How does one change the connection configuration? Click the ellipsis to the right
    of the `ConnectionString` property''s `Value` textbox, circled in Figure [5-4](#459435_1_En_5_Chapter.xhtml#Fig4).


    ![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig4_HTML.jpg](images/459435_1_En_5_Chapter/459435_1_En_5_Fig4_HTML.jpg)


    *Figure 5-4 – Preparing to open the ConnectionString''s Value configuration*


    The **Set Parameter Value** dialog opens.


    In the SSIS catalog, project parameters, package parameters, and connection manager
    properties are all considered parameters.


    Select and copy the design-time default value of the `ConnectionString` property,
    found in the textbox beside the "Use default value from package" option, and paste
    it into the "Edit value" textbox, as shown in Figure [5-5](#459435_1_En_5_Chapter.xhtml#Fig5).


    ![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig5_HTML.jpg](images/459435_1_En_5_Chapter/459435_1_En_5_Fig5_HTML.jpg)


    *Figure 5-5 – Editing the ConnectionString property value*


    I made a couple changes to the `ConnectionString` after pasting it into the **Edit
    Value** textbox. I deleted a `Guid` value from the `Application Name` setting
    and I changed the data source from `vmDemo\Demo` to `(local)\Demo`. The data source
    is technically the same as before. I made the change so that I can later be certain
    which value is being used: the design-time default or this *literal override*.


    Click the **OK** button to proceed to the override page in Figure [5-6](#459435_1_En_5_Chapter.xhtml#Fig6).


    ![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig6_HTML.jpg](images/459435_1_En_5_Chapter/459435_1_En_5_Fig6_HTML.jpg)


    *Figure 5-6 – A catalog project literal override*


    The `ConnectionString` value has been overridden by an SSIS catalog literal override.
    This is indicated by the **bold text decoration** of the value. You can think
    of a literal override as hard-coding a configuration value into the SSIS catalog.
    Subsequent deployments of the `DILMSample` SSIS project to this SSIS catalog will
    *not* change the value of the literal override, even if you change the value of
    the connection manager''s design-time default `ConnectionString` value. This is
    one reason I refer to an *SSIS project* in SSDT and an *SSIS catalog project*
    or *catalog project* once it has been deployed to an SSIS catalog.


    As someone with permission to configure an SSIS catalog, you can always revert
    any literal override to the design-time default value by selecting the "Use default
    value from package" option in the **Set Parameter Value** dialog, as shown in
    Figure [5-7](#459435_1_En_5_Chapter.xhtml#Fig7).


    ![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig7_HTML.jpg](images/459435_1_En_5_Chapter/459435_1_En_5_Fig7_HTML.jpg)


    *Figure 5-7 – Reselecting the design-time default*


    The value text decoration returns to none and the value reverts to the design-time
    default, as shown in Figure [5-8](#459435_1_En_5_Chapter.xhtml#Fig8).


    ![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig8_HTML.jpg](images/459435_1_En_5_Chapter/459435_1_En_5_Fig8_HTML.jpg)


    *Figure 5-8 – Reverted to design-time default*


    # Externalizing the Connection Configuration


    So far you''ve examined two sources of SSIS catalog project configurations settings:
    design-time defaults and literal overrides. You probably noticed a third option
    on the **Set Parameter Values** dialog, one that was disabled. "Use environment
    variable" is the third option but it requires additional configuration before
    this option is enabled.


    Before we jump into the next demo, let''s discuss how the SSIS catalog manages
    *externalization*. Externalization is storing values in some other location for
    use at runtime. The SSIS catalog''s mechanism for externalization is SSIS catalog
    environments. Catalog environments contain a collection of catalog environment
    variables which, in turn, contain values that are used at runtime to override
    catalog project parameter values.


    That last paragraph is relatively short for the depth and importance of the information
    contained therein. Please let it sink in before proceeding.


    Let''s talk about the SSIS catalog''s externalization mechanism in more detail.
    Let''s begin with an SSIS catalog environment, as shown in Figure [5-9](#459435_1_En_5_Chapter.xhtml#Fig9).


    ![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig9_HTML.jpg](images/459435_1_En_5_Chapter/459435_1_En_5_Fig9_HTML.jpg)


    *Figure 5-9 – A catalog environment (figuratively)*


    The SSIS catalog environment contains a collection of zero or more SSIS catalog
    environment variables, as shown in Figure [5-10](#459435_1_En_5_Chapter.xhtml#Fig10).


    ![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig10_HTML.jpg](images/459435_1_En_5_Chapter/459435_1_En_5_Fig10_HTML.jpg)


    *Figure 5-10 – A catalog environment variable in a catalog environment*


    To connect an SSIS catalog environment to an SSIS catalog project, the SSIS catalog
    uses a *reference*. A reference is simply a relationship that connects a catalog
    project to a catalog environment, as shown in Figure [5-11](#459435_1_En_5_Chapter.xhtml#Fig11).


    ![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig11_HTML.jpg](images/459435_1_En_5_Chapter/459435_1_En_5_Fig11_HTML.jpg)


    *Figure 5-11 – A reference relating an SSIS catalog project to an SSIS catalog
    environment*


    In order for a parameter in a catalog project to consume a catalog environment
    variable value, a *reference mapping* is created. A reference mapping maps a value
    stored in an SSIS catalog environment variable to a parameter in an SSIS catalog
    project, as shown in Figure [5-12](#459435_1_En_5_Chapter.xhtml#Fig12).


    ![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig12_HTML.jpg](images/459435_1_En_5_Chapter/459435_1_En_5_Fig12_HTML.jpg)


    *Figure 5-12 – A reference mapping between an SSIS catalog project parameter and
    an SSIS catalog environment variable*


    To restate, because this can be a challenging topic, you first create and configure
    an SSIS catalog environment. Configuring the catalog environment includes defining
    SSIS catalog environment variables. That''s the first step in externalization.


    You next create a reference between an SSIS catalog environment and an SSIS catalog
    project. Creating a reference is the second step in externalization.


    You may then assign SSIS catalog environment variables to SSIS catalog project
    parameters via the reference. This is reference mapping. Mapping a parameter value
    to a catalog environment variable value via a reference is the third step in externalization.


    Let''s walk through this procedure in a demo.


    ## Creating an Environment


    In the SSIS catalog, right-click the `Environments` virtual folder found in the
    `Test` catalog folder and then click **Create Environment**, as shown in Figure
    [5-13](#459435_1_En_5_Chapter.xhtml#Fig13).


    ![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig13_HTML.jpg](images/459435_1_En_5_Chapter/459435_1_En_5_Fig13_HTML.jpg)


    *Figure 5-13 – Preparing to create a catalog environment*


    When the **Create Environment** dialog displays, provide an environment name and
    optional description, as shown in Figure [5-14](#459435_1_En_5_Chapter.xhtml#Fig14).


    ![../images/459435_1_En_5_Chapter/459435_1_En_5_Fig14_HTML.jpg](images/459435_1_En_5_Chapter/459435_1_En_5_Fig14_HTML.jpg)


    *Figure 5-14 – Creating an SSIS catalog environment*


    Click **OK** to close the **Create Environment** dialog.'
