    # 添加项目参数


    在解决方案资源管理器中双击 `Project.params` 工件，打开项目参数窗口，如图 2-3 所示。


    ![../images/459435_1_En_2_Chapter/459435_1_En_2_Fig3_HTML.jpg](img/459435_1_En_2_Fig3_HTML.jpg)


