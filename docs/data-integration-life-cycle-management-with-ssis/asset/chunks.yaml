    The Path value shown on the Select Destination page refers to the SSIS catalog
    path of the SSIS project. SSIS catalog projects are contained in an SSIS catalog
    folder, which is contained in an SSIS catalog (which is always named SSISDB).
    SSIS packages are contained in SSIS catalog projects.


    Click the Next button to proceed to the Review page, as shown in Figure [4-4](#459435_1_En_4_Chapter.xhtml#Fig4).


