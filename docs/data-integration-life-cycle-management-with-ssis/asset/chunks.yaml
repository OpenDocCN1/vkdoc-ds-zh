    SQL task to the SCR Log Values Script task. Open the Script Task Editor. You can
    select Microsoft Visual Basic as the `ScriptLanguage` property or accept the default
    of Microsoft Visual C#. The demos in this book will use C#.


    ## Why C#?


    Since late 2016 Microsoft has repeatedly communicated that Visual Basic and C#
    language functionality will *diverge* (`blogs.msdn.microsoft.com/dotnet/2017/02/01/the-net-language-strategy/`).
    Microsoft’s stated opinion (from the link) is that it will continue to evolve
    C# as a "state of the art programming language" while other features won’t be
    added to Visual Basic because "they wouldn’t address a need or fit naturally in
    VB." Please read the post and the links contained therein. C# and VB will be different
    moving forward, and C# will get features that will not be available in VB.


    For a good tutorial on C#, please visit `bimlscript.com` and click the C# Primer
    link in the Learn Biml Now! lesson.


