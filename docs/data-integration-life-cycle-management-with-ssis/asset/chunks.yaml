- fmt: '## Deploying from the Command Line


    Deployment via CLI is powerful and useful for DevOps automation. The Source and
    Destination information is self-explanatory. Please note in the screenshot that
    I right-clicked the Command line to surface a context menu with a single option:
    Copy. I’ve pasted the command line here:


    ```

    Command line: /Silent /ModelType:Project /SourcePath:"E:\Projects\DILMSample\DILMSample\bin\Development\DILMSample.ispac"
    /DestinationServer:"vmDemo\Demo" /DestinationPath:"/SSISDB/Test/DILMSample"

    ```


    SSIS ships with a number of utilities, some of which may be called from a command
    prompt. Any utility that can be called from a command prompt may be scheduled
    using SQL Agent (provided command-line execution is enabled), Windows Scheduler,
    or almost any other scheduling service or utility.


    In order to use the command line shared on the Integration Services Deployment
    Wizard Review page, you need to know a couple things:


    1. The location of the executable

    2. The meaning of the switches and values


    I installed the Demo instance of SQL Server on `vmDemo`’s `E:` drive so the location
    of `ISDeploymentWizard.exe` is `E:\Program Files\Microsoft SQL Server\130\DTS\Binn\ISDeploymentWizard.exe`,
    as shown in Figure [4-5](#459435_1_En_4_Chapter.xhtml#Fig5).


    ![../images/459435_1_En_4_Chapter/459435_1_En_4_Fig5_HTML.jpg](images/459435_1_En_4_Chapter/459435_1_En_4_Fig5_HTML.jpg)


    **Figure 4-5** The location of the `ISDeploymentWizard.exe` file


    This is the same application that is currently open and executing; it is the Integration
    Services Deployment Wizard executable. As mentioned earlier, the executable exposes
    two interfaces: a GUI and a CLI. It’s possible to execute the entire deployment
    of your SSIS project, DILMSuite, by opening a command prompt, supplying the path
    to `ISDeploymentWizard.exe` followed by the command line above. Don’t believe
    me? Check out Figure [4-6](#459435_1_En_4_Chapter.xhtml#Fig6).


    ![../images/459435_1_En_4_Chapter/459435_1_En_4_Fig6_HTML.jpg](images/459435_1_En_4_Chapter/459435_1_En_4_Fig6_HTML.jpg)


    **Figure 4-6** Deployment via the command line


    There’s good news and bad news here. The good news is this execution succeeded.
    The bad news? There is no feedback provided if the execution succeeds. How can
    you tell it succeeded? Well, it didn’t fail. What does a failure look like? A
    failure may result in a prompt from the CLI that gives you a list of the acceptable
    switches, as shown in Figure [4-7](#459435_1_En_4_Chapter.xhtml#Fig7).


    ![../images/459435_1_En_4_Chapter/459435_1_En_4_Fig7_HTML.jpg](images/459435_1_En_4_Chapter/459435_1_En_4_Fig7_HTML.jpg)


    **Figure 4-7** Deployment failure using the CLI


    This isn’t the only failure response. For example, if you mistype the name of
    the destination server, you will get a “Failed to connect” message after `ISDeploymentWizard.exe`
    tries to contact the server for 30 seconds. That message will appear similar to
    Figure [4-8](#459435_1_En_4_Chapter.xhtml#Fig8).


    ![../images/459435_1_En_4_Chapter/459435_1_En_4_Fig8_HTML.jpg](images/459435_1_En_4_Chapter/459435_1_En_4_Fig8_HTML.jpg)


    **Figure 4-8** Deployment failure due to connection error


    Another way to detect success is to use SSMS to connect to the SSIS catalog and
    check for the existence of your SSIS project, as shown in Figure [4-9](#459435_1_En_4_Chapter.xhtml#Fig9).


    ![../images/459435_1_En_4_Chapter/459435_1_En_4_Fig9_HTML.jpg](images/459435_1_En_4_Chapter/459435_1_En_4_Fig9_HTML.jpg)


    **Figure 4-9** The SSIS project deployed to the SSIS catalog


    If the SSIS project has been deployed before, though, you can check by right-clicking
    the SSIS project in the catalog and clicking Versions, as shown in Figure [4-10](#459435_1_En_4_Chapter.xhtml#Fig10).


    ![../images/459435_1_En_4_Chapter/459435_1_En_4_Fig10_HTML.jpg](images/459435_1_En_4_Chapter/459435_1_En_4_Fig10_HTML.jpg)


    **Figure 4-10** Opening SSIS catalog project versions


    The Project Versions dialog displays as shown in Figure [4-11](#459435_1_En_4_Chapter.xhtml#Fig11).


    ![../images/459435_1_En_4_Chapter/459435_1_En_4_Fig11_HTML.jpg](images/459435_1_En_4_Chapter/459435_1_En_4_Fig11_HTML.jpg)


    **Figure 4-11** Viewing SSIS catalog project versions


    The last deployment is marked as Current.


    Returning to your deployment from SSDT, if you click the Deploy button on the
    Integration Services Deployment Wizard Review page, the Deployment Wizard will
    attempt to deploy your SSIS project to the SSIS catalog you selected, into the
    SSIS catalog folder you specified, as shown in Figure [4-12](#459435_1_En_4_Chapter.xhtml#Fig12).


    ![../images/459435_1_En_4_Chapter/459435_1_En_4_Fig12_HTML.jpg](images/459435_1_En_4_Chapter/459435_1_En_4_Fig12_HTML.jpg)


    **Figure 4-12** Successful deployment


    If all goes as hoped, the deployment will be a success.


    ## Deployment Failures


    Sometimes bad things happen to good deployments. You may be reading this book
    because you experienced a deployment failure triggered by a good-faith effort
    to restore the SSIS catalog database, `SSISDB`.


    Backup and restore is not a recommended method for promoting or transferring SSIS
    projects between SSIS catalogs!


    When you attempt to deploy an SSIS project (or package) to an SSIS catalog after
    `SSISDB` was improperly restored, the deployment will *not* succeed. Instead,
    your Integration Services Deployment Wizard Results page will appear as shown
    in Figure [4-13](#459435_1_En_4_Chapter.xhtml#Fig13).


    ![../images/459435_1_En_4_Chapter/459435_1_En_4_Fig13_HTML.jpg](images/459435_1_En_4_Chapter/459435_1_En_4_Fig13_HTML.jpg)


    **Figure 4-13** Failed SSIS project deployment


    When you click the Failed link, the message box in Figure [4-13](#459435_1_En_4_Chapter.xhtml#Fig13)
    will display the error message:


    - Please create a master key in the database or open the master key in the session
    before performing this operation. (Microsoft SQL Server, Error: 15581)


    Please find more information about backing up and restoring the SSIS catalog database
    (`SSISDB`) on the SSIS Catalog page in the section titled “Back up, Restore, and
    Move the SSIS Catalog” (`docs.microsoft.com/en-us/sql/integration-services/service/ssis-catalog`).
    I blogged about this scenario and the post includes a script one can use to restore
    `SSISDB`. You can find my post titled “Deploying SSIS Projects to a Restored SSIS
    Catalog” at `andyleonard.blog/2017/07/29/deploying-ssis-projects-to-a-restored-ssis-catalog-ssisdb`.
    The script I use is the following:'
