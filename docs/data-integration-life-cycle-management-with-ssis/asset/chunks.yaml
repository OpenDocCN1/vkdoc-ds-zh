    ### 执行创建目标项目的 SSIS 包


    右键单击 `10_Build_Destination_Databases.dtsx` SSIS 包以创建目标数据库，如图 10-33 所示。


    ![../images/459435_1_En_10_Chapter/459435_1_En_10_Fig33_HTML.jpg](img/459435_1_En_10_Fig33_HTML.jpg)


