    点击 `Yes` 按钮继续。


    当 `0_00_BuildConnections.biml` 和 `0_30_BuildDestinationTablesMain.biml` 文件执行时，它们会创建名为
    `AdventureWorks2014_Stage` 的项目连接管理器和名为 `30_Build_Destination_Tables.dtsx` 的 SSIS
    包。

