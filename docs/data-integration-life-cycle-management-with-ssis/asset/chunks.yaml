    The Extract Compressed (Zipped) Folders dialog displays as shown in Figure [10-15](#459435_1_En_10_Chapter.xhtml#Fig15).


    ![../images/459435_1_En_10_Chapter/459435_1_En_10_Fig15_HTML.jpg](images/459435_1_En_10_Chapter/459435_1_En_10_Fig15_HTML.jpg)


    Figure 10-15


    Choosing a folder for the extracted files


    Click the Extract button to extract the compressed files.


    After the contents of the zip file have been extracted, browse to the folder and
    open the `BimlExpressMetadataFramework.sln` file, as shown in Figure [10-16](#459435_1_En_10_Chapter.xhtml#Fig16).


    ![../images/459435_1_En_10_Chapter/459435_1_En_10_Fig16_HTML.jpg](images/459435_1_En_10_Chapter/459435_1_En_10_Fig16_HTML.jpg)


    Figure 10-16


    Opening the BimlExpressMetadataFramework.sln file


    ### Following the README File Instructions


    At the time of this writing, the README file included with the BimlExpressMetadataFramework
    project reads as follows:


    ```

    BimlExpressMetadataFramework Notes

    0\. Download and install BimlExpress (https://varigence.com/BimlExpress)

    1\. Restore the BimlMetadata database.

    2\. Update the connection string in params.biml to aim it at your BimlMetadata
    database.

    3\. Update connection strings in the di.Connections table aim them at your AdventureWorks2014
    database.

    4\. In Solution Explorer, multi-select the following Biml files in the Miscellaneous
    virtual folder to create the destination Database:

    - 0_00_BuildConnections.biml

    - 0_10_BuildDestinationDatabaseMain.biml

    4a. Right-click in Solution Explorer (or dropdown the BimlExpress menu) and click
    Generate SSIS Packages.

    5\. In Solution Explorer, multi-select the following Biml files in the Miscellaneous
    virtual folder to create the destination Schemas:

    - 0_00_BuildConnections.biml

    - 0_20_BuildDestinationSchemasMain.biml

    5a. Right-click in Solution Explorer (or dropdown the BimlExpress menu) and click
    Generate SSIS Packages.

    6\. In Solution Explorer, multi-select the following Biml files in the Miscellaneous
    virtual folder to create the destination Tables:

    - 0_00_BuildConnections.biml

    - 0_30_BuildDestinationTablesMain.biml

    6a. Right-click in Solution Explorer (or dropdown the BimlExpress menu) and click
    Generate SSIS Packages.

    7\. Execute the packages:

    - 10_Build_Destination_Databases.dtsx

    - 20_Build_Destination_Schemas.dtsx

    - 30_Build_Destination_Tables.dtsx

    8\. Delete all Project Connection Managers and Packages.

    9\. In Solution Explorer, multi-select the following Biml files in the Miscellaneous
    virtual folder to create the SSIS Packages:

    - 0_00_BuildConnections.biml

    - 0_10_BuildDestinationDatabaseMain.biml

    - 0_20_BuildDestinationSchemasMain.biml

    - 0_30_BuildDestinationTablesMain.biml

    - 1_99_Main.biml

    9a. Right-click in Solution Explorer (or dropdown the BimlExpress menu) and click
    Generate SSIS Packages.

    ```


    We have completed Step 0 already.'
  trans: "\n# 下载并安装 BimlExpress\n\n第一步是从 varigence.com 下载 BimlExpress，如图 10-2 所示。\n\
    \n![../images/459435_1_En_10_Chapter/459435_1_En_10_Fig2_HTML.jpg](img/459435_1_En_10_Fig2_HTML.jpg)\n\
    \n图 10-2\n\n下载 BimlExpress\n\n下载完成后，执行 `.vsix` 文件来安装 BimlExpress，如图 10-3 所示。\n\
    \n![../images/459435_1_En_10_Chapter/459435_1_En_10_Fig3_HTML.jpg](img/459435_1_En_10_Fig3_HTML.jpg)\n\
    \n图 10-3\n\n安装 BimlExpress\n\n接受许可协议，如图 10-4 所示。\n\n![../images/459435_1_En_10_Chapter/459435_1_En_10_Fig4_HTML.jpg](img/459435_1_En_10_Fig4_HTML.jpg)\n\
    \n图 10-4\n\n接受许可协议\n\n点击“安装”按钮来安装 BimlExpress。\n\n安装完成后，VSIX 安装程序会显示一条类似于图 10-5\
    \ 所示的通知。\n\n![../images/459435_1_En_10_Chapter/459435_1_En_10_Fig5_HTML.jpg](img/459435_1_En_10_Fig5_HTML.jpg)\n\
    \n图 10-5\n\nBimlExpress 安装完成\n\n点击“关闭”按钮并打开 SQL Server Data Tools (SSDT)。\n\n\
    点击“工具” ➤ “扩展和更新”，如图 10-6 所示。\n\n![../images/459435_1_En_10_Chapter/459435_1_En_10_Fig6_HTML.jpg](img/459435_1_En_10_Fig6_HTML.jpg)\n\
    \n图 10-6\n\n打开扩展和更新\n\n“扩展和更新”对话框用于管理 BimlExpress 以及其他 SSDT 插件，如图 10-7 所示。\n\n\
    ![../images/459435_1_En_10_Chapter/459435_1_En_10_Fig7_HTML.jpg](img/459435_1_En_10_Fig7_HTML.jpg)\n\
    \n图 10-7\n\n“扩展和更新”对话框\n\n如果你看到图 10-8 中所示的 BimlExpress 菜单项，则表示 BimlExpress 已安装并启用。\n\
    \n![../images/459435_1_En_10_Chapter/459435_1_En_10_Fig8_HTML.jpg](img/459435_1_En_10_Fig8_HTML.jpg)\n\
    \n图 10-8\n\nBimlExpress 已安装并启用\n\n## 下载 BimlExpress 元数据框架\n\n接下来，我们从 `dilmsuite.com/biml-express-metadata-framework`\
    \ 下载 BimlExpress 元数据框架代码，如图 10-9 所示。\n\n![../images/459435_1_En_10_Chapter/459435_1_En_10_Fig9_HTML.jpg](img/459435_1_En_10_Fig9_HTML.jpg)\n\
    \n图 10-9\n\n下载 BimlExpress 元数据框架\n\nBimlExpress 元数据框架文件是一个文本文件，名为 `BimlExpressMetadataFramewor.renametozip.txt`，如图\
    \ 10-10 所示。\n\n![../images/459435_1_En_10_Chapter/459435_1_En_10_Fig10_HTML.jpg](img/459435_1_En_10_Fig10_HTML.jpg)\n\
    \n图 10-10\n\nBimlExpress 元数据框架文件\n\n下载文件后，将其重命名，如图 10-11 所示。\n\n![../images/459435_1_En_10_Chapter/459435_1_En_10_Fig11_HTML.jpg](img/459435_1_En_10_Fig11_HTML.jpg)\n\
    \n图 10-11\n\n准备重命名 Biml Express 元数据框架下载文件\n\n将文件扩展名更改为“zip”将触发图 10-12 所示的警告。\n\
    \n![../images/459435_1_En_10_Chapter/459435_1_En_10_Fig12_HTML.jpg](img/459435_1_En_10_Fig12_HTML.jpg)\n\
    \n图 10-12\n\n关于重命名文件并更改扩展名的警告\n\n重命名后，Biml Express 元数据框架下载文件如图 10-13 所示。\n\n![../images/459435_1_En_10_Chapter/459435_1_En_10_Fig13_HTML.jpg](img/459435_1_En_10_Fig13_HTML.jpg)\n\
    \n图 10-13\n\n重命名后的 Biml Express 元数据框架下载文件\n\n右键单击 Biml Express 元数据框架文件，然后点击“全部提取”，如图\
    \ 10-14 所示。\n\n![../images/459435_1_En_10_Chapter/459435_1_En_10_Fig14_HTML.jpg](img/459435_1_En_10_Fig14_HTML.jpg)\n\
    \n图 10-14\n\n准备提取 Biml Express 元数据框架文件\n\n“提取压缩 (Zipped) 文件夹”对话框显示如图 10-15 所示。\n\
    \n![../images/459435_1_En_10_Chapter/459435_1_En_10_Fig15_HTML.jpg](img/459435_1_En_10_Fig15_HTML.jpg)\n\
    \n图 10-15\n\n为提取的文件选择文件夹\n\n点击“提取”按钮来解压压缩文件。\n\n解压 zip 文件的内容后，浏览到该文件夹并打开 `BimlExpressMetadataFramework.sln`\
    \ 文件，如图 10-16 所示。\n\n![../images/459435_1_En_10_Chapter/459435_1_En_10_Fig16_HTML.jpg](img/459435_1_En_10_Fig16_HTML.jpg)\n\
    \n图 10-16\n\n打开 `BimlExpressMetadataFramework.sln` 文件\n\n## 遵循 README 文件中的说明\n\
    \n在撰写本文时，BimlExpressMetadataFramework 项目附带的 README 文件内容如下：\n\n```\nBimlExpressMetadataFramework\
    \ 说明\n0. 下载并安装 BimlExpress (https://varigence.com/BimlExpress)\n1. 还原 BimlMetadata\
    \ 数据库。\n2. 更新 params.biml 中的连接字符串，使其指向你的 BimlMetadata 数据库。\n3. 更新 di.Connections\
    \ 表中的连接字符串，使其指向你的 AdventureWorks2014 数据库。\n4. 在解决方案资源管理器中，多选“杂项”虚拟文件夹中的以下 Biml\
    \ 文件以创建目标数据库：\n   - 0_00_BuildConnections.biml\n   - 0_10_BuildDestinationDatabaseMain.biml\n\
    4a. 在解决方案资源管理器中右键单击（或展开 BimlExpress 菜单），然后点击“生成 SSIS 包”。\n5. 在解决方案资源管理器中，多选“杂项”虚拟文件夹中的以下\
    \ Biml 文件以创建目标架构：\n   - 0_00_BuildConnections.biml\n   - 0_20_BuildDestinationSchemasMain.biml\n\
    5a. 在解决方案资源管理器中右键单击（或展开 BimlExpress 菜单），然后点击“生成 SSIS 包”。\n6. 在解决方案资源管理器中，多选“杂项”虚拟文件夹中的以下\
    \ Biml 文件以创建目标表：\n   - 0_00_BuildConnections.biml\n   - 0_30_BuildDestinationTablesMain.biml\n\
    6a. 在解决方案资源管理器中右键单击（或展开 BimlExpress 菜单），然后点击“生成 SSIS 包”。\n7. 执行以下包：\n   - 10_Build_Destination_Databases.dtsx\n\
    \   - 20_Build_Destination_Schemas.dtsx\n   - 30_Build_Destination_Tables.dtsx\n\
    8. 删除所有项目连接管理器和包。\n9. 在解决方案资源管理器中，多选“杂项”虚拟文件夹中的以下 Biml 文件以创建 SSIS 包：\n   - 0_00_BuildConnections.biml\n\
    \   - 0_10_BuildDestinationDatabaseMain.biml\n   - 0_20_BuildDestinationSchemasMain.biml\n\
    \   - 0_30_BuildDestinationTablesMain.biml\n   - 1_99_Main.biml\n9a. 在解决方案资源管理器中右键单击（或展开\
    \ BimlExpress 菜单），然后点击“生成 SSIS 包”。\n```\n\n我们已经完成了第 0 步。\n"
- fmt: '# Restoring the BimlMetadata Database


    In SSMS Object Explorer, right-click the `Databases` node and click `Restore Database`,
    as shown in Figure [10-17](#459435_1_En_10_Chapter.xhtml#Fig17).


    ![../images/459435_1_En_10_Chapter/459435_1_En_10_Fig17_HTML.jpg](images/459435_1_En_10_Chapter/459435_1_En_10_Fig17_HTML.jpg)


    Figure 10-17: Preparing to restore the BimlMetadata database


    Select the `Device` option for Source and click the ellipsis to select the backup
    file. Navigate to the file system folder you extracted the `BimlExpressMetadataFramework.zip`
    file from and select the BimlMetadata database backup file, as shown in Figure
    [10-18](#459435_1_En_10_Chapter.xhtml#Fig18).


    ![../images/459435_1_En_10_Chapter/459435_1_En_10_Fig18_HTML.jpg](images/459435_1_En_10_Chapter/459435_1_En_10_Fig18_HTML.jpg)


    Figure 10-18: Selecting the BimlMetadata database backup file


    Click the `OK` button to select the BimlMetadata database backup file and return
    to the `Restore Database` dialog, as shown in Figure [10-19](#459435_1_En_10_Chapter.xhtml#Fig19).


    ![../images/459435_1_En_10_Chapter/459435_1_En_10_Fig19_HTML.jpg](images/459435_1_En_10_Chapter/459435_1_En_10_Fig19_HTML.jpg)


    Figure 10-19: BimlMetadata backup file selected


    Click the `Files` page and check the “Relocate all files to folder” checkbox.
    Navigate to the `Data` and `Log` file folders, and double-check that the “Restore
    As” paths match your selections for `Data` and `Log` file folders, as shown in
    Figure [10-20](#459435_1_En_10_Chapter.xhtml#Fig20).


    ![../images/459435_1_En_10_Chapter/459435_1_En_10_Fig20_HTML.jpg](images/459435_1_En_10_Chapter/459435_1_En_10_Fig20_HTML.jpg)


    Figure 10-20: Configuring restore file locations


    On the `Options` page, check the “Overwrite the existing database (WITH REPLACE)”
    checkbox, as shown in Figure [10-21](#459435_1_En_10_Chapter.xhtml#Fig21).


    ![../images/459435_1_En_10_Chapter/459435_1_En_10_Fig21_HTML.jpg](images/459435_1_En_10_Chapter/459435_1_En_10_Fig21_HTML.jpg)


    Figure 10-21: Configuring the restore to overwrite the existing database


    Click the `OK` button to begin the `Database Restore` operation.


    If all goes as planned, you should see the message box shown in Figure [10-22](#459435_1_En_10_Chapter.xhtml#Fig22).


    ![../images/459435_1_En_10_Chapter/459435_1_En_10_Fig22_HTML.jpg](images/459435_1_En_10_Chapter/459435_1_En_10_Fig22_HTML.jpg)


    Figure 10-22: Successful restore!


    Refresh Object Explorer. You should now see the `BimlMetadata` database listed,
    as shown in Figure [10-23](#459435_1_En_10_Chapter.xhtml#Fig23).


    ![../images/459435_1_En_10_Chapter/459435_1_En_10_Fig23_HTML.jpg](images/459435_1_En_10_Chapter/459435_1_En_10_Fig23_HTML.jpg)


    Figure 10-23: The BimlMetadata database


    If you do not have a copy of the `AdventureWorks2014` sample database, search
    for a download of the Microsoft sample database, download it, and restore or otherwise
    build it. At the time of this writing, you may obtain a database backup file of
    `AdventureWorks2014` at `msftdbprodsamples.codeplex.com/downloads/get/880661`,
    but Microsoft plans to shut down CodePlex and migrate the code to GitHub.


    # Updating the Connection String Variable Value in the Params.biml File


    The next step in the README file is to update the connection string in the `params.biml`
    file to aim it at your `BimlMetadata` database, as shown in Figure [10-24](#459435_1_En_10_Chapter.xhtml#Fig24).


    ![../images/459435_1_En_10_Chapter/459435_1_En_10_Fig24_HTML.jpg](images/459435_1_En_10_Chapter/459435_1_En_10_Fig24_HTML.jpg)


    Figure 10-24: Updating the BimlMetadata connection string in `Params.biml`


    # Updating the di.Connections Table


    The next step in the README file is to update connection strings in the `di.Connections`
    table to aim them at your `AdventureWorks2014` database, as shown in Figure [10-25](#459435_1_En_10_Chapter.xhtml#Fig25).


    ![../images/459435_1_En_10_Chapter/459435_1_En_10_Fig25_HTML.jpg](images/459435_1_En_10_Chapter/459435_1_En_10_Fig25_HTML.jpg)


    Figure 10-25: Updating the Adventworks2014 connection strings in the `di.Connections`
    table


    # Generating the Destination Database


    In the `BimlExpressMetadataFramework` project, multi-select the `0_00_BuildConnections.biml`
    and `0_10_BuildDestinationDatabaseMain.biml` files. Right-click and click `Generate
    SSIS Packages`, as shown in Figure [10-26](#459435_1_En_10_Chapter.xhtml#Fig26).


    ![../images/459435_1_En_10_Chapter/459435_1_En_10_Fig26_HTML.jpg](images/459435_1_En_10_Chapter/459435_1_En_10_Fig26_HTML.jpg)


    Figure 10-26: Building the destination database SSIS package


    When the `0_00_BuildConnections.biml` and `0_10_BuildDestinationDatabaseMain.biml`
    files execute, they create the project connection manager named `__master__AdventureWorks2014_Stage`
    and the SSIS package named `10_Build_Destination_Databases.dtsx`, as shown in
    Figure [10-27](#459435_1_En_10_Chapter.xhtml#Fig27).


    ![../images/459435_1_En_10_Chapter/459435_1_En_10_Fig27_HTML.jpg](images/459435_1_En_10_Chapter/459435_1_En_10_Fig27_HTML.jpg)


    Figure 10-27: Creating an SSIS package that builds the target database


    # Generating the Destination Schemas


    In the `BimlExpressMetadataFramework` project, multi-select the `0_00_BuildConnections.biml`
    and `0_20_BuildDestinationSchemasMain.biml` files. Right-click and click `Generate
    SSIS Packages`, as shown in Figure [10-28](#459435_1_En_10_Chapter.xhtml#Fig28).


    ![../images/459435_1_En_10_Chapter/459435_1_En_10_Fig28_HTML.jpg](images/459435_1_En_10_Chapter/459435_1_En_10_Fig28_HTML.jpg)


    Figure 10-28: Building the destination schemas SSIS package


    When the `0_00_BuildConnections.biml` and `0_20_BuildDestinationSchemasMain.biml`
    files execute, they create the project connection manager named `AdventureWorks2014_Stage`
    and an SSIS package named `20_Build_Destination_Schemas.dtsx`, as shown in Figure
    [10-29](#459435_1_En_10_Chapter.xhtml#Fig29).


    ![../images/459435_1_En_10_Chapter/459435_1_En_10_Fig29_HTML.jpg](images/459435_1_En_10_Chapter/459435_1_En_10_Fig29_HTML.jpg)


    Figure 10-29: Creating an SSIS package that builds the destination schemas


    # Generating the Destination Tables


    In the `BimlExpressMetadataFramework` project, multi-select the `0_00_BuildConnections.biml`
    and `0_30_BuildDestinationTablesMain.biml` files. Right-click and click `Generate
    SSIS Packages`, as shown in Figure [10-30](#459435_1_En_10_Chapter.xhtml#Fig30).


    ![../images/459435_1_En_10_Chapter/459435_1_En_10_Fig30_HTML.jpg](images/459435_1_En_10_Chapter/459435_1_En_10_Fig30_HTML.jpg)


    Figure 10-30: Building the destination tables SSIS package


    The `AdventureWorks2014_Stage` project connection manager is regenerated by the
    `0_30_BuildDestinationTablesMain.biml` file. The `Confirm Overwritten Items` dialog
    displays as shown in Figure [10-31](#459435_1_En_10_Chapter.xhtml#Fig31).


    ![../images/459435_1_En_10_Chapter/459435_1_En_10_Fig31_HTML.jpg](images/459435_1_En_10_Chapter/459435_1_En_10_Fig31_HTML.jpg)


    Figure 10-31: Confirm Overwritten Items dialog


    Click the `Commit` button to proceed.


    When the `0_30_BuildDestinationTablesMain.biml` file executes and overwrites the
    project connection manager, it also overwrites the file named `AdventureWorks2014_Stage.conmgr`,
    causing a reload operation, as shown in Figure [10-32](#459435_1_En_10_Chapter.xhtml#Fig32).


    ![../images/459435_1_En_10_Chapter/459435_1_En_10_Fig32_HTML.jpg](images/459435_1_En_10_Chapter/459435_1_En_10_Fig32_HTML.jpg)


    Figure 10-32: Reloading the overwritten `AdventureWorks2014_Stage` connection
    manager file


    Click the `Yes` button to proceed.


    When the `0_00_BuildConnections.biml` and `0_30_BuildDestinationTablesMain.biml`
    files execute, they create the project connection manager named `AdventureWorks2014_Stage`
    and an SSIS package named `30_Build_Destination_Tables.dtsx`.'
