  trans: "\n### SSIS 是一款企业级数据集成引擎\n\nSSIS 旨在将数据从一个位置迁移到另一个位置，这正是数据集成的本质。数据集成可以包括数据重塑、清理和转换；但其核心仍是将数据重新定位。`SSIS\
    \ 数据流任务` 在推出时具有革命性意义。以我拙见，它至今仍是一项非常精巧的技术。其管道架构提供了实现企业级规模所需调优的大部分控制杆。\n\nSSIS 是满足*所有*数据集成需求的完美引擎吗？并非如此。但针对大多数数据集成需求，它都是一种极其灵活的解决方案。\n\
    \n我曾多次用 SSIS 完成过那些看似“不可能完成的任务”。多年前，我甚至与一位非常聪明、在互联网上颇具名气的软件开发人员发生过线上争论，他写了一篇文章列举\
    \ SSIS 的各种问题。我告诉这位开发者，我教人们使用 SSIS，而我的所有学生都知道如何解决他文章中列出的几乎所有问题。\n\n> *最近有人问我：“微软什么时候才能推出企业级数据集成引擎？”我的回答是：“2005\
    \ 年。”*\n>\n> – 安迪·伦纳德\n\n### SSIS 难以学习\n\n我是怎么知道的？十多年来，我（和其他人）一直以教人们如何使用 SSIS\
    \ 为生。\n\n所有软件平台都有“死角”——即该语言不擅长处理的怪癖和边缘情况。SSIS 大约有 30 个这样的死角。我这样向学生描述数据流任务：“SSIS\
    \ 希望你去*思考*数据流，而像数据流一样思考是很困难的。”\n\n“SSIS 希望你去像数据流一样思考。”\n\n### 生命周期管理\n\n即使在撰写本文时，SSIS\
    \ 在企业生命周期中的管理仍然很困难。典型的例子是比较 SSIS 包。SSIS 基于 XML。XML 是一种自描述的数据格式，它对顺序的尊重程度低于传统数据存储。例如，以下\
    \ XML 片段是等效的：\n\n```\nData Integration Lifecycle Management\nAndy Leonard\n\n\
    Andy Leonard\nData Integration Lifecycle Management\n```\n\n你看到这个例子可能会打趣说：“但是安迪，我一眼就能看出这些数据是等效的。”你说得对；检查五行数据非常简单。想象一下检查五百行\
    \ XML，其中的标签和属性顺序不同，你就能开始理解比较 XML 数据的复杂性了。\n\nXML 本身并不坏，也没有错。正是 XML 的半结构化特性使得 SSIS\
    \ 难以进行比较。\n\n### 解决方案与致谢\n\n本书其余部分将重点介绍解决方案。除 `BimlExpress Metadata Framework`\
    \ 之外，本书中包含的解决方案均由肯特·布拉德肖、凯文·哈泽德和我本人开发。Varigence 公司的斯科特·库里及其团队构建了商业智能标记语言（Biml），并教会了我们如何编写\
    \ Biml。斯科特及其团队教给我们的一些内容被融入了 `BimlExpress Metadata Framework`。\n\n更准确地说，肯特、凯文和我都是从经验以及他人那里学习到现有知识的。从真正意义上讲，我们中没有谁是*自学成才*的。相反，我们是*由社区共同教导而成*的。\n\
    \n其中一些解决方案仅仅是使用微软随 SSIS 一起提供的“内置”技术的方法。一些是实践最佳做法。一些是手动的，另一些则是自动化的。一些是供应商提供的免费工具和实用程序，一些是\
    \ Enterprise Data & Analytics（`entdna.com`）、Tudor Data Solutions（`tudords.com`）和\
    \ DevJourney（`devjourney.com`）团队开发的免费实用程序和工具；其中许多是 DILM Suite（`dilmsuite.com`）的一部分。BimlExpress\
    \ 是来自 Varigence（`varigence.com`）的第三方产品。另外，`SSIS Framework Community Edition` 和\
    \ `BimlExpress Metadata Framework` 是某些付费商业解决方案的免费版本，Enterprise Data & Analytics\
    \ 将其作为咨询服务的一部分进行销售。\n\n我们是否掌握了所有答案？天哪，当然没有！我们只掌握了一些。像你一样，我们每天都在学习新东西。本书所载内容就是我们目前所知道的一部分。\n\
    \n# 2. SSIS\n\n本书并非旨在教你 SSIS。如果你阅读本书并实践其中的示例，你可能会对 SSIS 有更多了解。这是我的希望，但本书的目标并不是教会你\
    \ SSIS。我的目标是教会你如何管理企业中的 SSIS。如果你希望学习 SSIS，我推荐初学者阅读 *SQL Server Central 上的 Integration\
    \ Services 阶梯教程*（`sqlservercentral.com/stairway/72494/`），进阶学习者可阅读 *SQL Server\
    \ Integration Services 设计模式*（`amazon.com/Server-Integration-Services-Design-Patterns/dp/1484200837`）。\n\
    \n通过示例学习是最好的方式。在本章中，你将构建一个用于演示目的的 SSIS 项目。该 SSIS 项目将包含一个 SSIS 包、一个连接管理器、变量、项目参数和包参数。你将在本书后续章节中持续使用这个名为\
    \ `DILMSample` 的 SSIS 项目。该 SSIS 项目在 SQL Server Data Tools（`SSDT`）中构建。请参阅附录 A，获取你将在本书中使用的工具和实用程序的链接。\n\
    \n我将讨论数据集成检测和消息传递，以便在 SSIS 包执行期间输出日志消息。这些消息有助于对执行失败进行故障排除的人员，并输出重要的数据集成检测元数据。\n\
    \n## 演示示例\n\n打开 `SSDT` 并创建一个名为 `DILMSample` 的新 SSIS 项目。当 `SSDT` 创建新 SSIS 项目时，它会加载一个默认的\
    \ SSIS 项目。默认的 SSIS 项目包括：\n\n*   项目参数，存储在 `Project.params` 文件中\n*   用于项目级连接管理器的虚拟文件夹\n\
    *   用于包部件的虚拟文件夹\n    *   用于控制流包部件的虚拟文件夹\n*   用于杂项项目的虚拟文件夹\n*   一个名为 `Package.dtsx`\
    \ 的默认（空）SSIS 包\n\n如图 2-1 所示，将 `Package.dtsx` 重命名为 `SimplePackage.dtsx`。\n\n![../images/459435_1_En_2_Chapter/459435_1_En_2_Fig1_HTML.jpg](img/459435_1_En_2_Fig1_HTML.jpg)\n\
    \n**图 2-1** DILMSample SSIS 项目\n\n重命名包表明了意图；而保留默认包名则显得懒惰。\n\n## 添加包参数\n\n由于我们计划使用此项目和包来演示生命周期管理，让我们添加一些参数。首先，单击\
    \ `SimplePackage.dtsx` 包上的“参数”选项卡。添加两个包参数，其设置如表 2-1 所示。\n\n表 2-1 包参数设置\n\n完成后，你的“参数”选项卡应类似于图\
    \ 2-2 所示。\n\n![../images/459435_1_En_2_Chapter/459435_1_En_2_Fig2_HTML.jpg](img/459435_1_En_2_Fig2_HTML.jpg)\n\
    \n**图 2-2** 包参数\n\n你将这些演示参数添加在包作用域（Scope）。*作用域* 是软件开发*和*生命周期管理中的一个重要概念。DevOps\
    \ 中的“Dev”部分侧重于构建运维团队易于管理的代码。作用域如何帮助实现这一点？稍后，你将把参数值*外部化*到 Transact-SQL（`T-SQL`）脚本中。运维人员最终将通过部署和维护\
    \ `T-SQL` 脚本来管理这些外部化的值。DevOps 开发的一个目标是将尽可能多的信息传达给运维人员，尤其是那些不了解 SSIS 工作原理的运维人员。将参数和变量限定在适当的级别（不要更高，也不要更低），可以传达参数值在\
    \ SSIS 应用程序中的使用位置和方式，从而为数据集成项目的“黑箱”带来一些光明。\n"
- fmt: '# Adding Project Parameters


    Open the Project Parameters window by double-clicking the `Project.params` artifact
    in Solution Explorer, shown in Figure [2-3](#459435_1_En_2_Chapter.xhtml#Fig3).


    ![../images/459435_1_En_2_Chapter/459435_1_En_2_Fig3_HTML.jpg](images/459435_1_En_2_Chapter/459435_1_En_2_Fig3_HTML.jpg)


    Figure 2-3


    Project parameters


    Add two project parameters with the settings from Table [2-2](Table_01_0002_0002.xhtml).


    [Table 2-2](Table_01_0002_0002.xhtml)


    Project Parameter Settings


    When completed your Project Parameters tab should appear similar to that shown
    in Figure [2-4](#459435_1_En_2_Chapter.xhtml#Fig4).


    ![../images/459435_1_En_2_Chapter/459435_1_En_2_Fig4_HTML.jpg](images/459435_1_En_2_Chapter/459435_1_En_2_Fig4_HTML.jpg)


    Figure 2-4


    Project parameters


    SSIS parameters work a lot like SSIS variables. There are two important distinctions:


    1. SSIS variable values may be changed at any time, before or during SSIS package
    execution. SSIS parameter values may be changed before SSIS package execution
    but not during SSIS package execution.

    2. SSIS parameter values may be marked as *sensitive* or *required*. Sensitive
    parameters are encrypted. Required parameters must be overridden before SSIS package
    execution.


    ## A Note About Variables, Parameters, and Scope


    Create SSIS variables for values that will change during SSIS package execution,
    such as variables used in Foreach Loop container assignments.


    Create package-scope parameters for values used in a single SSIS package. Package-scope
    parameter values cannot change during SSIS package execution. Create project-scope
    parameters for values that are shared across all (or several) SSIS packages in
    the SSIS project.


    Save and close the Project Parameters window.


    # Adding an Execute SQL Task


    Add an Execute SQL Task to the control flow of the `SimplePackage.dtsx` SSIS package.
    Open the Execute SQL Task Editor and set the `ConnectionType` property to ADO.NET.
    Click the `Connection` property and then click `<new connection="">`. The ADO.Net
    Connection Manager Editor opens. You can configure the ADO.Net connection manager
    to connect to any SQL Server database you desire. You are going to execute a generic
    query that will work with any SQL Server relational database.


    I am using a virtual machine named `vmDemo`. I have an instance of SQL Server
    2016 installed named `vmDemo\Demo`. I configured my ADO.Net connection manager
    to connect to a database named `TestDB`, as shown in Figure [2-5](#459435_1_En_2_Chapter.xhtml#Fig5).


