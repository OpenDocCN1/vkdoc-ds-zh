- fmt: '# Apache Sqoop


    `Sqoop` is a project designed to transfer bulk data between a structured data
    store and HDFS. You can use it to either import data from an external relational
    database to HDFS, Hive, or even HBase, or to export data from your Hadoop cluster
    to a relational database or data warehouse.


    `Sqoop` supports major relational databases such as Oracle, MySQL, and Postgres.
    This project saves you from writing scripts to transfer the data; instead, it
    provides you with performance data transfers features.


    Since the data can grow quickly in our relational database, it’s better to identify
    fast growing tables from the beginning and use `Sqoop` to periodically transfer
    the data in Hadoop so it can be analyzed.


    Then, from the moment the data is in Hadoop, it is combined with other data, and
    at the end, we can use `Sqoop export` to inject the data in our business intelligence
    (BI) analytics tools. You can find out more about `Sqoop` at `sqoop.apache.org`.


    ## Processing Language


    Once the data is in HDFS, we use a different processing language to get the best
    of our raw bulk data.


    ### Yarn: NextGen MapReduce


    `MapReduce` was the main processing framework in the first generation of the Hadoop
    cluster; it basically grouped sibling data together (`Map`) and then aggregated
    the data depending on a specified aggregation operation (`Reduce`).


    In Hadoop 1.0, users had the option of writing `MapReduce` jobs in different languages—Java,
    Python, Pig, Hive, and so on. Whatever the users chose as a language, everyone
    relied on the same processing model: `MapReduce`.


    Since Hadoop 2.0 was released, however, a new architecture has started handling
    data processing above HDFS. Now that `YARN` (Yet Another Resource Negotiator)
    has been implemented, other processing models are allowed and `MapReduce` has
    become just one among them. This means that users now have the ability to use
    a specific processing model depending on their particular use case.


    Figure [1-5](#A978-1-4842-1326-1_1_Chapter.html#Fig5) shows how HDFS, YARN, and
    the processing model are organized.


    ![A978-1-4842-1326-1_1_Fig5_HTML.jpg](A978-1-4842-1326-1_1_Fig5_HTML.jpg)


    Figure 1-5. YARN structure


    We can’t afford to see all the language and processing models; instead we’ll focus
    on Hive and Spark, which cover our use cases, namely long data processing and
    streaming.


    ### Batch Processing with Hive


    When you decide to write your first batch-processing job, you can implement it
    using your preferred programming language, such as Java or Python, but if you
    do, you better be really comfortable with the mapping and reducing design pattern,
    which requires development time and complex coding, and is, sometimes, really
    hard to maintain.


    As an alternative, you can use a higher-level language, such as `Hive`, which
    brings users the simplicity and power of querying data from HDFS in a SQL-like
    way. Whereas you sometimes need 10 lines of code in MapReduce/Java; in Hive, you
    will need just one simple SQL query.


    When you use another language rather than using native `MapReduce`, the main drawback
    is the performance. There is a natural latency between `Hive` and `MapReduce`;
    in addition, the performance of the user SQL query can be really different from
    a query to another one, as is the case in a relational database. You can find
    out more about `Hive` at `hive.apache.org`.


    `Hive` is not a near or real-time processing language; it’s used for batch processing
    such as a long-term processing job with a low priority. To process data as it
    comes, we need to use `Spark Streaming`.


    ### Stream Processing with Spark Streaming


    `Spark Streaming` lets you write a processing job as you would do for batch processing
    in Java, Scala, or Python, but for processing data as you stream it. This can
    be really appropriate when you deal with high throughput data sources such as
    a social network (Twitter), clickstream logs, or web access logs.


    `Spark Streaming` is an extension of Spark, which leverages its distributed data
    processing framework and treats streaming computation as a series of nondeterministic,
    micro-batch computations on small intervals. You can find out more about `Spark
    Streaming` at `spark.apache.org`.


    `Spark Streaming` can get its data from a variety of sources but when it is combined,
    for example, with Apache Kafka, `Spark Streaming` can be the foundation of a strong
    fault-tolerant and high-performance system.


    ### Message-Oriented Middleware with Apache Kafka


    Apache Kafka is a distributed publish-subscribe messaging application written
    by LinkedIn in Scala. `Kafka` is often compared to `Apache ActiveMQ` or `RabbitMQ`,
    but the fundamental difference is that `Kafka` does not implement `JMS` (Java
    Message Service). However, `Kafka` is a persistent messaging and high-throughput
    system, it supports both queue and topic semantics, and it uses `ZooKeeper` to
    form the cluster nodes.


    `Kafka` implements the publish-subscribe enterprise integration pattern and supports
    parallelism and enterprise features for performance and improved fault tolerance.


    Figure [1-6](#A978-1-4842-1326-1_1_Chapter.html#Fig6) gives high-level points
    of view of a typical publish-subscribe architecture with message transmitting
    over a broker, which serves a partitioned topic.


    ![A978-1-4842-1326-1_1_Fig6_HTML.jpg](A978-1-4842-1326-1_1_Fig6_HTML.jpg)


    Figure 1-6. Kafka partitioned topic example


    We’ll use `Kafka` as a pivot point in our architecture mainly to receive data
    and push it into `Spark Streaming`. You can find out more about `Kafka` at `kafka.apache.org`.


    ## Machine Learning


    It’s never too soon to talk about machine learning in our architecture, specifically
    when we are dealing with use cases that have an infinity converging model that
    can be highlighted with a small data sample. We can use a machine learning—specific
    language or leverage the existing layers, such as Spark with `Spark MLlib` (machine
    learning library).


    ### Spark MLlib


    `MLlib` enables machine learning for Spark, it leverages the Spark Direct Acyclic
    Graph (`DAG`) execution engine, and it brings a set of APIs that ease machine
    learning integration for Spark. It’s composed of various algorithms that go from
    basic statistics, logistic regression, k-means clustering, and Gaussian mixtures
    to singular value decomposition and multinomial naive Bayes.


    With `Spark MLlib` out-of-box algorithms, you can simply train your data and build
    prediction models with a few lines of code. You can learn more about `Spark MLlib`
    at `spark.apache.org/mllib`.


    ## NoSQL Stores


    NoSQL datastores are fundamental pieces of the data architecture because they
    can ingest a very large amount of data and provide scalability and resiliency,
    and thus high availability, out of the box and without effort. Couchbase and ElasticSearch
    are the two technologies we are going to focus on; we’ll briefly discuss them
    now, and later on in this book, we’ll see how to use them.


    ### Couchbase


    `Couchbase` is a document-oriented NoSQL database that is easily scalable, provides
    a flexible model, and is consistently high performance. We’ll use `Couchbase`
    as a document datastore, which relies on our relational database.


    Basically, we’ll redirect all reading queries from the front end to `Couchbase`
    to prevent high-reading throughput on the relational database. For more information
    on `Couchbase`, visit `couchbase.com`.'
