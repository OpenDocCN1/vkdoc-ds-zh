    200 4401 \"` `http://www.amazon.com\` `" \"Mozilla/5.0 (Windows; U; Windows NT
    6.1; rv:2.2) Gecko/20110201\" ","@version":"1","@timestamp":"2015-07-26T14:35:00.869Z","file":"/tmp/source/access_log_20150726-163457.log","host":"ea8fceb4f5b0","offset":"0","type":"access_log","clientip":"10.10.10.11","ident":"-","auth":"-","timestamp":"10/Oct/2013:00:04:02
