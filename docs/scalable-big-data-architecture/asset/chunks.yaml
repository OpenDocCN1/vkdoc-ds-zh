    \ 4-9.Grok Apache commong log & combined log pattern\n\n`COMMONAPACHELOG %{IPORHOST:clientip}\
    \ %{USER:ident} %{USER:auth} \\[%{HTTPDATE:timestamp}\\] \"(?:%{WORD:verb} %{NOTSPACE:request}(?:\
    \ HTTP/%{NUMBER:httpversion})?|%{DATA:rawrequest})\" %{NUMBER:response} (?:%{NUMBER:bytes}|-)`\n\
    \n`COMBINEDAPACHELOG %{COMMONAPACHELOG} %{QS:referrer} %{QS:agent}`\n\n*   The\
    \ COMBINEDAPACHELOG pattern relies on two other patterns: COMMONAPACHELOG and\
    \ QS patterns. Indeed, grok comes with a set of predefined patterns that can be\
    \ reused and composed to create multilevel patterns. You can get more information\
    \ on the grok filter on this page:\n*   [`https://www.elastic.co/guide/en/logstash/current/plugins-filters-grok.html`](https://www.elastic.co/guide/en/logstash/current/plugins-filters-grok.html)\n\
    *   And more on the predefined patterns here:\n\n[`https://github.com/elastic/logstash/blob/v1.4.2/patterns/grok-patterns`](https://github.com/elastic/logstash/blob/v1.4.2/patterns/grok-patterns)\n\
    \n*   Output: connection to our Apache Kafka server to put the data there. We\
    \ also used a stdout output with a ruby codec, which is really handy to debug\
    \ the pipeline and see the structure of the event."
  trans: "\n#### 转发器\n\n在下面的章节中，我们将首先安装转发器并进行配置，具体来说是由 Lumberjack（一种安全的传输协议）确保其安全性。\n\
    \n##### 安装\n\n`Logstash-forwarder` 使用 Go 语言编写，可以通过 RPM 包或直接从源码安装。我将采用第二种方式，并遵循以下步骤：\n\
    \n- 从此网址安装 Go：[`http://golang.org/doc/install`](http://golang.org/doc/install)\n\
    - 从 Git 仓库获取源码：`git clone git://github.com/elasticsearch/logstash-forwarder.git`\n\
    - 最后编译它：\n\n```\ncd logstash-forwarder\ngo build -o logstash-forwarder\n```\n\n\
    `Logstash` 的安装非常简单。你只需在以下页面下载合适的软件包：[`https://www.elastic.co/downloads/logstash`](https://www.elastic.co/downloads/logstash)\n\
    \n##### Lumberjack：安全协议\n\n`Forwarder` 将安装在数据源旁边，负责将日志传输并发送到 `Logstash` 处理器。它使用\
    \ lumberjack 协议，该协议是安全的，需要有效的私钥（`.key` 文件）和 SSL 证书（`.crt` 文件）。`Logstash-forwarder`\
    \ 和 `Logstash` 服务器都将使用这些资产来保护数据传输。\n\n要生成有效的 `KEY` 和 `CRT` 文件，请运行清单 4-6 中描述的命令。\n\
    \n清单 4-6. 密钥和证书命令行\n\n```\nopenssl req -x509  -batch -nodes -newkey rsa:2048 -keyout\
    \ lumberjack.key -out lumberjack.crt -subj /CN=localhost\n```\n\n该命令将生成 `lumberjack.key`\
    \ 和 `lumberjack.crt`。这里需要提及一个关于证书的重要事项。生成证书时使用的主题应与将在 `Logstash-forwarder` 文件中使用的主题一致。这里我们使用\
    \ `CN=local host` 生成证书，因此在转发器文件中也需要使用 `localhost`。更多相关信息可在此页面找到：[`https://github.com/elastic/logstash-forwarder#important-tlsssl-certificate-notes`](https://github.com/elastic/logstash-forwarder#important-tlsssl-certificate-notes)\n\
    \n##### 配置文件\n\n`Logstash-forwarder` 的配置由网络和文件子配置组成；清单 4-7 显示了我为示例项目使用的配置。\n\n\
    清单 4-7. Logstash 配置文件，可在以下位置找到：[`https://github.com/bahaaldine/scalable-big-data-architecture/blob/master/chapter4/logstash/forwarder/forwarder.json`](https://github.com/bahaaldine/scalable-big-data-architecture/blob/master/chapter4/logstash/forwarder/forwarder.json)\n\
    \n```\n{\n  \"network\": {\n    \"servers\": [ \"HOST:PORT\" ],\n    \"ssl certificate\"\
    : \"path/to/the/crt/file\",\n    \"ssl key\": \"path/to/the/key/file\",\n    \"\
    ssl ca\": \"path/to/the/crt/file\",\n    \"timeout\": 15\n  },\n  \"files\": [\n\
    \    {\n      \"paths\": [\n        \"path/to/the/log/files\"\n      ],\n    \
    \  \"fields\": { \"type\": \"access_log\" }\n    },\n    {\n      \"paths\": [\
    \ \"-\" ],\n      \"fields\": { \"type\": \"stdin\" }\n    }\n  ]\n}\n```\n\n\
    我们来稍微解释一下这个配置：\n\n- 网络配置主要使用一个目标下游服务器数组，这些服务器将接收日志文件。`servers` 数组中的每一项都是指向服务器的地址，例如\
    \ `localhost:5043`。\n  - 然后 `ssl*` 条目指向我们刚刚生成的 `.key` 和 `.crt` 文件。\n  - 最后一个参数是\
    \ `timeout`，它定义了 `Logstash-forwarder` 在认定连接中断之前等待下游服务器的时间，然后它会尝试连接到服务器数组中的另一个服务器。\n\
    \n- `files` 条目是一个将要传输的数据的数组；在我的示例中，我使用了：\n  - 一个包含本书示例日志文件的目录的绝对路径。字段值设置了事件类型。\n\
    \  - 一个包含 `-` 的特殊路径，这意味着 `Logstash-forwarder` 将转发标准输入内容，换句话说，就是你在命令行提示符下输入的任何内容。这是测试\
    \ `Logstash-forwarder` 和 `Logstash` 服务器之间传输管道的好方法。\n\n还有更多配置文件路径的选项，例如使用通配符，这对于日志轮换非常实用。有关配置的更多信息可以在\
    \ `Logstash-forwarder` 的 Github 仓库中找到：[`https://github.com/elastic/logstash-forwarder`](https://github.com/elastic/logstash-forwarder)\n\
    \n`Logstash` 处理代理也需要一个配置文件。它遵循本章中提到的直接结构。清单 4-8 显示了我为本书使用的配置。\n\n清单 4-8. Logstash\
    \ 处理管道示例，可在以下位置找到：[`https://github.com/bahaaldine/scalable-big-data-architecture/blob/master/chapter4/logstash/processor/forwarder_to_kafka.conf`](https://github.com/bahaaldine/scalable-big-data-architecture/blob/master/chapter4/logstash/processor/forwarder_to_kafka.conf)\n\
    \n```\ninput {\n  lumberjack {\n    port => \"5043\"\n    ssl_certificate => \"\
    path/to/crt/file\"\n    ssl_key => \"path/to/key/file\"\n  }\n}\n\nfilter {\n\
    \  grok {\n    match => {\n      \"message\" => \"%{COMBINEDAPACHELOG}\"\n   \
    \ }\n  }\n}\n\noutput {\n  stdout { codec => rubydebug }\n  kafka {\n    topic_id\
    \ => \"clickstream\"\n  }\n}\n```\n\n此配置文件包含三个部分：\n\n- **输入**：包含 `Logstash` 监听的输入流，用于接收数据。这里我们在\
    \ `localhost:5043` 上监听我们的 `Logstash-forwarder`，并且如前所述，我们使用了 `.key` 和 `.crt` 文件。\n\
    - **过滤器**：获取接收日志中包含的每一行，并将其转换为结构化事件。这里我们使用 `grok` 过滤器，这在处理 Apache HTTP 服务器组合日志时特别有用。`grok`\
    \ 组合日志模式是多个 `grok` 模式的组合。其声明如清单 4-9 所示。\n\n清单 4-9. Grok Apache 通用日志与组合日志模式\n\n\
    ```\nCOMMONAPACHELOG %{IPORHOST:clientip} %{USER:ident} %{USER:auth} \\[%{HTTPDATE:timestamp}\\\
    ] \"(?:%{WORD:verb} %{NOTSPACE:request}(?: HTTP/%{NUMBER:httpversion})?|%{DATA:rawrequest})\"\
    \ %{NUMBER:response} (?:%{NUMBER:bytes}|-)\nCOMBINEDAPACHELOG %{COMMONAPACHELOG}\
    \ %{QS:referrer} %{QS:agent}\n```\n\n- `COMBINEDAPACHELOG` 模式依赖于另外两个模式：`COMMONAPACHELOG`\
    \ 和 `QS` 模式。实际上，`grok` 附带了一组预定义的模式，这些模式可以被重用和组合来创建多级模式。你可以在以下页面获取有关 `grok` 过滤器的更多信息：[`https://www.elastic.co/guide/en/logstash/current/plugins-filters-grok.html`](https://www.elastic.co/guide/en/logstash/current/plugins-filters-grok.html)。预定义模式的更多信息在这里：[`https://github.com/elastic/logstash/blob/v1.4.2/patterns/grok-patterns`](https://github.com/elastic/logstash/blob/v1.4.2/patterns/grok-patterns)\n\
    \n- **输出**：连接到我们的 Apache Kafka 服务器以将数据放入其中。我们还使用了带有 `ruby` 编解码器的 `stdout` 输出，这对于调试管道和查看事件结构非常方便。\n"
- fmt: '#### The Message Broker


    Now we will configure our Apache Kafka cluster. To do so, we’ll create a cluster
    of two brokers that are exposing a `clickstream` topic. A topic is basically the
    channel on which the Logstash processor will publish each event. Then another
    program will subscribe to the topic and consume the message; in the case of our
    architecture this will be done either by Logstash or by Apache Spark.


    Downloading, installing, and configuring Apache Kafka is pretty straightforward
    and requires the following steps:


    Table 4-1.


    |   | `server-1.properties` | `server-2.properties` |

    | --- | --- | --- |

    | `broker.id` | 1 | 2 |

    | `port` | 9092 | 9093 |

    | `log.dirs` | `/tmp/kafka-logs-1` | `/tmp/kafka-logs-2` |


    *   Start by downloading Kafka on the following page:

    *   [http://kafka.apache.org/downloads.html](http://kafka.apache.org/downloads.html)

    *   Extract and access the `config` folder under the installation directory to
    locate the `server.properties` file.

    *   We will duplicate that file and create two separate files for our cluster
    of two brokers. You should have `server-1.properties` and `server-2.properties`.

    *   Modify the properties, as Table [4-1](#A978-1-4842-1326-1_4_Chapter.html#Tab1)
    shows, within the two files so there won’t be any clashes between the two instances.


    The three properties respectively represent the broker identifier, the broker
    listening port, and the broker-logging directory. Both files can be found on the
    following repo:


    [`https://github.com/bahaaldine/scalable-big-data-architecture/tree/master/chapter4/kafka`](https://github.com/bahaaldine/scalable-big-data-architecture/tree/master/chapter4/kafka)


    We are now ready to connect the dots and run the first part of our architecture
    to validate it.


    #### Running the Magic


    We’ll run each block of the shipping part from downstream to upstream; thus, we’ll
    start with Kafka. Kafka relies on Apache Zookeeper especially for managing the
    cluster of brokers; we’ll first launch it from the installation directory with
    the command shown in Listing [4-10](#A978-1-4842-1326-1_4_Chapter.html#FPar10).


    Listing 4-10. Zookeeper start command


    ```

    bin/zookeeper-server-start.sh config/zookeeper.properties

    ```


    This will output a certain amount of log lines but you should have something that
    indicates that the Zookeeper server is running, as shown in Listing [4-11](#A978-1-4842-1326-1_4_Chapter.html#FPar11).


    Listing 4-11. Zookeeper starting logs


    ```

    ...

    [2015-07-11 22:51:39,787] INFO Starting server (org.apache.zookeeper.server.ZooKeeperServerMain)

    ...

    [2015-07-11 22:51:39,865] INFO binding to port 0.0.0.0/0.0.0.0:2181 (org.apache.zookeeper.server.NIOServerCnxnFactory)

    ...

    ```


    Now we’ll start both broker instances, with the commands shown in Listing [4-12](#A978-1-4842-1326-1_4_Chapter.html#FPar12).


    Listing 4-12. Kafka servers start commands


    ```

    bin/kafka-server-start.sh path/to/server-1.properties &

    bin/kafka-server-start.sh path/to/server-2.properties &

    ```


    You should get the lines of logs for the first broker as shown in Listing [4-13](#A978-1-4842-1326-1_4_Chapter.html#FPar13).


    Listing 4-13. First broker startup log lines


    ```

    [2015-07-11 22:59:36,934] INFO [Kafka Server 1], started (kafka.server.KafkaServer)

    [2015-07-11 22:59:37,006] INFO New leader is 1 (kafka.server.ZookeeperLeaderElector$LeaderChangeListener)

    ```


    Listing [4-14](#A978-1-4842-1326-1_4_Chapter.html#FPar14) shows the log lines
    for the second broker.


    Listing 4-14. Second broker startup log lines


    ```

    [2015-07-11 23:00:46,592] INFO [Kafka Server 2], started (kafka.server.KafkaServer)

    ```


    Listing [4-15](#A978-1-4842-1326-1_4_Chapter.html#FPar15) shows how to create
    a topic in our cluster.


    Listing 4-15. Kafka create topic command


    ```

    bin/kafka-topics.sh --create --zookeeper localhost:2181 --replication-factor 3
    --partitions 1 --topic clickstream

    ```


    Why is there a `replication-factor` of 2? Because our cluster will be able to
    tolerate up to one server failure without losing any data.


    To be sure that our shipping part messages are consumable downstream, we’ll run
    a test consumer as shown in Listing [4-16](#A978-1-4842-1326-1_4_Chapter.html#FPar16).


    Listing 4-16. Kafka test consumer command


    ```

    bin/kafka-console-consumer.sh --zookeeper localhost:2181 --from-beginning –topic
    clickstream

    ```


    Now let’s run the Logstash processing agent, from the Logstash agent installation
    directory, as shown in Listing [4-17](#A978-1-4842-1326-1_4_Chapter.html#FPar17).


    Listing 4-17. Logstash processing agent start command


    ```

    /bin/logstash -f /path/to/forwarder_to_kafka.conf

    ```


    which should have the output shown in Listing [4-18](#A978-1-4842-1326-1_4_Chapter.html#FPar18).


    Listing 4-18. Logstash start logs


    ```

    Logstash startup completed

    ```


    Finally, the `logstash-forwarder` is shown in Listing [4-19](#A978-1-4842-1326-1_4_Chapter.html#FPar19).


    Listing 4-19. Logstash-forwarder start command


    ```

    /Applications/logstash-forwarder/logstash-forwarder -config forwarder.json

    ```


    This should produce the output shown in Listing [4-20](#A978-1-4842-1326-1_4_Chapter.html#FPar20).


    Listing 4-20. Logstash-forwarder start logs


    ```

    2015/07/12 00:00:29.085015 Connecting to [::1]:5043 (localhost)

    2015/07/12 00:00:29.246207 Connected to ::1

    ```


    We are ready to generate an access log file and see the stream through our shipping
    pipeline, launch the script, and generate one line as shown in Listing [4-21](#A978-1-4842-1326-1_4_Chapter.html#FPar21).


    Listing 4-21. Log generator start command


    ```

    ./generator.py 1

    ```


    Let’s check the log on the Logstash processor logs, as shown in Listing [4-22](#A978-1-4842-1326-1_4_Chapter.html#FPar22).


    Listing 4-22. Logstash processor logs


    ```

    {

    ```'
