    ```


    As you can see in the example, the document is a JavaScript Object Notation (`JSON`)
    document that has a bunch of fields for the string metadata that describes the
    tweet. But some of the fields are more complex than that; there are arrays that
    are sometimes empty and sometimes containing a collection of data. There is also
    plain text such as the tweet content.


    This should lead you to think about how your data needs to be stored. Putting
    your data on HDFS isn’t enough at all; you will likely have to build a metastructure
    on top of it with technologies that support such complexity in data structures.
    This is something you can achieve with Hive, for example, and is discussed in
    the following sections.


    Social networks are representative of the complexity you get when you deal with
    a large amount of heterogeneous data. Besides the structure, you need to classify
    the data into logical subsets in order to enhance the data processing.


    If you think about the example of sentiment analysis, it makes sense to organize
    the data to enable the location of valuable information in large sets of unstructured
    data. As an example, a common practice is to partition the data into time-based
    partitions so further data processing can easily focus, for example, on a specific
    week among years of data.


    You also have to take care of securing the access to the data, most likely by
    using a Kerberos or another authentication provider. But as the data platform
    attracts new use cases, the first thing to handle with multitenancy is security.
    Then you need to create periodic snapshots of your data to archive it and retrieve
    it in case of failure.


    All these considerations are pretty standard and fortunately offered by most distribution
    vendors. There are out-of-the-box packages that ensure or will help you to implement
    or configure these concepts.'
