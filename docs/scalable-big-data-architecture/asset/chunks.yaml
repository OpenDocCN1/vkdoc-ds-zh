    \ if (rdd.toLocalIterator.nonEmpty) {\n    EsSpark.saveToEs(rdd, \"spark/stats\"\
    )\n  }\n}\n```\n\n如果我们使用清单 5-27 在 Elasticsearch 中检查：\n\n**清单 5-27.** 从 Elasticsearch\
