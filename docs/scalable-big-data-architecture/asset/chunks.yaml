    \ localhost\n    protocol => http\n  }\n}\n```\n\n如您所见，与处理代理相比，配置相当简单，并且附带了一个新的输出，专门用于索引到\
    \ Elasticsearch，具有以下设置：\n\n*   `index`：是我们希望将数据索引到的索引名称；这里的索引是一个模式，将生成一个基于日期的索引名称。\n\
    *   `manage_template`：Logstash 是否应管理索引模板；因为我们之前已经创建了一个，所以不需要。\n*   `host` 和 `protocol`：这些很明显，指向我们的\
    \ Elasticsearch 集群。\n\n#### 运行并索引数据\n\n让我们运行 Logstash 索引器，看看 Elasticsearch 中发生了什么。发出如清单\
    \ 4-27 所示的命令。\n\n**清单 4-27.** Logstash 索引器启动命令\n\n```\nbin/logstash -f /path/to/kafka_to_elasticsearch.conf\n\
    ```\n\n使用 Python 脚本生成单个事件日志文件，像之前一样，您应该看到 ruby 调试编解码器输出事件结构。让我们关注 Elasticsearch，进入“分片分配”（Shard\
    \ Allocation）仪表板，看看我们的点击流索引是否已创建，如图 4-7 所示。\n\n![A978-1-4842-1326-1_4_Fig7_HTML.jpg](img/A978-1-4842-1326-1_4_Fig7_HTML.jpg)\n\
    \n**图 4-7.** 在 Marvel 中创建的新点击流索引\n\n我们现在有了一个名为 `clickstream-2015.07.12` 的索引。显然，日期可能会根据您启动\
    \ Logstash 索引器的时间而变化，但无论如何，您应该有一个索引。\n\n现在让我们进入 Sense，通过发出如清单 4-28 所示的命令来查询数据。\n\
    \n**清单 4-28.** 在 Sense 中查询点击流数据\n\n```\nGET /clickstream-2015.07.12/_search\n\
    {\n  \"query\": {\n    \"match_all\": {}\n  }\n}\n```\n\n您得到的输出应该类似于清单 4-29 所示。\n\
    \n**清单 4-29.** 搜索输出\n\n```\n{\n   \"took\": 1,\n   \"timed_out\": false,\n   \"\
    _shards\": {\n      \"total\": 1,\n      \"successful\": 1,\n      \"failed\"\
    : 0\n   },\n   \"hits\": {\n      \"total\": 1,\n      \"max_score\": 1,\n   \
    \   \"hits\": [\n         {\n            \"_index\": \"clickstream-2015.07.12\"\
    ,\n            \"_type\": \"access_log\",\n            \"_id\": \"AU6CJyWNDD4MpZzVyM-9\"\
    ,\n            \"_score\": 1,\n            \"_source\": {\n               \"message\"\
    : \"10.10.10.13 - - [10/Oct/2013:00:04:55 +0000] \\\"GET /products/product3 HTTP/1.0\\\
    \" 200 3219 \\\"http://www.google.com \\\" \\\"Mozilla/4.0 (compatible; MSIE 7.0;\
    \ Windows NT 6.0)\\\" \",\n               \"@version\": \"1\",\n             \
    \  \"@timestamp\": \"2015-07-12T12:04:39.882Z\",\n               \"file\": \"\
    /Users/bahaaldine/Dropbox/apress/demo/chapter 4 /source/access_log_20150712-140436.log\"\
    ,\n               \"host\": \"MBPdeBaaaldine2\",\n               \"offset\": \"\
    0\",\n               \"type\": \"access_log\",\n               \"clientip\": \"\
    10.10.10.13\",\n               \"ident\": \"-\",\n               \"auth\": \"\
    -\",\n               \"timestamp\": \"10/Oct/2013:00:04:55 +0000\",\n        \
    \       \"verb\": \"GET\",\n               \"request\": \"/products/product3\"\
    ,\n               \"httpversion\": \"1.0\",\n               \"response\": \"200\"\
    ,\n               \"bytes\": \"3219\",\n               \"referrer\": \"\\\"http://www.google.com\
    \ \\\"\",\n               \"agent\": \"\\\"Mozilla/4.0 (compatible; MSIE 7.0;\
    \ Windows NT 6.0)\\\"\"\n            }\n         }\n      ]\n   }\n}\n```\n\n\
    我们可以看到文档已被 Elasticsearch 存储并返回，并且符合我们上游配置的结构。\n"
- fmt: "### Creating a Clickstream Alias\n\nThe last thing that I want to configure\
    \ here in Elasticsearch is an alias. As mentioned, an index will be created based\
    \ on time, say per day, so we will end up with N indices but we might want to\
    \ make searches and analyses on all the indices.\n\nTo group all of the indices\
    \ into a single name, we’ll create an alias that point on all of our indices.\
    \ A client application will just need to know the alias name to access the data.\
    \ Issue the command shown in Listing [4-30](#A978-1-4842-1326-1_4_Chapter.html#FPar30)\
    \ API query in Sense to create our alias.\n\n**Listing 4-30.** Using the clickstream\
    \ alias\n\n```json\nPOST /_aliases\n{\n  \"actions\" : [\n      { \"add\" : {\
    \ \"index\" : \"clickstream-*\", \"alias\" : \"clickstream\" } }\n  ]\n}\n```\n\
    \nNow in Sense, you can issue the command shown in Listing [4-31](#A978-1-4842-1326-1_4_Chapter.html#FPar31)\
    \ and get the exact same result as the previous query.\n\n**Listing 4-31.** Querying\
    \ with clickstream alias\n\n```json\nGET /clickstream/_search\n{\n  \"query\"\
    : {\n    \"match_all\": {}\n  }\n}\n```\n\n## Summary\n\nOur streaming/logging\
    \ architecture is now ready to ingest data and index them into a distributed durable\
    \ datastore, for example, Elasticsearch. In the next chapter we’ll see how to\
    \ use Elasticsearch API to query the data in near-real time, and also will see\
    \ the implementation of the second part of this ingestion architecture: the Spark\
    \ processing part.\n\n# 5. Querying and Analyzing Patterns\n\nThere are different\
    \ ways to step into data visualization, starting with the analytics strategy that\
    \ should allow us to identify patterns in real time in our data, and also to leverage\
    \ the already ingested data by using them in continuous processing. This is what\
    \ we’ll cover in this chapter through the integration of Spark, the analytics\
    \ in Elasticsearch, and finally visualizing the result of our work in Kibana.\n\
    \n## Definining an Analytics Strategy\n\nIn this section we’ll go through two\
    \ different approaches for analyzing our data, whether we want to continuously\
    \ process our data and update the analytics in our document store or make real-time\
    \ queries as the demand comes. We will see at the end that there is no black-and-white\
    \ strategy in a scalable architecture; you will likely end up doing both, but\
    \ you usually start with one of them.\n\n### Continuous Processing\n\nWhat I call\
    \ continuous processing is the ability to extract KPI and metrics from batch of\
    \ data as they come. This is a common use case in a streaming architecture that\
    \ once set up can bring a lot of benefits. The idea here is to rely on a technology,\
    \ which is:\n\n- Distributed\n- Resilient\n- Does the processing in near real\
    \ time\n- Is scalable in term of server and processing\n\nSpark is a good candidate\
    \ to play this role in the architecture; you can basically integrate Spark and\
    \ Kafka to implement continuous batch processing. Indeed, Spark will consume messages\
    \ from Kafka topics in batch intervals and apply processing to the data before\
    \ indexing it into a data store, obviously Elasticsearch:\n\n- The first benefit\
    \ is to save the datastore from doing the processing\n- The second one is to be\
    \ able to have processing layer such as Spark that can scale. You will be able\
    \ to add more Spark Kafka consumer that does different kind of processing over\
    \ time.\n\nThe typical processing done is an aggregation of the batch data such\
    \ as, in our example, number of queries, number of 404 errors, volume of data\
    \ exchange with users over time, and so on. But, eventually, this processing can\
    \ reach the point where we do prediction, on data by using the machine learning\
    \ features of Spark.\n\nOnce processed data are delivered by Kafka, streamed and\
    \ processed by Spark, they should be available for analytics and search. This\
    \ is where Elasticsearch comes into play and will allow the user to access in\
    \ real time to data.\n\n### Real-Time Querying\n\nReal-time querying removes the\
    \ burden of relying on a tradional batch processing architecture such as a Hadoop-oriented\
    \ distribution, which can be heavy to deploy and is not what end users expect.\n\
    \nToday, you typically want the information now, not in five minutes or the next\
    \ day.\n\nThe strategy of real-time querying is efficient depending on the datastore\
    \ you are dealing with. It should also provide a set of API that let the users\
    \ extract essential information from a large set of data at scale.\n\nElasticsearch\
    \ does this: it supports running aggregation queries through the aggregation framework\
    \ to group document or compute document field data in near real time.\n\nWith\
    \ real-time querying and the out-of-the-box aggregation capabilities of Elasticsearch,\
    \ we can have an ingestion pipeline that gets rid of any processing between the\
    \ time that the data have been ingested, to the moment the data are indexed in\
    \ Elasticsearch. In other words, the pipeline can be reduced to draining the data\
    \ from Kafka with Logstash and indexing them into Elasticsearch.\n\nThe idea here\
    \ is to see what you should do in Spark and what you should keep for Elasticsearch.\
    \ We’ll see that implementing simple grouping aggregation could be very handy\
    \ with Elasticsearch.\n\n## Process and Index Data Using Spark\n\nTo ingest the\
    \ data with Spark we first need to implement a Spark streaming agent that will\
    \ consume the data from Kafka and then process and index them in Elasticsearch.\
    \ Let’s then split the ingestion with Spark into two parts: the streamer and the\
    \ indexer.\n\n**Note** that code used in this chapter can be found in the following\
    \ repo: [`https://github.com/bahaaldine/scalable-big-data-architecture/tree/master/chapter5/spark-scala-streamer`](https://github.com/bahaaldine/scalable-big-data-architecture/tree/master/chapter5/spark-scala-streamer)."
  raw: '##### Creating a Clickstream Alias


    The last thing that I want to configure here in Elasticsearch is an alias. As
    mentioned, an index will be created based on time, say per day, so we will end
    up with N indices but we might want to make searches and analyses on all the indices.


    To group all of the indices into a single name, we’ll create an alias that point
    on all of our indices. A client application will just need to know the alias name
    to access the data. Issue the command shown in Listing [4-30](#A978-1-4842-1326-1_4_Chapter.html#FPar30)
    API query in Sense to create our alias.


    Listing 4-30.Using the clickstream alias


    `POST /_aliases`


    `{`


      `"actions" : [`


          `{ "add" : { "index" : "clickstream-*", "alias" : "clickstream" } }`


      `]`


    `}`


    Now in Sense, you can issue the command shown in Listing [4-31](#A978-1-4842-1326-1_4_Chapter.html#FPar31)
    and get the exact same result as the previous query.


    Listing 4-31.Querying with clickstream alias


    `GET /clickstream/_search`


    `{`


      `"query": {`


        `"match_all": {}`


      `}`


    `}`


    ## Summary


    Our streaming/logging architecture is now ready to ingest data and index them
    into a distributed durable datastore, for example, Elasticsearch. In the next
    chapter we’ll see how to use Elasticsearch API to query the data in near-real
    time, and also will see the implementation of the second part of this ingestion
    architecture: the Spark processing part.


    # 5. Querying and Analyzing Patterns


    There are different ways to step into data visualization, starting with the analytics
    strategy that should allow us to identify patterns in real time in our data, and
    also to leverage the already ingested data by using them in continuous processing.
    This is what we’ll cover in this chapter through the integration of Spark, the
    analytics in Elasticsearch, and finally visualizing the result of our work in
    Kibana.


    ## Definining an Analytics Strategy


    In this section we’ll go through two different approaches for analyzing our data,
    whether we want to continuously process our data and update the analytics in our
    document store or make real-time queries as the demand comes. We will see at the
    end that there is no black-and-white strategy in a scalable architecture; you
    will likely end up doing both, but you usually start with one of them.


    ### Continuous Processing


    What I call continuous processing is the ability to extract KPI and metrics from
    batch of data as they come. This is a common use case in a streaming architecture
    that once set up can bring a lot of benefits. The idea here is to rely on a technology,
    which is:


    *   Distributed

    *   Resilient

    *   Does the processing in near real time

    *   Is scalable in term of server and processing


    Spark is a good candidate to play this role in the architecture; you can basically
    integrate Spark and Kafka to implement continuous batch processing. Indeed, Spark
    will consume messages from Kafka topics in batch intervals and apply processing
    to the data before indexing it into a data store, obviously Elasticsearch:


    *   The first benefit is to save the datastore from doing the processing

    *   The second one is to be able to have processing layer such as Spark that can
    scale. You will be able to add more Spark Kafka consumer that does different kind
    of processing over time.


    The typical processing done is an aggregation of the batch data such as, in our
    example, number of queries, number of 404 errors, volume of data exchange with
    users over time, and so on. But, eventually, this processing can reach the point
    where we do prediction, on data by using the machine learning features of Spark.


    Once processed data are delivered by Kafka, streamed and processed by Spark, they
    should be available for analytics and search. This is where Elasticsearch comes
    into play and will allow the user to access in real time to data.


    ### Real-Time Querying


    Real-time querying removes the burden of relying on a tradional batch processing
    architecture such as a Hadoop-oriented distribution, which can be heavy to deploy
    and is not what end users expect.


    Today, you typically want the information now, not in five minutes or the next
    day.


    The strategy of real-time queryring is efficient depending on the datastore you
    are dealing with. It should also provide a set of API that let the users extract
    essential information from a large set of data at scale.


    Elasticsearch does tis: it supports running aggregation queries through the aggregation
    framework to group document or compute document field data in near real time.


    With real-time querying and the out-of-the-box aggregation capabilities of Elasticsearch,
    we can have an ingestion pipeline that gets rid of any processing between the
    time that the data have been ingested, to the moment the data are indexed in Elasticsearch.
    In other words, the pipeline can be reduced to draining the data from Kafka with
    Logstash and indexing them into Elasticsearch.


    The idea here is to see what you should do in Spark and what you should keep for
    Elasticsearch. We’ll see that implementing simple grouping aggregation could be
    very handy with Elasticsearch.


    ## Process and Index Data Using Spark


    To ingest the data with Spark we first need to implement a Spark streaming agent
    that will consume the data from Kafka and then process and index them in Elasticsearch.
    Let’s then split the ingestion with Spark into two parts: the streamer and the
    indexer.


    Note


    that code used in this chapter can be found in the following repo: [`https://github.com/bahaaldine/scalable-big-data-architecture/tree/master/chapter5/spark-scala-streamer`](https://github.com/bahaaldine/scalable-big-data-architecture/tree/master/chapter5/spark-scala-streamer)
    .'
  trans: "\n### 创建点击流别名\n\n我需要在 Elasticsearch 中配置的最后一件事就是别名。如前所述，索引将基于时间创建，例如每天，因此我们最终会得到\
    \ N 个索引，但我们可能希望对所有索引进行搜索和分析。\n\n为了将所有索引归入一个名称，我们将创建一个指向所有索引的别名。客户端应用只需知道别名即可访问数据。在\
    \ Sense 中执行如清单 4-30 所示的 API 查询来创建别名。\n\n**清单 4-30.** 使用 clickstream 别名\n\n```json\n\
    POST /_aliases\n{\n  \"actions\" : [\n      { \"add\" : { \"index\" : \"clickstream-*\"\
    , \"alias\" : \"clickstream\" } }\n  ]\n}\n```\n\n现在，在 Sense 中，你可以执行如清单 4-31 所示的命令，并得到与之前查询完全相同的结果。\n\
    \n**清单 4-31.** 使用 clickstream 别名查询\n\n```json\nGET /clickstream/_search\n{\n \
    \ \"query\": {\n    \"match_all\": {}\n  }\n}\n```\n\n## 总结\n\n我们的流式/日志架构现已准备就绪，可以接收数据并将其索引到分布式持久化数据存储中，例如\
    \ Elasticsearch。在下一章中，我们将看到如何使用 Elasticsearch API 进行近实时查询，并将看到本摄取架构第二部分的实现：Spark\
    \ 处理部分。\n\n# 5. 查询与分析模式\n\n进入数据可视化的方法有很多种，首先要制定分析策略，该策略应能让我们实时识别数据中的模式，同时也能通过持续处理来利用已摄取的数据。这就是本章将要介绍的内容，具体包括如何集成\
    \ Spark、在 Elasticsearch 中进行分析，最终在 Kibana 中可视化我们的工作成果。\n\n## 定义分析策略\n\n在本节中，我们将介绍两种不同的数据分析方法：一种是持续处理数据并更新文档存储中的分析结果，另一种是按需进行实时查询。最后我们会发现，在可扩展的架构中，并没有非黑即白的策略；你很可能最终会两者兼用，但通常是从其中一种开始。\n\
    \n### 持续处理\n\n我所说的持续处理，是指能够随着批次数据的到来，从中提取关键绩效指标和度量值。这是流式架构中的一个常见用例，一旦设置好，可以带来很多好处。这里的思路是依赖一项技术，它需要具备以下特性：\n\
    \n-   分布式\n-   有弹性\n-   能进行近实时处理\n-   在服务器和处理能力方面可扩展\n\nSpark 是在该架构中扮演此角色的绝佳候选者；你基本上可以集成\
    \ Spark 和 Kafka 来实现持续的批处理。实际上，Spark 会按批次间隔从 Kafka 主题中消费消息，并在将数据索引到数据存储（显然是 Elasticsearch）之前对数据应用处理：\n\
    \n-   第一个好处是减轻数据存储的处理负担\n-   第二个好处是能够拥有像 Spark 这样可扩展的处理层。你可以随着时间的推移添加更多执行不同类型处理的\
    \ Spark Kafka 消费者。\n\n典型的处理方式是对批次数据进行聚合，例如在我们的例子中，统计查询次数、404 错误数量、一段时间内与用户的数据交换量等等。但最终，这种处理可以发展到利用\
    \ Spark 的机器学习功能对数据进行预测。\n\n一旦处理后的数据由 Kafka 传递出来，再由 Spark 进行流式处理和处理，它们就应该可用于分析和搜索。这时\
    \ Elasticsearch 就登场了，它允许用户实时访问数据。\n\n### 实时查询\n\n实时查询消除了对传统批处理架构（如 Hadoop 相关发行版）的依赖，这类架构部署起来可能很笨重，并且不是最终用户所期望的。\n\
    \n如今，你通常希望立即获得信息，而不是五分钟或第二天之后。\n\n实时查询策略的效率取决于你使用的数据存储。它还应提供一组 API，让用户能够从大量数据中大规模地提取关键信息。\n\
    \nElasticsearch 做到了这一点：它支持通过聚合框架运行聚合查询，以进行近实时的文档分组或文档字段数据计算。\n\n借助实时查询和 Elasticsearch\
    \ 开箱即用的聚合能力，我们可以构建一个摄取管道，消除从数据被摄取到数据在 Elasticsearch 中被索引这段时间内的所有处理。换句话说，这个管道可以简化为使用\
    \ Logstash 将数据从 Kafka 中排出，并索引到 Elasticsearch 中。\n\n这里的思路是，要判断哪些工作应该由 Spark 处理，哪些应该留给\
    \ Elasticsearch。我们会看到，使用 Elasticsearch 实现简单的分组聚合会非常方便。\n\n## 使用 Spark 处理并索引数据\n\
    \n为了使用 Spark 摄取数据，我们首先需要实现一个 Spark 流式处理代理，它会从 Kafka 消费数据，然后进行处理并索引到 Elasticsearch。接下来，我们将\
    \ Spark 的摄取过程分成两部分：流式处理器和索引器。\n\n**注意**，本章使用的代码可以在以下仓库中找到：[`https://github.com/bahaaldine/scalable-big-data-architecture/tree/master/chapter5/spark-scala-streamer`](https://github.com/bahaaldine/scalable-big-data-architecture/tree/master/chapter5/spark-scala-streamer).\n"
- fmt: "### Preparing the Spark Project\n\nTo implement the streaming agent, we'll\
    \ use Spark Streaming, a reliable, fault-tolerant API that is used to stream data\
    \ from variant data sources. More information can be found at:\n[`https://spark.apache.org/streaming/`](https://spark.apache.org/streaming/)\n\
    \nSo far, we won't structure the data that we receive. The goal here is to set\
    \ up the streaming itself, ingest the stream from Kafka, and be able to print\
    \ it out. I'm used to Eclipse (Mars 4.5) to implement my Java (1.8)/Scala(2.10)\
    \ project. IntelliJ is also a really good IDE and very popular for Scala applications.\n\
    \nThe first thing we need to do is to create a Spark project structure with needed\
    \ dependencies. To do so, we'll use Maven and a Spark archetype that you can easily\
    \ find on Github. In my example, I'll use:\n[`https://github.com/mbonaci/spark-archetype-scala`](https://github.com/mbonaci/spark-archetype-scala)\n\
    \nWith this archetype you can simply generate a Scala project that you can then\
    \ use in Eclipse. Execute the command shown in Listing 5-1.\n\n**Listing 5-1.**\
    \ Spark Scala Archetype generation\n```\nmvn archetype:generate \\\n  -DarchetypeCatalog=https://github.com/mbonaci/spark-archetype-scala/raw/master/archetype-catalog.xml\
    \ \\\n  -DarchetypeRepository=https://github.com/mbonaci/spark-archetype-scala/raw/master\
    \ \\\n  -DgroupId=org.apress.examples \\\n  -DartifactId=spark-scala-streamer\
    \ \\\n  -Dversion=1.0-SNAPSHOT\n```\nNote that the escape character used here\
    \ to break the line should be adapted to the OS; for example, that would be «\
    \ ^ » on Windows.\n\nMaven will prompt and ask for confirmation prior to generating\
    \ the project. Go through those steps and finalize the creation. You should then\
    \ have the directory structure like that shown in Figure 5-1.\n\n![A978-1-4842-1326-1_5_Fig1_HTML.jpg](A978-1-4842-1326-1_5_Fig1_HTML.jpg)\n\
    \n**Figure 5-1.** Spark Scala project directory structure\n\nThis directory structure\
    \ is really important in order for Maven to be able to compile and package your\
    \ application correctly.\n\nFirst thing we are going to do is to understand the\
    \ sample application that Maven has generated for us.\n\n### Understanding a Basic\
    \ Spark Application\n\nThe Spark archetype has the benefit of generating a sample\
    \ application that gives the basic structure of a Spark program. It first starts\
    \ with the configuration of the Spark context, then handles the data processing,\
    \ and sends to an output the result of that processing.\n\nIn the sample program\
    \ (`App.scala` file), the configuration of the `SparkContext` consists of setting\
    \ the Application name that will appear in the cluster metadata and the cluster\
    \ on which we will execute the application, as shown in Listing 5-2.\n\n**Listing\
    \ 5-2.** Spark context configuration\n```\nval conf = new SparkConf()\n  .setAppName(\"\
    The swankiest Spark app ever\")\n  .setMaster(\"local[2]\")\n```\nWe use the special\
    \ value of `local[2]` here, which means that we want to run the application on\
    \ our local machine using a local Spark runtime with two threads. That's really\
    \ convenient for testing purposes and we'll use this method in this book.\n\n\
    Once the configuration is done, we will create a new Spark configuration using\
    \ the configuration shown in Listing 5-3.\n\n**Listing 5-3.** Spark creation\n\
    ```\nval sc = new SparkContext(conf)\n```\nThen the sample program creates a dataset,\
    \ shown in Listing 5-4.\n\n**Listing 5-4.** Spark dataset creation\n```\nval col\
    \ = sc.parallelize(0 to 100 by 5)\n```\nThere are actually two steps in this line\
    \ of code:\n- it first creates a collection holding every five numbers from 0\
    \ to 100\n- Then Spark parallelizes the collection by copying it into a distributed\
    \ dataset. In other words, and depending on the topology of the cluster, Spark\
    \ will operate on this dataset in parallel. This dataset is commonly called a\
    \ Resilient Distributed Data (RDD).\n\nNote that here we don't set the number\
    \ of partitions that we want to split the dataset into because we let Spark take\
    \ care of this, but we could have partitioned our data like that shown in Listing\
    \ 5-5.\n\n**Listing 5-5.** Spark adding partition manually\n```\nval col = sc.parallelize(0\
    \ to 100 by 5, 2)\n```\nFinally, we transform our data using the Spark sample\
    \ function, which produces a new RDD containing a new collection of value, as\
    \ shown in Listing 5-6.\n\n**Listing 5-6.** Spark creating new RDD\n```\nval smp\
    \ = col.sample(true, 4)\n```\nHere we use a number generator seed of four. If\
    \ you want to print out the content of the generated sample, use a mirror map\
    \ function like that shown in Listing 5-7.\n\n**Listing 5-7.** Spark using mirror\
    \ map function\n```\nsmp.map(x => x).collect\n```\nThis will print out something\
    \ like that shown in Listing 5-8.\n\n**Listing 5-8.** Spark processing output\n\
    ```\nArray(0, 0, 0, 0, 0, 5, 5, 5, 5, 10, 10, 15, 15, 15, 15, 15, 20, 20, 20,\
    \ 20, 25, 30, 30, 35, 35, 35, 35, 35, 35, 35, 35, 40, 40, 45, 45, 55, 55, 55,\
    \ 55, 60, 65, 70, 70, 70, 70, 70, 70, 70, 75, 75, 75, 75, 80, 80, 80, 80, 85,\
    \ 85, 90, 90, 100, 100, 100, 100, 100)\n```\nIf you run the sample application\
    \ using the Listing 5-9 command:\n\n**Listing 5-9.** Spark start command\n```\n\
    mvn scala:run -DmainClass=org.apress.examples.App\n```\nthe last part of the code\
    \ (Listing 5-10):\n\n**Listing 5-10.** Spark driver code\n```\nval colCount =\
    \ col.count\nval smpCount = smp.count\nprintln(\"orig count = \" + colCount)\n\
    println(\"sampled count = \" + smpCount)\n```\nwill print out:\n\n**Listing 5-11.**\
    \ Spark driver output\n```\norig count = 21\nsampled count = 78\n```\nThis Spark\
    \ application is called a Spark driver. Obviously, this one is really easy to\
    \ understand and uses a few features, but it gives the general idea of a driver\
    \ structure. What we want to achieve with Spark in our use case is to be able\
    \ to process a large amount of data, in a distributed way, and digest them before\
    \ sending them downstream in the architecture."
  raw: '### Preparing the Spark Project


    To implement the streaming agent, we’ll use Spark Streaming, a reliable, fault-tolerant
    API that is used to stream data from variant data sources. More information can
    be found at:


    [`https://spark.apache.org/streaming/`](https://spark.apache.org/streaming/)


    So far, we won’t structure the data that we receive. The goal here is to set up
    the streaming itself, ingest the stream from Kafka, and be able to print it out.
    I’m used to Eclipse (Mars 4.5) to implement my Java (1.8)/Scala(2.10) project.
    IntelliJ is also a really good IDE and very popular for Scala applications.


    The first thing we need to do is to create a Spark project structure with needed
    dependencies. To do so, we’ll use Maven and a Spark archetype that you can easily
    find on Github. In my example, I’ll use:


    [`https://github.com/mbonaci/spark-archetype-scala`](https://github.com/mbonaci/spark-archetype-scala)


    We this archetype you can simply generate a Scala project that you can then use
    in Eclipse Execute the command shown in Listing [5-1](#A978-1-4842-1326-1_5_Chapter.html#FPar2).


    Listing 5-1.Spark Scala Archetype generation


    `mvn archetype:generate \`


      `-DarchetypeCatalog=` [`https://github.com/mbonaci/spark-archetype-scala/raw/master/archetype-catalog.xml\`](https://github.com/mbonaci/spark-archetype-scala/raw/master/archetype-catalog.xml%5C)


      `-DarchetypeRepository=` [`https://github.com/mbonaci/spark-archetype-scala/raw/master`](https://github.com/mbonaci/spark-archetype-scala/raw/master)
    `\  -DgroupId=org.apress.examples \`


      `-DartifactId=spark-scala-streamer \`


      `-Dversion=1.0-SNAPSHOT`


    Note


    that the escape character used here to break the line should be adapted to the
    OS; for example, that would be « ^ » on windows.


    Maven will prompt and ask for confirmation prior to generating the project. Go
    through those steps and finalize the creation. You should then have the directory
    structure like that shown in Figure [5-1](#A978-1-4842-1326-1_5_Chapter.html#Fig1).


    ![A978-1-4842-1326-1_5_Fig1_HTML.jpg](A978-1-4842-1326-1_5_Fig1_HTML.jpg)


    Figure 5-1.


    Spark Scala project directory structure


    This directory structure is really important in order for Maven to be able to
    compile and package your application correctly.


    First thing we are going to do is to understand the sample application that Maven
    has generated for us.


    ### Understanding a Basic Spark Application


    The Spark archetype has the benefit of generating a sample application that gives
    the basic structure of a Spark program. It first starts with the configuration
    of the Spark context, then handles the data processing, and sends to an output
    the result of that processing.


    In the sample program (App.scala file), the configuration of the SparkContext
    consists of setting the Application name that will appear in the cluster metadata
    and the cluster on which we will execute the application, as shown in Listing
    [5-2](#A978-1-4842-1326-1_5_Chapter.html#FPar4).


    Listing 5-2.Spark context configuration


    `val conf = new SparkConf()`


    `.setAppName("The swankiest Spark app ever")`


    `.setMaster("local[2]")`


    We use the special value of local[2] here, which means that we want to run the
    application on our local machine using a local Spark runtime with two threads.
    That’s really convenient for testing purposes and we’ll use this method in this
    book.


    Once the configuration is done, we will create a new Spark configuration using
    the configuration shown in Listing [5-3](#A978-1-4842-1326-1_5_Chapter.html#FPar5).


    Listing 5-3.Spark creation


    `val sc = new SparkContext(conf)`


    Then the sample program creates a dataset, shown in Listing [5-4](#A978-1-4842-1326-1_5_Chapter.html#FPar6).


    Listing 5-4.Spark dataset creation


    `val col = sc.parallelize(0 to 100 by 5)`


    There are actually two steps in this line of code:


    *   it first creates a collection holding every five numbers from 0 to 100

    *   Then Spark parallelizes the collection by copying it into a distributed dataset.
    In other words, and depending on the topology of the cluster, Spark will operate
    on this dataset in parallel. This dataset is commonly called a Resilient Distributed
    Data (RDD.


    Note that here we don’t set the number of partitions that we want to split the
    dataset into because we let Spark take care of this, but we could have partionned
    our data like that shown in Listing [5-5](#A978-1-4842-1326-1_5_Chapter.html#FPar7).


    Listing 5-5.Spark adding partition manually


    `val col = sc.parallelize(0 to 100 by 5, 2)`


    Finally, we transform our data using the Spark sample function, which produces
    a new RDD containing a new collection of value, as shown in Listing [5-6](#A978-1-4842-1326-1_5_Chapter.html#FPar8).


    Listing 5-6.Spark creating new RDD


    `val smp = col.sample(true, 4)`


    Here we use a number generator seed of four. If you want to print out the content
    of the generated sample, use a mirror map function like that shown in Listing
    [5-7](#A978-1-4842-1326-1_5_Chapter.html#FPar9).


    Listing 5-7.Spark using mirror map function


    `smp.map(x => x).collect`


    This will print out something like that shown in Listing [5-8](#A978-1-4842-1326-1_5_Chapter.html#FPar10).


    Listing 5-8.Spark processing output


    `Array(0, 0, 0, 0, 0, 5, 5, 5, 5, 10, 10, 15, 15, 15, 15, 15, 20, 20, 20, 20,
    25, 30, 30, 35, 35, 35, 35, 35, 35, 35, 35, 40, 40, 45, 45, 55, 55, 55, 55, 60,
    65, 70, 70, 70, 70, 70, 70, 70, 75, 75, 75, 75, 80, 80, 80, 80, 85, 85, 90, 90,
    100, 100, 100, 100, 100)`


    If you run the sample application using the Listing [5-9](#A978-1-4842-1326-1_5_Chapter.html#FPar11)
    command:


    Listing 5-9.Spark start command


    `mvn scala:run -DmainClass=org.apress.examples.App`


    the last part of the code (Listing [5-10](#A978-1-4842-1326-1_5_Chapter.html#FPar12):


    Listing 5-10.Spark driver code


    `val colCount = col.count`


    `val smpCount = smp.count`


    `println("orig count = " + colCount)`


    `println("sampled count = " + smpCount)`


    will print out:


    Listing 5-11.Spark driver output


    `orig count = 21`


    `sampled count = 78`


    This Spark application is called a Spark driver. Obviously, this one is really
    easy to understand and uses a few features, but it gives the general idea of a
    driver structure. What we want to achieve with Spark in our use case is to be
    able to process a large amount of data, in a distributed way, and digest them
    before sending them downstream in the architecture.'
  trans: "\n### 准备 Spark 项目\n\n为了实现流式代理，我们将使用 Spark Streaming，这是一个可靠、容错的 API，用于从各种数据源流式传输数据。更多信息请访问：\n\
    [`https://spark.apache.org/streaming/`](https://spark.apache.org/streaming/)\n\
    \n到目前为止，我们不会对接收到的数据进行结构化处理。我们的目标是建立流式传输本身，从 Kafka 摄取数据流，并能够将其打印出来。我习惯使用 Eclipse\
    \ (Mars 4.5) 来实现我的 Java (1.8)/Scala(2.10) 项目。IntelliJ 也是一款非常优秀的 IDE，在 Scala 应用程序中非常流行。\n\
    \n我们需要做的第一件事是创建一个具有所需依赖项的 Spark 项目结构。为此，我们将使用 Maven 和一个可以在 Github 上轻松找到的 Spark\
    \ 原型。在我的示例中，我将使用：\n[`https://github.com/mbonaci/spark-archetype-scala`](https://github.com/mbonaci/spark-archetype-scala)\n\
    \n使用这个原型，你可以简单地生成一个 Scala 项目，然后就可以在 Eclipse 中使用它。执行清单 5-1 中所示的命令。\n\n**清单 5-1.**\
    \ Spark Scala 原型生成\n```\nmvn archetype:generate \\\n  -DarchetypeCatalog=https://github.com/mbonaci/spark-archetype-scala/raw/master/archetype-catalog.xml\
    \ \\\n  -DarchetypeRepository=https://github.com/mbonaci/spark-archetype-scala/raw/master\
    \ \\\n  -DgroupId=org.apress.examples \\\n  -DartifactId=spark-scala-streamer\
    \ \\\n  -Dversion=1.0-SNAPSHOT\n```\n请注意，此处用于换行的转义字符应根据操作系统进行调整；例如，在 Windows 上应该是«\
    \ ^ »。\n\nMaven 会提示并要求确认，然后才生成项目。完成这些步骤并最终完成创建。然后，你应该会得到如图 5-1 所示的目录结构。\n\n![A978-1-4842-1326-1_5_Fig1_HTML.jpg](img/A978-1-4842-1326-1_5_Fig1_HTML.jpg)\n\
    \n**图 5-1.** Spark Scala 项目目录结构\n\n为了使 Maven 能够正确地编译和打包你的应用程序，这个目录结构非常重要。\n\n\
    我们要做的第一件事是理解 Maven 为我们生成的示例应用程序。\n\n### 理解基本的 Spark 应用程序\n\nSpark 原型的好处是生成了一个示例应用程序，它给出了\
    \ Spark 程序的基本结构。它首先从 Spark 上下文的配置开始，然后处理数据，并将该处理的结果发送到输出。\n\n在示例程序（`App.scala`\
    \ 文件）中，`SparkContext` 的配置包括设置应用程序名称（该名称将出现在集群元数据中）以及我们将在其上执行应用程序的集群，如清单 5-2 所示。\n\
    \n**清单 5-2.** Spark 上下文配置\n```\nval conf = new SparkConf()\n  .setAppName(\"The\
    \ swankiest Spark app ever\")\n  .setMaster(\"local[2]\")\n```\n这里我们使用了特殊值 `local[2]`，这意味着我们希望使用本地\
    \ Spark 运行时（两个线程）在本地机器上运行应用程序。这对于测试目的非常方便，我们将在本书中使用这种方法。\n\n配置完成后，我们将使用清单 5-3\
    \ 所示的配置创建一个新的 Spark 配置。\n\n**清单 5-3.** Spark 创建\n```\nval sc = new SparkContext(conf)\n\
    ```\n然后，示例程序创建一个数据集，如清单 5-4 所示。\n\n**清单 5-4.** Spark 数据集创建\n```\nval col = sc.parallelize(0\
    \ to 100 by 5)\n```\n实际上，这行代码包含两个步骤：\n-   首先，它创建一个集合，包含从 0 到 100 的每五个数字。\n-  \
    \ 然后，Spark 通过将该集合复制到一个分布式数据集中来并行化它。换句话说，根据集群的拓扑结构，Spark 将并行处理此数据集。该数据集通常称为弹性分布式数据集（RDD）。\n\
    \n请注意，这里我们没有设置想要将数据集分割成的分区数量，因为我们让 Spark 来处理，但我们可以像清单 5-5 所示那样对数据进行分区。\n\n**清单\
    \ 5-5.** Spark 手动添加分区\n```\nval col = sc.parallelize(0 to 100 by 5, 2)\n```\n\
    最后，我们使用 Spark 示例函数转换数据，该函数生成一个新的 RDD，其中包含一个新的值集合，如清单 5-6 所示。\n\n**清单 5-6.** Spark\
    \ 创建新的 RDD\n```\nval smp = col.sample(true, 4)\n```\n这里我们使用了一个种子值为四的数字生成器。如果你想打印出生成的样本内容，请使用如清单\
    \ 5-7 所示的镜像映射函数。\n\n**清单 5-7.** Spark 使用镜像映射函数\n```\nsmp.map(x => x).collect\n\
    ```\n这将打印出类似清单 5-8 所示的内容。\n\n**清单 5-8.** Spark 处理输出\n```\nArray(0, 0, 0, 0, 0,\
    \ 5, 5, 5, 5, 10, 10, 15, 15, 15, 15, 15, 20, 20, 20, 20, 25, 30, 30, 35, 35,\
    \ 35, 35, 35, 35, 35, 35, 40, 40, 45, 45, 55, 55, 55, 55, 60, 65, 70, 70, 70,\
    \ 70, 70, 70, 70, 75, 75, 75, 75, 80, 80, 80, 80, 85, 85, 90, 90, 100, 100, 100,\
    \ 100, 100)\n```\n如果你使用清单 5-9 的命令运行示例应用程序：\n\n**清单 5-9.** Spark 启动命令\n```\nmvn\
    \ scala:run -DmainClass=org.apress.examples.App\n```\n代码的最后部分（清单 5-10）：\n\n**清单\
    \ 5-10.** Spark 驱动程序代码\n```\nval colCount = col.count\nval smpCount = smp.count\n\
    println(\"orig count = \" + colCount)\nprintln(\"sampled count = \" + smpCount)\n\
    ```\n将打印出：\n\n**清单 5-11.** Spark 驱动程序输出\n```\norig count = 21\nsampled count =\
    \ 78\n```\n这个 Spark 应用程序被称为 Spark 驱动程序。显然，这个示例很容易理解，并且只使用了很少的功能，但它给出了驱动程序结构的一般概念。在我们的用例中，我们希望通过\
    \ Spark 实现的目标是能够以分布式方式处理大量数据，消化它们，然后在架构中将它们发送到下游。\n"
- fmt: "### Implementing the Spark Streamer\n\nIntroducing Spark in our existing architecture\
    \ doesn’t require to modify what we have seen in [Chapter 4](#A978-1-4842-1326-1_4_Chapter.html);\
    \ it’s just a matter of adding a new consumer to our Kafka clickstream topic like\
    \ that shown in Figure [5-2](#A978-1-4842-1326-1_5_Chapter.html#Fig2).\n\n![A978-1-4842-1326-1_5_Fig2_HTML.jpg](A978-1-4842-1326-1_5_Fig2_HTML.jpg)\n\
    \n**Figure 5-2.** Adding Spark Kafka streaming to our architecture\n\nOur Spark\
    \ driver should be able to connect to Kafka and consume the data stream. To do\
    \ so, we will configure a special Spark context called `StreamingContext`, as\
    \ shown in Listing [5-12](#A978-1-4842-1326-1_5_Chapter.html#FPar14).\n\n**Listing\
    \ 5-12.** Configuring a Spark Streaming context\n\n```\nval sparkConf = new SparkConf().setAppName(\"\
    KafkaStreamerToElasticsearch \")\nsparkConf.set(\"es.index.auto.create\", \"true\"\
    )\nval ssc = new StreamingContext(sparkConf, Seconds(2))\n```\n\nAs you can see,\
    \ the context configuration is pretty much the same as that in the previous sample\
    \ Spark driver, with the following differences:\n\n- We use the `es.index.auto.create`\
    \ option to make sure that the index will be created automatically in Elasticsearch\
    \ when the data is indexed.\n- We set the `StreamingContext` at a 2-second batch\
    \ interval, which means that data will be streamed every 2 seconds from the Kafka\
    \ topic.\n\nWe need now to configure from what brokers and what topics we want\
    \ to receive the data, and then create the stream line between the two worlds,\
    \ as shown in Listing [5-13](#A978-1-4842-1326-1_5_Chapter.html#FPar15).\n\n**Listing\
    \ 5-13.** Connecting Spark and Kafka\n\n```\nval Array(brokers, topics) = args\n\
    val topicsSet = topics.split(\",\").toSet\nval kafkaParams = Map[String, String](\"\
    metadata.broker.list\" -> brokers)\nval messages = KafkaUtils.createDirectStream[String,\
    \ String, StringDecoder, StringDecoder](ssc, kafkaParams, topicsSet)\n```\n\n\
    The `args` variable contains the arguments passed to the driver when running it.\
    \ The list of brokers and list of topics are both delimited by a comma. Once parsed,\
    \ the `KafkaUtils` class, provided as part of the Spark streaming framework (`org.apache.spark.streaming`\
    \ package), is used to create a direct stream between Kafka and Spark. In our\
    \ example all messages are received in the `messages` variable.\n\nAt this point\
    \ we should be able to output each streamed clickstream log line by using the\
    \ `map` function in Listing [5-14](#A978-1-4842-1326-1_5_Chapter.html#FPar16).\n\
    \n**Listing 5-14.** Map and print lines\n\n```\nval lines = messages.map(_._2)\n\
    lines.print();\n```\n\nThere are a couple of things to examine in the previous\
    \ lines:\n\n- The `messages` variable is an RDD that holds the streamed data.\n\
    - The `_` syntax represents an argument in an anonymous function, as in Listing\
    \ [5-15](#A978-1-4842-1326-1_5_Chapter.html#FPar17).\n\n**Listing 5-15.** Spark\
    \ map function simplified syntax\n\n```\nmap(_._2)\n```\n\nThis is equivalent\
    \ to the line shown in Listing [5-16](#A978-1-4842-1326-1_5_Chapter.html#FPar18),\
    \ where `_2` is the second element of the `x` tuple.\n\n**Listing 5-16.** Spark\
    \ map function full syntax\n\n```\nmap(x => x._2)\n```\n\nTo run the driver, we’ll\
    \ first build it using Maven. Run the following command to compile and package\
    \ the Scala code into a JAR:\n\n```\nmvn scala:compile package\n```\n\nNote that\
    \ in the case of that driver, I’m using Scala 2.10.5, which requires Java 7 in\
    \ order to work:\n\n```\nexport JAVA_HOME=/Library/Java/JavaVirtualMachines/jdk1.7.0_21.jdk/Contents/Home/\n\
    ```\n\nOnce compiled and packaged, you should end up with two JARs in the project\
    \ target directory:\n\n- `spark-scala-streamer-1.0.0.jar`: contains only the compiled\
    \ project classes\n- `spark-scala-streamer-1.0.0-jar-with-dependencies.jar`: contains\
    \ compiled classes and project dependencies\n\nWe’ll use a slightly different\
    \ method than in the previous part to run the driver: the `spark-submit` executable\
    \ from the standard Spark distribution, which can be downloaded from here:\n\n\
    [`http://spark.apache.org/downloads.html`](http://spark.apache.org/downloads.html)\n\
    \nAt the time of the writing I was using the 1.4.0 version. Once downloaded I\
    \ recommend that you simply add Spark binaries to your `PATH` environment variable,\
    \ as shown in Listing [5-17](#A978-1-4842-1326-1_5_Chapter.html#FPar19).\n\n**Listing\
    \ 5-17.** Adding Spark binaries to `PATH` environment variable\n\n```\nexport\
    \ SPARK_HOME=/Applications/spark-1.4.0/bin\nexport PATH=$SPARK_HOME:$PATH\n```\n\
    \nThis will ease the access to all Spark executables including `spark-submit`\
    \ that you can use like that in Listing [5-18](#A978-1-4842-1326-1_5_Chapter.html#FPar20)\
    \ to execute our previous program.\n\n**Listing 5-18.** Running the Spark Driver\
    \ using `spark-submit`\n\n```\nspark-submit --class org.apress.examples.chapter4.KafkaStreamer\
    \ \\\n  --master local[1] \\\n  target/spark-scala-streamer-1.0.0-jar-with-dependencies.jar\
    \ \\\n  localhost:9092,localhost:9093 clickstream\n```\n\nAs you can see, we pass\
    \ the `KafkaStreamer` to `spark-submit`, which is part of the JAR we just created.\
    \ We are using the JAR with dependencies because otherwise Spark will not find\
    \ the needed class and you will likely end up with a “class not found” exception.\
    \ At the end of the command, you have probably recognized the argument containing\
    \ the broker list that we want to connect to and the topic that we want to stream\
    \ data from. Running this command just bootstraps Spark and listen for incoming\
    \ message, thus generate log lines using the generator we used in the previous\
    \ and be sure that the streaming pipeline is running in order to push message\
    \ in Kafka. You should get some lines outputted in the console like those in Listing\
    \ [5-19](#A978-1-4842-1326-1_5_Chapter.html#FPar21).\n\n**Listing 5-19.** Example\
    \ of data streamed by Spark\n\n```\n-------------------------------------------\n\
    Time: 1437921302000 ms\n-------------------------------------------\n{\"message\"\
    :\"10.10.10.11 - - [10/Oct/2013:00:04:02 +0000] \\\"GET /page3 HTTP/1.0\\\" 200\
    \ 4401 \\\"http://www.amazon.com\\\" \\\"Mozilla/5.0 (Windows; U; Windows NT 6.1;\
    \ rv:2.2) Gecko/20110201\\\" \",\"@version\":\"1\",\"@timestamp\":\"2015-07-26T14:35:00.869Z\"\
    ,\"file\":\"/tmp/source/access_log_20150726-163457.log\",\"host\":\"ea8fceb4f5b0\"\
    ,\"offset\":\"0\",\"type\":\"access_log\",\"clientip\":\"10.10.10.11\",\"ident\"\
    :\"-\",\"auth\":\"-\",\"timestamp\":\"10/Oct/2013:00:04:02 +0000\",\"verb\":\"\
    GET\",\"request\":\"/page3\",\"httpversion\":\"1.0\",\"response\":\"200\",\"bytes\"\
    :\"4401\",\"referrer\":\"\\\"http://www.amazon.com\\\"\",\"agent\":\"\\\"Mozilla/5.0\
    \ (Windows; U; Windows NT 6.1; rv:2.2) Gecko/20110201\\\"\"}\n{\"message\":\"\
