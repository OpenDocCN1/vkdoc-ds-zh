        `"2": {`


          `"date_histogram": {`


            `"field": "@timestamp",`


            `"interval": "1s",`


            `"pre_zone": "+01:00",`


            `"pre_zone_adjust_large_interval": true,`


            `"min_doc_count": 1,`


            `"extended_bounds": {`


              `"min": 1438022198610,`


              `"max": 1438022314896`


            `}`


          `},`


          `"aggs": {`


            `"3": {`


              `"terms": {`


                `"field": "response",`


                `"size": 5,`


                `"order": {`


                  `"_count": "desc"`


                `}`


              `}`


            `}`


          `}`


        `}`


    Kibana is relying on Elasticsearch scaling ability and those kinds of visualizations
    can be done on small to very large sets of data. In the end, what you want to
    get is a complete view of your data, such as the Kibana dashboard shown in Figure
    [5-7](#A978-1-4842-1326-1_5_Chapter.html#Fig7).


    ![A978-1-4842-1326-1_5_Fig7_HTML.jpg](A978-1-4842-1326-1_5_Fig7_HTML.jpg)


    Figure 5-7.


    Kibana dashboard


    ## Summary


    In the next chapter, we’ll add more complexity to our processing and bring more
    prediction to it. In addition, we’ll continue to illustrate the results of processing
    with Kibana dashboard.


    # 6. Learning From Your Data?


    One of the powerful features of Spark is its machine learning capabilities. Using
    the Spark Mllib it’s very easy to enrich existing data processing pipelines with
    learning algorithms. This chapter is an introduction to the main concepts behind
    machine learning and an introduction to augmenting our architecture with machine
    learning features.'
