- fmt: '# ElasticSearch


    `ElasticSearch` is a NoSQL technology that is very popular for its scalable distributed
    indexing engine and search features. It’s based on Apache Lucene and enables real-time
    data analytics and full-text search in your architecture.


    `ElasticSearch` is part of the ELK platform, which stands for `ElasticSearch`
    + `Logstash` + `Kibana`, which is delivered by Elastic the company. The three
    products work together to provide the best end-to-end platform for collecting,
    storing, and visualizing data:


    - `Logstash` lets you collect data from many kinds of sources—such as social data,
    logs, messages queues, or sensors—it then supports data enrichment and transformation,
    and finally it transports them to an indexation system such as `ElasticSearch`.

    - `ElasticSearch` indexes the data in a distributed, scalable, and resilient system.
    It’s schemaless and provides libraries for multiple languages so they can easily
    and fatly enable real-time search and analytics in your application.

    - `Kibana` is a customizable user interface in which you can build a simple to
    complex dashboard to explore and visualize data indexed by `ElasticSearch`.


    Figure [1-7](#A978-1-4842-1326-1_1_Chapter.html#Fig7) shows the structure of Elastic
    products.


    ![A978-1-4842-1326-1_1_Fig7_HTML.jpg](A978-1-4842-1326-1_1_Fig7_HTML.jpg)


    Figure 1-7. ElasticSearch products


    As you can see in the previous diagram, Elastic also provides commercial products
    such as Marvel, a monitoring console based on `Kibana`; Shield, a security framework,
    which, for example, provides authentication and authorization; and Watcher, an
    alerting and notification system. We won’t use these commercial products in this
    book.


    Instead, we’ll mainly use `ElasticSearch` as a search engine that holds the data
    produced by Spark. After being processed and aggregated, the data is indexed into
    `ElasticSearch` to enable a third-party system to query the data through the `ElasticSearch`
    querying engine. On the other side, we also use ELK for the processing logs and
    visualizing analytics, but from a platform operational point of view. For more
    information on `ElasticSearch`, visit `elastic.co`.


    ## Creating the Foundation of a Long-Term Big Data Architecture


    Keeping all the Big Data technology we are going to use in mind, we can now go
    forward and build the foundation of our architecture.


    ### Architecture Overview


    From a high-level point of view, our architecture will look like another e-commerce
    application architecture. We will need the following:


    - A web application the visitor can use to navigate in a catalog of products

    - A log ingestion application that is designed to pull the logs and process them

    - A learning application for triggering recommendations for our visitor

    - A processing engine that functions as the central processing cluster for the
    architecture

    - A search engine to pull analytics for our process data


    Figure [1-8](#A978-1-4842-1326-1_1_Chapter.html#Fig8) shows how these different
    applications are organized in such an architecture.


    ![A978-1-4842-1326-1_1_Fig8_HTML.jpg](A978-1-4842-1326-1_1_Fig8_HTML.jpg)


    Figure 1-8. Architecture overview


    ### Log Ingestion Application


    The log ingestion application is used to consume application logs such as web
    access logs. To ease the use case, a generated web access log is provided and
    it simulates the behavior of visitors browsing the product catalog. These logs
    represent the clickstream logs that are used for long-term processing but also
    for real-time recommendation.


    There can be two options in the architecture: the first can be ensured by Flume
    and can transport the logs as they come in to our processing application; the
    second can be ensured by `ElasticSearch`, `Logstash`, and `Kibana` (the ELK platform)
    to create access analytics.


    Figure [1-9](#A978-1-4842-1326-1_1_Chapter.html#Fig9) shows how the logs are handled
    by ELK and Flume.


    ![A978-1-4842-1326-1_1_Fig9_HTML.jpg](A978-1-4842-1326-1_1_Fig9_HTML.jpg)


    Figure 1-9. Ingestion application


    Using ELK for this architecture gives us a greater value since the three products
    integrate seamlessly with each other and bring more value that just using Flume
    alone and trying to obtain the same level of features.


    ### Learning Application


    The learning application receives a stream of data and builds prediction to optimize
    our recommendation engine. This application uses a basic algorithm to introduce
    the concept of machine learning based on Spark MLlib.


    Figure [1-10](#A978-1-4842-1326-1_1_Chapter.html#Fig10) shows how the data is
    received by the learning application in Kafka, is then sent to Spark to be processed,
    and finally is indexed into `ElasticSearch` for further usage.


    ![A978-1-4842-1326-1_1_Fig10_HTML.jpg](A978-1-4842-1326-1_1_Fig10_HTML.jpg)


    Figure 1-10. Machine learning


    ### Processing Engine


    The processing engine is the heart of the architecture; it receives data from
    multiple kinds of source and delegates the processing to the appropriate model.


    Figure [1-11](#A978-1-4842-1326-1_1_Chapter.html#Fig11) shows how the data is
    received by the processing engine that is composed of Hive for path processing
    and Spark for real-time/near real-time processing.


    ![A978-1-4842-1326-1_1_Fig11_HTML.jpg](A978-1-4842-1326-1_1_Fig11_HTML.jpg)


    Figure 1-11. Processing engine


    Here we use Kafka combined with Logstash to distribute the data to `ElasticSearch`.
    Spark lives on top of a Hadoop cluster, which is not mandatory. In this book,
    for simplicity’s sake, we do not set up a Hadoop cluster, but prefer to run Spark
    in a standalone mode. Obviously, however, you’re able to deploy your work in your
    preferred Hadoop distribution.


    ### Search Engine


    The search engine leverages the data processed by the processing engine and exposes
    a dedicated RESTful API that will be used for analytic purposes.


    ## Summary


    So far, we have seen all the components that make up our architecture. In the
    next chapter, we will focus on the NoSQL part and will further explore two different
    technologies: Couchbase and `ElasticSearch`.


    # 2. Early Big Data with NoSQL


    In this chapter, I provide you with an overview of the available datastore technologies
    that are use in a Big Data project context. I then focus on Couchbase and `ElasticSearch`
    and show you how they can be used and what their differences are.


    The first section gives you a better understanding of the different flavors of
    existing technologies within the NoSQL landscape.


    ## NoSQL Landscape


    Relational databases were the choice, almost the only choice, of a lot of developers
    and database administrators for traditional three-tier applications. This was
    the case for many reasons having to do with the data modeling methodology, the
    querying language that interacted with the data, and the powerful nature of those
    technologies, which allowed for consistent data stores to be deployed that served
    complex applications.


    Then the needs started to evolve/change in such a way that those data stores could
    no longer be the solution to all data-store problems. That’s how the term NoSQL
    arose—it offered a new approach to those problems by first breaking the standardized
    SQL schema-oriented paradigms.


    NoSQL technologies are schemaless and highly scalable, and couple of them are
    also highly distributed and high-performance. Most of the time, they complete
    an architecture with an existing RDBMS technology by, for example, playing the
    role of cache, search engine, unstructured store, and volatile information store.


    They are divided in four main categories:


    Key/value data store   Column data store   Document-oriented data store   Graph
    data store  


    Now let’s dive into the different categories and then choose the most appropriate
    for our use case.'
