  raw: '### Implementing the Spark Streamer


    Introducing Spark in our existing architecture doesn’t require to modify what
    we have seen in [Chapter 4](#A978-1-4842-1326-1_4_Chapter.html); it’s just a matter
    of adding a new consumer to our Kafka clickstream topic like that shown in Figure
    [5-2](#A978-1-4842-1326-1_5_Chapter.html#Fig2).


    ![A978-1-4842-1326-1_5_Fig2_HTML.jpg](A978-1-4842-1326-1_5_Fig2_HTML.jpg)


    Figure 5-2.


    Adding Spark Kafka streaming to our architecture


    Our Spark driver should be able to connect to Kafka and consume the data stream.
    To do so, we will configure a special Spark context called Streaming context,
    as shown in Listing [5-12](#A978-1-4842-1326-1_5_Chapter.html#FPar14).


    Listing 5-12.Configuring a Spark Streaming context


    `val sparkConf = new SparkConf().setAppName("KafkaStreamerToElasticsearch ")`


    `sparkConf.set("es.index.auto.create", "true")`


    `val ssc = new StreamingContext(sparkConf, Seconds(2))`


    As you can see, the context configuration is pretty much the same as that in the
    previous sample Spark driver, with the following differences:


    *   We use the es.index.auto.create option to make sure that the index will be
    created automatically in Elasticsearch when the data is indexed.

    *   We set the StreamingContext at a 2-second batch interval, which means that
    data will be streamed every 2 seconds from the Kafka topic.


    We need now to configure from what brokers and what topics we want to receive
    the data, and then create the stream line between the two worlds, as shown in
    Listing [5-13](#A978-1-4842-1326-1_5_Chapter.html#FPar15).


    Listing 5-13.Connecting Spark and Kafka


    `val Array(brokers, topics) = args`


    `val topicsSet = topics.split(",").toSet`


    `val kafkaParams = Map[String, String]("metadata.broker.list" -> brokers)`


    `val messages = KafkaUtils.createDirectStream[String, String, StringDecoder, StringDecoder](ssc,
    kafkaParams, topicsSet)`


    The args variable contains the arguments passed to the driver when running it.
    The list of brokers and list of topics are both delimited by a comma. Once parsed,
    the KafkaUtils class, provided as part of the Spark streaming framework (org.apache.spark.streaming
    package), is used to create a direct stream between Kafka and Spark. In our example
    all messages are received in the messages variable.


    At this point we should be able to output each streamed clickstream log line by
    using the map function in Listing [5-14](#A978-1-4842-1326-1_5_Chapter.html#FPar16).


    Listing 5-14.Map and print lines


    `val lines = messages.map(_._2)`


    `lines.print();`


    There are a couple of things to examine in the previous lines:


    *   the messages variables is an RDD that holds the streamed data

    *   the _ syntax represents an argument in an anonymous function, as in Listing
    [5-15](#A978-1-4842-1326-1_5_Chapter.html#FPar17).


    Listing 5-15.Spark map function simplified syntax


    `map(_._2)`


    This is equivalent to the line shown in Listing [5-16](#A978-1-4842-1326-1_5_Chapter.html#FPar18),
    where _2 is the second element of the x tuple.


    Listing 5-16.Spark map function full syntax


    `map(x => x._2)`


    To run the driver, we’ll first build it using maven. Run the following command
    to compile and package the Scala code into a JAR:


    `mvn scala:compile package`


    Note that in the case of that driver, I’m using Scala 2.10.5, which requires Java
    7 in order to work:


    `export JAVA_HOME=/Library/Java/JavaVirtualMachines/jdk1.7.0_21.jdk/Contents/Home/`


    Once compiled and packaged, you should end up with a two JARs in the project target
    directory:


    *   spark-scala-streamer-1.0.0.jar: contains only the compiled project classes

    *   spark-scala-streamer-1.0.0-jar-with-dependencies.jar contains compiled classes
    and project dependencies


    We’ll use a slightly different method than in the previous part to run the driver:
    the spark-submit executable from the standard spark distribution, which can be
    downloaded from here:


    [`http://spark.apache.org/downloads.html`](http://spark.apache.org/downloads.html)


    At the time of the writing I was using the 1.4.0 version. Once downloaded I recommend
    that you simply add Spark binaries to your PATH environment variable, as shown
    in Listing [5-17](#A978-1-4842-1326-1_5_Chapter.html#FPar19).


    Listing 5-17.Adding Spark binaries to PATH environment variable


    `export SPARK_HOME=/Applications/spark-1.4.0/bin`


    `export PATH=$SPARK_HOME:$PATH`


    This will ease the access to all Spark executables including spark-submit that
    you can use like that in Listing [5-18](#A978-1-4842-1326-1_5_Chapter.html#FPar20)
    to execute our previous program.


    Listing 5-18.Running the Spark Driver using spark-submit


    `spark-submit --class org.apress.examples.chapter4.KafkaStreamer \`


    `--master local[1] \`


    `target/spark-scala-streamer-1.0.0-jar-with-dependencies.jar \`


    `localhost:9092,localhost:9093 clickstream`


    As you can see, we pass the KafkaStreamer to spark-submit, which is part of the
    JAR we just created. We are using the JAR with dependencies because otherwise
    Spark will not find the needed class and you will likely end up with a “class
    not found” exception. At the end of the command, you have probably recognized
    the argument containing the broker list that we want to connect to and the topic
    that we want to stream data from. Running this command just bootstraps Spark and
    listen for incoming message, thus generate log lines using the generator we used
    in the previous and be sure that the streaming pipeline is running in order to
    push message in Kafka. You should get some lines outputted in the console like
    those in Listing [5-19](#A978-1-4842-1326-1_5_Chapter.html#FPar21).


    Listing 5-19.Example of data streamed by Spark


    `-------------------------------------------`


    `Time: 1437921302000` `ms`


    `-------------------------------------------`


