    The next chapter will deal with governance and main assets that should be set
    up to reduce risks in production.


    # 7. Governance Considerations


    One main aspect of the architecture is its governance. In other words, how will
    it be sized, deployed, or event monitored? In this chapter, I’ll go through governance
    considerations starting with the “Dockerization” of the architecture, while talking
    about scalability and its impact on the architecture.


    ## Dockerizing the Architecture


    There are different ways to deploy a data architecture; you can install components
    on distributed physical machines or on virtual machines. In the past few years,
    Docker has become a standard for distributed architecture deployment, so you’ll
    use it in this book for the example use case.


    ### Introducing Docker


    Docker is an open source platform that allows users to reduce the deployment cycle
    time between the development stage and the production stage. It provides a comprehensive
    set of tools and APIs that will help you to build an infrastructure that will
    run your application.


    For the use case in this book, you’ll be able to deploy the full architecture
    using a Docker container. Docker has its own terminology, defined in the following
    list:


    *   Docker container: This is the smallest working unit that runs your application.
    For example, you can have a Docker container that runs an Apache Tomcat server
    to serve your RESTful API.

    *   Docker image: This is an image that describes a Docker container. So, in this
    example, you will need an operating system and some packages to run Tomcat. All
    the needed assets and configuration are written in a read-only template called
    a Dockerfile, which is the Docker image. For more information on the Docker image,
    see [`https://docs.docker.com/userguide/dockerimages/`](https://docs.docker.com/userguide/dockerimages/)
    .

    *   Docker client: This is the first user interface to interact with the underlying
    Docker features. Once your Docker image is written, you will build it to run a
    Docker container. This is something you will do using the Docker client. For more
    information on the Docker command line, see [`https://docs.docker.com/reference/commandline/cli/`](https://docs.docker.com/reference/commandline/cli/)
    .

    *   Docker daemon: This orchestrates all the underlying operations needed to run
    the Docker containers. The user interacts with the daemon through the Docker client.


    Figure [7-1](#A978-1-4842-1326-1_7_Chapter.html#Fig1) summarizes what I have just
    described.


    ![A978-1-4842-1326-1_7_Fig1_HTML.jpg](A978-1-4842-1326-1_7_Fig1_HTML.jpg)


    Figure 7-1.


    Docker components


    So, in the example use case, if you focus on the data-processing part that involves
    multiple technologies, Docker is a great benefit for running and provisioning
    the infrastructure. You basically just have to create a Docker image for every
    technology that needs to run on a different container, meaning for the following:


    *   Logstash forwarder

    *   Logstash, processor, and indexer are using the same technology, but only a
    different configuration

    *   Kafka

    *   Zookeeper

    *   Elasticsearch

    *   Kibana


    ### Installing Docker


    Docker supports a multitude of configurations for installation. In the scope of
    this book, I’m running Docker on Mac OS X that has a slightly different installation
    steps than on Ubuntu, for example.


    I recommend you visit the following page and go through the relevant installation
    process for your system:


    [`https://docs.docker.com/installation/`](https://docs.docker.com/installation/)


    You will also need Docker Compose, which you can get here:


    [`https://docs.docker.com/compose/install/`](https://docs.docker.com/compose/install/)


    You will need Docker machine, which you can get here:


    [`https://docs.docker.com/machine/install-machine/`](https://docs.docker.com/machine/install-machine/)


    At the end of the process, make sure you can run Docker and the Docker Compose
    command line by issuing the code in Listing [7-1](#A978-1-4842-1326-1_7_Chapter.html#FPar1).


    Listing 7-1.Docker Installation Checks


    `bash-3.2$ docker -v`


    `Docker version 1.7.1, build 786b29d`


    `bash-3.2$ docker-compose -v`


    `docker-compose version: 1.3.2`


    `CPython version: 2.7.9`


    `OpenSSL version: OpenSSL 1.0.1j 15 Oct 2014`


    `bash-3.2$ docker-machine -v`


    `docker-machine version 0.3.0 (0a251fe)`


    In this code, you can see the version of Docker components I’m working with while
    writing this book.


    At this point, you are ready to start creating your infrastructure Docker images.


    ### Creating Your Docker Images


    In this section, I’ll explain in detail how to create one of your architecture
    application’s Docker image. You will see that the overall procedure is the same
    for every other application, so I’ll describe the creation of just one.


    For reference, you can find all the images on my GitHub repositories.


    *   Elasticsearch: [`https://github.com/bahaaldine/docker-elasticsearch`](https://github.com/bahaaldine/docker-elasticsearch)

    *   Logstash: [`https://github.com/bahaaldine/docker-logstash`](https://github.com/bahaaldine/docker-logstash)

    *   Logstash Forwarder: [`https://github.com/bahaaldine/docker-logstash-forwarder`](https://github.com/bahaaldine/docker-logstash-forwarder)

    *   Kibana: [`https://github.com/bahaaldine/docker-kibana`](https://github.com/bahaaldine/docker-kibana)

    *   Zookeeper: [`https://github.com/bahaaldine/docker-zookeeper`](https://github.com/bahaaldine/docker-zookeeper)

    *   Apache Kafka: [`https://github.com/bahaaldine/docker-kafka`](https://github.com/bahaaldine/docker-kafka)

    *   Apache Zookeeper for Kafka: [`https://github.com/bahaaldine/docker-zookeeper`](https://github.com/bahaaldine/docker-zookeeper)

    *   Apache Spark: [`https://github.com/bahaaldine/docker-spark`](https://github.com/bahaaldine/docker-spark)


    Let’s now focus on creating an Elasticsearch Docker image and walking through
    the Dockerfile file, available here:


    [`https://github.com/bahaaldine/docker-elasticsearch/blob/master/Dockerfile`](https://github.com/bahaaldine/docker-elasticsearch/blob/master/Dockerfile)


    The template is divided into several parts, each responsible for a specific job.'
