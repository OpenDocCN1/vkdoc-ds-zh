    \ `countByValue` 函数。然后我们创建一个默认值为 0 的映射表，并对其进行迭代以提取出 `PageStatistic` 对象。\n\n最后，我们使用\
    \ `spark` 索引将数据索引到 Elasticsearch 中，并创建一个新的文档类型 `stats`，如清单 5-26 所示。\n\n**清单 5-26.**\
