  trans: "#### 准备数据集\n\n我们需要构建一个映射文件，以便将点击流数据关联到产品类别。我们将使用位于以下路径中的 Python 脚本：[`https://github.com/bahaaldine/elasticsearch-clickstream-demo/blob/master/generator/mapping_generator.py`](https://github.com/bahaaldine/elasticsearch-clickstream-demo/blob/master/generator/mapping_generator.py)。\n\
    \n该 Python 脚本会生成 200,000 个 URI，并将它们随机映射到代码清单 6-1 所示任意列表中的一个类别。\n\n**代码清单 6-1.**\
    \ 产品类别\n\n```\n#!/usr/bin/python\nimport csv\nimport random\n\nproductCount =\
    \ 200000\nproductCategories = [\"设备配件\",\"高科技配件\",\"IT 配件\",\"宠物\",\"汽车\",\"婴儿\"\
    ,\"家庭办公\",\"厨房\",\"电子游戏\",\"骑行\",\"蓝光和 DVD\",\"办公用品\",\"家用电器\",\"高科技\",\"IT\"\
    ,\"音频和音乐\",\"园艺\",\"玩具和游戏\",\"图书\",\"软件\",\"照明\",\"家居\",\"音乐\",\"轮胎\",\"运动与休闲\"\
    ,\"视频\",\"化妆品\",\"珠宝\",\"鞋类\",\"手表\",\"健康\",\"服装\"]\n\nwith open('mappings.csv',\
    \ 'wb') as outf:\n    fieldnames = ['uri'] + ['category']\n    csvwriter = csv.DictWriter(outf,\
    \ fieldnames)\n    while productCount > 0:\n        row = {}\n        csvwriter.writerow(dict(row,\
    \ uri=\"/products/product%d\" % productCount, category=random.choice(productCategories)))\n\
    \        productCount -= 1\n```\n\n如你所见，共有 32 个类别。你将按照代码清单 6-2 所示执行这些脚本。\n\n**代码清单\
    \ 6-2.** 映射文件提取\n\n```\npython mapping_generator.py\n```\n\n你应该会得到以下`mappings.csv`文件：\n\
    \n```\n...\n/products/product90956,Shoes\n/products/product90955,Shoes\n/products/product90954,baby\n\
    /products/product90953,household applicance\n/products/product90952,Books\n/products/product90951,Audio\
    \ and musique\n/products/product90950,IT\n/products/product90949,Devices accessories\n\
    /products/product90948,Devices accessories\n/products/product90947,Jewellery\n\
    /products/product90946,car\n/products/product90945,Devices accessories\n/products/product90944,Toys\
    \ and games\n/products/product90943,baby\n/products/product90942,Books\n/products/product90941,IT\
    \ accessories\n/products/product90940,cycling\n...\n```\n\n另一方面，[`https://raw.githubusercontent.com/bahaaldine/elasticsearch-clickstream-demo/master/generator/resources.txt`](https://raw.githubusercontent.com/bahaaldine/elasticsearch-clickstream-demo/master/generator/resources.txt)\
    \ 文件包含了所有可能的产品 URI。\n\n最后，Spark 将负责根据映射文件将 URI 关联到类别。因此，让我们在以下类中分析所需的 Spark 代码：[`https://github.com/bahaaldine/spark-enrich-and-ml/blob/master/src/main/scala/org/apache/spark/examples/SparkEnricher.scala`](https://github.com/bahaaldine/spark-enrich-and-ml/blob/master/src/main/scala/org/apache/spark/examples/SparkEnricher.scala)。\n\
    \n我们保留了 `Clickstream` 对象，但添加了一个 `Customer` 对象，它将作为我们流处理的输出。\n\n**代码清单 6-3.** Customer\
    \ 对象\n\n```\ncase class Customer (\n    session:String,\n    request:String,\n\
    \    category:String\n)\n```\n\n请注意，整个 Spark 项目可以在以下仓库中找到：[`https://github.com/bahaaldine/scalable-big-data-architecture/tree/master/chapter6/spark-enrich-and-ml`](https://github.com/bahaaldine/scalable-big-data-architecture/tree/master/chapter6/spark-enrich-and-ml)。\n\
    \n到目前为止，`Customer` 对象非常简单，只包含三个字段：\n\n*   `session` 字段，用于标识用户的键\n*   `request`\
    \ 字段，包含产品 URI\n*   `category` 字段，将使用映射文件填充产品类别。\n\nSpark 上下文配置保持不变；我们只是添加了另一个数据源，即我们的映射文件，如代码清单\
    \ 6-4 所示。\n\n**代码清单 6-4.** 加载映射文件\n\n```\nval mappingFile = ssc.sparkContext.textFile(\"\
    /path/to/mappings.csv\")\nval mappings = mappingFile.map(line => line.split(\"\
    ,\")).map(x => (x(0),x(1))).collectAsMap()\nval broadcastMapping = ssc.sparkContext.broadcast(mappings)\n\
    ```\n\n请记住，之前的 Python 脚本生成了一个名为 `mappings.csv` 的映射文件。你必须在此代码中设置该路径，才能使 Spark 驱动程序正常工作。\n\
    \n映射被加载到一个 `mappings` 变量中，然后通过广播创建为只读变量，放入每个 Spark 机器的缓存中。随后使用该变量创建并丰富 `Customer`\
    \ 对象，如代码清单 6-5 所示。\n\n**代码清单 6-5.** 创建并丰富 Customer 对象\n\n```\nval customers =\
    \ events.map { clickstream =>\n    val lookupMap = broadcastMapping.value\n  \
    \  Customer(\n        clickstream.clientip\n        , clickstream.request\n  \
    \      , lookupMap.getOrElse(clickstream.request, \"category not found\")\n  \
    \  )\n}\n```\n\n映射被加载到 `lookupMap` 变量中，我们通过 `getOrElse` 来查找产品类别。如果映射不存在，则返回“category\
    \ not found”。最后，我们使用代码清单 6-6 中的代码片段将每个 `Customer` 对象索引到 Elasticsearch 中。\n\n**代码清单\
    \ 6-6.** Customer RDD 索引\n\n```\ncustomers.foreachRDD{ rdd =>\n    if (rdd.toLocalIterator.nonEmpty)\
    \ {\n        EsSpark.saveToEs(rdd, \"spark/customer\")\n    }\n}\n```\n\n每个客户都会被索引到\
    \ Elasticsearch 的 `spark` 索引中，类型为 `customer`。为了测试我们的代码，请确保 lambda 架构完全运行，然后启动\
    \ `build.sh` 文件来构建并启动我们的驱动程序。\n\n**代码清单 6-7.** Spark 驱动程序启动命令\n\n```\n./build.sh\n\
    ```\n\n通过使用 `generator.py` 脚本生成新的点击流日志，你应该会在 `spark` 索引中得到索引后的客户。只需浏览 `http://elasticsearch_host:9200/spark/_search`，即可获得代码清单\
    \ 6-8 所示的输出。\n\n**代码清单 6-8.** Elasticsearch 中索引的客户\n\n```\nhits: {\n    total:\
    \ 10,\n    max_score: 1,\n    hits: [\n        {\n            _index: \"spark\"\
    ,\n            _type: \"customer\",\n            _id: \"AU9-8BCuIm6jDjOublOw\"\
    ,\n            _score: 1,\n            _source: {\n                session: \"\
    86.192.183.220\",\n                request: \"/products/product106871\",\n   \
    \             category: \"Watches\"\n            }\n        },\n        {\n  \
    \          _index: \"spark\",\n            _type: \"customer\",\n            _id:\
    \ \"AU9-8BCuIm6jDjOublO1\",\n            _score: 1,\n            _source: {\n\
    \                session: \"86.192.149.103\",\n                request: \"/products/product158310\"\
    ,\n                category: \"cycling\"\n            }\n        }\n        ...\n\
    \    ]\n}\n```\n\n此时，我们拥有一个完整的索引，其中包含已映射的客户。我们现在将利用这一丰富阶段来对数据进行聚类并构建预测。"
- fmt: "### Labelizing the Data\n\nTo train our model, we’ll build a two-dimensional\
    \ vector, which is created based on a category label and a customer label. The\
    \ category label is associated to a specific category such as Car, Sport, and\
    \ so on, whereas with a customer label, we’ll introduce the fake concept of a\
    \ customer type.\n\nThe customer label goes from one to five and can be understood\
    \ as follows:\n\nfree early bird gold platinium big boy\n\nSo before training\
    \ the model we need to create a couple of mapping files to be able to identify\
    \ a category by a label and a customer by a label.\n\nThe `https://github.com/bahaaldine/elasticsearch-clickstream-demo/blob/master/generator/mapping_generator.py`\
    \ has been slightly modified to add a label column, as seen in Listing [6-9](#A978-1-4842-1326-1_6_Chapter.html#FPar9).\n\
    \n**Listing 6-9.** Adding label to categories\n\n```\ncategory = random.choice(productCategories)\n\
    \ncsvwriter.writerow(dict(row, uri=\"/products/product%d\" % productCount, category=category,\
    \ label=productCategories.index(category)+1))\n```\n\nThe label is calculated\
    \ based on the position of the related category in the `productCategories` list\
    \ variable. After executing the Python script, you should obtain a mapping file\
    \ like that shown in Listing [6-10](#A978-1-4842-1326-1_6_Chapter.html#FPar10).\n\
    \n**Listing 6-10.** Category mapping file with label\n\n```\n...\n/products/product199988,High-Tech\
    \ accessories,2\n/products/product199987,House,22\n/products/product199986,baby,6\n\
    /products/product199985,Heatlh,31\n/products/product199984,Watches,30\n...\n```\n\
    \nFor the customer, I’ve created a new Python script located here:\n\n`https://github.com/bahaaldine/elasticsearch-clickstream-demo/blob/master/generator/ip_mapping_generator.py`\n\
    \nwhich simply adds a random integer between 1 to 5 next to each IP in the generated\
    \ file, as seen in Listing [6-11](#A978-1-4842-1326-1_6_Chapter.html#FPar11).\n\
    \n**Listing 6-11.** IP mapping file generator\n\n```\n#!/usr/bin/python\n\nimport\
    \ csv\nimport random\n\nwith open('ip_mappings.csv', 'wb') as outf:\n        fieldnames\
    \ = ['ip'] + ['label']\n        csvwriter = csv.DictWriter(outf, fieldnames)\n\
    \        for i in range(0,255):\n                for j in range(0,255):\n    \
    \                    row = {}\n                        csvwriter.writerow(dict(row,\
    \ ip=\"86.192.\"+str(i)+\".\"+str(j), label=random.randint(1,5)))\n```\n\nThis\
    \ sounds like a weird choice to use the IP as the identifier of the customer,\
    \ but I did this on purpose for easing the comprehension of this part of the book\
    \ and working on a finite range of customer identifiers.\n\nAfter executing the\
    \ Python script, you should obtain an equivalent output to that shown in Listing\
    \ [6-12](#A978-1-4842-1326-1_6_Chapter.html#FPar12).\n\n**Listing 6-12.** Ip mapping\
    \ with label\n\n```\n...\n86.192.0.15,3\n86.192.0.16,3\n86.192.0.17,5\n86.192.0.18,3\n\
    86.192.0.19,1\n86.192.0.20,4\n86.192.0.21,1\n...\n```\n\nThis means that customer\
    \ `86.192.0.21` is a free customer.\n\n### Training and Making Prediction\n\n\
    In this last section, we are going to use all of the asset already discussed to\
    \ build a K-mean streaming machine learning driver. To do so, we’ll reuse the\
    \ previous Scala code and enrich it with the following steps.\n\nFirst, we load\
    \ the mappings files we just modified or created, as seen in Listing [6-13](#A978-1-4842-1326-1_6_Chapter.html#FPar13).\n\
    \n**Listing 6-13.** Loading the mapping file\n\n```\nval productCategoryMappingFile\
    \ = ssc.sparkContext.textFile(\"/path/to/mappings.csv\")\n\nval productCategoryMapping\
    \ = productCategoryMappingFile.map(line => line.split(\",\")).map(x => (x(0),x(1))).collectAsMap()\n\
    \nval categoryLabelMapping:scala.collection.Map[String,Double] = productCategoryMappingFile.map(line\
    \ => line.split(\",\")).map(x => (x(1),x(2).toDouble)).collectAsMap()\n\nval brodcastProductCategoryMapping\
    \ = ssc.sparkContext.broadcast(productCategoryMapping)\n\nval brodcastCategoryLabelMapping\
    \ = ssc.sparkContext.broadcast(categoryLabelMapping)\n\nval customerMappingFile\
    \ = ssc.sparkContext.textFile(\"/path/to/ip_mappings.csv\")\n\nval ipLabelMapping:scala.collection.Map[String,Double]\
    \ = customerMappingFile.map(line => line.split(\",\")).map(x => (x(0),x(1).toDouble)).collectAsMap()\n\
    \nval brodcastIpLabelMapping = ssc.sparkContext.broadcast(ipLabelMapping)\n```\n\
    \nHere we create three broadcasted maps:\n- the product category map that we already\
    \ know\n- the category label map that is extracted from the modified `mappings.csv`\n\
    - the IP label mapping file that was extracted from the newly created `ip_mappings.csv`\n\
    \nThe enrichment process remains unchanged; however, I’ve added two closures to\
    \ create the training and the test data required for our model to make predictions,\
    \ as shown in Listing [6-14](#A978-1-4842-1326-1_6_Chapter.html#FPar14).\n\n**Listing\
    \ 6-14.** Training data creation\n\n```\nval trainingData = customers.map { customer\
    \ =>\n\nval categoryLookupMap = brodcastCategoryLabelMapping.value\n\nval customerLookupMap\
    \ = brodcastIpLabelMapping.value\n\nval categoryLabel = categoryLookupMap.getOrElse(customer.category,\
    \ 1).asInstanceOf[Double]\n\nval customerLabel = customerLookupMap.getOrElse(customer.session,\
    \ 1).asInstanceOf[Double]\n\nVectors.dense(Array(categoryLabel, customerLabel))\n\
    \n}\n```\n\nThis first closure uses the category label map and the IP label map\
    \ and build a two-dimentional vector that make the connection between a category\
    \ and a customer type. For example, a vector can have the following value:\n\n\
    `[30.0, 3.0]`\n\nThis vector links the 29th (29+1, see mapping generator) category,\
    \ which is “Shoes”, to the third customer type, meaning gold customers.\n\nThe\
    \ test data side is shown in Listing [6-15](#A978-1-4842-1326-1_6_Chapter.html#FPar15).\n\
    \n**Listing 6-15.** Testing data creation\n\n```\nval testData = customers.map\
    \ { customer =>\n\nval categoryLookupMap = brodcastCategoryLabelMapping.value\n\
    \nval customerLookupMap = brodcastIpLabelMapping.value\n\nval categoryLabel =\
    \ categoryLookupMap.getOrElse(customer.category, 1).asInstanceOf[Double]\n\nval\
    \ customerLabel = customerLookupMap.getOrElse(customer.session, 1).asInstanceOf[Double]\n\
    \nLabeledPoint(categoryLabel, Vectors.dense(Array(categoryLabel, customerLabel)))\n\
    \n}\n```\n\nHere we create a different kind of object, a `LabelPoint`. This object\
    \ has two members:\n- some label: here I’ve set the same label than the category\n\
    - a vector: the vector is build in the same way than in the training data\n\n\
    Finally, we creat and train our model, as seen in Listing [6-16](#A978-1-4842-1326-1_6_Chapter.html#FPar16).\n\
    \n**Listing 6-16.** Create and train the model\n\n```\nval model = new StreamingKMeans()\n\
    .setK(3)\n.setDecayFactor(1.0)\n.setRandomCenters(2, 0.0)\n\nmodel.trainOn(trainingData)\n\
    ```\n\nWe specify here that we need three centroids, set a decay factor because\
    \ we are streaming data, and note that they are not linear. We need the model\
    \ to train on the most recent data with a reflection of the past data."
