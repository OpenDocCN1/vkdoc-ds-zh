    For all these layers, there are common aspects to consider to create the right
    sizing.


    *   The size of input data per day, and so on: Knowing how data will move through
    the architecture will help you estimate the amount of store that Elasticsearch
    will need. Based on the total size per node, you can estimate the size of the
    indexed data without forgetting to apply a compression rate; for example, a basic
    raw log would end up as an indexed JSON document that is bigger in terms of size.

    *   The structure of the ingested data: The data can have a simple structure such
    as Apache logs or multiple-line structure such as an application exception in
    Java.

    *   The average number of events ingested per second: This gives information on
    the memory and the CPU needed for each layer in your architecture to support the
    load.

    *   The retention period: When ingesting time-series data, sometimes it’s important
    to keep in the cluster data that is relevant for search, even if it starts to
    be old. That’s the principle of retention, and this might cost a lot of disk space
    depending on the needed period.

    *   If high availability is needed: In most enterprise use cases, you want to
    make sure that if an instance of an application fails, the overall architecture
    keeps running. Each application might have different terminology, but that’s the
    principle of resiliency. Add more servers, replicas, and instances to avoid data
    loss; service continuity brings hardware cost because obviously you don’t want
    to have several instances of your application on the same machine.


    You also have some specific sizing considerations for each application.


    *   The expected indexing throughput: Data ingestion and indexation can have an
    uneven pace, meaning you might have different load depending on the period of
    the day, such as on e-commerce web site. It’s important then to set the SLA that
    secures those kinds of uncommon but significant activities.

    *   The number of dashboards in Kibana: Remember that Kibana relies on the Elasticsearch
    API to build the visualizations that compose a dashboard. So, whenever you refresh
    a Kibana, it sends a request to Elasticsearch and generates a search or aggregation
    load that the cluster might consider if it’s significant.

    *   The number of visualization users: Depending on the use case, you might have
    a different number of users who will connect to Kibana to view the dashboard.
    This will have an effect on the sizing.


    Having all this information is not enough; you also need to experiment and analyze
    the KPI I just talked about to see whether your architecture is sustainable. A
    naïve but efficient way to do that is to start with a pseudodistributed mode architecture,
    in other words, a single instance of each application across the architecture.
    This rule doesn’t apply to Zookeeper, which needs at least three servers to be
    resilient; the same is true for Elasticsearch master nodes that are specific nodes
    dedicated to cluster state management.


    This experiment can be applied to Kafka, Elasticsearch data nodes, and Logstash
    processors/indexers. Once you get the metrics for each layer on a single-instance
    mode, scale out linearly and apply a performance test again.


    Other parameters can influence the sizing such as the number of replicas on Elasticsearch
    that augment resiliency but also search speed in a lot of use cases. Adding replicas
    increases the number of needed machines and thus your sizing.


    Figure [7-2](#A978-1-4842-1326-1_7_Chapter.html#Fig2) shows that the Lambda architecture
    has multiple scalability zones and scales out, meaning that adding more nodes
    to an application to add resilient and load support is pretty easy.


    ![A978-1-4842-1326-1_7_Fig2_HTML.jpg](A978-1-4842-1326-1_7_Fig2_HTML.jpg)


    Figure 7-2.


    Scalability zone


    The point of this section is to go through the considerations when scaling out
    a distributed architecture.


    From a provisioning point of view, since the architecture is Dockerized, it is
    easy to scale because you just need to add new containers with related configuration.


    At the ingestion level, there are no notions of the Logstash cluster so far; each
    instance consists of lightweight runtimes that scale independently. So, as you
    scale out, the main thing to do is to configure the same input to parallelize
    the workload.


    At the Elasticsearch level, when a document is indexed, it’s stored in a single
    primary shard. Elasticsearch evaluates in what shard it should index the document
    based on the formula in Listing [7-6](#A978-1-4842-1326-1_7_Chapter.html#FPar6).


    Listing 7-6.Document Routing Formula


    `shard = hash(routing) % number_of_primary_shards`


    So, adding nodes in the cluster won’t affect anything and may give a better shard
    distribution; however, adding more primary shards will invalid the previous routing
    value and will need to re-index all data to be retrieved. This starts to be an
    issue when you deal with a large amount of data that takes a lot of time to re-index.'
  trans: '

    ### 架构的规模估算与扩展


    在估算架构规模以处理特定数据量并达成特定服务等级协议（SLA）时，答案总是“视情况而定”。


    本节的目标并非提供某种万能配方或公式，让架构的每个部分都获得精确的硬件规模估算，而是为您指明方向，助您更好地应对这一问题。


    架构的规模估算在架构的不同层级均有需求：


    - 在 `Logstash` 处理和索引层面

    - 在 `Kafka`/`Zookeeper` 层面

    - 在 `Elasticsearch` 层面


    对于所有这些层面，有一些通用方面需要考虑，以进行合理的规模估算。


    - 每日输入数据的大小等：了解数据如何在架构中流动，有助于您估算 `Elasticsearch` 所需的存储量。根据每个节点的总大小，您可以估算索引数据的大小，但别忘了应用压缩率；例如，一个基础的原始日志最终会变成一个索引后的
    JSON 文档，其体积会更大。

    - 摄入数据的结构：数据可能具有简单的结构，例如 Apache 日志，也可能具有多行结构，例如 Java 应用程序异常。

    - 每秒摄入的平均事件数：这提供了有关架构中每个层面为支撑负载所需内存和 CPU 的信息。

    - 保留周期：在摄入时序数据时，有时在集群中保留与搜索相关（即使开始变旧）的数据非常重要。这就是保留原则，根据所需周期，这可能会耗费大量磁盘空间。

    - 是否需要高可用性：在大多数企业用例中，您希望确保如果某个应用程序实例发生故障，整个架构仍能继续运行。每个应用程序可能有不同的术语，但这本质上就是弹性原则。增加更多服务器、副本和实例以避免数据丢失；服务连续性会带来硬件成本，因为显然您不希望在同一台机器上运行应用程序的多个实例。


    对于每个应用程序，您还需要考虑一些特定的规模估算因素。


    - 预期索引吞吐量：数据摄入和索引的节奏可能不均，这意味着根据一天中的时段（例如在电子商务网站上），您可能会面临不同的负载。因此，设定能够保障此类不常见但重要活动的
    SLA 至关重要。

    - `Kibana` 中的仪表盘数量：请记住，`Kibana` 依赖 `Elasticsearch` API 来构建组成仪表盘的可视化图表。因此，每当您刷新
    `Kibana` 时，它都会向 `Elasticsearch` 发送请求，产生搜索或聚合负载，如果负载显著，集群需要考虑在内。

    - 可视化用户数量：根据用例不同，连接到 `Kibana` 查看仪表盘的用户数量也可能不同。这将对规模估算产生影响。


    拥有所有这些信息还不够；您还需要进行实验，分析我刚才提到的关键性能指标（KPI），以查看您的架构是否可持续。一种简单但有效的方法是，从伪分布式模式架构开始，即架构中每个应用程序都只运行一个实例。此规则不适用于需要至少三台服务器才能具备弹性的
    `Zookeeper`；同样，`Elasticsearch` 主节点（专门用于集群状态管理的特定节点）也是如此。


    这个实验可以应用于 `Kafka`、`Elasticsearch` 数据节点和 `Logstash` 处理器/索引器。一旦在单实例模式下获得了每个层面的指标，就可以线性地横向扩展，并再次进行性能测试。


    其他参数也会影响规模估算，例如 `Elasticsearch` 上的副本数量，这在许多用例中既能增加弹性，也能提高搜索速度。添加副本会增加所需的机器数量，从而影响您的规模估算。


    图 7-2 展示了 Lambda 架构具有多个可扩展区域，并且能够横向扩展，这意味着通过向应用程序添加更多节点来增加弹性和负载支持是相当容易的。


    ![A978-1-4842-1326-1_7_Fig2_HTML.jpg](img/A978-1-4842-1326-1_7_Fig2_HTML.jpg)


    *图 7-2. 可扩展区域*


    本节的重点在于探讨横向扩展分布式架构时需要考虑的各个方面。


    从资源调配的角度来看，由于架构采用了 Docker 化，扩展非常容易，您只需添加带有相关配置的新容器即可。


    在摄入层面，到目前为止还没有 `Logstash` 集群的概念；每个实例都是可以独立扩展的轻量级运行时。因此，当您横向扩展时，主要任务是配置相同的输入源以并行化工作负载。


    在 `Elasticsearch` 层面，当一个文档被索引时，它会被存储在一个单独的主分片中。`Elasticsearch` 根据清单 7-6 中的公式评估应将文档索引到哪个分片。


    *清单 7-6. 文档路由公式*


    ```

    shard = hash(routing) % number_of_primary_shards

    ```


    因此，在集群中添加节点不会对现有数据产生任何影响，并可能实现更好的分片分配；然而，增加更多的主分片将使先前的路由值失效，并且需要重新索引所有数据才能检索。当您处理大量数据时，重新索引将耗费大量时间，这就会成为一个问题。

