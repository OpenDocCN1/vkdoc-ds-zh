- fmt: '### Adding Machine Learning to Our Architecture


    The `K-means` algorithm is part of the unsupervised machine learning algorithm.
    It’s one of the most used when it comes to data clustering, and also one of the
    simplest.


    `K-means` allows us to classify a given data set in a `K` cluster; each cluster
    has a center called the centroid. For a given data, we define `K` centroids, possibly
    as far as possible from each other, then associate the data point to the nearest
    centroid to make an early groupage of the data.


    Each centroid needs to be recalculated in conjunction with the previous data points
    that have joined the cluster, which will give `K` new centroids or cluster barycenters.
    After recalculating each centroid, all data points are again associated to the
    nearest centroid. And the recalculation is done again until the centroids don’t
    move any more.


    Here are the main steps illustrated by following figures:


    We first need a dataset:


    ![A978-1-4842-1326-1_6_Fig5_HTML.jpg](A978-1-4842-1326-1_6_Fig5_HTML.jpg)


    Figure 6-5. Dataset to be clustered


    We then place `K` centroids in the two-dimensional space to represent our cluster
    center:


    ![A978-1-4842-1326-1_6_Fig6_HTML.jpg](A978-1-4842-1326-1_6_Fig6_HTML.jpg)


    Figure 6-6. Centroids added to represent clusters


    This splits the space into colored regions, with each color associated to the
    centroid color. Each data point is associated with the closest centroid, which
    gives us the early groupage. Then we start recalculating the centroid position
    relative to the data points: As you can see in Figure [6-7](#A978-1-4842-1326-1_6_Chapter.html#Fig7),
    the centroids changed position and got closer to the data points clumps.


    ![A978-1-4842-1326-1_6_Fig7_HTML.jpg](A978-1-4842-1326-1_6_Fig7_HTML.jpg)


    Figure 6-7. First recalculation phase


    At the end of the recalculation phase, the centroids don’t move any more, as the
    following objective function has been minimize to its maximum:


    ![ $$ J={\displaystyle \sum_{j=1}^k{\displaystyle \sum_{i=1}^n\left|\right|{x}_i^j}-{c}_j\left|\right|{}^2}
    $$ ](A978-1-4842-1326-1_6_Chapter_TeX2GIF_Equa.gif)


    where ![ $$ \left|\right|{\mathrm{x}}_{\mathrm{j}}^{\mathrm{i}}-{\mathrm{c}}_{\mathrm{j}}\left|\right|{}^2
    $$ ](A978-1-4842-1326-1_6_Chapter_TeX2GIF_IEq1.gif) is the square distance between
    a data point `x[i]^j` and the closest centroid `c[j]`.


    At the end, the clustering looks slightly different, as shown in Figure [6-8](#A978-1-4842-1326-1_6_Chapter.html#Fig8).


    ![A978-1-4842-1326-1_6_Fig8_HTML.jpg](A978-1-4842-1326-1_6_Fig8_HTML.jpg)


    Figure 6-8. Final clustering state


    For visualizing data I’m using this awesome and very practical website: [`http://www.naftaliharris.com/blog/visualizing-k-means-clustering/`](http://www.naftaliharris.com/blog/visualizing-k-means-clustering/)


    Figure [6-8](#A978-1-4842-1326-1_6_Chapter.html#Fig8) may make more sense if we
    add a bit more reality to it:


    ![A978-1-4842-1326-1_6_Fig9_HTML.jpg](A978-1-4842-1326-1_6_Fig9_HTML.jpg)


    Figure 6-9. World split with K-means


    Look how you could easily split the world based on the criteria of your choice
    with the help of `K-means`!


    So I guess this makes more sense now when we correlate this to our current clickstream
    use case. We want to build a machine learning pipeline that clusters the clickstream
    data into classified customer behavior.


    ## Adding Machine Learning to Our Architecture


    We will now add machine learning to our lambda architecture. This will be progressive
    as we need to work on our data first, then on the learning model, and finally
    on the prediction.


    By adding machine learning to the architecture, what we want to achieve is user
    behavior real-time analysis and prediction. We’ll use a machine learning pipeline
    that we’ll help up to classify our website visitors in order to push product recommendations
    based on previous browsing behavior.


    The general idea for processing this includes:


    - Enriching our data as they are streamed: we will basically add more business
    meaning to our data by simply tagging them with the help of an extra data source.

    - Training a classifier, which means that we need to setup a model in order to
    learn from the data based on a statistics algorithm.

    - Predicting using our model.


    ### Enriching the Clickstream Data


    Before diving into pure machine learning we need to add more business sense to
    our use case. We’ll use Spark to achieve this task and leverage the highly resilient
    and distributed nature of the technology. The strategy is to load a map of data
    that represents a mapping between the browser URI and the product category, which
    basically will give us the category of the product browsed by the visitor, as
    shown in Figure [6-10](#A978-1-4842-1326-1_6_Chapter.html#Fig10).


    ![A978-1-4842-1326-1_6_Fig10_HTML.jpg](A978-1-4842-1326-1_6_Fig10_HTML.jpg)


    Figure 6-10. Product mapping


    This is indeed a very short mapping example, which can be loaded and held in memory
    in Spark without expecting any overhead. In a real-life use case, the mapping
    would probably have a significant size that would not be safe to hold in memory.
    In this case, I would use a persistent store such as HDFS, or even, in Elasticsearch.
    The reason to store it in ES would probably be to ease the search of the appropriate
    mapping. In this example, we will create a simple CSV file.


    The process of enriching the data is shown in Figure [6-11](#A978-1-4842-1326-1_6_Chapter.html#Fig11).


    ![A978-1-4842-1326-1_6_Fig11_HTML.jpg](A978-1-4842-1326-1_6_Fig11_HTML.jpg)


    Figure 6-11. Enrichment diagram


    The data are like those discussed in the previous chapter fetched in Spark, but
    the difference here is that we’ll:


    - create a customer object

    - compare those data with ours in memory mapping

    - enrich our customer objects

    - index them in Elasticsearch


    To do so, we’ll create another Scala project called `spark-enrich-and-ml`, which
    can be found in my Github account:


    [`https://github.com/bahaaldine/spark-enrich-and-ml`](https://github.com/bahaaldine/spark-enrich-and-ml)'
