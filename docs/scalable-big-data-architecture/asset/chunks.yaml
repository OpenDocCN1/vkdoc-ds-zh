    `"total": 2843774,`


    `"max_score": 0,`


    `"hits": []`


    `},`


    `"aggregations": {`


    `"by_stats": {`


    `"count": 2843774,`


    `"min": 2086,`


    `"max": 4884,`


    `"avg": 3556.769230769231,`


    `"sum": 3932112564`


