    part.'
  trans: "\n### 实现 Spark Streamer\n\n在现有架构中引入 Spark 并不需要修改我们在第 4 章中已经看到的内容；只需为我们的\
    \ Kafka 点击流主题添加一个新的消费者，如图 5-2 所示。\n\n![A978-1-4842-1326-1_5_Fig2_HTML.jpg](img/A978-1-4842-1326-1_5_Fig2_HTML.jpg)\n\
    \n**图 5-2.** 将 Spark Kafka 流式处理添加到我们的架构中\n\n我们的 Spark 驱动程序应该能够连接到 Kafka 并消费数据流。为此，我们将配置一个名为\
    \ `StreamingContext` 的特殊 Spark 上下文，如代码清单 5-12 所示。\n\n**代码清单 5-12.** 配置 Spark Streaming\
    \ 上下文\n\n```\nval sparkConf = new SparkConf().setAppName(\"KafkaStreamerToElasticsearch\
    \ \")\nsparkConf.set(\"es.index.auto.create\", \"true\")\nval ssc = new StreamingContext(sparkConf,\
    \ Seconds(2))\n```\n\n如您所见，上下文配置与之前的 Spark 驱动程序示例基本相同，区别如下：\n\n- 我们使用 `es.index.auto.create`\
    \ 选项来确保在数据索引时，索引会自动在 Elasticsearch 中创建。\n- 我们将 `StreamingContext` 的批处理间隔设置为 2\
    \ 秒，这意味着数据将每隔 2 秒从 Kafka 主题流式传输一次。\n\n我们现在需要配置要从哪些代理（brokers）和哪些主题（topics）接收数据，然后在这两者之间创建流式传输线路，如代码清单\
    \ 5-13 所示。\n\n**代码清单 5-13.** 连接 Spark 和 Kafka\n\n```\nval Array(brokers, topics)\
    \ = args\nval topicsSet = topics.split(\",\").toSet\nval kafkaParams = MapString,\
    \ String\nval messages = KafkaUtils.createDirectStreamString, String, StringDecoder,\
    \ StringDecoder\n```\n\n`args` 变量包含运行驱动程序时传递给它的参数。代理列表和主题列表都用逗号分隔。解析后，使用 Spark\
    \ 流式框架（`org.apache.spark.streaming` 包）提供的 `KafkaUtils` 类在 Kafka 和 Spark 之间创建直接流。在我们的示例中，所有消息都接收在\
    \ `messages` 变量中。\n\n此时，我们应该能够使用代码清单 5-14 中的 `map` 函数输出每条流式传输的点击流日志行。\n\n**代码清单\
    \ 5-14.** 映射并打印行\n\n```\nval lines = messages.map(_._2)\nlines.print();\n```\n\
    \n前面几行中有几点需要留意：\n\n- `messages` 变量是一个包含流式数据的 RDD。\n- `_` 语法表示匿名函数中的一个参数，如代码清单\
    \ 5-15 所示。\n\n**代码清单 5-15.** Spark `map` 函数简化语法\n\n```\nmap(_._2)\n```\n\n这等价于代码清单\
    \ 5-16 中所示的一行，其中 `_2` 是 `x` 元组的第二个元素。\n\n**代码清单 5-16.** Spark `map` 函数完整语法\n\n\
    ```\nmap(x => x._2)\n```\n\n要运行驱动程序，我们首先要使用 Maven 构建它。运行以下命令来编译 Scala 代码并将其打包成一个\
    \ JAR：\n\n```\nmvn scala:compile package\n```\n\n请注意，对于该驱动程序，我使用的是 Scala 2.10.5，它需要\
    \ Java 7 才能运行：\n\n```\nexport JAVA_HOME=/Library/Java/JavaVirtualMachines/jdk1.7.0_21.jdk/Contents/Home/\n\
    ```\n\n编译并打包后，您应该在项目的 `target` 目录中得到两个 JAR 文件：\n\n- `spark-scala-streamer-1.0.0.jar`：仅包含编译后的项目类。\n\
    - `spark-scala-streamer-1.0.0-jar-with-dependencies.jar`：包含编译后的类和项目依赖项。\n\n我们将使用与上一部分略有不同的方法来运行驱动程序：使用标准\
    \ Spark 发行版中的 `spark-submit` 可执行文件，该发行版可从此处下载：\n\n[`http://spark.apache.org/downloads.html`](http://spark.apache.org/downloads.html)\n\
    \n在撰写本文时，我使用的是 1.4.0 版本。下载后，我建议您只需将 Spark 二进制文件添加到您的 `PATH` 环境变量中，如代码清单 5-17 所示。\n\
    \n**代码清单 5-17.** 将 Spark 二进制文件添加到 `PATH` 环境变量\n\n```\nexport SPARK_HOME=/Applications/spark-1.4.0/bin\n\
    export PATH=$SPARK_HOME:$PATH\n```\n\n这将简化对所有 Spark 可执行文件的访问，包括 `spark-submit`，您可以像代码清单\
    \ 5-18 中那样使用它来执行我们之前的程序。\n\n**代码清单 5-18.** 使用 `spark-submit` 运行 Spark 驱动程序\n\n\
    ```\nspark-submit --class org.apress.examples.chapter4.KafkaStreamer \\\n  --master\
    \ local[1] \\\n  target/spark-scala-streamer-1.0.0-jar-with-dependencies.jar \\\
    \n  localhost:9092,localhost:9093 clickstream\n```\n\n如您所见，我们将 `KafkaStreamer`（它属于我们刚刚创建的\
    \ JAR）传递给 `spark-submit`。我们使用带有依赖项的 JAR，否则 Spark 将找不到所需的类，您很可能会遇到“找不到类”异常。在命令末尾，您可能已经认出了包含代理列表（我们要连接的目标）和主题（我们要从中流式传输数据的目标）的参数。运行此命令会启动\
    \ Spark 并监听传入消息，因此请使用我们在上一部分中使用的生成器生成日志行，并确保流式处理管道正在运行以便将消息推送到 Kafka 中。您应该在控制台中看到一些行输出，如代码清单\
    \ 5-19 所示。\n\n**代码清单 5-19.** Spark 流式传输的数据示例\n\n```\n-------------------------------------------\n\
    Time: 1437921302000 ms\n-------------------------------------------\n{\"message\"\
    :\"10.10.10.11 - - [10/Oct/2013:00:04:02 +0000] \\\"GET /page3 HTTP/1.0\\\" 200\
    \ 4401 \\\"http://www.amazon.com\\\" \\\"Mozilla/5.0 (Windows; U; Windows NT 6.1;\
    \ rv:2.2) Gecko/20110201\\\" \",\"@version\":\"1\",\"@timestamp\":\"2015-07-26T14:35:00.869Z\"\
    ,\"file\":\"/tmp/source/access_log_20150726-163457.log\",\"host\":\"ea8fceb4f5b0\"\
    ,\"offset\":\"0\",\"type\":\"access_log\",\"clientip\":\"10.10.10.11\",\"ident\"\
    :\"-\",\"auth\":\"-\",\"timestamp\":\"10/Oct/2013:00:04:02 +0000\",\"verb\":\"\
    GET\",\"request\":\"/page3\",\"httpversion\":\"1.0\",\"response\":\"200\",\"bytes\"\
    :\"4401\",\"referrer\":\"\\\"http://www.amazon.com\\\"\",\"agent\":\"\\\"Mozilla/5.0\
    \ (Windows; U; Windows NT 6.1; rv:2.2) Gecko/20110201\\\"\"}\n{\"message\":\"\
    10.10.10.15 - - [10/Oct/2013:00:05:44 +0000] \\\"POST /page6 HTTP/1.0\\\" 200\
    \ 2367 \\\"http://www.bing.com\\\" \\\"Mozilla/5.0 (Linux; U; Android 2.3.5; en-us;\
    \ HTC Vision Build/GRI40) AppleWebKit/533.1 (KHTML, like Gecko) Version/4.0 Mobile\
    \ Safari/533.1\\\" \",\"@version\":\"1\",\"@timestamp\":\"2015-07-26T14:35:00.869Z\"\
    ,\"file\":\"/tmp/source/access_log_20150726-163457.log\",\"host\":\"ea8fceb4f5b0\"\
    ,\"offset\":\"167\",\"type\":\"access_log\",\"clientip\":\"10.10.10.15\",\"ident\"\
    :\"-\",\"auth\":\"-\",\"timestamp\":\"10/Oct/2013:00:05:44 +0000\",\"verb\":\"\
    POST\",\"request\":\"/page6\",\"httpversion\":\"1.0\",\"response\":\"200\",\"\
    bytes\":\"2367\",\"referrer\":\"\\\"http://www.bing.com\\\"\",\"agent\":\"\\\"\
    Mozilla/5.0 (Linux; U; Android 2.3.5; en-us; HTC Vision Build/GRI40) AppleWebKit/533.1\
    \ (KHTML, like Gecko) Version/4.0 Mobile Safari/533.1\\\"\"}\n```\n\n现在，我们代码的流式处理部分已经运行，我们可以专注于索引部分了。\n"
- fmt: "### Implementing a Spark Indexer\n\nThe indexing part is the last part of\
    \ our driver but, surprisingly, we are not pushing its configuration to the last\
    \ step.\n\nWhat we will do here is just make sure that each clickstream event\
    \ that we consume can be indexed in ElasticSearch. The clickstream events are\
    \ actually JSON received in string stream; we then need to parse the string, marshal\
    \ to JSON RDD, and then create a RDD of `Clickstream` object.\n\nLet’s first defined\
    \ our `Clickstream` object as shown in Listing [5-20](#A978-1-4842-1326-1_5_Chapter.html#FPar22).\n\
    \nListing 5-20. Clickstream object\n\n```\ncase class Clickstream (\n   message:String,\n\
    \   version:String,\n   file:String,\n   host:String,\n   offset:String,\n   eventType:String,\n\
    \   clientip:String,\n   ident:String,\n   auth:String,\n   timestamp:String,\n\
    \   verb:String,\n   request:String,\n   httpVersion:String,\n   response:String,\n\
    \   bytes:Integer,\n   referrer:String,\n   agent: String\n)\n```\n\nExcept for\
    \ the `bytes`, we assume that every field are `String`s. Let’s now parse our lines\
    \ of JSON String as shown in Listing [5-21](#A978-1-4842-1326-1_5_Chapter.html#FPar23).\n\
    \nListing 5-21. Spark parse line\n\n```\nval parsedEvents =\nlines.map(JSON.parseFull(_))\n\
    \     .map(_.get.asInstanceOf[scala.collection.immutable.Map[String,Any]])\n```\n\
    \nLines are processed in two steps:\n\n*   each lines is parsed using `JSON.parseFull`\n\
    *   for each JSON, RDD are transformed into a map of key and value.\n\nFinally,\
    \ clickstream events RDD are pulled out from the `parsedEvents` variable as shown\
    \ in Listing [5-22](#A978-1-4842-1326-1_5_Chapter.html#FPar24).\n\nListing 5-22.\
    \ Spark Clickstream object parsing\n\n```\nval events = parsedEvents.map(data=>Clickstream(\n\
    \   data(\"message\").toString\n   ,data(\"@version\").toString\n   ,data(\"file\"\
    ).toString\n   ,data(\"host\").toString\n   ,data(\"offset\").toString\n   ,data(\"\
    type\").toString\n   ,data(\"clientip\").toString\n   ,data(\"ident\").toString\n\
    \   ,data(\"auth\").toString\n   ,data(\"timestamp\").toString\n   ,data(\"verb\"\
    ).toString\n   ,data(\"request\").toString\n   ,data(\"httpversion\").toString\n\
    \   ,data(\"response\").toString\n   ,Integer.parseInt(data(\"bytes\").toString)\n\
    \   ,data(\"referrer\").toString\n   ,data(\"agent\").toString\n))\n```\n\nWe\
    \ simply make a mapping between each parsed event Map and new Clickstream event\
    \ object. Then at the end we index the data using the Elasticsearch Hadoop connector\
    \ as shown in Listing [5-23](#A978-1-4842-1326-1_5_Chapter.html#FPar25).\n\nListing\
    \ 5-23. Clickstream events indexed into Elasticsearch\n\n```\nevents.foreachRDD{\
    \ rdd =>\nif (rdd.toLocalIterator.nonEmpty) {\n          EsSpark.saveToEs(rdd,\
    \ \"spark/clickstream\")\n        }\n}\n```\n\nI’m creating a different index\
    \ than the one created by Logstash in the previous chapter. The data are in the\
    \ `spark` index under the `clickstream` type.\n\nYou can find more information\
    \ on the Elasticsearch Hadoop connector at this link:\n\n[`https://www.elastic.co/guide/en/elasticsearch/hadoop/current/index.html`](https://www.elastic.co/guide/en/elasticsearch/hadoop/current/index.html)\n\
    \nAt this point you should be able to index in Elasticsearch after generating\
    \ data, like in Figure [5-3](#A978-1-4842-1326-1_5_Chapter.html#Fig3).\n\n![A978-1-4842-1326-1_5_Fig3_HTML.jpg](A978-1-4842-1326-1_5_Fig3_HTML.jpg)\n\
    \nFigure 5-3. Clickstream events in the spark index\n\nAs you can see, I’m using\
    \ Elasticsearch search API to fetch data from the `spark` index; as a result,\
    \ I’m getting 55 clickstream events from the index.\n\n### Implementing a Spark\
    \ Data Processing\n\nThat may look weird to end with part, but I prefer that the\
    \ streaming to pipe be ready to work before diving on the core usage of Spark,\
    \ the data processing.\n\nWe will now add a little bit more processing logic to\
    \ our previous Spark code and introduce a new object: the `PageStatistic` object.\
    \ This object will hold all the statistics that we want to have around user behavior\
    \ on our website. We’ll limit the example to a basic one; in the next chapter,\
    \ we’ll will go deeper.\n\nThe processing part will be then be divided into the\
    \ following parts:\n\n*   creation on a simple `PageStatistic` object that holds\
    \ the statistics\n*   computation of statistic\n*   indexation part\n\nLet’s first\
    \ begin with the `PageStatistic` object, which so far will only hold the count\
    \ of GET and POST request, as shown in Listing [5-24](#A978-1-4842-1326-1_5_Chapter.html#FPar26).\n\
    \nListing 5-24. PageStatistic object definition\n\n```\ncase class PageStatistic\
    \ (\n  getRequest:Long,\n  postRequest:Long\n)\n```\n\nThen we’ll use a special\
    \ from Spark scala library call `countByValue` to compute the number of GET and\
    \ POST in the batch of logs we receive from Kafka as seen in Listing [5-25](#A978-1-4842-1326-1_5_Chapter.html#FPar27).\n\
    \nListing 5-25. Compute count of GET and POST using countByValue\n\n```\nval requestMap\
    \ = events\n  .map(event => event.verb)\n  .countByValue()\n  .map(x=>x.productIterator.collect{case\
    \ (a,b) => (a -> b)}.toMap.withDefaultValue(0L));\n\nval requests = requestMap.map(data\
    \ => PageStatistic(\n  data(\"GET\").asInstanceOf[Long],\n  data(\"POST\").asInstanceOf[Long]\n\
    ));\n```\n\nIn this code, we simply take each received event and apply the `countByValue`\
    \ function on it. Then we create a map with a default value of 0, which we iterate\
    \ on to pull out `PageStatistic` objects.\n\nFinally, we index the data in Elasticsearch\
