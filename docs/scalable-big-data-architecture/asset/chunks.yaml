    \  _type: \"prediction\",\n  _id: \"AU-A58AEIm6jDjOublw7\",\n  _score: 1,\n  _source:\
    \ {\n    _1: 8,\n    _2: 1\n  }\n}\n...\n```\n\n现在您只需发挥想象力，思考如何利用这些数据改善网站访客的用户体验。您可以基于此构建推荐引擎，向“早鸟”客户推送第\
    \ 23 类（即“音乐”类，24+1，参见映射生成器）相关的横幅、应用内通知和邮件。\n\n## 本章小结\n\n我们的架构正变得越来越复杂。本章介绍了如何通过机器学习功能丰富数据处理管道，并在数据传入\
    \ Elasticsearch 时进行聚类。\n\n下一章将讨论治理以及为降低生产风险应建立的主要资产。\n\n# 7. 治理考量\n\n架构的核心要素之一是其治理方式。换言之，如何规划规模、部署及事件监控？本章将从架构的“Docker\
    \ 化”入手探讨治理考量，同时讨论可扩展性及其对架构的影响。\n\n## 架构的 Docker 化\n\n部署数据架构有多种方式：可以将组件安装在分布式物理机或虚拟机上。近年来，Docker\
    \ 已成为分布式架构部署的标准，因此本书将使用 Docker 作为示例场景的部署方案。\n\n### Docker 简介\n\nDocker 是一个开源平台，允许用户缩短从开发阶段到生产阶段的部署周期。它提供了一套全面的工具和\
    \ API，帮助您构建运行应用程序的基础设施。\n\n针对本书的使用场景，您将能够通过 Docker 容器部署完整架构。Docker 拥有自己的术语体系，定义如下：\n\
    \n- **Docker 容器**：运行应用程序的最小工作单元。例如，可以有一个运行 Apache Tomcat 服务器以提供 RESTful API 的\
    \ Docker 容器。\n- **Docker 镜像**：描述 Docker 容器的镜像文件。在此示例中，您需要一个操作系统和一些软件包来运行 Tomcat。所有必需的资源和配置都写入名为\
    \ `Dockerfile` 的只读模板中，该模板即 Docker 镜像。有关 Docker 镜像的更多信息，请参阅 [`https://docs.docker.com/userguide/dockerimages/`](https://docs.docker.com/userguide/dockerimages/)。\n\
    - **Docker 客户端**：与底层 Docker 功能交互的首要用户界面。编写 Docker 镜像后，您将通过构建镜像来运行 Docker 容器。这是使用\
    \ Docker 客户端完成的操作。有关 Docker 命令行的更多信息，请参阅 [`https://docs.docker.com/reference/commandline/cli/`](https://docs.docker.com/reference/commandline/cli/)。\n\
    - **Docker 守护进程**：协调运行 Docker 容器所需的所有底层操作。用户通过 Docker 客户端与守护进程交互。\n\n图 7-1 总结了我刚才描述的内容。\n\
    \n![A978-1-4842-1326-1_7_Fig1_HTML.jpg](img/A978-1-4842-1326-1_7_Fig1_HTML.jpg)\n\
    \n**图 7-1.** Docker 组件\n\n因此，在示例场景中，如果关注涉及多种技术的数据处理部分，Docker 在运行和配置基础设施方面具有巨大优势。您基本上只需要为每个需要在不同容器上运行的技术创建\
    \ Docker 镜像，包括以下内容：\n\n- Logstash 转发器\n- Logstash（处理器和索引器使用相同技术，仅配置不同）\n- Kafka\n\
    - Zookeeper\n- Elasticsearch\n- Kibana\n\n### 安装 Docker\n\nDocker 支持多种安装配置。例如，在本书范围内，我在\
    \ Mac OS X 上运行 Docker，其安装步骤与 Ubuntu 略有不同。\n\n建议您访问以下页面，按照适合您系统的安装流程进行操作：\n\n[`https://docs.docker.com/installation/`](https://docs.docker.com/installation/)\n\
    \n您还需要 Docker Compose，可在此处获取：\n\n[`https://docs.docker.com/compose/install/`](https://docs.docker.com/compose/install/)\n\
    \n您还需要 Docker Machine，可在此处获取：\n\n[`https://docs.docker.com/machine/install-machine/`](https://docs.docker.com/machine/install-machine/)\n\
    \n完成安装后，请通过执行代码清单 7-1 中的命令，确保可以运行 Docker 和 Docker Compose 命令行。\n\n**代码清单 7-1.**\
    \ Docker 安装检查\n\n```\nbash-3.2$ docker -v\nDocker version 1.7.1, build 786b29d\n\
    bash-3.2$ docker-compose -v\ndocker-compose version: 1.3.2\nCPython version: 2.7.9\n\
    OpenSSL version: OpenSSL 1.0.1j 15 Oct 2014\nbash-3.2$ docker-machine -v\ndocker-machine\
    \ version 0.3.0 (0a251fe)\n```\n\n从以上代码中，您可以看到我编写本书时使用的 Docker 组件版本。\n\n至此，您已准备好开始创建基础设施的\
    \ Docker 镜像。\n\n### 创建 Docker 镜像\n\n在本节中，我将详细说明如何为您的架构应用程序之一创建 Docker 镜像。您会发现，其他应用程序的整体流程都是相同的，因此我只描述其中一个镜像的创建过程。\n\
    \n供您参考，您可以在我的 GitHub 仓库中找到所有镜像：\n\n- Elasticsearch: [`https://github.com/bahaaldine/docker-elasticsearch`](https://github.com/bahaaldine/docker-elasticsearch)\n\
    - Logstash: [`https://github.com/bahaaldine/docker-logstash`](https://github.com/bahaaldine/docker-logstash)\n\
    - Logstash 转发器: [`https://github.com/bahaaldine/docker-logstash-forwarder`](https://github.com/bahaaldine/docker-logstash-forwarder)\n\
    - Kibana: [`https://github.com/bahaaldine/docker-kibana`](https://github.com/bahaaldine/docker-kibana)\n\
    - Zookeeper: [`https://github.com/bahaaldine/docker-zookeeper`](https://github.com/bahaaldine/docker-zookeeper)\n\
    - Apache Kafka: [`https://github.com/bahaaldine/docker-kafka`](https://github.com/bahaaldine/docker-kafka)\n\
    - 用于 Kafka 的 Apache Zookeeper: [`https://github.com/bahaaldine/docker-zookeeper`](https://github.com/bahaaldine/docker-zookeeper)\n\
    - Apache Spark: [`https://github.com/bahaaldine/docker-spark`](https://github.com/bahaaldine/docker-spark)\n\
    \n现在让我们聚焦于创建 Elasticsearch Docker 镜像，并逐步分析 `Dockerfile` 文件，该文件位于以下链接：\n\n[`https://github.com/bahaaldine/docker-elasticsearch/blob/master/Dockerfile`](https://github.com/bahaaldine/docker-elasticsearch/blob/master/Dockerfile)\n\
    \n该模板分为多个部分，每个部分负责特定的任务。\n"
- fmt: "- **The image configuration**: You start by setting the container type, which\
    \ is a Java container here, that will run Elasticsearch, and you set a couple\
    \ of description metadata tags. Here is the maintainer:\n  ```\n  FROM java:8\n\
    \  MAINTAINER Bahaaldine Azarmi baha@elastic.co\n  ```\n\n- **The OS-level configuration**:\
    \ Then you create the OS-level configuration by setting the needed environment\
    \ variable, upgrading your container package list, and installing the needed packages.\n\
    \  ```\n  ENV DEBIAN_FRONTEND noninteractive\n  RUN apt-get update\n  RUN apt-get\
    \ install -y supervisor curl\n  # Elasticsearch\n  RUN \\\n      apt-key adv --keyserver\
    \ pool.sks-keyservers.net --recv-keys 46095ACC8548582C1A2699A9D27D666CD88E42B4\
    \ && \\\n      if ! grep \"elasticsearch\" /etc/apt/sources.list; then echo \"\
    deb http://packages.elasticsearch.org/elasticsearch/1.6/debian stable main\" >>\
    \ /etc/apt/sources.list;fi && \\\n      apt-get update\n  ```\n\n- **The application-level\
    \ installation**: Installation is pretty and just requires you to run the following\
    \ command:\n  ```\n  apt-get install -y elasticsearch\n  ```\n\n- **The application\
    \ configuration**: You then run a couple of `sed` commands to modify the Elasticsearch\
    \ configuration file (`elasticsearch.yml`) to set your cluster configuration.\
    \ In the following code, you are setting the cluster name, the path to the directory\
    \ where Elasticsearch will store its data, the number of shards and replicas,\
    \ and a network configuration for publishing the proper host:\n  ```\n  sed -i\
    \ '/#cluster.name:.*/a cluster.name: logging' /etc/elasticsearch/elasticsearch.yml\
    \ && \\\n  sed -i '/#path.data: \\/path\\/to\\/data/a path.data: /data' /etc/elasticsearch/elasticsearch.yml\
    \ && \\\n  sed -i '/#index.number_of_shards:.*/a index.number_of_shards: 1' /etc/elasticsearch/elasticsearch.yml\
    \ && \\\n  sed -i '/#index.number_of_replicas:.*/a index.number_of_replicas: 0'\
    \ /etc/elasticsearch/elasticsearch.yml && \\\n  sed -i '/#marvel.index.number_of_replicas:.*/a\
    \ index.number_of_replicas: 0' /etc/elasticsearch/elasticsearch.yml && \\\n  sed\
    \ -i '/#network.publish_host:.*/a network.publish_host: elasticsearch' /etc/elasticsearch/elasticsearch.yml\n\
    \  ```\n\n- **The application runtime configuration**: You use [Supervisor](http://supervisord.org/),\
    \ a process control system, here to orchestrate the execution of the applications\
    \ installed in the container. So, you need to create the configuration to make\
    \ sure it works. Then you install Marvel, an Elasticsearch monitoring plug-in,\
    \ and expose the 9200 port to the container outside.\n  ```\n  ADD etc/supervisor/conf.d/elasticsearch.conf\
    \ /etc/supervisor/conf.d/elasticsearch.conf\n  RUN /usr/share/elasticsearch/bin/plugin\
    \ -i elasticsearch/marvel/latest\n  EXPOSE 9200\n  ```\n\n- **The container runtime\
    \ configuration**: The last step is to ask Supervisor to run using the Supervisor\
    \ configuration file.\n  ```\n  CMD [ \"/usr/bin/supervisord\", \"-n\", \"-c\"\
    , \"/etc/supervisor/supervisord.conf\" ]\n  ```\n\nIf you check the other Docker\
    \ images, you will see that a few are changing from one image to the another,\
    \ as I’m always using these steps to create my Docker images.\n\nYou have to build\
    \ a Docker image for it to be used. To build the Elasticsearch image, run the\
    \ following command in the Docker image folder:\n\n```\ndocker build -t bahaaldine/docker-elasticsearch\
    \ .\n```\n\nThe `build` command will search for a `Dockerfile` file in the current\
    \ directory and start building a Docker image called `bahaaldine/docker-elasticsearch`\
    \ (although you can change the name if you’d like); in any case, you can check\
    \ your local image repository by issuing the following image and see whether your\
    \ image is there:\n\n```\nbash-3.2$ docker images\n\nREPOSITORY              \
    \           TAG     IMAGE ID            CREATED            VIRTUAL SIZE\nbahaaldine/docker-elasticsearch\
    \   latest  a3422c874201        About a minute ago  877.4 MB\n```\n\nNow to spin\
    \ up your container, run the following command:\n\n```\nbash-3.2$ docker run -ti\
    \ -p 9200:9200 -p 9300:9300 --add-host=\"elasticsearch:192.168.59.103\" bahaaldine/docker-elasticsearch\n\
    \n2015-08-23 13:33:24,689 CRIT Supervisor running as root (no user in config file)\n\
    2015-08-23 13:33:24,689 WARN Included extra file \"/etc/supervisor/conf.d/elasticsearch.conf\"\
    \ during parsing\n2015-08-23 13:33:24,697 INFO RPC interface 'supervisor' initialized\n\
    2015-08-23 13:33:24,697 CRIT Server 'unix_http_server' running without any HTTP\
    \ authentication checking\n2015-08-23 13:33:24,697 INFO supervisord started with\
    \ pid 1\n2015-08-23 13:33:25,701 INFO spawned: 'elasticsearch1' with pid 7\n2015-08-23\
    \ 13:33:27,331 INFO success: elasticsearch1 entered RUNNING state, process has\
    \ stayed up for > than 1 seconds (startsecs)\n```\n\nThe Elasticsearch container\
    \ is now running and exposes ports 9200 and 9300 on same ports on the host machine,\
    \ which means that if you try to connect to `192.168.59.103:9200`, you should\
    \ get the Elasticsearch REST API response, as shown in Listing 7-2.\n\n**Listing\
    \ 7-2.** Elasticsearch Installation Check\n\n```\n{\n  status: 200,\n  name: \"\
    lambda-architecture\",\n  cluster_name: \"logging\",\n  version: {\n    number:\
    \ \"1.6.2\",\n    build_hash: \"622039121e53e5f520b5ff8720fdbd3d0cb5326b\",\n\
    \    build_timestamp: \"2015-07-29T09:24:47Z\",\n    build_snapshot: false,\n\
    \    lucene_version: \"4.10.4\"\n  },\n  tagline: \"You Know, for Search\"\n}\n\
    ```\n\nA couple of questions came to my mind the first time I was trying to Dockerize\
    \ my architecture: What if I have a ten-node cluster? What about the rest of the\
    \ architecture? Will I have to run every container with a specific configuration\
    \ at the command line?\n\nYou clearly understand the benefit of Dockerizing your\
    \ architecture application, but it would be a nightmare to manage it if you have\
    \ to take of each container. That’s where Docker Compose comes into play."
