- fmt: "### Processing the Data\n\nData transformations are often handled by ETL tools\
    \ when you want a pure transformation from a source to a target. Tools such as\
    \ `Talend`, `Pentaho`, `Informatica`, or `IBM Datastage` are the most commonly\
    \ used software in Big Data projects. But still, they are not self-sufficient,\
    \ and you will need some complementary tools (such as `Sqoop`) for simply importing\
    \ or exporting the data. In any case, multiple tools are used to ingest the data,\
    \ and what they have in common is the target: `HDFS`. `HDFS` is the entry point\
    \ in Hadoop distribution; data needs somehow to be stored in this file system\
    \ in order to be processed by high-level applications and projects.\n\nWhen the\
    \ data is stored on `HDFS`, then how do you access and process it? This is what\
    \ `Hive`, for example, can do. It creates a structure on top of the files stored\
    \ in `HDFS` to make it easier to access the files. The structure itself is like\
    \ a table in a database. For example, Listing [3-2](#A978-1-4842-1326-1_3_Chapter.html#FPar2)\
    \ shows a structure that can be created for the preceding tweet example.\n\n**Listing\
    \ 3-2.** Hive Tweet Structure\n\n```sql\ncreate table tweets (\n  created_at string,\n\
    \  entities struct <\n    hashtags: array<struct<text: string>>,\n    media: array<struct<media_url:\
    \ string, media_url_https: string, sizes: array<struct<url: string>>>>,\n    urls:\
    \ array<struct<url: string>>,\n    user_mentions: array<struct<name: string, screen_name:\
    \ string>>\n  >,\n  geo struct <\n    coordinates: array<float>,\n    type: string\n\
    \  >,\n  id bigint,\n  id_str string,\n  in_reply_to_screen_name string,\n  in_reply_to_status_id\
    \ bigint,\n  in_reply_to_status_id_str string,\n  in_reply_to_user_id int,\n \
    \ in_reply_to_user_id_str string,\n  retweeted_status struct <\n    created_at:\
    \ string,\n    entities: struct <\n      hashtags: array<struct<text: string>>,\n\
    \      media: array<struct<media_url: string, media_url_https: string, sizes:\
    \ array<struct<url: string>>>>,\n      urls: array<struct<url: string>>,\n   \
    \   user_mentions: array<struct<name: string, screen_name: string>>\n    >,\n\
    \    geo: struct <\n      coordinates: array<float>,\n      type: string\n   \
    \ >,\n    id: bigint,\n    id_str: string,\n    in_reply_to_screen_name: string,\n\
    \    in_reply_to_status_id: bigint,\n    in_reply_to_status_id_str: string,\n\
    \    in_reply_to_user_id: int,\n    in_reply_to_user_id_str: string,\n    source:\
    \ string,\n    text: string,\n    user: struct <\n      id: int,\n      id_str:\
    \ string,\n      name: string,\n      profile_image_url_https: string,\n     \
    \ protected: boolean,\n      screen_name: string,\n      verified: boolean\n \
    \   >\n  >,\n  source string,\n  text string,\n  user struct <\n    id: int,\n\
    \    id_str: binary,\n    name: string,\n    profile_image_url_https: string,\n\
    \    protected: boolean,\n    screen_name: string,\n    verified: boolean\n  >\n\
    )\nPARTITIONED BY (datehour INT)\nROW FORMAT SERDE 'org.openx.data.jsonserde.JsonSerDe'\n\
    LOCATION '/user/username/tweets';\n```\n\nAs you can see, the tweets are structured\
    \ in a table, with a substructure describing the complexity of the source’s unstructured\
    \ document. Now the data is securely stored in `HDFS`, structured with `Hive`,\
    \ and ready to be part of a processing or querying pipeline. As an example, Listing\
    \ [3-3](#A978-1-4842-1326-1_3_Chapter.html#FPar3) shows the distribution of hashtags\
    \ within the collected data.\n\n**Listing 3-3.** Top Hashtags\n\n```sql\nSELECT\n\
    \  LOWER(hashtags.text),\n  COUNT(*) AS hashtag_count\nFROM tweets\nLATERAL VIEW\
    \ EXPLODE(entities.hashtags) t1 AS hashtags\nGROUP BY LOWER(hashtags.text)\nORDER\
    \ BY hashtag_count DESC\nLIMIT 15;\n```\n\nQuerying data with `Hive` is really\
    \ convenient because it provides a SQL-like querying language. The problem is\
    \ the latency of the query; it basically has the same latency of a MapReduce job.\
    \ Indeed, the previous query is then translated into a MapReduce job that follows\
    \ the usual execution pipeline, which results in long-running processing.\n\n\
    This situation becomes problematic when the need is to follow data transformations\
    \ in real time, such as when watching top hashtags in live. Real-time massive\
    \ data processing isn’t a myth anymore with the rise of technology such as `Spark`.\
    \ It brings real-time processing but also is simple to implement. For example,\
    \ Listing [3-4](#A978-1-4842-1326-1_3_Chapter.html#FPar4) shows how you would\
    \ implement a word count in MapReduce.\n\n**Listing 3-4.** Word Count in MapReduce\
    \ (from [www.dattamsha.com/2014/09/hadoop-mr-vs-spark-rdd-wordcount-program/](http://www.dattamsha.com/2014/09/hadoop-mr-vs-spark-rdd-wordcount-program/))\n\
    \n```java\npackage org.apache.hadoop.examples;\n\nimport java.io.IOException;\n\
    import java.util.StringTokenizer;\nimport org.apache.hadoop.conf.Configuration;\n\
    import org.apache.hadoop.fs.Path;\nimport org.apache.hadoop.io.IntWritable;\n\
    import org.apache.hadoop.io.Text;\nimport org.apache.hadoop.mapreduce.Job;\nimport\
    \ org.apache.hadoop.mapreduce.Mapper;\nimport org.apache.hadoop.mapreduce.Reducer;\n\
    import org.apache.hadoop.mapreduce.lib.input.FileInputFormat;\nimport org.apache.hadoop.mapreduce.lib.input.FileSplit;\n\
    import org.apache.hadoop.mapreduce.lib.output.FileOutputFormat;\nimport org.apache.hadoop.util.GenericOptionsParser;\n\
    \npublic class WordCount {\n\n  public static class TokenizerMapper\n       extends\
    \ Mapper<Object, Text, Text, IntWritable>{\n\n    private final static IntWritable\
    \ one = new IntWritable(1);\n    private Text word = new Text();\n\n    public\
    \ void map(Object key, Text value, Context context\n                    ) throws\
    \ IOException, InterruptedException {\n      StringTokenizer itr = new StringTokenizer(value.toString());\n\
    \      while (itr.hasMoreTokens()) {\n        word.set(itr.nextToken());\n   \
    \     context.write(word, one);\n      }\n    }\n  }\n\n  public static class\
    \ IntSumReducer\n       extends Reducer<Text,IntWritable,Text,IntWritable> {\n\
    \    private IntWritable result = new IntWritable();\n\n    public void reduce(Text\
    \ key, Iterable<IntWritable> values,\n                       Context context\n\
    \                       ) throws IOException, InterruptedException {\n      int\
    \ sum = 0;\n      for (IntWritable val : values) {\n        sum += val.get();\n\
    \      }\n      result.set(sum);\n      context.write(key, result);\n    }\n \
    \ }\n\n  public static void main(String[] args) throws Exception {\n    Configuration\
    \ conf = new Configuration();\n    String[] otherArgs = new GenericOptionsParser(conf,\
    \ args).getRemainingArgs();\n    Job job = new Job(conf, \"word count\");\n  \
    \  job.setJarByClass(WordCount.class);\n    job.setMapperClass(TokenizerMapper.class);\n\
    \    job.setCombinerClass(IntSumReducer.class);\n    job.setReducerClass(IntSumReducer.class);\n\
    \    job.setOutputKeyClass(Text.class);\n    job.setOutputValueClass(IntWritable.class);\n\
    \    FileInputFormat.addInputPath(job, new Path(otherArgs[0]));\n    FileOutputFormat.setOutputPath(job,\
    \ new Path(otherArgs[1]));\n    System.exit(job.waitForCompletion(true) ? 0 :\
    \ 1);\n  }\n}\n```\n\nListing [3-5](#A978-1-4842-1326-1_3_Chapter.html#FPar5)\
    \ shows how you would do this in Spark (Python).\n\n**Listing 3-5.** Word Count\
    \ in Spark\n\n```python\nfrom pyspark import SparkContext\n\nlogFile = \"hdfs://localhost:9000/user/bigdatavm/input\"\
    \nsc = SparkContext(\"spark://bigdata-vm:7077\", \"WordCount\")\ntextFile = sc.textFile(logFile)\n\
    wordCounts = textFile.flatMap(lambda line: line.split()).map(lambda word: (word,\
    \ 1)).reduceByKey(lambda a, b: a+b)\nwordCounts.saveAsTextFile(\"hdfs://localhost:9000/user/bigdatavm/output\"\
    )\n```\n\nThat leads me to discuss the need to split the architecture into multiple\
    \ parts that handle specific needs, one for the batch processing and the other\
    \ one for the streaming."
  raw: '### Processing the Data


    Data transformations are often handled by ETL tools when you want a pure transformation
    from a source to a target. Tools such as Talend, Pentaho, Informatica, or IBM
    Datastage are the most commonly used software in Big Data projects. But still,
    they are not self-sufficient, and you will need some complementary tools (such
    Sqoop) for simply importing or exporting the data. In any case, multiple tools
    are used to ingest the data, and what they have in common is the target: HDFS.
    HDFS is the entry point in Hadoop distribution; data needs somehow to be stored
    in this file system in order to be processed by high-level applications and projects.


    When the data is stored on HDFS, then how do you access and process it?


    This what Hive, for example, can do. It creates a structure on top of the files
    stored in HDFS to make it easier to access the files. The structure itself is
    like a table in a data. For example, Listing [3-2](#A978-1-4842-1326-1_3_Chapter.html#FPar2)
    shows a structure that can be created for the preceding tweet example.


    Listing 3-2.Hive Tweet Structure


    `create table tweets (`


    `created_at string,`


    `entities struct <`


    `hashtags: array,`


    `text: string>>,`


    `media: array,`


    `media_url: string,`


    `media_url_https: string,`


    `sizes: array >,`


    `url: string>>,`


    `urls: array,`


    `url: string>>,`


    `user_mentions: array,`


    `name: string,`


    `screen_name: string>>>,`


    `geo struct <`


    `coordinates: array,`


    `type: string>,`


    `id bigint,`


    `id_str string,`


    `in_reply_to_screen_name string,`


    `in_reply_to_status_id bigint,`


    `in_reply_to_status_id_str string,`


    `in_reply_to_user_id int,`


    `in_reply_to_user_id_str string,`


    `retweeted_status struct <`


    `created_at: string,`


    `entities: struct <`


    `hashtags: array,`


    `text: string>>,`


    `media: array,`


    `media_url: string,`


    `media_url_https: string,`


    `sizes: array >,`


    `url: string>>,`


    `urls: array,`


    `url: string>>,`


    `user_mentions: array,`


    `name: string,`


    `screen_name: string>>>,`


    `geo: struct <`


    `coordinates: array,`


    `type: string>,`


    `id: bigint,`


    `id_str: string,`


    `in_reply_to_screen_name: string,`


    `in_reply_to_status_id: bigint,`


    `in_reply_to_status_id_str: string,`


    `in_reply_to_user_id: int,`


    `in_reply_to_user_id_str: string,`


    `source: string,`


    `text: string,`


    `user: struct <`


    `id: int,`


    `id_str: string,`


    `name: string,`


    `profile_image_url_https: string,`


    `protected: boolean,`


    `screen_name: string,`


    `verified: boolean>>,`


    `source string,`


    `text string,`


    `user struct <`


    `id: int,`


    `id_str: binary,`


    `name: string,`


    `profile_image_url_https: string,`


    `protected: boolean,`


    `screen_name: string,`


    `verified: boolean>`


    `)`


    `PARTITIONED BY (datehour INT)`


    `ROW FORMAT SERDE ''org.openx.data.jsonserde.JsonSerDe''`


    `LOCATION ''/user/username/tweets'';`


    As you can see, the tweets are structures in a table, with a substructure describing
    the complexity of the source’s unstructured document. Now the data is securely
    stored in HDFS, structured with Hive, and ready to be part of a processing or
    querying pipeline. As an example, Listing [3-3](#A978-1-4842-1326-1_3_Chapter.html#FPar3)
    shows the distribution of hashtags within the collected data.


    Listing 3-3.Top Hashtags


    `SELECT`


    `LOWER(hashtags.text),`


    `COUNT(*) AS hashtag_count`


    `FROM tweets`


    `LATERAL VIEW EXPLODE(entities.hashtags) t1 AS hashtags`


    `GROUP BY LOWER(hashtags.text)`


    `ORDER BY hashtag_count DESC`


    `LIMIT 15;`


    Querying data with Hive is really convenient because it provides a SQL-like querying
    language. The problem is the latency of the query; it basically has the same latency
    of a MapReduce job. Indeed, the previous query is then translated into a MapReduce
    job that follows the usual execution pipeline, which results in long-running processing.


    This situation becomes problematic when the need is to follow data transformations
    in real time, such as when watching top hashtags in live. Real-time massive data
    processing isn’t a myth anymore with the rise of technology such as Spark. It
    brings real-time XX but also is simple to implement. For example, Listing [3-4](#A978-1-4842-1326-1_3_Chapter.html#FPar4)
    shows how you would implement a word count in MapReduce.


    Listing 3-4.Word Count in MapReduce (from [www.​dattamsha.​com/​2014/​09/​hadoop-mr-vs-spark-rdd-wordcount-program/​](http://www.dattamsha.com/2014/09/hadoop-mr-vs-spark-rdd-wordcount-program/)))


    `package org.apache.hadoop.examples;`


    `import java.io.IOException;`


    `import java.util.StringTokenizer;`


    `import org.apache.hadoop.conf.Configuration;`


    `import org.apache.hadoop.fs.Path;`


    `import org.apache.hadoop.io.IntWritable;`


    `import org.apache.hadoop.io.Text;`


    `import org.apache.hadoop.mapreduce.Job;`


    `import org.apache.hadoop.mapreduce.Mapper;`


    `import org.apache.hadoop.mapreduce.Reducer;`


    `import org.apache.hadoop.mapreduce.lib.input.FileInputFormat;`


    `import org.apache.hadoop.mapreduce.lib.input.FileSplit;`


    `import org.apache.hadoop.mapreduce.lib.output.FileOutputFormat;`


    `import org.apache.hadoop.util.GenericOptionsParser;`


    `public class WordCount {`


    `public static class TokenizerMapper extends`


    `Mapper<Object, Text, Text, IntWritable> {`


    `private final static IntWritable one = new IntWritable(1);`


    `private Text word = new Text();`


    `public void map(Object key, Text value, Context context)`


    `throws IOException, InterruptedException {`


    `StringTokenizer itr = new StringTokenizer(value.toString());`


    `while (itr.hasMoreTokens()) {`


    `word.set(itr.nextToken());`


    `context.write(word, one);`


    `}`


    `}`


    `}`


    `public static class IntSumReducer extends`


    `Reducer<Text, IntWritable, Text, IntWritable> {`


    `private IntWritable result = new IntWritable();`


    `public void reduce(Text key, Iterable<IntWritable> values,`


    `Context context) throws IOException, InterruptedException {`


    `int sum = 0;`


    `for (IntWritable val : values) {`


    `sum += val.get();`


    `}`


    `result.set(sum);`


    `context.write(key, result);`


    `}`


    `}`


    `public static void main(String[] args) throws Exception {`


    `Configuration conf = new Configuration();`


    `String[] otherArgs = new GenericOptionsParser(conf, args)`


    `.getRemainingArgs();`


    `Job job = new Job(conf, "word count");`


    `job.setJarByClass(WordCount.class);`


    `job.setMapperClass(TokenizerMapper.class);`


    `job.setCombinerClass(IntSumReducer.class);`


    `job.setReducerClass(IntSumReducer.class);`


    `job.setOutputKeyClass(Text.class);`


    `job.setOutputValueClass(IntWritable.class);`


    `FileInputFormat.addInputPath(job, new Path(otherArgs[0]));`


    `FileOutputFormat.setOutputPath(job, new Path(otherArgs[1]));`


    `System.exit(job.waitForCompletion(true) ? 0 : 1);`


    `}`


    `}`


    Listing [3-5](#A978-1-4842-1326-1_3_Chapter.html#FPar5)shows how you would do
    this in Spark (Python).


    Listing 3-5.Word Count in Spark


    `from pyspark import SparkContext`


    `logFile = "hdfs://localhost:9000/user/bigdatavm/input"`


    `sc = SparkContext("spark://bigdata-vm:7077", "WordCount")`


    `textFile = sc.textFile(logFile)`


    `wordCounts = textFile.flatMap(lambda line: line.split()).map(lambda word: (word,
    1)).reduceByKey(lambda a, b: a+b)`


    `wordCounts.saveAsTextFile("hdfs://localhost:9000/user/bigdatavm/output")`


    That leads me to discuss the need to split the architecture into multiple parts
    that handle specific needs, one for the batch processing and the other one for
    the streaming.'
  trans: "\n### 数据处理\n\n当你需要将数据从源端纯粹地转换到目标端时，数据转换通常由 ETL 工具处理。诸如 `Talend`、`Pentaho`、`Informatica`\
    \ 或 `IBM Datastage` 等工具是大数据项目中最常用的软件。但它们仍不完善，你还需要一些补充工具（例如 `Sqoop`）来简单地导入或导出数据。无论哪种情况，都需要使用多种工具来摄取数据，而它们的共同点是目标端：`HDFS`。`HDFS`\
    \ 是 Hadoop 发行版的入口点；数据必须以某种方式存储在这个文件系统中，以便由高级应用程序和项目进行处理。\n\n当数据存储在 `HDFS` 上后，如何访问和处理它呢？例如，这正是\
    \ `Hive` 所能做到的。它在 `HDFS` 中存储的文件之上创建了一个结构，以便更容易地访问这些文件。这个结构本身就类似于数据库中的表。例如，列表 3-2\
    \ 展示了可以为上述推特示例创建的结构。\n\n**列表 3-2.** Hive 推特结构\n\n```sql\ncreate table tweets (\n\
    \  created_at string,\n  entities struct <\n    hashtags: array<struct<text: string>>,\n\
    \    media: array<struct<media_url: string, media_url_https: string, sizes: array<struct<url:\
    \ string>>>>,\n    urls: array<struct<url: string>>,\n    user_mentions: array<struct<name:\
    \ string, screen_name: string>>\n  >,\n  geo struct <\n    coordinates: array<float>,\n\
    \    type: string\n  >,\n  id bigint,\n  id_str string,\n  in_reply_to_screen_name\
    \ string,\n  in_reply_to_status_id bigint,\n  in_reply_to_status_id_str string,\n\
    \  in_reply_to_user_id int,\n  in_reply_to_user_id_str string,\n  retweeted_status\
    \ struct <\n    created_at: string,\n    entities: struct <\n      hashtags: array<struct<text:\
    \ string>>,\n      media: array<struct<media_url: string, media_url_https: string,\
    \ sizes: array<struct<url: string>>>>,\n      urls: array<struct<url: string>>,\n\
    \      user_mentions: array<struct<name: string, screen_name: string>>\n    >,\n\
    \    geo: struct <\n      coordinates: array<float>,\n      type: string\n   \
    \ >,\n    id: bigint,\n    id_str: string,\n    in_reply_to_screen_name: string,\n\
    \    in_reply_to_status_id: bigint,\n    in_reply_to_status_id_str: string,\n\
    \    in_reply_to_user_id: int,\n    in_reply_to_user_id_str: string,\n    source:\
    \ string,\n    text: string,\n    user: struct <\n      id: int,\n      id_str:\
    \ string,\n      name: string,\n      profile_image_url_https: string,\n     \
    \ protected: boolean,\n      screen_name: string,\n      verified: boolean\n \
    \   >\n  >,\n  source string,\n  text string,\n  user struct <\n    id: int,\n\
    \    id_str: binary,\n    name: string,\n    profile_image_url_https: string,\n\
    \    protected: boolean,\n    screen_name: string,\n    verified: boolean\n  >\n\
    )\nPARTITIONED BY (datehour INT)\nROW FORMAT SERDE 'org.openx.data.jsonserde.JsonSerDe'\n\
    LOCATION '/user/username/tweets';\n```\n\n如你所见，推文被组织成一张表，其中的子结构描述了源端非结构化文档的复杂性。现在，数据安全地存储在\
    \ `HDFS` 中，通过 `Hive` 进行结构化，并准备好成为处理或查询管道的一部分。例如，列表 3-3 展示了已收集数据中主题标签的分布情况。\n\n\
    **列表 3-3.** 热门主题标签\n\n```sql\nSELECT\n  LOWER(hashtags.text),\n  COUNT(*) AS hashtag_count\n\
    FROM tweets\nLATERAL VIEW EXPLODE(entities.hashtags) t1 AS hashtags\nGROUP BY\
    \ LOWER(hashtags.text)\nORDER BY hashtag_count DESC\nLIMIT 15;\n```\n\n使用 `Hive`\
    \ 查询数据非常方便，因为它提供了一种类似 SQL 的查询语言。问题在于查询的延迟；它基本上具有与 MapReduce 作业相同的延迟。实际上，上述查询会被转换为一个\
    \ MapReduce 作业，该作业遵循通常的执行管道，从而导致处理时间较长。\n\n当需要实时跟踪数据转换时（例如在实时观看热门主题标签时），这种情况就会成为问题。随着\
    \ `Spark` 等技术的兴起，实时大规模数据处理不再是神话。它不仅带来了实时处理能力，而且实现起来也很简单。例如，列表 3-4 展示了如何在 MapReduce\
    \ 中实现单词计数。\n\n**列表 3-4.** MapReduce 中的单词计数（来自 [www.dattamsha.com/2014/09/hadoop-mr-vs-spark-rdd-wordcount-program/](http://www.dattamsha.com/2014/09/hadoop-mr-vs-spark-rdd-wordcount-program/)）\n\
    \n```java\npackage org.apache.hadoop.examples;\n\nimport java.io.IOException;\n\
    import java.util.StringTokenizer;\nimport org.apache.hadoop.conf.Configuration;\n\
    import org.apache.hadoop.fs.Path;\nimport org.apache.hadoop.io.IntWritable;\n\
    import org.apache.hadoop.io.Text;\nimport org.apache.hadoop.mapreduce.Job;\nimport\
    \ org.apache.hadoop.mapreduce.Mapper;\nimport org.apache.hadoop.mapreduce.Reducer;\n\
    import org.apache.hadoop.mapreduce.lib.input.FileInputFormat;\nimport org.apache.hadoop.mapreduce.lib.input.FileSplit;\n\
    import org.apache.hadoop.mapreduce.lib.output.FileOutputFormat;\nimport org.apache.hadoop.util.GenericOptionsParser;\n\
    \npublic class WordCount {\n\n  public static class TokenizerMapper\n       extends\
    \ Mapper<Object, Text, Text, IntWritable>{\n\n    private final static IntWritable\
    \ one = new IntWritable(1);\n    private Text word = new Text();\n\n    public\
    \ void map(Object key, Text value, Context context\n                    ) throws\
    \ IOException, InterruptedException {\n      StringTokenizer itr = new StringTokenizer(value.toString());\n\
    \      while (itr.hasMoreTokens()) {\n        word.set(itr.nextToken());\n   \
    \     context.write(word, one);\n      }\n    }\n  }\n\n  public static class\
    \ IntSumReducer\n       extends Reducer<Text,IntWritable,Text,IntWritable> {\n\
    \    private IntWritable result = new IntWritable();\n\n    public void reduce(Text\
    \ key, Iterable<IntWritable> values,\n                       Context context\n\
    \                       ) throws IOException, InterruptedException {\n      int\
    \ sum = 0;\n      for (IntWritable val : values) {\n        sum += val.get();\n\
    \      }\n      result.set(sum);\n      context.write(key, result);\n    }\n \
    \ }\n\n  public static void main(String[] args) throws Exception {\n    Configuration\
    \ conf = new Configuration();\n    String[] otherArgs = new GenericOptionsParser(conf,\
    \ args).getRemainingArgs();\n    Job job = new Job(conf, \"word count\");\n  \
    \  job.setJarByClass(WordCount.class);\n    job.setMapperClass(TokenizerMapper.class);\n\
    \    job.setCombinerClass(IntSumReducer.class);\n    job.setReducerClass(IntSumReducer.class);\n\
    \    job.setOutputKeyClass(Text.class);\n    job.setOutputValueClass(IntWritable.class);\n\
    \    FileInputFormat.addInputPath(job, new Path(otherArgs[0]));\n    FileOutputFormat.setOutputPath(job,\
    \ new Path(otherArgs[1]));\n    System.exit(job.waitForCompletion(true) ? 0 :\
    \ 1);\n  }\n}\n```\n\n列表 3-5 展示了如何在 Spark（Python）中实现相同功能。\n\n**列表 3-5.** Spark\
    \ 中的单词计数\n\n```python\nfrom pyspark import SparkContext\n\nlogFile = \"hdfs://localhost:9000/user/bigdatavm/input\"\
    \nsc = SparkContext(\"spark://bigdata-vm:7077\", \"WordCount\")\ntextFile = sc.textFile(logFile)\n\
    wordCounts = textFile.flatMap(lambda line: line.split()).map(lambda word: (word,\
    \ 1)).reduceByKey(lambda a, b: a+b)\nwordCounts.saveAsTextFile(\"hdfs://localhost:9000/user/bigdatavm/output\"\
    )\n```\n\n这引出了我的讨论：有必要将架构拆分为多个部分，分别处理特定需求，一部分用于批处理，另一部分用于流处理。\n"
- fmt: "## Splitting the Architecture\n\nUsing Hadoop brings a lot of solutions when\
    \ it comes to handling a large amount of data, but it also brings challenges when\
    \ allocating resources and managing the stored data; you always want to reduce\
    \ the cost while keeping minimum latency to provide data to end users.\n\nLike\
    \ in any other architecture, data architecture should answer to the needs driven\
    \ by the SLAs. Thus, every job should not consume every resource equally and should\
    \ be either managed via a prioritization system or isolated from each other in\
    \ terms of architecture, hardware, network, and so on.\n\nIn this section, I’ll\
    \ talk about how modern data architecture is split to address the different levels\
    \ of time needed because of SLAs. To illustrate, I’ll discuss the repartition\
    \ illustrated in Figure [3-2](#A978-1-4842-1326-1_3_Chapter.html#Fig2).\n\n![A978-1-4842-1326-1_3_Fig2_HTML.jpg](A978-1-4842-1326-1_3_Fig2_HTML.jpg)\n\
    \nAs you can see, the architecture is divided into the following:\n\n- A long-term\
    \ processing part\n- A short-term processing part\n- A view merging part\n\nI’ll\
    \ go through each of these parts and explain what role is being affected.\n\n\
    ### Batch Processing\n\nThe long-term processing jobs, or batch processing, are\
    \ jobs that were implemented starting with the first generation of Hadoop architecture,\
    \ such as `MapReduce`, `Hive`, `Pig`, and so on. Those jobs tend to deal with\
    \ massive amounts of data and come up with digested data or, more standardly,\
    \ aggregates of data. Data is distributed using `HDFS` file system capabilities\
    \ and schedules and is governed by different tools depending on the distribution\
    \ you use.\n\nGenerally, the objective of these jobs is to keep compute aggregates\
    \ of data and make them available for analytics. As said, batch processing was\
    \ a first-class citizen of processing at the beginning of Big Data trends because\
    \ it was a natural way to process the data: you extract or collect the data and\
    \ then schedule jobs. The processing jobs can spend a lot of time before finishing\
    \ the aggregate computations.\n\nThese jobs were also mainly answering to a processing\
    \ need from legacy systems that were not able to deal with the data stream. Batch\
    \ processing became really easy to manage and monitor because it ran in one shot,\
    \ compared to a streaming system where monitoring should be continuous. Now with\
    \ `YARN`, it’s also easy to manage the resources allocated to a batch application.\
    \ This way, the IT organization can also split the batch architecture depending\
    \ on each batch SLA, which is covered in the next section.\n\n#### Prioritizing\
    \ the Processing\n\nWhen dealing with batch processing, IT organizations want\
    \ to have total control on the operations around processing, such as scheduling\
    \ or even prioritizing some jobs. Like in most IT systems, a data platform starts\
    \ on a pilot use case that might attract other parts of other organizations that\
    \ add more use cases to the platform. This simply turns the platform to a multitenant\
    \ data platform with many SLAs that are dependent on use cases.\n\nIn Hadoop 2.0\
    \ and Yarn-based architecture, the features provided for multitenancy allow users\
    \ to access the same data platform and run processing with different cluster capacities.\
    \ `YARN` also allows you to run non-MapReduce applications, so with the `ResourceManager`\
    \ and the YARN Capacity Scheduler, prioritizing jobs can be done across application\
    \ types.\n\nThe distribution of the Hadoop workload is done at the Capacity Scheduler\
    \ level. The configuration lets you finely arrange a predictable cluster resource\
    \ share and gives you the ability for a secured and significant cluster utilization.\
    \ This works by setting the utilization percentage on job queues. Figure [3-3](#A978-1-4842-1326-1_3_Chapter.html#Fig3)\
