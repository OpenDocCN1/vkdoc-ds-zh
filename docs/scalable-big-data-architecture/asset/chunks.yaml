    # 2. Early Big Data with NoSQL


    In this chapter, I provide you with an overview of the available datastore technologies
    that are use in a Big Data project context. I then focus on Couchbase and ElasticSearch
    and show you how they can be used and what their differences are.


    The first section gives you a better understanding of the different flavors of
    existing technologies within the NoSQL landscape.


    ## NoSQL Landscape


    Relational databases were the choice, almost the only choice, of a lot of developers
    and database administrators for traditional three-tier applications. This was
    the case for many reasons having to do with the data modeling methodology, the
    querying language that interacted with the data, and the powerful nature of those
    technologies, which allowed for consistent data stores to be deployed that served
    complex applications.


    Then the needs started to evolve/change in such a way that those data stores could
    no longer be the solution to all data-store problems. That’s how the term NoSQL
    arose—it offered a new approach to those problems by first breaking the standardized
    SQL schema-oriented paradigms.


    NoSQL technologies are schemaless and highly scalable, and couple of them are
    also highly distributed and high-performance. Most of the time, they complete
    an architecture with an existing RDBMS technology by, for example, playing the
    role of cache, search engine, unstructured store, and volatile information store.


    They are divided in four main categories:


    Key/value data store   Column data store   Document-oriented data store   Graph
    data store  


    Now let’s dive into the different categories and then choose the most appropriate
    for our use case.'
  trans: '

    # ElasticSearch


    `ElasticSearch` 是一种 NoSQL 技术，因其可扩展的分布式索引引擎和搜索功能而广受欢迎。它基于 Apache Lucene，能够在您的架构中实现实时数据分析和全文搜索。


    `ElasticSearch` 是 ELK 平台的一部分，该平台代表 `ElasticSearch` + `Logstash` + `Kibana`，由 Elastic
    公司提供。这三款产品协同工作，为数据收集、存储和可视化提供最佳的端到端平台：


    - `Logstash` 让您能从多种来源（如社交数据、日志、消息队列或传感器）收集数据，然后支持数据富化和转换，最后将数据传输到诸如 `ElasticSearch`
    的索引系统。

    - `ElasticSearch` 在一个分布式、可扩展且具备弹性的系统中对数据进行索引。它采用无模式设计，并为多种语言提供库，以便它们能轻松快速地实现应用程序中的实时搜索和分析。

    - `Kibana` 是一个可定制的用户界面，您可以在其中构建从简单到复杂的仪表板，以探索和可视化由 `ElasticSearch` 索引的数据。


    图 1-7 展示了 Elastic 产品的结构。


    ![A978-1-4842-1326-1_1_Fig7_HTML.jpg](img/A978-1-4842-1326-1_1_Fig7_HTML.jpg)


    图 1-7. ElasticSearch 产品


    如上图所示，Elastic 还提供商业产品，例如 Marvel（基于 `Kibana` 的监控控制台）、Shield（一个安全框架，例如提供身份验证和授权）以及
    Watcher（一个警报和通知系统）。本书不会使用这些商业产品。


    相反，我们将主要使用 `ElasticSearch` 作为一个搜索引擎，来存储由 Spark 产生的数据。经过处理和聚合后，数据被索引到 `ElasticSearch`
    中，以便第三方系统能够通过 `ElasticSearch` 查询引擎来查询数据。另一方面，我们也使用 ELK 来处理日志和可视化分析，但这是从平台运维的角度出发。有关
    `ElasticSearch` 的更多信息，请访问 `elastic.co`。


    ## 打造长期大数据架构的基础


    在牢记我们将要使用的所有大数据技术后，我们现在可以继续前进，构建我们架构的基础。


    ### 架构概览


    从高层视角来看，我们的架构将类似于另一个电子商务应用架构。我们需要以下组件：


    - 一个访客可以用来浏览产品目录的 Web 应用程序

    - 一个旨在拉取和处理日志的日志采集应用程序

    - 一个用于为访客触发推荐的机器学习应用程序

    - 一个充当架构中央处理集群的处理引擎

    - 一个用于为处理后的数据拉取分析结果的搜索引擎


    图 1-8 展示了这些不同的应用程序在这样一个架构中是如何组织的。


    ![A978-1-4842-1326-1_1_Fig8_HTML.jpg](img/A978-1-4842-1326-1_1_Fig8_HTML.jpg)


    图 1-8. 架构概览


    ### 日志采集应用程序


    日志采集应用程序用于消费应用程序日志，例如 Web 访问日志。为了方便用例，提供了一个生成的 Web 访问日志，它模拟了访客浏览产品目录的行为。这些日志代表了用于长期处理以及实时推荐的点击流日志。


    架构中可以有兩種选择：第一种可由 Flume 保证，将日志实时传输到我们的处理应用程序中；第二种可由 `ElasticSearch`、`Logstash`
    和 `Kibana`（ELK 平台）保证，用于创建访问分析。


    图 1-9 展示了日志是如何被 ELK 和 Flume 处理的。


    ![A978-1-4842-1326-1_1_Fig9_HTML.jpg](img/A978-1-4842-1326-1_1_Fig9_HTML.jpg)


    图 1-9. 采集应用程序


    在此架构中使用 ELK 能为我们带来更大价值，因为这三款产品能够无缝集成，并且比单独使用 Flume 并试图达到相同功能级别能带来更多价值。


    ### 机器学习应用程序


    机器学习应用程序接收数据流并构建预测，以优化我们的推荐引擎。该应用程序使用一个基础算法来介绍基于 Spark MLlib 的机器学习概念。


    图 1-10 展示了数据是如何通过 Kafka 被机器学习应用程序接收的，然后被发送到 Spark 进行处理，最后被索引到 `ElasticSearch`
    中以供进一步使用。


    ![A978-1-4842-1326-1_1_Fig10_HTML.jpg](img/A978-1-4842-1326-1_1_Fig10_HTML.jpg)


    图 1-10. 机器学习


    ### 处理引擎


    处理引擎是架构的核心；它从多种来源接收数据，并将处理任务委托给适当的模型。


    图 1-11 展示了数据是如何被处理引擎接收的，该处理引擎由用于路径处理的 Hive 和用于实时/近实时处理的 Spark 组成。


    ![A978-1-4842-1326-1_1_Fig11_HTML.jpg](img/A978-1-4842-1326-1_1_Fig11_HTML.jpg)


    图 1-11. 处理引擎


    这里我们使用 Kafka 结合 Logstash 将数据分发到 `ElasticSearch`。Spark 运行在 Hadoop 集群之上，但这并非强制要求。在本书中，为简化起见，我们不搭建
    Hadoop 集群，而是更倾向于以独立模式运行 Spark。但显然，您可以将您的工作部署到您偏好的 Hadoop 发行版中。


    ### 搜索引擎


    搜索引擎利用处理引擎处理过的数据，并暴露出一个专用的 RESTful API，该 API 将用于分析目的。


    ## 总结


    到目前为止，我们已经了解了构成我们架构的所有组件。在下一章中，我们将重点关注 NoSQL 部分，并将进一步探讨两种不同的技术：Couchbase 和 `ElasticSearch`。


    # 2. 早期大数据与 NoSQL


    在本章中，我将向您概述大数据项目背景下可用的数据存储技术。然后，我将重点介绍 Couchbase 和 `ElasticSearch`，并向您展示它们的使用方法以及它们之间的区别。


    第一部分将让您更好地理解 NoSQL 领域内现有技术的不同风格。


    ## NoSQL 格局


    对于传统的三层应用来说，关系型数据库是许多开发人员和数据库管理员的选择，几乎也是唯一的选择。这种情况是由多种原因造成的，包括数据建模方法、与数据交互的查询语言，以及这些技术强大的特性，它们能够部署提供一致数据存储的解决方案，以服务于复杂的应用。


    随后需求开始演变/变化，以至于这些数据存储不再能解决所有数据存储问题。这就是“NoSQL”这个术语诞生的背景——它通过首先打破标准化的 SQL 模式导向范式，为这些问题提供了一种新的方法。


    NoSQL 技术是无模式的、高度可扩展的，并且其中一些技术还是高度分布式和高性能的。大多数情况下，它们通过扮演缓存、搜索引擎、非结构化存储和易失性信息存储等角色，来完善包含现有
    RDBMS 技术的架构。


    它们被分为四大类：


    键值数据存储 · 列式数据存储 · 文档型数据存储 · 图数据存储


    现在，让我们深入探讨不同的类别，然后选择最适合我们用例的那一个。

    '
- fmt: '### Key/Value


    The first and easiest NoSQL data stores to understand are key/value data stores.
    These data stores basically act like a dictionary and work by matching a key to
    a value. They are often used for high-performance use cases in which basic information
    needs to be stored—for example, when session information may need to be written
    and retrieved very quickly. These data stores really perform well and are efficient
    for this kind of use case; they are also usually highly scalable.


    Key/value data stores can also be used in a queuing context to ensure that data
    won’t be lost, such as in logging architecture or search engine indexing architecture
    use cases.


    `Redis` and `Riak KV` are the most famous key/value data stores; `Redis` is more
    widely used and has an in-memory K/V store with optional persistence. `Redis`
    is often used in web applications to store session-related data, like `node` or
    PHP web applications; it can serve thousands of session retrievals per second
    without altering the performance. Another typical use case is the queuing use
    case that I describe later in this book; `Redis` is positioned between `Logstash`
    and `ElasticSearch` to avoid losing streamed log data before it is indexed in
    `ElasticSearch` for querying.


    ### Column


    Column-oriented data stores are used when key/value data stores reach their limits
    because you want to store a very large number of records with a very large amount
    of information that goes beyond the simple nature of the key/value store.


    Column data store technologies might be difficult to understand for people coming
    from the RDBMS world, but actually, they are quite simple. Whereas data is stored
    in rows in RDBMS, it is obviously stored in columns in column data stores. The
    main benefit of using columnar databases is that you can quickly access a large
    amount of data. Whereas a row in an RDBMS is a continuous disk entry, and multiple
    rows are stored in different disk locations, which makes them more difficult to
    access, in columnar databases, all cells that are part of a column are stored
    continuously.


    As an example, consider performing a lookup for all blog titles in an RDBMS; it
    might be costly in terms of disk entries, specifically if we are talking about
    millions of records, whereas in columnar databases, such a search would represent
    only one access.


    Such databases are indeed very handy for retrieving large amounts of data from
    a specific family, but the tradeoff is that they lack flexibility. The most used
    columnar database is Google Cloud Bigtable, but specifically, Apache HBase and
    Cassandra.


    One of the other benefits of columnar databases is ease of scaling because data
    is stored in columns; these columns are highly scalable in terms of the amount
    of information they can store. This is why they are mainly used for keeping nonvolatile,
    long-living information and in scaling use cases.


    ### Document


    Columnar databases are not the best for structuring data that contains deeper
    nesting structures—that’s where document-oriented data stores come into play.
    Data is indeed stored into key/value pairs, but these are all compressed into
    what is called a document. This document relies on a structure or encoding such
    as `XML`, but most of the time, it relies on `JSON` (JavaScript Object Notation).


    Although document-oriented databases are more useful structurally and for representing
    data, they also have their downside—specifically when it comes to interacting
    with data. They basically need to acquire the whole document—for example, when
    they are reading for a specific field—and this can dramatically affect performance.


    You are apt to use document-oriented databases when you need to nest information.
    For instance, think of how you would represent an account in your application.
    It would have the following:


    * Basic information: first name, last name, birthday, profile picture, URL, creation
    date, and so on

    * Complex information: address, authentication method (password, Facebook, etc.),
    interests, and so on


    That’s also why NoSQL document-oriented stores are so often used in web applications:
    representing an object with nested object is pretty easy, and integrating with
    front-end JavaScript technology is seamless because both technologies work with
    `JSON`.


    The most used technologies today are `MongoDB`, `Couchbase`, and `Apache CouchDB`.
    These are easy to install and start, are well documented, and are scalable, but
    above all, they are the most obvious choices for starting a modern web application.


    `Couchbase` is one the technologies we are going to use in our architecture specifically
    because of the way we can store, organize, and query the data using it. I made
    the choice of `Couchbase` mainly based on a performance benchmark that reveals
    that high latency is lower for high operation thoughputs than it is in `MongoDB`.


    Also it’s worth mentioning that `Couchbase` is the combination of `CouchDB` and
    `Memcached`, and today, from a support perspective, it makes more sense to use
    `Couchbase`, more details on this link.


    ### Graph


    Graph databases are really different from other types of database. They use a
    different paradigm to represent the data—a tree-like structure with nodes and
    edges that are connected to each other through paths called relations.


    Those databases rise with social networks to, for example, represent a user’s
    friends network, their friends’ relationships, and so on. With the other types
    of data stores, it is possible to store a friend’s relationship to a user in a
    document, but still, it can then be really complex to store friends’ relationships;
    it’s better to use a graph database and create nodes for each friend, connect
    them through relationships, and browse the graph depending on the need and scope
    of the query.


    The most famous graph database is `Neo4j`, and as I mentioned before, it is used
    for use cases that have to do with complex relationship information, such as connections
    between entities and others entities that are related to them; but it is also
    used in classification use cases.


    Figure [2-1](#A978-1-4842-1326-1_2_Chapter.html#Fig1) shows how three entities
    would be connected within a graph database.


    ![A978-1-4842-1326-1_2_Fig1_HTML.jpg](A978-1-4842-1326-1_2_Fig1_HTML.jpg)


    Figure 2-1.


    Graph database example


    The diagram’s two accounts nodes, Jane and John, connect to each other through
    edges that define their relationship; they have known each other since a defined
    date. Another group node connects to the two accounts nodes and this shows that
    Jane and John have been part of the soccer group since a defined date.'
