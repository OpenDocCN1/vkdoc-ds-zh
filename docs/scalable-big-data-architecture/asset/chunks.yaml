    \n**图 5-7.** Kibana 仪表板\n\n## 小结\n\n在下一章中，我们将为处理流程增加更多复杂性，并引入更多预测功能。此外，我们还将继续使用\
    \ Kibana 仪表板来展示处理结果。\n\n# 6. 从数据中学习？\n\nSpark 的强大特性之一是其机器学习能力。使用 Spark `Mllib`，可以非常容易地用学习算法丰富现有的数据处理管道。本章将介绍机器学习背后的主要概念，并介绍如何为我们的架构增加机器学习特性。\n"
- fmt: '# Introduction to Machine Learning


    Machine learning is the concept of creating computer programs that can learn from
    themselves when exposed to new data.


    Machine learning is widely used today, and present in almost all industries, to
    improve user navigation depending on previous behavior, to prescribe relevant
    drugs or therapy depending on patient background, or to help the Mars robot to
    get better land navigation as it moves and crosses roadblocks.


    As you google something, listen to your Spotify playlist, browse Amazon product
    catalog, or rent an Airbnb apartment, machine learning is used.


    The purpose of this chapter is not to give a course on machine learning, but talk
    about it in the context of our lambda architecture. However, we will have a quick
    introduction and talk about supervised and unsupervised learning, which are the
    most common practices in machine learning, as well as a walkthrough in the algorithm
    we’ll use later: `K-means`.


    ## Supervised Learning


    When dealing with machine learning, you must deal with questions such as which
    model to use and what strategy to employ to train data? The difference between
    supervised and unsupervised learning resides in the causal nature of the model.


    In supervised learning the inputs, which are a set of observations, affect the
    outputs, which are another set of observations, based on the model described in
    Figure [6-1](#A978-1-4842-1326-1_6_Chapter.html#Fig1).


    ![A978-1-4842-1326-1_6_Fig1_HTML.jpg](A978-1-4842-1326-1_6_Fig1_HTML.jpg)


    Figure 6-1. Supervised learning algorithm


    A model is created based on the training data, and is enriched as new data arrives.
    This process is continuously running.


    A real-life example could be training data in order to approve a loan for an individual.
    By having information about a former enquirer, financial wealth, health, career,
    and so on, the learning process can deduce whether the loan should be approved
    or not.


    A concrete usage of supervised learning is illustrated in Figure [6-2](#A978-1-4842-1326-1_6_Chapter.html#Fig2),
    showing the average monthly rent cost of an apartment in the center of Paris over
    one year. A data sample has helped to apply a linear regression on data to reveal
    a forecast. The red line in Figure [6-2](#A978-1-4842-1326-1_6_Chapter.html#Fig2)
    shows, for example, that the average price will reach €4000 in 2018.


    ![A978-1-4842-1326-1_6_Fig2_HTML.jpg](A978-1-4842-1326-1_6_Fig2_HTML.jpg)


    Figure 6-2. Linear regression based supervised learning


    Such machine learning works really well when dealing with historical data to predict
    short- to mid-term futures, but these are based on a model that are not obvious
    in some use cases.


    ## Unsupervised Learning


    As opposed to supervised learning, the model in unsupervised learning is created
    based on the input data and is improved as the data comes in. Some unsupervised
    algorithms detect similarity in data and tries to create clusters of similar data,
    such as that seen in Figure [6-3](#A978-1-4842-1326-1_6_Chapter.html#Fig3).


    ![A978-1-4842-1326-1_6_Fig3_HTML.jpg](A978-1-4842-1326-1_6_Fig3_HTML.jpg)


    Figure 6-3. Unsupervised algorithm


    This fits a lot better in our streaming use case where data are not known at the
    beginning and may have patterns that change over time.


    This kind of algorithm is called a clustering algorithm. Some well-known algorithms
    include:


    *   `K-means`

    *   `K-medians`

    *   Expectation maximizations

    *   Hierarchical clustering


    In our case, we’ll focus on the `K-means`.


    ## Machine Learning with Spark


    It’s obvious that machine learning starts with static data. A dataset is created;
    we build a model on this dataset, then we apply the model to the following created
    data to come up with a prediction. In our case, when we launch our Spark streaming
    driver, we don’t have any data on which we can base any prediction; we have to
    build and train the model with the batch of streamed data.


    The behavior pattern within our data can change from time to time; that’s why
    streaming architectures fit better in such use cases than bulk batch machine learning.
    With streaming, we learn from the data and train our model to adapt our prediction
    over time.


    Spark is really convenient for this stream learning architecture as it comes with
    out-of-the-box components both for streaming through `Spark Streaming` ([`http://spark.apache.org/streaming/`](http://spark.apache.org/streaming/))
    and for learning through `Mllib` ([`http://spark.apache.org/mllib/`](http://spark.apache.org/mllib/)),
    as can be seen in Figure [6-4](#A978-1-4842-1326-1_6_Chapter.html#Fig4).


    ![A978-1-4842-1326-1_6_Fig4_HTML.jpg](A978-1-4842-1326-1_6_Fig4_HTML.jpg)


    Figure 6-4. Spark architecture


    Both libraries will be used in the same Spark driver in order to build prediction
    on our visitor behavior. We’ll focus on one of the most common way of using `Spark
    Mllib`: we’ll implement a `K-means` clustering to partition our data into `K`-clusters.
    But before we do that, let’s look more closely at this `K-mean` algorithm.'
