- fmt: "#### Preparing the Dataset\n\nWe need to build a mapping file in order to\
    \ correlate the clickstream data to a product category. We’ll use the Python script\
    \ located on the following path: [`https://github.com/bahaaldine/elasticsearch-clickstream-demo/blob/master/generator/mapping_generator.py`](https://github.com/bahaaldine/elasticsearch-clickstream-demo/blob/master/generator/mapping_generator.py).\n\
    \nThis Python script generates 200,000 URIs and randomly maps them to a category\
    \ among the arbitrary list shown in Listing [6-1](#A978-1-4842-1326-1_6_Chapter.html#FPar1).\n\
    \n**Listing 6-1.** Product categories\n\n```\n#!/usr/bin/python\nimport csv\n\
    import random\n\nproductCount = 200000\nproductCategories = [\"Devices accessories\"\
    ,\"High-Tech accessories\",\"IT accessories\",\"pet\",\"car\",\"baby\",\"home\
    \ working\",\"kitchen\",\"video games\",\"cycling\",\"blu-ray and dvd\",\"office\
    \ supply\",\"household applicance\",\"High-tech\",\"IT\",\"Audio and musique\"\
    ,\"Gardening\",\"Toys and games\",\"Books\",\"Software\",\"Lighting\",\"House\"\
    ,\"Music\",\"Tires\",\"Sport and leisure\",\"Videos\",\"Cosmetics\",\"Jewellery\"\
    ,\"Shoes\",\"Watches\",\"Heatlh\",\"Clothes\"]\n\nwith open('mappings.csv', 'wb')\
    \ as outf:\n    fieldnames = ['uri'] + ['category']\n    csvwriter = csv.DictWriter(outf,\
    \ fieldnames)\n    while productCount > 0:\n        row = {}\n        csvwriter.writerow(dict(row,\
    \ uri=\"/products/product%d\" % productCount, category=random.choice(productCategories)))\n\
    \        productCount -= 1\n```\n\nAs you can see, there are 32 categories. You\
    \ will execute the scripts as shown in Listing [6-2](#A978-1-4842-1326-1_6_Chapter.html#FPar2).\n\
    \n**Listing 6-2.** Mapping file extract\n\n```\npython mapping_generator.py\n\
    ```\n\nYou should get the following `mappings.csv` file:\n\n```\n...\n/products/product90956,Shoes\n\
    /products/product90955,Shoes\n/products/product90954,baby\n/products/product90953,household\
    \ applicance\n/products/product90952,Books\n/products/product90951,Audio and musique\n\
    /products/product90950,IT\n/products/product90949,Devices accessories\n/products/product90948,Devices\
    \ accessories\n/products/product90947,Jewellery\n/products/product90946,car\n\
    /products/product90945,Devices accessories\n/products/product90944,Toys and games\n\
    /products/product90943,baby\n/products/product90942,Books\n/products/product90941,IT\
    \ accessories\n/products/product90940,cycling\n...\n```\n\nOn the other side,\
    \ the [`https://raw.githubusercontent.com/bahaaldine/elasticsearch-clickstream-demo/master/generator/resources.txt`](https://raw.githubusercontent.com/bahaaldine/elasticsearch-clickstream-demo/master/generator/resources.txt)\
    \ file contains all of the possible product URIs.\n\nIn the end, Spark will be\
    \ in charge of correlating the URI to the category based on the mapping file.\
    \ So let’s analyze the needed Spark code in the following class: [`https://github.com/bahaaldine/spark-enrich-and-ml/blob/master/src/main/scala/org/apache/spark/examples/SparkEnricher.scala`](https://github.com/bahaaldine/spark-enrich-and-ml/blob/master/src/main/scala/org/apache/spark/examples/SparkEnricher.scala).\n\
    \nWe kept the `Clickstream` object but added a `Customer` object that will be\
    \ the output of our streaming.\n\n**Listing 6-3.** Customer object\n\n```\ncase\
    \ class Customer (\n    session:String,\n    request:String,\n    category:String\n\
    )\n```\n\nNote that the entire Spark project can be found on the following repo:\
    \ [`https://github.com/bahaaldine/scalable-big-data-architecture/tree/master/chapter6/spark-enrich-and-ml`](https://github.com/bahaaldine/scalable-big-data-architecture/tree/master/chapter6/spark-enrich-and-ml).\n\
    \nThe `Customer` object is pretty simple so far and contains only three fields:\n\
    \n*   A `session` field, which is the key to identify the user\n*   A `request`\
    \ field, which contains the product URI\n*   A `category` field, which will be\
    \ populated with the product category using the mapping file.\n\nThe Spark context\
    \ configuration is unchanged; we just added another data source, our mapping file,\
    \ as can be seen in Listing [6-4](#A978-1-4842-1326-1_6_Chapter.html#FPar4).\n\
    \n**Listing 6-4.** Loading the mapping file\n\n```\nval mappingFile = ssc.sparkContext.textFile(\"\
    /path/to/mappings.csv\")\nval mappings = mappingFile.map(line => line.split(\"\
    ,\")).map(x => (x(0),x(1))).collectAsMap()\nval broadcastMapping = ssc.sparkContext.broadcast(mappings)\n\
    ```\n\nRemember that the previous Python script generates a mapping file called\
    \ `mappings.csv`. You must set this path in this code to make the Spark driver\
    \ work.\n\nThe mapping is loaded into a `mappings` variable, which is then broadcast\
    \ to create a read-only variable put in the cache of each Spark machine. The variable\
    \ is then used to create and enrich the `Customer` object, as seen in Listing\
    \ [6-5](#A978-1-4842-1326-1_6_Chapter.html#FPar5).\n\n**Listing 6-5.** Creating\
    \ & Enriching the customer object\n\n```\nval customers = events.map { clickstream\
    \ =>\n    val lookupMap = broadcastMapping.value\n    Customer(\n        clickstream.clientip\n\
    \        , clickstream.request\n        , lookupMap.getOrElse(clickstream.request,\
    \ \"category not found\")\n    )\n}\n```\n\nThe mapping is loaded in the `lookupMap`\
    \ variable, and we simply look up the product category by using `getOrElse`. This\
    \ returns “category not found” if the mapping does not exist. Finally, we index\
    \ each `Customer` object in Elasticsearch with the snippet shown in Listing [6-6](#A978-1-4842-1326-1_6_Chapter.html#FPar6).\n\
    \n**Listing 6-6.** Customer RDD indexation\n\n```\ncustomers.foreachRDD{ rdd =>\n\
    \    if (rdd.toLocalIterator.nonEmpty) {\n        EsSpark.saveToEs(rdd, \"spark/customer\"\
    )\n    }\n}\n```\n\nEach customer is indexed in the `spark` index under the `customer`\
    \ type in Elasticsearch. To test our code, make sure that the lambda architecture\
    \ is fully running and launch the `build.sh` file that builds and launches our\
    \ driver.\n\n**Listing 6-7.** Spark driver launch command\n\n```\n./build.sh\n\
    ```\n\nBy generating a new clickstream log with the `generator.py` script, you\
    \ should get Customers indexed in the `spark` index. Just browse `http://elasticsearch_host:9200/spark/_search`\
    \ to get the output shown in Listing [6-8](#A978-1-4842-1326-1_6_Chapter.html#FPar8).\n\
    \n**Listing 6-8.** Indexed customer in Elasticsearch\n\n```\nhits: {\n    total:\
    \ 10,\n    max_score: 1,\n    hits: [\n        {\n            _index: \"spark\"\
    ,\n            _type: \"customer\",\n            _id: \"AU9-8BCuIm6jDjOublOw\"\
    ,\n            _score: 1,\n            _source: {\n                session: \"\
    86.192.183.220\",\n                request: \"/products/product106871\",\n   \
    \             category: \"Watches\"\n            }\n        },\n        {\n  \
    \          _index: \"spark\",\n            _type: \"customer\",\n            _id:\
    \ \"AU9-8BCuIm6jDjOublO1\",\n            _score: 1,\n            _source: {\n\
    \                session: \"86.192.149.103\",\n                request: \"/products/product158310\"\
    ,\n                category: \"cycling\"\n            }\n        }\n        ...\n\
    \    ]\n}\n```\n\nAt this point we have an index full of mapped customers. We’ll\
    \ now leverage this enrichment phase to cluster our data and build a prediction."
