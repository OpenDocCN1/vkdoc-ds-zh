    ## Visualize Data in Kibana


    As an example of a resulting report, we will create a Kibana 4 dashboard that
    shows how Elasticsearch aggregation API is used.


    The Kibana UI is accessible on your local installation via the following URL:


    `http://localhost:5601`


    In Kibana discovery tab, we can see that we are receving data, as shown in Figure
    [5-4](#A978-1-4842-1326-1_5_Chapter.html#Fig4).


    ![A978-1-4842-1326-1_5_Fig4_HTML.jpg](A978-1-4842-1326-1_5_Fig4_HTML.jpg)


    Figure 5-4.


    Discovering clickstream data


    Let’s try to make a bar chart visualization that shows the distribution of HTTP
    response code over time. This can lead to anomaly detection such as intrusion
    attempt on our website and so on.


    The visualization tab lets you create by configuration this kind of charts, as
    shown in Figure [5-5](#A978-1-4842-1326-1_5_Chapter.html#Fig5).


    ![A978-1-4842-1326-1_5_Fig5_HTML.jpg](A978-1-4842-1326-1_5_Fig5_HTML.jpg)


    Figure 5-5.


    Creating aggregation in Kibana


    What we expect is for Kibana to draw a report that shows the number of 200, 404,
    and so on over time, as shown in Figure [5-6](#A978-1-4842-1326-1_5_Chapter.html#Fig6).


    ![A978-1-4842-1326-1_5_Fig6_HTML.jpg](A978-1-4842-1326-1_5_Fig6_HTML.jpg)


    Figure 5-6.


    HTTP response code over time


    Visualizing our data brings us to another dimension and easily shows the power
    of the aggregation framework. Kibana doesn’t compute anything on its side; it
    just renders the data that are returned from Elasticsearch. Listing [5-36](#A978-1-4842-1326-1_5_Chapter.html#FPar38)
    shows what Kibana is asking under the hood.


    Listing 5-36.Kibana request to Elasticsearch


