    \nThe example illustrates different priorities for the three queues: high, low,\
    \ and default. This can be translated in the simple YARN capacity scheduler configuration\
    \ shown in Listing [3-6](#A978-1-4842-1326-1_3_Chapter.html#FPar6).\n\n```\n<property>\n\
    \  <name>yarn.scheduler.capacity.root.queues</name>\n  <value>default,highPriority,lowPriority</value>\n\
    </property>\n\n<property>\n  <name>yarn.scheduler.capacity.root.highPriority.capacity</name>\n\
    \  <value>60</value>\n</property>\n\n<property>\n  <name>yarn.scheduler.capacity.root.lowPriority.capacity</name>\n\
    \  <value>20</value>\n</property>\n\n<property>\n  <name>yarn.scheduler.capacity.root.default.capacity</name>\n\
    \  <value>10</value>\n</property>\n```\n\nEach queue has been affected a minimum\
    \ cluster capacity, which by the way is elastic. This means if idle resources\
    \ are available, then one queue can take up more than the minimum initially affected.\
    \ Still, the maximum capacity can be affected, as shown in Listing [3-7](#A978-1-4842-1326-1_3_Chapter.html#FPar7).\n\
    \n```\n<property>\n  <name>yarn.scheduler.capacity.root.lowPriority.maximum-capacity</name>\n\
    \  <value>50</value>\n</property>\n```\n\nThis configuration sets the capacity,\
    \ so anyone who submits a job (for example, a `MapReduce` job), can submit it\
