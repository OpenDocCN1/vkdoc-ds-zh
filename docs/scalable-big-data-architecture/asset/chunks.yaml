    `"size": 0,`


    `"aggs": {`


    `"by_stats": {`


    `"stats": {`


    `"field": "bytes"`


    `}`


    `}`


    `}`


    `}`


    The stats aggregation only takes a numeric field as input—here, bytes—and returns
    Listing [5-33](#A978-1-4842-1326-1_5_Chapter.html#FPar35).


    Listing 5-33.Stats aggregation query output


    `{`


    `"took": 1,`


    `"timed_out": false,`


    `"_shards": {`


    `"total": 1,`


    `"successful": 1,`


    `"failed": 0`


    `},`


