  trans: "\n### 数据标签化\n\n为训练模型，我们将构建一个二维向量，该向量基于类别标签和客户标签生成。类别标签与特定类别相关联，例如“汽车”、“运动”等；而客户标签则引入了一个虚构的客户类型概念。\n\
    \n客户标签的取值为 1 至 5，具体含义如下：\n\n免费 早鸟 黄金 铂金 大客户\n\n因此，在训练模型之前，我们需要创建几个映射文件，以便能通过标签识别类别，并通过标签识别客户。\n\
    \n`https://github.com/bahaaldine/elasticsearch-clickstream-demo/blob/master/generator/mapping_generator.py`\
    \ 已进行了轻微修改，新增了一个标签列，如代码清单 6-9 所示。\n\n**代码清单 6-9.** 为类别添加标签\n\n```\ncategory =\
    \ random.choice(productCategories)\n\ncsvwriter.writerow(dict(row, uri=\"/products/product%d\"\
    \ % productCount, category=category, label=productCategories.index(category)+1))\n\
    ```\n\n该标签是根据相关类别在 `productCategories` 列表变量中的位置计算得出的。执行 Python 脚本后，您应获取一个如代码清单\
    \ 6-10 所示的映射文件。\n\n**代码清单 6-10.** 带有标签的类别映射文件\n\n```\n...\n/products/product199988,High-Tech\
    \ accessories,2\n/products/product199987,House,22\n/products/product199986,baby,6\n\
    /products/product199985,Heatlh,31\n/products/product199984,Watches,30\n...\n```\n\
    \n对于客户，我创建了一个新的 Python 脚本，位于：\n\n`https://github.com/bahaaldine/elasticsearch-clickstream-demo/blob/master/generator/ip_mapping_generator.py`\n\
    \n该脚本会在生成的文件中，为每个 IP 地址随机添加一个 1 到 5 之间的整数，如代码清单 6-11 所示。\n\n**代码清单 6-11.** IP\
    \ 映射文件生成器\n\n```\n#!/usr/bin/python\n\nimport csv\nimport random\n\nwith open('ip_mappings.csv',\
    \ 'wb') as outf:\n        fieldnames = ['ip'] + ['label']\n        csvwriter =\
    \ csv.DictWriter(outf, fieldnames)\n        for i in range(0,255):\n         \
    \       for j in range(0,255):\n                        row = {}\n           \
    \             csvwriter.writerow(dict(row, ip=\"86.192.\"+str(i)+\".\"+str(j),\
    \ label=random.randint(1,5)))\n```\n\n使用 IP 地址作为客户标识符看起来是一个奇怪的选择，但我这样做是为了方便读者理解本书的这一部分，并能在有限的客户标识符范围内进行工作。\n\
    \n执行 Python 脚本后，您应获得类似于代码清单 6-12 所示的输出内容。\n\n**代码清单 6-12.** 带有标签的 IP 映射\n\n```\n\
    ...\n86.192.0.15,3\n86.192.0.16,3\n86.192.0.17,5\n86.192.0.18,3\n86.192.0.19,1\n\
    86.192.0.20,4\n86.192.0.21,1\n...\n```\n\n这意味着客户 `86.192.0.21` 是一位**免费**客户。\n\n\
    ### 训练与预测\n\n在最后这一节中，我们将利用前面讨论过的所有资产，构建一个 K-Means 流式机器学习驱动程序。为此，我们将复用之前的 Scala\
    \ 代码，并增加以下步骤。\n\n首先，我们加载刚刚修改或创建的映射文件，如代码清单 6-13 所示。\n\n**代码清单 6-13.** 加载映射文件\n\
    \n```\nval productCategoryMappingFile = ssc.sparkContext.textFile(\"/path/to/mappings.csv\"\
    )\n\nval productCategoryMapping = productCategoryMappingFile.map(line => line.split(\"\
    ,\")).map(x => (x(0),x(1))).collectAsMap()\n\nval categoryLabelMapping:scala.collection.Map[String,Double]\
    \ = productCategoryMappingFile.map(line => line.split(\",\")).map(x => (x(1),x(2).toDouble)).collectAsMap()\n\
    \nval brodcastProductCategoryMapping = ssc.sparkContext.broadcast(productCategoryMapping)\n\
    \nval brodcastCategoryLabelMapping = ssc.sparkContext.broadcast(categoryLabelMapping)\n\
    \nval customerMappingFile = ssc.sparkContext.textFile(\"/path/to/ip_mappings.csv\"\
    )\n\nval ipLabelMapping:scala.collection.Map[String,Double] = customerMappingFile.map(line\
    \ => line.split(\",\")).map(x => (x(0),x(1).toDouble)).collectAsMap()\n\nval brodcastIpLabelMapping\
    \ = ssc.sparkContext.broadcast(ipLabelMapping)\n```\n\n这里我们创建了三个广播映射：\n- 我们已知的产品类别映射\n\
    - 从修改后的 `mappings.csv` 中提取的类别标签映射\n- 从新创建的 `ip_mappings.csv` 中提取的 IP 标签映射文件\n\n\
    数据丰富过程保持不变；但为了模型进行预测所需的训练数据和测试数据，我增加了两个闭包，如代码清单 6-14 所示。\n\n**代码清单 6-14.** 创建训练数据\n\
    \n```\nval trainingData = customers.map { customer =>\n\nval categoryLookupMap\
    \ = brodcastCategoryLabelMapping.value\n\nval customerLookupMap = brodcastIpLabelMapping.value\n\
    \nval categoryLabel = categoryLookupMap.getOrElse(customer.category, 1).asInstanceOf[Double]\n\
    \nval customerLabel = customerLookupMap.getOrElse(customer.session, 1).asInstanceOf[Double]\n\
    \nVectors.dense(Array(categoryLabel, customerLabel))\n\n}\n```\n\n第一个闭包使用了类别标签映射和\
    \ IP 标签映射，构建了一个二维向量，该向量建立了类别与客户类型之间的关联。例如，一个向量的值可能如下所示：\n\n`[30.0, 3.0]`\n\n该向量将第\
    \ 29 个（索引 29+1，参见映射生成器）类别，即“鞋子”，与第三种客户类型（即黄金客户）关联起来。\n\n测试数据部分如代码清单 6-15 所示。\n\
    \n**代码清单 6-15.** 创建测试数据\n\n```\nval testData = customers.map { customer =>\n\n\
    val categoryLookupMap = brodcastCategoryLabelMapping.value\n\nval customerLookupMap\
    \ = brodcastIpLabelMapping.value\n\nval categoryLabel = categoryLookupMap.getOrElse(customer.category,\
    \ 1).asInstanceOf[Double]\n\nval customerLabel = customerLookupMap.getOrElse(customer.session,\
    \ 1).asInstanceOf[Double]\n\nLabeledPoint(categoryLabel, Vectors.dense(Array(categoryLabel,\
    \ customerLabel)))\n\n}\n```\n\n这里我们创建了一种不同类型的对象 `LabelPoint`。该对象包含两个成员：\n- `label`（标签）：这里我将标签设置为与类别标签相同的值。\n\
    - `vector`（向量）：向量的构建方式与训练数据中的相同。\n\n最后，我们创建并训练模型，如代码清单 6-16 所示。\n\n**代码清单 6-16.**\
    \ 创建并训练模型\n\n```\nval model = new StreamingKMeans()\n.setK(3)\n.setDecayFactor(1.0)\n\
    .setRandomCenters(2, 0.0)\n\nmodel.trainOn(trainingData)\n```\n\n这里我们指定需要三个聚类中心，由于数据是流式的，我们设置了一个衰减因子，并注意这些数据是非线性的。我们需要模型在反映历史数据的同时，重点训练最新数据。\n"
