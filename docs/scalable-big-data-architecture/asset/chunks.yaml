    \ 不会将副本分片分配到与主分片相同的节点上；那样做是没有意义的。请记住，副本分片为您的集群提供了弹性恢复能力；在我们的情况下，我们需要启动另一个 Elasticsearch\
    \ 实例，但由于我们处于测试环境，这似乎有点过头了。那么，让我们通过使用 Elasticsearch 索引设置 API 来更改集群配置：点击右侧菜单中的“Sense”切换到\
    \ Sense 控制台，您将进入 Sense 控制台，该控制台通过自动补全功能帮助您轻松运行 API 查询。\n\n我们在这里要做的是将集群中创建的索引里的每个分片的副本数更新为\
    \ 0，并将集群状态变为绿色。复制并粘贴列表 4-24 中的查询，然后点击运行按钮。\n\n**列表 4-24.** 将副本数更新为 0 的索引 API\n\
    \n```\nPUT /_settings\n{\n    \"index\" : {\n        \"number_of_replicas\" :\
    \ 0\n    }\n}\n```\n\nSense 将返回一个确认响应，如图 4-6 所示。\n\n![A978-1-4842-1326-1_4_Fig6_HTML.jpg](img/A978-1-4842-1326-1_4_Fig6_HTML.jpg)\n\
    \n**图 4-6.** 查询结果\n\n如您所见，这个请求非常容易理解：它使用了设置 API，并发送了一个包含 `index` 对象的 PUT 请求，以指定索引中的每个分片应有\
    \ 0 个副本。现在，如果您回到分片分配视图，您应该会看到集群状态变为绿色。\n"
- fmt: "### 创建索引模板\n\n现在我们将为数据创建映射，并为索引、文档和字段设置正确的参数。在 Sense 中，发出清单 [4-25](#A978-1-4842-1326-1_4_Chapter.html#FPar25)\
    \ 中描述的请求。\n\n**清单 4-25.** 点击流索引模板\n\n```\nPUT _template/clickstream\n{\n  \"template\"\
    : \"clickstream-*\",\n  \"settings\": {\n    \"number_of_shards\": 1,\n    \"\
    number_of_replicas\": 0\n  },\n  \"mappings\": {\n    \"_default_\": {\n     \
    \ \"dynamic_templates\": [\n        {\n          \"string_fields\": {\n      \
    \      \"mapping\": {\n              \"index\": \"not_analyzed\",\n          \
    \    \"omit_norms\": true,\n              \"type\": \"string\"\n            },\n\
    \            \"match_mapping_type\": \"string\",\n            \"match\": \"*\"\
    \n          }\n        }\n      ],\n      \"_all\": {\n        \"enabled\": true\n\
    \      },\n      \"properties\": {\n        \"response\": { \"type\": \"integer\"\
    },\n        \"bytes\": { \"type\": \"integer\" }\n      }\n    }\n  }\n}\n```\n\
    \n我们正在创建一个名为 `clickstream` 的模板，该模板将应用于 Elasticsearch 中创建的名称与 `clickstream-*` 正则表达式匹配的所有索引。我们将在本章后面看到这样做的原因。它包含主要部分：\n\
    \n*   **设置**：我们在此定义了集群中点击流索引所需的 `shard` 和 `replica` 数量。这与我们之前所做的等效，但现在已打包在模板中并应用于每个新的点击流索引。\n\
    *   **映射**：这定义了 Elasticsearch 应如何分析数据。Elasticsearch 有一个非常重要的概念，称为分析器，它基本上定义了我们的字段应如何为搜索目的进行解释和结构化。例如，您可以使用分词器并将字段内容拆分为多个\
    \ `token`。分析器的概念非常丰富，我建议您阅读以下文档，以更好地理解这里发生的事情：\n    *   [https://www.elastic.co/guide/en/elasticsearch/reference/1.6/analysis-analyzers.html](https://www.elastic.co/guide/en/elasticsearch/reference/1.6/analysis-analyzers.html)\n\
    *   我选择默认不分析任何 `string` 字段，因此这些字段基本上可以按原样搜索。然后，我为 `response` 和 `bytes` 字段应用了特定的映射，以告知\
    \ Elasticsearch 这些字段将是整数。\n\n请记住，映射应在索引之前完成；否则，您将不得不重新索引整个数据。\n\n### 直接使用 Logstash\
    \ 索引数据\n\n现在 Elasticsearch 已配置并运行，我们可以启动 Logstash 索引器实例并耗尽 Kafka。\n\n#### 配置文件\n\
    \n要存储由点击流日志记录架构创建的文档，我们可以创建一个单独的索引并将所有内容存储在其中。但是随着站点流量的增长，数据量也会增长，因此我们应该考虑按时间分割索引，这在此处更有意义。\n\
    \n例如，考虑到您获取的数据越多，您拥有的旧数据可能就越没用，这些旧数据可能会被归档，以便为较新的数据留出更多的服务器资源。好消息是，这非常简单，并且直接在索引级别完成，换句话说，由\
    \ Logstash 完成。\n\n清单 [4-26](#A978-1-4842-1326-1_4_Chapter.html#FPar26) 是我们的 Logstash\
    \ 索引器的配置。\n\n**清单 4-26.** Logstash 索引器配置，可在 [`https://github.com/bahaaldine/scalable-big-data-architecture/blob/master/chapter4/logstash/indexer/kafka_to_elasticsearch.conf`](https://github.com/bahaaldine/scalable-big-data-architecture/blob/master/chapter4/logstash/indexer/kafka_to_elasticsearch.conf)\
    \ 找到\n\n```\ninput {\n  kafka {\n    topic_id => \"clickstream\"\n  }\n}\n\nfilter\
    \ {\n}\n\noutput {\n  stdout { codec => rubydebug }\n  elasticsearch {\n    index\
    \ => \"clickstream-%{+YYYY.MM.dd}\"\n    manage_template => false\n    host =>\
    \ localhost\n    protocol => http\n  }\n}\n```\n\n如您所见，与处理代理相比，配置相当简单，并且附带了一个新的输出，专门用于索引到\
    \ Elasticsearch，具有以下设置：\n\n*   `index`：是我们希望将数据索引到的索引名称；这里的索引是一个模式，将生成一个基于日期的索引名称。\n\
    *   `manage_template`：Logstash 是否应管理索引模板；因为我们之前已经创建了一个，所以不需要。\n*   `host` 和 `protocol`：这些很明显，指向我们的\
    \ Elasticsearch 集群。\n\n#### 运行并索引数据\n\n让我们运行 Logstash 索引器，看看 Elasticsearch 中发生了什么。发出如清单\
    \ [4-27](#A978-1-4842-1326-1_4_Chapter.html#FPar27) 所示的命令。\n\n**清单 4-27.** Logstash\
    \ 索引器启动命令\n\n```\nbin/logstash -f /path/to/kafka_to_elasticsearch.conf\n```\n\n\
    使用 Python 脚本生成单个事件日志文件，像之前一样，您应该看到 ruby 调试编解码器输出事件结构。让我们关注 Elasticsearch，进入“分片分配”（Shard\
    \ Allocation）仪表板，看看我们的点击流索引是否已创建，如图 [4-7](#A978-1-4842-1326-1_4_Chapter.html#Fig7)\
    \ 所示。\n\n![A978-1-4842-1326-1_4_Fig7_HTML.jpg](A978-1-4842-1326-1_4_Fig7_HTML.jpg)\n\
    \n**图 4-7.** 在 Marvel 中创建的新点击流索引\n\n我们现在有了一个名为 `clickstream-2015.07.12` 的索引。显然，日期可能会根据您启动\
    \ Logstash 索引器的时间而变化，但无论如何，您应该有一个索引。\n\n现在让我们进入 Sense，通过发出如清单 [4-28](#A978-1-4842-1326-1_4_Chapter.html#FPar28)\
    \ 所示的命令来查询数据。\n\n**清单 4-28.** 在 Sense 中查询点击流数据\n\n```\nGET /clickstream-2015.07.12/_search\n\
    {\n  \"query\": {\n    \"match_all\": {}\n  }\n}\n```\n\n您得到的输出应该类似于清单 [4-29](#A978-1-4842-1326-1_4_Chapter.html#FPar29)\
    \ 所示。\n\n**清单 4-29.** 搜索输出\n\n```\n{\n   \"took\": 1,\n   \"timed_out\": false,\n\
    \   \"_shards\": {\n      \"total\": 1,\n      \"successful\": 1,\n      \"failed\"\
    : 0\n   },\n   \"hits\": {\n      \"total\": 1,\n      \"max_score\": 1,\n   \
    \   \"hits\": [\n         {\n            \"_index\": \"clickstream-2015.07.12\"\
    ,\n            \"_type\": \"access_log\",\n            \"_id\": \"AU6CJyWNDD4MpZzVyM-9\"\
    ,\n            \"_score\": 1,\n            \"_source\": {\n               \"message\"\
    : \"10.10.10.13 - - [10/Oct/2013:00:04:55 +0000] \\\"GET /products/product3 HTTP/1.0\\\
    \" 200 3219 \\\"http://www.google.com \\\" \\\"Mozilla/4.0 (compatible; MSIE 7.0;\
    \ Windows NT 6.0)\\\" \",\n               \"@version\": \"1\",\n             \
    \  \"@timestamp\": \"2015-07-12T12:04:39.882Z\",\n               \"file\": \"\
    /Users/bahaaldine/Dropbox/apress/demo/chapter 4 /source/access_log_20150712-140436.log\"\
    ,\n               \"host\": \"MBPdeBaaaldine2\",\n               \"offset\": \"\
    0\",\n               \"type\": \"access_log\",\n               \"clientip\": \"\
    10.10.10.13\",\n               \"ident\": \"-\",\n               \"auth\": \"\
    -\",\n               \"timestamp\": \"10/Oct/2013:00:04:55 +0000\",\n        \
    \       \"verb\": \"GET\",\n               \"request\": \"/products/product3\"\
    ,\n               \"httpversion\": \"1.0\",\n               \"response\": \"200\"\
    ,\n               \"bytes\": \"3219\",\n               \"referrer\": \"\\\"http://www.google.com\
    \ \\\"\",\n               \"agent\": \"\\\"Mozilla/4.0 (compatible; MSIE 7.0;\
    \ Windows NT 6.0)\\\"\"\n            }\n         }\n      ]\n   }\n}\n```\n\n\
    我们可以看到文档已被 Elasticsearch 存储并返回，并且符合我们上游配置的结构。"
  raw: '##### Creating the Index Template


    We now will create a mapping for our data, and set the correct parameters for
    our index, document, and fields. In sense, issue the request described in Listing
    [4-25](#A978-1-4842-1326-1_4_Chapter.html#FPar25).


    Listing 4-25.Clickstream indeces template


    `PUT _template/clickstream`


    `{`


      `"template": "clickstream-*",`


      `"settings": {`


        `"number_of_shards": 1,`


        `"number_of_replicas": 0`


      `},`


      `"mappings": {`


        `"_default_": {`


          `"dynamic_templates": [`


            `{`


              `"string_fields": {`


                `"mapping": {`


                  `"index": "not_analyzed",`


                  `"omit_norms": true,`


                  `"type": "string"`


                `},`


                `"match_mapping_type": "string",`


                `"match": "*"`


              `}`


            `}`


          `],`


          `"_all": {`


            `"enabled": true`


          `},`


          `"properties": {`


            `"response": { "type": "integer"},`


            `"bytes": { "type": "integer" }`


          `}`


        `}`


      `}`


    `}`


    Here we are creating a template called clickstream that will be applied to every
    index created in Elasticsearch which name will math the clickstream-* regex, we’ll
    see the reason for this later on in this chapter. It contains the main part:


    *   The settings: we are defining here the number of shard and replica that we
    will need in our cluster for the clickstream indices. This is equivalent to what
    we have done earlier but now packaged in a template and apply to every new clickstream
    index.

    *   The mappings: this defined our the data should be analyzed by Elasticsearch.
    Elasticsearch comes with a very important notion, called analyzer, which basically
    defined our fields should be interpreted and structure for search purpose. You
    can for example use a tokenizer and split your field content into multiple token.
    The analyzers concept is really rich and I would recommend that you read the following
    documentation for better understanding of what is happening here:

    *   [https://​www.​elastic.​co/​guide/​en/​elasticsearch/​reference/​1.​6/​analysis-analyzers.​html](https://www.elastic.co/guide/en/elasticsearch/reference/1.6/analysis-analyzers.html)

    *   I’ve chosen to not analyze every string field by default so those will basically
    be searchable as they are. Then I’ve applied specific mapping to the response
    and bytes fields to tell Elasticsearch that these will be integers.


    Keep in mind that the mappings should be done before indexation; otherwise, you
    will have to reindex your entire data.


    #### Indexing the Data Directly with Logstash


    Now that Elasticsearch is configured and running, we can launch our Logstash indexer
    instance and drain Kafka.


    ##### The Configuration File


    To store the documents created by our clickstream logging architecture, we could
    create a single index and store everything in it. But as our site traffic grows,
    the amount of data will grow, so we should consider splitting our index based
    on time, which gives more sense here.


    Think, for example, that the more you are getting data, the more you have old
    data that might not be useful, which will likely be archive to leave more server
    resource to the fresher data. The good news is that it’s super easy and is done
    directly at the indexation level, in other words, by Logstash.


    Listing [4-26](#A978-1-4842-1326-1_4_Chapter.html#FPar26) is the configuration
    of our Logstash indexer.


    Listing 4-26.Logstash indexer configuration and can be found in [`https://github.com/bahaaldine/scalable-big-data-architecture/blob/master/chapter4/logstash/indexer/kafka_to_elasticsearch.conf`](https://github.com/bahaaldine/scalable-big-data-architecture/blob/master/chapter4/logstash/indexer/kafka_to_elasticsearch.conf)


    `input {`


      `kafka {`


        `topic_id => "clickstream"`


      `}`


    `}`


    `filter {`


    `}`


    `output {`


      `stdout { codec => rubydebug }`


      `elasticsearch {`


        `index => "clickstream-%{+YYYY.MM.dd}"`


        `manage_template => false`


        `host => localhost`


        `protocol => http`


      `}`


    `}`


    As you can see, the configuration is quite simple compared to the processing agent,
    and comes with a new output dedicated to index in Elasticsearch with the following
    settings:


    *   index: is the index name that we want to index the data into; here the index
    is pattern and will generate a day based index name

    *   manage_template: whether or not Logstash should manage the index template;
    As we have created one earlier this is not needed.

    *   host and protocol: these are obvious and point to our Elasticsearch cluster


    ##### Run and Index the Sata


    Let’s run our Logstash index and see what happen in Elasticsearch. Issue the command
    shown in Listing [4-27](#A978-1-4842-1326-1_4_Chapter.html#FPar27).


    Listing 4-27.Logstash indexer start command


    `bin/logstash -f /path/to/kafka_to_elasticsearch.conf`


    Generate a single event log file with the python script, and, like earlier, you
    should see the ruby debug codec outputting the event structure. Let’s focus on
    Elasticsearch and go into the Shard Allocation dashboard to see if our clickstream
    index has been created, as shown in Figure [4-7](#A978-1-4842-1326-1_4_Chapter.html#Fig7).


    ![A978-1-4842-1326-1_4_Fig7_HTML.jpg](A978-1-4842-1326-1_4_Fig7_HTML.jpg)


    Figure 4-7.


    New clickstream index created in Marvel


    We have now a clickstream-2015.07.12 index that has been created. Obviously, the
    date might change depending on the time you have launch the Logstash indexer,
    but anyway you should have one index.


    Now let’s go into Sense and query our data by issuing the command shown in Listing
    [4-28](#A978-1-4842-1326-1_4_Chapter.html#FPar28).


    Listing 4-28.Querying clickstream data in Sense


    `GET /clickstream-2015.07.12/_search`


    `{`


      `"query": {`


        `"match_all": {}`


      `}`


    `}`


    The output you get should be similar to that shown in Listing [4-29](#A978-1-4842-1326-1_4_Chapter.html#FPar29).


    Listing 4-29.Search output


    `{`


       `"took": 1,`


       `"timed_out": false,`


       `"_shards": {`


          `"total": 1,`


          `"successful": 1,`


          `"failed": 0`


       `},`


       `"hits": {`


          `"total": 1,`


          `"max_score": 1,`


          `"hits": [`


             `{`


                `"_index": "clickstream-2015.07.12",`


                `"_type": "access_log",`


                `"_id": "AU6CJyWNDD4MpZzVyM-9",`


                `"_score": 1,`


                `"_source": {`


                   `"message": "10.10.10.13 - - [10/Oct/2013:00:04:55 +0000] \"GET
    /products/product3 HTTP/1.0\" 200 3219 \"` [`http://www.google.com`](http://www.google.com/)
    `\" \"Mozilla/4.0 (compatible; MSIE 7.0; Windows NT 6.0)\" ",`


                   `"@version": "1",`


                   `"@timestamp": "2015-07-12T12:04:39.882Z",`


                   `"file": "/Users/bahaaldine/Dropbox/apress/demo/chapter` `4` `/source/access_log_20150712-140436.log",`


                   `"host": "MBPdeBaaaldine2",`


                   `"offset": "0",`


                   `"type": "access_log",`


                   `"clientip": "10.10.10.13",`


                   `"ident": "-",`


                   `"auth": "-",`


                   `"timestamp": "10/Oct/2013:00:04:55 +0000",`


                   `"verb": "GET",`


                   `"request": "/products/product3",`


                   `"httpversion": "1.0",`


                   `"response": "200",`


                   `"bytes": "3219",`


                   `"referrer": "\"` [`http://www.google.com`](http://www.google.com/)
    `\"",`


                   `"agent": "\"Mozilla/4.0 (compatible; MSIE 7.0; Windows NT 6.0)\""`


                `}`


             `}`


          `]`


       `}`


    `}`


    We can see that the document has been stored and returned by Elasticsearch and
    respect the structure we have configured upstream.'
