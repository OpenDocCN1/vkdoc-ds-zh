    # 大数据难题


    数据管理正变得前所未有的复杂。大数据无处不在，人人关注，并呈现多种不同形式：广告、社交图谱、信息流、推荐、营销、医疗健康、安全、政府等等。


    在过去三年中，涌现了数千种与大数据采集、管理和分析相关的技术；这给 IT 团队带来了艰巨的任务——需要做出选择，而大多数时候却缺乏一套全面的方法论来指导这个选择过程。


    在为自身情况做选择时，请问自己以下问题：我应该在何时考虑为我的 IT 系统采用大数据？我准备好采用它了吗？我应该从哪里开始？尽管觉得大数据只是一个营销趋势，我真的应该去实施它吗？


    所有这些问题都萦绕在大多数首席信息官和首席技术官的脑海中，并且它们大致涵盖了当您决定部署分布式大数据架构时，使您的业务面临风险的原因和方式。


    本章旨在帮助您识别大数据症状——换句话说，就是当您明显需要考虑将大数据添加到您的架构中时的迹象——但它也指导您了解各种大数据技术，以便您能够区分它们，理解它们各自的专长领域。最后，在本章结尾，我们会基于现实生活中的例子，构建一个典型分布式大数据架构的基础。


    ## 识别大数据症状


    您可能基于不同的需求选择启动一个大数据项目：由于您处理的数据量、由于系统数据结构多样性、由于您遇到的可扩展性问题，或者由于您希望降低数据处理成本。在本节中，您将看到哪些症状能使一个团队意识到他们需要启动大数据项目。


    ### 规模至关重要


    促使人们开始考虑大数据的两个主要领域是当他们开始遇到与数据大小和数量相关的问题时；尽管大多数时候这些问题确实构成了考虑大数据的正当理由，但在今天，它们并非走上这条路的唯一原因。


    还有其他一些您也应该考虑的症状——例如，数据类型。当传统数据存储（如 SQL 数据库）期望您预先进行结构化（如创建表）时，您将如何设法增加各种类型的数据？


    如果不添加一种灵活的、无模式的、能够处理新数据结构的技术的支持，这是不可行的。当我谈论数据类型时，您应该想象非结构化数据、图数据、图像、视频、语音等等。


    是的，存储非结构化数据是好的，但如果您能从中提取出有价值的信息则更好。另一个症状源于这个前提：大数据还包括从高容量的多种数据中提取增值信息。几年前，当读取事务多于写入事务时，通用的缓存或数据库配合每周的
    ETL 处理任务就足够了。如今这已不再是趋势。现在，您需要一种架构，能够随着数据的流入，处理从长时间处理到近实时处理的各种任务。该架构应该是分布式的，而不依赖于僵化的、高性能且昂贵的大型机；相反，它应该基于更可用、性能驱动且成本更低的技术，以提供更高的灵活性。


    那么，您如何利用所有这些增值数据，又如何能够自然地搜索它们呢？要回答这个问题，请再次思考传统数据存储，您在其中不同的列上创建索引以加速搜索查询。那么，如果您想要索引所有一百列，以便能够执行涉及不定数量关键列的复杂查询，该怎么办？您可不想用基本的
    SQL 数据库来做这件事；相反，对于这种特定需求，您更应该考虑使用 NoSQL 存储。


    因此，在当今数据管理趋势的背景下，只要沿着数据采集、数据结构化、数据处理和数据可视化的路径走一遭，就很容易得出结论：规模不再是主要担忧。


    ### 典型业务用例


    除了技术和架构方面的考虑，您可能还面临着典型的“大数据”用例。其中一些与特定行业相关；另一些则没有特定领域限制，可以应用于多种行业。


    这些考虑因素通常基于对应用程序日志的分析，例如 Web 访问日志、应用服务器日志和数据库日志，但也可能基于其他类型的数据源，例如社交网络数据。


    当面临此类用例时，如果您希望随着业务增长能够进行横向扩展，那么您可能需要考虑分布式大数据架构。


    #### 消费者行为分析


    了解您的客户，或者我们通常所说的“360 度客户视图”，可能是最流行的大数据用例。这种客户视图通常用于电子商务网站，其起点是非结构化的点击流——换句话说，它由访问者执行的主动和被动的网站导航行为构成。通过计算和分析对广告或产品的点击和曝光次数，您可以根据访问者的行为来调整其用户体验，同时牢记目的是为了获得洞察以优化漏斗转化率。


    #### 情感分析


    公司非常关心他们的形象和声誉在社交网络上是如何被感知的；他们希望最小化所有可能损害其知名度的负面事件，并利用正面事件。通过以近乎实时的方式抓取大量的社交数据，他们可以提取社交群体对其品牌的情感，并识别有影响力的用户与之联系，以便根据与这些用户互动的结果来改变或强化某个趋势。


    #### CRM 数据整合


    您可以将消费者行为分析与基于访问者社交活动数据的情感分析相结合。公司希望将这些在线数据源与现有的离线数据（即 CRM，客户关系管理）结合起来，以获得更好、更准确的客户细分。因此，公司可以利用这种细分，构建更好的目标定位系统，通过营销活动发送个性化优惠。


    #### 预测


    从数据中学习已成为过去两年大数据的主要趋势。基于预测的大数据在多个行业中可能非常有效，例如在电信行业，预测路由器日志分析已得到广泛应用。每当设备上可能发生问题时，公司可以预测并订购部件，以避免停机或利润损失。


    当与之前的用例结合时，您可以使用预测架构来优化产品目录选择和定价，具体取决于用户的全局行为。

    '
- fmt: '# Understanding the Big Data Project’s Ecosystem


    Once you understand that you actually have a Big Data project to implement, the
    hardest thing is choosing the technologies to use in your architecture. It is
    not just about picking the most famous Hadoop-related technologies, it’s also
    about understanding how to classify them in order to build a consistent distributed
    architecture.


    To get an idea of the number of projects in the Big Data galaxy, browse to [`https://github.com/zenkay/bigdata-ecosystem#projects-1`](https://github.com/zenkay/bigdata-ecosystem#projects-1)
    to see more than 100 classified projects.


    Here, you see that you might consider choosing a Hadoop distribution, a distributed
    file system, a SQL-like processing language, a machine learning language, a scheduler,
    message-oriented middleware, a NoSQL datastore, data visualization, and so on.


    Since this book’s purpose is to describe a scalable way to build a distributed
    architecture, I don’t dive into all categories of projects; instead, I highlight
    the ones you are likely to use in a typical Big Data project. You can eventually
    adapt this architecture and integrate projects depending on your needs. You’ll
    see concrete examples of using such projects in the dedicated parts.


    To make the Hadoop technology presented more relevant, we will work on a distributed
    architecture that meets the previously described typical use cases, namely these:


    *   Consumer behavioral analytics

    *   Sentiment analysis

    *   CRM onboarding and prediction


    ## Hadoop Distribution


    In a Big Data project that involves Hadoop-related ecosystem technologies, you
    have two choices:


    *   Download the project you need separately and try to create or assemble the
    technologies in a coherent, resilient, and consistent architecture.

    *   Use one of the most popular Hadoop distributions, which assemble or create
    the technologies for you.


    Although the first option is completely feasible, you might want to choose the
    second one, because a packaged Hadoop distribution ensures capability between
    all installed components, ease of installation, configuration-based deployment,
    monitoring, and support.


    `Hortonworks` and `Cloudera` are the main actors in this field. There are a couple
    of differences between the two vendors, but for starting a Big Data package, they
    are equivalent, as long as you don’t pay attention to the proprietary add-ons.


    My goal here is not to present all the components within each distribution but
    to focus on what each vendor adds to the standard ecosystem. I describe most of
    the other components in the following pages depending on what we need for our
    architecture in each situation.


    ### Cloudera CDH


    `Cloudera` adds a set of in-house components to the Hadoop-based components; these
    components are designed to give you better cluster management and search experiences.


    The following is a list of some of these components:


    *   `Impala`: A real-time, parallelized, SQL-based engine that searches for data
    in `HDFS` (Hadoop Distributed File System) and `Base`. `Impala` is considered
    to be the fastest querying engine within the Hadoop distribution vendors market,
    and it is a direct competitor of `Spark` from UC Berkeley.

    *   `Cloudera Manager`: This is `Cloudera`’s console to manage and deploy Hadoop
    components within your Hadoop cluster.

    *   `Hue`: A console that lets the user interact with the data and run scripts
    for the different Hadoop components contained in the cluster.


    Figure [1-1](#A978-1-4842-1326-1_1_Chapter.html#Fig1) illustrates `Cloudera`’s
    Hadoop distribution with the following component classification:


    ![A978-1-4842-1326-1_1_Fig1_HTML.jpg](A978-1-4842-1326-1_1_Fig1_HTML.jpg)


    Figure 1-1.


    The Cloudera Hadoop distribution


    *   The components in orange are part of Hadoop core stack.

    *   The components in pink are part of the Hadoop ecosystem project.

    *   The components in blue are `Cloudera`-specific components.


    ### Hortonworks HDP


    `Hortonworks` is 100-percent open source and is used to package stable components
    rather than the last version of the Hadoop project in its distribution.


    It adds a component management console to the stack that is comparable to `Cloudera
    Manager`.


    Figure [1-2](#A978-1-4842-1326-1_1_Chapter.html#Fig2) shows a `Hortonworks` distribution
    with the same classification that appeared in Figure [1-1](#A978-1-4842-1326-1_1_Chapter.html#Fig1);
    the difference is that the components in green are `Hortonworks`-specific components.


    ![A978-1-4842-1326-1_1_Fig2_HTML.jpg](A978-1-4842-1326-1_1_Fig2_HTML.jpg)


    Figure 1-2.


    Hortonworks Hadoop distribution


    As I said before, these two distributions (`Hortonworks` and `Cloudera`) are equivalent
    when it comes to building our architecture. Nevertheless, if we consider the maturity
    of each distribution, then the one we should choose is `Cloudera`; the `Cloudera
    Manager` is more complete and stable than `Ambari` in terms of features. Moreover,
    if you are considering letting the user interact in real-time with large data
    sets, you should definitely go with `Cloudera` because its performance is excellent
    and already proven.


    ### Hadoop Distributed File System (HDFS)


    You may be wondering where the data is stored when it is ingested into the Hadoop
    cluster. Generally it ends up in a dedicated file system called `HDFS`.


    These are `HDFS`’s key features:


    *   Distribution

    *   High-throughput access

    *   High availability

    *   Fault tolerance

    *   Tuning

    *   Security

    *   Load balancing


    `HDFS` is the first class citizen for data storage in a Hadoop cluster. Data is
    automatically replicated across the cluster data nodes.


    Figure [1-3](#A978-1-4842-1326-1_1_Chapter.html#Fig3) shows how the data in `HDFS`
    can be replicated over a cluster of five nodes.


    ![A978-1-4842-1326-1_1_Fig3_HTML.jpg](A978-1-4842-1326-1_1_Fig3_HTML.jpg)


    Figure 1-3.


    HDFS data replication


    You can find out more about `HDFS` at `hadoop.apache.org`.


    ## Data Acquisition


    Data acquisition or ingestion can start from different sources. It can be large
    log files, streamed data, ETL processing outcome, online unstructured data, or
    offline structure data.


    ### Apache Flume


    When you are looking to produce ingesting logs, I would highly recommend that
    you use `Apache Flume`; it’s designed to be reliable and highly available and
    it provides a simple, flexible, and intuitive programming model based on streaming
    data flows. Basically, you can configure a data pipeline without a single line
    of code, only through configuration.


    `Flume` is composed of sources, channels, and sinks. The `Flume` source basically
    consumes an event from an external source, such as an `Apache Avro` source, and
    stores it into the channel. The channel is a passive storage system like a file
    system; it holds the event until a sink consumes it. The sink consumes the event,
    deletes it from the channel, and distributes it to an external target.


    Figure [1-4](#A978-1-4842-1326-1_1_Chapter.html#Fig4) describes the log flow between
    a web server, such as `Apache`, and `HDFS` through a `Flume` pipeline.


    ![A978-1-4842-1326-1_1_Fig4_HTML.jpg](A978-1-4842-1326-1_1_Fig4_HTML.jpg)


    Figure 1-4.


    Flume architecture


    With `Flume`, the idea is to use it to move different log files that are generated
    by the web servers to `HDFS`, for example. Remember that we are likely to work
    on a distributed architecture that might have load balancers, HTTP servers, application
    servers, access logs, and so on. We can leverage all these assets in different
    ways and they can be handled by a `Flume` pipeline. You can find out more about
    `Flume` at `flume.apache.org`.'
