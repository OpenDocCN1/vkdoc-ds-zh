    \       \"_id\": \"AU7ReZIVvtspbVGliqwM\",\n            \"_score\": 1,\n     \
    \       \"_source\": {\n               \"getRequest\": 34,\n               \"\
    postRequest\": 12\n            }\n         }\n      ]\n   }\n}\n```\n\n我们可以看到我们的文档保存了\
    \ `PageStatistic` 对象中计算出的两个字段。但这种级别的简单计算是 Elasticsearch 可以轻松实现的；我们将在下一节中看到具体方法。请记住，在下一章中，我们将尝试强调这个\
    \ Spark 处理管道，以展示该技术栈的全部威力。\n\n## 使用 Elasticsearch 进行数据分析\n\n### 聚合框架简介\n\nElasticsearch\
    \ 提供了一套强大的 API，让用户能够充分利用他们的数据。聚合框架可以将数据分组，并支持对从小到大的数据集进行实时分析查询。\n\n我们使用 Spark\
    \ 进行的简单分析，同样可以使用 Elasticsearch 的聚合框架大规模地完成。该框架分为两种类型的聚合：\n\n*   **桶聚合**：旨在根据文档共有的键和标准对一组文档进行分组。满足条件的文档落入相应的桶中。\n\
    *   **指标聚合**：旨在对一组文档计算指标，例如平均值、最大值、最小值，甚至日期直方图。\n\n事实上，聚合的强大之处在于它们可以嵌套。\n"
- fmt: "### Bucket Aggregation\n\nBucket aggregation is used to create groups of documents.\
    \ As opposed to metric aggregation, this can be nested so that you can get real-time\
    \ multilevel aggregation. Whereas in Spark creating the `PageStatistic` structure\
    \ needed a bunch of coding and logic that would differ from a developer to the\
    \ other, which could affect the performance of the processing dramatically, in\
    \ Elasticsearch there is less work to reach the same target.\n\nThe bucketing\
    \ aggregation is really easy to implement. Let’s take an example of verb distribution;\
    \ if we want to group document per verb, all we have to do is follow the code\
    \ shown in Listing [5-28](#A978-1-4842-1326-1_5_Chapter.html#FPar30).\n\n**Listing\
    \ 5-28.** Term aggregation on clickstream http verb\n\n```\ncurl -XGET \"http://192.168.59.103:9200/clickstream-2015.07.27/_search\"\
    \ -d'\n{\n  \"size\": 0,\n  \"aggs\": {\n    \"by_verb\": {\n      \"terms\":\
    \ {\n        \"field\": \"verb\"\n      }\n    }\n  }\n}'\n```\n\nWhich then returns\
    \ the code shown in Listing [5-29](#A978-1-4842-1326-1_5_Chapter.html#FPar31).\n\
    \n**Listing 5-29.** Term aggregation result\n\n```\n{\n  \"took\": 11,\n  \"timed_out\"\
    : false,\n  \"_shards\": {\n    \"total\": 1,\n    \"successful\": 1,\n    \"\
    failed\": 0\n  },\n  \"hits\": {\n    \"total\": 29280,\n    \"max_score\": 0,\n\
    \    \"hits\": []\n  },\n  \"aggregations\": {\n    \"by_verb\": {\n      \"doc_count_error_upper_bound\"\
    : 0,\n      \"sum_other_doc_count\": 0,\n      \"buckets\": [\n        {\n   \
    \       \"key\": \"get\",\n          \"doc_count\": 24331\n        },\n      \
    \  {\n          \"key\": \"post\",\n          \"doc_count\": 4949\n        }\n\
    \      ]\n    }\n  }\n}\n```\n\nAs you can see, I’m running the aggregation in\
    \ couple of milliseconds, so near real time (`11` ms) and getting the distribution\
    \ of `get` and `post` HTTP verbs. But what if we want to get an equivalent result\
    \ that we had in Spark, a time-based distribution of HTTP verbs? Let’s use the\
    \ date histogram aggregation and have a nested term aggregation into it, as shown\
    \ in Listing [5-30](#A978-1-4842-1326-1_5_Chapter.html#FPar32).\n\n**Listing 5-30.**\
    \ Date histogram with nested term aggregation\n\n```\ncurl -XGET \"http://192.168.59.103:9200/clickstream-2015.07.27/_search\"\
    \ -d'\n{\n  \"size\": 0,\n  \"aggs\": {\n    \"over_time\": {\n      \"date_histogram\"\
    : {\n        \"field\": \"@timestamp\",\n        \"interval\": \"minute\"\n  \
    \    },\n      \"aggs\": {\n        \"by_verb\": {\n          \"terms\": {\n \
    \           \"field\": \"verb\"\n          }\n        }\n      }\n    }\n  }\n\
    }'\n```\n\nThe date histogram aggregation is indeed really easy to use; it specifies:\n\
    - The field (`@timestamp`) holding the timestamp that the histogram will use\n\
    - The interval for bucketing. Here I’ve used `minute` because I’m indexing more\
    \ than 1 million documents on the laptop while I’m writing this book. This obviously\
    \ takes time so I’m sure to have document distributed over minutes. I could have\
    \ used `day`, `month`, or `year`, or specified a date expression `2h` for “every\
    \ 2 hours”.\n\nYou see the nested term aggregation in my query; let’s just switch\
    \ the interval to `20m` for getting a more condensed result, shown in Listing\
    \ [5-31](#A978-1-4842-1326-1_5_Chapter.html#FPar33).\n\n**Listing 5-31.** Date\
    \ histogram and nested term aggregation result\n\n```\n{\n  \"took\": 73,\n  \"\
    timed_out\": false,\n  \"_shards\": {\n    \"total\": 1,\n    \"successful\":\
    \ 1,\n    \"failed\": 0\n  },\n  \"hits\": {\n    \"total\": 228387,\n    \"max_score\"\
    : 0,\n    \"hits\": []\n  },\n  \"aggregations\": {\n    \"over_time\": {\n  \
    \    \"buckets\": [\n        {\n          \"key_as_string\": \"2015-07-27T11:20:00.000Z\"\
    ,\n          \"key\": 1437996000000,\n          \"doc_count\": 105442,\n     \
    \     \"by_verb\": {\n            \"doc_count_error_upper_bound\": 0,\n      \
    \      \"sum_other_doc_count\": 0,\n            \"buckets\": [\n             \
    \ {\n                \"key\": \"get\",\n                \"doc_count\": 87593\n\
    \              },\n              {\n                \"key\": \"post\",\n     \
    \           \"doc_count\": 17849\n              }\n            ]\n          }\n\
    \        },\n        {\n          \"key_as_string\": \"2015-07-27T11:40:00.000Z\"\
    ,\n          \"key\": 1437997200000,\n          \"doc_count\": 122945,\n     \
    \     \"by_verb\": {\n            \"doc_count_error_upper_bound\": 0,\n      \
    \      \"sum_other_doc_count\": 0,\n            \"buckets\": [\n             \
    \ {\n                \"key\": \"get\",\n                \"doc_count\": 102454\n\
    \              },\n              {\n                \"key\": \"post\",\n     \
    \           \"doc_count\": 20491\n              }\n            ]\n          }\n\
    \        }\n      ]\n    }\n  }\n}\n```\n\nAs you can see, we get two buckets\
