- fmt: "### Architecture Diagram\n\nFirst, before going through the architecture details,\
    \ let's discuss the word streaming, which can be misunderstood in the context\
    \ of this chapter. Indeed by streaming architecture, I mean here an architecture\
    \ that is capable to ingest data as they come.\n\nData can be generated by different\
    \ providers: application log files such as Apache HTTP access logs, your REST\
    \ API logs, from a message broker technology such as Apache Kafka, or even directly\
    \ from a TCP endpoint.\n\nGenerally, the data are ingested and then transported\
    \ to a buffer layer, most of the time based on a message broker. We call this\
    \ part the shipping part of the logging architecture. The buffer part is often\
    \ used to ensure that no data will be lost and decouple the architecture between\
    \ the shipping part and the processing part.\n\nThe message broker should be distributed\
    \ and guarantee the persistence of data whenever data are streamed in the architecture.\n\
    \nAfter buffering, two kinds of processing architecture can be set up:\n\n- A\
    \ processing pipeline that aims to transform, format, validate, and enrich the\
    \ data before persisting it. Most of the time the technology that ensures shipping\
    \ handles this part. Some technologies also handle the shipping, buffering, and\
    \ processing parts.\n- A processing pipeline that handles Hadoop-based technology\
    \ that provides extra features to the processing, such as machine learning capabilities.\n\
    \nFigure [4-1](#A978-1-4842-1326-1_4_Chapter.html#Fig1) gives a graphical representation\
    \ of what we just discussed.\n\n![A978-1-4842-1326-1_4_Fig1_HTML.jpg](A978-1-4842-1326-1_4_Fig1_HTML.jpg)\n\
    \nFigure 4-1. Anatomy of a typical data ingesting architecture\n\n### Technologies\n\
    \nLet's put some names now to those high-level blocks. For the ingestion part,\
    \ the most used technologies might be `Apache Flume` and `Logstash` from Elastic.\
    \ Those are the two preferred technologies to ingest stream data from multiple\
    \ varieties of data sources, process them, and then index them.\n\n`Flume` architecture\
    \ is scalable and relies on the three-tier structure shown in Figure [4-2](#A978-1-4842-1326-1_4_Chapter.html#Fig2).\n\
    \n![A978-1-4842-1326-1_4_Fig2_HTML.jpg](A978-1-4842-1326-1_4_Fig2_HTML.jpg)\n\n\
    Figure 4-2. Flume architecture\n\nThe `Flume` source receives data from an external\
    \ source and stores it in one or more `Flume` channels. Once in the channel, the\
    \ data is stored and kept until the sink properly drains it. The sink writes the\
    \ message in the target store. Most of the time `Flume` is used in Hadoop architecture\
    \ because of the simplicity to write in `HDFS`, for example. `Flume` is capable\
    \ of guaranteeing data delivery from a bunch of data sources such as `Avro`, `Thrift`,\
    \ `Syslog`, or another `Flume` agent; to `HDFS`, log files, `Avro`, or directly\
    \ to `HBase` and even `Elasticsearch`. Its horizontal scalability ensures fault\
    \ tolerance and high throughput.\n\nOn the other side, `Logstash` is totally different\
    \ from a structural point of view. `Logstash` is a single block agent that receives,\
    \ forwards, and forgets the log. By forget, I don't mean that `Logstash` doesn't\
    \ keep track of what it just consumed (a file, for example), but that it doesn't\
    \ come with a buffer layer that is used to persist the data in order to provide\
    \ resiliency out of the box. `Logstash` is written in `JRuby` and runs within\
    \ a `JVM`. To prevent downsides of using a `JVM` for transporting logs, `Logstash`\
    \ comes with `Logstash-forwarder`, which are specific agents used to receive and\
    \ forward the logs to another program.\n\nThe typical usage of `Logstash` relies\
    \ on the architecture shown in Figure [4-3](#A978-1-4842-1326-1_4_Chapter.html#Fig3).\n\
    \n![A978-1-4842-1326-1_4_Fig3_HTML.jpg](A978-1-4842-1326-1_4_Fig3_HTML.jpg)\n\n\
    Figure 4-3. Logstash logging platform typical architecture\n\nAs we can see, the\
    \ architecture is divided following the structure discussed earlier, with the\
    \ following specificities:\n\n- The first part is composed of `Logstash-forwarders`\
    \ installed next to the log sources, which only receive the data and send them\
    \ to a `Logstash` instances group responsible for processing the logs before putting\
    \ them into a message broker.\n- The second part is based on a message broker;\
    \ the recommended ones are `RabbitMQ`, `Kafka`, and `Redis`. For the sake of simplicity\
    \ and because it would take many pages to go through each and every possible combination,\
    \ we'll focus on `Apache Kafka`, which tends to have the best traction these days.\n\
    - The third part is based on the `Logstash` processors group, which can validate\
    \ events before indexing them into `Elasticsearch`.\n\nIn `Logstash`, a processing\
    \ pipeline is a declarative configuration–oriented file, which is composed of\
    \ inputs, filters, and outputs.\n\n`Logstash` comes with a palette of inputs/outputs\
    \ that lets you connect to a variety of data sources such as file, syslog, `tcp`,\
    \ `xmpp`, and more. The full list of supported inputs is available on the following\
    \ pages:\n\n- [https://www.elastic.co/guide/en/logstash/current/input-plugins.html](https://www.elastic.co/guide/en/logstash/current/input-plugins.html)\n\
    - [https://www.elastic.co/guide/en/logstash/current/output-plugins.html](https://www.elastic.co/guide/en/logstash/current/output-plugins.html)\n\
    \nFilters help process events by only configuring a filter depending on your need.\
    \ For example, if you want to convert a field of the received event to an integer,\
    \ all you have to write is what's shown in Listing 4-1.\n\nListing 4-1. Logstash\
    \ filter example\n\n```\nfilter {\n\n  mutate {\n\n    convert => { \"fieldname\"\
    \ => \"integer\" }\n\n  }\n\n}\n```\n\nWe will examine in deeper detail an example\
    \ of a processing pipeline that reads logs and processes them later in this chapter,\
    \ but for now, here is the link to the list of supported filters:\n\n- [https://www.elastic.co/guide/en/logstash/current/filter-plugins.html](https://www.elastic.co/guide/en/logstash/current/filter-plugins.html)\n\
    \nYou might have noticed in the diagram that the proposal here is to index the\
    \ data in `Elasticsearch` once it has been processed. `Logstash` supports different\
    \ types of stores and has a seamless integration with `Elasticsearch`.\n\n`Elasticsearch`\
    \ will play the role of the indexation engine that we'll use later on to make\
    \ searches and analytics.\n\n## The Anatomy of the Ingested Data\n\nIn this part\
    \ we'll discuss the structure of the data we need to ingest in the streaming platform.\
    \ As mentioned, our goal is to leverage the activity of our website visitors.\
    \ We'll then focus on what we call clickstream data."
  raw: '### Architecture Diagram


    First, before going through the architecture details, let’s discuss the word streaming,
    which can be misunderstand in the context of that chapter. Indeed by streaming
    architecture, I mean here an architecture that is capable to ingest data as they
    come.


    Data can be generated by different providers, application log files such as Apache
    Hatted access logs, your REST API logs, from a message broker technology such
    as Apache Kafka, or even directly from a TCP endpoint.


    Generally, the data are ingested and then transported to a buffer layer most of
    the time based on a message broker. We call this part the shipping part of the
    logging architecture. The buffer part is often used to ensure that no data will
    be lost and decouple the architecture between the shipping part and the processing
    part.


    The message broker should be distributed and guarantees the persistence of data
    whenever data are streamed in the architecture.


    After buffering, two kind of processing architecture can be set up:


    *   A processing pipeline that aims to transform, format, validate, and enrich
    the data before persisting it. Most of the time the technology that ensures that
    shipping handles this part. Some technologies also handle the shipping, buffering,
    and processing parts.

    *   A processing pipeline that handles Hadoop-based technology that provides extra
    feature to the processing such as machine learning capabilities.


    Figure [4-1](#A978-1-4842-1326-1_4_Chapter.html#Fig1) gives a graphical representation
    of what we just discussed.


    ![A978-1-4842-1326-1_4_Fig1_HTML.jpg](A978-1-4842-1326-1_4_Fig1_HTML.jpg)


    Figure 4-1.


    Anatomy of a typical data ingesting architecture


    ### Technologies


    Let’s put some names now to those high-level blocks. For the ingestion part, the
    most used technologies might be Apache flume and Logstash from Elastic. Those
    are the two preferred technologies to ingest stream data from multiple varieties
    of data sources, process them, and then index them.


    Flume architecture is scalable and relies on the three-tier structure shown in
    Figure [4-2](#A978-1-4842-1326-1_4_Chapter.html#Fig2).


    ![A978-1-4842-1326-1_4_Fig2_HTML.jpg](A978-1-4842-1326-1_4_Fig2_HTML.jpg)


    Figure 4-2.


    Flume architecture


    The flume source receives data from an external source and stores it in one or
    more flume channel. Once in the channel, the data stored and kept until the sink
    properly drains it. The sink writes the message in the target store. Most of the
    time flume is used in Hadoop architecture because of the simplicity to write in
    HDFS, for example. Flume is capable to guarantee data delivery from a bunch of
    data sources such as Avro, Thrift, Syslog, or another flume agent; to HDFS, Log
    files, Avro, or directly to HBase and even Elasticsearch. Its horizontal scalability
    ensures fault tolerance and high throughput.


    On the other side, Logstash is totally different from a structure point of view.
    Logstash is a single block agent that receives, forwards, and forgets the log.
    By forget, I don’t mean that Logstash doesn’t keep track of what it just consumed
    (a file, for example) but that it doesn’t come with a buffer layer that is used
    to persist the data in order to provide resiliency out of the box. Logstash is
    written in JRuby and run within a JVM. To prevent downsides of using a JVM for
    transporting logs, Logstash comes with Logstash-forwarder, which are specific
    agents used to receive and forward the logs to another program.


    The typical usage of Logstash relies on the architecture shown in Figure [4-3](#A978-1-4842-1326-1_4_Chapter.html#Fig3).


    ![A978-1-4842-1326-1_4_Fig3_HTML.jpg](A978-1-4842-1326-1_4_Fig3_HTML.jpg)


    Figure 4-3.


    Logstash logging platform typical architecture


    As we can see, the architecture is divided following the structure discussed earlier,
    with the following specificity:


    *   The first part is composed of Logstash-forwarders installed next to the log
    sources, which only receives the data and send them to a Logstash instances group
    responsible of processing the logs before putting them into a message broker.

    *   The second part is based on a message broker; the recommended ones are RabbitMQ,
    Kafka, and Redis. For the sake of simplicity and because it would take many pages
    to go through each and every possible combination, we’ll focused on Apache Kafka,
    which tends to have the best using traction these days.

    *   The third part is based on the Logstash processors group, which can validate
    events before indexing them into Elasticsearch.


    In Logstash, a processing pipeline is a declarative configuration–oriented file,
    which is composed of inputs, filters, and outputs.


    Logstash comes with a palette of inputs/outputs that lets you connect to a variety
    of data sources such as file, syslog, imp, tcp, xmpp, and more. The full list
    of supported inputs are available on the following pages:


    [`https://www.elastic.co/guide/en/logstash/current/input-plugins.html`](https://www.elastic.co/guide/en/logstash/current/input-plugins.html)


    and


    [`https://www.elastic.co/guide/en/logstash/current/output-plugins.html`](https://www.elastic.co/guide/en/logstash/current/output-plugins.html)


    Filters help processing and events by only configuring a filter depending on your
    need. For example, if you want to convert a field of the received event to an
    integer, all you have to write is what’s shown in Listing [4-1](#A978-1-4842-1326-1_4_Chapter.html#FPar1).


    Listing 4-1.Logstash filter example


    `filter {`


    `mutate {`


    `convert => { "fieldname" => "integer" }`


    `}`


    `}`


    We will examine in deeper detail an example of a processing pipeline that read
    logs and process them later in this chapter, but for now, here is the link to
    list of supported filters:


    [`https://www.elastic.co/guide/en/logstash/current/filter-plugins.html`](https://www.elastic.co/guide/en/logstash/current/filter-plugins.html)


    You might have noticed in the diagram that the proposal here is to index the data
    in Elasticsearch once it has been processed. Logstash supports different type
    of stores and has a seamless integration with Elasticsearch.


    Elasticsearch will play the role of the indexation engine that we’ll use later
    on to make searches and analytics.


    ## The Anatomy of the Ingested Data


    In this part we’ll discuss the structure of the data we’ll to ingenst in the streaming
    platform. As mentioned, our goal is to leverage the activity of our website visitor.
    We’ll then focused on what we call clickstream data.'
  trans: "\n### 架构图\n\n首先，在深入探讨架构细节之前，让我们先讨论一下“流式”（streaming）这个词，它在本文的上下文中可能会被误解。实际上，我所说的流式架构，是指一种能够随着数据的到来即时摄入数据的架构。\n\
    \n数据可以由不同的提供者生成：应用程序日志文件，例如 Apache HTTP 访问日志、您的 REST API 日志；来自消息代理技术（如 Apache\
    \ Kafka）；甚至直接来自一个 TCP 端点。\n\n通常，数据被摄入后会被传输到一个缓冲层，该层大多基于消息代理。我们称这部分为日志架构的传输部分。缓冲部分通常用于确保数据不会丢失，并将架构的传输部分和处理部分解耦。\n\
    \n无论数据何时以流式方式进入架构，消息代理都应当是分布式的，并保证数据的持久性。\n\n数据经过缓冲后，可以设置两种处理架构：\n\n-   一种处理管道，旨在对数据进行转换、格式化、验证和丰富化，然后进行持久化。大多数情况下，负责传输的技术会处理这一部分。有些技术也同时处理传输、缓冲和处理部分。\n\
    -   一种基于 Hadoop 技术的处理管道，它为处理过程提供额外功能，例如机器学习能力。\n\n图 4-1 以图形方式展示了我们刚才讨论的内容。\n\n\
    ![A978-1-4842-1326-1_4_Fig1_HTML.jpg](img/A978-1-4842-1326-1_4_Fig1_HTML.jpg)\n\
    \n图 4-1. 典型数据摄入架构剖析\n\n### 技术\n\n现在，让我们为这些高层模块赋予一些具体的名称。在数据摄入方面，最常用的技术可能是 `Apache\
    \ Flume` 和 Elastic 的 `Logstash`。它们是两种常用的技术，用于从多种数据源摄入流数据，进行处理，然后建立索引。\n\n`Flume`\
    \ 架构具有可扩展性，并依赖于如图 4-2 所示的三层结构。\n\n![A978-1-4842-1326-1_4_Fig2_HTML.jpg](img/A978-1-4842-1326-1_4_Fig2_HTML.jpg)\n\
    \n图 4-2. Flume 架构\n\n`Flume` 的 Source 从外部源接收数据，并将其存储在一个或多个 `Flume` Channel 中。数据一旦进入\
    \ Channel，就会被存储并保留，直到 Sink 将其安全地排出。Sink 将消息写入目标存储。`Flume` 通常用于 Hadoop 架构中，例如，因为写入\
    \ `HDFS` 非常简单。`Flume` 能够保证从诸如 `Avro`、`Thrift`、`Syslog` 或另一个 `Flume` Agent 等数据源向\
    \ `HDFS`、日志文件、`Avro`，或直接向 `HBase` 甚至 `Elasticsearch` 输送数据。其水平扩展能力确保了容错性和高吞吐量。\n\
    \n另一方面，从结构角度来看，`Logstash` 完全不同。`Logstash` 是一个单一的模块化代理，负责接收、转发并“遗忘”日志。这里说的“遗忘”，并不是指\
    \ `Logstash` 不追踪它刚刚消费的内容（比如一个文件），而是指它没有附带一个用于持久化数据以提供开箱即用弹性的缓冲层。`Logstash` 使用\
    \ `JRuby` 编写，并运行在 `JVM` 中。为了避免使用 `JVM` 传输日志的缺点，`Logstash` 附带 `Logstash-forwarder`，这是一种专用的代理程序，用于接收和转发日志到另一个程序。\n\
    \n`Logstash` 的典型用法依赖于图 4-3 所示的架构。\n\n![A978-1-4842-1326-1_4_Fig3_HTML.jpg](img/A978-1-4842-1326-1_4_Fig3_HTML.jpg)\n\
    \n图 4-3. Logstash 日志平台的典型架构\n\n如图所示，该架构遵循我们之前讨论的结构进行划分，具有以下特点：\n\n-   第一部分由安装在日志源旁边的\
    \ `Logstash-forwarders` 组成，它们仅负责接收数据并将其发送到负责处理日志的 `Logstash` 实例组，然后再将数据放入消息代理。\n\
    -   第二部分基于一个消息代理；推荐使用 `RabbitMQ`、`Kafka` 和 `Redis`。为了简化起见，并且因为逐一介绍每种可能的组合会占用很多篇幅，我们将重点放在\
    \ `Apache Kafka` 上，它目前似乎拥有最好的发展势头。\n-   第三部分基于 `Logstash` 处理器组，它们可以在将事件索引到 `Elasticsearch`\
    \ 之前对其进行验证。\n\n在 `Logstash` 中，处理管道是一个声明式配置导向的文件，由输入（inputs）、过滤器（filters）和输出（outputs）组成。\n\
    \n`Logstash` 带有一系列输入/输出插件，让您可以连接到各种数据源，如文件、syslog、`tcp`、`xmpp` 等等。支持的输入插件完整列表可在以下页面找到：\n\
    \n-   [`www.elastic.co/guide/en/logstash/current/input-plugins.html`](https://www.elastic.co/guide/en/logstash/current/input-plugins.html)\n\
    -   [`www.elastic.co/guide/en/logstash/current/output-plugins.html`](https://www.elastic.co/guide/en/logstash/current/output-plugins.html)\n\
    \n过滤器通过根据需要配置过滤器来帮助处理事件。例如，如果您想将接收到的事件中的某个字段转换为整数，您只需编写如代码清单 4-1 所示的内容。\n\n代码清单\
    \ 4-1. Logstash 过滤器示例\n\n```\nfilter {\n\n  mutate {\n\n    convert => { \"fieldname\"\
    \ => \"integer\" }\n\n  }\n\n}\n```\n\n我们将在本章后面部分更深入地详细分析一个读取日志并处理它们的处理管道示例，但现在，先提供支持的过滤器列表链接：\n\
    \n-   [`www.elastic.co/guide/en/logstash/current/filter-plugins.html`](https://www.elastic.co/guide/en/logstash/current/filter-plugins.html)\n\
    \n您可能已经注意到在图中，建议的方法是将处理后的数据索引到 `Elasticsearch` 中。`Logstash` 支持不同类型的存储，并与 `Elasticsearch`\
    \ 无缝集成。\n\n`Elasticsearch` 将扮演索引引擎的角色，我们稍后将用它来进行搜索和分析。\n\n## 摄入数据的剖析\n\n在这部分，我们将讨论需要摄入到流式平台的数据结构。如前所述，我们的目标是利用网站访客的活动数据。因此，我们将重点关注所谓的“点击流数据”。\n"
- fmt: "### Clickstream Data\n\nI don’t think I need to remind you about the key data\
    \ that you can get from a website in terms of visitor activity. What we are about\
    \ to describe here, clickstream data, is part of it.\n\nWhen you run a website,\
    \ you will likely want to know how your visitors behave and how you can enhance\
    \ their experience. Among the challenges for a website to grow are the following:\n\
    \n*   Site traffic\n*   Unique visitor\n*   Conversion rate\n*   Pay per click\
    \ traffic volume\n*   Time on site\n*   ....\n\nHaving those KPI will help you\
    \ answer questions including: how are my pages accessed? When? How long do my\
    \ visitors stay on this or that page? Where do people prefer to spend time? How\
    \ they exit? What is the typical page-to-page navigation?\n\nBeing aware of what\
    \ is happening on your website is fundamental and, hopefully, our architecture\
    \ is made to generate data in logs files that will help us in this way.\n\nTypically,\
    \ the clickstream data are based on the web access log, generated by servers such\
    \ as Apache Server or NGINX. Depending on your logging configuration, every time\
    \ a user accesses your website and navigates through pages, for each of these\
    \ actions a line is written in the access logs. Figure [4-4](#A978-1-4842-1326-1_4_Chapter.html#Fig4)\
    \ gives an idea of the dimension brought by a clickstream data line.\n\n![A978-1-4842-1326-1_4_Fig4_HTML.jpg](A978-1-4842-1326-1_4_Fig4_HTML.jpg)\n\
    \nFigure 4-4.\n\nAnatomy of a Clickstream data\n\nThe clickstream data will give\
    \ directly or indirectly:\n\n*   Dates such as the timestamp when the event occurred,\
    \ the time spent by the visitor\n*   The user agent used to browse the website,\
    \ the version, and devices\n*   The session attached to the visitor, which will\
    \ help to make correlation between the different lines of data: the session start\
    \ time, end time, duration\n*   The page, what the visitor browsed, what the type\
    \ of request was sent to the server, the domain/subdomain\n*   Information about\
    \ visitor IP addresses, which indirectly will give information about delocalization\n\
    *   Depending on the type of information we get, it can be feasible to identity\
    \ and map the customers to the clickstream data\n\n### The Raw Data\n\nIn this\
    \ book, we’ll work with Apache HTTP server and use the Apache logging configuration\
    \ file to produce our Clickstream data. The configuration is quite simple and\
    \ uses a specific syntax that makes appear in the log line information we need.\
    \ Listing [4-2](#A978-1-4842-1326-1_4_Chapter.html#FPar2) is a typical access\
    \ log line generate by Apache HTTP server.\n\nListing 4-2.Access log line example\n\
    \n```\n10.10.10.10 - - [10/July/2015:11:1:11 +0100] \"GET /path/to/my/resource\
    \ HTTP/1.1\" 200 4392 \"http://www.domain.com/referring-page\" \" Mozilla/5.0\
    \ (Macintosh; Intel Mac OS X 10_10_3) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/43.0.2357.132\
    \ Safari/537.36\" 1224 6793\n```\n\nThis line has been produced by the Apache\
    \ log configuration, described in Listing [4-3](#A978-1-4842-1326-1_4_Chapter.html#FPar3).\n\
    \nListing 4-3.Apache logging configuration\n\n```\nLogLevel error\n\nErrorLog\
    \  /home/example/logs/error.log\n\nLogFormat \"%h %l %u %t \\\"%r\\\" %>s %b \\\
    \"%{Referer}i\\\" \\\"%{User-Agent}i\\\" %I %O\" combinedio\n\nCustomLog /home/example/logs/access.log\
    \ combinedio\n```\n\nThe line in bold gives the structure of the generated log\
    \ line:\n\n*   `10.10.10.10` (`%h`): IP address attached to the request\n*   `[10/July/2015:11:11:11\
    \ +0100]` (`%t`): reception request time. The format is `[day/month/year:hour:minute:second\
    \ zone]`\n*   `GET /path/to/my/resource HTTP/1.1` (`\\\"%r\\\"`): first line of\
    \ the request, which contains useful information such as the request type, the\
    \ path, the protocol\n*   `200` (`%>s`): the http return code\n*   `4392` (`%b`):\
    \ response size return to the client without HTTP headers in bytes\n*   `%{Referer}`:\
    \ the Referrer HTTP request header\n*   `%{User-Agent}`: the User Agent HTTP request\
    \ header\n*   `%I`: bytes received including HTTP header\n*   `%O`: bytes sent\
    \ including headers\n\nAs you can see, the data are structured by Apache in the\
    \ different corresponding part but, at the end of the day, the application that\
    \ will receive the logs will considered these data as unstructured, because parsing\
    \ them by a third-party application is not that obvious.\n\nYou then need a technology\
    \ that can consume these line as they are appended to the access log file or just\
    \ ship the file, and also that is capable of transforming these data into structured\
    \ document for later analysis and search.\n\nThat’s where Logstash comes into\
    \ play; we’ll now set up our streaming architecture and start shipping and ingesting\
    \ data.\n\n### The Log Generator\n\nThere might some public dataset that we would\
    \ be able to use for testing our streaming architecture, but for the sake of simplicity,\
    \ I’d rather implement a small log generator to create our access logs. I’ve chose\
    \ Python for implementing that generator, as shown in Listing [4-4](#A978-1-4842-1326-1_4_Chapter.html#FPar4).\n\
    \nListing 4-4.Access log code generator\n\n```\n#!/usr/bin/python\n\nimport time\n\
    import datetime\nimport random\n\ntimestr = time.strftime(\"%Y%m%d-%H%M%S\")\n\
    f = open('../source/access_log_'+timestr+'.log','w')\n\n# ips\nwith open('ips.txt')\
    \ as ips_file:\n        ips = ips_file.read().splitlines()\n\n# referers\nwith\
    \ open('referers.txt') as referers_file:\n        referers = referers_file.read().splitlines()\n\
    \n# resources\nwith open('resources.txt') as resources_file:\n        resources\
    \ = resources_file.read().splitlines()\n\n# user agents\nwith open('user_agents.txt')\
    \ as user_agents_file:\n        useragents = user_agents_file.read().splitlines()\n\
    \n# codes\nwith open('codes.txt') as codes_file:\n        codes = codes_file.read().splitlines()\n\
    \n# requests\nwith open('requests.txt') as requests_file:\n        requests =\
    \ requests_file.read().splitlines()\n\nevent_time = datetime.datetime(2013,10,10)\n\
    \nfor i in xrange(0,50000):\n        increment = datetime.timedelta(seconds=random.randint(30,300))\n\
    \        event_time += increment\n        uri = random.choice(resources)\n   \
    \     if uri.find(\"Store\")>0:\n                uri += random.randint(1000,1500)\n\
    \        ip = random.choice(ips)\n        useragent = random.choice(useragents)\n\
    \        referer = random.choice(referers)\n        code = random.choice(codes)\n\
    \        request= random.choice(requests)\n        f.write('%s - - [%s] \"%s %s\
    \ HTTP/1.0\" %s %s \"%s\" \"%s\"\\n' % (random.choice(ips),event_time.strftime('%d/%b/%Y:%H:%M:%S\
    \ %z'),request,uri,coe,random.randint(2000,5000),referer,useragent))\n```\n\n\
    This generator relies on different text files and generates in the `../source/access_log_`\
    \ as much as specified when you launch the script, like in Listing [4-5](#A978-1-4842-1326-1_4_Chapter.html#FPar5).\n\
    \nListing 4-5.Launching the generator\n\n```\n./generator.py 50000\n```\n\nThe\
    \ previous line will generate 50,000 lines of access logs. You can easily customize\
    \ the content, which is used to generate the file by updating the text fles.\n\
    \nNote that all assets used in Listing [4-4](#A978-1-4842-1326-1_4_Chapter.html#FPar4)\
    \ can be found on the following Github repo:\n\n[`https://github.com/bahaaldine/scalable-big-data-architecture/tree/master/chapter4/generator`](https://github.com/bahaaldine/scalable-big-data-architecture/tree/master/chapter4/generator)\n\
    \n## Setting Up the Streaming Architecture\n\nTo set up our streaming architecture,\
    \ we’ll split the work into two parts: shipping and processing.\n\n### Shipping\
    \ the Logs in Apache Kafka\n\nShipping data consist to transport them from the\
    \ machine that generates the data to the one which will ingest it, and process\
    \ it. This is what we will cover here with Logstash-forwarder. Then data will\
    \ be stored into an asynchronous reliable persistent layer that will ensure message\
    \ delivery. The message broker here is Apache Kafka."
  raw: '### Clickstream Data


    I don’t think I need to remind you about the key data that you can get from a
    website in terms of visitor activity. What we are about to describe here, clickstream
    data, is part of it.


    When you run a website, you will likely want to know how your visitors behave
    and how you can enhance their experience. Among the challenges for a website to
    grow are the following:


    *   Site traffic

    *   Unique visitor

    *   Conversion rate

    *   Pay per click traffic volume

    *   Time on site

    *   ....


    Having those KPI will help you answer questions including: how are my pages accessed?
    When? How long do my visitors stay on this or that page? Where do people prefer
    to spend time? How they exit? What is the typical page-to-page navigation?


    Being aware of what is happening on your website is fundamental and, hopefully,
    our architecture is made to generate data in logs files that will help us in this
    way.


    Typically, the clickstream data are based on the web access log, generated by
    servers such as Apache Server or NGINX. Depending on your logging configuration,
    every time a user accesses your website and navigates through pages, for each
    of these actions a line is written in the access logs. Figure [4-4](#A978-1-4842-1326-1_4_Chapter.html#Fig4)
    gives an idea of the dimension brought by a clickstream data line.


    ![A978-1-4842-1326-1_4_Fig4_HTML.jpg](A978-1-4842-1326-1_4_Fig4_HTML.jpg)


    Figure 4-4.


    Anatomy of a Clickstream data


    The clickstream data will give directly or indirectly:


    *   Dates such as the timestamp when the event occurred, the time spent by the
    visitor

    *   The user agent used to browse the website, the version, and devices

    *   The session attached to the visitor, which will help to make correlation between
    the different lines of data: the session start time, end time, duration

    *   The page, what the visitor browsed, what the type of request was sent to the
    server, the domain/subdomain

    *   Information about visitor IP addresses, which indirectly will give information
    about delocalization

    *   Depending on the type of information we get, it can be feasible to identity
    and map the customers to the clickstream data


    ### The Raw Data


    In this book, we’ll work with Apache HTTP server and use the Apache logging configuration
    file to produce our Clickstream data. The configuration is quite simple and uses
    a specific syntax that makes appear in the log line information we need. Listing
    [4-2](#A978-1-4842-1326-1_4_Chapter.html#FPar2) is a typical access log line generate
    by Apache HTTP server.


    Listing 4-2.Access log line example


    `10.10.10.10 - - [10/July/2015:11:1:11 +0100] "GET /path/to/my/resource HTTP/1.1"
    200 4392 "` [`http://www.domain.com/referring-page`](http://www.domain.com/referring-page)
    `" " Mozilla/5.0 (Macintosh; Intel Mac OS X 10_10_3) AppleWebKit/537.36 (KHTML,
    like Gecko) Chrome/43.0.2357.132 Safari/537.36" 1224 6793`


    This line has been produced by the Apache log configuration, described in Listing
    [4-3](#A978-1-4842-1326-1_4_Chapter.html#FPar3).


    Listing 4-3.Apache logging configuration


    `LogLevel error`


    `ErrorLog  /home/example/logs/error.log`


    `LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" %I %O"
    combinedio`


    `CustomLog /home/example/logs/access.log combinedio`


    The line in bold gives the structure of the generated log line:


    *   10.10.10.10 (%h): IP address attached to the request

    *   [10/July/2015:11:11:11 +0100] (%t): reception request time. The format is
    [day/month/year:hour:minute:second zone]

    *   GET /path/to/my/resource HTTP/1.1 (\”%r\”): first line of the request, which
    contains useful information such as the request type, the path, the protocol

    *   200 (%>s): the http return code

    *   4392 (%b): response size return to the client without HTTP headers in bytes

    *   %{Referer}: the Referrer HTTP request header

    *   %{User-Agent}: the User Agent HTTP request header

    *   %I: bytes received including HTTP header

    *   %O: bytes sent including headers


    As you can see, the data are structured by Apache in the different corresponding
    part but, at the end of the day, the application that will receive the logs will
    considered these data as unstructured, because parsing them by a third-party application
    is not that obvious.


    You then need a technology that can consume these line as they are appended to
    the access log file or just ship the file, and also that is capable of transforming
    these data into structured document for later analysis and search.


    That’s where Logstash comes into play; we’ll now set up our streaming architecture
    and start shipping and ingesting data.


    ### The Log Generator


    There might some public dataset that we would be able to use for testing our streaming
    architecture, but for the sake of simplicity, I’d rather implement a small log
    generator to create our access logs. I’ve chose Python for implementing that generator,
    as shown in Listing [4-4](#A978-1-4842-1326-1_4_Chapter.html#FPar4).


    Listing 4-4.Access log code generator


    `#!/usr/bin/python`


    `import time`


    `import datetime`


    `import random`


    `timestr = time.strftime("%Y%m%d-%H%M%S")`


    `f = open(''../source/access_log_''+timestr+''.log'',''w'')`


    `# ips`


    `with open(''ips.txt'') as ips_file:`


            `ips = ips_file.read().splitlines()`


    `# referers`


    `with open(''referers.txt'') as referers_file:`


            `referers = referers_file.read().splitlines()`


    `# resources`


    `with open(''resources.txt'') as resources_file:`


            `resources = resources_file.read().splitlines()`


    `# user agents`


    `with open(''user_agents.txt'') as user_agents_file:`


            `useragents = user_agents_file.read().splitlines()`


    `# codes`


    `with open(''codes.txt'') as codes_file:`


            `codes = codes_file.read().splitlines()`


    `# requests`


    `with open(''requests.txt'') as requests_file:`


            `requests = requests_file.read().splitlines()`


    `event_time = datetime.datetime(2013,10,10)`


    `for i in xrange(0,50000):`


            `increment = datetime.timedelta(seconds=random.randint(30,300))`


            `event_time += increment`


            `uri = random.choice(resources)`


            `if uri.find("Store")>0:`


                    `` uri += `random.randint(1000,1500)` ``


            `ip = random.choice(ips)`


            `useragent = random.choice(useragents)`


            `referer = random.choice(referers)`


            `code = random.choice(codes)`


            `request= random.choice(requests)`


            `f.write(''%s - - [%s] "%s %s HTTP/1.0" %s %s "%s" "%s"\n'' % (random.choice(ips),event_time.strftime(''%d/%b/%Y:%H:%M:%S
    %z''),request,uri,coe,random.randint(2000,5000),referer,useragent))`


    This generator relies on different text files and generates in the ../source/access_log_
    as much as specified when you launch the script, like in Listing [4-5](#A978-1-4842-1326-1_4_Chapter.html#FPar5).


    Listing 4-5.Launching the generator


    `./generator.py 50000`


    The previous line will generate 50,000 lines of access logs. You can easily customize
    the content, which is used to generate the file by updating the text fles.


    Note that all assets used in Listing [4-4](#A978-1-4842-1326-1_4_Chapter.html#FPar4)
    can be found on the following Github repo:


    [`https://github.com/bahaaldine/scalable-big-data-architecture/tree/master/chapter4/generator`](https://github.com/bahaaldine/scalable-big-data-architecture/tree/master/chapter4/generator)


    ## Setting Up the Streaming Architecture


    To set up our streaming architecture, we’ll split the work into two parts: shipping
    and processing.


    ### Shipping the Logs in Apache Kafka


    Shipping data consist to transport them from the machine that generates the data
    to the one which will ingest it, and process it. This is what we will cover here
    with Logstash-forwarder. Then data will be stored into an asynchronous reliable
    persistent layer that will ensure message delivery. The message broker here is
    Apache Kafka.'
  trans: "\n### 点击流数据\n\n我想无需提醒您，关于网站访客活动这类关键数据。我们接下来要描述的“点击流数据”正是其中的一部分。\n\n运营网站时，您很可能想了解访客的行为模式，以及如何优化他们的体验。网站要成长壮大，面临的挑战包括：\n\
    \n*   网站流量\n*   独立访客数\n*   转化率\n*   按点击付费的流量\n*   页面停留时间\n*   ……\n\n拥有这些关键绩效指标（KPI），您就能回答以下问题：我的页面是如何被访问的？何时被访问？访客在某个页面上停留了多久？人们更喜欢在哪些地方花费时间？他们是如何离开网站的？典型的页面间导航路径是怎样的？\n\
    \n了解网站上发生的情况至关重要，幸运的是，我们的架构设计正是为了在日志文件中生成数据，从而帮助我们实现这一目标。\n\n通常，点击流数据基于 Web 访问日志，这些日志由\
    \ Apache 服务器或 NGINX 等服务器生成。根据您的日志配置，每当用户访问您的网站并在页面间导航时，每个操作都会在访问日志中写入一行。图 4-4\
    \ 展示了一条点击流数据所包含的信息维度。\n\n![A978-1-4842-1326-1_4_Fig4_HTML.jpg](img/A978-1-4842-1326-1_4_Fig4_HTML.jpg)\n\
    \n图 4-4. 点击流数据的结构\n\n点击流数据将直接或间接地提供：\n\n*   日期信息，例如事件发生的时间戳、访客的停留时间\n*   用于浏览网站的用户代理、版本和设备信息\n\
    *   与访客关联的会话信息，这有助于关联不同的数据行：会话开始时间、结束时间、持续时间\n*   页面信息，包括访客浏览的内容、发送到服务器的请求类型、域名/子域名\n\
    *   访客 IP 地址信息，间接提供地理位置相关信息\n*   根据获取的信息类型，还可以将客户身份与点击流数据进行映射关联\n\n### 原始数据\n\n\
    在本书中，我们将使用 Apache HTTP 服务器，并通过其日志配置文件来生成点击流数据。配置相当简单，使用特定的语法将我们所需的信息呈现在日志行中。代码清单\
    \ 4-2 是 Apache HTTP 服务器生成的一条典型访问日志行。\n\n**代码清单 4-2. 访问日志行示例**\n\n```\n10.10.10.10\
    \ - - [10/July/2015:11:1:11 +0100] \"GET /path/to/my/resource HTTP/1.1\" 200 4392\
    \ \"http://www.domain.com/referring-page\" \" Mozilla/5.0 (Macintosh; Intel Mac\
    \ OS X 10_10_3) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/43.0.2357.132 Safari/537.36\"\
    \ 1224 6793\n```\n\n这一行由代码清单 4-3 中描述的 Apache 日志配置生成。\n\n**代码清单 4-3. Apache 日志配置**\n\
    \n```\nLogLevel error\n\nErrorLog  /home/example/logs/error.log\n\nLogFormat \"\
    %h %l %u %t \\\"%r\\\" %>s %b \\\"%{Referer}i\\\" \\\"%{User-Agent}i\\\" %I %O\"\
    \ combinedio\n\nCustomLog /home/example/logs/access.log combinedio\n```\n\n**加粗**的一行定义了生成的日志行的结构：\n\
    \n*   `10.10.10.10` (`%h`)：请求的 IP 地址\n*   `[10/July/2015:11:11:11 +0100]` (`%t`)：请求接收时间。格式为\
    \ `[日/月/年:时:分:秒 时区]`\n*   `GET /path/to/my/resource HTTP/1.1` (`\\\"%r\\\"`)：请求的第一行，包含请求类型、路径、协议等有用信息\n\
    *   `200` (`%>s`)：HTTP 返回码\n*   `4392` (`%b`)：返回到客户端的响应体大小（不含 HTTP 头），单位为字节\n\
    *   `%{Referer}`：HTTP 请求头中的 Referer（引用来源）\n*   `%{User-Agent}`：HTTP 请求头中的 User\
    \ Agent（用户代理）\n*   `%I`：接收的字节数（包含 HTTP 头）\n*   `%O`：发送的字节数（包含 HTTP 头）\n\n可以看到，Apache\
    \ 将数据组织到日志行的不同对应部分。但归根结底，接收日志的应用程序会将此数据视为非结构化数据，因为由第三方应用程序来解析它并非易事。\n\n因此，您需要一种技术，既能消费这些不断追加到访问日志文件中的行（或传输整个文件），又能将这些数据转换为结构化文档，以便后续的分析和搜索。\n\
    \n这就是 Logstash 发挥作用的地方；接下来我们将搭建流式处理架构，并开始传输和摄入数据。\n\n### 日志生成器\n\n或许有一些公共数据集可用于测试我们的流式处理架构，但为简单起见，我更倾向于实现一个小型日志生成器来创建访问日志。我选择使用\
    \ Python 来实现这个生成器，如代码清单 4-4 所示。\n\n**代码清单 4-4. 访问日志代码生成器**\n\n```\n#!/usr/bin/python\n\
    \nimport time\nimport datetime\nimport random\n\ntimestr = time.strftime(\"%Y%m%d-%H%M%S\"\
    )\nf = open('../source/access_log_'+timestr+'.log','w')\n\n# ips\nwith open('ips.txt')\
    \ as ips_file:\n        ips = ips_file.read().splitlines()\n\n# referers\nwith\
    \ open('referers.txt') as referers_file:\n        referers = referers_file.read().splitlines()\n\
    \n# resources\nwith open('resources.txt') as resources_file:\n        resources\
    \ = resources_file.read().splitlines()\n\n# user agents\nwith open('user_agents.txt')\
    \ as user_agents_file:\n        useragents = user_agents_file.read().splitlines()\n\
    \n# codes\nwith open('codes.txt') as codes_file:\n        codes = codes_file.read().splitlines()\n\
    \n# requests\nwith open('requests.txt') as requests_file:\n        requests =\
    \ requests_file.read().splitlines()\n\nevent_time = datetime.datetime(2013,10,10)\n\
    \nfor i in xrange(0,50000):\n        increment = datetime.timedelta(seconds=random.randint(30,300))\n\
    \        event_time += increment\n        uri = random.choice(resources)\n   \
    \     if uri.find(\"Store\")>0:\n                uri += random.randint(1000,1500)\n\
    \        ip = random.choice(ips)\n        useragent = random.choice(useragents)\n\
    \        referer = random.choice(referers)\n        code = random.choice(codes)\n\
    \        request= random.choice(requests)\n        f.write('%s - - [%s] \"%s %s\
    \ HTTP/1.0\" %s %s \"%s\" \"%s\"\\n' % (random.choice(ips),event_time.strftime('%d/%b/%Y:%H:%M:%S\
    \ %z'),request,uri,coe,random.randint(2000,5000),referer,useragent))\n```\n\n\
    这个生成器依赖于不同的文本文件，并在 `../source/access_log_` 目录下生成指定数量的日志行，如代码清单 4-5 所示。\n\n**代码清单\
    \ 4-5. 启动生成器**\n\n```\n./generator.py 50000\n```\n\n上面这行命令将生成 50,000 行访问日志。您可以通过更新文本文件轻松自定义用于生成日志的内容。\n\
    \n请注意，代码清单 4-4 中使用的所有资源文件均可在以下 Github 仓库中找到：\n\n[`https://github.com/bahaaldine/scalable-big-data-architecture/tree/master/chapter4/generator`](https://github.com/bahaaldine/scalable-big-data-architecture/tree/master/chapter4/generator)\n\
    \n## 搭建流式处理架构\n\n为了搭建流式处理架构，我们将工作分为两部分：数据传输和数据处理。\n\n### 将日志传输到 Apache Kafka\n\
    \n数据传输指的是将数据从生成它的机器传输到将要摄入并处理它的机器上。这正是我们接下来要使用 Logstash-forwarder 完成的工作。然后，数据将被存储到一个异步的、可靠的持久化层中，以确保消息的可靠投递。这里使用的消息代理是\
    \ Apache Kafka。\n"
- fmt: "#### The Forwarders\n\nIn the following section, we will first start by installing\
    \ the forwarder, and configuring it, specifically the security part ensured by\
    \ Lumberjack, the secured transport protocol.\n\n##### Installation\n\n`Logstash-forwarder`\
    \ is written in Go and can be installed either by an RPM or directly from the\
    \ sources. I’ll use the second way and follow these steps:\n\n- Install Go from\
    \ this URL: [`http://golang.org/doc/install`](http://golang.org/doc/install)\n\
    - Fetch the source from the git repository: `git clone git://github.com/elasticsearch/logstash-forwarder.git`\n\
    - And finally compile it:\n\n```\ncd logstash-forwarder\ngo build -o logstash-forwarder\n\
    ```\n\n`Logstash` installation is straightforward. You just need to download the\
    \ appropriate package on the following page: [`https://www.elastic.co/downloads/logstash`](https://www.elastic.co/downloads/logstash)\n\
    \n##### Lumberjack: The Secured Protocol\n\n`Forwarder` will be installed next\
    \ to the data sources, and will transport and send the logs to the `Logstash`\
    \ processors. This uses the lumberjack protocol, which is secured and requires\
    \ a valid private key (`.key` file) and an SSL certificate (`.crt` file). Both\
    \ `Logstash-forwarder` and `Logstash` server will use these assets to secure the\
    \ data transport.\n\nTo generate a valid `KEY` and `CRT` file, run the command\
    \ described in listing [4-6](#A978-1-4842-1326-1_4_Chapter.html#FPar6).\n\nListing\
    \ 4-6.Key and Certificate command line\n\n```\nopenssl req -x509  -batch -nodes\
    \ -newkey rsa:2048 -keyout lumberjack.key -out lumberjack.crt -subj /CN=localhost\n\
    ```\n\nThis command will generate `lumberjack.key` and `lumberjack.crt`. An important\
    \ thing to mention here is about the certificate. The subject used to generate\
    \ the certificate should be the same that the one that will be used in the `Logstash-forwarder`\
    \ file. Here we generate the certificate with a `CN=local host`, then in the forwarder\
    \ file we’ll need to use `localhost` as well. More information about this can\
    \ be found on this page: [`https://github.com/elastic/logstash-forwarder#important-tlsssl-certificate-notes`](https://github.com/elastic/logstash-forwarder#important-tlsssl-certificate-notes)\n\
    \n##### The Configuration Files\n\n`Logstash-forwarder` configuration is composed\
    \ of network and file subconfiguration; Listing [4-7](#A978-1-4842-1326-1_4_Chapter.html#FPar7)\
    \ shows the configuration that I’m using for the example project.\n\nListing 4-7.Logstash\
    \ configuration file, which can be found at: [`https://github.com/bahaaldine/scalable-big-data-architecture/blob/master/chapter4/logstash/forwarder/forwarder.json`](https://github.com/bahaaldine/scalable-big-data-architecture/blob/master/chapter4/logstash/forwarder/forwarder.json)\n\
    \n```\n{\n  \"network\": {\n    \"servers\": [ \"HOST:PORT\" ],\n    \"ssl certificate\"\
    : \"path/to/the/crt/file\",\n    \"ssl key\": \"path/to/the/key/file\",\n    \"\
    ssl ca\": \"path/to/the/crt/file\",\n    \"timeout\": 15\n  },\n  \"files\": [\n\
    \    {\n      \"paths\": [\n        \"path/to/the/log/files\"\n      ],\n    \
    \  \"fields\": { \"type\": \"access_log\" }\n    },\n    {\n      \"paths\": [\
    \ \"-\" ],\n      \"fields\": { \"type\": \"stdin\" }\n    }\n  ]\n}\n```\n\n\
    Let’s explain just a little bit this configuration:\n\n- Network configuration\
    \ basically uses an array of target downstream servers that will receive the log\
    \ files. Each item in the `servers` array is a location to a server, e.g., `localhost:5043`.\n\
    \  - Then the `ssl*` entries point to the `.key` and `.crt` files that we have\
    \ just generated earlier.\n  - Last parameter is the `timeout` that defines the\
    \ time that a `Logstash-forwarder` will wait for a downstream server before assuming\
    \ the connection is interrupted and then try to connect to another server from\
    \ the server’s array.\n\n- The `files` entry is an array of the data that will\
    \ be transported; in my example, I’m using:\n  - An absolute path to directory\
    \ that will contain the example log files used for this book. The field value\
    \ sets the event type.\n  - A special path containing a `-`, which means that\
    \ the `Logstash-forwarder` will forward the standard input content, in other words,\
    \ whatever you type in the command line prompt. This is a good way to test the\
    \ transport pipeline between `Logstash-forwarder` and `Logstash` server.\n\nThere\
    \ are more options to configure the files path such as using wildcards that are\
    \ really practical for rotating log files. More information on the configuration\
    \ can be found on the `Logstash-forwarder` Github repository: [`https://github.com/elastic/logstash-forwarder`](https://github.com/elastic/logstash-forwarder)\n\
    \n`Logstash` processing agent also needs a configuration file. It follows a direct\
    \ structure as mentioned in this chapter. Listing [4-8](#A978-1-4842-1326-1_4_Chapter.html#FPar8)\
    \ shows the one that I’m using for this book.\n\nListing 4-8.Logstash processing\
    \ pipeline example, which can be found at: [`https://github.com/bahaaldine/scalable-big-data-architecture/blob/master/chapter4/logstash/processor/forwarder_to_kafka.conf`](https://github.com/bahaaldine/scalable-big-data-architecture/blob/master/chapter4/logstash/processor/forwarder_to_kafka.conf)\n\
    \n```\ninput {\n  lumberjack {\n    port => \"5043\"\n    ssl_certificate => \"\
    path/to/crt/file\"\n    ssl_key => \"path/to/key/file\"\n  }\n}\n\nfilter {\n\
    \  grok {\n    match => {\n      \"message\" => \"%{COMBINEDAPACHELOG}\"\n   \
    \ }\n  }\n}\n\noutput {\n  stdout { codec => rubydebug }\n  kafka {\n    topic_id\
    \ => \"clickstream\"\n  }\n}\n```\n\nThree parts are present in this configuration\
    \ file:\n\n- **Input**: contains the input stream that `Logstash` listens to,\
    \ to receive the data. Here we are listening on `localhost:5043` to our `Logstash-forwarder`\
    \ and, as mentioned, we are using the `.key` and `.crt` files.\n- **Filter**:\
    \ takes each line contained in the received logs and transforms them into a structured\
    \ event. Here we are using `grok` filter, which is particularly useful when dealing\
    \ with Apache HTTP server combined log. The `grok` combined log pattern is a composition\
    \ of multiple `grok` patterns. It has the declaration described in Listing [4-9](#A978-1-4842-1326-1_4_Chapter.html#FPar9).\n\
    \nListing 4-9.Grok Apache common log & combined log pattern\n\n```\nCOMMONAPACHELOG\
    \ %{IPORHOST:clientip} %{USER:ident} %{USER:auth} \\[%{HTTPDATE:timestamp}\\]\
    \ \"(?:%{WORD:verb} %{NOTSPACE:request}(?: HTTP/%{NUMBER:httpversion})?|%{DATA:rawrequest})\"\
    \ %{NUMBER:response} (?:%{NUMBER:bytes}|-)\nCOMBINEDAPACHELOG %{COMMONAPACHELOG}\
    \ %{QS:referrer} %{QS:agent}\n```\n\n- The `COMBINEDAPACHELOG` pattern relies\
    \ on two other patterns: `COMMONAPACHELOG` and `QS` patterns. Indeed, `grok` comes\
    \ with a set of predefined patterns that can be reused and composed to create\
    \ multi-level patterns. You can get more information on the `grok` filter on this\
    \ page: [`https://www.elastic.co/guide/en/logstash/current/plugins-filters-grok.html`](https://www.elastic.co/guide/en/logstash/current/plugins-filters-grok.html)\
    \ and more on the predefined patterns here: [`https://github.com/elastic/logstash/blob/v1.4.2/patterns/grok-patterns`](https://github.com/elastic/logstash/blob/v1.4.2/patterns/grok-patterns)\n\
    \n- **Output**: connection to our Apache Kafka server to put the data there. We\
    \ also used a `stdout` output with a `ruby` codec, which is really handy to debug\
    \ the pipeline and see the structure of the event."
