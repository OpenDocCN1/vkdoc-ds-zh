  raw: '#### Bucket Aggregation


    Bucket aggregation is used to create groups of documents. As opposed to metric
    aggregation, this can be nested so that you can get real-time multilevel aggregation.
    Whereas in Spark creating the PageStatistic structure needed a bunch of coding
    and logic that would differ from a developer to the other, which could affect
    the performance of the processing dramatically, in Elasticsearch there is less
    work to reach the same target.


    The bucketing aggregation is really easy to implement. Let’s take an example of
    verb distribution; if we want to group document per verb, all we have to do is
    follow the code shown in Listing [5-28](#A978-1-4842-1326-1_5_Chapter.html#FPar30).


    Listing 5-28.Term aggregation on clickstream http verb


    `curl -XGET "http://192.168.59.103:9200/clickstream-2015.07.27/_search" -d''`


    `{`


    `"size": 0,`


    `"aggs": {`


    `"by_verb": {`


    `"terms": {`


    `"field": "verb"`


    `}`


    `}`


    `}`


    `}''`


    Which then returns the code shown in Listing [5-29](#A978-1-4842-1326-1_5_Chapter.html#FPar31).


    Listing 5-29.Term aggregation result


    `{`


    `"took": 11,`


    `"timed_out": false,`


    `"_shards": {`


    `"total": 1,`


    `"successful": 1,`


    `"failed": 0`


    `},`


    `"hits": {`


    `"total": 29280,`


    `"max_score": 0,`


    `"hits": []`


    `},`


    `"aggregations": {`


    `"by_verb": {`


    `"doc_count_error_upper_bound": 0,`


    `"sum_other_doc_count": 0,`


    `"buckets": [`


    `{`


    `"key": "get",`


    `"doc_count": 24331`


    `},`


    `{`


    `"key": "post",`


    `"doc_count": 4949`


    `}`


    `]`


    `}`


    `}`


    `}`


    As you can see, I’m running the aggregation in couple of milliseconds, so near
    real time (11 ms) and getting the distribution of get and post HTTP verbs. But
    what if we want to get an equivalent result that we had in Spark, a time-based
    distribution of HTTP verbs? Let’s use the date histogram aggregation and have
    a nested term aggregation into it, as shown in Listing [5-30](#A978-1-4842-1326-1_5_Chapter.html#FPar32).


    Listing 5-30.Date histogram with nested term aggregation


    `curl -XGET "http://192.168.59.103:9200/clickstream-2015.07.27/_search" -d''`


    `{`


    `"size": 0,`


    `"aggs": {`


    `"over_time": {`


    `"date_histogram": {`


    `"field": "@timestamp",`


    `"interval": "minute"`


    `},`


    `"aggs": {`


    `"by_verb": {`


    `"terms": {`


    `"field": "verb"`


    `}`


    `}`


    `}`


    `}`


    `}`


    `}''`


    The date histogram aggregation is indeed really easy to use; it specifies:


    *   The field holding the timestamp that the histogram will use

    *   The interval for bucketing. Here I’ve used minute because I’m indexing more
    than 1 million documents on the laptop while I’m writing this book. This obviously
    takes time so I’m sure to have document distributed over minutes. I could have
    used day, month, or year, or specified a date expression 2h for “every 2 hours”.


    You see the nested term aggregation in my query; let’s just switch the interval
    to 20m for getting a more condensed result, shown in Listing [5-31](#A978-1-4842-1326-1_5_Chapter.html#FPar33).


    Listing 5-31.Date histogram and nested term aggregation result


    `{`


    `"took": 73,`


    `"timed_out": false,`


    `"_shards": {`


    `"total": 1,`


    `"successful": 1,`


    `"failed": 0`


    `},`


    `"hits": {`


    `"total": 228387,`


    `"max_score": 0,`


    `"hits": []`


    `},`


    `"aggregations": {`


    `"over_time": {`


    `"buckets": [`


    `{`


    `"key_as_string": "2015-07-27T11:20:00.000Z",`


    `"key": 1437996000000,`


    `"doc_count": 105442,`


    `"by_verb": {`


    `"doc_count_error_upper_bound": 0,`


    `"sum_other_doc_count": 0,`


    `"buckets": [`


    `{`


    `"key": "get",`


    `"doc_count": 87593`


    `},`


    `{`


    `"key": "post",`


    `"doc_count": 17849`


    `}`


    `]`


    `}`


    `},`


    `{`


    `"key_as_string": "2015-07-27T11:40:00.000Z",`


    `"key": 1437997200000,`


    `"doc_count": 122945,`


    `"by_verb": {`


    `"doc_count_error_upper_bound": 0,`


    `"sum_other_doc_count": 0,`


    `"buckets": [`


    `{`


    `"key": "get",`


    `"doc_count": 102454`


    `},`


    `{`


    `"key": "post",`


    `"doc_count": 20491`


    `}`


    `]`


    `}`


    `}`


    `]`


    `}`


    `}`


    `}`


    As you can see, we get two buckets of 20 minutes data and the nested distribution
    of HTTP verbs. This kind of aggregation is ideal when you want to draw them as
    timelines or bar charts that render the data over time with a fine control of
    the period of time you want to analyze the data.


    Let’s now see what happen if we use a metric aggregation.'
  trans: "\n### 桶聚合\n\n桶聚合用于创建文档分组。与指标聚合不同，它可以嵌套使用，从而获得实时的多级聚合。在 Spark 中，创建`PageStatistic`结构需要大量编码，且逻辑会因开发者而异，这可能会显著影响处理性能；而在\
    \ Elasticsearch 中，要达到相同目标的工作量要少得多。\n\n桶聚合的实现非常简单。我们以动词分布为例：如果想按动词对文档分组，只需遵循清单\
    \ 5-28 所示的代码即可。\n\n**清单 5-28.** 点击流 HTTP 动词上的词条聚合\n\n```\ncurl -XGET \"http://192.168.59.103:9200/clickstream-2015.07.27/_search\"\
    \ -d'\n{\n  \"size\": 0,\n  \"aggs\": {\n    \"by_verb\": {\n      \"terms\":\
    \ {\n        \"field\": \"verb\"\n      }\n    }\n  }\n}'\n```\n\n随后会返回清单 5-29\
    \ 所示的代码。\n\n**清单 5-29.** 词条聚合结果\n\n```\n{\n  \"took\": 11,\n  \"timed_out\": false,\n\
    \  \"_shards\": {\n    \"total\": 1,\n    \"successful\": 1,\n    \"failed\":\
    \ 0\n  },\n  \"hits\": {\n    \"total\": 29280,\n    \"max_score\": 0,\n    \"\
    hits\": []\n  },\n  \"aggregations\": {\n    \"by_verb\": {\n      \"doc_count_error_upper_bound\"\
    : 0,\n      \"sum_other_doc_count\": 0,\n      \"buckets\": [\n        {\n   \
    \       \"key\": \"get\",\n          \"doc_count\": 24331\n        },\n      \
    \  {\n          \"key\": \"post\",\n          \"doc_count\": 4949\n        }\n\
    \      ]\n    }\n  }\n}\n```\n\n如您所见，我在几毫秒内就完成了聚合，近乎实时（`11` 毫秒），并得到了`get`和`post`\
    \ HTTP 动词的分布情况。但如果我们想要获得与 Spark 中类似的结果——即 HTTP 动词基于时间的分布呢？那么可以使用日期直方图聚合，并在其中嵌套一个词条聚合，如清单\
    \ 5-30 所示。\n\n**清单 5-30.** 带有嵌套词条聚合的日期直方图\n\n```\ncurl -XGET \"http://192.168.59.103:9200/clickstream-2015.07.27/_search\"\
    \ -d'\n{\n  \"size\": 0,\n  \"aggs\": {\n    \"over_time\": {\n      \"date_histogram\"\
    : {\n        \"field\": \"@timestamp\",\n        \"interval\": \"minute\"\n  \
    \    },\n      \"aggs\": {\n        \"by_verb\": {\n          \"terms\": {\n \
    \           \"field\": \"verb\"\n          }\n        }\n      }\n    }\n  }\n\
    }'\n```\n\n日期直方图聚合确实非常易用；它指定了：\n- 保存时间戳的字段（`@timestamp`），直方图将使用该字段\n- 分桶的间隔。这里我使用了`minute`，因为在我写这本书时，笔记本电脑上索引了超过\
    \ 100 万个文档。这显然需要时间，因此我确信文档分布在几分钟内。我本可以使用`day`、`month`或`year`，或者指定一个日期表达式`2h`来表示“每\
    \ 2 小时”。\n\n您可以在我的查询中看到嵌套的词条聚合；让我们将间隔改为`20m`，以获得更紧凑的结果，如清单 5-31 所示。\n\n**清单 5-31.**\
    \ 日期直方图和嵌套词条聚合结果\n\n```\n{\n  \"took\": 73,\n  \"timed_out\": false,\n  \"_shards\"\
    : {\n    \"total\": 1,\n    \"successful\": 1,\n    \"failed\": 0\n  },\n  \"\
    hits\": {\n    \"total\": 228387,\n    \"max_score\": 0,\n    \"hits\": []\n \
    \ },\n  \"aggregations\": {\n    \"over_time\": {\n      \"buckets\": [\n    \
    \    {\n          \"key_as_string\": \"2015-07-27T11:20:00.000Z\",\n         \
    \ \"key\": 1437996000000,\n          \"doc_count\": 105442,\n          \"by_verb\"\
    : {\n            \"doc_count_error_upper_bound\": 0,\n            \"sum_other_doc_count\"\
    : 0,\n            \"buckets\": [\n              {\n                \"key\": \"\
    get\",\n                \"doc_count\": 87593\n              },\n             \
    \ {\n                \"key\": \"post\",\n                \"doc_count\": 17849\n\
    \              }\n            ]\n          }\n        },\n        {\n        \
    \  \"key_as_string\": \"2015-07-27T11:40:00.000Z\",\n          \"key\": 1437997200000,\n\
    \          \"doc_count\": 122945,\n          \"by_verb\": {\n            \"doc_count_error_upper_bound\"\
    : 0,\n            \"sum_other_doc_count\": 0,\n            \"buckets\": [\n  \
    \            {\n                \"key\": \"get\",\n                \"doc_count\"\
    : 102454\n              },\n              {\n                \"key\": \"post\"\
    ,\n                \"doc_count\": 20491\n              }\n            ]\n    \
    \      }\n        }\n      ]\n    }\n  }\n}\n```\n\n如您所见，我们得到了两个 20 分钟数据桶以及嵌套的\
    \ HTTP 动词分布。当您希望将这些数据绘制成时间线或柱状图，以时间维度呈现数据，并能精细控制分析数据的时间段时，这类聚合是非常理想的。\n\n现在，让我们看看如果使用指标聚合会怎样。\n"
- fmt: "# Metric Aggregation\n\nMetric aggregations are the last level of set of aggregation\
    \ and are used to compute metrics over set of documents. Some of the computations\
    \ are considered as single value metric aggregation because they basically compute\
    \ a specific operation across document such as average, min, max or sum, some\
    \ are multi-value aggregation because they give more than one statistic metrics\
    \ for a specific field across documents such as the `stats` aggregation.\n\nAs\
    \ an example of multivalue aggregation metric, let's make a `stats` aggregation\
    \ on the `bytes` field to get more visibility on the throughput of our website\
    \ page, with Listing [5-32](#A978-1-4842-1326-1_5_Chapter.html#FPar34).\n\n**Listing\
    \ 5-32.** Stats aggregation on the `bytes` field\n\n```\nGET clickstream-2015.07.27/_search\n\
    {\n  \"size\": 0,\n  \"aggs\": {\n    \"by_stats\": {\n      \"stats\": {\n  \
    \      \"field\": \"bytes\"\n      }\n    }\n  }\n}\n```\n\nThe `stats` aggregation\
    \ only takes a numeric field as input—here, `bytes`—and returns Listing [5-33](#A978-1-4842-1326-1_5_Chapter.html#FPar35).\n\
    \n**Listing 5-33.** Stats aggregation query output\n\n```\n{\n  \"took\": 1,\n\
    \  \"timed_out\": false,\n  \"_shards\": {\n    \"total\": 1,\n    \"successful\"\
    : 1,\n    \"failed\": 0\n  },\n  \"hits\": {\n    \"total\": 2843774,\n    \"\
    max_score\": 0,\n    \"hits\": []\n  },\n  \"aggregations\": {\n    \"by_stats\"\
    : {\n      \"count\": 2843774,\n      \"min\": 2086,\n      \"max\": 4884,\n \
    \     \"avg\": 3556.769230769231,\n      \"sum\": 3932112564\n    }\n  }\n}\n\
    ```\n\nThe results give the computation of different metrics for the `bytes` field:\n\
    \n- The `count` represents the number of documents the query has been on, here\
    \ more than 2.5 million\n- The `min` & `max` are respectively the minimum and\
    \ maximum of `bytes`\n- The `avg` is the average `bytes` value for all documents\n\
    - The `sum` is the sum of all `bytes` field across documents\n\nThis is how you\
    \ can with a small query extract statistic from your document, but let's try to\
    \ go further and combine our bucket and metric aggregation. What we will try to\
    \ do is to add another level of aggregation and check what is the throughput on\
    \ each of HTTP verb type, shown in Listing [5-34](#A978-1-4842-1326-1_5_Chapter.html#FPar36).\n\
    \n**Listing 5-34.** Three-level aggregation\n\n```\nGET clickstream-2015.07.27/_search\n\
    {\n  \"size\": 0,\n  \"aggs\": {\n    \"over_time\": {\n      \"date_histogram\"\
    : {\n        \"field\": \"@timestamp\",\n        \"interval\": \"20m\"\n     \
    \ },\n      \"aggs\": {\n        \"by_verb\": {\n          \"terms\": {\n    \
    \        \"field\": \"verb\"\n          },\n          \"aggs\": {\n          \
    \  \"by_bytes\": {\n              \"stats\": {\n                \"field\": \"\
    bytes\"\n              }\n            }\n          }\n        }\n      }\n   \
    \ }\n  }\n}\n```\n\nWe will get the bytes statistics for each HTTP verb every\
    \ 20 minutes, as shown in Listing [5-35](#A978-1-4842-1326-1_5_Chapter.html#FPar37).\n\
    \n**Listing 5-35.** Three aggregation level results\n\n```\n{\n  \"took\": 2,\n\
    \  \"timed_out\": false,\n  \"_shards\": {\n    \"total\": 1,\n    \"successful\"\
    : 1,\n    \"failed\": 0\n  },\n  \"hits\": {\n    \"total\": 39,\n    \"max_score\"\
    : 0,\n    \"hits\": []\n  },\n  \"aggregations\": {\n    \"over_time\": {\n  \
    \    \"buckets\": [\n        {\n          \"key_as_string\": \"2015-07-27T14:00:00.000Z\"\
    ,\n          \"key\": 1438005600000,\n          \"doc_count\": 19,\n         \
    \ \"by_verb\": {\n            \"doc_count_error_upper_bound\": 0,\n          \
    \  \"sum_other_doc_count\": 0,\n            \"buckets\": [\n              {\n\
    \                \"key\": \"get\",\n                \"doc_count\": 14,\n     \
    \           \"by_bytes\": {\n                  \"count\": 14,\n              \
    \    \"min\": 2086,\n                  \"max\": 4728,\n                  \"avg\"\
    : 3232.4285714285716,\n                  \"sum\": 45254\n                }\n \
    \             },\n              {\n                \"key\": \"post\",\n      \
    \          \"doc_count\": 5,\n                \"by_bytes\": {\n              \
    \    \"count\": 5,\n                  \"min\": 2550,\n                  \"max\"\
    : 4741,\n                  \"avg\": 3382.2,\n                  \"sum\": 16911\n\
    \                }\n              }\n            ]\n          }\n        },\n\
    \        {\n          \"key_as_string\": \"2015-07-27T14:20:00.000Z\",\n     \
    \     \"key\": 1438006800000,\n          \"doc_count\": 20,\n          \"by_verb\"\
    : {\n            \"doc_count_error_upper_bound\": 0,\n            \"sum_other_doc_count\"\
    : 0,\n            \"buckets\": [\n              {\n                \"key\": \"\
    get\",\n                \"doc_count\": 16,\n                \"by_bytes\": {\n\
    \                  \"count\": 16,\n                  \"min\": 2487,\n        \
    \          \"max\": 4884,\n                  \"avg\": 3804.25,\n             \
    \     \"sum\": 60868\n                }\n              },\n              {\n \
    \               \"key\": \"post\",\n                \"doc_count\": 4,\n      \
    \          \"by_bytes\": {\n                  \"count\": 4,\n                \
    \  \"min\": 3182,\n                  \"max\": 4616,\n                  \"avg\"\
    : 3920.25,\n                  \"sum\": 15681\n                }\n            \
    \  }\n            ]\n          }\n        }\n      ]\n    }\n  }\n}\n```\n\nThe\
    \ point here is not to redo what Spark does, for this type of operation Elasticsearch\
    \ is handier; the goal is to use those features to leverage what Spark can do.\n\
    \n# Visualize Data in Kibana\n\nAs an example of a resulting report, we will create\
    \ a Kibana 4 dashboard that shows how Elasticsearch aggregation API is used.\n\
    \nThe Kibana UI is accessible on your local installation via the following URL:\n\
    \n`http://localhost:5601`\n\nIn Kibana discovery tab, we can see that we are receiving\
    \ data, as shown in Figure [5-4](#A978-1-4842-1326-1_5_Chapter.html#Fig4).\n\n\
    ![A978-1-4842-1326-1_5_Fig4_HTML.jpg](A978-1-4842-1326-1_5_Fig4_HTML.jpg)\n\n\
    **Figure 5-4.** Discovering clickstream data\n\nLet's try to make a bar chart\
    \ visualization that shows the distribution of HTTP response code over time. This\
    \ can lead to anomaly detection such as intrusion attempt on our website and so\
    \ on.\n\nThe visualization tab lets you create by configuration this kind of charts,\
    \ as shown in Figure [5-5](#A978-1-4842-1326-1_5_Chapter.html#Fig5).\n\n![A978-1-4842-1326-1_5_Fig5_HTML.jpg](A978-1-4842-1326-1_5_Fig5_HTML.jpg)\n\
    \n**Figure 5-5.** Creating aggregation in Kibana\n\nWhat we expect is for Kibana\
    \ to draw a report that shows the number of 200, 404, and so on over time, as\
    \ shown in Figure [5-6](#A978-1-4842-1326-1_5_Chapter.html#Fig6).\n\n![A978-1-4842-1326-1_5_Fig6_HTML.jpg](A978-1-4842-1326-1_5_Fig6_HTML.jpg)\n\
    \n**Figure 5-6.** HTTP response code over time\n\nVisualizing our data brings\
    \ us to another dimension and easily shows the power of the aggregation framework.\
    \ Kibana doesn't compute anything on its side; it just renders the data that are\
    \ returned from Elasticsearch. Listing [5-36](#A978-1-4842-1326-1_5_Chapter.html#FPar38)\
    \ shows what Kibana is asking under the hood.\n\n**Listing 5-36.** Kibana request\
    \ to Elasticsearch\n\n```\n\"aggs\": {\n    \"2\": {\n      \"date_histogram\"\
    : {\n        \"field\": \"@timestamp\",\n        \"interval\": \"1s\",\n     \
    \   \"pre_zone\": \"+01:00\",\n        \"pre_zone_adjust_large_interval\": true,\n\
    \        \"min_doc_count\": 1,\n        \"extended_bounds\": {\n          \"min\"\
    : 1438022198610,\n          \"max\": 1438022314896\n        }\n      },\n    \
    \  \"aggs\": {\n        \"3\": {\n          \"terms\": {\n            \"field\"\
    : \"response\",\n            \"size\": 5,\n            \"order\": {\n        \
    \      \"_count\": \"desc\"\n            }\n          }\n        }\n      }\n\
    \    }\n}\n```\n\nKibana is relying on Elasticsearch scaling ability and those\
    \ kinds of visualizations can be done on small to very large sets of data. In\
    \ the end, what you want to get is a complete view of your data, such as the Kibana\
    \ dashboard shown in Figure [5-7](#A978-1-4842-1326-1_5_Chapter.html#Fig7).\n\n\
    ![A978-1-4842-1326-1_5_Fig7_HTML.jpg](A978-1-4842-1326-1_5_Fig7_HTML.jpg)\n\n\
    **Figure 5-7.** Kibana dashboard\n\n## Summary\n\nIn the next chapter, we'll add\
    \ more complexity to our processing and bring more prediction to it. In addition,\
    \ we'll continue to illustrate the results of processing with Kibana dashboard.\n\
    \n# 6. Learning From Your Data?\n\nOne of the powerful features of Spark is its\
    \ machine learning capabilities. Using the Spark `Mllib` it's very easy to enrich\
    \ existing data processing pipelines with learning algorithms. This chapter is\
    \ an introduction to the main concepts behind machine learning and an introduction\
    \ to augmenting our architecture with machine learning features."
  raw: '#### Metric Aggregation


    Metric aggregations are the last level of set of aggregation and are use to compute
    metrics over set of documents. Some of the computations are considered as single
    value metric aggregation because they basically compute a specific operation across
    document such as average, min, max or sum, some are multi-value aggregation because
    they give more than one statistic metrics for a specific field across documents
    such as the stats aggregation.


    As an example of multivalue aggregation metric, let’s make a stats aggregation
    on the bytes field to get more visibility on the throughput of our website page,
    with Listing [5-32](#A978-1-4842-1326-1_5_Chapter.html#FPar34).


    Listing 5-32.Stats aggregation on the bytes field


    `GET clickstream-2015.07.27/_search`


