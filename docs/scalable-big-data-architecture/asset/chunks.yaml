  raw: '## Splitting the Architecture


    Using Hadoop brings a lot of solutions when it comes to handling a large amount
    of data, but it also brings challenges when allocating resources and managing
    the stored data; you always want to reduce the cost while keeping minimum latency
    to provide data to end users.


    Like in any other architecture, data architecture should answer to the needs driven
    by the SLAs. Thus, every job should not consume every resource equally and should
    be either managed via a prioritization system or isolated from each other in terms
    of architecture, hardware, network, and so on.


    In this section, I’ll talk about how modern data architecture is split to address
    the different levels of time needed because of SLAs. To illustrate, I’ll discuss
    the repartition illustrated in Figure [3-2](#A978-1-4842-1326-1_3_Chapter.html#Fig2).


    ![A978-1-4842-1326-1_3_Fig2_HTML.jpg](A978-1-4842-1326-1_3_Fig2_HTML.jpg)


    Figure 3-2.


    Modern data architecture


    As you can see, the architecture is divided into the following:


    *   A long-term processing part

    *   A short-term processing part

    *   A view merging part


    I’ll go through each of these parts and explain what role is being affected.


    ### Batch Processing


    The long-term processing jobs, or batch processing, are jobs that were implemented
    starting with the first generation of Hadoop architecture, such as MapReduce,
    Hive, Pig, and so on. Those jobs tend to deal with massive amounts of data and
    come up with digested data or, more standardly, aggregates of data. Data is distributed
    using HDFS file system capabilities and schedules and is governed by different
    tools depending on the distribution you use.


    Generally, the objective of these jobs is to keep compute aggregates of data and
    make them available for analytics. As said, batch processing was a first-class
    citizen of processing at the beginning of Big Data trends because it was a natural
    way to process the data: you extract or collect the data and then schedule jobs.
    The processing jobs can spend a lot of time before finishing the aggregate computations.


    These jobs were also mainly answering to a processing need from legacy systems
    that were not able to deal with the data stream. Batch processing became really
    easy to manage and monitor because it ran in one shot, compared to a streaming
    system where monitoring should be continuous. Now with YARN, it’s also easy to
    manage the resources allocated to a batch application. This way, the IT organization
    can also split the batch architecture depending on each batch SLA, which is covered
    in the next section.


    #### Prioritizing the Processing


    When dealing with batch processing, IT organizations want to have total control
    on the operations around processing, such as scheduling or even prioritizing some
    jobs. Like in most IT systems, a data platform starts on a pilot use case that
    might attract other parts of other organizations that add more use cases to the
    platform. This simply turns the platform to a multitenant data platform with many
    SLAs that are dependent on use cases.


    In Hadoop 2.0 and Yarn-based architecture, the features provided for multitenancy
    allow users to access the same data platform and run processing with different
    cluster capacities. YARN also allows you to run non-MapReduce applications, so
    with the ResourceManager and the YARN Capacity Scheduler, prioritizing jobs can
    be done across application types.


    The distribution of the Hadoop workload is done at the Capacity Scheduler level.
    The configuration lets you finely arrange a predictable cluster resource share
    and gives you the ability for a secured and significant cluster utilization. This
    works by setting the utilization percentage on job queues. Figure [3-3](#A978-1-4842-1326-1_3_Chapter.html#Fig3)
    illustrates this concept.


    ![A978-1-4842-1326-1_3_Fig3_HTML.jpg](A978-1-4842-1326-1_3_Fig3_HTML.jpg)


    Figure 3-3.


    YARN job queue


    The example illustrates different priorities for the three queues: high, low,
    and default. This can be translated in the simple YARN capacity scheduler configuration
    shown in Listing [3-6](#A978-1-4842-1326-1_3_Chapter.html#FPar6).


    Listing 3-6.YARN Capacity Scheduler Configuration


    `<property>`


      `<name>yarn.scheduler.capacity.root.queues</name>`


      `<value>default,highPriority,lowPriority</value>`


    `</property>`


    `<property>`


      `<name>yarn.scheduler.capacity.root.highPriority.capacity</name>`


      `<value>60</value>`


    `</property>`


    `<property>`


      `<name>yarn.scheduler.capacity.root.lowPriority.capacity</name>`


      `<value>20</value>`


    `</property>`


    `<property>`


      `<name>yarn.scheduler.capacity.root.default.capacity</name>`


      `<value>10</value>`


    `</property>`


    Each queue has been affected a minimum cluster capacity, which by the way is elastic.
    This means if idle resources are available, then one queue can take up more than
    the minimum initially affected. Still, the maximum capacity can be affected, as
    shown in Listing [3-7](#A978-1-4842-1326-1_3_Chapter.html#FPar7).


    Listing 3-7.Maximum Queue Capacity


    `<property>`


      `<name>yarn.scheduler.capacity.root.lowPriority.maximum-capacity</name>`


      `<value>50</value>`


    `</property>`


    This configuration sets the capacity, so anyone who submits a job (for example,
    a MapReduce job), can submit it to a specific queue depending on the expected
    requirements, as shown in Listing [3-8](#A978-1-4842-1326-1_3_Chapter.html#FPar8).


    Listing 3-8.Submitting a MapReduce Job


    `Configuration priorityConf = new Configuration();`


    `priorityConf.set("mapreduce.job.queuename", queueName);`


    With YARN Capacity Scheduler, batch processing becomes even more efficient in
    terms of resource management and has a lot of applications in the industry, such
    as allocating more resources for the recommendation engine than for less critical
    needs such as data processing for notifications. But talking about recommendations,
    most IT systems now are using shorter-term processing jobs for recommendations
    and relying on streaming architectures, which I will describe in the following
    section.'
  trans: "\n## 架构拆分\n\n在处理大量数据时，使用 Hadoop 能带来许多解决方案，但在分配资源和管理存储数据方面也带来了挑战；你始终希望在保持最低延迟以向最终用户提供数据的同时降低成本。\n\
    \n与任何其他架构一样，数据架构应满足 SLA 驱动的需求。因此，并非每个作业都应平等消耗所有资源，而应通过优先级系统进行管理，或在架构、硬件、网络等方面相互隔离。\n\
    \n在本节中，我将讨论现代数据架构如何拆分，以应对因 SLA 而产生的不同时间需求。为了说明这一点，我将讨论图 3-2 中展示的分区。\n\n![A978-1-4842-1326-1_3_Fig2_HTML.jpg](img/A978-1-4842-1326-1_3_Fig2_HTML.jpg)\n\
    \n如图所示，架构分为以下几个部分：\n\n-   长期处理部分\n-   短期处理部分\n-   视图合并部分\n\n我将逐一介绍这些部分，并解释每个部分所承担的角色。\n\
    \n### 批处理\n\n长期处理作业（或称批处理）是从第一代 Hadoop 架构开始实施的作业，例如 `MapReduce`、`Hive`、`Pig` 等。这些作业通常处理海量数据，并生成摘要数据，或更标准地说，生成数据聚合。数据利用\
    \ `HDFS` 文件系统的能力和调度进行分发，并由不同的工具进行管理，具体取决于你所使用的发行版。\n\n通常，这些作业的目标是保持计算数据的聚合，并使其可用于分析。如前所述，批处理在大数据潮流初期是首要的处理方式，因为它是一种自然的数据处理方式：你提取或收集数据，然后调度作业。处理作业可能会花费大量时间才能完成聚合计算。\n\
    \n这些作业也主要满足了那些无法处理数据流的传统系统的处理需求。与需要持续监控的流式系统相比，批处理一次性运行，因此变得非常易于管理和监控。现在有了 `YARN`，管理分配给批处理应用的资源也变得容易。这样，IT\
    \ 组织也可以根据每个批处理的 SLA 来拆分批处理架构，这将在下一节中讨论。\n\n#### 处理优先级\n\n在处理批处理时，IT 组织希望完全控制与处理相关的操作，例如调度甚至对某些作业进行优先级排序。与大多数\
    \ IT 系统一样，数据平台始于一个试点用例，这可能会吸引其他组织的其他部分为平台添加更多用例。这简单地将平台转变为一个多租户数据平台，其中包含许多依赖于用例的\
    \ SLA。\n\n在 Hadoop 2.0 和基于 Yarn 的架构中，为多租户提供的特性允许用户访问同一数据平台，并使用不同的集群容量运行处理。`YARN`\
    \ 还允许你运行非 MapReduce 应用，因此通过 `ResourceManager` 和 YARN 容量调度器，可以在应用类型之间进行作业优先级排序。\n\
    \nHadoop 工作负载的分配是在容量调度器层面完成的。通过配置，你可以精细地安排可预测的集群资源份额，并能够实现安全且显著的集群利用率。这是通过设置作业队列的利用率百分比来实现的。图\
    \ 3-3 展示了这一概念。\n\n![A978-1-4842-1326-1_3_Fig3_HTML.jpg](img/A978-1-4842-1326-1_3_Fig3_HTML.jpg)\n\
    \n该示例展示了三个队列的不同优先级：高、低和默认。这可以在清单 3-6 所示的简单 YARN 容量调度器配置中体现。\n\n```\n<property>\n\
    \  <name>yarn.scheduler.capacity.root.queues</name>\n  <value>default,highPriority,lowPriority</value>\n\
    </property>\n\n<property>\n  <name>yarn.scheduler.capacity.root.highPriority.capacity</name>\n\
    \  <value>60</value>\n</property>\n\n<property>\n  <name>yarn.scheduler.capacity.root.lowPriority.capacity</name>\n\
    \  <value>20</value>\n</property>\n\n<property>\n  <name>yarn.scheduler.capacity.root.default.capacity</name>\n\
    \  <value>10</value>\n</property>\n```\n\n每个队列都被分配了一个最小集群容量，这个容量实际上是弹性的。这意味着如果有空闲资源可用，一个队列可以占用超过最初分配的最小容量。不过，最大容量也可以被分配，如清单\
    \ 3-7 所示。\n\n```\n<property>\n  <name>yarn.scheduler.capacity.root.lowPriority.maximum-capacity</name>\n\
    \  <value>50</value>\n</property>\n```\n\n此配置设置了容量，因此任何提交作业的人（例如，一个 `MapReduce`\
    \ 作业）都可以根据预期要求将其提交到特定队列，如清单 3-8 所示。\n\n```\nConfiguration priorityConf = new Configuration();\n\
    priorityConf.set(\"mapreduce.job.queuename\", queueName);\n```\n\n借助 YARN 容量调度器，批处理在资源管理方面变得更加高效，并且在行业中有许多应用，例如为推荐引擎分配比不那么关键的需求（如用于通知的数据处理）更多的资源。但谈到推荐，现在大多数\
    \ IT 系统都使用短期处理作业来进行推荐，并依赖于流式架构，我将在下一节中对此进行描述。\n"
- fmt: '### Stream Processing


    Short-term processing, or stream processing, intends to ingest high-throughput
    data. The solutions designed for streaming can handle a high volume of data and
    are highly distributed, scalable, and fault-tolerant technologies.


    This kind of architecture has to resolve a bunch of challenges. As said, the main
    one is to process massive amounts of data. There were existing streaming technologies
    before, but this one should be highly available, resilient, and performant. They
    are performant because data volume, complexity, and size increase.


    If data volume increases, that’s because these architectures have to be able to
    integrate with a multitude of data sources and applications seamlessly, such as
    data warehouses, files, data history, social networks, application logs, and so
    on. They need to offer a consistent agile API and client-oriented API and also
    be able to output information on various channels such as notification engines,
    search engines, and third-party applications. Basically such technologies have
    much more constraints in terms of real-time responsiveness to market changes.


    Finally, the capacity of delivering real-time analytics is the first expectation
    end users have from a streaming architecture. The needs are pretty clear and consist
    of the following: discovering data in real time, being able to query data as easily
    as possible, and proactive monitoring through alerting to notify users and applications
    whenever an event reaches a threshold.


    Streaming architecture was first used in the financial sector with a high-throughput
    trading use case, but it has expanded to a various number of use cases, mainly
    e-commerce, telecommunications, fraud detection, and analytics. This has caused
    the rise of two main technologies: `Apache Spark` and `Apache Storm`.


    `Spark` is the technology I’ve chosen to rely on in this book. I’ve had the chance
    to work with it a couple of times, and I think it’s the one that has the most
    traction, value, and support from the community. Figure [3-4](#A978-1-4842-1326-1_3_Chapter.html#Fig4)
    supports this.


    ![A978-1-4842-1326-1_3_Fig4_HTML.jpg](A978-1-4842-1326-1_3_Fig4_HTML.jpg)


    Figure 3-4.


    Google trends of `Apache Spark` and `Apache Storm`


    Rather than going into more detail in this section, I’m dedicating two chapters
    to the streaming and serving architecture: Chapters X and X. I’ll describe how
    to combine different technologies including `Spark` to handle live streams and
    search analytics.


    ## The Concept of a Lambda Architecture


    The previous sections described the need for splitting a data architecture into
    three parts: batching, streaming, and serving the architecture. While batch processing
    is still a common practice in most existing IT organizations’ data architecture,
    it doesn’t justify a real need when you can for most of the use case first stream
    the data and, if it’s needed, store the data in the batch-oriented file system.


    Deploying a streaming architecture is a lot easier to say than to do when the
    IT organization’s existing practices are batch oriented. Compared to it, a streaming
    architecture brings much more complexity in terms of operations because operators
    always have to be on and architects have to size and design a solution that can
    absorb unexpected bursts of data while maintaining a decent response time.


    Still, starting an approach by streaming is a lot of easier at the end of the
    day when you realize the burden of deploying a `Hadoop` distribution “just” to
    do what a streaming architecture can do with the same processing API and sometimes
    more. Even if your SLAs are not severe and you don’t expect to get the data in
    seconds or minutes, you are reducing the amount of energy you put in to reach
    them.


    From my point of view, a streaming architecture is a natural evolution of the
    modern data architecture. It reduces the software complexity, like the reduction
    of hardware that happened when the first generation of Big Data arose. My architecture
    choices here might not be generic and are really tight with what I’m working on
    every day, but when I browse the various use cases I’ve worked on, I realize that
    my technology stack answers to 90 percent of the use cases.


    The lambda architecture takes the best of breed of both worlds. Data is transient
    and processed in real time in a speed layer, re-computed and used to create partial
    aggregates in the batch layer, and finally merged and served in the serving layer.
    To implement this paradigm, I’ve chosen to rely on the following product topology:


    *   `Logstash-forwarder` to ingest the data

    *   `Apache Kafka` to distribute the data

    *   `Logtash agent` to process logs

    *   `Apache Spark` for stream processing

    *   `Elasticsearch` as the serving layer


    Figure [3-5](#A978-1-4842-1326-1_3_Chapter.html#Fig5) illustrates this topology.


    ![A978-1-4842-1326-1_3_Fig5_HTML.jpg](A978-1-4842-1326-1_3_Fig5_HTML.jpg)


    Figure 3-5.


    Lambda architecture speed and serving layer


    A lambda architecture is often used for e-commerce web sites for different purposes
    such as recommendations or security analytics. In the case of clickstream data,
    you can extract multiple insights.


    *   On one hand, using the long-processing layer, the clickstream can be processed,
    aggregated, and correlated to other data sources to build an accurate source for
    the recommendation engine that will consume them. In this example, clickstream
    data can be correlated with other data lakes containing precise demographic information
    to build views that can be then indexed into `Elasticsearch`.

    *   On the other hand, the same data can be used for bot detection. Indeed, most
    e-commerce web sites experience security threats, so one way to prevent that is
    to analyze the click behavior through the stream layer and blacklist in real time
    bot IP addresses. In Figure [3-5](#A978-1-4842-1326-1_3_Chapter.html#Fig5), you
    can use `Spark` to make complex correlation or run machine-learning processes
    to extract data before indexing in `Elasticsearch`.


    I won’t go into the details of the batch layer in the next chapter as this is
    a well-known subject that most Big Data books are covering today. The serving
    layer is most commonly handled by `Hive`, but why should you use `Hive` while
    `Elasticsearch` is able to create analytics in near real time? Now, with new connectors
    such as the `ES-Hadoop` connector ( [`https://www.elastic.co/products/hadoop`](https://www.elastic.co/products/hadoop)
    ) `)`, you can delegate in most use cases the data access, querying, and aggregation
    to real-time search technologies such as `Elasticsearch`, which provides even
    more capabilities.


    ## Summary


    At this point, you should have a better understanding about the value of the lambda
    architecture when it comes time to deal with a multitude of data sources types
    and, at the same time, about meeting the SLAs expected when it comes time to deliver
    services to end users and applications.


    In the next chapter, I’ll focus on building the stream part of the lambda architecture
    and will use the clickstream data to base your discussion.


    # 4. Streaming Data


    In the previous chapter, we focused on a long-term processing job, which runs
    in a `Hadoop` cluster and leverages `YARN` or `Hive`. In this chapter, I would
    like to introduce you to what I call the 2014 way of processing the data: streaming
    data. Indeed, more and more data processing infrastructures are relying on streaming
    or logging architecture that ingest the data, make some transformation, and then
    transport the data to a data persistency layer.


    This chapter will focus on three key technologies: `Kafka`, `Spark`, and the `ELK`
    stack from `Elastic`. We will work on combining them to implement different kind
    of logging architecture that can be used depending on the needs.


    ## Streaming Architecture


    In this section, we’ll see how the streaming part of the architecture is structured
    and also what technology we can use for data ingestion.'
