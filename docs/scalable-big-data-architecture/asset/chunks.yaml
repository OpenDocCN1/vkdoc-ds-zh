  raw: '### Composing the Architecture


    Composing the architecture has a double meaning here; it first means that you
    would like to combine Docker containers to build the architecture, but it also
    means you need a high-level tool that will help you to govern each container configuration
    and runtime preferences.


    Fortunately, Docker Compose is the perfect tool for this duty. Compose is based
    on a single-file configuration that will allow users to create multicontainer
    applications in a declarative way. While Compose is not recommended for production,
    it’s essential in development, staging, or continuous integration (CI).


    In this section, I’ll walk you through the Docker Compose file located at the
    following GitHub project:


    [`https://github.com/bahaaldine/scalable-big-data-architecture/tree/master/chapter7/docker`](https://github.com/bahaaldine/scalable-big-data-architecture/tree/master/chapter7/docker)


    Like with the images, you’ll focus on one container configuration, and you’ll
    see that the configuration is pretty much the same for the others. The compose
    file is spinning up an architecture that counts the following:


    *   A two-node Kafka cluster with a one-node Zookeeper cluster

    *   A one-node Elasticsearch cluster

    *   A single instance of Kibana

    *   One Logstash forwarder

    *   One Logstash processor

    *   One Logstash indexer


    Listing [7-3](#A978-1-4842-1326-1_7_Chapter.html#FPar3) shows the result of the
    composition.


    Listing 7-3.Docker Compose Lambda Architecture File


    `zookeeper1:`


      `image: bahaaldine/docker-zookeeper`


      `volumes:`


        `- "conf/kafka/server1:/etc/kafka"`


        `- "logs/zookeeper1:/opt/kafka/logs/"`


      `ports:`


        `- "2181:2181"`


      `extra_hosts:`


        `- "brokers:192.168.59.103"`


    `kafka1:`


      `image: bahaaldine/docker-kafka`


      `volumes:`


        `- "conf/kafka/server1:/etc/kafka"`


        `- "logs/kafka1:/opt/kafka/logs/"`


      `extra_hosts:`


        `- "brokers:192.168.59.103"`


      `ports:`


        `- "9092:9092"`


    `kafka2:`


      `image: bahaaldine/docker-kafka`


      `volumes:`


        `- "conf/kafka/server2:/etc/kafka"`


        `- "logs/kafka2:/opt/kafka/logs/"`


      `extra_hosts:`


        `- "brokers:192.168.59.103"`


      `links:`


        `- "kafka1"`


      `ports:`


        `- "9093:9093"`


    `logstashProcessor1:`


      `image:` `bahaaldine/docker-logstash-agent`


      `volumes:`


        `- "conf/logstash/processor:/etc/logstash"`


        `- "conf/security:/etc/logstash/security"`


        `- "logs/logstash-processor1:/var/log/logstash"`


      `links:`


        `- kafka1`


      `ports:`


        `- "5043:5043"`


    `elasticsearch1:`


      `image: bahaaldine/docker-elasticsearch`


      `ports:`


        `- "9200:9200"`


      `volumes:`


        `- "logs/elasticsearch1:/var/log/elasticsearch"`


        `- "conf/elasticsearch/templates:/etc/elasticsearch/templates"`


        `- "data:/data"`


      `extra_hosts:`


        `- "elasticsearch:192.168.59.103"`


    `logstashIndexer1:`


      `image: bahaaldine/docker-logstash-agent`


      `volumes:`


        `- "conf/logstash/indexer:/etc/logstash"`


        `- "logs/logstash-indexer1:/var/log/logstash"`


      `links:`


        `- elasticsearch1`


      `extra_hosts:`


        `- "brokers:192.168.59.103"`


        `- "elasticsearch:192.168.59.103"`


    `logstashForwarder:`


      `image: bahaaldine/docker-logstash-forwarder`


      `volumes:`


        `- "conf/logstash/forwarder:/etc/logstash-forwarder"`


        `- "conf/security:/etc/logstash-forwarder/security"`


        `- "logs/logstash-forwarder1:/tmp/logs/"`


        `- "source:/tmp/source"`


      `extra_hosts:`


        `- "processors:192.168.59.103"`


    `kibana1:`


      `image: bahaaldine/docker-kibana`


      `ports:`


        `- "5601:5601"`


      `volumes:`


        `- "logs/kibana:/var/log/kibana"`


      `extra_hosts:`


        `- "elasticsearch:192.168.59.103"`


    If you now focus on the Elasticsearch container configuration, you might recognize
    some of the parameters you passed at the command line earlier when you tried to
    run your container.


    `docker run -ti -p 9200:9200 -p 9300:9300 --add-host="elasticsearch:192.168.59.103"
    bahaaldine/docker-elasticsearch`


    What you can do with the Docker `run` command can be described in the Compose
    YML file.


    You first set the container image. `image: bahaaldine/docker-elasticsearch`  
    Then you map the host port to the container port. `ports:`     `- "9200:9200"`
      Next you map the host file system with container directories for the logs, configuration,
    and data stored in Elasticsearch. This is important because when a container is
    shut down, all data stored inside the container is lost. So, you are mapping those
    folders to make sure they will live beyond the container life cycle.   `volumes:`
        `- "logs/elasticsearch1:/var/log/elasticsearch"`     `- "conf/elasticsearch/templates:/etc/elasticsearch/templates"`
        `- "data:/data"`   Last, you ask Docker to add a host to the `/etc/hosts`
    file.     `extra_hosts:`     `- "elasticsearch:192.168.59.103"`  


    That’s it. As I mentioned earlier, every other container is configured in the
    same way; you just have to run the command shown in Listing [7-4](#A978-1-4842-1326-1_7_Chapter.html#FPar4)
    to start the architecture.


    Listing 7-4.Docker Compose Project Start Command


    `docker-compose up`


    Note that here I’ve built all the images before launching the Compose project.
    This is because I’ve pushed all the images on the public Docker registry, which
    is called the Docker Hub ( [`https://hub.docker.com/`](https://hub.docker.com/))
    ). If the images were not available, you would get an error.


    The My Compose project comes with the generator script, which should be used to
    create some data in the source directory. Remember that the `Logstash-forwarder`
    is transporting files from this directory; this also appears in the Compose YMP
    file, as shown in Listing [7-5](#A978-1-4842-1326-1_7_Chapter.html#FPar5).


    Listing 7-5.CFC


    `logstashForwarder:`


      `image: bahaaldine/docker-logstash-forwarder`


      `volumes:`


        `- "conf/logstash/forwarder:/etc/logstash-forwarder"`


        `- "conf/security:/etc/logstash-forwarder/security"`


        `- "logs/logstash-forwarder1:/tmp/logs/"`


        `- "source:/tmp/source"`


    The source directory is mapped to the container’s `/tmp/source` folder.


    From a governance point of view, Docker eases the process of provisioning your
    architecture; you now need to focus on the architecture scalability and how you
    can size it in order to scale out if needed.


    ## Architecture Scalability


    In this section, I’ll talk about the different scalability zones that exist in
    the data architecture and make some recommendations.'
  trans: "\n### 构建架构\n\n`Composing the architecture`这里包含两层含义；首先，它意味着你将组合 Docker 容器来构建架构，同时也意味着你需要一个高级工具来帮助你管理每个容器的配置和运行时偏好。\n\
    \n幸运的是，`Docker Compose` 正是完成此任务的完美工具。`Compose` 基于单文件配置，允许用户以声明式的方式创建多容器应用。虽然不推荐在生产环境中使用\
    \ `Compose`，但它在开发、预发布或持续集成（CI）环境中至关重要。\n\n在本节中，我将引导你查看以下 GitHub 项目中的 `Docker Compose`\
    \ 文件：\n\n[`https://github.com/bahaaldine/scalable-big-data-architecture/tree/master/chapter7/docker`](https://github.com/bahaaldine/scalable-big-data-architecture/tree/master/chapter7/docker)\n\
    \n与镜像类似，你将重点关注一个容器的配置，并且会看到其他容器的配置基本一致。Compose 文件启动了一个包含以下组件的架构：\n\n*   一个包含单节点\
    \ `Zookeeper` 集群的`两节点` `Kafka` 集群\n*   一个`单节点` `Elasticsearch` 集群\n*   一个`单实例`的\
    \ `Kibana`\n*   一个 `Logstash` 转发器\n*   一个 `Logstash` 处理器\n*   一个 `Logstash` 索引器\n\
    \n清单 [7-3] 展示了组合后的结果。\n\n**清单 7-3.** Docker Compose Lambda 架构文件\n\n```\nzookeeper1:\n\
    \  image: bahaaldine/docker-zookeeper\n  volumes:\n    - \"conf/kafka/server1:/etc/kafka\"\
    \n    - \"logs/zookeeper1:/opt/kafka/logs/\"\n  ports:\n    - \"2181:2181\"\n\
    \  extra_hosts:\n    - \"brokers:192.168.59.103\"\n\nkafka1:\n  image: bahaaldine/docker-kafka\n\
