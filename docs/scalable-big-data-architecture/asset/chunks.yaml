- fmt: "### Monitoring the Infrastructure Using the Elastic Stack\n\nIn previous chapters,\
    \ you learned to set up a Lambda architecture that ingests an Apache log to reveal\
    \ business analytics. Each layer of the architecture is responsible for a specific\
    \ task in the overall transaction, and there may be different important KPIs per\
    \ application to consider monitoring.\n\nThe question is, why don’t you scale\
    \ the acquired knowledge to monitor your own architecture? The idea behind this\
    \ question is to enable your architecture log to be ingested for further operational\
    \ intelligence.\n\nThe only thing you need to do is organize your architecture\
    \ with the following steps:\n\nCentralize your logs. If the logs are centralized\
    \ in one place such as a SAN, an Amazon S3 bucket, or another network share folder,\
    \ that will ease the retrieval of logs information and also the deployment of\
    \ the monitoring architecture. In the Docker Compose file, the configuration is\
    \ set to centralize every log in the Docker Compose project logs folder. Listing\
    \ [7-7](#A978-1-4842-1326-1_7_Chapter.html#FPar7) shows the configuration for\
    \ Zookeeper.\n\nListing 7-7. Docker Compose Kafka Configuration\n\n```\nkafka1:\n\
    \  image: bahaaldine/docker-kafka\n  volumes:\n    - \"conf/kafka/server1:/etc/kafka\"\
    \n    - \"logs/kafka1:/opt/kafka/logs/\"\n  extra_hosts:\n    - \"brokers:192.168.59.103\"\
    \n  ports:\n    - \"9092:9092\"\n```\n\nThen you should consider reusing your\
    \ existing Elasticsearch cluster or creating another one. Obviously, the answer\
    \ to this consideration will depend on different factors, such as the density\
    \ and workload of the existing cluster, or even nontechnical factors such as financial\
    \ considerations that can occur when it comes time to acquire a new machine. If\
    \ it’s a dedicated cluster, then it’s easier; if not, the events should simply\
    \ be stored in a new index, for example behind a new “monitoring” index alias.\
    \ Sometimes different event types are indexed; you should remember that Kibana\
    \ will deal with the full index without making distinctions of different types\
    \ of documents within the index. So, naming your event properly so there are no\
    \ field collisions is also a consideration that you should keep in mind.\n\nUsing\
    \ Curator (`https://github.com/elastic/curator`) to manage your indices is essential\
    \ too! I talked about the retention period earlier, which is also relevant for\
    \ monitoring your architecture. As monitoring logs are ingested and indexed, time-based\
    \ indexes are created, and with Curator, you will be able to schedule procedures\
    \ that will close, archive, or delete indexes (for example, every index older\
    \ than six weeks).\n\nThe last point to consider is the security of the overall\
    \ architecture, as described in the next section.\n\n### Considering Security\n\
    \nSecurity is complex, specifically in distributed architecture. Ideally there\
    \ are a set of tools and best practices that reduce the pain of securing the architecture.\n\
    \n- The first tip is related to Dockerizing your architecture. Every container\
    \ is isolated from the rest of the world. You can limit the number of resources\
    \ that the container will use such as the RAM, CPU, or network usage, but you\
    \ can also limit access in terms of network connectivity.\n\nStill, sometimes\
    \ you need to expose the container to the outside world. For instance, in the\
    \ previous example, I set the configuration of the Docker Compose YML file so\
    \ that the Elasticsearch container is exposing port 9200, as shown in Listing\
    \ [7-8](#A978-1-4842-1326-1_7_Chapter.html#FPar8).\n\nListing 7-8. Docker Compose\
    \ Elasticsearch Configuration\n\n```\nelasticsearch1:\n  image: bahaaldine/docker-elasticsearch\n\
    \  ports:\n    - \"9200:9200\"\n  volumes:\n    - \"logs/elasticsearch1:/var/log/elasticsearch\"\
    \n    - \"conf/elasticsearch/templates:/etc/elasticsearch/templates\"\n    - \"\
    data:/data\"\n  extra_hosts:\n    - \"elasticsearch:192.168.59.103\"\n```\n\n\
    - This represents a security breach if the port is not secured on the host machine.\
    \ Ideally, this doesn’t require any specific security configuration and can be\
    \ handled by the usual security best practices such as IP filtering, proxies,\
    \ and so on.\n- The log transport from the forwarder to the processor is secured\
    \ through the Lumberjack protocol that uses certificates.\n- Kibana also needs\
    \ to expose its port to give users access to the dashboards. The same applies\
    \ here in terms of security best practices; you can simply deploy a proxy web\
    \ server such as an Apache web server and configure it to expose an HTTPS endpoint.\n\
    - Last is accessing the data in Elasticsearch. Even if you put a proxy in front\
    \ of Elasticsearch, one user can access the other user’s indices by default. As\
    \ of today, the only supported way to secure the data and access to Elasticsearch\
    \ is by using one of the commercial plug-ins called `Shield`.\n\n`Shield` is an\
    \ Elasticsearch plug-in that offers multiple security features for the ELK stack,\
    \ including the following:\n\n- Role-based access controls: Roles can be defined\
    \ and mapped to users or groups of users. Every privilege can be finely configured\
    \ such as cluster and indices-level privileges. In this case, you can segregate\
    \ a shared Elasticsearch cluster so every user will see only the data and assets\
    \ to which he has related privileges.\n- LDAP or Active Directory users: `Shield`\
    \ can connect to your LDAP or Active Directory so you don’t have to redefine all\
    \ your users at Elasticsearch; this affects only roles, and you can leverage your\
    \ existing authentication mechanism. Users can be actual human users or even technical\
    \ users such as a Logstash agent that indexes documents in Elasticsearch.\n- Encrypted\
    \ communications: `Shield` allows encrypted communications through SSL and TLS.\n\
    - Audit logging: Every access to the cluster is logged.\n- IP filtering: You can\
    \ restrict access to specific IP address or a range of IP addresses.\n\nSo, as\
    \ the cluster grows, offers more entry points to users, and shares resources between\
    \ different data projects, you might consider adding an enterprise plug-in such\
    \ as `Shield` to secure your architecture.\n\n## Summary\n\nThe data architecture\
    \ is by nature distributed and highly scalable. In this chapter, you learned how\
    \ you can keep bringing flexibility to the governance aspect by packaging the\
    \ architecture with Docker Compose. At this point, you should be able to extend\
    \ this architecture by, for example, adding new components and enriching the Docker\
    \ Compose project with new configurations."
  raw: '### Monitoring the Infrastructure Using the Elastic Stack


    In previous chapters, you learned to set up a Lambda architecture that ingests
    an Apache log to reveal business analytics. Each layer of the architecture is
    responsible for a specific task in the overall transaction, and there may be different
    important KPIs per application to consider monitoring.


    The question is, why don’t you scale the acquired knowledge to monitor your own
    architecture? The idea behind this question is to enable your architecture log
    to be ingested for further operational intelligence.


    The only thing you need to do is organize your architecture with the following
    steps:


    Centralize your logs. If the logs are centralized in one place such as a SAN,
    an Amazon S3 bucket, or another network share folder, that will ease the retrieval
    of logs information and also the deployment of the monitoring architecture. In
    the Docker Compose file, the configuration is set to centralize every log in the
    Docker Compose project logs folder. Listing [7-7](#A978-1-4842-1326-1_7_Chapter.html#FPar7)
    shows the configuration for Zookeeper.   Listing 7-7.Docker Compose Kafka Configuration


    `kafka1:`


      `image: bahaaldine/docker-kafka`


      `volumes:`


        `- "conf/kafka/server1:/etc/kafka"`


        `- "logs/kafka1:/opt/kafka/logs/"`


      `extra_hosts:`


        `- "brokers:192.168.59.103"`


      `ports:`


        `- "9092:9092"`


    Then you should consider reusing your existing Elasticsearch cluster or creating
    another one. Obviously, the answer to this consideration will depend on different
    factors, such as the density and workload of the existing cluster, or even nontechnical
    factors such as financial considerations that can occur when it comes time to
    acquire a new machine. If it’s a dedicated cluster, then it’s easier; if not,
    the events should simply be stored in a new index, for example behind a new “monitoring”
    index alias. Sometimes different event types are indexed; you should remember
    that Kibana will deal with the full index without making distinctions of different
    types of documents within the index. So, naming your event properly so there are
    no field collisions is also a consideration that you should keep in mind.   Using
    Curator ( [`https://github.com/elastic/curator`](https://github.com/elastic/curator)
    ) to manage your indices is essential too! I talked about the retention period
    earlier, which is also relevant for monitoring your architecture. As monitoring
    logs are ingested and indexed, time-based indexes are created, and with Curator,
    you will be able to schedule procedures that will close, archive, or delete indexes
    (for example, every index older than six weeks).  


    The last point to consider is the security of the overall architecture, as described
    in the next section.


    ### Considering Security


    Security is complex, specifically in distributed architecture. Ideally there are
    a set of tools and best practices that reduce the pain of securing the architecture.


    *   The first tip is related to Dockerizing your architecture. Every container
    is isolated from the rest of the world. You can limit the number of resources
    that the container will use such as the RAM, CPU, or network usage, but you can
    also limit access in terms of network connectivity.


    Still, sometimes you need to expose the container to the outside world. For instance,
    in the previous example, I set the configuration of the Docker Compose YML file
    so that the Elasticsearch container is exposing port 9200, as shown in Listing
    [7-8](#A978-1-4842-1326-1_7_Chapter.html#FPar8).


    Listing 7-8.8CC


    `elasticsearch1:`


      `image: bahaaldine/docker-elasticsearch`


      `ports:`


        `- "9200:9200"`


      `volumes:`


        `- "logs/elasticsearch1:/var/log/elasticsearch"`


        `- "conf/elasticsearch/templates:/etc/elasticsearch/templates"`


        `- "data:/data"`


      `extra_hosts:`


        `- "elasticsearch:192.168.59.103"`


    *   This represents a security breach if the port is not secured on the host machine.
    Ideally, this doesn’t require any specific security configuration and can be handled
    by the usual security best practices such as IP filtering, proxies, and so on.

    *   The log transport from the forwarder to the processor is secured through the
    Lumberjack protocol that uses certificates.

    *   Kibana also needs to expose its port to give users access to the dashboards.
    The same applies here in terms of security best practices; you can simply deploy
    a proxy web server such as an Apache web server and configure it to expose an
    HTTPS endpoint.

    *   Last is accessing the data in Elasticsearch. Even if you put a proxy in front
    of Elasticsearch, one user can access the other user’s indices by default. As
    of today, the only supported way to secure the data and access to Elasticsearch
    is by using one of the commercial plug-ins called Shield.


    Shieldis an Elasticsearch plug-in that offers multiple security features for the
    ELK stack, including the following:


    *   Role-based access controls: Roles can be defined and mapped to users or groups
    of users. Every privilege can be finely configured such as cluster and indices-level
    privileges. In this case, you can segregate a shared Elasticsearch cluster so
    every user will see only the data and assets to which he has related privileges.

    *   LDAP or Active Directory users: Shield can connect to your LDAP or Active
    Directory so you don’t have to redefine all your users at Elasticsearch; this
    affects only roles, and you can leverage your existing authentication mechanism.
    Users can be actual human users or even technical users such as a Logstash agent
    that indexes documents in Elasticsearch.

    *   Encrypted communications: Shield allows encrypted communications through SSL
    and TLS.

    *   Audit logging: Every access to the cluster is logged.

    *   IP filtering: You can restrict access to specific IP address or a range of
    IP addresses.


    So, as the cluster grows, offers more entry points to users, and shares resources
    between different data projects, you might consider adding an enterprise plug-in
    such as Shield to secure your architecture.


    ## Summary


    The data architecture is by nature distributed and highly scalable. In this chapter,
    you learned how you can keep bringing flexibility to the governance aspect by
    packaging the architecture with Docker Compose. At this point, you should be able
    to extend this architecture by, for example, adding new components and enriching
    the Docker Compose project with new configurations.'
  trans: "\n### 使用 Elastic Stack 监控基础设施\n\n在前面的章节中，您学习了如何搭建一个 Lambda 架构来摄入 Apache\
    \ 日志以揭示业务分析。该架构的每一层在整个事务处理中都负责特定任务，并且每个应用可能都有不同的重要 KPI 需要监控。\n\n问题是，为什么不将所学知识扩展到监控您自己的架构呢？这个问题背后的思路是，让您的架构日志能够被摄入，从而获得进一步的运维洞察。\n\
    \n您需要做的只是按照以下步骤来组织架构：\n\n**集中化管理日志。** 如果日志集中存储在 SAN（存储区域网络）、Amazon S3 存储桶或其他网络共享文件夹等单一位置，将有助于简化日志信息的检索以及监控架构的部署。在\
    \ Docker Compose 文件中，配置已设置为将所有日志集中到 Docker Compose 项目的 `logs` 文件夹中。清单 7-7 展示了\
    \ Zookeeper 的配置。\n\n清单 7-7. Docker Compose Kafka 配置\n\n```\nkafka1:\n  image:\
    \ bahaaldine/docker-kafka\n  volumes:\n    - \"conf/kafka/server1:/etc/kafka\"\
    \n    - \"logs/kafka1:/opt/kafka/logs/\"\n  extra_hosts:\n    - \"brokers:192.168.59.103\"\
    \n  ports:\n    - \"9092:9092\"\n```\n\n然后，您应该考虑重用现有的 Elasticsearch 集群，或者创建一个新的集群。显然，这个问题的答案取决于不同因素，例如现有集群的密度和工作负载，甚至是购置新机器时可能涉及的成本等非技术因素。如果是专用集群，事情会更简单；如果不是，则事件应存储在新的索引中，例如通过新的“monitoring”索引别名。有时不同的事件类型会被索引；您应该记住，Kibana\
    \ 会处理整个索引，而不会区分索引内不同类型的文档。因此，正确命名事件以避免字段冲突也是您需要考虑的一点。\n\n使用 Curator（`https://github.com/elastic/curator`）来管理索引也至关重要！我前面讨论过保留期限，这对于监控架构同样重要。随着监控日志被摄入和索引，基于时间的索引会被创建，通过\
    \ Curator，您将能够安排关闭、归档或删除索引的流程（例如，所有超过六周的索引）。\n\n最后要考虑的是整个架构的安全性，将在下一节中描述。\n\n\
    ### 考虑安全性\n\n安全性很复杂，尤其是在分布式架构中。理想情况下，存在一组工具和最佳实践可以减少保护架构安全的痛苦。\n\n- 第一个提示与将您的架构\
    \ Docker 化有关。每个容器都与外界隔离。您可以限制容器将使用的资源数量，例如 RAM、CPU 或网络使用量，但您也可以限制网络连接层面的访问权限。\n\
    \n不过，有时您需要将容器暴露给外部世界。例如，在前面的示例中，我设置了 Docker Compose YML 文件的配置，使得 Elasticsearch\
    \ 容器暴露了 9200 端口，如清单 7-8 所示。\n\n清单 7-8. Docker Compose Elasticsearch 配置\n\n```\n\
    elasticsearch1:\n  image: bahaaldine/docker-elasticsearch\n  ports:\n    - \"\
    9200:9200\"\n  volumes:\n    - \"logs/elasticsearch1:/var/log/elasticsearch\"\n\
    \    - \"conf/elasticsearch/templates:/etc/elasticsearch/templates\"\n    - \"\
    data:/data\"\n  extra_hosts:\n    - \"elasticsearch:192.168.59.103\"\n```\n\n\
    - 如果主机上的端口未得到安全保护，这就构成了安全漏洞。理想情况下，这不需要任何特定的安全配置，可以通过常规的安全最佳实践（如 IP 过滤、代理等）来处理。\n\
    - 从转发器到处理器的日志传输通过使用证书的 Lumberjack 协议得到安全保障。\n- Kibana 也需要暴露其端口，以便用户访问仪表盘。在安全最佳实践方面，这里同样适用；您可以简单地部署一个代理\
    \ Web 服务器（如 Apache Web 服务器），并将其配置为暴露 HTTPS 端点。\n- 最后是访问 Elasticsearch 中的数据。即使您在\
    \ Elasticsearch 前放置了代理，默认情况下一个用户也可以访问其他用户的索引。截至目前，保护 Elasticsearch 数据和访问权限唯一受支持的方法是使用一个名为\
    \ `Shield` 的商业插件。\n\n`Shield` 是一个 Elasticsearch 插件，为 ELK 堆栈提供了多种安全功能，包括以下内容：\n\
    \n- 基于角色的访问控制：可以定义角色并将其映射到用户或用户组。每个权限都可以进行精细配置，例如集群和索引级别的权限。在这种情况下，您可以隔离共享的 Elasticsearch\
    \ 集群，使每个用户只能看到其拥有相关权限的数据和资产。\n- LDAP 或 Active Directory 用户：`Shield` 可以连接到您的 LDAP\
    \ 或 Active Directory，这样您就不需要在 Elasticsearch 中重新定义所有用户；这只会影响角色，并且您可以利用现有的身份验证机制。用户可以是真实的人类用户，甚至可以是技术用户，例如在\
    \ Elasticsearch 中索引文档的 Logstash 代理。\n- 加密通信：`Shield` 支持通过 SSL 和 TLS 进行加密通信。\n\
    - 审计日志记录：对集群的每次访问都会被记录。\n- IP 过滤：您可以限制对特定 IP 地址或 IP 地址范围的访问。\n\n因此，随着集群的增长、为用户提供更多入口点以及在不同的数据项目之间共享资源，您可能需要考虑添加一个企业级插件，例如\
    \ `Shield`，来保护您的架构。\n\n## 总结\n\n数据架构本质上是分布式且高度可扩展的。在本章中，您学习了如何通过使用 Docker Compose\
    \ 打包架构，为治理层面持续带来灵活性。至此，您应该能够扩展此架构，例如添加新组件，并用新的配置来丰富 Docker Compose 项目。\n"
