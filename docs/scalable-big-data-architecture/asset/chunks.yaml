  trans: '

    ### 键/值存储


    最容易理解的 NoSQL 数据存储是键/值存储。这类数据存储的基本工作方式类似于字典，通过将键与值进行匹配来运作。它们常用于需要存储基础信息的高性能场景——例如，需要快速写入和检索会话信息时。对于这类用例，这些数据存储性能卓越且高效，同时也通常具备高可扩展性。


    键/值存储也可用于队列场景，确保数据不会丢失，例如在日志架构或搜索引擎索引架构中。


    `Redis` 和 `Riak KV` 是最著名的键/值数据存储；`Redis` 应用更为广泛，它拥有一个内存中的键/值存储，并支持可选的数据持久化。`Redis`
    经常在 Web 应用程序中用于存储会话相关数据，例如 `node` 或 PHP Web 应用；它每秒可以处理数千次会话检索而不会影响性能。另一个典型的用例是本书后面将描述的队列场景；`Redis`
    置于 `Logstash` 和 `ElasticSearch` 之间，用于避免流式日志数据在被索引到 `ElasticSearch` 以供查询之前丢失。


    ### 列存储


    当键/值数据存储达到其极限，因为你希望存储大量的记录，且这些记录包含远超键/值存储简单性质的巨量信息时，就会用到列导向数据存储。


    对于来自关系型数据库领域的人来说，列数据存储技术可能难以理解，但实际上，它们相当简单。在关系型数据库中，数据按行存储，而在列数据存储中，数据显然是按列存储的。使用列式数据库的主要好处是你可以快速访问大量数据。在关系型数据库中，一行是一个连续的磁盘条目，多行存储在不同的磁盘位置，这使得访问更加困难；而在列式数据库中，属于同一列的所有单元格是连续存储的。


    例如，考虑在关系型数据库中查找所有博客标题；这在磁盘条目方面可能代价高昂，特别是在谈论数百万条记录时；而在列式数据库中，这样的搜索仅代表一次访问。


    这类数据库对于从特定族中检索大量数据确实非常方便，但代价是缺乏灵活性。最常用的列式数据库是 Google Cloud Bigtable，但具体来说，还有 Apache
    HBase 和 Cassandra。


    列式数据库的另一个好处是易于扩展，因为数据是按列存储的；这些列在它们可以存储的信息量方面具有高度可扩展性。这就是为什么它们主要用于保存非易失性、长期存在的信息以及扩展场景。


    ### 文档存储


    列式数据库并不适合构建包含更深层嵌套结构的数据——这正是文档导向数据存储发挥作用的地方。数据确实是以键/值对的形式存储的，但这些键/值对被全部压缩进所谓的文档中。这个文档依赖于某种结构或编码，例如
    `XML`，但大多数情况下，它依赖于 `JSON`（JavaScript 对象表示法）。


    尽管文档导向数据库在结构上和表示数据方面更有用，但它们也有缺点——特别是在与数据交互方面。它们基本上需要获取整个文档——例如，当它们读取特定字段时——这会极大地影响性能。


    当你需要嵌套信息时，你倾向于使用文档导向数据库。例如，考虑如何在你的应用程序中表示一个账户。它会包含以下内容：


    *   基本信息：名、姓、生日、个人资料图片、URL、创建日期等

    *   复杂信息：地址、认证方式（密码、Facebook 等）、兴趣等


    这也是 NoSQL 文档导向存储经常用于 Web 应用程序的原因：使用嵌套对象表示对象非常容易，并且与前端 JavaScript 技术集成是无缝的，因为这两种技术都使用
    `JSON`。


    当今最常用的技术是 `MongoDB`、`Couchbase` 和 `Apache CouchDB`。它们易于安装和启动，文档齐全，可扩展，但最重要的是，它们是启动现代
    Web 应用程序最显而易见的选择。


    `Couchbase` 是我们将在架构中使用的技术之一，特别是因为我们能够使用它来存储、组织和查询数据。我选择 `Couchbase` 主要是基于一个性能基准测试，该测试表明，在高吞吐量下，其高延迟比
    `MongoDB` 更低。


    另外值得一提的是，`Couchbase` 是 `CouchDB` 和 `Memcached` 的结合体。如今，从支持的角度来看，使用 `Couchbase`
    更有意义，更多细节请参见此链接。


    ### 图存储


    图数据库与其他类型的数据库确实不同。它们使用不同的范式来表示数据——一种类似树的结构，包含节点和边，并通过称为关系的路径相互连接。


    这些数据库随着社交网络而兴起，例如，用于表示用户的“朋友”网络、他们朋友之间的关系等。使用其他类型的数据存储，可以在文档中存储用户的朋友关系，但即便如此，存储“朋友的朋友”关系可能会变得非常复杂；更好的做法是使用图数据库，为每个朋友创建节点，通过关系连接它们，并根据查询的需求和范围来遍历图。


    最著名的图数据库是 `Neo4j`，正如我之前提到的，它用于处理复杂关系信息的用例，例如实体之间的连接以及与之相关的其他实体；但它也用于分类场景。


    图 2-1 展示了三个实体如何在一个图数据库中被连接起来。


    ![A978-1-4842-1326-1_2_Fig1_HTML.jpg](img/A978-1-4842-1326-1_2_Fig1_HTML.jpg)


    图 2-1.


    图数据库示例


    图中的两个账户节点，Jane 和 John，通过定义其关系的边相互连接；它们自某个日期起就彼此认识。另一个群组节点连接到这两个账户节点，这表明 Jane 和
    John 自某个日期起就一直是足球群组的成员。

    '
- fmt: "### NoSQL in Our Use Case\n\nIn the context of our use case, we first need\
    \ a document-oriented NoSQL technology that structures the data contained in our\
    \ relational database into a JSON document. As mentioned earlier, traditional\
    \ RDBMSs store data into multiple tables linked with relationships, which makes\
    \ it harder and less efficient when you want to get the description of a whole\
    \ object.\n\nLet’s take the example of an account that can be split into the tables\
    \ shown in Figure [2-2](#A978-1-4842-1326-1_2_Chapter.html#Fig2).\n\n![A978-1-4842-1326-1_2_Fig2_HTML.jpg](A978-1-4842-1326-1_2_Fig2_HTML.jpg)\n\
    Figure 2-2. Account tables\n\nIf you want to retrieve all account information,\
    \ you basically need to make two joins between the three tables. Now think this:\
    \ I need to do that for all users, every time they connect, and these connections\
    \ happen for different business logic reasons in my application. In the end, you\
    \ just want a “view” of the account itself.\n\nWhat if we can get the whole account\
    \ view just by passing the account identifier to a method of our application API\
    \ that returns the following JSON document?\n\n```\n{\n    \"id\": \"account_identifier\"\
    ,\n    \"email\": \"account@email.com\",\n    \"firstname\": \"account_firstname\"\
    ,\n    \"lastname\": \"account_lastname\",\n    \"birthdate\": \"account_birthdate\"\
    ,\n    \"authentication\": [{\n        \"token\": \"authentication_token_1\",\n\
    \        \"source\": \"authenticaton_source_1\",\n        \"created\": \"12-12-12\"\
    \n    }, {\n        \"token\": \"authentication_token_2\",\n        \"source\"\
    : \"authenticaton_source_2\",\n        \"created\": \"12-12-12\"\n    }],\n  \
    \  \"address\": [{\n        \"street\": \"address_street_1\",\n        \"city\"\
    : \"address_city_1\",\n        \"zip\": \"address_zip_1\",\n        \"country\"\
    : \"address_country_1\",\n        \"created\": \"12-12-12\"\n    }]\n}\n```\n\n\
    The benefit is obvious: by keeping a fresh JSON representation of our application\
    \ entities, we can get better and faster data access. Furthermore, we can generalize\
    \ this approach to all read requests so that all the reading is done on the NoSQL\
    \ data store, which leaves all the modification requests (create, update, delete)\
    \ to be made on the RDBMS. But we must implements a logic that transactionally\
    \ spreads any changes on the RDBMS to the NoSQL data store and also that creates\
    \ the object from the relational database if it is not found in the cache.\n\n\
    You may wonder why we would keep the RDBMS when we know that creating documents\
    \ in a NoSQL data store is really efficient and scalable. It is because that is\
    \ actually not the goal of our application. We don’t want to make a Big Bang effect.\
    \ Let’s assume that the RDBMS was already there and that we want to integrate\
    \ a NoSQL data store because of the lack of flexibility in a RDBMS. We want to\
    \ leverage the best of the two technologies—specifically the data consistency\
    \ in the RDBMS and the scalability from the NoSQL side.\n\nBeside, this is just\
    \ a simple query example that we can perform, but we want to go further by, for\
    \ example, making full-text searches on any field of our document. Indeed, how\
    \ do we do this with a relational database? There is indexing, that’s true, but\
    \ would we index all table columns? In fact, that’s not possible; but this is\
    \ something you can easily do with NoSQL technologies such as ElasticSearch.\n\
    \nBefore we dive into such a NoSQL caching system, we need to go through how to\
    \ use a Couchbase document-oriented database, and then we need to review the limitations\
    \ that will drive us to switch to ElasticSearch.\n\nWe will see that our scalable\
    \ architecture first relies on Couchbase, but because of some important Couchbase\
    \ limitations, we’ll first complete the architecture with ElasticSearch before\
    \ we make a definitive shift to it.\n\n## Introducing Couchbase\n\nCouchbase is\
    \ an open source, document-oriented database that has a flexible data model, is\
    \ performant, is scalable, and is suitable for applications like the one in our\
    \ use case that needs to shift its relational database data into a structured\
    \ JSON document.\n\nMost NoSQL technologies have similar architectures—we’ll first\
    \ see how the Couchbase architecture is organized and get introduced to naming\
    \ convention in Couchbase, then we’ll go deeper into detail on how querying data\
    \ is stored in Couchbase, and finally we’ll talk about cross datacenter replication."
  raw: '### NoSQL in Our Use Case


    In the context of our use case, we first need a document-oriented NoSQL technology
    that structures the data contained in our relational database into a JSON document.
    As mentioned earlier, traditional RDBMSs store data into multiple tables linked
    with relationships, which makes it harder and less efficient when you want to
    get the description of a whole object.


    Let’s take the example of an account that can be split into the tables shown in
    Figure [2-2](#A978-1-4842-1326-1_2_Chapter.html#Fig2).


    ![A978-1-4842-1326-1_2_Fig2_HTML.jpg](A978-1-4842-1326-1_2_Fig2_HTML.jpg)


    Figure 2-2.


    Account tables


    If you want to retrieve all account information, you basically need to make two
    joins between the three tables. Now think this: I need to do that for all users,
    every time they connect, and these connections happen for different business logic
    reasons in my application. In the end, you just want a “view” of the account itself.


    What if we can get the whole account view just by passing the account identifier
    to a method of our application API that returns the following JSON document?


    `{`


            `"id": "account_identifier",`


            `"email": "account@email.com",`


            `"firstname": "account_firstname",`


            `"lastname": "account_lastname",`


            `"birthdate": "account_birthdate",`


            `"authentication": [{`


                    `"token": "authentication_token_1",`


                    `"source": "authenticaton_source_1",`


                    `"created": "12-12-12"`


            `}, {`


                    `"token": "authentication_token_2",`


                    `"source": "authenticaton_source_2",`


                    `"created": "12-12-12"`


            `}],`


            `"address": [{`


                    `"street": "address_street_1",`


                    `"city": "address_city_1"`


                    `"zip": "address_zip_1"`


                    `"country": "address_country_1"`


                    `"created": "12-12-12"`


            `}]`


    `}`


    The benefit is obvious: by keeping a fresh JSON representation of our application
    entities, we can get better and faster data access. Furthermore, we can generalize
    this approach to all read requests so that all the reading is done on the NoSQL
    data store, which leaves all the modification requests (create, update, delete)
    to be made on the RDBMS. But we must implements a logic that transactionally spreads
    any changes on the RDBMS to the NoSQL data store and also that creates the object
    from the relational database if it is not found in the cache.


    You may wonder why we would keep the RDBMS when we know that creating documents
    in a NoSQL data store is really efficient and scalable. It is because that is
    actually not the goal of our application. We don’t want to make a Big Bang effect.
    Let’s assume that the RDBMS was already there and that we want to integrate a
    NoSQL data store because of the lack of flexibility in a RDBMS. We want to leverage
    the best of the two technologies—specifically the data consistency in the RDBMS
    and the scalability from the NoSQL side.


    Beside, this is just a simple query example that we can perform, but we want to
    go further by, for example, making full-text searches on any field of our document.
    Indeed, how do we do this with a relational database? There is indexing, that’s
    true, but would we index all table columns? In fact, that’s not possible; but
    this is something you can easily do with NoSQL technologies such as ElasticSearch.


    Before we dive into such a NoSQL caching system, we need to go through how to
    use a Couchbase document-oriented database, and then we need to review the limitations
    that will drive us to switch to ElasticSearch.


    We will see that our scalable architecture first relies on Couchbase, but because
    of some important Couchbase limitations, we’ll first complete the architecture
    with ElasticSearch before we make a definitive shift to it.


    ## Introducing Couchbase


    Couchbase is an open source, document-oriented database that has a flexible data
    model, is performant, is scalable, and is suitable for applications like the one
    in our use case that needs to shift its relational database data into a structured
    JSON document.


    Most NoSQL technologies have similar architectures—we’ll first see how the Couchbase
    architecture is organized and get introduced to naming convention in Couchbase,
    then we’ll go deeper into detail on how querying data is stored in Couchbase,
    and finally we’ll talk about cross datacenter replication.'
  trans: "\n### 我们用例中的 NoSQL\n\n针对我们的用例，首先需要一种面向文档的 NoSQL 技术，将关系型数据库中包含的数据结构化地组织成\
    \ JSON 文档。如前所述，传统的关系型数据库管理系统（RDBMS）会将数据存储到通过关系关联的多个表中，这在需要获取整个对象的描述时会更加困难且效率低下。\n\
    \n我们以一个可拆分为图 2-2 所示多个表的账户为例。\n\n![A978-1-4842-1326-1_2_Fig2_HTML.jpg](img/A978-1-4842-1326-1_2_Fig2_HTML.jpg)\n\
    图 2-2. 账户表\n\n如果要检索所有账户信息，基本上需要在三个表之间进行两次连接。现在请思考一下：每当用户连接时，我都需要对所有用户执行此操作，而这些连接在我的应用程序中是由于不同的业务逻辑原因而发生的。说到底，你只是想要账户本身的“视图”。\n\
    \n如果我们只需将账户标识符传递给应用程序 API 的一个方法，并返回以下 JSON 文档，就能获取整个账户视图呢？\n\n```\n{\n    \"id\"\
    : \"account_identifier\",\n    \"email\": \"account@email.com\",\n    \"firstname\"\
    : \"account_firstname\",\n    \"lastname\": \"account_lastname\",\n    \"birthdate\"\
    : \"account_birthdate\",\n    \"authentication\": [{\n        \"token\": \"authentication_token_1\"\
    ,\n        \"source\": \"authenticaton_source_1\",\n        \"created\": \"12-12-12\"\
    \n    }, {\n        \"token\": \"authentication_token_2\",\n        \"source\"\
    : \"authenticaton_source_2\",\n        \"created\": \"12-12-12\"\n    }],\n  \
    \  \"address\": [{\n        \"street\": \"address_street_1\",\n        \"city\"\
    : \"address_city_1\",\n        \"zip\": \"address_zip_1\",\n        \"country\"\
    : \"address_country_1\",\n        \"created\": \"12-12-12\"\n    }]\n}\n```\n\n\
    其好处显而易见：通过维护应用程序实体的最新 JSON 表示形式，我们可以获得更好、更快的数据访问。此外，我们可以将这种方法推广到所有读取请求，所有读取操作均在\
    \ NoSQL 数据存储上完成，而所有修改请求（创建、更新、删除）则由 RDBMS 处理。但我们必须实现一种逻辑，既能将 RDBMS 上的任何更改事务性地传播到\
    \ NoSQL 数据存储，又能在缓存中未找到对象时从关系型数据库中创建该对象。\n\n你可能会问，既然我们知道在 NoSQL 数据存储中创建文档既高效又具有可扩展性，为什么还要保留\
    \ RDBMS？这是因为实际上这并非我们应用程序的目标。我们不想造成颠覆性影响。假设 RDBMS 已经存在，而由于 RDBMS 缺乏灵活性，我们想要集成一个\
    \ NoSQL 数据存储。我们希望充分利用这两项技术的优势——特别是 RDBMS 的数据一致性和 NoSQL 的可扩展性。\n\n此外，这只是一个可以执行的简单查询示例，但我们希望更进一步，例如对文档的任意字段进行全文搜索。实际上，使用关系型数据库如何实现这一点？可以建立索引，这没错，但我们会索引所有表列吗？事实上，这是不可能的；但使用\
    \ ElasticSearch 等 NoSQL 技术，你可以轻松做到这一点。\n\n在深入探讨这样的 NoSQL 缓存系统之前，我们需要了解如何使用 Couchbase\
    \ 面向文档的数据库，然后审视其局限性，这些局限性将驱使我们转向 ElasticSearch。\n\n我们将看到，我们的可扩展架构最初依赖于 Couchbase，但由于\
    \ Couchbase 的一些重要局限性，我们首先会用 ElasticSearch 来完善该架构，然后再最终完全迁移到 ElasticSearch。\n\n\
    ## Couchbase 简介\n\nCouchbase 是一个开源、面向文档的数据库，具有灵活的数据模型、高性能、可扩展等特点，适用于需要将关系型数据库中的数据转换为结构化\
    \ JSON 文档的用例（如我们所述的场景）。\n\n大多数 NoSQL 技术都有相似的架构——我们首先会了解 Couchbase 的架构组织方式，并熟悉\
    \ Couchbase 中的命名约定，然后深入探讨如何查询存储在 Couchbase 中的数据，最后讨论跨数据中心复制。\n"
- fmt: "# Architecture\n\nCouchbase is based on a real shared-nothing architecture,\
    \ which means that there is no single point of contention because every node in\
    \ the cluster is self-sufficient and independent. That’s how distributed technologies\
    \ work—nodes don’t share any memory or disk storage.\n\nDocuments are stored in\
    \ JSON or in binary in Couchbase, are replicated over the cluster, and are organized\
    \ into units called buckets. A bucket can be scaled depending on the storage and\
    \ access needs by setting the RAM for caching and also by setting the number of\
    \ replication for resiliency. Under the hood, a bucket is split into smaller units\
    \ called vBuckets that are actually data partitions. Couchbase uses a cluster\
    \ map to map the partition to the server to which it belongs.\n\nA Couchbase server\
    \ replicates up to three times a bucket within a cluster; every Couchbase server\
    \ then manages a subset of the active or replica vBuckets. That’s how resiliency\
    \ works in Couchbase; every time a document is indexed, it’s replicated, and if\
    \ a node within the cluster goes down, then the cluster promotes a replica partition\
    \ to active to ensure continuous service.\n\nOnly one copy of the data is active\
    \ with zero or more replicas in the cluster as Figure [2-3](#A978-1-4842-1326-1_2_Chapter.html#Fig3)\
    \ illustrates.\n\n![A978-1-4842-1326-1_2_Fig3_HTML.jpg](A978-1-4842-1326-1_2_Fig3_HTML.jpg)\n\
    \nFigure 2-3. Couchbase active document and replicas\n\nFrom a client point of\
    \ view, if smart-clients are used as part as the provided clients (Java, C, C++,\
    \ Ruby, etc.), then these clients are connected to the cluster map; that’s how\
    \ clients can send requests from applications to the appropriate server, which\
    \ holds the document. In term of interaction, there is an important point to remember:\
    \ operations on documents are, by default, asynchronous. This means that when,\
    \ for example, you update a document, Couchbase does not update it immediately\
    \ on the disk. It actually goes through the processing shown in Figure [2-4](#A978-1-4842-1326-1_2_Chapter.html#Fig4).\n\
    \n![A978-1-4842-1326-1_2_Fig4_HTML.jpg](A978-1-4842-1326-1_2_Fig4_HTML.jpg)\n\n\
    Figure 2-4. Couchbase data flow\n\nAs Figure [2-4](#A978-1-4842-1326-1_2_Chapter.html#Fig4)\
    \ shows, the smart-client connects to a Couchbase server instance and first asynchronously\
    \ writes the document in the managed cache. The client gets a response immediately\
    \ and is not blocked until the end of the data flow process, but this behavior\
    \ can be changed at the client level to make the client wait for the write to\
    \ be finished. Then the document is put in the inter-cluster write queue, so the\
    \ document is replicated across the cluster; after that, the document is put in\
    \ the disk storage write queue to be persisted on the related node disk. If multiple\
    \ clusters are deployed, then the Cross Data Center Replication (XDCR) feature\
    \ can be used to propagate the changes to other clusters, located on a different\
    \ data center.\n\nCouchbase has its own way to query the data; indeed, you can\
    \ query the data with a simple document ID, but the power of Couchbase is inside\
    \ the view feature. In Couchbase, there is a second-level index called the design\
    \ document, which is created within a bucket. A bucket can contain multiple types\
    \ of document, for example, in a simple e-commerce application a bucket would\
    \ contain the following:\n\n* Account\n* Product\n* Cart\n* Orders\n* Bills\n\n\
    The way Couchbase splits them logically is through the design document. A bucket\
    \ can contain multiple design documents, which also contain multiple views. A\
    \ view is a function that indexes documents contained in the bucket in a user-defined\
    \ way. The function is precisely a user-defined map/reduce function that maps\
    \ documents across the cluster and outputs key/value pairs, which are then stored\
    \ in the index for further retrieval. Let’s go back to our e-commerce website\
    \ example and try to index all orders so we can get them from the account identifier.\
    \ The map/reduce function would be as follows:\n\n```\nfunction(doc, meta) {\n\
    \  if (doc.order_account_id)\n    emit(doc.order_account_id, null);\n}\n```\n\n\
    The `if` statement allows the function to focus only on the document that contains\
    \ the `order_account_id` field and then index this identifier. Therefore any client\
    \ can query the data based on this identifier in Couchbase.\n\n## Cluster Manager\
    \ and Administration Console\n\nCluster manager is handled by a specific node\
    \ within the cluster, the orchestrator node. At any time, if one of the nodes\
    \ fails within the cluster, then the orchestrator handles the failover by notifying\
    \ all other nodes within the cluster, locating the replica partitions of the failing\
    \ node to promote them to active status. Figure [2-5](#A978-1-4842-1326-1_2_Chapter.html#Fig5)\
    \ describes the failover process.\n\n![A978-1-4842-1326-1_2_Fig5_HTML.jpg](A978-1-4842-1326-1_2_Fig5_HTML.jpg)\n\
    \nFigure 2-5. Couchbase failover\n\nIf the orchestrator node fails, then all nodes\
    \ detect that through the heartbeat watchdog, which is a cluster component that\
    \ runs on all cluster nodes. Once the failure is detected, a new orchestrator\
    \ is elected among the nodes.\n\nAll cluster-related features are exposed through\
    \ APIs that can be used to manage Couchbase, but the good news is that an administration\
    \ console is shipped out of the box. Couchbase console is a secure console that\
    \ lets you manage and monitor your cluster; you can choose from the available\
    \ actions, which include setting up your server, creating buckets, browsing and\
    \ updating documents, implementing new views, and monitoring vBucket and the disk\
    \ write queue.\n\nFigure [2-6](#A978-1-4842-1326-1_2_Chapter.html#Fig6) shows\
    \ the Couchbase console home page with an overview of the RAM used by existing\
    \ buckets, the disk used by data, and the buckets’ activity.\n\n![A978-1-4842-1326-1_2_Fig6_HTML.jpg](A978-1-4842-1326-1_2_Fig6_HTML.jpg)\n\
    \nFigure 2-6. Couchbase console home\n\nYou can perform cluster management in\
    \ the Server Nodes tab, which lets the user configure failover and replication\
    \ to prevent them from losing data. Figure [2-7](#A978-1-4842-1326-1_2_Chapter.html#Fig7)\
    \ shows a single node installation that is not safe for failover as the warning\
    \ mentions.\n\n![A978-1-4842-1326-1_2_Fig7_HTML.jpg](A978-1-4842-1326-1_2_Fig7_HTML.jpg)\n\
    \nFigure 2-7. Couchbase server nodes\n\nAt any time, you can add a new Couchbase\
    \ server by clicking the Add Server button; when you do, data will start replicating\
    \ across nodes to enable failover.\n\nBy clicking on the server IP, you can access\
    \ fine-grained monitoring data on each aspect of the bucket, as shown in Figure\
    \ [2-8](#A978-1-4842-1326-1_2_Chapter.html#Fig8).\n\n![A978-1-4842-1326-1_2_Fig8_HTML.jpg](A978-1-4842-1326-1_2_Fig8_HTML.jpg)\n\
    \nFigure 2-8. Couchbase bucket monitoring\n\nThis figure shows a data bucket called\
    \ DevUser that contains the user-related JSON document. As explained earlier,\
    \ the process of indexing a new document is part of a complex data flow under\
    \ the hood. The metrics shown in the monitoring console are essential when you\
    \ are dealing with a large amount of data that generates a high indexing throughput.\
    \ For example, the disk queue statistics can reveal bottlenecks when data is being\
    \ written on the disk.\n\nIn Figure [2-9](#A978-1-4842-1326-1_2_Chapter.html#Fig9),\
    \ we can see that the drain rate—the number of items written on the disk from\
    \ the disk write queue—is alternatively flat on the active side when the replica\
    \ is written, and that the average age of the active item grows during that flat\
    \ period. An altering behavior would have been to see the average age of the active\
    \ item keep growing, which would mean that the writing process was too slow compared\
    \ to the number of active items pushed into the write disk queue.\n\n![A978-1-4842-1326-1_2_Fig9_HTML.jpg](A978-1-4842-1326-1_2_Fig9_HTML.jpg)\n\
    \nFigure 2-9. Couchbase bucket disk queue"
  raw: '### Architecture


    Couchbase is based on a real shared-nothing architecture, which means that there
    is no single point of contention because every node in the cluster is self-sufficient
    and independent. That’s how distributed technologies work—nodes don’t share any
    memory or disk storage.


    Documents are stored in JSON or in binary in Couchbase, are replicated over the
    cluster, and are organized into units called buckets. A bucket can be scaled depending
    on the storage and access needs by setting the RAM for caching and also by setting
    the number of replication for resiliency. Under the hood, a bucket is split into
    smaller units called vBuckets that are actually data partitions. Couchbase uses
    a cluster map to map the partition to the server to which it belongs.


    A Couchbase server replicates up to three times a bucket within a cluster; every
    Couchbase server then manages a subset of the active or replica vBuckets. That’s
    how resiliency works in Couchbase; every time a document is indexed, it’s replicated,
    and if a node within the cluster goes down, then the cluster promotes a replica
    partition to active to ensure continuous service.


    Only one copy of the data is active with zero or more replicas in the cluster
    as Figure [2-3](#A978-1-4842-1326-1_2_Chapter.html#Fig3) illustrates.


    ![A978-1-4842-1326-1_2_Fig3_HTML.jpg](A978-1-4842-1326-1_2_Fig3_HTML.jpg)


    Figure 2-3.


    Couchbase active document and replicas


    From a client point of view, if smart-clients are used as part as the provided
    clients (Java, C, C++, Ruby, etc.), then these clients are connected to the cluster
    map; that’s how clients can send requests from applications to the appropriate
    server, which holds the document. In term of interaction, there is an important
    point to remember: operations on documents are, by default, asynchronous. This
    means that when, for example, you update a document, Couchbase does not update
    it immediately on the disk. It actually goes through the processing shown in Figure
    [2-4](#A978-1-4842-1326-1_2_Chapter.html#Fig4).


    ![A978-1-4842-1326-1_2_Fig4_HTML.jpg](A978-1-4842-1326-1_2_Fig4_HTML.jpg)


    Figure 2-4.


    Couchbase data flow


    As Figure [2-4](#A978-1-4842-1326-1_2_Chapter.html#Fig4) shows, the smart-client
    connects to a Couchbase server instance and first asynchronously writes the document
    in the managed cache. The client gets a response immediately and is not blocked
    until the end of the data flow process, but this behavior can be changed at the
    client level to make the client wait for the write to be finished. Then the document
    is put in the inter-cluster write queue, so the document is replicated across
    the cluster; after that, the document is put in the disk storage write queue to
    be persisted on the related node disk. If multiple clusters are deployed, then
    the Cross Data Center Replication (XDCR) feature can be used to propagate the
    changes to other clusters, located on a different data center.


    Couchbase has its own way to query the data; indeed, you can query the data with
    a simple document ID, but the power of Couchbase is inside the view feature. In
    Couchbase, there is a second-level index called the design document, which is
    created within a bucket. A bucket can contain multiple types of document, for
    example, in a simple e-commerce application a bucket would contain the following:


    *   Account

    *   Product

    *   Cart

    *   Orders

    *   Bills


    The way Couchbase splits them logically is through the design document. A bucket
    can contain multiple design documents, which also contain multiple views. A view
    is a function that indexes documents contained in the bucket in a user-defined
    way. The function is precisely a user-defined map/reduce function that maps documents
    across the cluster and outputs key/value pairs, which are then stored in the index
    for further retrieval. Let’s go back to our e-commerce website example and try
    to index all orders so we can get them from the account identifier. The map/reduce
    function would be as follows:


    `function(doc, meta) {`


    `if (doc.order_account_id)`


    `emit(doc.order_account_id, null);`


    `}`


    The `if` statement allows the function to focus only on the document that contains
    the `order_account_id` field and then index this identifier. Therefore any client
    can query the data based on this identifier in Couchbase.


    ### Cluster Manager and Administration Console


    Cluster manager is handled by a specific node within the cluster, the orchestrator
    node. At any time, if one of the nodes fails within the cluster, then the orchestrator
    handles the failover by notifying all other nodes within the cluster, locating
    the replica partitions of the failing node to promote them to active status. Figure
    [2-5](#A978-1-4842-1326-1_2_Chapter.html#Fig5) describes the failover process.


    ![A978-1-4842-1326-1_2_Fig5_HTML.jpg](A978-1-4842-1326-1_2_Fig5_HTML.jpg)


    Figure 2-5.


    Couchbase failover


    If the orchestrator node fails, then all nodes detect that through the heartbeat
    watchdog, which is a cluster component that runs on all cluster nodes. Once the
    failure is detected, a new orchestrator is elected among the nodes.


    All cluster-related features are exposed through APIs that can be used to manage
    Couchbase, but the good news is that an administration console is shipped out
    of the box. Couchbase console is a secure console that lets you manage and monitor
    your cluster; you can choose from the available actions, which include setting
    up your server, creating buckets, browsing and updating documents, implementing
    new views, and monitoring vBucket and the disk write queue.


    Figure [2-6](#A978-1-4842-1326-1_2_Chapter.html#Fig6) shows the Couchbase console
    home page with an overview of the RAM used by existing buckets, the disk used
    by data, and the buckets’ activity.


    ![A978-1-4842-1326-1_2_Fig6_HTML.jpg](A978-1-4842-1326-1_2_Fig6_HTML.jpg)


    Figure 2-6.


    Couchbase console home


    You can perform cluster management in the Server Nodes tab, which lets the user
    configure failover and replication to prevent them from losing data. Figure [2-7](#A978-1-4842-1326-1_2_Chapter.html#Fig7)
    shows a single node installation that is not safe for failover as the warning
    mentions.


    ![A978-1-4842-1326-1_2_Fig7_HTML.jpg](A978-1-4842-1326-1_2_Fig7_HTML.jpg)


    Figure 2-7.


    Couchbase server nodes


    At any time, you can add a new Couchbase server by clicking the Add Server button;
    when you do, data will start replicating across nodes to enable failover.


    By clicking on the server IP, you can access fine-grained monitoring data on each
    aspect of the bucket, as shown in Figure [2-8](#A978-1-4842-1326-1_2_Chapter.html#Fig8).


    ![A978-1-4842-1326-1_2_Fig8_HTML.jpg](A978-1-4842-1326-1_2_Fig8_HTML.jpg)


    Figure 2-8.


    Couchbase bucket monitoring


    This figure shows a data bucket called DevUser that contains the user-related
    JSON document. As explained earlier, the process of indexing a new document is
    part of a complex data flow under the hood. The metrics shown in the monitoring
    console are essential when you are dealing with a large amount of data that generates
    a high indexing throughput. For example, the disk queue statistics can reveal
    bottlenecks when data is being written on the disk.


    In Figure [2-9](#A978-1-4842-1326-1_2_Chapter.html#Fig9), we can see that the
    drain rate—the number of items written on the disk from the disk write queue—is
    alternatively flat on the active side when the replica is written, and that the
    average age of the active item grows during that flat period. An altering behavior
    would have been to see the average age of the active item keep growing, which
    would mean that the writing process was too slow compared to the number of active
    items pushed into the write disk queue.


    ![A978-1-4842-1326-1_2_Fig9_HTML.jpg](A978-1-4842-1326-1_2_Fig9_HTML.jpg)


    Figure 2-9.


    Couchbase bucket disk queue'
  trans: "\n# 架构\n\nCouchbase 基于真正的无共享架构，这意味着没有单点争用，因为集群中的每个节点都是自给自足且独立的。这正是分布式技术的工作方式——节点不共享任何内存或磁盘存储。\n\
    \n文档在 Couchbase 中以 JSON 或二进制格式存储，在集群中复制，并组织成称为存储桶（bucket）的单元。通过设置缓存的 RAM，以及设置用于弹性的副本数，可以根据存储和访问需求对存储桶进行扩展。在底层，一个存储桶被分割成更小的单元，称为\
    \ vBuckets，这些实际上是数据分区。Couchbase 使用集群映射将分区映射到其所属的服务器。\n\n一个 Couchbase 服务器在集群内最多可为一个存储桶复制三次；然后，每个\
    \ Couchbase 服务器管理活动或副本 vBuckets 的一个子集。这就是 Couchbase 实现弹性的方式；每次索引文档时，它都会被复制，如果集群中的某个节点宕机，集群会将副本分区提升为活动状态，以确保服务持续运行。\n\
    \n如图 2-3 所示，集群中只有一份数据副本是活动的，并有零个或多个副本。\n\n![A978-1-4842-1326-1_2_Fig3_HTML.jpg](img/A978-1-4842-1326-1_2_Fig3_HTML.jpg)\n\
    \n图 2-3. Couchbase 活动文档与副本\n\n从客户端的角度来看，如果智能客户端作为提供的客户端（Java、C、C++、Ruby 等）的一部分被使用，那么这些客户端会连接到集群映射；这样，客户端就可以将请求从应用程序发送到持有该文档的相应服务器。在交互方面，有一点很重要需要记住：默认情况下，对文档的操作是异步的。这意味着，例如，当你更新一个文档时，Couchbase\
    \ 不会立即在磁盘上更新它。它实际上会经历如图 2-4 所示的处理过程。\n\n![A978-1-4842-1326-1_2_Fig4_HTML.jpg](img/A978-1-4842-1326-1_2_Fig4_HTML.jpg)\n\
    \n图 2-4. Couchbase 数据流\n\n如图 2-4 所示，智能客户端连接到一个 Couchbase 服务器实例，并首先将文档异步写入托管缓存。客户端会立即得到响应，不会被阻塞直到数据流处理结束，但可以在客户端层面更改此行为，使客户端等待写入完成。然后，文档被放入集群间写入队列，以便在集群中复制；之后，文档被放入磁盘存储写入队列，以持久化到相关节点磁盘上。如果部署了多个集群，则可以使用跨数据中心复制（XDCR）功能将更改传播到位于不同数据中心的其它集群。\n\
    \nCouchbase 有自己查询数据的方式；实际上，你可以通过简单的文档 ID 来查询数据，但 Couchbase 的强大之处在于视图功能。在 Couchbase\
    \ 中，存在一个名为设计文档的二级索引，它在存储桶内创建。一个存储桶可以包含多种类型的文档，例如，在一个简单的电子商务应用中，一个存储桶可能包含以下内容：\n\
    \n*   账户\n*   产品\n*   购物车\n*   订单\n*   账单\n\nCouchbase 通过设计文档在逻辑上对它们进行分割。一个存储桶可以包含多个设计文档，这些文档也包含多个视图。视图是一个函数，它以用户定义的方式对存储在存储桶中的文档进行索引。该函数精确地说是一个用户定义的映射/规约（map/reduce）函数，它跨集群映射文档并输出键/值对，然后这些键/值对被存储在索引中以便进一步检索。让我们回到我们的电子商务网站示例，并尝试索引所有订单，以便我们可以通过账户标识符获取它们。映射/规约函数如下所示：\n\
    \n```\nfunction(doc, meta) {\n  if (doc.order_account_id)\n    emit(doc.order_account_id,\
    \ null);\n}\n```\n\n`if` 语句使该函数只关注包含 `order_account_id` 字段的文档，然后索引此标识符。因此，任何客户端都可以基于该标识符在\
    \ Couchbase 中查询数据。\n\n## 集群管理器与管理控制台\n\n集群管理器由集群内的一个特定节点（即协调节点）处理。任何时候，如果集群内的某个节点发生故障，协调节点将通过通知集群内所有其它节点来处理故障转移，定位故障节点的副本分区并将其提升为活动状态。图\
    \ 2-5 描述了故障转移过程。\n\n![A978-1-4842-1326-1_2_Fig5_HTML.jpg](img/A978-1-4842-1326-1_2_Fig5_HTML.jpg)\n\
    \n图 2-5. Couchbase 故障转移\n\n如果协调节点发生故障，那么所有节点都会通过心跳看门狗（一个在所有集群节点上运行的集群组件）检测到该故障。一旦检测到故障，就会在节点中选举出新的协调节点。\n\
    \n所有与集群相关的功能都通过 API 暴露，这些 API 可用于管理 Couchbase，但好消息是，系统自带了一个管理控制台。Couchbase 控制台是一个安全控制台，允许你管理和监控集群；你可以从可用的操作中进行选择，包括设置服务器、创建存储桶、浏览和更新文档、实现新视图以及监控\
    \ vBucket 和磁盘写入队列。\n\n图 2-6 展示了 Couchbase 控制台主页，其中概述了现有存储桶使用的 RAM、数据使用的磁盘以及存储桶的活动情况。\n\
    \n![A978-1-4842-1326-1_2_Fig6_HTML.jpg](img/A978-1-4842-1326-1_2_Fig6_HTML.jpg)\n\
    \n图 2-6. Couchbase 控制台主页\n\n你可以在“服务器节点”选项卡中执行集群管理，该选项卡允许用户配置故障转移和复制，以防止数据丢失。图\
    \ 2-7 显示了一个单节点安装，如警告信息所示，这对于故障转移来说是不安全的。\n\n![A978-1-4842-1326-1_2_Fig7_HTML.jpg](img/A978-1-4842-1326-1_2_Fig7_HTML.jpg)\n\
    \n图 2-7. Couchbase 服务器节点\n\n你随时可以通过点击“添加服务器”按钮来添加新的 Couchbase 服务器；当你这样做时，数据将开始在节点间复制以实现故障转移。\n\
    \n通过点击服务器 IP，你可以访问存储桶每个方面的精细监控数据，如图 2-8 所示。\n\n![A978-1-4842-1326-1_2_Fig8_HTML.jpg](img/A978-1-4842-1326-1_2_Fig8_HTML.jpg)\n\
    \n图 2-8. Couchbase 存储桶监控\n\n此图显示了一个名为 DevUser 的数据存储桶，其中包含与用户相关的 JSON 文档。如前所述，索引新文档的过程是底层复杂数据流的一部分。当你处理产生高索引吞吐量的大量数据时，监控控制台中显示的指标至关重要。例如，磁盘队列统计信息可以揭示数据写入磁盘时的瓶颈。\n\
    \n在图 2-9 中，我们可以看到排出率（即从磁盘写入队列写入磁盘的项目数）在写入副本时在活动端交替趋于平稳，并且活动项的平均年龄在该平稳期增长。另一种异常行为是看到活动项的平均年龄持续增长，这将意味着与推入写入磁盘队列的活动项数量相比，写入过程太慢。\n\
    \n![A978-1-4842-1326-1_2_Fig9_HTML.jpg](img/A978-1-4842-1326-1_2_Fig9_HTML.jpg)\n\
    \n图 2-9. Couchbase 存储桶磁盘队列\n"
- fmt: "### Managing Documents\n\nYou can manage all documents from the administration\
    \ console through the bucket view. This view allows users to browse buckets and\
    \ design documents and views. Documents are stored in a bucket in Couchbase, and\
    \ they can be accessed in the Data Bucket tab on the administration console as\
    \ shown in the Figure [2-10](#A978-1-4842-1326-1_2_Chapter.html#Fig10).\n\n![A978-1-4842-1326-1_2_Fig10_HTML.jpg](A978-1-4842-1326-1_2_Fig10_HTML.jpg)\n\
    \nFigure 2-10. Couchbase console bucket view\n\nAs in the server view, the console\
    \ gives statistics on the bucket, such as RAM and storage size, as well as the\
    \ number of operation per second. But the real benefit of this view is that you\
    \ are able to browse documents and retrieve them by ID as is shown in Figure [2-11](#A978-1-4842-1326-1_2_Chapter.html#Fig11).\n\
    \n![A978-1-4842-1326-1_2_Fig11_HTML.jpg](A978-1-4842-1326-1_2_Fig11_HTML.jpg)\n\
    \nFigure 2-11. Couchbase document by ID\n\nIt’s also in this view that you create\
    \ a design document and views to index documents for further retrieval, as shown\
    \ in Figure [2-12](#A978-1-4842-1326-1_2_Chapter.html#Fig12).\n\n![A978-1-4842-1326-1_2_Fig12_HTML.jpg](A978-1-4842-1326-1_2_Fig12_HTML.jpg)\n\
    \nFigure 2-12. Couchbase console view implementation\n\nIn Figure [2-12](#A978-1-4842-1326-1_2_Chapter.html#Fig12),\
    \ I have implemented a view that retrieves documents based on the company name.\
    \ The administration console is a handy way to manage documents, but in real life,\
    \ you can start implementing your design document in the administration console,\
    \ and you can create a backup to industrialize its deployment.\n\nAll design documents\
    \ are stored in a JSON file and a simple structure that describes all the views,\
    \ similar to what Listing [2-1](#A978-1-4842-1326-1_2_Chapter.html#FPar1) shows.\n\
    \nListing 2-1. Designing a Document JSON Example\n\n```\n[{\n    ...\n    \"doc\"\
    : {\n        \"json\": {\n            \"views\": {\n                \"by_Id\"\
    : {\"map\": \"function (doc, meta) {\\n  emit(doc.id, doc);\\n}\"},\n        \
    \        \"by_email\": {\"map\": \"function (doc, meta) {\\n  emit(doc.email,\
    \ doc);\\n}\"},\n                \"by_name\": {\"map\": \"function (doc, meta)\
    \ {\\n  emit(doc.firstname, null);\\n}\"},\n                \"by_company\": {\"\
    map\": \"function (doc, meta) {\\n  emit(doc.company, null);\\n}\"},\n       \
    \         \"by_form\": {\"map\": \"function (doc, meta) {\\n  emit(meta.id, null);\\\
    n}\"}\n            }\n        }\n        ...\n    }\n}]\n```\n\nAs you have seen,\
    \ you can perform document management through the administration console, but\
    \ keep in mind that in industrialized architecture, most of the work is done through\
    \ scripts that use the Couchbase API.\n\n## Introducing ElasticSearch\n\nYou have\
    \ seen an example of a NoSQL database with Couchbase; ElasticSearch is also a\
    \ NoSQL technology but it’s totally different than Couchbase. It’s a distributed\
    \ datastore provided by the company named Elastic (at the time I’m writing this\
    \ book, ElasticSearch is in version 2.1).\n\n### Architecture\n\nElasticSearch\
    \ is a NoSQL technology that allows you to store, search, and analyze data. It’s\
    \ an indexation/search engine made on top of Apache Lucene, an open source full-text\
    \ search engine written in Java. From the start, ElasticSearch was made to be\
    \ distributed and to scale out, which means that in addition to scaling ElasticSearch\
    \ vertically by adding more resource to a node, you can simply scale it horizontally\
    \ by adding more nodes on the fly to increase the high availability of your cluster\
    \ but also its resiliency. In the case of a node failure, because data is replicated\
    \ over the cluster, data is served by another node.\n\nElasticSearch is a schemaless\
    \ engine; data is stored in JSON and is partitioned into what we call shards.\
    \ A shard is actually a Lucene index and is the smallest unit of scale in ElasticSearch.\
    \ Shards are organized in indexes in ElasticSearch with which an application can\
    \ make read and write interactions. In the end, an index is just a logical namespace\
    \ in ElasticSearch that regroups a collection of shards, and when a request comes\
    \ in, ElasticSearch routes it to the appropriate shards as the Figure [2-13](#A978-1-4842-1326-1_2_Chapter.html#Fig13)\
    \ summarizes.\n\n![A978-1-4842-1326-1_2_Fig13_HTML.jpg](A978-1-4842-1326-1_2_Fig13_HTML.jpg)\n\
    \nFigure 2-13. Elasticsearch index and shards\n\nTwo types of shards live in ElasticSearch:\
    \ primary shards and replica shards. When you start an ElasticSearch node, you\
    \ can begin by adding only one primary shard, which might be enough, but what\
    \ if the read/index request throughput increases with time? If this is the case,\
    \ the one primary shard might not be enough anymore and you then need another\
    \ shard. You can’t add shards on the fly and expect ElasticSearch to scale; it\
    \ will have to re-index all data in the bigger index with the two new primary\
    \ shards. So, as you can see, from the beginning of a project based on ElasticSearch,\
    \ it’s important that you have a decent estimate of how many primary shards you\
    \ need in the cluster. Adding more shards in a node may not increase the capacity\
    \ of your cluster, because you are limited to the node hardware capacity. To increase\
    \ cluster capacity, you have to add more nodes that hold primary shards as well,\
    \ as is shown in Figure [2-14](#A978-1-4842-1326-1_2_Chapter.html#Fig14).\n\n\
    ![A978-1-4842-1326-1_2_Fig14_HTML.jpg](A978-1-4842-1326-1_2_Fig14_HTML.jpg)\n\n\
    Figure 2-14. ElasticSearch primary shard allocation\n\nThe good thing is that\
    \ ElasticSearch automatically copies the shard over the network on the new node\
    \ for you as described in Figure [2-14](#A978-1-4842-1326-1_2_Chapter.html#Fig14).\
    \ But what if you want to be sure that you won’t lose data? That’s where replica\
    \ shards come into play.\n\nReplica shards are made at start for failover; when\
    \ a primary shard dies, a replica is promoted to become the primary to ensure\
    \ continuity in the cluster. Replica shards have the same load that primary shards\
    \ do at index time; this means that once the document is indexed in the primary\
    \ shard, it’s indexed in the replica shards. That’s why adding more replicas to\
    \ our cluster won’t increase index performance, but still, if we add extra hardware,\
    \ it can dramatically increase search performance. In the three nodes cluster,\
    \ with two primary shards and two replica shards, we would have the repartition\
    \ shown in Figure [2-15](#A978-1-4842-1326-1_2_Chapter.html#Fig15).\n\n![A978-1-4842-1326-1_2_Fig15_HTML.jpg](A978-1-4842-1326-1_2_Fig15_HTML.jpg)\n\
    \nFigure 2-15. ElasticSearch primary and replica shards\n\nIn addition to increased\
    \ performance, this use case also helps with balancing requests and getting better\
    \ performance on the overall cluster.\n\nThe last thing to talk about in terms\
    \ of pure ElasticSearch architecture is indices, and more specifically, nodes.\
    \ Indices are regrouped into ElasticSearch nodes, and there are actually three\
    \ types of nodes as shown in Figure [2-16](#A978-1-4842-1326-1_2_Chapter.html#Fig16)."
  raw: '### Managing Documents


    You can manage all documents from the administration console through the bucket
    view. This view allows users to browse buckets and design documents and views.
    Documents are stored in a bucket in Couchbase, and they can be accessed in the
    Data Bucket tab on the administration console as shown in the Figure [2-10](#A978-1-4842-1326-1_2_Chapter.html#Fig10).


    ![A978-1-4842-1326-1_2_Fig10_HTML.jpg](A978-1-4842-1326-1_2_Fig10_HTML.jpg)


    Figure 2-10.


    Couchbase console bucket view


    As in the server view, the console gives statistics on the bucket, such as RAM
    and storage size, as well as the number of operation per second. But the real
    benefit of this view is that you are able to browse documents and retrieve them
    by ID as is shown in Figure [2-11](#A978-1-4842-1326-1_2_Chapter.html#Fig11).


    ![A978-1-4842-1326-1_2_Fig11_HTML.jpg](A978-1-4842-1326-1_2_Fig11_HTML.jpg)


    Figure 2-11.


    Couchbase document by ID


    It’s also in this view that you create a design document and views to index documents
    for further retrieval, as shown in Figure [2-12](#A978-1-4842-1326-1_2_Chapter.html#Fig12).


    ![A978-1-4842-1326-1_2_Fig12_HTML.jpg](A978-1-4842-1326-1_2_Fig12_HTML.jpg)


    Figure 2-12.


    Couchbase console view implementation


    In Figure [2-12](#A978-1-4842-1326-1_2_Chapter.html#Fig12), I have implemented
    a view that retrieves documents based on the company name. The administration
    console is a handy way to manage documents, but in real life, you can start implementing
    your design document in the administration console, and you can create a backup
    to industrialize its deployment.


    All design documents are stored in a JSON file and a simple structure that describes
    all the views, similar to what Listing [2-1](#A978-1-4842-1326-1_2_Chapter.html#FPar1)
    shows.


    Listing 2-1.Designing a Document JSON Example


    `[{`


           `...`


           `"doc": {`


                   `"json": {`


                           `"views": {`


                                   `"by_Id": {"map": "function (doc, meta) {\n  emit(doc.id,
    doc);\n}"},`


                                   `"by_email": {"map": "function (doc, meta) {\n  emit(doc.email,
    doc);\n}"},`


                                   `"by_name": {"map": "function (doc, meta) {\n  emit(doc.firstname,
    null);\n}"},`


                                   `"by_company": {"map": "function (doc, meta) {\n  emit(doc.company,
    null);\n}"},`


                                   `"by_form": {"map": "function (doc, meta) {\n  emit(meta.id,
    null);\n}"}`


                           `}`


                   `}`


                   `...`


           `}`


    `}]`


    As you have seen, you can perform document management through the administration
    console, but keep in mind that in industrialized architecture, most of the work
    is done through scripts that use the Couchbase API.


    ## Introducing ElasticSearch


    You have seen an example of a NoSQL database with Couchbase; ElasticSearch is
    also a NoSQL technology but it’s totally different than Couchbase. It’s a distributed
    datastore provided by the company named Elastic (at the time I’m writing this
    book, ElasticSearch is in version 2.1).


    ### Architecture


    ElasticSearch is a NoSQL technology that allows you to store, search, and analyze
    data. It’s an indexation/search engine made on top of Apache Lucene, an open source
    full-text search engine written in Java. From the start, ElasticSearch was made
    to be distributed and to scale out, which means that in addition to scaling ElasticSearch
    vertically by adding more resource to a node, you can simply scale it horizontally
    by adding more nodes on the fly to increase the high availability of your cluster
    but also its resiliency. In the case of a node failure, because data is replicated
    over the cluster, data is served by another node.


    ElasticSearch is a schemaless engine; data is stored in JSON and is partitioned
    into what we call shards. A shard is actually a Lucene index and is the smallest
    unit of scale in ElasticSearch. Shards are organized in indexes in ElasticSearch
    with which an application can make read and write interactions. In the end, an
    index is just a logical namespace in ElasticSearch that regroups a collection
    of shards, and when a request comes in, ElasticSearch routes it to the appropriate
    shards as the Figure [2-13](#A978-1-4842-1326-1_2_Chapter.html#Fig13) summarizes.


    ![A978-1-4842-1326-1_2_Fig13_HTML.jpg](A978-1-4842-1326-1_2_Fig13_HTML.jpg)


    Figure 2-13.


    Elasticsearch index and shards


    Two types of shards live in ElasticSearch: primary shards and replica shards.
    When you start an ElasticSearch node, you can begin by adding only one primary
    shard, which might be enough, but what if the read/index request throughput increases
    with time? If this is the case, the one primary shard might not be enough anymore
    and you then need another shard. You can’t add shards on the fly and expect ElasticSearch
    to scale; it will have to re-index all data in the bigger index with the two new
    primary shards. So, as you can see, from the beginning of a project based on ElasticSearch,
    it’s important that you have a decent estimate of how many primary shards you
    need in the cluster. Adding more shards in a node may not increase the capacity
    of your cluster, because you are limited to the node hardware capacity. To increase
    cluster capacity, you have to add more nodes that hold primary shards as well,
    as is shown in Figure [2-14](#A978-1-4842-1326-1_2_Chapter.html#Fig14).


    ![A978-1-4842-1326-1_2_Fig14_HTML.jpg](A978-1-4842-1326-1_2_Fig14_HTML.jpg)


    Figure 2-14.


    ElasticSearch primary shard allocation


    The good thing is that ElasticSearch automatically copies the shard over the network
    on the new node for you as described in Figure [2-14](#A978-1-4842-1326-1_2_Chapter.html#Fig14).
    But what if you want to be sure that you won’t lose data? That’s where replica
    shards come into play.


    Replica shards are made at start for failover; when a primary shard dies, a replica
    is promoted to become the primary to ensure continuity in the cluster. Replica
    shards have the same load that primary shards do at index time; this means that
    once the document is indexed in the primary shard, it’s indexed in the replica
    shards. That’s why adding more replicas to our cluster won’t increase index performance,
    but still, if we add extra hardware, it can dramatically increase search performance.
    In the three nodes cluster, with two primary shards and two replica shards, we
    would have the repartition shown in Figure [2-15](#A978-1-4842-1326-1_2_Chapter.html#Fig15).


    ![A978-1-4842-1326-1_2_Fig15_HTML.jpg](A978-1-4842-1326-1_2_Fig15_HTML.jpg)


    Figure 2-15.


    ElasticSearch primary and replica shards


    In addition to increased performance, this use case also helps with balancing
    requests and getting better performance on the overall cluster.


    The last thing to talk about in terms of pure ElasticSearch architecture is indices,
    and more specifically, nodes. Indices are regrouped into ElasticSearch nodes,
    and there are actually three types of nodes as shown in Figure [2-16](#A978-1-4842-1326-1_2_Chapter.html#Fig16).'
  trans: "\n### 管理文档\n\n您可以通过管理控制台的存储桶视图来管理所有文档。该视图允许用户浏览存储桶、设计文档和视图。文档存储在 Couchbase\
    \ 的存储桶中，并可在管理控制台的“数据存储桶”选项卡中访问，如图 2-10 所示。\n\n![A978-1-4842-1326-1_2_Fig10_HTML.jpg](img/A978-1-4842-1326-1_2_Fig10_HTML.jpg)\n\
    \n图 2-10. Couchbase 控制台存储桶视图\n\n与服务器视图类似，控制台会显示存储桶的统计信息，例如内存和存储大小，以及每秒操作数。但此视图的真正优势在于，您可以浏览文档并按\
    \ ID 检索它们，如图 2-11 所示。\n\n![A978-1-4842-1326-1_2_Fig11_HTML.jpg](img/A978-1-4842-1326-1_2_Fig11_HTML.jpg)\n\
    \n图 2-11. 按 ID 查询的 Couchbase 文档\n\n同样在此视图中，您可以创建设计文档和视图来索引文档以供进一步检索，如图 2-12 所示。\n\
    \n![A978-1-4842-1326-1_2_Fig12_HTML.jpg](img/A978-1-4842-1326-1_2_Fig12_HTML.jpg)\n\
    \n图 2-12. Couchbase 控制台视图实现\n\n在图 2-12 中，我实现了一个根据公司名称检索文档的视图。管理控制台是管理文档的便捷方式，但在实际应用中，您可以从管理控制台开始实施您的设计文档，然后创建一个备份以实现其部署的工业化。\n\
    \n所有设计文档都存储在一个 JSON 文件中，该文件具有描述所有视图的简单结构，类似于代码清单 2-1 所示。\n\n代码清单 2-1. 设计文档 JSON\
    \ 示例\n\n```\n[{\n    ...\n    \"doc\": {\n        \"json\": {\n            \"\
    views\": {\n                \"by_Id\": {\"map\": \"function (doc, meta) {\\n \
    \ emit(doc.id, doc);\\n}\"},\n                \"by_email\": {\"map\": \"function\
    \ (doc, meta) {\\n  emit(doc.email, doc);\\n}\"},\n                \"by_name\"\
    : {\"map\": \"function (doc, meta) {\\n  emit(doc.firstname, null);\\n}\"},\n\
    \                \"by_company\": {\"map\": \"function (doc, meta) {\\n  emit(doc.company,\
    \ null);\\n}\"},\n                \"by_form\": {\"map\": \"function (doc, meta)\
    \ {\\n  emit(meta.id, null);\\n}\"}\n            }\n        }\n        ...\n \
    \   }\n}]\n```\n\n如您所见，您可以通过管理控制台执行文档管理，但请记住，在工业化架构中，大部分工作是通过使用 Couchbase API\
    \ 的脚本完成的。\n\n## 介绍 ElasticSearch\n\n您已经看到了一个使用 Couchbase 的 NoSQL 数据库示例；ElasticSearch\
    \ 也是一种 NoSQL 技术，但它与 Couchbase 完全不同。它是由名为 Elastic 的公司提供的分布式数据存储（在撰写本书时，ElasticSearch\
    \ 的版本是 2.1）。\n\n### 架构\n\nElasticSearch 是一种 NoSQL 技术，允许您存储、搜索和分析数据。它是一个基于 Apache\
    \ Lucene 构建的索引/搜索引擎，Apache Lucene 是一个用 Java 编写的开源全文搜索引擎。从一开始，ElasticSearch 就被设计为分布式和可横向扩展的，这意味着除了通过向节点添加更多资源来进行垂直扩展外，您还可以通过动态添加更多节点来进行水平扩展，以提高集群的高可用性和弹性。如果某个节点发生故障，由于数据在集群中进行了复制，数据将由另一个节点提供服务。\n\
    \nElasticSearch 是一个无模式引擎；数据以 JSON 格式存储，并分区为我们称之为分片（shards）的单元。分片实际上是一个 Lucene\
    \ 索引，是 ElasticSearch 中最小的扩展单元。在 ElasticSearch 中，分片组织成索引（indexes），应用程序可以通过索引进行读写交互。最终，索引只是\
    \ ElasticSearch 中的一个逻辑命名空间，它将一组分片重新组合在一起，当请求到来时，ElasticSearch 会将其路由到适当的分片，如图 2-13\
    \ 所示。\n\n![A978-1-4842-1326-1_2_Fig13_HTML.jpg](img/A978-1-4842-1326-1_2_Fig13_HTML.jpg)\n\
    \n图 2-13. Elasticsearch 索引与分片\n\nElasticSearch 中存在两种类型的分片：主分片（primary shards）和副本分片（replica\
    \ shards）。当您启动一个 ElasticSearch 节点时，您可以先只添加一个主分片，这可能就足够了。但是，如果随着时间推移，读取/索引请求吞吐量增加怎么办？如果是这种情况，单个主分片可能不再够用，您就需要另一个分片。您无法动态添加分片并期望\
    \ ElasticSearch 自动扩展；它必须使用两个新的主分片在更大的索引中对所有数据重新建立索引。因此，如您所见，在基于 ElasticSearch\
    \ 的项目开始时，对集群中需要多少主分片有一个合理的估计非常重要。在节点中添加更多分片可能不会增加集群的容量，因为您受到节点硬件容量的限制。要增加集群容量，您必须添加更多也持有主分片的节点，如图\
    \ 2-14 所示。\n\n![A978-1-4842-1326-1_2_Fig14_HTML.jpg](img/A978-1-4842-1326-1_2_Fig14_HTML.jpg)\n\
    \n图 2-14. ElasticSearch 主分片分配\n\n好处在于，ElasticSearch 会自动通过网络将分片复制到新节点上，如图 2-14\
    \ 所述。但是，如果您想确保不会丢失数据怎么办？这时副本分片就派上用场了。\n\n副本分片最初是为了故障转移而创建的；当主分片宕机时，副本会提升为主分片以确保集群的连续性。副本分片在索引时具有与主分片相同的负载；这意味着一旦文档在主分片中被索引，它也会在副本分片中被索引。这就是为什么向集群添加更多副本不会提高索引性能，但如果添加额外的硬件，仍然可以显著提高搜索性能。在拥有两个主分片和两个副本分片的三节点集群中，我们将得到如图\
    \ 2-15 所示的分区情况。\n\n![A978-1-4842-1326-1_2_Fig15_HTML.jpg](img/A978-1-4842-1326-1_2_Fig15_HTML.jpg)\n\
    \n图 2-15. ElasticSearch 主分片与副本分片\n\n除了提高性能之外，这种用例还有助于平衡请求，并在整个集群上获得更好的性能。\n\n\
    关于纯粹的 ElasticSearch 架构，最后要讨论的是索引，更具体地说是节点。索引被分组到 ElasticSearch 节点中，实际上有三种类型的节点，如图\
    \ 2-16 所示。\n"
- fmt: "![A978-1-4842-1326-1_2_Fig16_HTML.jpg](A978-1-4842-1326-1_2_Fig16_HTML.jpg)\n\
    \nFigure 2-16. ElasticSearch cluster topology\n\nHere are descriptions of the\
    \ three types of node:\n\n- **Master nodes**: These nodes are lightweight and\
    \ responsible for cluster management. It means they don’t hold any data, server\
    \ indices, or search requests. They are dedicated to ensure cluster stability\
    \ and have a low workload. It’s recommended that you have three dedicated master\
    \ nodes to be sure that if one fails, redundancy will be guaranteed.\n- **Data\
    \ nodes**: These nodes hold the data and serve index and search requests.\n- **Client\
    \ nodes**: These ensure load balancing in some processing steps and can take on\
    \ part of the workload that a data node can perform, such as in a search request\
    \ where scattering the request over the nodes and gathering the output for responses\
    \ can be really heavy at runtime.\n\nNow that you understand the architecture\
    \ of ElasticSearch, let’s play with the search API and run some queries.\n\n###\
    \ Monitoring ElasticSearch\n\nElastic provides a plug-in called Marvel for ElasticSearch\
    \ that aims to monitor an ElasticSearch cluster. This plug-in is part of Elastic’s\
    \ commercial offer, but you can use it for free in Development mode.\n\nYou can\
    \ download Marvel from the following link; the installation process is quite simple:\n\
    \n[`https://www.elastic.co/downloads/marvel`](https://www.elastic.co/downloads/marvel)\n\
    \nMarvel relies on Kibana, the visualization console of Elastic, and comes with\
    \ a bunch of visualization techniques that let an operator be really precise about\
    \ what happens in the cluster. Figure 2-17 shows the overview dashboard that you\
    \ see when launching Marvel.\n\n![A978-1-4842-1326-1_2_Fig17_HTML.jpg](A978-1-4842-1326-1_2_Fig17_HTML.jpg)\n\
    \nFigure 2-17. ElasticSearch Marvel console\n\nMarvel provides information on\
    \ nodes, indices, and shards; about the CPU used; about the memory used by the\
    \ JVM; about the indexation rate, and about the search rate. Marvel even goes\
    \ down to the Lucene level by providing information about flushes and merges.\
    \ You can, for example, have a live view of the shard allocation on the cluster,\
    \ as shown in Figure 2-18.\n\n![A978-1-4842-1326-1_2_Fig18_HTML.jpg](A978-1-4842-1326-1_2_Fig18_HTML.jpg)\n\
    \nFigure 2-18. Marvel’s shard allocation view\n\nTo give you an idea of the amount\
    \ of information that Marvel can provide you with about your cluster, Figure 2-19\
    \ shows a subset of what you get in the Node Statistics dashboard.\n\n![A978-1-4842-1326-1_2_Fig19_HTML.jpg](A978-1-4842-1326-1_2_Fig19_HTML.jpg)\n\
    \nFigure 2-19. Marvel Node Statistics dashboard\n\nAs you can see, the dashboard\
    \ is organized in several rows; in fact, there are more than 20 rows that you\
    \ just can’t see in this screenshot. Each row contains one or visualization about\
    \ the row topic. In Figure 2-19, you can see that no `GET` requests are sent to\
    \ indices; that’s why the line chart is flat on 0.\n\nDuring the development mode,\
    \ these statistics will help you scale your server by, for example, starting with\
    \ a single node cluster and seeing the behavior based on your specific needs.\
    \ Then in production mode, you are able to follow the life inside your cluster\
    \ without losing any information about it.\n\n### Search with ElasticSearch\n\n\
    Marvel comes with a feature called Sense that is a query editor/helper for ElasticSearch.\
    \ The real power of Sense is its ability to autocomplete your query, which helps\
    \ a lot when you are not familiar with all ElasticSearch APIs, as shown in Figure\
    \ 2-20.\n\n![A978-1-4842-1326-1_2_Fig20_HTML.jpg](A978-1-4842-1326-1_2_Fig20_HTML.jpg)\n\
    \nFigure 2-20. Marvel Sense completion feature\n\nYou can also export your query\
    \ to cURLs, for example, so you can use it in a script as show in Figure 2-21.\n\
    \n![A978-1-4842-1326-1_2_Fig21_HTML.jpg](A978-1-4842-1326-1_2_Fig21_HTML.jpg)\n\
    \nFigure 2-21. Marvel Sense copy as cURL feature\n\nIn this case, the query would\
    \ give a cURL command, as show in Listing 2-3.\n\n**Listing 2-3.** Example of\
    \ cURL Command Generated by Sense\n\n```\ncurl -XGET \"http://192.168.59.103:9200/yahoo/_search\"\
    \ -d'\n{\n  \"query\": {\n    \"match_all\": {}\n  }\n}'\n```\n\nThis query basically\
    \ searches for all documents under the Yahoo index. To demonstrate the benefit\
    \ of the search API, I’m using a dataset from Yahoo that contains the prices of\
    \ Yahoo stock since couple of years. One of the key features in ElasticSearch’s\
    \ search API is the aggregation framework. You can aggregate data in a different\
    \ way; the most common way is through a date histogram, which is equivalent to\
    \ a timeline. An example of the query is illustrated in Figure 2-22; this aggregates\
    \ the stock data by date, with an interval that corresponds to a month and also\
    \ calculates the max value of the stock for the given month.\n\n![A978-1-4842-1326-1_2_Fig22_HTML.jpg](A978-1-4842-1326-1_2_Fig22_HTML.jpg)\n\
    \nFigure 2-22. Marvel Sense Aggregation example\n\nAs a result, we get a document\
    \ with an array where each item contains the date, the number of the document\
    \ found in the month period, and the highest value, as shown in Listing 2-4.\n\
    \n**Listing 2-4.** Aggregation Bucket\n\n```\n{\n        \"key_as_string\": \"\
    2015-01-01T00:00:00.000Z\",\n        \"key\": 1420070400000,\n        \"doc_count\"\
    : 20,\n        \"by_high_value\": {\n               \"value\": 120\n         }\n\
    }\n```\n\nAs you can see in the query in Figure 2-22, there are two levels of\
    \ aggregation: the first is for the date histogram, and the second is for the\
    \ max value. Indeed, ElasticSearch supports multiple levels of aggregation as\
    \ long as it make sense from a query point of view.\n\nThe search API is really\
    \ rich, and we can’t browse all features one by one in this book, but you get\
    \ an introduction to its capabilities and get more information about it on the\
    \ following documentation link:\n\n[`https://www.elastic.co/guide/en/elasticsearch/reference/1.4/search-search.html`](https://www.elastic.co/guide/en/elasticsearch/reference/1.4/search-search.html)\n\
    \nNow that you are familiar with our two NoSQL technologies, let’s see a different\
    \ approach to integrating them in an e-commerce application.\n\n## Using NoSQL\
    \ as a Cache in a SQL-based Architecture\n\nAt this point, you should understand\
    \ the benefit of working with a NoSQL technology when compared to a SQL database.\
    \ But we don’t want to break an existing architecture that is relying on a SQL\
    \ database. In the following approach, we’ll see how we can complete our architecture\
    \ so we add more flexibility for accessing data based on a NoSQL technology."
  raw: '![A978-1-4842-1326-1_2_Fig16_HTML.jpg](A978-1-4842-1326-1_2_Fig16_HTML.jpg)


    Figure 2-16.


    ElasticSearch cluster topology


    Here are descriptions of the three types of node:


    *   Master nodes : These nodes are lightweight and responsible for cluster management.
    It means they don’t hold any data, server indices, or search requests. They are
    dedicated to ensure cluster stability and have a low workload. It’s recommended
    that you have three dedicated master nodes to be sure that if one fails, redundancy
    will be guaranteed.

    *   Data nodes : These nodes hold the data and serve index and search requests.

    *   Client nodes : These ensure load balancing in some processing steps and can
    take on part of the workload that a data node can perform, such as in a search
    request where scattering the request over the nodes and gathering the output for
    responses can be really heavy at runtime.


    Now that :you understand the architecture of ElasticSearch, let’s play with the
    search API and run some queries.


    ### Monitoring ElasticSearch


    Elastic provides a plug-in called Marvel for ElasticSearch that aims to monitor
    an ElasticSearch cluster. This plug-in is part of Elastic’s commercial offer,
    but you can use it for free in Development mode.


    You can download Marvel from the following link; the installation process is quite
    simple:


    [`https://www.elastic.co/downloads/marvel`](https://www.elastic.co/downloads/marvel)


    Marvel relies on Kibana, the visualization console of Elastic, and comes with
    a bunch of visualization techniques that let an operator be really precise about
    what happens in the cluster. Figure [2-17](#A978-1-4842-1326-1_2_Chapter.html#Fig17)
    shows the overview dashboard that you see when launching Marvel.


    ![A978-1-4842-1326-1_2_Fig17_HTML.jpg](A978-1-4842-1326-1_2_Fig17_HTML.jpg)


    Figure 2-17.


    ElasticSearch Marvel console


    Marvel provides information on nodes, indices, and shards; about the CPU used;
    about the memory used by the JVM; about the indexation rate, and about the search
    rate. Marvel even goes down to the Lucene level by providing information about
    flushes and merges. You can, for example, have a live view of the shard allocation
    on the cluster, as shown in Figure [2-18](#A978-1-4842-1326-1_2_Chapter.html#Fig18).


    ![A978-1-4842-1326-1_2_Fig18_HTML.jpg](A978-1-4842-1326-1_2_Fig18_HTML.jpg)


    Figure 2-18.


    Marvel’s shard allocation view


    To give you an idea of the amount of information that Marvel can provide you with
    about your cluster, Figure [2-19](#A978-1-4842-1326-1_2_Chapter.html#Fig19) shows
    a subset of what you get in the Node Statistics dashboard.


    ![A978-1-4842-1326-1_2_Fig19_HTML.jpg](A978-1-4842-1326-1_2_Fig19_HTML.jpg)


    Figure 2-19.


    Marvel Node Statistics dashboard


    As you can see, the dashboard is organized in several rows; in fact, there are
    more than 20 rows that you just can’t see in this screenshot. Each row contains
    one or visualization about the row topic. In Figure [2-19](#A978-1-4842-1326-1_2_Chapter.html#Fig19),
    you can see that no `GET` requests are sent to indices; that’s why the line chart
    is flat on 0.


    During the development mode, these statistics will help you scale your server
    by, for example, starting with a single node cluster and seeing the behavior based
    on your specific needs. Then in production mode, you are able to follow the life
    inside your cluster without losing any information about it.


    ### Search with ElasticSearch


    Marvel comes with a feature called Sense that is a query editor/helper for ElasticSearch.
    The real power of Sense is its ability to autocomplete your query, which helps
    a lot when you are not familiar with all ElasticSearch APIs, as shown in Figure
    [2-20](#A978-1-4842-1326-1_2_Chapter.html#Fig20).


    ![A978-1-4842-1326-1_2_Fig20_HTML.jpg](A978-1-4842-1326-1_2_Fig20_HTML.jpg)


    Figure 2-20.


    Marvel Sense completion feature


    You can also export your query to cURLs, for example, so you can use it in a script
    as show in Figure [2-21](#A978-1-4842-1326-1_2_Chapter.html#Fig21).


    ![A978-1-4842-1326-1_2_Fig21_HTML.jpg](A978-1-4842-1326-1_2_Fig21_HTML.jpg)


    Figure 2-21.


    Marvel Sense copy as cURL feature


    In this case, the query would give a cURL command, as show in Listing [2-3](#A978-1-4842-1326-1_2_Chapter.html#FPar2).


    Listing 2-3.Example of cURL Command Generated by Sense


    `curl -XGET "` `http://192.168.59.103:9200/yahoo/_search` `" -d''`


    `{`


      `"query": {`


        `"match_all": {}`


      `}`


    `}''`


    This query basically searches for all documents under the Yahoo index. To demonstrate
    the benefit of the search API, I’m using a dataset from Yahoo that contains the
    prices of Yahoo stock since couple of years. One of the key features in ElasticSearch’s
    search API is the aggregation framework. You can aggregate data in a different
    way; the most common way is through a date histogram, which is equivalent to a
    timeline. An example of the query is illustrated in Figure [2-22](#A978-1-4842-1326-1_2_Chapter.html#Fig22);
    this aggregates the stock data by date, with an interval that corresponds to a
    month and also calculates the max value of the stock for the given month.


    ![A978-1-4842-1326-1_2_Fig22_HTML.jpg](A978-1-4842-1326-1_2_Fig22_HTML.jpg)


    Figure 2-22.


    Marvel Sense Aggregation example


    As a result, we get a document with an array where each item contains the date,
    the number of the document found in the month period, and the highest value, as
    shown in Listing [2-4](#A978-1-4842-1326-1_2_Chapter.html#FPar3).


    Listing 2-4.Aggregation Bucket


    `{`


            `"key_as_string": "2015-01-01T00:00:00.000Z",`


            `"key": 1420070400000,`


            `"doc_count": 20,`


            `"by_high_value": {`


                   `"value": 120`


             `}`


    `}`


    As you can see in the query in Figure [2-22](#A978-1-4842-1326-1_2_Chapter.html#Fig22),
    there are two levels of aggregation: the first is for the date histogram, and
    the second is for the max value. Indeed, ElasticSearch supports multiple levels
    of aggregation as long as it make sense from a query point of view.


    The search API is really rich, and we can’t browse all features one by one in
    this book, but you get an introduction to its capabilities and get more information
    about it on the following documentation link:


    [`https://www.elastic.co/guide/en/elasticsearch/reference/1.4/search-search.html`](https://www.elastic.co/guide/en/elasticsearch/reference/1.4/search-search.html)


    Now that you are familiar with our two NoSQL technologies, let’s see a different
    approach to integrating them in an e-commerce application.


    ## Using NoSQL as a Cache in a SQL-based Architecture


    At this point, you should understand the benefit of working with a NoSQL technology
    when compared to a SQL database. But we don’t want to break an existing architecture
    that is relying on a SQL database. In the following approach, we’ll see how we
    can complete our architecture so we add more flexibility for accessing data based
    on a NoSQL technology.'
  trans: "\n![A978-1-4842-1326-1_2_Fig16_HTML.jpg](img/A978-1-4842-1326-1_2_Fig16_HTML.jpg)\n\
    \n图 2-16. ElasticSearch 集群拓扑\n\n以下是这三种类型节点的描述：\n\n- **主节点**：此类节点是轻量级的，负责集群管理。这意味着它们不存储任何数据、不提供索引服务，也不处理搜索请求。它们专用于确保集群稳定性，且工作负载较低。建议配置三个专用主节点，以确保当一个节点发生故障时，冗余机制能保障集群正常运行。\n\
    - **数据节点**：此类节点存储数据，并提供索引和搜索请求服务。\n- **客户端节点**：此类节点在某些处理步骤中确保负载均衡，并可以承担数据节点能执行的部分工作负载。例如，在搜索请求中，将请求分发到各个节点并收集输出以生成响应，这一过程在运行时可能非常繁重。\n\
    \n现在你已经了解了 ElasticSearch 的架构，让我们使用搜索 API 进行一些查询操作。\n\n### 监控 ElasticSearch\n\n\
    Elastic 为 ElasticSearch 提供了一个名为 Marvel 的插件，旨在监控 ElasticSearch 集群。该插件是 Elastic\
    \ 商业产品的一部分，但可以在开发模式下免费使用。\n\n你可以通过以下链接下载 Marvel，安装过程非常简单：\n\n[`https://www.elastic.co/downloads/marvel`](https://www.elastic.co/downloads/marvel)\n\
    \nMarvel 依赖于 Elastic 的可视化控制台 Kibana，并附带了一系列可视化技术，使操作员能够非常精确地了解集群中发生的情况。图 2-17\
    \ 显示了启动 Marvel 时看到的概览仪表盘。\n\n![A978-1-4842-1326-1_2_Fig17_HTML.jpg](img/A978-1-4842-1326-1_2_Fig17_HTML.jpg)\n\
    \n图 2-17. ElasticSearch Marvel 控制台\n\nMarvel 提供了关于节点、索引和分片的信息；关于 CPU 使用情况；关于 JVM\
    \ 的内存使用情况；关于索引速率以及搜索速率的信息。Marvel 甚至深入到 Lucene 层面，提供关于刷新（flush）和合并（merge）的信息。例如，你可以实时查看集群上的分片分配情况，如图\
    \ 2-18 所示。\n\n![A978-1-4842-1326-1_2_Fig18_HTML.jpg](img/A978-1-4842-1326-1_2_Fig18_HTML.jpg)\n\
    \n图 2-18. Marvel 的分片分配视图\n\n为了让你了解 Marvel 能提供关于集群的巨量信息，图 2-19 展示了“节点统计”仪表盘中你能看到的部分信息。\n\
    \n![A978-1-4842-1326-1_2_Fig19_HTML.jpg](img/A978-1-4842-1326-1_2_Fig19_HTML.jpg)\n\
    \n图 2-19. Marvel 节点统计仪表盘\n\n如你所见，仪表盘按多行组织；事实上，在这个截图中你无法看到全部超过 20 行的内容。每行包含一个或多个关于该行主题的可视化信息。在图\
    \ 2-19 中，你可以看到没有向索引发送任何 `GET` 请求；这就是折线图在 0 处持平的原因。\n\n在开发模式下，这些统计数据将帮助你扩展服务器，例如，从一个单节点集群开始，根据你的特定需求观察其行为。然后在生产模式下，你能够跟踪集群内部的运行状况，而不会丢失任何相关信息。\n\
    \n### 使用 ElasticSearch 进行搜索\n\nMarvel 附带了一个名为 Sense 的功能，这是一个用于 ElasticSearch 的查询编辑器/助手。Sense\
    \ 的真正强大之处在于其自动完成查询的能力，当你对所有的 ElasticSearch API 不熟悉时，这一点非常有帮助，如图 2-20 所示。\n\n![A978-1-4842-1326-1_2_Fig20_HTML.jpg](img/A978-1-4842-1326-1_2_Fig20_HTML.jpg)\n\
    \n图 2-20. Marvel Sense 自动完成功能\n\n例如，你还可以将查询导出为 cURL 格式，以便在脚本中使用，如图 2-21 所示。\n\n\
    ![A978-1-4842-1326-1_2_Fig21_HTML.jpg](img/A978-1-4842-1326-1_2_Fig21_HTML.jpg)\n\
    \n图 2-21. Marvel Sense 复制为 cURL 功能\n\n在这种情况下，该查询将生成一个 cURL 命令，如代码清单 2-3 所示。\n\n\
    **代码清单 2-3.** Sense 生成的 cURL 命令示例\n\n```\ncurl -XGET \"http://192.168.59.103:9200/yahoo/_search\"\
    \ -d'\n{\n  \"query\": {\n    \"match_all\": {}\n  }\n}'\n```\n\n这个查询基本上是在搜索“yahoo”索引下的所有文档。为了演示搜索\
    \ API 的好处，我使用了一个来自 Yahoo 的数据集，其中包含过去几年雅虎股票的价格。ElasticSearch 搜索 API 的关键特性之一是聚合框架。你可以以不同的方式聚合数据；最常见的方式是通过日期直方图，它相当于一个时间线。图\
    \ 2-22 展示了一个查询示例；该查询按日期聚合股票数据，时间间隔为一个月，并计算该月的股票最大值。\n\n![A978-1-4842-1326-1_2_Fig22_HTML.jpg](img/A978-1-4842-1326-1_2_Fig22_HTML.jpg)\n\
    \n图 2-22. Marvel Sense 聚合示例\n\n作为结果，我们得到一个包含数组的文档，其中每个项目包含日期、该月期间找到的文档数量以及最高值，如代码清单\
    \ 2-4 所示。\n\n**代码清单 2-4.** 聚合桶\n\n```\n{\n        \"key_as_string\": \"2015-01-01T00:00:00.000Z\"\
    ,\n        \"key\": 1420070400000,\n        \"doc_count\": 20,\n        \"by_high_value\"\
    : {\n               \"value\": 120\n         }\n}\n```\n\n正如你在图 2-22 的查询中看到的，这里有两层聚合：第一层是日期直方图，第二层是最大值。确实，只要从查询角度来看有意义，ElasticSearch\
    \ 支持多层聚合。\n\n搜索 API 功能非常丰富，我们无法在本书中逐一浏览所有特性，但你已经对其能力有了初步了解。你可以通过以下文档链接获取更多信息：\n\
    \n[`https://www.elastic.co/guide/en/elasticsearch/reference/1.4/search-search.html`](https://www.elastic.co/guide/en/elasticsearch/reference/1.4/search-search.html)\n\
    \n现在你已经熟悉了我们的两种 NoSQL 技术，让我们看看将它们集成到电子商务应用程序中的一种不同方法。\n\n## 在基于 SQL 的架构中将 NoSQL\
    \ 用作缓存\n\n至此，你应该理解与 SQL 数据库相比，使用 NoSQL 技术的好处。但我们不希望破坏现有基于 SQL 数据库的架构。在接下来的方法中，我们将看到如何完善我们的架构，以便基于\
    \ NoSQL 技术为数据访问增加更多的灵活性。\n"
- fmt: '### Caching Document


    The first thing we need to discuss is how to replicate our data transactionally
    in our NoSQL backend. What we want is for each time data is written in a SQL database,
    a document to be created, updated, and enriched in our NoSQL backend. The document
    can be created because it doesn’t already exist, or a field can be updated, or
    it can be enriched with a subdocument that corresponds to a table relation in
    our RDBMS. In terms of accessing the document, whenever an API `GET` request is
    made, the underlying implementation should first look in the NoSQL backend and
    return the document if it’s there.


    But what if the document is not present? Then a cache miss event should be triggered
    and sent to the NoSQL manager implementation to rebuild the document from RDBMS.
    Sounds great! But what if the insert transaction fails at the SQL level? The framework
    should be transactional and only trigger a document build if the transaction has
    been committed in SQL.


    Figure [2-23](#A978-1-4842-1326-1_2_Chapter.html#Fig23) summarizes the mechanism.


    ![A978-1-4842-1326-1_2_Fig23_HTML.jpg](A978-1-4842-1326-1_2_Fig23_HTML.jpg)


    Figure 2-23. Caching a document in NoSQL


    Here is a description of what’s going on in Figure [2-23](#A978-1-4842-1326-1_2_Chapter.html#Fig23):


    - The first diagram shows how an account is created in RDBMS and then how a document
    representing the whole account is created in NoSQL.

    - The second diagram shows how the API gets an account through the NoSQL store.

    - The third diagram shows an example of a cache miss, when the document is not
    present in NoSQL and has to be re-created from the RDBMS.


    We are actually building a cache for our web application based on NoSQL. This
    approach relies on the flexibility to access a whole document in NoSQL without
    the burden of asking to SQL database, and also the flexibility to leverage the
    distributed aspect of NoSQL. With this approach, we can imagine scaling our cluster
    as the request rate grows and reducing the demand on our SQL database.


    ### ElasticSearch Plug-in for Couchbase with Couchbase XDCR


    To achieve such a caching mechanism, we need to choose a NoSQL technology. My
    first approach was to use Couchbase alone, but as you have already seen, the search
    features in Couchbase are not really handy.


    Dealing with the map/reduce function to index data is not trivial, specifically
    when it comes to making a simple aggregation. Couchbase is a fantastic NoSQL database,
    but implementing a search is a great pain.


    Instead, you can use the Couchbase/ElasticSearch integration plug-in, which basically
    replicates all the data using the Cross Data Center Replication (XDCR) feature
    to our ElasticSearch cluster ( [`www.couchbase.com/jp/couchbase-server/connectors/elasticsearch`](http://www.couchbase.com/jp/couchbase-server/connectors/elasticsearch)
    ).


    This way, you can add a `Search Manager` class to your API that implements an
    ElasticSearch search API to retrieve the data.


    But still, this causes a lot of overhead for just being able to fetch a document
    from NoSQL instead of our RDBMS. In terms of operational tasks, this makes it
    so you have three different technologies to maintain: RDBMS, Couchbase, and ElasticSearch.


    ### ElasticSearch Only


    Why should we keep using Couchbase, when these are the following are things we
    need?


    - The ability to index an entire object, such as an account from SQL to NoSQL

    - The ability to conduct simple to complex searches involving aggregation through
    a flexible search API.


    In our specific use case, you could have chosen to start with Couchbase because
    it’s a NoSQL database and, as you know from learned best practices, documents
    should be stored in a database. When experiencing such an architecture, you learn
    that what you really need is the most efficient way to access and request your
    data, and in our case, ElasticSearch is most efficient way.


    ## Summary


    At this point, you have seen how NoSQL technologies such as Couchbase or ElasticSearch
    can bring flexibility to an existing RDBMS-based application.


    Also, you have seen that two technologies that are perceived as similar from a
    high-level point of view can be fundamentally different.


    In the next chapter, you learn how to deal with a processing topology.


    # 3. Defining the Processing Topology


    In the previous chapter, I explained how to use a NoSQL technology in the architecture
    that you’re building in this book. The NoSQL technology provides some caching
    and searching features to the application, but since you want to process data,
    you need to define an approach to handle various streams of data so you can deliver
    insights to your users or data services to your applications.


    This chapter will explain how to define the processing topology by walking you
    through a data architecture that is commonly used in IT organizations. Then you’ll
    see why splitting is something that comes naturally when respecting service level
    agreements (SLAs). Finally, I’ll discuss a specific kind of architecture, the
    lambda architecture, which is a combination of different types of architectures.


    ## First Approach to Data Architecture


    This section describes the first step of deploying a data architecture using common
    technologies from the Big Data space.


    ### A Little Bit of Background


    A lot of IT organizations are evolving their data architecture today because they
    are relying on what you could call traditional data architectures. Dealing with
    multiple data sources is not new at all; these architectures are connected to
    a multitude of sources such as CRM systems, file systems, and legacy systems.
    They are mainly running on top of relational databases such as Oracle, DB2, or
    Microsoft SQL.


    Today, the usual data analytics cycle is to run some periodic processes that extract
    and process data directly from the databases. That is mainly done today by extract,
    transform, and load (ETL) tools such as Informatica or Talend. The goal is to
    load the digested data into a data warehouse for further analytics.


    Unfortunately, this way of handling data isn’t inline with the business needs
    at the end of the cycle. These data pipelines can take hours, days, and sometimes
    weeks to complete, but business decisions need to be made now.


    Besides the processing time, there are some fundamental changes in the nature
    of data that can’t be handled easily by these architectures, such as a data structure
    that forces the data modeling to be refactored or even a data volume that leads
    to scalability considerations. Scaling those systems isn’t easy because I’m not
    talking about a distributed system here. Scaling is expensive in terms of deployment
    time but also in terms of hardware because databases require highly performant
    CPUs, RAM, and storage solutions to run.


    Today most IT organizations are switching to deploying data architectures based
    on Hadoop technologies. Indeed, rather than relying on inflexible, costly technology,
    the objective is now to distribute the load of processing over a bunch of commodity
    machines and be able to ingest a large amount of different types of data.


    Figure [3-1](#A978-1-4842-1326-1_3_Chapter.html#Fig1) gives an overview of the
    topology of such an architecture.


    ![A978-1-4842-1326-1_3_Fig1_HTML.jpg](A978-1-4842-1326-1_3_Fig1_HTML.jpg)


    Figure 3-1. Hadoop-based data architecture


    The following section covers the data pipeline, what kind of technologies are
    involved, and the common practices for this type of architecture.'
