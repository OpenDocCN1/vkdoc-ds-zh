    such as recommendations or security analytics. In the case of clickstream data,
    you can extract multiple insights.


    *   On one hand, using the long-processing layer, the clickstream can be processed,
    aggregated, and correlated to other data sources to build an accurate source for
    the recommendation engine that will consume them. In this example, clickstream
    data can be correlated with other data lakes containing precise demographic information
    to build views that can be then indexed into Elasticsearch.

    *   On the other hand, the same data can be used for bot detection. Indeed, most
    e-commerce web sites experience security threats, so one way to prevent that is
    to analyze the click behavior through the stream layer and blacklist in real time
    bot IP addresses. In Figure [3-5](#A978-1-4842-1326-1_3_Chapter.html#Fig5), you
    can use Spark to make complex correlation or run machine-learning processes to
    extract data before indexing in Elasticsearch.


    I won’t go into the details of the batch layer in the next chapter as this is
    a well-known subject that most Big Data books are covering today. The serving
    layer is most commonly handled by Hive, but why should you use Hive while Elasticsearch
    is able to create analytics in near real time? Now, with new connectors such as
    the ES-Hadoop connector ( [`https://www.elastic.co/products/hadoop`](https://www.elastic.co/products/hadoop))
    `)`, you can delegate in most use cases the data access, querying, and aggregation
    to real-time search technologies such as Elasticsearch, which provides even more
    capabilities.


    ## Summary


    At this point, you should have a better understanding about the value of the lambda
    architecture when it comes time to deal with a multitude of data sources types
    and, at the same time, about meeting the SLAs expected when it comes time to deliver
    services to end users and applications.


    In the next chapter, I’ll focus on building the stream part of the lambda architecture
    and will use the clickstream data to base your discussion.


    # 4. Streaming Data


    In the previous chapter, we focused on a long-term processing job, which runs
    in a Hadoop cluster and leverages YARN or Hive. In this chapter, I would like
    to introduce you to what I call the 2014 way of processing the data: streaming
    data. Indeed, more and more data processing infrastructures are relying on streaming
    or logging architecture that ingest the data, make some transformation, and then
    transport the data to a data persistency layer.


    This chapter will focus on three key technologies: Kafka, Spark, and the ELK stack
    from Elastic. We will work on combining them to implement different kind of logging
    architecture that can be used depending on the needs.


    ## Streaming Architecture


    In this section, we’ll see how the streaming part of the architecture is structured
    and also what technology we can use for data ingestion.'
  trans: '

    ### 流处理


    短期处理（即流处理）旨在摄取高吞吐量的数据。专为流式处理设计的解决方案能够处理海量数据，它们是高度分布式、可扩展且具有容错能力的技术。


    这类架构必须解决一系列挑战。如前所述，主要挑战在于处理海量数据。虽然以往也存在流式处理技术，但此类方案必须具有高可用性、高弹性以及高性能。它们之所以高性能，是因为数据量、数据复杂性和数据规模都在增长。


    数据量的增长意味着这些架构必须能够无缝地与多种数据源和应用集成，例如数据仓库、文件、历史数据、社交网络、应用日志等。它们需要提供一致的敏捷 API 和面向客户端的
    API，同时还要能够将信息输出到多种渠道，例如通知引擎、搜索引擎和第三方应用。从根本上说，这类技术在对市场变化的实时响应方面有更多的约束。


    最后，提供实时分析的能力是终端用户对流式架构的首要期望。需求非常明确，包括以下几个方面：实时发现数据、能够尽可能轻松地查询数据、以及通过告警进行主动监控，以便在事件达到阈值时通知用户和应用程序。


    流式架构最初应用于金融领域的高吞吐量交易场景，但现已扩展到众多其他用例，主要包括电子商务、电信、欺诈检测和分析。这促成了两项主要技术的兴起：`Apache
    Spark` 和 `Apache Storm`。


    `Spark` 是本书中我选择依赖的技术。我曾有幸多次使用它，我认为它是目前社区支持度最高、价值最大、最具吸引力的技术。图 3-4 佐证了这一点。


    ![A978-1-4842-1326-1_3_Fig4_HTML.jpg](img/A978-1-4842-1326-1_3_Fig4_HTML.jpg)


    图 3-4.


    `Apache Spark` 与 `Apache Storm` 的谷歌趋势对比


    在本节中，我不再赘述，而是用两个章节（第 X 章和第 X 章）专门讨论流式架构和服务架构。我将描述如何组合包括 `Spark` 在内的不同技术来处理实时流和搜索分析。


    ## Lambda 架构的概念


    前几节描述了将数据架构拆分为三个部分的必要性：批处理、流处理和服务架构。虽然在大多数现有 IT 组织的数据架构中，批处理仍然是常见做法，但当你能够先对大多数用例的数据进行流式处理，并在需要时将数据存储在面向批处理的文件系统中时，批处理就并非真正的必需了。


    对于一个以批处理为导向的 IT 组织来说，部署流式架构说起来容易做起来难。相比之下，流式架构在运维方面带来了更大的复杂性，因为操作员必须始终保持在线，而架构师必须设计和规划一个既能吸收突发的数据峰值，又能维持可接受响应时间的解决方案。


    尽管如此，当你意识到部署一个 `Hadoop` 发行版“仅仅”是为了完成流式架构能用相同（有时甚至更多）处理 API 完成的工作时所付出的沉重代价，最终你会发现，从流式处理入手要容易得多。即使你的服务等级协议（SLA）并不严苛，且你也不期望在几秒或几分钟内获取数据，你仍然可以减少为实现
    SLA 所投入的精力。


    在我看来，流式架构是现代数据架构的自然演进。它降低了软件复杂性，就像第一代大数据兴起时硬件的减少一样。我在此处的架构选择可能并不通用，且与我日常的工作内容紧密相关，但当我浏览自己处理过的各种用例时，我意识到我的技术栈能够满足
    90%的用例需求。


    Lambda 架构融合了两个领域的精华。数据在速度层（speed layer）中进行实时处理并具有短暂性；在批处理层（batch layer）中被重新计算并用于创建部分聚合结果；最后在服务层（serving
    layer）中合并并提供服务。为了实现这一范式，我选择了以下产品拓扑结构：


    *   `Logstash-forwarder` 用于摄取数据

    *   `Apache Kafka` 用于分发数据

    *   `Logtash agent` 用于处理日志

    *   `Apache Spark` 用于流处理

    *   `Elasticsearch` 作为服务层


    图 3-5 展示了这一拓扑结构。


    ![A978-1-4842-1326-1_3_Fig5_HTML.jpg](img/A978-1-4842-1326-1_3_Fig5_HTML.jpg)


    图 3-5.


    Lambda 架构的速度层和服务层


    Lambda 架构常用于电子商务网站，用于推荐或安全分析等不同目的。以点击流数据为例，可以从中提取多种洞察。


    *   一方面，利用长处理层（long-processing layer），可以对点击流进行处理、聚合，并与其他数据源关联，从而为消费这些数据的推荐引擎构建精确的数据源。在此示例中，点击流数据可以与包含精确人口统计信息的其他数据湖（data
    lakes）关联，构建可供分析的视图，然后索引到 `Elasticsearch` 中。

    *   另一方面，同一份数据可用于机器人检测。事实上，大多数电子商务网站都面临安全威胁，一种防范方法是，通过流处理层分析点击行为，并实时将机器人 IP 地址列入黑名单。在图
    3-5 中，你可以使用 `Spark` 进行复杂的关联分析，或运行机器学习过程，在数据索引到 `Elasticsearch` 之前提取数据。


    在下一章中，我将不再详细讨论批处理层，因为这是目前大多数大数据书籍涵盖的熟知话题。服务层最常由 `Hive` 处理，但当 `Elasticsearch` 能够近乎实时地创建分析时，为什么还要使用
    `Hive` 呢？现在，通过诸如 `ES-Hadoop` 连接器（[`www.elastic.co/products/hadoop`](https://www.elastic.co/products/hadoop)）等新连接器，你可以在大多数用例中，将数据访问、查询和聚合工作委派给像
    `Elasticsearch` 这样的实时搜索技术，后者能提供更强大的功能。


    ## 总结


    至此，你应该更好地理解了 Lambda 架构在处理多种数据源类型时的价值，以及它在需要向最终用户和应用程序提供服务时满足服务等级协议（SLA）期望方面的作用。


    在下一章中，我将重点构建 Lambda 架构的流式处理部分，并将使用点击流数据作为我们讨论的基础。


    # 4. 流式数据


    在上一章中，我们重点讨论了在 `Hadoop` 集群中运行并利用 `YARN` 或 `Hive` 的长期处理任务。在本章中，我想向你介绍我称之为 2014
    年数据处理方式的流式数据。确实，越来越多的数据处理基础设施依赖于流式或日志架构，这些架构摄取数据，进行一些转换，然后将数据传输到数据持久层。


    本章将重点介绍三项关键技术：`Kafka`、`Spark` 和来自 `Elastic` 的 `ELK` 技术栈。我们将致力于将它们组合使用，以实现可根据需求应用的多种日志架构。


    ## 流式架构


    在本节中，我们将了解架构的流式处理部分是如何构建的，以及我们可以使用哪些技术进行数据摄取。

