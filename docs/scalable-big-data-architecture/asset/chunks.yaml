    "description":  {

    "urls":  []

    }

    },

    "protected": false,

    "followers_count": 59,

    "friends_count": 107,

    "listed_count": 8,

    "created_at": "Sat Jan 24 15:32:11 +0000 2009",

    "favourites_count": 66,

