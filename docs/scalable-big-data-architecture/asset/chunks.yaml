  trans: '好的，作为一名高级文档工程师和翻译员，我将严格遵循您的格式要求，将给定的英文文本翻译成中文。



    ### 缓存文档


    首先需要讨论的是，如何在我们的 NoSQL 后端中事务性地复制数据。我们希望的是，每次在 SQL 数据库中写入数据时，都能在 NoSQL 后端创建、更新并丰富一个文档。可以创建一个尚不存在的文档，也可以更新某个字段，或者通过一个对应于关系型数据库管理系统（RDBMS）中表关系的子文档来丰富它。在访问文档方面，每当发起一个
    API `GET` 请求时，底层实现应首先在 NoSQL 后端中查找，如果文档存在则直接返回。


    但如果文档不存在呢？这时应触发一个缓存未命中事件，并将其发送给 NoSQL 管理器实现，以便从 RDBMS 重建该文档。听起来不错！但如果插入事务在 SQL
    层面失败了怎么办？框架应该是事务性的，并且仅当事务已在 SQL 中提交时，才触发文档构建。


    图 2-23 总结了这一机制。


    ![A978-1-4842-1326-1_2_Fig23_HTML.jpg](img/A978-1-4842-1326-1_2_Fig23_HTML.jpg)


    图 2-23. 在 NoSQL 中缓存文档


    以下是图 2-23 中所示内容的说明：


    -   第一张图展示了如何在 RDBMS 中创建一个账户，以及随后如何在 NoSQL 中创建一个代表整个账户的文档。

    -   第二张图展示了 API 如何通过 NoSQL 存储获取一个账户。

    -   第三张图展示了一个缓存未命中的示例，即当文档在 NoSQL 中不存在，而必须从 RDBMS 重新创建时的情况。


    我们实际上是在为基于 NoSQL 的 web 应用构建一个缓存。这种方法依赖于能够灵活地从 NoSQL 访问整个文档，无需向 SQL 数据库发出请求带来的负担，同时也依赖于能够灵活利用
    NoSQL 的分布式特性。通过这种方法，我们可以想象随着请求率的增长而扩展集群，并减少对 SQL 数据库的需求。


    ### 用于 Couchbase 的 ElasticSearch 插件（基于 Couchbase XDCR）


    为了实现这样的缓存机制，我们需要选择一项 NoSQL 技术。我的第一种方法是单独使用 Couchbase，但正如你已经看到的，Couchbase 的搜索功能并不十分便捷。


    处理用于索引数据的 map/reduce 函数并不简单，尤其是在进行简单聚合操作时。Couchbase 是一个很棒的 NoSQL 数据库，但实现搜索功能却非常痛苦。


    相反，你可以使用 Couchbase/ElasticSearch 集成插件，它基本上是利用跨数据中心复制（XDCR）特性，将所有数据复制到我们的 ElasticSearch
    集群（ [`www.couchbase.com/jp/couchbase-server/connectors/elasticsearch`](http://www.couchbase.com/jp/couchbase-server/connectors/elasticsearch)
    ）。


    这样，你就可以在你的 API 中添加一个 `Search Manager` 类，实现 ElasticSearch 搜索 API 来检索数据。


    但是，仅仅为了能从 NoSQL 而不是我们的 RDBMS 中获取文档，这仍然会引起大量的开销。在运维任务方面，这意味着你需要维护三种不同的技术：RDBMS、Couchbase
    和 ElasticSearch。


    ### 仅使用 ElasticSearch


    既然我们有以下需求，为什么还要继续使用 Couchbase 呢？


    -   能够对整个对象进行索引，例如将账户从 SQL 索引到 NoSQL。

    -   能够通过灵活的搜索 API 进行从简单到复杂的搜索，包括聚合操作。


    在我们特定的用例中，你一开始可能选择 Couchbase，因为它是一个 NoSQL 数据库，并且根据你学到的实践，文档应该存储在数据库中。当体验这种架构时，你会意识到你真正需要的是访问和请求数据的最有效方式，而在我们的案例中，ElasticSearch
    就是最有效的方式。


    ## 小结


    到此为止，你已经了解了 Couchbase 或 ElasticSearch 等 NoSQL 技术如何为现有的基于 RDBMS 的应用带来灵活性。


    同时，你也看到了，从高层视角看似乎相似的两项技术，实际上可能存在着根本性的不同。


    在下一章中，你将学习如何处理处理拓扑。


    # 3. 定义处理拓扑


    在上一章中，我解释了如何在你贯穿本书构建的架构中使用 NoSQL 技术。NoSQL 技术为应用提供了一些缓存和搜索功能，但由于你想要处理数据，你需要定义一种方法来处理各种数据流，以便向用户提供洞察或向应用提供服务。


    本章将通过引导你了解 IT 组织中常用的数据架构，来解释如何定义处理拓扑。然后，你将看到，在遵守服务等级协议（SLA）时，拆分是一种自然而然的选择。最后，我将讨论一种特定的架构
    —— Lambda 架构，它是不同类型架构的组合。


    ## 数据架构的初步方法


    本节描述了使用大数据领域的常见技术部署数据架构的第一步。


    ### 一些背景知识


    如今，许多 IT 组织正在演进他们的数据架构，因为他们依赖于所谓的传统数据架构。处理多个数据源并不新鲜；这些架构连接着众多的数据源，例如 CRM 系统、文件系统和遗留系统。它们主要运行在关系型数据库之上，如
    Oracle、DB2 或 Microsoft SQL。


    如今，通常的数据分析周期是运行一些定期进程，直接从数据库中提取和处理数据。这主要通过提取、转换、加载（ETL）工具（如 Informatica 或 Talend）来完成。目标是将消化处理后的数据加载到数据仓库中，供进一步分析使用。


    不幸的是，这种处理数据的方式并不符合周期末端的业务需求。这些数据管道可能需要数小时、数天，有时甚至数周才能完成，但业务决策需要立刻做出。


    除了处理时间之外，数据性质上的一些根本性变化也无法被这些架构轻松处理，例如，需要重构数据模型的数据结构，甚至需要考虑可扩展性的数据量。扩展这些系统并不容易，因为我这里谈论的不是分布式系统。扩展在部署时间上成本高昂，在硬件方面也是如此，因为数据库需要高性能的
    CPU、RAM 和存储解决方案才能运行。


    如今，大多数 IT 组织正在转向部署基于 Hadoop 技术的数据架构。实际上，目标不再是依赖僵化、昂贵的技术，而是要将处理负载分布到一批廉价机器上，并能够摄取大量不同类型的数据。


    图 3-1 展示了此类架构的拓扑概览。


    ![A978-1-4842-1326-1_3_Fig1_HTML.jpg](img/A978-1-4842-1326-1_3_Fig1_HTML.jpg)


    图 3-1. 基于 Hadoop 的数据架构


    下一节将介绍数据管道、涉及的技术类型，以及此类架构的常见实践。

    '
- fmt: '### Dealing with the Data Sources


    As Figure [3-1](#A978-1-4842-1326-1_3_Chapter.html#Fig1) shows, the data can come
    from multiple internal or external sources, but Big Data particularly comes from
    internal application and device logs, as well as from social networks, open data,
    or even sensors.


    If you take the example of a social network, data is flooding into IT organizations
    with interesting information, but this attractive information is drowning among
    a massive amount of useless information. Therefore, first this data needs to be
    stored, and then it needs to be processed to extract the important parts. This
    data is really useful for sales, specifically when you run sentiment analysis
    on top of it to reveal your social ecosystem’s feeling about your brand or products.


    Depending on the provider, data can be structured, semistructured, or unstructured.
    Listing [3-1](#A978-1-4842-1326-1_3_Chapter.html#FPar1) gives an example of a
    semistructured message.


    **Listing 3-1.** Example of the Semistructured Data of a Tweet


