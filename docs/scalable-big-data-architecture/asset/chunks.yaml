  raw: '### Implementing a Spark Indexer


    The indexing part is the last part of our driver but, surprisingly, we are not
    pushing its configuration to the last step.


    What we will do here is just make sure that each clickstream event that we consume
    can be indexed in ElasticSearch. The clickstream events are actually JSON received
    in string stream; we then need to parse the string, marshal to JSON RDD, and then
    create a RDD of Clickstream object.


    Let’s first defined our Clickstream object as shown in Listing [5-20](#A978-1-4842-1326-1_5_Chapter.html#FPar22).


    Listing 5-20.Clickstream object


    `case class Clickstream (`


       `message:String,`


       `version:String,`


       `file:String,`


       `host:String,`


       `offset:String,`


       `eventType:String,`


       `clientip:String,`


       `ident:String,`


       `auth:String,`


       `timestamp:String,`


       `verb:String,`


       `request:String,`


       `httpVersion:String,`


       `response:String,`


       `bytes:Integer,`


       `referrer:String,`


       `agent:` `String` `.`


    `)`


    Except for the bytes, we assume that every field are Strings. Let’s now parse
    our lines of JSON String as shown in Listing [5-21](#A978-1-4842-1326-1_5_Chapter.html#FPar23).


    Listing 5-21.Spark parse line


    `val parsedEvents =`


    `lines.map(JSON.parseFull(_))`


         `.map(_.get.asInstanceOf[scala.collection.immutable.Map[String,Any]])`


    Lines are processed in two steps:


    *   each lines is parsed using JSON.parseFull

    *   for each JSON, RDD are transformed into a map of key and value.


    Finally, clickstream events RDD are pulled out from the parsedEvents variable
    as shown in Listing [5-22](#A978-1-4842-1326-1_5_Chapter.html#FPar24).


    Listing 5-22.Spark Clickstream object parsing


    `val events = parsedEvents.map(data=>Clickstream(`


       `data("message").toString`


       `,data("@version").toString`


       `,data("file").toString`


       `,data("host").toString`


       `,data("offset").toString`


       `,data("type").toString`


       `,data("clientip").toString`


       `,data("ident").toString`


       `,data("auth").toString`


       `,data("timestamp").toString`


       `,data("verb").toString`


       `,data("request").toString`


       `,data("httpversion").toString`


       `,data("response").toString`


       `,Integer.parseInt(data("bytes").toString)`


       `,data("referrer").toString`


       `,data("agent").` `toString`


    `))`


    We simply make a mapping between each parsed event Map and new Clickstream event
    object. Then at the end we index the data using the Elasticsearch Hadoop connector
    as shown in Listing [5-23](#A978-1-4842-1326-1_5_Chapter.html#FPar25).


    Listing 5-23.Clickstream events indexed into Elasticsearch


    `events.foreachRDD{ rdd =>`


    `if (rdd.toLocalIterator.nonEmpty) {`


              `EsSpark.saveToEs(rdd, "spark/clickstream")`


            `}`


    `}`


    I’m creating a different index than the one created by Logstash in the previous
    chapter. The data are in the spark index under the clickstream type.


    You can find more information on the Elasticsearch Hadoop connector at this link:


    [`https://www.elastic.co/guide/en/elasticsearch/hadoop/current/index.html`](https://www.elastic.co/guide/en/elasticsearch/hadoop/current/index.html)


    At this point you should be able to index in Elasticsearch after generating data,
    like in Figure [5-3](#A978-1-4842-1326-1_5_Chapter.html#Fig3).


    ![A978-1-4842-1326-1_5_Fig3_HTML.jpg](A978-1-4842-1326-1_5_Fig3_HTML.jpg)


    Figure 5-3.


    Clickstream events in the spark index


    As you can see, I’m using Elasticsearch search API to fetch data from the spark
    index; as a result, I’m getting 55 clickstream events from the index.


    ### Implementing a Spark Data Processing


    That may look weird to end with part, but I prefer that the streaming to pipe
    be ready to work before diving on the core usage of Spark, the data processing.


    We will now add a little bit more processing logic to our previous Spark code
    and introduce a new object: the PageStatistic object. This object will hold all
    the statistics that we want to have around user behavior on our website. We’ll
    limit the example to a basic one; in the next chapter, we’ll will go deeper.


    The processing part will be then be divided into the following parts:


    *   creation on a simple PageStatistic object that holds the statistics

    *   computation of statistic

    *   indexation part


    Let’s first begin with the PageStatistic object, which so far will only hold the
    count of GET and POST request, as shown in Listing [5-24](#A978-1-4842-1326-1_5_Chapter.html#FPar26).


    Listing 5-24.PageStatistic object definition


    `case class PageStatistic (`


      `getRequest:Long,`


      `postRequest:Long`


    `)`


    Then we’ll use a special from Spark scala library call countByValue to compute
    the number of GET and POST in the batch of logs we receive from Kafka as seen
    in Listing [5-25](#A978-1-4842-1326-1_5_Chapter.html#FPar27).


    Listing 5-25.Compute count of GET and POST using countByValue


    `val requestMap = events`


      `.map(event => event.verb)`


      `.countByValue()`


      `.map(x=>x.productIterator.collect{case (a,b) => (a -> b)}.toMap.withDefaultValue(0L));`


    `val requests = requestMap.map(data => PageStatistic(`


      `data("GET").asInstanceOf[Long],`


      `data("POST").asInstanceOf[Long]`


    `));`


    In this code, we simply take each received event and apply the countByValue function
    on it. Then we create a map with a default value of 0, which we iterate on to
    pull out PageStatistic objects.


    Finally, we index the data in Elasticsearch using the spark index and create a
    new type of document, the stats, as seen in Listing [5-26](#A978-1-4842-1326-1_5_Chapter.html#FPar28).


    Listing 5-26.Indexing stats documents in spark Elasticsearch index


    `requests.foreachRDD{ rdd =>`


      `if (rdd.toLocalIterator.nonEmpty) {`


        `EsSpark.saveToEs(rdd, "spark/stats")`


      `}`


    `}`


    If we check in Elasticsearch using Listing [5-27](#A978-1-4842-1326-1_5_Chapter.html#FPar29):


    Listing 5-27.Getting spark stats document from Elasticsearch


    `GET spark/stats/_search`


    We get:


    `{`


       `"took": 1,`


       `"timed_out": false,`


       `"_shards": {`


          `"total": 1,`


          `"successful": 1,`


          `"failed": 0`


       `},`


       `"hits": {`


          `"total": 1,`


          `"max_score": 1,`


          `"hits": [`


             `{`


                `"_index": "spark",`


                `"_type": "stats",`


                `"_id": "AU7ReZIVvtspbVGliqwM",`


                `"_score": 1,`


                `"_source": {`


                   `"getRequest": 34,`


                   `"postRequest": 12`


                `}`


             `}`


          `]`


       `}`


    `}`


    We can see that our document holds the two computed fields of the PageStatistic
    object. But this level of trivial computation is something that Elasticsearch
    can easily do; we’ll see how in the next section. Remember that we’ll try to emphasize
    this Spark processing pipeline in the following chapter, to show the full power
    of this stack.


    ## Data Analytics with Elasticsearch


    ### Introduction to the aggregation framework


    Elasticsearch comes with a powerful set of API that let the users get the best
    of their data. The aggregation framework groups and enables real-time analytics
    queries on small to large set of data.


    What we have done with Spark in terms of simple analytics can be done as well
    in Elasticsearch using the aggregation framework at scale. This framework is devided
    into two types of aggregations:


    *   Bucket aggregation that aims to group a set of document based on key common
    to documents and criterion. Document that meets the condition falls in the bucket.

    *   Metric aggregation that aims to calculate metrics such as average, maximum,
    minimum, or even date histograms, over a set of documents.


    Indeed, the power of aggregation resides on the fact that they can be nested'
