    \n    - \"logs/kafka2:/opt/kafka/logs/\"\n  extra_hosts:\n    - \"brokers:192.168.59.103\"\
    \n  links:\n    - \"kafka1\"\n  ports:\n    - \"9093:9093\"\n\nlogstashProcessor1:\n\
