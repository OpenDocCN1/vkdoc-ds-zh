  \"follow_request_sent\": false,\n\"notifications\": false\n},\n\"geo\": null,\n\"\
  coordinates\": null,\n\"place\": null,\n\"contributors\": null,\n\"is_quote_status\"\
  : false,\n\"retweet_count\": 0,\n\"favorite_count\": 0,\n\"entities\":  {\n\"hashtags\"\
  :  [],\n\"symbols\":  [],\n\"user_mentions\":  [],\n\"urls\":  []\n},\n\"favorited\"\
  : false,\n\"retweeted\": false,\n\"lang\": \"en\"\n}\n```\n\n正如你在示例中所见，该文档是一个 JavaScript\
  \ 对象表示法 (`JSON`) 文档，包含大量描述推文的字符串元数据字段。但其中一些字段更为复杂；存在一些数组，有时为空，有时则包含一组数据。此外，还有纯文本内容，例如推文正文。\n\
  \n这应该会让你思考数据需要如何存储。仅仅将数据放在 HDFS 上是远远不够的；你可能需要在数据之上构建一个元结构，使用支持这种数据结构复杂性的技术。例如，你可以通过\
  \ Hive 来实现这一点，这将在后续章节中讨论。\n\n社交网络代表了你在处理大量异构数据时所要面对的复杂性。除了结构之外，你还需要将数据分类成逻辑子集，以增强数据处理能力。\n\
  \n考虑到情感分析的例子，将数据组织起来以便在海量非结构化数据中定位有价值的信息，是合情合理的。例如，一种常见做法是将数据划分为基于时间的分区，这样后续的数据处理就可以轻松地专注于某一年数据中的特定周数。\n\
  \n你还必须注意保护数据访问的安全性，最可能的方式是使用 Kerberos 或其他认证提供商。但随着数据平台吸引新的应用场景，多租户需要处理的首要问题就是安全性。然后，你需要创建数据的定期快照，以便进行归档，并在发生故障时进行恢复。\n\
  \n所有这些考量都是相当标准的，幸运的是，大多数发行版供应商都提供了相应的支持。存在一些开箱即用的软件包，能够确保或帮助你实现或配置这些概念。\n\n\n\n\
  ### 数据处理\n\n当你需要将数据从源端纯粹地转换到目标端时，数据转换通常由 ETL 工具处理。诸如 `Talend`、`Pentaho`、`Informatica`\
  \ 或 `IBM Datastage` 等工具是大数据项目中最常用的软件。但它们仍不完善，你还需要一些补充工具（例如 `Sqoop`）来简单地导入或导出数据。无论哪种情况，都需要使用多种工具来摄取数据，而它们的共同点是目标端：`HDFS`。`HDFS`\
  \ 是 Hadoop 发行版的入口点；数据必须以某种方式存储在这个文件系统中，以便由高级应用程序和项目进行处理。\n\n当数据存储在 `HDFS` 上后，如何访问和处理它呢？例如，这正是\
  \ `Hive` 所能做到的。它在 `HDFS` 中存储的文件之上创建了一个结构，以便更容易地访问这些文件。这个结构本身就类似于数据库中的表。例如，列表 3-2\
  \ 展示了可以为上述推特示例创建的结构。\n\n**列表 3-2.** Hive 推特结构\n\n```sql\ncreate table tweets (\n\
  \  created_at string,\n  entities struct <\n    hashtags: array<struct<text: string>>,\n\
  \    media: array<struct<media_url: string, media_url_https: string, sizes: array<struct<url:\
  \ string>>>>,\n    urls: array<struct<url: string>>,\n    user_mentions: array<struct<name:\
  \ string, screen_name: string>>\n  >,\n  geo struct <\n    coordinates: array<float>,\n\
  \    type: string\n  >,\n  id bigint,\n  id_str string,\n  in_reply_to_screen_name\
  \ string,\n  in_reply_to_status_id bigint,\n  in_reply_to_status_id_str string,\n\
  \  in_reply_to_user_id int,\n  in_reply_to_user_id_str string,\n  retweeted_status\
  \ struct <\n    created_at: string,\n    entities: struct <\n      hashtags: array<struct<text:\
  \ string>>,\n      media: array<struct<media_url: string, media_url_https: string,\
  \ sizes: array<struct<url: string>>>>,\n      urls: array<struct<url: string>>,\n\
  \      user_mentions: array<struct<name: string, screen_name: string>>\n    >,\n\
  \    geo: struct <\n      coordinates: array<float>,\n      type: string\n    >,\n\
  \    id: bigint,\n    id_str: string,\n    in_reply_to_screen_name: string,\n  \
  \  in_reply_to_status_id: bigint,\n    in_reply_to_status_id_str: string,\n    in_reply_to_user_id:\
  \ int,\n    in_reply_to_user_id_str: string,\n    source: string,\n    text: string,\n\
  \    user: struct <\n      id: int,\n      id_str: string,\n      name: string,\n\
  \      profile_image_url_https: string,\n      protected: boolean,\n      screen_name:\
  \ string,\n      verified: boolean\n    >\n  >,\n  source string,\n  text string,\n\
  \  user struct <\n    id: int,\n    id_str: binary,\n    name: string,\n    profile_image_url_https:\
  \ string,\n    protected: boolean,\n    screen_name: string,\n    verified: boolean\n\
  \  >\n)\nPARTITIONED BY (datehour INT)\nROW FORMAT SERDE 'org.openx.data.jsonserde.JsonSerDe'\n\
  LOCATION '/user/username/tweets';\n```\n\n如你所见，推文被组织成一张表，其中的子结构描述了源端非结构化文档的复杂性。现在，数据安全地存储在\
  \ `HDFS` 中，通过 `Hive` 进行结构化，并准备好成为处理或查询管道的一部分。例如，列表 3-3 展示了已收集数据中主题标签的分布情况。\n\n**列表\
  \ 3-3.** 热门主题标签\n\n```sql\nSELECT\n  LOWER(hashtags.text),\n  COUNT(*) AS hashtag_count\n\
  FROM tweets\nLATERAL VIEW EXPLODE(entities.hashtags) t1 AS hashtags\nGROUP BY LOWER(hashtags.text)\n\
  ORDER BY hashtag_count DESC\nLIMIT 15;\n```\n\n使用 `Hive` 查询数据非常方便，因为它提供了一种类似 SQL\
  \ 的查询语言。问题在于查询的延迟；它基本上具有与 MapReduce 作业相同的延迟。实际上，上述查询会被转换为一个 MapReduce 作业，该作业遵循通常的执行管道，从而导致处理时间较长。\n\
  \n当需要实时跟踪数据转换时（例如在实时观看热门主题标签时），这种情况就会成为问题。随着 `Spark` 等技术的兴起，实时大规模数据处理不再是神话。它不仅带来了实时处理能力，而且实现起来也很简单。例如，列表\
  \ 3-4 展示了如何在 MapReduce 中实现单词计数。\n\n**列表 3-4.** MapReduce 中的单词计数（来自 [www.dattamsha.com/2014/09/hadoop-mr-vs-spark-rdd-wordcount-program/](http://www.dattamsha.com/2014/09/hadoop-mr-vs-spark-rdd-wordcount-program/)）\n\
  \n```java\npackage org.apache.hadoop.examples;\n\nimport java.io.IOException;\n\
  import java.util.StringTokenizer;\nimport org.apache.hadoop.conf.Configuration;\n\
  import org.apache.hadoop.fs.Path;\nimport org.apache.hadoop.io.IntWritable;\nimport\
  \ org.apache.hadoop.io.Text;\nimport org.apache.hadoop.mapreduce.Job;\nimport org.apache.hadoop.mapreduce.Mapper;\n\
  import org.apache.hadoop.mapreduce.Reducer;\nimport org.apache.hadoop.mapreduce.lib.input.FileInputFormat;\n\
  import org.apache.hadoop.mapreduce.lib.input.FileSplit;\nimport org.apache.hadoop.mapreduce.lib.output.FileOutputFormat;\n\
  import org.apache.hadoop.util.GenericOptionsParser;\n\npublic class WordCount {\n\
  \n  public static class TokenizerMapper\n       extends Mapper<Object, Text, Text,\
  \ IntWritable>{\n\n    private final static IntWritable one = new IntWritable(1);\n\
  \    private Text word = new Text();\n\n    public void map(Object key, Text value,\
  \ Context context\n                    ) throws IOException, InterruptedException\
  \ {\n      StringTokenizer itr = new StringTokenizer(value.toString());\n      while\
  \ (itr.hasMoreTokens()) {\n        word.set(itr.nextToken());\n        context.write(word,\
  \ one);\n      }\n    }\n  }\n\n  public static class IntSumReducer\n       extends\
  \ Reducer<Text,IntWritable,Text,IntWritable> {\n    private IntWritable result =\
  \ new IntWritable();\n\n    public void reduce(Text key, Iterable<IntWritable> values,\n\
  \                       Context context\n                       ) throws IOException,\
  \ InterruptedException {\n      int sum = 0;\n      for (IntWritable val : values)\
  \ {\n        sum += val.get();\n      }\n      result.set(sum);\n      context.write(key,\
  \ result);\n    }\n  }\n\n  public static void main(String[] args) throws Exception\
  \ {\n    Configuration conf = new Configuration();\n    String[] otherArgs = new\
  \ GenericOptionsParser(conf, args).getRemainingArgs();\n    Job job = new Job(conf,\
  \ \"word count\");\n    job.setJarByClass(WordCount.class);\n    job.setMapperClass(TokenizerMapper.class);\n\
  \    job.setCombinerClass(IntSumReducer.class);\n    job.setReducerClass(IntSumReducer.class);\n\
  \    job.setOutputKeyClass(Text.class);\n    job.setOutputValueClass(IntWritable.class);\n\
  \    FileInputFormat.addInputPath(job, new Path(otherArgs[0]));\n    FileOutputFormat.setOutputPath(job,\
  \ new Path(otherArgs[1]));\n    System.exit(job.waitForCompletion(true) ? 0 : 1);\n\
  \  }\n}\n```\n\n列表 3-5 展示了如何在 Spark（Python）中实现相同功能。\n\n**列表 3-5.** Spark 中的单词计数\n\
  \n```python\nfrom pyspark import SparkContext\n\nlogFile = \"hdfs://localhost:9000/user/bigdatavm/input\"\
  \nsc = SparkContext(\"spark://bigdata-vm:7077\", \"WordCount\")\ntextFile = sc.textFile(logFile)\n\
  wordCounts = textFile.flatMap(lambda line: line.split()).map(lambda word: (word,\
  \ 1)).reduceByKey(lambda a, b: a+b)\nwordCounts.saveAsTextFile(\"hdfs://localhost:9000/user/bigdatavm/output\"\
  )\n```\n\n这引出了我的讨论：有必要将架构拆分为多个部分，分别处理特定需求，一部分用于批处理，另一部分用于流处理。\n\n\n\n## 架构拆分\n\n\
  在处理大量数据时，使用 Hadoop 能带来许多解决方案，但在分配资源和管理存储数据方面也带来了挑战；你始终希望在保持最低延迟以向最终用户提供数据的同时降低成本。\n\
  \n与任何其他架构一样，数据架构应满足 SLA 驱动的需求。因此，并非每个作业都应平等消耗所有资源，而应通过优先级系统进行管理，或在架构、硬件、网络等方面相互隔离。\n\
  \n在本节中，我将讨论现代数据架构如何拆分，以应对因 SLA 而产生的不同时间需求。为了说明这一点，我将讨论图 3-2 中展示的分区。\n\n![A978-1-4842-1326-1_3_Fig2_HTML.jpg](img/A978-1-4842-1326-1_3_Fig2_HTML.jpg)\n\
  \n如图所示，架构分为以下几个部分：\n\n-   长期处理部分\n-   短期处理部分\n-   视图合并部分\n\n我将逐一介绍这些部分，并解释每个部分所承担的角色。\n\
  \n### 批处理\n\n长期处理作业（或称批处理）是从第一代 Hadoop 架构开始实施的作业，例如 `MapReduce`、`Hive`、`Pig` 等。这些作业通常处理海量数据，并生成摘要数据，或更标准地说，生成数据聚合。数据利用\
  \ `HDFS` 文件系统的能力和调度进行分发，并由不同的工具进行管理，具体取决于你所使用的发行版。\n\n通常，这些作业的目标是保持计算数据的聚合，并使其可用于分析。如前所述，批处理在大数据潮流初期是首要的处理方式，因为它是一种自然的数据处理方式：你提取或收集数据，然后调度作业。处理作业可能会花费大量时间才能完成聚合计算。\n\
  \n这些作业也主要满足了那些无法处理数据流的传统系统的处理需求。与需要持续监控的流式系统相比，批处理一次性运行，因此变得非常易于管理和监控。现在有了 `YARN`，管理分配给批处理应用的资源也变得容易。这样，IT\
  \ 组织也可以根据每个批处理的 SLA 来拆分批处理架构，这将在下一节中讨论。\n\n#### 处理优先级\n\n在处理批处理时，IT 组织希望完全控制与处理相关的操作，例如调度甚至对某些作业进行优先级排序。与大多数\
  \ IT 系统一样，数据平台始于一个试点用例，这可能会吸引其他组织的其他部分为平台添加更多用例。这简单地将平台转变为一个多租户数据平台，其中包含许多依赖于用例的\
  \ SLA。\n\n在 Hadoop 2.0 和基于 Yarn 的架构中，为多租户提供的特性允许用户访问同一数据平台，并使用不同的集群容量运行处理。`YARN`\
  \ 还允许你运行非 MapReduce 应用，因此通过 `ResourceManager` 和 YARN 容量调度器，可以在应用类型之间进行作业优先级排序。\n\
  \nHadoop 工作负载的分配是在容量调度器层面完成的。通过配置，你可以精细地安排可预测的集群资源份额，并能够实现安全且显著的集群利用率。这是通过设置作业队列的利用率百分比来实现的。图\
  \ 3-3 展示了这一概念。\n\n![A978-1-4842-1326-1_3_Fig3_HTML.jpg](img/A978-1-4842-1326-1_3_Fig3_HTML.jpg)\n\
  \n该示例展示了三个队列的不同优先级：高、低和默认。这可以在清单 3-6 所示的简单 YARN 容量调度器配置中体现。\n\n```\n<property>\n\
  \  <name>yarn.scheduler.capacity.root.queues</name>\n  <value>default,highPriority,lowPriority</value>\n\
  </property>\n\n<property>\n  <name>yarn.scheduler.capacity.root.highPriority.capacity</name>\n\
  \  <value>60</value>\n</property>\n\n<property>\n  <name>yarn.scheduler.capacity.root.lowPriority.capacity</name>\n\
  \  <value>20</value>\n</property>\n\n<property>\n  <name>yarn.scheduler.capacity.root.default.capacity</name>\n\
  \  <value>10</value>\n</property>\n```\n\n每个队列都被分配了一个最小集群容量，这个容量实际上是弹性的。这意味着如果有空闲资源可用，一个队列可以占用超过最初分配的最小容量。不过，最大容量也可以被分配，如清单\
  \ 3-7 所示。\n\n```\n<property>\n  <name>yarn.scheduler.capacity.root.lowPriority.maximum-capacity</name>\n\
  \  <value>50</value>\n</property>\n```\n\n此配置设置了容量，因此任何提交作业的人（例如，一个 `MapReduce`\
  \ 作业）都可以根据预期要求将其提交到特定队列，如清单 3-8 所示。\n\n```\nConfiguration priorityConf = new Configuration();\n\
  priorityConf.set(\"mapreduce.job.queuename\", queueName);\n```\n\n借助 YARN 容量调度器，批处理在资源管理方面变得更加高效，并且在行业中有许多应用，例如为推荐引擎分配比不那么关键的需求（如用于通知的数据处理）更多的资源。但谈到推荐，现在大多数\
  \ IT 系统都使用短期处理作业来进行推荐，并依赖于流式架构，我将在下一节中对此进行描述。\n\n\n\n### 流处理\n\n短期处理（即流处理）旨在摄取高吞吐量的数据。专为流式处理设计的解决方案能够处理海量数据，它们是高度分布式、可扩展且具有容错能力的技术。\n\
  \n这类架构必须解决一系列挑战。如前所述，主要挑战在于处理海量数据。虽然以往也存在流式处理技术，但此类方案必须具有高可用性、高弹性以及高性能。它们之所以高性能，是因为数据量、数据复杂性和数据规模都在增长。\n\
  \n数据量的增长意味着这些架构必须能够无缝地与多种数据源和应用集成，例如数据仓库、文件、历史数据、社交网络、应用日志等。它们需要提供一致的敏捷 API 和面向客户端的\
  \ API，同时还要能够将信息输出到多种渠道，例如通知引擎、搜索引擎和第三方应用。从根本上说，这类技术在对市场变化的实时响应方面有更多的约束。\n\n最后，提供实时分析的能力是终端用户对流式架构的首要期望。需求非常明确，包括以下几个方面：实时发现数据、能够尽可能轻松地查询数据、以及通过告警进行主动监控，以便在事件达到阈值时通知用户和应用程序。\n\
  \n流式架构最初应用于金融领域的高吞吐量交易场景，但现已扩展到众多其他用例，主要包括电子商务、电信、欺诈检测和分析。这促成了两项主要技术的兴起：`Apache\
  \ Spark` 和 `Apache Storm`。\n\n`Spark` 是本书中我选择依赖的技术。我曾有幸多次使用它，我认为它是目前社区支持度最高、价值最大、最具吸引力的技术。图\
  \ 3-4 佐证了这一点。\n\n![A978-1-4842-1326-1_3_Fig4_HTML.jpg](img/A978-1-4842-1326-1_3_Fig4_HTML.jpg)\n\
  \n图 3-4.\n\n`Apache Spark` 与 `Apache Storm` 的谷歌趋势对比\n\n在本节中，我不再赘述，而是用两个章节（第 X 章和第\
  \ X 章）专门讨论流式架构和服务架构。我将描述如何组合包括 `Spark` 在内的不同技术来处理实时流和搜索分析。\n\n## Lambda 架构的概念\n\n\
  前几节描述了将数据架构拆分为三个部分的必要性：批处理、流处理和服务架构。虽然在大多数现有 IT 组织的数据架构中，批处理仍然是常见做法，但当你能够先对大多数用例的数据进行流式处理，并在需要时将数据存储在面向批处理的文件系统中时，批处理就并非真正的必需了。\n\
  \n对于一个以批处理为导向的 IT 组织来说，部署流式架构说起来容易做起来难。相比之下，流式架构在运维方面带来了更大的复杂性，因为操作员必须始终保持在线，而架构师必须设计和规划一个既能吸收突发的数据峰值，又能维持可接受响应时间的解决方案。\n\
  \n尽管如此，当你意识到部署一个 `Hadoop` 发行版“仅仅”是为了完成流式架构能用相同（有时甚至更多）处理 API 完成的工作时所付出的沉重代价，最终你会发现，从流式处理入手要容易得多。即使你的服务等级协议（SLA）并不严苛，且你也不期望在几秒或几分钟内获取数据，你仍然可以减少为实现\
  \ SLA 所投入的精力。\n\n在我看来，流式架构是现代数据架构的自然演进。它降低了软件复杂性，就像第一代大数据兴起时硬件的减少一样。我在此处的架构选择可能并不通用，且与我日常的工作内容紧密相关，但当我浏览自己处理过的各种用例时，我意识到我的技术栈能够满足\
  \ 90%的用例需求。\n\nLambda 架构融合了两个领域的精华。数据在速度层（speed layer）中进行实时处理并具有短暂性；在批处理层（batch\
  \ layer）中被重新计算并用于创建部分聚合结果；最后在服务层（serving layer）中合并并提供服务。为了实现这一范式，我选择了以下产品拓扑结构：\n\
  \n*   `Logstash-forwarder` 用于摄取数据\n*   `Apache Kafka` 用于分发数据\n*   `Logtash agent`\
  \ 用于处理日志\n*   `Apache Spark` 用于流处理\n*   `Elasticsearch` 作为服务层\n\n图 3-5 展示了这一拓扑结构。\n\
  \n![A978-1-4842-1326-1_3_Fig5_HTML.jpg](img/A978-1-4842-1326-1_3_Fig5_HTML.jpg)\n\
  \n图 3-5.\n\nLambda 架构的速度层和服务层\n\nLambda 架构常用于电子商务网站，用于推荐或安全分析等不同目的。以点击流数据为例，可以从中提取多种洞察。\n\
  \n*   一方面，利用长处理层（long-processing layer），可以对点击流进行处理、聚合，并与其他数据源关联，从而为消费这些数据的推荐引擎构建精确的数据源。在此示例中，点击流数据可以与包含精确人口统计信息的其他数据湖（data\
  \ lakes）关联，构建可供分析的视图，然后索引到 `Elasticsearch` 中。\n*   另一方面，同一份数据可用于机器人检测。事实上，大多数电子商务网站都面临安全威胁，一种防范方法是，通过流处理层分析点击行为，并实时将机器人\
  \ IP 地址列入黑名单。在图 3-5 中，你可以使用 `Spark` 进行复杂的关联分析，或运行机器学习过程，在数据索引到 `Elasticsearch` 之前提取数据。\n\
  \n在下一章中，我将不再详细讨论批处理层，因为这是目前大多数大数据书籍涵盖的熟知话题。服务层最常由 `Hive` 处理，但当 `Elasticsearch` 能够近乎实时地创建分析时，为什么还要使用\
  \ `Hive` 呢？现在，通过诸如 `ES-Hadoop` 连接器（[`www.elastic.co/products/hadoop`](https://www.elastic.co/products/hadoop)）等新连接器，你可以在大多数用例中，将数据访问、查询和聚合工作委派给像\
  \ `Elasticsearch` 这样的实时搜索技术，后者能提供更强大的功能。\n\n## 总结\n\n至此，你应该更好地理解了 Lambda 架构在处理多种数据源类型时的价值，以及它在需要向最终用户和应用程序提供服务时满足服务等级协议（SLA）期望方面的作用。\n\
  \n在下一章中，我将重点构建 Lambda 架构的流式处理部分，并将使用点击流数据作为我们讨论的基础。\n\n"
- "# 4. 流式数据\n\n在上一章中，我们重点讨论了在 `Hadoop` 集群中运行并利用 `YARN` 或 `Hive` 的长期处理任务。在本章中，我想向你介绍我称之为\
  \ 2014 年数据处理方式的流式数据。确实，越来越多的数据处理基础设施依赖于流式或日志架构，这些架构摄取数据，进行一些转换，然后将数据传输到数据持久层。\n\n\
  本章将重点介绍三项关键技术：`Kafka`、`Spark` 和来自 `Elastic` 的 `ELK` 技术栈。我们将致力于将它们组合使用，以实现可根据需求应用的多种日志架构。\n\
  \n## 流式架构\n\n在本节中，我们将了解架构的流式处理部分是如何构建的，以及我们可以使用哪些技术进行数据摄取。\n\n\n\n### 架构图\n\n首先，在深入探讨架构细节之前，让我们先讨论一下“流式”（streaming）这个词，它在本文的上下文中可能会被误解。实际上，我所说的流式架构，是指一种能够随着数据的到来即时摄入数据的架构。\n\
  \n数据可以由不同的提供者生成：应用程序日志文件，例如 Apache HTTP 访问日志、您的 REST API 日志；来自消息代理技术（如 Apache Kafka）；甚至直接来自一个\
  \ TCP 端点。\n\n通常，数据被摄入后会被传输到一个缓冲层，该层大多基于消息代理。我们称这部分为日志架构的传输部分。缓冲部分通常用于确保数据不会丢失，并将架构的传输部分和处理部分解耦。\n\
  \n无论数据何时以流式方式进入架构，消息代理都应当是分布式的，并保证数据的持久性。\n\n数据经过缓冲后，可以设置两种处理架构：\n\n-   一种处理管道，旨在对数据进行转换、格式化、验证和丰富化，然后进行持久化。大多数情况下，负责传输的技术会处理这一部分。有些技术也同时处理传输、缓冲和处理部分。\n\
  -   一种基于 Hadoop 技术的处理管道，它为处理过程提供额外功能，例如机器学习能力。\n\n图 4-1 以图形方式展示了我们刚才讨论的内容。\n\n![A978-1-4842-1326-1_4_Fig1_HTML.jpg](img/A978-1-4842-1326-1_4_Fig1_HTML.jpg)\n\
  \n图 4-1. 典型数据摄入架构剖析\n\n### 技术\n\n现在，让我们为这些高层模块赋予一些具体的名称。在数据摄入方面，最常用的技术可能是 `Apache\
  \ Flume` 和 Elastic 的 `Logstash`。它们是两种常用的技术，用于从多种数据源摄入流数据，进行处理，然后建立索引。\n\n`Flume`\
  \ 架构具有可扩展性，并依赖于如图 4-2 所示的三层结构。\n\n![A978-1-4842-1326-1_4_Fig2_HTML.jpg](img/A978-1-4842-1326-1_4_Fig2_HTML.jpg)\n\
  \n图 4-2. Flume 架构\n\n`Flume` 的 Source 从外部源接收数据，并将其存储在一个或多个 `Flume` Channel 中。数据一旦进入\
  \ Channel，就会被存储并保留，直到 Sink 将其安全地排出。Sink 将消息写入目标存储。`Flume` 通常用于 Hadoop 架构中，例如，因为写入\
  \ `HDFS` 非常简单。`Flume` 能够保证从诸如 `Avro`、`Thrift`、`Syslog` 或另一个 `Flume` Agent 等数据源向\
  \ `HDFS`、日志文件、`Avro`，或直接向 `HBase` 甚至 `Elasticsearch` 输送数据。其水平扩展能力确保了容错性和高吞吐量。\n\n\
  另一方面，从结构角度来看，`Logstash` 完全不同。`Logstash` 是一个单一的模块化代理，负责接收、转发并“遗忘”日志。这里说的“遗忘”，并不是指\
  \ `Logstash` 不追踪它刚刚消费的内容（比如一个文件），而是指它没有附带一个用于持久化数据以提供开箱即用弹性的缓冲层。`Logstash` 使用 `JRuby`\
  \ 编写，并运行在 `JVM` 中。为了避免使用 `JVM` 传输日志的缺点，`Logstash` 附带 `Logstash-forwarder`，这是一种专用的代理程序，用于接收和转发日志到另一个程序。\n\
  \n`Logstash` 的典型用法依赖于图 4-3 所示的架构。\n\n![A978-1-4842-1326-1_4_Fig3_HTML.jpg](img/A978-1-4842-1326-1_4_Fig3_HTML.jpg)\n\
  \n图 4-3. Logstash 日志平台的典型架构\n\n如图所示，该架构遵循我们之前讨论的结构进行划分，具有以下特点：\n\n-   第一部分由安装在日志源旁边的\
  \ `Logstash-forwarders` 组成，它们仅负责接收数据并将其发送到负责处理日志的 `Logstash` 实例组，然后再将数据放入消息代理。\n\
  -   第二部分基于一个消息代理；推荐使用 `RabbitMQ`、`Kafka` 和 `Redis`。为了简化起见，并且因为逐一介绍每种可能的组合会占用很多篇幅，我们将重点放在\
  \ `Apache Kafka` 上，它目前似乎拥有最好的发展势头。\n-   第三部分基于 `Logstash` 处理器组，它们可以在将事件索引到 `Elasticsearch`\
  \ 之前对其进行验证。\n\n在 `Logstash` 中，处理管道是一个声明式配置导向的文件，由输入（inputs）、过滤器（filters）和输出（outputs）组成。\n\
  \n`Logstash` 带有一系列输入/输出插件，让您可以连接到各种数据源，如文件、syslog、`tcp`、`xmpp` 等等。支持的输入插件完整列表可在以下页面找到：\n\
  \n-   [`www.elastic.co/guide/en/logstash/current/input-plugins.html`](https://www.elastic.co/guide/en/logstash/current/input-plugins.html)\n\
  -   [`www.elastic.co/guide/en/logstash/current/output-plugins.html`](https://www.elastic.co/guide/en/logstash/current/output-plugins.html)\n\
  \n过滤器通过根据需要配置过滤器来帮助处理事件。例如，如果您想将接收到的事件中的某个字段转换为整数，您只需编写如代码清单 4-1 所示的内容。\n\n代码清单\
  \ 4-1. Logstash 过滤器示例\n\n```\nfilter {\n\n  mutate {\n\n    convert => { \"fieldname\"\
  \ => \"integer\" }\n\n  }\n\n}\n```\n\n我们将在本章后面部分更深入地详细分析一个读取日志并处理它们的处理管道示例，但现在，先提供支持的过滤器列表链接：\n\
  \n-   [`www.elastic.co/guide/en/logstash/current/filter-plugins.html`](https://www.elastic.co/guide/en/logstash/current/filter-plugins.html)\n\
  \n您可能已经注意到在图中，建议的方法是将处理后的数据索引到 `Elasticsearch` 中。`Logstash` 支持不同类型的存储，并与 `Elasticsearch`\
  \ 无缝集成。\n\n`Elasticsearch` 将扮演索引引擎的角色，我们稍后将用它来进行搜索和分析。\n\n## 摄入数据的剖析\n\n在这部分，我们将讨论需要摄入到流式平台的数据结构。如前所述，我们的目标是利用网站访客的活动数据。因此，我们将重点关注所谓的“点击流数据”。\n\
  \n\n\n### 点击流数据\n\n我想无需提醒您，关于网站访客活动这类关键数据。我们接下来要描述的“点击流数据”正是其中的一部分。\n\n运营网站时，您很可能想了解访客的行为模式，以及如何优化他们的体验。网站要成长壮大，面临的挑战包括：\n\
  \n*   网站流量\n*   独立访客数\n*   转化率\n*   按点击付费的流量\n*   页面停留时间\n*   ……\n\n拥有这些关键绩效指标（KPI），您就能回答以下问题：我的页面是如何被访问的？何时被访问？访客在某个页面上停留了多久？人们更喜欢在哪些地方花费时间？他们是如何离开网站的？典型的页面间导航路径是怎样的？\n\
  \n了解网站上发生的情况至关重要，幸运的是，我们的架构设计正是为了在日志文件中生成数据，从而帮助我们实现这一目标。\n\n通常，点击流数据基于 Web 访问日志，这些日志由\
  \ Apache 服务器或 NGINX 等服务器生成。根据您的日志配置，每当用户访问您的网站并在页面间导航时，每个操作都会在访问日志中写入一行。图 4-4 展示了一条点击流数据所包含的信息维度。\n\
  \n![A978-1-4842-1326-1_4_Fig4_HTML.jpg](img/A978-1-4842-1326-1_4_Fig4_HTML.jpg)\n\
  \n图 4-4. 点击流数据的结构\n\n点击流数据将直接或间接地提供：\n\n*   日期信息，例如事件发生的时间戳、访客的停留时间\n*   用于浏览网站的用户代理、版本和设备信息\n\
  *   与访客关联的会话信息，这有助于关联不同的数据行：会话开始时间、结束时间、持续时间\n*   页面信息，包括访客浏览的内容、发送到服务器的请求类型、域名/子域名\n\
  *   访客 IP 地址信息，间接提供地理位置相关信息\n*   根据获取的信息类型，还可以将客户身份与点击流数据进行映射关联\n\n### 原始数据\n\n\
  在本书中，我们将使用 Apache HTTP 服务器，并通过其日志配置文件来生成点击流数据。配置相当简单，使用特定的语法将我们所需的信息呈现在日志行中。代码清单\
  \ 4-2 是 Apache HTTP 服务器生成的一条典型访问日志行。\n\n**代码清单 4-2. 访问日志行示例**\n\n```\n10.10.10.10\
  \ - - [10/July/2015:11:1:11 +0100] \"GET /path/to/my/resource HTTP/1.1\" 200 4392\
  \ \"http://www.domain.com/referring-page\" \" Mozilla/5.0 (Macintosh; Intel Mac\
  \ OS X 10_10_3) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/43.0.2357.132 Safari/537.36\"\
  \ 1224 6793\n```\n\n这一行由代码清单 4-3 中描述的 Apache 日志配置生成。\n\n**代码清单 4-3. Apache 日志配置**\n\
  \n```\nLogLevel error\n\nErrorLog  /home/example/logs/error.log\n\nLogFormat \"\
  %h %l %u %t \\\"%r\\\" %>s %b \\\"%{Referer}i\\\" \\\"%{User-Agent}i\\\" %I %O\"\
  \ combinedio\n\nCustomLog /home/example/logs/access.log combinedio\n```\n\n**加粗**的一行定义了生成的日志行的结构：\n\
  \n*   `10.10.10.10` (`%h`)：请求的 IP 地址\n*   `[10/July/2015:11:11:11 +0100]` (`%t`)：请求接收时间。格式为\
  \ `[日/月/年:时:分:秒 时区]`\n*   `GET /path/to/my/resource HTTP/1.1` (`\\\"%r\\\"`)：请求的第一行，包含请求类型、路径、协议等有用信息\n\
  *   `200` (`%>s`)：HTTP 返回码\n*   `4392` (`%b`)：返回到客户端的响应体大小（不含 HTTP 头），单位为字节\n* \
  \  `%{Referer}`：HTTP 请求头中的 Referer（引用来源）\n*   `%{User-Agent}`：HTTP 请求头中的 User Agent（用户代理）\n\
  *   `%I`：接收的字节数（包含 HTTP 头）\n*   `%O`：发送的字节数（包含 HTTP 头）\n\n可以看到，Apache 将数据组织到日志行的不同对应部分。但归根结底，接收日志的应用程序会将此数据视为非结构化数据，因为由第三方应用程序来解析它并非易事。\n\
  \n因此，您需要一种技术，既能消费这些不断追加到访问日志文件中的行（或传输整个文件），又能将这些数据转换为结构化文档，以便后续的分析和搜索。\n\n这就是 Logstash\
  \ 发挥作用的地方；接下来我们将搭建流式处理架构，并开始传输和摄入数据。\n\n### 日志生成器\n\n或许有一些公共数据集可用于测试我们的流式处理架构，但为简单起见，我更倾向于实现一个小型日志生成器来创建访问日志。我选择使用\
  \ Python 来实现这个生成器，如代码清单 4-4 所示。\n\n**代码清单 4-4. 访问日志代码生成器**\n\n```\n#!/usr/bin/python\n\
  \nimport time\nimport datetime\nimport random\n\ntimestr = time.strftime(\"%Y%m%d-%H%M%S\"\
  )\nf = open('../source/access_log_'+timestr+'.log','w')\n\n### ips\nwith open('ips.txt')\
  \ as ips_file:\n        ips = ips_file.read().splitlines()\n\n### referers\nwith\
  \ open('referers.txt') as referers_file:\n        referers = referers_file.read().splitlines()\n\
  \n### resources\nwith open('resources.txt') as resources_file:\n        resources\
  \ = resources_file.read().splitlines()\n\n### user agents\nwith open('user_agents.txt')\
  \ as user_agents_file:\n        useragents = user_agents_file.read().splitlines()\n\
  \n### codes\nwith open('codes.txt') as codes_file:\n        codes = codes_file.read().splitlines()\n\
  \n### requests\nwith open('requests.txt') as requests_file:\n        requests =\
  \ requests_file.read().splitlines()\n\nevent_time = datetime.datetime(2013,10,10)\n\
  \nfor i in xrange(0,50000):\n        increment = datetime.timedelta(seconds=random.randint(30,300))\n\
  \        event_time += increment\n        uri = random.choice(resources)\n     \
  \   if uri.find(\"Store\")>0:\n                uri += random.randint(1000,1500)\n\
  \        ip = random.choice(ips)\n        useragent = random.choice(useragents)\n\
  \        referer = random.choice(referers)\n        code = random.choice(codes)\n\
  \        request= random.choice(requests)\n        f.write('%s - - [%s] \"%s %s\
  \ HTTP/1.0\" %s %s \"%s\" \"%s\"\\n' % (random.choice(ips),event_time.strftime('%d/%b/%Y:%H:%M:%S\
  \ %z'),request,uri,coe,random.randint(2000,5000),referer,useragent))\n```\n\n这个生成器依赖于不同的文本文件，并在\
  \ `../source/access_log_` 目录下生成指定数量的日志行，如代码清单 4-5 所示。\n\n**代码清单 4-5. 启动生成器**\n\n\
  ```\n./generator.py 50000\n```\n\n上面这行命令将生成 50,000 行访问日志。您可以通过更新文本文件轻松自定义用于生成日志的内容。\n\
  \n请注意，代码清单 4-4 中使用的所有资源文件均可在以下 Github 仓库中找到：\n\n[`https://github.com/bahaaldine/scalable-big-data-architecture/tree/master/chapter4/generator`](https://github.com/bahaaldine/scalable-big-data-architecture/tree/master/chapter4/generator)\n\
  \n## 搭建流式处理架构\n\n为了搭建流式处理架构，我们将工作分为两部分：数据传输和数据处理。\n\n### 将日志传输到 Apache Kafka\n\n\
  数据传输指的是将数据从生成它的机器传输到将要摄入并处理它的机器上。这正是我们接下来要使用 Logstash-forwarder 完成的工作。然后，数据将被存储到一个异步的、可靠的持久化层中，以确保消息的可靠投递。这里使用的消息代理是\
  \ Apache Kafka。\n\n\n\n#### 转发器\n\n在下面的章节中，我们将首先安装转发器并进行配置，具体来说是由 Lumberjack（一种安全的传输协议）确保其安全性。\n\
  \n#### 安装\n\n`Logstash-forwarder` 使用 Go 语言编写，可以通过 RPM 包或直接从源码安装。我将采用第二种方式，并遵循以下步骤：\n\
  \n- 从此网址安装 Go：[`http://golang.org/doc/install`](http://golang.org/doc/install)\n\
  - 从 Git 仓库获取源码：`git clone git://github.com/elasticsearch/logstash-forwarder.git`\n\
  - 最后编译它：\n\n```\ncd logstash-forwarder\ngo build -o logstash-forwarder\n```\n\n\
  `Logstash` 的安装非常简单。你只需在以下页面下载合适的软件包：[`https://www.elastic.co/downloads/logstash`](https://www.elastic.co/downloads/logstash)\n\
  \n##### Lumberjack：安全协议\n\n`Forwarder` 将安装在数据源旁边，负责将日志传输并发送到 `Logstash` 处理器。它使用\
  \ lumberjack 协议，该协议是安全的，需要有效的私钥（`.key` 文件）和 SSL 证书（`.crt` 文件）。`Logstash-forwarder`\
  \ 和 `Logstash` 服务器都将使用这些资产来保护数据传输。\n\n要生成有效的 `KEY` 和 `CRT` 文件，请运行清单 4-6 中描述的命令。\n\
  \n清单 4-6. 密钥和证书命令行\n\n```\nopenssl req -x509  -batch -nodes -newkey rsa:2048 -keyout\
  \ lumberjack.key -out lumberjack.crt -subj /CN=localhost\n```\n\n该命令将生成 `lumberjack.key`\
  \ 和 `lumberjack.crt`。这里需要提及一个关于证书的重要事项。生成证书时使用的主题应与将在 `Logstash-forwarder` 文件中使用的主题一致。这里我们使用\
  \ `CN=local host` 生成证书，因此在转发器文件中也需要使用 `localhost`。更多相关信息可在此页面找到：[`https://github.com/elastic/logstash-forwarder#important-tlsssl-certificate-notes`](https://github.com/elastic/logstash-forwarder#important-tlsssl-certificate-notes)\n\
  \n#### 配置文件\n\n`Logstash-forwarder` 的配置由网络和文件子配置组成；清单 4-7 显示了我为示例项目使用的配置。\n\n清单\
  \ 4-7. Logstash 配置文件，可在以下位置找到：[`https://github.com/bahaaldine/scalable-big-data-architecture/blob/master/chapter4/logstash/forwarder/forwarder.json`](https://github.com/bahaaldine/scalable-big-data-architecture/blob/master/chapter4/logstash/forwarder/forwarder.json)\n\
  \n```\n{\n  \"network\": {\n    \"servers\": [ \"HOST:PORT\" ],\n    \"ssl certificate\"\
  : \"path/to/the/crt/file\",\n    \"ssl key\": \"path/to/the/key/file\",\n    \"\
  ssl ca\": \"path/to/the/crt/file\",\n    \"timeout\": 15\n  },\n  \"files\": [\n\
  \    {\n      \"paths\": [\n        \"path/to/the/log/files\"\n      ],\n      \"\
  fields\": { \"type\": \"access_log\" }\n    },\n    {\n      \"paths\": [ \"-\"\
  \ ],\n      \"fields\": { \"type\": \"stdin\" }\n    }\n  ]\n}\n```\n\n我们来稍微解释一下这个配置：\n\
  \n- 网络配置主要使用一个目标下游服务器数组，这些服务器将接收日志文件。`servers` 数组中的每一项都是指向服务器的地址，例如 `localhost:5043`。\n\
  \  - 然后 `ssl*` 条目指向我们刚刚生成的 `.key` 和 `.crt` 文件。\n  - 最后一个参数是 `timeout`，它定义了 `Logstash-forwarder`\
  \ 在认定连接中断之前等待下游服务器的时间，然后它会尝试连接到服务器数组中的另一个服务器。\n\n- `files` 条目是一个将要传输的数据的数组；在我的示例中，我使用了：\n\
  \  - 一个包含本书示例日志文件的目录的绝对路径。字段值设置了事件类型。\n  - 一个包含 `-` 的特殊路径，这意味着 `Logstash-forwarder`\
  \ 将转发标准输入内容，换句话说，就是你在命令行提示符下输入的任何内容。这是测试 `Logstash-forwarder` 和 `Logstash` 服务器之间传输管道的好方法。\n\
  \n还有更多配置文件路径的选项，例如使用通配符，这对于日志轮换非常实用。有关配置的更多信息可以在 `Logstash-forwarder` 的 Github 仓库中找到：[`https://github.com/elastic/logstash-forwarder`](https://github.com/elastic/logstash-forwarder)\n\
  \n`Logstash` 处理代理也需要一个配置文件。它遵循本章中提到的直接结构。清单 4-8 显示了我为本书使用的配置。\n\n清单 4-8. Logstash\
  \ 处理管道示例，可在以下位置找到：[`https://github.com/bahaaldine/scalable-big-data-architecture/blob/master/chapter4/logstash/processor/forwarder_to_kafka.conf`](https://github.com/bahaaldine/scalable-big-data-architecture/blob/master/chapter4/logstash/processor/forwarder_to_kafka.conf)\n\
  \n```\ninput {\n  lumberjack {\n    port => \"5043\"\n    ssl_certificate => \"\
  path/to/crt/file\"\n    ssl_key => \"path/to/key/file\"\n  }\n}\n\nfilter {\n  grok\
  \ {\n    match => {\n      \"message\" => \"%{COMBINEDAPACHELOG}\"\n    }\n  }\n\
  }\n\noutput {\n  stdout { codec => rubydebug }\n  kafka {\n    topic_id => \"clickstream\"\
  \n  }\n}\n```\n\n此配置文件包含三个部分：\n\n- **输入**：包含 `Logstash` 监听的输入流，用于接收数据。这里我们在 `localhost:5043`\
  \ 上监听我们的 `Logstash-forwarder`，并且如前所述，我们使用了 `.key` 和 `.crt` 文件。\n- **过滤器**：获取接收日志中包含的每一行，并将其转换为结构化事件。这里我们使用\
  \ `grok` 过滤器，这在处理 Apache HTTP 服务器组合日志时特别有用。`grok` 组合日志模式是多个 `grok` 模式的组合。其声明如清单\
  \ 4-9 所示。\n\n清单 4-9. Grok Apache 通用日志与组合日志模式\n\n```\nCOMMONAPACHELOG %{IPORHOST:clientip}\
  \ %{USER:ident} %{USER:auth} \\[%{HTTPDATE:timestamp}\\] \"(?:%{WORD:verb} %{NOTSPACE:request}(?:\
  \ HTTP/%{NUMBER:httpversion})?|%{DATA:rawrequest})\" %{NUMBER:response} (?:%{NUMBER:bytes}|-)\n\
  COMBINEDAPACHELOG %{COMMONAPACHELOG} %{QS:referrer} %{QS:agent}\n```\n\n- `COMBINEDAPACHELOG`\
  \ 模式依赖于另外两个模式：`COMMONAPACHELOG` 和 `QS` 模式。实际上，`grok` 附带了一组预定义的模式，这些模式可以被重用和组合来创建多级模式。你可以在以下页面获取有关\
  \ `grok` 过滤器的更多信息：[`https://www.elastic.co/guide/en/logstash/current/plugins-filters-grok.html`](https://www.elastic.co/guide/en/logstash/current/plugins-filters-grok.html)。预定义模式的更多信息在这里：[`https://github.com/elastic/logstash/blob/v1.4.2/patterns/grok-patterns`](https://github.com/elastic/logstash/blob/v1.4.2/patterns/grok-patterns)\n\
  \n- **输出**：连接到我们的 Apache Kafka 服务器以将数据放入其中。我们还使用了带有 `ruby` 编解码器的 `stdout` 输出，这对于调试管道和查看事件结构非常方便。\n\
  \n\n\n#### 消息代理\n\n现在我们将配置 Apache Kafka 集群。为此，我们将创建一个由两个代理组成的集群，并暴露一个 `clickstream`\
  \ 主题。主题本质上是一个通道，Logstash 处理器将通过该通道发布每个事件。然后，另一个程序将订阅该主题并消费消息；在我们的架构中，这一任务将由 Logstash\
  \ 或 Apache Spark 完成。\n\n下载、安装和配置 Apache Kafka 相对简单，需要遵循以下步骤：\n\n表 4-1.\n\n|   |\
  \ `server-1.properties` | `server-2.properties` |\n| --- | --- | --- |\n| `broker.id`\
  \ | 1 | 2 |\n| `port` | 9092 | 9093 |\n| `log.dirs` | `/tmp/kafka-logs-1` | `/tmp/kafka-logs-2`\
  \ |\n\n*   首先，在以下页面下载 Kafka：\n*   [`kafka.apache.org/downloads.html`](http://kafka.apache.org/downloads.html)\n\
  *   解压并访问安装目录下的 `config` 文件夹，找到 `server.properties` 文件。\n*   我们将复制该文件，并为我们的两个代理集群创建两个独立的文件。你应该会看到\
  \ `server-1.properties` 和 `server-2.properties`。\n*   如表 4-1 所示，修改这两个文件中的属性，以避免两个实例之间发生任何冲突。\n\
  \n这三个属性分别代表代理标识符、代理监听端口和代理日志目录。这两个文件可以在以下仓库中找到：\n\n[`https://github.com/bahaaldine/scalable-big-data-architecture/tree/master/chapter4/kafka`](https://github.com/bahaaldine/scalable-big-data-architecture/tree/master/chapter4/kafka)\n\
  \n现在，我们可以开始连接各个部分并运行架构的第一部分来进行验证了。\n\n#### 运行魔法\n\n我们将从下游到上游依次运行传输部分的每个模块；因此，我们先从\
  \ Kafka 开始。Kafka 依赖 Apache Zookeeper 来管理代理集群；我们将首先在安装目录下使用清单 4-10 所示的命令启动它。\n\n\
  清单 4-10. Zookeeper 启动命令\n\n```\nbin/zookeeper-server-start.sh config/zookeeper.properties\n\
  ```\n\n这会输出一定数量的日志行，但你应该会看到一些指示 Zookeeper 服务器正在运行的信息，如清单 4-11 所示。\n\n清单 4-11. Zookeeper\
  \ 启动日志\n\n```\n...\n[2015-07-11 22:51:39,787] INFO Starting server (org.apache.zookeeper.server.ZooKeeperServerMain)\n\
  ...\n[2015-07-11 22:51:39,865] INFO binding to port 0.0.0.0/0.0.0.0:2181 (org.apache.zookeeper.server.NIOServerCnxnFactory)\n\
  ...\n```\n\n现在，我们将使用清单 4-12 所示的命令启动两个代理实例。\n\n清单 4-12. Kafka 服务器启动命令\n\n```\nbin/kafka-server-start.sh\
  \ path/to/server-1.properties &\nbin/kafka-server-start.sh path/to/server-2.properties\
  \ &\n```\n\n你会看到第一个代理的日志行，如清单 4-13 所示。\n\n清单 4-13. 第一个代理启动日志行\n\n```\n[2015-07-11\
  \ 22:59:36,934] INFO [Kafka Server 1], started (kafka.server.KafkaServer)\n[2015-07-11\
  \ 22:59:37,006] INFO New leader is 1 (kafka.server.ZookeeperLeaderElector$LeaderChangeListener)\n\
  ```\n\n清单 4-14 显示了第二个代理的日志行。\n\n清单 4-14. 第二个代理启动日志行\n\n```\n[2015-07-11 23:00:46,592]\
  \ INFO [Kafka Server 2], started (kafka.server.KafkaServer)\n```\n\n清单 4-15 显示了如何在我们的集群中创建一个主题。\n\
  \n清单 4-15. Kafka 创建主题命令\n\n```\nbin/kafka-topics.sh --create --zookeeper localhost:2181\
  \ --replication-factor 3 --partitions 1 --topic clickstream\n```\n\n为什么 `replication-factor`\
  \ 是 2？因为我们的集群可以在不发生数据丢失的情况下，容忍最多一台服务器故障。\n\n为了确保传输部分的消息可以在下游被消费，我们将运行一个测试消费者，如清单\
  \ 4-16 所示。\n\n清单 4-16. Kafka 测试消费者命令\n\n```\nbin/kafka-console-consumer.sh --zookeeper\
  \ localhost:2181 --from-beginning –topic clickstream\n```\n\n现在，让我们从 Logstash 代理安装目录运行\
  \ Logstash 处理代理，如清单 4-17 所示。\n\n清单 4-17. Logstash 处理代理启动命令\n\n```\n/bin/logstash\
  \ -f /path/to/forwarder_to_kafka.conf\n```\n\n其输出应如清单 4-18 所示。\n\n清单 4-18. Logstash\
  \ 启动日志\n\n```\nLogstash startup completed\n```\n\n最后，`logstash-forwarder` 如清单 4-19\
  \ 所示。\n\n清单 4-19. Logstash-forwarder 启动命令\n\n```\n/Applications/logstash-forwarder/logstash-forwarder\
  \ -config forwarder.json\n```\n\n这应该会生成清单 4-20 所示的输出。\n\n清单 4-20. Logstash-forwarder\
  \ 启动日志\n\n```\n2015/07/12 00:00:29.085015 Connecting to [::1]:5043 (localhost)\n\
  2015/07/12 00:00:29.246207 Connected to ::1\n```\n\n我们已经准备好生成访问日志文件，并通过传输管道查看数据流；启动脚本，并生成一行日志，如清单\
  \ 4-21 所示。\n\n清单 4-21. 日志生成器启动命令\n\n```\n./generator.py 1\n```\n\n让我们检查 Logstash\
  \ 处理器的日志，如清单 4-22 所示。\n\n清单 4-22. Logstash 处理器日志\n\n```\n{\n```\n\n\n\n如上文所述，`stdout`\
  \ 输出中的 `ruby` 编解码器对于查看流式事件的内容非常实用。在之前的日志中，我们可以看到 `grok` 已经完成了它的工作，解析了日志行，并将事件正确地结构化为了预期的格式。\n\
  \n现在，我们也应该在 Kafka 消费者端看到相同的消息，但格式为 JSON，如列表 4-23 所示。\n\n**列表 4-23.** Kafka 消费者日志文件\n\
  \n```\n{\n    \"message\": \"10.10.10.15 - - [10\\/Oct\\/2013:00:03:47 +0000] \\\
  \"GET \\/products\\/product3 HTTP\\/1.0\\\" 401 3627 \\\"http:\\/\\/www.amazon.com\\\
  \" \\\"Mozilla\\/5.0 (Windows; U; MSIE 9.0; WIndows NT 9.0; en-US))\\\" \",\n  \
  \  \"@version\": \"1\",\n    \"@timestamp\": \"2015-07-11T22:19:19.879Z\",\n   \
  \ \"file\": \"\\/Users\\/bahaaldine\\/Dropbox\\/apress\\/demo\\/chapter 4 \\/source\\\
  /access_log_20150712-001915.log\",\n    \"host\": \"MBPdeBaaaldine2\",\n    \"offset\"\
  : \"0\",\n    \"type\": \"access_log\",\n    \"clientip\": \"10.10.10.15\",\n  \
  \  \"ident\": \"-\",\n    \"auth\": \"-\",\n    \"timestamp\": \"10\\/Oct\\/2013:00:03:47\
  \ +0000\",\n    \"verb\": \"GET\",\n    \"request\": \"\\/products\\/product3\"\
  ,\n    \"httpversion\": \"1.0\",\n    \"response\": \"401\",\n    \"bytes\": \"\
  3627\",\n    \"referrer\": \"\\\"http:\\/\\/www.amazon.com\\\"\",\n    \"agent\"\
  : \"\\\"Mozilla\\/5.0 (Windows; U; MSIE 9.0; WIndows NT 9.0; en-US))\\\"\"\n}\n\
  ```\n\n到目前为止一切顺利；我们现在确信我们的数据传输和处理管道能够端到端地工作。接下来，我们进入数据提取端并对数据进行索引。\n\n## 从 Apache\
  \ Kafka 提取日志\n\n数据提取是指使用一个消费者代理，该代理连接到 Kafka 并消费主题中的消息。这项工作将再次由 Logstash 完成，但这次会为代理使用不同的配置，因为后者将在\
  \ Elasticsearch 中对数据进行索引。\n\n### 配置 Elasticsearch\n\n在提取数据之前，我们需要配置我们的端点——Elasticsearch\
  \ 集群。\n\n#### 安装\n\n无论我们使用何种方法（从 Logstash 或 Spark）将数据索引到 Elasticsearch，都需要搭建一个 Elasticsearch\
  \ 集群。本书将模拟一个实际示例，并在单个节点集群上工作，但添加更多 Elasticsearch 节点只需几秒钟。\n\n从以下链接下载并解压 Elasticsearch：\n\
  \n[`https://www.elastic.co/downloads/elasticsearch`](https://www.elastic.co/downloads/elasticsearch)\n\
  \n解压后，您需要安装一个名为 Marvel 的插件，它将帮助我们更好地了解 Elasticsearch 内部发生的情况。为此，请进入解压后的 Elasticsearch\
  \ 文件夹，并运行以下命令：\n\n`bin/plugin -i elasticsearch/marvel/latest`\n\n值得一提的是，本书使用的 Marvel\
  \ 版本与最新版本相比，该命令可能有所不同。有关更多信息，请参阅此处的 Marvel 安装文档：\n\n[`https://www.elastic.co/guide/en/marvel/current/installing-marvel.html`](https://www.elastic.co/guide/en/marvel/current/installing-marvel.html)\n\
  \n这将在几秒钟内安装好 Marvel。然后运行 Elasticsearch：\n\n`bin/elasticsearch`\n\n在浏览器中访问以下 Marvel\
  \ 控制台的 URL，然后从右上角的菜单中选择“分片分配”：`http://localhost:9200/_plugin/marvel`，如图 4-5 所示。\n\
  \n![A978-1-4842-1326-1_4_Fig5a_HTML.jpg](img/A978-1-4842-1326-1_4_Fig5a_HTML.jpg)\n\
  ![A978-1-4842-1326-1_4_Fig5b_HTML.jpg](img/A978-1-4842-1326-1_4_Fig5b_HTML.jpg)\n\
  \n**图 4-5.** 访问分片分配仪表盘\n\n如您所见，Marvel 提示集群中有两个未分配的副本，这导致集群的整体状态为黄色。只要我们运行的是单实例集群，这种情况就完全正常。Elasticsearch\
  \ 不会将副本分片分配到与主分片相同的节点上；那样做是没有意义的。请记住，副本分片为您的集群提供了弹性恢复能力；在我们的情况下，我们需要启动另一个 Elasticsearch\
  \ 实例，但由于我们处于测试环境，这似乎有点过头了。那么，让我们通过使用 Elasticsearch 索引设置 API 来更改集群配置：点击右侧菜单中的“Sense”切换到\
  \ Sense 控制台，您将进入 Sense 控制台，该控制台通过自动补全功能帮助您轻松运行 API 查询。\n\n我们在这里要做的是将集群中创建的索引里的每个分片的副本数更新为\
  \ 0，并将集群状态变为绿色。复制并粘贴列表 4-24 中的查询，然后点击运行按钮。\n\n**列表 4-24.** 将副本数更新为 0 的索引 API\n\n\
  ```\nPUT /_settings\n{\n    \"index\" : {\n        \"number_of_replicas\" : 0\n\
  \    }\n}\n```\n\nSense 将返回一个确认响应，如图 4-6 所示。\n\n![A978-1-4842-1326-1_4_Fig6_HTML.jpg](img/A978-1-4842-1326-1_4_Fig6_HTML.jpg)\n\
  \n**图 4-6.** 查询结果\n\n如您所见，这个请求非常容易理解：它使用了设置 API，并发送了一个包含 `index` 对象的 PUT 请求，以指定索引中的每个分片应有\
  \ 0 个副本。现在，如果您回到分片分配视图，您应该会看到集群状态变为绿色。\n\n\n\n### 创建索引模板\n\n现在我们将为数据创建映射，并为索引、文档和字段设置正确的参数。在\
  \ Sense 中，发出清单 4-25 中描述的请求。\n\n**清单 4-25.** 点击流索引模板\n\n```\nPUT _template/clickstream\n\
  {\n  \"template\": \"clickstream-*\",\n  \"settings\": {\n    \"number_of_shards\"\
  : 1,\n    \"number_of_replicas\": 0\n  },\n  \"mappings\": {\n    \"_default_\"\
  : {\n      \"dynamic_templates\": [\n        {\n          \"string_fields\": {\n\
  \            \"mapping\": {\n              \"index\": \"not_analyzed\",\n      \
  \        \"omit_norms\": true,\n              \"type\": \"string\"\n           \
  \ },\n            \"match_mapping_type\": \"string\",\n            \"match\": \"\
  *\"\n          }\n        }\n      ],\n      \"_all\": {\n        \"enabled\": true\n\
  \      },\n      \"properties\": {\n        \"response\": { \"type\": \"integer\"\
  },\n        \"bytes\": { \"type\": \"integer\" }\n      }\n    }\n  }\n}\n```\n\n\
  我们正在创建一个名为 `clickstream` 的模板，该模板将应用于 Elasticsearch 中创建的名称与 `clickstream-*` 正则表达式匹配的所有索引。我们将在本章后面看到这样做的原因。它包含主要部分：\n\
  \n*   **设置**：我们在此定义了集群中点击流索引所需的 `shard` 和 `replica` 数量。这与我们之前所做的等效，但现在已打包在模板中并应用于每个新的点击流索引。\n\
  *   **映射**：这定义了 Elasticsearch 应如何分析数据。Elasticsearch 有一个非常重要的概念，称为分析器，它基本上定义了我们的字段应如何为搜索目的进行解释和结构化。例如，您可以使用分词器并将字段内容拆分为多个\
  \ `token`。分析器的概念非常丰富，我建议您阅读以下文档，以更好地理解这里发生的事情：\n    *   [`www.elastic.co/guide/en/elasticsearch/reference/1.6/analysis-analyzers.html`](https://www.elastic.co/guide/en/elasticsearch/reference/1.6/analysis-analyzers.html)\n\
  *   我选择默认不分析任何 `string` 字段，因此这些字段基本上可以按原样搜索。然后，我为 `response` 和 `bytes` 字段应用了特定的映射，以告知\
  \ Elasticsearch 这些字段将是整数。\n\n请记住，映射应在索引之前完成；否则，您将不得不重新索引整个数据。\n\n### 直接使用 Logstash\
  \ 索引数据\n\n现在 Elasticsearch 已配置并运行，我们可以启动 Logstash 索引器实例并耗尽 Kafka。\n\n#### 配置文件\n\
  \n要存储由点击流日志记录架构创建的文档，我们可以创建一个单独的索引并将所有内容存储在其中。但是随着站点流量的增长，数据量也会增长，因此我们应该考虑按时间分割索引，这在此处更有意义。\n\
  \n例如，考虑到您获取的数据越多，您拥有的旧数据可能就越没用，这些旧数据可能会被归档，以便为较新的数据留出更多的服务器资源。好消息是，这非常简单，并且直接在索引级别完成，换句话说，由\
  \ Logstash 完成。\n\n清单 4-26 是我们的 Logstash 索引器的配置。\n\n**清单 4-26.** Logstash 索引器配置，可在\
  \ [`https://github.com/bahaaldine/scalable-big-data-architecture/blob/master/chapter4/logstash/indexer/kafka_to_elasticsearch.conf`](https://github.com/bahaaldine/scalable-big-data-architecture/blob/master/chapter4/logstash/indexer/kafka_to_elasticsearch.conf)\
  \ 找到\n\n```\ninput {\n  kafka {\n    topic_id => \"clickstream\"\n  }\n}\n\nfilter\
  \ {\n}\n\noutput {\n  stdout { codec => rubydebug }\n  elasticsearch {\n    index\
  \ => \"clickstream-%{+YYYY.MM.dd}\"\n    manage_template => false\n    host => localhost\n\
  \    protocol => http\n  }\n}\n```\n\n如您所见，与处理代理相比，配置相当简单，并且附带了一个新的输出，专门用于索引到 Elasticsearch，具有以下设置：\n\
  \n*   `index`：是我们希望将数据索引到的索引名称；这里的索引是一个模式，将生成一个基于日期的索引名称。\n*   `manage_template`：Logstash\
  \ 是否应管理索引模板；因为我们之前已经创建了一个，所以不需要。\n*   `host` 和 `protocol`：这些很明显，指向我们的 Elasticsearch\
  \ 集群。\n\n#### 运行并索引数据\n\n让我们运行 Logstash 索引器，看看 Elasticsearch 中发生了什么。发出如清单 4-27 所示的命令。\n\
