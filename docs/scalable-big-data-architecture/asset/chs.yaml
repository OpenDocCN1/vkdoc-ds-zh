  Watcher（一个警报和通知系统）。本书不会使用这些商业产品。


  相反，我们将主要使用 `ElasticSearch` 作为一个搜索引擎，来存储由 Spark 产生的数据。经过处理和聚合后，数据被索引到 `ElasticSearch`
  中，以便第三方系统能够通过 `ElasticSearch` 查询引擎来查询数据。另一方面，我们也使用 ELK 来处理日志和可视化分析，但这是从平台运维的角度出发。有关
