  \ Elasticsearch 存储并返回，并且符合我们上游配置的结构。\n\n\n\n### 创建点击流别名\n\n我需要在 Elasticsearch 中配置的最后一件事就是别名。如前所述，索引将基于时间创建，例如每天，因此我们最终会得到\
  \ N 个索引，但我们可能希望对所有索引进行搜索和分析。\n\n为了将所有索引归入一个名称，我们将创建一个指向所有索引的别名。客户端应用只需知道别名即可访问数据。在\
  \ Sense 中执行如清单 4-30 所示的 API 查询来创建别名。\n\n**清单 4-30.** 使用 clickstream 别名\n\n```json\n\
  POST /_aliases\n{\n  \"actions\" : [\n      { \"add\" : { \"index\" : \"clickstream-*\"\
  , \"alias\" : \"clickstream\" } }\n  ]\n}\n```\n\n现在，在 Sense 中，你可以执行如清单 4-31 所示的命令，并得到与之前查询完全相同的结果。\n\
  \n**清单 4-31.** 使用 clickstream 别名查询\n\n```json\nGET /clickstream/_search\n{\n  \"\
  query\": {\n    \"match_all\": {}\n  }\n}\n```\n\n## 总结\n\n我们的流式/日志架构现已准备就绪，可以接收数据并将其索引到分布式持久化数据存储中，例如\
  \ Elasticsearch。在下一章中，我们将看到如何使用 Elasticsearch API 进行近实时查询，并将看到本摄取架构第二部分的实现：Spark\
  \ 处理部分。\n\n"
- "# 5. 查询与分析模式\n\n进入数据可视化的方法有很多种，首先要制定分析策略，该策略应能让我们实时识别数据中的模式，同时也能通过持续处理来利用已摄取的数据。这就是本章将要介绍的内容，具体包括如何集成\
  \ Spark、在 Elasticsearch 中进行分析，最终在 Kibana 中可视化我们的工作成果。\n\n## 定义分析策略\n\n在本节中，我们将介绍两种不同的数据分析方法：一种是持续处理数据并更新文档存储中的分析结果，另一种是按需进行实时查询。最后我们会发现，在可扩展的架构中，并没有非黑即白的策略；你很可能最终会两者兼用，但通常是从其中一种开始。\n\
  \n### 持续处理\n\n我所说的持续处理，是指能够随着批次数据的到来，从中提取关键绩效指标和度量值。这是流式架构中的一个常见用例，一旦设置好，可以带来很多好处。这里的思路是依赖一项技术，它需要具备以下特性：\n\
  \n-   分布式\n-   有弹性\n-   能进行近实时处理\n-   在服务器和处理能力方面可扩展\n\nSpark 是在该架构中扮演此角色的绝佳候选者；你基本上可以集成\
  \ Spark 和 Kafka 来实现持续的批处理。实际上，Spark 会按批次间隔从 Kafka 主题中消费消息，并在将数据索引到数据存储（显然是 Elasticsearch）之前对数据应用处理：\n\
  \n-   第一个好处是减轻数据存储的处理负担\n-   第二个好处是能够拥有像 Spark 这样可扩展的处理层。你可以随着时间的推移添加更多执行不同类型处理的\
  \ Spark Kafka 消费者。\n\n典型的处理方式是对批次数据进行聚合，例如在我们的例子中，统计查询次数、404 错误数量、一段时间内与用户的数据交换量等等。但最终，这种处理可以发展到利用\
  \ Spark 的机器学习功能对数据进行预测。\n\n一旦处理后的数据由 Kafka 传递出来，再由 Spark 进行流式处理和处理，它们就应该可用于分析和搜索。这时\
  \ Elasticsearch 就登场了，它允许用户实时访问数据。\n\n### 实时查询\n\n实时查询消除了对传统批处理架构（如 Hadoop 相关发行版）的依赖，这类架构部署起来可能很笨重，并且不是最终用户所期望的。\n\
  \n如今，你通常希望立即获得信息，而不是五分钟或第二天之后。\n\n实时查询策略的效率取决于你使用的数据存储。它还应提供一组 API，让用户能够从大量数据中大规模地提取关键信息。\n\
  \nElasticsearch 做到了这一点：它支持通过聚合框架运行聚合查询，以进行近实时的文档分组或文档字段数据计算。\n\n借助实时查询和 Elasticsearch\
  \ 开箱即用的聚合能力，我们可以构建一个摄取管道，消除从数据被摄取到数据在 Elasticsearch 中被索引这段时间内的所有处理。换句话说，这个管道可以简化为使用\
  \ Logstash 将数据从 Kafka 中排出，并索引到 Elasticsearch 中。\n\n这里的思路是，要判断哪些工作应该由 Spark 处理，哪些应该留给\
  \ Elasticsearch。我们会看到，使用 Elasticsearch 实现简单的分组聚合会非常方便。\n\n## 使用 Spark 处理并索引数据\n\n\
  为了使用 Spark 摄取数据，我们首先需要实现一个 Spark 流式处理代理，它会从 Kafka 消费数据，然后进行处理并索引到 Elasticsearch。接下来，我们将\
  \ Spark 的摄取过程分成两部分：流式处理器和索引器。\n\n**注意**，本章使用的代码可以在以下仓库中找到：[`https://github.com/bahaaldine/scalable-big-data-architecture/tree/master/chapter5/spark-scala-streamer`](https://github.com/bahaaldine/scalable-big-data-architecture/tree/master/chapter5/spark-scala-streamer).\n\
  \n\n\n### 准备 Spark 项目\n\n为了实现流式代理，我们将使用 Spark Streaming，这是一个可靠、容错的 API，用于从各种数据源流式传输数据。更多信息请访问：\n\
  [`https://spark.apache.org/streaming/`](https://spark.apache.org/streaming/)\n\n\
  到目前为止，我们不会对接收到的数据进行结构化处理。我们的目标是建立流式传输本身，从 Kafka 摄取数据流，并能够将其打印出来。我习惯使用 Eclipse (Mars\
  \ 4.5) 来实现我的 Java (1.8)/Scala(2.10) 项目。IntelliJ 也是一款非常优秀的 IDE，在 Scala 应用程序中非常流行。\n\
  \n我们需要做的第一件事是创建一个具有所需依赖项的 Spark 项目结构。为此，我们将使用 Maven 和一个可以在 Github 上轻松找到的 Spark 原型。在我的示例中，我将使用：\n\
  [`https://github.com/mbonaci/spark-archetype-scala`](https://github.com/mbonaci/spark-archetype-scala)\n\
  \n使用这个原型，你可以简单地生成一个 Scala 项目，然后就可以在 Eclipse 中使用它。执行清单 5-1 中所示的命令。\n\n**清单 5-1.**\
  \ Spark Scala 原型生成\n```\nmvn archetype:generate \\\n  -DarchetypeCatalog=https://github.com/mbonaci/spark-archetype-scala/raw/master/archetype-catalog.xml\
  \ \\\n  -DarchetypeRepository=https://github.com/mbonaci/spark-archetype-scala/raw/master\
  \ \\\n  -DgroupId=org.apress.examples \\\n  -DartifactId=spark-scala-streamer \\\
  \n  -Dversion=1.0-SNAPSHOT\n```\n请注意，此处用于换行的转义字符应根据操作系统进行调整；例如，在 Windows 上应该是« ^\
  \ »。\n\nMaven 会提示并要求确认，然后才生成项目。完成这些步骤并最终完成创建。然后，你应该会得到如图 5-1 所示的目录结构。\n\n![A978-1-4842-1326-1_5_Fig1_HTML.jpg](img/A978-1-4842-1326-1_5_Fig1_HTML.jpg)\n\
  \n**图 5-1.** Spark Scala 项目目录结构\n\n为了使 Maven 能够正确地编译和打包你的应用程序，这个目录结构非常重要。\n\n我们要做的第一件事是理解\
  \ Maven 为我们生成的示例应用程序。\n\n### 理解基本的 Spark 应用程序\n\nSpark 原型的好处是生成了一个示例应用程序，它给出了 Spark\
  \ 程序的基本结构。它首先从 Spark 上下文的配置开始，然后处理数据，并将该处理的结果发送到输出。\n\n在示例程序（`App.scala` 文件）中，`SparkContext`\
  \ 的配置包括设置应用程序名称（该名称将出现在集群元数据中）以及我们将在其上执行应用程序的集群，如清单 5-2 所示。\n\n**清单 5-2.** Spark\
  \ 上下文配置\n```\nval conf = new SparkConf()\n  .setAppName(\"The swankiest Spark app\
  \ ever\")\n  .setMaster(\"local[2]\")\n```\n这里我们使用了特殊值 `local[2]`，这意味着我们希望使用本地 Spark\
  \ 运行时（两个线程）在本地机器上运行应用程序。这对于测试目的非常方便，我们将在本书中使用这种方法。\n\n配置完成后，我们将使用清单 5-3 所示的配置创建一个新的\
  \ Spark 配置。\n\n**清单 5-3.** Spark 创建\n```\nval sc = new SparkContext(conf)\n```\n\
  然后，示例程序创建一个数据集，如清单 5-4 所示。\n\n**清单 5-4.** Spark 数据集创建\n```\nval col = sc.parallelize(0\
  \ to 100 by 5)\n```\n实际上，这行代码包含两个步骤：\n-   首先，它创建一个集合，包含从 0 到 100 的每五个数字。\n-   然后，Spark\
  \ 通过将该集合复制到一个分布式数据集中来并行化它。换句话说，根据集群的拓扑结构，Spark 将并行处理此数据集。该数据集通常称为弹性分布式数据集（RDD）。\n\
  \n请注意，这里我们没有设置想要将数据集分割成的分区数量，因为我们让 Spark 来处理，但我们可以像清单 5-5 所示那样对数据进行分区。\n\n**清单 5-5.**\
  \ Spark 手动添加分区\n```\nval col = sc.parallelize(0 to 100 by 5, 2)\n```\n最后，我们使用 Spark\
  \ 示例函数转换数据，该函数生成一个新的 RDD，其中包含一个新的值集合，如清单 5-6 所示。\n\n**清单 5-6.** Spark 创建新的 RDD\n\
  ```\nval smp = col.sample(true, 4)\n```\n这里我们使用了一个种子值为四的数字生成器。如果你想打印出生成的样本内容，请使用如清单\
  \ 5-7 所示的镜像映射函数。\n\n**清单 5-7.** Spark 使用镜像映射函数\n```\nsmp.map(x => x).collect\n```\n\
  这将打印出类似清单 5-8 所示的内容。\n\n**清单 5-8.** Spark 处理输出\n```\nArray(0, 0, 0, 0, 0, 5, 5,\
  \ 5, 5, 10, 10, 15, 15, 15, 15, 15, 20, 20, 20, 20, 25, 30, 30, 35, 35, 35, 35,\
  \ 35, 35, 35, 35, 40, 40, 45, 45, 55, 55, 55, 55, 60, 65, 70, 70, 70, 70, 70, 70,\
  \ 70, 75, 75, 75, 75, 80, 80, 80, 80, 85, 85, 90, 90, 100, 100, 100, 100, 100)\n\
  ```\n如果你使用清单 5-9 的命令运行示例应用程序：\n\n**清单 5-9.** Spark 启动命令\n```\nmvn scala:run -DmainClass=org.apress.examples.App\n\
  ```\n代码的最后部分（清单 5-10）：\n\n**清单 5-10.** Spark 驱动程序代码\n```\nval colCount = col.count\n\
  val smpCount = smp.count\nprintln(\"orig count = \" + colCount)\nprintln(\"sampled\
  \ count = \" + smpCount)\n```\n将打印出：\n\n**清单 5-11.** Spark 驱动程序输出\n```\norig count\
  \ = 21\nsampled count = 78\n```\n这个 Spark 应用程序被称为 Spark 驱动程序。显然，这个示例很容易理解，并且只使用了很少的功能，但它给出了驱动程序结构的一般概念。在我们的用例中，我们希望通过\
  \ Spark 实现的目标是能够以分布式方式处理大量数据，消化它们，然后在架构中将它们发送到下游。\n\n\n\n### 实现 Spark Streamer\n\
  \n在现有架构中引入 Spark 并不需要修改我们在第 4 章中已经看到的内容；只需为我们的 Kafka 点击流主题添加一个新的消费者，如图 5-2 所示。\n\
  \n![A978-1-4842-1326-1_5_Fig2_HTML.jpg](img/A978-1-4842-1326-1_5_Fig2_HTML.jpg)\n\
  \n**图 5-2.** 将 Spark Kafka 流式处理添加到我们的架构中\n\n我们的 Spark 驱动程序应该能够连接到 Kafka 并消费数据流。为此，我们将配置一个名为\
  \ `StreamingContext` 的特殊 Spark 上下文，如代码清单 5-12 所示。\n\n**代码清单 5-12.** 配置 Spark Streaming\
  \ 上下文\n\n```\nval sparkConf = new SparkConf().setAppName(\"KafkaStreamerToElasticsearch\
  \ \")\nsparkConf.set(\"es.index.auto.create\", \"true\")\nval ssc = new StreamingContext(sparkConf,\
  \ Seconds(2))\n```\n\n如您所见，上下文配置与之前的 Spark 驱动程序示例基本相同，区别如下：\n\n- 我们使用 `es.index.auto.create`\
  \ 选项来确保在数据索引时，索引会自动在 Elasticsearch 中创建。\n- 我们将 `StreamingContext` 的批处理间隔设置为 2 秒，这意味着数据将每隔\
  \ 2 秒从 Kafka 主题流式传输一次。\n\n我们现在需要配置要从哪些代理（brokers）和哪些主题（topics）接收数据，然后在这两者之间创建流式传输线路，如代码清单\
  \ 5-13 所示。\n\n**代码清单 5-13.** 连接 Spark 和 Kafka\n\n```\nval Array(brokers, topics)\
  \ = args\nval topicsSet = topics.split(\",\").toSet\nval kafkaParams = MapString,\
  \ String\nval messages = KafkaUtils.createDirectStreamString, String, StringDecoder,\
  \ StringDecoder\n```\n\n`args` 变量包含运行驱动程序时传递给它的参数。代理列表和主题列表都用逗号分隔。解析后，使用 Spark 流式框架（`org.apache.spark.streaming`\
  \ 包）提供的 `KafkaUtils` 类在 Kafka 和 Spark 之间创建直接流。在我们的示例中，所有消息都接收在 `messages` 变量中。\n\
  \n此时，我们应该能够使用代码清单 5-14 中的 `map` 函数输出每条流式传输的点击流日志行。\n\n**代码清单 5-14.** 映射并打印行\n\n\
  ```\nval lines = messages.map(_._2)\nlines.print();\n```\n\n前面几行中有几点需要留意：\n\n- `messages`\
  \ 变量是一个包含流式数据的 RDD。\n- `_` 语法表示匿名函数中的一个参数，如代码清单 5-15 所示。\n\n**代码清单 5-15.** Spark\
  \ `map` 函数简化语法\n\n```\nmap(_._2)\n```\n\n这等价于代码清单 5-16 中所示的一行，其中 `_2` 是 `x` 元组的第二个元素。\n\
  \n**代码清单 5-16.** Spark `map` 函数完整语法\n\n```\nmap(x => x._2)\n```\n\n要运行驱动程序，我们首先要使用\
  \ Maven 构建它。运行以下命令来编译 Scala 代码并将其打包成一个 JAR：\n\n```\nmvn scala:compile package\n\
  ```\n\n请注意，对于该驱动程序，我使用的是 Scala 2.10.5，它需要 Java 7 才能运行：\n\n```\nexport JAVA_HOME=/Library/Java/JavaVirtualMachines/jdk1.7.0_21.jdk/Contents/Home/\n\
  ```\n\n编译并打包后，您应该在项目的 `target` 目录中得到两个 JAR 文件：\n\n- `spark-scala-streamer-1.0.0.jar`：仅包含编译后的项目类。\n\
  - `spark-scala-streamer-1.0.0-jar-with-dependencies.jar`：包含编译后的类和项目依赖项。\n\n我们将使用与上一部分略有不同的方法来运行驱动程序：使用标准\
  \ Spark 发行版中的 `spark-submit` 可执行文件，该发行版可从此处下载：\n\n[`http://spark.apache.org/downloads.html`](http://spark.apache.org/downloads.html)\n\
  \n在撰写本文时，我使用的是 1.4.0 版本。下载后，我建议您只需将 Spark 二进制文件添加到您的 `PATH` 环境变量中，如代码清单 5-17 所示。\n\
  \n**代码清单 5-17.** 将 Spark 二进制文件添加到 `PATH` 环境变量\n\n```\nexport SPARK_HOME=/Applications/spark-1.4.0/bin\n\
  export PATH=$SPARK_HOME:$PATH\n```\n\n这将简化对所有 Spark 可执行文件的访问，包括 `spark-submit`，您可以像代码清单\
  \ 5-18 中那样使用它来执行我们之前的程序。\n\n**代码清单 5-18.** 使用 `spark-submit` 运行 Spark 驱动程序\n\n```\n\
  spark-submit --class org.apress.examples.chapter4.KafkaStreamer \\\n  --master local[1]\
  \ \\\n  target/spark-scala-streamer-1.0.0-jar-with-dependencies.jar \\\n  localhost:9092,localhost:9093\
  \ clickstream\n```\n\n如您所见，我们将 `KafkaStreamer`（它属于我们刚刚创建的 JAR）传递给 `spark-submit`。我们使用带有依赖项的\
  \ JAR，否则 Spark 将找不到所需的类，您很可能会遇到“找不到类”异常。在命令末尾，您可能已经认出了包含代理列表（我们要连接的目标）和主题（我们要从中流式传输数据的目标）的参数。运行此命令会启动\
  \ Spark 并监听传入消息，因此请使用我们在上一部分中使用的生成器生成日志行，并确保流式处理管道正在运行以便将消息推送到 Kafka 中。您应该在控制台中看到一些行输出，如代码清单\
  \ 5-19 所示。\n\n**代码清单 5-19.** Spark 流式传输的数据示例\n\n```\n-------------------------------------------\n\
