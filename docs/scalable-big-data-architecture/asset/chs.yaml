  \n\n\n### 实现 Spark 索引器\n\n索引部分是驱动程序的最后一部分，但令人意外的是，我们并没有将其配置推迟到最后一步。\n\n这里我们要做的是确保我们消费的每个点击流事件都可以被索引到\
  \ ElasticSearch 中。点击流事件实际上是字符串流形式接收的 JSON；然后我们需要解析该字符串，将其编组为 JSON RDD，然后创建一个 `Clickstream`\
  \ 对象的 RDD。\n\n首先，让我们定义我们的 `Clickstream` 对象，如清单 5-20 所示。\n\n**清单 5-20.** Clickstream\
  \ 对象\n\n```\ncase class Clickstream (\n   message:String,\n   version:String,\n\
  \   file:String,\n   host:String,\n   offset:String,\n   eventType:String,\n   clientip:String,\n\
  \   ident:String,\n   auth:String,\n   timestamp:String,\n   verb:String,\n   request:String,\n\
  \   httpVersion:String,\n   response:String,\n   bytes:Integer,\n   referrer:String,\n\
  \   agent: String\n)\n```\n\n除了 `bytes` 字段，我们假定其他所有字段都是 `String` 类型。现在让我们解析 JSON\
  \ 字符串的每一行，如清单 5-21 所示。\n\n**清单 5-21.** Spark 解析行\n\n```\nval parsedEvents =\nlines.map(JSON.parseFull(_))\n\
  \     .map(_.get.asInstanceOf[scala.collection.immutable.Map[String,Any]])\n```\n\
  \n这些行分两步处理：\n\n*   每一行使用 `JSON.parseFull` 进行解析\n*   对于每个 JSON，RDD 被转换为一个键值对映射表。\n\
  \n最后，从 `parsedEvents` 变量中提取出点击流事件 RDD，如清单 5-22 所示。\n\n**清单 5-22.** Spark Clickstream\
  \ 对象解析\n\n```\nval events = parsedEvents.map(data=>Clickstream(\n   data(\"message\"\
  ).toString\n   ,data(\"@version\").toString\n   ,data(\"file\").toString\n   ,data(\"\
  host\").toString\n   ,data(\"offset\").toString\n   ,data(\"type\").toString\n \
  \  ,data(\"clientip\").toString\n   ,data(\"ident\").toString\n   ,data(\"auth\"\
  ).toString\n   ,data(\"timestamp\").toString\n   ,data(\"verb\").toString\n   ,data(\"\
  request\").toString\n   ,data(\"httpversion\").toString\n   ,data(\"response\").toString\n\
  \   ,Integer.parseInt(data(\"bytes\").toString)\n   ,data(\"referrer\").toString\n\
  \   ,data(\"agent\").toString\n))\n```\n\n我们简单地在每个已解析的事件 Map 和新的 Clickstream 事件对象之间建立映射。然后，最后我们使用\
  \ Elasticsearch Hadoop 连接器对数据进行索引，如清单 5-23 所示。\n\n**清单 5-23.** 索引到 Elasticsearch\
  \ 的 Clickstream 事件\n\n```\nevents.foreachRDD{ rdd =>\nif (rdd.toLocalIterator.nonEmpty)\
  \ {\n          EsSpark.saveToEs(rdd, \"spark/clickstream\")\n        }\n}\n```\n\
  \n我正在创建一个与上一章中 Logstash 创建的索引不同的索引。数据位于 `spark` 索引下的 `clickstream` 类型中。\n\n你可以在此链接找到关于\
  \ Elasticsearch Hadoop 连接器的更多信息：\n\n[`https://www.elastic.co/guide/en/elasticsearch/hadoop/current/index.html`](https://www.elastic.co/guide/en/elasticsearch/hadoop/current/index.html)\n\
  \n至此，你应该能够在生成数据后将数据索引到 Elasticsearch 中，如图 5-3 所示。\n\n![A978-1-4842-1326-1_5_Fig3_HTML.jpg](img/A978-1-4842-1326-1_5_Fig3_HTML.jpg)\n\
  \n**图 5-3.** spark 索引中的 Clickstream 事件\n\n如你所见，我正使用 Elasticsearch 搜索 API 从 `spark`\
  \ 索引中获取数据；结果，我从该索引中获取到了 55 个点击流事件。\n\n### 实现 Spark 数据处理\n\n以这一部分作为结尾可能看起来有些奇怪，但我更倾向于在深入探讨\
  \ Spark 的核心用途——数据处理之前，先让流式传输管道准备好工作。\n\n我们现在将向之前的 Spark 代码中添加更多的处理逻辑，并引入一个新的对象：`PageStatistic`\
  \ 对象。该对象将保存我们想要了解的关于用户在网站上行为的所有统计数据。我们会将示例限制在一个基本的程度上；在下一章中，我们将进行更深入的探讨。\n\n处理部分随后将分为以下几个部分：\n\
  \n*   创建一个简单的 `PageStatistic` 对象来保存统计数据\n*   计算统计数据\n*   索引部分\n\n让我们首先从 `PageStatistic`\
  \ 对象开始，目前它只保存 GET 和 POST 请求的计数，如清单 5-24 所示。\n\n**清单 5-24.** PageStatistic 对象定义\n\
  \n```\ncase class PageStatistic (\n  getRequest:Long,\n  postRequest:Long\n)\n```\n\
  \n然后，我们将使用一个来自 Spark Scala 库的特殊函数 `countByValue` 来计算我们从 Kafka 接收到的日志批次中 GET 和 POST\
  \ 的数量，如清单 5-25 所示。\n\n**清单 5-25.** 使用 countByValue 计算 GET 和 POST 的计数\n\n```\nval\
  \ requestMap = events\n  .map(event => event.verb)\n  .countByValue()\n  .map(x=>x.productIterator.collect{case\
  \ (a,b) => (a -> b)}.toMap.withDefaultValue(0L));\n\nval requests = requestMap.map(data\
  \ => PageStatistic(\n  data(\"GET\").asInstanceOf[Long],\n  data(\"POST\").asInstanceOf[Long]\n\
  ));\n```\n\n在这段代码中，我们简单地获取每个接收到的事件，并对其应用 `countByValue` 函数。然后我们创建一个默认值为 0 的映射表，并对其进行迭代以提取出\
  \ `PageStatistic` 对象。\n\n最后，我们使用 `spark` 索引将数据索引到 Elasticsearch 中，并创建一个新的文档类型 `stats`，如清单\
  \ 5-26 所示。\n\n**清单 5-26.** 在 spark Elasticsearch 索引中索引 stats 文档\n\n```\nrequests.foreachRDD{\
  \ rdd =>\n  if (rdd.toLocalIterator.nonEmpty) {\n    EsSpark.saveToEs(rdd, \"spark/stats\"\
  )\n  }\n}\n```\n\n如果我们使用清单 5-27 在 Elasticsearch 中检查：\n\n**清单 5-27.** 从 Elasticsearch\
  \ 获取 spark stats 文档\n\n```\nGET spark/stats/_search\n```\n\n我们会得到：\n\n```\n{\n \
  \  \"took\": 1,\n   \"timed_out\": false,\n   \"_shards\": {\n      \"total\": 1,\n\
  \      \"successful\": 1,\n      \"failed\": 0\n   },\n   \"hits\": {\n      \"\
  total\": 1,\n      \"max_score\": 1,\n      \"hits\": [\n         {\n          \
  \  \"_index\": \"spark\",\n            \"_type\": \"stats\",\n            \"_id\"\
  : \"AU7ReZIVvtspbVGliqwM\",\n            \"_score\": 1,\n            \"_source\"\
  : {\n               \"getRequest\": 34,\n               \"postRequest\": 12\n  \
  \          }\n         }\n      ]\n   }\n}\n```\n\n我们可以看到我们的文档保存了 `PageStatistic`\
  \ 对象中计算出的两个字段。但这种级别的简单计算是 Elasticsearch 可以轻松实现的；我们将在下一节中看到具体方法。请记住，在下一章中，我们将尝试强调这个\
  \ Spark 处理管道，以展示该技术栈的全部威力。\n\n## 使用 Elasticsearch 进行数据分析\n\n### 聚合框架简介\n\nElasticsearch\
  \ 提供了一套强大的 API，让用户能够充分利用他们的数据。聚合框架可以将数据分组，并支持对从小到大的数据集进行实时分析查询。\n\n我们使用 Spark 进行的简单分析，同样可以使用\
  \ Elasticsearch 的聚合框架大规模地完成。该框架分为两种类型的聚合：\n\n*   **桶聚合**：旨在根据文档共有的键和标准对一组文档进行分组。满足条件的文档落入相应的桶中。\n\
  *   **指标聚合**：旨在对一组文档计算指标，例如平均值、最大值、最小值，甚至日期直方图。\n\n事实上，聚合的强大之处在于它们可以嵌套。\n\n\n\n\
  ### 桶聚合\n\n桶聚合用于创建文档分组。与指标聚合不同，它可以嵌套使用，从而获得实时的多级聚合。在 Spark 中，创建`PageStatistic`结构需要大量编码，且逻辑会因开发者而异，这可能会显著影响处理性能；而在\
  \ Elasticsearch 中，要达到相同目标的工作量要少得多。\n\n桶聚合的实现非常简单。我们以动词分布为例：如果想按动词对文档分组，只需遵循清单 5-28\
  \ 所示的代码即可。\n\n**清单 5-28.** 点击流 HTTP 动词上的词条聚合\n\n```\ncurl -XGET \"http://192.168.59.103:9200/clickstream-2015.07.27/_search\"\
  \ -d'\n{\n  \"size\": 0,\n  \"aggs\": {\n    \"by_verb\": {\n      \"terms\": {\n\
  \        \"field\": \"verb\"\n      }\n    }\n  }\n}'\n```\n\n随后会返回清单 5-29 所示的代码。\n\
  \n**清单 5-29.** 词条聚合结果\n\n```\n{\n  \"took\": 11,\n  \"timed_out\": false,\n  \"\
  _shards\": {\n    \"total\": 1,\n    \"successful\": 1,\n    \"failed\": 0\n  },\n\
  \  \"hits\": {\n    \"total\": 29280,\n    \"max_score\": 0,\n    \"hits\": []\n\
  \  },\n  \"aggregations\": {\n    \"by_verb\": {\n      \"doc_count_error_upper_bound\"\
  : 0,\n      \"sum_other_doc_count\": 0,\n      \"buckets\": [\n        {\n     \
  \     \"key\": \"get\",\n          \"doc_count\": 24331\n        },\n        {\n\
  \          \"key\": \"post\",\n          \"doc_count\": 4949\n        }\n      ]\n\
  \    }\n  }\n}\n```\n\n如您所见，我在几毫秒内就完成了聚合，近乎实时（`11` 毫秒），并得到了`get`和`post` HTTP 动词的分布情况。但如果我们想要获得与\
  \ Spark 中类似的结果——即 HTTP 动词基于时间的分布呢？那么可以使用日期直方图聚合，并在其中嵌套一个词条聚合，如清单 5-30 所示。\n\n**清单\
  \ 5-30.** 带有嵌套词条聚合的日期直方图\n\n```\ncurl -XGET \"http://192.168.59.103:9200/clickstream-2015.07.27/_search\"\
  \ -d'\n{\n  \"size\": 0,\n  \"aggs\": {\n    \"over_time\": {\n      \"date_histogram\"\
  : {\n        \"field\": \"@timestamp\",\n        \"interval\": \"minute\"\n    \
  \  },\n      \"aggs\": {\n        \"by_verb\": {\n          \"terms\": {\n     \
  \       \"field\": \"verb\"\n          }\n        }\n      }\n    }\n  }\n}'\n```\n\
  \n日期直方图聚合确实非常易用；它指定了：\n- 保存时间戳的字段（`@timestamp`），直方图将使用该字段\n- 分桶的间隔。这里我使用了`minute`，因为在我写这本书时，笔记本电脑上索引了超过\
  \ 100 万个文档。这显然需要时间，因此我确信文档分布在几分钟内。我本可以使用`day`、`month`或`year`，或者指定一个日期表达式`2h`来表示“每\
  \ 2 小时”。\n\n您可以在我的查询中看到嵌套的词条聚合；让我们将间隔改为`20m`，以获得更紧凑的结果，如清单 5-31 所示。\n\n**清单 5-31.**\
  \ 日期直方图和嵌套词条聚合结果\n\n```\n{\n  \"took\": 73,\n  \"timed_out\": false,\n  \"_shards\"\
  : {\n    \"total\": 1,\n    \"successful\": 1,\n    \"failed\": 0\n  },\n  \"hits\"\
  : {\n    \"total\": 228387,\n    \"max_score\": 0,\n    \"hits\": []\n  },\n  \"\
  aggregations\": {\n    \"over_time\": {\n      \"buckets\": [\n        {\n     \
  \     \"key_as_string\": \"2015-07-27T11:20:00.000Z\",\n          \"key\": 1437996000000,\n\
  \          \"doc_count\": 105442,\n          \"by_verb\": {\n            \"doc_count_error_upper_bound\"\
  : 0,\n            \"sum_other_doc_count\": 0,\n            \"buckets\": [\n    \
  \          {\n                \"key\": \"get\",\n                \"doc_count\":\
  \ 87593\n              },\n              {\n                \"key\": \"post\",\n\
  \                \"doc_count\": 17849\n              }\n            ]\n        \
  \  }\n        },\n        {\n          \"key_as_string\": \"2015-07-27T11:40:00.000Z\"\
  ,\n          \"key\": 1437997200000,\n          \"doc_count\": 122945,\n       \
  \   \"by_verb\": {\n            \"doc_count_error_upper_bound\": 0,\n          \
  \  \"sum_other_doc_count\": 0,\n            \"buckets\": [\n              {\n  \
  \              \"key\": \"get\",\n                \"doc_count\": 102454\n      \
  \        },\n              {\n                \"key\": \"post\",\n             \
  \   \"doc_count\": 20491\n              }\n            ]\n          }\n        }\n\
  \      ]\n    }\n  }\n}\n```\n\n如您所见，我们得到了两个 20 分钟数据桶以及嵌套的 HTTP 动词分布。当您希望将这些数据绘制成时间线或柱状图，以时间维度呈现数据，并能精细控制分析数据的时间段时，这类聚合是非常理想的。\n\
  \n现在，让我们看看如果使用指标聚合会怎样。\n\n\n\n### 指标聚合\n\n指标聚合是聚合集的最后一个层级，用于计算文档集上的指标。其中一些计算被视为单值指标聚合，因为它们基本上是对文档执行特定运算，例如平均值、最小值、最大值或总和；另一些则是多值聚合，因为它们为文档集中的特定字段提供多个统计指标，例如\
  \ `stats` 聚合。\n\n作为多值聚合指标的一个示例，让我们对 `bytes` 字段执行 `stats` 聚合，以更深入地了解我们网站页面的吞吐量，如代码清单\
  \ 5-32 所示。\n\n**代码清单 5-32.** 对 `bytes` 字段的统计聚合\n\n```\nGET clickstream-2015.07.27/_search\n\
  {\n  \"size\": 0,\n  \"aggs\": {\n    \"by_stats\": {\n      \"stats\": {\n    \
  \    \"field\": \"bytes\"\n      }\n    }\n  }\n}\n```\n\n`stats` 聚合只接收一个数值字段作为输入——此处为\
  \ `bytes`——并返回代码清单 5-33。\n\n**代码清单 5-33.** 统计聚合查询输出\n\n```\n{\n  \"took\": 1,\n\
  \  \"timed_out\": false,\n  \"_shards\": {\n    \"total\": 1,\n    \"successful\"\
  : 1,\n    \"failed\": 0\n  },\n  \"hits\": {\n    \"total\": 2843774,\n    \"max_score\"\
  : 0,\n    \"hits\": []\n  },\n  \"aggregations\": {\n    \"by_stats\": {\n     \
  \ \"count\": 2843774,\n      \"min\": 2086,\n      \"max\": 4884,\n      \"avg\"\
  : 3556.769230769231,\n      \"sum\": 3932112564\n    }\n  }\n}\n```\n\n结果为 `bytes`\
  \ 字段计算了不同的指标：\n\n- `count` 表示查询所涉及的文档数量，此处超过 250 万\n- `min` 和 `max` 分别是 `bytes`\
  \ 的最小值和最大值\n- `avg` 是所有文档的 `bytes` 平均值\n- `sum` 是所有文档中 `bytes` 字段的总和\n\n这就是如何通过一个小查询从文档中提取统计信息。但让我们更进一步，尝试组合我们的桶聚合和指标聚合。我们要做的是添加另一个聚合层级，并检查每种\
  \ HTTP 动词类型的吞吐量，如代码清单 5-34 所示。\n\n**代码清单 5-34.** 三级聚合\n\n```\nGET clickstream-2015.07.27/_search\n\
  {\n  \"size\": 0,\n  \"aggs\": {\n    \"over_time\": {\n      \"date_histogram\"\
  : {\n        \"field\": \"@timestamp\",\n        \"interval\": \"20m\"\n      },\n\
  \      \"aggs\": {\n        \"by_verb\": {\n          \"terms\": {\n           \
  \ \"field\": \"verb\"\n          },\n          \"aggs\": {\n            \"by_bytes\"\
  : {\n              \"stats\": {\n                \"field\": \"bytes\"\n        \
  \      }\n            }\n          }\n        }\n      }\n    }\n  }\n}\n```\n\n\
  我们将每 20 分钟获取每个 HTTP 动词的字节统计信息，如代码清单 5-35 所示。\n\n**代码清单 5-35.** 三级聚合结果\n\n```\n{\n\
  \  \"took\": 2,\n  \"timed_out\": false,\n  \"_shards\": {\n    \"total\": 1,\n\
  \    \"successful\": 1,\n    \"failed\": 0\n  },\n  \"hits\": {\n    \"total\":\
  \ 39,\n    \"max_score\": 0,\n    \"hits\": []\n  },\n  \"aggregations\": {\n  \
  \  \"over_time\": {\n      \"buckets\": [\n        {\n          \"key_as_string\"\
  : \"2015-07-27T14:00:00.000Z\",\n          \"key\": 1438005600000,\n          \"\
  doc_count\": 19,\n          \"by_verb\": {\n            \"doc_count_error_upper_bound\"\
  : 0,\n            \"sum_other_doc_count\": 0,\n            \"buckets\": [\n    \
  \          {\n                \"key\": \"get\",\n                \"doc_count\":\
  \ 14,\n                \"by_bytes\": {\n                  \"count\": 14,\n     \
