- '# 6. 从数据中学习？


  Spark 的强大特性之一是其机器学习能力。使用 Spark `Mllib`，可以非常容易地用学习算法丰富现有的数据处理管道。本章将介绍机器学习背后的主要概念，并介绍如何为我们的架构增加机器学习特性。




  '
- "# 机器学习简介\n\n机器学习是一种创建计算机程序的概念，这些程序能在接触新数据时进行自我学习。\n\n如今，机器学习被广泛应用，几乎渗透到所有行业，例如：根据用户过往行为优化导航体验，根据患者背景推荐合适的药物或疗法，以及帮助火星车在移动和穿越障碍时更好地进行地面导航。\n\
  \n当你使用谷歌搜索、收听 Spotify 歌单、浏览亚马逊商品目录，或在爱彼迎上预订公寓时，机器学习都在背后发挥作用。\n\n本章的目的并非开设机器学习课程，而是在我们的\
  \ Lambda 架构背景下讨论它。不过，我们会做一个简要的介绍，并讨论监督学习和无监督学习——这两种机器学习中最常见的实践方式，同时也会简单讲解我们稍后将使用的算法：`K-means`。\n\
  \n## 监督学习\n\n在处理机器学习时，你必须面对诸如“该使用哪种模型？”以及“应采用什么策略来训练数据？”等问题。监督学习和无监督学习之间的区别在于模型的因果性质。\n\
  \n在监督学习中，输入（即一组观测值）会根据图 6-1 描述的模型影响输出（即另一组观测值）。\n\n![A978-1-4842-1326-1_6_Fig1_HTML.jpg](img/A978-1-4842-1326-1_6_Fig1_HTML.jpg)\n\
  \n图 6-1. 监督学习算法\n\n模型基于训练数据创建，并随着新数据的到来而不断丰富。这个过程是持续运行的。\n\n一个现实生活中的例子是：为了批准个人贷款而进行的数据训练。通过获取过去申请人的信息，如财务状况、健康状况、职业等，学习过程可以推断出贷款是否应该获批。\n\
  \n图 6-2 展示了监督学习的一个具体应用，它显示了巴黎市中心一年内公寓的平均月租金。一个数据样本帮助我们对数据应用了线性回归，以揭示预测结果。例如，图 6-2\
  \ 中的红线显示，平均价格在 2018 年将达到 4000 欧元。\n\n![A978-1-4842-1326-1_6_Fig2_HTML.jpg](img/A978-1-4842-1326-1_6_Fig2_HTML.jpg)\n\
  \n图 6-2. 基于线性回归的监督学习\n\n在处理历史数据以预测短期到中期未来时，这种机器学习方法效果非常好，但这些预测所依据的模型在某些用例中并不明显。\n\
  \n## 无监督学习\n\n与监督学习相反，无监督学习中的模型是基于输入数据创建的，并随着数据的流入而不断改进。一些无监督算法可以检测数据中的相似性，并尝试创建相似数据的聚类，如图\
  \ 6-3 所示。\n\n![A978-1-4842-1326-1_6_Fig3_HTML.jpg](img/A978-1-4842-1326-1_6_Fig3_HTML.jpg)\n\
  \n图 6-3. 无监督算法\n\n这更适用于我们的流式处理场景，因为在这些场景中，数据在开始时是未知的，并且其模式可能随时间变化。\n\n这类算法被称为聚类算法。一些知名的算法包括：\n\
  \n*   `K-means`\n*   `K-medians`\n*   期望最大化\n*   层次聚类\n\n在我们的案例中，我们将专注于 `K-means`\
  \ 算法。\n\n## 使用 Spark 进行机器学习\n\n显然，机器学习始于静态数据。首先创建一个数据集，我们基于该数据集构建模型，然后将模型应用于后续创建的数据以得出预测。在我们的案例中，当我们启动\
  \ Spark Streaming 驱动程序时，没有任何数据可供我们进行预测；我们必须利用流式数据的批次来构建并训练模型。\n\n我们数据的行为模式可能会不时发生变化；这就是为什么流式架构比批量机器学习更适合这类用例的原因。通过流式处理，我们可以从数据中学习，并训练我们的模型，使其能够随时间调整预测。\n\
  \nSpark 对于这种流式学习架构非常方便，因为它提供了现成的组件：用于流式处理的 `Spark Streaming` ([`http://spark.apache.org/streaming/`](http://spark.apache.org/streaming/))\
  \ 和用于机器学习的 `Mllib` ([`http://spark.apache.org/mllib/`](http://spark.apache.org/mllib/))，如图\
  \ 6-4 所示。\n\n![A978-1-4842-1326-1_6_Fig4_HTML.jpg](img/A978-1-4842-1326-1_6_Fig4_HTML.jpg)\n\
  \n图 6-4. Spark 架构\n\n为了构建关于我们访客行为的预测，这两个库将在同一个 Spark 驱动程序中同时使用。我们将重点关注使用 `Spark\
  \ Mllib` 的最常见方法之一：实现一个 `K-means` 聚类，将我们的数据划分到 `K` 个聚类中。但在那之前，让我们更仔细地看看这个 `K-means`\
  \ 算法。\n\n\n\n## 为架构添加机器学习\n\n`K-means`算法属于无监督机器学习算法。它是数据聚类领域最常用的算法之一，也是最简单的算法之一。\n\
  \n`K-means`允许我们将给定的数据集划分为`K`个簇；每个簇都有一个称为质心的中心点。对于给定的数据，我们定义`K`个质心，并尽可能让它们相互远离，然后将每个数据点关联到最近的质心，从而形成数据的初始分组。\n\
  \n每个质心都需要结合之前加入该簇的数据点重新计算，这将产生`K`个新的质心或簇重心。在重新计算每个质心后，所有数据点会再次被关联到最近的质心。这种重新计算过程会持续进行，直到质心不再移动为止。\n\
  \n以下是主要步骤的示意图说明：\n\n首先我们需要一个数据集：\n\n![A978-1-4842-1326-1_6_Fig5_HTML.jpg](img/A978-1-4842-1326-1_6_Fig5_HTML.jpg)\n\
  \n图 6-5. 待聚类的数据集\n\n然后我们在二维空间中放置`K`个质心，以表示我们的簇中心：\n\n![A978-1-4842-1326-1_6_Fig6_HTML.jpg](img/A978-1-4842-1326-1_6_Fig6_HTML.jpg)\n\
  \n图 6-6. 添加质心以表示簇\n\n这将把空间分割成不同颜色的区域，每种颜色对应一个质心的颜色。每个数据点都与最近的质心关联，从而得到初始分组。接着我们开始根据数据点重新计算质心位置：如图\
  \ 6-7 所示，质心的位置发生了变化，并更靠近数据点的聚集区域。\n\n![A978-1-4842-1326-1_6_Fig7_HTML.jpg](img/A978-1-4842-1326-1_6_Fig7_HTML.jpg)\n\
  \n图 6-7. 首次重新计算阶段\n\n在重新计算阶段结束时，质心不再移动，因为以下目标函数已被最小化到极致：\n\n![ $$ J={\\displaystyle\
  \ \\sum_{j=1}^k{\\displaystyle \\sum_{i=1}^n\\left|\\right|{x}_i^j}-{c}_j\\left|\\\
  right|{}²} $$ ](img/A978-1-4842-1326-1_6_Chapter_TeX2GIF_Equa.gif)\n\n其中，![ $$ \\\
  left|\\right|{\\mathrm{x}}_{\\mathrm{j}}^{\\mathrm{i}}-{\\mathrm{c}}_{\\mathrm{j}}\\\
  left|\\right|{}² $$ ](img/A978-1-4842-1326-1_6_Chapter_TeX2GIF_IEq1.gif) 是数据点 `x[i]^j`\
  \ 与最近质心 `c[j]` 之间的平方距离。\n\n最终，聚类结果看起来略有不同，如图 6-8 所示。\n\n![A978-1-4842-1326-1_6_Fig8_HTML.jpg](img/A978-1-4842-1326-1_6_Fig8_HTML.jpg)\n\
  \n图 6-8. 最终的聚类状态\n\n为了可视化数据，我使用了这个非常棒且实用的网站：[`http://www.naftaliharris.com/blog/visualizing-k-means-clustering/`](http://www.naftaliharris.com/blog/visualizing-k-means-clustering/)\n\
  \n如果我们为图 6-8 增加一些现实元素，它可能会更有意义：\n\n![A978-1-4842-1326-1_6_Fig9_HTML.jpg](img/A978-1-4842-1326-1_6_Fig9_HTML.jpg)\n\
  \n图 6-9. 使用 K-means 分割的世界\n\n看看借助`K-means`，你可以多么轻松地根据自己选择的标准来分割世界！\n\n所以，我想当我们将其与我们当前的点击流用例关联起来时，这就更有意义了。我们希望构建一个机器学习流水线，将点击流数据聚类成分类后的客户行为。\n\
  \n## 为架构添加机器学习\n\n我们现在将为 Lambda 架构添加机器学习。这将是一个渐进的过程，因为我们首先需要处理数据，然后处理学习模型，最后进行预测。\n\
  \n通过为架构添加机器学习，我们希望实现的是用户行为的实时分析和预测。我们将使用一个机器学习流水线来帮助我们分类网站访客，以便根据之前的浏览行为推送产品推荐。\n\
  \n处理此过程的总体思路包括：\n\n-   在数据流式传输时对其进行丰富：我们将通过使用额外数据源简单地为数据添加标签，从而为数据增加更多的业务含义。\n-\
  \   训练一个分类器：这意味着我们需要建立一个模型，以便基于统计算法从数据中学习。\n-   使用我们的模型进行预测。\n\n### 丰富点击流数据\n\n\
  在深入纯粹的机器学习之前，我们需要为用例增加更多业务逻辑。我们将使用 Spark 来完成这项任务，并利用该技术高度弹性和分布式的特性。策略是加载一个数据映射表，该映射表表示浏览器\
  \ URI 与产品类别之间的对应关系，这样我们就能得到访客所浏览产品的类别，如图 6-10 所示。\n\n![A978-1-4842-1326-1_6_Fig10_HTML.jpg](img/A978-1-4842-1326-1_6_Fig10_HTML.jpg)\n\
  \n图 6-10. 产品映射\n\n这确实是一个非常简短的映射示例，它可以在 Spark 中加载并保存在内存中，而不会产生任何开销。在实际用例中，映射表可能具有相当大的规模，在内存中保存可能不安全。在这种情况下，我会使用持久化存储，例如\
  \ HDFS，甚至是 Elasticsearch。将其存储在 ES 中的原因可能是为了便于搜索合适的映射。在本示例中，我们将创建一个简单的 CSV 文件。\n\n\
  数据丰富的过程如图 6-11 所示。\n\n![A978-1-4842-1326-1_6_Fig11_HTML.jpg](img/A978-1-4842-1326-1_6_Fig11_HTML.jpg)\n\
  \n图 6-11. 数据丰富示意图\n\n这些数据与前一章讨论的在 Spark 中获取的数据类似，但不同之处在于，我们将：\n\n-   创建一个客户对象\n\
  -   将这些数据与我们内存中的映射表进行比对\n-   丰富我们的客户对象\n-   将它们索引到 Elasticsearch 中\n\n为此，我们将创建另一个名为\
  \ `spark-enrich-and-ml` 的 Scala 项目，你可以在我的 Github 账户中找到它：\n\n[`https://github.com/bahaaldine/spark-enrich-and-ml`](https://github.com/bahaaldine/spark-enrich-and-ml)\n\
  \n\n#### 准备数据集\n\n我们需要构建一个映射文件，以便将点击流数据关联到产品类别。我们将使用位于以下路径中的 Python 脚本：[`https://github.com/bahaaldine/elasticsearch-clickstream-demo/blob/master/generator/mapping_generator.py`](https://github.com/bahaaldine/elasticsearch-clickstream-demo/blob/master/generator/mapping_generator.py)。\n\
  \n该 Python 脚本会生成 200,000 个 URI，并将它们随机映射到代码清单 6-1 所示任意列表中的一个类别。\n\n**代码清单 6-1.**\
  \ 产品类别\n\n```\n#!/usr/bin/python\nimport csv\nimport random\n\nproductCount = 200000\n\
  productCategories = [\"设备配件\",\"高科技配件\",\"IT 配件\",\"宠物\",\"汽车\",\"婴儿\",\"家庭办公\"\
  ,\"厨房\",\"电子游戏\",\"骑行\",\"蓝光和 DVD\",\"办公用品\",\"家用电器\",\"高科技\",\"IT\",\"音频和音乐\",\"\
  园艺\",\"玩具和游戏\",\"图书\",\"软件\",\"照明\",\"家居\",\"音乐\",\"轮胎\",\"运动与休闲\",\"视频\",\"化妆品\"\
  ,\"珠宝\",\"鞋类\",\"手表\",\"健康\",\"服装\"]\n\nwith open('mappings.csv', 'wb') as outf:\n\
  \    fieldnames = ['uri'] + ['category']\n    csvwriter = csv.DictWriter(outf, fieldnames)\n\
  \    while productCount > 0:\n        row = {}\n        csvwriter.writerow(dict(row,\
  \ uri=\"/products/product%d\" % productCount, category=random.choice(productCategories)))\n\
  \        productCount -= 1\n```\n\n如你所见，共有 32 个类别。你将按照代码清单 6-2 所示执行这些脚本。\n\n**代码清单\
  \ 6-2.** 映射文件提取\n\n```\npython mapping_generator.py\n```\n\n你应该会得到以下`mappings.csv`文件：\n\
  \n```\n...\n/products/product90956,Shoes\n/products/product90955,Shoes\n/products/product90954,baby\n\
  /products/product90953,household applicance\n/products/product90952,Books\n/products/product90951,Audio\
  \ and musique\n/products/product90950,IT\n/products/product90949,Devices accessories\n\
  /products/product90948,Devices accessories\n/products/product90947,Jewellery\n/products/product90946,car\n\
  /products/product90945,Devices accessories\n/products/product90944,Toys and games\n\
  /products/product90943,baby\n/products/product90942,Books\n/products/product90941,IT\
  \ accessories\n/products/product90940,cycling\n...\n```\n\n另一方面，[`https://raw.githubusercontent.com/bahaaldine/elasticsearch-clickstream-demo/master/generator/resources.txt`](https://raw.githubusercontent.com/bahaaldine/elasticsearch-clickstream-demo/master/generator/resources.txt)\
  \ 文件包含了所有可能的产品 URI。\n\n最后，Spark 将负责根据映射文件将 URI 关联到类别。因此，让我们在以下类中分析所需的 Spark 代码：[`https://github.com/bahaaldine/spark-enrich-and-ml/blob/master/src/main/scala/org/apache/spark/examples/SparkEnricher.scala`](https://github.com/bahaaldine/spark-enrich-and-ml/blob/master/src/main/scala/org/apache/spark/examples/SparkEnricher.scala)。\n\
  \n我们保留了 `Clickstream` 对象，但添加了一个 `Customer` 对象，它将作为我们流处理的输出。\n\n**代码清单 6-3.** Customer\
  \ 对象\n\n```\ncase class Customer (\n    session:String,\n    request:String,\n \
  \   category:String\n)\n```\n\n请注意，整个 Spark 项目可以在以下仓库中找到：[`https://github.com/bahaaldine/scalable-big-data-architecture/tree/master/chapter6/spark-enrich-and-ml`](https://github.com/bahaaldine/scalable-big-data-architecture/tree/master/chapter6/spark-enrich-and-ml)。\n\
  \n到目前为止，`Customer` 对象非常简单，只包含三个字段：\n\n*   `session` 字段，用于标识用户的键\n*   `request` 字段，包含产品\
  \ URI\n*   `category` 字段，将使用映射文件填充产品类别。\n\nSpark 上下文配置保持不变；我们只是添加了另一个数据源，即我们的映射文件，如代码清单\
  \ 6-4 所示。\n\n**代码清单 6-4.** 加载映射文件\n\n```\nval mappingFile = ssc.sparkContext.textFile(\"\
  /path/to/mappings.csv\")\nval mappings = mappingFile.map(line => line.split(\",\"\
  )).map(x => (x(0),x(1))).collectAsMap()\nval broadcastMapping = ssc.sparkContext.broadcast(mappings)\n\
  ```\n\n请记住，之前的 Python 脚本生成了一个名为 `mappings.csv` 的映射文件。你必须在此代码中设置该路径，才能使 Spark 驱动程序正常工作。\n\
  \n映射被加载到一个 `mappings` 变量中，然后通过广播创建为只读变量，放入每个 Spark 机器的缓存中。随后使用该变量创建并丰富 `Customer`\
  \ 对象，如代码清单 6-5 所示。\n\n**代码清单 6-5.** 创建并丰富 Customer 对象\n\n```\nval customers = events.map\
  \ { clickstream =>\n    val lookupMap = broadcastMapping.value\n    Customer(\n\
  \        clickstream.clientip\n        , clickstream.request\n        , lookupMap.getOrElse(clickstream.request,\
  \ \"category not found\")\n    )\n}\n```\n\n映射被加载到 `lookupMap` 变量中，我们通过 `getOrElse`\
  \ 来查找产品类别。如果映射不存在，则返回“category not found”。最后，我们使用代码清单 6-6 中的代码片段将每个 `Customer` 对象索引到\
  \ Elasticsearch 中。\n\n**代码清单 6-6.** Customer RDD 索引\n\n```\ncustomers.foreachRDD{\
  \ rdd =>\n    if (rdd.toLocalIterator.nonEmpty) {\n        EsSpark.saveToEs(rdd,\
  \ \"spark/customer\")\n    }\n}\n```\n\n每个客户都会被索引到 Elasticsearch 的 `spark` 索引中，类型为\
  \ `customer`。为了测试我们的代码，请确保 lambda 架构完全运行，然后启动 `build.sh` 文件来构建并启动我们的驱动程序。\n\n**代码清单\
  \ 6-7.** Spark 驱动程序启动命令\n\n```\n./build.sh\n```\n\n通过使用 `generator.py` 脚本生成新的点击流日志，你应该会在\
  \ `spark` 索引中得到索引后的客户。只需浏览 `http://elasticsearch_host:9200/spark/_search`，即可获得代码清单\
  \ 6-8 所示的输出。\n\n**代码清单 6-8.** Elasticsearch 中索引的客户\n\n```\nhits: {\n    total: 10,\n\
  \    max_score: 1,\n    hits: [\n        {\n            _index: \"spark\",\n   \
  \         _type: \"customer\",\n            _id: \"AU9-8BCuIm6jDjOublOw\",\n   \
  \         _score: 1,\n            _source: {\n                session: \"86.192.183.220\"\
  ,\n                request: \"/products/product106871\",\n                category:\
  \ \"Watches\"\n            }\n        },\n        {\n            _index: \"spark\"\
  ,\n            _type: \"customer\",\n            _id: \"AU9-8BCuIm6jDjOublO1\",\n\
  \            _score: 1,\n            _source: {\n                session: \"86.192.149.103\"\
  ,\n                request: \"/products/product158310\",\n                category:\
  \ \"cycling\"\n            }\n        }\n        ...\n    ]\n}\n```\n\n此时，我们拥有一个完整的索引，其中包含已映射的客户。我们现在将利用这一丰富阶段来对数据进行聚类并构建预测。\n\
  \n\n### 数据标签化\n\n为训练模型，我们将构建一个二维向量，该向量基于类别标签和客户标签生成。类别标签与特定类别相关联，例如“汽车”、“运动”等；而客户标签则引入了一个虚构的客户类型概念。\n\
  \n客户标签的取值为 1 至 5，具体含义如下：\n\n免费 早鸟 黄金 铂金 大客户\n\n因此，在训练模型之前，我们需要创建几个映射文件，以便能通过标签识别类别，并通过标签识别客户。\n\
  \n`https://github.com/bahaaldine/elasticsearch-clickstream-demo/blob/master/generator/mapping_generator.py`\
  \ 已进行了轻微修改，新增了一个标签列，如代码清单 6-9 所示。\n\n**代码清单 6-9.** 为类别添加标签\n\n```\ncategory = random.choice(productCategories)\n\
  \ncsvwriter.writerow(dict(row, uri=\"/products/product%d\" % productCount, category=category,\
  \ label=productCategories.index(category)+1))\n```\n\n该标签是根据相关类别在 `productCategories`\
  \ 列表变量中的位置计算得出的。执行 Python 脚本后，您应获取一个如代码清单 6-10 所示的映射文件。\n\n**代码清单 6-10.** 带有标签的类别映射文件\n\
  \n```\n...\n/products/product199988,High-Tech accessories,2\n/products/product199987,House,22\n\
  /products/product199986,baby,6\n/products/product199985,Heatlh,31\n/products/product199984,Watches,30\n\
  ...\n```\n\n对于客户，我创建了一个新的 Python 脚本，位于：\n\n`https://github.com/bahaaldine/elasticsearch-clickstream-demo/blob/master/generator/ip_mapping_generator.py`\n\
  \n该脚本会在生成的文件中，为每个 IP 地址随机添加一个 1 到 5 之间的整数，如代码清单 6-11 所示。\n\n**代码清单 6-11.** IP 映射文件生成器\n\
  \n```\n#!/usr/bin/python\n\nimport csv\nimport random\n\nwith open('ip_mappings.csv',\
  \ 'wb') as outf:\n        fieldnames = ['ip'] + ['label']\n        csvwriter = csv.DictWriter(outf,\
  \ fieldnames)\n        for i in range(0,255):\n                for j in range(0,255):\n\
  \                        row = {}\n                        csvwriter.writerow(dict(row,\
  \ ip=\"86.192.\"+str(i)+\".\"+str(j), label=random.randint(1,5)))\n```\n\n使用 IP\
  \ 地址作为客户标识符看起来是一个奇怪的选择，但我这样做是为了方便读者理解本书的这一部分，并能在有限的客户标识符范围内进行工作。\n\n执行 Python 脚本后，您应获得类似于代码清单\
  \ 6-12 所示的输出内容。\n\n**代码清单 6-12.** 带有标签的 IP 映射\n\n```\n...\n86.192.0.15,3\n86.192.0.16,3\n\
  86.192.0.17,5\n86.192.0.18,3\n86.192.0.19,1\n86.192.0.20,4\n86.192.0.21,1\n...\n\
  ```\n\n这意味着客户 `86.192.0.21` 是一位**免费**客户。\n\n### 训练与预测\n\n在最后这一节中，我们将利用前面讨论过的所有资产，构建一个\
  \ K-Means 流式机器学习驱动程序。为此，我们将复用之前的 Scala 代码，并增加以下步骤。\n\n首先，我们加载刚刚修改或创建的映射文件，如代码清单\
  \ 6-13 所示。\n\n**代码清单 6-13.** 加载映射文件\n\n```\nval productCategoryMappingFile = ssc.sparkContext.textFile(\"\
  /path/to/mappings.csv\")\n\nval productCategoryMapping = productCategoryMappingFile.map(line\
  \ => line.split(\",\")).map(x => (x(0),x(1))).collectAsMap()\n\nval categoryLabelMapping:scala.collection.Map[String,Double]\
  \ = productCategoryMappingFile.map(line => line.split(\",\")).map(x => (x(1),x(2).toDouble)).collectAsMap()\n\
  \nval brodcastProductCategoryMapping = ssc.sparkContext.broadcast(productCategoryMapping)\n\
  \nval brodcastCategoryLabelMapping = ssc.sparkContext.broadcast(categoryLabelMapping)\n\
  \nval customerMappingFile = ssc.sparkContext.textFile(\"/path/to/ip_mappings.csv\"\
  )\n\nval ipLabelMapping:scala.collection.Map[String,Double] = customerMappingFile.map(line\
  \ => line.split(\",\")).map(x => (x(0),x(1).toDouble)).collectAsMap()\n\nval brodcastIpLabelMapping\
  \ = ssc.sparkContext.broadcast(ipLabelMapping)\n```\n\n这里我们创建了三个广播映射：\n- 我们已知的产品类别映射\n\
  - 从修改后的 `mappings.csv` 中提取的类别标签映射\n- 从新创建的 `ip_mappings.csv` 中提取的 IP 标签映射文件\n\n\
  数据丰富过程保持不变；但为了模型进行预测所需的训练数据和测试数据，我增加了两个闭包，如代码清单 6-14 所示。\n\n**代码清单 6-14.** 创建训练数据\n\
  \n```\nval trainingData = customers.map { customer =>\n\nval categoryLookupMap =\
  \ brodcastCategoryLabelMapping.value\n\nval customerLookupMap = brodcastIpLabelMapping.value\n\
  \nval categoryLabel = categoryLookupMap.getOrElse(customer.category, 1).asInstanceOf[Double]\n\
  \nval customerLabel = customerLookupMap.getOrElse(customer.session, 1).asInstanceOf[Double]\n\
  \nVectors.dense(Array(categoryLabel, customerLabel))\n\n}\n```\n\n第一个闭包使用了类别标签映射和\
  \ IP 标签映射，构建了一个二维向量，该向量建立了类别与客户类型之间的关联。例如，一个向量的值可能如下所示：\n\n`[30.0, 3.0]`\n\n该向量将第\
  \ 29 个（索引 29+1，参见映射生成器）类别，即“鞋子”，与第三种客户类型（即黄金客户）关联起来。\n\n测试数据部分如代码清单 6-15 所示。\n\n\
  **代码清单 6-15.** 创建测试数据\n\n```\nval testData = customers.map { customer =>\n\nval\
  \ categoryLookupMap = brodcastCategoryLabelMapping.value\n\nval customerLookupMap\
  \ = brodcastIpLabelMapping.value\n\nval categoryLabel = categoryLookupMap.getOrElse(customer.category,\
  \ 1).asInstanceOf[Double]\n\nval customerLabel = customerLookupMap.getOrElse(customer.session,\
  \ 1).asInstanceOf[Double]\n\nLabeledPoint(categoryLabel, Vectors.dense(Array(categoryLabel,\
  \ customerLabel)))\n\n}\n```\n\n这里我们创建了一种不同类型的对象 `LabelPoint`。该对象包含两个成员：\n- `label`（标签）：这里我将标签设置为与类别标签相同的值。\n\
  - `vector`（向量）：向量的构建方式与训练数据中的相同。\n\n最后，我们创建并训练模型，如代码清单 6-16 所示。\n\n**代码清单 6-16.**\
  \ 创建并训练模型\n\n```\nval model = new StreamingKMeans()\n.setK(3)\n.setDecayFactor(1.0)\n\
  .setRandomCenters(2, 0.0)\n\nmodel.trainOn(trainingData)\n```\n\n这里我们指定需要三个聚类中心，由于数据是流式的，我们设置了一个衰减因子，并注意这些数据是非线性的。我们需要模型在反映历史数据的同时，重点训练最新数据。\n\
  \n\n\n接着我们调用模型对训练数据进行训练。现在只需调用 `predict` 方法即可获得预期结果，如代码清单 6-17 所示。\n\n**代码清单 6-17.**\
  \ 触发预测\n\n```\nmodel.predictOnValues(testData.map(lp => (lp.label, lp.features))).foreachRDD{\
  \ rdd =>\n  if (rdd.toLocalIterator.nonEmpty) {\n    EsSpark.saveToEs(rdd, \"spark/prediction\"\
  )\n  }\n}\n```\n\n现在您应该能看到预测数据传入 Elasticsearch，可进一步用于推荐引擎或数据分析，如代码清单 6-18 所示。\n\n\
  **代码清单 6-18.** 索引到 Elasticsearch 的预测数据\n\n```\n...\n{\n  _index: \"spark\",\n  _type:\
  \ \"prediction\",\n  _id: \"AU-A58AEIm6jDjOublw2\",\n  _score: 1,\n  _source: {\n\
  \    _1: 24,\n    _2: 2\n  }\n},\n{\n  _index: \"spark\",\n  _type: \"prediction\"\
  ,\n  _id: \"AU-A58AEIm6jDjOublw7\",\n  _score: 1,\n  _source: {\n    _1: 8,\n  \
  \  _2: 1\n  }\n}\n...\n```\n\n现在您只需发挥想象力，思考如何利用这些数据改善网站访客的用户体验。您可以基于此构建推荐引擎，向“早鸟”客户推送第\
  \ 23 类（即“音乐”类，24+1，参见映射生成器）相关的横幅、应用内通知和邮件。\n\n## 本章小结\n\n我们的架构正变得越来越复杂。本章介绍了如何通过机器学习功能丰富数据处理管道，并在数据传入\
  \ Elasticsearch 时进行聚类。\n\n下一章将讨论治理以及为降低生产风险应建立的主要资产。\n\n"
- "# 7. 治理考量\n\n架构的核心要素之一是其治理方式。换言之，如何规划规模、部署及事件监控？本章将从架构的“Docker 化”入手探讨治理考量，同时讨论可扩展性及其对架构的影响。\n\
  \n## 架构的 Docker 化\n\n部署数据架构有多种方式：可以将组件安装在分布式物理机或虚拟机上。近年来，Docker 已成为分布式架构部署的标准，因此本书将使用\
  \ Docker 作为示例场景的部署方案。\n\n### Docker 简介\n\nDocker 是一个开源平台，允许用户缩短从开发阶段到生产阶段的部署周期。它提供了一套全面的工具和\
  \ API，帮助您构建运行应用程序的基础设施。\n\n针对本书的使用场景，您将能够通过 Docker 容器部署完整架构。Docker 拥有自己的术语体系，定义如下：\n\
  \n- **Docker 容器**：运行应用程序的最小工作单元。例如，可以有一个运行 Apache Tomcat 服务器以提供 RESTful API 的 Docker\
  \ 容器。\n- **Docker 镜像**：描述 Docker 容器的镜像文件。在此示例中，您需要一个操作系统和一些软件包来运行 Tomcat。所有必需的资源和配置都写入名为\
  \ `Dockerfile` 的只读模板中，该模板即 Docker 镜像。有关 Docker 镜像的更多信息，请参阅 [`https://docs.docker.com/userguide/dockerimages/`](https://docs.docker.com/userguide/dockerimages/)。\n\
  - **Docker 客户端**：与底层 Docker 功能交互的首要用户界面。编写 Docker 镜像后，您将通过构建镜像来运行 Docker 容器。这是使用\
  \ Docker 客户端完成的操作。有关 Docker 命令行的更多信息，请参阅 [`https://docs.docker.com/reference/commandline/cli/`](https://docs.docker.com/reference/commandline/cli/)。\n\
  - **Docker 守护进程**：协调运行 Docker 容器所需的所有底层操作。用户通过 Docker 客户端与守护进程交互。\n\n图 7-1 总结了我刚才描述的内容。\n\
  \n![A978-1-4842-1326-1_7_Fig1_HTML.jpg](img/A978-1-4842-1326-1_7_Fig1_HTML.jpg)\n\
  \n**图 7-1.** Docker 组件\n\n因此，在示例场景中，如果关注涉及多种技术的数据处理部分，Docker 在运行和配置基础设施方面具有巨大优势。您基本上只需要为每个需要在不同容器上运行的技术创建\
  \ Docker 镜像，包括以下内容：\n\n- Logstash 转发器\n- Logstash（处理器和索引器使用相同技术，仅配置不同）\n- Kafka\n\
  - Zookeeper\n- Elasticsearch\n- Kibana\n\n### 安装 Docker\n\nDocker 支持多种安装配置。例如，在本书范围内，我在\
  \ Mac OS X 上运行 Docker，其安装步骤与 Ubuntu 略有不同。\n\n建议您访问以下页面，按照适合您系统的安装流程进行操作：\n\n[`https://docs.docker.com/installation/`](https://docs.docker.com/installation/)\n\
  \n您还需要 Docker Compose，可在此处获取：\n\n[`https://docs.docker.com/compose/install/`](https://docs.docker.com/compose/install/)\n\
  \n您还需要 Docker Machine，可在此处获取：\n\n[`https://docs.docker.com/machine/install-machine/`](https://docs.docker.com/machine/install-machine/)\n\
  \n完成安装后，请通过执行代码清单 7-1 中的命令，确保可以运行 Docker 和 Docker Compose 命令行。\n\n**代码清单 7-1.**\
  \ Docker 安装检查\n\n```\nbash-3.2$ docker -v\nDocker version 1.7.1, build 786b29d\n\
  bash-3.2$ docker-compose -v\ndocker-compose version: 1.3.2\nCPython version: 2.7.9\n\
  OpenSSL version: OpenSSL 1.0.1j 15 Oct 2014\nbash-3.2$ docker-machine -v\ndocker-machine\
  \ version 0.3.0 (0a251fe)\n```\n\n从以上代码中，您可以看到我编写本书时使用的 Docker 组件版本。\n\n至此，您已准备好开始创建基础设施的\
  \ Docker 镜像。\n\n### 创建 Docker 镜像\n\n在本节中，我将详细说明如何为您的架构应用程序之一创建 Docker 镜像。您会发现，其他应用程序的整体流程都是相同的，因此我只描述其中一个镜像的创建过程。\n\
  \n供您参考，您可以在我的 GitHub 仓库中找到所有镜像：\n\n- Elasticsearch: [`https://github.com/bahaaldine/docker-elasticsearch`](https://github.com/bahaaldine/docker-elasticsearch)\n\
  - Logstash: [`https://github.com/bahaaldine/docker-logstash`](https://github.com/bahaaldine/docker-logstash)\n\
  - Logstash 转发器: [`https://github.com/bahaaldine/docker-logstash-forwarder`](https://github.com/bahaaldine/docker-logstash-forwarder)\n\
  - Kibana: [`https://github.com/bahaaldine/docker-kibana`](https://github.com/bahaaldine/docker-kibana)\n\
  - Zookeeper: [`https://github.com/bahaaldine/docker-zookeeper`](https://github.com/bahaaldine/docker-zookeeper)\n\
  - Apache Kafka: [`https://github.com/bahaaldine/docker-kafka`](https://github.com/bahaaldine/docker-kafka)\n\
  - 用于 Kafka 的 Apache Zookeeper: [`https://github.com/bahaaldine/docker-zookeeper`](https://github.com/bahaaldine/docker-zookeeper)\n\
  - Apache Spark: [`https://github.com/bahaaldine/docker-spark`](https://github.com/bahaaldine/docker-spark)\n\
  \n现在让我们聚焦于创建 Elasticsearch Docker 镜像，并逐步分析 `Dockerfile` 文件，该文件位于以下链接：\n\n[`https://github.com/bahaaldine/docker-elasticsearch/blob/master/Dockerfile`](https://github.com/bahaaldine/docker-elasticsearch/blob/master/Dockerfile)\n\
  \n该模板分为多个部分，每个部分负责特定的任务。\n\n\n\n- **镜像配置**：首先，你需设置容器类型，此处为运行 Elasticsearch 的 Java\
  \ 容器，并设定若干描述性元数据标签。以下是维护者信息：\n  ```\n  FROM java:8\n  MAINTAINER Bahaaldine Azarmi\
  \ baha@elastic.co\n  ```\n\n- **操作系统级配置**：随后，你通过设置所需的环境变量、升级容器包列表并安装必要的软件包来创建操作系统级配置。\n\
  \  ```\n  ENV DEBIAN_FRONTEND noninteractive\n  RUN apt-get update\n  RUN apt-get\
  \ install -y supervisor curl\n  # Elasticsearch\n  RUN \\\n      apt-key adv --keyserver\
  \ pool.sks-keyservers.net --recv-keys 46095ACC8548582C1A2699A9D27D666CD88E42B4 &&\
  \ \\\n      if ! grep \"elasticsearch\" /etc/apt/sources.list; then echo \"deb http://packages.elasticsearch.org/elasticsearch/1.6/debian\
  \ stable main\" >> /etc/apt/sources.list;fi && \\\n      apt-get update\n  ```\n\
  \n- **应用级安装**：安装过程十分简洁，只需运行以下命令：\n  ```\n  apt-get install -y elasticsearch\n  ```\n\
  \n- **应用配置**：接着，你运行几个 `sed` 命令来修改 Elasticsearch 配置文件（`elasticsearch.yml`），以设定集群配置。在以下代码中，你设置了集群名称、Elasticsearch\
  \ 数据存储目录路径、分片与副本数量，以及用于发布正确主机的网络配置：\n  ```\n  sed -i '/#cluster.name:.*/a cluster.name:\
  \ logging' /etc/elasticsearch/elasticsearch.yml && \\\n  sed -i '/#path.data: \\\
  /path\\/to\\/data/a path.data: /data' /etc/elasticsearch/elasticsearch.yml && \\\
  \n  sed -i '/#index.number_of_shards:.*/a index.number_of_shards: 1' /etc/elasticsearch/elasticsearch.yml\
  \ && \\\n  sed -i '/#index.number_of_replicas:.*/a index.number_of_replicas: 0'\
  \ /etc/elasticsearch/elasticsearch.yml && \\\n  sed -i '/#marvel.index.number_of_replicas:.*/a\
  \ index.number_of_replicas: 0' /etc/elasticsearch/elasticsearch.yml && \\\n  sed\
  \ -i '/#network.publish_host:.*/a network.publish_host: elasticsearch' /etc/elasticsearch/elasticsearch.yml\n\
  \  ```\n\n- **应用运行时配置**：此处你使用 [Supervisor](http://supervisord.org/)（一个进程控制系统）来编排容器内已安装应用的执行。因此，你需要创建配置以确保其正常运行。接着，你安装\
  \ Marvel（Elasticsearch 监控插件），并将 9200 端口暴露给容器外部环境。\n  ```\n  ADD etc/supervisor/conf.d/elasticsearch.conf\
  \ /etc/supervisor/conf.d/elasticsearch.conf\n  RUN /usr/share/elasticsearch/bin/plugin\
  \ -i elasticsearch/marvel/latest\n  EXPOSE 9200\n  ```\n\n- **容器运行时配置**：最后一步是让 Supervisor\
  \ 使用 Supervisor 配置文件运行。\n  ```\n  CMD [ \"/usr/bin/supervisord\", \"-n\", \"-c\"\
  , \"/etc/supervisor/supervisord.conf\" ]\n  ```\n\n如果你查看其他 Docker 镜像，会发现有些镜像之间有所不同，因为我一贯采用上述步骤来创建\
  \ Docker 镜像。\n\n你必须构建一个 Docker 镜像才能使用它。要构建 Elasticsearch 镜像，请在 Docker 镜像文件夹中运行以下命令：\n\
  \n```\ndocker build -t bahaaldine/docker-elasticsearch .\n```\n\n`build` 命令会在当前目录中搜索\
  \ `Dockerfile` 文件，并开始构建名为 `bahaaldine/docker-elasticsearch` 的 Docker 镜像（不过你也可以根据需要更改名称）。无论如何，你可以通过执行以下命令来检查本地镜像仓库，确认该镜像是否存在：\n\
  \n```\nbash-3.2$ docker images\n\nREPOSITORY                         TAG     IMAGE\
  \ ID            CREATED            VIRTUAL SIZE\nbahaaldine/docker-elasticsearch\
  \   latest  a3422c874201        About a minute ago  877.4 MB\n```\n\n现在，要启动你的容器，请运行以下命令：\n\
  \n```\nbash-3.2$ docker run -ti -p 9200:9200 -p 9300:9300 --add-host=\"elasticsearch:192.168.59.103\"\
  \ bahaaldine/docker-elasticsearch\n\n2015-08-23 13:33:24,689 CRIT Supervisor running\
  \ as root (no user in config file)\n2015-08-23 13:33:24,689 WARN Included extra\
  \ file \"/etc/supervisor/conf.d/elasticsearch.conf\" during parsing\n2015-08-23\
  \ 13:33:24,697 INFO RPC interface 'supervisor' initialized\n2015-08-23 13:33:24,697\
  \ CRIT Server 'unix_http_server' running without any HTTP authentication checking\n\
  2015-08-23 13:33:24,697 INFO supervisord started with pid 1\n2015-08-23 13:33:25,701\
  \ INFO spawned: 'elasticsearch1' with pid 7\n2015-08-23 13:33:27,331 INFO success:\
  \ elasticsearch1 entered RUNNING state, process has stayed up for > than 1 seconds\
  \ (startsecs)\n```\n\n现在 Elasticsearch 容器正在运行，并在主机的相同端口上暴露了 9200 和 9300 端口，这意味着如果你尝试连接到\
  \ `192.168.59.103:9200`，应该会收到 Elasticsearch REST API 的响应，如清单 7-2 所示。\n\n**清单 7-2.**\
  \ Elasticsearch 安装检查\n\n```\n{\n  status: 200,\n  name: \"lambda-architecture\"\
  ,\n  cluster_name: \"logging\",\n  version: {\n    number: \"1.6.2\",\n    build_hash:\
  \ \"622039121e53e5f520b5ff8720fdbd3d0cb5326b\",\n    build_timestamp: \"2015-07-29T09:24:47Z\"\
  ,\n    build_snapshot: false,\n    lucene_version: \"4.10.4\"\n  },\n  tagline:\
  \ \"You Know, for Search\"\n}\n```\n\n我第一次尝试将我的架构 Docker 化时，脑海中浮现了几个问题：如果我有十个节点的集群该怎么办？架构的其余部分呢？我是否必须在命令行中为每个容器指定特定配置？\n\
  \n你显然理解将架构应用 Docker 化的好处，但如果必须手动管理每个容器，那将是一场噩梦。这正是 Docker Compose 发挥作用的地方。\n\n\n\
  \n### 构建架构\n\n`Composing the architecture`这里包含两层含义；首先，它意味着你将组合 Docker 容器来构建架构，同时也意味着你需要一个高级工具来帮助你管理每个容器的配置和运行时偏好。\n\
  \n幸运的是，`Docker Compose` 正是完成此任务的完美工具。`Compose` 基于单文件配置，允许用户以声明式的方式创建多容器应用。虽然不推荐在生产环境中使用\
  \ `Compose`，但它在开发、预发布或持续集成（CI）环境中至关重要。\n\n在本节中，我将引导你查看以下 GitHub 项目中的 `Docker Compose`\
  \ 文件：\n\n[`https://github.com/bahaaldine/scalable-big-data-architecture/tree/master/chapter7/docker`](https://github.com/bahaaldine/scalable-big-data-architecture/tree/master/chapter7/docker)\n\
  \n与镜像类似，你将重点关注一个容器的配置，并且会看到其他容器的配置基本一致。Compose 文件启动了一个包含以下组件的架构：\n\n*   一个包含单节点\
  \ `Zookeeper` 集群的`两节点` `Kafka` 集群\n*   一个`单节点` `Elasticsearch` 集群\n*   一个`单实例`的\
  \ `Kibana`\n*   一个 `Logstash` 转发器\n*   一个 `Logstash` 处理器\n*   一个 `Logstash` 索引器\n\
  \n清单 [7-3] 展示了组合后的结果。\n\n**清单 7-3.** Docker Compose Lambda 架构文件\n\n```\nzookeeper1:\n\
  \  image: bahaaldine/docker-zookeeper\n  volumes:\n    - \"conf/kafka/server1:/etc/kafka\"\
  \n    - \"logs/zookeeper1:/opt/kafka/logs/\"\n  ports:\n    - \"2181:2181\"\n  extra_hosts:\n\
  \    - \"brokers:192.168.59.103\"\n\nkafka1:\n  image: bahaaldine/docker-kafka\n\
  \  volumes:\n    - \"conf/kafka/server1:/etc/kafka\"\n    - \"logs/kafka1:/opt/kafka/logs/\"\
  \n  extra_hosts:\n    - \"brokers:192.168.59.103\"\n  ports:\n    - \"9092:9092\"\
  \n\nkafka2:\n  image: bahaaldine/docker-kafka\n  volumes:\n    - \"conf/kafka/server2:/etc/kafka\"\
  \n    - \"logs/kafka2:/opt/kafka/logs/\"\n  extra_hosts:\n    - \"brokers:192.168.59.103\"\
  \n  links:\n    - \"kafka1\"\n  ports:\n    - \"9093:9093\"\n\nlogstashProcessor1:\n\
  \  image: bahaaldine/docker-logstash-agent\n  volumes:\n    - \"conf/logstash/processor:/etc/logstash\"\
  \n    - \"conf/security:/etc/logstash/security\"\n    - \"logs/logstash-processor1:/var/log/logstash\"\
  \n  links:\n    - kafka1\n  ports:\n    - \"5043:5043\"\n\nelasticsearch1:\n  image:\
  \ bahaaldine/docker-elasticsearch\n  ports:\n    - \"9200:9200\"\n  volumes:\n \
  \   - \"logs/elasticsearch1:/var/log/elasticsearch\"\n    - \"conf/elasticsearch/templates:/etc/elasticsearch/templates\"\
  \n    - \"data:/data\"\n  extra_hosts:\n    - \"elasticsearch:192.168.59.103\"\n\
  \nlogstashIndexer1:\n  image: bahaaldine/docker-logstash-agent\n  volumes:\n   \
  \ - \"conf/logstash/indexer:/etc/logstash\"\n    - \"logs/logstash-indexer1:/var/log/logstash\"\
  \n  links:\n    - elasticsearch1\n  extra_hosts:\n    - \"brokers:192.168.59.103\"\
  \n    - \"elasticsearch:192.168.59.103\"\n\nlogstashForwarder:\n  image: bahaaldine/docker-logstash-forwarder\n\
  \  volumes:\n    - \"conf/logstash/forwarder:/etc/logstash-forwarder\"\n    - \"\
  conf/security:/etc/logstash-forwarder/security\"\n    - \"logs/logstash-forwarder1:/tmp/logs/\"\
  \n    - \"source:/tmp/source\"\n  extra_hosts:\n    - \"processors:192.168.59.103\"\
  \n\nkibana1:\n  image: bahaaldine/docker-kibana\n  ports:\n    - \"5601:5601\"\n\
  \  volumes:\n    - \"logs/kibana:/var/log/kibana\"\n  extra_hosts:\n    - \"elasticsearch:192.168.59.103\"\
  \n```\n\n如果现在关注 `Elasticsearch` 容器配置，你可能会认出之前在命令行尝试运行容器时传递的一些参数。\n\n```\ndocker\
  \ run -ti -p 9200:9200 -p 9300:9300 --add-host=\"elasticsearch:192.168.59.103\"\
  \ bahaaldine/docker-elasticsearch\n```\n\n你在 Docker `run` 命令中能做的所有操作，都可以在 `Compose`\
  \ `YML` 文件中描述。\n\n首先设置容器镜像：`image: bahaaldine/docker-elasticsearch`  \n然后将主机端口映射到容器端口：\n\
  ```\nports:\n    - \"9200:9200\"\n```\n接下来，将主机文件系统与容器中用于日志、配置以及 `Elasticsearch`\
  \ 存储数据的目录进行映射。这一点很重要，因为当容器关闭时，容器内存储的所有数据都会丢失。因此，映射这些文件夹是为了确保它们能比容器的生命周期更长久。\n```\n\
  volumes:\n    - \"logs/elasticsearch1:/var/log/elasticsearch\"\n    - \"conf/elasticsearch/templates:/etc/elasticsearch/templates\"\
  \n    - \"data:/data\"\n```\n最后，请求 Docker 将一个主机添加到 `/etc/hosts` 文件中。\n```\nextra_hosts:\n\
  \    - \"elasticsearch:192.168.59.103\"\n```\n\n仅此而已。正如我之前所提到的，所有其他容器都以同样的方式配置；你只需运行清单\
  \ [7-4] 中所示的命令即可启动架构。\n\n**清单 7-4.** Docker Compose 项目启动命令\n\n```\ndocker-compose\
  \ up\n```\n\n请注意，在启动 `Compose` 项目之前，我已经构建了所有镜像。这是因为我已经将所有镜像推送到了名为 Docker Hub 的公共\
  \ Docker 注册表中（[`https://hub.docker.com/`](https://hub.docker.com/)）。如果镜像不可用，你会收到错误信息。\n\
  \n我的 Compose 项目附带生成器脚本，该脚本用于在 source 目录中创建一些数据。请记住，`Logstash-forwarder` 正是从该目录传输文件的；这一点同样体现在\
  \ `Compose` `YML` 文件中，如清单 [7-5] 所示。\n\n**清单 7-5.** CFC\n\n```\nlogstashForwarder:\n\
  \  image: bahaaldine/docker-logstash-forwarder\n  volumes:\n    - \"conf/logstash/forwarder:/etc/logstash-forwarder\"\
  \n    - \"conf/security:/etc/logstash-forwarder/security\"\n    - \"logs/logstash-forwarder1:/tmp/logs/\"\
  \n    - \"source:/tmp/source\"\n```\n\nsource 目录被映射到容器的 `/tmp/source` 文件夹。\n\n从治理角度来看，Docker\
  \ 简化了架构配置的过程；现在你需要关注架构的可伸缩性以及如何调整其规模，以便在需要时进行横向扩展。\n\n## 架构可伸缩性\n\n在本节中，我将讨论数据架构中存在的不同可伸缩性区域，并提出一些建议。\n\
  \n\n\n### 架构的规模估算与扩展\n\n在估算架构规模以处理特定数据量并达成特定服务等级协议（SLA）时，答案总是“视情况而定”。\n\n本节的目标并非提供某种万能配方或公式，让架构的每个部分都获得精确的硬件规模估算，而是为您指明方向，助您更好地应对这一问题。\n\
  \n架构的规模估算在架构的不同层级均有需求：\n\n- 在 `Logstash` 处理和索引层面\n- 在 `Kafka`/`Zookeeper` 层面\n-\
  \ 在 `Elasticsearch` 层面\n\n对于所有这些层面，有一些通用方面需要考虑，以进行合理的规模估算。\n\n- 每日输入数据的大小等：了解数据如何在架构中流动，有助于您估算\
  \ `Elasticsearch` 所需的存储量。根据每个节点的总大小，您可以估算索引数据的大小，但别忘了应用压缩率；例如，一个基础的原始日志最终会变成一个索引后的\
  \ JSON 文档，其体积会更大。\n- 摄入数据的结构：数据可能具有简单的结构，例如 Apache 日志，也可能具有多行结构，例如 Java 应用程序异常。\n\
  - 每秒摄入的平均事件数：这提供了有关架构中每个层面为支撑负载所需内存和 CPU 的信息。\n- 保留周期：在摄入时序数据时，有时在集群中保留与搜索相关（即使开始变旧）的数据非常重要。这就是保留原则，根据所需周期，这可能会耗费大量磁盘空间。\n\
  - 是否需要高可用性：在大多数企业用例中，您希望确保如果某个应用程序实例发生故障，整个架构仍能继续运行。每个应用程序可能有不同的术语，但这本质上就是弹性原则。增加更多服务器、副本和实例以避免数据丢失；服务连续性会带来硬件成本，因为显然您不希望在同一台机器上运行应用程序的多个实例。\n\
  \n对于每个应用程序，您还需要考虑一些特定的规模估算因素。\n\n- 预期索引吞吐量：数据摄入和索引的节奏可能不均，这意味着根据一天中的时段（例如在电子商务网站上），您可能会面临不同的负载。因此，设定能够保障此类不常见但重要活动的\
  \ SLA 至关重要。\n- `Kibana` 中的仪表盘数量：请记住，`Kibana` 依赖 `Elasticsearch` API 来构建组成仪表盘的可视化图表。因此，每当您刷新\
  \ `Kibana` 时，它都会向 `Elasticsearch` 发送请求，产生搜索或聚合负载，如果负载显著，集群需要考虑在内。\n- 可视化用户数量：根据用例不同，连接到\
  \ `Kibana` 查看仪表盘的用户数量也可能不同。这将对规模估算产生影响。\n\n拥有所有这些信息还不够；您还需要进行实验，分析我刚才提到的关键性能指标（KPI），以查看您的架构是否可持续。一种简单但有效的方法是，从伪分布式模式架构开始，即架构中每个应用程序都只运行一个实例。此规则不适用于需要至少三台服务器才能具备弹性的\
  \ `Zookeeper`；同样，`Elasticsearch` 主节点（专门用于集群状态管理的特定节点）也是如此。\n\n这个实验可以应用于 `Kafka`、`Elasticsearch`\
  \ 数据节点和 `Logstash` 处理器/索引器。一旦在单实例模式下获得了每个层面的指标，就可以线性地横向扩展，并再次进行性能测试。\n\n其他参数也会影响规模估算，例如\
  \ `Elasticsearch` 上的副本数量，这在许多用例中既能增加弹性，也能提高搜索速度。添加副本会增加所需的机器数量，从而影响您的规模估算。\n\n图\
  \ 7-2 展示了 Lambda 架构具有多个可扩展区域，并且能够横向扩展，这意味着通过向应用程序添加更多节点来增加弹性和负载支持是相当容易的。\n\n![A978-1-4842-1326-1_7_Fig2_HTML.jpg](img/A978-1-4842-1326-1_7_Fig2_HTML.jpg)\n\
  \n*图 7-2. 可扩展区域*\n\n本节的重点在于探讨横向扩展分布式架构时需要考虑的各个方面。\n\n从资源调配的角度来看，由于架构采用了 Docker 化，扩展非常容易，您只需添加带有相关配置的新容器即可。\n\
  \n在摄入层面，到目前为止还没有 `Logstash` 集群的概念；每个实例都是可以独立扩展的轻量级运行时。因此，当您横向扩展时，主要任务是配置相同的输入源以并行化工作负载。\n\
  \n在 `Elasticsearch` 层面，当一个文档被索引时，它会被存储在一个单独的主分片中。`Elasticsearch` 根据清单 7-6 中的公式评估应将文档索引到哪个分片。\n\
  \n*清单 7-6. 文档路由公式*\n\n```\nshard = hash(routing) % number_of_primary_shards\n```\n\
  \n因此，在集群中添加节点不会对现有数据产生任何影响，并可能实现更好的分片分配；然而，增加更多的主分片将使先前的路由值失效，并且需要重新索引所有数据才能检索。当您处理大量数据时，重新索引将耗费大量时间，这就会成为一个问题。\n\
  \n\n\n### 使用 Elastic Stack 监控基础设施\n\n在前面的章节中，您学习了如何搭建一个 Lambda 架构来摄入 Apache 日志以揭示业务分析。该架构的每一层在整个事务处理中都负责特定任务，并且每个应用可能都有不同的重要\
  \ KPI 需要监控。\n\n问题是，为什么不将所学知识扩展到监控您自己的架构呢？这个问题背后的思路是，让您的架构日志能够被摄入，从而获得进一步的运维洞察。\n\
  \n您需要做的只是按照以下步骤来组织架构：\n\n**集中化管理日志。** 如果日志集中存储在 SAN（存储区域网络）、Amazon S3 存储桶或其他网络共享文件夹等单一位置，将有助于简化日志信息的检索以及监控架构的部署。在\
  \ Docker Compose 文件中，配置已设置为将所有日志集中到 Docker Compose 项目的 `logs` 文件夹中。清单 7-7 展示了 Zookeeper\
  \ 的配置。\n\n清单 7-7. Docker Compose Kafka 配置\n\n```\nkafka1:\n  image: bahaaldine/docker-kafka\n\
  \  volumes:\n    - \"conf/kafka/server1:/etc/kafka\"\n    - \"logs/kafka1:/opt/kafka/logs/\"\
  \n  extra_hosts:\n    - \"brokers:192.168.59.103\"\n  ports:\n    - \"9092:9092\"\
  \n```\n\n然后，您应该考虑重用现有的 Elasticsearch 集群，或者创建一个新的集群。显然，这个问题的答案取决于不同因素，例如现有集群的密度和工作负载，甚至是购置新机器时可能涉及的成本等非技术因素。如果是专用集群，事情会更简单；如果不是，则事件应存储在新的索引中，例如通过新的“monitoring”索引别名。有时不同的事件类型会被索引；您应该记住，Kibana\
  \ 会处理整个索引，而不会区分索引内不同类型的文档。因此，正确命名事件以避免字段冲突也是您需要考虑的一点。\n\n使用 Curator（`https://github.com/elastic/curator`）来管理索引也至关重要！我前面讨论过保留期限，这对于监控架构同样重要。随着监控日志被摄入和索引，基于时间的索引会被创建，通过\
  \ Curator，您将能够安排关闭、归档或删除索引的流程（例如，所有超过六周的索引）。\n\n最后要考虑的是整个架构的安全性，将在下一节中描述。\n\n###\
  \ 考虑安全性\n\n安全性很复杂，尤其是在分布式架构中。理想情况下，存在一组工具和最佳实践可以减少保护架构安全的痛苦。\n\n- 第一个提示与将您的架构 Docker\
  \ 化有关。每个容器都与外界隔离。您可以限制容器将使用的资源数量，例如 RAM、CPU 或网络使用量，但您也可以限制网络连接层面的访问权限。\n\n不过，有时您需要将容器暴露给外部世界。例如，在前面的示例中，我设置了\
  \ Docker Compose YML 文件的配置，使得 Elasticsearch 容器暴露了 9200 端口，如清单 7-8 所示。\n\n清单 7-8.\
  \ Docker Compose Elasticsearch 配置\n\n```\nelasticsearch1:\n  image: bahaaldine/docker-elasticsearch\n\
  \  ports:\n    - \"9200:9200\"\n  volumes:\n    - \"logs/elasticsearch1:/var/log/elasticsearch\"\
  \n    - \"conf/elasticsearch/templates:/etc/elasticsearch/templates\"\n    - \"\
  data:/data\"\n  extra_hosts:\n    - \"elasticsearch:192.168.59.103\"\n```\n\n- 如果主机上的端口未得到安全保护，这就构成了安全漏洞。理想情况下，这不需要任何特定的安全配置，可以通过常规的安全最佳实践（如\
  \ IP 过滤、代理等）来处理。\n- 从转发器到处理器的日志传输通过使用证书的 Lumberjack 协议得到安全保障。\n- Kibana 也需要暴露其端口，以便用户访问仪表盘。在安全最佳实践方面，这里同样适用；您可以简单地部署一个代理\
  \ Web 服务器（如 Apache Web 服务器），并将其配置为暴露 HTTPS 端点。\n- 最后是访问 Elasticsearch 中的数据。即使您在\
  \ Elasticsearch 前放置了代理，默认情况下一个用户也可以访问其他用户的索引。截至目前，保护 Elasticsearch 数据和访问权限唯一受支持的方法是使用一个名为\
  \ `Shield` 的商业插件。\n\n`Shield` 是一个 Elasticsearch 插件，为 ELK 堆栈提供了多种安全功能，包括以下内容：\n\n\
  - 基于角色的访问控制：可以定义角色并将其映射到用户或用户组。每个权限都可以进行精细配置，例如集群和索引级别的权限。在这种情况下，您可以隔离共享的 Elasticsearch\
  \ 集群，使每个用户只能看到其拥有相关权限的数据和资产。\n- LDAP 或 Active Directory 用户：`Shield` 可以连接到您的 LDAP\
  \ 或 Active Directory，这样您就不需要在 Elasticsearch 中重新定义所有用户；这只会影响角色，并且您可以利用现有的身份验证机制。用户可以是真实的人类用户，甚至可以是技术用户，例如在\
  \ Elasticsearch 中索引文档的 Logstash 代理。\n- 加密通信：`Shield` 支持通过 SSL 和 TLS 进行加密通信。\n- 审计日志记录：对集群的每次访问都会被记录。\n\
  - IP 过滤：您可以限制对特定 IP 地址或 IP 地址范围的访问。\n\n因此，随着集群的增长、为用户提供更多入口点以及在不同的数据项目之间共享资源，您可能需要考虑添加一个企业级插件，例如\
  \ `Shield`，来保护您的架构。\n\n## 总结\n\n数据架构本质上是分布式且高度可扩展的。在本章中，您学习了如何通过使用 Docker Compose\
  \ 打包架构，为治理层面持续带来灵活性。至此，您应该能够扩展此架构，例如添加新组件，并用新的配置来丰富 Docker Compose 项目。\n\n\n\n"
