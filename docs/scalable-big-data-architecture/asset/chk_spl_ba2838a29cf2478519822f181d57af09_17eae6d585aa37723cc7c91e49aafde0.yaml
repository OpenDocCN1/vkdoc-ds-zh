  - 规则明确指出：“前言、序言、致谢、关于作者等正文之前的内容，统一划分为一章”。目录（Table of Contents）通常被视为这部分前置内容的组成部分，或者紧随其后。
  - 如果在第0行（书名/扉页）已经划分了第一章（前置部分），那么第62行的“## 目录”作为二级标题（##），在Markdown层级上低于顶级标题（#）。即使它标记了目录的开始，在语义上它通常不与“正文第一章节”并列，而是归属于前置元数据区域。
  - 原审查员认为它是独立章节，但更合理的结构是：[0-61] 为前置章节（包含扉页、版权、献词等），[62-161] 为目录章节（如果分得这么细），或者整个前置部分合并。将目录单独视为一个与“第1章”同级的章节并不完全符合常规书籍结构，通常目录只是前置页码的一部分。
