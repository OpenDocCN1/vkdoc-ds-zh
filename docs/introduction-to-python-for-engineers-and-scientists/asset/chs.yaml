  31  False\n32  # result is false because both arrays have different shapes\n```\n\
  \n## 6.4 自动创建数组\n\n存在多种函数可以自动创建所需维度和形状的数组。这在数学计算中非常方便，因为手动创建数组是一项繁琐的任务。\n\n### 6.4.1\
  \ zeros( )\n\n要创建一个所有元素都为 0 的数组，我们使用`zeros()`函数：\n\n```\n1  >>> numpy.zeros((3,4))\
  \ # arrays of float tyoe by default\n2  array([[ 0.,  0.,  0.,  0.],\n3  [ 0., \
  \ 0.,  0.,  0.],\n4  [ 0.,  0.,  0.,  0.]])\n5  >>> numpy.zeros((3,4),dtype=int)\
  \ # array of int data type\n6  array([[0, 0, 0, 0],\n7  [0, 0, 0, 0],\n8  [0, 0,\
