  \ `savefig()` 函数的字符串参数中提供了正确的路径，并且您拥有在该路径下创建文件的适当权限，则会在该路径下创建文件。\n\n![A458920_1_En_7_Fig15_HTML.jpg](img/A458920_1_En_7_Fig15_HTML.jpg)\n\
  \n图 7-15\n\n子图\n\n```\n1  import matplotlib.pyplot as pt\n2  import numpy as np\n\
