  \n\n\n## 9.4 类型\n\n每个对象都有一个关联的类型。类型决定了内存存储需求以及可以对对象进行的计算操作。例如，`int` 和 `float` 是两种不同的对象类型，因为\
  \ `int` 存储整数，而 `float` 存储浮点数。虽然 `float` 需要存储关于小数点前后有多少位数字的信息，但 `int` 对象则无需考虑这些。类似地，复数存储在另一种类型的对象中（恰当地命名为\
  \ `complex`），因为它需要存储复数的两个部分：实部和虚部。因此，它们在计算机内存中的存储方式必然大不相同，并且在后续计算中的使用方式也截然不同。\n\n\
