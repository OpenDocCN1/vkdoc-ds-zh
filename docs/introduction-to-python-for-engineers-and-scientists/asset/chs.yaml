  8  array([ 1.+0.j,  2.+0.j,  3.+0.j])\n9  >>>a2.dtype\n10  dtype('complex128')\n\
  ```\n\n`ndarray`也以其别名`array`而闻名。除了使用`dtype`了解数据类型外，还有多种方法可以获取有关`ndarray`各种属性的信息，如表\
  \ 6-1 所示。\n\n表 6-1\n\n探测数组属性的各种方法\n\n| `ndarray.dtype` | 元素的数据类型 |\n| `ndarray.ndim`\
  \ | 数组的维度 |\n| `ndarray.shape` | 数组的形状，对于 (n, m) 数组为 (n, m) |\n| `ndarray.size`\
  \ | 数组的大小，n × m |\n| `ndarray.itemsize` | 每个元素的字节大小 |\n| `ndarray.data` | 包含实际元素的缓冲区数据\
  \ |\n| `ndarray.reshape` | 保持 n × m 常数的情况下重塑形状 |\n\n表 6-1 可以通过以下 Python 代码理解。我们首先定义一个名为`a3`的\
  \ 3 数组，然后使用列出的方法探测此对象的属性：\n\n```\n1  >>> a3 = numpy.array( [ (1,2,3), (4,5,6), (2,7,8)\
  \ ] ) # defining array\n2  >>> a3 # REPL prints contents of a3\n3  array([[1, 2,\
  \ 3],\n4  [4, 5, 6],\n5  [2, 7, 8]])\n6  >>> a3.ndim # number if dimesnions of a3-2\
  \ i.e it can be described in terms of rows and columns\n7  2\n8  >>> a3.size # total\
