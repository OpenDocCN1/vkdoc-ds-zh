  `while` 循环的语法如下：\n\n```\n1  while 表达式:\n2  语句\n```\n\n请注意，`语句`通过缩进进行分组。`语句`可以是单个或多个操作。`条件`是一个逻辑表达式。循环会一直迭代，直到逻辑表达式的值为\
  \ `True`。一旦其值变为 `False`，程序控制权将传递给下一行。`while` 循环在条件不满足时必须跳过循环的情况下扮演着重要角色，因为如果逻辑表达式的值为\
  \ `False`，则不会执行任何语句。\n\n程序 `while.py` 提供了一个示例代码，演示了 `while` 循环的工作原理。（参见清单 8-8。）这里使用了另一个模块\
  \ `time` 来计算两行代码的执行时间。输入 `help(time)` 可以获取关于其用法的重要文档。函数 `time.clock()` 返回一个浮点数，表示自进程开始或首次调用此函数以来的\
  \ CPU 时间。通过将两者相减，可以得到一个表示执行语句所花费秒数的数字。\n\n```\n1  # 演示 while 循环用法的程序\n\n3  # 计算步数及其执行时间的程序\n\
