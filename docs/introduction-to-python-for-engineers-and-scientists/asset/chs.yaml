- "# 1. Python 的哲学\n\n## 1.1 引言\n\nPython 之所以能在包括 C、C++ 和 Java 在内的成熟且经过优化的语言中脱颖而出\
  \ [1]，原因非常简单。Python 融合了一种哲学理念：复杂的任务可以用简单的方式完成。我们往往认为，现实世界中的复杂问题需要复杂的路径才能产生复杂的解决方案。而\
  \ Python 的开发者们秉持的恰恰是相反的哲学。Python 的创建旨在为软件工程师提供一条极其快速且简单的学习曲线和开发流程。因此，它被认为是最通用的编程语言，因为用户几乎可以在任何研究领域工作，并且仍然能够找到对自己有用的代码片段。Python\
  \ 利用了开源运动的力量，这帮助它积累了来自各行各业的大量用户。由于本质上是开源的，Python 允许人们编写小程序并轻松地相互分享。在 Python 中，一组用于执行各种任务的程序构成了一个模块（包）。截至撰写本文时，已有超过\
  \ 117,181 [2] 个模块由世界各地更多的开发者提交。大量的模块和开发者使得 Python 在计算机科学社区中的使用量迅速增长，并最终占据了最受欢迎 [1]\
  \ 编程语言的头把交椅。\n\nPython 的哲学可以用一句话来概括：\n\nPython 是一种多用途、可移植、面向对象的高级编程语言，它提供了一个交互式环境，能够以极简的方式进行编码。\n\
  \n让我们来看看 Python 的各个特性。\n\n### 1.1.1 高级编程\n\n高级编程语言是一种与特定计算机的细节相分离的语言。低级语言是指用户直接将机器码输入处理器以获取结果的语言。高级语言提供了诸如库函数之类的设施来执行低级任务，并且还提供了以人类可读的形式定义代码的方法，然后这些代码会被翻译成机器语言以供处理器执行。\n\
  \n### 1.1.2 交互式环境\n\n在很大程度上，Python 的哲学源自 ABC 语言。其语法结构主要源自 C 语言和 UNIX 的 Bourne shell\
  \ 环境。这些环境为工作环境的解释性本质提供了灵感。解释性意味着 Python 为开发者提供了一个基于 REPL 的交互式环境。Python 编程语言的交互式\
  \ shell 通常被称为 REPL（读取-求值-打印-循环），因为它：\n\n*   读取用户输入的内容，\n*   求值它读取的内容，\n*   打印出求值后的返回值，并且\n\
  *   循环回去，重复整个过程。\n\n这种交互式工作环境对于调试尤其有用。它也有助于对问题进行原型设计，在此过程中可以实时可视化每一步的输出。用户一写完特定代码，就可以立即检查其结果。使用\
  \ Python REPL 的方式是编写代码、分析结果，并持续此过程直到计算出最终结果。除了允许快速简便地求值 Python 语句外，该语言还展示了以下特性：\n\
  \n*   可搜索的历史记录\n    *   用户可以按键盘上的向上和向下键来浏览之前的命令，而无需重新编写。\n*   制表符补全\n    *   用户只需在输入命令的几个字母后按\
  \ Tab 键，它就会自动补全。\n    *   因此，制表符补全消除了语法错误。\n    *   如果按 Tab 键时有多个选项匹配，这些选项会显示在命令提示符下，以便用户选择他们想要的那个。\n\
  *   许多有用的快捷键绑定\n    *   快捷键绑定取决于操作系统。\n    *   快捷键绑定有助于快速操作，其中组合键等同于特定操作。\n*   帮助和文档\n\
  \    *   在 Python 中获取主题帮助和查找文档非常容易。\n    *   用户可以将任何参数作为字符串（即用双引号括起来的字符）传递给内置函数\
  \ `help()`。\n\n除了交互性之外，Python 还是一种解释型语言。其他语言需要将源代码转换为可执行文件，然后在机器上运行——换句话说，即 AOT（提前）编译——而\
  \ Python 则直接从源代码运行程序。Python 将源代码转换为一种称为字节码的中间形式，然后将字节码翻译成计算机的本机语言并运行它。这是一种 OTF（即时）编译类型，实现了可移植性，并使开发者能够以交互方式更轻松地编写和检查程序。\n\
  \n### 1.1.3 面向对象\n\n大多数原始的编程语言本质上是过程式的。换句话说，定义一组过程来计算一个问题，信息流在这些过程中被控制以获得期望的输出。因此，一个程序仅仅被划分为相互交互的代码块，其中一个代码块定义了属于所研究计算问题的计算子任务。相反，面向对象编程（OOP）语言将数据视为一个对象，不同的方法作用于该对象以产生期望的结果。一切可计算的事物都被视为对象。其本质被定义为其属性。这些属性可以通过函数（称为方法）来探查。对象的抽象特性使得发明用户自己选择的对象成为可能，并将编程概念应用于各种应用程序。\n\
  \n### 1.1.4 多用途特性\n\n如前一节所述，Python 基于 OOP 的架构使得来自不同领域的开发者能够在其专业领域内使用并丰富该语言。几乎所有计算领域都使用了\
  \ Python。你可以为某一种问题定义一个特定的模块。事实上，针对特定研究领域存在 Python 模块，如表 1-1 所示。\n\n**表 1-1** 研究领域及对应的\
  \ Python 模块列表\n\n| 研究领域 | Python 模块名称 |\n| --- | --- |\n| 科学计算 | `scipy`, `numpy`,\
  \ `sympy` |\n| 统计学 | `pandas` |\n| 网络 | `networkx` |\n| 密码学 | `pyOpenSSL` |\n| 游戏开发\
  \ | `PyGame` |\n| 图形用户界面 | `pyQT` |\n| 机器学习 | `scikit-learn`, `tensorflow` |\n|\
  \ 图像处理 | `scikit-image` |\n| 绘图 | `Matplotlib` |\n| 数据库 | `SQLAlchemy` |\n| HTML\
  \ 和 XML 解析 | `BeautifulSoup` |\n| 自然语言处理 | `nltk` |\n| 测试 | `nose` |\n\n由于模块每天都在被创建，因此不可能列出给定应用程序的所有模块。表\
  \ 1-1 列出了截至撰写本文时最广泛使用的模块。来自世界各地的开发者正在以惊人的速度使用和开发模块。由于 Python 可用于广泛的计算领域，它确实是迄今为止最多用途的编程语言。\n\
  \n\n\n### 1.1.5 极简设计\n\n`Python` 的极简设计理念意味着它强调代码的可读性。它还提供了一种语法结构，使程序员能够用比 `C++`\
  \ 和 `Java` 等语言更少的代码行来表达概念。此外，`Python` 提供了编写易于扩展的程序的方法。`Python` 具有动态类型系统，`Python`\
  \ 解释器会根据对象的定义来推断其类型，从而避免了用户自行定义类型的需要。\n\n该语言的核心哲学由 `Tim Peters` 在文档 *Python 之禅*（`PEP\
  \ 20`）[3] 中进行了总结，其中包含以下格言：\n\n- 优美胜于丑陋。\n- 显式胜于隐式。\n- 简单胜于复杂。\n- 复杂胜于凌乱。\n- 扁平胜于嵌套。\n\
  - 稀疏胜于密集。\n- 可读性至关重要。\n- 特殊情况也不足以特殊到打破规则。\n- 尽管实用性胜过纯粹性。\n- 错误永远不应静默传递。\n- 除非明确需要静默。\n\
  - 面对歧义，拒绝猜测的诱惑。\n- 应该有一种——最好只有一种——显而易见的方法来做这件事。\n- 尽管这种方法一开始可能并不明显，除非你是荷兰人。\n- 现在做胜于永不开始。\n\
  - 虽然永不开始通常比“立刻动手”更好。\n- 如果实现难以解释，那可能是个坏主意。\n- 如果实现易于解释，那可能是个好主意。\n- 命名空间是个绝妙的主意——让我们更多地使用它们吧！\n\
  \n### 1.1.6 可移植性\n\n由于 `Python` 属于开源社区，它已被移植（即经过适配）到众多平台上，使得在一个平台上编写的 `Python` 代码无需修改即可在其他平台上运行（系统相关功能除外）。`Python`\
  \ 已发布适用于主流操作系统的版本，包括 `Linux`、`Windows`、`Macintosh`、`Solaris` 和 `Sony PlayStation`。\n\
  \n### 1.1.7 可扩展性\n\n`Python` 的创造者并未在其核心程序中提供所有功能，而是将其设计为高度可扩展的。因此，用户可以根据自己的需求选择所需的功能。例如，如果用户需要处理微分方程，那么该用户可以使用一个微分方程模块，而不是让所有用户都拥有这个功能却从未使用。`Python`\
  \ 也可以嵌入到需要可编程接口的现有应用程序中。\n\n`Python` 程序可以嵌入到用 `Julia`、`C`、`C++` 等编程语言编写的其他程序中。此外，其他编程语言的代码也可以嵌入到\
  \ `Python` 中。这一特性使得大量用其他语言编写、且已针对速度和稳定性进行优化的遗留代码得以使用，从而避免了重复劳动，并极大地提高了组织的生产力。因此，`Python`\
  \ 受到了工业界和学术界的热烈欢迎。\n\n## 1.2 历史\n\n`Python` 编程语言的发展可以追溯到 20 世纪 80 年代。荷兰 `CWI` 的\
  \ `Guido van Rossum` 于 1989 年 12 月开始实现它。那是一个计算设备日益强大和可靠的时代。`Van Rossum` 以 BBC 电视节目\
  \ *Monty Python’s Flying Circus* 命名了该语言。`Python 1.0` 于 1994 年向公众发布，`Python 2.0`\
  \ 于 2000 年发布，`Python 3.0` 于 2008 年发布。然而，`Python 3` 在设计上并未向后兼容 `Python 2`，这使得它对于已经使用\
  \ `Python 2` 进行开发的用户来说不太实用。因此，许多开发者至今仍在使用 `Python 2`。尽管如此，未来属于 `Python 3`，它是以更高效的方式开发的。因此，本书将讨论基于\
  \ `Python-3` 的代码。\n\n### 1.2.1 Python 2 与 Python 3 对比\n\n在这一点上，需要注意的是 `Python 3`\
  \ 并不向后兼容。互联网上充斥着用 `Python 2` 编写的代码。学习如何将这些代码从 `Python 2` 转换为 `Python 3` 非常重要 [4,\
  \ 5]。当你理解了它们的基本结构和基本用法后，就能明白它们之间差异的技术细节。\n\n## 1.3 Python 与工程学\n\n工程问题既涉及小规模也涉及大规模的数值计算。因此，工程应用需要一种编程语言能够很好地适应这两种场景。很少有语言能具备这种特性，所以\
  \ `Python` 在这方面无疑是赢家。在较大的计算架构上运行大型计算任务时，内存管理、速度和可靠性是关键参数。`Python` 作为一种解释型语言，在这方面通常被认为速度较慢，但它能够使用通过互连包\
  \ `cython`、`jython` 和 `f2p` 编写的、用 `C`、`Java` 和 `Fortran` 编写的更快代码，从而允许在 `Python`\
  \ 代码中以这些原生语言运行速度密集型任务。这一能力减轻了世界各地许多程序员对于是否必须用 `Python` 重写已优化代码的疑虑。\n\n另一个工程方面的关注点是编程语言与物理设备高效通信的能力。电子设备通过有线和蓝牙无线技术连接到互联网。使用合适的\
  \ `Python` 模块，用户可以连接到兼容设备以从中获取数据，然后在所需平台上进行可视化。多种微控制器允许 `Python` 轻松地在硬件上运行。`MicroPython`\
  \ [6] 就是为此目的而专门设计的。`MicroPython` 是 `Python 3` 编程语言的一个精简高效的实现，它包含了 `Python` 标准库的一小部分，并针对在微控制器和受限环境中运行进行了优化。即使是像\
  \ `Raspberry Pi` 这样的微型计算机，也允许运行访问输入输出设备的 `Python` 程序。这使得工程问题的原型设计具有成本效益。\n\n`MATLAB`\
  \ 的用户认为 `Simulink` 是原型设计和模拟工程问题最简单的方法之一，因为他们无需编写代码。相反，用户只需在图形终端上将图形块表示的代码片段拼接在一起。（`Scilab`\
  \ 也提供了一个名为 `Xcos` 的类似平台。）`Python` 仍然缺乏这种能力，有抱负的程序员可以将其视为一个挑战。大量的开发者社区正在热切期待这样的解决方案，但大多数工程师不会介意花一两天时间学习一门新的编程语言，这门语言可以提升他们的生产力，而这是现成工具无法提供的。\n\
  \n\n\n## 1.4 模块化编程\n\nPython 编程的模块化特性将复杂任务分解为可无缝交互的小模块。模块使开发和调试都变得更加容易，只需简单导入即可使用各种函数。\n\
  \nPython 自带数千个模块用于执行各种任务。由于本书是科学计算的入门教材，因此仅讨论几个基本必要模块（如表 1-2 所示）的用法。\n\n**表 1-2**\
  \ 基本 Python 模块\n\n| 包名 | 含义 | 用途 |\n| --- | --- | --- |\n| `numpy` | 数值 Python |\
  \ 数值计算 |\n| `scipy` | 科学 Python | 科学计算 |\n| `sympy` | 符号 Python | 符号计算 |\n| `matplotlib`\
  \ | 数学绘图库 | 绘制图表 |\n\n需要注意的是，虽然现代个人计算机拥有大容量内存，但像树莓派这样的微型计算机内存有限。因此，强烈建议明智地使用这些内存资源。由于所有模块都会占用内存，因此应按需安装。此外，应在程序中按需导入模块。Python\
  \ 允许选择性导入特定函数以优化内存使用。编写避免浪费资源的程序被认为是一种良好的实践。\n\n逐一介绍每个模块的用法超出了本书的范围。模块将根据当前主题的需要进行介绍。鼓励用户自行探索各种模块及其文档以了解用法。模块及其函数的一般用法将在本书后续部分讨论。\n\
  \n## 1.5 总结\n\nPython 因其平缓的学习曲线和陡峭的开发曲线而受到全球广泛关注。近年来，它在编程语言流行度方面已跃居榜首。由于其开源模式拥有庞大的开发者基础，Python\
  \ 为解决许多工程问题所需的各种任务提供了丰富的模块库。因此，掌握 Python 的工程师能够满足现代工业的需求，即要求快速高效地解决问题。\n\n"
- "# 2. Python 基础入门\n\n## 2.1 引言\n\n学习 Python 的最佳方式是在 Python 解释器上尝试使用 Python。在本章中，我们将说明如何安装和使用\
  \ Python 解释器。安装可在所有主流操作系统上进行。作为示例，我们将演示在 Windows、Ubuntu（Linux）和 Mac OS X 上的安装过程。\n\
  \n## 2.2 安装\n\nPython 解释器已为多种平台提供。操作系统定义了以特定方式存储文件和运行代码的方案。这些不同的方案需要不同的 Python 解释器设置，以便其能够与提供计算资源的主机兼容。最流行的三种操作系统选择是\
  \ Windows、Linux 和 Mac OS X。虽然 Linux 和 Mac OS X 预装了 Python 解释器，但 Windows 操作系统需要单独的安装软件。Python\
  \ 社区网站 [1] 提供了了解该领域进展的主要途径。它还提供了用于安装的源代码的官方下载 [2]。\n\n### 2.2.1 Windows\n\n用户可以根据系统配置下载\
  \ 32 位或 64 位安装程序文件，然后直接点击启动安装过程。安装完成后，应用程序安装目录中会出现一个图标。双击该图标即可打开 Python shell（图\
  \ 2-1），这是一个运行 Python 解释器的程序。\n\n![A458920_1_En_2_Fig1_HTML.jpg](img/A458920_1_En_2_Fig1_HTML.jpg)\n\
  \n**图 2-1** Windows 操作系统上的 Python IDLE\n\n下载的 IDLE 还提供了一个可以运行脚本的文本编辑器选项。或者，如果你已正确将解释器路径配置到系统，可以直接打开终端并输入以下命令：\n\
  \n```\n$python hello.py\n```\n\n这里我们假设你想运行一个名为 `hello.py` 的 Python 程序。（所有 Python\
  \ 程序都以 `.py` 扩展名保存。）\n\n我们建议学习使用 Python 终端进行交互式编程，并按照之前讨论的方式执行多行代码。此后，在 Python 提示符（`>>>`）下编写的代码将表示代码是逐行编写并以类似方式执行的，以便程序员在\
  \ Python 提示符下进行交互式工作。本书中使用的 `.py` 文件在系统终端中执行。\n\n### 2.2.2 Ubuntu\n\nPython 解释器几乎预装在所有的\
  \ Linux 发行版中。这里我们以 Ubuntu Linux 系统为例。可以通过在 Linux 命令终端中输入 `python3` 并按回车键来调用 Python\
  \ 3 解释器。终端将进入 Python 解释器会话（图 2-2），程序员可以在其中输入 Python 表达式。\n\n![A458920_1_En_2_Fig2_HTML.jpg](img/A458920_1_En_2_Fig2_HTML.jpg)\n\
  \n**图 2-2** 在 Ubuntu 上运行的 Python 解释器\n\n要退出解释器，需要在 Python 解释器中输入 `exit()`。当返回 Linux\
  \ 终端后，就可以输入 Linux 表达式了。\n\n### 2.2.3 Mac OS X\n\nMac OS X 的工作方式与所有 Linux 发行版相同。Python\
  \ 解释器已预装。只需在终端中输入 `python3` 即可启动 Python 解释器会话。（参见图 2-3。）\n\n\n\n## 2.3 使用 Python\
  \ 解释器\n\nPython 是一种解释型语言，与 C、C++、Java 等编译型语言不同。它的每一行代码都会被解释并作为字节码执行，而不是生成一个单一的机器码文件。这使得其计算架构与传统语言截然不同。例如，假设一个多行\
  \ Python 程序的第 5 行存在语法错误。在这种情况下，程序会执行到第 4 行的所有命令，然后显示错误。而对于编译型语言，编译步骤会显示错误，并且程序根本不会运行，也就是说不会生成机器码文件。要详细了解这种差异，你首先需要理解编译和解释的过程。\n\
  \n![A458920_1_En_2_Fig3_HTML.jpg](img/A458920_1_En_2_Fig3_HTML.jpg)\n\n**图 2-3**\
  \ 在 Mac OS X 上运行的 Python 解释器\n\n对于编译型语言，编译器会将人类可读的代码翻译成机器可读的汇编语言。机器可读的代码称为目标代码，由目标文件提供。这些目标文件可以直接在机器上运行。举个例子，假设一个\
  \ C 代码定义如下，并保存在名为 `hello.c` 的文件中：\n\n```\n1  /∗ Hello World program ∗/\n\n3  #include\
  \ \n\n5  main()\n6  {\n7  printf (\"Hello World\");\n\n9  }\n```\n\n要在带有 `gcc` 编译器的类\
  \ UNIX 机器上编译这段代码，我们给出以下命令：\n\n```\ngcc hello.c -o hello\n```\n\n这会创建一个名为 `hello`\
  \ 的目标代码。在编译过程中，头文件 `stdio.h` 用于理解输入输出语句，例如 `printf(\"Hello World\")`。然后，可以通过在 UNIX\
  \ 终端上输入以下命令来执行目标代码：\n\n```\n./hello\n```\n\n用户可以共享这个目标文件，如果微处理器架构与另一个用户相同，它将被统一执行。然而，如果机器架构不同，则必须首先为目标机器编译源代码，然后才能执行。\n\
  \nPython 的情况则不同。作为一种解释型语言，它使用解释器将代码解释为中间代码，然后再转换为机器码。解释器读取程序的源代码文本，对其进行分析，并逐行执行。这个过程很慢，因为解释器花费大量时间分析字符串以理解其含义。例如，要像\
  \ C 程序那样输出 `hello world`，Python 需要以下代码：\n\n```\n1  >>>print (\"hello world\")\n\
  2  >>>hello world\n```\n\n仅在一行中，解释器就会扫描单词 `print` 并查找其含义。在 Python 解释器中，它意味着向特定设备输出。设备可以是计算机终端、打印机绘图仪等。默认情况下，它是计算机终端。`print`\
  \ 命令还需要参数，这些参数在第二步中被扫描为字符串 `hello world`。（Python 中的字符串可以用 `\"` 或 `\"\"` 括起来）。因此，这一行的完整解释是：在计算机终端上打印字符串\
  \ `hello world`。\n\n当一个程序由成百上千行代码组成时，编译过程会产生更快的结果，因为目标代码只需编译一次，然后就可以直接在微处理器上运行。而解释型代码每次需要处理时都会检查解释。另一方面，即使是一个语法错误也会导致编译过程无法完成，从而产生编译错误。相反，Python\
  \ 解释器会解释 Python 代码，直到遇到任何类型的错误为止。\n\n尽管 Python 本质上较慢，但由于其拥有丰富的模块库，可用于各种计算任务，并且极其简单、直观且功能强大，它已成为科学家和工程师的最爱。\n\
  \n## 2.4 Anaconda IDE\n\nAnaconda IDE（集成开发环境）是为初学者和经验丰富的开发者获取工作环境最便捷、最完整的方式之一。IDE\
  \ 提供了一个 Python 命令行解释器——一个具有语法补全、关键字高亮和文件浏览器等高级功能的文本编辑器。Anaconda 以简单直观的方式提供了所有这些功能以及更多特性。可以使用其网站\
  \ [3] 上提供的图形化安装程序非常简单地安装它。\n\n![A458920_1_En_2_Fig4_HTML.jpg](img/A458920_1_En_2_Fig4_HTML.jpg)\n\
  \n**图 2-4** Anaconda IDE\n\n图 2-4 中的 Spyder IDE 提供了一种使用 IDE 环境开发 Python 文件的简便方法。它呈现三个窗格：\n\
  \n1.  **编辑器**\n    *   您可以在此编写多行程序，并通过单击 `Play` 或单击主菜单栏中的 `Run` 选项来执行它。\n\n    ![A458920_1_En_2_Fig5_HTML.jpg](img/A458920_1_En_2_Fig5_HTML.jpg)\n\
  \n    **图 2-5** Anaconda IDE\n\n2.  **IPython 控制台**\n    *   您可以在此编写 Python 表达式，并通过按\
  \ `Enter` 键来执行它们。\n\n3.  **变量资源管理器 / 文件资源管理器 / 帮助**\n    *   **变量资源管理器**\n     \
  \   *   变量资源管理器显示会话期间创建的所有变量（稍后解释）的详细信息及其属性（名称、类型、大小和值）。\n    *   **文件资源管理器**\n\
  \        *   文件资源管理器显示会话期间创建的所有文件的详细信息及其属性（名称、大小、类型和修改日期）。\n    *   **帮助**\n   \
  \     *   此工具提供开发者查询的任何主题的有用文档。\n\n我们是在 Mac OS X 10.12.6 系统上使用 Anaconda IDE 编写本书的。由于\
  \ Python 程序是可移植的，它们将以与任何 Python 3 解释器类似的方式运行。\n\n## 2.5 将 Python 用作计算器\n\n让我们开始使用\
  \ Python 解释器，以便更清楚地理解它。首先，在 Python 解释器的命令提示符 `>>>` 后输入命令，然后按键盘上的 `Enter` 键。\n\n\
  在最简单的形式中，Python 解释器可以用作计算器。在 Python 命令提示符下，可以检查 `2 + 4` 的以下命令：\n\n```\n1  >>>2+4\n\
  2  6\n3  >>>2.+4\n4  6.0\n5  >>>2.0+4\n6  6.0\n7   >>>2.0+4.\n8  6.0\n9  >>>2.0+4.0\n\
  10  6.0\n```\n\n根据这些计算，`2 + 4` 得到 `6`，而 `2 + 4.` 得到 `6.0`。对于计算机来说，`6` 和 `6.0` 是两个不同的对象。`6`\
  \ 是一个整数，存储空间比 `6.0` 小，而 `6.0` 是一个浮点数。就像两种数值数据一样，数据可以分为不同类型的对象（不一定是数值）。Python 将所有条目视为对象。一个对象需要用其属性/特性来定义。例如，与整数相比，浮点数在加法、减法、屏幕打印和图形表示方面有不同的规则。因此，浮点数是一种与整数截然不同的\
  \ `数据类型`。稍后将讨论数据类型的详细列表。\n\n同样重要的是要注意，要定义浮点数 `4.0`，即使只写 `4.` 也足够了。`4.0` 和 `4.` 是等价的。类似地，`0.4`\
  \ 和 `.4` 都表示数学数字 `0.4`。此外，Python 通过分析对象的值动态地为它们分配 `类型`，因此 `2` 变成了数值数据的 `int`（整数类型），而\
  \ `2.0` 变成了 `float`（浮点数类型）。我们没有显式定义对象的类型；它是由解释器动态分配的。我们也可以显式定义类型。这涉及到使用特定数据类型对应的函数。以下代码通过使用两个函数\
  \ `int()` 和 `float()` 来解释这一现象，这两个函数分别将给定的输入（括号内）转换为整数和浮点数。\n\n```\n1  >>> int (2)\n\
  2  2\n3  >>> int (2.0)\n4  2\n5  >>> float (2)\n6  2 . 0\n7  >>> float (2.0)\n8\
  \  2.0\n```\n\n\n\n## 2.6 模块\n\nPython 多宇宙已扩展出数千个模块，并且由于是开源的，其中大部分都可以直接获取。模块是为完成特定任务而编写的\
  \ Python 程序集合。例如，`numpy` 提供了各种用于数值计算的功能。它进一步扩展为 `scipy`，用于通用科学计算。`matplotlib` 是数学绘图库的缩写，拥有丰富的功能，可以绘制各种达到出版质量的图表。`pandas`\
  \ 是用于数据分析的库，`scikit-learn` 用于机器学习，`scikit-image` 用于图像处理，`sympy` 用于符号计算。\n\n要使用一个模块，必须首先将其安装在机器上。安装过程包括将文件下载到合适的文件夹或目录中，解压缩，并定义正确的路径。对于\
  \ Ubuntu 用户来说，有一种更简单的方法，即基于命令行的简短程序 `pip` 可以无缝地完成这些任务。\n\n运行简单的命令\n\n```\nsudo apt-get\
  \ install python3-pip\n```\n\n首先安装 `pip` 程序。然后，只需发出以下命令，即可使用它来安装一个包，例如 `numpy`：\n\
  \n```\nsudo pip3 install numpy\n```\n\n将包名替换为所需的包名，即可轻松完成包的安装。此外，还可以通过输入以下命令将模块升级到最新版本：\n\
  \n```\nsudo pip install [package_name] --upgrade\n```\n\n安装 `scipy stack` [4] 对我们的目的非常有用，因为它会安装我们将要使用的各种程序。可以通过在\
  \ Ubuntu 终端上发出以下命令来安装它：\n\n```\n$ sudo apt-get install python-numpy python-scipy\n\
  python-matplotlib ipython ipython-notebook\npython-pandas python-sympy python-nose\n\
  ```\n\n这个单行命令会安装以下内容：\n\n*   `numpy`（数值 Python）\n*   `scipy`（科学 Python）\n*   `matplotlib`（数学绘图库）\n\
  *   `ipython`（Python 解释器的交互式环境）\n*   `ipython-notebook`（基于 Web 的 `ipython` 交互式环境）\n\
  *   `pandas`（用于统计计算）\n*   `sympy`（用于执行符号计算）\n*   `nose`（用于测试）\n\nAnaconda IDE 预装了本书所需的所有模块。任何额外的模块都可以使用\
  \ conda 终端以类似的方式安装。要打开 conda 终端，首先单击 `Environments`，然后单击 `root` 旁边的箭头按钮（图 2-6）。您可以选择\
  \ `Open Terminal` 选项，在任何操作系统中打开一个类似 Linux 的终端。\n\n![A458920_1_En_2_Fig6_HTML.jpg](img/A458920_1_En_2_Fig6_HTML.jpg)\n\
  \n图 2-6\n\nConda 终端\n\n`Environment` 选项还会显示已安装模块的列表。您可以通过选择所需模块并单击屏幕底部的 `Apply`\
  \ 来卸载模块或将其升级到所需版本。\n\n### 2.6.1 使用模块\n\n要使用特定模块及其功能，首先需要使用 `import` 命令在工作区内导入它。例如：\n\
  \n```\nimport math\n```\n\n此命令导入名为 `math` 的模块，其所有对象现在都可以使用了。使用它们的过程如下：\n\n1.  `import\
  \ math`\n    *   在使用模块内部定义的任何函数之前，我们需要提及模块的名称。例如，如果我们想使用 `sqrt()` 函数，我们需要编写 `math.sqrt(2)`，这将使用\
  \ `math` 模块计算 ![$$ \\sqrt{2} $$](img/A458920_1_En_2_Chapter_IEq1.gif)。\n2.  *  \
  \ `\"*\"` 表示所有内容（用正则表达式的语言来说）。因此，该语句意味着我们可以使用所有函数，而无需在函数名称前用 `\".\"`（点运算符）分隔模块名称。\n\
  \n    ```\n    from math import *\n    ```\n\n3.  *   此语句仅导入正在使用的 `sqrt()` 函数。当您内存有限且注重能耗时，使用这种\
  \ Python 编程风格至关重要，因为您不需要导入不必要的对象。您仍然需要在函数名称前用 `\".\"`（点运算符）分隔模块名称。\n\n    ```\n\
  \    from math import sqrt\n    ```\n\n## 2.7 Python 环境\n\n在 Python 项目上工作的专业方式是为特定项目建立一个专用的\
  \ Python 环境。这有几个优点。该环境与系统版本、更新和升级是隔离的。换句话说，可以维护一个独立的软件依赖项仓库（Python 包），这可以避免依赖项升级影响代码性能时出现的问题。（初学者可以暂时跳过本节，在获得更多\
  \ Python 实践经验后再回来阅读。）\n\nAnaconda 2.4 提供了将环境定义为主窗口左侧窗格中可点击选项卡的选项，您可以在其中以图形方式创建和维护虚拟环境。您也可以使用终端执行相同操作。`virtualenv`\
  \ 是一个基于命令行的工具，可以创建专用且隔离的 Python 虚拟环境。`virtualenv` 创建一个文件夹，其中包含使用 Python 项目可能需要的包所需的所有可执行文件。\n\
  \n### 2.7.1 安装 virtualenv\n\n要安装 `virtualenv`，您需要一个名为 `pip` 的命令行工具（在 ?? 节中详细说明）。在基于\
  \ Ubuntu Linux 的机器上，发出以下命令来安装 `virtualenv`：\n\n```\n$pip install virtualenv\n```\n\
  \n假设您创建了一个名为 `my_project_folder` 的文件夹。要为名为 `proj1` 的项目创建虚拟环境，您需要在 Linux 终端上发出以下命令：\n\
  \n```\n$cd my_project_folder\n$virtualenv proj1\n```\n\n第二个命令将在当前目录中创建一个文件夹。此文件夹将包含\
  \ Python 可执行文件和一个 `pip` 库的副本，您可以使用它来安装其他包。\n\n### 2.7.2 激活 virtualenv\n\n要使用已创建的虚拟环境，必须首先将其\
  \ `激活`。必须在 Linux 终端上发出以下命令：\n\n```\n$source proj1/bin/activate\n```\n\n如果没有出现任何错误，命令提示符前将出现虚拟环境的名称。这表明它现在已激活，可以进一步使用。在虚拟环境中，可以像在系统上通常安装包一样安装包。\n\
  \n您可以通过在环境中发出以下命令来生成依赖项列表及其已安装的版本号：\n\n```\n$pip freeze > requirements.txt\n```\n\
  \n此命令创建一个名为 `requirements.txt` 的文件，其中包含依赖项列表及其版本号。当项目被共享且新用户希望安装该包时，他们可以通过发出以下命令使用此文件进行安装：\n\
  \n```\n$pip install -r requirements.txt\n```\n\n### 2.7.3 停用虚拟环境\n\n由于开发人员可能需要同时处理多个项目，因此为每个项目设置单独的虚拟环境会很有帮助，因为开发人员一次只能在一个虚拟环境中工作。当开发人员需要切换到虚拟环境之外的其他任务时，他们必须通过发出以下命令来停用当前的虚拟环境：\n\
  \n```\n$deactivate\n```\n\n该命令将开发人员带回系统的默认 Python 解释器及其所有已安装的库。如果开发人员需要删除虚拟环境，他们可以通过发出以下命令来删除其文件夹：\n\
  \n```\n$rm -rf proj1\n```\n\n\n\n## 2.8 本章小结\n\nPython 因其解释型语言的特性而拥有极其平缓的学习曲线，可以逐行输入指令并立即执行。这种方式避免了编译过程以及随之而来的错误，而这些错误对于对编程语言内部机制了解有限的初学者来说往往是主要障碍。Python\
  \ 解释器本质上是开源的，可以从互联网上免费下载。`Anaconda` IDE 为 Python 开发者提供了一个良好的集成开发环境，我们建议你使用它来练习本书中的代码。\n\
  \n"
- "# 3. IPython\n\n## 3.1 简介\n\n编程语言的创造者面临的最大挑战是吸引开发者并让他们愿意学习这门语言。通常，开发者会使用文档或帮助手册来深入了解语言，但交互式环境允许开发者在学习的同时试验命令和程序。Python\
  \ 的交互式 shell 已经提供了这种环境。\n\n提供相同环境的另一个选择是 `IPython` [1]。`IPython` 的灵感 [2] 来源于 Maple\
  \ 和 Mathematica 的笔记本环境。它于 2001 年推出，并迅速开始吸引开发者，因为它构想了一个简单直观的环境来执行 Python 代码，并具有以下特性：\n\
  \n- 为 Python 解释器提供交互式 shell\n- 基于浏览器的笔记本，支持代码、文本、数学表达式、内联图表以及其他媒体，例如 `ipython-notebook`\n\
  - 支持交互式数据可视化和 GUI 工具包的使用\n- 灵活、可嵌入的解释器，可加载到项目中\n- 用于并行计算的工具\n\n自 2001 年以来，`IPython`\
  \ 环境得到了巨大的发展，这个流行的基于 Web 浏览器的交互式环境甚至更名为 `Jupyter Notebook` [3]，以强调除了 Python 之外，它还可以运行其他内核。在撰写本文时，它支持\
  \ 40 种编程语言，包括 Julia、Python、Scala、R、C 和 C++。`Jupyter` 需要本地安装 Python 解释器才能工作，因此用户必须按照第\
  \ 2 章所述安装 Python 解释器，然后他们就可以在 `IPython` 环境中工作，并将 Python 作为其内核之一。\n\n## 3.2 安装 IPython\n\
  \n如果你正在使用 `Anaconda` IDE（适用于所有操作系统，包括 Windows、Linux 和 Mac OS X），则 `IPython` 已预装。图\
  \ 3-1 显示了一个 `Spyder` IDE 会话的截图。其右下角运行着一个 `IPython` shell。你可以像在 Python shell 中一样在此处输入\
  \ Python 表达式，并期望它被求值。\n\n如果你更喜欢在 Ubuntu Linux 命令 shell 上工作，可以通过在终端中发出以下命令来安装 `IPython`：\n\
  \n```\n$pip3 install ipython\n```\n\n安装后，你可以通过在终端中发出以下命令来启动 `IPython` 会话：\n\n```\n\
  $ipython\n```\n\n无需输入 `python` 来调用解释器，而是调用 `ipython` 应用程序，它会启动一个 `IPython` 会话，其中\
  \ Python 解释器被用作内核。\n\n你可以通过在 `IPython` 提示符下输入 `exit` 来退出该会话。在 Python 提示符下，你需要将 `exit`\
  \ 定义为一个函数并输入 `exit()`，但在这里 `exit` 会直接执行退出函数。如图 3-1 所示，`IPython` 提示符在会话开始时显示 `In`\
  \ [`1` `]`。这表示运行 `IPython` REPL 的 `IPython` 提示符正在等待用户输入第一个指令。当你输入指令并按 `Enter` 键执行表达式时，你会得到带有提示符\
  \ `Out` [1 `]` 的输出，表示这是 `In` [1 `]` 处第一个 Python 表达式的输出。括号内的数字会逐一递增，这在教授 Python 以及跟踪会话期间的工作流程时非常有用。一旦会话重新启动，这些数字就会重置。\n\
  \n![A458920_1_En_3_Fig1_HTML.jpg](img/A458920_1_En_3_Fig1_HTML.jpg)\n\n图 3-1\n\n\
  `IPython` 会话\n\n`IPython` shell 还支持 Unix/Linux 系统命令。一些有用的命令集如下：\n\n- `pwd`：打印当前工作目录\n\
  \  - 用户可以打印他们正在运行会话的目录。\n- `cd <name1>`：将当前目录更改为 `name1`\n  - 如果 `name2` 目录位于当前工作目录内，则该命令会使\
  \ `name1` 成为当前工作目录。\n- `rm -r <name_of_directory>`：删除目录 `<name_of_directory>`\n\
  \  - 用户可以删除目录的内容。如果该目录还包含其他子目录，用户必须使用 `-rf` 标志强制删除。\n- `cd..` 和 `cd`\n  - 命令 `cd..`\
  \ 允许用户在目录树结构中后退一步。\n  - 命令 `cd` 将用户置于主目录中。\n\n还有许多其他 Unix/Linux 命令可以在 `IPython`\
  \ shell 中使用。一组称为魔法函数 [4] 的特殊命令可用于增强 `IPython` 会话的功能。有两种魔法函数：面向行的和面向单元格的。行魔法函数以 `%`\
  \ 字符为前缀，其工作方式类似于操作系统命令行调用：它们将行的其余部分作为参数，参数传递时不带括号或引号。单元格魔法函数以双 `%%` 为前缀，它们是函数，不仅将行的其余部分作为参数，还将下面的行作为单独的参数。讨论所有魔法函数超出了本书的范围，因此这里只讨论几个有用的魔法函数。\n\
  \n\n\n"
- "# IPython 魔法命令\n\n- `%history`\n  - 显示当前会话中的所有输入历史。\n- `%logstart`、`logoff`、`logon`、`%logstop`\n\
  \  - `%logstart`：在会话中的任意位置开始记录日志。\n  - `logoff`：暂时停止记录日志。\n  - `logon`：重新开始记录日志。\n\
  \  - `%logstop`：完全停止记录日志并关闭日志文件。\n- `%lsmagic`\n  - 列出当前可用的魔法函数。\n- `%magic`\n \
  \ - 打印关于魔法函数系统的信息。\n- `%run`\n  - 在 IPython 中将指定文件作为程序运行。\n- `%time`\n  - 计时执行一条\
  \ Python 语句或表达式。\n\n以下 IPython shell 代码将演示其用法。需要注意的是，Python 中的注释以 `#` 符号开头。`#` 符号之后的任何表达式都会被解释器忽略，因此可以为每一行代码插入信息性注释。养成插入有用注释的好习惯，以便在长时间后重新查看代码，或与他人共享项目代码时，他人能够理解给定代码文件中命令使用背后的逻辑：\n\
  \n```\n1  In [1]: 2+3 # 两个整数相加\n2  Out [1]: 5\n\n4  In [2]: 2.0+3 # 浮点数与整数相加\n5\
  \  Out [2]: 5.0\n\n7  In [3]: %history # 探查本次会话中使用过的命令历史\n8  2+3\n9  2.0+3\n10 \
  \ %history\n\n12  In [4]: %history # 再次探查历史，显示在 IN [3] 处使用的 history 命令\n13  2+3\n\
  14  2.0+3\n15  %history\n16  %history\n\n18  In [5]: %lsmagic # 列出所有可用的魔法函数\n19\
  \  Out [5]:\n20  可用的行魔法：\n21  %alias  %alias_magic   %autocall   %autoindent   %automagic\n\
  %bookmark   %cat   %cd   %clear   %colors   %config   %cp   %cpaste        %debug\
  \   %dhist   %dirs   %doctestmode   %ed   %edit   %env   %gui\n%hist   %history\
  \   %killbgscripts   %ldir   %less   %lf   %lk   %ll          %load   %load_ext\
  \   %loadpy   %logoff   %logon   %logstart\n%logstate   %logstop   %ls   %lsmagic\
  \   %lx   %macro   %magic   %man         %matplotlib   %mkdir   %more   %mv   %notebook\
  \   %page   %paste\n%pastebin   %pdb   %pdef   %pdoc   %pfile   %pinfo   %pinfo2\
  \   %popd         %pprint   %precision   %profile   %prun   %psearch   %psource\n\
  %pushd   %pwd   %pycat   %pylab   %quickref   %recall   %rehashx   %reload_ext \
  \  %rep   %rerun   %reset   %reset_selective   %rm   %rmdir   %run   %save   %sc\
  \   %setenv   %store   %sx   %system   %tb\n%time   %timeit   %unalias   %unload_ext\
  \   %who   %who_ls   %whos         %xdel   %xmode\n\n23  可用的单元格魔法：\n24  %%!  %%HTML\
  \  %%SVG  %%bash   %%capture   %%debug   %%file   %%html   %%javascript   %%js \
  \  %%latex   %%markdown   %%perl   %%prun\n%%pypy   %%python   %%python2   %%python3\
  \   %%ruby   %%script   %%sh   %%svg   %%sx   %%system   %%time   %%timeit   %%writefile\n\
  \n26  自动魔法已开启，行魔法无需前缀。\n\n28  In [6]: %time print (\"Hello World !\") # 计时执行一条打印语句\n\
  29  Hello World!\n30  CPU 时间：用户 110 微秒，系统：52 微秒，总计：\n31  162 微秒 墙上时间：149 微秒\n\n\
  33  In [7]: %history # 再次探查历史，显示其他使用过的表达式\n34  2+3\n35  2.0+3\n36  %history\n37\
  \  %history\n38  %lsmagic\n39  %time print (\"Hello World !\")\n40  %history\n\n\
  42  In [8]:\n```\n\n需要注意的是，Windows 操作系统版本的 Python 解释器在执行 `%time print(\"Hello World!\"\
  )` 时不会列出 `cputime`。\n\n## IPython Notebooks\n\n正如 IPython 会话在终端会话中启动一样，IPython Notebook\
  \ 会话在 Web 浏览器会话中启动。因此，用户只需一个 Web 浏览器即可使用 IPython Notebooks。前面章节中解释的所有命令在此处的工作方式类似，只是用户需要按下\
  \ `Shift+Enter` 组合键来执行。IPython Notebooks 已更名为 Jupyter Notebooks，因为除了 Python 之外，现在还支持\
  \ 40 种编程语言。用户在使用前需要先安装 Jupyter Notebook。\n\n### 安装 Jupyter Notebook\n\nAnaconda\
  \ IDE 已预装 Jupyter Notebook。图 3-2 显示 Jupyter Notebook 是中央面板中的首选选项之一。点击 `Launch` 将在已安装的浏览器中打开一个窗口。大多数浏览器都支持此操作。本书使用\
  \ Google Chrome（版本 60.0.3112.113（官方版本）（64 位））来测试后续使用的代码。\n\n![A458920_1_En_3_Fig2_HTML.jpg](img/A458920_1_En_3_Fig2_HTML.jpg)\n\
  \n图 3-2：IPython Notebook 会话\n\nWeb 浏览器窗口将列出主文件夹中的目录和文件。用户可以导航到目标目录并启动一个 Python 3\
  \ 的 Jupyter 会话。他们可以点击 `New` 按钮并选择一个内核（此处为 `Python3`）。这将打开一个类似于图 3-3 的屏幕。\n\n以下是此\
  \ Jupyter Notebook 会话的各种功能：\n\n- **命名笔记本**\n  - 新笔记本默认标题为 `Untitled`。点击此标题将打开一个图形视图，用于输入新名称，并会相应更新。\n\
  - **单元格**\n  - Jupyter Notebook 由单元格组成，通过按下 `Shift+Enter` 组合键执行。\n  - 有几种代码类型的单元格，如图\
  \ 3-3 所示。\n    - **代码**\n      - 用户可以在分配给 `Code` 类型的单元格中编写 Python 代码，并通过按下 `Shift+Enter`\
  \ 组合键执行单行或多行代码。\n      - 用户也可以通过点击主菜单栏中的 `Cell` ⇒ `Run Cells` 按钮来运行单元格（即执行单元格）。\n\
  \      - 代码单元格也存在特殊的显示格式，但此讨论超出了本书的范围。建议用户参考主要文档以了解各种显示格式 [5]。\n    - **Markdown**\
  \ [6]\n      - 分配为 `Markdown` 类型的单元格可以填充 markdown 代码，执行后用于格式化打印。\n      - 用户可以在此处使用\
  \ LaTeX 命令来定义数学方程和特殊符号。\n      - 用户可以通过放置单个 `#` 来定义主标题，并使用多个符号来定义后续副标题。\n    - **原始\
  \ NBConvert**\n      - 笔记本创作环境不会渲染原始单元格。\n      - 它们可以有不同的格式。此信息存储在笔记本元数据中。\n  \
  \    - 原始单元格定义为应在 `nbconvert` 输出中未经修改包含的内容。\n      - 默认情况下（如果未选择单元格格式），单元格内容会（不经任何转换）包含在\
  \ HTML 和 LaTeX 输出中。\n    - **标题**\n      - 可以使用 `Heading` 单元格类型为文档的单独部分创建标题。\n \
  \     - 另一种方法是使用 `Markdown` 单元格类型，然后使用 `#` 符号创建一个或多个标题。\n\n![A458920_1_En_3_Fig3_HTML.jpg](img/A458920_1_En_3_Fig3_HTML.jpg)\n\
  \n图 3-3：Jupyter Notebook 会话\n\n用户通过尝试使用 Jupyter Notebook 来学习效果最佳。图 3-4 显示了一个示例笔记本。\n\
  \n![A458920_1_En_3_Fig4_HTML.jpg](img/A458920_1_En_3_Fig4_HTML.jpg)\n\n图 3-4：一个示例\
  \ Jupyter Notebook 会话\n\n\n\n### 3.4 保存 Jupyter Notebook\n\n用户可以将 Jupyter Notebook\
  \ 保存为 `.ipnyb` 文件，并在任何计算机上的 Jupyter Notebook 环境中打开它。这使得 Python 的教学和学习更加便捷。开发者可以通过将\
  \ Notebook 划分为多个部分、为各部分添加标题和副标题、在代码单元格中编写代码、以及在 Markdown 单元格中编写解释性细节，来演示 Python\
  \ 的用法。Markdown 单元格支持使用 LaTeX 命令编写数学公式。\n\n用户还可以将 Jupyter Notebook 保存为 `.py` 文件（可在\
  \ Python 解释器中执行的 Python 程序）。此时，除代码单元格外的所有单元格都会通过在开头添加 `#` 符号被转换为注释。\n\nJupyter Notebook\
  \ 可以保存为 HTML 格式，以便嵌入到网站中使用。这对于在线课程开发非常有用。它们也可以保存为 LaTeX 文件，以构建特定格式，或直接保存为 PDF 文档。\n\
  \n保存后的文件可以与希望学习特定主题的人共享。用户只需在 Jupyter Notebook 环境中运行该 Notebook 即可。这一功能对课堂教学大有裨益。教师和学生可以逐单元格执行他们的\
  \ Jupyter Notebook，从而更轻松地理解概念。否则，在 Python 教学过程中，教师将不得不在演示文件和 Python 解释器之间来回切换。用户还可以利用此功能定义测试和作业。\n\
  \n### 3.5 在线 Jupyter 环境\n\nJupyter Notebook 的主网站 [7] 在远程服务器上提供了一个在线环境，具备前文所述本地安装所提供的所有功能。在这里，用户通过互联网在远程计算机上工作。每个用户都拥有有限的工作空间。该空间可以与团队共享，用户可以进行协作。Jupyter\
  \ 会话的截图如图 3-5 所示。\n\n在线会话中提供了多种语言的示例 Notebook。用户可以使用示例 Python Notebook 来学习基础知识。用户可以创建一个目录，然后有条理地将所有\
  \ Jupyter Notebook 存储在其中。这些 Notebook 可以下载到本地机器，并在本地 Jupyter Notebook 会话中使用。用户也可以执行相反的操作。换句话说，他们可以使用左上角菜单中的\
  \ `Upload` 按钮，将本地的 Jupyter Notebook 加载到在线会话中。\n\n![A458920_1_En_3_Fig5_HTML.jpg](img/A458920_1_En_3_Fig5_HTML.jpg)\n\
  \n图 3-5\n\n一个示例在线 Jupyter Notebook 会话\n\n### 3.6 总结\n\n在本章中，我们演示了如何在 IPython 和 Jupyter\
  \ Notebook 环境中工作。Jupyter Notebook 正越来越多地被开发者用于向更广泛的受众传播知识，因为用户可以将代码和说明性描述打包在一个文件中。各种网站上存在成千上万个\
  \ Jupyter Notebook，使得 Python 用户数量呈指数级增长。我们建议本书的读者也为每一章创建一个独立的 Jupyter Notebook，以加深自己的理解，并将其发布到互联网上，以便他人受益。\n\
  \n"
- "# 4. 数据类型\n\n## 4.1 引言\n\n充分利用本书的最佳方式是开始在 IPython 提示符下工作，向它输入代码并观察输出。你可以使用 Anaconda\
  \ IDE，以避免为本书安装所需包。你可以在 IPython 会话期间使用 Spyder IDE 作为编辑器来编写多行文件。我们建议你在需要的地方编写详细的描述性注释，以增强对给定代码工作流程的理解。这种方案在所有平台上都适用。在本章中，我们将讨论\
  \ Python 中的各种数据及其分类为多种数据类型的方式。\n\n现代计算机将数据区分为多种类型。数据可以是数字、字符、字符串（一组字符）等等。在 Python\
  \ 中，你可以根据需要定义新的数据类型。有一些内置数据类型用于处理数字和字符。不同的数据类型占用不同的内存量。理解你的需求并据此选择数据类型非常重要。数据类型也决定了答案的精度。我们将在后续章节中讨论\
  \ Python 中各种内置数据类型。\n\n## 4.2 逻辑型\n\n这种类型的数据存储布尔值 `True` 或 `False`，并且可以通过布尔运算符（如\
  \ `AND` 和 `OR`）进行操作。大多数编程语言使用值 `1` 或 `0` 来表示布尔值，但 Python 在这方面有所不同。让我们通过一些示例来探索它们的用法。\n\
  \n表 4-4\n\nNOT 运算符真值表\n\n| NOT |   |\n| --- | --- |\n| True | False |\n| False |\
  \ True |\n\n表 4-3\n\nXOR 运算符真值表\n\n| XOR | True | False |\n| --- | --- | --- |\n\
  | True | False | True |\n| False | True | False |\n\n表 4-2\n\nAND 运算符真值表\n\n| AND\
  \ | True | False |\n| --- | --- | --- |\n| True | True | False |\n| False | False\
  \ | False |\n\n表 4-1\n\nOR 运算符真值表\n\n| OR | True | False |\n| --- | --- | --- |\n\
  | True | True | True |\n| False | True | False |\n\n| 运算符 | Python 函数 | 符号函数 |\n\
  | --- | --- | --- |\n| AND | `and()` | `&` |\n| OR | `or()` | `|` |\n| XOR | `xor()`\
  \ | `^` |\n| NOT | `not()` |   |\n\n```\n1  >>> True\n2  True\n3  >>> False\n4 \
  \ False\n5  >>> not True\n6  False\n7  >>> not False\n8  True\n9  >>> True and False\n\
  10  False\n11  >>> True or False\n12  True\n13  >>> True ˆ False\n14  True\n15 \
  \ >>> True ˆ False\n16  True\n```\n\n复杂的逻辑语句也可以被求值。例如：\n\n```\n1  >>> (True and\
  \ True) or (not False)\n2  True\n3  >>> (True or True) or (True and False)\n4  True\n\
  5  >>> not ((True or True) or (True and False))\n6  False\n```\n\n重要的是要看到，使用括号使用户能够以有意义的方式将逻辑表达式组合在一起。\n\
  \n逻辑运算是比较运算的结果。例如：\n\n```\n1  >>> 2>3 # 大于运算符\n2  False\n3  >>> 2==2 # 等于运算符\n4\
  \  True\n5  >>> 2==2.0 # 等于运算符比较的是值，而不是类型\n6  True\n7  >>> 2==3 # 等于运算符\n8  False\n\
  9  >>> (2+3)>(2-3) # 逻辑求值的复杂表达式\n```\n\n## 4.3 数值型\n\n数值型：有四种数值数据类型：\n\n*   `int`：整数\n\
  *   `float`：浮点数\n*   `complex`：复数\n\n### 4.3.1 整数\n\nPython 对 `float`、`long` 和 `complex\
  \ numbers` 具有任意精度。因此，这些数字的长度限制取决于可用内存。这种架构的积极方面是用户不受数字范围的限制，但他们必须始终确保在计算过程中有足够的内存可用，以避免错误结果。Python\
  \ 2 将 `int` 的大小限制为字节（与 C 编程语言中的大小相同），而 Python 3 将 `int` 和 `long` 合并为 `int`。在 32\
  \ 位系统上，Python 3 将 `int` 存储为 32 位。在 64 位计算机上，它将 `int` 存储为 64 位长整数。\n\n内置函数 `type()`\
  \ 显示数据类型如下：\n\n```\n1  >>> type(-1)\n<class 'int'>\n4  >>> type(1)\n<class 'int'>\n\
  ```\n\n如这些示例所示，Python 解释器动态分配数据类型。换句话说，它根据输入的定义为其分配数据类型。这对程序员来说非常方便。`1` 自动成为整数，而\
  \ `1.0` 成为浮点数。\n\n\n\n### 4.3.2 浮点数\n\n在计算中，浮点表示法是一种近似表示数学实数的方案。实数通常用小数点书写。例如，`2`\
  \ 是一个整数，而 `2.0` 是一个实数。这两个数字对计算机来说截然不同。`2` 会以 `int` 类型存储，而 `2.0` 则会以 `float` 类型存储：\n\
  \n```\n1  >>> type(2)\n\n3  >>> type(2.0)\n\n```\n\n实数到计算机存储系统的映射是一种公式化表示（称为浮点表示）[1]。实数由三部分组成：有效数字、基数和指数。\n\
  \n例如，π 的值是 `3.1415926535897…`。假设对于某个特定计算，我们只有四位有效数字，那么该值可以重写为 `3.1415`。现在这个数字表示为\
  \ `31415 × 10 ^(−4)`，其中 `31415` 称为有效数字，`10` 称为基数，`−4` 称为指数。\n\n在给有效数字赋值时，会用到有效数字位数的信息。一个数字的有效数字是指那些对其测量分辨率有意义的数字。在这个例子中，我们根据计算/测量的要求，假设只有四位有效数字。术语“浮点”指的是数字的小数点可以“浮动”；也就是说，它可以相对于数字的有效数字放置在任何位置。这个位置由指数部分指示；因此，浮点表示可以被视为一种科学记数法。\n\
  \n### 4.3.3 如何存储浮点数\n\n计算机可以将数字存储为浮点对象。浮点对象按如下方式存储数字：\n\n![$$ \\pm {d}_1{d}_2\\\
  dots {d}_s\\times {\\beta}^e $$](img/A458920_1_En_4_Chapter_Equ1.gif)\n\n(4.1) 其中\
  \ `d [i] = 0, 1, 2…β − 1`，但 `d [1] j= 0`，且 `m ≤ e ≤ M`，其中 `m ∈ I ^−` 且 `M ∈ I ^+`。\n\
  \n浮点数的三个部分如下：\n\n*   符号（`±`）\n*   有效数字（尾数）（`d [1] d [2] …d [s]`）\n*   指数（`β`）\n\n\
  浮点数的每个部分都存储在不同的内存位置，并占用指定的位数。哪个部分定义了多少位？这个问题已由名为 IEEE754 [1] 的 IEEE 标准回答。首先，让我们看看数字表示精度的概念：\n\
  \n1.  单精度：\n    *   占用 4 字节 = 32 位。\n2.  双精度：\n    *   占用 8 字节 = 64 位。\n3.  扩展双精度：\n\
  \    *   占用 80 位。\n4.  四精度：\n    *   占用 16 字节 = 128 位。\n\n这种方案可以在范围和精度之间进行权衡。虽然整数具有无限精度，但如前所述，浮点数通常使用双精度实现。关于程序运行所在机器的浮点数精度和内部表示的信息，可以在\
  \ `sys.float_info` 中找到：\n\n```\n1  >>>import sys # 导入 sys 模块\n2  >>> sys.float_info\
  \ # 使用 sys 的 float_info 函数\n3   sys.float_info(max=1.7976931348623157e+308, max_exp=1024,\
  \ max_10_exp=308,\nmin=2.2250738585072014e-308, min_exp=-1021, min_10_exp=-307,\
  \ dig=15,\nmant_dig=53, epsilon=2.220446049250313e-16, radix=2, rounds=1)\n4  >>>\
  \ sys.int_info # 使用 sys 的 int_info 函数\n5  sys.int_info(bits_per_digit=30, sizeof_digit=4)\n\
  ```\n\n在 Python 提示符下发出 `sys.int_info` 命令时，32 位 Windows 操作系统会输出 `sys.int_info(bits_per_digit=15,\
  \ sizeof_digit=2)`。\n\n基于浮点数的算术运算的问题在于，其结果是对实数的近似，因为实数是以 `10` 为基数定义的，而计算机处理数字时使用\
  \ `2` 作为基数。例如，`0.123` 在以 `10` 为基数的数字系统中定义为\n\n![$$ 0.123\\to \\frac{1}{10¹}+\\frac{2}{10²}+\\\
  frac{3}{10³} $$](img/A458920_1_En_4_Chapter_Equa.gif)\n\n相反，在以 `2` 为基数的数字系统中，它表示为\n\
  \n![$$ 0.123\\to \\frac{1}{2¹}+\\frac{2}{2²}+\\frac{3}{2³} $$](img/A458920_1_En_4_Chapter_Equb.gif)\n\
  \n这个计算表明 `0.123[2] = 0.135[10]`。如果你使用更多位来存储该值，就能得到对实数更好的近似，但你始终只能使用近似值，而非真实值。正如\
  \ `sys.float_info` 所告知的，最大的浮点数是 `max = 1.7976931348623157e + 308`（`1.7976931348623157\
  \ × 10³⁰⁸`）。\n\n要获得更高的精度，你可以使用 `decimal` 模块，它包含函数 `Decimal()`，该函数返回计算机存储的数字：\n\n\
  ```\n1  >>>from decimal import Decimal\n2  >>>Decimal(0.123)\n3  Decimal('0.1229999999999999982236431605997495353221893310546875')\n\
  4  >>>Decimal(1.2345)\n5  Decimal('1.2344999999999999307220832633902318775653839111328125')\n\
  6  >>>type(Decimal(0.123))\n\n```\n\n如你所见，`0.123` 被存储为 `0.1229999999999999982236431605997495353221893310546875`，这仍然是实数\
  \ `0.123` 的一个近似值。在大多数情况下，这个误差微不足道，你可以忽略使用数字计算机（运行在二进制数字系统上）进行计算所引入的误差。但在某些情况下，这个误差是显著的，你需要采取适当措施来计算并应对这个误差。\n\
  \n### 4.3.4 复数\n\n复数在科学和工程研究中被广泛使用。复数的虚部包含有关信号相位的重要信息。Python 通过创建一个名为 `complex`\
  \ 的对象来支持复数的使用。虚部通过添加符号 `j` 来表示，该符号代表虚数单位（=![$$ \\sqrt{-1} $$](img/A458920_1_En_4_Chapter_IEq1.gif)）。因此，你可以在\
  \ Python 中将复数 `2+3i` 定义为 `2+3j`。另一种定义复数的方法是使用内置函数 `complex()`，它接受两个参数：第一个参数是复数的实部，第二个参数是复数的虚部。以下代码将提供更多关于其用法的信息：\n\
  \n```\n1  >>> 2+3j\n2  (2+3j)\n3  >>> type(2+3j)\n\n5  >>> complex(2,3)\n6  (2+3j)\n\
  7  >>> type(complex(2,3))\n\n```\n\n## 4.4 序列\n\n语言符号需要在计算机上存储，因此必须被定义为一个对象。这个对象被称为字符。出现在计算机屏幕和打印纸张上的每种语言的每个单独符号，在编程语言中都被视为一个字符。这包括\
  \ ASCII 和 Unicode 字符。字符的例子包括字母、数字、空白字符、标点符号、感叹号等等。通常，键盘上的所有按键都会产生字符。\n\n为了在计算设备之间进行通信，字符被编码为定义明确、国际公认的格式（例如\
  \ ASCII 和 UTF-8），这些格式将每个字符分配给一串二进制数字。两种常见的编码示例是 ASCII 和用于 Unicode 的 UTF-8 编码。所有编程语言都必须能够解码和处理国际公认的字符。Python\
  \ 也使用数据类型 `字符串`、`列表` 和 `元组` 来处理字符。\n\n\n\n### 4.4.1 字符串\n\n字符串仅仅是字符序列。小写和大写字符具有不同的编码；因此，字符串是区分大小写的：\n\
  \n```\n1  >>> type('a')\n\n3  >>> type('abba')\n\n5  >>> type(\"a\")\n\n7  >>> type(\"\
  abba\")\n\n```\n\n这里，我们分别定义了一个单字符和四字符的字符串。重要的是要记住，空白字符也是一个字符。因此，`Hello world!` 有\
  \ 12 个字符，即 `h`、`e`、`l`、`l`、`o`、` `、`w`、`o`、`r`、`l`、`d`、`!`。在定义字符串时，我们用 `\"` 或 `\"\
  \"` 将字符括起来。当字符串需要跨越多行时，会使用三组引号：\n\n```\n1  >>> print(\"\"\"Python can also print\
  \ multiline strings which can       span many lines instead of being printed on\
  \ just one line\"\"\")\n2  Python can also print multiline strings which can span\
  \ many lines instead of\nbeing printed on just one line\n```\n\n你可以使用特殊字符来打印字符以定义空格，并在新行上打印字符。这可以通过使用\
  \ `\\t` 和 `\\n` 字符来实现，它们分别打印一个制表符和一个换行符：\n\n```\n1  >>> print (\"' Python can also\
  \ print multiline strings having tabs like\n\\t and also prints in \\n next line\"\
  ')\n2  Python can also print multiline strings having tabs like and also prints\
  \ in\n3      next line\n```\n\n注意，在 `\\t` 的位置打印了四个空格作为制表符，而 `\\n` 之后的字符串部分打印在新的一行上，因为\
  \ `\\n` 是一个换行符。\n\n但是，为什么我们要有三种方式来定义字符串，即使用单引号、双引号和三引号？单引号可用于打印包含双引号作为字符的字符串。双引号可用于打印包含单引号作为字符的字符串。三引号可用于同时打印双引号和单引号作为字符。这种行为可以通过以下代码来研究：\n\
  \n```\n1  >>> print(\"'Mahatma Gandhi's words, \"An eye for an eye makes the whole\
  \ world blind”, stand true even today”’)\n2  Mahatma Gandhi's words, \"An eye for\
  \ an eye makes the whole world blind\", stand true even today\n```\n\n### 4.4.2\
  \ 列表和元组\n\n列表是一个有序的对象集合，无论其数据类型如何。它可以通过将一组值括在方括号中来定义。例如：\n\n```\n1  >>> [1,2.0,'a',\"\
  Alpha\"]\n2  [1, 2.0,'a','Alpha']\n3  >>> type([1,2.0,'a ',\"Alpha\"])\n\n```\n\n\
  在 Python 代码中，列表的第一个元素是整数，第二个是浮点数，第三个是单字符字符串，第四个是多字符字符串。\n\n元组使用`圆括号 ()` 而不是方括号 `[]`\
  \ 来定义。例如：\n\n```\n1  >>> (1,2.0,'a',\"Alpha\")\n2  (1,2.0,'a','Alpha')\n3  >>> type((1,2.0,'a',\"\
  Alpha\"))\n\n```\n\n除了使用不同的括号定义之外，列表和元组的主要区别在于元组是不可变的列表；它们的元素一旦定义，就不能被更改。列表的元素可以使用它们的索引来更改。关于如何操作的更多信息将在第\
  \ 5 章中讨论，其中定义了列表的操作。在科学计算中，通用常量可以定义为一个元组，然后在程序中通过其索引进行访问。\n\n## 4.5 集合与冻结集合\n\n\
  集合数据类型是数学集合的实现。它是一个无序的对象集合。与序列对象（如 `list` 和 `tuple`，其中元素是有序的）不同，集合没有这样的要求。然而，集合不允许元素重复出现，也就是说，一个元素要么出现\
  \ 0 次，要么出现 1 次。`list` 和 `tuple` 对象则不是这种情况。\n\n集合使用 `set()` 函数定义，该函数接受一个 `list` 作为其输入参数。例如：\n\
  \n```\n1  >>> set(['h','e','l','l','o',1,2.0,3+4j])\n2  {1, 2.0, 'h', 'o', (3+4j),\
  \ 'l', 'e'}\n3  >>> type(set(['h','e','l','l','o',1,2.0,3+4j]))\n\n5  >>> frozenset(['h','e','l','l','o',1,2.0,3+4j])\n\
  6  frozenset({1, 2.0, 'h', 'o', (3+4j), 'l', 'e'})\n7  >>> type(frozenset(['h','e','l','l','o',1,2.0,3+4j]))\n\
  \n```\n\n请注意，由于 `l` 在定义集合时出现了两次，它只被授予了一个成员资格。集合操作将在后续章节中详细讨论。就像 `tuple` 对象是不可变的一样，`frozenset`\
  \ 也是一个不可变对象，并且类似于 `set` 对象。\n\n## 4.6 映射\n\n映射是一种定义数据的方案，其中每个元素都由一个称为“哈希标签”的键来标识。可以通过引用该键来访问元素。此类别中的一种数据类型是字典。\n\
  \n字典是与键相关联的无序值对。这些值通过键而不是索引来访问。这些键必须是可哈希的，例如整数、浮点数、字符串、元组和冻结集合。列表、字典以及除冻结集合之外的集合是不可哈希的。以下是字典的一个示例：\n\
  \n```\n1  >>> {'a':1, 'b':10}\n2  {'a':1, 'b':10}\n3  >>> type({'a':1, 'b':10})\n\
  \n```\n\n在这个例子中，我们创建了一个包含两个字符 `a` 和 `b` 的字典，它们由两个键 `1` 和 `10` 标识。各种运算符可以对字典进行操作，这将在后续章节中讨论。\n\
  \n## 4.7 空对象\n\n`None` 是一个空对象。在其他编程语言（包括 C、Java 和 PHP）中，空对象由关键字 `null` 表示，但在 Python\
  \ 中，它由关键字 `None` 表示。它指的是无功能性（即，与其关联的对象没有行为）。当在 Python 提示符下输入它时，什么也不会发生：\n\n```\n\
  1  >>> None\n2  >>> type(None)\n\n```\n\n## 4.8 总结\n\n面向对象编程利用了这样一个事实：所有计算实体都只是对象，它们根据其定义的行为相互交互。我们在本章中讨论了一些内置数据类型。一些数据类型在模块内部定义。用户可以定义自己的数据类型并定义其属性。在进入这些高级主题之前，了解运算符如何对各种数据进行操作将很有用。这将是第\
  \ 5 章的主题。\n\n"
- "# 5. 运算符\n\n\n\n## 5.1 引言\n\n运算符的工作方式与数学函数类似。它们在不同域之间建立关系。例如，乘法运算符接收一对有序的操作数（运算符所操作的数据），并生成另一个数据点。这可以对任意数量的数据点进行。通过这种方式，运算符将数据从操作数域转换到结果域。\n\
  \n基本运算符的符号见表 5-1。\n\n**表 5-1** 基本运算符符号\n\n| 数学运算 | 符号 |\n| --- | --- |\n| 加法 | `+`\
  \ |\n| 减法 | `-` |\n| 乘法 | `*` |\n| 除法 | `\\` |\n| 取模 | `%` |\n| 幂运算 | `**` |\n\n\
  这些运算符可以以复杂的方式组合起来执行算术运算。根据数据类型的不同，它们会定义各自的功能。例如，对于数值数据，`+` 执行数值加法；而对于字符串，它则执行拼接操作。类似地，乘法运算符应用于字符串时，会将字符串重复拼接相应次数。除法、取模和幂运算符对于字符串没有定义的行为。这种行为可以通过以下\
  \ Python 代码验证：\n\n```\n1  >>> 2+3\n2  5\n3  >>> 'a' + 'b'\n4  'ab'\n5  >>> \"\"\
  hello\" + \" \" + \"world\" + \"!\"\n6  'hello world !\n7  >>> 'a'∗3\n8  'aaa'\n\
  9  >>> 'a'/3\n10  Traceback (most recent call last):\n11  File \"\", line 1, in\
  \ \n12  TypeError: unsupported operand type(s) for /: 'str' and 'int'\n13  >>> 'a'%3\n\
  14  Traceback (most recent call last):\n15  File \"\", line 1, in \n16  TypeError:\
  \ not all arguments converted during string formatting\n17  >>> 'a'∗∗3\n18  Traceback\
  \ (most recent call last):\n19  File \"\", line 1, in \n20  TypeError: unsupported\
  \ operand type(s) for ∗∗ or pow(): 'str and 'int'\n```\n\n正如第 4 章所讨论的，有多种运算符可以对数据类型进行操作。\n\
  \n下一节将讨论各种内置运算符，包括算术运算符和逻辑/布尔运算符。请注意，运算符的领域并不局限于本章的讨论范围。模块会定义新的数据类型，并为这些类型定义新的运算符。我们将把讨论范围限定在内置的基本运算符上。我们将说明这些内置运算符的用法，以及它们在定义数学计算中的应用。\n\
  \n## 5.2 变量的概念\n\n当运算符作用于数据时，数据的值在计算过程中可能会发生变化。这种情况可能发生多次。为了临时存储值（例如，在计算过程中），我们使用变量。变量通过其地址（可视化为十六进制数）指向内存位置上的特定值。整个设置可以赋予一个符号字符串，称为变量名。\n\
  \n例如，我们可以将值 0.12 存储为变量 `a`，然后在方程中使用它，如\n\n![$$ {1010}_2=1\\times {2}³+0\\times {2}²+1\\\
  times {2}¹+0\\times s{s}⁰ $$](img/A458920_1_En_5_Chapter_Equa.gif)\n\n```\n1  >>>\
  \ a=0.12 # 将值 0.12 赋给名为 'a' 的变量\n2  >>> answer = (a∗∗2) + (10 ∗ a) # 执行计算并将结果存储在名为\
  \ 'answer' 的变量中\n3  >>> print(a)\n4  0.12\n5  >>> print(answer)\n6  1.2144\n7  >>>\
  \ type(answer) # 检查存储在变量 'answer' 中的值的类型\n\n9  >>> a=5 # 将不同的值重新赋给 'a'\n10  >>>\
  \ print(a) # 新值被反映出来\n11  5\n12  >>> print(answer) # 旧值仍然存储在 'answer' 中\n13  1.2144\n\
  14  >>> answer = (a∗∗2) + (10 ∗ a) # 使用新值进行计算\n15  >>> print(answer) # 打印出新值\n16\
  \  75\n```\n\n这里，数值 0.12 存储在一个名为 `a` 的内存位置。这个变量被后续一个使用变量名 `answer` 定义的方程所调用，当打印\
  \ `answer` 时，会打印出其中存储的值。存储的值是一个浮点数。对象的类型可以通过函数 `type()` 获知，该函数以变量名作为参数。\n\n这个变量将值更改为新值\
  \ 5。然而，除非重新执行计算，否则变量 `answer` 存储的是旧的已求值结果。当使用新值 `a` 时，`answer` 的值也会改变。Python 变量不需要显式定义其类型。类型是根据它们所指向的值推断出来的。理解变量仅仅是指向内存位置的指针这一点很重要。当值改变时，这些指针会指向不同的地址。是内存存储了数据。数据可以是任何类型。在前面讨论的例子中，数据是数字，但它们可以是任何类型。\n\
  \n### 5.2.1 变量命名规则\n\n由于 Python 会使用某些关键字供自身使用，因此有一些名称不应被用作变量名。此外，还有一些国际公认的规则（通常对大多数编程语言通用）：\n\
  \n- 必须以字母（a–z, A–Z）或下划线（`_`）开头。\n- 其余字符可以是字母、数字或 `_`。\n- 名称区分大小写。\n- 名称长度没有限制，但建议保持简短且有意义。\n\
  - `关键字` 不能用作变量名。\n\n使用 `keyword` 模块，可以通过函数 `keyword.kwlist` 获取关键字列表。`keyword.py`\
  \ 中给出的代码提供了一个关键字列表，这些关键字不能用作变量名。（参见 清单 5-1。）\n\n```\n1  import keyword\n\n3  print\
  \ (\"Python keywords:\", keyword.kwlist)\n清单 5-1\nKeyword.py\n```\n\n运行此代码的结果如下：\n\
  \n```\n1  Python keywords:   ['False', 'None', 'True', 'and', 'as', 'assert', 'break',\
  \ 'class', 'continue', 'def', 'del', 'elif', 'else', 'except', 'finally', 'for',\
  \ 'from', 'global', 'if', 'import', 'in', 'is', 'lambda', 'nonlocal', 'not', 'or',\
  \ 'pass', 'raise', 'return', 'try', 'while', 'with', 'yield']\n```\n\n在交互式会话中，有一种便捷的方法可以检查某个名称是否在关键字列表中。要检查某个特定的变量名是否为关键字，可以使用函数\
  \ `keyword.iskeyword()`。可以将该名称作为字符串输入到此函数中。如下列代码所示，如果输入的字符串是关键字，则返回值 `True`。否则，返回\
  \ `False`：\n\n```\n1  >>>import keyword\n2  >>>keyword.is keyword ('lambda')\n3\
  \  True\n4  >>>keyword.is keyword ('lamb')\n5  False\n```\n\n因此，名称 `lambda` 是一个关键字，但名称\
  \ `lamb` 不是。\n\n\n\n## 5.3 赋值运算符\n\n变量的概念使用了符号 `=`，这与数学中的“等于”不同。相反，它是赋值运算符之一。符号\
  \ `=` 将右侧的值赋给左侧的变量名。这本质上意味着它记下右侧值的内存地址，并将其与左侧的变量名关联起来。以下 Python 代码演示了这种行为：\n\n```\n\
  1  >>> a = 5 # 将值 5 赋给 a\n2  >>> a # Python REPL 打印 a 的值\n3  5\n4  >>> print(a)\
  \ # print() 函数打印 a 的值\n5  5\n6  >>> a = 10 # 将新值 10 重新赋给 a\n7  >>> a # 打印 a 的值，并显示新值作为结果\n\
  8  10\n9  >>> b = a # 将 a 指向的值赋给新变量 b\n10  >>> b # b 现在存储 a 最后存储的值，即 10\n11  10\n\
  12  >>> a = 15 # 将新值 15 重新赋给 a\n13  >>> a # REPL 打印 a 的新赋值\n14  15\n15  >>> b #\
  \ REPL 打印 b 的值，即上次赋的值\n16  10\n```\n\n变量的值可以通过在 Python REPL 中直接输入变量名并按 `Enter` 键来打印。也可以使用\
  \ `print()` 函数打印，该函数将变量名作为输入（不是不带引号的字符串）。此外，打印的值对应于最后赋的值。当执行 `b=a` 时，使用的是 `a=10`。当执行\
  \ `a=15` 时，`a` 的值改变了，但 `b` 的值保持不变。这种行为可以通过以下方式理解：\n\n*   `a=10`\n    *   变量 `a`\
  \ 指向存储值 `10` 的内存位置。\n*   `b=a`\n    *   变量 `b` 也指向与 `a` 相同的内存位置。\n*   `a=15`\n \
  \   *   变量 `a` 现在指向一个存储值 `15` 的不同内存位置。\n    *   变量 `b` 仍然指向存储值 `10` 的内存位置。\n   \
  \ *   除非它们被重新赋值，否则两者都将保持这种状态。\n\n除了这个简单的赋值运算符之外，还有更多可以执行操作的运算符。表 5-2 提供了此类赋值运算符的信息。\n\
  \n**表 5-2** 赋值运算符\n\n| 运算符 | 示例 |\n| --- | --- |\n| `=` | `v = a+b` |\n| `+=` |\
  \ `v +=a ⇒ v = v + a` |\n| `-=` | `v -=a ⇒ v = v - a` |\n| `/=` | `v /=a ⇒ v = v\
  \ / a` |\n| `//=` | `v //=a ⇒ v = v // a` |\n| `*=` | `v *=a ⇒ v = v * a` |\n| `**=`\
  \ | `v **=a ⇒ v = v ** a` |\n| `%=` | `v %=a ⇒ v = v % a` |\n\n赋值运算符是所有类型程序中最常用的特性。递增和递减运算符（如\
  \ `+=` 和 `-=`）在需要逐步进行的过程中被广泛使用。以下 Python 代码将阐明这一点：\n\n```\n1  >>> a = 10 # 将值 10\
  \ 赋给 a\n2  >>> a # REPL 打印 a 的值\n3  10\n4  >>> b = 0 # 将值 0 赋给 b\n5  >>> b # REPL\
  \ 打印 b 的值，即 0\n6  0\n7  >>> b += a # b 的新值是 b+a，即 0+10=10\n8  >>> b # REPL 打印 b\
  \ 的值，即 10\n9  10\n10  >>> b = 1 # 将值 1 重新赋给 b\n11  >>> b += a # 现在 b 被重新赋值为 b+a，即\
  \ 1+10=11\n12  >>> b # REPL 打印 b 的新赋值，即 11\n13  11\n```\n\n类似地，我们可以测试其他运算符：\n\n\
  ```\n1  >>> a = 10 # 将值 10 赋给 a\n2  >>> b = 5 # 将值 5 赋给 b\n3  >>> a # REPL 打印 a\
  \ 的值\n4  10\n5  >>> b # REPL 打印 b 的值\n6  5\n7  >>> b += a # b 被重新赋值为 b+a=10+5=15\n\
  8  >>> a # a 仍然指向值 10\n9  10\n10  >>> b # b 指向新重新赋值的 15\n11  15\n12  >>> b -=a #\
  \ b 被重新赋值为 b-a=15-10=5\n13  >>> a # a 仍然指向值 10\n14  10\n15  >>> b # b 指向新重新赋值的 5\n\
  16  5\n17  >>> b /=a # b 被重新赋值为 b/a=0.5，即除法运算的商\n18  >>> a # a 仍然指向值 10\n19  10\n\
  20  >>> b # b 指向新重新赋值的 0.5\n21  0.5\n22  >>> b  //=a # b 被重新赋值为 b/a=0.0，即整除运算的商\n\
  23  >>> a # a 仍然指向值 10\n24  10\n25  >>> b # b 指向新重新赋值的 0.0\n26   0.0\n27  >>> a\
  \ = 10 # a 被重新赋值为相同的值 10\n28  >>> b = 5 # b 被重新赋值为新值 5\n29  >>> a # a 仍然指向值 10\n\
  30  10\n31  >>> b # b 仍然指向值 5\n32  5\n33  >>> a ∗= b # a 被重新赋值为 a∗b=10∗5=50\n34\
  \  >>> a # a 现在指向新重新赋值的值，即 50\n35  50\n36  >>> b # b 仍然指向值 5\n37  5\n38  >>> a ∗∗=\
  \ b # a 被重新赋值为 a∗∗b，即 50 的 5 次方，即 312500000\n39  >>> a # a 现在指向新赋值的值 312500000\n\
  40  312500000\n41  >>> b # b 仍然指向旧值 5\n42  5\n43  >>> a %= b # a 被重新赋值为 a%b=312500000%5，即\
  \ 312500000/5 的余数 = 0\n44  >>> a # a 现在指向新重新赋值的值，即 0\n45  0\n46  >>> b # b 仍然指向旧值\
  \ 5\n47  5\n```\n\n我们还在前面的 Python 代码中了解了算术运算符 `+`、`-`、`*`、`**`、`/`、`//` 和 `%`。它们将在第\
  \ 5.4 节中详细讨论。它们可以用于不同的数字类型，并且可以轻松执行数学计算。你唯一需要记住的是特定数据类型中可以存储的最大数字的限制，以及算术运算符是否允许将特定数据类型作为其参数之一。\n\
  \n可以在同一个语句中使用 `=` 运算符进行多重赋值，如下所示：\n\n```\n1  >>> a = b = c = 10\n2  >>> a\n3  10\n\
  4  >>> b\n5  10\n6  >>> c\n7  10\n8  >>> c = 15\n9  >>> a\n10  10\n11  >>> b\n12\
  \  10\n13  >>> c\n14  15\n15  >>> a = b = c = 15\n16  >>> a\n17  15\n18  >>> b\n\
  19  15\n20  >>> c\n21  15\n```\n\n在前面的 Python 代码中，首先 `c=10` 将值 10 赋给变量名 `c`，然后 `b=c`\
  \ 将 `c` 中存储的值（即 10）赋给变量名 `b`。此外，`a=b` 将 `b` 的赋值赋给 `a`。实际上，所有三个变量（`a`、`b` 和 `c`）都指向存储整数\
  \ 10 的同一内存位置。当 `c` 被赋予新值 15 时，变量名 `a` 和 `b` 继续指向存储值 10 的内存位置，但 `c` 现在指向存储值 15 的新内存位置。当再次对值\
  \ 15 执行多重赋值时，`a`、`b` 和 `c` 指向新赋值的、指向值 15 的内存位置。\n\n在赋值时，不需要显式定义其数据类型。Python 解释器会根据数据本身来判断。例如，`4.0`\
  \ 将被视为浮点数，`4` 将被视为整数，单个字符 `'a'` 或一组字符（如 `'sandeep'`）将被视为字符串。以下示例代码展示了这一点：\n\n```\n\
  1  >>> a = 4.0; type(a) # a 被赋值为 4.0，其类型被确定为浮点数\n2  <class 'float'>\n3  >>> a =\
  \ 4; type(a) # a 被赋值为 4，其类型被确定为整数\n4  <class 'int'>\n5  >>> a = 4e10;type(a) # a\
  \ 被赋值为 4 X 10ˆ10，其类型被确定为浮点数\n6  <class 'float'>\n7  >>> b = 'a'; type(a) # b 被赋值为与\
  \ a 相同的值，即 4 X 10ˆ10，其类型被确定为浮点数\n8  <class 'float'>\n9  >>> b = 'sandeep'; type(b)\
  \ # b 被重新赋值为字符串，其类型被确定为字符串\n10  <class 'str'>\n```\n\n可以注意到，定义浮点数的另一种方法是通过工程记数法。例如，`4e10`\
  \ 表示数字 4 × 10¹⁰ 的工程记数法。此外，通过使用 `;`，可以抑制在 REPL 处打印输出。赋值的值被抑制在 REPL 处打印，但 `type()`\
  \ 函数的输出不会被抑制，因此它会在 REPL 处打印。\n\n\n\n## 5.4 算术运算符\n\n数学运算符如 `+`、`-`、`%`、`/` 和 `//`（表\
  \ 5-4）遵循与数学中相同的逻辑。`a ^ b` 写作 `a**b`，而向下取整除法则用 `//` 符号表示。向下取整除法（使用 `//` 符号）是指将商向\
  \ −∞ 方向舍入（换句话说，向数轴上左侧最近的整数舍入）：\n\n```\n1  >>> 4.2 % 2.3 #输出为余数\n2  1.9000000000000004\n\
  3  >>> 4.2 / 2.3 # 输出为商\n4  1.8260869565217392\n5  >>> 4.2 + 2.3 # 输出为加法结果\n6  6.5\n\
  7  >>> 4.2 - 2.3 # 输出为减法结果\n8  1.9000000000000004\n9  >>> 4.2 ∗∗ 2 # 输出为幂运算结果\n\
  10  17.64\n11  >>> 4.2 // 2.3 # 输出为向下取整除法结果\n12  1.0\n```\n\n某些算术运算符也适用于 `string`\
  \ 和 `list` 对象。例如，`+` 在字符串上充当连接运算符；它将两个或多个参数从头到尾连接起来。对于列表数据类型也是如此。此外，`*` 运算符只是根据整数指定的次数重复执行\
  \ `+` 操作。如果参数是浮点数，则会遇到错误消息。如果你对字符串和列表应用其他算术运算符，同样会遇到错误消息。以下 Python 代码展示了这一行为：\n\n\
  ```\n1  >>> 'hello' + ' ' + 'world' + '!'\n2  'hello world!'\n3  >>> [1,2,3] + [4,5,6]\n\
  4  [1, 2, 3, 4, 5, 6]\n5  >>> 'hello' ∗3\n6  'hello hello hello'\n7  >>> [1,2,3]\
  \ ∗ 3\n8  [1, 2, 3, 1, 2, 3, 1, 2, 3]\n9  >>> 'hello' ∗3.1\n10  Traceback (most\
  \ recent call last):\n11  File \"\", line 1, in \n12  TypeError: can't multiply\
