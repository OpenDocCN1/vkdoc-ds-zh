  \n## 9.5 对象引用\n\nPython 对象被表示为对内存中某个对象的引用。引用是一个指向内存位置的值。这可以通过以下使用 `id()` 函数的例子来理解。`id()`\
  \ 函数返回一个唯一数字，代表输入变量存储的内存地址：\n\n```\n1  >>> a1 = 10\n2  >>> id(a1)\n3  4469844832\n\
  4  >>> a2=a1\n5  >>> id(a2)\n6  4469844832\n7  >>> a3=20\n8  >>> id(a3)\n9  4469845152\n\
  10  >>> a3=a2\n11  >>> id(a2)\n12  4469844832\n13  >>> id(a3)\n14  4469844832\n\
  15  >>> a1\n16  10\n17  >>> a2\n18  10\n19  >>> a3\n20  10\n```\n\n如 Python 代码所示，`a1`\
  \ 被赋值为 10。用 Python 的语言来说，就是创建了一个整数对象（其内存位置的 id 为 4469844832）。内置函数 `id()` 可用于探查内存位置的\
  \ id。\n\n当执行 `a2=a1` 语句时，我们发现相同的 id 被分配给了引用值 `a1` 和 `a2`。接下来对此进行了验证。现在创建了另一个值为 20\
  \ 的整数对象，并用引用值 `a3` 来引用它。探查其 id 后发现，它与 `a1` 和 `a2` 的 id 不同。因此，每次创建一个对象时，它都会被存储在不同的内存位置。换句话说，它被赋予了不同的\
  \ id。\n\n当一个对象被两个引用值引用时会发生什么？当我们发出命令 `a3 = a2` 时，`a3` 和 `a2` 引用的是存储在 `a2` 中的同一个对象。而\
  \ `a2` 与 `a1` 共享引用，`a1` 存储着一个值为 10 的整数对象。因此，现在所有三个引用值 `a1`、`a2` 和 `a3` 都引用同一个值为\
  \ 10 的整数对象。\n\n### 9.5.1 垃圾回收\n\n在第 7 行创建的整数对象 20 发生了什么？这个对象被解引用了。因此，这个内存位置必须被释放；其状态应从“正在使用”变为“可重用”。这个过程称为垃圾回收，对于高效的内存管理非常重要。Python\
  \ 会自动执行此操作。\n\n最原始的方法之一是维护一个引用计数。对于每个对象，都会维护一个指向该对象的引用总数。如果该计数降至 0，则立即释放该对象。但现在使用了更高级的算法[3,\
  \ 4]，以排除这种原始想法可能带来问题的情况。遗憾的是，讨论 Python 垃圾回收方式的细节超出了本书的范围。如果你对这个主题感兴趣，以下参考文献将有所帮助[5,\
  \ 6, 7]。\n\n\n\n### 9.5.2 复制与深拷贝\n\n用两个引用值指向同一个对象，看起来像是在复制。之前的讨论中已经观察到，当用户对原始对象进行修改时，两个副本都会受到影响。在处理\
  \ `list` 对象时，这可能会成为一个问题：\n\n```\n1  >>> list1 = [1,2,3]\n2  >>> list2 = list1\n\
  3  >>> list1\n4  [1, 2, 3]\n5  >>> list2\n6  [1, 2, 3]\n7  >>> list1[1]=-1\n8  >>>\
  \ list1\n9  [1, -1, 3]\n10  >>> list2\n11  [1, -1, 3]\n```\n\n首先，我们创建了一个值为 `[1,2,3]`\
  \ 的列表对象，其引用值为 `list1`。接着，我们创建了另一个引用值 `list2`，它与原始引用值 `list1` 都指向同一个原始列表对象（`[1,2,3]`）。当列表中的第二个元素被第\
  \ 7 行代码修改后，由于这两个引用值都指向同一个对象，因此修改会同时反映在两者上。因此，`list2` 看起来像是 `list1` 的一个副本，它忠实地跟随其原始对象。让我们探究一下，当列表的成员本身也是列表时，这种模式是否依然成立：\n\
  \n```\n1  >>> list1 = [1,2,3]\n2  >>> list2 = [list1,list1]\n3  >>> list1\n4  [1,\
  \ 2, 3]\n5  >>> list2\n6  [[1, 2, 3], [1, 2, 3]]\n7  >>> list3=list2\n8  >>> list3\n\
  9  [[1, 2, 3], [1, 2, 3]]\n10  >>> list2[1]=[-1,-2,-3]\n11  >>> list1\n12  [1, 2,\
  \ 3]\n13  >>> list2\n14  [[1, 2, 3], [-1, -2, -3]]\n15  >>> list3\n16  [[1, 2, 3],\
  \ [-1, -2, -3]]\n```\n\n由此可见，即使列表对象的成员本身也是列表对象，复制行为的工作方式与成员是其他对象时相同。\n\n以下代码展示了使用\
  \ `list` 构造函数时会发生什么：\n\n```\n1  >>> list1 = list([1,2,3])\n2  >>> list2 = list([list1,list1,list1])\n\
  3  >>> list2\n4  [[1, 2, 3], [1, 2, 3], [1, 2, 3]]\n5  >>> list3 = list(list2)\n\
  6  >>> list3\n7  [[1, 2, 3], [1, 2, 3], [1, 2, 3]]\n8  >>> list2[1]=list([-1,0,1])\n\
  9  >>> list2\n10  [[1, 2, 3], [-1, 0, 1], [1, 2, 3]]\n11  >>> list3\n12  [[1, 2,\
  \ 3], [1, 2, 3], [1, 2, 3]]\n13  >>> id(list2)\n14  4416356864\n15  >>> id(list3)\n\
  16  4416356936\n```\n\n注意，引用值 `list3` 拥有不同的数据，因为它们现在指向两个不同的对象（通过它们的内存 id 值可以看出）。因此，在使用\
  \ `list` 构造函数时，原始列表的副本并没有忠实地跟随其原始对象。所以，`list3` 被称为 `list2` 的**浅拷贝**。\n\n有时，即使使用了\
  \ `list` 构造函数，我们也希望创建一个副本，并在各种变换下保持其不变。为此，名为 `copy` 的模块提供了两个方法：`copy.copy()` 和 `copy.deepcopy()`。根据\
  \ Python 文档 [8]：\n\n*   **浅拷贝**构造一个新的复合对象，然后（尽可能）将原始对象中找到的对象的引用插入其中。这是通过 `copy`\
  \ 模块的 `copy.copy()` 方法执行的。\n*   **深拷贝**构造一个新的复合对象，然后递归地将原始对象中找到的对象的副本插入其中。这是通过 `copy`\
  \ 模块的 `copy.deepcopy()` 方法执行的。\n\n```\n1  >>>import copy\n2  >>> a = [[1, 2, 3],\
  \ [4, 5, 6]]\n3  >>> b = list(a)\n4  >>> a\n5  [[1, 2, 3], [4, 5, 6]]\n6  >>> b\n\
  7  [[1, 2, 3], [4, 5, 6]]\n8  >>> a[0][1] = 10\n9  >>> a\n10  [[1, 10, 3], [4, 5,\
  \ 6]]\n11  >>> b   # 列表 b 也改变了 => 不是深拷贝。\n12  [[1, 10, 3], [4, 5, 6]]\n```\n\n现在，让我们看看\
  \ `deepcopy` 是如何工作的：\n\n```\n1  >>> b = copy.deepcopy(a)\n2  >>> a\n3  [[1, 10,\
  \ 3], [4, 5, 6]]\n4  >>> b\n5  [[1, 10, 3], [4, 5, 6]]\n6  >>> a[0][1] = 9\n7  >>>\
  \ a\n8  [[1, 9, 3], [4, 5, 6]]\n9  >>> b    # 列表 b 没有改变 => 深拷贝\n10  [[1, 10, 3],\
  \ [4, 5, 6]]\n```\n\n如你所见，即使 `a` 被修改，它也能使 `b` 保持其值不变。\n\n## 9.6 类\n\n到目前为止，我们只讨论了预定义的对象，并查看了它们的\
  \ `type` 和内存 `id`。通过使用一种称为类的特殊对象类型，我们可以创建其他对象。\n\n类的概念也源自自然界。现实世界中的对象根据其属性和行为进行分类。一个对象仅仅是其类的一个实例。例如，男人和女人仅仅是智人这个类的实例。类似地，关键字\
  \ `class` 定义了一类对象，可以为该类定义各种实例。例如，一个数字类可以有整数、浮点数、复数、有理数和无理数等实例。一旦定义，该类的所有成员将共享数字共有的某些属性和行为，但它们可以根据差异进一步细分。该类的所有成员将与语言类（包含字符、单词、句子和段落）截然不同。现在，可以定义一个数字类的实例（如整数）和一个语言类的实例（如字符）用于计算。这些各自类的实例将拥有自己的属性和方法（其中一些与它们的类共享，一些是它们自己独有的）。这种面向对象的方法帮助我们将一个复杂系统分解成小的基本单元，以便于研究。\n\
  \n因此，类定义了一种新的抽象实体的行为，而对象只是该实体的一个特定实例。类和对象有助于以可管理的方式定义函数对数据的操作，无论数据和函数的性质如何，都可以以类似的方式进行管理。接口描述了一个对象的功能，而其实际实现则定义了如何执行这些功能。类具有构造函数（我们已经在\
  \ 9.5.2 节中讨论过构造函数 `list()`），它规定了特定类型对象的创建。封装和继承描述了类与其超类的层次结构。这些概念将在后续章节中进一步阐述。\n\
  \n### 9.6.1 创建类\n\n关键字 `class` 用于创建一个类。例如，一个名为 `int` 的内置类定义了用于存储整数的对象的行为。当一个变量与该类的一个对象关联时，它被称为该类的一个实例。例如，语句\
  \ `a=1` 创建了一个名为 `a` 的对象，它是 `int` 类的一个实例。另一方面，语句 `b=1.0` 创建了一个名为 `b` 的对象，它是 `float`\
  \ 类的一个实例。根据存储在 `a` 和 `b` 中的对象类型，它们在使用时的行为会有显著差异。\n\n关键字 `class` 用于创建一个对象。其语法定义规则如下：\n\
  \n```\n1  class 类名:\n2    '''可选的类文档字符串'''\n3    语句\n```\n\n通常，为了便于使用，类名会以有意义的方式命名。同样，通常会将使用细节放在文档字符串中。该字符串可以通过以下命令访问：\n\
  \n```\n类名.__doc__\n```\n\n属于特定对象（由类定义）的变量称为字段。这些字段可以通过类内部为此目的定义的函数进行探查。这样的函数称为方法。\n\
  \n\n\n### 9.6.2 类变量与类方法\n\n`类变量`表示普遍适用于类内定义的所有对象的数据。它们在类定义中定义，并在类的作用域内有效。这意味着该类中定义的每个对象都可以访问它们。无需引用类即可访问这些变量。\n\
  \n另一方面，`实例变量`仅在类对象的实例中有效。因此，它是在类实例的定义中定义的（在定义实例对象行为的 `def` 块内）。\n\n`类方法`与普通函数仅有一点不同：它们需要额外添加一个第一个参数。这个参数名需要添加到参数列表的开头。用户在调用方法时无需为此参数提供值。它由\
  \ Python 的主程序提供，该程序默认由 Python 解释器运行。这个特定的变量指向对象本身。因此，它被命名为 `self`。那些不接受任何参数的方法至少也有\
  \ `self` 这个参数。清单 9-1 将使这个概念更清晰。\n\n```\n1  #Python code to explain defining\n2 \
  \ #and using class\n\n4  #A class named python_program is defined\n5  class first_program:\n\
  6      '''\n7      This program has two methods: hi and hi_again\n8      '''\n9\
  \      greeting = 'Hello Everybody\\n' #Class variable definition\n\n11      #Now\
  \ we define two instances of this class as \"hi\" and        \"hi_again\"\n12  \
  \    def hi(self):\n13          greet = 'Hello World!\\n'\n14          print(greet)\n\
  15      def hi_again(self):\n16          greet_again = 'Hello again!\\n'\n17   \
  \       print(greet_again)\n\n19  #Procedures to call the class\n\n21  x = first_program()\
  \ # Calling the class\n22  print('The type of object storing class calling is:',\
  \ type(x))\n23  x.hi() #Calling an instance of \"x\" class\n24  x.hi_again() # Calling\
  \ another instance of \"x\" class\n25  # Results of both instances depend on thier\
  \ definitions\n\n27  #Acessing class variable\n28  #Class variable can be accessed\
  \ from anywhere\n29  print(first_program.greeting)\n\n31  #Printing the documentation\
  \ string\n32  print(first_program.__doc__)\nListing 9-1\nEx–class.py\n```\n\n输出结果如下所示：\n\
  \n```\n1  $python Ex-class.py\n2  The type of object storing class calling is: \n\
  3  Hello World!\n\n5  Hello again!\n\n7  Hello Everybody\n\n10  This program has\
  \ two methods: hi and hi_again\n```\n\n### 9.6.3 构造函数\n\n类中的所有对象都只是该类的实例。当这个实例被初始化时，会调用一种特殊的函数。构造函数是在对象实例化时执行的函数。Python\
  \ 总是将构造函数命名为 `__init()__`，因为它设置了对象的初始状态。它定义了该实例的初始状态和基本性质。它在类定义中定义，但用户可以省略此定义，因为每个类都会自动创建一个默认构造函数。它通常用于定义实例变量的初始值，如清单\
  \ 9-2 所示。\n\n```\n1  #Python code to show usage of __init__\n\n3  # Defining a class\
  \ \"library\"\n4  # which stores information about book's name and price\n\n6  #Defining\
  \ class\n7  class library:\n8     'The base class for all books'\n9     bookCount\
  \ = 0 #Class variable setting count of books to zero\n\n11     def __init__(self,\
  \ name, price):# Initializing the instance of class with name, price and updated\
  \ book count\n12        self.name = name\n13        self.price = price\n14     \
  \   library.bookCount += 1\n\n16     def displayCount(self):\n17       print(\"\
  Total Employee %d\",library.bookCount)\n\n19     def displayBook(self):\n20    \
  \    print(\"Name : \", self.name,  \", Price: \", self.price)\n\n22  #Creating\
  \ objects\n\n24  book1 = library(\"Introduction to python\",100) # First    instance\
  \ of object \"library\"\n25  print(type(book1))\n\n27  book2 = library(\"Basic Python\"\
  ,150) # Second instance    of object \"library\"\n28  print(type(book2))\n\n30 \
  \ book3 = library(\"Intermediate Python\",200) # Third instanc    of object \"library\"\
  \n31  print(type(book3))\n\n33  book4 = library(\"Advanced Python\",300) # Four\
  \ instance    of object \"library\"\n34  print(type(book2))\n\n36  # Accessing attributes\n\
  \n38  print(\"Details of first book:\")\n39  book1.displayBook()\n\n41  print(\"\
  Details of second book:\")\n42  book2.displayBook()\n\n44  print(\"Details of third\
  \ book:\")\n45  book3.displayBook()\n\n47  print(\"Details of fourth book:\")\n\
  48  book4.displayBook()\n\n50  print(\"Total Number of books= %d\" % library.bookCount)\n\
  \n52  # Probing the bult-in attributes\n\n54  print(\"library.__doc__:\", library.__doc__)\n\
  55  print(\"library.__name__:\", library.__name__)\n56  print(\"library.__module__:\"\
  , library.__module__)\n57  print(\"library.__bases__:\", library.__bases__)\n58\
  \  print(\"library.__dict__:\", library.__dict__)\nListing 9-2\nEx–class1.py\n```\n\
  \n代码 `Ex-class1.py` 可以解释如下：\n\n*   第 7 行定义了一个名为 `library` 的类。该类旨在记录书名及其价格。\n*  \
  \ 第 9 行定义了一个名为 `bookCount` 的类变量，并将其设置为零值。\n    *   由于它是一个类变量，因此被所有实例共享。\n    * \
  \  可以在类内部或外部通过 `library.bookCount` 访问它。\n*   该类在第 11 行到第 14 行定义了一个构造函数，以及两个名为 `displayCount`\
  \ 和 `displayBook` 的方法。\n*   第 11–14 行定义了用于初始化所有实例的构造函数：\n    *   它接受三个参数：`self`、`name`\
  \ 和 `price`。\n    *   `self` 指向对象本身。\n    *   `name` 和 `price` 分别在第 12 行和第 13 行初始化。\n\
  \    *   这些参数在调用类时是必需的，即 `library(name,price)`。\n    *   此初始化信息被对象 `library` 的所有实例使用。\n\
  *   第 16–17 行定义了一个名为 `displayCount` 的方法，并输出由 `bookCount` 变量引用的值。\n*   第 19–20 行定义了一个名为\
  \ `displayBook` 的方法，该方法提供书名和价格的信息。\n*   第 21–33 行创建了对象 `library` 的单独实例。\n    * \
  \  根据构造函数的定义，调用类时的两个输入参数必须是存储在变量 `name` 和 `price` 中的值。\n*   第 39、44、48 和 52 行逐个调用对象，探查由方法\
  \ `displayBook()` 定义的属性。\n*   第 50 行使用方法 `bookCount()` 显示书籍总数。\n\n\n\n#### 内置类属性\n\
  \n所有 Python 类都拥有某些可通过点运算符访问的内置属性。这些操作在第 54 行至第 58 行完成。\n\n- `__doc__`\n  - 返回类的文档字符串\n\
  \  - 若未定义则返回 `None`\n- `__dict__`\n  - 返回包含类命名空间的字典\n  - 该字典包含对象 `library` 的相关信息，具体包括：\n\
  \    - `__module__`\n    - 定义的方法（本例中为 `displayCount()` 和 `displayBook()`）\n    -\
  \ 定义的类变量（本例中为 `bookCount`）\n    - `__doc__`\n    - 构造函数 `__init__`\n- `__name__`\n\
  \  - 返回类的名称\n- `__module__`\n  - 返回定义该类的模块名称\n  - 在交互模式下，该值为 `__main__`\n- `__bases__`\n\
  \  - 一个可能为空的元组，包含基类列表中按出现顺序排列的基类\n\nPython 代码 `class1.py` 的输出如下所示：\n\n```\n5  Details\
  \ of first book:\n6  Name:  Introduction to python , Price:  100\n7  Details of\
  \ second book:\n8  Name:  Basic Python , Price:  150\n9  Details of third book:\n\
  10  Name :  Intermediate Python , Price:  200\n11  Details of fourth book:\n12 \
  \ Name :  Advanced Python , Price:  300\n13  Total Number of books= 4\n14  library.__doc__:\
  \ The base class for all books\n15  library.__name__: library\n16  library.__module__:\
  \ __main__\n17  library.__bases__: (,)\n18  library.__dict__: {'__module__': '__main__',\
  \ '__doc__': 'The base class for all books', 'bookCount': 4, '__init__': , 'displayCount':\
  \ , 'displayBook':, '__dict__': , '__weakref__': }\n```\n\n## 9.7 总结\n\n在本章中，我们演示了如何使用\
  \ `class` 构造定义一种新类型的对象。由于 Python 将一切视为对象，它成为科学计算和模拟的首选之一。因其易于学习，用户可以很快开始进行严肃的科学计算。这一特性使其在教育工作者、学生和研究人员中非常受欢迎。创建类并构建自定义模块的能力，使得开发者能够日复一日地丰富\
  \ Python 生态系统。因此，可以说 Python 的面向对象特性及其开源生态系统使其成为最流行的编程语言之一，这并非夸大其词。\n\n"
- "# 10. 数值计算形式体系\n\n## 10.1 引言\n\n数值计算使我们能够计算数值问题的解，前提是我们能将其转化为合适的格式。这需要一些考量。例如，如果我们将连续函数数字化，由于以有限频率采样，将会引入某些误差。因此，非常精确的结果需要非常高的采样率。当需要计算大型数据集时，这将变成一项计算密集且耗时的任务。此外，用户必须理解，与解析解相比，数值解充其量只是一种近似。寻找其物理意义和重要性的责任在于我们自身。丢弃那些在现实场景中没有意义的解，是科学家/工程师多年积累的艺术。此外，计算设备的智能程度与其操作者相当。GIGO（垃圾进，垃圾出）法则在该领域被严格遵循。\n\
  \n在本章中，我们将考虑使用数值计算解决物理问题的一些重要步骤。用恰当的术语定义问题只是第一步。建立正确的模型，然后使用正确的方法（求解器）来解决问题，是区分经验丰富的科学家/工程师与新手的标志。\n\
  \n## 10.2 物理问题\n\n我们物理世界中的一切皆受物理定律支配。由于科学工作者们在艰苦条件下努力为我们周围发生的自然现象提出精妙解决方案，我们才获得了物理定律的数学理论。为了检验这些物理定律的数学形式体系，我们使用数值计算。如果它产生的结果与真实实验相同，则两者相互验证。只要我们拥有经过充分检验的数学形式体系，数值模拟就可以完全消除进行实验的必要。例如，当今的核大国已无需再测试真实的核弹。在真实核爆炸期间获得的核爆炸数据，使科学家能够相当精确地建模这些物理系统，从而消除了真实测试的需求。\n\
  \n除了模拟真实实验等应用外，对物理问题进行建模也是一种很好的教育练习。在建模过程中，动手实践使学生能够深入探索该主题，并对所研究的课题赋予恰当的意义。解决数值问题并将结果可视化，能使学习效果持久，并激发对数学理论缺陷的相关研究，最终带来新的发现。\n\
  \n\n\n## 10.3 定义模型\n\n建模被定义为为物理系统编写方程。顾名思义，方程涉及等式两边的相等。方程使用 `=` 符号编写，其中左侧的项等于右侧的项。方程两边的项可以是数字或表达式。例如：\n\
  \n![$$ 3x+4y+9z=10 $$](img/A458920_1_En_10_Chapter_Equa.gif)\n\n这是一个方程，左侧（LHS）有一个表达式\
  \ `3x + 4y + 9z`，右侧（RHS）有一个项 `10`。请注意，左侧是一个代数项，而右侧是一个数字。\n\n表达式是使用函数编写的，这些函数展示了两个域之间的关系。例如，`f(x)\
  \ = y` 通过代数规则说明了 `y` 与 `x` 的关系。数学拥有丰富的函数库，可用于构建表达式。选择合适的函数取决于具体问题。某些函数能比其他函数更好地描述某些情况。例如，振荡行为可以使用三角函数（如\
  \ `sin(x)` 和 `cos(x)`）以合理的方式描述。沿直线运动的物体可以用线性方程描述，例如 `y = mx + c`，其中 `x` 是当前位置，`m`\
  \ 是 `x` 相对于 `y` 的恒定变化率，`c` 是偏移位置。沿曲线运动的物体可以用各种非线性函数描述，其中因变量（如前一句中的 `x`）的幂次不为 `1`。\n\
  \n在现实生活中，我们可能会遇到这些场景混合的情况。例如，一个物体可以同时振荡并沿曲线运动。在这种情况下，我们使用混合函数编写表达式，或者寻找能够解释该物体行为的新函数。验证函数的方法是为描述该行为的方程找到解，并将其与对物体的观测结果进行匹配。如果完全匹配，我们就得到了精确解。在大多数情况下，可能难以获得精确解。在这些情况下，我们得到的是“近似”解。如果获得近似解时涉及的误差在容许范围内，那么模型是可以接受的。\n\
  \n如前所述，物理情况可以通过用涉及因变量的函数编写数学表达式来解析求解。最简单的问题在因变量之间具有简单的函数关系，并且只有一个方程。也可能存在需要多个方程才能解释一种物理行为的情况。在求解多个方程的情况下，矩阵理论就派上了用场。\n\
  \n假设以下方程定义了一个系统的物理行为：\n\n![$$ -x+3y=4 $$](img/A458920_1_En_10_Chapter_Equ1.gif)\n\
  \n(10.1)\n\n![$$ 2x-4y=-3 $$](img/A458920_1_En_10_Chapter_Equ2.gif)\n\n(10.2)\n\n\
  这个由两个方程组成的方程组可以用一个矩阵方程表示，如下所示：\n\n![$$ \\left[\\begin{array}{cc}-1& 3\\\\ {}2& -4\\\
  end{array}\\right]+\\left[\\begin{array}{c}x\\\\ {}y\\end{array}\\right]=\\left[\\\
  begin{array}{c}4\\\\ {}3\\end{array}\\right] $$](A458920_1_En_10_Chapter_Equb.gif)\n\
  \n现在，利用矩阵代数，可以找到变量 `x` 和 `y` 的值，使得它们满足这些方程。这些值被称为这些方程的根。这些根是二维空间（因为我们有两个因变量）中的点，在该点上，系统将为该物理问题找到稳定状态。通过这种方式，我们无需实际进行实验就能预测系统的行为。\n\
  \n当我们处理动态系统时，微分和积分的数学概念变得非常重要。当系统不断改变因变量的值以产生某种场景时，了解这些变量的变化率至关重要。当这些变量彼此独立时，我们使用简单导数来定义它们的变化率。当它们彼此不独立时，我们使用偏导数。\n\
  \n例如，牛顿第二运动定律指出，物体速度的变化率与施加在其上的力成正比。我们可以用数学方式展示这个概念：\n\n![$$ F\\alpha \\frac{dy}{dx}\
  \ $$](img/A458920_1_En_10_Chapter_Equ3.gif)\n\n(10.3)\n\n通过代入一个乘法常数 `m`，可以将比例关系转化为等式，使得下式成立：\n\
  \n![$$ F=m\\times \\frac{dy}{dx} $$](img/A458920_1_En_10_Chapter_Equ4.gif)\n\n(10.4)\n\
  \n如果我们知道 `F` 的值或表达式，这个方程可以解析求解，并找到该方程的解。然而，在某些情况下，解析解可能过于难以获得。在这种情况下，我们将系统数字化并寻找数值解。\n\
  \n有许多方法可以对给定函数进行数字化和数值求解。实现特定方法来数值求解函数的程序称为求解器。存在许多求解器来求解函数。求解器的选择对于成功获得解至关重要。例如，方程\
  \ 10.4 是一个微分方程。它是一个一阶常微分方程。存在许多求解器可以求解它，包括欧拉法和龙格-库塔法。选择特定求解器取决于其解的精度、获得解所需的时间以及过程中使用的内存量。后者在内存不是可以随意消耗的资源时（例如在使用内存存储有限的微型计算机时）非常重要。\n\
  \n使用 Python 进行数值计算的优势在于，它拥有非常丰富的模块库来执行所需的各种任务。预定义的函数已经针对速度和精度进行了优化（在某些情况下，精度可以预先定义）。这使得用户能够快速构建问题原型，而不是专注于编写执行基本任务的函数并针对速度、精度和内存使用进行优化。\n\
  \n## 10.4 Python 包\n\n存在许多用于在特定科学领域进行数值计算的包。网站 [1] 列出了这些包。可以通过在 LINUX 命令行中编写以下命令来安装包：\n\
  \n```\n>> pip install\n```\n\n鼓励用户查看以下用于科学计算的包：\n\n*   `numpy`：用于数值计算\n*   `scipy`：`numpy`\
  \ 的超集，除了 `numpy` 中的通用数学函数外，还包含针对物理学的特定函数\n*   `scikit-learn`：机器学习\n*   `tensorflow`：机器学习\n\
  *   `Pandas`：统计数据分析\n*   `scikit-image`：图像处理\n*   `bokeh`：交互式绘图\n\n\n\n## 10.5 用于科学与工程的\
  \ Python\n\n计算机在科学与工程的理论研究和实验研究中均有应用。在理论研究中，计算机主要用于解决那些需要在现实问题模型内对大量相似或不同数据点进行迭代操作的问题。实验研究则利用计算机进行仪器仪表与控制。因此，理想的科学研究编程语言必须高效地完成这些任务。这里的效率包含以下几个方面：\n\
  \n-   能够以简单、直观且极简的语法编写问题\n-   最短的执行时间\n-   能够以无差错的方式存储和检索大量数据\n-   能够利用并行处理范式处理数据\n\
  -   能够处理海量类型的数据集\n-   面向对象编程\n-   广泛的图形处理能力\n-   架构无关性\n-   适用于多种平台的仪器仪表与控制系统\n\
  -   网络功能\n-   安全性\n-   问题原型开发时间短\n\n让我们根据这些参数来评估 Python，以判断其适用于各种科学任务的程度。这项评估将为用户在将\
  \ Python 用于科学问题之前提供重要线索。\n\n## 10.6 问题原型开发\n\nPython 是一种解释型语言。解释过程省去了在生成机器码之前编译代码的步骤。Python\
  \ 逐行读取代码，一旦某一行被正确解释，便立即输出机器码。解释型语言在问题原型开发方面具有巨大优势，但其执行速度却出了名的慢。\n\n### 10.6.1 什么是原型开发？\n\
  \n问题原型开发包括为现实问题构建数学模型，然后使用特定编程语言的语法对该数学模型进行编码。数学建模包含以下步骤：\n\n-   定义变量\n-   标记其本质上是因变量还是自变量\n\
  -   通过将已知数学函数作为假设，设计它们之间的函数关系\n\n一旦数学模型设计完成，就需要通过计算机程序进行测试以产生输出，然后针对所研究的现实问题，从有意义的预测和/或结论的角度对输出进行分析。原型开发涉及重复建模和测试的过程，以便在决定选择某个特定模型并构建完整模型之前，对其进行可行性分析。在此原型开发阶段，用户可以选择忽略其他与效率相关的参数，例如更快的执行速度。\n\
  \n将数学模型转换为计算机程序的过程，涉及用编程语言的语法来表达数学架构。这可以针对模型的一部分进行，也可以整体进行。分部分建模需要各部分之间的兼容性。Python\
  \ 在这方面提供了一系列优势。\n\n### 10.6.2 Python 用于快速原型开发\n\n解释型架构的优势在于减少了调试时间。由于代码是逐行解释的，代码在遇到问题之前都能正常运行。这有助于识别和隔离代码中的问题部分，从而实现更快的调试。总体结果是，原型解决方案的开发时间显著缩短，因为解决方案设计的大部分时间都花在了调试上。除此之外，Python\
  \ 被设计为具有简单、直观且极简的语法，这进一步加速了原型开发过程，为参与解决科学问题的人员节省了时间。借助诸如 `matplotlib` 和 `mayavi`\
  \ 等强大的图形库轻松可视化问题的能力，提升了编码过程的质量，因为错误更容易被发现，并且可以以更好的方式呈现。\n\nPython 具有开源和模块化的结构，通过使用现有代码而不是重新发明轮子，能够更快地进行分部分模型开发。在相同版本的\
  \ Python（Python 2 或 Python 3）中，模块是兼容的。Python 还允许某些语言的代码在 Python 代码中本地运行。使用 `Cython`\
  \ 包，您可以在 Python 程序中嵌入 C 代码。类似地，使用 `Jython` 包，您可以在 Python 程序中嵌入 Java 代码。这使得程序员可以根据自身能力选择不同的编程语言，同时仍然利用\
  \ Python 开发他们的模型，从而弥补他们所用编程语言的不足。这也使程序员能够使用遗留代码，而无需用 Python 重新编写。\n\n## 10.7 大型数据集处理\n\
  \n`h5py` 包使开发人员能够处理 HDF5 二进制数据格式，该格式主要用于高效存储大量数据。然后，可以使用像 `numpy` 和 `scipy` 这样的\
  \ Python 包，以向量化的方式对这些数据点进行数值计算。用于 `numpy` 和 `scipy` 的基于数组的计算范式在此处变得有利，因为通过 `h5py`\
  \ 接口连接的大型数据集可以像数组一样进行操作。数千个数据集可以被分类、标记，然后保存到单个文件中。\n\n在互联网时代，用户可能希望从数据库服务器获取数据，每次处理一小部分数据，然后将结果发送回应用服务器进行进一步处理和报告生成。为此，Python\
  \ 提供了多种包。Python 有一个用于访问数据库的标准机制，称为数据库 API（DB-API）。Python DB-API 指定了连接到数据库并向其发出命令的方式。Python\
  \ DB-API 能很好地融入现有的 Python 代码，并允许 Python 程序员轻松地从数据库存储和检索数据 [2]。\n\nDB-API 包括以下内容：\n\
  \n-   连接：包含关于如何连接到数据库的指南\n-   执行语句和存储过程：使用游标查询、更新、插入和删除数据\n    -   游标是一个 Python\
  \ 对象，指向数据库中的特定位置。\n    -   一旦获得游标，就可以执行各种方法，例如插入、更新和删除数据以及查询数据。\n-   事务：支持提交或回滚事务\n\
  \    -   事务是作为一个单一逻辑工作单元执行的一系列操作，具有四个不同的属性（ACID：原子性、一致性、隔离性和持久性）。\n    -   回滚事务的可能性对于保护非常重要的数据至关重要。\n\
  -   检查元数据：检查数据库模块以及数据库和表结构的元数据\n    -   与数据库关联的元数据描述了该数据库的特性。\n    -   访问元数据的能力使开发人员能够明智地使用数据库。\n\
  -   定义错误类型：并使用 Python 提供异常处理\n\nDB-API 列表中包含了大量的数据库，这使得开发人员能够在单个代码中与多个数据库进行交互。\n\
  \n像 `pandas` 这样的专用包旨在高效地对大型数据集执行向量化操作。这些包如今在大数据领域被广泛使用。数据集通常需要进行统计分析。`pandas` 包提供了基础及高级统计分析所需的大部分统计函数。结合像\
  \ `matplotlib` 这样简单的绘图库，可以快速验证分析结果，并能够生成达到出版质量的图表，这为开发人员提供了极大的帮助。\n\n\n\n## 10.8\
  \ 仪器仪表与控制\n\n除非硬件设备搭载了安装有 Python 的操作系统（OS），否则 Python 无法直接连接硬件。像树莓派（RPi）这样的微型计算机可以实现这一点。因此，Python\
  \ 代码可以直接与连接传感器和执行器的接口进行交互。由于 Python 是一种开源语言，在开源硬件上运行给开发者带来了诸多优势，因为在大多数情况下都可以找到现成的解决方案。这极大地缩短了总的开发时间。运行\
  \ Linux 操作系统的树莓派通过使用 `rpi.gpio` 库来支持 Python，从而在 GPIO（通用输入/输出）引脚上执行读取和写入操作。因此，开发者可以使用\
  \ Python 代码读取连接到树莓派的传感器发出的电信号。开发者还可以通过 Python 编程来驱动连接到 GPIO 引脚上的电机等执行器，从而设计复杂的电气系统。在大多数情况下，科学输入以反馈回路配置工作，其中传感器读取某些物理参数，然后利用这些值驱动执行器执行任务。Python\
  \ 可以轻松完成这项任务。由于整个软件包都是在开源许可下定义的，开发者可以自由地以任何所需的方式重新配置它。这使得科学家能够根据实验需要开发定制化的设备。\n\n\
  对于未运行操作系统的硬件，Python 无法直接访问底层硬件。它也无法直接与大多数硬件供应商提供的软件库模块进行交互。在这些情况下，可以编写 Python 代码来利用所谓的虚拟串行端口，在串行端口或\
  \ USB 设备上进行通信。此时，开发者有两种选择：编写 DLL（动态链接库）形式的 C 扩展，或者使用 `ctypes` 库，该库提供了直接访问外部 DLL\
  \ 中函数的方法。如果供应商已经提供了 DLL，那么 `ctypes` 可以在 Python 代码中访问其功能。\n\n另一个出色的模块是 `PyVisa`[3]。`PyVisa`\
  \ 是一个 Python 包，它使开发者能够独立于接口（例如 GPIB、RS232、USB 和以太网）来控制各种测量设备。这对于复杂的机器来说是一个巨大的福音，因为需要通过许多不同的接口和总线系统（例如\
  \ GPIB、RS232、USB 和以太网）使用多种不同的协议来发送数据。有时，开发者希望使用的编程语言可能没有同时支持设备和其总线系统的库。因此，虚拟仪器软件架构（VISA）应运而生。VISA\
  \ 是一个用于配置、编程和故障排除包含 GPIB、VXI、PXI、串行、以太网和/或 USB 接口的仪器系统的标准。\n\n在任何情况下，理解电子设备信号输出以及管理数据流的责任都在于开发者。这些开发者必须精通电子学、数据通信、Python\
  \ 编程以及 C/C++ 编程。开发者必须清楚了解传输介质及其在数据传输速率、信号配置和数据块方面的限制。他们还必须理解连接的类型，无论是串行还是并行。\n\n\
  ## 10.9 并行处理\n\n与串行处理范式中执行单个任务相反，并行处理设计了同时执行两个或多个进程的方法。进程是处理器上执行计算的最小单元。单核处理器传统上只能执行串行处理。如今，多核处理器价格实惠，并且在大多数硬件中都能找到，这些硬件中的\
  \ CPU 拥有不止一个核心。Python 提供了许多支持多核处理的模块。\n\n构成大多数并行编程框架的两个重要概念是：线程和进程。简单来说，进程是一个正在执行的程序。一个或多个线程在一个进程内运行。线程是操作系统为其分配处理器时间的基本单元。现在，可以采用两种方法进行并行编程：\n\
  \n*   通过线程运行代码\n*   通过多进程运行代码\n\n多个“任务”可以被提交给不同的线程。任务可以被视为单个进程的“子任务”。线程通常可以访问相同的内存区域（即共享内存）。这种方法需要适当的同步以避免冲突。例如，如果两个进程同时希望写入同一个内存位置，冲突将导致错误。因此，一种更安全的方法是将多个进程提交到完全独立的内存位置（即分布式内存）。在这种情况下，每个进程完全独立于其他进程运行。`multiprocessing`\
  \ 模块（`https://docs.python.org/2/library/multiprocessing.html`）提供了一种简单的方法，将进程分配给执行类似任务的代码部分，以便它们可以以并行方式执行。例如，对大型数据集进行排序操作可以以并行方式执行以减少时间。对不同数据点进行的类似数学计算也可以以并行方式执行。\n\
  \n## 10.10 总结\n\n我们讨论的 Python 的各种特性证明，它是科学任务一体化解决方案的一个有价值的选择。由于 Python 是开源的，大量的库有助于减少开发时间和成本。能够连接到各种类型的数据库、不同配置的硬件以及互联网上的资源，使得\
  \ Python 成为科学计算的首选方案。在本章中，我们并没有逐一说明用于数值计算和一般科学工作的各个模块的用法，而是由于一本书的篇幅限制，涵盖了各种功能。\n\
  \n在本书中，我们向初学者（特别是针对工程师和科学家）说明了 Python3 编程语言的用法。几乎所有的科学和工程分支都需要数值计算。Python 是执行数值计算的一种选择。Python\
  \ 拥有一个用于通用计算的优化函数库。此外，它还有各种用于执行专门任务的包。这使得它成为高效原型化数值计算问题的理想选择。此外，它有数千个用于特定科学任务的库，既有面向软件的，也有面向硬件的。因此，大多数大学都在向工程和科学专业的学生教授\
  \ Python。开发者社区正在呈指数级增长。在不久的将来，如果 Python 接管了世界，请不要感到惊讶！\n"
