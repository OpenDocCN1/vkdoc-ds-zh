  \n图 7-23\n使用 contour 和 contourf 函数绘制的等高线图\n\n## 7.20 其他数据绘图库\n\n`matplotlib` 的使用如此广泛，以至于新的开发者可能没有意识到还有其他绘制数据的选项。在其他模块中，有多种绘制数据的方法，根据上下文，这些方法可能具有更强大的绘图能力。其中包括\
  \ `plotly`、`mayavi` 和 `gnuplot`（仅举几例）。下面简要讨论如何使用 `plotly`，有趣的是，它可以在 Web 上绘制数据。这对于那些需要将传感器数据实时绘制在\
  \ Web 上的工程应用来说尤其有趣。\n\n\n\n### 7.20.1 `plotly`\n\n`plotly` 是一款在线分析与数据可视化工具。除了 Python\
  \ 之外，`plotly` 还可以绘制 Perl、Julia、Arduino、R 和 MATLAB 中使用的数据。网页链接 [5] 很好地展示了 `plotly`\
  \ 的功能。本质上，`plotly` 允许在线绘制和发布图表以促进协作。因此，在使用 `plotly` 库之前，你必须连接到互联网。\n\n![A458920_1_En_7_Fig24_HTML.jpg](img/A458920_1_En_7_Fig24_HTML.jpg)\n\
  \n图 7-24\n\n箭袋图\n\n首先，你需要在 `plotly` 网站 [5] 上创建一个用户账户。该账户将提供一个用户名和 API 密钥，这些需要在程序中使用。然后，你可以编写代码，既可以在\
  \ Python 终端上一次一条命令地执行，也可以编写成 Python 脚本。（参见代码清单 7-27。）\n\n```\n1  import numpy as\
  \ np\n2  import plotly.plotly as py\n3  from plotly.graph_objs import *\n4  py.sign_in('username','APIkey')\n\
  5  data = Data([Scatter(x=np.arange(100),y=np.random.randn(100), name='trace 0')])\n\
  6  fig = Figure(data=data)\n7  plot_url = py.plot(fig)\n代码清单 7-27\nplotly.py\n```\n\
  \n你需要在代码清单 7-27 的脚本中提供用户名和 API 密钥。该脚本会在用户账户的工作区中在线生成一个散点图。使用 `plotly` 提供的函数，可以非常交互式地绘制这些图表。当数据从连接实时传感器的设备流式传输时，实时数据会被实时绘制出来。这些图表还可以进一步嵌入到网站中。\n\
  \n## 7.21 总结\n\n在本章中，我们讨论了使用 Python 时可用的各种绘图选项。绘制数据的便捷性是 Python 最吸引人的特性之一。仅需几行代码就能以多种方式实现数据的可视化。可视化是数据呈现和分析的支柱，因为它能使对数据的理解更加清晰。除了简单的可视化之外，`matplotlib`\
  \ 还提供了丰富的功能，能够以期望的方式用有用的信息来装饰图表。\n\n"
- "# 8. 函数与循环\n\n## 8.1 引言\n\n函数是计算机程序的一部分，它将许多编程语句组合成一个代码块。它可以在需要时被调用。这使得编程任务可以采用模块化方法，并且由于模块易于编辑，如今在程序员中非常流行。函数接收输入参数并返回输出参数。当使用函数时，会调用函数名并传入输入参数的值。执行后，会返回一组输出参数。Python\
  \ 函数可以在程序中的任何位置定义，无论它们被调用的位置在哪里。它们甚至可以单独或组合地定义在单独的文件中。此外，根据用户的需求，它们可以被调用任意次数，或者根本不被调用。\n\
  \n## 8.2 定义函数\n\n与其他任何语言一样，Python 有其自己的定义函数的方式。以下是 Python 函数的结构：\n\n```\n1  def\
  \ function_name(parameter_1, parameter_2, ...):\n2    \"\"\"描述性字符串\"\"\"\n3    #\
  \ 关于下面语句的注释\n4    语句\n5    return 返回参数\n```\n\n如你所见，一个 Python 函数由三部分组成：\n\n1.  头部：以关键字（`def`）开头，以冒号（`:`）结尾\n\
  2.  描述性字符串：描述函数用途的字符串，可以通过 `help()` 函数访问\n3.  主体：头部下方一组缩进（通常为四个空格）的 Python 语句\n\n\
  ### 8.2.1 函数名\n\n函数名遵循与 Python 中变量名相同的规则。给函数起一个与其描述相关且简短的名字是一个好主意。\n\n### 8.2.2\
  \ 描述性字符串\n\n定义函数的一个基本部分是以字符串形式定义其内部工作细节。当使用 `help()` 时，这个描述性字符串会显示给用户，以便用户理解函数及其用法。使用描述性字符串不是强制功能，但作为良好的编程实践，建议使用。由于描述应尽可能详细，因此它构成了一个多行字符串。多行字符串可以用三引号括起来书写。即使描述只有一行，也可能需要打印单引号或双引号来强调某个单词或短语。因此，在定义描述性字符串时，强制要求使用三引号。\n\
  \n### 8.2.3 缩进的语句块\n\n为了定义属于函数一部分的语句块，使用缩进作为标记。在定义函数的第一条语句之后缩进的语句，属于该函数将要执行的语句体。当一条语句没有缩进时，函数就结束了。\n\
  \n定义函数名的规则与定义变量名的规则相同。重要的是要用功能相关的名称来命名它们，以便在需要时易于回忆。\n\n例如，如代码清单 8-1 所示的 `fn-hello.py`，它不接受任何输入参数，仅执行打印字符串\
  \ `Hello world` 的语句。\n\n```\n1  def greet():\n2      '''\n3      greet() 每次被调用时，\n\
  4      仅用字符串 \"Hello World!\" 打招呼\n5      '''\n6      print(\"Hello world!\")\n\n\
  8  greet()\n代码清单 8-1\nfn–hello.py\n```\n\n运行文件 `fn-hello.py` 会产生以下输出：\n\n```\n1\
  \  >>>python fn−hello.py\n2  >>>Hello World!\n```\n\n### 8.2.4 返回语句\n\n当函数返回参数时，它并不总是需要打印该参数。返回可以是除了简单地在屏幕上打印之外的许多其他类型的操作。返回可以包括将变量或其值传递给另一个函数和/或变量、生成代码/数据文件、生成图表和/或将函数以图形格式存储为文件。Python\
  \ 文件 `fn-sq.py` 打印前 10 个整数的平方，如代码清单 8-2 所示。\n\n```\n1  def square(x):\n2      '''\n\
  3      square() 对输入值求平方\n4      必须只使用数值数据类型\n5      以避免出错\n6      '''\n7      return\
  \ x*x\n\n9  for i in range(10):\n10      squared_i= square(i)\n11      print(i,\
  \ squared_i)\n代码清单 8-2\nfn–sq.py\n```\n\n以下是运行该程序的结果：\n\n```\n1  >>>0 0\n2  1 1\n\
  3  2 4\n4  3 9\n5  4 16\n6  5 25\n7  6 36\n8  7 49\n9  8 64\n10  9 81\n```\n\n这里，函数\
  \ `square` 在一个“for 循环”内部被调用，该循环将变量 `i` 的值从 1 递增到 10（由内置函数 `range()` 生成）。`for` 循环结构将在第\
  \ 8.6 节讨论。\n\n## 8.3 多输入与多输出函数\n\n一个函数可以输入并返回任意数量的参数，如代码清单 8-3 所示。\n\n```\n1  def\
  \ sum(a,b):\n2      '''\n3      sum() 接收两个输入并生成\n4      一个包含输入及其和的元组\n5      '''\n\
  6      c = a+b\n7      return a,b,c\n\n9   results = sum(100,102)\n10  print(results)\n\
  代码清单 8-3\ndef–multi.py\n```\n\n执行结果如下：\n\n```\n1  >>>(100, 102, 202)\n```\n\n##\
  \ 8.4 命名空间\n\n当我们在程序中调用一个函数时，Python 会创建一个命名空间来在该函数内工作。命名空间是存储名称到对象映射信息的容器。由于可以在主程序中定义多个函数，因此多个命名空间可以同时独立存在。它们可以包含相同的变量名。因此，必须定义一个层次结构来解决冲突。这由作用域规则定义。\n\
  \n\n\n### 8.4.1 作用域规则\n\n`作用域`决定了对象的工作范围——换句话说，即对象在何处可以被访问以进行计算，在何处不能。目前已经清楚，在函数内部定义的变量被定义为局部变量，而在主程序中定义的变量是全局变量，可以在任何地方被访问。Python\
  \ 代码 `namespace.py` 更好地展示了这一概念，如代码清单 8-4 所示。\n\n```\n1  # Python 代码，用于演示命名空间和作用域的概念\n\
  2  # namespace and scope\n3  i = 1\n\n5  def my_function1():\n6      i = 2\n7  \
  \    print(\"my_function()1 作用域中 i 的值是\", i )\n\n9  def my_function2():\n10    \
  \  i = 3\n11      print(\"my_function()2 作用域中 i 的值是\", i )\n\n13  print('全局作用域中\
  \ i 的值是', i )\n14  my_function1()\n15  print('全局作用域中 i 的值是', i )\n16  my_function2()\n\
  17  print('全局作用域中 i 的值是', i )\n代码清单 8-4\nnamespace.py\n```\n\n结果如下：\n\n```\n1  value\
  \ of i in global scope is’, 1\n2  value of i in my function()1 scope is’, 2\n3 \
  \ value of i in global scope is’, 1\n4  value of i in my function()2 scope is’,\
  \ 3\n5  value of i in global scope is’, 1\n```\n\n在代码 `namespace.py` 中，名为 `i` 的变量被赋予了三个值：\n\
  \n1.  `i=1` 在主程序中\n    *   此变量的作用域是全局的。（即使调用了其他函数，它在整个程序中也保持不变。）\n2.  `i=2` 在名为\
  \ `my_function1` 的函数内\n    *   此变量的作用域是局部的，即在函数 `my_function1` 内部。在函数外部，它将失去定义。\n\
  3.  `i=3` 在名为 `my_function2` 的函数内\n    *   此变量的作用域是局部的，即在函数 `my_function2` 内部。在函数外部，它将失去定义。\n\
  \n作用域的层级结构遵循 LEGB 规则。LEGB 代表 局部→闭包→全局→内建。\n\n这本质上规定了 Python 解释器在找到名称到对象的映射之前，搜索不同层级命名空间的顺序。以下是四个层级的命名空间：\n\
  \n*   **局部**：在用户定义的函数或类方法内部。\n*   **闭包**：在封闭函数内部，即当一个函数被包裹在另一个函数内部时。\n*   **全局**：表示最顶层，即解释器正在执行的主\
  \ Python 程序。\n*   **内建**：这些是 Python 解释器为自己保留的特殊名称。\n\n如果在任何命名空间中都找不到某个名称，则会引发 `NameError`。\n\
  \n## 8.5 循环的概念\n\n在执行重复性任务时，使用计算机进行计算的主要优势在于它们比人类计算得更快。术语“循环”与重复计算相关联，因为用户定义的变量为值命名，并且计算机重复地按照由条件生成的指定序列来变换变量值。例如，用户可能想要计算前\
  \ 10 个整数的平方根。要执行此计算，用户需要对前 10 个整数的列表（可以通过 `range()` 函数生成）运行 `sqrt()` 函数。整数列表可以存储在一个变量中，并且可以将此变量放入循环中，以逐个执行查找列表中每个成员的平方根的操作。\n\
  \n## 8.6 for 循环\n\n当需要对给定的数据集执行相同的操作时，`for` 循环是一个不错的选择。例如，假设我们只想打印列表中的各个成员。可以使用代码清单\
  \ 8-5 中的 Python 代码。\n\n```\n1  #Python 程序，用于说明 for 循环的用法\n2  #of for loop\n3  a\
  \ = ['a',1,3.14,'name']\n\n5  for item in a:\n6      print(\"当前项目是: \",item)\n代码清单\
  \ 8-5\nListMembers.py\n```\n\n输出打印在终端上，如下所示：\n\n```\n1  当前项目是: a\n2  当前项目是: 1\n\
  3  当前项目是: 3.14\n4  当前项目是: name\n```\n\n值得注意的是，大多数编程语言使用逻辑语句来定义运行代码的初始化、条件和增量。Python\
  \ 程序采用了一种不同的策略，即数组使用一个条件，而循环只是简单地遍历数组的每个成员。这对 Python 程序很重要，因为 Python 是一种解释型语言，本质上运行速度较慢。每次循环想要前进一步时都花时间检查条件，在计算上是代价高昂的。因此，Python\
  \ 以这样一种方式设计计算：一旦根据定义的条件形成了列表/数组，循环就可以遍历列表/数组的成员。通过这种方式，可以减少总体计算时间。\n\n作为一个理解 `for`\
  \ 循环在数值计算中使用的例子，假设我们想要找到偶数勾股数，使得\n\n![$$ {a}²+{b}²={c}² $$](img/A458920_1_En_8_Chapter_Equa.gif)\n\
