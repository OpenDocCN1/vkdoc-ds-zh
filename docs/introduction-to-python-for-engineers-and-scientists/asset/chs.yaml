  \n在示例 Python 代码 `pytha.py` 中，已经使用了 `if` 语句。它简单地检查一个条件，如果条件结果为布尔值 `True`，则执行循环；如果条件结果为布尔值\
  \ `False`，则退出循环。当需要按顺序检查多个条件时，会使用 `if-else` 循环，其中 `if` 条件结果为布尔值 `True` 时执行语句。否则，检查下一个条件并递归执行类似操作。此操作会一直执行，直到所有条件的结果都返回布尔值\
