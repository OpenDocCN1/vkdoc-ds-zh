  \ last):\n35  File \"\", line 1, in \n36  TypeError: unsupported operand type(s)\
  \ for -: 'list' and 'int'\n37  >>> 'hello' - 3\n38  Traceback (most recent call\
  \ last):\n39  File \"\", line 1, in \n40  TypeError: unsupported operand type(s)\
  \ for -: 'str' and 'int'\n```\n\n如果你从加法的角度来理解数学乘法：`2 * 5 = 2 + 2 + 2 + 2 + 5`，那么\
  \ `*` 在字符串和列表上的行为就很容易理解了。因此，与 `m` 相乘意味着相加 `m` 次。\n\n## 5.5 更改和定义数据类型\n\n对象的数据类型可以根据其定义进行更改。函数\
  \ `int()` 通过将输入舍入到最接近的整数来将其转换为整数。类似地，`float()` 将答案的类型变为浮点数。所有整数都可以变成浮点数，就像 `4` 也可以定义为\
  \ `4.0` 一样。`str()` 函数将其参数转换为字符串对象。值得注意的是，`int()` 和 `float()` 函数无法将字符串输入转换为其数据类型。另一方面，将数字输入提供给\
  \ `str()` 函数会将其数据类型转换为字符串。它不再是一个数字，而是表现得像一个字符。以下 Python 代码演示了这一行为：\n\n```\n1  >>>\
  \ int(4.2345) # 舍入为整数 4\n2  4\n3  >>> int(4.7345) # 舍入为整数 4\n4  4\n5  >>> float(4)\
  \ # 转换为浮点数 4.0\n6  4.0\n7  >>> float(0.4) # 保持为浮点数 0.4\n8  0.4\n9  >>> str(4) #\
  \ 转换为字符串 '4'\n10  '4'\n11  >>> str(4.0) # 转换为字符串 '0.4'\n12  '4.0'\n13  >>> a = str(4)+str(4.0)\
  \ # 字符串 '4' 和 '0.4' 被连接\n14  >>> a\n15  '44.0'\n16  >>> float ('sandeep')\n17  Traceback\
  \ (most recent call last):\n18  File \"\", line 1, in \n19  ValueError: could not\
  \ convert string to float: 'sandeep'\n20  >>> int('sandeep')\n21  Traceback (most\
  \ recent call last):\n22  File \"\", line 1, in \n23  ValueError: invalid literal\
  \ for int() with base 10: 'sandeep'\n```\n\n### 5.5.1 运算顺序\n\nPython 遵循 PEMDAS（括号、指数、乘法、除法、加法、减法）运算顺序。因此，在涉及多个算术运算符的复杂计算中，实体按以下顺序计算：\n\
  \n1.  括号\n2.  指数\n3.  乘法\n4.  除法\n5.  加法\n6.  减法\n\n这可以通过以下 Python 代码进行测试：\n\n```\n\
  1  >>> 5 + (6−5) ∗ (10 / (−1 / 9)∗∗2)\n2  815.0\n3  >>> 5 ∗ 5 + 5 − 4 ∗∗ 2\n4  14\n\
  ```\n\n### 5.5.2 比较运算符\n\n逻辑运算符对于比较对象至关重要。用于比较的运算符称为逻辑运算符。表 5-3 说明了这些运算符的行为。\n\n\
  逻辑运算符的结果是两个二进制对象之一，恰当地命名为 `True` 和 `False`。在某些编程语言中，二进制运算符表示为 `1` 和 `0`。它们也可以进行相等性比较：\n\
  \n**表 5-3** 比较运算符\n\n| 运算符符号 | 运算符含义 | 示例 |\n| --- | --- | --- |\n| `==` | 等于 |\
  \ `1==1` 为 `True`，`1==2` 为 `False` |\n| `!=` | 不等于 | `1!=1` 为 `False`，`1==2` 为 `True`\
  \ |\n| `<>` | 不等于 | `1==1` 为 `False`，`1==2` 为 `True` |\n| `<` | 小于 | `1<2` 为 `True`，`2<1`\
  \ 为 `False` |\n| `>` | 大于 | `1>2` 为 `False`，`2>1` 为 `True` |\n| `<=` | 小于等于 | `1<=1`\
  \ 为 `True`，`1<=2` 为 `True` |\n| `>=` | 大于等于 | `1>=1` 为 `True`，`1>=2` 为 `False` |\n\
  \n```\n1  >>> not True\n2  False\n3  >>> a = True\n4  >>> b = False\n5  >>> a and\
  \ b\n6  False\n7  >>> a or b\n8  True\n9  >>>1 >= 2 == 2 >= 1\n10  False\n11  >>>1\
  \ >= 2\n12  False\n13  >>>2 >= 1\n14  True\n15  >>>False == True\n16  False\n17\
  \  >>>False > True\n18  False\n19  >>>False < True\n20  True\n```\n\n## 5.6 成员运算符\n\
  \n成员运算符检查变量的一个或多个值是否是指定序列的成员。如果找到该成员，则返回布尔值 `True`；否则返回 `False`：\n\n```\n1  >>>\
  \ 'hello' in 'hello world'\n2  True\n3  >>> 'name' in 'hello world'\n4  False\n\
  5  >>> a=3\n6  >>> b=[1,2,3,4,5]\n7  >>> a in b\n8  True\n9  >>> 10 in b\n10  False\n\
  ```\n\n运算符 `in` 广泛用于检查循环条件。它是运行循环最便捷的方式之一。首先，根据定义的条件/公式构建一个列表，然后运行循环直到条件满足。这种方法将在后续章节中变得更加清晰。\n\
  \n## 5.7 身份运算符\n\n为了检查两个值是否指向同一类型的对象，可以使用身份运算符。如果运算符两侧的对象相同，则返回布尔值 `True`，否则返回 `False`：\n\
  \n```\n1  >>> 1 is 1 # 两者都是整数类型\n2  True\n3  >>> 1 is 1.0 # 1 是 int 类型，1.0 是 float\
  \ 类型\n4  False\n5  >>> 1 is 2 # 两者都是整数类型\n6  True\n7  >>> '1' is 1 # '1' 是 str 类型，另一个是\
  \ int 类型\n8  False\n9  >>> '1' is 1.0 # '1' 是 str 类型，另一个是 float 类型\n10  False\n\
  ```\n\n`is not` 运算符是对 `is` 运算符结果的否定。\n\n```\n1  >>> 1 is not 1.0\n2  True\n3  >>>\
  \ 1 is not 1\n4  False\n```\n\n\n\n## 5.8 位运算符\n\n数据在计算机中以位（bit）的形式存储。如果我们能直接对位进行操作，将拥有极大的灵活性和快速的计算能力。然而，人类很难理解这一概念，因为我们习惯于使用十进制而非二进制格式定义的数值。表\
  \ 5-4 列出了位运算符。\n\n表 5-4\n\n位运算符\n\n| 位运算符 | 描述 |\n| --- | --- |\n| `>>` | 按位左移 |\n\
  | `<<` | 按位右移 |\n| `&` | 按位与 |\n| `&#124;` | 按位或 |\n| `˜` | 按位取反 |\n\n可以使用 `bin()`\
  \ 函数来显示一个 `int` 对象的二进制组成，如下所示：\n\n```\n1  >>> bin(1)\n2  '0b1'\n3  >>> bin(10)\n\
  4  '0b1010'\n5  >>> bin(100)\n6  '0b1100100'\n7  >>> bin(1000)\n8  '0b1111101000'\n\
  ```\n\n当打印一个整数的二进制表示时，`0b` 表示这是一个二进制表示。现在，理解以下内容就很容易了：\n\n![$$ {1010}_2=1\\times\
  \ {2}³+0\\times {2}²+1\\times {2}¹+0\\times {s}⁰ $$](img/A458920_1_En_5_Chapter_Equ1.gif)\n\
  \n(5.1)\n\n![$$ =8+0+2+0={10}_{10} $$](img/A458920_1_En_5_Chapter_Equ2.gif)\n\n\
  (5.2)\n\n因此，`1010[2] = 10[10]`。十进制整数 `10` 以二进制数 `1010` 的形式存储。位运算符在位的级别上对这个数进行操作。所以，按位左移运算符会将所有位的值向左移动一位。同样地，按位右移运算符会将位的值向右移动一位。这将产生一个新的二进制表示，并等同于一个新的十进制数。例如：\n\
  \n```\n1  >>> bin(100)\n2  '0b1100100'\n3  >>> 100 >> bin(200)\n6  '0b11001000'\n\
  7  >>> 100>>1\n8  50\n9  >>> bin(50)\n10  '0b110010'\n11  >>> 100 >> bin(400)\n\
  14  '0b110010000'\n15  >>> 100 >> 2\n16  25\n17  >>> bin(25)\n18  '0b11001'\n```\n\
  \n`<<` 将 `100[100]`（`1100100[2]`）的所有位向左移动，并用新的 `0` 填充空位，从而得到 `11001000[2]`，这等同于\
  \ `200[10]`。`>>` 将 `100[100]`（`1100100[2]`）的所有位向右移动，得到 `110010[2]`，这等同于 `50[10]`。接下来，位被移动了两位。\n\
  \n第 4 章中定义的逻辑运算符也可以在这里使用。Python 的布尔值 `True` 等同于 `1`，而 `0` 等同于 Python 的布尔值 `False`。因此，表\
  \ 4-1、4-2、4-3 和 4-4 可以重新设计为下表：\n\n*   仅当两个输入都为 `1` 时，**与**（AND）的结果才为 `1`；否则为 `0`。\n\
  *   只要有一个或两个输入为 `1`，**或**（OR）的结果就为 `1`；否则为 `0`。\n*   仅当恰好有一个输入为 `1` 时，**异或**（XOR）的结果才为\
  \ `1`；否则为 `0`。\n*   仅当输入为 `0` 时，**非**（NOT）的结果才为 `1`；否则为 `0`。\n\n真值表有助于理解它们的操作。\n\
  \n通过使用表 5-5，你可以理解以下 Python 代码：\n\n表 5-5\n\nAND、OR、NOT 和 XOR 运算符的真值表\n\n| AND | 0\
  \ | 1 |\n| 0 | 0 | 0 |\n| 1 | 0 | 1 |\n| OR | 0 | 1 |\n| 0 | 0 | 1 |\n| 1 | 1 |\
  \ 1 |\n| XOR | 0 | 1 |\n| 0 | 0 | 1 |\n| 1 | 1 | 0 |\n| NOT | 0 | 1 |\n|   | 1 |\
  \ 0 |\n\n```\n1  >>> 20 and 200\n2  200\n3  >>> 20 or 200\n4  20\n5  >>> bin(20)\n\
  6  '0b10100'\n7  >>> bin(200)\n8  '0b11001000'\n```\n\n当我们写 `20` 或 `200` 以及 `20`\
  \ 和 `200` 时，它们的二进制表示会被操作。结果也是二进制数，会被转换回整数并在 REPL 中显示。\n\n### 5.8.1 使用位运算\n\n位运算在嵌入式系统中处理硬件寄存器时很有用。每个处理器都使用一个或多个寄存器（通常是特定的内存地址）来控制中断是启用还是禁用。当中断启用时，可以传递信号。通过设置特定中断的使能位，并且最重要的是不修改寄存器中的任何其他位，来启用中断。当中断与数据流通信时，它通常会在状态寄存器中设置一个位，以便单个服务例程可以确定中断的确切原因。测试各个位可以快速解码中断源。这就是位运算派上用场的地方。移位运算符用于根据公式移动位，而\
  \ `AND` 和 `OR` 操作用于检查特定位位置的位状态。同样的概念也用于更改系统文件权限。在 Linux 文件系统中，每个文件都有一个称为其模式（mode）的数字，它指示了访问该文件的权限。可以在程序中检索这个整数以了解文件的权限状态。例如，`if\
  \ ((mode & 128) != 0) {<do this>}` 将通过检查在 128 位系统中相应的位是否为 `0` 来检查模式。位运算也因其运算速度而受到青睐，因为它们直接对内存中的位进行操作。\n\
  \n## 5.9 总结\n\n运算符在计算中扮演着非常重要的角色，因为它们为定义计算路径提供了基础。所有数学函数都可以通过单个运算符或它们的组合来表达。对于一个服务于科学、工程、商业和艺术等多个领域的编程语言来说，需要许多不同类型的运算符。Python\
  \ 现在被应用于生活的各个方面，并且随着丰富的内置运算符和模块级运算符库而日趋成熟。\n\n"
- "# 6. 数组\n\n## 6.1 引言\n\n在科学计算中，经常需要将一系列数字作为一个整体进行操作。`list` 数据类型存储一个值的序列。`list`\
  \ 的所有元素都可以通过其索引访问，但单个 `list` 元素可以属于任何数据类型。因此，需要定义一种新的对象，类似于 `list`，但只存储数值。这种数据类型被称为\
  \ `array`。这种数据类型并非内置于 Python 解释器中，而是位于 `numpy` 模块中。\n\n`numpy` 模块拥有一个名为 `array`\
  \ 的独特对象类。它只包含一种数据类型的成员元素。使用数组存储数值的概念催生了基于数组计算的强大思想。这种方法可以追溯到矩阵代数。矩阵也是数字的集合。与矩阵类似，数组可以是多维的，并且可以通过与数学矩阵相同的方式定义的运算符进行操作。使用矩阵，可以一次性解决涉及方程组的问题（这些方程甚至可以相互耦合）。利用元素索引的方法，可以访问特定元素进行操作。利用切片的概念，可以根据需要改变数组的维度。通过作用于该对象的运算符，可以实现数学公式。在本章中，我们将讨论数组在数学计算中的使用。\n\
  \n\n\n## 6.2 numpy\n\n`numpy`包包含各种可用于数值计算的项目——因此得名 numerical Python。NumPy 起源于`Numeric`，最初由\
  \ Jim Hugunin 创建，并有多位其他开发者的贡献。Travis Oliphant 于 2005 年创建了 NumPy，将竞争产品`Numarray`的特性整合到`Numeric`中，并进行了大量修改。`numpy`在开源许可下发布。本章代码已在\
  \ 1.12.1 版本上测试通过。\n\n与任何其他 Python 模块一样，`numpy`可以通过简单的`pip`程序在 Ubuntu 上安装：\n\n```\n\
  pip install numpy\n```\n\n`numpy`预装在 Anaconda IDE 中，因此建议 Windows 和 Mac OS X 用户使用\
  \ Anaconda IDE 进行工作。\n\n要使用`numpy`，可以导入它并检查版本号：\n\n```\n1  >>> import numpy\n2 \
  \ >>> print (numpy.version.version)\n3  1.12.1\n```\n\n第 1 行导入整个名为`numpy`的模块供我们使用。第\
  \ 2 行使用`version`函数，该函数进一步使用`version`函数来查找系统上安装的`numpy`版本。鼓励用户检查自己的 Python 版本。\n\n\
  同样重要的是要注意，导入模块是使用它的必要条件，但一旦在会话中导入，每次使用时无需再次导入。但是，如果会话重新启动，则必须重新导入。对于本章，可以导入一次，然后编写代码，但如果用户关闭\
  \ Python 会话并重新启动，则必须再次导入。\n\n## 6.3 ndarray\n\n`ndarray`是`numpy`的主要对象，它是同质的（其所有成员元素仅包含一种数据类型）。元素使用`numpy`的`array()`函数创建。此函数需要一个列表作为输入。元素由正整数元组索引：\n\
  \n```\n1  >>> a = [1,2,3]\n2  >>> a\n3  [1, 2, 3]\n4  >>> type(a)\n\n6  >>> import\
  \ numpy\n7  >>> b = numpy.array([1,2,3])\n8  >>> b\n9  array([1, 2, 3])\n10  >>>\
  \ type(b)\n\n12  >>> b.dtype\n13  dtype('int64')\n14  >>> c = numpy.array([1.0,\
  \ 2.0, 3.0])\n15  >>> c\n16  array([ 1.,  2.,  3.])\n17  >>> c.dtype\n18  dtype('float64')\n\
  ```\n\n此示例展示了`lists`和`arrays`在`numpy`中的创建方式不同。`numpy`对象`array`接受一个列表作为输入。元素的数据类型可以由\
