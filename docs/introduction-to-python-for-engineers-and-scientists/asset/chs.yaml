  \ # array of empty strings\n14  array([['', '', '', ''],\n15  ['', '', '', ''],\n\
  16  ['', '', '', '']],\n17  dtype='<U1')\n```\n\n在矩阵计算初始化为零值时，`zeros()`函数被广泛使用。\n\
  \n### 6.4.2 ones( )\n\n要创建一个所有元素都为 1 的数组，我们使用`ones()`函数：\n\n```\n1  >>> numpy.ones((3,4))\
  \ # array of float values\n2  array([[ 1.,  1.,  1.,  1.],\n3  [ 1.,  1.,  1., \
  \ 1.],\n4  [ 1.,  1.,  1.,  1.]])\n5  >>> numpy.ones((3,4),dtype=int) # array of\
