  ```\n\n该文件生成的图形如图 7-16 所示。\n\n![A458920_1_En_7_Fig16_HTML.jpg](img/A458920_1_En_7_Fig16_HTML.jpg)\n\
  \n图 7-16\n\n绘制 sin(x) 和 sin(2x)\n\n了解文件大小和图形分辨率对于在离线/打印和在线媒体上发布非常重要。当程序中没有设置用于设定图形分辨率和文件大小的参数时，将使用默认值。这些默认值可以通过以下代码获知：\n\
  \n```\n1  >>>import matplotlib as ml\n2  >>>ml.rcParams['figure.figsize']\n3  [8.0,\
  \ 6.0]\n4  # 默认图形大小为 8 X 6 英寸\n5  >>>ml.rcParams['savefig.dpi']\n6  100.0\n7  #\
  \ 默认图形分辨率为 100 dpi\n```\n\n由于创建了一个 8 × 6 英寸、100 dpi（每英寸点数/像素）的图形，因此使用 `savefig()`\
  \ 默认会保存一个 800 × 600 像素的图像。当此文件被定向到计算机图形终端进行显示时，长度单位将被忽略，直接显示像素。如果文件被定向到打印介质（如打印机或绘图仪），则长度参数和\
  \ DPI 将决定图形大小和分辨率。\n\n\n\n## 7.14 在 Web 应用服务器上显示图表\n\n在互联网连接的时代，许多问题需要在网页上绘制交互式图表。这需要将不同类型的图表绘制在用不同语言编写、在不同环境下运行的网页上。需要注意的是，`matplotlib`\
  \ 需要图形用户界面，而这又需要 X11 连接。因此，在动态更新由 `matplotlib` 生成的图表之前，必须在 Web 应用服务器上开启此功能。通常，在计算机上绘制图表涉及两个方面。使用一组命令编写脚本被称为前端任务，这需要后端工作的支持。后端负责与系统的图形功能进行交互，以生成所需格式的图表。图表可以使用诸如\
  \ `pygtk`、`wxpython`、`tkinter`、`qt4` 和 `macosx` 等后端进行交互式绘制，也可以使用诸如 `PNG`、`SVG`、`PS`\
  \ 和 `PDF` 等后端进行非交互式绘制（永久保存为计算机上的文件）。后者也称为硬拷贝后端。\n\n配置后端有两种途径：\n\n1.  可以编辑安装目录下的\
  \ `matplotlibrc` 文件，将 `backend` 参数设置为特定值，例如以下示例：\n\n    ```\n    1  backend : WXAgg\
  \   # 使用带有 antigrain (agg) 渲染的 wxpython\n    ```\n\n    在 LINUX 系统上，`matplotlibrc`\
  \ 位于 `/etc/matplotlibrc`。\n2.  使用 `use()` 临时设置特定后端：\n\n    ```\n    1  >>>import\
  \ matplotlib\n    2  >>>matplotlib.use('PDF')   # 默认生成 PDF 文件作为输出\n    ```\n\n选择哪种方式来设置后端取决于程序的应用场景。如果程序旨在临时将图表保存为非交互式的\
  \ `PDF` 文件，可以使用方法二，该方法会一直生效，直到另一个程序更改了后端设置。设置后端必须在 `import matplotlib.pyplot` 或\
  \ `import matplotlib.pylab` 之前完成。有关为各种应用使用不同后端的更多信息，请访问 [`http://matplotlib.org/faq/usage_faq.html#what-is-a-backend`](http://matplotlib.org/faq/usage_faq.html%23what-is-a-backend)。对于\
  \ Web 应用服务器，将后端设置为 `WXAgg`、`GTKAgg`、`QT4Agg` 和 `TkAgg` 即可工作。\n\n与默认保存为白色背景的图形不同，保存透明图形的一种方法是设置\
  \ `transparent=TRUE`。当图形需要嵌入到具有预定义背景颜色/图像的网页中时，这一点尤其重要。\n\n另一种将交互模式设置为 `ON` 或 `OFF`\
  \ 的方法是分别包含命令 `matplotlib.pyplot.ion()` 和 `matplotlib.pyplot.ioff()`。\n\n### 7.14.1\
  \ IPython 和 Jupyter Notebook\n\n在使用 `IPython` 时，如果你希望通过在 `IPython` 命令提示符下发出命令来动态更改图表，只需在\
  \ UNIX 终端上发出一个命令：\n\n```\n1  $ ipython −pylab\n```\n\n这会在 `IPython` 中启用一种特殊的 `matplotlib`\
  \ 支持模式，该模式会查找配置文件以确定后端，并在需要时激活适当的 GUI 线程模型。它还会设置 `Matplotlib` 交互模式，以便 `show()` 命令不会阻塞交互式\
  \ `IPython` shell。\n\n在 `Jupyter Notebook` 环境中工作时，发出以下命令：\n\n```\n1  $ jupyter notebook\
  \ −−pylab=inline\n```\n\n此命令会内联生成图形，即在调用绘图命令的代码行之间的代码主体内生成图形。否则，图形会弹出到单独的窗口中。内联模式在设计教学材料时非常有用。但是，在与相关人员共享之前，应确保用户的计算机上安装了编码所需的后端和依赖项。\n\
  \n或者，你可以将 `%matplotlib inline` 作为魔法命令之一写在第一个单元格中，以便所有绘图都定向显示在 Web 浏览器界面的框架内。在大多数情况下，这是首选方法，尤其是在教授基于\
  \ Python 的绘图时。\n\n## 7.15 在对象模式下使用 matplotlib\n\n使用 `matplotlib` 的 Pythonic 方式是在对象模式下使用它，在这种模式下，显式定义对象可以实现终极定制。为此，你必须将图形的每个元素定义为一个对象，并使用其属性进行定制。用于此目的的三个基本对象的层次结构如下：\n\
  \n1.  `FigureCanvas`：`Figure` 实例的容器类\n2.  `Figure`：`axes` 实例的容器类\n3.  `Axes`：坐标轴是用于容纳各种绘图特征（如线条、刻度、曲线和文本）的矩形区域。\n\
  \n在以面向对象模式使用 `matplotlib` 时，需要指定一个 `FigureCanvas`，它包含 `figure(s)`，而 `figure(s)`\
  \ 又包含 `axes`，可以在 `axes` 上实现各种绘图功能。整个过程允许进行任何可以想象到的定制。清单 7-17 解释了这一概念。\n\n```\n1\
  \  import matplotlib.pyplot as plt\n2  fig = plt.figure()\n3  # 变量 fig 存储 \"figure\"\
  \ 实例\n4  ax1 = fig.add_subplot(221)\n5  # 变量 ax1 存储位于 2 x 1 矩阵中第一个位置的 figure 的子图\n\
  6  ax1.plot([-1, 1, 4], [-2, -3, 4]);\n7  # 调用 ax1 并为其赋予 plot 函数。\n8  # plot 函数携带两个列表，分别提供图形的\
  \ x 轴和 y 轴点\n9  ax2 = fig.add_subplot(222)\n10  ax2.plot([1, -2, 2], [0, 0, 2]);\n\
  11  # 与 ax1 逻辑相同\n12  ax3 = fig.add_subplot(223)\n13  ax3.plot([10, 20, 30], [10,\
  \ 20, 30]);\n14  ax4 = fig.add_subplot(224)\n15  ax4.plot([-1, -2, -3], [-10, -20,\
  \ -30]);\n16  plt.show()\n17  # 在计算机终端上显示图形\n清单 7-17\nobjPlot.py\n```\n\n生成的图形如图\
  \ 7-17 所示。\n\n\n\n## 7.16 对数坐标图\n\n许多工程数据会使用对数刻度，尤其是当数据变化导致观测变量值出现数量级变化时。Python\
  \ 提供了绘制对数坐标图的功能，如代码清单 7-18 所示。\n\n![A458920_1_En_7_Fig17_HTML.jpg](img/A458920_1_En_7_Fig17_HTML.jpg)\n\
  \n图 7-17\n\n使用对象模式绘图\n\n```\n1  import matplotlib.pyplot as plt\n2  import numpy\
  \ as np\n\n4  x = np.arange(0., 10, 0.01)\n\n6  fig = plt.figure()\n\n8  ax1 = fig.add_subplot(221)\n\
  9  y1 = np.log(x)\n10  ax1.plot(x, y1);\n11  ax1.grid(True)\n12  ax1.set_ylabel('$y\
  \ = log(x)$');\n13  ax1.set_title('y-axis in log scale')\n\n15  ax2 = fig.add_subplot(222)\n\
  16  y2 = np.sin(np.pi*x/2.)\n17  ax2.semilogx(x, y2, basex = 3);\n18  ax2.grid(True)\n\
  19  ax2.set_title('x-axis in log scale')\n\n21  ax3 = fig.add_subplot(223)\n22 \
  \ y3 = np.sin(np.pi*x/3.)\n23  ax3.loglog(x, y3, basex=2);\n24  ax3.grid(True)\n\
  25  ax3.set_ylabel('both axes in log');\n\n27  ax4 = fig.add_subplot(224)\n28  y4\
  \ = np.cos(2*x)\n29  ax4.loglog(x, y3, basex=10);\n30  ax4.grid(True)\n\n32  plt.show()\n\
  代码清单 7-18\nlog.py\n```\n\n定义了以下坐标轴实例：\n\n1. `ax1` 使用 ![$$ y=\\mathit{\\log}\\kern0.125em\
  \ (x) $$](img/A458920_1_En_7_Chapter_IEq1.gif) [。]\n2. `ax2` 使用 ![$$ y=\\mathit{\\\
  sin}\\left(\\frac{\\pi x}{2}\\right) $$](img/A458920_1_En_7_Chapter_IEq2.gif) [。]\n\
  3. `ax3` 使用 ![$$ y=\\mathit{\\sin}\\left(\\frac{\\pi x}{3}\\right) $$](img/A458920_1_En_7_Chapter_IEq3.gif)\
  \ [。]\n4. `ax4` 使用 ![$$ y=\\mathit{\\cos}(2x) $$](img/A458920_1_En_7_Chapter_IEq4.gif)\
  \ [。]\n\n生成的图形如图 7-18 所示。\n\n![A458920_1_En_7_Fig18_HTML.jpg](img/A458920_1_En_7_Fig18_HTML.jpg)\n\
  \n图 7-18\n\n使用对象模式绘图\n\n如程序 `log.py` 所示，对数值可以直接传递给 `plot()` 函数。当某个特定坐标轴需要以对数值绘制时，可以使用\
  \ `semilog()` 和 `semilogy()` 函数，并且可以定义底数索引。该特定坐标轴的值会被转换为对数刻度，然后进行绘制。当两个坐标轴都需要绘制对数值时，则需要调用\
  \ `loglog()` 函数。\n\n对数坐标图在信号处理和热力学等多个领域都有应用。本质上，只要数据发生数量级变化，使用对数坐标图就更容易观察。对数刻度是一种非线性刻度。能够改变对数函数的底数，为开发者提供了强大的工具，以便得出最有意义的结论。\n\
  \n## 7.17 在同一图形上绘制两个图，且至少有一个坐标轴不同\n\n使用 `twinx()` 和 `twiny()` 函数，可以在同一图形上使用两个 x\
  \ 轴或 y 轴来绘制两组数据点。代码清单 7-19 中给出了一个使用 `twinx()` 的示例，其中 x 轴被孪生，以生成共享相同 x 轴数据点的两个数据集的图形。\n\
  \n```\n1  import matplotlib.pyplot as plt\n2  import numpy as np\n\n4  x = np.arange(0.,\
  \ 100, 1);\n5  y1 = x**2;\n6  # y1 定义为 x 值的平方\n7  y2 = np.sqrt(x);\n8  # y2 定义为\
  \ x 值的平方根\n\n10  fig = plt.figure()\n11  ax1 = fig.add_subplot(111)\n12  ax1.plot(x,\
  \ y1, 'bo');\n13  ax1.set_ylabel('$x^{2}$');\n14  ax2 = ax1.twinx() # 使用 twinx()\
  \ 函数显示孪生的 x 轴\n15  ax2.plot(x, y2, 'k+');\n16  ax2.set_ylabel('$\\sqrt{x}$');\n\
  17  ax2.set_title('Same x axis for both y values');\n18  plt.show()\n代码清单 7-19\n\
  twinx.py\n```\n\n值得注意的是，两个不同的坐标轴实例 `ax1` 和 `ax2` 相互叠加，其中来自 `y1` 的数据分配给坐标轴实例 `ax1`，来自\
  \ `y2` 的数据分配给坐标轴实例 `ax2`。这也说明了以对象模式定义图形的强大之处。相应的图形如图 7-19 所示。\n\n![A458920_1_En_7_Fig19_HTML.jpg](img/A458920_1_En_7_Fig19_HTML.jpg)\n\
  \n图 7-19\n\n使用 `twinx()` 变量\n\n## 7.18 等高线图\n\n在某些工程应用中，等高线图成为解释说明的重要组成部分，因为它们可以根据某些相似性将数据划分为不同的区域。例如，想象从山顶俯瞰一座山，你可以用闭合的环线来定义海拔相似的区域。因此，一座山将表现为一系列环线。类似地，一个非均匀加热区域的二维地图可以看作是描绘相同温度区域的等高线。一个降雨区域可以看作是描绘不同雨滴大小区域的等高线。\n\
  \n因此，等高线也被称为等值线或等位线。术语“iso”附加在具有恒定值的数据点上，这些数据点的区域由等高线分隔。\n\n对于等高线图，你需要 x 轴、y 轴和\
  \ z 轴，其中 z 轴定义高度。具有相同高度的数据在等值线内被组合在一起。（参见代码清单 7-20。）\n\n```\n1  import matplotlib.pyplot\
  \ as plt\n2  import numpy as np\n\n4  # 定义 x、y、z 轴的数据\n5  x = np.linspace(0,1,100)\n\
  6  y = np.linspace(1,2,100)\n7  (X,Y) = np.meshgrid(x,y)\n8  z = np.sin(X)-np.sin(Y)\n\
  \n10  # 绘制等高线\n11  fig = plt.figure()\n\n13  ax1 = fig.add_subplot(211)\n14  c1\
  \ = ax1.contour(x,y,z)\n15  l1 = ax1.clabel(c1)\n16  lx1 = ax1.set_xlabel(\"x\"\
  )\n17  ly1 = ax1.set_ylabel(\"y\")\n\n20  # 绘制填充等高线\n21  ax2 = fig.add_subplot(212)\n\
  22  c2 = ax2.contourf(x,y,z)\n23  l2 = ax2.clabel(c2)\n24  lx2 = ax2.set_xlabel(\"\
  x\")\n25  ly2 = ax2.set_ylabel(\"y\")\n\n27  plt.show()\n\n29  # 绘制填充等高线\n代码清单 7-20\n\
  contour.py\n```\n\n相应的图形如图 7-20 所示。\n\n`contour()` 和 `contourf()` 函数可用于绘制未填充和已填充的等高线。简单的命令\
  \ `help(contour)` 可以提供关于设置等高线图各种参数的详细信息。\n\n## 7.19 matplotlib 中的 3D 绘图\n\n随着软件和硬件端先进计算技术的发展，在图形终端上生成交互式\
  \ 3D 图形变得更加容易。`matplotlib` 在这方面提供了相当多的选项，将在以下小节中讨论。\n\n![A458920_1_En_7_Fig20_HTML.jpg](img/A458920_1_En_7_Fig20_HTML.jpg)\n\
  \n图 7-20\n\n等高线图\n\n\n\n### 7.19.1 折线图与散点图\n\n`matplotlib` 的 `toolkits` 中包含 `mplot3D`\
  \ 类，该类提供了 `Axes3D` 对象。通过使用 `projection='3D'` 关键字，可以创建一个 `Axes3D` 对象，该对象提供了显示三维图形的屏幕区域。然后可以将\
  \ `Axes3D` 传递给一个 `figure` 对象，以将其显示为图形。如清单 7-21 所示，只需向 `plot()` 函数传递三个参数即可创建折线图。\n\
  \n```\n1  import matplotlib as mpl\n2  from mpl_toolkits.mplot3d import Axes3D\n\
  3  import numpy as np\n4  import matplotlib.pyplot as plt\n\n6  fig = plt.figure()\n\
  7  ax = fig.gca(projection='3d')\n\n9  x = np.linspace(-10*(np.pi),10*(np.pi),10e4)\n\
  10  y = np.sin(x)\n11  z = np.cos(x)\n\n13  ax.plot(x, y, z, label='$y=sin(x)$ and\
  \ $z = cos(x)$')\n14  ax.legend()\n15  ax.set_title('3D line curve')\n16  ax.set_xlabel('$x$')\n\
