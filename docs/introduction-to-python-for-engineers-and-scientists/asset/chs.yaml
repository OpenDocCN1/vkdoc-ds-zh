  ## 8.9 无限循环\n\n如果逻辑表达式始终输出布尔值 `True`，程序将永远不会停止。这些循环被称为无限循环，因为它们将花费无限的时间来执行。清单 8-9\
  \ 中所示的 Python 代码 `infinite.py` 给出了一个最简单的示例。\n\n```\n1  # 定义无限循环的程序\n2  # 按 Ctrl+C\
  \ 中断 Python REPL 的执行\n3  i=1\n4  while i==1:\n5      print(i)\n6  print(\"再见\")\n\
  清单 8-9\ninfinite–loop.py\n```\n\n由于条件始终为真，程序将永远不会停止显示 `i` 的值（即 1）。它永远不会打印代码的最后一行。在\
  \ Linux 机器上，您需要按 `CTRL+C` 来中断执行并返回命令行。\n\n## 8.10 `while-else`\n\n在 `while` 循环中，如果条件产生布尔值\
  \ `True`，则执行语句。在此结构中使用 `else` 语句允许用户在条件返回布尔值 `False` 时引导程序流程，如清单 8-10 所示。\n\n```\n\
  1  # 解释 while-else 循环用法的 Python 程序\n2  i=0\n\n4  while i<=5:\n5      print(i)\n\
  6      i=i+1\n7  else:\n8      print(\"该值现在超过 5\")\n清单 8-10\nwhile–else.py\n```\n\
  \n结果如下：\n\n```\n1  0\n2  1\n3  2\n4  3\n5  4\n6  该值现在超过 5\n```\n\n一旦递增后的值变为 5，流程将由\
  \ `else` 条件下的语句处理。\n\n## 8.11 总结\n\n函数使程序具有模块化结构。此外，控制信息流和迭代已成为大多数应用程序中计算工作的基础。这两个操作由循环执行。它们共同使\
  \ Python 成为适用于各种应用程序的强大工具。模块化结构使其更易于测试和调试。掌握编写函数的技能以及选择合适循环结构的技能已成为衡量程序员使用 Python\
  \ 代码解决问题能力的关键指标。因此，本章对程序员来说非常重要。\n\n"
- "# 9. 面向对象编程\n\n\n\n## 9.1 引言\n\n定义对象的概念对人类来说非常自然，因为我们在日常生活中就与各种对象打交道。我们将对象理解为具有以下特征的事物：\n\
  \n*   一组属性，以及\n*   一组相关的行为。\n\n婴儿很早就开始学习认识环境中的对象。例如，作为婴儿，我们了解到一个球（对象）有颜色、形状和大小（属性），并且它可以滚动、滑动和弹跳（行为）。20\
  \ 世纪 70 年代初，施乐帕克研究中心的艾伦·凯致力于面向对象编程（OOP）[1] 的概念。在开发名为 Smalltalk [2] 的编程语言时，他运用了 OOP\
  \ 的思想。他的核心思想基于将计算机编程应用于物理模拟。大多数人将现实世界理解为各种对象（具有属性和行为）相互交互。因此，在构建模拟世界时采用相同的理念是很自然的。所有基于\
  \ GUI 的系统都继承了凯在这些思想上的努力成果，而现在所有主流编程语言都严格遵循这些思想。\n\n## 9.2 过程式编程 vs. 面向对象编程\n\n在定义计算任务时，你可以定义一组过程，通过使用数据块并按照过程规定的方式连接它们来解决问题。这种强调过程设置而忽略数据类型及其不同使用模式的范式称为过程式编程。另一方面，面向对象编程则强调对象以及它们之间通过运算符（作用于对象，改变其值和其他属性）定义的关系，以解决计算任务。Python\
  \ 是一种 OOP 语言。\n\n## 9.3 对象\n\n在 Python 的世界里，一切都是对象。但什么是对象呢？对象是一个抽象概念，用来表示可以执行计算的实体。就像物理对象一样，计算机对象也有一组属性和一组相关的行为。数字、字符串、图片、视频和文件都可以被视为对象。在数字中，你可以将对象进一步细分为其他对象，例如整数、浮点数和布尔数，或者它们的无序或有序集合。在字符串中，你可以有字符、单词、句子等等。在文件中，你可以有文本文件、媒体文件、数据文件、脚本文件等等。让我们探索一些常见的\
