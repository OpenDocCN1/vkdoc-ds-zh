    ### 7.3.2 图形的各种特征


    图形具有多种特征。以下是图形特征列表：


    **表 7-2** 绘图线型


    | 样式缩写 | 样式 |

    | --- | --- |

    | - | 实线 |

    | – | 虚线 |

    | -. | 点划线 |

    | : | 点线 |


    **表 7-1** 绘图特征


    | 标记缩写 | 标记样式 |

    | --- | --- |

    | . | 点 |

    | , | 像素 |

    | o | 圆圈 |

    | v | 下三角 |

    | < | 左三角 |

    | > | 右三角 |

    | 1 | 下三脚架 |

    | 2 | 上三脚架 |

    | 3 | 左三脚架 |

    | 4 | 右三脚架 |

    | s | 正方形 |

    | p | 五边形 |

    | ∗ | 星形 |

    | h | 六边形 |

    | H | 旋转六边形 |

    | + | 加号 |

    | x | 叉号 |

    | D | 菱形 |

    | d | 细菱形 |

    | - | 水平线 |


    - **标题**：标题简要介绍图形的用途。`title()` 对象用于设置当前坐标轴的标题，位于坐标轴上方并居中。它接受一个字符串作为输入。

    - **坐标轴标签**：坐标轴标签标明图形坐标轴的用途。`xlabel()` 和 `ylabel()` 对象分别用于设置 x 轴和 y 轴的标签。它们接受的文本字符串位于坐标轴上方并居中。

    - **刻度**：坐标轴上的刻度显示数据点在轴上的划分，有助于判断图形上数据点的信息。`xticks` 和 `yticks` 用于设置刻度的频率和位置。例如，


    ```

    xticks( arange(5), (''a'', ''b'', ''c'', ''d'', ''e'') )

    ```


    表示五个名为 `a`、`b`、`c`、`d` 和 `e` 的刻度等距放置。`linspace` 和 `logspace` 也可用于相同目的。

    - **标记**：标记是在每个数据点处绘制的符号。可以通过区分标记的大小和类型来显示属于两个或多个不同数据集的数据点。在 `plot()` 函数中，对于每一对
    x, y，都有一个可选的第三个参数作为格式字符串，用于指示绘图的颜色和线型。标记列表见 [`http://matplotlib.org/api/markers_api.html#module-matplotlib.markers`](http://matplotlib.org/api/markers_api.html%23module-matplotlib.markers)。例如：`plot(x,y,''r+'')`
    表示每个数据点将放置红色加号 (+)。它们列于表 7-1 中。

    - **线宽**：线宽定义标记的宽度。`linewidth=n` 其中 `n` 可设置为整数，将标记大小设置为所需尺寸。

    - **线型**：线型定义连接标记的线条样式。当数据点不需要连接时，可以关闭线型。`linestyle = ''.''` 将线型设置为两个数据点之间的连接点。类似地，还存在许多其他线型，如表
    7-2 所示。

    - **颜色**：标记的颜色也可用于区分属于两个或多个不同数据集的数据点，但此方法不适用于需要以黑白配色方案发布数据的情况。


    以下命令将线型设置为 `--`，标记设置为 `+`，颜色为绿色：


    ```

    plot(arange(10,100,1), linestyle="--", marker=''+'', color="g")

    ```


    快捷命令如下：


    ```

    plot(range(10), ''--g+'')

    ```


    表 7-3 列出了选择特定颜色的代码。


    **表 7-3** 绘图颜色


    | 颜色缩写 | 颜色名称 |

    | --- | --- |

    | b | 蓝色 |

    | c | 青色 |

    | g | 绿色 |

    | k | 黑色 |

    | m | 品红色 |

    | r | 红色 |

    | w | 白色 |

    | y | 黄色 |


    除了使用预定义的颜色符号外，您还可以使用十六进制字符串（如 `#FF00FF`）或 RGBA 元组（如 `(1,0,1,1)`）。您可以将灰度强度设置为字符串，例如
    `''0.6''`。


    - **网格**：可以使用以下语法打开或关闭图形的网格：


    ```

    grid(True)

    ```


    - **图例**：图例用于通过显示数据类型的符号并打印相应文本来区分同一图形中来自多个图形的数据类型。


    其用法在 [`http://matplotlib.org/api/pyplot_api.html#matplotlib.pyplot`](http://matplotlib.org/api/pyplot_api.html%23matplotlib.pyplot.legend)
    `.` [`legend`](http://matplotlib.org/api/pyplot_api.html#matplotlib.pyplot.legend)
    中有说明。


    默认情况下，`legend()` 接受在 `plot()` 函数中通过标志 `label=""` 提供的字符串作为输入。默认位置设置为右上角。可以通过设置
    `loc=` 参数根据需要更改位置。


    针对二维 `plot()` 函数设置线条属性，提供了多种选项 [4]。代码 `sqPlot3.py` 展示了使用多种格式化参数绘制格式化图形的方法，如代码清单
    7-4 和图 7-4 所示。


    ![A458920_1_En_7_Fig4_HTML.jpg](img/A458920_1_En_7_Fig4_HTML.jpg)


    **图 7-4** 绘制 sin(x) 和 sin(2x)


    ```

    1  # 导入 pylab 和 numpy

    2  from matplotlib import pylab as pl

    3  import numpy as np


    5  # 创建一个大小为 9x7 英寸、100 点每英寸的图形

    6  pl.figure(figsize=(9, 7), dpi=100)


    8  # 从 1x1 网格创建一个新的子图

    9  pl.subplot(1, 1, 1)


    11  # 我们希望绘制 sin(x) 和 sin(2x)


    13  # 首先我们以 pi 为单位定义 x 轴


    15  X = np.linspace(-np.pi * 2, np.pi *2, 10e4, endpoint=True)


    17  '''''' x 轴定义为从 -2pi 到 2pi，包含 10000 个点

    18  其中最后一个点也被包含在内''''''


    20  S, S2 = np.sin(X), np.sin(2*X)


    22  # 用宽度为 1（像素）的蓝色连续线绘制 sin(x)

    23  # 标签为 sin(x)

    24  pl.plot(X, S, color="blue", linewidth=1.0, linestyle="-", label = "$sin(x)$")


    26  # 用宽度为 1（像素）的红色连续线绘制 sin(2x)

    27  # 标签为 sin(2x)

    28  pl.plot(X, S2, color="red", linewidth=1.0, linestyle="-", label = "$sin(2x)$")


    30  # 设置 x 轴范围从 -2pi 到 2.5*pi

    31  pl.xlim(-2* np.pi, 2.5* np.pi)


    33  # 设置 x 轴刻度

    34  pl.xticks(np.linspace(-2.5 * np.pi, 2.5 * np.pi, 9, endpoint =True))


    36  # 设置 y 轴范围从 1.2 到 -1.2

    37  pl.ylim(-1.2, 1.2)


    39  # 设置 y 轴刻度

    40  pl.yticks(np.linspace(-1, 1, 5, endpoint=True))


    42  # 设置标题为 ''正弦波''

    43  pl.title(''$sin(x)$ and $sin(2x)$ waves'')


    45  # 设置 x 轴和 y 轴的标签


    47  pl.ylabel(''$sin(x)$ and $sin(2x)$'')

    48  pl.xlabel(''$x$'')


    50  # 打开网格

    51  pl.grid(True)


    53  # 在角落显示图例以区分两条曲线

    54  pl.legend()


    56  # 在屏幕上显示结果

    57  pl.show()

    ```


    **代码清单 7-4** `sqPlot3.py`


    ## 7.4 设置属性


    `setup()` 和 `getup()` 对象允许我们设置和获取对象的属性。它们与 `matplotlib` 对象配合良好。对于 `plot()` 对象，可以使用
    `setup()` 来设置属性。目前，初学者可以忽略这一点。

