    \ capabilities of the system to produce a graph in a desired plot. Plots can be\
    \ plotted interactively using backends like `pygtk`, `wxpython`, `tkinter`, `qt4`,\
    \ and `macosx`, or they can be plotted noninteractively (permanently saved as\
