    \ the bottom of the screen.\n\n### 2.6.1 Using a Module\n\nTo use a particular\
    \ module and its functionalities, first import it inside the workspace using the\
    \ command `import` . For example:\n\n```\nimport math\n```\n\nThis command imports\
    \ the module named `math` and all its objects are now available for usage. The\
    \ procedure to use them is as follows:\n\n1.  `import math`\n    *   We need to\
    \ mention the name of the module before using any function defined within itself.\
    \ For example, if we wish to use the `sqrt()` function, we need to write `math.sqrt(2)`,\
    \ which will calculate ![$$ \\sqrt{2} $$](A458920_1_En_2_Chapter_IEq1.gif) using\
    \ the `math` module. \n2.  *   `\"*\"` signifies everything (in the language of\
    \ regular expressions). Hence, the statement means that we can use all the functions\
    \ without the need to write the name of the module separated with a `\".\"` (dot\
    \ operator) before the name of the function.\n\n    ```\n    from math import\
    \ *\n    ```\n\n3.  *   This statement just imports the `sqrt()` function being\
    \ used. Using this style of Python programming is essential when you have limited\
    \ memory and are energy-conscious because you don’t need to import unnecessary\
    \ objects. You still need to write the name of module separated with a `\".\"\
    ` (dot operator) before the name of the function .\n\n    ```\n    from math import\
    \ sqrt\n    ```\n\n## 2.7 Python Environment\n\nA professional way of working\
    \ on a Python project is to establish a dedicated Python environment for the particular\
    \ project. This has several advantages. The environment is isolated to the system\
    \ editions, updates, and upgrades. In other words, a separate set of a software\
    \ dependency’s repository (Python packages) can be maintained, which avoids problems\
    \ if the dependency’s upgrades affect the performance of code. (A beginner can\
    \ skip this section for now and then come back after gaining more practice with\
    \ Python.)\n\nAnaconda 2.4 presents the option of defining an environment as a\
    \ clickable tab in the left pane of the main window where you can create and maintain\
    \ a virtual environment graphically. You can do the same using a terminal. `virtualenv`\
    \ is a command-line-based tool that can create a dedicated and isolated Python\
    \ virtual environment. `virtualenv` creates a folder that contains all the necessary\
    \ executables to use the packages that a Python project would need.\n\n### 2.7.1\
    \ Installing virtualenv\n\nTo install `virtualenv` , you need a command-line tool\
    \ named `pip` (explained in detail in Section ??). On Ubuntu Linux-based machines,\
    \ issue the following command to install `virtualenv`:\n\n```\n1  $pip install\
    \ virtualenv\n```\n\nSuppose you have created a folder named `my_project_folder`.\
    \ To create a virtual environment for a project named proj1, you have to issue\
    \ the following commands at a Linux terminal:\n\n```\n1  $cd my_project_folder\n\
    2  $virtualenv proj1\n```\n\nThe second command will create a folder in the current\
    \ directory. This folder will contain the Python executable files and a copy of\
    \ the `pip` library, which you can use to install other packages.\n\n### 2.7.2\
    \ Activating virtualenv\n\nTo use the virtual environment that has been created,\
    \ it must first be `activated`. The following command must be issued on a Linux\
    \ terminal:\n\n```\n1  $source proj1/bin/activate\n```\n\nIf there haven’t been\
    \ any errors, the command prompt will be preceded by the name of the virtual environment.\
    \ This indicates that it is active now for further usage. Within a virtual environment,\
    \ packages can be installed in the usual manner as installed on a system in general.\n\
    \nYou can generate a list of dependencies with their installed version numbers\
    \ by issuing the command within the environment:\n\n```\n1  $pip freeze > requirements.txt\n\
    ```\n\nThis command creates a file named `requirements.txt` that has a list of\
    \ dependencies along with their version numbers. When the project is shared and\
    \ new users wish to install the package, they can use this file for installation\
    \ by issuing the following command:\n\n```\n1 $pip install −r requirements.txt\n\
    ```\n\n### 2.7.3 Deactivating the Virtual Environment\n\nSince a developer may\
    \ need to work on a number of projects at the same time , it is helpful for each\
    \ one to have a separate virtual environment because the developer can work on\
    \ only one virtual environment at a time. When developers need to switch to some\
    \ other task outside the virtual environment, they must deactivate the present\
    \ virtual environment by issuing the following command:\n\n```\n1  $deactivate\n\
    ```\n\nThe command puts the developer back to the system’s default Python interpreter\
    \ with all its installed libraries. In case developers need to remove the virtual\
    \ environment , they can remove its folder by issuing the following command:\n\
    \n```\n1  $rm − rf proj1\n```"
  trans: "\n## 2.6 模块\n\nPython 多宇宙已扩展出数千个模块，并且由于是开源的，其中大部分都可以直接获取。模块是为完成特定任务而编写的\
    \ Python 程序集合。例如，`numpy` 提供了各种用于数值计算的功能。它进一步扩展为 `scipy`，用于通用科学计算。`matplotlib`\
    \ 是数学绘图库的缩写，拥有丰富的功能，可以绘制各种达到出版质量的图表。`pandas` 是用于数据分析的库，`scikit-learn` 用于机器学习，`scikit-image`\
    \ 用于图像处理，`sympy` 用于符号计算。\n\n要使用一个模块，必须首先将其安装在机器上。安装过程包括将文件下载到合适的文件夹或目录中，解压缩，并定义正确的路径。对于\
    \ Ubuntu 用户来说，有一种更简单的方法，即基于命令行的简短程序 `pip` 可以无缝地完成这些任务。\n\n运行简单的命令\n\n```\nsudo\
    \ apt-get install python3-pip\n```\n\n首先安装 `pip` 程序。然后，只需发出以下命令，即可使用它来安装一个包，例如\
    \ `numpy`：\n\n```\nsudo pip3 install numpy\n```\n\n将包名替换为所需的包名，即可轻松完成包的安装。此外，还可以通过输入以下命令将模块升级到最新版本：\n\
    \n```\nsudo pip install [package_name] --upgrade\n```\n\n安装 `scipy stack` [4]\
    \ 对我们的目的非常有用，因为它会安装我们将要使用的各种程序。可以通过在 Ubuntu 终端上发出以下命令来安装它：\n\n```\n$ sudo apt-get\
    \ install python-numpy python-scipy\npython-matplotlib ipython ipython-notebook\n\
    python-pandas python-sympy python-nose\n```\n\n这个单行命令会安装以下内容：\n\n*   `numpy`（数值\
    \ Python）\n*   `scipy`（科学 Python）\n*   `matplotlib`（数学绘图库）\n*   `ipython`（Python\
    \ 解释器的交互式环境）\n*   `ipython-notebook`（基于 Web 的 `ipython` 交互式环境）\n*   `pandas`（用于统计计算）\n\
    *   `sympy`（用于执行符号计算）\n*   `nose`（用于测试）\n\nAnaconda IDE 预装了本书所需的所有模块。任何额外的模块都可以使用\
    \ conda 终端以类似的方式安装。要打开 conda 终端，首先单击 `Environments`，然后单击 `root` 旁边的箭头按钮（图 2-6）。您可以选择\
    \ `Open Terminal` 选项，在任何操作系统中打开一个类似 Linux 的终端。\n\n![A458920_1_En_2_Fig6_HTML.jpg](img/A458920_1_En_2_Fig6_HTML.jpg)\n\
    \n图 2-6\n\nConda 终端\n\n`Environment` 选项还会显示已安装模块的列表。您可以通过选择所需模块并单击屏幕底部的 `Apply`\
    \ 来卸载模块或将其升级到所需版本。\n\n### 2.6.1 使用模块\n\n要使用特定模块及其功能，首先需要使用 `import` 命令在工作区内导入它。例如：\n\
    \n```\nimport math\n```\n\n此命令导入名为 `math` 的模块，其所有对象现在都可以使用了。使用它们的过程如下：\n\n1. \
    \ `import math`\n    *   在使用模块内部定义的任何函数之前，我们需要提及模块的名称。例如，如果我们想使用 `sqrt()` 函数，我们需要编写\
    \ `math.sqrt(2)`，这将使用 `math` 模块计算 ![$$ \\sqrt{2} $$](img/A458920_1_En_2_Chapter_IEq1.gif)。\n\
    2.  *   `\"*\"` 表示所有内容（用正则表达式的语言来说）。因此，该语句意味着我们可以使用所有函数，而无需在函数名称前用 `\".\"`（点运算符）分隔模块名称。\n\
    \n    ```\n    from math import *\n    ```\n\n3.  *   此语句仅导入正在使用的 `sqrt()` 函数。当您内存有限且注重能耗时，使用这种\
    \ Python 编程风格至关重要，因为您不需要导入不必要的对象。您仍然需要在函数名称前用 `\".\"`（点运算符）分隔模块名称。\n\n    ```\n\
    \    from math import sqrt\n    ```\n\n## 2.7 Python 环境\n\n在 Python 项目上工作的专业方式是为特定项目建立一个专用的\
    \ Python 环境。这有几个优点。该环境与系统版本、更新和升级是隔离的。换句话说，可以维护一个独立的软件依赖项仓库（Python 包），这可以避免依赖项升级影响代码性能时出现的问题。（初学者可以暂时跳过本节，在获得更多\
    \ Python 实践经验后再回来阅读。）\n\nAnaconda 2.4 提供了将环境定义为主窗口左侧窗格中可点击选项卡的选项，您可以在其中以图形方式创建和维护虚拟环境。您也可以使用终端执行相同操作。`virtualenv`\
    \ 是一个基于命令行的工具，可以创建专用且隔离的 Python 虚拟环境。`virtualenv` 创建一个文件夹，其中包含使用 Python 项目可能需要的包所需的所有可执行文件。\n\
    \n### 2.7.1 安装 virtualenv\n\n要安装 `virtualenv`，您需要一个名为 `pip` 的命令行工具（在 ?? 节中详细说明）。在基于\
    \ Ubuntu Linux 的机器上，发出以下命令来安装 `virtualenv`：\n\n```\n$pip install virtualenv\n\
    ```\n\n假设您创建了一个名为 `my_project_folder` 的文件夹。要为名为 `proj1` 的项目创建虚拟环境，您需要在 Linux 终端上发出以下命令：\n\
    \n```\n$cd my_project_folder\n$virtualenv proj1\n```\n\n第二个命令将在当前目录中创建一个文件夹。此文件夹将包含\
    \ Python 可执行文件和一个 `pip` 库的副本，您可以使用它来安装其他包。\n\n### 2.7.2 激活 virtualenv\n\n要使用已创建的虚拟环境，必须首先将其\
    \ `激活`。必须在 Linux 终端上发出以下命令：\n\n```\n$source proj1/bin/activate\n```\n\n如果没有出现任何错误，命令提示符前将出现虚拟环境的名称。这表明它现在已激活，可以进一步使用。在虚拟环境中，可以像在系统上通常安装包一样安装包。\n\
    \n您可以通过在环境中发出以下命令来生成依赖项列表及其已安装的版本号：\n\n```\n$pip freeze > requirements.txt\n```\n\
    \n此命令创建一个名为 `requirements.txt` 的文件，其中包含依赖项列表及其版本号。当项目被共享且新用户希望安装该包时，他们可以通过发出以下命令使用此文件进行安装：\n\
    \n```\n$pip install -r requirements.txt\n```\n\n### 2.7.3 停用虚拟环境\n\n由于开发人员可能需要同时处理多个项目，因此为每个项目设置单独的虚拟环境会很有帮助，因为开发人员一次只能在一个虚拟环境中工作。当开发人员需要切换到虚拟环境之外的其他任务时，他们必须通过发出以下命令来停用当前的虚拟环境：\n\
    \n```\n$deactivate\n```\n\n该命令将开发人员带回系统的默认 Python 解释器及其所有已安装的库。如果开发人员需要删除虚拟环境，他们可以通过发出以下命令来删除其文件夹：\n\
    \n```\n$rm -rf proj1\n```\n"
- fmt: "## 2.8 Summary\n\nPython has an extremely flat learning curve owing to its\
    \ interpretive language, which can be used to insert instructions line-by-line\
    \ and run them subsequently. This methods avoids compilation and subsequent errors\
    \ that are major stumbling blocks for a beginner who has limited knowledge of\
    \ the inner workings of the programming language. Being open source in nature,\
    \ the Python interpreter can be downloaded for free from the Internet. `Anaconda`\
    \ IDE presents a good integrated development environment for Python developers,\
    \ and we recommend that you use it for practicing the codes in this book.\n\n\
    # 3. IPython\n\n## 3.1 Introduction\n\nThe biggest challenge the creators of a\
    \ programming language face is attracting developers and making them want to learn\
    \ the language. Usually developers use documentation or help books to gain insights\
    \ into the language, but an interactive environment allows developers to experiment\
    \ with commands and programs as they learn. This environment has already been\
    \ provided by Python’s interactive shell.\n\nAnother option for providing the\
    \ same environment is `IPython` [[1](#A458920_1_En_3_Chapter.html#Par101)]. `IPython`\
    \ was inspired [[2](#A458920_1_En_3_Chapter.html#Par102)] by the notebook environments\
    \ of Maple and Mathematica. It launched in 2001 and immediately started attracting\
    \ developers since it conceptualized a simple and intuitive environment to execute\
    \ Python code with the following features:\n\n- An interactive shell for the Python\
    \ interpreter\n- A browser-based notebook with support for code, text, mathematical\
    \ expressions, inline plots, and other media such as `ipython-notebook`\n- Support\
    \ for interactive data visualization and use of GUI toolkits\n- Flexible, embeddable\
    \ interpreters to load into a project\n- Tools for parallel computing\n\nSince\
    \ 2001, the `IPython` environment has grown tremendously and the popular web-browser-based\
    \ interactive environment has even changed its name to `Jupyter Notebook` [[3](#A458920_1_En_3_Chapter.html#Par103)]\
    \ to highlight the fact that, in addition to Python, it can run other kernels.\
    \ At the time of writing, it supports 40 programming languages including Julia,\
    \ Python, Scala, R, C, and C++. `Jupyter` needs a native installation of the Python\
    \ interpreter to work, so users must install the Python interpreter as illustrated\
    \ in Chapter [2](#A458920_1_En_2_Chapter.html) and then they can work within the\
    \ `IPython` environment with Python as one of its kernel.\n\n## 3.2 Installing\
    \ IPython\n\nIf you are working with `Anaconda` IDE (works on all operating systems\
    \ including Windows, Linux, and Mac OS X), `IPython` is already pre-installed.\
    \ Figure [3-1](#A458920_1_En_3_Chapter.html#Fig1) shows the screenshot of a `Spyder`\
    \ IDE session. It has an `IPython` shell running in the lowermost right corner.\
    \ You can type Python expressions just like a Python shell here and expect it\
    \ to get evalauted.\n\nIf you prefer to work on an Ubuntu Linux command shell,\
    \ you can install `IPython` by issuing the following command on the terminal:\n\
    \n```\n$pip3 install ipython\n```\n\nAfter installation, you can start an `IPython`\
    \ session by issuing the following command on the terminal:\n\n```\n$ipython\n\
    ```\n\nInstead of calling the interpreter by typing `python`, you call the application\
    \ `ipython`, which starts an `IPython` session in which the Python interpreter\
    \ is used as the kernel.\n\nYou can exit the `IPython` session by typing `exit`\
    \ at its prompt. At the Python prompt, you had to define `exit` as a function\
    \ and type `exit()`, but here `exit` executes the exit function. As seen in Figure\
    \ [3-1](#A458920_1_En_3_Chapter.html#Fig1), the `IPython` prompt shows `In[` [`1`](#A458920_1_En_3_Chapter.html#Par101)\
    \ `]` at the start of a session. This signifies that the `IPython` prompt running\
    \ the `IPython` REPL is waiting for the user to type the first input. When you\
    \ type an input and execute the expression by pressing the `Enter` key, you obtain\
    \ output with the prompt `Out[` [1](#A458920_1_En_3_Chapter.html#Par101) `]`,\
    \ signifying it is output of the first Python expression at `In[` [1](#A458920_1_En_3_Chapter.html#Par101)\
    \ `]`. The numbers within parentheses keep increasing by one, which makes it useful\
    \ while teaching Python as well as when tracking workflow during a session. These\
    \ numbers get reset once a session has restarted.\n\n![A458920_1_En_3_Fig1_HTML.jpg](A458920_1_En_3_Fig1_HTML.jpg)\n\
    \nFigure 3-1\n\n`IPython` session\n\nThe `IPython` shell also supports Unix/Linux\
    \ system commands. Some sets of useful commands are the following:\n\n- `pwd`:\
    \ Print working directory\n  - Users can print the directory in which they are\
    \ running the session.\n- `cd <name1>`: Change directory from present to `name1`\n\
    \  - If `name2` directory is within the present working directory, then the command\
    \ makes `name1` the present working directory.\n- `rm -r <name_of_directory>`:\
    \ Remove directory `<name_of_directory>`\n  - Users can remove the contents of\
    \ the directory. If the directory further contains other subdirectories, users\
    \ have to remove it forcefully by using the flag `-rf`.\n- `cd..` and `cd`\n \
    \ - The command `cd..` enables a user to step one step back in the directory tree\
    \ structure.\n  - The command `cd` places a user in the home directory.\n\nThere\
    \ is a number of other Unix/Linux commands that can be used at the `IPython` shell.\
    \ A special set of commands called magic functions [[4](#A458920_1_En_3_Chapter.html#Par104)]\
    \ can be used to enhance the capabilities of an `IPython` session. There are two\
    \ kinds of magics: line-oriented and cell-oriented. Line magics are prefixed with\
    \ the `%` character and work much like OS command-line calls: They get as an argument\
    \ the rest of the line, where arguments are passed without parentheses or quotes.\
    \ Cell magics are prefixed with a double `%%`, and they are functions that get\
    \ as an argument not only the rest of the line, but also the lines below it in\
    \ a separate argument. Discussing all magic functions is beyond the scope of this\
    \ book, so only a few useful magic functions are discussed here."
