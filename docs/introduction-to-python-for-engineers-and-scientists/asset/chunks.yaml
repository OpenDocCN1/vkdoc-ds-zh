- fmt: "# 1. Philosophy of Python\n\n## 1.1 Introduction\n\nPython emerged as a leader\
    \ [[1](#A458920_1_En_1_Chapter.html#Par100)] among well-established and optimized\
    \ languages including C, C++, and Java for very simple reasons. Python incorporates\
    \ the principles of the philosophy that complex tasks can be done in simple ways.\
    \ We tend to think that real-world, complex problems need complex pathways to\
    \ produce complex solutions. The developers of Python embraced the exact opposite\
    \ philosophy. Python was created to have an extremely fast and simple learning\
    \ curve and development process for software engineers. As a result, it is considered\
    \ the most general-purpose programming language since users can work in almost\
    \ any study domain and still be able to find a useful piece of code for themselves.\
    \ Python harnessed the power of the open source movement, which helped it amass\
    \ a huge user base from virtually all walks of life. Being open source in nature,\
    \ Python allowed people to make small programs and share them with each other\
    \ with ease. In Python, a group of programs for performing various tasks makes\
    \ up a module (package). At the time of writing, there are over 117,181 [[2](#A458920_1_En_1_Chapter.html#Par101)]\
    \ modules that have been submitted by an even larger number of developers around\
    \ the world. The large number of modules and developers has allowed Python’s use\
    \ to jump rapidly within the computer science community and finally grab the number-one\
    \ position as the most favored [[1](#A458920_1_En_1_Chapter.html#Par100)] programming\
    \ language.\n\nThe philosophy of Python can be defined in a single sentence:\n\
    \nPython is a multipurpose, portable, object-oriented, high-level programming\
    \ language that enables an interactive environment to code in a minimalistic way.\n\
    \nLet’s look at the individual characteristics of Python.\n\n### 1.1.1 High-Level\
    \ Programming\n\nA high-level programming language is a language that is separated\
    \ from the details of a particular computer. A low-level language is one where\
    \ users directly feed the machine code to a processor for obtaining results. A\
    \ high-level language provides facilities like library functions for performing\
    \ the low-level tasks and also provides ways to define the code in a form readable\
    \ to humans, which is then translated into machine language to be fed to a processor.\n\
    \n### 1.1.2 Interactive Environment\n\nTo a large extent, Python derives its philosophy\
    \ from the ABC language. The syntax structure was largely derived from C and UNIX’s\
    \ Bourne shell environments. They served as inspiration for the interpretative\
    \ nature of the working environment. The interpretive nature means that Python\
    \ presents a REPL-based interactive environment to a developer. The interactive\
    \ shell of the Python programming language is commonly known as REPL (Read-Evaluate-Print-Loops)\
    \ because it:\n\n* reads what a user types,\n* evaluates what it reads,\n* prints\
    \ out the return value after evaluation, and\n* loops back and does it all over\
    \ again.\n\nThis kind of interactive working environment proves especially useful\
    \ for debugging. It also helps in prototyping a problem where each step can be\
    \ visualized for its output in a live fashion. Users can check the results of\
    \ a particular code as soon as they finish writing it. The way to work with Python’s\
    \ REPL is to write the code, analyze the results, and continue this process until\
    \ the final result is computed. In addition to allowing quick and easy evaluation\
    \ of Python statements, the language also showcases the following:\n\n* A searchable\
    \ history\n  * Users can press the Up and Down keys on the keyboard to browse\
    \ through past commands instead of writing them again.\n* Tab completion\n  *\
    \ Users can simply press the Tab key after writing a few letters for a command\
    \ and it will auto-complete it.\n  * Consequently, tab completion eliminates syntax\
    \ errors.\n  * If more than one option matches when the Tab key is pressed, the\
    \ options are displayed at the command prompt so users can choose which one they\
    \ intended.\n* Many helpful key bindings\n  * The key bindings depend on the operating\
    \ systems.\n  * The key bindings help in quick operations where key combinations\
    \ are equivalent to a particular operation.\n* Help and documentation\n  * Getting\
    \ help on topics and locating documentation is quite easy in Python.\n  * Users\
    \ can feed any argument as a string (that is, characters enclosed within double\
    \ quotation marks) to the built-in function `help()`.\n\nIn addition to being\
    \ interactive, Python is an interpreted language. Whereas other languages require\
    \ source code to be converted into an executable and then run on a machine—in\
    \ other words, AOT (ahead-of-time) compilation—Python runs the program directly\
    \ from source code. Python converts the source code into an intermediate form\
    \ called bytecodes and then translates the bytecodes into the native language\
    \ of the computer and runs it. This is a type of OTF (on-the-fly) compilation,\
    \ enabling portability and making it easier for a developer to write and check\
    \ the program in an interactive manner.\n\n### 1.1.3 Object Orientation\n\nMost\
    \ primitive programming languages were procedural in nature. In other words, a\
    \ set of procedures was defined to compute a problem and the flow of information\
    \ was controlled within these procedures to obtain a desired output. Hence, a\
    \ program was merely divided into blocks of codes that interacted with each other\
    \ where one block of code defined a computation subtask belonging to a computational\
    \ problem understudy. Conversely, an object-oriented programming (OOP) language\
    \ deals with data as an object on which different methods act to produce a desired\
    \ result. Everything computable is treated as an object. Its nature is defined\
    \ as its properties. These properties can be probed by functions, which are called\
    \ methods. The abstract nature of objects makes it possible to invent objects\
    \ of the user’s choice and apply the programming concepts for a variety of applications.\n\
    \n### 1.1.4 Multipurpose Nature\n\nAs discussed in the preceding section, the\
    \ OOP-based architecture of Python enables developers from different walks of\
    \ life to use and enrich the language in their fields of expertise. Virtually\
    \ all fields of computations have used Python. You can define a module specific\
    \ for one kind of problem. In fact, Python modules exist for specific fields of\
    \ studies, as shown in Table 1-1.\n\n**Table 1-1** List of Fields of Study and\
    \ Corresponding Python Modules\n\n| Field of Study | Name of Python Module |\n\
    | --- | --- |\n| Scientific Computation | `scipy`, `numpy`, `sympy` |\n| Statistics\
    \ | `pandas` |\n| Networking | `networkx` |\n| Cryptography | `pyOpenSSL` |\n\
    | Game Development | `PyGame` |\n| Graphic User Interface | `pyQT` |\n| Machine\
    \ Learning | `scikit-learn`, `tensorflow` |\n| Image Processing | `scikit-image`\
    \ |\n| Plotting | `Matplotlib` |\n| Database | `SQLAlchemy` |\n| HTML and XML\
    \ parsing | `BeautifulSoup` |\n| Natural Language Processing | `nltk` |\n| Testing\
    \ | `nose` |\n\nIt is impossible to list all the modules for a given application\
    \ as the modules are being created on a daily basis. Table 1-1 lists the most\
    \ widely used modules at the time of writing. Developers from all over the world\
    \ are using and developing modules at a tremendous pace. Since Python can be used\
    \ in a wide arena of computing domains, it is truly the most multipurpose programming\
    \ language yet."
