- fmt: '### 7.3.2 Various Features of a Plot


    A variety of features exists for a graph. Following is a list of features of a
    graph:


    **Table 7-2** Plot Line Styles


    | Style Abbreviation | Style |

    | --- | --- |

    | - | Solid line |

    | – | Dashed line |

    | -. | Dash dot line |

    | : | Dotted line |


    **Table 7-1** Plot Features


    | Marker Abbreviation | Marker Style |

    | --- | --- |

    | . | Point |

    | , | Pixel |

    | o | Circle |

    | v | Triangle down |

    | < | Triangle left |

    | > | Triangle right |

    | 1 | Tripod down |

    | 2 | Tripod up |

    | 3 | Tripod left |

    | 4 | Tripod right |

    | s | Square |

    | p | Pentagon |

    | ∗ | Star |

    | h | Hexagon |

    | H | Rotated hexagon |

    | + | Plus |

    | x | Cross |

    | D | Diamond |

    | d | Thin diamond |

    | - | Horizontal line |


    - **Title**: The title gives a short introduction for the purpose of the graph.
    `title()` object sets the title of the current axes, positioned above axes and
    in the center. It takes a string as an input.

    - **Labels for axes**: Labels marks the purpose of graph axes. `xlabel()` and
    `ylabel()` objects set the label of the x- and y-axis, respectively. The text
    string, which it takes as input, is positioned above the axis in the center.

    - **Ticks**: Ticks on axes show the division of data points on an axis and help
    judge information about a data point on graph. `xticks` and `yticks` set the ticking
    frequency and location. For example,


    ```

    xticks( arange(5), (''a'', ''b'', ''c'', ''d'', ''e'') )

    ```


    shows that five ticks named `a`, `b`, `c`, `d`, and `e` are placed equidistant.
    `linspace` and `logspace` can also be used for the same.

    - **Markers**: Markers are the symbols drawn at each data point. The size and
    type of markers can be differentiated for showing the data points belonging to
    two or more different data sets. In the `plot()` function, for every pair x, y,
    there is an optional third argument as a format string that indicates the color
    and line type of the plot. A list of markers is given at [`http://matplotlib.org/api/markers_api.html#module-matplotlib.markers`](http://matplotlib.org/api/markers_api.html%23module-matplotlib.markers).
    For example: `plot(x,y,''r+'')` means that red plus signs (+) will be placed for
    each data point. They are tabulated in Table [7-1](#A458920_1_En_7_Chapter.html#Tab1).

    - **Line width**: Line width defines the width of markers. `linewidth=n` where
    `n` can be set as an integer, setting the marker size to a desired dimension.

    - **Line style**: Line style defines the style of lines that connect the markers.
    They can be set off when data points don’t need to be connected. `linestyle =
    ''.''` sets the line style as a connecting dot between two data points. Similarly,
    a number of other line styles also exists as tabulated in Table [7-2](#A458920_1_En_7_Chapter.html#Tab2).

    - **Color**: The color of markers can also be used for distinguishing data points
    belonging to two or more different data sets, but this method cannot be used where
    data needs to be published in a black-and-white color scheme.


    The following command sets the line style as `--` and markers as `+` in green:


    ```

    plot(arange(10,100,1), linestyle="--", marker=''+'', color="g")

    ```


    A shortcut command would have been the following:


    ```

    plot(range(10), ''--g+'')

    ```


    Table [7-3](#A458920_1_En_7_Chapter.html#Tab3) lists the codes for choosing a
    particular color.


    **Table 7-3** Colors for Plotting


    | Color Abbreviation | Color Name |

    | --- | --- |

    | b | Blue |

    | c | Cyan |

    | g | Green |

    | k | Black |

    | m | Magenta |

    | r | Red |

    | w | White |

    | y | Yellow |


    In addition to using the predefined symbols for colors, you can also use a hexadecimal
    string such as `#FF00FF` or a RGBA tuple like (`1,0,1,1`). You can set grayscale
    intensity as a string like `''0.6''`.


    - **Grid**: Grids can be turned off or on for a graph using the following syntax:


    ```

    grid(True)

    ```


    - **Legends**: Legends are used to differentiate between types of data points
    from multiple graphs in the same figure by showing symbols for the data type and
    printing text for the same.


    Their usage is illustrated at [`http://matplotlib.org/api/pyplot_api.html#matplotlib.pyplot`](http://matplotlib.org/api/pyplot_api.html%23matplotlib.pyplot.legend)
    `.` [`legend`](http://matplotlib.org/api/pyplot_api.html#matplotlib.pyplot.legend)


    By default, `legend()` takes input as the string provided within the `plot()`
    function under the flag `label=""`. The location is set to be top-right corner
    by default. It can be changed as required by setting `loc=` argument.


    A variety of options [[4](#A458920_1_En_7_Chapter.html#Par204)] are presented
