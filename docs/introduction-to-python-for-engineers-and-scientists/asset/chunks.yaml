    `matplotlib` has been in use to such an extent that new developers do not realize
    other options to plot data. There are a variety of other ways to plot data in
    other modules that might have more powerful plotting capabilities depending on
    context. Among them are `plotly`, `mayavi`, and `gnuplot` (to name a few). A brief
