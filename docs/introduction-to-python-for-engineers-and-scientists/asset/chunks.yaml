    中，`errorbar()` 函数使您能够创建此类图形，称为误差条形图。数据值分布的表示方法是通过绘制单个数据点（通常是数据集的平均值）和一个误差条来表示数据的整体分布。为此，代码清单
    7-9 中的 `ploterror.py` 代码定义了一个 x 轴数组，然后使用公式 `y = x2` 定义了一个 y 轴数组。误差存储在第三个数组中，变量名为
    `err`。这些变量名作为参数传递给 `errorbar()` 函数；因此，它按顺序接收三个变量：`x`、`y` 和 `err`。该文件生成的图形如图 7-9
