  trans: "\n# 1. Python 的哲学\n\n## 1.1 引言\n\nPython 之所以能在包括 C、C++ 和 Java 在内的成熟且经过优化的语言中脱颖而出\
    \ [1]，原因非常简单。Python 融合了一种哲学理念：复杂的任务可以用简单的方式完成。我们往往认为，现实世界中的复杂问题需要复杂的路径才能产生复杂的解决方案。而\
    \ Python 的开发者们秉持的恰恰是相反的哲学。Python 的创建旨在为软件工程师提供一条极其快速且简单的学习曲线和开发流程。因此，它被认为是最通用的编程语言，因为用户几乎可以在任何研究领域工作，并且仍然能够找到对自己有用的代码片段。Python\
    \ 利用了开源运动的力量，这帮助它积累了来自各行各业的大量用户。由于本质上是开源的，Python 允许人们编写小程序并轻松地相互分享。在 Python 中，一组用于执行各种任务的程序构成了一个模块（包）。截至撰写本文时，已有超过\
    \ 117,181 [2] 个模块由世界各地更多的开发者提交。大量的模块和开发者使得 Python 在计算机科学社区中的使用量迅速增长，并最终占据了最受欢迎\
    \ [1] 编程语言的头把交椅。\n\nPython 的哲学可以用一句话来概括：\n\nPython 是一种多用途、可移植、面向对象的高级编程语言，它提供了一个交互式环境，能够以极简的方式进行编码。\n\
    \n让我们来看看 Python 的各个特性。\n\n### 1.1.1 高级编程\n\n高级编程语言是一种与特定计算机的细节相分离的语言。低级语言是指用户直接将机器码输入处理器以获取结果的语言。高级语言提供了诸如库函数之类的设施来执行低级任务，并且还提供了以人类可读的形式定义代码的方法，然后这些代码会被翻译成机器语言以供处理器执行。\n\
    \n### 1.1.2 交互式环境\n\n在很大程度上，Python 的哲学源自 ABC 语言。其语法结构主要源自 C 语言和 UNIX 的 Bourne\
    \ shell 环境。这些环境为工作环境的解释性本质提供了灵感。解释性意味着 Python 为开发者提供了一个基于 REPL 的交互式环境。Python 编程语言的交互式\
    \ shell 通常被称为 REPL（读取-求值-打印-循环），因为它：\n\n*   读取用户输入的内容，\n*   求值它读取的内容，\n*   打印出求值后的返回值，并且\n\
    *   循环回去，重复整个过程。\n\n这种交互式工作环境对于调试尤其有用。它也有助于对问题进行原型设计，在此过程中可以实时可视化每一步的输出。用户一写完特定代码，就可以立即检查其结果。使用\
    \ Python REPL 的方式是编写代码、分析结果，并持续此过程直到计算出最终结果。除了允许快速简便地求值 Python 语句外，该语言还展示了以下特性：\n\
    \n*   可搜索的历史记录\n    *   用户可以按键盘上的向上和向下键来浏览之前的命令，而无需重新编写。\n*   制表符补全\n    *   用户只需在输入命令的几个字母后按\
    \ Tab 键，它就会自动补全。\n    *   因此，制表符补全消除了语法错误。\n    *   如果按 Tab 键时有多个选项匹配，这些选项会显示在命令提示符下，以便用户选择他们想要的那个。\n\
    *   许多有用的快捷键绑定\n    *   快捷键绑定取决于操作系统。\n    *   快捷键绑定有助于快速操作，其中组合键等同于特定操作。\n* \
    \  帮助和文档\n    *   在 Python 中获取主题帮助和查找文档非常容易。\n    *   用户可以将任何参数作为字符串（即用双引号括起来的字符）传递给内置函数\
    \ `help()`。\n\n除了交互性之外，Python 还是一种解释型语言。其他语言需要将源代码转换为可执行文件，然后在机器上运行——换句话说，即 AOT（提前）编译——而\
    \ Python 则直接从源代码运行程序。Python 将源代码转换为一种称为字节码的中间形式，然后将字节码翻译成计算机的本机语言并运行它。这是一种 OTF（即时）编译类型，实现了可移植性，并使开发者能够以交互方式更轻松地编写和检查程序。\n\
    \n### 1.1.3 面向对象\n\n大多数原始的编程语言本质上是过程式的。换句话说，定义一组过程来计算一个问题，信息流在这些过程中被控制以获得期望的输出。因此，一个程序仅仅被划分为相互交互的代码块，其中一个代码块定义了属于所研究计算问题的计算子任务。相反，面向对象编程（OOP）语言将数据视为一个对象，不同的方法作用于该对象以产生期望的结果。一切可计算的事物都被视为对象。其本质被定义为其属性。这些属性可以通过函数（称为方法）来探查。对象的抽象特性使得发明用户自己选择的对象成为可能，并将编程概念应用于各种应用程序。\n\
    \n### 1.1.4 多用途特性\n\n如前一节所述，Python 基于 OOP 的架构使得来自不同领域的开发者能够在其专业领域内使用并丰富该语言。几乎所有计算领域都使用了\
    \ Python。你可以为某一种问题定义一个特定的模块。事实上，针对特定研究领域存在 Python 模块，如表 1-1 所示。\n\n**表 1-1** 研究领域及对应的\
    \ Python 模块列表\n\n| 研究领域 | Python 模块名称 |\n| --- | --- |\n| 科学计算 | `scipy`, `numpy`,\
    \ `sympy` |\n| 统计学 | `pandas` |\n| 网络 | `networkx` |\n| 密码学 | `pyOpenSSL` |\n\
    | 游戏开发 | `PyGame` |\n| 图形用户界面 | `pyQT` |\n| 机器学习 | `scikit-learn`, `tensorflow`\
    \ |\n| 图像处理 | `scikit-image` |\n| 绘图 | `Matplotlib` |\n| 数据库 | `SQLAlchemy` |\n\
    | HTML 和 XML 解析 | `BeautifulSoup` |\n| 自然语言处理 | `nltk` |\n| 测试 | `nose` |\n\n\
    由于模块每天都在被创建，因此不可能列出给定应用程序的所有模块。表 1-1 列出了截至撰写本文时最广泛使用的模块。来自世界各地的开发者正在以惊人的速度使用和开发模块。由于\
    \ Python 可用于广泛的计算领域，它确实是迄今为止最多用途的编程语言。\n"
- fmt: '### 1.1.5 Minimalistic Design


    The minimalistic design philosophy of `Python` means that it emphasizes code readability.
    It also provides a syntax structure that allows programmers to express concepts
    in fewer lines of code than in languages such as `C++` and `Java`. Moreover, `Python`
    provides the means to write programs that can be scaled up easily. `Python` features
    a dynamic type system where a `Python` interpreter guesses the type of an object
    by its definition, which avoids the user’s need to define the same.


    The core philosophy of the language is summarized by `Tim Peters` in the document
    *The Zen of Python* (`PEP 20`) [[3](#A458920_1_En_1_Chapter.html#Par102)], which
    includes the following aphorisms:


    - Beautiful is better than ugly.

    - Explicit is better than implicit.

    - Simple is better than complex.

    - Complex is better than complicated.

    - Flat is better than nested.

    - Sparse is better than dense.

    - Readability counts.

    - Special cases aren’t special enough to break the rules.

    - Although practicality beats purity.

    - Errors should never pass silently.

    - Unless explicitly silenced.

    - In the face of ambiguity, refuse the temptation to guess.

    - There should be one–and preferably only one–obvious way to do it.

    - Although that way may not be obvious at first unless you’re Dutch.

    - Now is better than never.

    - Although never is often better than right now.

    - If the implementation is hard to explain, it’s a bad idea.

    - If the implementation is easy to explain, it may be a good idea.

    - Namespaces are one honking great idea—let’s do more of those!


    ### 1.1.6 Portability


    Since `Python` belongs to an open source community, it has been ported (that is,
    adapted to work on) to many many platforms so that `Python` code written on one
    platform can run without modification on others (except system-dependent features).
    `Python` has been posted for popular operating systems including `Linux`, `Windows`,
    `Macintosh`, `Solaris`, and `Sony PlayStation`.


    ### 1.1.7 Extensibility


    Rather than providing all functionalities in its core program, `Python`’s creators
    designed it to be highly extensible. Users can thus choose to have functionality
    as per their requirements. For example, if a user needs to work on differential
    equations, then that user can use a module for differential equations rather than
    all users having that functionality but never using it. `Python` can also be embedded
    in existing applications that need a programmable interface.


    `Python` programs can be embedded into other programs written in programming languages
    such as `Julia`, `C`, `C++`, and so on. Furthermore, other programming language
    codes can be embedded into `Python`. This feature has enabled the use of a lot
    of legacy code written in other languages and already optimized for speed and
    stability, thus avoiding the replication of efforts and hereby tremendously increasing
    the productivity of an organization. Hence, `Python` has been embraced with open
    arms by industry and academia alike.


    ## 1.2 History


    The development of the `Python` programming language dates back to the 1980s.
    `Guido van Rossum` at `CWI` in the Netherlands began implementing it in December
    1989. This was an era when computing devices were becoming increasingly powerful
    and reliable with every advancing day. `Van Rossum` named the language after the
    BBC TV show *Monty Python’s Flying Circus*. `Python 1.0` was released to the public
    in 1994, `Python 2.0` in 2000, and `Python 3.0` in 2008. However, `Python 3` was
    not created to be backward compatible with `Python 2`, which made it less practical
    for users who were already developing with `Python 2`. As a result, a lot of developers
    have continued using `Python 2`, even now. Nonetheless, the future belongs to
    `Python 3`, which has been developed in a more efficient manner. Hence, we will
    discuss `Python-3`-based codes in this book.


    ### 1.2.1 Python 2 vs. Python 3


    At this point, it is important to note that `Python 3` is not backward compatible.
    The Internet is full of codes written in `Python 2`. It is important to learn
    how to convert these codes from `Python 2` to `Python 3` [[4](#A458920_1_En_1_Chapter.html#Par103),
    [5](#A458920_1_En_1_Chapter.html#Par104)]. You can understand the technical details
    of their differences when you understand their basic structures and basic usage.


    ## 1.3 Python and Engineering


    Engineering problems employ numerical computations both on a small scale and on
    a large scale. Thus, engineering applications require a programming language to
    fit well in both these regimes. There are very few languages that can boast this
    quality, so `Python` is definitely a winner here. While running large computational
    tasks on bigger computational architectures, memory management, speed, and reliability
    are the key parameters. `Python`, being an interpretative language, is generally
    considered to be a slower option in this regard, but its ability to use faster
    codes written in `C`, `Java`, and `Fortran` using the interlinking packages `cython`,
    `jython`, and `f2p` allows speed-intensive tasks to be run in their native language
    within a `Python` code. This ability has relieved a lot of coders around the world
    who wondered if already optimized codes must be rewritten in `Python`.


    Another engineering concern is the ability of a programming language to communicate
    with physical devices efficiently. Electronic devices are connected via wires
    and Bluetooth wireless technology to the Internet. Using an appropriate `Python`
    module, users can connect to a compatible device to derive data from it and then
    visualize it in the desired platform. A variety of microcontrollers allow `Python`
    to run its hardware with ease. `MicroPython` [[6](#A458920_1_En_1_Chapter.html#Par105)]
    is specially designed for this purpose. `MicroPython` is a lean and efficient
    implementation of the `Python 3` programming language, which includes a small
    subset of the `Python` standard library and is optimized to run on microcontrollers
    and in constrained environments. Even microcomputers like `Raspberry Pi` allow
    the running of `Python` programs accessing the input-output devices. This enables
    cost-effective prototyping of an engineering problem.


    Users of `MATLAB` argue that `Simulink` is one of the easiest ways of prototyping
    and simulating an engineering problem because they don’t need to code. Instead,
    users just stitch together pieces of codes represented by graphical blocks on
    a graphics terminal. (`Scilab` also provides a similar platform called `Xcos`.)
    `Python` still lacks this ability and budding programmers can take this up as
    a challenge. A large community of developers is eagerly waiting for such a solution,
    but most engineers won’t mind investing a day or two to learn a new programming
    language that can enhance their productivity that a ready-made tool cannot provide.'
