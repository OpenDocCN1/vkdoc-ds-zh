- fmt: '# 7.10 Polar Plots


    Until now, all the plots we have discussed have been dealing with data defined
    in a Cartesian system. For data defined in a polar system—(`r`, `θ`) instead of
    (`x`, `y`)—polar plots are obtained by the `plot()` function, as shown in Listing
    [7-13](#A458920_1_En_7_Chapter.html#Par88).


    ```

    1  import matplotlib.pyplot as pl

    2  import numpy as np


    4  r = np.arange(0, 10.0, 0.1)

    5  theta = 2* np.pi * r


    7  pl.polar(theta, r, color =''g'')

    8  pl.show()

    Listing 7-13

    polar.py

    ```


    The file produces the graph shown in Figure [7-13](#A458920_1_En_7_Chapter.html#Fig13).


    ![A458920_1_En_7_Fig13_HTML.jpg](A458920_1_En_7_Fig13_HTML.jpg)


    Figure 7-13


    Polar plot


    # 7.11 Decorating Plots with Text, Arrows, and Annotations


    Sometimes, you are required to put text at a specific place on the plot (say coordinated
    (`x`, `y`)). The `text()` function is used to place text, as shown in Listing
    [7-14](#A458920_1_En_7_Chapter.html#Par91).


    ```

    1  import matplotlib.pyplot as pl

    2  import numpy as np

    3  x = np.arange(0, 2*np.pi, .01)

    4  y = np.sin(x)

    5  pl.plot(x, y, color = ''r'');

    6  pl.text(0.1, -0.04, ''$sin(0) = 0$'')

    7  pl.text(1.5, 0.9, ''$sin(90) = 1$'')

    8  pl.text(2.0, 0, ''$sin(180) = 0$'')

    9  pl.text(4.5, -0.9, ''$sin(270) = -1$'')

    10  pl.text(6.0, 0.0, ''$sin(360) = 1$'')

    11  pl.annotate(''$sin(theta)=0$'', xy=(3, 0.1), xytext=(5, 0.7),

    arrowprops=dict(facecolor=''green'', shrink=0.05))

    12  pl.title(''Inserting text and annotation in plots'')

    13  pl.xlabel(''$theta$'')

    14  pl.ylabel(''$y = sin( theta)$'')

    15  pl.show()

    Listing 7-14.

    ```


    The file produces the graph shown in Figure [7-14](#A458920_1_En_7_Chapter.html#Fig14).


    ![A458920_1_En_7_Fig14_HTML.jpg](A458920_1_En_7_Fig14_HTML.jpg)


    Figure 7-14


    Inserting text in the plot


    As seen in Listing [7-14](#A458920_1_En_7_Chapter.html#Par91), the text, arrow,
    and annotations can be placed at appropriate places by defining coordinate axis
    points for them. A convenient method of identifying appropriate coordinates is
    to roll over the mouse on the body of the plot and look for the down-left corner
    of the figure where present mouse coordinates are shown. `help(matplotlib.pyplot.annotate)`
    gives useful inputs to use this function.


    # 7.12 Subplots


    Multiple plots can be plotted using the subplot option where different plots are
    considered to be a matrix of graphs. Just like a regular matrix, elements are
    identified by index. As seen in Listing [7-15](#A458920_1_En_7_Chapter.html#Par95),
    subplots are located using indices like (`222`), which essentially means that
    the matrix is a 2 × 2 and one is accessing the second position to place the `scatter()`
    function-based plot. Similarly (`221`) uses a `plot()` function at the first position,
    (`223`) at the third position plots a histogram using the `hist()` function, and
    (`224`) is the fourth plot using `barh()`, giving a horizontal bar graph.


    ```

    1  import matplotlib.pyplot as pl

    2  import numpy as np


    4  x = np.arange(10)

    5  y1 = np.random.rand(10)

    6  y2 = np.random.rand(10)


    8  fig = pl.figure()


    11  ax1 = fig.add_subplot(221)

    12  ax1.plot(x,y1)


    14  ax2 = fig.add_subplot(222)

    15  ax2.scatter(x,y2)


    17  ax3 = fig.add_subplot(223)

    18  ax3.hist(y1)


    20  ax4 = fig.add_subplot(224)

    21  ax4.barh(x,y2)


    23  pl.show()

    Listing 7-15

    subplot1.py

    ```


    The file produces the graph shown in Figure [7-15](#A458920_1_En_7_Chapter.html#Fig15).


    # 7.13 Saving a Plot to a File


    Most of the time, a graph plotted using `matplotlib` needs to be saved for future
    reference and use. In these cases, the `savefig()` function is used to specify
    the file name, permission, file type, and so on, for the figure. As an example,
    Listing [7-16](#A458920_1_En_7_Chapter.html#Par98) results a file named `plot1.png`
    in the working folder. (Those who are working with IPython can find out about
    the present working directory by typing `pwd`). If you provide a proper path as
    the string argument of the `savefig()` function, a file is created at that path
    provided you have proper privileges to create the same.


    ![A458920_1_En_7_Fig15_HTML.jpg](A458920_1_En_7_Fig15_HTML.jpg)


    Figure 7-15


    Subplots


    ```

    1  import matplotlib.pyplot as pt

    2  import numpy as np

    3  pt.plot (np.arange (10))

    4  pt.savefig (''plot1.png'')

    Listing 7-16

    sqPlot4.py

    ```


    The file produces the graph shown in Figure [7-16](#A458920_1_En_7_Chapter.html#Fig16).


    ![A458920_1_En_7_Fig16_HTML.jpg](A458920_1_En_7_Fig16_HTML.jpg)


    Figure 7-16


    Plotting sin(x) and sin(2x)


    It is important to know the size of the file and the resolution of the figure
    for the purpose of publication at both offline/print and online media. When none
    of the arguments for setting the resolution of the figure and size of the file
    are set within the program, default values are used. These default values can
    be known using the following code:


    ```

    1  >>>import matplotlib as ml

    2  >>>ml.rcParams[''figure.figsize'']

    3  [8.0, 6.0]

    4  # Default figure size is 8 X 6 inches

    5  >>>ml.rcParams[''savefig.dpi'']

    6  100.0

    7  # Default figure resolution is 100 dpi

    ```


    Since a 8 × 6 inch figure is created with 100 dpi (dots/pixels per inch), a 800
    × 600 pixels image is saved using `savefig()` by default. When this file is directed
    toward a computer graphic terminal for displaying, length units are ignored and
    pixels are displayed. If the file is directed toward a printing media like a printer
    or plotter, length parameters and DPI determine figure size and resolution.'
