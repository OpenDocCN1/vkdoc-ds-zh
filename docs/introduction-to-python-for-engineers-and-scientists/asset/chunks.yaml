    ### 9.5.2 复制与深拷贝


    用两个引用值指向同一个对象，看起来像是在复制。之前的讨论中已经观察到，当用户对原始对象进行修改时，两个副本都会受到影响。在处理 `list` 对象时，这可能会成为一个问题：


    ```

    1  >>> list1 = [1,2,3]

    2  >>> list2 = list1

    3  >>> list1

    4  [1, 2, 3]

    5  >>> list2

    6  [1, 2, 3]

    7  >>> list1[1]=-1

    8  >>> list1

    9  [1, -1, 3]

    10  >>> list2

    11  [1, -1, 3]

    ```


    首先，我们创建了一个值为 `[1,2,3]` 的列表对象，其引用值为 `list1`。接着，我们创建了另一个引用值 `list2`，它与原始引用值 `list1`
    都指向同一个原始列表对象（`[1,2,3]`）。当列表中的第二个元素被第 7 行代码修改后，由于这两个引用值都指向同一个对象，因此修改会同时反映在两者上。因此，`list2`
    看起来像是 `list1` 的一个副本，它忠实地跟随其原始对象。让我们探究一下，当列表的成员本身也是列表时，这种模式是否依然成立：


    ```

    1  >>> list1 = [1,2,3]

    2  >>> list2 = [list1,list1]

    3  >>> list1

    4  [1, 2, 3]

    5  >>> list2

    6  [[1, 2, 3], [1, 2, 3]]

    7  >>> list3=list2

    8  >>> list3

    9  [[1, 2, 3], [1, 2, 3]]

    10  >>> list2[1]=[-1,-2,-3]

    11  >>> list1

    12  [1, 2, 3]

    13  >>> list2

    14  [[1, 2, 3], [-1, -2, -3]]

    15  >>> list3

    16  [[1, 2, 3], [-1, -2, -3]]

    ```


    由此可见，即使列表对象的成员本身也是列表对象，复制行为的工作方式与成员是其他对象时相同。


    以下代码展示了使用 `list` 构造函数时会发生什么：


    ```

    1  >>> list1 = list([1,2,3])

    2  >>> list2 = list([list1,list1,list1])

    3  >>> list2

    4  [[1, 2, 3], [1, 2, 3], [1, 2, 3]]

    5  >>> list3 = list(list2)

    6  >>> list3

    7  [[1, 2, 3], [1, 2, 3], [1, 2, 3]]

    8  >>> list2[1]=list([-1,0,1])

    9  >>> list2

    10  [[1, 2, 3], [-1, 0, 1], [1, 2, 3]]

    11  >>> list3

    12  [[1, 2, 3], [1, 2, 3], [1, 2, 3]]

    13  >>> id(list2)

    14  4416356864

    15  >>> id(list3)

    16  4416356936

    ```


    注意，引用值 `list3` 拥有不同的数据，因为它们现在指向两个不同的对象（通过它们的内存 id 值可以看出）。因此，在使用 `list` 构造函数时，原始列表的副本并没有忠实地跟随其原始对象。所以，`list3`
    被称为 `list2` 的**浅拷贝**。


    有时，即使使用了 `list` 构造函数，我们也希望创建一个副本，并在各种变换下保持其不变。为此，名为 `copy` 的模块提供了两个方法：`copy.copy()`
    和 `copy.deepcopy()`。根据 Python 文档 [8]：


    *   **浅拷贝**构造一个新的复合对象，然后（尽可能）将原始对象中找到的对象的引用插入其中。这是通过 `copy` 模块的 `copy.copy()`
    方法执行的。

    *   **深拷贝**构造一个新的复合对象，然后递归地将原始对象中找到的对象的副本插入其中。这是通过 `copy` 模块的 `copy.deepcopy()`
    方法执行的。


    ```

    1  >>>import copy

    2  >>> a = [[1, 2, 3], [4, 5, 6]]

    3  >>> b = list(a)

    4  >>> a

    5  [[1, 2, 3], [4, 5, 6]]

    6  >>> b

    7  [[1, 2, 3], [4, 5, 6]]

    8  >>> a[0][1] = 10

    9  >>> a

    10  [[1, 10, 3], [4, 5, 6]]

    11  >>> b   # 列表 b 也改变了 => 不是深拷贝。

    12  [[1, 10, 3], [4, 5, 6]]

    ```


    现在，让我们看看 `deepcopy` 是如何工作的：


    ```

    1  >>> b = copy.deepcopy(a)

    2  >>> a

    3  [[1, 10, 3], [4, 5, 6]]

    4  >>> b

    5  [[1, 10, 3], [4, 5, 6]]

    6  >>> a[0][1] = 9

    7  >>> a

    8  [[1, 9, 3], [4, 5, 6]]

    9  >>> b    # 列表 b 没有改变 => 深拷贝

    10  [[1, 10, 3], [4, 5, 6]]

    ```


    如你所见，即使 `a` 被修改，它也能使 `b` 保持其值不变。


    ## 9.6 类


    到目前为止，我们只讨论了预定义的对象，并查看了它们的 `type` 和内存 `id`。通过使用一种称为类的特殊对象类型，我们可以创建其他对象。


    类的概念也源自自然界。现实世界中的对象根据其属性和行为进行分类。一个对象仅仅是其类的一个实例。例如，男人和女人仅仅是智人这个类的实例。类似地，关键字 `class`
    定义了一类对象，可以为该类定义各种实例。例如，一个数字类可以有整数、浮点数、复数、有理数和无理数等实例。一旦定义，该类的所有成员将共享数字共有的某些属性和行为，但它们可以根据差异进一步细分。该类的所有成员将与语言类（包含字符、单词、句子和段落）截然不同。现在，可以定义一个数字类的实例（如整数）和一个语言类的实例（如字符）用于计算。这些各自类的实例将拥有自己的属性和方法（其中一些与它们的类共享，一些是它们自己独有的）。这种面向对象的方法帮助我们将一个复杂系统分解成小的基本单元，以便于研究。


    因此，类定义了一种新的抽象实体的行为，而对象只是该实体的一个特定实例。类和对象有助于以可管理的方式定义函数对数据的操作，无论数据和函数的性质如何，都可以以类似的方式进行管理。接口描述了一个对象的功能，而其实际实现则定义了如何执行这些功能。类具有构造函数（我们已经在
    9.5.2 节中讨论过构造函数 `list()`），它规定了特定类型对象的创建。封装和继承描述了类与其超类的层次结构。这些概念将在后续章节中进一步阐述。


    ### 9.6.1 创建类


    关键字 `class` 用于创建一个类。例如，一个名为 `int` 的内置类定义了用于存储整数的对象的行为。当一个变量与该类的一个对象关联时，它被称为该类的一个实例。例如，语句
    `a=1` 创建了一个名为 `a` 的对象，它是 `int` 类的一个实例。另一方面，语句 `b=1.0` 创建了一个名为 `b` 的对象，它是 `float`
    类的一个实例。根据存储在 `a` 和 `b` 中的对象类型，它们在使用时的行为会有显著差异。


    关键字 `class` 用于创建一个对象。其语法定义规则如下：


    ```

    1  class 类名:

    2    ''''''可选的类文档字符串''''''

    3    语句

    ```


    通常，为了便于使用，类名会以有意义的方式命名。同样，通常会将使用细节放在文档字符串中。该字符串可以通过以下命令访问：


    ```

    类名.__doc__

    ```


    属于特定对象（由类定义）的变量称为字段。这些字段可以通过类内部为此目的定义的函数进行探查。这样的函数称为方法。

