- fmt: "### 2.3 Using the Python Interpreter\n\nPython is an interpreted language\
    \ as opposed to compiled languages like C, C++, Java, and so on. Each line of\
    \ code is interpreted and executed as bytecode as opposed to a single machine\
    \ code file. This makes the architecture of computation quite different from traditional\
    \ languages. For example, suppose line 5 of a multiline Python program has a syntax\
    \ error. In this case, the program will execute all commands up to line 4 and\
    \ will then show an error. In the case of compiled languages, the compilation\
    \ steps would show an error and the program would not run at all in the sense\
    \ that it would not make the machine code file. To understand this difference\
    \ in detail, you first need to understand the processes of compilation and interpretation.\n\
    \n![A458920_1_En_2_Fig3_HTML.jpg](A458920_1_En_2_Fig3_HTML.jpg)\n\nFigure 2-3\
    \ Python interpreter running on Mac OS X\n\nIn the case of compiled languages,\
    \ a compiler translates the human-readable code into a machine-readable assembly\
    \ language. Machine readable code is called object code given by object files.\
    \ These object files can be run directly on machines. As an example, let’s assume\
    \ that a C code is defined as follows and stored in a file named `hello.c`:\n\n\
    ```\n1  /∗ Hello World program ∗/\n\n3  #include \n\n5  main()\n6  {\n7  printf\
    \ (\"Hello World\");\n\n9  }\n```\n\nTo compile this code on a UNIX-like machine\
    \ with a `gcc` compiler, we give the following command:\n\n```\ngcc hello.c -o\
    \ hello\n```\n\nThis creates an object code named `hello`. During compilation,\
    \ the header `stdio.h` is used to understand the input-output statements such\
    \ as `printf(\"Hello World\")`. The object code can then be executed by writing\
    \ on a UNIX terminal:\n\n```\n./hello\n```\n\nThe user can share the object file\
    \ and, if the microprocessor architecture is the same as that of another user,\
    \ it will be executed uniformly. If, however, the architecture of the machine\
    \ is different, the source code must first be compiled for the target machine\
    \ and then made to execute.\n\nThis is not the case with Python. Being an interpreted\
    \ language, it employs an interpreter that interprets the code into an intermediate\
    \ code and then to machine code. An interpreter reads the source text of a program,\
    \ analyzes it, and executes it one line at a time. This process is slow since\
    \ the interpreter spends a lot of time analyzing strings of characters to figure\
    \ out what they mean. For example, to type `hello world` as in a C program, Python\
    \ will require the following:\n\n```\n1  >>>print (\"hello world\")\n2  >>>hello\
    \ world\n```\n\nIn just one line, an interpreter scans the world `print` and looks\
    \ for what it means. In the Python interpreter, it means to print to a particular\
    \ device. A device can be a computer terminal, printer plotter, and so forth.\
    \ By default, it is a computer terminal. The `print` command also demands arguments\
    \ that are scanned in the second step as a string `hello world`. (A string in\
    \ Python can be enclosed in `\"` or `\"\"`). Hence, the complete interpretation\
    \ of the line is to print the string `hello world` on a computer terminal.\n\n\
    When a program composes hundreds and thousands of lines, a compilation process\
    \ will yield a faster result because the object code needs to be only compiled\
    \ once and then run directly on a microprocessor. An interpreted code will check\
    \ for interpretations each time it needs to be processed. On the other hand, even\
    \ a single syntax error will not let the compilation process complete, resulting\
    \ in compilation error. Conversely, a Python interpreter will interpret the Python\
    \ code up to the point where any kind of error is encountered.\n\nDespite its\
    \ being inherently slow, Python has become a favorite among scientists and engineers\
    \ for being extremely simple, intuitive, and powerful due to its rich library\
    \ of modules for various computational tasks.\n\n### 2.4 Anaconda IDE\n\nAnaconda\
    \ IDE (Integrated Development Environment) is one of the most convenient and complete\
    \ ways to get a working environment for a beginner as well as for an experienced\
    \ developer. An IDE presents a Python command line interpreter—a text editor with\
    \ advanced features like syntax completion, keyword highlighting, and file browser.\
    \ Anaconda provides all of these and many more features in a simple and intuitive\
    \ way. It can be installed in a very simple manner using the graphical installer\
    \ provided at its web site [[3](#A458920_1_En_2_Chapter.html#Par102)].\n\n![A458920_1_En_2_Fig4_HTML.jpg](A458920_1_En_2_Fig4_HTML.jpg)\n\
    \nFigure 2-4 Anaconda IDE\n\nThe Spyder IDE within Figure [2-4](#A458920_1_En_2_Chapter.html#Fig4)\
    \ provides an easy way to use an IDE environment for development of Python files.\
    \ It presents three panes:\n\n1.  **Editor**\n    *   You can write a multiline\
    \ program here and execute it by clicking `Play` or clicking the `Run` option\
    \ in the main menu bar.\n\n    ![A458920_1_En_2_Fig5_HTML.jpg](A458920_1_En_2_Fig5_HTML.jpg)\n\
    \n    Figure 2-5 Anaconda IDE\n\n2.  **IPython Console**\n    *   You can write\
    \ Python expressions here and execute them by pressing the `Enter` key.\n\n3.\
    \  **Variable Explorer / File Explorer / Help**\n    *   **Variable Explorer**\n\
    \        *   The variable explorer presents the details of all variables (explained\
    \ later) created during a session and their properties (name, type, size, and\
    \ values).\n    *   **File Explorer**\n        *   The file explorer presents\
    \ the details of all files created during a session and their properties (name,\
    \ size, kind, and date modified).\n    *   **Help**\n        *   This tool presents\
    \ useful documentation on any topic inquired by a developer.\n\nWe have written\
    \ this book using Anaconda IDE on a Mac OS X 10.12.6 system. Since Python programs\
    \ are portable, they will run in a similar fashion to any Python 3 interpreter.\n\
    \n### 2.5 Python as a Calculator\n\nLet’s start working with the Python interpreter\
    \ to understand it more clearly. To begin, type the command following the Python\
    \ interpreter’s command prompt `>>>` and press the `Enter` key on the keyboard.\n\
    \nIn its simplest form, the Python interpreter can be used as a calculator. On\
    \ the Python command prompt, the following commands can be checked for `2 + 4`:\n\
    \n```\n1  >>>2+4\n2  6\n3  >>>2.+4\n4  6.0\n5  >>>2.0+4\n6  6.0\n7   >>>2.0+4.\n\
    8  6.0\n9  >>>2.0+4.0\n10  6.0\n```\n\nAs per these calculations, `2 + 4` yields\
    \ `6`, whereas `2 + 4.` yields `6.0`. `6` and `6.0` are two different objects\
    \ for a computer. `6` is an integer stored in lesser space than `6.0`, which is\
    \ a floating point number. Just like two types of numerical data, data can be\
    \ classified in different kinds of objects (need not be numeric). Python treats\
    \ all entries as objects. An object needs to be defined with its attributes/properties.\
    \ For example, a floating point number has different rules of addition, subtraction,\
    \ printing on screen, and representation of graphs when compared to an integer.\
    \ For this reason, a floating point number is a quite different `data type` when\
    \ compared to an integer. A detailed list of data types will be discussed later.\n\
    \nIt is also important to note that to define the floating point number `4.0`,\
    \ writing even `4.` is sufficient. `4.0` and `4.` are equivalent. Similarly, `0.4`\
    \ and `.4` both mean the mathematical number `0.4`. Also, Python dynamically assigned\
    \ the `type` to the objects defined by analyzing their values, so `2` became an\
    \ `int` (integer type) and `2.0` became a `float` (floating point number type)\
    \ of numerical data. We did not explicitly define an object’s type; it was dynamically\
    \ assigned by the interpreter. We can explicitly define the type, too. This involves\
    \ using the functions for a particular type of data. The following code explains\
    \ this phenomenon by using two functions, `int()` and `float()`, which convert\
    \ the given input (inside the parentheses) to integers and floating point numbers\
    \ respectively.\n\n```\n1  >>> int (2)\n2  2\n3  >>> int (2.0)\n4  2\n5  >>> float\
    \ (2)\n6  2 . 0\n7  >>> float (2.0)\n8  2.0\n```"
