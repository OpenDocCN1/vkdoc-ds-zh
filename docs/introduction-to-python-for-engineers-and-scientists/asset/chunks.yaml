    6  >>> numpy.sort(a)

    7  array([[ 0.22264919,  0.41722141,  0.51389165,  0.65372872],

    8  [ 0.0830597 ,  0.19754059,  0.44351731,  0.78218154],

    9  [ 0.24111783,  0.49219332,  0.5021453 ,  0.54915984]])

    10  >>> numpy.sort(a, axis=1) # sorting along columns

    11  array([[ 0.22264919,  0.41722141,  0.51389165,  0.65372872],

    12  [ 0.0830597 ,  0.19754059,  0.44351731,  0.78218154],

    13  [ 0.24111783,  0.49219332,  0.5021453 ,  0.54915984]])

    14  >>> numpy.sort(a, axis=0) # sorting along rows

    15  array([[ 0.19754059,  0.49219332,  0.0830597 ,  0.41722141],

    16  [ 0.51389165,  0.65372872,  0.22264919,  0.44351731],

    17  [ 0.54915984,  0.78218154,  0.24111783,  0.5021453 ]])

    ```


    A variety of sorting algorithms exists. The choice of the algorithm can depend
    on the requirements for average speed, worst-case scenario, workspace size, and
    stability. `numpy` documentation at [[4](#A458920_1_En_6_Chapter.html#Par204)]
    lists three choices as follows:


    Sorting an array of complex numbers is accomplished by `sort_complex()`. (See
    Table [6-2](#A458920_1_En_6_Chapter.html#Tab2).)


    **Table 6-2** Sorting Algorithms


    | Kind | Speed | Worst Case | Workspace | Stable |

    | --- | --- | --- | --- | --- |

    | ‘quicksort’ | 1 | O(n ²) | 0 | no |

    | ‘mergesort’ | 2 | O(n × log(n)) | ![$$ \frac{n}{2} $$](A458920_1_En_6_Chapter_IEq1.gif)
    | yes |

    | ‘heapsort’ | 3 | O(n × log(n)) | 0 | no |


    ```

    1  >>> a = numpy.array([4-3j, 4+5j, 3-8j])

    2  >>> a

    3  array([ 4.-3.j,  4.+5.j,  3.-8.j])

    4  >>> numpy.sort_complex(a)

    5  array([ 3.-8.j,  4.-3.j,  4.+5.j])

    ```


    ### 6.14.5 Rounding Off


    Rounding off numbers is performed by the function `around()` with the same logic
    as in mathematics. (If a numeral is 5 or more, the preceding numeral is incremented
    by 1.)


    ```

    1  >>> a = numpy.random.rand(10)

    2  >>> a

    3  array([ 0.15342238,  0.90475845,  0.90006375,  0.68768342, 0.14153903,

    4  0.07962712,  0.59819738,  0.76087737,  0.97013725,  0.1560855 ])

    5  >>> numpy.around(a)

    6  array([ 0.,  1.,  1.,  1.,  0.,  0.,  1.,  1.,  1.,  0.])

    7  >>> numpy.around(a).astype(int)

    8  array([0, 1, 1, 1, 0, 0, 1, 1, 1, 0])

    ```


    ## 6.15 `asarray()` and `asmatrix()`


    A variety of variables is not defined as arrays, but if at a certain point of
    time during computation they need to be considered as an array or as matrix, `asarray()`
    and `asmatrix()` can be used:


    ```

    1  >>> (a,b,c,d) = (1,2,3,4)

    2  >>> array1 = numpy.asarray([a,b,c,d]) # defined as array

    3  >>> array1

    4  array([1, 2, 3, 4])

    5  >>> matrix1 = numpy.asmatrix([a,b,c,d]) # defined as a matrix

    6  >>> matrix1

    7  matrix([[1, 2, 3, 4]])

    8  >>> string = ''Hello world''

    9  >>> string

    10  ''Hello world''

    11  >>> array2 = numpy.asarray(string) # defined as array

    12  >>> array2 # indicates that data type is strong with 11 characters

    13  array(''Hello world'',

    14  dtype=''<U11'')

    ```


    ## 6.16 Summary


    Array-based computing is used as a primary force to solve equations and systems
    of equations. Using slicing and indexing operations, it provides powerful tools
    to manipulate data using a program. Since this book is an interactive text on
    Python, discussion about all functions for indexing and slicing is out of its
    scope.


    Discussing all the facilities of array manipulations that are present in `numpy`
    is beyond the scope of any textbook. Moreover, new functionalities are added with
    each new version. However, some quite important functions have been discussed
    in this chapter.


    Python’s ability to flexibly create a variety of arrays and to compute using various
    mathematical functions makes it one of the most preferred languages in the field
    of computational physics and mathematics. Another fact that makes it a preferable
    programming language among members of the scientific community is its ability
    to plot publication-quality graphs with relative ease, which we will discuss in
    Chapter [7](#A458920_1_En_7_Chapter.html).


    # 7. Plotting


    ## 7.1 Introduction


    Plotting data is one of the most essential parts of numerical computation. In
    pre-processing, during computation, and in post-processing, the ability to plot
    data on different kinds of graphs is essential. Visualization of data in a convenient
    format allows for better understanding of the process. Visual clues generate a
    lot of information about the process that generated that particular data. You
    can easily look for errors and derive simple as well as complex interpretations.
    A good programming language must incorporate facilities to plot data easily. Plotting
    two-dimensional (2-D) and three-dimensional (3-D) graphs is vital for creating
    a good visualization product. Python users have a number of choices in this regard.


    In this chapter, we will discuss some of the choices. Essential requirements while
    choosing a plotting library depends on requirements of the data, such as the following:


    * Plotting on 2-D or 3-D graphs

    * Plotting live data or static data

    * Plotting large data quickly

    * Saving plots in a variety of formats

    * Plotting data with a chosen resolution to keep a check on file size


    The plotting library used for this chapter is called `matplotlib`. Just like any
    other module, it can be installed using `pip` on an Ubuntu system. For Windows
    and Mac OS X users who use Anaconda IDE, this library is pre-installed in the
    system.


    ## 7.2 `matplotlib`


    John Hunter, the creator of `matplotlib` [[1](#A458920_1_En_7_Chapter.html#Par201)],
    rightly stated that “`matplotlib` tries to make easy things easy and hard things
    possible [[2](#A458920_1_En_7_Chapter.html#Par202)].”


    In some cases, with just one line of code, you can generate a high-quality, publication-ready
    graphics visualization of the problem at hand. Before Python, `gnuplot` was used
    to plot the data passed by a Python script. With `matplotlib` available, this
    action has become very flexible. `matplotlib` was modeled after the graphic capabilities
    of MATLAB, which came as a boon for programmers who were already well versed with
    MATLAB. Some of the major advantages of using `matplotlib` over other plotting
    libraries are as follows:


    * It is integrated with LaTeX markup.

    * It is cross-platform and portable.

    * It is open sourced so users don’t have to worry about license fees.

    * Being part of Python, it is programmable.


    `matplotlib` stands for mathematical plotting library. It is one of the most popular
    plotting libraries among programmers owing to its simple and intuitive commands
    as well as its ability to produce high-quality plots that can be saved in variety
    of formats. It supports both interactive and noninteractive modes of plotting
    and can save images in a variety of formats including JPEG, PS, PDF, and PNG.
    It can utilize a variety of window toolkits like GTK+, wxWidgets, and QT. The
    most attractive feature is that it has a variety of plotting styles such as line,
    scatter, and bar charts as well as histograms and many more. It can also be used
    interactively with IPython. `numpy` is necessary for working with `matplotlib`.
    Hence, it must be installed on the system before you can work with `matplotlib`.


    `matplotlib` depends on a certain set of programs for proper executions. These
    dependencies must be first installed [[3](#A458920_1_En_7_Chapter.html#Par203)].
    This installation is automatically done when `pip` is used, but users who wish
    to build it from source must perform the same. This book is intended for beginners,
    so this topic is not illustrated here.'
