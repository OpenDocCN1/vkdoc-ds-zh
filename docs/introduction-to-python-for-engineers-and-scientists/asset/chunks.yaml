- fmt: '# 9.4 Types


    An object has an associated type. Type dictates the memory storage requirements
    and what can be done computationally with an object. For example, `int` and `float`
    are distinct types of an object in the sense that `int` stores integers and `float`
    stores floating point numbers. While `float` needs to store information about
    how many digits precede and succeed the decimal point, `int` objects do not need
    to worry about the same. Similarly, a complex number is stored in another type
    of object (aptly named `complex`) since it needs to store two aspects of a complex
    numbers: their real and imaginary parts. In this way, they must be stored quite
    differently in computer memory and then used quite differently in subsequent computations.


    The type of an object can be obtained by using the built-in function called `type()`,
    which takes the object whose type needs to be scanned. For example:


    ```

    1  >>> a =1

    2  >>> type(a)


    4  >>> b=1.0

    5  >>> type(b)


    7  >>> c =2+3j

    8  >>> type(c)


    10  >>> d = ''d''

    11  >>> type(d)


    13  >>> e = ''addition''

    14  >>> type(e)


    16  >>> f = [1,2,3]

    17  >>> type(f)


    19  >>> g = 1,2,3

    20  >>> type(g)


    22  >>> import numpy as np

    23  >>> a=np.array([1,2,3])

    24  >>> type(a)


    26  type(np.sin)

    ```


    From this practice code, it is easy to understand that line 1 is found to make
    an object of the type integer (`int`), line 4 is found to make an object of the
    type floating point number (`float`), line 7 is found to make an object of the
    type complex number (`complex`), lines 10 and 13 are found to make an object of
    the type string (`str`), line 16 is found to make an object of the type list (`list`),
    line 19 is found to make an object of the type tuple (`tuple`), line 23 is found
    to make an object of the type numpy array (`numpy.ndarray`), and line 1 is found
    to make an object of the type a numpy function called `numpy.ufunc`.


    ## 9.5 Object Reference


    Pythonic objects are represented as a reference to an object in memory. A reference
    is a value that references (points to) a memory location. This can be understood
    by the following example, which uses the `id()` function. The `id()` function
    returns a unique number representing the memory address of storage of input variable:


    ```

    1  >>> a1 = 10

    2  >>> id(a1)

    3  4469844832

    4  >>> a2=a1

    5  >>> id(a2)

    6  4469844832

    7  >>> a3=20

    8  >>> id(a3)

    9  4469845152

    10  >>> a3=a2

    11  >>> id(a2)

    12  4469844832

    13  >>> id(a3)

    14  4469844832

    15  >>> a1

    16  10

    17  >>> a2

    18  10

    19  >>> a3

    20  10

    ```


    As seen in the Python code, `a1` is assigned a value of 10. In Python’s language,
    an integer object is created (at a memory location whose id is given by 4469844832).
    The built-in function `id()` can be used to probe the memory location’s id.


    When `a2=a1` statement is issued, we find that same id is assigned to both reference
    values `a1` and `a2`. This is checked next. Now another integer object with value
    20 is created and referenced with value `a3`. Its id is probed and found to be
    different from `a1` and `a2`. Hence, each time an object is created, it is stored
    in different memory location. In other words, it is given a different id.


    What happens when an object is referenced by two reference values. When we issue
    the command `a3 = a2`, `a3` and `a2` reference to the same object as stored in
    `a2`. But `a2` shares the reference with `a1`, which stores an integer object
    valued 10. Hence, now all three reference values `a1`, `a3`, and `a3` reference
    to same integer object having value 10.


    ### 9.5.1 Garbage Collection


    What happened with the integer object 20, which was created at line 7? This object
    was dereferenced. Consequently, this memory location must be deallocated; its
    status should change from currently-in-use to available-for-reuse. This process
    is called garbage collection and is very important for efficient memory management.
    Python performs this automatically.


    One of the most primitive methods is to maintain a reference count. For every
    object, a count of the total number of references to that object is maintained.
    If that count ever falls to 0, it is immediately deallocated. But more advanced
    algorithms [[3](#A458920_1_En_9_Chapter.html#Par203), [4](#A458920_1_En_9_Chapter.html#Par204)]
    are now used for the purpose of ruling out cases where this primitive idea may
    pose a problem. Unfortunately, discussing the ideas about Python’s way of garbage
    collection is beyond the scope of this book. If you are interested in this topic,
    the following references will help in this regard [[5](#A458920_1_En_9_Chapter.html#Par205),
    [6](#A458920_1_En_9_Chapter.html#Par206), [7](#A458920_1_En_9_Chapter.html#Par207)].'
