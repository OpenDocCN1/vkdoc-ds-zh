- fmt: '### 3.4 Saving a Jupyter Notebook


    Users can save a Jupyter notebook as a `.ipnyb` file and open it within the Jupyter
    Notebook environment on any computer. This makes it easier to teach and learn
    Python. A developer can illustrate the usage of Python in a notebook by dividing
    it into sections and giving the sections headings and subheadings, writing codes
    in code cell types, and writing explanatory details in markdown cell types. The
    markdown cell types enable writing mathematical equations using LaTeX commands.


    Users can also save the Jupyter Notebook as a `.py` file (Python program to be
    executed at the Python interpreter). Here all cells except the code cells are
    converted as comments by adding the symbol `#` at the start.


    Jupyter Notebooks can be saved in an HTML format to be used when embedding them
    on a web site. This is useful for online course development. They can also be
    saved as LaTeX files to be built in a particular format or directly as a PDF document.


    The saved files can then be shared with people who wish to learn a particular
    topic. Users can simply run the notebook within the Jupyter Notebook environment.
    This feature benefits classroom teaching quite a lot. The teacher and students
    can execute their Jupyter Notebooks cell-by-cell and understand the concepts in
    an easier fashion. Otherwise, a teacher would have to switch between a presentation
    file and the Python interpreter for a Python teaching session. Users can also
    define a test as well as assignments using this facility.


    ### 3.5 Online Jupyter Environment


    The main web site of Jupyter Notebooks [[7](#A458920_1_En_3_Chapter.html#Par107)]
    provides an online environment on a remote server for all the facilities that
    are provided by a local installation, as mentioned in the preceding sections.
    Here, users are working on a remote computer via the Internet. Each user is provided
    a limited space for working. This space can be shared with a team and users can
    work collaboratively. The screenshot of a Jupyter session is shown in Figure [3-5](#A458920_1_En_3_Chapter.html#Fig5).


    The online session has a sample notebook for a list of languages. Users can use
    the sample Python Notebook to learn the basics. Users can create a directory and
    then use it to store all the Jupyter Notebooks in an organized fashion. These
    notebooks can be downloaded on a local machine and can be used in a local Jupyter
    Notebook session. Users can perform the opposite action too. In other words, they
    can load a local Jupyter Notebook on an online session using the `Upload` button
    in the top-left menu.


    ![A458920_1_En_3_Fig5_HTML.jpg](A458920_1_En_3_Fig5_HTML.jpg)


    Figure 3-5


    A sample online Jupyter Notebook session


    ### 3.6 Summary


    In this chapter, we have illustrated working in an IPython and Jupyter Notebook
    environment. Jupyter Notebook is increasingly being used by developers to propagate
    knowledge to a wider audience since users can package the code and illustrative
    descriptions in one single file. Thousands of Jupyter Notebooks exist on various
    web sites, enabling the number of Python users to multiply at an exponential rate.
    We suggest that users of this book should also make a separate Jupyter Notebook
    for each chapter for their own understanding and release it on the Internet for
    the benefit of others.


    # 4. Data Types


    ## 4.1 Introduction


    The best way to take full advantage of this book is to begin working on an IPython
    prompt by feeding it code and observing the output. You can use Anaconda IDE to
    avoid the need to install the required packages for the book. You can use Spyder
    IDE during an IPython session as well as editor to write multiline files. We suggest
    that you write detailed descriptive comments wherever needed to enhance understanding
    of workflow of the given code. This scheme works uniformly across all platforms.
    In this chapter, we will discuss the various kinds of data in Python and their
    categorization into several data types.


    Modern computers distinguish data in several types. Data can be numbers, characters,
    strings (a group of characters), and so on. In Python, you can define new data
    types as and when required. There are some built-in data types for handling numbers
    and characters. Different data types occupy different amounts of memory. It is
    important to understand your needs and choose a data type accordingly. Data types
    also determine the accuracy of the answer. We will discuss the various built-in
    data types in Python in the sections that follow.


    ## 4.2 Logical


    This type of data stores boolean values `True` or `False` and can be operated
    by boolean operators such as `AND` and `OR`. Most programming languages use the
    values `1` or `0` for boolean values, but Python differs in this approach. Let’s
    explore their usage with some examples.


    Table 4-4


    Truth Table for NOT Operator


    | NOT |   |

    | --- | --- |

    | True | False |

    | False | True |


    Table 4-3


    Truth Table for XOR Operator


    | XOR | True | False |

    | --- | --- | --- |

    | True | False | True |

    | False | True | False |


    Table 4-2


    Truth Table for AND Operator


    | AND | True | False |

    | --- | --- | --- |

    | True | True | False |

    | False | False | False |


    Table 4-1


    Truth Table for OR Operator


    | OR | True | False |

    | --- | --- | --- |

    | True | True | True |

    | False | True | False |


    | Operator | Python Function | Symbolic Function |

    | --- | --- | --- |

    | AND | `and()` | `&` |

    | OR | `or()` | `|` |

    | XOR | `xor()` | `^` |

    | NOT | `not()` |   |


    ```

    1  >>> True

    2  True

    3  >>> False

    4  False

    5  >>> not True

    6  False

    7  >>> not False

    8  True

    9  >>> True and False

    10  False

    11  >>> True or False

    12  True

    13  >>> True ˆ False

    14  True

    15  >>> True ˆ False

    16  True

    ```


    Complex logical statements can be evaluated too. For example:


    ```

    1  >>> (True and True) or (not False)

    2  True

    3  >>> (True or True) or (True and False)

    4  True

    5  >>> not ((True or True) or (True and False))

    6  False

    ```


    It is important to see that the usage of parentheses enables the user to club
    together a logical expression in a meaningful way.


    Logical operations are resultant of comparison operations. For example:


    ```

    1  >>> 2>3 # greater than operator

    2  False

    3  >>> 2==2 # equality operator

    4  True

    5  >>> 2==2.0 # equality operator compares the value and not the type

    6  True

    7  >>> 2==3 # equality operator

    8  False

    9  >>> (2+3)>(2-3) # complex expression evaluated logically

    ```


    ## 4.3 Numeric


    Numeric: There are four types of numeric data types:


    *   `int`: Integers

    *   `float`: Floating point numbers

    *   `complex`: Complex numbers


    ### 4.3.1 Integer


    Python has arbitrary precision for `float`, `long`, and `complex numbers`. As
    a result, the limit of the length of these numbers is subject to the availability
    of memory. The positive side of this architecture is that users are not limited
    to a range of numbers, but they must always ensure that sufficient memory is available
    during the calculation to avoid erroneous results. Python 2 limits the size of
    `int` to bytes (to the same size as in the C programming language), whereas Python
    3 has merged `int` and `long` as `int`. On a 32-bit system, Python 3 stores `int`
    as 32 bits. On a 64-bit computer, it stores `int` as a 64-bit long number.


    The built-in function `type()` presents the data type as follows:


    ```

    1  >>> type(-1)

    <class ''int''>

    4  >>> type(1)

    <class ''int''>

    ```


    As seen in these examples, the Python interpreter allocates data type dynamically.
    In other words, it allocates the data type to the input based on its definition.
    This is quite convenient for a programmer. A `1` automatically becomes an integer
    and a `1.0` becomes a floating point number.'
