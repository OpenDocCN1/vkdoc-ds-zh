- fmt: "### 8.4.1 Scope Rules\n\n`Scope` determines the range of workability for an\
    \ object—in other words, where the object can and cannot be accessed for computations.\
    \ As it is clear by now, the variables defined within a function are defined to\
    \ be local variables, whereas variables defined in the main program are global\
    \ variables that can be accessed anywhere. The Python code `namespace.py` gives\
    \ a better view of this concept, as shown in Listing [8-4](#A458920_1_En_8_Chapter.html#Par27).\n\
    \n```\n1  # Python code to demonstrate the concept\n2  # of namespace and scope\n\
    3  i = 1\n\n5  def my_function1():\n6      i = 2\n7      print(\"value of i in\
    \ my_function()1 scope is\", i )\n\n9  def my_function2():\n10      i = 3\n11\
    \      print(\"value of i in my_function()2 scope is\", i )\n\n13  print('value\
    \ of i in global scope is', i )\n14  my_function1()\n15  print('value of i in\
    \ global scope is', i )\n16  my_function2()\n17  print('value of i in global scope\
    \ is', i )\nListing 8-4\nnamespace.py\n```\n\nThe result is as follows:\n\n```\n\
    1  value of i in global scope is’, 1\n2  value of i in my function()1 scope is’,\
    \ 2\n3  value of i in global scope is’, 1\n4  value of i in my function()2 scope\
    \ is’, 3\n5  value of i in global scope is’, 1\n```\n\nIn the code `namespace.py`,\
    \ the variable named `i` assigned three values:\n\n1.  `i=1` within the main program\n\
    \    *   scope of this variable is global. (It remains the same all through the\
    \ program even if other functions are called.)\n2.  `i=2` within the function\
    \ named `my_function1`\n    *   scope of this variable is local, that is, within\
    \ the function `my_function1`. Outside the function, it loses its definition.\n\
    3.  `i=3` within the function named `my_function2`\n    *   scope of this variable\
    \ is local, that is, within the function `my_function2`. Outside the function,\
    \ it loses its definition.\n\nThe hierarchical structure of scope follows LEGB\
    \ rules. LEGB stands for Local→Enclosed→Global→Built-in.\n\nThis essentially dictates\
    \ in which order the Python interpreter searches for different levels of namespaces\
    \ before it finds the name-to-object mapping. Following are the four levels of\
    \ namespaces:\n\n*   Local: This is within a user-defined function or class method.\n\
    *   Enclosed: This is within an enclosing function, that is, in a case when a\
    \ function is wrapped inside another function.\n*   Global: This signifies the\
    \ uppermost level, that is, the main Python program that is being executed by\
    \ the interpreter.\n*   Built-in: These are special names that the Python interpreter\
    \ reserves for itself.\n\nIf a name cannot found in any of the namespaces, a `NameError`\
    \ will be raised.\n\n## 8.5 Concept of Loops\n\nThe main advantage of using computers\
    \ for calculations when performing repetitive tasks is that they can compute faster\
    \ than humans. The term loop is associated with repetitive calculations because\
    \ a user-defined variable names the values and the computer repetitively shuffles\
    \ the variable values in a specified sequence generated by a condition. For example,\
    \ a user might like to find the square root of the first 10 integers. To perform\
    \ this calculation, the user needs to run the function `sqrt()` on a list of the\
    \ first 10 integers (which can be generated by `range()` function). The list of\
    \ integers can be stored in an integer, and this variable can be put into a loop\
    \ to perform the operation of finding the square root of each member of the list\
    \ one-by-one.\n\n## 8.6 for Loop\n\nWhen the same operation has to be carried\
    \ out on a given set of data, `for` loop is a good choice. For example, suppose\
    \ we simply want to print the individual members of the list. The Python code\
    \ in Listing [8-5](#A458920_1_En_8_Chapter.html#Par46) can be employed.\n\n```\n\
    1  #Python program to illustrate usage\n2  #of for loop\n3  a = ['a',1,3.14,'name']\n\
    \n5  for item in a:\n6      print(\"The current item is: \",item)\nListing 8-5\n\
    ListMembers.py\n```\n\nThe output is printed on the terminal as the following:\n\
    \n```\n1  The current item is: a\n2  The current item is: 1\n3  The current item\
    \ is: 3.14\n4  The current item is: name\n```\n\nIt is worth noting that most\
    \ of the programming languages employ a logical statement defining the initialization,\
    \ condition, and increment for running the code. Python programs employ a different\
    \ strategy where an array is employing a condition and the loop simply iterates\
    \ on each member of the array. This is important for Python programs since Python\
    \ is an interpretive language and is inherently slower in operation. Spending\
    \ time checking a condition each time the loop wishes to take a step is a computationally\
    \ costly affair. Hence, Python devises the computation in such a way that once\
    \ a list/array is formed as per the defined condition, the loop can then run a\
    \ list/array members. In this way, the overall computation time can be reduced.\n\
    \nAs an example to understand the usage of `for` loop for numerical computation,\
    \ let’s suppose we want to find the even Pythagorean numbers such that\n\n![$$\
    \ {a}^2+{b}^2={c}^2 $$](A458920_1_En_8_Chapter_Equa.gif)\n\nThis can be accomplished\
    \ using `for` loop as given in the Python code `pytha.py` shown in Listing [8-6](#A458920_1_En_8_Chapter.html#Par52).\
    \ In this Python code, the user inputs a number denoting the maximum number for\
    \ which this calculation will be performed. This ensures that the calculation\
    \ has a proper end condition (without explicit definition).\n\n```\n1  # Program\
    \ to generate even Pythagorean numbers\n2  # Pythagorean numbers are those numbers\
    \ for which pythagorus equation stands true\n\n4  from numpy import sqrt\n5  n\
    \ = input(\"Please input a maximum number:\") # Asks user to input a number\n\
    6  n = int(n)+1 # converts the values stored in variable n to\ninteger data type\
    \ and adds 1 so that computation can be done\nif user feeds 0\n\n8  # Two loops\
    \ to define arrays for a and b for which c shall be computed\n9  for a in range(1,n):\n\
    10      for b in range(a,n):\n11          c_square = a**2 + b**2\n12         \
    \ c = int(sqrt(c_square)) # c is converted to an integer\n13          if ((c_square\
    \ - c**2) == 0): # if square of a and square of b is equal to square of c then\
    \ the result will be zero\n14              if (c%2 ==0): # checking if c is an\
