    ## 7.21 Summary


    In this chapter, we have discussed various plotting options available while working
    with Python. The ease of plotting data is one of the most attractive features
    of Python. Just a few lines of code provide visualization of the data in a variety
    of ways. Visualization is the backbone of data presentation and analysis since
    it makes understanding of the data clearer. In addition to simple visualization,
    `matplotlib` provides rich features to decorate the graph with useful information
    in a desired manner.


    # 8. Functions and Loops


    ## 8.1 Introduction


    A function is a part of a computer program where a number of programming statements
    is clubbed as a block. It can be called when desired. This enables a modular approach
    to programming tasks and has become very popular among programmers nowadays since
    modules can be edited with ease. Functions receive input parameters and return
    output parameters . When a function is being used, the function name is called
    along with values for input parameters. After execution, a set of output parameters
    is returned. Python functions can be defined at any place in the program, regardless
    of the place from where they are being called. They can even be defined as a separate
    file individually or in a combined manner. Also, they can be called any number
    of times or they may not be called at all, as per the user’s requirements.


    ## 8.2 Defining Functions


    Just like any other language, Python has its own way of defining functions. Following
    is the structure of a Python function:


    ```

    1  def function_name(parameter_1, parameter_2, ...):

    2    """Descriptive string"""

    3    # Comment about statements below

    4    statements

    5    return return_parameters

    ```


    As you can see, a Python function consists of three parts:


    1.  Header: Begins with a keyword (`def`) and ends with a colon (`:`)  

    2.  Descriptive String: A string that describes the purpose of a character and
    can be accessed using the `help()` function  

    3.  Body: An indented (four whitespaces in general) set of Python statements below
    the header


    ### 8.2.1 Function Name


    Function names follow the same rules as variable names in Python. It is a good
    idea to give a function a name that is relevant to its description and to keep
    it short.


    ### 8.2.2 Descriptive String


    An essential part of a defining a function is to define its inner working details
    as a string. When `help()` is used, this descriptive string is displayed to the
    user so the user can understand the function and its usage. The usage of a descriptive
    string is not a compulsory feature, but it is recommended as good programming
    practice. Since the description should be as detailed as possible, it constitutes
    a multiline string. Multiline strings can be written under triple quotes. Even
    if the description is only one line long, it might need to print single or double
    quotes for emphasizing a word or phrase. As a result, the usage of triple quotes
    has been mandated in the definition of a descriptive string.


    ### 8.2.3 Indented Block of Statements


    To define the block of statements that is part of a function, indentation is used
    as a marker. Statements that are indented after the first statement to define
    a function are part of the body of the statement that the function will execute.
    When a statement is written without indentation, the function is exited.


    The rules of defining a function name are the same as those for defining variable
    names. It is important to name them with functionally relevant names so that they
    are easy to recall when needed.


    For example, `fn-hello.py`, as shown in Listing [8-1](#A458920_1_En_8_Chapter.html#Par13),
    does not take any input parameters and simply executes the statements of printing
    the string `Hello world`.


    ```

    1  def greet():

    2      ''''''

    3      greet() just greets with the string

    4      "Hello World!" each time it is called

    5      ''''''

    6      print("Hello world!")


    8  greet()

    Listing 8-1

    fn–hello.py

    ```


    Running the file `fn-hello.py` produces the following output:


    ```

    1  >>>python fn−hello.py

    2  >>>Hello World!

    ```


    ### 8.2.4 Return Statement


    When a function returns a parameters, it doesn’t always need to print the same.
    Returning can be many other kinds of actions apart from simply printing on a screen.
    Returning can include passing the variables or their values to another function
    and/or variables, generating a file of code/data, and generating graphs and/or
    storing the function as a file in a graphic format. The Python file `fn-sq.py`
    prints the square of the first 10 integers, as shown in Listing [8-2](#A458920_1_En_8_Chapter.html#Par17).


    ```

    1  def square(x):

    2      ''''''

    3      square() squares the input value

    4      One must only used numeric data types

    5      to avoid getting error

    6      ''''''

    7      return x*x


    9  for i in range(10):

    10      squared_i= square(i)

    11      print(i, squared_i)

    Listing 8-2

    fn–sq.py

    ```


    Following is the result of running the program:


    ```

    1  >>>0 0

    2  1 1

    3  2 4

    4  3 9

    5  4 16

    6  5 25

    7  6 36

    8  7 49

    9  8 64

    10  9 81

    ```


    Here the function `square` is called inside a “for loop ,” which increments the
    value of the variable `i` from 1 to 10 (generated by the built-in function `range())`.
    The `for` loop structure will be discussed in Section 8.6.


    ## 8.3 Multi-input and Multi-output Functions


    A function can input and return any number of parameters, as shown in Listing
    [8-3](#A458920_1_En_8_Chapter.html#Par22).


    ```

    1  def sum(a,b):

    2      ''''''

    3      sum() takes two inputs and produces

    4      a tuple of inputs and thier sum

    5      ''''''

    6      c = a+b

    7      return a,b,c


    9   results = sum(100,102)

    10  print(results)

    Listing 8-3

    def–multi.py

    ```


    The execution results in:


    ```

    1  >>>(100, 102, 202)

    ```


    ## 8.4 Namespaces


    When we call a function within a program, Python creates a namespace to work within
    this function. The namespaces are containers that store information about mapping
    names to objects. Since multiple functions can be defined within a main program,
    multiple namespaces can exit at the same time independently. They can contain
    the same variable names. Hence, a hierarchy level must be defined for conflict
    resolution. This is defined by scope rules.'
