  trans: '

    # 9.1 引言


    定义对象的概念对人类来说非常自然，因为我们在日常生活中就与各种对象打交道。我们将对象理解为具有以下特征的事物：


    *   一组属性，以及

    *   一组相关的行为。


    婴儿很早就开始学习认识环境中的对象。例如，作为婴儿，我们了解到一个球（对象）有颜色、形状和大小（属性），并且它可以滚动、滑动和弹跳（行为）。20 世纪 70
    年代初，施乐帕克研究中心的艾伦·凯致力于面向对象编程（OOP）[1] 的概念。在开发名为 Smalltalk [2] 的编程语言时，他运用了 OOP 的思想。他的核心思想基于将计算机编程应用于物理模拟。大多数人将现实世界理解为各种对象（具有属性和行为）相互交互。因此，在构建模拟世界时采用相同的理念是很自然的。所有基于
    GUI 的系统都继承了凯在这些思想上的努力成果，而现在所有主流编程语言都严格遵循这些思想。


    # 9.2 过程式编程 vs. 面向对象编程


    在定义计算任务时，你可以定义一组过程，通过使用数据块并按照过程规定的方式连接它们来解决问题。这种强调过程设置而忽略数据类型及其不同使用模式的范式称为过程式编程。另一方面，面向对象编程则强调对象以及它们之间通过运算符（作用于对象，改变其值和其他属性）定义的关系，以解决计算任务。Python
    是一种 OOP 语言。


    # 9.3 对象


    在 Python 的世界里，一切都是对象。但什么是对象呢？对象是一个抽象概念，用来表示可以执行计算的实体。就像物理对象一样，计算机对象也有一组属性和一组相关的行为。数字、字符串、图片、视频和文件都可以被视为对象。在数字中，你可以将对象进一步细分为其他对象，例如整数、浮点数和布尔数，或者它们的无序或有序集合。在字符串中，你可以有字符、单词、句子等等。在文件中，你可以有文本文件、媒体文件、数据文件、脚本文件等等。让我们探索一些常见的
    Python 对象：


    ```

    1  >>>a=10.0

    2  >>>help(a)

    3  Help on float object :


    5  class float(object)

    6  |   float(x) −> floating point number

    7  |

    8  |   Convert a string or number to a floating point number,

    if possible.

    9  .

    10  .

    11  .

    12  >>>b=1+2j

    13  >>>help(b)

    14  Help on complex object:


    16  class complex (object)

    17  |  complex(real[, imag]) −> complex number

    18  |

    19  |  Create a complex number from a real part and an optional

    imaginary part.

    20  |  This is equivalent to (real + imag∗1j)  where imag defaults to 0.

    21  .

    22  .

    23  .

    24  >>>c=10

    25  >>>help(c)

    26  Help on int object:


    28  class int(object)

    29  |  int(x=0) −> int or long

    30  |  int(x, base=10) −> int or long

    31  |

    32  |  Convert a number or string to an integer, or return 0 if        no arguments

    33  |  are given.   If x is floating point, the conversion        truncates towards
    zero.

    34  |  If x is outside the integer range, the function returns a

    long instead.

    35  |

    36  |  If x is not a number or if base is given, then x must       be a string
    or

    37  |  Unicode object representing an integer literal in the given

    base. The

    38  |  literal can be preceded by ''+'' or ''−'' and be surrounded       by whitespace.

    39  |  The base defaults to 10\.  Valid bases are 0 and 2−36\.       Base 0 means
    t o

    40  |  interpret the base from the string as an integer literal.

    41  |>>> int(''0b100'', base=0)

    42  |  4

    43  .

    44  .

    45  .

    ```


    有趣的是，Python 将存储在变量 `a`、`b` 和 `c` 中的三个数字归类为不同的对象类。帮助字符串详细说明了它们的用法。任何需要计算的事物都可以被想象为一个称为对象的实体，它拥有一组属性和一组相关的行为。属性集存储在实例变量中，其行为由称为方法的一组函数来探查。


    命令 `dir()` 会列出与该对象关联的所有方法和属性：


    ```

    1  >>> a=1

    2  >>> dir(a)

    3  [''__abs__'', ''__add__'', ''__and__'', ''__bool__'', ''__ceil__'',    ''__class__'',
    ''__delattr__'', ''__dir__'', ''__divmod__'',     ''__doc__'', ''__eq__'', ''__float__'',
    ''__floor__'',     ''__floordiv__'', ''__format__'', ''__ge__'',          ''__getattribute__'',
    ''__getnewargs__'', ''__gt__'',          ''__hash__'', ''__index__'', ''__init__'',          ''__init_subclass__'',
    ''__int__'', ''__invert__'', ''__le__'',          ''__lshift__'', ''__lt__'',
    ''__mod__'', ''__mul__'', ''__ne__'',          ''__neg__'', ''__new__'', ''__or__'',
    ''__pos__'', ''__pow__'',          ''__radd__'', ''__rand__'', ''__rdivmod__'',
    ''__reduce__'',          ''__reduce_ex__'', ''__repr__'', ''__rfloordiv__'',          ''__rlshift__'',
    ''__rmod__'', ''__rmul__'', ''__ror__'',          ''__round__'', ''__rpow__'',
    ''__rrshift__'', ''__rshift__'',          ''__rsub__'', ''__rtruediv__'', ''__rxor__'',
    ''__setattr__'',          ''__sizeof__'', ''__str__'', ''__sub__'', ''__subclasshook__'',          ''__truediv__'',
    ''__trunc__'', ''__xor__'', ''bit_length'',          ''conjugate'', ''denominator'',
    ''from_bytes'', ''imag'',          ''numerator'', ''real'', ''to_bytes'']


    5  >>> a.__abs__() # 绝对值

    6  1

    7  >>> a.__neg__() # 负值

    8  -1

    9  >>> a.__float__() # 浮点值

    10  1.0

    11  >>> a.bit_length() # 以二进制表示自身所需的位数

    12  1

    ```


    对象可以通过 `for operator` 使用属性进行操作。让我们以上一个案例为例：


    *   `a.__abs__()` 定义了整数对象的绝对值（即值 1）。

    *   `a.__neg__()` 定义了整数对象的负值（即值 -1）。

    *   `a.__float__()` 定义了整数对象的浮点值（值 1.0）。

    *   `a.__hex__()` 定义了整数对象的十六进制值（值 0x1）。

    *   `a.__oct__()` 定义了整数对象的八进制值（值 01）。

    *   `a.bit_length` 返回以二进制表示一个整数所需的位数，不包括符号位和前导零。


    接下来的章节将解释定义对象的方法及其用法。首先，我们需要理解，在计算机中，不同类型的数据必须根据其数学性质以及智能定义计算资源需求的方式，进行不同的处理。

