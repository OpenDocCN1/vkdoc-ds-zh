    # 9.4 类型


    每个对象都有一个关联的类型。类型决定了内存存储需求以及可以对对象进行的计算操作。例如，`int` 和 `float` 是两种不同的对象类型，因为 `int`
    存储整数，而 `float` 存储浮点数。虽然 `float` 需要存储关于小数点前后有多少位数字的信息，但 `int` 对象则无需考虑这些。类似地，复数存储在另一种类型的对象中（恰当地命名为
    `complex`），因为它需要存储复数的两个部分：实部和虚部。因此，它们在计算机内存中的存储方式必然大不相同，并且在后续计算中的使用方式也截然不同。


    对象的类型可以通过使用名为 `type()` 的内置函数来获取，该函数接受需要扫描其类型的对象。例如：


    ```

    1  >>> a =1

    2  >>> type(a)


    4  >>> b=1.0

    5  >>> type(b)


    7  >>> c =2+3j

    8  >>> type(c)


    10  >>> d = ''d''

    11  >>> type(d)


    13  >>> e = ''addition''

    14  >>> type(e)


    16  >>> f = [1,2,3]

    17  >>> type(f)


    19  >>> g = 1,2,3

    20  >>> type(g)


    22  >>> import numpy as np

    23  >>> a=np.array([1,2,3])

    24  >>> type(a)


    26  type(np.sin)

    ```


    从这段练习代码中，很容易理解：第 1 行创建了一个整数类型（`int`）的对象，第 4 行创建了一个浮点数类型（`float`）的对象，第 7 行创建了一个复数类型（`complex`）的对象，第
    10 行和第 13 行创建了字符串类型（`str`）的对象，第 16 行创建了列表类型（`list`）的对象，第 19 行创建了元组类型（`tuple`）的对象，第
    23 行创建了 NumPy 数组类型（`numpy.ndarray`）的对象，而第 26 行创建了一个名为 `numpy.ufunc` 的 NumPy 函数类型的对象。


    ## 9.5 对象引用


    Python 对象被表示为对内存中某个对象的引用。引用是一个指向内存位置的值。这可以通过以下使用 `id()` 函数的例子来理解。`id()` 函数返回一个唯一数字，代表输入变量存储的内存地址：


    ```

    1  >>> a1 = 10

    2  >>> id(a1)

    3  4469844832

    4  >>> a2=a1

    5  >>> id(a2)

    6  4469844832

    7  >>> a3=20

    8  >>> id(a3)

    9  4469845152

    10  >>> a3=a2

    11  >>> id(a2)

    12  4469844832

    13  >>> id(a3)

    14  4469844832

    15  >>> a1

    16  10

    17  >>> a2

    18  10

    19  >>> a3

    20  10

    ```


    如 Python 代码所示，`a1` 被赋值为 10。用 Python 的语言来说，就是创建了一个整数对象（其内存位置的 id 为 4469844832）。内置函数
    `id()` 可用于探查内存位置的 id。


    当执行 `a2=a1` 语句时，我们发现相同的 id 被分配给了引用值 `a1` 和 `a2`。接下来对此进行了验证。现在创建了另一个值为 20 的整数对象，并用引用值
    `a3` 来引用它。探查其 id 后发现，它与 `a1` 和 `a2` 的 id 不同。因此，每次创建一个对象时，它都会被存储在不同的内存位置。换句话说，它被赋予了不同的
    id。


    当一个对象被两个引用值引用时会发生什么？当我们发出命令 `a3 = a2` 时，`a3` 和 `a2` 引用的是存储在 `a2` 中的同一个对象。而 `a2`
    与 `a1` 共享引用，`a1` 存储着一个值为 10 的整数对象。因此，现在所有三个引用值 `a1`、`a2` 和 `a3` 都引用同一个值为 10 的整数对象。


    ### 9.5.1 垃圾回收


    在第 7 行创建的整数对象 20 发生了什么？这个对象被解引用了。因此，这个内存位置必须被释放；其状态应从“正在使用”变为“可重用”。这个过程称为垃圾回收，对于高效的内存管理非常重要。Python
    会自动执行此操作。


    最原始的方法之一是维护一个引用计数。对于每个对象，都会维护一个指向该对象的引用总数。如果该计数降至 0，则立即释放该对象。但现在使用了更高级的算法[3, 4]，以排除这种原始想法可能带来问题的情况。遗憾的是，讨论
    Python 垃圾回收方式的细节超出了本书的范围。如果你对这个主题感兴趣，以下参考文献将有所帮助[5, 6, 7]。

