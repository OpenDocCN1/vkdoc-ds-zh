    ## 8.8 `while` Loop


    A `while` loop has the following syntax:


    ```

    1  while expression:

    2  statement(s)

    ```


    Note that the `statement(s)` are indented for grouping. The `statement(s)` can
    be single or multiple actions. The `condition` is a logical expression. The loop
    iterated until the value of the logical expression is `True`. As soon as it becomes
    `False`, the program control is passed to the next line. `while` loop plays an
    important role in cases where looping must be skipped if the condition is not
    satisfied since none of the statement is executed if the logical expression has
    `False` value.


    The program `while.py` gives an example code demonstrating the working of `while`
    loop. (See Listing [8-8](#A458920_1_En_8_Chapter.html#Par62).) Here another module,
    namely `time`, is used to time taken by two lines of codes for their execution.
    Writing `help(time)` gives important documentation regarding its usage. The function
    `time.clock()` returns a floating point number that represents CPU time since
    the start of the process or the time when this function is called first. By subtracting
    the two, you get a number depicting the number of seconds taken to execute statements.


    ```

    1  # Program demonstrating usage of while loop


    3  # Program to count number of steps and time taken for thier     execution


