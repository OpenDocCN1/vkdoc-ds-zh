    \ 'hello world'\n4  False\n5  >>> a=3\n6  >>> b=[1,2,3,4,5]\n7  >>> a in b\n8\
    \  True\n9  >>> 10 in b\n10  False\n```\n\nThe operator `in` is used extensively\
    \ in checking conditions for loops. It is one of the most convenient ways to run\
    \ a loop. First, you construct a list of as per a defined condition/formula and\
    \ then you run a loop until the condition is satisfied. This approach will become\
    \ clearer in Chapter.\n\n## 5.7 Identity Operator\n\nTo check if two values point\
    \ to the same type of object, an identify operator is used. It returns a boolean\
    \ value `True` if objects on either of its sides are the same and returns `False`\
    \ otherwise:\n\n```\n1  >>> 1 is 1 # both are integer type\n2  True\n3  >>> 1\
    \ is 1.0 # 1 is int and 1.0 is float type\n4  False\n5  >>> 1 is 2 # both are\
    \ integer type\n6  True\n7  >>> '1' is 1 # '1' is str type and other is int type\n\
    8  False\n9  >>> '1' is 1.0 # '1' is str type and other is float type\n10  False\n\
    ```\n\nis not operator is negation of result with is operator .\n\n```\n1  >>>\
    \ 1 is not 1.0\n2  True\n3  >>> 1 is not 1\n4  False\n```"
  trans: "\n# 5.4 算术运算符\n\n数学运算符如 `+`、`-`、`%`、`/` 和 `//`（表 5-4）遵循与数学中相同的逻辑。`a ^ b`\
    \ 写作 `a**b`，而向下取整除法则用 `//` 符号表示。向下取整除法（使用 `//` 符号）是指将商向 −∞ 方向舍入（换句话说，向数轴上左侧最近的整数舍入）：\n\
    \n```\n1  >>> 4.2 % 2.3 #输出为余数\n2  1.9000000000000004\n3  >>> 4.2 / 2.3 # 输出为商\n\
    4  1.8260869565217392\n5  >>> 4.2 + 2.3 # 输出为加法结果\n6  6.5\n7  >>> 4.2 - 2.3 #\
    \ 输出为减法结果\n8  1.9000000000000004\n9  >>> 4.2 ∗∗ 2 # 输出为幂运算结果\n10  17.64\n11  >>>\
    \ 4.2 // 2.3 # 输出为向下取整除法结果\n12  1.0\n```\n\n某些算术运算符也适用于 `string` 和 `list` 对象。例如，`+`\
    \ 在字符串上充当连接运算符；它将两个或多个参数从头到尾连接起来。对于列表数据类型也是如此。此外，`*` 运算符只是根据整数指定的次数重复执行 `+` 操作。如果参数是浮点数，则会遇到错误消息。如果你对字符串和列表应用其他算术运算符，同样会遇到错误消息。以下\
    \ Python 代码展示了这一行为：\n\n```\n1  >>> 'hello' + ' ' + 'world' + '!'\n2  'hello world!'\n\
    3  >>> [1,2,3] + [4,5,6]\n4  [1, 2, 3, 4, 5, 6]\n5  >>> 'hello' ∗3\n6  'hello\
    \ hello hello'\n7  >>> [1,2,3] ∗ 3\n8  [1, 2, 3, 1, 2, 3, 1, 2, 3]\n9  >>> 'hello'\
    \ ∗3.1\n10  Traceback (most recent call last):\n11  File \"\", line 1, in \n12\
    \  TypeError: can't multiply sequence by non-int of type 'float'\n13  >>> [1,2,3]\
    \ ∗3.1\n14  Traceback (most recent call last):\n15  File \"\", line 1, in \n16\
    \  TypeError: can't multiply sequence by non-int of type 'float'\n17  >>> 'hello'\
    \ /3\n18  Traceback (most recent call last):\n19  File \"\", line 1, in \n20 \
    \ TypeError: unsupported operand type(s) for /: 'str' and 'int'\n21  >>> [1,2,3]\
    \ // 3\n22  Traceback (most recent call last):\n23  File \"\", line 1, in \n24\
    \  TypeError: unsupported operand type(s) for //: 'list' and 'int'\n25  >>> 'hello'\
    \ % 3\n26  Traceback (most recent call last):\n27  File \"\", line 1, in \n28\
    \  TypeError: not all arguments converted during string formatting\n29  >>> [1,2,3]\
    \ % 3\n30  Traceback (most recent call last):\n31  File \"\", line 1, in \n32\
    \  TypeError: unsupported operand type(s) for %: 'list' and 'int'\n33  >>> [1,2,3]\
    \ - 3\n34  Traceback (most recent call last):\n35  File \"\", line 1, in \n36\
    \  TypeError: unsupported operand type(s) for -: 'list' and 'int'\n37  >>> 'hello'\
    \ - 3\n38  Traceback (most recent call last):\n39  File \"\", line 1, in \n40\
    \  TypeError: unsupported operand type(s) for -: 'str' and 'int'\n```\n\n如果你从加法的角度来理解数学乘法：`2\
    \ * 5 = 2 + 2 + 2 + 2 + 5`，那么 `*` 在字符串和列表上的行为就很容易理解了。因此，与 `m` 相乘意味着相加 `m` 次。\n\
    \n## 5.5 更改和定义数据类型\n\n对象的数据类型可以根据其定义进行更改。函数 `int()` 通过将输入舍入到最接近的整数来将其转换为整数。类似地，`float()`\
    \ 将答案的类型变为浮点数。所有整数都可以变成浮点数，就像 `4` 也可以定义为 `4.0` 一样。`str()` 函数将其参数转换为字符串对象。值得注意的是，`int()`\
    \ 和 `float()` 函数无法将字符串输入转换为其数据类型。另一方面，将数字输入提供给 `str()` 函数会将其数据类型转换为字符串。它不再是一个数字，而是表现得像一个字符。以下\
    \ Python 代码演示了这一行为：\n\n```\n1  >>> int(4.2345) # 舍入为整数 4\n2  4\n3  >>> int(4.7345)\
    \ # 舍入为整数 4\n4  4\n5  >>> float(4) # 转换为浮点数 4.0\n6  4.0\n7  >>> float(0.4) # 保持为浮点数\
    \ 0.4\n8  0.4\n9  >>> str(4) # 转换为字符串 '4'\n10  '4'\n11  >>> str(4.0) # 转换为字符串\
    \ '0.4'\n12  '4.0'\n13  >>> a = str(4)+str(4.0) # 字符串 '4' 和 '0.4' 被连接\n14  >>>\
    \ a\n15  '44.0'\n16  >>> float ('sandeep')\n17  Traceback (most recent call last):\n\
    18  File \"\", line 1, in \n19  ValueError: could not convert string to float:\
    \ 'sandeep'\n20  >>> int('sandeep')\n21  Traceback (most recent call last):\n\
    22  File \"\", line 1, in \n23  ValueError: invalid literal for int() with base\
    \ 10: 'sandeep'\n```\n\n### 5.5.1 运算顺序\n\nPython 遵循 PEMDAS（括号、指数、乘法、除法、加法、减法）运算顺序。因此，在涉及多个算术运算符的复杂计算中，实体按以下顺序计算：\n\
    \n1.  括号\n2.  指数\n3.  乘法\n4.  除法\n5.  加法\n6.  减法\n\n这可以通过以下 Python 代码进行测试：\n\n\
    ```\n1  >>> 5 + (6−5) ∗ (10 / (−1 / 9)∗∗2)\n2  815.0\n3  >>> 5 ∗ 5 + 5 − 4 ∗∗\
    \ 2\n4  14\n```\n\n### 5.5.2 比较运算符\n\n逻辑运算符对于比较对象至关重要。用于比较的运算符称为逻辑运算符。表 5-3 说明了这些运算符的行为。\n\
    \n逻辑运算符的结果是两个二进制对象之一，恰当地命名为 `True` 和 `False`。在某些编程语言中，二进制运算符表示为 `1` 和 `0`。它们也可以进行相等性比较：\n\
    \n**表 5-3** 比较运算符\n\n| 运算符符号 | 运算符含义 | 示例 |\n| --- | --- | --- |\n| `==` | 等于\
    \ | `1==1` 为 `True`，`1==2` 为 `False` |\n| `!=` | 不等于 | `1!=1` 为 `False`，`1==2`\
    \ 为 `True` |\n| `<>` | 不等于 | `1==1` 为 `False`，`1==2` 为 `True` |\n| `<` | 小于 |\
    \ `1<2` 为 `True`，`2<1` 为 `False` |\n| `>` | 大于 | `1>2` 为 `False`，`2>1` 为 `True`\
    \ |\n| `<=` | 小于等于 | `1<=1` 为 `True`，`1<=2` 为 `True` |\n| `>=` | 大于等于 | `1>=1`\
    \ 为 `True`，`1>=2` 为 `False` |\n\n```\n1  >>> not True\n2  False\n3  >>> a = True\n\
    4  >>> b = False\n5  >>> a and b\n6  False\n7  >>> a or b\n8  True\n9  >>>1 >=\
    \ 2 == 2 >= 1\n10  False\n11  >>>1 >= 2\n12  False\n13  >>>2 >= 1\n14  True\n\
    15  >>>False == True\n16  False\n17  >>>False > True\n18  False\n19  >>>False\
    \ < True\n20  True\n```\n\n## 5.6 成员运算符\n\n成员运算符检查变量的一个或多个值是否是指定序列的成员。如果找到该成员，则返回布尔值\
    \ `True`；否则返回 `False`：\n\n```\n1  >>> 'hello' in 'hello world'\n2  True\n3  >>>\
    \ 'name' in 'hello world'\n4  False\n5  >>> a=3\n6  >>> b=[1,2,3,4,5]\n7  >>>\
    \ a in b\n8  True\n9  >>> 10 in b\n10  False\n```\n\n运算符 `in` 广泛用于检查循环条件。它是运行循环最便捷的方式之一。首先，根据定义的条件/公式构建一个列表，然后运行循环直到条件满足。这种方法将在后续章节中变得更加清晰。\n\
    \n## 5.7 身份运算符\n\n为了检查两个值是否指向同一类型的对象，可以使用身份运算符。如果运算符两侧的对象相同，则返回布尔值 `True`，否则返回\
    \ `False`：\n\n```\n1  >>> 1 is 1 # 两者都是整数类型\n2  True\n3  >>> 1 is 1.0 # 1 是 int\
    \ 类型，1.0 是 float 类型\n4  False\n5  >>> 1 is 2 # 两者都是整数类型\n6  True\n7  >>> '1' is\
    \ 1 # '1' 是 str 类型，另一个是 int 类型\n8  False\n9  >>> '1' is 1.0 # '1' 是 str 类型，另一个是\
    \ float 类型\n10  False\n```\n\n`is not` 运算符是对 `is` 运算符结果的否定。\n\n```\n1  >>> 1 is\
    \ not 1.0\n2  True\n3  >>> 1 is not 1\n4  False\n```\n"
- fmt: '## 5.8 Bitwise Operators


    Data are stored as bits in computers. If we can operate directly on bits, we will
    have great flexibility and fast computation. However, it is difficult for humans
    to comprehend this concept since we are used to numerals defined in decimal format
    rather than binary format. Table [5-4](#A458920_1_En_5_Chapter.html#Tab4) presents
    a list of bitwise operators.


    Table 5-4


    Bitwise Operators


    | Bitwise Operator | Description |

    | --- | --- |

    | `>>` | Bitwise left shift |

    | `<<` | Bitwise right shift |

    | `&` | Bitwise AND |

    | `&#124;` | Bitwise OR |

    | `˜` | Bitwise not |


    The binary composition of an `int` object can be shown using the `bin()` function
    as follows:


    ```

    1  >>> bin(1)

    2  ''0b1''

    3  >>> bin(10)

    4  ''0b1010''

    5  >>> bin(100)

    6  ''0b1100100''

    7  >>> bin(1000)

    8  ''0b1111101000''

    ```


    When printing a binary representation of an integer number, `0b` signifies that
    it is a binary representation. Now, it’s easy to understand the following:


    ![$$ {1010}_2=1\times {2}^3+0\times {2}^2+1\times {2}^1+0\times {s}^0 $$](A458920_1_En_5_Chapter_Equ1.gif)


    (5.1)


    ![$$ =8+0+2+0={10}_{10} $$](A458920_1_En_5_Chapter_Equ2.gif)


    (5.2)


    Thus, `1010[2] = 10[10]`. The decimal integer `10` is stored as the binary number
    `1010`. Bitwise operators operate on this number at the bit level. So, the bitwise
    left shift operator will shift the value of bits one place to left. Likewise,
    the bitwise right shift operator will shift the bit value one step to right. This
    will result in a new binary representation and will be equivalent to a new decimal
    number. For example:


    ```

    1  >>> bin(100)

    2  ''0b1100100''

    3  >>> 100 >> bin(200)

    6  ''0b11001000''

    7  >>> 100>>1

    8  50

    9  >>> bin(50)

    10  ''0b110010''

    11  >>> 100 >> bin(400)

    14  ''0b110010000''

    15  >>> 100 >> 2

    16  25

    17  >>> bin(25)

    18  ''0b11001''

    ```


    The `<<` shifts all bits of `100[100]` (`1100100[2]`) to the left and fills the
    gap with a new `0` and, thus, results in `11001000[2]`, which is equivalent to
    `200[10]`. The `>>` shifts all bits of `100[100]` (`1100100[2]`) to the right
    and results in `110010[2]`, which is equivalent to `50[10]`. Next, the bits are
    shifted two places.


    The logical operators defined in Chapter [4](#A458920_1_En_4_Chapter.html) can
    be used here too. Python’s boolean value `True` is equivalent to `1`, and `0`
    is equivalent to Python’s boolean value `False`. As a result, Tables [4-1](#A458920_1_En_4_Chapter.html#Tab1),
    [4-2](#A458920_1_En_4_Chapter.html#Tab2), [4-3](#A458920_1_En_4_Chapter.html#Tab3),
    and [4-4](#A458920_1_En_4_Chapter.html#Tab1) can be redesigned as table


    *   AND is `1` only if both of its inputs are `1`; otherwise, it’s `0`.

    *   OR is `1` if one or both of its inputs are `1`; otherwise, it’s `0`.

    *   XOR is `1` only if exactly one of its inputs is `1`; otherwise it’s `0`.

    *   NOT is `1` only if its input is `0`; otherwise, it’s `0`.


    Truth tables are useful in understanding their operations.


    By using Table [5-5](#A458920_1_En_5_Chapter.html#Tab5), you can understand the
    following Python code:


    Table 5-5


    Truth Table for AND, OR, NOT, and XOR Operators


    | AND | 0 | 1 |

    | 0 | 0 | 0 |

    | 1 | 0 | 1 |

    | OR | 0 | 1 |

    | 0 | 0 | 1 |

    | 1 | 1 | 1 |

    | XOR | 0 | 1 |

    | 0 | 0 | 1 |

    | 1 | 1 | 0 |

    | NOT | 0 | 1 |

    |   | 1 | 0 |


    ```

    1  >>> 20 and 200

    2  200

    3  >>> 20 or 200

    4  20

    5  >>> bin(20)

    6  ''0b10100''

    7  >>> bin(200)

    8  ''0b11001000''

    ```


    When we write `20` or `200` and `20` and `200`, their binary representations are
    acted upon. The results are also binary numbers that are converted back into integers
    and reported at REPL.


    ### 5.8.1 Using Bitwise Operations


    Bitwise operations find their use while dealing with hardware registers in embedded
    systems. Every processor uses one or more registers (usually a specific memory
    address) that control whether an interrupt is enabled or disabled. When an interrupt
    is enabled, signals can be communicated. Interrupts are enabled by setting the
    enable bit for that particular interrupt and, most importantly, not modifying
    any of the other bits in the register. When an interrupt communicates with a data
    stream, it typically sets a bit in a status register so that a single service
    routine can determine the precise reason for the interrupt. Testing the individual
    bits allows for a fast decode of the interrupt source. This is where bit operations
    come in handy. Shift operators are used to shift the bits as per a formula, whereas
    `AND` and `OR` operations are used to check the status of bits at a specific location.
    The same concept is used to alter the system file permission. In the Linux file
    system, each file has a number called its mode, which indicates the permission
    about accessing the file. This integer can be retrieved in a program to know the
    status of permissions for the file. For example, `if ((mode & 128) != 0) {<do
    this>}` will check the mode by checking if an appropriate bit is `0` in a 128-bit
    system. Bitwise operations are also preferred for their speed of operation since
    they directly operate on bits in the memory.


    ## 5.9 Summary


    Operators play a very important role in computing as they provide the backbone
    of defining pathways for computing. All mathematical functions are expressed either
    by individual operators or by a combination of them. For a programming language
    that caters to a variety of fields such as science, engineering, business, and
    the arts, a lot of different kinds of operators are needed. Python is now being
    applied in various dimensions of life and maturing with a rich library of built-in
    as well as module-wise operators.


    # 6. Arrays


    ## 6.1 Introduction


    Most often during scientific computation, a series of numbers needs to be operated
    upon together. The `list` data type stores a sequence of values. All elements
    of `list` can be accessed by their index, but individual `list` elements can belong
    to any data type. Hence, a new kind of object needs to be defined, similar to
    `list` but that stores only numeric values. This data type is called an `array`.
    This data type is not built in the Python interpreter, but it is within the module
    `numpy`.


    The `numpy` module carries a unique object class called `array`. It carries member
    elements of only one data type. The concept of using arrays to store numerals
    gave rise to a powerful idea of array-based computing. The origins of this method
    can be traced back to matrix algebra. A matrix is also a collection of numbers.
    Similar to matrices, arrays can be multidimensional and can be operated on by
    operators defined the same way as those for mathematical matrices. Using matrices,
    problems involving a system of equations can be solved (which can even be coupled
    to each other) in one instance. Using the method of indexing of elements, particular
    elements can be accessed for operations. Using the concept of slicing, array dimensions
    can be altered as per requirements. Using operators acting on this object, mathematical
    formulations can be implemented. In this chapter, we will discuss the use of arrays
    for mathematical computations.'
