    \ on these data points in a vectorized manner. An array-based computing paradigm\
    \ used for `numpy` and `scipy` becomes advantageous here since the large dataset\
    \ interfaced using `h5py` can be operated as if it’s an array. Thousands of datasets\
    \ can be categorized, tagged, and then saved in a single file.\n\nIn the age of\
    \ the Internet, users might like to fetch data from database servers, perform\
    \ computation on a smaller chunk of data at a time, and send back results to application\
    \ servers for further processing and report generation. For this purpose, Python\
    \ provides a variety of packages. Python has a standard mechanism for accessing\
    \ databases called the Database API (DB-API). The Python DB-API specifies a way\
    \ to connect to databases and issue commands to them. Python DB-API fits nicely\
    \ into existing Python code and allows Python programmers to easily store and\
    \ retrieve data from databases [[2](#A458920_1_En_10_Chapter.html#Par102)].\n\n\
    DB-API includes the following:\n\n*   Connections that encompass the guidelines\
    \ about connecting to databases\n*   Executing statements and stored procedures\
    \ to query, update, insert, and delete data with cursors\n    *   A cursor is\
    \ a Python objects that points to a particular location in the database.\n   \
    \ *   Once a cursor is obtained, various methods like inserting, updating, and\
    \ deleting data as well as querying data can be performed.\n*   Transactions with\
    \ support for committing or rolling back a transaction\n    *   A transaction\
    \ is a sequence of operations performed as a single logical unit of work having\
    \ four distinct properties (ACID: Atomicity, Consistency, Isolation, and Durability).\n\
    \    *   The possibility to roll back a transaction is crucial for securing very\
    \ important data.\n*   Examining metadata on the database module as well as on\
    \ a database and table structure\n    *   Metadata associated with a database\
    \ describes the features of that database.\n    *   The ability to access metadata\
    \ allows developers to use the database judiciously.\n*   Defining the types of\
    \ errors and providing exceptions using Python\n\nA large list of databases has\
    \ been included in the DB-API list, which enables developers to interact with\
    \ multiple databases within a single code.\n\nSpecialized packages like `pandas`\
    \ are designed to perform vectorized operations on large datasets in an efficient\
    \ manner. These are used extensively nowadays in the field of big data. Most often,\
    \ statistical analysis is needed for a dataset. The `pandas` package provides\
    \ most of the statistical functions required for basic as well as advanced statistical\
    \ analysis. Coupled with simple plotting libraries like `matplotlib`, quick verification\
    \ of analysis and the ability to produce publication-quality graphs have extended\
    \ a golden helping hand to developers."
  trans: "\n## 10.5 用于科学与工程的 Python\n\n计算机在科学与工程的理论研究和实验研究中均有应用。在理论研究中，计算机主要用于解决那些需要在现实问题模型内对大量相似或不同数据点进行迭代操作的问题。实验研究则利用计算机进行仪器仪表与控制。因此，理想的科学研究编程语言必须高效地完成这些任务。这里的效率包含以下几个方面：\n\
    \n-   能够以简单、直观且极简的语法编写问题\n-   最短的执行时间\n-   能够以无差错的方式存储和检索大量数据\n-   能够利用并行处理范式处理数据\n\
    -   能够处理海量类型的数据集\n-   面向对象编程\n-   广泛的图形处理能力\n-   架构无关性\n-   适用于多种平台的仪器仪表与控制系统\n\
    -   网络功能\n-   安全性\n-   问题原型开发时间短\n\n让我们根据这些参数来评估 Python，以判断其适用于各种科学任务的程度。这项评估将为用户在将\
    \ Python 用于科学问题之前提供重要线索。\n\n## 10.6 问题原型开发\n\nPython 是一种解释型语言。解释过程省去了在生成机器码之前编译代码的步骤。Python\
    \ 逐行读取代码，一旦某一行被正确解释，便立即输出机器码。解释型语言在问题原型开发方面具有巨大优势，但其执行速度却出了名的慢。\n\n### 10.6.1\
    \ 什么是原型开发？\n\n问题原型开发包括为现实问题构建数学模型，然后使用特定编程语言的语法对该数学模型进行编码。数学建模包含以下步骤：\n\n-   定义变量\n\
    -   标记其本质上是因变量还是自变量\n-   通过将已知数学函数作为假设，设计它们之间的函数关系\n\n一旦数学模型设计完成，就需要通过计算机程序进行测试以产生输出，然后针对所研究的现实问题，从有意义的预测和/或结论的角度对输出进行分析。原型开发涉及重复建模和测试的过程，以便在决定选择某个特定模型并构建完整模型之前，对其进行可行性分析。在此原型开发阶段，用户可以选择忽略其他与效率相关的参数，例如更快的执行速度。\n\
    \n将数学模型转换为计算机程序的过程，涉及用编程语言的语法来表达数学架构。这可以针对模型的一部分进行，也可以整体进行。分部分建模需要各部分之间的兼容性。Python\
    \ 在这方面提供了一系列优势。\n\n### 10.6.2 Python 用于快速原型开发\n\n解释型架构的优势在于减少了调试时间。由于代码是逐行解释的，代码在遇到问题之前都能正常运行。这有助于识别和隔离代码中的问题部分，从而实现更快的调试。总体结果是，原型解决方案的开发时间显著缩短，因为解决方案设计的大部分时间都花在了调试上。除此之外，Python\
    \ 被设计为具有简单、直观且极简的语法，这进一步加速了原型开发过程，为参与解决科学问题的人员节省了时间。借助诸如 `matplotlib` 和 `mayavi`\
    \ 等强大的图形库轻松可视化问题的能力，提升了编码过程的质量，因为错误更容易被发现，并且可以以更好的方式呈现。\n\nPython 具有开源和模块化的结构，通过使用现有代码而不是重新发明轮子，能够更快地进行分部分模型开发。在相同版本的\
    \ Python（Python 2 或 Python 3）中，模块是兼容的。Python 还允许某些语言的代码在 Python 代码中本地运行。使用 `Cython`\
    \ 包，您可以在 Python 程序中嵌入 C 代码。类似地，使用 `Jython` 包，您可以在 Python 程序中嵌入 Java 代码。这使得程序员可以根据自身能力选择不同的编程语言，同时仍然利用\
    \ Python 开发他们的模型，从而弥补他们所用编程语言的不足。这也使程序员能够使用遗留代码，而无需用 Python 重新编写。\n\n## 10.7 大型数据集处理\n\
    \n`h5py` 包使开发人员能够处理 HDF5 二进制数据格式，该格式主要用于高效存储大量数据。然后，可以使用像 `numpy` 和 `scipy` 这样的\
    \ Python 包，以向量化的方式对这些数据点进行数值计算。用于 `numpy` 和 `scipy` 的基于数组的计算范式在此处变得有利，因为通过 `h5py`\
    \ 接口连接的大型数据集可以像数组一样进行操作。数千个数据集可以被分类、标记，然后保存到单个文件中。\n\n在互联网时代，用户可能希望从数据库服务器获取数据，每次处理一小部分数据，然后将结果发送回应用服务器进行进一步处理和报告生成。为此，Python\
    \ 提供了多种包。Python 有一个用于访问数据库的标准机制，称为数据库 API（DB-API）。Python DB-API 指定了连接到数据库并向其发出命令的方式。Python\
    \ DB-API 能很好地融入现有的 Python 代码，并允许 Python 程序员轻松地从数据库存储和检索数据 [2]。\n\nDB-API 包括以下内容：\n\
    \n-   连接：包含关于如何连接到数据库的指南\n-   执行语句和存储过程：使用游标查询、更新、插入和删除数据\n    -   游标是一个 Python\
    \ 对象，指向数据库中的特定位置。\n    -   一旦获得游标，就可以执行各种方法，例如插入、更新和删除数据以及查询数据。\n-   事务：支持提交或回滚事务\n\
    \    -   事务是作为一个单一逻辑工作单元执行的一系列操作，具有四个不同的属性（ACID：原子性、一致性、隔离性和持久性）。\n    -   回滚事务的可能性对于保护非常重要的数据至关重要。\n\
    -   检查元数据：检查数据库模块以及数据库和表结构的元数据\n    -   与数据库关联的元数据描述了该数据库的特性。\n    -   访问元数据的能力使开发人员能够明智地使用数据库。\n\
    -   定义错误类型：并使用 Python 提供异常处理\n\nDB-API 列表中包含了大量的数据库，这使得开发人员能够在单个代码中与多个数据库进行交互。\n\
    \n像 `pandas` 这样的专用包旨在高效地对大型数据集执行向量化操作。这些包如今在大数据领域被广泛使用。数据集通常需要进行统计分析。`pandas`\
    \ 包提供了基础及高级统计分析所需的大部分统计函数。结合像 `matplotlib` 这样简单的绘图库，可以快速验证分析结果，并能够生成达到出版质量的图表，这为开发人员提供了极大的帮助。\n"
- fmt: '# 10.8 Instrumentation and Control


    Python cannot connect to a hardware directly unless the hardware maintains an
    operating system (OS) where Python is installed. There are microcomputers like
    Raspberry Pi (RPi) that do this. Hence, Python codes directly interact with connectors
    where sensors and actuators are connected. Since Python is an open source language,
    running on an open source hardware gives a lot of advantages to developers since
    ready-made solutions can be available in most cases. This reduces the total time
    of development drastically. RPi running Linux OS supports Python using the library
    `rpi.gpio` to perform, read, and write operations at GPIO (general-purpose input/output)
    pins. Thus, using Python code, developers can read electrical signals from sensors
    connected to RPi. Developers can also design complicated electrical systems with
    actuators like motors connected to GPIO pins by programming in Python to drive
    them. In most cases, scientific inputs work in a feedback loop configuration where
    sensors read some physical parameters, and these values are used to drive actuators
    to perform tasks. Python can perform this task with ease. With this whole package
    being defined under open source license, developers are free to reconfigure it
    in any way desired. This enables scientists to develop customized equipment as
    needed for their experiments.


    In the case of hardware not running an OS, Python cannot directly access the underlying
    hardware. It cannot interface directly with the software library modules provided
    by most hardware vendors either. In these cases, Python codes can be written to
    tap communication at a serial port or a USB device that utilizes what is referred
    to as a virtual serial port. In these cases, there are two options for developers:
    writing a C extension in the form of DLL (dynamic-Link library) or using a `ctypes`
    library, which provides methods to directly access function in external DLL. If
    DLL is already available via a vendor, `ctypes` can access its functionalities
    within a Python code.


    Another great module is `PyVisa`[[3](#A458920_1_En_10_Chapter.html#Par103)]. `PyVisa`
    is a Python package that enables the developers to control all kinds of measurement
    devices independently of the interface (for example, GPIB, RS232, USB, and Ethernet).
    This is a great relief for complicated machines since a number of different protocols
    are used to send data over many different interfaces and bus systems (for instance,
    GPIB, RS232, USB, and Ethernet). Sometimes the programming language that a developer
    wishes to use might not have libraries that support both the device and its bus
    system. As a result, Virtual Instrument Software Architecture (VISA) was devised.
    VISA is a standard for configuring, programming, and troubleshooting instrumentation
    systems comprising GPIB, VXI, PXI, Serial, Ethernet, and/or USB interfaces.


    In any case, the responsibility of understanding the signal output from electronic
    devices as well as managing data flow lies with developers. Such developers must
    have sound knowledge of electronics, data communication, and Python programming
    as well as C/C++ programming. Developers must have a clear understanding of transmission
    media and its limits in terms of data transfer rates, signal configuration, and
    data blocks. They must also understand the type of connection, whether it be serial
    or parallel in nature.


    # 10.9 Parallel Processing


    As opposed to a single task being performed in a serial processing paradigm, parallel
    processing devises ways to perform two or more processes at the same time. A process
    is the smallest unit of computation done at a processor. Single-core processors
    can only perform serial processing in the traditional sense. Multicore processors
    are affordable and can be found in most hardwares nowadays where CPS has more
    than one core. Python provides a number of modules that enable multicore processing.


    Two important concepts make up most of the parallel programming framework: threads
    and processes. A process, in the simplest terms, is an executing program. One
    or more threads run within a process. A thread is the basic unit to which the
    operating system allocates processor time. Now two approaches can be employed
    in parallel programming:


    *   Running code via threads

    *   Running code via multiple processes


    A number of “jobs” can be submitted to different threads. Jobs can be considered
    as “subtasks” of a single process. Threads usually have access to the same memory
    areas (in other words, shared memory). This approach requires proper synchronization
    to avoid conflict. For example, if two processes wish to write to the same memory
    location at the same time, conflicts will result in errors. Hence, a safer approach
    is to submit multiple processes to completely separate memory locations (that
    is, distributed memory). In this scenario, each process run completely independent
    from the other. The `multiprocessing` module (`https://docs.python.org/2/library/multiprocessing.html`)
    provides a simple way to allocate processes to parts of the codes that perform
    similar tasks so that they can be performed in a parallel fashion. For example,
    sorting operations on large datasets can be performed in a parallel fashion to
    reduce time. Similar mathematical calculations on different data points can be
    performed in a parallel fashion.


    # 10.10 Summary


    The various features of Python that we have discussed prove that it is a worthy
    candidate for an all-in-one solution for scientific tasks. Since Python is open
    source, the vast number of libraries help to reduce development times and costs.
    The availability to connect to databases of large varieties, to hardwares of varied
    configurations, and to sources on the Internet makes Python a favored option for
    scientific computation. In this chapter, we have not illustrated the usage of
    the individual module for numerical computing and scientific work in general,
    but, instead, we have covered various facilities due to the limitations of the
    scope of one book.


    In this book, we have illustrated the usage of the Python3 programming language
    to a beginner, specifically targeting engineers and scientists. Almost all branches
    of science and engineering requires numerical computation. Python is one alternative
    to perform numerical computation. Python has a library of optimized functions
    for general computation. Also, it has a variety of packages to perform a specialized
    job. This makes it an ideal choice for prototyping a numerical computation problem
    efficiently. Moreover, it has thousands of libraries for specific scientific tasks,
    both software- and hardware-oriented. For this reason, Python is being taught
    at most university to students of engineering and science. The community of developers
    is exponentially increasing. In the near future, don’t be surprised if Python
    takes over the world!'
