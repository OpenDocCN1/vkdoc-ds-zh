    ## 6.4 Automatic Creation of Arrays


    Various functions exist to automatically create an array of the desired dimensions
    and shape. This comes in handy during mathematical calculations where creating
    arrays by hand is a tiresome task.


    ### 6.4.1 zeros( )


    To create an array where all elements are 0, we use the `zeros()` function :


    ```

    1  >>> numpy.zeros((3,4)) # arrays of float tyoe by default

    2  array([[ 0.,  0.,  0.,  0.],

    3  [ 0.,  0.,  0.,  0.],

    4  [ 0.,  0.,  0.,  0.]])

    5  >>> numpy.zeros((3,4),dtype=int) # array of int data type

    6  array([[0, 0, 0, 0],

    7  [0, 0, 0, 0],

    8  [0, 0, 0, 0]])

    9  >>> numpy.zeros((3,4),dtype=complex) # array of complex data type

    10  array([[ 0.+0.j,  0.+0.j,  0.+0.j,  0.+0.j],

    11  [ 0.+0.j,  0.+0.j,  0.+0.j,  0.+0.j],

    12  [ 0.+0.j,  0.+0.j,  0.+0.j,  0.+0.j]])

    13  >>> numpy.zeros((3,4),dtype=str) # array of empty strings

    14  array([['''', '''', '''', ''''],

    15  ['''', '''', '''', ''''],

    16  ['''', '''', '''', '''']],

    17  dtype=''<U1'')

    ```


    During the initialization to zero values for matrix computations, the `zeros()`
    function is extensively used.


    ### 6.4.2 ones( )


    To create an array where all elements are 1, we use the `ones()` function :


    ```

    1  >>> numpy.ones((3,4)) # array of float values

    2  array([[ 1.,  1.,  1.,  1.],

    3  [ 1.,  1.,  1.,  1.],

    4  [ 1.,  1.,  1.,  1.]])

    5  >>> numpy.ones((3,4),dtype=int) # array of int values

    6  array([[1, 1, 1, 1],

    7  [1, 1, 1, 1],

    8  [1, 1, 1, 1]])

    9  >>> numpy.ones((3,4),dtype=complex) # array of complex number values

    10  array([[ 1.+0.j,  1.+0.j,  1.+0.j,  1.+0.j],

    11  [ 1.+0.j,  1.+0.j,  1.+0.j,  1.+0.j],

    12  [ 1.+0.j,  1.+0.j,  1.+0.j,  1.+0.j]])

    13  >>> numpy.ones((3,4),dtype=str) # array of strings

    14  array([[''1'', ''1'', ''1'', ''1''],

    15  [''1'', ''1'', ''1'', ''1''],

    16  [''1'', ''1'', ''1'', ''1'']],

    17  dtype=''<U1'')

    ```


    It is interesting to observe that the complex number `1+o.j` is equivalent to
    `1.0` mathematically , but the data type determines the ways in which the data
    will be stored in computer memory as well as how it will be operated upon using
    operators. So, it should be used judiciously.


    ### 6.4.3 ones_like( )


    Taking its cue from an existing array, `ones_like()` creates a `ones` array of
