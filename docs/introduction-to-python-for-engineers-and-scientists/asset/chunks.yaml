    ## 8.8 `while` 循环


    `while` 循环的语法如下：


    ```

    1  while 表达式:

    2  语句

    ```


    请注意，`语句`通过缩进进行分组。`语句`可以是单个或多个操作。`条件`是一个逻辑表达式。循环会一直迭代，直到逻辑表达式的值为 `True`。一旦其值变为
    `False`，程序控制权将传递给下一行。`while` 循环在条件不满足时必须跳过循环的情况下扮演着重要角色，因为如果逻辑表达式的值为 `False`，则不会执行任何语句。


    程序 `while.py` 提供了一个示例代码，演示了 `while` 循环的工作原理。（参见清单 8-8。）这里使用了另一个模块 `time` 来计算两行代码的执行时间。输入
    `help(time)` 可以获取关于其用法的重要文档。函数 `time.clock()` 返回一个浮点数，表示自进程开始或首次调用此函数以来的 CPU 时间。通过将两者相减，可以得到一个表示执行语句所花费秒数的数字。


    ```

    1  # 演示 while 循环用法的程序


    3  # 计算步数及其执行时间的程序


    5  import time # 此模块用于对代码行进行计时

    6  import numpy as np


    8  i = 0 # 初始化计数器

    9  while(i<10): # 计数器条件

    10      start = time.clock() # 定义存储 time.clock() 值的变量

    11      print("%d 的平方根 = %3.2f:"%(i,np.sqrt(i))) # 打印数字及其平方根

    12      i=i+1 # 递增计数器

    13      timing = time.clock() - start # 打印执行上面两行代码所花费的时间

    14      print("执行时间 = %e 秒 \n" % timing)


    16  print("结束") # 表示条件满足后退出循环

    清单 8-8

    while.py

    ```


