    ## 6.7 广播


    `numpy` 数组的基本运算是逐元素进行的。这意味着数组的维度对于所需操作应该是兼容的。例如，一个 2 列数组和一个 3 列数组是不兼容的，因为第一个数组比第二个数组少一列。


