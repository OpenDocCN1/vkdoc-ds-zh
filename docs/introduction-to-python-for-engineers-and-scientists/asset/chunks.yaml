    6  [4, 4, 4],

    7  [5, 5, 5],

    8  [6, 6, 6],

    9  [7, 7, 7],

    10  [8, 8, 8],

    11  [9, 9, 9]])

    12  >>> b

    13  array([[2, 3, 4],

    14  [2, 3, 4],

    15  [2, 3, 4],

    16  [2, 3, 4],

    17  [2, 3, 4],

    18  [2, 3, 4],

    19  [2, 3, 4],

    20  [2, 3, 4],

    21  [2, 3, 4]])


    23  >>> x, y = numpy.ogrid[0:5, 0:5]

    24  >>> x

    25  array([[0],

    26  [1],

    27  [2],

    28  [3],

    29  [4]])

