- fmt: "## 7.14 Displaying Plots on Web Application Servers\n\nIn the era of connecting\
    \ using the Internet, many problems require plotting interactive graphs on web\
    \ pages. These require different types of plots to be plotted on web pages written\
    \ in different kinds of languages working under different environments. It is\
    \ important to note that `matplotlib` requires graphic user interface requiring\
    \ a X11 connection. Hence, it is important to turn on this faculty on a web application\
    \ server before updating the plots dynamically, generated by `matplotlib`. There\
    \ are two aspects to plotting graphs on computers in general. Coding using a set\
    \ of commands to make a script is known as a frontend task, which requires a backend\
    \ effort. Backend does all the hard work of interacting with graphical capabilities\
    \ of the system to produce a graph in a desired plot. Plots can be plotted interactively\
    \ using backends like `pygtk`, `wxpython`, `tkinter`, `qt4`, and `macosx`, or\
    \ they can be plotted noninteractively (permanently saved as files on a computer)\
    \ using backends like `PNG`, `SVG`, `PS`, and `PDF`. The latter are also known\
    \ as hardcopy backends.\n\nThere are two routes to configure a backend:\n\n1.\
    \ `matplotlibrc` file in the installation directory can be edited to set the `backend`\
    \ parameter to a particular value such as the following example:\n\n    ```\n\
    \    1  backend : WXAgg   # use wxpython with antigrain\n    2  (agg) rendering\n\
    \    ```\n\n    `matplotlibrc` is present at `/etc/matplotlibrc` on a LINUX system.\
    \  \n2. Use `use()` to set a particular backend temporarily:\n\n    ```\n    1\
    \  >>>import matplotlib\n    2  >>>matplotlib.use('PDF')   # generate PDF file\
    \ as\n    3  output by default\n    ```\n\nChoosing one of the ways to set backend\
    \ depends on the application of the program. If the program aims to save plots\
    \ as noninteractive `PDF` files temporarily, method number 2 can be used, which\
    \ works until another program sets the backend differently. Setting the backend\
    \ must be done before `import matplotlib.pyplot` or `import matplotlib.pylab`.\
    \ More information on using various backends for variety of application can be\
    \ found at [`http://matplotlib.org/faq/usage_faq.html#what-is-a-backend`](http://matplotlib.org/faq/usage_faq.html%23what-is-a-backend).\
    \ For a web application server, setting backend as `WXAgg`, `GTKAgg`, `QT4Agg`,\
    \ and `TkAgg` will work.\n\nOne way to save transparent figures as opposed to\
    \ white-colored ones by default is to set `transparent=TRUE`. This is particularly\
    \ important in the case when figures need to be embedded on a web page with predefined\
    \ background color/image.\n\nAnother way of turning interactive mode to `ON` or\
    \ `OFF` is by including commands `matplotlib.pyplot.ion()` and `matplotlib.pyplot.ioff()`,\
    \ respectively.\n\n### 7.14.1 IPython and Jupyter Notebook\n\nWhile working with\
    \ `IPython`, if you wish to work with plots to dynamically change by issuing commands\
    \ at the `IPython` command prompt, you simply issue a command at the UNIX terminal:\n\
    \n```\n1  $ ipython −pylab\n```\n\nThis enables a special `matplotlib` support\
    \ mode in `IPython` that looks for a configuration file looking for the backend,\
    \ activating the proper GUI threading model if required. It also sets the `Matplotlib`\
    \ interactive mode so that the `show()` commands does not block the interactive\
    \ `IPython` shell.\n\nWhen working in the `Jupyter Notebook` environment, issue\
    \ the following command:\n\n```\n1  $ jupyter notebook −−pylab=inline\n```\n\n\
    This command produces the graphs inline, that is, within the body of the code\
    \ in between the command lines where the plot is called. Otherwise, the plots\
    \ pop out in a separate window. Inline mode is useful while designing teaching\
    \ materials. However, before sharing with concerned persons, it should be ensured\
    \ that encoded backends and dependencies are installed on the user’s computer.\n\
    \nAlternatively, you can write `%matplotlib inline` as one of the magic commands\
    \ in the first cells so that all plots are directed to be shown within the framework\
    \ of the web browser interface. This is the preferred approach in most cases,\
    \ especially for teaching Python-based plotting.\n\n## 7.15 Working with matplotlib\
    \ in Object Mode\n\nThe Pythonic way of using `matplotlib` is to use it in object\
    \ mode where explicit definition of an object allows ultimate customization. For\
    \ this purpose, you must define each element of a graph as an object and use the\
    \ properties to customize the same. The hierarchy of three basic objects used\
    \ for the purpose is as follows:\n\n1. `FigureCanvas`: Container class for `Figure`\
    \ instance  \n2. `Figure`: Container class for `axes` instance  \n3. `Axes`: Axes\
    \ are the rectangular areas to hold various plot features such as lines, ticks,\
    \ curves and text.  \n\nWhen working with `matplotlib` in object-oriented mode,\
    \ specify a `FigureCanvas`, which holds `figure(s)` that in turn holds `axes`\
    \ where a variety of plotting features can be implemented. The whole process allows\
    \ customization to any extent that can be imagined. Listing [7-17](#A458920_1_En_7_Chapter.html#Par98)\
    \ explains this concept.\n\n```\n1  import matplotlib.pyplot as plt\n2  fig =\
    \ plt.figure()\n3  # variable fig stores \"figure\" instance\n4  ax1 = fig.add_subplot(221)\n\
    5  # variable ax1 stores the subplot of figure at 1st place in 2 x 1 matrix\n\
    6  ax1.plot([-1, 1, 4], [-2, -3, 4]);\n7  # ax1 iscalled and plot fucntion is\
    \ given to it.\n8  # plot function carries two lists giving x and y axis points\
    \ for graph\n9  ax2 = fig.add_subplot(222)\n10  ax2.plot([1, -2, 2], [0, 0, 2]);\n\
    11  # same logic as for ax1\n12  ax3 = fig.add_subplot(223)\n13  ax3.plot([10,\
    \ 20, 30], [10, 20, 30]);\n14  ax4 = fig.add_subplot(224)\n15  ax4.plot([-1, -2,\
    \ -3], [-10, -20, -30]);\n16  plt.show()\n17  # show the figure on computer terminal\n\
    Listing 7-17\nobjPlot.py\n```\n\nThe resulting plot is given by Figure [7-17](#A458920_1_En_7_Chapter.html#Fig17)."
  raw: "## 7.14 Displaying Plots on Web Application Servers\n\nIn the era of connecting\
