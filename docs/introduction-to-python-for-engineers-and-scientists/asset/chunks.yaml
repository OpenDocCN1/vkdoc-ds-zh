    Using twinx() variable


    ## 7.18 Contour Plots


    In some engineering applications, contour plots become an essential part of interpretation
    because they can define segregation of data into regions based on certain similarities.
    For example, if you imagine a mountain viewed from the top, you can define regions
    of a similar height being shown with a closed loop. Thus, a mountain will be a
    series of loops. Similarly, a 2-D map of a nonuniformly heated region can be viewed
    as contours depicting regions of the same temperature. A region of rainfall can
    be viewed as a contour showing regions of a dissimilar size of droplets.


    Hence, contour lines are also called level lines or isolines. The term iso is
    attached to data points having constant value and the regions of these data points
    are separated by contours.


    For a contour plot , you need x-, y- and z-axes where the z-axis defines the height.
    The data with the same height is clubbed together within isolines. (See Listing
    [7-20](#A458920_1_En_7_Chapter.html#Par143).)


    ```

    1  import matplotlib.pyplot as plt

    2  import numpy as np


    4  # defining data for x, y, z axes

    5  x = np.linspace(0,1,100)

    6  y = np.linspace(1,2,100)

    7  (X,Y) = np.meshgrid(x,y)

    8  z = np.sin(X)-np.sin(Y)


    10  # plotting contour

    11  fig = plt.figure()


    13  ax1 = fig.add_subplot(211)

    14  c1 = ax1.contour(x,y,z)

    15  l1 = ax1.clabel(c1)

    16  lx1 = ax1.set_xlabel("x")

    17  ly1 = ax1.set_ylabel("y")


    20  # plotting filled contour

    21  ax2 = fig.add_subplot(212)

    22  c2 = ax2.contourf(x,y,z)

    23  l2 = ax2.clabel(c2)

    24  lx2 = ax2.set_xlabel("x")

    25  ly2 = ax2.set_ylabel("y")


    27  plt.show()


    29  # plotting filled contour

    Listing 7-20

    contour.py

    ```


    The corresponding plot is given in Figure [7-20](#A458920_1_En_7_Chapter.html#Fig20).


    `contour()` and `contourf()` functions can be used to plot unfilled and filled
    contour. A simple command `help(contour)` gives extensive information about setting
    various parameters for a contour plot.


