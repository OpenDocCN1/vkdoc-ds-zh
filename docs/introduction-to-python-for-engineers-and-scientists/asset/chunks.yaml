  trans: "\n# 5.1 引言\n\n运算符的工作方式与数学函数类似。它们在不同域之间建立关系。例如，乘法运算符接收一对有序的操作数（运算符所操作的数据），并生成另一个数据点。这可以对任意数量的数据点进行。通过这种方式，运算符将数据从操作数域转换到结果域。\n\
    \n基本运算符的符号见表 5-1。\n\n**表 5-1** 基本运算符符号\n\n| 数学运算 | 符号 |\n| --- | --- |\n| 加法 |\
    \ `+` |\n| 减法 | `-` |\n| 乘法 | `*` |\n| 除法 | `\\` |\n| 取模 | `%` |\n| 幂运算 | `**`\
    \ |\n\n这些运算符可以以复杂的方式组合起来执行算术运算。根据数据类型的不同，它们会定义各自的功能。例如，对于数值数据，`+` 执行数值加法；而对于字符串，它则执行拼接操作。类似地，乘法运算符应用于字符串时，会将字符串重复拼接相应次数。除法、取模和幂运算符对于字符串没有定义的行为。这种行为可以通过以下\
    \ Python 代码验证：\n\n```\n1  >>> 2+3\n2  5\n3  >>> 'a' + 'b'\n4  'ab'\n5  >>> \"\"\
    hello\" + \" \" + \"world\" + \"!\"\n6  'hello world !\n7  >>> 'a'∗3\n8  'aaa'\n\
    9  >>> 'a'/3\n10  Traceback (most recent call last):\n11  File \"\", line 1, in\
    \ \n12  TypeError: unsupported operand type(s) for /: 'str' and 'int'\n13  >>>\
    \ 'a'%3\n14  Traceback (most recent call last):\n15  File \"\", line 1, in \n\
    16  TypeError: not all arguments converted during string formatting\n17  >>> 'a'∗∗3\n\
    18  Traceback (most recent call last):\n19  File \"\", line 1, in \n20  TypeError:\
    \ unsupported operand type(s) for ∗∗ or pow(): 'str and 'int'\n```\n\n正如第 4 章所讨论的，有多种运算符可以对数据类型进行操作。\n\
    \n下一节将讨论各种内置运算符，包括算术运算符和逻辑/布尔运算符。请注意，运算符的领域并不局限于本章的讨论范围。模块会定义新的数据类型，并为这些类型定义新的运算符。我们将把讨论范围限定在内置的基本运算符上。我们将说明这些内置运算符的用法，以及它们在定义数学计算中的应用。\n\
    \n## 5.2 变量的概念\n\n当运算符作用于数据时，数据的值在计算过程中可能会发生变化。这种情况可能发生多次。为了临时存储值（例如，在计算过程中），我们使用变量。变量通过其地址（可视化为十六进制数）指向内存位置上的特定值。整个设置可以赋予一个符号字符串，称为变量名。\n\
    \n例如，我们可以将值 0.12 存储为变量 `a`，然后在方程中使用它，如\n\n![$$ {1010}_2=1\\times {2}³+0\\times\
    \ {2}²+1\\times {2}¹+0\\times s{s}⁰ $$](img/A458920_1_En_5_Chapter_Equa.gif)\n\
    \n```\n1  >>> a=0.12 # 将值 0.12 赋给名为 'a' 的变量\n2  >>> answer = (a∗∗2) + (10 ∗ a)\
    \ # 执行计算并将结果存储在名为 'answer' 的变量中\n3  >>> print(a)\n4  0.12\n5  >>> print(answer)\n\
    6  1.2144\n7  >>> type(answer) # 检查存储在变量 'answer' 中的值的类型\n\n9  >>> a=5 # 将不同的值重新赋给\
    \ 'a'\n10  >>> print(a) # 新值被反映出来\n11  5\n12  >>> print(answer) # 旧值仍然存储在 'answer'\
    \ 中\n13  1.2144\n14  >>> answer = (a∗∗2) + (10 ∗ a) # 使用新值进行计算\n15  >>> print(answer)\
    \ # 打印出新值\n16  75\n```\n\n这里，数值 0.12 存储在一个名为 `a` 的内存位置。这个变量被后续一个使用变量名 `answer`\
    \ 定义的方程所调用，当打印 `answer` 时，会打印出其中存储的值。存储的值是一个浮点数。对象的类型可以通过函数 `type()` 获知，该函数以变量名作为参数。\n\
    \n这个变量将值更改为新值 5。然而，除非重新执行计算，否则变量 `answer` 存储的是旧的已求值结果。当使用新值 `a` 时，`answer` 的值也会改变。Python\
    \ 变量不需要显式定义其类型。类型是根据它们所指向的值推断出来的。理解变量仅仅是指向内存位置的指针这一点很重要。当值改变时，这些指针会指向不同的地址。是内存存储了数据。数据可以是任何类型。在前面讨论的例子中，数据是数字，但它们可以是任何类型。\n\
    \n### 5.2.1 变量命名规则\n\n由于 Python 会使用某些关键字供自身使用，因此有一些名称不应被用作变量名。此外，还有一些国际公认的规则（通常对大多数编程语言通用）：\n\
    \n- 必须以字母（a–z, A–Z）或下划线（`_`）开头。\n- 其余字符可以是字母、数字或 `_`。\n- 名称区分大小写。\n- 名称长度没有限制，但建议保持简短且有意义。\n\
    - `关键字` 不能用作变量名。\n\n使用 `keyword` 模块，可以通过函数 `keyword.kwlist` 获取关键字列表。`keyword.py`\
    \ 中给出的代码提供了一个关键字列表，这些关键字不能用作变量名。（参见 清单 5-1。）\n\n```\n1  import keyword\n\n3  print\
    \ (\"Python keywords:\", keyword.kwlist)\n清单 5-1\nKeyword.py\n```\n\n运行此代码的结果如下：\n\
    \n```\n1  Python keywords:   ['False', 'None', 'True', 'and', 'as', 'assert',\
    \ 'break', 'class', 'continue', 'def', 'del', 'elif', 'else', 'except', 'finally',\
    \ 'for', 'from', 'global', 'if', 'import', 'in', 'is', 'lambda', 'nonlocal', 'not',\
    \ 'or', 'pass', 'raise', 'return', 'try', 'while', 'with', 'yield']\n```\n\n在交互式会话中，有一种便捷的方法可以检查某个名称是否在关键字列表中。要检查某个特定的变量名是否为关键字，可以使用函数\
    \ `keyword.iskeyword()`。可以将该名称作为字符串输入到此函数中。如下列代码所示，如果输入的字符串是关键字，则返回值 `True`。否则，返回\
    \ `False`：\n\n```\n1  >>>import keyword\n2  >>>keyword.is keyword ('lambda')\n\
    3  True\n4  >>>keyword.is keyword ('lamb')\n5  False\n```\n\n因此，名称 `lambda` 是一个关键字，但名称\
    \ `lamb` 不是。\n"
- fmt: "### 5.3 Assignment Operator\n\nThe concept of variables uses the symbol `=`,\
    \ which is not same as “equal to” in mathematics. Instead, it is one of the assignment\
    \ operators. The symbol `=` assigns the value on the right-hand side to the variable\
    \ name on the left-hand side. This essentially means that it notes down the memory\
    \ location’s address of the value on the left-hand side and links it to the name\
    \ of the variable on the left-hand side. This behavior is demonstrated in the\
    \ following Python code:\n\n```\n1  >>> a = 5 # a is assigned the value 5\n2 \
    \ >>> a # value of a is printed by python REPL\n3  5\n4  >>> print(a) # value\
    \ of a is printed by print() function\n5  5\n6  >>> a = 10 # a is re−assigned\
    \ a new value 10\n7  >>> a # values of a is printed and new value is shown as\
    \ answer\n8  10\n9  >>> b = a # a new variable b is assigned the value pointed\
    \ by a\n10  >>> b # b now stores value last stored by a i.e 10\n11  10\n12  >>>\
    \ a = 15 # a is reassigned a new value 15\n13  >>> a # REPL prints newly assigned\
    \ value for a\n14  15\n15  >>> b # REPL prints the value of b which was last assigned\n\
    16  10\n```\n\nThe value of a variable can be printed by Python REPL by simply\
    \ writing the name of the variable and pressing the `Enter` key. It can also be\
    \ printed using the `print()` function where the name of the variable is taken\
    \ as input (not as a string without quotes). Also, the printed value corresponds\
    \ to the last assigned value. When `b=a` was executed, `a=10` was used. When `a=15`\
    \ was executed, the value of `a` changed, but the value of `b` remained the same.\
    \ This behavior can be understood in the following way:\n\n*   `a=10`\n    * \
    \  The variable `a` points to the memory location storing the value `10`.\n* \
    \  `b=a`\n    *   The variable `b` also points to the same memory location as\
    \ `a`.\n*   `a=15`\n    *   The variable `a` now points to a different memory\
    \ location storing the value `15`.\n    *   The variable `b` still points to the\
    \ memory location storing the value `10`.\n    *   Both will keep doing so unless\
    \ they are reassigned.\n\nIn addition to this simple assignment operator, there\
    \ are more operators that can perform operations. Table [5-2](#A458920_1_En_5_Chapter.html#Tab2)\
    \ provides the information about such assignment operators.\n\n**Table 5-2** Assignment\
    \ Operators\n\n| Operator | Example |\n| --- | --- |\n| `=` | `v = a+b` |\n| `+=`\
    \ | `v +=a ⇒ v = v + a` |\n| `-=` | `v -=a ⇒ v = v - a` |\n| `/=` | `v /=a ⇒ v\
    \ = v / a` |\n| `//=` | `v //=a ⇒ v = v // a` |\n| `*=` | `v *=a ⇒ v = v * a`\
    \ |\n| `**=` | `v **=a ⇒ v = v ** a` |\n| `%=` | `v %=a ⇒ v = v % a` |\n\nAssignment\
    \ operators are the most frequently used features on all kinds of programs. Increment\
    \ and decrement operators like `+=` and `-=`, respectively, are used extensively\
    \ where we need to proceed stepwise. The following Python code will make this\
    \ clear:\n\n```\n1  >>> a = 10 # a is assigned the value 10\n2  >>> a # REPL prints\
    \ value of a\n3  10\n4  >>> b = 0 # b is assigned value 0\n5  >>> b # REPl prints\
    \ the value of b i.e 0\n6  0\n7  >>> b += a # new value of b is b+a i.e 0+10=10\n\
    8  >>> b # REPL prints value of b i.e 10\n9  10\n10  >>> b = 1 # b is reasisgned\
    \ the value 1\n11  >>> b += a # Now b is reassigned the balue b+a i.e 1+10=11\n\
    12  >>> b # REPL prints newly assigned value of b i.e b\n13  11\n```\n\nSimilarly,\
    \ we can test the other operators:\n\n```\n1  >>> a = 10 # a is assigned value\
    \ 10\n2  >>> b = 5 # b is assigned value 5\n3  >>> a # REPL prints value of a\n\
    4  10\n5  >>> b # REPL prints value of b\n6  5\n7  >>> b += a # b is reassigned\
    \ the value b+a=10+5=15\n8  >>> a # a still points to the value 10\n9  10\n10\
    \  >>> b # b points to newly reassigned value of 15\n11  15\n12  >>> b -=a # b\
    \ is reassigned the value b-a=15-10=5\n13  >>> a # a still points to the value\
    \ 10\n14  10\n15  >>> b # b points to newly reassigned value of 5\n16  5\n17 \
    \ >>> b /=a # b is reassigned the value b/a=0.5 i.e the quotient of division operation\n\
    18  >>> a # a still points to the value 10\n19  10\n20  >>> b # b points to newly\
    \ reassigned value of 0.5\n21  0.5\n22  >>> b  //=a # b is reassigned the value\
    \ b/a=0.0 i.e the quotient of floor division operation\n23  >>> a # a still points\
    \ to the value 10\n24  10\n25  >>> b # b points to newly reassigned value of 0.0\n\
    26   0.0\n27  >>> a = 10 # a is reassigned the same value of 10\n28  >>> b = 5\
    \ # b is reassigned a new value of 5\n29  >>> a # a still points to the value\
    \ 10\n30  10\n31  >>> b # b still points to the value 5\n32  5\n33  >>> a ∗= b\
    \ # a is reassigned the value a∗b=10∗5=50\n34  >>> a # a now points to newly reassigned\
    \ value i.e 50\n35  50\n36  >>> b # b still points on value i.e 5\n37  5\n38 \
    \ >>> a ∗∗= b # a is reassigned the value a∗∗b i.e 50 raised to the power 5 i.e\
    \ 312500000\n39  >>> a # a now points to newly assigned value 312500000\n40  312500000\n\
    41  >>> b # b still points to old value i.e 5\n42  5\n43  >>> a %= b # a is reassigned\
    \ the value a%b=312500000%5 i.e remainder of 312500000/5=0\n44  >>> a # a now\
    \ pints to newly reassigned value i.e 0\n45  0\n46  >>> b # b still points to\
    \ old value i.e 5\n47  5\n```\n\nWe also learned about arithmetic operators `+`,\
    \ `-`, `*`, `**`, `/`, `//`, and `%` in the preceding Python code. They will be\
    \ discussed in detail in Section 5.4. They can be used with different number types,\
    \ and mathematical calculations can be performed with ease. The only fact that\
    \ you need to remember is the limits of the maximum number that you can store\
    \ in a particular data type and if an arithmetic operator allows usage of a particular\
    \ data type as one of its arguments.\n\nMultiple assignments within the same statement\
    \ can be done using the `=` operator as follows:\n\n```\n1  >>> a = b = c = 10\n\
    2  >>> a\n3  10\n4  >>> b\n5  10\n6  >>> c\n7  10\n8  >>> c = 15\n9  >>> a\n10\
    \  10\n11  >>> b\n12  10\n13  >>> c\n14  15\n15  >>> a = b = c = 15\n16  >>> a\n\
    17  15\n18  >>> b\n19  15\n20  >>> c\n21  15\n```\n\nIn the preceding Python code,\
    \ first `c=10` assigns value 10 to the variable name `c` and then `b=c` assigns\
    \ the value stored in `c` (that is, 10) to the variable name `b`. Furthermore,\
    \ `a=b` assigns the assigned value of `b` to `a`. Effectively, all three variables\
    \ (`a`, `b`, and `c`) point to same memory location storing an integer 10. When\
    \ `c` is assigned a new value 15, the variable names `a` and `b` keep pointing\
    \ to the memory location storing the value 10, but `c` now points to the new memory\
    \ location for value 15. When multiple assignment for the value 15 is again performed,\
    \ `a`, `b`, and `c` point to the newly assigned memory location pointing to value\
    \ 15.\n\nWhile assigning a value, its data type doesn’t need to be explicitly\
    \ defined. It is judged by the Python interpreter by the data itself. For example,\
    \ `4.0` will be taken as floating point number, `4` will be taken as integer,\
    \ and a single character `'a'` or a group of characters like `'sandeep'` will\
    \ be taken as a string. This is shown in the following example code:\n\n```\n\
    1  >>> a = 4.0; type(a) # a is assigned the value 4.0 and its type is found to\
    \ be floating point number\n2  <class 'float'>\n3  >>> a = 4; type(a) # a is assigned\
    \ the value 4 and its type is found to be integer\n4  <class 'int'>\n5  >>> a\
    \ = 4e10;type(a) # a is assigned the value 4 X 10ˆ10 and its type is found to\
    \ be floating point number\n6  <class 'float'>\n7  >>> b = 'a'; type(a) # b is\
    \ assigned value same as in a i.e 4 X 10ˆ10 and its type is found to be floating\
    \ point number\n8  <class 'float'>\n9  >>> b = 'sandeep'; type(b) # b is reassigned\
    \ a value as string and its type is found to be string\n10  <class 'str'>\n```\n\
    \nIt can be noted that another way of defining a floating point numbers is via\
    \ engineering notation. For instance, `4e10` denotes the engineering notation\
    \ for the number 4 × 10^(10). Also, by using `;`, printing of output at REPL can\
    \ be suppressed. The value of the assignment is suppressed to be printed at REPL,\
    \ but output of the `type()` function is not suppressed and, hence, it is printed\
    \ at REPL."
