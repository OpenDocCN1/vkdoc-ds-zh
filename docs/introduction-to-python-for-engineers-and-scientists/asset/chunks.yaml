    9  b = np.arange(-5, 5, 0.25)

    10  x, y = np.meshgrid(a, b)

    11  z = np.sqrt(x**2 + y**2)


    13  ax.plot_surface(x, y, z, rstride=2, cstride=2)


    15  ax.set_xlabel(''x'')

    16  ax.set_ylabel(''$y$'')

    17  ax.set_zlabel(''$z = \sqrt{x^{2}+y^{2}}$'')

    18  ax.set_title(''Surface type of 3D plot'')


    20  plt.show()

    Listing 7-24

    3Dsurface.py

    ```


