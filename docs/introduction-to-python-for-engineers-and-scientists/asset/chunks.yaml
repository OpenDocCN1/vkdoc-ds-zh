    ### 7.19.2 Wiremesh and Surface Plots


    During computation with discrete values, it is sometimes useful to plot a `wiremesh`
    plot as seen in Figure [7-22](#A458920_1_En_7_Chapter.html#Fig22). As shown in
    Listing [7-23](#A458920_1_En_7_Chapter.html#Par152), the `meshgrid` function is
    used to generate a grid of points using x and y values. Function is generated
    on top of this grid and plotted using the `wiremesh` function. `rstride` and `cstride`
    define the row and column step size:


    ![$$ z=\sqrt{x^2+{y}^2} $$](A458920_1_En_7_Chapter_Equa.gif)


    ![A458920_1_En_7_Fig21_HTML.jpg](A458920_1_En_7_Fig21_HTML.jpg)


    Figure 7-21


    Line and scatter plot in 3D


    ```

    1  from mpl_toolkits.mplot3d import axes3d

    2  import matplotlib.pyplot as plt

    3  import numpy as np


    5  fig = plt.figure()

    6  ax = fig.add_subplot(111, projection="3d")


    8  a = np.arange(-5, 5, 0.25)

    9  b = np.arange(-5, 5, 0.25)

    10  x, y = np.meshgrid(a, b)

    11  z = np.sqrt(x**2 + y**2)


    13  ax.plot_wireframe(x, y, z, rstride=2, cstride=2)


    15  ax.set_xlabel(''$x$'')

    16  ax.set_ylabel(''$y$'')

    17  ax.set_zlabel(''$z = \sqrt{x^{2}+y^{2}}$'')

    18  ax.set_title(''Wiremesh type of 3D plot'')


    20  plt.show()

    Listing 7-23

    3Dwiremesh.py

    ```


    Surface plots are similar to `wiremesh` plots except for the fact that it’s continuously
    filled up. Hence, instead of the `wiremesh()` function, you use the `surface()`
    function. (See Listing [7-24](#A458920_1_En_7_Chapter.html#Par154).)


    ```

