    ## 6.8 提取对角线


    可以使用 `diag()` 函数获取给定数组/矩阵的对角线元素。你可以通过第二个参数选择对角线。默认值为 0，表示主对角线。正值表示向上方向移动。负值表示向下方向移动。


    ```

    1  >>> a = numpy.eye(5) # 创建一个单位矩阵

    2  >>> a

    3  array([[ 1.,  0.,  0.,  0.,  0.],

