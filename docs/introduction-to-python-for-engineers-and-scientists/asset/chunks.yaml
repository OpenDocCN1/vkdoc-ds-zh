  trans: "\n## 7.14 在 Web 应用服务器上显示图表\n\n在互联网连接的时代，许多问题需要在网页上绘制交互式图表。这需要将不同类型的图表绘制在用不同语言编写、在不同环境下运行的网页上。需要注意的是，`matplotlib`\
    \ 需要图形用户界面，而这又需要 X11 连接。因此，在动态更新由 `matplotlib` 生成的图表之前，必须在 Web 应用服务器上开启此功能。通常，在计算机上绘制图表涉及两个方面。使用一组命令编写脚本被称为前端任务，这需要后端工作的支持。后端负责与系统的图形功能进行交互，以生成所需格式的图表。图表可以使用诸如\
    \ `pygtk`、`wxpython`、`tkinter`、`qt4` 和 `macosx` 等后端进行交互式绘制，也可以使用诸如 `PNG`、`SVG`、`PS`\
    \ 和 `PDF` 等后端进行非交互式绘制（永久保存为计算机上的文件）。后者也称为硬拷贝后端。\n\n配置后端有两种途径：\n\n1.  可以编辑安装目录下的\
    \ `matplotlibrc` 文件，将 `backend` 参数设置为特定值，例如以下示例：\n\n    ```\n    1  backend :\
    \ WXAgg   # 使用带有 antigrain (agg) 渲染的 wxpython\n    ```\n\n    在 LINUX 系统上，`matplotlibrc`\
    \ 位于 `/etc/matplotlibrc`。\n2.  使用 `use()` 临时设置特定后端：\n\n    ```\n    1  >>>import\
    \ matplotlib\n    2  >>>matplotlib.use('PDF')   # 默认生成 PDF 文件作为输出\n    ```\n\n\
    选择哪种方式来设置后端取决于程序的应用场景。如果程序旨在临时将图表保存为非交互式的 `PDF` 文件，可以使用方法二，该方法会一直生效，直到另一个程序更改了后端设置。设置后端必须在\
    \ `import matplotlib.pyplot` 或 `import matplotlib.pylab` 之前完成。有关为各种应用使用不同后端的更多信息，请访问\
    \ [`http://matplotlib.org/faq/usage_faq.html#what-is-a-backend`](http://matplotlib.org/faq/usage_faq.html%23what-is-a-backend)。对于\
    \ Web 应用服务器，将后端设置为 `WXAgg`、`GTKAgg`、`QT4Agg` 和 `TkAgg` 即可工作。\n\n与默认保存为白色背景的图形不同，保存透明图形的一种方法是设置\
    \ `transparent=TRUE`。当图形需要嵌入到具有预定义背景颜色/图像的网页中时，这一点尤其重要。\n\n另一种将交互模式设置为 `ON` 或\
    \ `OFF` 的方法是分别包含命令 `matplotlib.pyplot.ion()` 和 `matplotlib.pyplot.ioff()`。\n\n\
    ### 7.14.1 IPython 和 Jupyter Notebook\n\n在使用 `IPython` 时，如果你希望通过在 `IPython` 命令提示符下发出命令来动态更改图表，只需在\
    \ UNIX 终端上发出一个命令：\n\n```\n1  $ ipython −pylab\n```\n\n这会在 `IPython` 中启用一种特殊的 `matplotlib`\
    \ 支持模式，该模式会查找配置文件以确定后端，并在需要时激活适当的 GUI 线程模型。它还会设置 `Matplotlib` 交互模式，以便 `show()`\
    \ 命令不会阻塞交互式 `IPython` shell。\n\n在 `Jupyter Notebook` 环境中工作时，发出以下命令：\n\n```\n1\
    \  $ jupyter notebook −−pylab=inline\n```\n\n此命令会内联生成图形，即在调用绘图命令的代码行之间的代码主体内生成图形。否则，图形会弹出到单独的窗口中。内联模式在设计教学材料时非常有用。但是，在与相关人员共享之前，应确保用户的计算机上安装了编码所需的后端和依赖项。\n\
    \n或者，你可以将 `%matplotlib inline` 作为魔法命令之一写在第一个单元格中，以便所有绘图都定向显示在 Web 浏览器界面的框架内。在大多数情况下，这是首选方法，尤其是在教授基于\
    \ Python 的绘图时。\n\n## 7.15 在对象模式下使用 matplotlib\n\n使用 `matplotlib` 的 Pythonic 方式是在对象模式下使用它，在这种模式下，显式定义对象可以实现终极定制。为此，你必须将图形的每个元素定义为一个对象，并使用其属性进行定制。用于此目的的三个基本对象的层次结构如下：\n\
    \n1.  `FigureCanvas`：`Figure` 实例的容器类\n2.  `Figure`：`axes` 实例的容器类\n3.  `Axes`：坐标轴是用于容纳各种绘图特征（如线条、刻度、曲线和文本）的矩形区域。\n\
    \n在以面向对象模式使用 `matplotlib` 时，需要指定一个 `FigureCanvas`，它包含 `figure(s)`，而 `figure(s)`\
    \ 又包含 `axes`，可以在 `axes` 上实现各种绘图功能。整个过程允许进行任何可以想象到的定制。清单 7-17 解释了这一概念。\n\n```\n\
    1  import matplotlib.pyplot as plt\n2  fig = plt.figure()\n3  # 变量 fig 存储 \"figure\"\
    \ 实例\n4  ax1 = fig.add_subplot(221)\n5  # 变量 ax1 存储位于 2 x 1 矩阵中第一个位置的 figure 的子图\n\
    6  ax1.plot([-1, 1, 4], [-2, -3, 4]);\n7  # 调用 ax1 并为其赋予 plot 函数。\n8  # plot 函数携带两个列表，分别提供图形的\
    \ x 轴和 y 轴点\n9  ax2 = fig.add_subplot(222)\n10  ax2.plot([1, -2, 2], [0, 0, 2]);\n\
    11  # 与 ax1 逻辑相同\n12  ax3 = fig.add_subplot(223)\n13  ax3.plot([10, 20, 30], [10,\
    \ 20, 30]);\n14  ax4 = fig.add_subplot(224)\n15  ax4.plot([-1, -2, -3], [-10,\
    \ -20, -30]);\n16  plt.show()\n17  # 在计算机终端上显示图形\n清单 7-17\nobjPlot.py\n```\n\n\
    生成的图形如图 7-17 所示。\n"
- fmt: '# 7.16 Logarithmic Plots


    A variety of engineering data use logarithmic scales, particularly those where
    changes result in an order of magnitude change in values of observed variable.
    Python provides the facility to plot logarithmic plots, as shown in Listing [7-18](#A458920_1_En_7_Chapter.html#Par128).


    ![A458920_1_En_7_Fig17_HTML.jpg](A458920_1_En_7_Fig17_HTML.jpg)


    Figure 7-17


    Plotting using object mode capabilities


    ```

    1  import matplotlib.pyplot as plt

    2  import numpy as np


    4  x = np.arange(0., 10, 0.01)


    6  fig = plt.figure()


    8  ax1 = fig.add_subplot(221)

    9  y1 = np.log(x)

    10  ax1.plot(x, y1);

    11  ax1.grid(True)

    12  ax1.set_ylabel(''$y = log(x)$'');

    13  ax1.set_title(''y-axis in log scale'')


    15  ax2 = fig.add_subplot(222)

    16  y2 = np.sin(np.pi*x/2.)

    17  ax2.semilogx(x, y2, basex = 3);

    18  ax2.grid(True)

    19  ax2.set_title(''x-axis in log scale'')


    21  ax3 = fig.add_subplot(223)

    22  y3 = np.sin(np.pi*x/3.)

    23  ax3.loglog(x, y3, basex=2);

    24  ax3.grid(True)

    25  ax3.set_ylabel(''both axes in log'');


    27  ax4 = fig.add_subplot(224)

    28  y4 = np.cos(2*x)

    29  ax4.loglog(x, y3, basex=10);

    30  ax4.grid(True)


    32  plt.show()

    Listing 7-18

    log.py

    ```


    The following axes instances are defined:


    1. `ax1` uses ![$$ y=\mathit{\log}\kern0.125em (x) $$](A458920_1_En_7_Chapter_IEq1.gif)
    [.]

    2. `ax2` uses ![$$ y=\mathit{\sin}\left(\frac{\pi x}{2}\right) $$](A458920_1_En_7_Chapter_IEq2.gif)
    [.]

    3. `ax3` uses ![$$ y=\mathit{\sin}\left(\frac{\pi x}{3}\right) $$](A458920_1_En_7_Chapter_IEq3.gif)
    [.]

    4. `ax4` uses ![$$ y=\mathit{\cos}(2x) $$](A458920_1_En_7_Chapter_IEq4.gif) [.]


    The resulting graph is given by Figure [7-18](#A458920_1_En_7_Chapter.html#Fig18).


    ![A458920_1_En_7_Fig18_HTML.jpg](A458920_1_En_7_Fig18_HTML.jpg)


    Figure 7-18


    Plotting using object mode capabilities


    As seen in the program `log.py`, logarithmic values can be directly passed to
    the `plot()` function. When a particular axis needs to be plotted in logarithmic
    values, `semilog()` and `semilogy()` can be used where a base index can also be
    defined. The value of that particular axis is converted into a logarithmic scale
    and plotted subsequently. When logarithmic values need to be plotted on both axes,
    the `loglog()` function needs to be invoked.


    Logarithmic plots find their use in a variety of fields like signal processing
    and thermodynamics. Essentially, whenever data changes by an order of a magnitude,
    it’s easier to observe it using a logarithmic plot. A logarithmic scale is a nonlinear
    scale. The ability to change the base of a logarithmic function provides a powerful
    tool at the hands of developers to derive the most meaningful conclusion.


    ## 7.17 Two Plots on the Same Figure with at least One Axis Different


    Using functions `twinx()` and `twiny()`, you can use two x- or y-axes on the same
    figure to plot two sets of data points. An example to use `twinx()` is used in
    Listing [7-19](#A458920_1_En_7_Chapter.html#Par138) where the x-axis is twinned
    to produce plots of two data sets sharing the same x-axis data points.


    ```

    1  import matplotlib.pyplot as plt

    2  import numpy as np


    4  x = np.arange(0., 100, 1);

    5  y1 = x**2;

    6  # y1 is defined as square of x values

    7  y2 = np.sqrt(x);

    8  # y2 is defined as square root of x values


    10  fig = plt.figure()

    11  ax1 = fig.add_subplot(111)

    12  ax1.plot(x, y1, ''bo'');

    13  ax1.set_ylabel(''$x^{2}$'');

    14  ax2 = ax1.twinx() # twinx() function is used to show twinned x axes

    15  ax2.plot(x, y2, ''k+'');

    16  ax2.set_ylabel(''$\sqrt{x}$'');

    17  ax2.set_title(''Same x axis for both y values'');

    18  plt.show()

    Listing 7-19

    twinx.py

    ```


    It is worth noting that two different axes instances, namely `ax1` and `ax2`,
    are superimposed on each other where data from `y1` being allotted to axes instance
    `ax1` and data from `y2` being allotted to axes instance `ax2`. This also illustrates
    the power of defining a plot in object mode. The corresponding plot is given in
    Figure [7-19](#A458920_1_En_7_Chapter.html#Fig19).


    ![A458920_1_En_7_Fig19_HTML.jpg](A458920_1_En_7_Fig19_HTML.jpg)


    Figure 7-19


    Using `twinx()` variable


    ## 7.18 Contour Plots


    In some engineering applications, contour plots become an essential part of interpretation
    because they can define segregation of data into regions based on certain similarities.
    For example, if you imagine a mountain viewed from the top, you can define regions
    of a similar height being shown with a closed loop. Thus, a mountain will be a
    series of loops. Similarly, a 2-D map of a nonuniformly heated region can be viewed
    as contours depicting regions of the same temperature. A region of rainfall can
    be viewed as a contour showing regions of a dissimilar size of droplets.


    Hence, contour lines are also called level lines or isolines. The term iso is
    attached to data points having constant value and the regions of these data points
    are separated by contours.


    For a contour plot, you need x-, y- and z-axes where the z-axis defines the height.
    The data with the same height is clubbed together within isolines. (See Listing
    [7-20](#A458920_1_En_7_Chapter.html#Par143).)


    ```

    1  import matplotlib.pyplot as plt

    2  import numpy as np


    4  # defining data for x, y, z axes

    5  x = np.linspace(0,1,100)

    6  y = np.linspace(1,2,100)

    7  (X,Y) = np.meshgrid(x,y)

    8  z = np.sin(X)-np.sin(Y)


    10  # plotting contour

    11  fig = plt.figure()


    13  ax1 = fig.add_subplot(211)

    14  c1 = ax1.contour(x,y,z)

    15  l1 = ax1.clabel(c1)

    16  lx1 = ax1.set_xlabel("x")

