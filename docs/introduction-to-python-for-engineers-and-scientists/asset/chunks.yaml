  trans: "\n### 4.3.2 浮点数\n\n在计算中，浮点表示法是一种近似表示数学实数的方案。实数通常用小数点书写。例如，`2` 是一个整数，而 `2.0`\
    \ 是一个实数。这两个数字对计算机来说截然不同。`2` 会以 `int` 类型存储，而 `2.0` 则会以 `float` 类型存储：\n\n```\n1\
    \  >>> type(2)\n\n3  >>> type(2.0)\n\n```\n\n实数到计算机存储系统的映射是一种公式化表示（称为浮点表示）[1]。实数由三部分组成：有效数字、基数和指数。\n\
    \n例如，π 的值是 `3.1415926535897…`。假设对于某个特定计算，我们只有四位有效数字，那么该值可以重写为 `3.1415`。现在这个数字表示为\
    \ `31415 × 10 ^(−4)`，其中 `31415` 称为有效数字，`10` 称为基数，`−4` 称为指数。\n\n在给有效数字赋值时，会用到有效数字位数的信息。一个数字的有效数字是指那些对其测量分辨率有意义的数字。在这个例子中，我们根据计算/测量的要求，假设只有四位有效数字。术语“浮点”指的是数字的小数点可以“浮动”；也就是说，它可以相对于数字的有效数字放置在任何位置。这个位置由指数部分指示；因此，浮点表示可以被视为一种科学记数法。\n\
    \n### 4.3.3 如何存储浮点数\n\n计算机可以将数字存储为浮点对象。浮点对象按如下方式存储数字：\n\n![$$ \\pm {d}_1{d}_2\\\
    dots {d}_s\\times {\\beta}^e $$](img/A458920_1_En_4_Chapter_Equ1.gif)\n\n(4.1)\
    \ 其中 `d [i] = 0, 1, 2…β − 1`，但 `d [1] j= 0`，且 `m ≤ e ≤ M`，其中 `m ∈ I ^−` 且 `M ∈\
    \ I ^+`。\n\n浮点数的三个部分如下：\n\n*   符号（`±`）\n*   有效数字（尾数）（`d [1] d [2] …d [s]`）\n*\
    \   指数（`β`）\n\n浮点数的每个部分都存储在不同的内存位置，并占用指定的位数。哪个部分定义了多少位？这个问题已由名为 IEEE754 [1] 的\
    \ IEEE 标准回答。首先，让我们看看数字表示精度的概念：\n\n1.  单精度：\n    *   占用 4 字节 = 32 位。\n2.  双精度：\n\
    \    *   占用 8 字节 = 64 位。\n3.  扩展双精度：\n    *   占用 80 位。\n4.  四精度：\n    *   占用 16\
    \ 字节 = 128 位。\n\n这种方案可以在范围和精度之间进行权衡。虽然整数具有无限精度，但如前所述，浮点数通常使用双精度实现。关于程序运行所在机器的浮点数精度和内部表示的信息，可以在\
    \ `sys.float_info` 中找到：\n\n```\n1  >>>import sys # 导入 sys 模块\n2  >>> sys.float_info\
    \ # 使用 sys 的 float_info 函数\n3   sys.float_info(max=1.7976931348623157e+308, max_exp=1024,\
    \ max_10_exp=308,\nmin=2.2250738585072014e-308, min_exp=-1021, min_10_exp=-307,\
    \ dig=15,\nmant_dig=53, epsilon=2.220446049250313e-16, radix=2, rounds=1)\n4 \
    \ >>> sys.int_info # 使用 sys 的 int_info 函数\n5  sys.int_info(bits_per_digit=30,\
    \ sizeof_digit=4)\n```\n\n在 Python 提示符下发出 `sys.int_info` 命令时，32 位 Windows 操作系统会输出\
    \ `sys.int_info(bits_per_digit=15, sizeof_digit=2)`。\n\n基于浮点数的算术运算的问题在于，其结果是对实数的近似，因为实数是以\
    \ `10` 为基数定义的，而计算机处理数字时使用 `2` 作为基数。例如，`0.123` 在以 `10` 为基数的数字系统中定义为\n\n![$$ 0.123\\\
    to \\frac{1}{10¹}+\\frac{2}{10²}+\\frac{3}{10³} $$](img/A458920_1_En_4_Chapter_Equa.gif)\n\
    \n相反，在以 `2` 为基数的数字系统中，它表示为\n\n![$$ 0.123\\to \\frac{1}{2¹}+\\frac{2}{2²}+\\frac{3}{2³}\
    \ $$](img/A458920_1_En_4_Chapter_Equb.gif)\n\n这个计算表明 `0.123[2] = 0.135[10]`。如果你使用更多位来存储该值，就能得到对实数更好的近似，但你始终只能使用近似值，而非真实值。正如\
    \ `sys.float_info` 所告知的，最大的浮点数是 `max = 1.7976931348623157e + 308`（`1.7976931348623157\
    \ × 10³⁰⁸`）。\n\n要获得更高的精度，你可以使用 `decimal` 模块，它包含函数 `Decimal()`，该函数返回计算机存储的数字：\n\
    \n```\n1  >>>from decimal import Decimal\n2  >>>Decimal(0.123)\n3  Decimal('0.1229999999999999982236431605997495353221893310546875')\n\
    4  >>>Decimal(1.2345)\n5  Decimal('1.2344999999999999307220832633902318775653839111328125')\n\
    6  >>>type(Decimal(0.123))\n\n```\n\n如你所见，`0.123` 被存储为 `0.1229999999999999982236431605997495353221893310546875`，这仍然是实数\
    \ `0.123` 的一个近似值。在大多数情况下，这个误差微不足道，你可以忽略使用数字计算机（运行在二进制数字系统上）进行计算所引入的误差。但在某些情况下，这个误差是显著的，你需要采取适当措施来计算并应对这个误差。\n\
    \n### 4.3.4 复数\n\n复数在科学和工程研究中被广泛使用。复数的虚部包含有关信号相位的重要信息。Python 通过创建一个名为 `complex`\
    \ 的对象来支持复数的使用。虚部通过添加符号 `j` 来表示，该符号代表虚数单位（=![$$ \\sqrt{-1} $$](img/A458920_1_En_4_Chapter_IEq1.gif)）。因此，你可以在\
    \ Python 中将复数 `2+3i` 定义为 `2+3j`。另一种定义复数的方法是使用内置函数 `complex()`，它接受两个参数：第一个参数是复数的实部，第二个参数是复数的虚部。以下代码将提供更多关于其用法的信息：\n\
    \n```\n1  >>> 2+3j\n2  (2+3j)\n3  >>> type(2+3j)\n\n5  >>> complex(2,3)\n6  (2+3j)\n\
    7  >>> type(complex(2,3))\n\n```\n\n## 4.4 序列\n\n语言符号需要在计算机上存储，因此必须被定义为一个对象。这个对象被称为字符。出现在计算机屏幕和打印纸张上的每种语言的每个单独符号，在编程语言中都被视为一个字符。这包括\
    \ ASCII 和 Unicode 字符。字符的例子包括字母、数字、空白字符、标点符号、感叹号等等。通常，键盘上的所有按键都会产生字符。\n\n为了在计算设备之间进行通信，字符被编码为定义明确、国际公认的格式（例如\
    \ ASCII 和 UTF-8），这些格式将每个字符分配给一串二进制数字。两种常见的编码示例是 ASCII 和用于 Unicode 的 UTF-8 编码。所有编程语言都必须能够解码和处理国际公认的字符。Python\
    \ 也使用数据类型 `字符串`、`列表` 和 `元组` 来处理字符。\n"
- fmt: '### 4.4.1 Strings


    A string is merely a sequence of characters. Lowercase and uppercase characters
    have different encoding; thus, strings are case-sensitive:


    ```

    1  >>> type(''a'')


    3  >>> type(''abba'')


    5  >>> type("a")


    7  >>> type("abba")


    ```


    Here, we have defined a string of one and four characters, respectively. It is
    important to remember that whitespace is also a character. As such, `Hello world!`
    has 12 characters, namely `h`, `e`, `l`, `l`, `o`, ` `, `w`, `o`, `r`, `l`, `d`,
    `!`. While defining strings, we enclose the characters with `"` or `""`. When
    a string has to span multiple lines, three sets of quotation marks are used:


    ```

    1  >>> print("""Python can also print multiline strings which can       span many
    lines instead of being printed on just one line""")

    2  Python can also print multiline strings which can span many lines instead of

    being printed on just one line

    ```


    You can use special characters to print the characters to define spaces and to
    print characters on a new line. This can be done using `\t` and `\n` characters,
    which print a tab and a new-line character, respectively:


    ```

    1  >>> print ("'' Python can also print multiline strings having tabs like

    \t and also prints in \n next line"'')

    2  Python can also print multiline strings having tabs like and also prints in

    3      next line

    ```


    Notice the tab being printed as four whitespaces at the place of `\t` and the
    string part after `\n` is printed on a new line since `\n` is a new-line character.


    But why should we have three ways to define a string, namely using single quotes,
    double quotes, and triple quotes? Single quotes can be used to print strings having
    double quotes as characters. Double quotes can be used to print single quotes
    as characters. Triple quotes can be used to print both double and single quotes
    as characters. This behavior can be studied in the following code:


    ```

    1  >>> print("''Mahatma Gandhi''s words, "An eye for an eye makes the whole world
    blind”, stand true even today”’)

    2  Mahatma Gandhi''s words, "An eye for an eye makes the whole world blind", stand
    true even today

    ```


    ### 4.4.2 Lists and Tuples


    A list is an ordered set of objects, irrespective of its data type. It can be
    defined by enclosing a set of values in square brackets. For example:


    ```

    1  >>> [1,2.0,''a'',"Alpha"]

    2  [1, 2.0,''a'',''Alpha'']

    3  >>> type([1,2.0,''a '',"Alpha"])


    ```


    The first element of a list in Python code is an integer, the second is a floating
    point number, the third is a single-character string, and the fourth is a multi-character
    string.


    Tuples are defined using `parentheses ()` instead of brackets `[]`. For example:


    ```

    1  >>> (1,2.0,''a'',"Alpha")

    2  (1,2.0,''a'',''Alpha'')

    3  >>> type((1,2.0,''a'',"Alpha"))


    ```


    In addition to being defined using different sets of brackets, the major difference
    between lists and tuples is that tuples are immutable lists; their elements, once
    defined, cannot be altered. Elements of a list can be altered using their indices.
    More information about how this is done is discussed in Chapter [5](#A458920_1_En_5_Chapter.html),
    where operations on lists have been defined. In scientific computing, universal
    constants can be defined as a tuple and then can be accessed in a program using
    its index.


    ## 4.5 Sets and Frozensets


    The set data type is the implementation of a mathematical set. It is an un-ordered
    collection of objects. Unlike sequence objects, such as `list` and `tuple`, where
    elements are ordered, sets do not have such requirements. However, sets do not
    permit duplicity in the occurrence of an element, that is, an element either exists
    0 or 1 times. This is not the case with `list` and `tuple` objects.


    A set is defined using the `set()` function, which is supplied a `list` as its
    input argument. For example:


    ```

    1  >>> set([''h'',''e'',''l'',''l'',''o'',1,2.0,3+4j])

    2  {1, 2.0, ''h'', ''o'', (3+4j), ''l'', ''e''}

    3  >>> type(set([''h'',''e'',''l'',''l'',''o'',1,2.0,3+4j]))


    5  >>> frozenset([''h'',''e'',''l'',''l'',''o'',1,2.0,3+4j])

    6  frozenset({1, 2.0, ''h'', ''o'', (3+4j), ''l'', ''e''})

    7  >>> type(frozenset([''h'',''e'',''l'',''l'',''o'',1,2.0,3+4j]))


    ```


    Please note that since `l` occurred two times while defining the set, it was given
    only one membership. Set operations are discussed in detail in subsequent chapters.
    Just like a `tuple` object is immutable, a `frozenset` is also an immutable object
    and similar to a `set` object.


    ## 4.6 Mappings


    Mapping is a scheme of defining data where each element is identified with a key
    called “hash tag.” The element can be accessed by referring to the key. One of
    the data types in this category is a dictionary.


    A dictionary is an unordered pair of values associated with keys. These values
    are accessed with keys instead of an index. These keys have to be hashable like
    integers, floating point numbers, strings, tuples, and frozensets. Lists, dictionaries,
    and sets other than frozensets are not hashable. Following is an example of a
    dictionary:


    ```

    1  >>> {''a'':1, ''b'':10}

    2  {''a'':1, ''b'':10}

    3  >>> type({''a'':1, ''b'':10})


    ```


    In this example, we created a dictionary containing two characters, `a` and `b`,
    identified by two keys, `1` and `10`. A variety of operators can operate on dictionaries
    as discussed in subsequent chapters.


    ## 4.7 Null Objects


    `None` is a null object. Null objects in other programming languages including
    C, Java, and PhP are given by the keyword `null`, but in Python it is denoted
    by the keyword `None`. It refers to nonfunctionality (that is, no behavior for
    the object with which it is associated.) When it is issued at the Python prompt,
    nothing happens:


    ```

    1  >>> None

    2  >>> type(None)


    ```


    ## 4.8 Summary


    Object-oriented programming uses the fact that all computing entities are merely
    objects that interact with each other as per their defined behavior. We have discussed
    some built-in data types in this chapter. Some data types are defined inside the
    modules. Users can define their data types and define their properties. Before
    going to these advanced topics, it will be useful to know how operators operate
    on various kinds of data. This will be the subject of Chapter [5](#A458920_1_En_5_Chapter.html).


    # 5. Operators'
