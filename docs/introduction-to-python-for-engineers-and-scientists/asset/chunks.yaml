- fmt: "### 9.6.2 Class Variables and Class Methods\n\n`Class variables` indicate\
    \ the data that universally applies to all the objects defined within a class.\
    \ They are defined within class definitions and are valid under the scope of class.\
    \ This signifies the fact that each and every object defined within that class\
    \ has access to them. They can be accessed without giving reference to a class.\n\
    \nOn the other hand, an `instance variable` is valid only within an instance of\
    \ the class object. Hence, it is defined within the definition of the instance\
    \ of the class (within the `def` block defining behavior of instance object).\n\
    \n`Class methods` are different from ordinary functions in just one way. They\
    \ are required to have an extra first name. This first name needs to be added\
    \ to the beginning of the parameter list. Users do not give a value for this parameter\
    \ when they call the method. It is provided by Python’s main program, which is\
    \ run by the Python interpreter by default. This particular variable refers to\
    \ the object itself. Thus, it is given the name `self`. Those methods that do\
    \ not take any arguments have at least the argument as `self`. Listing [9-1](#A458920_1_En_9_Chapter.html#Par57)\
    \ will make this concept clearer.\n\n```\n1  #Python code to explain defining\n\
    2  #and using class\n\n4  #A class named python_program is defined\n5  class first_program:\n\
    6      '''\n7      This program has two methods: hi and hi_again\n8      '''\n\
    9      greeting = 'Hello Everybody\\n' #Class variable definition\n\n11      #Now\
    \ we define two instances of this class as \"hi\" and        \"hi_again\"\n12\
    \      def hi(self):\n13          greet = 'Hello World!\\n'\n14          print(greet)\n\
    15      def hi_again(self):\n16          greet_again = 'Hello again!\\n'\n17 \
    \         print(greet_again)\n\n19  #Procedures to call the class\n\n21  x = first_program()\
    \ # Calling the class\n22  print('The type of object storing class calling is:',\
    \ type(x))\n23  x.hi() #Calling an instance of \"x\" class\n24  x.hi_again() #\
    \ Calling another instance of \"x\" class\n25  # Results of both instances depend\
    \ on thier definitions\n\n27  #Acessing class variable\n28  #Class variable can\
    \ be accessed from anywhere\n29  print(first_program.greeting)\n\n31  #Printing\
    \ the documentation string\n32  print(first_program.__doc__)\nListing 9-1\nEx–class.py\n\
    ```\n\nThe output can be seen as follows:\n\n```\n1  $python Ex-class.py\n2  The\
    \ type of object storing class calling is: \n3  Hello World!\n\n5  Hello again!\n\
    \n7  Hello Everybody\n\n10  This program has two methods: hi and hi_again\n```\n\
    \n### 9.6.3 Constructor\n\nAll objects within a class are merely instances of\
    \ the class. When this instance is initiated, a special kind of functions is called.\
    \ A constructor is a function that is executed when an object is instantiated.\
    \ Python always names a constructor as `__init()__` since it sets the initial\
    \ state of the object. It defines the initial state and the basic nature of this\
    \ instance. It is defined within class definition, but a user can omit this definition\
    \ because every class automatically creates a default constructor. It is generally\
    \ used to define the initial values of the instance variables, as shown in Listing\
    \ [9-2](#A458920_1_En_9_Chapter.html#Par61).\n\n```\n1  #Python code to show usage\
    \ of __init__\n\n3  # Defining a class \"library\"\n4  # which stores information\
    \ about book's name and price\n\n6  #Defining class\n7  class library:\n8    \
    \ 'The base class for all books'\n9     bookCount = 0 #Class variable setting\
    \ count of books to zero\n\n11     def __init__(self, name, price):# Initializing\
    \ the instance of class with name, price and updated book count\n12        self.name\
    \ = name\n13        self.price = price\n14        library.bookCount += 1\n\n16\
    \     def displayCount(self):\n17       print(\"Total Employee %d\",library.bookCount)\n\
    \n19     def displayBook(self):\n20        print(\"Name : \", self.name,  \",\
    \ Price: \", self.price)\n\n22  #Creating objects\n\n24  book1 = library(\"Introduction\
    \ to python\",100) # First    instance of object \"library\"\n25  print(type(book1))\n\
    \n27  book2 = library(\"Basic Python\",150) # Second instance    of object \"\
    library\"\n28  print(type(book2))\n\n30  book3 = library(\"Intermediate Python\"\
    ,200) # Third instanc    of object \"library\"\n31  print(type(book3))\n\n33 \
    \ book4 = library(\"Advanced Python\",300) # Four instance    of object \"library\"\
    \n34  print(type(book2))\n\n36  # Accessing attributes\n\n38  print(\"Details\
    \ of first book:\")\n39  book1.displayBook()\n\n41  print(\"Details of second\
    \ book:\")\n42  book2.displayBook()\n\n44  print(\"Details of third book:\")\n\
    45  book3.displayBook()\n\n47  print(\"Details of fourth book:\")\n48  book4.displayBook()\n\
    \n50  print(\"Total Number of books= %d\" % library.bookCount)\n\n52  # Probing\
    \ the bult-in attributes\n\n54  print(\"library.__doc__:\", library.__doc__)\n\
    55  print(\"library.__name__:\", library.__name__)\n56  print(\"library.__module__:\"\
    , library.__module__)\n57  print(\"library.__bases__:\", library.__bases__)\n\
    58  print(\"library.__dict__:\", library.__dict__)\nListing 9-2\nEx–class1.py\n\
    ```\n\nThe code `Ex-class1.py` can be explained as follows:\n\n*   Line 7 defines\
    \ a class named `library`. This class intends to keep an account of the name of\
    \ a book and its price.\n*   Line 9 defines a class variable named `bookCount`\
    \ and sets it to zero value.\n    *   Since it is a class variable, it is shared\
    \ by all instances.\n    *   It can be accessed by `library.bookCount` from inside\
    \ or outside the class.\n*   This class has a constructor defined from line 11\
    \ to line 14 and two methods named `displayCount` and `displayBook`.\n*   Lines\
    \ 11–14 define the constructor used to initialize all the instances:\n    *  \
    \ It takes three arguments: `self`, `name`, and `price`.\n    *   `self` refers\
    \ to the object itself.\n    *   `name` and `price` are initialized at lines 12\
    \ and 13, respectively.\n    *   These are required at the time of calling the\
    \ class, that is, `library(name,price)`.\n    *   This initialization information\
    \ is utilized by all instances of the object `library`.\n*   Lines 16–17 define\
    \ a method called `displayCount` and output value referred by the `bookCount`\
    \ variable.\n*   Lines 19–20 define a method called `displayBook`, which gives\
    \ the information about the name and price of the book.\n*   Lines 21–33 create\
    \ a separate instance of object `library`.\n    *   As defined by the constructor,\
    \ the two input arguments while calling the class must be the values stored in\
    \ variables `name` and `price`.\n*   Lines 39, 44, 48, and 52 call the object(s)\
    \ one-by-one, probing their attribute defined by the method `displayBook()`.\n\
    *   Line 50 displays the total number of books using the method `bookCount()`."
