- fmt: '### 9.5.2 Copy and Deepcopy


    Referencing a single object with two reference values seems like copying. It has
    been observed in previous discussions that when users make changes to the original
    object, both copies are affected. While working with `list` objects, this can
    be an issue:


    ```

    1  >>> list1 = [1,2,3]

    2  >>> list2 = list1

    3  >>> list1

    4  [1, 2, 3]

    5  >>> list2

    6  [1, 2, 3]

    7  >>> list1[1]=-1

    8  >>> list1

    9  [1, -1, 3]

    10  >>> list2

    11  [1, -1, 3]

    ```


    First, we create a list object with value `[1,2,3]` whose reference value is `list1`.
    Next, we create another reference value, `list2`, in addition to the original
    reference value `list1` referring to the original list object (`[1,2,3]`). When
    the second item on the list is altered by line number 7, it is reflected by both
    reference values since both of these point to the same object. Hence, `list2`
    seems a copy of `list1`, which follows its original master diligently. Let’s investigate
    if this pattern holds when its members of lists are lists themselves:


    ```

    1  >>> list1 = [1,2,3]

    2  >>> list2 = [list1,list1]

    3  >>> list1

    4  [1, 2, 3]

    5  >>> list2

    6  [[1, 2, 3], [1, 2, 3]]

    7  >>> list3=list2

    8  >>> list3

    9  [[1, 2, 3], [1, 2, 3]]

    10  >>> list2[1]=[-1,-2,-3]

    11  >>> list1

    12  [1, 2, 3]

    13  >>> list2

    14  [[1, 2, 3], [-1, -2, -3]]

    15  >>> list3

    16  [[1, 2, 3], [-1, -2, -3]]

    ```


    So, it seems that even if members of list objects are list objects themselves,
    the copying activity works the same way when members were other objects.


    The following code shows what happens if we use `list` constructor:


    ```

    1  >>> list1 = list([1,2,3])

    2  >>> list2 = list([list1,list1,list1])

    3  >>> list2

    4  [[1, 2, 3], [1, 2, 3], [1, 2, 3]]

    5  >>> list3 = list(list2)

    6  >>> list3

    7  [[1, 2, 3], [1, 2, 3], [1, 2, 3]]

    8  >>> list2[1]=list([-1,0,1])

    9  >>> list2

    10  [[1, 2, 3], [-1, 0, 1], [1, 2, 3]]

    11  >>> list3

    12  [[1, 2, 3], [1, 2, 3], [1, 2, 3]]

    13  >>> id(list2)

    14  4416356864

    15  >>> id(list3)

    16  4416356936

    ```


    Note that the reference value `list3` has different data because they now point
    to two different objects (as seen by their memory id values). Hence, a copy of
    the original list did not follow the master diligently under `list` constructor.
    Thus, `list3` is said to be a shallow copy of `list2`.


    Sometimes, we may like to make a copy and keep it unchanged under various transformations
    even if `list` constructors are used. For this purpose, the module named `copy`
    provides two methods named `copy.copy()` and `copy.deepcopy()`. As per Python
    documentation [[8](#A458920_1_En_9_Chapter.html#Par208)]:


    *   A shallow copy constructs a new compound object and then (to the extent possible)
    inserts references into it to the objects found in the original. This is performed
    using the `copy.copy()` method of `copy` module.

    *   A deep copy constructs a new compound object and then, recursively, inserts
    copies into it of the objects found in the original. This is performed using the
    `copy.deepcopy()` method of `copy` module.


    ```

    1  >>>import copy

    2  >>> a = [[1, 2, 3], [4, 5, 6]]

    3  >>> b = list(a)

    4  >>> a

    5  [[1, 2, 3], [4, 5, 6]]

    6  >>> b

    7  [[1, 2, 3], [4, 5, 6]]

    8  >>> a[0][1] = 10

    9  >>> a

    10  [[1, 10, 3], [4, 5, 6]]

    11  >>> b   # list b changes too => Not a deepcopy.

    12  [[1, 10, 3], [4, 5, 6]]

    ```


    Now, let’s see how `deepcopy` works :


    ```

    1  >>> b = copy.deepcopy(a)

    2  >>> a

    3  [[1, 10, 3], [4, 5, 6]]

    4  >>> b

    5  [[1, 10, 3], [4, 5, 6]]

    6  >>> a[0][1] = 9

    7  >>> a

    8  [[1, 9, 3], [4, 5, 6]]

    9  >>> b    # list b doesn''t change => Deep Copy

    10  [[1, 10, 3], [4, 5, 6]]

    ```


    As you can see, it enables `b` to retain its value even when `a` is changed.


    ## 9.6 Class


    Until now, we have just discussed predefined objects and scanning their `type`
    and their memory `id`. Using special types of objects called class, we can create
    other objects.


    The concept of class is also derived from the natural world. Objects in the real
    world are classified according to their attributes and behavior. An object is
    merely an instance of its class. For example, men and women are merely instances
    of the class homo sapiens. In a similar fashion, the keyword `class` defines a
    class of objects for which various instances can be defined. For example, a class
    for numbers can have instances like integers, floating point numbers, complex
    numbers, rational numbers, and irrational numbers. Once defined, all members of
    this class will share certain attributes and behaviors common to numerals, but
    they can be further subdivided based on their differences. All members of this
    class will be quite different from a class of language having characters, words,
    sentences, and paragraphs. Now an instance of number class as an integer and an
    instance of language class as a character can be defined for computing. These
    instances of their respective classes will have their own attributes and methods
    (some of them shared with their class and some of their own). This object orientation
    helps us break down a complex system into small fundamental units for easier study.


    Thus, a class defines the behaviors of a new kind of abstract entity, whereas
    an object is just a particular instance of that object. Classes and objects help
    to define actions of functions on data in a manageable way that can be managed
    in a similar fashion irrespective of the nature of data and functions. An interface
    describes the functionalities of an object, whereas its actual implementation
    defines how these functionalities can be performed. Classes have constructors
    (we have already discussed the constructor `list()` in Section 9.5.2) that dictate
    the creation of an object of a particular kind. Encapsulation and inheritance
    describe the hierarchal structure of classes with their super-classes. These concepts
    will be further elaborated in subsequent sections.


    ### 9.6.1 Creating a Class


    The keyword `class` is used to create a class. For example, a built-in class named
    `int` defines the behavior of the object used to store integer numbers. When a
    variable is associated with an object of this class, it is called an instance
    of the class. For example, the statement `a=1` creates an object named `a`, which
    is an instance of `int` class. On the other hand, the statement `b=1.0` creates
    an object named as `b`, which is an instance of `float` class. Depending on the
    type of objects stored in `a` and `b`, their behavior will considerably differ
    upon usage.


    The keyword `class` is used to create an object. Its syntax is defined with rules
    as follows:


    ```

    1  class Name_of_class:

    2    ''''''Optional class documentation string''''''

    3    statements

    ```


    It is customary to name classes in meaningful ways for ease of their usage. Similarly,
    it customary to put their details of usage in a documentation string. This string
    can be accessed via the following command:


    ```

    Name_of_class. __doc__

    ```


    Variables that belong to a particular object (defined by a class) are called fields.
    These fields can be probed by a function defined within the class for this purpose.
    Such functions are called methods.'
