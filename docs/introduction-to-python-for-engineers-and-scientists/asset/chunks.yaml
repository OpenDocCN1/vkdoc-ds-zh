  trans: "\n### 8.4.1 作用域规则\n\n`作用域`决定了对象的工作范围——换句话说，即对象在何处可以被访问以进行计算，在何处不能。目前已经清楚，在函数内部定义的变量被定义为局部变量，而在主程序中定义的变量是全局变量，可以在任何地方被访问。Python\
    \ 代码 `namespace.py` 更好地展示了这一概念，如代码清单 8-4 所示。\n\n```\n1  # Python 代码，用于演示命名空间和作用域的概念\n\
    2  # namespace and scope\n3  i = 1\n\n5  def my_function1():\n6      i = 2\n7\
    \      print(\"my_function()1 作用域中 i 的值是\", i )\n\n9  def my_function2():\n10\
    \      i = 3\n11      print(\"my_function()2 作用域中 i 的值是\", i )\n\n13  print('全局作用域中\
    \ i 的值是', i )\n14  my_function1()\n15  print('全局作用域中 i 的值是', i )\n16  my_function2()\n\
    17  print('全局作用域中 i 的值是', i )\n代码清单 8-4\nnamespace.py\n```\n\n结果如下：\n\n```\n1\
    \  value of i in global scope is’, 1\n2  value of i in my function()1 scope is’,\
    \ 2\n3  value of i in global scope is’, 1\n4  value of i in my function()2 scope\
    \ is’, 3\n5  value of i in global scope is’, 1\n```\n\n在代码 `namespace.py` 中，名为\
    \ `i` 的变量被赋予了三个值：\n\n1.  `i=1` 在主程序中\n    *   此变量的作用域是全局的。（即使调用了其他函数，它在整个程序中也保持不变。）\n\
    2.  `i=2` 在名为 `my_function1` 的函数内\n    *   此变量的作用域是局部的，即在函数 `my_function1` 内部。在函数外部，它将失去定义。\n\
    3.  `i=3` 在名为 `my_function2` 的函数内\n    *   此变量的作用域是局部的，即在函数 `my_function2` 内部。在函数外部，它将失去定义。\n\
    \n作用域的层级结构遵循 LEGB 规则。LEGB 代表 局部→闭包→全局→内建。\n\n这本质上规定了 Python 解释器在找到名称到对象的映射之前，搜索不同层级命名空间的顺序。以下是四个层级的命名空间：\n\
    \n*   **局部**：在用户定义的函数或类方法内部。\n*   **闭包**：在封闭函数内部，即当一个函数被包裹在另一个函数内部时。\n*   **全局**：表示最顶层，即解释器正在执行的主\
    \ Python 程序。\n*   **内建**：这些是 Python 解释器为自己保留的特殊名称。\n\n如果在任何命名空间中都找不到某个名称，则会引发\
    \ `NameError`。\n\n## 8.5 循环的概念\n\n在执行重复性任务时，使用计算机进行计算的主要优势在于它们比人类计算得更快。术语“循环”与重复计算相关联，因为用户定义的变量为值命名，并且计算机重复地按照由条件生成的指定序列来变换变量值。例如，用户可能想要计算前\
    \ 10 个整数的平方根。要执行此计算，用户需要对前 10 个整数的列表（可以通过 `range()` 函数生成）运行 `sqrt()` 函数。整数列表可以存储在一个变量中，并且可以将此变量放入循环中，以逐个执行查找列表中每个成员的平方根的操作。\n\
    \n## 8.6 for 循环\n\n当需要对给定的数据集执行相同的操作时，`for` 循环是一个不错的选择。例如，假设我们只想打印列表中的各个成员。可以使用代码清单\
    \ 8-5 中的 Python 代码。\n\n```\n1  #Python 程序，用于说明 for 循环的用法\n2  #of for loop\n3 \
    \ a = ['a',1,3.14,'name']\n\n5  for item in a:\n6      print(\"当前项目是: \",item)\n\
    代码清单 8-5\nListMembers.py\n```\n\n输出打印在终端上，如下所示：\n\n```\n1  当前项目是: a\n2  当前项目是:\
    \ 1\n3  当前项目是: 3.14\n4  当前项目是: name\n```\n\n值得注意的是，大多数编程语言使用逻辑语句来定义运行代码的初始化、条件和增量。Python\
    \ 程序采用了一种不同的策略，即数组使用一个条件，而循环只是简单地遍历数组的每个成员。这对 Python 程序很重要，因为 Python 是一种解释型语言，本质上运行速度较慢。每次循环想要前进一步时都花时间检查条件，在计算上是代价高昂的。因此，Python\
    \ 以这样一种方式设计计算：一旦根据定义的条件形成了列表/数组，循环就可以遍历列表/数组的成员。通过这种方式，可以减少总体计算时间。\n\n作为一个理解 `for`\
    \ 循环在数值计算中使用的例子，假设我们想要找到偶数勾股数，使得\n\n![$$ {a}²+{b}²={c}² $$](img/A458920_1_En_8_Chapter_Equa.gif)\n\
    \n这可以使用 `for` 循环来完成，如代码清单 8-6 中所示的 Python 代码 `pytha.py`。在这段 Python 代码中，用户输入一个数字，表示执行此计算的最大数字。这确保了计算有一个适当的结束条件（无需显式定义）。\n\
    \n```\n1  # 生成偶数勾股数的程序\n2  # 勾股数是那些满足勾股定理方程的数\n\n4  from numpy import sqrt\n5\
    \  n = input(\"请输入一个最大数字:\") # 要求用户输入一个数字\n6  n = int(n)+1 # 将变量 n 中存储的值转换为整数数据类型并加\
    \ 1，以便在用户输入 0 时也能进行计算\n\n8  # 两个循环用于定义 a 和 b 的数组，以便计算 c\n9  for a in range(1,n):\n\
    10      for b in range(a,n):\n11          c_square = a**2 + b**2\n12         \
    \ c = int(sqrt(c_square)) # c 被转换为整数\n13          if ((c_square - c**2) == 0):\
    \ # 如果 a 的平方加 b 的平方等于 c 的平方，则结果为零\n14              if (c%2 ==0): # 检查 c 是否为偶数\n\
    15                  print(a, b, c)\n代码清单 8-6\npytha.py\n```\n\n```\n1  请输入一个最大数字:200\n\
    2  6 8 10\n3  10 24 26\n4  12 16 20\n5  14 48 50\n6  16 30 34\n7  18 24 30\n8\
    \  18 80 82\n9  20 48 52\n10  22 120 122\n11  24 32 40\n12  24 70 74\n13  26 168\
    \ 170\n14  28 96 100\n15  30 40 50\n16  30 72 78\n17  32 60 68\n18  32 126 130\n\
    19  36 48 60\n20  36 160 164\n21  40 42 58\n22  40 96 104\n23  40 198 202\n24\
    \  42 56 70\n25  42 144 150\n26  48 64 80\n27  48 90 102\n28  48 140 148\n29 \
    \ 50 120 130\n30  54 72 90\n31  56 90 106\n32  56 192 200\n33  60 80 100\n34 \
    \ 60 144 156\n35  64 120 136\n36  66 88 110\n37  66 112 130\n38  70 168 182\n\
    39  72 96 120\n40  72 154 170\n41  78 104 130\n42  78 160 178\n43  80 84 116\n\
    44  80 150 170\n45  80 192 208\n46  84 112 140\n47  90 120 150\n48  96 110 146\n\
    49  96 128 160\n50  96 180 204\n51  102 136 170\n52  108 144 180\n53  112 180\
