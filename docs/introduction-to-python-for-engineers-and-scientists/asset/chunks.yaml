- fmt: "### 4.3.2 Floating Point Numbers\n\nIn computing, floating point notation\
    \ is a scheme of representing an approximation of a mathematical real number.\
    \ A real number is usually written with a decimal point. For example, `2` is an\
    \ integer, whereas `2.0` is a real number. These two numbers are quite different\
    \ to a computer. While `2` will be stored as `int` type, `2.0` will be stored\
    \ as `float` type:\n\n```\n1  >>> type(2)\n\n3  >>> type(2.0)\n\n```\n\nThe mapping\
    \ of a real number to a computer’s storage system is a formulaic representation\
    \ (called floating point representation) [[1](#A458920_1_En_4_Chapter.html#Par99)].\
    \ Real numbers are expressed in three parts: significand, base, and exponent.\n\
    \nFor example, the value of π is `3.1415926535897…`. Let’s suppose that we have\
    \ only four significant digits for a particular calculation, so the value can\
    \ be rewritten as `3.1415`. Now this number is represented as `31415 × 10 ^(−4)`\
    \ where `31415` is called significand, `10` is called base, and `−4` is called\
    \ exponent.\n\nWhile assigning a number to the significand, the information about\
    \ the number of significant digits is used. The significant figures of a number\
    \ are digits that carry meaning contributing to its measurement resolution. In\
    \ this case, we assumed only four significant digits depending on the requirements\
    \ of calculations/measurements. The term floating point refers to the fact that\
    \ a number’s radix point (decimal point) can “float”; that is, it can be placed\
    \ anywhere relative to the significant digits of the number. This position is\
    \ indicated as the exponent component; thus, the floating point representation\
    \ can be thought of as a kind of scientific notation.\n\n### 4.3.3 How to Store\
    \ a Floating Point Number\n\nComputers can store numbers as floating point objects.\
    \ A floating point object stores a number as follows:\n\n![$$ \\pm {d}_1{d}_2\\\
    dots {d}_s\\times {\\beta}^e $$](A458920_1_En_4_Chapter_Equ1.gif)\n\n(4.1) where\
    \ `d [i] = 0, 1, 2…β − 1` but `d [1] j= 0` and `m ≤ e ≤ M` where `m ∈ I ^−` and\
    \ `M ∈ I ^+`.\n\nThree parts of a floating point number are the following:\n\n\
    *   Sign (`±`)\n*   Significand (Mantisa) (`d [1] d [2] …d [s]`)\n*   Exponent\
    \ (`β`)\n\nEach part of a floating point number is stored at different memory\
    \ locations and occupies a specified number of bits. How many bits are defined\
    \ to which part? This question has been answered by IEEE standards known as IEEE754\
    \ [[1](#A458920_1_En_4_Chapter.html#Par99)]. First, let’s look at the concept\
    \ of precision of a number representation:\n\n1.  Single precision:\n    *   Occupies\
    \ 4 bytes = 32 bits.\n2.  Double precision:\n    *   Occupies 8 bytes = 64 bits.\n\
    3.  Extended double precision:\n    *   Occupies 80 bits.\n4.  Quadruple precision:\n\
    \    *   Occupies 16 bytes = 128 bits.\n\nThis scheme can trade off between range\
    \ and precision. While integers have unlimited precision, floating point numbers\
    \ are usually implemented using double precision, as previously explained. The\
    \ information about the precision and internal representation of floating point\
    \ numbers for the machine on which your program is running is available in `sys.float_info`:\n\
    \n```\n1  >>>import sys # importing sys module\n2  >>> sys.float_info #using float_into\
    \ function of sys\n3   sys.float_info(max=1.7976931348623157e+308, max_exp=1024,\
    \ max_10_exp=308,\nmin=2.2250738585072014e-308, min_exp=-1021, min_10_exp=-307,\
    \ dig=15,\nmant_dig=53, epsilon=2.220446049250313e-16, radix=2, rounds=1)\n4 \
    \ >>> sys.int_info # using int_info function of sys\n5  sys.int_info(bits_per_digit=30,\
    \ sizeof_digit=4)\n```\n\n32-bit Windows OS outputs `sys.int_info(bits_per_digit=15,\
    \ sizeof_digit=2)` when the `sys.int_info` command is issued at a Python prompt.\n\
    \nThe issue with floating-point-number-based arithmetic is that the answer is\
    \ an approximation of a real number since real numbers are defined with `10` as\
    \ their base, whereas computers work with numbers where `2` is used as the base.\
    \ For example, `0.123` is defined as\n\n![$$ 0.123\\to \\frac{1}{10^1}+\\frac{2}{10^2}+\\\
    frac{3}{10^3} $$](A458920_1_En_4_Chapter_Equa.gif)\n\nin the number system with\
    \ base `10`. Conversely, in a number system with base `2`, it is represented as\n\
    \n![$$ 0.123\\to \\frac{1}{2^1}+\\frac{2}{2^2}+\\frac{3}{2^3} $$](A458920_1_En_4_Chapter_Equb.gif)\n\
    \nThis calculation shows that `0.123[2] = 0.135[10]`. If you use more bits to\
    \ store the value, you get a better approximation of the real number, but you\
    \ are always limited to the use of approximated values instead of real values.\
    \ As `sys.float_info` informed, the biggest floating point number is `max = 1.7976931348623157e\
    \ + 308` (`1.7976931348623157 × 10^(308)`).\n\nTo employ even more precision,\
    \ you can use the `decimal` module that has the function `Decimal()`, which returns\
    \ the number as stored by the computer:\n\n```\n1  >>>from decimal import Decimal\n\
    2  >>>Decimal(0.123)\n3  Decimal('0.1229999999999999982236431605997495353221893310546875')\n\
    4  >>>Decimal(1.2345)\n5  Decimal('1.2344999999999999307220832633902318775653839111328125')\n\
    6  >>>type(Decimal(0.123))\n\n```\n\nAs you can see, `0.123` is stored as `0.1229999999999999982236431605997495353221893310546875`,\
    \ which is still an approximation of the real number `0.123`. For most cases,\
    \ the error is insignificant and you can ignore the fact that calculations using\
    \ digital computers (running on binary system of number) have introduced some\
    \ error. But, for some cases, this error is significant and you need to take proper\
    \ measures to calculate this error and counter it.\n\n### 4.3.4 Complex Numbers\n\
    \nComplex numbers are extensively used in science and engineering studies. The\
    \ imaginary part of a complex number has important information about the phase\
    \ of a signal. Python enables the use of complex numbers by creating an object\
    \ called `complex`. The imaginary part is signified by adding the symbol `j`,\
    \ which signifies the iota (=![$$ \\sqrt{-1} $$](A458920_1_En_4_Chapter_IEq1.gif)).\
    \ Consequently, you can define a complex number `2+3i` as `2+3j` in Python. Another\
    \ way of defining a complex number is to use the built-in function `complex()`,\
    \ which is fed two arguments: the first argument is the real part and the second\
    \ argument is the complex part of the complex number. The following code will\
    \ give some more information about the usage:\n\n```\n1  >>> 2+3j\n2  (2+3j)\n\
    3  >>> type(2+3j)\n\n5  >>> complex(2,3)\n6  (2+3j)\n7  >>> type(complex(2,3))\n\
    \n```\n\n## 4.4 Sequences\n\nLanguage symbols require storage on a computer and,\
    \ hence, must be defined as an object. This object is known as a character. Every\
    \ individual symbol of a language that appears on a computer screen and printed\
    \ papers is considered a character in programming languages. This includes ASCII\
    \ and Unicode characters. Examples of characters include letters, numeral digits,\
    \ whitespaces, punctuation marks, exclamation marks, and so on. In general, all\
    \ keys on a keyboard produce characters.\n\nFor the purpose of communicating between\
    \ computing devices, characters are encoded in well-defined, internationally accepted\
    \ formats (such as ASCII and UTF-8) that assign each character to a string of\
    \ binary numbers. Two examples of usual encodings are ASCII and the UTF-8 encoding\
    \ for Unicode. All programming languages must be able to decode and handle internationally\
    \ accepted characters. Python also deals with characters using data type `strings`,\
    \ `lists`, and `tuples`."
