    \ have to remove it forcefully by using the flag `-rf`.\n*   `cd..` and `cd`\n\
    \    *   The command `cd..` enables a user to step one step back in the directory\
    \ tree structure.\n    *   The command `cd` places a user in the home directory.\n\
    \nThere is a number of other Unix`/`Linux commands that can be used at the IPython\
    \ shell. A special set of commands called magic functions [[4](#A458920_1_En_3_Chapter.html#Par104)]\
    \ can be used to enhance the capabilities of an IPython session. There are two\
    \ kinds of magics: line-oriented and cell-oriented. Line magics are prefixed with\
    \ the `%` character and work much like OS command-line calls: They get as an argument\
    \ the rest of the line, where arguments are passed without parentheses or quotes.\
    \ Cell magics are prefixed with a double `%%`, and they are functions that get\
    \ as an argument not only the rest of the line, but also the lines below it in\
    \ a separate argument. Discussing all magic functions is beyond the scope of this\
    \ book, so only a few useful magic functions are discussed here:"
  trans: "\n## 2.8 本章小结\n\nPython 因其解释型语言的特性而拥有极其平缓的学习曲线，可以逐行输入指令并立即执行。这种方式避免了编译过程以及随之而来的错误，而这些错误对于对编程语言内部机制了解有限的初学者来说往往是主要障碍。Python\
    \ 解释器本质上是开源的，可以从互联网上免费下载。`Anaconda` IDE 为 Python 开发者提供了一个良好的集成开发环境，我们建议你使用它来练习本书中的代码。\n\
    \n# 3. IPython\n\n## 3.1 简介\n\n编程语言的创造者面临的最大挑战是吸引开发者并让他们愿意学习这门语言。通常，开发者会使用文档或帮助手册来深入了解语言，但交互式环境允许开发者在学习的同时试验命令和程序。Python\
    \ 的交互式 shell 已经提供了这种环境。\n\n提供相同环境的另一个选择是 `IPython` [1]。`IPython` 的灵感 [2] 来源于 Maple\
    \ 和 Mathematica 的笔记本环境。它于 2001 年推出，并迅速开始吸引开发者，因为它构想了一个简单直观的环境来执行 Python 代码，并具有以下特性：\n\
    \n- 为 Python 解释器提供交互式 shell\n- 基于浏览器的笔记本，支持代码、文本、数学表达式、内联图表以及其他媒体，例如 `ipython-notebook`\n\
    - 支持交互式数据可视化和 GUI 工具包的使用\n- 灵活、可嵌入的解释器，可加载到项目中\n- 用于并行计算的工具\n\n自 2001 年以来，`IPython`\
    \ 环境得到了巨大的发展，这个流行的基于 Web 浏览器的交互式环境甚至更名为 `Jupyter Notebook` [3]，以强调除了 Python 之外，它还可以运行其他内核。在撰写本文时，它支持\
    \ 40 种编程语言，包括 Julia、Python、Scala、R、C 和 C++。`Jupyter` 需要本地安装 Python 解释器才能工作，因此用户必须按照第\
    \ 2 章所述安装 Python 解释器，然后他们就可以在 `IPython` 环境中工作，并将 Python 作为其内核之一。\n\n## 3.2 安装\
    \ IPython\n\n如果你正在使用 `Anaconda` IDE（适用于所有操作系统，包括 Windows、Linux 和 Mac OS X），则 `IPython`\
    \ 已预装。图 3-1 显示了一个 `Spyder` IDE 会话的截图。其右下角运行着一个 `IPython` shell。你可以像在 Python shell\
    \ 中一样在此处输入 Python 表达式，并期望它被求值。\n\n如果你更喜欢在 Ubuntu Linux 命令 shell 上工作，可以通过在终端中发出以下命令来安装\
    \ `IPython`：\n\n```\n$pip3 install ipython\n```\n\n安装后，你可以通过在终端中发出以下命令来启动 `IPython`\
    \ 会话：\n\n```\n$ipython\n```\n\n无需输入 `python` 来调用解释器，而是调用 `ipython` 应用程序，它会启动一个\
    \ `IPython` 会话，其中 Python 解释器被用作内核。\n\n你可以通过在 `IPython` 提示符下输入 `exit` 来退出该会话。在\
    \ Python 提示符下，你需要将 `exit` 定义为一个函数并输入 `exit()`，但在这里 `exit` 会直接执行退出函数。如图 3-1 所示，`IPython`\
    \ 提示符在会话开始时显示 `In` [`1` `]`。这表示运行 `IPython` REPL 的 `IPython` 提示符正在等待用户输入第一个指令。当你输入指令并按\
    \ `Enter` 键执行表达式时，你会得到带有提示符 `Out` [1 `]` 的输出，表示这是 `In` [1 `]` 处第一个 Python 表达式的输出。括号内的数字会逐一递增，这在教授\
    \ Python 以及跟踪会话期间的工作流程时非常有用。一旦会话重新启动，这些数字就会重置。\n\n![A458920_1_En_3_Fig1_HTML.jpg](img/A458920_1_En_3_Fig1_HTML.jpg)\n\
    \n图 3-1\n\n`IPython` 会话\n\n`IPython` shell 还支持 Unix/Linux 系统命令。一些有用的命令集如下：\n\n\
    - `pwd`：打印当前工作目录\n  - 用户可以打印他们正在运行会话的目录。\n- `cd <name1>`：将当前目录更改为 `name1`\n  -\
    \ 如果 `name2` 目录位于当前工作目录内，则该命令会使 `name1` 成为当前工作目录。\n- `rm -r <name_of_directory>`：删除目录\
    \ `<name_of_directory>`\n  - 用户可以删除目录的内容。如果该目录还包含其他子目录，用户必须使用 `-rf` 标志强制删除。\n\
    - `cd..` 和 `cd`\n  - 命令 `cd..` 允许用户在目录树结构中后退一步。\n  - 命令 `cd` 将用户置于主目录中。\n\n还有许多其他\
    \ Unix/Linux 命令可以在 `IPython` shell 中使用。一组称为魔法函数 [4] 的特殊命令可用于增强 `IPython` 会话的功能。有两种魔法函数：面向行的和面向单元格的。行魔法函数以\
    \ `%` 字符为前缀，其工作方式类似于操作系统命令行调用：它们将行的其余部分作为参数，参数传递时不带括号或引号。单元格魔法函数以双 `%%` 为前缀，它们是函数，不仅将行的其余部分作为参数，还将下面的行作为单独的参数。讨论所有魔法函数超出了本书的范围，因此这里只讨论几个有用的魔法函数。\n"
- fmt: "# IPython Magic Commands\n\n- `%history`\n  - All input history from the current\
    \ session is displayed.\n- `%logstart`, `logoff`, `logon`, `%logstop`\n  - `%logstart`:\
    \ Start logging anywhere in a session.\n  - `logoff`: Temporarily stop logging.\n\
    \  - `logon`: Restart logging.\n  - `%logstop`: Fully stop logging and close log\
    \ file.\n- `%lsmagic`\n  - List currently available magic functions.\n- `%magic`\n\
    \  - Print information about the magic function system.\n- `%run`\n  - Run the\
    \ named file inside IPython as a program.\n- `%time`\n  - Time execution of a\
    \ Python statement or expression.\n\nThe following IPython shell code will illustrate\
    \ the usage. It is important to note that comments in Python start with a `#`\
    \ sign. Any expression after the `#` sign is ignored by the interpreter, so informative\
    \ comments can be inserted for each line of code. It is good practice to insert\
    \ useful comments to yourself in case you revisit the code after a long time or\
    \ if you share the code for a project so that others can understand the logic\
    \ behind the usage of commands in the given code file:\n\n```\n1  In [1]: 2+3\
    \ # adding two integers\n2  Out [1]: 5\n\n4  In [2]: 2.0+3 # Adding a floating\
    \ point number and an integer\n5  Out [2]: 5.0\n\n7  In [3]: %history # probing\
    \ history of commands used in these ssion\n8  2+3\n9  2.0+3\n10  %history\n\n\
    12  In [4]: %history # probing history again shows history command used at IN\
    \ [3]\n13  2+3\n14  2.0+3\n15  %history\n16  %history\n\n18  In [5]: %lsmagic\
    \ # listing all magic functions available\n19  Out [5]:\n20  Available line magics\
    \ :\n21  %alias  %alias_magic   %autocall   %autoindent   %automagic\n%bookmark\
    \   %cat   %cd   %clear   %colors   %config   %cp   %cpaste        %debug   %dhist\
    \   %dirs   %doctestmode   %ed   %edit   %env   %gui\n%hist   %history   %killbgscripts\
    \   %ldir   %less   %lf   %lk   %ll          %load   %load_ext   %loadpy   %logoff\
    \   %logon   %logstart\n%logstate   %logstop   %ls   %lsmagic   %lx   %macro \
    \  %magic   %man         %matplotlib   %mkdir   %more   %mv   %notebook   %page\
    \   %paste\n%pastebin   %pdb   %pdef   %pdoc   %pfile   %pinfo   %pinfo2   %popd\
    \         %pprint   %precision   %profile   %prun   %psearch   %psource\n%pushd\
    \   %pwd   %pycat   %pylab   %quickref   %recall   %rehashx   %reload_ext   %rep\
    \   %rerun   %reset   %reset_selective   %rm   %rmdir   %run   %save   %sc   %setenv\
    \   %store   %sx   %system   %tb\n%time   %timeit   %unalias   %unload_ext   %who\
    \   %who_ls   %whos         %xdel   %xmode\n\n23  Available cell magics :\n24\
    \  %%!  %%HTML  %%SVG  %%bash   %%capture   %%debug   %%file   %%html   %%javascript\
    \   %%js   %%latex   %%markdown   %%perl   %%prun\n%%pypy   %%python   %%python2\
    \   %%python3   %%ruby   %%script   %%sh   %%svg   %%sx   %%system   %%time  \
    \ %%timeit   %%writefile\n\n26  Automagic is ON, #prefix IS NOT needed for line\
    \ magics.\n\n28  In [6]: %time print (\"Hello World !\") #timing execution of\
    \ a print statemnet\n29  Hello World!\n30  CPU times: user 110 micros, sys: 52\
    \ micros, total:\n31  162 micros Wall time : 149 micros\n\n33  In [7]: %history\
    \ # Probing history again showing other used expressions\n34  2+3\n35  2.0+3\n\
    36  %history\n37  %history\n38  %lsmagic\n39  %time print (\"Hello World !\")\n\
    40  %history\n\n42  In [8]:\n```\n\nIt has been noted that the Windows OS version\
    \ of the Python interpreter does not list `cputime` when `%time print(\"Hello\
    \ World!\")` is executed.\n\n## IPython Notebooks\n\nJust as IPython sessions\
    \ are started within terminal sessions, IPython Notebook sessions are started\
    \ within web-browser sessions. As a result, users only need a web browser to work\
    \ with IPython Notebooks. All commands explained in the preceding section work\
    \ in a similar fashion here too except for the fact that users need to press the\
    \ `Shift+Enter` key combination for execution. IPython Notebooks have been renamed\
    \ as Jupyter Notebooks since, in addition to Python, 40 programming languages\
    \ are now supported. Users first need to install a Jupyter Notebook before working.\n\
    \n### Installing a Jupyter Notebook\n\nAnaconda IDE has pre-installed the Jupyter\
    \ Notebook. Figure [3-2](#A458920_1_En_3_Chapter.html#Fig2) shows the Jupyter\
    \ Notebook as one of the first options in the central panel. Clicking `Launch`\
    \ will open a window in the installed browser. Most of the browsers are supported\
    \ for this case. This book uses Google Chrome (Version 60.0.3112.113 (Official\
    \ Build) (64-bit)) for the purpose of testing the code used henceforth.\n\n![A458920_1_En_3_Fig2_HTML.jpg](A458920_1_En_3_Fig2_HTML.jpg)\n\
    \nFigure 3-2: IPython Notebook session\n\nThe web browser window will list the\
    \ directories and files in the home folder. Users can navigate to a target directory\
    \ and start a Jupyter session for Python 3. They can click the `New` button and\
    \ choose a kernel (`Python3` in this case). This will open a screen similar to\
    \ Figure [3-3](#A458920_1_En_3_Chapter.html#Fig3).\n\nFollowing are various features\
    \ of this Jupyter Notebook session:\n\n- **Naming a notebook**\n  - A new notebook\
    \ is titled `Untitled` by default. Clicking this title will open a graphical view\
    \ to enter a new name, which will be updated accordingly.\n- **Cells**\n  - A\
    \ Jupyter Notebook is composed of cells that are executed by pressing the `Shift+Enter`\
    \ key combination.\n  - There are code kinds of cells, as shown in Figure [3-3](#A458920_1_En_3_Chapter.html#Fig3).\n\
    \    - **Code**\n      - Users can write Python code in the cell assigned to `Code`\
    \ type and execute single or multiline code by pressing the `Shift+Enter` key\
    \ combination.\n      - Users can also run a cell (that is, execute a cell) by\
    \ pressing the `Cell` ⇒ `Run Cells` button in the main menu bar.\n      - Special\
    \ display formats also exist for code cells, but that discussion is out of the\
    \ scope of this book. Users are advised to refer to the main documentation for\
    \ learning about various display formats [[5](#A458920_1_En_3_Chapter.html#Par105)].\n\
    \    - **Markdown** [[6](#A458920_1_En_3_Chapter.html#Par106)]\n      - Cells\
    \ that are assigned `Markdown` type can be filled with markdown code to be executed\
    \ for formatted printing.\n      - Users can use LaTeX commands here to define\
    \ mathematical equations and special symbols.\n      - Users can define a heading\
    \ by putting a single `#` for the main heading and multiple symbols for successive\
    \ subheadings.\n    - **Raw NBConvert**\n      - The notebook authoring environment\
    \ does not render raw cells.\n      - They can have different formats. This information\
    \ is stored in the notebook metadata.\n      - A raw cell is defined as content\
    \ that should be included unmodified in `nbconvert` output.\n      - By default\
    \ (if no cell format is selected), the cell content is included (without any conversion)\
    \ in both the HTML and LaTeX output.\n    - **Heading**\n      - A cell type `Heading`\
    \ can be used to create a heading for a separate section of the document.\n  \
    \    - An alternative is to use the cell type `Markdown` and then use the `#`\
    \ symbol to make one or more headings.\n\n![A458920_1_En_3_Fig3_HTML.jpg](A458920_1_En_3_Fig3_HTML.jpg)\n\
    \nFigure 3-3: Jupyter Notebook session\n\nUsers learn best to use the Jupyter\
    \ Notebook by trying it. A sample notebook is shown in Figure [3-4](#A458920_1_En_3_Chapter.html#Fig4).\n\
    \n![A458920_1_En_3_Fig4_HTML.jpg](A458920_1_En_3_Fig4_HTML.jpg)\n\nFigure 3-4:\
    \ A sample Jupyter Notebook session"
