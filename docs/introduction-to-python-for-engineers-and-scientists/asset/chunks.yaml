  trans: '

    ### 6.14.4 `sort()`


    `sort()` 将数组值从最大值到最小值进行排序：


    ```

    1  >>> a = numpy.random.rand(3,4)

    2  >>> a

    3  array([[ 0.51389165,  0.65372872,  0.22264919,  0.41722141],

    4  [ 0.19754059,  0.78218154,  0.0830597 ,  0.44351731],

    5  [ 0.54915984,  0.49219332,  0.24111783,  0.5021453 ]])

    6  >>> numpy.sort(a)

    7  array([[ 0.22264919,  0.41722141,  0.51389165,  0.65372872],

    8  [ 0.0830597 ,  0.19754059,  0.44351731,  0.78218154],

    9  [ 0.24111783,  0.49219332,  0.5021453 ,  0.54915984]])

    10  >>> numpy.sort(a, axis=1) # 沿列排序

    11  array([[ 0.22264919,  0.41722141,  0.51389165,  0.65372872],

    12  [ 0.0830597 ,  0.19754059,  0.44351731,  0.78218154],

    13  [ 0.24111783,  0.49219332,  0.5021453 ,  0.54915984]])

    14  >>> numpy.sort(a, axis=0) # 沿行排序

    15  array([[ 0.19754059,  0.49219332,  0.0830597 ,  0.41722141],

    16  [ 0.51389165,  0.65372872,  0.22264919,  0.44351731],

    17  [ 0.54915984,  0.78218154,  0.24111783,  0.5021453 ]])

    ```


    存在多种排序算法。算法的选择取决于对平均速度、最坏情况、工作空间大小和稳定性的要求。`numpy` 文档在 [4] 中列出了以下三种选择：


    对复数数组的排序通过 `sort_complex()` 完成。（参见表 6-2。）


    **表 6-2** 排序算法


    | 种类 | 速度 | 最坏情况 | 工作空间 | 稳定 |

    | --- | --- | --- | --- | --- |

    | ‘quicksort’ | 1 | O(n ²) | 0 | 否 |

    | ‘mergesort’ | 2 | O(n × log(n)) | ![$$ \frac{n}{2} $$](img/A458920_1_En_6_Chapter_IEq1.gif)
    | 是 |

    | ‘heapsort’ | 3 | O(n × log(n)) | 0 | 否 |


    ```

    1  >>> a = numpy.array([4-3j, 4+5j, 3-8j])

    2  >>> a

    3  array([ 4.-3.j,  4.+5.j,  3.-8.j])

    4  >>> numpy.sort_complex(a)

    5  array([ 3.-8.j,  4.-3.j,  4.+5.j])

    ```


    ### 6.14.5 四舍五入


    数字的四舍五入由函数 `around()` 执行，其逻辑与数学中的四舍五入相同。（如果数字为 5 或更大，则前一位数字加 1。）


    ```

    1  >>> a = numpy.random.rand(10)

    2  >>> a

    3  array([ 0.15342238,  0.90475845,  0.90006375,  0.68768342, 0.14153903,

    4  0.07962712,  0.59819738,  0.76087737,  0.97013725,  0.1560855 ])

    5  >>> numpy.around(a)

    6  array([ 0.,  1.,  1.,  1.,  0.,  0.,  1.,  1.,  1.,  0.])

    7  >>> numpy.around(a).astype(int)

    8  array([0, 1, 1, 1, 0, 0, 1, 1, 1, 0])

    ```


    ## 6.15 `asarray()` 和 `asmatrix()`


    各种变量并非都定义为数组，但如果在计算的某个时刻需要将它们视为数组或矩阵，则可以使用 `asarray()` 和 `asmatrix()`：


    ```

    1  >>> (a,b,c,d) = (1,2,3,4)

    2  >>> array1 = numpy.asarray([a,b,c,d]) # 定义为数组

    3  >>> array1

    4  array([1, 2, 3, 4])

    5  >>> matrix1 = numpy.asmatrix([a,b,c,d]) # 定义为矩阵

    6  >>> matrix1

    7  matrix([[1, 2, 3, 4]])

    8  >>> string = ''Hello world''

    9  >>> string

    10  ''Hello world''

    11  >>> array2 = numpy.asarray(string) # 定义为数组

    12  >>> array2 # 表明数据类型为包含 11 个字符的强类型

    13  array(''Hello world'',

    14  dtype=''<U11'')

    ```


    ## 6.16 总结


    基于数组的计算是求解方程和方程组的主要力量。通过使用切片和索引操作，它提供了强大的工具来使用程序操作数据。由于本书是一本关于 Python 的交互式文本，因此讨论所有用于索引和切片的函数超出了其范围。


    讨论 `numpy` 中所有数组操作的功能超出了任何教科书的范围。此外，每个新版本都会添加新的功能。然而，本章已经讨论了一些非常重要的函数。


    Python 灵活创建各种数组以及使用各种数学函数进行计算的能力，使其成为计算物理和数学领域最受欢迎的语言之一。另一个使其成为科学界成员首选编程语言的事实是，它能够相对轻松地绘制出达到出版质量的图形，我们将在第
    7 章中讨论这一点。


    # 7. 绘图


    ## 7.1 引言


    数据绘图是数值计算中最基本的部分之一。在预处理、计算过程中和后处理中，能够在不同类型的图形上绘制数据是至关重要的。以方便的格式可视化数据有助于更好地理解过程。视觉线索能产生大量关于生成特定数据的过程的信息。您可以轻松地查找错误，并进行简单和复杂的解释。一个好的编程语言必须包含轻松绘制数据的功能。绘制二维（2-D）和三维（3-D）图形对于创建良好的可视化产品至关重要。Python
    用户在这方面有多种选择。


    在本章中，我们将讨论其中一些选择。选择绘图库时的基本要求取决于数据的需求，例如：


    *   在二维或三维图形上绘图

    *   绘制实时数据或静态数据

    *   快速绘制大量数据

    *   以多种格式保存图形

    *   以选定的分辨率绘制数据以控制文件大小


    本章使用的绘图库称为 `matplotlib`。就像任何其他模块一样，它可以在 Ubuntu 系统上使用 `pip` 安装。对于使用 Anaconda IDE
    的 Windows 和 Mac OS X 用户，该库已预装在系统中。


    ## 7.2 `matplotlib`


    `matplotlib` 的创建者 John Hunter [1] 曾正确地指出：“`matplotlib` 试图让简单的事情变得容易，让困难的事情成为可能
    [2]。”


    在某些情况下，只需一行代码，您就可以生成高质量、可随时出版的图形可视化结果。在 Python 之前，`gnuplot` 用于绘制由 Python 脚本传递的数据。有了
    `matplotlib`，这一操作变得非常灵活。`matplotlib` 是仿照 MATLAB 的图形功能建模的，这对于已经精通 MATLAB 的程序员来说是一大福音。与其他绘图库相比，使用
    `matplotlib` 的一些主要优势如下：


    *   它与 LaTeX 标记集成。

    *   它是跨平台且可移植的。

    *   它是开源的，因此用户无需担心许可费用。

    *   作为 Python 的一部分，它是可编程的。


    `matplotlib` 代表数学绘图库。它是程序员中最流行的绘图库之一，这得益于其简单直观的命令以及生成可以多种格式保存的高质量图形的能力。它支持交互式和非交互式绘图模式，并且可以以多种格式保存图像，包括
    JPEG、PS、PDF 和 PNG。它可以利用多种窗口工具包，如 GTK+、wxWidgets 和 QT。最吸引人的特点是它具有多种绘图样式，例如折线图、散点图、条形图以及直方图等等。它还可以与
    IPython 交互使用。`numpy` 是使用 `matplotlib` 所必需的。因此，在使用 `matplotlib` 之前，必须将其安装在系统上。


    `matplotlib` 依赖于一组特定的程序才能正确执行。必须首先安装这些依赖项 [3]。当使用 `pip` 时，此安装会自动完成，但希望从源代码构建它的用户必须手动执行。本书面向初学者，因此此处不对此主题进行说明。

    '
- fmt: '### 7.2.1 `pylab` vs. `pyplot`


    Within `matplotlib`, `pyplot` and `pylab` are the two most discussed modules inside
    `matplotlib` that provide almost the same functionalities and, thus, cause some
    confusion about their usage. As a result, it is important to differentiate between
    them at this point.


    Within the package `matplotlib`, two subpackages, namely `matplotlib.pylab` and
    `matplotlib.pyplot`, exist. Since plotting can start as a simple exercise and
    then become a quite complicated one, `matplotlib` is designed in a hierarchical
    pattern where, by default, simple functions are implemented in the `matplotlib.pylab`
    environment. As the complexity increases, a more complex environment like `matplotlib.pyplot`
    is implemented.


    A more object-oriented approach is `matplotlib.pyplot`, where functions like `figures()`,
    `axes()`, and `axes()` are defined as objects to keep track of their properties
    dynamically. For even more complex tasks like making graphic user interfaces (GUI),
    exclusive `pyplot` usage can be dropped altogether and an object-oriented approach
    can be used to fabricate plots. Also, when plots are mostly noninteractive, the
    `pyplot` environment can be used. `pylab` is used for interactive studies.


    ## 7.3 Plotting Basic Plots


    We will first explore the working environment offered by `matplotlib.pyplot`.
    Functions inside `pyplot` control a particular feature of the plot like putting
    up a tile, mentioning labels on the x-axis and y-axis, putting mathematical equations
    on the body of plot at a desired position, defining tick labels, defining types
    of markers to plot a graph, and so on. `pyplot` is stateful; it keeps updating
    the changes in the state of figure once defined. This makes it easier to modify
    a graph until the desired level is reached before including the code in the program.
    The `plot()` function is used for plotting simple 2-D graphs. It takes a number
    of arguments that fill data and other feature information to plot a graph. In
    its simplest form, it can plot a list of numbers. (See Listing [7-1](#A458920_1_En_7_Chapter.html#Par21).)


    ```

    1  # Python code for plotting numbers

    2  import numpy as np

    3  import matplotlib.pyplot as plt

    4  a = np.arange(10)

    5  plt.plot(a)

    6  plt.show()

    Listing 7-1

    sqPlot0.py

    ```


    It is important to note that libraries/modules `numpy` and `matplotlib.pyplot`
    are used with an alias: `np` and `plt`. This is usually preferred by programmers
    to avoid writing the name of the library each time they need to use its functions.
    We will use this convention in this chapter.


    ![A458920_1_En_7_Fig1_HTML.jpg](A458920_1_En_7_Fig1_HTML.jpg)


    Figure 7-1


    Plotting the first 10 integers using `plot()` function


    The result can be seen in Figure [7-1](#A458920_1_En_7_Chapter.html#Fig1). A plot
    needs two axes, which are usually termed as the x-axis and y-axis. When the `plot()`
    command is supplied with a single list or array, it assumes it to be the values
    for the y-axis and automatically generates corresponding x values, taking its
    cue from the length of list. We had 10 numbers. Consequently, the x-axis had 10
    numbers from 0 to 9. `plot()` can take both axes as input vectors to produce a
    plot as shown in the code in Listing [7-2](#A458920_1_En_7_Chapter.html#Par24).
    This code uses the `pylab` library instead of `pyplot`.


    ```

    1  # Plotting number using pylab

    2  import numpy as np

    3  from matplotlib import pylab as pl

    4  x = np.linspace(0,100)

    5  y = x ** 2

    6  pl.plot(x,y)

    7  pl.show()

    Listing 7-2

    sqPlot1.py

    ```


    The result can be seen in Figure [7-2](#A458920_1_En_7_Chapter.html#Fig2). A very
    basic plot could be plotted by just a few lines of code where you first import
    relevant libraries (line 1 and line 2), then define the x- and y-axes, and finally
    use the `plot` command, which gives the parameters for the x- and y-axes. These
    commands can be issued one-by-one at the Python command prompt, or they can be
    saved as a Python file. (Use a text editor, write the code, and save with `sqPlot1.py`.)


    ![A458920_1_En_7_Fig2_HTML.jpg](A458920_1_En_7_Fig2_HTML.jpg)


    Figure 7-2


    Plotting the first 10 integers using `plot()` function


    The axes are defined as a `numpy` array. They can be generated by all the methods
    available including creating them by hand, using a formula (like in code `sqPlot1.py`—array
    named `y` is generated by elementwise squaring of array `x`), using a data file,
    taking data live from a remote/local server using the Internet or LAN, and so
    on. Subsequent chapters will deal with file input/output facilities. In this chapter,
    only an array generated by self or using formulas will be used.


    It is worth mentioning the role of a seemingly simple but powerful function: `show()`.
    A simple search at the command prompt (write `matplotlib.pyplot.show`) declares
    its purpose. It displays figure(s) on a computer terminal having graphics capability,
    which most modern computers do. In the noninteractive mode in an `IPython` console,
    it first displays all figures and blocks the console until the figures have been
    closed. Conversely, in the interactive mode, it does not block the console. Both
    modes have their own merits. The interactive mode is used for checking the change
    in features. The noninteractive mode is used when the focus is more upon the code
    generation that produces the graphs. Usually, programmers work with the interactive
    mode and optimize a view plots and then work with the noninteractive mode taking
    the same settings that were generated during experiments with the interactive
    mode.


    ### 7.3.1 Plotting More than One Graph on Same Axes


    More than one plot on the same axes can be plotted in the same figure by simply
    issuing two plot commands, as shown in Listing [7-3](#A458920_1_En_7_Chapter.html#Par29).


    ![A458920_1_En_7_Fig3_HTML.jpg](A458920_1_En_7_Fig3_HTML.jpg)


    Figure 7-3


    Plotting more than one graph on the same axes


    ```

    1  import numpy as np

    2  from matplotlib import pylab as pl

    3  x = np.linspace(0,100)

    4  y1 = x ** 2 # y is square of x

    5  y2 = x ** 2.2 # y is x raised to power 2.2

    6  pl.plot(x,y1)

    7  pl.plot(x,y2)

    8  pl.show()

    Listing 7-3

    sqPlot2.py

    ```'
