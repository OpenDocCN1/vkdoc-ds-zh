  trans: '

    ### 1.1.5 极简设计


    `Python` 的极简设计理念意味着它强调代码的可读性。它还提供了一种语法结构，使程序员能够用比 `C++` 和 `Java` 等语言更少的代码行来表达概念。此外，`Python`
    提供了编写易于扩展的程序的方法。`Python` 具有动态类型系统，`Python` 解释器会根据对象的定义来推断其类型，从而避免了用户自行定义类型的需要。


    该语言的核心哲学由 `Tim Peters` 在文档 *Python 之禅*（`PEP 20`）[3] 中进行了总结，其中包含以下格言：


    - 优美胜于丑陋。

    - 显式胜于隐式。

    - 简单胜于复杂。

    - 复杂胜于凌乱。

    - 扁平胜于嵌套。

    - 稀疏胜于密集。

    - 可读性至关重要。

    - 特殊情况也不足以特殊到打破规则。

    - 尽管实用性胜过纯粹性。

    - 错误永远不应静默传递。

    - 除非明确需要静默。

    - 面对歧义，拒绝猜测的诱惑。

    - 应该有一种——最好只有一种——显而易见的方法来做这件事。

    - 尽管这种方法一开始可能并不明显，除非你是荷兰人。

    - 现在做胜于永不开始。

    - 虽然永不开始通常比“立刻动手”更好。

    - 如果实现难以解释，那可能是个坏主意。

    - 如果实现易于解释，那可能是个好主意。

    - 命名空间是个绝妙的主意——让我们更多地使用它们吧！


    ### 1.1.6 可移植性


    由于 `Python` 属于开源社区，它已被移植（即经过适配）到众多平台上，使得在一个平台上编写的 `Python` 代码无需修改即可在其他平台上运行（系统相关功能除外）。`Python`
    已发布适用于主流操作系统的版本，包括 `Linux`、`Windows`、`Macintosh`、`Solaris` 和 `Sony PlayStation`。


    ### 1.1.7 可扩展性


    `Python` 的创造者并未在其核心程序中提供所有功能，而是将其设计为高度可扩展的。因此，用户可以根据自己的需求选择所需的功能。例如，如果用户需要处理微分方程，那么该用户可以使用一个微分方程模块，而不是让所有用户都拥有这个功能却从未使用。`Python`
    也可以嵌入到需要可编程接口的现有应用程序中。


    `Python` 程序可以嵌入到用 `Julia`、`C`、`C++` 等编程语言编写的其他程序中。此外，其他编程语言的代码也可以嵌入到 `Python`
    中。这一特性使得大量用其他语言编写、且已针对速度和稳定性进行优化的遗留代码得以使用，从而避免了重复劳动，并极大地提高了组织的生产力。因此，`Python`
    受到了工业界和学术界的热烈欢迎。


    ## 1.2 历史


    `Python` 编程语言的发展可以追溯到 20 世纪 80 年代。荷兰 `CWI` 的 `Guido van Rossum` 于 1989 年 12 月开始实现它。那是一个计算设备日益强大和可靠的时代。`Van
    Rossum` 以 BBC 电视节目 *Monty Python’s Flying Circus* 命名了该语言。`Python 1.0` 于 1994 年向公众发布，`Python
    2.0` 于 2000 年发布，`Python 3.0` 于 2008 年发布。然而，`Python 3` 在设计上并未向后兼容 `Python 2`，这使得它对于已经使用
    `Python 2` 进行开发的用户来说不太实用。因此，许多开发者至今仍在使用 `Python 2`。尽管如此，未来属于 `Python 3`，它是以更高效的方式开发的。因此，本书将讨论基于
    `Python-3` 的代码。


    ### 1.2.1 Python 2 与 Python 3 对比


    在这一点上，需要注意的是 `Python 3` 并不向后兼容。互联网上充斥着用 `Python 2` 编写的代码。学习如何将这些代码从 `Python 2`
    转换为 `Python 3` 非常重要 [4, 5]。当你理解了它们的基本结构和基本用法后，就能明白它们之间差异的技术细节。


    ## 1.3 Python 与工程学


    工程问题既涉及小规模也涉及大规模的数值计算。因此，工程应用需要一种编程语言能够很好地适应这两种场景。很少有语言能具备这种特性，所以 `Python` 在这方面无疑是赢家。在较大的计算架构上运行大型计算任务时，内存管理、速度和可靠性是关键参数。`Python`
    作为一种解释型语言，在这方面通常被认为速度较慢，但它能够使用通过互连包 `cython`、`jython` 和 `f2p` 编写的、用 `C`、`Java`
    和 `Fortran` 编写的更快代码，从而允许在 `Python` 代码中以这些原生语言运行速度密集型任务。这一能力减轻了世界各地许多程序员对于是否必须用
    `Python` 重写已优化代码的疑虑。


    另一个工程方面的关注点是编程语言与物理设备高效通信的能力。电子设备通过有线和蓝牙无线技术连接到互联网。使用合适的 `Python` 模块，用户可以连接到兼容设备以从中获取数据，然后在所需平台上进行可视化。多种微控制器允许
    `Python` 轻松地在硬件上运行。`MicroPython` [6] 就是为此目的而专门设计的。`MicroPython` 是 `Python 3` 编程语言的一个精简高效的实现，它包含了
    `Python` 标准库的一小部分，并针对在微控制器和受限环境中运行进行了优化。即使是像 `Raspberry Pi` 这样的微型计算机，也允许运行访问输入输出设备的
    `Python` 程序。这使得工程问题的原型设计具有成本效益。


    `MATLAB` 的用户认为 `Simulink` 是原型设计和模拟工程问题最简单的方法之一，因为他们无需编写代码。相反，用户只需在图形终端上将图形块表示的代码片段拼接在一起。（`Scilab`
    也提供了一个名为 `Xcos` 的类似平台。）`Python` 仍然缺乏这种能力，有抱负的程序员可以将其视为一个挑战。大量的开发者社区正在热切期待这样的解决方案，但大多数工程师不会介意花一两天时间学习一门新的编程语言，这门语言可以提升他们的生产力，而这是现成工具无法提供的。

    '
- fmt: '# 1.4 Modular Programming


    The modular nature of Python programming incorporates the complex tasks being
    divided into small modules that seamlessly interact with each other. Modules make
    both development and debugging easier, and they can be simply imported to enable
    the use of various functions.


    Python comes with thousands of modules to perform various tasks. Since this book
    is an introductory text for scientific computation, the usage of just a few basic
    necessary modules (shown in Table [1-2](#A458920_1_En_1_Chapter.html#Tab2)) will
    be discussed.


    **Table 1-2** Basic Python Modules


    | Package Name | Meaning | Purpose |

    | --- | --- | --- |

    | `numpy` | Numerical Python | Numerical computation |

    | `scipy` | Scientific Python | Scientific computations |

    | `sympy` | Symbolic Python | Symbolic computing |

    | `matplotlib` | Mathematical Plotting Library | For plotting graphs |


    It is important to note that whereas modern-day personal computers offer large
    memories, microcomputers like Raspberry Pi have limited memories. Hence, judicious
    use of these memory resources is highly recommended. Since all modules occupy
    some memory, they should be installed on a need-to basis. Also, they should be
    imported in the program as and when required. Python allows selective import of
    specific functions to optimize memory usage. It is considered a good practice
    to write programs that avoid wasteful use of resources.


    Mentioning the use of each module is beyond the scope of this book. Modules will
    be introduced as required by the topic at hand. Users are encouraged to explore
    various modules and their documentation for usage. A general use of modules and
    their functions will be dealt with at a later point in this book.


    ## 1.5 Summary


    Python has gained a lot of attention worldwide owing to its flat learning and
    steep development curves. It has gained the number-one spot in recent times in
    terms of popularity of programming languages. Owing to a large base of developers
    due to its open source model, Python has achieved a rich library of modules for
    various tasks required to solve many engineering problems. Hence, Python-educated
    engineers can fulfill the demands of modern industry, which demands fast and efficient
    solutions to its problems.


    # 2. Introduction to Python Basics


    ## 2.1 Introduction


    The best way to learn Python is to try Python on the Python interpreter. In this
    chapter, we will illustrate how to install and use the Python interpreter. Installation
    can be done on all popular operating systems. As examples, we will demonstrate
    installation on Windows, Ubuntu (Linux), and Mac OS X.


    ## 2.2 Installation


    The Python interpreter has been provided for a variety of platforms. An operating
    system defines a scheme to store files and run codes in a specific manner. These
    different schemes require different settings of the Python interpreter so that
    it can be compatible with the host it uses for computing resources. The three
    most popular choices for operating systems are Windows, Linux, and Mac OS X. While
    the Python interpreter comes pre-installed in Linux and Mac OS X, a Windows operating
    system would need a separate installation software. The Python community’s web
    site [[1](#A458920_1_En_2_Chapter.html#Par100)] provides the primary means of
    knowing the progress in this domain. It also provides the authentic downloads
    [[2](#A458920_1_En_2_Chapter.html#Par101)] of source code for installation.


    ### 2.2.1 Windows


    Users can download a 32-bit or a 64-bit installer file as per the system’s configurations
    and simply click it to start the installation process. As soon as it is finished,
    a symbol in the applications installation appears. When this symbol is double-clicked,
    it opens the Python shell (Figure [2-1](#A458920_1_En_2_Chapter.html#Fig1)), which
    is a program that runs the Python interpreter.


    ![A458920_1_En_2_Fig1_HTML.jpg](A458920_1_En_2_Fig1_HTML.jpg)


    **Figure 2-1** Python IDLE on Windows OS


    The downloaded IDLE also provides an option for a text editor that can run scripts.
    Alternatively, if you have properly defined the path of the interpreter to the
    system, you can simply open the terminal and type the following:


    ```

    $python hello.py

    ```


    Here we are assuming that you wish to run a Python program named `hello.py`. (All
    Python programs are saved with the extension `.py`.)


    We suggest learning the usage of the Python terminal for interactive programming
    and executing multiline codes in the manner previously discussed. Henceforth,
    the code written at the Python prompt (`>>>`) will signify that it is being written
    line-by-line and being executed in a similar fashion so that the programmer is
    working interactively at the Python prompt. The `.py` files used in this book
    are executed at the system’s terminal.


    ### 2.2.2 Ubuntu


    The Python interpreter is pre-installed in almost all Linux distributions. We
    will look at an example of Ubuntu Linux System here. The Python 3 interpreter
    can be called from a Linux command terminal by typing `python3` and pressing Enter.
    The terminal goes to the Python interpreter session (Figure [2-2](#A458920_1_En_2_Chapter.html#Fig2))
    where the programmer can type python expressions.


    ![A458920_1_En_2_Fig2_HTML.jpg](A458920_1_En_2_Fig2_HTML.jpg)


    **Figure 2-2** Python interpreter running on Ubuntu


    To exit the interpreter, you need to type `exit()` on the Python interpreter.
    When you come back to the Linux terminal, you can now type Linux expressions.


    ### 2.2.3 Mac OS X


    Mac OS X works in the same way as all Linux distributions. The Python interpreter
    comes pre-installed. You can start the Python interpreter session by simply typing
    `python3` on the terminal. (See Figure [2-3](#A458920_1_En_2_Chapter.html#Fig3).)'
  raw: '## 1.4 Modular Programming


    The modular nature of Python programming incorporates the complex tasks being
    divided into small modules that seamlessly interact with each other. Modules make
    both development and debugging easier, and they can be simply imported to enable
    the use of various functions.


    Python comes with thousands of modules to perform various tasks. Since this book
    is an introductory text for scientific computation, the usage of just a few basic
    necessary modules (shown in Table [1-2](#A458920_1_En_1_Chapter.html#Tab2)) will
    be discussed.


    Table 1-2


    Basic Python Modules


    | Package Name | Meaning | Purpose |

    | --- | --- | --- |

    | `numpy` | Numerical Python | Numerical computation |

    | `scipy` | Scientific Python | Scientific computations |

    | `sympy` | Symbolic Python | Symbolic computing |

    | `matplotlib` | Mathematical Plotting Library | For plotting graphs |


    It is important to note that whereas modern-day personal computers offer large
    memories, microcomputers like Raspberry Pi have limited memories. Hence, judicious
    use of these memory resources is highly recommended. Since all modules occupy
    some memory, they should be installed on a need-to basis. Also, they should be
    imported in the program as and when required. Python allows selective import of
    specific functions to optimize memory usage. It is considered a good practice
    to write programs that avoid wasteful use of resources.


    Mentioning the use of each module is beyond the scope of this book. Modules will
    be introduced as required by the topic at hand. Users are encouraged to explore
    various modules and their documentation for usage. A general use of modules and
    their functions will be dealt with at a later point in this book.


    ## 1.5 Summary


    Python has gained a lot of attention worldwide owing to its flat learning and
    steep development curves. It has gained the number-one spot in recent times in
    terms of popularity of programming languages. Owing to a large base of developers
    due to its open source model, Python has achieved a rich library of modules for
    various tasks required to solve many engineering problems. Hence, Python-educated
    engineers can fulfill the demands of modern industry, which demands fast and efficient
    solutions to its problems.


    # 2. Introduction to Python Basics


    ## 2.1 Introduction


    The best way to learn Python is to try Python on the Python interpreter. In this
    chapter, we will illustrate how to install and use the Python interpreter. Installation
    can be done on all popular operating systems. As examples, we will demonstrate
    installion on Windows, Ubuntu (Linux), and Mac OS X.


    ## 2.2 Installation


    The Python interpreter has been provided for a variety of platforms. An operating
    system defines a scheme to store files and run codes in a specific manner. These
    different schemes require different settings of the Python interpreter so that
    it can be compatible with the host it uses for computing resources. The three
    most popular choices for operating systems are Windows, Linux, and Mac OS X. While
    the Python interpreter comes pre-installed in Linux and Mac OS X, a Windows operating
    system would need a separate installation software. The Python community’s web
    site [[1](#A458920_1_En_2_Chapter.html#Par100)] provides the primary means of
    knowing the progress in this domain. It also provides the authentic downloads
    [[2](#A458920_1_En_2_Chapter.html#Par101)] of source code for installation.


    ### 2.2.1 Windows


    Users can download a 32-bit or a 64-bit installer file as per the system’s configurations
    and simply click it to start the installation process. As soon as it is finished,
    a symbol in the applications installation appears. When this symbol is double-clicked,
    it opens the Python shell (Figure [2-1](#A458920_1_En_2_Chapter.html#Fig1)), which
    is a program that runs the Python interpreter.


    ![A458920_1_En_2_Fig1_HTML.jpg](A458920_1_En_2_Fig1_HTML.jpg)


    Figure 2-1


    Python IDLE on Windows OS


    The downloaded IDLE also provides an option for a text editor that can run scripts.
    Alternatively, if you have properly defined the path of the interpreter to the
    system, you can simply open the terminal and type the following:


    ```

    1  $python hello.py

    ```


    Here we are assuming that you wish to run a Python program named `hello.py`. (All
    Python programs are saved with the extension `.py`.)


    We suggest learning the usage of the Python terminal for interactive programming
    and executing multiline codes in the manner previously discussed. Henceforth,
    the code written at the Python prompt (`>>>`) will signify that it is being written
    line-by-line and being executed in a similar fashion so that the programmer is
    working interactively at the Python prompt. The `.py` files used in this book
    are executed at the system’s terminal.


    ### 2.2.2 Ubuntu


