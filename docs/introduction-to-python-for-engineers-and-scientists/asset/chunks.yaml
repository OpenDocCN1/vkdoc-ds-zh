    ## 8.9 Infinite Loops


    If the logical expression always outputs the boolean value `True`, the program
    never stops. These loops are termed as infinite loops since they will take an
    infinite amount of time for execution. One of the simplest examples is given in
    the Python code `infinite.py` shown in Listing [8-9](#A458920_1_En_8_Chapter.html#Par67).


    ```

    1  # Program to define an infinite loop

    2  # Press Ctrl+C to interrupt execution of python REPL

    3  i=1

    4  while i==1:

    5      print(i)

    6  print("Good bye")

    Listing 8-9

    infinite–loop.py

    ```


    Since the condition always remains true , the program will never quit displaying
    the value of `i`, which is 1. It will never print the last line of the code. On
    a Linux machine, you need to press `CTRL+C` to interrupt the executing and come
    back to the command line.


    ## 8.10 `while-else`


    Within a `while` loop, the statements are executed if the condition produces a
    boolean value `True`. Using an `else` statement within this structure allows the
    user to route the flow of the program if the condition returns the boolean value
    `False`, as shown in Listing [8-10](#A458920_1_En_8_Chapter.html#Par70).


    ```

    1  # Python program to explain usage of while-else loop

    2  i=0


    4  while i<=5:

    5      print(i)

    6      i=i+1

    7  else:

    8      print("the value now execeeds 5")

