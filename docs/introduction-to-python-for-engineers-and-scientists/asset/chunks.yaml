- fmt: '### Random Choice


    给定一个数组，可以使用`numpy.random.choice()`函数生成另一个由该数组元素组成的数组：


    ```

    1  >>> a = numpy.array([1,2,3,4,5,6]) # define a target array

    2  >>> numpy.random.choice(a,3) # from target array, define an array of 3 X 1
    shape

    3  array([3, 4, 1])

    4  >>> numpy.random.choice(a,3) # from target array, define an array of 3 X 1
    shape

    5  array([4, 2, 2])

    6  >>> numpy.random.choice(a,3) # from target array, define an array of 3 X 1
    shape

    7  array([1, 2, 3])

    8  >>> numpy.random.choice(a,[2,3]) # from target array, define an array of 2
    X 3 shape

    9  array([[4, 3, 4],

    10  [6, 1, 5]])

    11  >>> numpy.random.choice(a,[2,3]) # from target array, define an array of 2
    X 3 shape

    12  array([[5, 5, 2],

    13  [6, 4, 4]])

    ```


    另一个函数`numpy.random.shuffle()`用于打乱数组的内容。需要注意的是，它只打乱行：


    ```

