    2  1

    3  2

    4  3

    5  4

    6  the value execeeds 5

    ```


    As soon as the incremented value becomes 5, the flow is handled by statements
    under the `else` condition .


    ## 8.11 Summary


    Functions enable the modular structure of programs. Additionally, controlling
    the flow of information as well as iterations has become the very basis of computational
    work in most applications. These two actions are performed by loops. Together,
    they make Python a powerful tool for various applications. Having a modular structure
    makes it easier to test and debug. Mastering the skill of writing functions and
    the skill of choosing the proper loop structure has become key indicators for
    ranking a programmer’s performance in solving problems using Python codes. Hence,
    this chapter is very important for programmers.


