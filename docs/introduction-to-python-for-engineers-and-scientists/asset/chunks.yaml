    \ class calling is: \n3  Hello World!\n\n5  Hello again!\n\n7  Hello Everybody\n\
    \n10  This program has two methods: hi and hi_again\n```\n\n### 9.6.3 构造函数\n\n\
    类中的所有对象都只是该类的实例。当这个实例被初始化时，会调用一种特殊的函数。构造函数是在对象实例化时执行的函数。Python 总是将构造函数命名为 `__init()__`，因为它设置了对象的初始状态。它定义了该实例的初始状态和基本性质。它在类定义中定义，但用户可以省略此定义，因为每个类都会自动创建一个默认构造函数。它通常用于定义实例变量的初始值，如清单\
    \ 9-2 所示。\n\n```\n1  #Python code to show usage of __init__\n\n3  # Defining a\
    \ class \"library\"\n4  # which stores information about book's name and price\n\
    \n6  #Defining class\n7  class library:\n8     'The base class for all books'\n\
    9     bookCount = 0 #Class variable setting count of books to zero\n\n11     def\
    \ __init__(self, name, price):# Initializing the instance of class with name,\
    \ price and updated book count\n12        self.name = name\n13        self.price\
    \ = price\n14        library.bookCount += 1\n\n16     def displayCount(self):\n\
    17       print(\"Total Employee %d\",library.bookCount)\n\n19     def displayBook(self):\n\
    20        print(\"Name : \", self.name,  \", Price: \", self.price)\n\n22  #Creating\
    \ objects\n\n24  book1 = library(\"Introduction to python\",100) # First    instance\
    \ of object \"library\"\n25  print(type(book1))\n\n27  book2 = library(\"Basic\
    \ Python\",150) # Second instance    of object \"library\"\n28  print(type(book2))\n\
    \n30  book3 = library(\"Intermediate Python\",200) # Third instanc    of object\
    \ \"library\"\n31  print(type(book3))\n\n33  book4 = library(\"Advanced Python\"\
    ,300) # Four instance    of object \"library\"\n34  print(type(book2))\n\n36 \
    \ # Accessing attributes\n\n38  print(\"Details of first book:\")\n39  book1.displayBook()\n\
    \n41  print(\"Details of second book:\")\n42  book2.displayBook()\n\n44  print(\"\
    Details of third book:\")\n45  book3.displayBook()\n\n47  print(\"Details of fourth\
    \ book:\")\n48  book4.displayBook()\n\n50  print(\"Total Number of books= %d\"\
    \ % library.bookCount)\n\n52  # Probing the bult-in attributes\n\n54  print(\"\
    library.__doc__:\", library.__doc__)\n55  print(\"library.__name__:\", library.__name__)\n\
    56  print(\"library.__module__:\", library.__module__)\n57  print(\"library.__bases__:\"\
    , library.__bases__)\n58  print(\"library.__dict__:\", library.__dict__)\nListing\
    \ 9-2\nEx–class1.py\n```\n\n代码 `Ex-class1.py` 可以解释如下：\n\n*   第 7 行定义了一个名为 `library`\
    \ 的类。该类旨在记录书名及其价格。\n*   第 9 行定义了一个名为 `bookCount` 的类变量，并将其设置为零值。\n    *   由于它是一个类变量，因此被所有实例共享。\n\
    \    *   可以在类内部或外部通过 `library.bookCount` 访问它。\n*   该类在第 11 行到第 14 行定义了一个构造函数，以及两个名为\
    \ `displayCount` 和 `displayBook` 的方法。\n*   第 11–14 行定义了用于初始化所有实例的构造函数：\n    *\
    \   它接受三个参数：`self`、`name` 和 `price`。\n    *   `self` 指向对象本身。\n    *   `name` 和\
    \ `price` 分别在第 12 行和第 13 行初始化。\n    *   这些参数在调用类时是必需的，即 `library(name,price)`。\n\
    \    *   此初始化信息被对象 `library` 的所有实例使用。\n*   第 16–17 行定义了一个名为 `displayCount` 的方法，并输出由\
    \ `bookCount` 变量引用的值。\n*   第 19–20 行定义了一个名为 `displayBook` 的方法，该方法提供书名和价格的信息。\n\
    *   第 21–33 行创建了对象 `library` 的单独实例。\n    *   根据构造函数的定义，调用类时的两个输入参数必须是存储在变量 `name`\
    \ 和 `price` 中的值。\n*   第 39、44、48 和 52 行逐个调用对象，探查由方法 `displayBook()` 定义的属性。\n*\
    \   第 50 行使用方法 `bookCount()` 显示书籍总数。\n"
- fmt: "#### Built-in Class Attributes\n\nAll Python classes have certain built-in\
    \ attributes that can be accessed by using the dot operator. This is done from\
    \ line 54 to line 58.\n\n- `__doc__`\n  - Gives the class documentation string\n\
    \  - Gives `None` if not defined\n- `__dict__`\n  - Gives the dictionary containing\
    \ the class’s namespace\n  - This dictionary contains the information about the\
    \ object `library`, namely:\n    - `__module__`\n    - Defined methods (`displayCount()`\
    \ and `displayBook()` in the present case)\n    - Defined class variable (`bookCount`\
    \ in the present case)\n    - `__doc__`\n    - Constructor `__init__`\n- `__name__`\n\
    \  - Gives the name of class\n- `__module__`\n  - Gives the name of the module\
    \ within which the class is defined\n  - In the interactive mode, this is `__main__`\n\
    - `__bases__`\n  - A possibly empty tuple containing the base classes in the order\
    \ of their occurrence in the base class list\n\nThe output of Python code `class1.py`\
    \ is given as follows:\n\n```\n5  Details of first book:\n6  Name:  Introduction\
    \ to python , Price:  100\n7  Details of second book:\n8  Name:  Basic Python\
    \ , Price:  150\n9  Details of third book:\n10  Name :  Intermediate Python ,\
    \ Price:  200\n11  Details of fourth book:\n12  Name :  Advanced Python , Price:\
    \  300\n13  Total Number of books= 4\n14  library.__doc__: The base class for\
    \ all books\n15  library.__name__: library\n16  library.__module__: __main__\n\
    17  library.__bases__: (,)\n18  library.__dict__: {'__module__': '__main__', '__doc__':\
    \ 'The base class for all books', 'bookCount': 4, '__init__': , 'displayCount':\
    \ , 'displayBook':, '__dict__': , '__weakref__': }\n```\n\n## 9.7 Summary\n\n\
    In this chapter, we have illustrated how to define a new kind of object using\
    \ the `class` construct. Since Python considers everything as an object, it is\
    \ one of the favorite choices for scientific computation and simulation. Because\
    \ it is easy to learn, users can start serious scientific computing very quickly.\
    \ This fact makes it very popular among educators, students, and researchers.\
    \ The ability to make classes and create your own modules enables developers to\
    \ enrich the Python ecosystem on a daily basis. Hence, it isn’t an overstatement\
    \ to say that the object-oriented nature of Python and its open source ecosystem\
    \ have made it one of the most popular programming languages.\n\n# 10. Numerical\
    \ Computing Formalism\n\n## 10.1 Introduction\n\nNumerical computation enables\
    \ us to compute solutions for numerical problems, provided we can frame them into\
    \ a proper format. This requires certain considerations. For example, if we digitize\
    \ continuous functions, we are going to introduce certain errors due to the sampling\
    \ at a finite frequency. Hence, a very accurate result would require a very fast\
    \ sampling rate. In cases when a large dataset needs to be computed, it becomes\
    \ a computationally intensive and time-consuming task. Also, users must understand\
    \ that the numerical solutions are an approximation, at best, when compared to\
    \ analytical solutions. The onus of finding their physical meaning and significance\
    \ lies on us. The art of discarding solutions that do not have a meaning for a\
    \ real-world scenario is something that a scientist/engineer develops over the\
    \ years. Furthermore, a computational device is just as intelligent as its operator.\
    \ The law of GIGO (garbage in, garbage out) is followed very strictly in this\
    \ domain.\n\nIn this chapter, we will consider some of the important steps in\
    \ solving a physical problem using numerical computation. Defining a problem in\
    \ proper terms is just the first step. Making the right model and then using the\
    \ right method to solve (solver) the problem distinguishes an experienced scientist/engineer\
    \ from a novice.\n\n## 10.2 Physical Problems\n\nEverything in our physical world\
    \ is governed by physical laws. Because of the men and women of science who toiled\
    \ under difficult circumstances to come up with fine solutions for the natural\
    \ events happening around us, we obtained mathematical theories for physical laws.\
    \ To test these mathematical formalisms of physical laws, we use numerical computation.\
    \ If it yields the same results as that of a real experiment, they validate each\
    \ other. Numerical simulations can remove the need of doing an experiment altogether\
    \ provided we have a well-tested mathematical formalism. For example, nuclear\
    \ powers of our times don’t have to test real nuclear bombs anymore. The data\
    \ about nuclear explosions, which were obtained during real nuclear explosions,\
    \ have enabled scientists to model these physical systems quite accurately, thus\
    \ eliminating the need for a real test.\n\nIn addition to applications such as\
    \ simulating a real experiment, modeling physical problems is a good educational\
    \ exercise. While modeling, hands-on exercises enable students to explore the\
    \ subject in depth and give a proper meaning of the topic under study. Solving\
    \ numerical problems and visualizing the results make the learning permanent and\
    \ also ignite the research related to flaws in mathematical theory, ultimately\
    \ leading to new discoveries."
