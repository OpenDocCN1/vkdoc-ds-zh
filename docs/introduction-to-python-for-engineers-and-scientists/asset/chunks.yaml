    14  执行时间 = 2.22369708354e-05 秒


    16  5 的平方根 = 2.24:

    17  执行时间 = 2.18093368858e-05 秒


    19  6 的平方根 = 2.45:

    20  执行时间 = 2.13817029362e-05 秒


    22  7 的平方根 = 2.65:

    23  执行时间 = 2.1809336431e-05 秒


    25  8 的平方根 = 2.83:

    26  执行时间 = 2.22369708354e-05 秒


    28  9 的平方根 = 3.00:

    29  执行时间 = 2.43751414928e-05 秒


    31  结束

    ```


    请注意，即使在相同的计算机上，每次执行的输出时间也可能不同，因为处理一行代码所需的时间取决于该特定时刻 CPU 的状态。


    ## 8.9 无限循环


    如果逻辑表达式始终输出布尔值 `True`，程序将永远不会停止。这些循环被称为无限循环，因为它们将花费无限的时间来执行。清单 8-9 中所示的 Python
    代码 `infinite.py` 给出了一个最简单的示例。


    ```

    1  # 定义无限循环的程序

    2  # 按 Ctrl+C 中断 Python REPL 的执行

    3  i=1

    4  while i==1:

    5      print(i)

    6  print("再见")

    清单 8-9

    infinite–loop.py

    ```


    由于条件始终为真，程序将永远不会停止显示 `i` 的值（即 1）。它永远不会打印代码的最后一行。在 Linux 机器上，您需要按 `CTRL+C` 来中断执行并返回命令行。


    ## 8.10 `while-else`


    在 `while` 循环中，如果条件产生布尔值 `True`，则执行语句。在此结构中使用 `else` 语句允许用户在条件返回布尔值 `False` 时引导程序流程，如清单
    8-10 所示。


    ```

    1  # 解释 while-else 循环用法的 Python 程序

    2  i=0


    4  while i<=5:

    5      print(i)

    6      i=i+1

    7  else:

    8      print("该值现在超过 5")

    清单 8-10

    while–else.py

    ```


    结果如下：


    ```

    1  0

    2  1

    3  2

    4  3

    5  4

    6  该值现在超过 5

    ```


    一旦递增后的值变为 5，流程将由 `else` 条件下的语句处理。


    ## 8.11 总结


    函数使程序具有模块化结构。此外，控制信息流和迭代已成为大多数应用程序中计算工作的基础。这两个操作由循环执行。它们共同使 Python 成为适用于各种应用程序的强大工具。模块化结构使其更易于测试和调试。掌握编写函数的技能以及选择合适循环结构的技能已成为衡量程序员使用
    Python 代码解决问题能力的关键指标。因此，本章对程序员来说非常重要。


