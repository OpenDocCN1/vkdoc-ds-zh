- fmt: '## 8.7 `if-else` Loop


    In the example Python code `pytha.py`, an `if` statement has already been used.
    It simply checks a condition, runs the loop if the condition results `True` boolean
    data, and exits the loop if the condition results `False` boolean data. When multiple
    conditions need to be checked in a sequence, `if-else` loops are employed where
    the `if` condition results `True` boolean data and the statement is executed.
    Otherwise, the next condition is checked and a similar operation is performed
    recursively. This action is performed unless all conditions result in returning
    the `False` boolean data. (See Listing [8-7](#A458920_1_En_8_Chapter.html#Par56).)


