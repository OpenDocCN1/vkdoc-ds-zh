    ### 6.5.4 meshgrid( )


    The `meshgrid` is modeled after the MATLAB `meshgrid` command. To understand the
    working of `meshgrid`, it’s best to use it once as follows:


    ```

    1  >>> xx = numpy.linspace(1,3,3)

    2  >>> xx

    3  array([ 1.,  2.,  3.])

    4  >>> yy = numpy.linspace(2,4,3)

    5  >>> yy

    6  array([ 2.,  3.,  4.])

    7  >>> (a,b) = numpy.meshgrid(xx,yy)

    8  >>> a

    9  array([[ 1.,  2.,  3.],

    10  [ 1.,  2.,  3.],

    11  [ 1.,  2.,  3.]])

    12  >>> b

    13  array([[ 2.,  2.,  2.],

    14  [ 3.,  3.,  3.],

    15  [ 4.,  4.,  4.]])

    ```


    `meshgrid()` makes a two-dimensional coordinate system where the x-axis is given
    by the first argument (here `xx`) and the y-axis is given by the second argument
    (here `yy`). This function is used while plotting three-dimensional plots or defining
    a function defined on two variables.


    ### 6.5.5 mgrid() and ogrid()


    `mgrid` and `ogrid` are used to created mesh directly (that is, without using
    `linspace`, `arange`, and so on). A simple statement like


    ```

    mgrid[a:b , c:d]

    ```


    constructs a grid where the x-axis has points from `a` to `b` and the y-axis has
    points from `c` to `d`.


    `mgrid` constructs a multidimensional `meshgrid`. The following example demonstrates
    its use:


    ```

    1  >>> (a,b) = numpy.mgrid[1:10 , 2:5]

