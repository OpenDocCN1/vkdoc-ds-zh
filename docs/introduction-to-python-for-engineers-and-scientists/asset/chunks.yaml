    ```

    1  >>>import matplotlib as ml

    2  >>>ml.rcParams[''figure.figsize'']

    3  [8.0, 6.0]

    4  # 默认图形大小为 8 X 6 英寸

    5  >>>ml.rcParams[''savefig.dpi'']

    6  100.0

    7  # 默认图形分辨率为 100 dpi

    ```


    由于创建了一个 8 × 6 英寸、100 dpi（每英寸点数/像素）的图形，因此使用 `savefig()` 默认会保存一个 800 × 600 像素的图像。当此文件被定向到计算机图形终端进行显示时，长度单位将被忽略，直接显示像素。如果文件被定向到打印介质（如打印机或绘图仪），则长度参数和
    DPI 将决定图形大小和分辨率。

