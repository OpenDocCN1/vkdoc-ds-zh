  trans: '

    ### 4.4.1 字符串


    字符串仅仅是字符序列。小写和大写字符具有不同的编码；因此，字符串是区分大小写的：


    ```

    1  >>> type(''a'')


    3  >>> type(''abba'')


    5  >>> type("a")


    7  >>> type("abba")


    ```


    这里，我们分别定义了一个单字符和四字符的字符串。重要的是要记住，空白字符也是一个字符。因此，`Hello world!` 有 12 个字符，即 `h`、`e`、`l`、`l`、`o`、`
    `、`w`、`o`、`r`、`l`、`d`、`!`。在定义字符串时，我们用 `"` 或 `""` 将字符括起来。当字符串需要跨越多行时，会使用三组引号：


    ```

    1  >>> print("""Python can also print multiline strings which can       span many
    lines instead of being printed on just one line""")

    2  Python can also print multiline strings which can span many lines instead of

    being printed on just one line

    ```


    你可以使用特殊字符来打印字符以定义空格，并在新行上打印字符。这可以通过使用 `\t` 和 `\n` 字符来实现，它们分别打印一个制表符和一个换行符：


    ```

    1  >>> print ("'' Python can also print multiline strings having tabs like

    \t and also prints in \n next line"'')

    2  Python can also print multiline strings having tabs like and also prints in

    3      next line

    ```


    注意，在 `\t` 的位置打印了四个空格作为制表符，而 `\n` 之后的字符串部分打印在新的一行上，因为 `\n` 是一个换行符。


    但是，为什么我们要有三种方式来定义字符串，即使用单引号、双引号和三引号？单引号可用于打印包含双引号作为字符的字符串。双引号可用于打印包含单引号作为字符的字符串。三引号可用于同时打印双引号和单引号作为字符。这种行为可以通过以下代码来研究：


    ```

    1  >>> print("''Mahatma Gandhi''s words, "An eye for an eye makes the whole world
    blind”, stand true even today”’)

    2  Mahatma Gandhi''s words, "An eye for an eye makes the whole world blind", stand
    true even today

    ```


    ### 4.4.2 列表和元组


    列表是一个有序的对象集合，无论其数据类型如何。它可以通过将一组值括在方括号中来定义。例如：


    ```

    1  >>> [1,2.0,''a'',"Alpha"]

    2  [1, 2.0,''a'',''Alpha'']

    3  >>> type([1,2.0,''a '',"Alpha"])


    ```


    在 Python 代码中，列表的第一个元素是整数，第二个是浮点数，第三个是单字符字符串，第四个是多字符字符串。


    元组使用`圆括号 ()` 而不是方括号 `[]` 来定义。例如：


    ```

    1  >>> (1,2.0,''a'',"Alpha")

    2  (1,2.0,''a'',''Alpha'')

    3  >>> type((1,2.0,''a'',"Alpha"))


    ```


    除了使用不同的括号定义之外，列表和元组的主要区别在于元组是不可变的列表；它们的元素一旦定义，就不能被更改。列表的元素可以使用它们的索引来更改。关于如何操作的更多信息将在第
    5 章中讨论，其中定义了列表的操作。在科学计算中，通用常量可以定义为一个元组，然后在程序中通过其索引进行访问。


    ## 4.5 集合与冻结集合


    集合数据类型是数学集合的实现。它是一个无序的对象集合。与序列对象（如 `list` 和 `tuple`，其中元素是有序的）不同，集合没有这样的要求。然而，集合不允许元素重复出现，也就是说，一个元素要么出现
    0 次，要么出现 1 次。`list` 和 `tuple` 对象则不是这种情况。


    集合使用 `set()` 函数定义，该函数接受一个 `list` 作为其输入参数。例如：


    ```

    1  >>> set([''h'',''e'',''l'',''l'',''o'',1,2.0,3+4j])

    2  {1, 2.0, ''h'', ''o'', (3+4j), ''l'', ''e''}

    3  >>> type(set([''h'',''e'',''l'',''l'',''o'',1,2.0,3+4j]))


    5  >>> frozenset([''h'',''e'',''l'',''l'',''o'',1,2.0,3+4j])

    6  frozenset({1, 2.0, ''h'', ''o'', (3+4j), ''l'', ''e''})

    7  >>> type(frozenset([''h'',''e'',''l'',''l'',''o'',1,2.0,3+4j]))


    ```


    请注意，由于 `l` 在定义集合时出现了两次，它只被授予了一个成员资格。集合操作将在后续章节中详细讨论。就像 `tuple` 对象是不可变的一样，`frozenset`
    也是一个不可变对象，并且类似于 `set` 对象。


    ## 4.6 映射


    映射是一种定义数据的方案，其中每个元素都由一个称为“哈希标签”的键来标识。可以通过引用该键来访问元素。此类别中的一种数据类型是字典。


    字典是与键相关联的无序值对。这些值通过键而不是索引来访问。这些键必须是可哈希的，例如整数、浮点数、字符串、元组和冻结集合。列表、字典以及除冻结集合之外的集合是不可哈希的。以下是字典的一个示例：


    ```

    1  >>> {''a'':1, ''b'':10}

    2  {''a'':1, ''b'':10}

    3  >>> type({''a'':1, ''b'':10})


    ```


    在这个例子中，我们创建了一个包含两个字符 `a` 和 `b` 的字典，它们由两个键 `1` 和 `10` 标识。各种运算符可以对字典进行操作，这将在后续章节中讨论。


    ## 4.7 空对象


    `None` 是一个空对象。在其他编程语言（包括 C、Java 和 PHP）中，空对象由关键字 `null` 表示，但在 Python 中，它由关键字 `None`
    表示。它指的是无功能性（即，与其关联的对象没有行为）。当在 Python 提示符下输入它时，什么也不会发生：


    ```

    1  >>> None

    2  >>> type(None)


    ```


    ## 4.8 总结


    面向对象编程利用了这样一个事实：所有计算实体都只是对象，它们根据其定义的行为相互交互。我们在本章中讨论了一些内置数据类型。一些数据类型在模块内部定义。用户可以定义自己的数据类型并定义其属性。在进入这些高级主题之前，了解运算符如何对各种数据进行操作将很有用。这将是第
    5 章的主题。


    # 5. 运算符

    '
- fmt: "# 5.1 Introduction\n\nOperators work in a similar fashion to mathematical\
    \ functions. They provide a relationship between two different domains. For example,\
    \ the multiplication operator makes an ordered pair of operands (data on which\
    \ the operator works) and produces another data point. This can be done to any\
    \ number of data points. In this way, the operator transforms data from the domain\
    \ of operands to the domain of results.\n\nThe symbols for basic operators are\
    \ given in Table [5-1](#A458920_1_En_5_Chapter.html#Tab1).\n\n**Table 5-1** Symbols\
    \ for Basic Operators\n\n| Mathematical Operation | Symbol |\n| --- | --- |\n\
    | Addition | `+` |\n| Subtraction | `-` |\n| Multiplication | `*` |\n| Division\
    \ | `\\` |\n| Modulus | `%` |\n| Exponentiation | `**` |\n\nThese operators can\
    \ be combined in a complex manner to perform an arithmetic operation. Depending\
    \ on the data type, they define their functionality. For example, on numeric data,\
    \ `+` performs numeric addition, whereas on a string, it will perform concatenation.\
    \ Similarly, the multiplication operator, when applied on strings, concatenates\
    \ the string those many number of times. The division, modulus, and exponentiation\
    \ operators do not have defined behavior for strings. This behavior can be verified\
    \ in the following Python code:\n\n```\n1  >>> 2+3\n2  5\n3  >>> 'a' + 'b'\n4\
    \  'ab'\n5  >>> \"\"hello\" + \" \" + \"world\" + \"!\"\n6  'hello world !\n7\
    \  >>> 'a'∗3\n8  'aaa'\n9  >>> 'a'/3\n10  Traceback (most recent call last):\n\
    11  File \"\", line 1, in \n12  TypeError: unsupported operand type(s) for /:\
    \ 'str' and 'int'\n13  >>> 'a'%3\n14  Traceback (most recent call last):\n15 \
    \ File \"\", line 1, in \n16  TypeError: not all arguments converted during string\
    \ formatting\n17  >>> 'a'∗∗3\n18  Traceback (most recent call last):\n19  File\
    \ \"\", line 1, in \n20  TypeError: unsupported operand type(s) for ∗∗ or pow():\
    \ 'str and 'int'\n```\n\nThere are a variety of operators that can operate on\
    \ data types, as discussed in Chapter [4](#A458920_1_En_4_Chapter.html).\n\nThe\
    \ following section will discuss a variety of built-in operators including arithmetic\
    \ and logical/boolean. Please note that the field of operators is not limited\
    \ to the discussion in this chapter. Modules define new data types for which new\
    \ operators are defined. We will confine our discussion to built-in basic operators.\
    \ We will illustrate the usage of these built-in operators and their usage in\
    \ defining a mathematical calculation.\n\n## 5.2 Concept of Variables\n\nWhen\
    \ an operator acts on data, its values can change during the course of computation.\
    \ This can happen multiple times. To store values temporarily (for example, during\
    \ the course of computation), we use variables. Variables point to a particular\
    \ value at a memory location via its address (visualized as a hexadecimal number).\
    \ This whole setup can be assigned a symbolic string, which is called the variable\
    \ name.\n\nFor example, we can store the value of 0.12 as a variable `a` and then\
    \ use it in an equation like\n\n![$$ {1010}_2=1\\times {2}^3+0\\times {2}^2+1\\\
    times {2}^1+0\\times s{s}^0 $$](A458920_1_En_5_Chapter_Equa.gif)\n\n```\n1  >>>\
    \ a=0.12 # assigning value 0.12 to variable named 'a'\n2  >>> answer = (a∗∗2)\
    \ + (10 ∗ a) #performing calculation and storing in variable name 'answer'\n3\
    \  >>> print(a)\n4  0.12\n5  >>> print(answer)\n6  1.2144\n7  >>> type(answer)\
    \ #scanning the type for value stored in variable named 'answer'\n\n9  >>> a=5\
    \ # reassigning different value to 'a'\n10  >>> print(a) # New value is reflected\n\
    11  5\n12  >>> print(answer) # old value is still stored in 'answer'\n13  1.2144\n\
    14  >>> answer = (a∗∗2) + (10 ∗ a) # calculation using new values\n15  >>> print(answer)\
    \ # New value is printed\n16  75\n```\n\nHere the numerical value 0.12 is stored\
    \ at a memory location known by the name `a`. This is called by a subsequent equation\
    \ defined using a variable name `answer`, which, when printed, prints the value\
    \ stored in it. The value stored is a floating point number. The type of object\
    \ can be known by the function `type()`, which takes the variable name as its\
    \ argument.\n\nThis variable changes the value to the new value 5. However, unless\
    \ the computation is performed, the variable `answer` stores the old evaluated\
    \ value. When the new value `a` is used, the value of `answer` is also changed.\
    \ Python variables don’t need to be explicitly defined for their type. The types\
    \ are guessed from the value they point to. It is important to understand that\
    \ variables are merely pointers to memory locations. When values change, these\
    \ pointers change to a different address. It is the memory that stores the data.\
    \ Data can be of any type. In the example previously discussed, the data were\
    \ a number, but they can be any of any type.\n\n### 5.2.1 Rules of Naming Variables\n\
    \nSince Python uses certain keywords for its own uses, there are certain names\
    \ that should not be used for variables. In addition, there are also some internationally\
    \ accepted rules (usually common for most programming languages):\n\n- They must\
    \ begin with a letter (a–z, A–B) or underscore (`_`).\n- The rest of the characters\
    \ can be letters, numbers, or `_`.\n- Names are case-sensitive.\n- There is no\
    \ limit to the length of names, but it is advisable to keep them short and meaningful.\n\
    - `Keywords` cannot be used as variable names.\n\nUsing the module `keyword`,\
    \ you can obtain the list of keywords using the function `keyword.kwlist`. The\
    \ code given in `keyword.py` gives a list of keywords, which cannot be used as\
    \ variable names. (See Listing [5-1](#A458920_1_En_5_Chapter.html#Par18).)\n\n\
    ```\n1  import keyword\n\n3  print (\"Python keywords:\", keyword.kwlist)\nListing\
    \ 5-1\nKeyword.py\n```\n\nThe result of running this code is given by:\n\n```\n\
    1  Python keywords:   ['False', 'None', 'True', 'and', 'as', 'assert', 'break',\
    \ 'class', 'continue', 'def', 'del', 'elif', 'else', 'except', 'finally', 'for',\
    \ 'from', 'global', 'if', 'import', 'in', 'is', 'lambda', 'nonlocal', 'not', 'or',\
    \ 'pass', 'raise', 'return', 'try', 'while', 'with', 'yield']\n```\n\nA handy\
    \ way of checking a name among the keywords list exists for an interactive session.\
    \ To check if a particular variable name is a keyword or not, you can use the\
    \ function `keyword.iskeyword()`. The name can be input as a string to this function.\
    \ As shown in the following code, if the input string is a keyword, then the value\
    \ `True` is returned. Otherwise, `False` is returned:\n\n```\n1  >>>import keyword\n\
    2  >>>keyword.is keyword ('lambda')\n3  True\n4  >>>keyword.is keyword ('lamb')\n\
    5  False\n```\n\nSo the name `lambda` is a keyword but the name `lamb` isn’t."
