  trans: "\n### 5.3 赋值运算符\n\n变量的概念使用了符号 `=`，这与数学中的“等于”不同。相反，它是赋值运算符之一。符号 `=` 将右侧的值赋给左侧的变量名。这本质上意味着它记下右侧值的内存地址，并将其与左侧的变量名关联起来。以下\
    \ Python 代码演示了这种行为：\n\n```\n1  >>> a = 5 # 将值 5 赋给 a\n2  >>> a # Python REPL 打印\
    \ a 的值\n3  5\n4  >>> print(a) # print() 函数打印 a 的值\n5  5\n6  >>> a = 10 # 将新值 10\
    \ 重新赋给 a\n7  >>> a # 打印 a 的值，并显示新值作为结果\n8  10\n9  >>> b = a # 将 a 指向的值赋给新变量 b\n\
    10  >>> b # b 现在存储 a 最后存储的值，即 10\n11  10\n12  >>> a = 15 # 将新值 15 重新赋给 a\n13 \
    \ >>> a # REPL 打印 a 的新赋值\n14  15\n15  >>> b # REPL 打印 b 的值，即上次赋的值\n16  10\n```\n\
    \n变量的值可以通过在 Python REPL 中直接输入变量名并按 `Enter` 键来打印。也可以使用 `print()` 函数打印，该函数将变量名作为输入（不是不带引号的字符串）。此外，打印的值对应于最后赋的值。当执行\
    \ `b=a` 时，使用的是 `a=10`。当执行 `a=15` 时，`a` 的值改变了，但 `b` 的值保持不变。这种行为可以通过以下方式理解：\n\n\
    *   `a=10`\n    *   变量 `a` 指向存储值 `10` 的内存位置。\n*   `b=a`\n    *   变量 `b` 也指向与 `a`\
    \ 相同的内存位置。\n*   `a=15`\n    *   变量 `a` 现在指向一个存储值 `15` 的不同内存位置。\n    *   变量 `b`\
    \ 仍然指向存储值 `10` 的内存位置。\n    *   除非它们被重新赋值，否则两者都将保持这种状态。\n\n除了这个简单的赋值运算符之外，还有更多可以执行操作的运算符。表\
    \ 5-2 提供了此类赋值运算符的信息。\n\n**表 5-2** 赋值运算符\n\n| 运算符 | 示例 |\n| --- | --- |\n| `=`\
    \ | `v = a+b` |\n| `+=` | `v +=a ⇒ v = v + a` |\n| `-=` | `v -=a ⇒ v = v - a`\
    \ |\n| `/=` | `v /=a ⇒ v = v / a` |\n| `//=` | `v //=a ⇒ v = v // a` |\n| `*=`\
    \ | `v *=a ⇒ v = v * a` |\n| `**=` | `v **=a ⇒ v = v ** a` |\n| `%=` | `v %=a\
    \ ⇒ v = v % a` |\n\n赋值运算符是所有类型程序中最常用的特性。递增和递减运算符（如 `+=` 和 `-=`）在需要逐步进行的过程中被广泛使用。以下\
    \ Python 代码将阐明这一点：\n\n```\n1  >>> a = 10 # 将值 10 赋给 a\n2  >>> a # REPL 打印 a 的值\n\
    3  10\n4  >>> b = 0 # 将值 0 赋给 b\n5  >>> b # REPL 打印 b 的值，即 0\n6  0\n7  >>> b +=\
    \ a # b 的新值是 b+a，即 0+10=10\n8  >>> b # REPL 打印 b 的值，即 10\n9  10\n10  >>> b = 1\
    \ # 将值 1 重新赋给 b\n11  >>> b += a # 现在 b 被重新赋值为 b+a，即 1+10=11\n12  >>> b # REPL\
    \ 打印 b 的新赋值，即 11\n13  11\n```\n\n类似地，我们可以测试其他运算符：\n\n```\n1  >>> a = 10 # 将值 10\
    \ 赋给 a\n2  >>> b = 5 # 将值 5 赋给 b\n3  >>> a # REPL 打印 a 的值\n4  10\n5  >>> b # REPL\
    \ 打印 b 的值\n6  5\n7  >>> b += a # b 被重新赋值为 b+a=10+5=15\n8  >>> a # a 仍然指向值 10\n\
    9  10\n10  >>> b # b 指向新重新赋值的 15\n11  15\n12  >>> b -=a # b 被重新赋值为 b-a=15-10=5\n\
    13  >>> a # a 仍然指向值 10\n14  10\n15  >>> b # b 指向新重新赋值的 5\n16  5\n17  >>> b /=a\
    \ # b 被重新赋值为 b/a=0.5，即除法运算的商\n18  >>> a # a 仍然指向值 10\n19  10\n20  >>> b # b 指向新重新赋值的\
    \ 0.5\n21  0.5\n22  >>> b  //=a # b 被重新赋值为 b/a=0.0，即整除运算的商\n23  >>> a # a 仍然指向值\
    \ 10\n24  10\n25  >>> b # b 指向新重新赋值的 0.0\n26   0.0\n27  >>> a = 10 # a 被重新赋值为相同的值\
    \ 10\n28  >>> b = 5 # b 被重新赋值为新值 5\n29  >>> a # a 仍然指向值 10\n30  10\n31  >>> b\
    \ # b 仍然指向值 5\n32  5\n33  >>> a ∗= b # a 被重新赋值为 a∗b=10∗5=50\n34  >>> a # a 现在指向新重新赋值的值，即\
    \ 50\n35  50\n36  >>> b # b 仍然指向值 5\n37  5\n38  >>> a ∗∗= b # a 被重新赋值为 a∗∗b，即\
    \ 50 的 5 次方，即 312500000\n39  >>> a # a 现在指向新赋值的值 312500000\n40  312500000\n41\
    \  >>> b # b 仍然指向旧值 5\n42  5\n43  >>> a %= b # a 被重新赋值为 a%b=312500000%5，即 312500000/5\
    \ 的余数 = 0\n44  >>> a # a 现在指向新重新赋值的值，即 0\n45  0\n46  >>> b # b 仍然指向旧值 5\n47  5\n\
    ```\n\n我们还在前面的 Python 代码中了解了算术运算符 `+`、`-`、`*`、`**`、`/`、`//` 和 `%`。它们将在第 5.4 节中详细讨论。它们可以用于不同的数字类型，并且可以轻松执行数学计算。你唯一需要记住的是特定数据类型中可以存储的最大数字的限制，以及算术运算符是否允许将特定数据类型作为其参数之一。\n\
    \n可以在同一个语句中使用 `=` 运算符进行多重赋值，如下所示：\n\n```\n1  >>> a = b = c = 10\n2  >>> a\n3 \
    \ 10\n4  >>> b\n5  10\n6  >>> c\n7  10\n8  >>> c = 15\n9  >>> a\n10  10\n11  >>>\
    \ b\n12  10\n13  >>> c\n14  15\n15  >>> a = b = c = 15\n16  >>> a\n17  15\n18\
    \  >>> b\n19  15\n20  >>> c\n21  15\n```\n\n在前面的 Python 代码中，首先 `c=10` 将值 10 赋给变量名\
    \ `c`，然后 `b=c` 将 `c` 中存储的值（即 10）赋给变量名 `b`。此外，`a=b` 将 `b` 的赋值赋给 `a`。实际上，所有三个变量（`a`、`b`\
    \ 和 `c`）都指向存储整数 10 的同一内存位置。当 `c` 被赋予新值 15 时，变量名 `a` 和 `b` 继续指向存储值 10 的内存位置，但 `c`\
    \ 现在指向存储值 15 的新内存位置。当再次对值 15 执行多重赋值时，`a`、`b` 和 `c` 指向新赋值的、指向值 15 的内存位置。\n\n在赋值时，不需要显式定义其数据类型。Python\
    \ 解释器会根据数据本身来判断。例如，`4.0` 将被视为浮点数，`4` 将被视为整数，单个字符 `'a'` 或一组字符（如 `'sandeep'`）将被视为字符串。以下示例代码展示了这一点：\n\
    \n```\n1  >>> a = 4.0; type(a) # a 被赋值为 4.0，其类型被确定为浮点数\n2  <class 'float'>\n3\
    \  >>> a = 4; type(a) # a 被赋值为 4，其类型被确定为整数\n4  <class 'int'>\n5  >>> a = 4e10;type(a)\
    \ # a 被赋值为 4 X 10ˆ10，其类型被确定为浮点数\n6  <class 'float'>\n7  >>> b = 'a'; type(a) #\
    \ b 被赋值为与 a 相同的值，即 4 X 10ˆ10，其类型被确定为浮点数\n8  <class 'float'>\n9  >>> b = 'sandeep';\
    \ type(b) # b 被重新赋值为字符串，其类型被确定为字符串\n10  <class 'str'>\n```\n\n可以注意到，定义浮点数的另一种方法是通过工程记数法。例如，`4e10`\
    \ 表示数字 4 × 10¹⁰ 的工程记数法。此外，通过使用 `;`，可以抑制在 REPL 处打印输出。赋值的值被抑制在 REPL 处打印，但 `type()`\
    \ 函数的输出不会被抑制，因此它会在 REPL 处打印。\n"
- fmt: "# 5.4 Arithmetic Operators\n\nMathematical operators such as `+`, `-`, `%`,\
    \ `/`, and `//` (Table [5-4](#A458920_1_En_5_Chapter.html#Tab4)) work by the same\
    \ logic as in mathematics. `a ^ b` is written as `a**b` and floor division is\
    \ denoted by `//` symbols. Floor division (using symbols `//`) is when the quotient\
    \ is rounded off toward −∞ (in other words, toward the nearest integer on the\
    \ left-hand side of a number line):\n\n```\n1  >>> 4.2 % 2.3 #output is the remainder\n\
    2  1.9000000000000004\n3  >>> 4.2 / 2.3 # output is the quoteint\n4  1.8260869565217392\n\
    5  >>> 4.2 + 2.3 # output is addition\n6  6.5\n7  >>> 4.2 - 2.3 # output is subtraction\n\
    8  1.9000000000000004\n9  >>> 4.2 ∗∗ 2 # output is exponentiation\n10  17.64\n\
    11  >>> 4.2 // 2.3 # output is floor division\n12  1.0\n```\n\nSome arithmetic\
    \ operators work on `string` and `list` objects as well. For example, `+` acts\
    \ as a concatenation operator on strings; it joins the two or more arguments together\
    \ from head to tail. The same thing happens for a list data type. Also, the `*`\
    \ operator simply performs repeated `+` by the number of arguments as mentioned\
    \ by the integer. If the argument is a floating point number, you would encounter\
    \ an error message. If you apply other arithmetic operators on strings and lists,\
    \ then you also encounter error messages. The following Python code showcases\
    \ this behavior:\n\n```\n1  >>> 'hello' + ' ' + 'world' + '!'\n2  'hello world!'\n\
    3  >>> [1,2,3] + [4,5,6]\n4  [1, 2, 3, 4, 5, 6]\n5  >>> 'hello' ∗3\n6  'hello\
    \ hello hello'\n7  >>> [1,2,3] ∗ 3\n8  [1, 2, 3, 1, 2, 3, 1, 2, 3]\n9  >>> 'hello'\
    \ ∗3.1\n10  Traceback (most recent call last):\n11  File \"\", line 1, in \n12\
    \  TypeError: can't multiply sequence by non-int of type 'float'\n13  >>> [1,2,3]\
    \ ∗3.1\n14  Traceback (most recent call last):\n15  File \"\", line 1, in \n16\
    \  TypeError: can't multiply sequence by non-int of type 'float'\n17  >>> 'hello'\
    \ /3\n18  Traceback (most recent call last):\n19  File \"\", line 1, in \n20 \
    \ TypeError: unsupported operand type(s) for /: 'str' and 'int'\n21  >>> [1,2,3]\
    \ // 3\n22  Traceback (most recent call last):\n23  File \"\", line 1, in \n24\
    \  TypeError: unsupported operand type(s) for //: 'list' and 'int'\n25  >>> 'hello'\
    \ % 3\n26  Traceback (most recent call last):\n27  File \"\", line 1, in \n28\
    \  TypeError: not all arguments converted during string formatting\n29  >>> [1,2,3]\
    \ % 3\n30  Traceback (most recent call last):\n31  File \"\", line 1, in \n32\
    \  TypeError: unsupported operand type(s) for %: 'list' and 'int'\n33  >>> [1,2,3]\
    \ - 3\n34  Traceback (most recent call last):\n35  File \"\", line 1, in \n36\
    \  TypeError: unsupported operand type(s) for -: 'list' and 'int'\n37  >>> 'hello'\
    \ - 3\n38  Traceback (most recent call last):\n39  File \"\", line 1, in \n40\
    \  TypeError: unsupported operand type(s) for -: 'str' and 'int'\n```\n\nThe behavior\
    \ of `*` on strings and lists can be understood if you consider mathematical multiplication\
    \ in terms of addition: `2 * 5 = 2 + 2 + 2 + 2 + 5`. Hence, multiplication with\
    \ `m` means adding `m` times.\n\n## 5.5 Changing and Defining Data Type\n\nData\
    \ types of objects can be changed as per their definitions. The function `int()`\
    \ converts an input to an integer by rounding it off to the nearest integer. Similarly,\
    \ `float()` makes the type of answer a floating point number. All integers can\
    \ be made floating point numbers as `4` can also be defined as `4.0`. The `str()`\
    \ function converts its arguments to a string object. It is worth noting that\
    \ the `int()` and `float()` functions cannot convert a string input to their data\
    \ type. On the other hand, giving a numeral input to the `str()` function converts\
    \ its data type to a string. It does not remain a number anymore but behaves like\
    \ a character. The following Python code demonstrates this behavior:\n\n```\n\
    1  >>> int(4.2345) # rounder to integer 4\n2  4\n3  >>> int(4.7345) # rounded\
    \ to integer 4\n4  4\n5  >>> float(4) # converted to floating point number 4.0\n\
    6  4.0\n7  >>> float(0.4) #remains a floating point number 0.4\n8  0.4\n9  >>>\
    \ str(4) #converts to a string '4'\n10  '4'\n11  >>> str(4.0) # converts to a\
    \ string '0.4'\n12  '4.0'\n13  >>> a = str(4)+str(4.0) # strings '4' and '0.4'\
    \ are concatenated\n14  >>> a\n15  '44.0'\n16  >>> float ('sandeep')\n17  Traceback\
    \ (most recent call last):\n18  File \"\", line 1, in \n19  ValueError: could\
    \ not convert string to float: 'sandeep'\n20  >>> int('sandeep')\n21  Traceback\
    \ (most recent call last):\n22  File \"\", line 1, in \n23  ValueError: invalid\
    \ literal for int() with base 10: 'sandeep'\n```\n\n### 5.5.1 Order of Usage\n\
    \nPython follows the PEMDAS (Parentheses, Exponents, Multiplication, Division,\
    \ Addition, Subtraction) order of operations. Thus, during a complex calculation\
    \ involving a number of arithmetic operators, entities are calculated in the following\
    \ order:\n\n1.  Parentheses\n2.  Exponents\n3.  Multiplication\n4.  Division\n\
    5.  Addition\n6.  Subtraction\n\nThis can be tested with the following Python\
    \ code:\n\n```\n1  >>> 5 + (6−5) ∗ (10 / (−1 / 9)∗∗2)\n2  815.0\n3  >>> 5 ∗ 5\
    \ + 5 − 4 ∗∗ 2\n4  14\n```\n\n### 5.5.2 Comparison Operators\n\nLogical operators\
    \ are supremely important for comparing objects. Operators used for comparison\
    \ are called logical operators. Table [5-3](#A458920_1_En_5_Chapter.html#Tab3)\
    \ illustrates the behavior of these operators.\n\nThe result of logical operators\
    \ is either one of the two binary objects aptly named `True` and `False`. In some\
    \ programming languages, binary operators are represented as `1` and `0`. They\
    \ can also be compared for equality:\n\n**Table 5-3** Comparison Operators\n\n\
    | Operator Symbol | Operator Meaning | Example |\n| --- | --- | --- |\n| `==`\
    \ | equal to | `1==1` is `True`, `1==2` is `False` |\n| `!=` | not equal to |\
    \ `1!=1` is `False`, `1==2` is `True` |\n| `<>` | not equal to | `1==1` is `False`,\
    \ `1==2` is `True` |\n| `<` | less than | `1<2` is `True`, `2<1` is `False` |\n\
    | `>` | greater than | `1>2` is `False`, `2>1` is `True` |\n| `<=` | less than\
    \ equal to | `1<=1` is `True`, `1<=2` is `True` |\n| `>=` | greater than equal\
    \ to | `1>=1` is `True`, `1>=2` is `False` |\n\n```\n1  >>> not True\n2  False\n\
    3  >>> a = True\n4  >>> b = False\n5  >>> a and b\n6  False\n7  >>> a or b\n8\
    \  True\n9  >>>1 >= 2 == 2 >= 1\n10  False\n11  >>>1 >= 2\n12  False\n13  >>>2\
    \ >= 1\n14  True\n15  >>>False == True\n16  False\n17  >>>False > True\n18  False\n\
    19  >>>False < True\n20  True\n```\n\n## 5.6 Membership Operator\n\nThe membership\
    \ operator checks if a value(s) of variables is a member of a specified sequence.\
    \ If the member is found, it returns the boolean value `True`; otherwise, it returns\
    \ `False`:\n\n```\n1  >>> 'hello' in 'hello world'\n2  True\n3  >>> 'name' in\
    \ 'hello world'\n4  False\n5  >>> a=3\n6  >>> b=[1,2,3,4,5]\n7  >>> a in b\n8\
    \  True\n9  >>> 10 in b\n10  False\n```\n\nThe operator `in` is used extensively\
    \ in checking conditions for loops. It is one of the most convenient ways to run\
    \ a loop. First, you construct a list as per a defined condition/formula and then\
    \ you run a loop until the condition is satisfied. This approach will become clearer\
    \ in Chapter.\n\n## 5.7 Identity Operator\n\nTo check if two values point to the\
    \ same type of object, an identity operator is used. It returns a boolean value\
    \ `True` if objects on either of its sides are the same and returns `False` otherwise:\n\
    \n```\n1  >>> 1 is 1 # both are integer type\n2  True\n3  >>> 1 is 1.0 # 1 is\
    \ int and 1.0 is float type\n4  False\n5  >>> 1 is 2 # both are integer type\n\
    6  True\n7  >>> '1' is 1 # '1' is str type and other is int type\n8  False\n9\
    \  >>> '1' is 1.0 # '1' is str type and other is float type\n10  False\n```\n\n\
    `is not` operator is negation of result with `is` operator.\n\n```\n1  >>> 1 is\
    \ not 1.0\n2  True\n3  >>> 1 is not 1\n4  False\n```"
