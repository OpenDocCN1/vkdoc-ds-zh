- fmt: '# 9.1 Introduction


    The idea of defining objects is quite natural to humans since we deal with objects
    in our day-to-day life. We understand an object as something that has


    * a set of attributes and

    * a related set of behaviors.


    Early on, babies learn about objects in their environment. For example, as babies,
    we learn that a ball (object) has a color, shape, and size (attributes), and it
    rolls, skids, and bounces (behavior). In the early 1970s, Alan Kay at Xerox PARC
    (Palo Alto Research Center) worked on the concept of object-oriented programming
    (OOP) [[1](#A458920_1_En_9_Chapter.html#Par201)]. While working on a programming
    language called Smalltalk [[2](#A458920_1_En_9_Chapter.html#Par202)], he employed
    the ideas of OOP. He based his key ideas on applying computer programming to physical
    simulation. Most people understand the real world as various objects (having attributes
    and behaviors) interacting with each other. Thus, it is natural to adopt the same
    ideas while constructing a simulated world. All GUI-based systems inherit their
    philosophy from Kay’s efforts toward these ideas and now all major programming
    languages follow them religiously.


    # 9.2 Procedural Programming vs. OOP


    While defining a computational task, you can define a set of procedures to solve
    a problem using blocks of data and connecting them as dictated by procedures.
    The paradigm that emphasizes setting procedures regardless of the type of data
    and its different usage patterns is called procedural programming. On the other
    hand, object-oriented programming places emphasis on objects and their relationships
    with one another as defined using operators (acting on objects, they change their
    values and other attributes) to solve a computational task. Python is an OOP language.


    # 9.3 Objects


