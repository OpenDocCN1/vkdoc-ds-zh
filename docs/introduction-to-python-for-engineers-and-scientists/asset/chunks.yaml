    的教学和学习更加便捷。开发者可以通过将 Notebook 划分为多个部分、为各部分添加标题和副标题、在代码单元格中编写代码、以及在 Markdown 单元格中编写解释性细节，来演示
    Python 的用法。Markdown 单元格支持使用 LaTeX 命令编写数学公式。


    用户还可以将 Jupyter Notebook 保存为 `.py` 文件（可在 Python 解释器中执行的 Python 程序）。此时，除代码单元格外的所有单元格都会通过在开头添加
    `#` 符号被转换为注释。


    Jupyter Notebook 可以保存为 HTML 格式，以便嵌入到网站中使用。这对于在线课程开发非常有用。它们也可以保存为 LaTeX 文件，以构建特定格式，或直接保存为
    PDF 文档。


    保存后的文件可以与希望学习特定主题的人共享。用户只需在 Jupyter Notebook 环境中运行该 Notebook 即可。这一功能对课堂教学大有裨益。教师和学生可以逐单元格执行他们的
    Jupyter Notebook，从而更轻松地理解概念。否则，在 Python 教学过程中，教师将不得不在演示文件和 Python 解释器之间来回切换。用户还可以利用此功能定义测试和作业。


    ### 3.5 在线 Jupyter 环境


    Jupyter Notebook 的主网站 [7] 在远程服务器上提供了一个在线环境，具备前文所述本地安装所提供的所有功能。在这里，用户通过互联网在远程计算机上工作。每个用户都拥有有限的工作空间。该空间可以与团队共享，用户可以进行协作。Jupyter
    会话的截图如图 3-5 所示。


    在线会话中提供了多种语言的示例 Notebook。用户可以使用示例 Python Notebook 来学习基础知识。用户可以创建一个目录，然后有条理地将所有
    Jupyter Notebook 存储在其中。这些 Notebook 可以下载到本地机器，并在本地 Jupyter Notebook 会话中使用。用户也可以执行相反的操作。换句话说，他们可以使用左上角菜单中的
    `Upload` 按钮，将本地的 Jupyter Notebook 加载到在线会话中。


    ![A458920_1_En_3_Fig5_HTML.jpg](img/A458920_1_En_3_Fig5_HTML.jpg)


    图 3-5


    一个示例在线 Jupyter Notebook 会话


    ### 3.6 总结


    在本章中，我们演示了如何在 IPython 和 Jupyter Notebook 环境中工作。Jupyter Notebook 正越来越多地被开发者用于向更广泛的受众传播知识，因为用户可以将代码和说明性描述打包在一个文件中。各种网站上存在成千上万个
    Jupyter Notebook，使得 Python 用户数量呈指数级增长。我们建议本书的读者也为每一章创建一个独立的 Jupyter Notebook，以加深自己的理解，并将其发布到互联网上，以便他人受益。


    # 4. 数据类型


    ## 4.1 引言


    充分利用本书的最佳方式是开始在 IPython 提示符下工作，向它输入代码并观察输出。你可以使用 Anaconda IDE，以避免为本书安装所需包。你可以在
    IPython 会话期间使用 Spyder IDE 作为编辑器来编写多行文件。我们建议你在需要的地方编写详细的描述性注释，以增强对给定代码工作流程的理解。这种方案在所有平台上都适用。在本章中，我们将讨论
    Python 中的各种数据及其分类为多种数据类型的方式。


    现代计算机将数据区分为多种类型。数据可以是数字、字符、字符串（一组字符）等等。在 Python 中，你可以根据需要定义新的数据类型。有一些内置数据类型用于处理数字和字符。不同的数据类型占用不同的内存量。理解你的需求并据此选择数据类型非常重要。数据类型也决定了答案的精度。我们将在后续章节中讨论
    Python 中各种内置数据类型。


    ## 4.2 逻辑型


    这种类型的数据存储布尔值 `True` 或 `False`，并且可以通过布尔运算符（如 `AND` 和 `OR`）进行操作。大多数编程语言使用值 `1` 或
    `0` 来表示布尔值，但 Python 在这方面有所不同。让我们通过一些示例来探索它们的用法。


    表 4-4


    NOT 运算符真值表


    | NOT |   |

    | --- | --- |

    | True | False |

    | False | True |


    表 4-3


    XOR 运算符真值表


    | XOR | True | False |

    | --- | --- | --- |

    | True | False | True |

    | False | True | False |


    表 4-2


    AND 运算符真值表


    | AND | True | False |

    | --- | --- | --- |

    | True | True | False |

    | False | False | False |


    表 4-1


    OR 运算符真值表


    | OR | True | False |

    | --- | --- | --- |

    | True | True | True |

    | False | True | False |


    | 运算符 | Python 函数 | 符号函数 |

    | --- | --- | --- |

    | AND | `and()` | `&` |

    | OR | `or()` | `|` |

    | XOR | `xor()` | `^` |

    | NOT | `not()` |   |


    ```

    1  >>> True

    2  True

    3  >>> False

    4  False

    5  >>> not True

    6  False

    7  >>> not False

    8  True

    9  >>> True and False

    10  False

    11  >>> True or False

    12  True

    13  >>> True ˆ False

    14  True

    15  >>> True ˆ False

    16  True

    ```


    复杂的逻辑语句也可以被求值。例如：


    ```

    1  >>> (True and True) or (not False)

    2  True

    3  >>> (True or True) or (True and False)

    4  True

    5  >>> not ((True or True) or (True and False))

    6  False

    ```


    重要的是要看到，使用括号使用户能够以有意义的方式将逻辑表达式组合在一起。


    逻辑运算是比较运算的结果。例如：


    ```

    1  >>> 2>3 # 大于运算符

    2  False

    3  >>> 2==2 # 等于运算符

    4  True

    5  >>> 2==2.0 # 等于运算符比较的是值，而不是类型

    6  True

    7  >>> 2==3 # 等于运算符

    8  False

    9  >>> (2+3)>(2-3) # 逻辑求值的复杂表达式

    ```


    ## 4.3 数值型


    数值型：有四种数值数据类型：


    *   `int`：整数

    *   `float`：浮点数

    *   `complex`：复数


    ### 4.3.1 整数


    Python 对 `float`、`long` 和 `complex numbers` 具有任意精度。因此，这些数字的长度限制取决于可用内存。这种架构的积极方面是用户不受数字范围的限制，但他们必须始终确保在计算过程中有足够的内存可用，以避免错误结果。Python
    2 将 `int` 的大小限制为字节（与 C 编程语言中的大小相同），而 Python 3 将 `int` 和 `long` 合并为 `int`。在 32
    位系统上，Python 3 将 `int` 存储为 32 位。在 64 位计算机上，它将 `int` 存储为 64 位长整数。


    内置函数 `type()` 显示数据类型如下：


    ```

    1  >>> type(-1)

    <class ''int''>

    4  >>> type(1)

    <class ''int''>

    ```


    如这些示例所示，Python 解释器动态分配数据类型。换句话说，它根据输入的定义为其分配数据类型。这对程序员来说非常方便。`1` 自动成为整数，而 `1.0`
    成为浮点数。

