    ## 6.6 tile( )


    From a target array of a smaller size, a bigger array can be constructed using
    the `tile()` function. `tile()` makes a copy of an existing array by the defined
    number of times needed to make a new array:


    ```

    1  >>> a = numpy.array([1,2,3])

    2  >>> a

    3  array([1, 2, 3])

    4  >>> b = numpy.tile(a,3) # array a is repeated 3 times to make a new array b

    5  >>> b

    6  array([1, 2, 3, 1, 2, 3, 1, 2, 3])

    7  >>># Another example to do the same for two dimesnional array

    8  >>> a1 = numpy.eye(4)

    9  >>> a1

    10  array([[ 1.,  0.,  0.,  0.],

    11  [ 0.,  1.,  0.,  0.],

    12  [ 0.,  0.,  1.,  0.],

    13  [ 0.,  0.,  0.,  1.]])

    14  >>> a2=numpy.tile(a1,2) # repeat a1 in first dimesnion only i.e row-wise

    15  >>> a2

    16  array([[ 1.,  0.,  0.,  0.,  1.,  0.,  0.,  0.],

    17  [ 0.,  1.,  0.,  0.,  0.,  1.,  0.,  0.],

    18  [ 0.,  0.,  1.,  0.,  0.,  0.,  1.,  0.],

    19  [ 0.,  0.,  0.,  1.,  0.,  0.,  0.,  1.]])

    20  >>> a2 = numpy.tile(a1,(2,2)) # repeat a1 in both dimesnions 2 times

    21  >>> a2

    22  array([[ 1.,  0.,  0.,  0.,  1.,  0.,  0.,  0.],

    23  [ 0.,  1.,  0.,  0.,  0.,  1.,  0.,  0.],

    24  [ 0.,  0.,  1.,  0.,  0.,  0.,  1.,  0.],

    25  [ 0.,  0.,  0.,  1.,  0.,  0.,  0.,  1.],

    26  [ 1.,  0.,  0.,  0.,  1.,  0.,  0.,  0.],

    27  [ 0.,  1.,  0.,  0.,  0.,  1.,  0.,  0.],

    28  [ 0.,  0.,  1.,  0.,  0.,  0.,  1.,  0.],

    29  [ 0.,  0.,  0.,  1.,  0.,  0.,  0.,  1.]])

    ```


    ## 6.7 Broadcasting


    Basic operations on `numpy` arrays are elementwise. This means that the dimensions
    of the arrays should be compatible for the desired operation. For example, 2 arrays
    and 2 arrays would be incompatible as the first array has one fewer column than
    the second one.


    ```

    1  >>>a = numpy.eye(4)

    2  >>>b = numpy.array([1,2,3,4])

    3  >>>c = a + b

    4  >>>c


    6  array([[ 2.,  2.,  3.,  4.],

    7      [ 1.,  3.,  3.,  4.],

    8      [ 1.,  2.,  4.,  4.],

    9      [ 1.,  2.,  3.,  5.]])


    11  >>>a.shape

    12  (4L, 4L)


    14  >>>b.shape

    15  (4L,)


    17  >>>c.shape

    18  (4L, 4L)


    20  # bradcasting enables array a ( 4 X 4) to be added to b (4 X 1) to produce
    an array c (4 X 4)


    22  # Another example

    23  >>>a = numpy.eye(4)

    24  >>>a


    26  array([[ 1.,  0.,  0.,  0.],

    27      [ 0.,  1.,  0.,  0.],

    28      [ 0.,  0.,  1.,  0.],

    29      [ 0.,  0.,  0.,  1.]])


    31  >>>b = numpy.array([10, 10, 10, 10])

    32  >>>c = a + b

    33  >>>c


    35  array([[ 11.,  10.,  10.,  10.],

    36      [ 10.,  11.,  10.,  10.],

    37      [ 10.,  10.,  11.,  10.],

    38      [ 10.,  10.,  10.,  11.]])


    40  # A 4 X 4 matrix can be operated with a 4 X 1 matrix by making the ''invisible''
    elemets zero.

    ```


    ## 6.8 Extracting Diagonal


    The diagonal elements of a given array/matrix can be obtained using the `diag()`
    function. You can choose the diagonal using the second argument. The default value
    is 0, which indicates the main diagonal. A positive value indicates moving in
    an upward direction. A negative value indicates moving in a downward direction.


    ```

    1  >>> a = numpy.eye(5) # making an identity matrix

    2  >>> a

    3  array([[ 1.,  0.,  0.,  0.,  0.],

    4  [ 0.,  1.,  0.,  0.,  0.],

    5  [ 0.,  0.,  1.,  0.,  0.],

    6  [ 0.,  0.,  0.,  1.,  0.],

    7  [ 0.,  0.,  0.,  0.,  1.]])

    8  >>> numpy.diag(a) #extracting element of main diaginal

    9  array([ 1.,  1.,  1.,  1.,  1.])

    10  >>> numpy.diag(a,1) # extractiong diagonal elements in upwards direction

    11  array([ 0.,  0.,  0.,  0.])

    12  >>> numpy.diag(a,-1) # extractiong diagonal elements in downwards direction

    13  array([ 0.,  0.,  0.,  0.])

    ```


    ## 6.9 Indexing


    The elements of an array or list start with 0 in Python; the first element is
    indexed 0. All elements can be accessed using their indexes:


    ```

    1  >>>a =[1,2,3,4,5,6] # creating a list and storing it in variable name ''a''

    2  >>> type(a) # a stores a ''list'' object


    4  >>> b = numpy.array(a) # An array is referenced by ''b'' using list referenced
    by ''a''

    5  >>> b

    6  array([1, 2, 3, 4, 5, 6])

    7  >>> type(b)


    9  >>>a[1] # accessing second element from left hand side for the list ''a''

    10  2

    11  >>>b[0] # accessing first element from left hand side for the array ''b''

    12  1

    13  >>>a[-1] # accessing the first element from the right hand side for list ''a''

    14  6

    15  >>>b[-2] # accessing the second element from the right hand side for array
    ''b''

    16  5

    ```


    These examples make it clear that arrays are similar to lists and follow the same
    rules of indexing. Multidimensional arrays also follow the same pattern of indexing.
    For two-dimensional arrays, the first number indicates the row and the second
    number indicates the columns:


    ```

    1  >>>a1 = numpy.array([[1,2,3],[3,2,1]]) # 2D array created using 2 sets of list

    2  >>>a1

    3  array([[1, 2, 3],

    4      [3, 2, 1]])

    5  >>>a1[1,2] # choosing elemnet whose row is indexed 1 and coloumn is indexed
    2 i.e second row and thierd coloumn i.e down-right last element

    6  1

    7  >>>a1[1,1] # chooisng an element whose row is indexed 1 and clolumn is indexed
    1 i.e. second row and second coloumn

    8  2

    9  >>>a1[1] # chooisng row with index 1 i.e second row

    10  array([3, 2, 1])

    ```


    Indexes can also be used to assign a particular value of the element. Here you
    use of the assignment operator discussed earlier:


    ```

    1  >>>a1 = numpy.array([[1,2,3],[3,2,1]]) # 2D array created using 2 sets of list

    2  >>>a1

    3  array([[1, 2, 3],

    4      [3, 2, 1]])

    5  >>>a1[1,1] = 0 # elemnet with row index=1, column index=1 is set to be 0

    6  >>>a1 # second row and second coloumns element i.e 2 is changed to 0

    7  array([[1, 2, 3],

    8      [3, 0, 1]])

    ```'
