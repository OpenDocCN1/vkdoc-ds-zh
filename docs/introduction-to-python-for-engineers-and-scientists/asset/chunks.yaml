    ## 7.20 其他数据绘图库


    `matplotlib` 的使用如此广泛，以至于新的开发者可能没有意识到还有其他绘制数据的选项。在其他模块中，有多种绘制数据的方法，根据上下文，这些方法可能具有更强大的绘图能力。其中包括
    `plotly`、`mayavi` 和 `gnuplot`（仅举几例）。下面简要讨论如何使用 `plotly`，有趣的是，它可以在 Web 上绘制数据。这对于那些需要将传感器数据实时绘制在
    Web 上的工程应用来说尤其有趣。

    '
- fmt: "### 7.20.1 `plotly`\n\n`plotly` is an online analytics and data-visualization\
    \ tool. In addition to Python, `plotly` can plot data used in Perl, Julia, Arduino,\
    \ R, and MATLAB. Weblink [[5](#A458920_1_En_7_Chapter.html#Par205)] gives a pretty\
    \ good sense of the capabilities of `plotly`. Essentially, `plotly` allows plotting\
    \ and publishing graphs online to encourage collaboration. Hence, you must be\
    \ connected to the Internet before working with the `plotly` library.\n\n![A458920_1_En_7_Fig24_HTML.jpg](A458920_1_En_7_Fig24_HTML.jpg)\n\
    \nFigure 7-24\n\nQuiver plots\n\nFirst, you need to make a user account at the\
    \ `plotly` web site [[5](#A458920_1_En_7_Chapter.html#Par205)]. The account will\
    \ provide a username and API key, which needs to be used in the program. Then,\
    \ you can write a code either as one command at a time on a Python terminal or\
    \ as a Python script. (See Listing [7-27](#A458920_1_En_7_Chapter.html#Par164).)\n\
    \n```\n1  import numpy as np\n2  import plotly.plotly as py\n3  from plotly.graph_objs\
    \ import *\n4  py.sign_in('username','APIkey')\n5  data = Data([Scatter(x=np.arange(100),y=np.random.randn(100),\
    \ name='trace 0')])\n6  fig = Figure(data=data)\n7  plot_url = py.plot(fig)\n\
    Listing 7-27\nplotly.py\n```\n\nYou need to provide the username and API key in\
    \ the script in Listing [7-27](#A458920_1_En_7_Chapter.html#Par164). The script\
    \ results in generating a scatter plot online at a workspace in the user account.\
    \ These graphs can be plotted quite interactively using the functions provided\
    \ by `plotly`. When data are steamed from a device connected to a live sensor,\
    \ live data is plotted in real time. This can further be embedded on a web site.\n\
    \n## 7.21 Summary\n\nIn this chapter, we have discussed various plotting options\
    \ available while working with Python. The ease of plotting data is one of the\
    \ most attractive features of Python. Just a few lines of code provide visualization\
    \ of the data in a variety of ways. Visualization is the backbone of data presentation\
    \ and analysis since it makes understanding of the data clearer. In addition to\
    \ simple visualization, `matplotlib` provides rich features to decorate the graph\
    \ with useful information in a desired manner.\n\n# 8. Functions and Loops\n\n\
    ## 8.1 Introduction\n\nA function is a part of a computer program where a number\
    \ of programming statements is clubbed as a block. It can be called when desired.\
    \ This enables a modular approach to programming tasks and has become very popular\
    \ among programmers nowadays since modules can be edited with ease. Functions\
    \ receive input parameters and return output parameters. When a function is being\
    \ used, the function name is called along with values for input parameters. After\
    \ execution, a set of output parameters is returned. Python functions can be defined\
    \ at any place in the program, regardless of the place from where they are being\
    \ called. They can even be defined as a separate file individually or in a combined\
    \ manner. Also, they can be called any number of times or they may not be called\
    \ at all, as per the user’s requirements.\n\n## 8.2 Defining Functions\n\nJust\
    \ like any other language, Python has its own way of defining functions. Following\
    \ is the structure of a Python function:\n\n```\n1  def function_name(parameter_1,\
    \ parameter_2, ...):\n2    \"\"\"Descriptive string\"\"\"\n3    # Comment about\
    \ statements below\n4    statements\n5    return return_parameters\n```\n\nAs\
    \ you can see, a Python function consists of three parts:\n\n1.  Header: Begins\
    \ with a keyword (`def`) and ends with a colon (`:`)  \n2.  Descriptive String:\
    \ A string that describes the purpose of a character and can be accessed using\
    \ the `help()` function  \n3.  Body: An indented (four whitespaces in general)\
    \ set of Python statements below the header\n\n### 8.2.1 Function Name\n\nFunction\
    \ names follow the same rules as variable names in Python. It is a good idea to\
    \ give a function a name that is relevant to its description and to keep it short.\n\
    \n### 8.2.2 Descriptive String\n\nAn essential part of a defining a function is\
