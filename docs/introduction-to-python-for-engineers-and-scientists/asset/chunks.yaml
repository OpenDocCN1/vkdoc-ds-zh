    12  >>> b

    13  array([[2, 3, 4],

    14  [2, 3, 4],

    15  [2, 3, 4],

    16  [2, 3, 4],

    17  [2, 3, 4],

    18  [2, 3, 4],

    19  [2, 3, 4],

    20  [2, 3, 4],

    21  [2, 3, 4]])


    23  >>> x, y = numpy.ogrid[0:5, 0:5]

    24  >>> x

    25  array([[0],

