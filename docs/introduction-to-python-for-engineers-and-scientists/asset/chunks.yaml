  trans: "\n#### 内置类属性\n\n所有 Python 类都拥有某些可通过点运算符访问的内置属性。这些操作在第 54 行至第 58 行完成。\n\n\
    - `__doc__`\n  - 返回类的文档字符串\n  - 若未定义则返回 `None`\n- `__dict__`\n  - 返回包含类命名空间的字典\n\
    \  - 该字典包含对象 `library` 的相关信息，具体包括：\n    - `__module__`\n    - 定义的方法（本例中为 `displayCount()`\
    \ 和 `displayBook()`）\n    - 定义的类变量（本例中为 `bookCount`）\n    - `__doc__`\n    - 构造函数\
    \ `__init__`\n- `__name__`\n  - 返回类的名称\n- `__module__`\n  - 返回定义该类的模块名称\n  - 在交互模式下，该值为\
    \ `__main__`\n- `__bases__`\n  - 一个可能为空的元组，包含基类列表中按出现顺序排列的基类\n\nPython 代码 `class1.py`\
    \ 的输出如下所示：\n\n```\n5  Details of first book:\n6  Name:  Introduction to python\
    \ , Price:  100\n7  Details of second book:\n8  Name:  Basic Python , Price: \
    \ 150\n9  Details of third book:\n10  Name :  Intermediate Python , Price:  200\n\
    11  Details of fourth book:\n12  Name :  Advanced Python , Price:  300\n13  Total\
    \ Number of books= 4\n14  library.__doc__: The base class for all books\n15  library.__name__:\
    \ library\n16  library.__module__: __main__\n17  library.__bases__: (,)\n18  library.__dict__:\
    \ {'__module__': '__main__', '__doc__': 'The base class for all books', 'bookCount':\
    \ 4, '__init__': , 'displayCount': , 'displayBook':, '__dict__': , '__weakref__':\
    \ }\n```\n\n## 9.7 总结\n\n在本章中，我们演示了如何使用 `class` 构造定义一种新类型的对象。由于 Python 将一切视为对象，它成为科学计算和模拟的首选之一。因其易于学习，用户可以很快开始进行严肃的科学计算。这一特性使其在教育工作者、学生和研究人员中非常受欢迎。创建类并构建自定义模块的能力，使得开发者能够日复一日地丰富\
    \ Python 生态系统。因此，可以说 Python 的面向对象特性及其开源生态系统使其成为最流行的编程语言之一，这并非夸大其词。\n\n# 10. 数值计算形式体系\n\
    \n## 10.1 引言\n\n数值计算使我们能够计算数值问题的解，前提是我们能将其转化为合适的格式。这需要一些考量。例如，如果我们将连续函数数字化，由于以有限频率采样，将会引入某些误差。因此，非常精确的结果需要非常高的采样率。当需要计算大型数据集时，这将变成一项计算密集且耗时的任务。此外，用户必须理解，与解析解相比，数值解充其量只是一种近似。寻找其物理意义和重要性的责任在于我们自身。丢弃那些在现实场景中没有意义的解，是科学家/工程师多年积累的艺术。此外，计算设备的智能程度与其操作者相当。GIGO（垃圾进，垃圾出）法则在该领域被严格遵循。\n\
    \n在本章中，我们将考虑使用数值计算解决物理问题的一些重要步骤。用恰当的术语定义问题只是第一步。建立正确的模型，然后使用正确的方法（求解器）来解决问题，是区分经验丰富的科学家/工程师与新手的标志。\n\
    \n## 10.2 物理问题\n\n我们物理世界中的一切皆受物理定律支配。由于科学工作者们在艰苦条件下努力为我们周围发生的自然现象提出精妙解决方案，我们才获得了物理定律的数学理论。为了检验这些物理定律的数学形式体系，我们使用数值计算。如果它产生的结果与真实实验相同，则两者相互验证。只要我们拥有经过充分检验的数学形式体系，数值模拟就可以完全消除进行实验的必要。例如，当今的核大国已无需再测试真实的核弹。在真实核爆炸期间获得的核爆炸数据，使科学家能够相当精确地建模这些物理系统，从而消除了真实测试的需求。\n\
    \n除了模拟真实实验等应用外，对物理问题进行建模也是一种很好的教育练习。在建模过程中，动手实践使学生能够深入探索该主题，并对所研究的课题赋予恰当的意义。解决数值问题并将结果可视化，能使学习效果持久，并激发对数学理论缺陷的相关研究，最终带来新的发现。\n"
- fmt: '# 10.3 Defining a Model


    Modeling is defined as writing equations for a physical system. As its name suggests,
    an equation pertains to equating two sides. An equation is written using an `=`
    sign where terms on the left-hand side are equal to terms on the right-hand side.
    The terms on either sides of equations can be numbers or expressions. For example:


    ![$$ 3x+4y+9z=10 $$](A458920_1_En_10_Chapter_Equa.gif)


    This is an equation having a expression, `3x + 4y + 9z`, on the left-hand side
    (LHS) and a term, `10`, on the right-hand side (RHS). Please note that while LHS
    is an algebraic term, RHS is a number.


    Expressions are written using functions that show a relation between two domains.
    For example, `f(x) = y` illustrates a relationship of `y` to `x` using rules of
    algebra. Mathematics has a rich library of functions that can be used to make
    expressions. Choosing the proper function depends on problem. Some functions describe
    some situations better than others. For example, oscillatory behavior can be described
    in a reasonable manner using trigonometric functions such as `sin(x)` and `cos(x)`.
    Objects moving in straight lines can be described using linear equations such
    as `y = mx + c` where `x` is their present position, `m` is the constant rate
    of change of `x`, w.r.t `y` and `c` is the offset position. Objects moving in
    a curved fashion can be described by various nonlinear functions where the power
    of a dependent variable, like `x` in the previous sentence, is not `1`.


    In real life, we can have situations that can be a mixture of these scenarios.
    For example, an object can oscillate and move in a curved fashion at the same
    time. In such cases, we write an expression using a mixture of functions or find
    new functions that could explain the behavior of the object. Verifying the functions
    is done by finding solutions to equations describing the behavior and matching
    them with observations made about an object. If they match perfectly, we obtain
    perfect solutions. In most cases, an exact solution might be difficult to obtain.
    In these cases, we get an “approximate” solution. If the errors involved while
    obtaining an approximate solution are within toleration limits, the models can
    be acceptable.


    As previously discussed, physical situations can be analytically solved by writing
    mathematical expressions in terms of functions involving dependent variables.
    The simplest problems have simple functions between dependent variables with a
    single equation. There can be situations where multiple equations are needed to
    explain a physical behavior. In the case of multiple equations being solved, the
    theory of matrices comes in handy.


    Suppose the following equations define the physical behavior of a system:


    ![$$ -x+3y=4 $$](A458920_1_En_10_Chapter_Equ1.gif)


    (10.1)


    ![$$ 2x-4y=-3 $$](A458920_1_En_10_Chapter_Equ2.gif)


    (10.2)


    This system of two equations can be represented by a matrix equation, as follows:


    ![$$ \left[\begin{array}{cc}-1& 3\\ {}2& -4\end{array}\right]+\left[\begin{array}{c}x\\
    {}y\end{array}\right]=\left[\begin{array}{c}4\\ {}3\end{array}\right] $$](A458920_1_En_10_Chapter_Equb.gif)


    Now using matrix algebra, the values of variables `x` and `y` can be found such
    that they satisfy the equations. These values are called the roots of these equations.
    These roots are the point in 2-D space (because we had two dependent variables)
    where the system will find stability for that physical problem. In this way, we
    can predict the behavior of the system without actually doing an experiment.


    The mathematical concept of differentiation and integration becomes very important
    when we work with a dynamic system. When the system is constantly changing the
    values of dependent variables to produce a scenario, it is important to know the
    rate of change of these variables. When these variables are independent of each
    other, we use simple derivatives to define their rate of change. When they are
    not independent of each other, we use partial derivatives.


    For example, Newton’s second law of motion says that rate of change of velocity
    of an object is directly proportional to the force applied on it. We can show
    this concept mathematically:


    ![$$ F\alpha \frac{dy}{dx} $$](A458920_1_En_10_Chapter_Equ3.gif)


    (10.3)


    The proportionality is turned into equality by substituting for a constant of
    multiplication `m` such that the following is true:


    ![$$ F=m\times \frac{dy}{dx} $$](A458920_1_En_10_Chapter_Equ4.gif)


    (10.4)


    If we know the values or expressions for `F`, this equation can be solved analytically
    and solutions can be found for this equation. However, in some cases, the analytical
    solution may be too difficult to obtain. In such cases, we digitize the system
    and find a numerical solution.


    There are many methods to digitize and numerically solve a given function. Programs
    to implement a particular method to solve a function numerically are called a
    solver. A lot of solvers exist to solve a function. The choice of solver is critical
    to successfully obtain a solution. For example, Equation [10.4](#A458920_1_En_10_Chapter.html#Equ4)
    is a differential equation. It is a first-order ordinary differential equation.
    A number of solvers exists to solve it including Euler and Runge-Kutta. The choice
    of a particular solver depends on the accuracy of its solution, the time taken
    for obtaining a solution, and the amount of memory used during the process. The
    latter is important where memory is not a freely expendable commodity as when
    using microcomputers with limited memory storage.


    The advantage of using Python to perform a numerical computation lies in the fact
    that it has a very rich library of modules to perform various tasks required.
    The predefined functions have been optimized for speed and accuracy (in some cases,
    accuracy can be predefined). This enables the user to rapidly prototype the problem
    instead of concentrating on writing functions to do basic tasks and optimizing
    them for speed, accuracy, and memory usage.


    ## 10.4 Python Packages


    A number of packages exists to perform numerical computation in a particular scientific
    domain. The web site [[1](#A458920_1_En_10_Chapter.html#Par101)] gives a list
    of packages. Installing packages can be attained by writing the command


    ```

    >> pip install

    ```


    on the LINUX command line. Users are encouraged to check out the following packages
    for scientific computation:


    *   `numpy`: For numerical computation

    *   `scipy`: Superset of `numpy` that encompasses specific functions for physics
    apart from general mathematics in `numpy`

    *   `scikit-learn`: Machine learning

    *   `tensorflow`: Machine learning

    *   `Pandas`: Statistical data analytics

    *   `scikit-image`: Image processing

    *   `bokeh`: Interactive plotting'
  raw: "## 10.3 Defining a Model\n\nModeling is defined as writing equations for a\
    \ physical system . As its name suggests, an equation pertains to equating two\
    \ sides. An equation is written using an `=` sign where terms on the left-hand\
    \ side are equal to terms on the right-hand side. The terms on either sides of\
    \ equations can be numbers or expressions. For example:\n\n![$$ 3x+4y+9z=10 $$](A458920_1_En_10_Chapter_Equa.gif)\n\
    \nThis is an equation having a expression, 3x + 4y + 9z, on the left-hand side\
    \ (LHS) and a term, 10, on the right-hand side (RHS). Please note that while LHS\
    \ is an algebraic term, RHS is a number.\n\nExpressions are written using functions\
    \ that show a relation between two domains. For example, f (x) = y illustrates\
    \ a relationship of y to x using rules of algebra. Mathematics has a rich library\
    \ of functions that can be used to make expressions. Choosing the proper function\
    \ depends on problem. Some functions describe some situations better than others.\
    \ For example, oscillatory behavior can be described in a reasonable manner using\
    \ trigonometric functions such as sin(x) and cos(x). Objects moving in straight\
    \ lines can be described using linear equations such as y = mx + c where x is\
    \ their present position, m is the constant rate of change of x, w.r.t y and c\
    \ is the offset position. Objects moving in a curved fashion can be described\
    \ by various nonlinear functions where the power of a dependent variable, like\
    \ x in the previous sentence, is not 1.\n\nIn real life, we can have situations\
    \ that can be a mixture of these scenarios. For example, an object can oscillate\
    \ and move in a curved fashion at the same time. In such cases, we write an expression\
    \ using a mixture of functions or find new functions that could explain the behavior\
    \ of the object. Verifying the functions is done by finding solutions to equations\
    \ describing the behavior and matching them with observations made about an object.\
    \ If they match perfectly, we obtain perfect solutions. In most cases, an exact\
    \ solution might be difficult to obtain. In these cases, we get an “approximate”\
    \ solution. If the errors involved while obtaining an approximate solution are\
    \ within toleration limits, the models can be acceptable.\n\nAs previously discussed,\
    \ physical situations can be analytically solved by writing mathematical expressions\
    \ in terms of functions involving dependent variables. The simplest problems have\
    \ simple functions between dependent variables with a single equation. There can\
    \ be situations where multiple equations are needed to explain a physical behavior.\
    \ In the case of multiple equations being solved, the theory of matrices comes\
    \ in handy.\n\nSuppose the following equations define the physical behavior of\
    \ a system:\n\n![$$ -x+3y=4 $$](A458920_1_En_10_Chapter_Equ1.gif)\n\n(10.1)\n\n\
    ![$$ 2x-4y=-3 $$](A458920_1_En_10_Chapter_Equ2.gif)\n\n(10.2)\n\nThis system of\
    \ two equations can be represented by a matrix equation, as follows:\n\n![$$ \\\
    left[\\begin{array}{cc}-1& 3\\\\ {}2& -4\\end{array}\\right]+\\left[\\begin{array}{c}x\\\
    \\ {}y\\end{array}\\right]=\\left[\\begin{array}{c}4\\\\ {}3\\end{array}\\right]\
    \ $$](A458920_1_En_10_Chapter_Equb.gif)\n\nNow using matrix algebra , the values\
    \ of variables x and y can be found such that they satisfy the equations. These\
    \ values are called the roots of these equations. These roots are the point in\
    \ 2-D space (because we had two dependent variables) where the system will find\
    \ stability for that physical problem. In this way, we can predict the behavior\
    \ of the system without actually doing an experiment.\n\nThe mathematical concept\
    \ of differentiation and integration becomes very important when we work with\
    \ a dynamic system . When the system is constantly changing the values of dependent\
    \ variables to produce a scenario, it is important to know the rate of change\
    \ of these variables. When these variables are independent of each other, we use\
    \ simple derivatives to define their rate of change. When they are not independent\
    \ of each other, we use partial derivatives.\n\nFor example, Newton’s second law\
    \ of motion says that rate of change of velocity of an object is directly proportional\
    \ to the force applied on it. We can show this concept mathematically:\n\n![$$\
    \ F\\alpha \\frac{dy}{dx} $$](A458920_1_En_10_Chapter_Equ3.gif)\n\n(10.3)\n\n\
    The proportionality is turned into equality by substituting for a constant of\
    \ multiplication m such that the following is true:\n\n![$$ F=m\\times \\frac{dy}{dx}\
    \ $$](A458920_1_En_10_Chapter_Equ4.gif)\n\n(10.4)\n\nIf we know the values or\
    \ expressions for F, this equation can be solved analytically and solutions can\
    \ be found for this equation. However, in some cases, the analytical solution\
    \ may be too difficult to obtain. In such cases, we digitize the system and find\
    \ a numerical solution.\n\nThere are many methods to digitize and numerically\
    \ solve a given function. Programs to implement a particular method to solve a\
    \ function numerically are called a solver. A lot of solvers exist to solve a\
    \ function. The choice of solver is critical to successfully obtain a solution.\
    \ For example, Equation [10.4](#A458920_1_En_10_Chapter.html#Equ4) is a differential\
    \ equation. It is a first-order ordinary differential equation . A number of solvers\
    \ exists to solve it including Euler and Runge-Kutta. The choice of a particular\
    \ solver depends on the accuracy of its solution, the time taken for obtaining\
    \ a solution, and the amount of memory used during the process. The latter is\
    \ important where memory is not a freely expendable commodity as when using microcomputers\
    \ with limited memory storage.\n\nThe advantage of using Python to perform a numerical\
    \ computation lies in the fact that it has a very rich library of modules to perform\
    \ various tasks required. The predefined functions have been optimized for speed\
    \ and accuracy (in some cases, accuracy can be predefined). This enables the user\
    \ to rapidly prototype the problem instead of concentrating on writing functions\
    \ to do basic tasks and optimizing them for speed, accuracy, and memory usage.\n\
    \n## 10.4 Python Packages\n\nA number of packages exists to perform numerical\
    \ computation in a particular scientific domain. The web site [[1](#A458920_1_En_10_Chapter.html#Par101)]\
    \ gives a list of packages. Installing packages can be attained by writing the\
    \ command\n\n```\n>> pip install \n```\n\non the LINUX command line. Users are\
    \ encouraged to check out the following packages for scientific computation:\n\
    \n*   `numpy`: For numerical computation\n*   `scipy`: Superset of `numpy` that\
    \ encompasses specific functions for physics apart from general mathematics in\
    \ `numpy`\n*   `scikit-learn`: Machine learning\n*   `tensorflow`: Machine learning\n\
    *   `Pandas`: Statistical data analytics\n*   `scikit-image`: Image processing\n\
    *   `bokeh`: Interactive plotting"
  trans: '

    # 10.3 定义模型


    建模被定义为为物理系统编写方程。顾名思义，方程涉及等式两边的相等。方程使用 `=` 符号编写，其中左侧的项等于右侧的项。方程两边的项可以是数字或表达式。例如：


    ![$$ 3x+4y+9z=10 $$](img/A458920_1_En_10_Chapter_Equa.gif)


    这是一个方程，左侧（LHS）有一个表达式 `3x + 4y + 9z`，右侧（RHS）有一个项 `10`。请注意，左侧是一个代数项，而右侧是一个数字。


    表达式是使用函数编写的，这些函数展示了两个域之间的关系。例如，`f(x) = y` 通过代数规则说明了 `y` 与 `x` 的关系。数学拥有丰富的函数库，可用于构建表达式。选择合适的函数取决于具体问题。某些函数能比其他函数更好地描述某些情况。例如，振荡行为可以使用三角函数（如
    `sin(x)` 和 `cos(x)`）以合理的方式描述。沿直线运动的物体可以用线性方程描述，例如 `y = mx + c`，其中 `x` 是当前位置，`m`
    是 `x` 相对于 `y` 的恒定变化率，`c` 是偏移位置。沿曲线运动的物体可以用各种非线性函数描述，其中因变量（如前一句中的 `x`）的幂次不为 `1`。


    在现实生活中，我们可能会遇到这些场景混合的情况。例如，一个物体可以同时振荡并沿曲线运动。在这种情况下，我们使用混合函数编写表达式，或者寻找能够解释该物体行为的新函数。验证函数的方法是为描述该行为的方程找到解，并将其与对物体的观测结果进行匹配。如果完全匹配，我们就得到了精确解。在大多数情况下，可能难以获得精确解。在这些情况下，我们得到的是“近似”解。如果获得近似解时涉及的误差在容许范围内，那么模型是可以接受的。


    如前所述，物理情况可以通过用涉及因变量的函数编写数学表达式来解析求解。最简单的问题在因变量之间具有简单的函数关系，并且只有一个方程。也可能存在需要多个方程才能解释一种物理行为的情况。在求解多个方程的情况下，矩阵理论就派上了用场。


    假设以下方程定义了一个系统的物理行为：


    ![$$ -x+3y=4 $$](img/A458920_1_En_10_Chapter_Equ1.gif)


    (10.1)


    ![$$ 2x-4y=-3 $$](img/A458920_1_En_10_Chapter_Equ2.gif)


    (10.2)


    这个由两个方程组成的方程组可以用一个矩阵方程表示，如下所示：


    ![$$ \left[\begin{array}{cc}-1& 3\\ {}2& -4\end{array}\right]+\left[\begin{array}{c}x\\
    {}y\end{array}\right]=\left[\begin{array}{c}4\\ {}3\end{array}\right] $$](A458920_1_En_10_Chapter_Equb.gif)


    现在，利用矩阵代数，可以找到变量 `x` 和 `y` 的值，使得它们满足这些方程。这些值被称为这些方程的根。这些根是二维空间（因为我们有两个因变量）中的点，在该点上，系统将为该物理问题找到稳定状态。通过这种方式，我们无需实际进行实验就能预测系统的行为。


    当我们处理动态系统时，微分和积分的数学概念变得非常重要。当系统不断改变因变量的值以产生某种场景时，了解这些变量的变化率至关重要。当这些变量彼此独立时，我们使用简单导数来定义它们的变化率。当它们彼此不独立时，我们使用偏导数。


    例如，牛顿第二运动定律指出，物体速度的变化率与施加在其上的力成正比。我们可以用数学方式展示这个概念：


    ![$$ F\alpha \frac{dy}{dx} $$](img/A458920_1_En_10_Chapter_Equ3.gif)


    (10.3)


    通过代入一个乘法常数 `m`，可以将比例关系转化为等式，使得下式成立：


    ![$$ F=m\times \frac{dy}{dx} $$](img/A458920_1_En_10_Chapter_Equ4.gif)


    (10.4)


    如果我们知道 `F` 的值或表达式，这个方程可以解析求解，并找到该方程的解。然而，在某些情况下，解析解可能过于难以获得。在这种情况下，我们将系统数字化并寻找数值解。


    有许多方法可以对给定函数进行数字化和数值求解。实现特定方法来数值求解函数的程序称为求解器。存在许多求解器来求解函数。求解器的选择对于成功获得解至关重要。例如，方程
    10.4 是一个微分方程。它是一个一阶常微分方程。存在许多求解器可以求解它，包括欧拉法和龙格-库塔法。选择特定求解器取决于其解的精度、获得解所需的时间以及过程中使用的内存量。后者在内存不是可以随意消耗的资源时（例如在使用内存存储有限的微型计算机时）非常重要。


    使用 Python 进行数值计算的优势在于，它拥有非常丰富的模块库来执行所需的各种任务。预定义的函数已经针对速度和精度进行了优化（在某些情况下，精度可以预先定义）。这使得用户能够快速构建问题原型，而不是专注于编写执行基本任务的函数并针对速度、精度和内存使用进行优化。


    ## 10.4 Python 包


    存在许多用于在特定科学领域进行数值计算的包。网站 [1] 列出了这些包。可以通过在 LINUX 命令行中编写以下命令来安装包：


    ```

    >> pip install

    ```


    鼓励用户查看以下用于科学计算的包：


    *   `numpy`：用于数值计算

    *   `scipy`：`numpy` 的超集，除了 `numpy` 中的通用数学函数外，还包含针对物理学的特定函数

    *   `scikit-learn`：机器学习

    *   `tensorflow`：机器学习

    *   `Pandas`：统计数据分析

    *   `scikit-image`：图像处理

    *   `bokeh`：交互式绘图

    '
- fmt: "## 10.5 Python for Science and Engineering\n\nComputers are used in both theoretical\
    \ as well as experimental studies in science and engineering. In theoretical studies,\
    \ computers are mainly used for solving problems where actions are iteratively\
    \ performed for a large set of similar or different data points within a model\
    \ of a real-world problem. Experimental investigations utilize computers for instrumentation\
    \ and control. Hence, an ideal programming language for scientific investigation\
    \ must perform these tasks in an efficient manner. Efficiency here encompasses\
    \ the following:\n\n- Ability to write the problem in simple, intuitive, and minimalistic\
    \ syntax\n- Minimum time of execution\n- Ability to store and retrieve large amounts\
    \ of data in an errorfree manner\n- Ability to process data using parallel processing\
    \ paradigm\n- Ability to handle vast types of data sets\n- Object-oriented programming\n\
    - Wide graphics capability\n- Architecture independence\n- Instrumentation and\
    \ control system for a variety of platforms\n- Networking\n- Security\n- Less\
    \ time for prototyping a problem\n\nLet’s evaluate Python on these parameters\
    \ to judge its usage for various scientific tasks. This exercise will give important\
    \ clues to users before using Python for a scientific problem.\n\n## 10.6 Prototyping\
    \ a Problem\n\nPython is an interpretive language. The process of interpretation\
    \ removes the act of compiling the code prior to producing machine code. Python\
    \ reads the code line-by-line and outputs machine code as soon as one line is\
    \ interpreted correctly. Interpretive languages have great advantages in the act\
    \ of prototyping a problem, but are notoriously slow in execution.\n\n### 10.6.1\
    \ What Is Prototyping?\n\nPrototyping a problem involves formulating a mathematical\
    \ model for a real-life problem and then coding the mathematical model using the\
    \ syntax of a particular programming language. Mathematical modeling involves\
    \ the following:\n\n- Formulating variables\n- Marking them dependent and independent\
    \ in nature\n- Devising functional relationships between them by assigning known\
    \ mathematical functions as assumptions\n\nOnce a mathematical model has been\
    \ devised, it needs to be tested using a computer program to produce output, which\
    \ is then analyzed in terms of meaningful predictions and/or conclusions for real-life\
    \ problems under study. Prototyping involves repeating the process of making models\
    \ and testing them several times to perform feasibility analysis of a particular\
    \ model before deciding to choose the same and making a complete model. At this\
    \ stage of prototyping, user may choose to ignore other efficiency-related parameters\
    \ like faster execution.\n\nThe act of converting a mathematical model to a computer\
    \ program involves expressing mathematical architecture in terms of syntax of\
    \ the programming language. This can be done part-wise for a model or as a whole.\
    \ Part-wise modeling would require compatibility of various parts. Python provides\
    \ a series of advantages in this regard.\n\n### 10.6.2 Python for Fast Prototyping\n\
    \nThe advantage of interpretive architecture is lessening the time to debug. As\
    \ a code is interpreted line-by-line, the codes runs fine until it encounters\
    \ a problem. This helps in identifying and isolating the problematic part of the\
    \ code, thus enabling faster debugging. The overall result is a dramatic reduction\
    \ of time for prototyping a solution as most of the time for devising a solution\
    \ is spent in debugging. In addition to this fact, Python is devised for simple,\
    \ intuitive, and minimalistic syntax, which further accelerates the prototyping\
    \ process, saving time for the people involved in solving the scientific problem.\
    \ The ability to easily visualize problems with powerful graphic libraries such\
    \ as `matplotlib` and `mayavi` adds value to the quality of the coding process\
    \ because mistakes can be found more easily and they can be presented in a better\
    \ manner.\n\nBeing open source and modular in structure, Python provides the ability\
    \ to part-wise model develop faster by using existing code instead of reinventing\
    \ the wheel by writing it again. Within the same version of Python (Python 2 or\
    \ Python 3), the modules are compatible. Python also allows codes of some languages\
    \ to run natively within a Python code. Using the `Cython` package, you can embed\
    \ C code in a Python program. Similarly, using the `Jython` package, you can embed\
    \ java code in a Python program. This allows programmers to choose various programming\
    \ languages as per their abilities and still develop their model in Python, taking\
    \ advantage of what their programming languages do not offer. This also enables\
    \ programmers to use legacy code instead of writing it again in Python.\n\n##\
    \ 10.7 Large Dataset Handling\n\nThe `h5py` package enables developers to handle\
    \ HDF5 binary data format, which is mostly used to store large amounts of data\
    \ efficiently. Numerical computation using Python packages like `numpy` and `scipy`\
    \ can then be operated on these data points in a vectorized manner. An array-based\
    \ computing paradigm used for `numpy` and `scipy` becomes advantageous here since\
    \ the large dataset interfaced using `h5py` can be operated as if it’s an array.\
    \ Thousands of datasets can be categorized, tagged, and then saved in a single\
    \ file.\n\nIn the age of the Internet, users might like to fetch data from database\
    \ servers, perform computation on a smaller chunk of data at a time, and send\
    \ back results to application servers for further processing and report generation.\
    \ For this purpose, Python provides a variety of packages. Python has a standard\
    \ mechanism for accessing databases called the Database API (DB-API). The Python\
    \ DB-API specifies a way to connect to databases and issue commands to them. Python\
    \ DB-API fits nicely into existing Python code and allows Python programmers to\
    \ easily store and retrieve data from databases [[2](#A458920_1_En_10_Chapter.html#Par102)].\n\
    \nDB-API includes the following:\n\n- Connections that encompass the guidelines\
    \ about connecting to databases\n- Executing statements and stored procedures\
    \ to query, update, insert, and delete data with cursors\n    - A cursor is a\
    \ Python objects that points to a particular location in the database.\n    -\
    \ Once a cursor is obtained, various methods like inserting, updating, and deleting\
    \ data as well as querying data can be performed.\n- Transactions with support\
    \ for committing or rolling back a transaction\n    - A transaction is a sequence\
    \ of operations performed as a single logical unit of work having four distinct\
    \ properties (ACID: Atomicity, Consistency, Isolation, and Durability).\n    -\
    \ The possibility to roll back a transaction is crucial for securing very important\
    \ data.\n- Examining metadata on the database module as well as on a database\
    \ and table structure\n    - Metadata associated with a database describes the\
    \ features of that database.\n    - The ability to access metadata allows developers\
    \ to use the database judiciously.\n- Defining the types of errors and providing\
    \ exceptions using Python\n\nA large list of databases has been included in the\
    \ DB-API list, which enables developers to interact with multiple databases within\
    \ a single code.\n\nSpecialized packages like `pandas` are designed to perform\
    \ vectorized operations on large datasets in an efficient manner. These are used\
    \ extensively nowadays in the field of big data. Most often, statistical analysis\
    \ is needed for a dataset. The `pandas` package provides most of the statistical\
    \ functions required for basic as well as advanced statistical analysis. Coupled\
    \ with simple plotting libraries like `matplotlib`, quick verification of analysis\
    \ and the ability to produce publication-quality graphs have extended a golden\
    \ helping hand to developers."
