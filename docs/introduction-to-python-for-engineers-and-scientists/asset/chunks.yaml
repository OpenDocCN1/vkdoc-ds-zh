  trans: '

    ### 7.2.1 `pylab` 与 `pyplot` 对比


    在 `matplotlib` 中，`pyplot` 和 `pylab` 是 `matplotlib` 内部讨论最多的两个模块，它们提供的功能几乎相同，因此在使用上容易造成混淆。因此，在此处区分它们非常重要。


    在 `matplotlib` 包中，存在两个子包，即 `matplotlib.pylab` 和 `matplotlib.pyplot`。由于绘图可以从简单的练习开始，然后变得相当复杂，因此
    `matplotlib` 采用分层模式设计，默认情况下，简单函数在 `matplotlib.pylab` 环境中实现。随着复杂度的增加，会实现像 `matplotlib.pyplot`
    这样更复杂的环境。


    `matplotlib.pyplot` 是一种更面向对象的方法，其中像 `figures()`、`axes()` 和 `axes()` 这样的函数被定义为对象，以动态跟踪其属性。对于更复杂的任务，例如制作图形用户界面（GUI），可以完全放弃使用
    `pyplot`，而采用面向对象的方法来创建图形。此外，当图形大多是非交互式时，可以使用 `pyplot` 环境。`pylab` 则用于交互式研究。


    ## 7.3 绘制基本图形


    我们将首先探索 `matplotlib.pyplot` 提供的工作环境。`pyplot` 内部的函数控制图形的特定特征，例如添加标题、标注 x 轴和 y 轴的标签、在图形主体上的所需位置放置数学公式、定义刻度标签、定义绘制图形的标记类型等等。`pyplot`
    是有状态的；一旦定义，它会持续更新图形状态的变化。这使得在将代码包含到程序中之前，可以更容易地修改图形，直到达到所需的水平。`plot()` 函数用于绘制简单的二维图形。它接受许多参数，这些参数填充数据和其它特征信息以绘制图形。在最简单的形式中，它可以绘制一个数字列表。（参见
    7-1 清单。）


    ```

    1  # 用于绘制数字的 Python 代码

    2  import numpy as np

    3  import matplotlib.pyplot as plt

    4  a = np.arange(10)

    5  plt.plot(a)

    6  plt.show()

    清单 7-1

    sqPlot0.py

    ```


    需要注意的是，库/模块 `numpy` 和 `matplotlib.pyplot` 使用了别名：`np` 和 `plt`。程序员通常更喜欢这样做，以避免在每次需要使用其函数时都编写库的名称。本章将采用此约定。


    ![A458920_1_En_7_Fig1_HTML.jpg](img/A458920_1_En_7_Fig1_HTML.jpg)


    图 7-1


    使用 `plot()` 函数绘制前 10 个整数


    结果如图 7-1 所示。一个图形需要两个轴，通常称为 x 轴和 y 轴。当 `plot()` 命令只提供一个列表或数组时，它会假定这些是 y 轴的值，并根据列表的长度自动生成相应的
    x 值。我们有 10 个数字。因此，x 轴有从 0 到 9 的 10 个数字。`plot()` 可以将两个轴都作为输入向量来生成图形，如 7-2 清单中的代码所示。此代码使用
    `pylab` 库而不是 `pyplot`。


    ```

    1  # 使用 pylab 绘制数字

    2  import numpy as np

    3  from matplotlib import pylab as pl

    4  x = np.linspace(0,100)

    5  y = x ** 2

    6  pl.plot(x,y)

    7  pl.show()

    清单 7-2

    sqPlot1.py

    ```


    结果如图 7-2 所示。只需几行代码就可以绘制一个非常基本的图形：首先导入相关库（第 1 行和第 2 行），然后定义 x 轴和 y 轴，最后使用 `plot`
    命令，该命令提供 x 轴和 y 轴的参数。这些命令可以在 Python 命令提示符下逐条发出，也可以保存为 Python 文件。（使用文本编辑器，编写代码，并以
    `sqPlot1.py` 保存。）


    ![A458920_1_En_7_Fig2_HTML.jpg](img/A458920_1_En_7_Fig2_HTML.jpg)


    图 7-2


    使用 `plot()` 函数绘制前 10 个整数


    这些轴被定义为 `numpy` 数组。它们可以通过所有可用的方法生成，包括手动创建、使用公式（如代码 `sqPlot1.py` 中——通过对数组 `x` 进行逐元素平方生成名为
    `y` 的数组）、使用数据文件、通过互联网或局域网从远程/本地服务器实时获取数据等等。后续章节将介绍文件输入/输出功能。本章仅使用自身生成或使用公式生成的数组。


    值得一提的是一个看似简单但功能强大的函数：`show()`。在命令提示符下简单搜索（输入 `matplotlib.pyplot.show`）即可了解其用途。它会在具有图形功能的计算机终端上显示图形，大多数现代计算机都具备此功能。在
    `IPython` 控制台的非交互模式下，它会先显示所有图形并阻塞控制台，直到图形被关闭。相反，在交互模式下，它不会阻塞控制台。两种模式各有优点。交互模式用于检查特征的变化。当重点更多地放在生成图形的代码上时，使用非交互模式。通常，程序员先使用交互模式优化视图，然后使用非交互模式，并采用在交互模式实验期间生成的相同设置。


    ### 7.3.1 在同一坐标轴上绘制多个图形


    只需发出两个 plot 命令，就可以在同一图形的同一坐标轴上绘制多个图形，如 7-3 清单所示。


    ![A458920_1_En_7_Fig3_HTML.jpg](img/A458920_1_En_7_Fig3_HTML.jpg)


    图 7-3


    在同一坐标轴上绘制多个图形


    ```

    1  import numpy as np

    2  from matplotlib import pylab as pl

    3  x = np.linspace(0,100)

    4  y1 = x ** 2 # y 是 x 的平方

    5  y2 = x ** 2.2 # y 是 x 的 2.2 次方

    6  pl.plot(x,y1)

    7  pl.plot(x,y2)

    8  pl.show()

    清单 7-3

    sqPlot2.py

    ```

