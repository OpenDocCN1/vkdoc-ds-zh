    A variety of engineering data use logarithmic scales, particularly those where
    changes result in an order of magnitude change in values of observed variable.
    Python provides the facility to plot logarithmic plots, as shown in Listing [7-18](#A458920_1_En_7_Chapter.html#Par128).


    ![A458920_1_En_7_Fig17_HTML.jpg](A458920_1_En_7_Fig17_HTML.jpg)


