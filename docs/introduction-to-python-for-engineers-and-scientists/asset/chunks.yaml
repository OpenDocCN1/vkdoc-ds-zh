    ```


    It is interesting to note that Python classifies the three numbers stored in variables
    `a`, `b`, and `c` in distinct classes as objects. The help string details their
    usage. Anything and everything that needs to be computed can be imagined as an
    entity called an object with a set of attributes and related set of behaviors.
    The set of attributes is stored in instance variables and their behavior is probed
