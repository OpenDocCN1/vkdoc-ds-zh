    \ of modules for various computational tasks.\n\n## 2.4 Anaconda IDE\n\nAnaconda\
    \ IDE (Integrated Development Environment) is one of the most convenient and complete\
    \ ways to get a working environment for a beginner as well as for an experienced\
    \ developer. An IDE presents a Python command line interpreter—a text editor with\
    \ advanced features like syntax completion, keyword highlighting, and file browser.\
    \ Anaconda provides all of these and many more features in a simple and intuitive\
    \ way. It can be installed in a very simple manner using the graphical installer\
    \ provided at its web site [[3](#A458920_1_En_2_Chapter.html#Par102)].\n\n![A458920_1_En_2_Fig4_HTML.jpg](A458920_1_En_2_Fig4_HTML.jpg)\n\
    \nFigure 2-4\n\nAnaconda IDE\n\nThe Spyder IDE within Figure [2-4](#A458920_1_En_2_Chapter.html#Fig4)\
    \ provides an easy way to use an IDE environment for development of Python files.\
    \ It resents three panes:\n\n1.  Editor\n    *   You can write a multiline program\
    \ here and execute it by clicking `Play` or clicking the `Run` option in the main\
    \ menu bar.\n\n    ![A458920_1_En_2_Fig5_HTML.jpg](A458920_1_En_2_Fig5_HTML.jpg)\n\
    \n    Figure 2-5\n\n    Anaconda IDE  \n2.  IPython Console\n    *   You can write\
    \ Python expressions here and execute them by pressing the Enter key. \n3.  Variable\
    \ Explorer / File Explorer / Help\n    *   Variable Explorer\n        *   The\
    \ variable explorer presents the details of all variables (explained later) created\
    \ during a session and their properties (name, type, size, and values).\n    *\
    \   File Explorer\n        *   The file explorer presents the details of all files\
    \ created during a session and their properties (name, size, kind, and date modified).\n\
    \    *   Help\n        *   This tool presents useful documentation on any topic\
    \ inquired by a developer. \n\nWe have written this book using Anaconda IDE on\
    \ a Mac OS X 10.12.6 system. Since Python programs are portable, they will run\
    \ in a similar fashion to any Python 3 interpreter.\n\n## 2.5 Python as a Calculator\n\
    \nLet’s start working with the Python interpreter to understand it more clearly.\
    \ To begin, type the command following the Python interpreter’s command prompt\
    \ `>>>` and press the `Enter` key on the keyboard.\n\nIn its simplest form, the\
    \ Python interpreter can be used as a calculator. On the Python command prompt,\
    \ the following commands can be checked for 2 + 4:\n\n```\n1  >>>2+4\n2  6\n3\
    \  >>>2.+4\n4  6.0\n5  >>>2.0+4\n6  6.0\n7   >>>2.0+4.\n8  6.0\n9  >>>2.0+4.0\n\
    10  6.0\n```\n\nAs per these calculations, 2 + 4 yields 6, whereas 2 + 4\\. yields\
    \ 6.0\\. 6 and 6.0 are two different objects for a computer. 6 is an integer stored\
    \ in lesser space than 6.0, which is a floating point number. Just like two types\
    \ of numerical data, data can be classified in different kinds of objects (need\
    \ not be numeric). Python treats all entries as objects. An object needs to be\
    \ defined with its attributes/properties. For example, a floating point number\
    \ has different rules of addition, subtraction, printing on screen, and representation\
    \ of graphs when compared to an integer. For this reason, a floating point number\
    \ is a quite different `data type` when compared to an integer. A detailed list\
    \ of data types will be discussed later.\n\nIt is also important to note that\
    \ to define the floating point number 4.0, writing even `4.` is sufficient. `4.0`\
    \ and `4.` are equivalent. Similarly, `0.4` and `.4` both mean the mathematical\
    \ number 0.4\\. Also, Python dynamically assigned the `type` to the objects defined\
    \ by analyzing their values, so `2` became an `int` (integer type) and 2.0 became\
    \ a `float` (floating point number type) of numerical data. We did not explicitly\
    \ define an object’s type; it was dynamically assigned by the interpreter. We\
    \ can explicitly define the type, too. This involves using the functions for a\
    \ particular type of data. The following code explains this phenomenon by using\
    \ two functions, `int()` and `float()`, which convert the given input (inside\
    \ the parentheses) to integers and floating point numbers respectively.\n\n```\n\
    1  >>> int (2)\n2  2\n3  >>> int (2.0)\n4  2\n5  >>> float (2)\n6  2 . 0\n7  >>>\
    \ float (2.0)\n8  2.0\n```"
  trans: "\n### 2.3 使用 Python 解释器\n\nPython 是一种解释型语言，与 C、C++、Java 等编译型语言不同。它的每一行代码都会被解释并作为字节码执行，而不是生成一个单一的机器码文件。这使得其计算架构与传统语言截然不同。例如，假设一个多行\
    \ Python 程序的第 5 行存在语法错误。在这种情况下，程序会执行到第 4 行的所有命令，然后显示错误。而对于编译型语言，编译步骤会显示错误，并且程序根本不会运行，也就是说不会生成机器码文件。要详细了解这种差异，你首先需要理解编译和解释的过程。\n\
    \n![A458920_1_En_2_Fig3_HTML.jpg](img/A458920_1_En_2_Fig3_HTML.jpg)\n\n**图 2-3**\
    \ 在 Mac OS X 上运行的 Python 解释器\n\n对于编译型语言，编译器会将人类可读的代码翻译成机器可读的汇编语言。机器可读的代码称为目标代码，由目标文件提供。这些目标文件可以直接在机器上运行。举个例子，假设一个\
    \ C 代码定义如下，并保存在名为 `hello.c` 的文件中：\n\n```\n1  /∗ Hello World program ∗/\n\n3  #include\
    \ \n\n5  main()\n6  {\n7  printf (\"Hello World\");\n\n9  }\n```\n\n要在带有 `gcc`\
    \ 编译器的类 UNIX 机器上编译这段代码，我们给出以下命令：\n\n```\ngcc hello.c -o hello\n```\n\n这会创建一个名为\
    \ `hello` 的目标代码。在编译过程中，头文件 `stdio.h` 用于理解输入输出语句，例如 `printf(\"Hello World\")`。然后，可以通过在\
    \ UNIX 终端上输入以下命令来执行目标代码：\n\n```\n./hello\n```\n\n用户可以共享这个目标文件，如果微处理器架构与另一个用户相同，它将被统一执行。然而，如果机器架构不同，则必须首先为目标机器编译源代码，然后才能执行。\n\
    \nPython 的情况则不同。作为一种解释型语言，它使用解释器将代码解释为中间代码，然后再转换为机器码。解释器读取程序的源代码文本，对其进行分析，并逐行执行。这个过程很慢，因为解释器花费大量时间分析字符串以理解其含义。例如，要像\
    \ C 程序那样输出 `hello world`，Python 需要以下代码：\n\n```\n1  >>>print (\"hello world\")\n\
    2  >>>hello world\n```\n\n仅在一行中，解释器就会扫描单词 `print` 并查找其含义。在 Python 解释器中，它意味着向特定设备输出。设备可以是计算机终端、打印机绘图仪等。默认情况下，它是计算机终端。`print`\
    \ 命令还需要参数，这些参数在第二步中被扫描为字符串 `hello world`。（Python 中的字符串可以用 `\"` 或 `\"\"` 括起来）。因此，这一行的完整解释是：在计算机终端上打印字符串\
    \ `hello world`。\n\n当一个程序由成百上千行代码组成时，编译过程会产生更快的结果，因为目标代码只需编译一次，然后就可以直接在微处理器上运行。而解释型代码每次需要处理时都会检查解释。另一方面，即使是一个语法错误也会导致编译过程无法完成，从而产生编译错误。相反，Python\
    \ 解释器会解释 Python 代码，直到遇到任何类型的错误为止。\n\n尽管 Python 本质上较慢，但由于其拥有丰富的模块库，可用于各种计算任务，并且极其简单、直观且功能强大，它已成为科学家和工程师的最爱。\n\
    \n### 2.4 Anaconda IDE\n\nAnaconda IDE（集成开发环境）是为初学者和经验丰富的开发者获取工作环境最便捷、最完整的方式之一。IDE\
    \ 提供了一个 Python 命令行解释器——一个具有语法补全、关键字高亮和文件浏览器等高级功能的文本编辑器。Anaconda 以简单直观的方式提供了所有这些功能以及更多特性。可以使用其网站\
    \ [3] 上提供的图形化安装程序非常简单地安装它。\n\n![A458920_1_En_2_Fig4_HTML.jpg](img/A458920_1_En_2_Fig4_HTML.jpg)\n\
    \n**图 2-4** Anaconda IDE\n\n图 2-4 中的 Spyder IDE 提供了一种使用 IDE 环境开发 Python 文件的简便方法。它呈现三个窗格：\n\
    \n1.  **编辑器**\n    *   您可以在此编写多行程序，并通过单击 `Play` 或单击主菜单栏中的 `Run` 选项来执行它。\n\n  \
    \  ![A458920_1_En_2_Fig5_HTML.jpg](img/A458920_1_En_2_Fig5_HTML.jpg)\n\n    **图\
    \ 2-5** Anaconda IDE\n\n2.  **IPython 控制台**\n    *   您可以在此编写 Python 表达式，并通过按 `Enter`\
    \ 键来执行它们。\n\n3.  **变量资源管理器 / 文件资源管理器 / 帮助**\n    *   **变量资源管理器**\n        *  \
    \ 变量资源管理器显示会话期间创建的所有变量（稍后解释）的详细信息及其属性（名称、类型、大小和值）。\n    *   **文件资源管理器**\n    \
    \    *   文件资源管理器显示会话期间创建的所有文件的详细信息及其属性（名称、大小、类型和修改日期）。\n    *   **帮助**\n     \
    \   *   此工具提供开发者查询的任何主题的有用文档。\n\n我们是在 Mac OS X 10.12.6 系统上使用 Anaconda IDE 编写本书的。由于\
    \ Python 程序是可移植的，它们将以与任何 Python 3 解释器类似的方式运行。\n\n### 2.5 将 Python 用作计算器\n\n让我们开始使用\
    \ Python 解释器，以便更清楚地理解它。首先，在 Python 解释器的命令提示符 `>>>` 后输入命令，然后按键盘上的 `Enter` 键。\n\n\
    在最简单的形式中，Python 解释器可以用作计算器。在 Python 命令提示符下，可以检查 `2 + 4` 的以下命令：\n\n```\n1  >>>2+4\n\
    2  6\n3  >>>2.+4\n4  6.0\n5  >>>2.0+4\n6  6.0\n7   >>>2.0+4.\n8  6.0\n9  >>>2.0+4.0\n\
    10  6.0\n```\n\n根据这些计算，`2 + 4` 得到 `6`，而 `2 + 4.` 得到 `6.0`。对于计算机来说，`6` 和 `6.0`\
    \ 是两个不同的对象。`6` 是一个整数，存储空间比 `6.0` 小，而 `6.0` 是一个浮点数。就像两种数值数据一样，数据可以分为不同类型的对象（不一定是数值）。Python\
    \ 将所有条目视为对象。一个对象需要用其属性/特性来定义。例如，与整数相比，浮点数在加法、减法、屏幕打印和图形表示方面有不同的规则。因此，浮点数是一种与整数截然不同的\
    \ `数据类型`。稍后将讨论数据类型的详细列表。\n\n同样重要的是要注意，要定义浮点数 `4.0`，即使只写 `4.` 也足够了。`4.0` 和 `4.`\
    \ 是等价的。类似地，`0.4` 和 `.4` 都表示数学数字 `0.4`。此外，Python 通过分析对象的值动态地为它们分配 `类型`，因此 `2` 变成了数值数据的\
    \ `int`（整数类型），而 `2.0` 变成了 `float`（浮点数类型）。我们没有显式定义对象的类型；它是由解释器动态分配的。我们也可以显式定义类型。这涉及到使用特定数据类型对应的函数。以下代码通过使用两个函数\
    \ `int()` 和 `float()` 来解释这一现象，这两个函数分别将给定的输入（括号内）转换为整数和浮点数。\n\n```\n1  >>> int\
    \ (2)\n2  2\n3  >>> int (2.0)\n4  2\n5  >>> float (2)\n6  2 . 0\n7  >>> float\
    \ (2.0)\n8  2.0\n```\n"
- fmt: "## 2.6 Modules\n\nPython Multiverse has expanded with thousands of modules\
    \ and, being open source, most of them are readily available. Modules are collections\
    \ of Python programs for accomplishing specific tasks. For example, `numpy` has\
    \ various facilities for numerical computation. It was further expanded into `scipy`\
    \ for scientific computation in general. `matplotlib` is an acronym for mathematical\
    \ plotting library, which has rich features for plotting a variety of publication-ready\
    \ graphs. `pandas` is the library for data analysis, `scikit-learn` for machine\
    \ learning, `scikit-image` for image processing, and `sympy` for symbolic computing.\n\
    \nTo use a module, it must be installed in the machine first. Installation includes\
    \ downloading the files into an appropriate folder or directory, unzipping them,\
    \ and defining proper paths. There is an easier way for Ubuntu users where the\
    \ short command-line-based program `pip` performs these tasks seamlessly.\n\n\
    Running the simple command\n\n```\nsudo apt-get install python3-pip\n```\n\ninstalls\
    \ the program `pip` first. It can then be used to install a package, say `numpy`,\
    \ by simply issuing the command\n\n```\nsudo pip3 install numpy\n```\n\nReplacing\
    \ the name of the package with the desired package will do the trick of installing\
    \ the packages hassle-free. Also, modules can be upgraded to the latest version\
    \ by typing\n\n```\nsudo pip install [package_name] --upgrade\n```\n\nInstalling\
    \ `scipy stack` [[4](#A458920_1_En_2_Chapter.html#Par103)] is very useful for\
    \ our purposes because it installs a variety of programs that we will be using.\
    \ It can be installed by issuing the following command on an Ubuntu terminal:\n\
    \n```\n$ sudo apt-get install python-numpy python-scipy\npython-matplotlib ipython\
    \ ipython-notebook\npython-pandas python-sympy python-nose\n```\n\nThis command\
    \ in a single line installs the following:\n\n*   `numpy` (numerical Python)\n\
    *   `scipy` (scientific Python)\n*   `matplotlib` (mathematical plotting library)\n\
    *   `ipython` (an interactive environment for the Python interpreter)\n*   `ipython-notebook`\
    \ (a web-based interactive environment for `ipython`)\n*   `pandas` (used for\
    \ statistical computations)\n*   `sympy` (used for performing symbolic computation)\n\
    *   `nose` (used for testing)\n\nAnaconda IDE comes pre-installed with all the\
    \ modules this book requires. Any extra modules can be installed in a similar\
    \ manner using a conda terminal. To open a conda terminal, first click `Environments`\
    \ and then the arrow button next to `root` (Figure [2-6](#A458920_1_En_2_Chapter.html#Fig6)).\
    \ You can choose the option `Open Terminal` to open a Linux-like terminal in any\
    \ operating system.\n\n![A458920_1_En_2_Fig6_HTML.jpg](A458920_1_En_2_Fig6_HTML.jpg)\n\
    \nFigure 2-6\n\nConda terminal\n\nThe `Environment` option also presents the list\
    \ of installed modules. You can uninstall and upgrade a module to the required\
    \ version by choosing the desired module and clicking `Apply` at the bottom at\
    \ the bottom of the screen.\n\n### 2.6.1 Using a Module\n\nTo use a particular\
    \ module and its functionalities, first import it inside the workspace using the\
    \ command `import`. For example:\n\n```\nimport math\n```\n\nThis command imports\
    \ the module named `math` and all its objects are now available for usage. The\
    \ procedure to use them is as follows:\n\n1.  `import math`\n    *   We need to\
    \ mention the name of the module before using any function defined within itself.\
    \ For example, if we wish to use the `sqrt()` function, we need to write `math.sqrt(2)`,\
    \ which will calculate ![$$ \\sqrt{2} $$](A458920_1_En_2_Chapter_IEq1.gif) using\
    \ the `math` module.\n2.  *   `\"*\"` signifies everything (in the language of\
    \ regular expressions). Hence, the statement means that we can use all the functions\
    \ without the need to write the name of the module separated with a `\".\"` (dot\
    \ operator) before the name of the function.\n\n    ```\n    from math import\
    \ *\n    ```\n\n3.  *   This statement just imports the `sqrt()` function being\
    \ used. Using this style of Python programming is essential when you have limited\
    \ memory and are energy-conscious because you don’t need to import unnecessary\
    \ objects. You still need to write the name of module separated with a `\".\"\
    ` (dot operator) before the name of the function.\n\n    ```\n    from math import\
    \ sqrt\n    ```\n\n## 2.7 Python Environment\n\nA professional way of working\
    \ on a Python project is to establish a dedicated Python environment for the particular\
    \ project. This has several advantages. The environment is isolated to the system\
    \ editions, updates, and upgrades. In other words, a separate set of a software\
    \ dependency’s repository (Python packages) can be maintained, which avoids problems\
    \ if the dependency’s upgrades affect the performance of code. (A beginner can\
    \ skip this section for now and then come back after gaining more practice with\
    \ Python.)\n\nAnaconda 2.4 presents the option of defining an environment as a\
    \ clickable tab in the left pane of the main window where you can create and maintain\
    \ a virtual environment graphically. You can do the same using a terminal. `virtualenv`\
    \ is a command-line-based tool that can create a dedicated and isolated Python\
    \ virtual environment. `virtualenv` creates a folder that contains all the necessary\
    \ executables to use the packages that a Python project would need.\n\n### 2.7.1\
    \ Installing virtualenv\n\nTo install `virtualenv`, you need a command-line tool\
    \ named `pip` (explained in detail in Section ??). On Ubuntu Linux-based machines,\
    \ issue the following command to install `virtualenv`:\n\n```\n$pip install virtualenv\n\
    ```\n\nSuppose you have created a folder named `my_project_folder`. To create\
    \ a virtual environment for a project named `proj1`, you have to issue the following\
    \ commands at a Linux terminal:\n\n```\n$cd my_project_folder\n$virtualenv proj1\n\
    ```\n\nThe second command will create a folder in the current directory. This\
    \ folder will contain the Python executable files and a copy of the `pip` library,\
    \ which you can use to install other packages.\n\n### 2.7.2 Activating virtualenv\n\
    \nTo use the virtual environment that has been created, it must first be `activated`.\
    \ The following command must be issued on a Linux terminal:\n\n```\n$source proj1/bin/activate\n\
    ```\n\nIf there haven’t been any errors, the command prompt will be preceded by\
    \ the name of the virtual environment. This indicates that it is active now for\
    \ further usage. Within a virtual environment, packages can be installed in the\
    \ usual manner as installed on a system in general.\n\nYou can generate a list\
    \ of dependencies with their installed version numbers by issuing the command\
    \ within the environment:\n\n```\n$pip freeze > requirements.txt\n```\n\nThis\
    \ command creates a file named `requirements.txt` that has a list of dependencies\
    \ along with their version numbers. When the project is shared and new users wish\
    \ to install the package, they can use this file for installation by issuing the\
    \ following command:\n\n```\n$pip install -r requirements.txt\n```\n\n### 2.7.3\
    \ Deactivating the Virtual Environment\n\nSince a developer may need to work on\
    \ a number of projects at the same time, it is helpful for each one to have a\
    \ separate virtual environment because the developer can work on only one virtual\
    \ environment at a time. When developers need to switch to some other task outside\
    \ the virtual environment, they must deactivate the present virtual environment\
    \ by issuing the following command:\n\n```\n$deactivate\n```\n\nThe command puts\
    \ the developer back to the system’s default Python interpreter with all its installed\
    \ libraries. In case developers need to remove the virtual environment, they can\
    \ remove its folder by issuing the following command:\n\n```\n$rm -rf proj1\n\
    ```"
