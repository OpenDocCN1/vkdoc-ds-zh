    6  [ 0.,  0.,  0.,  1.,  0.],

    7  [ 0.,  0.,  0.,  0.,  1.]])

    8  >>> numpy.diag(a) # 提取主对角线元素

    9  array([ 1.,  1.,  1.,  1.,  1.])

    10  >>> numpy.diag(a,1) # 提取向上方向的对角线元素

    11  array([ 0.,  0.,  0.,  0.])

    12  >>> numpy.diag(a,-1) # 提取向下方向的对角线元素

    13  array([ 0.,  0.,  0.,  0.])

    ```


    ## 6.9 索引


    在 Python 中，数组或列表的元素从 0 开始；第一个元素的索引为 0。所有元素都可以通过其索引访问：


    ```

    1  >>>a =[1,2,3,4,5,6] # 创建一个列表并存储在变量名 ''a'' 中

    2  >>> type(a) # a 存储了一个 ''list'' 对象


    4  >>> b = numpy.array(a) # 数组 ''b'' 引用了由列表 ''a'' 引用的内容

    5  >>> b

    6  array([1, 2, 3, 4, 5, 6])

    7  >>> type(b)


    9  >>>a[1] # 访问列表 ''a'' 中左侧第二个元素

    10  2

    11  >>>b[0] # 访问数组 ''b'' 中左侧第一个元素

    12  1

    13  >>>a[-1] # 访问列表 ''a'' 中右侧第一个元素

    14  6

    15  >>>b[-2] # 访问数组 ''b'' 中右侧第二个元素

    16  5

    ```


    这些示例清楚地表明，数组与列表类似，并遵循相同的索引规则。多维数组也遵循相同的索引模式。对于二维数组，第一个数字表示行，第二个数字表示列：


    ```

    1  >>>a1 = numpy.array([[1,2,3],[3,2,1]]) # 使用两组列表创建二维数组

    2  >>>a1

    3  array([[1, 2, 3],

    4      [3, 2, 1]])

    5  >>>a1[1,2] # 选择行索引为 1、列索引为 2 的元素，即第二行第三列，右下角最后一个元素

    6  1

    7  >>>a1[1,1] # 选择行索引为 1、列索引为 1 的元素，即第二行第二列

    8  2

    9  >>>a1[1] # 选择索引为 1 的行，即第二行

    10  array([3, 2, 1])

    ```


    索引也可用于给特定元素赋值。这里使用了前面讨论过的赋值运算符：


    ```

    1  >>>a1 = numpy.array([[1,2,3],[3,2,1]]) # 使用两组列表创建二维数组

    2  >>>a1

    3  array([[1, 2, 3],

    4      [3, 2, 1]])

    5  >>>a1[1,1] = 0 # 将行索引=1、列索引=1 的元素设置为 0

    6  >>>a1 # 第二行第二列的元素，即 2，被改为 0

    7  array([[1, 2, 3],

    8      [3, 0, 1]])

    ```

