  raw: '### 7.19.1 Line and Scatter Plots


    `matplotlib`’s `toolkits` have the class `mplot3D`, which provides an `Axes3D`
    object. Using the `projection=''3D''` keyword, an `Axes3D` object is created,
    which provides the screen area to show a 3-D plot. `Axes3D` can then be passed
    on to a `figure` object to show it as a figure. A line plot can be simply created
    by passing three arguments to the `plot()` function as seen in Listing [7-21](#A458920_1_En_7_Chapter.html#Par148).


    ```

    1  import matplotlib as mpl

