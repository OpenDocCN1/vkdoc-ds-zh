- fmt: '## 6.2 numpy


    `numpy`包包含各种可用于数值计算的项目——因此得名 numerical Python。NumPy 起源于`Numeric`，最初由 Jim Hugunin
    创建，并有多位其他开发者的贡献。Travis Oliphant 于 2005 年创建了 NumPy，将竞争产品`Numarray`的特性整合到`Numeric`中，并进行了大量修改。`numpy`在开源许可下发布。本章代码已在
    1.12.1 版本上测试通过。


    与任何其他 Python 模块一样，`numpy`可以通过简单的`pip`程序在 Ubuntu 上安装：


    ```

    pip install numpy

    ```


    `numpy`预装在 Anaconda IDE 中，因此建议 Windows 和 Mac OS X 用户使用 Anaconda IDE 进行工作。


    要使用`numpy`，可以导入它并检查版本号：


    ```

    1  >>> import numpy

    2  >>> print (numpy.version.version)

    3  1.12.1

    ```


    第 1 行导入整个名为`numpy`的模块供我们使用。第 2 行使用`version`函数，该函数进一步使用`version`函数来查找系统上安装的`numpy`版本。鼓励用户检查自己的
    Python 版本。


    同样重要的是要注意，导入模块是使用它的必要条件，但一旦在会话中导入，每次使用时无需再次导入。但是，如果会话重新启动，则必须重新导入。对于本章，可以导入一次，然后编写代码，但如果用户关闭
    Python 会话并重新启动，则必须再次导入。


    ## 6.3 ndarray


    `ndarray`是`numpy`的主要对象，它是同质的（其所有成员元素仅包含一种数据类型）。元素使用`numpy`的`array()`函数创建。此函数需要一个列表作为输入。元素由正整数元组索引：


    ```

    1  >>> a = [1,2,3]

    2  >>> a

    3  [1, 2, 3]

    4  >>> type(a)


    6  >>> import numpy

    7  >>> b = numpy.array([1,2,3])

    8  >>> b

    9  array([1, 2, 3])

    10  >>> type(b)


    12  >>> b.dtype

    13  dtype(''int64'')

    14  >>> c = numpy.array([1.0, 2.0, 3.0])

    15  >>> c

    16  array([ 1.,  2.,  3.])

    17  >>> c.dtype

    18  dtype(''float64'')

    ```


    此示例展示了`lists`和`arrays`在`numpy`中的创建方式不同。`numpy`对象`array`接受一个列表作为输入。元素的数据类型可以由 Python
    解释器在解释时以动态方式分配。或者，也可以在创建时使用`array()`函数的第二个参数定义数据类型：


    ```

    1  >>>a1 = numpy.array([1,2,3], dtype=float)

    2  >>>a1

    3  array([ 1.,  2.,  3.])

    4  >>>a1.dtype

    5  dtype(''float64'')

    6  >>>a2 = numpy.array([1,2,3], dtype=complex)

    7  >>>a2

    8  array([ 1.+0.j,  2.+0.j,  3.+0.j])

    9  >>>a2.dtype

    10  dtype(''complex128'')

    ```


    `ndarray`也以其别名`array`而闻名。除了使用`dtype`了解数据类型外，还有多种方法可以获取有关`ndarray`各种属性的信息，如表 [6-1](#A458920_1_En_6_Chapter.html#Tab1)
    所示。


    表 6-1


    探测数组属性的各种方法


    | `ndarray.dtype` | 元素的数据类型 |

    | `ndarray.ndim` | 数组的维度 |

    | `ndarray.shape` | 数组的形状，对于 (n, m) 数组为 (n, m) |

    | `ndarray.size` | 数组的大小，n × m |

    | `ndarray.itemsize` | 每个元素的字节大小 |

    | `ndarray.data` | 包含实际元素的缓冲区数据 |

    | `ndarray.reshape` | 保持 n × m 常数的情况下重塑形状 |


    表 [6-1](#A458920_1_En_6_Chapter.html#Tab1) 可以通过以下 Python 代码理解。我们首先定义一个名为`a3`的
    3 数组，然后使用列出的方法探测此对象的属性：


    ```

    1  >>> a3 = numpy.array( [ (1,2,3), (4,5,6), (2,7,8) ] ) # defining array

    2  >>> a3 # REPL prints contents of a3

    3  array([[1, 2, 3],

    4  [4, 5, 6],

    5  [2, 7, 8]])

    6  >>> a3.ndim # number if dimesnions of a3-2 i.e it can be described in terms
    of rows and columns

    7  2

    8  >>> a3.size # total number of elements

    9  9

    10  >>> a3.shape # number of elements in each dimesnion as a tuple

    11  (3, 3)

    12  >>> a3.dtype # data type of member elements

    13  dtype(''int64'')

    14  >>> a3.data # address of memory location whre array is stored


    16  >>> a3.itemsize # Size in bytes of each element

    17  8

    18  >>> a3.reshape(1,9) # reshaping 3 X 3 array as 1 X 9 array i.e 1 row and 9
    columns

    19  array([[1, 2, 3, 4, 5, 6, 2, 7, 8]])

    20  >>> a3.reshape(9,1) # reshaping 3 X 3 array as 9 X 1 array i.e 9 row and 1
    columns

    21  array([[1],

    22  [2],

    23  [3],

    24  [4],

    25  [5],

    26  [6],

    27  [2],

    28  [7],

    29  [8]])

    30  >>>a3.reshape(9,1) is a3.reshape(1,9)

    31  False

    32  # result is false because both arrays have different shapes

    ```


    ## 6.4 自动创建数组


    存在多种函数可以自动创建所需维度和形状的数组。这在数学计算中非常方便，因为手动创建数组是一项繁琐的任务。


    ### 6.4.1 zeros( )


    要创建一个所有元素都为 0 的数组，我们使用`zeros()`函数：


    ```

    1  >>> numpy.zeros((3,4)) # arrays of float tyoe by default

    2  array([[ 0.,  0.,  0.,  0.],

    3  [ 0.,  0.,  0.,  0.],

    4  [ 0.,  0.,  0.,  0.]])

    5  >>> numpy.zeros((3,4),dtype=int) # array of int data type

    6  array([[0, 0, 0, 0],

    7  [0, 0, 0, 0],

    8  [0, 0, 0, 0]])

    9  >>> numpy.zeros((3,4),dtype=complex) # array of complex data type

    10  array([[ 0.+0.j,  0.+0.j,  0.+0.j,  0.+0.j],

    11  [ 0.+0.j,  0.+0.j,  0.+0.j,  0.+0.j],

    12  [ 0.+0.j,  0.+0.j,  0.+0.j,  0.+0.j]])

    13  >>> numpy.zeros((3,4),dtype=str) # array of empty strings

    14  array([['''', '''', '''', ''''],

    15  ['''', '''', '''', ''''],

    16  ['''', '''', '''', '''']],

    17  dtype=''<U1'')

    ```


    在矩阵计算初始化为零值时，`zeros()`函数被广泛使用。


    ### 6.4.2 ones( )


    要创建一个所有元素都为 1 的数组，我们使用`ones()`函数：


    ```

    1  >>> numpy.ones((3,4)) # array of float values

    2  array([[ 1.,  1.,  1.,  1.],

    3  [ 1.,  1.,  1.,  1.],

    4  [ 1.,  1.,  1.,  1.]])

    5  >>> numpy.ones((3,4),dtype=int) # array of int values

    6  array([[1, 1, 1, 1],

    7  [1, 1, 1, 1],

    8  [1, 1, 1, 1]])

    9  >>> numpy.ones((3,4),dtype=complex) # array of complex number values

    10  array([[ 1.+0.j,  1.+0.j,  1.+0.j,  1.+0.j],

    11  [ 1.+0.j,  1.+0.j,  1.+0.j,  1.+0.j],

    12  [ 1.+0.j,  1.+0.j,  1.+0.j,  1.+0.j]])

    13  >>> numpy.ones((3,4),dtype=str) # array of strings

    14  array([[''1'', ''1'', ''1'', ''1''],

    15  [''1'', ''1'', ''1'', ''1''],

    16  [''1'', ''1'', ''1'', ''1'']],

    17  dtype=''<U1'')

    ```


    有趣的是，复数`1+o.j`在数学上等同于`1.0`，但数据类型决定了数据在计算机内存中的存储方式以及使用运算符对其进行操作的方式。因此，应谨慎使用。


    ### 6.4.3 ones_like( )


    `ones_like()`从现有数组获取线索，创建一个具有相似形状和类型的全 1 数组：


    ```

    1  >>> a = numpy.array([[1.1, 2.2, 4.1],[2.5,5.2,6.4]])

    2  >>> a

    3  array([[ 1.1,  2.2,  4.1],

    4  [ 2.5,  5.2,  6.4]])

    5  >>> numpy.ones_like(a)

    6  array([[ 1.,  1.,  1.],

    7  [ 1.,  1.,  1.]])

    8  >>> numpy.ones_like(a,dtype=int)

    9  array([[1, 1, 1],

    10  [1, 1, 1]])

    11  >>> numpy.ones_like(a,dtype=complex)

    12  array([[ 1.+0.j,  1.+0.j,  1.+0.j],

    13  [ 1.+0.j,  1.+0.j,  1.+0.j]])

    14  >>> numpy.ones_like(a,dtype=str)

    15  array([[''1'', ''1'', ''1''],

    16  [''1'', ''1'', ''1'']],

    17  dtype=''<U1'')

    ```'
  raw: '## 6.2 numpy


    The `numpy` package contains various items that can be used for numerical computation—hence,
    the name numerical Python . NumPy originated from Numeric, which was originally
    created by Jim Hugunin with contributions from several other developers. Travis
    Oliphant created NumPy in 2005 by incorporating features of the competing Numarray
    into Numeric, with extensive modifications. `numpy` is released under an open
    source license. This chapter’s code has been tested for version 1.12.1.


    Just like any other Python module, `numpy` can be installed on Ubuntu with a simple
    `pip` program:


    ```

    pip install numpy

    ```


    `numpy` is pre-installed in Anaconda IDE, so windows and Mac OS X users are advised
    to work using Anaconda IDE.


    To use, `numpy` can be imported and the version number can be checked:


    ```

    1  >>> import numpy

    2  >>> print (numpy.version.version)

    3  1.12.1

    ```


    Line 1 imports the whole module named `numpy` for our use. Line 2 uses the function
    `version`, which further uses the function `version` to find the installed version
    of `numpy` on the system. Users are encouraged to check their version of Python.


    It is also important to note that importing a module is necessary for its usage,
    but once imported in a session, it doesn’t need to be imported each time it is
    used. However, if the session is restarted, it must be freshly imported. For this
    chapter, it can be imported once and then codes can be written, but if a user
    shuts down the Python session and comes back to start it again, it must be imported
    again.


    ## 6.3 ndarray


    `ndarray` is the main object of `numpy`, which is homogeneous (containing only
    one data type for all its member elements). The elements are created using the
    `array()` function of `numpy`. This functions needs a list as input. Elements
    are indexed by a tuple of positive integers:


    ```

    1  >>> a = [1,2,3]

    2  >>> a

    3  [1, 2, 3]

    4  >>> type(a)


    6  >>> import numpy

    7  >>> b = numpy.array([1,2,3])

    8  >>> b

    9  array([1, 2, 3])

    10  >>> type(b)


    12  >>> b.dtype

    13  dtype(''int64'')

    14  >>> c = numpy.array([1.0, 2.0, 3.0])

    15  >>> c

    16  array([ 1.,  2.,  3.])

    17  >>> c.dtype

    18  dtype(''float64'')

    ```


    This example shows how `lists` and `arrays` in `numpy` are created differently.
    The `numpy` object `array` takes a list as input. The data type of elements can
    be assigned by the Python interpreter at the time of interpretation in a dynamic
    fashion. Alternatively, the data type can be defined at the time of creation too
    using the second argument of the `array()` function:


    ```

    1  >>>a1 = numpy.array([1,2,3], dtype=float)

    2  >>>a1

    3  array([ 1.,  2.,  3.])

    4  >>>a1.dtype

    5  dtype(''float64'')

    6  >>>a2 = numpy.array([1,2,3], dtype=complex)

    7  >>>a2

    8  array([ 1.+0.j,  2.+0.j,  3.+0.j])

    9  >>>a2.dtype

    10  dtype(''complex128'')

    ```


    `ndarray` is also known by its alias `array`. Apart from knowing the data type
    by using `dtype`, there are a variety of methods to get information about various
    attributes of `ndarray`, as shown in Table [6-1](#A458920_1_En_6_Chapter.html#Tab1).


    Table 6-1


    Various Methods to Probe the Property of an Array


    | `ndarray.dtype` | Data type of elements |

    | `ndarray.ndim` | Dimension of array |

    | `ndarray.shape` | Shape of array, (n, m) for (n, m) array |

    | `ndarray.size` | Size of array, n × m |

    | `ndarray.itemsize` | Size in bytes of each element |

    | `ndarray.data` | Buffer data containing actual element |

    | `ndarray.reshape` | Reshapes keeping n × m constant |


    Table [6-1](#A458920_1_En_6_Chapter.html#Tab1) can be understood using the following
    Python code. We first define a 3 array named `a3` and then probe the property
    of this object using the methods listed:


    ```

