  \ 会员服务、亚马逊物流、`Amazon Web Services (AWS)`、Kindle 直接出版、Kindle 设备、职业选择计划、Fire 平板电脑、Fire\
  \ TV、Amazon Echo、Alexa 语音助手、Just Walk Out 技术、Amazon Studios 以及`《气候宣言》`均由亚马逊开创。2020\
  \ 年，公司营收达 3860 亿美元。截至 2021 年第四季度，公司在全球拥有超过 140 万名员工。\n\n`卡拉`的职责涵盖多个环境与社会领域，包括`可再生能源`、能效提升、可持续交通、产品可持续性、循环经济与减废举措、社会责任与负责任采购、可持续发展科学与创新，以及环境合规。\n\
  \n在加入亚马逊之前，`卡拉`曾担任`可持续发展联盟`的首席执行官。她的先前经验还包括担任`BSR`副总裁，负责领导`BSR`在纽约和华盛顿特区的办公室，以及其与政府、多边组织和基金会的全球伙伴关系实践。`卡拉`还共同创立了电子行业公民联盟（现称为负责任商业联盟），并曾担任公私合营企业`OpenVoice`的执行董事，为`AOL`等公司开发早期青少年频道内容。\n\
  \n在她职业生涯的早期，她曾在儿童健康委员会工作，领导跨学科教育与发展项目；在都市研究所公共财政与住房部门担任研究主管；并曾在两位民选官员——前旧金山市市长威利·布朗和已故参议员丹尼尔·帕特里克·莫伊尼汉（纽约州民主党）的办公室工作过。\n\
  \n**克里萨·帕吉萨斯：** 卡拉，让我们先从亚马逊的可持续发展战略概述开始。这个战略是什么？其主要目标是什么？\n\n**卡拉·赫斯特：** 我们的战略源于希望成为客户眼中最可持续的选择。我们的可持续发展战略以`《气候宣言》`为核心，这是我们在\
  \ 2040 年前实现业务净零碳排放的承诺，比《巴黎协定》的目标提前了十年。通过这项承诺，亚马逊正在投资一系列大规模解决方案，以减少我们业务中的温室气体排放，其中一些方案能立即产生脱碳效果，另一些则需要更长时间才能获得回报。\n\
  \n这表明了我们应对气候变化的紧迫性，因为这不仅是我们自身的承诺，也是对任何希望加入我们伙伴关系的公司的邀请。我们希望能带动其他公司与我们一起做出这个承诺。截至\
  \ 2021 年第四季度，已有超过 200 家公司与我们共同承诺加入`《气候宣言》`，这真是太了不起了。签署方包括宝洁、Visa、百事可乐、威瑞森、西门子、微软、IBM、Salesforce\
  \ 等。合计起来，这些签署方在全球的年收入超过 1.8 万亿美元，在 21 个国家的 26 个行业中拥有超过 700 万名员工。\n\n**帕吉萨斯：** 如此多的全球性公司参与合作，确实表明了应对气候变化的重要性。亚马逊如何实现其气候宣言承诺？\n\
  \n**赫斯特：** 确实如此，我们正是通过与他人合作、分享信息、讨论我们正在进行的运营变革以及我们在自身规模上所做的努力，来推动变革并履行我们的承诺。\n\n\
  支撑我们气候宣言战略的几个关键点包括我们自身业务的转型，例如我们包裹配送车队的电动化。比如，我们向一家名为`Rivian`的电动汽车公司订购了 10 万辆电动送货车。这强有力地表明了我们如何看待电动汽车技术的潜力。我们还与全球各地的公司合作，如亚洲的`马恒达电动`和欧洲的`梅赛德斯-奔驰`，以采购更多电动送货车。我们不仅仅是说“我们希望这样做”，而是正在付诸行动。我们为这一承诺设定目标，然后立即着手工作。2020\
  \ 年，我们在北美和欧洲使用这些电动送货车向客户交付了超过 2000 万个包裹，并且在此过程中学到了很多。\n\n支撑我们实现`《气候宣言》`承诺的另一项举措是投资可再生能源。2019\
  \ 年，我们为自己设定了一个雄心勃勃的目标：到 2030 年，在全球运营中实现 100%使用可再生能源。这是一个很好的例子，说明了亚马逊如何“大胆思考”并“深入探究”实现这些宏大目标的运作过程。我们的可再生能源承诺的目标日期是\
  \ 2030 年，比我们 2040 年实现净零碳排放的目标早了十年，而 2040 年这个目标本身已经比《巴黎协定》的 2050 年目标早了十年。\n\n随着我们在全球部署这些项目，我们认为或许可以更快推进。现在我们已经公开表示，我们认为可以在\
  \ 2025 年实现这个目标——比最初设定的 2030 年目标提前五年。我们是全球最大的可再生能源企业采购商，目前已有 274 个可再生能源项目正在进行中。这包括\
  \ 105 个公用事业规模的风能和太阳能项目，以及分布在全球亚马逊设施和商店的 169 个太阳能屋顶项目。我们的可再生能源使用比例从 2019 年的 42%提升到了\
  \ 2020 年的 65%。我们在这些重大承诺和目标上行动迅速，其中还包括另一个 2030 年的中期目标，称为`Shipment Zero`，这是我们承诺到 2030\
  \ 年使亚马逊 50%的货运实现净零碳排放。\n\n2020 年，我们还启动了`《气候宣言》基金`，初始资金为 20 亿美元，旨在支持那些其产品和服务解决方案有助于向零碳经济转型的具有远见的公司。\n\
  \n**帕吉萨斯：** 亚马逊气候宣言承诺下还有哪些关键活动？\n\n**赫斯特：** 在从我们公司内部行动开始的同时，我们也持续在价值链之外进行重大投资，通过基于自然的解决方案大规模减少碳排放。为此，我们设立了一个名为`即刻气候基金`的\
  \ 1 亿美元基金，用于恢复和保护世界各地的森林、湿地和草原。这项工作的另一个例子是`通过加速森林融资降低排放 [LEAF] 联盟`，这是亚马逊推动的一项雄心勃勃的公私合作倡议。它旨在通过向致力于保护热带雨林的国家提供基于成果的融资，来加速气候行动。\n\
  \n我们还利用我们在`AWS`内的技术规模和体量，帮助推动气候变化与可持续发展研究。通过一个名为`亚马逊可持续发展数据倡议 [ASDI]`的计划，我们帮助世界各地的科学家和研究人员访问天气观测数据和卫星图像等数据集，将这些数据托管在`ASDI`的目录中，并通过`AWS`云提供服务。这些数据对所有人公开可用，并且已经帮助非洲的政府官员应对森林砍伐并评估森林火灾造成的损害。\n\
  \n我们也致力于确保支撑我们整个价值链的人们和社区得到基本的尊严和尊重。我们努力确保所提供产品和服务的生产过程尊重国际公认的人权。\n\n\n\n#### 访谈实录\n\
  \n归根结底，我们的战略是为客户和地球服务。我们将做出雄心勃勃的承诺，并以具体目标和紧急行动作为支撑。我们将分享如何实现这些目标、其中面临的挑战、我们的实施方式以及取得的进展。\n\
  \n**帕吉萨斯：** 亚马逊如何量化其脱碳目标的进展，并与利益相关方分享？\n\n**赫斯特：** 亚马逊发布年度可持续发展报告，详细介绍我们在推进《气候宣言》承诺的道路上持续脱碳的历程。实现这一目标首先要衡量我们的碳足迹，确定如何在业务的各个环节推动碳减排，并为我们的团队提供行动所需的工具、知识和资源。我们对未来低碳经济的愿景是：亚马逊的所有建筑完全由可再生能源供电，我们的车队使用可再生电力和其他零碳燃料，并且我们整个供应链中的间接排放源通过可再生能源、能效提升、可持续材料、碳封存及其他碳减排措施得以消除。\n\
  \n虽然我们仍处于业务脱碳的早期阶段，但我们高兴地看到在多个领域取得了有意义的进展。我们将继续快速扩大对碳减排解决方案的投资，这些方案将产生巨大且长期的影响，推动我们朝着\
  \ 2040 年实现净零碳排放的目标前进。\n\n**帕吉萨斯：** 客户告诉你们，他们对亚马逊在可持续发展方面有何期望？\n\n**赫斯特：** 我们非常专注于倾听客户的需求和期望，当然，这在世界各地有所不同。我们也有不同类型的客户。如果你与我们在\
  \ AWS 业务的同事交谈，他们的客户将是企业级客户——通常是我们合作的大企业，也包括初创公司。他们可能对基于云的数据中心与本地数据中心的能效比较感兴趣。\n\n\
  在零售方面，我们既有个人消费者，也有在 `Amazon.com` 上买卖的企业客户。2020 年 9 月，我们发起了一项名为 `Climate Pledge Friendly`（气候友好承诺）的倡议，让发现和购买更可持续的产品变得更容易。截至\
  \ 2021 年 11，已有超过 20 万种产品和 1 万多个品牌通过 `Climate Pledge Friendly` 计划在美容、健康、服装、电子产品、家居和食品杂货等领域上线。我们与值得信赖的第三方认证机构合作，以突出符合可持续发展标准、有助于保护自然世界的产品。\n\
  \n当我们开始研究如何将产品认定为 `Climate Pledge Friendly` 时，我们说：“我们不会自己介入并试图告诉客户什么是可持续的，因为已经有大量相关工作可资借鉴。”我们花了几年时间评估市场上现有的可持续产品认证，审查了约\
  \ 450 多种认证。截至 2021 年 11 月，我们与来自政府机构、非营利组织和独立实验室的 37 家外部认证机构建立了合作关系。我们对我们选择的产品认证一直保持非常高的标准。\n\
  \n我们还开发了自己的 `Compact by Design`（紧凑设计）认证，因为我们发现现有的认证系列中存在空白。要获得 `Compact by Design`\
  \ 认证，产品必须具有一流的“单位效率”。我们使用了产品属性，如商品包装尺寸、商品重量和单位数量。单位效率值越低，设计效率越高。例如，浓缩洗衣液比非浓缩洗衣液能用更小的体积和重量清洗同样数量的衣物。\n\
  \n第三方认证、验证和核查公司 `SCS Global` 对我们的决策框架、方法和标准进行了分析。他们为我们提供了作为可信认证机构的外部验证。`Compact\
  \ by Design` 是一项伟大的倡议，它识别出那些可能外观差异不大但设计效率高得多的产品。通过去除多余的空气和水，产品需要的包装更少，运输效率也更高。在规模化层面，这些产品尺寸和重量的微小差异带来了显著的碳排放减少。这项认证以及我们纳入该计划的其他第三方认证，旨在帮助保护自然世界，并且对于对可持续发展有很高标准的客户来说意义重大。\n\
  \n这些行动让我们的客户能够说：“我想购买 `Climate Pledge Friendly` 的产品。”这也让我们能够向消费品和消费电子行业的合作伙伴发出信号：我们的客户需要这些产品，我们将继续让他们轻松找到这些产品。这是一个很好的例子，展示了我们如何将基于科学视角所了解的知识，转化为客户易于理解的内容。\n\
  \n**帕吉萨斯：** 你从 `Climate Pledge Friendly` 计划中看到了哪些初步成果？\n\n**赫斯特：** 产品带有 `Climate\
  \ Pledge Friendly` 标签的品牌，其点击率和新品牌购买率都有所提高。购买后的客户研究显示，在认为该计划重要、改变购买行为以及重复购买行为方面，都释放出积极信号。\n\
  \n**帕吉萨斯：** 你们如何与亚马逊零售网站上的供应商和卖家合作？\n\n**赫斯特：** 正如我们在许多其他领域所做的那样，我们希望与供应商合作，分享我们所知。我们的包装工作就是一个很好的例子。十多年前，我们开发了\
  \ `Frustration-Free Packaging`（无挫包装），想想看，这是个很棒的说法。这是我们承认，作为客户，你想要的是你购买的商品，而不是它周围的所有其他东西。你希望快速拿到商品，同时环境影响最小化，因此包装是\
  \ 100%可回收的，没有翻盖式包装，也没有扎带。\n\n当我们意识到电子商务与实体店购物不同时，这是一个改变包装的机会。在商店里，你需要展示产品及其营销信息给消费者。例如，玩具需要直立放在货架上。它们需要有一定的尺寸来吸引注意力，并向消费者展示该产品的优点或特殊差异特性。由于实体零售环境，玩具可能还嵌有安全装置。当产品存放在实体店时，包装设计需要考虑很多因素。\n\
  \n进入电子商务环境后，所有这些基本都不需要了。你可以将所有细节，包括客户评价、视频等，都放在我们网站的产品页面上。你不需要为了安全而使用翻盖式包装，也不需要为了保持产品直立而使用扎带。你可以减少所有包装，这些包装在客户收到后就变成了废物，而只需将产品本身运送给客户。\n\
  \n这个例子为我们提供了巨大的机会，让我们以不同的方式思考可持续发展，并与我们的同行分享所学。我们在亚马逊的包装团队与国际安全运输协会共同制定了一个名为 `ISTA-6`\
  \ 的电商包装标准。然后，他们将其开源给全球零售商使用的所有包装实验室。我们在亚马逊投入了一些资源来解决这个问题，但能够分享这些经验并说“我们是开源贡献者。这对地球有好处。无论你是与亚马逊还是其他人进行电商活动，所有人都需要获得这些知识”，这一点非常重要。\n\
  \n\n\n**Pagitsas:** 除了包装改造和减少浪费，我们还想确保产品是安全的。对环境来说，最糟糕的事情是客户收到损坏的产品。这不仅会产生产品浪费，还会产生将损坏商品运回供应商的逆向物流，以及制造和运送替换产品。我们希望产品能够包装完好、无损地送达消费者手中。因此，我们也会识别那些可以直接使用产品原包装发货的机会，即那些不需要亚马逊外箱的产品。如果你在亚马逊上购买一箱纸巾或尿布，你不需要我们在外面再套一个箱子。它们通常不是礼品。\n\
  \n**Pagitsas：** 这种运输流程的改变带来了什么影响？\n\n**Hurst：** 自 2015 年以来，我们已将每件货物的外包装重量减少了 36%，相当于减少了\
  \ 100 万吨包装材料，也就是超过 20 亿个运输箱。这是一个巨大的机会，让我们思考客户如何以不同方式购物，以及我们如何改造运营以减少浪费。当你重新思考客户体验时，你可以创造出极具价值的可持续解决方案。\n\
  \n**Pagitsas：** 听起来，卖家是开发和执行可持续解决方案的重要合作伙伴。是否有卖家对包含可持续性的现有业务流程变更提出异议？他们的顾虑是什么？\n\
  \n**Hurst：** 关于“反对”的问题问得很好。我对此的看法基于我领导团队的方式，即我敦促我的团队欢迎所有观点。我们希望保持开放和透明，我们希望听到人们在实施可持续发展时遇到的挑战。我们非常认真地对待这些担忧和挑战，但我们会进一步分解它们，以了解其背后的原因。当你这样做时，这就不会变成亚马逊对供应商说“我希望你更可持续”这种正面对抗。而是与供应商进行对话，询问“您的顾虑是什么？”\n\
  \n通常，当我们听到顾虑时，它们主要集中在几个方面。对可持续发展举措存在一些看法，例如它们可能会拖慢你的业务，或者实施可持续发展举措的成本可能更高。还有一些看法认为，一些客户可能想要这种改变，但其他客户可能不想要，因此了解不同客户群体的需求就变得很重要。\n\
  \n**Pagitsas：** 对于反对或批评，亚马逊是否有某种指导公司的理念或方法？\n\n**Hurst：** 我们欢迎批评。我们刚发布了一项新的领导力准则，我认为它完美地概括了这一点——成功和规模带来广泛责任。这一准则承认我们规模很大，我们对世界有影响，而且我们远非完美。我们理解我们在社区和地球中扮演的角色。我们努力做得更好，学习更多，并每天持续改进。\n\
  \n批评者向我们提供了信息，告诉我们他们需要听到什么，这通常更多地是关于我们如何执行战略。那些执行活动是什么，而不仅仅是公司设定的目标或做出的承诺？事情是如何发生的？我认为，鉴于我们的规模，我们有责任让事物变得比我们发现它们时更好。在内部，我们欢迎亚马逊面临的挑战。我们有围绕这一概念的领导力准则，我们称之为“深入探究”和“发明与简化”。我们欢迎对我们自身工作的审视。\n\
  \n另一个指导我们在亚马逊运作的机制是制定工作信条，其中包含“除非你知道更好的办法”选项。这是一种独特的运作方式。当我向另一个团队介绍我们的工作时，我会在文档中包含“除非你知道更好的办法”，因为我们总能持续改进。我们可以继续整合更多科学。我们可以继续了解我们的客户。这绝对是我们将如何做到这一切的一部分。\n\
  \n**Pagitsas：** 气候变化是一个大问题，每个人都在自己的旅程中去理解它是什么以及它如何影响他们。你和你的团队如何与正处于起步阶段的伙伴互动？\n\n\
  **Hurst：** 人们在可持续发展方面有一个学习曲线，并对此有许多疑问。现在，人们甚至在自家餐桌上讨论气候变化。这是一个巨大的变化。例如，他们会在可能经历气候相关事件的社区中听到气候变化。由于气候变化，野火和洪水事件变得更加频繁和剧烈。人们感受到气候变化的影响因其生活和工作地点的不同而不同。\n\
  \n我们的角色是帮助翻译气候变化问题，并帮助回答诸如“我能做什么？这对我、我的业务、我的产品和服务意味着什么？”之类的问题。我们想知道如何帮助卖家和客户以科学依据的信息克服这些合理的担忧。向更可持续实践转型的业务绝对是一种竞争优势。这是世界发展的方向，我们希望每个人都参与其中。是的，这是因为我们想应对气候变化，但坦率地说，在这一点上，如果我们的供应商和客户不理解它，那将是一个劣势。\n\
  \n**Pagitsas：** 关于亚马逊面临的可持续发展挑战，你个人秉持什么理念？\n\n**Hurst：** 我坚定不移地乐观认为我们能够做到这一点。这需要巨大的奉献精神、勇气，以及倾听我们需要如何改变的能力。这包括所有声音。这都是我们如何共同努力的一部分。不理解对方的立场，不吸引广泛的利益相关者参与，就永远不可能建立伙伴关系。这会让你的工作更出色。这会使我们成为更好的公司，我们接受并理解这一责任。\n\
  \n**Pagitsas：** 你的职业经历如何塑造了你的乐观看法，并影响了你在亚马逊领导可持续发展工作？\n\n**Hurst：** 我在可持续发展领域工作了二十多年，快三十年了。我感觉自己与这个领域共同成长，并以广泛的视角参与其中。从与旧金山市长和美国参议员共事，我看到了不同私营部门之间的互动，以及公私合作伙伴关系对可持续发展的成功至关重要。从我的许多角色中，我看到了公共部门可以制定有影响力的政策，以及私营部门、非营利组织和多边资源如何能够大规模地产生影响。\n\
  \n在我的职业生涯中，我目睹了可持续发展从一项合规活动演变为公共和私营部门的巨大增值点。我看到了企业如何利用其规模来影响我们面临的重要社会-环境问题的解决方案。在进入私营部门之前，我曾在多个影响政策的职位上工作过。我曾在`BSR`工作，并领导过跨不同行业的项目，这让我对各行各业如何处理可持续发展问题有了很好的视角。在`BSR`之后，我担任了一家基于科学的组织——可持续发展联盟的`CEO`，关注产品层面的可持续性。\n\
  \n\n\n#### 通过合作与创新应对气候危机\n\n当我加入亚马逊时，这是一个绝佳的机会，可以将我过往的所有经验付诸实践，并对气候危机产生重大影响。鉴于亚马逊业务所涉及的行业以及我们运营的规模，我们可以通过践行《气候宣言》来引领变革，推动我们的业务乃至整个价值链向更环保、更具社会责任的方向转型。\n\
  \n**帕吉塔斯：** 为什么公私合作伙伴关系是亚马逊和其他公司应对气候变化的有力工具？\n\n**赫斯特：** 没有人能独自解决气候危机。这需要跨领域的合作，我们每个人都应贡献解决方案，并放大他人的成果。我们在气候变化问题上没有太多时间了。能够参与公共和私营部门的对话，对亚马逊来说至关重要，因为我们可以与他人合作，共享信息和观点。这是实现目标的关键部分。\n\
  \n如果你思考我们在亚马逊所做的事情，就会发现我们在所有工作中都以科学为引领。我们示范了一家公司在气候变化问题上如何利用现有最权威的科学——无论是来自政府间气候变化专门委员会的最新报告，还是对气候变化将如何影响客户生活的世界以及我们业务的预测——并确定我们需要如何进行业务转型。\n\
  \n然而，我们需要一个有利的政策环境来支持转型。我们需要技术解决方案来推动转型。我们需要不同的合作伙伴提供帮助。例如，这些合作伙伴可能是非政府组织，它们能提供关于该问题如何影响其社区的信息。也可能是地方、州或联邦层面的政府机构，它们考虑创建有利的政策环境来激励行业转型。合作伙伴还可能是一家初创企业，它说：\"\
  我们有一个技术解决方案，需要你下注，让我们将其规模化。\" 非政府组织、政府和企业构成的整个生态系统需要携手合作，才能取得成功。\n\n**帕吉塔斯：** 2021\
  \ 年 11 月的联合国气候变化框架公约缔约方大会是公私合作伙伴关系的重要全球舞台。请谈谈亚马逊在缔约方大会上的宣布。\n\n**赫斯特：** 公私合作伙伴关系的一个绝佳例子是\
  \ LEAF 联盟。我们正在联合其他企业，倡导建立一个非常可信的自愿碳市场。为紧急应对气候变化，所需的解决方案需要全球各国政府采取行动。与挪威、英国和美国政府一道，亚马逊及其他领先企业通过预先承诺购买来自应对世界上最关键问题之一——减少热带森林砍伐——的国家的经核实的减排量，来加速气候行动。在缔约方大会期间，LEAF\
  \ 联盟宣布，在其最初启动仅六个月后，已筹集了 10 亿美元用于保护全球雨林。我们还必须认识到非政府组织、原住民群体和当地社区在管理和保护世界森林方面的关键作用。我们必须倾听他们的声音。通过\
  \ LEAF 联盟，多个部门正在共同解决一个极其复杂的问题。\n\n在缔约方大会上，我们还帮助启动了\"先行者联盟\"——这是由美国国务院（通过气候问题总统特使约翰·克里）和世界经济论坛共同建立的一个公私合作伙伴关系。它与领先的气候专家和志同道合的组织合作，通过全球企业的购买力加速并扩大集体影响力——目标是在历史上高排放且难以减排的行业实现减排，包括航空、海运、钢铁和卡车运输。与短途配送可用的绿色技术不同，长途运输可用的低碳技术很少。\n\
  \n这种全球性的跨部门伙伴关系发出了一个明确的需求信号，以扩大那些对世界经济向净零碳排放转型至关重要的新兴技术的规模。作为联盟成员，亚马逊将继续在货运、航空和海运领域探索、测试和投资可持续创新，以减少我们最长运输路线上的排放。我们专注于在未来十年内将合适的技术推向商业规模，这非常符合我们对《气候宣言》的承诺。\n\
  \n\"先行者联盟\"是对最近宣布的\"零排放船舶货主联盟\"工作的补充。这是一个旨在加速航运脱碳行动的新合作网络。亚马逊是《阿斯彭研究所》推动的 2040 年愿景声明的首批签署方之一。\n\
  \n另一个例子是最近宣布在\"可持续航空买家联盟\"中新增\"飞行员集团\"。该集团由亚马逊航空和其他美国顶级航空公司共同创立，汇集了航空领域致力于通过投资高完整性可持续航空燃料来减少其航空运输排放的组织。我们需要增加产量、降低价格，并持续进行低碳燃料的技术创新，才能实现该行业的关键减排。\n\
  \n同样，我们也专注于推动企业可再生能源采购在更多国家更快地扩大规模，以支持新的投资和项目。我们帮助发起了美国国务院的\"清洁能源需求倡议\"，以鼓励世界各地提高企业可再生能源选择的可获得性和可负担性。\n\
  \n**帕吉塔斯：** 许多公司正在创新解决方案以应对气候变化，但它们常常在获取资本和将解决方案商业化规模化方面遇到困难。亚马逊是如何帮助扩大新解决方案的？\n\
  \n**赫斯特：** 我们通过多种方式合作支持初创技术。除了我们的《气候宣言》，我们还启动了\"气候宣言基金\"，初始资金为 20 亿美元，用于投资处于不同发展阶段的公司——从早期技术到后期开发的技术——以及涵盖多个不同行业的公司，从食品和农业到可再生能源发电、存储利用、制造材料、运输物流和材料的循环利用。我们投资的公司都非常出色。有些公司处于非常早期的发展阶段，正在研究实验性技术。我们会介入并说：\"\
  我们认为这是一个有助于亚马逊自身运营脱碳的解决方案。我们想要押注于推广这个解决方案或技术。\"\n\n早期解决方案的一个例子是 CarbonCure Technologies，它实现了低碳混凝土的商业化。在\
  \ CarbonCure 的工艺中，回收的二氧化碳被注入到新鲜混凝土中。我们可以将这种产品用于新的建筑中。我们正在用它来建设我们在弗吉尼亚州的第二总部。\n\n\
  \n\n我们也在通过 Infinium 投资电动燃料解决方案。该公司专注于将二氧化碳和氢气原料转化为净零碳燃料，用于当今的航空运输、海运和重型卡车车队。我们投资了\
  \ Turntide Technologies，该公司开发高效电机技术，可减少建筑中供暖、通风和空调消耗的能源。我们正在自己的建筑中应用这些技术，并评估其部署效果。我们会问自己这样的问题：“电力消耗是否显著减少了？”以及“我们如何帮助他们继续打造更好的产品？”我们还投资了名为\
  \ ZeroAvia 的公司，该公司是零排放航空领域的领导者，专注于开发氢电航空解决方案。\n\n我们不仅关注作为一家公司需要什么来使自身运营脱碳以及什么对他人有益，还在自己公司内部测试、试用和利用这些类型的方案，并提供反馈和信息。这是一个有趣的过程，去寻找我们认为可能产生重大影响的东西。我们不仅投入资金来帮助其规模化，还拥有全球性的大型运营，能够及早应用这些技术，并观察其成果。\n\
  \n**Pagitsas：** 亚马逊的可持续发展范围相当广泛，团队中有许多经验丰富的人士，并为项目和投资提供了大量资金。对于一位正在启动公司可持续发展战略、可能没有相同资源或支持的新任首席可持续发展官（CSO），你会给出什么领导力建议？\n\
  \n**Hurst：** 我的首要建议是保持开放和透明。做一个所有最佳想法的寻求者。深入理解你所处的业务以及同行面临的挑战，并找出可持续发展能为业务提供解决方案的地方。无论你身处何种业务领域，都要开始成为它的合作伙伴。\n\
  \n七年前我刚加入亚马逊时，公司拥有零售业务、云计算业务、工作室业务、自有品牌产品以及大型的配送和物流运营。我需要了解负责某个运营中心的人的需求。他们的痛点是什么？可持续发展如何帮助解决其中的一些问题？\n\
  \n以 AWS 为例，我们如何帮助客户了解迁移到云端的能效提升有多大？我们的 Amazon Studios 和 Prime Video 业务提供了一个机会，通过内容创作，向观看我们电影和电视剧的客户传达可持续发展理念。解决可持续发展问题的方法有很多种。这一切都始于了解你的业务以及实施可持续发展的机会。\n\
  \n此外，要立刻行动起来，并对转型、调整和发展你的想法保持开放态度，当你的同事反馈说“这个有效，这个不起作用，我们看到了什么，我们学到了什么”时。在亚马逊，我们痴迷于客户，所以这是一个值得发扬的伟大领导原则。我对团队传达的信息是：“所有那些内部合作伙伴、同行、业务负责人都是我们的客户。我们需要完全理解他们的需求，”然后从那里开始，在可持续发展方面为业务提供一些早期成果。让业务负责人听到“通过一些可持续发展举措，我们可以削减成本、节省时间并提供更好的客户体验”这一点至关重要。这种方法有助于业务负责人看到可持续发展如何在亚马逊及其自身业务中发展壮大。引入业务和客户重心是开启这一切的最佳方式。\n\
  \n**Pagitsas：** “一开始行动”是否意味着从第一天起公司内部所有人都支持？\n\n**Hurst：** 我认为，你并不一定需要每个人都支持。在亚马逊，我非常幸运，因为我们的高层领导了解可持续发展及其对我们客户和业务的重要性。我一开始就拥有了这种支持。然而，在任何一天，我们的业务负责人都有许多事情需要考虑。\n\
  \n**Pagitsas：** 在亚马逊，业务负责人的工作中有哪些相互冲突的责任或目标？\n\n**Hurst：** 首先也是最重要的，是我们自己员工以及为亚马逊工作、与亚马逊合作的所有人以及我们社区中任何人的安全。其次，我们需要关注产品的成本、质量和持续性。在任何时候，业务负责人的议程上都有许多不同的事情。然而，我希望可持续发展也能在优先事项列表中占据一席之地。我希望它成为任何业务决策中都会考虑的一个因素。它可能并不总是列表的顶部，也可能不是驱动决策的头号因素，但它应该是一个考量因素。\n\
  \n**Pagitsas：** 你如何影响你的同行，让他们至少评估一个业务决策的可持续性因素？\n\n**Hurst：** 在亚马逊，我们需要向人们提供信息和数据。我们需要能够告诉他们所做决策的可持续发展影响，以便他们在权衡取舍时将其纳入考量。\n\
  \n有时，我们做出有利于可持续发展的权衡，这也能带来出色的客户成果并实现成本节约；或者，这可能会增加成本，而我们决定花更多的钱而不是更少。拥有信息来了解你所做决策的可持续发展影响，并将其纳入商业案例分析，这一点至关重要。这样，它就融入了业务决策过程，这对于与业务部门合作实现可持续发展目标至关重要。\n\
  \n**Pagitsas：** 在与业务负责人合作时，你是否有一个关键问题会问自己和你的团队？\n\n**Hurst：** 是的。那就是：“我如何允许、赋能并鼓励我们所有的业务负责人，在他们继续为客户提供出色产品和服务的同时，思考可持续发展问题？”\n\
  \n**Pagitsas：** 我的理解是，你是在赋能业务负责人推动并做出正确的可持续发展决策，但有时，你可能无法得到所有期望的可持续成果。\n\n**Hurst：**\
  \ 是的。这是一种现实的看待方式。这是务实的，但我也认为，这是因为当人们能够做出更好、更可持续的决策时，他们愿意这样做。他们希望理解围绕可持续发展的数据。我与对可持续发展高度感兴趣、有动力且充满热情的人一起工作，所以我想向他们提供信息，以便他们做出更可持续的决策。如果他们没有数据，他们在那一刻就无法做到这一点。\n\
  \n关于这个方法的另一个关键点是，亚马逊是一家庞大而复杂的公司。我的中央可持续发展团队不可能与每个业务负责人讨论每一个业务决策。我们推动可持续发展方法论和科学驱动的决策治理，并推动大量数据。然而，我们不可能出现在每一个做出业务决策的会议中。\n\
  \n**Pagitsas：** 这一点对于大型公司的可持续发展领导者来说尤其重要，因为业务负责人的数量将远超可持续发展团队的人员数量。\n\n**Hurst：**\
  \ 是的，绝对正确。我们必须能够建立一个系统，将可持续发展原则以及一种能够随着业务增长而执行这些原则的机制融入其中。这是成功实现可持续发展的关键。我希望我们团队的最终目标是，将可持续发展思维如此深入地嵌入公司，以至于它成为我们一切工作的内在组成部分。\n\
  \n\n\n#### 排版后的内容\n\n令我感到振奋的是，我们似乎正处在一个新时代，商业领袖们纷纷表示：“我们明白必须做出承诺。我们愿意勇敢地兑现这一承诺。虽然我们尚未完全清楚实现目标的路径，但我们将开始投资新技术，开始思考如何从内部改进算法，以优化运营方式并推动重大变革。”这些改变对大多数人来说或许不那么显眼，但影响却极为深远，因为我们如今拥有了数据来明确变革方向，并分享我们的经验。当你想到未来几十年里，那成百上千家致力于此的公司时，我们合作伙伴关系的影响力将加速显现。\n\
  \n**帕吉萨斯：** 我同意你关于可持续性责任分散化以及信任员工平衡可持续性与商业目标重要性的观点。最后，在你引领可持续发展的领导方法中，还有哪些核心理念？\n\
  \n**赫斯特：** 还有几点需要补充。首先，我绝对希望最好的想法能自由涌入可持续发展领域。我希望最优秀的人才能够自由加入我们的团队，同时也希望将这些人才输送到亚马逊的所有其他团队。\n\
  \n其次，确保我的团队拥有非常多元化的视角和观点至关重要。我热衷于围绕可持续发展展开健康的辩论。当我们能够鼓励这种辩论、积极参与其中，并且有人能够改变我的想法时，这会让我们的团队和公司变得更强大。\n\
  \n第三，为公司严格而不懈地优先排序可持续性解决方案，是我们团队带来的核心优势之一。考虑到我们的业务范围和复杂的业务构成，我们需要持续聚焦于那些能为亚马逊应对全球可持续发展挑战所能撬动的最大杠杆。\n\
  \n最后，我希望与我共事的所有领导者都能认同，我在职业和个人层面都信任并尊重他们，支持他们整合工作和生活中需要完成的一切事务。这是一个充满挑战的领域，人们为可持续发展投入了极大的热情。我们需要这种热情，我也希望他们能在亚马逊拥有长久而成功的职业生涯。作为领导者，我重视人们平衡与整合生活与工作，并展现真实自我的能力。这能让我们在这个领域的所有工作都更上一层楼。\n\
  \n### 9. 史蒂夫·瓦利\n\n安永全球可持续发展副主席\n\n*史蒂夫·瓦利是安永全球可持续发展副主席。安永是一家全球性专业服务机构，在全球拥有超过 312,000\
  \ 名员工，截至 2021 年 6 月的财年营收为 400 亿美元。史蒂夫负责领导安永全球的* *气候变化* *和可持续发展战略，帮助客户从可持续发展中创造商业价值，并加速他们向低碳未来的转型。史蒂夫是\
  \ S30 的共同创始主席，该组织由来自全球一些领先企业的 30 多位首席可持续发展官组成。该组织于 2020 年启动，是威尔士亲王殿下可持续市场倡议的一部分。*\n\
  \n*史蒂夫此前曾担任安永英国及爱尔兰区域管理合伙人和安永英国主席。他于 2005 年加入安永，拥有近 30 年的客户和咨询业务经验，涉及制药、石油和天然气以及公共*\
  \ *服务* *等多个行业。*\n\n*史蒂夫曾是英国首相戴维·卡梅伦和特蕾莎·梅的首相商业咨询小组成员，也曾担任英国政府专业服务行业的商业大使。他是社会商业信托基金的创始成员、英国国际商会理事会成员、大英博物馆主席咨询小组以及生产力领导小组的英国成员。他在拉夫堡大学获得工程学学士学位，目前担任该校董事会成员。*\n\
  \n**克里西萨·帕吉萨斯：** 史蒂夫，在谈及安永的可持续发展战略及其与客户的合作之前，我们先聊聊你的职业生涯。你是如何一步步成为安永的可持续发展负责人的？\n\
  \n**史蒂夫·瓦利：** 我于 2020 年 7 月 1 日开始担任这一职务，成为安永首位全球可持续发展副主席，直接向我们的全球董事长兼首席执行官卡迈恩·迪·西比奥汇报。这是安永首次设立这个职位。设立该职位是响应客户显著需求、我们自身员工的兴趣，以及认识到如果我们能将思考制度化并将责任赋予一位高级领导者，安永可以做得更多。\n\
  \n在我担任全球可持续发展副主席之前，我曾领导安永在英国和爱尔兰的业务长达九年。作为一名战略顾问，我希望自己能帮助客户解决他们最复杂的问题。这正是我为自己设定的目标。我的学位和培训背景是工程师，而非会计师或审计师。\n\
  \n**帕吉萨斯：** 而且也不是环境工程师，对吗？\n\n**瓦利：** 对，我的学位是土木与结构工程。我的特定技能组合围绕业务增长、解决复杂问题以及从这两者中驱动价值。正如你所说，我不是可持续发展专家，但我身边有很多专家，我相信，我们在一起可以产生巨大的影响力。\n\
  \n我目前工作的一部分是，在利益相关者面前，将商业作为一股强大的积极力量带入可持续发展议程，以便我们能够共同创造财务价值，并为社会和地球创造价值。我认为这就是我能带来的——一个商业视角。我会问我的团队：“你如何实现增长？如何创造价值？如何解决问题？”在可持续发展同事以及安永其他团队（如鉴证、税务和公司金融部门）的帮助下，我希望作为安永在这一领域的首位全球副主席，能够产生重大影响。\n\
  \n**帕吉萨斯：** 安永对可持续发展的关注是如何强化的，以及你作为全球可持续发展副主席的新角色是如何产生的？\n\n**瓦利：** 问得好。2018 年，安永开始更新其全球战略，即众所周知的“下一波浪潮”。我参与了制定“下一波浪潮”的工作组。正如你可能想象到的，我们在世界各地——伦敦、纽约和其他地方——举办了研讨会，以制定这一新的全球战略，推动我们向前发展。\n\
  \n\n\n**Pagitsas:** 似乎安永的增长战略，如 `NextWave` 战略所述，与可持续发展紧密相连。\n\n**Varley:** 是的，确实如此。我之所以坚信这是正确的做法，是因为当我们在工作组中讨论可持续发展的力量时，我看到了我的合伙人同僚们对此充满热情。对合伙人而言，可持续发展将帮助我们提升到新的水平，更好地协助客户取得成功，并帮助安永在全球范围内实现其“建设更美好的商业世界”的宗旨。这一点至关重要，因为安永拥有巨大的机会与客户合作，共同创造更可持续的未来，我们超过\
  \ 30 万名员工也可以为此做出贡献。当我们向员工分享 `NextWave` 战略的初步构想时，我也看到他们的热情高涨。\n\n当我向客户提出这个想法时，我看到他们积极参与并表达他们正在（或希望）为自己的组织做同样的事情。我得到了许多验证，我认为这在任何新旅程中都至关重要。如今，客户这样做的驱动力已超越了道德和伦理层面的“行善”。最进步的客户正在将可持续发展融入其战略，并利用它为包括地球、员工和投资者在内的多方利益相关者创造增长和价值。\n\
  \n**Pagitsas:** 您和您的团队是如何界定安永自身气候战略边界的？\n\n**Varley:** 作为可持续发展团队，我们与最高治理机构——全球执行委员会合作，首先反思了可持续发展与\
  \ `ESG` 的定义。我们回顾了联合国十七项可持续发展目标（`SDGs`）这一伟大基础。我们对照这十七项目标，审视了我们自然在做的事情，然后思考了哪些领域我们可以做出更多贡献。虽然我们与许多目标都有关联并能发挥作用，但让我们感到充满活力且对客户而言日益重要的一项，是联合国\
  \ `SDGs` 的第十三个目标：气候行动。\n\n随后，我们问自己：“气候行动的领导力是什么样子的？”我们研究了专业服务领域的同行，研究了世界领先公司的目标、叙事方式，以及我们如何与他们的宗旨建立联系。\n\
  \n**Pagitsas:** 安永为实现联合国 `SDG` 气候行动目标做出了哪些公开承诺？\n\n**Varley:** 碳雄心承诺于 2021 年 1 月\
  \ 25 日启动。我们的首要目标是实现碳负排放，并通过清除比我们排放更多的碳来保持这一状态。我们的近期目标是到 2025 年实现净零排放，即以 2019 年为基准，将绝对排放量减少\
  \ 40%。为了确保我们的预测路径正确，我们与享有盛誉的“科学碳目标倡议”（`SBTi`）组织在几个月前进行了良好对话，并让该组织认证了我们所有的数据。\n\n\
  我们有一个七点执行计划来实现这一雄心。这七点重点聚焦于我们自身的运营，例如转向 100% 可再生能源和减少航空旅行，以及与我们供应商合作，帮助他们减少自身排放。由于我们是一个业务简单的公司，我们能够——也应该——实现碳负排放。我们简单是因为我们不生产任何产品，也没有复杂的业务运营。我们是一家由技术驱动的人员型企业。我们充分认识到，许多其他企业，尤其是在工业领域，要复杂得多。与安永相比，这些企业需要核算其制造设施或外部供应链中排放的温室气体。\n\
  \n尽管如此，我们仍希望越来越多能够实现碳负排放的企业都能做到这一点。我们希望这将创造企业与社会的更积极联系，因为社会越来越认识到我们希望成为应对全球变暖解决方案的一部分。\n\
  \n**Pagitsas:** 您如何将可持续发展融入安永内部以及为客户提供的业务实践中？\n\n**Varley:** 这是我最喜欢讨论的话题之一。你如何让组织发生变革？或者，你如何帮助组织实现向好的变革？我对客户说：“我们很多人都知道如何让公司变革。但是，你是否有一种方法能够一次又一次地创造有目的的变革，并且最终对人和地球都有益的变革？”因为并非所有变革都是好的。\n\
  \n我们问自己：“安永如何在这一议程上创造有目的的、积极的变革？”有很多方法可以实现，但我们最大的杠杆是我们的文化。在文化上，安永人天生就是为了解决客户的问题。我们还发现，将信息反馈回组织，并分享那些希望在这些议程上获得帮助的客户故事，具有巨大价值。我们在过去\
  \ 18 个月里采取的方法之一是，邀请我们的领先客户进入组织，分享他们在环境和社会议程方面需要帮助的故事。\n\n随后，安永解决问题的基因就被激活了。如果你创造其他激励因素，你往往会发现组织开始以一系列解决方案来回应这些客户的问题、机遇和挑战。然后，我们与一些客户一起试点和测试这些解决方案。当解决方案准备好后，我们将其工业化。这就是让良性的变革在安永一次又一次发生的方式之一。这当然不止于此，但如果这一点做不好，事情就会变得更具挑战性。\n\
  \n**Pagitsas:** 安永提供哪些服务来支持各行业客户的可持续发展战略？\n\n**Varley:** 首先，毫无疑问，气候议程给许多公司带来了巨大的监管报告负担。可持续发展或环境、社会和治理（`ESG`）报告即将出现爆炸式增长，不仅来自欧盟的《企业可持续发展报告指令》（`CSRD`），也来自美国证券交易委员会（`SEC`）以及日本和中国等主要国家。报告义务将大幅增加。安永在鉴证、审计和报告方面拥有悠久传统。支持客户的报告需求是我们提供的关键解决方案之一。\n\
  \n过去几年中，我们在此议程上所做的其他工作包括帮助客户识别或拓展商业机会。例如，我们在帮助客户探索并随后投资可再生能源方面业务良好。我们帮助一些大型工业企业投资业务部门，在美国东北海岸和欧洲沿海建设风能。\n\
  \n\n\n我们帮助企业组建合资企业、编制商业案例、确保融资并应对各类监管障碍。我们协助他们采购组件，并构建新的合资企业组织结构，以管理处于极为恶劣环境条件下的风电场——这些风电场有时位于主要市场海岸线数百英里之外。我们帮助企业创建诸如绿色债券之类的金融工具，以资助其自身的转型。`绿色债券`是一种固定收益债务工具，与政府、超国家组织和公司发行的其他债券相同。但与普通债券不同，其募集资金专门用于资助环境和气候项目。我们帮助银行梳理其贷款账目，了解其投资组合中的融资排放，并协助银行与客户沟通，探讨如何减少其温室气体足迹。\n\
  \n我前面提到了许多司法管辖区即将出台的法规。除了二氧化碳之外，各种税收也在增加。中国刚刚建立了全球最大的排放交易体系。欧盟拥有一个相当成熟的碳交易排放体系。英国在脱欧后也建立起了自己的体系。在欧盟内部，关于碳边境调节税及其影响存在广泛的争论。除了碳税和气候税，全球许多国家现在还对塑料征税。我们帮助客户确保他们理解并遵守这些国家关于塑料税的法律。\n\
  \n此外，我们帮助企业在供应链以及制造工厂选址方面做出决策。我们还帮助钢铁制造商等大型工业企业，从更务实的层面探索如何通过新技术实现业务脱碳。这可能包括探索氢气作为热源的潜力，以及如何获取更多可再生电力。\n\
  \n我们正在帮助多位客户探索其物流和运输业务长期脱碳的可能性。这可能通过转向电动汽车或氢能汽车，或两者兼顾来实现。这些项目生成的商业案例需要数亿美元的资金支持，以及我们预计至少需要五年的变革管理计划，因为电动汽车或氢能汽车的供应侧仍处于非常初期的阶段。客户对这些重大变革项目的规划周期往往非常长远。我们正在帮助客户，特别是大型工业企业，思考碳捕集、利用与封存等新兴技术可以发挥什么作用。在为企业客户提供咨询的同时，我们也在为政府提供建议，探讨如何创建鼓励这些技术的监管和激励框架。\n\
  \n最后，或许安永能够帮助所有客户的最大领域，是在可持续发展战略之外补充一项变革管理战略。一旦设定了目标，他们如何让组织朝着好的方向变革以实现这些目标？安永与客户合作推动变革实现时，最能发挥我们的价值。这是我们工作的一个重要组成部分，包括我们率先开展的一些有趣工作，运用了诺贝尔奖得主理查德·塞勒的“助推理论”。他在其著作\
  \ *《助推：如何做出有关健康、财富与幸福的最佳决策》*（作者：理查德·H·塞勒和卡斯·R·桑斯坦，企鹅图书，2009 年）中写道，对生态系统进行微小的调整如何能够改变行为，从而产生巨大的积极成果。这是一段引人入胜的历程。\n\
  \n**帕吉萨斯：** 显然，首席可持续发展官既要领导变革管理工作，也要通过公司的核心业务服务、产品和成果来实现环境和社会效益。能否举一个正在应对重大变革的行业例子？\n\
  \n**瓦利：** 我们的银行客户以及整个银行业在为主要排放企业的转型提供融资方面面临挑战。银行希望它们的客户（通常是大型工业和采掘业企业）在利用融资等银行服务的同时，能够逐步减少温室气体排放。我们帮助银行客户解决如何做到这一点的问题。他们如何做到既要有“胡萝卜”（激励）又要有“大棒”（约束）？他们如何培训员工，以定位可能是一整套全新的产品、绿色债券和其他金融工具？\n\
  \n这些都是需要解决的巨大变革管理问题，尤其是在银行正试图厘清其融资交易产生的排放范围之际。许多银行开始认识到，为从黑色到棕色再到绿色产业的转型提供融资的艰巨性——既要支持经济持续增长，又要为这些企业业务的巨大转向或蜕变提供所需的金融资本。\n\
  \n**帕吉萨斯：** 除了变革管理，另一个主题似乎是客户需要深入挖掘供应链，并预期需要更长的周期来创造变革。更广泛的商业界是否正在经历更大规模的系统性变革？\n\
  \n**瓦利：** 是的。我认为在商业如何定义和创造长期价值方面，存在着一种潜在的转变。那些按天、按周、按季度运营业务的组织内部，在应对气候变化的背景下，紧张局势更为加剧。除非我们采取长远的眼光，否则我们无法交付一个可持续发展的地球或可持续发展的企业，因为我们需要做出惠及下一代的改变，但坦率地说，今天许多商业领袖在其职业生涯中可能无法亲身经历这些改变。\n\
  \n**帕吉萨斯：** 我们在这里讨论的“价值”的定义，指的是企业是否在创造财务价值的同时，也在创造环境和社会价值方面发挥作用。史蒂夫，你的客户还会被问到这个问题吗？如果是的话，你如何回应，或者你如何帮助他们回应？关于可持续发展，真正应该被问及的问题是什么？\n\
  \n**瓦利：** 我认为关于价值与可持续发展之间的联系，仍然存在着良好而健康的辩论。在我看来，这是一个良性循环：如果你能从可持续发展中创造更多价值，你就被迫变得更加可持续，进而能够创造更多价值。这是一种看待局面的乐观方式，但我发现这种方式能打开一些人的思路，让他们探索自己的企业在这个议题上能做什么。其中确实存在价值。然而，有时确实需要付出更多努力才能找到或发掘出这种价值。\n\
  \n这还需要稍微重新思考一下你为谁创造价值。许多人引用米尔顿·弗里德曼的话：“企业的唯一使命就是经营。”我在一些媒体采访中对此进行了发挥，我说：“企业的使命*不止于*经营。”我们能贡献的比经营本身更多，这会将对话引向更深层次。如果企业的使命不止于经营，那就意味着你对社会有影响。你对地球有影响。\n\
  \n我认为资本主义有很多缺陷。然而，温斯顿·丘吉尔在谈到民主时说过：“有人说，民主是最糟糕的政府形式——除了所有那些时不时被尝试过的其他形式之外。”同样，我相信资本主义并非一个完美的体系。但是，当由拥有正确价值观的人在其周围建立正确的框架来恰当地运用它时，它可以成为推动积极变革的强大力量。然而，有时它也可能极具破坏性。\n\
  \n\n\n#### 排版后的文本\n\n然而，如果我们能够驾驭资本主义的力量——这种力量关乎创造价值；如果我们能让关注的焦点不仅限于财务价值，也涵盖社会、人类和地球；如果我们能实现这一点，进而为可持续发展创造价值，形成良性循环，那么我们就能调动起现代资本主义这一股强大的向善力量。这构成了`EY`内部许多核心理念的基础。我们正努力帮助客户创造一系列\"\
  价值\"，其中可能包括财务价值、地球价值或社会价值。我认为，其中的语言是相通的。\n\n我持乐观态度：从长远来看，如果你为地球和社会做出贡献，财务价值是能够并且确实会随之而来的。如果你能让两者保持一致，就能打造出为多方利益相关者创造价值的强大组织。我希望这也能让世界变得更可持续。\n\
  \n**帕吉萨斯：** 接下来，我们来谈谈可持续发展与高管领导力的交集。您认为您在现任职务中运用的技能，与您担任英国及爱尔兰业务负责人时相比，是相同的、有所重叠，还是截然不同？\n\
  \n**瓦利：** 有些事情是相同的，例如召集一个团队并与他们协作，共同寻找更优解决方案的能力。我认为这是任何领导者角色的组成部分。拿破仑·波拿巴有句名言。虽说一个英国人引用这位特定法国军事人物的名言可能有点奇怪，但我非常喜欢。拿破仑说过：\"\
  领导者的职责是认清现实并给予希望。\"我在过去的领导角色中多次引用过这句话。作为团队领导者，你要做的第一件事就是确保我们所有人看到的是同一个现实。一旦做到这点，你就有责任去创造一个充满希望的未来。\n\
  \n这就引出了我之前担任的职务与`CSO`（首席可持续发展官）一职的不同之处。可持续发展所面临的运作背景截然不同。这个背景非常特殊，因为气候问题影响着整个社会——从岛国的原住民部落到大城市主要河流沿岸的居民，这两个群体都担忧着海平面的上升。我们自问：\"\
  这股可持续发展的浪潮，是否与数字变革的浪潮相似？\"一家公司的数字化转型，对其许多消费者乃至大部分社会公众来说，往往是相对隐蔽的。虽然存在一些相似之处，但我认为最大的不同在于社会在推动变革中的作用。数字化转型对许多公司的冲击，其力度可能比我们预期的要大一倍。然而，我不记得社会大众曾普遍呼吁企业\"\
  快点进行数字化\"。\n\n但在可持续发展方面，我听到了来自社会和政府的巨大呼声，这种呼声甚至带有挑战性，因为他们认为企业是问题的一部分。要求企业更快地去碳化，并做得比满足《巴黎协定》的基本要求更多，与要求企业进行数字化转型——后者可以说是一个更直接的要求——是截然不同的。更敏锐地倾听外部利益相关者的声音，听见社会的呼声，这对我们许多领导者来说是一个新课题。它确实拓展了领导力的边界，要求我们更具包容性，并更周到地思考所谓的业务运营的外部性。这就是我所说的其中的一个差异。\n\
  \n**帕吉萨斯：** 您现在听到的外部性有哪些？\n\n**瓦利：** 最常见的外部性是温室气体排放。还有污染和空气质量的影响。水资源的保护是另一个。最后，是对生物多样性的影响。在资本主义的下一个阶段，我们必须将这些外部性纳入成本考量，这样才能让企业对其更广泛的运营影响负责。\n\
  \n**帕吉萨斯：** 对于一个成功实施可持续发展战略的公司，其领导者是否必须相信企业应该带来社会和环境效益？\n\n**瓦利：** 是的，我认为他们必须相信。我的观点是，过去几年甚至几十年来，领导力对话中的一个核心主题就是领导者的真实性。在我个人的领导力旅程中，我一次又一次地认识到，最优秀的领导者是最真实的，而不是那些穿上闪亮盔甲就能挡开所有问题的人。他们是那些能展现自身脆弱和焦虑的人。\n\
  \n我想回到我朋友拿破仑的那句关于认清现实并给予希望的名言。我认为领导者在面对严峻挑战时扮演着给予希望的角色，但他们可以在做到这一点的同时，依然保持高度的真实性。必须对我们共同面临的处境有真正的理解。这样你才有资格去动员人们，带领他们与你同行——无论他们是你的员工、客户还是最终消费者。领导者确实必须相信可持续发展，因为这是一项真实性的考验。他们需要保持真实，才能引领利益相关者同行。\n\
  \n我对人生的看法是，人类会进行多种测试。当他们遇到某个人时，会下意识地进行测试，其中之一就是判断对方是否真实。我们都明白与一个不真实的人共事是什么感觉。尤其是在这个议题上，我认为领导者必须真实。\n\
  \n**帕吉萨斯：** 我很赞同您关于真实性的观点。一些可持续发展问题与员工非常个人的问题息息相关。例如，当听到一位领导者谈论种族不平等问题时，如果感知到这位领导者不真诚，就会削弱其公信力，进而影响整体战略的成功。\n\
  \n让我们进入本次采访的最后一个问题。对于可持续发展与商业，您持有什么样的乐观看法？\n\n**瓦利：** 我对工作和生活的框架是，我是一个乐观主义者，但一个忧心忡忡的乐观主义者。我认为我们中越来越多的人正在意识到我们共同将地球置于的挑战和危险境地。我从商界感受到，人们由衷地理解我们必须要成为解决方案的一部分。坦率地说，如果我们不去这样做，我认为我们将被社会、我们的员工、我们的消费者以及我们的家人评判，认为我们在这些危险时刻没有采取正确的行动。\n\
  \n我们在气候变化上面临的挑战之一是，如果我们不能实现在降低地球温度上升方面的目标，我认为将会出现社会崩溃，因为大量人口将流离失所。他们将无法以同样的方式耕种或谋生。整个生活方式都将面临风险。如果我们企业不迅速成为解决方案的一部分，并学会以新的方式合作，那就是双重危机。不仅我们的地球会升温，一些相关的问题，包括社会不平等和动荡，其影响也会成倍增长。如果我们不能团结起来解决气候危机，不能像人们所说的那样让这成为\"\
  行动十年\"，我担心这些其他相关问题将会对我们产生更大的冲击。\n\n如果展望未来，我之所以乐观，是因为我确实看到越来越多的企业正积极投入，成为解决方案的一部分。我发现企业愿意合作，甚至与竞争对手合作，共同成为解决方案的一部分。我相信将会出现创新和新的合作方式，尤其是新的协作模式。在这个新世界里，我们将在成功避免气候危机后崛起，并将创造一个更公平的社会。我们可以利用这些经验教训去应对一系列与气候变化同样紧迫的周边挑战，例如塑料污染、生物多样性和社会公平。\n\
  \n\n### 10. 索菲亚·门德尔松\n\n Cognizant 首席可持续发展官兼 ESG 负责人\n\n*索菲亚·门德尔松是 Cognizant 的首席可持续发展官兼环境、社会和治理（ESG）负责人。Cognizant\
  \ 是一家跨国信息技术、咨询和业务流程服务提供商。2020 年，其营收达 167 亿美元，在《财富》世界 500 强中排名第 197 位。索菲亚领导公司战略，将\
  \ ESG 融入其宗旨、战略、系统和技术解决方案中。*\n\n*此前，索菲亚曾在捷蓝航空担任首位首席可持续发展官，通过率先实现航空公司碳中和以及使用可持续航空燃料，塑造了捷蓝航空和整个航空业。她早期的职业经历包括：在企业房地产行业的跨国制造商海沃氏家具担任新兴市场可持续发展负责人，以及在上海的珍·古道尔研究所工作，负责在中国建立办公室和学校的环保项目。*\n\
  \n*索菲亚因其领导力和对企业公民责任的承诺而备受认可。2016 年，她荣获美国环境保护署气候领导奖，并被《道德企业》杂志评为“年度气候领袖”。2020 年，彭博社将她列为引领气候行动的\
  \ 30 位顶尖人物之一。*\n\n**帕吉萨斯：** 我们首先从“可持续发展”这个概念谈起。它的起源是什么？以及它与当今商业战略的关系是怎样的？\n\n**门德尔松：**\
  \ 从历史上看，可持续发展并不被视为指导战略的必要因素。它源于企业慈善的根基，慈善捐款和小规模行动是企业可持续发展的第一阶段。此后，它演变为第二阶段——一种营销和声誉策略。再然后，它发展成为大多数\
  \ CEO 和董事会主要视其为保护收入而非*创造新*收入的手段。随着可持续发展成为日益紧迫和关键的话题，你将越来越难找到一位 CEO 会对他们的股东和董事会说：“可持续发展只是一种营销或公关策略。”\n\
  \n既然我们知道了它的由来，就需要探索可持续发展——现在被称为 ESG——下一步必须走向何方，那就是成为商业战略的一部分。战略产生收入，收入必须产生利润。ESG\
  \ 必须克服一种观念，即认为它与企业的真正战略是无关紧要或边缘化的。“行善获利”这个说法包含了可以同时实现两个目标的理念：一是实现传统的商业目标，二是吸引非财务利益相关者。这就是现代和当代\
  \ ESG 的基准。\n\n**帕吉萨斯：** “行善获利”和“做正确的事”这些说法在当今的商业用语中确实很流行。企业使用这些说法有意义吗？\n\n**门德尔松：**\
  \ 我通常会避免使用“行善”这种语言，因为我们对“善”和“正确”的定义各不相同。从这种语言中需要认识到的重要一点是，受影响利益相关者与盈利能力之间的分歧。也就是说，你要么赚钱，*要么*“行善”。\n\
  \n在丽贝卡·亨德森的著作《在火海中重新构想资本主义》[(PublicAffairs, 2020 年)]中，她提到哈佛商学院的首任院长将该学院的宗旨定义为培养“能够‘体面地赚取可观利润’”的领导者。直到最近，我们才看到企业回归到成为体面的、可持续的利润创造者，即考虑到对多个利益相关者的影响。在过去二十年里，这两个概念的重新整合由一些著名的\
  \ CEO 以及外部的学者和思想家所引领。保罗·波尔曼（2009 年至 2019 年任联合利华 CEO）就是一个明显的例子。在保罗的领导下，联合利华接受了品牌可以通过其产品传递社会效益的理念。\n\
  \n**帕吉萨斯：** 您能否指出全球企业何时注意到这两个概念的重新整合？\n\n**门德尔松：** 历史应铭记，当我们迎来 2019 年在达沃斯举行的世界经济论坛时，出现了转折点。我创造了一个短语并经常使用它——“一次达沃斯，天壤之别”。这种转变首先发生在上市公司身上。\n\
  \n大型上市公司表示：“我们做可持续发展已经很多年了！”而机构投资者回应道：“是的。我们阅读你们的可持续发展、CSR（企业社会责任）、公民责任和 ESG 报告已经很多年了。但我们仍然无法从中获得可靠的数据。你们多年来所做的一切都收效甚微，所以现在我们要你们像要求公司报告其财务状况一样来报告——系统化和数字化。我们要确保你们报告的内容是可衡量和可比较的。我们要用目标来衡量。我们要你们像对待公开申报文件一样严谨地对待公开披露信息。简而言之，我们要开始像计算金钱一样计算碳排放。”\n\
  \n那些善于抓住这一机遇的商业领袖，正是那些一直强调“可持续发展也关乎金钱，关乎财务表现”的人。他们通过各种方式做到了这一点，包括推出 ETF（交易型开放式指数基金）、发行绿色债券，以及在财报电话会议上讨论气候影响。\n\
  \n**帕吉萨斯：** 为什么机构投资者会在 2019 年左右就透明度、报告以及对气候变化对其投资的上市公司影响的认知方面做出这种转变？\n\n**门德尔松：**\
  \ 我认为促使机构股东转变的原因是他们对于不断增长且未受抑制的风险感到沮丧。那些曾被标记为长期、后又转为中期的社会和气候风险，如今已变成现实风险。然而，大多数上市公司在财报电话会议或财务文件中并未讨论这些话题。投资者开始自问，当气候变化威胁到投资时，谁会最终承担损失？没有人希望自己的账面上有搁浅资产。\n\
  \n再加上社会动荡、技能差距扩大和劳动力短缺，这些都影响了盈利能力并限制了收入。这反过来又可能导致社会动荡， destabilize 社会，进而 destabilize\
  \ 经济，并进一步削弱盈利能力和收入。总的来说，这些问题代表着重大风险。大约在 2019 年，出现了一股群体性浪潮，大家一致认为利益相关者应该开始解决这个问题了。\n\
  \n**帕吉萨斯：** 您在捷蓝航空和现在在 Cognizant 所领导战略的范围是什么？它们分属两个截然不同的行业：航空业以及 IT 和商业服务业。\n\n\
  **门德尔松：** 从 2013 年到 2020 年在捷蓝航空任职期间，我们在 ESG 和可持续运营方面取得了进展。我们将其从一个内部沟通理念转变为核心业务风险缓解手段和差异化竞争优势。我们为行业引入了可持续发展挂钩贷款和可持续航空燃料。我们思考客户在与品牌互动时的感受——安全、准时、受关怀、舒适。我预见到，社会和环境的责任将逐渐成为客户选择与我们同飞时所期望感受到的一部分。我将其融入了客户与品牌互动时的感受中，也融入了机舱乘务员或支持中心乘务员（我自己也曾是其中一员）希望留在该品牌工作的原因之中。\n\
  \n\n\n与`JetBlue`的经历相似，我受`Cognizant`之邀，负责启动其 ESG 职能的主流化或专业化建设。不过，与上次不同，这次市场对于 ESG\
  \ 的要求和期待已经成熟得多。我于 2020 年加入`Cognizant`，彼时正值 2019 年达沃斯世界经济论坛发生转折性事件——气候变化和 ESG 以一种全新方式闯入商业主流——之后，又恰逢新冠疫情肆虐。\n\
  \n`Cognizant`在 ESG 方面正从零起步，飞速前进。我们有一位新任转型 CEO`布莱恩·汉弗莱斯`，他正带领一家优秀的公司，助其适应后疫情时代的世界。我常说，`布莱恩`在聘用我之前，就已通过确立公司“改善日常生活”的使命，为`Cognizant`的\
  \ ESG 工作奠定了基础。这为我在制定战略时提供了一盏指路明灯。\n\n**帕吉萨斯：** 您和您的团队正在推进哪些项目来推动`Cognizant`的可持续发展战略迈向这盏指路明灯？\n\
  \n**门德尔松：** 我们是一家以人为本的企业，这意味着我们深知吸引和留住人才的重要性。我们的总体 ESG 愿景是利用我们的技术、知识和合作伙伴关系，为我们的客户和社区创造全新水平的环境和社会效益。\n\
  \n尽管 ESG 涉及众多重要因素，但我们的核心关注领域通常是气候和多元化——并以有助于决策的方式报告我们在这些议题上的进展。我们正在制定并执行一条通往净零排放的路径——这是\
  \ ESG 中“E”的体现。我们正在将社会影响项目与招聘渠道挂钩——这是“S”的体现。我们正以对待传统业务指标同样的严肃态度，向投资者报告这些成果——这是“G”的体现。\n\
  \n**帕吉萨斯：** 减少温室气体排放是否是`Cognizant`的优先事项？\n\n**门德尔松：** 作为一家服务公司，我们的业务本身不会排放大量温室气体，因为我们没有制造或物流环节。然而，排放量要少到什么程度才算足够？我认为市场给出的明确回应是：只要超过零就是太多。我承认，与哪怕是轻工业制造相比，我们的排放足迹都相对较小，但它们仍然是我们的排放，因此这既是我们的问题，也是我们的机遇。\n\
  \n对于一家排放量相对较低的公司而言，在 ESG 方面另一件重要的事是：尽管你可能没有大量排放，但你拥有大量客户。而你的客户肩负着减少温室气体排放的使命。你的客户与你有相同的股东。如果股东在询问你的排放情况，猜猜他们还会问谁？他们同样会问你的客户。因此，这不仅仅是我们的排放量问题，更是我们工具箱里有多少技术工具可以帮助其他人减少排放的问题。\n\
  \n**帕吉萨斯：** 市场上其他公司，比如咨询或营销公司，其排放足迹也相对较轻。您是否认为它们也应该将零排放作为重点？\n\n**门德尔松：** 那些可能没有强大公众品牌或像航空公司那样巨大业务足迹的公司领导者，可能不会感受到那么直接的压力。然而，利益相关方的压力仍然存在。即使`Cognizant`只排放相当于一辆汽车的温室气体，我仍有近\
  \ 30 万名同事会问我们正在为此做些什么。我们肩负使命。几乎任何排放都是过多的。\n\n**帕吉萨斯：** 鉴于您在`Cognizant`和`JetBlue`启动\
  \ ESG 职能的经验，对于那些正在自己公司启动 ESG 职能的人，您有什么建议？\n\n**门德尔松：** 在 ESG 领域，首先你需要启动那些能够提供治理监督和内部控制环境的\
  \ ESG 职能，以管理那些将成为你关键公开 ESG 数据、目标和声明的内容。其次，在启动 ESG 职能的过程中，要与高层管理层和董事会合作，确保基础工作到位。你要设定清晰、不含糊的里程碑，并建立强有力的监督基础设施。\n\
  \n**帕吉萨斯：** 作为`Cognizant`的高级管理人员，您如何与董事会、管理团队以及高管层的同事们合作以取得成功？\n\n**门德尔松：** `Cognizant`的董事会致力于确保我们将\
  \ ESG 融入现有的企业优先级矩阵中。我们的治理与可持续发展委员会（其章程于 2021 年经我们重新审议并重新发布，以强调可持续发展和 ESG）积极参与监督\
  \ ESG 在`Cognizant`的强化和整合。当然，我与我们的总法律顾问密切合作，为公司提供关于特定 ESG 风险和机遇的专业观点。基于这些指导，CEO、CFO\
  \ 以及董事会可以决定如何转型公司，以参与到低碳、包容的经济中。\n\n**帕吉萨斯：** 您在其它公司实施过、并在`Cognizant`正在实施的战略和项目，都着眼于长远的经济、社会和环境目标。是什么驱使您和其他可持续发展领导者致力于这些雄心勃勃的战略？\n\
  \n**门德尔松：** 在我被提供传统商业职位时，我全都拒绝了，为的是在 ESG 领域深耕，那时我们对 ESG 今天的样貌还一无所知。我认为那些在 2019 年之前就担任\
  \ ESG 职位很久的负责人，感觉就像是在观看一场慢动作的革命。我们早就知道，市场忽视碳等外部性的方式绝对无法持续。资本主义制度能够提升人民福祉，能够减轻贫困，创造机会。然而，资本主义需要从内部进行转变和改革，以解决可持续发展问题，包括碳的外部性以及人力资本投资的不足。来自非政府组织[非政府组织]的压力和其他外部压力在生态系统中扮演着角色，但仅靠它们无法实现根本改变。\n\
  \n我想分享我个人的顿悟时刻。我曾在中国生活和工作多年。当时我的一位中国朋友对我说：“你知道吗，我的传统家乡是一个制造业中心。现在每个人都在谈论癌症和污染的后果。”这个人会一百次、一千次地选择那些制造业工作，选择把那些工厂和就业机会放在他的家乡社区。他只是希望在这样做的同时，不要让负面效应体现在他的社区中。\n\
  \n在传统的动态中，传统的商业声音会说：“啊，但那要多花多少钱？谁来买单？因为我可以告诉你，消费者是不会买单的。” 正是那些坚持下来、顶住这些质疑、并意识到可以通过建立规模经济、领先于监管、创建愿意支付更高价格的子品牌、以及邀请竞争对手加入旨在提高标准并降低成本的跨行业合作协会来减少外部性的人们。\n\
  \n我们坚持了下来，因为我们知道那些未被核算的外部性成本再也无法忽视。你必须要相信资本主义的某些环节已经失灵，才会希望从内部改变资本主义。同时，你也必须热爱它所带来的经济流动性，从而信仰它，并愿意花费二三十年时间，去论证那个导致它失灵的因素在修复它方面也能发挥作用。\n\
  \n**帕吉萨斯：** 鉴于您在可持续发展领域的深厚经验，您是否看到业界对可持续发展和 ESG 需要“软技能”的看法发生了转变？为什么女性传统上被认为与这个领域相关联？\n\
  \n\n**门德尔松：** 我想非常、非常明确地指出。这并不是说 ESG 是“软性”的，也不是说女性是“软性”的，因此这两者就自然而然地联系在了一起。由于 ESG\
  \ 起源于慈善和公关领域，历史上女性涉足这一领域是被接受的。进入这个没有 P&L（损益表）的“乐观职业”也是可以被接受的。\n\n传统上，可持续发展工作主要由初级员工领导，通常是在中层管理层中的女性。如果我们回溯到\
  \ 21 世纪初，可持续发展职位是女性可以安全担任的职位，因为它们关乎“做正确的事”。它们关乎利益相关者的参与和管理，关乎公关，关乎故事讲述。从一开始，环境和社会影响，以及通过环境和社会后果与企业及品牌互动的利益相关者这些概念，就被描绘成了“软性”的。\n\
  \n在 2019 年之前，首席可持续发展官基本上不拥有 P&L。没错，在太阳能公司，确实有一些拥有 P&L 的领导者。在回收公司，你也能找到不少拥有 P&L 的人。但我谈论的是我的专业领域，即公司事务，以及帮助董事会和\
  \ CEO 完成将 ESG 从束之高阁到融入业务的转型。\n\n在过去的十年里，成为一名可持续发展领导者意味着成为“管理费用”或“锦上添花”的角色，而不是创收者。但是，当利润下滑时，“锦上添花”会怎样？它会被裁掉。因此，这个领域在社交上对女性变得更有吸引力了。现在，我看到了这种变化。这是一种剧烈的转变。\n\
  \n**帕吉萨斯：** 你如何总结你对于可持续发展与商业角色关系的理念？你又是如何因此来规划你的职业道路的？\n\n**门德尔松：** 我的理念绝对忠于一个想法：环境和社会挑战能够在利用公共和私人资金资源的情况下，以最快的速度和大规模的方式得到解决。这一直意味着要放弃那些薪酬更高的传统商业角色。它还关乎在\
  \ ESG 领域内找到一个细分市场。如果 ESG 领域之外的人认为 ESG 本身已经足够细分，那他们就错了。这是一个很大的空间，因为 ESG 本身就很大。\n\n\
  **帕吉萨斯：** 归根结底，作为一家财富 500 强公司的首席可持续发展官，你会如何描述你的工作？\n\n**门德尔松：** 我只是在做商业而已。我保护盈利能力，支持创收。我吸引员工加入，以吸引最优秀的人才，并帮助公司留住他们。我确保当客户选择与我们合作时，我们能成为他们品牌的守护者，我还确保我们的技术能够解决客户在环境和社会方面的痛点。\n\
  \n我通过数据、故事和趋势来捕捉这一切，并公开向投资者报告。最终，在经历了所有这些之后，我们其实又回到了起点，那就是通过创造一个更宜居、更稳定的社会，为股东创造价值。\n\
  \n### 11. 布莱恩·蒂彭斯\n\n慧与科技副总裁兼首席可持续发展官；慧与科技基金会总裁兼执行董事\n\n`布莱恩·蒂彭斯`是慧与科技（`HPE`）的副总裁兼首席可持续发展官（`CSO`）。`HPE`是一家为企业提供信息技术（`IT`）解决方案的\
  \ B2B 公司，包括服务器、存储、网络和咨询，在截至 2021 年 10 月 31 日的财年中，营收超过 278 亿美元。`布莱恩`负责领导一个全球团队，专注于推动可衡量且透明的环境、社会和治理（`ESG`）战略，以惠及其客户、投资者、员工及其所在的社区。\n\
  \n`布莱恩`同时也是`HPE 基金会`的总裁兼执行董事，该基金会的使命是部署技能、资源和技术来应对社会挑战，并改善人们生活和工作方式。\n\n在担任`HPE`副总裁兼`首席多元化官`的上一任职务中，`布莱恩`负责提供愿景、管理和战略规划，以倡导一种支持包容、多元和公平的创新文化。他曾在`HPE`的全球`采购`和全球房地产部门担任过领导职务。在\
  \ 2000 年加入`HPE`之前，`布莱恩`曾在英特尔公司为制造业提供法律支持。\n\n他担任多家组织的董事或顾问，包括沃克遗产基金会和全国少数族裔工程师行动委员会（`NACME`）。`布莱恩`被黑人历史组织评为商业界最具影响力的\
  \ 100 位非裔美国人之一，被《黑人企业》杂志评为企业多元化领域的顶级高管，并被全球多元化榜单评为业界 50 大多元化专业人士之一。\n\n**克里萨·帕吉萨斯：**\
  \ IT 服务和产品是一个庞大的商业领域。`HPE`在其中提供哪些服务和产品？你们的核心客户是谁？\n\n**布莱恩·蒂彭斯：** `HPE`是一家总部位于德克萨斯州休斯顿的跨国公司。我们公司为全球各地的企业提供技术解决方案，支持从制造业、农业、石油天然气到其他行业的各类客户。虽然我们提供硬件、软件和基础设施，但我们已经转变了整个业务模式，成为一个以服务为导向的组织，将我们所有的产品作为服务来交付。具体来说，我们的产品涵盖云服务、计算解决方案、高性能计算和人工智能（AI）、智能边缘、软件和存储，这些产品既可以一次性购买，也可以通过服务模式提供给公共部门以及中小企业和大型企业。\n\
  \n**帕吉萨斯：** `HPE`的可持续发展或 ESG 战略是什么？你们为什么对其进行投资？\n\n**蒂彭斯：** 我们的使命是创造可持续和公平的 IT 解决方案，以满足未来的技术需求。为了实现我们的使命，我们专注于引领低碳转型、投资于我们的员工、并以诚信经营。我们为什么要这样做？我们相信，我们的\
  \ ESG 战略对于发展壮大我们的文化、为所有利益相关者创造价值至关重要。将 ESG 议题融入我们的业务战略，能够提高我们业务的竞争力和韧性，并让我们在市场中脱颖而出。\n\
  \n我们的战略正朝着低碳经济迈进，包括到 2050 年实现我们整个价值链的净零排放。像许多公司一样，我们设有一些中期目标来帮助我们实现这些总体目标，包括专注于可再生能源以及减少我们自身运营或供应商排放的目标。我们的目标是，到\
  \ 2025 年，80%的生产供应商设定科学碳目标，并将我们产品的能源效率性能相比 2015 年基准提升 30 倍。我们还在制定我们的 2050 年路线图，以更积极主动的方式分解净零目标，帮助我们了解需要做出哪些投资才能实现这一目标。\n\
  \n\n我们的气候战略同样关注如何帮助客户实现净零目标，因为在我们碳足迹中占比最大的部分正是客户对我们产品的使用。作为一家为全球企业客户提供 IT 服务与解决方案的供应商，我们能够通过聚焦供应链及自身产品的能效提升来帮助客户达成目标，从而产生深远影响。\n\
  \n其次，ESG 战略的重要环节是通过包容性与多元化举措投资全球及内部社区人才。我们在惠普企业（HPE）全球高管团队中女性、非裔、西语裔及亚裔群体的占比情况已公开披露。我们在公司各层级均设定了多元化代表比例目标，并持续致力于拓展多元化评估维度，引入薪酬公平、生活工资等其他人力资本指标。在\
  \ ESG 战略中，我们也格外关注对社区产生的影响。\n\n我们正在组建全新的 ESG 团队。原先以环境议题为核心的团队开始向更广泛的环境、社会和治理维度拓展。在新架构下，我们将\
  \ HPE 基金会——这个我担任总裁兼执行董事的非营利组织——纳入体系，明确传递战略必须包含社会维度的信号，借助基金会这类载体对社区产生积极影响。通过这一渠道，我们重点关注灾后重建、灾害救助、STEM\
  \ 教育等领域，并推出多项举措支持公司更宏大的目标。\n\n最后，我们强调道德与合规以确保运营的正当性，这正是 ESG 中\"*G*\"（治理）的核心。这涵盖从全年面向各层级员工开展商业行为准则培训，到确保冲突矿产的合规采购，再到解决供应链中的人口贩运和现代奴役问题。这些构成了我们正在完善中的更广泛\
  \ ESG 战略与方法的三大支柱。\n\n**帕吉萨斯：** 有些公司只关注环境议题，另一些公司则安排不同负责人分别处理环境与社会问题。当时内部怎样的讨论促使您决定将环境与社会议题整合在一个部门，并由您统一领导？\n\
  \n**蒂彭斯：** 这对我们来说是一个逐步演进的过程，我认为每家公司的经历都类似。前任首席可持续发展官（CSO）的离职催生了这次变革。职位空缺让我们得以退后一步，思考什么对项目最有利。我们自问：\"\
  是否要聘请与前任 CSO 背景相似的人——一位拥有环境科学学位的环保领域领导者？\" 虽然我们确信可以从外部聘请该领域的专家，但我们也意识到，这是回应外部压力的契机——通过从内部选拔了解公司业务的人选来应对挑战。\n\
  \n**帕吉萨斯：** 哪些压力？来自哪些方面？\n\n**蒂彭斯：** 客户、投资者以及密切关注我们各层级透明度（不限于环境议题）的分析师群体，他们的诉求越来越多。客户在采购决策中日益将可持续发展标准纳入考量。事实上，HPE\
  \ 每年收到超过 1300 次关于公司可持续发展实践的信息问询。我们也看到投资者对环境、社会和治理问题的兴趣与日俱增——这使得可持续发展成为任何大型企业高管层的优先事项。\n\
  \n**帕吉萨斯：** 因此，在评估新任 CSO 的职责范围与专业能力时，您和 HPE 领导层希望找到一位既能聚焦利益相关方需求，又熟悉 HPE 业务，并能整合分散职能的人选。\n\
  \n**蒂彭斯：** 是的。此前我们在企业内对社会议题采取分散处理的方式，缺乏统一的监管负责人。我们意识到，在公司发展的这个阶段，是时候建立围绕 ESG 所有议题的专项能力中心了——尽管人力资源、供应链等团队仍会有业务交叉。但从商业角度而言，整合这些职能显然是正确之举。\n\
  \n除了考虑投资者和分析师的需求，我们团队中还有一小部分人花费大量时间与客户沟通，倾听客户声音，就能效提升和数字化转型提供顾问服务。我们思考如何通过产品和服务助力客户发展。最初这些对话围绕某台服务器或存储设备的能效展开，但多年来已扩展为讨论客户更广泛的可持续发展叙事：客户在供应商多元化方面有何举措？他们的多元化和包容性故事是什么？\n\
  \n综合考量所有这些要素——需要制定一套聚焦投资者、客户、员工和社区的连贯性 ESG 战略——我们看到了整合现有团队并提升 ESG 中\"S\"（社会）地位的商业逻辑。这正是我加入的契机。作为在商业与社会议题方面拥有丰富经验、在\
  \ HPE 工作二十余年且熟悉公司业务、与董事会和执行委员会保持良好互动的领导者，我被委以重任恰逢其时。过去五年，我作为 HPE 首席多元化官，大部分时间都投入在\
  \ ESG 的社会维度。在此之前，我在公司内部担任过其他职务。这是我首次将所有专业领域整合在一起。这是我们经过深思熟虑的决策。\n\n**帕吉萨斯：** HPE\
  \ 推行这种更广泛的 ESG 战略的商业理由是什么？\n\n**蒂彭斯：** 核心在于利用可持续发展与领导力加速业务转型。这绝不被视为独立于核心业务之外的事项，而是我们业务与转型的核心——将一切服务化。无论是满足合规要求，还是应对美国证券交易委员会（SEC）及英国同类机构的严格审查，我们绝不愿因缺失任何可持续发展要素而影响业务开展条件。\n\
  \n我们可以通过 ESG 领导力巩固市场领先地位——因为我们的产品更具环境可持续性。我们还能为客户提供咨询服务，包括满足其对更广泛可持续发展叙事的需求。基于所有这些原因，ESG\
  \ 正在加速我们的转型进程。\n\n**帕吉萨斯：** 您认为随着更多公司深化 ESG 与可持续发展战略，会有更多公司采用这种组织架构吗？\n\n**蒂彭斯：**\
  \ 会的。上周我在 HPE 作为会员的 2021 年企业生态论坛上发言。参会前我以为自己会格格不入——想象中房间里坐满了来自顶尖学府、拥有气候科学学位的首席可持续发展官。（轻笑）但事实并非如此。我遇到许多背景多元的人士，有化学工程背景的，有市场部门出身的，他们带来了不同视角，正在拓展对各支柱领域的认知，并建立了非常强大的团队。\n\
  \n\n\n\n亚马逊的卡拉·赫斯特就是一个很好的例子。她拥有高水平的 ESG（环境、社会和治理）专业能力，麾下还有一个出色的专家和工程师团队。随着这一领域的发展演进，我们将看到更多领导者关注环境和社会议题，引入基础性工作，解决多元化与包容性问题，并以首席目标官、ESG\
  \ 负责人或其他头衔的名义处理一系列相互关联的问题。慧与科技的这种演进对我们来说很容易，因为我们有充分的商业案例来支撑这一举措所能带来的价值。\n\n**帕吉萨斯：**\
  \ 新的 ESG 团队结构是怎样的？\n\n**蒂彭斯：** 我们新的 ESG 小组拥有一支约 50 人的专职团队。团队内部，有一个小组负责 ESG 报告与评级，并与投资者沟通。另一个小组专注于可持续创新，关注未来趋势，以及如何将可持续发展理念融入我们的供应链、产品和服务中。我们还有一个小组专注于销售赋能，作为顾问与全球各地的客户合作。我们正在围绕社会议题组建团队，并拥有一支环境战略师团队，负责在整个产品组合中推动这些主题。最后，我们还有产品合规与工程团队。\n\
  \n**帕吉萨斯：** 在 ESG 团队中设置合规与工程团队是独一无二的。这个团队是否代表了 ESG 中的 *G*（治理）？\n\n**蒂彭斯：** 是的。我认为在某种程度上，它是\
  \ *E*、*S*、*G* 三者的结合，但这对我们来说是全新的。我将其视为一种端到端的整体方法，将可持续发展战略付诸实践。过去，这些团队与可持续发展团队是分开的。\n\
  \n**帕吉萨斯：** 产品合规团队具体做什么？\n\n**蒂彭斯：** 该团队首先处理市场准入问题。产品合规工程师需要考虑产品的电源供应是否符合特定国家的机电和射频要求。鉴于我们广泛的产品线，必须有人确保工程产品符合每个国家的法规要求，并与政府机构合作了解新兴要求，因为我们始终要确保产品能在每个市场销售。\n\
  \n然而，这只是该团队最基本的能力范围和职责。例如，如果存在关于消耗臭氧层物质的政府要求，团队可以勾选合规框框后就止步不前。但我们期望他们与产品生成部门进行深思熟虑的合作，不仅要确保十年后的合规性，还要确保我们在考虑工程设计中融入可持续发展理念。这是理想状态。我们的假设是，通过接管这些最初以合规为重点的团队，我们不仅能带来合规和市场准入能力，还能将领导力融入我们的产品中。\n\
  \n**帕吉萨斯：** 听起来你正在构建一个充满活力的组织，既能应对当前的业务需求，又能灵活适应未来的需求。是这样吗？\n\n**蒂彭斯：** 没错，我们正在努力弄清楚未来会是什么样子。你可以通过多种方式做到这一点，比如聘请顾问。我并非否定那些顾问！但通常，他们不会告诉我，我是否仍然能在哈萨克斯坦、安哥拉以及世界上其他存在细微差别的地区销售产品。这其中一部分涉及理解和思考未来。凭借我们的全球布局、对新兴法规要求的了解以及所有这些方面，我们可以成为帮助我们的产品生成部门将各个点连接起来的团队。\n\
  \n有一些特别积极、具有前瞻性的地区，例如北欧国家和美国的加利福尼亚州。我们与不同地区的监管机构和政府官员合作，支持他们的议程并利用我们政府事务部门的资源，我们的产品设计旨在满足，有时甚至超越法规要求。我们的团队不仅了解新兴的要求，而且在某种程度上也在推动这些要求。\n\
  \n**帕吉萨斯：** 显然，你在慧与科技的组织设计上花了很多心思。你认为未来首席可持续发展官的角色和团队将如何演变？\n\n**蒂彭斯：** 我经常思考首席可持续发展官角色的演变，无论其头衔是首席人力官、首席伦理官还是\
  \ ESG 负责人。我将其视为一个“仅次于 CEO”的职位，专注于环境、社会和治理领域。我认为我们将看到这些领域的融合，原本分布在企业不同部门的职能——比如这里的环保团队，那里的人力资源和多元化包容团队——将整合到一起。\n\
  \n**帕吉萨斯：** 谈到信息技术行业，科技公司在应对环境问题方面扮演着什么角色？\n\n**蒂彭斯：** 作为一个行业，与希望大幅减排的石油天然气和制造业相比，信息技术公司通常并非温室气体的大量排放者。软件公司、科技公司往往没有巨大的碳足迹，至少在其自身运营中是这样。但我们处于一个独特的位置，可以思考客户如何使用我们的产品，以及我们将如何协助他们并帮助其减少碳足迹。\n\
  \n当我们都在努力实现净零排放目标时，每个人都需要管理大量的数据存储，或者弄清楚如何运营自己的信息技术资产组合，无论是在本地部署、放在云端，还是采用混合方式。像我们这样的科技公司有能力帮助解决这个问题，不仅是为了我们自己，更是为了成为世界上其他所有人的解决方案提供商。\n\
  \n**帕吉萨斯：** 你认为哪些可持续发展问题可以通过信息技术解决？能举个例子吗？\n\n**蒂彭斯：** 以一家大型医院系统为例。该医院系统正在管理其通过收购区域医院而积累的遗留数据中心。该系统对每家医院的数据中心都进行了大量投资。由于服务器需全天候运行，且所有设备需要保持适宜冷却，这消耗了大量能源，也占用了大量资源和人力进行管理。\n\
  \n当一家医院考虑其碳足迹时，它希望在管理数据中心、满足客户（患者、医生、护士和支持人员）需求的同时，成为一个良好的企业公民并设定净零目标。医院服务的患者数量可能在增长，同时还要处理一些严格的隐私要求。人们可能会告诉医院管理者，把所有东西都放到云端，但《健康保险流通与责任法案》（HIPAA）和其他要求可能意味着他们需要将部分数据存储在本地，或者因为医生需要快速访问信息。慧与科技可以介入并说：“我们可以帮助您采用混合方法。我们可以帮助您将所有东西作为服务来运营。我们可以为您管理数据中心，并使用我们的平台来帮助规划您的网络并查看实时网络性能。”\n\
  \n通过与他们合作，我们可以接手那些遗留的数据中心，并决定数据中心的哪些部分可以放在公有云中，哪些部分保留在本地。随着时间的推移，他们会发现电费和碳足迹显著下降，因为他们不再需要管理那些遗留资源，同时又能满足客户的需求。如果我们做得好，他们就能为他们的客户——患者——提供更好、更快的服务。\n\
  \n\n\n\n**帕吉萨斯：** 您是否会认为，更好的患者护理能带来社会效益？\n\n**蒂彭斯：** 完全同意，确实能带来更好的患者护理。例如，借助更先进的技术，医生和医疗机构能够快速获取信息，并且“医疗可移植性”也比以往更强。现在我们可以分析数据池，基于更大的数据集制定解决方案。数据是新的货币。我们越早从数据中获得洞察，就能越早创建出适用于全体人群的解决方案。新冠疫苗的研发就是一个例子。\n\
  \n**帕吉萨斯：** 能否举例说明慧与及其客户如何运用 IT 解决方案应对环境问题？\n\n**蒂彭斯：** 一个例子是精准农业。例如，我们可以利用技术来测量作物需要多少水分。我们目前正与英国的一个政府机构开展试点项目，研究气候变化对特定作物区域的影响，以及一场重大洪水对该区域会造成什么后果。我们掌握的所有数据都有助于进行预测性分析。\n\
  \n在制造业中，我们会审视制造生命周期及其最开始的阶段，也就是原型设计阶段。创建原型需要投入大量的资源。如果你能通过数字化方式完成，并且更快地走完原型设计周期，就能使用更少的材料和资源。当进入制造阶段时，通过使用数据和技术来预测一些维护时间或生产线上可能出现的问题，你可以识别出设备或产品出现故障时的停机时间。这能节省大量的时间和资源。\n\
  \n**帕吉萨斯：** 慧与如何利用技术重新思考其制造的 IT 产品的可持续性足迹？\n\n**蒂彭斯：** 我们正在重新思考“生命周期终结”的含义，即制造生命周期中的最后一个阶段。我们关注电子废弃物问题，并努力确保自己不是这一问题的推手。我们在设计产品时就使其易于升级或维修。而且，我们不再使用“生命周期终结”这个术语，而是称之为“使用期结束”，因为产品可以送往我们位于马萨诸塞州安多弗或苏格兰厄斯金的技术更新中心进行翻新，然后二次销售。\n\
  \n这些技术更新中心是世界上最大的 IT 制造翻新中心。我们回收的 IT 设备不问原始制造商。我们将所有设备分解到元器件级别，重新组装产品，然后在二手市场上销售，从而赋予产品新的生命。2020\
  \ 年，我们对通过技术更新中心的近 300 万件产品中，有近 90%进行了再制造和再销售，这是一个非常了不起的比例。\n\n**帕吉萨斯：** 转向 ESG 中的*社会*（S）方面，您如何定义社会问题？为什么社会问题对企业很重要？\n\
  \n**蒂彭斯：** 我想说，社会问题的定义正在演变，因为它们非常复杂且宽泛。我一直在与其他可持续发展专业人士讨论*社会*（社会问题）的本质，目前对其含义尚无普遍共识。\n\
  \n当你谈到*社会*（S）时，大多数人会倾向于想到志愿服务、慈善事业和社区捐赠，这当然是其中的一部分。例如，我们的慧与基金会延续了惠普基金会的传统，专注于我们如何利用技术来解决围绕\
  \ STEM 教育等世界性重大问题。这是社会问题定义的一个方面。我们也始终希望通过受影响的人数、捐赠的金额以及员工志愿服务的工时来衡量社区影响力。这很重要。\n\
  \n然而，我认为更基本的社会问题类型始于更基础的东西，这些东西大多属于人力资源领域，涉及人力资本指标。我们的员工队伍是否具有代表性，在性别、种族和其他可衡量的类别上，是否与我们服务的社区面貌相符？这是*社会*问题的核心。它更进一步，还包括像同工同酬和生活工资这样的问题。它也可能涉及我们为同性伴侣关系提供的福利类型、产假/陪产假、学习与发展机会，以及所有有助于提升团队成员生活水平的事务。\n\
  \n我们必须审视运营对“人”的影响，通过审计工厂，确保其提供公平的工资和工作时间。我们还在关注供应链中的人口贩运和现代奴隶制问题。\n\n**帕吉萨斯：** 您如何衡量慧与业务的社会影响？\n\
  \n**蒂彭斯：** 我认为目前还没有一个统一的影响模型或框架，但我认为我们很快就能实现。如今，投资者和分析师正在寻求一些对我们来说很容易回答的问题的答案，例如：“你们的多元化记分卡是什么样的？你们的薪酬结构如何？你们是否会激励高层领导者实现环境可持续发展目标？”\n\
  \n它将会演进到这样一个阶段：我们将拥有一个类似的整体框架，就像我们用来衡量实现碳中和目标的路径一样，但我认为这需要一些时间。在慧与，我们正在构建一个新的社会支柱，并希望其新的领导者能够接受一定程度的不确定性。对于社会问题，我们需要采取这样一种方法：“这里有一些大致的分类和我们认为想要衡量的东西，但我们需要有人进来把它构建起来。”\n\
  \n**帕吉萨斯：** 是的，不确定性是（企业）社会领域游戏的本质，因为可能适用的指标数量庞大。这也很有挑战性，因为影响可能只会在很长一段时间后才能显现，并且会受到企业控制之外的许多变量的影响。\n\
  \n您提到了员工队伍的多元化是一个至关重要的社会问题。对于可持续发展领域内有色人种的代表性问题，您有何看法？\n\n**蒂彭斯：** 可持续发展会议上的多元化程度并不高。在某种程度上，这是一个人才管道问题。进入那些往往为企业内可持续发展领导角色（如气候科学和环境工程）输送人才的领域的少数族裔代表性不足。虽然正如我之前提到的，高级可持续发展领导者的背景似乎正在发生变化，但在该领域的更广泛人才管道中，代表性仍然不足。\n\
  \n即使可持续发展领导者来自不同的背景，这仍然是公司高层代表性的一个更大问题。首席可持续发展官通常是公司里相当高级别的领导者。即使我们在多元化方面做得很好，能够改变公司在整体上少数族裔代表性的数字，但这些变化并未体现在高层领导职位上。你可能在可持续发展领域看到的有色人种更少，而能够晋升到该领域顶层的人就更少了。这是一个问题。\n\
  \n我们需要有计划地解决这个问题——我认为我们整个行业尚未做到这一点。我们在整个行业范围内做了大量工作，专注于不同的方面，例如提供 STEM 教育以增加非裔和西语裔程序员的数量。然而，我不认为我们有意识地、深思熟虑地将培养多样化的首席可持续发展官角色或\
  \ ESG 领导力人才储备作为一个学科来准备。这个领域正在快速发展和演变，并且不会很快消失，这为有计划的投资创造了机会和途径。\n\n\n\n**帕吉萨斯：**\
  \ 培养人才梯队至关重要且不可或缺，但这是一种长期解决方案。在可持续发展领域，是否存在立即提升多元性的机会？\n\n**蒂彭斯：** 尽管可持续发展或 ESG\
  \ 领域的多元性领导者匮乏，但担任多元性主管的非裔美国人和西班牙裔领导者却并不稀缺。或许唾手可得的方案是：挖掘包容与多元领域的杰出领导者，拓展其职责并赋予挑战。只要团队架构合理，领导者未必需要是顶尖教育背景的气候科学家，也无需熟稔\
  \ ESG 评级的细枝末节才能成功，对吧？他们需要的是能理解领导大型、多层面项目的细微之处，并能与组织内外部同仁协作的领导者。或许第一步就是为这些人扩大机会。\n\
  \n**帕吉萨斯：** 这是企业当下即可采取的绝佳策略。我们来谈谈什么驱使您成为领导者。作为 HPE 的高级管理人员，您的工作和角色中最让您兴奋的是什么？\n\n\
  **蒂彭斯：** 我想说几点。第一是真正推动增长的机会。我在这家公司已经工作了二十多年，这出乎我自己的意料。如今很少听到这样的故事，尤其在科技行业。但我经历了\
  \ HPE 的多次转型。多年来公司通过大量收购和剥离发生了巨大变化。随着公司形态的改变，我的角色也在演变。能够在这样一个层级上帮助推动公司的积极增长轨迹，创造商业影响并做一些有益之事，这让我感到兴奋。我的核心驱动力是使命感。我天真地认为自己能改变世界。我的动力源于行善的渴望与推动公司业务增长的决心。\n\
  \n其次，作为领导者，我倾向于选择具有智力挑战性的业务角色。我担任首席可持续发展官（CSO）已有六个月，我认为这个领域在过去六个月的变化可能比过去六年甚至十六年都大。这是一个极具吸引力的领域。\n\
  \n在职业生涯的这个阶段，我享受留下传承。接手这个角色时，我接手了一个规模很小的环保专家团队，然后建立了管理层级和清晰的职业路径。我还构建了真正的支持体系，即使我离开后也能持续运作。构建这样的基础设施，为下一代领导者铺路，对我至关重要。在行业亟需的时刻打造这样的体系非常令人振奋，而且这种需求短期内不会消失。我无法在未来十年全程见证其成果，但我正在为长期成功奠定正确的基础。这总是令人兴奋，也是驱动我作为领导者的动力。\n\
  \n**帕吉萨斯：** 您是如何一步步成为 HPE 首席可持续发展官的？\n\n**蒂彭斯：** 我成为律师是因为在我成长的年代，人们认为你应该去读商科、医学院或法学院。我在法学院期间开始了科技行业的职业生涯。法学院毕业后，我在科技领域从事了多年的法律支持工作。尽管我对处理知识产权和许可谈判等有意义且充实的法律工作感到满意，但我仍会花同样多甚至更多的时间，穿着公司\
  \ Polo 衫在周末去社区做志愿者，或者参加仁人家园（Habitat for Humanity）的建房活动。我最喜欢的项目之一是支持我们的供应商多元性计划，参加贸易展会，与希望成为惠普供应商的少数族裔企业主交流。这令人振奋，因为它帮助了小企业，并在弱势社区创造了财富。这对我来说是一个“顿悟”时刻。做这些工作比我的本职法律工作更能让我获得成就感。\n\
  \n2006 年，我抓住了领导可持续供应商多元性计划的机会，离开了法律岗位。事实上，我自愿降级，从法律层级转到供应链中一个稍低的职位，去推动我热爱的项目。这是我职业生涯中最明智的一步，因为我得以从个人贡献者成长为主管，再到经理，最终将这个专注于创业和小企业多元性的供应链项目发展壮大。随着我在该领域建立起思想领袖的声誉，这或许是我职业生涯中最具分水岭意义的一步。\n\
  \n我扩大了这个项目，成为采购领导者，并涉足与环境可持续采购和采购合规相关的相邻领域，这让我得以成长为采购领导者和高管。2012 年，我意识到是时候尝试新事物了。我毅然转到了公司房地产部门，因为我知道简历上需要运营经验。如果想成为公司的高级领导者，我必须证明自己能推动重大事务。\n\
  \n在房地产部门，我的职责范围极广，从洗手间清洁到食堂满意度都有涉及。我的团队必须确保 CEO 始终认为洗手间是干净的。我们当时的首席信息官连续两天在总部食堂买三明治，觉得面包不新鲜。我不得不迅速组建一个面包质量专项小组，寻找新的面包供应商。这些小例子看似微不足道，但这个岗位很有价值，因为它帮助我更深入地理解公司的运营层面。我的职责范围中也包含了我们房地产资产的环境可持续性。\n\
  \n2014 年，公司让我担任首席多元官。我最初拒绝了，原因我们之前讨论过。我不想成为高级领导层中唯一的非裔美国人专业人士，也不想把自己“多元”进职业死胡同。我知道这项工作非常重要且必要，但不确定自己是否想成为那样的领导者。最终，当\
  \ CEO 说“公司此刻需要你担任此职”时，我接受了。当时科技行业的多元性缺失问题极其突出，坦白说公司正因此受到审视。我们需要在困境中摸索前行。我接下了这个任务，在担任此职的五年里，我们做了很多好事：实现了董事会的多元性，制定了大量良好政策，提升了公司内部的多元性，并聚焦于包容性。这精彩的五年最终引领我走向首席可持续发展官（CSO）之位，这个角色拓展了我已从事领域的相邻范畴，让我得以在新领域施展拳脚。\n\
  \n**帕吉萨斯：** 您职业生涯中的一个主题是主动进入公司新领域以获取新技能和专长。另一个主题似乎是您在不掌握业务线或产品损益表（P&L）的情况下，影响了关乎\
  \ HPE 成功的关键决策，例如供应链多元性和设施运营。这种职责与问责的结合正是 CSO 们常见的处境。\n\n对于一位在市值数十亿美元的跨国公司中、但未掌握`P&L`的\
  \ CSO 而言，成功的促成因素有哪些？\n\n\n**蒂彭斯：** 根据我自身的经验，有几个关键因素。首先是领导者的背景和构成。当我担任`CSO`一职时，我已在公司工作了二十年，期间与高层领导有交集，并与他们及董事会建立了良好关系。我上任时已具备很高的可信度。这一点很重要，因为公司在考虑需要安排谁来担任`CSO`这类职位时，这个人必须拥有同等水平的业务信誉，能够证明需要投入大量新现金来扩充团队和投资各个领域是合理的。\n\
  \n另一个因素是结构。你需要建立一个能够支持整个公司达成共识、协作和发挥影响力的架构。在慧与，我们有“`生生不息进程战略委员会`”。这是一个定期召集的团体，其代表来自公司的各个业务部门。这是一个如何将可持续发展嵌入公司治理的实例。\n\
  \n最重要的因素是要有面对面的互动、建立融洽的关系，向那些对损益负责的业务领导者表明，可持续发展不仅仅是一项公司指令。这才是关键。我来这里是为了帮助公司取得成功。同时，我也是为了帮助每一位领导者取得成功。如果他们的薪酬与这一领域的绩效挂钩，我可以提供帮助；或者，我可以在他们的销售宣传和市场开发方面提供协助，因为我的团队在客户对这一领域的看法方面拥有独特的视角。\n\
  \n首席可持续发展官必须以高度协作、合作的方式开展工作，而不能仅仅被视为在推行“又一项公司指令”，历史上多元化和包容性团队的失败往往正源于此。它们在人力资源部门的孤岛中设定了激进的目标，然后对那些未能达标的领导者加以惩戒。\n\
  \n对于可持续发展，我们不能把它定位为“额外任务”。必须以可信的方式将其定位为业务的核心——不仅仅是为了在合规方面打个勾，而是要成为市场上的差异化竞争优势。我们的目标是，用“胡萝卜”而非“大棒”的方式，与领导者协作互动。\n\
  \n**帕吉萨斯：** 有没有一个故事可以说明，您的团队是如何与业务领导者合作，在创造商业价值的同时，也创造了环境或社会影响？\n\n**蒂彭斯：** 我想最近的一个例子是在“*社会*”方面。我们最近有一位领导者接手了我们网络业务的收购项目。该业务的创始人在领导了十年后刚刚离开。这位新领导者和我抽出时间进行了交谈。他对这项业务非常陌生，不太了解过去发生过的亮点。我们提醒他，“你的团队在新冠疫情期间做了一些了不起的事情，当时我们利用你的\
  \ Wi-Fi 连接套件，帮助学校和医院接入了网络。”\n\n在新冠疫情期间，你可能听说过有学生在家无法上网的故事。有时他们能想到的最好办法就是开车去学校，这样就能坐在车里上课。当时使用了大量的慧与技术来制造套件以解决这个问题。我们当时是出于应对新冠疫情的\
  \ reactive 反应才这么做的，但我们现在与这位新领导者坐下来讨论，希望将这个项目延续到市中心的学校和医院。虽然一切尚未完成，但我们一定会在那里有所作为。\n\
  \n这是一次协作的“顿悟时刻”，我们能够携手合作，从社会和商业两个层面都创造出佳绩。这位业务领导者知道，我们正在做的善举将使他在市场上区别于竞争对手。这是一个可持续发展团队与业务团队之间合作的突出例子。\n\
  \n**帕吉萨斯：** 这似乎是 ESG 原则融入核心产品的一个绝佳范例。随着可持续发展越来越融入并成为企业运营和成功的关键，您预见到哪些紧张关系或挑战？最后，您对未来哪些方面持乐观态度？\n\
  \n**蒂彭斯：** 在某个时刻，我想我们所有公司都需要决定我们代表什么。我想到了一个维恩图，它描绘了围绕 ESG 的战略工作。右边的一个圆圈由投资者、美国证券交易委员会、评级机构、CDP\
  \ 以及道琼斯可持续发展指数驱动。它代表我们不得不做的、按部就班完成的所有事项。左边的另一个圆圈代表让世界变得更美好，致力于创造影响力，成为一股向善的力量，并在社会问题上表明立场。\n\
  \n如果我们要改变我们生活的世界，这两个圆圈有重叠之处，但我担心，对右边圆圈（虽然至关重要）的关注会阻碍对左边圆圈的关注。为什么？如果我们到了必须获得法务团队批准的程度，因为所有这些衡量指标都将被报告在\
  \ 10-K 文件中，那么我们就无法做出任何大胆的立场声明。正如我之前提到的，其中一些指标仍在演变之中。如果我们不审慎地考虑如何建设团队以及处理这两个圆圈的方法，这可能会扼杀\
  \ ESG 战略的成功。\n\n为了改变世界，我们必须继续专注于成为一股向善的力量，并推动有意义、有影响力的变革。渐进式的努力是不够的。我们需要的是变革性的改变，这需要公共和私营部门的合作，并且我相信技术将使一个更加可持续的未来成为可能。\n\
  \n\n### 12. 詹姆斯·高恩\n\n威瑞森通信全球供应链运营高级副总裁兼首席可持续发展官\n\n`詹姆斯·“吉姆”·高恩`现任威瑞森通信全球供应链运营高级副总裁兼首席可持续发展官。吉姆深度参与推动创新和可持续技术的发展，并主导发行了威瑞森首支**10\
  \ 亿美元**绿色债券。在吉姆的领导下，截至 2020 年，威瑞森已发行**20 亿美元**绿色债券，为公司的可再生能源、能效提升、水资源保护及再造林项目提供资金。吉姆还推行了碳强度指标、无纸化办公、减少废弃物、回收利用以及报废材料回收计划的管理。\n\
  \n在供应链管理方面，吉姆负责威瑞森业务覆盖的 150 个国家的所有库存规划和物流运营，并同时主管威瑞森的全球制造业务。\n\n吉姆是宾夕法尼亚州立大学斯米尔可持续发展咨询委员会的成员，同时也是全球电子可持续发展倡议（GeSI）的现任主席。\n\
  \n**克里萨·帕吉萨斯：** 威瑞森在 2020 年《财富》世界 500 强中排名第 20 位，营收超过 1280 亿美元。请谈谈支撑这一排名和营收水平的威瑞森业务服务与运营的广度。\n\
  \n**吉姆·高恩：** 威瑞森在 150 个国家运营，为无线和有线技术提供全面的消费者、小型企业和企业服务。我们规模化的多用途网络为客户提供在数字经济中保持连接并蓬勃发展的所需服务与解决方案。\n\
  \n我们的消费者和小型企业服务主要集中在美国，我们是美国最大的无线运营商。这部分业务在三个关键领域表现出色——家庭、价值与移动。正如我们从疫情以及向远程工作和学习的转变中所看到的，客户依赖我们的网络，并因我们提供的与其生活最相关的独特体验而留在这里，无论他们是在家中、学校、工作场所还是旅途中。\n\
  \n威瑞森在不同程度上支持着全球几乎所有《财富》世界 500 强公司。随着企业客户寻求实现计算机视觉、增强现实和机器学习等解决方案，对 5G 技术的需求正在增长。对于大型企业而言，要实现其可持续发展与负责任的商业目标，这些解决方案至关重要，因为它们旨在提高生产力、增强安全性并降低延迟。\n\
  \n**帕吉萨斯：** 考虑到这些业务的多样性和广度，威瑞森的可持续发展战略涵盖哪些范围？\n\n**高恩：** 我们信奉“绿色工作，绿色生活”。我们将可持续发展融入网络运营的方方面面——从我们全球超过\
  \ 13 万名员工，到我们的供应商，再到客户手中的设备，帮助他们减少碳足迹。我们的客户希望知道，当他们拿起电话、打开电视、笔记本电脑或游戏主机时——无论是在家中还是山顶上——网络信号都能覆盖。\n\
  \n作为一家负责任的企业，威瑞森深知网络必须尽可能高效、稳健且富有弹性。网络是我们企业的核心所在。通过可持续的供应链来运营可持续的网络，这是我们的基因。\n\n\
  当我们审视整个供应链时，我们正在落实 CSR（企业社会责任）标准，以确保我们的供应商与我们一同思考三重底线。例如，我们确保大型无线电设备供应商尽可能以可持续的方式制造他们的设备。换句话说，我们会询问他们使用的零部件类型、在设计时如何考虑设备报废问题，以及他们在涉及\
  \ 3G、4G、5G 时，是否在为循环经济创造产品。\n\n威瑞森正在非常努力地将可持续性融入消费者的每一次体验中。当他们进入威瑞森门店或大楼时，会在正门上看到美国环保署（EPA）的\
  \ ENERGY STAR（能源之星）标签认证。或者，他们可能会在我们办公楼停车场看到太阳能电池板——我们在那里安装了现场可再生能源设施。威瑞森已连续八年获得“能源之星年度合作伙伴奖”，我们的目标是到\
  \ 2035 年实现运营净零排放。我们对此感到非常自豪。\n\n当顾客进入店内时，他们会看到由回收材料制成的手机壳和配件的选择，以及回收旧设备的机会。作为我们设备循环经济的一部分，我们有一个影响深远且覆盖面广的重复使用计划。当客户准备升级到新设备或购买另一件设备（如耳机）时，我们会激励他们返还旧设备，以便我们赋予它第二次生命。这些只是威瑞森帮助客户对环境更加负责的部分方式。\n\
  \n**帕吉萨斯：** 您如何让这条庞大的供应链也具备韧性？\n\n**高恩：** 关键在于提出正确的问题，并了解构成你供应链的产品的材料和劳动力来源。你必须有合适的合作伙伴，他们不仅能够达到我们的高标准，而且在自身运营中保持透明，并能轻松回答：你在哪里生产？你如何生产？你的核心材料来自哪里？你建立了哪些冗余保障？你的供应链是否足够多元化和灵活，以应对自然灾害、政治动荡和经济动荡等意外事件？\n\
  \n一个可持续的供应链必须关注地缘政治和宏观经济，同时也要百分之百地意识到气候变化所带来的环境问题，其影响正日益加剧。\n\n**帕吉萨斯：** 可持续发展战略具有极强的跨学科性。为了实现最佳效果，这个团队应该设在组织架构中的哪个位置？\n\
  \n**高恩：** 我认为你需要将这个团队置于公司核心运营部门，以确保它不会被孤立在企业的职能部门中。将可持续性嵌入运营，可以在组织内部带来不同层次的可见性、问责制和承诺。这就是我在那些最为成功的同行公司中所看到的做法。\n\
  \n**帕吉萨斯：** 我们来谈谈您如何与高管层同事及董事会合作。您一个人做不到，对吧？\n\n**高恩：** 如果你看看过去三年，我们董事长兼首席执行官汉斯·韦斯特伯格是最好的倡导者。他对企业社会责任和可持续性有着深刻的理解和贯彻。他是这一领域不知疲倦的领导者，我甚至都很难跟上他的步伐。\n\
  \n\n\n汉斯担任联合国基金会董事会成员，并参与了联合国可持续发展目标（`SDGs`）的制定。他深知设定宏伟目标的过程与重要性，因为此事关乎重大，且蕴含着推动业务发展以及惠及所有利益相关者（从客户到员工）的创新机遇。从一开始，汉斯就一直是倡导者，并鼓励我和我的团队设定远大目标、加倍努力。这份承诺已渗透到我们公司，我每隔一个月就会向他的直接下属汇报进展情况。领导团队的每位成员都为我们\
  \ ESG（环境、社会与治理）的优先事项带来了各自独特的见解、经验和支持。尽管他们背景和经历各不相同，但都渴望不断突破极限。无论是寻找机会推动教育进步、鼓励女性投身\
  \ STEM（科学、技术、工程与数学）领域、为客户提供解决方案、提升业务效率，还是减少碳足迹，我都得到了每位成员的支持，共同探寻利用我们的技术、运营和员工来创造可持续未来的方法。\n\
  \n**帕吉萨斯：** 你们的可持续发展战略与 ESG 如何衔接？\n\n**高恩：** 在威瑞森，我们相信，建设更美好的未来需要让气候意识贯穿整个组织，成为“业务常态”。这包括对清洁能源的投资、设施和基础设施的升级以及植树造林项目。威瑞森的首席\
  \ ESG 官贝丝·萨斯法伊，对这一使命至关重要。她负责监督威瑞森履行 ESG 承诺的努力，通过监控目标设定和制定适当的报告，向股东分享进展。\n\n**帕吉萨斯：**\
  \ 最高管理层是关键伙伴，但并非唯一伙伴。威瑞森的员工在公司的可持续发展战略中扮演什么角色？\n\n**高恩：** 你的实力取决于板凳席上的最后一名球员，无论他是否上场。这是我从大学打球以及后来担任教练的经历中学到的。我以这种方式对待我的工作。你必须珍视每位成员的独特性，我们也深知创新源于多样性，这关系到公司的\
  \ DEI（多元、公平、包容）政策和实践。幸运的是，我们拥有一支实力强大的球员阵容。每一位员工都在我们的努力中扮演着角色。\n\n**帕吉萨斯：** 对于一个拥有\
  \ 132,000 名员工的公司来说，一个七人团队来管理可持续发展战略，是不是太小了？\n\n**高恩：** 我经常被问到这个问题。在威瑞森这样的大公司里，组建一个三十、四十甚至五十人的团队很容易。但我相信，保持核心可持续发展团队的精简，可以让责任得到分担，让公司里的每个人都感受到主人翁意识。这样，我们所有的员工都明白，他们要在采纳和实施我们的可持续发展战略中发挥作用，而不仅仅是我或我的团队。同时，我们这个七人团队正在领导一些最大的项目，无论是可再生能源、回收还是循环经济。我们不断面临挑战，需要深入组织内部，在各地建立本地化的项目。\n\
  \n**帕吉萨斯：** 那么，你们如何与分布在全球各地的员工一起，在本地建立可持续发展呢？\n\n**高恩：** 我们为地球和气候保护做正确事情的动力，很大程度上来自于我们的员工自身。十年前，根据一位员工的建议，我们成立了绿色团队。如今，我们在\
  \ 51 个国家拥有超过 50,000 名员工加入绿色团队。这些团队围绕影响当地社区的问题动员员工，并激发他们回馈社会的潜力。\n\n例如，美国的绿色团队在当地社区举办电子产品回收集会。我们每年大约举办\
  \ 27 次这样的活动。员工自愿参与，接受你的电子废弃物，并给你一份销毁证明。2020 年，由于新冠疫情，我们只举办了几场线下活动。我们举办的 19 场回收活动收集了超过\
  \ 65 万磅的电子废弃物（e-waste）。自 2009 年以来，威瑞森已累计收集超过 480 万磅的电子废弃物，目标是在 2022 年前收集并回收 500\
  \ 万磅电子废弃物。\n\n在印度金奈，我们有一位绿色团队的带头人，我们看到了该团队激发了超越环境可持续性的想法。例如，在团队于厂区举办植树活动的同时，他们还与“带女儿上班日”合作，以鼓励性别赋权、对\
  \ STEM 的兴趣以及女性就业。正如你可以想象的，这意义重大，我们鼓励绿色团队的领导者在可持续发展问题上跳出固有思维。在爱尔兰，都柏林团队每年都会举办穿越城市的利菲河清洁活动。这一切都由绿色团队成员自愿完成，我们还有更多关于本地员工如何通过绿色团队动员起来，将我们的座右铭“绿色工作，绿色生活”付诸实践的案例。\n\
  \n**帕吉萨斯：** 吉姆，每天是什么驱使着你？你为什么起床并为之奋斗？\n\n**高恩：** 首先，是家庭。我来自一个大家庭，能拥有一个大家庭我感到非常幸运。所以，这\
  \ 100%是我每天的动力。其次，我非常明确地决定为威瑞森工作，并在过去的二十多年里一直留在这里。这与我祖母当年曾是电话接线员这一事实无关！根本不是这样。\n\n\
  我永远不会忘记和我父亲的谈话，他鼓励我大学毕业后就去电话公司工作，因为这份工作“稳定”。我当时并没有马上接受这个想法，但后来我思考了威瑞森提供的救生服务。我刚开始工作时，还没有手机。一切都围绕着\
  \ 911。快进到今天。一切都围绕着急救人员、消防员、急救人员和警察，他们使用我们的网络和设备进入险境去帮助他人。这就是我在这里以及为威瑞森工作的热情所在。\n\
  \n**帕吉萨斯：** 威瑞森如何展现其目标？\n\n**高恩：** 威瑞森的目标经历了一个演变过程。我们理解我们的技术所能带来的影响。我们希望确保我们的资源、技术和员工朝着一个共同的使命努力，即通过行动推动世界前进。为此，威瑞森启动了一项名为“公民威瑞森”的新负责任商业计划，以推动经济、环境和社会进步。\n\
  \n通过“公民威瑞森”，我们确立了三个关键支柱来聚焦我们的负责任商业目标——数字包容、气候保护和人类繁荣。威瑞森承诺，到 2030 年，为一千万青少年提供在现代经济中茁壮成长所需的数字技能培训，并为一百万家小企业提供在数字经济中蓬勃发展的资源。我们致力于到\
  \ 2035 年实现运营碳中和，并设定了经批准的科学碳减排目标。为实现这些目标，我们正在投资可再生能源和能效项目。最后，我们正通过技能提升和再培训创造机会，为\
  \ 50 万人做好迎接未来工作的准备。我们还于近期宣布，我们旨在帮助脆弱社区、弥合数字鸿沟的负责任商业投资，有望在 2025 年前超过 30 亿美元。\n\n\n\
  \n我们希望以世界公民的身份，汇聚资源，为全球的小城镇、大城市及乡村社区带来影响，尤其关注那些脆弱且资源匮乏的地区。当你问我是什么让我从床上爬起来，是的，是我的家庭，但也包括我所做的工作。我在这家公司担任着最好的职位，但对我来说，我为谁工作这件事至关重要。\n\
  \n**帕吉萨：** 你是在说贵公司的目标超越了股东利益吗？\n\n**高恩：** 绝对如此。我们致力于为四类利益相关者创造共享价值——我们的客户、员工、股东以及社会公众。\n\
  \n**帕吉萨：** 如今的股东对威瑞森有什么不同于以往的期望吗？\n\n**高恩：** 过去五年里，我观察到的最显著变化是，持有威瑞森股票的股东开始提出他们从未问过的问题。人们对`ESG`——业务的环境、社会和治理因素——的兴趣与日俱增。他们希望确保我们拥有负责任的商业实践，并是一家目标导向型的公司。\n\
  \n**帕吉萨：** 威瑞森在 2019 年至 2020 年间发行了 20 亿美元的绿色债券。发行绿色债券是威瑞森参与这波责任投资浪潮的信号吗？\n\n**高恩：**\
  \ 百分百是。更重要的是，我们非常审慎且透明地预先确定了将如何使用这些绿色债券，并每年进行报告。这些绿色债券用于资助可再生能源、能效提升、绿色建筑、可持续水资源管理以及生物多样性与保护项目。除了发行绿色债券本身，对其使用情况的报告也极其重要，因为一些`ESG`投资者希望了解我们投资的环境影响，以及我们如何实现可持续发展目标。\n\
  \n**帕吉萨：** 一家财富 500 强公司的 CEO 向你咨询如何在他们公司启动可持续发展战略和团队。你会给这位 CEO 什么建议？\n\n**高恩：**\
  \ 如果我正坐在一位想要启动可持续发展实践的财富 500 强公司 CEO 旁边，我可能会告诉他们，在可持续发展领导者身上应该寻找哪些特质。你需要一个既能着眼内部又能放眼外部的人。你需要一个能够挑战你的人。当你踏上可持续发展之旅时，关键在于一种意愿和开放的态度，要能说：“我没有所有答案，我会倾听和学习。”其次，我会告诉他们，作为\
  \ CEO，当你承诺一个可持续发展目标时，你必须准备好将其贯彻到底，并考验你的毅力。而且，你需要一位会与你并肩前行的可持续发展领导者。\n\n**帕吉萨：**\
  \ 为什么毅力对可持续发展领导者如此重要？\n\n**高恩：** 新冠疫情就是一个完美的例子。我们很容易将可持续发展搁置一旁，专注于业务。但威瑞森没有这样做，我们继续推进我们宏大的可持续发展目标和日常活动。\n\
  \n**帕吉萨：** 你还会对他们说什么？\n\n**高恩：** 两件事：承认失败，以及与他人合作。\n\n一个完美的例子是我们将车队（比如卡车）从燃油转换为天然气并大规模推广的项目。天然气动力车辆运行得很好，维护成本也更低。但很多人仍然对这种变化感到非常焦虑，而且我们无法让大型`OEMs`（原始设备制造商）持续生产这些车辆。这最终影响了我们的推广，导致我们无法将该项目规模化。\n\
  \n然而，我有机会与巴拉克·奥巴马总统任内的交通部长雷·拉胡德和能源部长朱棣文交谈。我们讨论了基础设施的需求，以及公私合作伙伴关系在把事情做得更好、相互学习方面的作用。这坚定了我对通过合作伙伴关系寻找可持续解决方案价值的信念。这是我作为一家全球财富\
  \ 500 强公司的可持续发展领导者工作中的关键部分。\n\n\n\n### 凯文·哈根\n\n铁山公司环境、社会与治理战略副总裁\n\n`凯文·哈根`是铁山公司环境、社会与治理（ESG）战略副总裁。该公司是一家存储和信息管理服务企业，截至\
  \ 2020 年，其营收超过 42 亿美元，在 60 多个国家运营着超过 1450 个设施。凯文为全球公司领导者和业务部门提供咨询，帮助制定并实施可持续商业战略，以应对广泛的\
  \ ESG 议题，例如气候与能源足迹、人权、社会影响、循环经济、ESG 报告、企业慈善以及社区参与。凯文领导公司战略，以实现其致力于*《气候承诺》*，即在 2040\
  \ 年前实现净零排放的目标。\n\n在 2014 年加入铁山公司之前，凯文在休闲设备公司（REI）领导可持续商业战略。他还曾为可再生能源、航空航天和军用电子市场的公司领导工程、营销和业务拓展职能。\n\
  \n凯文在清洁能源买家协会（CEBA，前身为可再生能源买家联盟 REBA）董事会任职，并服务于其他可持续发展咨询委员会和理事会，例如美国房地产投资信托协会（Nareit）、可持续品牌和净影响力组织。他还是哈佛拓展学院可持续发展研究生项目的\
  \ ESG 报告讲师。\n\n**克里萨·帕吉萨斯：** 凯文，请告诉我你的职业生涯，以及你是如何走到今天在铁山公司领导 ESG 工作的。\n\n**凯文·哈根：**\
  \ 我大学本科是工程背景，毕业后加入了一家航空航天和国防承包商，有机会参与为民用和军用飞机及系统设计和开发定制部件。这是一个很好的机会，因为我最终横跨了客户需求与工程设计之间的对话，这包括了开发、测试和推出新产品的过程。\n\
  \n早期的职业经验教会我如何说多种商业语言：客户的语言，以及我们内部设计和开发的语言。学会如何弥合组织孤岛是可持续发展商业技能和能力体系中的一项重要能力。后来我常驻法国，真的必须学习两种语言。\n\
  \n在国防和航空航天领域工作后，我加入了一家可再生能源领域的小型初创公司。当时它规模不大，就像个双车位车库的运营点，但团队人才济济，产品一流，增长潜力巨大。这非常令人兴奋，因为当时正值可再生能源、太阳能和风能行业的早期增长阶段，重点是从离网解决方案转向并网可再生能源行业。Trace\
  \ Engineering 是美国第一家开发和交付能将太阳能电池板连接到电网，并为家庭供电的逆变器和电力电子设备的公司。从很多方面来说，这都是一个巨大的成功，我们最终上市了。\n\
  \n然而，我认为专注于成功的 IPO（首次公开募股）分散了我们对在可再生能源领域有所作为这一核心目标的注意力。我们开始更多地考虑赚钱，而不是创造改变，从某种程度上说，我们迷失了方向。我和其他人一样有罪。结果，业务发展不如预期，我有些幻灭地离开了公司。\n\
  \n2003 年，我创办了自己的可再生能源咨询公司。不久后，我参加了西雅图的一个“走向绿色”会议。我看到一个小组讨论，有吉姆·哈茨菲尔德和吉福德·平肖三世参加。吉姆是可持续商业领袖，也是\
  \ Interface 公司首席执行官雷·安德森的得力助手。他谈到了雷的“胸口被矛刺中的时刻”，这改变了他对商业和可持续发展的看法，促使雷为 Interface\
  \ 及其地毯和地板产品设定了新的可持续发展方向。雷的故事记录在他的书*《一个激进实业家的自白：利润、人、目的——通过尊重地球来经商》*（雷·C·安德森与罗宾·怀特著，圣马丁出版社，2009\
  \ 年）中。吉福德不仅谈到了可持续商业的愿景，还谈到了需要培训具有商业经验的人在可持续发展领域工作，以便他们能从内部帮助企业转型。他和他的妻子莉芭以及其他人共同创办了一所新的研究生院。\n\
  \n听到 Interface 的故事并观察可持续商业运动的进展，大约三周后，我发现自己身处不列颠哥伦比亚省的一个偏远岛屿，坐在吉福德旁边，参加班布里奇研究生院首个可持续商业\
  \ MBA 项目的启动静修会。在两年多的时间里，我学到了很多。我有幸接触到那些处于商业与可持续发展交叉点的人们，从教授工业生态学的麻省理工学院教授约翰·埃伦费尔德，到谈论自己转向可持续商业的雷·安德森本人，再到专注于应对气候变化紧迫性的艾默里·洛文斯、贾宁·贝纽斯和保罗·霍肯，以及其他许多人。\n\
  \n项目结束后，我自认为理解了作为一门学科的可持续发展相关的文献和思想。不久后，我获得了加入 REI 的绝佳机会，这是一家户外行业零售商和消费者合作社，负责实施新任\
  \ CEO 莎莉·朱厄尔的可持续商业愿景。\n\n大约在 2004 年和 2005 年这段时间，许多企业开始尝试可持续发展。有一些著名的例子，如巴塔哥尼亚、天伯伦和本杰瑞。当时加入这家合作社的有趣之处在于，它已经是价值数十亿美元的企业，而在这个规模上致力于整合可持续商业思维的公司并不多见。我们从衡量指标、数据、透明度和问责制这些基本工作开始。这导致了合作社思维方式的转变。\n\
  \n2013 年初，莎莉·朱厄尔被奥巴马总统提名加入内阁，担任内政部长。在电视上看到我的老板出席参议院确认听证会，感觉很不真实。当总统将她介绍为一种新商业方式的领导者时，我认为这对合作社来说是一个极好的成功标志。而且我们有成果可以证明。REI\
  \ 的销售额翻了一番，从 10 亿美元增长到略高于 20 亿美元，而其绝对能源消耗却下降了。我们在门店安装了第一批太阳能电池板，并正在建设首批净零能耗配送中心之一。在社会方面，我们开始寻找利用合作社的力量来提高户外活动和户外行业包容性的方法，试图让人力运动对每个人都更友好。合作社利用其在行业中的力量和影响力，引领供应链中人权和环境绩效方面的变革，帮助发起了可持续服装联盟等行业协会。\n\
  \n在 REI 工作了七年多后，随着新 CEO 的到来，我觉得也许是时候退一步，“让开道路”，让业务做得更多。于是，我开始了自己所谓的“滑雪假”。然后，一位名叫萨曼莎·约瑟夫的出色人物找到了我。她正在铁山公司领导实施一项可持续商业战略，并告诉我，他们是“会粉碎东西的登山者”，我说：“这些人是我的同道中人。”\n\
  \n**帕吉萨斯：** [笑] 真有趣！\n\n**哈根：** 谢谢你的笑！当然，内部笑话是，铁山公司的员工称自己为“登山者”（mountaineers）。而“粉碎”（shred）不是指滑粉雪的俚语。它指的是我们安全的纸张销毁业务。我不是说这里有虚假宣传，但我当时确实期待更多滑雪元素！\n\
  \n但机会非常棒。萨曼莎作为催化剂和创业型个人，在铁山公司拓展可持续商业理念方面做了出色的工作。在招聘过程中，我与 CEO 威廉·米尼进行了一次精彩的面试。当然，我是转述那次对话，但我听到他说，公司在环境和社会责任方面有着伟大的精神，因为铁山品牌和业务的核心是信任。核心业务是管理和保护客户最有价值、最重要的信息和资产。他们期望我们做正确的事，但他真正想表达的是，“做正确的事”不是一个商业计划。我们需要重新思考常规业务。这就是我来到铁山公司的原因。\n\
  \n**帕吉萨斯：** 铁山公司提供哪些商业服务？\n\n**哈根：** 对于那些可能不熟悉铁山公司的人来说，我们是一家公开上市的房地产投资信托基金（REIT），主要服务\
  \ B2B 客户，在 60 多个国家拥有超过 1450 个设施。我们在全球约有 25,000 名员工，年销售额约为 42 亿美元。历史上，我们一直从事文档和资产存储业务。但我们意识到，随着客户信息从纸质转向数字化，我们的业务也需要改变。\n\
  \n如今，我们依然拥有为超过 95%的财富 1000 强企业服务的增长中的信息存储业务，并提供全套数据与信息管理及隐私保护解决方案。从文档数字化到成为全球十大托管数据中心提供商之一，再到成为\
  \ IT 资产管理领域的领导者，我们正在帮助客户实现数字化转型。\n\n**帕吉萨斯：** 铁山公司的可持续发展战略最初是什么样的？现在又是什么样？\n\n**哈根：**\
  \ 与 2014 年我们发布第一份可持续发展报告相比，我们已经取得了长足的进步。2021 年，我们宣布了 20 个雄心勃勃的 ESG 目标。我们有六个长期的理想目标，例如签署《气候承诺》，承诺到\
  \ 2040 年实现净零碳排放。此外，我们还做出了 14 项“在路上”的承诺，包括更快的近期温室气体（GHG）减排目标，以及到 2025 年让女性占全球领导团队的比例达到\
  \ 40%。我们的目标涵盖了我们所有最重要的 ESG 议题，并对员工、社区和客户做出了承诺。\n\n展望未来，我们增长战略的一个关键部分是融入可持续商业思维——从数据中心的气候影响，到与电子资产相关的电子垃圾问题，再到道德与反腐败、包容性与多样性，以及供应链中的人权。我们面临的\
  \ E、S 和 G 议题清单很长。我们知道，利益相关者期望企业成为解决方案的一部分，而不是问题的一部分。我们认为，解决业务中的 ESG 挑战不仅对业务本身有益。它也为我们在帮助客户和社区实现同样目标时取得更大成就打开了大门。\n\
  \n**帕吉萨斯：** 鉴于铁山公司的业务核心是考虑信息和数据的长期存储，铁山公司如何看待可持续发展战略和目标的更长远的眼光？\n\n**哈根：** 作为一家上市公司，我们无法避免按季度衡量业绩，但我们确实拥有一个固有的潜在优势，即能够比一些组织思考得更长远。我们与客户的关系以数十年计，平均每个文件箱会与我们共存十五年。因此，我认为我们具备一些有利条件。另一方面，我们并不具备通常与可持续发展讨论相关的许多要素。我们主要是一家\
  \ B2B 公司，而不是 B2C 公司。我们是一家基于服务的公司，而不是基于产品的公司。就像我在 REI 时一样，人们会说：“是的，这在巴塔哥尼亚能做到，但在这里绝对行不通。”现在，既然它在\
  \ REI 这样的公司取得了成功，人们可能会说：“嗯，它在 REI 行得通，但在铁山公司肯定不行。”\n\n**帕吉萨斯：** 你为什么认为人们最初会认为铁山公司不能像\
  \ REI 那样解决可持续发展问题？\n\n**哈根：** 我怀疑，那些习惯于传统取舍思维的人——要么做正确的事，要么做生意的事——即使看到一家企业成功地同时实现了更多这两方面，他们也会想办法为自己的观点辩护。他们可能会说：“当然，这在消费者合作社行得通，但在上市公司肯定不行。”\n\
  \n这是过去五六年我们在铁山公司一直在讨论的话题，因为我们以能够产生更好结果的方式来应对环境、社会和治理挑战。我们发现自己在挑战那个必须在事物间取舍的范式。当我们首先弄清楚如何降低成本时，宣传我们的长远眼光就变得容易了。\n\
  \n**帕吉萨斯：** 当企业将可持续发展融入其业务时，你是否接受或拒绝必须做出取舍的观点？\n\n**哈根：** 这是传统智慧，即可持续发展存在取舍。要么做“正确的事”，要么做“错误的事”，或者换句话说，做“生意的事”。这种取舍心态渗透到普遍思维中，认为“绿色产品总是更贵”，或者“它效果也不好”，或者两者兼有。\n\
  \n传统智慧认为，如果你真的想在职业生涯中有所作为，你就加入和平队。你不会加入一家公司。你要么做正确的事，要么做生意的事。人们很容易陷入安德鲁·卡内基那种先赚大钱，然后再捐出去的思维模式。鉴于二十世纪初卡内基基金会资助了美国大约\
  \ 50%的图书馆，这可以说是一种有争议的方式。然而，卡内基企业最初造成的环境破坏很可能至今仍未结束。\n\n对于那些有幸被赋予应对可持续商业挑战职责的可持续发展领导者来说，我们的机会在于，在找到合适的商业解决方案之前，坚持不接受取舍的张力。这是我们的义务。我们能够找到解决方案，不仅仅是因为我们是乐天派。而是因为我们开发了工具、技术、能力和硬核商业技能，使我们有更好的机会以新的、更好的方式解决问题，而不是接受取舍。\n\
  \n我们更善于协作。我们更具创新性。我们有更好的数据。我们通过社会绩效的视角来理解商业挑战，将其视为商业挑战。我认为这给了我们更多以不同方式解决问题的工具。这也是系统思维方法的一个体现。我很欣赏德怀特·艾森豪威尔总统的一句名言：“每当我遇到无法解决的问题时，我总是把它变得更大。我无法通过试图缩小问题来解决它，但如果我把问题变得足够大，我就能开始看到解决方案的轮廓。”\n\
  \n当我们找到更好的商业解决方案时，我们就能大规模地实施。正如我和我们的首席财务官开玩笑说的那样，一旦我们弄清楚如何从中赚钱，就没人能阻止我们了。最重要的是，我们不仅能够做更多，而且其他企业也能效仿。因为现在你不需要有信仰。你只需要看到更好的解决方案，然后执行。\n\
  \n**帕吉萨斯：** 能否举一个例子，说明某样东西现在成本降低了，并且你拒绝了取舍？\n\n**哈根：** 当我们开始思考铁山公司的可持续发展战略时，我们在\
  \ 50 多个国家拥有超过 1400 个设施来存储信息、数据和文档。我们知道我们支付了超过 4000 万美元的水电费账单，但我们不知道用这笔钱实际购买了多少电力。这不是因为我们笨。而是因为，像许多商人一样，我们只是假设对于单个建筑来说，你能做的事情不会有足够大的区别。但是，为了计算我们的第一个温室气体排放足迹，我们需要弄清楚我们用了多少千瓦时。这些数据引导我们得出了一些有趣的发现。例如，我们的用电量是温室气体排放的最大来源，而且成本波动性比我们知道的要大得多。我们还了解到，每栋建筑的能源使用量差异很大，尽管我们假设它们是一致的。当我们意识到如果最差的那一半建筑的每平方英尺能耗与我们最好的一半建筑相同时，我们可以节省多少钱时，这真是让人大开眼界。数据照亮了我们知识领域中的一些盲点。\n\
  \n一旦我们意识到有很多减少能源消耗的机会，特别是在照明方面，设施管理团队与供应商合作，出色地开发了易于安装且成本效益高的 LED 灯具。我们本以为会非常聪明，设定一个令人印象深刻的目标，将用电量减半。那将会很棒。\n\
  \n就在我们设定这个削减能源消耗目标的同时，业务的另一部分正认识到我们的文档管理和存储行业正在发生变化。我们公司必须从一家纯粹基于文档的公司，或者更具体地说，基于实物资产的公司，转型为一家更加注重数字存储和数据中心托管的数字化业务公司。就在我们承诺将能源消耗减半的时候，业务战略团队却在承诺扩大我们的数据中心业务——这是仅次于采矿业的能源密集型行业之一。我们永远不可能仅仅通过“换\
  \ LED 灯”就摆脱这种情况。\n\n**帕吉萨斯：** 你从这次经历中得到了什么启示？\n\n**哈根：** 对于任何可持续发展领导者来说，这是一条极其重要的教训——了解你的业务正在发生什么。一旦你过于专注于你自认为已经掌握的那一件事，就会有其他人在不知不觉中做着与你背道而驰的事情。企业内部的孤岛往往是一个巨大的劣势，并会造成盲点。\n\
  \n当我们意识到仅靠能源效率无法让我们达到目标时，我们迅速转向，增加了可再生能源战略。如果我们要使用更多的电力，那么它最好来自可再生能源，因为这是在增加电力消耗的同时降低碳排放的唯一途径。这带来了巨大的挑战，因为我们假设可再生能源更昂贵。我们不能让我们新兴的数字业务在电力成本上处于劣势，那也行不通。但我们也不能让一个新业务从一开始就带着根本性的\
  \ ESG 劣势。\n\n当时，我们可以溢价购买少量绿色电力，然后宣称已经很好了，但我们没有。在我看来，我们坚守了更高的标准。我们花了至少 18 个月的时间，期间经历了许多起起落落，才找到了一个更好的解决方案。我们最终认识到，可再生能源比化石燃料发电机有一个巨大优势，因为它们能很好地控制长期成本。可再生能源系统的成本在于建设的前期资本投入。没有反复发生的燃料成本。由于没有燃料成本，可再生能源供应商更容易签订固定价格的长期合同，而化石燃料供应商则很难做到这一点。此外，在风能或太阳能资产建成之前，手头持有产出品的长期合同会使项目融资容易得多。因此，买方和卖方都有兴趣达成一项长期交易。\n\
  \n当我们引入财务、税务、财务、法律团队，以及所有其他需要进行财务工程设计的同事时，我们也在与第三方可再生能源供应商进行艰苦的谈判。最终，我们得到的解决方案不仅提供了更好、更稳定的长期成本方案，而且初始成本也更低。\n\
  \n我们短期节省了资金，同时为绿色电力支付了更少的费用，并锁定了长期费率。如今，我们在全球范围内的总电力需求组合中，超过 80%来自可再生能源，而且我相信我们在绿色电力上的花费从未超过化石燃料。总之，我们从对用电量的盲目、设定错误目标导致的无用功，发展到实现真正的创新，并找到了利用可再生能源减少碳足迹的方法。自\
  \ 2016 年以来，尽管我们的企业电力消耗几乎增加了两倍，但在业务增长的同时，我们的绝对碳足迹却减少了 60%以上。\n\n**帕吉萨斯：** 你指出了一个给可持续发展领导者的教训——了解整个业务的状况。从这次经历中，你还能指出哪些关键教训？\n\
  \n**哈根：** 拒绝取舍，让更多人参与进来，获取更好的数据。在我们的情况下，拒绝取舍意味着按下暂停键并说：“等等，这里有点不对劲。如果做正确的事成本更高，我们就做不了多少。”我们必须首先拒绝这种惯例。其次，我们必须让更多人参与进来，比如财务和税务团队，以便为公司敲定正确的可再生能源解决方案。\n\
  \n最后，当你有更好的数据时，你就能做出更好的决策。当我们开始着手提高能源效率时，我们完全不知道新的数字战略会消耗多少电力。我们从财务报表中知道我们在水电费项目上支付了多少钱，但我们不知道我们几乎每年都没有“达标”，或者成本每年都在上升。我们不知道这是由于我们使用了更多电力，还是因为我们支付了更高的单价。它仅仅被视为做生意的成本。这意味着我们对用电的起点没有很好的把握。然而，今天，我们知道我们使用了多少能源，预计会用多少，以及我们为此支付了多少钱。\n\
  \n**帕吉萨斯：** 获取更好的数据是一个有趣的观点。我的观察是，当你和铁山团队进一步将可持续发展融入你们的服务时，你们不得不获取以前可能没有寻找过甚至没有的数据。其他公司也会面临同样的挑战吗？\n\
  \n**哈根：** 绝对会。是的，他们将需要获取新的或更好的数据。我认为传统思维中的另一个谬误是将环境和社会数据称为非财务指标。例如，我们过去认为员工多样性数据和温室气体排放是某种“非财务”数据。虽然在传统意义上确实如此，但如今我们将\
  \ ESG 数据视为商业数据。起初这可能看起来有点牵强，但如今，如果我们要求组织帮助收集一些新的 ESG 数据点，我会向业务中的同僚领导者承诺，如果两年后他们看不到这些数据的商业价值，无法利用这些数据流来指导决策，我的团队将停止收集这些数据。\n\
  \n**帕吉萨斯：** 为什么将这些数据纳入商业决策具有挑战性？\n\n**哈根：** 我认为历史上一直存在阻力，不愿意将“情感”或“感性”数据，例如多样性或社会议题，纳入商业或“理性”决策。这种阻力的产生是因为，当我们打开讨论的大门并开始查看其中一些数据时，通常都是坏消息。隐藏在我们盲点中的往往是负面的环境或社会影响，我们宁愿不知道。而且，一旦你开始衡量，情况在好转之前似乎总是会变得更糟。人类的自然反应有两种——否认或绝望。这两者都不是很有帮助的状态。你必须走向希望。\n\
  \n像我们这样的可持续发展变革推动者的关键机会是，以某种方式利用这些数据，帮助人们看到采取不同行动、获得更好结果的机会——更好的环境、更好的社会、更好的商业成果。这就是关键。过去五六年我们在铁山公司经历了这一点，我们从盲点，也许经历了某种否认或绝望，最终到达了希望。因为我们看到了这种不同做法，现在我们庆祝更好的商业成果。这给了我们难以置信的力量，去审视整个业务并发现更多机会。这是一个公式，而不是侥幸。我们可以将这个公式应用于业务中的更多方面，并获得更好的结果。\n\
  \n下一个阶段甚至是对此进行反思。到目前为止，我们一直在挑战自己，以减少负面影响，减少安全事故，降低碳足迹。当这些增量式的改变变得不那么令人满意时，就会出现一个临界点。事实上，我认为，如果你正处于考虑回报递减的阶段，那么你的组织进步就已经达到了一个平台期。我们下一步的想法是超越那种“少做坏事”的思维。我们必须找到利用我们的业务“做更多好事”的方法。这关乎找到能创造更多积极效益的解决方案。\n\
  \n**帕吉萨斯：** 我们经常庆祝成功，但有时当事情出错时，却不愿意分享经验教训。你有没有经历过某个可持续发展目标或活动出错或未能达到预期的情况？\n\n**哈根：**\
  \ 我有很多这样的经历。[笑] 我们制定第一个碳目标的第一年就未能实现。差距只有几个百分点，所以不算很多，但我们认识到，我们未能掌控所有影响我们气候足迹的变动因素，从车队运营和柴油消耗，到新兴的数据中心业务和我们的电力消耗。而且，在我们最初的碳排放数据中，包含了大量的范围三排放，这些排放很难准确获取。由于存在太多变动因素，我们准备不足。我们没有相应的指标或路线图，也缺乏对影响碳排放总量各个杠杆的理解。\n\
  \n现在，错过第一个目标的好处是，我们设定了一个目标，这给了我们获取所需信息的理由。我非常赞赏我们的 CEO 和领导团队，他们承受了未能实现第一个目标的打击，并采取了我们需要从过程中学习，而不是惩罚犯错者的态度。从那以后，我们再没有错过任何一个已公布的目标。\n\
  \n**帕吉萨斯：** 对于所有 CEO 和领导团队来说，在制定可持续发展战略和目标，尤其是首次制定时，这是一个很好的信息。“测试与学习”的方法对于可持续发展战略的长期成功至关重要。\n\
  \n接下来发生了什么？\n\n**哈根：** 我们进入了下一阶段：获取由严格方法论支持的指标，并建立一套流程来反复管理和生成这些指标。我们开始以对待商业指标的严谨态度来对待可持续发展指标。我认为这是我们做事方式的一个巨大转折点。\n\
  \n此外，下一阶段的一个重要部分是当我们说：“好了，我们不再仅仅凭情感来做这件事。我们要用理智和情感共同来做。”这种转变使我们能够与员工互动，讨论他们如何利用自己的日常工作在他们关心的事情上有所作为。例如，让财务人员参与能源讨论，使我们能够接触更复杂的金融和分析工具、新的思维方式以及新的业务成果。这是我们成功的一个关键因素。\n\
  \n**帕吉萨斯：** 从外部看，你们如何与客户在可持续发展方面互动？\n\n**哈根：** 我们看到“做更多好事”和发展业务的首要机会是与我们的客户互动。我们以对商业有利的方式解决了自身业务中的\
  \ ESG 挑战，这使我们有机会看到我们可能如何帮助客户解决他们业务中类似的 ESG 挑战。这让我们有资格进行这种对话，因为我们不仅仅是想向他们推销东西，我们是已经解决了问题的同行，我们正试图与他们联手，共同解决一个更大的问题。\n\
  \n我们数据中心业务就是一个例子。由于其能源消耗，数据中心可能成为公司碳足迹的重要组成部分。通过清洁能源买家协会及其“互联网电力未来”工作组，我们与竞争对手、客户、关键\
  \ ESG 数据保证机构以及世界资源研究所（WRI）和世界野生动物基金会（WWF）等主要非政府组织合作，开发了一个开源协议。该协议允许数据中心运营商将我们可再生能源合同的环境属性“传递给”我们的客户，以便他们能够申领合法的范围二和范围三碳减排。\n\
  \n我们是第一个将此协议转化为标准服务产品的托管运营商。我们的客户不仅获得了我们的数据中心服务，还能同时减少他们的碳足迹，并且能够向 CDP、RE100 或其他机构报告。在我看来，我们实际上已经走完了整个历程，从对能源的盲目，到这个改进运营的过程，再到现在思考如何与客户携手做更多好事。这使得各种规模的企业客户不仅能从与我们的业务往来中受益，而且由于我们与世界资源研究所等机构基于开放协议共同构建了这一点，他们可以向所有的数据中心供应商提出同样的要求，从而帮助改变整个行业。\n\
  \n现在，整个行业都可以帮助为每个人创造更绿色的电网，因为市场力量正在寻求解决问题。我们利用企业这个强大的杠杆来应对所有人的巨大挑战，即实现无碳电网，因为我们深入思考了如何将我们学到的东西应用于满足客户的需求。\n\
  \n**帕吉萨斯：** 你预计，由于将 ESG 原则和可持续发展原则整合到核心产品和服务中，企业将在五年内如何领导运营？\n\n**哈根：** 我相信“可持续商业思维”的概念相当于一种颠覆性的商业技术。它正在改变每个人的工作和每个企业，如果它没有改变你的企业，那你就是没有关注。人们对企业做什么以及如何做的期望已经发生了巨大变化。\n\
  \nESG 或可持续发展正在影响业务中的每一个学科，从市场营销和财务到采购、房地产和产品开发。在市场营销方面，你需要知道什么是“洗绿”，以及如何真实地呈现相关讨论。在财务方面，你需要知道什么是绿色债券及其含义。在采购方面，你必须了解生命周期评估是什么样的，以及供应链的韧性如何。在房地产方面，你必须知道如何开发和管理绿色建筑，因为它们更好、成本更低、也更具韧性。在产品开发方面，产品的\
  \ ESG 属性对于解决客户痛点以及开发更好、更快、更便宜的产品将变得越来越重要。\n\n一切都在被颠覆，这不是巴塔哥尼亚模式。这是更好、更快、更便宜的模式。巴塔哥尼亚可以说是一个以可持续发展为导向的企业或品牌，但尽管其品牌取得了成功，其产品在功能上却未必更好。我为其外套支付溢价，并不是因为它更保暖或更防水。我支付溢价是因为我相信他们的品牌，我相信他们的公司。我希望他们做好事。\n\
  \n在传统 B2B 领域可持续发展的下一篇章中，这将是远远不够的。是的，我们必须以更好的环境、社会和商业成果来运营业务，但这还不够。我们必须生产更好、更快、更便宜的产品，因为它们具有\
  \ ESG 优势。当然，我们以有竞争力的价格和优质的服务满足客户对托管数据中心的需求。但是，由于我们承诺通过可再生能源解决方案减少碳足迹，我们意识到，如果我们做对了，我们可以对此进行认证，并将好处传递给客户，从而减少其数据中心碳足迹，而不是增加它。这就是一个更好、更快、更便宜的产品。我认为这就是正在发生的颠覆，也是未来几年将发生的变化。不同的行业会在不同时间以不同方式感受到它，但这正是我预见的商业前景。\n\
  \n**帕吉萨斯：** 员工如何融入这场颠覆和变革？\n\n**哈根：** 有不少研究指出，年轻人希望在自己觉得能有所作为的地方工作。我认为这不限于年轻人。任何有选择的人，都不会心甘情愿地在上班时把自己的价值观留在停车场。这绝对不行。这是这种商业新思维如何打破“非此即彼”思维范式的一部分。曾几何时，如果你想改变世界，你肯定不会认为加入一家公司是答案。但是，如果我们能利用日常工作来同时谋生和创造改变呢？\n\
  \n我们的员工可能是变革的头号载体。我们开始看到的是，为人们提供这样的机会能够推动变革，交付成果，并通过鼓励他们全身心投入挑战来吸引他们。他们成功了，企业变得更好，我们也在加速我们所能产生的积极影响。\n\
  \n**帕吉萨斯：** 员工如何扩展他们的可持续发展知识？\n\n**哈根：** 我看到来自各个领域的人开始将可持续商业技能和能力添加到他们的个人工具箱中。他们从工作中找到了更多意义，也取得了更多成功。在某些情况下，这是正规教育，例如通过许多大学提供的可持续商业\
  \ MBA 或研究生证书。在其他情况下，是特定的资格证书，如 LEED（能源与环境设计先锋）或 BREEAM（建筑研究院环境评估方法）认证。有时，是通过像 Net\
  \ Impact 这样的专业组织边做边学。我看到的共同点是，现在在可持续商业领域已经有一套成熟的文献体系。人们是无法像那些寻求某种正式流程来加速技能和职业发展的人那样，仅仅通过在职培训就能快速进步的。\n\
  \n**帕吉萨斯：** 有些人对可持续发展倡议感到沮丧，说没有办法改变企业对气候和社会造成的负面影响。你会如何回应？\n\n**哈根：** 如果我们将其视为否认或绝望，那么我们将永远无法到达希望。我们可以关注商业的负面影响，风险是明显且可怕的。但商业有更大的机遇，那就是在商业上做得更好，提供更好的产品和服务，更有利可图，同时在我们利用企业推动变革的过程中，带来更多的环境和社会效益。这就是希望。\n\
  \n借用保罗·霍肯在其开创性著作*《商业生态学》*（哈珀柯林斯出版社，1993 年；修订版，哈珀商业出版社，2010 年）中提出的一个观点：商业是唯一拥有速度、规模和资源的人类机构，能够足够快地做出足够大的改变以产生影响。这就是我今天的核心观点。\n\
  \n\n\n"
- '# 第三部分：能源、建筑材料与设备制造


  ### 14. 凯瑟琳·尼布


  杜克能源公司首席可持续发展官兼全国参与与战略副总裁；杜克能源基金会主席


  `凯瑟琳·尼布`是`杜克能源公司`的全国参与与战略副总裁兼首席可持续发展官，同时担任`杜克能源基金会`主席。杜克能源是美国最大的能源控股公司之一，为六个州的 780
  万客户提供电力，为五个州的 160 多万客户提供天然气服务，并通过其商业业务拥有并运营多元化的发电资产，包括一系列可再生能源项目。凯瑟琳领导杜克能源的战略，致力于实现满足客户对可靠且负担得起的能源需求，以及到
  2050 年实现公司净零碳排放目标这双重目标。


  凯瑟琳在利益相关方参与、环境可持续性和社会影响方面的深厚专业知识，源于她之前在`沃尔玛`和`世界自然基金会`任职的经历。她的工作涵盖领导沃尔玛的环境、社会和治理战略，并管理着与`可口可乐公司`的全球最大的企业与非政府组织合作关系之一，重点关注超过
  45 个国家的用水、农业和气候议题。


  2019 年，凯瑟琳成为`阿斯彭研究所`的`先行者`研究员。


  **克里萨·帕吉萨斯：** `杜克能源`在美国公用事业基础设施中扮演着关键角色。你能介绍一下杜克能源涵盖哪些服务和运营吗？


  **凯瑟琳·尼布：** `杜克能源`是美国最大的能源供应商之一。我们运营着一家垂直整合的公用事业公司，这意味着我们拥有发电、输电和配电业务。公司约有 3 万名员工。我们服务约
  700 万客户，主要分布在美国东南部和中西部地区。我们已运营超过 100 年。


  我们的企业宗旨是为客户的生活提供动力，为社区的活力做出贡献。我们的业务目标是致力于到 2050 年实现净零碳排放。这一承诺包含两个中期里程碑——到 2030 年实现甲烷净零排放，以及到
  2030 年将发电排放量相对于 2005 年基准水平至少减少一半。从根本上说，我认为社会面临的最大挑战之一就是气候变化，这也是吸引我加入杜克能源的原因。公司还有其他产品和服务，但解决气候变化问题是当务之急。


  **帕吉萨斯：** 你的职务是全国参与战略副总裁兼首席可持续发展官，同时还担任杜克能源基金会主席。这些角色涵盖哪些内容？


  **尼布：** 我被任命来负责公司三个主要领域——可持续发展、利益相关方参与以及我们的慈善工作。具体来说，我领导杜克能源的利益相关方参与工作，旨在制定解决方案以满足客户对持续可靠且负担得起的能源的需求，同时努力实现公司到
  2050 年实现净零碳排放的目标。作为杜克能源基金会主席，我们提供超过 3000 万美元的支持，以满足杜克能源客户生活和工作所在社区的需求。2021 年尤其充满挑战，但我为基金会迅速调整方向，以同时应对
  COVID-19 救助以及种族平等和社会正义工作而感到自豪。


  **帕吉萨斯：** 为什么可持续发展对杜克能源如此重要？


  **尼布：** 我们正处于能源行业一个有趣的时期，因为它正在经历一场巨大的变革。当我思考杜克能源到 2050 年实现其目标的能力时，变革的步伐将是巨大的。在我们寻求实现电网脱碳的过程中，到
  2035 年所需的技术我们有清晰的视野。许多让我们能走得更远、直至实现净零排放的技术尚处于萌芽阶段，但正在快速发展，并希望能很快扩大规模。当行业转型并实现脱碳时，我们将能够为缓解气候变化的影响做出实质性贡献，而这是许多其他公司无法做到的，因为它们不属于我们所处的行业。


  **帕吉萨斯：** 杜克能源在其可持续发展进程中处于哪个阶段？


  **尼布：** 我们正在考虑行业内最大规模的燃煤机组退役，目前已退役了 54 台燃煤机组。这条道路我们已经走了十多年，并且已经看到了许多成功。相对于 2005
  年，我们的排放量已减少了超过 40%。所以，我们知道好的标准是什么样的。但我们面前仍有工作要做。这令人兴奋，也充满挑战。它需要与所有利益相关方，包括监管机构、投资者、客户和公民社会，进行深入的对话、合作和交流，才能在保持可靠性和可负担性的同时实现净零排放。


  **帕吉萨斯：** 杜克能源的战略还带来了哪些影响？


  **尼布：** 可持续发展不仅仅关乎环境方面，它也审视经济和社会影响。当我思考社会影响时，我会关注三个重点领域。


  首先，我总是从我们的影响范围开始。那么，我们如何看待就业和转型？我们知道技术会发展，工作要求也会变化。我们正在思考如何通过技能提升、再培训以及类似性质的工作来为我们的劳动力做好准备。这是我们审视社会和经济影响交叉性的一个方式。


  其次，我也考虑我们的客户，这是第二个核心关注领域。例如，让我们想想 COVID-19 大流行。我们知道我们的客户和社区在失业方面受到了大流行的深刻影响——特别是那些服务不足的群体。代表性不足的社区受到了不成比例的影响。作为提供电力的公用事业公司，我们必须考虑所有客户和社区，以及我们如何服务他们，并不断发展我们的业务来满足他们的需求。


  第三个核心领域是社区活力这个概念。我思考杜克能源在我们社区中扮演的角色，不仅仅是提供就业机会，还包括采购，以及我们如何将其他公司和其他行业引入我们的运营区域。我们共同努力，帮助创造新的就业机会、经济增长和经济发展。我认为这一点至关重要。


  最近，我们召开了一次团队会议，邀请了供应链负责人分享团队正在做的一些工作，以及我们专注于在北卡罗来纳州招聘的一些努力——即直接从我们位于北卡罗来纳州的总部进行采购——同时，我们与一级和二级多元化供应商（包括女性拥有和少数族裔拥有的企业）的支出超过
  10 亿美元。换句话说，我们的净零业务战略体现在气候之外的诸多问题上。我努力思考与环境、社会和治理原则相关的所有维度，以及我们如何将这些原则应用于我们的工作中。


  **帕吉萨斯：** 杜克能源的环境战略似乎与其服务社区紧密相连。这是为什么？




  **尼比：** 是的，它确实是。杜克能源与我工作过或合作过的其他公司相比，其独特之处在于，你无法将我们的可持续发展战略或气候战略与我们的业务战略分割开来。在某些公司，你有时会试图弄清楚如何让可持续发展变得相关。在某些情况下，你是在努力将其硬塞进去，因为它是新事物，并且你正在试图找出如何使其发挥作用并将其嵌入整个公司。在其他情况下，你也在努力硬塞，因为它并不真正契合，而你正在试图找到理由。我认为杜克能源的不同之处在于，公司的每个人都在我们的气候战略中扮演着角色。这就是我们的业务战略。我们将在未来五年内为气候战略投资
  590 亿美元，这是我们对未来业务增长的投资。


  **帕吉萨斯：** 在你的高级领导团队中，是否有对可持续发展战略的成功投入的关键合作伙伴？


  **尼比：** 是的，而且不仅仅是关键领导者。我认为杜克能源的每个人都在履行这一承诺和我们的净零战略中扮演着角色，这非常酷。


  **帕吉萨斯：** 能否举一些杜克能源业务部门参与并与其可持续发展战略和目标保持一致的例子？


  **尼比：** 有一个相当直接的例子，就是那些在我们受监管和商业业务中负责选址、建设、维护和扩大可再生能源规模的部门。事实上，我们的商业可再生能源业务包括公用事业规模和太阳能发电资产、分布式太阳能发电资产、分布式燃料电池资产以及电池储能项目，横跨
  22 个州，涉及 21 个风电设施、150 个太阳能项目和 2 个电池储能设施，我们计划到 2050 年进一步扩大我们的商业可再生能源投资组合。这是拼图中的关键一块。但我认为，实现我们的净零目标还包括输电和配电业务方面的团队，他们在加强电网以使可再生能源能够输送到需要的地方方面发挥着关键作用。


  另一个例子是，我们有团队利用技术来做一些事情，例如帮助客户更明智地使用能源，或者在恶劣天气情况下缩短恢复时间。在后一种情况下，智能电表在缩短恢复时间方面发挥了关键作用。去年，恢复团队成功地
  ping 了 41,000 个电表，以验证维修完成后电力是否已恢复，这节省了大约 5,500 次卡车出勤，并在 2020 年重大事件响应期间释放了资源。


  **帕吉萨斯：** 在环境方面，杜克能源为实现 2050 年这一雄心勃勃的目标而进行投资的一个例子是什么？


  **尼比：** 是的，我们来谈谈如何从 A 点到达 B 点。需要明确的是，自 2005 年以来，我们已经将自身的碳排放量减少了 40%以上。许多人可能不知道或不完全了解，我们已经是低碳强度领域的领导者。我以卡罗来纳州为例，那里
  50%的电力来自零排放源，即核能。在能源强度方面，我们已经是一家实力雄厚的公司，并且是行业领导者。


  当然，我们正在监督我们行业内最大规模的煤炭退役计划，计划到 2030 年在卡罗来纳州退役所有纯燃煤机组。我们在印第安纳州加速了燃煤电厂的关闭，在我们整个机组已退役的
  51 台机组的基础上，将平均退役日期缩短了约 40%。因此，这对杜克能源来说并非新变革。这是我们进行了一段时间的转型之旅。


  **帕吉萨斯：** 转型之旅背后的战略是什么？


  **尼比：** 我将深入探讨并解析四个方面。我们知道的第一件事是需要投资更多的可再生能源。我们必须专注于扩大储能。我们也知道无碳核能可以发挥作用。我之前谈到过核能目前已经在发挥的重要作用。然后，我们需要考虑可调度资源，这是电网运营商可以根据市场需求（例如天然气）按需调配的能源。在谈到可负担性和可靠性时，我刚才提到的最后两种技术的重要性不容低估。


  因此，在可再生能源方面，目前我们已签约、拥有或运营约 8 吉瓦的装机容量。我们按计划在 2050 年前为受监管的公用事业公司实现超过 16,000 兆瓦，并在
  2030 年前达到 24,000 兆瓦。到 2050 年，可再生能源将占我们能源结构的 40%或更多，这是一个显著的增长。


  在储能方面，很多注意力都集中在那里。在未来五年内，我们预计将在新型电池储能上花费约 6 亿美元。我发现储能令人着迷的一点是，我遇到的每个人都认为电池是一种正在开发和规模化推广的前沿技术。我们在电池技术以及它如何帮助维持可靠性方面看到了真正的进展，尤其是在引入像风能和太阳能这样波动性更大的技术时。


  然而，有些电池储能已经在电网上运行多年了。例如，杜克能源拥有的 Bad Creek 和 Lake Jocassee 水电站就是抽水蓄能电站，提供了超过 2,200
  兆瓦的电力。这项技术已经有 100 多年的历史了。尽管有各种不同的电池技术，但我们预计到 2050 年电池储能将增长超过 13,000 兆瓦。作为一项技术，电池储能是创新新技术和长期存在技术的一个很好的例子。


  **帕吉萨斯：** 你提到了创新。有些人会说，公用事业公司没有创新精神，也不使用新技术。然而你的说法不同。你说有好的“旧”技术，也有待探索的新技术。为什么要使用“旧”技术？


  **尼比：** 根据我的经验，可持续发展社区倾向于追逐那些闪亮耀眼或下一个能拯救我们于未来的、但尚未可用的新创举。我同意创新将发挥关键作用的论点，因为我们确实需要它。但我认为我们需要审视我们目前已有的技术，并找出如何充分利用它们。它们是否被充分利用了？我们是否在以最有意义的方式应用它们？我能理解那种时髦新技术的吸引力，但我们必须认识到现在和今天能使用什么。所以抽水蓄能？这是一项今天就能工作的技术。建筑能效和采光设计，例如，今天也都可以实现。这些都是能源组合的重要组成部分，并在我们未来的能源中扮演着角色。


  我也关注核能。核能提供了我们在卡罗来纳州发电量的约 50%。新的核技术即将出现，这是我们称之为`ZELFRs`（零排放负荷跟随资源）的潜在技术之一。这些技术很重要，因为当你将间歇性能源和分布式能源接入电网时，作为公用事业公司，你对这些来源的控制力会减弱。换句话说，你依赖于外部因素，比如阳光照射和风力。为了维持可靠性，你需要一种可调度的燃料来源，并且能够快速将其投入——或降低——出力。`ZELFRs`的例子包括先进核能、氢能、长时储能以及碳捕集、利用与封存技术。




  **帕吉萨斯：** 如果我们能将当前电网中行之有效的技术与一些未来有望规模化并实现市场化的新技术加以平衡，我认为这种组合令人振奋。这正是我们到 2050 年实现净零排放目标的途径——即通过同时运用今天的技术和明天的技术来实现。


  **帕吉萨斯：** 你是如何开启可持续发展领域的职业生涯的？一路走来，哪些关键里程碑对你意义重大？


  **尼比：** 有趣的是，我的职业生涯事后看来总是合情合理，但当时却显得没那么有规划！我的起点是 2000 年，当时我在俄勒冈州一家小型咨询公司工作，该公司部分资金来自公用事业公共基金，用于鼓励人们在家庭中安装节能电器。如今在杜克能源公司工作，这可谓一个圆满的循环！


  在这家咨询公司，我负责推动人们购买"能源之星"产品及电器，并在家中安装它们。我与许多对需求侧管理非常感兴趣的公用事业公司合作，同时也与关注减排的民间团体以及其他专注于帮助人们支付水电费的组织共事。最后，我还与制造商和零售商合作，他们热衷于开拓新市场机会并销售利润率更高的产品。


  我深深爱上了可持续发展领域，在我看来，它的核心在于如何将环境和社会目标融入商业世界。反过来也是如此：如何将商业逻辑融入环境和社会挑战之中？时间快进一下，我花了一段时间才在可持续发展领域找到自己的方向。我进入弗吉尼亚大学达顿商学院攻读
  MBA，因为我当时认为自己会留在这个稍显边缘的领域。我需要理解如何让可持续发展在企业内部发挥有效作用。


  此后，我花了大约一年时间，专注于北卡罗来纳州东部的养猪场和可持续农业问题，这是一个与环境正义相关的议题。接着我搬到华盛顿特区，作为美国环境保护局的承包商工作，研究诸如室内清洁空气等问题。当时，这些工作零散地拼凑在一起，我不确定它们能否构成一条有意义的职业道路，但我对此充满好奇。我们谈论的是
  2003、2004 和 2005 年的事。可持续发展对私营部门而言依然很新、非常初级，远未得到它们的接纳。


  大约在 2004 年，当我回到北卡罗来纳州东部从事可持续农业工作时，偶然遇到了希拉里·戴维森。她谈论气候变化，并在杜克能源公司工作。我记得当时印象非常深刻，因为从事可持续发展工作的人寥寥无几，而看到一位来自给我父母家供电的公用事业公司的人谈论气候变化，确实令人赞叹。


  2007 年，我获得了一个绝佳的机会，为世界自然基金会工作，负责管理与可口可乐公司的一项大型伙伴关系，重点关注淡水资源——这是可口可乐所有产品的主要成分。如果他们的生产缺乏可持续的水供应，或者工厂周边的当地社区缺乏可持续的水源，他们便会面临切实的商业风险。这一关注点促使他们采取了水效率、气候和可持续农业等举措，并围绕一个对其长期商业成功至关重要的议题，创建了一流的可持续发展计划。参与这项工作非比寻常。


  之后，我去了沃尔玛，在那里工作了七年半。在那里的几年里，我的职业不断发展。从利益相关方参与到应对特别复杂的可持续发展挑战，例如海鲜行业的人口贩卖和人权问题，再到思考公司如何在一个我称之为"国际政策"的领域发挥作用，特别是在联合国气候变化大会（COP）上代表商界发声——例如巴黎和波恩会议，此外还为公司最高管理层提供可持续发展项目的支持。


  在沃尔玛的最近一段时间，我负责企业整体的 ESG（环境、社会和治理）工作。我处理公司需要预见的环境、社会及治理议题，思考如何缩小与这些议题相关的绩效差距，以及如何向投资者及其他利益相关方讲述我们的故事，特别是考虑到围绕
  ESG 新兴的主流投资者讨论。我从事这项工作约两年半。现在我在杜克能源公司，负责可持续发展、利益相关方参与战略以及基金会的工作。希望你能够看到，我的职业轨迹最终汇集到一起了，但这是事后才看明白的。


  **帕吉萨斯：** 显然，你在这个可持续发展领域耕耘已久，见证了它的演变。对于那些试图理解可持续发展与 ESG 区别的人，你会如何描述？还有企业社会责任和影响力投资呢？这些是我们如今在新闻中经常听到的关键词。


  **尼比：** 我不会花太多时间去争论哪个词具体指什么。这是一个语言和趋势不断演变的领域。我始终回归到商业的立场。从根本上说，我们讨论的是如何减轻环境和社会议题的风险，以及如何在环境和社会因素方面创造价值。我把治理单独拿出来，是因为我认为治理是任何企业的根本——良好的治理、道德规范、合规性，以及融入价值观和使命感的优秀文化。我认为良好的治理是任何强大企业的基石。我会将其视为一个区别于
  ESG 或可持续发展的独立议题。


  当我给刚进入这个领域的人提建议时，我总建议他们从两个针对企业的问题入手。哪些问题对公司至关重要？公司对哪些问题举足轻重？这是两个关于"重要性"的问题，尤其是可持续发展从业者所思考的那种重要性。你如何管理那风险？你如何创造价值？你可以称之为企业社会责任，可以称之为可持续发展，可以称之为
  ESG，随便你怎么叫。但根本上，作为一家公司，你试图做的是弄清楚你需要向何处发展，以及需要解决什么问题。


  **帕吉萨斯：** 我们来谈谈领导力。你参加过许多董事会会议，也是高管团队的一员。你认为你在工作中运用的哪些关键技能，让你成为商业界成功的可持续发展领导者？


  **尼比：** 最根本的是倾听、分清主次，然后创造积极影响，此外还有一个微妙的点：克服被拒绝的障碍。退一步看，广义上的可持续发展就是解决问题和变革管理。根据我的经验，当你想推动某件事并试图说服别人时，你能做的最好的事情就是倾听他们。理解他们的价值观，理解他们的挑战。很多时候，别人不仅会告诉你他们为什么做不到，还会告诉你他们需要克服什么。这个领域里，说教太多，倾听不够。所以，这就是第一点。




  **设定优先级**，其次，至关重要。我常回到这两个问题来思考如何排序：“哪些议题对公司至关重要？”以及“公司对哪些议题至关重要？”很多人带着大量的想法、解决方案和优先事项来到公司。公司要想真正高效，就必须专注于设定优先顺序。它们必须首先淘汰那些根本无法或不应承担的事项，然后才能接手更多工作。同样，这是一个信息如潮水般涌来的领域。


  第三项技能是**创造积极影响**。我选择定义影响的方式，是与大型企业合作，帮助它们调整并演变其商业战略，从而通过采取可持续发展行动来获取价值。我认为，吸引人们进入这个领域的正是“影响”这个问题。定义影响的方式有很多种。作为领导者，在整个职业生涯中，定义或发展自己对`impact`的个人定义非常重要。


  最后，是**如何面对“不”**。这是一场马拉松，而非短跑。所以，要理解什么时候一个“不”是“现在不行”，什么时候是“永远不行”，或者“不，我害怕”。我会回到第一点去倾听，但这其中的微妙艺术在于，要设法弄清楚如何让某人说“行”。


  **帕吉萨斯：** 你刚才描述的“克服拒绝”听起来像是一种隐性技能。你在职位描述中看不到它，但它似乎对成为可持续发展领导者这一成功秘诀至关重要。


  **尼比：** 我经常谈论如何改变人心和思想，以及如何让人们以不同的方式思考。重点不在于我这个实践者有一个好主意。而在于你如何改变你所接触的每一个组织——提出明智的问题，并理解风险和价值的本质。


  我在世界自然基金会（WWF）工作时，曾参观过可口可乐的一个制造厂或生产中心。那是本世纪初了。我是非政府组织的代表，在当时，让一个非政府组织（即使来自 WWF）与工厂经理一起进入工厂，是一件既新奇又甚至有些可怕的事情。我们倾听。我们会问：“你们在生产什么？在这个地区、这个国家，你们的业务目标和挑战是什么？”我们会要求参观工厂。我想看看他们是如何从头到尾生产一瓶可口可乐饮料的。


  我们通常会以一个问题结束访问：“你们的水从哪儿来？”通常情况下，他们会指向通往工厂的水管。然后我们说：“很好。在接下来的一段时间里，我们去看看水源地吧。”这让他们能够从水源地面临的风险角度，以不同的视角看待风险维度。工厂参观的这一部分有助于改变人们对风险和机遇的看法。这从根本上来说是一种变革。我认为有效的可持续发展的秘诀就在于这种变革。


  **帕吉萨斯：** 对于准备进入该领域或推动公司发展的可持续发展专业人士来说，还有哪些其他隐性技能？


  **尼比：** 我认为可持续发展令人兴奋的一点是，你几乎必须成为一名未来学家。我喜欢这个领域的一点是，它关乎洞察未来的趋势。趋势是什么？议题是什么？风险是什么？机遇是什么？它们与企业相关吗？如果相关，如何相关？机遇在哪里，风险又在哪里？当远方的事物突然出现在眼前时，你是否已经为企业做好了应对准备？这需要将前瞻性思维与批判性眼光结合起来，审视它将如何、在何处、何时以及为何会在公司中显现。这才是重要的——然后要能够阐明为什么那个未来的议题很重要。


  关于可持续发展项目或 ESG 项目，另一个常被低估的一点是，我们通常是企业的顾问。有些工作由我们自己主导，当然，有些工作则要嵌入到组织中。然而，从根本上实现变革的是内部的业务决策者，而不是可持续发展团队本身。


  这是我经常与想进入可持续发展领域的人讨论的话题。有一种看法认为，除非他们的头衔里带有“可持续发展”这个词，否则他们就没有权力，也无法做出可持续的商业决策。无论我是在沃尔玛工作、为可口可乐提供咨询，还是现在进入杜克能源的角色，最终决定采购什么、在哪里部署技术或投资什么的，都是业务决策者。这个人，才是真正推动变革的人。


  **帕吉萨斯：** 你谈到的其中一个主题是让利益相关者转向可持续发展。利益相关者管理对你来说意味着什么？


  **尼比：** 我认为，鉴于当前的社会状况，企业有一个独特的机会来自我反思：“我们的服务或产品为社会提供的角色是什么？”我感兴趣的问题是：“企业如何服务于社会？”对我来说，这是最难回答的利益相关者参与问题。


  我之所以被杜克能源、沃尔玛和与可口可乐合作所吸引，另一个根本原因就是提出这个问题：“这家公司正在扮演什么社会角色？”杜克能源提供电力。我们有义务为我们服务区域内的每个人提供电力。这本身就是一项社会公益。能够点亮灯光、为冰箱供电、或维持企业运营，都离不开我们公司。这从根本上来说是一项社会公益。可靠且经济地完成这一切也同样至关重要。现在，随着我们应对气候变化，我们还在逐步引入更清洁的能源。


  当我思考我们如何解决社会问题或利益相关者的问题时，我每天都备受鼓舞。当我想到这家公司能够为推动多样性、公平和包容等议题做些什么，如何应对气候变化、减缓、适应和增强韧性，以及如何通过慈善事业和与利益相关者的合作来帮助建设强大的经济时，我深受启发。


  当我说“利益相关者”时，可能包括公民社会、客户、我们的员工、社区或投资者——基本上就是我们服务的所有方面。从根本上说，这是关于把大家聚集在一起，提出诸如“我们期望达到什么成果？”和“我们如何优化系统以实现这些成果？”这样的问题。另一个重要的问题是：“必要的变革节奏是什么？这种变革必须是什么样子？”


  在杜克能源，我提出的具体问题是：“我们如何共同努力，弄清楚我们期望的成果是什么？”然后，“杜克能源在这些成果中扮演什么角色？”对我来说，当你做到最优秀的利益相关者参与时，就是这样的。这就是它应有的样子。这就是你进行的对话。这不仅仅是利益相关者的“参与”或“管理”，而是关乎“成果”。




  ### 15. 奥利维耶·布卢姆


  施耐德电气首席战略与可持续发展官


  `奥利维耶·布卢姆`是`施耐德电气`的首席战略与可持续发展官，这家跨国公司在 2020 年的营收超过 250 亿欧元。`施耐德电气`总部位于美国、亚洲和欧洲，在能源管理和自动化的数字化转型方面提供解决方案，为家庭、建筑、数据中心、基础设施和工业领域提升效率和可持续性。`Corporate
  Knights`将其评为 2021 年全球最具可持续发展的企业。


  `奥利维耶`负责领导`施耐德电气`战略与可持续发展计划的制定，以及并购和资产剥离活动。在担任首席战略与可持续发展官之前，他曾担任全球首席人力资源官。他还曾在中国、印度和香港担任高级职务，包括区域战略负责人兼市场总监、区域董事总经理以及零售业务执行副总裁。他的职业生涯始于`施耐德电气`法国公司。


  2019 年，`奥利维耶`获得了由`Cadremploi`、`Morgan Phillips Hudson`、`Le Figaro Décideurs`和`Fyte`颁发的法国年度首席人力资源官奖，以表彰他在全球范围内对`施耐德`领导力与企业文化的变革。他目前担任`Delta
  Dore`董事会成员，以及`AVEVA Group PLC`的非执行董事和薪酬委员会成员。


  **克里萨·帕吉萨斯：** 奥利维耶，你的职业道路很独特。你的职业生涯始于`施耐德电气`，并从 1993 年起一直在此工作——截至 2021 年已有 28 年。你担任的第一个高管职位是首席人力资源官。现在你同时担任首席战略官和首席可持续发展官，实际上是“双料首席战略官”。在`施耐德电气`内部，是怎样的职业道路引领你成为这些不同高管角色的领导者？


  **奥利维耶·布卢姆：** 我职业生涯的一个有趣特点是，我担任过许多不同的角色——从商业业务端到全球和本地层面的产品开发。我有幸发现了公司的所有维度。我职业生涯的第二个有趣特点是，我多年来一直在国际环境中工作。在欧洲工作了十年，在亚洲工作了十八年。目前我常驻香港。我在中国待了近六年，在印度待了六年，这可能极大地改变了我对世界、领导力以及多元与包容的看法。


  我在法国长大，大学毕业后就加入了`施耐德电气`，所以我的整个职业生涯都是在`施耐德电气`度过的。我最初加入销售和市场团队，随后的七年里，我在商业部门工作。2001
  年，我被选为时任首席执行官`亨利·拉赫曼`的幕僚长。担任这个角色对我来说很特别，因为当时我只有三十多岁——相当年轻，并且对一家全球性公司的运作方式知之甚少。


  作为幕僚长直到 2003 年，我负责领导公司的转型计划。那是我们第一次决定将社会议题列入公司议程。2003 年，我搬到中国，此后我的大部分职业生涯都在亚洲度过。在中国，我领导了终端低压业务部门，之后负责战略与市场。2008
  年，我去印度负责市场，随后在全球范围内领导住宅与配电业务部门。


  2014 年，自 2006 年起担任`施耐德电气`首席执行官的`让-帕斯卡·特里夸尔`希望加速公司的领导力与文化转型。他让我担任集团首席人力资源官，专注于人员、多元与包容以及社会议题，这些对于可持续发展战略也至关重要。最近，在
  2020 年，我转而负责战略与可持续发展职务。我现在常驻香港。


  **帕吉萨斯：** 直到 2014 年，你在`施耐德电气`的职务是领导中国和印度的业务。你是如何获得首席人力资源官职位的？你对当时正在进行的业务和文化转型有何看法？


  **布卢姆：** 作为一名业务领导者，你必须领导你的业务并实现战略目标。但归根结底，你工作的一半是关于领导员工。这关乎与你共事的人、你雇用的人、你培养的人，以及你在公司中培育的文化类型。


  当让-帕斯卡和我讨论首席人力资源官职位时，他说，“听着，我认为我们即将成功实现业务转型。历史上，我们是一家中型产品公司，正在向一家大型解决方案公司转型，将成为清洁能源转型解决方案的一部分。我们已经实现了业务多元化。我们正朝着正确的方向前进，但公司的文化和领导力的变革速度没有跟上战略转型的步伐。”


  虽然我不是人力资源专业出身，但我对这个挑战感到非常好奇和兴奋。人力资源部门每天都应该对文化和领导力产生强大影响，而不仅仅是做事务性工作。我很高兴能领导`施耐德`这样规模公司的如此大规模转型。当你多年来一直对一个职能提出挑战，而你又获得了参与解决方案的机会时，这很难拒绝。


  **帕吉萨斯：** 你的国际经验如何为你担任首席人力资源官以及思考多元性做好准备？


  **布卢姆：** 在 2003 年去中国之前，我可以在简历上勾选成功经历。我上过一所优秀的欧洲大学，在公司里也很成功，并与 CEO 共事过。然后，我去了一个与我熟悉和认知的世界截然不同的国家。有很多我不理解的东西。中国市场与我迄今为止在欧洲学到的所有东西都大相径庭。那是一个非常具有挑战性的情况。


  就在那时，我恍然大悟，意识到世界并非完全像我从欧洲视角、教育和背景中看到的那样。从那时起，我关于公司内部多元性重要性的旅程可能大大加速了。我开始理解，人才是一种需要你去吸引的稀缺资源。当时在中国吸引我们业务所需的人才非常困难，因为人才匮乏。你需要培养并留住人才。


  当我六年后来到印度时，我以为情况会简单些，但待了一个月后，我意识到我对这个国家又有很多不了解的地方。在中国的那些年以及在印度的经历，极大地改变了我看待商业和多元性的方式。


  **帕吉萨斯：** 接下来，我们看看你的首席可持续发展官和首席战略官职务。为什么这两个角色会被合并？它们有哪些协同效应？


  **布卢姆：** 历史上，企业社会责任这个话题是与业务的其他部分分开处理的，但这几年已经发生了变化。让世界更绿色、更公平的意愿不仅是道德责任，在商业上也很有意义。可持续性是我们作为一家公司的宗旨和使命的核心。我同时领导战略和可持续发展，因为可持续发展深深植根于我们的战略之中。




  #### 首席可持续发展官的职责范围分为两部分。首先，它涵盖我们在自身内部可持续或环境、社会和治理（ESG）方面所做的一切。其次，我们帮助客户聚焦其 ESG 战略中的环境部分。我们的使命是成为客户在能效与可持续发展方面的数字化合作伙伴。


  **帕吉萨斯：** 施耐德电气似乎经历了两次转型。一次是从产品到服务的重心转移，另一次则是将可持续发展嵌入核心战略。


  **布卢姆：** 确实如此。当我被任命为首席人力资源官时，我们领导团队曾自问：“我们如何让这家公司与众不同？我们如何让它独一无二并产生积极影响？”我们的整体方针是成为一家进取型公司，不断开拓前沿，通过创新产生积极影响。


  在施耐德电气，我们喜欢说可持续发展就像一场马拉松，甚至是一场没有终点的赛跑。因为当你将积极影响融入所做的一切时，其潜力是无限的。这就是为什么人们，尤其是领导者们，会加入施耐德电气并留下来。因为我们总是力求更上一层楼。我们不断自问：“我们还能做些什么，才能对员工、地球和客户产生更好的影响？”


  **帕吉萨斯：** 与施耐德电气早期对可持续发展和企业社会责任的实践相比，这种长期赛跑的方式有何不同？


  **布卢姆：** 二十年前，大约在 21 世纪初，这更多是关于慈善。然后十五年前，大约在 2005 年，我们开始接纳可持续发展的概念。它成为了施耐德文化的核心。对我们来说，可持续发展不是为了符合
  ESG 报告和披露的要求。是的，做到这些很好，但更重要的是，作为一家跨国公司，你还能做些什么，在你所运营的每一个地方产生积极影响。


  **帕吉萨斯：** 奥利维耶，您现在已经制定好的可持续发展战略是什么？为什么实现这些目标对施耐德电气如此重要？


  **布卢姆：** 施耐德电气的宗旨声明是“赋能所有人对能源和资源的最大化利用，推动人类进步与可持续的共同发展。”我们的宗旨是帮助客户提高能源效率，并踏上他们自己的脱碳之旅。


  施耐德电气围绕六大支柱制定了战略——气候、资源、信任、平等、世代和本地。气候支柱的范围是关于在我们自身的运营中，与合作伙伴一起，并为我们的客户，快速实现净零排放。资源支柱致力于推进循环经济，保护地球的财富和生物多样性。信任对我们的文化很重要，因为它使员工和合作伙伴都遵循我们的社会、治理和道德标准。平等支柱专注于支持工作中的多样性和包容性，以及为无法获得能源的人们提供支持。我们致力于提升技能并培养各代人才，使他们能够贡献和成长，这是“世代”支柱的一部分。最后同样重要的是，我们的“本地”支柱致力于赋能本地团队和合作伙伴，以领导和实现基层影响力。气候和资源议题至关重要，因为我们希望在作为公司的每一件事上，都成为客户的榜样。


  **帕吉萨斯：** 这些支柱涵盖范围很广。让我们深入探讨其中一个支柱下的具体目标。在气候支柱下，你们有一个针对供应商的目标。该目标是将前 1000 家供应商运营中的二氧化碳排放量减少
  50%。这是一个雄心勃勃且庞大的目标。奥利维耶，你们打算如何实现这个目标？


  **布卢姆：** 我们多年前就开始关注二氧化碳排放。施耐德电气从 2006 年开始测量碳排放，现在我们已相当领先。如今，如果看我们的碳足迹，我们的范围 1 和范围
  2 排放（即我们的运营排放）仅为 30 万吨二氧化碳，不到我们碳足迹的 1%。仅在过去三年里，我们就将运营排放减少了 60%。而且很快，我们的运营将实现碳中和。


  与来自上游和下游价值链（如我们的供应商和客户）的范围 3 排放相比，我们的运营排放相对较小。我们的新战略旨在减少上下游的范围 3 排放。在过去的十五年里，我们在人权、工厂安全等人员问题上与供应商进行了接触。


  我们现在已就碳议题与供应商展开合作，因为对于这些供应商来说，随着气候和碳排放议题对其客户越来越重要，这些议题对他们自身的优先级也越来越高。然而，许多公司不知道该如何应对。他们不知道从何入手，也未必有办法聘请大型咨询公司等等。


  凭借这种让供应商参与我们可持续发展之旅的文化，我们已经与排名前 1000 的、二氧化碳排放量最大的供应商进行了接洽。他们并非从财务或产品角度而言最大的供应商，而实际上是排放量最大的那些。我们为这
  1000 家供应商设立了一个项目，帮助他们确定自身碳排放基线，并借助我们在世界各地的咨询服务来推进。


  **帕吉萨斯：** 能否举例说明你们如何帮助供应商减少碳排放？


  **布卢姆：** 例如，可再生能源的购电协议（PPA）议题非常重要。一些个体供应商的用电量可能不足以让他们获得可再生能源的购电协议。因此，我们汇集不同供应商的需求，进行可再生能源的集体合同谈判。


  我们于 2021 年 3 月启动了该项目。非常有趣的是，99%受邀者参加了项目启动网络研讨会。一天之内，就有 25%的供应商注册了该项目，几个月内，前 1000
  家供应商全部加入了该项目。


  **帕吉萨斯：** 为什么你们的供应商有兴趣加入这个项目？


  **布卢姆：** 这很有趣，因为当我们与投资者讨论这个目标和项目时，他们也问了我们同样的问题。碳排放和气候变化对供应商来说很重要。如果可以的话，当你能够跟随像我们这样的领导者，并从我们自身的投入和服务中获益时，这对他们来说是理想的情况。我们正处于第一年，所以我们从帮助他们测量碳足迹开始。对于那些已经测量过排放的供应商，我们正在帮助他们进行下一步，即制定碳减排战略。渐进地，目标是在未来五到十年内，实现他们的碳减排计划。


  **帕吉萨斯：** 帮助这些供应商减少排放，是否是一项旨在降低施耐德电气供应链风险的战略举措？




  **布卢姆：** 当然。它有多个优势。首先，这可以降低你的供应链风险，因为这些公司无论如何都会走上自己的脱碳之旅。它们将不得不向`施耐德电气`提供碳含量越来越低的材料，无论是钢材、电力供应还是电动汽车。其次，这既关乎降低它们自身的业务风险，也关乎降低它们所销售一切产品的二氧化碳强度。第三，由于我们在某些情况下也是供应商的碳减排解决方案提供商，这对我们来说也是一个商业机会。


  **帕吉萨斯：** 让我们更详细地探讨战略的另一个支柱。你想探讨哪一个？


  **布卢姆：** 我们战略中的“平等”支柱是关于多元化和包容性的。我们一直与我们的 CEO 密切合作，以培养多元化的员工队伍并创造包容的文化。归根结底，我们想为所有人创造平等的机会，因为在`施耐德电气`，我们非常注重多元化，无论是在管理层中拥有更多女性，在领导层中拥有更多国籍，还是确保无论背景如何，每个人都拥有平等的机会。


  我们喜欢在世界各地为所有人创造平等机会的理念。我们甚至在 2012 年改变了`施耐德`的总部模式。我们不再在欧洲设立一个中央总部。我们在法国、美国、中国和印度都设有总部。基本上，`施耐德电气`的最高职位分布在不同的地区。


  **帕吉萨斯：** 这是一个独特的领导力策略。


  **布卢姆：** 是的，确实如此。如果你看看典型的跨国公司，通常它们只有一个中心。全球 90%的工作都集中在那里。你猜怎么着？因为全球 90%到 100%的工作都集中在一个地点，所以大部分员工都来自那个国家。因此，美国公司非常美国化。法国公司非常法国化。


  我们决定将执行委员会分散到美国、香港、法国和印度。之后，我们审视了公司全球 500 个最高职位。我们决定将这些全球顶尖职位重新安置到欧洲、亚洲和美国的各个地区。这并非要将更多的外派人员送到亚洲和美国，而是要确保在每个地区都使用本地人才。我们的目标是让每个总部的员工中有
  80%来自该总部所在的地区。我们正在进行这个旅程，虽然尚未达标，但已经取得了进展。


  **帕吉萨斯：** 是什么促使您和`施耐德电气`的领导团队实施这种模式？


  **布卢姆：** 通常情况下，当你在大型跨国公司培养本地人才时，人们会成长，但如果不位于总部，就无法获得更大的全球性职位。许多人由于个人原因不愿意进行国际调动，比如要照顾父母。


  如果你想留住并培养你最优秀的人才，你必须就地培养他们，并在当地为他们提供机会。我们已将`施耐德`的最高职位分散化，以确保我们能够有更高比例的非法国和非欧洲人进入领导层。这产生了双重影响，这在策略启动之初未必是预料到的。


  **帕吉萨斯：** 第一个影响是有了更多在各个国家土生土长的人进入领导层。第二个影响是什么？


  **布卢姆：** 是的，那是第一个影响。第二个影响与女性有关。当你考虑女性领导力时，许多女性都非常成功，但由于你可以想象到的诸多原因，她们的流动性甚至比男性更低。通常是因为她们要照顾家庭。欧洲如此，北美如此，在亚洲更是如此，在那里，夫妻中的女性通常还要照顾年迈的父母。通过我们的多总部模式，我们不仅意识到它使我们能够拥有更多国籍的代表，还帮助我们拥有了更多的女性领导。


  我们方法成功的一个例子是任命了一位接替我的中国籍 CHRO。如果这个职位在法国，她很可能无法成为`施耐德电气`的 CHRO。


  **帕吉萨斯：** 我对最后一个支柱“本地化”很感兴趣。与该支柱相关的目标是，100%的国家和地区总裁应定义三项符合`施耐德电气`可持续发展转型、能影响其所在社区的本地承诺。为什么设定这个目标很重要？


  **布卢姆：** 十五年前，我们是首批专注于可持续发展并做出全球承诺的公司之一。对于每一个战略举措承诺，我们总是说：“我们将在未来三到四年内，在世界各地推行这项转型。”记住，我们的目标是在全球层面产生积极影响。这一全球战略使我们取得了非常好的进展。


  虽然许多承诺需要全球性的项目部署，但其他一些则需要本地关注。我认为，这就是让我们`施耐德`的本地化支柱与众不同的原因。我给你举个例子。看看多元化和包容性。想一想性别多样性。这是一个全球性话题。相比之下，`Black
  Lives Matter`（黑人的命也是命）则非常具体地针对美国。这在美国极其重要，因此我们需要在美国特别关注这个话题。每个国家在某些问题上都需要有针对国情的具体方法。


  对我来说，非常重要的是要平衡这样一个事实：对一家大型跨国公司而言，做出全球承诺并在世界各地推动环境、社会和治理（ESG）很重要。但同时，如果你想产生积极影响，你议程的一部分必须是本地化的。


  除了`施耐德`正在做出的全球承诺之外，我们还会问该国的领导人：“在你的国家，什么能带来改变？为了产生更强、更积极的影响，你在自己的国家应该做什么？”这是一种重新平衡的方式，以确保我们始终兼顾全球和本地两个维度。


  **帕吉萨斯：** 考虑到您设定的宏大的全球和本地目标，关于您的可持续发展战略，是什么让您夜不能寐？什么是您希望能够更快推进但目前还未能做到的？


  **布卢姆：** 我认为首要的是保持领先地位，保持创新，并始终寻找下一个前沿。我们想确保我们着眼于未来，关注下一步是什么。第二点是确保我们兑现雄心勃勃的承诺。当我们制定新战略时，我们会花六个月的时间做大量工作。我们分析我们做得好的是什么，做得不好的是什么，以及市场中的其他公司在做什么。然后我们设定非常宏大的延伸目标。例如，你刚才问到我关于供应商计划的问题。如果你接下来问我：“你有信心实现这些目标吗？”坦率地说，我不能百分之百确定。重要的是设定必要的、大胆的雄心，并尽最大努力去实现它们。


  **帕吉萨斯：** 从更广泛的可持续发展领域来看，您预计未来面临哪些挑战？



  **Blum：** 如今，大家对可持续发展和 ESG（环境、社会和治理）的兴趣与日俱增。那么，正在发生什么呢？我们正试图将所有事物标准化。例如，世界各地都在发布新标准。有
  ESG 评级机构、SASB（可持续会计准则委员会）、GRI（全球报告倡议组织），这些都是好事。我非常支持这些报告，因为它们推动全球所有大公司高度重视社会议题。这对地球有益，对人民也有益。


  但这样做的缺点是，你只是将一切标准化。如果你的公司止步于合规报告，那么作为公司或社会，就不会有进步或创新。这是因为标准化反映的是过去，而非未来。以碳为例。如今，这是一个每个人都应关注的话题。但下一步呢？我们在生物多样性方面还能做什么？当我们过度标准化企业的活动时，它就会变成一种勾选框式的任务，没有人会尝试进取和创新。对我来说，可持续性的定义就是产生积极影响。如果你想产生积极影响，而周围的世界又在变化，那你就应该改变。


  **Pagitsas：** 有没有标准化支持可持续性创新的例子？


  **Blum：** 你看，联合国可持续发展目标（SDGs）是件非常积极的事情，它将迫使世界各地的公司都关注可持续性。2015 年气候《巴黎协定》中的 SDGs
  很好，因为它们为世界上每个人创造了一个通用的标准框架。六年后，正值新冠疫情中期，所有公司都在拥抱这个话题。标准化的很多重点都放在了报告上。虽然我们需要世界至少在可持续性方面达到最低水平，但创新和可持续创新才是可持续性的本质。我们必须注意，不能忽视这一点。


  **Pagitsas：** 对于那些刚刚开始可持续发展之旅的公司 CEO 或高管团队，您有什么建议？


  **Blum：** 可持续性必须成为你文化和 DNA 的一部分。再次强调，产生积极影响这个理念是核心。确保你选择的领导者和提拔的人才，最适合实现这种积极影响。我提到这一点，是因为在施耐德电气，可持续性并非由我个人或一位非常投入的
  CEO 单独主导的。如果你想让可持续性取得进展，它必须成为文化的一部分，因此必须得到所有公司领导者的拥护，并随着时间的推移持续下去。


  **Pagitsas：** 在我们讨论结束之际，请告诉我，你最喜欢的书是什么？为什么喜欢它？


  **Blum：** 我最喜欢的书是《天生就会跑：一个隐秘的部落、超级运动员以及世界从未见过的最伟大比赛》[作者：克里斯托弗·麦克杜格尔（Knopf Doubleday
  Publishing Group，2011 年出版）]。《天生就会跑》是一本引人入胜的书，讲述了一个人对为什么人们在跑步中表现优秀或不优秀感到好奇。他在世界各地做了大量调查，以了解人们在跑步方面取得成功或失败的原因。


  我喜欢这本书，因为我热爱跑步，这关乎我自身的健康。随着年龄增长，你总是想要进步，并意识到有各种不同的进步方式。在这本书中，你会意识到，你可以通过回归自然、人性和可持续性的本源来在跑步上取得进步。我觉得这本书非常鼓舞人心。当我第一次读这本书时，我并没有预料到会得到这样的信息，我喜欢一遍又一遍地重读它。


  **Pagitsas：** 最后，是什么每天驱动着你？


  **Blum：** 基本上就是与人共事并产生积极影响。在我的职业生涯中，我意识到你给予别人越多，你从别人那里得到的也越多。这是我每天喜欢做的事情。它给了我很多能量。


  ### 16. 斯科特·图


  特灵科技公司，可持续发展副总裁兼能效与可持续发展中心董事总经理


  *斯科特·图担任特灵科技公司的可持续发展副总裁，并是能效与可持续发展中心（CEES）的联合创始人。特灵科技生产暖通空调（HVAC）系统和楼宇管理系统，截至 2020
  年底，全球拥有近 40,000 名员工，收入达 125 亿美元。他负责前瞻性的可持续发展举措，以过渡到更高效、对气候更友好的解决方案，并最大限度地减少公司设施内的资源消耗。他近期的领导工作包括：引入公司全面的
  2030 年可持续发展目标，并发起面向客户的最大规模的企业承诺，以通过“十亿吨挑战”应对气候变化。*


  *图在企业生态论坛顾问委员会任职，担任世界环境中心董事会主席，以及美国可持续发展商业理事会主席。此外，他还在北卡罗来纳州能源政策委员会任职。他曾被《夏洛特商业杂志》评为“北卡罗来纳州年度工业能源领导者”。他还获得了《企业责任杂志》颁发的企业社会责任“引领潮流”奖。*


  **克里斯·帕吉萨斯：** 特灵科技可持续发展战略的关键支柱是什么？


  **斯科特·图：** 我们有三大支柱——十亿吨挑战、以身作则和人人机会均等。“十亿吨挑战”方面，我们致力于通过下一代产品和技术解决方案，到 2030 年支持我们的客户减少十亿吨碳排放。在“以身作则”方面，我们针对自身运营中的多项活动设定目标，包括实现碳中和运营、绝对能耗降低
  10%、零废物填埋以及水资源净正面影响。最后，我们的第三大支柱是“人人机会均等”，其重点是在投资 STEM（科学、技术、工程和数学）教育的同时，实现领导层的性别平等以及员工队伍的多元化和包容性。


  **帕吉萨斯：** 为一家全球财富 500 强公司推动如此宏大的战略，成功的秘诀是什么？


  **图：** 在我看来，大型全球公司的首席可持续发展官成功的秘诀，在于要善于找到方法，通常通过一步一个脚印地改变重大事项——一个旅程是由许多里程碑组成的。正如我经常向人们、甚至向可持续发展团队所描述的那样，这有时可能是一项乏味、甚至枯燥的工作。偶尔，你会获得一个新的评级或得到外部团体的赞誉，然后人们会说：“哦，天哪。你从事的工作真令人兴奋。”而我会想：“工作并不总是令人兴奋，但看到进步和发生的根本性变化，确实很有成就感。”


  当人们问我做什么工作时，我回答：“我的工作是改进流程，将可持续性思维融入现有工具中，从而改变行为并产生成果。”作为一名可持续发展领导者，你要与公司各部门的人合作，帮助他们挑战现有的方法，以实现新的成果。


  最近，我参与了一场关于内部碳税框架的讨论，该框架正被考虑用于产品层面或范围三的碳排放。我与内部团队合作，思考了一系列关于我们产品线的问题、可能性及影响，因为任何最终的可持续性解决方案都必须与业务战略相适应。目标是帮助找出对客户和业务都有利，并能带来坚实可持续成果的解决方案。我的大部分时间都花在构思和提供意见上，以帮助我们找到不同的、坦率地说是更好的解决方案。



  你还必须具备洞察先机的能力。你必须对正在涌现或初露端倪的趋势保持好奇，并追问：“这会对公司产生什么影响？我们应该采取哪些行动？”我们不仅要理解这些问题，还必须想办法去掉其中的“理论空谈”，并确定如何向内部团队、业务经理和企业职能部门提供背景信息，从而引导出一条能够带来更好结果和行动的道路。


  **帕吉察斯：** 当你看到地平线上出现一个新兴趋势或问题时，你处理它的方法是什么？


  **图：** 理想情况下，我们会在过程中不断调整现有的流程和解决方案。可持续性整合的理念侧重于调整那些已经行之有效的现有流程——这类似于持续改进。像联合利华、3M、艾默生、霍尼韦尔，你能想到的任何一家成功公司，都找到了一种在可重复的独特价值创造流程中取得成功的方法。对于可持续发展领导者和团队来说，诀窍在于审视一个成功的流程，然后说：“你知道吗，如果我们这样调整流程，可能会发现新的、增强的价值，从而在客户方面或是在我们的设施运营方式上获得更多成功。”这些成功可能表现为，客户出于超越成本和产品性能的新原因而感到更满意。


  例如，我们的销售团队知道如何向客户销售暖通空调系统——包括那些拥有或管理非常庞大、复杂建筑的客户。他们不需要我教他们怎么做。我的诀窍是，找到方法帮助销售人员理解，他们拜访的物业同时也设定了温室气体减排目标。如果销售人员在介绍我们的解决方案时，能够说明这些方案如何帮助客户实现其温室气体减排目标，那么你就提升了价值主张，解决了客户至少两个方面的关切——舒适度和环境影响。客户会更满意，因为你不仅通过我们的设备为他们提供了舒适，还为他们提供了一种改善自身温室气体减排进程的方法。这种双赢需要为销售人员提供一种差异化做事的方式，例如设定一个大胆的减排承诺来激励行动，调整销售流程，或者开发一个能更好解释或计算优化结果的新工具。这就是我们的工作。整合可持续性就是关于调整现有流程。


  **帕吉察斯：** 你的高层领导是如何参与可持续性议题的？


  **图：** 当迈克·拉马克在 2009 年被任命为公司的董事长兼首席执行官时，董事会向他提出了一个问题，即是否有可能将可持续性作为一种杠杆（类似于精益制造），来帮助识别低效环节，并作为一种改进业务运营系统的工具。那次会议之后，迈克和领导团队（包括现任董事长兼首席执行官戴夫·雷格纳瑞）提出了疑问：“如果我们把可持续性融入我们业务和职能的肌理之中，结果会怎样？”作为回应，我们成立了能效与可持续发展中心，负责执行那些繁琐的、程序性的工作，包括调整流程、提供培训，以及引入新的见解。这些工作带来了一系列大胆的承诺，为我们的发展历程提供了指南针和焦点。


  **帕吉察斯：** 像特灵这样的设备制造公司，应当如何考虑在其业务中整合可持续性？


  **图：** 采取价值链方法至关重要。对于原始设备制造商而言，聚焦产品设计流程是关键。产品设计和重新设计通常依赖于公司开发、改造和指定产品或解决方案的一贯方式，无论是某种工具、软件应用程序，还是具有相似特性的产品类别。产品设计师进入这些设计工具，开发公司的下一代产品。工程师们精通如何在这个设计系统内工作。例如，当业务部门提出客户想要的新功能时，他们就会设计和更新产品。


  在这种情况下，可持续性团队首先要理解现有的流程和工具，然后在流程中找到合适的切入点，帮助工程师遇到并回答一系列新问题，这非常重要。例如，当你在指定原材料时，设计工具中是否会有一个地方提出这样一个问题：“这款产品应该包含再生金属吗？”要回答这个问题，你需要一系列决策树类型的问题，来探讨再生金属（例如再生铜）与原生铜相比的潜在影响。


  但要实现这一切，你首先必须围绕一系列新的、相关的问题来调整设计系统。此外，可能需要对设计工程师进行新的培训，帮助他们理解新范例背后的背景，以及各种情景可能产生的影响，从而带来增强的价值。


  随着时间的推移，你开始从根本上改变未来的产品类别。其结果是，下一代产品超越了法规要求，并提高了该类别、有时甚至是整个行业的标准。


  **帕吉察斯：** 关于可持续性，有一个需要打破的误解是什么？


  **图：** 我认为很多人有时觉得可持续性是一种约束。`效率`这个词让他们觉得：“我要放弃某些东西了。”相反，可持续性是一个增强器，它的关键在于加上`和`这个词。例如，你可以说：“我想要一辆漂亮、快速的汽车，`同时`还要一辆高效能的汽车。”或者，以我们公司为例：“我想要一个能提供舒适感的空调系统，`同时`我还希望它以最具成本效益、最环保、最高效的方式运行。”总是存在一个`和`。我认为可持续发展专业人士应该关注于`是的，同时`。我们必须善于倾听，同时一只脚立足于现在，另一只脚踏入未来，以便想出这个`和`，因为有太多好的想法还有待探索。


  **帕吉察斯：** 运用`和`的力量是可持续发展专业人士成功的关键要素。你认为可持续发展专业人士最快失败的方式是什么？


  **图：** 没有聚焦于影响最大的领域，或者不了解其公司最重要的非财务实质性议题。这是失败的根源。重要的是，可持续发展领导者要明确并持续完善那些少数几个高优先级议题——那些能产生最大影响、最有意义的议题——并且让自己成为这些议题的倡导者。


  **帕吉察斯：** 我们来谈谈特灵科技的最大实质性议题。它们是什么？


  **图：** 是减排。说实话，我们整体的温室气体排放足迹太高了。为了解决这个问题，我们付出了巨大努力来理解相关数据。拥有事实和数据，才能看清步骤，并制定出能够真正带来改变所需的路径。我们需要了解排放状况和相关问题，这样可持续发展团队才能制定出有影响力的计划和方案，以最有意义的方式解决这些问题。




  一旦确定了高优先级问题，规划后续步骤也同样重要。在我看来，那些在可持续发展领域陷入困境的领导者，往往是因为尚未明确最高优先级的事项，或是还未找到实现有价值改进所需的步骤。


  **帕吉萨斯：** 为什么减排对**特灵科技**及其可持续发展战略而言是一个实质性议题？


  **图：** 我们为世界提供制冷服务，而这个世界正在变暖，因此这一问题比以往任何时候都更加关键。在一个变暖的世界里，制冷已成为一种必需品。然而，通过`HVAC`系统为建筑供暖和制冷占用了约
  40%的电力负荷，这相当于全球约 15%的温室气体排放。**特灵科技**还有一个业务部门，负责在运输途中为生鲜食品和易腐品提供制冷，确保它们送达客户手中时保持新鲜。事实上，在确保易腐品通过公路、铁路和海洋高效运输方面，我们处于市场领先地位。我们通过制冷来保鲜，延长其有效保质期。冷链中的食品损失约占全球温室气体排放的
  10%。我们来加总一下：与建筑供暖制冷相关的排放，加上冷链食品损失相关的排放，合计约占全球温室气体排放的 25%，而这正是**特灵科技**目前正致力于解决的问题。


  我们是问题的部分原因吗？是的，因为我们的系统消耗大量能源。我们是否在试图解决问题？是的，通过我们的创新、研究、批判性思维和战略。公司专注于如何从当前的局面中脱身。这是我们的北极星。幸运的是，公司内部的每个人都理解这一点。我们团队的部分职责是，在专注于解决这些全球性问题时，识别外部利益相关者的选项、驱动因素和期望。


  聚焦问题、提出尖锐问题并分享见解，能够推动合作并创造可能性。这一切背后蕴含着深厚的热情。我们承诺将客户的碳足迹减少十亿公吨，这实际上关乎改变我们未来的产品组合。这意味着要深入理解问题，然后付出艰苦努力，为我们的客户和地球扭转碳排放曲线。


  **帕吉萨斯：** 您提到了解决客户的排放足迹问题。那么，你们是如何处理**特灵科技**自身的排放？


  **图：** 在我们的运营足迹和供应链内部，我们的目标是实现碳中和。我们依靠科学来驱动关于减排、绝对能源削减以及实现净正水资源的决策，例如提供超过我们消耗量的水资源。


  我们承诺以独特的方式与供应商合作。例如，如果你的供应商尚未设定能源目标，或者可能不了解降低能源消耗的选项，我们会帮助你制定计划，包括提供工具来帮助你跟踪进展。这才是真正的合作伙伴关系。我们邀请供应商加入我们的征程，包括未来的可再生能源购买协议。


  我们明白，单凭一己之力无法解决这些问题。我们需要以过去未曾有过的方式进行协作和合作。过去十年，我们在合作方面做得不错，但和许多公司一样，未来我们在与他人合作方面必须做得更好。而且，我们可能需要以不同的方式解决未来的问题，比如通过众包创意或游戏化。我们也认识到，必须以一种包容多元化人群、观点和意见的方式来解决问题。


  **帕吉萨斯：** 您提到了客户和您的运营。那么，你们是如何让员工参与进来的？


  **图：** 员工参与对我们的努力至关重要。例如，我们最近启动了`“行动可能”`计划，邀请员工向我们提出关于“荒谬想法”的建议。这一举措向员工传递了一个明确的信息：“我们需要你们的想法——哪怕是荒谬的想法——帮助我们解决重大挑战。”如果你有一个能帮助解决荒谬问题的想法，却一直没找到平台讨论，那么`“行动可能”`计划就为你提供了参与的机会。这就是你的时刻。我们已经收集了数百个令人兴奋的概念和想法，它们都展现出了真正的潜力。


  我们将继续与员工一起推进这项工作，并正在探索如何将范围扩大到公司外部。如果有人在外面发明了一项颠覆性技术，可能导致下一代空调的出现，并希望与我们取得联系，这可能就是你的时刻。


  **帕吉萨斯：** 自从你进入这个领域以来，可持续发展团队的招聘方式发生了怎样的变化？


  **图：** 当我开始从事可持续发展工作时，我寻找的是那些既懂技术又善于处理模糊问题的人。当时很少有相关的资格证书，大学里也几乎没有可持续发展专业项目。如今，我仍然在寻找那些善于在没有权威的情况下领导并拥有独特技能的人。然而，如今合格候选人的范围已经非常广泛。找到拥有可持续金融到可持续设计等学科学位，以及拥有绿色建筑科学、`ESG`报告和回收等问题专业资格的申请者已非常普遍。此外，许多申请者还带来了在致力于解决复杂问题（如食品损失）的组织中积累的多年`ESG`相关经验。对年轻专业人士来说，这真是一个激动人心的时代。兴趣的多样性以及公司内部日益提升的关注度，很好地说明了这个领域的发展方向，以及学生们如何专注于应用这些技能来产生积极成果。


  **帕吉萨斯：** COVID-19 疫情如何改变了**特灵科技**支持员工的方式？


  **图：** 我们在疫情中学到了很多关于我们的业务、我们的承诺以及未来不同工作方式的经验。其中一些问题已经包含在我们的 2030 年承诺中，包括我们称之为`“人人有机会”`的战略支柱。这一战略基于一个理念：未来工作的大趋势将改变我们的工作方式。但当我们在设定这一承诺时，我们并不完全清楚这意味着什么。COVID-19
  为未来工作提供了新的视角，带来了许多教训。


  在人员方面，我们公司一直注重安全。在将员工安全放在首位方面，我们是行业领导者。我们在疫情初期就开始了居家办公。我们也开始思考所需的灵活性，以帮助员工在家保持生产力。我们推出了一系列支持居家办公的新资源，包括对托儿服务以及灵活和混合办公安排的考虑。许多团队已经找到了以混合模式或完全远程模式保持高效的方法。很明显，未来工作对我们所有人来说都会有所不同。


  在业务方面，我们公司多年来一直在深入思考室内空气质量问题。这是我们的主业。然而在过去，这个问题并未引起建筑所有者的高度重视。但 COVID-19 疫情无疑引发了诸如“什么是‘安全的室内空气’？在我的家里？在我孩子的学校？以及在办公室，以便我能安全返回？”等问题。





  我们公司之所以担忧，是因为听到媒体上有太多人在宣扬过滤器是快速解决问题的办法。我们非常担心，学校和企业会在建筑中添加许多仅作表面功夫或可能带来严重副作用的东西。例如，新增设备时若未评估其对整体建筑系统的影响，可能会导致意想不到的后果，比如增加能源账单，并抵消建筑的所有能效增益。


  因此，在 2020 年 9 月，我们成立了健康与高效空间中心（`CHES`）。我们致力于将健康建筑与高效建筑的理念联系起来，旨在最大限度地减少负面权衡。我们相信，可以实现建筑既健康又高效。此外，我们还成立了一个由全球顶尖科学家和建筑专家组成的外部顾问委员会，为我们的这一旅程提供建议。


  这一概念之所以重要，是因为人们通常认为，在能效或可持续性方面采取行动不会产生负面权衡。人们可能会说：“我们不惜一切代价追求健康。”而我们的回应是：“你们完全可以在不必然增加成本的前提下实现健康。”这种“*是的，而且*”的方法在市场上独树一帜。


  我认为，包括特灵科技在内的大多数公司，都从疫情中深刻领悟到了关于人员、安全、期望、协作、团队合作、伙伴关系，以及如何特别地解决客户重大问题的道理。


  **帕吉萨斯：** 如果您想对非可持续发展领域的商业领导者说一句话，那会是什么？


  **图：** 我想说的是，可持续发展正以令人振奋的新方式创造价值。更好的方式是可能的！





  ### 17. 弗兰克·奥布莱恩-贝尔尼尼


  欧文斯科宁高级副总裁兼首席可持续发展官


  `Frank O’Brien-Bernini` 是欧文斯科宁的高级副总裁兼首席可持续发展官（`CSO`）。欧文斯科宁是一家全球建筑和建材领导者，在 33 个国家拥有
  19,000 名员工，2020 年收入为 71 亿美元。Frank 负责全球可持续发展战略的制定和实施，包括运营可持续性、环境健康与安全（`EH&S`）、产品和供应链可持续性、企业医疗与健康、产品监管与毒理学，以及位于俄亥俄州格兰维尔的公司的科学技术中心。


  自 1983 年加入欧文斯科宁以来，Frank 担任过多个领导职务，包括首席研发官，之后于 2007 年成为首席可持续发展官。在加入欧文斯科宁之前，Frank
  经营一家太阳能设计/建造公司。


  Frank 定期与欧文斯科宁董事会就战略、执行和影响进行讨论。他参与新董事会成员的入职培训，并曾担任多个董事会职务，包括为 Powering Ohio、`RESNET`（住宅能源服务网络）、Vytec
  Corporation、`NAHB`（全国住宅建筑商协会）主要供应商委员会、俄亥俄州住宅建筑商协会、多功能聚合物纳米材料和设备中心以及俄亥俄州生物聚合物创新中心服务。作为`RESNET`董事会成员，他设想并创立了其供应商咨询委员会，以增加供应商视角并为`RESNET`提供大量资金。


  **Chrissa Pagitsas：** 截至 2021 年，你在欧文斯科宁已经工作了超过三十八年。能否带我们回顾一下你的职业生涯，以及你是如何成为欧文斯科宁首位首席可持续发展官的？


  **Frank O’Brien-Bernini：** 这是一段漫长的旅程。或许从我还是个孩子时就开始了，因为我的母亲是一位环保倡导者。我们居住的社区后面有一家化工厂，所以她成为了一位非常积极的污染减排倡导者。那可能是我对环保倡导的初次接触。小时候，我观察到企业影响环境和周边社区的复杂性和挑战性。我们的许多邻居在这家工厂工作，所以他们对她那种可能导致工厂失业的倡导并不太高兴。


  上大学时，我有机会成为北亚当斯州立学院（现名为马萨诸塞州文理学院）资源生活中心新学科的第一批学生。资源生活中心是一个介于物理系和历史系之间的交叉学科项目，融合了自然科学和社会科学，专注于我们现在所说的可持续发展。它关注可再生能源、有机农业、可持续农业等等。由于这个项目，我对太阳能、能效和其他类型的可再生能源产生了浓厚兴趣，于是辍学，并在佛蒙特州南部创办了一家专注于超隔热被动式太阳能房屋的设计建造公司。


  我经营了那家公司三年，之后决定自己真的很喜欢工程部分。我回到学校学习机械工程，并专注于太阳能。我获得了机械工程硕士学位，并以太阳能为题撰写了论文。欧文斯科宁通过奖学金支持了我的研究，我也因此结识了这家公司。三十八年前，在我向欧文斯科宁展示我的奖学金研究成果后，他们给了我一份工作。


  在欧文斯科宁的职业生涯中，我担任过各种研发（`R&D`）职位，直到最后担任首席研发官，并开始倡导可持续发展战略。2002 年，当时的 CEO 对我说：“这很酷。我不太明白你在说什么，但如果你能在做好研发工作的同时做这个，那很好。我们就两者并行吧。”


  所以，那是我第一次同时担任首席研发官和首席可持续发展官。然后在 2007 年，新任 CEO 要求我全职专注于可持续发展。从那以后，这便成了我的全职工作。这就是我精简版的故事。


  **Pagitsas：** 你在可持续发展领域可不是半路出家。


  **O’Brien-Bernini：** 是的，确实如此。


  **Pagitsas：** 那么让我们做个对比练习，看看 2007 年你刚担任这个新领导职务时，可持续发展对欧文斯科宁意味着什么，以及 2021 年的今天又意味着什么。


  **O’Brien-Bernini：** 这是一个有趣的演进过程。我认为欧文斯科宁在可持续发展方面的进展，反映了世界对可持续发展思考广度的拓展。我们刚开始时，是首批设立我称之为“整体足迹缩减目标”的公司之一。我认为大多数公司都是这样起步的——先把自己的事情理顺。


  我们在 21 世纪初起步时，`IPCC`（政府间气候变化专门委员会）刚刚在 2002 年 4 月发布了一份报告，强调了人类活动与气候变化的联系。我认为这对许多生产高能耗、高二氧化碳排放产品的工业企业来说是一个警醒。我们开始着手控制我们的能源使用和二氧化碳排放。几乎与此同时，美国绿色建筑委员会和其他绿色建筑项目开始通过其绿色建筑认证积分体系和项目（如能源与环境设计先锋奖，`LEED`）获得关注。我们的业务聚焦于建筑材料领域。所以，尽管当时还处于萌芽阶段，但很明显，绿色建筑将受到越来越多的关注，并且对我们这些建筑材料制造商来说存在市场机会。


  我们开始可持续发展之旅时，思考的是如何缩小我们的环境足迹并扩大我们的产品手印。本质上，通过减少环境足迹来减少负面影响，通过提供更可持续的产品来增加正面影响，从而扩大我们的手印。我认为我和世界上大多数公司都是这样开始可持续发展之旅的。


  随着时间的推移，我们的可持续发展之旅变得更加广泛。我们纳入了社区外展和供应商期望。然后，我们开启了健康之旅以消除生活方式引发的疾病，以及安全之旅以消除工作场所和家中的伤害。我们不断提升可持续发展战略的期望和雄心，包括将包容性和多元化纳入其中。


  最近，我们明确了对循环经济以及产品全生命周期的愿景，而不仅仅是欧文斯科宁控制的那些部分。随着时间的推移，世界和欧文斯科宁都加深并拓宽了我们的雄心。与此同时，最近发生的变化是，`ESG`（环境、社会和治理）投资者的期望变得更加细致。


  我们现在看到，与注重环境或“E 聚焦型”的投资者和客户交流时，对话变得更加具体，关乎欧文斯科宁在脱碳世界中的产品线机会。他们想知道我们有哪些解决方案能够为我们的公司创造增长机会，并帮助我们的客户成长。对话已经从比较笼统的“我们想确保你们在`ESG`领域跟得上潮流”，演变为“你们具体会向市场推出什么？”以及“你们的产品线相关的隐含碳是多少？”


  **Pagitsas：** 当有许多优先级和策略各不相同的投资者和客户时，你如何决定要处理的首要问题？


  **O’Brien-Bernini：** 通过实质性评估。


  **Pagitsas：** 你如何定义实质性评估？


  **O’Brien-Bernini：** 从最高层面来讲，它是一种分析性评估，旨在找出最重要的事项。就像财务实质性一样，它关注的是那些以某种方式投资于你公司的利益相关者最关心的事情。这些利益相关者可以是员工、你运营所在的社区、你的客户，当然也包括投资者。这是一种积极的评估，用以了解他们对你的公司的期望。然后，你就可以确定应该将资源聚焦在哪里并设定目标。


  **Pagitsas：** 在欧文斯科宁最新的 2019 年实质性评估中，为什么循环经济对你的内部和外部利益相关者来说都是得分最高的实质性问题之一？


  **O’Brien-Bernini：** 我认为世界正在意识到气候行动是北斗星。关于循环经济有很多讨论。但我认为它从属于气候行动和减少二氧化碳排放这个北斗星。对我们来说，而且我普遍认为对世界来说，循环经济是减少气候影响的众多选项、技术和方法的饼图中一个强有力的策略。


  循环经济是一种通过智能设计、可再生和回收投入、节能生产以及实现产品生命周期末端的可回收性，来最大限度地减少原始原材料、废弃物、能源和排放的经济模式。我们的愿景是，所有用于制造欧文斯科宁产品的原材料都能无限期地留在经济体系中。对我们的业务来说，这是一个强有力的气候行动杠杆。例如，当我们使用更多回收材料来制造产品时，它减少了与制造这些产品相关的隐含碳或二氧化碳排放，因为使用已经加工过的材料制造所需的能源更少。如果我们使用废玻璃来制造新玻璃，与使用沙子、氧化铝和硼酸盐等基本原材料相比，其能耗和有毒气体排放都更低。


  我们将循环经济视为从努力提高能效以减少能源消耗，再到大规模购买可再生能源这一进程中的“大策略”。当我们沿着从减少二氧化碳排放到完全脱碳这条瀑布式路径发展时，循环经济是帮助我们实现脱碳的重要策略。


  **Pagitsas：** 欧文斯科宁是否有哪款特定产品，您认为已经达到了最高的碳减排水平，并且是真正循环经济的代表？


  **O’Brien-Bernini：** 由于我们的雄心很高，目前没有产品达到了最高水平。但是，我们确实有一些产品在这条道路上走得非常远。今天，我们的玻璃纤维保温产品中大约使用了百分之七十的回收成分。我们认证的回收成分在百分之五十三到百分之七十三之间，具体取决于产品。这些回收玻璃主要来自啤酒和葡萄酒瓶、建筑制造和拆除产生的平板玻璃，以及汽车车窗玻璃的制造和生命周期末端操作。我们现在非常大量地使用回收材料。这样做消除了开采沙子、硼酸盐、氧化铝、石灰石等制造玻璃常用原材料的需求，从而避免了与原始原材料开采相关的能源消耗和隐含碳减排。


  在我们的熔炉操作中，当我们熔化玻璃而非原始原材料时，也能大幅减少能源使用。这些熔炉的排放也更少，因为重熔玻璃的排放特性低于熔化原始原材料。最后，我们可以将产品作为高回收成分产品进行销售。


  **Pagitsas：** 使用回收材料显然既有环境效益也有商业价值。是否有社区或社会效益？


  **O’Brien-Bernini：** 是的。社区回收利用会带来巨大的社会效益。回收过程中会创造当地就业机会，无论是雇用人员进行路边回收，还是在`MRFs`（城市回收设施）工作。与开采提取（通常高度机械化）相比，回收这些材料每吨使用量往往能创造更多就业机会。同时也提供了本地就业机会。我们使用的材料，如沙子、石灰石等，通常可以在当地获得，所以我们一般会非常本地化地采购材料。回收价值链通常比原始原材料提供更多的就业机会。


  **Pagitsas：** 回到投资者的视角，你现在与投资者进行怎样的对话？


  **O’Brien-Bernini：** 是的。目前，投资者可以分为三个类别。他们可能对自己的划分方式略有不同，但在我看来，我们有一些投资者是更“传统的投资者”，与他们的对话主要由财务、收入、前瞻/后向预测和市场主导，然后是一个相对次要的勾选框，用于确保我们的公司没有做任何会让作为投资者的他们感到尴尬或产生意外的环境、社会或治理风险的事情。


  但我认为这个群体正在萎缩。投资者总体上正在进入接下来的两个类别。下一类投资者对`ESG`有很高的兴趣，他们想真正了解在环境（*E*）方面，我们在减少足迹和脱碳方面做了什么。而在社会（*S*）方面，他们想了解我们的包容性和多元化、董事会结构、我们在吸引更多女性方面做了什么，以及我们如何增加多元种族少数群体在领导层和董事会中的代表性。他们对`ESG`的所有方面都非常感兴趣。


  第三类投资者可能比较小众，但这是一个不断增长的小众群体。我们相当一部分投资者现在是聚焦环境（E-focused）的，他们正在建立一个公司组合，以便将其基金定位为气候行动基金。他们想了解我们在全球、欧盟和美国推进建筑能效方面具体做了什么，特别是考虑到我们在这些地区的建筑材料业务。他们非常关注我们股票的增长机会和股东总回报机会，这与我们在他们为气候行动基金进行投资时最关心的事项上的积极敞口息息相关。这就是我们与投资者进行最多对话的三个领域。


  **Pagitsas：** 假设一位高管说：“我不想要那第三类投资者的钱，因为他们的气候行动要求会超出我的能力范围，并让我面临法律责任。”你会如何回应？


  **O’Brien-Bernini：** 这是一个很好的问题，而且在某些方面，请完全尊重地说，这是一个无关紧要的问题。（笑声）


  **Pagitsas：** 很好，我来扮演一下唱反调的人。为什么是无关紧要的？


  **O’Brien-Bernini：** 投资者试图理解的是我们的商业战略。我们永远不应该回避我们的商业战略。例如，我们商业战略的一个方面是扩大我们在风电业务中的影响力。我们提供用于那些巨大风力叶片的玻璃纤维和织物，这些叶片使得更大的风力涡轮机成为可能。我们的材料使风力叶片更轻、更长、更强。这意味着我们的客户，即制造涡轮机和风力叶片的大型风电`OEM`（原始设备制造商），可以为陆上和海上应用制造越来越大的涡轮机。


  当投资者试图了解我们的积极敞口时，他们想知道我们在做什么来确保我们在不断增长的风电行业中的重要地位。如果他们关注建筑材料领域，他们想知道我们在开发被绿色建筑和高能效建筑领域选用的产品方面做了什么。


  我们不是试图为公司设定一个目标来吸引 E 型或`ESG`投资者。我们是在努力透明地沟通我们的商业战略，如果它与他们的投资策略一致，他们就是我们的优秀合作伙伴或优秀所有者。我们不是通过设定雄心勃勃的目标来吸引投资者。我们是在努力沟通我们的商业战略。


  **Pagitsas：** 假设这位高管仍然回应说：“谢谢，Frank，但我做得很好。我的核心战略运行良好且盈利，不需要减少碳排放。我不会将可持续发展整合到我的核心业务中。”你会对他们说什么？


  **O’Brien-Bernini：** 我会告诉你，你正在错失良机。我不是说你错了，但我的意思是，世界致力于脱碳。你可能现在做得很好，但你的客户会越来越多地询问你关于可持续发展战略的一般性问题，或者具体询问你的碳减排目标，因为你是他们的供应商，你做或不做的事情会影响他们实现自身可持续发展目标的能力。


  越来越多的客户，在五年前与我们进行关于我们目标的对话时，是一次非常友好的对话，会问：“你们的承诺是什么？作为一家公司，你们全球关注的重点是什么？”那是一次非常愉快、舒适的对话，大家都很高兴彼此做生意。


  但在过去一两年里，这种情况变得具体得多。我们一些最大的客户和一些较小的、快速增长的客户想具体了解我们卖给他们的产品所涉及的二氧化碳排放量。不是公司的整体情况，也不是与碳相关的全球目标，而是我们工厂制造的、以特定方式运输的、到达他们码头的特定材料的排放量。他们想知道这些产品的隐含碳是多少。


  如果你，作为你所描述公司的那个高管，因为你认为产品在当前以合适价格提供性能而说这无关紧要，从而无法回答这个问题，我的看法是，你将被“除名”，换句话说，被炒鱿鱼，不再作为供应商。客户可能会明确表示“不要`XYZ`公司的产品”，因为他们不知道其隐含碳。这对那个供应商来说是个问题。我们绝不想成为那家`XYZ`公司！


  **Pagitsas：** 你的意思是，建筑师们正根据制造商是否披露产品的隐含碳，明确告诉他们的客户应该购买哪些产品，不应该购买哪些产品。


  **O’Brien-Bernini：** 是的。这就是我在那个战略中看到的风险。你可能会说你不相信碳减排的重要性。你可以按照自己的意愿经营那家公司，这没问题。但如果你试图吸引投资者，比如我提到的
  E 型或`ESG`投资者，你不会成功，因为他们会说：“这些家伙毫无头绪。”至少，他们会说：“他们没有为利用一个明显的长期趋势做好准备，这个趋势我们认为在未来几十年将会展开，因为世界目标最晚在
  2050 年实现脱碳。我相信世界在脱碳方面的决心正在增强，这与`IPCC`的全球变暖不超过 1.5 摄氏度的最佳路径是一致的。”


  **Pagitsas：** 你清楚地阐述了一个观点，即一家不重视减排的公司正在错失投资者和客户所走向的方向。回到产品层面，为什么你的客户会询问欧文斯科宁为他们生产的产品的碳足迹？


  **O’Brien-Bernini：** 在许多情况下，他们是在回应他们自己的客户。我们在某些供应链中处于一、二或三层级的位置。我们之前谈到过风电业务。我们提供用于风力涡轮机叶片的玻璃纤维。这些叶片被安装到涡轮机上，然后卖给风电开发商。而这些开发商要么出售开发好的项目，要么出售电力。


  在决策者价值链的某个环节，有人会问：“你们的涡轮机的隐含碳是多少？”这是因为决策者试图说服政府，例如，风力发电是比天然气更好的选择。为了进行基于科学的对话，决策者需要知道运行二十年的风力涡轮机与同样运行二十年的燃气轮机相比的完整生命周期影响。因此，他们需要回溯到价值链中的我们，即制造玻璃纤维的欧文斯科宁，来了解碳排放情况。因为对于风力涡轮机来说，几乎所有的碳排放都发生在前端。


  建造完成后，风能在二十年里基本上是零碳的。大部分情况下没有碳排放影响，不是零但接近于零，但建造过程的碳排放并非接近零。如果你要与政府进行基于科学的对话，你最好事先知道那些隐含碳是多少。他们需要从我们这里了解用于风力涡轮机叶片的玻璃纤维相关的碳排放。


  这一切都是为了响应客户了解影响的需求，以便他们能够有效地代表自己的产品。汽车行业也是如此。汽车行业正在推出电动车（`EV`）。关于制造电动车相关的隐含碳有很多讨论，当然，这些`EV`中也有玻璃纤维复合材料。


  汽车`OEM`接着会问我们的客户，即热塑性塑料混料商：“用于这款`EV`轻量化的材料的隐含碳是多少？”然后我们就可以进行`EV`生命周期与可能更重、使用更多钢材的内燃机汽车的对比讨论。这是一个被问到的商业问题，而非可持续性问题，但回答它需要深厚的可持续发展技能和能力。


  **Pagitsas：** 我们讨论了欧文斯科宁在 B2B 背景下的客户。是否有来自个体消费者关于欧文斯科宁可持续发展战略或其产品可持续性的反馈、影响或讨论？


  **O’Brien-Bernini：** 由于我们的业务几乎完全是 B2B，我们与消费者的互动是间接的，来源于我们的直接客户试图与他们的客户达成的目标。话虽如此，我们的员工经常就我们的方法提供反馈，而可持续发展对于招聘来说正成为一个越来越重要的谈资。与欧文斯科宁共事或考虑加入欧文斯科宁的人关注我们可持续发展工作的“言行一致”，这并不奇怪。人们希望有所作为，并希望他们的工作与个人价值观保持一致。当然，员工也是消费者——他们中的许多人家里和周围都有欧文斯科宁的产品。他们是确保我们认真对待承诺并专注于重要事项的重要声音，这也是我们常规实质性评估的重要输入。


  **Pagitsas：** 你在欧文斯科宁工作了三十八年，对商业战略规划流程非常熟悉。你们在欧文斯科宁是如何规划的？可持续发展战略如何融入规划流程？


  **O’Brien-Bernini：** 我们有一个持续进行的三年长期规划流程，我们在三年时间框架内制定商业战略，而该战略的第一年就是我们的运营计划。在此框架内，商业战略和可持续发展战略在这三年时间框架内完全一致。


  这一切的运作方式，也是我在任何公司（当然也包括我们公司）中最喜欢可持续发展的一点，就是它是我们公司唯一设定非常长远目标的领域。例如，我们需要规划一个十年目标，即减少百分之五十的二氧化碳排放。因此，我这个小规模可持续发展团队的核心职能，就是确保我们商业的长期计划（是三年，不是十年）中包含非常具体的项目，以朝着十年目标取得进展。


  **Pagitsas：** 如今，欧文斯科宁按产品垂直领域组织。一个垂直领域是屋面，另一个是复合材料，第三个是保温材料。在战略执行中，哪些属于你团队的责任，哪些属于业务产品垂直领域的责任？


  **O’Brien-Bernini：** 大部分情况下，我们的可持续发展项目和举措是在拥有大部分资源的业务部门中执行的，而不是由我们的核心可持续发展团队执行。虽然我们提供路线图、实现目标的选项瀑布流，但人才和财务资源来自业务垂直领域。例如，我们有一个减少百分之五十温室气体的目标。这是一个基于科学的目标。我们有一个实现该目标的策略瀑布流，包括使用不同的材料系统，这些系统在加工过程中排放更少。另一个例子可能是增加可再生能源的使用，从我们目前的百分之五十左右提高到
  2030 年的百分之百。我们的工作是确保这些项目存在于业务计划中。我们将其视为从演示文稿到项目的转变。存在于业务中的项目将使我们能够实现企业目标。


  我们带来的贡献是技术专长，例如理解我们的产品如何帮助建筑获得`LEED`认证积分。但是，我们的工作还要向业务部门明确指出市场趋势的走向，例如市场越来越关注`GREENGUARD`认证，该认证涉及产品排放，对于良好的室内空气质量很重要。我们总是希望分享一个有见地的观点，即三年后，你产品中的这种红色清单材料将因为`LEED`或其他认证的新要求而不再被接受。我们的工作是看得更远，确保存在这些项目，并为我们希望在一、二、三年后——甚至一、二、三十年后——运营的业务提供支持。


  **Pagitsas：** 是你的团队拥有这个项目？还是业务领导者，比如复合材料业务负责人 Marcio Sandri？


  **O’Brien-Bernini：** 两者都是！也许两个不同角度的不同故事有助于说明我们如何构建项目所有权。关于全球范围内制造的复合材料玻璃纤维、织物和无纺布毡材料，我们有一个
  2030 年目标，即消除来自我们制造操作并进入垃圾填埋场的废弃物。玻璃纤维废料很难回收。这是一个真正的挑战。虽然我们希望消除它并且有这个雄心，但我们必须有项目来解决技术挑战，比如将玻璃纤维经济地回收回我们的复合材料玻璃熔炉的工程挑战。保温材料方面也是如此，但让我们先专注于复合材料。


  实际上，我有一位循环经济制造解决方案总监，她负责确保与玻璃纤维回收目标相关的项目得到合适人员的资源支持，找出解决挑战所需的技术，并确定如何通过资本资助来执行解决方案。Teresa
  Wagner 就是这位总监。她有责任确保存在一个项目组合来实现这些目标。她与 Marcio 的团队以及运营副总裁 Umberto Rigamonti 协作。Teresa
  和 Umberto 紧密合作，共同目标是消除复合材料进入垃圾填埋场的废物。他们进行试点项目来测试技术，以确保它们有效。


  这是一种协作，但 Teresa 是判断我们是否步调一致的人。她有责任确保我们实现 2030 年的目标，并且如果她的项目组合无法达成目标，她会大声疾呼。大声疾呼后产生的行动将是从业务部门向项目增加资源，以确保目标按计划实现。这非常像一项团队运动。


  我想给出的另一个例子是，并非所有项目都这样运作。我们渴望实现百分之百可再生电力运营。为了实现这个目标，有一个小团队在为此工作，包括我的团队、财务团队和负责所有能源采购的采购团队。他们采购化石燃料以及可再生能源。


  这个由财务、采购和可持续发展组成的三方团队负责发出`RFP`（招标书）并达成交易，为我们的公司采购可再生能源。这类项目，其受益方是整个企业，并非与三个业务部门合作完成的。他们是这项出色工作的接收方。


  **Pagitsas：** 有没有一个故事体现了在实现某个目标过程中的难忘成功？


  **O’Brien-Bernini：** 我们已经讨论过长期目标和战略雄心的力量。我们最近推出的产品 Foamular `NGX` 的故事就是一个很好的例子。正如我之前提到的，在要求可持续产品方面，监管通常比客户慢，因此超越合规是我们商业雄心的一部分。自
  21 世纪初以来，我们一直致力于减少挤塑聚苯乙烯保温产品的气候影响，努力在满足客户需求的同时保持领先于法规。


  虽然我们已经在这方面取得了稳步进展，但我们的新产品 Foamular `NGX` 是向前迈出的一大步，在不牺牲性能的情况下实现了百分之八十的隐含碳减排。在二十多年的开发过程中，我们有六位不同的总经理管理这项业务。然而，我们清晰的雄心和目标使这个非常复杂的研发工作保持在正轨上，并实现了这一重要的进步。这比我所能分享的任何其他故事都更能体现雄心、长期目标和一致的北斗星的力量！


  **Pagitsas：** 是否也有同样令人难忘的挑战或障碍，最终被克服或带来了重要的“经验教训”？


  **O’Brien-Bernini：** 当我们最初着手为住宅保温市场开发无甲醛玻璃纤维产品时，我们非常专注于这个单一的“可持续属性”。当我们向客户展示正在开发的样品时，我们清楚地意识到，除了提供新的更环保的属性外，产品的核心功能需要在安装速度和性能等方面表现出色。


  许多客户用了`CFL`（紧凑型荧光灯）的类比，说他们不会为了获得即使是像无甲醛这样重要的可持续属性而牺牲核心功能。那是在`LED`（发光二极管）普及之前，`CFL`虽然非常节能，但需要很长的预热时间才能达到完全照明。我们采纳了一个至今仍用于我们开发工作的短语：“绿色无妥协”。这在我们界定新产品开发中“什么是成功”方面，继续发挥着很好的作用。


  **Pagitsas：** 经常有人向我寻求建议，问公司应该将可持续发展团队设在组织中的哪个位置。你认为可持续发展团队应该在哪里？


  **O’Brien-Bernini：** 无处不在。


  **Pagitsas：** 同意！可持续发展团队需要与业务的每个部分合作。从组织架构图的角度看，你向谁汇报？


  **O’Brien-Bernini：** 我向 CEO 汇报，然后我的组织通过我的领导团队向上汇报。我们是一个相对扁平的组织。我团队的工作直接与 CEO 相连。我的直接下属负责环境、健康、安全和可持续发展，再下一层是向他们汇报的个人贡献者和项目负责人。


  **Pagitsas：** 你真的处于核心位置。


  **O’Brien-Bernini：** 没错，是的。


  **Pagitsas：** 让我们谈谈社会问题。为了在欧文斯科宁内部解决多元化和包容性问题，公司的战略发生了怎样的变化？


  **O’Brien-Bernini：** “变化”只是对我们已开展工作的加速。这是我们的长期可持续发展目标如何帮助我们走上并保持正确道路的另一个例子。2019
  年，我们的新任 CEO Brian Chambers 设立了一个新的多元化和包容性副总裁职位。当我们设定 2030 年可持续发展目标时，高管层大力支持设定正式的多元化和包容性目标。我们内部一直在做这项工作，但这是我们第一次设定广泛、公开、长期的目标。由于这些目标，我们已经开始就这些话题进行艰难但重要的对话。


  所以，例如，当关于种族和社会不公的关键对话通过“黑人的命也是命”运动在美国燃起时，我们已经有了需要做什么的基础。但很快就清楚，我们需要做得更多、更快。我们加快了内部项目和培训的步伐，并开始寻找与社区互动的方式。根据我们的目标和宗旨以及员工和社区的期望，公司——以及
  Brian 本人——希望在外部发出更有力的声音。从在社交媒体上发表声明，到召集我们位于俄亥俄州托莱多的全球总部周围的 CEO 和社区领袖，并承诺投入超过 600
  万美元来促进托莱多的种族平等和社会正义，我们一直在努力贡献我们的声音和资源来做出改变。


  **Pagitsas：** 对于可持续发展与商业的交汇点，你持有什么希望？你又担心什么？


  **O’Brien-Bernini：** 两个很棒的问题。我会说，五年前，我担心没有足够的市场拉动力来大规模推动可持续发展解决方案。我现在不再担心了，因为这个领域的投资者问题变得越来越尖锐、越来越具体、越来越不客气，这对我来说是有帮助的。没有什么比投资者、客户和员工直接与我们的高管或董事会就这些话题交流更能推动战略向前发展了。


  也许那是我过去担心的，但现在不担心了。这让我对我们将利用市场拉动力来推动气候行动充满希望。围绕隐含碳、脱碳等问题的期望将把关注点从关注法规转向关注客户，我认为这对大多数组织来说更为紧迫和引人注目，因为人们常常因法规进展缓慢而感到安慰，但客户可以像这样行动。（打响指）他们可以决定：“我们不再对你们满意了，因为我们认为你们的行动与我们的战略不一致。”我非常看好并希望，由于市场和投资者的期望与拉动，气候行动将大幅推进。


  我现在最担心的是什么？我认为每个人都担心速度——影响的速度，如何做得更大、更快、更远。这肯定是每个人都在思考的问题，无论是关于社会正义、环境正义还是气候行动。每个人都越来越不耐烦，想要更快行动，这很重要。


  **Pagitsas：** 是什么每天驱动着你？


  **O’Brien-Bernini：** 在一个拥有决心和资源进行快速变革的大型营利性公司中，推动大规模影响的机会是推进可持续发展的巨大优势。


  **Pagitsas：** 哪本书激励了你，为什么？


  **O’Brien-Bernini：** 从本质上讲，我是一个研发型的实用创新者，所以我喜欢《逆转全球变暖的全面计划》（*Drawdown: The Most
  Comprehensive Plan Ever Proposed to Reverse Global Warming* by Paul Hawken, editor
  (Penguin Books, 2017)）。这本书将气候变化的巨大挑战分解为可用于减缓气候变化的行动饼图。它将脱碳这个非常棘手、模糊不清的全球性挑战转化为建筑、工业能源和电力使用以及运输等领域的潜在影响。在此基础上，它进一步探讨了可以大规模实施哪些重大举措来影响饼图的这一部分。


  我喜欢这本书，因为它与我在公司里思考可持续发展的方式非常吻合。它框定了北斗星，以及我们通过宗旨、人员和产品让世界变得更美好的目标。它帮助我问我的团队：“你如何从那个宏大的目标雄心，一直联系到你今天正在做的项目？”这就是我喜欢这本书的原因。我经常参考它，因为它包含了很多非常有用的数据。


  这本书背后的人们持续从事这项工作，书中包含了所有引文，因此你可以跟踪他们通过技术期刊推进的持续工作。我真的很喜欢这一点。也许这是一个无聊的答案，因为这是我的工作，但好在，我这份绝对不无聊的工作与我的生活高度融合。


  **Pagitsas：** 哪个人或哪段经历对你的领导风格影响最大？


  **O’Brien-Bernini：** 我发现有四种能力对`CSO`角色至关重要，而对我来说，每一种都有一段影响我的历史。这些能力是：变革领导力、受目标驱动、利用讲故事的力量、以及工作生活融合。


  成功领导变革是`CSO`角色的核心。我同时是 Simon Sinek 的“为什么-怎么做-是什么”模型和 John Kotter 成功推动变革八步模型的粉丝。Simon
  Sinek 的模型迫使你以正确的顺序来吸引他人，毫不意外，从你的公司或倡议为什么存在开始。John Kotter 的模型有助于确保你充分考虑并善用所有经过验证的步骤来有效推动变革。这些是我经常引用的非常扎实的策略。


  关于受目标驱动，我深受 Larry Vadnais 的影响，他是我的教授，也是北亚当斯州立学院资源生活中心背后的推动力量。他帮助我看到了宣示目标并每天在做大大小小决策时与北斗星保持一致的价值。


  我们的前 CEO Dave Brown 是一位讲故事的大师，我从他那里学到了很多。有一次，我们正在准备一个关于我们产品手印或积极影响的董事会演示，我记得自己专注于工程数据。然而，他帮助我构建了一个强有力的故事，将数据转化为更易理解的类比。我最终与董事会分享的故事是：“让我们看看在芝加哥建造的一栋典型住宅的手印或足迹‘计算’。用制造、运输和安装我们的
  EcoTouch 保温材料以满足这座 2400 平方英尺芝加哥住宅的节能规范所需的能源，你可以开着一辆普通汽车横穿美国大约 3000 英里。那需要很多能量。现在，让我们看看这种保温材料在通常的六十年使用寿命内节省的能源。好吧，你可以开着同一辆车往返月球约
  47.8 万英里的旅程，不是一次，不是两次，而是五次！这就是‘做得更多的好事’的数学计算。”


  最后，根据我自己的经验，工作与生活的融合对于个人和职业幸福至关重要。这与追求工作与生活平衡不同。这种对融合的追求，是我在职业生涯中逐渐意识到的，它通过寻求将我的工作生活和个人生活完全融合，帮助我缓解了追求工作与生活平衡所带来的常见压力。鉴于我个人的信念和`CSO`的角色，这一点……




  '
- "# 第四部分：金融服务、投资管理与商业地产\n\n### 18. 埃尔莎·帕兰扎\n\n董事总经理，全球可持续发展与 ESG 主管，巴克莱银行\n\n`埃尔莎·帕兰扎`是巴克莱银行董事总经理兼全球可持续发展与\
  \ ESG（环境、社会和治理）主管。巴克莱是一家全球性银行，截至 2020 年拥有 83,000 名员工，资产超过 1.3 万亿英镑。埃尔莎于 2018 年加入巴克莱，拥有超过\
  \ 20 年为公司、基金会和非营利组织担任战略顾问的经验。\n\n在她的职位上，埃尔莎负责领导银行在广泛可持续发展与 ESG 议题上的战略方向和政策实践，涵盖气候变化、环境管理、人权和社会影响等领域。她主管\
  \ ESG 相关的外部合作与伙伴关系发展，与客户、投资者、民间社会团体及其他多元利益相关者保持互动。此外，埃尔莎还监督制定了推进绿色与可持续金融的标准和指标，并在可持续产品和服务开发的早期创新中发挥引导作用。\n\
  \n在加入巴克莱之前，埃尔莎曾担任克林顿全球倡议的承诺总监。她还为比尔及梅琳达·盖茨基金会创建并推出了一个旨在推进联合国可持续发展目标的平台。其早期职业生涯包括为大型国际能源公司提供地缘政治与行业风险分析，以及领导一家教育公司的战略与业务运营。\n\
  \n埃尔莎目前担任 First Book（一家专注于贫困儿童教育公平的非营利社会企业）和 Masawa（一个心理健康影响力基金）的顾问委员会成员。她曾出现在获奖影片《我们的星球：不容有失》中，该片探讨了金融业在推动可持续未来方面可以发挥的作用。\n\
  \n**克里萨·帕吉萨斯：** 你在社会影响、能源和地缘政治风险分析方面的背景，对于金融服务行业的高管来说颇为独特。请描述你加入巴克莱并担任此职位的职业历程。\n\
  \n**埃尔莎·帕兰扎：** 我的职业生涯路径完全非线性，对此我深怀感激。如今我已进入职业生涯后期，这种路径最终让我受益匪浅。我的事业始终由一种真诚的愿望驱动：去做那些既服务他人又忠于自我本真的事情。\n\
  \n当我以国际关系学位从大学毕业时，我搬到华盛顿特区，在朋友家的沙发上借宿，同时寻找工作。作为一个在新墨西哥州艺术家家庭长大的女孩，我没有任何语言来描述自己认为想做的事。但我知道我希望它涉及国际政策制定。最终，我在一家专注于能源政策和地缘政治咨询的精品咨询公司获得了一个职位。\n\
  \n我当初去华盛顿特区，是因为感觉那里是事情发生的心脏地带，至少在政策层面是如此。确实，了解跨部门流程如何运作——有时又如何不运作——以及理解政府和私营部门之间在紧闭的门后进行的复杂谈判和对话为何如此重要，是很有意义的。这些往往会在未来以你未曾预料的方式显现出来。\n\
  \n我们公司的客户包括一些世界上最大的能源和公用事业公司。了解这些公司背后的人，并理解他们在能源行业中所面临的困境，在当时不仅极其有趣，而且事隔多年至今，这已成为我理解影响能源和电力行业向低碳经济转型因素的重要基石。这是一个必须发生的整个系统变革。\n\
  \n**帕吉萨斯：** 从第一份职业经历中，有哪些关键经验至今仍影响着您？\n\n**帕兰扎：** 我认识到，跨部门和跨政治派别的合作伙伴关系能够且必须发挥作用。我当时的上司，也就是公司董事长，我直接向他汇报，他是一位杰出的思想家。我和他在政治上的观点大相径庭，但他愿意并且有兴趣确保在前进的每一个节点上都建立伙伴关系并创造合作机会。他曾任职于里根政府，但他却有来自联合国的、令人难以置信的极左派朋友。你绝不会想到这些人会是朋友和合作者，但事实确实如此。他们相互尊重，并依靠彼此来获取关于市场事件和政策想法的更佳情报。这种跨越感知边界的合作主题，后来多次在我的职业生涯中重现。这段经历是我职业生涯中一个重要的奠基篇章。\n\
  \n**帕吉萨斯：** 你职业生涯的下一个篇章是什么？\n\n**帕兰扎：** 我搬到了土耳其的伊斯坦布尔。坦率地说，这与我在那里的具体工作关系不大，更多的是关乎作为一个二十五岁的女性，在一个我不懂当地语言、文化和职业规范对我来说非常陌生的国家，努力做成一些事情。那是一段极具冒险精神且美妙的经历。在土耳其待了一年，建立了一个支持商科和法律学生的语言项目后，我搬回了美国，在塔夫茨大学的弗莱彻法律与外交学院学习国际关系。这是一个跨学科项目，我选修了从水与外交到国际安全研究等各种课程。\n\
  \n那个群体引领我进入了职业生涯的下一个重要篇章，那就是搬到纽约，为克林顿全球倡议工作。克林顿总统在多个层面都是一位杰出的领袖，所有人谈论他的魅力和他吸引人的能力，都是真的。他的天才非常明显地体现在他能够将看似毫不相干的信息碎片整合在一起。当他面对一个错综复杂的问题，并将其综合归结到问题的核心时，他为其他人厘清了需要做出的艰难决定，或需要解开或凝聚的棘手关系。\n\
  \n我渴望有一天能模仿到他的一些特质，但我认为，在实践中观察这一点——无论是从总统身上，还是从我们每天共事的那些了不起的成员身上——对我的职业生涯产生了难以置信的深远影响。在\
  \ CGI，我们这个组织存在的全部理由就是建立跨部门合作，以解决重大的全球挑战。任何可能属于 ESG 范畴的问题——从社会不平等、能源、气候变化到绿色基础设施及其背后的融资——都是\
  \ CGI 正在讨论的一部分。\n\n很多人知道 CGI 是因为它的盛大场面和明星云集，因为你确实能看到大人物出席活动。虽然这很令人兴奋，但归根结底，他们去那里要做的事情才是最重要的。\n\
  \n**帕吉萨斯：** 你在 CGI 担任什么职务？你的工作中有没有什么关键的收获？\n\n\n\n**帕兰扎：** 我领导了一支主题专家团队，协助克林顿全球倡议（CGI）成员制定我们所谓的“行动承诺”，即旨在解决特定全球挑战的、新的、具体的、可衡量的项目。我的团队由不同发展领域的专家组成，工作内容涵盖从宏观议题，例如推动有效的慈善影响力投资、促进全球健康领域的行为改变、提升全球教育的质量和普及度，到非常具体的干预措施，例如为难民增加就业机会、加强可持续棕榈油和可可的供应链、打击偷猎大象等等。我们与我们的成员组织——一个由公司、基金会、非政府组织、政府及多边机构，以及其他有影响力的领导者组成的广泛社群——合作，确定他们在哪些方面最能对特定的社会或环境问题产生积极影响，制定有时限的行动计划和实现该计划所需的资源，并阐明他们将用于衡量进展和成功的指标。我们的许多工作都涉及策划主题性对话，以汇聚不同的观点和方法。\n\
  \n我职业生涯这一阶段的主旋律，是认识到当你汇聚不同的行动者时，尤其是在应对一个棘手问题时，所能产生的思想和行动的力量。如果不同的人贡献他们最好的资源和最好的视角，你就能开始解开这个挑战，并发现新的、更好的解决方案。\n\
  \n**帕吉萨斯：** 当 CGI 在 2016 年关闭时，发生了什么？\n\n**帕兰扎：** 在我们最后一次大型 CGI 年会上，当我们最后一次聚在一起，纪念“行动承诺”的十二年历程时，那是一个令人心酸的时刻。当我们告别\
  \ CGI 社群时，我们希望我们的成员能够铭记我们共同学习到的关于伙伴关系的力量、跨部门合作的好处，以及清晰、透明地衡量与披露的必要性，并在他们自己的工作中继续运用和推广这些行动。\n\
  \n大约在这个时候，我接到了比尔及梅琳达·盖茨基金会的一个电话，他们说：“我们正在考虑建立一个平台，以推动联合国可持续发展目标的进展。要建立这样的平台，我们应该考虑些什么？”\
  \ 于是，我得到了一个绝佳的机会，将我们在 CGI 学到的一些经验，以一种新的方式应用到一个不同的社群中。\n\n我在 CGI 以及盖茨基金会的“守门员”项目中的经历，凸显了私营部门在推动进步方面的重要性。这是另一个关键主题，不仅限于慈善事业——尽管这显然很重要，尤其是在美国背景下——而且关键在于，利用公司的核心业务能力，使其朝着社会和环境目标的方向发展。这是我们在全球范围内实现大规模变革所需的规模和影响力的唯一途径。\n\
  \n想想我们为推动积极影响而必须撬动的所有杠杆。有时我们需要撬动许多小杠杆，有时所需的变革则需要调整几个大杠杆。金融就是一个大杠杆。坦率地说，每当我们策划一个大型伙伴关系或解决方案时，这个问题就一直在我脑海深处萦绕。问题不仅在于各自的合作伙伴是否有足够的资源去做他们希望做的事情，还在于金融扮演了什么角色。资本市场是在推动还是阻碍这项工作？\n\
  \n**帕吉萨斯：** 这些问题似乎很自然地将话题引向了你在巴克莱银行的角色，在那里你有机会探讨私营部门、资本市场和金融业可持续发展这三者的交汇点。\n\n**帕兰扎：**\
  \ 是的！当加入巴克莱银行这个独特的机会出现时，坦白说，并不是因为我一直梦想着为一家拥有 300 多年历史的银行工作。[笑] 从某种程度上说，这在我职业生涯中是一个看似不太可能或出人意料的下一步。从个人角度来看，我想，天哪，这是一个更好地理解并解决那些我们需要解锁和实现的事情的机会。\n\
  \n我拥有的技能组合与这家银行的许多人都不一样。起初，这让我感到有些畏惧，但我认为我所知道的东西或许能派上用场。坦率地说，在我作为局外人的视角，在我们为这家公司首先定义气候变化，然后广泛定义\
  \ ESG 的这段历程中，一直很有帮助。你必须拥有宏大的想象力，并且能够看清你周围的世界，才能理解你在一家机构中所扮演的角色，以及一家机构在全球环境和社会领域所能扮演的角色。我就是这样来到了这里，这是一段相当漫长的旅程。\n\
  \n**帕吉萨斯：** 在我们深入探讨如何为巴克莱银行定义气候变化和 ESG 之前，您能否先为我们介绍一下巴克莱银行的核心产品和服务？\n\n**帕兰扎：**\
  \ 巴克莱银行是一家全能银行，拥有多元化且相互关联的业务组合，拥有超过 330 年的历史。我们通过零售银行服务支持消费者和小型企业，并通过企业和投资银行服务支持大型企业和机构。我们还拥有银行卡及支付业务以及财富管理业务。\n\
  \n**帕吉萨斯：** 在这些产品和服务范围内，我很好奇您如何在巴克莱银行定义气候变化战略。是否有作为您战略基础的关键支柱？是否有与之相关的、有时间限制的量化目标？\n\
  \n**帕兰扎：** 首先，我认为重要的是要指出，我们的 ESG 政策和战略植根于我们的企业宗旨，即“负责任地部署金融资源以支持人民和企业”，以及“为共同利益和长远发展，倡导创新和可持续发展”。我们的气候战略基于这样一个前提：巴克莱银行的核心使命就是倡导长期可持续性，因此我们能够而且必须为应对气候变化、帮助加速向低碳经济转型做出切实贡献。2020\
  \ 年，我们明确了我们的方针，设定了到 2050 年成为净零银行的雄心——我们是首批这样做的主要银行之一——并且我们承诺使我们整个融资组合与《巴黎协定》的目标和时间表保持一致。\n\
  \n这些是宏大的、有时限的目标。然而，在此期间展示进展和对实现这些目标的真诚承诺至关重要。为了将这些宏大目标付诸实践，巴克莱银行创建了一种名为`BlueTrack`的方法，该方法针对具体的近期和中期行业目标，并参照《巴黎协定》设定的基准进行校准。我们从能源和电力组合开始，因为它们碳密集度最高，对巴克莱银行也最为重要。到\
  \ 2025 年，我们将把电力组合的排放强度降低 30%，并将能源组合的绝对排放量减少 15%。我们将在 2022 年宣布水泥和金属行业的目标，并将继续系统地推进我们整个融资组合，设定科学碳目标，以最终实现我们到\
  \ 2050 年实现净零排放的终极雄心。\n\n**帕吉萨斯：** 这个战略相当先进。您如何看待今天的情况与您最初加入巴克莱银行时的情况之间的对比？\n\n**帕兰扎：**\
  \ 当我三年前刚到这里时，ESG 还没有渗透到银行的各个层面。现在，我走进一个房间，几乎找不到不知道 ESG 是什么，或者至少对巴克莱在气候方面的历程略知一二的人。当然，有些人对我们在气候变化、森林砍伐、人权等议题上的立场细节会了解得更深入，但这种知识层面的差异是在意料之中的。\n\
  \n\n\n当我初到巴克莱银行时，专注于可持续发展与环境、社会和治理（ESG）的小团队主要进行 ESG 报告和声誉风险评估。他们启动了银行首份气候变化公开立场的初步构建工作。这对话主要是在可持续发展团队和自然资源银行团队之间展开，但尚未从更宏观的企业整体视角进行。团队获得了高管层的支持来推进这一立场，否则它不可能有持续的影响力。然而，在早期阶段，这很大程度上是各团队在自己的职能孤岛中工作，有时会从对立的角度出发。期间既有艰难的对话，也有富有成效的交流。\n\
  \n我认为任何一个可持续发展团队可能面临的最大障碍之一，是认为我们存在的意义就是阻碍商业发展的误解。如果做法得当且正确，作为一家公司，拥抱并提升自身 ESG 资质的完整性，应该能为商业成功开辟新的途径。有时可能需要将业务从某些领域重新导向其他领域。对于一家希望经受住时间考验的企业而言，这种战略转变是自然而然的，也是不可避免的。在这种情况下，这对于应对气候变化这一生存威胁，以及构想全球经济的未来及其中的诸多机遇也大有益处。\n\
  \n自那以后，我们取得了非凡的进展，形成了一种嵌入整个银行的对策，并且这种对策已经变得相当复杂精深。我们承诺将*所有*融资组合与《巴黎协定》对齐，并在此基础上设定了净零排放目标。在绿色金融领域，我们面临着巨大的机遇。我们需要确保在引导银行团队服务于这个极具前景且不断增长的市场时，将诚信融入我们对气候变化的应对之中。\n\
  \n**帕吉萨斯：** 从内部看，促使这种视角成为企业整体观点的转折点或驱动因素是什么？\n\n**帕兰扎：** 有几个驱动因素。首先，这种变革只有在公司领导层积极倡导时才能发生。我们的董事会和执行委员会就提供了这样的领导力。这并不意味着所有人都要手拉手地一直保持一致意见。进行激烈的辩论并有机会对决策进行检验，以确保做出的决定在机构内行之有效，这其实是件好事。\n\
  \n其次，我们周围的世界发生了翻天覆地的变化。这涉及到更大的图景——私营部门在社会中的角色。在相对较短的时间内，我们看到社会对商业的期望出现了大规模的集体声明，转向要求企业为更广泛的利益相关者——社区、员工、公民社会，乃至自然本身——的福祉负责，而不仅仅是增加股东价值。\n\
  \n由于我们彼此之间的联系比以往任何时候都更加紧密，这意味着大多数人掌握了更好的信息，能够对现有的权力结构——无论是政府还是企业——提出更明确的要求。而且，由于我们幸运地获得了更多信息的渠道，这意味着企业必须确保其\
  \ ESG 和可持续发展资质是可获取的、透明的，并且有事实和数据作为支撑。令人高兴的是，我认为我们作为消费者和社区成员，对“漂绿”行为已经变得更加精明，这意味着企业的可持续发展不能仅仅停留在模糊的营销计划上。\n\
  \n我认为第三个主要驱动因素是，我们正经历着人类历史上最大规模的财富转移之一，即从老一代转移到年轻一代。从根本上说，这些年轻一代的核心价值观和对商业的期望，与我们前几代人截然不同。部分原因是，我们现在了解了企业过去在世界上开展的一些活动所带来的后果——以及负面后果。如果你砍伐一片巨大的原始雨林来放牧牛群，你或许能以盈利的价格出售汉堡，但这会产生后果，而我们越了解这些后果，就越能追究人们的责任。这些新的投资者肯定会非常审慎地决定他们资金去向。\n\
  \n**帕吉萨斯：** 你提到在 CGI 和盖茨基金会的工作经历提高了你对金融市场在解决环境和社会问题中重要性的认识。你认为市场在解决这些问题方面扮演着什么角色？\n\
  \n**帕兰扎：** 嗯，正如我之前在对话中提到的，我认为金融是推动变革的一大杠杆。我不认为金融能单独解决这些挑战，因为实现持久的、系统性的变革需要正确的行动者生态系统。但它是拼图中极其重要的一部分。\n\
  \n金钱本身是中性的。也就是说，它只是我们赋予其价值的工具，因此力量在于我们如何运用它。作为一家银行，如果我们促进资本流向创新的气候解决方案、公平的住房模式和绿色基础设施发展，那么这些事物就能蓬勃发展。然而，如果我们继续依赖旧的金融模式——那些会告诉你目标是利润最大化，即使以牺牲社区、生计和自然世界为代价的模式——我们将永远无法实现我们期望看到的改变。我们将永远无法以一种允许*可持续*增长的方式重新构想我们的经济。我认为市场可以成为令人难以置信的变革驱动力，但必须以一种有原则的视角来驾驭和引导它们。\n\
  \n我们需要政策制定者和监管者创造有利的环境，让资本流向解决方案。我们需要实体经济——我们的客户——调整自身的商业模式，以向低碳或零碳未来转型。\n\n**帕吉萨斯：**\
  \ 对巴克莱银行而言，拥抱向低碳经济的转型是其 ESG 战略的关键。这意味着什么？为什么这对应对气候变化很重要？\n\n**帕兰扎：** 从外部看，很容易将动态描述为“好人”和“坏人”之分。我这样说并非轻率。显然，气候科学帮助了我们理解，我们所依赖的许多全球工业和商业模式并未服务于我们，因为它们加剧了气候变化。我们都知道需要从化石燃料转向可持续能源。我们知道大规模的单一种植农业或畜牧业导致了生态破坏。我们知道我们的交通系统已经过时、效率低下，并且极度依赖不可持续的能源。\n\
  \n\n\n当我们思考如何在全球范围内实现必要的变革时，这不可能来自经济的全面开关切换。我们必须对当今的商业模式进行转型，为未来重新构想。在许多情况下，我们需要那些已存在数十年的公司的规模、影响力和经验，但我们需要它们将所有能力转型为以不同方式、可持续地运营业务。而作为一家银行，我们可以凭借专业知识和最佳实践来支持这些客户——尤其是在融资方面——帮助它们实现自身业务的转型，从而采用可持续的能源、农业或交通模式并扩大规模，而非沿用以往的方式。并非所有人都能完成转型，但许多行业可以，我们需要支持这一转变。\n\
  \n与此同时，一大批令人惊叹的新兴技术、行业和公司正在快速成长，以全新的解决方案应对社会和环境挑战。希望世界已经从可再生能源在市场中具备竞争力所花费的漫长时间中吸取了教训。我希望在绿色氢能、可持续交通或其他需要快速达到规模的技术领域，这种情况不会重演。我们需要在发展未来业务的同时，推动当前经济迈向新的可持续范式。\n\
  \n**帕吉萨斯：** 转型面临的主要挑战是什么？\n\n**帕兰扎：** 这意味着要改变整个系统——从当前被开采和用于发电的能源来源，到输送电力的输电网，再到依赖电力进行制造或生产的企业，以及需求侧的个体消费者。目前在英国，人们正排着异常长的队伍等待加油。你会意识到每个人有多依赖这个系统以他们习惯的方式运转。\n\
  \n当你试图转型像全球银行投资组合这样庞大而复杂的系统时，就像驾驶一艘航空母舰。你能做出的每一度改变，长期来看都是重大的转向，但有时在短期内很难感受到任何变化。同时，证明进展既重要又困难。必须让人们看到变化，利益相关者和其他人才会相信确有实质性的改变正在发生。\n\
  \n**帕吉萨斯：** 巴克莱银行在传统化石燃料领域拥有相对庞大的融资组合。鉴于向更可持续燃料来源转型的迫切需求，您如何评估这一组合？\n\n**帕兰扎：**\
  \ 这是个好问题。是的，我们在这一转型中肩负责任、拥有机遇并扮演角色，因为我们遗留的融资组合中包括大量的能源和电力业务。当巴克莱收购雷曼兄弟的业务时，其化石燃料行业的比重很高。我们现在有了一个战略机遇来采取行动。\n\
  \n坦率地说，一个简单的答案——或者在某种程度上容易的答案——就是尽快将这些公司从我们的融资组合中剔除。这样我们看起来就干净了。所以有人可能会问：\"为什么不立即停止对这些公司的融资？\"\
  \ 需要考虑的最重要因素是，什么才能真正带来我们所需的改变，以遏制气候危机。\n\n答案有两点。首先，回到转型的概念，我们希望成为转型的引导者，尽可能支持我们的客户将其业务转向低碳和可持续模式——原因我之前都已提及。当然，我们认识到，有些公司、实体甚至整个子行业因其商业模式的性质而无法转型，我们可能不得不对它们做出一些不同的、艰难的决定。然而，我们的气候战略基于这样一个理念：成为实体经济中变革的积极推动者。\n\
  \n其次，如果我们一夜之间停止对这些能源公司的融资，全球有足够多的资本可以让他们轻易地找到新的融资。但那个新的融资方会坚持更严格的标准，并找到更多更好的方式让这些公司承担责任吗？也许能，也许不能。因此，巴克莱做出了战略决策，积极参与并尽可能引导我们整个投资组合的转型。我们通过设定的目标，为能源和电力组合设定了碳排放限制。利用我之前提到的`BlueTrack`方法，我们积极决定哪些客户和交易我们可以支持以达到这些目标。\n\
  \n最后但同样重要的是，我们制定了具体的限制，明确规定作为原则，我们不会提供哪些类型的融资，以支持和加速我们的整体方针。例如，我们制定了规则，不为北极地区的勘探和生产、新的动力煤项目等提供融资。\n\
  \n**帕吉萨斯：** 您如何帮助您的客户应对转型？\n\n**帕兰扎：** 我们认为，像我们这样规模的银行最好、最有效的用途就是与客户紧密合作。作为一家全能银行，我们拥有广泛的客户基础，从大型跨国集团到高增长企业，再到当地中小企业和零售客户。\n\
  \n我们的业务活动涵盖贷款和商业银行业务、投资银行以及资本市场活动，这些活动动辄数十亿甚至更多。我们的抵押贷款组合也将是一个重要的关注领域，因为住宅房地产是实现脱碳的关键行业，尤其是英国政府已将其列为净零战略的重点领域。我们将设定碳减排目标，正如我们为其他高碳行业所做的那样，这是我们承诺使整个投资组合符合《巴黎协定》的一部分。\n\
  \n这些行业和客户类型各有其自身需要应对的挑战。我知道化石燃料公司经常上新闻头条，毫无疑问，处理能源和电力行业是应对气候危机的关键。但一些难以脱碳的行业——即那些没有便捷技术解决方案进行转型的行业，如水泥、钢铁或化工企业——正面临着巨大问题。\n\
  \n与此同时，许多中小企业正苦于缺乏资源来衡量和披露其 ESG 资质。同时，所有企业都看到报告框架和期望在不同市场和国家之间存在碎片化，这使得它们难以以一种评级机构和投资者可以分析和比较的方式分享其行动。\n\
  \n**帕吉萨斯：** 如果您的客户无法完成转型——这可能对某些人来说不够绿色或不够快速——那么对我们正在讨论的气候变化问题意味着什么？如果您放弃那些无法或不愿转型的客户，会发生什么？\n\
  \n\n\n**帕兰扎：** 如果实体经济——包括我们及其他所有人的客户——无法或不愿快速转型，我们将无法足够快地实现经济脱碳。我们将无法将升温幅度控制在气候科学家告诫我们必须遵守的阈值以下，否则将面临毁灭性的地球变化。我们早已超出了地球的碳预算，因此，我们所有人必须齐心协力，尽一切可能停止额外的碳排放，并切实致力于从地球大气中去除碳。因此，在整个亟需快速转变的体系中，银行扮演着关键角色。“转型”这个概念可能听起来温和而缓慢，但我们讨论的实际上是对经济体系的彻底重塑，而且必须以气候科学所要求的速度进行。\n\
  \n在当前这个时间点上，如果我们放弃那些无法或不愿转型的客户——正如我们之前讨论过的——我认为他们很可能会转向其他银行或金融机构。但整个金融行业正在迅速变化。毫无疑问，私募股权和债务依然存在；在部分银行退出的领域，其他私人融资正在介入。由于来自我们利益相关方的集体压力，我相信整个金融部门都将不得不行动起来。\n\
  \n最终，我认为整个金融部门都需要设定有数据和透明披露支持的碳减排目标，并以此接受问责。当你考虑到更多私人资本提供者时，这就会变得非常重要。正如我提到的，短期内，我认为银行的客户可能会另寻他处，找到他们所需的资金，去做那些让气候变化恶化的事情，比如建设新的燃煤火电厂。然而，即使纯粹从经济角度来看，这最终也将归结于这些资产是否有潜力成为搁浅资产，并在未来成为财务负债。\n\
  \n**帕吉萨斯：** “搁浅资产”，是指一项金融投资，通常因过早减记或贬值而变成了负债。容易受气候变化影响的资产，例如位于飓风频发、易发洪水的海岸线上的发电厂，就可能变成搁浅资产。您说的“未来”具体指什么？\n\
  \n**帕兰扎：** 是的。过去，气候变化往往被视为纯粹的名誉问题。我们知道它对地球上的生命构成威胁，是一个巨大的全球性社会挑战。但政策制定者和研究人员——包括担任英国央行行长时的马克·卡尼——正确地指出了气候变化是一种金融风险。因此，有些行业和产业，如果被认为与转型步伐不一致，可能会突然发现其基本面崩塌。或者，在你给的那个例子中，环境变化本身可能带来物理风险，成为某些资产的威胁。\n\
  \n“未来”过去常指三十年以后。现在，“未来”可能近在咫尺。时间因素对我们所有人来说都发生了巨大变化。这在很大程度上促使人们警醒，意识到这种风险评估绝不能拖到下一届政府、下一任\
  \ CEO 或任何其他人来接手处理。它必须现在就进行计算并采取行动。\n\n**帕吉萨斯：** 立即推动解决方案是 2021 年 11 月在格拉斯哥举行的联合国气候变化框架公约（`UNFCCC`）缔约方会议（`COP`）的一个重点。作为一个星球和一个社会，我们已没有奢侈的时间来应对气候变化。在`COP26`上，您和其他私营部门合作伙伴推动达成了哪些关于气候变化的关键对话或决策？\n\
  \n**帕兰扎：** 正如你所说，`COP`本质上是政府间的会议。虽然私营部门过去也对`COP`上正在谈判的政策感兴趣，但我认为商界从未像今年这样大举参与——金融部门尤其如此。\n\
  \n我们很高兴成为格拉斯哥净零金融联盟（`GFANZ`）旗下净零银行业联盟（`NZBA`）的创始成员。这是一个重要且影响深远的金融业联盟，所有成员都设定了净零目标，并承诺不仅作为联盟在`COP`上合作，更要持续推进下去。我们是威尔士亲王殿下发起的“可持续市场倡议”中金融服务工作组净零工作组的联合牵头方，该工作组编制了一份从业者指南，旨在向希望设定自身净零目标的银行分享实践经验。我们还参与了专注于碳市场的工作组，并承诺支持“促进自然向好”等倡议。\n\
  \n我可以给你一份我们签约加入的所有合作伙伴关系和联盟的完整清单，但我认为关键在于，我们已经没有回头路可走。金融部门——以及更广泛的私营部门——正迈出大步前进，整个世界都在见证其进展。\n\
  \n**帕吉萨斯：** 格拉斯哥会议之后会发生什么？\n\n**帕兰扎：** 我们已经做出了重大承诺。因此，我们致力于将这些承诺贯彻到底！像`COP`这样的活动是有效的时间节点和推动高潮的时刻，全球社会可以借此推动关键政策问题上的共识。然而，你问格拉斯哥会议之后的事情是对的，因为承认仍有大量工作要做至关重要。我们需要让更多行业与`BlueTrack`蓝图对齐，设定目标，并研究如何以最佳方式收集正确数据和采用正确方法，来计算我们所有融资排放的细节。\n\
  \n我们已承诺调整我们的*整个*投资组合，相关的工作将认真持续推进。但同时，我们也渴望继续与同业合作，提升银行业支持客户的能力，并共同努力推动整个行业在气候问题上取得进展，尤其是在衡量和评估我们融资排放的能力方面。\n\
  \n**帕吉萨斯：** 为什么与同行合作是巴克莱银行在气候变化议程战略中的重要组成部分？\n\n**帕兰扎：** 我很庆幸巴克莱拥有如此规模，因为我们有资源和内部共识来进行这些变革。我担任联合国环境规划署金融倡议（`UNEP\
  \ FI`）负责任银行原则（`PRB`）委员会的成员。这让我有很好的机会向我的同行学习，他们有的来自其他全球性银行，有的来自例如拉丁美洲、斯堪的纳维亚和北非地区的规模较小的区域性银行——这些银行面对的是一系列不同的问题、不同的挑战，但也具备不同的优势，包括不同的利益相关方期望。\n\
  \n这就是这些金融业联合体之所以重要的原因，因为我们可以把大家在不同背景下实时积累的经验教训拿出来共同学习。我们会辩论诸如“你如何设定一个有诚信的净零战略？必须考虑哪些因素？当我们谁都没有完美工具的时候，如何开始衡量经济每个领域的融资排放？”\
  \ 这类问题。当落实到制定银行自身战略、这战略对客户意味着什么、以及我们最终能否切实影响气候危机的机会这些关键细节时，这些问题才是真正重要的。\n\n**帕吉萨斯：**\
  \ 随着对 `ESG` 和可持续发展以及通过联盟参与的兴趣日益增长，您对进入 `ESG` 和可持续发展领域的公司有何建议？公司应如何平衡与同一联盟内行业同行的合作与竞争？\n\
  \n\n\n**Palanza:** 如果一家公司想要思考如何迈出制定可持续发展战略的第一步，我会说，先从审视你的核心业务开始。哪些问题对你作为一家公司而言最为重要？哪些问题是由你的业务所驱动，并且对周围世界影响最大？一个可信的`ESG`战略应该与你的核心业务战略紧密相连，而不应是一个附带或独立的方法。\n\
  \n对于任何试图快速掌握`ESG`知识的公司来说，从同行那里获取行业层面的洞见是至关重要的一环。如果你能环顾左右，了解你的同行——乃至竞争对手——在做什么，你就能明白自己需要走向何方，才能制定出差异化的战略。\n\
  \n公开披露的信息已变得更好、更强。虽然仍有很长的路要走，但带着敏锐的眼光去阅读其他`ESG`报告所表述的内容，并判断其真正含义，是很有帮助的。它们是否设定了非常具体的`KPIs`（关键绩效指标）和目标？它们是否用实际证据来支撑这些目标，并描述了结果与影响？它们是否以可辨识的方式展示了进展，而不是用花哨的营销语言来掩盖？如果我们的竞争越来越多地基于谁的`ESG`资质最强，那将是一件很棒的事情。\n\
  \n探索是否有行业层面的联盟可以加入，以便与同行合作，提升你的知识和能力。当然，这其中总会涉及竞争的一面，但从这些行业联盟中学习和分享最佳实践的机会，是极其有帮助的。气候行动的影响对象是谁，并没有明确的边界，因为气候是一个行星系统。这意味着，要让我们有任何希望达到我们需要去的地方，确实需要我们所有人以联盟的形式，或者至少在各自的领域内共同努力。以巴克莱银行为例，与我们的一批银行同行聚在一起，特别是那些像我们一样拥有大规模资本市场活动的同行，讨论我们的资本市场活动在融资排放中的作用，是很有帮助的。同时，与正在处理截然不同问题的其他各类银行和金融机构交谈也很有益，因为我们在应对气候变化和转型过程中扮演着集体角色。\n\
  \n最后，你绝不能忘记跨领域学习与合作的极其重要的作用。我们从与非政府组织专家、学术机构和学者以及政府领导人的对话中，获得了大量的知识。\n\n**Pagitsas:**\
  \ 未来五年，银行业最大的变化会是什么？在社会更广泛的层面上，你期望看到什么？\n\n**Palanza:** 我们正看到金融科技创新的巨大浪潮，甚至普通科技公司也开始涉足银行业务。这是一个有趣的发展，因为银行作为机构，与其所服务的社区之间有着根深蒂固的社会契约。金融科技公司未必与特定的地方和社区有同样的联系，但它们提供了大量的便利性和交易易用性。所以，我认为真正的问题在于，谁能成功获得利益相关者的认可与信任。这对银行业来说是一个大问题。\n\
  \n与此同时，银行和更广泛的私营部门正竞相制定更多、更好的计划来满足社会的期望，呈现出一场“向上竞赛”。我们已经看到，新冠疫情揭露并暴露了那些一直存在、但或许我们此前在更广泛的社区层面不必面对的可悲的社会挑战。\n\
  \n私营部门在促进公平和社会正义方面扮演着什么角色？社会对于那些将此问题的答案仅仅浓缩为一天的庆祝活动，或者购买某个社会议题相关游行的冠名权的公司，其耐心正理所当然地越来越少。企业需要将这些原则融入其对待员工的方式中，在其运营的社区为其员工挺身而出，并且——以银行为例——在其融资选择中忠于这些原则。\n\
  \n我们谈了很多关于`ESG`中“`E`”（环境）的方面，因为气候问题主导了银行内部的大部分讨论。但我们的思维不能陷入孤岛。我们生活在一个复杂、相互关联的世界中，我们面临的挑战是多重交织且混乱的。思考气候问题，就不能不考虑我们所建立的人类系统、最贫困、最被剥夺权利或受气候变化影响最大的社区，以及依赖不断变化的经济的民生——这就是`ESG`中的“`S`”（社会）。思考气候问题，就不能不考虑处于我们行星系统核心的自然与生物多样性——这个我们所有人都实实在在赖以生存的自然世界。\n\
  \n但愿，如果我们能够进化到考虑我们的整体影响——无论是正面的还是负面的——并且如果我们能够互相学习彼此的专业知识和视角，跨领域、跨学科地合作，那么我们或许就更有可能解决当今我们面临的最大可持续发展挑战，并为明天的挑战做好更充分的准备。\n\
  \n\n\n### 19. 钟颖兰（Yulanda Chung）\n\n星展银行机构银行集团可持续发展主管、董事总经理\n\n`钟颖兰`是星展银行机构银行集团的可持续发展主管。星展银行是一家新加坡跨国银行与金融服务公司，业务遍布\
  \ 17 个市场，截至 2020 年底资产规模达 6500 亿新加坡元。她负责领导该行的负责任融资议程，并就与交易相关的环境和社会问题提供咨询。\n\n`钟颖兰`此前曾在伦敦的`渣打银行`担任可持续金融主管，并在那里建立了该行的可持续贷款议程。在进入银行业之前，她在瑞士苏黎世的`RobecoSAM`公司担任矿业和建筑材料行业的股票分析师。\n\
  \n`钟颖兰`是智库`TransitionZero`的受托人，该智库为电力和重工业提供金融分析以支持脱碳，并且是阿尔·戈尔支持的联盟`Climate TRACE`的创始合伙人之一。她曾是亚洲可持续发展与责任投资协会（`ASrIA`）的前董事会成员，在她任职期间，该组织并入了联合国负责任投资原则。\n\
  \n**克莉萨·帕吉萨斯:** 您如今领导星展银行这一大型金融机构的可持续金融业务。然而，您的职业生涯始于新闻业。您是如何走上现在这个岗位的？\n\n**钟颖兰:**\
  \ 我的职业生涯始于记者，这是我儿时的梦想。当我开始在香港的`《南华早报》`担任实习记者时，梦想成真了。这是该地区广为人知的一份报纸。作为实习生，我在各个部门轮岗，报道内容涵盖本地新闻、商业新闻、中国新闻、专题报道以及摄影。实习结束后，我选择了环境和消费者事务作为我的报道领域。这为我日后从事可持续发展工作奠定了基础。我调查并采访了关于消费者事务、环境以及两者之间利益时常趋同、挑战又相互冲突的问题。\n\
  \n2000 年，我转而成为一家名为`《亚洲周刊》`的杂志的通讯记者。那时，`可持续发展`和`金融`这两个词在任何形式上都不会被放在一起。这闻所未闻。我有幸采访了一位被视为可持续投资先驱的女性——泰莎·坦南特。她后来成为我非常重要的导师，并且她共同创立了`CDP`以推广可持续投资。\n\
  \n因为那是二十年前，没人听说过可持续投资。将“可持续发展”翻译成中文非常困难，因为作为一个术语，用中文说出来是一个很冗长的词组。在采访她的时候，我被一个想法深深震撼了，那就是可以通过在金融领域工作来促进可持续发展，以及为什么金融在推动可持续发展中扮演如此重要的角色。\n\
  \n我辞去新闻工作，很大程度上是为了她，以及她作为先驱所开辟的道路。在她创办的`ASrIA`为她工作之后，她鼓励我在可持续金融领域发展事业。她把我介绍给了`RobecoSAM`——一家可持续资产管理公司，当时也是另一家先驱公司。它率先开发了`道琼斯可持续发展指数`（`DJSI`）。我在那里担任股票分析师，并学会了如何构建估值模型。这为将可持续性分析融入财务分析奠定了基础。\n\
  \n那是 21 世纪初，`DJSI`仍处于早期发展阶段。然而，我已经能看到，各公司都在争相被纳入该指数。一些有远见、知道这将会变得重要的公司，已经在积极布局，确保该指数成为许多关注可持续发展的投资基金的基础。他们预期这些基金的管理资产规模（`AUM`）会不断增长、增长、再增长。我能看到，金融业有潜力在企业界推动更好的可持续行为。\n\
  \n我负责监管采矿与金属以及建筑建材行业。我关注的最喜欢的公司之一是一家名为`吉博力`的瑞士水处理公司。他们发明了马桶的双冲模式，可以选择小冲或大冲。这在当时很新颖。\n\
  \n由于我的第一个学位是政治学，我想加深在环境领域的专业培训。我重返校园，获得了环境变化与管理硕士学位。有了这些学术训练，我去了香港的一家环境咨询公司`ERM`工作。在那里，我做了很多技术性工作，学到了很多。我也做了许多基础但必要的工作，比如采集土壤样本、清点树木和海豚数量。\n\
  \n过了一段时间，我想回到以前做的事情，也就是把金融和可持续发展结合起来。幸运的是，`渣打银行`给了我一个机会，他们聘请我担任第一位可持续贷款经理。那是在 2007\
  \ 年，可持续金融的早期阶段。当时，很多精力都花在说服银行相信需要这样一个职位上。然而，`渣打银行`是`赤道原则`的早期签署方之一。\n\n承认`赤道原则`开启了项目融资交易中环境和社会（`E&S`）尽职调查的关注点，这一点很重要。这一议程之所以蓬勃发展，是因为它被狭义地定义为调查一个边界相对明确的实体资产的影响。一旦你攻克了这个难题并打下了基础，你就可以拓展到其他领域。如今，环境和社会风险管理体系已变得更加复杂，涵盖了气候风险、物理风险、转型风险、社会风险以及治理角色与责任。`E&S`风险管理也不再局限于项目相关的融资。\n\
  \n在`渣打银行`任职末期，我从伦敦 relocated 到了新加坡。在新加坡，我为一家名为`IEEFA`（能源经济与金融分析研究所）的智库工作。为他们做研究的那段时光非常愉快。了解印度尼西亚的电力部门是我的专长领域。之后我离开了那里，来到了现在所在的`星展银行`。我认为我的职业经历有点不拘一格——新闻业、非政府组织、资产管理、咨询，最后是商业银行。然而，贯穿我职业生涯的主线是环境，以及利用金融来促进可持续的商业实践。\n\
  \n**帕吉萨斯:** 另一条共同主线似乎是创建新的结构，并推出与可持续金融相关的新业务。\n\n\n\n**钟先生：** 是的，这是一个非常敏锐的观察。当我被星展银行聘用时，这几乎是一张空白的画布。星展银行领导层聘用我，是因为他们意识到时代已经改变，而且迹象表明，必须对如何通过融资视角看待可持续性进行结构性变革。监管和投资者的压力也在增加。我非常幸运有机会构建可持续金融议程，并组建具备必要技能的团队。在我待过的许多组织中，我通常是被聘为唯一负责该议程的人，然后随着该议程在公司商业模式中根深蒂固，我会将更多人带入团队。因此，培训人们了解可持续金融已成为我职业生涯中很重要的一部分。\n\
  \n**帕吉萨斯：** 鉴于您在可持续金融领域工作了二十多年，在此期间您看到市场上最大的变化是什么？\n\n**钟先生：** 回到 21 世纪初，我看到被纳入`DJSI`对许多公司来说是多么重要，而这种纳入如何驱动了战略，进而带来了改变。与此同时，过程很艰难，因为我们在改变常规做法时面临许多犹豫。当我在香港的`ASrIA`工作时，我们与许多本地资产管理公司交谈。尽管他们中的许多表现出兴趣，但也仅此而已。没有任何实质性的事情发生。快进到\
  \ 2020 年、2021 年，唯一获得大量资金流入的投资基金是`ESG`[环境、社会和治理]基金。我觉得经过二十年，也许`ESG`投资的时代终于到来了。\n\n\
  如今，我对人们投入到`ESG`议程的兴趣和行动之多感到惊讶。在二十年的时间里，我认为金融在可持续发展议题上的重要性增加了。我继续走在可持续金融这条职业道路上，当时并没有想到它会变得如此重要。更多是因为总有新的事情要做，所以我就一直走下去了。\n\
  \n正如我自己的职业轨迹一样，这项事业本身也在发展。它始于欧洲，我在苏黎世和伦敦获得了最初的职业经验。现在它已经来到亚洲，而亚洲很快就赶上了。\n\n**帕吉萨斯：**\
  \ 确实，您的职业经历让您从亚洲到欧洲，然后又回到亚洲。与欧洲和北美市场相比，亚洲市场的金融机构或公司对可持续性和`ESG`的定义是否不同？\n\n**钟先生：**\
  \ 当我初次与客户和银行家讨论可持续发展或可持续金融时，无论客户地处何方，讨论往往会经历相似的阶段。首先，他们会觉得这相当新颖且非常有趣。他们会问很多问题，紧接着就会说“哦，这永远行不通，因为有数据挑战。而且，在数据不完美的情况下，你真的不应该做所有这些糟糕的分析”。然后进入下一个阶段，人们意识到，“不，我想我才是那个异类”。这种改变的发生是因为他们意识到可持续性不再是锦上添花。它只是让你的业务为未来做好准备策略的一部分。无论我是与欧洲的客户还是亚洲的客户交谈，他们都会经历这些理解阶段。\n\
  \n然而，区别在于接纳的速度不同。我在一家欧洲银行花了七八年时间建立的可持续金融业务，在星展银行我用了三年就完成了。如今，我建议客户关注那些能引起他们共鸣的双重重要性议题。这对于不同市场的客户来说是共通的。双重重要性是财务信息重要性会计概念的延伸。被视为重要的信息应当被披露。“双重”之所以出现，是因为不仅\
  \ ESG 相关影响可能对公司的财务比率具有重要性，而且公司运营及核心产品或服务的影响也可能对环境和社会具有重要性。\n\n**帕吉萨斯：** 我同时听到了几件事。首先，无论地理位置如何，教育阶段都是相同的。第二，今天我们经历这些教育阶段的速度比十年前、二十年前快得多。第三，不同地区的客户面临的问题本质可能不同，但双重重要性的原则同样适用。\n\
  \n**钟先生：** 正是如此。\n\n**帕吉萨斯：** 当今金融机构拥有的一项重要工具是转型金融。2020 年 7 月，星展银行推出了一个可持续与转型金融框架和分类标准。什么是转型金融，以及该框架和分类标准的范围是什么？\n\
  \n**钟先生：** 在星展银行，我们将转型金融定义为支持客户脱碳活动的融资，这些活动符合减缓气候变化的时限性，并考虑了该活动在整个生命周期内对环境的总体影响、社会影响和经济影响。每个国家或地区的转型性质都受到整个系统演化的影响，包括当地的战略和政策。\n\
  \n发展中国家的许多公司只是在做出增量式的改变，因为替代方案尚不具备商业可行性。他们无法直接跳到氢能和大规模电池储能，而这些技术才能实现向低碳经济的全面转型。试图否认他们可以获得不断增长的可持续资金池是没有意义的。你想要调动那个可持续资本池，来促成增量但关键的改变。\n\
  \n转型金融需要被更好地理解。它关乎透明度。这是我们在谈论转型金融时的动力。因为它围绕这个话题存在争议。问题出现了。转型金融是一种逃避吗？它比绿色金融低级吗？你为什么把它做成一个转型交易，而不是为深绿色措施提供融资？事情并非如此非黑即白。它是一个光谱。透明度体现在我们的客户说：“我可能拥有一家燃气公司。我是一家炼油厂，我正在寻求减少我的甲烷排放。然而，我仍在运输天然气。”尽管如此，我们需要明确，如果审视生命周期的影响，新化石燃料项目的勘探和开发并不是在转型。\n\
  \n关于转型金融，下一个自然而然的问题是：“目标是什么？”当人们谈论转型时，他们必须考虑最终目标是否是实现净零排放。如果可行，截止到什么时候？是 2050 年吗？或者在中国，可能是\
  \ 2060 年。如果在欧洲是 2050 年，我们能现实地要求新兴市场也遵循同样的截止日期吗？\n\n**帕吉萨斯：** 我们可能需要厘清两个时间线。您指出，全球范围内人们正以更快的速度经历可持续性和可持续金融的教育阶段。然而，像亚洲这样的新兴市场可能无法按照与欧洲市场相同的时间表来执行和实现可持续目标与活动。\n\
  \n为什么新兴市场不能比 2050 年或 2060 年更快地推进？\n\n\n\n**钟先生：** 我认为确实如此。回答你的问题，转型的速度在不同地区有所差异，部分原因在于，当我们讨论促进可持续发展时，这不仅仅关乎金融。也不仅仅涉及私营部门。它还关乎监管体制。如果没有一个能够推动这些变革的监管框架，转型就会困难得多。作为一家跨国公司，你在北美所做的与你在印度尼西亚所做的，将受到不同的监管要求和执行力度的影响。这也在其中发挥作用。\n\
  \n**帕吉萨斯：** 你能举一个你为新兴市场的跨国公司客户所做的转型金融交易的例子吗？\n\n**钟先生：** 我有几个例子。我们做过的一笔转型金融交易是一个可持续发展挂钩贷款结构。这种结构允许公司借款并用于一般营运资金。然而，它不像绿色贷款那样，要求贷款的全部资金都必须用于指定的合格绿色项目。这是绿色贷款和可持续发展挂钩贷款之间的一个区别。\n\
  \n在星展银行，我们还与一家名为胜科海事的海事基础设施公司合作。他们为全球海上、海洋和能源行业提供工程解决方案并建设基础设施。他们很早就意识到，随着气候变化引发的能源转型，石油和天然气行业正在经历结构性变革，并且有必要多元化发展新的可持续商业解决方案。胜科海事的集团财务总监吴铭刚非常重视主动评估其战略以开发新的收入来源。两个例子是：为海上风电场设计和建造海上变电站上部模块，以及零排放电池驱动客货渡轮，这些渡轮使用绿色水力发电为电池充电。目前，大多数渡轮使用船用轻柴油作为燃料，这种燃料的碳强度更高。他们还在开发液化天然气-电池混合动力拖船，以促进可持续的港口和堆场运营，并率先为下一代海上风力涡轮机使用浮式基础解决方案。\n\
  \n与此同时，该公司也越来越多地采用更环保的方法来执行订单。这些措施包括在其厂区内安装太阳能电池板，利用可再生能源为其设备供电，并将其叉车车队从柴油动力机器更新为电动叉车，以减少其运营的总体碳足迹。\n\
  \n你可以看到，与我讨论可持续事务的同行并不仅限于环境、健康和安全专业人士，还包括像吴铭刚这样将可持续发展视为绩效战略驱动力的财务领导者。\n\n在所有这些活动中，胜科海事仍在为化石燃料行业提供服务。有人可能会问：“这够绿色吗？”我认为这很好地说明了转型金融。我们非常清楚自己在做什么，以及这些改进是什么。总而言之，该公司表明，通过所有这些活动，它拥有一整套变革方案。其中一些在本质上是零碳的，另一些则尚未达到，但关键在于该公司对应对清洁能源转型所需采取的步骤有清晰的认识。\n\
  \n对于他们，我们能够为公司设定绩效目标。如果从其这些指定的可持续业务收入流中获得的总收入比例达到预先设定的目标，那么他们将能够在我们向其提供的贷款中获得利息折扣。这就是我们尝试鼓励和激励客户采取更勇敢举措的方式。它激励客户思考：“好吧，我的融资成本与致力于负责任的商业解决方案挂钩，通过做得更多，我们可以为利益相关者实现双赢的结果。”\n\
  \n**帕吉萨斯：** 谈到星展银行，星展银行可持续发展战略的范围和支柱是什么？\n\n**钟先生：** 第一个支柱是负责任金融，这是我们的核心支柱。在这个支柱中，我们将环境、社会和治理考量融入我们的融资决策中。我们将资本分配给可持续经济活动，同时保持警惕，以管理与这类发展产生的环境和社会影响。这也是银行处理金融包容性的地方，因为在东南亚这个我们的核心区域，存在许多弱势群体，例如外籍劳工。\n\
  \n例如，在新加坡，一些外籍工人可能无法开设银行账户或寄钱回家，因为为他们提供服务的交易成本可能高于银行可能从中赚取的收入。星展银行非常自觉地努力服务这个市场，以确保外籍劳动力能够获得金融服务，并将他们辛苦赚来的钱汇回家。\n\
  \n第二个支柱是我们自身的运营以及我们如何负责任地管理我们的运营。我们制定了循环经济采购原则，并用它们来管理我们的供应商。我们的物业管理团队管理我们所有的分行和物业，最近甚至将一栋现有建筑改造为净零能耗建筑。\n\
  \n第三个支柱是我们的社会目标，即创造积极的社会影响，我们通过星展银行基金会来支持这一点。该基金会提供资助，在我们运营的市场中培育社会企业，不仅是在新加坡，还包括印度、印度尼西亚、中国大陆、香港和台湾。这些社会企业是由那些致力于为特定社会或环境问题提供解决方案的企业家创立的。除了提供资助，随着这些社会企业规模扩大，它们需要更广泛的银行服务，例如来自银行的融资。为了满足这些需求，我们为他们提供了一个社会企业银行服务包。目标是与他们一起在扩张的各个阶段共同成长。\n\
  \n2020 年，在全球新冠疫情最严重的时候，星展银行批准了超过 10,000 笔无抵押贷款，总额超过 50 亿新加坡元，发放给新加坡的中小企业，其中超过 90%的贷款流向了微型和小型企业。\n\
  \n**帕吉萨斯：** 你如何看待对银行在这些环境和社会问题上表现透明度日益增长的关注？\n\n**钟先生：** 我支持提高透明度。银行，或者更广泛的企业，需要在信息披露方面适应一种思维上的转变。企业倾向于关注自身的业绩和逐年比较的进展。现在，企业还需要质疑其表现是否符合地球边界，例如：“我的公司是否会为实现净零排放贡献应有的份额？”例如，星展银行的气候相关财务信息披露工作组报告展示了银行如何推动气候变化风险管理方面的透明度和开放性。我们在\
  \ 2018 年发布了第一份气候相关财务信息披露工作组报告。星展银行是新加坡第一家签署气候相关财务信息披露工作组协议的银行。编制这份报告很困难，因为银行被要求报告其范围\
  \ 3 排放。范围 3 排放并非我们自身的运营排放。它是我们客户的排放。如果我们的客户不报告其排放，我们就没什么可报告的。\n\n碳排放报告还有一个额外的挑战，那就是有多种不同的方式来对假设的排放进行建模，并且对其准确性存在不同看法。然而，我们决定冒险一试，因为即使数据不完美，或者有时甚至无法获取，我们也必须从某个地方开始。追求完美可能会阻碍向好的方向改变。有时，你必须通过学习与实践的投资来不断改进。\n\
  \n\n\n#### 访谈：可持续金融的未来\n\n我认为这正是星展银行从一开始就支持 TCFD（气候相关财务信息披露工作组）的原因。我们知道这将是一个学习的过程。我们以身作则，因为星展银行是新加坡的旗舰银行，有望提高本地区其他银行的标准，促使它们效仿。\n\
  \n**Pagitsas：** 为什么 TCFD 对星展银行来说是一个重要的报告工具？\n\n**Chung：** TCFD 强调的是，所报告的数据仍然是财务报告。这让我们不再认为它是“非财务报告”。与气候相关的财务报告将影响公司的财务状况。如果说“这是财务报告”，然后又说“这是非财务报告”，那是没有意义的。如果你这样划分，人们立刻就会对后者不屑一顾。他们会说：“你告诉我这是非财务的，那我就不需要担心了。它不影响我的利润。”这种侧重点的转变很重要。\n\
  \n**Pagitsas：** 显然，您认为气候报告中的未知因素是应该去解决而非回避的问题。对于持有不同观点的另一家银行的可持续金融负责人，您会如何建议？他们可能会说：“我们必须拥有完美的数据来计算我们的范围三碳排放”，或者“在拥有三年的完整数据之前，我们无法评估气候变化的影响。”\n\
  \n**Chung：** 我会指出赤道原则，以证明可持续金融议程可以在其有限性中蓬勃发展。对于 TCFD，尽管要求报告的数据非常广泛，但您也可以围绕质量更高的数据，划定一个狭窄的边界。因此，我在另一家银行的同行可以这样开始这个过程：“我不会审视我的整个金融投资组合。我会审视单个行业。”我们知道，一些碳密集型行业的数据质量更高，例如电力行业。当你从这种数据收集和报告的方法开始，你可以逐年逐步改进。\n\
  \n在星展银行，当我们首次进行 TCFD 的气候风险情景分析，以研究监管变化和物理风险将如何影响投资组合以及我们客户的违约概率时，我们也采取了同样的方法。我们从转型风险开始，因为通过使用碳价上涨作为模拟变化的方式，它更容易建模。相比之下，我们发现物理风险更难以处理。这是因为目前受气候变化影响的资产位置相对不够精确。\n\
  \n在星展银行，我们仍在学习。我会与同样在可持续旅程上的同行分享，你可能会对结果感到惊喜，这些结果可以指导你的战略和资本配置。一个稳健的可持续框架也是一种风险管理方式。\n\
  \n**Pagitsas：** 您上面提到的挑战与数据和建模有关，也与成为领导者以及克服该领域对未知的恐惧有关。让我们更多地谈谈您的领导理念。在您的职业生涯中，有没有人对您作为高管产生影响？\n\
  \n**Chung：** 我的导师 Tessa Tennant 对我影响很大。Tessa 在 2000 年共同创立了 CDP（碳信息披露项目）。她富有远见，很早就看到了数据将变得多么重要。她的工作为\
  \ Mark Carney 和 Michael Bloomberg 在 2015 年提出 TCFD 铺平了道路。我仍然记得早期帮助 CDP 时，我舔信封封口，给公司\
  \ CEO 们寄信，要求他们公开报告。经历了新冠疫情，封口信封再也没有以前那种感觉了！\n\n我从她身上学到的另一个方面是，成为一个有效的沟通者很重要。虽然对某件事有深入的了解很重要，但你必须把它表达清楚。因此，即使在我职业生涯的早期，我也在沟通风格上付出了很多努力。当你希望带动整个公司、国家、市场或行业与你一起致力于某项事业时，你需要良好的沟通。这是我从她身上学到的。她是一位出色的沟通者。\n\
  \n最后，我要说，虽然听起来很老套，但做一个好的倾听者很重要。多年来，一位教练的话一直伴随着我。他说：“很多人倾听是为了回应。他们并没有真正在听。”这句话让我产生共鸣，因为我曾以为自己是在倾听，但实际上，我的脑子里在翻腾着：“我怎样才能给出一个聪明的回答？我怎样才能回答得能展示我的知识？”我并没有真正在听。教练说：“不，你不应该为了回应而倾听。你去倾听。仅此而已。”这句话对我产生了奇妙的影响。\n\
  \n**Pagitsas：** 您是如何与同行和高级领导者合作，推进您制定的可持续金融战略的？\n\n**Chung：** 你需要向高级领导层展示可持续性的价值主张。我知道“价值主张”是一个用滥了的词，而且多年来我听到的许多价值主张都缺乏说服力。很长时间以来，向董事会提出的价值主张论点之一是：“可持续性很重要，因为你的员工会变得更忠诚。”人们会想：“你这么说，但我不太相信。”\n\
  \n价值主张需要有说服力。首先，你需要确保领导层意识到将存在合规压力，不仅是现在的合规，还包括对预期变化的合规，以及对你的出口市场等的合规。对一些人来说，这可能是一个低标准，但这并非理所当然。其次，你利用可持续性来推动绩效和员工参与度。人们终于明白了。事实上，如今，年轻员工往往更忠于他们认同其价值观的雇主。\n\
  \n然而，忠诚只能通过真诚的行动来赢得。因此，这不仅仅关乎可持续性。让我们先放下这个词。这关乎你的立场。你在我个人看来重要的某些事业上持什么立场？真诚很重要，并思考公司代表什么。你必须能够捍卫它。即便如此，你仍然会面临挑战，因为你不会在所有地方都找到共识。\n\
  \n没有一家公司能一直取悦所有利益相关者。由于年轻一代目睹了一些不真诚的行为，他们开始重视价值观。这是告诉高级管理层的另一种方式：“你需要思考你在那些你认为与核心业务无关的问题上的定位。”基于价值观的决策和言行一致，可能会对你吸引和留住人才的能力产生巨大影响。这一点正变得越发重要，也越发现实。\n\
  \n**Pagitsas：** 关于可持续金融，您希望或预测五年内会有哪些不同？\n\n**Chung：** 我担心我可能会以一个相当悲观的基调结束。[笑] 我认为我们的未来是由过去的表现决定的，这不同于投资基金，过去的表现并不能告诉你太多关于未来的信息。随着联合国气候变化框架公约缔约方会议（COP）的召开，我们了解到国际政府间的合作非常具有挑战性，我们可能无法及时解决这个问题。没有国际政府间的合作，我担心发展中国家将不成比例地遭受更多苦难，无论是在物理风险方面还是在经济增长方面。\n\
  \n\n\n- 另外，将可持续发展视为一个行业或职业超过二十年，让我觉得这是有史以来最大的空谈会。[笑声] 我从未见过哪个行业有这么多会议、研讨会和网络研讨会。人们飞遍世界各地参加这些可持续发展会议。我自己也做过不少这样的事，深感愧疚。但你在这些会议上通过演讲所获得的改变，往往与它们所产生的排放，或者为准备这些会议所投入的时间和精力不成正比！\n\
  \n更积极的一点是，我要说，我们知道人类历史不仅仅属于我们这一代，甚至也不仅仅属于我孩子这一代。它属于未来的许多许多代人。我相信詹姆斯·洛夫洛克的盖亚假说和理论。盖亚理论认为，地球上的生物有机体与其周围的无机环境相互作用，形成一个协同且自我调节的系统，这个系统首先创造并现在维持着支持地球生命的气候和生化条件。我对地球找到自身平衡的能力充满信心。它有能力自我修复。\n\
  \n### 20. 海蒂·杜布瓦\n\nAEA Investors LP 环境、社会与治理（ESG）主管\n\n*海蒂·杜布瓦是 AEA Investors LP\
  \ (AEA) 的环境、社会与治理 (ESG) 主管。AEA 由洛克菲勒、梅隆和哈里曼家族利益以及 S.G. Warburg & Co. 于 1968 年创立，是一家全球性私募投资公司，管理资产超过\
  \ 140 亿美元，拥有一个综合投资平台，通过私募股权、成长资本和私募债务解决方案支持领先的中端市场公司。*\n\n*在加入 AEA 之前，海蒂是爱德曼的全球\
  \ ESG 主管。在此职位上，海蒂与董事会和高级管理人员合作，设计、执行并向投资者及其他利益相关者（包括员工、监管机构和非政府组织）传达其 ESG 战略。*\n\
  \n*在爱德曼任职之前，海蒂曾担任公司治理协会的 ESG 总监，负责开发新项目，并管理关于新兴 ESG 趋势的思想领导力和参与活动，面向董事会、企业领导者和公司治理专业人士。在此之前，她在纽约梅隆银行负责企业社会责任和慈善职能。在其职业生涯早期，海蒂在德普律师事务所执业，随后在\
  \ Assurant 和百事可乐担任治理和 ESG 相关职务。*\n\n*她担任 FiscalNote 的 ESG 咨询委员会成员，并任职于伯克利法学院商业与社会研究所及\
  \ GreenFin 会议的咨询委员会。*\n\n**克里萨·帕吉萨斯：** 让我们从 AEA 这家私募股权公司开始。AEA 的业务线有哪些？您作为 ESG 主管的角色如何与这些业务线交叉？\n\
  \n**海蒂·杜布瓦：** 自 1968 年成立以来，AEA 一直致力于投资中端市场企业。五十年后，我们的全球综合投资平台继续通过私募股权、成长资本和私募债务解决方案支持全球各地的公司。我们的私募股权战略支持中端市场、小型企业和初创公司加速并执行其增长计划、运营变革和战略转型。债务集团提供中端市场债务和夹层基金，与中端市场私募股权公司、企业以及优先担保融资的主要安排人合作，寻找并提供债务融资，以支持收购、资本重组、附加收购和投资组合再融资。\n\
  \nAEA 的 ESG 和负责任投资方法始终强调整合，即将 ESG 整合到我们的投资组合和内部运营中。我们也在寻找机会，积极为构建更具包容性和可持续性的经济做出贡献。最值得注意的是，我们最近支持与\
  \ Bridges Fund Management 共同成立了 AEA Bridges Impact Corp，这是一个特殊目的收购公司，将透过联合国可持续发展目标\
  \ (SDGs ) 的视角进行投资。\n\n我于 2022 年 1 月加入 AEA，担任这个新设立的职位，这既是对有效 ESG 管理价值的认可，也反映了 AEA\
  \ 致力于建立企业以实现长期成功的使命。在我的岗位上，我负责扩展和深化我们现有 ESG 平台在内部和投资组合公司运营中的整合，以支持我们已为投资带来的价值。我们的优先事项是确保\
  \ ESG 考量仍然是我们尽职调查流程、与投资组合公司合作以确保卓越运营，以及我们为投资者提供卓越业绩承诺的核心组成部分。\n\n**帕吉萨斯：** 在加入 AEA\
  \ 之前，您曾在全球咨询和传播公司爱德曼领导 ESG 实践。您当时为爱德曼的客户提供了哪些服务？\n\n\n\n**杜波依斯：** `Edelman` 与企业和组织合作，以发展、推广并保护他们的品牌和声誉。他们的主要工具是沟通，用以帮助客户解释其业务、阐明其使命和价值观，并与利益相关者及公众建立信任。\n\
  \n**帕吉萨斯：** 企业如何通过沟通来建立——或失去——信任？\n\n**杜波依斯：** 如今沟通的渠道有千千万万种。虽然一项必须做的工作是按照公认的 ESG\
  \ 框架进行正式报告，但投资者和其他利益相关者会通过多种方式获取 ESG 信息。`Edelman` 的 *《2021 年信任度晴雨表特别报告：机构投资者》* 发现，投资者会使用\
  \ ESG 报告等传统渠道，同时也会关注财报电话会议和社交媒体。这意味着公司需要知道如何通过不同渠道进行沟通。例如，`LinkedIn` 和 `Twitter`\
  \ 的格式与公司网站截然不同，而这又不同于 `PDF` 或印刷版 ESG 报告、可在移动设备上观看的动画演示，以及组织的强制性监管申报文件。\n\nESG 沟通策略面临的挑战在于，你必须保持全盘一致，因为这是你赢得利益相关者信任并建立可信度的唯一途径。同时，你需要做到全面透明，并以适合特定渠道的方式来讲述你的故事。\n\
  \n**帕吉萨斯：** 那么，关键在于当今企业需要为其 ESG 沟通制定一个环绕声策略，就像会议上的 360 度舞台。仅仅发布年度 ESG 报告是不够的。你需要以多种不同的形式与众多利益相关者进行互动。是这样吗？\n\
  \n**杜波依斯：** 是的。回想一下沟通方式，过去是单向沟通，然后是双向沟通，而现在则是全方位、多方向的。例如，投资者可能会查看 `Glassdoor.com`\
  \ 来了解员工对公司的看法，并将这些信息纳入对公司文化的评估中。\n\n**帕吉萨斯：** 您看到组织在社会议题方面正在应对哪些主题？\n\n**杜波依斯：**\
  \ 多样性、公平性和包容性（DEI）是当今最核心的社会议题。我还看到一种假设正在转变，即认为*社会*议题本质上更难衡量。`Edelman` 的 *《机构投资者》*\
  \ 报告还发现，53%的美国投资者对公司披露的关于其多元化和包容性目标及承诺信息的准确性缺乏充分信心，这在所有引发投资者担忧的 ESG 类别中居于首位。在 2020\
  \ 年的报告中，全球绝大多数机构资产管理公司表示，它们正将那些在该领域没有进展的公司列入观察名单。\n\n显然，这意味着 DEI 的衡量工作仍需努力。在许多方面，DEI\
  \ 的衡量还处于早期阶段，因为虽然一些公司已收集自我认同数据一段时间，但许多公司是首次实施必要的流程和程序。要创建一个充分完善、可衡量的社会平台，可能还需要数年时间。\n\
  \n**帕吉萨斯：** 如果大多数社会数据的收集还处于起步阶段，这是否也意味着公司仍处于理解 DEI 政策成果的早期阶段，例如提升 C-suite 职位的多元化代表性以及让所有背景的员工感受到包容？\n\
  \n**杜波依斯：** 是的。大约一年前，我听到一位董事会董事在一次会议上说：“通往 CEO 的道路是由 P&L（损益表）角色铺就的。” 我预计董事会将花更多时间关注来自历史上代表性不足群体的个体在组织中的职位分布。他们更多地是在非创收岗位上吗？虽然代表性数据可能保持不变或有所改善，但留任和晋升情况如何？这是一个需要提出的重要问题。\n\
  \n令我感到鼓舞的是，一些公司正在思考新兴的多种工作模式（如混合办公、纯远程办公或纯线下办公）对公平性的影响。经常在办公室的人是否更容易获得晋升？远程员工是否会因为不在办公室而得不到所需的关注甚至可见度？这是针对社会绩效和影响（即工作的未来）的另一种全新衡量方式，才刚刚起步。\n\
  \n**帕吉萨斯：** 您认为组织在环境和数据议题方面正在应对的头号问题是什么？\n\n**杜波依斯：** 他们正在着手衡量自身的排放量，目标是实现净零排放。这些方法论也千差万别。在《华尔街日报》最近的一篇文章中，标题让我觉得它可能是针对质疑排放披露真实性的，但实际上它更具探索性。作者解释了随着知识的增进，公司是如何频繁地披露其方法论上的改进或演变。[Jean\
  \ Eagelsham, “公司正致力于减少碳排放，但数据可能很棘手，” 2021 年 9 月 3 日。] 所以，我也不认为环境（E）方面在量化上已经做得完美无缺了。[笑]\n\
  \n**帕吉萨斯：** 目前大多数公司的可持续发展或 ESG 战略处于什么阶段？\n\n**杜波依斯：** 我会说处于各个年龄段和各个阶段。成熟度曲线分布得五花八门。而且不仅仅是公司之间。不同地理区域和监管制度之间也有所不同。所有这些成熟度曲线开始相互交叉。有趣的是，每当一家公司通过收购或剥离、私有化、上市、分拆或剥离等方式进行变革时，其商业模式就会发生变化。因此，ESG\
  \ 战略也需要随之改变以反映新的业务。我们现在看到公司开始在为进入公开市场之前就准备其 ESG 目标、战略和形象，这是一个较新的趋势。它们在上市后确实有 12\
  \ 到 18 个月的宽限期来制定 ESG 战略，但我们看到这个时间点正在提前。\n\n**帕吉萨斯：** 如果一家公司已有符合 ESG 原则的现有产品或业务线，投资者是否会期望其更早制定\
  \ ESG 战略？\n\n**杜波依斯：** 不一定。并非总是那些“天生 ESG”的公司在企业层面行动更快。对大多数公司来说，这是一个渐进的过程。你不可能一次性完成所有事情，因为没人想步子迈得太大。对自己的路线图保持诚实是最好的策略。[笑]\n\
  \n**帕吉萨斯：** 这无疑强调了强大治理的必要性，以确保只有正确和准确的数据才能与投资者和公众共享。您对治理有何看法？一家公司如何利用强大的治理来实现其 ESG\
  \ 目标？\n\n\n\n**杜布瓦：** 我的律师背景让我关注治理与问责制。你必须像对待任何其他业务举措一样，将 ESG 战略层层传递到整个组织，因此董事会的监督至关重要。虽然你也常会看到某位\
  \ C 级高管担任倡导者或对执行负最终责任，但这在不同公司可能有所变化。作为 C 级领导者或董事会成员，你需要提出这样的问题：“如果我们的 DEI 目标涉及在公司特定层级增加历史上代表性不足群体的员工比例，管理层正在部署哪些策略？例如，人才招聘在人才储备建设方面需要做什么？当代表性数字趋于稳定或增长时，需要什么样的学习与发展计划来维持良好的留任率？我们是否需要将多元化候选人名单作为继任计划的一部分？”你必须将责任分配给那些具备专业知识和能力来制定并实施这些策略的人。\n\
  \n自新冠疫情爆发以来，对问责制的关注显然有所加强。监督与执行的机制正成为许多公司战略规划过程中越来越重要的部分。\n\n**帕吉萨斯：** 公司可以移除哪些常见障碍，以在建立问责制方面取得进展？\n\
  \n**杜布瓦：** 我见过一些刚刚起步的组织质疑，如果不建立一个庞大的 ESG 部门，他们能否取得进展。然而，根据我的经验，你并不需要一个庞大的部门。ESG\
  \ 应该嵌入到每个职能部门和业务单元中，以便让拥有正确专业知识的人来执行工作。\n\n我将 ESG 的角色视为“升起潜望镜”的角色。ESG 角色可能拥有几个组成部分——战略制定、数据收集与报告，以及管理治理机制和流程，如定期的\
  \ C 级高管和董事会审查。ESG 可能被集中管理，但它是一个高度网络化的角色。\n\n一个实用的资源配置方案可能是，让一位高潜力的早期职业员工在一位执行发起人的监督下，担任几年的\
  \ ESG 项目管理工作。这将让他们获得对公司 360 度的全面视角，并带着 ESG 思维模式回到业务岗位。如果资源允许，他们还可以考虑投资一位数据科学家来收集和解读数据，以及一位技术性\
  \ ESG 报告专家，与公关、投资者关系及其他对外职能部门合作，汇报进展并讲述公司的故事。\n\n**帕吉萨斯：** 那么，ESG 团队可能是一个负责战略制定和基础设施管理的小团队，但谁来负责执行工作以实现公司的\
  \ ESG 目标呢？\n\n**杜布瓦：** 这取决于目标。例如，对于一家制造商来说，要减少用水量，必须运用运营方面的专业知识。同样，DEI 目标并不仅仅由首席\
  \ DEI 官负责，可能还需要一位高管薪酬专家，他可以帮助制定指标，并将其纳入高管的绩效计划中。最终，需要建立一个合适的人员网络来执行这些策略。在组织设计、人员配置和问责制映射方面，这些都是非常具体和细致的工作。\n\
  \n**帕吉萨斯：** 随着对 ESG 关注度的提高，企业应该预期到哪些变化？\n\n**杜布瓦：** ESG 不能再是营销材料中使用的流行词，或者仅仅是走过场的活动。强大的\
  \ ESG 项目为更可持续的企业铺平了道路，这些企业可以释放更大的长期价值，为投资者带来更高的回报，并对社会产生积极影响。简单来说，一个 ESG 战略如果没有在整个组织内获得全面、彻底的认同与整合，就无法持久。\n\
  \n更广泛地说，我看到了几个大趋势。其中一个与 ESG 数据环境有关。我这么说是指，当 ESG 报告刚开始时，它主要是一种回顾，组织会说：“这是去年的数据。”\
  \ 现在，我认为你会看到他们更多地谈论未来的战略，这意味着 ESG 正在成为战略本身。\n\n与此相关的是，PIMCO 对全球 10,000 家公司的研究显示，从\
  \ 2005 年到 2018 年，在业绩电话会议中提及 ESG 问题的比例从零到百分之一。从 2018 年到 2019 年，这个数字增加到了百分之五。新冠疫情后，这个比例达到了百分之十九到百分之二十。[PIMCO,\
  \ Erin Browne and Geraldine Sundstrom, “Mid-Cycle Investing: Time to Get Selective,”\
  \ 2021 年 9 月 14 日。]\n\n在最近的一篇文章中，FactSet 也发布了标普 500 指数公司在业绩电话会议中提及 ESG 因素次数创纪录的数据。[John\
  \ Butters, “Record-High Number of S&P 500 Companies Discussion ‘ESG’ on Q2 Earnings\
  \ Calls,” 2021 年 9 月 10 日。] 这些研究表明，更多战略性、面向未来的信息正在变得可用，并将继续成为市场发展方向中越来越重要的部分。\n\n\
  在资产管理领域，通往 ESG 的道路始于社会责任投资，它主要与表达特定投资者个人或机构的价值观有关。然后出现了从“价值观”向“价值”的转变，反映了一种可以归入\
  \ ESG 整合这个大范畴下的风险回报目标。我们可能会看到价值观的回归，可能成为分析公司为利益相关者创造价值潜力时的一个组成部分。这对公司和投资者来说都是一个不同的视角。\n\
  \n这种发展的一种表现形式可能涉及投资者更深入地研究企业文化。目前，董事会非常关注企业文化，尤其是在疫情之后。此外，世代间约 30 万亿美元的资产转移给千禧一代可能会引发大规模变化，具体取决于他们最终决定如何投资。“影响力投资”这个词目前在欧洲更为突出，但创造积极变化与赚取预期回报率这双重目标正在进入全面的审视中。这几乎就像价值观正在以一种不同的语境下复苏。\n\
  \n**帕吉萨斯：** 为什么价值观整合正在回归？是什么在推动这种趋势？\n\n**杜布瓦：** 聘请资产管理人的资产所有者正在询问影响力相关的问题。资产管理人作为其客户的受托人，正在响应这一需求。也许这是由千禧一代及更年轻一代推动的。我的女儿是\
  \ Z 世代，所以她什么都想自己干。他们就是这么想的。他们可能想用自己的钱来影响社会或环境变化，因为他们想自己来做。\n\n我确实认为，新冠疫情，加上对公平、社会和种族正义的重新追求，让很多人重新评估了自己的目标。因此，相当一部分投资者可能正在进行重新调整。我不知道这会不会持续下去，但我认为目前这相当突出。据我听闻，资产所有者想要谈论价值观。爱德曼的*机构投资者*研究表明，大多数美国投资者更有可能投资于在社会问题上表明立场的公司，其中获得医疗服务和气候变化是首要议题。\n\
  \n**帕吉萨斯：** 现在，公司作为法律实体被要求表达价值观，而价值观通常是与作为个体的个人联系在一起的。海迪，公司作为一个机构、一个法律实体，是否存在不真实的风险？\n\
  \n**杜布瓦：** 是的。爱德曼最新研究中的几乎所有美国投资者都表示，在推荐投资之前，他们必须信任一个公司的使命或宗旨。\n\n\n\n**帕吉萨斯：** 一家公司如何通过其员工、产品和服务来保持其真实本色并彰显其价值观？我知道，这是一个非常存在主义式的问题。[笑]\n\
  \n**杜布瓦：** 法学院是我接触公司概念的开端。从那时起，让我印象深刻的是，这实际上是政府与公司实体之间的一种社会契约，公司获得经营许可，以便提供我们自己无法生产或政府不擅长提供的商品和服务。我们作为公民自然对其表现抱有期望。当我们进行一场关于商业目的（而非特定公司目的）的全球性讨论时，我们会不断回到这个问题：我们希望企业做什么？一旦我们知道了我们希望它做什么，衡量其表现的记分卡又是什么？一家公司大概应该每三到五年重新评估一次其目标和优先事项。\n\
  \n那么，我们来谈谈行动沟通。先行动，后发声。我们看到员工将雇主视为了解世界动态的最值得信赖的信息来源。我们看到很高比例的员工期望他们的领导层对紧迫的社会问题发声。在爱德曼关于“信念驱动型员工”的研究中，有一个发现格外引人注目。十分之六的受访者表示，他们根据信念选择雇主，并拒绝在价值观与自己不符的公司工作。在当前环境下，员工是多利益相关者模式的核心。[理查德·爱德曼，《信念驱动型员工》，爱德曼洞察，2021\
  \ 年 8 月 31 日。]\n\n机构投资者继续将 ESG 作为关键信任因素加以重点关注。爱德曼的《机构投资者》报告发现，许多投资者认为公司经常在财务披露中夸大其\
  \ ESG 进展，并且大多数投资者不相信许多公司能够实现其宣称的 ESG 目标。因此，随着 ESG 格局的持续演变，我们仍有一些差距需要弥合。\n\n**帕吉萨斯：**\
  \ 回到你的专业经验，你是如何成为 AEA 的 ESG 负责人的？\n\n**杜布瓦：** 我的职业生涯始于 1999 年，当时是一名专注于高管薪酬的并购律师。从那时起，我从事上市公司信息披露和代理投票相关事务。我处理的第一个\
  \ ESG 问题是安然丑闻之后高管薪酬披露的爆炸性增长。随后，我开始在几家美国上市公司与董事会合作，处理治理和薪酬方面的事务。\n\n随着我逐渐深入现在所谓的\
  \ ESG 领域，我发现我的法律训练使我为尽职调查和实现 ESG 目标的现实做好了充分准备。那个背景及其严谨性让我在 ESG 领域变得坚韧不拔。\n\n2011\
  \ 年加入百事公司后不久，公司任命了首位首席人权官。除了在法律部门内的治理和薪酬职责外，我还支持了人权项目的制定和实施。这个角色标志着我正式转型为全职 ESG\
  \ 专业人士——这对我来说是一个非常重要的时刻。\n\n我的下一个职位是在纽约梅隆银行，在那里我担任内部职能部门和业务部门在数据收集方面的 ESG“潜望镜”，以及沟通和投资者关系部门的协作节点。此外，我还负责\
  \ ESG 报告以及与 NGOs 的互动。在做了十年企业内部工作后，我决定回到顾问角色，因为作为一名律师，我真的很喜欢帮助别人。于是，我加入了爱德曼，领导他们的咨询业务。在\
  \ AEA，我与我们的投资组合公司合作，制定并执行旨在为我们的投资者创造长期价值的 ESG 战略。\n\n**帕吉萨斯：** 哪些职业和个人经历让你与你所从事的环境、社会和治理问题产生联结？它们如何影响你的领导方式？\n\
  \n**杜布瓦：** 我身上的律师特质是 ESG 中的`G`，即`治理`部分。`S`，即`社会`部分，是我在人权领域的工作。而`E`，即`环境`部分，则直接来自于海洋。我热爱并敬畏大海。\n\
  \n我从小就是一名竞技帆船运动员，经常和家人一起赛船。在帆船运动中，使命是第一位的：一切都应为使命服务。如果一个人在航行中没有专注于使命，那么你就少了一个以上的船员。这个人不仅没有追求使命，而且团队中的其他人还必须弥补他的缺失。当我成为一个运转如无缝整体的团队的一员时，我感觉棒极了。\n\
  \n**帕吉萨斯：** 为什么人权对你很重要？\n\n**杜布瓦：** 当我在百事公司工作时，第一次了解到联合国《商业与人权指导原则》，我意识到它们正是我想成为的那种人的蓝图。这个框架捕捉到了我希望如何对待世界上的其他人。例如，它帮助改变了我处理商务会议的方式，这些会议可能充满争议，或者会有许多对立的观点，或者有某个我需要更加努力才能与之建立联系的参与者参与其中。它改变了我与同事互动的方式，因为我提醒自己，房间里的每个人都享有基本人权。这是我对待他们所有人的方式。它确实改变了我与工作场所内外其他人互动的方式。而由埃莉诺·罗斯福推动的《世界人权宣言》始终是一个奋斗目标。\n\
  \n**帕吉萨斯：** 海蒂，每天是什么驱使着你？\n\n**杜布瓦：** 每一天，我都有机会以新的方式看待商业。正是对即将发现之物的期待驱使我前进。例如，在过去几十年里，我们模拟气温上升的潜在变化、这将对农业生产产生何种影响以及可能导致何种供应链影响的能力要有限得多。发掘更好地运营企业的潜力是如此令人兴奋。这才是让我一直思考\
  \ ESG 的真正原因。我也喜欢它，因为它很复杂。这些问题常常相互交织，而且往往需要考虑权衡取舍。\n\n**帕吉萨斯：** 对于 ESG 问题，没有一刀切的答案。每个答案在某种程度上都是新的，并且是为独特情况量身定制的。这么说对吗？\n\
  \n**杜布瓦：** 是的。从事这项工作，需要承受一定程度的波动性。帮助别人对此感到更有信心，我会从中获得满足感。\n\n**杜布瓦：** 至少那是我的目标。我不知道我是否会成功。[笑]\n\
  \n**帕吉萨斯：** 你最喜欢的书是什么？为什么？\n\n**杜布瓦：** 哦，这很简单。我最喜欢的书是薇拉·凯瑟的《主教的死亡》[(阿尔弗雷德·A·克诺夫出版社，1927\
  \ 年)]。我想是因为它对于风景以及穿行其中的人们进行了沉思性的欣赏。我七年级时第一次读到这本书，当时还写了我的第一篇研究论文关于它。书中有一段描述了迪内人（以前被称为纳瓦霍人）如何穿行于这片土地。在新冠疫情期间，我会去我们的屋顶，看到天空依然广阔，草还在生长，花儿依旧绽放。感觉自己是一个更广阔世界的一小部分，这感觉很好。那本书一直带给我这种感觉。\n\
  \n我很久以后才知道的唯一一件事是，薇拉·凯瑟安静地以自己的方式生活。她不用流行的女性气质规范来定义自己——她就是这样。我钦佩那些能够平静地活出真实自我的人——这也是我努力追求的一个目标。\n\
  \n\n\n### 21. 玛丽莎·布坎南\n\n摩根大通董事总经理兼全球可持续发展主管\n\n`玛丽莎·布坎南`是`摩根大通`（一家美国跨国投资银行与金融服务控股公司）的董事总经理兼全球可持续发展主管。就总资产而言，`摩根大通`是美国最大的银行，也是全球第四大银行，截至\
  \ 2020 年底，其总资产为`3.4`万亿美元。\n\n`玛丽莎`在商业与环境交叉领域拥有超过 20 年的工作经验。她负责制定和实施公司在融资活动和运营中的可持续发展战略。在这个对内对外的双重角色中，她在`摩根大通`推动可持续发展倡议和承诺方面发挥着不可或缺的作用，包括公司符合*巴黎协定*的融资承诺以及`2.5`万亿美元的可持续发展目标。她还建立了公司在气候变化和碳信息披露方面的知识和领导力，并领导公司在\
  \ ESG 报告、利益相关方与政策参与以及可持续发展资助方面的工作。\n\n在 2012 年加入`摩根大通`之前，`玛丽莎`曾在`彭博社`担任分析师，其研究重点是美国政策法规对电力、石油和天然气行业的影响。她曾与`Verdeo\
  \ 集团`合作，在采矿和*石油天然气*行业开发甲烷减排项目。除了识别和评估项目开发机会外，她还管理与碳资产认证相关的活动，并主导美国及国际气候与能源政策的参与工作。她还曾与`Econergy\
  \ International`（一家在拉丁美洲和美国拥有资产的独立电力生产商，后被`苏伊士集团`收购）合作开发可再生能源和甲烷减排项目。她的职业生涯始于`Surdna\
  \ 基金会`的环境团队。\n\n`玛丽莎`担任`环境法研究所`董事会成员。2021 年，她因其在推进可持续解决方案方面的贡献，被评为*环境+能源领袖 100 人*之一。\n\
  \n**克里西塔·帕吉萨斯：** 您最初是在什么时候意识到环境和社会问题及其与企业之间的关系的？\n\n**玛丽莎·布坎南：** 我青年时期（90 年代初到中期）是在加利福尼亚的湾区长大的。那是该地区飞速发展的时期。我看到了各种各样的挑战，比如经济适用房紧张，以及严重的交通拥堵问题。大学四年级前的那个夏天，我在一家代表湾区大企业的行业协会实习，该协会现在叫`硅谷领导力集团`。该组织当时正参与州内的“生活质量”公共政策议题，例如住房、公共交通和土地使用——这些对试图吸引和留住顶尖人才以建立成功企业的公司至关重要。那是我第一次看到公共政策对商界的重要性，以及良好的政策如何能为当地社区带来真正的改变。\n\
  \n大学毕业后不久，我在纽约市的`Surdna 基金会`找到了一份工作。我在环境项目组工作，我们向致力于推动可持续林业、可再生能源，以及精明增长和市场化的气候变化解决方案（这在当时是相对较新的概念）等议题的非营利组织提供资助。那段经历帮助我理解了环境和社会问题之间存在的深层联系。它也激发了我从商业界内部着手，应对气候变化等挑战的兴趣。\n\
  \n在`Surdna`的经历还激发了我对能源和气候变化的浓厚兴趣。我发现能源及其在全球经济中的作用非常迷人。能源对于促进全球经济发展、增长和社会进步至关重要，但世界历史上对化石燃料的依赖也付出了代价。挑战在于，如何既能满足人们对能源的需求，又能以可负担的方式实现，并大幅降低对环境的影响。不过，要记住，没有任何一种能源是完美无缺、无需权衡的。例如，制造风力涡轮机需要钢铁，制造太阳能板和电池需要稀土矿物。地缘政治问题也会牵涉其中。挑战的规模是巨大的，但我们必须继续取得进展。\n\
  \n**帕吉萨斯：** 在您的职业生涯中，是否有某个特定的经历让您坚定了社会、环境和商业问题之间相互关联的看法？\n\n**布坎南：** 在`Surdna`工作后，我去读了研究生，学习环境和能源政策、经济学以及金融。毕业后，我去了一家可再生能源公司工作，这家公司当时正在根据《京都议定书》设立的`清洁发展机制`下开发项目。这是第一个大规模的合规抵消市场，发达国家的实体可以通过这个市场向发展中国家的减排项目投资。该公司正在拉丁美洲为\
  \ CDM 市场开发风能和径流式水电项目，并有一个专注于美国甲烷减排项目的小团队，当时美国的自愿碳市场正在起步。\n\n在那段经历中，我得以深入了解项目财务和实际开发一个项目所需的运作机制。我学到的一点是，某件事可能对环境有益，但经济上必须对企业和投资者可行。经济可持续性和环境可持续性必须齐头并进。但这并不仅仅是经济问题。有时经济上可行，但仍存在其他阻碍项目开发的障碍。\n\
  \n**帕吉萨斯：** 如果某项举措在财务上不合理，企业应该做些什么来应对环境挑战？在这种情况下，是否有一系列可能的应对方案？\n\n**布坎南：** 大多数公司经营业务不仅仅是为了当下。他们一直在思考如何为未来建设和投资。今天在财务上不合理的事情，不代表将来也不会合理。降低成本是开发新技术和解决方案并将其商业化的关键一环。这需要投入和时间，但从长远来看，回报可能非常丰厚。\n\
  \n另一方面，要明白采取某些行动的成本和收益不一定都是财务性的，也不一定能轻易转化为财务指标。公司必须问问自己，采取某项特定行动是否会带来声誉、客户或员工忠诚度方面的好处？或者是否存在一个值得利用的长期竞争优势，或者不采取某项具有环境效益的行动会面临何种风险？有时，采取某个行动仅仅是因为这是正确的事情。\n\
  \n**帕吉萨斯：** 关于整合业务与应对环境问题，您还有哪些其他关键心得？\n\n\n**布坎南：** 2008 年至 2010 年间，我曾在一家小型初创公司工作，与煤矿公司、石油和天然气公司合作，帮助他们减少逸散性甲烷排放，这些排放会导致气候变化。我大部分时间在西弗吉尼亚州、宾夕法尼亚州、科罗拉多州、怀俄明州和俄克拉荷马州度过。那时，商界开始更深入地参与气候议题，但在一些行业和政界圈子中，仍有很多人对气候变化是否真实存在持怀疑态度。我们的策略是鼓励企业减少逸散性甲烷，但不把气候变化作为他们这样做的理由。在这种情况下，效率对客户来说极为重要。他们希望以负责任的方式运营，不浪费宝贵的资源，尤其是那种可以用于销售的资源。正因如此，我们得以成功开发了一些很好的项目。\n\
  \n**帕吉萨斯：** 所以，你和他们谈钱，但没谈环境问题？\n\n**布坎南：** 并非我们完全不谈气候问题。我们没有说的是，气候问题是你们花钱采用新技术捕获甲烷的首要原因。对我而言，那段经历强调了一点：要想做成某件事，你必须理解与你合作的人或公司的关注点是什么。他们的兴趣和动机是什么？他们在乎什么？倾听和理解至关重要。\n\
  \n这段经历也让我认识到，我们大多数人之间的共同点远比我们意识到的要多。但很多时候，人们只关注分歧，不去思考共同利益在何处交汇，以及如何专注于推动对双方都有利的事情向前发展。\n\
  \n**帕吉萨斯：** 你现在在摩根大通。你的职责范围是什么？\n\n**布坎南：** 作为摩根大通可持续发展团队的负责人，我和我的团队负责制定公司在融资活动和运营方面的可持续发展战略。我们还负责监管\
  \ ESG 报告、利益相关方和政策接触，以及可持续发展资助。我们近期的大部分工作重点是帮助整个组织建立可持续发展方面的专业知识和能力，尤其是在那些日常服务客户的业务条线中。\n\
  \n**帕吉萨斯：** 摩根大通如何定义可持续金融？\n\n**布坎南：** 它一方面关乎帮助我们的客户筹集资金以实现其可持续发展目标，另一方面也关乎帮助我们的客户以符合其价值观或满足特定可持续发展目标的方式进行资本投资。除了融资和投资，我们还为客户和顾客提供咨询和研究服务。我们专注于在所有职能领域建立自身的组织专业知识和能力。这就是金融变得更可持续的途径。它必须融入我们为客户和顾客提供的服务之中，而不是与之分离。\n\
  \n**帕吉萨斯：** 碳转型中心（CCT）是为任何寻求融资以实现《巴黎协定》目标承诺的摩根大通客户设立的，对吗？\n\n**布坎南：** CCT 是我们为更好地服务客户而建设的能力之一。2020\
  \ 年 10 月，当我们做出与《巴黎协定》一致的融资承诺时，我们宣布了成立 CCT。我们知道，不同行业中越来越多的客户需要融资，以便能够投资并逐步转型其业务。这可能包括贷款，也包括在私募或公开市场筹集资金。但他们还需要咨询和研究渠道等服务。\n\
  \n设立 CCT 是为了确保我们的客户能够获得摩根大通提供的全套能力，从而利用公司内部许多其他团队的专业知识和产品——无论是覆盖银行、债务和股权资本市场、大宗商品、销售与交易，还是其他领域。\n\
  \n2021 年，我们还在商业银行部门成立了一个绿色经济团队，以更深入地覆盖那些生产环保商品和服务，或专注于环境保护等事项的中小企业。我们非常注重确保我们在客户覆盖角色以及其他产品和服务角色中拥有合适数量的人才，以满足客户和顾客不断变化的需求。\n\
  \n**帕吉萨斯：** 什么是《巴黎协定》？\n\n**布坎南：** 《巴黎协定》是一项得到 190 多个国家支持的条约，旨在减少全球温室气体排放，将平均气温较工业化前水平的上升幅度控制在\
  \ 2 摄氏度以内，并力争控制在 1.5 摄氏度以内。各参与国都制定了各自的减排气候计划，称为“国家自主贡献”，以帮助实现《巴黎协定》的目标。因此，通往巴黎的全球“路线图”本质上就是各国所制定计划的总和。\n\
  \n挑战在于，迄今为止各国政府采取的措施还不足以将排放量降低到实现《巴黎协定》目标所需的水平。这是雄心与现实之间的差距。这也是私营部门面临如此大压力去填补这一空缺的原因之一。\n\
  \n**帕吉萨斯：** 摩根大通对《巴黎协定》有何承诺？\n\n**布坎南：** 摩根大通长期以来一直支持制定审慎的能源和气候政策。2017 年，当美国宣布计划退出《巴黎协定》时，我们公开表示认为美国应该留在协议中。并且我们支持美国在\
  \ 2021 年重新加入。\n\n对我们而言，我们在气候问题上能扮演的最大角色就是通过与客户和顾客的合作来实现。一方面，这意味着要做更多工作为绿色技术提供融资，并帮助世界各地的企业获得资本，以便他们能够投资于减少自身运营排放的措施，或创造让客户也能减排的新产品和服务。这就是为什么我们在\
  \ 2021 年设定了一个目标：到 2030 年底，融资和促成超过 2.5 万亿美元，以推进应对气候变化和促进可持续发展的长期解决方案。这其中包含一个专门针对绿色倡议的\
  \ 1 万亿美元子目标。\n\n另一方面，这也意味着要与那些以负责任方式运营，并将气候视为战略风险和机遇的公司合作。2020 年 10 月，我们是首批宣布与《巴黎协定》一致的融资承诺的银行之一。此后，我们公布了针对油气、电力和汽车融资组合的排放目标。这意味着，到\
  \ 2030 年，我们将把这些融资组合的碳强度降低到与《巴黎协定》长期目标一致的水平。2021 年秋季，我们还加入了“净零银行业联盟”，并计划随着时间的推移为其他行业设立目标。我们的资产管理业务也是“净零资产管理人倡议”的成员。\n\
  \n**帕吉萨斯：** 为什么帮助企业与《巴黎协定》的目标保持一致很重要？\n\n**布坎南：** 根据我以往的经验，我知道如果你希望企业转型，你必须帮助他们。另一种选择是直接放弃。在我看来，那是错误的做法。现实情况是，当今世界需要大量能源，未来对能源的需求只会更大。商界在持续创新，但实现净零排放的路径需要世界在能源来源和消费方式上发生巨大转变。我们需要支持并加速这一转变。\n\
  \n**帕吉萨斯：** 对于这一转型战略，你听到过哪些批评？你是如何回应这些批评的？\n\n\n**布坎南：** 我认为审视全球能源系统与经济的现实情况至关重要。在关于应对气候变化的讨论中，常常聚焦于减少化石燃料，尤其是减少化石燃料的供应。但只减少供应而不减少需求，并非成功的方案。如今，人们仍依赖这些能源。风能和太阳能等虽然呈指数级增长，但全球在交通领域——无论是公路货运、航运还是航空——以及用于生产工业和房地产领域所需的钢材和水泥等产品时，依然使用化石燃料。此外，世界还利用石油和天然气制造大量的化学品、塑料和产品，包括许多人日常使用的各种物品。\n\
  \n能源转型将极其复杂。除了减少温室气体排放，能源成本和可及性、特定地区资源的可用性或匮乏，以及地缘政治考量等问题都必须纳入考虑。我坚信，气候解决方案要想成功，必须造福于民众和社区。\n\
  \n**帕吉萨斯：** 您帮助制定的可持续发展战略在摩根大通内部是如何被接受的？\n\n**布坎南：** 大约十年前我刚加入摩根大通时，有人问：“我们为什么需要一个可持续发展团队？你们的工作是什么？”\
  \ 那是出于好奇，并非敌意。如今情况大不相同。我常说：“组织变革是由内外部因素共同作用的结果。” 在这种情况下，这些因素包括：社会日益认识到气候变化是一种威胁；技术进步使许多低碳和零碳技术在成本上具有竞争力；政策和法规的变革；以及我们许多股东、客户和顾客希望我们能够做得更多的愿望。公司领导层也意识到了这些趋势，并理解了我们引领潮流的重要性。\n\
  \n**帕吉萨斯：** 全球对可持续发展的关注还有哪些其他因素？\n\n**布坎南：** 媒体——尤其是社交媒体——在让当地的人们和活动家记录问题、进行宣传以及追究公司责任方面发挥了巨大作用。这一点并未得到应有的关注，它值得很多赞誉，因为它让许多人看清了环境退化与污染等问题的真相。\n\
  \n我知道这促使活动家和其他人积极与投资者社区合作，共同推动公司变革。你看到了这一点，也看到了如今众多机构投资者在环境和社会议题上的参与程度。过去，他们只关心公司治理。但现在远不止于此。如果你现在是一位首席执行官或首席财务官，想要筹集资本，投资者希望看到你在负责任地行事。他们希望了解你对社区和环境产生的影响。这时，首席执行官或首席财务官就会说：“我们必须制定一个可持续发展战略。”\
  \ 但这不仅仅是战略。其中很大一部分是找到一种方式来讲述你的故事：你正在做什么，以及为什么这能让你成为一家更好的企业。如今，作为一家公司，你必须向众多不同的受众讲述这个故事。\n\
  \n如今，全球信息流动非常流畅且实时。然而，在我看来，社交媒体和 24 小时新闻周期的普遍存在的一个弊端——它缩短了我们的集体注意力持续时间，并催生了对吸引眼球标题的需求——是不利于我们就能源和气候变化所面临挑战的复杂性进行理性对话。挑战和解决方案并非非黑即白，但它们往往就是这样被呈现出来的。\n\
  \n**帕吉萨斯：** 最后，作为一位经验丰富的可持续发展领导者，您会对刚刚开始可持续发展职业生涯的人提出什么建议？\n\n**布坎南：** 我是被马特·阿诺德招募到这里来的，他做了我九年的老板。多年前，他曾在我此前工作的苏德纳基金会的一个受资助机构工作过。我总是追随那些我认识、尊重并能激励我的人。这贯穿了我整个职业生涯。我总是告诉那些寻求建议的人：“找到一个你想为之工作的人。”\
  \ 不要太在意头衔等等，因为在可持续发展领域，没有哪份工作描述是固定不变的。你的工作基本上就是你想要它成为的样子。而且随着你取得进展，它每年都在变化。这以及学会如何成为一个有效的影响者，都非常重要。\n\
  \n### 22. 辛西娅·柯蒂斯\n\n仲量联行 (Jones Lang LaSalle) 可持续发展利益相关方参与高级副总裁\n\n*辛西娅·柯蒂斯是仲量联行（JLL）负责可持续发展利益相关方参与的高级副总裁，负责将\
  \ JLL 的可持续发展项目融入所有业务线，并通过 JLL 及其客户推动具有意义的环境、社会和财务影响。JLL 是一家全球性的商业房地产服务公司，在 80 多个国家设有办事处，2020\
  \ 年收入超过 160 亿美元。辛西娅正推动 JLL 实现其净零碳排放目标，即到 2040 年减少其管理物业的范围三排放。此外，她通过按照气候相关财务信息披露工作组（TCFD）标准进行报告，确保\
  \ JLL 的投资者全面了解 JLL 的能力、目标和影响。*\n\n*此前，辛西娅曾在公共、私营和非营利部门工作，包括 Ceres 和 CA Technologies，她在\
  \ CA Technologies 担任副总裁兼首席可持续发展官。*\n\n*辛西娅代表 JLL 担任世界绿色建筑委员会（World GBC）企业咨询委员会的成员。她还是\
  \ Greenbacker 可再生能源公司董事会的成员，该公司致力于在可持续基础设施领域为公众股东和机构投资者投资项目和管理资本。*\n\n**克里萨·帕吉萨斯：**\
  \ 您是如何走上职业道路，最终成为仲量联行负责可持续发展利益相关方参与的高级副总裁的？\n\n**辛西娅·柯蒂斯：** 我的职业生涯，可以说，是一条相当迂回的路线。我职业生涯的大部分时间都在做市场营销，我至今仍认为自己是一个营销人。我在华盛顿特区的国会山工作了头五年，然后攻读了\
  \ MBA，以便更专注于国际商务，重点是市场营销。1995 年，我开始在科技公司工作——先是 Unisys，然后是 EMC。我职业生涯中相当长一段时间都在为这些公司负责全球服务营销。\n\
  \n在 21 世纪初的 EMC，我开始听到客户说我们的技术消耗了太多能源。尽管我当时的老板说这是一个工程问题，但我反驳了，因为我觉得这里还有更多值得探索的东西，比如实现更大的标准化。我当时就在前瞻性地思考可能影响\
  \ EMC 及其设备能耗的政策，思考如何领先一步，以及如何影响这些政策。那是我从国会山带出来的背景。但我没有很好地推销这个想法，这事就这么不了了之了。那是在可持续发展远不像现在这样广为人知的时候。多年后，EMC（现在的戴尔）正在采取一些非常有意义的措施。事实上，我的一个好朋友凯瑟琳·温克勒引领他们踏上了这条道路。\n\
  \n然后，在 2006 年，我观看了电影《难以忽视的真相》，这促使我问自己：“我怎么能不对这些气候问题做点什么？” 我强烈地感觉到，如果企业看不到将重点转向进行环境可持续的改造和投资所带来的益处，那么就不会有持久的改变。这成为了我的催化剂，让我决心利用我的技能和经验来做出改变。\n\
  \n**帕吉萨斯：** 您对可持续发展的热情是如何在个人生活中体现的？\n\n\n\n**柯蒂斯：** 可以说，我是绿色建筑的早期采用者。我自建的房屋获得了美国绿色建筑委员会\
  \ LEED（能源与环境设计先锋）金级认证。在当时，这在住宅领域非常新颖，我的房子也是我们镇上第一栋获得 LEED 认证的房屋。既然要建造，我决定它必须对环境产生最小的影响。我的建筑师说：“那么，我们应该争取\
  \ LEED 认证。”这对我们所有人——我、我的建筑师和我的建造商——来说，都是一次巨大的学习经历。除了所有的文档要求外，每一个决策在材料选择上都有多种组合。因为当时一切都很新，我支付了溢价。用营销术语来说，这是一个“先行者”劣势！话虽如此，我会毫不犹豫地再做一次。\n\
  \n**帕吉萨斯：** 这种个人经历在哪些方面转化到了你的职业生涯中？\n\n**柯蒂斯：** 绝对有！这激励了我在 CA、之后在 Ceres 以及现在在 JLL\
  \ 专注于可持续发展。它帮助我决定改变我的职业道路，专注于可持续发展。它也给了我一些可信度，因为这是我承诺的有形证明。我曾有机会在 CA Technologies\
  \ 领导可持续发展沟通与战略。我对自己说：“我可以整天做这个。”但在我入职的第三天，那个雇佣我、并且是公司里唯一一个头衔中带有“可持续发展”的人被解雇了。结果，我的学习曲线从\
  \ 90 度变成了 180 度。这非常陡峭，但也让我能够创造并奠定我认为我们需要做的事情的基础。\n\n离开 CA 后，在 2015 年巴黎联合国气候变化框架公约（UNFCCC，也称为\
  \ COP 或缔约方会议）之前，我在 Ceres 工作。最让我兴奋和感激的事情之一，是有机会起草一份由美国大型银行支持应对气候变化行动的声明。这些银行以前从未就任何事情发表过联合声明，更不用说气候变化了。它们当时有动力发表这份声明，是因为开始受到来自利益相关者要求采取气候行动的压力。这相当考验谈判和外交技巧，但我们最终还是把它发布了出来。\n\
  \n之后，一位来自 JLL、名叫迈克尔·乔丹的人（我在 CA Technologies 时曾雇佣他作为咨询项目的一员）打电话给我问：“你想来 JLL 吗？你可以和我们的客户一起做可持续发展咨询。”我想：“我不知道我是否真的想做这个，但我们会试一试。”\n\
  \n于是，我在 2015 年加入了 JLL，最初与客户合作制定他们的可持续发展战略，但后来意识到我们并没有像我知道可以做到的那样言行一致。因此，我转而将一半时间用于\
  \ JLL 的内部项目，之后完全转到企业可持续发展团队，帮助制定和推动 JLL 的战略。\n\n**帕吉萨斯：** 你的职责范围是什么？\n\n**柯蒂斯：**\
  \ 我的职责是推动可持续发展战略，与我们的客户和面向客户的员工合作，接触我们的投资者，与投资者关系团队合作，并在 Ceres 和世界绿色建筑委员会等成员组织中代表\
  \ JLL。\n\n**帕吉萨斯：** 为什么利益相关者参与是 JLL 识别可持续发展战略并围绕其制定战略的关键组成部分？\n\n**柯蒂斯：** 这是任何可持续发展努力的基本组成部分。可持续发展比其他任何职能都更需要协作——这是一个被过度使用但执行不足的术语。从根本上说，其作用是指导我们的战略制定和执行。要做到这一点，你必须获得意见和建议，进行对话，并在雄心和绩效方面自我审视。否则，你就有可能像我父亲说的那样，只是在“凝视自己的肚脐”。\n\
  \n**帕吉萨斯：** 回到你的日常工作，听起来你的角色包括像对待客户一样，为 JLL 实现自身的可持续发展目标提供内部咨询。是这样吗？\n\n**柯蒂斯：**\
  \ 这是一部分。但坦率地说，任何公司的可持续发展领导者，在某种程度上都是组织内部的顾问和布道者。对我来说，回报丰厚的是，在我任职 JLL 期间，我需要扮演内部顾问角色的要求在逐渐减少，因为我们在将可持续发展更广泛地嵌入公司方面取得了成功。我们的高级管理团队真正认识到了将可持续发展更深入地融入我们战略核心的真实价值和重要性。\n\
  \n**帕吉萨斯：** 有没有某个特定的时刻让你意识到你不再需要充当布道者了？\n\n**柯蒂斯：** 布道者的角色永远不会消失。我也不希望它消失！每个组织都需要一个倡导者。但希望它能不断发展演变。对我来说，这种进展最明显的证据来自我们的投资者关系团队。我的职责包括与我们的股东/投资者群体沟通，介绍\
  \ JLL 在可持续发展方面正在做什么，如何更好地讲述我们的故事，如何帮助投资者理解它，从而将其纳入他们对公司价值的考量中。加强这种参与的一部分工作，是在我们的季度财报电话会议中加入更多可持续发展的内容。\n\
  \n在我任职初期，我会草拟关于我们可持续发展计划、目标和正在进行活动的关键要点，然后把它们发给 IR 部门合作的同事，以便纳入潜在的内容中。但进展不大。和大多数公司一样，投资者在我们的财报电话会议上并没有提出这个话题，所以假设是他们不感兴趣。我尝试了不同的策略：“我们举办一个专注于\
  \ ESG（环境、社会和治理）的网络研讨会怎么样？”起初他们有犹豫，但他们同意试一试。当时，除了 IR、CFO 和 CEO，没有人直接与投资者交谈。所以，我必须努力说服我们的领导，让投资者听取可持续发展领导者的意见是有益的。起初，要求是让我和我的老板理查德·巴顿录制一个网络研讨会。我最初的回应是：“这种方法不会有太多对话。”这不会产生我们想要的与投资者之间的相互交流。然而，我理解他们的观点。我们以前从未与他们进行过专注于\
  \ ESG 的对话。可以理解，他们对此有些不安。所以，我们录制了一次彩排，回放观看，并加以改进，直到我们能够进行现场直播。\n\n**帕吉萨斯：** 与投资者的现场网络研讨会效果如何？\n\
  \n**柯蒂斯：** 效果不太好，因为感觉还是有点照本宣科。但我们取得了突破，人们对此持积极态度。所以，当我们建议举办第二次现场网络研讨会时，IR 的回应是：“好的，经过练习可以。”结果，对话有了显著改善，*流畅得多*，也更引人入胜。现在快进一下。IR\
  \ 定期来找我说：“好的，这些是我们想在财报电话会议上涉及的关于可持续发展的要点。我们遗漏了什么？还有别的要补充吗？”\n\n**帕吉萨斯：** 看起来 IR\
  \ 团队现在已经对 ESG 和可持续发展战略及术语感到自如，并准备好自己掌握了。多么棒的演变！这种转变花了多长时间？\n\n**柯蒂斯：** 我想说大约是一年半到两年。那是一个重大的转变。这需要时间。我们现在步调一致。我今天早上刚和\
  \ IR 的人通了电话，讨论我们的下一次网络研讨会。我们正一起策划，一定会很棒的。\n\n**帕吉萨斯：** 我们来谈谈网络研讨会另一端的那些人，也就是投资者。他们是股权投资者还是债券投资者？\n\
  \n\n\n**柯蒂斯：** 主要是股权。我们与高盛 GS SUSTAIN 团队合作。我们希望不仅能教育现有投资者，还能更进一步。我的目标之一，过去是现在仍然是，增加与现有投资者的合作、对话和透明度，并接触新投资者。如何扩大现有投资者的钱包份额？如何吸引新投资者？一般来说，当你的投资者倾向于\
  \ ESG 时，他们往往持有投资的时间会更长——尽管并不总是如此。我们战略的一部分就是获取这种长期资本。\n\n**帕吉萨斯：** 通过这次网络研讨会，您是否能够实现扩大仲量联行现有投资者钱包份额并同时吸引新投资者的双重战略？\n\
  \n**柯蒂斯：** 很难直接划等号，但我们确实看到之后有一些新投资者进来。你知道，没有任何单一事件能直接带来一个新投资者或客户。\n\n**帕吉萨斯：** 我同意。投资者教育是一项长期投资。不是“一蹴而就”的事。\n\
  \n**柯蒂斯：** 是的，没错。在网络研讨会后的三十天内，我们确实获得了几位新投资者。\n\n**帕吉萨斯：** 自投资者网络研讨会以来，还有其他对公司财务产生影响的进展吗？\n\
  \n**柯蒂斯：** 有一件比较前沿的事是，我们修订了信贷协议，将 ESG 指标纳入其中。结果，如果我们超额完成目标，就能获得优惠利率；如果未能达标，利率则不那么有利。这是我们\
  \ ESG 战略非常现实的结果。这不是一笔天文数字，但确实有意义，并且表明华尔街认可这些投资在财务上是负责任的。\n\n**帕吉萨斯：** 说到长期，仲量联行在\
  \ 2021 年宣布了到 2040 年实现净零排放的重大承诺。这个承诺的具体范围是什么？\n\n**柯蒂斯：** 用一个词来形容：*宏大*！我们的净零碳承诺极具雄心。我们同意到\
  \ 2040 年，在我们所有的运营（即范围 1 和范围 2）以及我们代表客户管理的物业（即范围 3）中，实现绝对减排 95%，且抵消比例不超过 5%。这令人生畏——特别是因为我们约\
  \ 95%的排放是基于客户的。但这是多么大的机遇啊！\n\n显然，我们的净零承诺并非凭空而来。在相当长一段时间里，我一直牵头与我们的利益相关者通话，了解他们对未来环境和社会承诺的期望。团队分享了我们的拟议目标，同时也知道这些目标可能并没有达到我们应有的雄心。最初，我们并没有设定净零目标。仿佛应要求一般，我们的利益相关者说：“如果你们的标语是‘实现远大抱负’，如果这就是你们认为的有雄心，那么，我们认为你们可以做得更好。”\n\
  \n**帕吉萨斯：** 这些利益相关者是谁？\n\n**柯蒂斯：** 利益相关者包括我们的客户、投资者、非政府组织、学术界以及其他关注组织多元化的机构。这个活动就像是在照镜子审视自己。这是我们定期与\
  \ Ceres 组织合作开展的工作。利益相关者提出了反对意见，他们说：“你们这里有很好的机会，却没有抓住。这些目标还不够好。”\n\n坦白说，即使在正式的利益相关者通话之外，我们的一些主要投资者和客户也在问我们，比如：“你们会签署净零目标吗？你们在考虑亚马逊和\
  \ Global Optimism 联合发起的《气候宣言》吗？你们打算怎么做？”他们在向我们施压，要求我们挑战极限。\n\n**帕吉萨斯：** 你们是如何回应利益相关者的批评和问题的？\n\
  \n**柯蒂斯：** 这很关键。我们回到了原点，重新做功课，找出实现净零目标的路径和成本。我们经过详细流程，确定了什么是必要的。它看起来像什么？我们如何至少带着一些具体性去实现它？我们今天能看到一条路径吗，同时知道它会不断演变？基本上，我们起草了一个商业案例，并提交给了我们的领导团队。\n\
  \n一旦获得批准，我们就让我们的目标得到了科学碳目标倡议（SBTi）的认可，这为我们 2021 年 5 月提出 2040 年净零目标奠定了基础。我们寻求 SBTi\
  \ 目标验证的决定是为了增加第三方可信度。他们不仅仅是走过场。他们审查并质疑了我们的一些假设。双方进行了一些反复沟通。说实话，我们也欢迎这种额外的审视。为你的公司设定如此雄心勃勃的目标是可怕的！我们希望尽可能多的人参与其中。我们的目标涵盖了所有范围，但在某些参数内，比如对我们范围\
  \ 3 客户排放的业务影响范围内。\n\n**帕吉萨斯：** 为什么设定一个基于科学的目标很重要？\n\n**柯蒂斯：** 基本上，如果科学是这么说的，你还能怎么做呢？最初的反应绝大多数是自豪。我们的员工在宣布时非常兴奋。但也存在一些怀疑，不是关于为什么，而是关于怎么做。\n\
  \n**帕吉萨斯：** 为什么净零目标对建筑行业和仲量联行很重要？我可以说仲量联行不拥有建筑，是它的客户拥有。\n\n**柯蒂斯：** 建筑环境约占全球温室气体排放的\
  \ 40%。我们有责任、有义务、也有意愿引领推动这种系统性变革的行动。作为一家公司，如果无所作为，你就有落后的风险。从历史上看，房地产行业相当保守。但在可持续发展和\
  \ ESG 方面，仲量联行正在突破极限。我们希望发挥领导作用。\n\n**帕吉萨斯：** 您预计仲量联行在履行净零承诺时会面临哪些挑战？\n\n**柯蒂斯：**\
  \ 我们的 2040 年净零目标规定，通过碳抵消实现的减排量不超过 5%。碳抵消是一种通过投资于自身直接活动之外的项目（如可再生能源或垃圾填埋场甲烷捕集）来减少碳排放的方式。\n\
  \n这意味着我们将在范围 1、2 和 3 内减排 95%的排放，这是非常有雄心的。其中不包括我们代表客户采购的产品。不超过 5%的抵消比例增加了我们的挑战，但我们对此承诺不变。\n\
  \n我们集体强烈认为这不能只是一句声明。未来五年环境、经济和技术具体会发生什么，存在足够多的不确定性。但我们希望今天就承诺一个可信的目标，并且有相应的计划支撑。\n\
  \n**帕吉萨斯：** 谁负责实现净零的计划？\n\n**柯蒂斯：** 这绝对会由整个业务部门共同负责。我们希望它无处不在，这样不同的职能部门都能看到自己在推动实现目标中的作用。因为这不仅关乎我们对自己的办公空间做什么。也关乎我们对客户做什么。还关乎我们对供应链做什么。它触及组织和价值链的所有方面。\n\
  \n**帕吉萨斯：** 假设我是仲量联行的客户，辛西娅，我对设定净零目标非常犹豫。但我所有的客户都告诉我必须设定一个净零目标。设定净零目标的关键原因是什么？\n\
  \n\n\n**柯蒂斯：** 除了从窗外日益增多的证据中看到世界正在变化，如今，当下的核心在于风险与机遇。我们在`TCFD`报告中深入分析了这一点，评估了气候变化对我们业务的潜在影响。过去，企业规划、预测和衡量的方式，都建立在气候将保持稳定且高度可预测的认知之上。但如今情况已不再如此。精算表格已不像过去那样有用了。\n\
  \n我认为设定净零目标是一个优秀的、经典的企业风险管理范例。在评估风险时，你会考虑最佳情况、最差情况和最可能情况。你会将这种风险观点融入到你的规划和投资中。而且这不仅仅是气候问题。监管框架也在发挥作用。提前布局，或至少为这种必然性做好准备，是明智之举。\n\
  \n此外还有人才保留和吸引。我不在乎你的业务是什么。很少有组织不需要聪明、有才华的人才。为了激励和团结员工队伍，你还需要给人们一些有抱负的目标。你需要展示出，除了季度利润之外，还有更重要的东西，这正是良好企业可持续发展战略的重要组成部分。“为什么”要这样做？因为这是明智且有益的商业行为。这听起来有点简单，但在我看来，这是基础。\n\
  \n**帕吉萨斯：** 作为你虚构的客户，辛西娅，我仍然犹豫不决。我的公司过去一百年来一直在做同样的事情。当我继续权衡是否设定净零目标时，你建议我需要注意哪些风险？\n\
  \n**柯蒂斯：** 坦率地说，存在不采取行动的风险。非常现实的风险是，如果你选择不采取这些措施，你的资产价值将会降低。这就是我们所谓的“棕色折扣”。在最坏的情况下，你可能会面临搁浅资产。在`JLL`，我们研究了商业地产的入住率和租金率。我们将这些数据与资产所有者在物业可持续发展和绿化方面采取的行动相关联。证据表明，随着时间的推移，这些资产更具价值。这是等式的一方面。\n\
  \n**帕吉萨斯：** 实现净零目标难道不会让我虚构的公司花费大量资金吗？\n\n**柯蒂斯：** 不一定。如果方法得当，它实际上会提高短期运营效率和资产的长期价值。这就是我们在`JLL`所说的“可持续回报”——不仅是价值创造，也是价值保留。\n\
  \n例如，一些投资可以立即获得回报。其中之一是`Turntide`，这是一种由`JLL`投资的一家科技公司设计的创新电机。他们将他们的电机称为“电机界的`LED`灯”。电机本身并不吸引人，但它们遍布于建筑之中。你只需将荧光灯泡换成`LED`灯泡，立即就能获得正向的财务回报。这项新技术也是如此——你能立即获得回报。越来越多的选择不一定意味着可持续运营会是一项或一系列更昂贵的行为。\n\
  \n虽然并非所有答案都已存在，但看到一些源自企业积极呼吁“我们必须将公司排放降至零。我们将如何做到？我们需要帮助。”而涌现出的创新，确实令人振奋。投入到这些新创新中的投资、创造力和智慧令人激动。这就是机遇所在，抓住正在被创造的新市场。而且我必须说，这让我看到了希望。\n\
  \n**帕吉萨斯：** 如果我作为这个不愿改变的客户，进一步挑战你说：“现行法规并未要求我汇报公司的`ESG`、可持续性或温室气体绩效。这是我公司不做出改变、不承诺减排的另一个理由。”那怎么办？\n\
  \n**柯蒂斯：** 一年前我可能不会这么说，但监管即将来临。它们不是远在天边，而是近在咫尺。`SEC`目前正在美国起草相关法规。它们在英国和欧洲部分地区已经存在。你不想被打个措手不及。你应该做的是帮助塑造这些法规可能的样子。最糟糕的处境莫过于法规突然降临到你头上，而你的组织却没有任何准备去应对和吸收它们。\n\
  \n碳定价是必然趋势。无论价格如何，它都会发生。我认为你很少能如此笃定，但这确实会发生。处理任何形式的碳定价的最佳方式就是减少自身的碳排放。再回到你的企业风险管理方法上来，你如何最好地应对这一点？那就是从你的产品中、从你的业务中消除这个风险。\n\
  \n**帕吉萨斯：** 谢谢你，辛西娅，向你虚构的客户解释实现净零目标的价值主张。你说服了我！在与真实客户的对话中，你看到了同样的转变吗？\n\n**柯蒂斯：**\
  \ 完全如此。这现在已成为每次客户对话的一部分，并且是优先事项清单上的重要一项。人们越来越认识到可持续发展与商业成功之间的相关性。在这些对话中，你不再是费力地推石上山，而是在推开一扇本就敞开的门。\n\
  \n\n\n### 23. 史蒂夫·韦古德\n\n英杰华投资集团首席责任投资官\n\n`史蒂夫·韦古德博士`是`英杰华投资集团`的首席责任投资官。`英杰华集团`是一家英国跨国保险公司，截至\
  \ 2022 年 1 月，拥有超过 3300 万客户，管理资产约 3000 亿美元。史蒂夫于 2006 年加入英杰华，创立了其全球责任投资部门及可持续金融卓越中心。\n\
  \n史蒂夫的职业生涯始于 1995 年，在**世界自然基金会英国分会**工作，负责其道德与环境投资政策。随后，他曾为三家买方基金管理公司服务。他曾就创建可持续资本市场向英国政府、欧盟委员会、金融稳定委员会及联合国提供咨询。目前，他还在世界自然基金会英国分会董事会担任受托人。\n\
  \n史蒂夫积极参与国际标准制定和治理机构工作。他是**企业人权基准**、**世界基准联盟**以及**联合国可持续证券交易所倡议**的联合创始人。史蒂夫同时也是金融稳定委员会气候相关财务信息披露工作组（`TCFD`）的成员。\n\
  \n史蒂夫曾获得伦敦金融城颁发的**可持续发展领导力奖**以及英国商会的奖项。他还获得过**布鲁梅尔**、**国际商会**、**伦敦金融城**、**联合国基金会**、**耶鲁大学**和**哈佛大学**的奖项。2018\
  \ 年，他被《`金融时报`》评为资产管理界应对气候变化的先锋人物之一。\n\n**克里萨·帕吉萨斯：** 我们首先从英杰华的服务范围及其为众多个人所扮演的角色谈起。\n\
  \n**史蒂夫·韦古德：** 英杰华是一家全球性保险公司，为横跨 16 个国家的超过 3300 万客户提供人寿及一般保险服务。在英国，英杰华是领先的人寿与养老金提供商，拥有超过\
  \ 1800 万养老金客户。其资产管理业务称为英杰华投资集团。作为投资者，我们致力于将环境、社会和治理（`ESG`）议题融入我们的投资理念。`ESG`也是我们商业战略的核心，同时我们亦关注提升客户体验和简化流程。我们的使命是为当今投资者交付最关键的成果。\n\
  \n对我们而言，负责任投资并非一时风尚，而是核心投资信念。作为资本的积极管理者，我们的规模和影响力有助于推动必要的变革，以构建一个客户能够并愿意在此安享晚年的未来。\n\
  \n**帕吉萨斯：** 你在英杰华投资集团的职责范围是什么？\n\n**韦古德：** 作为首席责任投资官，我负责就整体`ESG`战略与方法向首席执行官和董事会提供建议。同时，我也领导我们的宏观引导工作，我将此定义为与政府、监管机构、政策制定者乃至`NGO`（非政府组织）就重大市场失灵问题进行系统性接触，以推动采取具体措施予以纠正。我相信，在推动应对社会重大议题（从气候变化到多元化，从环境退化到人权）方面，投资者可以发挥关键作用。通过负责任地投资，包括在微观层面与企业互动，在宏观层面与政府及监管机构互动，我们能够助力实现包容性经济增长、环境保护和社会发展。其中，社会发展是我个人特别关注的焦点。\n\
  \n**帕吉萨斯：** 在你的职业生涯中，是否有某个关键时刻影响了您对可持续金融和资本市场作用的看法？\n\n**韦古德：** 影响我方法的时刻有很多。我每天都在见证金钱所能带来的益处，这既令人着迷又鼓舞人心。除了将资本投资于为全球问题提供解决方案的公司外，我还亲身参与了利用股权所有权中的法律和经济影响力，阻止企业生产集束弹药、从世界遗产地开采化石燃料，或在印度挖掘原住民部落墓地以开采矿产等活动。\n\
  \n但最重要的时刻之一是在 2006 年，**乔纳森·波里特**要求我从系统角度审视问题。他邀请我在剑桥大学可持续发展领导力学院（`CISL`）的一个课程上做演讲。他给我的挑战是，尝试涵盖资本市场的整体结构，突出它们如何破坏可持续发展，然后指出能够支持可持续发展的系统变革。这是一项极其艰巨的挑战——尤其是在\
  \ 90 分钟内讲完这些内容。但这最终变成了一次绝对引人入胜的实践。\n\n自 2006 年以来，我每年都会在`CISL`举办这个研讨会，这让我有机会运用博士研究及基金管理实践中获得的经验教训，同时持续向课程学员学习。这启发我撰写了英杰华的《*可持续资本市场路线图*》，并于\
  \ 2012 年提交给联合国。随后，大约从 2014 年起，该路线图融入了我们在欧盟倡导的可持续资本市场联盟工作中。这直接促成了 2015 年欧盟可持续金融高级别专家组的成立。由此产生的欧盟可持续金融行动计划改变了整个欧洲可持续金融的结构，并正在影响世界其他地区。我可以将当今全球可持续金融政策框架的某些要素，追溯至乔纳森在十六年前首次向我提出的那些极具挑战性的问题。\n\
  \n**帕吉萨斯：** 这是一个很好的过渡点，可以讨论企业在全球运营的框架。影响公司运营方式的杠杆有哪些？\n\n**韦古德：** 世界上绝大多数经济体都可以被描述为资本主义经济。经济增长模式聚焦于`GDP`（国内生产总值）的增长，尽管`GDP`的构建者**西蒙·库兹涅茨**曾表示它根本不应成为政策关注的焦点，更不用说作为唯一的焦点。`GDP`增长驱动着世界上每一个资本主义体系，可能也驱动着其他体系。正是金钱支撑着这种增长。\n\
  \n金钱既带来机遇，也带来义务。特别是在大多数英美公司法的股权投行资中，你拥有公司，你是委托人。因此，公司是你的代理人。他们为你工作。如果你清楚自己拥有什么，并且能够作为长期所有者独立行事，你就可以对那些践行良好长期可持续商业实践的好公司表达支持。如果你愿意，你可以出席年度股东大会（`AGM`），参与公司的“议会”。这是一种选择，也是一个机会。我认为这是一种义务，因为那些理解在短期主义盛行的市场中经营上市企业何其艰难的人知道，这些企业的领导者同样需要来自投资者的支持发声。这就是投资者所承担的义务。对于那些根本不听取意见的公司，则需要投资者进行更严格的审视。\n\
  \n**帕吉萨斯：** 像英杰华这样的大型机构股东，究竟能在多大程度上影响公司的商业战略？\n\n\n**Waygood:** 按照商业原则，在公司法最初制定时，股东被置于公司法的核心，他们是企业的主要监管者。人们普遍认为，股东都应该知道自己拥有什么。在美国，人们更常知道自己养老金或`401(k)`账户里有什么。但在美国以外，情况并非如此。我们在英国的一千八百万客户中，大多数人都不知道他们的养老金如何运作、投资于何处，也不知道他们的投票在公司年度股东大会上是如何被使用的。\n\
  \n我们并非生活在股东民主之中，无论别人多少次告诉你我们是。我们不是。真正的股东，即最终受益人，往往甚至不懂金融，更不用说知道自己是股东，或理解如何在他们拥有的公司议会中行使民主控制权。大多数人根本不知道有年度股东大会或公司议会。问题在于，这在大多数国家的教育体系中并未涉及。\n\
  \n存在一条资本供应链——从作为个人的你开始，经过你的受托人、他们聘请的投资顾问、买方基金经理、证券交易所，最后到达投资银行。只有当它到达投资银行时，才开始接近那家将你的资金用于塑造你期望退休后所面对的未来的公司，为你创造已用资本回报率并支付股息。然后，希望通过股价回报，公司也可能为你给予他们的贷款支付利息，这被称为*公司债券*。之后，资金回流给你，但作为股东，你理应表现得像个所有者。\n\
  \n事实上，绝大多数人不知道基金经理如何在公司问题上使用他们的投票权。想象一下，如果我们的实际民主进程也这样运作，我们把自己的投票权外包给其他人，却完全不知道他们如何使用，那会是什么样子。这将导致一个为少数人利益服务、深度不公的经济。\n\
  \n**Pagitsas:** 现有金融生态系统中的另一个挑战是什么？\n\n**Waygood:** 这个体系是短视的。极度短视。正如《金融时报》*道德金钱*新闻通讯的编辑吉莲·邰蒂不久前所说，这个体系更关注下一个季度，而非下一个四分之一个世纪。正因如此，我们需要与这个体系互动，理解它的结构以及它如何破坏可持续增长。然后，我们需要重新设计和思考它，使其支持可持续增长。否则，就像我十一岁的女儿两个月前对我说的：“钱正在摧毁钱。对吗，爸爸？”这正是正在发生的事情。我真希望我在她那么小的时候就能如此清晰地表达这一点。\n\
  \n**Pagitsas:** 如果我们不解决这些挑战，会发生什么？\n\n**Waygood:** 我们当前的经济增长模式很可能会摧毁我们所知的文明。不是地球上的生命，不是人类，也不是人性，但我相信，与气候变化相关的物理风险将在未来几十年开始侵蚀我们所知的文明。与气候变化相关的极端物理风险的潜在可能，可能会摧毁我们所知的文明。钱正在摧毁钱。我们需要利用金钱，使其支持长期可持续增长，而不是破坏后代子孙的增长机会。可持续发展的本意是“满足当前的需求，同时不损害后代满足其需求的能力”。当然，当前的市场结构与此恰恰相反——实际上是背道而驰的。\n\
  \n**Pagitsas:** 鉴于这种前景，上市公司的管理者们承受着怎样的压力？\n\n**Waygood:** 上市企业的领导者们感到持续承受着来自市场短视和短期主义的压力，并觉得无法像他们希望的那样在品牌、培训、士气和长期激励上进行足够投资，因为改善季度业绩的最简单方法之一就是削减那些当下有成本、但通常要等十八到三十六个月后才能产生无形回报的长期投资。\n\
  \n这种模式已广为人知，导致许多人在将其公司公开上市前会深思熟虑。目前的市场确实如此运作。然而，这不支持长期的价值创造。这不符合公司的最佳利益。可以说，它也与正确理解的长期受托责任不一致。然而，最大的所有者们却如此运作，因为他们自身也面临着向客户交付成果的压力。\n\
  \n与首席执行官会面的基金经理们，承受着来自养老金计划和其他大型资产所有者的压力，要求他们在下一季度交出漂亮的股价表现。对他们的首席执行官来说，压力可能更大。这不仅仅是交出在季度表上好看的数字。你还必须让市场其他部分也做出回应，并且让你选择的公司表现优于同行。\n\
  \n世界上很少有职业能让你每时每刻都看到自己与所有同行的表现对比。基金管理就是其中之一。它会滋生短期主义，因为在这样的环境中管理资金可能非常、非常、非常困难。压力极大。\n\
  \n**Pagitsas:** 关注被认为是财务表现核心指标的季度股价，是如何导致短期主义的？这与证券交易所在可持续金融对话中的角色有关联吗？\n\n**Waygood:**\
  \ 那种每分每秒追踪业绩和利润的疯狂节奏，可能导致各种意想不到的后果。如果写了《国富论》并创造了“看不见的手”一词的经济学家亚当·斯密能看到今天的市场，我相信他一定会对自己名义下造成的如此多破坏而暴跳如雷。\n\
  \n**Pagitsas:** 他没有预见到今天商业的速度。\n\n**Waygood:** 不，他没有。证券交易所曾经是政府机构。它们具有准监管性质。它们维护市场质量。如果你来交易所，你知道这家公司总是拥有特定地位，并以某种方式受到治理。在过去的五十年里，世界上大多数最大的上市场所和证券交易所都变成了营利性机构。它们自己上市了，并迫使高管专注于总股东回报或每股收益。\n\
  \n交易所通过多种方式赚钱，但始终是通过股票交易。如果你是交易所的高管，并且希望明年奖金最大化，那么高频交易对你非常有利。高频交易绝对飙升了，同时我们也看到了短期交易行为的巨大增长。其中许多是由算法驱动的。它们甚至不理解公司做什么，代码代表什么。它们甚至不需要了解公司的基本面。\n\
  \n我们已经把原本具有准监管性质的机构，变成了一台制造短期主义的机器。我们这些关心未来五年、十年、二十年的长期创新、研发和公司业绩，并理解可持续性如何与之交织的人，看到当前大多数商业模式的结构正在削弱公司创造价值的能力——这不仅是为了子孙后代，也是为了当前和未来的股东。\n\
  \n\n\n#### 算法交易与高频交易如何影响可持续性？\n\n算法交易和高频交易都对可持续性不利，然而大多数政府却允许它们泛滥，理由是这能为市场注入更多流动性。我不确定流动性是否应该被奉为神明。我认为，流动性之所以被神化，是那些既得利益者在推动，他们让大众普遍认为流动性是好事，因此越多越好，无论代价如何。\n\
  \n**Pagitsas：** 为什么资本市场需要参与讨论可持续金融？\n\n**Waygood：** 可持续运动应该面对的最大问题是：如何利用市场来实现联合国可持续发展目标（`SDGs`），特别是《巴黎协定》？我之所以特别提到《巴黎协定》，是因为如果它不能实现，将会削弱所有其他\
  \ `SDGs` 的积极影响，最终可能导致经济倒退并抹去大量财富。极端情况下，它可能使金钱失去意义，因为它不再能作为价值储存手段或交换媒介。\n\n如何利用市场来实现这些重要条约，是一个尚未得到妥善解决的问题。其衍生问题包括：金融机构的角色是什么？公司在这方面的作用是什么？毕竟，这个系统当初从未被设计来应对这些问题。\n\
  \n**Pagitsas：** 在审查英杰华投资（`Aviva`）当前的《负责任投资政策》时，其中写道：“我们（通过我们的资产管理人）应积极对我们所投资的公司施加影响，以改善其环境、社会和治理（`ESG`）方面的可持续表现。”鉴于您概述的挑战，英杰华投资如何作为积极参与者并施加影响来解决\
  \ `ESG` 问题？\n\n**Waygood：** 首先需要明确一点，仅仅与个别公司接触是无法改变行业和体系的。你必须与那些构建行业和体系、创造运营环境的人接触。这是我在可持续金融领域二十五年中得出的最重要结论。\n\
  \n然而，与个别公司的积极接触仍然极其重要。我们不讳言，我们是规模庞大、长期主动的证券所有者。我们与被动投资者不同，尽管我们理解被动投资策略，因为我们的大多数客户也采用这种策略。我们认为积极施加影响包含几个要素。首先，成为主动所有者意味着了解业务的基本面和战略，并积极寻求理解公司为创造股东价值所做的努力。这意味着要了解其商业模式，评估董事会的素质以及当选董事的个人能力，并知道在年度股东大会上是否支持他们的选举或连任。\n\
  \n我们将投票视为一项资产，而不仅仅是一项义务。我们愿意为拥有投票权的股票多付一点钱，这是有充分理由的。这样你就能对公司未来的战略施加影响。我希望以积极和支持的方式做到这一点，确保那些领导公司实现长期增长和可持续增长的高管能够感受到股东的支持。\n\
  \n主动所有权不仅仅是对落后企业施加影响并挑战他们做得更好，还包括支持领先者。主动所有权和主动影响承认存在一种伙伴关系，我们代表企业所有者（即受益所有人）的利益。我们是他们的代理人。根据公司法，董事会及其主要高管是为我们的客户服务的。\n\
  \n我们知道，我们被视为企业的主要监管者，所有投资者都是如此。我们非常认真地对待这份工作，因为投资者做得越好，全球市场就越能为所有人服务，而不仅仅是少数人。可持续的长期增长意味着照顾好员工，确保客户、社区和环境不被剥削，确保董事会遵守良好的治理实践，并符合政府法规、标准、条例等。长期所有权意味着，如果一家公司的商业模式系统性地剥削任何利益相关者以创造价值，就要提出关切。\n\
  \n当我们积极行动时，我们既支持良好做法，也同样积极挑战不良做法。我们会投票反对表现不佳的董事会成员连任，我们会投票反对过高的薪酬结构，我们还会投票反对表现不佳的管理层。我们可能会将问题升级到董事会主席。显然，不同市场的运作方式不同，并非每次年度股东大会都能进行投票。然而，作为全球所有者和投资者，通过积极施加影响，我们将主动投资的原则与对成为积极和支持性所有者的理解结合起来。\n\
  \n**Pagitsas：** 有没有最近的例子能体现英杰华投资的投票方式？结果如何？\n\n**Waygood：** 过去二十年左右，我一直参与英杰华投资的投票记录。在那段时间里，埃克森美孚（`Exxon`）几乎每年都会收到至少一份股东提案。这些提案涉及气候变化、人权、员工劳动标准等问题。在\
  \ 2021 年埃克森美孚的年度股东大会上，有一系列关键的决议。我对这些决议取得的结果感到非常满意。\n\n在气候变化问题上，英杰华投资几乎在每一次机会中都投票支持这些决议，并投票反对埃克森美孚董事会。我们为自己在其中发挥了一点微小作用而促成的结果感到自豪。这些结果包括：增加了两位专注于加速石油和天然气行业向低碳经济转型的新董事会成员；要求披露埃克森美孚的游说活动和支出；并说明其游说活动是否以及如何与《巴黎协定》保持一致。\n\
  \n需要牢记的是，要达到我们目前的地步——即埃克森美孚决议的投票率如此之高，投资者赢得了新的董事会席位并驱逐了董事会成员等——这花了多年时间。近二十年来，我们一直采取投票行动，要么反对首席执行官连任，要么反对薪酬结构。我们支持了绝大多数股东决议。这种情况并不常见，肯定不会出现在任何大型美国被动基金管理公司的记录中。\n\
  \n幸运的是，许多基金管理公司现在最近意识到他们需要利用好自己的投票权，因为他们正面临越来越大的压力要求这样做。一些规模最大的公司也意识到，公开透明地这样做会更好。他们的记录表明，他们在许多这些问题上的立场已经转变。我们的立场始终是：我们必须确保每家公司的文化具有可持续性，并且整个企业中的员工都着眼于长期增长。\n\
  \n**Pagitsas：** 英杰华投资不仅对公司进行股权投资，还投资于实物资产，如建筑、海上风力涡轮机和铁路。例如，当英杰华投资被邀请投资一条石油管道时，会如何回应？是直接拒绝（*no*），还是会有一些评估？\n\
  \n\n\n**韦古德：** 这无疑是一种深思熟虑的方法。它具有分析性，我相信您也会期待我这么说。有少数几个基金对某些活动持相当强硬的态度。例如，出于宗教原因，他们永远不会持有某项特定的投资。除了这些基金之外，我们会对所有投资进行仔细和深入的考量。我们有指导方针，但排除项寥寥无几。不过，我们与煤炭行业并不亲近。这是排除项中的一个例外。\n\
  \n我们提出的最重要的问题之一是：“这项投资会成为搁浅资产吗？” 要么是字面上的，因为实体房地产或周边区域将被淹没；要么是比喻意义上的，因为它不再被使用，也无法产生预期能够覆盖其投资时间跨期的现金流。因此，该资产的\
  \ `DCF` [贴现现金流] 在当前价值上也是错误的。\n\n我们还会审视政治风险。这条管道两端所在的国家，在未来十五到二十年内，有多大可能保持稳定并持续产生现金流？这既是一个分析性问题，也是一个与人权相关的问题。\n\
  \n关于我们如何评估气候风险，我们公司内部有对气候科学有深入理解的员工。作为一家保险公司，我们拥有一支庞大的精算师团队，他们能为我们提供关于历史假设可能如何变化的见解。同时，我们也会观察我们投资的不同行业，并判断哪些行业会比其它行业面临更大的转型风险。\n\
  \n特别是，气候风险是不对称的。你面临着转型过快和转型不够快的风险。前者被称为*转型风险*，后者被称为*物理风险*。气候风险之所以不对称，是因为物理风险要远远、远远、远远大得多。正如我之前提到的，物理风险可能对“文明”构成挑战，但也可能导致整个行业的消亡，保险业也在其中。在这个不对称的转型分析之上，你还面临着时间因素。如果我们不改变那种会导致地球很快升温至少三摄氏度的经济增长模式，那么与本世纪最后几十年的物理混乱相比，未来几十年的情况似乎还相对温和。如果政策制定者只关注到\
  \ 2050 年这段时间，他们将完全错过未来更严峻的挑战。如果不加以应对，物理风险会随着时间的推移呈指数级恶化。\n\n**帕吉萨斯：** 多种时间跨度的并存是一个挑战，可持续发展领导者必须应对这一挑战，因为如此多的时间跨度与每一个可持续发展目标相互交织。\n\
  \n**韦古德：** 投资时间跨度、估值时间跨度和商业周期是不同的。同样，它们也与政治周期不同，而政治周期当然又与地质时间框架不同。当你谈论气候变化时，它就不再仅仅是地质学意义上的了。它今天正发生在我们身边。\n\
  \n你谈论的还有理论上的时间框架。你谈论的是十年尺度的转变，我们可能还有五到十年的时间来阻止它。但你在将那个时间维度叠加到政治风险、政治时间跨度和商业估值跨度之上。换句话说，就是我们评估一项商业的现金流，并为其赋值的时间长度。我认为，这就是我们气候议题所指的“时间视野的悲剧”。这些时间跨度各不相同。我们处理气候危机的窗口期如此之短，这尤其可悲。\n\
  \n可悲之处在于，监管者、政治家和公司领导人无法从几十年的时间尺度去思考，并将此作为他们当下最关注的重点，然而它本应如此。这就是悲剧，但这还没有结束。故事尚未完结。它或许不会以悲剧收场。它并非注定如此。\n\
  \n**帕吉萨斯：** 我希望这个故事对你我的孩子来说都还没有结束。\n\n**韦古德：** 确实如此。我们该如何将其转变为某种划时代的、积极的成果呢？嗯，融资方式在过去十五年左右的时间里已经发生了变化。联合国创立了\
  \ `PRI` [负责任投资原则]，我很自豪能成为其咨询小组的一员。数百人参与了它的创立。当时，这群人认为金融可以被引导来做有益的事情。他们是对的，`PRI`\
  \ 已经成为指导融资策略的成功框架。\n\n如今，`ESG` 绝对是大热门。这意义重大，因为创建 `PRI` 的人是正确的，他们调动了大量的机构需求，要求更耐心的所有权和更长期的投票权。现在许多公司都会收到来自一些分析师的\
  \ `ESG` 相关问题，因为 `PRI` 改变了市场。然而，这还不够。要支持那些希望在整个商业周期、甚至是多个商业周期内创造可持续增长的首席执行官们，这远远不够。尤其是在涉及体系变革时，更是远远不够。最重要的是，这不足以纠正市场失灵。\n\
  \n**帕吉萨斯：** 金融机构能否有意义地参与并引导这种体系变革？\n\n**韦古德：** *尽责管理* 这个词被广泛使用，每个投资者都说他们会成为一个好的管理人。然而，很少有人能告诉你这在政府债券的语境下意味着什么。但对于大型机构投资者来说，包括我们自己在内，政府债券是我们资金最终流入的最大资产类别。当我们购买政府债券时，理论上，我们是作为股东拥有这个国家。显然，我们并不拥有这个国家，也不应该拥有。你在该体系中并没有投票权。这不是一种民主工具。\n\
  \n当金融机构或公司参与政治进程时，会出现民主、外交、问责和透明度等问题。然而，基于一系列原因，这种参与是正当的。其中很重要的一点是，政策制定者本身就寻求这种参与，因为他们通常不了解金融部门和整体市场。这也是正当的，因为最终的政策决定是由他们做出的。此外，寻求促进更可持续的成果，也符合我们客户的长期个人和财务利益。\n\
  \n我觉得奇怪的是，那种鼓励通过政府政策纠正市场失灵而进行的“宏观-尽责管理”，常常被视为潜在负面的。我认为这是由于问责制和透明度的问题。通过宏观-尽责管理，我相信我们是在试图告知或参与一场辩论，讨论政府如何利用市场来实现\
  \ `SDG` [可持续发展目标]，以及如何通过新的财政干预形式、像硫和碳交易计划这样的市场机制，以及针对终端消费者的监管和透明度措施，将这些外部性内部化。我们可以利用这些机制来确保资本主义具有创新性，并促进长期增长。\n\
  \n这些市场纠正措施需要从可持续经济价值创造的角度来看待。这无关自由市场不受约束地运行，而且实际上也从来不是这样。如果你读一下 [米尔顿]·弗里德曼，他在其经典文章[《企业的社会责任是增加其利润》]中谈到董事会成员应遵守普遍接受的商业行为准则。完全有可能看出他所说的贯穿始终的道德规范是什么意思。\n\
  \n\n\n如果你想做正确的事，但作为一个体系，做错误的事回报更高，这就是市场失灵。这被定义为不受约束的市场导致社会次优结果。在这种情况下，这意味着那些构建市场的人——政府及其政策制定者——需要重新调整激励措施，使利润动机与大量可持续增长保持一致。自由市场无法做到这一点，至少无法达到我们需要的规模。你只有一个地球的资源，但你正朝着需要五个地球才能维持我们在西欧和北美所享有的生活质量的方向发展。我们不能简单地期望离开这里并找到另外四个星球。\n\
  \n我们需要重新调整市场，使其保持在我们现有生态系统的承载能力范围内。这方面的外交和技术挑战在于，要确保发展中国家能够享受到与我们相同的生活水平。\n\n**帕吉萨斯：**\
  \ 您认为联合国气候变化框架公约（UNFCCC）缔约方会议（COP）确实是帮助我们引入所需结构的合适工具吗？\n\n**韦古德：** 关于这个问题可以写出好几本书。（笑）然而，联合国是我们拥有的最佳论坛。它被批评为清谈馆，但它当初设立的目的就是如此。其共识驱动的治理结构可能严重功能失调。要让一份文件至少在里约进程、《生物多样性公约》（CBD）、《京都框架》、UNFCCC\
  \ 和《蒙特利尔议定书》中获得通过，你必须让 196 个成员国达成共识。由于它是如此强调共识驱动，这些条约的治理结构已经固化了国际社会迅速实施大规模应对的可能性。\n\
  \n然而，它确实是我们拥有的最佳论坛。虽然它并非为追求速度而设，但它是为包容和负责而设的。也许这是我们能够以一定速度进行大规模转型，并兼顾由此产生的许多人权和正义考量的唯一途径。从市场的角度来看，我们需要认识到的一点是，外交部门官员、外交部长，偶尔还有国家元首会出席联合国大会。但财政部长或央行行长通常不参会，尽管这种情况已经开始改变。马克·卡尼令人瞩目地引领了这一变革。他促使许多央行、金融稳定委员会、世界银行集团以及国际金融架构内的其他各种论坛采取了更多行动。\n\
  \n**帕吉萨斯：** 您将如何改变金融机构在其中发挥作用的结构，以更好地应对气候变化？\n\n**韦古德：** 2021 年是 G7 和 G20 首次由 COP\
  \ 的两个共同主办国同时主办。最接近的一次是在 1998 年，当时德国主办了其中一些会议。我们需要定期实现地缘政治上的协调，比如说每三到五年一次，在所有被称为“大棘轮会议”的场合这样做，因为《巴黎协定》具有内在的棘轮效应。理想情况下，COP\
  \ 的两个共同主办国确保 G7 和 G20 授权诸如国际组织安全专员、国际会计准则理事会、国际货币基金组织、世界银行以及所有其他属于国际金融架构的多边组织，为帮助资助《巴黎协定》负责。《巴黎协定》是一项政治条约，而非市场现实。你不能通过政治条约来管理市场。\n\
  \n**帕吉萨斯：** 在这种理想结构中，金融机构的角色是什么？如果这种结构未能实施，会发生什么？\n\n**韦古德：** 每个央行和每个财政部都需要改变其体系（即本国）内的激励措施，使得在企业层面上做正确的事能够降低资本成本，而不是增加资本成本。这意味着你需要财政措施，需要市场机制，需要一整套市场修正，因为气候变化是世界上最严重的市场失灵。它很可能最终导致整个市场的毁灭。正如我所说，它可能导致文明崩溃。\n\
  \n我们需要利用市场及其生产潜力，包括它们能够驱动的研发能力。我们拥有足够的资金，但当前所需的创新并非政治性的，不是外交部门的事，也不在科学领域。我们已经有了政治协议，科学问题也很明确。我们现在需要的创新是在市场领域，这意味着这不再是\
  \ UNFCCC 的事，而是 G7、G20 以及所有推动金融架构的多边进程的事。这就是为什么我认为现在联合国不是将气候融资对话推向成功的正确场所。它没有足够强大的金融授权。\n\
  \n联合国里并非由理解市场或金融的人聚集，尤其是在这方面。当然，我必须明确指出，有少数几位值得尊敬的人士了解情况，但这并非普遍现象。平心而论，在政策领域很难找到理解市场的人。我认为没有哪个人能完全理解整个金融体系。没有哪个单独的个人。它实在太庞大了，就像试图在脑海中把握无限一样。许多金融专家对其中的一部分有相当深入的了解，但没有人能理解全部。\n\
  \n**帕吉萨斯：** 如果不是联合国，那该是哪里？您提到了 G20、G7。它们会接过这一重任吗，还是我们在等待某个新实体的出现？\n\n**韦古德：** 会，而且会。虽然几年前，G20\
  \ 绿色金融研究小组被特朗普领导下的美国扼杀了，但它已经以 G20 可持续金融工作小组的形式重生。那里有潜力，而且对 G20 来说也是如此。你可能会想，“太好了，希望来了。”这是一个工作小组，而不是研究小组，这意味着它可以提出政策建议。太好了。然后你再从另一个角度来看，G20\
  \ 还有另外四十个围绕其运作的工作小组。这意味着这个工作小组的旅程才刚刚开始，绝未结束。是的，G20 会承担起责任。然而，从长远来看，是否需要创建新的机构？是的。但我也认为它需要重新定位整个国际金融架构的用途。\n\
  \n**帕吉萨斯：** 过去是否有过某个机构进行重大重组工作的例子？\n\n**韦古德：** 例如，经合组织（OECD）最初就是为了在二战后重建欧洲而设立的。显然它现在已经完成了这个任务。我们难道不应该思考一下经合组织在这个新世纪最大的挑战——气候变化——中的作用吗？它是世界上最大、资源最丰富的智库，工作人员都是经济学家，其中许多人了解气候变化。我们难道不应该考虑让经合组织负责《巴黎协定》第\
  \ 2.1c 条，并帮助调动市场资金和提供金融建议吗？它是一个富裕国家的俱乐部，但这对于需要知道如何获得资金的发展中国家来说，可能是一个机会。\n\n重新定位经合组织的用途，并非认为让资金从发达市场流出就是好事，而是因为我们需要确保对气候解决方案的投资能够获得资金和碳减排方面的最高回报。而这必然涉及到增加对发展中国家的投资。\n\
  \n\n\n**帕吉萨斯：** 从大型机构下沉到个人层面，个人应如何与 CEO 及其他非可持续发展管理层领导互动，以将可持续发展融入其业务？\n\n**韦古德：**\
  \ 我认为，要赢得许多 CEO 的心和支持，我们需要构建商业理由。这包括短期、中期和长期三种理由。短期理由围绕品牌建设。中期理由涉及拥有一个健康且生态高效的组织，能以最低成本获得最高回报。然后是长期存在性理由——也是我在此最常强调的。在这三种理由中，长期商业理由极具战略性且可能引发问题。让你的企业立于道德高地是具有挑战性的。确保你顺应变革潮流，是企业创造价值的一部分。\n\
  \n**帕吉萨斯：** 在关于系统性变革、与监管机构互动以及国际框架的对话中，首席可持续发展官们如何在企业内部实现环境和社会目标的同时，保持自身可持续发展的动力？\n\
  \n**韦古德：** 首席可持续发展官们必须在保持个人可持续发展的同时，对可持续发展问题保持关注和愤怒，而不要因为每天都读到相关问题而变得麻木。你几乎每周都会了解到令人震惊的灾难性新情况。在长达数十年的职业生涯中，致力于解决这些问题而不倦怠、不感到不堪重负，这才是最关键的可持续发展挑战。我们必须保持自身可持续性，这样才能确保我们真正实现临界质量。\n\
  \n**帕吉萨斯：** 在朝向一个积极未来——这个未来有时似乎渐行渐远——的常感严峻的征程中，你会给他人哪些建议以维持自身动力？\n\n**韦古德：** 关于这方面的多个层面，有很多书都写过。一个经典参考是*《高效能人士的七个习惯》*[史蒂芬·R·柯维著（西蒙与舒斯特出版社，1989\
  \ 年）]，其中谈到了不断“磨利锯子”的必要性。正如柯维所说，这不仅是身体健康的挑战，也是心理健康的挑战。我认为，在可持续发展领域，心理健康挑战最为艰巨。当你共情于子孙后代，当你共情于其他国家的人民，看到他们正在遭受的一切，这会导致存在性焦虑。毫无疑问，这会导致深深的焦虑。\n\
  \n为了不沉溺于悲伤，人们需要与自然建立连接，进行长途散步，深呼吸，学会正念，并相信只要有足够多的人思考这个问题，我们就能解决它。我们必须希望，在我们自身的圈子之外，存在着网络和力量；在我们的视野之外，人们正在采取行动，重新思考市场并重新设计资本主义，以便我们找到通往可持续经济增长的道路。\n\
  \n这其实需要信念——对人性的信念，并寻找希望的源泉。就我个人而言，我非常幸运地参与了为金融体系带来巨大积极变化的倡议。所以，是的，我确实对人怀有信念，当然也从未放弃希望。\n\
  \n### 24. 米歇尔·埃德金斯\n\n董事总经理，投资者尽责管理部，贝莱德\n亚历克西斯·罗森布鲁姆\n首席企业可持续发展官，贝莱德\n\n*贝莱德于 1988\
  \ 年在纽约成立，是一家领先的上市投资管理公司，为全球机构和个人客户提供广泛的投资管理及技术服务。截至 2021 年底，该公司代表全球投资者管理超过 10 万亿美元的资产。*\n\
  \n*米歇尔·埃德金斯是贝莱德投资尽责管理团队的董事总经理，负责覆盖美洲、欧洲、中东、非洲及亚太地区。在她的职位上，米歇尔全球负责机构关系、投资尽责管理问题的政策制定，以及与贝莱德投资尽责管理观点和活动相关的沟通。她还在公司的全球运营与政府关系指导委员会任职。*\n\
  \n*在 2009 年加入贝莱德之前，米歇尔曾在英国的两家公司担任投资尽责管理职务。她曾担任 Governance for Owners 的董事总经理，以及 Hermes\
  \ 投资管理公司的公司治理总监。作为经济学背景出身，米歇尔还曾在其祖国新西兰的政府部门工作。*\n\n*作为公司治理公开辩论的积极参与者，米歇尔在过去十年中连续入选全美董事协会（NACD）Directorship\
  \ 100“最具影响力董事与治理专业人士”榜单。她是国际可持续发展研究所（IISD）的主席，曾任国际公司治理网络主席，并曾是阿斯彭研究所的“先行者”研究员。她目前参与多个旨在提升治理和可持续商业实践的行业倡议，包括美国的\
  \ 30%俱乐部（一项旨在增加董事会和高级管理层女性人数的市场倡议）以及可持续发展会计准则委员会（SASB）准则投资者咨询小组（IAG）。*\n\n*亚历克西斯·罗森布鲁姆，CFA，是贝莱德的首席企业可持续发展官。她负责推动整个组织的连接性和问责制，以确保公司在可持续发展议程上取得成功。亚历克西斯与多个部门紧密合作，包括人力资源、社会影响、技术与企业服务、贝莱德可持续投资以及贝莱德投资尽责管理，以制定和实施贝莱德的企业可持续发展框架、政策和信息披露。*\n\
  \n*在担任现职之前，亚历克西斯是贝莱德全球公共政策组的高级成员。她与监管机构和立法者互动，以推动与金融市场透明度和资本市场负责任增长相关的政策成果。亚历克西斯此前曾是贝莱德全球咨询关系团队的客户关系经理，负责建立和维护与美国机构投资顾问的关系。*\n\
  \n*亚历克西斯是 CFA 持证人，并积极参与 CFA 协会的活动。她于 2020 年被 Business Insider 评为“华尔街新星”。*\n\n**克里萨·帕吉萨斯：**\
  \ 亚历克西斯和米歇尔，从了解贝莱德入手会很有帮助。截至 2021 年底，该公司为其客户及其超过 10 万亿美元的投资组合提供的服务范围是什么？\n\n**亚历克西斯·罗森布鲁姆：**\
  \ 贝莱德是一家资产管理公司，我们代表他人管理资金。这些人包括全球数百万的养老金领取者和储蓄者，例如为教师管理资金的养老基金中的个人，或为自己的退休、购房或大学教育费用而储蓄的个人。\n\
  \n\n\n我们的服务包括为全球机构及个人投资者提供投资管理与金融科技解决方案。我们将客户资金配置于所有资产类别——包括现金、固定收益、股票和另类资产。我们还提供广泛的投资产品与服务，为客户量身定制投资与资产配置方案。\n\
  \n**帕吉萨斯：** 接下来，请问可持续发展战略的涵盖范围是什么？\n\n**罗森布拉姆：** 谈到可持续发展及其如何融入贝莱德的工作，其基础在于我们的信念：将可持续发展理念融入为我们客户进行的投资中，有助于他们构建更具韧性的投资组合，并实现更优的长期风险调整后回报。这正是我们可持续发展战略所依托的根本概念。我们通过四大支柱下的关键行动来实施这一战略。\n\
  \n支柱始于投资管理，这正是米歇尔负责的工作。一旦我们投资了一家公司，就会与其管理层沟通，鼓励他们管理重大的环境、社会和治理[ESG]问题，并向作为股东的我们披露相关信息。米歇尔稍后会对此做更多阐述。\n\
  \n第二大支柱是 ESG 整合，这在主动投资管理业务中尤为重要。我们不仅仅跟踪指数，而是力求超越基准指数的回报。我们相信，要实现长期成功，我们的投资组合经理必须将\
  \ ESG 考量融入其资产配置决策中。\n\n我们为该支柱努力实现的成功指标之一，是将 ESG 信息整合到我们的主动投资流程中。这意味着投资组合经理在做出投资决策时，会主动考虑具有重大影响的\
  \ ESG 风险因素。对我们和客户而言，支持或促成 ESG 整合支柱的关键是我们的技术。我们将 ESG 数据和分析功能融入我们的专有风险分析平台`Aladdin`，以促进对\
  \ ESG 影响投资的理解和量化。\n\n第三大支柱是我们的可持续投资产品，这些产品具有明确的 ESG 投资要素或目标。我们正在全面大幅增加可持续投资产品的数量。\n\
  \n最后一大支柱是我们如何管理自身组织。我们认识到，由于我们代表客户投资于许多其他公司，并且对这些公司应如何管理重大的环境、社会和治理问题有自己的看法，因此我们必须以身作则，同样管理好自身。那些公司会向我们寻求最佳实践方面的见解。这就是我的职责所在——确保通过我们的信息披露和自身组织管理，将同样的最佳实践融入我们的运营和战略中，并起到表率作用。\n\
  \n**帕吉萨斯：** 米歇尔，让我们更深入地探讨贝莱德可持续发展战略的第一大支柱。它的范围是什么？你们是如何实施的？\n\n**米歇尔·埃金斯：** 在管理支柱中，我们首先关注治理。很多人都在谈论\
  \ ESG，但我们认为治理部分最为重要，主要是因为根据我们的经验，治理结构不善的公司极不可能将可持续发展考量适当地融入其长期战略、运营和报告之中。\n\n公司必须对治理保持严谨，才能实现可持续商业实践的影响力。我们关注的是董事会成员是谁，以及这些董事是否拥有适当的技能和经验，来为管理层提供建议和监督，以实现长期战略。他们是否确保了广泛的风险和机遇都被考虑在内？ESG\
  \ 是否真正融入了业务的整体运营，而不是仅仅局限于企业的可持续发展职能部门？\n\n治理应使公司能够全面整合可持续的商业实践。当我们对一家公司采取的方法或其信息披露的详细程度感到担忧时，我们就会与公司领导层沟通，并可能投票反对董事连任。作为资产管理人，我们有信义义务为客户的最高经济利益行事。这就是为什么我们要让董事为他们在董事会中代表股东和其他利益相关者利益所扮演的角色负责。\n\
  \n**帕吉萨斯：** 米歇尔，你提出的关于治理作用这一点很有趣。表面上看，治理可能非常简单。公司负责人可能会说，“我们有董事会和首席合规官，所以我的公司治理得很好”，然后就勾选了这项。除了这些检查清单式的项目，还需要什么才能向公司的股东、客户和利益相关者证明良好的治理和管理水平呢？\n\
  \n**埃金斯：** 正是如此。重点不应仅仅在于勾选清单，而在于展示每一项职能的有效性。重要的不仅仅是拥有董事会。关键在于要证明董事会里有合适的人选，并且他们正积极与高级管理层互动，了解业务和所在行业的动态等等。\n\
  \n理想情况下，你的董事会应该是一项竞争优势。我们期望公司能够证明的，不仅仅是他们拥有所有检查清单上的要素，还要能让我们确信所有这些职能都在按预期运作——无论是审计与财务控制、董事会下属委员会，还是预判影响其行业的不断变化的宏观趋势并加以适应。\n\
  \n**帕吉萨斯：** 我的理解是，良好的治理来自于一个积极参与、持续根据目标评估公司绩效及执行情况、在当前市场环境中运作并为其未来市场变化做好准备的董事会。\n\
  \n谈到 ESG 在主动投资管理业务中的整合，也就是贝莱德可持续发展战略的第二大支柱，能否举一个在投资管理流程或基金中实现这种整合的例子？\n\n**罗森布拉姆：**\
  \ 贝莱德管理着横跨多种资产类别的 100 多种不同的投资策略，因此很难一概而论，因为 ESG 整合因策略而异。一个例子是贝莱德直接投资于房地产和基础设施。对于这些投资，ESG\
  \ 整合包括对环境和社会因素的详细审查，包括与环境保护、污染预防、当地栖息地和生物多样性保护，以及员工和当地社区的健康安全相关的因素。\n\n**帕吉萨斯：**\
  \ 贝莱德在其第三大支柱下提供哪些可持续投资产品？这些资本市场解决方案如何应对公司面临的环境、社会和治理挑战，以及利益相关者要求提供解决方案的诉求？\n\n\n\
  \  \n**罗森布鲁姆：** 过去几年中，贝莱德大幅扩展了向客户提供的可持续投资策略数量。这些策略涵盖了指数投资和主动投资管理领域的广泛投资策略。可持续投资产品类型众多，包括广泛纳入\
  \ ESG 目标的产品、围绕特定*环境（E）*、*社会（S）*或*治理（G）*主题进行投资的产品，甚至还有旨在除财务回报外，产生可衡量的环境或社会效益的产品。\n\
  \n或许举个更直观的例子：2019 年，贝莱德的一个主动股票团队与艾伦·麦克阿瑟基金会合作推出了一项循环经济投资策略。该策略的核心是帮助贝莱德的客户将资金投入到支持向循环经济转型的企业，以及那些正在朝着更可持续运营方式发展的企业。贝莱德还在\
  \ 2021 年推出了两只主动型可持续交易所交易基金（ETF），重点投资于那些投资团队认为在向低碳经济转型过程中更具优势的公司。\n\n你可能已经感觉到，多样性和选择性是这里的一个主题。这是有意为之，因为我们认识到客户是多元化的，他们有一系列目标，坦率地说，促使他们寻求可持续投资产品的目标、动机也各不相同。\n\
  \n**帕吉萨斯：** 这些可持续投资产品最初是否遭到了市场的质疑？\n\n**罗森布鲁姆：** 用“质疑”这个词可能不太准确。但可以说，在很长一段时间里，可持续投资策略都是比较小众的产品。如今，它们已成为许多客户投资组合的核心组成部分。仅举一例，让你感受一下这种转变在相对较短的时间内发生的规模：2018\
  \ 年，贝莱德管理的可持续投资策略规模为 520 亿美元。截至 2021 年 12 月 31 日，这一数字已升至 5090 亿美元。在 2021 年全年，贝莱德的可持续投资策略净流入额达到了创纪录的\
  \ 1040 亿美元。这种转变显示了投资者行为正在发生变化的规模。或许最令人惊讶的是，可持续投资的势头在整个新冠疫情大流行期间反而加快了。此前，传统观点认为，在经济景气时投资者会关注\
  \ ESG，但在经济不景气时，ESG 会被降级优先考虑。这一假设显然被疫情打破了。\n\n**帕吉萨斯：** 该战略的第四大支柱是关于贝莱德自身的运营。这些活动的范围是什么？能否举例说明因践行可持续发展承诺而开展的新运营举措？\n\
  \n**罗森布鲁姆：** 该支柱的核心是确保我们作为一个组织，在自身行为上以身作则。这涵盖了我们制定的治理和激励结构及其如何与长期战略和目标保持一致，我们如何管理实体运营的环境足迹，以及我们如何展现自己、支持我们的员工和我们运营所在的社区。我们对透明度的承诺对于这项工作至关重要，尤其是因为作为代表客户的投资者，我们需要从我们投资的公司获得更多、更高质量的数据，以帮助我们有效地将重要的\
  \ ESG 因素纳入投资组合并进行量化。从这个意义上说，我们有额外的动力去做好企业可持续发展披露，因为从商业角度来看，我们需要在这方面树立一个好榜样。\n\n\
  我们还在认真思考作为组织我们选择与谁合作，并通过建立供应商可持续发展和多样性计划来实现这一点。我们正在思考如何鼓励与我们自身做法相同类型的行为以及对重大风险和机会的管理。供应商计划将鼓励我们的业务伙伴衡量他们在多样性、公平性、包容性和环境可持续性方面的进展，并就关键挑战或需要改进的领域制定目标和策略。在这方面，我们已不再仅仅为合作对象设定最低期望，还鼓励我们选择合作的公司采用最佳实践。\n\
  \n**帕吉萨斯：** 这四个支柱最终由贝莱德董事会监督。贝莱德董事会如何参与公司的可持续发展战略、成果和目标？\n\n**罗森布鲁姆：** 我们的董事会监督公司的整个长期战略，而可持续发展已成为其中的一个关键支柱。在此监督范围内，董事会见证了可持续发展战略从一个重要关注点演变为我们业务战略中关键且核心的组成部分，这一进程在过去两年中加速了。\n\
  \n在治理提升方面，我们对可持续发展战略的监督比过去明确得多。2020 年 1 月，我们明确将新的可持续发展监督职责纳入董事会下属委员会——提名、治理与可持续发展委员会——的章程中。该委员会也进行了更名，以将对这个领域的监督纳入其名称。委员会的监督范围包括投资管理，这是该战略中最关键的组成部分之一；我负责的企业可持续发展工作；我们围绕\
  \ ESG 问题（如 SASB 和气候相关财务信息披露工作组（TCFD）报告）的企业信息披露；社会影响力工作，即我们的慈善事业；以及对公共政策活动和行业协会的监督。\n\
  \n董事会的角色是随着时间的推移而演变的。当你思考董事会在战略提升、工作加速以及我们兑现已做出的众多承诺方面的参与时，其结果证明了监督和治理可以发挥的强大作用。\n\
  \n**埃德金斯：** ESG 在董事会层面重要性的体现，可以从贝莱德董事会最近新增的两位成员——贝丝·福特和克里斯汀·佩克——看出。她们是 2021 年 9\
  \ 月[宣布](https://www.blackrock.com/corporate/newsroom/press-releases/article/corporate-one/press-releases/blackrock-elects-beth-ford-and-kristin-peck)的。两人都凭借其当前的企业职务带来了直接的可持续发展实践经验。\n\
  \n**帕吉萨斯：** 对于贝莱德投资的公司，ESG 或可持续发展是您期望所有董事都具备的核心能力，还是仅部分董事具备即可？\n\n**埃德金斯：** 有趣的是，在美国，董事会圈子里仍在辩论可持续发展是否真的归董事会负责，还是仅仅是一个管理问题。我们的观点是，如果它是价值或风险的重要或实质性驱动因素，那么它就属于董事会的职责范围。我们传达这一观点已有几年了。我们感觉到投资者越来越理解和认同这一期望，因为持有这种看法的并不仅仅是贝莱德。\n\
  \n\n\n董事会和管理层必须明确可持续性相关的关键价值及风险驱动因素，因为这取决于公司的业务模式。对某些公司而言，水资源可能是关键驱动因素；对另一些公司来说，能效提升才是真正能带来显著改变的核心；还有一些公司则会关注供应链与人权保护。而对大多数公司而言，这往往是多重因素的综合结果。关键在于精准锁定最具影响力的价值与风险驱动因素，并确保董事会整体——通过董事团队汇聚的多元技能——拥有应对这些关键风险所需的专业能力。\n\
  \n这并非要求董事会必须配备气候专家、人权专家和网络安全专家。我们希望董事们凭借其过往担任的其他职务经验，能够对这些议题具备足够的理解力，从而能向管理层提出正确的问题，并准确理解提交给他们的信息。鉴于大多数业务模式的复杂性，要求某位董事针对每个关键议题都具备单一专长是不切实际的。\n\
  \n正如我听到的另一种精妙描述：每位董事都应有“主修”和“辅修”。所有董事的“主修”都应是商业、财务和运营专长。而每位董事的“辅修”则应具有互补性，且与公司战略——即长期未来战略而非历史战略——以及部分关键价值与风险驱动因素明确一致。这些驱动因素未必都与可持续性相关，明确来说，其中可能包含财务或市场相关因素。\n\
  \n至于在可持续性议题上展现清晰的专业判断力或运营经验，我们观察到董事会层面正发生代际转变：越来越多新任董事（包括首次任职者）在运营管理岗位中积累了更多关于可持续性事务的实操经验，因为这类议题已在企业议程中不断提升优先级。\n\
  \n**帕吉萨斯：** 贝莱德如何通过企业参与将 ESG 原则应用于投资？\n\n**埃德金斯：** 这是一个渐进的过程。我们走过了一段历程。贝莱德及其前身公司设立管理职能已有二十多年。很长一段时间里，我们高度关注治理问题。在此期间经历的转变是关注范围从单纯的代理投票扩展至与企业的更多互动，即直接参与。这些互动中讨论的议题范围也逐年扩大。\n\
  \n总体而言，我们的策略是当新兴议题逐渐被普遍认知为商业风险或机遇时，将其纳入参与对话中。例如在气候风险方面，我们会询问企业如何考量气候风险，以及预期监管或物理风险等对其业务的影响。基于这些对话和自身研究，我们逐步在投票中反映关切。用通俗的话说，我们通过公布的管理政策和互动活动使这些议题得到充分讨论，然后将其融入投票分析与决策，最初可能导致对管理层投反对票的情况增多。\n\
  \n以气候问题为例，我们大约从 2015 年开始就气候风险进行接触。我们会询问企业运营如何暴露于气候风险之下，这成为讨论风险及企业应对策略的切实基础。随后我们可能要求企业披露更多关于如何预测和应对气候风险的信息。\n\
  \n在早期互动中，企业的反应往往是：“您希望我们披露什么？”我们会回答：“你们最了解自身业务的风险。我们认为披露股东需要了解的信息非常重要，这样他们才能判断这是项管理得当的风险。”幸运的是，随后成立的\
  \ TCFD（气候相关财务信息披露工作组）——贝莱德是其创始成员之一——为此类报告提供了框架。现在我们会说：“请按照 TCFD 建议进行报告。”这些步骤是渐进的，因为推动变革时必须带着大家一同前行。\n\
  \n**帕吉萨斯：** 是什么促使投资者对包括气候风险在内的可持续性议题关注度提升？\n\n**埃德金斯：** 过去十年最显著的变化是投资者对可持续性相关的实质性风险和价值驱动因素，以及它们长期可能对业绩产生的影响有了更深入的理解。需要明确的是，这并非投资者将可持续性问题强加给企业。企业长期以来一直在应对这些问题，因为如果它们确实具有实质性，就会成为企业运营能力的关键。因此，这些问题本就被纳入了管理体系。随着时间的推移，企业增加了对可持续性议题的披露，这有助于投资者理解。\n\
  \n以可口可乐公司为例，水是其核心生产要素。管理层必须证明其高效用水的能力，尤其是在水资源紧张的地区（美国许多地区都如此）。如果做不到这点，企业将失去运营许可。证明关键生产要素的高效利用不仅是环境问题，更是生存问题。其他\
  \ ESG 议题可能相当复杂，但可口可乐与水的关系是个简单且易于理解的例子。\n\n**帕吉萨斯：** 这个观点很精妙。因为有些企业面临实质性议题，但不如水资源问题这样直观。如果某位高管说“气候变化太宽泛，对我的业务不具实质性”，您是否会通过阐述应对气候变化的商业逻辑来回应？\n\
  \n**埃德金斯：** 这个商业逻辑不需要我们来阐述。而是需要他们来证明，自己正以正确方式管理业务，以保护我们客户作为股东的长期利益。\n\n**帕吉萨斯：**\
  \ 以季度为单位的短期财务目标是否会阻碍实现长达数十年的长期环境与社会目标？\n\n**埃德金斯：** 平衡长期业务成果与短期财务目标始终是企业领导者关注的焦点。无论是平衡对新业务线的投资（可能需要数年才能产生回报）与当年业绩，还是平衡确保运营稳健可持续以最小化产品或流程失败风险，这些取舍本就是企业管理的组成部分。只要公司领导层清晰阐述其举措及其为何最符合公司与股东利益，就应能获得股东及其他利益相关方的支持。\n\
  \n**帕吉萨斯：** 自可持续性首次纳入业务战略以来，ESG 考量因素、原则及其在贝莱德业务中的整合程度和范围发生了怎样的演变？\n\n**罗森布鲁姆：**\
  \ 这番对话让我回想起与一位导师的早期交流，正是他聘用我启动贝莱德的企业可持续发展职能。他曾对我说：“可持续性可能很快成为整个公司的核心。但同时，环境与社会议题也可能被定义得过于狭窄，所以你必须想办法划定它的边界。”\n\
  \n\n\n在我建立将 ESG 视角应用于贝莱德并构建相关框架的过程中，有几件事变得清晰起来。首先，从很多方面来看，ESG 就像一系列没人知道该如何处理的话题，所以我们就把它们全都堆在了一起。然而，它们其实是截然不同的事物。内部利益相关者也大相径庭。例如，从事环境议题工作的人，比如我们的设施团队和技术团队，与处理社会议题（如多元化、公平和包容或慈善工作）的人截然不同，而这些人与从事可持续投资工作的人又是完全不同的群体。这就是我在整个过程中逐渐认识到的一点。我们倾向于把所有这些东西混为一谈，但它们实际上是不同的问题，需要不同的技能组合。\n\
  \n**帕吉萨斯：** 管理自己办公区域的能源策略，与和公司高管层沟通其制造工厂的能源策略，是完全不同的工作。\n\n**罗森布鲁姆：** 没错，正是这样。我们不得不应对的另一件事是，如何为贝莱德定义“企业可持续性”。当我们谈到“ESG”时，如何具体明确我们在谈论和管理什么？对贝莱德而言，我们最终审视了我们的业务、流程和实质性议题。我们进行了一项非常传统的利益相关方评估，试图了解我们的客户、员工、股东以及我们称之为“社会”的这个庞大其他类别的观点。有些人称此为“重要性”评估。由于我来自金融服务背景，我觉得这个术语有点难以接受，因为在不同背景下，“重要”与否的概念可能含义不同。因此，我更喜欢称之为“利益相关方”评估。\n\
  \n我们与关键的外部利益相关方群体合作，了解他们的看法。这是一个非常有趣的过程，可以借此吸收外部反馈。作为资产管理公司，我们必须面对的一个问题是，我们的 ESG\
  \ 议题往往就是代表客户所投资公司的议题。我们的利益相关方想知道其他公司的 ESG 议题，因为作为投资者，我们与我们所投资的公司是关联在一起的。\n\n在整个过程中，我一直在看公司生成的那些全球报告倡议组织（GRI）图表。这些图表直观地显示了哪些环境、社会和治理议题对公司是重要的。我一直说：“好吧，公式是什么？绘制这些图表的函数是什么？”我们联系了许多在利益相关方和议题映射方面有经验的组织和专家。我发现，除了吸收利益相关方的反馈之外，其中并没有太多科学方法。\n\
  \n然后，你必须自行判断这些议题在需要优先处理、并将其整合到业务流程、政策和报告中的层级位置。这是一个重要的领域，总体上还需要做更多工作。我们也参考了关键的外部标准作为指引，包括\
  \ SASB、TCFD 以及联合国全球契约原则和可持续发展目标（SDGs）。\n\n随后，贝莱德成立了“利益相关方资本主义中心”，致力于研究利益相关方资本主义。有机会去思考如何在我们评估不同\
  \ ESG 议题对公司的相对重要性时，引入更多科学方法，这在整个专注于可持续发展的专业领域都是如此。对贝莱德来说，我们最终列出了一系列关键的 ESG 议题，并在披露中使用，以此构建了我们报告\
  \ ESG 议题和数据的整体框架。\n\n**帕吉萨斯：** 贝莱德最终由利益相关方确定的 ESG 议题清单是什么？\n\n**罗森布鲁姆：** 正如我们 2020\
  \ 年可持续发展披露中所指出的，它们包括：商业道德和行为；可持续投资与管理；气候相关风险与机遇；员工多元化、公平和包容；员工健康、安全与福祉；董事会构成；公共政策与政治活动；人权；自然资本相关风险与机遇；销售实践与产品标签；供应链管理；以及社区关系与社会影响。\n\
  \n**帕吉萨斯：** 利益相关方对贝莱德提出批评或希望其发展改进的领域是什么？\n\n**罗森布鲁姆：** 我们最大的挑战之一是利益相关方的多样性。他们意见不一，有时观点甚至截然相反。总的来说，我认为一个关键主题是我们需要对我们所做的事情以及为何这样做更加透明。这就是为什么米歇尔的团队在过去两年里，在我们的投票和参与活动方面显著提高了透明度并增加了相关报告的原因之一。\n\
  \n**埃德金斯：** 延续亚历克西斯所说的关于公司确定重点领域的话题，特别是如果你刚开始整理可持续性叙事和数据，我们强烈建议公司查看 SASB 发布的资源，因为他们已经在各个行业做了大量工作来梳理实质性的可持续性风险。他们根据自身评估，列出了关键的、具有实质性的或与业务相关的可持续性因素，并提出了报告指标建议。从投资者的角度来看，专注于一套相对有限、且明确针对特定行业的数据和指标，对于同行比较以及我们理解公司商业模式动态的能力极有帮助。\n\
  \n**帕吉萨斯：** 基于这些实质性议题，贝莱德设定了哪些顶级的公开目标或承诺？\n\n**罗森布鲁姆：** 贝莱德在 ESG 议题的广泛层面以及我们的可持续投资和投资管理方面都做出了一系列承诺。其中一些首要目标包括：将\
  \ ESG 因素整合到我们的主动投资流程中；增加我们提供的可持续 ETF 数量；提高我们投资管理活动的透明度；增加与我们所投资公司就气候相关风险和机遇的沟通；以及为我们的企业运营设定与科学目标一致的减排目标。\n\
  \n**埃德金斯：** 此外，人力资本是贝莱德长期成功的重要因素，从董事会到领导层都表明，我们需要一个多元化和包容性的工作场所。去年，鉴于“黑人的命也是命”运动以及社会正义、平等和公平问题真正受到关注，公司公开表示：“我们取得的进展本应更大，我们将在这方面加倍努力。”\n\
  \n因此，我们专注于将美国地区黑人和拉丁裔员工的代表性提高 30%，并将美国地区黑人和拉丁裔高级领导者的数量增加一倍。我们已经实现了很多目标，并在其他目标上取得了显著进展，但可以说，我们面前仍有很多工作要做。\n\
  \n**帕吉萨斯：** 亚历克西斯，借用你导师的话来说，“可持续性可以非常宽泛，也可以非常具体。”这就引出了一个问题：公司内部谁应该领导可持续性工作？你预计可持续性负责人的职位十年后还会存在吗？还是说，因为每个人都理解并将可持续性融入日常业务决策，我们就不再需要一个人来领导可持续性工作了？\n\
  \n\n\n**罗森布鲁姆：** 我想说的是，对于那些在可持续发展领域一直处于领先地位的公司来说，这不仅仅是某一个或两个团队在做可持续发展工作。而是要确保可持续发展这一理念，在期望和引进组织内部的专业知识方面，贯穿整个组织。即使对我们而言，这一点也在内部迅速传播开来。\n\
  \n具体负责监测、报告并确保组织从可持续发展角度保持最佳实践的专业可持续发展人才仍然有发挥空间。只是可持续发展权力的中心可能未必集中在一个地方。那些刚刚踏上这条道路的公司——当然，有很多公司正处于这个阶段——在可持续发展理念如何渗透整个组织方面，可能会落后五到十年，这完全没问题。我们发现，我们需要集中一批可持续发展专业人士，以便连贯清晰地阐述我们从可持续发展角度正在做的事情。这当然是一种很好的方法，但我认为，对于很多公司来说，随着时间的推移，可持续发展将不再是一个独立、独特的职能。\n\
  \n**帕吉萨斯：** 一个相关的组织问题是，贝莱德的企业可持续发展团队设在哪个部门？\n\n**罗森布鲁姆：** 可持续发展职能设在哪个部门，对许多公司来说都是一个巨大的问号。我的团队换过地方。我们最初在财务部，现在在一个名为“外部事务”的新部门。我们在很多地方都说得通，因为我们的工作与公司的其他部门结合得非常紧密。\n\
  \n当贝莱德的外部事务部门于 2021 年 6 月成立时，我的团队——企业可持续发展部——与贝莱德的社会影响力团队、公共政策部门以及贝莱德新成立的利益相关者资本主义中心一起，加入了外部事务职能。外部事务之所以整合在一起，是因为我们都与我们的利益相关者——无论是政策制定者、我们运营所在的社区、员工还是其他众多群体——进行互动，并试图理解他们的观点，将这些反馈整合到我们在整个组织的工作中。\n\
  \n当我在财务部时，工作重点完全是信息披露和内部控制。考虑到美国证券交易委员会（SEC）的监管方向，对我们的可持续发展数据和信息披露进行内部控制非常重要。从这个角度来看，设在财务部非常合理。虽然我的团队不再设在财务部，但我们仍然与财务团队紧密合作，因为内部控制与流程仍然是我们企业可持续发展披露工作的一个重要关注点。\n\
  \n**帕吉萨斯：** 米歇尔，在你在贝莱德任职期间，投资管理的方法是否发生了变化？是什么推动了这种变化？\n\n**埃德金斯：** 在过去十年左右的时间里，我们越来越多地将可持续发展因素纳入我们的参与过程，并在最近，也纳入到投票决策中。2020\
  \ 年，公司发出了一个强烈的信号，承认可持续发展风险——尤其是气候风险——是投资风险。因此，作为我们未来投资方法的核心部分，这推动了资产管理工作在这个领域的进展。结果，我们制定了更具体的政策，尤其是在气候和能源转型方面。我们将继续将这些因素整合到我们的参与和投票中。\n\
  \n增强信息披露是将更多可持续发展因素纳入我们工作整个流程的关键。公司的报告越来越多，但同时，关于公司的、由公司本身并未发布的信息的报告也越来越多。这是许多公司不一定能意识到的一个重要组成部分。投资者，尤其是像贝莱德这样拥有量化分析团队的投资者，可以从各种来源获取大量数据，这些数据可以讲述一个公司的故事。公司的报告只是分析过程中的一个输入项。\n\
  \n\n\n管理团队受益于贝莱德内部团队及外部研究对技术的运用，这有助于拓宽我们的参与对话。除此之外，自金融危机以来，人们对企业和投资者在全球经济中的影响力，以及表明你正以深思熟虑的方式履行责任的重要性，有了更深刻的认识。\n\
  \n**帕吉萨斯：** 继续我们关于贝莱德内部可持续发展方法的讨论，在贝莱德内部，如果对一项新的 ESG 相关活动存在阻力，需要如何克服？\n\n**埃德金斯：**\
  \ 这一切都归结于公司高层要有承诺和领导力。我们怎么强调 CEO 的领导力以及公司在关键可持续发展议题上拥有清晰且易于理解的战略对于真正将其融入公司有多么重要都不为过。即便如此，你可能也永远无法做到完全、彻底的融入。你可能永远也无法获得\
  \ 100%的认同。但是，随着它日益成为组织架构的一部分，不参与其中就会变得越来越困难。\n\n**罗森布鲁姆：** 没错。我们非常幸运，因为我们的 CEO 拉里·芬克非常坦诚，并愿意在其中的一些议题上发挥领导作用，特别是通过他每年致\
  \ CEO 的信函。当其他公司考虑投资可持续发展战略和实践时，来自高层管理人员（包括董事会）的支持和声音极其重要。它确实影响了我们在 ESG 问题上整合策略的方式。\n\
  \n**帕吉萨斯：** 是的，转向 ESG 整合的未来确实需要董事会和高层管理团队的勇气和信念。ESG 必须从高层开始、贯穿整个公司并持续不断地传达。现在放眼全球，亚洲、拉丁美洲、欧洲和北美的公司是否以同样的方式看待可持续发展？\n\
  \n**埃德金斯：** 我认为很难一概而论。每个地区、市场或文化的驱动因素可能不同。我们今天内部就在讨论某些亚洲市场。在日本，公司承担社会责任这一概念由来已久。在日本，公司非常专注于实现与其商业模式相关的联合国可持续发展目标，这种方式你很难从一家美国公司那里听到。\n\
  \n存在许多因文化、公司法律架构和市场规范而产生的差异，这些差异影响着公司优先考虑或强调的事项、利益相关者期望与企业责任之间的差距等等。这就是为什么在尽责管理方面，我们的目标是拥有高层次的全球一致原则和重点领域，并通过本地视角来应用它们。例如，关注多元化和多元化领导力至关重要，但在北美与在拉丁美洲或亚洲，这完全是两码事。\n\
  \n**帕吉萨斯：** 类似地，全球的公司治理标准也差异巨大。您和贝莱德管理层如何跨越这个范围参与治理和政策讨论？面临哪些挑战？\n\n**埃德金斯：** 贝莱德代表我们的客户在全球进行投资。因此，在我们业务的多个方面，我们认为我们有责任努力确保我们所处的投资市场环境符合客户的长期经济利益。就我们的投资尽责管理活动而言，这主要意味着要明确界定符合公司透明度和问责制的股东权利。公司披露信息的质量很重要，因为这是投资者决策的基础，同样重要的是鼓励投资者进行尽责管理或对公司的积极监督。由于我的职责，我特别关注股东权利，但公司内部的其他人则会讨论与实物资产等相关的财产权利。\n\
  \n我们认为在政策辩论中拥有发言权很重要，因为我们认为这对我们自己以及整个实践领域的持续改进都至关重要。全球范围内在推进可持续商业实践方面做了很多工作，但投资者的声音常常被忽视。上市公司有相当强的发声渠道，公共政策制定者有相当强的发声渠道，企业顾问也有相当强的发声渠道，而公民社会团体也往往是其中的一部分。然而，投资者的声音往往在最后一刻才被引入，或者根本听不到。\n\
  \n我们的参与从最高领导层开始，并贯穿于多个领导者和渠道。这包括高级领导人参加全球性会议，如联合国气候变化框架公约缔约方会议、瑞士达沃斯世界经济论坛以及国际货币基金组织会议。除此之外，作为实践者，我们还会参与焦点小组和项目。例如，我们曾是经合组织关于负责任商业行为工作组的一员，并且我们回应了国际财务报告准则关于是否应设立国际可持续发展准则理事会的咨询，仅举此两例。\n\
  \n关于渠道，一个是非正式对话和建立关系网络，另一个是回应正式的政策咨询。在咨询案例中，作为一家公司，我们会决定由哪些同事最适合为制定我们的回应作出贡献。举个例子，几年前，经合组织明确表示其关于跨国企业负责任商业行为的全球准则适用于投资者。然而，投资者最初并未参与该准则的制定过程，因此这些准则与投资决策的制定方式没有直接关系。2016\
  \ 年，经合组织成立了一个工作组，贝莱德与包括银行和保险公司在内的其他投资者都是其成员，目的是将针对跨国企业的准则转化为一套更易于投资者执行的、与负责任商业行为的企业准则相关的行动指南。\n\
  \n**帕吉萨斯：** 米歇尔，贝莱德在可持续发展或 ESG 战略上公开表态是否遇到任何反对？这些反对来自哪里？\n\n**埃德金斯：** 这是我们试图达到的一种微妙的平衡，即通过发声来推进客户的利益，同时避免留下真空，让人们说“贝莱德试图扮演准监管角色”或类似的话。我们力求以深思熟虑的方式为辩论做出贡献，同时不让人们认为我们试图主导辩论。这正是我们必须撸起袖子，在工作组层面做出贡献的地方，这样我们才能成为共同对话的一部分。\n\
  \n**帕吉萨斯：** 看起来，公司必须对自身在国际监管、标准和政策对话中的角色有清醒的认识，并且必须根据你是谁、你如何被看待等因素来调整你的参与方式。这是一种深思熟虑的参与。\n\
  \n**埃德金斯：** 你说到了很重要的一点。我们自律地参与那些我们认为自己能够做出贡献的倡议或咨询。我们不仅仅是为了发言而发言，当我们发言时，是因为我们有一个我们认为尚未被纳入讨论的视角。无论是作为代表客户的长期股东，还是作为实物资产投资者，或是在可再生能源方面拥有重要专业知识，无论是什么，我们都专注于在哪些方面可以为推动事情朝着有利于客户的方向发展做出贡献。\n\
  \n**帕吉萨斯：** 您预计贝莱德未来会在哪些领域长期持续参与，因为目前缺乏投资者的视角？\n\n\n\n**埃德金斯：** 我将谈谈我非常熟悉的贝莱德业务领域，即投资管理。根据我的经验，这项工作涉及多个方面，尤其是考虑到我们作为跨资产类别的全球多元化投资者的地位。其中一个重点领域是推进可持续发展报告的实践，帮助公司聚焦并提供投资者所需的信息，同时尽量减少其报告负担。\n\
  \n此外，在改变公司只关注股东回报的叙事方面，还有很多工作要做。在我担任这一职务的二十年里，一直存在着这种错误的二分法。问题不在于以牺牲其他一切为代价来换取股东回报。我相信，正如《你的书》中将清晰阐述的那样，如果不提升和保护公司成功所依赖的关键利益相关者的利益，就无法——实际上也不可能——服务于长期股东利益。\n\
  \n要超越这种错误的二分法，需要长期的参与。在推进关键利益相关者利益的过程中，公司可以做自己力所能及的事情。但是，他们需要可预测的长期公共政策来制定那些通常是多年的决策，或具有多年影响和相关投资的决策，以帮助他们在能够控制的领域，实现符合包括股东在内的关键利益相关者利益的成果。\n\
  \n**帕吉萨斯：** 与监管机构和私营部门就气候变化问题进行接触的最大机会，刚刚在格拉斯哥的《联合国气候变化框架公约》第二十六次缔约方大会（COP26）上落下帷幕。贝莱德倡导了哪些主要承诺？\n\
  \n**罗森布鲁姆：** 对贝莱德而言，COP26 是一个加强与政策制定者和官员接触、与客户及意见领袖会面的时刻。我们参加 COP 是为了推进全球关于 TCFD（气候相关财务信息披露工作组）的讨论，借助\
  \ COP 主题展示行动，并帮助塑造向净零经济转型的政策成果。最终，一个成功且有序的转型对所有人都有利，包括为长期目标做规划的贝莱德客户。\n\n**帕吉萨斯：**\
  \ 除了投资者管理、可持续金融产品以及与政策制定者接触外，贝莱德的工具箱中还有其他工具可用于解决环境、社会和治理问题。亚历克西斯，贝莱德慈善事业的范畴是什么？慈善事业如何被用来推进可持续发展议题？\n\
  \n**罗森布鲁姆：** 是的，慈善事业在贝莱德已有很长的历史。自 2016 年以来，我们通过社会影响项目战略性地开展这项工作，重点在于我们如何对我们运营所在的社区产生影响。这项工作有两大支柱——我们的基金会和我们的员工参与计划。2020\
  \ 年 2 月，贝莱德的慈善工作向前迈进了一大步，捐赠了近 6 亿美元，用于资助公司长期的社会影响工作，并成立了贝莱德基金会。该基金会帮助贝莱德核心业务之外的人们建立财务安全感，并参与向低碳未来的转型。结合我们由员工主导的慈善工作，我们的慈善事业旨在推动公平和可持续的经济与社区发展。对于我们公司及其领导者而言，这是我们如何为周围世界贡献力量的一个日益重要的关注点。\n\
  \n特别是在气候转型方面，我们认为慈善资本是一种被低估但非常重要的工具，可以吸引所需的投资，以达到为全球能源转型和全球净零转型提供资金所必需的资本规模。这是因为需要开发并规模化众多新技术才能实现转型。许多技术尚处于早期阶段或仍不具备市场可行性，可能无法吸引贝莱德客户通常希望投入的那种机构资本。\n\
  \n一个例子是，贝莱德基金会最近承诺向“突破能源催化剂”项目提供 1 亿美元，这是迄今为止最大的一笔赠款。这是一个新的慈善项目，其目标是削减所谓的“绿色溢价”。有时，购买更具可持续性的产品会更昂贵。绿色溢价的一个例子是可持续航空燃料，这正是催化剂项目致力于加速市场采用的技术之一，方法是通过缩小可持续航空燃料与传统航空燃料之间的成本差异，同时使其更广泛地可得。\n\
  \n该项目寻求投资于能够帮助尽可能快地降低绿色溢价的各项技术。它目前专注于四项技术，分别是直接空气捕获、绿色氢能、长时储能和可持续航空燃料。之所以最初聚焦这些领域，是因为这些技术对于转型至关重要。\n\
  \n最终，我们认为，无论是我们自己的还是来自其他资助方的慈善资本，几乎都扮演着“第一损失”的角色，即这些资本愿意承担更大的风险，因为它不将财务回报作为首要目标，而是将社会或环境目标作为其首要目标。\n\
  \n**帕吉萨斯：** 如果首席可持续发展官正在评估启动一个慈善解决方案，您会建议他们什么？\n\n**罗森布鲁姆：** 首先，我认为首席可持续发展官的首要工作是确保公司自身以可持续的方式运营，并管理重大的环境、社会和治理风险。虽然慈善资本对于任何可能追求的事业而言都确实重要且美好，但如果公司自身管理不善，那么对于无法以可持续方式运营的公司来说，这并非一个可行的解决方案。这是公司必须开始的地方。\n\
  \n**帕吉萨斯：** 米歇尔，我们已经谈到了董事会和高级领导层的角色，现在又谈到了慈善的角色。从广义上讲，私营公司在资本市场向更可持续未来转型的过程中扮演着什么角色？\n\
  \n**埃德金斯：** 贝莱德明确声明且我深信的一点是，私营部门拥有推动变革的力量。我们看到一些公司正在做一些创新的事情，而我们除了通过投票支持管理层之外，实际上无法以其他方式予以认可。我们管理工作的性质意味着，我们倾向于关注那些稍微落后、慢半拍的公司，以鼓励它们向前迈进。\n\
  \n我希望在贝莱德之外能有一种机制，来认可和奖励那些进行创新并承担风险、从而改变大局的公司。可以说，这正是资本市场会做的事情。另外，通过认可来承认创新发生在上市公司和私营公司内部，以及伴随而来的风险承担、带动他人和创建目标驱动的社区，这也很好。我认为，所有这些对于未来几十年我们将看到的重大变革都至关重要，并且我对上市公司在此过程中的作用非常乐观。\n\
  \n**帕吉萨斯：** 亚历克西斯和米歇尔，让我们把话题转向你们作为高管领导者的职业生涯和理念。亚历克西斯，您成为贝莱德首席企业可持续发展官的专业历程是怎样的？\n\
  \n**罗森布鲁姆：** 我的第一个职位是在贝莱德的机构客户业务部门，与为养老基金和保险公司服务的投资顾问合作。我通过与客户合作并接触许多不同的产品来学习业务。我于\
  \ 2010 年加入贝莱德，当时正值《多德-弗兰克法案》（华尔街改革和消费者保护法案）通过，监管机构正着力解决金融体系在 2008 年金融危机中所扮演的角色。\n\
  \n\n\n由于我的学术背景是公共政策，我一直希望将其应用到我的职业工作中。因此，在 2012 年，我加入了我们的公共政策小组，代表贝莱德与华盛顿特区和世界各地的监管机构及立法者进行交流。在我任职公共政策团队的七年时间后期，这些讨论逐渐演变成关于公司治理和\
  \ ESG 问题的对话。我花了大量时间与 Michelle 的团队合作，从财务重要性的角度理解他们对重要 ESG 问题管理的看法，以及一家公司相对于其目标、TCFD、SASB\
  \ 和其他标准的绩效表现。\n\n回到我们之前的讨论，ESG 涵盖了非常不同的主题，这一点在我们公司越来越难以回答“贝莱德在企业可持续发展方面做了什么？”这个问题时变得非常明显。除非你召集二十个人在电话里试图解释，否则你无法清晰作答。我向我们的高级领导层提出了这一担忧，并表示我们有机会加速公司处理\
  \ ESG 问题的方式，这样我们就可以开始发挥领导作用，以身作则，并向我们在管理前线接触的公司展示，从投资者的角度来看，什么才是良好的做法。\n\n2019 年，在我职业生涯中一直担任关键导师和赞助人的副董事长兼联合创始人\
  \ Barbara Novick，以及我们的首席财务官 Gary Shedlin，鼓励我和我们的投资者关系团队负责人 Sam Tortora 为贝莱德建立一个企业可持续发展职能部门。Sam\
  \ 此前在处理与股东的关系时，也面临着与我在政策制定者那里遇到的相同问题和挑战。之后，我的职位便应运而生。不久之后，我们公司在其投资能力方面显著加速了可持续发展战略，这进一步印证了公司需要专门设立一个职能部门来在其内部解决这一问题的理由和必要性。\n\
  \n现在，随着监管机构越来越关注这一领域，并对信息披露以及公司需要采取的行动做出决定，这对我来说是一个循环。我发现自己越来越多地参与政策讨论。但从企业发行人的不同角度出发，我已经为自己完成了这些披露，并思考了这些问题。\n\
  \n**Pagitsas：** Michelle，你成为贝莱德投资管理团队董事总经理的职业历程是怎样的？\n\n**Edkins：** 我受训成为一名经济学家，从新西兰的大学毕业后，进入了新西兰储备银行，也就是该国的中央银行。这份工作非常非常偏向计量经济学，我当时想，“嗯，这挺有意思的。”虽然这个学位和在央行的经历很有趣，但我不确定这是否是我余生想做的事情。基本上，只是因为数学太多了。所以，我说：“让我们找点别的事做。”我离开那里后，为英国高级专员公署工作，这是在英联邦国家之间的外交服务机构。\n\
  \n我在那里担任政策官员，主要是解释新西兰重大放松管制努力对经济的影响。那份工作又走向了另一个极端，深深沉浸在政治、政策等领域。我离开那里回到了英国，在中学和大学之间我曾在英国做过互惠生。我看到《金融时报》上刊登了一份公司治理官员的招聘广告。我当时完全不知道那是什么。大约五年前，英国发布了《卡德伯里准则》，这是当今英国公司治理准则的基础。\n\
  \n我去了图书馆——因为那时还没有谷歌——研究公司治理以及我为什么想要这份工作。听起来这可能很有趣。长话短说，我得到了那份工作，并且很幸运地见证了它如何发展，因为那是在英国公司治理的非常早期阶段。结果证明，管理是分析与政策的平衡，这正是我寻求的结合。那家公司是\
  \ Hermes 投资管理公司，它在全球都有投资，但主要投资者在英国。Hermes 的首席执行官 Alastair Ross Goobey 专注于一个想法，即像\
  \ Hermes 代表其客户那样主要以指数跟踪为主的投资者，应该在股东大会上积极投票，因为这是你向公司提供反馈的唯一机制。那时，我们主要关注董事会的独立性投票。那是二十多年前的事了，当时像我们这样的团队寥寥无几。当然，整个领域随着时间的推移已经扩大，我们现在专注于对更广泛的问题进行参与和投票，包括董事、高管薪酬、可持续性和财务绩效。\n\
  \n在 2009 年，也就是 Alexis 之前不久，我加入了贝莱德。我们建立了管理团队，从单纯关注代理投票转向，我可以说，一种更有价值的、通过与公司直接对话来支持的投票方式。因为贝莱德代表客户管理的股权资产中约有百分之九十是指数策略，我们的客户是长期锁定投资者。我们将管理努力视为履行我们对客户责任的一种方式，并代表他们就长期价值和风险驱动因素的问题发声。这正是可持续发展发挥作用的地方。\n\
  \n**Pagitsas：** Michelle，作为高管，你的领导理念是什么？\n\n**Edkins：** 我喜欢在这里工作的原因之一是贝莱德的宗旨，自公司成立以来一直保持不变。虽然表述的语言略有不同，但它始终是关于帮助越来越多的人实现财务健康。这对我来说非常有共鸣，因为我出生在一个经济并不宽裕的家庭。对财务不安全的感受是本能性的，即使我现在比小时候在经济上安全得多。\n\
  \n我们的使命是帮助更多的人体验财务健康，这样经历财务不安全的人就会越来越少。一旦你经历过这种感觉，它会伴随你一生。这听起来可能有些老套，但我们确实让世界变得更美好。我认为对这里的许多人来说，带着这个北极星般的宗旨来工作是激励人心的，它由我们如何在本年、本月、本周实现目标的策略和商业计划所支持，尤其是在事务繁杂的日子里。\n\
  \n**Pagitsas：** Alexis，你推动可持续发展议程的理念或方法是什么？\n\n**Rosenblum：** 我是在一个非常不同的背景下开始可持续发展工作的，来自公共政策和倡导领域。有趣的是，我在公共政策工作中学到的倡导技能，在我的可持续发展角色中受益匪浅。为了成功地被采纳，想法必须在整个组织中传播，并且必须赢得广泛内部利益相关者的支持。这不像要求变革或向一位高级或有权力的人提出一个很好的论点那么简单。这是随着时间的推移，逐渐与许多人建立势头。要做到这一点，需要极大的耐心和联盟建设。\n\
  \n\n\n可持续性工作之所以极具挑战性，原因之一在于你常常处于前沿地带，必须耐心等待他人接受你的想法。作为一名可持续性专业人士，你要将新理念引入公司，并将其融入传统思维模式。这并非总能在一夜之间获得支持。有时我们心中已有正确答案，但未必是让这个答案被倾听或认可的恰当时机。\n\
  \n因此，关键在于保持目标明确，并全面看待问题——我们会有很多关于实现目标的不同途径的想法。但这并不意味着，仅仅因为我们的小团队认为某个想法正确，它就必然能在短期内带来改变。我们需要有耐心去播下种子，并让它们随时间慢慢开花结果。我们已无数次见证过这一点。最终，几个月后有人会说：“当然，这就是答案。现在让我们向前推进吧。”\n\
  \n**帕吉萨斯：** 你必须对当前形势、业务状况以及组织与合作伙伴所面临的压力保持敏感，对吗？\n\n**罗森布鲁姆：** 完全正确。\n\n**帕吉萨斯：**\
  \ 让我们展望未来五到十年。你预期或希望可持续性与商业融合将达到何种状态？\n\n**罗森布鲁姆：** 我所预期的与我期望的相同，那就是一切将融为一体。我不认为将来还会有“可持续性人士”和“商业人士”之分。当我担任这个职务时，我意识到\
  \ ESG（环境、社会和治理）与可持续性有一系列不同的基本原则，这是我以往的传统金融培训所未曾教给我的。例如，在我参加 CFA 协会特许资格认证项目时，ESG\
  \ 并未真正纳入课程。如今，我正在与 CFA 协会合作，将 ESG 融入他们新制定的 ESG 标准中。我认为这种情况会随时间改变，传统教育机构（如商学院）将日益认识到，可持续性基础知识对其自身及其职业的未来至关重要。\n\
  \n在我们组织内部讨论 ESG 整合时，我们也能看到这一点——ESG 正逐渐成为传统金融投资决策过程的一部分。它不再是一件与众不同的事。我认为我们将继续看到这一趋势在未来不断扩展。\n\
  \n**帕吉萨斯：** 米歇尔，展望未来，对于 ESG 及其与商业的关系，你希望并预期哪些方面会保持不变或发生改变？\n\n**埃德金斯：** 我希望围绕气候行动的需求能形成真正的势头，不仅限于政府或私营部门需要采取的重大头条行动，也包括作为消费者和公民的个人必须做出的相当显著的改变，因为这需要集体努力。\n\
  \n这可能只是我因自身立场而产生的偏见，但我们过于关注企业能做什么，有时会忽略所需的微观改变。尽管如此，我预计未来几年消费者层面将发生重大变化。目前仍需大力提高人们对个人可采取的实际行动的认识。而对于企业能做的具体事项，以及政府为促成改变所需把握的全局图景，人们也需要更多了解。但目前，尤其是在\
  \ COP26 之后，我们仍过分关注那些宏大的姿态。\n\n就希望与预期而言，我们期待董事会能在多个方面挺身而出。自从二十多年前进入这个领域以来，我每年都可以这么说——但董事在确保适当的监督架构和尽量减少失误方面扮演着至关重要的角色。当高管们做出一些艰难决策，可能使其与某些股东、员工等产生分歧时，董事会需要为他们提供强有力的支持。董事会需要具备足够的能力来就这些决策为管理层提供建议和监督。如果公司因此受到批评，他们需要有勇气为管理层提供庇护。\n\
  \n最后，他们需要耐心和毅力，因为这是正在发生的长期转变。关键在于要拥有坚守信念的勇气——确信自己走在正确的道路上，并将坚持走下去；只要我们确信这对公司及其利益相关者（包括投资者）而言是正确之举，就要承受随之而来的批评。\n\
  \n\n\n"
