  **克里萨·帕吉萨斯：** 埃兹吉，请谈谈 AB InBev 的可持续发展情况。


  **埃兹吉·巴塞纳斯：** 作为全球领先的啤酒酿造商，我们在近 50 个国家开展业务，产品销往全球超过 150 个市场。我们喜欢将自己视为一家“全球本土化”公司。我们的大部分产品都是本地采购、酿造和享用的。这让我们与当地社区、供应链和经济体建立了无与伦比的联系，而这些正是我们可持续发展战略的核心。


  在 AB InBev，我们的使命驱动着我们，“大胆梦想，创造一个更多欢庆的未来”。对我们而言，一个更多欢庆的未来意味着我们的社区、我们的地球和我们的公司共享繁荣。从构建一个有韧性且敏捷的价值链，到巩固我们在当地社区作为值得信赖合作伙伴的角色，再到识别和把握新的商业价值来源，可持续发展在实现公司战略和使命方面扮演着关键角色。


  此外，我们的企业可持续发展努力使我们能够更真诚地回应日益增长的自觉消费主义。尤其是在疫情之后，我们看到越来越多的消费者变得具有环保意识和社会意识。同样，我们的员工也越来越多地在他们工作的公司中寻找共同的使命感和自豪感。可持续发展是现代劳动力真正关心的问题，不仅对吸引人才至关重要，对人才的参与和留任也同样关键。


