  #### 百威英博的可持续发展之路：专访


  彼时，我们主要关注自身运营中的可持续发展活动，例如水资源效率、能源效率、回收与废弃物管理。大约四年后，即 2017 年，我们将可持续发展职能划归采购部门，向首席采购与可持续发展官汇报。


  这一新的组织架构极大地增强了我们将可持续发展整合到供应链中的能力。我们开始与供应商进行更具战略性的对话，探讨如何重新思考未来。我们的创新管道中将会涌现出什么？我们如何共同创新以应对共同的挑战？这改变了原有的动态关系，从更具交易性的合作转向更具协作性的参与。这使得我们能够真正地在采购、物流和供应团队，也就是我们的整个运营团队中，将可持续发展付诸实践。


  为了扩大和加速影响力，我们在 2018 年推出了`Eclipse`，这是一个专为供应商打造的协作平台，旨在快速、大规模地推进可持续实践。`Eclipse`汇聚了百威英博庞大的供应商和合作伙伴网络，共同协作，在共同的可持续发展目标上取得进展。该平台提供由行业专家主讲的网络研讨会和研讨会，并提供分享最佳实践的机会。例如，近期的供应商合作促成了低碳易拉罐的推出、替代燃料配送卡车的引入以及环保冷藏箱的应用。这种与供应链的战略合作，反过来也为我们在`CDP
  2020 供应商参与度排行榜`上赢得了一席之地，在气候变化方面的供应链参与度评估中位列前百分之七。


  **帕吉萨斯：** 在你接受此次采访时，你刚刚被任命为百威英博首位专职`CSO`。恭喜你。请告诉我这个职位的由来。


  **巴塞纳斯：** 进入 2020 年，`ESG`（环境、社会和治理）议程变得比以往任何时候都更加紧迫。新冠疫情凸显了`ESG`绩效的重要性，及其对业务连续性和价值链韧性的关键作用。2021
  年 8 月，我担任了新设立的首席可持续发展官一职——这是一个专注于该领域的首席高管职位，直接向新任命的`CEO`米歇尔·杜克里斯汇报。提升可持续发展议程的层级，反映了我们通过`ESG`努力推动业务成果并创造共享价值的承诺。


  具体来说，设立这个职位使我们能够将在业务运营方面所做的工作用于构建韧性，并将其更紧密地融入公司战略，以制定一个更细致、更具前瞻性的`ESG`议程，从而推动我们的商业愿景。这是一段不可思议的旅程。我感谢我们全球团队的热情与投入，也感谢我们的`CEO`和董事会的支持。


  **帕吉萨斯：** 在百威英博的这段旅程中，似乎有两个关键点使可持续发展与业务更加紧密地结合在一起。首先是可持续发展团队并入采购部门，其次是你被任命为首席高管并向`CEO`汇报。


  鉴于你在百威英博组织架构的三个不同领域——企业事务、采购和高层管理——都有过经验，你认为可持续发展负责人身处组织的哪个位置重要吗？可持续发展职能应如何与高管团队、业务负责人以及运营职能进行合作？


  **巴塞纳斯：** 问得好。当你担任可持续发展职务时，向谁汇报的汇报关系不那么重要，更重要的是你是否获得了`CEO`和董事会的支持。就我们而言，我们一直拥有这种支持。我们非常幸运，董事会和`CEO`都理解并认同可持续发展的价值以及`ESG`的重要性。我们前任`CEO`卡洛斯·布里托，以及现任`CEO`米歇尔·杜克里斯，都是我们可持续发展议程的有力支持者。


  有了这种支持，我的角色让我能够参与到公司增长战略的讨论中。现在，我可以在制定能够推动商业愿景的可持续发展议程方面发挥更具决定性的作用。这为我提供了一个根本性的机会来推广新理念、讨论利益相关方的期望、建立内部共识，并帮助适应快速变化的外部环境。


  我坚信，如果你负责可持续发展，你必须相信一个更美好的世界是可能的，并且拥有长远和系统的世界观，这样才能真正把握全局。无论你身处组织中的哪个位置，你的同事和其他领导总会优先考虑他们自己的职能部门。作为可持续发展负责人，你必须着眼于整个企业，为所有领导者创造聚在一起的机会，并就问题和机遇达成共识。这才是这个角色的真正使命，无论你在组织中的位置如何。


  **帕吉萨斯：** 我完全同意你的看法。无论`CSO`身处哪个位置，高管层、业务部门、运营团队和可持续发展团队都必须共同承诺，将可持续发展作为企业核心战略的一部分，并将其融入日常业务决策中。


  你如何在百威英博将这种整合方法付诸实践？


  **巴塞纳斯：** 是的，确实如此。我们一直有一个核心的可持续发展团队。然而，我们也在全球范围内，跨越不同职能部门，建立了一个“团队之队”，负责执行我们的战略。作为一个目标驱动的组织，我们像对待任何其他业务举措一样对待可持续发展。我们设定与团队可变薪酬挂钩的目标，以营造共同的责任感和对使命的一致性。这个“团队之队”在我们处理可持续发展的方式中一直扮演着重要角色。现在，我们正在努力构建一个首创的、由社区驱动的职能。


  这并不是要在公司内部建立一个完全独立的可持续发展职能部门或组织。再次强调，这关乎你如何跨越学科边界和部门隔阂进行工作，以便能够进一步将可持续发展整合到运营模式中，实现长期成功。


  **帕吉萨斯：** 随着你继续将可持续发展融入百威英博，你对“团队之队”的方法会改变吗？你会问自己、你的团队以及公司哪些关键问题？


  **巴塞纳斯：** 我的团队将仍然是一个团队之队。我将继续致力于赋能公司各个团队的成员，让他们在日常工作中对可持续发展产生影响，无论他们是能源与流体总监、农学家、包装专家、品牌经理、企业事务负责人，还是负责创新的`VP`。


  我会问我的团队的关键问题是：“我们如何持续提高标杆，定义何为当今的下一代企业？”我认为这是可持续发展的下一个大浪潮——企业如何真正改变其制定战略的方式、如何为长期成功重塑其运营模式，以及如何为所有利益相关者重新构想价值主张。


  **帕吉萨斯：** 在可持续发展方面，不同国家或地区的消费者是否期望百威英博采取不同的行动？


  **巴塞纳斯：** 是的。我们在进行消费者洞察工作时确实看到了这种差异。根据不同的市场、监管环境、消费者行为和市场成熟度，你会看到这种变化。作为我们更新后的`ESG`战略的一部分，我们聚焦于八个战略性的`ESG`优先事项——水资源管理、可持续农业、创业精神、气候行动、循环包装、多元与包容、明智饮酒与适度、以及道德与透明度。




  我们确定了三个贯穿始终的核心主题——包容、自然、本土——它们概括了我们的身份以及我们创造共享价值的方式。在所有优先事项中，这些标志性主题使我们与众不同，当应用于不同市场时，它们的力量便显现出来。


  在巴西和墨西哥等发展中市场，我们计划通过为小微企业提供技术、融资和技能获取渠道来实现包容性增长。在美国和欧洲等发达市场，则是通过投资自然、让消费者重新认识简单天然的配料，从而实现我们产品组合的“高端化”。而在乌干达、尼日利亚和坦桑尼亚等新兴市场，我们将通过加强当地经济和支持小农户来构建我们的品类优势。


  这些主题让我们能够保持真实本色，并围绕当地最相关的议题以及更精准满足消费者需求的方向，来制定计划和传播信息。我们不能忽视当地的具体情况，也不能忘记我们仍需完成的工作。


  **帕吉萨斯：** 您和您的可持续发展团队是如何设定这些全球各地团队正在执行的目标的？


  **巴尔塞纳斯：** 我们的 2025 年可持续发展目标驱动着我们的短期行动。我们设定了到 2040 年实现整个价值链净零排放的雄心，这促使我们追求领先的创新，这些创新将随着时间推移在技术上变得可行、可规模化，并在经济上具备竞争力。为了设计
  2025 年的可持续发展目标，我在 2017 年召集了来自全球各地约七十位同事，他们分别代表采购、供应、物流、研发和企业事务部门。你会注意到，他们都来自业务运营端。如果让我再做一次，我还会邀请我们的商业部门同事，这样他们就能表达不断变化的消费者需求，促进产品创新，并有助于解锁更具真实性的故事讲述。这正是我们如今在进一步提升和完善可持续发展议程时所拥有的真正机遇。


  **帕吉萨斯：** 这些讨论得出了什么结果？


  **巴尔塞纳斯：** 我们开始深入审视我们的业务和价值链，并提出问题：“我们有哪些重大的创新机遇？我们如何能够创造韧性，或者使那些本地供应链正规化？” 基于此，我们制定了
  2025 年可持续发展目标，这些目标围绕四大支柱展开——水资源管理、智慧农业、循环包装和气候行动。我们采取了“由外而内的方式”，这样才能最好地设计出能够改变我们对业务和价值链的看法、以及我们如何与合作伙伴互动的各项举措。在设定目标期间，我们还邀请了外部合作伙伴提供反馈和战略指导。


  例如，我们的水承诺是：到 2025 年，在高压力地区，我们所在 100%的社区的水资源可用性和水质将得到可衡量的改善。这项承诺的关键部分在于“可衡量的改善”。我们在水资源管理方面取得了巨大进步，尤其是在食品和饮料行业。然而，在设计这个目标时，我们审视了多年来投资过的流域。然后，我们询问自己和我们在当地的非政府组织合作伙伴：“我们能否说这个流域的健康状况现在更好了？”
  当时的科学依据还不足以证明这一点。我们必须深入到基于当地具体情况的衡量指标中，理解当地的改善指标。水风险是非常本地化的。水安全非常复杂。我们希望与合作伙伴围绕可衡量的改善建立共同的责任感。这种方法受到了许多水问题专家的欢迎。


  接下来是我们的农业目标，我们的承诺是让 100%的直接合作农户具备技能、建立联系并获得经济赋能。这是我们对全球各地日益老龄化的农民群体的品牌承诺。我们直接从 13
  个国家的超过 20,000 名农户那里采购大麦、高粱、木薯、玉米、大米和啤酒花。无论是非洲的小农户还是阿根廷的商业农场主，我们都为他们提供作物品种、培训、及时洞察以辅助决策，以及用于建立韧性的金融工具。我们还在投资农艺指导和远程田间建议，以改善土壤健康和耕作实践，在降低环境影响的同时提高农民生产力。我们通过技术将他们与其他农民联系起来，以对比作物产量、天气数据和市场数据。通过`BanQu`（一个基于区块链的供应链平台），我们为坦桑尼亚、乌干达、赞比亚、哥伦比亚和厄瓜多尔的超过
  5,000 名小农户提供了更安全的支付保障和数字经济身份，使他们能够获得正规金融服务，同时提高了我们供应链的可追溯性。我们想要创建一个以农民为中心的承诺，因为我们知道，如果能解决农民的问题，我们也能解决自己的供应安全挑战。对我们来说，这是一个重要的洞察。


  作为循环经济的倡导者，我们的目标是到 2025 年，100%的产品包装要么是可回收的，要么主要由回收材料制成。到 2020 年底，我们近 75%的产品包装是可回收的（如啤酒桶和可回收玻璃瓶），或主要由回收材料制成（如罐装产品组合中回收材料含量超过
  50%）。


  这种可回收的双向瓶系统遵循着旧式的送奶工模式。在美国等市场，除了少部分地区，它几乎完全消失了。在全球许多市场，我们拥有独特的能力来保护和推广这种包装量。对于消费者来说，它的价格点更低；对我们企业来说，利润率更高；对环境也更好。这是因为根据市场条件，一个瓶子可以使用
  30 到 40 次。这种双向瓶系统减少了原生材料的使用，消除了浪费，并降低了碳足迹。类似地，我们持续利用内部专长和供应商的专业知识来测试和推广技术，以增加包装中的回收材料含量。这种方法帮助我们进一步消除包装浪费，减少对原生材料的需求，并降低碳排放。


  我们的最后一个承诺是气候行动。除了我们新提出的到 2040 年实现整个价值链净零排放的雄心之外，我们还有短期的气候目标。我们为承诺到 2025 年 100%使用可再生能源购买电力而感到自豪。我们并非打算通过购买可再生能源和碳抵消信用额度来抵消我们工厂的用电量。相反，我们正试图通过“额外性”来增加世界各地的可再生能源产能。在我们具备一定规模和体量的市场，我们有机会利用我们的需求和经验来帮助改造当地电网。


  我们是首批设定科学碳目标的 100 家公司之一。与 2017 年的基准相比，我们希望在 2025 年之前，将整个价值链（包括范围 1、2 和 3）的每单位饮料温室气体排放量减少
  25%，并将我们运营中的范围 1 和 2 的绝对排放量减少 35%。我们正在按计划履行这些承诺，并继续追求和推广深度脱碳的创新。




  **帕吉萨斯：** 我很欣赏你对量化分析的重视。对于领先企业而言，若想被视为值得信赖，这样做至关重要。在确定了承诺领域和目标之后，你是如何获得高层领导对这些目标的认同的？


  **巴塞纳斯：** 在整个目标设定过程中，很重要的一点是带领所有人一同踏上这段旅程，并尽早建立认同感。因为我们邀请了跨部门的同事加入目标设定流程，这自然就发生了。他们是战略制定过程中不可或缺的一部分。与此同时，我们还成立了一个由四位负责人组成的可持续发展委员会。我们会定期向他们和我们的
  CEO 汇报战略及目标设定的进展。现在，我们有六位来自不同职能部门的高管负责监督可持续发展治理工作。


  就在公开承诺发布前，我记得在一次领导层会议上，有人问我们：“所有这些目标听起来都很棒，也符合商业逻辑。但你们有多大信心能在 2025 年之前实现 100%的目标？”


  **帕吉萨斯：** 埃兹吉，你是怎么回应的？


  **巴塞纳斯：** 我们讨论了领导力的成本，以及有时我们可能不得不设定鼓舞人心或登月式的目标，以便找到新的路径并确立新的愿景。但我非常坦诚和透明。我说：“我们有
  85%到 90%的把握知道如何实现目标，但对于剩余的 10%到 15%，我们得找到新的工作方式、新的合作伙伴和新的创新来应对这些挑战。但是，我们不想设定一个 85%或
  90%的目标。我们想要设定一个 100%的目标，并努力去实现它，即使在困难的市场和充满挑战的环境中也是如此。”领导层接下来的问题是：“好的，很好，那我们打算怎么做呢？”


  当时会议室里有几位跨部门的领导非常支持这个议程，他们当场一致决定创建一个可持续发展加速器。这个决定不仅对我们实现目标至关重要，也为后来成为我们标志性项目之一的`100+加速器`铺平了道路。


  我们在 2018 年 3 月发布了目标。到了 8 月，我们就推出了`100+加速器`项目，该项目取得了巨大的成功。在项目启动的头两年里，我们加速了来自 16 个国家的
  36 家初创企业。


  截至 2021 年，我们正与新的企业合作伙伴一起运营第三期项目。我们与联合利华、可口可乐和高露洁-棕榄联手，与来自 20 多个国家的 35 家初创企业一起识别并试点新的创新方案。没有哪家公司能独自解决当今的可持续发展挑战。通过这些合作项目，我们可以共同努力，在利用全球最聪明才智的同时，催化可持续创新。外界有大量的创新。


  **帕吉萨斯：** 是否可以稳妥地说，在设定这些承诺时必须有信念上的飞跃？当你做出这些承诺时，你和加速器公司为实现承诺所需的所有技术并不存在，但通过相信创新的力量，你们会创造出它们。


  **巴塞纳斯：** 是的，没错。对我们来说，另一个重要因素是，我们确信自己了解并理解我们的业务和我们的价值链。没有这一点，你就无法设计出一个富有影响力的可持续发展项目。你需要了解业务的方方面面。你需要确保管理层和技术团队正在帮助你设计一个真正能产生影响力的可持续发展项目应该是什么样子。


  **帕吉萨斯：** 我们来谈谈 COVID-19 疫情。它对百威英博的业务产生了什么影响？


  **巴塞纳斯：** 我们首先在中国的业务中经历了疫情。我们的中国团队在应对疫情时展现了极大的敏捷性，并分享了经验教训。随着疫情蔓延到欧洲、非洲，最终到美洲，我们一直互相学习。


  我们与利益相关者应对的最大挑战之一是如何在确保供应安全的同时，又能安全地完成操作。例如，我们如何保持大麦采购中心开放，以确保我们农民的现金流？这凸显了寻找新方式来与供应商、客户（零售商）互动的必要性。2020
  年，我们生产并向 30 多个国家的医院和一线卫生工作者捐赠了超过 400 万瓶洗手液和消毒剂。我们向世界各地的前线急救人员提供了水和医疗物资，包括在巴西捐赠了
  300 万个防护面罩。我们在哥伦比亚、秘鲁和厄瓜多尔等市场调动了我们的卡车车队，与负责应对 COVID-19 危机的政府机构协调，将必需的食品和医疗物资运送到最需要的地区。我们在比利时、法国和荷兰捐赠了原本用于我们品牌广告的广告牌位，用于发布重要的公共卫生信息。疫情向我们表明，作为我们生活和工作的社区的长期合作伙伴，我们可以通过新的方式来服务并产生积极影响。


  **帕吉萨斯：** 如果有所改变的话，COVID-19 是如何改变百威英博和其他公司对可持续发展及 ESG 的看法的？


  **巴塞纳斯：** 大约在 2020 年 3 月和 4 月，我收到了许多外部利益相关者的提问。疫情是否意味着可持续发展战略将被搁置？这对联合国可持续发展目标意味着什么？我们的承诺会落后吗？其他公司的可持续发展同行也从他们的利益相关者那里听到了类似的问题。


  快进到 2020 年 11 月和 12 月，大家普遍高度认识到 ESG 的重要性，以及它对于业务连续性、价值链韧性和社区福祉的意义。这是 ESG 在资本市场崛起的一个决定性时刻。这是全球可持续发展议程的一个显著转变。


  **帕吉萨斯：** 能举一个资本市场关注的例子吗？


  **巴塞纳斯：** 我们看到了可持续金融的激增。2021 年初，随着可持续金融市场（尤其是 SLL【可持续发展挂钩贷款】结构）的快速成熟，加上我们因即将到期而需要为循环信贷额度（RCF）进行再融资，我们宣布了一项
  101 亿美元、与可持续发展挂钩的循环信贷额度，以加强我们对可持续发展的承诺。随着资本提供方继续设定自己的 ESG 目标，我们很可能会看到这一领域有更多的发展势头。


  **帕吉萨斯：** 你预计 COVID-19 会导致商业发生哪些变化？


  **巴塞纳斯：** 从疫情中得到的另一个重要教训是，环境、社会和经济可持续性之间的界限变得越来越模糊。我们第一次看到，生物多样性的丧失如何以全球大流行病的形式对公共卫生造成巨大影响，以及生计如何因此受到影响。所有这些话题都是紧密相连的。


  我深切希望这一点能继续得到认可，这样我们就不再试图孤立地应对这些挑战。你不能在不考虑水资源获取问题或不考虑农业社区生计的情况下，就单纯地去解决生物多样性或生态系统问题。这一教训促成了一个重大的范式转变，可持续发展战略需要接受这样一个事实：如果我们想要创造一个可持续、包容和繁荣的未来，我们必须“多管齐下”地解决问题。




  **帕吉萨斯：** 作为一位领导者，是什么驱使您去应对这些处于可持续发展与商业交汇点的艰巨挑战？


  **巴塞纳斯：** 对我而言，这始终关乎个人进步以及更广泛社会的发展。我认为我的成长经历塑造了这种心态。我在塞浦路斯出生并长大。我的父母在鼓励我思考进步、思考如何追求更好的教育和更崇高的目标方面，起到了关键作用。


  这促使我前往美国学习工程学。直到今天，我仍然依赖自己的好奇心和设计直觉，我喜欢迎接严峻的挑战，并且总是乐于学习新事物。对我来说，走出校门后找到一个能让我看到工作即时影响力并推动进步的职业领域至关重要。我很庆幸在职业生涯早期就找到了自己的热情所在，也很幸运能每天与一个多元且充满活力的团队一起工作，我们共享着同样深切的使命感、紧迫感和乐观精神，去创造一个拥有更多欢呼的未来。


  ### 3. 皮亚·海登马克·库克


  宜家首席可持续发展官


  皮亚·海登马克·库克在 2021 年 7 月之前担任 Ingka 集团（宜家最大的零售商）的首席可持续发展官。她领导了宜家到 2030 年实现对人类和地球产生积极影响的战略，并受联合国可持续发展目标（`SDGs`）的启发，致力于为大众创造更美好的日常生活。宜家是一个全球家居品牌，在
  61 个国家拥有 456 家门店，2020 年营收约为 400 亿欧元。


  在 2017 年被任命为该职位之前，她曾担任零售业务部门的可持续发展主管，并于 2008 年加入宜家，担任宜家基金会传播主管。皮亚在零售和酒店业拥有丰富的国际经验。她在可持续发展领域的深厚经验，源于她曾担任丽笙酒店集团负责任商业副总裁以及国际旅游业伙伴关系主席。


  皮亚担任可持续酒店联盟董事会理事，以及斯堪的纳维亚汉堡连锁店 MAX Burgers AB 和美国可持续材料公司 Origin Materials 的董事会成员。她曾与一位欧盟委员会成员共同担任零售商环境行动项目联合主席。她被气候组织评为气候变化领域前五名影响者，2020
  年被列入 Twitter 气候领域百大影响力人物榜单，并于 2018 年被世界可持续发展工商理事会评为可持续发展领域十大女性领导者之一。


  **克里萨·帕吉萨斯：** 让我们深入探讨宜家的可持续发展战略。它的范围是什么？


  **皮亚·海登马克·库克：** “宜家人类与地球积极”战略描述了整个宜家价值链的可持续发展议程。我们根据联合国可持续发展目标设定了到 2030 年的可持续发展雄心和承诺，我们希望对人、社会以及地球产生积极影响。


  我们确定了与业务高度相关的三大挑战——气候变化、不可持续的消费和收入不平等。为了应对这些影响宜家业务的重大挑战，我们确定了三项相应的战略，以帮助我们实现宜家的愿景和成为对人类和地球产生积极影响的雄心。


  让我们首先关注我们支持健康可持续生活的战略。我们的目标是，到 2030 年，激励并使得超过十亿人能够在地球边界内过上更美好的日常生活。我们的家以及我们的生活方式对我们的健康、福祉和地球有着巨大的影响。我们希望能够让更可持续的生活变得既负担得起又富有吸引力。


  这一战略的一个具体例子是，我们开发了能够让客户在家中过上更可持续生活的家居产品。我们通过所有销售渠道推广这些产品，从店内陈列和样板间到 `IKEA.com`。例如，宜家现在在
  14 个国家销售住宅太阳能电池板、节水水龙头、智能垃圾分类箱和节能型 `LED`（发光二极管）灯。这些产品使我们的客户能够减少他们在家庭中的环境足迹。此外，宜家还致力于通过使用更可持续的材料（如可再生和回收材料）来最大限度地减少其产品的足迹。宜家产品中使用的木材有
  98% 获得了森林管理委员会认证或属于回收木材。




  接下来是我们的战略：支持循环经济并实现气候正效益。到 2030 年，我们的愿景是在发展宜家业务的同时，成为气候正效益企业并实现资源再生。我们只有一个资源有限的星球。森林、渔业和农业承受的压力，生物多样性和野生动植物的丧失，海洋污染，土壤侵蚀，以及空气和淡水污染水平的日益加剧，正影响着全球数百万人的生活和生计。我们正在努力减少温室气体排放的一个例子是：在整个价值链中减少能源使用并转向可再生能源。在过去两年里，我们在整体业务增长的同时，按绝对值计算，减少了温室气体排放。因此，我们已开始将经济增长与气候变化脱钩。


  公平与平等是我们的第三个战略重点领域。到 2030 年，我们的愿景是为宜家整个价值链中的每个人创造积极的社会影响。我们相信，通过我们的业务，我们可以支持并推动积极的变革。我们的规模和范围既带来了责任，也带来了为许多人创造积极变革的巨大机遇。我们开展时间最长的工作与`IWAY`——宜家供应商行为准则——息息相关。该准则于
  2000 年推出，为我们的供应商设定了环境和社会要求，并要求宜家采购组织与供应商进行战略合作。


  **帕吉萨斯：** 让我们深入探讨宜家可持续发展战略的三大支柱之一——健康可持续的生活、循环与气候正效益，以及公平与平等。你想先谈哪个？


  **海登马克·库克：** 健康可持续的生活，因为我们业务的核心就是家居生活。这就是我们所做的。从概念上讲，健康可持续的生活从根本上关乎我们如何调整家居产品、家居生活解决方案和专业知识，使其适应地球的承载极限。这意味着要考虑整个产品开发周期和供应链。我们必须问自己：“产品中含有哪些成分？我们如何设计产品？我们如何从供应链中采购材料？”


  产品是等式中的一个重要部分，但另一部分是面向顾客的策略，无论是在门店还是在线上。我们必须问自己：“我们如何向顾客讲述这些产品是由回收材料、可再生材料，甚至可能是创新材料制成的？或者我们如何告知顾客，我们已经去除了某些物质，并对产品成分提出了更严格的要求？”我们可能还想告知顾客，某款产品具备了更强的功能。例如，如果顾客购买了一盏宜家
  LED 灯，他们不会浪费很多能源，可以尽情享受照明。如果他们购买了一个宜家水龙头，它比市场上其他水龙头节水 50%，这样既省水又省钱。


  这就是我们想向顾客传达的关于功能性和可持续性的故事。这是一件最复杂的事情之一，因为人们来店里是因为家里有需求。他们走进我们店时可能会想：“我需要一把椅子，我需要一张沙发。或者我需要灵感，因为我不知道怎么布置我的客厅。”他们不一定首先考虑产品的可持续性。


  然而，我们想讲述的是，你在宜家购买的所有产品都经过了我们严格的`IWAY`流程。无论是哪个供应商提供产品材料，我们都执行同样的行为准则。我们并没有为所有“有创意的、创新材料的产品”设置一个单独的类别，然后再为“其他产品”设置另一个类别。我们与所有为我们产品提供金属、棉花和木材的供应商合作。


  但讲述这个故事是一种挑战。我曾是几个宜家零售国家董事会的成员，这些董事会进行了针对各国的可持续发展研究。他们的研究结论是：如果你——制造商或服务提供商——说得太少，消费者可能会认为你在隐瞒什么，不够透明。如果你说得太多，消费者则会认为你在漂绿。那么，你如何找到那个让你值得信赖的黄金平衡点呢？这太难了。我认为我们还没有找到解决方案，但我们已经比几年前做得好多了。


  在宜家，我们正努力调整我们的沟通策略，以便我们产品的可持续性真正脱颖而出。我们正努力通过横幅和其他标识来加强店内的沟通，并为员工提供更多培训。如果你是一位顾客，对我们店里的一位员工说：“我想买一张新床”，那么店内的员工应该能够告诉你，我们的床垫是由更可持续的棉花制成的——通常来自“良好棉花倡议”，它们对你的健康有益，床垫中不含任何有害化学物质，并且在床垫使用寿命结束时，我们会将其回收，用于再循环。


  我确实认为我们今天讲述的故事比几年前更好了。而且我确信，再过几年，我们将能讲述一个更好、更精致的故事。如何以一种能与人们产生共鸣，但又不过分渲染和夸大其词的方式来讲述可持续发展的故事，这对我们和许多其他公司来说，都是一项正在进行的工作。


  **帕吉萨斯：** 宜家是一家全球性公司，在亚洲、欧洲和美国都有门店。例如，美国、欧洲、俄罗斯或中国的消费者对宜家可持续发展故事和战略的期望是否不同？


  **海登马克·库克：** 当然不同。在美国，关于可持续发展的讨论不像在欧洲那样普遍。这种情况在美国正在改变，但在北欧，人们对可持续发展的意识相当高。在欧洲，人们会讨论产品来自哪里、是谁制造的。他们似乎更能理解产品制造过程中所付出的辛劳和汗水。欧洲人的想法更倾向于“我需要爱护这个产品，我不能浪费它。”


  在俄罗斯，关于可持续发展的讨论更多地集中在“当前”的环境问题上，即那些显而易见且紧迫的废弃物和水污染问题。在中国，讨论则更多是关于产品如何影响健康。所以，我认为消费者关注的可持续发展方面因其所在的国家或地区而异。


  **帕吉萨斯：** 你们如何调整产品来满足这些多样化的消费者需求？


  **海登马克·库克：** 我们打造全球性的家居产品系列。如今，我们在门店和网站上销售超过一万种产品。我们为不同地理区域采购更多产品，并对产品系列进行部分本地化调整。我们会根据当地市场偏好进行调整。例如，我们进行大量本地市场调研，以了解哪些产品应该在该市场主推，或者哪个可持续发展故事最能引起消费者共鸣。但是，如果你去费城的宜家门店和上海的宜家门店，它们看起来或多或少是一样的，卖的产品也差不多。


  由于不同的地理区域和市场偏好，我不能说我对每个国家的本地行动抱有相同的可持续发展期望。然而，所有这些行动都必须服务于全球的可持续发展目标。我们对全球所有门店设定的一项期望是购买可再生能源，无论它们所在的国家是更难实现还是成本更高。我们知道，在某些国家，实现这一目标需要更多时间和支持。




  在一些国家，这很容易。在瑞典，我们可以从电网购买绿色电力。在其他国家，我们采取不同的方法。例如，在俄罗斯，我们投资了一个太阳能园区，它将为我们所有的十七家商店和购物中心供电。我们是第一家做出此类投资的非能源公司和国际公司。这需要资金、毅力和勇气来尝试新方法。不同国家的实施方法差异很大，但我们仍然拥有统一的可持续发展战略。


  **Pagitsas：** 想想你制定的可持续发展战略，公司和领导层是否立即采纳了它？还是说你遇到了障碍？


  **Heidenmark Cook：** 这是个非常好的问题。我觉得我经常得到“不行”的答复。我想说，当你第一次向同事或领导层提出一个想法时，会听到很多“不”。在我们
  2012 年第一版可持续发展战略中，我们讨论了在家庭配送和新店选址中使用电动车。在 2012 年，使用电动车是一个“不行”的决定。当时这根本不可能。无论是作为公司还是社会，我们都还没有准备好。


  然而，如今我们的战略已经转变。我已经代表公司签约，承诺所有家庭配送服务都将使用 100%的电动车或其他零排放解决方案。曾经的“不”变成了“是”。你需要有坚持不懈的毅力，知道将要发生什么、需要发生什么，然后保持耐心，直到合适的时机出现来推进新想法。


  **Pagitsas：** 你在其他公司工作时也需要同样的耐心吗？


  **Heidenmark Cook：** 在宜家之前，我在一家位于布鲁塞尔的酒店公司`Rezidor`工作。我在`Rezidor`的 CEO 对我说：“我并不总是同意你，但我知道你知道需要做什么。然后你坚持了下来。”七年后我离开时，我看了我的任务清单。那是我加入`Rezidor`那年的上半年写下的。我划掉了清单上的一些项目，但有些项目在我任职期间还没准备好去解决。不过他们现在已经完成了。这完全是关于变革管理。你需要带领人们一起前进，并且他们也需要做好准备。


  **Pagitsas：** 回顾大型全球公司中首席可持续发展官（`CSO`）的职责，很少有人同时负责一条业务线和领导可持续发展战略。为什么这些职责范围在公司内部没有更频繁地结合在一起呢？


  **Heidenmark Cook：** 我认为它们可以结合，而且未来会越来越多地结合。我正在参加一个名为`The International Directors
  Programme`的`INSEAD`商学院高管课程，该课程面向在公司董事会任职的高管。我们有一个主要专注于财务的价值创造课程。`INSEAD`教授谈到了利润与目标之间看似对立的关系。商业领袖以及整个社会仍然认为，从事可持续发展工作是无利可图的，并且投资者对可持续发展不感兴趣。


  这位教授的理论是，这种假设已不再成立。然而，我们仍然带着这种成见。因此，认为盈利能力和目标是对立的这种观念确实存在，这就是为什么你不能同时担任业务部门负责人和`CSO`。一个负责“真正的事情”——业务，让你养家糊口；另一个负责“好事情”。


  我认为这两个角色将会合并，但这还需要一段时间，因为目前关于这两个角色的职责范围仍然存在一种错误的说法。在业务方面，有些人可能会想：“这是业务中你需要考虑短期利益、做出艰难决策的部分。”而对于可持续发展方面，同样这些人可能会想：“这是业务中你需要长远考虑、以人为本的部分。”因此，他们用短期与长期的时间框架（也称为“地平线悲剧”）来证明角色分离的合理性。但我认为它们不应该是分开的。


  **Pagitsas：** 确实，非可持续发展部门的商业领袖通常需要完成季度和年度目标。相比之下，像你这样的可持续发展领导者则要考虑未来十年甚至二十年的目标。2018
  年，宜家设定了要在 2030 年前实现的目标。你和你在宜家领导业务部门的同事们是如何管理不同的时间线的？


  **Heidenmark Cook：** 在宜家，我们是零售商。我们按周、按天甚至按小时的时间线运作。重点始终是了解货架是否饱满，以便产品能够进出。例如，一条短信会发送给全球员工，通报最近一周的销售业绩。在销售一线，每天或每小时都会对销售结果进行跟进。我们按年度财务预算周期工作。传统上，我们的战略业务计划是按年制定的，但我们已经开始更多地制定三年计划。


  当我第一次介绍跨度到 2030 年的可持续发展战略时，所有人都说：“哇，我们把自己逼得太紧了！”作为回应，我说：“我们还有三个三年计划，然后我们就到 2030
  年了。那么，现在需要做什么才能让下一个三年计划乃至下下一个得以实现呢？”通过这种方式，2030 年的目标变成了短期的截止日期。这有助于组织认识到：“2030 年并不遥远。”


  管理“当下”的业务要求很高。当你与很多人进行“敞开心扉的谈话”时，他们在意，并且希望考虑可持续发展。但随后他们被日常事务缠身，会议一个接一个，处理人事问题，应对销售下滑，以及解决危机。然而，我理解这些压力，也知道有时我们无法立即开会制定可持续发展解决方案。


  **Pagitsas：** 除了短期与长期的时间跨度差异外，传统商业领袖似乎还有另一个不同维度，那就是成功的衡量单位。作为`CSO`，你正在推动宜家到 2030
  年“在地球极限内，激励并让超过十亿人过上更美好的生活”。这个目标关注人们的体验和地球的自然资源。相比之下，另一位同事可能正在努力实现每平方英尺商店的特定利润率目标。这两个目标会继续各自为政，还是会更加融合到商业决策中？


  **Heidenmark Cook：** 我认为它们现在是孤立的，但我认为随着你开始制定价值创造目标，未来这种情况会减少。到目前为止，我想说重点一直放在营收和利润上。这是两个关键绩效指标（`KPI`）。然而，当我在房间里，人们在定义营收和利润目标时，我能够说：“这些不是唯一的目标。我们还有人本目标，我们有客户目标。”我们正在开始改变，审视我们如何最好地贡献于客户、同事、社区、环境以及公司的利润，但这就是我们正在经历的转型。


  例如，我们在气候方面已经取得了相当大的进展，并将其视为一个首要目标。我们现在可以看到，如果我们在这里投入一美元，会得到什么样的结果，以及我们是否能实现如此显著的二氧化碳减排。我们也可以分析我们在可再生能源方面的投资结果，例如，在这个国家投资与在那个国家投资相比，是否能获得同样的美元回报。这种分析水平的达成需要时间，因为你需要在项目启动时就将二氧化碳数据与财务数据结合起来，以进行更好、更有洞察力的对话。




  建立理解“我在业务可持续性方面所做的决策也会影响公司整体财务目标”的能力或知识需要时间。最近我们与高层领导进行了一次关于气候的会议。气候是一门商业语言，就像金融是一门语言一样，因此一些领导说“这太复杂了”也就不足为奇了。我的回应是：“是的，但每个人都可以学习它。”我们会达成目标的，但这关乎时机，关乎`KPI`，也关乎学习一门新语言。


  **帕吉塔斯：** 你的日常工作在哪些其他方面与你在宜家的高级行政同事不同？


  **海登马克·库克：** 我花大量时间与公司外的人员和合作伙伴互动。我的大多数同事则主要在公司内部工作。


  **帕吉塔斯：** 你如何对比你的“对外”工作与同事的“对内”工作？


  **海登马克·库克：** 在一些公司，作为首席可持续发展官，你向营销与传播团队或负责声誉的企业事务部门汇报。而我则向业务部门和副首席执行官汇报。通过这种组织结构，我的大部分工作是为业务部门和副首席执行官提供洞察和远见，关注那些在未来五到十年会影响我们、且我们今天就需要开始准备的事项。我需要花大量时间在外部保持曝光。因此，我与众多其他品牌、公司和行业进行互动。例如，我参加专家小组讨论，并在会议上发言，与其他分享可持续发展经验的公司交流。我与我们的合作伙伴互动，比如世界可持续发展工商理事会。我还与其他公司的`CSO`进行同行对话。


  我认为，作为可持续发展领导者，寻求指数级增长并思考“我们如何为此做准备？”是工作的本质。我的整个工作就是变革管理。这就是我所做的。


  **帕吉塔斯：** 皮亚，之前你在谈论二氧化碳排放时提到了*成果*这个词。*成果*和*产出*有什么不同吗？那*影响*这个术语呢？它们可以互换使用吗？


  **海登马克·库克：** 不，这些术语不能互换。产出是你可以相对较快看到的东西。例如，你推出一个易于购买的好网站，你就会得到产出，即销售额增长。或者你进行一次激活营销活动，吸引人们进店，你就会得到产出，即销售额增长。产出与你投入的东西是相关的。你可以看到产出的结果，而且时间跨度不会太远。


  谈到成果，你可以问：“销售额的成果是什么？它创造了更多就业机会吗？它是否创造了某些我们可以再投资并用来做好事的东西，比如开一家新店、支持慈善机构或投资可再生能源？”所以这更像是*成果*的含义。它导致了什么？它是否产生了积极的成果？而*影响*则更长远，它会问：“我们的行动对环境和社会的长期影响是什么？”在商业领域，我们通常只衡量产出。


  **帕吉塔斯：** 听起来，就像你之前提到的，这正是拥有远见的重要性所在，以便创造那种长期影响。让我们把时间拨回，聊聊你成为宜家首席可持续发展官的经历。你的职业生涯中有没有什么关键的转折点？


  **海登马克·库克：** 有好几个！最早的转折点之一是在商学院学习，然后跟随一位非常有启发性的老师学习环境经济学。那是我第一次了解到未计入的外部性。这意味着所有消费都会产生后果，而这些后果可能没有被计入商品价格中。消费会影响水、空气、土壤等等。那是我的一个“顿悟”时刻。完成商科学位后，我攻读了环境经济学的硕士学位，然后又继续攻读博士学位。


  在攻读博士学位的过程中，我意识到我厌倦了研究和分析公司，我更想与公司一起工作。我想成为“实干”团队的一员。当我考虑退出博士项目时，我的教授劝我留下，因为再有一年我就能拿到博士学位了。然而，我的回答是：“好吧，但谁知道是不是真的一年呢？我准备好了。我想进入商界去实践。”在瑞典，你可以退出博士项目并获得一个副博士学位，它被认可为博士前的学位。于是，我退出了项目，加入了丽笙酒店。


  在丽笙，他们很早就意识到可持续发展作为一种商业战略正在兴起。我从零开始建立了他们的可持续发展战略。首席执行官对我说：“我知道我们需要做些事情，但我完全不知道需要做什么。”那是非常棒的七年，在遍布五十个国家的酒店中建立了可持续发展的战略。


  当我想搬回瑞典老家时，宜家是*最*理想的工作去处。当我加入宜家时，我意识到这里的雄心壮志与丽笙酒店完全不同。在宜家，我们开发和将消费品推向市场，所以你必须考虑整个价值链。而且宜家做可持续发展的时间要长得多。宜家的第一份环境政策始于
  1989 年。


  在英格卡集团（宜家体系内最大的零售商）中，我们的两大业务部门是零售部门和购物中心部门。在覆盖三十个市场的零售部门内，大约有 400 个顾客接触点，人们可以在这些地方购买宜家家居产品或在宜家餐厅用餐，包括独立门店、市中心门店、提货点以及`IKEA.com`。购物中心部门则负责我们在大型零售综合体中的业务战略，这些综合体包含宜家门店和其他品牌，分布在欧洲、亚洲和俄罗斯的大约四十个购物中心内。


  **帕吉塔斯：** 你是如何担当起这些重要的领导角色的？


  **海登马克·库克：** 我喜欢把握全局。我喜欢看事物是如何与管理团队关联起来的，并理解各个部分是如何组合在一起的。我想我也总是勇于尝试。如果有人让我做某件事，我会说：“为什么不呢？我来做。”然后我就投入进去。所以，我想这就是我能走到今天这个位置的原因。


  **帕吉塔斯：** 听起来，在你的职业生涯中，有一种不害怕“新事物”的特质。你在丽笙和宜家承担的角色，以及你制定的策略，都是全新的。没有现成的路线图可以遵循。


  **海登马克·库克：** 绝对是。我嫁给了一位企业家。和他相比，我简直太循规蹈矩了！他创办企业。然而，我也喜欢成长和发展，学习新事物，并勇于尝试。我不是现有业务和流程的维护者。我不介意描绘出需要发生的事情的图景。不需要别人为我描绘。我喜欢自己描绘并亲手构建。


  **帕吉塔斯：** 在结束我们的谈话时，我想请你谈一下对可持续发展领导者的看法。特别是在营利性公司中，似乎有很多女性领导可持续发展及`ESG`战略。你对此有何观察吗？




  #### 海登马克·库克：关于我们如何领导以及为何领导，有些值得探讨之处。


  一位名叫`Dr. Scilla Elworthy`的杰出女性从事和平谈判工作。我在一次会议上遇见她，之后主动联系了她，因为她实在太酷了。她写了一本书，名为《强大的心：如何转化冲突》[(自出版，2020
  年)]。她谈到“**女性智慧**”，这与“**女性智力**”不同。男性也可以具备这些特质。其核心在于勇气、深度倾听、相互依存和直觉。她写道，这是我们通常拥有的东西，尽管并非所有女性都具备。这种女性智慧包括理解协作与相互依存。我认为，在可持续发展的本质中，有些东西与这套技能是相通的。


  **帕吉萨斯：** 牢记女性智慧这个概念，你是如何领导团队的？


  **海登马克·库克：** 我从不，或者说很少，依靠职位权威来开展工作。可持续发展是一个跨职能的议题，所以你总是需要通过影响和激励来推进。我需要通过吸引人们参与，让他们愿意成为可持续发展旅程的一部分，来施加影响。


  即使在我自己的团队中——这个团队负责全球可持续发展的职能——作为管理者，我也需要做出最终决定。我选择通过信任团队、明确方向并共同制定前进道路的方式来领导。我只是相信，这是一种比依靠权力和权威更好的、更友善的领导方式。


  ### 4. 维吉妮·埃利亚斯


  宝洁公司首席可持续发展官


  *维吉妮·埃利亚斯是宝洁公司（P&G）的首席可持续发展官。宝洁是一家跨国消费品公司，致力于提供品质卓越、物超所值的品牌产品，以改善全球消费者的生活。该公司在十个品类中运营，产品性能驱动品牌选择——织物护理、家庭护理、婴儿护理、女性护理、家庭护理、护发、皮肤与个人护理、口腔护理、个人健康护理以及美容护理——在
  2021 财年，其净销售额超过 760 亿美元。*


  *在担任此职务之前，维吉妮曾负责宝洁多个数十亿美元的品牌，包括潘婷、汰渍和帮宝适。作为公司最大品牌之一 Ariel 的西欧品牌负责人，她发起了非常成功的“Cool
  Clean/Turn to 30”活动，这是宝洁首个面向消费者的可持续发展项目。*


  *维吉妮拥有丰富的国际经验，曾在法国、英国、瑞士和美国工作。她也是一名认证教练，专攻变革管理和领导力发展技能。*


  **克里萨·帕吉萨斯：** 宝洁是一家全球知名的公司，拥有数百个品牌，从潘婷、帮宝适到博朗和汰渍，每个消费者都认识并拥有它们。宝洁的“2030 雄心”战略如何应用于您的业务战略和品牌？其范围是什么？


  **维吉妮·埃利亚斯：** “2030 雄心”是我们的路线图，旨在通过我们的品牌，在整个价值链、员工和合作伙伴中，促成并激励积极的环境和社会影响。它涵盖了宝洁能够利用其规模、影响力、创新能力和品牌领导力，来加速发展循环和再生经济的所有领域。这包括我们的气候风险应对工作、废弃物管理计划、可持续采购和再生林业努力，以及水资源管理战略。


  在气候风险方面，我们已承诺到 2040 年实现我们自身运营及从原材料到零售商的整个供应链的温室气体[GHG]净零排放，并设定了到 2030 年的中期目标以取得实质性进展。我们还分享了《气候转型行动计划》，该计划概述了加速气候行动的全面方法，以及到
  2030 年面临的关键挑战。在产品类别层面，我们的旗舰品牌汰渍和 Ariel 已承诺对洗衣过程的每一步进行脱碳——从我们投入的原料，到消费者如何使用产品（这是最重要的环节），最后到产品的处置。


  我们的废弃物管理计划旨在减少自然界的塑料泄漏，目标是将原生石油塑料用量减少 50%，使 100%的包装可回收或可重复使用，并成为跨行业努力的催化剂，投资于可扩展的解决方案，以改善全球废弃物管理基础设施。宝洁是“终结塑料废弃物联盟”的创始合作伙伴，我们的首席执行官从
  2019 年 1 月至 2021 年 11 月担任该联盟主席。


  我们的可持续采购和再生林业工作专注于支持棕榈油和木浆的可持续采购。我们与行业和非政府组织合作，以实现对森林有利的供应链。我们产品中每使用一棵树，至少会再种植一棵。




  最后，水是人民和宝洁的宝贵资源。我们 70%的产品都需要用水。因此，我们正在三个不同层面努力，以大规模应对水挑战。首先，我们在产品中运用节水技术的力量。例如，我们配制的洗碗机洗涤剂
  Cascade 能让消费者省去预先冲洗碗碟的步骤。通过省去预洗环节，碗碟反而更干净，同时还能节水，因为 Cascade 和洗碗机协同作用，能去除附着在餐具上的食物残渣。另一个例子是使用我们的`Swiffer
  WetJet`产品替代传统的拖把和水桶来清洁地板。这一简单的改变，每年可为每个家庭节省 70 加仑的水。


  其次，我们与行业伙伴及非政府组织合作，目标是在全球 18 个重点水域保护水资源，造福人类与自然。我们已在加利福尼亚州的美国下流域盆地启动了一个项目，目标是保护或恢复
  33 亿升的水资源。第三，我们发起了一项名为“50 升家庭联盟”的跨价值链水倡议，旨在重塑城市生活用水方式。该联盟的目标是让人们每天人均用水量达到 50 升即可舒适生活，而美国目前的平均用水量是
  260 升。


  **帕吉萨斯：** 你们在实现这些目标方面进展如何？


  **赫利亚斯：** 在气候方面，我们的运营取得了巨大进展——在过去十年中实现了温室气体排放绝对量减少 50%。我们通过减少工厂的排放以及在北美和欧洲购买 100%可再生电力实现了这一目标。这已经完成了我们碳中和目标的一半，我们正在继续尽可能地减少排放。然而，对于主要来自热能的排放，目前还没有可行的可再生能源替代方案。为了平衡这些残余排放，我们投资于自然气候解决方案，并与保护国际、世界自然基金会（WWF）和
  Arbor Day Foundation 等组织合作，以保护或恢复关键的自然生态系统。


  我们正在开发一系列项目，这些项目不仅能带来碳效益，还能为生物多样性、粮食安全以及依赖这些生态系统生存的社区的福祉创造协同效益。识别这些项目需要与保护专家、地方政府和社区进行全新层面的合作，以确保所有利益相关者和自然都能因这些投资而繁荣发展。


  要在应对全球挑战所需的速度和规模上产生积极影响，所需的合作水平和范围正在不断提高。需要进行系统转型式的合作。我们仍在学习如何有效地做到这一点。在许多方面，这种程度的系统转型是前所未有的。


  让我给你举两个例子。在循环经济方面，宝洁发起了一项名为“圣杯”（HolyGrail）的倡议——利用嵌入包装表面的数字水印，使回收商能够更准确地对包装进行分类，从而提高回收材料的价值。这是发展循环经济的关键。该项目已推进到圣杯
  2.0 阶段，由欧洲品牌协会（AIM）推动，并由终结塑料垃圾联盟提供支持。目前，该项目正与整个塑料价值链上超过 130 家参与者组成的联盟一起进入市场测试阶段。我们相信它有潜力彻底改变回收行业。


  其次，“50 升家庭联盟”也关乎家庭的脱碳，因为更低的用水量将使分散式电网更容易实现。如今，住宅和建筑占全球温室气体排放量的三分之一。该联盟由苏伊士、科勒、伊莱克斯、凯谛思、ENGIE、宜家、格兰富和宝洁等公司共同组建。它由世界可持续发展工商理事会、世界经济论坛和世界银行的“2030
  水资源组”主持，将在多个城市试点“50 升家庭联盟”。


  **克里萨·帕吉萨斯：** 您是如何成长为宝洁首席可持续发展官的？


  **维吉妮·赫利亚斯：** 我投身可持续发展，有点像《高卢英雄传》故事中的奥贝利克斯掉进魔法药水里。那是一次意外。现在，我称之为`机缘巧合`（serendipity），你会明白为什么的。当我
  1988 年加入宝洁时，其实是想从事市场营销工作，而且我一干就是 23 年。我有机会管理多个价值数十亿美元的品牌，如潘婷、Ariel、汰渍和帮宝适，并曾在不同国家工作，如法国、英国、美国，现在则在瑞士。


  “`可持续发展`”这个词是在 1987 年定义的，所以我加入宝洁时，它还是一个非常新鲜的概念。我甚至不知道怎么拼写它！也许是巧合，但我作为年轻品牌助理的第一个项目就是推出无磷的
  Ariel。当时对我来说，这不是一个可持续发展举措，只是一个营销策略。


  后来我调到帮宝适部门，负责推出紧凑型纸尿裤，这是一项重大的环境进步。然而，在当时，它对我来说只是锦上添花的事情，因为我自认为是在做正经的业务。直到多年后，我在欧洲领导
  Ariel 品牌时，才真正转向可持续发展。那时，该业务表现不佳。我尝试了很多重振业务的想法，最终脱颖而出的一个是：“Ariel 洗得如此干净，你可以用低温洗衣。”
  这在当时并非一个可持续发展承诺，纯粹是关于产品性能的。然而，我在 2006 年应对这个挑战时，恰好也是阿尔·戈尔推出他的电影`《难以忽视的真相》`的同一年。


  看完电影后，我第一次意识到了全球变暖的意义。我被这部电影深深震撼，并带我整个团队去观看。与此同时，我也发现了生命周期评估的科学概念，这是一种衡量产品从原材料提取到最终处置所有阶段碳足迹影响的方法。我了解到，对于洗涤剂来说，最大的足迹影响来自于加热洗衣机中的水。这占洗涤剂从成分、制造到消费者最终使用整个总碳足迹的
  80%。


  那一刻我豁然开朗。我的“Turn to 30”活动鼓励消费者将洗衣机水温调至 30 摄氏度（或 86 华氏度）。这在商业上取得了巨大成功，同时也为减少我产品的碳足迹所能做的最好的事情。从那天起，我认识到可持续发展既能推动业务增长，又能对地球产生积极影响。我开始自愿参与其他可持续发展项目。时任宝洁欧洲总裁是可持续发展的忠实拥护者，因此他成立了一个内部可持续发展委员会，我作为市场营销职能的代表加入其中。




  在每天工作之余兼顾可持续发展事务几年后，我决定将这件事提升到新高度。我参加了世界自然基金会（WWF）在瑞士洛桑国际管理发展学院（IMD）举办的“地球领袖研修班”。周围都是可持续发展领域的专业人士，而我是来自市场营销的“异类”。到那周结束时，我意识到如果能把可持续发展变成我的本职工作，那么我对企业产生的影响将远超仅作为
  Ariel 品牌创新负责人所做到的。在研修班上，我郑重承诺：“我要让可持续发展成为我的工作。”尽管当时完全不知道如何实现，也不清楚这意味着什么。但这就是设定目标的意义——一旦下定决心，事情就会开始运转。


  培训结束两周后，我飞往辛辛那提求见 CEO。我做了一些功课，发现许多大公司都开始让业务领导者来负责可持续发展事务。我基本上是在游说 CEO 创建一个新职位，这个职位要成为可持续发展科学与商业之间的桥梁。我说：“我认为这是个巨大的机遇，而且，顺便说一句，这就是我想要的工作。”他回答：“好。”从那时起，我开始从零起步，怀着唯一的使命：让可持续发展成为我们创新、打造品牌和建设文化的一部分。


  这就是我过去十年一直在做的事。2019 年，我被任命为宝洁公司首位首席可持续发展官，如今已成为执行委员会成员。这足以说明可持续发展在宝洁已成为优先事项。


  **帕吉萨斯：** 可持续发展在组织架构中处于什么位置？


  **赫利亚斯：** 它最初位于我们最大的业务部门——家居护理。随后，我们设立了一个与所有业务部门相关联的全球首席可持续发展官职位。当我被正式任命为首席可持续发展官时，我确保自己的职位扎根于业务之中。我一直向最大的业务单元负责人汇报工作。这非常有助于实现我的目标——将可持续发展融入我们的业务。


  **帕吉萨斯：** 为什么隶属于业务部门如此重要？


  **赫利亚斯：** 这关系到从“企业社会责任”（CSR）向“可持续发展”的转变。CSR 是旧思维，核心是“与公益相关的项目”，比如慈善捐赠、资助计划和员工志愿服务。这并非坏事，但不可持续。CSR
  是一个部门，而可持续发展是一项商业战略。CSR 是一条独立的轨道，我们称之为“附加”而非“融入”。如今我们知道，要想继续经营下去，就必须改变经营方式。这就是为什么可持续发展是一项商业战略，并且要扎根于业务之中。


  向人们解释可持续发展的兴起及其在公司的角色时，我常用数字营销做类比。十五年前，数字营销是一个独立的学科。你制定营销活动，制作电视广告，如果预算和时间还有富余，才会说：“哦，我们在网上做点什么？”而如今，我们的整体组合持续调整，数字营销和
  OTT 流媒体的份额日益增长。


  这正是我们希望可持续发展达到的状态，并且它正朝着这个方向发展。虽然尚未完全实现，但如果五年后你问我，可持续发展将融入核心业务战略，我的职位也将变得多余。


  **帕吉萨斯：** 你每天做些什么来推动可持续发展并将其融入公司？


  **赫利亚斯：** 过去十年里，我每天的工作内容发生了巨大变化。头两三年，全都是关于变革管理的策略。我兼职担任高管教练的经历帮了大忙，因为当时我的工作重点是理解领导者们做或不做可持续发展的深层动机。有时是“我需要对这件事做点什么”，有时则是“好吧，给我点能让我的业务与众不同的东西”。


  我会说：“任何动机我都接受。”然后我开始与我称之为“百分之一”的人合作。这些人已经深信可持续发展的价值。我说：“我要从这些‘愿意者联盟’开始，而不是用我有限的精力去说服那些怀疑者。”现在怀疑者少了，但当时很多。他们看不到可持续发展如何能成为品牌价值主张的一部分。我说：“如果我能和那百分之一的人做出成绩，就能引发一场运动，达到引爆点。”我与那百分之一的领导者合作，开始进行实验。


  **帕吉萨斯：** 与百分之一合作有哪些例子？


  **赫利亚斯：** 我们做的第一件事是与 TerraCycle 合作，回收部分难以回收的包装。TerraCycle 是一家致力于消除“废弃物”概念的公益企业。我们在空气护理品牌
  Febreze 上展开合作，开发了一个非常有影响力的项目：邀请人们将空包装带回，这些包装将被改造成学校游乐场。这非常非常新颖。我们就是这样开始的。类似这样的实验我们做了很多。十年后，我们与东京
  2020 奥运会和残奥会组委会通过“全民领奖台项目”的[合作](https://urldefense.com/v3/__https:/news.pg.com/news-releases/news-details/2021/Procter%252D%252DGamble-in-Partnership-with-the-Tokyo-2020-Organizing-Committee-and-the-International-Olympics-Committee-Unveils-Olympic-and-Paralympic-Games-Tokyo-2020-Medal-Ceremony-Podiums-Made-of-Recycled-Plastic/default.aspx__%3B%2521%2521BupLon6U!8yyRBg0Siy3oTliBOJC6mcTuyF0ACxuYsVPUxY9fZuigzpks4y6Ma9b0D33PjTllFkPVlw$)
  制造出了首批完全由公众收集和海洋回收的再生塑料制成的颁奖台。


  但真正的引爆点是推出首款采用法国海滩回收塑料制成的海飞丝洗发水瓶。在宝洁，品牌建设和创新是我们的超能力。这次变革的强大之处在于，它是一个由品牌主导的创意。我的同事莉萨·詹宁斯负责全球海飞丝品牌业务，她提出了这个想法。为了让消费者意识到回收的重要性，他们改变了品牌的视觉资产——这在宝洁并不常见——将瓶子从白色和蓝色改为灰色，因为它由混合塑料制成。这是一个非常强烈的信号。


  2017 年 1 月，我们在达沃斯世界经济论坛上发布了这款新瓶子。这是当年达沃斯的亮点之一，但对我来说最激动人心的还是它在公司内部产生的影响。我手持用海滩塑料回收制成的灰色瓶子的新闻发布会照片被广泛分享和点赞。这就像在宣告：“我们现在要向全世界宣布我们在做什么，而且我们是通过品牌来做的。”




  这一声明发布后，我们内部的许多品牌建设者开始关注可持续发展。这很有意思，因为过去那些以商业案例为借口不参与的人，如今都全力投入了。我曾说：“但你知道，海滩塑料回收瓶的成本是普通瓶子的四十倍。”他们会回答：“我不介意。这是个绝佳的品牌创意，正是我想要的。”这些实验和试点项目为构建这个著名的商业案例发挥了重要作用。在品牌上进行实验是一种非常强大的策略，这是一种自下而上的策略。当你充分实施后，就可以开始自上而下的行动。


  我是在很久之后才采取自上而下策略的。这时你要系统化地推进，请 CEO 强制执行，并使其成为所有体系的一部分。我们创建了`Brand 2030`，这是我们全新的品牌建设框架，旨在赋能营销人员将可持续发展作为品牌战略和激活的核心组成部分。我们设定了一个目标：所有领导品牌——占我们销售额
  80%以上并引领品类的 20 个品牌——都将实现并激发负责任的消费。


  宝洁的增长模式基于我们所谓的“五大卓越要素”。要发展你的品牌，你需要拥有卓越的产品、卓越的包装、卓越的沟通、卓越的零售执行以及卓越的消费者和客户价值。我们的`Brand
  2030`框架在此基础上更进一步，要求品牌定义其“北极星”——一个与品牌资产相符、并通过切实行动逐步实现的可衡量的社会或环境承诺。我们还通过将可持续发展作为核心要素来拓宽卓越的概念。这正是我们消费者所期望的。


  **帕吉萨斯：** 推动宝洁内部其他 99%的合作伙伴参与可持续发展的动力是什么？是十个不同的原因，还是只有一个？


  **赫利亚斯：** 这是看到可持续发展试点项目推动业务增长，以及消费者期望不断提升的共同作用。十分之九的人表示，当一家公司支持社会或环境事业时，他们对该公司有更正面的印象，一半的人表示会根据与品牌共享的信念做出购买决定。


  我创造的`Ariel Cold Wash`故事至今仍是最有力的可持续发展与品牌故事之一。我们提供了一款性能卓越的洗衣液，能用冷水去除污渍，减少了碳足迹，并推动了业务增长。这是一个三赢的局面。你可以在发展业务的同时为地球做好事，这有什么不喜欢的呢？今年，我们推出了新一代`Ariel
  Cold Wash`创新和传播活动，名为“Every Degree Makes a Difference”（每度都不同），并为`Tide`推出了类似的活动“Cold
  Callers”（冷水倡导者）。


  因此，随着内部成功案例的增多和外部期望的不断提高，现在的问题不再是“我们该不该做？”，而是“我们该怎么做？”以及“我们能做得多快？”我们已经从为可持续发展构建商业案例，转向了如何出色执行可持续发展战略的“行动指南”，以便在推动业务增长的同时扩大我们的积极影响。


  **帕吉萨斯：** 您谈到了快消品行业全球性公司的三个非常重要的利益相关者——消费者、零售商和投资者。他们向宝洁提出的要求是各不相同，还是趋于一致？


  **赫利亚斯：** 总体而言，他们要求的是同一件事，那就是“我们想要更多，并且要更快。”当你深入分析时，会发现他们之间有些差异。以消费者为例，消费者要求我们解决的首要问题是包装，因为这是最直观的。如今，消费者购物回家，第一眼看到的就是需要丢弃的多余包装。第二点是使他们能够减少家中的能源和水消耗。最后，成分安全显然是宝洁非常重视的首要期望，我们在公司的安全和监管领域拥有数百名科学家。


  封锁期间，公众的环保意识有所提高。随着人们在家时间增多，他们也意识到自己产生了多少废物，消耗了多少水和能源。他们正在寻求品牌的帮助来解决这些问题。


  零售商基本上是在追随消费者的偏好，但他们有时也走在消费者前面。例如，某些零售商表示：“如果你的包装不含一定比例的消费后回收塑料且不可回收，你的产品就不能上我们的货架。”这对整个行业的可持续发展可能起到激励作用！对于投资者来说，重点是气候变化，他们认识到未来十年是我们缓解气候相关风险的机遇窗口。


  气候问题与宝洁极其相关，因为我们 70%的产品需要使用温水。在你剃须、洗碗、洗头、洗衣时，所有这些都需要加热水。几十年来，我们一直在减少排放，特别是通过优化产品配方，让消费者在不牺牲性能的前提下使用更少的水和更低的温度。全球家庭以及为家庭使用而生产的产品，其排放量占总排放量的三分之一以上。


  **帕吉萨斯：** 宝洁如何通过创新来实现负责任的消费？


  **赫利亚斯：** 我们从科学入手，因为我们要确保在最能产生影响的领域进行创新。这就是为什么生命周期分析是我们可持续创新战略的基石。一旦我们理解了这一点，我们就会在可控的方面着手，比如减少包装中原生塑料的使用量——我们的目标是到
  2030 年减少 50%——或者使用可持续来源的材料。


  我们超过 80%的碳足迹与人们使用我们的产品时加热水有关。虽然这并非完全在我们的控制范围内，但我们认为我们有责任让人们更负责任地使用我们的产品，就像我们通过洗衣液的冷水洗涤创新和传播活动所做的那样。我们开发在冷水中效果更佳的产品，这样人们就可以使用更低的温度。这是一种共赢的合作关系。


  我们产品创新如何实现负责任消费的另一个例子是`Cascade`，这是美国一款主要的洗碗机洗涤产品。如果你使用洗碗机而非手洗碗碟，`Cascade`能节约水和能源。这是因为当你使用水槽水龙头时，每两分钟就会消耗四加仑水。相比之下，四加仑水正好是一台满载洗碗机的用水量。算一算，如果你要洗的碗碟超过八件，用洗碗机更划算。



  当人们了解到这一点时，他们会说：“我以前不用洗碗机，是因为觉得会浪费太多能源和水。”这就是我们所说的推动可持续习惯变革的**变革性洞察**。然而，只有当像 Cascade
  这样的产品性能足够出色，让消费者在将碗碟放入洗碗机前无需预先冲洗时，才能实现这一点。实现负责任消费的终极目标，就是我们所说的“让可持续变得不可抗拒”。你让可持续的选择如此具有吸引力，以至于即使人们对可持续不感兴趣，也会选择它。这正是我们“50
  升家居”计划背后的理念。


  **Pagitsas：** 对于那些在如何让高层管理团队参与这个议题上苦苦挣扎的可持续发展领导者，您有什么建议？


  **Helias：** 我会告诉他们两件事。第一，确保你能引入“外部视角”，帮助他们驾驭这个复杂多变的环境，并了解最佳实践。这就是我五年前成立一个外部顾问委员会的原因。我汇聚了最优秀的思想领袖和实践者。你知道当你问“如果我能和任何人共进晚餐，我会邀请谁”这个问题时的感觉吗？这就是我为董事会做的。我希望让最优秀的可持续发展领导者与管理层围坐在一起，激励、指导并挑战我们。那些由我们
  CEO 主持的会议非常棒。坦率的对话、教育与启发，随后是行动。我们非常重视这些反馈。正是这个团队帮助我们制定了“2030 愿景”路线图。


  第二，我建议其他可持续发展领导者做的事情是：与 CEO 之外的高层管理团队建立牢固的伙伴关系。对我来说，首先是与首席品牌官 Marc Pritchard 合作。我开始这份工作时，他对环境议题并不是特别投入。我觉得他有点把它看作是“Virginie
  的事情”，直到他收到邀请，要在一次重要的可持续发展会议上发表演讲。


  Marc 是个了不起的人。当他承诺做某件事时，他会卷起袖子去实现它！在准备演讲的三个月中，他潜心学习可持续发展知识，最终他的演讲成为了会议亮点。那真是太棒了。在这个过程中，他了解了这个议题。和所有人一样，你对可持续发展了解得越多，就会越有热情。这开启了我们之间的伙伴关系，此后不断发展，并带来了变革性的影响。这成为了吸引我们的品牌建设者参与的关键推动力。它催生了他所说的品牌建设的重塑——“品牌
  2030”。


  **Pagitsas：** 为什么让 Marc 而不是您在那次会议上讲述这个故事的很重要？


  **Helias：** 我们是一家品牌公司。我常说，如果可持续发展不在品牌议程上，那它就不在任何议程上，就这么简单。它必须从品牌议程开始。我们每天通过品牌触及全球
  50 亿人。即使是微小的步骤，乘以 50 亿，也将汇聚成巨大的集体影响力。通过与 Marc 的合作，我们加速了可持续发展融入品牌建设的过程，并制定了我们的“品牌
  2030”框架。从那一刻起，我决定每年都要在公司内部发展另一个具有变革意义的伙伴关系。


  **Pagitsas：** 您的下一个高层管理合作伙伴会是谁？


  **Helias：** 我们有一位新的首席研究、开发与创新官。这是另一个关键的合作伙伴关系。我们已经达成共识，我们的灯塔目标将是让每一项创新都是可持续的创新。这将使人们能够通过使用我们的品牌过上更可持续的生活。在过去的几个月里，另一个伙伴关系已成为业务的当务之急，那就是首席可持续发展官（CSO）与首席财务官（CFO）之间的合作。随着越来越多的投资者将可持续性以及环境、社会和治理（ESG）作为关键的投资标准，你可以想象这会是多么具有变革性！


  **Pagitsas：** 您如何在设定具有挑战性的目标的同时，确保不失去组织的参与度？


  **Helias：** 这是一种微妙的平衡。你希望设定有挑战性的目标，因为这是世界所需要的，但你也要确保能够以一种既发展业务又减少环境足迹的方式将它们付诸实施。有时，我称自己为“首席激进化官”，因为我认为我的工作就是不断推动界限，持续提高标准，但你需要以一种对业务有意义的方式来做。


  我的角色是综合来自我们所有利益相关者（消费者、监管机构、非政府组织和投资者）的不同且常常相互冲突的观点，并为我们的业务领导者提供框架，使他们能够做出在平衡经济、社会和环境考量方面最明智的决策。这就是我三十年任职经验给我带来的巨大优势。因为我了解业务和文化，我知道事情是如何运转的。我一直非常尊重那些从外部聘请的首席可持续发展官（CSO）。在宝洁，我无法像他们那样从零开始。


  **Pagitsas：** 当商业、环境和社会议题不断变化时，您如何确定要解决哪些问题？


  **Helias：** 我们会通过访谈内外部利益相关者（包括投资者、非政府组织、同行和供应商）来进行可持续发展优先级的排序练习。在一系列议题中，我们会询问他们哪些议题他们认为对我们的业务具有战略意义，以及他们认为我们最有责任去解决。这为我们提供了一个优先级矩阵。看到他们认为外部非常重要的议题，以及我们内部可能低估的议题，或者反之，这本身很有趣，也会引发讨论。例如，一些外部利益相关者并不认为水是最优先的议题，而我们知道获得清洁水源对我们至关重要，因为我们的大部分产品都需要水才能使用。这样，我们就能理解外部的需求是什么。然后我们戴上业务的眼镜思考：“我们该如何进行优先级排序并付诸实践？”


  **Pagitsas：** 您是否认为每家公司都有对其业务至关重要的议题？通过系统性评估来了解这些议题，是制定缓解策略的最佳方式吗？


  **Helias：** 绝对正确。优先级排序正是制定我们“2030 愿景”目标的起点。我们利用科学的视角来确保我们在能够产生最大影响的地方开展工作。它让我们得以制定出
  2030 年的路线图。


  **Pagitsas：** 您最喜欢向新任首席可持续发展官推荐哪本书？


  **Helias：** 《瞬变：如何让改变轻松起来》（Switch: How to Change Things When Change Is Hard，作者：奇普·希思与丹·希思，皇冠商业出版社，2010
  年）。这简直就是 CSO 工作的定义，而且它在我这段旅程中一直是一个非常实用的工具。


  **Pagitsas：** 如果您正与另一家财富 500 强公司 CEO 及董事会成员共处一室，而他们正开始制定其可持续发展战略，您会对他们说什么？


  **Helias：** 我会告诉他们三件事。第一，了解你们最大的影响在哪里。科学会告诉你答案。倾听专家的意见。第二，不要独自行动。没有任何一家公司能够以我们所需的速度和规模独自应对我们面临的地球挑战。加入跨部门的公私合作伙伴关系和联盟，以规模化地推动影响。第三，成为勇敢领导的榜样。我们需要更多这样的领导，而且速度要快。我恳请他们成为一名行动者、变化的艺术家、炼金术师、有影响力的领导者、开拓者和持久的潮流引领者，并在气候变化变得不可逆转之前，让可持续变得不可抗拒！



  ### 5. 玛丽莎（帕格纳尼）·麦高恩


  首席可持续发展官，PVH 集团


  截至 2021 年 10 月，玛丽莎（帕格纳尼）·麦高恩担任全球最大服装公司之一 PVH 集团的首席可持续发展官。PVH 旗下品牌组合包括`Tommy Hilfiger`和`Calvin
  Klein`。该公司 2020 年的营收为 71 亿美元。玛丽莎目前担任欧莱雅北美区的首席可持续发展官。


  在 PVH 担任首席可持续发展官期间，玛丽莎领导着一个全球团队，负责执行 PVH 的企业责任使命`Forward Fashion`的战略与实施。玛丽莎及其团队设计并实施了与`Forward
  Fashion`优先事项相一致的各项计划，以维护人权并推动环境可持续发展，包括能力建设、利益相关方参与以及非财务可持续发展报告。


  玛丽莎是在其前雇主、`Calvin Klein`的最大被授权方 Warnaco 集团被收购时加入 PVH 的。在 Warnaco 集团，她是内部法律顾问，负责领导欧洲、亚洲和拉丁美洲的法律团队及工作，并管理公司的人权与化学品管理项目。她的职业生涯始于世达律师事务所，专注于国际并购和企业合规领域。


  玛丽莎曾任职于全球时尚议程指导委员会，以及孟加拉国消防和建筑安全协议、行业协会和公平劳动协会的董事会。


  玛丽莎曾入选“年度 50 大 ESG 人物”、“负责任 100 强”以及“环境领袖 75 强”荣誉榜单。她也是世界 50 强企业中的“可持续发展 50 强”成员。在玛丽莎担任
  PVH 首席可持续发展官期间，该公司在`巴伦周刊`的“最具可持续发展力的 100 家公司”中排名第 12 位，并在`新闻周刊`的“美国最负责任公司 400 强”中排名第
  16 位。


  **克里萨·帕吉萨斯：** 许多读者可能知道`Tommy Hilfiger`和`Calvin Klein`这些品牌，但可能没听说过 PVH。PVH 是什么？它与这些品牌是什么关系？


  **玛丽莎·麦高恩：** PVH 成立于 140 年前，是历史最悠久、规模最大的服装和时尚公司之一。该公司最为人熟知的是我们旗下的品牌，如`Tommy Hilfiger`、`Calvin
  Klein`和`Warner’s`。我们在全球拥有超过 33,000 名员工，运营着 6,000 多家零售店，业务遍及全球 40 个国家。


  **帕吉萨斯：** PVH 的企业责任历程是怎样的？如今的企业责任范围又是什么？


  **麦高恩：** PVH 在企业责任领域已活跃了三十年。我们是首批制定工厂人权行为准则的公司之一，该准则于 1991 年建立，意味着基于国际劳工组织公约制定的一套标准，用于规范工厂如何维护人权。我们是公平劳动协会的创始成员，也是十多年前首批设立独立董事会委员会专门负责企业责任的公司之一。我们还连续十三年发布企业责任报告。


  虽然我在这些品牌工作了十四年，但大约八年前才开始担任可持续发展职务。当我刚开始这个角色时，这是一个不同的项目。我们当时的愿景是将一个备受赞誉、专注于人权的工厂审计项目发展成更全面的体系，涵盖整个服装价值链，从棉花农场到将纱线织成布匹的纺织厂，再到裁剪缝制
  T 恤的工厂，直至消费者使用 T 恤以及 T 恤的最终报废。我们还希望纳入环境可持续性、社会影响、集中化数据以及一流的报告和透明度实践，以补充我们的人权工作。


  如今，我们的企业责任战略反映了八年前的愿景。这项工作围绕`Forward Fashion`展开，它建立了一个路线图，以实现 PVH 的使命——“为美好，让时尚品牌向前迈进”。该战略聚焦于三大战略支柱——将负面影响降至零，将正面影响提升至
  100%，以及改善其价值链上超过一百万人的生活。这些支柱包括十五个优先事项和有时限的目标，重点关注领域从消除碳排放和有害化学品、创新循环经济和道德采购、扩大工人声音和提升生活工资，到赋予女性权力以及促进包容性和多样性。


  **帕吉萨斯：** 这真是一次战略上的大扩展！是瞬间完成的吗？还是通过一系列步骤才达到`Forward Fashion`战略？是什么推动了这一转变？


  **麦高恩：** 这是一系列逐步建立信任的步骤，其基础是完全的合作伙伴心态。合作伙伴心态意味着承认，一个孤立的团队无法推动我们在公司内部想要的变革，而仅凭一家公司也无法推动我们在行业中期望看到的变革。这种转变之所以发生，是因为我们投入时间和精力，与公司内部各个业务和运营部门建立关系，并承诺投入资源与公民社会互动，在行业倡议中发挥积极作用。伙伴关系与合作是艰苦的工作。说你是合作伙伴和表现得像合作伙伴，两者截然不同。


  **帕吉萨斯：** 您和您的团队运用合作伙伴心态取得成功的例子有哪些？


  **麦高恩：** 这里有两个例子，说明我们如何建立信任并得以扩大影响力。首先，在我们环境工作的早期，我们只掌握了 16 个自有和运营场所（办公室、仓库、零售店）的能源信息，用于计算温室气体足迹。现在，我们每年从大约
  2,600 个自有和运营场所以及供应链中的 600 多家工厂收集能源和用水数据。我们是如何做到的呢？我们从了解谁掌握相关数据开始，比如我们办公室、配送中心和零售店的用电量，然后与这些团队建立关系。


  接着我们说：“让我们与你们——我们的内部合作伙伴——进行双向对话。我们将分享我们测量和降低温室气体排放的目标，这也能带来商业利益。”例如，更高效的能源使用意味着更低的能源账单。我们说：“如果你们能通过分享部分数据来参与，我们将向你们反馈你们的商店、办公室或仓库在能效方面相对于我们旗下其他场所，以及相对于我们公司之外其他类似场所的表现情况。我们可以分享提高效率的最佳实践和技巧，也愿意听取你们正在解决哪些问题，以及过去哪些方法有效、哪些无效。”我们没有毫无来由地索要数据，也没有将其变成简单的数据提取任务，而是创造了一个共同努力的环境，在这个环境中，我们各自扮演着角色，并有机会为一个共同的目标做出积极贡献。


  另一个例子是在我们的供应链中，这包括全球约 2,500 家设施，我们直接从这些设施以及通过被授权方采购成品和面料。这些设施雇用了约一百万人，因此如果我们做得好，会对人类产生相当大的积极影响。当我开始这项工作时，我们在大约
  450 家工厂进行审计。到了第二年，我们就在 2,500 家工厂进行了审计。为什么数量会增加？这说明与公司内部不同的供应链团队建立关系的重要性。




  #### 排版后的内容


  我们与供应链团队合作，了解他们的采购足迹，并进行了双向交流。我们解释了了解生产地点的重要性，以及我们的项目如何通过审计帮助管理风险，并通过支持工人和提高环境效率等项目为供应链社区带来积极影响。我们制定了具有明确接触点的政策，包括共同反思审计数据，以确保我们都理解需要改进什么，并且无论我们是企业责任专员还是采购专员，都能与供应商口径一致。


  **帕吉萨斯：** 这些对话带来了什么成果？


  **麦高文：** 最终，这些对话让我们在公司内部赢得了尊重和信誉，被视为希望携手合作的事业伙伴。一旦我们建立了稳健的工厂管理和温室气体报告职能，团队便被允许处理更进步的人权议题，并扩展至化学品管理和水资源管理这些新领域。这些问题与时尚和服装行业高度相关，因为在种植棉花、纺纱、染色等过程中，我们会消耗大量水、能源和化学品。随着工作范围的扩大，我们持续成功执行，最终在
  2016 年发布了围绕人权和环境可持续性的十项承诺。


  这第一套公开的企业责任承诺并非像我们今天这样的 SMART 目标——即具体的、可衡量的、可实现的、相关的、有时限的，但它们是公开表态的第一步。幕后做了大量工作，但在此之前，我们未必愿意谈论这些。这证明了公司推动自身更加透明并对自己负责的决心。我们凭借这十项承诺不断积累势头，最终达到了今天的位置——即“前瞻时尚”，它包含十五个优先事项，并且我相信，我们正以新的雄心和透明度希望为行业带来变革。


  **帕吉萨斯：** 尽管最初的工作在您的领导下自然发展并采取了自下而上的实施方式，但听起来今天的完整战略是一项自上而下得到 PVH 领导层支持的企业战略。


  **麦高文：** 是的，我们的前任 CEO 和现任 CEO 都对此项工作非常投入。通过设立董事会级别的委员会，我们拥有了最高级别的可见度和监督权。我们还针对我们的竞争对手群进行了大量基准测试，其中包括更进步的竞争对手，这有助于战略制定和目标设定。我们会说：“有时我们被拉着走，有时我们拉着别人走。”这就是认识到你作为行业参与者以及更大生态系统（包括竞争对手和民间社会）中一员的角色重要性所在。


  **帕吉萨斯：** 谈到高层领导，您如何与董事会互动？您的团队在 PVH 中处于什么位置？每家公司的情况都不同。


  **麦高文：** 我与高层领导有着非常规律且良好的沟通渠道，因为我们有一个董事会委员会，每个季度开会讨论我们的可持续发展战略。由于可持续发展涉及业务的各个部分，我的角色可能在任何部门。我目前向我们的首席供应链官和首席人力资源官汇报。多年来，我曾向首席风险官、首席运营官、首席财务官和总法律顾问汇报过工作。


  **帕吉萨斯：** 能否举例说明如何与董事会合作制定 PVH 的可持续发展战略？


  **麦高文：** 今年春天，我们就可持续发展工作的下一篇章——将工作嵌入业务中，而不是由一个中央团队来执行——与董事会进行了小规模的深度探讨。我们有机会与董事会成员互动，他们都是来自不同行业的、经验极其丰富的人士。他们带着不同的视角参与讨论。与他们共同规划公司可持续发展工作的下一篇章，是一次很棒的经历。我们思考如何充分利用与他们的相处时间？CEO
  鼓励我们提供预读材料并做简短陈述，但让他们提问，以最大限度地利用他们的经验。我们讨论了诸如：“如果我们的目标是让公司认同循环经济原则，那么作为董事会成员，什么最能引起您的共鸣？这关乎效率和业务流程的讨论？是关于自然资源和气候变化的讨论？还是关于‘酷炫耀眼’新事物的讨论？”


  对话的结果是，董事会认可了我们的方法，即将下一阶段的工作重点放在消费者、我们的业务运营以及我们称之为“下一代利益相关者”的群体上。在每个领域内，我们都听到了董事会认为我们应该重点关注的方向。例如，对于消费者，我们的重点应该放在电子商务还是实体店？我们的产品重点应该是轻微改进所有产品，还是让我们的畅销品最具可持续性？从这些对话中走出来，我们知道了董事会支持我们的工作并提供了意见，同时还为我们与管理层讨论资源投放重点提供了指导。


  **帕吉萨斯：** 投资者和董事会是否也在推动可持续发展方面的参与？


  **麦高文：** 过去几年，社会责任投资者和一些欧洲投资者曾询问我们的可持续发展战略，以及我们在关键问题领域的工作，例如为供应链中的工人设定并支付生活工资。然而，我们现在看到可持续发展越来越多地出现在主流投资者的议题中。当我说“越来越多”时，并不是指每一次对话都会涉及，但确实比过去听到的要多。


  关于投资者对话，非常有趣的一点是，你可能会认为问题将围绕气候变化、我们的人权项目或生活工资展开。相反，我发现对话更侧重于体系，以及我们如何构建韧性和实现长期价值的机制。也许是我对提问方式解读过度了，但这些问题似乎不那么针对具体主题，而更多地关注我们如何系统地思考这些问题、管理风险，并建立体系来应对这些问题。这让我感到惊讶。这并不是说我们不再收到投资者调查和询问，其中包含关于我们的目标以及实现进展的非常具体的问题，但当投资界和商业领袖就那些专注于可持续发展的公司（要么效率更高，要么韧性更强）进行交流时，与投资者的对话就变得有趣起来。


  **帕吉萨斯：** 能否举出一些例子，说明业务因其企业责任战略而变得更加高效或更具韧性？




  #### 对话记录：可持续发展与供应链韧性


  **McGowan:** 新冠疫情首次在亚洲爆发时，带来了明显的影响，比如工厂关闭，这引发了对工人健康与安全、工人薪酬等问题的质疑。进入疫情初期后，我们从供应链的角度经历了非常迅速且猛烈的连锁反应。影响不仅仅是一家工厂关闭，也可能是工厂仅以部分产能运转，或者因为不允许访客进入而无法安排审核员进入工厂。随着新冠疫情蔓延到不同国家，当我们缓解了一个国家的影响时，另一个国家又会出现问题。当你缓解了那个问题，又会有新的问题浮现。为了保持业务连续性，我们以从未有过的速度引入新工厂。


  我们还试图与已有合作关系的供应商合作，提供个人防护装备（`PPE`）和其他物资。一些公司在寻找物资方面遇到了困难。然而，我们对一流供应商的投资——这些供应商将合规性放在首位，并投资于其员工和社区——使我们能够保持货物从一个供应商流向另一个供应商。当一家工厂下线时，另一家工厂便上线，这得益于我们多年来建立的关系。这就是供应链韧性的一个例子。这证明了强大供应商层面伙伴关系的重要性，并且这种关系在实际中发挥了作用。


  在新冠疫情期间，我们投入时间与精力与民间社会合作的重要性变得非常明显，尽管有时这会被视为空谈或只是为了公关（`PR`）。当疫情的严重性变得明朗时，我和我的团队与国际劳工组织（`ILO`）的“更好工作”团队以及其他几家公司的同行进行了电话会议。在大约两周内，包括许多个夜晚，我们与国际工会达成了一项协议，品牌方将为其在工厂中已有的成品和在制品支付款项。


  我们共同致力于利用融资机制来确保工人获得薪酬，并在长期内承诺致力于安全网、社会保护和社会保险项目。这项名为“*新冠疫情：全球服装产业行动*”的协议之所以能够达成，是因为我们投资了这些伙伴关系。这再次证明了，寄出资金或支票与共同在当地建立项目、以及拥有在需要时可以拨打的电话号码，这两者之间存在巨大差异。


  **Pagitsas:** 一个启示是，你在需要这些伙伴关系之前就对它们进行了投资，本质上是在不知道回报的情况下进行的投资，无论是对国际劳工组织（`ILO`）还是对供应商。


  **McGowan:** 绝对是这样。


  **Pagitsas:** 听起来，对利益相关方参与的投资——这是可持续发展的一个原则——带来了财务收益。是否每个可持续发展项目都需要有财务投资回报率（`ROI`）？


  **McGowan:** 我长期纠结于这个概念，原因有多方面。有一些显而易见的例子，比如降低能源使用与降低能源账单之间的联系。你可以对标签和包装进行生态化设计，这意味着在包装上花费更少。这些都是关于投资回报率（`ROI`）的很好的简洁例子。然而，其他领域，比如上一个例子中的利益相关方参与，就不那么容易量化了。无论统计数据有多好，都可能存在指向不同方向的相互矛盾的统计数据。将可持续发展孤立地视为这些事情的起因或结果是极其困难的。


  **Pagitsas:** 当一个可持续发展项目的财务投资回报率（`ROI`）未知时，你如何知道何时该进行投资？你如何说服其他人支持它？


  **McGowan:** 可持续发展必须对业务有意义，无论目标是提高员工参与度、实现投资者差异化，还是接触不同的消费群体。然而，了解你的受众也很重要。有些受众希望有所作为。他们希望利用我们的平台来推动某种积极的变革。这是一种关于调整我们的采购方式、选择的材料或对社区影响的“走心”对话。还有一些人非常关注业务效率，厌恶系统中的浪费。无论是将衣服上的标签进行生态化设计，还是审视业务流程并发现低效之处，我们都能看到很多这样的机会，因为这会影响到长远的人权和环境实践。


  有时这是一场“走心”的对话。有时这是一场关于效率的对话。有时这是一场关于员工士气的对话。你越是了解与你共事和为你工作的人的议程和目标，你就越能做好这一点，并且因为你更了解他们（因为情况可能随时间变化）。你可能遇到一个“走心”的人，但在某一天却非常专注于效率。（笑声）


  **Pagitsas:** 你是否认为，首席可持续发展官（`CSO`）在开展“走心”对话方面承担着过重的责任，而其他首席级高管，如首席营销官或首席技术官，则不被期待承担这种责任？


  **McGowan:** 是的，我这么认为。


  **Pagitsas:** 为什么会这样？与高管层的其他角色相比，这是一个独特的工作要求。


  **McGowan:** 是的。这种情况没有改变，但我认为它正在改变。从历史上看，可持续发展与慈善事业紧密相连，因此存在一种“援助与贸易”的对话。这仅仅是对社会公益的贡献吗？这是一种对社会公益有贡献并且也带来商业利益的行为，还是说这实际上是一项也产生社会效益的商业战略？对于这项工作的实际作用，存在一个范围。


  对于首席可持续发展官（`CSO`）而言，这个角色的另一个挑战，以及公司可持续发展范围的挑战在于，没有任何东西被标准化，因此我们缺乏良好的机制来衡量自己与他人的差距，或在监管、投资者乃至消费者环境中实现差异化。在这种情况发生之前，我们需要为可信的标准化努力做出贡献，并成为现有标准的早期采纳者。当关键利益相关者，如消费者、员工、投资者、金融机构和监管机构，开始真正奖励那些产生最大积极影响的公司时，良性循环就会接管，我们所能产生的影响将是巨大的。


  **Pagitsas:** 如今，`PVH`确实有雄心勃勃的企业责任目标以及实现这些目标的战略。然而，每家公司，尤其是大公司，都有批评者。你如何看待这些批评者？


  **McGowan:** 一位非常睿智的女性曾告诉我，有三种类型的批评者——海豚、虎鲸和大白鲨。海豚是那些会推动你前进的批评者，但他们会与你合作。他们很高兴能与你待在一起、一起工作。他们会稍微推动你一下，但不会公开指责你。然后是鲨鱼，无论你做什么，都不够好。无论如何他们都会吃掉你。你几乎无法做任何事情来安抚他们。接着是虎鲸。他们比海豚更用力地推动你，但他们以一种鼓舞和激励的方式这样做。


  我们认为批评者在推动我们前进和保持责任感方面扮演着重要角色。我用这个例子来区分我们的批评者，并相信你也必须以不同的方式对待他们。如果你能找到那些虎鲸，与他们合作会是一件非常令人兴奋的事情。


  **Pagitsas:** 哪位伟大的虎鲸激励着你并推动你做得更好？





  **麦高恩：** 国际劳工组织的"改善工作"项目历来与服装和鞋类行业在人权问题上合作，因此它们就是我在人权领域的"虎鲸"。我与他们进行过一些最有趣、最具启发性的对话。他们要求严格，标准很高。由于其三方性质，工会和政府始终参与对话，这迫使你不断思考如何更好地利用整个生态系统。由于我们是在国际公约框架下工作，不存在"哦，那我们把标准降低一点"的情况。事情不是那样运作的。有好几次，我想与他们合作某个项目，他们却说："好，那我们想看到你做到这些。"


  回到我之前讲过的关于《新冠疫情：全球服装业行动协议》的故事，当时有很多关于承诺建立长期社会保险和安全网的讨论。但让国际劳工组织及其"改善工作"团队参与进来是不可商议的条件。他们正是促成一项包含企业和国际工会的协议的关键所在。


  世界自然基金会（WWF）是环境领域"虎鲸"的一个好例子。为了与他们合作水资源管理项目，我们必须在化学品管理、水资源使用和碳足迹方面做出 SMART（具体的、可衡量的、可达成的、相关的、有时限的）承诺。他们是很棒的合作伙伴和出色的执行者。与世界自然基金会合作，我们开展了全球水资源风险评估和水足迹项目，并最终商定了在我们关键水域盆地（包括中国太湖、埃塞俄比亚的哈瓦萨湖、印度的卡韦里河以及越南的湄公河流域）的管理项目。


  与这类伙伴合作，需要付出和索取并存。因为彼此尊重，所以你们也会想一起不断突破极限。


  **帕吉萨斯：** 我同意。合适的合作伙伴是无价的。来自海豚、虎鲸或鲨鱼的最大批评是什么？


  **麦高恩：** 我们看到关于更广泛的消费问题的讨论越来越多。焦点在于时尚和服装系统中的浪费，以及进入垃圾填埋场的废弃物，这关系到自然资源的局限性以及向循环经济转型的重要性。作为一个行业，我们确实有很多工作要做，但我很高兴看到如今消费者对诸如耐用性宣称等话题产生共鸣。


  作为消费者，你会因为产品更耐用、使用寿命更长而多付一点钱吗？显然，像巴塔哥尼亚这样的公司多年来一直在这样做。这是他们企业理念的一部分——他们是一家共益企业，经过第三方认证，符合一定的社会和环境绩效、公开透明以及法律责任标准，以平衡利润与使命。但我们现在看到这种情况在主流市场中越来越普遍。


  增加对更可持续材料的使用日益重要，但循环经济讨论的解决方案很快就会变得非常复杂，因为我们尚未具备以可规模化方式回收和再利用服装所需的创新技术或基础设施。


  我最常倾听的那些最严厉的批评者说，转型发生得太慢了。对他们，我一直回到的问题是：我们如何才能以不同的方式区分和激励公司？是否会有某种标准化的衡量方法？面向消费者，我们一直在通过可持续服装联盟的
  Higg 指数，致力于开发服装上类似于食品标签的东西。它不显示卡路里和维生素含量，而是告诉你能源、化学品和水资源的使用情况，材料选择的可持续性，以及制造和分销过程中的人权和社会影响。它还包括消费者可以做些什么来提供帮助。


  我们如何把它做得超级简单，让我们的消费者能够做出明智的选择？不能每家公司都有自己的系统。必须是一个统一的系统。从投资和监管的角度也是如此。需要哪些衡量工具来表明我们正在进行所有这些工作，从而我们能获得更优惠的融资利率？或者我们拥有优势，能使我们的产品先于竞争对手满足欧盟日益严格的环境法规？我总是回到那个理想状态——数据报告和客户沟通方面有某种标准化，但这似乎还有很长的路要走，也许有点像一场梦。


  **帕吉萨斯：** 考虑到这些障碍，如果可以对时尚和纺织行业做出一项改变，因为它对环境和社会如此重要，那会是什么？


  **麦高恩：** 完全的投入品（如组件、材料等）和生产可追溯性。想象一下，在服装的每一个组件以及成品服装上都装有一个小型追踪器，告诉我们投入品来自哪里，在哪里组装。我们看到最大问题和最大机遇的地方，正是那些不透明的环节。在一条很长的价值链上，许多地方都不透明。这一点既适用于环境问题，也同样适用于人权问题。


  我不相信那些宣称自己在环境问题上做了大量工作，却连自己的面料厂在哪都不知道的服装和时尚公司。面料厂正是对环境影响最大的地方。你经常会看到这种情况。一家公司会列出一份与其签订成品服装合同的工厂名单。当你深入研究这份名单，询问原材料来自哪里、面料来自哪里时，他们会说，"哦，那是中介为我们做的"，或者"我们是从工厂整体采购的——他们为我们采购原材料"。那你怎么知道你兑现了环境承诺呢？你的基线是什么，又是如何设定的？工厂只是价值链上倒退一步。你必须继续回溯到面料厂、纺纱厂、轧花厂和棉花田。在整个过程中都存在环境影响，更不用说各级别的劳工问题，尤其是非正规经济。拥有一种能够追溯和追踪的机制将是非常了不起的。


  **帕吉萨斯：** 这种技术今天不存在吗？


  **麦高恩：** 显然，有无数种技术。我们一直在和人们谈论，这些技术原本要依托各种区块链技术来实现，但我还没有看到哪家公司能够将其在时尚和服装行业规模化应用。


  当你审视所有投入品时，你需要追溯你的纽扣、拉链以及来自工厂、制造厂、纺纱厂和组件加工商的其他材料。这就是未来。我们越早实现这一点，就越能更好地了解我们的问题所在。我们了解得越好，就能越早做出承诺；我们越早做出承诺，就能越早开始着手解决这些问题，并希望最终能受到那些"虎鲸"的问责。（笑）


  **帕吉萨斯：** 巧妙地把话题拉回到那些"虎鲸"身上！让我们谈谈联合国可持续发展目标（SDGs）。为什么与 SDGs 保持一致很重要？PVH 的可持续发展工作如何与
  SDGs 保持一致？


  **麦高恩：** 可持续发展目标非常出色。它们为我们提供了一种跨行业交流的共同语言——从行业到政府再到公民社会——并展示了我们所处理问题之间的相互关联性。





  每年我们编制`CR`报告，将每个故事对应到多个`SDG`时都充满乐趣。你看到一个故事可能会说：“哦，这只是一个关于水资源的故事。”但它同时也关乎体面工作，*并且*涉及韧性，*还*与气候有关。你会开始看到这些环境、社会和经济议题是如何相互关联的。为了创造共同语言并识别这种互联性，我称赞那些制定和维护`SDG`的人们所做的努力。如果我们首次大规模地将某个国家作为采购目的地，考察该国针对`SDG`制定的计划，以及我们如何通过创造就业或其他符合`SDG`的益处融入其中，这是件有趣的事。


  当初进入撒哈拉以南非洲时，我们与联合国`SDG`进行了一致性分析。例如，在埃塞俄比亚，我们专注于为年轻人口建设产业和提供就业，这与`SDG 8`（体面工作和经济增长）相符。我们还专注于维护淡水，这与`SDG
  6`（清洁饮水和卫生设施）相符，并投资清洁能源，这与`SDG 7`（经济适用的清洁能源）相符。根据这一映射结果，我们在当地与`WWF`合作开展了一项水资源管理项目，同时确保我们采购的工厂使用尽可能回收水资源的用水系统。


  **帕吉萨斯：** 你对`SDG`非常熟悉，并且知道如何运用它们。对于一位第一次尝试将公司业务与`SDG`对齐的可持续发展负责人，你会给出什么建议？


  **麦高恩：** 当`SDG`刚发布时，有人问我：“你是如何把这个向你的`CEO`介绍的？”我说：“我绝不会把这个庞大的框架直接扔给他。”我的职责是将其转化，提供概要，并与他已经知晓的工作联系起来。因此，我会引导那位可持续发展负责人去识别他们在某些`SDG`目标上已经做了哪些工作。这里是可以突破的领域，那里是可以逐步推进的方法，而不是对他们的`CEO`说：“这些是目标，这些是我们需要做的事。”


  **帕吉萨斯：** 让我们回到你的教育背景和职业经历，谈谈你是如何加入`PVH`的。哪些经历对你影响最大？


  **麦高恩：** 我的职业生涯首先植根于在乔治城大学（一所拥有大量国际学生的耶稣会学院及研究生院）的经历。耶稣会的教育强调服务他人的原则，以及“多给谁，就向谁多取”的信念。与乔治城大学法律中心关联的公民社会、政府和律所经历对我的职业生涯至关重要，因为它引导我走上了正确的道路，并建立了让我走到今天的人脉关系。


  毕业后，我在世达律师事务所（Skadden, Arps, Slate, Meagher & Flom LLP）执业。我在那里有三个关键收获。首先是接受恰当培训的重要性。我被教导要了解我的受众，注重细节，在压力下保持从容，在时间限制内严谨细致，并运用判断力。这些看似显而易见，但我发现有意识地做到这些对我的整个职业生涯大有裨益。第二个关键收获是导师的作用。我非常感谢我的导师们——汤姆·肯尼迪、里克·格罗斯曼、艾伦·迈尔斯、弗雷德·帕格纳尼和基思·帕格纳尼——因为他们在我身上投入心血，给予我中肯且直接的反馈，这些反馈有时很严厉，但回顾起来，我对此心怀感激。


  第三个收获是“四分卫”角色在法律领域以及企业责任中的作用。作为一名并购律师，我学会了与公司金融、雇佣、知识产权等其他专业法律团队合作，将他们的观点整合并弥合分歧，最终形成协议。作为首席可持续发展官，我扮演着类似的“四分卫”角色。你拉的每一根杠杆都会影响其他杠杆。你必须深思熟虑各项事务如何相互配合，以及如何影响生态系统的其他部分。


  在世达时，我被派往伦敦，当时有个客户 Warnaco 正在收购 Calvin Klein 的牛仔裤授权。大约一年后，我在世达时认识的 Warnaco 总法律顾问打电话来说：“我们现在有了这项国际业务，你愿意在欧洲和亚洲建立法务团队吗？”在
  Warnaco 工作期间，我就像一块海绵，只想学习业务和运营，以及欧洲、亚洲、美国和拉丁美洲业务之间的差异。我学会了如何成为公司总部与地区之间的沟通桥梁，这我认为是一次很棒的学习经历，也学会了如何应对文化差异。


  在 Warnaco 的最大收获，是明确了我想成为哪种类型的律师和专业人士。我喜欢理解企业的目标，然后找出从法律角度看存在哪些障碍。我们如何以最负责任的方式应对，同时又能突破界限，推动业务向前发展？作为首席可持续发展官，我们常常在我称之为“灰色地带”中摸索。不一定非黑即白，而是利弊的权衡，风险与回报并存，也存在意想不到的后果。很少有事情比以最负责任的方式帮助企业应对挑战、推动发展更能让我感到满足。这几乎是最大的成就感来源。


  最后，我之所以加入`PVH`，是因为他们收购了 Warnaco，以重组 Calvin Klein 集团。亲历一家公司被收购是一次重要的职业经历，也令人无比谦卑。并购具有协同效应，这也意味着你可能会有重复的职位。在那段时间里，我与许多同事和朋友道别。但同时，加入一个在人权领域拥有雄心勃勃计划并希望产生积极影响的新组织，也带来了大量的机遇。


  我以律师身份加入`PVH`，最初的两项任务从职业生涯角度看是我最喜欢的。第一项是加入孟加拉国《消防与建筑安全协议》的实施团队。兰普拉大厦的倒塌[2013 年发生在孟加拉国达卡]是服装行业遭受的最大工业灾难。`PVH`并未在兰普拉大厦进行采购。包括`PVH`在内的多家公司，与国际工会
  IndustriALL 和 UNI 全球工会签署了一份具有法律约束力的协议。`NGO`作为见证方签署并参与了谈判。我们有一份五页的协议，但需要就协议的每个方面进行谈判，将其转变为消防、建筑和结构安全检查机构。我很幸运成为六位公司代表之一，被派往日内瓦就一切进行谈判，从在哪里设立我们的法律实体，到哪些数据可以披露，再到聘请我们的首位执行董事和消防安全官。


  第二个任务，简而言之，是调查我们考虑建立采购业务的所在国关于同性性行为的刑事定罪法律。我相信，我对这些项目的投入，以及通过这些项目建立的人脉关系，使我在前任因个人原因离职时，成为了企业责任负责人的有力竞争者。然后我发现自己得到了这份我一直想做、但之前却不知道其存在的工作。


  **帕吉萨斯：** 如果让你概括一下，在一家全球性的数十亿美元公司中，你个人对于可持续性议题的战略性、高层讨论的领导方式是什么？


  **麦高恩：** 我会说三个关键点。首先，对待所有高管以及与我共事的每个人，我秉持谦逊的态度，先听后说，做好充分准备，并将工作内容转化为对他们议程或目标有意义的东西。




  #### 排版后内容


  其次，我始终努力带来相关且他们可能无法获取或未能关注的信息。我和我的团队定期与竞争对手及跨行业的可持续发展领导者进行对标。我们投入了大量时间与竞争对手的同仁建立关系，并深入理解可持续发展领域的趋势轨迹、投资动向与创新方向。将相关信息带到会议上，有助于领导者思考并决策可持续发展议题。


  最后，我力求通过每一次招聘提升团队实力，并大力投资于团队成长与发展。一个极其聪明且才华横溢的团队，兼具技术与软技能，对于交付成果和建立信誉都大有裨益。我相信，所有这些做法，在我与同行、同事及领导层探讨可持续发展话题时，都发挥了非常积极的作用。幸运的是，与我共事的人都对这个话题充满热情。


  **帕吉萨斯：** 随着时尚与服装行业进一步将可持续发展原则融入其运营，你希望看到哪些变化？


  **麦高恩：** 对于时尚与服装行业，如同所有行业一样，我首先希望可持续业务能证明其本身是好的业务——从“必须先做好财务才能做好事”的思维模式，转变为“可持续业务能捕捉到长期价值创造所必需的高效、韧性、创新、牢固关系和信任”的思维模式。其次，我希望人们能真正认识到，要应对系统性的挑战，企业、政府和社会需要以不同的方式共同合作。这是我们解决未来重大挑战的唯一途径。


  ### 6. 乔蒂·乔普拉


  美高梅国际酒店集团首席人力、包容与可持续发展官


  *乔蒂·乔普拉是美高梅国际酒店集团（MGM Resorts International）的高级副总裁兼首席人力、包容与可持续发展官。美高梅国际是一家全球性的博彩、酒店和娱乐公司，业务覆盖拉斯维加斯大道、美国各地以及澳门，截至
  2021 年 9 月 30 日的过去十二个月营收超过 80 亿美元。乔蒂负责领导人力资源、社会影响力与可持续发展工作，并监督美高梅度假村基金会。她负责环境、社会和治理（ESG）报告，指导企业级的人力与社会资本计划，并担任董事会企业社会责任及人力资本与薪酬委员会的联络人。*


  *在加入美高梅之前，她曾担任培生集团（Pearson Plc）全球多元化与包容性以及人力资源运营与转型高级副总裁。在其职业生涯早期，乔蒂曾担任纽约梅隆银行（Bank
  of New York Mellon）首席多元化官兼全球公民与可持续发展董事总经理，以及德勤全球（Deloitte Touche Tohmatsu Limited）沟通与公共关系全球负责人，并在美林证券（Merrill
  Lynch & Co.）担任董事总经理。乔蒂的职业生涯始于联合国，负责报道人类发展及影响妇女和儿童的问题。*


  *乔蒂是丰田北美公司多元化咨询委员会的成员，并担任思宾塞·斯图尔特（Spencer Stuart）全球领导团队的多元化与包容性顾问。她是施耐德国家（Schneider
  National）的董事会成员，并任职于该公司的薪酬委员会。*


  *在其职业生涯中，乔蒂获得了众多奖项与认可，包括亚裔美国商业发展中心颁发的“亚裔美国商业人士 50 强”奖、纽约市和纽约州颁发的“百大负责任领袖”奖、Roshni
  传媒集团颁发的“励志成就者”奖、城市专业人士委员会颁发的“女性领导力奖”以及普林斯顿 YWCA 颁发的“致敬女性荣誉奖”。*


  **克里萨·帕吉萨斯：** 乔蒂，你的职业生涯跨越了多个行业，从非政府组织到银行业，再到咨询业和酒店业。请谈谈你的职业历程以及是什么在驱动着你。


  **乔蒂·乔普拉：** 作为一名长期的多元化从业者，我的工作始于公共部门的联合国。在九十年代末期，我在联合国儿童基金会（UNICEF）工作了数年，亲身目睹了世界各地存在的不平等现象，尤其关注性别问题。我任职于联合国儿童基金会期间，正值卢旺达内战和波斯尼亚冲突，当时妇女和女孩被当作战争武器。我对发展、不平等和歧视等相关问题有了切身体会。在我的祖国印度，我关注了诸如杀女婴和女童平等受教育权等问题。这些经历在塑造我世界观方面起到了非常重要的作用，并激发了我对解决多元化问题的兴趣。这种兴趣根深蒂固，并一直伴随着我至今。


  在你职业生涯的早期，当你的思想和格局被历史性的关键时刻所影响和塑造时，它会给你留下不可磨灭的印记。就我而言，这是一种决心：无论我在哪里工作，无论我做什么，我都希望产生有意义的影响。我希望能够以某种方式改变人们的生活和生计。这种关于影响力的理念，在我职业生涯早期就已确定下来。




  当我从公共部门转向私营部门时，我从全球最多元化的组织——联合国，来到了华尔街的核心地带。在联合国，我与来自当时超过 175 个国家或地区的人共事，一切事务都同时翻译成六种语言。而我加入的美林证券，是全球顶级投资银行之一，我深入其零售财富管理业务的核心，这与联合国形成了鲜明对比。这里缺乏多样性，尤其是高层职位，严重偏向白人男性。这是一种高压的销售、创业文化和环境，但事实证明，这是一个极佳的学习环境，我可以在此为公司及其客户群试点、测试和孵化许多想法、产品和服务。


  我的私营部门之旅是在詹姆斯·戈尔曼的支持下开始的，他如今是摩根士丹利的董事长兼首席执行官。当时他负责美林证券的财富管理业务，并在业务重组、客户群细分和运营模式重新定义方面发挥了关键作用。他是一位极具前瞻性的领导者，挑战我们的团队去探索围绕多元文化市场的新商机。其理念是研究和学习不同的社区，从金融和投资的角度了解他们的需求，并开发出适当且相关的服务产品。詹姆斯为我们新的多元文化业务开发团队提供了种子资金，我们于
  2001 年启动了这项业务。短短几年内，我们就建立了一个非常成功且盈利的业务，并成为了行业的典范。


  在那里工作十年后，我去了德勤工作四年，担任全球传播与对外关系负责人，支持德勤的全球首席执行官和执行团队。之后，我在 2012 年被纽约梅隆银行聘为首席多元化官，负责建立全球多元化和包容性战略并构建相应的职能。在这段旅程进行到第二年时，公司进行了一次有机的企业重组，我被要求在原有多元化和包容性工作的基础上，再接手可持续发展和慈善事业。这正是我的职责范围扩展到包含可持续发展以及环境、社会和治理工作的真正起点。这是我职业生涯的一个重要转折点，因为我必须从人类和社会两个维度，以影响力视角来看待事物。我喜欢用人力资本和社会资本的部署来思考这个问题。


  2019 年，我加入了拉斯维加斯的米高梅国际酒店集团，抓住了一个令人难以置信的机会，领导人员与社会影响力项目。米高梅强大的品牌、其对客户服务的极致关注，以及公司横跨博彩、酒店和娱乐的运营与业务的复杂性和庞大规模，都深深吸引了我。


  **帕吉萨斯：** 您在米高梅国际酒店集团的职责范围是什么？


  **乔普拉：** 目前在米高梅，我负责四个领域——人力资源、慈善事业、多元化、公平与包容，以及可持续发展。我们的理念核心是拥抱人性、保护地球。这种结合将利用人力资本和社会资本的力量这一概念推向了前沿。在米高梅，我们将此综合领域的工作锚定在三大核心支柱上。我们框架的支柱是：促进多元化和包容性，投资于我们的社区，以及保护我们的星球。我们围绕这些支柱制定了
  14 项已公开的、贯穿至 2025 年的长期目标，以及两项新批准的、贯穿至 2030 年的气候变化目标。我们 2025 年目标的例子包括：在可投标的国内采购中，至少
  10%来自多元化供应商；通过我们的“馈赠前行”项目捐赠 500 万份餐食；以及相较于 2007 年的基准线，每平方英尺碳排放减少 45%，每平方英尺用水量减少
  30%。我们 2030 年的目标是：将全球范围一和范围二的绝对碳足迹减半，并在美国实现 100%的可再生电力采购。


  **帕吉萨斯：** 为了监督这个框架和这十六项目标，建立了什么样的治理结构？


  **乔普拉：** 最终，这项工作及其问责制归于米高梅国际酒店集团董事会的企业社会责任与可持续发展委员会。米高梅董事会的 CSR 与可持续发展委员会已设立多年，并一直非常专注于这个领域。我直接向我们的首席执行官兼总裁比尔·霍恩巴克汇报，因此从董事会到
  CEO 再到首席人才、包容与可持续发展官，有一条直接的责任线。比尔是我们这方面工作的主要支持者和倡导者，并深度参与所有方面。此外，我还担任董事会委员会主席罗斯·麦金尼-詹姆斯的公司联络人。同时，针对我们的长期目标，我们指定了高管作为每个目标的赞助者和倡导者，并使用特定的关键绩效指标来衡量进展。


  **帕吉萨斯：** 我的理解是，从董事会到整个公司，你们对可持续发展战略有着清晰的问责和所有权关系。为什么这种结构对米高梅有效？


  **乔普拉：** 这涉及到我们所说的“共同所有权”的概念。我们的运营非常像一个集体，因为我们确实是拉斯维加斯及地区性多个物业中多个业务的集合体。我们从事博彩、酒店、餐饮、场馆业务。我们有涵盖现场和数字的娱乐和零售业务。我们有十二个度假村、拉斯维加斯大道的
  T-Mobile 体育馆，以及不同地区地理位置的多个物业。为了对目标产生持久、有意义的影响，你必须像我们一样采用分布式模型和结构。如今，我们在全球 29 个地点拥有超过
  59,000 名员工。





  以下是根据您的指示格式化后的文本。


  在我们这样一家具有如此规模、范围和量级的企业，单靠一个位于中心的小团队是无法从总部推动我们正在讨论的这些工作的。你必须审视如何在分布式模式下获得认同、采纳和接受，这样你才能在整个企业范围内推动有意义的行动。在与我们的
  CEO 和执行委员会商议后，我们根据各自负责的领域指定了执行发起人。例如，我们的首席运营官，他负责监督所有物业和卓越中心，包括我们的餐饮业务，成为了他将能施加最大影响力的那些目标的执行发起人。同样，我们的人力资源高级副总裁负责监督并倡导那些与人力资本和人直接相关的目标。因此，在这些情况下，高管们分别担任主要或联合执行发起人，以支持我们实现以下目标：员工向美高梅基金会的累积捐款超过`1.2
  亿美元`，以及实现国内员工向美高梅基金会捐款参与率达到`百分之七十五`。


  我们挑选的那些负责人，其监督领域和职责范围与能够推动其各自目标成功的项目环节相对应。这就是我们开发此模型的方式。


  **帕吉萨斯：** 你如何与罗斯和比尔进行日常互动？你又如何与他们合作，将美高梅度假村的影响力战略与员工联系起来？


  **乔普拉：** 首先，向一位董事会委员会负责人汇报工作，该负责人是该领域的主题专家，在其杰出的职业生涯中在这个领域投入了大量时间，并且对该领域非常精通，这是极其有帮助且意义重大的。罗斯和我每月直接合作一次，我们与美高梅度假村的
  CEO 一起，共同为 CSR 委员会制定议程。在将工作产品和材料提交给委员会会议之前，我们会向她进行预览。我们的 CEO 出席该委员会的每一次会议。因此，在这种结构下，从委员会主席到首席可持续发展官和
  CEO 之间建立了直接联系。我认为这意义重大，并且推动了我们的管理团队和物业总裁们的积极参与。


  第二种战略方法是让我们的委员会主席参与到我们更广泛的工作领域中，例如多样性、公平性和包容性。一个例子是我们的勇敢对话论坛。比尔和我在去年启动了该论坛，旨在为我们的员工精心打造一个可以与管理层坦诚交流的安全空间，分享他们的想法，以及他们对外部环境和社会正义问题的感受。


  这些论坛始于乔治·弗洛伊德被谋杀事件之后。我们首先与一群非裔美国同事组成了勇敢对话小组。罗斯参加了我们的首次会议，此后她出席了此后举办的每一场论坛。身为董事会成员以及
  CSR 与可持续发展委员会主席，能如此积极地参与领导与 CEO 和公司员工的讨论与对话，这是非常有力且前所未有的。


  这使得你的董事会成员能够直接观察并直接听到员工的感受。这非常有力。我们最终所做的，是将这种对话扩展到了其他群体。我们现在有了一个勇敢对话亚洲群体、一个女性群体和一个拉丁裔群体。会议规模从三十到五十名参与者不等，包括从一线到后勤部门各个级别的员工，他们拥有不同的任期和经验，代表各地区、拉斯维加斯以及公司职能部门。其组成非常多样化，并且是有意为之的。


  此外，我们从每个群体中创建了工作组。他们制定了行动计划，并确定了我们作为一个群体想要着手解决的三个到五个领域，以帮助我们公司创造一个更具包容性的环境和公司文化。这非常有效。比尔是我们工作的积极倡导者，并以多种方式让我们的领导者承担起责任。


  **乔普拉：** 关于罗斯和比尔的另一件了不起的事情是，他们不害怕发表公开声明。例如，我们在 LGBTQA+权利和“黑人的命也是命”运动中做了大量的公共倡导工作。我们的董事会和
  CEO 就我们认为有必要表明立场的话题发布或共同签署了声明。这是一个很好的例子，说明了如何与董事会互动，开展支持社会影响和可持续发展战略及目标的倡导工作。


  **帕吉萨斯：** 有了如此强大的治理结构、尽职尽责的董事会和高层领导以及共享所有权模式，似乎你们能够实现既定的可持续发展和影响力目标。当市场上发生意外事件时，这种模式是否也能帮助你们创造积极的影响？


  **乔普拉：** 最近一个引人注目的例子是新冠疫情期间我们处理食品库存的方式。2020 年初疫情爆发时，我们决定关闭我们在拉斯维加斯大道、美国各地以及澳门的所有物业。我们实际上是在几天内就做出了这个决定。我们在每个地点的物业都储存着大量的食品和农产品。这些食品是为餐厅、宴会、活动、大型会议和酒店预订准备的。


  我们必须非常迅速地决定如何将这些食物分发给最需要的人，因为我们能储存或冷冻的能力是有限的。对于会变质的新鲜食物，我们的时间非常紧迫，只有几天的时间。通过我们的首席运营官，我们直接与我们的物业领导层、厨师长以及餐饮负责人合作，弄清楚哪些食物会变质，计算出我们最大的储存或冷冻容量，并确定哪些农产品以及需要多少要装上托盘，然后从我们的酒店分发或运输到社区中心或食品银行。


  随后，我们必须找到能够接收我们大量农产品并将其分发给有需要的社区的食品银行或食品慈善机构。例如，在拉斯维加斯，我们与 Three Square 合作，这是与我们合作的当地食品非营利合作伙伴之一。我们能够向他们提供数千磅的食物，分发给社区内的无家可归者收容所和有需要的家庭。所有这一切都必须在非常短的时间内完成。从
  CEO 到 COO，再到物业总裁、餐饮负责人，以及监督厨房的厨师长，我们领导层的支持对于分发的成功至关重要。


  2020 年 4 月中旬，我们通过天主教慈善机构组织了一个热食分发计划。来自 ARIA 和 Bellagio 酒店的厨师和员工每天进入厨房，连续工作了超过两周，烹饪热食、打包餐食，并将其装到卡车上，然后由天主教慈善机构分发给社区。请记住，这是在疫情初期。我们的厨房员工戴着口罩、手套，安全地分散站位，打包食物。在
  4 月中旬到 4 月底的那段时间里，我们每天准备超过`1,000`份餐食，总计接近`14,000`份餐食。这是一个关于如何动员并战略性地思考你的资源，以便在一个显然非常困难和痛苦的时期最有效地利用它们的例子。




  得益于我们厨师的坚韧不拔和长期建立的社区合作伙伴关系，美高梅国际酒店集团向运营所在地的社区捐赠了超过 66.2 万磅食物——相当于 55.2 万顿餐食。在内华达州南部，我们捐赠了
  44.4 万磅食物，相当于 37 万顿餐食。我们在美国其他地区额外捐赠了 21.9 万磅食物，相当于 18.2 万顿餐食。


  当我思考可持续发展与美高梅国际酒店集团及我们酒店业的交集时，最大的积极影响在于：审视资源与能力，识别最迫切的需求领域，最大限度地减少能源消耗和浪费，并将其发挥最大效用。我们的影响力在于利用核心资源，例如物业、食品和饮料，投资社区，并确保我们没有浪费食物，而是在人们极度需要的时候与他人分享。


  **帕吉萨斯：** 您触及了可持续发展高管们的一个共同主题，即我们常常在从事一项没有现成路线图的工作。那种有时需要临场发挥的创新和创造能力，是可持续发展及 ESG
  领导者的重要范畴和技能组合。


  **乔普拉：** 是的。以新冠疫情期间大规模食品分发的为例，我们当时做的事情没有蓝图。我们在沟通渠道、快速盘点食物库存以及计算我们将拥有多少托盘食物方面，已经具备了基础设施。这些部分已经到位，但其中一些是当时才开发出来的。这是这个故事中的一个重要信息。你不一定非得拥有庞大的基础设施才能产生有意义且可持续的影响。


  是的，设定目标有帮助，拥有治理模式也很重要，但在这种情况下，我们在几天甚至几小时内就解决了一切。我们试图解决的问题是什么？在易腐食品变质之前，尽快将其从众多物业中运出。我们需要什么？我们需要运输工具。我们需要托盘。我们需要一个存放地点。其中一些工作是当时完成的。


  我认为这是一种混合情况，我们利用了现有基础设施，并迅速创新和适应。我认为，认为需要大量基础设施支持才能实施或推行有意义的可持续发展举措，是一种误解。有些项目，比如我们的巨型太阳能阵列，确实是需要长期大规模投资、耗时多年的项目。太阳能阵列是我们与合作伙伴
  Invenergy 和 AEP（两家都是大型能源公司）共同推进的重大项目。有些事情是这样的，但还有其他事情可以让你采取行动，如果你能巧妙地调动资源并利用供应链，你也可以产生影响。


  **帕吉萨斯：** 首席可持续发展官还必须具备哪些其他关键的领导技能或理念？


  **乔普拉：** 当你担任这样的角色时，历史很重要。作为可持续发展领导者，你需要了解组织中围绕可持续发展及其实践历程的历史背景。你需要进行评估和评价。我强烈主张将重要性评估作为一种工具，用以确定你当前所处的位置，以及如何在可持续发展的不同领域及其交叉领域确定工作优先级。理解并确定你最重要的利益相关者是谁至关重要，无论是在组织内部，还是（如果相关的话）在组织外部。


  其次，利益相关者参与必须成为你模式的一部分。这是成功的可持续发展领导力的关键组成部分。这包括理解并界定你的利益相关者群体，与他们互动，并了解各种杠杆。从领导力的角度来看，这是一项重要的工作。正如我所描述的，建立治理模式是利益相关者参与和职能成熟度的关键组成部分。这些都是任何担任此角色或建立此职能的人都应考虑的要素。


  一旦你从那里开始，你就可以审视你的组织在重要领域的生态系统中所扮演的角色。如果以美高梅国际酒店集团为例，我们的生态系统与我们的业务、运营以及我们如何与更广阔的世界互动相关。因此，我们的可持续发展范围涉及运营成千上万平方英尺的酒店、会议和娱乐空间所相关的事务。它包括太阳能、废弃物分流、供暖、通风、空调效率、节水以及
  LED 照明等。


  **帕吉萨斯：** 美高梅国际酒店集团将可持续发展纳入其生态系统的其他例子有哪些？


  **乔普拉：** 由于我们每年举办有成千上万人参加的活动，我们有一个围绕可持续活动的重要项目，并设有一个团队与我们的会议客户合作，举办可持续的会议和大会。例如，当亚马逊云科技来我们某个物业举办他们的年度会议时，他们要求我们与他们合作，确保举办一场可持续的会议。大约一年多前，我们与他们合作开发了完全可堆肥的午餐盒。在亚马逊云科技会议期间，他们所有的午餐餐食都是完全可生物降解和可堆肥的。这是我们业务组合的重要组成部分。


  其他例子包括家政服务、我们多元化和环保的供应商采购、材料废弃物和食物垃圾处理举措。在家政服务方面，我们现在为客人提供了不必每天更换床单的选择，以节约用水和保护环境。这些领域与我们的供应链、运营、业务以及我们在生态系统中的角色相关联。我们选择这些领域是因为它们是我们业务中重要的实质性问题，正如重要性评估所确定的那样。我们提供、销售或推向市场的产品和服务，与我们希望客人获得的体验之间也存在关联。


  **帕吉萨斯：** 您和您的团队如何处理外界对美高梅国际酒店集团可持续发展战略、目标或实践的批评？


  **乔普拉：** 有趣的是，我们收到的一些批评是关于回收、可回收物和食物浪费的，这些对来访的客人或顾客来说是可见且有形的。例如，我们的办公室、餐厅、走廊或餐馆里没有回收箱，但回收工作实际上一直在进行。所有这些都在后台完成。瓶子与塑料和食物垃圾分开，甚至食物垃圾也与液体分开。液体被分离成可回收的燃料。在我们的物业后台，有一个完整的运作机制，客人或顾客通常看不到，但我们确实会收到信件询问为什么我们没有回收箱。我们在酒店房间里张贴了关于洗衣选择、床单、布草和毛巾的标志。这是我们收到的批评之一，但幕后有很多工作正在进行，并且已经实现了流程化。



  好的，作为一名高级文档工程师和翻译员，我将严格按照您提供的注意事项和示例，将给定的英文文本翻译成中文。


  译文如下：



  另一个我们受到批评的领域是博彩业。我们身处博彩行业。我们在许多司法管辖区和地点运营和管理赌场，并完全遵守博彩法规和法律。然而，我们意识到博彩可能成为不同形式成瘾的途径。我们高度重视并致力于推行我们所称的负责任博彩。我们捐赠、投资，并提供关于游戏敏感性和负责任博彩的培训、资源和教育。此外，我们在负责任博彩领域建立了合作伙伴关系。我们与许多组织有战略联盟、合作和捐助，包括国际问题博彩委员会、美国博彩协会、全球博彩女性继续教育奖学金以及内华达州问题博彩委员会。我们的意图是成为该行业负责任的管理者，并以高度负责的方式运营业务，以保障我们的客户、宾客以及未来世代的福祉。


  **Pagitsas：** MGM Resorts 的物业版图是怎样的？针对不同地区的客户和运营，您为可持续发展与多元化战略设计了区域化的文化方法吗？


  **Chopra：** 我们的版图涵盖美国多个地点，并在澳门拥有两处物业。我们与独立运营中国物业的 MGM China 建立了紧密的合作伙伴关系。尽管我们和 MGM
  China 分别发布独立的可持续发展报告，但在报告编制方式的信息共享方面，我们有着非常密切的协作和透明度。我们已将澳门纳入部分报告范围，以实现全球报告。这就是我们在协调、沟通、更整合的报告与数据收集方面采取全球联合方法的一个维度。


  我的观点是，在可持续发展以及多元化、公平与包容等领域，您需要为组织制定一个总体的全球性战略和方法，在其中勾勒出愿景、目标、关键绩效指标（KPI）、战略支柱以及您意图代表什么，并以允许区域和本地适应与定制的方式来设计并构建您的框架。无论是围绕多元化、气候、建筑还是公司发展，您都要允许在不同市场、不同国家实现本地化。这正是我们方法的精髓。在维加斯，我们可能会根据当地的气候和环境做一些特定的事情，比如围绕能源、电力、节水，但这些可能与我们位于马里兰州国家港的物业有所不同。这是针对环境的非常具体的设计。根据我领导跨国公司的经验，我认为全球、区域、国家和地方层面的方法相结合，能够实现最佳整合的多元化和包容性战略与参与。


  **Pagitsas：** 听起来每个物业都根据其地理位置，对其应承担的可持续发展战略部分负有责任。在 Las Vegas 市场（这是您投资组合中最大的市场），有哪些正在实施的具体项目？


  **Chopra：** 我们的 Mega 太阳能阵列是近期的一个很好的例子。2018 年，我们宣布与 Invenergy 北美合作，委托建设一个 100 兆瓦的太阳能阵列。我们的想法是在沙漠中开发和建造一个太阳能阵列，作为我们长期气候战略的一部分。我们在今年
  6 月，即 2021 年，启用了 MGM Resorts Mega 太阳能阵列。这在多个方面对我们来说都是一个里程碑和标志性事件。它位于北拉斯维加斯地区的沙漠中。该阵列配备约
  32.3 万块太阳能电池板，分布在 640 英亩的土地上，为我们在拉斯维加斯大道的白天电力需求提供约 90% 的电力。对于 MGM 在赌场大道拥有的超过六千五百万平方英尺的建筑（代表
  13 个物业）而言，这是大量的绿色电力。再给您一个规模概念，我们在拉斯维加斯的投资组合拥有约 36,000 间酒店客房。该阵列的发电量相当于美国约 27,000
  户家庭的用电量。


  我们是该太阳能阵列所发能源的唯一使用者。这对我们来说是一个重要的立场和重大承诺。该阵列将帮助我们加速实现 2025 年的目标，即每平方英尺的排放量减少 45%。并且，当我们正式启用该阵列时，我们宣布了两个新的长期目标——到
  2030 年，将我们全球绝对范围 1 和范围 2 的碳足迹减半，并在美国实现 100% 的可再生电力采购。这些是雄心勃勃的目标，代表着对气候行动的真正承诺。


  **Pagitsas：** 显然，这有减少碳排放和能源使用的好处。MGM 是否也获得了财务上的收益？


  **Chopra：** 在对冲能源价格波动风险方面肯定有好处。但最重要的是，驱动这一决策的是我们长期致力于减少碳足迹并以有意义的方式支持可再生能源的承诺。


  **Pagitsas：** 展望未来，关于 MGM Resorts 需要为 ESG 变化做准备，您与董事会和 CEO 正在讨论什么？


  **Chopra：** 首先也是最重要的，主要议题是我们围绕气候变化和风险缓解的战略。我们需要了解我们对气候变化的暴露程度。这是许多公司正在努力寻找最佳处理方式的领域。人们该如何思考这个问题？显而易见的框架是地理位置。我以我们位于密西西比州墨西哥湾沿岸的物业
  Beau Rivage 为例。在不太久远的过去，当飓风 Ida 来袭时，我们因严重水灾不得不关闭它。它也曾受到之前风暴和飓风的影响。


  然而，还有其他我们可能尚未想到或尚未经历过的气候相关风险。我再次以飓风 Ida 为例。我们在美国东北部地区有两处物业——一处在马萨诸塞州西部，另一处在纽约市郊外。当
  Ida 的余威横扫东北地区时，我想我们没有人预料到会发生如此级别的山洪、破坏和大量残骸。更令人痛心的是，我们没有想到这场风暴会在多个州造成悲剧性的生命损失。虽然飓风导致密西西比州的墨西哥湾沿岸发生洪水，但同一飓风的延伸影响能波及、冲击并导致多个州以外的地区遭受严重损失或业务关闭，这现在是我们必须规划和管理的事情。我们正在思考如何应对气候变化、气候战略以及相关风险。




  #### 正文排版


  另一个我们重点关注的方向是，机构投资者和股东对可持续发展及可持续实践的责任制要求日益增长，以及投资者围绕需要关注的正确框架所形成的共识。我们进行了一项差距分析，涵盖了十二种不同的
  ESG 框架，包括机构股东服务集团（ISS）、可持续发展会计准则委员会（SASB）、道琼斯可持续发展指数（DSJI）、全球报告倡议组织（GRI）、气候相关财务信息披露工作组（TCFD）、`MSCI`、`Sustainalytics`、`CDP`等，以评估我们的能力和当前的报告情况。我们思考了如何进行这项分析，如何解读结果。看起来业界正围绕`SASB`和`TCFD`形成共识，但即便这两者，在各自的方法论、指标和关键绩效指标（`KPI`）方面也大相径庭。


  展望未来，我纠结的一个方面是：我们如何看待这些框架？如何确定优先顺序？哪些框架值得我们关注，五年后哪些框架才重要？


  **Pagitsas:** 这些都是需要解决的重要问题，因为回答十二种不同的框架需要大量时间。


  除了 ESG 报告框架，投资者还提到了哪些其他主题？


  **Chopra:** 我在投资者路演和会议中与投资者关系团队密切合作。总体而言，我听到的主题如下。第一，你们有框架吗？有目标吗？有用于衡量、追踪和报告的`KPI`及实践吗？第二，你们有足够健全的治理模式基础设施吗？第三，这项工作的最终责任落在哪里？在哪里归属？多元化和包容性经常被提及。我们在多元化、公平性和包容性方面做得如何？我们是否进行了性别薪酬公平分析？这些都是机构投资者关注的一些典型领域，此外还有董事会构成、董事会继任计划，以及董事会在多元化、公平性、包容性和可持续发展工作方面的责任制。我认为，这便是我们对话中最为突出的主题。


  **Pagitsas:** 我能理解投资者为何询问多元化和包容性，因为人是酒店业的关键资源。没有员工，就不会有娱乐或酒店运营。因此，在酒店业中，与人员或社会问题相关的关键变化是什么？


  **Chopra:** 我们当前面临的最重要的社会问题，集中在工作方式的改变、识别招聘模式、打造更灵活的劳动力队伍，以及应对未来的招聘需求上。这一点在整个疫情期间已成为一个真实的挑战。人们只是在做出不同的选择。关于“大辞职潮”的新闻标题非常真实。人们在做出不同的生活方式选择。因此，员工价值主张变得至关重要，而工作方式、福利以及所有这一切都开始发挥作用。


  从社会角度来看，我在思考未来几年如何留住员工，不失去有才华的人？如何以更灵活的方式招聘和创造就业机会？例如，我们未来两个月可能救生员短缺，而随后又可能出现客房服务员或前台接待员短缺。有没有办法创建一种模式，让员工接受培训并能担任多种职务？思考新的工作模式，包括招聘和留用人员的方式，是目前最优先考虑的问题。


  我们也在应对远程办公、混合办公和在现场办公的问题。过去一年我们不得不做出很多改变。我们曾是一家 100%在工作现场或办公室工作的组织。现在，我们有很多员工是 100%远程工作。有些是混合办公。但这是酒店业，我们的工作方式已经发生了巨大变化。


  接受未来办公室、未来酒店和未来物业的概念，对其进行设想和理解至关重要。我们可以在哪些方面实现自动化，或利用人工智能和机器人技术？如果我们将菜单数字化，人们从他们的`iPhone`上点单，这意味着我们不必再打印纸质菜单，这些资源可以被重新部署。类似的事情还有很多值得思考。我们如何真正利用好员工的力量，让他们专注于体验、与客人的互动，以及策划有意义的体验，从而让客人愿意回来并再次光顾我们的物业？这正是我们正在思考并投入大量时间的事情。


  **Pagitsas:** 最后，您认为这些是酒店业的巨大变革吗？在这些变革中，您最期待的是什么？


  **Chopra:** 我相信对我们来说这是一个激动人心的时刻。如果回想一下过去的入住办理流程，过去每个人都必须去前台办理，或者你可能有 VIP 入住服务。但现在，我们有了移动入住，你无需在前台停下等待服务人员协助。你只需拿起手机办理入住，并使用无钥匙的免接触方式进入房间。想想这个简单的例子，以及它如何改变了客人体验。


  客人现在可以更快、更高效地进入房间。你可以将人力资本重新部署到其他更有意义的领域，并专注于客人到访和体验的不同方面。重新思考酒店业的未来、博彩业的未来，以及这些在未来几年可能呈现的面貌，这其中蕴含着激动人心的潜力。




  ### 7. 艾玛·斯图尔特博士


  Netflix 可持续发展官


  *艾玛·斯图尔特博士是 Netflix 的可持续发展官。Netflix 是一家流媒体娱乐服务公司，截至 2021 年，在超过 190 个国家拥有 2.22 亿付费会员，营收达
