  \ 1 号，邮编 10004。\n\n*献给丈夫李（Lee）和我们的儿子科斯莫（Cosmo）与菲利克斯（Felix）*\n\n## 前言\n\n在麻萨诸塞州剑桥市，一个消防站后面，与一家爵士俱乐部隔街相望，曾有一栋简朴的砖砌公寓楼。它有踢脚板供暖，地下室有一台投币式洗衣机，仅此而已。1980\
  \ 年代，我在这里长大，家境拮据。母亲叮嘱我和妹妹，离开房间时要关灯；如果抱怨新英格兰的冬天太冷，就穿件毛衣。炎热的夏夜里，我们只能敞开窗户，让消防车的警笛声和爵士乐声伴随凉风一起涌入。每一分电费的开销，都意味着我们在食物和学费上少了一分钱。\n\
  \n我几乎无法想象，三十年后的今天，我会致力于帮助数百万个像我家一样的家庭，让他们住上更节能、更节水的公寓楼，减少水电支出，并在冬夏两季都能拥有舒适的居家环境。弄清楚*如何*做到这一点，最终促成了这本书的写作。\n\
  \n21 世纪初，作为公用事业公司的顾问，我开始观察到能源和商业房地产行业正在发生转变。房地产开发商开始采用节能建筑、安装太阳能电池板，并减少对传统电网的能源需求。商业与环境的这一新交汇点，改变了我职业生涯的方向。我从编写能源价格预测系统，转而评估新兴市场的甲烷生物消化器的可行性，并就能源效率和可持续性战略为资产管理公司提供其商业房地产投资组合的咨询。\n\
  \n2010 年，房利美（Fannie Mae）聘请我为其多户住宅业务启动一项“绿色倡议”，这让我重新回到了公寓楼的世界。我的任务是找到一种方法，将他们的核心产品——商业抵押贷款——变得“更绿色”。问题是，如何让公寓楼的抵押贷款变得“绿色”？这些绿色抵押贷款不仅要保持盈利能力和低信用风险，我更是坚持认为，它们还必须提高住房质量，并降低中低收入家庭的能源和水费开支。\n\
  \n那么，我们是如何开始让公寓楼变得更节能、更节水的呢？与美国住房和城市发展部的合作，促成了多个绿色抵押贷款产品的试点，以及首批商业绿色债券的发行。为了将可持续发展原则融入现有的贷款承销流程，我和我的团队创建了一份标准化的能源审计报告，这份报告既能让能源工程师快速出具，又能让贷款机构理解和据此承销，同时满足绿色债券投资者对严谨性、一致性和透明度的要求。我与内部各部门的同事、一级贷款机构的发起人以及行业协会的利益相关者合作，将新的绿色抵押贷款产品交到公寓楼业主手中。这些方法共同推动了多户住宅商业抵押贷款价值链的转型。截至\
  \ 2021 年底，房利美已发行超过 1000 亿美元由绿色抵押贷款支持的绿色债券。\n\n与此同时，得益于活动家、非政府组织和私营部门的不懈努力，企业和公民社会需要采取行动应对气候变化和社会问题的意识和共识呈指数级增长。诸如可持续会计准则委员会（SASB）和气候相关财务信息披露工作组（TCFD）等新框架也已建立，旨在以处理财务数据同样的严谨性来处理环境数据。美国和欧洲的投资者开始询问企业的环境、社会和治理绩效，即常说的\
  \ ESG。ESG 正被当作一种结合定性与定量数据来评估企业宗旨、风险管理和价值的战略方法。认识到市场向 ESG 的转变，我向房利美的领导层提出了启动企业级 ESG\
  \ 战略的紧迫性。2019 年，我成为房利美的首位 ESG 官员。我感谢房利美领导层愿意迈出这充满信心的一步，并至今仍在推动公司的 ESG 转型。\n\n在房利美制定这些战略的过程中，我常常向那些负责可持续发展、绿色融资和\
  \ ESG 战略的同仁们请教。我们交流了在将可持续发展融入各自全球公司的核心服务和产品时，哪些方法有效、哪些无效的经验，以及如何争取到*肯定的答复*来试点新技术等等。我意识到，我们谈论最多的是*如何*实施成功的可持续发展与\
  \ ESG 战略，而不是*为什么*。我们都已回答了*为什么*必须采取行动来应对人类面临的重大挑战，例如气候变化和种族不平等。我的同仁们在全球组织担任高级管理职务这一事实，也意味着他们的执行领导和董事会同样回答了*为什么*的问题。\n\
  \n我们讨论的那些未解答的*如何*问题非常复杂，其潜在答案也因行业而异。如何在一家拥有数十亿美元营收、业务遍及多个大洲的公司内加速其正面的环境可持续性发展和积极的社会影响？如何克服内部惯性，启动新的试点项目或改造现有流程？当面临当前的季度财务目标挑战时，管理层团队如何保持对数十年\
  \ ESG 目标的关注？从金融服务到食品饮料，不同行业的公司如何优先处理对其多元利益相关者（从监管机构到农民）最为重要的问题？首席可持续发展官与其他 C 级高管的领导方式有何不同？以可持续发展的视角来看，商业的未来是什么？\n\
  \n\n### 持续全球危机与民间社会组织的角色\n\n持续的全球社会、经济和健康危机告诉我，企业及其领导层比以往任何时候都更需要知道这些关于 ESG 和可持续发展的\
  \ *如何做* 问题的答案。因此，在 2021 年，我在来自《财富》500 强公司和各行业全球知名品牌的二十五位高管的帮助下寻找答案。本书《首席可持续发展官在工作》记录了我们关于可持续发展与\
  \ ESG 的 *如何做* 的对话，有时我们甚至重新探讨了 *为什么*。\n\n为简洁起见，我使用 *首席可持续发展官* (CSO) 这个术语作为统称，涵盖可持续发展高管、ESG\
  \ 负责人以及可持续金融董事总经理。然而，并不存在千篇一律的 CSO。他们的职业经验涵盖从采购、市场营销到智库等领域，他们从伦敦、新加坡、香港到纽约和西雅图领导着公司的可持续发展战略。毫不意外，这些高管经常被赋予超出可持续发展范畴的职责，例如企业战略、利益相关方管理、采购、人力资源、慈善事业等等。\n\
  \n然而，当我询问这些高管如何领导一项可信、可扩展且成功的可持续发展与 ESG 战略时，我反复听到五个主题：*优先事项、耐心、产品、流程* 和 *合作伙伴关系*。最终，五个完整的答案围绕这些主题汇聚而成，并印证了我建立和领导绿色债券业务及企业\
  \ ESG 战略的经验。CSO 们 *了解* 其外部和内部利益相关方的 *优先事项*。凭借这种认知，他们将公司资源集中于此，以推动环境和社会影响以及财务价值。杜克能源公司的\
  \ Katherine Neebe 清晰地阐述了每家公司在踏上可持续发展之旅时必须回答的问题：哪些问题对公司至关重要，而公司对哪些问题至关重要？正如贝莱德公司的\
  \ Michelle Edkins 和 Alexis Rosenblum 所指出的，即使利益相关方众多且意见截然相反，倾听并找出如何真诚地回应他们仍然很重要。\n\
  \n-   了解 *优先事项*。\n-   投资于 *耐心*。\n-   与 *产品* 相结合。\n-   推动 *流程* 和系统变革。\n-   建立新的 *合作伙伴关系*。\n\
  \n## CSO 们\n\nCSO 们必须进行创新，以创造能够缩小当今可能性与其 2030 年及以后宏伟 ESG 目标之间差距的技术、工具和方法。但是，缩小差距所需的创新水平要求\
  \ CSO 及其公司 *投资于耐心*。新的解决方案可能需要数年时间才能变得可扩展、盈利并产生影响力。百威英博的 Ezgi Barcenas 和高管管理团队在同时批准雄心勃勃的\
  \ ESG 目标和一个旨在试点和推广可持续创新的新加速器项目时，就进行了这样的投资。\n\n在此期间，CSO 们如何在 ESG 战略上取得进展？通过 *将 ESG\
  \ 和可持续发展原则融入新老产品中*。宝洁公司的 Virginie Helias 多次展示了这一答案的力量，无论是开发由回收塑料制成的海飞丝瓶子，还是发起一项教育宣传活动，引导消费者在洗衣机中使用更凉的水以节省能源。\n\
  \nCSO 们 *推动流程和系统的变革*，以管理风险并创造积极成果。在 PVH 公司，Marissa (Pagnani) McGowan 和她的团队改变了数千家服装厂的审计流程，使\
  \ PVH 能够更好地了解其服装生产地点、支持其工人并提高环境效率。在宏观层面，英杰华投资者公司的 Steve Waygood 提出需要重新定义 G20、联合国和经济合作与发展组织的角色，以更好地支持人类和地球。\n\
  \n最后同样重要的是，CSO 们告诉我 *建立新的合作伙伴关系* 的重要性。亚马逊的 Kara Hurst 将诸如《气候宣言》和“通过加速森林融资降低排放（LEAF）联盟”等公私合作伙伴关系归功于放大了应对气候变化的行动呼吁并实施解决方案。\n\
  \n这些高管共同描绘了作为一名首席可持续发展官意味着什么，以及要了解 *如何* 应对可持续发展（而不仅仅是 *为什么*）需要付出什么。这些是适用于任何领导者的永恒经验，尤其对于那些寻求开创一种新的、可持续且有影响力的商业方式的人来说。无论您是经验丰富的可持续发展专业人士、刚加入新的\
  \ ESG 团队，还是一位正在确定可持续发展对您业务线意味着什么的“非可持续发展”领导者，这些经验都将帮助您把握机遇和未来的道路。\n\n我们的星球迫切需要像这些\
  \ CSO 一样的领导者。一旦您知道 *如何* 领导一项成功的可持续发展与 ESG 战略，我希望您加入我们。\n\n——Chrissa Pagitsas  \n\
  2022 年 2 月 1 日  \n华盛顿特区\n\n"
- '# 引言


  本书包含对来自《财富》500 强公司和全球知名品牌、负责可持续发展及环境、社会和治理（ESG）事务的首席可持续发展官（CSO）及高级高管的二十四次深度访谈。每一章都捕捉了受访高管与作者之间关于可持续发展与商业交汇点的丰富对话。


  这些高管通过管理核心产品和服务的环境与社会影响，在其公司的长期增长战略中扮演着核心角色。CSO 们正在探索如何应对气候变化和社会不公，同时监管框架和投资者预期也在不断变化。他们让我们得以一窥可持续发展与商业的未来，以及是什么每天都在激励他们应对我们世界面临的最大挑战。


  无论您是可持续发展专业人士、董事会成员，还是公司业务线或运营部门的领导者，本书都将帮助您驾驭这种新的可持续商业方式。CSO 们揭示了他们如何成功地与公司内部的同事以及外部的公共和私营实体合作，这是任何商业领袖都必备的关键技能。


  在每一章中，CSO 们分享了其公司截至 2021 年底的可持续发展与 ESG 目标。随着时间的推移，这些目标可能会随着公司雄心的扩大而改变，但他们分享的关于如何领导企业战略的经验是持久的。同样，可持续发展与
  ESG 的技术语言和实践也在迅速演变且范围广泛。在这些章节中，高管们对相同或相似的概念使用了不同的词语，例如 *温室气体* 和 *碳排放*。为保持每位受访者独特的表述并忠实于他们所领导的战略，这些术语未经标准化处理。


  ## 谁应该阅读本书？


  -   CSO 与 ESG 领导者及其团队

  -   C 级高管和董事会成员

  -   与可持续发展领导者和团队合作的业务领导者

  -   可持续发展与 ESG 顾问

  -   学习可持续发展与商业的学生

  -   所有在其职责中接触可持续发展与 ESG 职能的其他人员


  ## 读者将从本书中学到什么？


  -   CSO 们如何在全球数十亿美元的公司领导可持续发展战略，以创造积极的环境、社会影响和财务价值

  -   未来五到十年，可持续发展与 ESG 将如何改变商业格局

  -   如何与内部同事及董事会合作，将可持续发展融入核心商业产品和服务

  -   如何驾驭不断变化的监管环境，同时与外部利益相关方建立有意义且真诚的合作伙伴关系




  ## 示例问题


  每位首席可持续发展官（CSO）都接受了关于其商业与可持续发展战略、可持续发展广义领域、ESG 与可持续金融，以及其领导方式与管理风格的访谈。以下问题概述了所问的要点，但每场访谈各有不同。每位高管与作者的对话通常持续一小时，并经过编辑以确保清晰易读。


  ### 战略


  - 如何在一家营收达数十亿美元的全球公司中，加速企业的积极环境与社会影响，并创造价值？


  - 如何克服内部惯性，启动新试点项目或对流程进行改造？


  - 谁最终对可持续发展战略的成功负责？


  - 高管管理团队如何平衡以 2030 年及 2040 年为目标的 ESG 指标与季度财务目标？


  - 从金融服务到食品饮料等不同行业的公司，如何优先处理对其多元化利益相关者（从监管机构到农民）至关重要的问题？


  ### 可持续发展、ESG 与可持续金融


  - 贵公司可持续发展、ESG 或可持续金融战略的主要支柱是什么？


  - 为应对气候变化及温室气体范围 1、2、3 排放，设定了哪些雄心勃勃的目标？


  - 如何使用气候相关财务信息披露工作组（TCFD）和可持续发展会计准则委员会（SASB）等报告框架？


  - 联合国可持续发展目标（UN SDGs）在贵公司的战略中扮演什么角色？


  - 金融机构如何帮助传统能源和化石燃料行业的客户向低碳未来转型？


  - 2021 年在格拉斯哥举行的联合国缔约方大会（COP）上达成的协议有何影响？


  - 多元、公平与包容如何与可持续发展战略相互交织？


  ### 领导力与管理


  从这些高管来之不易的经验中学习，并准备好带领您的企业迈向更可持续、更公平的未来。


  - 首席可持续发展官的领导方式与其在 C 级高管层的同事有何不同？


  - 可持续发展团队在组织中的位置是哪里？为何放在那里？


  - 自从您担任此职位以来，您的角色发生了哪些变化？


  - 在招聘团队成员时，您看重哪些技能和经验？


  - 作为高级管理人员，您的领导理念和方法是什么？


  - 您职业生涯中有哪些关键时刻改变了您的经营方式？


  从这些高管来之不易的经验中学习，并准备好带领您的企业迈向更可持续、更公平的未来。


