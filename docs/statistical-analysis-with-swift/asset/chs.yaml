- "# 1. Swift 入门\n\n> *Swift 是一种通用编程语言，采用现代方法构建，注重安全性、性能和软件设计模式。*\n> \n> ——Swift.org\n\
  \n苹果公司在 2014 年全球开发者大会上推出了 Swift 编程语言，旨在取代 C、C++ 和 Objective-C 等其他基于 C 的语言。自那时起，Swift\
  \ 通过力求在性能、安全性和易用性之间取得完美平衡，发展了一个充满激情的开发者社区。\n\n## Swift 概览\n\n在深入探讨统计分析之前，我们需要问自己几个问题：Swift\
  \ 是否是合适的技术选择。其他语言也支持此类计算，其中许多语言还拥有优秀的第三方库，进一步扩展了标准库的功能。为了说服自己 Swift 是完成这些任务的理想工具，让我们来看看该语言及其生态系统的一些优势特性。\n\
  \n### 性能\n\n现代计算中的一个瓶颈是，它通常涉及处理大量数据。例如，微软的恶意软件分类数据集大小接近半 TB，而谷歌的地标识别数据则由超过 120 万个数据点组成。处理如此庞大的数据量需要强大的硬件支持，同时也要求我们所使用的编程语言足够高效。\n\
  \n自 2014 年以来，性能一直是 Swift 营销中的一个重要关键词。与 C 和 C++ 竞争的愿景为速度和效率设定了高标准，许多基准测试表明，Swift\
  \ 在追赶方面表现得相当不错。与如今已成为数据科学家黄金标准的 Python 相比，基准测试表明，相应的 Swift 程序可能会实现显著的加速。既然我们知道有大量数据需要处理，那么高性能的语言总是受欢迎的。然而，大量复杂数据对我们的工具如何安全、正确地操作这些数据提出了新的要求。\n\
  \n### 安全性\n\n安全性是 Swift 发展过程中的指路明灯。在此背景下，安全性意味着该语言主动尝试保护开发者，避免其编写导致未定义行为的代码。这些安全特性包括一些简单的措施，比如鼓励使用不可变变量。然而，它们也包含更加复杂的方案和要求。\n\
  \nSwift 采取的最突出的安全措施之一是使用 `Optional` 类型。如果我们需要表示某个值的缺失，我们必须使用空的 `Optional`，而不是裸空值。有些人认为这是一种不必要的僵化设计，会导致更多的样板代码。然而，这迫使开发者明确标记数据可能缺失的实例，并安全地处理这些情况。\n\
  \n另一个重要的安全特性是要求对修改操作进行独占内存访问。设想一个场景：两个不同的方法调用同时访问同一个内存位置。只要两个方法都只是读取内容然后继续，我们就可以认为这是安全的操作。然而，一旦其中一个（或两个）方法想要修改存储的值，问题就会变得棘手。内存位置中的最终内容将取决于哪个方法最后执行写操作。Swift\
  \ 通过要求修改操作独占访问权限，即只允许单个调用在任意时刻注册修改某个内存位置，从而帮助指出不安全的代码。\n\n### 正确性\n\n一旦我们开始处理大量复杂数据，确保产生正确的结果就变得更具挑战性。我们可以通过融入大量可靠的软件工程实践来解决其中的许多问题。然而，我们也应该充分利用开发工具提供的任何帮助。\n\
  \nSwift 从函数式编程的世界中汲取了大量灵感。开发者被积极鼓励考虑*值类型*，并且仅当引用语义至关重要时才使用*引用类型*。在可能的情况下，我们应该优先使用*值类型*，这有很多原因，但我们只关注那些在处理大数据集时对我们直接有益的原因。\n\
  \n使用*值类型*的第一个真正优势在于，它们在内存分配方面通常性能更高。Swift 通常将*引用类型*分配在堆上，而*值类型*通常位于栈上。当然，总有例外，但这可以作为一个很好的经验法则。在栈上分配对象的过程只需系统递增一个指针，这是一个非常快速的操作。然而，在堆上分配对象时，系统需要在该内存区域中搜索一个足够大的空位。这个过程要慢得多，并且如果我们需要分配大量对象时，这种差异会非常明显。\n\
  \n第二个优势是，*值类型*在不同变量之间共享时会进行自我复制。这一特性意味着我们可以确信，没有其他变量能够在我们背后更改我们当前正在处理的数据。这种局部性使得我们更容易推断结果，并对单独的代码部分进行完整性检查。一旦我们需要并行化工作，它也能简化事情。\n\
  \n\n\n## 硬件加速\n\n在处理大量数据时，使用硬件加速可以带来巨大的好处。并行处理信息的能力能够加快程序执行速度，最终减少空闲时间。Swift 提供了多个框架，让开发者能够利用多核\
  \ CPU 和 GPU。\n\n我们在本书中解决的问题大多将依赖 `Accelerate` 框架，主要使用其线性代数功能。阅读本书后，若想更深入探究并行计算，`Metal`\
  \ 框架可提供对图形处理器的访问，并能实现计算并行化与加速。前述两种框架均默认预装在每台苹果电脑上。然而，我们有时也会发现系统库不足以胜任相关工作。\n\n##\
  \ Swift 包管理器\n\n在进行任何数据科学任务时，便捷地获取优质外部库是一个重要方面。得益于 Swift 包管理器的发展，收集和管理此类项目依赖项的任务已变得简单得多。例如，该工具允许开发者将第三方库纳入项目并直接开始使用。\n\
  \n其他工具也曾提供过类似功能，例如 CocoaPods 和 Carthage。但它们从未像如今的 Swift 包管理器一样与 Xcode 环境紧密结合。我们将借助这一点，导入能够帮助我们操作和可视化数据的库。\n\
  \n## 结论\n\n回顾上述特性，我们可以得出结论：在处理统计分析数据时，Swift 及其生态系统拥有许多理想特质。有理由相信，一旦开始使用这门语言，它将会为我们提供良好支持。同样现实的是，使用\
  \ Swift 可能会带来其他工具难以甚至无法实现的优势。带着这些结论，是时候深入了解本书将用到的一些语言细节了。\n\n## 使用 Swift 工作\n\n\
  本节将涵盖一些实用的概念，有助于减少处理大数据集时的摩擦。其中一些适用于通用编程，另一些则针对 Swift 的工作方式。本节还将介绍配套的代码仓库，说明项目的总体结构以及如何在阅读本书时充分利用它。\n\
  \n### 数据格式\n\n数据点可以有多种不同形式，我们选择存储信息的方式也因情况而异。在挑选格式时，存储大小、可读性以及用于打包和解包信息的可用工具等因素都扮演着重要角色。表\
  \ 1-1（见下页）描述了 Swift 社区中几种流行的数据格式。\n\n对于本书中的示例，我们选择使用 CSV 文件存储配套数据。做出这一决定有多方面原因：\n\
  \n表 1-1  \nSwift 社区中几种流行的数据格式\n\n| 格式 | 文件扩展名 | 描述 |\n| --- | --- | --- |\n| JavaScript\
  \ 对象表示法 | `.json` | JSON 是一种人类可读的半结构化数据格式。 |\n| 可扩展标记语言 | `.xml` | XML 是一种结构化数据格式，具有较好的人类可读性。\
  \ |\n| 逗号分隔值文件 | `.csv` | CSV 是一种紧凑格式，通常以人类可读的方式存储表格数据。 |\n| 协议缓冲区 | `.pb`, `.proto`\
  \ | 协议缓冲区是一种用于结构化数据的序列化方法，可将信息转换为二进制格式。它非常紧凑，但不太适合人类阅读。 |\n\n1.  CSV 是一种轻量级格式，内存占用相对较小。\n\
  \n2.  CSV 将数据记录作为行存储在简单的文本文件中，使其成为一种非常直观且易于理解的格式。\n\n3.  CSV 文件通常只包含纯文本，具有高度的可读性，这在学习环境中非常有益。\n\
  \n4.  Swift 包管理器提供了多个用于读写 CSV 文件的库，降低了处理它们时的摩擦。\n\n### 代码项目\n\n本书配套的代码仓库包含了我们在不同章节中解决问题的可运行示例。下载项目后（可通过本书在\
  \ apress.com 的产品页面上的 GitHub 链接获取），项目通过 `StatisticalSwift.xcworkspace` 文件打开。请注意，所有代码示例都位于根据各自章节编号命名的项目文件中。要运行某个章节的代码，我们首先需要选择正确的方案。点击顶部工具栏中“运行”和“停止”按钮旁边的方案选择按钮，即可选择正确的章节。这样做会告诉\
  \ Xcode 要执行哪个目标，然后我们可以按下 `Cmd+R` 或点击“运行”按钮来运行代码。\n\n\n\n#### Decodable 协议\n\nSwift\
  \ 标准库提供了相当多与编码、解码和数据处理相关的优秀特性。在本书中，我们将大量使用其中的许多特性，但其中一个对于启动工作尤为重要——那就是 `Decodable`\
  \ 协议。\n\n`Decodable` 协议本身（如代码清单 1-1 所示）既简单又强大。它只要求遵循该协议的类型实现一个能够从 `Decoder` 实例化对象的初始化器。\n\
  \n```\nprotocol Decodable {\ninit(from decoder: Decoder) throws\n}\n代码清单 1-1\n来自\
  \ Swift 标准库的 Decodable 协议\n```\n\n如我们所见，这个初始化器接受一个 `Decoder` 类型的对象作为参数。`Decoder`\
  \ 是另一个由能够从原生数据格式读取值的类型所实现的协议。例如，一个 `Decoder` 类型可以读取一个 CSV 文件，解析其中的行和数据值，然后将这些值提供给\
  \ `Decodable` 的初始化器来创建新的 Swift 对象。为了直观理解这在实际中是如何工作的，我们将逐步演练如何解码一个小的 CSV 文件。代码清单\
  \ 1-2 展示了一个包含两位人士（Anna 和 Keith）信息的 CSV 文件示例，而代码清单 1-3 则展示了一个名为 `Person` 的 Swift\
  \ 类型，我们打算用它来存储解码后的值。\n\n```\nstruct Person: Decodable {\nlet name: String\nlet age:\
  \ Int\nenum CodingKeys: String, CodingKey {\ncase name = \"name\"\ncase age = \"\
  age\"\n}\ninit(from decoder: Decoder) throws {\nlet container = try decoder\n.container(keyedBy:\
  \ CodingKeys.self)\nself.name = try container\n.decode(String.self, forKey: .name)\n\
  self.age = try container\n.decode(Int.self, forKey: .age)\n}\n}\n代码清单 1-3\n用于展示\
  \ Decodable 协议功能的 Swift 类型\n```\n\n```\nname,age\nAnna,34\nKeith,36\n代码清单 1-2\n\
  用于 Decodable 演练的 CSV 文件\n```\n\n查看 `Person` 类型，我们看到它声明遵循 `Decodable` 协议。为了满足协议要求，我们定义了初始化器，并请求\
  \ `Decoder` 解包我们想要使用的值。我们还定义了一个名为 `CodingKeys` 的枚举，它提供了我们请求的值与 CSV 中对应键之间的映射。通过这种方式，我们告诉\
  \ `Decoder` 在请求不同值时应该使用哪些键。\n\n> **注意**  \n> 在许多情况下，我们无需手动实现代码清单 1-3 中的初始化器和 `CodingKeys`\
  \ 枚举。只要我们的结构体只包含其他遵循 `Decodable` 的类型，并且属性名与数据文件中的键名相同，Swift 就能自动为我们合成这些代码。\n\n现在我们的\
  \ `Person` 类型已经实现了所有必要功能，我们可以开始解码数据了。代码清单 1-4 展示了将 CSV 文件转换为 `Person` 对象的代码。需要注意的一点是，`CSVDecoder`\
  \ 并非 Swift 标准库的一部分，它属于一个名为 *CodableCSV* 的包，我们将在后文介绍。\n\n```\nlet decoder = CSVDecoder\
  \ { config in\nconfig.headerStrategy = .firstLine\n}\nlet people = try decoder\n\
  .decode([Person].self, from: csvFile)\nfor person in people {\nprint(person)\n}\n\
  // 输出：\n// Person(name: \"Anna\", age: 34)\n// Person(name: \"Keith\", age: 36)\n\
  代码清单 1-4\n解码 CSV 并创建 Person 结构体数组\n```\n\n代码清单 1-4 的代码淋漓尽致地展现了 `Decodable` 的优势。我们只需告知\
  \ `CSVDecoder` 要解析哪些数据以及期望返回的类型，就能将一个数据文件转换为易于使用的 Swift 类型。然而，统计分析并不仅仅涉及从磁盘读取文件。既然我们已经知道如何从文件加载数据，接下来我们将使用\
  \ `DataLoader` 类型将数据读入内存。这不仅让我们摆脱了定位数据文件和处理样板代码的负担，还能让我们专注于主要任务——学习统计分析的概念。在后续示例中，当我们探讨如何在\
  \ Swift 中访问和操作已加载的数据时，将会介绍 `DataLoader`。\n\n\n\n#### `KeyPath` 类型\n\nSwift 标准库中最强大的特性之一就是\
  \ `KeyPath` 类型。它让开发者能够在运行时动态访问对象属性，同时又不牺牲类型安全。在本节中，我们将通过几个代码示例，探索 `KeyPath` 类型的概念及其在编写灵活且可维护代码中的应用。\n\
  \n首先，我们来看如何使用 `KeyPath` 访问对象属性。下一页的代码清单 1-5 展示了用 `KeyPath` 打印每个 `Person` 对象姓名的示例。同时，该示例还介绍了\
  \ `DataLoader` 的使用，它是 `StatisticalSwift` 模块的一部分。为了从数据集中获取所有人的数组，我们调用了 `load(_:from:)`\
  \ 方法，并指定期望返回的类型。\n\n```\nlet people = DataLoader.load(\nPerson.self,\nfrom: .people\n\
  )\nlet nameKey = \\Person.name\nfor person in people {\nlet name = person[keyPath:\
  \ nameKey]\nprint(\"Name: \\(name)\")\n}\n// 输出:\n// Name: Anna\n// Name: Keith\n\
  代码清单 1-5\n使用 KeyPath 从人员 CSV 文件中打印姓名\n```\n\n我们使用 `\\` 操作符，后跟要引用的属性，来创建一个 `KeyPath`\
  \ 实例。新实例的类型是 `KeyPath<Person, String>`，这明确表示我们引用的是 `Person` 对象中存储的一个 `String` 属性。这个特定示例相较于熟悉的点语法并没有增加多少价值，它的目的是介绍这种类型及其最基本的用法。要探索一个更实际（且更贴近真实场景）的用例，请看下一页的代码清单\
  \ 1-6。\n\n```\nlet names = people\n.map(\\.name)\n.joined(separator: \" and \")\n\
  let ages = people\n.map(\\.age)\n.map(String.init)\n.joined(separator: \" and \"\
  )\nlet totalAge = people\n.sum(over: \\.age)\nprint(\n\"\"\"\nWe have \\(names)\
  \ with us today!\nThey are aged \\(ages), respectively,\ntotaling \\(totalAge) years\
  \ together!\n\"\"\"\n)\n// 输出:\n// We have Anna and Keith with us today!\n// They\
  \ are aged 34 and 36, respectively,\n// totaling 70 years together!\n代码清单 1-6\n\
  使用 KeyPath 执行数据转换\n```\n\n在这个例子中，`KeyPath` 类型将不同的属性转换为新的数据类型。在创建 `names` 和 `ages`\
  \ 变量时，`KeyPath` 将相应的属性值映射到数组中，然后这些数组可以进一步处理并格式化为 `String` 对象。请注意，这个示例使用了隐式成员语法来引用属性。只要编译器能推断出我们正在处理\
  \ `Person` 类型，就可以使用 `\\.name` 这个简写形式，而不是 `\\Person.name` 来引用 `name` 属性。\n\n`totalAge`\
  \ 变量提供了一个稍微复杂且更有趣的用例。方法 `sum(over:)` 来自 `StatKit` 模块，它不要求 `KeyPath` 引用特定类型的属性，而是要求被引用的类型遵循\
  \ `AdditiveArithmetic` 协议。这意味着我们可以自由指向任何属性，只要该属性存储的类型支持 `+` 操作符即可。\n\n最后，我们快速了解一下\
  \ `PartialKeyPath`。这种类型将动态行为发挥到了极致，因为它对被引用的属性没有任何类型要求。这一特性使得编写高度灵活的代码成为可能，前提是我们能够对类型擦除的对象执行预期的操作。代码清单\
  \ 1-7 展示了这一示例。\n\n```\nlet partialkeys: [PartialKeyPath] = [\n\\Person.name,\n\\\
  Person.age\n]\nfor _ in 1 ... 5 {\nguard\nlet randomKey = partialkeys.randomElement(),\n\
  let person = people.randomElement()\nelse { continue }\nlet value = person[keyPath:\
  \ randomKey]\nprint(value)\n}\n// 输出 5 个随机属性值，\n// 例如 Anna、Keith 或 36\n代码清单 1-7\n\
  使用部分类型擦除的 KeyPath 随机打印 Person 对象的某个属性\n```\n\n这些示例展示了不同 `KeyPath` 类型的一些可能用途。当我们开始着手解决本书后续提出的问题时，会发现这种类型如何完美融入工作流程，以及它如何让我们轻松改变计算逻辑。接下来，我们该讨论一个在前面的示例中已初见端倪、并且在深入实现之前需要理解的主题了。\n\
  \n\n\n#### 高阶函数\n\n在构建数据转换管道时，使用高阶函数通常十分有用。高阶函数是指至少满足以下条件之一的函数：\n\n- 它接受一个或多个其他函数作为输入。\n\
  - 它返回另一个函数作为输出。\n\n如前所述，我们在一些示例中已经使用过高阶函数。在代码清单 1-4 中，我们将一个尾随闭包（即一个函数）传入了 `CSVDecoder`\
  \ 的初始化器来配置解析策略。在代码清单 1-6 中，我们使用了 `map(_:)` 方法，通过 `KeyPath` 对部分数据进行了转换。\n\n高阶函数在\
  \ Swift 标准库和第三方库中很常见。我们中的许多人可能已经使用过它们，甚至自己都未曾意识到。除了 `map(_:)`，Swift 标准库还提供了 `filter(_:)`、`reduce(_:_:)`\
  \ 和 `sorted(by:)` 等方法，仅举几例。为了深入理解这些方法的运作方式，我们将实现一个新的高阶函数，作为 `MutableCollection`\
  \ 协议的扩展。这样做可以让我们看到其底层实现，并理解高阶函数在操作数据时能有多么强大。\n\n我们的高阶函数名为 `apply(to:_:)`。其概念相对简单——对于数据集中的每一个数据点，它计算一次转换并将结果写回该数据点。你可以使用这类方法在数据送入统计计算管道之前，对其进行即时整理或优化。例如，此类操作可能包括对数值数据进行重新缩放、量化或归一化。代码清单\
  \ 1-8 展示了该函数的实现及其使用示例。\n\n```\nextension MutableCollection {\n    mutating func\
  \ apply(\n        to key: WritableKeyPath,\n        _ transform: (T) -> T\n    )\
  \ {\n        for index in self.indices {\n            let newValue = transform(\n\
  \                self[index][keyPath: key]\n            )\n            self[index][keyPath:\
  \ key] = newValue\n        }\n    }\n}\n\nvar points = [\n    CGPoint(x: 1, y: 1),\n\
  \    CGPoint(x: 2, y: 2),\n    CGPoint(x: 3, y: 3)\n]\n\nprint(\"Before: \\(points)\"\
  )\npoints.apply(to: \\.y) { value in\n    value * value\n}\nprint(\"After:  \\(points)\"\
  )\n// 输出:\n// Before: [(1.0, 1.0), (2.0, 2.0), (3.0, 3.0)]\n// After:  [(1.0, 1.0),\
  \ (2.0, 4.0), (3.0, 9.0)]\n代码清单 1-8\n高阶函数 apply(to:_:) 的实现\n```\n\n代码清单 1-8 中的代码相当复杂。让我们简单过一遍其中的一些关键部分，以了解发生了什么：\n\
  \n- 我们对 `MutableCollection` 协议进行扩展。这使得该实现可用于所有支持可变操作的集合类型。这种功能的传播得益于 Swift 面向协议的特性，但我们在本书中不再进一步探讨该机制。\n\
  - 方法 `apply(to:_:)` 接受两个参数。第一个参数是 `KeyPath` 类型，它可以引用数据元素的任何泛型属性。这种特定类型的 `KeyPath`\
  \ 也支持写操作，而不仅仅是读操作。\n- 第二个参数是另一个函数。它使用泛型类型 `T` 同时作为输入和输出，这与 `KeyPath` 引用的 `T` 相同。该函数应将数据属性的当前值转换为某种更易于使用或更适合其他计算的新值。\n\
  - 在方法体中，`apply(to:_:)` 遍历集合中的所有数据点。它应用转换函数，并将新值写回到数据集中。当函数返回时，数据集不再包含旧值，而是包含了指定的转换结果。值得注意的是，`apply(to:_:)`\
  \ 对如何转换值一无所知。该函数由开发者在调用点指定，这使得该方法非常灵活。\n\n当然，这个函数内部还有更多微妙之处，我们或许可以用一整章来讨论它们。不过，这几个要点应该足以让你理解我们想传达的主要思想。高阶函数是强大的工具，能提供高度可定制的方式来操作数据，我们将在解决本书中的问题时频繁使用它们。\n\
  \n## 本章小结\n\n本章探讨了 Swift 是否适合用于统计分析问题。我们审视了该语言周边的生态系统，以及它在处理此类任务时如何满足我们的需求。经过一番讨论，我们得出结论：Swift\
  \ 作为一种语言，提供了许多我们在进行统计分析时希望使用的特性。\n\n我们还研究了 Swift 的一些细节，特别关注那些对我们用例格外重要的类型和概念。我们学习了如何使用\
  \ `Decodable` 协议解码数据，以及如何使用不同的 `KeyPath` 类型和高阶函数来操作数据点。掌握了这些见解和新知识后，我们该开始研究实际的主题——统计分析了。\n\
  \n**注意**\n\nSwift.org 上有大量关于 Swift 编程语言的优秀资源。欲了解更多信息，请访问 [`https://swift.org`](https://swift.org)。\n\
  \n"
- "# 2. 概率与随机变量导论\n\n既然我们已经讨论了选择 Swift 作为统计分析主要工具的可行性，接下来应该温习一下概率和随机变量的概念。这些是统计学的基本构建块，我们将在本书中频繁使用它们。本章介绍一些数学理论，并为我们讨论问题和解决方案时使用的许多符号奠定基础。本章还讨论了其他关键方面，例如独立性、变异性和条件性。闲话少叙，让我们从学习概率开始吧。\n\
  \n\n\n## 概率\n\n即便我们可能没有意识到，概率并非只是研究人员和工程师专属的数学概念。我们所有人每天都在评估和解读概率。如果我们计划本周末去海滩，而天气预报显示周六有\
  \ 60%的降雨概率，我们可能会改选周日出行。如果我们听说今天早上常走的上班路线交通状况糟糕，我们可能会冒险绕道以准时到达。诚然，在大多数此类情况下，我们大多数人可能不会进行任何严格的数学分析。相反，大多数时候，我们可能依赖于一种直觉，即哪种行动能最大化实现目标的可能性。然而，当紧要关头时，我们仍然在估计和评估不同结果的概率。\n\
  \n概率的核心，只是一种帮助我们理解某个事件发生可能性的工具。正如我们之前所见，有些人可能用 0 到 100 之间的数字以百分比形式来表达。本书将采用 0 到\
  \ 1 之间（含端点）的实数来表达概率。这种表示法在科学界更为常见，也更便于计算。我们通过以下方式描述概率及其对相关事件的影响：\n\n- 如果事件的概率接近\
  \ 1，则事件**非常可能**发生。\n- 同样地，如果事件的概率接近 0，则事件**非常不可能**发生。\n- 概率为 0 或 1 的事件是确定的。概率为 0\
  \ 表明结果不可能发生，而概率为 1 则表明结果必然发生。\n\n举一个具体的例子，我们可以考虑变量赋值 `let myConstant = 5`。我们使用 `let`\
  \ 关键字声明了该变量，这使其不可变。我们可以用以下概率来描述 `myConstant`：\n\n![$$ P\\left[\\mathrm{myConstant}=5\\\
  right]=1 $$](images/512351_1_En_2_Chapter/512351_1_En_2_Chapter_TeX_Equa.png)\n\n\
  上面的符号读作“`myConstant` 等于 5 的概率为 1”，并且告诉我们，无论我们查看多少次，`myConstant` 的值都肯定是 5。\n\n然而，统计学和概率论激动人心之处在于当我们离开确定性的时候。例如，某件事情的概率为\
  \ 0.3 意味着什么？为了让后续的讨论易于理解，我们将使用一个简单的六面骰子作为例子。用一个熟悉的事物来展示有时很抽象的主题的实用性，希望能让我们更好地理解为什么讨论这些主题对我们有益。\n\
  \n### 样本空间\n\n在估计一个或多个事件的概率之前，了解哪些事件是可能出现的会很有帮助。在我们的六面骰子示例中，枚举所有可能的结果相对容易。这样做之后，我们得到了从\
  \ 1 到 6 的所有整数的集合。我们称这些数字为样本空间，并用字母 S 表示，如下所示：\n\n![$$ S=\\left\\{1,2,3,4,5,6\\right\\\
  } $$](img/512351_1_En_2_Chapter_TeX_Equb.png)\n\n这个特定的样本空间是一个相当易于管理的数字列表，这对我们来说很幸运。然而，许多其他问题的样本空间是巨大的，甚至是无限的。例如，如果我们让某人挑选他们能想到的任何实数，我们的样本空间将是所有实数的集合，这是一个无限集合。\n\
  \n既然我们知道 S 包含了掷骰子的所有可能结果，我们也可以推导出概率最基本公理之一，即：\n\n![$$ P\\left[\\mathrm{S}\\right]=1\
  \ $$](images/512351_1_En_2_Chapter/512351_1_En_2_Chapter_TeX_Equc.png)\n\n上面的等式指出，如果我们掷一个骰子，结果有\
  \ 100%的把握是样本空间中的某个样本点。\n\n### 事件\n\n事件是样本空间中样本点的一个子集。假设我们定义 E[1] 为骰子显示偶数点数的掷骰结果；我们实际上是说\
  \ E[1] = {2, 4, 6}。如果我们再定义一个事件 E[2] 为显示奇数点数的掷骰结果，我们就得到了两个所谓的互斥事件。如果两个事件永远不能同时发生，则称它们是互斥的。在我们的例子中，推理很简单。因为我们掷出的点数要么是偶数，要么是奇数，永远不会同时是两者，所以\
  \ E[1] 和 E[2] 永远不能同时发生。这个性质为另一个概率公理奠定了基础，该公理指出：\n\n如果 {E[1], E[2], E[3], …} 是一组互斥事件的集合，那么\n\
  \n![$$ P\\left[{E}_1\\cup {E}_2\\cup {E}_3\\cup \\dots \\right]=P\\left[{E}_1\\\
  right]+P\\left[{E}_2\\right]+P\\left[{E}_3\\right]+\\dots $$](images/512351_1_En_2_Chapter/512351_1_En_2_Chapter_TeX_Equd.png)\n\
  \n这个公理告诉我们，一组互斥事件的并集的概率等于各个事件概率之和。我们假设骰子是均匀的，每次掷骰子每个面出现的概率相等。我们通过将 1（整个样本空间的概率）除以集合中的项数来计算各个概率，这样每个结果的概率都是\
  \ 1/6。现在我们定义一个事件 A，使得一次掷骰结果为 1 或 2。使用前面的公式，我们计算出 A 的总概率是\n\n![$$ P\\left[A\\right]=P\\\
  left[ roll=1\\cup roll=2\\right]=P\\left[ roll=1\\right]+P\\left[ roll=2\\right]=\\\
  frac{1}{6}+\\frac{1}{6}=\\frac{1}{3} $$](images/512351_1_En_2_Chapter/512351_1_En_2_Chapter_TeX_Eque.png)\n\
  \n需要特别注意的是，这个计算仅在事件互斥的假设下才成立。如果不互斥，我们将需要借助另一个众所周知的规则。\n\n> **注意**  \n> 上一条公理中使用的\
  \ `∪` 运算符称为并集运算符。它接收两个项目集合并将它们合并成一个集合。两个集合的并集包含原始集合中的所有元素，但不会有任何重复项。\n\n\n\n## 一般加法法则\n\
  \n一般加法法则与我们刚刚使用的公式非常相似。它用于计算事件并集的总概率，但同时也考虑了这些事件可能并非互斥的情况。该法则可以表述如下：\n\n![$$ P\\\
  left[{E}_1\\cup {E}_2\\right]=P\\left[{E}_1\\right]+P\\left[{E}_2\\right]-P\\left[{E}_1\\\
  cap {E}_2\\right] $$](images/512351_1_En_2_Chapter/512351_1_En_2_Chapter_TeX_Equf.png)\n\
  \n我们通过一个代码示例来看看为什么这个公式能修正重叠事件的计算。下一页的清单 2-1 展示了互斥事件 `E[1]` 和 `E[2]` 的公式应用。紧随其后的清单\
  \ 2-2 展示了同一公式以及一般加法法则应用于两个重叠事件 `E[2]` 和 `E[3]` 的情况。前者得出错误结果，而后者正确。事件 `E[1]`、`E[2]`\
  \ 和 `E[3]` 定义如下：\n\n- `E[1]`：掷骰子结果为 1。\n- `E[2]`：掷骰子结果为 2。\n- `E[3]`：掷骰子结果为偶数。\n\
  \n```\nlet E3 = { (roll: Int) -> Bool in\nreturn roll.isMultiple(of: 2)\n}\nlet\
  \ nonMutExUnionProb = Double(\ndieRolls.filter { roll in\nE2(roll) || E3(roll)\n\
  }.count) / totalCount\nlet E3Prob = Double(\ndieRolls.filter(E3).count\n) / totalCount\n\
  let E2andE3 = Double(\ndieRolls.filter { roll in\nE2(roll) && E3(roll)\n}.count)\
  \ / totalCount\nlet genAddRule = E2Prob + E3Prob - E2andE3\nprint(\n\"\"\"\nEvents\
  \ E2 and E3, no mutual exclusivity:\nP[E2 || E3]:   \\(nonMutExUnionProb)\nP[E2]:\
  \         \\(E2Prob)\nP[E3]:         \\(E3Prob)\nP[E2] + P[E3]: \\(E2Prob + E3Prob)\n\
  P[E2] + P[E3] - P[E2 && E3]: \\(genAddRule)\n\"\"\"\n)\n// Prints:\n// Events E2\
  \ and E3, no mutual exclusivity:\n// P[E2 || E3]:   0.5\n// P[E2]:         0.16666666666666666\n\
  // P[E3]:         0.5\n// P[E2] + P[E3]: 0.6666666666666666\n// P[E2] + P[E3] -\
  \ P[E2 && E3]: 0.5\n清单 2-2\n使用一般加法法则计算重叠事件并集的概率\n```\n\n```\nlet dieRolls = Array(1\
  \ ... 6)\nlet totalCount = Double(dieRolls.count)\nlet E1 = { (roll: Int) -> Bool\
  \ in\nreturn roll == 1\n}\nlet E2 = { (roll: Int) -> Bool in\nreturn roll == 2\n\
  }\nlet mutExUnionProb = Double(\ndieRolls.filter { roll in\nE1(roll) || E2(roll)\n\
  }.count\n) / totalCount\nlet E1Prob = Double(\ndieRolls.filter(E1).count\n) / totalCount\n\
  let E2Prob = Double(\ndieRolls.filter(E1).count\n) / totalCount\nprint(\n\"\"\"\n\
  Mutually Exclusive events E1 and E2:\nP[E1 || E2]:   \\(mutExUnionProb)\nP[E1]:\
  \         \\(E1Prob)\nP[E2]:         \\(E2Prob)\nP[E1] + P[E2]: \\(E1Prob + E2Prob)\n\
  \"\"\"\n)\n// Prints:\n// Mutually Exclusive events E1 and E2:\n// P[E1 || E2]:\
  \   0.3333333333333333\n// P[E1]:         0.16666666666666666\n// P[E2]:       \
  \  0.16666666666666666\n// P[E1] + P[E2]: 0.3333333333333333\n清单 2-1\n计算互斥事件并集的概率\n\
  ```\n\n互斥情况下的公式为何失效，起初可能并不显而易见。我们可以通过观察每个事件所涵盖的样本点来揭示问题所在。\n\n![$$ {E}_1=\\left\\\
  {1\\right\\}{E}_2=\\left\\{2\\right\\}{E}_3=\\left\\{2,4,6\\right\\} $$](img/512351_1_En_2_Chapter_TeX_Equg.png)\n\
  \n观察 `E[1]` 和 `E[2]`，很容易看出这两个事件没有任何重叠的样本点，也就是说它们是互斥的。然而，我们也能看到 `E[2]` 和 `E[3]` 共享一个样本点，即数字\
  \ 2。如果使用互斥事件的公式，我们最终会把掷出数字 2 的概率重复计算一次！一般加法法则正是为了解决这个问题。公式末尾的减法确保我们只计算一次重叠样本点的概率。图\
  \ 2-1 以可视化方式展示了这些重叠的集合。\n\n![../images/512351_1_En_2_Chapter/512351_1_En_2_Fig1_HTML.png](img/512351_1_En_2_Fig1_HTML.png)\n\
  \n图 2-1\n\n用维恩图显示的两个事件之间的重叠。一般加法法则通过减去本会被重复计算的元素概率来补偿重叠部分\n\n现在我们已经了解了样本空间和事件的基本概念，接下来还应该看看事件序列之间如何相互依赖。让我们将掷骰子的示例扩展为连续投掷两次的情况。第一次掷出偶数的概率是多少？或者第二次掷出奇数的概率是多少？类似地，如果第一次掷出偶数，那么第二次掷出奇数的概率又该如何计算？这些正是接下来我们要探讨的问题。\n\
  \n\n\n### 条件概率\n\n在大量统计问题中，事件发生的概率会随着另一事件是否发生而变化。例如，上班途中燃油耗尽的概率，会根据我们昨天是否加满油而取不同的值。另一个例子是，在德州扑克游戏中拿到同花顺的概率，取决于我们起手牌拿到的牌。这些依赖关系并不总是容易考虑。有时，建模这种关系颇具挑战性。其他时候，我们根本不知道这种依赖关系存在。然而，如果我们能形式化两个事件之间的关联方式，我们就能用这一知识丰富我们的模型，并可能改进我们做出的任何预测。\n\
  \n为了解释条件概率的概念，让我们重新审视我们的骰子——不过这次，我们以不同的方式设置前提条件。首先，我们不只是掷一颗骰子。相反，我们首先掷一颗常规的六面骰子。根据第一次掷骰的结果，我们将面临两种不同的情况：\n\
  \n- 如果第一次掷出的是偶数，我们将用一颗只有偶数的骰子进行第二次投掷。\n- 类似地，如果第一次掷出的是奇数，我们将用另一颗只有奇数的骰子进行投掷。\n\n\
  让我们看看与这个问题相关的不同样本空间。第一次掷骰的样本空间 `S` 与我们之前看到的一样，即从 1 到 6 的所有整数。然而，第二次掷骰本身并没有明确定义的样本空间。它可能是\
  \ `S[2] = {1, 3, 5}` 或 `S[2] = {2, 4, 6}`，具体取决于第一次掷骰的结果。如果有人问我们第二次掷出 2 的概率，我们无法用我们目前掌握的工具来回答。然而，我们可以以第一次掷骰为条件，并针对特定结果给出答案。为了表示条件概率，我们使用以下符号：\n\
  \n![$$ P\\left[ rol{l}_2=2| rol{l}_1=x\\right]P\\left[ rol{l}_1=x\\right] $$](images/512351_1_En_2_Chapter/512351_1_En_2_Chapter_TeX_Equh.png)\n\
  \n这个等式读作“给定第一次掷骰结果为 `x` 时，第二次掷骰结果为 2 的概率”。它强调了两个重要概念。第一个是条件概率。由于我们确定了第一次掷骰有一个特定结果\
  \ `x`，我们也能说出第二次掷出数字 2 的概率。例如，我们可以说：\n\n![$$ P\\left[ rol{l}_2=2| rol{l}_1=1\\right]P\\\
  left[ rol{l}_1=1\\right]=0 $$](images/512351_1_En_2_Chapter/512351_1_En_2_Chapter_TeX_Equi.png)\n\
  \n如果我们第一次掷出了 1，根据我们设定的规则，第二次就不可能掷出 2。\n\n这里展示的第二个重要概念是乘法规则。在数学符号中，我们将其写成：\n\n![$$\
  \ P\\left[ rol{l}_1=x\\cap rol{l}_2=y\\right]=P\\left[ rol{l}_2=y| rol{l}_1=x\\\
  right]P\\left[ rol{l}_1=x\\right] $$](images/512351_1_En_2_Chapter/512351_1_En_2_Chapter_TeX_Equj.png)\n\
  \n两个事件的联合概率可以看作是单个概率的乘积，同时考虑了它们之间可能存在的条件关系。下一页的代码清单 2-3 展示了两个条件概率计算的代码示例。第一个计算了我们前一页所做的相同掷骰序列，第二个计算了在已知掷出偶数的条件下，单次掷出\
  \ 4 的概率。\n\n乘法规则对于计算两个事件同时发生的联合概率非常强大。我们已经在研究相互依赖的事件时看到了如何使用它的例子。然而，如果我们能假设它们之间没有这种关系，我们就可以大大简化计算，这正是下一节的主题。\n\
  \n**注**\n\n代码清单 2-3 中使用的 `realValue` 属性来自 `StatKit` 库，其作用仅仅是将数值类型转换为 `Double`。\n\
  \n```\nlet dieRolls = Array(1 ... 6)\nlet evenRolls = [2, 4, 6]\nlet oddRolls =\
  \ [1, 3, 5]\nlet firstIs1Prob = dieRolls.filter { roll in\nroll == 1\n}.count.realValue\
  \ / dieRolls.count.realValue\nlet secondIs2Prob = oddRolls.filter { roll in\nroll\
  \ == 2\n}.count.realValue / oddRolls.count.realValue\nlet rollIs4GivenEvenProb =\
  \ dieRolls.filter { roll in\nroll == 4\n}.count.realValue / evenRolls.count.realValue\n\
  let rollIsEven = dieRolls.filter { roll in\nroll.isMultiple(of: 2)\n}.count.realValue\
  \ / dieRolls.count.realValue\nprint(\n\"\"\"\nP[roll2 == 2 | roll1 == 1]*P[roll1\
  \ == 1]:\n\\(secondIs2Prob * firstIs1Prob)\nP[roll1 == 4 | roll1 == even]*P[roll1\
  \ == even]:\n\\(rollIs4GivenEvenProb * rollIsEven)\n\"\"\"\n)\n// 输出：\n//P[roll2\
  \ == 2 | roll1 == 1]*P[roll1 == 1]:\n// 0.0\n// P[roll1 == 4 | roll1 == even]*P[roll1\
  \ == even]:\n// 0.16666666666666666\n代码清单 2-3\n使用 Swift 计算条件概率\n```\n\n### 独立性\n\
  \n我们再次拿出骰子，在没有特殊规则或限制的情况下投掷两次。我们有理由相信，第一次投掷的结果不会改变我们第二次投掷时掷出特定数字的概率。无论第一次掷出的结果是\
  \ 1、6 还是 4，我们掷出 2 的概率都是相同的。这个性质被称为**独立性**，如果我们能假设我们研究的事件满足该性质，它就能显著简化我们的计算。上一节中的乘法规则可以简化为以下表达式：\n\
  \n![$$ P\\left[ rol{l}_1=x\\cap rol{l}_2=y\\right]=P\\left[ rol{l}_2=y\\right]P\\\
  left[ rol{l}_1=x\\right] $$](images/512351_1_En_2_Chapter/512351_1_En_2_Chapter_TeX_Equk.png)\n\
  \n第二次掷骰的概率不再依赖于第一次掷骰的结果，因此我们去掉了那个条件。我们最终只需要将各个结果的概率相乘。如果我们想计算第一次掷出 4 且第二次掷出 2 的概率，我们会得到：\n\
  \n![$$ P\\left[ rol{l}_1=4\\cap rol{l}_2=2\\right]=P\\left[ rol{l}_2=2\\right]P\\\
  left[ rol{l}_1=4\\right]=\\frac{1}{6}\\cdotp \\frac{1}{6}=\\frac{1}{36} $$](images/512351_1_En_2_Chapter/512351_1_En_2_Chapter_TeX_Equl.png)\n\
  \n依赖性和独立性的概念在统计分析中随处可见。它们可以帮助使我们的模型更准确，也可以简化数学表达式和逻辑推理。在下一节中，我们将介绍统计学中最重要的定理之一。它建立在条件概率的基础之上，并允许我们提取那些否则将极难发现的信息。\n\
  \n\n\n## 贝叶斯定理\n\n托马斯·贝叶斯牧师是 18 世纪的统计学家和长老会牧师。以他命名的定理用于计算条件概率`P[E[1]|E[2]]`。清单 2-4\
  \ 中的示例比较宽容。我们很快就能找出`P[roll[1] = 4 | roll[1] ∈ {2, 4, 6}]`的正确值，从而完成所有计算。然而，在许多情况下，这些值要难找得多。让我们通过一个玩具示例来探讨这样一种情况：\n\
  \n> *一个气象站每天测量温度和日照情况。在一年的时间里，40%的日子气温超过 20°C，而 50%的日子是晴天。60%的晴天里气温超过 20°C。如果今天气象站显示气温为\
  \ 22°C，那么出太阳的概率是多少？*\n\n我们想要在室外气温高于 20°C 的条件下，确定出太阳的概率。用数学符号表示，我们要找的是：\n\n`P[天气\
  \ = 晴天 | 温度 > 20]`\n\n快速盘点已知信息，我们已知以下条件：\n\n- `P[温度 > 20] = 0.4`\n- `P[天气 = 晴天]\
  \ = 0.5`\n- `P[温度 > 20 | 天气 = 晴天] = 0.6`\n\n虽然最后一个表达式与我们感兴趣的非常相似，但并不完全正确。然而，正如我们即将看到的，这三个表达式合起来足以提供计算所需概率的信息。\n\
  \n在关于条件概率的部分，我们看到可以用以下公式表示两个事件同时发生的概率：\n\n`P[E[1] ∩ E[2]] = P[E[2] | E[1]] P[E[1]]`\n\
  \n不过，我们以哪个事件为条件并不重要。以下“反转”后的表达式同样有效，因为我们只需交换条件事件即可：\n\n`P[E[1] ∩ E[2]] = P[E[1]\
  \ | E[2]] P[E[2]]`\n\n这一认识恰恰是贝叶斯定理所利用的。现在我们有了两个等式，其左边相等，因此我们也可以通过代入法将两个右边等同起来：\n\
  \n`P[E[1] | E[2]] P[E[2]] = P[E[2] | E[1]] P[E[1]] ⟺ P[E[1] | E[2]] = (P[E[2] |\
  \ E[1]] P[E[1]]) / P[E[2]]`\n\n我们刚刚推导出了贝叶斯法则，这是统计分析中应用最广泛的公式之一。回到我们的天气示例，现在我们有了计算所需概率的方法。我们只需将事件代入贝叶斯法则即可，得到以下表达式（为简洁起见，我们省略一些繁复的符号，因为所讨论的事件仍然很清楚）：\n\
  \n`P[晴天 | 温度 > 20] = (P[温度 > 20 | 晴天] P[晴天]) / P[温度 > 20] = (0.6 * 0.5) / 0.4 =\
  \ 0.75`\n\n利用贝叶斯定理，我们计算出在室外温度为 22°C 的条件下，出太阳的概率为 75%。至于这一信息对我们有多大价值，取决于附近是否有窗户可以让我们看一眼外面。然而，同样的原理适用于许多有趣的问题，其中一些我们将在本书后面看到。\n\
  \n## 随机变量\n\n我们在本书前面已经处理过随机变量，尽管从未明确提及。例如，在骰子示例中，`roll[1]`和`roll[2]`都是随机变量。其作用是将样本空间元素映射为可用于计算的实数值。对于骰子来说，我们已经可以将骰子面上的点数表示为实数，因此映射就是恒等函数。\n\
  \n其他文献通常用单个大写字母表示随机变量，例如`X`、`Y`和`Z`。为了为进一步阅读提供衔接基础，我们也将采用这种表示法。在骰子示例中，先掷出 2 点再掷出\
  \ 4 点的概率转化为以下表示法：\n\n`X[1]：第一次投掷`\n\n`X[2]：第二次投掷`\n\n`P[X[1] = 2 ∩ X[2] = 4] = P[X[1]\
  \ = 2] P[X[2] = 4] = (1/6) * (1/6) = 1/36`\n\n请注意，随机变量本身并不能提供关于我们实际投掷骰子会看到什么结果的信息。即使我们知道每个面出现的概率是六分之一，这并不意味着我们投掷六次就会看到每个数字各出现一次。同样，即使我们投掷六次，也不能保证一定会看到数字\
  \ 1。清单 2-4 展示了一段代码片段，说明了这一点。\n\n```\nstruct Die {\n    func roll() -> Int {\n  \
  \      return .random(in: 1 ... 6)\n    }\n}\n\nlet die = Die()\nfor _ in 1 ...\
  \ 5 {\n    let rolls = (1 ... 5)\n        .map { _ in String(die.roll()) }\n   \
  \     .joined(separator: \", \")\n    print(\"We rolled \\(rolls)\")\n}\n// 输出：\n\
  // We rolled 1, 4, 4, 1, 3\n// We rolled 1, 5, 6, 1, 6\n// We rolled 6, 1, 6, 6,\
  \ 5\n// We rolled 6, 6, 4, 2, 1\n// We rolled 3, 3, 2, 5, 2\n清单 2-4\n一个示例，说明即使是公平的骰子，在六次投掷中也可能不会出现所有可能的点数\n\
  ```\n\n> **注意：** 清单 2-4 中打印的骰子投掷结果是随机的。这意味着每次运行代码时，结果很可能有所不同。\n\n\n\n### 离散型与连续型随机变量\n\
  \n随机变量的另一个特性与其样本空间有关，即它们是离散的还是连续的。本章开头我们提到，样本空间囊括了所有可能的实验结果。我们还举例说明了两个样本空间：一个是掷骰子，另一个是让朋友任意选择一个实数作为随机数。与这些实验相关的随机变量属于不同类别——掷骰子是离散型随机变量，而朋友选择的随机数则是连续型。\n\
  \n要将随机变量归类为离散型或连续型，我们需要问自己两个关于其样本空间的问题：\n\n1.  样本空间是有限的吗？\n2.  样本空间是可数的吗？\n\n这两个问题可能看起来很相似。“可数的”不就是“有限的”另一种说法吗？答案是否定的，我们将通过几个例子来阐明：\n\
  \n-   骰子有六个不同的面，因此其样本空间由六个数字组成。由于样本空间中的数字数量有限，并且我们可以遍历所有数字，这是一个**有限**集合。\n-   我们抛一枚硬币，记录需要抛多少次才能得到反面。我们可能很幸运，只抛一次就得到反面，但也可能非常不幸，一直抛到世界末日。样本空间由所有正整数组成，即\
  \ `{1, 2, 3, 4, ...}`。这个集合是无限的，因为我们计数可以一直往上没有上限。然而，我们仍然可以从 1 开始无限地枚举样本点。这种样本空间我们称之为**可数无限**。\n\
  -   让朋友选择一个实数作为随机数，意味着他们有可能选择整个实数轴上的任意数，这是一个无限集。然而，与之前的抛硬币例子不同，这个集合的样本点是不可数的。即使我们将选择范围限制在\
  \ 0 到 1 之间的实数，样本点也是不可数的。我们从 0 开始枚举，但接下来呢？如果我们下一步选择 0.1，那么 0.05 又该怎么办？实数的特性在于，通过增加更多小数位，我们总能在两个数之间找到新的值。这个性质使得即使在\
  \ 0 和 1 之间，样本点也是无限且不可数的。我们将这类集合称为**不可数无限**。\n\n现在我们知道了如何对样本空间分类，也就准备好定义随机变量是离散还是连续的含义了：\n\
  \n-   与**有限**或**可数无限**样本空间相关联的随机变量是**离散型**随机变量。\n-   如果随机变量的样本空间是**不可数无限**，则该随机变量是**连续型**随机变量。\n\
  \n离散与连续的概念在后续章节中非常重要，因此我们必须尽早理解它们的定义。\n\n### 章节总结\n\n本章涵盖了我们将在本书中用到的一些最重要的理论概念。我们探讨了概率及其不同表示形式，学习了样本空间、事件和条件概率。当我们发现统计学中最重要的定理之一——即贝叶斯定理时，本章早期学到的理论得到了很好的应用。我们还研究了随机变量，并学习了如何根据其样本空间的属性将它们分类为离散型或连续型。\n\
  \n既然我们已经掌握了基础知识，现在是时候回答一些关于随机变量及其样本空间的更深入问题了。如果样本空间中的某个点出现的可能性是其他点的两倍，会发生什么？我们如何对不同结果的可能性进行建模？对于一个并非所有结果皆等可能的随机变量，我们如何为其生成随机值？在下一章中，我们将讨论分布。\n\
  \n"
- "# 3. 分布\n\n在上一章中，我们讨论了随机变量的一些特性。然而，关于其样本空间，仍有一个关键方面需要我们讨论和理解，以便解决问题。回到骰子的例子，我们知道抛一次骰子相关的样本空间包含从\
  \ 1 到 6 的所有整数。虽然这是有用信息，但仅凭样本空间本身并不能告诉我们掷出特定数字的可能性有多大。\n\n到目前为止，我们假设每个骰子面出现的概率相等，但情况可能并非总是如此。如果有人动了手脚，使得掷出\
  \ 2 点的可能性是其他数字的两倍呢？在这种情况下，我们如何描述掷出偶数的几率？这些是我们在本章中将讨论并回答的一些问题。\n\n## 什么是分布？\n\n分布是对样本空间中各点可能性的一种描述。对于一枚公平的骰子，每个面出现的可能性相同，总概率\
  \ 1 被均匀分布在六个可能的结果上。我们可以用以下函数来表达这个分布：\n\n```\nP[X=x] = {\n    1/6   if x ∈ {1,2,3,4,5,6}\n\
  \    0     其他情况\n}\n```\n\n我们也可以使用柱状图来表示公平骰子的分布。将样本点放在 X 轴上，相对概率放在 Y 轴上，我们就能得到如图\
  \ 3-1 所示的图表。\n\n![../images/512351_1_En_3_Chapter/512351_1_En_3_Fig1_HTML.jpg](img/512351_1_En_3_Fig1_HTML.jpg)\n\
  \n图 3-1：掷骰子不同结果的概率\n\n正如我们在上一章中发现的，掷骰子的样本空间是离散的，因为它包含一个有限的样本点集合。我们还了解到，这种分类同样适用于代表掷骰子的随机变量，使其成为*离散型随机变量*。除此之外，这种分类也适用于分布，因为分布同样描述样本空间。因此，公平骰子的分布是一个*离散分布*。同样的逻辑也适用于*连续分布*，后者处理的是不可数无限的样本空间。\n\
  \n本章剩余部分将探索和理解一些最常见的标准分布，它们的属性、参数，以及我们可以从中推导出哪些有用信息。我们将在后续章节中利用这些信息进行进一步计算，因此必须尽早对它们的含义建立良好的直觉。我们从离散分布开始。\n\
  \n\n### 伯努利分布与伯努利试验\n\n伯努利试验的概念非常简单。我们进行一次单一的实验（即一次试验），其结果要么是成功，要么是失败。通常我们用 `p`\
  \ 表示成功的概率，用 `q` 表示失败的概率。由于这些事件互斥且构成了整个样本空间，我们可以用以下公式描述它们的关系：\n\n![$$ q=1-p\\kern0.75em\
  \ \\Longleftrightarrow \\kern0.75em p+q=1 $$](img/512351_1_En_3_Chapter_TeX_Equb.png)\n\
  \n现在想象我们抛一枚硬币，并将正面朝上定义为“成功”。这意味着我们将反面朝上定义为“失败”。如果硬币是均匀的，那么它两面朝上的概率均为 0.5。这种硬币的柱状图与我们之前看到的掷骰子示意图类似，只不过有两个柱形而不是六个。在数学上，我们通过以下方式描述这样一枚硬币：\n\
  \n![$$ X\\sim Bernoulli(0.5) $$](img/512351_1_En_3_Chapter_TeX_Equc.png)\n\n上述符号告诉我们，随机变量\
  \ `X`（代表抛硬币的结果）服从伯努利分布，并且\n\n![$$ p=0.5 $$](img/512351_1_En_3_Chapter_TeX_Equd.png)\n\
  \n![$$ q=1-p=1-0.5=0.5 $$](img/512351_1_En_3_Chapter_TeX_Eque.png)\n\n也就是说，抛这枚硬币时，两面朝上的可能性相同。然而，让我们考虑另一种场景：硬币稍有瑕疵，正面朝上的概率略高一些。\n\
  \n假设这枚新硬币正面朝上的概率为 0.54，并用随机变量 `Y` 表示它。那么，根据同样的逻辑，我们通过以下方式描述它：\n\n![$$ Y\\sim Bernoulli(0.54)\
  \ $$](img/512351_1_En_3_Chapter_TeX_Equf.png)\n\n![$$ p=0.54 $$](img/512351_1_En_3_Chapter_TeX_Equg.png)\n\
  \n![$$ q=1-p=0.46 $$](img/512351_1_En_3_Chapter_TeX_Equh.png)\n\n我们第一反应可能认为这没什么大区别。抛这枚新硬币时，它两面朝上的概率仍然接近\
  \ 50-50。然而，如果我们多次抛这枚硬币，就会发现这一微小偏差会导致正面朝上的次数多于反面朝上的概率更大。我们可以通过编写一个类似代码清单 3-1 的小脚本来演示这一点，该脚本模拟抛\
  \ 10,000 枚硬币各两次，每次正面朝上的概率不同。\n\n```\nfunc simulate(p: Double) {\n    let q = (100\
  \ - p * 100).rounded() / 100\n    let results = (1 ... 10000)\n        .reduce(into:\
  \ [0, 0]) { result, _ in\n            let success = Double.random(in: 0 ... 1) <\
  \ p\n            result[success ? 1 : 0] += 1\n        }\n        .enumerated()\n\
  \        .map { index, count in\n            let outcome = (index == 0) ? \"Tails\"\
  \ : \"Heads\"\n            let probability = (index == 0) ? q : p\n            return\
  \ \"\\(outcome) (\\(probability)): \\(count)\"\n        }\n    print(\n        \"\
  \"\"\n        \\(results.joined(separator: \"\\n\"))\n        \"\"\"\n    )\n}\n\
  simulate(p: 0.50)\nsimulate(p: 0.54)\n// -- 这些输出可能会有所不同，因为\n// -- 我们处理的是随机变量\n//\
  \ 输出：\n// Tails (0.5): 5042\n// Heads (0.5): 4958\n//\n// Tails (0.46): 4588\n//\
  \ Heads (0.54): 5412\n代码清单 3-1\n模拟两组各 10,000 次抛硬币的序列，其中一组 p = 0.5，另一组 p = 0.54\n\
  ```\n\n### 几何分布\n\n现在我们知道了如何思考具有二元结果的单一试验。然而，在某些情况下，我们可能想了解关于最终成功概率的一些信息。例如，如果我们开始反复抛一枚硬币，它在第三次尝试时正面朝上的可能性有多大？就样本空间而言，我们可以将其表示如下：\n\
  \n![$$ S=\\left\\{H, TH, TTH, TTTH,\\dots \\right\\} $$](img/512351_1_En_3_Chapter_TeX_Equi.png)\n\
  \n硬币可能在第一次尝试时就正面朝上，但也可能在成功之前连续出现几次反面。如果我们非常不走运，可能会在成功之前出现无限次反面朝上的抛掷结果。计算每种情况发生的概率并不比应用乘法规则更困难。\n\
  \n使用伯努利试验部分的符号和推理，单次抛掷成功的概率是 `p`。要计算第二次尝试成功的概率，我们需要考虑第一次尝试失败。由于每次抛掷相互独立，我们可以通过将失败一次和成功一次的概率相乘来计算结果。\n\
  \n![$$ P\\left[X=2\\right]=p\\cdotp q $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equj.png)\n\
  \n我们可以通过在首次成功前增加更多失败次数，并将它们的概率相乘来继续扩展这个公式：\n\n![$$ P\\left[X=3\\right]=p\\cdotp\
  \ q\\cdotp q=p\\cdotp {q}² $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equk.png)\n\
  \n![$$ P\\left[X=4\\right]=p\\cdotp q\\cdotp q\\cdotp q=p\\cdotp {q}³ $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equl.png)\n\
  \n![$$ P\\left[X=5\\right]=p\\cdotp q\\cdotp q\\cdotp q\\cdotp q=p\\cdotp {q}⁴ $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equm.png)\n\
  \n![$$ P\\left[X=6\\right]=p\\cdotp q\\cdotp q\\cdotp q\\cdotp q\\cdotp q=p\\cdotp\
  \ {q}⁵ $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equn.png)\n\n\
  ![$$ \\dots $$](img/512351_1_En_3_Chapter_TeX_Equo.png)\n\n这些公式可以很好地归纳为一个简洁的表示法，我们将其写作：\n\
  \n![$$ P\\left[X=x\\right]=p\\cdotp {q}^{x-1}\\kern0.75em ,\\kern0.75em x\\in {\\\
  mathbb{N}}^{+}\\kern0.75em ,\\kern0.75em p\\in \\left(0,1\\right] $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equp.png)\n\
  \n我们刚刚推导出了几何分布的*概率质量函数* (PMF)。PMF 为我们提供了一个公式，用于计算离散分布中某个结果出现的可能性。该符号还表明，`x` 必须是正整数集合中的元素，且参数\
  \ `p` 必须位于区间 `0 < p ≤ 1` 内。正如在伯努利试验示例中一样，我们可以根据 `p` 的值计算出参数 `q`。\n\n下一页的代码清单 3-2\
  \ 展示了一个简短的程序，用于计算参数 `p = 0.4` 的几何分布的 PMF。如果将其映射回抛硬币的例子，该程序计算的是：假设我们的硬币稍微偏向于反面朝上，在特定的尝试次数后首次出现正面朝上的概率。将结果绘制成柱状图，我们得到如图\
  \ 3-2 所示的示意图。\n\n![../images/512351_1_En_3_Chapter/512351_1_En_3_Fig2_HTML.png](img/512351_1_En_3_Fig2_HTML.png)\n\
  \n图 3-2\n绘制参数 p = 0.4 的几何分布的概率质量函数 (PMF)\n\n\n\n```swift\nimport Foundation\nprivate\
  \ static func geometricPMF(\nof x: Int,\nwith p: Double\n) -> Double {\nprecondition(0\
  \ < x, \"0 ≮ x.\")\nprecondition(0 < p && p <= 1, \"p ∉ (0, 1].\")\nreturn p * pow(1\
  \ - p, Double(x) - 1)\n}\n(1 ... 8)\n.reduce(into: [Int: Double]()) { result, x\
  \ in\nresult[x] = geometricPMF(of: x, with: 0.4)\n}\n.sorted(by: <)\n.forEach {\
  \ trials, prob in\nlet probability = String(format: \"%.4f\", prob)\nprint(\"\\\
  (trials): \\(probability)\")\n}\n// 输出：\n// 1: 0.4000\n// 2: 0.2400\n// 3: 0.1440\n\
  // 4: 0.0864\n// 5: 0.0518\n// 6: 0.0311\n// 7: 0.0187\n// 8: 0.0112\n代码清单 3-2\n\
  计算参数 p = 0.4 的几何分布的概率质量函数\n```\n\n**注意**\n\n图 3-2 中的图表与图 3-1 中的图表看起来非常相似，而且这样设计是有充分理由的。图\
  \ 3-1 中的图表也描绘了一个 PMF（来自离散均匀分布）。实际上，每个离散分布都有一个 PMF。\n\n我们知道，PMF 为我们提供了一种计算单一结果概率的方法。但是，如果我们想知道最多需要抛三次硬币才能得到正面朝上的概率是多少呢？为此，我们可以遵循一个相当直接的思路：\n\
  \n- 首先，我们得出结论：无论我们在第一次、第二次还是第三次尝试中成功，对于这个问题来说都没有影响。所有这些情况都满足我们的前提条件，因此都是有效的。\n-\
  \ 其次，我们意识到 PMF 为我们提供了一种计算单一结果概率的方法。\n\n用数学方式写下我们的问题，并运用前几章学到的一些规则，我们得到：\n\n`P[X\
  \ ≤ 3] = P[X = 1 ∪ X = 2 ∪ X = 3] =`\n\n`P[X = 1] + P[X = 2] + P[X = 3] = Σ_{x=1}³\
  \ P[X = x]`\n\n倒数第二个等号成立是因为这些事件是互斥的。因此，我们可以直接将各个概率相加，而无需补偿重叠部分。最后，如果我们假设硬币是公平的，每次抛掷正面或反面朝上的概率各占\
  \ 50%，我们就可以展开公式，代入 `p` 和 `q` 的实际值，并计算出结果如下：\n\n`P[X ≤ 3] = Σ_{x=1}³ P[X = x] = Σ_{x=1}³\
  \ p * q^(x-1) =`\n\n`0.5 * 0.5⁰ + 0.5 * 0.5¹ + 0.5 * 0.5² = 0.875`\n\n根据这个结果，一枚公平硬币在三次抛掷内正面朝上的概率为\
  \ 87.5%。如果硬币是有偏的，且 `p = 0.3`，那么这个概率将是 0.657。这差别可真大！\n\n我们刚刚为几何分布推导出来的函数 `P[X ≤ x]`\
  \ 也是一个特殊的函数。它被称为累积分布函数（CDF），它告诉我们从分布中随机抽取一个点小于或等于某个 `x` 值的概率。图 3-3 通过突出显示我们求和以得出\
  \ `P[X ≤ 3]` 结果的概率，形象地展示了这种关系。\n\n![../images/512351_1_En_3_Chapter/512351_1_En_3_Fig3_HTML.png](img/512351_1_En_3_Fig3_HTML.png)\n\
  \n**图 3-3**\n\nCDF 是通过对所有小于或等于某个数值的概率进行求和来计算的。在本例中，该数值为 3\n\n在抛硬币的例子中，我们用它来计算最多需要抛三次就能得到正面朝上的比例。代码清单\
  \ 3-3 展示了一段代码片段，它计算了在给定我们使用一枚严重偏倚且 `p = 0.25` 的硬币时，最多需要抛五次硬币的概率。我们看到，即使在如此强的偏倚下，即使我们抛五次硬币，正面朝上的概率也只有大约\
  \ 76%！\n\n```swift\nprivate static func geometricPMF(\nof x: Int,\nwith p: Double\n\
  ) -> Double {\nprecondition(0 < x, \"0 ≮ x.\")\nprecondition(0 < p && p <= 1, \"\
  p ∉ (0, 1].\")\nreturn p * pow(1 - p, Double(x) - 1)\n}\nlet probability = 0.25\n\
  let cdf = (1 ... 5)\n.reduce(into: 0.0) { result, x in\nresult += geometricPMF(of:\
  \ x, with: probability)\n}\nprint(\"P[X ≤ 5] = \\(cdf)\")\n// 输出：\n// P[X ≤ 5] =\
  \ 0.7626953125\n代码清单 3-3\n使用几何累积分布函数计算在八次抛硬币中至少看到一次正面的可能性。\n```\n\n\n\n### 二项分布\n\
  \n现在我们已经知道如何使用伯努利试验来推理单个二元事件。我们也理解了如何理解在第一次成功结果时终止的伯努利试验序列。作为探索标准离散分布的最后一步，我们将提出一个问题：在固定次数的伯努利试验中，恰好获得一定成功次数的概率是多少？例如，如果我们抛一枚硬币五次，恰好看到三次正面的概率是多少？\n\
  \n解决这个问题的第一种方法可能是参考几何分布。如果我们建立一个由五次伯努利试验组成的序列，其中三次成功，这意味着两次不成功。利用这个推理，我们可以写出以下公式：\n\
  \n![$$ \\mathrm{P}\\left[\\mathrm{X}=3;\\mathrm{n}=5\\right]={p}³\\cdotp {q}^{5-3}={p}³\\\
  cdotp {q}² $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equu.png)\n\
  \n前面的符号表示我们正在寻找随机变量 `X` 等于 3 的概率，就像之前一样。我们还提供了一个固定参数 `n`，它告诉我们想要进行多少次试验。`p` 和 `q`\
  \ 参数与伯努利试验和几何分布部分中的相同。\n\n说实话，这种方法相差并不远。然而，它忽略了一个事实，即可能存在许多组合导致三次成功的试验。例如，如果 `H`\
  \ 表示硬币正面朝上，`T` 表示反面朝上，我们可能会得到以下任何一种组合：\n\n![$$ \\left\\{H,H,H,T,T\\right\\}\\left\\\
  {H,H,T,H,T\\right\\}\\left\\{H,T,H,H,T\\right\\}\\left\\{T,H,H,H,T\\right\\}\\left\\\
  {T,H,H,T,H\\right\\}\\left\\{T,H,T,H,H\\right\\}\\dots $$](img/512351_1_En_3_Chapter_TeX_Equv.png)\n\
  \n正如我们所见，这些都是完全有效的硬币抛掷组合。然而，我们的公式只考虑了其中一种。具体是哪一种并不重要；需要注意的重点是，我们的计算没有考虑到可能存在多个满足条件的结果。这时候，二项式系数就派上用场了。\n\
  \n二项式系数，也称为组合数或“n-选-k”，表示从一个包含 `n` 个可能结果的集合中选取 `k` 个无序项的子集的方法数。下面的公式展示了二项式系数的数学简写和计算公式：\n\
  \n![$$ \\left(\\genfrac{}{}{0pt}{}{n}{k}\\right)=\\frac{n!}{k!\\left(n-k\\right)!}\\\
  kern0.75em ,\\kern0.75em k\\in \\left\\{0,1,2,\\dots, n-1,n\\right\\} $$](img/512351_1_En_3_Chapter_TeX_Equw.png)\n\
  \n请注意，二项式系数的其他公式允许 `n` 和 `k` 都是实数值（甚至是复数）。然而，我们目前只关心这个变体。这个公式的证明超出了本书的范围，但我们将展示一个小示例，让我们了解它是如何工作的。\n\
  \n如果我们抛三枚硬币，并且想知道有多少种组合中恰好有一次正面朝上，我们可以列出并计算符合我们条件的可能结果，如下所示：\n\n![$$ \\left\\{\\\
  mathrm{H},\\mathrm{T},\\mathrm{T}\\right\\},\\kern0.75em \\left\\{\\mathrm{T},\\\
  mathrm{H},\\mathrm{T}\\right\\},\\kern0.75em \\left\\{\\mathrm{T},\\mathrm{T},\\\
  mathrm{H}\\right\\} $$](img/512351_1_En_3_Chapter_TeX_Equx.png)\n\n由于我们使用的样本空间相对较小，很容易验证这三个序列是唯一满足要求的序列。如果我们想使用二项式系数来解决这个问题，我们会得到：\n\
  \n![$$ \\left(\\genfrac{}{}{0pt}{}{3}{1}\\right)=\\frac{3!}{1!\\left(3-1\\right)!}=\\\
  frac{3\\cdotp 2}{2}=3 $$](img/512351_1_En_3_Chapter_TeX_Equy.png)\n\n这个结果与我们手动计数的结果一致。对于这样的小例子，这种方法可能没有太大优势。然而，随着样本空间变大，它就变得非常有用了。\n\
  \n现在我们知道如何计算单个硬币抛掷组合的可能性以及有效组合的总数，我们准备解决最初的问题。抛硬币五次看到三次正面的概率归结为将这两个量相乘：\n\n![$$\
  \ \\mathrm{P}\\left[\\mathrm{X}=3;\\mathrm{n}=5\\right]=\\left(\\genfrac{}{}{0pt}{}{n}{k}\\\
  right)\\cdotp {p}³\\cdotp {q}² $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equz.png)\n\
  \n前面的公式是二项分布的 PMF（概率质量函数）。例如，如果我们抛一枚完全公平的硬币四次，恰好三次正面朝上的概率为：\n\n![$$ \\mathrm{P}\\\
  left[\\mathrm{X}=3;\\mathrm{n}=4\\right]=\\left(\\genfrac{}{}{0pt}{}{4}{3}\\right)\\\
  cdotp {0.5}³\\cdotp {0.5}¹=\\frac{4!}{3!\\left(4-3\\right)!}\\cdotp {0.5}⁵=4\\cdotp\
  \ {0.5}⁴=0.25 $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equaa.png)\n\
  \n二项分布也有 CDF（累积分布函数）。与几何分布一样，我们通过将所有小于或等于某个数的结果的 PMF 相加来计算它：\n\n![$$ P\\left[X\\\
  le x\\right]=\\sum \\limits_{i=0}^xP\\left[X=x\\right]=\\sum \\limits_{i=0}^x\\\
  left(\\genfrac{}{}{0pt}{}{n}{i}\\right)\\cdotp {p}^i\\cdotp {q}^{n-i} $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equab.png)\n\
  \n清单 3-4 中的代码展示了一个计算二项分布 PMF 的小例子。该代码片段借用了 `StatKit` 中的函数 `choose(n:k:)`，该函数计算在\
  \ `n` 次试验中 `k` 次成功的组合数。\n\n```\nfunc binomialPMF(\nof x: Int,\np: Double,\nn: Int\n\
  ) -> Double {\nprecondition(0 < x, \"0 ≮ x.\")\nprecondition(0 < p && p <= 1, \"\
  p ∉ (0, 1].\")\nprecondition(0 < n, \"n must be positive.\")\nlet binomialCoef =\
  \ choose(n: n, k: x).realValue\nlet successProb = pow(p, x.realValue)\nlet failureProb\
  \ = pow(1 - p, (n - x).realValue)\nreturn binomialCoef * successProb * failureProb\n\
  }\nlet p = 0.4\nlet n = 10\nlet x = 7\nlet pmf = binomialPMF(of: x, p: p, n: n)\n\
  let probability = String(format: \"%.2f\", p)\nprint(\n\"\"\"\nLikelihood of \\\
  (x) heads,\nwith p = \\(probability) and n = \\(n):\n\\(String(format: \"%.4f\"\
  , pmf))\n\"\"\"\n)\n// Prints:\n// Likelihood of 7 heads,\n// with p = 0.40 and\
  \ n = 10:\n// 0.0425\nListing 3-4\nComputing the binomial PMF with parameters p\
  \ = 0.4 and n = 10\n```\n\n### 分布应用\n\n现在我们已经了解了离散概率分布的基础知识，是时候介绍代码仓库中的一个“另类”项目了。`DistributionsApp`\
  \ 项目与本书附带的其他代码示例不太一样。运行此代码不会在终端中产生任何数值结果，而是打开一个如图 3-4 所示的交互式应用程序。\n\n![../images/512351_1_En_3_Chapter/512351_1_En_3_Fig4_HTML.png](img/512351_1_En_3_Fig4_HTML.png)\n\
  \n图 3-4\n\n来自代码仓库的 `DistributionsApp` 项目\n\n`DistributionsApp` 允许我们调整一些标准分布的参数，这有助于我们培养对不同结果概率如何变化的直觉。我们需要做的只是：\n\
  \n*   从左上角的分段控件中选择要查看的分布类型。\n*   从右上角的下拉菜单中选择一个可用的不同标准分布。\n*   使用图表下方出现的控件更改所选分布的参数。\n\
  \n此应用程序支持离散分布和连续分布，其中一些我们已经介绍过，而另一些则是新的，可以作为进一步学习研究的灵感。花几分钟时间查看不同的图表，并研究在操作它们的参数时它们是如何变化的。当我们进入下一节（涵盖连续分布的基础知识）时，这个程序将会派上用场。\n\
  \n\n\n## 连续分布\n\n从概念上讲，连续分布与离散分布并无太大区别。它仍然是样本空间中各种结果可能性的描述。然而，一旦我们开始使用连续分布进行计算，它们就会展现出极大的不同。有些差异很容易适应，而另一些在我们遇到时可能会感觉相当违反直觉。\n\
  \n### 与离散分布的区别\n\n连续分布与离散分布的主要区别之一在于，连续分布没有概率质量函数。相反，连续分布具有一个被称为*概率密度函数*（`PDF`）的相似属性。我们不再使用图表中的柱状图来可视化`PDF`，而是使用折线图，它会在所有样本点上生成一条曲线，如图\
  \ 3-5 所示。\n\n![../images/512351_1_En_3_Chapter/512351_1_En_3_Fig5_HTML.png](img/512351_1_En_3_Fig5_HTML.png)\n\
  \n图 3-5\n\n展示标准正态分布`PDF`的图表\n\n虽然连续曲线无疑比我们在离散图表中看到的柱状图在视觉上更令人愉悦，但无限的样本点也使得情况变得有点棘手。起初可能不明显，但\
  \ Y 轴上的值不再代表概率。为澄清这一点，我们在表 3-1 中列出了几个样本点。\n\n表 3-1\n\n标准正态分布的几个样本点\n\n| 样本点 | PDF\
  \ 值 |\n| --- | --- |\n| -0.10 | 0.397 |\n| -0.05 | 0.398 |\n| 0.00 | 0.399 |\n|\
  \ 0.05 | 0.398 |\n| 0.10 | 0.397 |\n\n如果我们将这些值视为概率，那么从标准正态分布中抽取这五个点中任意一个的概率大约为 199%。考虑到整个样本空间的总概率应等于\
  \ 1，并且还有无限多的其他点可供选择，这是不现实的。这种认识迫使我们思考`PDF`值实际上代表什么，以及它们为何与`PMF`值不同。\n\n离散分布使我们可以相对简单地想象所有单个样本点的概率之和为\
  \ 1。然而，当处理无限多个样本点时，要描绘出同样的画面就不那么简单了。我们需要将每个`PDF`值设得多小才能确保它们总和为 1？答案是，我们不用常规求和来计算连续分布，而是使用积分，积分所具有的特性有时可能违反直觉甚至不受欢迎。\n\
  \n任何上过微积分课程的人都可以证明，有些积分的计算极其复杂。在统计学中也是如此，我们经常最终得到包含多个相关随机变量的`PDF`的方程。连续样本空间的另一个令人惊讶的特性是，任何单个点的概率为零。是的，这是真的。以下是对其原因的简要概述：\n\
  \n```\n设 f(x) 为一个连续随机变量的 PDF。\n```\n\n```\n设 F(x) 为 f(x) 的原函数。那么\n```\n\n```\nP[X=x]\
  \ = ∫_x^x f(x) dx = [F(x)]_x^x = F(x) - F(x) = 0\n```\n\n上述内容并非严格的证明，而是为了提供对数字如此运作方式的深入理解。一个粗略的解释是，当样本点数量趋近于无穷时，任何单个样本点的概率趋近于零。当然，和往常一样，也存在例外情况。但总的来说，这意味着我们只询问连续随机变量是否在某个值域范围内的问题。图\
  \ 3-6 直观地展示了连续`CDF`与`PDF`的关系。计算`CDF`归结为计算`PDF`曲线下的面积。\n\n![../images/512351_1_En_3_Chapter/512351_1_En_3_Fig6_HTML.png](img/512351_1_En_3_Fig6_HTML.png)\n\
  \n图 3-6\n\n计算连续`CDF`归结为计算`PDF`曲线下的面积。在此情况下，突出显示了 `P[0 < X < 1]`\n\n幸运的是，我们在这本书中不会大量处理积分问题。许多标准分布都有其累积分布函数的闭式解析解或近似解，我们可以利用它们来计算答案。现在，让我们继续来看一个在计数过程和排队论中经常使用的连续标准分布。\n\
  \n\n\n#### 指数分布\n\n指数分布描述了泊松分布中两个事件之间的时间间隔的分布情况。虽然我们没有具体介绍泊松分布，但指数分布本身仍是一个很好的计算工具。\n\
  \n指数分布有一个参数，通常称为*速率*，用希腊字母 λ 表示。速率表示在确定的时间单位内平均发生的事件数量。例如，如果我们经营的商店平均每天有 20 位顾客光顾，我们可以将时间单位设为一天，那么速率就是\
  \ 20。如果我们选择以一小时为基本单位，那么速率就是 2（假设商店营业 10 小时）。需要注意的一点是，由于我们处理的是时间间隔，样本空间严格由非负数构成。\n\
  \n指数分布描述的是某个时间间隔分隔两个事件的可能性有多大。例如，如果我们的商店每小时有两位顾客光顾，我们可以计算开门后 10 分钟内第一位顾客到来的概率。我们可以用以下数学符号来表示：\n\
  \n![$$ P\\left[\\ 0\\le X\\le \\frac{1}{6};\\lambda =2\\right] $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equaf.png)\n\
  \n请注意，我们需要指定一个值的范围，因为我们处理的是一个包含连续时间间隔的样本空间。根据我们在上一节中应用的相同逻辑，第一位顾客正好在开门后十分钟到达的概率为零。我们还注意到，上限不是\
  \ 10，而是十分钟在我们基本单位（一小时）中所占的分数。\n\n我们可以计算从零到十分钟的指数分布 PDF 的积分来回答我们的问题。PDF 的推导超出了本书的范围。因此，我们只在下面的等式中给出公式：\n\
  \n![$$ P\\left[\\ 0\\le X\\le \\frac{1}{6};\\lambda =2\\right]={\\int}_0^{\\frac{1}{6}}\\\
  lambda {e}^{-\\lambda x} dx={\\left[-{e}^{-\\lambda x}\\right]}_0^{\\frac{1}{6}}=1-{e}^{-\\\
  frac{2}{6}}\\approx 0.283 $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equag.png)\n\
  \n计算结果表明，如果我们睡过头，晚开门 10 分钟，那么我们的第一位顾客在我们之前出现，并因此未购买任何东西就离开的风险约为 28.3%。\n\n这个特定的积分并不难。事实上，它的性质相当好且易于计算。然而，还有另一种方法可以使用累积分布函数来计算相同的结果。这里给出指数分布的\
  \ CDF：\n\n![$$ P\\left[X\\le x\\right]=1-{e}^{-\\lambda x} $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equah.png)\n\
  \n这个公式与我们刚刚求解的积分中最后一个等式之一非常相似。由于它计算的是随机变量低于某个阈值的概率，我们将用它来执行一个技巧。如果我们想知道第一位顾客在开业后\
  \ 5 到 10 分钟内出现的可能性，我们可以再次计算积分。但是，我们也可以这样重新表述问题：\n\n![$$ P\\left[X\\le \\frac{1}{6};\\\
  lambda =2\\right]-P\\left[X\\le \\frac{1}{12};\\lambda =2\\right] $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equai.png)\n\
  \n也就是说，我们计算第一位顾客在开业后 10 分钟内出现的可能性，但减去他们在前 5 分钟内出现的概率，从而得到我们感兴趣的区间的答案：\n\n![$$ P\\\
  left[X\\le \\frac{1}{6};\\lambda =2\\right]-P\\left[X\\le \\frac{1}{12};\\lambda\
  \ =2\\right]=1-{e}^{-\\frac{2}{6}}-1+{e}^{-\\frac{2}{12}}\\approx 0.13 $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equaj.png)\n\
  \n这个技巧对于第一个例子也同样适用。我们只需要将减去第一位顾客在零分钟内出现的概率改为减去五分钟的概率。清单 `[3-5]` 中的代码展示了如何计算在给定速率为\
  \ `λ` 的指数分布下，事件发生在时间 `x[1]` 和 `x[2]` 之间的可能性。\n\n```\nfunc probability(\nbetween\
  \ x: Double,\nand y: Double,\nrate: Double\n) {\nprecondition(0 <= x, \"x mustbe\
  \ non-negative.\")\nprecondition(0 <= y, \"y must be non-negative.\")\nprecondition(x\
  \ <= y, \"x must be ≤ y.\")\nprecondition(0 < rate, \"rate must be positive.\")\n\
  let upperCDF = 1 - exp(-rate * y)\nlet lowerCDF = 1 - exp(-rate * x)\nlet prob =\
  \ upperCDF - lowerCDF\nprint(\n\"\"\"\nP[\\(x) ≤ x ≤ \\(y) | λ = \\(rate)] = \\\
  (prob)\n\"\"\"\n)\n}\nprobability(between: 0, and: 1, rate: 2)\nprobability(between:\
  \ 0, and: 1, rate: 0.2)\nprobability(between: 0, and: 0, rate: 10)\n// Prints:\n\
  // P[0.0 ≤ x ≤ 1.0 | λ = 2.0] = 0.8646647167633873\n// P[0.0 ≤ x ≤ 1.0 | λ = 0.2]\
  \ = 0.18126924692201818\n// P[0.0 ≤ x ≤ 0.0 | λ = 10.0] = 0.0\n清单 3-5\n一个在给定指数分布下计算事件发生概率的示例\n\
  ```\n\n现在我们对连续样本空间有了一些经验，是时候看看最重要且最广泛使用的连续分布之一了。\n\n\n\n#### 正态分布\n\n法国数学家亚伯拉罕·棣莫弗在\
  \ 18 世纪首次描述了正态分布。这一发现在相当长一段时间内未被重视，直到被卡尔·弗里德里希·高斯和皮埃尔-西蒙·拉普拉斯“重新发现”。它通常也被称为高斯分布或钟形曲线，因为其形状像一口钟。\n\
  \n我们可以通过均值和标准差来定义一个正态分布。均值，用希腊字母 `μ` 表示，决定了分布中最常见的数值。该值位于曲线的中心，曲线在该点两侧呈对称形状。标准差，用\
  \ `σ` 表示，描述了钟形的“宽度”。`σ` 值越大，意味着样本点往往离均值越远，而 `σ` 越小，则说明样本通常更接近均值。我们将在本章后面更深入地探讨这些概念。目前，有一个高层次的直觉理解就足够了。\n\
  \n图 3-7 展示了两个具有相同参数 `μ`、但不同 `σ` 的正态分布。请注意 `σ` 参数如何使得均值附近的概率降低，而离均值较远的样本概率却变得更大。`DistributionsApp`\
  \ 项目也提供了一个工具，用于测试不同参数值如何改变样本点的概率。\n\n![../images/512351_1_En_3_Chapter/512351_1_En_3_Fig7_HTML.png](img/512351_1_En_3_Fig7_HTML.png)\n\
  \n图 3-7\n\n两个具有不同参数的正态分布\n\n要使用正态分布进行计算，我们需要知道其概率密度函数（PDF）：\n\n![$$ f(x)=\\frac{1}{\\\
  sigma \\sqrt{2\\pi }}{e}^{-\\frac{1}{2}{\\left(\\frac{x-\\mu }{\\sigma}\\right)}²}\
  \ $$](img/512351_1_En_3_Chapter_TeX_Equak.png)\n\n这个公式给出了任何样本点的相对似然值。值得注意的是，这个特定的样本空间包含所有实数，范围从负无穷到正无穷。然而，要计算一个样本落在某个区间内的概率，我们需要计算一个积分：\n\
  \n![$$ P\\left[{x}_1&lt;X&lt;{x}_2\\right]={\\int}_{x_1}^{x_2}\\frac{1}{\\sigma\
  \ \\sqrt{2\\pi }}{e}^{-\\frac{1}{2}{\\left(\\frac{x-\\mu }{\\sigma}\\right)}²} dx\
  \ $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equal.png)\n\n我们很快意识到，这比计算指数分布要复杂得多。不幸的是，使用累积分布函数（CDF）并采用与指数分布相同的技巧对我们并没有帮助。让我们看看这个函数，以理解原因：\n\
  \n![$$ P\\left[X&lt;x\\right]=\\frac{1}{2}\\left[1+\\operatorname{erf}\\left(\\\
  frac{x-\\mu }{\\sigma \\sqrt{2}}\\right)\\right] $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equam.png)\n\
  \n如我们所见，这是一个非常复杂的函数。正态分布的 CDF 依赖于高斯误差函数，通常记为 `erf(z)`。这是一个以如下方式定义的复杂函数：\n\n![$$\
  \ \\operatorname{erf}(z)=\\frac{2}{\\sqrt{\\pi }}{\\int}_0^z{e}^{-{t}²} dt $$](img/512351_1_En_3_Chapter_TeX_Equan.png)\n\
  \n误差函数也包含一个积分，并且并不比我们上一页看到的积分更容易计算。幸运的是，研究人员已经开发出以惊人精度逼近误差函数的方法。由米尔顿·阿布拉莫维茨和艾琳·斯特根编写的《数学函数手册：公式、图表和数学用表》（1964\
  \ 年，第 299 页）包含了一个由小塞西尔·黑斯廷斯设计的逼近误差函数的公式。该公式计算成本相对较低且易于实现，使其非常适合我们的需求。清单 3-6 提供了一个实现，清单\
  \ 3-7 使用该实现来逼近正态分布的 CDF。\n\n```\nfunc normalCDF(\nx: Double,\nmu: Double,\nsigma:\
  \ Double\n) -> Double {\nlet z = (x - mu) / (sigma * sqrt(2))\nreturn 0.5 * (1 +\
  \ erf(z))\n}\nprint(\n\"\"\"\n标准正态分布\nP[X < 0] = \\(normalCDF(x: 0, mu: 0, sigma:\
  \ 1))\n\"\"\"\n)\n// 输出:\n// 标准正态分布\n// P[X < 0] = 0.5000000005\n清单 3-7\n使用高斯误差函数逼近计算正态分布\
  \ CDF\n```\n\n```\nimport Darwin\nlet p = 0.3275911\nlet coefficients = [\n0.254829592,\n\
  -0.284496736,\n1.421413741,\n-1.453152027,\n1.061405429\n]\nlet exponents = (1 ...\
  \ coefficients.count)\n.map(Double.init)\nfunc erf(_ z: Double) -> Double {\nlet\
  \ sign = (z.sign == .plus) ? 1.0 : -1.0\nlet absZ = abs(z)\nlet t = 1 / (1 + p *\
  \ absZ)\nlet powerSeries = zip(coefficients, exponents)\n.reduce(into: 0.0) { (result,\
  \ zipped) in\nlet (coefficient, exponent) = zipped\nresult += coefficient * pow(t,\
  \ exponent)\n}\nlet tail = powerSeries * exp(-pow(absZ, 2))\nreturn sign * (1 -\
  \ tail)\n}\n清单 3-6\n逼近高斯误差函数\n```\n\n清单 3-7 中 CDF 的真实解为 0.5，而我们的逼近结果得到 0.5000000005。我们对这个误差可以接受，因为它对我们正在计算的总体似然度影响不大。该实现还提供了通过使用与指数分布相同的技巧来计算落入特定数值区间内的概率的能力：\n\
  \n![$$ P\\left[{x}_1&lt;X&lt;{x}_2\\right]=P\\left[X&lt;{x}_2\\right]-P\\left[X&lt;{x}_1\\\
  right] $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equao.png)\n\n\
  逼近通常让人觉得粗糙且不精确。然而，这是我们必须接受并拥抱的现实。由于位宽的限制，现代计算机上进行的许多计算最终都是近似值。公平地说，许多我们可能认为是精确的数学公式，本质上也是对经验测量的近似。\n\
  \n我们现在已经了解了一些最常见的标准分布。当然，还有比这多得多的分布。然而，这些概念也同样适用于它们。为了结束本章，让我们再看一下分布的几个性质。这些将在本书后面用到，我们必须了解它们是什么。\n\
  \n\n\n#### 期望值\n\n期望值最常见的用途之一就是我们通常所说的平均值。我们对随机变量的期望定义如下：\n\n![$$ \\mathbbm{E}\\\
  left[X\\right]=\\sum \\limits_{x\\in S}x\\cdotp p(x)\\kern3.75em for\\ discrete\\\
  \ distributions\\mathbbm{E}\\left[X\\right]={\\int}_{-\\infty}^{\\infty }x\\cdotp\
  \ f(x)\\ dx\\kern2em for\\ continuous\\ distributions $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equap.png)\n\
  \n在这些公式中，`f(x)` 是连续分布的概率密度函数（PDF），而我们用 `p(x)` 表示离散分布的概率质量函数（PMF）。随机变量的期望会产生一个实数（至少对于本书中我们会遇到的分布而言是如此）。这个数不一定是随机变量样本空间的一部分。起初，考虑到它的名称，这一事实可能会让人觉得奇怪或违反直觉。难道期望不应该是用来计算一个分布的期望值吗？\n\
  \n为了使这个概念更具体，我们将再次以骰子为例，计算几个期望值。我们首先关注一个公平的骰子，它每个面朝上的概率相等。其期望值为：\n\n![$$ \\mathbbm{E}\\\
  left[X\\right]=1\\cdotp \\frac{1}{6}+2\\cdotp \\frac{1}{6}+\\dots +6\\cdotp \\frac{1}{6}=3.5\
  \ $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equaq.png)\n\n正如我们所见，期望值落在两个样本点之间。这个数就是各个面点数的平均值。现在，想象一下有人对这个骰子动了手脚，使得掷出数字二的概率是其他数字的两倍。这种篡改意味着分布发生了变化，期望值变为：\n\
  \n![$$ \\mathbbm{E}\\left[X\\right]=1\\cdotp \\frac{1}{7}+2\\cdotp \\frac{2}{7}+3\\\
  cdotp \\frac{1}{7}+\\dots +6\\cdotp \\frac{1}{7}\\approx 3.2857 $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equar.png)\n\
  \n新分布下的平均值小于均匀分布下的平均值。值变小是有道理的，因为使用这个骰子我们更有可能掷出较小的数字。需要注意的是，这完全等同于我们更熟悉的计算平均值的方法，即把一些数字加起来，再除以相加的个数。如果有重复的数字，那就对应着一个分布发生了偏移，使得该数字出现的概率更高。\n\
  \n#### 方差与标准差\n\n期望值不仅可用于计算平均值。我们可以将任何随机变量表达式放入 `[·]` 中，并计算出有效的期望值。这个概念正是我们用来计算一种名为**方差**的度量指标的依据，其定义如下：\n\
  \n![$$ {\\sigma}²= Var\\left[X\\right]=\\mathbbm{E}\\left[{\\left(X-\\mu \\right)}²\\\
  right] $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equas.png)\n\n\
  虽然这些符号乍一看可能令人畏惧，但它有一个相当直接的解释。方差度量的是分布的*离散程度*。也就是说，它衡量的是均值与所有样本点之间距离平方的平均值。\n\n对距离进行平方可以确保我们将正值加在一起。如果我们允许负值存在，就会产生一些奇怪的副作用。例如，正态分布（关于均值对称）的方差将为零，尽管很明显除了恰好是均值的那个点之外还有其他样本点。\n\
  \n由于平方可能会使根据方差得出结论更具挑战性，因此我们还有标准差这个度量指标。标准差无非就是方差的平方根，它去掉了结果中的平方，同时仍然保证结果非负。回到公平骰子的例子，我们计算方差和标准差如下：\n\
  \n![$$ {\\sigma}²= Var\\left[X\\right]={\\left(1-3.5\\right)}²\\cdotp \\frac{1}{6}+{\\\
  left(2-3.5\\right)}²\\cdotp \\frac{1}{6}+\\dots +{\\left(6-3.5\\right)}²\\cdotp\
  \ \\frac{1}{6}\\approx 2.92 $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equat.png)\n\
  \n![$$ \\sigma = Std\\left[X\\right]=\\sqrt{2.92}\\approx 1.71 $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equau.png)\n\
  \n这些数字告诉我们，如果投掷大量骰子，我们可以预期离散程度大约在距离均值 1.71 的范围内。方差和标准差在分析置信区间时被广泛使用，我们将在接下来的章节中用到它们。\n\
  \n### 章节总结\n\n本章内容涵盖甚广。我们学习了如何对样本空间进行分类，并看到了这如何催生出两类截然不同的分布——离散分布和连续分布。我们学习了如何使用概率质量函数、概率密度函数和累积分布函数进行计算。我们还了解了一些统计学中使用的标准分布。\n\
  \n在本书的后续内容中，我们将大量运用迄今为止所构建的理论基础。均值、方差和标准差是描述分布时广泛使用的度量指标，我们将在构建的算法中使用它们。现在我们已经掌握了一些所需的理论概念，接下来我们将进入一个更偏向实际应用的章节。我们将使用回归技术来开发一个基于数据预测房屋销售价格的算法。\n\
  \n"
- "# 4. 使用线性回归预测房屋销售价格\n\n到目前为止，我们都是从描述数据的角度来看待统计学的。我们试图找到将潜在海量数据集的重要属性提炼成一个或几个数字的方法。虽然这种方法无疑很实用，但我们也希望利用这些数据来展望未来。因此，我们希望查看一些已经发生的样本点，并用它们来预测接下来会发生什么。本章将研究实现这一目标的一种方法——本章全部关于线性回归。\n\
  \n\n\n## 线性回归\n\n线性回归这个概念，尽管名称复杂，但其思想却出奇地简单。我们利用已有的数据点，来建立一个线性方程，用以对新样本点进行合理的预测。例如，如果我们知道一磅苹果的价格是`$1.3`，我们就可以计算出购买`1.5`磅的价格。我们利用“不买东西就无需付费”这一隐含知识，在重量和价格之间建立了一种线性关系——这实际上就是执行了一种简单的线性回归。这个计算过程假设线性方程能够恰当地描述重量与成本之间的关系。我们用来预测苹果总价的函数如下：\n\
  \n![$$ price_{apples}(x)=1.3x\\kern0.75em ,\\kern0.75em x\\in {\\mathbb{R}}_{\\\
  ge 0} $$](img/512351_1_En_4_Chapter_TeX_Equa.png)\n\n我们在上一个例子中看到的那种线性内插或外推方法有一些好处。首先，它易于执行，并且对许多问题都很有效。其次，它的资源效率非常高，因为我们无需记住每磅苹果的具体价格，只需要记住一个公式即可。\n\
  \n然而，一旦引入真实世界的数据，情况就会变得复杂得多。这些样本点通常带有噪声，很难完美地契合到这种规整的数学模型中。例如，看看图 4-1 中可视化的数据集。\n\
  \n![../images/512351_1_En_4_Chapter/512351_1_En_4_Fig1_HTML.png](img/512351_1_En_4_Fig1_HTML.png)\n\
  \n图 4-1\n\n一个噪声数据集的示例\n\n图 4-1 中的数据看起来更符合我们对真实世界样本集的预期。这些样本来自于以下函数：\n\n![$$ f(x)=x+\\\
  epsilon \\kern0.75em ,\\kern0.75em \\epsilon \\sim Normal\\left(0,1\\right) $$](img/512351_1_En_4_Chapter_TeX_Equb.png)\n\
  \n这个公式是一个基本的线性方程，但在其末尾附加了一个变量。`\U0001D750` 是一个噪声项，它加上了一个从标准正态分布中采样的随机数。这种添加随机性的方式通常被称为高斯噪声。我们可以看到数据具有线性趋势，但我们无法用一条直线连接所有点。我们需要采取另一种方法来理解这些数据。\n\
  \n### 样条\n\n样条是一种建立在插值思想之上的数学概念。它不同于回归，但可以作为一块垫脚石，帮助我们理解这种方法的工作原理以及为什么需要它。\n\n在线性样条的情况下，我们将每一对相邻的点视为一个具有线性性质的区间的端点，并用一条直线将它们连接起来。因此，将其应用于之前的数据集，结果将如图\
  \ 4-2 所示。\n\n![../images/512351_1_En_4_Chapter/512351_1_En_4_Fig2_HTML.png](img/512351_1_En_4_Fig2_HTML.png)\n\
  \n图 4-2\n\n使用线性样条通过直线段连接相邻样本点\n\n正如我们所看到的，当把这条线看作一个整体时，它完全不是一条直线。然而，假设我们想预测数值 `8.4`\
  \ 对应的值。我们会确定它落在原始样本点 8 和 9 之间，因此，我们使用介于这两点之间的样条所对应的线性方程。在这个特定案例中，该方程是\n\n![$$ f_{8,9}(x)\\\
  approx 8+0.113\\cdotp \\left(x-8\\right) $$](img/512351_1_En_4_Chapter_TeX_Equc.png)\n\
  \n![$$ f_{8,9}(8.4)\\approx 8+0.113\\cdotp \\left(8.4-8\\right)\\approx 8.045 $$](img/512351_1_En_4_Chapter_TeX_Equd.png)\n\
  \n总的来说，这种近似效果还不错。然而，在一些场景下我们会遇到麻烦。其中几个场景是：\n\n*   样条方法迫使我们记住部分原始数据，以便确定在不同区间使用哪个线性方程。如果数据点很少，这算不什么大问题，但对于包含数百万或数十亿条记录的数据集，这很快就会变得难以处理。\n\
  \n*   如果我们尝试对大于 `20` 的值进行预测，我们最终会使用定义 `19` 和 `20` 之间数值的同一个线性方程。由于在这个例子中该方程具有负系数，那么在数轴上越靠后的位置，我们做出的预测值会越小。鉴于总的趋势是正向的，这种预测就会成为问题。同样地，在这个例子中，对小于\
  \ 1 的值进行预测也会遇到类似的问题。\n\n我们总结出，使用样条对于规模较小的数据集是一种合理的方法，并且只要是在进行内插，就能产生良好的结果。然而，对于较大的数据集，或者当需要进行外推（即预测超出已有数据范围的值）时，它们就不太理想了。为了改进我们的方法，我们需要以某种方式解决这些问题。\n\
  \n## 回归技术\n\n为了做出更好的预测，我们需要解决刚刚列出的问题。在像这样能够观察到数据具有明显线性趋势的情况下，我们希望一种方法具备两个特性：\n\n\
  *   它应该遵循数据的总体趋势。一个带有噪声的测量值不应导致我们的模型改变方向而去违背该趋势——无论是在我们有样本的范围内还是范围外。\n\n*   我们希望计算开销低。理想情况下，我们希望将原始样本的基本特征提炼成少数几个系数，这些系数能够构成一个线性方程的基础。\n\
  \n基于这些特性，我们的目标是找到最适合现有数据的线性方程。请记住，一条直线的通用公式是\n\n![$$ f(x)= kx+m $$](img/512351_1_En_4_Chapter_TeX_Eque.png)\n\
  \n由于 `x` 代表我们想要预测其值的新样本，我们的任务是确定变量 `k` 和 `m`，使得 `f(x)` 尽可能接近真实值。为此，我们需要定义一种衡量我们预测效果好坏的方法。\n\
  \n\n\n#### 损失函数\n\n顾名思义，损失函数的职责是衡量当前模型所承受的损失。优秀的模型损失值较低，表明其预测值非常接近数据点的测量值。反之，当模型预测效果极差时，我们希望损失函数返回一个较大的数值。\n\
  \n创建和优化模型时的主要挑战之一，在于设计一个合适的损失函数。其包含的参数反映了哪些信息对我们而言是重要的。例如，如果我们想通过房屋的平方英尺数来确定其售价，但损失函数只包含房间数量这一因素，那我们永远无法做出准确的预测。\n\
  \n回到我们的示例数据，我们希望最小化模型预测值与数据中测量值之间的总距离。例如，如果目标值是 4，但我们预测为 3，那么距离（或误差）就是 1。通过汇总模型产生的所有误差，我们可以量化模型的表现。同时，我们还需要避免正负误差相互抵消，以免造成损失函数的混乱。用`N`表示数据集中的样本点数量，用`y`表示样本的观测值，我们可以设置以下满足需求的损失函数`ℒ`：\n\
  \n![$$ \\mathcal{L}=\\sum_{i=1}^N{\\left({y}_i-f\\left({x}_i\\right)\\right)}²=\\\
  sum_{i=1}^N{\\left({y}_i-k{x}_i-m\\right)}² $$](img/512351_1_En_4_Chapter_TeX_Equf.png)\n\
  \n我们通常将上述函数称为平方和误差。平方运算确保了预测值与目标值之间的误差始终为正，并且保持了误差的顺序关系。因此，如果用`e[1]`和`e[2]`表示两个点的误差，那么\n\
  \n![$$ {e}_1&lt;{e}_2\\kern0.75em \\Longrightarrow \\kern0.75em {\\left({e}_1\\\
  right)}²&lt;{\\left({e}_2\\right)}² $$](img/512351_1_En_4_Chapter_TeX_Equg.png)\n\
  \n维持这种关系至关重要。引入任何打破这种顺序关系的变换都可能产生意料之外的后果，因为好的预测反而会比坏的预测贡献更大的损失。\n\n现在，我们已经确定了满足目标的损失函数，可以开始优化阶段。我们将`k`和`m`视为变量，因为它们是本次优化的目标。首先，我们计算`ℒ`关于`k`和`m`的黑塞矩阵，结果为：\n\
  \n![$$ {\\boldsymbol{H}}_{\\mathbf{\\mathcal{L}}}=\\left[\\ \\begin{array}{cc}\\\
  frac{\\partial²\\mathcal{L}}{\\partial {k}²}&amp; \\frac{\\partial²\\mathcal{L}}{\\\
  partial k\\ \\partial m}\\\\ {}\\frac{\\partial²\\mathcal{L}}{\\partial m\\ \\partial\
  \ k}&amp; \\frac{\\partial²\\mathcal{L}}{\\partial {m}²}\\end{array}\\kern0.5em\
  \ \\right]=\\left[\\begin{array}{cc}2\\sum_{i=1}^N{\\left({x}_i\\right)}²&amp; 2\\\
  sum_{i=1}^N\\left({x}_i\\right)\\\\ {}2\\sum_{i=1}^N\\left({x}_i\\right)&amp; 2N\\\
  end{array}\\right] $$](images/512351_1_En_4_Chapter/512351_1_En_4_Chapter_TeX_Equh.png)\n\
  \n黑塞矩阵是一个由二阶偏导数组成的方阵，描述了函数的曲率。我们继续计算该矩阵的特征值，得到：\n\n![$$ \\det \\left(\\ {\\boldsymbol{H}}_{\\\
  mathcal{L}}-\\lambda \\cdotp \\boldsymbol{I}\\right)=0 $$](img/512351_1_En_4_Chapter_TeX_Equi.png)\n\
  \n![$$ {\\lambda}²-2\\lambda \\left(\\sum_{i=1}^N{\\left({x}_i\\right)}²+N\\right)=0\
  \ $$](img/512351_1_En_4_Chapter_TeX_Equj.png)\n\n![$$ \\lambda =\\left(\\sum_{i=1}^N{\\\
  left({x}_i\\right)}²+N\\right)\\pm \\left(\\sum_{i=1}^N{\\left({x}_i\\right)}²+N\\\
  right) $$](img/512351_1_En_4_Chapter_TeX_Equk.png)\n\n![$$ {\\lambda}_1=0,\\kern0.5em\
  \ {\\lambda}_2=2\\Big(N+\\sum_{i=1}^N\\left({x}²\\right) $$](img/512351_1_En_4_Chapter_TeX_IEq1.png))\n\
  \n虽然第一个特征值是标量，但我们需要对第二个特征值做进一步分析。我们可以判断，`N`始终为正，因为样本点至少有一个。我们也知道，对平方值求和的结果总是正数。这些认知让我们得出结论：第二个特征值必然为正，因此该黑塞矩阵是半正定的。接下来我们将看到，这会影响我们找到最优解的能力。\n\
  \n除了判定`H[ℒ]`的半正定性，我们还需要确定损失函数的定义域是否为凸集。\n\n![$$ 集合\\ D\\ 是凸集，如果对于任意\\ {x}_1,{x}_2\\\
  in D\\ 及任意实数\\ \\theta \\in \\left[0,1\\right]，\\\\ 满足以下条件： $$](images/512351_1_En_4_Chapter/512351_1_En_4_Chapter_TeX_Equl.png)\n\
  \n![$$ \\theta {x}_1+\\left(1-\\theta \\right){x}_2\\in D $$](img/512351_1_En_4_Chapter_TeX_Equm.png)\n\
  \n上述定理指出，如果我们能选取任意两个元素并组合，结果仍属于同一集合，则该集合是凸集。图 4-3 展示了这一概念的可视化效果。无论我们在圆形内选择哪两个点，它们之间的直线只会穿过该集合的其他元素。\n\
  \n![../images/512351_1_En_4_Chapter/512351_1_En_4_Fig3_HTML.png](img/512351_1_En_4_Fig3_HTML.png)\n\
  \n**图 4-3** 实心圆是一个凸集，因为任意两点之间的线段仅包含该集合内的其他点\n\n实数集`ℝ`是凸集。无论我们选择哪两个数，它们的凸组合总是另一个实数值。我们可以得出结论：我们问题的定义域是凸集。结合黑塞矩阵为半正定的结论，这对我们来说是件好事。这意味着，如果能找到问题的一个最优解，那么该解必定是全局最优解。\n\
  \n\n\n#### 寻找最优解\n\n上一节的理论内容相当厚重，因此让我们快速回顾一下所学内容以及我们想要达成的目标。我们学到了：\n\n- 我们设计了一个损失函数，以帮助我们判断模型的预测是好是坏。\n\
  - 由于我们能够确认海森矩阵是半正定的，因此可以验证我们的损失函数在其定义域上是凸函数。\n- 损失函数的定义域是整个实数线 ℝ。实数集是凸集，因为它满足我们之前看到的定理中的条件。\n\
  - 如果我们能为损失函数找到一个局部最优解（一个使输出值最小化的输入值），那么它必然也是全局最优解。得益于此，我们无需担心找到的输入值只是局部最优。\n\n有了这些知识，我们就可以着手寻找最能拟合观测数据的线性方程了。此外，既然我们现在知道问题具有凸性，就可以使用最经典的优化技巧之一——计算关于\
  \ `k` 和 `m` 的偏导数，将它们设为零，并进行一些代数变换。\n\n![$$ \\frac{\\partial \\mathcal{L}}{\\partial\
  \ m}=0 $$](img/512351_1_En_4_Chapter_TeX_Equn.png)\n\n![$$ -2\\sum_{i=1}^N\\left({y}_i-k{x}_i-m\\\
  right)=0 $$](img/512351_1_En_4_Chapter_TeX_Equo.png)\n\n![$$ m=\\frac{1}{N}\\sum_{i=1}^N{y}_i-k\\\
  frac{1}{N}\\sum_{i=1}^N{x}_i $$](img/512351_1_En_4_Chapter_TeX_Equp.png)\n\n![$$\
  \ \\frac{\\partial \\mathcal{L}}{\\partial k}=0 $$](img/512351_1_En_4_Chapter_TeX_Equq.png)\n\
  \n![$$ -2\\sum_{i=1}^N\\left({y}_i-k{x}_i-m\\right){\\mathrm{x}}_{\\mathrm{i}}=0\
  \ $$](img/512351_1_En_4_Chapter_TeX_Equr.png)\n\n![$$ k=\\frac{N\\sum_{i=1}^N{\\\
  mathrm{x}}_{\\mathrm{i}}{y}_i-\\left(\\sum_{i=1}^N{x}_i\\right)\\left(\\sum_{i=1}^N{y}_i\\\
  right)}{N\\sum_{i=1}^N{\\left({\\mathrm{x}}_{\\mathrm{i}}\\right)}²-{\\left(\\sum_{i=1}^N{x}_i\\\
  right)}²} $$](img/512351_1_En_4_Chapter_TeX_Equs.png)\n\n乍一看，这些方程可能让我们觉得情况更糟了。然而，仔细观察后，我们注意到一个重要的点。`k`\
  \ 和 `m` 的表达式完全由数据集中的基本元素构成。因此，我们只需要进行一些变换和求和运算即可！\n\n#### 实现简单线性回归\n\n现在我们已经解决了问题的数学部分，实现解决方案就会容易得多。让我们从创建一个名为\
  \ `SimpleLinearRegression` 的类型开始。这个类型的目的是为某个数据集拟合一个线性方程。不过，我们不想将数据整理成实数数组，这么麻烦。相反，我们希望\
  \ `SimpleLinearRegression` 接收原始数据集，并从中检索一些指定的值用于计算。这些需求正是我们之前学过的 `KeyPath` 类型的完美应用场景。代码清单\
  \ 4-1 定义了该 `struct` 及其一些属性。\n\n```\nimport StatKit\nstruct SimpleLinearRegression:\
  \ CustomStringConvertible {\nlet k: Double\nlet m: Double\nvar description: String\
  \ {\nlet sign = (m.sign == .plus) ? \"+\" : \"-\"\nreturn \"\\(k)x \\(sign) \\(abs(m))\"\
  \n}\nfunc predict(x: X) -> Double {\nreturn k * x.realValue + m\n}\n}\n代码清单 4-1\n\
  为简单线性回归定义基础类型\n```\n\n在进入数学部分之前，我们快速浏览一下代码。这里涉及到一些相当高级的概念，我们需要理解它们才能理解剩余部分。\n\n\
  - 以尖括号开头的那行列出了一些*泛型类型*。`Element` 是我们送入回归器的数据的占位符，可以是任何类型。`X` 和 `Y` 是我们想要进行线性回归的变量类型的占位符。它们受到约束，只允许使用符合\
  \ `ConvertibleToReal` 协议的类型。该协议来自 `StatKit`，适用于所有可以转换为 `Double` 的类型。\n\n- `CustomStringConvertible`\
  \ 协议是 Swift 标准库的一部分，要求我们实现 `description` 属性。我们用它来告诉系统，在尝试打印回归器时该如何描述它。\n\n- `predict(x:)`\
  \ 函数顾名思义，它的功能是对某个输入值进行预测。如我们所见，参数 `x` 被限制为泛型类型 `X`，这与我们将要对训练集中的数据施加的约束相同。\n\n唯一缺少的方法是拟合训练数据的方法。由于线性回归与我们用于拟合函数的数据紧密耦合，我们可以在初始化器中进行计算。代码清单\
  \ 4-2 为我们的 `SimpleLinearRegression` 定义了一个初始化器。\n\n```\ninit(\nfrom samples: [Element],\n\
  x: KeyPath,\ny: KeyPath\n) {\nlet n = samples.count.realValue\nlet (xSum, ySum,\
  \ xSqSum, xySum) = samples\n.reduce(\ninto: (0.0, 0.0, 0.0, 0.0)\n) { result, point\
  \ in\nlet x = point[keyPath: x].realValue\nlet y = point[keyPath: y].realValue\n\
  result.0 += x\nresult.1 += y\nresult.2 += x * x\nresult.3 += x * y\n}\nlet kNumerator\
  \ = (n * xySum - xSum * ySum)\nlet kDenominator = (n * xSqSum - xSum * xSum)\nself.k\
  \ = kNumerator / kDenominator\nself.m = (ySum - k * xSum) / n\n}\n代码清单 4-2\nSimpleLinearRegression\
  \ 的初始化器\n```\n\n这个函数就是数学魔法发生的地方。正如我们所见，泛型声明用于约束输入值。这些构造让 Swift 编译器有机会帮助我们检查代码并提供反馈。我们使用在第一章中学到的\
  \ `KeyPath` 来检索计算所需的值，并根据推导出的公式计算 `k` 和 `m`。\n\n这些实现构成了完整的 `SimpleLinearRegression`\
  \ 类型，也是我们进行统计分析所需的全部内容。代码清单 4-3 展示了如何使用我们新的 `struct` 计算最适合示例数据的直线。\n\n```\nlet points\
  \ = DataLoader.load(\nPoint.self,\nfrom: .simpleLinearRegression\n)\nlet regressor\
  \ = SimpleLinearRegression(\nfrom: points,\nx: \\.x,\ny: \\.y\n)\nlet x = 5.0\n\
  let prediction = regressor.predict(x: x)\nlet observed = points\n.first(where: {\
  \ point in\npoint.x == 5\n})!.y\nprint(\n\"\"\"\nBest fit linear equation for example\
  \ data\nf(x) = \\(regressor)\nPrediction for x = 5\n\\(prediction)\nObserved value\
  \ for x = 5\n\\(observed)\n\"\"\"\n)\n// 输出：\n// Best fit linear equation for example\
  \ data\n// f(x) = 0.9522649643240606x + 0.4713220140473652\n//\n// Prediction for\
  \ x = 5\n// 5.232646835667667\n//\n// Observed value for x = 5\n// 5.371954518\n\
  代码清单 4-3\n使用我们新的 Swift 类型执行线性回归\n```\n\n得益于我们刚刚编写的线性回归类型，执行这次回归所需的粘合代码量非常少。如果我们想进行其他回归分析，也很容易重用。例如，假设数据集还包含一个\
  \ `z` 变量。我们只需创建一个新的回归器，并将相关的 `KeyPath` 引用替换为 `\\.z` 即可实现！\n\n让我们看看这个方程对数据的描述效果如何。图\
  \ 4-4 展示了一个是输入给算法的带噪声样本数据，另一个是得到的线性方程。\n\n![../images/512351_1_En_4_Chapter/512351_1_En_4_Fig4_HTML.png](img/512351_1_En_4_Fig4_HTML.png)\n\
  \n图 4-4\n\n带噪声样本数据与线性回归拟合模型绘制在一起的对比图\n\n正如我们所见，这条直线对数据集的拟合效果非常好。它遵循了总体趋势，并且对局部变化不敏感。另一个优点是，进行任何预测时，我们只需要存储两个浮点数。此外，由于我们已经提炼出了数据的特征，因此无需保留原始数据。这非常轻量！\n\
  \n\n\n#### 多元线性回归\n\n我们现在已经知道如何将线性方程拟合到一组数据上。这自然要求数据集中的样本展现出某种线性关系的趋势。然而，大多数数据集都包含与单个数据点相关的多个变量的信息。\n\
  \n例如，一套房屋的销售不仅包含售价和面积的信息，还可能包含房间数量、运营成本和建造年份等信息。这些变量都以某种方式影响着价格，因此我们理应尝试将它们纳入考量。为了阐述这一思路，我们给示例数据增加一个维度。图\
  \ 4-5 展示了一个新的数据图，其中两个特征变量分别位于 X 轴和 Y 轴，目标变量位于 Z 轴。\n\n![../images/512351_1_En_4_Chapter/512351_1_En_4_Fig5_HTML.jpg](img/512351_1_En_4_Fig5_HTML.jpg)\n\
  \n图 4-5：扩展后的示例数据图，现在包含三个变量。\n\n如图所示，新的维度也与目标值呈线性关系。这两个特征变量与目标变量共同构成了一个类似倾斜不平的平面。在对数据有了直观理解之后，让我们开始进行数学推导。\n\
  \n#### 用向量推导线性回归\n\n在推导简单线性回归时使用的数学符号，对于一两个变量通常没问题。然而，我们可能希望将此技术用于包含 5 个、10 个甚至\
  \ 50 个变量的数据上。这样一来，我们需要推导的公式会变得极其复杂。我们需要一种新的符号表示法，以使后续的公式简洁紧凑，因此我们将使用向量和矩阵。使用向量符号，我们可以将一个样本点及其\
  \ *d* 个特征表示为\n\n![$$ \\boldsymbol{x}=\\left[\\begin{array}{c}{x}_1\\\\ {}{x}_2\\\
  \\ {}\\begin{array}{c}\\vdots \\\\ {}{x}_d\\\\ {}1\\end{array}\\end{array}\\right]\
  \ $$](images/512351_1_En_4_Chapter/512351_1_En_4_Chapter_TeX_Equt.png)\n\n我们在向量末尾添加一个\
  \ 1，以包含截距项，即在单变量情况下我们称之为 *m* 的值。如果现在将所有系数和截距项封装到一个向量 **w** 中，如下所示\n\n![$$ \\boldsymbol{w}=\\\
  left[\\begin{array}{c}{w}_1\\\\ {}{w}_2\\\\ {}\\begin{array}{c}\\vdots \\\\ {}{w}_d\\\
  \\ {}{w}_{d+1}\\end{array}\\end{array}\\right] $$](images/512351_1_En_4_Chapter/512351_1_En_4_Chapter_TeX_Equu.png)\n\
  \n那么这些向量的点积将产生如下表达式\n\n![$$ {\\boldsymbol{w}}^T\\boldsymbol{x}={w}_1{x}_1+{w}_2{x}_2+\\\
  dots +{w}_d{x}_d+{w}_{d+1}\\cdotp 1 $$](img/512351_1_En_4_Chapter_TeX_Equv.png)\n\
  \n这个方程正是我们所需的预测器。它是每个特征变量的线性表达式，加上一个截距变量，在此符号中我们称之为`w[d+1]`。与简单线性回归情况类似，我们希望衡量这个公式对训练数据的拟合效果。我们可以通过计算观测目标值与预测值之间差值的平方和来实现，因此可以修改之前的损失函数为\n\
  \n![$$ \\mathcal{L}=\\sum_{i=1}^N{\\left({y}_i-{\\boldsymbol{w}}^T{\\boldsymbol{x}}_i\\\
  right)}²=\\sum_{i=1}^N\\left({y}_i-{\\boldsymbol{w}}^T{\\boldsymbol{x}}_i\\right)\\\
  left({y}_i-{\\boldsymbol{w}}^T{\\boldsymbol{x}}_i\\right) $$](img/512351_1_En_4_Chapter_TeX_Equw.png)\n\
  \n为了进一步简化符号，我们可以将所有样本点收集到一个矩阵中，我们将其称为 **X**。通过将每个单独的特征向量作为行放入该矩阵，我们可以使用矩阵-向量乘法一次性计算出所有预测值。由于这会产生一个向量，因此我们也必须将目标值堆叠成向量格式。我们将此向量称为\
  \ **Y**。重写后的损失函数为\n\n![$$ \\mathcal{L}={\\left(\\boldsymbol{Y}-\\boldsymbol{Xw}\\\
  right)}^T\\left(\\boldsymbol{Y}-\\boldsymbol{Xw}\\right)={\\boldsymbol{Y}}^T\\boldsymbol{Y}-2{\\\
  boldsymbol{Y}}^T\\boldsymbol{Xw}-{\\boldsymbol{w}}^T{\\boldsymbol{X}}^T\\boldsymbol{Xw}\
  \ $$](img/512351_1_En_4_Chapter_TeX_Equx.png)\n\n注意，该表达式产生一个标量值，其含义与简单情况相同——它衡量了我们的预测值与观测值之间的距离，并对其求平方。\n\
  \n我们可以尝试通过使用与之前相同的技巧来优化该表达式，唯一的区别在于现在我们要计算梯度。梯度是一个由偏导数组成的向量，其概念形式如下：\n\n![$$ \\\
  frac{\\partial \\mathcal{L}}{\\partial \\boldsymbol{w}}=\\left[\\begin{array}{c}\\\
  frac{\\partial \\mathcal{L}}{\\partial {w}_1}\\\\ {}\\frac{\\partial \\mathcal{L}}{\\\
  partial {w}_2}\\\\ {}\\begin{array}{c}\\vdots \\\\ {}\\frac{\\partial \\mathcal{L}}{\\\
  partial {w}_d}\\\\ {}\\frac{\\partial \\mathcal{L}}{\\partial {w}_{d+1}}\\end{array}\\\
  end{array}\\right] $$](images/512351_1_En_4_Chapter/512351_1_En_4_Chapter_TeX_Equy.png)\n\
  \n计算 ℒ 关于向量 **w** 的梯度，我们得到\n\n![$$ \\frac{\\partial \\mathcal{L}}{\\partial \\boldsymbol{w}}=\\\
  frac{\\partial }{\\partial \\boldsymbol{w}}{\\boldsymbol{Y}}^T\\boldsymbol{Y}-2{\\\
  boldsymbol{Y}}^T\\boldsymbol{Xw}-{\\boldsymbol{w}}^T{\\boldsymbol{X}}^T\\boldsymbol{Xw}=2{\\\
  boldsymbol{X}}^T\\boldsymbol{Xw}-2{\\boldsymbol{X}}^T\\boldsymbol{Y} $$](img/512351_1_En_4_Chapter_TeX_Equz.png)\n\
  \n通过将梯度设置为零向量，我们得到以下表达式：\n\n![$$ \\frac{\\partial \\mathcal{L}}{\\partial \\boldsymbol{w}}=\\\
  mathbf{0} $$](img/512351_1_En_4_Chapter_TeX_Equaa.png)\n\n![$$ 2{\\boldsymbol{X}}^T\\\
  boldsymbol{Xw}-2{\\boldsymbol{X}}^T\\boldsymbol{Y}=\\mathbf{0} $$](img/512351_1_En_4_Chapter_TeX_Equab.png)\n\
  \n![$$ {\\boldsymbol{X}}^T\\boldsymbol{Xw}={\\boldsymbol{X}}^T\\boldsymbol{Y} $$](img/512351_1_En_4_Chapter_TeX_Equac.png)\n\
  \n为了找到最优解，我们需要认识到 **X** 是一个 *n*×(*d*+1) 的矩阵。这意味着 **X**^T 是一个 (*d*+1)×*n* 的矩阵。这样的乘法会生成一个大小为\
  \ (*d*+1)×(*d*+1) 的方阵。\n\n*可逆矩阵定理*给出了方阵可逆的若干条件。我们将在实现中使用的一个条件是：矩阵的特征值不能包含零。因此，如果我们有方法判断矩阵\
  \ **X**^T**X** 是否仅有非零特征值，我们就可以通过左乘逆矩阵来执行如下技巧：\n\n![$$ {\\left({\\boldsymbol{X}}^T\\\
  boldsymbol{X}\\right)}^{-1}{\\boldsymbol{X}}^T\\boldsymbol{X}\\boldsymbol{w}={\\\
  left({\\boldsymbol{X}}^T\\boldsymbol{X}\\right)}^{-1}{\\boldsymbol{X}}^T\\boldsymbol{Y}\
  \ $$](img/512351_1_En_4_Chapter_TeX_Equad.png)\n\n![$$ \\boldsymbol{w}={\\left({\\\
  boldsymbol{X}}^T\\boldsymbol{X}\\right)}^{-1}{\\boldsymbol{X}}^T\\boldsymbol{Y}\
  \ $$](img/512351_1_En_4_Chapter_TeX_Equae.png)\n\n这个方程为我们优化问题提供了一个解析解，并给出了最能拟合数据的\
  \ **w** 向量。\n\n**注意：** 线性回归也可以使用更通用的 Moore-Penrose 逆来实现，该逆矩阵对于所有元素为实数或复数的矩阵都是唯一且定义的。我们在此实现中不会进一步涉及，但对于想了解更多的人来说，这是一个有趣的话题和实现项目。\n\
  \n\n\n#### 实现多元线性回归\n\n在完成数学推导后，我们现在可以着手实现代码了。在本节中，我们将介绍 `Accelerate` 框架。`Accelerate`\
  \ 是一个专注于数学计算和高性能的库集合。它利用 CPU 的向量处理能力来加速密集型计算，并并行处理多个数值。\n\n我们将复用 `SimpleLinearRegression`\
  \ 结构体的一般结构。我们会在初始化器中拟合模型，使用泛型使结构体可复用至任意数据类型，通过 `KeyPath` 定位感兴趣的变量，并使用 `predict(x:)`\
  \ 函数对新数据点进行预测。不过，由于我们要定位多个变量，因此将使用可变参数。清单 4-4 展示了我们将在该任务中使用的新初始化器定义。\n\n```\ninit(from\
  \ samples: [Element],\n      data: KeyPath...,\n      target: KeyPath) throws\n\
  清单 4-4\n我们多元线性回归类型的初始化器定义\n```\n\n这个初始化器看起来与简单线性回归的初始化器非常相似。区别在于 `data` 参数类型后面跟的省略号。这种点点点语法使得参数可变，意味着只要它们符合声明的\
  \ `KeyPath` 类型，我们就可以定位任意数量的变量。清单 4-5 展示了此初始化器的两种完全有效的用法。\n\n```\nlet points: [Point3D]\
  \ = ...\nlet singleVar = MultipleLinearRegression(\n    from: points,\n    data:\
  \ \\.x,\n    target: \\.z\n)\nlet multiVar = MultipleLinearRegression(\n    from:\
  \ points,\n    data: \\.x, \\.y,\n    target: \\.z\n)\n清单 4-5\n使用可变参数定位不同变量的两种方式\n\
  ```\n\n如我们所见，可变参数为我们选择计算中要包含的变量提供了极大的灵活性。这种方法使得对可用信息的不同子集进行多个模型的测试和运行变得更加容易。\n\n\
  现在我们已经明确了如何使用 `MultipleLinearRegression`，接下来让我们深入探讨其运作细节。我们将把整个初始化器主体拆分成几个清单，以便分别推理每个部分。首先，清单\
  \ 4-6 显示了初始设置。\n\n```\nlet sampleCount = Int32(samples.count)\nlet dimCount32 =\
  \ Int32(data.count + 1)\nlet dimCount64 = data.count + 1\nlet XTransXDimension =\
  \ dimCount64 * dimCount64\n\nvar X = samples.flatMap { sample -> [Double] in\n \
  \   var row = data.map { keyPath in\n        sample[keyPath: keyPath].realValue\n\
  \    }\n    row.append(1)\n    return row\n}\nvar XTrans = X\nvar Y = samples.map\
  \ { sample in\n    return sample[keyPath: target].realValue\n}\nvar XTransX = Double\n\
  var XTransY = Double\n清单 4-6\nMultipleLinearRegression 初始化器执行的初始设置\n```\n\n我们做的第一件事是设置一些所需的数据结构。我们为样本数量和数据维度创建了计数变量。注意，变量\
  \ `dimCount32` 和 `dimCount64` 的值相同，仅类型不同。也可以选择使用单个变量并在需要时进行类型转换，但这会增加阅读此类代码时的认知噪音。\n\
  \n我们通过使用 `flatMap(_:)` 创建了 **X** 矩阵，这是一个与 `map(_:)` 和 `filter(_:)` 类似的高阶函数。它的工作方式类似于\
  \ `map(_:)`，但要求为每个数据点创建一个值序列。然后它会把生成的所有数组合并成一个，其中第一个数据点的 *k* 个元素占据序列中的前 *k* 个索引。这种方法的一个后果是，我们用一维表示来存储二维数据结构。与其他许多语言中保持嵌套数组的方式不同，我们将每一行依次排列。这种布局称为行主序。相反的做法是将矩阵的各列依次放置，这被称为列主序。\n\
  \n`XTrans` 是数学符号中我们称为 **X**^T 的矩阵。很容易看出它并不是 **X** 的转置，而仅仅是一个普通副本。不过这没关系，因为我们将从 `Accelerate`\
  \ 框架中使用的函数调用，能在执行主要计算前先计算矩阵的转置。\n\n**Y** 是包含目标值的向量，即每个样本点的观测值。由于我们希望尽量减少在得到结果前需要执行的数学运算次数，因此更倾向于先进行矩阵-向量乘法，再进行矩阵-矩阵乘法。然而，我们无法避免单独计算\
  \ (**X**^T**X**)^(-1)。为最小化工作量，我们将计算分为三步：\n\n![$$ 步骤 1: 计算\\ \\boldsymbol{M}={\\\
  left({\\boldsymbol{X}}^T\\boldsymbol{X}\\right)}^{-1}\\kern1.5em \\left( 矩阵-矩阵\\\
  right) $$](img/512351_1_En_4_Chapter_TeX_Equaf.png)\n\n![$$ 步骤 2: 计算\\ \\boldsymbol{V}={\\\
  boldsymbol{X}}^T\\boldsymbol{Y}\\kern4em \\left( 矩阵-向量\\right) $$](img/512351_1_En_4_Chapter_TeX_Equag.png)\n\
  \n![$$ 步骤 3: 计算\\ \\boldsymbol{R}=\\boldsymbol{MV}\\kern4.25em \\left( 矩阵-向量\\right)\
  \ $$](img/512351_1_En_4_Chapter_TeX_Equah.png)\n\n因为我们采用这种方法，所以还设置了 `XTransX` 和\
  \ `XTransY` 数组。请注意，我们使用 `var` 关键字声明了所有数组。这样做是因为我们需要将指针传递给 `Accelerate` 方法。由于指针可能会修改底层存储，因此这些变量必须是可变的。\n\
  \n现在我们已经为计算分配了部分所需存储空间，接下来让我们开始对 `Accelerate` 框架进行首次调用。我们将从使用清单 4-7 所示的方法开始。\n\n\
  ```\nfunc cblas_dgemv(\n    _ __Order: CBLAS_ORDER,\n    _ __TransA: CBLAS_TRANSPOSE,\n\
  \    _ __M: Int32,\n    _ __N: Int32,\n    _ __alpha: Double,\n    _ __A: UnsafePointer!,\n\
  \    _ __lda: Int32,\n    _ __X: UnsafePointer!,\n    _ __incX: Int32,\n    _ __beta:\
  \ Double,\n    _ __Y: UnsafeMutablePointer!,\n    _ __incY: Int32\n)\n清单 4-7\nAccelerate\
  \ 框架中提供的众多矩阵-向量乘法方法之一\n```\n\n那些对 Swift 开发略有经验的人会注意到，这个声明看起来与他们见过的多数 Swift 代码不同。这是因为该函数（以及我们将使用的其他一些函数）引用的是\
  \ Apple 为 C 语言实现的*基础线性代数子程序*（CBLAS）。Swift 拥有便捷的 C 函数导入能力。这一特性非常实用，但伴随一个小不便：在使用这些接口时，代码看起来不那么现代。\n\
  \n回到清单 4-7 中的函数，我们快速梳理一下它期望我们传递给各个参数的内容：\n\n* **__Order**：此参数指定用于乘法的矩阵的顺序。由于我们选择按行主序组织矩阵，因此传入\
  \ `CblasRowMajor` 作为参数。\n\n\n\n*   **`TransA`**：指定函数是否应在执行乘法前对矩阵进行转置。我们并未预先计算转置，因此传递\
  \ `CblasTrans`。\n*   **`M`**：原始矩阵的行数。由于我们将样本点放在每一行，因此有 `sampleCount` 行。\n*   **`N`**：原始矩阵的列数。我们的矩阵将有\
  \ `dimCount32` 列。\n*   **`alpha`**：此参数按一定比例缩放乘法的结果。我们希望保持原有比例，因此传入 1。\n*   **`A`**：指向矩阵的指针。\n\
  *   **`lda`**：矩阵的主维度。由于我们选择了行主序，将传入列数，即 `dimCount32`。\n*   **`X`**：指向向量的指针。\n* \
  \  **`incX`**：遍历向量 `X` 时使用的步长。\n*   **`Y`**：指向可存储结果向量的结构的指针。\n*   **`incY`**：遍历\
  \ `Y` 时使用的步长。\n\nBLAS 接口确实信息量很大。代码清单 4-8 展示了另一个我们将用于矩阵-矩阵乘法的 BLAS 函数声明。不过，我们不会解释那些参数，因为它们与代码清单\
  \ 4-7 中函数的参数非常相似。\n\n```\nfunc cblas_dgemm(\n_ __Order: CBLAS_ORDER,\n_ __TransA:\
  \ CBLAS_TRANSPOSE,\n_ __TransB: CBLAS_TRANSPOSE,\n_ __M: Int32,\n_ __N: Int32,\n\
  _ __K: Int32,\n_ __alpha: Double,\n_ __A: UnsafePointer!,\n_ __lda: Int32,\n_ __B:\
  \ UnsafePointer!,\n_ __ldb: Int32,\n_ __beta: Double,\n_ __C: UnsafeMutablePointer!,\n\
  _ __ldc: Int32\n)\n```\n代码清单 4-8\n多个可用于矩阵-矩阵乘法的 BLAS 函数之一\n\n> **注意**\n> 我们只是触及了\
  \ BLAS 接口所能实现功能的冰山一角。要深入研究，欢迎访问 IBM 关于*工程与科学子程序库*的文档，其中包含对 BLAS 例程的良好文档化实现。\n> [`www.ibm.com/docs/en/essl`](http://www.ibm.com/docs/en/essl)\n\
  \n现在我们已经知道如何使用矩阵和向量乘法方法，我们可以将代码清单 4-9 中列出的代码添加到我们的初始化器中。\n\n```\ncblas_dgemv(\n\
  CblasRowMajor,\nCblasTrans,\nsampleCount,\ndimCount32,\n1,\n&XTrans,\ndimCount32,\n\
  &Y,\n1,\n1,\n&XTransY,\n\n)\ncblas_dgemm(\nCblasRowMajor,\nCblasTrans,\nCblasNoTrans,\n\
  dimCount32,\ndimCount32,\nsampleCount,\n1,\n&XTrans,\ndimCount32,\n&X,\ndimCount32,\n\
  1,\n&XTransX,\ndimCount32\n)\n```\n代码清单 4-9\n为我们的多元线性回归计算 `XTX` 和 `XTY`\n\n在执行最后一次矩阵-向量乘法并得到结果之前，我们需要对\
  \ **X**^T**X** 求逆。为此，我们将使用一组 LAPACK 例程，即 `dgetrf_` 和 `dgetri_`。这两个函数协同工作，对矩阵执行 LU\
  \ 分解，然后求解方程组以找到其逆矩阵。代码清单 4-10 显示了这些函数的声明。\n\n```\nfunc dgetrf_(\n_ __m: UnsafeMutablePointer!,\n\
  _ __n: UnsafeMutablePointer!,\n_ __a: UnsafeMutablePointer!,\n_ __lda: UnsafeMutablePointer!,\n\
  _ __ipiv: UnsafeMutablePointer!,\n_ __info: UnsafeMutablePointer!\n) -> Int32\n\
  func dgetri_(\n_ __n: UnsafeMutablePointer!,\n_ __a: UnsafeMutablePointer!,\n_ __lda:\
  \ UnsafeMutablePointer!,\n_ __ipiv: UnsafeMutablePointer!,\n_ __work: UnsafeMutablePointer!,\n\
  _ __lwork: UnsafeMutablePointer!,\n_ __info: UnsafeMutablePointer!\n) -> Int32\n\
  ```\n代码清单 4-10\nLAPACK 函数 `dgetrf_` 和 `dgetri_` 的声明\n\n诚然，如果 BLAS 方法看起来有点吓人，那么这些看起来就像真正的噩梦。然而，一旦我们稍微了解一下幕后发生的事情，这些方法也会变得有用。\n\
  \n`__CLPK_integer` 和 `__CLPK_doublereal` 只是 `Int32` 和 `Double` 的类型别名。仅知道这一点就能让认知负担减轻一些。参数\
  \ `__m` 和 `__n` 是矩阵维度，就像其他函数一样。参数 `__a` 代表我们要逆的矩阵，`__lda` 和之前一样是主维度。`__ipiv` 代表一组主元索引，用于指示函数在分解过程中如何重新排列行。`__work`\
  \ 和 `__lwork` 分别是工作空间数组及其维度。根据 IBM 的文档，工作空间的大小至少应为 `__n` 的一百倍，才能使算法获得良好性能。最后，`__info`\
  \ 参数向开发者返回有关失败的信息。例如，它告诉我们试图求逆的矩阵是否包含特征值为零的情况。这个机制就是我们在讨论*可逆矩阵定理*时谈到的安全防护。\n\n要使用这些函数，我们需要设置一些额外的数组和支持变量。我们还需要声明一个错误枚举，用于传播任何失败。代码清单\
  \ 4-11 显示了枚举，而代码清单 4-12 列出了设置以及对 `dgetrf_` 和 `dgetri_` 的调用。\n\n```\nvar m = dimCount32\n\
  var n = dimCount32\nvar lda = dimCount32\nvar workspaceSize = 100 * m\nvar pivots\
  \ = Int32\nvar workspace = Double\n)\nvar luError = Int32.zero\nvar invError = Int32.zero\n\
  dgetrf_(&m, &n, &XTransX, &lda, &pivots, &luError)\nswitch luError {\ncase ..<0:\n\
  throw LinearRegressionError.invalidArguments\ncase 1...:\nthrow LinearRegressionError.singularMatrix\n\
  default:\nbreak\n}\ndgetri_(&m, &XTransX, &lda, &pivots, &workspace, &workspaceSize,\
  \ &invError)\nswitch invError {\ncase ..<0:\nthrow LinearRegressionError.invalidArguments\n\
  case 1...:\nthrow LinearRegressionError.singularMatrix\ndefault:\nbreak\n}\n```\n\
  代码清单 4-12\n设置工作空间并计算 `(XTX)-1`\n\n```\nenum LinearRegressionError: Error {\ncase\
  \ singularMatrix\ncase invalidArguments\n}\n```\n代码清单 4-11\n我们用于传播错误的错误结构体的定义\n\n\
  一旦这些调用返回，逆矩阵 (**X**^T**X**)^(-1) 就存入了名为 `XTransX` 的变量中。假设 `dgetrf_` 和 `dgetri_`\
  \ 正常退出，并且我们没有抛出任何错误，那么我们就拥有了计算向量 **w** 所需的两个组件——`dimCount32` × `dimCount32` 的矩阵\
  \ (**X**^T**X**)^(-1) 和长度为 `dimCount32` 的向量 **X**^T**Y**。剩下的就是再执行一次矩阵-向量乘法来获得最终结果。代码清单\
  \ 4-13 显示了初始化器中最后的代码片段，其中出现了我们的老朋友 `cblas_dgemv(_:_:_:_:_:_:_:_:_:_:_:_:)`。\n\n\
  ```\nvar w = Double\ncblas_dgemv(\nCblasRowMajor,\nCblasTrans,\ndimCount32,\ndimCount32,\n\
  1,\n&XTransX,\ndimCount32,\n&XTransY,\n1,\n1,\n&w,\n\n)\nself.w = w\nself.variables\
  \ = data\n```\n代码清单 4-13\n初始化器方法的最后代码片段\n\n完成初始化器中的计算后，我们为 `w` 创建存储空间，执行最后的乘法，然后将计算出的系数和\
  \ `KeyPath` 存入 `data` 参数以供后续使用。\n\n我们完成了学习算法的实现，这本身就是一个重要的里程碑。但是，如果我们不能用它来进行预测，它就没有任何实际价值，因此我们还需要实现\
  \ `predict(x:)` 函数。为此，我们将再使用一个 BLAS 例程。请记住，我们将预测定义为\n\n![$$ {\\boldsymbol{w}}^T\\\
  boldsymbol{x}={w}_1{x}_1+{w}_2{x}_2+\\dots +{w}_d{x}_d+{w}_{d+1}\\cdotp 1 $$](img/512351_1_En_4_Chapter_TeX_Equai.png)\n\
  \n\n\n我们已经可以轻松访问`w`^T，这要归功于刚刚实现的初始化器。然而，我们需要为想要预测的样本点创建一个新的特征向量。幸运的是，我们已经有了一个实现该过程的方法，因为我们已为矩阵`X`创建了整套特征向量。剩下的任务就是执行求和运算。我们可以使用像`reduce(_:)`这样的高阶函数来将所有元素相乘并求和。这种方法对于小型特征集或仅对有限数量的数据点进行预测时是完全可接受的。然而，如果特征集或数据点数量较大，则可能需要很长时间。让我们探索一种借助\
  \ BLAS 进行此计算的方法。清单 4-14 展示了一个计算两个向量点积的函数的声明。\n\n```\nfunc cblas_ddot(\n_ __N: Int32,\n\
  _ __X: UnsafePointer!,\n_ __incX: Int32,\n_ __Y: UnsafePointer!,\n_ __incY: Int32\n\
  ) -> Double\n清单 4-14\n计算点积的多个 BLAS 例程之一\n```\n\n该函数的参数含义与矩阵-向量和矩阵-矩阵乘法方法中的参数相似，但让我们快速过一遍：\n\
  \n*   `__N`：此参数指定每个向量中要包含在点积中的元素数量。它最多不能超过最短向量的长度，否则会发生奇怪的事情。对于我们的线性回归，它将与`w`的长度相同。\n\
  *   `__X`：此参数接受指向第一个向量的指针。在我们的例子中，这是`w`。\n*   `__incX`：向量`__X`的步长。由于我们需要求和中的所有元素，我们将其设置为\
  \ 1。\n*   `__Y`：指向第二个向量的指针。我们将传入一个指向数据点的特征向量的指针。\n*   `__incY`：与`__incX`类似，此参数指定向量`__Y`内部的步长。我们也将其设置为\
  \ 1。\n\n现在我们已经涵盖了进入预测的不同部分，让我们实现`MultipleLinearRegression`的最后一部分。清单 4-15 中的代码展示了该函数。\n\
  \n```\nfunc predict(x: Element) -> Double {\nvar features = variables.map { keyPath\
  \ in\nx[keyPath: keyPath].realValue\n}\nfeatures.append(1)\nlet n = Int32(w.count)\n\
  var w = w\nreturn cblas_ddot(\nn,\n&w,\n1,\n&features,\n\n)\n}\n清单 4-15\n在多元线性回归类型中使用我们的工作成果之前的最终函数\n\
  ```\n\n正如我们所见，特征的映射与我们之前在初始化器中学习线性函数时执行的映射非常相似。唯一的区别在于，我们只创建一个单一的特征向量，而不是将多行放入矩阵结构中。总的来说，这个函数非常简洁，阅读和理解起来也不费太多功夫。\n\
  \n所有这些工作最终形成了一个功能性的算法，用于学习线性回归并进行预测。清单 4-16 包含来自附带代码项目的一些代码，展示了如何在一个示例数据集上使用我们新的\
  \ Swift 类型。请记住，我们需要将代码包装在`do-catch`子句中，以处理任何抛出的错误。还有一个新的`description`属性的实现，用于打印我们新的线性方程。但为了简洁起见，此清单中省略了它。\n\
  \n```\nlet points = DataLoader.load(\nPoint3D.self,\nfrom: .multipleLinearRegression\n\
  )\ndo {\nlet regressor = try MultipleLinearRegression(\nfrom: points,\ndata: \\\
  .x, \\.y,\ntarget: \\.z\n)\nlet observed = points[42]\nlet prediction = regressor.predict(x:\
  \ observed)\nprint(\n\"\"\"\nf(x) = \\(regressor)\nPrediction for (\\(observed.x),\
  \ \\(observed.y))\n\\(prediction)\nObserved value for (\\(observed.x), \\(observed.y))\n\
  \\(observed.z)\n\"\"\"\n)\n}\ncatch {\nprint(\"An error was thrown: \\(error)\"\
  )\n}\n// 输出：\n// f(x) = 1.010083366089924 * x_1 –\n// 0.9873800441120847 * x_2 -\
  \ 0.23672317614604843\n// Prediction for (3.0, 3.0)\n// -0.16861321021253062\n//\
  \ Observed value for (3.0, 3.0)\n// -0.379395117657068\n清单 4-16\n如何使用我们新的 MultipleLinearRegression\
  \ 类型的示例\n```\n\n#### 预测房屋销售价格\n\n在完成新工具的开发后，尝试在有趣的数据集上使用它们总是很有趣的。代码项目中包含一个名为`HousePricePredictions.swift`的文件，我们可以专门用于此目的。它加载了一个包含生成的房屋销售数据的数据集，该数据集遵循与瑞典四个大城市近\
  \ 12500 笔近期销售相似的分布。欢迎自由探索这些数据，并尝试哪些变量能为您带来最小的损失值。思考不同变量的性质，它们是否自然地由实数或整数表示，以及这如何影响回归。\n\
  \n### 章节总结\n\n在本章中，我们从数学和工程方面都涵盖了不少理论。我们学习了两个数据点之间的简单线性外推，以及当样本变得过于不规则时它是如何失效的。我们还了解了线性样条，讨论了它们为何以及如何有用，以及为什么它们不太适合大型数据集。这些讨论后来帮助我们理解了线性回归所解决的缺点，从而进入了线性回归的领域。\n\
  \n在关于线性回归的章节中，我们学习了损失函数，它帮助我们确定特定模型描述我们观测数据的程度。我们还借助该损失函数推导了线性回归的理论，并进行了两种实现——一种用于简单情况，另一种用于多变量情况。后者引导我们了解了\
  \ BLAS 和 LAPACK，并展示了我们在解决这些问题时可以使用的一些工具。\n\n在尝试对现实世界进行预测时，对其进行建模是一项非常有用的技能。然而，观察两组观测数据并评估某些重要指标是否发生了显著变化，同样是一项有用的技能。这正是我们将在下一章中研究的问题。\n\
  \n"
- "# 5. 假设检验\n\n假设检验是统计学中一个有价值的分支。它在处理那些分布可能随时间或因某些事件而变化的随机变量时，可以为我们提供帮助。然而，它也是学生认为最令人生畏且最难理解的主题之一。在本章中，我们将通过几个例子来学习如何提出一个假设，并利用\
  \ Swift 来确定它是否比当前公认的真相更有可能成立。\n\n\n\n## 什么是假设检验？\n\n为了更好地理解假设检验为何有用，让我们来看一个示例陈述：\n\
  \n-  一所大学的院长声称在校学生拥有高于平均水平的智力。随机抽取的 30 名学生同意参加一项智商测试，根据韦克斯勒成人智力量表（`WAIS`），他们的平均得分为\
  \ 105 分。院长的说法正确吗？\n\n虽然这个具体例子可能不是数据科学家或统计学家日常工作中的一部分，但它将帮助我们思考一些需要考虑的问题。\n\n`WAIS`的分数呈正态分布，平均分为\
  \ 100 分，标准差为 15 分。由于学生的平均得分为 105 分，高于`WAIS`的平均分 100 分，人们可能会倾向于得出结论：院长是正确的。然而，这种推理方式引发了一些问题。\n\
  \n-   即使分数有差异，差异也仅为 5%。这个差异是否足以做出如此笼统的断言？\n-   如果我们选择参与测试的学生时运气好怎么办？也许参与测试的学生分数比其他学生要高。\n\
  -   我们如何衡量前两个问题带来的不确定性？我们能否得出一个数字，告诉我们对自己的结果有多大的信心？\n\n正如我们所看到的，在判断这个例子中的论断是否合理，或者是否应该拒绝它们之前，我们需要考虑许多因素。首先，我们需要建立一些术语，以便更容易地使用数学工具来解决问题。\n\
  \n### 提出假设\n\n为了解决这些问题，我们首先需要将想要检验的假设正式化。初学者经常在这一部分遇到困难，主要原因似乎是，筛选出问题的相关信息并不总是那么容易。为了能熟练地提出假设，我们将描述为任何问题都需要提出的两种不同类型的假设，并展示几个例子来熟悉这些概念。现在，我们将重点放在高层概念上，更多细节将在后续章节中介绍。\n\
  \n#### 零假设\n\n零假设，用 `H[0]` 表示，描述了一个普遍接受的事实。它表明我们收集的样本与当前公认的基准事实之间没有显著差异。例如，一家汽车制造商可能规定某款车型的平均油耗为每加仑\
  \ 23 英里。那么零假设认为，我们通过测试该车型的几辆车所收集到的任何数据，其平均油耗都将为每加仑 23 英里。这个假设的数学表述如下：\n\n```\nH0:\
  \ μ = 23 mpg\n```\n\n就是这样！不多也不少。我们陈述，根据 `H[0]`，平均值 `μ` 等于每加仑 23 英里。\n\n#### 备择假设\n\
  \n备择假设，用 `H[A]` 表示，是一个我们想要研究的论断。它提出了一种零假设不再成立的新情况。例如，前面例子中的汽车制造商最近可能对生产线进行了改动。由于这些改动，我们相信新车不再能达到每加仑\
  \ 23 英里的油耗。然而，我们对于这些改动是提高了还是降低了燃油效率并无定见。它可能比以前更高，也可能更低。用数学符号表示，我们将这个假设记为：\n\n```\n\
  HA: μ ≠ 23 mpg\n```\n\n备择假设看起来和上一节的零假设一样简单。需要注意的一点是，零假设和备择假设互为补集。也就是说，它们涵盖了所有可能的结果。在这个例子中，平均燃油效率要么是\
  \ 23 英里/加仑，要么是其他数值。绝无可能构造出两个假设同时为真或同时为假的情况。\n\n零假设和备择假设互为补集这一事实，使我们能够更深入地探索其他问题。我们能否利用其他的互补关系，在检验的内容和方式上拥有更大的灵活性？\n\
  \n#### 单侧与双侧检验\n\n我们在上一节中提出备择假设的方式在技术上并没有错。然而，假设平均燃油效率发生了变化却没有指明方向，确实感觉有些奇怪。确实有些时候我们只需要检验某个统计量是否朝着某个方向变化了，但还有些时候我们希望更具体一些。\n\
  \n想象一下，前面例子中对生产线的改动意味着燃烧室现在由拥有更好技术的合作伙伴提供，使得零部件质量更高。有了这样的额外信息，我们可能更有把握地假设平均燃油效率提高了。做出这个假设意味着我们之前提出的\
  \ `H[0]` 和 `H[A]` 不再能描述我们的假设。相反，我们的备择假设认为平均值大于每加仑 23 英里。由于 `H[0]` 和 `H[A]` 需要互为补集，因此零假设必须是平均值小于或等于\
  \ 23。数学上，我们的新假设如下所示：\n\n```\nH0: μ ≤ 23 mpg\n```\n\n```\nHA: μ > 23 mpg\n```\n\n\
  虽然这样做没有精确地捕捉到当前公认的平均燃油效率，但这种表述方式确实有一些好处。首先，它允许我们通过指定我们认为平均值发生了变化的方向，将额外信息封装到备择假设中。其次，尽管零假设的范围从每加仑\
  \ 23 英里向下延伸，但它仍然包含了汽车制造商最初的声称。\n\n我们将这种新的表述称为*单尾检验*，仅仅是因为它指定了我们认为统计量发生变化的单一方向。如果我们认为平均值向下偏移，也会使用同样的术语。第一个例子仅仅假设平均值发生了变化，但没有指定方向，因此被称为*双尾检验*。\n\
  \n我们还可以将单尾检验进一步细分为*左尾检验*和*右尾检验*。这种分类取决于所认为的变化的具体方向。当 `H[A]` 指定统计量减少时，我们使用左尾检验；而当\
  \ `H[A]` 指定统计量增加时，则使用右尾检验。\n\n有一点非常关键：假设检验对假设是否为真没有任何说明。它只说明根据我们收集的数据，哪个假设更有可能。这听起来可能有些奇怪，但解释起来相当直接。仅仅因为我们可能最终证明了其中一个选项比另一个更有可能，并不一定意味着它就是真的。证明一个假设或理论为真是一项困难得多的任务。\n\
  \n既然我们已经定义了假设检验相关的一些术语，是时候深入探讨细节了。首先，根据我们到目前为止的定义，单尾检验和双尾检验是相对容易理解的。然而，我们还没有揭示这些“尾”究竟是什么。为了理解这一点，我们需要问自己几个关于样本均值分布的问题。\n\
  \n\n\n## 样本均值的分布\n\n想象一下，一顶帽子里有 100 张折叠好的纸条。每张纸条上都写着一个介于 0 到 5 之间的数字。我们的任务是计算这些数字的平均值，但我们只能查看\
  \ 30 张随机选出的纸条。这个场景会产生几种不同的可能结果。\n\n-   我们最终可能选到数字最大的那几张纸条。在这种情况下，我们的计算结果可能远大于真实均值。然而，恰好选中这些纸条的概率相对较小。\n\
  -   类似地，我们最终也可能选到数字最小的那几张。在这种情况下，我们计算出的均值会比真实均值小很多。出现这种情况的概率也同样很小。\n-   最可能的结果介于上述两个极端之间。我们很可能会选到一些较大数字和较小数字的混合，取这些数字的平均值会得到一个至少在一定程度上接近真实均值的结果。\n\
  \n这种类型的分布听起来可能让你想起第三章 3 的内容。让我们编写一些代码，来可视化从某个集合中抽取的样本均值的分布。代码清单 5-1 展示了一个 SwiftUI\
  \ 视图的初始化器，它接收一个数字数组，并用其计算大量样本均值。然后，我们在 `body` 属性中将这些结果绘制成直方图进行可视化，如代码清单 5-2 所示。\n\
  \n```\nvar body: some View {\n    VStack(spacing: 20) {\n        Text(\"计算样本均值\"\
  )\n            .font(.largeTitle)\n        HStack(spacing: 20) {\n            Text(\"\
  真实均值: \\(mean, specifier: \"%.3f\")\")\n            Text(\"每个均值的样本数: \\(numberOfSamples)\"\
  )\n        }\n        .padding(.horizontal)\n        Histogram(\n            data:\
  \ data,\n            label: \"样本均值的分布\",\n            barWidth: barWidth,\n    \
  \        xAxisMin: 0,\n            xAxisMax: 5\n        )\n    }\n}\n```\n\n代码清单\
  \ 5-2：在直方图中展示计算出的样本均值\n\n```\ninit(\n    numberOfMeans: Int,\n    numberOfSamples:\
  \ Int,\n    sampledFrom set: [Double]\n) {\n    precondition(\n        !set.isEmpty,\n\
  \        \"样本至少需要包含一个元素。\"\n    )\n    // 用于将值放入直方图的组块中\n    let rounding = 0.1\n\
  \    let meansIterator = (1 ... numberOfMeans).lazy\n    let samplesIterator = (1\
  \ ... numberOfSamples).lazy\n    self.data = meansIterator\n        .map { _ in\n\
  \            samplesIterator\n                .compactMap { _ in set.randomElement()\
  \ }\n                .mean(of: \\.self)\n        }\n        .reduce(into: [Double:\
  \ Int]()) { dict, mean in\n            let roundedMean = (mean / rounding)\n   \
  \             .rounded() * rounding\n            dict[roundedMean, default: 0] +=\
  \ 1\n        }\n        .map { key, value in\n            BarChartDataEntry(\n \
  \               x: key,\n                y: value.realValue / numberOfMeans.realValue\n\
  \            )\n        }\n    self.barWidth = 0.9 * rounding\n    self.mean = set.mean(of:\
  \ \\.self)\n    self.numberOfSamples = numberOfSamples\n}\n```\n\n代码清单 5-1：计算并绘制多个样本均值\n\
  \n在一个包含 100 个 0 到 5 之间均匀随机数的集合上运行上述代码，会生成如图 5-1 所示的直方图。该代码计算了总共 5000 个样本均值，每个均值使用了\
  \ 30 个样本。\n\n![../images/512351_1_En_5_Chapter/512351_1_En_5_Fig1_HTML.png](img/512351_1_En_5_Fig1_HTML.png)\n\
  \n图 5-1：从一个包含 100 个均匀随机数的集合中计算出的 5000 个样本均值\n\n观察这个直方图，我们得到了一个可视化证据，证实了之前列举计算样本均值的不同结果时的猜想。这些柱状图形成了一个看起来非常像正态分布的形状！这个结果并非巧合，而是由一个数据科学家和统计学家经常使用的定理所正式表述的。\n\
  \n### 中心极限定理\n\n中心极限定理让任何想要进行假设检验的人的生活变得轻松得多。它告诉我们，来自总体的样本均值的分布可以用正态分布来近似。无论我们从中采样的分布是否为正态分布，这个结论都成立。但是，我们需要满足一些条件。\n\
  \n-   我们需要进行有放回抽样。例如，一旦我们选择了一名学生进行智商测试，就不能将其从样本池中移除，因为这会改变剩余样本的分布。相反，我们必须接受可能多次选中同一名学生的可能性。\n\
  -   我们需要样本量足够大。也就是说，我们不能只随机选择两三个学生。一个普遍接受的界限是，我们至少需要 30 个样本，该定理才适用。\n\n注意：上述样本量限制有一个例外。如果样本来自正态分布的总体，那么即使样本量小于\
  \ 30，该定理也适用。\n\n假设上述条件成立，中心极限定理告诉我们，我们可以用正态分布来近似样本均值的分布。当我们在第三章 3 讨论正态分布时，我们提到均值\
  \ μ 和标准差 σ 定义了特征钟形曲线的确切形状。我们通过以下公式来估计这些参数：\n\n![$$ {\\upmu}_{est}=\\frac{1}{N}\\\
  sum \\limits_{i=1}^N{\\overline{x}}_i $$](img/512351_1_En_5_Chapter_TeX_Eque.png)\n\
  \n![$$ {\\sigma}_{est}=S=\\frac{1}{N-1}\\sum \\limits_{i=1}^N{\\left({\\overline{x}}_i-\\\
  mu \\right)}² $$](img/512351_1_En_5_Chapter_TeX_Equf.png)\n\n在这些公式中，我们用顶部带横线的 *x*\
  \ 表示单个样本均值。我们用 *S* 表示样本标准差。这两者都是真实均值和标准差的无偏估计量，因此在我们不知道实际值的情况下，它们是可接受的替代品。在已知总体均值和标准差的情况下，我们可以改用以下公式：\n\
  \n![$$ {\\mu}_{est}={\\mu}_{population} $$](img/512351_1_En_5_Chapter_TeX_Equg.png)\n\
  \n![$$ {\\sigma}_{est}=\\frac{\\sigma_{population}}{\\sqrt{N}} $$](img/512351_1_En_5_Chapter_TeX_Equh.png)\n\
  \n在这些方程中，N 表示样本量，用于缩放总体的标准差。上述公式的推导和证明超出了本书的范围。但是，我们将看两个例子，以便直观地感受它们成立。\n\n图 5-2\
  \ 展示了一个参数为 α = 3 和 β = 3 的伽马分布。图 5-3 展示了 1000 个样本量为 30 的样本均值的密度直方图。它还叠加了一条根据估计未知均值和标准差的公式计算参数的正态分布曲线。\n\
  \n图 5-4 展示了一个更有趣的分布。它是两个贝塔分布的线性组合，一个参数为 α = 7 和 β = 2，另一个参数为 α = 2 和 β = 5。图 5-5\
  \ 展示了样本均值的直方图以及一条参数经过适当估计的正态分布曲线。\n\n![../images/512351_1_En_5_Chapter/512351_1_En_5_Fig5_HTML.png](img/512351_1_En_5_Fig5_HTML.png)\n\
  \n图 5-5：根据图 5-4 中贝塔分布的线性组合计算出的 1000 个样本均值的分布，以及一条参数 μ ≈ 0.532 且 σ ≈ 0.021 的叠加正态分布曲线\n\
  \n![../images/512351_1_En_5_Chapter/512351_1_En_5_Fig4_HTML.png](img/512351_1_En_5_Fig4_HTML.png)\n\
  \n图 5-4\n\n\n\n一个由两个贝塔分布线性组合构成的分布\n\n![../images/512351_1_En_5_Chapter/512351_1_En_5_Fig3_HTML.png](img/512351_1_En_5_Fig3_HTML.png)\n\
  \n图 5-3\n\n根据图 5-2 中的伽马分布计算出的 1000 个样本均值的分布，以及参数为 `μ ≈ 0.994` 和 `σ ≈ 0.102` 的正态分布叠加图\n\
  \n![../images/512351_1_En_5_Chapter/512351_1_En_5_Fig2_HTML.png](img/512351_1_En_5_Fig2_HTML.png)\n\
  \n图 5-2\n\n参数为 `α = 3` 和 `β = 3` 的伽马分布\n\n我们首先来讨论伽马分布。将所有 1000 个样本均值绘制成直方图后，我们会发现这个分布呈钟形。当将其与我们根据估计参数\
  \ `μ` 和 `σ` 得到的正态分布进行比较时，可以看到两者非常吻合。我们还可以注意到，估计均值 `μ` 非常接近该分布的真实均值（即 1）。有人可能会认为，这个特定的伽马分布看起来有点像偏态正态分布，因此近似效果更好。然而，观察后续的图表，我们会发现情况并非如此。\n\
  \n两个贝塔分布的线性组合形成了一个有趣的形状。它有两个峰值，且完全不像正态分布。尽管如此，计算样本量为 30 的 1000 个样本均值并绘制成直方图后，得到的分布与伽马分布例子中的形状非常相似。将其与正态分布曲线进行比较，我们发现，尽管两者的拟合程度不如第一个例子那么好，但考虑到原始分布如此奇特，这种匹配效果仍然令人印象深刻。\n\
  \n既然我们知道正态分布可以近似表示样本均值的分布，那么我们就可以讨论什么是尾部了：\n\n- **左尾检验**关心样本均值需要小到何种程度才会被视为统计异常值。也就是说，它需要比\
  \ `μ` 低多少，才小到不可能是偶然出现的？\n- **右尾检验**描述了相反的情况：样本均值需要大到何种程度，才大到不可能是巧合？\n- **双尾检验**关心的是样本均值需要与\
  \ `μ` 在任何方向上相差多少，我们才能有把握地说这绝非随机事件。\n\n在掌握了这些理论之后，我们就可以确定什么是“不太可能”，并开始检验一些假设了！\n\n\
  ### 检验假设\n\n我们刚刚介绍的工具和理论几乎就是判断大学院长的说法是否正确所需的一切。我们从提出原假设和备择假设开始。在这个案例中，我们正在调查一项主张，即院长所带的学生智力高于平均水平。原假设必须是其对立面，即他们的智力等于或低于平均水平。根据韦氏成人智力量表（WAIS），平均智力得分为\
  \ 100，因此我们得到：\n\n![$$ {H}_0:\\kern1em \\mu \\le 100 $$](img/512351_1_En_5_Chapter_TeX_Equi.png)\n\
  \n![$$ {H}_1:\\kern1em \\mu &gt;100 $$](img/512351_1_En_5_Chapter_TeX_Equj.png)\n\
  \n下一步是决定我们对自己的判断要有多少把握。假设我们最终认为这些大学学生的智力确实高于平均水平。在这种情况下，我们希望将所抽样的学生都来自校园智商最高群体的可能性降到最低。我们需要确定一个置信水平和阿尔法值。\n\
  \n#### 确定置信水平\n\n置信水平通常用字母 `c` 表示，它决定了我们需要对结果有多大的把握才能拒绝原假设。它告诉我们在备择假设变得比原假设更可能成立之前，检验统计量必须与\
  \ `μ` 偏离多少。如果我们决定要有 95% 的把握，那么\n\n![$$ c=0.95 $$](img/512351_1_En_5_Chapter_TeX_Equk.png)\n\
  \n置信水平不仅能告诉我们拒绝和保留原假设的界限划在哪里，而且在向他人解释我们的决定时，它也能为我们的决策提供合理性依据。如果我们最终拒绝原假设，从而认为这些大学的学生比平均水平更聪明，那么置信水平为\
  \ 0.95 就意味着我们至少有 95% 的把握认为这个决定是正确的。\n\n#### 确定阿尔法值\n\n与置信水平相对的是阿尔法值，用希腊字母 `α` 表示。我们将其定义为\n\
  \n![$$ \\alpha =1-c $$](img/512351_1_En_5_Chapter_TeX_Equl.png)\n\n如果我们想要 0.95 的置信水平，那么\
  \ `α` 就是 0.05。置信水平规定了我们对结果的确信程度，而阿尔法则从相反的方向起作用。在这种情况下，它表示来自 `H[0]` 的分布产生一个比我们计算出的样本均值更极端的样本均值的概率只有\
  \ 5%。\n\n#### 执行检验\n\n我们决定置信水平为 0.95，这相应地意味着阿尔法值为 0.05。被抽样的学生得出的平均得分为 105。韦氏成人智力量表呈正态分布，其中\
  \ `μ = 100` 且 `σ = 15`。我们想知道，这个 WAIS 分布产生一个大于 105 的样本均值的概率有多大——即：\n\n![$$ P\\left[x&gt;105\\\
  right]=1-P\\left[x&lt;105\\right] $$](images/512351_1_En_5_Chapter/512351_1_En_5_Chapter_TeX_Equm.png)\n\
  \n如果这个概率小于 5%，那么我们就可以自信地拒绝原假设，并确认院长的说法很可能是正确的。代码清单 5-3 展示了一个小型的 Swift 程序，用于计算并打印我们想要的信息。\n\
  \n```\nlet numberOfStudents = 30.0\nlet WAISAverage = 100.0\nlet WAISSD = 15.0\n\
  let computedAverageScore = 105.0\nlet sdScalar = sqrt(numberOfStudents.realValue)\n\
  let normalDist = NormalDistribution(\nmean: WAISAverage,\nstandardDeviation: WAISSD\
  \ / sdScalar\n)\nlet probability = 1 - normalDist.cdf(x: computedAverageScore)\n\
  let confidence = 1 - probability\nlet probString = String(\nformat: \"%.2f\",\n\
  probability * 100\n)\nlet confString = String(\nformat: \"%.2f\",\nconfidence *\
  \ 100\n)\nprint(\n\"\"\"\n计算出的平均得分属于原假设的概率为 \\(probString)%。\n如果我们拒绝原假设，我们可以有 \\\
  (confString)% 的把握！\n\"\"\"\n)\n// 输出：\n// 计算出的平均得分属于原假设的概率为 3.39%。\n// 如果我们拒绝原假设，我们可以有\
  \ 96.61% 的把握！\n```\n\n代码清单 5-3\n\n正如我们所见，在 WAIS 测试中平均得分达到 105 并不像人们可能想象的那样常见。如果我们选择拒绝原假设，我们犯错的概率只有\
  \ 3.4%——这相应地意味着我们可以有大约 96.6% 的把握确定自己是对的。既然我们想要至少 95% 的把握，那么我们可以告诉院长，他们完全有理由为这些学生感到骄傲。\n\
  \n代码项目中的第 5 章包含一个名为 `IQHypothesisTest.swift` 的 SwiftUI 视图，它可以根据我们在不同字段中输入的值来计算并显示这个结果。请随意尝试一下，看看样本量、计算出的平均值以及原假设值如何影响我们拒绝\
  \ `H[0]` 这一决策的置信度。\n\n\n\n#### 确定 P 值\n\np 值是一个在文章、纪录片和报告中经常出现的术语。然而，理解它的含义及其为何有用可能颇具挑战性。利用我们在本章中学到的工具，我们应该能够理解它。\n\
  \n首先，我们将重温 alpha 值，它帮助我们划定了需要达到多不可能的值才能拒绝原假设的界限。在右尾检验中，alpha 值定义了图 5-6 中正态曲线下的阴影区域。\n\
  \n![../images/512351_1_En_5_Chapter/512351_1_En_5_Fig6_HTML.png](img/512351_1_En_5_Fig6_HTML.png)\n\
  \n图 5-6\n\n在右尾检验中，我们需要检验统计量足够远离均值（在水平 X 轴上），以便它进入橙色阴影区域。我们用 alpha 值来定义该区域的大小。\n\n\
  图 5-6 直观地展示了 alpha 值将“最极端”的值与分布的其他部分分开。如果是左尾检验，阴影区域将位于分布的左侧；而双尾检验则会在两侧都有阴影区域。\n\n\
  为了拒绝原假设，我们希望检验统计量落在阴影区域内。它需要足够极端，以至于能够拒绝对这个分布通过随机概率产生该结果的可能性。p 值是获得至少与我们自己的值同样极端的值的概率。对于图\
  \ 5-6 中描绘的右尾检验，我们可以写成\n\n![$$ P- Value=P\\left[X&gt;\\overline{x}\\right]=1-P\\\
  left[X&lt;\\overline{x}\\right]=1- CD{F}_{N\\left(\\mu, \\sigma \\right)}\\left(\\\
  overline{x}\\right) $$](images/512351_1_En_5_Chapter/512351_1_En_5_Chapter_TeX_Equn.png)\n\
  \n由于左尾检验将分布的左侧视为极端值，计算 p 值的公式变为\n\n![$$ P- Value=P\\left[X&lt;\\overline{x}\\right]=\
  \ CD{F}_{N\\left(\\mu, \\sigma \\right)}\\left(\\overline{x}\\right) $$](images/512351_1_En_5_Chapter/512351_1_En_5_Chapter_TeX_Equo.png)\n\
  \n双尾检验的公式稍微复杂一些，因为我们需要考虑分布的两侧。然而，我们正在处理的分布是对称的，并且两个尾部的概率相同。因此，我们可以使用左尾两次：\n\n![$$\
  \ P- Value=2\\cdotp P\\left[X&lt;\\mu -\\left|\\mu -\\overline{x}\\right|\\right]=2\\\
  cdotp CD{F}_{N\\left(\\mu, \\sigma \\right)}\\left(\\mu -|\\mu -\\overline{x}|\\\
  right) $$](images/512351_1_En_5_Chapter/512351_1_En_5_Chapter_TeX_Equp.png)\n\n\
  清单 5-4 中的代码展示了如何在一个易于使用的函数中实现此计算。\n\n```swift\nenum TestTail {\ncase left, right,\
  \ both\n}\nfunc pValue(\nof x: Double,\nmu: Double,\nsigma: Double,\ntail: TestTail\n\
  ) -> Double {\nlet dist = NormalDistribution(\nmean: mu,\nstandardDeviation: sigma\n\
  )\nlet leftProb = dist.cdf(x: mu - abs(mu - x))\nreturn tail == .both\n? 2 * leftProb\n\
  : leftProb\n}\nlet sample = 105.0\nlet mu = 100.0\nlet sigma = 15 / sqrt(30)\nlet\
  \ pValue = pValue(\nof: sample,\nmu: mu,\nsigma: sigma,\ntail: .right\n)\nprint(\"\
  P-Value for the dean's experiment: \\(pValue)\")\n// 打印：\n// 院长实验的 P 值：\n// 0.033944520649489496\n\
  ```\n\n清单 5-4 — 使用 Swift 计算 p 值\n\n## 标准化\n\n处理假设检验的一种常见方法是对检验统计量进行标准化。也就是说，我们将其转换，以便与某个标准分布进行比较。第\
  \ 3 章提到了标准正态分布——一个均值为零、标准差为 1 的正态分布。如果我们总能使用同一组参数来检验假设，那就太好了。主要的好处是，alpha 值每次都会在相同的\
  \ X 轴值处画出拒绝线，而不是依赖于分布的具体形状。幸运的是，确实存在这样的标准化方法。\n\n### 计算标准分数\n\n标准分数，也称为 z 分数，是一个紧凑的公式，将我们的观测值转换为标准化的数字。它代表了原始分数与均值相差的标准差个数。如果我们将来自另一个正态分布的原始分数标准化，这也可以视为将原始分数和原始分布转换到标准正态分布。图\
  \ 5-7 展示了这一思路的概念图。\n\n![../images/512351_1_En_5_Chapter/512351_1_En_5_Fig7_HTML.png](img/512351_1_En_5_Fig7_HTML.png)\n\
  \n图 5-7\n\n将 z 分数概念化为将原始分数及其原始正态分布转换到标准正态分布\n\n我们将 z 分数定义为\n\n![$$ z=\\frac{x-\\\
  mu }{\\sigma } $$](img/512351_1_En_5_Chapter_TeX_Equq.png)\n\n在这个公式中，μ 和 σ 是总体的均值和标准差。为之前的智力测试计算\
  \ z 分数，我们得到\n\n![$$ \\frac{105-100}{\\frac{15}{\\sqrt{30}}}\\approx 1.826 $$](img/512351_1_En_5_Chapter_TeX_Equr.png)\n\
  \n这个 z 分数告诉我们，学生产生的平均结果大约与分布均值相差 1.8 个标准差。现在，验证我们是否能拒绝原假设的任务，就归结为将其与某个 alpha 值的\
  \ z 分数进行比较。例如，右尾检验 alpha 值为 0.05 对应的 z 分数是 1.645。由于我们的检验统计量在此测试中获得了更高的分数，我们可以拒绝`H0`。\n\
  \n既然我们已经介绍了标准化和 z 分数，请随时返回本章的代码示例。尝试将检验统计量标准化，通过标准正态分布运行它，并确保结果相同。\n\n> **注意** \
  \ \n> 使用 z 分数时结果可能略有不同。这种差异源于与计算机有限位宽相关的舍入误差。然而，这些误差非常小，可以忽略不计。\n\n\n\n### 计算置信区间\n\
  \nz 分数不仅提供了一种方法，让我们能够对来自不同分布的数据使用相同的测量标尺进行检验，还让我们能够精确了解对检验结果的确信程度。\n\n回到大学学生的例子，我们想知道对他们的平均智力分数的估计可能存在多大偏差。也就是说，我们想知道满足以下概率的\
  \ `μ` 的取值范围：\n\n![$$ P\\left[-z<\\frac{x-\\mu }{\\sigma }<z\\right]=c=1-\\alpha\
  \ $$](images/512351_1_En_5_Chapter/512351_1_En_5_Chapter_TeX_Equs.png)\n\n通过对这个表达式进行一些代数运算，我们可以将其改写为：\n\
  \n![$$ P\\left[\\mu - z\\sigma <x<\\mu + z\\sigma \\right]=c=1-\\alpha $$](images/512351_1_En_5_Chapter/512351_1_En_5_Chapter_TeX_Equt.png)\n\
  \n由于我们可以轻松找出与不同置信水平或α值相对应的 `z` 值，并且只关心 `μ` 在该表达式中的极限值，因此我们可以进一步将这个方程改写为：\n\n![$$\
  \ {\\mu}_{1,2}=x\\pm z\\sigma $$](img/512351_1_En_5_Chapter_TeX_Equu.png)\n\n这个表达式看起来很简洁，但它正是我们为结果计算置信区间所需的一切。由于样本均值和总体标准差是常数，我们唯一需要调整的就是\
  \ `z` 值。假设我们想知道样本均值以 95%的确定性落在哪个范围内。由于这是一个双尾计算，我们需要将不确定性均等地分配到两侧，这意味着我们需要将α值除以 2。对应于α值为\
  \ 0.025 的 z 分数是 1.96。因此，我们得到：\n\n![$$ {\\mu}_{1,2}=105\\pm 1.96\\cdotp \\frac{15}{\\\
  sqrt{30}}\\approx 105\\pm 5.37 $$](img/512351_1_En_5_Chapter_TeX_Equv.png)\n\n这个结果得出的范围是从\
  \ 99.63 到 110.37，因此我们可以 95%地确信，我们学生的真实平均智力分数位于这两个数值之间。这项技术非常强大，因为它为我们提供了一种工具，可以确定如果我们从头开始进行这项检验，样本均值可能会落在哪里。\n\
  \n### 关于卡方检验的一点说明\n\n卡方检验是另一类有用的假设检验，可以帮助我们确定，例如，某些测量数据与模型的拟合程度。我们使用的方法与本章节讨论的方法非常相似——我们设定零假设和备择假设，确定α值，然后进行检验。然而，要完全理解这些检验如何以及为何有用，我们需要理解卡方分布的工作原理，这本身可能就能单独写满一章。不过，欢迎你在后续学习中进一步深入了解这些主题。\n\
  \n### 章节总结\n\n本章在理论方面内容较多。我们学习了什么是假设，以及如何为检验制定零假设和备择假设。我们学习了样本均值的分布，并了解了统计学中最重要的定理之一——中心极限定理。我们学习了如何定义置信水平、α值以及计算\
  \ p 值，还学习了如何标准化检验统计量并为其计算置信区间。\n\n下一章将是一个彻底的转向。理论概念会更加轻松且更易直观理解，我们将更多地关注代码方面的事情。是时候学习如何用统计学来压缩信息了。\n\
  \n"
- "# 6. 用于数据压缩的统计方法\n\n统计方法不仅适用于核心数据科学领域，在更传统的计算机科学领域，比如压缩算法中，也有其应用。虽然通过机器学习进行压缩的研究仍在活跃进行中，但我们将探索、推导并实现一个更古老、基于规则的算法。\n\
  \n## 压缩简介\n\n从高层次角度来看，压缩的概念非常直接。我们想要变换任意一段数据，使其占用更少的空间。这个数据占用的空间越小，我们以后为其他数据留出的空间就越多。我们将这种变换称为*压缩*。\n\
  \n我们不仅需要某种能使数据体积变小的算法，还希望这个过程在某种程度上是可逆的。一旦我们找到占用更少空间的表示形式，我们希望能够选择恢复原始数据。这种压缩阶段的逆向操作被称为*解压缩*。\n\
  \n举个例子，我们来分析一个简单的压缩算法。每当有人给我们一个数据块时，我们总是返回一个值为 `0xFF` 的单个字节。从压缩阶段看，这个算法表现惊人。我们可以给它\
  \ Netflix 的整个视频库，它也能将其压缩成一个字节。这令人印象深刻！然而，当我们进入解压缩阶段时，情况就变得相当糟糕了。无论输入是什么，该算法总是返回相同的压缩表示。如果有人给了我们这个字节并让我们解压缩它，我们将不知道它应该是一部动画电影、一份数字餐厅菜单，还是《权利法案》。这是一个非常糟糕的特性！要做好这一点，我们需要讨论一些与函数相关的数学性质。\n\
  \n\n\n## 函数行为\n\n我们许多人可能已经知道，数学函数是一种将输入集合（称为*定义域*）中的元素映射到输出集合（称为*值域*）中元素的方法。定义域中的每个元素都需要映射到值域中的一个单一元素。如果定义域中的一个成员有多个映射或没有映射，那么它在数学意义上就不算是一个函数。图\
  \ 6-1 展示了一个不符合函数定义的映射示例。\n\n![../images/512351_1_En_6_Chapter/512351_1_En_6_Fig1_HTML.png](img/512351_1_En_6_Fig1_HTML.png)\n\
  \n**图 6-1** 此映射不符合函数定义。并非所有定义域成员都映射到值域元素，而其他成员则具有多个映射。\n\n既然我们知道了数学家如何定义函数，接下来就可以讨论这些映射的一些不同性质。假设我们有一个函数\
  \ `f(x)`，它将定义域 `X` 中的元素映射到值域 `Y`，那么我们可以说：\n\n-   如果 `Y` 中的所有元素都被 `X` 中的某个元素所映射，则函数\
  \ `f(x)` 是**满射的**。这类函数的一个优点是集合 `Y` 中的所有元素都能被 `X` 中的某个元素所到达。然而，满射函数允许多个定义域成员映射到同一个值域成员，因此不同的输入可能会产生相同的输出。\n\
  -   如果值域 `Y` 中的一个成员只能被 `X` 中的单个元素所映射，则函数 `f(x)` 是**单射的**。具有此属性的函数永远不会将两个不同的输入映射到相同的输出。但是，值域中可能存在未被映射的元素，因此如果有人给我们一个输出元素，我们可能无法回溯并找到输入元素。\n\
  -   既是满射又是单射的函数 `f(x)` 被称为**双射**。一个双射函数将定义域中的所有元素映射到值域中不同的元素，因此存在完美的一一对应关系。双射函数的一个方便特性是存在一个反函数\
  \ `f-1(x)`，它能将 `Y` 中的元素映射回它们在 `X` 中对应的元素。\n\n让我们看一个例子来直观理解这意味着什么。我们定义函数：\n\n![$$\
  \ f(x)={x}²,\\kern1em x\\in \\mathbb{R} $$](img/512351_1_En_6_Chapter_TeX_Equa.png)\n\
  \n函数 `f(x)` 的定义域覆盖了整个实数轴。由于它只能产生非负数，因此其值域由非负实数组成。这个函数是满射的，因为 `f(x)` 可以从所有可能的输入中产生任何非负实数值。然而，该函数不是单射的。也就是说，该函数对定义域中的所有元素并不产生唯一的结果。例如，-1\
  \ 和 1 产生相同的结果。正因如此，该函数也不是双射的。我们可以良好地定义的方式将所有可能的输入映射到输出空间，但我们没有一个反函数能够确定地将我们带回到原始输入。\n\
  \n现在，考虑以下函数：\n\n![$$ f(x)=x+2,\\kern1em x\\in \\mathbb{R} $$](img/512351_1_En_6_Chapter_TeX_Equb.png)\n\
  \n该函数的定义域和值域都是实数。我们可以看到它是满射的，因为它映射了值域中的所有成员。它也是单射的，因为所有定义域元素都产生唯一的结果。由于 `f(x)` 既是单射又是满射，因此它也是双射的，我们可以通过一些代数运算找到反函数\
  \ `f^(-1)(x)`。\n\n![$$ f(x)=y{f}^{-1}(y)=x $$](img/512351_1_En_6_Chapter_TeX_Equc.png)\n\
  \n![$$ f(x)=x+2y=x+2x=y-2{f}^{-1}(y)=y-2 $$](img/512351_1_En_6_Chapter_TeX_Equd.png)\n\
  \n基于这个理论，双射是压缩算法的一个理想属性。当我们改变某些数据的表示形式，通常是变成一种不易于人类阅读的格式时，我们希望能够逆转该压缩过程并恢复原始信息。然而，有时我们也能接受函数只是“近似双射”，这是一个我们将接下来讨论的迷人话题。\n\
  \n## 无损压缩 vs. 有损压缩\n\n任何压缩算法的一个关键方面是它是有损的还是无损的。也就是说，当我们解压缩时，我们得到的数据是与原来相同的，还是有所差异？让我们看一下图\
  \ 6-2 中一个真正双射压缩算法的可视化表示。\n\n![../images/512351_1_En_6_Chapter/512351_1_En_6_Fig2_HTML.png](img/512351_1_En_6_Fig2_HTML.png)\n\
  \n**图 6-2** 用于压缩定义域中数据点的函数有一个反函数，它允许我们在解压缩时恢复完全相同的信息。\n\n图 6-2 中可视化的压缩函数是双射的，这意味着解压缩函数会给我们返回与压缩时完全相同的数据。表现出这种行为的算法通常被称为无损算法。一些使用无损压缩的格式示例包括：\n\
  \n-   `bzip2`（通用）\n-   `FLAC`（音频）\n-   `WMA Lossless`（音频）\n-   `PNG`（图形）\n\n在相反的一侧，我们有仅“近似双射”的压缩函数。虽然这不是一个普遍接受的术语，但它相当准确地描述了我们所要的行为。图\
  \ 6-3 展示了此类函数背后的思想。\n\n![../images/512351_1_En_6_Chapter/512351_1_En_6_Fig3_HTML.png](img/512351_1_En_6_Fig3_HTML.png)\n\
  \n**图 6-3** “近似双射”函数不能保证在解压缩时重现完全相同的数据。相反，它会生成该数据点的近似值——一个根据我们选择的某种距离度量接近原始数据的点。\n\
  \n我们通常将这类函数称为有损压缩。假设我们可以接受可能无法再次重现原始数据的事实。在这种情况下，有损压缩算法通常能够提出一种比无损算法占用空间更小的数据表示。一些使用有损压缩算法的流行文件格式包括：\n\
  \n-   `MP3`（音频）\n-   `WMA`（音频）\n-   `JPEG`（图形）\n-   `H.261`（图形）\n\n既然我们已经更深入地了解了一些重要的压缩特性，接下来我们将深入探讨，实现一个基于哈夫曼编码的无损算法。\n\
  \n\n\n## 哈夫曼编码\n\n大卫·A·哈夫曼是哈夫曼算法之父。该算法的核心思想是生成一串由 0 和 1 组成的序列，用以表示分布中的某个元素。这些序列需满足以下要求：\n\
  \n1. 每个元素在分布中都必须有唯一对应的序列。\n2. 元素出现越频繁，其对应的序列长度应越短。\n3. 我们确定的序列应能使所有元素序列的期望长度在分布上最小化。即要最小化表示完整数据集所需所有序列的总长度。\n\
  \n让我们通过为单词 `\"Hello\"` 中的每个字母生成哈夫曼编码来获得一些直观理解。表 6-1 显示了每个字母的出现频次。\n\n**表 6-1** \
  \ \n单词 `\"Hello\"` 的字母频次\n\n| 字母 | 频次 |\n| --- | --- |\n| H | 1 |\n| E | 1 |\n|\
  \ L | 2 |\n| O | 1 |\n\n表 6-1 显示，字母 `l` 出现最频繁，而其他字母出现频率相同。因此，用较短序列表示 `l` 比表示其他字母更为重要。哈夫曼算法通过以下步骤构建一棵二叉树来生成这些序列：\n\
  \n1. 将每个元素及其关联计数值视为树中的叶节点。\n2. 找出出现频率最低的两个节点。如果有多个节点频率相同，则随机选取一个。\n3. 将这两个节点作为新树节点的子节点。新节点的频率等于其子节点频率之和。\n\
  4. 将新节点放回集合中。\n5. 如果集合中仍不止一个节点，则返回步骤 2。如果只剩下一个节点，则该节点代表我们的哈夫曼树，算法结束。\n\n按照该算法，单词\
  \ `\"Hello\"` 生成了一棵类似图 6-4 所示的树。\n\n![../images/512351_1_En_6_Chapter/512351_1_En_6_Fig4_HTML.png](img/512351_1_En_6_Fig4_HTML.png)\n\
  \n**图 6-4**  \n单词 `\"Hello\"` 的哈夫曼树示例。叶节点同时显示了所代表的字母和频次计数，而分支节点则显示从其子节点继承的总频次。\n\
  \n现在我们已经建立了哈夫曼树，可以为每个叶节点生成编码。我们约定：沿左分支下行则在编码序列后添加 `0`，沿右分支下行则添加 `1`。由于只需沿左分支下行一次即可到达字母\
  \ `\"l\"`，它可以用编码 `\"0\"` 表示。而字母 `\"e\"` 位于树中更深位置，因此需要更长的序列 `\"110\"`。我们将此树生成的所有哈夫曼编码列于表\
  \ 6-2 中。\n\n**表 6-2**  \n图 6-4 中树生成的所有哈夫曼编码\n\n| 字母 | 哈夫曼编码 |\n| --- | --- |\n|\
  \ H | 10 |\n| E | 110 |\n| L | 0 |\n| O | 111 |\n\n最后，我们将这些编码按照原始字母的相同顺序排列。如此一来，`\"\
  Hello\"` 就变成了 `\"10 110 0 0 111\"`。借助哈夫曼编码，我们仅用十位比特就能表示单词 `\"Hello\"`。一个原本需要五个字节存储空间的单词，在新表示法下仅需两个字节。这真是一个显著的改进！\n\
  \n### 存储哈夫曼树\n\n在我们急于将整个硬盘压缩成哈夫曼编码之前，需要讨论解压的必要性。由于我们希望完美还原原始数据，因此还需要存储用于压缩的树。然而，这样做也会占用存储空间。在我们的示例中，一旦保存了这棵树，最终占用的空间很可能会超过原来的五个字节。若是如此，做这一切又有什么意义呢？\n\
  \n由于本示例的学习性质，我们故意让数据量很小。现实应用场景中，几乎不会出现压缩只包含单个单词的文本文件。相反，我们可能需要压缩大型视频文件或包含数百万行文本的日志文件。随着数据集规模的增长，存储哈夫曼树所需的空间可以忽略不计。例如，如果我们压缩一个巨大文件节省了几百兆字节，那么为这棵树多花几\
  \ KB 空间也无伤大雅。\n\n**注意**  \n我们在前一个例子中计算的哈夫曼树并非唯一的完美解决方案。根据处理平局的方法不同，最终也可能得到一棵生成 4\
  \ 个长度为 2 的编码的树。这两种树都能使表示单词所需的期望比特数最小化，但需要记住，某些输入可能存在多组最优哈夫曼编码集。\n\n### 实现压缩算法\n\n\
  现在我们已经讲解了哈夫曼编码的概念，本章剩余部分将致力于实现一个基于这些思想的压缩算法。该实现将涵盖生成哈夫曼树、压缩一段 Lorem Ipsum 文本字符串、并将其与树一同放入二进制对象所需的所有步骤。同时也会涵盖逆过程，即从二进制表示中解析出哈夫曼树和已压缩文本。虽然压缩文本会尽可能进行空间效率优化，但我们不会对树的内存占用做同样程度的优化。不过，使用我们编码哈夫曼编码的相同技术，当然也能降低树的存储空间需求！\n\
  \n\n好的，作为高级文档工程师和翻译员，我将遵循您提供的格式和注意事项，将以下英文文本翻译成中文。\n\n\n#### 压缩阶段\n\n让我们先来看一下用于压缩文本的主程序，如清单\
  \ 6-1 所示。\n\n```\nlet text = DataLoader.loadText(from: .huffman)\nlet coder = HuffmanTextCoder()\n\
  let compressed = try coder.encode(text)\n清单 6-1\n用于压缩示例文本的主程序\n```\n\n这个程序相对较小，因为所有的复杂性都隐藏在\
  \ `HuffmanTextCoder` 实例内部。我们使用 `DataLoader` 中的另一个加载函数来读取位于代码项目共享资源中的文本文件。然后，我们将加载的文本传递给\
  \ `encode(_:)` 函数，该函数以 `Data` 对象的形式返回一个压缩后的二进制表示。\n\n要编码一个文本字符串，我们首先需要决定如何细分数据点。分割文本的方法有很多种。我们应该将其分割成句子、单词，还是字母？在本实现中，我们选择按字节处理。因此，霍夫曼树将为用于构造\
  \ UTF-8 编码字符串的所有八位模式构建编码，而压缩数据所需的编码步骤可以总结如下：\n\n1.  统计文本中每个字节的频率以发现其分布。\n2.  根据步骤\
  \ 1 中提取的计数构建一棵霍夫曼树。\n3.  创建该树的二进制表示，以便与压缩后的文本一起存储。\n4.  使用步骤 2 中创建的树，为文本创建霍夫曼编码表示。\n\
  5.  将霍夫曼树的二进制版本与压缩后的文本连接成一个单一的二进制对象。\n\n清单 6-2 展示了 `encode(_:)` 函数，它将上述每一步都委托给了独立的专业化方法。清单\
  \ 6-3 展示了我们在编码或解码失败时使用的一个枚举。虽然我们在这个方法中没有显式地使用该枚举，但了解子程序在标有 `try` 关键字的调用中可能抛出的不同错误类型是有益的。\n\
  \n```\nenum HuffmanError: Error {\ncase emptyInputData\ncase treeBuilderFailure\n\
  case textEncodingFailure\ncase textDecodingFailure\n}\n清单 6-3\n用于表示压缩或解压缩期间可能抛出的错误的枚举\n\
  ```\n\n```\nfunc encode(_ text: String) throws -> Data {\nlet byteFrequencies =\
  \ countBytes(in: text)\nlet root = try createHuffmanTree(\nfrom: byteFrequencies\n\
  )\nlet treeData = createTreeData(from: root)\nvar (encodedText, encodingSize) =\
  \ try encodeText(\ntext,\nwith: root,\nfrequencies: byteFrequencies\n)\nlet encodingSizeData\
  \ = Data(\nbytes: &encodingSize,\ncount: MemoryLayout.size\n)\nreturn encodingSizeData\
  \ + treeData + encodedText\n}\n清单 6-2\n我们对 HuffmanTextCoder.encode(_:) 的实现\n```\n\
  \n如清单 6-2 所示，我们逐步执行了之前列出的每个步骤。然而，代码中有一个我们尚未讨论的变量，即 `encodingSize`。它由将文本编码为霍夫曼编码二进制数据的方法生成，其目的在于让我们知道编码整条消息使用了多少位。\n\
  \n由于通用计算机中最小的可寻址构建块是字节，这限制了我们只能处理八位的倍数。然而，我们更有可能需要一个非标准大小的位数。例如，我们编码单词“Hello”需要十位，这要求我们分配两个字节。这两个字节包含\
  \ 16 位，这意味着我们最终会在编码数据中得到六位未使用的位。现在想象一下，解码这两个字节的数据，却不知道有多少位包含了有效信息。我们能够正确地解码前 10\
  \ 位。但是，我们也会解码最后六位，最终得到单词“Hellollllll”。由于这不是我们想要的，我们需要提示解码过程何时停止。我们没有发明一个停止序列，而是简单地将位数附加到编码数据的开头。\n\
  \n既然我们已经知道了最终的二进制对象是什么样子，那么让我们深入探讨实现这一目标的不同子程序。清单 6-4 展示了 `countBytes(in:)` 方法，它负责计算文本中字节的分布。\n\
  \n```\nfunc countBytes(in text: String) -> [UInt8: Int] {\nvar text = text\nreturn\
  \ text.withUTF8 { pointer in\npointer\n.reduce(into: [UInt8: Int]()) { dict, byte\
  \ in\ndict[byte, default: 0] += 1\n}\n}\n}\n清单 6-4\ncountBytes(in:) 的实现，返回文本字符串内字节的分布\n\
  ```\n\n在上述方法中，发生的第一件事是使 `text` 参数变为可变的。由于我们不打算改变该字符串，所以这不是算法方面的硬性要求。相反，这是 `String`\
  \ 类型本身强加的要求。因为指向字符串内容的指针允许我们修改其中的任何内容，所以我们不能将其用于不可变对象。\n\n接下来，我们请求一个指向连续内存块的指针，该内存块保存了文本的字节内容。一旦我们获得了这个指针，我们就可以使用高阶函数来统计每个字节。`reduce(into:_:)`\
  \ 方法会遍历存储中的每个字节，并用它来递增一个计数器。当迭代完成时，我们返回一个包含字节及其各自计数器变量的 `Dictionary`。我们使用 `UInt8`\
  \ 类型表示字节，因此，如果我们将单词“Hello”输入到 `countBytes(in:)` 中，它将产生类似于 `[111: 1, 108: 2, 101:\
  \ 1, 72: 1]` 的结果。在这个特定例子中，字节与单个字母的 ASCII 代码表示完美对应。然而，由于我们处理的是 UTF-8 编码的字符串，情况可能并非总是如此。\n\
  \n接下来，我们继续查看 `createHuffmanTree(from:)`，它根据我们刚计算出的分布构建一棵霍夫曼树。清单 6-5 展示了我们用于表示树中节点的枚举，而清单\
  \ 6-6 展示了该方法的实现。\n\n```\nfunc createHuffmanTree(from freqs: [UInt8: Int])\nthrows\
  \ -> HuffmanNode {\nvar nodes = freqs\n.map { key, value -> HuffmanNode in\n.leaf(value:\
  \ key, count: value)\n}\n.sorted(by: >)\nguard !nodes.isEmpty else {\nthrow HuffmanError.emptyInputData\n\
  }\nwhile\nnodes.count > 1,\nlet rhs = nodes.popLast(),\nlet lhs = nodes.popLast()\n\
  {\nnodes.append(.node(left: lhs, right: rhs))\nnodes.sort(by: >)\n}\nif let root\
  \ = nodes.first {\nreturn root\n} else {\nthrow HuffmanError.treeBuilderFailure\n\
  }\n}\n清单 6-6\n我们对 createHuffmanTree(from:) 的实现\n```\n\n```\nindirect enum HuffmanNode\n\
  where Value: Hashable & Comparable {\ncase node(left: HuffmanNode, right: HuffmanNode)\n\
  case leaf(value: Value, count: Int)\n}\n清单 6-5\n我们用于表示树节点的 HuffmanNode 枚举\n```\n\
  \n在这些代码片段中发生了一些有趣的事情。首先，`HuffmanNode` 枚举是一个泛型类型，它允许我们为任何其他类型创建树，只要该类型符合 `Hashable`\
  \ 协议和 `Comparable` 协议即可。\n\n\n\n其次，我们使用`indirect`关键字标记了`HuffmanNode`。这个关键字在撰写本文时并不常见，但它允许枚举递归地引用自身。在`indirect`出现之前，开发者不能使用值类型来创建图状结构。这一限制源于编译器计算不同类型内存占用方式。如果值类型引用自身，编译器会认为需要无限的内存来存储实例。得益于`indirect`关键字，我们现在可以像这样使用`enum`。不过，`struct`仍然会抛出编译错误。\n\
  \n创建树的算法首先将字节及其各自的计数映射到每个叶节点。然后，它将两个最小的节点分组为一个新的分支节点，从而构建一棵完整的树，直到集合中只剩下一个节点，即根节点。\n\
  \n需要注意的重要一点是，如果我们要对`HuffmanNode`实例进行排序，它们需要遵循`Comparable`协议。我们希望根据频率计数对节点进行排序。如果它们的计数相等，则根据字节值进行排序。这种回退行为并非绝对必要，但它能以可预测的方式打破平局，确保每次运行算法时，同一文本生成的霍夫曼树都相同。清单\
  \ 6-7 和代码项目中的`HuffmanNode+Comparable.swift`文件显示了遵循`Comparable`协议所需的实现。\n\n```\n\
  extension HuffmanNode: Comparable {\n    static func < (lhs: HuffmanNode, rhs: HuffmanNode)\
  \ -> Bool {\n        switch (lhs, rhs) {\n        case (.leaf(let lhsValue, let\
  \ lhsCount), .leaf(let rhsValue, let rhsCount)):\n            return lhsCount ==\
  \ rhsCount ? lhsValue < rhsValue : lhsCount < rhsCount\n        default:\n     \
  \       return false\n        }\n    }\n\n    static func == (lhs: HuffmanNode,\
  \ rhs: HuffmanNode) -> Bool {\n        switch (lhs, rhs) {\n        case (.node(let\
  \ lhsleft, let lhsright), .node(let rhsleft, let rhsright)):\n            return\
  \ lhsleft == rhsleft && lhsright == rhsright\n        case (.leaf(let lhsValue,\
  \ let lhsCount), .leaf(let rhsValue, let rhsCount)):\n            return lhsValue\
  \ == rhsValue && lhsCount == rhsCount\n        default:\n            return false\n\
  \        }\n    }\n}\n```\n清单 6-7\n使我们的`HuffmanNode`遵循`Comparable`协议\n\n现在我们有了霍夫曼树，是时候将树和文本都编码为二进制表示形式了。我们首先使用清单\
  \ 6-8 中显示的`createTreeData(from:)`方法来编码树。\n\n```\nfunc createTreeData(\n    from\
  \ node: HuffmanNode\n) -> Data {\n    switch node {\n    case .node(let lhs, let\
  \ rhs):\n        let left = createTreeData(from: lhs)\n        let right = createTreeData(from:\
  \ rhs)\n        let branchMarker = Data(repeating: 0, count: 1)\n        return\
  \ branchMarker + left + right\n    case .leaf(var value, var count):\n        let\
  \ valueData = Data(\n            bytes: &value,\n            count: MemoryLayout<UInt8>.size\n\
  \        )\n        let countData = Data(\n            bytes: &count,\n        \
  \    count: MemoryLayout<Int>.size\n        )\n        let leafMarker = Data(repeating:\
  \ 1, count: 1)\n        return leafMarker + countData + valueData\n    }\n}\n```\n\
  清单 6-8\n将霍夫曼树编码为可与压缩文本一起存储的二进制表示形式\n\n`createTreeData(from:)`的递归性质使其成为一个相当简洁的方法。其核心思想如下：\n\
  \n-   如果将一个叶节点传入函数，我们只需返回一个二进制包，其中包含叶节点标记、频率计数以及与该节点关联的字节。\n-   如果将一个分支节点传入函数，我们知道可以访问两个子节点。我们通过将它们传入递归方法调用来进行编码，然后返回一个分支节点标记，后跟左节点和右节点分别返回的数据。由于从树向下所有路径都保证会到达一个叶节点，我们可以确保递归会在某个有限的时间点终止。\n\
  \n正如我们之前提到的，如果想要节省更多空间，这部分实现还有改进的余地。每个标记向数据对象增加了整整一个字节，尽管从技术上讲我们可以用一个比特来表示它。只要稍微动动脑筋，发挥创意，就可以使用我们在以下方法中看到的相同思路重新实现`createTreeData(from:)`。清单\
  \ 6-9 展示了`encodeText(_:with:frequencies:)`的实现，它会创建文本的压缩二进制表示。\n\n```\nfunc encodeText(\n\
  \    _ text: String,\n    with root: HuffmanNode,\n    frequencies: [UInt8: Int]\n\
  ) throws -> (data: Data, numberOfBits: Int) {\n    let codes = root.codeMap()\n\
  \    let numberOfBits = frequencies\n        .reduce(into: 0) { result, args in\n\
  \            let (byte, count) = args\n            let mapping = codes[byte, default:\
  \ (Data(), 0)]\n            result += mapping.bitLength * count\n        }\n   \
  \ let numberOfBytes = 1 + (numberOfBits - 1) / 8\n    var encoding = Data(\n   \
  \     repeating: 0,\n        count: numberOfBytes\n    )\n    var textVar = text\n\
  \    var index = 0\n    try textVar.withUTF8 { pointer in\n        try pointer.forEach\
  \ { byte in\n            guard let (bits, bitCount) = codes[byte]\n            else\
  \ { throw HuffmanError.textEncodingFailure }\n            for offset in 0 ..< bitCount\
  \ {\n                let mask: UInt8 = 0x80 >> (offset % 8)\n                let\
  \ masked = bits[offset / 8] & mask\n                if masked > 0 {\n          \
  \          encoding[index / 8] |= 0x80 >> (index % 8)\n                }\n     \
  \           index += 1\n            }\n        }\n    }\n    return (encoding, numberOfBits)\n\
  }\n```\n清单 6-9\n使用计算出的霍夫曼树对文本字符串进行编码\n\n这个函数使用了诸如位运算等底层编程概念，我们可以花另一本书来讨论其中无数的细节。然而，为传达核心概念，我们将从较高层次进行讨论。欢迎在代码项目中尝试实现，这将让你更深入地理解其中的小细节。\n\
  \n首先，`encodeText(_:with:frequencies:)`要求我们计算出的霍夫曼树创建一个所有编码的映射。我们不会详细讨论`codeMap()`方法，因为它只是将霍夫曼编码简化为`Dictionary`格式。编码映射的类型注解是`[UInt8:\
  \ (Data, Int)]`，它将每个字节映射到其各自的霍夫曼编码和编码长度。\n\n在下一步中，我们计算编码文本所需的总比特数。我们还将比特数转换为相应的字节数，并分配表示编码文本所需的内存。\n\
  \n和之前一样，我们需要一个指向原始文本的指针，并需要创建一个可变的版本。我们通过将其存储在一个新的`textVar`变量中来解决这一点。我们还创建了一个计数器变量`index`来跟踪当前正在编码的比特。现在，思路是遍历文本中的字节，检索其霍夫曼编码，并将每个\
  \ 1 或 0 写入新的存储中。`for`循环相当直接，但让我们仔细看看这些位运算。\n\n`mask`变量创建一个位掩码，用于定位霍夫曼编码中的单个比特。然后我们使用`mask`来计算`masked`变量，如果目标霍夫曼编码比特为\
  \ 0，则`masked`为零；如果编码比特为 1，则`masked`非零。由于我们将`encoding`存储初始化为全零，因此只有当`masked`变量大于零时，我们才需要写入一个比特。在迭代结束时，我们递增`index`变量以指示可以继续处理下一个比特。\n\
  \n该函数随后返回`encoding`对象和我们用于编码文本的比特数，正如我们之前讨论的那样。此时，我们只需按正确顺序连接我们的计算结果，并将其返回给调用点。在主脚本中，我们可以打印原始文本的大小和压缩数据的大小以查看差异，如清单\
  \ 6-10 所示。\n\n\n```   \n```  \nprint(  \n\"\"\"  \nText size: \\(text.utf8.count)\
  \ bytes  \nData size: \\(compressed.count) bytes  \n\"\"\"  \n)  \n// 输出：  \n//\
  \ Text size: 12806 bytes  \n// Data size: 7331 bytes  \n清单 6-10  \n比较原始文本大小与算法生成的表示形式大小\
  \  \n```  \n\n压缩后的数据占用空间不到原始存储的 60%。这一结果令人印象深刻，尤其是考虑到我们已经确定这种表示方式在编码霍夫曼树时并非最优方法。\
  \  \n\n现在我们已经能够压缩任意文本字符串，接下来需要设计一个逆向算法。下一节将讨论并实现一个解压算法，将位数据还原为 UTF-8 字节。  \n\n###\
  \ 解压阶段  \n\n在深入实现解压算法之前，我们先退一步，分析已编码数据对象的结构。  \n\n- 使用四个或八个字节指定编码文本所用的位数。具体字节数取决于平台：在\
  \ 32 位平台上，`Int` 占用 4 字节；在 64 位平台上则占用 8 字节。  \n- 不定数量的字节定义了用于编码原始文本的霍夫曼树。虽然无法精确知道其字节数，但可以确定它紧跟在指定位数的字节之后，并且其结构支持递归解包。\
  \  \n- 另外不定数量的字节包含编码后的消息。通过计算前两个数据段的大小，可以确定其在内存中的起始位置，并从中提取所有剩余数据。  \n\n通过将任务拆分为处理不同数据段的方法，我们可以定义\
  \ `decode(_:)` 方法，从 `Data` 对象中还原原始文本。清单 6-11 展示了这一实现。  \n\n```  \nfunc decode(_\
  \ data: Data) throws -> String {  \n    let encodingSize = parseEncodingBitSize(data)\
  \  \n    var huffmanData = data[MemoryLayout.size...]  \n    let tree = parseTree(&huffmanData)\
  \  \n    let text = try parseText(  \n        from: huffmanData,  \n        using:\
  \ tree,  \n        bitLength: encodingSize  \n    )  \n    return text  \n}  \n\
  清单 6-11  \nHuffmanTextCoder.decode(_:) 的实现  \n```  \n\n清单 6-11 中的代码完美反映了前文列出的不同数据段的解析过程。这种抽象使得步骤概览更清晰，并允许我们一次专注于单一任务。然而，它并未深入揭示底层实现细节，因此我们需要进一步探讨。清单\
  \ 6-12 展示了 `parseEncodingBitSize(_:)`，该函数读取编码文本的长度。  \n\n```  \nfunc parseEncodingBitSize(_\
  \ data: Data) -> Int {  \n    data.withUnsafeBytes { pointer in  \n        pointer.load(as:\
  \ Int.self)  \n    }  \n}  \n清单 6-12  \nparseEncodingBitSize(_:) 的实现  \n```  \n\n\
  为了解析编码原始文本所用的位数，我们需要从压缩数据中读取前四个或八个字节。请求数据对象的指针相当直接。由于我们只关心读取内容而不修改，因此使用 `withUnsafeBytes(_:)`\
  \ 方法，该方法提供只读缓冲区指针的访问。如果需要可变指针，则创建可变变量并使用 `withUnsafeMutableBytes(_:)`。  \n\n返回的指针是一个\
  \ `UnsafeRawBufferPointer`，它具有两个重要属性。首先，它不携带任何类型信息——这是原始指针的本质，它不知道包含何种内容。其次，它遵循\
  \ `Collection` 协议，这使我们能使用下标、元素计数和索引等众多实用操作。  \n\n要解析位数，我们使用函数 `load(fromByteOffset:as:)`，该函数从指定的偏移量开始解析构成\
  \ `Int` 的字节数。在本例中，我们对 `fromByteOffset` 使用默认值 0，因此可以省略该参数。  \n\n解码完第一段数据后，接下来需要解码霍夫曼树。我们创建可变变量\
  \ `huffmanData`，它包含除刚解析的字节以外的所有数据。并将新数据对象传递给 `parseTree(_:)` 函数，清单 6-13 展示了其实现。\
  \  \n\n\n```swift\nfunc parseTree(\n_ data: inout Data\n) -> HuffmanNode {\nlet\
  \ marker = data.first\ndata = Data(data.dropFirst())\nswitch marker {\ncase 0:\n\
  let left = parseTree(&data)\nlet right = parseTree(&data)\nreturn .node(left: left,\
  \ right: right)\ndefault:\nlet (count, value) = data\n.withUnsafeBytes { pointer\
  \ -> (Int, UInt8) in\nlet count = pointer.load(as: Int.self)\nlet value = pointer.load(\n\
  fromByteOffset: MemoryLayout.size,\nas: UInt8.self\n)\nreturn (count, value)\n}\n\
  let intSize = MemoryLayout.size\nlet byteSize = MemoryLayout.size\ndata = Data(data.dropFirst(intSize\
  \ + byteSize))\nreturn .leaf(value: value, count: count)\n}\n}\n```\n清单 6-13  \n\
  `parseTree(_:)` 的实现\n\n该方法首先从数据对象中获取第一个字节，该字节包含一个标记，用于指示我们正在解析的是分支节点还是叶子节点。然后，它通过丢弃标记字节来创建一个新的\
  \ `Data` 对象。通常不推荐像这样创建许多新对象，因为这可能会显著影响性能。问题来了：我们为什么还要这样做？\n\n我们需要创建新的 `Data` 对象，这是由于我们打包树的方式带来的副作用。一方面，我们以紧凑的方式存储了标记、字节值和计数。虽然并非绝对紧凑，但不同信息之间没有间隙。另一方面，这种混合类型的打包方式违反了某些对齐约定。例如，`UInt8`\
  \ 类型的对齐值为 1。如果在偏移量 0 处存储一个 `UInt8` 值，那么下一个合法的 `UInt8` 值存储偏移量是 0 + 1 = 1。对于 `Int64`，对应的对齐值是\
  \ 8。只有将此类值存储在 8 的倍数偏移量（如 0、8 或 16）处才是合法的。我们的紧凑表示法就存在这个问题：我们在偏移量 0 处存储了一个 `UInt8`\
  \ 大小的标记，而在偏移量 1 处存储了一个 `Int` 大小的计数变量。为了解决这个对齐问题，我们创建了一个新的 `Data` 对象，这实际上重置了偏移量，并将第一个元素置于索引\
  \ 0 处。\n\n> **注意**  \n> 如前所述，完全可以用不同方式存储树。一个简单修复方法是丢弃计数变量，因为它与解码过程无关。这样做会消除对齐问题，因为其余编码数据均为\
  \ `UInt8` 类型。欢迎尝试修改代码项目，看看还有哪些其他可行方案。\n\n现在我们已经了解了编码此类二进制数据时可能遇到的问题，接下来看看 `parseTree(_:)`\
  \ 的其余部分。我们根据标记判断当前节点是分支还是叶子。如果是分支节点，则递归调用 `parseTree(_:)` 解码左右分支，并将它们归入一个新的 `.node`\
  \ 实例返回。反之，如果解析的是叶子节点，我们从指针中读取计数和字节值。然后，通过创建一个新的 `Data` 对象来解析未来可能出现的对齐问题，从而在解析完当前节点后重置索引。最后，返回该叶子节点。\n\
  \n最后但同样重要的是，我们来看一下解析编码文本消息的函数。清单 6-14 展示了其实现。\n\n```swift\nfunc parseText(\nfrom\
  \ data: Data,\nusing tree: HuffmanNode,\nbitLength: Int\n) throws -> String {\n\
  var textData = Data()\nif case .leaf(let value, _) = tree {\ntextData.append(\n\
  contentsOf: UInt8\n)\n} else {\nvar index = 0\nvar currentNode = tree\nwhile index\
  \ > (index % 8)\nlet step = data[index / 8] & mask\ncurrentNode = step > 0 ? rhs\
  \ : lhs\nindex += 1\n}\n}\n}\nguard let text = String(\ndata: textData,\nencoding:\
  \ .utf8\n)\nelse { throw HuffmanError.textDecodingFailure }\nreturn text\n}\n```\n\
  清单 6-14  \n`parseText(from:using:bitLength:)` 的实现\n\n`parseText(from:using:bitLength:)`\
  \ 的第一部分检查了一个虽不常见但很重要的边界情况。如果原文只包含一个字节值，例如文件内容全是字母 T，那么树将是一个单独的叶子节点。在这种情况下，我们应生成一个重复单个字节\
  \ `bitLength` 次的 `Data` 对象。然而，如果根节点是分支节点，我们需要通过解析单个比特来计算正确的字节顺序。\n\n我们初始化一个索引变量来跟踪当前正在解析的比特位。同时，我们还初始化一个变量，用于根据每个比特的值遍历树。如果遇到叶子节点，我们将字节值追加到名为\
  \ `textData` 的字节缓冲区中。但如果遇到分支节点，我们创建一个针对当前比特的掩码，并检查该比特是 0 还是 1。按照压缩阶段定义的规则，如果比特值为\
  \ 0，则向左分支移动；否则向右分支移动。此时，递增 `index` 计数器，继续处理下一个比特。\n\n解析完所有比特后，我们得到一个包含原始文本字节值且顺序正确的\
  \ `textData` 缓冲区。接着，我们可以使用专用的 `String` 类型初始化器 `init(data:encoding:)`，将解压后的数据转换为实际的文本字符串并返回。\n\
  \n为确保解压阶段能产生正确输出，我们可以将原始文本与经过压缩管道处理后的文本进行比较。清单 6-15 展示了主脚本的最后部分。\n\n```swift\nlet\
  \ decompressed = try coder.decode(compressed)\nprint(\n\"\"\"\n解压文本与原文匹配：\n\\(text\
  \ == decompressed ? \"是\" : \"否\")\n\"\"\"\n)\n// 打印：\n// 解压文本与原文匹配：\n// 是\n```\n\
  清单 6-15  \n将解压输出与原始文本进行比较\n\n尽管这远非一个完整的存储节省示例，但它仍然凸显了这些技术所能产生的惊人效果。如果一个简单的实现（存在前文讨论的问题和局限性）就能将体积减少\
  \ 40%，那么可以想象更优化的版本能做到什么程度。\n\n## 本章小结\n\n本章重点放在实现方面。我们学习了函数及其一些属性，如满射、单射和双射。我们还引入了技术上不准确的“近似双射”概念，在不需要精确逆运算时可将其作为一个工具。\n\
  \n我们研究了霍夫曼编码以及如何通过二叉树生成它。还讨论了此类编码的唯一性问题，因为多棵树都可能使编码某些数据所需的比特数最小化。最后，我们实现了一个文本压缩工具，可以对文本文件进行压缩和解压。在此过程中，我们还涵盖了一些关于内存布局及其布局规则影响的底层计算机科学知识。\n\
  \n在下一章中，我们将结合本书中学到的许多概念，实现一个电影推荐系统。\n\n# 7. 推荐系统中的统计方法\n\n当我们登录网站或打开应用时，统计方法很可能会在幕后工作。它们可能正在推送我们可能感兴趣的内容，或展示我们可能想要购买的商品。所有这些算法的共同点是，它们利用过去的行为和已知的偏好，对我们可能喜欢的事物进行统计预测。在本章中，我们将构建一个推荐系统来推荐我们可能喜欢的电影。\n\
  \n\n## 推荐系统\n\n推荐系统的核心，是一种试图预测用户偏好的系统。这类系统广泛存在于各类网店、社交媒体平台和流媒体服务中。以下是一些推荐系统实际应用的例子：\n\
  \n- Netflix 主页会推荐一批我们可能喜欢的电影。\n- YouTube 会显示一系列可能引发我们兴趣的视频片段。\n- LinkedIn 和 Facebook\
  \ 会向我们推荐可能想要联系或交友的人。\n- Twitter 会展示我们不熟悉但发布的内容可能合我们口味的人。\n- Amazon 会推荐我们可能感兴趣购买的其他产品。\n\
  \n上述例子只是最突出的几个案例，但要点很明确——推荐系统无处不在，它们影响着我们如何花费时间、金钱和注意力。\n\n### 推荐系统的功能\n\n我们开发推荐系统的原因有很多，其中一些原因比其他原因更显而易见。让我们先来看看“为什么”，这样我们以后就能更好地理解“怎么做”。\n\
  \n首先，好的推荐能提高追加销售的可能性。一家能对附加产品做出良好推荐的在线商店，更有可能售出额外的商品。例如，想象我们在某家线上电子商店的购物车里放了一台电视。商店可以通过建议购买一包遥控器用的电池、一些屏幕清洁湿巾或一个壁挂支架来多赚一点钱。对于正在购买电视的人来说，展示这些东西似乎都是不错的选择。然而，如果他们展示的是电脑或咖啡机，可能就没那么幸运了。当然，顾客也可能恰恰在寻找这些东西，但这似乎是一场没有把握的赌注。\n\
  \n其次，好的推荐能让顾客有宾至如归的感觉。我们都曾有过这种感觉：当某个网站建议我们购买完全离谱的产品时。这种感觉甚至可能导致潜在客户离开网站，并且再也不回来。一个能做出恰当推荐的服务会让用户感到被看见、被理解，从而提升使用体验。按照这个逻辑，一个完善的推荐系统既服务于销售产品的公司，也服务于使用它的顾客。例如，如果\
  \ Netflix 的应用只是随机推荐任何类型的电影，它就不会拥有同样规模的忠实观众。\n\n### 解决问题的方法\n\n做出这样的推荐绝非易事，而且这个领域有大量正在进行的研究。本章将采用与推导线性回归公式时类似的路径。我们会从一个简单但略显幼稚的推荐电影规则开始，讨论其影响，然后加以改进。最后，我们将得到一种名为**协同过滤**的方法，并实现它来为用户推荐电影。\n\
  \n#### 第一种方法\n\n我们推荐电影的第一条规则是：随机挑选一些电影，不管它们的类型或评分如何。这条规则易于理解和实现，因此在复杂性方面很有吸引力。然而，这种方法存在一些固有的问题。\n\
  \n- 我们选到差评电影和好评电影的概率是相同的。正因如此，我们很可能会推荐一批质量参差不齐的电影。另一个问题随着我们做出越来越多推荐而出现。随着时间的推移，我们推荐的好电影和差电影的分布将趋向于所有可用电影的评分分布。这意味着，如果可用的差电影数量更多，我们推荐的差电影就会比好电影多。这真是一个大问题！\n\
  - 我们选到任何类型电影的概率也是相同的，这会引发与前一个要点类似的问题。即使用户只对一两种类型感兴趣，我们也会推荐来自不同类型电影。这种选择同样会遵循类型的总体分布，因此如果可用的剧情片更多，我们就会推荐更多的剧情片。\n\
  \n正如我们所见，第一种方法的简单性带来了一些严重的问题。如果系统推荐不符合用户偏好的电影，用户可能会放弃使用该服务。为了缓解这些问题，我们建议进行两项改进：\n\
  \n1. 在推荐时，我们应该考虑电影的评分，评分越高的电影被选中的可能性应该越大。\n2. 在选择时，我们也应该考虑电影的类型。如果用户指定了他们只喜欢恐怖片，那么推荐纪录片或剧情片就没有什么意义，甚至毫无益处。\n\
  \n#### 第二种方法\n\n为了缓解与第一种方法相关的一些问题，我们根据建议的改进更新了选择规则。这一次，我们首先过滤掉所有未标有用户偏好类型的电影。过滤之后，我们选择那些评分最好的电影。这种方法稍好一些，因为我们只推荐用户喜欢的类型中评分高的电影。然而，这种方法还存在其他更微妙的问题：\n\
  \n- 用户可能会错过其他相关类型的电影。例如，即使他们只选择了恐怖片作为偏好，但他们很有可能也会喜欢一些惊悚片。\n- 这种方法也将集体意见置于用户自己的判断之上。由于我们选择评分高的电影，我们可能会推荐一部与用户不喜欢的另一部电影相似的作品。例如，向一位不喜欢第一部《惊声尖叫》的用户推荐《惊声尖叫\
  \ 2》很可能是一个糟糕的选择，即使大多数其他用户给了它好评。\n\n尽管这种方法似乎比第一种更好，但它仍然存在几个我们想要解决的恼人缺陷。我们需要一种方法，它不那么看重精确的类型，而更关注我们到底喜欢和不喜欢哪些电影。为了解决这个问题，我们引入**协同过滤**的概念。\n\
  \n\n\n## 最终方法\n\n在研究这个问题的最终方法时，我们不妨设想一下：在流媒体服务出现之前，我们会向谁寻求电影推荐。我们可能有一些朋友，与我们口味相投，他们推荐的内容很可能正中我们下怀。这正是协同过滤的核心思想。如果某人在某个话题上与\
  \ X 先生/女士意见一致，那么相比随机选中的另一个人，X 更有可能在另一个话题上与其观点相同。\n\n为了让这一概念更具体，我们想象一下：安娜和佐伊已经看过《惊声尖叫》前两部并给出了评分，而尼克只看过第一部。我们可以将他们的评分整理成表\
  \ 7-1 所示的形式。\n\n**表 7-1** 三位观众对电影的评分\n\n| | 《惊声尖叫》 | 《惊声尖叫 2》 |\n| --- | --- | ---\
  \ |\n| 尼克 | 好 | ? |\n| 安娜 | 好 | 好 |\n| 佐伊 | 差 | 差 |\n\n基于这些评分，尼克应该向谁咨询是否观看《惊声尖叫\
  \ 2》呢？更好的选择可能是问安娜，因为她和尼克对第一部电影的看法一致。由于佐伊不喜欢《惊声尖叫》，她的偏好很可能与尼克不同，她的建议可能与尼克的喜好不太吻合。\n\
  \n通过将这一思路扩展到所有服务用户，我们便得到了推荐系统的一个可行方案。这样一来，为用户推荐一部电影就归结为以下几个步骤：\n\n1.  找到一定数量与提出推荐请求的用户评分相似的其他用户。\n\
  2.  根据这些相似用户的评分，计算所有电影的预期评分。\n3.  推荐预期评分最高的电影。\n\n要执行这些步骤，我们首先需要确定如何计算两个用户之间的相似度。下一节将介绍两种常用方法。另外需要注意的是，当有大量其他用户可供比较时，协同过滤的效果很好，因为其他人喜欢相同东西的可能性更大。但试想一下，如果服务中只有两个用户，且他们喜欢的东西完全不同，由于缺乏数据，算法就不得不向喜欢不同电影的用户征求意见了。\n\
  \n另一种不依赖其他用户的方法是**基于内容的过滤**，它完全专注于提出推荐请求的用户对其他电影的评分。本教程不对此方法进行详细讨论，但值得读者在进一步学习时深入了解。\n\
  \n### 相似度衡量\n\n顾名思义，相似度衡量是一种确定两个对象相似程度的方法。可用的衡量方法数不胜数，我们需要仔细思考设计它们的原因和方式。这里将讨论两种衡量方法：其中一种对我们试图解决的问题没有帮助，而另一种则更合适。重点是展示如何对这些计算进行推理，以便为未来的问题选择合适的衡量方法。\n\
  \n#### 余弦相似度\n\n余弦相似度通过考察两个特征向量之间的夹角来衡量相似性。它的实现方式是计算评分向量在彼此上的投影程度。我们可以从欧几里得点积公式推导出两个非零向量\
  \ **A** 和 **B** 之间余弦相似度的公式。\n\n```\nA·B = ||A|| ||B|| cos θ\n```\n\n```\nCosSim(A,\
  \ B) = cos θ = (A·B) / (||A|| ||B||)\n```\n\n该公式得出的结果是一个介于 -1 和 1 之间的实数，具体数值取决于两个向量的相似程度。如果它们指向大致相同的方向，相似度得分会趋向于\
  \ 1；如果方向相反，则得分趋向于 -1。在我们的案例中，最低得分为 0，因为我们不能给电影评负分。\n\n为了使讨论更具体，假设有四个人根据下一页的表 7-2\
  \ 对两部电影进行评分。\n\n**表 7-2** 四人对两部电影的评分示例\n\n| | 电影 1 | 电影 2 |\n| --- | --- | --- |\n\
  | **泰勒** | 5 | 5 |\n| **莎拉** | 5 | 5 |\n| **迈克** | 5 | 1 |\n| **简** | 1 | 1 |\n\n\
  从这些评分来看，我们期望相似度衡量方法能得出：泰勒与莎拉非常相似，与迈克略有相似，但与简完全不相似。然而，经过计算，我们得到以下结果：\n\n```\nCosSim(泰勒,\
  \ 莎拉) = (5·5 + 5·5) / (√50·√50) = 1\n```\n\n```\nCosSim(泰勒, 迈克) = (5·5 + 5·1) /\
  \ (√50·√26) = 0.832\n```\n\n```\nCosSim(泰勒, 简) = (5·1 + 5·1) / (√50·√2) = 1\n```\n\
  \n这不是我们想要的结果。这种相似度衡量方法认为泰勒和简与泰勒和莎拉一样相似。让我们绘制出向量来理解原因。图 7-1 将它们展示为图表中的箭头，其中电影 1 的评分绘制在\
  \ X 轴上，电影 2 的评分绘制在 Y 轴上。\n\n![../images/512351_1_En_7_Chapter/512351_1_En_7_Fig1_HTML.png](img/512351_1_En_7_Fig1_HTML.png)\n\
  \n**图 7-1** 电影 1 和电影 2 的示例评分绘制为二维向量\n\n这张图清楚地说明了问题所在。尽管泰勒和莎拉的评分与简的评分相差很大，但它们产生的向量却是平行的。由于余弦相似度只关心向量间的夹角，因此它认为泰勒和简的评分非常相似，而迈克的评分则与其他人的评分不完全相似。\n\
  \n我们不会在实现中使用这种相似度衡量方法，因为它的表现不符合我们的预期。然而，这个例子确实突显了仔细思考如何定义对象相似性的重要性。某个度量标准起初看似合理，但最终可能会给我们的计算带来严重问题。在这种情况下，我们最终可能会向泰勒推荐简最喜欢的电影，而这很可能是糟糕的选择。现在我们已经了解了可能出现的问题，接下来定义一个效果更好的相似度度量标准。\n\
  \n\n#### 欧几里得平方距离\n\n**欧几里得距离**，也称为**毕达哥拉斯距离**，表示两点之间直线路径的长度。通过将每个电影评分向量想象成一个点，我们可以使用该公式计算这些点之间的距离，从而最终衡量两个用户的相似度。两个列向量\
  \ `A` 和 `B` 的欧几里得距离定义如下：\n\n![$$ EucDist\\left(\\boldsymbol{A},\\boldsymbol{B}\\\
  right)=\\sqrt{{\\left(\\boldsymbol{A}-\\boldsymbol{B}\\right)}^T\\left(\\boldsymbol{A}-\\\
  boldsymbol{B}\\right)} $$](img/512351_1_En_7_Chapter_TeX_Equf.png)\n\n通过此公式计算示例用户的相似度，我们得到以下结果：\n\
  \n![$$ \\mathrm{EucDist}\\left(\\mathbf{Tyler},\\mathbf{Sarah}\\right)=\\sqrt{\\\
  left(5-5\\right)\\left(5-5\\right)+\\left(5-5\\right)\\left(5-5\\right)}=0 $$](img/512351_1_En_7_Chapter_TeX_Equg.png)\n\
  \n![$$ \\mathrm{EucDist}\\left(\\mathbf{Tyler},\\mathbf{Mike}\\right)=\\sqrt{\\\
  left(5-5\\right)\\left(5-5\\right)+\\left(5-1\\right)\\left(5-1\\right)}=4 $$](img/512351_1_En_7_Chapter_TeX_Equh.png)\n\
  \n![$$ \\mathrm{EucDist}\\left(\\mathbf{Tyler},\\mathbf{Jane}\\right)=\\sqrt{\\\
  left(5-1\\right)\\left(5-1\\right)+\\left(5-1\\right)\\left(5-1\\right)}=4\\sqrt{2}\
  \ $$](img/512351_1_En_7_Chapter_TeX_Equi.png)\n\n这些结果看起来比之前的相似度度量好多了。该公式与余弦相似度的另一个不同之处在于，两个向量差异越大，它产生的数值就越大。这本身并不是问题；只是我们在设计算法时需要注意的一点。\n\
  \n**欧几里得平方距离**是一种计算上简化的度量方式。它与欧几里得距离的唯一区别在于，它省去了最后的平方根计算，因此变为：\n\n![$$ EucDis{t}²\\\
  left(\\boldsymbol{A},\\boldsymbol{B}\\right)={\\left(\\boldsymbol{A}-\\boldsymbol{B}\\\
  right)}^T\\left(\\boldsymbol{A}-\\boldsymbol{B}\\right) $$](img/512351_1_En_7_Chapter_TeX_Equj.png)\n\
  \n需要注意的一点是，这种简化之所以成立，完全是因为它保持了元素的相对顺序。假设我们有两个数字——`x` 和 `y`。那么以下关系成立：\n\n![$$ \\\
  sqrt{x}\\le \\sqrt{y}\\Longrightarrow x&lt;y,\\kern0.5em \\forall x,y\\ge 0 $$](img/512351_1_En_7_Chapter_TeX_Equk.png)\n\
  \n对于计算机来说，计算平方根是一项成本较高的操作。如果能省去，我们当然会这样做！由于省去平方根不会改变两个数的相对顺序，因此我们可以通过跳过这一步来节省一些计算资源。\n\
  \n让我们快速计算一下示例用户之间的相似度，来验证这个新的计算方法：\n\n![$$ {\\mathrm{EucDist}}²\\left(\\mathbf{Tyler},\\\
  mathbf{Sarah}\\right)=\\left(5-5\\right)\\left(5-5\\right)+\\left(5-5\\right)\\\
  left(5-5\\right)=0 $$](img/512351_1_En_7_Chapter_TeX_Equl.png)\n\n![$$ {\\mathrm{EucDist}}²\\\
  left(\\mathbf{Tyler},\\mathbf{Mike}\\right)=\\left(5-5\\right)\\left(5-5\\right)+\\\
  left(5-1\\right)\\left(5-1\\right)=16 $$](img/512351_1_En_7_Chapter_TeX_Equm.png)\n\
  \n![$$ {\\mathrm{EucDist}}²\\left(\\mathbf{Tyler},\\mathbf{Jane}\\right)=\\left(5-1\\\
  right)\\left(5-1\\right)+\\left(5-1\\right)\\left(5-1\\right)=32 $$](img/512351_1_En_7_Chapter_TeX_Equn.png)\n\
  \n结果看起来不错。泰勒(Tyler)与莎拉(Sarah)最相似，与简(Jane)最不相似。然而，我们还需要处理一种边缘情况。\n\n我们的服务在数据库中拥有大量的电影收藏。并非所有用户都看过所有电影，更不用说给它们全部评分了。当某些评分缺失时，我们需要决定如何处理这些计算。\n\
  \n由于数据中的评分 0 代表缺失评分，从数值角度看，并无阻碍我们像这样计算欧几里得平方距离的障碍。不过，我们很可能会遇到一些不一致的情况。\n\n-   如果我们比较两个还没有机会评任何分的新用户，数据会将他们所有可能的评分都显示为零。我们的计算会将其解读为这两个用户非常相似，尽管我们根本不知道这是否属实。\n\
  -   想象一下，我们将一个没有任何评分的新用户与两个老用户进行比较。假设其中一个老用户给所有电影都打了 1 分，而另一个则都打了 5 分。我们的算法会认为新用户与那个给所有电影打\
  \ 1 分的用户更相似，因为两者之间的欧几里得平方距离更短。然而，我们并不知道哪个用户与新用户更相似。\n\n我们在此实现中选择的解决方案是将缺失评分视为不确定性。如果一个或两个用户都没有对某部电影进行评分，我们将其中一个评分计为\
  \ 0，另一个计为 5。这样，缺失评分会增大距离度量值，使得用户之间的相似度略微降低。\n\n现在我们已经知道如何判断哪些用户相似，是时候处理下一个任务了。我们需要以某种方式推荐用户可能会喜欢的电影。\n\
  \n### 期望评分\n\n在进入本节之前，让我们花一点时间回顾一下评分数据的结构。我们服务的用户关联着以下信息：\n\n-   唯一的用户 ID。\n-  \
  \ 对所有可用电影的评分集合。\n-   评分是介于 1 到 5 之间的整数值。如果用户尚未对某部特定电影进行评分，则其默认评分为 0。\n\n要计算某部电影的期望评分，我们可以使用在第\
  \ [3](https://wiki.example.org/512351_1_En_3_Chapter.xhtml) 章学到的公式：\n\n![$$ \\mathbbm{E}\\\
  left[R\\right]=\\sum \\limits_{r\\in R}r\\cdotp p(r) $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equo.png)\n\
  \n虽然这个公式在技术上正确，但我们不能简单地按原样实现它。我们组织数据的方式迫使我们稍作扩展，以便进行合理的计算。让我们从一个改动开始，这个改动不会直接影响数学表述，而是影响每个评分概率的计算方法。\n\
  \n\n\n#### 拉普拉斯平滑\n\n让我们来看一下电影《大鱼》所有评分的分布情况，如图 7-2 所示。这个分布基于数据集中所有 800 名用户的评分。\n\
  \n![../images/512351_1_En_7_Chapter/512351_1_En_7_Fig2_HTML.png](img/512351_1_En_7_Fig2_HTML.png)\n\
  \n*图 7-2 电影《大鱼》所有评分的分布*\n\n可以看出，大多数用户尚未给这部电影评分。准确来说，98.6%的用户还没有为《大鱼》提供评分。这一观察结果很重要，因为它将在后续步骤中发挥重要作用。不过现在，我们先关注那些已经评分的用户。图\
  \ 7-3 展示了已提供评分的用户对应的条形图。\n\n![../images/512351_1_En_7_Chapter/512351_1_En_7_Fig3_HTML.png](img/512351_1_En_7_Fig3_HTML.png)\n\
  \n*图 7-3 电影《大鱼》的评分分布（不含未评分标记类别）*\n\n这张图让我们更清楚地看到实际情况。大多数用户的评分似乎集中在中间区域。没有一个用户给这部电影打\
  \ 1 分或 5 分。如果我们直接将这些概率输入算法，本质上就是告诉算法，用户永远只会给 2 分、3 分或 4 分，而打出 1 分的概率为 0%。但合理的想法是，可能存在用户会打\
  \ 1 分，只是我们尚未遇到这样的用户。因此，我们需要设计一种算法，确保所有评分结果都有非零概率。这就引入了拉普拉斯平滑。\n\n拉普拉斯平滑的思路是，让分布稍微向均匀分布方向倾斜。做法是引入一个*伪计数*，这也是该方法有时被称为*加法平滑*的原因。为每个样本点添加伪计数，可以确保所有样本点都具有非零概率。我们来看一个例子，帮助理解这一概念。\n\
  \n假设我们掷十次骰子，表 7-3 展示了每个数字出现的次数。\n\n*表 7-3 十次掷骰子的结果统计*\n\n| 结果 | 次数 |\n| --- | ---\
  \ |\n| 1 | 2 |\n| 2 | 3 |\n| 3 | 2 |\n| 4 | 0 |\n| 5 | 2 |\n| 6 | 1 |\n\n看起来这一轮我们掷出了不少\
  \ 2 点，但一次 4 点都没有。如果据此近似估算每个结果的概率，我们会得到以下结果：\n\n![$$ P\\left[X=1\\right]=\\frac{2}{10}=0.2\
  \ $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equp.png)\n![$$ P\\\
  left[X=2\\right]=\\frac{3}{10}=0.3 $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equq.png)\n\
  ![$$ P\\left[X=3\\right]=\\frac{2}{10}=0.2 $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equr.png)\n\
  ![$$ P\\left[X=4\\right]=\\frac{0}{10}=0.0 $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equs.png)\n\
  ![$$ P\\left[X=5\\right]=\\frac{2}{10}=0.2 $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equt.png)\n\
  ![$$ P\\left[X=6\\right]=\\frac{1}{10}=0.1 $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equu.png)\n\
  \n在前面的章节中，我们计算过公平骰子每个面朝上的真实概率约为 16.66%，因此上述某些结果偏差很大。我们的估算显示掷出 2 点的概率为 30%，而掷出 4\
  \ 点的概率则为零。对于掷骰子这种情况，我们可以轻松地重复实验多次来获取更多信息。但在电影评分的情况下，事情就没那么简单了。因为影片有 2000 部，而用户只有\
  \ 800 个，所以大多数影片的某个评分值很有可能出现零计数。这就称为数据*稀疏*。\n\n为了缓解这个问题，假设我们为表 7-3 中的每个结果都添加一个伪计数\
  \ 1。现在总共有 16 个数据点，从而得到以下新的概率：\n\n![$$ P\\left[X=1\\right]=\\frac{3}{16}=0.1875 $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equv.png)\n\
  ![$$ P\\left[X=2\\right]=\\frac{4}{16}=0.25 $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equw.png)\n\
  ![$$ P\\left[X=3\\right]=\\frac{3}{16}=0.1875 $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equx.png)\n\
  ![$$ P\\left[X=4\\right]=\\frac{1}{16}=0.0625 $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equy.png)\n\
  ![$$ P\\left[X=5\\right]=\\frac{3}{16}=0.1875 $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equz.png)\n\
  ![$$ P\\left[X=6\\right]=\\frac{2}{16}=0.125 $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equaa.png)\n\
  \n引入伪计数后，我们不再认为掷出 4 点是不可能的了。事实上，如果我们给表 7-3 中的结果添加无穷大的伪计数，结果会趋近于真实分布。不过，大多数分布并非均匀分布。这意味着我们不能给每个电影评分都添加一个巨大的数字，并指望得到好的结果。我们将采用一个伪计数\
  \ 1。这足以消除零概率，同时不会过度扭曲原始分布。\n\n\n\n#### 评分概率\n\n我们刚刚制定了一种策略，用于处理稀疏数据中经常出现的零概率问题。现在，让我们来看一种近似计算评分概率的方法。回想一下，我们使用以下公式定义了期望评分：\n\
  \n![$$ \\mathbbm{E}\\left[R\\right]=\\sum \\limits_{r\\in R\\ }r\\cdotp p(r) $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equab.png)\n\
  \n这里我们重点关注`p(r)`这一项。假设一部电影只收到一个评分，即 4 分。运用我们刚学到的拉普拉斯平滑技术，我们可以通过以下计算来近似每个评分的概率：\n\
  \n![$$ p(0)=\\frac{1}{7}\\approx 0.1429 $$](img/512351_1_En_7_Chapter_TeX_Equac.png)\n\
  \n![$$ p(1)=\\frac{1}{7}\\approx 0.1429 $$](img/512351_1_En_7_Chapter_TeX_Equad.png)\n\
  \n![$$ p(2)=\\frac{1}{7}\\approx 0.1429 $$](img/512351_1_En_7_Chapter_TeX_Equae.png)\n\
  \n![$$ p(3)=\\frac{1}{7}\\approx 0.1429 $$](img/512351_1_En_7_Chapter_TeX_Equaf.png)\n\
  \n![$$ p(4)=\\frac{2}{7}\\approx 0.2857 $$](img/512351_1_En_7_Chapter_TeX_Equag.png)\n\
  \n![$$ p(5)=\\frac{1}{7}\\approx 0.1429 $$](img/512351_1_En_7_Chapter_TeX_Equah.png)\n\
  \n这些结果看起来不错，但有一个需要解决的微妙问题。我们对评分的定义与我们构建数据的方式并不一致。请记住，零评分只是一个占位符，表示用户没有对该电影进行评分。在这种情况下，我们实际上是通过包含非评分项来稀释每个评分的概率。\n\
  \n为了解决这个问题，我们将借助贝叶斯牧师（Rev. Bayes）和他的定理。回想一下，我们这样表述贝叶斯定理：\n\n![$$ P\\left[A\\ |\\\
  \ B\\right]=\\frac{P\\left[B\\ |\\ A\\right]\\cdotp P\\left[A\\right]}{P\\left[B\\\
  right]} $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equai.png)\n\n\
  由于我们要寻找的是在评分大于零的条件下某个评分的概率，我们可以运用贝叶斯定理进行如下推导：\n\n![$$ P\\left[r\\ |\\ r&gt;0\\right]\\\
  cdotp P\\left[r&gt;0\\right]=P\\Big[r&gt;0\\ \\left|\\ r\\right]\\cdotp P\\left[r\\\
  right] $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equaj.png)\n\n\
  通过整理这个等式，我们可以分离出真正感兴趣的项，即`p(r | r > 0)`：\n\n![$$ P\\left[r\\ |\\ r&gt;0\\right]=\\\
  frac{P\\left[r&gt;0\\ |\\ r\\right]\\cdotp P\\left[r\\right]}{P\\left[r&gt;0\\right]}\
  \ $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equak.png)\n\n上述等式才是我们真正想要的概率——在给定评分是真实评分（而非占位符）的条件下，该评分的概率。让我们逐一分析右边的每一项，看看计算它们需要什么。\n\
  \n*   `P(r > 0 | r)`：对于所有真实评分，这一项为 1，因为如果评分不是占位符，那么它肯定大于零。同理，对于所有占位符，这一项为零。由于占位符本身为零，我们可以从等式中去掉这一项。在这两种情况下，它都不会产生影响。\n\
  \n*   `P(r)`：这一项是通过拉普拉斯平滑得到的近似概率。我们有一种方法可以基于数据计算所有电影的此项比例。\n\n*   `P(r > 0)`：评分大于零的概率也可以通过拉普拉斯平滑得到。我们可以将所有大于零的评分的概率相加，或者用\
  \ 1 减去零评分的概率。\n\n根据这个推理，我们可以将期望评分的公式重写为：\n\n![$$ \\mathbbm{E}\\left[R\\right]=\\\
  sum \\limits_{r\\in R}r\\cdotp p\\left(r\\ |\\ r&gt;0\\right)=\\sum \\limits_{r\\\
  in R}r\\cdotp \\frac{p(r)}{p\\left(r&gt;0\\right)} $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equal.png)\n\
  \n就是这样。我们得出了一个可以计算期望评分的公式。借助相似度度量和拉普拉斯平滑，我们已经准备好实现一个电影推荐算法。\n\n### 实现算法\n\n本节将介绍如何用\
  \ Swift 实现我们刚刚在本章推导出的推荐算法。我们还将了解 Accelerate 框架中的一个新模块。我们将使用`vDSP` API，而不是用 CBLAS\
  \ 和 LAPACK 进行线性代数运算。`vDSP`提供了与数字信号处理和科学数据处理相关的功能，提供了用于处理向量、傅里叶变换、卷积以及许多其他任务的工具。\n\
  \n\n\n#### 主程序\n\n在深入细节之前，我们先来看一下主程序，以熟悉其整体结构。清单 7-1 展示了其实现。\n\n```\nvar raters\
  \ = DataLoader.load(\n    MovieWatcher.self,\n    from: .movieRatings\n)\nlet user\
  \ = raters.remove(at: 0)\nlet recommendations = MovieRecommender\n    .recommend(\n\
  \        movies: 5,\n        for: user,\n        from: raters,\n        neighbors:\
  \ 30\n    )\n清单 7-1\n推荐系统的主程序。\n```\n\n像往常一样，我们首先将数据集加载到内存中，并解码成我们可以使用的 Swift 类型。`MovieWatcher`\
  \ 类型包含一个用户 ID、一个电影评分数组以及一个对应的电影标题数组，如清单 7-2 所示。\n\n我们从电影爱好者集合中移除并存储第一个用户。之所以将这个用户放在首位，是因为他有一组非常清晰且规整的类型偏好，即喜剧片和恐怖片。这样，我们就有机会验证另一端收到的推荐是否合理。\n\
  \n在将寻求推荐的用户与其他用户分开后，我们调用 `MovieRecommender`，请求它根据本章介绍的方法推荐五部电影。结果是一个包含推荐电影标题的字符串数组。\n\
  \n```\nstruct MovieWatcher {\n    let id: Int\n    let titles: [String]\n    let\
  \ ratings: [Double]\n}\n清单 7-2\nMovieWatcher 类型的定义\n```\n\n为了完成当前任务，`MovieRecommender`\
  \ 需要确定哪 30 个用户与提出建议的用户最为相似。我们将这 30 个用户称为*邻居*，因为这是以这种方式寻找邻近数据点时常用的术语。\n\n推荐器还需要根据这些邻居计算经过拉普拉斯平滑处理的评分分布，计算每部电影的期望评分，并返回指定数量的期望评分最高的电影标题。清单\
  \ 7-3 展示了 `recommend(movies:for:from:neighbors:)` 方法的实现。\n\n```\nfunc recommend(\n\
  \    movies: Int,\n    for someone: MovieWatcher,\n    from others: [MovieWatcher],\n\
  \    neighbors: Int\n) -> [String] {\n    let similarUsers = getMostSimilar(\n \
  \       to: someone,\n        from: others,\n        neighbors: neighbors\n    )\n\
  \    let ratingDist = ratingDistributions(\n        from: similarUsers,\n      \
  \  movieCount: someone.ratings.count,\n        neighbors: neighbors\n    )\n   \
  \ let expectations = expectedRatings(\n        using: ratingDist\n    )\n    return\
  \ getTopRated(\n        movies: movies,\n        for: someone,\n        expectations:\
  \ expectations\n    )\n}\n清单 7-3\nrecommend(movies:for:from:neighbors:) 方法的实现\n\
  ```\n\n与第 6 章类似，我们将不同的子问题拆分成辅助函数。这种方法使代码更具可读性，也更容易理解 `recommend(movies:for:from:neighbors:)`\
  \ 的功能。第一步是计算 30 个最相似的用户，这一任务委托给了 `getMostSimilar(to:from:neighbors:)`。清单 7-4 展示了该方法的实现。\n\
  \n```\nprivate static func getMostSimilar(\n    to someone: MovieWatcher,\n    from\
  \ others: [MovieWatcher],\n    neighbors: Int\n) -> [MovieWatcher] {\n    let similarities\
  \ = others\n        .map { other in\n            similarity(lhs: someone, rhs: other)\n\
  \        }\n    let mostSimilar = similarities\n        .enumerated()\n        .sorted\
  \ { lhs, rhs in\n            lhs.element < rhs.element\n        }\n        .dropLast(others.count\
  \ - neighbors)\n        .map { offset, element in\n            others[offset]\n\
  \        }\n    return mostSimilar\n}\n清单 7-4\ngetMostSimilar(to:from:neighbors:)\
  \ 方法的实现\n```\n\n我们首先将所有用户映射到各自的相似度度量上。这里使用的是我们之前讨论过的欧几里得平方距离，稍后我们会讨论其实现。\n\n一旦获得所有相似度，我们通过调用\
  \ `enumerated()` 将它们与各自的数组索引捆绑起来，并根据相似度值按升序排序。请记住，两个用户越相似，他们的相似度值就越小。最后，我们丢弃除前 `neighbor`\
  \ 个相似度之外的所有内容，并将它们映射回对应的用户。此操作会留下一个包含最相似用户数量的数组，并将其返回给调用函数。\n\n为了全面理解这个函数，我们需要查看\
  \ `similarity(lhs:rhs:)` 方法。清单 7-5 展示了其实现。\n\n```\nfunc similarity(\n    lhs: MovieWatcher,\n\
  \    rhs: MovieWatcher\n) -> Double {\n    var (left, right) = (lhs.ratings, rhs.ratings)\n\
  \    for index in 0 ..< left.count {\n        if left[index] == 0 {\n          \
  \  right[index] = 5\n        } else if right[index] == 0 {\n            left[index]\
  \ = 5\n        }\n    }\n    return vDSP\n        .distanceSquared(\n          \
  \  left,\n            right\n        )\n}\n清单 7-5\nsimilarity(lhs:rhs:) 方法的实现\n\
  ```\n\n这个函数包含两个有趣的部分。首先，它获取两个用户的评分集合。请记住，我们希望缺失的评分会降低两个用户之间的相似度。因此，对于至少有一个评分缺失的所有电影，该算法将这两个评分分别设置为\
  \ 0 和 5，从而使距离贡献尽可能大。\n\n最后，我们首次使用了 `vDSP` 模块。清单 7-6 展示了 `distanceSquared(_:_:)`\
  \ 的定义，供参考。\n\n```\nstatic func distanceSquared(\n    _ pointA: U,\n    _ pointB:\
  \ V\n) -> Double\n    where U : AccelerateBuffer,\n          V : AccelerateMutableBuffer,\n\
  \          U.Element == Double,\n          V.Element == Double\n清单 7-6\nvDSP.distanceSquared(_:_:)\
  \ 的定义\n```\n\n由于这里涉及大量的泛型和约束，我们将尝试分解出最重要的信息。首先，该方法接受两个向量作为参数。这些向量代表我们要用于计算的两个点。它们受到必须遵循\
  \ `AccelerateBuffer` 和 `AccelerateMutableBuffer` 协议的要求约束。同时，这些向量内部的元素必须为 `Double`\
  \ 类型。完成后，该方法返回所提供点之间的欧几里得平方距离。\n\n现在我们已经提取了最相似的用户，可以计算每部电影的不同评分分布了。`ratingDistributions(from:movieCount:neighbors:)`\
  \ 方法使用拉普拉斯平滑技术来近似每部可用电影的评分分布。清单 7-7 展示了其实现。\n\n```\nfunc ratingDistributions(\n\
  \    from similarUsers: [MovieWatcher],\n    movieCount: Int,\n    neighbors: Int\n\
  ) -> [[Double]] {\n    let N = neighbors.realValue\n    let pseudoCount = 1.0\n\
  \    let numRatings = 6\n    let total = N + numRatings.realValue * pseudoCount\n\
  \    let columns = Double\n    let ratingMatrix = [[Double]](\n        repeating:\
  \ columns,\n        count: movieCount\n    )\n    let counts = similarUsers\n  \
  \      .reduce(into: ratingMatrix) { matrix, user in\n            user.ratings\n\
  \                .enumerated()\n                .forEach { movie, rating in\n  \
  \                  matrix[movie][Int(rating)] += 1\n                }\n        }\n\
  \    return counts\n        .map { movieRatings in\n            movieRatings.map\
  \ { rating in\n                rating / total\n            }\n        }\n}\n清单 7-7\n\
  计算每部电影的评分分布\n```\n\n在前几行中，我们确定了伪计数的规模，并计算出每部电影在计数后拥有的数据点总数。我们创建了一个矩阵，每部电影一行，0 到\
  \ 5 之间的每个评分一列。使用与之前相同的枚举技巧，我们可以追踪哪部电影获得了特定评分，并递增相应的计数器。最后，通过除以函数开头计算出的数据点总数，我们将计数转换为比例。\n\
  \n\n\n当此方法返回时，它会返回一个矩阵，该矩阵指定了一部电影获得某个评分的近似概率。我们基于先前计算的邻居来确定这些概率，因此它们应该能在一定程度上代表请求建议的用户可能如何评价每部电影。现在我们有了可供使用的分布，终于可以开始计算每部电影的期望评分。代码清单\
  \ 7-8 展示了`expectedRatings(using:)`的实现，它为我们处理了这项任务。\n\n```\nfunc expectedRatings(\n\
  using ratingsDist: [[Double]]\n) -> [Double] {\nratingsDist\n.map { distribution\
  \ -> Double in\nlet bayesDenom = 1 - distribution[0]\nreturn distribution\n.enumerated()\n\
  .dropFirst()\n.reduce(into: 0.0) { expectation, args in\nlet (intRating, prob) =\
  \ args\nlet rating = intRating.realValue\nexpectation += rating * prob / bayesDenom\n\
  }\n}\n}\n代码清单 7-8\n计算集合中每部电影的期望评分\n```\n\n程序会遍历每部电影的评分分布数组。对于每个分布，我们计算项`p(r > 0)`并将其存储在名为`bayesDenom`的变量中。我们使用枚举技巧来获取每个评分及其对应的概率，丢弃第一个条目（因为它包含未评分的占位符），然后使用我们之前推导的公式计算期望值。\n\
  \n此函数生成一个实数数组，每个实数对应一部电影。每个数字代表由最相似用户确定的一部电影的期望评分。这个期望值集合应该能大致代表我们为其推荐建议的用户会如何评价每部电影。剩下要做的就是提取评分最高的电影并返回它们的名称。代码清单\
  \ 7-9 展示了`getTopRated(movies:for:expectations:)`，它执行最后一步并完成电影推荐任务。\n\n```\nprivate\
  \ static func getTopRated(\nmovies: Int,\nfor someone: MovieWatcher,\nexpectations:\
  \ [Double]\n) -> [String] {\nexpectations\n.enumerated()\n.sorted { lhs, rhs in\n\
  if someone.ratings[lhs.offset] != 0 {\nreturn false\n}\nif someone.ratings[rhs.offset]\
  \ != 0 {\nreturn true\n}\nreturn lhs.element > rhs.element\n}\n.dropLast(expectations.count\
  \ - movies)\n.map { index, _ in\nsomeone.titles[index]\n}\n}\n代码清单 7-9\n将最高期望评分映射到推荐电影集合\n\
  ```\n\n这个处理流程中的大多数阶段现在应该看起来都很熟悉了。枚举将每个期望评分与其所描述的电影的索引配对。然而，排序阶段做了一些不那么显而易见的事情。即使一部电影可能有很高的期望评分，但如果用户已经评价过它，我们也不想推荐它。因此，我们不仅基于期望值进行排序，还添加了两个条件，将已评分的电影排到列表更靠后的位置。\n\
  \n排序完成后，我们只保留前`movie`个评分，并将它们映射回各自的标题。这两个阶段生成一个电影标题数组，我们可以将其返回给主程序并显示给用户。代码清单 7-10\
  \ 展示了我们在主程序中打印推荐结果。\n\n```\nprint(\n\"\"\"\nRecommended movies for user \\(user.id):\n\
  \\(\nrecommendations\n.joined(separator: \"\\n\")\n)\n\"\"\"\n)\n// 输出：\n// Recommended\
  \ movies for user 1:\n//\n// Dawn Patrol\n// Surfer, Dude\n// Winnie Mandela\n//\
  \ Grand Theft Parsons\n// An American in Hollywood\n代码清单 7-10\n为 ID 为 1 的用户打印推荐电影\n\
  ```\n\n我们现在有一些电影建议了！我们知道我们为其提供建议的用户是喜剧和恐怖片的粉丝，那么让我们评估一下这些推荐是否合理。表 7-4 列出了每部推荐电影的类型。\n\
  \n**表 7-4**\n推荐电影及其类型\n\n| 电影 | 类型 |\n| --- | --- |\n| *Dawn Patrol* | 惊悚/剧情 |\n\
  | *Surfer, Dude* | 喜剧 |\n| *Winnie Mandela* | 历史/剧情 |\n| *Grand Theft Parsons* |\
  \ 喜剧/剧情 |\n| *An American in Hollywood* | 喜剧/剧情 |\n\n这些结果看起来相当不错。推荐中有不少喜剧片。可以说，有一部惊悚片在某种意义上也与恐怖类型相关。\n\
  \n唯一与用户类型偏好不太吻合的电影是*Winnie Mandela*，这是一部剧情片。然而，这些电影都是由与我们的用户喜欢许多相同电影的其他用户推荐的。即使类型不完全匹配，它也可能是一个不错的选择。请记住，这种协同过滤的思路是观察一群志同道合的人对一部电影的感知质量。由于类型不是那么重要，我们最终可能会得到一些跨越类型偏好界限但用户仍可能喜欢的推荐。\n\
  \n表 7-5 列出了其他一些用户索引及其偏好的类型。请随意尝试代码项目，看看算法会生成什么样的建议。\n\n**表 7-5**\n其他一些用户索引及其偏好的类型\n\
  \n| 用户索引 | 偏好类型 |\n| --- | --- |\n| 8 | 动作 |\n| 54 | 喜剧, 悬疑 |\n| 82 | 剧情, 奇幻 |\n\
  | 172 | 喜剧, 浪漫 |\n| 220 | 动画 |\n\n## 本章小结\n\n本章将我们在本书中讨论的许多概念交织在一起。我们学会了如何通过整合基于统计分析的思想和概念，一步步解决一个现实世界的问题。我们介绍了两种衡量相似性的方法，讨论了它们如何工作以及它们在某些类型的数据上表现不佳的情况。我们还讨论了期望值的应用，并重新审视了贝叶斯定理以推导出一个有助于我们实现目标的公式。\n\
  \n本章的实现部分详细介绍了基于现有知识推荐电影标题所需的代码。我们使用了高阶函数链，并看到它们如何形成从输入到期望输出的声明式流程。我们还快速了解了`vDSP`模块，该模块包含几个在处理向量时非常有用的方法。由于`vDSP`是`Accelerate`框架的一部分，这些方法将通过在我们的\
  \ CPU 向量处理器上计算结果来加速执行。\n\n下一章通过总结我们在本书中学到的内容来收尾。它还探讨了了解统计方法有益的一些领域，并建议了一些资源以及未来学习的有趣相关主题。\n\
  \n# 8. 反思\n\n本书以较快的节奏介绍了新的主题、技术和框架。要充分消化新内容，有必要花时间反思我们所做的事情。本章将回顾前几章中最重要的主题，提供重复练习，并留出一些时间来反思各个主题是如何结合在一起的。在结束之前，我们还将探讨一些需要统计分析知识至关重要的职业，并建议一些进一步学习相关的主题。\n\
  \n\n\n## Swift 编程语言\n\n在第 1 章中，我们讨论了 Swift 及其作为统计分析工具的可行性。正如我们当时提到的，解决这类问题有很多不错的替代方案，例如\
  \ Python 和 R。然而，Swift 在某些情况下确实具有优势，不应仅仅因为有其他语言可用就将其排除在工具箱之外。\n\n- Swift 是一种静态类型、编译型语言，在处理大规模数据时快速高效。\n\
  - 通过 Swift 包管理器可以获得大量框架和库，从而能够访问构建应用所需的广阔工具生态。\n- Swift 也是苹果平台的主要语言，这使得我们更容易将算法整合到\
  \ Mac、iPhone 和 iPad 上的应用程序中。这一点本身就很重要，因为最终我们希望用户能够享受我们工作的成果。\n\n本书处理了存储在 CSV 文件中的数据。主要原因是这种格式在可读性和存储需求之间取得了平衡。我们还介绍了几种用于数据持久化的其他格式，例如\
  \ `JSON`、`XML` 和 `Protobuf`。这些都是易于写入和读取文件的格式。然而，Swift 有多个选项可以使用更复杂的数据库管理系统来存储和检索数据。甚至可以在关系型、NoSQL\
  \ 和基于图的数据库之间进行选择。表 8-1 显示了 Swift 开发人员可用的一些选项。考虑到所有这些不同的可能性，无论我们的用例是什么，我们都一定能找到合适的匹配。\n\
  \n**表 8-1** Swift 开发人员可用的数据库管理系统\n\n| 名称 | 类型 |\n| --- | --- |\n| SQLite | 关系型 DBMS\
  \ |\n| Realm | NoSQL DBMS |\n| ObjectBox | NoSQL DBMS |\n| Neo4j | 图 DBMS |\n\n\
  我们在本书中大量使用了 Swift 的内置语言特性，例如高阶函数和 `KeyPath` 类型。高阶函数在我们几乎所有的代码项目中都扮演了重要角色。诸如 `filter(_:)`、`reduce(_:)`\
  \ 和 `map(_:)` 之类的方法帮助我们转换和精简数据集，直到得出最终结果。`KeyPath` 类型通过允许调用函数选择一个或多个目标变量，使我们的某些算法更具通用性。这种方法使我们能够创建真正通用的程序，例如，快速更改用于线性回归计算的变量。\n\
  \nSwift 的另一个宝贵特性是，通过 `Encodable` 和 `Decodable` 协议，我们可以获得一个数据编解码器的世界。有些是苹果提供给我们的，另一些则来自才华横溢的第三方开发者。无论我们使用何种数据格式，几乎可以肯定都有大量解析数据文件的选项，无需我们手动拆解。\n\
  \n## 概率论\n\n在第 2 章中，我们介绍了概率论中一些最重要的概念。我们了解到，尽管这看起来像是一个小众话题，但我们大多数人在日常生活中都会遇到它。这里列出一些现实世界应用的例子：\n\
  \n- 天气预报可能会告诉我们，明天下雨的概率是 5%。\n- 一项民意调查可能显示，一位总统候选人领先对手 2%，但也可能得出结论，该结果在统计上并不显著。\n\
  - 记录显示，一个国家 85% 的人口接种了针对一种新疾病的疫苗，而住院的人中有 50% 未接种疫苗。\n\n最后一个例子非常适合应用我们学到的另一个重要概念——贝叶斯定理。利用贝叶斯法则，例如，我们可以计算出在接种疫苗后住院的概率。这个看似简单的公式提供了一种强大的工具，通过向我们的估计中注入更多信息，来权衡不同的情景。\n\
  \n第 2 章还向我们介绍了独立性，以及它如何经常简化我们的计算。有些人可能会认为万物都是相互关联的，两个事件永远不可能真正独立。然而，如果两个事件对彼此概率的影响小到可以接受，我们通常就认为它们是独立的。原因之一是我们喜欢简单，思考不相互作用的事物不那么复杂。另一个原因是，如果影响足够小，我们最终得到的近似值仍然接近真实值，因此不会损失太多精度。\n\
  \n## 分布\n\n在学习样本空间的过程中，我们了解了如何根据样本点的性质对其进行分类。这种看待可能结果的方式引导我们讨论了离散分布和连续分布及其性质。\n\n\
  离散分布以其概率质量函数 (PMF) 为特征，而连续分布则具有概率密度函数 (PDF)。两者都描述了分布中包含的所有样本点的可能性。然而，我们还了解到，只有 PMF\
  \ 能得出一个可以解释为概率的数字。另一方面，PDF 给出的是相对似然值。可能性更大的样本点会得到更高的数值，但我们需要计算一个积分才能得到正确的概率。我们还了解到，在连续分布中，单个样本点的概率为零，我们应该计算样本点范围内的概率。\n\
  \n另一个帮助我们描述分布的函数是累积分布函数 (CDF)。它告诉我们样本落在或低于指定点的概率。例如，标准正态分布的 CDF 会告诉我们随机样本小于或等于零的概率是\
  \ 50%。\n\n第 3 章还介绍了期望值的概念。最常见的期望值是平均值。我们通过在给定分布中将每个样本点按其概率加权来计算它。然而，还有其他期望值，例如分布的方差、偏度和峰度。我们在学习中涵盖了方差及其密切相关的标准差。但另外两个性质很容易查找和理解，因为它们建立在相同的概念之上。\n\
  \n\n\n## 回归技术\n\n第 4 章带领我们学习了简单线性回归和多元线性回归。在此过程中，我们了解了一系列相关方法。\n\n-   如果我们确信两个属性之间存在精确的线性关系，那么通过两个数据点进行`线性插值`和`外推`会很有帮助。本章使用的例子是购买苹果时重量与成本之间的关系。如果一磅苹果售价\
  \ 1.3 美元，那么有理由相信两磅苹果会花费 2.6 美元。\n-   当我们拥有呈现线性趋势的不规则数据点时，`线性样条`会很有用。我们可以对现有数据点之间进行插值，以近似得到它们之间的任意数值。然而，我们也了解到这种方法存在缺陷，例如需要存储完整的数据集，并且如果我们试图近似估计原始数据范围之外的数值，估算值可能会迅速偏离真实值。\n\
  -   `线性回归`则试图在前两种方法之间找到一个平衡点。它只需要我们存储一个线性方程的系数，并能概括原始数据的整体趋势。前者意味着，一旦我们获得系数，就不需要太大的存储空间来进行估算。后者则减少了我们在经验数据范围之外看到的样条函数可能存在的问题。\n\
  \n为了构建线性回归的公式和算法，我们还学习了`损失函数`。损失函数绝非线性回归所独有。我们在许多激动人心的应用中都会用到它们，例如需要逼近函数的机器学习算法。\n\
  \n第 4 章还向我们介绍了 `Accelerate` 框架以及 `BLAS` 和 `LAPACK` 库。在进行涉及线性代数的数学计算时，所有这些工具都提供了出色的支持。与串行计算所有内容相比，计算机能够并行处理大部分工作，从而节省了大量时间。我们只介绍了特定用例所需的极小部分功能，但这些库中包含了大量可供我们使用的宝贵数学函数。欢迎进一步深入研读第\
  \ 4 章中引用的文档，以发现更多内容。\n\n## 假设检验\n\n正如我们在第 5 章开头所述，假设检验是学生们认为最难理解的主题之一。仅仅是确定零假设和备择假设这一任务就可能很困难。\n\
  \n-   零假设 `H[0]` 表明当前公认的真理仍然成立。例如，如果先前的研究表明密歇根州四月份的平均气温是 64.6°F，那么 `H[0]` 就声称这个数值仍然成立。\n\
  -   备择假设 `H[A]` 则陈述了一个我们想要检验的新假设。如果我们认为密歇根州近年来变得更暖和了，那么 `H[A]` 就声称平均气温大于 64.6°F。\n\
  \n为了开始检验，我们需要进一步了解样本均值的分布。随着我们使用越来越多的样本进行计算，样本均值会越来越趋近于真实均值。然而，除非我们使用整个总体，否则我们的计算结果存在不可忽视的偏差可能性。为了量化这种不确定性，我们求助于`中心极限定理`，该定理告诉我们，正态分布可以近似样本均值的分布。只要我们有足够的样本，无论样本来自何种分布，这一定理都成立。\n\
  \n学习如何估算计算中的不确定性使我们能够确定临界点，当备择假设偶然发生的可能性足够小时，我们可以拒绝它。这些临界点让我们定义了置信水平、`alpha` 值和\
  \ `p` 值，这些都是量化结果不确定性的重要工具。包含这些值可以让其他人决定是否要根据结果采取行动。\n\n## 数据压缩的统计方法\n\n统计方法并非只适用于繁重的数据科学任务或机器学习算法。在第\
  \ 6 章中，我们了解到可以将它们用于更传统的计算机科学主题，例如数据压缩。首先，我们必须了解函数。\n\n-   `满射函数`的特性是我们可以到达值域中的所有元素。然而，多个定义域成员可以映射到同一个值域元素。因此，我们可能无法确定一个唯一的映射回到定义域。\n\
  -   `单射函数`将所有定义域成员映射到值域中的唯一元素。这种特性很好，因为存在唯一的方法将这些元素映射回各自对应的定义域成员。但是，可能存在值域中的某些元素无法从定义域到达。这个缺点意味着我们无法保证存在从值域到定义域的逆映射。\n\
  -   `双射函数`既是满射又是单射，这意味着所有定义域成员都映射到值域中的一个唯一元素，并且所有值域成员都是可达的。当这两个性质都成立时，我们知道该函数存在一个反函数。我们可以利用这对函数来开发无损压缩算法。\n\
  \n除了双射，我们还引入了“近似双射”的概念。虽然这不是一个普遍接受的术语，但它恰当地描述了有损函数的思想，在这类函数中，反函数不能保证将一个值域成员映射回原始的定义域元素。相反，它会映射回其邻近的某个成员。\n\
  \n为了实现压缩算法，我们需要一些双射函数来压缩和解压数据。在我们的例子中，我们学习了`哈夫曼编码`以及如何使用`哈夫曼树`来创建它们。借助哈夫曼编码背后的理论，我们成功设计了一个算法，该算法能显著缩小文本文件，然后将其解压回原始形式。在实现过程中，我们还亲身体验了\
  \ Swift 的一些底层功能，例如位运算符和指针类型。我们还了解了一些更通用的计算机科学惯例，比如内存对齐。这些惯例很好地服务于它们的目的，但也迫使我们思考在打包数据时如何组织数据。与此相关，我们还提出了一个关于改进算法打包和解打包字节方式的练习。\n\
  \n\n## 推荐系统中的统计方法\n\n在第 7 章中，我们介绍了一个非常前沿的话题——推荐系统。由于大多数服务都使用某种算法来推荐内容或产品，了解其背后的一些基本思想至关重要。同时，这也让我们得以混合搭配本书中学到的一些理论知识。\n\
  \n我们学习了相似度度量，以及它们如何根据某种相似性概念来对数据点进行分组。然而，一种相似度度量并不适用于所有问题，当我们试图通过余弦相似度来判断电影爱好者的相似度时，便痛苦地意识到了这一点。该小节提供了一些直觉，帮助思考在为特定用例选择度量标准时需要考虑的事项。\n\
  \n我们看到了贝叶斯定理如何帮助我们克服表示数据点时的局限性。最终，我们用它推导出了一个更符合需求的期望值公式版本。多亏了我们进行的这些数学变换，我们的算法实现起来变得容易得多。\n\
  \n在实现阶段，我们接触了 Accelerate 框架中的另一个模块，名为 `vDSP`。该模块提供了使用向量执行计算的功能，顾名思义，即数字信号处理。与 `BLAS`\
  \ 和 `LAPACK` 一样，我们只使用了可用功能的极小一部分。对于有兴趣的人而言，仍有大量实用的方法等待发掘。\n\n> **注意**：对于希望深入了解 Accelerate\
  \ 框架的人来说，Apple 的文档是一个不错的起点。请访问 `https://developer.apple.com/documentation/accelerate`\
  \ 了解更多信息。\n\n## 专业应用领域\n\n既然我们已经打开了使用 Swift 作为统计分析工具的大门，那么很自然会问这些知识能应用于何处。以下列表简要展示了统计分析作为一项相关技能的不同领域，但绝不算详尽。许多职业都能从这些技能中受益，未来可能还会出现更多需要掌握这些概念的职位。\n\
  \n### 数据科学家\n\n显而易见的首选当然是数据科学家这一角色。数据科学家处理大量数据，构建数学模型和计算机程序，以提供关于趋势、行为或新收入来源的有用信息。\n\
  \n### 机器学习工程师\n\n机器学习工程师是熟练的程序员，负责研究、设计或实现复杂的软件。他们使用海量数据集来开发能够学习并做出决策或预测的算法。\n\n\
  ### 数据工程师\n\n与数据科学家相比，数据工程师的工作更偏向计算机科学方面。尽管如此，当他们构建系统来收集、存储和分析海量数据时，掌握统计学知识对他们来说仍然很有必要。\n\
  \n### 数据分析师\n\n与前几种职业相比，数据分析师更多地扮演面向客户的角色。他们的工作是收集、分析和解释数据，并呈现研究结果，以便所有相关利益方能够理解并据此做出适当的决策。\n\
  \n## 进阶学习主题\n\n学习是快乐与挫折的美妙结合。最终掌握某样东西并将其应用于实践的成就感，是我们持续学习的主要原因之一。然而，有时很难知道下一个挑战该从哪里寻找。毕竟，如果我们从未听说过某样东西的存在，几乎不可能去寻找它。如果你喜欢本书中的主题，以下列表提供了一些可能感兴趣的相关领域。无论你选择哪一个作为下一个目标，我都祝愿你在获取更多知识的旅程中一切顺利。\n\
  \n### 数值线性代数\n\n本书涉及了相当多的线性代数内容，并使用了 `BLAS`、`LAPACK` 和 Accelerate 框架。如果那些章节让你感到兴奋，那么进一步学习数值线性代数可能会引起你的兴趣。可汗学院提供了一门优秀的线性代数课程，格兰特·桑德森的\
  \ *3Blue1Brown* 系列视频则对基础知识进行了非常直观的讲解。\n\n### 多元统计学\n\n本书主要关注单变量的分析，即所谓的单变量统计。然而，当今数据的复杂性通常需要分析多个变量。西奥多·W·安德森的《多元统计分析导论》是希望深入研究者的一个良好起点。\n\
  \n### 监督式机器学习\n\n机器学习是目前的热门话题，事实上，我们之前实现的线性回归就属于监督式机器学习。那些有兴趣了解更多相关技术并学习一门新编程语言的读者，可以参阅塞巴斯蒂安·拉施卡的《Python\
