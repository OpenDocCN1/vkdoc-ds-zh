    defined as


    ![$$ \operatorname{erf}(z)=\frac{2}{\sqrt{\pi }}{\int}_0^z{e}^{-{t}^2} dt $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equan.png)


