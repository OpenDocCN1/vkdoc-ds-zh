  raw: '## Statistical Methods in Recommender Systems


    In Chapter [7](#512351_1_En_7_Chapter.xhtml), we introduced a very current topic
    – recommender systems. Since most services use some sort of algorithm to suggest
    content or products, it is vital to have experience with some basic ideas behind
    them. However, it also allowed us to mix and match some of the theoretical elements
    we learned throughout the book.


    We learned about similarity measures and how they provide a way to group data
    points depending on some notion of likeness. However, one similarity measure does
    not fit all problems, which we became painfully aware of as we tried to determine
    the similarity of movie enthusiasts by the cosine similarity. The section gave
    some intuition about what we need to think about when selecting a measure for
    our particular use case.


    We saw how Bayes’ Theorem could help us overcome limitations in representing our
    data points. In the end, we used it to derive a version of the expected value
    formula that better fit our needs. Our algorithm became much easier to implement
    thanks to the mathematical gymnastics we performed.


    During the implementation stage, we got acquainted with yet another module from
    the Accelerate framework named vDSP. This module provides functionality for performing
    computations with vectors and, as the name suggests, digital signal processing.
    Like with BLAS and LAPACK, we only used a tiny fraction of the available functionality.
    There are still plenty of practical methods to discover for those that are interested.


    Note


    Apple’s documentation provides a good starting point for those who want to dive
    deeper into the Accelerate framework. Visit [`https://developer.apple.com/documentation/accelerate`](https://developer.apple.com/documentation/accelerate)
    to learn more.


    ## Professional Areas of Application


    Now that we have opened the door to using Swift as a tool for statistical analysis,
    it is reasonable to ask where this knowledge is applicable. The following list
    provides a glimpse at the different areas where statistical analysis is a relevant
    skill, but it is not, by any measure, complete. There are plenty of professions
    that benefit from these skills, and the future will likely bring even more job
    titles where it serves us well to know these concepts.


    ### Data Scientist


    The obvious first choice is, of course, the data scientist role. Data scientists
    work with large amounts of data, building mathematical models and computer programs
    that provide useful information about trends, behaviors, or new revenue opportunities.


    ### Machine Learning Engineer


    Machine learning engineers are skilled programmers who research, design, or implement
    complex software. They work with massive data sets to develop algorithms that
    can learn and make decisions or predictions.


    ### Data Engineer


    Data engineers work much more on the computer science side than, for example,
    data scientists. Still, it is relevant for them to know their way around statistics
    when they build systems to collect, store, and analyze vast amounts of data.


    ### Data Analyst


    Data analysts take on more of a customer-facing role than the previous professions.
    Their job is to collect, analyze, and interpret data and present the findings
    so that all relevant stakeholders can absorb it and use it to make appropriate
    decisions.


    ## Topics for Further Studies


    Learning is a nice blend of joy and frustration. The feeling of finally getting
    something and applying it in practice is one of the main reasons we continue to
    learn. However, sometimes it is difficult to know where to look for the next challenge.
    After all, if we never learned that something exists, it is nearly impossible
    to look for it. If you enjoyed the topics in this book, this list provides some
    related areas that may be of interest. Whichever one you pick for your next undertaking,
    I wish you all the best on your journey toward more knowledge.


    ### Numerical Linear Algebra


    This book has gone through a fair share of linear algebra and worked with BLAS,
    LAPACK, and the Accelerate framework. If those sections were exciting, further
    studies in numerical linear algebra might be of interest. *Khan Academy* offers
    an excellent course in linear algebra, and Grant Sanderson’s *3Blue1Brown* provides
    a very intuitive video series on the essentials.


    ### Multivariate Statistics


    This book has mainly concerned itself with looking at a single variable, so-called
    univariate statistics. However, the complexity of data today often requires the
    analysis of multiple variables. *An Introduction to* *Multivariate Statistical
    Analysis* by Theodore W. Anderson is a good place to start for those who want
    to dive deeper.


    ### Supervised Machine Learning


    Machine learning is a hot topic at the moment, and the fact is that the linear
    regression we implemented earlier counts as supervised machine learning. Those
    interested in learning more about these techniques and picking up a new programming
    language may want to check out *Python Machine Learning* by Sebastian Raschka.


