    into why the numbers work out the way they do. The quick-and-dirty explanation
    is that the probability of any single sample point approaches zero as the number
    of sample points approaches infinity. There are, as always, exceptions to this.
    However, in general, this means that we only ask questions about whether a continuous
    random variable is within some range of values. Figure [3-6](#512351_1_En_3_Chapter.xhtml#Fig6)
    shows a visual representation of how the continuous CDF relates to the PDF. Computing
    the CDF comes down to calculating the area under the PDF curve.


    ![../images/512351_1_En_3_Chapter/512351_1_En_3_Fig6_HTML.png](images/512351_1_En_3_Chapter/512351_1_En_3_Fig6_HTML.png)


    Figure 3-6


    Computing the continuous CDF comes down to calculating the area under the PDF
    curve. In this case, P[0 < X < 1] is highlighted


    Luckily for us, we will not have to deal with integrals a whole lot in this book.
    Many standard distributions have closed-form analytical solutions or approximations
    of their cumulative distribution functions, which we can exploit to calculate
    our answers instead. Now, let us continue by looking at a continuous standard
    distribution often used in counting processes and queueing theory.'
  trans: '

    # 连续分布


    从概念上讲，连续分布与离散分布并无太大区别。它仍然是样本空间中各种结果可能性的描述。然而，一旦我们开始使用连续分布进行计算，它们就会展现出极大的不同。有些差异很容易适应，而另一些在我们遇到时可能会感觉相当违反直觉。


    ## 与离散分布的区别


    连续分布与离散分布的主要区别之一在于，连续分布没有概率质量函数。相反，连续分布具有一个被称为*概率密度函数*（`PDF`）的相似属性。我们不再使用图表中的柱状图来可视化`PDF`，而是使用折线图，它会在所有样本点上生成一条曲线，如图
    3-5 所示。


    ![../images/512351_1_En_3_Chapter/512351_1_En_3_Fig5_HTML.png](img/512351_1_En_3_Fig5_HTML.png)


    图 3-5


    展示标准正态分布`PDF`的图表


    虽然连续曲线无疑比我们在离散图表中看到的柱状图在视觉上更令人愉悦，但无限的样本点也使得情况变得有点棘手。起初可能不明显，但 Y 轴上的值不再代表概率。为澄清这一点，我们在表
    3-1 中列出了几个样本点。


    表 3-1


    标准正态分布的几个样本点


    | 样本点 | PDF 值 |

    | --- | --- |

    | -0.10 | 0.397 |

    | -0.05 | 0.398 |

    | 0.00 | 0.399 |

    | 0.05 | 0.398 |

    | 0.10 | 0.397 |


    如果我们将这些值视为概率，那么从标准正态分布中抽取这五个点中任意一个的概率大约为 199%。考虑到整个样本空间的总概率应等于 1，并且还有无限多的其他点可供选择，这是不现实的。这种认识迫使我们思考`PDF`值实际上代表什么，以及它们为何与`PMF`值不同。


    离散分布使我们可以相对简单地想象所有单个样本点的概率之和为 1。然而，当处理无限多个样本点时，要描绘出同样的画面就不那么简单了。我们需要将每个`PDF`值设得多小才能确保它们总和为
    1？答案是，我们不用常规求和来计算连续分布，而是使用积分，积分所具有的特性有时可能违反直觉甚至不受欢迎。


    任何上过微积分课程的人都可以证明，有些积分的计算极其复杂。在统计学中也是如此，我们经常最终得到包含多个相关随机变量的`PDF`的方程。连续样本空间的另一个令人惊讶的特性是，任何单个点的概率为零。是的，这是真的。以下是对其原因的简要概述：


    ```

    设 f(x) 为一个连续随机变量的 PDF。

    ```


    ```

    设 F(x) 为 f(x) 的原函数。那么

    ```


    ```

    P[X=x] = ∫_x^x f(x) dx = [F(x)]_x^x = F(x) - F(x) = 0

    ```


    上述内容并非严格的证明，而是为了提供对数字如此运作方式的深入理解。一个粗略的解释是，当样本点数量趋近于无穷时，任何单个样本点的概率趋近于零。当然，和往常一样，也存在例外情况。但总的来说，这意味着我们只询问连续随机变量是否在某个值域范围内的问题。图
    3-6 直观地展示了连续`CDF`与`PDF`的关系。计算`CDF`归结为计算`PDF`曲线下的面积。


    ![../images/512351_1_En_3_Chapter/512351_1_En_3_Fig6_HTML.png](img/512351_1_En_3_Fig6_HTML.png)


    图 3-6


    计算连续`CDF`归结为计算`PDF`曲线下的面积。在此情况下，突出显示了 `P[0 < X < 1]`


    幸运的是，我们在这本书中不会大量处理积分问题。许多标准分布都有其累积分布函数的闭式解析解或近似解，我们可以利用它们来计算答案。现在，让我们继续来看一个在计数过程和排队论中经常使用的连续标准分布。

    '
- fmt: '### Exponential Distribution


    The exponential distribution describes the distribution of time between two events
    in a Poisson distribution. We did not cover the Poisson distribution specifically,
    but the exponential distribution is still a good tool for calculations on its
    own.


    The exponential distribution has a single parameter, commonly referred to as the
    *rate*, denoted by the Greek letter λ. The rate tells us the average number of
    events that occur in a decided unit of time. For example, if we owned a store
    with an average of 20 customers visiting every day, we could let the time unit
    be one day, and the rate would be 20. If we instead choose one hour to be our
    base, the rate is two (given that the store is open for 10 hours). A good thing
    to note is that since we deal with time intervals, the sample space is made up
    strictly of nonnegative numbers.


    The exponential distribution describes how likely it is that some time interval
    separates two events. For example, if our store has two customers visiting every
    hour, we could calculate the probability that the first customer arrives within
    10 minutes of our opening. We could write this mathematically using the following
    notation:


    ![$$ P\left[\ 0\le X\le \frac{1}{6};\lambda =2\right] $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equaf.png)


    Note that we need to specify a range of values since we deal with a sample space
    containing continuous time intervals. The probability that the first customer
    arrives precisely ten minutes after opening is zero, by the same reasoning that
    we applied in the previous section. We also note that the upper bound is not ten,
    but rather the fraction of our base unit (one hour) that ten minutes make up.


    We could compute the integral of the exponential distribution PDF from zero through
    ten minutes to answer our question. The derivation of the PDF is beyond the scope
    of this book. Instead, we simply present the formula in the following equation:


    ![$$ P\left[\ 0\le X\le \frac{1}{6};\lambda =2\right]={\int}_0^{\frac{1}{6}}\lambda
    {e}^{-\lambda x} dx={\left[-{e}^{-\lambda x}\right]}_0^{\frac{1}{6}}=1-{e}^{-\frac{2}{6}}\approx
    0.283 $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equag.png)


    The calculation shows us that if we were to oversleep and be ten minutes late
    to open the store, there is an approximate 28.3% risk that our first customer
    shows up before us and, consequently, leaves without buying anything.


    This particular integral was not that bad. It was, in fact, reasonably well behaved
    and easy to compute. However, there is another way to calculate the same result
    using the cumulative distribution function. We show the exponential distribution
    CDF here:


    ![$$ P\left[X\le x\right]=1-{e}^{-\lambda x} $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equah.png)


    This formula looks very similar to one of the last equalities in the integral
    we just solved. Since it calculates the probability that our random variable falls
    below a certain threshold, we will use it to perform a trick. If we wanted to
    know the likelihood of the first customer showing up in the first five to ten
    minutes, we could compute the integral again. However, we could also rephrase
    the question like:


    ![$$ P\left[X\le \frac{1}{6};\lambda =2\right]-P\left[X\le \frac{1}{12};\lambda
    =2\right] $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equai.png)


    That is, we compute the likelihood of our first customer showing up within ten
    minutes of opening, but we subtract the probability that they show up within the
    first five minutes to get an answer for the range in which we are interested:


    ![$$ P\left[X\le \frac{1}{6};\lambda =2\right]-P\left[X\le \frac{1}{12};\lambda
    =2\right]=1-{e}^{-\frac{2}{6}}-1+{e}^{-\frac{2}{12}}\approx 0.13 $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equaj.png)


    This trick also works consistently for the first example. The only change we need
    to make is to subtract the probability of the first customer showing up within
    zero minutes instead of five. The code in Listing `[3-5]` shows how one could
    compute the likelihood of an event occurring between time `x[1]` and `x[2]`, given
    an exponential distribution with rate `λ`.


    ```

    func probability(

    between x: Double,

    and y: Double,

    rate: Double

    ) {

    precondition(0 <= x, "x mustbe non-negative.")

    precondition(0 <= y, "y must be non-negative.")

    precondition(x <= y, "x must be ≤ y.")

    precondition(0 < rate, "rate must be positive.")

    let upperCDF = 1 - exp(-rate * y)

    let lowerCDF = 1 - exp(-rate * x)

    let prob = upperCDF - lowerCDF

    print(

    """

    P[\(x) ≤ x ≤ \(y) | λ = \(rate)] = \(prob)

    """

    )

    }

    probability(between: 0, and: 1, rate: 2)

    probability(between: 0, and: 1, rate: 0.2)

    probability(between: 0, and: 0, rate: 10)

    // Prints:

    // P[0.0 ≤ x ≤ 1.0 | λ = 2.0] = 0.8646647167633873

    // P[0.0 ≤ x ≤ 1.0 | λ = 0.2] = 0.18126924692201818

    // P[0.0 ≤ x ≤ 0.0 | λ = 10.0] = 0.0

    Listing 3-5

    An example of computing the probability of an event occurring given an exponential
    distribution

    ```


    Now that we have some experience working with continuous sample spaces, it is
    time to look at one of the most important and widely used continuous distributions.'
