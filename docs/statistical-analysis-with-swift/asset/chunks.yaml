    func parseTree(

    _ data: inout Data

    ) -> HuffmanNode {

    let marker = data.first

    data = Data(data.dropFirst())

    switch marker {

    case 0:

    let left = parseTree(&data)

    let right = parseTree(&data)

    return .node(left: left, right: right)

    default:

    let (count, value) = data

    .withUnsafeBytes { pointer -> (Int, UInt8) in

    let count = pointer.load(as: Int.self)

    let value = pointer.load(

    fromByteOffset: MemoryLayout.size,

    as: UInt8.self

    )

    return (count, value)

    }

    let intSize = MemoryLayout.size

    let byteSize = MemoryLayout.size

    data = Data(data.dropFirst(intSize + byteSize))

    return .leaf(value: value, count: count)

    }

    }

    Listing 6-13

    The implementation of parseTree(_:)

    ```


    This method starts by fetching the first byte from the data object, which contains
    a marker telling us whether we are parsing a branch node or a leaf node. It then
    creates a new Data object by dropping the marker byte. Creating many new objects
    like this is generally frowned upon since it can impose a significant performance
    hit. The question is, why do we do it then?


    The fact that we need to create a new `Data` object is a side effect of how we
    packed our tree. On the one hand, we stored the markers, byte values, and counts
    in a compact way. It was not as compact as possible, but there were no gaps between
    the different pieces of information. On the other hand, this way of packing different
    types violates some alignment conventions. For example, the `UInt8` type has an
    alignment of 1\. If we store a `UInt8` value at offset 0, then the next legal
    offset to store another `UInt8` value is 0 + 1 = 1\. For `Int64`, the corresponding
    alignment is 8\. Such a value is only legal if we store it at an offset which
    is a multiple of 8, such as 0, 8, or 16\. Herein lies a problem with our compact
    representation. We store a `UInt8`-sized marker at offset 0 and an `Int`-sized
    count variable at offset 1\. To solve this misalignment problem, we create a new
    `Data` object, which effectively resets the offset and puts the first element
    at index 0.


    Note


    As previously mentioned, it is entirely possible to store the tree differently.
    One could throw away the count variable as a simple fix since it is not pertinent
    to the decoding process. That would eradicate the alignment issue since the rest
    of the encoded data is of type `UInt8`. Feel free to play around with the code
    project and see which other solutions are possible.


    Now that we know about potential issues when encoding binary data like this, let
    us look at the rest of `parseTree(_:)`. We switch on the marker to determine if
    the current node is a branch or a leaf. If the node is a branch, we recursively
    call `parseTree(_:)` to decode the left and right branches and return them grouped
    under a new `.node` instance. If, on the other hand, we are parsing a leaf node,
    we read out the count and byte value from the pointer. We then resolve any future
    alignment issues by creating a new `Data` object, thereby resetting the indices
    after the node we just parsed. Finally, we return the leaf.


    Last but not least, we look at the function that parses the encoded text message.
    Listing [6-14](#512351_1_En_6_Chapter.xhtml#PC14) shows the implementation.


    ```

    func parseText(

    from data: Data,

    using tree: HuffmanNode,

    bitLength: Int

    ) throws -> String {

    var textData = Data()

    if case .leaf(let value, _) = tree {

    textData.append(

    contentsOf: [UInt8](

    repeating: value,

    count: bitLength

    )

    )

    } else {

    var index = 0

    var currentNode = tree

    while index > (index % 8)

    let step = data[index / 8] & mask

    currentNode = step > 0 ? rhs : lhs

    index += 1

    }

    }

    }

    guard let text = String(

    data: textData,

    encoding: .utf8

    )

    else { throw HuffmanError.textDecodingFailure }

    return text

    }

    Listing 6-14

    Implementation of parseText(from:using:bitLength:)

    ```


    The first part of `parseText(from:using:bitLength:)` checks for a somewhat unusual
    but still important edge case. If the original text only consisted of one single
    byte value, for example, if it were just a file full of Ts, the tree would be
    a single leaf node. If that is the case, we should produce a `Data` object that
    repeats a single byte `bitLength` times. However, if the root is a branch node,
    we need to compute the correct byte orders by parsing individual bits.


    We initialize an index variable that tracks which bit we are currently parsing.
    We also initialize a variable that allows us to traverse the tree according to
    the value of each bit. If we hit a leaf node, we append the byte value to a byte
    buffer named `textData`. However, if we hit a branch node, we create a mask that
    targets the current bit and check whether it is a zero or a one. According to
    the rules we defined in the compression stage, we move along the left branch if
    the bit value is zero and to the right otherwise. At this point, we increment
    the `index` counter and move on to look at the next bit.


    After parsing all bits, we have a `textData` buffer that includes the original
    text byte values in the correct order. From here, we can use the dedicated `String`
    type initializer, `init(data:encoding:)`, to turn the decompressed data into an
    actual text string and return it.


    To ensure that the decompression stage produces the proper output, we can compare
    the original text with the one that has gone through our compression pipeline.
    Listing [6-15](#512351_1_En_6_Chapter.xhtml#PC15) shows the final part of the
    main script.


    ```

    let decompressed = try coder.decode(compressed)

    print(

    """

    Decompressed text matches original:

    \(text == decompressed ? "YES" : "NO")

    """

    )

    // Prints:

    // Decompressed text matches original:

    // YES

    Listing 6-15

    Comparing the decompressed output to the original text

    ```


    Even though this is by no means a complete example of how much storage we can
    save, it still highlights that these techniques can produce some awe-inspiring
    results. If a simple implementation with the problems and caveats discussed here
    can produce a 40% reduction in size, one can imagine what a more optimized version
    could do.


    ## Chapter Summary


    This chapter put much focus on the implementation side. We learned about functions
    and some of their properties, such as surjection, injection, and bijection. We
    also introduced the technically incorrect notion of “approximate bijection,” which
    can be used as a tool when exact inversion is not required.


    We studied Huffman codes and how to produce them by using binary trees. There
    was also some discussion around the uniqueness of such codes, as multiple trees
    may minimize the number of bits needed to encode some data. Finally, we implemented
    a text compression tool that allowed us to compress and decompress a text file.
    In this process, we also covered some low-level computer science knowledge about
    memory layout and the implications of such layout rules.


    In the following chapter, we will combine many of the concepts learned throughout
    this book to implement a movie recommender system.


    # 7. Statistical Methods in Recommender Systems


    When we log on to a website or open an app, there is a good chance that statistical
    methods are working behind the scenes. They may be serving content that we are
    likely to engage with or showing products we may want to purchase. The common
    denominator for all of these algorithms is that they use past behaviors and known
    preferences to make statistical predictions of things that we would like. In this
    chapter, we will build a recommender system to suggest movies we might like.'
