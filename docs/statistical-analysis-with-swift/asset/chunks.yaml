    The average under the new distribution is less than under the uniform one. A lower
    value makes sense since we are more likely to see lower numbers with this die.
    One thing to note is that this is exactly equivalent to the more familiar way
    of computing a mean, where we add up some numbers and divide by how many we added.
    If there are duplicates, that corresponds to a shifted distribution in which that
    number is more probable.


    ### Variance and Standard Deviation


    The expected value is not only useful for computing averages. We could toss any
    random variable expression into the [·] and compute valid expectations. This notion
    is exactly what we use to calculate a measurement called *variance*, which we
    define as


    ![$$ {\sigma}^2= Var\left[X\right]=\mathbbm{E}\left[{\left(X-\mu \right)}^2\right]
    $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equas.png)


    While the notation can look scary at first glance, it has a reasonably straightforward
    explanation. The variance measures the *spread* of a distribution. That is, it
    measures the average squared distance between the mean and all sample points.


    Squaring the distance makes sure that we add positive values together. If we were
    to allow negative values, it would come with some strange side effects. For example,
    the normal distribution (which is symmetrical around the mean) would have zero
    variance, even though it is evident that there are other sample points besides
    the one that happens to be the mean.


    Since the square can make it more challenging to draw conclusions from the variance,
    we also have a standard deviation measurement. The standard deviation is nothing
    more than the square root of the variance, which removes the square from our result
    while still keeping it nonnegative. Going back to the fair die example, we compute
    the variance and standard deviation like


    ![$$ {\sigma}^2= Var\left[X\right]={\left(1-3.5\right)}^2\cdotp \frac{1}{6}+{\left(2-3.5\right)}^2\cdotp
    \frac{1}{6}+\dots +{\left(6-3.5\right)}^2\cdotp \frac{1}{6}\approx 2.92 $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equat.png)


    ![$$ \sigma = Std\left[X\right]=\sqrt{2.92}\approx 1.71 $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equau.png)


    These numbers tell us that if we toss a large number of dice, we can expect the
    spread to be about 1.71 away from the mean value. The variances and standard deviations
    are used to a great extent when analyzing confidence intervals, and we will put
    them to use in the coming chapters.


    ## Chapter Summary


    This chapter has covered a lot of ground. We have learned how to categorize sample
    spaces and have seen how that gives rise to two distinct families of distributions
    – discrete and continuous ones. We have learned how to make calculations using
    probability mass functions, probability density functions, and cumulative distribution
    functions. We have also looked at some of the standard distributions used in statistics.


    Throughout this book, we will have a lot of use for the theoretical foundation
    we have built gained until now. The mean, variance, and standard deviation are
    widely used measurements for describing a distribution, and we will use them in
    the algorithms we build. Now that we have grasped some of the theoretical concepts
    we need, we move on to a chapter of more practical application. We will use regression
    techniques to develop an algorithm that predicts house sale prices based on data.


    # 4. Predicting House Sale Prices with Linear Regression


    So far, we have looked at statistics from the point of describing data. We have
    tried to find ways of distilling important properties of a potentially massive
    data set into one or a few numbers. While this approach is undoubtedly practical,
    we would also like to use the data to look into the future. Thus, we want to look
    at some sample points that have already happened and use them to predict what
    happens next. This chapter looks at one way of doing so – this chapter is all
    about linear regression.'
  trans: '

    ### 期望值


    期望值最常见的用途之一就是我们通常所说的平均值。我们对随机变量的期望定义如下：


    ![$$ \mathbbm{E}\left[X\right]=\sum \limits_{x\in S}x\cdotp p(x)\kern3.75em for\
    discrete\ distributions\mathbbm{E}\left[X\right]={\int}_{-\infty}^{\infty }x\cdotp
    f(x)\ dx\kern2em for\ continuous\ distributions $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equap.png)


    在这些公式中，`f(x)` 是连续分布的概率密度函数（PDF），而我们用 `p(x)` 表示离散分布的概率质量函数（PMF）。随机变量的期望会产生一个实数（至少对于本书中我们会遇到的分布而言是如此）。这个数不一定是随机变量样本空间的一部分。起初，考虑到它的名称，这一事实可能会让人觉得奇怪或违反直觉。难道期望不应该是用来计算一个分布的期望值吗？


    为了使这个概念更具体，我们将再次以骰子为例，计算几个期望值。我们首先关注一个公平的骰子，它每个面朝上的概率相等。其期望值为：


    ![$$ \mathbbm{E}\left[X\right]=1\cdotp \frac{1}{6}+2\cdotp \frac{1}{6}+\dots +6\cdotp
    \frac{1}{6}=3.5 $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equaq.png)


    正如我们所见，期望值落在两个样本点之间。这个数就是各个面点数的平均值。现在，想象一下有人对这个骰子动了手脚，使得掷出数字二的概率是其他数字的两倍。这种篡改意味着分布发生了变化，期望值变为：


    ![$$ \mathbbm{E}\left[X\right]=1\cdotp \frac{1}{7}+2\cdotp \frac{2}{7}+3\cdotp
    \frac{1}{7}+\dots +6\cdotp \frac{1}{7}\approx 3.2857 $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equar.png)


    新分布下的平均值小于均匀分布下的平均值。值变小是有道理的，因为使用这个骰子我们更有可能掷出较小的数字。需要注意的是，这完全等同于我们更熟悉的计算平均值的方法，即把一些数字加起来，再除以相加的个数。如果有重复的数字，那就对应着一个分布发生了偏移，使得该数字出现的概率更高。


    ### 方差与标准差


    期望值不仅可用于计算平均值。我们可以将任何随机变量表达式放入 `[·]` 中，并计算出有效的期望值。这个概念正是我们用来计算一种名为**方差**的度量指标的依据，其定义如下：


    ![$$ {\sigma}²= Var\left[X\right]=\mathbbm{E}\left[{\left(X-\mu \right)}²\right]
    $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equas.png)


    虽然这些符号乍一看可能令人畏惧，但它有一个相当直接的解释。方差度量的是分布的*离散程度*。也就是说，它衡量的是均值与所有样本点之间距离平方的平均值。


    对距离进行平方可以确保我们将正值加在一起。如果我们允许负值存在，就会产生一些奇怪的副作用。例如，正态分布（关于均值对称）的方差将为零，尽管很明显除了恰好是均值的那个点之外还有其他样本点。


    由于平方可能会使根据方差得出结论更具挑战性，因此我们还有标准差这个度量指标。标准差无非就是方差的平方根，它去掉了结果中的平方，同时仍然保证结果非负。回到公平骰子的例子，我们计算方差和标准差如下：


    ![$$ {\sigma}²= Var\left[X\right]={\left(1-3.5\right)}²\cdotp \frac{1}{6}+{\left(2-3.5\right)}²\cdotp
    \frac{1}{6}+\dots +{\left(6-3.5\right)}²\cdotp \frac{1}{6}\approx 2.92 $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equat.png)


    ![$$ \sigma = Std\left[X\right]=\sqrt{2.92}\approx 1.71 $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equau.png)


    这些数字告诉我们，如果投掷大量骰子，我们可以预期离散程度大约在距离均值 1.71 的范围内。方差和标准差在分析置信区间时被广泛使用，我们将在接下来的章节中用到它们。


    ## 章节总结


    本章内容涵盖甚广。我们学习了如何对样本空间进行分类，并看到了这如何催生出两类截然不同的分布——离散分布和连续分布。我们学习了如何使用概率质量函数、概率密度函数和累积分布函数进行计算。我们还了解了一些统计学中使用的标准分布。


    在本书的后续内容中，我们将大量运用迄今为止所构建的理论基础。均值、方差和标准差是描述分布时广泛使用的度量指标，我们将在构建的算法中使用它们。现在我们已经掌握了一些所需的理论概念，接下来我们将进入一个更偏向实际应用的章节。我们将使用回归技术来开发一个基于数据预测房屋销售价格的算法。


    # 4. 使用线性回归预测房屋销售价格


    到目前为止，我们都是从描述数据的角度来看待统计学的。我们试图找到将潜在海量数据集的重要属性提炼成一个或几个数字的方法。虽然这种方法无疑很实用，但我们也希望利用这些数据来展望未来。因此，我们希望查看一些已经发生的样本点，并用它们来预测接下来会发生什么。本章将研究实现这一目标的一种方法——本章全部关于线性回归。

    '
- fmt: '# Linear Regression


    Linear regression is an idea that, despite its complex name, is surprisingly straightforward.
    Using previous data points, we want to develop a linear equation that we can use
    to make decent predictions about new sample points. For example, if we know that
    one pound of apples costs `$1.3`, we can compute the price of buying `1.5` pounds.
    We use the implicit knowledge that not buying anything costs us nothing to create
    a linear relationship between the weight and the price – we perform a simple form
    of linear regression. This calculation assumes that a linear equation is appropriately
    able to describe the relationship between weight and cost. The function we use
    to predict the total price of apples comes out to


    ![$$ price_{apples}(x)=1.3x\kern0.75em ,\kern0.75em x\in {\mathbb{R}}_{\ge 0}
    $$](images/512351_1_En_4_Chapter/512351_1_En_4_Chapter_TeX_Equa.png)


    The kind of linear inter- or extrapolation we saw in the previous example has
    some benefits. First, it is simple to perform and works very well for many problems.
    Second, it is also very resource efficient since we don’t need to know the price
    for each individual pound of apples but only need to remember one formula.


    However, things become much more complicated when we introduce real-world data.
    Such sample points are often noisy and do not fit as nicely into this type of
    tidy mathematical model. For example, take a look at the data set visualized in
    Figure [4-1](#512351_1_En_4_Chapter.xhtml#Fig1).


    ![../images/512351_1_En_4_Chapter/512351_1_En_4_Fig1_HTML.png](images/512351_1_En_4_Chapter/512351_1_En_4_Fig1_HTML.png)


    Figure 4-1


    An example of a noisy data set


    The data in Figure [4-1](#512351_1_En_4_Chapter.xhtml#Fig1) looks much more like
    what we would expect from a real-world sample set. The samples come from the following
    function:


    ![$$ f(x)=x+\epsilon \kern0.75em ,\kern0.75em \epsilon \sim Normal\left(0,1\right)
    $$](images/512351_1_En_4_Chapter/512351_1_En_4_Chapter_TeX_Equb.png)


    This formula is a basic linear equation, but it has a variable tagged onto the
    end. The `𝝐` is a noise term that adds a random number sampled from a standard
    normal distribution. This type of added randomness is commonly called Gaussian
    noise. We can see that the data has a linear tendency, but we cannot connect all
    points with a single straight line. We need to take another approach to make sense
    of this data.


    ## Splines


    A spline is a mathematical concept that builds on the idea of interpolation. It
    is different from regression but will act as a stepping stone while developing
    an intuition for how the technique works and why we need it.


    In the case of linear splines, we treat each adjacent pair of points as the endpoints
    of a range with linear properties, and we connect them with a straight line. Thus,
    applying it to the previous data set will look like Figure [4-2](#512351_1_En_4_Chapter.xhtml#Fig2).


    ![../images/512351_1_En_4_Chapter/512351_1_En_4_Fig2_HTML.png](images/512351_1_En_4_Chapter/512351_1_En_4_Fig2_HTML.png)


    Figure 4-2


    Using linear splines to connect the adjacent sample points by straight line segments


    As we can see, the line is nowhere close to straight when looking at it as a single
    unit. However, imagine that we want to predict the value for the number `8.4`.
    We would determine that it falls between the original sample points at eight and
    nine and, consequently, use the linear equation for the spline between those points.
    In this particular case, that equation is


    ![$$ f_{8,9}(x)\approx 8+0.113\cdotp \left(x-8\right) $$](images/512351_1_En_4_Chapter/512351_1_En_4_Chapter_TeX_Equc.png)


    ![$$ f_{8,9}(8.4)\approx 8+0.113\cdotp \left(8.4-8\right)\approx 8.045 $$](images/512351_1_En_4_Chapter/512351_1_En_4_Chapter_TeX_Equd.png)


    Overall, this approximation is not half bad. However, there are a few scenarios
    where we run into trouble. A few of them are:


    * The spline approach forces us to remember parts of the original data to determine
    which linear equation to use on different intervals. That memory is not a horrible
    issue if there are few data points, but it quickly becomes unwieldy on data sets
    that contain millions or billions of entries.


    * If we try to make a prediction for a value greater than `20`, we end up using
    the same linear equation that defines values between `19` and `20`. Since that
    equation has a negative coefficient in this example, we will make smaller predictions
    farther up the number line. Such predictions are a problem since the general trend
    is positive. We can make the same argument for predictions on values that are
    less than one in this example.


    We conclude that using splines is a reasonable approach on somewhat small data
    sets and that they can produce good results as long as they get to interpolate.
    However, they are not ideal for larger data sets or when they have to extrapolate
    outside of the domain for which they have already seen data. To improve our methods,
    we need to address these issues in some way.


    ## Regression Techniques


    To make better predictions, we need to address the issues we just lined out. We
    want a method with two properties in a situation like this, where we can see a
    clear linear tendency in the data:


    * It should follow the general trend of the data. A noisy measurement should not
    cause our model to change direction and go against that trend, neither inside
    nor outside the range where we have samples.


    * We want low computational overhead. Ideally, we would like to distill the essential
    properties of our original samples into a few coefficients that can form the basis
    of a linear equation.


    Given these properties, our goal is to find the linear equation that best fits
    the available data. Remember that the general formulation of a straight line is


    ![$$ f(x)= kx+m $$](images/512351_1_En_4_Chapter/512351_1_En_4_Chapter_TeX_Eque.png)


    Since `x` represents the new sample we want to make predictions about, our mission
    is to determine the variables `k` and `m` such that they place `f(x)` as close
    to the true value as possible. To do so, we need to define a way of measuring
    how well we are doing.'
