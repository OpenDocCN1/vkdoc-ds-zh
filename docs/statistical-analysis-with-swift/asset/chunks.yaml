  trans: '

    # 线性回归


    线性回归这个概念，尽管名称复杂，但其思想却出奇地简单。我们利用已有的数据点，来建立一个线性方程，用以对新样本点进行合理的预测。例如，如果我们知道一磅苹果的价格是`$1.3`，我们就可以计算出购买`1.5`磅的价格。我们利用“不买东西就无需付费”这一隐含知识，在重量和价格之间建立了一种线性关系——这实际上就是执行了一种简单的线性回归。这个计算过程假设线性方程能够恰当地描述重量与成本之间的关系。我们用来预测苹果总价的函数如下：


    ![$$ price_{apples}(x)=1.3x\kern0.75em ,\kern0.75em x\in {\mathbb{R}}_{\ge 0}
    $$](img/512351_1_En_4_Chapter_TeX_Equa.png)


    我们在上一个例子中看到的那种线性内插或外推方法有一些好处。首先，它易于执行，并且对许多问题都很有效。其次，它的资源效率非常高，因为我们无需记住每磅苹果的具体价格，只需要记住一个公式即可。


    然而，一旦引入真实世界的数据，情况就会变得复杂得多。这些样本点通常带有噪声，很难完美地契合到这种规整的数学模型中。例如，看看图 4-1 中可视化的数据集。


    ![../images/512351_1_En_4_Chapter/512351_1_En_4_Fig1_HTML.png](img/512351_1_En_4_Fig1_HTML.png)


    图 4-1


    一个噪声数据集的示例


    图 4-1 中的数据看起来更符合我们对真实世界样本集的预期。这些样本来自于以下函数：


    ![$$ f(x)=x+\epsilon \kern0.75em ,\kern0.75em \epsilon \sim Normal\left(0,1\right)
    $$](img/512351_1_En_4_Chapter_TeX_Equb.png)


    这个公式是一个基本的线性方程，但在其末尾附加了一个变量。`𝝐` 是一个噪声项，它加上了一个从标准正态分布中采样的随机数。这种添加随机性的方式通常被称为高斯噪声。我们可以看到数据具有线性趋势，但我们无法用一条直线连接所有点。我们需要采取另一种方法来理解这些数据。


    ## 样条


    样条是一种建立在插值思想之上的数学概念。它不同于回归，但可以作为一块垫脚石，帮助我们理解这种方法的工作原理以及为什么需要它。


    在线性样条的情况下，我们将每一对相邻的点视为一个具有线性性质的区间的端点，并用一条直线将它们连接起来。因此，将其应用于之前的数据集，结果将如图 4-2 所示。


    ![../images/512351_1_En_4_Chapter/512351_1_En_4_Fig2_HTML.png](img/512351_1_En_4_Fig2_HTML.png)


    图 4-2


    使用线性样条通过直线段连接相邻样本点


    正如我们所看到的，当把这条线看作一个整体时，它完全不是一条直线。然而，假设我们想预测数值 `8.4` 对应的值。我们会确定它落在原始样本点 8 和 9 之间，因此，我们使用介于这两点之间的样条所对应的线性方程。在这个特定案例中，该方程是


    ![$$ f_{8,9}(x)\approx 8+0.113\cdotp \left(x-8\right) $$](img/512351_1_En_4_Chapter_TeX_Equc.png)


    ![$$ f_{8,9}(8.4)\approx 8+0.113\cdotp \left(8.4-8\right)\approx 8.045 $$](img/512351_1_En_4_Chapter_TeX_Equd.png)


    总的来说，这种近似效果还不错。然而，在一些场景下我们会遇到麻烦。其中几个场景是：


    *   样条方法迫使我们记住部分原始数据，以便确定在不同区间使用哪个线性方程。如果数据点很少，这算不什么大问题，但对于包含数百万或数十亿条记录的数据集，这很快就会变得难以处理。


    *   如果我们尝试对大于 `20` 的值进行预测，我们最终会使用定义 `19` 和 `20` 之间数值的同一个线性方程。由于在这个例子中该方程具有负系数，那么在数轴上越靠后的位置，我们做出的预测值会越小。鉴于总的趋势是正向的，这种预测就会成为问题。同样地，在这个例子中，对小于
    1 的值进行预测也会遇到类似的问题。


    我们总结出，使用样条对于规模较小的数据集是一种合理的方法，并且只要是在进行内插，就能产生良好的结果。然而，对于较大的数据集，或者当需要进行外推（即预测超出已有数据范围的值）时，它们就不太理想了。为了改进我们的方法，我们需要以某种方式解决这些问题。


    ## 回归技术


    为了做出更好的预测，我们需要解决刚刚列出的问题。在像这样能够观察到数据具有明显线性趋势的情况下，我们希望一种方法具备两个特性：


    *   它应该遵循数据的总体趋势。一个带有噪声的测量值不应导致我们的模型改变方向而去违背该趋势——无论是在我们有样本的范围内还是范围外。


    *   我们希望计算开销低。理想情况下，我们希望将原始样本的基本特征提炼成少数几个系数，这些系数能够构成一个线性方程的基础。


    基于这些特性，我们的目标是找到最适合现有数据的线性方程。请记住，一条直线的通用公式是


    ![$$ f(x)= kx+m $$](img/512351_1_En_4_Chapter_TeX_Eque.png)


    由于 `x` 代表我们想要预测其值的新样本，我们的任务是确定变量 `k` 和 `m`，使得 `f(x)` 尽可能接近真实值。为此，我们需要定义一种衡量我们预测效果好坏的方法。

    '
- fmt: '### Loss Function


    The responsibility of a loss function is, as the name implies, to give us an indication
    of the loss that our current model incurs. A good model should have a low loss
    value, indicating that it makes predictions that are very close to the measured
    value of a data point. On the flip side, we want the loss function to return a
    large number when we make terrible predictions.


    One of the main challenges when creating and optimizing models is to design a
    suitable loss function. The included parameters reflect which pieces of information
    are important to us. For example, if we want to determine a house’s sale price
    by its square footage, but the loss function only includes the number of rooms,
    we will never make any good predictions.


    Going back to our example data, we want to minimize the collective distance between
    our predictions and the measured values in the data. For example, if the target
    value is four, but we predict that it should be three, the distance (or error)
    is one. By summing over all the errors generated by our model, we can put a number
    on how well it is doing. We also want to avoid that positive and negative errors
    cancel out and cause the loss function to become confused. Denoting the number
    of sample points in our data set by `N` and the observed value of a sample by
    `y`, we can set up the following loss function `ℒ` that satisfies our needs:


    ![$$ \mathcal{L}=\sum_{i=1}^N{\left({y}_i-f\left({x}_i\right)\right)}^2=\sum_{i=1}^N{\left({y}_i-k{x}_i-m\right)}^2
    $$](images/512351_1_En_4_Chapter/512351_1_En_4_Chapter_TeX_Equf.png)


    We commonly refer to the previous function as the sum of squares error. The square
    ensures that the error between a prediction and the target value is always positive.
    It also maintains the ordering. Thus, if we denote the errors for two points by
    `e[1]` and `e[2]`, then


    ![$$ {e}_1&lt;{e}_2\kern0.75em \Longrightarrow \kern0.75em {\left({e}_1\right)}^2&lt;{\left({e}_2\right)}^2
    $$](images/512351_1_En_4_Chapter/512351_1_En_4_Chapter_TeX_Equg.png)


    Maintaining this relationship is essential. Introducing a transformation that
    breaks this ordering could have unintended consequences since good predictions
    would contribute more to the loss than bad ones.


    Now that we have decided on a loss function that satisfies what we want to accomplish,
    we can start the optimization phase. We consider `k` and `m` to be our variables
    since those are the ones we are interested in optimizing. We begin by computing
    the Hessian matrix of `ℒ` with respect to `k` and `m`, which comes out to


    ![$$ {\boldsymbol{H}}_{\mathbf{\mathcal{L}}}=\left[\ \begin{array}{cc}\frac{\partial^2\mathcal{L}}{\partial
    {k}^2}&amp; \frac{\partial^2\mathcal{L}}{\partial k\ \partial m}\\ {}\frac{\partial^2\mathcal{L}}{\partial
    m\ \partial k}&amp; \frac{\partial^2\mathcal{L}}{\partial {m}^2}\end{array}\kern0.5em
    \right]=\left[\begin{array}{cc}2\sum_{i=1}^N{\left({x}_i\right)}^2&amp; 2\sum_{i=1}^N\left({x}_i\right)\\
    {}2\sum_{i=1}^N\left({x}_i\right)&amp; 2N\end{array}\right] $$](images/512351_1_En_4_Chapter/512351_1_En_4_Chapter_TeX_Equh.png)


    The Hessian is a square matrix of second-order partial derivatives which describes
    the curvature of a function. We continue to compute the eigenvalues of this matrix
    and find that


    ![$$ \det \left(\ {\boldsymbol{H}}_{\mathcal{L}}-\lambda \cdotp \boldsymbol{I}\right)=0
    $$](images/512351_1_En_4_Chapter/512351_1_En_4_Chapter_TeX_Equi.png)


    ![$$ {\lambda}^2-2\lambda \left(\sum_{i=1}^N{\left({x}_i\right)}^2+N\right)=0
    $$](images/512351_1_En_4_Chapter/512351_1_En_4_Chapter_TeX_Equj.png)


    ![$$ \lambda =\left(\sum_{i=1}^N{\left({x}_i\right)}^2+N\right)\pm \left(\sum_{i=1}^N{\left({x}_i\right)}^2+N\right)
    $$](images/512351_1_En_4_Chapter/512351_1_En_4_Chapter_TeX_Equk.png)


    ![$$ {\lambda}_1=0,\kern0.5em {\lambda}_2=2\Big(N+\sum_{i=1}^N\left({x}^2\right)
    $$](images/512351_1_En_4_Chapter/512351_1_En_4_Chapter_TeX_IEq1.png))


    While the first eigenvalue is a scalar, we have to analyze the second one a little
    bit further. We can tell that `N` will always be positive since we will always
    have at least one sample point. We also know that any summation over squared values
    is positive. These realizations lead us to conclude that the second eigenvalue
    must be positive and that the Hessian matrix is, therefore, positive semi-definite.
    As we will see next, this has an impact on our ability to find an optimal solution.


    Apart from determining the positive semi-definiteness of `H[ℒ]`, we also need
    to determine whether the domain of our loss function is convex.


    ![$$ A\ set\ D\ is\ convex\ if, for\ any\ {x}_1,{x}_2\in D\ and\ any\ real\ valued\
    \theta \in \left[0,1\right], \\ the\ following\ holds: $$](images/512351_1_En_4_Chapter/512351_1_En_4_Chapter_TeX_Equl.png)


    ![$$ \theta {x}_1+\left(1-\theta \right){x}_2\in D $$](images/512351_1_En_4_Chapter/512351_1_En_4_Chapter_TeX_Equm.png)


    The preceding theorem states that a set is convex if we can pick and combine any
    two elements and still end up inside the same collection. Figure [4-3](#512351_1_En_4_Chapter.xhtml#Fig3)
    shows a visualization of this concept. No matter which two points we choose inside
    the circle, the straight line between them only moves through other elements of
    the same set.


    ![../images/512351_1_En_4_Chapter/512351_1_En_4_Fig3_HTML.png](images/512351_1_En_4_Chapter/512351_1_En_4_Fig3_HTML.png)


    **Figure 4-3** A filled circle is a convex set because the line between any two
    points moves only through other included points


    The real numbers, `ℝ`, is a convex set. No matter which two numbers we choose,
    their convex combination is always another real-valued number. We can conclude
    that the domain of our problem is convex. With the Hessian matrix being positive
    semi-definite, this conclusion is a good thing for us. It means that if we can
    find an optimal solution to our problem, it is guaranteed to be a global optimum.'
