  trans: '

    ### 正态分布


    法国数学家亚伯拉罕·棣莫弗在 18 世纪首次描述了正态分布。这一发现在相当长一段时间内未被重视，直到被卡尔·弗里德里希·高斯和皮埃尔-西蒙·拉普拉斯“重新发现”。它通常也被称为高斯分布或钟形曲线，因为其形状像一口钟。


    我们可以通过均值和标准差来定义一个正态分布。均值，用希腊字母 `μ` 表示，决定了分布中最常见的数值。该值位于曲线的中心，曲线在该点两侧呈对称形状。标准差，用
    `σ` 表示，描述了钟形的“宽度”。`σ` 值越大，意味着样本点往往离均值越远，而 `σ` 越小，则说明样本通常更接近均值。我们将在本章后面更深入地探讨这些概念。目前，有一个高层次的直觉理解就足够了。


    图 3-7 展示了两个具有相同参数 `μ`、但不同 `σ` 的正态分布。请注意 `σ` 参数如何使得均值附近的概率降低，而离均值较远的样本概率却变得更大。`DistributionsApp`
    项目也提供了一个工具，用于测试不同参数值如何改变样本点的概率。


    ![../images/512351_1_En_3_Chapter/512351_1_En_3_Fig7_HTML.png](img/512351_1_En_3_Fig7_HTML.png)


    图 3-7


    两个具有不同参数的正态分布


    要使用正态分布进行计算，我们需要知道其概率密度函数（PDF）：


    ![$$ f(x)=\frac{1}{\sigma \sqrt{2\pi }}{e}^{-\frac{1}{2}{\left(\frac{x-\mu }{\sigma}\right)}²}
    $$](img/512351_1_En_3_Chapter_TeX_Equak.png)


    这个公式给出了任何样本点的相对似然值。值得注意的是，这个特定的样本空间包含所有实数，范围从负无穷到正无穷。然而，要计算一个样本落在某个区间内的概率，我们需要计算一个积分：


    ![$$ P\left[{x}_1&lt;X&lt;{x}_2\right]={\int}_{x_1}^{x_2}\frac{1}{\sigma \sqrt{2\pi
    }}{e}^{-\frac{1}{2}{\left(\frac{x-\mu }{\sigma}\right)}²} dx $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equal.png)


    我们很快意识到，这比计算指数分布要复杂得多。不幸的是，使用累积分布函数（CDF）并采用与指数分布相同的技巧对我们并没有帮助。让我们看看这个函数，以理解原因：


    ![$$ P\left[X&lt;x\right]=\frac{1}{2}\left[1+\operatorname{erf}\left(\frac{x-\mu
    }{\sigma \sqrt{2}}\right)\right] $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equam.png)


    如我们所见，这是一个非常复杂的函数。正态分布的 CDF 依赖于高斯误差函数，通常记为 `erf(z)`。这是一个以如下方式定义的复杂函数：


    ![$$ \operatorname{erf}(z)=\frac{2}{\sqrt{\pi }}{\int}_0^z{e}^{-{t}²} dt $$](img/512351_1_En_3_Chapter_TeX_Equan.png)


    误差函数也包含一个积分，并且并不比我们上一页看到的积分更容易计算。幸运的是，研究人员已经开发出以惊人精度逼近误差函数的方法。由米尔顿·阿布拉莫维茨和艾琳·斯特根编写的《数学函数手册：公式、图表和数学用表》（1964
    年，第 299 页）包含了一个由小塞西尔·黑斯廷斯设计的逼近误差函数的公式。该公式计算成本相对较低且易于实现，使其非常适合我们的需求。清单 3-6 提供了一个实现，清单
    3-7 使用该实现来逼近正态分布的 CDF。


    ```

    func normalCDF(

    x: Double,

    mu: Double,

    sigma: Double

    ) -> Double {

    let z = (x - mu) / (sigma * sqrt(2))

    return 0.5 * (1 + erf(z))

    }

    print(

    """

    标准正态分布

    P[X < 0] = \(normalCDF(x: 0, mu: 0, sigma: 1))

    """

    )

    // 输出:

    // 标准正态分布

    // P[X < 0] = 0.5000000005

    清单 3-7

    使用高斯误差函数逼近计算正态分布 CDF

    ```


    ```

    import Darwin

    let p = 0.3275911

    let coefficients = [

    0.254829592,

    -0.284496736,

    1.421413741,

    -1.453152027,

    1.061405429

    ]

    let exponents = (1 ... coefficients.count)

    .map(Double.init)

    func erf(_ z: Double) -> Double {

    let sign = (z.sign == .plus) ? 1.0 : -1.0

    let absZ = abs(z)

    let t = 1 / (1 + p * absZ)

    let powerSeries = zip(coefficients, exponents)

    .reduce(into: 0.0) { (result, zipped) in

    let (coefficient, exponent) = zipped

    result += coefficient * pow(t, exponent)

    }

    let tail = powerSeries * exp(-pow(absZ, 2))

    return sign * (1 - tail)

    }

    清单 3-6

    逼近高斯误差函数

    ```


    清单 3-7 中 CDF 的真实解为 0.5，而我们的逼近结果得到 0.5000000005。我们对这个误差可以接受，因为它对我们正在计算的总体似然度影响不大。该实现还提供了通过使用与指数分布相同的技巧来计算落入特定数值区间内的概率的能力：


    ![$$ P\left[{x}_1&lt;X&lt;{x}_2\right]=P\left[X&lt;{x}_2\right]-P\left[X&lt;{x}_1\right]
    $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equao.png)


    逼近通常让人觉得粗糙且不精确。然而，这是我们必须接受并拥抱的现实。由于位宽的限制，现代计算机上进行的许多计算最终都是近似值。公平地说，许多我们可能认为是精确的数学公式，本质上也是对经验测量的近似。


    我们现在已经了解了一些最常见的标准分布。当然，还有比这多得多的分布。然而，这些概念也同样适用于它们。为了结束本章，让我们再看一下分布的几个性质。这些将在本书后面用到，我们必须了解它们是什么。

    '
- fmt: '### Expected Value


    One of the most common uses of an expected value is what we usually refer to as
    an average. We define the expectation of a random variable like


    ![$$ \mathbbm{E}\left[X\right]=\sum \limits_{x\in S}x\cdotp p(x)\kern3.75em for\
    discrete\ distributions\mathbbm{E}\left[X\right]={\int}_{-\infty}^{\infty }x\cdotp
    f(x)\ dx\kern2em for\ continuous\ distributions $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equap.png)


    In these formulas, `f(x)` is the PDF of a continuous distribution, while we use
    `p(x)` to denote the PMF of a discrete distribution. The expectation of a random
    variable yields a real number (at least for the distributions we’ll encounter
    in this book). This number does not have to be part of the sample space of the
    random variable. This fact might feel strange or counterintuitive at first, given
    the name. Isn’t the expectation supposed to compute the expected value of a distribution?


    To make this concept more tangible, we will revisit the die and compute a few
    expectations. We start by focusing on a fair die, which has an equal chance of
    landing with either face up. The expectation becomes


    ![$$ \mathbbm{E}\left[X\right]=1\cdotp \frac{1}{6}+2\cdotp \frac{1}{6}+\dots +6\cdotp
    \frac{1}{6}=3.5 $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equaq.png)


    As we can see, the expectation falls in between two of the sample points. This
    number is the average of the marks on the faces. Now, imagine that someone tampers
    with the die, making it twice as likely to see a two than any other number. This
    meddling means that the distribution shifts and that the expectation becomes


    ![$$ \mathbbm{E}\left[X\right]=1\cdotp \frac{1}{7}+2\cdotp \frac{2}{7}+3\cdotp
    \frac{1}{7}+\dots +6\cdotp \frac{1}{7}\approx 3.2857 $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equar.png)


    The average under the new distribution is less than under the uniform one. A lower
    value makes sense since we are more likely to see lower numbers with this die.
    One thing to note is that this is exactly equivalent to the more familiar way
    of computing a mean, where we add up some numbers and divide by how many we added.
    If there are duplicates, that corresponds to a shifted distribution in which that
    number is more probable.


    ### Variance and Standard Deviation


    The expected value is not only useful for computing averages. We could toss any
    random variable expression into the `[·]` and compute valid expectations. This
    notion is exactly what we use to calculate a measurement called *variance*, which
    we define as


    ![$$ {\sigma}^2= Var\left[X\right]=\mathbbm{E}\left[{\left(X-\mu \right)}^2\right]
    $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equas.png)


    While the notation can look scary at first glance, it has a reasonably straightforward
    explanation. The variance measures the *spread* of a distribution. That is, it
    measures the average squared distance between the mean and all sample points.


    Squaring the distance makes sure that we add positive values together. If we were
    to allow negative values, it would come with some strange side effects. For example,
    the normal distribution (which is symmetrical around the mean) would have zero
    variance, even though it is evident that there are other sample points besides
    the one that happens to be the mean.


    Since the square can make it more challenging to draw conclusions from the variance,
    we also have a standard deviation measurement. The standard deviation is nothing
    more than the square root of the variance, which removes the square from our result
    while still keeping it nonnegative. Going back to the fair die example, we compute
    the variance and standard deviation like


    ![$$ {\sigma}^2= Var\left[X\right]={\left(1-3.5\right)}^2\cdotp \frac{1}{6}+{\left(2-3.5\right)}^2\cdotp
    \frac{1}{6}+\dots +{\left(6-3.5\right)}^2\cdotp \frac{1}{6}\approx 2.92 $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equat.png)


    ![$$ \sigma = Std\left[X\right]=\sqrt{2.92}\approx 1.71 $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equau.png)


    These numbers tell us that if we toss a large number of dice, we can expect the
    spread to be about 1.71 away from the mean value. The variances and standard deviations
    are used to a great extent when analyzing confidence intervals, and we will put
    them to use in the coming chapters.


    ## Chapter Summary


    This chapter has covered a lot of ground. We have learned how to categorize sample
    spaces and have seen how that gives rise to two distinct families of distributions
    – discrete and continuous ones. We have learned how to make calculations using
    probability mass functions, probability density functions, and cumulative distribution
    functions. We have also looked at some of the standard distributions used in statistics.


    Throughout this book, we will have a lot of use for the theoretical foundation
    we have built gained until now. The mean, variance, and standard deviation are
    widely used measurements for describing a distribution, and we will use them in
    the algorithms we build. Now that we have grasped some of the theoretical concepts
    we need, we move on to a chapter of more practical application. We will use regression
    techniques to develop an algorithm that predicts house sale prices based on data.


    # 4. Predicting House Sale Prices with Linear Regression


    So far, we have looked at statistics from the point of describing data. We have
    tried to find ways of distilling important properties of a potentially massive
    data set into one or a few numbers. While this approach is undoubtedly practical,
    we would also like to use the data to look into the future. Thus, we want to look
    at some sample points that have already happened and use them to predict what
    happens next. This chapter looks at one way of doing so – this chapter is all
    about linear regression.'
