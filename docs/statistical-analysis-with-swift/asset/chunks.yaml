    Now that we can compress an arbitrary text string, we need to devise an algorithm
    that reverses the process. The following section will discuss and create an algorithm
    to decompress the bits and turn them into UTF-8 bytes.


    ### The Decompression Stage


    Before we dive into implementing a decompression algorithm, let us take a step
    back and analyze the structure of the data object we have encoded.


    *   Four or eight bytes specify the number of bits used to encode the text. The
    exact number of bytes is dependent on our platform. On 32-bit platforms, Int takes
    4 bytes, while it takes 8 bytes on 64-bit platforms.


    *   Some arbitrary number of bytes define the Huffman tree we used to encode the
    original text. While we may not know precisely how many bytes it consists of,
    we know that it starts right after the bytes that specify bitlength, and we know
    that it is structured in a fashion that allows recursive unpacking.


    *   Another arbitrary number of bytes contains the encoded message. We can compute
    its start location in memory by calculating the size of the two previous data
    sections and can extract all the remaining data from there.


