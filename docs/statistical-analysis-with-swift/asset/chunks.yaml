    一个由两个贝塔分布线性组合构成的分布


    ![../images/512351_1_En_5_Chapter/512351_1_En_5_Fig3_HTML.png](img/512351_1_En_5_Fig3_HTML.png)


    图 5-3


    根据图 5-2 中的伽马分布计算出的 1000 个样本均值的分布，以及参数为 `μ ≈ 0.994` 和 `σ ≈ 0.102` 的正态分布叠加图


    ![../images/512351_1_En_5_Chapter/512351_1_En_5_Fig2_HTML.png](img/512351_1_En_5_Fig2_HTML.png)


    图 5-2


    参数为 `α = 3` 和 `β = 3` 的伽马分布


    我们首先来讨论伽马分布。将所有 1000 个样本均值绘制成直方图后，我们会发现这个分布呈钟形。当将其与我们根据估计参数 `μ` 和 `σ` 得到的正态分布进行比较时，可以看到两者非常吻合。我们还可以注意到，估计均值
    `μ` 非常接近该分布的真实均值（即 1）。有人可能会认为，这个特定的伽马分布看起来有点像偏态正态分布，因此近似效果更好。然而，观察后续的图表，我们会发现情况并非如此。


    两个贝塔分布的线性组合形成了一个有趣的形状。它有两个峰值，且完全不像正态分布。尽管如此，计算样本量为 30 的 1000 个样本均值并绘制成直方图后，得到的分布与伽马分布例子中的形状非常相似。将其与正态分布曲线进行比较，我们发现，尽管两者的拟合程度不如第一个例子那么好，但考虑到原始分布如此奇特，这种匹配效果仍然令人印象深刻。


    既然我们知道正态分布可以近似表示样本均值的分布，那么我们就可以讨论什么是尾部了：


    - **左尾检验**关心样本均值需要小到何种程度才会被视为统计异常值。也就是说，它需要比 `μ` 低多少，才小到不可能是偶然出现的？

    - **右尾检验**描述了相反的情况：样本均值需要大到何种程度，才大到不可能是巧合？

    - **双尾检验**关心的是样本均值需要与 `μ` 在任何方向上相差多少，我们才能有把握地说这绝非随机事件。


    在掌握了这些理论之后，我们就可以确定什么是“不太可能”，并开始检验一些假设了！


    ## 检验假设


    我们刚刚介绍的工具和理论几乎就是判断大学院长的说法是否正确所需的一切。我们从提出原假设和备择假设开始。在这个案例中，我们正在调查一项主张，即院长所带的学生智力高于平均水平。原假设必须是其对立面，即他们的智力等于或低于平均水平。根据韦氏成人智力量表（WAIS），平均智力得分为
    100，因此我们得到：


    ![$$ {H}_0:\kern1em \mu \le 100 $$](img/512351_1_En_5_Chapter_TeX_Equi.png)


    ![$$ {H}_1:\kern1em \mu &gt;100 $$](img/512351_1_En_5_Chapter_TeX_Equj.png)


    下一步是决定我们对自己的判断要有多少把握。假设我们最终认为这些大学学生的智力确实高于平均水平。在这种情况下，我们希望将所抽样的学生都来自校园智商最高群体的可能性降到最低。我们需要确定一个置信水平和阿尔法值。


    ### 确定置信水平


    置信水平通常用字母 `c` 表示，它决定了我们需要对结果有多大的把握才能拒绝原假设。它告诉我们在备择假设变得比原假设更可能成立之前，检验统计量必须与 `μ`
    偏离多少。如果我们决定要有 95% 的把握，那么


    ![$$ c=0.95 $$](img/512351_1_En_5_Chapter_TeX_Equk.png)


    置信水平不仅能告诉我们拒绝和保留原假设的界限划在哪里，而且在向他人解释我们的决定时，它也能为我们的决策提供合理性依据。如果我们最终拒绝原假设，从而认为这些大学的学生比平均水平更聪明，那么置信水平为
    0.95 就意味着我们至少有 95% 的把握认为这个决定是正确的。


    ### 确定阿尔法值


    与置信水平相对的是阿尔法值，用希腊字母 `α` 表示。我们将其定义为


    ![$$ \alpha =1-c $$](img/512351_1_En_5_Chapter_TeX_Equl.png)


    如果我们想要 0.95 的置信水平，那么 `α` 就是 0.05。置信水平规定了我们对结果的确信程度，而阿尔法则从相反的方向起作用。在这种情况下，它表示来自
    `H[0]` 的分布产生一个比我们计算出的样本均值更极端的样本均值的概率只有 5%。


    ### 执行检验


    我们决定置信水平为 0.95，这相应地意味着阿尔法值为 0.05。被抽样的学生得出的平均得分为 105。韦氏成人智力量表呈正态分布，其中 `μ = 100`
    且 `σ = 15`。我们想知道，这个 WAIS 分布产生一个大于 105 的样本均值的概率有多大——即：


    ![$$ P\left[x&gt;105\right]=1-P\left[x&lt;105\right] $$](images/512351_1_En_5_Chapter/512351_1_En_5_Chapter_TeX_Equm.png)


    如果这个概率小于 5%，那么我们就可以自信地拒绝原假设，并确认院长的说法很可能是正确的。代码清单 5-3 展示了一个小型的 Swift 程序，用于计算并打印我们想要的信息。


    ```

    let numberOfStudents = 30.0

    let WAISAverage = 100.0

    let WAISSD = 15.0

    let computedAverageScore = 105.0

    let sdScalar = sqrt(numberOfStudents.realValue)

    let normalDist = NormalDistribution(

    mean: WAISAverage,

    standardDeviation: WAISSD / sdScalar

    )

    let probability = 1 - normalDist.cdf(x: computedAverageScore)

    let confidence = 1 - probability

    let probString = String(

    format: "%.2f",

    probability * 100

    )

    let confString = String(

    format: "%.2f",

    confidence * 100

    )

    print(

    """

    计算出的平均得分属于原假设的概率为 \(probString)%。

    如果我们拒绝原假设，我们可以有 \(confString)% 的把握！

    """

    )

    // 输出：

    // 计算出的平均得分属于原假设的概率为 3.39%。

    // 如果我们拒绝原假设，我们可以有 96.61% 的把握！

    ```


    代码清单 5-3


    正如我们所见，在 WAIS 测试中平均得分达到 105 并不像人们可能想象的那样常见。如果我们选择拒绝原假设，我们犯错的概率只有 3.4%——这相应地意味着我们可以有大约
    96.6% 的把握确定自己是对的。既然我们想要至少 95% 的把握，那么我们可以告诉院长，他们完全有理由为这些学生感到骄傲。


    代码项目中的第 5 章包含一个名为 `IQHypothesisTest.swift` 的 SwiftUI 视图，它可以根据我们在不同字段中输入的值来计算并显示这个结果。请随意尝试一下，看看样本量、计算出的平均值以及原假设值如何影响我们拒绝
    `H[0]` 这一决策的置信度。

