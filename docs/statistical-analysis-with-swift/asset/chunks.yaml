  trans: "\n# 贝叶斯定理\n\n托马斯·贝叶斯牧师是 18 世纪的统计学家和长老会牧师。以他命名的定理用于计算条件概率`P[E[1]|E[2]]`。清单\
    \ 2-4 中的示例比较宽容。我们很快就能找出`P[roll[1] = 4 | roll[1] ∈ {2, 4, 6}]`的正确值，从而完成所有计算。然而，在许多情况下，这些值要难找得多。让我们通过一个玩具示例来探讨这样一种情况：\n\
    \n> *一个气象站每天测量温度和日照情况。在一年的时间里，40%的日子气温超过 20°C，而 50%的日子是晴天。60%的晴天里气温超过 20°C。如果今天气象站显示气温为\
    \ 22°C，那么出太阳的概率是多少？*\n\n我们想要在室外气温高于 20°C 的条件下，确定出太阳的概率。用数学符号表示，我们要找的是：\n\n`P[天气\
    \ = 晴天 | 温度 > 20]`\n\n快速盘点已知信息，我们已知以下条件：\n\n- `P[温度 > 20] = 0.4`\n- `P[天气 = 晴天]\
    \ = 0.5`\n- `P[温度 > 20 | 天气 = 晴天] = 0.6`\n\n虽然最后一个表达式与我们感兴趣的非常相似，但并不完全正确。然而，正如我们即将看到的，这三个表达式合起来足以提供计算所需概率的信息。\n\
    \n在关于条件概率的部分，我们看到可以用以下公式表示两个事件同时发生的概率：\n\n`P[E[1] ∩ E[2]] = P[E[2] | E[1]] P[E[1]]`\n\
    \n不过，我们以哪个事件为条件并不重要。以下“反转”后的表达式同样有效，因为我们只需交换条件事件即可：\n\n`P[E[1] ∩ E[2]] = P[E[1]\
    \ | E[2]] P[E[2]]`\n\n这一认识恰恰是贝叶斯定理所利用的。现在我们有了两个等式，其左边相等，因此我们也可以通过代入法将两个右边等同起来：\n\
    \n`P[E[1] | E[2]] P[E[2]] = P[E[2] | E[1]] P[E[1]] ⟺ P[E[1] | E[2]] = (P[E[2]\
    \ | E[1]] P[E[1]]) / P[E[2]]`\n\n我们刚刚推导出了贝叶斯法则，这是统计分析中应用最广泛的公式之一。回到我们的天气示例，现在我们有了计算所需概率的方法。我们只需将事件代入贝叶斯法则即可，得到以下表达式（为简洁起见，我们省略一些繁复的符号，因为所讨论的事件仍然很清楚）：\n\
    \n`P[晴天 | 温度 > 20] = (P[温度 > 20 | 晴天] P[晴天]) / P[温度 > 20] = (0.6 * 0.5) / 0.4\
    \ = 0.75`\n\n利用贝叶斯定理，我们计算出在室外温度为 22°C 的条件下，出太阳的概率为 75%。至于这一信息对我们有多大价值，取决于附近是否有窗户可以让我们看一眼外面。然而，同样的原理适用于许多有趣的问题，其中一些我们将在本书后面看到。\n\
    \n## 随机变量\n\n我们在本书前面已经处理过随机变量，尽管从未明确提及。例如，在骰子示例中，`roll[1]`和`roll[2]`都是随机变量。其作用是将样本空间元素映射为可用于计算的实数值。对于骰子来说，我们已经可以将骰子面上的点数表示为实数，因此映射就是恒等函数。\n\
    \n其他文献通常用单个大写字母表示随机变量，例如`X`、`Y`和`Z`。为了为进一步阅读提供衔接基础，我们也将采用这种表示法。在骰子示例中，先掷出 2 点再掷出\
    \ 4 点的概率转化为以下表示法：\n\n`X[1]：第一次投掷`\n\n`X[2]：第二次投掷`\n\n`P[X[1] = 2 ∩ X[2] = 4] =\
    \ P[X[1] = 2] P[X[2] = 4] = (1/6) * (1/6) = 1/36`\n\n请注意，随机变量本身并不能提供关于我们实际投掷骰子会看到什么结果的信息。即使我们知道每个面出现的概率是六分之一，这并不意味着我们投掷六次就会看到每个数字各出现一次。同样，即使我们投掷六次，也不能保证一定会看到数字\
    \ 1。清单 2-4 展示了一段代码片段，说明了这一点。\n\n```\nstruct Die {\n    func roll() -> Int {\n\
    \        return .random(in: 1 ... 6)\n    }\n}\n\nlet die = Die()\nfor _ in 1\
    \ ... 5 {\n    let rolls = (1 ... 5)\n        .map { _ in String(die.roll()) }\n\
    \        .joined(separator: \", \")\n    print(\"We rolled \\(rolls)\")\n}\n//\
    \ 输出：\n// We rolled 1, 4, 4, 1, 3\n// We rolled 1, 5, 6, 1, 6\n// We rolled 6,\
    \ 1, 6, 6, 5\n// We rolled 6, 6, 4, 2, 1\n// We rolled 3, 3, 2, 5, 2\n清单 2-4\n\
    一个示例，说明即使是公平的骰子，在六次投掷中也可能不会出现所有可能的点数\n```\n\n> **注意：** 清单 2-4 中打印的骰子投掷结果是随机的。这意味着每次运行代码时，结果很可能有所不同。\n"
- fmt: "### Discrete vs. Continuous Random Variables\n\nAnother aspect of random variables\
    \ ties back to their sample spaces and concerns whether they are discrete or continuous.\
    \ At the beginning of this chapter, we said that a sample space encapsulates all\
    \ possible experiment outcomes. We also exemplified two sample spaces, one concerning\
    \ a die roll and another for asking our friend to pick any real-valued random\
    \ number. The random variables associated with these experiments fall into separate\
    \ categories – the die toss being a discrete random variable, while the random\
    \ number picked by our friend is continuous.\n\nTo categorize a random variable\
    \ as either discrete or continuous, we need to ask ourselves two questions about\
    \ its sample space:\n\n1. Is the sample space finite?\n2. Is the sample space\
    \ countable?\n\nThese questions may appear similar. Is countable not just another\
    \ word for finite? The answer is no, and we will walk through a few examples to\
    \ make it clear:\n\n- A die has six distinct faces and, therefore, a sample space\
    \ consisting of six numbers. Since the sample space holds a finite amount of numbers,\
    \ and we could iterate over all of them, this is a **finite** set.\n- We flip\
    \ a coin and count how many times we need before it comes out tails. We could\
    \ get lucky and only need one coin toss, but we could also get seriously unlucky\
    \ and keep flipping coins until the end of time. The sample space consists of\
    \ all the positive integers,`{1, 2, 3, 4, ...}`. This set is infinite since there\
    \ is no limit to how high we could count. However, we can still enumerate the\
    \ sample points by starting at one and going on forever. This sample space is\
    \ what we call **countably infinite**.\n- Asking our friend to pick a real-valued\
    \ random number opens up the possibility of them choosing any number from the\
    \ entire real number line, which is an infinite set. However, unlike in the previous\
    \ coin flip example, this set’s sample points are not countable. Not even if we\
    \ restricted the choices to real numbers between 0 and 1 would the sample points\
    \ be countable. We would start enumerating at 0, but then what? If we choose 0.1\
    \ next, what would happen to 0.05? The nature of the real numbers is that we can\
    \ always find new values that fit between two others by adding more decimals.\
    \ This property makes for an infinite and uncountable number of sample points,\
    \ even between 0 and 1. We call these kinds of sets **uncountably infinite**.\n\
    \nNow that we know how to categorize sample spaces, we are also ready to define\
    \ what it means for a random variable to be discrete or continuous:\n\n- A random\
    \ variable associated with a **finite** or **countably infinite** sample space\
    \ is a **discrete** random variable.\n- If the sample space of a random variable\
    \ is **uncountably infinite**, the random variable is **continuous**.\n\nThe concepts\
    \ of discrete and continuous will be important in the following chapters, so we\
    \ must learn their definitions early on.\n\n### Chapter Summary\n\nThis chapter\
    \ covered some of the most important theoretical concepts we will need in this\
    \ book. We explored probabilities and their different representations, and we\
    \ learned about sample spaces, events, and conditional probability. The theory\
    \ we learned early in this chapter was put to good use when we discovered one\
    \ of the most important theorems in statistics – namely, Bayes’ Theorem. We also\
    \ looked at random variables and learned how to classify them as discrete or continuous\
    \ according to their sample spaces’ properties.\n\nNow that we know the basics,\
    \ it is time to answer some more in-depth questions about random variables and\
    \ their sample spaces. What happens if one point in the sample space is supposed\
    \ to be twice as likely as the others? How do we model the likelihood of different\
    \ outcomes, and how can we generate random values for a random variable where\
    \ not all outcomes are equally probable? In the next chapter, we talk about distributions.\n\
    \n# 3. Distributions\n\nIn the previous chapter, we discussed some characteristics\
    \ of random variables. However, there is still a critical aspect of their sample\
    \ spaces that we need to discuss and understand to solve problems. Returning to\
    \ the die example, we know that the sample space associated with one throw contains\
    \ all integer numbers from one through six. While that is helpful information,\
    \ the sample space alone tells us nothing about how likely we are to roll a specific\
    \ number.\n\nUntil now, we have assumed that each die face is equally probable\
    \ to show, but that might not always be the case. What if someone tampered with\
    \ the die, making it twice as likely that you would roll a two than any other\
    \ number? How do we describe our chances of throwing an even number under those\
    \ conditions? These are some of the questions we will discuss and answer in this\
    \ chapter.\n\n## What Is a Distribution?\n\nA distribution is a description of\
    \ how likely the points in a sample space are. For the case of a fair die, each\
    \ face is equally likely to show, and the total probability of one is distributed\
    \ evenly over the six possible outcomes. We can express the distribution using\
    \ the following function:\n\n```\nP[X=x] = {\n    1/6   if x ∈ {1,2,3,4,5,6}\n\
    \    0     otherwise\n}\n```\n\nWe can also express the distribution of our fair\
    \ die by using a column chart. By placing the sample points on the X axis and\
    \ the relative probabilities on the Y axis, we get a diagram that looks like the\
    \ one in Figure 3-1.\n\n![../images/512351_1_En_3_Chapter/512351_1_En_3_Fig1_HTML.jpg](images/512351_1_En_3_Chapter/512351_1_En_3_Fig1_HTML.jpg)\n\
    \nFigure 3-1: The probabilities of different outcomes of a die throw\n\nAs we\
    \ discovered in the last chapter, the sample space of a die roll is discrete since\
    \ it contains a finite set of sample points. We also learned that this classification\
    \ extends to random variables representing a die toss, making it a *discrete random\
    \ variable*. On top of that, this categorization also applies to distributions\
    \ since they also describe sample spaces. The distribution of a fair die is, therefore,\
    \ a *discrete distribution*. The same logic applies to *continuous distributions*,\
    \ which deal with uncountably infinite sample spaces.\n\nWe spend the remainder\
    \ of this chapter exploring and understanding some of the most common standard\
    \ distributions, their properties and parameters, and which helpful information\
    \ we can derive from them. We will use this information for further calculations\
    \ in later chapters, so we must develop a good intuition for what it means as\
    \ early as possible. We start by looking at discrete distributions.\n\n## Discrete\
    \ Distributions\n\nAs we have covered before, the distribution of a die roll is\
    \ discrete because the sample space is finite. However, we will start this section\
    \ using something even cleaner and more straightforward – a coin toss!"
  raw: '### Discrete vs. Continuous Random Variables


    Another aspect of random variables ties back to their sample spaces and concerns
    whether they are discrete or continuous. At the beginning of this chapter, we
    said that a sample space encapsulates all possible experiment outcomes. We also
    exemplified two sample spaces, one concerning a die roll and another for asking
    our friend to pick any real-valued random number. The random variables associated
    with these experiments fall into separate categories – the die toss being a discrete
    random variable, while the random number picked by our friend is continuous.


    To categorize a random variable as either discrete or continuous, we need to ask
    ourselves two questions about its sample space:


    1.  Is the sample space finite?


    2.  Is the sample space countable?


    These questions may appear similar. Is countable not just another word for finite?
    The answer is no, and we will walk through a few examples to make it clear:


    *   A die has six distinct faces and, therefore, a sample space consisting of
    six numbers. Since the sample space holds a finite amount of numbers, and we could
    iterate over all of them, this is a **finite** set.


    *   We flip a coin and count how many times we need before it comes out tails.
    We could get lucky and only need one coin toss, but we could also get seriously
    unlucky and keep flipping coins until the end of time. The sample space consists
    of all the positive integers, {1, 2, 3, 4, ...}. This set is infinite since there
    is no limit to how high we could count. However, we can still enumerate the sample
    points by starting at one and going on forever. This sample space is what we call
    **countably infinite**.


    *   Asking our friend to pick a real-valued random number opens up the possibility
    of them choosing any number from the entire real number line, which is an infinite
    set. However, unlike in the previous coin flip example, this set’s sample points
    are not countable. Not even if we restricted the choices to real numbers between
    0 and 1 would the sample points be countable. We would start enumerating at 0,
    but then what? If we choose 0.1 next, what would happen to 0.05? The nature of
    the real numbers is that we can always find new values that fit between two others
    by adding more decimals. This property makes for an infinite and uncountable number
    of sample points, even between 0 and 1\. We call these kinds of sets **uncountably
    infinite**.


    Now that we know how to categorize sample spaces, we are also ready to define
    what it means for a random variable to be discrete or continuous:


    *   A random variable associated with a **finite** or **countably infinite** sample
    space is a **discrete** random variable.


    *   If the sample space of a random variable is **uncountably infinite**, the
    random variable is **continuous**.


    The concepts of discrete and continuous will be important in the following chapters,
    so we must learn their definitions early on.


    ## Chapter Summary


    This chapter covered some of the most important theoretical concepts we will need
    in this book. We explored probabilities and their different representations, and
    we learned about sample spaces, events, and conditional probability. The theory
    we learned early in this chapter was put to good use when we discovered one of
    the most important theorems in statistics – namely, Bayes’ Theorem. We also looked
    at random variables and learned how to classify them as discrete or continuous
    according to their sample spaces’ properties.


    Now that we know the basics, it is time to answer some more in-depth questions
    about random variables and their sample spaces. What happens if one point in the
    sample space is supposed to be twice as likely as the others? How do we model
    the likelihood of different outcomes, and how can we generate random values for
    a random variable where not all outcomes are equally probable? In the next chapter,
    we talk about distributions.


    # 3. Distributions


    In the previous chapter, we discussed some characteristics of random variables.
    However, there is still a critical aspect of their sample spaces that we need
    to discuss and understand to solve problems. Returning to the die example, we
    know that the sample space associated with one throw contains all integer numbers
    from one through six. While that is helpful information, the sample space alone
    tells us nothing about how likely we are to roll a specific number.


    Until now, we have assumed that each die face is equally probable to show, but
    that might not always be the case. What if someone tampered with the die, making
    it twice as likely that you would roll a two than any other number? How do we
    describe our chances of throwing an even number under those conditions? These
    are some of the questions we will discuss and answer in this chapter.


    ## What Is a Distribution?


    A distribution is a description of how likely the points in a sample space are.
    For the case of a fair die, each face is equally likely to show, and the total
    probability of one is distributed evenly over the six possible outcomes. We can
    express the distribution using the following function:


    ![$$ P\left[X=x\right]=\left\{\begin{array}{c}\kern0.5em \frac{1}{6}\kern1.25em
    if\ x\in \left\{1,2,3,4,5,6\right\}\\ {}\kern0.5em 0\kern1.25em otherwise\kern4.25em
    \end{array}\right. $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equa.png)


    We can also express the distribution of our fair die by using a column chart.
    By placing the sample points on the X axis and the relative probabilities on the
    Y axis, we get a diagram that looks like the one in Figure [3-1](#512351_1_En_3_Chapter.xhtml#Fig1).


    ![../images/512351_1_En_3_Chapter/512351_1_En_3_Fig1_HTML.jpg](images/512351_1_En_3_Chapter/512351_1_En_3_Fig1_HTML.jpg)


    Figure 3-1


    The probabilities of different outcomes of a die throw


    As we discovered in the last chapter, the sample space of a die roll is discrete
    since it contains a finite set of sample points. We also learned that this classification
    extends to random variables representing a die toss, making it a *discrete random
    variable* . On top of that, this categorization also applies to distributions
    since they also describe sample spaces. The distribution of a fair die is, therefore,
    a *discrete distribution*. The same logic applies to *continuous distributions*
    , which deal with uncountably infinite sample spaces.


    We spend the remainder of this chapter exploring and understanding some of the
    most common standard distributions, their properties and parameters, and which
    helpful information we can derive from them. We will use this information for
    further calculations in later chapters, so we must develop a good intuition for
    what it means as early as possible. We start by looking at discrete distributions.


    ## Discrete Distributions


    As we have covered before, the distribution of a die roll is discrete because
    the sample space is finite. However, we will start this section using something
    even cleaner and more straightforward – a coin toss!'
  trans: "\n### 离散型与连续型随机变量\n\n随机变量的另一个特性与其样本空间有关，即它们是离散的还是连续的。本章开头我们提到，样本空间囊括了所有可能的实验结果。我们还举例说明了两个样本空间：一个是掷骰子，另一个是让朋友任意选择一个实数作为随机数。与这些实验相关的随机变量属于不同类别——掷骰子是离散型随机变量，而朋友选择的随机数则是连续型。\n\
    \n要将随机变量归类为离散型或连续型，我们需要问自己两个关于其样本空间的问题：\n\n1.  样本空间是有限的吗？\n2.  样本空间是可数的吗？\n\n\
    这两个问题可能看起来很相似。“可数的”不就是“有限的”另一种说法吗？答案是否定的，我们将通过几个例子来阐明：\n\n-   骰子有六个不同的面，因此其样本空间由六个数字组成。由于样本空间中的数字数量有限，并且我们可以遍历所有数字，这是一个**有限**集合。\n\
    -   我们抛一枚硬币，记录需要抛多少次才能得到反面。我们可能很幸运，只抛一次就得到反面，但也可能非常不幸，一直抛到世界末日。样本空间由所有正整数组成，即\
    \ `{1, 2, 3, 4, ...}`。这个集合是无限的，因为我们计数可以一直往上没有上限。然而，我们仍然可以从 1 开始无限地枚举样本点。这种样本空间我们称之为**可数无限**。\n\
    -   让朋友选择一个实数作为随机数，意味着他们有可能选择整个实数轴上的任意数，这是一个无限集。然而，与之前的抛硬币例子不同，这个集合的样本点是不可数的。即使我们将选择范围限制在\
    \ 0 到 1 之间的实数，样本点也是不可数的。我们从 0 开始枚举，但接下来呢？如果我们下一步选择 0.1，那么 0.05 又该怎么办？实数的特性在于，通过增加更多小数位，我们总能在两个数之间找到新的值。这个性质使得即使在\
    \ 0 和 1 之间，样本点也是无限且不可数的。我们将这类集合称为**不可数无限**。\n\n现在我们知道了如何对样本空间分类，也就准备好定义随机变量是离散还是连续的含义了：\n\
    \n-   与**有限**或**可数无限**样本空间相关联的随机变量是**离散型**随机变量。\n-   如果随机变量的样本空间是**不可数无限**，则该随机变量是**连续型**随机变量。\n\
    \n离散与连续的概念在后续章节中非常重要，因此我们必须尽早理解它们的定义。\n\n### 章节总结\n\n本章涵盖了我们将在本书中用到的一些最重要的理论概念。我们探讨了概率及其不同表示形式，学习了样本空间、事件和条件概率。当我们发现统计学中最重要的定理之一——即贝叶斯定理时，本章早期学到的理论得到了很好的应用。我们还研究了随机变量，并学习了如何根据其样本空间的属性将它们分类为离散型或连续型。\n\
    \n既然我们已经掌握了基础知识，现在是时候回答一些关于随机变量及其样本空间的更深入问题了。如果样本空间中的某个点出现的可能性是其他点的两倍，会发生什么？我们如何对不同结果的可能性进行建模？对于一个并非所有结果皆等可能的随机变量，我们如何为其生成随机值？在下一章中，我们将讨论分布。\n\
    \n# 3. 分布\n\n在上一章中，我们讨论了随机变量的一些特性。然而，关于其样本空间，仍有一个关键方面需要我们讨论和理解，以便解决问题。回到骰子的例子，我们知道抛一次骰子相关的样本空间包含从\
    \ 1 到 6 的所有整数。虽然这是有用信息，但仅凭样本空间本身并不能告诉我们掷出特定数字的可能性有多大。\n\n到目前为止，我们假设每个骰子面出现的概率相等，但情况可能并非总是如此。如果有人动了手脚，使得掷出\
    \ 2 点的可能性是其他数字的两倍呢？在这种情况下，我们如何描述掷出偶数的几率？这些是我们在本章中将讨论并回答的一些问题。\n\n## 什么是分布？\n\n\
    分布是对样本空间中各点可能性的一种描述。对于一枚公平的骰子，每个面出现的可能性相同，总概率 1 被均匀分布在六个可能的结果上。我们可以用以下函数来表达这个分布：\n\
    \n```\nP[X=x] = {\n    1/6   if x ∈ {1,2,3,4,5,6}\n    0     其他情况\n}\n```\n\n\
    我们也可以使用柱状图来表示公平骰子的分布。将样本点放在 X 轴上，相对概率放在 Y 轴上，我们就能得到如图 3-1 所示的图表。\n\n![../images/512351_1_En_3_Chapter/512351_1_En_3_Fig1_HTML.jpg](img/512351_1_En_3_Fig1_HTML.jpg)\n\
    \n图 3-1：掷骰子不同结果的概率\n\n正如我们在上一章中发现的，掷骰子的样本空间是离散的，因为它包含一个有限的样本点集合。我们还了解到，这种分类同样适用于代表掷骰子的随机变量，使其成为*离散型随机变量*。除此之外，这种分类也适用于分布，因为分布同样描述样本空间。因此，公平骰子的分布是一个*离散分布*。同样的逻辑也适用于*连续分布*，后者处理的是不可数无限的样本空间。\n\
    \n本章剩余部分将探索和理解一些最常见的标准分布，它们的属性、参数，以及我们可以从中推导出哪些有用信息。我们将在后续章节中利用这些信息进行进一步计算，因此必须尽早对它们的含义建立良好的直觉。我们从离散分布开始。"
- fmt: "### Bernoulli Distribution and Trials\n\nThe concept of a Bernoulli trial\
    \ is quite simple. We perform a single experiment, a trial, which either comes\
    \ out as a success or a failure. We traditionally denote the probability of success\
    \ by `p` and that of a failure by `q`. Since these events are mutually exclusive\
    \ and make up the entirety of the sample space, we can describe their relationship\
    \ with the following formula:\n\n![$$ q=1-p\\kern0.75em \\Longleftrightarrow \\\
    kern0.75em p+q=1 $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equb.png)\n\
    \nImagine now that we flip a coin and label heads up as a \"success.\" That implies\
    \ that we label tails up as a \"failure.\" If the coin is fair, it will have an\
    \ equal 0.5 chance of landing with either side up. The column chart of such a\
    \ coin would look similar to the diagram of the die roll we saw earlier, only\
    \ with two columns instead of six. Mathematically, we describe such a coin by\
    \ writing\n\n![$$ X\\sim Bernoulli(0.5) $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equc.png)\n\
    \nThe earlier notation tells us that the random variable `X` (representing the\
    \ coin flip outcome) is Bernoulli distributed and that\n\n![$$ p=0.5 $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equd.png)\n\
    \n![$$ q=1-p=1-0.5=0.5 $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Eque.png)\n\
    \nThat is, both sides are equally likely to show when we toss the coin. However,\
    \ let us look at a scenario where the coin has a slight imperfection and tends\
    \ to land heads up a little more often.\n\nLet us say that the new coin has a\
    \ 0.54 probability of landing heads up and that the random variable `Y` represents\
    \ it. Then, by the same logic as before, we would describe it by writing\n\n![$$\
    \ Y\\sim Bernoulli(0.54) $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equf.png)\n\
    \n![$$ p=0.54 $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equg.png)\n\
    \n![$$ q=1-p=0.46 $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equh.png)\n\
    \nOur first thought might be that this does not make a big difference. Flipping\
    \ the new coin still yields an almost 50-50 chance of landing on either side.\
    \ However, if we were to flip this coin many times, we would realize that this\
    \ slight bias yields a greater chance of seeing more heads than tails. We can\
    \ illustrate this by writing a small toy script like in Listing 3-1, which flips\
    \ 10,000 coins two times, each with different probabilities of landing heads up.\n\
    \n```\nfunc simulate(p: Double) {\n    let q = (100 - p * 100).rounded() / 100\n\
    \    let results = (1 ... 10000)\n        .reduce(into: [0, 0]) { result, _ in\n\
    \            let success = Double.random(in: 0 ... 1) < p\n            result[success\
    \ ? 1 : 0] += 1\n        }\n        .enumerated()\n        .map { index, count\
    \ in\n            let outcome = (index == 0) ? \"Tails\" : \"Heads\"\n       \
    \     let probability = (index == 0) ? q : p\n            return \"\\(outcome)\
    \ (\\(probability)): \\(count)\"\n        }\n    print(\n        \"\"\"\n    \
    \    \\(results.joined(separator: \"\\n\"))\n        \"\"\"\n    )\n}\nsimulate(p:\
    \ 0.50)\nsimulate(p: 0.54)\n// -- These prints may vary since we\n// -- are dealing\
    \ with random variables\n// Prints:\n// Tails (0.5): 5042\n// Heads (0.5): 4958\n\
    //\n// Tails (0.46): 4588\n// Heads (0.54): 5412\nListing 3-1\nSimulating two\
    \ sequences consisting of 10,000 coin flips each, one with p = 0.5 and the other\
    \ with p = 0.54\n```\n\n### Geometric Distribution\n\nNow we know how to think\
    \ about single trials with binary outcomes. However, in some situations, we may\
    \ want to know something about the probability of eventual success. For example,\
    \ if we start flipping a coin over and over, how likely is it that it lands heads\
    \ up on the third try? Regarding the sample space, we write it as follows:\n\n\
    ![$$ S=\\left\\{H, TH, TTH, TTTH,\\dots \\right\\} $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equi.png)\n\
    \nThe coin may land heads up on the first try, but we may also see a few tails\
    \ on the way there. If we are very unlucky, we might see an infinite number of\
    \ flips land tails up before we succeed. Computing the probability of each of\
    \ them is no more difficult than applying the multiplication rule.\n\nUsing the\
    \ notation and reasoning from the section on Bernoulli trials, the chance of succeeding\
    \ on a single toss is `p`. To get the likelihood of making it on the second try,\
    \ we consider that we need to fail the first attempt. Because each flip is independent\
    \ of the others, we can calculate our result by multiplying the probabilities\
    \ of failing once and succeeding once.\n\n![$$ P\\left[X=2\\right]=p\\cdotp q\
    \ $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equj.png)\n\nIt is\
    \ possible to keep expanding this by adding more failures before our first success\
    \ and multiplying their probabilities:\n\n![$$ P\\left[X=3\\right]=p\\cdotp q\\\
    cdotp q=p\\cdotp {q}^2 $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equk.png)\n\
    \n![$$ P\\left[X=4\\right]=p\\cdotp q\\cdotp q\\cdotp q=p\\cdotp {q}^3 $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equl.png)\n\
    \n![$$ P\\left[X=5\\right]=p\\cdotp q\\cdotp q\\cdotp q\\cdotp q=p\\cdotp {q}^4\
    \ $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equm.png)\n\n![$$\
    \ P\\left[X=6\\right]=p\\cdotp q\\cdotp q\\cdotp q\\cdotp q\\cdotp q=p\\cdotp\
    \ {q}^5 $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equn.png)\n\
    \n![$$ \\dots $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equo.png)\n\
    \nThese formulas generalize nicely into a compact notation by writing\n\n![$$\
    \ P\\left[X=x\\right]=p\\cdotp {q}^{x-1}\\kern0.75em ,\\kern0.75em x\\in {\\mathbb{N}}^{+}\\\
    kern0.75em ,\\kern0.75em p\\in \\left(0,1\\right] $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equp.png)\n\
    \nWe have just derived the *probability mass function* (PMF) of the geometric\
    \ distribution. The PMF gives us a formula for computing the likelihood of an\
    \ outcome in a discrete distribution. The notation also tells us that `x` needs\
    \ to be an element in the positive natural numbers and that the parameter `p`\
    \ needs to lie in the interval `0 < p ≤ 1`. Just as in the Bernoulli trial examples,\
    \ we can compute the parameter `q` from the value of `p`.\n\nListing 3-2 on the\
    \ following page shows a short program that computes the PMF of a geometric distribution\
    \ with parameter `p = 0.4`. If we translate this back to the coin example, it\
    \ calculates the likelihood of the first heads showing after some exact number\
    \ of tries, given that our coin is slightly biased toward landing tails up. Plotting\
    \ the results in a column chart, we get the diagram shown in Figure 3-2.\n\n![../images/512351_1_En_3_Chapter/512351_1_En_3_Fig2_HTML.png](images/512351_1_En_3_Chapter/512351_1_En_3_Fig2_HTML.png)\n\
    \nFigure 3-2\nPlotting the PMF of a geometric distribution with parameter p =\
    \ 0.4"
  raw: '### Bernoulli Distribution and Trials


    The concept of a Bernoulli trial is quite simple. We perform a single experiment,
    a trial, which either comes out as a success or a failure. We traditionally denote
    the probability of success by *p* and that of a failure by *q*. Since these events
    are mutually exclusive and make up the entirety of the sample space, we can describe
    their relationship with the following formula:


    ![$$ q=1-p\kern0.75em \Longleftrightarrow \kern0.75em p+q=1 $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equb.png)


    Imagine now that we flip a coin and label heads up as a “success.” That implies
    that we label tails up as a “failure.” If the coin is fair, it will have an equal
    0.5 chance of landing with either side up. The column chart of such a coin would
    look similar to the diagram of the die roll we saw earlier, only with two columns
    instead of six. Mathematically, we describe such a coin by writing


    ![$$ X\sim Bernoulli(0.5) $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equc.png)


    The earlier notation tells us that the random variable X (representing the coin
    flip outcome) is Bernoulli distributed and that


    ![$$ p=0.5 $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equd.png)


    ![$$ q=1-p=1-0.5=0.5 $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Eque.png)


    That is, both sides are equally likely to show when we toss the coin. However,
    let us look at a scenario where the coin has a slight imperfection and tends to
    land heads up a little more often.


    Let us say that the new coin has a 0.54 probability of landing heads up and that
    the random variable Y represents it. Then, by the same logic as before, we would
    describe it by writing


    ![$$ Y\sim Bernoulli(0.54) $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equf.png)


    ![$$ p=0.54 $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equg.png)


    ![$$ q=1-p=0.46 $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equh.png)


    Our first thought might be that this does not make a big difference. Flipping
    the new coin still yields an almost 50-50 chance of landing on either side. However,
    if we were to flip this coin many times, we would realize that this slight bias
    yields a greater chance of seeing more heads than tails. We can illustrate this
    by writing a small toy script like in Listing [3-1](#512351_1_En_3_Chapter.xhtml#PC1),
    which flips 10,000 coins two times, each with different probabilities of landing
    heads up.


    ```

    func simulate(p: Double) {

    let q = (100 - p * 100).rounded() / 100

    let results = (1 ... 10000)

    .reduce(into: [0, 0]) { result, _ in

    let success = Double.random(in: 0 ... 1) < p

    result[success ? 1 : 0] += 1

    }

    .enumerated()

    .map { index, count in

    let outcome = (index == 0) ? "Tails" : "Heads"

    let probability = (index == 0) ? q : p

    return "\(outcome) (\(probability)): \(count)"

    }

    print(

    """

    \(results.joined(separator: "\n"))

    """

    )

    }

    simulate(p: 0.50)

    simulate(p: 0.54)

    // -- These prints may vary since we

    // -- are dealing with random variables

    // Prints:

    // Tails (0.5): 5042

    // Heads (0.5): 4958

    //

    // Tails (0.46): 4588

    // Heads (0.54): 5412

    Listing 3-1

    Simulating two sequences consisting of 10,000 coin flips each, one with p = 0.5
    and the other with p = 0.54

    ```


    ### Geometric Distribution


    Now we know how to think about single trials with binary outcomes. However, in
    some situations, we may want to know something about the probability of eventual
    success. For example, if we start flipping a coin over and over, how likely is
    it that it lands heads up on the third try? Regarding the sample space, we write
    it as follows:


    ![$$ S=\left\{H, TH, TTH, TTTH,\dots \right\} $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equi.png)


    The coin may land heads up on the first try, but we may also see a few tails on
    the way there. If we are very unlucky, we might see an infinite number of flips
    land tails up before we succeed. Computing the probability of each of them is
    no more difficult than applying the multiplication rule.


    Using the notation and reasoning from the section on Bernoulli trials, the chance
    of succeeding on a single toss is *p*. To get the likelihood of making it on the
    second try, we consider that we need to fail the first attempt. Because each flip
    is independent of the others, we can calculate our result by multiplying the probabilities
    of failing once and succeeding once.


    ![$$ P\left[X=2\right]=p\cdotp q $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equj.png)


    It is possible to keep expanding this by adding more failures before our first
    success and multiplying their probabilities:


    ![$$ P\left[X=3\right]=p\cdotp q\cdotp q=p\cdotp {q}^2 $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equk.png)


    ![$$ P\left[X=4\right]=p\cdotp q\cdotp q\cdotp q=p\cdotp {q}^3 $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equl.png)


    ![$$ P\left[X=5\right]=p\cdotp q\cdotp q\cdotp q\cdotp q=p\cdotp {q}^4 $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equm.png)


    ![$$ P\left[X=6\right]=p\cdotp q\cdotp q\cdotp q\cdotp q\cdotp q=p\cdotp {q}^5
    $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equn.png)


    ![$$ \dots $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equo.png)


    These formulas generalize nicely into a compact notation by writing


    ![$$ P\left[X=x\right]=p\cdotp {q}^{x-1}\kern0.75em ,\kern0.75em x\in {\mathbb{N}}^{+}\kern0.75em
    ,\kern0.75em p\in \left(0,1\right] $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equp.png)


    We have just derived the *probability mass function* (PMF) of the geometric distribution.
    The PMF gives us a formula for computing the likelihood of an outcome in a discrete
    distribution. The notation also tells us that x needs to be an element in the
    positive natural numbers and that the parameter *p* needs to lie in the interval
    0 < *p* ≤ 1\. Just as in the Bernoulli trial examples, we can compute the parameter
    *q* from the value of *p*.


    Listing [3-2](#512351_1_En_3_Chapter.xhtml#PC2) on the following page shows a
    short program that computes the PMF of a geometric distribution with parameter
    *p* = 0.4\. If we translate this back to the coin example, it calculates the likelihood
    of the first heads showing after some exact number of tries, given that our coin
    is slightly biased toward landing tails up. Plotting the results in a column chart,
    we get the diagram shown in Figure [3-2](#512351_1_En_3_Chapter.xhtml#Fig2).


    ![../images/512351_1_En_3_Chapter/512351_1_En_3_Fig2_HTML.png](images/512351_1_En_3_Chapter/512351_1_En_3_Fig2_HTML.png)


    Figure 3-2


    Plotting the PMF of a geometric distribution with parameter p = 0.4'
  trans: "\n### 伯努利分布与伯努利试验\n\n伯努利试验的概念非常简单。我们进行一次单一的实验（即一次试验），其结果要么是成功，要么是失败。通常我们用\
    \ `p` 表示成功的概率，用 `q` 表示失败的概率。由于这些事件互斥且构成了整个样本空间，我们可以用以下公式描述它们的关系：\n\n![$$ q=1-p\\\
    kern0.75em \\Longleftrightarrow \\kern0.75em p+q=1 $$](img/512351_1_En_3_Chapter_TeX_Equb.png)\n\
    \n现在想象我们抛一枚硬币，并将正面朝上定义为“成功”。这意味着我们将反面朝上定义为“失败”。如果硬币是均匀的，那么它两面朝上的概率均为 0.5。这种硬币的柱状图与我们之前看到的掷骰子示意图类似，只不过有两个柱形而不是六个。在数学上，我们通过以下方式描述这样一枚硬币：\n\
    \n![$$ X\\sim Bernoulli(0.5) $$](img/512351_1_En_3_Chapter_TeX_Equc.png)\n\n上述符号告诉我们，随机变量\
    \ `X`（代表抛硬币的结果）服从伯努利分布，并且\n\n![$$ p=0.5 $$](img/512351_1_En_3_Chapter_TeX_Equd.png)\n\
    \n![$$ q=1-p=1-0.5=0.5 $$](img/512351_1_En_3_Chapter_TeX_Eque.png)\n\n也就是说，抛这枚硬币时，两面朝上的可能性相同。然而，让我们考虑另一种场景：硬币稍有瑕疵，正面朝上的概率略高一些。\n\
    \n假设这枚新硬币正面朝上的概率为 0.54，并用随机变量 `Y` 表示它。那么，根据同样的逻辑，我们通过以下方式描述它：\n\n![$$ Y\\sim Bernoulli(0.54)\
    \ $$](img/512351_1_En_3_Chapter_TeX_Equf.png)\n\n![$$ p=0.54 $$](img/512351_1_En_3_Chapter_TeX_Equg.png)\n\
    \n![$$ q=1-p=0.46 $$](img/512351_1_En_3_Chapter_TeX_Equh.png)\n\n我们第一反应可能认为这没什么大区别。抛这枚新硬币时，它两面朝上的概率仍然接近\
    \ 50-50。然而，如果我们多次抛这枚硬币，就会发现这一微小偏差会导致正面朝上的次数多于反面朝上的概率更大。我们可以通过编写一个类似代码清单 3-1 的小脚本来演示这一点，该脚本模拟抛\
    \ 10,000 枚硬币各两次，每次正面朝上的概率不同。\n\n```\nfunc simulate(p: Double) {\n    let q = (100\
    \ - p * 100).rounded() / 100\n    let results = (1 ... 10000)\n        .reduce(into:\
    \ [0, 0]) { result, _ in\n            let success = Double.random(in: 0 ... 1)\
    \ < p\n            result[success ? 1 : 0] += 1\n        }\n        .enumerated()\n\
    \        .map { index, count in\n            let outcome = (index == 0) ? \"Tails\"\
    \ : \"Heads\"\n            let probability = (index == 0) ? q : p\n          \
    \  return \"\\(outcome) (\\(probability)): \\(count)\"\n        }\n    print(\n\
    \        \"\"\"\n        \\(results.joined(separator: \"\\n\"))\n        \"\"\"\
    \n    )\n}\nsimulate(p: 0.50)\nsimulate(p: 0.54)\n// -- 这些输出可能会有所不同，因为\n// --\
    \ 我们处理的是随机变量\n// 输出：\n// Tails (0.5): 5042\n// Heads (0.5): 4958\n//\n// Tails\
    \ (0.46): 4588\n// Heads (0.54): 5412\n代码清单 3-1\n模拟两组各 10,000 次抛硬币的序列，其中一组 p =\
    \ 0.5，另一组 p = 0.54\n```\n\n### 几何分布\n\n现在我们知道了如何思考具有二元结果的单一试验。然而，在某些情况下，我们可能想了解关于最终成功概率的一些信息。例如，如果我们开始反复抛一枚硬币，它在第三次尝试时正面朝上的可能性有多大？就样本空间而言，我们可以将其表示如下：\n\
    \n![$$ S=\\left\\{H, TH, TTH, TTTH,\\dots \\right\\} $$](img/512351_1_En_3_Chapter_TeX_Equi.png)\n\
    \n硬币可能在第一次尝试时就正面朝上，但也可能在成功之前连续出现几次反面。如果我们非常不走运，可能会在成功之前出现无限次反面朝上的抛掷结果。计算每种情况发生的概率并不比应用乘法规则更困难。\n\
    \n使用伯努利试验部分的符号和推理，单次抛掷成功的概率是 `p`。要计算第二次尝试成功的概率，我们需要考虑第一次尝试失败。由于每次抛掷相互独立，我们可以通过将失败一次和成功一次的概率相乘来计算结果。\n\
    \n![$$ P\\left[X=2\\right]=p\\cdotp q $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equj.png)\n\
    \n我们可以通过在首次成功前增加更多失败次数，并将它们的概率相乘来继续扩展这个公式：\n\n![$$ P\\left[X=3\\right]=p\\cdotp\
    \ q\\cdotp q=p\\cdotp {q}² $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equk.png)\n\
    \n![$$ P\\left[X=4\\right]=p\\cdotp q\\cdotp q\\cdotp q=p\\cdotp {q}³ $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equl.png)\n\
    \n![$$ P\\left[X=5\\right]=p\\cdotp q\\cdotp q\\cdotp q\\cdotp q=p\\cdotp {q}⁴\
    \ $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equm.png)\n\n![$$\
    \ P\\left[X=6\\right]=p\\cdotp q\\cdotp q\\cdotp q\\cdotp q\\cdotp q=p\\cdotp\
    \ {q}⁵ $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equn.png)\n\n\
    ![$$ \\dots $$](img/512351_1_En_3_Chapter_TeX_Equo.png)\n\n这些公式可以很好地归纳为一个简洁的表示法，我们将其写作：\n\
    \n![$$ P\\left[X=x\\right]=p\\cdotp {q}^{x-1}\\kern0.75em ,\\kern0.75em x\\in\
    \ {\\mathbb{N}}^{+}\\kern0.75em ,\\kern0.75em p\\in \\left(0,1\\right] $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equp.png)\n\
    \n我们刚刚推导出了几何分布的*概率质量函数* (PMF)。PMF 为我们提供了一个公式，用于计算离散分布中某个结果出现的可能性。该符号还表明，`x` 必须是正整数集合中的元素，且参数\
