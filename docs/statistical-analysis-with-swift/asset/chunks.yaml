    ## Chapter Summary


    This chapter weaved together many of the concepts we have looked at throughout
    this book. We learned how to solve a real-world problem step by step by incorporating
    ideas and concepts that build on statistical analysis. We covered two ways of
    measuring similarity and discussed how they work and how they may perform poorly
    on certain kinds of data. We also talked about the application of expected values
    and revisited Bayes’ Theorem to derive a formula that would help us achieve our
    goal.


    The implementation part of the chapter went over the code needed to recommend
    movie titles based on existing knowledge. We got to work with chains of higher-order
    functions and see how they can form a declarative flow from input to desired output.
    We also got a quick introduction to the vDSP module, which contains several helpful
    methods when working with vectors. Since vDSP is a part of the Accelerate framework,
    these methods will speed up execution by computing our results on the CPU’s vector
    processor.


    The next chapter wraps things up by summarizing what we have learned throughout
    this book. It also looks at some of the many fields where it is beneficial to
    know about statistical methods and suggests resources and interesting related
    topics for future studies.


    # 8. Reflections


    This book has presented new topics, techniques, and frameworks at a rapid pace.
    To fully digest new material, it is essential to take the time to reflect on what
    we have done. This chapter will walk through the most important topics of the
    previous chapters and provide repetition and some time to reflect on how the different
    subjects fit together. Before we wrap up, we will also look at some professions
    where knowledge of statistical analysis is crucial and suggest related topics
    for further studies.'
