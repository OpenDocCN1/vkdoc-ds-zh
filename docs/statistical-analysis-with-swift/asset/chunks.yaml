    \    from: points,\n    data: \\.x, \\.y,\n    target: \\.z\n)\n清单 4-5\n使用可变参数定位不同变量的两种方式\n\
    ```\n\n如我们所见，可变参数为我们选择计算中要包含的变量提供了极大的灵活性。这种方法使得对可用信息的不同子集进行多个模型的测试和运行变得更加容易。\n\
    \n现在我们已经明确了如何使用 `MultipleLinearRegression`，接下来让我们深入探讨其运作细节。我们将把整个初始化器主体拆分成几个清单，以便分别推理每个部分。首先，清单\
