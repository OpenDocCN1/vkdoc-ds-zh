    \ 拥有便捷的 C 函数导入能力。这一特性非常实用，但伴随一个小不便：在使用这些接口时，代码看起来不那么现代。\n\n回到清单 4-7 中的函数，我们快速梳理一下它期望我们传递给各个参数的内容：\n\
    \n* **__Order**：此参数指定用于乘法的矩阵的顺序。由于我们选择按行主序组织矩阵，因此传入 `CblasRowMajor` 作为参数。\n"
- fmt: '*   **`TransA`**: Whether the function should transpose our matrix before
    performing multiplication. We did not precompute the transpose, so we pass `CblasTrans`.

    *   **`M`**: The number of rows in the original matrix. Since we place our sample
    points on each row, we have `sampleCount` rows.

    *   **`N`**: The number of columns in the original matrix. Our matrix will have
    `dimCount32` columns.

    *   **`alpha`**: This parameter scales the result of our multiplication by some
    amount. We want an unaltered scale, so we pass in 1.

    *   **`A`**: A pointer to our matrix.

    *   **`lda`**: The leading dimension of our matrix. Since we chose row-major order,
    we will pass in the number of columns, which is `dimCount32`.

    *   **`X`**: A pointer to our vector.

    *   **`incX`**: The stride to use when moving through the vector `X`.

    *   **`Y`**: A pointer to a structure that can store the resulting vector.

    *   **`incY`**: The stride to use when moving through `Y`.


    The BLAS interfaces are certainly a lot to take in. Listing [4-8](#512351_1_En_4_Chapter.xhtml#PC8)
    shows one more BLAS function declaration, which we will use for matrix-matrix
    multiplication. However, we will not explain those arguments since they are very
    similar to those in the function from Listing [4-7](#512351_1_En_4_Chapter.xhtml#PC7).


    ```

    func cblas_dgemm(

    _ __Order: CBLAS_ORDER,

    _ __TransA: CBLAS_TRANSPOSE,

    _ __TransB: CBLAS_TRANSPOSE,

    _ __M: Int32,

    _ __N: Int32,

    _ __K: Int32,

    _ __alpha: Double,

    _ __A: UnsafePointer!,

    _ __lda: Int32,

    _ __B: UnsafePointer!,

    _ __ldb: Int32,

    _ __beta: Double,

    _ __C: UnsafeMutablePointer!,

    _ __ldc: Int32

    )

    ```

    Listing 4-8

    One of multiple available BLAS functions for matrix-matrix multiplication


    > **Note**

    > We are only scratching the surface of all you can do with the BLAS interfaces.
    To dive deeper, feel free to visit IBM’s documentation for the *Engineering and
    Scientific Subroutine Library*, which features well-documented implementations
    of BLAS routines.

    > [`www.ibm.com/docs/en/essl`](http://www.ibm.com/docs/en/essl)


    Now that we know how to use the matrix and vector multiplication methods, we can
    add the code listed in Listing [4-9](#512351_1_En_4_Chapter.xhtml#PC9) to our
    initializer.


    ```

    cblas_dgemv(

    CblasRowMajor,

    CblasTrans,

    sampleCount,

    dimCount32,

    1,

    &XTrans,

    dimCount32,

    &Y,

    1,

    1,

    &XTransY,


    )

    cblas_dgemm(

    CblasRowMajor,

    CblasTrans,

    CblasNoTrans,

    dimCount32,

    dimCount32,

    sampleCount,

    1,

    &XTrans,

    dimCount32,

    &X,

    dimCount32,

    1,

    &XTransX,

    dimCount32

    )

    ```

    Listing 4-9

    Computing `XTX` and `XTY` for our multiple linear regression


    Before we can perform our last matrix-vector multiplication and get a result,
    we need to invert **X**^T**X**. To do so, we will use a set of LAPACK routines,
    namely, `dgetrf_` and `dgetri_`. These two functions work together to perform
    an LU factorization of a matrix and later solving a system of equations to find
    the inverse of the same. Listing [4-10](#512351_1_En_4_Chapter.xhtml#PC10) shows
    the declarations of these functions.


    ```

    func dgetrf_(

    _ __m: UnsafeMutablePointer!,

    _ __n: UnsafeMutablePointer!,

    _ __a: UnsafeMutablePointer!,

    _ __lda: UnsafeMutablePointer!,

    _ __ipiv: UnsafeMutablePointer!,

    _ __info: UnsafeMutablePointer!

    ) -> Int32

    func dgetri_(

    _ __n: UnsafeMutablePointer!,

    _ __a: UnsafeMutablePointer!,

    _ __lda: UnsafeMutablePointer!,

    _ __ipiv: UnsafeMutablePointer!,

    _ __work: UnsafeMutablePointer!,

    _ __lwork: UnsafeMutablePointer!,

    _ __info: UnsafeMutablePointer!

    ) -> Int32

    ```

    Listing 4-10

    Declarations of the LAPACK functions `dgetrf_` and `dgetri_`


    Granted, if the BLAS methods looked a little bit scary, then these look like proper
    nightmares. However, once we figure out a little bit more about what goes on behind
    the curtains, even these methods will be helpful.


    `__CLPK_integer` and `__CLPK_doublereal` are just type aliases for `Int32` and
    `Double`. Just knowing that already makes the cognitive strain go away a little
    bit. The parameters `__m` and `__n` are matrix dimensions, just like they were
    in the other functions. Parameter `__a` represents the matrix we want to invert,
    and `__lda` is the leading dimension just like before. `__ipiv` represents a collection
    of pivot indices used to tell how the functions rearrange the rows during the
    factorization process. `__work` and `__lwork` are a workspace array and its dimension,
    respectively. According to IBM’s documentation, the workspace’s size should be
    at least a hundred times the size of `__n` for the algorithm to achieve good performance.
    Finally, the `__info` parameter returns information about failures to the developer.
    For one, it tells us whether the matrix we are trying to invert has eigenvalues
    that include zero. This mechanism is the fail-safe we talked about back in the
    discussion on the *Invertible Matrix Theorem*.


    To use these functions, we need to set up a few more arrays and supporting variables.
    We also need to declare an error enum we can use to propagate any failures. Listing
    [4-11](#512351_1_En_4_Chapter.xhtml#PC11) shows the enum, while Listing [4-12](#512351_1_En_4_Chapter.xhtml#PC12)
    lists the setup, together with the calls to `dgetrf_` and `dgetri_`.


    ```

    var m = dimCount32

    var n = dimCount32

    var lda = dimCount32

