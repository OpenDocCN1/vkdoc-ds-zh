    \n```\nfunc cblas_dgemv(\n    _ __Order: CBLAS_ORDER,\n    _ __TransA: CBLAS_TRANSPOSE,\n\
    \    _ __M: Int32,\n    _ __N: Int32,\n    _ __alpha: Double,\n    _ __A: UnsafePointer!,\n\
    \    _ __lda: Int32,\n    _ __X: UnsafePointer!,\n    _ __incX: Int32,\n    _\
    \ __beta: Double,\n    _ __Y: UnsafeMutablePointer!,\n    _ __incY: Int32\n)\n\
    Listing 4-7\nOne of the many matrix-vector multiplication methods that are available\
    \ through the Accelerate framework\n```\n\nThose that have a little bit of experience\
    \ with Swift development will notice that this declaration looks different than\
    \ most other Swift code they have seen. That is because this (and some of the\
    \ other functions we will use) refers to Apple’s implementation of the *Basic\
    \ Linear Algebra Subprograms* for C (CBLAS). Swift has the convenient capability\
    \ to be able to import C functions. This feature is handy but comes with the minor\
    \ inconvenience that the code looks less modern when using these interfaces.\n\
    \nGoing back to the function in Listing [4-7](#512351_1_En_4_Chapter.xhtml#PC7),\
    \ we quickly go through what it expects us to pass to the different parameters:\n\
    \n* **__Order**: This parameter specifies the order of the matrix we want to use\
