  trans: '

    ## Swift 编程语言


    在第 1 章中，我们讨论了 Swift 及其作为统计分析工具的可行性。正如我们当时提到的，解决这类问题有很多不错的替代方案，例如 Python 和 R。然而，Swift
    在某些情况下确实具有优势，不应仅仅因为有其他语言可用就将其排除在工具箱之外。


    - Swift 是一种静态类型、编译型语言，在处理大规模数据时快速高效。

    - 通过 Swift 包管理器可以获得大量框架和库，从而能够访问构建应用所需的广阔工具生态。

    - Swift 也是苹果平台的主要语言，这使得我们更容易将算法整合到 Mac、iPhone 和 iPad 上的应用程序中。这一点本身就很重要，因为最终我们希望用户能够享受我们工作的成果。


    本书处理了存储在 CSV 文件中的数据。主要原因是这种格式在可读性和存储需求之间取得了平衡。我们还介绍了几种用于数据持久化的其他格式，例如 `JSON`、`XML`
    和 `Protobuf`。这些都是易于写入和读取文件的格式。然而，Swift 有多个选项可以使用更复杂的数据库管理系统来存储和检索数据。甚至可以在关系型、NoSQL
    和基于图的数据库之间进行选择。表 8-1 显示了 Swift 开发人员可用的一些选项。考虑到所有这些不同的可能性，无论我们的用例是什么，我们都一定能找到合适的匹配。


    **表 8-1** Swift 开发人员可用的数据库管理系统


    | 名称 | 类型 |

    | --- | --- |

    | SQLite | 关系型 DBMS |

    | Realm | NoSQL DBMS |

    | ObjectBox | NoSQL DBMS |

    | Neo4j | 图 DBMS |


    我们在本书中大量使用了 Swift 的内置语言特性，例如高阶函数和 `KeyPath` 类型。高阶函数在我们几乎所有的代码项目中都扮演了重要角色。诸如 `filter(_:)`、`reduce(_:)`
    和 `map(_:)` 之类的方法帮助我们转换和精简数据集，直到得出最终结果。`KeyPath` 类型通过允许调用函数选择一个或多个目标变量，使我们的某些算法更具通用性。这种方法使我们能够创建真正通用的程序，例如，快速更改用于线性回归计算的变量。


    Swift 的另一个宝贵特性是，通过 `Encodable` 和 `Decodable` 协议，我们可以获得一个数据编解码器的世界。有些是苹果提供给我们的，另一些则来自才华横溢的第三方开发者。无论我们使用何种数据格式，几乎可以肯定都有大量解析数据文件的选项，无需我们手动拆解。


    ## 概率论


    在第 2 章中，我们介绍了概率论中一些最重要的概念。我们了解到，尽管这看起来像是一个小众话题，但我们大多数人在日常生活中都会遇到它。这里列出一些现实世界应用的例子：


    - 天气预报可能会告诉我们，明天下雨的概率是 5%。

    - 一项民意调查可能显示，一位总统候选人领先对手 2%，但也可能得出结论，该结果在统计上并不显著。

    - 记录显示，一个国家 85% 的人口接种了针对一种新疾病的疫苗，而住院的人中有 50% 未接种疫苗。


    最后一个例子非常适合应用我们学到的另一个重要概念——贝叶斯定理。利用贝叶斯法则，例如，我们可以计算出在接种疫苗后住院的概率。这个看似简单的公式提供了一种强大的工具，通过向我们的估计中注入更多信息，来权衡不同的情景。


    第 2 章还向我们介绍了独立性，以及它如何经常简化我们的计算。有些人可能会认为万物都是相互关联的，两个事件永远不可能真正独立。然而，如果两个事件对彼此概率的影响小到可以接受，我们通常就认为它们是独立的。原因之一是我们喜欢简单，思考不相互作用的事物不那么复杂。另一个原因是，如果影响足够小，我们最终得到的近似值仍然接近真实值，因此不会损失太多精度。


    ## 分布


    在学习样本空间的过程中，我们了解了如何根据样本点的性质对其进行分类。这种看待可能结果的方式引导我们讨论了离散分布和连续分布及其性质。


    离散分布以其概率质量函数 (PMF) 为特征，而连续分布则具有概率密度函数 (PDF)。两者都描述了分布中包含的所有样本点的可能性。然而，我们还了解到，只有
    PMF 能得出一个可以解释为概率的数字。另一方面，PDF 给出的是相对似然值。可能性更大的样本点会得到更高的数值，但我们需要计算一个积分才能得到正确的概率。我们还了解到，在连续分布中，单个样本点的概率为零，我们应该计算样本点范围内的概率。


    另一个帮助我们描述分布的函数是累积分布函数 (CDF)。它告诉我们样本落在或低于指定点的概率。例如，标准正态分布的 CDF 会告诉我们随机样本小于或等于零的概率是
    50%。


    第 3 章还介绍了期望值的概念。最常见的期望值是平均值。我们通过在给定分布中将每个样本点按其概率加权来计算它。然而，还有其他期望值，例如分布的方差、偏度和峰度。我们在学习中涵盖了方差及其密切相关的标准差。但另外两个性质很容易查找和理解，因为它们建立在相同的概念之上。

    '
- fmt: '## Regression Techniques


    Chapter [4](#512351_1_En_4_Chapter.xhtml) guided us through both simple and multiple
    linear regression. On the way, we learned about a range of related methods.


    - `Linear interpolation` and `extrapolation` from two data points are helpful
    if we believe an exact linear relationship between two properties exists. One
    example used in the chapter was the relationship between weight and cost when
    purchasing apples. If one pound of apples costs $1.3, it is reasonable to believe
    that two pounds will cost us $2.6.

    - `Linear splines` can be useful when we have irregular data points that show
    a linear tendency. We can then interpolate between the available data points to
    approximate any value between them. However, we also learned that this method
    has shortcomings, such as the need to store a complete data set and the fact that
    our estimates can diverge from the true values quickly if we try to approximate
    values outside the range of our original data.

    - `Linear regression` tries to strike a sweet spot between the previous two methods.
    It only requires that we store the coefficients for a linear equation, and it
    generalizes the overall trend of the original data. The former implies that we
    do not need much storage space to make estimates once we have the coefficients.
    The latter, in turn, reduces the problems we saw that splines could have outside
    of the range where we have empirical data.


    To construct the formula and algorithm for linear regression, we also learned
    about `loss functions`. Loss functions are by no means unique to linear regression.
    We use them in many exciting applications, such as machine learning algorithms,
    where there is a need to approximate functions.


    Chapter [4](#512351_1_En_4_Chapter.xhtml) also introduced us to the `Accelerate`
    framework and the `BLAS` and `LAPACK` libraries. All of these provide excellent
    tools when working with mathematical computations that involve linear algebra.
    The fact that the computer can parallelize much of the work saves a massive amount
    of time compared to computing everything serially. We only covered the minuscule
    functionality we needed for our specific use case, but these libraries contain
    an ocean of valuable mathematical functions at our disposal. Feel free to dive
    further into the documentation referenced in Chapter [4](#512351_1_En_4_Chapter.xhtml)
    to discover more.


    ## Hypothesis Testing


    As we stated at the beginning of Chapter [5](#512351_1_En_5_Chapter.xhtml), hypothesis
    testing is one of the topics that students find most challenging to understand.
    Just the task of identifying the null and alternative hypotheses may be difficult.


    - The null hypothesis, `H[0]`, suggests that the currently accepted truth still
    holds. For example, if previous studies have shown that Michigan’s average temperature
    is 64.6°F in April, then `H[0]` states it still is.

    - The alternative hypothesis, `H[A]`, states a new assumption we want to test.
    If we believe that Michigan has become warmer in recent years, `H[A]` states that
    the average temperature is greater than 64.6°F.


    To start testing, we needed to find out more about the distribution of sample
    means. As we use more and more samples for our calculations, the sample mean tends
    more and more toward the true mean. However, unless we use the entire population,
    there is a non-negligible likelihood that our calculation is off by some amount.
    To put a number on the uncertainty, we turn to the `Central Limit Theorem`, which
    tells us that a normal distribution can approximate the distribution of sample
    means. This theorem holds regardless of which distribution the samples come from,
    given that we have enough samples.


    Learning how to estimate the uncertainty in our computations allowed us to determine
    cutoff points where the alternative hypothesis was unlikely enough to have happened
    by random chance. The cutoffs led us to define confidence levels, `alpha` values,
    and `p-values`, which are important tools when quantifying how uncertain a result
    is. Including these values lets others decide whether or not to act on the results.


    ## Statistical Methods for Data Compression


    Statistical methods are not exclusive to heavy data science tasks or machine learning
    algorithms. In Chapter [6](#512351_1_En_6_Chapter.xhtml), we learned that we could
    use them in more traditional computer science topics like data compression. To
    start, we had to learn about functions.


    - `Surjective functions` behave such that we can reach all elements in the range.
    However, multiple domain members can map to the same range element. Because of
    this, we may not be able to determine a unique mapping back to the domain.

    - `Injective functions` map all domain members to unique elements in the range.
    This behavior is nice since there is a unique way to map those elements back to
    their respective domain member. However, there may be elements in the range that
    are unreachable from the domain. This drawback means that we cannot guarantee
    an inverse mapping from the range to the domain exists.

    - `Bijective functions` are both surjective and injective, which means that all
    domain members map a unique element in the range, and all range members are reachable.
    When both of these properties apply, we know that our function has an inverse.
    We can use this pair of functions to develop lossless compression algorithms.


    Apart from bijection, we also introduced the concept of “approximate bijection.”
    While this is not a commonly accepted term, it appropriately describes the idea
    of lossy functions, where the inverse is not guaranteed to map a range member
    back to the original domain element. Instead, it maps back to some member in its
    proximity.


    To implement a compression algorithm, we needed some bijective function to shrink
    and expand our data. In our case, we learned about `Huffman codes` and how to
    create them using `Huffman trees`. Thanks to the theory behind Huffman codes,
    we managed to design an algorithm that significantly shrank a text file and later
    decompressed it back to its original form. During the implementation, we also
    got hands-on experience using some of Swift’s more low-level functionalities,
    such as bitwise operators and pointer types. We also got to see some more general
    computer science conventions, such as memory alignment. These conventions serve
    their purposes well, but they also force us to think about how to structure our
    data when packing it. In connection to this, we also suggested an exercise related
    to improving the algorithm’s way of packing and unpacking bytes.'
  raw: '## Regression Techniques


    Chapter [4](#512351_1_En_4_Chapter.xhtml) guided us through both simple and multiple
    linear regression. On the way, we learned about a range of related methods.


    *   Linear interpolation and extrapolation from two data points are helpful if
    we believe an exact linear relationship between two properties exists. One example
    used in the chapter was the relationship between weight and cost when purchasing
    apples. If one pound of apples costs $1.3, it is reasonable to believe that two
    pounds will cost us $2.6.


    *   Linear splines can be useful when we have irregular data points that show
    a linear tendency. We can then interpolate between the available data points to
    approximate any value between them. However, we also learned that this method
    has shortcomings, such as the need to store a complete data set and the fact that
    our estimates can diverge from the true values quickly if we try to approximate
    values outside the range of our original data.


    *   Linear regression tries to strike a sweet spot between the previous two methods.
    It only requires that we store the coefficients for a linear equation, and it
    generalizes the overall trend of the original data. The former implies that we
    do not need much storage space to make estimates once we have the coefficients.
    The latter, in turn, reduces the problems we saw that splines could have outside
    of the range where we have empirical data.


    To construct the formula and algorithm for linear regression, we also learned
    about loss functions. Loss functions are by no means unique to linear regression.
    We use them in many exciting applications, such as machine learning algorithms,
    where there is a need to approximate functions.


    Chapter [4](#512351_1_En_4_Chapter.xhtml) also introduced us to the Accelerate
    framework and the BLAS and LAPACK libraries. All of these provide excellent tools
    when working with mathematical computations that involve linear algebra. The fact
    that the computer can parallelize much of the work saves a massive amount of time
    compared to computing everything serially. We only covered the minuscule functionality
    we needed for our specific use case, but these libraries contain an ocean of valuable
    mathematical functions at our disposal. Feel free to dive further into the documentation
    referenced in Chapter [4](#512351_1_En_4_Chapter.xhtml) to discover more.


    ## Hypothesis Testing


    As we stated at the beginning of Chapter [5](#512351_1_En_5_Chapter.xhtml), hypothesis
    testing is one of the topics that students find most challenging to understand.
    Just the task of identifying the null and alternative hypotheses may be difficult.


    *   The null hypothesis, H[0], suggests that the currently accepted truth still
    holds. For example, if previous studies have shown that Michigan’s average temperature
    is 64.6°F in April, then H[0] states it still is.


    *   The alternative hypothesis, H[A], states a new assumption we want to test.
    If we believe that Michigan has become warmer in recent years, H[A] states that
    the average temperature is greater than 64.6°F.


    To start testing, we needed to find out more about the distribution of sample
    means. As we use more and more samples for our calculations, the sample mean tends
    more and more toward the true mean. However, unless we use the entire population,
    there is a non-negligible likelihood that our calculation is off by some amount.
    To put a number on the uncertainty, we turn to the Central Limit Theorem, which
    tells us that a normal distribution can approximate the distribution of sample
    means. This theorem holds regardless of which distribution the samples come from,
    given that we have enough samples.


    Learning how to estimate the uncertainty in our computations allowed us to determine
    cutoff points where the alternative hypothesis was unlikely enough to have happened
    by random chance. The cutoffs led us to define confidence levels, alpha values,
    and p-values, which are important tools when quantifying how uncertain a result
    is. Including these values lets others decide whether or not to act on the results.


    ## Statistical Methods for Data Compression


    Statistical methods are not exclusive to heavy data science tasks or machine learning
    algorithms. In Chapter [6](#512351_1_En_6_Chapter.xhtml), we learned that we could
    use them in more traditional computer science topics like data compression. To
    start, we had to learn about functions.


    *   Surjective functions behave such that we can reach all elements in the range.
    However, multiple domain members can map to the same range element. Because of
    this, we may not be able to determine a unique mapping back to the domain.


    *   Injective functions map all domain members to unique elements in the range.
    This behavior is nice since there is a unique way to map those elements back to
    their respective domain member. However, there may be elements in the range that
    are unreachable from the domain. This drawback means that we cannot guarantee
    an inverse mapping from the range to the domain exists.


    *   Bijective functions are both surjective and injective, which means that all
    domain members map a unique element in the range, and all range members are reachable.
    When both of these properties apply, we know that our function has an inverse.
    We can use this pair of functions to develop lossless compression algorithms.


    Apart from bijection, we also introduced the concept of “approximate bijection.”
    While this is not a commonly accepted term, it appropriately describes the idea
    of lossy functions, where the inverse is not guaranteed to map a range member
    back to the original domain element. Instead, it maps back to some member in its
    proximity.


    To implement a compression algorithm, we needed some bijective function to shrink
    and expand our data. In our case, we learned about Huffman codes and how to create
    them using Huffman trees. Thanks to the theory behind Huffman codes, we managed
    to design an algorithm that significantly shrank a text file and later decompressed
    it back to its original form. During the implementation, we also got hands-on
    experience using some of Swift’s more low-level functionalities, such as bitwise
    operators and pointer types. We also got to see some more general computer science
    conventions, such as memory alignment. These conventions serve their purposes
    well, but they also force us to think about how to structure our data when packing
    it. In connection to this, we also suggested an exercise related to improving
    the algorithm’s way of packing and unpacking bytes.'
