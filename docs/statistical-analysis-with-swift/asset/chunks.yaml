    *   *P*[*temperature* > 20|*weather* = *sunny*] = 0.6


    Although the last expression is very similar to what we are interested in, it
    is not entirely right. However, as we are about to see, these three expressions
    can together provide enough information to compute the probability we want.


    In the section on conditional probability, we saw that we could express the probability
    of two events occurring by using the following formula:


    ![$$ P\left[{E}_1\cap {E}_2\right]=P\left[{E}_2|{E}_1\right]P\left[{E}_1\right]
    $$](images/512351_1_En_2_Chapter/512351_1_En_2_Chapter_TeX_Equn.png)


    However, it does not matter which event we condition on. The following “reversed”
    expression works equally well, as we can simply switch which event we condition
    on:


    ![$$ P\left[{E}_1\cap {E}_2\right]=P\left[{E}_1|{E}_2\right]P\left[{E}_2\right]
    $$](images/512351_1_En_2_Chapter/512351_1_En_2_Chapter_TeX_Equo.png)


    This realization is precisely what Bayes’ Theorem utilizes. Since we now have
