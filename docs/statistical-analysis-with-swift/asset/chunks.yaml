- fmt: "### Higher-Order Functions\n\nWhen setting up data transformation pipelines,\
    \ it is often helpful to make use of higher-order functions. A higher-order function\
    \ is a function that does at least one of the following:\n\n- It takes one or\
    \ more other functions as input.\n- It returns another function as output.\n\n\
    As previously mentioned, we have used higher-order functions in some examples\
    \ already. In Listing [1-4](#512351_1_En_1_Chapter.xhtml#PC4), we passed a trailing\
    \ closure (i.e., a function) into the initializer of the `CSVDecoder` to configure\
    \ the parsing strategy. In Listing [1-6](#512351_1_En_1_Chapter.xhtml#PC6), we\
    \ used the `map(_:)` method to transform some of our data using a `KeyPath`.\n\
    \nHigher-order functions are common in Swift’s Standard Library and third-party\
    \ libraries. Many of us may have probably used them without even realizing it.\
    \ Beyond `map(_:)`, the Swift Standard Library also provides `filter(_:)`, `reduce(_:_:)`,\
    \ and `sorted(by:)`, just to name a few. To get a firm grasp on how these methods\
    \ operate, we will implement a new higher-order function as an extension of the\
    \ `MutableCollection` protocol. Doing so will allow us to see what happens under\
    \ the hood and understand how powerful higher-order functions can be when manipulating\
    \ data.\n\nOur higher-order function is named `apply(to:_:)`. The concept is relatively\
    \ simple – for every data point in a data set, it computes a transformation and\
    \ writes back the value into the data point. One could use such methods to tidy\
    \ up or polish a data set on the fly before sending it through a pipeline of statistical\
    \ calculations. Such operations could, for example, include rescaling, quantization,\
    \ or normalization of numerical data. Listing [1-8](#512351_1_En_1_Chapter.xhtml#PC8)\
    \ shows an implementation of this function and an example of how to use it.\n\n\
    ```\nextension MutableCollection {\n    mutating func apply(\n        to key:\
    \ WritableKeyPath,\n        _ transform: (T) -> T\n    ) {\n        for index\
    \ in self.indices {\n            let newValue = transform(\n                self[index][keyPath:\
    \ key]\n            )\n            self[index][keyPath: key] = newValue\n    \
    \    }\n    }\n}\n\nvar points = [\n    CGPoint(x: 1, y: 1),\n    CGPoint(x: 2,\
    \ y: 2),\n    CGPoint(x: 3, y: 3)\n]\n\nprint(\"Before: \\(points)\")\npoints.apply(to:\
    \ \\.y) { value in\n    value * value\n}\nprint(\"After:  \\(points)\")\n// Prints:\n\
    // Before: [(1.0, 1.0), (2.0, 2.0), (3.0, 3.0)]\n// After:  [(1.0, 1.0), (2.0,\
    \ 4.0), (3.0, 9.0)]\nListing 1-8\nAn implementation of the higher-order function\
    \ apply(to:_:)\n```\n\nThe code in Listing [1-8](#512351_1_En_1_Chapter.xhtml#PC8)\
    \ is quite complex. Let us briefly walk through some of the critical sections\
    \ to understand what is happening:\n\n- We make the extension on the `MutableCollection`\
    \ protocol. Doing so makes this implementation available on every collection type\
    \ that supports mutation. This propagation of functionality is thanks to the protocol-oriented\
    \ nature of Swift, but we will not cover that mechanism further in this book.\n\
    - The method `apply(to:_:)` takes two arguments. The first one is a `KeyPath`\
    \ type which can reference any generic property of a data element. This particular\
    \ type of `KeyPath` also supports write operations, and not just reads.\n- The\
    \ second argument is another function. It uses the generic type `T` both as input\
    \ and output, which is the same `T` that the `KeyPath` references. This function\
    \ should transform a data property’s current value into some new value that is\
    \ simpler to use or more appropriate for other calculations.\n- In the method\
    \ body, `apply(to:_:)` iterates over all data points in the collection. It applies\
    \ the transformation function and writes back the new value to the data set. When\
    \ we return, the data set no longer contains the old values but includes the specified\
    \ transformations. It is notable that `apply(to:_:)` knows nothing about how to\
    \ transform the values. The developer specifies that function at the call site,\
    \ which makes this a very versatile approach.\n\nThere are, of course, many more\
    \ subtle things going on in this function, and we could probably spend a whole\
    \ other chapter talking about them. However, these few pointers should be enough\
    \ to pick up on the main ideas we want to convey. Higher-order functions are powerful\
    \ tools that provide highly customizable ways of manipulating data, and we will\
    \ use them frequently throughout the problems we solve here.\n\n## Chapter Summary\n\
    \nThis chapter has investigated whether or not Swift is an appropriate language\
    \ for statistical analysis problems. We looked at the ecosystem surrounding the\
    \ language and how well it accommodates our needs when working with such tasks.\
    \ After some discussion, we concluded that Swift as a language provides many features\
    \ that we would like to use when working with statistical analysis.\n\nWe have\
    \ also looked at some of the details of Swift, putting extra weight on the types\
    \ and concepts that are extra important for our use case. We learned how to decode\
    \ data using the `Decodable` protocol and manipulate data points using different\
    \ `KeyPath` types and higher-order functions. With these insights and new knowledge\
    \ at our disposal, it is time to start looking at the actual subject – statistical\
    \ analysis.\n\n**Note**\n\nSwift.org contains several great resources about Swift\
    \ as a programming language. To learn more, visit [`https://swift.org`](https://swift.org).\n\
    \n# 2. Introduction to Probability and Random Variables\n\nNow that we have discussed\
    \ the feasibility of choosing Swift as our primary tool for statistical analysis,\
    \ we should brush up on the concepts of probabilities and random variables. These\
    \ are fundamental building blocks of statistics, and we will use them extensively\
    \ throughout this book. This chapter introduces some mathematical theory and lays\
    \ the foundation on much of the notation we use when discussing problems and solutions.\
    \ It also discusses other essential aspects, such as independence, variability,\
    \ and conditioning. Without further ado, let us start by learning about probability."
  raw: '### Higher-Order Functions


    When setting up data transformation pipelines, it is often helpful to make use
    of higher-order functions. A higher-order function is a function that does at
    least one of the following:


    *   It takes one or more other functions as input.


    *   It returns another function as output.


    As previously mentioned, we have used higher-order functions in some examples
    already. In Listing [1-4](#512351_1_En_1_Chapter.xhtml#PC4), we passed a trailing
    closure (i.e., a function) into the initializer of the `CSVDecoder` to configure
    the parsing strategy. In Listing [1-6](#512351_1_En_1_Chapter.xhtml#PC6), we used
    the `map(_:)` method to transform some of our data using a `KeyPath`.


    Higher-order functions are common in Swift’s Standard Library and third-party
    libraries. Many of us may have probably used them without even realizing it. Beyond
    `map(_:)`, the Swift Standard Library also provides `filter(_:)`, `reduce(_:_:)`,
    and `sorted(by:)`, just to name a few. To get a firm grasp on how these methods
    operate, we will implement a new higher-order function as an extension of the
    `MutableCollection` protocol. Doing so will allow us to see what happens under
    the hood and understand how powerful higher-order functions can be when manipulating
    data.


    Our higher-order function is named `apply(to:_:)`. The concept is relatively simple
    – for every data point in a data set, it computes a transformation and writes
    back the value into the data point. One could use such methods to tidy up or polish
    a data set on the fly before sending it through a pipeline of statistical calculations.
    Such operations could, for example, include rescaling, quantization, or normalization
    of numerical data. Listing [1-8](#512351_1_En_1_Chapter.xhtml#PC8) shows an implementation
    of this function and an example of how to use it.


    ```

    extension MutableCollection {

    mutating func apply(

    to key: WritableKeyPath,

    _ transform: (T) -> T

    ) {

    for index in self.indices {

    let newValue = transform(

    self[index][keyPath: key]

    )

    self[index][keyPath: key] = newValue

    }

    }

    }

    var points = [

    CGPoint(x: 1, y: 1),

    CGPoint(x: 2, y: 2),

    CGPoint(x: 3, y: 3)

    ]

    print("Before: \(points)")

    points.apply(to: \.y) { value in

    value * value

    }

    print("After:  \(points)")

    // Prints:

    // Before: [(1.0, 1.0), (2.0, 2.0), (3.0, 3.0)]

    // After:  [(1.0, 1.0), (2.0, 4.0), (3.0, 9.0)]

    Listing 1-8

    An implementation of the higher-order function apply(to:_:)

    ```


    The code in Listing [1-8](#512351_1_En_1_Chapter.xhtml#PC8) is quite complex.
    Let us briefly walk through some of the critical sections to understand what is
    happening:


    *   We make the extension on the `MutableCollection` protocol. Doing so makes
    this implementation available on every collection type that supports mutation.
    This propagation of functionality is thanks to the protocol-oriented nature of
    Swift, but we will not cover that mechanism further in this book.


    *   The method `apply(to:_:)` takes two arguments. The first one is a KeyPath
    type which can reference any generic property of a data element. This particular
    type of KeyPath also supports write operations, and not just reads.


    *   The second argument is another function. It uses the generic type `T` both
    as input and output, which is the same `T` that the KeyPath references. This function
    should transform a data property’s current value into some new value that is simpler
    to use or more appropriate for other calculations.


    *   In the method body, `apply(to:_:)` iterates over all data points in the collection.
    It applies the transformation function and writes back the new value to the data
    set. When we return, the data set no longer contains the old values but includes
    the specified transformations. It is notable that `apply(to:_:)` knows nothing
    about how to transform the values. The developer specifies that function at the
    call site, which makes this a very versatile approach.


    There are, of course, many more subtle things going on in this function, and we
    could probably spend a whole other chapter talking about them. However, these
    few pointers should be enough to pick up on the main ideas we want to convey.
    Higher-order functions are powerful tools that provide highly customizable ways
    of manipulating data, and we will use them frequently throughout the problems
    we solve here.


    ## Chapter Summary


    This chapter has investigated whether or not Swift is an appropriate language
    for statistical analysis problems. We looked at the ecosystem surrounding the
    language and how well it accommodates our needs when working with such tasks.
    After some discussion, we concluded that Swift as a language provides many features
    that we would like to use when working with statistical analysis.


    We have also looked at some of the details of Swift, putting extra weight on the
    types and concepts that are extra important for our use case. We learned how to
    decode data using the Decodable protocol and manipulate data points using different
    KeyPath types and higher-order functions. With these insights and new knowledge
    at our disposal, it is time to start looking at the actual subject – statistical
    analysis.


    Note


    Swift.org contains several great resources about Swift as a programming language.
    To learn more, visit [`https://swift.org`](https://swift.org).


    # 2. Introduction to Probability and Random Variables


    Now that we have discussed the feasibility of choosing Swift as our primary tool
    for statistical analysis, we should brush up on the concepts of probabilities
    and random variables. These are fundamental building blocks of statistics, and
    we will use them extensively throughout this book. This chapter introduces some
    mathematical theory and lays the foundation on much of the notation we use when
    discussing problems and solutions. It also discusses other essential aspects,
    such as independence, variability, and conditioning. Without further ado, let
    us start by learning about probability.'
  trans: "\n### 高阶函数\n\n在构建数据转换管道时，使用高阶函数通常十分有用。高阶函数是指至少满足以下条件之一的函数：\n\n- 它接受一个或多个其他函数作为输入。\n\
    - 它返回另一个函数作为输出。\n\n如前所述，我们在一些示例中已经使用过高阶函数。在代码清单 1-4 中，我们将一个尾随闭包（即一个函数）传入了 `CSVDecoder`\
    \ 的初始化器来配置解析策略。在代码清单 1-6 中，我们使用了 `map(_:)` 方法，通过 `KeyPath` 对部分数据进行了转换。\n\n高阶函数在\
    \ Swift 标准库和第三方库中很常见。我们中的许多人可能已经使用过它们，甚至自己都未曾意识到。除了 `map(_:)`，Swift 标准库还提供了 `filter(_:)`、`reduce(_:_:)`\
    \ 和 `sorted(by:)` 等方法，仅举几例。为了深入理解这些方法的运作方式，我们将实现一个新的高阶函数，作为 `MutableCollection`\
    \ 协议的扩展。这样做可以让我们看到其底层实现，并理解高阶函数在操作数据时能有多么强大。\n\n我们的高阶函数名为 `apply(to:_:)`。其概念相对简单——对于数据集中的每一个数据点，它计算一次转换并将结果写回该数据点。你可以使用这类方法在数据送入统计计算管道之前，对其进行即时整理或优化。例如，此类操作可能包括对数值数据进行重新缩放、量化或归一化。代码清单\
    \ 1-8 展示了该函数的实现及其使用示例。\n\n```\nextension MutableCollection {\n    mutating func\
    \ apply(\n        to key: WritableKeyPath,\n        _ transform: (T) -> T\n  \
    \  ) {\n        for index in self.indices {\n            let newValue = transform(\n\
    \                self[index][keyPath: key]\n            )\n            self[index][keyPath:\
    \ key] = newValue\n        }\n    }\n}\n\nvar points = [\n    CGPoint(x: 1, y:\
    \ 1),\n    CGPoint(x: 2, y: 2),\n    CGPoint(x: 3, y: 3)\n]\n\nprint(\"Before:\
    \ \\(points)\")\npoints.apply(to: \\.y) { value in\n    value * value\n}\nprint(\"\
    After:  \\(points)\")\n// 输出:\n// Before: [(1.0, 1.0), (2.0, 2.0), (3.0, 3.0)]\n\
    // After:  [(1.0, 1.0), (2.0, 4.0), (3.0, 9.0)]\n代码清单 1-8\n高阶函数 apply(to:_:) 的实现\n\
    ```\n\n代码清单 1-8 中的代码相当复杂。让我们简单过一遍其中的一些关键部分，以了解发生了什么：\n\n- 我们对 `MutableCollection`\
    \ 协议进行扩展。这使得该实现可用于所有支持可变操作的集合类型。这种功能的传播得益于 Swift 面向协议的特性，但我们在本书中不再进一步探讨该机制。\n\
    - 方法 `apply(to:_:)` 接受两个参数。第一个参数是 `KeyPath` 类型，它可以引用数据元素的任何泛型属性。这种特定类型的 `KeyPath`\
    \ 也支持写操作，而不仅仅是读操作。\n- 第二个参数是另一个函数。它使用泛型类型 `T` 同时作为输入和输出，这与 `KeyPath` 引用的 `T` 相同。该函数应将数据属性的当前值转换为某种更易于使用或更适合其他计算的新值。\n\
    - 在方法体中，`apply(to:_:)` 遍历集合中的所有数据点。它应用转换函数，并将新值写回到数据集中。当函数返回时，数据集不再包含旧值，而是包含了指定的转换结果。值得注意的是，`apply(to:_:)`\
    \ 对如何转换值一无所知。该函数由开发者在调用点指定，这使得该方法非常灵活。\n\n当然，这个函数内部还有更多微妙之处，我们或许可以用一整章来讨论它们。不过，这几个要点应该足以让你理解我们想传达的主要思想。高阶函数是强大的工具，能提供高度可定制的方式来操作数据，我们将在解决本书中的问题时频繁使用它们。\n\
    \n## 本章小结\n\n本章探讨了 Swift 是否适合用于统计分析问题。我们审视了该语言周边的生态系统，以及它在处理此类任务时如何满足我们的需求。经过一番讨论，我们得出结论：Swift\
    \ 作为一种语言，提供了许多我们在进行统计分析时希望使用的特性。\n\n我们还研究了 Swift 的一些细节，特别关注那些对我们用例格外重要的类型和概念。我们学习了如何使用\
    \ `Decodable` 协议解码数据，以及如何使用不同的 `KeyPath` 类型和高阶函数来操作数据点。掌握了这些见解和新知识后，我们该开始研究实际的主题——统计分析了。\n\
    \n**注意**\n\nSwift.org 上有大量关于 Swift 编程语言的优秀资源。欲了解更多信息，请访问 [`https://swift.org`](https://swift.org)。\n\
    \n# 2. 概率与随机变量导论\n\n既然我们已经讨论了选择 Swift 作为统计分析主要工具的可行性，接下来应该温习一下概率和随机变量的概念。这些是统计学的基本构建块，我们将在本书中频繁使用它们。本章介绍一些数学理论，并为我们讨论问题和解决方案时使用的许多符号奠定基础。本章还讨论了其他关键方面，例如独立性、变异性和条件性。闲话少叙，让我们从学习概率开始吧。\n"
- fmt: "# Probability\n\nEven though we may not think about it, probabilities are\
    \ not just mathematical concepts exclusive to researchers and engineers. All of\
    \ us evaluate and interpret probabilities every day. If we plan a trip to the\
    \ beach this weekend and the weather forecast tells us that there is a 60% chance\
    \ of rain on Saturday, we may choose to go on Sunday instead. If we hear that\
    \ the traffic is horrible on our usual route to work this morning, we may take\
    \ our chances with a detour to get there on time. Granted, most of us probably\
    \ do not perform any rigorous mathematical analysis in these situations. Instead,\
    \ most of the time, we may rely on a gut feeling of what action maximizes the\
    \ chances of reaching our goals. However, when push comes to shove, we are still\
    \ estimating and evaluating probabilities of different outcomes.\n\nA probability\
    \ is, at its core, just a tool that helps us understand how likely an event is\
    \ to happen. As we saw earlier, some may express it as a percentage by using numbers\
    \ between 0 and 100. This book will work with probabilities as real-valued numbers\
    \ in the range between 0 and 1, inclusively. This representation is more common\
    \ in the scientific community, and it lends itself better for calculations. We\
    \ describe a probability and the way it impacts an associated event as follows:\n\
    \n- An event is very likely to happen if it has a probability close to 1.\n- Similarly,\
    \ an event is very improbable if its probability is close to 0.\n- An event with\
    \ a probability of either 0 or 1 is determined. A probability of 0 suggests that\
    \ the outcome is impossible, while 1 tells us that it is sure to happen.\n\nTo\
    \ give a concrete example, we can consider the variable assignment `let myConstant\
    \ = 5`. We declare the variable using the `let` keyword, which makes it immutable.\
    \ We can describe `myConstant` with the following probability:\n\n![$$ P\\left[\\\
    mathrm{myConstant}=5\\right]=1 $$](images/512351_1_En_2_Chapter/512351_1_En_2_Chapter_TeX_Equa.png)\n\
    \nThe notation above reads as “the probability that `myConstant` is equal to 5\
    \ is 1” and tells us that no matter how many times we look, the value of `myConstant`\
    \ is sure to be 5.\n\nHowever, the exciting bits of statistics and probability\
    \ theory appear when we move away from the certainties. For example, what does\
    \ it mean for something to have a probability of 0.3? To keep the discussions\
    \ comprehensible as we move forward, we will use a simple six-sided die to make\
    \ examples. Using a familiar item to display the usefulness of sometimes abstract\
    \ topics will hopefully lead to a better understanding of why we benefit from\
    \ talking about them.\n\n## Sample Spaces\n\nBefore estimating the probability\
    \ of one or more events, it is helpful to know which ones are even available.\
    \ In our six-sided die example, it is relatively easy to enumerate all possible\
    \ outcomes. Doing so, we end up with the set of all integers from one through\
    \ six. We call these numbers the sample space and denote them using the letter\
    \ S, like so:\n\n![$$ S=\\left\\{1,2,3,4,5,6\\right\\} $$](images/512351_1_En_2_Chapter/512351_1_En_2_Chapter_TeX_Equb.png)\n\
    \nThis particular sample space is a pretty manageable list of numbers, which is\
    \ fortunate for us. However, the sample spaces of many other problems are massive,\
    \ even infinite. For example, if we asked someone to pick any real-valued number\
    \ they could think of, our sample space would be the set of all real numbers,\
    \ which is an infinite set.\n\nSince we know that S contains all possible outcomes\
    \ for a die roll, we can also derive one of the most fundamental axioms of probability,\
    \ namely, that\n\n![$$ P\\left[\\mathrm{S}\\right]=1 $$](images/512351_1_En_2_Chapter/512351_1_En_2_Chapter_TeX_Equc.png)\n\
    \nThe equation above states that if we roll a die, it is 100% sure that the outcome\
    \ is one of the sample points contained in the sample space.\n\n## Events\n\n\
    An event is a subset of sample points from the sample space. Suppose that we define\
    \ E[1] as rolls where the die shows an even number; we effectively say that E[1]\
    \ = {2, 4, 6}. If we also define an event E[2] to be rolls that show an odd number,\
    \ we get two so-called mutually exclusive events. Two events are said to be mutually\
    \ exclusive if they can never happen simultaneously. The reasoning is simple in\
    \ our case. Since the number we roll is either even or odd and never both, E[1]\
    \ and E[2] can never happen at the same time. This property lays the foundation\
    \ for another probability axiom, which states that:\n\nIf {E[1], E[2], E[3], …}\
    \ is a collection of mutually exclusive events, then\n\n![$$ P\\left[{E}_1\\cup\
    \ {E}_2\\cup {E}_3\\cup \\dots \\right]=P\\left[{E}_1\\right]+P\\left[{E}_2\\\
    right]+P\\left[{E}_3\\right]+\\dots $$](images/512351_1_En_2_Chapter/512351_1_En_2_Chapter_TeX_Equd.png)\n\
    \nThis axiom tells us that the total probability of a union of mutually exclusive\
    \ events is equal to the sum of individual probabilities. Let us assume that our\
    \ die is fair and that each side has an equal probability of showing on a roll.\
    \ We compute the individual probabilities by dividing 1 (the probability of the\
    \ entire sample space) by the number of items in the set, which yields 1/6 for\
    \ each outcome. Now we define an event A such that a roll shows either one or\
    \ two. Using the previous formula, we compute that the total probability of A\
    \ is\n\n![$$ P\\left[A\\right]=P\\left[ roll=1\\cup roll=2\\right]=P\\left[ roll=1\\\
    right]+P\\left[ roll=2\\right]=\\frac{1}{6}+\\frac{1}{6}=\\frac{1}{3} $$](images/512351_1_En_2_Chapter/512351_1_En_2_Chapter_TeX_Eque.png)\n\
    \nIt is essential to note that this computation only holds under the assumption\
    \ that the events are mutually exclusive. If they are not, we will need the help\
    \ of another well-known rule.\n\n> **Note**  \n> The `∪` operator used in the\
    \ previous axiom is called the union operator. It takes two sets of items and\
    \ merges them into a single set. The union of two sets contains all the original\
    \ sets’ elements but does not contain any duplicates."
  raw: '## Probability


    Even though we may not think about it, probabilities are not just mathematical
    concepts exclusive to researchers and engineers. All of us evaluate and interpret
    probabilities every day. If we plan a trip to the beach this weekend and the weather
    forecast tells us that there is a 60% chance of rain on Saturday, we may choose
    to go on Sunday instead. If we hear that the traffic is horrible on our usual
    route to work this morning, we may take our chances with a detour to get there
    on time. Granted, most of us probably do not perform any rigorous mathematical
    analysis in these situations. Instead, most of the time, we may rely on a gut
    feeling of what action maximizes the chances of reaching our goals. However, when
    push comes to shove, we are still estimating and evaluating probabilities of different
    outcomes.


    A probability is, at its core, just a tool that helps us understand how likely
    an event is to happen. As we saw earlier, some may express it as a percentage
    by using numbers between 0 and 100\. This book will work with probabilities as
    real-valued numbers in the range between 0 and 1, inclusively. This representation
    is more common in the scientific community, and it lends itself better for calculations.
    We describe a probability and the way it impacts an associated event as follows:


    *   An event is very likely to happen if it has a probability close to 1.


    *   Similarly, an event is very improbable if its probability is close to 0.


    *   An event with a probability of either 0 or 1 is determined. A probability
    of 0 suggests that the outcome is impossible, while 1 tells us that it is sure
    to happen.


    To give a concrete example, we can consider the variable assignment `let myConstant
    = 5`. We declare the variable using the `let` keyword, which makes it immutable.
    We can describe `myConstant` with the following probability:


    ![$$ P\left[\mathrm{myConstant}=5\right]=1 $$](images/512351_1_En_2_Chapter/512351_1_En_2_Chapter_TeX_Equa.png)


    The notation above reads as “*the probability that myConstant is equal to 5 is
    1*” and tells us that no matter how many times we look, the value of `myConstant`
    is sure to be 5.


    However, the exciting bits of statistics and probability theory appear when we
    move away from the certainties. For example, what does it mean for something to
    have a probability of 0.3? To keep the discussions comprehensible as we move forward,
    we will use a simple six-sided die to make examples. Using a familiar item to
    display the usefulness of sometimes abstract topics will hopefully lead to a better
    understanding of why we benefit from talking about them.


    ### Sample Spaces


    Before estimating the probability of one or more events, it is helpful to know
    which ones are even available. In our six-sided die example, it is relatively
    easy to enumerate all possible outcomes. Doing so, we end up with the set of all
    integers from one through six. We call these numbers the *sample space* and denote
    them using the letter S, like so:


    ![$$ S=\left\{1,2,3,4,5,6\right\} $$](images/512351_1_En_2_Chapter/512351_1_En_2_Chapter_TeX_Equb.png)


    This particular sample space is a pretty manageable list of numbers, which is
    fortunate for us. However, the sample spaces of many other problems are massive,
    even infinite. For example, if we asked someone to pick any real-valued number
    they could think of, our sample space would be the set of all real numbers, which
    is an infinite set.


    Since we know that S contains all possible outcomes for a die roll, we can also
    derive one of the most fundamental axioms of probability, namely, that


    ![$$ P\left[\mathrm{S}\right]=1 $$](images/512351_1_En_2_Chapter/512351_1_En_2_Chapter_TeX_Equc.png)


    The equation above states that if we roll a die, it is 100% sure that the outcome
    is one of the sample points contained in the sample space.


    ### Events


    An *event* is a subset of sample points from the sample space. Suppose that we
    define E[1] as rolls where the die shows an even number; we effectively say that
    E[1] = {2, 4, 6}. If we also define an event E[2] to be rolls that show an odd
    number, we get two so-called *mutually exclusive* events. Two events are said
    to be mutually exclusive if they can never happen simultaneously. The reasoning
    is simple in our case. Since the number we roll is either even or odd and never
    both, E[1] and E[2] can never happen at the same time. This property lays the
    foundation for another probability axiom, which states that


    If {*E*[1], *E*[2], *E*[3], …} is a collection of mutually exclusive events, then


    ![$$ P\left[{E}_1\cup {E}_2\cup {E}_3\cup \dots \right]=P\left[{E}_1\right]+P\left[{E}_2\right]+P\left[{E}_3\right]+\dots
    $$](images/512351_1_En_2_Chapter/512351_1_En_2_Chapter_TeX_Equd.png)


    This axiom tells us that the total probability of a union of mutually exclusive
    events is equal to the sum of individual probabilities. Let us assume that our
    die is fair and that each side has an equal probability of showing on a roll.
    We compute the individual probabilities by dividing 1 (the probability of the
    entire sample space) by the number of items in the set, which yields 1/6 for each
    outcome. Now we define an event A such that a roll shows either one or two. Using
    the previous formula, we compute that the total probability of A is


    ![$$ P\left[A\right]=P\left[ roll=1\cup roll=2\right]=P\left[ roll=1\right]+P\left[
    roll=2\right]=\frac{1}{6}+\frac{1}{6}=\frac{1}{3} $$](images/512351_1_En_2_Chapter/512351_1_En_2_Chapter_TeX_Eque.png)


    It is essential to note that this computation only holds under the assumption
    that the events are mutually exclusive. If they are not, we will need the help
    of another well-known rule.


    Note


    The ∪ operator used in the previous axiom is called the union operator. It takes
    two sets of items and merges them into a single set. The union of two sets contains
    all the original sets’ elements but does not contain any duplicates.'
  trans: "\n# 概率\n\n即便我们可能没有意识到，概率并非只是研究人员和工程师专属的数学概念。我们所有人每天都在评估和解读概率。如果我们计划本周末去海滩，而天气预报显示周六有\
    \ 60%的降雨概率，我们可能会改选周日出行。如果我们听说今天早上常走的上班路线交通状况糟糕，我们可能会冒险绕道以准时到达。诚然，在大多数此类情况下，我们大多数人可能不会进行任何严格的数学分析。相反，大多数时候，我们可能依赖于一种直觉，即哪种行动能最大化实现目标的可能性。然而，当紧要关头时，我们仍然在估计和评估不同结果的概率。\n\
    \n概率的核心，只是一种帮助我们理解某个事件发生可能性的工具。正如我们之前所见，有些人可能用 0 到 100 之间的数字以百分比形式来表达。本书将采用 0\
    \ 到 1 之间（含端点）的实数来表达概率。这种表示法在科学界更为常见，也更便于计算。我们通过以下方式描述概率及其对相关事件的影响：\n\n- 如果事件的概率接近\
    \ 1，则事件**非常可能**发生。\n- 同样地，如果事件的概率接近 0，则事件**非常不可能**发生。\n- 概率为 0 或 1 的事件是确定的。概率为\
    \ 0 表明结果不可能发生，而概率为 1 则表明结果必然发生。\n\n举一个具体的例子，我们可以考虑变量赋值 `let myConstant = 5`。我们使用\
    \ `let` 关键字声明了该变量，这使其不可变。我们可以用以下概率来描述 `myConstant`：\n\n![$$ P\\left[\\mathrm{myConstant}=5\\\
    right]=1 $$](images/512351_1_En_2_Chapter/512351_1_En_2_Chapter_TeX_Equa.png)\n\
    \n上面的符号读作“`myConstant` 等于 5 的概率为 1”，并且告诉我们，无论我们查看多少次，`myConstant` 的值都肯定是 5。\n\n\
    然而，统计学和概率论激动人心之处在于当我们离开确定性的时候。例如，某件事情的概率为 0.3 意味着什么？为了让后续的讨论易于理解，我们将使用一个简单的六面骰子作为例子。用一个熟悉的事物来展示有时很抽象的主题的实用性，希望能让我们更好地理解为什么讨论这些主题对我们有益。\n\
    \n## 样本空间\n\n在估计一个或多个事件的概率之前，了解哪些事件是可能出现的会很有帮助。在我们的六面骰子示例中，枚举所有可能的结果相对容易。这样做之后，我们得到了从\
    \ 1 到 6 的所有整数的集合。我们称这些数字为样本空间，并用字母 S 表示，如下所示：\n\n![$$ S=\\left\\{1,2,3,4,5,6\\\
    right\\} $$](img/512351_1_En_2_Chapter_TeX_Equb.png)\n\n这个特定的样本空间是一个相当易于管理的数字列表，这对我们来说很幸运。然而，许多其他问题的样本空间是巨大的，甚至是无限的。例如，如果我们让某人挑选他们能想到的任何实数，我们的样本空间将是所有实数的集合，这是一个无限集合。\n\
    \n既然我们知道 S 包含了掷骰子的所有可能结果，我们也可以推导出概率最基本公理之一，即：\n\n![$$ P\\left[\\mathrm{S}\\right]=1\
    \ $$](images/512351_1_En_2_Chapter/512351_1_En_2_Chapter_TeX_Equc.png)\n\n上面的等式指出，如果我们掷一个骰子，结果有\
    \ 100%的把握是样本空间中的某个样本点。\n\n## 事件\n\n事件是样本空间中样本点的一个子集。假设我们定义 E[1] 为骰子显示偶数点数的掷骰结果；我们实际上是说\
    \ E[1] = {2, 4, 6}。如果我们再定义一个事件 E[2] 为显示奇数点数的掷骰结果，我们就得到了两个所谓的互斥事件。如果两个事件永远不能同时发生，则称它们是互斥的。在我们的例子中，推理很简单。因为我们掷出的点数要么是偶数，要么是奇数，永远不会同时是两者，所以\
    \ E[1] 和 E[2] 永远不能同时发生。这个性质为另一个概率公理奠定了基础，该公理指出：\n\n如果 {E[1], E[2], E[3], …} 是一组互斥事件的集合，那么\n\
    \n![$$ P\\left[{E}_1\\cup {E}_2\\cup {E}_3\\cup \\dots \\right]=P\\left[{E}_1\\\
    right]+P\\left[{E}_2\\right]+P\\left[{E}_3\\right]+\\dots $$](images/512351_1_En_2_Chapter/512351_1_En_2_Chapter_TeX_Equd.png)\n\
    \n这个公理告诉我们，一组互斥事件的并集的概率等于各个事件概率之和。我们假设骰子是均匀的，每次掷骰子每个面出现的概率相等。我们通过将 1（整个样本空间的概率）除以集合中的项数来计算各个概率，这样每个结果的概率都是\
    \ 1/6。现在我们定义一个事件 A，使得一次掷骰结果为 1 或 2。使用前面的公式，我们计算出 A 的总概率是\n\n![$$ P\\left[A\\right]=P\\\
    left[ roll=1\\cup roll=2\\right]=P\\left[ roll=1\\right]+P\\left[ roll=2\\right]=\\\
    frac{1}{6}+\\frac{1}{6}=\\frac{1}{3} $$](images/512351_1_En_2_Chapter/512351_1_En_2_Chapter_TeX_Eque.png)\n\
    \n需要特别注意的是，这个计算仅在事件互斥的假设下才成立。如果不互斥，我们将需要借助另一个众所周知的规则。\n\n> **注意**  \n> 上一条公理中使用的\
    \ `∪` 运算符称为并集运算符。它接收两个项目集合并将它们合并成一个集合。两个集合的并集包含原始集合中的所有元素，但不会有任何重复项。\n"
- fmt: '# The General Addition Rule


    The General Addition Rule is a formula that is very similar to the one we just
    used. It helps compute the total probability for a union of events. However, it
    also considers that those events may not be mutually exclusive. We can express
    the rule as follows:


    ![$$ P\left[{E}_1\cup {E}_2\right]=P\left[{E}_1\right]+P\left[{E}_2\right]-P\left[{E}_1\cap
    {E}_2\right] $$](images/512351_1_En_2_Chapter/512351_1_En_2_Chapter_TeX_Equf.png)


    Let us work through an example in code to see why this formula fixes computations
    for overlapping events. Listing [2-1](#512351_1_En_2_Chapter.xhtml#PC1) on the
    following page shows the formula for the mutually exclusive events `E[1]` and
    `E[2]` at work. Listing [2-2](#512351_1_En_2_Chapter.xhtml#PC2), which follows
    directly after, shows the same formula, and the General Addition Rule, applied
    to two overlapping events, `E[2]` and `E[3]`. The former yields an incorrect result,
    while the latter is correct. The events `E[1]`, `E[2]`, and `E[3]` are defined
    as follows:


    - `E[1]`: The roll shows a 1.

    - `E[2]`: The roll shows a 2.

    - `E[3]`: The roll shows an even number.


    ```

    let E3 = { (roll: Int) -> Bool in

    return roll.isMultiple(of: 2)

    }

    let nonMutExUnionProb = Double(

    dieRolls.filter { roll in

    E2(roll) || E3(roll)

    }.count) / totalCount

    let E3Prob = Double(

    dieRolls.filter(E3).count

    ) / totalCount

    let E2andE3 = Double(

    dieRolls.filter { roll in

    E2(roll) && E3(roll)

    }.count) / totalCount

    let genAddRule = E2Prob + E3Prob - E2andE3

    print(

    """

    Events E2 and E3, no mutual exclusivity:

    P[E2 || E3]:   \(nonMutExUnionProb)

    P[E2]:         \(E2Prob)

    P[E3]:         \(E3Prob)

    P[E2] + P[E3]: \(E2Prob + E3Prob)

    P[E2] + P[E3] - P[E2 && E3]: \(genAddRule)

    """

    )

    // Prints:

    // Events E2 and E3, no mutual exclusivity:

    // P[E2 || E3]:   0.5

    // P[E2]:         0.16666666666666666

    // P[E3]:         0.5

    // P[E2] + P[E3]: 0.6666666666666666

    // P[E2] + P[E3] - P[E2 && E3]: 0.5

    Listing 2-2

    Computing the probability of a union of overlapping events using the General Addition
    Rule

    ```


    ```

    let dieRolls = Array(1 ... 6)

    let totalCount = Double(dieRolls.count)

    let E1 = { (roll: Int) -> Bool in

    return roll == 1

    }

    let E2 = { (roll: Int) -> Bool in

    return roll == 2

    }

    let mutExUnionProb = Double(

    dieRolls.filter { roll in

    E1(roll) || E2(roll)

    }.count

    ) / totalCount

    let E1Prob = Double(

    dieRolls.filter(E1).count

    ) / totalCount

    let E2Prob = Double(

    dieRolls.filter(E1).count

    ) / totalCount

    print(

    """

    Mutually Exclusive events E1 and E2:

    P[E1 || E2]:   \(mutExUnionProb)

    P[E1]:         \(E1Prob)

    P[E2]:         \(E2Prob)

    P[E1] + P[E2]: \(E1Prob + E2Prob)

    """

    )

    // Prints:

    // Mutually Exclusive events E1 and E2:

    // P[E1 || E2]:   0.3333333333333333

    // P[E1]:         0.16666666666666666

    // P[E2]:         0.16666666666666666

    // P[E1] + P[E2]: 0.3333333333333333

    Listing 2-1

    Computing the probability for a union of mutually exclusive events

    ```


    The reason that the formula for mutual exclusive cases fails may not be self-evident
    at first. We can expose the culprit by looking at the sample points captured by
    each event.


    ![$$ {E}_1=\left\{1\right\}{E}_2=\left\{2\right\}{E}_3=\left\{2,4,6\right\} $$](images/512351_1_En_2_Chapter/512351_1_En_2_Chapter_TeX_Equg.png)


    Looking at `E[1]` and `E[2]`, it is easy to see that these events do not have
    any overlapping sample points. That is, they are mutually exclusive. However,
    we can also see that `E[2]` and `E[3]` share a sample point, namely two. Using
    the formula for mutually exclusive events, we end up counting the probability
    of rolling a two twice! This problem is what the General Addition Rule addresses.
    The subtraction at the back of the formula makes sure we only count the probability
    of overlapping sample points once. Figure [2-1](#512351_1_En_2_Chapter.xhtml#Fig1)
    shows a visual representation of the overlapping sets.


    ![../images/512351_1_En_2_Chapter/512351_1_En_2_Fig1_HTML.png](images/512351_1_En_2_Chapter/512351_1_En_2_Fig1_HTML.png)


    Figure 2-1


    The overlap between two events shown as a Venn diagram. The General Addition Rule
    compensates the overlap by subtracting the probability of elements that would
    otherwise be counted twice


    Now that we know the basics of sample spaces and events, we should also look at
    how sequences of events can depend on each other. Let us extend the die roll example
    to include two consecutive rolls. What is the probability that the first roll
    shows an even number or that the second roll shows an odd number? Similarly, how
    do we compute the probability that the second roll is odd, given that we roll
    an even number in the first throw? These are the kinds of questions we ask ourselves
    next.'
