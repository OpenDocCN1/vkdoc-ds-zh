- fmt: '### Conditional Probabilities


    There is a large body of statistical problems where an event’s probability can
    change depending on whether another event occurs. For example, the probability
    of running out of fuel on the way to work will take on different values depending
    on whether we filled up on gas yesterday. Another example is that the probability
    of hitting a straight flush in a game of Texas Hold’em will depend on the cards
    we get on our starting hand. These dependencies are not always easy to consider.
    Sometimes, the relationship can be challenging to model. Other times, we simply
    do not know that the dependency exists. However, if we can formalize how two events
    are related, we can also enrich our model with this knowledge and potentially
    improve any predictions we make.


    To explain the concept of conditional probabilities, let us revisit our die –
    however, this time, we set up the preconditions differently. First of all, we
    are not only going to roll a single die. Instead, we start off rolling a regular,
    six-sided die. Based on the outcome of the first roll, we get one out of two different
    options:


    - If the first roll shows an even number, we get to roll a second time with a
    die that only has even numbers on it.

    - Likewise, if the first roll is odd, we get to roll another die that only has
    odd numbers on it.


    Let us look at the different sample spaces associated with this problem. The first
    roll has the same sample space `S` that we saw before, all the integers from one
    through six. However, the second roll has no well-defined sample space on its
    own. It may be `S[2] = {1, 3, 5}` or `S[2] = {2, 4, 6}`, depending on the outcome
    of the first roll. If someone were to ask us the probability that the second roll
    shows a two, we could not answer that with the toolkit we have used up until now.
    However, we could condition on the first roll and provide an answer for a particular
    outcome. To write down a conditional probability, we use the following notation:


    ![$$ P\left[ rol{l}_2=2| rol{l}_1=x\right]P\left[ rol{l}_1=x\right] $$](images/512351_1_En_2_Chapter/512351_1_En_2_Chapter_TeX_Equh.png)


    This equation reads as “the probability that the second roll shows a two, given
    that the first roll shows the number `x`.” It highlights two important concepts.
    The first one is conditional probability. Since we decide that the first roll
    has a specific outcome `x`, we can also tell the probability that the second shows
    the number two. For example, we could tell that


    ![$$ P\left[ rol{l}_2=2| rol{l}_1=1\right]P\left[ rol{l}_1=1\right]=0 $$](images/512351_1_En_2_Chapter/512351_1_En_2_Chapter_TeX_Equi.png)


    If we roll the number one on our first try, we cannot roll the number two on the
    second try according to the rules we set up.


    The second important concept that is displayed here is the multiplication rule.
    In mathematical notation, we write this as


    ![$$ P\left[ rol{l}_1=x\cap rol{l}_2=y\right]=P\left[ rol{l}_2=y| rol{l}_1=x\right]P\left[
    rol{l}_1=x\right] $$](images/512351_1_En_2_Chapter/512351_1_En_2_Chapter_TeX_Equj.png)


    The joint probability of two events can be thought of as a multiplication of individual
    probabilities while considering the conditional relationship they may share. Listing
    [2-3](#512351_1_En_2_Chapter.xhtml#PC3) on the following page shows two code examples
    of conditional probability computations. The first one computes the same sequence
    of rolls that we did on the previous page, the second one computing the probability
    that a single roll is a four given that it shows an even number.


    The multiplication rule is powerful for computing the joint probability of two
    events occurring. We have looked at examples of how to use it when investigating
    events that depend on each other. However, we can simplify the computations quite
    a lot if we can assume that they have no such relationship, which is the next
    section’s topic.


    **Note**


    The `realValue` property used in Listing [2-3](#512351_1_En_2_Chapter.xhtml#PC3)
    comes from the `StatKit` library and does nothing more than converting a numeric
    type to a `Double`.


    ```

    let dieRolls = Array(1 ... 6)

    let evenRolls = [2, 4, 6]

    let oddRolls = [1, 3, 5]

    let firstIs1Prob = dieRolls.filter { roll in

    roll == 1

    }.count.realValue / dieRolls.count.realValue

    let secondIs2Prob = oddRolls.filter { roll in

    roll == 2

    }.count.realValue / oddRolls.count.realValue

    let rollIs4GivenEvenProb = dieRolls.filter { roll in

    roll == 4

    }.count.realValue / evenRolls.count.realValue

    let rollIsEven = dieRolls.filter { roll in

    roll.isMultiple(of: 2)

    }.count.realValue / dieRolls.count.realValue

    print(

    """

    P[roll2 == 2 | roll1 == 1]*P[roll1 == 1]:

    \(secondIs2Prob * firstIs1Prob)

    P[roll1 == 4 | roll1 == even]*P[roll1 == even]:

    \(rollIs4GivenEvenProb * rollIsEven)

    """

    )

    // Prints:

    //P[roll2 == 2 | roll1 == 1]*P[roll1 == 1]:

    // 0.0

    // P[roll1 == 4 | roll1 == even]*P[roll1 == even]:

    // 0.16666666666666666

    Listing 2-3

    Using Swift to compute conditional probabilities

    ```


    ### Independence


    We take out our die again, and we toss it two times without any special rules
    or restrictions. It is reasonable to believe that the first throw’s outcome does
    not change our chances of hitting a specific number in the second toss. We have
    the same probability of throwing a two regardless of if the first roll showed
    a one, a six, or a four. This property is called independence, and it can significantly
    simplify our calculations if we can assume that it holds for the events we investigate.
    The multiplication rule from the previous section reduces to the following expression:


    ![$$ P\left[ rol{l}_1=x\cap rol{l}_2=y\right]=P\left[ rol{l}_2=y\right]P\left[
    rol{l}_1=x\right] $$](images/512351_1_En_2_Chapter/512351_1_En_2_Chapter_TeX_Equk.png)


    The second roll probability no longer depends on the first roll outcome, so we
    drop that conditioning. We end up multiplying the probabilities for the individual
    outcomes. If we wanted to calculate the probability of hitting a four in the first
    throw and a two in the second, we would end up with


    ![$$ P\left[ rol{l}_1=4\cap rol{l}_2=2\right]=P\left[ rol{l}_2=2\right]P\left[
    rol{l}_1=4\right]=\frac{1}{6}\cdotp \frac{1}{6}=\frac{1}{36} $$](images/512351_1_En_2_Chapter/512351_1_En_2_Chapter_TeX_Equl.png)


    The concepts of dependence and independence show up everywhere in statistical
    analysis. They can help make our models more accurate, and they can simplify mathematical
    expressions and logical reasoning. In the next section, we cover one of the most
    important theorems in statistics. It builds on conditional probabilities and allows
    us to extract information that would otherwise be extremely difficult to find.'
