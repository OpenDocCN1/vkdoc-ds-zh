    ## Chapter Summary


    This chapter was quite heavy on the theory side. We learned what a hypothesis
    is and how to formulate both null and alternative hypotheses for our tests. We
    learned about the distribution of sample means and got introduced to one of the
    most important theorems in statistics – the Central Limit Theorem. We learned
    how to define confidence levels, alpha values, and compute p-values, and we also
    had a look at how to standardize a test statistic and compute confidence intervals
    for it.


    The next chapter will make a complete U-turn. The theoretical concepts will be
    lighter and intuitive to grasp, and we will focus more on the code part of things.
    It has come time to learn how to shrink information with statistics.


    # 6. Statistical Methods for Data Compression


    Statistical methods are not only applicable in hardcore data science topics. They
    also have applications in what could be considered more traditional computer science,
    such as compression algorithms. While there is active research conducted in compression
    via machine learning, we will explore, derive, and implement a much more medieval,
    rule-based algorithm.


    ## An Introduction to Compression


    The concept of compression is straightforward when looking at it from a high-level
    perspective. We want to transform some arbitrary piece of data so that it takes
    up less space. The less space this data occupies, the more space we will have
    for other data later. We call this transformation for *compression*.


    Not only do we want some algorithm that makes our data smaller in size. We also
    want this process to be reversible in some sense. Once we have found a representation
    that takes up less space, we want to have the option to get back the original
    data. This reversion of the compression stage is called *decompression* .


    As an example, let us analyze a simple compression algorithm. Whenever someone
    hands us a block of data, we always return a single byte with the value `0xFF`.
    When we look at the compression stage, this algorithm is doing amazing things.
    We could hand it Netflix’s entire video library, and it would be able to compress
    it to a single byte. That is impressive! However, things look pretty bleak when
    we move to the decompression stage. The algorithm always returns the same compressed
    representation, no matter the input. If someone handed us that byte and told us
    to decompress it, we would not know whether to turn it into an animated movie,
    a digital restaurant menu, or the Bill of Rights. That is a horrible property!
    To get this right, we need to discuss a few mathematical properties related to
    functions.'
  trans: '

    ### 计算置信区间


    z 分数不仅提供了一种方法，让我们能够对来自不同分布的数据使用相同的测量标尺进行检验，还让我们能够精确了解对检验结果的确信程度。


    回到大学学生的例子，我们想知道对他们的平均智力分数的估计可能存在多大偏差。也就是说，我们想知道满足以下概率的 `μ` 的取值范围：


    ![$$ P\left[-z<\frac{x-\mu }{\sigma }<z\right]=c=1-\alpha $$](images/512351_1_En_5_Chapter/512351_1_En_5_Chapter_TeX_Equs.png)


    通过对这个表达式进行一些代数运算，我们可以将其改写为：


    ![$$ P\left[\mu - z\sigma <x<\mu + z\sigma \right]=c=1-\alpha $$](images/512351_1_En_5_Chapter/512351_1_En_5_Chapter_TeX_Equt.png)


    由于我们可以轻松找出与不同置信水平或α值相对应的 `z` 值，并且只关心 `μ` 在该表达式中的极限值，因此我们可以进一步将这个方程改写为：


    ![$$ {\mu}_{1,2}=x\pm z\sigma $$](img/512351_1_En_5_Chapter_TeX_Equu.png)


    这个表达式看起来很简洁，但它正是我们为结果计算置信区间所需的一切。由于样本均值和总体标准差是常数，我们唯一需要调整的就是 `z` 值。假设我们想知道样本均值以
    95%的确定性落在哪个范围内。由于这是一个双尾计算，我们需要将不确定性均等地分配到两侧，这意味着我们需要将α值除以 2。对应于α值为 0.025 的 z 分数是
    1.96。因此，我们得到：


    ![$$ {\mu}_{1,2}=105\pm 1.96\cdotp \frac{15}{\sqrt{30}}\approx 105\pm 5.37 $$](img/512351_1_En_5_Chapter_TeX_Equv.png)


    这个结果得出的范围是从 99.63 到 110.37，因此我们可以 95%地确信，我们学生的真实平均智力分数位于这两个数值之间。这项技术非常强大，因为它为我们提供了一种工具，可以确定如果我们从头开始进行这项检验，样本均值可能会落在哪里。


    ### 关于卡方检验的一点说明


    卡方检验是另一类有用的假设检验，可以帮助我们确定，例如，某些测量数据与模型的拟合程度。我们使用的方法与本章节讨论的方法非常相似——我们设定零假设和备择假设，确定α值，然后进行检验。然而，要完全理解这些检验如何以及为何有用，我们需要理解卡方分布的工作原理，这本身可能就能单独写满一章。不过，欢迎你在后续学习中进一步深入了解这些主题。


    ### 章节总结


    本章在理论方面内容较多。我们学习了什么是假设，以及如何为检验制定零假设和备择假设。我们学习了样本均值的分布，并了解了统计学中最重要的定理之一——中心极限定理。我们学习了如何定义置信水平、α值以及计算
    p 值，还学习了如何标准化检验统计量并为其计算置信区间。


    下一章将是一个彻底的转向。理论概念会更加轻松且更易直观理解，我们将更多地关注代码方面的事情。是时候学习如何用统计学来压缩信息了。


    # 6. 用于数据压缩的统计方法


    统计方法不仅适用于核心数据科学领域，在更传统的计算机科学领域，比如压缩算法中，也有其应用。虽然通过机器学习进行压缩的研究仍在活跃进行中，但我们将探索、推导并实现一个更古老、基于规则的算法。


    ### 压缩简介


    从高层次角度来看，压缩的概念非常直接。我们想要变换任意一段数据，使其占用更少的空间。这个数据占用的空间越小，我们以后为其他数据留出的空间就越多。我们将这种变换称为*压缩*。


    我们不仅需要某种能使数据体积变小的算法，还希望这个过程在某种程度上是可逆的。一旦我们找到占用更少空间的表示形式，我们希望能够选择恢复原始数据。这种压缩阶段的逆向操作被称为*解压缩*。


    举个例子，我们来分析一个简单的压缩算法。每当有人给我们一个数据块时，我们总是返回一个值为 `0xFF` 的单个字节。从压缩阶段看，这个算法表现惊人。我们可以给它
    Netflix 的整个视频库，它也能将其压缩成一个字节。这令人印象深刻！然而，当我们进入解压缩阶段时，情况就变得相当糟糕了。无论输入是什么，该算法总是返回相同的压缩表示。如果有人给了我们这个字节并让我们解压缩它，我们将不知道它应该是一部动画电影、一份数字餐厅菜单，还是《权利法案》。这是一个非常糟糕的特性！要做好这一点，我们需要讨论一些与函数相关的数学性质。

    '
- fmt: '# Function Behaviors


    As many of us are probably already aware, a mathematical function is a way of
    mapping the members of an input set called the *domain* to the members of an output
    set called the *range*. Every element in the domain needs to map to a single element
    in the range. If a domain member has multiple mappings or no mapping, it is not
    a function in the mathematical sense. Figure [6-1](#512351_1_En_6_Chapter.xhtml#Fig1)
    shows an example of a mapping that does not qualify as a function.


    ![../images/512351_1_En_6_Chapter/512351_1_En_6_Fig1_HTML.png](images/512351_1_En_6_Chapter/512351_1_En_6_Fig1_HTML.png)


    **Figure 6-1** This mapping does not qualify as a function. Not all domain members
    have a mapping to a range element, while others have multiple mappings.


    Now that we know how mathematicians define a function, we can discuss some different
    properties of these mappings. Given that we have a function `f(x)` that maps the
    elements of a domain `X` to some range `Y`, we say that:


    -   The function `f(x)` is **surjective** if all elements in `Y` are mapped by
    some element in `X`. The nice thing with this type of function is that all elements
    of the set `Y` are reached by some element in `X`. However, surjective functions
    allow that multiple domain members map to the same range member, so different
    inputs might yield the same output.

    -   The function `f(x)` is **injective** if a member of the range `Y` can only
    be mapped by a single element in `X`. A function with this property never maps
    two different inputs to the same output. However, there may be elements in the
    range that are not mapped at all, so we may not be able to backtrack and find
    the input element if someone gave us an output element.

    -   A function `f(x)` that is both surjective and injective is called **bijective**.
    A bijective function maps all elements in the domain to a different element in
    the range, so there is a perfect one-to-one mapping. A handy property of bijective
    functions is that there exists an inverse function `f-1(x)` that maps the elements
    in `Y` back to their corresponding elements in `X`.


    Let us look at an example to get an intuition of what this means. We define the
    function:


    ![$$ f(x)={x}^2,\kern1em x\in \mathbb{R} $$](images/512351_1_En_6_Chapter/512351_1_En_6_Chapter_TeX_Equa.png)


    The function `f(x)` has a domain that spans the entire real number line. Given
    that it can only ever yield nonnegative numbers, its range consists of the nonnegative
    real numbers. This function is surjective since `f(x)` can produce any nonnegative
    real value from all the possible inputs. However, the function is not injective.
    That is, the function does not produce unique results for all the elements of
    the domain. One example is that -1 and 1 produce the same result. Thanks to this,
    the function is not bijective either. We can map all possible inputs to the output
    space in a well-defined way, but we do not have an inverse function that takes
    us back to the original input with certainty.


    Now, take the following function instead:


    ![$$ f(x)=x+2,\kern1em x\in \mathbb{R} $$](images/512351_1_En_6_Chapter/512351_1_En_6_Chapter_TeX_Equb.png)


    The real numbers constitute both the domain and the range of this function. We
    can see that it is surjective since it maps all members of the range. It is also
    an injective function since all domain elements produce unique results. Since
    `f(x)` is both injective and surjective, it is also bijective, and we can find
    an inverse function `f^(-1)(x)` by doing some algebraic manipulations.


    ![$$ f(x)=y{f}^{-1}(y)=x $$](images/512351_1_En_6_Chapter/512351_1_En_6_Chapter_TeX_Equc.png)


    ![$$ f(x)=x+2y=x+2x=y-2{f}^{-1}(y)=y-2 $$](images/512351_1_En_6_Chapter/512351_1_En_6_Chapter_TeX_Equd.png)


    Given this theory, bijection is a desirable property for a compression algorithm.
    When we change the representation of some data, often into a format that is not
    particularly human readable, we want to be able to invert that compression and
    get back the original information. However, there are times when we are okay with
    the function only being “approximately bijective,” which is a fascinating subject
    that we will discuss next.


    ## Lossless vs. Lossy Compression


    One crucial aspect of any compression algorithm is whether it is lossy or lossless.
    That is, do we get the same data back when we decompress it, or does it differ?
    Let us look at Figure [6-2](#512351_1_En_6_Chapter.xhtml#Fig2) to see a visualization
    of a truly bijective compression algorithm.


    ![../images/512351_1_En_6_Chapter/512351_1_En_6_Fig2_HTML.png](images/512351_1_En_6_Chapter/512351_1_En_6_Fig2_HTML.png)


    **Figure 6-2** The function used to compress a data point in the domain has an
    inverse that allows us to get back the exact same information when decompressing.


    The compression function visualized in Figure [6-2](#512351_1_En_6_Chapter.xhtml#Fig2)
    is bijective, which means that the decompression function will give us back the
    exact same data we compressed. Algorithms that display this behavior are commonly
    called lossless. Some examples of formats that use lossless compression are:


    -   `bzip2` (general purpose)

    -   `FLAC` (audio)

    -   `WMA Lossless` (audio)

    -   `PNG` (graphics)


    On the opposite side, we have compression functions that are only “approximately
    bijective.” Although this is not a commonly accepted term, it quite accurately
    describes the behavior we are after. Figure [6-3](#512351_1_En_6_Chapter.xhtml#Fig3)
    shows the idea behind such a function.


    ![../images/512351_1_En_6_Chapter/512351_1_En_6_Fig3_HTML.png](images/512351_1_En_6_Chapter/512351_1_En_6_Fig3_HTML.png)


    **Figure 6-3** An “approximately bijective” function is not guaranteed to reproduce
    the exact same data when decompressing. Instead, it will produce an approximation
    of that data point – one close to the original by some distance measure of our
    choice.


    We commonly refer to this type of function as lossy compression. Suppose we can
    live with the fact that we probably will not be able to reproduce the original
    data again. In that case, a lossy compression algorithm can often come up with
    a data representation that takes less space than a lossless algorithm could. Some
    popular file formats that use lossy compression algorithms include:


    -   `MP3` (audio)

    -   `WMA` (audio)

    -   `JPEG` (graphics)

    -   `H.261` (graphics)


    Now that we know more about some of the important compression characteristics,
    we will dive deeper by implementing a lossless algorithm based on Huffman Coding.'
  raw: '### Function Behaviors


    As many of us are probably already aware, a mathematical function is a way of
    mapping the members of an input set called the *domain* to the members of an output
    set called the *range* . Every element in the domain needs to map to a single
    element in the range. If a domain member has multiple mappings or no mapping,
    it is not a function in the mathematical sense. Figure [6-1](#512351_1_En_6_Chapter.xhtml#Fig1)
    shows an example of a mapping that does not qualify as a function.


    ![../images/512351_1_En_6_Chapter/512351_1_En_6_Fig1_HTML.png](images/512351_1_En_6_Chapter/512351_1_En_6_Fig1_HTML.png)


    Figure 6-1


    This mapping does not qualify as a function. Not all domain members have a mapping
    to a range element, while others have multiple mappings


    Now that we know how mathematicians define a function, we can discuss some different
    properties of these mappings. Given that we have a function `f(x)` that maps the
    elements of a domain `X` to some range `Y`, we say that


    *   The function `f(x)` is **surjective** if all elements in `Y` are mapped by
    some element in `X`. The nice thing with this type of function is that all elements
    of the set `Y` are reached by some element in `X`. However, surjective functions
    allow that multiple domain members map to the same range member, so different
    inputs might yield the same output.


    *   The function `f(x)` is **injective** if a member of the range `Y` can only
    be mapped by a single element in `X`. A function with this property never maps
    two different inputs to the same output. However, there may be elements in the
    range that are not mapped at all, so we may not be able to backtrack and find
    the input element if someone gave us an output element.


    *   A function `f(x)` that is both surjective and injective is called **bijective**.
    A bijective function maps all elements in the domain to a different element in
    the range, so there is a perfect one-to-one mapping. A handy property of bijective
    functions is that there exists an inverse function `f-1(x)` that maps the elements
    in `Y` back to their corresponding elements in `X`.


    Let us look at an example to get an intuition of what this means. We define the
    function:


    ![$$ f(x)={x}^2,\kern1em x\in \mathbb{R} $$](images/512351_1_En_6_Chapter/512351_1_En_6_Chapter_TeX_Equa.png)


    The function `f(x)` has a domain that spans the entire real number line. Given
    that it can only ever yield nonnegative numbers, its range consists of the nonnegative
    real numbers. This function is surjective since `f(x)` can produce any nonnegative
    real value from all the possible inputs. However, the function is not injective.
    That is, the function does not produce unique results for all the elements of
    the domain. One example is that -1 and 1 produce the same result. Thanks to this,
    the function is not bijective either. We can map all possible inputs to the output
    space in a well-defined way, but we do not have an inverse function that takes
    us back to the original input with certainty.


    Now, take the following function instead:


    ![$$ f(x)=x+2,\kern1em x\in \mathbb{R} $$](images/512351_1_En_6_Chapter/512351_1_En_6_Chapter_TeX_Equb.png)


    The real numbers constitute both the domain and the range of this function. We
    can see that it is surjective since it maps all members of the range. It is also
    an injective function since all domain elements produce unique results. Since
    `f(x)` is both injective and surjective, it is also bijective, and we can find
    an inverse function `f`^(`-1`)`(x)` by doing some algebraic manipulations.


    ![$$ f(x)=y{f}^{-1}(y)=x $$](images/512351_1_En_6_Chapter/512351_1_En_6_Chapter_TeX_Equc.png)


    ![$$ f(x)=x+2y=x+2x=y-2{f}^{-1}(y)=y-2 $$](images/512351_1_En_6_Chapter/512351_1_En_6_Chapter_TeX_Equd.png)


    Given this theory, bijection is a desirable property for a compression algorithm.
    When we change the representation of some data, often into a format that is not
    particularly human readable, we want to be able to invert that compression and
    get back the original information. However, there are times when we are okay with
    the function only being “approximately bijective,” which is a fascinating subject
    that we will discuss next.


    ### Lossless vs. Lossy Compression


    One crucial aspect of any compression algorithm is whether it is lossy or lossless.
    That is, do we get the same data back when we decompress it, or does it differ?
    Let us look at Figure [6-2](#512351_1_En_6_Chapter.xhtml#Fig2) to see a visualization
    of a truly bijective compression algorithm.


    ![../images/512351_1_En_6_Chapter/512351_1_En_6_Fig2_HTML.png](images/512351_1_En_6_Chapter/512351_1_En_6_Fig2_HTML.png)


    Figure 6-2


    The function used to compress a data point in the domain has an inverse that allows
    us to get back the exact same information when decompressing


    The compression function visualized in Figure [6-2](#512351_1_En_6_Chapter.xhtml#Fig2)
    is bijective, which means that the decompression function will give us back the
    exact same data we compressed. Algorithms that display this behavior are commonly
    called lossless. Some examples of formats that use lossless compression are


    *   bzip2 (general purpose)


    *   FLAC (audio)


    *   WMA Lossless (audio)


    *   PNG (graphics)


    On the opposite side, we have compression functions that are only “approximately
    bijective.” Although this is not a commonly accepted term, it quite accurately
    describes the behavior we are after. Figure [6-3](#512351_1_En_6_Chapter.xhtml#Fig3)
    shows the idea behind such a function.


    ![../images/512351_1_En_6_Chapter/512351_1_En_6_Fig3_HTML.png](images/512351_1_En_6_Chapter/512351_1_En_6_Fig3_HTML.png)


    Figure 6-3


    An “approximately bijective” function is not guaranteed to reproduce the exact
    same data when decompressing. Instead, it will produce an approximation of that
    data point – one close to the original by some distance measure of our choice


    We commonly refer to this type of function as lossy compression. Suppose we can
