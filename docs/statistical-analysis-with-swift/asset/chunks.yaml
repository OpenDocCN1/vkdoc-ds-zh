  trans: '

    # 函数行为


    我们许多人可能已经知道，数学函数是一种将输入集合（称为*定义域*）中的元素映射到输出集合（称为*值域*）中元素的方法。定义域中的每个元素都需要映射到值域中的一个单一元素。如果定义域中的一个成员有多个映射或没有映射，那么它在数学意义上就不算是一个函数。图
    6-1 展示了一个不符合函数定义的映射示例。


    ![../images/512351_1_En_6_Chapter/512351_1_En_6_Fig1_HTML.png](img/512351_1_En_6_Fig1_HTML.png)


    **图 6-1** 此映射不符合函数定义。并非所有定义域成员都映射到值域元素，而其他成员则具有多个映射。


    既然我们知道了数学家如何定义函数，接下来就可以讨论这些映射的一些不同性质。假设我们有一个函数 `f(x)`，它将定义域 `X` 中的元素映射到值域 `Y`，那么我们可以说：


    -   如果 `Y` 中的所有元素都被 `X` 中的某个元素所映射，则函数 `f(x)` 是**满射的**。这类函数的一个优点是集合 `Y` 中的所有元素都能被
    `X` 中的某个元素所到达。然而，满射函数允许多个定义域成员映射到同一个值域成员，因此不同的输入可能会产生相同的输出。

    -   如果值域 `Y` 中的一个成员只能被 `X` 中的单个元素所映射，则函数 `f(x)` 是**单射的**。具有此属性的函数永远不会将两个不同的输入映射到相同的输出。但是，值域中可能存在未被映射的元素，因此如果有人给我们一个输出元素，我们可能无法回溯并找到输入元素。

    -   既是满射又是单射的函数 `f(x)` 被称为**双射**。一个双射函数将定义域中的所有元素映射到值域中不同的元素，因此存在完美的一一对应关系。双射函数的一个方便特性是存在一个反函数
    `f-1(x)`，它能将 `Y` 中的元素映射回它们在 `X` 中对应的元素。


    让我们看一个例子来直观理解这意味着什么。我们定义函数：


    ![$$ f(x)={x}²,\kern1em x\in \mathbb{R} $$](img/512351_1_En_6_Chapter_TeX_Equa.png)


    函数 `f(x)` 的定义域覆盖了整个实数轴。由于它只能产生非负数，因此其值域由非负实数组成。这个函数是满射的，因为 `f(x)` 可以从所有可能的输入中产生任何非负实数值。然而，该函数不是单射的。也就是说，该函数对定义域中的所有元素并不产生唯一的结果。例如，-1
    和 1 产生相同的结果。正因如此，该函数也不是双射的。我们可以良好地定义的方式将所有可能的输入映射到输出空间，但我们没有一个反函数能够确定地将我们带回到原始输入。


    现在，考虑以下函数：


    ![$$ f(x)=x+2,\kern1em x\in \mathbb{R} $$](img/512351_1_En_6_Chapter_TeX_Equb.png)


    该函数的定义域和值域都是实数。我们可以看到它是满射的，因为它映射了值域中的所有成员。它也是单射的，因为所有定义域元素都产生唯一的结果。由于 `f(x)` 既是单射又是满射，因此它也是双射的，我们可以通过一些代数运算找到反函数
    `f^(-1)(x)`。


    ![$$ f(x)=y{f}^{-1}(y)=x $$](img/512351_1_En_6_Chapter_TeX_Equc.png)


    ![$$ f(x)=x+2y=x+2x=y-2{f}^{-1}(y)=y-2 $$](img/512351_1_En_6_Chapter_TeX_Equd.png)


    基于这个理论，双射是压缩算法的一个理想属性。当我们改变某些数据的表示形式，通常是变成一种不易于人类阅读的格式时，我们希望能够逆转该压缩过程并恢复原始信息。然而，有时我们也能接受函数只是“近似双射”，这是一个我们将接下来讨论的迷人话题。


    ## 无损压缩 vs. 有损压缩


    任何压缩算法的一个关键方面是它是有损的还是无损的。也就是说，当我们解压缩时，我们得到的数据是与原来相同的，还是有所差异？让我们看一下图 6-2 中一个真正双射压缩算法的可视化表示。


    ![../images/512351_1_En_6_Chapter/512351_1_En_6_Fig2_HTML.png](img/512351_1_En_6_Fig2_HTML.png)


    **图 6-2** 用于压缩定义域中数据点的函数有一个反函数，它允许我们在解压缩时恢复完全相同的信息。


    图 6-2 中可视化的压缩函数是双射的，这意味着解压缩函数会给我们返回与压缩时完全相同的数据。表现出这种行为的算法通常被称为无损算法。一些使用无损压缩的格式示例包括：


    -   `bzip2`（通用）

    -   `FLAC`（音频）

    -   `WMA Lossless`（音频）

    -   `PNG`（图形）


    在相反的一侧，我们有仅“近似双射”的压缩函数。虽然这不是一个普遍接受的术语，但它相当准确地描述了我们所要的行为。图 6-3 展示了此类函数背后的思想。


    ![../images/512351_1_En_6_Chapter/512351_1_En_6_Fig3_HTML.png](img/512351_1_En_6_Fig3_HTML.png)


    **图 6-3** “近似双射”函数不能保证在解压缩时重现完全相同的数据。相反，它会生成该数据点的近似值——一个根据我们选择的某种距离度量接近原始数据的点。


    我们通常将这类函数称为有损压缩。假设我们可以接受可能无法再次重现原始数据的事实。在这种情况下，有损压缩算法通常能够提出一种比无损算法占用空间更小的数据表示。一些使用有损压缩算法的流行文件格式包括：


    -   `MP3`（音频）

    -   `WMA`（音频）

    -   `JPEG`（图形）

    -   `H.261`（图形）


    既然我们已经更深入地了解了一些重要的压缩特性，接下来我们将深入探讨，实现一个基于哈夫曼编码的无损算法。

    '
- fmt: "# Huffman Coding\n\nDavid A. Huffman is the father of the Huffman algorithm.\
    \ The general idea of this algorithm is to generate a sequence of zeros and ones\
    \ to represent some element in a distribution. The sequences fulfill a few requirements:\n\
    \n1. The sequence must be unique for each unique element in the distribution.\n\
    2. The more common an element is, the shorter the sequence should be that represents\
    \ it.\n3. The sequences we decide on should minimize the expected sequence length\
    \ over the distribution of elements. That is, we want to minimize the total length\
    \ of all sequences needed to represent the complete data set.\n\nLet us look at\
    \ producing Huffman codes for each letter in the word `\"Hello\"` to gain some\
    \ intuition. Table 6-1 shows the frequencies of each letter.\n\n**Table 6-1**\
    \  \nThe letter frequencies of the word `\"Hello\"`\n\n| Letter | Frequency |\n\
    | --- | --- |\n| H | 1 |\n| E | 1 |\n| L | 2 |\n| O | 1 |\n\nTable 6-1 shows that\
    \ the letter `l` is the most common, while the others are equally frequent. Therefore,\
    \ it is more important that a shorter sequence represents `l` than any other letter.\
    \ The Huffman algorithm generates these sequences by building a binary tree from\
    \ the following steps:\n\n1. View each element and its associated count as leaf\
    \ nodes in a tree.\n2. Find the two nodes that are the least frequent. If there\
    \ are several with the same frequency, pick one at random.\n3. Group the two nodes\
    \ as children of a new tree node. The frequency of the new node is the sum of\
    \ the frequency of its children.\n4. Put the new node back into the collection.\n\
    5. If there is still more than one node left in the collection, go back to step\
    \ 2. If only a single node is left, it represents our Huffman tree, and we can\
    \ stop.\n\nFollowing this algorithm, the word `\"Hello\"` produces a tree similar\
    \ to Figure 6-4.\n\n![../images/512351_1_En_6_Chapter/512351_1_En_6_Fig4_HTML.png](images/512351_1_En_6_Chapter/512351_1_En_6_Fig4_HTML.png)\n\
    \n**Figure 6-4**  \nAn example of a Huffman tree for the word `\"Hello\"`. Leaf\
    \ nodes show both the represented letter and frequency count, while branch nodes\
    \ show the total frequency inherited from their children.\n\nNow that we have\
    \ built our Huffman tree, we can produce codes for each leaf node. Let us decide\
    \ that moving down a left branch appends a `0` to our code sequence while taking\
    \ the right branch appends a `1`. Since we only need to move down a single left\
    \ branch to get to the letter `\"l\"`, it can be represented by the code `\"0\"\
    `. However, the letter `\"e\"` is located further down the tree and therefore\
    \ needs the longer sequence `\"110\"`. We list all the Huffman codes generated\
    \ by this tree in Table 6-2.\n\n**Table 6-2**  \nAll Huffman codes generated by\
    \ the tree shown in Figure 6-4\n\n| Letter | Huffman Code |\n| --- | --- |\n|\
    \ H | 10 |\n| E | 110 |\n| L | 0 |\n| O | 111 |\n\nWe finish up by placing the\
    \ codes to follow the same sequential ordering as the original letters. By doing\
    \ so, `\"Hello\"` becomes `\"10 110 0 0 111\"`. Thanks to the Huffman codes, we\
    \ can represent the word `\"Hello\"` using only ten bits. A word that initially\
    \ took five bytes of storage only takes two bytes with the new representation.\
    \ That is quite an improvement!\n\n## Storing the Huffman Tree\n\nBefore we run\
    \ off and compress our entire hard drive into Huffman codes, we need to discuss\
    \ the need for decompression. Since we want to recreate the original data perfectly,\
    \ we also need to store the tree used to compress it. However, doing so also takes\
    \ up storage space. In our example, we will probably end up taking more than the\
    \ original five bytes once we save the tree. If that is the case, then what is\
    \ the point of doing all of this?\n\nBecause of the learning nature of the example,\
    \ we wanted the data to be small. Real-life use cases hardly ever include compressing\
    \ a text file containing a single word. Instead, we may want to compress large\
    \ video files or log files with millions of lines. The space used to store the\
    \ Huffman tree becomes negligible as the size of the data set grows. For example,\
    \ if we save a couple of hundred megabytes compressing a massive file, there is\
    \ no harm in using a couple of extra kilobytes for the tree.\n\n**Note**  \nThe\
    \ Huffman tree we computed in the previous example is not a unique optimal solution.\
    \ Depending on the method we use to break ties, we may also end up with a tree\
    \ that produces four codes of length 2. They both minimize the expected number\
    \ of bits used to represent our word, but it is good to keep in mind that some\
    \ inputs may have multiple optimal Huffman code sets.\n\n## Implementing a Compression\
    \ Algorithm\n\nNow that we have covered the concepts of Huffman codes, we will\
    \ spend the remainder of the chapter implementing a compression algorithm that\
    \ builds on these ideas. The implementation will cover all the steps needed to\
    \ produce a Huffman tree, compress a string of Lorem Ipsum text, and put it in\
    \ a binary object together with the tree. It will also cover the reverse, in which\
    \ we parse a Huffman tree and some compressed text from a binary representation.\
    \ While the compressed text is encoded to be as space efficient as possible, we\
    \ will not make the same effort to minimize the tree’s memory footprint. However,\
    \ using the same techniques that we use to encode the Huffman codes, we could\
    \ certainly reduce the tree’s space requirements, too!"
  raw: '## Huffman Coding


    David A. Huffman is the father of the Huffman algorithm. The general idea of this
    algorithm is to generate a sequence of zeros and ones to represent some element
    in a distribution. The sequences fulfill a few requirements:


    1.  The sequence must be unique for each unique element in the distribution.


    2.  The more common an element is, the shorter the sequence should be that represents
    it.


    3.  The sequences we decide on should minimize the expected sequence length over
    the distribution of elements. That is, we want to minimize the total length of
    all sequences needed to represent the complete data set.


    Let us look at producing Huffman codes for each letter in the word “Hello” to
    gain some intuition. Table [6-1](#512351_1_En_6_Chapter.xhtml#Tab1) shows the
    frequencies of each letter.


    Table 6-1


    The letter frequencies of the word “Hello”


    | Letter | Frequency |

    | --- | --- |

    | H | 1 |

    | E | 1 |

    | L | 2 |

    | O | 1 |


    Table [6-1](#512351_1_En_6_Chapter.xhtml#Tab1) shows that the letter l is the
    most common, while the others are equally frequent. Therefore, it is more important
    that a shorter sequence represents l than any other letter. The Huffman algorithm
    generates these sequences by building a binary tree from the following steps:


    1.  View each element and its associated count as leaf nodes in a tree.


    2.  Find the two nodes that are the least frequent. If there are several with
    the same frequency, pick one at random.


    3.  Group the two nodes as children of a new tree node. The frequency of the new
    node is the sum of the frequency of its children.


    4.  Put the new node back into the collection.


    5.  If there is still more than one node left in the collection, go back to step
    2\. If only a single node is left, it represents our Huffman tree, and we can
    stop.


    Following this algorithm, the word “Hello” produces a tree similar to Figure [6-4](#512351_1_En_6_Chapter.xhtml#Fig4).


    ![../images/512351_1_En_6_Chapter/512351_1_En_6_Fig4_HTML.png](images/512351_1_En_6_Chapter/512351_1_En_6_Fig4_HTML.png)


    Figure 6-4


    An example of a Huffman tree for the word “Hello.” Leaf nodes show both the represented
    letter and frequency count, while branch nodes show the total frequency inherited
    from their children


    Now that we have built our Huffman tree, we can produce codes for each leaf node.
    Let us decide that moving down a left branch appends a 0 to our code sequence
    while taking the right branch appends a 1\. Since we only need to move down a
    single left branch to get to the letter “l”, it can be represented by the code
    “0”. However, the letter “e” is located further down the tree and therefore needs
    the longer sequence “110”. We list all the Huffman codes generated by this tree
    in Table [6-2](#512351_1_En_6_Chapter.xhtml#Tab2).


    Table 6-2


    All Huffman codes generated by the tree shown in Figure [6-4](#512351_1_En_6_Chapter.xhtml#Fig4)


    | Letter | Huffman Code |

    | --- | --- |

    | H | 10 |

    | E | 110 |

    | L | 0 |

    | O | 111 |


    We finish up by placing the codes to follow the same sequential ordering as the
    original letters. By doing so, “Hello” becomes “10 110 0 0 111”. Thanks to the
    Huffman codes, we can represent the word “Hello” using only ten bits. A word that
    initially took five bytes of storage only takes two bytes with the new representation.
    That is quite an improvement!


    ### Storing the Huffman Tree


    Before we run off and compress our entire hard drive into Huffman codes, we need
    to discuss the need for decompression. Since we want to recreate the original
    data perfectly, we also need to store the tree used to compress it. However, doing
    so also takes up storage space. In our example, we will probably end up taking
    more than the original five bytes once we save the tree. If that is the case,
    then what is the point of doing all of this?


    Because of the learning nature of the example, we wanted the data to be small.
    Real-life use cases hardly ever include compressing a text file containing a single
    word. Instead, we may want to compress large video files or log files with millions
    of lines. The space used to store the Huffman tree becomes negligible as the size
    of the data set grows. For example, if we save a couple of hundred megabytes compressing
    a massive file, there is no harm in using a couple of extra kilobytes for the
    tree.


    Note


    The Huffman tree we computed in the previous example is not a unique optimal solution.
    Depending on the method we use to break ties, we may also end up with a tree that
    produces four codes of length 2\. They both minimize the expected number of bits
    used to represent our word, but it is good to keep in mind that some inputs may
    have multiple optimal Huffman code sets.


    ## Implementing a Compression Algorithm


    Now that we have covered the concepts of Huffman codes, we will spend the remainder
    of the chapter implementing a compression algorithm that builds on these ideas.
    The implementation will cover all the steps needed to produce a Huffman tree,
    compress a string of Lorem Ipsum text, and put it in a binary object together
    with the tree. It will also cover the reverse, in which we parse a Huffman tree
    and some compressed text from a binary representation. While the compressed text
    is encoded to be as space efficient as possible, we will not make the same effort
    to minimize the tree’s memory footprint. However, using the same techniques that
    we use to encode the Huffman codes, we could certainly reduce the tree’s space
    requirements, too!'
  trans: "\n# 哈夫曼编码\n\n大卫·A·哈夫曼是哈夫曼算法之父。该算法的核心思想是生成一串由 0 和 1 组成的序列，用以表示分布中的某个元素。这些序列需满足以下要求：\n\
    \n1. 每个元素在分布中都必须有唯一对应的序列。\n2. 元素出现越频繁，其对应的序列长度应越短。\n3. 我们确定的序列应能使所有元素序列的期望长度在分布上最小化。即要最小化表示完整数据集所需所有序列的总长度。\n\
    \n让我们通过为单词 `\"Hello\"` 中的每个字母生成哈夫曼编码来获得一些直观理解。表 6-1 显示了每个字母的出现频次。\n\n**表 6-1**\
    \  \n单词 `\"Hello\"` 的字母频次\n\n| 字母 | 频次 |\n| --- | --- |\n| H | 1 |\n| E | 1 |\n\
    | L | 2 |\n| O | 1 |\n\n表 6-1 显示，字母 `l` 出现最频繁，而其他字母出现频率相同。因此，用较短序列表示 `l` 比表示其他字母更为重要。哈夫曼算法通过以下步骤构建一棵二叉树来生成这些序列：\n\
    \n1. 将每个元素及其关联计数值视为树中的叶节点。\n2. 找出出现频率最低的两个节点。如果有多个节点频率相同，则随机选取一个。\n3. 将这两个节点作为新树节点的子节点。新节点的频率等于其子节点频率之和。\n\
    4. 将新节点放回集合中。\n5. 如果集合中仍不止一个节点，则返回步骤 2。如果只剩下一个节点，则该节点代表我们的哈夫曼树，算法结束。\n\n按照该算法，单词\
    \ `\"Hello\"` 生成了一棵类似图 6-4 所示的树。\n\n![../images/512351_1_En_6_Chapter/512351_1_En_6_Fig4_HTML.png](img/512351_1_En_6_Fig4_HTML.png)\n\
    \n**图 6-4**  \n单词 `\"Hello\"` 的哈夫曼树示例。叶节点同时显示了所代表的字母和频次计数，而分支节点则显示从其子节点继承的总频次。\n\
    \n现在我们已经建立了哈夫曼树，可以为每个叶节点生成编码。我们约定：沿左分支下行则在编码序列后添加 `0`，沿右分支下行则添加 `1`。由于只需沿左分支下行一次即可到达字母\
    \ `\"l\"`，它可以用编码 `\"0\"` 表示。而字母 `\"e\"` 位于树中更深位置，因此需要更长的序列 `\"110\"`。我们将此树生成的所有哈夫曼编码列于表\
    \ 6-2 中。\n\n**表 6-2**  \n图 6-4 中树生成的所有哈夫曼编码\n\n| 字母 | 哈夫曼编码 |\n| --- | --- |\n\
    | H | 10 |\n| E | 110 |\n| L | 0 |\n| O | 111 |\n\n最后，我们将这些编码按照原始字母的相同顺序排列。如此一来，`\"\
    Hello\"` 就变成了 `\"10 110 0 0 111\"`。借助哈夫曼编码，我们仅用十位比特就能表示单词 `\"Hello\"`。一个原本需要五个字节存储空间的单词，在新表示法下仅需两个字节。这真是一个显著的改进！\n\
    \n## 存储哈夫曼树\n\n在我们急于将整个硬盘压缩成哈夫曼编码之前，需要讨论解压的必要性。由于我们希望完美还原原始数据，因此还需要存储用于压缩的树。然而，这样做也会占用存储空间。在我们的示例中，一旦保存了这棵树，最终占用的空间很可能会超过原来的五个字节。若是如此，做这一切又有什么意义呢？\n\
    \n由于本示例的学习性质，我们故意让数据量很小。现实应用场景中，几乎不会出现压缩只包含单个单词的文本文件。相反，我们可能需要压缩大型视频文件或包含数百万行文本的日志文件。随着数据集规模的增长，存储哈夫曼树所需的空间可以忽略不计。例如，如果我们压缩一个巨大文件节省了几百兆字节，那么为这棵树多花几\
    \ KB 空间也无伤大雅。\n\n**注意**  \n我们在前一个例子中计算的哈夫曼树并非唯一的完美解决方案。根据处理平局的方法不同，最终也可能得到一棵生成\
    \ 4 个长度为 2 的编码的树。这两种树都能使表示单词所需的期望比特数最小化，但需要记住，某些输入可能存在多组最优哈夫曼编码集。\n\n## 实现压缩算法\n\
    \n现在我们已经讲解了哈夫曼编码的概念，本章剩余部分将致力于实现一个基于这些思想的压缩算法。该实现将涵盖生成哈夫曼树、压缩一段 Lorem Ipsum 文本字符串、并将其与树一同放入二进制对象所需的所有步骤。同时也会涵盖逆过程，即从二进制表示中解析出哈夫曼树和已压缩文本。虽然压缩文本会尽可能进行空间效率优化，但我们不会对树的内存占用做同样程度的优化。不过，使用我们编码哈夫曼编码的相同技术，当然也能降低树的存储空间需求！\n"
- fmt: '### The Compression Stage


    Let us start by looking at the main program used to compress some text, shown
    in Listing [6-1](#512351_1_En_6_Chapter.xhtml#PC1).


    ```

    let text = DataLoader.loadText(from: .huffman)

    let coder = HuffmanTextCoder()

    let compressed = try coder.encode(text)

    Listing 6-1

    The main program used to compress some example text

    ```


    This program is relatively small since all the complexity is tucked away inside
    the `HuffmanTextCoder` instance. We use an alternative load function from the
    `DataLoader` to read a text file located in the shared resources of the code project.
    We then pass the loaded text into the `encode(_:)` function, which returns a compressed
    binary representation in the form of a `Data` object.


    To encode a text string, we first need to decide on how to subdivide our data
    points. There are many ways in which we could split the text. Should we split
    it into sentences, words, or perhaps letters? For this implementation, we choose
    to go with bytes. Therefore, the Huffman tree will construct codes for all the
    eight–bit patterns used to construct the UTF-8 coded string, and the steps needed
    to encode the compressed data can be summarized as follows:


    1. Count the frequency of each byte in the text to find the distribution.

    2. Construct a Huffman tree from the counts extracted in step 1.

    3. Create a binary representation of the tree to store with the compressed text.

    4. Create a Huffman code representation of the text with the tree created in step
    2.

    5. Concatenate the binary version of the Huffman tree and the compressed text
    into a single binary object.


    Listing [6-2](#512351_1_En_6_Chapter.xhtml#PC2) shows the `encode(_:)` function,
    which delegates each step above to separate, specialized methods. Listing [6-3](#512351_1_En_6_Chapter.xhtml#PC3)
    displays an enumeration we use in the case of encoding or decoding failures. While
    we do not use the enum explicitly inside this method, it is good to know the different
    types of errors the subroutines can throw from the call marked with the `try`
    keyword.


    ```

    enum HuffmanError: Error {

    case emptyInputData

    case treeBuilderFailure

    case textEncodingFailure

    case textDecodingFailure

    }

    Listing 6-3

    An enumeration used to represent errors that may be thrown during compression
    or decompression

    ```


    ```

    func encode(_ text: String) throws -> Data {

    let byteFrequencies = countBytes(in: text)

    let root = try createHuffmanTree(

    from: byteFrequencies

    )

    let treeData = createTreeData(from: root)

    var (encodedText, encodingSize) = try encodeText(

    text,

    with: root,

    frequencies: byteFrequencies

    )

    let encodingSizeData = Data(

    bytes: &encodingSize,

    count: MemoryLayout.size

    )

    return encodingSizeData + treeData + encodedText

    }

    Listing 6-2

    Our implementation of HuffmanTextCoder.encode(_:)

    ```


    As Listing [6-2](#512351_1_En_6_Chapter.xhtml#PC2) shows, we walk through each
    step that we lined out earlier. However, there is one variable in the code that
    we did not yet discuss, namely, `encodingSize`. It is generated by the method
    that encodes the text into Huffman coded binary data, and its purpose is to let
    us know how many bits we used to encode the entire message.


    Since the smallest addressable building block in a general–purpose computer is
    a byte, that limits us to working with multiples of eight bits. However, it is
    much more likely that we will need some off–sized number of bits. For example,
    we needed ten bits to encode the word "Hello," which requires us to allocate two
    bytes. Those two bytes contain 16 bits, which means that we will end up with six
    unused bits in the encoded data. Now imagine decoding those two bytes of data
    and not knowing how many bits contain useful information. We would decide the
    first ten bits correctly. However, we would also decode the last six bits, ultimately
    ending up with the word "Hellollllll". Since that is not what we want, we need
    to hint at when to stop the decoding process. Instead of inventing a stop sequence,
    we simply prepend the number of bits to the beginning of the encoded data.


    Now that we know what the final binary object will look like, let us dig deeper
    into the different subroutines that will make this happen. Listing [6-4](#512351_1_En_6_Chapter.xhtml#PC4)
    shows the method `countBytes(in:)`, which is in charge of computing the distribution
    of bytes in the text.


    ```

    func countBytes(in text: String) -> [UInt8: Int] {

    var text = text

    return text.withUTF8 { pointer in

    pointer

    .reduce(into: [UInt8: Int]()) { dict, byte in

    dict[byte, default: 0] += 1

    }

    }

    }

    Listing 6-4

    The implementation of countBytes(in:), which returns the distribution of bytes
    inside a text string

    ```


    The first thing that happens in the preceding method is that we make the text
    parameter mutable. Since we do not plan on mutating the string, this is not a
    hard requirement from the algorithms side. Instead, it is a requirement imposed
    by the `String` type itself. Since a pointer to the contents of a string will
    allow us to mutate whatever is in there, we cannot use it on an immutable object.


    Next, we request a pointer to a contiguous block of memory holding the byte contents
    of the text. Once that is given to us, we can count each byte by using a higher–order
    function. The method `reduce(into:_:)` will take each byte in the storage and
    use it to increment a counter. When the iteration finishes, we return a `Dictionary`
    containing the bytes and their respective counter variables. We represent bytes
    using the type `UInt8`, so if we feed the word "Hello" into `countBytes(in:)`,
    it will yield something similar to `[111: 1, 108: 2, 101: 1, 72: 1]`. In this
    particular case, the bytes correspond perfectly to the ASCII code representations
    of the individual letters. However, that might not always be the case since we
    are working with UTF-8 encoded strings.


    Next, we move on to look at `createHuffmanTree(from:)`, which builds a Huffman
    tree from the distribution we just computed. Listing [6-5](#512351_1_En_6_Chapter.xhtml#PC5)
    shows the enum we use to represent a node in the tree, while Listing [6-6](#512351_1_En_6_Chapter.xhtml#PC6)
    shows the method implementation.


    ```

    func createHuffmanTree(from freqs: [UInt8: Int])

    throws -> HuffmanNode {

    var nodes = freqs

    .map { key, value -> HuffmanNode in

    .leaf(value: key, count: value)

    }

    .sorted(by: >)

    guard !nodes.isEmpty else {

    throw HuffmanError.emptyInputData

    }

    while

    nodes.count > 1,

    let rhs = nodes.popLast(),

    let lhs = nodes.popLast()

    {

    nodes.append(.node(left: lhs, right: rhs))

    nodes.sort(by: >)

    }

    if let root = nodes.first {

    return root

    } else {

    throw HuffmanError.treeBuilderFailure

    }

    }

    Listing 6-6

    Our implementation of createHuffmanTree(from:)

    ```


    ```

    indirect enum HuffmanNode

    where Value: Hashable & Comparable {

    case node(left: HuffmanNode, right: HuffmanNode)

    case leaf(value: Value, count: Int)

    }

    Listing 6-5

    The HuffmanNode enumeration we use to represent a tree node

    ```


    A few interesting things are happening in these snippets. First off, the `HuffmanNode`
    enum is a generic type that allows us to create a tree over any other type, so
    long as it conforms to the `Hashable` protocol and the `Comparable` protocol.'
