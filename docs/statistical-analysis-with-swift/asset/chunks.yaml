- fmt: '# What Is Hypothesis Testing?


    To get a feeling for why hypothesis testing is helpful, let us look at an example
    statement:


    - The dean of a university claims that the attending students have above-average
    intelligence. Thirty randomly sampled students agree to take an IQ test, on which
    they score an average of 105 according to the Wechsler Adult Intelligence Scale
    (`WAIS`). Is the dean’s claim correct?


    While this particular example may not be part of the everyday tasks of a data
    scientist or statistician, it will help us reason about a few questions that we
    need to consider.


    `WAIS` is normally distributed, with an average score of 100 and a standard deviation
    of 15. Since the students scored an average of 105, which is greater than the
    `WAIS` average of 100, it may be tempting to conclude that the dean is correct.
    However, some questions arise from this way of reasoning.


    - Even if the scores differ, they only do so by 5%. Is that enough of a difference
    to make such a general claim?


    - What if we got lucky when we chose the students that took the test? Maybe the
    students that participated scored higher than the rest of the students would.


    - How do we measure the uncertainty that comes from the previous questions? Can
    we produce a number that tells us how confident we can be in our results?


    As we can see, there are many things we need to take into account before we can
    tell whether the claims in this example make any sense or if we should reject
    them. First, we need to establish terminology that makes it easier to use mathematical
    tools to solve the problems.


    ## Formulating Hypotheses


    To solve these problems, we first need to formalize the hypotheses we want to
    test. Beginners often struggle with this part, and the main reason seems to be
    because it is not always easy to pick out relevant information about a problem.
    To get comfortable formulating hypotheses, we will describe the two different
    kinds of hypotheses we need to formulate for any problem and show a few examples
    to get comfortable with the ideas. Right now, we will focus on the high-level
    concepts, and more details will follow in the later sections.


    ### The Null Hypothesis


    The null hypothesis, denoted by `H[0]`, describes a commonly accepted fact. It
    suggests that there is no significant difference between the samples we collect
    and the currently accepted ground truth. For example, a car manufacturer might
    specify that a particular model gets an average of 23 miles per gallon. The null
    hypothesis then suggests that any data we collect by testing some cars of the
    same model will yield an average of 23 miles per gallon. The mathematical formulation
    of this hypothesis comes out to


    ```

    H0: μ = 23 mpg

    ```


    That is it! Nothing more, nothing less. We state that, according to `H[0]`, the
    average `μ` is equal to 23 miles per gallon.


    ### The Alternative Hypothesis


    The alternative hypothesis, which we denote by `H[A]`, is a claim that we want
    to investigate. It suggests a new scenario in which the null hypothesis no longer
    holds. For example, the car manufacturer from the previous example may recently
    have made changes to the production line. Because of those changes, we believe
    that the new cars no longer get 23 miles per gallon. However, we do not have an
    opinion on whether the changes improved or worsened the gas mileage. It may be
    higher or lower than before. In mathematical notation, we denote this hypothesis
    by


    ```

    HA: μ ≠ 23 mpg

    ```


    The alternative hypothesis looks just as simple as the null hypothesis from the
    previous section. One important thing to note is that the null and alternative
    hypotheses are each other''s complements. That is, they cover every possible outcome.
    In this example, the average gas mileage is either 23 mpg or something else. There
    is no possible way to construct a scenario in which both hypotheses are true or
    false at the same time.


    The fact that the null and alternative hypotheses are each other’s complements
    allows us to dive deeper and explore other questions. Can we use other complementary
    relations to be more flexible in how and what we test?


    ### Tails


    The way we formulated our alternative hypothesis in the previous section was not
    technically incorrect. However, it did feel odd to hypothesize that the average
    gas mileage had changed while not indicating the direction. There are certainly
    times when all we need is to test whether a statistic has moved in either direction,
    but there are also times when we want to be more specific.


    Imagine that the changes made to the production line in the previous example mean
    that the combustion chambers now come from a partner with better technologies
    available, making the parts much more high quality. With such additional knowledge,
    we may feel comfortable hypothesizing that the average gas mileage has increased.
    Making that assumption means that the `H[0]` and `H[A]` we formulated before no
    longer describe our hypotheses. Instead, our alternative hypothesis says that
    the average is greater than 23 mpg. Because `H[0]` and `H[A]` need to be complements
    of each other, the null hypothesis must be that the average is less than or equal
    to 23. Mathematically, our new hypotheses look like the following:


    ```

    H0: μ ≤ 23 mpg

    ```


    ```

    HA: μ > 23 mpg

    ```


    While this does not precisely capture the currently accepted average gas mileage,
    this formulation does have some nice properties. Firstly, it allows us to encapsulate
    additional information into the alternative hypothesis by specifying in which
    direction we believe the average has changed. Secondly, even though the null hypothesis
    extends from 23 miles per gallon and downward, it still contains the car manufacturer''s
    original claim.


    We call this new formulation a *one-tailed test* simply because it specifies a
    single direction in which we believe the statistic has changed. The same term
    would apply if we instead believed that the average had shifted downward. The
    first example only hypothesized that the average had changed. However, it did
    not specify a direction and is therefore called a *two-tailed test*.


    We can further subdivide one-tailed tests into *left-tailed* and *right-tailed*
    tests. This categorization depends on the exact direction of the believed change.
    We use a left-tailed test for when `H[A]` specifies a decrease in the statistic,
    while a right-tailed test specifies an increase.


    One crucial thing to note is that hypothesis testing says nothing about whether
    the hypotheses are true. It only says something about which one is more likely,
    given the data we collected. It might sound strange, but the explanation is pretty
    straightforward. Just because we might end up showing that one option is more
    likely than the other does not necessarily mean that it is true. Proving that
    a hypothesis or theory is true is a much more difficult task.


    Now that we have defined some terminology around hypothesis testing, it is time
    to dive deeper into the details. First of all, one-tailed and two-tailed tests
    are somewhat simple to understand, given how we have defined them so far. However,
    we have yet to uncover what these “tails” are. To get a grip on that, we need
    to ask ourselves a few questions about the distribution of sample means.'
