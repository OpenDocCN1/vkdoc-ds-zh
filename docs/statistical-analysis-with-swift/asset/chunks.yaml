- fmt: '### Binomial Distribution


    Now we know how to reason about single binary events using Bernoulli trials. We
    also know how to make sense of sequences of Bernoulli trials that terminate on
    the first successful outcome. As the last step in exploring standard discrete
    distributions, we will ask ourselves how likely it is to get some exact number
    of successes on a fixed number of Bernoulli trials. For example, if we flip a
    coin five times, how probable is it that we see precisely three heads?


    The first approach toward a solution may be to look at the geometric distribution
    for guidance. If we set up a sequence of five Bernoulli trials and three of them
    are successful, that implies that two were not. Using this reasoning, we could
    write the following:


    ![$$ \mathrm{P}\left[\mathrm{X}=3;\mathrm{n}=5\right]={p}^3\cdotp {q}^{5-3}={p}^3\cdotp
    {q}^2 $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equu.png)


    The preceding notation specifies that we are looking for the probability that
    the random variable `X` is equal to three, just like it did before. We also provide
    a fixed parameter `n`, which tells us how many trials we want to conduct. The
    `p` and `q` parameters are the same as in the sections on Bernoulli trials and
    geometric distributions.


    To be honest, this approach is not that far off. However, it overlooks the fact
    that there may be many combinations that result in three successful trials. For
    example, if `H` denotes a coin landing heads up and `T` is tails up, we may find
    ourselves with any of the following combinations:


    ![$$ \left\{H,H,H,T,T\right\}\left\{H,H,T,H,T\right\}\left\{H,T,H,H,T\right\}\left\{T,H,H,H,T\right\}\left\{T,H,H,T,H\right\}\left\{T,H,T,H,H\right\}\dots
    $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equv.png)


    As we can see, all of these are perfectly valid combinations of coin flips. Our
    formula, however, only accounts for one of these. It does not matter which one;
    the important thing to note is that we are not taking into our calculations that
    there may be multiple outcomes that satisfy our condition. In comes the binomial
    coefficient to the rescue.


    The binomial coefficient, also known as the combinatorial number or “n-choose-k,”
    represents the number of ways we can pick a subset of `k` unordered items from
    a set of `n` possible outcomes. The following equation shows the mathematical
    shorthand and the formula for the binomial coefficient:


    ![$$ \left(\genfrac{}{}{0pt}{}{n}{k}\right)=\frac{n!}{k!\left(n-k\right)!}\kern0.75em
    ,\kern0.75em k\in \left\{0,1,2,\dots, n-1,n\right\} $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equw.png)


    Note that other formulations of the binomial coefficient allow both `n` and `k`
    to be real valued (or even complex). However, we will only concern ourselves with
    this variant for now. The proof of this formulation is beyond the scope of this
    book, but we will show a small example that allows us to see how it works.


    If we flip three coins and want to know how many combinations exist where one
    of the flips lands heads up, we can list and count the possible outcomes that
    match our predicate, like so:


    ![$$ \left\{\mathrm{H},\mathrm{T},\mathrm{T}\right\},\kern0.75em \left\{\mathrm{T},\mathrm{H},\mathrm{T}\right\},\kern0.75em
    \left\{\mathrm{T},\mathrm{T},\mathrm{H}\right\} $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equx.png)


    Since we are using a relatively small sample space, it is easy to verify that
    these three sequences are the only ones that satisfy the requirement. If we instead
    wanted to solve this using the binomial coefficient, we would get


    ![$$ \left(\genfrac{}{}{0pt}{}{3}{1}\right)=\frac{3!}{1!\left(3-1\right)!}=\frac{3\cdotp
    2}{2}=3 $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equy.png)


    This result matches the one we got from counting manually. This method may not
    give much of an edge for small examples such as this. However, it becomes handy
    as the sample spaces grow larger.


    Now that we know how to compute the likelihood of a single combination of coin
    flips and the total number of valid combinations, we are ready to solve our initial
    problem. The probability of seeing three heads when flipping a coin five times
    boils down to multiplying these two entities:


    ![$$ \mathrm{P}\left[\mathrm{X}=3;\mathrm{n}=5\right]=\left(\genfrac{}{}{0pt}{}{n}{k}\right)\cdotp
    {p}^3\cdotp {q}^2 $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equz.png)


    The previous formula is the binomial distribution’s PMF. If we, for example, were
    to flip a perfectly fair coin four times, the likelihood of three landing heads
    up would be


    ![$$ \mathrm{P}\left[\mathrm{X}=3;\mathrm{n}=4\right]=\left(\genfrac{}{}{0pt}{}{4}{3}\right)\cdotp
    {0.5}^3\cdotp {0.5}^1=\frac{4!}{3!\left(4-3\right)!}\cdotp {0.5}^5=4\cdotp {0.5}^4=0.25
    $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equaa.png)


    The binomial distribution also has a CDF. Just as with the geometric distribution,
    we compute it by summing up the PMFs for all outcomes less than or equal to some
    number:


    ![$$ P\left[X\le x\right]=\sum \limits_{i=0}^xP\left[X=x\right]=\sum \limits_{i=0}^x\left(\genfrac{}{}{0pt}{}{n}{i}\right)\cdotp
    {p}^i\cdotp {q}^{n-i} $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equab.png)


    The code in Listing [3-4](#512351_1_En_3_Chapter.xhtml#PC4) shows a small example
    of computing the PMF of a binomial distribution. The snippet borrows the function
    `choose(n:k:)` from `StatKit`, which calculates the combinatorial number for `k`
    successes on `n` trials.


    ```

    func binomialPMF(

    of x: Int,

    p: Double,

    n: Int

    ) -> Double {

    precondition(0 < x, "0 ≮ x.")

    precondition(0 < p && p <= 1, "p ∉ (0, 1].")

    precondition(0 < n, "n must be positive.")

    let binomialCoef = choose(n: n, k: x).realValue

    let successProb = pow(p, x.realValue)

    let failureProb = pow(1 - p, (n - x).realValue)

    return binomialCoef * successProb * failureProb

    }

    let p = 0.4

    let n = 10

    let x = 7

    let pmf = binomialPMF(of: x, p: p, n: n)

    let probability = String(format: "%.2f", p)

    print(

    """

    Likelihood of \(x) heads,

    with p = \(probability) and n = \(n):

    \(String(format: "%.4f", pmf))

    """

    )

    // Prints:

    // Likelihood of 7 heads,

    // with p = 0.40 and n = 10:

    // 0.0425

    Listing 3-4

    Computing the binomial PMF with parameters p = 0.4 and n = 10

    ```


    ### Distributions Application


    Now that we know the basics of discrete probability distributions, it is time
    to introduce an outsider in the code repository. The `DistributionsApp` project
    is not quite like the other code examples that come with this book. Running this
    code does not produce any numeric results to the terminal but opens an interactive
    application like the one shown in Figure [3-4](#512351_1_En_3_Chapter.xhtml#Fig4).


    ![../images/512351_1_En_3_Chapter/512351_1_En_3_Fig4_HTML.png](images/512351_1_En_3_Chapter/512351_1_En_3_Fig4_HTML.png)


    Figure 3-4


    The `DistributionsApp` project from the code repository


    `DistributionsApp` allows us to play around with the parameters of some standard
    distributions, which lets us develop an intuition for how the probabilities of
    different outcomes change. All we need to do to get started is to:


    *   Select the type of distribution we want to see from the segmented control
    to the upper left.

    *   Select one of the different standard distributions that become available in
    the drop-down menu to the upper right.

    *   Change the parameters of our selection using the controls that show up beneath
    the chart.


    This application supports both discrete and continuous distributions, some of
    which we have covered, while others are new and may serve as inspiration for further
    studies. Take a few minutes to look at the different charts and study how they
    change while manipulating their parameters. The program will be of use as we head
    into the next section, covering the basics of continuous distributions.'
  raw: '### Binomial Distribution


    Now we know how to reason about single binary events using Bernoulli trials. We
    also know how to make sense of sequences of Bernoulli trials that terminate on
    the first successful outcome. As the last step in exploring standard discrete
    distributions, we will ask ourselves how likely it is to get some exact number
    of successes on a fixed number of Bernoulli trials. For example, if we flip a
    coin five times, how probable is it that we see precisely three heads?


    The first approach toward a solution may be to look at the geometric distribution
    for guidance. If we set up a sequence of five Bernoulli trials and three of them
    are successful, that implies that two were not. Using this reasoning, we could
    write the following:


    ![$$ \mathrm{P}\left[\mathrm{X}=3;\mathrm{n}=5\right]={p}^3\cdotp {q}^{5-3}={p}^3\cdotp
    {q}^2 $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equu.png)


    The preceding notation specifies that we are looking for the probability that
    the random variable X is equal to three, just like it did before. We also provide
    a fixed parameter *n*, which tells us how many trials we want to conduct. The
    *p* and *q* parameters are the same as in the sections on Bernoulli trials and
    geometric distributions.


    To be honest, this approach is not that far off. However, it overlooks the fact
    that there may be many combinations that result in three successful trials. For
    example, if H denotes a coin landing heads up and T is tails up, we may find ourselves
    with any of the following combinations:


    ![$$ \left\{H,H,H,T,T\right\}\left\{H,H,T,H,T\right\}\left\{H,T,H,H,T\right\}\left\{T,H,H,H,T\right\}\left\{T,H,H,T,H\right\}\left\{T,H,T,H,H\right\}\dots
    $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equv.png)


    As we can see, all of these are perfectly valid combinations of coin flips. Our
    formula, however, only accounts for one of these. It does not matter which one;
    the important thing to note is that we are not taking into our calculations that
    there may be multiple outcomes that satisfy our condition. In comes the binomial
    coefficient to the rescue.


    The binomial coefficient, also known as the combinatorial number or “n-choose-k,”
    represents the number of ways we can pick a subset of *k* unordered items from
    a set of *n* possible outcomes. The following equation shows the mathematical
    shorthand and the formula for the binomial coefficient:


    ![$$ \left(\genfrac{}{}{0pt}{}{n}{k}\right)=\frac{n!}{k!\left(n-k\right)!}\kern0.75em
    ,\kern0.75em k\in \left\{0,1,2,\dots, n-1,n\right\} $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equw.png)


    Note that other formulations of the binomial coefficient allow both *n* and *k*
    to be real valued (or even complex). However, we will only concern ourselves with
    this variant for now. The proof of this formulation is beyond the scope of this
    book, but we will show a small example that allows us to see how it works.


    If we flip three coins and want to know how many combinations exist where one
    of the flips lands heads up, we can list and count the possible outcomes that
    match our predicate, like so:


    ![$$ \left\{\mathrm{H},\mathrm{T},\mathrm{T}\right\},\kern0.75em \left\{\mathrm{T},\mathrm{H},\mathrm{T}\right\},\kern0.75em
    \left\{\mathrm{T},\mathrm{T},\mathrm{H}\right\} $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equx.png)


    Since we are using a relatively small sample space, it is easy to verify that
    these three sequences are the only ones that satisfy the requirement. If we instead
    wanted to solve this using the binomial coefficient, we would get


    ![$$ \left(\genfrac{}{}{0pt}{}{3}{1}\right)=\frac{3!}{1!\left(3-1\right)!}=\frac{3\cdotp
    2}{2}=3 $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equy.png)


    This result matches the one we got from counting manually. This method may not
    give much of an edge for small examples such as this. However, it becomes handy
    as the sample spaces grow larger.


    Now that we know how to compute the likelihood of a single combination of coin
    flips and the total number of valid combinations, we are ready to solve our initial
    problem. The probability of seeing three heads when flipping a coin five times
    boils down to multiplying these two entities:


    ![$$ \mathrm{P}\left[\mathrm{X}=3;\mathrm{n}=5\right]=\left(\genfrac{}{}{0pt}{}{n}{k}\right)\cdotp
    {p}^3\cdotp {q}^2 $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equz.png)


    The previous formula is the binomial distributions PMF. If we, for example, were
    to flip a perfectly fair coin four times, the likelihood of three landing heads
    up would be


    ![$$ \mathrm{P}\left[\mathrm{X}=3;\mathrm{n}=4\right]=\left(\genfrac{}{}{0pt}{}{4}{3}\right)\cdotp
    {0.5}^3\cdotp {0.5}^1=\frac{4!}{3!\left(4-3\right)!}\cdotp {0.5}^5=4\cdotp {0.5}^4=0.25
    $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equaa.png)


    The binomial distribution also has a CDF. Just as with the geometric distribution,
    we compute it by summing up the PMFs for all outcomes less than or equal to some
    number:


    ![$$ P\left[X\le x\right]=\sum \limits_{i=0}^xP\left[X=x\right]=\sum \limits_{i=0}^x\left(\genfrac{}{}{0pt}{}{n}{i}\right)\cdotp
    {p}^i\cdotp {q}^{n-i} $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equab.png)


    The code in Listing [3-4](#512351_1_En_3_Chapter.xhtml#PC4) shows a small example
    of computing the PMF of a binomial distribution. The snippet borrows the function
    `choose(n:k:)` from StatKit, which calculates the combinatorial number for k successes
    on n trials.


    ```

    func binomialPMF(

    of x: Int,

    p: Double,

    n: Int

    ) -> Double {

    precondition(0 < x, "0 ≮ x.")

    precondition(0 < p && p <= 1, "p ∉ (0, 1].")

    precondition(0 < n, "n must be positive.")

    let binomialCoef = choose(n: n, k: x).realValue

    let successProb = pow(p, x.realValue)

    let failureProb = pow(1 - p, (n - x).realValue)

    return binomialCoef * successProb * failureProb

    }

    let p = 0.4

    let n = 10

    let x = 7

    let pmf = binomialPMF(of: x, p: p, n: n)

    let probability = String(format: "%.2f", p)

    print(

    """

    Likelihood of \(x) heads,

    with p = \(probability) and n = \(n):

    \(String(format: "%.4f", pmf))

    """

    )

    // Prints:

    // Likelihood of 7 heads,

    // with p = 0.40 and n = 10:

    // 0.0425

    Listing 3-4

    Computing the binomial PMF with parameters p = 0.4 and n = 10

    ```


    ### Distributions Application


    Now that we know the basics of discrete probability distributions, it is time
    to introduce an outsider in the code repository. The DistributionsApp project
    is not quite like the other code examples that come with this book. Running this
    code does not produce any numeric results to the terminal but opens an interactive
    application like the one shown in Figure [3-4](#512351_1_En_3_Chapter.xhtml#Fig4).


    ![../images/512351_1_En_3_Chapter/512351_1_En_3_Fig4_HTML.png](images/512351_1_En_3_Chapter/512351_1_En_3_Fig4_HTML.png)


    Figure 3-4


    The DistributionsApp project from the code repository


    DistributionsApp allows us to play around with the parameters of some standard
    distributions, which lets us develop an intuition for how the probabilities of
    different outcomes change. All we need to do to get started is to


    *   Select the type of distribution we want to see from the segmented control
    to the upper left.


    *   Select one of the different standard distributions that become available in
    the drop-down menu to the upper right.


    *   Change the parameters of our selection using the controls that show up beneath
    the chart.


    This application supports both discrete and continuous distributions, some of
    which we have covered, while others are new and may serve as inspiration for further
    studies. Take a few minutes to look at the different charts and study how they
    change while manipulating their parameters. The program will be of use as we head
    into the next section, covering the basics of continuous distributions.'
  trans: '

    ### 二项分布


    现在我们已经知道如何使用伯努利试验来推理单个二元事件。我们也理解了如何理解在第一次成功结果时终止的伯努利试验序列。作为探索标准离散分布的最后一步，我们将提出一个问题：在固定次数的伯努利试验中，恰好获得一定成功次数的概率是多少？例如，如果我们抛一枚硬币五次，恰好看到三次正面的概率是多少？


    解决这个问题的第一种方法可能是参考几何分布。如果我们建立一个由五次伯努利试验组成的序列，其中三次成功，这意味着两次不成功。利用这个推理，我们可以写出以下公式：


    ![$$ \mathrm{P}\left[\mathrm{X}=3;\mathrm{n}=5\right]={p}³\cdotp {q}^{5-3}={p}³\cdotp
    {q}² $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equu.png)


    前面的符号表示我们正在寻找随机变量 `X` 等于 3 的概率，就像之前一样。我们还提供了一个固定参数 `n`，它告诉我们想要进行多少次试验。`p` 和 `q`
    参数与伯努利试验和几何分布部分中的相同。


    说实话，这种方法相差并不远。然而，它忽略了一个事实，即可能存在许多组合导致三次成功的试验。例如，如果 `H` 表示硬币正面朝上，`T` 表示反面朝上，我们可能会得到以下任何一种组合：


    ![$$ \left\{H,H,H,T,T\right\}\left\{H,H,T,H,T\right\}\left\{H,T,H,H,T\right\}\left\{T,H,H,H,T\right\}\left\{T,H,H,T,H\right\}\left\{T,H,T,H,H\right\}\dots
    $$](img/512351_1_En_3_Chapter_TeX_Equv.png)


    正如我们所见，这些都是完全有效的硬币抛掷组合。然而，我们的公式只考虑了其中一种。具体是哪一种并不重要；需要注意的重点是，我们的计算没有考虑到可能存在多个满足条件的结果。这时候，二项式系数就派上用场了。


    二项式系数，也称为组合数或“n-选-k”，表示从一个包含 `n` 个可能结果的集合中选取 `k` 个无序项的子集的方法数。下面的公式展示了二项式系数的数学简写和计算公式：


    ![$$ \left(\genfrac{}{}{0pt}{}{n}{k}\right)=\frac{n!}{k!\left(n-k\right)!}\kern0.75em
    ,\kern0.75em k\in \left\{0,1,2,\dots, n-1,n\right\} $$](img/512351_1_En_3_Chapter_TeX_Equw.png)


    请注意，二项式系数的其他公式允许 `n` 和 `k` 都是实数值（甚至是复数）。然而，我们目前只关心这个变体。这个公式的证明超出了本书的范围，但我们将展示一个小示例，让我们了解它是如何工作的。


    如果我们抛三枚硬币，并且想知道有多少种组合中恰好有一次正面朝上，我们可以列出并计算符合我们条件的可能结果，如下所示：


    ![$$ \left\{\mathrm{H},\mathrm{T},\mathrm{T}\right\},\kern0.75em \left\{\mathrm{T},\mathrm{H},\mathrm{T}\right\},\kern0.75em
    \left\{\mathrm{T},\mathrm{T},\mathrm{H}\right\} $$](img/512351_1_En_3_Chapter_TeX_Equx.png)


    由于我们使用的样本空间相对较小，很容易验证这三个序列是唯一满足要求的序列。如果我们想使用二项式系数来解决这个问题，我们会得到：


    ![$$ \left(\genfrac{}{}{0pt}{}{3}{1}\right)=\frac{3!}{1!\left(3-1\right)!}=\frac{3\cdotp
    2}{2}=3 $$](img/512351_1_En_3_Chapter_TeX_Equy.png)


    这个结果与我们手动计数的结果一致。对于这样的小例子，这种方法可能没有太大优势。然而，随着样本空间变大，它就变得非常有用了。


    现在我们知道如何计算单个硬币抛掷组合的可能性以及有效组合的总数，我们准备解决最初的问题。抛硬币五次看到三次正面的概率归结为将这两个量相乘：


    ![$$ \mathrm{P}\left[\mathrm{X}=3;\mathrm{n}=5\right]=\left(\genfrac{}{}{0pt}{}{n}{k}\right)\cdotp
    {p}³\cdotp {q}² $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equz.png)


    前面的公式是二项分布的 PMF（概率质量函数）。例如，如果我们抛一枚完全公平的硬币四次，恰好三次正面朝上的概率为：


    ![$$ \mathrm{P}\left[\mathrm{X}=3;\mathrm{n}=4\right]=\left(\genfrac{}{}{0pt}{}{4}{3}\right)\cdotp
    {0.5}³\cdotp {0.5}¹=\frac{4!}{3!\left(4-3\right)!}\cdotp {0.5}⁵=4\cdotp {0.5}⁴=0.25
    $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equaa.png)


    二项分布也有 CDF（累积分布函数）。与几何分布一样，我们通过将所有小于或等于某个数的结果的 PMF 相加来计算它：


    ![$$ P\left[X\le x\right]=\sum \limits_{i=0}^xP\left[X=x\right]=\sum \limits_{i=0}^x\left(\genfrac{}{}{0pt}{}{n}{i}\right)\cdotp
    {p}^i\cdotp {q}^{n-i} $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equab.png)


    清单 3-4 中的代码展示了一个计算二项分布 PMF 的小例子。该代码片段借用了 `StatKit` 中的函数 `choose(n:k:)`，该函数计算在
    `n` 次试验中 `k` 次成功的组合数。


    ```

    func binomialPMF(

    of x: Int,

    p: Double,

    n: Int

    ) -> Double {

    precondition(0 < x, "0 ≮ x.")

    precondition(0 < p && p <= 1, "p ∉ (0, 1].")

    precondition(0 < n, "n must be positive.")

    let binomialCoef = choose(n: n, k: x).realValue

    let successProb = pow(p, x.realValue)

    let failureProb = pow(1 - p, (n - x).realValue)

    return binomialCoef * successProb * failureProb

    }

    let p = 0.4

    let n = 10

    let x = 7

    let pmf = binomialPMF(of: x, p: p, n: n)

    let probability = String(format: "%.2f", p)

    print(

    """

    Likelihood of \(x) heads,

    with p = \(probability) and n = \(n):

    \(String(format: "%.4f", pmf))

    """

    )

    // Prints:

    // Likelihood of 7 heads,

    // with p = 0.40 and n = 10:

    // 0.0425

    Listing 3-4

    Computing the binomial PMF with parameters p = 0.4 and n = 10

    ```


    ### 分布应用


    现在我们已经了解了离散概率分布的基础知识，是时候介绍代码仓库中的一个“另类”项目了。`DistributionsApp` 项目与本书附带的其他代码示例不太一样。运行此代码不会在终端中产生任何数值结果，而是打开一个如图
    3-4 所示的交互式应用程序。


    ![../images/512351_1_En_3_Chapter/512351_1_En_3_Fig4_HTML.png](img/512351_1_En_3_Fig4_HTML.png)


    图 3-4


    来自代码仓库的 `DistributionsApp` 项目


    `DistributionsApp` 允许我们调整一些标准分布的参数，这有助于我们培养对不同结果概率如何变化的直觉。我们需要做的只是：


    *   从左上角的分段控件中选择要查看的分布类型。

    *   从右上角的下拉菜单中选择一个可用的不同标准分布。

    *   使用图表下方出现的控件更改所选分布的参数。


    此应用程序支持离散分布和连续分布，其中一些我们已经介绍过，而另一些则是新的，可以作为进一步学习研究的灵感。花几分钟时间查看不同的图表，并研究在操作它们的参数时它们是如何变化的。当我们进入下一节（涵盖连续分布的基础知识）时，这个程序将会派上用场。

    '
- fmt: '# Continuous Distributions


    A continuous distribution is, conceptually, not very different from a discrete
    distribution. It is still a description of the likelihood of various outcomes
    in a sample space. However, continuous distributions are very different as soon
    as we start using them for computations. Some differences are easy to get used
    to, while others may feel downright counterintuitive when we run into them.


    ## Differences from Discrete Distributions


    One of the main areas where continuous distributions differ from discrete ones
    is that they do not have a probability mass function. Instead, continuous distributions
    have a similar property called the *probability density function* (`PDF`). Rather
    than visualizing a `PDF` with columns in a chart, we use a line chart that produces
    a curve over all sample points, like the one in Figure [3-5](#512351_1_En_3_Chapter.xhtml#Fig5).


    ![../images/512351_1_En_3_Chapter/512351_1_En_3_Fig5_HTML.png](images/512351_1_En_3_Chapter/512351_1_En_3_Fig5_HTML.png)


    Figure 3-5


    A chart showing the `PDF` of a standard normal distribution


    While a continuous line certainly makes a more visually pleasing chart than the
    columns we saw in the discrete charts, the infinite number of sample points also
    makes things a bit tricky. It may not be evident at first, but the values on the
    Y axis no longer represent probabilities. To clarify, we list a few of the sample
    points in Table [3-1](#512351_1_En_3_Chapter.xhtml#Tab1).


    Table 3-1


    A few sample points from a standard normal distribution


    | Sample Point | PDF Value |

    | --- | --- |

    | -0.10 | 0.397 |

    | -0.05 | 0.398 |

    | 0.00 | 0.399 |

    | 0.05 | 0.398 |

    | 0.10 | 0.397 |


    If we treated these values as probabilities, there would be an approximate 199%
    chance of sampling any of these five points from a standard normal distribution.
    That is not realistic given that the total probability of the entire sample space
    should be equal to 1 and that there is an infinite amount of other points to choose
    from. This realization forces us to ask what the `PDF` values really represent
    and why they are different from the `PMF` values.


    The discrete distributions make it relatively simple to picture how the probability
    of all individual sample points sum to one. However, the same picture is not as
    simple to paint when dealing with infinitely many sample points. How small would
    we have to make each `PDF` value to make sure that they sum to one? The answer
    is that we do not use regular sums to make calculations with continuous distributions
    – we use integrals, which come with properties that may be counterintuitive or
    even undesirable at times.


    Anyone who has taken a calculus class can testify that some integrals are incredibly
    complicated to compute. It is no different in statistics, where we often end up
    with equations containing the `PDF`s of multiple dependent random variables. Another
    surprising property of a continuous sample space is that the probability of any
    single point is zero. Yes, it is true. The following is a quick outline of why:


    ```

    Let f(x) be the PDF of a continuous random variable.

    ```


    ```

    Let F(x) be the primitive function of f(x). Then

    ```


    ```

    P[X=x] = ∫_x^x f(x) dx = [F(x)]_x^x = F(x) - F(x) = 0

    ```


    The aforementioned does not serve to be rigorous proof but rather to provide insight
    into why the numbers work out the way they do. The quick-and-dirty explanation
    is that the probability of any single sample point approaches zero as the number
    of sample points approaches infinity. There are, as always, exceptions to this.
    However, in general, this means that we only ask questions about whether a continuous
    random variable is within some range of values. Figure [3-6](#512351_1_En_3_Chapter.xhtml#Fig6)
    shows a visual representation of how the continuous `CDF` relates to the `PDF`.
    Computing the `CDF` comes down to calculating the area under the `PDF` curve.


    ![../images/512351_1_En_3_Chapter/512351_1_En_3_Fig6_HTML.png](images/512351_1_En_3_Chapter/512351_1_En_3_Fig6_HTML.png)


    Figure 3-6


    Computing the continuous `CDF` comes down to calculating the area under the `PDF`
    curve. In this case, `P[0 < X < 1]` is highlighted


    Luckily for us, we will not have to deal with integrals a whole lot in this book.
    Many standard distributions have closed-form analytical solutions or approximations
    of their cumulative distribution functions, which we can exploit to calculate
    our answers instead. Now, let us continue by looking at a continuous standard
    distribution often used in counting processes and queueing theory.'
