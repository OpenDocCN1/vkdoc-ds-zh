    \ Double\nvar XTransY = Double\n清单 4-6\nMultipleLinearRegression 初始化器执行的初始设置\n\
    ```\n\n我们做的第一件事是设置一些所需的数据结构。我们为样本数量和数据维度创建了计数变量。注意，变量 `dimCount32` 和 `dimCount64`\
    \ 的值相同，仅类型不同。也可以选择使用单个变量并在需要时进行类型转换，但这会增加阅读此类代码时的认知噪音。\n\n我们通过使用 `flatMap(_:)`\
    \ 创建了 **X** 矩阵，这是一个与 `map(_:)` 和 `filter(_:)` 类似的高阶函数。它的工作方式类似于 `map(_:)`，但要求为每个数据点创建一个值序列。然后它会把生成的所有数组合并成一个，其中第一个数据点的\
