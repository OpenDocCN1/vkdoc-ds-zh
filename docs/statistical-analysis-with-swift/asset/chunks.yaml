    \ to thank my friend Bastian, who has spent the past year tossing ideas about\
    \ mathematics and programming back and forth with me. The knowledge and realizations\
    \ from our talks have helped me a great deal when writing this.\n\n## About the\
    \ Author / About the Technical Reviewer\n\n# 1. Swift Primer\n\n> *Swift is a\
    \ general-purpose programming language built using a modern approach to safety,\
    \ performance, and software design patterns.*\n> \n> —Swift.org\n\nApple introduced\
    \ the Swift programming language at Worldwide Developers Conference 2014, with\
    \ the vision to replace other C-based languages such as C, C++, and Objective-C.\
    \ Since then, Swift has grown a passionate community of developers by striving\
    \ to strike the perfect balance between performance, safety, and ease of use.\n\
    \n## A Swift Overview\n\nBefore we dive into statistical analysis, we need to\
    \ ask ourselves a few questions about whether Swift is an appropriate technology\
    \ choice. Other languages support these types of calculations, and many of them\
    \ have excellent third-party libraries that further extend the support of their\
    \ standard libraries. To convince ourselves that Swift is a well-suited tool for\
    \ these tasks, let us look at some advantageous features of the language and its\
    \ ecosystem.\n\n### Performance\n\nOne bottleneck in modern computing is that\
    \ it often includes working with significant amounts of data. For example, Microsoft’s\
    \ Malware Classification data set is almost half a terabyte in size, while Google’s\
    \ Landmark Recognition data consists of more than 1.2 million data points. Processing\
    \ these amounts of data requires access to powerful hardware and demands that\
    \ the programming language we use is efficient.\n\nPerformance has been an important\
    \ buzzword in the marketing of Swift ever since 2014. The vision to compete with\
    \ C and C++ sets a high bar for speed and efficiency, and many benchmarks show\
    \ that it is doing a reasonably good job of keeping up. Compared to Python, which\
    \ has pretty much become the gold standard for data scientists today, benchmarks\
    \ suggest that a corresponding Swift program may yield considerable speedups.\
    \ Since we know that there is much data out there to process, a high-performant\
    \ language is always welcome. However, large amounts of complex data put new requirements\
    \ on how well our tools allow us to manipulate it safely and correctly.\n\n###\
    \ Safety\n\nSafety is a guiding star in the development of Swift. In this context,\
    \ safety means that the language actively tries to protect developers from writing\
    \ code that results in undefined behavior. These safety features include such\
    \ simple things as encouraging the use of immutable variables. However, they also\
    \ contain far more sophisticated schemes and requirements.\n\nOne of the most\
    \ prominent safety measures that Swift takes is the use of the `Optional` type.\
    \ If we need to express the absence of a value, we need to use an empty `Optional`\
    \ instead of a naked null value. Some argue that this is an unnecessarily rigid\
    \ construct that leads to more boilerplate code. However, this forces developers\
    \ to explicitly mark instances where data could be missing and safely handle such\
    \ cases.\n\nAnother important safety feature is the requirement of exclusive memory\
    \ access for modifications. Imagine a scenario where two different method calls\
    \ simultaneously access the same memory location. We can consider this a safe\
    \ operation, so long as both methods just read the contents and move on. However,\
    \ things become problematic as soon as one (or both) wants to manipulate the stored\
    \ value. The final contents in the memory location will depend on which method\
    \ performs their write operation last. Swift can help point out unsafe code by\
    \ requiring exclusive access for modifications, therefore demanding that only\
    \ a single call can sign up to modify a memory location at any time.\n\n### Correctness\n\
    \nAs soon as we start working with large bodies of complex data, it becomes trickier\
    \ to ensure that we produce correct results. We can solve many of these problems\
    \ by incorporating a good portion of sound software engineering practices. However,\
    \ we should also take any help offered by our development tools.\n\nSwift takes\
    \ a great deal of inspiration from the world of functional programming. Developers\
    \ are actively encouraged to consider *value types* and only resort to *reference\
    \ types* if reference semantics are vital. There are many reasons why we should\
    \ prefer to use *value types* when possible, but we will only look at the ones\
    \ that are directly beneficial to us when working with big data sets.\n\nThe first\
    \ real pro of working with *value types* is that they are generally much more\
    \ performant in memory allocation. Swift generally allocates *reference types*\
    \ on the heap, while *value types* typically reside on the stack. There are, as\
    \ always, exceptions, but this works as a good rule of thumb. The process of allocating\
    \ an object on the stack requires the system to increment a pointer, which is\
    \ a speedy operation. However, to allocate an object on the heap, the system needs\
    \ to search that memory area for a large enough slot. This process is much slower,\
    \ and it will be noticeable if we need to allocate many objects.\n\nThe second\
    \ advantage is that *value types* make copies of themselves when shared between\
    \ different variables. This property means we can be confident that no other variable\
    \ can change the data we are currently working on behind our backs. This locality\
    \ makes it much simpler to reason about our results and perform sanity checks\
    \ on individual code sections. It also simplifies things as soon as we need to\
    \ parallelize our work."
