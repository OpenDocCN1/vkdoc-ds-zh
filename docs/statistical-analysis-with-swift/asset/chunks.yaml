    \  \nThe implementation of `parseTree(_:)`\n\nThis method starts by fetching the\
    \ first byte from the data object, which contains a marker telling us whether\
    \ we are parsing a branch node or a leaf node. It then creates a new `Data` object\
    \ by dropping the marker byte. Creating many new objects like this is generally\
    \ frowned upon since it can impose a significant performance hit. The question\
    \ is, why do we do it then?\n\nThe fact that we need to create a new `Data` object\
    \ is a side effect of how we packed our tree. On the one hand, we stored the markers,\
    \ byte values, and counts in a compact way. It was not as compact as possible,\
    \ but there were no gaps between the different pieces of information. On the other\
    \ hand, this way of packing different types violates some alignment conventions.\
    \ For example, the `UInt8` type has an alignment of 1. If we store a `UInt8` value\
    \ at offset 0, then the next legal offset to store another `UInt8` value is 0\
    \ + 1 = 1. For `Int64`, the corresponding alignment is 8. Such a value is only\
    \ legal if we store it at an offset which is a multiple of 8, such as 0, 8, or\
    \ 16. Herein lies a problem with our compact representation. We store a `UInt8`-sized\
    \ marker at offset 0 and an `Int`-sized count variable at offset 1. To solve this\
    \ misalignment problem, we create a new `Data` object, which effectively resets\
    \ the offset and puts the first element at index 0.\n\n> **Note**  \n> As previously\
    \ mentioned, it is entirely possible to store the tree differently. One could\
    \ throw away the count variable as a simple fix since it is not pertinent to the\
    \ decoding process. That would eradicate the alignment issue since the rest of\
    \ the encoded data is of type `UInt8`. Feel free to play around with the code\
    \ project and see which other solutions are possible.\n\nNow that we know about\
    \ potential issues when encoding binary data like this, let us look at the rest\
    \ of `parseTree(_:)`. We switch on the marker to determine if the current node\
    \ is a branch or a leaf. If the node is a branch, we recursively call `parseTree(_:)`\
    \ to decode the left and right branches and return them grouped under a new `.node`\
    \ instance. If, on the other hand, we are parsing a leaf node, we read out the\
    \ count and byte value from the pointer. We then resolve any future alignment\
    \ issues by creating a new `Data` object, thereby resetting the indices after\
    \ the node we just parsed. Finally, we return the leaf.\n\nLast but not least,\
    \ we look at the function that parses the encoded text message. Listing [6-14](#512351_1_En_6_Chapter.xhtml#PC14)\
    \ shows the implementation.\n\n```swift\nfunc parseText(\nfrom data: Data,\nusing\
    \ tree: HuffmanNode,\nbitLength: Int\n) throws -> String {\nvar textData = Data()\n\
    if case .leaf(let value, _) = tree {\ntextData.append(\ncontentsOf: [UInt8](\n\
