    the one we saw on the previous page. Fortunately, researchers have developed ways
    to approximate the error function with stunning precision. *Handbook of Mathematical
    Functions with Formulas, Graphs, and Mathematical Tables* (1964, p. 299), written
    by Milton Abramovitz and Irene Stegun, contains a formula devised by Cecil Hastings
    Jr to approximate the error function. It has a relatively low computational cost
    and is easy to implement, making it very attractive for our purposes. Listing
    [3-6](#512351_1_En_3_Chapter.xhtml#PC6) provides an implementation, and Listing
    [3-7](#512351_1_En_3_Chapter.xhtml#PC7) used said implementation to approximate
    the normal distribution CDF.


    ```

    func normalCDF(

    x: Double,

    mu: Double,

    sigma: Double

    ) -> Double {

