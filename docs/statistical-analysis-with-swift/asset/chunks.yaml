    ### First Approach


    Our first rule for suggesting movies is to pick some movies at random, regardless
    of their genre or rating. This rule is straightforward to reason about and implement,
    so it is attractive from a complexity viewpoint. However, there are some inherent
    problems with such an approach.


    *   We are equally likely to pick a movie with a bad rating as with a good rating.
    Thanks to this, we are likely to suggest a mix of movies that vary significantly
    in quality. Another issue comes around as we make more and more suggestions. Over
    time, the distribution of good and bad movies we suggest will tend toward the
    ratings of all available movies. This property means that if we have a greater
    number of bad movies available, we will suggest more bad movies than good ones.
    That is a real problem!


    *   We are also equally likely to pick a movie regardless of its genre, which
    is prone to the same problems uncovered in the previous bullet point. We will
    suggest movies from different genres, even if the user is only interested in one
    or two. This choice will also follow the general distribution of genres, so we
    will suggest more drama movies if more drama movies are available.


    As we can see, the simplicity of our first approach comes with a few severe problems.
    The users may abandon the service if it suggests movies that do not match their
    preferences. To alleviate these issues, we suggest two refinements:


    1.  When making suggestions, we should consider a movie’s rating, and movies with
    a higher rating should be more likely to be selected.


    2.  We should also consider genres in our selection. If a user has specified that
    they only like horror movies, there is little to no gain in suggesting documentaries
    or drama movies.


    ### Second Approach


    To mitigate some of the problems associated with the first approach, we update
    our selection rule based on the suggested refinements. This time around, we start
    by filtering all movies not labeled with the user’s preferred genres. After filtering,
    we select the ones that have the best rating. This approach is slightly better
    since we only suggest highly rated movies in genres the user likes. However, there
    are other issues with this approach that are more subtle:


    *   The user might miss out on movies in other related genres. For example, there
    is a significant chance that they might enjoy some thriller movies, even if they
    have only selected horror movies as a preference.


    *   This approach also puts the collective opinion before the user’s judgment.
    Since we select movies with a high rating, we might suggest a movie similar to
    another film that the user did not like. For example, it would probably be a poor
    choice to suggest *Scream 2* to a user who did not enjoy the first movie, even
    if most other users gave it a good rating.


    Even though this approach seems better than the first one, it still has a few
    annoying flaws that we want to address. We need a method that puts less weight
    on exact genres but cares more about which movies we do and do not enjoy. To tackle
    this issue, we turn to the concept of *collaborative filtering*.'
  trans: '

    # 推荐系统


    推荐系统的核心，是一种试图预测用户偏好的系统。这类系统广泛存在于各类网店、社交媒体平台和流媒体服务中。以下是一些推荐系统实际应用的例子：


    - Netflix 主页会推荐一批我们可能喜欢的电影。

    - YouTube 会显示一系列可能引发我们兴趣的视频片段。

    - LinkedIn 和 Facebook 会向我们推荐可能想要联系或交友的人。

    - Twitter 会展示我们不熟悉但发布的内容可能合我们口味的人。

    - Amazon 会推荐我们可能感兴趣购买的其他产品。


    上述例子只是最突出的几个案例，但要点很明确——推荐系统无处不在，它们影响着我们如何花费时间、金钱和注意力。


    ## 推荐系统的功能


    我们开发推荐系统的原因有很多，其中一些原因比其他原因更显而易见。让我们先来看看“为什么”，这样我们以后就能更好地理解“怎么做”。


    首先，好的推荐能提高追加销售的可能性。一家能对附加产品做出良好推荐的在线商店，更有可能售出额外的商品。例如，想象我们在某家线上电子商店的购物车里放了一台电视。商店可以通过建议购买一包遥控器用的电池、一些屏幕清洁湿巾或一个壁挂支架来多赚一点钱。对于正在购买电视的人来说，展示这些东西似乎都是不错的选择。然而，如果他们展示的是电脑或咖啡机，可能就没那么幸运了。当然，顾客也可能恰恰在寻找这些东西，但这似乎是一场没有把握的赌注。


    其次，好的推荐能让顾客有宾至如归的感觉。我们都曾有过这种感觉：当某个网站建议我们购买完全离谱的产品时。这种感觉甚至可能导致潜在客户离开网站，并且再也不回来。一个能做出恰当推荐的服务会让用户感到被看见、被理解，从而提升使用体验。按照这个逻辑，一个完善的推荐系统既服务于销售产品的公司，也服务于使用它的顾客。例如，如果
    Netflix 的应用只是随机推荐任何类型的电影，它就不会拥有同样规模的忠实观众。


    ## 解决问题的方法


    做出这样的推荐绝非易事，而且这个领域有大量正在进行的研究。本章将采用与推导线性回归公式时类似的路径。我们会从一个简单但略显幼稚的推荐电影规则开始，讨论其影响，然后加以改进。最后，我们将得到一种名为**协同过滤**的方法，并实现它来为用户推荐电影。


    ### 第一种方法


    我们推荐电影的第一条规则是：随机挑选一些电影，不管它们的类型或评分如何。这条规则易于理解和实现，因此在复杂性方面很有吸引力。然而，这种方法存在一些固有的问题。


    - 我们选到差评电影和好评电影的概率是相同的。正因如此，我们很可能会推荐一批质量参差不齐的电影。另一个问题随着我们做出越来越多推荐而出现。随着时间的推移，我们推荐的好电影和差电影的分布将趋向于所有可用电影的评分分布。这意味着，如果可用的差电影数量更多，我们推荐的差电影就会比好电影多。这真是一个大问题！

    - 我们选到任何类型电影的概率也是相同的，这会引发与前一个要点类似的问题。即使用户只对一两种类型感兴趣，我们也会推荐来自不同类型电影。这种选择同样会遵循类型的总体分布，因此如果可用的剧情片更多，我们就会推荐更多的剧情片。


    正如我们所见，第一种方法的简单性带来了一些严重的问题。如果系统推荐不符合用户偏好的电影，用户可能会放弃使用该服务。为了缓解这些问题，我们建议进行两项改进：


    1. 在推荐时，我们应该考虑电影的评分，评分越高的电影被选中的可能性应该越大。

    2. 在选择时，我们也应该考虑电影的类型。如果用户指定了他们只喜欢恐怖片，那么推荐纪录片或剧情片就没有什么意义，甚至毫无益处。


    ### 第二种方法


    为了缓解与第一种方法相关的一些问题，我们根据建议的改进更新了选择规则。这一次，我们首先过滤掉所有未标有用户偏好类型的电影。过滤之后，我们选择那些评分最好的电影。这种方法稍好一些，因为我们只推荐用户喜欢的类型中评分高的电影。然而，这种方法还存在其他更微妙的问题：


    - 用户可能会错过其他相关类型的电影。例如，即使他们只选择了恐怖片作为偏好，但他们很有可能也会喜欢一些惊悚片。

    - 这种方法也将集体意见置于用户自己的判断之上。由于我们选择评分高的电影，我们可能会推荐一部与用户不喜欢的另一部电影相似的作品。例如，向一位不喜欢第一部《惊声尖叫》的用户推荐《惊声尖叫
    2》很可能是一个糟糕的选择，即使大多数其他用户给了它好评。


    尽管这种方法似乎比第一种更好，但它仍然存在几个我们想要解决的恼人缺陷。我们需要一种方法，它不那么看重精确的类型，而更关注我们到底喜欢和不喜欢哪些电影。为了解决这个问题，我们引入**协同过滤**的概念。

    '
- fmt: '# Final Approach


    In the final approach to this problem, we ask whom we would turn to for movie
    recommendations before streaming services came along. We probably have a few friends
    that share the same taste in movies and are likely to make suggestions that we
    will enjoy. This idea is what collaborative filtering is all about. If person
    X agrees with person Y on some subject, X is more likely to share the opinion
    of Y on a different subject than a randomly selected person.


    To make this tangible, imagine that Anna and Zoe have seen and rated the first
    two Scream movies, while Nick has only seen the first one. We could structure
    their ratings as shown in Table [7-1](#512351_1_En_7_Chapter.xhtml#Tab1).


    **Table 7-1** Movie ratings cast by three people


    | | Scream | Scream 2 |

    | --- | --- | --- |

    | Nick | Good | ? |

    | Anna | Good | Good |

    | Zoe | Bad | Bad |


    Given these ratings, who should Nick ask for advice on whether to watch *Scream
    2*? The better choice is probably to ask Anna since she has the same opinion on
    the first movie as Nick. Since Zoe did not like *Scream*, the chances are that
    she has a different set of preferences and that her suggestion might not correlate
    that well with what Nick enjoys.


    We arrive at a feasible concept for our recommender system by expanding this idea
    to include all service users. By doing that, recommending a movie for a user comes
    down to the following steps:


    1. Find a certain number of users that have rated movies similar to the one asking
    for suggestions.

    2. Compute an expected rating for all movies based on how the set of similar users
    have rated them.

    3. Suggest the movies that have the highest expected rating.


    To perform these steps, we first need to settle on how to compute the similarity
    of two users. We will cover two common methods in the next section. We should
    also note that collaborative filtering works well when there are many other users
    to compare to, simply because there is a greater chance that others will like
    the same things. However, imagine if the service only had two users who liked
    completely different things. The lack of data would force the algorithm to ask
    for suggestions from someone who likes different movies.


    An alternative approach that does not rely on other users is *content-based filtering*,
    which focuses entirely on how the user asking for suggestions has rated other
    movies. This approach will not be covered in detail but may be of interest for
    further studies.


    ## Similarity Measures


    As the name suggests, a similarity measure is a way of determining how similar
    two objects are. There is an unlimited number of measures one can use, and we
    need to think carefully about why and how we design them. We will look at two
    measures here. One will not be helpful to the problem we are trying to solve,
    while the other is a better fit. The idea is to show how to reason about these
    calculations to select appropriate ones for future problems.


    ### Cosine Similarity


    The cosine similarity measures similarity by looking at the angle that separates
    two feature vectors. It accomplishes this by computing how well the rating vectors
    project onto each other. We can derive the formula for the cosine similarity between
    two nonzero vectors **A** and **B** from the Euclidean dot product formula.


    ```

    A·B = ||A|| ||B|| cos θ

    ```


    ```

    CosSim(A, B) = cos θ = (A·B) / (||A|| ||B||)

    ```


    This formula yields a real number between -1 and 1 depending on how similar the
    two vectors are. If they point in the same general direction, the similarity score
    will tend toward 1. If they are opposites, the score will go toward -1. In our
    case, the minimum score is 0 since we cannot rate a movie with a negative number.


    Now, for the sake of making these discussions tangible, suppose that four people
    rate two movies according to Table [7-2](#512351_1_En_7_Chapter.xhtml#Tab2) on
    the following page.


    **Table 7-2** An example of four people’s ratings for two movies


    | | Movie 1 | Movie 2 |

    | --- | --- | --- |

    | **Tyler** | 5 | 5 |

    | **Sarah** | 5 | 5 |

    | **Mike** | 5 | 1 |

    | **Jane** | 1 | 1 |


    Looking at these ratings, we would expect a similarity measure to say that Tyler
    is very similar to Sarah, a little bit similar to Mike, but not at all similar
    to Jane. However, running the calculations, we end up with the following results:


    ```

    CosSim(Tyler, Sarah) = (5·5 + 5·5) / (√50·√50) = 1

    ```


    ```

    CosSim(Tyler, Mike) = (5·5 + 5·1) / (√50·√26) = 0.832

    ```


    ```

    CosSim(Tyler, Jane) = (5·1 + 5·1) / (√50·√2) = 1

    ```


    That is not the result we wanted. This similarity measure thinks that Tyler and
    Jane are just as similar as Tyler and Sarah. Let us plot the vectors to understand
    why. Figure [7-1](#512351_1_En_7_Chapter.xhtml#Fig1) shows them as arrows in a
    chart, where the rating Movie 1 is plotted against the X axis and Movie 2 against
    the Y axis.


    ![../images/512351_1_En_7_Chapter/512351_1_En_7_Fig1_HTML.png](images/512351_1_En_7_Chapter/512351_1_En_7_Fig1_HTML.png)


    **Figure 7-1** The example ratings for Movie 1 and Movie 2 plotted as two-dimensional
    vectors


    The plot makes it very clear what is going on. Even though Tyler’s and Sarah’s
    ratings are very different from Jane’s, the vectors they produce are parallel.
    Since the cosine similarity only cares about the angle between the vectors, it
    considers their ratings very much alike, while Mike’s ratings are not entirely
    similar to the rest.


    We will not use this similarity measure in our implementation since it does not
    behave the way we want. However, this example does highlight the importance of
    thinking about exactly how we define object similarity. A metric may seem like
    a decent choice at first but could end up wreaking havoc in our calculations.
    In this case, we could have ended up suggesting Jane’s favorite movies to Tyler,
    which would probably have been a bad fit. Now that we have seen what can go wrong,
    let us define a similarity metric that works better.'
