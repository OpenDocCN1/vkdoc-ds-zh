  trans: '

    ### 损失函数


    顾名思义，损失函数的职责是衡量当前模型所承受的损失。优秀的模型损失值较低，表明其预测值非常接近数据点的测量值。反之，当模型预测效果极差时，我们希望损失函数返回一个较大的数值。


    创建和优化模型时的主要挑战之一，在于设计一个合适的损失函数。其包含的参数反映了哪些信息对我们而言是重要的。例如，如果我们想通过房屋的平方英尺数来确定其售价，但损失函数只包含房间数量这一因素，那我们永远无法做出准确的预测。


    回到我们的示例数据，我们希望最小化模型预测值与数据中测量值之间的总距离。例如，如果目标值是 4，但我们预测为 3，那么距离（或误差）就是 1。通过汇总模型产生的所有误差，我们可以量化模型的表现。同时，我们还需要避免正负误差相互抵消，以免造成损失函数的混乱。用`N`表示数据集中的样本点数量，用`y`表示样本的观测值，我们可以设置以下满足需求的损失函数`ℒ`：


    ![$$ \mathcal{L}=\sum_{i=1}^N{\left({y}_i-f\left({x}_i\right)\right)}²=\sum_{i=1}^N{\left({y}_i-k{x}_i-m\right)}²
    $$](img/512351_1_En_4_Chapter_TeX_Equf.png)


    我们通常将上述函数称为平方和误差。平方运算确保了预测值与目标值之间的误差始终为正，并且保持了误差的顺序关系。因此，如果用`e[1]`和`e[2]`表示两个点的误差，那么


    ![$$ {e}_1&lt;{e}_2\kern0.75em \Longrightarrow \kern0.75em {\left({e}_1\right)}²&lt;{\left({e}_2\right)}²
    $$](img/512351_1_En_4_Chapter_TeX_Equg.png)


    维持这种关系至关重要。引入任何打破这种顺序关系的变换都可能产生意料之外的后果，因为好的预测反而会比坏的预测贡献更大的损失。


    现在，我们已经确定了满足目标的损失函数，可以开始优化阶段。我们将`k`和`m`视为变量，因为它们是本次优化的目标。首先，我们计算`ℒ`关于`k`和`m`的黑塞矩阵，结果为：


    ![$$ {\boldsymbol{H}}_{\mathbf{\mathcal{L}}}=\left[\ \begin{array}{cc}\frac{\partial²\mathcal{L}}{\partial
    {k}²}&amp; \frac{\partial²\mathcal{L}}{\partial k\ \partial m}\\ {}\frac{\partial²\mathcal{L}}{\partial
    m\ \partial k}&amp; \frac{\partial²\mathcal{L}}{\partial {m}²}\end{array}\kern0.5em
    \right]=\left[\begin{array}{cc}2\sum_{i=1}^N{\left({x}_i\right)}²&amp; 2\sum_{i=1}^N\left({x}_i\right)\\
    {}2\sum_{i=1}^N\left({x}_i\right)&amp; 2N\end{array}\right] $$](images/512351_1_En_4_Chapter/512351_1_En_4_Chapter_TeX_Equh.png)


    黑塞矩阵是一个由二阶偏导数组成的方阵，描述了函数的曲率。我们继续计算该矩阵的特征值，得到：


    ![$$ \det \left(\ {\boldsymbol{H}}_{\mathcal{L}}-\lambda \cdotp \boldsymbol{I}\right)=0
    $$](img/512351_1_En_4_Chapter_TeX_Equi.png)


    ![$$ {\lambda}²-2\lambda \left(\sum_{i=1}^N{\left({x}_i\right)}²+N\right)=0 $$](img/512351_1_En_4_Chapter_TeX_Equj.png)


    ![$$ \lambda =\left(\sum_{i=1}^N{\left({x}_i\right)}²+N\right)\pm \left(\sum_{i=1}^N{\left({x}_i\right)}²+N\right)
    $$](img/512351_1_En_4_Chapter_TeX_Equk.png)


    ![$$ {\lambda}_1=0,\kern0.5em {\lambda}_2=2\Big(N+\sum_{i=1}^N\left({x}²\right)
    $$](img/512351_1_En_4_Chapter_TeX_IEq1.png))


    虽然第一个特征值是标量，但我们需要对第二个特征值做进一步分析。我们可以判断，`N`始终为正，因为样本点至少有一个。我们也知道，对平方值求和的结果总是正数。这些认知让我们得出结论：第二个特征值必然为正，因此该黑塞矩阵是半正定的。接下来我们将看到，这会影响我们找到最优解的能力。


    除了判定`H[ℒ]`的半正定性，我们还需要确定损失函数的定义域是否为凸集。


    ![$$ 集合\ D\ 是凸集，如果对于任意\ {x}_1,{x}_2\in D\ 及任意实数\ \theta \in \left[0,1\right]，\\
    满足以下条件： $$](images/512351_1_En_4_Chapter/512351_1_En_4_Chapter_TeX_Equl.png)


    ![$$ \theta {x}_1+\left(1-\theta \right){x}_2\in D $$](img/512351_1_En_4_Chapter_TeX_Equm.png)


    上述定理指出，如果我们能选取任意两个元素并组合，结果仍属于同一集合，则该集合是凸集。图 4-3 展示了这一概念的可视化效果。无论我们在圆形内选择哪两个点，它们之间的直线只会穿过该集合的其他元素。


    ![../images/512351_1_En_4_Chapter/512351_1_En_4_Fig3_HTML.png](img/512351_1_En_4_Fig3_HTML.png)


    **图 4-3** 实心圆是一个凸集，因为任意两点之间的线段仅包含该集合内的其他点


    实数集`ℝ`是凸集。无论我们选择哪两个数，它们的凸组合总是另一个实数值。我们可以得出结论：我们问题的定义域是凸集。结合黑塞矩阵为半正定的结论，这对我们来说是件好事。这意味着，如果能找到问题的一个最优解，那么该解必定是全局最优解。

    '
- fmt: '### Finding an Optimal Solution


    The last section was hefty on the theory, so let us quickly recap what we have
    learned and where we want to end up. We have learned that:


    - We have designed a loss function to help us determine whether our model is making
    good or bad predictions.

    - Since we could establish that the Hessian is positive semi-definite, we can
    confirm that our loss function is convex on its domain.

    - The domain of the loss function is the entire real number line, ℝ. The set of
    real numbers is convex since it satisfies the conditions in the theorem we saw
    previously.

    - If we can find a local optimum for our loss function (an input value that minimizes
    the output value), it is guaranteed to be a global optimum. Thanks to this, we
    do not have to worry about finding any input values that are only locally optimal.


    With this knowledge at hand, we are ready to find the linear equation that best
    fits our observed data. Moreover, now that we know that our problem is convex,
    we can use one of the oldest optimization tricks in the book – computing the partial
    derivatives over `k` and `m`, setting them to zero, and performing some algebraic
    gymnastics.


    ![$$ \frac{\partial \mathcal{L}}{\partial m}=0 $$](images/512351_1_En_4_Chapter/512351_1_En_4_Chapter_TeX_Equn.png)


    ![$$ -2\sum_{i=1}^N\left({y}_i-k{x}_i-m\right)=0 $$](images/512351_1_En_4_Chapter/512351_1_En_4_Chapter_TeX_Equo.png)


    ![$$ m=\frac{1}{N}\sum_{i=1}^N{y}_i-k\frac{1}{N}\sum_{i=1}^N{x}_i $$](images/512351_1_En_4_Chapter/512351_1_En_4_Chapter_TeX_Equp.png)


    ![$$ \frac{\partial \mathcal{L}}{\partial k}=0 $$](images/512351_1_En_4_Chapter/512351_1_En_4_Chapter_TeX_Equq.png)


    ![$$ -2\sum_{i=1}^N\left({y}_i-k{x}_i-m\right){\mathrm{x}}_{\mathrm{i}}=0 $$](images/512351_1_En_4_Chapter/512351_1_En_4_Chapter_TeX_Equr.png)


    ![$$ k=\frac{N\sum_{i=1}^N{\mathrm{x}}_{\mathrm{i}}{y}_i-\left(\sum_{i=1}^N{x}_i\right)\left(\sum_{i=1}^N{y}_i\right)}{N\sum_{i=1}^N{\left({\mathrm{x}}_{\mathrm{i}}\right)}^2-{\left(\sum_{i=1}^N{x}_i\right)}^2}
    $$](images/512351_1_En_4_Chapter/512351_1_En_4_Chapter_TeX_Equs.png)


    At first glance, these equations may look like we just made things worse. However,
    we notice something important when we look carefully. The expressions for `k`
    and `m` consist entirely of building blocks from the data set. Thus, all we need
    to do is perform a few transformations and summations!


    ### Implementing Simple Linear Regression


    Now that we have worked out the mathematics of our problem, implementing a solution
    will be much easier. Let us start by creating a type called `SimpleLinearRegression`.
    The purpose of this type is to fit a linear equation to some data set. However,
    we do not want the headache of shaping the data into real number arrays. Instead,
    we want `SimpleLinearRegression` to take the original data set and retrieve some
    specified values to use in its calculations. These requirements are a perfect
    use case for the `KeyPath` type we learned about earlier. Listing [4-1](#512351_1_En_4_Chapter.xhtml#PC1)
    defines the `struct` and some of its properties.


    ```

    import StatKit

    struct SimpleLinearRegression


    : CustomStringConvertible {

    let k: Double

    let m: Double

    var description: String {

    let sign = (m.sign == .plus) ? "+" : "-"

    return "\(k)x \(sign) \(abs(m))"

    }

    func predict(x: X) -> Double {

    return k * x.realValue + m

    }

    }

    Listing 4-1

    Defining a base type for a simple linear regressor

    ```


    Before moving on to the mathematics, let us quickly walk through the code. There
    are some fairly advanced concepts at play here, and we need to understand them
    to make sense of the rest.


    - The line that starts with an angle bracket lists some *generic types*. `Element`
    is a placeholder for the data we send into the regressor, which can be of any
    kind. `X` and `Y` work as placeholders for the variable types we want to perform
    our linear regression over. They are constrained such that we are only allowed
    to use types that conform to the `ConvertibleToReal` protocol. The protocol comes
    from `StatKit` and applies to all types that we can transform into a `Double`.


    - The `CustomStringConvertible` protocol is part of the Swift standard library
    and requires us to implement the `description` property. We use this to tell the
    system how to describe the regressor when trying to print it.


    - The `predict(x:)` function does what it says. It predicts the value for some
    input. As we can see, the parameter `x` is constrained to the generic type `X`,
    which is the same constraint we are about to place on the data in the training
    set.


    The only method that is missing is the one that fits the training data. Since
    a linear regression is tightly coupled to the data we use to fit our function,
    we can perform the calculations in the initializer. Listing [4-2](#512351_1_En_4_Chapter.xhtml#PC2)
    defines an initializer for our `SimpleLinearRegression`.


    ```

    init(

    from samples: [Element],

    x: KeyPath,

    y: KeyPath

    ) {

    let n = samples.count.realValue

    let (xSum, ySum, xSqSum, xySum) = samples

    .reduce(

    into: (0.0, 0.0, 0.0, 0.0)

    ) { result, point in

    let x = point[keyPath: x].realValue

    let y = point[keyPath: y].realValue

    result.0 += x

    result.1 += y

    result.2 += x * x

    result.3 += x * y

    }

    let kNumerator = (n * xySum - xSum * ySum)

    let kDenominator = (n * xSqSum - xSum * xSum)

    self.k = kNumerator / kDenominator

    self.m = (ySum - k * xSum) / n

    }

    Listing 4-2

    The initializer for SimpleLinearRegression

    ```


    This function is where the mathematical magic happens. As we can see, the generic
    declarations work to constrain the input values. These constructs give Swift’s
    compiler a chance to help us check the code and provide feedback. We use the `KeyPath`s
    we learned about in Chapter [1](#512351_1_En_1_Chapter.xhtml) to retrieve values
    for our computations, and we calculate `k` and `m` according to the formulas we
    derived.


    These implementations make up the entire `SimpleLinearRegression` type and are
    all we need to perform some statistical analysis. Listing [4-3](#512351_1_En_4_Chapter.xhtml#PC3)
    shows how we can use our new `struct` to compute the line that best fits our example
    data.


    ```

    let points = DataLoader.load(

    Point.self,

    from: .simpleLinearRegression

    )

    let regressor = SimpleLinearRegression(

    from: points,

    x: \.x,

    y: \.y

    )

    let x = 5.0

    let prediction = regressor.predict(x: x)

    let observed = points

    .first(where: { point in

    point.x == 5

    })!.y

    print(

    """

    Best fit linear equation for example data

    f(x) = \(regressor)

    Prediction for x = 5

    \(prediction)

    Observed value for x = 5

    \(observed)

    """

    )

    // Prints:

    // Best fit linear equation for example data

    // f(x) = 0.9522649643240606x + 0.4713220140473652

    //

    // Prediction for x = 5

    // 5.232646835667667

    //

    // Observed value for x = 5

    // 5.371954518

    Listing 4-3

    Performing linear regression using our new Swift type

    ```


    The amount of glue code needed to perform this regression is minimal, thanks to
    the linear regression type we just wrote. It is also effortless to reuse if we
    want to make other regressions. For example, imagine if the data set also contained
    a `z` variable. We would only need to create a new regressor and replace the appropriate
    `KeyPath` reference with a `\.z` to make that happen!


    Let us take a look at how well this equation describes the data. Figure [4-4](#512351_1_En_4_Chapter.xhtml#Fig4)
    shows the noisy samples we fed into the algorithm and the linear equation we got
    back.


    ![../images/512351_1_En_4_Chapter/512351_1_En_4_Fig4_HTML.png](images/512351_1_En_4_Chapter/512351_1_En_4_Fig4_HTML.png)


    Figure 4-4


    The noisy sample data plotted together with the fitted model from our linear regression


    As we can see, the line describes this data set very well. It follows the general
    trend, and it is insensitive to local variations. Another plus is that it only
    requires us to store two floating-point numbers to make any prediction. Furthermore,
    there is no need to keep the original data around since we already distilled its
    characteristics. That is very lightweight!'
  raw: '### Finding an Optimal Solution


    The last section was hefty on the theory, so let us quickly recap what we have
    learned and where we want to end up. We have learned that


    *   We have designed a loss function to help us determine whether our model is
    making good or bad predictions.


    *   Since we could establish that the Hessian is positive semi-definite, we can
    confirm that our loss function is convex on its domain.


    *   The domain of the loss function is the entire real number line, ℝ. The set
    of real numbers is convex since it satisfies the conditions in the theorem we
    saw previously.


    *   If we can find a local optimum for our loss function (an input value that
    minimizes the output value), it is guaranteed to be a global optimum. Thanks to
    this, we do not have to worry about finding any input values that are only locally
    optimal.


    With this knowledge at hand, we are ready to find the linear equation that best
    fits our observed data. Moreover, now that we know that our problem is convex,
    we can use one of the oldest optimization tricks in the book – computing the partial
    derivatives over *k* and *m*, setting them to zero, and performing some algebraic
    gymnastics.


    ![$$ \frac{\partial \mathcal{L}}{\partial m}=0 $$](images/512351_1_En_4_Chapter/512351_1_En_4_Chapter_TeX_Equn.png)


    ![$$ -2\sum_{i=1}^N\left({y}_i-k{x}_i-m\right)=0 $$](images/512351_1_En_4_Chapter/512351_1_En_4_Chapter_TeX_Equo.png)


