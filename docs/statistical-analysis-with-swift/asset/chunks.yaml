- fmt: "### Determining the P-value\n\nThe p-value is a term that often comes up in\
    \ articles, documentaries, and reports. However, it can be challenging to grasp\
    \ what it means and why it is useful. Using the tools we have studied in this\
    \ chapter, we should be able to make sense of it.\n\nTo start, we will revisit\
    \ the alpha value, which helped us draw the line of how unlikely a value needs\
    \ to be to reject the null hypothesis. In a right-tailed test, the alpha value\
    \ defines the shaded area under the normal curve shown in Figure [5-6](#512351_1_En_5_Chapter.xhtml#Fig6).\n\
    \n![../images/512351_1_En_5_Chapter/512351_1_En_5_Fig6_HTML.png](images/512351_1_En_5_Chapter/512351_1_En_5_Fig6_HTML.png)\n\
    \nFigure 5-6\n\nIn a right-tailed test, we need our test statistic to be sufficiently\
    \ far from the mean (on the horizontal X axis) so that it enters the orange-shaded\
    \ area. We define the size of that area with the alpha value.\n\nFigure [5-6](#512351_1_En_5_Chapter.xhtml#Fig6)\
    \ makes it visually clear that the alpha value separates the “most extreme” values\
    \ from the rest of the distribution. If this were a left-tailed test, the shaded\
    \ area would instead be on the left-hand side of the distribution, while a two-tailed\
    \ test would have shaded areas on both sides.\n\nTo reject the null hypothesis,\
    \ we want our test statistic to fall within the shaded area. It needs to be extreme\
    \ enough to reject the probability that this distribution produced it by random\
    \ chance. The p-value is the probability of obtaining a value that is at least\
    \ as extreme as our own. For the right-tailed test depicted in Figure [5-6](#512351_1_En_5_Chapter.xhtml#Fig6),\
    \ we would write\n\n![$$ P- Value=P\\left[X&gt;\\overline{x}\\right]=1-P\\left[X&lt;\\\
    overline{x}\\right]=1- CD{F}_{N\\left(\\mu, \\sigma \\right)}\\left(\\overline{x}\\\
    right) $$](images/512351_1_En_5_Chapter/512351_1_En_5_Chapter_TeX_Equn.png)\n\n\
    Since the left-tailed test regards the left side of the distribution as extreme,\
    \ the formula for computing the p-value becomes\n\n![$$ P- Value=P\\left[X&lt;\\\
    overline{x}\\right]= CD{F}_{N\\left(\\mu, \\sigma \\right)}\\left(\\overline{x}\\\
    right) $$](images/512351_1_En_5_Chapter/512351_1_En_5_Chapter_TeX_Equo.png)\n\n\
    The formula for the two-tailed test is a little trickier since we need to take\
    \ both sides of the distribution into account. However, the distribution we are\
    \ working with is symmetric, and both tails will have the same probability. Therefore,\
    \ we can use the left tail twice:\n\n![$$ P- Value=2\\cdotp P\\left[X&lt;\\mu\
    \ -\\left|\\mu -\\overline{x}\\right|\\right]=2\\cdotp CD{F}_{N\\left(\\mu, \\\
    sigma \\right)}\\left(\\mu -|\\mu -\\overline{x}|\\right) $$](images/512351_1_En_5_Chapter/512351_1_En_5_Chapter_TeX_Equp.png)\n\
    \nThe code in Listing [5-4](#512351_1_En_5_Chapter.xhtml#PC4) shows how to implement\
    \ this calculation in an easy-to-use function.\n\n```swift\nenum TestTail {\n\
    case left, right, both\n}\nfunc pValue(\nof x: Double,\nmu: Double,\nsigma: Double,\n\
    tail: TestTail\n) -> Double {\nlet dist = NormalDistribution(\nmean: mu,\nstandardDeviation:\
    \ sigma\n)\nlet leftProb = dist.cdf(x: mu - abs(mu - x))\nreturn tail == .both\n\
    ? 2 * leftProb\n: leftProb\n}\nlet sample = 105.0\nlet mu = 100.0\nlet sigma =\
    \ 15 / sqrt(30)\nlet pValue = pValue(\nof: sample,\nmu: mu,\nsigma: sigma,\ntail:\
    \ .right\n)\nprint(\"P-Value for the dean's experiment: \\(pValue)\")\n// Prints:\n\
    // P-Value for the dean's experiment:\n// 0.033944520649489496\n```\n\nListing\
    \ 5-4 — Computing the p-value using Swift\n\n## Standardization\n\nOne common\
    \ way of dealing with hypothesis testing is to standardize the test statistic.\
    \ That is, we transform it in such a way that we compare it to some standard distribution.\
    \ Chapter [3](#512351_1_En_3_Chapter.xhtml) mentioned the standard normal distribution\
    \ – a normal distribution with a mean of zero and a standard deviation of one.\
    \ It would be fantastic if we could always use the same set of parameters to test\
    \ our hypothesis. The main gain would be that an alpha value would draw the rejection\
    \ line at the same X-axis value every time instead of depending on the exact shape\
    \ of the distribution. Luckily for us, there exists such a standardization.\n\n\
    ### Computing a Standard Score\n\nA standard score, also called a z-score, is\
    \ a compact formula that transforms our observed value into a standardized number.\
    \ It represents the number of standard deviations that the raw score differs from\
    \ the mean. If we standardize a raw score from another normal distribution, it\
    \ could also be considered as transforming the raw score and the original distribution\
    \ to a standard normal distribution. Figure [5-7](#512351_1_En_5_Chapter.xhtml#Fig7)\
    \ shows a conceptual image of this line of thought.\n\n![../images/512351_1_En_5_Chapter/512351_1_En_5_Fig7_HTML.png](images/512351_1_En_5_Chapter/512351_1_En_5_Fig7_HTML.png)\n\
    \nFigure 5-7\n\nThe z-score conceptualized as transforming a raw score and its\
    \ original normal distribution into a standard normal distribution\n\nWe define\
    \ the z-score as\n\n![$$ z=\\frac{x-\\mu }{\\sigma } $$](images/512351_1_En_5_Chapter/512351_1_En_5_Chapter_TeX_Equq.png)\n\
    \nIn this formula, μ and σ are the mean and standard deviation of the population.\
    \ Computing the z-score for the intelligence tests from before, we end up with\n\
    \n![$$ \\frac{105-100}{\\frac{15}{\\sqrt{30}}}\\approx 1.826 $$](images/512351_1_En_5_Chapter/512351_1_En_5_Chapter_TeX_Equr.png)\n\
    \nThis z-score tells us that the average result that the students produced is\
    \ about 1.8 standard deviations away from the mean of the distribution. Now the\
    \ task of verifying whether we can reject the null hypothesis comes down to comparing\
    \ it to the z-score of some alpha value. For example, a right-tailed test alpha\
    \ value of 0.05 has a z-score of 1.645. Since our statistic has a higher score\
    \ in this test, we can reject `H0`.\n\nNow that we have covered standardization\
    \ and z-scores, feel free to go back to the code samples for this chapter. Try\
    \ normalizing the test statistic, running it through a standard normal distribution,\
    \ and ensuring that the results are the same.\n\n> **Note**  \n> The results may\
    \ differ slightly when using the z-score. This difference comes from rounding\
    \ errors related to the limited bitwidth of computers. However, the errors are\
    \ so small that they are negligible."
  raw: '### Determining the P-value


    The p-value is a term that often comes up in articles, documentaries, and reports.
    However, it can be challenging to grasp what it means and why it is useful. Using
    the tools we have studied in this chapter, we should be able to make sense of
    it.


    To start, we will revisit the alpha value, which helped us draw the line of how
    unlikely a value needs to be to reject the null hypothesis. In a right-tailed
    test, the alpha value defines the shaded area under the normal curve shown in
    Figure [5-6](#512351_1_En_5_Chapter.xhtml#Fig6).


    ![../images/512351_1_En_5_Chapter/512351_1_En_5_Fig6_HTML.png](images/512351_1_En_5_Chapter/512351_1_En_5_Fig6_HTML.png)


    Figure 5-6


    In a right-tailed test, we need our test statistic to be sufficiently far from
    the mean (on the horizontal X axis) so that it enters the orange-shaded area.
    We define the size of that area with the alpha value


    Figure [5-6](#512351_1_En_5_Chapter.xhtml#Fig6) makes it visually clear that the
    alpha value separates the “most extreme” values from the rest of the distribution.
    If this were a left-tailed test, the shaded area would instead be on the left-hand
    side of the distribution, while a two-tailed test would have shaded areas on both
    sides.


    To reject the null hypothesis, we want our test statistic to fall within the shaded
    area. It needs to be extreme enough to reject the probability that this distribution
    produced it by random chance. The p-value is the probability of obtaining a value
    that is at least as extreme as our own. For the right-tailed test depicted in
    Figure [5-6](#512351_1_En_5_Chapter.xhtml#Fig6), we would write


    ![$$ P- Value=P\left[X&gt;\overline{x}\right]=1-P\left[X&lt;\overline{x}\right]=1-
    CD{F}_{N\left(\mu, \sigma \right)}\left(\overline{x}\right) $$](images/512351_1_En_5_Chapter/512351_1_En_5_Chapter_TeX_Equn.png)


    Since the left-tailed test regards the left side of the distribution as extreme,
    the formula for computing the p-value becomes


    ![$$ P- Value=P\left[X&lt;\overline{x}\right]= CD{F}_{N\left(\mu, \sigma \right)}\left(\overline{x}\right)
    $$](images/512351_1_En_5_Chapter/512351_1_En_5_Chapter_TeX_Equo.png)


    The formula for the two-tailed test is a little trickier since we need to take
    both sides of the distribution into account. However, the distribution we are
    working with is symmetric, and both tails will have the same probability. Therefore,
    we can use the left tail twice:


    ![$$ P- Value=2\cdotp P\left[X&lt;\mu -\left|\mu -\overline{x}\right|\right]=2\cdotp
    CD{F}_{N\left(\mu, \sigma \right)}\left(\mu -|\mu -\overline{x}|\right) $$](images/512351_1_En_5_Chapter/512351_1_En_5_Chapter_TeX_Equp.png)


    The code in Listing [5-4](#512351_1_En_5_Chapter.xhtml#PC4) shows how to implement
    this calculation in an easy-to-use function.


    ```

    enum TestTail {

    case left, right, both

    }

    func pValue(

    of x: Double,

    mu: Double,

    sigma: Double,

    tail: TestTail

    ) -> Double {

    let dist = NormalDistribution(

    mean: mu,

    standardDeviation: sigma

    )

    let leftProb = dist.cdf(x: mu - abs(mu - x))

    return tail == .both

    ? 2 * leftProb

    : leftProb

    }

    let sample = 105.0

    let mu = 100.0

    let sigma = 15 / sqrt(30)

    let pValue = pValue(

    of: sample,

    mu: mu,

    sigma: sigma,

    tail: .right

    )

    print("P-Value for the dean''s experiment: \(pValue)")

    // Prints:

    // P-Value for the dean''s experiment:

    // 0.033944520649489496

    Listing 5-4

    Computing the p-value using Swift

    ```


    ## Standardization


    One common way of dealing with hypothesis testing is to standardize the test statistic.
    That is, we transform it in such a way that we compare it to some standard distribution.
    Chapter [3](#512351_1_En_3_Chapter.xhtml) mentioned the standard normal distribution
    – a normal distribution with a mean of zero and a standard deviation of one. It
    would be fantastic if we could always use the same set of parameters to test our
    hypothesis. The main gain would be that an alpha value would draw the rejection
    line at the same X-axis value every time instead of depending on the exact shape
    of the distribution. Luckily for us, there exists such a standardization.


    ### Computing a Standard Score


    A standard score, also called a z-score, is a compact formula that transforms
    our observed value into a standardized number. It represents the number of standard
    deviations that the raw score differs from the mean. If we standardize a raw score
    from another normal distribution, it could also be considered as transforming
    the raw score and the original distribution to a standard normal distribution.
    Figure [5-7](#512351_1_En_5_Chapter.xhtml#Fig7) shows a conceptual image of this
    line of thought.


    ![../images/512351_1_En_5_Chapter/512351_1_En_5_Fig7_HTML.png](images/512351_1_En_5_Chapter/512351_1_En_5_Fig7_HTML.png)


    Figure 5-7


    The z-score conceptualized as transforming a raw score and its original normal
    distribution into a standard normal distribution


    We define the z-score as


    ![$$ z=\frac{x-\mu }{\sigma } $$](images/512351_1_En_5_Chapter/512351_1_En_5_Chapter_TeX_Equq.png)


    In this formula, μ and σ are the mean and standard deviation of the population.
    Computing the z-score for the intelligence tests from before, we end up with


    ![$$ \frac{105-100}{\frac{15}{\sqrt{30}}}\approx 1.826 $$](images/512351_1_En_5_Chapter/512351_1_En_5_Chapter_TeX_Equr.png)


    This z-score tells us that the average result that the students produced is about
    1.8 standard deviations away from the mean of the distribution. Now the task of
    verifying whether we can reject the null hypothesis comes down to comparing it
    to the z-score of some alpha value. For example, a right-tailed test alpha value
    of 0.05 has a z-score of 1.645\. Since our statistic has a higher score in this
    test, we can reject H[0].


    Now that we have covered standardization and z-scores, feel free to go back to
    the code samples for this chapter. Try normalizing the test statistic, running
    it through a standard normal distribution, and ensuring that the results are the
    same.


    Note


    The results may differ slightly when using the z-score. This difference comes
    from rounding errors related to the limited bitwidth of computers. However, the
    errors are so small that they are negligible.'
  trans: "\n### 确定 P 值\n\np 值是一个在文章、纪录片和报告中经常出现的术语。然而，理解它的含义及其为何有用可能颇具挑战性。利用我们在本章中学到的工具，我们应该能够理解它。\n\
    \n首先，我们将重温 alpha 值，它帮助我们划定了需要达到多不可能的值才能拒绝原假设的界限。在右尾检验中，alpha 值定义了图 5-6 中正态曲线下的阴影区域。\n\
    \n![../images/512351_1_En_5_Chapter/512351_1_En_5_Fig6_HTML.png](img/512351_1_En_5_Fig6_HTML.png)\n\
    \n图 5-6\n\n在右尾检验中，我们需要检验统计量足够远离均值（在水平 X 轴上），以便它进入橙色阴影区域。我们用 alpha 值来定义该区域的大小。\n\
    \n图 5-6 直观地展示了 alpha 值将“最极端”的值与分布的其他部分分开。如果是左尾检验，阴影区域将位于分布的左侧；而双尾检验则会在两侧都有阴影区域。\n\
    \n为了拒绝原假设，我们希望检验统计量落在阴影区域内。它需要足够极端，以至于能够拒绝对这个分布通过随机概率产生该结果的可能性。p 值是获得至少与我们自己的值同样极端的值的概率。对于图\
    \ 5-6 中描绘的右尾检验，我们可以写成\n\n![$$ P- Value=P\\left[X&gt;\\overline{x}\\right]=1-P\\\
    left[X&lt;\\overline{x}\\right]=1- CD{F}_{N\\left(\\mu, \\sigma \\right)}\\left(\\\
    overline{x}\\right) $$](images/512351_1_En_5_Chapter/512351_1_En_5_Chapter_TeX_Equn.png)\n\
    \n由于左尾检验将分布的左侧视为极端值，计算 p 值的公式变为\n\n![$$ P- Value=P\\left[X&lt;\\overline{x}\\\
    right]= CD{F}_{N\\left(\\mu, \\sigma \\right)}\\left(\\overline{x}\\right) $$](images/512351_1_En_5_Chapter/512351_1_En_5_Chapter_TeX_Equo.png)\n\
    \n双尾检验的公式稍微复杂一些，因为我们需要考虑分布的两侧。然而，我们正在处理的分布是对称的，并且两个尾部的概率相同。因此，我们可以使用左尾两次：\n\n\
    ![$$ P- Value=2\\cdotp P\\left[X&lt;\\mu -\\left|\\mu -\\overline{x}\\right|\\\
    right]=2\\cdotp CD{F}_{N\\left(\\mu, \\sigma \\right)}\\left(\\mu -|\\mu -\\overline{x}|\\\
    right) $$](images/512351_1_En_5_Chapter/512351_1_En_5_Chapter_TeX_Equp.png)\n\n\
    清单 5-4 中的代码展示了如何在一个易于使用的函数中实现此计算。\n\n```swift\nenum TestTail {\ncase left, right,\
    \ both\n}\nfunc pValue(\nof x: Double,\nmu: Double,\nsigma: Double,\ntail: TestTail\n\
    ) -> Double {\nlet dist = NormalDistribution(\nmean: mu,\nstandardDeviation: sigma\n\
    )\nlet leftProb = dist.cdf(x: mu - abs(mu - x))\nreturn tail == .both\n? 2 * leftProb\n\
    : leftProb\n}\nlet sample = 105.0\nlet mu = 100.0\nlet sigma = 15 / sqrt(30)\n\
    let pValue = pValue(\nof: sample,\nmu: mu,\nsigma: sigma,\ntail: .right\n)\nprint(\"\
    P-Value for the dean's experiment: \\(pValue)\")\n// 打印：\n// 院长实验的 P 值：\n// 0.033944520649489496\n\
    ```\n\n清单 5-4 — 使用 Swift 计算 p 值\n\n## 标准化\n\n处理假设检验的一种常见方法是对检验统计量进行标准化。也就是说，我们将其转换，以便与某个标准分布进行比较。第\
    \ 3 章提到了标准正态分布——一个均值为零、标准差为 1 的正态分布。如果我们总能使用同一组参数来检验假设，那就太好了。主要的好处是，alpha 值每次都会在相同的\
    \ X 轴值处画出拒绝线，而不是依赖于分布的具体形状。幸运的是，确实存在这样的标准化方法。\n\n### 计算标准分数\n\n标准分数，也称为 z 分数，是一个紧凑的公式，将我们的观测值转换为标准化的数字。它代表了原始分数与均值相差的标准差个数。如果我们将来自另一个正态分布的原始分数标准化，这也可以视为将原始分数和原始分布转换到标准正态分布。图\
    \ 5-7 展示了这一思路的概念图。\n\n![../images/512351_1_En_5_Chapter/512351_1_En_5_Fig7_HTML.png](img/512351_1_En_5_Fig7_HTML.png)\n\
    \n图 5-7\n\n将 z 分数概念化为将原始分数及其原始正态分布转换到标准正态分布\n\n我们将 z 分数定义为\n\n![$$ z=\\frac{x-\\\
    mu }{\\sigma } $$](img/512351_1_En_5_Chapter_TeX_Equq.png)\n\n在这个公式中，μ 和 σ 是总体的均值和标准差。为之前的智力测试计算\
    \ z 分数，我们得到\n\n![$$ \\frac{105-100}{\\frac{15}{\\sqrt{30}}}\\approx 1.826 $$](img/512351_1_En_5_Chapter_TeX_Equr.png)\n\
    \n这个 z 分数告诉我们，学生产生的平均结果大约与分布均值相差 1.8 个标准差。现在，验证我们是否能拒绝原假设的任务，就归结为将其与某个 alpha 值的\
    \ z 分数进行比较。例如，右尾检验 alpha 值为 0.05 对应的 z 分数是 1.645。由于我们的检验统计量在此测试中获得了更高的分数，我们可以拒绝`H0`。\n\
    \n既然我们已经介绍了标准化和 z 分数，请随时返回本章的代码示例。尝试将检验统计量标准化，通过标准正态分布运行它，并确保结果相同。\n\n> **注意**\
    \  \n> 使用 z 分数时结果可能略有不同。这种差异源于与计算机有限位宽相关的舍入误差。然而，这些误差非常小，可以忽略不计。\n"
- fmt: '### Computing Confidence Intervals


    Not only does the z-score provide a way to use the same measuring tape for our
    tests, regardless of from which distribution our data came. It also provides a
    way to learn precisely how confident we are in our results.


    Revisiting the students at the university, we want to know how far off our estimate
    of their mean intelligence score might be. That is, we want to know the range
    of `μ` that solves the following probability:


    ![$$ P\left[-z<\frac{x-\mu }{\sigma }<z\right]=c=1-\alpha $$](images/512351_1_En_5_Chapter/512351_1_En_5_Chapter_TeX_Equs.png)


    By doing some algebraic manipulations of this expression, we can rewrite it to
    become


    ![$$ P\left[\mu - z\sigma <x<\mu + z\sigma \right]=c=1-\alpha $$](images/512351_1_En_5_Chapter/512351_1_En_5_Chapter_TeX_Equt.png)


    Since we can easily find out which `z` values correspond to different confidence
    levels or alpha values and are only interested in the limiting values of `μ` this
    expression, we can further rewrite this equation to


    ![$$ {\mu}_{1,2}=x\pm z\sigma $$](images/512351_1_En_5_Chapter/512351_1_En_5_Chapter_TeX_Equu.png)


    This expression looks tiny, but it is all we need to compute a confidence interval
    for our result. Since our sample mean and the population''s standard deviation
    are constants, the only knob we need to turn is the one for `z`. Let us say that
    we want to know the range in which our sample mean falls with 95% certainty. Because
    this is a two-tailed calculation, we need to take equally much of the uncertainty
    into account on each side, which means that we need to divide the alpha value
    by two. The z-score that corresponds to an alpha value of 0.025 is 1.96. Therefore,
    we get the following:


    ![$$ {\mu}_{1,2}=105\pm 1.96\cdotp \frac{15}{\sqrt{30}}\approx 105\pm 5.37 $$](images/512351_1_En_5_Chapter/512351_1_En_5_Chapter_TeX_Equv.png)


    This result yields a range from 99.63 to 110.37, and we can therefore be 95% sure
    that our students'' true mean intelligence score is somewhere between those numbers.
    This technique is powerful since it gives us a tool to determine where the sample
    mean might end up if we were to perform this test from the start.


    ### A Word on Chi-Squared Tests


    Chi-squared tests are another helpful category of hypothesis tests that can help
    us determine, for example, how well some measured data fits a model. We perform
    these tests with methodologies that are very similar to the ones we have talked
    about in this chapter – we set up null and alternative hypotheses, decide on an
    alpha value, and perform the test. However, to fully understand how and why these
    tests are useful, we need to understand how the chi-squared distribution works,
    which could probably fill another chapter on its own. Nevertheless, feel free
    to take a closer look at these topics as a part of further studies.


    ### Chapter Summary


    This chapter was quite heavy on the theory side. We learned what a hypothesis
    is and how to formulate both null and alternative hypotheses for our tests. We
    learned about the distribution of sample means and got introduced to one of the
    most important theorems in statistics – the Central Limit Theorem. We learned
    how to define confidence levels, alpha values, and compute p-values, and we also
    had a look at how to standardize a test statistic and compute confidence intervals
    for it.


    The next chapter will make a complete U-turn. The theoretical concepts will be
    lighter and intuitive to grasp, and we will focus more on the code part of things.
    It has come time to learn how to shrink information with statistics.


    # 6. Statistical Methods for Data Compression


    Statistical methods are not only applicable in hardcore data science topics. They
    also have applications in what could be considered more traditional computer science,
    such as compression algorithms. While there is active research conducted in compression
    via machine learning, we will explore, derive, and implement a much more medieval,
    rule-based algorithm.


    ### An Introduction to Compression


    The concept of compression is straightforward when looking at it from a high-level
    perspective. We want to transform some arbitrary piece of data so that it takes
    up less space. The less space this data occupies, the more space we will have
    for other data later. We call this transformation for *compression*.


    Not only do we want some algorithm that makes our data smaller in size. We also
    want this process to be reversible in some sense. Once we have found a representation
    that takes up less space, we want to have the option to get back the original
    data. This reversion of the compression stage is called *decompression*.


    As an example, let us analyze a simple compression algorithm. Whenever someone
    hands us a block of data, we always return a single byte with the value `0xFF`.
    When we look at the compression stage, this algorithm is doing amazing things.
    We could hand it Netflix’s entire video library, and it would be able to compress
    it to a single byte. That is impressive! However, things look pretty bleak when
    we move to the decompression stage. The algorithm always returns the same compressed
    representation, no matter the input. If someone handed us that byte and told us
    to decompress it, we would not know whether to turn it into an animated movie,
    a digital restaurant menu, or the Bill of Rights. That is a horrible property!
    To get this right, we need to discuss a few mathematical properties related to
    functions.'
