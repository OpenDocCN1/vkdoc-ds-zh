  trans: '好的，作为高级文档工程师和翻译员，我将遵循您提供的格式和注意事项，将以下英文文本翻译成中文。



    ### 压缩阶段


    让我们先来看一下用于压缩文本的主程序，如清单 6-1 所示。


    ```

    let text = DataLoader.loadText(from: .huffman)

    let coder = HuffmanTextCoder()

    let compressed = try coder.encode(text)

    清单 6-1

    用于压缩示例文本的主程序

    ```


    这个程序相对较小，因为所有的复杂性都隐藏在 `HuffmanTextCoder` 实例内部。我们使用 `DataLoader` 中的另一个加载函数来读取位于代码项目共享资源中的文本文件。然后，我们将加载的文本传递给
    `encode(_:)` 函数，该函数以 `Data` 对象的形式返回一个压缩后的二进制表示。


    要编码一个文本字符串，我们首先需要决定如何细分数据点。分割文本的方法有很多种。我们应该将其分割成句子、单词，还是字母？在本实现中，我们选择按字节处理。因此，霍夫曼树将为用于构造
    UTF-8 编码字符串的所有八位模式构建编码，而压缩数据所需的编码步骤可以总结如下：


    1.  统计文本中每个字节的频率以发现其分布。

    2.  根据步骤 1 中提取的计数构建一棵霍夫曼树。

    3.  创建该树的二进制表示，以便与压缩后的文本一起存储。

    4.  使用步骤 2 中创建的树，为文本创建霍夫曼编码表示。

    5.  将霍夫曼树的二进制版本与压缩后的文本连接成一个单一的二进制对象。


    清单 6-2 展示了 `encode(_:)` 函数，它将上述每一步都委托给了独立的专业化方法。清单 6-3 展示了我们在编码或解码失败时使用的一个枚举。虽然我们在这个方法中没有显式地使用该枚举，但了解子程序在标有
    `try` 关键字的调用中可能抛出的不同错误类型是有益的。


    ```

    enum HuffmanError: Error {

    case emptyInputData

    case treeBuilderFailure

    case textEncodingFailure

    case textDecodingFailure

    }

    清单 6-3

    用于表示压缩或解压缩期间可能抛出的错误的枚举

    ```


    ```

    func encode(_ text: String) throws -> Data {

    let byteFrequencies = countBytes(in: text)

    let root = try createHuffmanTree(

    from: byteFrequencies

    )

    let treeData = createTreeData(from: root)

    var (encodedText, encodingSize) = try encodeText(

    text,

    with: root,

    frequencies: byteFrequencies

    )

    let encodingSizeData = Data(

    bytes: &encodingSize,

    count: MemoryLayout.size

    )

    return encodingSizeData + treeData + encodedText

    }

    清单 6-2

    我们对 HuffmanTextCoder.encode(_:) 的实现

    ```


    如清单 6-2 所示，我们逐步执行了之前列出的每个步骤。然而，代码中有一个我们尚未讨论的变量，即 `encodingSize`。它由将文本编码为霍夫曼编码二进制数据的方法生成，其目的在于让我们知道编码整条消息使用了多少位。


    由于通用计算机中最小的可寻址构建块是字节，这限制了我们只能处理八位的倍数。然而，我们更有可能需要一个非标准大小的位数。例如，我们编码单词“Hello”需要十位，这要求我们分配两个字节。这两个字节包含
    16 位，这意味着我们最终会在编码数据中得到六位未使用的位。现在想象一下，解码这两个字节的数据，却不知道有多少位包含了有效信息。我们能够正确地解码前 10
    位。但是，我们也会解码最后六位，最终得到单词“Hellollllll”。由于这不是我们想要的，我们需要提示解码过程何时停止。我们没有发明一个停止序列，而是简单地将位数附加到编码数据的开头。


    既然我们已经知道了最终的二进制对象是什么样子，那么让我们深入探讨实现这一目标的不同子程序。清单 6-4 展示了 `countBytes(in:)` 方法，它负责计算文本中字节的分布。


    ```

    func countBytes(in text: String) -> [UInt8: Int] {

    var text = text

    return text.withUTF8 { pointer in

    pointer

    .reduce(into: [UInt8: Int]()) { dict, byte in

    dict[byte, default: 0] += 1

    }

    }

    }

    清单 6-4

    countBytes(in:) 的实现，返回文本字符串内字节的分布

    ```


    在上述方法中，发生的第一件事是使 `text` 参数变为可变的。由于我们不打算改变该字符串，所以这不是算法方面的硬性要求。相反，这是 `String` 类型本身强加的要求。因为指向字符串内容的指针允许我们修改其中的任何内容，所以我们不能将其用于不可变对象。


    接下来，我们请求一个指向连续内存块的指针，该内存块保存了文本的字节内容。一旦我们获得了这个指针，我们就可以使用高阶函数来统计每个字节。`reduce(into:_:)`
    方法会遍历存储中的每个字节，并用它来递增一个计数器。当迭代完成时，我们返回一个包含字节及其各自计数器变量的 `Dictionary`。我们使用 `UInt8`
    类型表示字节，因此，如果我们将单词“Hello”输入到 `countBytes(in:)` 中，它将产生类似于 `[111: 1, 108: 2, 101:
    1, 72: 1]` 的结果。在这个特定例子中，字节与单个字母的 ASCII 代码表示完美对应。然而，由于我们处理的是 UTF-8 编码的字符串，情况可能并非总是如此。


    接下来，我们继续查看 `createHuffmanTree(from:)`，它根据我们刚计算出的分布构建一棵霍夫曼树。清单 6-5 展示了我们用于表示树中节点的枚举，而清单
    6-6 展示了该方法的实现。


    ```

    func createHuffmanTree(from freqs: [UInt8: Int])

    throws -> HuffmanNode {

    var nodes = freqs

    .map { key, value -> HuffmanNode in

    .leaf(value: key, count: value)

    }

    .sorted(by: >)

    guard !nodes.isEmpty else {

    throw HuffmanError.emptyInputData

    }

    while

    nodes.count > 1,

    let rhs = nodes.popLast(),

    let lhs = nodes.popLast()

    {

    nodes.append(.node(left: lhs, right: rhs))

    nodes.sort(by: >)

    }

    if let root = nodes.first {

    return root

    } else {

    throw HuffmanError.treeBuilderFailure

    }

    }

