- fmt: "# Bayes’ Theorem\n\nReverend Thomas Bayes was a statistician and Presbyterian\
    \ minister in the 1700s. The theorem that bears his name deals with computing\
    \ the conditional probability `P[E[1]|E[2]]`. The example in Listing [2-3](#512351_1_En_2_Chapter.xhtml#PC3)\
    \ was quite forgiving. We were quickly able to figure out the correct value for\
    \ `P[roll[1] = 4 | roll[1] ∈ {2, 4, 6}]`, which allowed us to perform all of our\
    \ calculations. However, there are many situations where these values are much\
    \ more difficult to find. Let us explore one such situation through a toy example:\n\
    \n> *A weather station measures the temperature and presence of the sun every\
    \ day. Over a year, 40% of the days have temperatures exceeding 20°C, while 50%\
    \ of the days are sunny. 60% of the sunny days have temperatures that go above\
    \ 20°C. If the station shows a 22°C temperature today, what is the probability\
    \ that the sun shines?*\n\nWe want to determine the probability of sunshine, given\
    \ that it is warmer than 20°C outside. In mathematical notation, we are looking\
    \ for the value of:\n\n`P[weather = sunny | temperature > 20]`\n\nA quick inventory\
    \ on the given information tells us that we have access to the following:\n\n\
    - `P[temperature > 20] = 0.4`\n- `P[weather = sunny] = 0.5`\n- `P[temperature\
    \ > 20 | weather = sunny] = 0.6`\n\nAlthough the last expression is very similar\
    \ to what we are interested in, it is not entirely right. However, as we are about\
    \ to see, these three expressions can together provide enough information to compute\
    \ the probability we want.\n\nIn the section on conditional probability, we saw\
    \ that we could express the probability of two events occurring by using the following\
    \ formula:\n\n`P[E[1] ∩ E[2]] = P[E[2] | E[1]] P[E[1]]`\n\nHowever, it does not\
    \ matter which event we condition on. The following “reversed” expression works\
    \ equally well, as we can simply switch which event we condition on:\n\n`P[E[1]\
    \ ∩ E[2]] = P[E[1] | E[2]] P[E[2]]`\n\nThis realization is precisely what Bayes’\
    \ Theorem utilizes. Since we now have two equations with equivalent left-hand\
    \ sides, we can also equate the two right-hand sides by substitution:\n\n`P[E[1]\
    \ | E[2]] P[E[2]] = P[E[2] | E[1]] P[E[1]] ⟺ P[E[1] | E[2]] = (P[E[2] | E[1]]\
    \ P[E[1]]) / P[E[2]]`\n\nWe have just derived Bayes’ Rule, one of the most widely\
    \ used formulas in statistical analysis. Returning to our weather example, we\
    \ now have a way of computing the probability of interest. All we need to do is\
    \ to plug our events into Bayes’ Rule, which gives us the following expression\
    \ (we leave out some boilerplate notation for brevity, as it is still apparent\
    \ which events we talk about):\n\n`P[sunny | temp > 20] = (P[temp > 20 | sunny]\
    \ P[sunny]) / P[temp > 20] = (0.6 * 0.5) / 0.4 = 0.75`\n\nUsing Bayes’ Theorem,\
    \ we compute a 75% chance that the sun shines given that the outdoor temperature\
    \ is 22°C. This information may be more or less valuable to us, depending on whether\
    \ there is a close-by window we can use to look outside. However, the same principles\
    \ apply to many interesting problems, some of which we will see later in this\
    \ book.\n\n## Random Variables\n\nWe have dealt with random variables earlier\
    \ in this book, although we never mentioned it explicitly. For example, `roll[1]`\
    \ and `roll[2]` were both random variables in our die examples. The purpose of\
    \ these is to map the sample space elements to a real-valued number that we can\
    \ use for computations. In the case of a die, we can already represent the number\
    \ of marking of a die face as a real number, so the mapping is simply the identity\
    \ function.\n\nOther literature often denotes random variables using a single\
    \ capital letter, such as `X`, `Y`, and `Z`. To provide a bridging foundation\
    \ for further reading, we will also use this notation. In the die example, the\
    \ probability of rolling a two followed by a four translates to the following\
    \ notation:\n\n`X[1]: The first roll`\n\n`X[2]: The second roll`\n\n`P[X[1] =\
    \ 2 ∩ X[2] = 4] = P[X[1] = 2] P[X[2] = 4] = (1/6) * (1/6) = 1/36`\n\nNote that\
    \ the random variable itself does not provide any information on which outcome\
    \ we will actually observe if we roll the die. Even if we know that each face\
    \ has a one in six chance of showing up, that does not imply that we will see\
    \ each number once if we roll six times. Likewise, we cannot be sure of seeing\
    \ a one even if we throw the die six times. Listing [2-4](#512351_1_En_2_Chapter.xhtml#PC4)\
    \ shows a snippet of code that exemplifies this.\n\n```\nstruct Die {\n    func\
    \ roll() -> Int {\n        return .random(in: 1 ... 6)\n    }\n}\n\nlet die =\
    \ Die()\nfor _ in 1 ... 5 {\n    let rolls = (1 ... 5)\n        .map { _ in String(die.roll())\
    \ }\n        .joined(separator: \", \")\n    print(\"We rolled \\(rolls)\")\n\
    }\n// Prints:\n// We rolled 1, 4, 4, 1, 3\n// We rolled 1, 5, 6, 1, 6\n// We rolled\
    \ 6, 1, 6, 6, 5\n// We rolled 6, 6, 4, 2, 1\n// We rolled 3, 3, 2, 5, 2\nListing\
    \ 2-4\nAn example that even a fair die may not show every possible number in six\
    \ throws\n```\n\n> **Note:** The printed die rolls in Listing [2-4](#512351_1_En_2_Chapter.xhtml#PC4)\
    \ are random. That means there is a very high chance that they will differ each\
    \ time the code is run."
  raw: '### Bayes’ Theorem


    Reverend Thomas Bayes was a statistician and Presbyterian minister in the 1700s.
    The theorem that bears his name deals with computing the conditional probability
    P[E[1]|E[2]]. The example in Listing [2-3](#512351_1_En_2_Chapter.xhtml#PC3) was
    quite forgiving. We were quickly able to figure out the correct value for *P*[*roll*[1] = 4|
