- fmt: '### Multiple Linear Regression


    We now know how to fit a linear equation to a set of data. This approach requires,
    quite naturally, that the samples in the data set show some tendency toward a
    linear relationship. However, most data sets have information about several variables
    associated with a single data point.


    For example, a house sale may not only contain information on the sale price and
    square footage. There might also be information about the number of rooms, the
    operating costs, and the year of construction. These are variables that impact
    the price in one way or another, and it seems reasonable that we should try to
    take them into account. To develop this idea, we will add another dimension to
    the example data. Figure [4-5](#512351_1_En_4_Chapter.xhtml#Fig5) shows a new
    data plot with the two feature variables along the X and Y axis and the target
    variable along the Z axis.


    ![../images/512351_1_En_4_Chapter/512351_1_En_4_Fig5_HTML.jpg](images/512351_1_En_4_Chapter/512351_1_En_4_Fig5_HTML.jpg)


    Figure 4-5: A plot of the expanded example data, which now contains three variables.


    As we can see in the plot, the new dimension is also linearly related to the target
    value. Together, the two feature variables and the target variable form something
    that reminds us of a slanted and uneven plane. Now that we have a visual intuition
    of the data, let us get started on the mathematics.


    ### Deriving Linear Regression with Vectors


    The mathematical notation we used when developing the simple linear regression
    is usually fine for one or two variables. However, we may want to use this technique
    on data with 5, 10, or 50 variables. All of a sudden, the formulas we need to
    derive have become nightmares. We need a new type of notation to keep the coming
    equations nice and compact, so we turn to vectors and matrices. Using vector notation,
    we can denote a sample point and its *d* features as


    ![$$ \boldsymbol{x}=\left[\begin{array}{c}{x}_1\\ {}{x}_2\\ {}\begin{array}{c}\vdots
    \\ {}{x}_d\\ {}1\end{array}\end{array}\right] $$](images/512351_1_En_4_Chapter/512351_1_En_4_Chapter_TeX_Equt.png)


    We append a one to the vector to encompass the intercept, the value that we called
    *m* in the single variable case. If we now encapsulate all coefficients and the
    intercept into a vector **w**, like so


    ![$$ \boldsymbol{w}=\left[\begin{array}{c}{w}_1\\ {}{w}_2\\ {}\begin{array}{c}\vdots
    \\ {}{w}_d\\ {}{w}_{d+1}\end{array}\end{array}\right] $$](images/512351_1_En_4_Chapter/512351_1_En_4_Chapter_TeX_Equu.png)


    the dot product of these vectors will create an expression that looks like


    ![$$ {\boldsymbol{w}}^T\boldsymbol{x}={w}_1{x}_1+{w}_2{x}_2+\dots +{w}_d{x}_d+{w}_{d+1}\cdotp
    1 $$](images/512351_1_En_4_Chapter/512351_1_En_4_Chapter_TeX_Equv.png)


    This equation is precisely the predictor we are after. It is a linear expression
    of every feature variable, plus an intercept variable that we call `w[d+1]` in
    this notation. Like in the simple linear regression case, we want to measure how
    well this formula captures the training data. We can do that by summing over the
    squared difference between the observed target value and the prediction, so we
    can modify the previous loss function to become


    ![$$ \mathcal{L}=\sum_{i=1}^N{\left({y}_i-{\boldsymbol{w}}^T{\boldsymbol{x}}_i\right)}^2=\sum_{i=1}^N\left({y}_i-{\boldsymbol{w}}^T{\boldsymbol{x}}_i\right)\left({y}_i-{\boldsymbol{w}}^T{\boldsymbol{x}}_i\right)
    $$](images/512351_1_En_4_Chapter/512351_1_En_4_Chapter_TeX_Equw.png)


    To further simplify the notation, we can collect all the sample points inside
    a matrix, which we choose to call **X**. By placing all individual feature vectors
    as rows in that matrix, we can compute all predictions at once using matrix-vector
    multiplication. Since that, in turn, produces a vector, we must also stack the
    target values into a vector format. We call this vector **Y**. The rewritten loss
    function comes out to


    ![$$ \mathcal{L}={\left(\boldsymbol{Y}-\boldsymbol{Xw}\right)}^T\left(\boldsymbol{Y}-\boldsymbol{Xw}\right)={\boldsymbol{Y}}^T\boldsymbol{Y}-2{\boldsymbol{Y}}^T\boldsymbol{Xw}-{\boldsymbol{w}}^T{\boldsymbol{X}}^T\boldsymbol{Xw}
    $$](images/512351_1_En_4_Chapter/512351_1_En_4_Chapter_TeX_Equx.png)


    Note that this expression produces a scalar value with the same meaning as in
    the simple case – it measures the distance between our predictions and the observed
    values and squares them.


    We can try to optimize this expression by performing the same trick as before,
    the only difference being that we are now computing a gradient. A gradient is
    a vector of partial derivatives, which conceptually looks like the following:


    ![$$ \frac{\partial \mathcal{L}}{\partial \boldsymbol{w}}=\left[\begin{array}{c}\frac{\partial
    \mathcal{L}}{\partial {w}_1}\\ {}\frac{\partial \mathcal{L}}{\partial {w}_2}\\
    {}\begin{array}{c}\vdots \\ {}\frac{\partial \mathcal{L}}{\partial {w}_d}\\ {}\frac{\partial
    \mathcal{L}}{\partial {w}_{d+1}}\end{array}\end{array}\right] $$](images/512351_1_En_4_Chapter/512351_1_En_4_Chapter_TeX_Equy.png)


    Calculating the gradient of ℒ with respect to the vector **w**, we get


    ![$$ \frac{\partial \mathcal{L}}{\partial \boldsymbol{w}}=\frac{\partial }{\partial
    \boldsymbol{w}}{\boldsymbol{Y}}^T\boldsymbol{Y}-2{\boldsymbol{Y}}^T\boldsymbol{Xw}-{\boldsymbol{w}}^T{\boldsymbol{X}}^T\boldsymbol{Xw}=2{\boldsymbol{X}}^T\boldsymbol{Xw}-2{\boldsymbol{X}}^T\boldsymbol{Y}
    $$](images/512351_1_En_4_Chapter/512351_1_En_4_Chapter_TeX_Equz.png)


    By setting the gradient equal to the zero vector, we arrive at the following expression:


    ![$$ \frac{\partial \mathcal{L}}{\partial \boldsymbol{w}}=\mathbf{0} $$](images/512351_1_En_4_Chapter/512351_1_En_4_Chapter_TeX_Equaa.png)


    ![$$ 2{\boldsymbol{X}}^T\boldsymbol{Xw}-2{\boldsymbol{X}}^T\boldsymbol{Y}=\mathbf{0}
    $$](images/512351_1_En_4_Chapter/512351_1_En_4_Chapter_TeX_Equab.png)


    ![$$ {\boldsymbol{X}}^T\boldsymbol{Xw}={\boldsymbol{X}}^T\boldsymbol{Y} $$](images/512351_1_En_4_Chapter/512351_1_En_4_Chapter_TeX_Equac.png)


    To find an optimal solution, we need to realize that **X** is an *n*-by-(*d*+1)
    matrix. That implies that **X**^T is a (*d*+1)-by-*n* matrix. Such a multiplication
    produces a square matrix with size (*d*+1)-by-(*d*+1).


    The *Invertible Matrix Theorem* gives us several conditions for when a square
    matrix is invertible. One of them, which we will use for our implementation, is
    that the eigenvalues of our matrix must not include zero. Consequently, if we
    have a way of telling whether the matrix **X**^T**X** only has nonzero eigenvalues,
    we can perform the following trick by left-multiplying the inverse:


    ![$$ {\left({\boldsymbol{X}}^T\boldsymbol{X}\right)}^{-1}{\boldsymbol{X}}^T\boldsymbol{X}\boldsymbol{w}={\left({\boldsymbol{X}}^T\boldsymbol{X}\right)}^{-1}{\boldsymbol{X}}^T\boldsymbol{Y}
    $$](images/512351_1_En_4_Chapter/512351_1_En_4_Chapter_TeX_Equad.png)


    ![$$ \boldsymbol{w}={\left({\boldsymbol{X}}^T\boldsymbol{X}\right)}^{-1}{\boldsymbol{X}}^T\boldsymbol{Y}
    $$](images/512351_1_En_4_Chapter/512351_1_En_4_Chapter_TeX_Equae.png)


    This equation gives us an analytical solution to our optimization problem and
    provides the **w** vector that best fits our data.


    **Note:** Linear regression can also be implemented using the more general Moore-Penrose
    inverse, which is defined and unique for all matrices with real or complex elements.
    We will not cover it further in this implementation, but it is an interesting
    topic and implementation project for those that want to learn more.'
  raw: '### Multiple Linear Regression


    We now know how to fit a linear equation to a set of data. This approach requires
    , quite naturally, that the samples in the data set show some tendency toward
    a linear relationship. However, most data sets have information about several
    variables associated with a single data point.


    For example, a house sale may not only contain information on the sale price and
    square footage . There might also be information about the number of rooms, the
    operating costs, and the year of construction. These are variables that impact
    the price in one way or another, and it seems reasonable that we should try to
    take them into account. To develop this idea, we will add another dimension to
    the example data. Figure [4-5](#512351_1_En_4_Chapter.xhtml#Fig5) shows a new
    data plot with the two feature variables along the X and Y axis and the target
    variable along the Z axis.


    ![../images/512351_1_En_4_Chapter/512351_1_En_4_Fig5_HTML.jpg](images/512351_1_En_4_Chapter/512351_1_En_4_Fig5_HTML.jpg)


    Figure 4-5


    A plot of the expanded example data, which now contains three variables


    As we can see in the plot, the new dimension is also linearly related to the target
    value. Together, the two feature variables and the target variable form something
    that reminds us of a slanted and uneven plane. Now that we have a visual intuition
    of the data, let us get started on the mathematics.


    ### Deriving Linear Regression with Vectors


    The mathematical notation we used when developing the simple linear regression
    is usually fine for one or two variables. However, we may want to use this technique
    on data with 5, 10, or 50 variables. All of a sudden, the formulas we need to
    derive have become nightmares. We need a new type of notation to keep the coming
    equations nice and compact, so we turn to vectors and matrices. Using vector notation,
    we can denote a sample point and its *d* features as


    ![$$ \boldsymbol{x}=\left[\begin{array}{c}{x}_1\\ {}{x}_2\\ {}\begin{array}{c}\vdots
    \\ {}{x}_d\\ {}1\end{array}\end{array}\right] $$](images/512351_1_En_4_Chapter/512351_1_En_4_Chapter_TeX_Equt.png)


    We append a one to the vector to encompass the intercept, the value that we called
    *m* in the single variable case. If we now encapsulate all coefficients and the
    intercept into a vector **w**, like so


    ![$$ \boldsymbol{w}=\left[\begin{array}{c}{w}_1\\ {}{w}_2\\ {}\begin{array}{c}\vdots
    \\ {}{w}_d\\ {}{w}_{d+1}\end{array}\end{array}\right] $$](images/512351_1_En_4_Chapter/512351_1_En_4_Chapter_TeX_Equu.png)


    the dot product of these vectors will create an expression that looks like


    ![$$ {\boldsymbol{w}}^T\boldsymbol{x}={w}_1{x}_1+{w}_2{x}_2+\dots +{w}_d{x}_d+{w}_{d+1}\cdotp
    1 $$](images/512351_1_En_4_Chapter/512351_1_En_4_Chapter_TeX_Equv.png)


    This equation is precisely the predictor we are after. It is a linear expression
    of every feature variable, plus an intercept variable that we call w[d+1] in this
    notation. Like in the simple linear regression case, we want to measure how well
    this formula captures the training data. We can do that by summing over the squared
    difference between the observed target value and the prediction, so we can modify
    the previous loss function to become


    ![$$ \mathcal{L}=\sum_{i=1}^N{\left({y}_i-{\boldsymbol{w}}^T{\boldsymbol{x}}_i\right)}^2=\sum_{i=1}^N\left({y}_i-{\boldsymbol{w}}^T{\boldsymbol{x}}_i\right)\left({y}_i-{\boldsymbol{w}}^T{\boldsymbol{x}}_i\right)
    $$](images/512351_1_En_4_Chapter/512351_1_En_4_Chapter_TeX_Equw.png)


    To further simplify the notation, we can collect all the sample points inside
    a matrix, which we choose to call **X**. By placing all individual feature vectors
    as rows in that matrix, we can compute all predictions at once using matrix-vector
    multiplication. Since that, in turn, produces a vector, we must also stack the
    target values into a vector format. We call this vector **Y**. The rewritten loss
    function comes out to


    ![$$ \mathcal{L}={\left(\boldsymbol{Y}-\boldsymbol{Xw}\right)}^T\left(\boldsymbol{Y}-\boldsymbol{Xw}\right)={\boldsymbol{Y}}^T\boldsymbol{Y}-2{\boldsymbol{Y}}^T\boldsymbol{Xw}-{\boldsymbol{w}}^T{\boldsymbol{X}}^T\boldsymbol{Xw}
    $$](images/512351_1_En_4_Chapter/512351_1_En_4_Chapter_TeX_Equx.png)


    Note that this expression produces a scalar value with the same meaning as in
    the simple case – it measures the distance between our predictions and the observed
    values and squares them.


    We can try to optimize this expression by performing the same trick as before,
    the only difference being that we are now computing a gradient. A gradient is
    a vector of partial derivatives, which conceptually looks like the following:


    ![$$ \frac{\partial \mathcal{L}}{\partial \boldsymbol{w}}=\left[\begin{array}{c}\frac{\partial
    \mathcal{L}}{\partial {w}_1}\\ {}\frac{\partial \mathcal{L}}{\partial {w}_2}\\
    {}\begin{array}{c}\vdots \\ {}\frac{\partial \mathcal{L}}{\partial {w}_d}\\ {}\frac{\partial
    \mathcal{L}}{\partial {w}_{d+1}}\end{array}\end{array}\right] $$](images/512351_1_En_4_Chapter/512351_1_En_4_Chapter_TeX_Equy.png)


    Calculating the gradient of ℒ with respect to the vector w, we get


    ![$$ \frac{\partial \mathcal{L}}{\partial \boldsymbol{w}}=\frac{\partial }{\partial
    \boldsymbol{w}}{\boldsymbol{Y}}^T\boldsymbol{Y}-2{\boldsymbol{Y}}^T\boldsymbol{Xw}-{\boldsymbol{w}}^T{\boldsymbol{X}}^T\boldsymbol{Xw}=2{\boldsymbol{X}}^T\boldsymbol{Xw}-2{\boldsymbol{X}}^T\boldsymbol{Y}
    $$](images/512351_1_En_4_Chapter/512351_1_En_4_Chapter_TeX_Equz.png)


    By setting the gradient equal to the zero vector, we arrive at the following expression:


    ![$$ \frac{\partial \mathcal{L}}{\partial \boldsymbol{w}}=\mathbf{0} $$](images/512351_1_En_4_Chapter/512351_1_En_4_Chapter_TeX_Equaa.png)


    ![$$ 2{\boldsymbol{X}}^T\boldsymbol{Xw}-2{\boldsymbol{X}}^T\boldsymbol{Y}=\mathbf{0}
    $$](images/512351_1_En_4_Chapter/512351_1_En_4_Chapter_TeX_Equab.png)


    ![$$ {\boldsymbol{X}}^T\boldsymbol{Xw}={\boldsymbol{X}}^T\boldsymbol{Y} $$](images/512351_1_En_4_Chapter/512351_1_En_4_Chapter_TeX_Equac.png)


    To find an optimal solution, we need to realize that **X** is an n-by-(d+1) matrix.
    That implies that **X** ^T is a (d+1)-by-n matrix. Such a multiplication produces
    a square matrix with size (d+1)-by-(d+1).


    The *Invertible Matrix Theorem* gives us several conditions for when a square
    matrix is invertible. One of them, which we will use for our implementation, is
    that the eigenvalues of our matrix must not include zero. Consequently, if we
    have a way of telling whether the matrix **X** ^T**X** only has nonzero eigenvalues,
    we can perform the following trick by left-multiplying the inverse:


    ![$$ {\left({\boldsymbol{X}}^T\boldsymbol{X}\right)}^{-1}{\boldsymbol{X}}^T\boldsymbol{X}\boldsymbol{w}={\left({\boldsymbol{X}}^T\boldsymbol{X}\right)}^{-1}{\boldsymbol{X}}^T\boldsymbol{Y}
    $$](images/512351_1_En_4_Chapter/512351_1_En_4_Chapter_TeX_Equad.png)


    ![$$ \boldsymbol{w}={\left({\boldsymbol{X}}^T\boldsymbol{X}\right)}^{-1}{\boldsymbol{X}}^T\boldsymbol{Y}
    $$](images/512351_1_En_4_Chapter/512351_1_En_4_Chapter_TeX_Equae.png)


    This equation gives us an analytical solution to our optimization problem and
    provides the **w** vector that best fits our data.


    Note


    Linear regression can also be implemented using the more general Moore-Penrose
    inverse, which is defined and unique for all matrices with real or complex elements.
    We will not cover it further in this implementation, but it is an interesting
    topic and implementation project for those that want to learn more.'
  trans: '

    ### 多元线性回归


    我们现在已经知道如何将线性方程拟合到一组数据上。这自然要求数据集中的样本展现出某种线性关系的趋势。然而，大多数数据集都包含与单个数据点相关的多个变量的信息。


    例如，一套房屋的销售不仅包含售价和面积的信息，还可能包含房间数量、运营成本和建造年份等信息。这些变量都以某种方式影响着价格，因此我们理应尝试将它们纳入考量。为了阐述这一思路，我们给示例数据增加一个维度。图
    4-5 展示了一个新的数据图，其中两个特征变量分别位于 X 轴和 Y 轴，目标变量位于 Z 轴。


    ![../images/512351_1_En_4_Chapter/512351_1_En_4_Fig5_HTML.jpg](img/512351_1_En_4_Fig5_HTML.jpg)


    图 4-5：扩展后的示例数据图，现在包含三个变量。


    如图所示，新的维度也与目标值呈线性关系。这两个特征变量与目标变量共同构成了一个类似倾斜不平的平面。在对数据有了直观理解之后，让我们开始进行数学推导。


    ### 用向量推导线性回归


    在推导简单线性回归时使用的数学符号，对于一两个变量通常没问题。然而，我们可能希望将此技术用于包含 5 个、10 个甚至 50 个变量的数据上。这样一来，我们需要推导的公式会变得极其复杂。我们需要一种新的符号表示法，以使后续的公式简洁紧凑，因此我们将使用向量和矩阵。使用向量符号，我们可以将一个样本点及其
    *d* 个特征表示为


    ![$$ \boldsymbol{x}=\left[\begin{array}{c}{x}_1\\ {}{x}_2\\ {}\begin{array}{c}\vdots
    \\ {}{x}_d\\ {}1\end{array}\end{array}\right] $$](images/512351_1_En_4_Chapter/512351_1_En_4_Chapter_TeX_Equt.png)


    我们在向量末尾添加一个 1，以包含截距项，即在单变量情况下我们称之为 *m* 的值。如果现在将所有系数和截距项封装到一个向量 **w** 中，如下所示


    ![$$ \boldsymbol{w}=\left[\begin{array}{c}{w}_1\\ {}{w}_2\\ {}\begin{array}{c}\vdots
    \\ {}{w}_d\\ {}{w}_{d+1}\end{array}\end{array}\right] $$](images/512351_1_En_4_Chapter/512351_1_En_4_Chapter_TeX_Equu.png)


    那么这些向量的点积将产生如下表达式


    ![$$ {\boldsymbol{w}}^T\boldsymbol{x}={w}_1{x}_1+{w}_2{x}_2+\dots +{w}_d{x}_d+{w}_{d+1}\cdotp
    1 $$](img/512351_1_En_4_Chapter_TeX_Equv.png)


    这个方程正是我们所需的预测器。它是每个特征变量的线性表达式，加上一个截距变量，在此符号中我们称之为`w[d+1]`。与简单线性回归情况类似，我们希望衡量这个公式对训练数据的拟合效果。我们可以通过计算观测目标值与预测值之间差值的平方和来实现，因此可以修改之前的损失函数为


    ![$$ \mathcal{L}=\sum_{i=1}^N{\left({y}_i-{\boldsymbol{w}}^T{\boldsymbol{x}}_i\right)}²=\sum_{i=1}^N\left({y}_i-{\boldsymbol{w}}^T{\boldsymbol{x}}_i\right)\left({y}_i-{\boldsymbol{w}}^T{\boldsymbol{x}}_i\right)
    $$](img/512351_1_En_4_Chapter_TeX_Equw.png)


    为了进一步简化符号，我们可以将所有样本点收集到一个矩阵中，我们将其称为 **X**。通过将每个单独的特征向量作为行放入该矩阵，我们可以使用矩阵-向量乘法一次性计算出所有预测值。由于这会产生一个向量，因此我们也必须将目标值堆叠成向量格式。我们将此向量称为
    **Y**。重写后的损失函数为


    ![$$ \mathcal{L}={\left(\boldsymbol{Y}-\boldsymbol{Xw}\right)}^T\left(\boldsymbol{Y}-\boldsymbol{Xw}\right)={\boldsymbol{Y}}^T\boldsymbol{Y}-2{\boldsymbol{Y}}^T\boldsymbol{Xw}-{\boldsymbol{w}}^T{\boldsymbol{X}}^T\boldsymbol{Xw}
    $$](img/512351_1_En_4_Chapter_TeX_Equx.png)


    注意，该表达式产生一个标量值，其含义与简单情况相同——它衡量了我们的预测值与观测值之间的距离，并对其求平方。


    我们可以尝试通过使用与之前相同的技巧来优化该表达式，唯一的区别在于现在我们要计算梯度。梯度是一个由偏导数组成的向量，其概念形式如下：


    ![$$ \frac{\partial \mathcal{L}}{\partial \boldsymbol{w}}=\left[\begin{array}{c}\frac{\partial
    \mathcal{L}}{\partial {w}_1}\\ {}\frac{\partial \mathcal{L}}{\partial {w}_2}\\
    {}\begin{array}{c}\vdots \\ {}\frac{\partial \mathcal{L}}{\partial {w}_d}\\ {}\frac{\partial
    \mathcal{L}}{\partial {w}_{d+1}}\end{array}\end{array}\right] $$](images/512351_1_En_4_Chapter/512351_1_En_4_Chapter_TeX_Equy.png)


    计算 ℒ 关于向量 **w** 的梯度，我们得到


    ![$$ \frac{\partial \mathcal{L}}{\partial \boldsymbol{w}}=\frac{\partial }{\partial
    \boldsymbol{w}}{\boldsymbol{Y}}^T\boldsymbol{Y}-2{\boldsymbol{Y}}^T\boldsymbol{Xw}-{\boldsymbol{w}}^T{\boldsymbol{X}}^T\boldsymbol{Xw}=2{\boldsymbol{X}}^T\boldsymbol{Xw}-2{\boldsymbol{X}}^T\boldsymbol{Y}
    $$](img/512351_1_En_4_Chapter_TeX_Equz.png)


    通过将梯度设置为零向量，我们得到以下表达式：


    ![$$ \frac{\partial \mathcal{L}}{\partial \boldsymbol{w}}=\mathbf{0} $$](img/512351_1_En_4_Chapter_TeX_Equaa.png)


    ![$$ 2{\boldsymbol{X}}^T\boldsymbol{Xw}-2{\boldsymbol{X}}^T\boldsymbol{Y}=\mathbf{0}
    $$](img/512351_1_En_4_Chapter_TeX_Equab.png)


    ![$$ {\boldsymbol{X}}^T\boldsymbol{Xw}={\boldsymbol{X}}^T\boldsymbol{Y} $$](img/512351_1_En_4_Chapter_TeX_Equac.png)


    为了找到最优解，我们需要认识到 **X** 是一个 *n*×(*d*+1) 的矩阵。这意味着 **X**^T 是一个 (*d*+1)×*n* 的矩阵。这样的乘法会生成一个大小为
    (*d*+1)×(*d*+1) 的方阵。


    *可逆矩阵定理*给出了方阵可逆的若干条件。我们将在实现中使用的一个条件是：矩阵的特征值不能包含零。因此，如果我们有方法判断矩阵 **X**^T**X** 是否仅有非零特征值，我们就可以通过左乘逆矩阵来执行如下技巧：


    ![$$ {\left({\boldsymbol{X}}^T\boldsymbol{X}\right)}^{-1}{\boldsymbol{X}}^T\boldsymbol{X}\boldsymbol{w}={\left({\boldsymbol{X}}^T\boldsymbol{X}\right)}^{-1}{\boldsymbol{X}}^T\boldsymbol{Y}
    $$](img/512351_1_En_4_Chapter_TeX_Equad.png)


    ![$$ \boldsymbol{w}={\left({\boldsymbol{X}}^T\boldsymbol{X}\right)}^{-1}{\boldsymbol{X}}^T\boldsymbol{Y}
    $$](img/512351_1_En_4_Chapter_TeX_Equae.png)


    这个方程为我们优化问题提供了一个解析解，并给出了最能拟合数据的 **w** 向量。


    **注意：** 线性回归也可以使用更通用的 Moore-Penrose 逆来实现，该逆矩阵对于所有元素为实数或复数的矩阵都是唯一且定义的。我们在此实现中不会进一步涉及，但对于想了解更多的人来说，这是一个有趣的话题和实现项目。

