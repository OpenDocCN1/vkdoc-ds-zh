  trans: '

    ### 欧几里得平方距离


    **欧几里得距离**，也称为**毕达哥拉斯距离**，表示两点之间直线路径的长度。通过将每个电影评分向量想象成一个点，我们可以使用该公式计算这些点之间的距离，从而最终衡量两个用户的相似度。两个列向量
    `A` 和 `B` 的欧几里得距离定义如下：


    ![$$ EucDist\left(\boldsymbol{A},\boldsymbol{B}\right)=\sqrt{{\left(\boldsymbol{A}-\boldsymbol{B}\right)}^T\left(\boldsymbol{A}-\boldsymbol{B}\right)}
    $$](img/512351_1_En_7_Chapter_TeX_Equf.png)


    通过此公式计算示例用户的相似度，我们得到以下结果：


    ![$$ \mathrm{EucDist}\left(\mathbf{Tyler},\mathbf{Sarah}\right)=\sqrt{\left(5-5\right)\left(5-5\right)+\left(5-5\right)\left(5-5\right)}=0
    $$](img/512351_1_En_7_Chapter_TeX_Equg.png)


    ![$$ \mathrm{EucDist}\left(\mathbf{Tyler},\mathbf{Mike}\right)=\sqrt{\left(5-5\right)\left(5-5\right)+\left(5-1\right)\left(5-1\right)}=4
    $$](img/512351_1_En_7_Chapter_TeX_Equh.png)


    ![$$ \mathrm{EucDist}\left(\mathbf{Tyler},\mathbf{Jane}\right)=\sqrt{\left(5-1\right)\left(5-1\right)+\left(5-1\right)\left(5-1\right)}=4\sqrt{2}
    $$](img/512351_1_En_7_Chapter_TeX_Equi.png)


    这些结果看起来比之前的相似度度量好多了。该公式与余弦相似度的另一个不同之处在于，两个向量差异越大，它产生的数值就越大。这本身并不是问题；只是我们在设计算法时需要注意的一点。


    **欧几里得平方距离**是一种计算上简化的度量方式。它与欧几里得距离的唯一区别在于，它省去了最后的平方根计算，因此变为：


    ![$$ EucDis{t}²\left(\boldsymbol{A},\boldsymbol{B}\right)={\left(\boldsymbol{A}-\boldsymbol{B}\right)}^T\left(\boldsymbol{A}-\boldsymbol{B}\right)
    $$](img/512351_1_En_7_Chapter_TeX_Equj.png)


    需要注意的一点是，这种简化之所以成立，完全是因为它保持了元素的相对顺序。假设我们有两个数字——`x` 和 `y`。那么以下关系成立：


    ![$$ \sqrt{x}\le \sqrt{y}\Longrightarrow x&lt;y,\kern0.5em \forall x,y\ge 0 $$](img/512351_1_En_7_Chapter_TeX_Equk.png)


    对于计算机来说，计算平方根是一项成本较高的操作。如果能省去，我们当然会这样做！由于省去平方根不会改变两个数的相对顺序，因此我们可以通过跳过这一步来节省一些计算资源。


    让我们快速计算一下示例用户之间的相似度，来验证这个新的计算方法：


    ![$$ {\mathrm{EucDist}}²\left(\mathbf{Tyler},\mathbf{Sarah}\right)=\left(5-5\right)\left(5-5\right)+\left(5-5\right)\left(5-5\right)=0
    $$](img/512351_1_En_7_Chapter_TeX_Equl.png)


    ![$$ {\mathrm{EucDist}}²\left(\mathbf{Tyler},\mathbf{Mike}\right)=\left(5-5\right)\left(5-5\right)+\left(5-1\right)\left(5-1\right)=16
    $$](img/512351_1_En_7_Chapter_TeX_Equm.png)


    ![$$ {\mathrm{EucDist}}²\left(\mathbf{Tyler},\mathbf{Jane}\right)=\left(5-1\right)\left(5-1\right)+\left(5-1\right)\left(5-1\right)=32
    $$](img/512351_1_En_7_Chapter_TeX_Equn.png)


    结果看起来不错。泰勒(Tyler)与莎拉(Sarah)最相似，与简(Jane)最不相似。然而，我们还需要处理一种边缘情况。


    我们的服务在数据库中拥有大量的电影收藏。并非所有用户都看过所有电影，更不用说给它们全部评分了。当某些评分缺失时，我们需要决定如何处理这些计算。


    由于数据中的评分 0 代表缺失评分，从数值角度看，并无阻碍我们像这样计算欧几里得平方距离的障碍。不过，我们很可能会遇到一些不一致的情况。


    -   如果我们比较两个还没有机会评任何分的新用户，数据会将他们所有可能的评分都显示为零。我们的计算会将其解读为这两个用户非常相似，尽管我们根本不知道这是否属实。

    -   想象一下，我们将一个没有任何评分的新用户与两个老用户进行比较。假设其中一个老用户给所有电影都打了 1 分，而另一个则都打了 5 分。我们的算法会认为新用户与那个给所有电影打
    1 分的用户更相似，因为两者之间的欧几里得平方距离更短。然而，我们并不知道哪个用户与新用户更相似。


    我们在此实现中选择的解决方案是将缺失评分视为不确定性。如果一个或两个用户都没有对某部电影进行评分，我们将其中一个评分计为 0，另一个计为 5。这样，缺失评分会增大距离度量值，使得用户之间的相似度略微降低。


    现在我们已经知道如何判断哪些用户相似，是时候处理下一个任务了。我们需要以某种方式推荐用户可能会喜欢的电影。


    ## 期望评分


    在进入本节之前，让我们花一点时间回顾一下评分数据的结构。我们服务的用户关联着以下信息：


    -   唯一的用户 ID。

    -   对所有可用电影的评分集合。

    -   评分是介于 1 到 5 之间的整数值。如果用户尚未对某部特定电影进行评分，则其默认评分为 0。


    要计算某部电影的期望评分，我们可以使用在第 [3](https://wiki.example.org/512351_1_En_3_Chapter.xhtml)
    章学到的公式：


    ![$$ \mathbbm{E}\left[R\right]=\sum \limits_{r\in R}r\cdotp p(r) $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equo.png)


    虽然这个公式在技术上正确，但我们不能简单地按原样实现它。我们组织数据的方式迫使我们稍作扩展，以便进行合理的计算。让我们从一个改动开始，这个改动不会直接影响数学表述，而是影响每个评分概率的计算方法。

    '
- fmt: '### Laplace Smoothing


    Let us look at the distribution of all ratings for the movie *Big Fish*, shown
    in Figure [7-2](#512351_1_En_7_Chapter.xhtml#Fig2). This distribution comes from
    the ratings of all 800 users available in our data set.


    ![../images/512351_1_En_7_Chapter/512351_1_En_7_Fig2_HTML.png](images/512351_1_En_7_Chapter/512351_1_En_7_Fig2_HTML.png)


    *Figure 7-2 The distribution of all ratings for the movie Big Fish*


    As we can see, most of the users did not yet rate this movie. To be precise, 98.6%
    of all users have yet to provide a rating for *Big Fish*. This observation is
    important because it will prove helpful at a later step. However, for now, let
    us focus on the users that did rate the movie. Figure [7-3](#512351_1_En_7_Chapter.xhtml#Fig3)
    shows the bars associated with the users that did provide a rating.


    ![../images/512351_1_En_7_Chapter/512351_1_En_7_Fig3_HTML.png](images/512351_1_En_7_Chapter/512351_1_En_7_Fig3_HTML.png)


    *Figure 7-3 The distribution of ratings for Big Fish, without the unrated marker
    category*


    This chart makes it much easier to see what is going on. Most of our users seem
    to have gone somewhere in the middle. Not one single user has rated the movie
    a one or a five. If we were to run these probabilities through our algorithm,
    we would essentially tell it that there is a 0% probability that a user would
    ever rank it anything but two, three, or four. It is reasonable to believe that
    someone could provide a rating of one and that we just have not found that user
    yet. We need to design our algorithm so that there is always a nonzero probability
    for all ratings. Enter Laplace smoothing.


    The idea of Laplace smoothing is to skew the distribution a little bit toward
    the uniform distribution. It does so by adding a *pseudocount*, which is why we
    sometimes refer to the method as *Additive Smoothing*. Adding a pseudocount to
    each sample point ensures that all of them end up with a nonzero probability.
    Let us look at an example to make the concept more understandable.


    Imagine that we roll a die ten times and that Table [7-3](#512351_1_En_7_Chapter.xhtml#Tab3)
    shows the number of times we land on a specific number.


    *Table 7-3 Counting the outcomes of ten die rolls*


    | Outcome | Count |

    | --- | --- |

    | 1 | 2 |

    | 2 | 3 |

    | 3 | 2 |

    | 4 | 0 |

    | 5 | 2 |

    | 6 | 1 |


    It looks like we got plenty of twos in this round but did not get a single four.
    If we were to approximate the probabilities of each outcome, we would end up with
    the following results:


    ![$$ P\left[X=1\right]=\frac{2}{10}=0.2 $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equp.png)

    ![$$ P\left[X=2\right]=\frac{3}{10}=0.3 $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equq.png)

    ![$$ P\left[X=3\right]=\frac{2}{10}=0.2 $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equr.png)

    ![$$ P\left[X=4\right]=\frac{0}{10}=0.0 $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equs.png)

    ![$$ P\left[X=5\right]=\frac{2}{10}=0.2 $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equt.png)

    ![$$ P\left[X=6\right]=\frac{1}{10}=0.1 $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equu.png)


    In earlier chapters, we computed the true probability of any face on a fair die
    to be approximately 16.66%, so some of these results are way off. Our approximations
    suggest 30% of getting a two, while there is no way we will ever roll a four.
    In the case of a die roll, we could easily repeat the experiment more times and
    gather more information. However, in the case of movie reviews, that is not as
    simple. Since we have 2000 movies and only 800 users, there is a significant chance
    that one or more ratings will have a zero count on most movies. We say that the
    data is *sparse*.


    To mitigate this issue, imagine adding a pseudocount of 1 to each outcome in Table
    [7-3](#512351_1_En_7_Chapter.xhtml#Tab3). We now have a total of 16 data points,
    which yields the following new probabilities:


    ![$$ P\left[X=1\right]=\frac{3}{16}=0.1875 $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equv.png)

    ![$$ P\left[X=2\right]=\frac{4}{16}=0.25 $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equw.png)

    ![$$ P\left[X=3\right]=\frac{3}{16}=0.1875 $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equx.png)

    ![$$ P\left[X=4\right]=\frac{1}{16}=0.0625 $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equy.png)

    ![$$ P\left[X=5\right]=\frac{3}{16}=0.1875 $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equz.png)

    ![$$ P\left[X=6\right]=\frac{2}{16}=0.125 $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equaa.png)


    With the pseudocount, we no longer think that rolling a four is an impossibility.
    In fact, if we were to add an infinite pseudocount to the outcomes in Table [7-3](#512351_1_En_7_Chapter.xhtml#Tab3),
    our results would tend toward the true distribution. However, most distributions
    are not uniform. That means we cannot add a massive number to each movie rating
    and expect good things to happen. We will settle for a pseudocount of one. That
    is enough to eradicate zero probabilities while not skewing the original distribution
    too much.'
  raw: '### Laplace Smoothing


    Let us look at the distribution of all ratings for the movie *Big Fish*, shown
    in Figure [7-2](#512351_1_En_7_Chapter.xhtml#Fig2). This distribution comes from
    the ratings of all 800 users available in our data set.


    ![../images/512351_1_En_7_Chapter/512351_1_En_7_Fig2_HTML.png](images/512351_1_En_7_Chapter/512351_1_En_7_Fig2_HTML.png)


    Figure 7-2


    The distribution of all ratings for the movie Big Fish


    As we can see, most of the users did not yet rate this movie. To be precise, 98.6%
    of all users have yet to provide a rating for *Big Fish*. This observation is
    important because it will prove helpful at a later step. However, for now, let
    us focus on the users that did rate the movie. Figure [7-3](#512351_1_En_7_Chapter.xhtml#Fig3)
    shows the bars associated with the users that did provide a rating.


    ![../images/512351_1_En_7_Chapter/512351_1_En_7_Fig3_HTML.png](images/512351_1_En_7_Chapter/512351_1_En_7_Fig3_HTML.png)


    Figure 7-3


    The distribution of ratings for Big Fish, without the unrated marker category


    This chart makes it much easier to see what is going on. Most of our users seem
    to have gone somewhere in the middle. Not one single user has rated the movie
    a one or a five. If we were to run these probabilities through our algorithm,
    we would essentially tell it that there is a 0% probability that a user would
    ever rank it anything but two, three, or four. It is reasonable to believe that
    someone could provide a rating of one and that we just have not found that user
    yet. We need to design our algorithm so that there is always a nonzero probability
    for all ratings. Enter Laplace smoothing.


    The idea of Laplace smoothing is to skew the distribution a little bit toward
    the uniform distribution. It does so by adding a *pseudocount*, which is why we
    sometimes refer to the method as *Additive Smoothing*. Adding a pseudocount to
    each sample point ensures that all of them end up with a nonzero probability.
    Let us look at an example to make the concept more understandable.


    Imagine that we roll a die ten times and that Table [7-3](#512351_1_En_7_Chapter.xhtml#Tab3)
    shows the number of times we land on a specific number.


    Table 7-3


    Counting the outcomes of ten die rolls


    | Outcome | Count |

    | --- | --- |

    | 1 | 2 |

    | 2 | 3 |

    | 3 | 2 |

    | 4 | 0 |

    | 5 | 2 |

    | 6 | 1 |


    It looks like we got plenty of twos in this round but did not get a single four.
    If we were to approximate the probabilities of each outcome, we would end up with
    the following results:


    ![$$ P\left[X=1\right]=\frac{2}{10}=0.2 $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equp.png)


    ![$$ P\left[X=2\right]=\frac{3}{10}=0.3 $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equq.png)


    ![$$ P\left[X=3\right]=\frac{2}{10}=0.2 $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equr.png)


    ![$$ P\left[X=4\right]=\frac{0}{10}=0.0 $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equs.png)


    ![$$ P\left[X=5\right]=\frac{2}{10}=0.2 $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equt.png)


    ![$$ P\left[X=6\right]=\frac{1}{10}=0.1 $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equu.png)


    In earlier chapters, we computed the true probability of any face on a fair die
    to be approximately 16.66%, so some of these results are way off. Our approximations
    suggest 30% of getting a two, while there is no way we will ever roll a four.
    In the case of a die roll, we could easily repeat the experiment more times and
    gather more information. However, in the case of movie reviews, that is not as
    simple. Since we have 2000 movies and only 800 users, there is a significant chance
    that one or more ratings will have a zero count on most movies. We say that the
    data is *sparse*.


    To mitigate this issue, imagine adding a pseudocount of 1 to each outcome in Table
    [7-3](#512351_1_En_7_Chapter.xhtml#Tab3). We now have a total of 16 data points,
    which yields the following new probabilities:


    ![$$ P\left[X=1\right]=\frac{3}{16}=0.1875 $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equv.png)


    ![$$ P\left[X=2\right]=\frac{4}{16}=0.25 $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equw.png)


    ![$$ P\left[X=3\right]=\frac{3}{16}=0.1875 $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equx.png)


    ![$$ P\left[X=4\right]=\frac{1}{16}=0.0625 $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equy.png)


    ![$$ P\left[X=5\right]=\frac{3}{16}=0.1875 $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equz.png)


    ![$$ P\left[X=6\right]=\frac{2}{16}=0.125 $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equaa.png)


    With the pseudocount, we no longer think that rolling a four is an impossibility.
    In fact, if we were to add an infinite pseudocount to the outcomes in Table [7-3](#512351_1_En_7_Chapter.xhtml#Tab3),
    our results would tend toward the true distribution. However, most distributions
    are not uniform. That means we cannot add a massive number to each movie rating
    and expect good things to happen. We will settle for a pseudocount of one. That
    is enough to eradicate zero probabilities while not skewing the original distribution
    too much.'
  trans: '

    ### 拉普拉斯平滑


    让我们来看一下电影《大鱼》所有评分的分布情况，如图 7-2 所示。这个分布基于数据集中所有 800 名用户的评分。


    ![../images/512351_1_En_7_Chapter/512351_1_En_7_Fig2_HTML.png](img/512351_1_En_7_Fig2_HTML.png)


    *图 7-2 电影《大鱼》所有评分的分布*


    可以看出，大多数用户尚未给这部电影评分。准确来说，98.6%的用户还没有为《大鱼》提供评分。这一观察结果很重要，因为它将在后续步骤中发挥重要作用。不过现在，我们先关注那些已经评分的用户。图
    7-3 展示了已提供评分的用户对应的条形图。


    ![../images/512351_1_En_7_Chapter/512351_1_En_7_Fig3_HTML.png](img/512351_1_En_7_Fig3_HTML.png)


    *图 7-3 电影《大鱼》的评分分布（不含未评分标记类别）*


    这张图让我们更清楚地看到实际情况。大多数用户的评分似乎集中在中间区域。没有一个用户给这部电影打 1 分或 5 分。如果我们直接将这些概率输入算法，本质上就是告诉算法，用户永远只会给
    2 分、3 分或 4 分，而打出 1 分的概率为 0%。但合理的想法是，可能存在用户会打 1 分，只是我们尚未遇到这样的用户。因此，我们需要设计一种算法，确保所有评分结果都有非零概率。这就引入了拉普拉斯平滑。


    拉普拉斯平滑的思路是，让分布稍微向均匀分布方向倾斜。做法是引入一个*伪计数*，这也是该方法有时被称为*加法平滑*的原因。为每个样本点添加伪计数，可以确保所有样本点都具有非零概率。我们来看一个例子，帮助理解这一概念。


    假设我们掷十次骰子，表 7-3 展示了每个数字出现的次数。


    *表 7-3 十次掷骰子的结果统计*


    | 结果 | 次数 |

    | --- | --- |

    | 1 | 2 |

    | 2 | 3 |

    | 3 | 2 |

    | 4 | 0 |

    | 5 | 2 |

    | 6 | 1 |


    看起来这一轮我们掷出了不少 2 点，但一次 4 点都没有。如果据此近似估算每个结果的概率，我们会得到以下结果：


    ![$$ P\left[X=1\right]=\frac{2}{10}=0.2 $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equp.png)

    ![$$ P\left[X=2\right]=\frac{3}{10}=0.3 $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equq.png)

    ![$$ P\left[X=3\right]=\frac{2}{10}=0.2 $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equr.png)

    ![$$ P\left[X=4\right]=\frac{0}{10}=0.0 $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equs.png)

    ![$$ P\left[X=5\right]=\frac{2}{10}=0.2 $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equt.png)

    ![$$ P\left[X=6\right]=\frac{1}{10}=0.1 $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equu.png)


    在前面的章节中，我们计算过公平骰子每个面朝上的真实概率约为 16.66%，因此上述某些结果偏差很大。我们的估算显示掷出 2 点的概率为 30%，而掷出 4
    点的概率则为零。对于掷骰子这种情况，我们可以轻松地重复实验多次来获取更多信息。但在电影评分的情况下，事情就没那么简单了。因为影片有 2000 部，而用户只有
    800 个，所以大多数影片的某个评分值很有可能出现零计数。这就称为数据*稀疏*。


    为了缓解这个问题，假设我们为表 7-3 中的每个结果都添加一个伪计数 1。现在总共有 16 个数据点，从而得到以下新的概率：


    ![$$ P\left[X=1\right]=\frac{3}{16}=0.1875 $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equv.png)

    ![$$ P\left[X=2\right]=\frac{4}{16}=0.25 $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equw.png)

    ![$$ P\left[X=3\right]=\frac{3}{16}=0.1875 $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equx.png)

    ![$$ P\left[X=4\right]=\frac{1}{16}=0.0625 $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equy.png)

    ![$$ P\left[X=5\right]=\frac{3}{16}=0.1875 $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equz.png)

    ![$$ P\left[X=6\right]=\frac{2}{16}=0.125 $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equaa.png)


    引入伪计数后，我们不再认为掷出 4 点是不可能的了。事实上，如果我们给表 7-3 中的结果添加无穷大的伪计数，结果会趋近于真实分布。不过，大多数分布并非均匀分布。这意味着我们不能给每个电影评分都添加一个巨大的数字，并指望得到好的结果。我们将采用一个伪计数
    1。这足以消除零概率，同时不会过度扭曲原始分布。

    '
- fmt: '### Rating Probabilities


    We just developed a strategy for handling the zero probabilities that often show
    up in sparse data. Let us now look at an approach to approximating the probability
    of a rating. Remember that we formulated the expected rating using the following
    formula:


    ![$$ \mathbbm{E}\left[R\right]=\sum \limits_{r\in R\ }r\cdotp p(r) $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equab.png)


    We want to focus on the term `p(r)` here. Imagine that a movie receives a single
    rating, a four. Using the Laplace smoothing technique we just learned about, we
    would approximate the probability of each rating by the following calculations:


    ![$$ p(0)=\frac{1}{7}\approx 0.1429 $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equac.png)


    ![$$ p(1)=\frac{1}{7}\approx 0.1429 $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equad.png)


    ![$$ p(2)=\frac{1}{7}\approx 0.1429 $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equae.png)


    ![$$ p(3)=\frac{1}{7}\approx 0.1429 $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equaf.png)


    ![$$ p(4)=\frac{2}{7}\approx 0.2857 $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equag.png)


    ![$$ p(5)=\frac{1}{7}\approx 0.1429 $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equah.png)


    These results look well and good, but there is a subtle problem that we need to
    address. Our definition of a rating does not correspond to the way we structure
    the data. Remember that a zero rating is just a placeholder meaning that a user
    did not rate the movie in question. In this case, we are actually diluting the
    probability of each rating by including the non-ratings.


    To solve this issue, we will lean on Reverend Bayes and his theorem. Remember
    that we state Bayes’ Theorem as follows:


    ![$$ P\left[A\ |\ B\right]=\frac{P\left[B\ |\ A\right]\cdotp P\left[A\right]}{P\left[B\right]}
    $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equai.png)


    Since we are looking for the probability of a rating given that the rating is
    greater than zero, we can use Bayes’ Theorem to make the following formulation:


    ![$$ P\left[r\ |\ r&gt;0\right]\cdotp P\left[r&gt;0\right]=P\Big[r&gt;0\ \left|\
    r\right]\cdotp P\left[r\right] $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equaj.png)


    By massaging this equation, we can isolate the term we are really interested in,
    namely, `p(r | r > 0)`:


    ![$$ P\left[r\ |\ r&gt;0\right]=\frac{P\left[r&gt;0\ |\ r\right]\cdotp P\left[r\right]}{P\left[r&gt;0\right]}
    $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equak.png)


    The preceding equation is the probability we really want – the probability of
    a rating given that it is a real rating and not a placeholder. Let us analyze
    each of the right-hand terms individually to see what it takes to compute each
    of them.


    *   `P(r > 0 | r)`: This term will be one for all real ratings because it is certain
    that the rating is greater than zero if it is not a placeholder. By the same logic,
    it will be zero for all the placeholders. Since the placeholder itself is zero,
    we can drop this term from the equation. It will not make a difference in either
    of the cases.


    *   `P(r)`: This term is the probability approximation we get from the Laplace
    smoothing. We have a way of computing this proportion for all movies based on
    the data.


    *   `P(r > 0)`: The probability that a rating is greater than zero is also available
    from the Laplace smoothing. Either we sum the probabilities of all ratings above
    zero, or we subtract the probability of zero from one.


    Given this reasoning, we can rewrite the formula for an expected rating to the
    following:


    ![$$ \mathbbm{E}\left[R\right]=\sum \limits_{r\in R}r\cdotp p\left(r\ |\ r&gt;0\right)=\sum
    \limits_{r\in R}r\cdotp \frac{p(r)}{p\left(r&gt;0\right)} $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equal.png)


    There it is. We have arrived at a formulation that lets us compute an expected
    rating. With the help of the similarity measure and Laplace smoothing, we are
    ready to implement a movie recommendation algorithm.


    ## Implementing the Algorithm


    This section will cover a Swift implementation of the recommendation algorithm
    we just derived in this chapter. We will also get to know a new module from the
    Accelerate framework. Instead of using CBLAS and LAPACK to do linear algebra,
    we will visit the `vDSP` API. `vDSP` provides functionality relating to digital
    signal processing and scientific data processing. It offers tools for working
    with vectors, Fourier transforms, convolution, and many other tasks.'
