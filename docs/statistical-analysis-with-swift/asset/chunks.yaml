    \    let samplesIterator = (1 ... numberOfSamples).lazy\n    self.data = meansIterator\n\
    \        .map { _ in\n            samplesIterator\n                .compactMap\
    \ { _ in set.randomElement() }\n                .mean(of: \\.self)\n        }\n\
    \        .reduce(into: [Double: Int]()) { dict, mean in\n            let roundedMean\
    \ = (mean / rounding)\n                .rounded() * rounding\n            dict[roundedMean,\
    \ default: 0] += 1\n        }\n        .map { key, value in\n            BarChartDataEntry(\n\
    \                x: key,\n                y: value.realValue / numberOfMeans.realValue\n\
    \            )\n        }\n    self.barWidth = 0.9 * rounding\n    self.mean =\
    \ set.mean(of: \\.self)\n    self.numberOfSamples = numberOfSamples\n}\n```\n\n\
    代码清单 5-1：计算并绘制多个样本均值\n\n在一个包含 100 个 0 到 5 之间均匀随机数的集合上运行上述代码，会生成如图 5-1 所示的直方图。该代码计算了总共\
    \ 5000 个样本均值，每个均值使用了 30 个样本。\n\n![../images/512351_1_En_5_Chapter/512351_1_En_5_Fig1_HTML.png](img/512351_1_En_5_Fig1_HTML.png)\n\
    \n图 5-1：从一个包含 100 个均匀随机数的集合中计算出的 5000 个样本均值\n\n观察这个直方图，我们得到了一个可视化证据，证实了之前列举计算样本均值的不同结果时的猜想。这些柱状图形成了一个看起来非常像正态分布的形状！这个结果并非巧合，而是由一个数据科学家和统计学家经常使用的定理所正式表述的。\n\
    \n## 中心极限定理\n\n中心极限定理让任何想要进行假设检验的人的生活变得轻松得多。它告诉我们，来自总体的样本均值的分布可以用正态分布来近似。无论我们从中采样的分布是否为正态分布，这个结论都成立。但是，我们需要满足一些条件。\n\
    \n-   我们需要进行有放回抽样。例如，一旦我们选择了一名学生进行智商测试，就不能将其从样本池中移除，因为这会改变剩余样本的分布。相反，我们必须接受可能多次选中同一名学生的可能性。\n\
