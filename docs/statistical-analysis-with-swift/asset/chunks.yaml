    \ York, NY 10004, U.S.A.\n\n## 致谢\n\n首先，我要感谢我的伴侣 Lisette，在我写作期间让我保持专注，并确保我不会因过于兴奋而过度劳累。你的支持和鼓励对我来说意义非凡。\n\
    \n我还要感谢 Apress 的团队。你们让这段旅程变得精彩纷呈。感谢 Aaron 主动联系并建议我们撰写这本书；我对此机会深表感激。感谢 Jessica\
    \ 确保写作过程顺利进行，并让从始至终的体验都充满乐趣。感谢 Vishwesh 让我时刻保持紧张，确保所有主题都切题且正确。你们提供的所有帮助都无比珍贵。\n\
    \n最后但同样重要的是，我要感谢我的朋友 Bastian，过去一年里他与我反复探讨数学和编程的各种想法。我们交谈中获得的认知和启发，对我写作本书大有裨益。\n\
    \n## 关于作者 / 关于技术审校者\n\n# 1. Swift 入门\n\n> *Swift 是一种通用编程语言，采用现代方法构建，注重安全性、性能和软件设计模式。*\n\
    > \n> ——Swift.org\n\n苹果公司在 2014 年全球开发者大会上推出了 Swift 编程语言，旨在取代 C、C++ 和 Objective-C\
    \ 等其他基于 C 的语言。自那时起，Swift 通过力求在性能、安全性和易用性之间取得完美平衡，发展了一个充满激情的开发者社区。\n\n## Swift\
    \ 概览\n\n在深入探讨统计分析之前，我们需要问自己几个问题：Swift 是否是合适的技术选择。其他语言也支持此类计算，其中许多语言还拥有优秀的第三方库，进一步扩展了标准库的功能。为了说服自己\
    \ Swift 是完成这些任务的理想工具，让我们来看看该语言及其生态系统的一些优势特性。\n\n### 性能\n\n现代计算中的一个瓶颈是，它通常涉及处理大量数据。例如，微软的恶意软件分类数据集大小接近半\
    \ TB，而谷歌的地标识别数据则由超过 120 万个数据点组成。处理如此庞大的数据量需要强大的硬件支持，同时也要求我们所使用的编程语言足够高效。\n\n自\
    \ 2014 年以来，性能一直是 Swift 营销中的一个重要关键词。与 C 和 C++ 竞争的愿景为速度和效率设定了高标准，许多基准测试表明，Swift\
    \ 在追赶方面表现得相当不错。与如今已成为数据科学家黄金标准的 Python 相比，基准测试表明，相应的 Swift 程序可能会实现显著的加速。既然我们知道有大量数据需要处理，那么高性能的语言总是受欢迎的。然而，大量复杂数据对我们的工具如何安全、正确地操作这些数据提出了新的要求。\n\
    \n### 安全性\n\n安全性是 Swift 发展过程中的指路明灯。在此背景下，安全性意味着该语言主动尝试保护开发者，避免其编写导致未定义行为的代码。这些安全特性包括一些简单的措施，比如鼓励使用不可变变量。然而，它们也包含更加复杂的方案和要求。\n\
    \nSwift 采取的最突出的安全措施之一是使用 `Optional` 类型。如果我们需要表示某个值的缺失，我们必须使用空的 `Optional`，而不是裸空值。有些人认为这是一种不必要的僵化设计，会导致更多的样板代码。然而，这迫使开发者明确标记数据可能缺失的实例，并安全地处理这些情况。\n\
    \n另一个重要的安全特性是要求对修改操作进行独占内存访问。设想一个场景：两个不同的方法调用同时访问同一个内存位置。只要两个方法都只是读取内容然后继续，我们就可以认为这是安全的操作。然而，一旦其中一个（或两个）方法想要修改存储的值，问题就会变得棘手。内存位置中的最终内容将取决于哪个方法最后执行写操作。Swift\
    \ 通过要求修改操作独占访问权限，即只允许单个调用在任意时刻注册修改某个内存位置，从而帮助指出不安全的代码。\n\n### 正确性\n\n一旦我们开始处理大量复杂数据，确保产生正确的结果就变得更具挑战性。我们可以通过融入大量可靠的软件工程实践来解决其中的许多问题。然而，我们也应该充分利用开发工具提供的任何帮助。\n\
    \nSwift 从函数式编程的世界中汲取了大量灵感。开发者被积极鼓励考虑*值类型*，并且仅当引用语义至关重要时才使用*引用类型*。在可能的情况下，我们应该优先使用*值类型*，这有很多原因，但我们只关注那些在处理大数据集时对我们直接有益的原因。\n\
    \n使用*值类型*的第一个真正优势在于，它们在内存分配方面通常性能更高。Swift 通常将*引用类型*分配在堆上，而*值类型*通常位于栈上。当然，总有例外，但这可以作为一个很好的经验法则。在栈上分配对象的过程只需系统递增一个指针，这是一个非常快速的操作。然而，在堆上分配对象时，系统需要在该内存区域中搜索一个足够大的空位。这个过程要慢得多，并且如果我们需要分配大量对象时，这种差异会非常明显。\n\
    \n第二个优势是，*值类型*在不同变量之间共享时会进行自我复制。这一特性意味着我们可以确信，没有其他变量能够在我们背后更改我们当前正在处理的数据。这种局部性使得我们更容易推断结果，并对单独的代码部分进行完整性检查。一旦我们需要并行化工作，它也能简化事情。\n"
- fmt: '# Hardware Acceleration


    It can be incredibly beneficial to use hardware acceleration when dealing with
    large amounts of data. The ability to process information in parallel can speed
    up our programs'' execution and ultimately lead to less idle time. Swift provides
    several frameworks that allow developers to take advantage of multiple CPU cores
    and the GPU.


    The problems we solve in this book are mostly going to rely on the `Accelerate`
    framework, which we mainly use for its linear algebra functionalities. For those
    who want to dive deeper into parallel computing after reading this, the `Metal`
    framework provides access to the graphics processors and can parallelize and speed
    up calculations. Both of the frameworks mentioned earlier are available on every
    Apple computer per default. However, we may find ourselves where the system libraries
    are not quite enough to do the job.


    # Swift Package Manager


    Easy access to great external libraries is an important aspect when working with
    any data science tasks. The task of collecting and managing such project dependencies
    has become much more straightforward, thanks to developments in the Swift Package
    Manager. This tool allows developers to, for example, include a third-party library
    in their project and start working with it directly.


    Other tools have offered similar functionality before, two examples being CocoaPods
    and Carthage. However, they have never been as tightly integrated into the Xcode
    environment as Swift Package Manager is today. We will take advantage of this
    by importing libraries that help us manipulate and visualize our data.


    # Conclusion


    Looking at the features mentioned previously, we can conclude that Swift and its
    ecosystem have many desirable traits when working with statistical analysis data.
    It is reasonable to think that the language will serve us well once we start working
    with it. It is also realistic to think that using Swift might benefit us in ways
    that would be either difficult or impossible to achieve with other tools. With
    these conclusions in mind, it is time to dig into some language details that we
    will use in this book.


    # Working with Swift


    This section will cover a few handy concepts that will reduce friction when working
    with large data sets. Some of them apply to programming in general, while others
    are specific to how Swift works. This section also introduces the accompanying
    code repository. It explains the project''s general structure and how to take
    full advantage of it while reading this book.


    ## Data Formats


    Data points can come in many different forms, and how we choose to store our information
    varies between cases. Aspects such as storage size, readability, and tools available
    to pack and unpack the information play significant roles when picking a format.
    Table [1-1](#512351_1_En_1_Chapter.xhtml#Tab1) (on the following page) describes
    a few popular data formats in the Swift community.


    For the examples in this book, we have chosen to store the accompanying data using
    CSV files. There are many reasons for this decision:


    Table 1-1


    Some popular data formats in the Swift community


    | Format | File Extension | Description |

    | --- | --- | --- |

    | JavaScript Object Notation | `.json` | JSON is a human-readable semi-structured
    data format. |

    | Extensible Markup Language | `.xml` | XML is a structured data format that has
    a decent level of human readability. |

    | Comma Separated Values Files | `.csv` | CSV is a compact format that typically
    stores tabular data in a human-readable way. |

    | Protocol Buffers | `.pb`, `.proto` | Protocol Buffers is a serialization method
    for structured data, which turns information into a binary format. It is very
    compact but not very human readable. |


    1.  CSV is a lightweight format with a relatively small memory footprint.


    2.  CSV stores data records as lines in a simple text file, making it a very intuitive
    and understandable format.


    3.  CSV files usually only contain plain text, which yields a high degree of readability
    that can be beneficial in a learning context.


    4.  Swift Package Manager provides access to multiple libraries for reading and
    writing CSV files, which decreases the friction in working with them.


    ## The Code Project


    The code repository that accompanies this book contains working examples for the
    problems we solve in different chapters. After downloading the project (available
    via a GitHub link on this book''s product page at apress.com), the project opens
    via the `StatisticalSwift.xcworkspace` file. Notice that all code examples reside
    in project files named according to their respective chapter numbers. To run the
    code from a chapter, we first need to select the correct scheme. Clicking the
    scheme selection button, located right next to the Run and Stop button in the
    top toolbar, allows us to select the correct chapter. Doing so tells Xcode which
    target to execute, and we can press `Cmd+R` or click the Run button to run our
    code.'
  raw: '### Hardware Acceleration


    It can be incredibly beneficial to use hardware acceleration when dealing with
    large amounts of data. The ability to process information in parallel can speed
    up our programs’ execution and ultimately lead to less idle time. Swift provides
    several frameworks that allow developers to take advantage of multiple CPU cores
    and the GPU.


    The problems we solve in this book are mostly going to rely on the Accelerate
    framework, which we mainly use for its linear algebra functionalities. For those
    who want to dive deeper into parallel computing after reading this, the Metal
    framework provides access to the graphics processors and can parallelize and speed
    up calculations. Both of the frameworks mentioned earlier are available on every
    Apple computer per default. However, we may find ourselves where the system libraries
    are not quite enough to do the job.


    ### Swift Package Manager


    Easy access to great external libraries is an important aspect when working with
    any data science tasks. The task of collecting and managing such project dependencies
    has become much more straightforward, thanks to developments in the Swift Package
    Manager. This tool allows developers to, for example, include a third-party library
    in their project and start working with it directly.


    Other tools have offered similar functionality before, two examples being Cocoapods
    and Carthage. However, they have never been as tightly integrated into the Xcode
    environment as Swift Package Manager is today. We will take advantage of this
    by importing libraries that help us manipulate and visualize our data.


    ### Conclusion


    Looking at the features mentioned previously, we can conclude that Swift and its
    ecosystem have many desirable traits when working with statistical analysis data.
    It is reasonable to think that the language will serve us well once we start working
    with it. It is also realistic to think that using Swift might benefit us in ways
    that would be either difficult or impossible to achieve with other tools. With
    these conclusions in mind, it is time to dig into some language details that we
    will use in this book.


    ## Working with Swift


    This section will cover a few handy concepts that will reduce friction when working
    with large data sets. Some of them apply to programming in general, while others
    are specific to how Swift works. This section also introduces the accompanying
    code repository. It explains the project’s general structure and how to take full
    advantage of it while reading this book.


    ### Data Formats


    Data points can come in many different forms, and how we choose to store our information
    varies between cases. Aspects such as storage size, readability, and tools available
    to pack and unpack the information play significant roles when picking a format.
    Table [1-1](#512351_1_En_1_Chapter.xhtml#Tab1) (on the following page) describes
    a few popular data formats in the Swift community.


    For the examples in this book, we have chosen to store the accompanying data using
    CSV files. There are many reasons for this decision:


    Table 1-1


    Some popular data formats in the Swift community


    | Format | File Extension | Description |

    | --- | --- | --- |

    | JavaScript Object Notation | .json | JSON is a human-readable semi-structured
    data format. |

    | Extensible Markup Language | .xml | XML is a structured data format that has
    a decent level of human readability. |

    | Comma Separated Values Files | .csv | CSV is a compact format that typically
    stores tabular data in a human-readable way. |

    | Protocol Buffers | .pb, .proto | Protocol Buffers is a serialization method
    for structured data, which turns information into a binary format. It is very
    compact but not very human readable. |


    1.  CSV is a lightweight format with a relatively small memory footprint.


    2.  CSV stores data records as lines in a simple text file, making it a very intuitive
    and understandable format.


    3.  CSV files usually only contain plain text, which yields a high degree of readability
    that can be beneficial in a learning context.


    4.  Swift Package Manager provides access to multiple libraries for reading and
    writing CSV files, which decreases the friction in working with them.


    ### The Code Project


    The code repository that accompanies this book contains working examples for the
    problems we solve in different chapters. After downloading the project (available
    via a GitHub link on this book’s product page at apress.com), the project opens
    via the **StatisticalSwift.xcworkspace** file. Notice that all code examples reside
    in project files named according to their respective chapter numbers. To run the
    code from a chapter, we first need to select the correct scheme. Clicking the
    scheme selection button, located right next to the Run and Stop button in the
    top toolbar, allows us to select the correct chapter. Doing so tells Xcode which
    target to execute, and we can press Cmd+R or click the Run button to run our code.'
  trans: "\n# 硬件加速\n\n在处理大量数据时，使用硬件加速可以带来巨大的好处。并行处理信息的能力能够加快程序执行速度，最终减少空闲时间。Swift\
    \ 提供了多个框架，让开发者能够利用多核 CPU 和 GPU。\n\n我们在本书中解决的问题大多将依赖 `Accelerate` 框架，主要使用其线性代数功能。阅读本书后，若想更深入探究并行计算，`Metal`\
    \ 框架可提供对图形处理器的访问，并能实现计算并行化与加速。前述两种框架均默认预装在每台苹果电脑上。然而，我们有时也会发现系统库不足以胜任相关工作。\n\n\
    # Swift 包管理器\n\n在进行任何数据科学任务时，便捷地获取优质外部库是一个重要方面。得益于 Swift 包管理器的发展，收集和管理此类项目依赖项的任务已变得简单得多。例如，该工具允许开发者将第三方库纳入项目并直接开始使用。\n\
    \n其他工具也曾提供过类似功能，例如 CocoaPods 和 Carthage。但它们从未像如今的 Swift 包管理器一样与 Xcode 环境紧密结合。我们将借助这一点，导入能够帮助我们操作和可视化数据的库。\n\
    \n# 结论\n\n回顾上述特性，我们可以得出结论：在处理统计分析数据时，Swift 及其生态系统拥有许多理想特质。有理由相信，一旦开始使用这门语言，它将会为我们提供良好支持。同样现实的是，使用\
    \ Swift 可能会带来其他工具难以甚至无法实现的优势。带着这些结论，是时候深入了解本书将用到的一些语言细节了。\n\n# 使用 Swift 工作\n\n\
    本节将涵盖一些实用的概念，有助于减少处理大数据集时的摩擦。其中一些适用于通用编程，另一些则针对 Swift 的工作方式。本节还将介绍配套的代码仓库，说明项目的总体结构以及如何在阅读本书时充分利用它。\n\
    \n## 数据格式\n\n数据点可以有多种不同形式，我们选择存储信息的方式也因情况而异。在挑选格式时，存储大小、可读性以及用于打包和解包信息的可用工具等因素都扮演着重要角色。表\
    \ 1-1（见下页）描述了 Swift 社区中几种流行的数据格式。\n\n对于本书中的示例，我们选择使用 CSV 文件存储配套数据。做出这一决定有多方面原因：\n\
    \n表 1-1  \nSwift 社区中几种流行的数据格式\n\n| 格式 | 文件扩展名 | 描述 |\n| --- | --- | --- |\n| JavaScript\
    \ 对象表示法 | `.json` | JSON 是一种人类可读的半结构化数据格式。 |\n| 可扩展标记语言 | `.xml` | XML 是一种结构化数据格式，具有较好的人类可读性。\
    \ |\n| 逗号分隔值文件 | `.csv` | CSV 是一种紧凑格式，通常以人类可读的方式存储表格数据。 |\n| 协议缓冲区 | `.pb`, `.proto`\
    \ | 协议缓冲区是一种用于结构化数据的序列化方法，可将信息转换为二进制格式。它非常紧凑，但不太适合人类阅读。 |\n\n1.  CSV 是一种轻量级格式，内存占用相对较小。\n\
    \n2.  CSV 将数据记录作为行存储在简单的文本文件中，使其成为一种非常直观且易于理解的格式。\n\n3.  CSV 文件通常只包含纯文本，具有高度的可读性，这在学习环境中非常有益。\n\
    \n4.  Swift 包管理器提供了多个用于读写 CSV 文件的库，降低了处理它们时的摩擦。\n\n## 代码项目\n\n本书配套的代码仓库包含了我们在不同章节中解决问题的可运行示例。下载项目后（可通过本书在\
    \ apress.com 的产品页面上的 GitHub 链接获取），项目通过 `StatisticalSwift.xcworkspace` 文件打开。请注意，所有代码示例都位于根据各自章节编号命名的项目文件中。要运行某个章节的代码，我们首先需要选择正确的方案。点击顶部工具栏中“运行”和“停止”按钮旁边的方案选择按钮，即可选择正确的章节。这样做会告诉\
    \ Xcode 要执行哪个目标，然后我们可以按下 `Cmd+R` 或点击“运行”按钮来运行代码。\n"
- fmt: "### The Decodable Protocol\n\nThe Swift Standard Library comes with quite\
    \ a few nice features related to encoding, decoding, and manipulating data. We\
    \ will make heavy use of many of these features throughout this book, but one\
    \ of them will be especially important to get things going – namely, the `Decodable`\
    \ protocol.\n\nThe `Decodable` protocol itself (which we show in Listing [1-1](#512351_1_En_1_Chapter.xhtml#PC1))\
    \ is as simple as it is powerful. It only specifies the requirement that conforming\
    \ types should implement an initializer that knows how to instantiate an object\
    \ from a `Decoder`.\n\n```\nprotocol Decodable {\ninit(from decoder: Decoder)\
    \ throws\n}\nListing 1-1\nThe Decodable protocol from the Swift Standard Library\n\
    ```\n\nAs we can see, the initializer takes a `Decoder`-type object as an argument.\
    \ `Decoder` is another protocol implemented by types that know how to read values\
    \ from a native data format. For example, a `Decoder`-type could take a CSV file,\
    \ read the lines and data values, and then provide those to a `Decodable` initializer\
    \ to create new Swift objects. To get an intuition for how this works in practice,\
    \ we will walk through how to decode a small CSV file step by step. Listing [1-2](#512351_1_En_1_Chapter.xhtml#PC2)\
    \ shows an example CSV file containing some information about two people – Anna\
    \ and Keith – while Listing [1-3](#512351_1_En_1_Chapter.xhtml#PC3) shows a Swift\
    \ type named `Person`, which we would like to use to store the decoded values.\n\
    \n```\nstruct Person: Decodable {\nlet name: String\nlet age: Int\nenum CodingKeys:\
    \ String, CodingKey {\ncase name = \"name\"\ncase age = \"age\"\n}\ninit(from\
    \ decoder: Decoder) throws {\nlet container = try decoder\n.container(keyedBy:\
    \ CodingKeys.self)\nself.name = try container\n.decode(String.self, forKey: .name)\n\
    self.age = try container\n.decode(Int.self, forKey: .age)\n}\n}\nListing 1-3\n\
    The Swift type we use to showcase the functionality of the Decodable protocol\n\
    ```\n\n```\nname,age\nAnna,34\nKeith,36\nListing 1-2\nThe CSV file we use in our\
    \ Decodable walkthrough\n```\n\nLooking at the `Person` type, we see that it specifies\
    \ conformance to `Decodable`. To comply with the protocol requirements, we define\
    \ the initializer and ask the `Decoder` to unpack the values we want to use. We\
    \ also define an `enum` named `CodingKeys`, which provides a mapping between which\
    \ values we ask for and their corresponding keys in the CSV. By doing so, we tell\
    \ the `Decoder` which keys to use when we ask for different values.\n\n> **Note**\
    \  \n> In many cases, we will not have to implement the initializer and `CodingKeys`\
    \ enum from Listing [1-3](#512351_1_En_1_Chapter.xhtml#PC3). Swift can synthesize\
    \ these for us if our struct only contains other `Decodable` types and have the\
    \ same names as the data file keys.\n\nNow that our `Person` type implements all\
    \ the necessary functionality, we are ready to decode the data. Listing [1-4](#512351_1_En_1_Chapter.xhtml#PC4)\
    \ shows the code that turns the CSV file into `Person` objects. One thing to be\
    \ aware of is that the `CSVDecoder` is not a part of the Swift Standard Library.\
    \ It is part of a package called *CodableCSV*, which we will introduce later.\n\
    \n```\nlet decoder = CSVDecoder { config in\nconfig.headerStrategy = .firstLine\n\
    }\nlet people = try decoder\n.decode([Person].self, from: csvFile)\nfor person\
    \ in people {\nprint(person)\n}\n// Prints:\n// Person(name: \"Anna\", age: 34)\n\
    // Person(name: \"Keith\", age: 36)\nListing 1-4\nDecoding a CSV and creating\
    \ an array of Person structs\n```\n\nThe code in Listing [1-4](#512351_1_En_1_Chapter.xhtml#PC4)\
    \ shows the beauty of `Decodable` in all its glory. We turn a data file into easy-to-use\
    \ Swift types by telling the `CSVDecoder` which data to parse and which type we\
    \ expect to get back. However, statistical analysis is not just about reading\
    \ files from disk. Now that we know how to load data from files, we will use the\
    \ `DataLoader` type to read data into memory. Not only does this relieve us of\
    \ the responsibilities to locate data files and handle boilerplate code, but it\
    \ also allows us to focus on our primary task – to learn statistical analysis\
    \ concepts. The `DataLoader` will be introduced in the following examples as we\
    \ look at how to access and manipulate loaded data in Swift."
  raw: '### The Decodable Protocol


    The Swift Standard Library comes with quite a few nice features related to encoding,
    decoding, and manipulating data. We will make heavy use of many of these features
    throughout this book, but one of them will be especially important to get things
    going – namely, the `Decodable` protocol.


    The `Decodable` protocol itself (which we show in Listing [1-1](#512351_1_En_1_Chapter.xhtml#PC1))
    is as simple as it is powerful. It only specifies the requirement that conforming
    types should implement an initializer that knows how to instantiate an object
    from a `Decoder`.


    ```

    protocol Decodable {

    init(from decoder: Decoder) throws

    }

    Listing 1-1

    The Decodable protocol from the Swift Standard Library

    ```


    As we can see, the initializer takes a `Decoder`-type object as an argument. `Decoder`
    is another protocol implemented by types that know how to read values from a native
    data format. For example, a `Decoder`-type could take a CSV file, read the lines
    and data values, and then provide those to a `Decodable` initializer to create
    new Swift objects. To get an intuition for how this works in practice, we will
    walk through how to decode a small CSV file step by step. Listing [1-2](#512351_1_En_1_Chapter.xhtml#PC2)
    shows an example CSV file containing some information about two people – Anna
    and Keith – while Listing [1-3](#512351_1_En_1_Chapter.xhtml#PC3) shows a Swift
    type named `Person`, which we would like to use to store the decoded values.


    ```

    struct Person: Decodable {

    let name: String

    let age: Int

    enum CodingKeys: String, CodingKey {

    case name = "name"

    case age = "age"

    }

    init(from decoder: Decoder) throws {

    let container = try decoder

    .container(keyedBy: CodingKeys.self)

    self.name = try container

    .decode(String.self, forKey: .name)

    self.age = try container

    .decode(Int.self, forKey: .age)

    }

    }

    Listing 1-3

    The Swift type we use to showcase the functionality of the Decodable protocol

    ```


    ```

    name,age

    Anna,34

    Keith,36

    Listing 1-2

    The CSV file we use in our Decodable walkthrough

    ```


    Looking at the `Person` type, we see that it specifies conformance to `Decodable`.
    To comply with the protocol requirements, we define the initializer and ask the
    `Decoder` to unpack the values we want to use. We also define an `enum` named
    `CodingKeys`, which provides a mapping between which values we ask for and their
    corresponding keys in the CSV. By doing so, we tell the `Decoder` which keys to
    use when we ask for different values.


    Note


    In many cases, we will not have to implement the initializer and CodingKeys enum
    from Listing [1-3](#512351_1_En_1_Chapter.xhtml#PC3). Swift can synthesize these
    for us if our struct only contains other Decodable types and have the same names
    as the data file keys.


    Now that our `Person` type implements all the necessary functionality, we are
    ready to decode the data. Listing [1-4](#512351_1_En_1_Chapter.xhtml#PC4) shows
    the code that turns the CSV file into `Person` objects. One thing to be aware
    of is that the `CSVDecoder` is not a part of the Swift Standard Library. It is
    part of a package called *CodableCSV* , which we will introduce later.


    ```

    let decoder = CSVDecoder { config in

    config.headerStrategy = .firstLine

    }

    let people = try decoder

    .decode([Person].self, from: csvFile)

    for person in people {

    print(person)

    }

    // Prints:

    // Person(name: "Anna", age: 34)

    // Person(name: "Keith", age: 36)

    Listing 1-4

    Decoding a CSV and creating an array of Person structs

    ```


    The code in Listing [1-4](#512351_1_En_1_Chapter.xhtml#PC4) shows the beauty of
    `Decodable` in all its glory. We turn a data file into easy-to-use Swift types
    by telling the `CSVDecoder` which data to parse and which type we expect to get
    back. However, statistical analysis is not just about reading files from disk.
    Now that we know how to load data from files, we will use the `DataLoader` type
    to read data into memory. Not only does this relieve us of the responsibilities
    to locate data files and handle boilerplate code, but it also allows us to focus
    on our primary task – to learn statistical analysis concepts. The `DataLoader`
    will be introduced in the following examples as we look at how to access and manipulate
    loaded data in Swift.'
  trans: "\n### Decodable 协议\n\nSwift 标准库提供了相当多与编码、解码和数据处理相关的优秀特性。在本书中，我们将大量使用其中的许多特性，但其中一个对于启动工作尤为重要——那就是\
    \ `Decodable` 协议。\n\n`Decodable` 协议本身（如代码清单 1-1 所示）既简单又强大。它只要求遵循该协议的类型实现一个能够从\
    \ `Decoder` 实例化对象的初始化器。\n\n```\nprotocol Decodable {\ninit(from decoder: Decoder)\
    \ throws\n}\n代码清单 1-1\n来自 Swift 标准库的 Decodable 协议\n```\n\n如我们所见，这个初始化器接受一个 `Decoder`\
    \ 类型的对象作为参数。`Decoder` 是另一个由能够从原生数据格式读取值的类型所实现的协议。例如，一个 `Decoder` 类型可以读取一个 CSV\
    \ 文件，解析其中的行和数据值，然后将这些值提供给 `Decodable` 的初始化器来创建新的 Swift 对象。为了直观理解这在实际中是如何工作的，我们将逐步演练如何解码一个小的\
    \ CSV 文件。代码清单 1-2 展示了一个包含两位人士（Anna 和 Keith）信息的 CSV 文件示例，而代码清单 1-3 则展示了一个名为 `Person`\
    \ 的 Swift 类型，我们打算用它来存储解码后的值。\n\n```\nstruct Person: Decodable {\nlet name: String\n\
    let age: Int\nenum CodingKeys: String, CodingKey {\ncase name = \"name\"\ncase\
    \ age = \"age\"\n}\ninit(from decoder: Decoder) throws {\nlet container = try\
    \ decoder\n.container(keyedBy: CodingKeys.self)\nself.name = try container\n.decode(String.self,\
    \ forKey: .name)\nself.age = try container\n.decode(Int.self, forKey: .age)\n\
    }\n}\n代码清单 1-3\n用于展示 Decodable 协议功能的 Swift 类型\n```\n\n```\nname,age\nAnna,34\n\
    Keith,36\n代码清单 1-2\n用于 Decodable 演练的 CSV 文件\n```\n\n查看 `Person` 类型，我们看到它声明遵循 `Decodable`\
    \ 协议。为了满足协议要求，我们定义了初始化器，并请求 `Decoder` 解包我们想要使用的值。我们还定义了一个名为 `CodingKeys` 的枚举，它提供了我们请求的值与\
    \ CSV 中对应键之间的映射。通过这种方式，我们告诉 `Decoder` 在请求不同值时应该使用哪些键。\n\n> **注意**  \n> 在许多情况下，我们无需手动实现代码清单\
    \ 1-3 中的初始化器和 `CodingKeys` 枚举。只要我们的结构体只包含其他遵循 `Decodable` 的类型，并且属性名与数据文件中的键名相同，Swift\
    \ 就能自动为我们合成这些代码。\n\n现在我们的 `Person` 类型已经实现了所有必要功能，我们可以开始解码数据了。代码清单 1-4 展示了将 CSV\
    \ 文件转换为 `Person` 对象的代码。需要注意的一点是，`CSVDecoder` 并非 Swift 标准库的一部分，它属于一个名为 *CodableCSV*\
    \ 的包，我们将在后文介绍。\n\n```\nlet decoder = CSVDecoder { config in\nconfig.headerStrategy\
    \ = .firstLine\n}\nlet people = try decoder\n.decode([Person].self, from: csvFile)\n\
    for person in people {\nprint(person)\n}\n// 输出：\n// Person(name: \"Anna\", age:\
    \ 34)\n// Person(name: \"Keith\", age: 36)\n代码清单 1-4\n解码 CSV 并创建 Person 结构体数组\n\
    ```\n\n代码清单 1-4 的代码淋漓尽致地展现了 `Decodable` 的优势。我们只需告知 `CSVDecoder` 要解析哪些数据以及期望返回的类型，就能将一个数据文件转换为易于使用的\
    \ Swift 类型。然而，统计分析并不仅仅涉及从磁盘读取文件。既然我们已经知道如何从文件加载数据，接下来我们将使用 `DataLoader` 类型将数据读入内存。这不仅让我们摆脱了定位数据文件和处理样板代码的负担，还能让我们专注于主要任务——学习统计分析的概念。在后续示例中，当我们探讨如何在\
    \ Swift 中访问和操作已加载的数据时，将会介绍 `DataLoader`。\n"
- fmt: '### The `KeyPath` Type


    One of the most powerful features in Swift’s Standard Library is the `KeyPath`
    type. It gives developers the possibility to access object properties dynamically
    at runtime, and it does this without giving up on type safety. In this section,
    we will look at a few code examples. We explore what the `KeyPath` type is and
    how to leverage it to write flexible and maintainable code.


    First, let us look at how we use a `KeyPath` to access an object property. Listing
    [1-5](#512351_1_En_1_Chapter.xhtml#PC5) on the following page shows an example
    of a `KeyPath` printing every `Person` object’s name. It also introduces the use
    of `DataLoader`, which is part of the `StatisticalSwift` module. To get an array
    of all people from our data set, we call the `load(_:from:)` method and specify
    the type we expect to get back.


    ```

    let people = DataLoader.load(

    Person.self,

    from: .people

    )

    let nameKey = \Person.name

    for person in people {

    let name = person[keyPath: nameKey]

    print("Name: \(name)")

    }

    // Prints:

    // Name: Anna

    // Name: Keith

    Listing 1-5

    Using a KeyPath to print names from the people CSV file

    ```


    We use the `\` operator followed by the property we want to reference to create
    a `KeyPath` instance. The type of our new instance is `KeyPath<Person, String>`,
    which simply points out that we are referring to a `String` property stored inside
    a `Person` object. This particular example adds little to no value above the familiar
    dot syntax. Instead, it aims at introducing the type and its most basic use case.
    To explore a more practical (and arguably more realistic) use case, take a look
    at Listing [1-6](#512351_1_En_1_Chapter.xhtml#PC6) on the next page.


    ```

    let names = people

    .map(\.name)

    .joined(separator: " and ")

    let ages = people

    .map(\.age)

    .map(String.init)

    .joined(separator: " and ")

    let totalAge = people

    .sum(over: \.age)

    print(

    """

    We have \(names) with us today!

    They are aged \(ages), respectively,

    totaling \(totalAge) years together!

    """

    )

    // Prints:

    // We have Anna and Keith with us today!

    // They are aged 34 and 36, respectively,

    // totaling 70 years together!

    Listing 1-6

    Using KeyPaths to perform data transformations

    ```


    In this example, the `KeyPath` type transforms the different properties into new
    data types. `KeyPath` maps the corresponding property values into arrays when
    creating the names and ages variables, which can then be further processed and
    formatted into `String` objects. Note that this example uses implicit member syntax
    to reference a property. As long as the compiler can infer that we are working
    with the `Person` type, we can use the `\.name` shorthand instead of `\Person.name`
    to reference the name property.


    The `totalAge` variable provides a slightly more complex and interesting use case.
    The method `sum(over:)` is from the `StatKit` module and does not require the
    `KeyPath` to reference a property of a specific type. Instead, it requires the
    reference type to conform to the `AdditiveArithmetic` protocol. That means that
    we are free to point to any property, so long as the type stored in that property
    supports the use of the `+` operator.


    Lastly, we take a quick look at `PartialKeyPath`. This type pushes the dynamic
    behavior to its limits, as it does not place any requirements on the referenced
    property. This feature makes it possible to write highly flexible code so long
    as we can perform our intended operations on a type-erased object. Listing [1-7](#512351_1_En_1_Chapter.xhtml#PC7)
    shows an example of this.


    ```

    let partialkeys: [PartialKeyPath] = [

    \Person.name,

    \Person.age

    ]

    for _ in 1 ... 5 {

    guard

    let randomKey = partialkeys.randomElement(),

    let person = people.randomElement()

    else { continue }

    let value = person[keyPath: randomKey]

    print(value)

    }

    // Prints 5 random property values,

    // for example Anna, Keith, or 36

    Listing 1-7

    Using partially type-erased KeyPaths to print a randomly sampled property of a
    Person object

    ```


    These examples have shown some possible uses of different `KeyPath` types. When
    we start implementing solutions to the problems posed later in this book, we will
    notice how well this type fits into the workflow and how it allows us to alter
    our computations easily. Next, it has come time to cover a topic that we have
    already seen traces of in the previous examples and need to understand before
    diving into implementations.'
