  trans: '

    ### 指数分布


    指数分布描述了泊松分布中两个事件之间的时间间隔的分布情况。虽然我们没有具体介绍泊松分布，但指数分布本身仍是一个很好的计算工具。


    指数分布有一个参数，通常称为*速率*，用希腊字母 λ 表示。速率表示在确定的时间单位内平均发生的事件数量。例如，如果我们经营的商店平均每天有 20 位顾客光顾，我们可以将时间单位设为一天，那么速率就是
    20。如果我们选择以一小时为基本单位，那么速率就是 2（假设商店营业 10 小时）。需要注意的一点是，由于我们处理的是时间间隔，样本空间严格由非负数构成。


    指数分布描述的是某个时间间隔分隔两个事件的可能性有多大。例如，如果我们的商店每小时有两位顾客光顾，我们可以计算开门后 10 分钟内第一位顾客到来的概率。我们可以用以下数学符号来表示：


    ![$$ P\left[\ 0\le X\le \frac{1}{6};\lambda =2\right] $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equaf.png)


    请注意，我们需要指定一个值的范围，因为我们处理的是一个包含连续时间间隔的样本空间。根据我们在上一节中应用的相同逻辑，第一位顾客正好在开门后十分钟到达的概率为零。我们还注意到，上限不是
    10，而是十分钟在我们基本单位（一小时）中所占的分数。


    我们可以计算从零到十分钟的指数分布 PDF 的积分来回答我们的问题。PDF 的推导超出了本书的范围。因此，我们只在下面的等式中给出公式：


    ![$$ P\left[\ 0\le X\le \frac{1}{6};\lambda =2\right]={\int}_0^{\frac{1}{6}}\lambda
    {e}^{-\lambda x} dx={\left[-{e}^{-\lambda x}\right]}_0^{\frac{1}{6}}=1-{e}^{-\frac{2}{6}}\approx
    0.283 $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equag.png)


    计算结果表明，如果我们睡过头，晚开门 10 分钟，那么我们的第一位顾客在我们之前出现，并因此未购买任何东西就离开的风险约为 28.3%。


    这个特定的积分并不难。事实上，它的性质相当好且易于计算。然而，还有另一种方法可以使用累积分布函数来计算相同的结果。这里给出指数分布的 CDF：


    ![$$ P\left[X\le x\right]=1-{e}^{-\lambda x} $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equah.png)


    这个公式与我们刚刚求解的积分中最后一个等式之一非常相似。由于它计算的是随机变量低于某个阈值的概率，我们将用它来执行一个技巧。如果我们想知道第一位顾客在开业后
    5 到 10 分钟内出现的可能性，我们可以再次计算积分。但是，我们也可以这样重新表述问题：


    ![$$ P\left[X\le \frac{1}{6};\lambda =2\right]-P\left[X\le \frac{1}{12};\lambda
    =2\right] $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equai.png)


    也就是说，我们计算第一位顾客在开业后 10 分钟内出现的可能性，但减去他们在前 5 分钟内出现的概率，从而得到我们感兴趣的区间的答案：


    ![$$ P\left[X\le \frac{1}{6};\lambda =2\right]-P\left[X\le \frac{1}{12};\lambda
    =2\right]=1-{e}^{-\frac{2}{6}}-1+{e}^{-\frac{2}{12}}\approx 0.13 $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equaj.png)


    这个技巧对于第一个例子也同样适用。我们只需要将减去第一位顾客在零分钟内出现的概率改为减去五分钟的概率。清单 `[3-5]` 中的代码展示了如何计算在给定速率为
    `λ` 的指数分布下，事件发生在时间 `x[1]` 和 `x[2]` 之间的可能性。


    ```

    func probability(

    between x: Double,

    and y: Double,

    rate: Double

    ) {

    precondition(0 <= x, "x mustbe non-negative.")

    precondition(0 <= y, "y must be non-negative.")

    precondition(x <= y, "x must be ≤ y.")

    precondition(0 < rate, "rate must be positive.")

    let upperCDF = 1 - exp(-rate * y)

    let lowerCDF = 1 - exp(-rate * x)

    let prob = upperCDF - lowerCDF

    print(

    """

    P[\(x) ≤ x ≤ \(y) | λ = \(rate)] = \(prob)

    """

    )

    }

    probability(between: 0, and: 1, rate: 2)

    probability(between: 0, and: 1, rate: 0.2)

    probability(between: 0, and: 0, rate: 10)

    // Prints:

    // P[0.0 ≤ x ≤ 1.0 | λ = 2.0] = 0.8646647167633873

    // P[0.0 ≤ x ≤ 1.0 | λ = 0.2] = 0.18126924692201818

    // P[0.0 ≤ x ≤ 0.0 | λ = 10.0] = 0.0

    清单 3-5

    一个在给定指数分布下计算事件发生概率的示例

    ```


    现在我们对连续样本空间有了一些经验，是时候看看最重要且最广泛使用的连续分布之一了。

    '
- fmt: '### Normal Distribution


    The French mathematician Abraham de Moivre first described the normal distribution
    in the 1700s. The discovery went under the radar for quite some time until it
    was "rediscovered" by Carl Friedrich Gauss and Pierre-Simon Laplace. It is also
    commonly referred to as the Gaussian distribution or a bell curve because it has
    the general shape of a bell.


    We can define a normal distribution by its mean and standard deviation. The mean,
    denoted by the Greek letter `μ`, specifies the most common value in the distribution.
    This value resides at the center of the curve, and the shape mirrors on each side
    of this point. The standard deviation, denoted by `σ`, describes the "wideness"
    of the bell. A greater value means that sample points tend to be farther away
    from the mean, while a smaller `σ` indicates that samples are usually closer to
    it. We will cover these concepts in greater depth later in this chapter. For now,
    it is enough to have a high-level intuition.


    Figure [3-7](#512351_1_En_3_Chapter.xhtml#Fig7) shows two normal distributions
    with the same parameter `μ`, but different `σ`. Notice how the `σ` parameter makes
    the mean less likely, while samples further away become much more probable. The
    `DistributionsApp` project also provides a tool to test how different parameter
    values change the likelihood of sample points.


    ![../images/512351_1_En_3_Chapter/512351_1_En_3_Fig7_HTML.png](images/512351_1_En_3_Chapter/512351_1_En_3_Fig7_HTML.png)


    Figure 3-7


    Two normal distributions with different parameters


    To perform calculations with the normal distribution, we need to know its PDF:


    ![$$ f(x)=\frac{1}{\sigma \sqrt{2\pi }}{e}^{-\frac{1}{2}{\left(\frac{x-\mu }{\sigma}\right)}^2}
    $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equak.png)


    This formula gives us the relative likelihood value of any sample point. It is
    worth noting that this particular sample space contains every real number, ranging
    from negative infinity to positive infinity. However, to calculate the probability
    that a sample falls within some range, we need to compute an integral:


    ![$$ P\left[{x}_1&lt;X&lt;{x}_2\right]={\int}_{x_1}^{x_2}\frac{1}{\sigma \sqrt{2\pi
    }}{e}^{-\frac{1}{2}{\left(\frac{x-\mu }{\sigma}\right)}^2} dx $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equal.png)


    We realize quickly that this is a much more complex computation than the one we
    had to perform for the exponential distribution. Unfortunately, using the CDF
    and performing the same trick we did with the exponential distribution does not
    help us. Let us look at the function to understand why:


    ![$$ P\left[X&lt;x\right]=\frac{1}{2}\left[1+\operatorname{erf}\left(\frac{x-\mu
    }{\sigma \sqrt{2}}\right)\right] $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equam.png)


    As we can see, that is one beast of a function. The normal distribution CDF relies
    on Gauss''s error function, commonly denoted by `erf(z)`. It is a complex function
    defined as


    ![$$ \operatorname{erf}(z)=\frac{2}{\sqrt{\pi }}{\int}_0^z{e}^{-{t}^2} dt $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equan.png)


    The error function also contains an integral, and it is no easier to compute than
    the one we saw on the previous page. Fortunately, researchers have developed ways
    to approximate the error function with stunning precision. *Handbook of Mathematical
    Functions with Formulas, Graphs, and Mathematical Tables* (1964, p. 299), written
    by Milton Abramovitz and Irene Stegun, contains a formula devised by Cecil Hastings
    Jr to approximate the error function. It has a relatively low computational cost
    and is easy to implement, making it very attractive for our purposes. Listing
    [3-6](#512351_1_En_3_Chapter.xhtml#PC6) provides an implementation, and Listing
    [3-7](#512351_1_En_3_Chapter.xhtml#PC7) used said implementation to approximate
    the normal distribution CDF.


    ```

    func normalCDF(

    x: Double,

    mu: Double,

    sigma: Double

    ) -> Double {

    let z = (x - mu) / (sigma * sqrt(2))

    return 0.5 * (1 + erf(z))

    }

    print(

    """

    Standard Normal Distribution

    P[X < 0] = \(normalCDF(x: 0, mu: 0, sigma: 1))

    """

    )

    // Prints:

    // Standard Normal Distribution

    // P[X < 0] = 0.5000000005

    Listing 3-7

    Computing the normal distribution CDF with Gauss’s error function approximation

    ```


    ```

    import Darwin

    let p = 0.3275911

    let coefficients = [

    0.254829592,

    -0.284496736,

    1.421413741,

    -1.453152027,

    1.061405429

    ]

    let exponents = (1 ... coefficients.count)

    .map(Double.init)

    func erf(_ z: Double) -> Double {

    let sign = (z.sign == .plus) ? 1.0 : -1.0

    let absZ = abs(z)

    let t = 1 / (1 + p * absZ)

    let powerSeries = zip(coefficients, exponents)

    .reduce(into: 0.0) { (result, zipped) in

    let (coefficient, exponent) = zipped

    result += coefficient * pow(t, exponent)

    }

    let tail = powerSeries * exp(-pow(absZ, 2))

    return sign * (1 - tail)

    }

    Listing 3-6

    Approximating Gauss’s error function

    ```


    The true solution to the CDF in Listing [3-7](#512351_1_En_3_Chapter.xhtml#PC7)
    is 0.5, while our approximation yields a result of 0.5000000005. We are okay with
    that error because it does not make a massive difference to the overall likelihood
    we are calculating. The implementation also provides the ability to calculate
    the probability of falling inside a specific range of values by using the same
    trick that we used with the exponential distribution:


    ![$$ P\left[{x}_1&lt;X&lt;{x}_2\right]=P\left[X&lt;{x}_2\right]-P\left[X&lt;{x}_1\right]
    $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equao.png)


    Approximations usually feel cheap and dirty. However, it is something that we
    have to accept and embrace. Many calculations we make on a modern computer end
    up being approximations because of limitations in bitwidth. To be fair, many mathematical
    formulas that we may think of as being exact are also approximations of empirical
    measurements.


    We now know about some of the most common standard distributions. There are, of
    course, many more than these. However, these concepts apply to those as well.
    To finish up this chapter, let us have a look at a few more properties of distributions.
    These will be used later in the book, and we must know what they are.'
  raw: '### Normal Distribution


    The French mathematician Abraham de Moivre first described the normal distribution
    in the 1700s. The discovery went under the radar for quite some time until it
    was “rediscovered” by Carl Friedrich Gauss and Pierre-Simon Laplace. It is also
    commonly referred to as the Gaussian distribution or a bell curve because it has
    the general shape of a bell.


    We can define a normal distribution by its mean and standard deviation. The mean,
    denoted by the Greek letter μ, specifies the most common value in the distribution.
    This value resides at the center of the curve, and the shape mirrors on each side
    of this point. The standard deviation, denoted by σ, describes the “wideness”
    of the bell. A greater value means that sample points tend to be farther away
    from the mean, while a smaller σ indicates that samples are usually closer to
    it. We will cover these concepts in greater depth later in this chapter. For now,
    it is enough to have a high-level intuition.


    Figure [3-7](#512351_1_En_3_Chapter.xhtml#Fig7) shows two normal distributions
    with the same parameter μ, but different σ. Notice how the σ parameter makes the
    mean less likely, while samples further away become much more probable. The DistributionsApp
    project also provides a tool to test how different parameter values change the
    likelihood of sample points.


    ![../images/512351_1_En_3_Chapter/512351_1_En_3_Fig7_HTML.png](images/512351_1_En_3_Chapter/512351_1_En_3_Fig7_HTML.png)


    Figure 3-7


    Two normal distributions with different parameters


    To perform calculations with the normal distribution, we need to know its PDF:


    ![$$ f(x)=\frac{1}{\sigma \sqrt{2\pi }}{e}^{-\frac{1}{2}{\left(\frac{x-\mu }{\sigma}\right)}^2}
    $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equak.png)


    This formula gives us the relative likelihood value of any sample point. It is
    worth noting that this particular sample space contains every real number, ranging
    from negative infinity to positive infinity. However, to calculate the probability
    that a sample falls within some range, we need to compute an integral:


    ![$$ P\left[{x}_1&lt;X&lt;{x}_2\right]={\int}_{x_1}^{x_2}\frac{1}{\sigma \sqrt{2\pi
    }}{e}^{-\frac{1}{2}{\left(\frac{x-\mu }{\sigma}\right)}^2} dx $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equal.png)


    We realize quickly that this is a much more complex computation than the one we
    had to perform for the exponential distribution. Unfortunately, using the CDF
    and performing the same trick we did with the exponential distribution does not
    help us. Let us look at the function to understand why:


    ![$$ P\left[X&lt;x\right]=\frac{1}{2}\left[1+\operatorname{erf}\left(\frac{x-\mu
    }{\sigma \sqrt{2}}\right)\right] $$](images/512351_1_En_3_Chapter/512351_1_En_3_Chapter_TeX_Equam.png)


