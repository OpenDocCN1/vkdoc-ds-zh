    we just derived in this chapter. We will also get to know a new module from the
    Accelerate framework. Instead of using CBLAS and LAPACK to do linear algebra,
    we will visit the *vDSP* API. vDSP provides functionality relating to digital
    signal processing and scientific data processing. It offers tools for working
    with vectors, Fourier transforms, convolution, and many other tasks.'
  trans: '

    ### 评分概率


    我们刚刚制定了一种策略，用于处理稀疏数据中经常出现的零概率问题。现在，让我们来看一种近似计算评分概率的方法。回想一下，我们使用以下公式定义了期望评分：


    ![$$ \mathbbm{E}\left[R\right]=\sum \limits_{r\in R\ }r\cdotp p(r) $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equab.png)


    这里我们重点关注`p(r)`这一项。假设一部电影只收到一个评分，即 4 分。运用我们刚学到的拉普拉斯平滑技术，我们可以通过以下计算来近似每个评分的概率：


    ![$$ p(0)=\frac{1}{7}\approx 0.1429 $$](img/512351_1_En_7_Chapter_TeX_Equac.png)


    ![$$ p(1)=\frac{1}{7}\approx 0.1429 $$](img/512351_1_En_7_Chapter_TeX_Equad.png)


    ![$$ p(2)=\frac{1}{7}\approx 0.1429 $$](img/512351_1_En_7_Chapter_TeX_Equae.png)


    ![$$ p(3)=\frac{1}{7}\approx 0.1429 $$](img/512351_1_En_7_Chapter_TeX_Equaf.png)


    ![$$ p(4)=\frac{2}{7}\approx 0.2857 $$](img/512351_1_En_7_Chapter_TeX_Equag.png)


    ![$$ p(5)=\frac{1}{7}\approx 0.1429 $$](img/512351_1_En_7_Chapter_TeX_Equah.png)


    这些结果看起来不错，但有一个需要解决的微妙问题。我们对评分的定义与我们构建数据的方式并不一致。请记住，零评分只是一个占位符，表示用户没有对该电影进行评分。在这种情况下，我们实际上是通过包含非评分项来稀释每个评分的概率。


    为了解决这个问题，我们将借助贝叶斯牧师（Rev. Bayes）和他的定理。回想一下，我们这样表述贝叶斯定理：


    ![$$ P\left[A\ |\ B\right]=\frac{P\left[B\ |\ A\right]\cdotp P\left[A\right]}{P\left[B\right]}
    $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equai.png)


    由于我们要寻找的是在评分大于零的条件下某个评分的概率，我们可以运用贝叶斯定理进行如下推导：


    ![$$ P\left[r\ |\ r&gt;0\right]\cdotp P\left[r&gt;0\right]=P\Big[r&gt;0\ \left|\
    r\right]\cdotp P\left[r\right] $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equaj.png)


    通过整理这个等式，我们可以分离出真正感兴趣的项，即`p(r | r > 0)`：


    ![$$ P\left[r\ |\ r&gt;0\right]=\frac{P\left[r&gt;0\ |\ r\right]\cdotp P\left[r\right]}{P\left[r&gt;0\right]}
    $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equak.png)


    上述等式才是我们真正想要的概率——在给定评分是真实评分（而非占位符）的条件下，该评分的概率。让我们逐一分析右边的每一项，看看计算它们需要什么。


    *   `P(r > 0 | r)`：对于所有真实评分，这一项为 1，因为如果评分不是占位符，那么它肯定大于零。同理，对于所有占位符，这一项为零。由于占位符本身为零，我们可以从等式中去掉这一项。在这两种情况下，它都不会产生影响。


    *   `P(r)`：这一项是通过拉普拉斯平滑得到的近似概率。我们有一种方法可以基于数据计算所有电影的此项比例。


    *   `P(r > 0)`：评分大于零的概率也可以通过拉普拉斯平滑得到。我们可以将所有大于零的评分的概率相加，或者用 1 减去零评分的概率。


    根据这个推理，我们可以将期望评分的公式重写为：


    ![$$ \mathbbm{E}\left[R\right]=\sum \limits_{r\in R}r\cdotp p\left(r\ |\ r&gt;0\right)=\sum
    \limits_{r\in R}r\cdotp \frac{p(r)}{p\left(r&gt;0\right)} $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equal.png)


    就是这样。我们得出了一个可以计算期望评分的公式。借助相似度度量和拉普拉斯平滑，我们已经准备好实现一个电影推荐算法。


    ## 实现算法


    本节将介绍如何用 Swift 实现我们刚刚在本章推导出的推荐算法。我们还将了解 Accelerate 框架中的一个新模块。我们将使用`vDSP` API，而不是用
    CBLAS 和 LAPACK 进行线性代数运算。`vDSP`提供了与数字信号处理和科学数据处理相关的功能，提供了用于处理向量、傅里叶变换、卷积以及许多其他任务的工具。

    '
- fmt: "### The Main Program\n\nBefore getting into the details, let us look at the\
    \ main program to acquaint ourselves with the general structure. Listing [7-1](#512351_1_En_7_Chapter.xhtml#PC1)\
    \ shows the implementation.\n\n```\nvar raters = DataLoader.load(\n    MovieWatcher.self,\n\
    \    from: .movieRatings\n)\nlet user = raters.remove(at: 0)\nlet recommendations\
    \ = MovieRecommender\n    .recommend(\n        movies: 5,\n        for: user,\n\
    \        from: raters,\n        neighbors: 30\n    )\nListing 7-1\nThe main program\
    \ of our recommender system.\n```\n\nAs per usual, we start by loading the data\
    \ set into memory and decoding it into Swift types that we can use. The `MovieWatcher`\
    \ type consists of a user ID, an array of movie ratings, and an array of corresponding\
    \ movie titles, as shown in Listing [7-2](#512351_1_En_7_Chapter.xhtml#PC2).\n\
    \nWe remove and store away the first user in the collection of movie enthusiasts.\
    \ We placed this user first because they have a very nice and clean set of genre\
    \ preferences, namely, comedy and horror. That way, we have a chance to verify\
    \ that the recommendations we receive on the other end are reasonable.\n\nAfter\
    \ separating the user looking for recommendations from the rest, we call into\
    \ the `MovieRecommender` and ask it to suggest five movies based on the methods\
    \ covered in this chapter. The result is an array of strings containing recommended\
    \ movie titles.\n\n```\nstruct MovieWatcher {\n    let id: Int\n    let titles:\
    \ [String]\n    let ratings: [Double]\n}\nListing 7-2\nThe definition of the MovieWatcher\
    \ type\n```\n\nTo complete the task at hand, the `MovieRecommender` needs to determine\
    \ which 30 users are most similar to the one asking for suggestions. We call these\
    \ 30 users for *neighbors* since that is a common term when looking for close-by\
    \ data points in this manner.\n\nThe recommender also needs to compute the Laplace\
    \ smoothed rating distribution from those neighbors, calculate the expected rating\
    \ for each movie, and return a requested number of titles for which those expectations\
    \ are highest. Listing [7-3](#512351_1_En_7_Chapter.xhtml#PC3) shows the implementation\
    \ of the method `recommend(movies:for:from:neighbors:)`.\n\n```\nfunc recommend(\n\
    \    movies: Int,\n    for someone: MovieWatcher,\n    from others: [MovieWatcher],\n\
    \    neighbors: Int\n) -> [String] {\n    let similarUsers = getMostSimilar(\n\
    \        to: someone,\n        from: others,\n        neighbors: neighbors\n \
    \   )\n    let ratingDist = ratingDistributions(\n        from: similarUsers,\n\
    \        movieCount: someone.ratings.count,\n        neighbors: neighbors\n  \
    \  )\n    let expectations = expectedRatings(\n        using: ratingDist\n   \
    \ )\n    return getTopRated(\n        movies: movies,\n        for: someone,\n\
    \        expectations: expectations\n    )\n}\nListing 7-3\nThe implementation\
    \ of recommend(movies:for:from:neighbors:)\n```\n\nLike in Chapter [6](#512351_1_En_6_Chapter.xhtml),\
    \ we split the different subproblems into helper functions. This approach makes\
    \ for better readability and understanding of what `recommend(movies:for:from:neighbors:)`\
    \ does. The first step is to compute the 30 most similar users, which we delegate\
    \ to `getMostSimilar(to:from:neighbors:)`. Listing [7-4](#512351_1_En_7_Chapter.xhtml#PC4)\
    \ shows the implementation of that method.\n\n```\nprivate static func getMostSimilar(\n\
    \    to someone: MovieWatcher,\n    from others: [MovieWatcher],\n    neighbors:\
    \ Int\n) -> [MovieWatcher] {\n    let similarities = others\n        .map { other\
    \ in\n            similarity(lhs: someone, rhs: other)\n        }\n    let mostSimilar\
    \ = similarities\n        .enumerated()\n        .sorted { lhs, rhs in\n     \
    \       lhs.element < rhs.element\n        }\n        .dropLast(others.count -\
    \ neighbors)\n        .map { offset, element in\n            others[offset]\n\
    \        }\n    return mostSimilar\n}\nListing 7-4\nThe implementation of getMostSimilar(to:from:neighbors:)\n\
    ```\n\nWe start by mapping all users to their respective similarity measures.\
    \ We use the Euclidean squared distance we talked about earlier and will discuss\
    \ the implementation in a moment.\n\nOnce we have all similarities, we bundle\
    \ them with their respective array index by calling `enumerated()` and sort them\
    \ in ascending order according to the similarity value. Remember that the more\
    \ similar two users are, the smaller the similarity value will be. Finally, we\
    \ drop all but the first `neighbor`'s similarities and map them back to their\
    \ corresponding user. This operation leaves us with an array containing the most\
    \ similar number of users, which we return to the calling function.\n\nTo fully\
    \ understand this function, we need to look at the method `similarity(lhs:rhs:)`.\
    \ Listing [7-5](#512351_1_En_7_Chapter.xhtml#PC5) shows the implementation.\n\n\
    ```\nfunc similarity(\n    lhs: MovieWatcher,\n    rhs: MovieWatcher\n) -> Double\
    \ {\n    var (left, right) = (lhs.ratings, rhs.ratings)\n    for index in 0 ..<\
    \ left.count {\n        if left[index] == 0 {\n            right[index] = 5\n\
    \        } else if right[index] == 0 {\n            left[index] = 5\n        }\n\
    \    }\n    return vDSP\n        .distanceSquared(\n            left,\n      \
    \      right\n        )\n}\nListing 7-5\nOur implementation of the method similarity(lhs:rhs:)\n\
    ```\n\nThis function contains two interesting parts. First, it fetches the two\
    \ users' rating collections. Remember that we wanted missing ratings to decrease\
    \ the similarity between two users. Therefore, the algorithm sets the two ratings\
    \ to zero and five for all movies where at least one rating is missing, making\
    \ the distance contribution as large as possible.\n\nFinally, we make use of the\
    \ `vDSP` module for the first time. We show the definition of `distanceSquared(_:_:)`\
    \ in Listing [7-6](#512351_1_En_7_Chapter.xhtml#PC6) for reference.\n\n```\nstatic\
    \ func distanceSquared(\n    _ pointA: U,\n    _ pointB: V\n) -> Double\n    where\
    \ U : AccelerateBuffer,\n          V : AccelerateMutableBuffer,\n          U.Element\
    \ == Double,\n          V.Element == Double\nListing 7-6\nThe definition of vDSP.distanceSquared(_:_:)\n\
    ```\n\nSince there are a lot of generics and constraints going on, we will try\
    \ to break down the most important things to know. First of all, the method takes\
    \ two vectors as arguments. The vectors represent the two points that we want\
    \ to use for our calculations. They are constrained by the requirement that they\
    \ need to conform to the `AccelerateBuffer` and `AccelerateMutableBuffer` protocols.\
    \ They are also constrained such that the elements inside the vectors need to\
    \ be of the type `Double`. Upon completion, this method returns the Euclidean\
    \ squared distance between the provided points.\n\nNow that we have extracted\
    \ the most similar users, we can calculate the distribution of different ratings\
    \ for each movie. The `ratingDistributions(from:movieCount:neighbors:)` method\
    \ uses the Laplace smoothing technique to approximate the distribution of ratings\
    \ for each of the available movies. Listing [7-7](#512351_1_En_7_Chapter.xhtml#PC7)\
    \ shows the implementation.\n\n```\nfunc ratingDistributions(\n    from similarUsers:\
    \ [MovieWatcher],\n    movieCount: Int,\n    neighbors: Int\n) -> [[Double]] {\n\
    \    let N = neighbors.realValue\n    let pseudoCount = 1.0\n    let numRatings\
    \ = 6\n    let total = N + numRatings.realValue * pseudoCount\n    let columns\
    \ = [Double](\n        repeating: pseudoCount,\n        count: numRatings\n  \
    \  )\n    let ratingMatrix = [[Double]](\n        repeating: columns,\n      \
    \  count: movieCount\n    )\n    let counts = similarUsers\n        .reduce(into:\
    \ ratingMatrix) { matrix, user in\n            user.ratings\n                .enumerated()\n\
    \                .forEach { movie, rating in\n                    matrix[movie][Int(rating)]\
    \ += 1\n                }\n        }\n    return counts\n        .map { movieRatings\
    \ in\n            movieRatings.map { rating in\n                rating / total\n\
    \            }\n        }\n}\nListing 7-7\nComputing the rating distributions\
    \ for each movie\n```\n\nIn the first couple of lines, we determine the size of\
    \ our pseudocount and compute the total number of data points we will have for\
    \ each movie after counting. We create a matrix with one row for each movie and\
    \ one column for each rating between zero and five. Using the same enumeration\
    \ trick as before, we can track which movie receives a specific rating and increment\
    \ the corresponding counter. Finally, we turn the counts into proportions by dividing\
    \ by the total number of data points we computed at the top of the function."
  raw: '### The Main Program


    Before getting into the details, let us look at the main program to acquaint ourselves
    with the general structure. Listing [7-1](#512351_1_En_7_Chapter.xhtml#PC1) shows
    the implementation.


    ```

    var raters = DataLoader.load(

    MovieWatcher.self,

    from: .movieRatings

    )

    let user = raters.remove(at: 0)

    let recommendations = MovieRecommender

    .recommend(

    movies: 5,

    for: user,

    from: raters,

    neighbors: 30

    )

    Listing 7-1

    The main program of our recommender system.

    ```


    As per usual, we start by loading the data set into memory and decoding it into
    Swift types that we can use. The `MovieWatcher` type consists of a user ID, an
    array of movie ratings, and an array of corresponding movie titles, as shown in
    Listing [7-2](#512351_1_En_7_Chapter.xhtml#PC2).


    We remove and store away the first user in the collection of movie enthusiasts.
    We placed this user first because they have a very nice and clean set of genre
    preferences, namely, comedy and horror. That way, we have a chance to verify that
    the recommendations we receive on the other end are reasonable.


    After separating the user looking for recommendations from the rest, we call into
    the `MovieRecommender` and ask it to suggest five movies based on the methods
    covered in this chapter. The result is an array of strings containing recommended
    movie titles.


    ```

    struct MovieWatcher {

    let id: Int

    let titles: [String]

    let ratings: [Double]

    }

    Listing 7-2

    The definition of the MovieWatcher type

    ```


    To complete the task at hand, the `MovieRecommender` needs to determine which
    30 users are most similar to the one asking for suggestions. We call these 30
    users for *neighbors* since that is a common term when looking for close-by data
    points in this manner.


    The recommender also needs to compute the Laplace smoothed rating distribution
    from those neighbors, calculate the expected rating for each movie, and return
    a requested number of titles for which those expectations are highest. Listing
    [7-3](#512351_1_En_7_Chapter.xhtml#PC3) shows the implementation of the method
    `recommend(movies:for:from:neighbors:)`.


    ```

    func recommend(

    movies: Int,

    for someone: MovieWatcher,

    from others: [MovieWatcher],

    neighbors: Int

    ) -> [String] {

    let similarUsers = getMostSimilar(

    to: someone,

    from: others,

    neighbors: neighbors

    )

    let ratingDist = ratingDistributions(

    from: similarUsers,

    movieCount: someone.ratings.count,

    neighbors: neighbors

    )

    let expectations = expectedRatings(

    using: ratingDist

    )

    return getTopRated(

    movies: movies,

    for: someone,

    expectations: expectations

    )

    }

    Listing 7-3

    The implementation of recommend(movies:for:from:neighbors:)

    ```


    Like in Chapter [6](#512351_1_En_6_Chapter.xhtml), we split the different subproblems
    into helper functions. This approach makes for better readability and understanding
    of what `recommend(movies:for:from:neighbors:)` does. The first step is to compute
    the 30 most similar users, which we delegate to `getMostSimilar(to:from:neighbors:)`.
    Listing [7-4](#512351_1_En_7_Chapter.xhtml#PC4) shows the implementation of that
    method.


    ```

    private static func getMostSimilar(

    to someone: MovieWatcher,

    from others: [MovieWatcher],

    neighbors: Int

    ) -> [MovieWatcher] {

    let similarities = others

    .map { other in

    similarity(lhs: someone, rhs: other)

    }

    let mostSimilar = similarities

    .enumerated()

    .sorted { lhs, rhs in

    lhs.element < rhs.element

    }

    .dropLast(others.count - neighbors)

    .map { offset, element in

    others[offset]

    }

    return mostSimilar

    }

    Listing 7-4

    The implementation of getMostSimilar(to:from:neighbors:)

    ```


    We start by mapping all users to their respective similarity measures. We use
    the Euclidean squared distance we talked about earlier and will discuss the implementation
    in a moment.


    Once we have all similarities, we bundle them with their respective array index
    by calling `enumerated()` and sort them in ascending order according to the similarity
    value. Remember that the more similar two users are, the smaller the similarity
    value will be. Finally, we drop all but the first `neighbor''s` similarities and
    map them back to their corresponding user. This operation leaves us with an array
    containing the most similar number of users, which we return to the calling function.


    To fully understand this function, we need to look at the method `similarity(lhs:rhs:)`.
    Listing [7-5](#512351_1_En_7_Chapter.xhtml#PC5) shows the implementation.


    ```

    func similarity(

    lhs: MovieWatcher,

    rhs: MovieWatcher

    ) -> Double {

    var (left, right) = (lhs.ratings, rhs.ratings)

    for index in 0 ..< left.count {

    if left[index] == 0 {

    right[index] = 5

    } else if right[index] == 0 {

    left[index] = 5

    }

    }

    return vDSP

    .distanceSquared(

    left,

    right

    )

    }

    Listing 7-5

    Our implementation of the method similarity(lhs:rhs:)

    ```


    This function contains two interesting parts. First, it fetches the two users’
    rating collections. Remember that we wanted missing ratings to decrease the similarity
    between two users. Therefore, the algorithm sets the two ratings to zero and five
    for all movies where at least one rating is missing, making the distance contribution
    as large as possible.


    Finally, we make use of the vDSP module for the first time. We show the definition
    of `distanceSquared(_:_:)` in Listing [7-6](#512351_1_En_7_Chapter.xhtml#PC6)
    for reference.


    ```

    static func distanceSquared(

    _ pointA: U,

    _ pointB: V

    ) -> Double

    where U : AccelerateBuffer,

    V : AccelerateMutableBuffer,

    U.Element == Double,

    V.Element == Double

    Listing 7-6

    The definition of vDSP.distanceSquared(_:_:)

    ```


    Since there are a lot of generics and constraints going on, we will try to break
    down the most important things to know. First of all, the method takes two vectors
    as arguments. The vectors represent the two points that we want to use for our
    calculations. They are constrained by the requirement that they need to conform
    to the `AccelerateBuffer` and `AccelerateMutableBuffer` protocols. They are also
    constrained such that the elements inside the vectors need to be of the type `Double`.
    Upon completion, this method returns the Euclidean squared distance between the
    provided points.


    Now that we have extracted the most similar users, we can calculate the distribution
    of different ratings for each movie. The `ratingDistributions(from:movieCount:neighbors:)`
    method uses the Laplace smoothing technique to approximate the distribution of
    ratings for each of the available movies. Listing [7-7](#512351_1_En_7_Chapter.xhtml#PC7)
    shows the implementation.


    ```

    func ratingDistributions(

    from similarUsers: [MovieWatcher],

    movieCount: Int,

    neighbors: Int

    ) -> [[Double]] {

    let N = neighbors.realValue

    let pseudoCount = 1.0

    let numRatings = 6

    let total = N + numRatings.realValue * pseudoCount

    let columns = [Double](

    repeating: pseudoCount,

    count: numRatings

    )

    let ratingMatrix = [[Double]](

    repeating: columns,

    count: movieCount

    )

    let counts = similarUsers

    .reduce(into: ratingMatrix) { matrix, user in

    user.ratings

    .enumerated()

    .forEach { movie, rating in

    matrix[movie][Int(rating)] += 1

    }

    }

    return counts

    .map { movieRatings in

    movieRatings.map { rating in

    rating / total

    }

    }

    }

    Listing 7-7

    Computing the rating distributions for each movie

    ```


    In the first couple of lines, we determine the size of our pseudocount and compute
    the total number of data points we will have for each movie after counting. We
    create a matrix with one row for each movie and one column for each rating between
    zero and five. Using the same enumeration trick as before, we can track which
    movie receives a specific rating and increment the corresponding counter. Finally,
    we turn the counts into proportions by dividing by the total number of data points
    we computed at the top of the function.'
  trans: "\n### 主程序\n\n在深入细节之前，我们先来看一下主程序，以熟悉其整体结构。清单 7-1 展示了其实现。\n\n```\nvar raters\
    \ = DataLoader.load(\n    MovieWatcher.self,\n    from: .movieRatings\n)\nlet\
    \ user = raters.remove(at: 0)\nlet recommendations = MovieRecommender\n    .recommend(\n\
    \        movies: 5,\n        for: user,\n        from: raters,\n        neighbors:\
    \ 30\n    )\n清单 7-1\n推荐系统的主程序。\n```\n\n像往常一样，我们首先将数据集加载到内存中，并解码成我们可以使用的 Swift\
    \ 类型。`MovieWatcher` 类型包含一个用户 ID、一个电影评分数组以及一个对应的电影标题数组，如清单 7-2 所示。\n\n我们从电影爱好者集合中移除并存储第一个用户。之所以将这个用户放在首位，是因为他有一组非常清晰且规整的类型偏好，即喜剧片和恐怖片。这样，我们就有机会验证另一端收到的推荐是否合理。\n\
    \n在将寻求推荐的用户与其他用户分开后，我们调用 `MovieRecommender`，请求它根据本章介绍的方法推荐五部电影。结果是一个包含推荐电影标题的字符串数组。\n\
    \n```\nstruct MovieWatcher {\n    let id: Int\n    let titles: [String]\n    let\
    \ ratings: [Double]\n}\n清单 7-2\nMovieWatcher 类型的定义\n```\n\n为了完成当前任务，`MovieRecommender`\
    \ 需要确定哪 30 个用户与提出建议的用户最为相似。我们将这 30 个用户称为*邻居*，因为这是以这种方式寻找邻近数据点时常用的术语。\n\n推荐器还需要根据这些邻居计算经过拉普拉斯平滑处理的评分分布，计算每部电影的期望评分，并返回指定数量的期望评分最高的电影标题。清单\
    \ 7-3 展示了 `recommend(movies:for:from:neighbors:)` 方法的实现。\n\n```\nfunc recommend(\n\
    \    movies: Int,\n    for someone: MovieWatcher,\n    from others: [MovieWatcher],\n\
    \    neighbors: Int\n) -> [String] {\n    let similarUsers = getMostSimilar(\n\
    \        to: someone,\n        from: others,\n        neighbors: neighbors\n \
    \   )\n    let ratingDist = ratingDistributions(\n        from: similarUsers,\n\
    \        movieCount: someone.ratings.count,\n        neighbors: neighbors\n  \
    \  )\n    let expectations = expectedRatings(\n        using: ratingDist\n   \
    \ )\n    return getTopRated(\n        movies: movies,\n        for: someone,\n\
    \        expectations: expectations\n    )\n}\n清单 7-3\nrecommend(movies:for:from:neighbors:)\
    \ 方法的实现\n```\n\n与第 6 章类似，我们将不同的子问题拆分成辅助函数。这种方法使代码更具可读性，也更容易理解 `recommend(movies:for:from:neighbors:)`\
    \ 的功能。第一步是计算 30 个最相似的用户，这一任务委托给了 `getMostSimilar(to:from:neighbors:)`。清单 7-4 展示了该方法的实现。\n\
    \n```\nprivate static func getMostSimilar(\n    to someone: MovieWatcher,\n  \
    \  from others: [MovieWatcher],\n    neighbors: Int\n) -> [MovieWatcher] {\n \
    \   let similarities = others\n        .map { other in\n            similarity(lhs:\
    \ someone, rhs: other)\n        }\n    let mostSimilar = similarities\n      \
    \  .enumerated()\n        .sorted { lhs, rhs in\n            lhs.element < rhs.element\n\
    \        }\n        .dropLast(others.count - neighbors)\n        .map { offset,\
    \ element in\n            others[offset]\n        }\n    return mostSimilar\n\
    }\n清单 7-4\ngetMostSimilar(to:from:neighbors:) 方法的实现\n```\n\n我们首先将所有用户映射到各自的相似度度量上。这里使用的是我们之前讨论过的欧几里得平方距离，稍后我们会讨论其实现。\n\
    \n一旦获得所有相似度，我们通过调用 `enumerated()` 将它们与各自的数组索引捆绑起来，并根据相似度值按升序排序。请记住，两个用户越相似，他们的相似度值就越小。最后，我们丢弃除前\
    \ `neighbor` 个相似度之外的所有内容，并将它们映射回对应的用户。此操作会留下一个包含最相似用户数量的数组，并将其返回给调用函数。\n\n为了全面理解这个函数，我们需要查看\
    \ `similarity(lhs:rhs:)` 方法。清单 7-5 展示了其实现。\n\n```\nfunc similarity(\n    lhs:\
    \ MovieWatcher,\n    rhs: MovieWatcher\n) -> Double {\n    var (left, right) =\
    \ (lhs.ratings, rhs.ratings)\n    for index in 0 ..< left.count {\n        if\
    \ left[index] == 0 {\n            right[index] = 5\n        } else if right[index]\
    \ == 0 {\n            left[index] = 5\n        }\n    }\n    return vDSP\n   \
    \     .distanceSquared(\n            left,\n            right\n        )\n}\n\
    清单 7-5\nsimilarity(lhs:rhs:) 方法的实现\n```\n\n这个函数包含两个有趣的部分。首先，它获取两个用户的评分集合。请记住，我们希望缺失的评分会降低两个用户之间的相似度。因此，对于至少有一个评分缺失的所有电影，该算法将这两个评分分别设置为\
    \ 0 和 5，从而使距离贡献尽可能大。\n\n最后，我们首次使用了 `vDSP` 模块。清单 7-6 展示了 `distanceSquared(_:_:)`\
    \ 的定义，供参考。\n\n```\nstatic func distanceSquared(\n    _ pointA: U,\n    _ pointB:\
    \ V\n) -> Double\n    where U : AccelerateBuffer,\n          V : AccelerateMutableBuffer,\n\
    \          U.Element == Double,\n          V.Element == Double\n清单 7-6\nvDSP.distanceSquared(_:_:)\
    \ 的定义\n```\n\n由于这里涉及大量的泛型和约束，我们将尝试分解出最重要的信息。首先，该方法接受两个向量作为参数。这些向量代表我们要用于计算的两个点。它们受到必须遵循\
    \ `AccelerateBuffer` 和 `AccelerateMutableBuffer` 协议的要求约束。同时，这些向量内部的元素必须为 `Double`\
    \ 类型。完成后，该方法返回所提供点之间的欧几里得平方距离。\n\n现在我们已经提取了最相似的用户，可以计算每部电影的不同评分分布了。`ratingDistributions(from:movieCount:neighbors:)`\
    \ 方法使用拉普拉斯平滑技术来近似每部可用电影的评分分布。清单 7-7 展示了其实现。\n\n```\nfunc ratingDistributions(\n\
    \    from similarUsers: [MovieWatcher],\n    movieCount: Int,\n    neighbors:\
    \ Int\n) -> [[Double]] {\n    let N = neighbors.realValue\n    let pseudoCount\
    \ = 1.0\n    let numRatings = 6\n    let total = N + numRatings.realValue * pseudoCount\n\
    \    let columns = Double\n    let ratingMatrix = [[Double]](\n        repeating:\
    \ columns,\n        count: movieCount\n    )\n    let counts = similarUsers\n\
    \        .reduce(into: ratingMatrix) { matrix, user in\n            user.ratings\n\
    \                .enumerated()\n                .forEach { movie, rating in\n\
    \                    matrix[movie][Int(rating)] += 1\n                }\n    \
    \    }\n    return counts\n        .map { movieRatings in\n            movieRatings.map\
    \ { rating in\n                rating / total\n            }\n        }\n}\n清单\
    \ 7-7\n计算每部电影的评分分布\n```\n\n在前几行中，我们确定了伪计数的规模，并计算出每部电影在计数后拥有的数据点总数。我们创建了一个矩阵，每部电影一行，0\
    \ 到 5 之间的每个评分一列。使用与之前相同的枚举技巧，我们可以追踪哪部电影获得了特定评分，并递增相应的计数器。最后，通过除以函数开头计算出的数据点总数，我们将计数转换为比例。\n"
- fmt: '当此方法返回时，它会返回一个矩阵，该矩阵指定了一部电影获得某个评分的近似概率。我们基于先前计算的邻居来确定这些概率，因此它们应该能在一定程度上代表请求建议的用户可能如何评价每部电影。现在我们有了可供使用的分布，终于可以开始计算每部电影的期望评分。代码清单
    [7-8](#512351_1_En_7_Chapter.xhtml#PC8) 展示了`expectedRatings(using:)`的实现，它为我们处理了这项任务。


    ```

    func expectedRatings(

    using ratingsDist: [[Double]]

    ) -> [Double] {

    ratingsDist

    .map { distribution -> Double in

    let bayesDenom = 1 - distribution[0]

    return distribution

    .enumerated()

    .dropFirst()

    .reduce(into: 0.0) { expectation, args in

    let (intRating, prob) = args

    let rating = intRating.realValue

    expectation += rating * prob / bayesDenom

    }

    }

    }

    Listing 7-8

    Calculating an expected rating for each movie in the collection

    ```


    程序会遍历每部电影的评分分布数组。对于每个分布，我们计算项`p(r > 0)`并将其存储在名为`bayesDenom`的变量中。我们使用枚举技巧来获取每个评分及其对应的概率，丢弃第一个条目（因为它包含未评分的占位符），然后使用我们之前推导的公式计算期望值。


    此函数生成一个实数数组，每个实数对应一部电影。每个数字代表由最相似用户确定的一部电影的期望评分。这个期望值集合应该能大致代表我们为其推荐建议的用户会如何评价每部电影。剩下要做的就是提取评分最高的电影并返回它们的名称。代码清单
    [7-9](#512351_1_En_7_Chapter.xhtml#PC9) 展示了`getTopRated(movies:for:expectations:)`，它执行最后一步并完成电影推荐任务。


    ```

    private static func getTopRated(

    movies: Int,

    for someone: MovieWatcher,

    expectations: [Double]

    ) -> [String] {

    expectations

    .enumerated()

    .sorted { lhs, rhs in

    if someone.ratings[lhs.offset] != 0 {

    return false

    }

    if someone.ratings[rhs.offset] != 0 {

    return true

    }

    return lhs.element > rhs.element

    }

    .dropLast(expectations.count - movies)

    .map { index, _ in

    someone.titles[index]

    }

    }

    Listing 7-9

    Mapping the top expected ratings to a collection of recommended movies

    ```


    这个处理流程中的大多数阶段现在应该看起来都很熟悉了。枚举将每个期望评分与其所描述的电影的索引配对。然而，排序阶段做了一些不那么显而易见的事情。即使一部电影可能有很高的期望评分，但如果用户已经评价过它，我们也不想推荐它。因此，我们不仅基于期望值进行排序，还添加了两个条件，将已评分的电影排到列表更靠后的位置。


    排序完成后，我们只保留前`movie`个评分，并将它们映射回各自的标题。这两个阶段生成一个电影标题数组，我们可以将其返回给主程序并显示给用户。代码清单 [7-10](#512351_1_En_7_Chapter.xhtml#PC10)
    展示了我们在主程序中打印推荐结果。


    ```

    print(

    """

    Recommended movies for user \(user.id):

    \(

    recommendations

    .joined(separator: "\n")

    )

    """

    )

    // Prints:

    // Recommended movies for user 1:

    //

    // Dawn Patrol

    // Surfer, Dude

    // Winnie Mandela

    // Grand Theft Parsons

    // An American in Hollywood

    Listing 7-10

    Printing the suggested movies for the user with ID 1

    ```


    我们现在有一些电影建议了！我们知道我们为其提供建议的用户是喜剧和恐怖片的粉丝，那么让我们评估一下这些推荐是否合理。表 [7-4](#512351_1_En_7_Chapter.xhtml#Tab4)
    列出了每部推荐电影的类型。


    **表 7-4**

    推荐电影及其类型


    | 电影 | 类型 |

    | --- | --- |

    | *Dawn Patrol* | 惊悚/剧情 |

    | *Surfer, Dude* | 喜剧 |

    | *Winnie Mandela* | 历史/剧情 |

    | *Grand Theft Parsons* | 喜剧/剧情 |

    | *An American in Hollywood* | 喜剧/剧情 |


    这些结果看起来相当不错。推荐中有不少喜剧片。可以说，有一部惊悚片在某种意义上也与恐怖类型相关。


    唯一与用户类型偏好不太吻合的电影是*Winnie Mandela*，这是一部剧情片。然而，这些电影都是由与我们的用户喜欢许多相同电影的其他用户推荐的。即使类型不完全匹配，它也可能是一个不错的选择。请记住，这种协同过滤的思路是观察一群志同道合的人对一部电影的感知质量。由于类型不是那么重要，我们最终可能会得到一些跨越类型偏好界限但用户仍可能喜欢的推荐。


