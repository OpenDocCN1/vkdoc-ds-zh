- fmt: '# Recommender Systems


    A recommender system is, at its heart, a system that tries to predict a preference.
    These systems are prevalent in different kinds of webshops, social media platforms,
    and streaming services. Some examples of recommender systems in action follow:


    - The Netflix main page suggests a batch of movies that we might enjoy.

    - YouTube shows a list of video clips that might pique our interest.

    - LinkedIn and Facebook show us suggestions of people we may want to connect with
    or befriend.

    - Twitter shows posts from people we are not familiar with, but that tweet about
    things we might like.

    - Amazon suggests additional products that we might be interested in buying.


    The preceding examples are just a few of the most prominent examples, but the
    point is clear – recommender systems are everywhere, and they impact how we spend
    our time, money, and attention.


    ## The Functions of Recommender Systems


    There are many reasons why we developed recommender systems, and some of them
    are more obvious than others. Let us take a look at the *why* so that we can better
    reason about the *how* later.


    First of all, good recommendations increase the likelihood of upsales. An online
    store that makes good suggestions about additional products is more likely to
    sell additional goods. For example, imagine that we place a TV in our shopping
    cart at an online electronics store. The store could make a little bit more money
    by suggesting a pack of batteries for the remote, some screen cleaner wipes, or
    a wall mount. Those all seem like good things to present to someone on their way
    to buy a television. However, they may not be so lucky if they show a computer
    or a coffee maker. Of course, the customer could also be looking for precisely
    those things, but that seems like an unsafe bet.


    Secondly, good recommendations make the customer feel at home. We have all experienced
    the feeling when a website suggests that we purchase completely lunatic products.
    That feeling can even cause potential customers to leave the site and never return.
    A service that makes appropriate suggestions makes the user feel seen and understood,
    which makes the experience of using it that much better. By this logic, a sound
    recommender system serves both the company that sells products and the customers
    that use it. For example, Netflix would not have the same base of engaged viewers
    if their applications had just suggested random movies from any genre.


    ## Approaching the Problem


    Making suggestions like this is by no means an easy topic, and there is plenty
    of ongoing research in this area. This chapter will take a similar route as we
    did when deriving the formulas for linear regression. We will start with a simple
    but somewhat naive rule for making movie suggestions, discuss its implications,
    and improve it. In the end, we will land on a method called *collaborative filtering*,
    which we will implement to suggest movies for a user.


    ### First Approach


    Our first rule for suggesting movies is to pick some movies at random, regardless
    of their genre or rating. This rule is straightforward to reason about and implement,
    so it is attractive from a complexity viewpoint. However, there are some inherent
    problems with such an approach.


    - We are equally likely to pick a movie with a bad rating as with a good rating.
    Thanks to this, we are likely to suggest a mix of movies that vary significantly
    in quality. Another issue comes around as we make more and more suggestions. Over
    time, the distribution of good and bad movies we suggest will tend toward the
    ratings of all available movies. This property means that if we have a greater
    number of bad movies available, we will suggest more bad movies than good ones.
    That is a real problem!

    - We are also equally likely to pick a movie regardless of its genre, which is
    prone to the same problems uncovered in the previous bullet point. We will suggest
    movies from different genres, even if the user is only interested in one or two.
    This choice will also follow the general distribution of genres, so we will suggest
    more drama movies if more drama movies are available.


    As we can see, the simplicity of our first approach comes with a few severe problems.
    The users may abandon the service if it suggests movies that do not match their
    preferences. To alleviate these issues, we suggest two refinements:


    1. When making suggestions, we should consider a movie’s rating, and movies with
    a higher rating should be more likely to be selected.

    2. We should also consider genres in our selection. If a user has specified that
    they only like horror movies, there is little to no gain in suggesting documentaries
    or drama movies.


    ### Second Approach


    To mitigate some of the problems associated with the first approach, we update
    our selection rule based on the suggested refinements. This time around, we start
    by filtering all movies not labeled with the user’s preferred genres. After filtering,
    we select the ones that have the best rating. This approach is slightly better
    since we only suggest highly rated movies in genres the user likes. However, there
    are other issues with this approach that are more subtle:


    - The user might miss out on movies in other related genres. For example, there
    is a significant chance that they might enjoy some thriller movies, even if they
    have only selected horror movies as a preference.

    - This approach also puts the collective opinion before the user’s judgment. Since
    we select movies with a high rating, we might suggest a movie similar to another
    film that the user did not like. For example, it would probably be a poor choice
    to suggest *Scream 2* to a user who did not enjoy the first movie, even if most
    other users gave it a good rating.


    Even though this approach seems better than the first one, it still has a few
    annoying flaws that we want to address. We need a method that puts less weight
    on exact genres but cares more about which movies we do and do not enjoy. To tackle
    this issue, we turn to the concept of *collaborative filtering*.'
