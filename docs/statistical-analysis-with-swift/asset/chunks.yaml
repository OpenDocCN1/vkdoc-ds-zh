- fmt: "### Implementing Multiple Linear Regression\n\nNow that we have worked out\
    \ the mathematics, we are ready to start working on the implementation. In this\
    \ section, we will introduce the `Accelerate` framework. `Accelerate` is a collection\
    \ of libraries that focus on mathematical calculations and high performance. It\
    \ uses the CPU’s vector processing capabilities to speed up intensive computations\
    \ and process many values in parallel.\n\nWe will reuse the general structure\
    \ of the `SimpleLinearRegression` struct. We will fit the model in the initializer,\
    \ use generic types to make the struct reusable across arbitrary data types, target\
    \ the interesting variables with `KeyPath`s, and use a `predict(x:)` function\
    \ to make predictions for new data points. However, since we want to target multiple\
    \ variables, we are going to use variadic parameters. Listing [4-4](#512351_1_En_4_Chapter.xhtml#PC4)\
    \ shows the new initializer definition we are going to use for this task.\n\n\
    ```\ninit(from samples: [Element],\n      data: KeyPath...,\n      target: KeyPath)\
    \ throws\nListing 4-4\nThe initializer definition for our MultipleLinearRegression\
    \ type\n```\n\nThis initializer looks very much like the one for simple linear\
    \ regression. The difference lies in the ellipsis appended to the `data` parameter\
    \ type. This dot-dot-dot syntax makes the argument variadic, meaning that we can\
    \ target an arbitrary number of variables so long as they fit the declared `KeyPath`\
    \ type. Listing [4-5](#512351_1_En_4_Chapter.xhtml#PC5) shows two perfectly valid\
    \ uses of this initializer.\n\n```\nlet points: [Point3D] = ...\nlet singleVar\
    \ = MultipleLinearRegression(\n    from: points,\n    data: \\.x,\n    target:\
    \ \\.z\n)\nlet multiVar = MultipleLinearRegression(\n    from: points,\n    data:\
    \ \\.x, \\.y,\n    target: \\.z\n)\nListing 4-5\nTwo ways to target different\
    \ variables using variadic parameters\n```\n\nAs we can see, variadic parameters\
    \ give us plenty of flexibility when choosing which variables to include in our\
    \ calculations. This approach makes it easier to perform and test multiple models\
    \ that target different subsets of our available information.\n\nNow that we have\
    \ lined out how to use `MultipleLinearRegression`, let us dig into the details\
    \ of how it operates. We will split the entire body of the initializer into several\
    \ listings so that we can reason about each part separately. Starting out, Listing\
    \ [4-6](#512351_1_En_4_Chapter.xhtml#PC6) shows the initial setup.\n\n```\nlet\
    \ sampleCount = Int32(samples.count)\nlet dimCount32 = Int32(data.count + 1)\n\
    let dimCount64 = data.count + 1\nlet XTransXDimension = dimCount64 * dimCount64\n\
    \nvar X = samples.flatMap { sample -> [Double] in\n    var row = data.map { keyPath\
    \ in\n        sample[keyPath: keyPath].realValue\n    }\n    row.append(1)\n \
    \   return row\n}\nvar XTrans = X\nvar Y = samples.map { sample in\n    return\
    \ sample[keyPath: target].realValue\n}\nvar XTransX = [Double](\n    repeating:\
    \ 0,\n    count: XTransXDimension\n)\nvar XTransY = [Double](\n    repeating:\
    \ 0,\n    count: dimCount64\n)\nListing 4-6\nThe initial setup performed by the\
    \ MultipleLinearRegression initializer\n```\n\nThe first thing we do is to set\
    \ up some of the data structures we need. We create count variables for the number\
    \ of samples and the data dimensions. Note that the variables `dimCount32` and\
    \ `dimCount64` are the same value, only differing by their type. One could choose\
    \ to use a single variable and typecast it when needed, but this will reduce the\
    \ cognitive noise from reading such code.\n\nWe create our **X** matrix by using\
    \ `flatMap(_:)`, which is a higher-order function just like `map(_:)` and `filter(_:)`.\
    \ It works similar to `map(_:)`, but expects us to create a sequence of values\
    \ for each data point. It then takes all arrays we make and merge them into one,\
    \ with the *k* elements from the first data point taking the first *k* indices\
    \ in the sequence. One consequence of this approach is that we have a one-dimensional\
    \ representation of a two-dimensional data structure. Instead of keeping nested\
    \ arrays, as you would in many other languages, we lay out each row sequentially\
    \ after each other. This layout is called row-major order. The opposite would\
    \ be to place each matrix column after each other, aptly named column-major order.\n\
    \n`XTrans` is the matrix we call **X**^T in our mathematical notation. It is easy\
    \ to see that it is not the transpose of **X** but just a plain copy. However,\
    \ that is okay since the function calls we will use from the `Accelerate` framework\
    \ offer to compute a matrix’s transpose before performing their main calculations.\n\
    \n**Y** is the vector that contains the target values, that is, the observed value\
    \ for each sample point. Since we want to minimize the number of mathematical\
    \ operations we need to perform before reaching a result, we prefer matrix-vector\
    \ multiplication before matrix-matrix multiplication. However, we cannot escape\
    \ computing (**X**^T**X**)^(-1) separately. To minimize the work, we will split\
    \ our calculations into three steps:\n\n![$$ Step\\ 1: Compute\\ \\boldsymbol{M}={\\\
    left({\\boldsymbol{X}}^T\\boldsymbol{X}\\right)}^{-1}\\kern1.5em \\left( matrix-\
    \ matrix\\right) $$](images/512351_1_En_4_Chapter/512351_1_En_4_Chapter_TeX_Equaf.png)\n\
    \n![$$ Step\\ 2: Compute\\ \\boldsymbol{V}={\\boldsymbol{X}}^T\\boldsymbol{Y}\\\
    kern4em \\left( matrix- vector\\right) $$](images/512351_1_En_4_Chapter/512351_1_En_4_Chapter_TeX_Equag.png)\n\
    \n![$$ Step\\ 3: Compute\\ \\boldsymbol{R}=\\boldsymbol{MV}\\kern4.25em \\left(\
    \ matrix- vector\\right) $$](images/512351_1_En_4_Chapter/512351_1_En_4_Chapter_TeX_Equah.png)\n\
    \nBecause we want to take this approach, we also set up the arrays `XTransX` and\
    \ `XTransY`. Note that we have declared all arrays with the `var` keyword. We\
    \ do so because we need to pass pointers to the `Accelerate` methods. Because\
    \ pointers can mutate the underlying storage, we need the variables to be mutable.\n\
    \nNow that we have allocated some of the storage we need for our calculations,\
    \ let us go ahead and make our first calls to the `Accelerate` framework. We will\
