    我们对 createHuffmanTree(from:) 的实现

    ```


    ```

    indirect enum HuffmanNode

    where Value: Hashable & Comparable {

    case node(left: HuffmanNode, right: HuffmanNode)

    case leaf(value: Value, count: Int)

    }

