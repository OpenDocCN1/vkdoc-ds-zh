  raw: '### Implementing Multiple Linear Regression


    Now that we have worked out the mathematics, we are ready to start working on
    the implementation . In this section, we will introduce the Accelerate framework.
    Accelerate is a collection of libraries that focus on mathematical calculations
    and high performance. It uses the CPU’s vector processing capabilities to speed
    up intensive computations and process many values in parallel.


    We will reuse the general structure of the `SimpleLinearRegression` struct. We
    will fit the model in the initializer, use generic types to make the struct reusable
    across arbitrary data types, target the interesting variables with `KeyPath`s,
    and use a `predict(x:)` function to make predictions for new data points. However,
    since we want to target multiple variables, we are going to use variadic parameters.
    Listing [4-4](#512351_1_En_4_Chapter.xhtml#PC4) shows the new initializer definition
    we are going to use for this task.


    ```

    init(from samples: [Element],

    data: KeyPath...,

    target: KeyPath) throws

    Listing 4-4

    The initializer definition for our MultipleLinearRegression type

    ```


    This initializer looks very much like the one for simple linear regression. The
    difference lies in the ellipsis appended to the `data` parameter type. This dot-dot-dot
    syntax makes the argument variadic, meaning that we can target an arbitrary number
    of variables so long as they fit the declared `KeyPath` type. Listing [4-5](#512351_1_En_4_Chapter.xhtml#PC5)
    shows two perfectly valid uses of this initializer.


    ```

    let points: [Point3D] = ...

    let singleVar = MultipleLinearRegression(

    from: points,

    data: \.x,

    target: \.z

    )

    let multiVar = MultipleLinearRegression(

    from: points,

    data: \.x, \.y,

    target: \.z

    )

    Listing 4-5

    Two ways to target different variables using variadic parameters

    ```


    As we can see, variadic parameters give us plenty of flexibility when choosing
    which variables to include in our calculations. This approach makes it easier
    to perform and test multiple models that target different subsets of our available
    information.


    Now that we have lined out how to use `MultipleLinearRegression`, let us dig into
    the details of how it operates. We will split the entire body of the initializer
    into several listings so that we can reason about each part separately. Starting
    out, Listing [4-6](#512351_1_En_4_Chapter.xhtml#PC6) shows the initial setup.


    ```

    let sampleCount = Int32(samples.count)

    let dimCount32 = Int32(data.count + 1)

    let dimCount64 = data.count + 1

    let XTransXDimension = dimCount64 * dimCount64

    var X = samples.flatMap { sample -> [Double] in

    var row = data.map { keyPath in

    sample[keyPath: keyPath].realValue

    }

    row.append(1)

    return row

    }

    var XTrans = X

    var Y = samples.map { sample in

    return sample[keyPath: target].realValue

    }

    var XTransX = [Double](

    repeating: 0,

    count: XTransXDimension

    )

    var XTransY = [Double](

    repeating: 0,

    count: dimCount64

    )

    Listing 4-6

    The initial setup performed by the MultipleLinearRegression initializer

    ```


    The first thing we do is to set up some of the data structures we need. We create
    count variables for the number of samples and the data dimensions. Note that the
    variables dimCount32 and dimCount64 are the same value, only differing by their
    type. One could choose to use a single variable and typecast it when needed, but
    this will reduce the cognitive noise from reading such code.


    We create our **X** matrix by using `flatMap(_:)`, which is a higher-order function
    just like `map(_:)` and `filter(_:)`. It works similar to `map(_:)`, but expects
    us to create a sequence of values for each data point. It then takes all arrays
    we make and merge them into one, with the *k* elements from the first data point
    taking the first *k* indices in the sequence. One consequence of this approach
    is that we have a one-dimensional representation of a two-dimensional data structure.
    Instead of keeping nested arrays, as you would in many other languages, we lay
    out each row sequentially after each other. This layout is called row-major order.
    The opposite would be to place each matrix column after each other, aptly named
    column-major order.


    **XTrans** is the matrix we call **X** ^T in our mathematical notation. It is
    easy to see that it is not the transpose of **X** but just a plain copy. However,
    that is okay since the function calls we will use from the Accelerate framework
    offer to compute a matrix’s transpose before performing their main calculations.


    **Y** is the vector that contains the target values, that is, the observed value
    for each sample point. Since we want to minimize the number of mathematical operations
    we need to perform before reaching a result, we prefer matrix-vector multiplication
    before matrix-matrix multiplication. However, we cannot escape computing (**X**
    ^T**X**)^(-1) separately. To minimize the work, we will split our calculations
    into three steps:


    ![$$ Step\ 1: Compute\ \boldsymbol{M}={\left({\boldsymbol{X}}^T\boldsymbol{X}\right)}^{-1}\kern1.5em
    \left( matrix- matrix\right) $$](images/512351_1_En_4_Chapter/512351_1_En_4_Chapter_TeX_Equaf.png)


    ![$$ Step\ 2: Compute\ \boldsymbol{V}={\boldsymbol{X}}^T\boldsymbol{Y}\kern4em
    \left( matrix- vector\right) $$](images/512351_1_En_4_Chapter/512351_1_En_4_Chapter_TeX_Equag.png)


    ![$$ Step\ 3: Compute\ \boldsymbol{R}=\boldsymbol{MV}\kern4.25em \left( matrix-
    vector\right) $$](images/512351_1_En_4_Chapter/512351_1_En_4_Chapter_TeX_Equah.png)


    Because we want to take this approach, we also set up the arrays **XTransX** and
    **XTransY**. Note that we have declared all arrays with the `var` keyword. We
    do so because we need to pass pointers to the Accelerate methods. Because pointers
    can mutate the underlying storage, we need the variables to be mutable.


    Now that we have allocated some of the storage we need for our calculations ,
    let us go ahead and make our first calls to the Accelerate framework. We will
    start by using the method shown in Listing [4-7](#512351_1_En_4_Chapter.xhtml#PC7).


    ```

    func cblas_dgemv(

    _ __Order: CBLAS_ORDER,

    _ __TransA: CBLAS_TRANSPOSE,

    _ __M: Int32,

    _ __N: Int32,

    _ __alpha: Double,

    _ __A: UnsafePointer!,

    _ __lda: Int32,

    _ __X: UnsafePointer!,

    _ __incX: Int32,

    _ __beta: Double,

    _ __Y: UnsafeMutablePointer!,

    _ __incY: Int32

    )

    Listing 4-7

    One of the many matrix-vector multiplication methods that are available through
    the Accelerate framework

    ```


    Those that have a little bit of experience with Swift development will notice
    that this declaration looks different than most other Swift code they have seen.
    That is because this (and some of the other functions we will use) refers to Apple’s
    implementation of the *Basic Linear Algebra Subprograms* for C (CBLAS). Swift
    has the convenient capability to be able to import C functions. This feature is
    handy but comes with the minor inconvenience that the code looks less modern when
    using these interfaces.


    Going back to the function in Listing [4-7](#512351_1_En_4_Chapter.xhtml#PC7),
    we quickly go through what it expects us to pass to the different parameters:


    *   **__Order**: This parameter specifies the order of the matrix we want to use
    for multiplication. Since we chose to structure our matrices in row-major order,
    we pass `CblasRowMajor` as an argument.'
  trans: "\n### 实现多元线性回归\n\n在完成数学推导后，我们现在可以着手实现代码了。在本节中，我们将介绍 `Accelerate` 框架。`Accelerate`\
    \ 是一个专注于数学计算和高性能的库集合。它利用 CPU 的向量处理能力来加速密集型计算，并并行处理多个数值。\n\n我们将复用 `SimpleLinearRegression`\
    \ 结构体的一般结构。我们会在初始化器中拟合模型，使用泛型使结构体可复用至任意数据类型，通过 `KeyPath` 定位感兴趣的变量，并使用 `predict(x:)`\
    \ 函数对新数据点进行预测。不过，由于我们要定位多个变量，因此将使用可变参数。清单 4-4 展示了我们将在该任务中使用的新初始化器定义。\n\n```\n\
    init(from samples: [Element],\n      data: KeyPath...,\n      target: KeyPath)\
    \ throws\n清单 4-4\n我们多元线性回归类型的初始化器定义\n```\n\n这个初始化器看起来与简单线性回归的初始化器非常相似。区别在于 `data`\
    \ 参数类型后面跟的省略号。这种点点点语法使得参数可变，意味着只要它们符合声明的 `KeyPath` 类型，我们就可以定位任意数量的变量。清单 4-5 展示了此初始化器的两种完全有效的用法。\n\
    \n```\nlet points: [Point3D] = ...\nlet singleVar = MultipleLinearRegression(\n\
