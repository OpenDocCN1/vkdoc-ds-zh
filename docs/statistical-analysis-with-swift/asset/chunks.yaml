- fmt: "# Distribution of Sample Means\n\nImagine that there are 100 folded notes\
    \ in a hat. On each note is a number between zero and five. Our task is to compute\
    \ the average of those numbers, but we can only look at 30 randomly selected notes.\
    \ This scenario has a few different possible outcomes.\n\n- We could end up selecting\
    \ the notes with the highest numbers on them. In that case, our result could be\
    \ much greater than the true mean. However, the odds of selecting exactly those\
    \ notes are relatively small.\n- Similarly, we could end up selecting all the\
    \ smallest numbers. In this case, our computation of the mean would be too small\
    \ compared to the true one. The probability of hitting this scenario is also relatively\
    \ small.\n- The most likely outcomes lie somewhere in between the two extremes\
    \ described earlier. We will probably select some mix of larger and smaller numbers,\
    \ and taking the average of those will yield a result that is at least somewhat\
    \ close to the true mean.\n\nThis type of distribution may already start to sound\
    \ a bit familiar from Chapter [3](#512351_1_En_3_Chapter.xhtml). Let us write\
    \ some code to visualize the distribution of sample means from some set. Listing\
    \ [5-1](#512351_1_En_5_Chapter.xhtml#PC1) shows the initializer of a SwiftUI View\
    \ that receives an array of numbers, which it uses to compute a large number of\
    \ sample means. We then visualize these results by plotting them in a histogram\
    \ inside the `body` property, as shown in Listing [5-2](#512351_1_En_5_Chapter.xhtml#PC2).\n\
    \n```\nvar body: some View {\n    VStack(spacing: 20) {\n        Text(\"Computing\
    \ Sample Means\")\n            .font(.largeTitle)\n        HStack(spacing: 20)\
    \ {\n            Text(\"True mean: \\(mean, specifier: \"%.3f\")\")\n        \
    \    Text(\"Samples per mean: \\(numberOfSamples)\")\n        }\n        .padding(.horizontal)\n\
    \        Histogram(\n            data: data,\n            label: \"Distribution\
    \ of sample means\",\n            barWidth: barWidth,\n            xAxisMin: 0,\n\
    \            xAxisMax: 5\n        )\n    }\n}\n```\n\nListing 5-2: Displaying\
    \ the computed sample means in a histogram\n\n```\ninit(\n    numberOfMeans: Int,\n\
    \    numberOfSamples: Int,\n    sampledFrom set: [Double]\n) {\n    precondition(\n\
    \        !set.isEmpty,\n        \"Samples need to contain at least one element.\"\
    \n    )\n    // Used to place values into a histogram bin\n    let rounding =\
    \ 0.1\n    let meansIterator = (1 ... numberOfMeans).lazy\n    let samplesIterator\
    \ = (1 ... numberOfSamples).lazy\n    self.data = meansIterator\n        .map\
    \ { _ in\n            samplesIterator\n                .compactMap { _ in set.randomElement()\
    \ }\n                .mean(of: \\.self)\n        }\n        .reduce(into: [Double:\
    \ Int]()) { dict, mean in\n            let roundedMean = (mean / rounding)\n \
    \               .rounded() * rounding\n            dict[roundedMean, default:\
    \ 0] += 1\n        }\n        .map { key, value in\n            BarChartDataEntry(\n\
    \                x: key,\n                y: value.realValue / numberOfMeans.realValue\n\
    \            )\n        }\n    self.barWidth = 0.9 * rounding\n    self.mean =\
    \ set.mean(of: \\.self)\n    self.numberOfSamples = numberOfSamples\n}\n```\n\n\
    Listing 5-1: Computing and plotting multiple sample means\n\nRunning the code\
    \ listed previously on a set of 100 uniform random numbers between zero and five\
    \ produces a histogram like the one in Figure [5-1](#512351_1_En_5_Chapter.xhtml#Fig1).\
    \ The code computed a total of 5,000 sample means, using a sample size of 30 for\
    \ each mean.\n\n![../images/512351_1_En_5_Chapter/512351_1_En_5_Fig1_HTML.png](images/512351_1_En_5_Chapter/512351_1_En_5_Fig1_HTML.png)\n\
    \nFigure 5-1: Computing 5,000 sample means from a set of 100 uniform random numbers\n\
    \nLooking at this histogram, we have a visualization that supports the suspicion\
    \ that came about when we listed the different outcomes of computing sample means.\
    \ The columns form a shape that looks very much like a normal distribution! This\
    \ result is not a coincidence but is formalized in a theorem that data scientists\
    \ and statisticians use regularly.\n\n## The Central Limit Theorem\n\nThe Central\
    \ Limit Theorem makes life a whole lot easier for anyone who wants to perform\
    \ hypothesis testing. It tells us that the distribution of sample means from a\
    \ population can be approximated by a normal distribution. This result holds regardless\
    \ of whether the distribution we sample from is normal. However, there are a few\
    \ conditions we need to fulfill.\n\n- We need to sample with replacement. For\
    \ example, once we have chosen one student to perform an IQ test, we cannot remove\
    \ them from the sample pool since that would alter the distribution for the remaining\
    \ samples. Instead, we need to be okay with the possibility of choosing the same\
    \ student multiple times.\n- We need the sample size to be sufficiently large.\
    \ That is, we cannot randomly select two or three students. One commonly accepted\
    \ limit is that we need at least 30 samples for this theorem to be applicable.\n\
    \nNote: There is one exception to the sample size limit mentioned previously.\
    \ If the samples come from a normally distributed population, the theorem is applicable\
    \ even for smaller sample sizes than 30.\n\nGiven that the preceding conditions\
    \ hold, the Central Limit Theorem tells us that we can approximate the distribution\
    \ of a sample mean by a normal distribution. When we discussed the normal distribution\
    \ in Chapter [3](#512351_1_En_3_Chapter.xhtml), we mentioned that the mean μ and\
    \ standard deviation σ define the exact shape of the characteristic bell curve.\
    \ We estimate those parameters by the following formulas:\n\n![$$ {\\upmu}_{est}=\\\
    frac{1}{N}\\sum \\limits_{i=1}^N{\\overline{x}}_i $$](images/512351_1_En_5_Chapter/512351_1_En_5_Chapter_TeX_Eque.png)\n\
    \n![$$ {\\sigma}_{est}=S=\\frac{1}{N-1}\\sum \\limits_{i=1}^N{\\left({\\overline{x}}_i-\\\
    mu \\right)}^2 $$](images/512351_1_En_5_Chapter/512351_1_En_5_Chapter_TeX_Equf.png)\n\
    \nIn these formulas, we denote an individual sample mean by an *x* with a bar\
    \ on top. We denote the sample standard deviation by an *S*. These are both unbiased\
    \ estimators of the true mean and standard deviation, making them acceptable substitutes\
    \ when we do not know the actual values. In those cases where we already know\
    \ the mean and standard deviation of the population, we can instead use the following:\n\
    \n![$$ {\\mu}_{est}={\\mu}_{population} $$](images/512351_1_En_5_Chapter/512351_1_En_5_Chapter_TeX_Equg.png)\n\
    \n![$$ {\\sigma}_{est}=\\frac{\\sigma_{population}}{\\sqrt{N}} $$](images/512351_1_En_5_Chapter/512351_1_En_5_Chapter_TeX_Equh.png)\n\
    \nN denotes the sample size in these equations and is used to scale the population's\
    \ standard deviation. The derivation and proof of the previous formulas are beyond\
    \ the scope of this book. However, we will look at two examples to get a visual\
    \ indication that they hold.\n\nFigure [5-2](#512351_1_En_5_Chapter.xhtml#Fig2)\
    \ shows a gamma distribution with parameters α = 3 and β = 3. Figure [5-3](#512351_1_En_5_Chapter.xhtml#Fig3)\
    \ shows a density histogram of 1000 sample means of sample size 30. It also shows\
    \ an overlaid normal distribution curve with parameters estimated according to\
    \ the formulas that estimate an unknown mean and standard deviation.\n\nFigure\
    \ [5-4](#512351_1_En_5_Chapter.xhtml#Fig4) shows a more interesting distribution.\
    \ It is a linear combination of two beta distributions, one with parameters α\
    \ = 7 and β = 2 and the other one with α = 2 and β = 5. Figure [5-5](#512351_1_En_5_Chapter.xhtml#Fig5)\
    \ shows a histogram of sample means and a normal distribution curve with appropriate,\
    \ estimated parameters.\n\n![../images/512351_1_En_5_Chapter/512351_1_En_5_Fig5_HTML.png](images/512351_1_En_5_Chapter/512351_1_En_5_Fig5_HTML.png)\n\
    \nFigure 5-5: The distribution of 1000 sample means computed from the linear combination\
    \ of beta distributions in Figure [5-4](#512351_1_En_5_Chapter.xhtml#Fig4) and\
    \ an overlaid normal distribution with parameters μ ≈ 0.532 and σ ≈ 0.021\n\n\
    ![../images/512351_1_En_5_Chapter/512351_1_En_5_Fig4_HTML.png](images/512351_1_En_5_Chapter/512351_1_En_5_Fig4_HTML.png)\n\
    \nFigure 5-4"
  raw: '## Distribution of Sample Means


    Imagine that there are 100 folded notes in a hat. On each note is a number between
    zero and five. Our task is to compute the average of those numbers, but we can
    only look at 30 randomly selected notes. This scenario has a few different possible
    outcomes.


    *   We could end up selecting the notes with the highest numbers on them. In that
    case, our result could be much greater than the true mean. However, the odds of
    selecting exactly those notes are relatively small.


    *   Similarly, we could end up selecting all the smallest numbers. In this case,
    our computation of the mean would be too small compared to the true one. The probability
    of hitting this scenario is also relatively small.


    *   The most likely outcomes lie somewhere in between the two extremes described
    earlier. We will probably select some mix of larger and smaller numbers, and taking
    the average of those will yield a result that is at least somewhat close to the
    true mean.


    This type of distribution may already start to sound a bit familiar from Chapter
    [3](#512351_1_En_3_Chapter.xhtml). Let us write some code to visualize the distribution
    of sample means from some set. Listing [5-1](#512351_1_En_5_Chapter.xhtml#PC1)
    shows the initializer of a SwiftUI View that receives an array of numbers, which
    it uses to compute a large number of sample means. We then visualize these results
    by plotting them in a histogram inside the body property, as shown in Listing
    [5-2](#512351_1_En_5_Chapter.xhtml#PC2).


    ```

    var body: some View {

    VStack(spacing: 20) {

    Text("Computing Sample Means")

    .font(.largeTitle)

    HStack(spacing: 20) {

    Text("True mean: \(mean, specifier: "%.3f")")

    Text("Samples per mean: \(numberOfSamples)")

    }

    .padding(.horizontal)

    Histogram(

    data: data,

    label: "Distribution of sample means",

    barWidth: barWidth,

    xAxisMin: 0,

    xAxisMax: 5

    )

    }

    }

    Listing 5-2

    Displaying the computed sample means in a histogram

    ```


    ```

    init(

    numberOfMeans: Int,

    numberOfSamples: Int,

    sampledFrom set: [Double]

    ) {

    precondition(

    !set.isEmpty,

    "Samples need to contain at least one element."

    )

    // Used to place values into a histogram bin

    let rounding = 0.1

    let meansIterator = (1 ... numberOfMeans).lazy

    let samplesIterator = (1 ... numberOfSamples).lazy

    self.data = meansIterator

    .map { _ in

    samplesIterator

    .compactMap { _ in set.randomElement() }

    .mean(of: \.self)

    }

    .reduce(into: [Double: Int]()) { dict, mean in

    let roundedMean = (mean / rounding)

    .rounded() * rounding

    dict[roundedMean, default: 0] += 1

    }

    .map { key, value in

    BarChartDataEntry(

    x: key,

    y: value.realValue / numberOfMeans.realValue

    )

    }

    self.barWidth = 0.9 * rounding

    self.mean = set.mean(of: \.self)

    self.numberOfSamples = numberOfSamples

    }

    Listing 5-1

    Computing and plotting multiple sample means

    ```


    Running the code listed previously on a set of 100 uniform random numbers between
    zero and five produces a histogram like the one in Figure [5-1](#512351_1_En_5_Chapter.xhtml#Fig1).
    The code computed a total of 5,000 sample means, using a sample size of 30 for
    each mean.


    ![../images/512351_1_En_5_Chapter/512351_1_En_5_Fig1_HTML.png](images/512351_1_En_5_Chapter/512351_1_En_5_Fig1_HTML.png)


    Figure 5-1


    Computing 5,000 sample means from a set of 100 uniform random numbers


    Looking at this histogram, we have a visualization that supports the suspicion
    that came about when we listed the different outcomes of computing sample means.
    The columns form a shape that looks very much like a normal distribution! This
    result is not a coincidence but is formalized in a theorem that data scientists
    and statisticians use regularly.


    ### The Central Limit Theorem


    The Central Limit Theorem makes life a whole lot easier for anyone who wants to
    perform hypothesis testing. It tells us that the distribution of sample means
    from a population can be approximated by a normal distribution. This result holds
    regardless of whether the distribution we sample from is normal. However, there
    are a few conditions we need to fulfill.


    *   We need to sample with replacement. For example, once we have chosen one student
    to perform an IQ test, we cannot remove them from the sample pool since that would
    alter the distribution for the remaining samples. Instead, we need to be okay
    with the possibility of choosing the same student multiple times.


    *   We need the sample size to be sufficiently large. That is, we cannot randomly
    select two or three students. One commonly accepted limit is that we need at least
    30 samples for this theorem to be applicable.


    Note


    There is one exception to the sample size limit mentioned previously. If the samples
    come from a normally distributed population, the theorem is applicable even for
    smaller sample sizes than 30.


    Given that the preceding conditions hold, the Central Limit Theorem tells us that
    we can approximate the distribution of a sample mean by a normal distribution.
    When we discussed the normal distribution in Chapter [3](#512351_1_En_3_Chapter.xhtml),
    we mentioned that the mean μ and standard deviation σ define the exact shape of
    the characteristic bell curve. We estimate those parameters by the following formulas:


    ![$$ {\upmu}_{est}=\frac{1}{N}\sum \limits_{i=1}^N{\overline{x}}_i $$](images/512351_1_En_5_Chapter/512351_1_En_5_Chapter_TeX_Eque.png)


    ![$$ {\sigma}_{est}=S=\frac{1}{N-1}\sum \limits_{i=1}^N{\left({\overline{x}}_i-\mu
    \right)}^2 $$](images/512351_1_En_5_Chapter/512351_1_En_5_Chapter_TeX_Equf.png)


    In these formulas, we denote an individual sample mean by an *x* with a bar on
    top. We denote the sample standard deviation by an *S*. These are both unbiased
    estimators of the true mean and standard deviation, making them acceptable substitutes
    when we do not know the actual values. In those cases where we already know the
    mean and standard deviation of the population, we can instead use the following:


    ![$$ {\mu}_{est}={\mu}_{population} $$](images/512351_1_En_5_Chapter/512351_1_En_5_Chapter_TeX_Equg.png)


    ![$$ {\sigma}_{est}=\frac{\sigma_{population}}{\sqrt{N}} $$](images/512351_1_En_5_Chapter/512351_1_En_5_Chapter_TeX_Equh.png)


    N denotes the sample size in these equations and is used to scale the population’s
    standard deviation. The derivation and proof of the previous formulas are beyond
    the scope of this book. However, we will look at two examples to get a visual
    indication that they hold.


    Figure [5-2](#512351_1_En_5_Chapter.xhtml#Fig2) shows a gamma distribution with
    parameters α = 3 and β = 3\. Figure [5-3](#512351_1_En_5_Chapter.xhtml#Fig3) shows
    a density histogram of 1000 sample means of sample size 30\. It also shows an
    overlaid normal distribution curve with parameters estimated according to the
    formulas that estimate an unknown mean and standard deviation.


    Figure [5-4](#512351_1_En_5_Chapter.xhtml#Fig4) shows a more interesting distribution.
    It is a linear combination of two beta distributions, one with parameters α =
    7 and β = 2 and the other one with α = 2 and β = 5\. Figure [5-5](#512351_1_En_5_Chapter.xhtml#Fig5)
    shows a histogram of sample means and a normal distribution curve with appropriate,
    estimated parameters.


    ![../images/512351_1_En_5_Chapter/512351_1_En_5_Fig5_HTML.png](images/512351_1_En_5_Chapter/512351_1_En_5_Fig5_HTML.png)


    Figure 5-5


    The distribution of 1000 sample means computed from the linear combination of
    beta distributions in Figure [5-4](#512351_1_En_5_Chapter.xhtml#Fig4) and an overlaid
    normal distribution with parameters μ ≈ 0.532 and σ ≈ 0.021


    ![../images/512351_1_En_5_Chapter/512351_1_En_5_Fig4_HTML.png](images/512351_1_En_5_Chapter/512351_1_En_5_Fig4_HTML.png)


    Figure 5-4'
