    throw LinearRegressionError.singularMatrix

    default:

    break

    }

    dgetri_(&m, &XTransX, &lda, &pivots, &workspace, &workspaceSize, &invError)

    switch invError {

    case ..<0:

    throw LinearRegressionError.invalidArguments

    case 1...:

    throw LinearRegressionError.singularMatrix

    default:

    break

    }

