    这个处理流程中的大多数阶段现在应该看起来都很熟悉了。枚举将每个期望评分与其所描述的电影的索引配对。然而，排序阶段做了一些不那么显而易见的事情。即使一部电影可能有很高的期望评分，但如果用户已经评价过它，我们也不想推荐它。因此，我们不仅基于期望值进行排序，还添加了两个条件，将已评分的电影排到列表更靠后的位置。


    排序完成后，我们只保留前`movie`个评分，并将它们映射回各自的标题。这两个阶段生成一个电影标题数组，我们可以将其返回给主程序并显示给用户。代码清单 7-10
    展示了我们在主程序中打印推荐结果。


    ```

    print(

    """

    Recommended movies for user \(user.id):

    \(

    recommendations

    .joined(separator: "\n")

    )

    """

    )

    // 输出：

    // Recommended movies for user 1:

    //

    // Dawn Patrol

    // Surfer, Dude

    // Winnie Mandela

    // Grand Theft Parsons

    // An American in Hollywood

    代码清单 7-10

    为 ID 为 1 的用户打印推荐电影

    ```


    我们现在有一些电影建议了！我们知道我们为其提供建议的用户是喜剧和恐怖片的粉丝，那么让我们评估一下这些推荐是否合理。表 7-4 列出了每部推荐电影的类型。


    **表 7-4**

    推荐电影及其类型


    | 电影 | 类型 |

    | --- | --- |

    | *Dawn Patrol* | 惊悚/剧情 |

    | *Surfer, Dude* | 喜剧 |

    | *Winnie Mandela* | 历史/剧情 |

    | *Grand Theft Parsons* | 喜剧/剧情 |

    | *An American in Hollywood* | 喜剧/剧情 |


    这些结果看起来相当不错。推荐中有不少喜剧片。可以说，有一部惊悚片在某种意义上也与恐怖类型相关。


    唯一与用户类型偏好不太吻合的电影是*Winnie Mandela*，这是一部剧情片。然而，这些电影都是由与我们的用户喜欢许多相同电影的其他用户推荐的。即使类型不完全匹配，它也可能是一个不错的选择。请记住，这种协同过滤的思路是观察一群志同道合的人对一部电影的感知质量。由于类型不是那么重要，我们最终可能会得到一些跨越类型偏好界限但用户仍可能喜欢的推荐。


    表 7-5 列出了其他一些用户索引及其偏好的类型。请随意尝试代码项目，看看算法会生成什么样的建议。


    **表 7-5**

    其他一些用户索引及其偏好的类型


    | 用户索引 | 偏好类型 |

    | --- | --- |

    | 8 | 动作 |

    | 54 | 喜剧, 悬疑 |

    | 82 | 剧情, 奇幻 |

    | 172 | 喜剧, 浪漫 |

    | 220 | 动画 |


    ## 本章小结


    本章将我们在本书中讨论的许多概念交织在一起。我们学会了如何通过整合基于统计分析的思想和概念，一步步解决一个现实世界的问题。我们介绍了两种衡量相似性的方法，讨论了它们如何工作以及它们在某些类型的数据上表现不佳的情况。我们还讨论了期望值的应用，并重新审视了贝叶斯定理以推导出一个有助于我们实现目标的公式。


    本章的实现部分详细介绍了基于现有知识推荐电影标题所需的代码。我们使用了高阶函数链，并看到它们如何形成从输入到期望输出的声明式流程。我们还快速了解了`vDSP`模块，该模块包含几个在处理向量时非常有用的方法。由于`vDSP`是`Accelerate`框架的一部分，这些方法将通过在我们的
    CPU 向量处理器上计算结果来加速执行。


    下一章通过总结我们在本书中学到的内容来收尾。它还探讨了了解统计方法有益的一些领域，并建议了一些资源以及未来学习的有趣相关主题。


    # 8. 反思


    本书以较快的节奏介绍了新的主题、技术和框架。要充分消化新内容，有必要花时间反思我们所做的事情。本章将回顾前几章中最重要的主题，提供重复练习，并留出一些时间来反思各个主题是如何结合在一起的。在结束之前，我们还将探讨一些需要统计分析知识至关重要的职业，并建议一些进一步学习相关的主题。

    '
- fmt: '## The Swift Programming Language


    In Chapter [1](#512351_1_En_1_Chapter.xhtml), we discussed Swift and its viability
    as a statistical analysis tool. As we mentioned then, there are plenty of good
    alternatives, such as Python and R, for solving these types of problems. Swift
    does, however, have advantages in some situations and should not be excluded from
    the toolbox just because there are other languages available.


    - Swift is a statically typed and compiled language, making it fast and efficient
    when dealing with large-scale data.

    - Plenty of frameworks and libraries are available via the Swift Package Manager,
    providing access to a vast landscape of tools upon which to build.

    - Swift is also the primary language for Apple platforms, making it easier to
    incorporate our algorithms into applications on Macs, iPhones, and iPads. This
    point is important on its own because, in the end, we want customers to be able
    to enjoy the results of our work.


    This book worked with data stored in CSV files. The main reason for this was the
    balance between readability and storage requirements. We also presented a few
    other formats used for data persistence, such as `JSON`, `XML`, and `Protobuf`.
    These are all formats that can be easily written to and read from a file. However,
    Swift has several options to use more sophisticated database management systems
    to store and retrieve data. There is even the possibility to choose between relational,
    NoSQL, and graph based. Table [8-1](#512351_1_En_8_Chapter.xhtml#Tab1) shows a
    few of the options available to Swift developers. Given all these different possibilities,
    we are sure to find a good match for our use case, no matter what it might be.


    **Table 8-1** Database management systems available to Swift developers


    | Name | Type |

    | --- | --- |

    | SQLite | Relational DBMS |

    | Realm | NoSQL DBMS |

    | ObjectBox | NoSQL DBMS |

    | Neo4j | Graph DBMS |


    We have been using many of Swift’s built-in language features throughout this
    book, such as higher-order functions and `KeyPath` types. Higher-order functions
    have played a prominent role in pretty much all of our code projects. Methods
    such as `filter(_:)`, `reduce(_:)`, and `map(_:)` have helped us transform and
    refine our data sets until we arrive at the final result. `KeyPath` types helped
    make some of our algorithms more generic by allowing the calling function to select
    one or more target variables. That approach allowed us to make truly versatile
    programs and, for example, quickly change which variables to use for our linear
    regression computations.


    Another valuable feature of Swift is that we get access to a world of data coders
    through the `Encodable` and `Decodable` protocols. Some are handed to us by Apple,
    others by talented third-party developers. Almost no matter what data format we
    use, we can be sure that there are plenty of options to parse data files that
    do not require us to disassemble them by hand.


    ## Probability Theory


    In Chapter [2](#512351_1_En_2_Chapter.xhtml), we covered some of the most important
    concepts in probability theory. We learned that even though it may seem like a
    niche topic, most of us encounter it daily. We list some examples of real-world
    applications here:


    - The weather forecast may tell us that there is a 5% chance of rain tomorrow.

    - A public opinion survey may show that a presidential candidate gained 2% over
    their opponent but may also conclude that the result is not statistically significant.

    - Records show that 85% of a country’s population received a vaccine dose against
    a new disease and that 50% of people getting hospitalized are unvaccinated.


    The last example is a perfect candidate for using another essential idea we learned
    about – Bayes’ Theorem. Using Bayes’ Rule, we could, for example, calculate the
    probability of ending up in the hospital given that we got vaccinated. This seemingly
    simple formula provides a powerful tool to weigh different scenarios against each
    other by infusing more information into our estimates.


    Chapter [2](#512351_1_En_2_Chapter.xhtml) also taught us about independence and
    how it often simplifies our computations. Some may argue that everything is interconnected
    and that two events can never truly be independent of each other. However, if
    two events’ effect on each other’s probabilities is acceptably small, we often
    say they are independent either way. One of the reasons is that we like simplicity,
    and it is less complicated to think about things that do not interact. Another
    reason is that if the effect is sufficiently small, we will still end up with
    an approximation close to the true value, so we do not give up much accuracy.


    ## Distributions


    While learning about sample spaces, we got some insight into how to categorize
    them depending on the nature of their sample points. This way of looking at possible
    outcomes led us to discuss discrete and continuous distributions and their properties.


    A discrete distribution is characterized by its probability mass function (PMF),
    while a continuous distribution has a probability density function (PDF). Both
    of these describe the likelihood of all the sample points contained by the distribution.
    However, we also learned that only the PMF yields a number that we can interpret
    as a probability. The PDF, on the other hand, gives a relative likelihood value.
    Sample points that are more likely get a higher number, but we need to compute
    an integral to get a proper probability. We also learned that the probability
    of a single sample point in a continuous distribution is zero and that we should
    compute probabilities over ranges of sample points.


    Another function that helps us describe distributions is the cumulative distribution
    function (CDF). It tells us the probability that a sample falls at or below a
    specified point. For example, the CDF of a standard normal distribution would
    tell us that there is a 50% chance that a random sample is lesser than or equal
    to zero.


    Chapter [3](#512351_1_En_3_Chapter.xhtml) also introduced the idea of expected
    values. The most common expected value is the average. We compute it by weighting
    each sample point by its probability in a given distribution. However, there are
    also other expected values, such as the distribution’s variance, skewness, and
    kurtosis. We covered the variance and the closely related standard deviation in
    our studies. However, the other two properties are easy to look up and understand
    since they build on the same concept.'
