    ### Predicting House Sale Prices


    After finishing the development of new tools, it is always fun to try them out
    on fun data sets . The code project contains a file called `HousePricePredictions.swift`
    that we can use for precisely that purpose. It loads a data set containing generated
    house sale data, which follows a similar distribution to 12,500 recent sales made
    in four large cities in Sweden. Feel free to explore the data and play around
    with which variables give you the smallest loss value. Think about the nature
    of the different variables, whether they are naturally representable by real or
    integer numbers, and how that affects the regression.


    ## Chapter Summary


    In this chapter, we covered quite a bit of theory from both the mathematical and
    engineering side. We learned about simple linear extrapolation between two data
    points and how it breaks when our samples become too irregular. We also made a
    stop at linear splines and discussed how and why they can be helpful and why they
    are not well suited for large data sets. These discussions later landed us in
    the territory of linear regression by helping us understand the shortcomings it
    addresses.


    In the sections on linear regression, we learned about loss functions, which help
    us determine how well a particular model describes our observed data. We also
    derived the theory around linear regression with the help of said loss function
    and made two implementations – one for the simple case and one for multivariate
    ones. The latter took us through BLAS and LAPACK and showed us some of the tools
    at our disposal when solving these problems.


    Modeling the real world is a beneficial skill when trying to make predictions
    about it. However, it is an equally handy skill to look at two sets of observed
    data and assess whether some important metrics have changed significantly. This
    problem set is what we will look at in the next chapter.


    # 5. Hypothesis Testing


    Hypothesis testing is a valuable area of statistics. It can aid us when working
    with random variables that may change their distributions over time or because
    of certain events. However, it is also one of the topics that students find most
    daunting and challenging to understand. In this chapter, we look at several examples
    of formulating a hypothesis and leveraging Swift to determine whether it is more
    likely than the currently accepted truth.'
