  trans: '

    # 最终方法


    在研究这个问题的最终方法时，我们不妨设想一下：在流媒体服务出现之前，我们会向谁寻求电影推荐。我们可能有一些朋友，与我们口味相投，他们推荐的内容很可能正中我们下怀。这正是协同过滤的核心思想。如果某人在某个话题上与
    X 先生/女士意见一致，那么相比随机选中的另一个人，X 更有可能在另一个话题上与其观点相同。


    为了让这一概念更具体，我们想象一下：安娜和佐伊已经看过《惊声尖叫》前两部并给出了评分，而尼克只看过第一部。我们可以将他们的评分整理成表 7-1 所示的形式。


    **表 7-1** 三位观众对电影的评分


    | | 《惊声尖叫》 | 《惊声尖叫 2》 |

    | --- | --- | --- |

    | 尼克 | 好 | ? |

    | 安娜 | 好 | 好 |

    | 佐伊 | 差 | 差 |


    基于这些评分，尼克应该向谁咨询是否观看《惊声尖叫 2》呢？更好的选择可能是问安娜，因为她和尼克对第一部电影的看法一致。由于佐伊不喜欢《惊声尖叫》，她的偏好很可能与尼克不同，她的建议可能与尼克的喜好不太吻合。


    通过将这一思路扩展到所有服务用户，我们便得到了推荐系统的一个可行方案。这样一来，为用户推荐一部电影就归结为以下几个步骤：


    1.  找到一定数量与提出推荐请求的用户评分相似的其他用户。

    2.  根据这些相似用户的评分，计算所有电影的预期评分。

    3.  推荐预期评分最高的电影。


    要执行这些步骤，我们首先需要确定如何计算两个用户之间的相似度。下一节将介绍两种常用方法。另外需要注意的是，当有大量其他用户可供比较时，协同过滤的效果很好，因为其他人喜欢相同东西的可能性更大。但试想一下，如果服务中只有两个用户，且他们喜欢的东西完全不同，由于缺乏数据，算法就不得不向喜欢不同电影的用户征求意见了。


    另一种不依赖其他用户的方法是**基于内容的过滤**，它完全专注于提出推荐请求的用户对其他电影的评分。本教程不对此方法进行详细讨论，但值得读者在进一步学习时深入了解。


    ## 相似度衡量


    顾名思义，相似度衡量是一种确定两个对象相似程度的方法。可用的衡量方法数不胜数，我们需要仔细思考设计它们的原因和方式。这里将讨论两种衡量方法：其中一种对我们试图解决的问题没有帮助，而另一种则更合适。重点是展示如何对这些计算进行推理，以便为未来的问题选择合适的衡量方法。


    ### 余弦相似度


    余弦相似度通过考察两个特征向量之间的夹角来衡量相似性。它的实现方式是计算评分向量在彼此上的投影程度。我们可以从欧几里得点积公式推导出两个非零向量 **A**
    和 **B** 之间余弦相似度的公式。


    ```

    A·B = ||A|| ||B|| cos θ

    ```


    ```

    CosSim(A, B) = cos θ = (A·B) / (||A|| ||B||)

    ```


    该公式得出的结果是一个介于 -1 和 1 之间的实数，具体数值取决于两个向量的相似程度。如果它们指向大致相同的方向，相似度得分会趋向于 1；如果方向相反，则得分趋向于
    -1。在我们的案例中，最低得分为 0，因为我们不能给电影评负分。


    为了使讨论更具体，假设有四个人根据下一页的表 7-2 对两部电影进行评分。


    **表 7-2** 四人对两部电影的评分示例


    | | 电影 1 | 电影 2 |

    | --- | --- | --- |

    | **泰勒** | 5 | 5 |

    | **莎拉** | 5 | 5 |

    | **迈克** | 5 | 1 |

    | **简** | 1 | 1 |


    从这些评分来看，我们期望相似度衡量方法能得出：泰勒与莎拉非常相似，与迈克略有相似，但与简完全不相似。然而，经过计算，我们得到以下结果：


    ```

    CosSim(泰勒, 莎拉) = (5·5 + 5·5) / (√50·√50) = 1

    ```


    ```

    CosSim(泰勒, 迈克) = (5·5 + 5·1) / (√50·√26) = 0.832

    ```


    ```

    CosSim(泰勒, 简) = (5·1 + 5·1) / (√50·√2) = 1

    ```


    这不是我们想要的结果。这种相似度衡量方法认为泰勒和简与泰勒和莎拉一样相似。让我们绘制出向量来理解原因。图 7-1 将它们展示为图表中的箭头，其中电影 1 的评分绘制在
    X 轴上，电影 2 的评分绘制在 Y 轴上。


    ![../images/512351_1_En_7_Chapter/512351_1_En_7_Fig1_HTML.png](img/512351_1_En_7_Fig1_HTML.png)


    **图 7-1** 电影 1 和电影 2 的示例评分绘制为二维向量


    这张图清楚地说明了问题所在。尽管泰勒和莎拉的评分与简的评分相差很大，但它们产生的向量却是平行的。由于余弦相似度只关心向量间的夹角，因此它认为泰勒和简的评分非常相似，而迈克的评分则与其他人的评分不完全相似。


    我们不会在实现中使用这种相似度衡量方法，因为它的表现不符合我们的预期。然而，这个例子确实突显了仔细思考如何定义对象相似性的重要性。某个度量标准起初看似合理，但最终可能会给我们的计算带来严重问题。在这种情况下，我们最终可能会向泰勒推荐简最喜欢的电影，而这很可能是糟糕的选择。现在我们已经了解了可能出现的问题，接下来定义一个效果更好的相似度度量标准。'
- fmt: '### Euclidean Squared Distance


    The Euclidean distance, also known as the Pythagorean distance, represents a straight-line
    path’s length between two points. By imagining each vector of movie ratings as
    a point, we can use this formula to compute the distance between them, ultimately
    measuring how similar two users are. The Euclidean distance for two column vectors,
    `A` and `B`, is defined as follows:


    ![$$ EucDist\left(\boldsymbol{A},\boldsymbol{B}\right)=\sqrt{{\left(\boldsymbol{A}-\boldsymbol{B}\right)}^T\left(\boldsymbol{A}-\boldsymbol{B}\right)}
    $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equf.png)


    By using this formula to compute the similarity of our example users, we get the
    following:


    ![$$ \mathrm{EucDist}\left(\mathbf{Tyler},\mathbf{Sarah}\right)=\sqrt{\left(5-5\right)\left(5-5\right)+\left(5-5\right)\left(5-5\right)}=0
    $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equg.png)


    ![$$ \mathrm{EucDist}\left(\mathbf{Tyler},\mathbf{Mike}\right)=\sqrt{\left(5-5\right)\left(5-5\right)+\left(5-1\right)\left(5-1\right)}=4
    $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equh.png)


    ![$$ \mathrm{EucDist}\left(\mathbf{Tyler},\mathbf{Jane}\right)=\sqrt{\left(5-1\right)\left(5-1\right)+\left(5-1\right)\left(5-1\right)}=4\sqrt{2}
    $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equi.png)


    These results look much better than the previous similarity measure. This formula
    also differs from the cosine similarity in that it produces larger numbers the
    more two vectors differ from each other. That is not a problem per se; it is just
    something we need to be aware of when designing our algorithm.


    The Euclidean squared distance is a computationally simplified measure. It differs
    from the Euclidian distance only in that it does not perform the last square root
    calculation and so becomes


    ![$$ EucDis{t}^2\left(\boldsymbol{A},\boldsymbol{B}\right)={\left(\boldsymbol{A}-\boldsymbol{B}\right)}^T\left(\boldsymbol{A}-\boldsymbol{B}\right)
    $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equj.png)


    One thing to note, and the entire reason this simplification works, is that it
    preserves the relative ordering of elements. Suppose that we have two numbers
    – `x` and `y`. Then the following holds:


    ![$$ \sqrt{x}\le \sqrt{y}\Longrightarrow x&lt;y,\kern0.5em \forall x,y\ge 0 $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equk.png)


    The square root is a somewhat expensive operation for a computer to carry out.
    If we can leave it out, then we definitely will! Since two numbers will not switch
    their relative ordering because we leave out the square roots, we will cut some
    computational corners by skipping them.


    Let us quickly compute the similarity between the example users, just to check
    out the new calculations:


    ![$$ {\mathrm{EucDist}}^2\left(\mathbf{Tyler},\mathbf{Sarah}\right)=\left(5-5\right)\left(5-5\right)+\left(5-5\right)\left(5-5\right)=0
    $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equl.png)


    ![$$ {\mathrm{EucDist}}^2\left(\mathbf{Tyler},\mathbf{Mike}\right)=\left(5-5\right)\left(5-5\right)+\left(5-1\right)\left(5-1\right)=16
    $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equm.png)


    ![$$ {\mathrm{EucDist}}^2\left(\mathbf{Tyler},\mathbf{Jane}\right)=\left(5-1\right)\left(5-1\right)+\left(5-1\right)\left(5-1\right)=32
    $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equn.png)


    That looks good. Tyler is still most similar to Sarah and least similar to Jane.
    However, there is still one more edge case we need to address.


    Our service has an extensive collection of movies in its database. It is unlikely
    that all users saw all movies, and it is even less likely that they rated them
    all. We need to decide how to handle these calculations when some ratings are
    missing.


    Since a 0 rating in the data marks missing ratings, no numerical issues are stopping
    us from computing the Euclidean squared distance as is. However, we are likely
    to run into some inconsistencies.


    - If we compare two new users that have not had the chance to rate anything yet,
    the data will show zeros for all of their possible ratings. Our calculations will
    interpret that as the users being very similar, even though we have no idea if
    that is true.

    - Imagine that we compare a new user, without any ratings, with two older users.
    Suppose that one of the older users gave all movies a 1, while the other gave
    all movies a 5. Our algorithm would think that the new user is more similar to
    the user that gave everything a rating of 1 since the Euclidean squared distance
    is shorter between those. However, we do not know which one is more similar.


    The solution that we choose for this implementation is to interpret a missing
    rating as an uncertainty. If one or both users have not rated a movie, we count
    one of the ratings as 0 and the other as 5. This way, a missing rating will add
    more to the distance measure, making the users a little less similar.


    Now that we know how to determine which users are similar, it is time to take
    on the next task. Somehow, we need to recommend movies that the user will like.


    ## Expected Ratings


    Before we head into this section, let us take a moment to remind ourselves of
    the structure of the ratings. A user of our service is associated with the following
    information:


    - A unique user ID.

    - A collection of ratings for all the available movies.

    - A rating is an integer value between one and five. If the user has not yet rated
    a specific movie, it has a default rating of zero.


    To compute the expected rating of a movie, we can use the formula we learned in
    Chapter [3](#512351_1_En_3_Chapter.xhtml):


    ![$$ \mathbbm{E}\left[R\right]=\sum \limits_{r\in R}r\cdotp p(r) $$](images/512351_1_En_7_Chapter/512351_1_En_7_Chapter_TeX_Equo.png)


    While this formula is technically correct, we cannot simply implement it as is.
    The way we structure our data forces us to expand on it slightly to make rational
    calculations. Let us start with a modification that does not directly impact the
    mathematical formulation but rather the computation of probabilities for each
    rating.'
