    ![$$ P\left[x&gt;105\right]=1-P\left[x&lt;105\right] $$](images/512351_1_En_5_Chapter/512351_1_En_5_Chapter_TeX_Equm.png)


    If it is less than 5%, then we can confidently reject the null hypothesis and
    confirm that the dean’s claim is probably correct. The code in Listing [5-3](#512351_1_En_5_Chapter.xhtml#PC3)
    shows a small Swift program that computes and prints the information we want.


    ```

    let numberOfStudents = 30.0

    let WAISAverage = 100.0

    let WAISSD = 15.0

    let computedAverageScore = 105.0

    let sdScalar = sqrt(numberOfStudents.realValue)

    let normalDist = NormalDistribution(

    mean: WAISAverage,

    standardDeviation: WAISSD / sdScalar

    )

    let probability = 1 - normalDist.cdf(x: computedAverageScore)

    let confidence = 1 - probability

    let probString = String(

    format: "%.2f",

    probability * 100

    )

    let confString = String(

    format: "%.2f",

    confidence * 100

    )

    print(

    """

    There is a \(probString)% chance that the computed

    average belongs to the null hypothesis.

    We can be \(confString)% confident if we reject

    the null hypothesis!

    """

    )

    // Prints:

    // There is a 3.39% chance that the computed

    // average belongs to the null hypothesis.

    // We can be 96.61% confident if we reject

    // the null hypothesis!

    Listing 5-3

    A Swift script that tests the dean’s hypothesis

    ```


    As we can see, scoring an average of 105 on the WAIS test was not as likely as
    one perhaps could have thought. There is only a 3.4% chance that we are wrong
    if we choose to reject the null hypothesis – consequently meaning that we can
    be about 96.6% certain that we are correct. Since we wanted to be at least 95%
    sure, we can tell the dean that they have every reason to be proud of the students.


    Chapter [5](#512351_1_En_5_Chapter.xhtml) in the code project contains a SwiftUI
    View called `IQHypothesisTest.swift`, which computes and displays this result
    depending on which values we put into the different fields. Feel free to play
    around with it and see how the sample size, the computed average, and the null
    hypothesis values impact our confidence in the decision to reject H[0].'
