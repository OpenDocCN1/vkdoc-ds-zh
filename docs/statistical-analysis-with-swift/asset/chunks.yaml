    在尝试对现实世界进行预测时，对其进行建模是一项非常有用的技能。然而，观察两组观测数据并评估某些重要指标是否发生了显著变化，同样是一项有用的技能。这正是我们将在下一章中研究的问题。


    # 5. 假设检验


    假设检验是统计学中一个有价值的分支。它在处理那些分布可能随时间或因某些事件而变化的随机变量时，可以为我们提供帮助。然而，它也是学生认为最令人生畏且最难理解的主题之一。在本章中，我们将通过几个例子来学习如何提出一个假设，并利用Swift来确定它是否比当前公认的真相更有可能成立。'
