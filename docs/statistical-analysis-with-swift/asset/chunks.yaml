  trans: '

    ### `KeyPath` 类型


    Swift 标准库中最强大的特性之一就是 `KeyPath` 类型。它让开发者能够在运行时动态访问对象属性，同时又不牺牲类型安全。在本节中，我们将通过几个代码示例，探索
    `KeyPath` 类型的概念及其在编写灵活且可维护代码中的应用。


    首先，我们来看如何使用 `KeyPath` 访问对象属性。下一页的代码清单 1-5 展示了用 `KeyPath` 打印每个 `Person` 对象姓名的示例。同时，该示例还介绍了
    `DataLoader` 的使用，它是 `StatisticalSwift` 模块的一部分。为了从数据集中获取所有人的数组，我们调用了 `load(_:from:)`
    方法，并指定期望返回的类型。


    ```

    let people = DataLoader.load(

    Person.self,

    from: .people

    )

    let nameKey = \Person.name

    for person in people {

    let name = person[keyPath: nameKey]

    print("Name: \(name)")

    }

    // 输出:

    // Name: Anna

    // Name: Keith

    代码清单 1-5

    使用 KeyPath 从人员 CSV 文件中打印姓名

    ```


    我们使用 `\` 操作符，后跟要引用的属性，来创建一个 `KeyPath` 实例。新实例的类型是 `KeyPath<Person, String>`，这明确表示我们引用的是
    `Person` 对象中存储的一个 `String` 属性。这个特定示例相较于熟悉的点语法并没有增加多少价值，它的目的是介绍这种类型及其最基本的用法。要探索一个更实际（且更贴近真实场景）的用例，请看下一页的代码清单
    1-6。


    ```

    let names = people

    .map(\.name)

    .joined(separator: " and ")

    let ages = people

    .map(\.age)

    .map(String.init)

    .joined(separator: " and ")

    let totalAge = people

    .sum(over: \.age)

    print(

    """

    We have \(names) with us today!

    They are aged \(ages), respectively,

    totaling \(totalAge) years together!

    """

    )

    // 输出:

    // We have Anna and Keith with us today!

    // They are aged 34 and 36, respectively,

    // totaling 70 years together!

    代码清单 1-6

    使用 KeyPath 执行数据转换

    ```


    在这个例子中，`KeyPath` 类型将不同的属性转换为新的数据类型。在创建 `names` 和 `ages` 变量时，`KeyPath` 将相应的属性值映射到数组中，然后这些数组可以进一步处理并格式化为
    `String` 对象。请注意，这个示例使用了隐式成员语法来引用属性。只要编译器能推断出我们正在处理 `Person` 类型，就可以使用 `\.name`
    这个简写形式，而不是 `\Person.name` 来引用 `name` 属性。


    `totalAge` 变量提供了一个稍微复杂且更有趣的用例。方法 `sum(over:)` 来自 `StatKit` 模块，它不要求 `KeyPath` 引用特定类型的属性，而是要求被引用的类型遵循
    `AdditiveArithmetic` 协议。这意味着我们可以自由指向任何属性，只要该属性存储的类型支持 `+` 操作符即可。


    最后，我们快速了解一下 `PartialKeyPath`。这种类型将动态行为发挥到了极致，因为它对被引用的属性没有任何类型要求。这一特性使得编写高度灵活的代码成为可能，前提是我们能够对类型擦除的对象执行预期的操作。代码清单
    1-7 展示了这一示例。


    ```

    let partialkeys: [PartialKeyPath] = [

    \Person.name,

    \Person.age

    ]

    for _ in 1 ... 5 {

    guard

    let randomKey = partialkeys.randomElement(),

    let person = people.randomElement()

    else { continue }

    let value = person[keyPath: randomKey]

    print(value)

    }

    // 输出 5 个随机属性值，

    // 例如 Anna、Keith 或 36

    代码清单 1-7

    使用部分类型擦除的 KeyPath 随机打印 Person 对象的某个属性

    ```


    这些示例展示了不同 `KeyPath` 类型的一些可能用途。当我们开始着手解决本书后续提出的问题时，会发现这种类型如何完美融入工作流程，以及它如何让我们轻松改变计算逻辑。接下来，我们该讨论一个在前面的示例中已初见端倪、并且在深入实现之前需要理解的主题了。

