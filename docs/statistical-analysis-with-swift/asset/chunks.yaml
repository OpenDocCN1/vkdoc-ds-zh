    **Note**


    The chart in Figure [3-2](#512351_1_En_3_Chapter.xhtml#Fig2) looks very similar
    to the one in Figure [3-1](#512351_1_En_3_Chapter.xhtml#Fig1), and it does so
    for a good reason. The diagram in Figure [3-1](#512351_1_En_3_Chapter.xhtml#Fig1)
    also depicts a PMF (of a discrete uniform distribution). In fact, every discrete
    distribution has a PMF.


    We know that the PMF gives us a way to compute the probability of a single outcome.
    But, what if we want to know how likely it is that we need to flip the coin at
    most three times before it lands heads up? To do so, we can follow a pretty straightforward
    train of thought:


    - First, we conclude that it does not matter to this question if we succeed in
    one, two, or three tries. All of them satisfy our predicate and are therefore
    valid.

    - Second, we realize that the PMF gives us a way to calculate the probability
    of a single outcome.


    By writing down our question mathematically and using some of the rules we learned
    about in previous chapters, we get


    `P[X ≤ 3] = P[X = 1 ∪ X = 2 ∪ X = 3] =`


    `P[X = 1] + P[X = 2] + P[X = 3] = Σ_{x=1}^3 P[X = x]`


    The second to last equality comes from the fact that the events are mutually exclusive.
    We can therefore sum the individual probabilities without compensating for overlaps.
    Finally, if we assume that the coin is fair and has a 50-50 chance of landing
    with either side facing up, we can expand the formula, substitute the actual values
    for `p` and `q`, and compute a result like so:


    `P[X ≤ 3] = Σ_{x=1}^3 P[X = x] = Σ_{x=1}^3 p * q^(x-1) =`


    `0.5 * 0.5^0 + 0.5 * 0.5^1 + 0.5 * 0.5^2 = 0.875`


    According to this result, a fair coin will land heads up within three flips in
    87.5% of cases. Had the coin been biased, with `p = 0.3`, that probability would
    have been 0.657. That is quite a difference!


    The function that we just derived for the geometric distribution, `P[X ≤ x]`,
    is also a special one. It is called the cumulative distribution function (CDF),
    and it tells us how likely it is that a randomly sampled point from a distribution
    is less than or equal to some `x`. Figure [3-3](#512351_1_En_3_Chapter.xhtml#Fig3)
    visualizes this relationship by highlighting the probabilities we summed over
    to arrive at a result for `P[X ≤ 3]`.


    ![../images/512351_1_En_3_Chapter/512351_1_En_3_Fig3_HTML.png](images/512351_1_En_3_Chapter/512351_1_En_3_Fig3_HTML.png)


    **Figure 3-3**


    The CDF is computed by summing over all probabilities smaller than or equal to
    some number. In this case, that number is 3


    In the case of the coin flip, we used it to compute the proportion of times we
    would need at most three flips before a toss came out heads up. Listing [3-3](#512351_1_En_3_Chapter.xhtml#PC3)
    shows a code snippet that calculates the probability of needing at most five coin
    flips, given that we use a heavily biased coin with `p = 0.25`. We see that there
    is only about a 76% chance of a toss landing heads up with such a strong bias,
    even if we flip the coin five times!


