- fmt: "其次，我们使用`indirect`关键字标记了`HuffmanNode`。这个关键字在撰写本文时并不常见，但它允许枚举递归地引用自身。在`indirect`出现之前，开发者不能使用值类型来创建图状结构。这一限制源于编译器计算不同类型内存占用方式。如果值类型引用自身，编译器会认为需要无限的内存来存储实例。得益于`indirect`关键字，我们现在可以像这样使用`enum`。不过，`struct`仍然会抛出编译错误。\n\
    \n创建树的算法首先将字节及其各自的计数映射到每个叶节点。然后，它将两个最小的节点分组为一个新的分支节点，从而构建一棵完整的树，直到集合中只剩下一个节点，即根节点。\n\
    \n需要注意的重要一点是，如果我们要对`HuffmanNode`实例进行排序，它们需要遵循`Comparable`协议。我们希望根据频率计数对节点进行排序。如果它们的计数相等，则根据字节值进行排序。这种回退行为并非绝对必要，但它能以可预测的方式打破平局，确保每次运行算法时，同一文本生成的霍夫曼树都相同。清单[6-7](#512351_1_En_6_Chapter.xhtml#PC7)和代码项目中的`HuffmanNode+Comparable.swift`文件显示了遵循`Comparable`协议所需的实现。\n\
    \n```\nextension HuffmanNode: Comparable {\n    static func < (lhs: HuffmanNode,\
    \ rhs: HuffmanNode) -> Bool {\n        switch (lhs, rhs) {\n        case (.leaf(let\
    \ lhsValue, let lhsCount), .leaf(let rhsValue, let rhsCount)):\n            return\
    \ lhsCount == rhsCount ? lhsValue < rhsValue : lhsCount < rhsCount\n        default:\n\
    \            return false\n        }\n    }\n\n    static func == (lhs: HuffmanNode,\
    \ rhs: HuffmanNode) -> Bool {\n        switch (lhs, rhs) {\n        case (.node(let\
    \ lhsleft, let lhsright), .node(let rhsleft, let rhsright)):\n            return\
    \ lhsleft == rhsleft && lhsright == rhsright\n        case (.leaf(let lhsValue,\
    \ let lhsCount), .leaf(let rhsValue, let rhsCount)):\n            return lhsValue\
    \ == rhsValue && lhsCount == rhsCount\n        default:\n            return false\n\
    \        }\n    }\n}\n```\n清单 6-7\n使我们的`HuffmanNode`遵循`Comparable`协议\n\n现在我们有了霍夫曼树，是时候将树和文本都编码为二进制表示形式了。我们首先使用清单[6-8](#512351_1_En_6_Chapter.xhtml#PC8)中显示的`createTreeData(from:)`方法来编码树。\n\
    \n```\nfunc createTreeData(\n    from node: HuffmanNode\n) -> Data {\n    switch\
    \ node {\n    case .node(let lhs, let rhs):\n        let left = createTreeData(from:\
    \ lhs)\n        let right = createTreeData(from: rhs)\n        let branchMarker\
    \ = Data(repeating: 0, count: 1)\n        return branchMarker + left + right\n\
    \    case .leaf(var value, var count):\n        let valueData = Data(\n      \
    \      bytes: &value,\n            count: MemoryLayout<UInt8>.size\n        )\n\
    \        let countData = Data(\n            bytes: &count,\n            count:\
    \ MemoryLayout<Int>.size\n        )\n        let leafMarker = Data(repeating:\
    \ 1, count: 1)\n        return leafMarker + countData + valueData\n    }\n}\n\
    ```\n清单 6-8\n将霍夫曼树编码为可与压缩文本一起存储的二进制表示形式\n\n`createTreeData(from:)`的递归性质使其成为一个相当简洁的方法。其核心思想如下：\n\
    \n-   如果将一个叶节点传入函数，我们只需返回一个二进制包，其中包含叶节点标记、频率计数以及与该节点关联的字节。\n-   如果将一个分支节点传入函数，我们知道可以访问两个子节点。我们通过将它们传入递归方法调用来进行编码，然后返回一个分支节点标记，后跟左节点和右节点分别返回的数据。由于从树向下所有路径都保证会到达一个叶节点，我们可以确保递归会在某个有限的时间点终止。\n\
    \n正如我们之前提到的，如果想要节省更多空间，这部分实现还有改进的余地。每个标记向数据对象增加了整整一个字节，尽管从技术上讲我们可以用一个比特来表示它。只要稍微动动脑筋，发挥创意，就可以使用我们在以下方法中看到的相同思路重新实现`createTreeData(from:)`。清单[6-9](#512351_1_En_6_Chapter.xhtml#PC9)展示了`encodeText(_:with:frequencies:)`的实现，它会创建文本的压缩二进制表示。\n\
    \n```\nfunc encodeText(\n    _ text: String,\n    with root: HuffmanNode,\n  \
    \  frequencies: [UInt8: Int]\n) throws -> (data: Data, numberOfBits: Int) {\n\
    \    let codes = root.codeMap()\n    let numberOfBits = frequencies\n        .reduce(into:\
    \ 0) { result, args in\n            let (byte, count) = args\n            let\
    \ mapping = codes[byte, default: (Data(), 0)]\n            result += mapping.bitLength\
    \ * count\n        }\n    let numberOfBytes = 1 + (numberOfBits - 1) / 8\n   \
    \ var encoding = Data(\n        repeating: 0,\n        count: numberOfBytes\n\
    \    )\n    var textVar = text\n    var index = 0\n    try textVar.withUTF8 {\
    \ pointer in\n        try pointer.forEach { byte in\n            guard let (bits,\
    \ bitCount) = codes[byte]\n            else { throw HuffmanError.textEncodingFailure\
    \ }\n            for offset in 0 ..< bitCount {\n                let mask: UInt8\
    \ = 0x80 >> (offset % 8)\n                let masked = bits[offset / 8] & mask\n\
    \                if masked > 0 {\n                    encoding[index / 8] |= 0x80\
    \ >> (index % 8)\n                }\n                index += 1\n            }\n\
    \        }\n    }\n    return (encoding, numberOfBits)\n}\n```\n清单 6-9\n使用计算出的霍夫曼树对文本字符串进行编码\n\
    \n这个函数使用了诸如位运算等底层编程概念，我们可以花另一本书来讨论其中无数的细节。然而，为传达核心概念，我们将从较高层次进行讨论。欢迎在代码项目中尝试实现，这将让你更深入地理解其中的小细节。\n\
    \n首先，`encodeText(_:with:frequencies:)`要求我们计算出的霍夫曼树创建一个所有编码的映射。我们不会详细讨论`codeMap()`方法，因为它只是将霍夫曼编码简化为`Dictionary`格式。编码映射的类型注解是`[UInt8:\
    \ (Data, Int)]`，它将每个字节映射到其各自的霍夫曼编码和编码长度。\n\n在下一步中，我们计算编码文本所需的总比特数。我们还将比特数转换为相应的字节数，并分配表示编码文本所需的内存。\n\
    \n和之前一样，我们需要一个指向原始文本的指针，并需要创建一个可变的版本。我们通过将其存储在一个新的`textVar`变量中来解决这一点。我们还创建了一个计数器变量`index`来跟踪当前正在编码的比特。现在，思路是遍历文本中的字节，检索其霍夫曼编码，并将每个1或0写入新的存储中。`for`循环相当直接，但让我们仔细看看这些位运算。\n\
    \n`mask`变量创建一个位掩码，用于定位霍夫曼编码中的单个比特。然后我们使用`mask`来计算`masked`变量，如果目标霍夫曼编码比特为0，则`masked`为零；如果编码比特为1，则`masked`非零。由于我们将`encoding`存储初始化为全零，因此只有当`masked`变量大于零时，我们才需要写入一个比特。在迭代结束时，我们递增`index`变量以指示可以继续处理下一个比特。\n\
    \n该函数随后返回`encoding`对象和我们用于编码文本的比特数，正如我们之前讨论的那样。此时，我们只需按正确顺序连接我们的计算结果，并将其返回给调用点。在主脚本中，我们可以打印原始文本的大小和压缩数据的大小以查看差异，如清单[6-10](#512351_1_En_6_Chapter.xhtml#PC10)所示。"
  raw: 'Secondly , we have marked the `HuffmanNode` with the `indirect` keyword. This
    keyword is a construct that is not very common to see out in the wild at the time
    of writing. However, it allows an enumeration to reference itself recursively.
    Before `indirect` came about, developers were not allowed to use value types to
    create graph-like structures. This limitation stemmed from the compiler and how
    it computed the memory footprint of different types. If a value type referenced
    itself, the compiler would think it needed infinite memory to store an instance.
    Thanks to the indirect keyword, we are now allowed to use `enum`s like this. However,
    `struct`s still throw a compilation error.


    The algorithm that creates the tree starts by mapping the bytes and their respective
    counts to one leaf node each. It then builds a full tree by grouping the two smallest
    nodes into a new branch node until only a single node remains in the collection
    – the root node.


    One important thing to note is that we need the HuffmanNode instances to conform
    to the `Comparable` protocol if we want to sort them. We want to order the nodes
    according to their frequency count. If their counts are equal, we instead order
    them according to the byte value. This fallback behavior is not strictly necessary
    but will break ties in a predictive way, making sure that a text generates the
    same Huffman tree every time we run the algorithm. Listing [6-7](#512351_1_En_6_Chapter.xhtml#PC7)
    and the `HuffmanNode+Comparable.swift` file in the code project show the implementations
    needed to conform to the Comparable protocol.


    ```

    extension HuffmanNode: Comparable {

    static func ,

    rhs: HuffmanNode

    ) -> Bool {

    switch (lhs, rhs) {

    case (.leaf(let lhsValue, let lhsCount),

    .leaf(let rhsValue, let rhsCount)):

    return lhsCount == rhsCount

    ? lhsValue ,

    rhs: HuffmanNode

    ) -> Bool {

    switch (lhs, rhs) {

    case (.node(let lhsleft, let lhsright),

    .node(let rhsleft, let rhsright)):

    return

    lhsleft == rhsleft &&

    lhsright == rhsright

    case (.leaf(let lhsValue, let lhsCount),

    .leaf(let rhsValue, let rhsCount)):

    return

    lhsValue == rhsValue &&

    lhsCount == rhsCount

    default:

    return false

    }

    }

    }

    Listing 6-7

    Conforming our HuffmanNodes to the Comparable protocol

    ```


    Now that we have a Huffman tree, it has come time to encode both it and the text
    into binary representations. We start by encoding the tree, using the method `createTreeData(from:)`
    shown in Listing [6-8](#512351_1_En_6_Chapter.xhtml#PC8).


    ```

    func createTreeData(

    from node: HuffmanNode

    ) -> Data {

    switch node {

    case .node(let lhs, let rhs):

    let left = createTreeData(from: lhs)

    let right = createTreeData(from: rhs)

    let branchMarker = Data(repeating: 0, count: 1)

    return branchMarker + left + right

    case .leaf(var value, var count):

    let valueData = Data(

    bytes: &value,

    count: MemoryLayout.size

    )

    let countData = Data(

    bytes: &count,

    count: MemoryLayout.size

    )

    let leafMarker = Data(repeating: 1, count: 1)

    return leafMarker + countData + valueData

    }

    }

    Listing 6-8

    Encoding our Huffman tree into a binary representation that can be stored with
    the compressed text

    ```


    The recursive nature of `createTreeData(from:)` makes it a pretty compact method.
    The general idea comes down to the following:


    *   If a leaf node is sent into the function, we simply return a binary package
    consisting of a leaf node marker, the frequency count, and the byte associated
    with the node.


    *   If a branch node is passed into the function, we know that we have access
    to two child nodes. We encode them by passing them into a recursive method call,
    and then we return a branch node marker, followed by the data returned by the
    left node and the right node, respectively. Since all paths down the tree are
    guaranteed to hit a leaf node, we can be sure that the recursion terminates at
    some finite point in time.


    As we mentioned earlier, this part of the implementation has room for improvement
    if one wants to save even more space. Each marker adds an entire byte to the data
    object, even though we could technically represent it using a single bit. With
    a little bit of work and creative thinking, one could re-implement `createTreeData(from:)`
    using the same ideas we will see in the following method. Listing [6-9](#512351_1_En_6_Chapter.xhtml#PC9)
    shows the implementation of `encodeText(_:with:frequencies:)`, which creates a
    compressed binary representation of our text.


    ```

    func encodeText(

    _ text: String,

    with root: HuffmanNode,

    frequencies: [UInt8: Int]

    ) throws -> (data: Data, numberOfBits: Int) {

    let codes = root.codeMap()

    let numberOfBits = frequencies

    .reduce(into: 0) { result, args in

    let (byte, count) = args

    let mapping = codes[byte, default: (Data(), 0)]

    result += mapping.bitLength * count

    }

    let numberOfBytes = 1 + (numberOfBits - 1) / 8

    var encoding = Data(

    repeating: 0,

    count: numberOfBytes

    )

    var textVar = text

    var index = 0

    try textVar.withUTF8 { pointer in

    try pointer.forEach { byte in

    guard let (bits, bitCount) = codes[byte]

    else { throw HuffmanError.textEncodingFailure }

    for offset in 0 ..> (offset % 8)

    let masked = bits[offset / 8] & mask

    if masked > 0 {

    encoding[index / 8] |= 0x80 >> (index % 8)

    }

    index += 1

    }

    }

    }

    return (encoding, numberOfBits)

    }

    Listing 6-9

    Encoding a text string using the computed Huffman tree

    ```


    This function utilizes lower-level programming concepts such as bitwise operations,
    and there is an endless sea of details that we could spend another book discussing.
    However, to get the general ideas across, we will keep the discussion on a higher
    level. Feel free to experiment with the implementation in the code project since
    that will give a deeper understanding of the small details.


    First, `encodeText(_:with:frequencies:)` asks the Huffman tree we computed to
    create a map of all the codes. We will not go through the `codeMap()` method in
    detail since it merely reduces the Huffman codes into a `Dictionary` format. The
    type annotation of the code map is `[UInt8: (Data, Int)]` and maps each byte to
    its respective Huffman code and the length of the code.


    In the next step, we compute the total number of bits needed to encode the text.
    We also translate the number of bits into the corresponding number of bytes and
    allocate as much memory as we need to represent the encoded text.


    Like before, we will need a pointer to the original text and need to create a
    mutable version of it. We take care of that by storing it in a new `textVar` variable.
    We also create a counter variable, `index`, to track which bit we are currently
    encoding. Now, the idea is to iterate over the bytes in the text, retrieve the
    Huffman code for it, and write each one or zero into the new storage. The `for`
    loops are pretty straightforward, but let us take a closer look at the bitwise
    operations.


    The `mask` variable creates a bitmask that targets a single bit in the Huffman
    code. We then use the `mask` to compute the `masked` variable, which is zero if
    the targeted Huffman code bit is zero and nonzero if the code bit is one. Since
    we initialized the `encoding` storage to all zeros, we only need to write a bit
    if the `masked` variable is greater than zero. At the end of the iteration, we
    increment the `index` variable to indicate that we are ready to move on to the
    next bit.


    The function later returns the `encoding` object and the number of bits we used
    to encode the text, just like we discussed before. All we have to do at this point
    is to concatenate our computations in the correct order and return it to the call
    site. Inside the main script, we can print the size of the original text and the
    size of the compressed data to see the difference, like shown in Listing [6-10](#512351_1_En_6_Chapter.xhtml#PC10).'
