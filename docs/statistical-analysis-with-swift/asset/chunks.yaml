- fmt: 'A distribution made up of a linear combination of two beta distributions


    ![../images/512351_1_En_5_Chapter/512351_1_En_5_Fig3_HTML.png](images/512351_1_En_5_Chapter/512351_1_En_5_Fig3_HTML.png)


    Figure 5-3


    The distribution of 1000 sample means computed from the gamma distribution in
    Figure [5-2](#512351_1_En_5_Chapter.xhtml#Fig2) and an overlaid normal distribution
    with parameters `μ ≈ 0.994` and `σ ≈ 0.102`


    ![../images/512351_1_En_5_Chapter/512351_1_En_5_Fig2_HTML.png](images/512351_1_En_5_Chapter/512351_1_En_5_Fig2_HTML.png)


    Figure 5-2


    A gamma distribution with parameters `α = 3` and `β = 3`


    Let us first discuss the gamma distribution. Plotting all 1000 sample means in
    a histogram shows us that the distribution is bell shaped. When we compare it
    to a normal distribution with our estimated parameters `μ` and `σ`, we can see
    that they match very well. We can also note that the estimated mean, `μ`, is very
    close to the true mean of this distribution, which is 1. One could perhaps argue
    that this particular gamma distribution looks a little bit like a skewed normal
    distribution and that the approximation, therefore, becomes better. However, looking
    at the subsequent figures, we can see that is not the case.


    The linear combination of two beta distributions forms an interesting shape. It
    has two peaks and looks nothing like a normal distribution. Still, computing 1000
    sample means with a sample size of 30 and plotting them in a histogram shows a
    distribution that has a very similar shape to the one in the gamma example. Comparing
    it to the curve of a normal distribution, we see that even though they do not
    fit quite as well as in the first example, the match is still impressive given
    how odd looking the original distribution is.


    Now that we know that a normal distribution can approximate the distribution of
    sample means, we can address what a tail is:


    - A left-tailed test is interested in how small the sample mean needs to be before
    it is considered a statistical anomaly. That is, how much lower than `μ` does
    it have to be before it is too small to have come up by chance?

    - A right-tailed test describes the opposite: how large a sample mean must be
    before it is too large to be a coincidence.

    - A two-tailed test is interested in how much the sample mean must differ from
    `μ` in any direction before we are comfortable saying that it cannot be by random
    chance.


    With this theory covered, we are ready to determine what we consider “too unlikely”
    and start testing some hypotheses!


    ## Testing the Hypothesis


    The tools and theory we have gone through are just about all that we need to tell
    whether the university’s dean is correct in their claim. Let us start by formulating
    our null and alternative hypotheses. In this case, we are investigating a claim
    that the dean’s students have above-average intelligence. The null hypothesis
    must be the complement, which is that they have equal to or below-average intelligence.
    The mean intelligence score according to WAIS is 100, which gives us


    ![$$ {H}_0:\kern1em \mu \le 100 $$](images/512351_1_En_5_Chapter/512351_1_En_5_Chapter_TeX_Equi.png)


    ![$$ {H}_1:\kern1em \mu &gt;100 $$](images/512351_1_En_5_Chapter/512351_1_En_5_Chapter_TeX_Equj.png)


    The next step in the process is to decide how confident we want to be in our decision.
    Suppose we decide that the university students have, in fact, above-average intelligence.
    In that case, we want to minimize the chance that all the students we sampled
    come from the top IQ segment on campus. We want to determine a confidence level
    and an alpha value.


    ### Determining Confidence Levels


    A confidence level, commonly denoted by the letter `c`, determines how certain
    we need to be of our results to reject the null hypothesis. It tells us how much
    the test statistic must differ from `μ` before the alternative hypothesis becomes
    more likely than the null hypothesis. If we decide that we want to be 95% certain,
    then


    ![$$ c=0.95 $$](images/512351_1_En_5_Chapter/512351_1_En_5_Chapter_TeX_Equk.png)


    Besides telling us where to draw the line between rejecting and keeping the null
    hypothesis, the confidence level also plays a part in justifying our decisions
    when explaining it to others. If we end up rejecting the null hypothesis, thereby
    saying that the university’s students are brighter than average, a confidence
    level of 0.95 would mean that we are at least 95% certain that the decision is
    correct.


    ### Determining Alpha Values


    On the opposite side of the confidence level is the alpha value, denoted by the
    Greek letter `α`. We define it as


    ![$$ \alpha =1-c $$](images/512351_1_En_5_Chapter/512351_1_En_5_Chapter_TeX_Equl.png)


    If we wanted a confidence level of 0.95, then `α` would be 0.05. While the confidence
    level specifies how sure we want to be of the results, the alpha acts from the
    opposite end. In this case, it says that there can only be a 5% chance that the
    distribution from `H[0]` produces a sample mean that is more extreme than the
    one we calculate.


    ### Performing the Test


    Let us decide on a confidence level of 0.95, which consequently means an alpha
    value of 0.05. The sampled students have produced an average score of 105. WAIS
    is normally distributed, with `μ = 100` and `σ = 15`. We want to know how likely
    it is that the WAIS distribution produces a sample mean that is greater than 105
    – that is:


    ![$$ P\left[x&gt;105\right]=1-P\left[x&lt;105\right] $$](images/512351_1_En_5_Chapter/512351_1_En_5_Chapter_TeX_Equm.png)


    If it is less than 5%, then we can confidently reject the null hypothesis and
    confirm that the dean’s claim is probably correct. The code in Listing [5-3](#512351_1_En_5_Chapter.xhtml#PC3)
    shows a small Swift program that computes and prints the information we want.


    ```

    let numberOfStudents = 30.0

    let WAISAverage = 100.0

    let WAISSD = 15.0

    let computedAverageScore = 105.0

    let sdScalar = sqrt(numberOfStudents.realValue)

    let normalDist = NormalDistribution(

    mean: WAISAverage,

    standardDeviation: WAISSD / sdScalar

    )

    let probability = 1 - normalDist.cdf(x: computedAverageScore)

    let confidence = 1 - probability

    let probString = String(

    format: "%.2f",

    probability * 100

    )

    let confString = String(

    format: "%.2f",

    confidence * 100

    )

    print(

    """

    There is a \(probString)% chance that the computed

    average belongs to the null hypothesis.

    We can be \(confString)% confident if we reject

    the null hypothesis!

    """

    )

    // Prints:

    // There is a 3.39% chance that the computed

    // average belongs to the null hypothesis.

    // We can be 96.61% confident if we reject

    // the null hypothesis!

    ```


    Listing 5-3


    As we can see, scoring an average of 105 on the WAIS test was not as likely as
    one perhaps could have thought. There is only a 3.4% chance that we are wrong
    if we choose to reject the null hypothesis – consequently meaning that we can
    be about 96.6% certain that we are correct. Since we wanted to be at least 95%
    sure, we can tell the dean that they have every reason to be proud of the students.


    Chapter [5](#512351_1_En_5_Chapter.xhtml) in the code project contains a SwiftUI
    View called `IQHypothesisTest.swift`, which computes and displays this result
    depending on which values we put into the different fields. Feel free to play
    around with it and see how the sample size, the computed average, and the null
    hypothesis values impact our confidence in the decision to reject `H[0]`.'
