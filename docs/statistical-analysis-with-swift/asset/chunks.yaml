    probabilities that a movie receives some rating. We base these probabilities on
    the neighbors we computed earlier, so they should somewhat represent how the user
    requesting suggestions could rate each movie. Now that we have distributions to
    work with, we are finally ready to compute an expected rating for each movie.
    Listing [7-8](#512351_1_En_7_Chapter.xhtml#PC8) shows the implementation of `expectedRatings(using:)`,
    which handles this task for us.


    ```

    func expectedRatings(

    using ratingsDist: [[Double]]

    ) -> [Double] {

    ratingsDist

    .map { distribution -> Double in

    let bayesDenom = 1 - distribution[0]

    return distribution

    .enumerated()

    .dropFirst()

    .reduce(into: 0.0) { expectation, args in

    let (intRating, prob) = args

    let rating = intRating.realValue

    expectation += rating * prob / bayesDenom

    }

    }

    }

    Listing 7-8

    Calculating an expected rating for each movie in the collection

    ```


    The program iterates over the arrays holding the rating distribution for each
    movie. For each distribution, we compute the term *p(r > 0)* and store it in the
    variable named `bayesDenom`. We use the enumeration trick to get each rating along
    with the probability, drop the first entry since that contains the placeholder
    for non-ratings, and compute the expected value using the formula we derived earlier.


    This function produces an array of real numbers, one for each movie. Each number
    represents the expected rating of a movie as determined by the most similar users.
    This collection of expected values should roughly represent how the user we are
    making recommendations for would rate each movie. All that remains is to extract
    the top-rated movies and return their names. Listing [7-9](#512351_1_En_7_Chapter.xhtml#PC9)
    shows `getTopRated(movies:for:expectations:)`, which performs this last step and
    completes the movie recommendation task.


    ```

    private static func getTopRated(

    movies: Int,

    for someone: MovieWatcher,

    expectations: [Double]

    ) -> [String] {

    expectations

    .enumerated()

    .sorted { lhs, rhs in

    if someone.ratings[lhs.offset] != 0 {

    return false

    }

    if someone.ratings[rhs.offset] != 0 {

    return true

    }

    return lhs.element > rhs.element

    }

    .dropLast(expectations.count - movies)

    .map { index, _ in

    someone.titles[index]

    }

    }

    Listing 7-9

    Mapping the top expected ratings to a collection of recommended movies

    ```


    Most of the stages in this processing pipeline should look familiar by now. The
    enumeration pairs each expected rating to the index of the movie it describes.
    However, the sorting stage does something that is not immediately obvious. Even
    though a movie may have an excellent expected rating, we do not want to suggest
    it if the user has already rated it. So instead of sorting only on the expected
    values, we add two conditions that place already rated movies further down the
    list.


    Once we have finished sorting, we drop all but the first `movie` ratings and map
    them back to their respective titles. These two stages produce an array of movie
    titles that we can return to the main program and display to the user. Listing
    [7-10](#512351_1_En_7_Chapter.xhtml#PC10) shows us printing the recommendations
    in the main program.


    ```

    print(

    """

    Recommended movies for user \(user.id):

    \(

    recommendations

    .joined(separator: "\n")

    )

    """

    )

    // Prints:

    // Recommended movies for user 1:

    //

    // Dawn Patrol

    // Surfer, Dude

    // Winnie Mandela

    // Grand Theft Parsons

    // An American in Hollywood

    Listing 7-10

    Printing the suggested movies for the user with ID 1

    ```


    We have some movie suggestions! We know that the user we wanted suggestions for
    was a fan of comedies and horror movies, so let us assess how reasonable these
    recommendations are. Table [7-4](#512351_1_En_7_Chapter.xhtml#Tab4) shows the
    genres of each suggested movie.


    Table 7-4


    The suggested movies and their genres


    | Movie | Genres |

    | --- | --- |

    | *Dawn Patrol* | Thriller/Drama |

    | *Surfer, Dude* | Comedy |

    | *Winnie Mandela* | History/Drama |

    | *Grand Theft Parsons* | Comedy/Drama |

    | *An American in Hollywood* | Comedy/Drama |


    These results look pretty decent. There are quite a few comedies in the suggestions.
    One thriller, we could argue, is related to the horror genre in some sense.


    The only movie that does not immediately fit into the user’s genre preferences
    is Winnie Mandela, which is a drama movie. However, these movies were all suggested
    by others who like many of the same movies that our user does. It may be a good
    match, even if the genres do not line up perfectly. Remember that the idea of
    this type of collaborative filtering is to look at the perceived quality of a
    movie inside a group of like-minded people. Since genres are not as important,
    we may end up with suggestions that cross the boundaries of genre preferences
    but that a user could still enjoy.


