    | `sphere` | 绘制中心在原点的单位球体，使用 20×20 个面。 |

    | `sphere(n)` | 使用 `n`×`n` 个面绘制单位球体。 `>> sphere(100)` ![A978-1-4842-0322-4_3_Figbb_HTML.jpg](img/A978-1-4842-0322-4_3_Figbb_HTML.jpg)
    |

    | `[X, Y, Z] = sphere(n)` | 在三个 `(n+1)`×`(n+1)` 的数组中给出球体的坐标。 |

    | `slice(V, sx, sy, sz)`, `slice(X, Y, Z, V, sx, sy, sz)`, `slice(V, XI, YI, ZI)`,
    `slice(X, Y, Z, V, XI, YI, ZI)`, `slice(..., ''method'')` | 在体积 `V` 中，沿 x、y、z
    方向在向量 `sx`、`sy` 和 `sz` 指定的点处绘制切片。`V` 是一个 `m`×`n`×`p` 的体积数组，包含默认位置 `X = 1:n`、`Y
    = 1:m`、`Z = 1:p` 处的数据值。向量 `sx`、`sy` 和 `sz` 中的每个元素定义了 x、y 或 z 轴方向上的一个切片平面。在 `X`、`Y`
    和 `Z` 为单调正交间隔的三维数组（为 `V` 指定坐标）时，绘制体积 `V` 的切片。每个点的颜色通过对体积 `V` 进行三维插值确定。绘制由矩阵 `XI`、`YI`
    和 `ZI` 定义的曲面切片在体积 `V` 中的数据，并在曲面点处对体积进行评估。`XI`、`YI` 和 `ZI` 必须尺寸相同。沿数组 `XI`、`YI`、`ZI`
    定义的曲面，对体积 `V` 进行切片绘制。指定插值方法。选项有 `''linear''`、`''cubic''` 或 `''nearest''`。 `>>
    [x, y, z] = meshgrid(-2:.2:2, -2:.25:2, -2:.16:2);` `v = x .* exp(-x.² - y.² -
    z.²);` `slice(x, y, z, v, [-1.2, .8, 2], 2, [-2, 0])` ![A978-1-4842-0322-4_3_Figbc_HTML.jpg](img/A978-1-4842-0322-4_3_Figbc_HTML.jpg)
    |

    | `stem3(Z)`, `stem3(X, Y, Z)`, `stem3(..., ''fill'')`, `stem3(..., S)` | 将 `Z`
    绘制为一系列垂直茎，其底部位于 xy 平面上。底部位置自动生成。将序列 `Z` 绘制为垂直茎，底部位置由 `X` 和 `Y` 指定。用颜色填充茎尖的圆圈。创建一个三维茎叶图，并指定线型、标记和颜色
    `S`。 `>> X = linspace(0, 1, 10);` `Y = X / 2;` `Z = sin(X) + cos(Y);` `stem3(X,
    Y, Z, ''fill'')` ![A978-1-4842-0322-4_3_Figbd_HTML.jpg](img/A978-1-4842-0322-4_3_Figbd_HTML.jpg)
    |


    ## 专业化图形


    MATLAB 提供了用于创建各种图形和图表（填充区域图、彗星图、等高线图、网格图、曲面图、散点图、帕累托图、阶梯图）的命令。您还可以修改坐标轴规格，并且有一个易于使用的函数绘图器。下表展示了这些命令的语法。

