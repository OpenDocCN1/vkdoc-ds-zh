- fmt: '# 2D and 3D Graphics Options


    MATLAB includes many different commands which enable graphics handling, including
    titles, legends and axis labels, addition of text to plots, and adjustment of
    coloring and shading. The most important commands are summarized in the following
    table.


    | `title(''text'')` | Adds a title to the top of the current axes. |

    | `xlabel(''text'')` | Adds an x-axis label. |

    | `ylabel(''text'')` | Adds a y-axis label. |

    | `zlabel(''text'')` | Adds a z-axis label. |

    | `clabel(C,h)` | Labels contour lines of a contour plot with a `''+''`, rotating
    the labels so they are positioned on the inside of the contour lines. |

    | `clabel(C,h,v)` | Labels contour lines of a contour plot only for the levels
    given by the vector `v`, rotating the labels so they are positioned on the inside
    of the contour lines. |

    | `datetick(axis)` | Creates date formatted tick labels for the specified axis
    (`''x''`, `''y''` or `''z''`). |

    | `datetick(axis,date)` | Creates date formatted tick labels for the specified
    axis (`''x''`, `''y''` or `''z''`) with the given date format (an integer between
    1 and 28). |

    | `legend(''string1'',''string2'',...)` | Displays a legend in the current axes
    using the specified strings to label each set of data. |

    | `legend(h,''string1'',''string2'',...)` | Displays a legend on the plot containing
    the objects identified by the vector `h` and uses the specified strings to label
    the corresponding graphics object. |

    | `legend(''off'')` | Deletes the current axes legend. |

    | `text(x,y,''text'')` | Places the given text at the point `(x,y)` within a 2D
    plot. |

    | `text(x,y,z,''text'')` | Places the given text at the point `(x,y,z)` in a 3D
    plot. |

    | `gtext(''text'')` | Allows you place text at a mouse-selected point in a 2D
    plot. |

    | `grid` | Adds grid lines to 2D and 3D plots. `grid on` adds major grid lines
    to the axes, `grid off` removes all grid lines from the current axes. The command
    `grid` toggles the visibility of the major grid lines. |

    | `hold` | Controls whether the current graph is cleared when you make subsequent
    calls to plotting functions (the default), or adds a new graph to the current
    graph, maintaining the existing graph with all its properties. The command `hold
    on` retains the current graph and adds another graph to it. The command `hold
    off` resets to default properties before drawing a new graph. |

    | `axis([xmin,xmax,ymin,ymax,zmin,zmax])` | Sets the axes limits. |

    | `axis(''auto'')` | Computes the axes limits automatically (`xmin = min(x)`,
    `xmax = max(x)`). |

    | `axis(axis)` | Freezes the scaling at the current limits, so that if `hold`
    is on, subsequent plots use the same limits. |

    | `V = axis` | Returns a row vector `V` containing scaling factors for the x-,
    y-, and z-axis. `V` has four or six components depending on whether the plot is
    2D or 3D, respectively. |

    | `axis(''xy'')` | Uses Cartesian coordinates with the origin at the bottom left
    of the graph. |

    | `axis(''tight'')` | Sets the axis limits to the range of the data. |

    | `axis(''ij'')` | Places the origin at the top left of the graph. |

    | `axis(''square'')` | Makes the current axes region a square (or a cube when
    three-dimensional). |

    | `axis(''equal'')` | Uses the same scaling factor for both axes. |

    | `axis(''normal'')` | Removes the `square` and `equal` options. |

    | `axis(''off'')` | Turns off all axis lines, tick marks, and labels, keeping
    the title of the graph and any `gtext` text. |

    | `axis(''on'')` | Turns on all axis lines, tick marks, and labels. |

    | `subplot(m,n,p)` | Divides the current figure into an `m×n` grid and creates
    axes in the grid position specified by `p`. The grids are numbered by row, so
    that the first grid is the first column of the first row, the second grid is the
    second column of the first row, and so on. |

    | `plotyy(X1,Y1,X2,Y2)` `plotyy(X1,Y1,X2,Y2,''function'')` `plotyy(X1,Y1,X2,Y2,''function1'',''function2'')`
    | Plots `X1` versus `Y1` with y-axis labeling on the left and plots `X2` versus
    `Y2` with y-axis labeling on the right. Same as the previous command, but using
    the specified plotting function (`plot`, `loglog`, `semilogx`, `semilogy`, `stem`
    or any acceptable function `h = function(x,y)`) to plot the graph. Uses `function1(X1,Y1)`
    to plot the data for the left axis and `function2(X2,Y2)` to plot the data for
    the right axis. |

    | `axis([xmin,xmax,ymin,ymax,zmin,zmax])` | Sets the x-, y-, and z-axis limits.
    Also accepts the options `''ij''`, `''square''`, `''equal''`, etc, identical to
    the equivalent two-dimensional command. |

    | `view([x,y,z])` | Sets the viewing direction to the Cartesian coordinates `x`,
    `y`, and `z`. |

    | `view([az,el])` | Sets the viewing angle for a three-dimensional plot. The azimuth,
    `az`, is the horizontal rotation about the z-axis as measured in degrees from
    the negative y-axis. Positive values indicate counterclockwise rotation of the
    viewpoint. `el` is the vertical elevation of the viewpoint in degrees. Positive
    values of elevation correspond to moving above the object; negative values correspond
    to moving below the object. |

    | `hidden` | Hidden line removal draws only those lines that are not obscured
    by other objects in a 3-D view. The command `hidden on` hides such obscured lines
    while `hidden off` shows them. |

    | `shading` | Controls the type of shading of a surface created with the commands
    `surf`, `mesh`, `pcolor`, `fill` and `fill3`. The option `shading flat` gives
    a smooth shading, `shading interp` gives a dense shadow and `shading faceted`
    (default) yields a standard shading. |

    | `colormap(M)` | Sets the colormap to the matrix. `M` must have three columns
    and only contain values between 0 and 1. It can also be a matrix whose rows are
    vectors of RGB type `[r g b]`. There are some pre-defined arrays `M`, which are
    as follows: `jet(p)`, `HSV(p)`, `hot(p)`, `cool(p)`, `spring(p)`, `summer(p)`,
    `autumn(p)`, `winter(p)`, `gray(p)`, `bone(p)`, `copper(p)`, `pink(p)`, `lines(p)`.
    All arrays have 3 columns and `p` rows. For example, the syntax `colormap(hot(8))`
    sets `hot(8)` as the current colormap. |

    | `brighten(p)` | Adjust the brightness of the figure. If `0 < p < 1`, the figure
    will be brighter, and if `-1 < p < 0` the figure will be darker. |

    | `image(A)` | Creates an image graphics object by interpreting each element in
    a matrix as an index into the figure''s colormap or directly as RGB values, depending
    on the data specified. |

    | `pcolor(A)` | Produces a pseudocolor plot, i.e. a rectangular array of cells
    with colors determined by `A`. The elements of `A` are linearly mapped to an index
    into the current colormap. |

    | `caxis([cmin,cmax])` | Sets the color limits to the specified minimum and maximum
    values. Data values less than `cmin` or greater than `cmax` map to `cmin` and
    `cmax`, respectively. Values between `cmin` and `cmax` linearly map to the current
    colormap. |

    | `h = figure` `figure(h)` | Creates a figure graphics object with name `h`. Makes
    the figure identified by `h` the current figure, makes it visible, and attempts
    to raise it above all other figures on the screen. The current figure is the target
    for graphics output. The command `close(h)` deletes the figure identified by `h`.
    The command `whitebg(h)` complements all the colors of the figure `h`. The `clf`
    command closes the current figure. The command `graymon` sets defaults for graphics
    properties to produce more legible displays for grayscale monitors. The `refresh`
    command redraws the figure. |

    | `e = axes` `axes(e)` | Creates axes objects named `e`. Makes the existing axes
    `e` the current axes and brings the figure containing it into focus. The command
    `gca` returns the name of the current axes. The command `cla` deletes all objects
    related to the current axes. |

    | `l = line(x,y)` or `l = line(x,y,z)` | Creates, as an object of name `l`, the
    line joining the points `X`, `Y` in the plane or the points `X`, `Y`, `Z` in space.
    |

    | `p = patch(X,Y,C)` or `patch(X,Y,Z,C)` | Creates an opaque polygonal area `p`
    that is defined by the set of points `(X,Y)` in the plane or `(X,Y,Z)` in space,
    and whose color is given by `C`. |

    | `s = surface(X,Y,Z,C)` | Creates parametric surface `s` defined by `X`, `Y`
    and `Z` and whose color is given by `C`. |

    | `i = image(C)` | Creates an image `i` from the matrix `C`. Each element of `C`
    specifies the color of a rectangular segment in the image. |

    | `t = text(x,y,''string'')` or `t = text(x,y,z,''string'')` | Creates the text
    `t` defined by the chain, located at the point `(x,y)` in the plane, or at the
    point `(x,y,z)` in space. |

    | `set(h,''property1'',''property2'',...)` | Sets the named properties for the
    object `h` (`gca` for limits of axes), `gcf`, `gco`, `gcbo`, `gcbd`, colors, etc.
    |

    | `get(h,''property'')` | Returns the current value of the given property of the
    object `h`. |

    | `object = gco` | Returns the name of the current object. |

    | `rotate(h,v,α,[p,q,r])` | Rotates the object `h` by an angle `α` about an axis
    of rotation described by the vector `v` from the point `(p,q,r)`. |

    | `reset(h)` | Updates all properties assigned to the object `h` replacing them
    with their default values. |

    | `delete(h)` | Deletes the object `h`. |


    In addition, the most typical properties of graphics objects in MATLAB are the
    following:


    | Object | Properties | Possible values |

    | --- | --- | --- |

    | Figure | `Color` (background color) | `''y''`, `''m''`, `''c''`, `''r''`, `''g''`,
    `''b''`, `''w''`, `''k''` |

    | | `ColorMap` (map color) | `hot(p)`, `gray(p)`, `pink(p)`, .... |

    | | `Position` (figure position) | `[left, bottom, width, height]` |

    | | `Name` (figure name) | string name |

    | | `MinColorMap` (min. color no.) | minimum number of colors for map |

    | | `NextPlot` (graph. mode following.) | `new`, `add`, `replace` |

    | | `NumberTitle` (no. in the figure title) | `on`, `off` |

    | | `Units` (units of measurement) | `pixels`, `inches`, `centimeters`, `points`
    |

    | | `Resize` (size figure with mouse) | `on` (can be changed), `off` (cannot be
    changed) |

    | Axes | `Box` (box axes) | `on`, `off` |

    | | `Color` (color of the axes) | `''y''`, `''m''`, `''c''`, `''r''`, `''g''`,
    `''b''`, `''w''`, `''k''` |

    | | `GridLineStyle` (line for mesh) | `''-''`, `''--''`, `'':''`, `''-.''` |

    | | `Position` (origin position) | `[left, bottom, width, height]` |

    | | `TickLength` (distance between marks) | a numeric value |

    | | `TickDir` (direction of marks) | `in`, `out` |

    | | `Units` (units of measurement) | `pixels`, `inches`, `centimeters`, `points`
    |

    | | `View` (view) | `[azimuth, elevation]` |

    | | `FontAngle` (angle of source) | `normal`, `italic`, `oblique` |

    | | `FontName` (name of source) | the name of the source text |

    | | `FontSize` (font size) | numeric value |

    | | `FontWeight` (weight) | `light`, `normal`, `demi`, `bold` |

    | | `DrawMode` property (drawing mode) | `normal`, `fast` |

    | | `Xcolor`, `Ycolor`, `Zcolor` (axes color) | `[min, max]` |

    | | `XDir`, `YDir`, `ZDir` (axes direction) | `normal` (increasing from left to
    right), `reverse` |

    | | `XGrid`, `YGrid`, `ZGrid` (grids) | `on`, `off` |

    | | `XLabel`, `YLabel`, `ZLabel` (tags) | string containing the text of labels
    |

    | | `XLim`, `YLim`, `ZLim` (limit values) | `[min, max]` (range of variation)
    |

    | | `XScale`, `YScale`, `ZScale` (scales) | `linear`, `log` |

    | | `XTick`, `YTick`, `ZTick` (marks) | `[m1,m2,…]` (position of marks on axis)
    |

    | Line | `Color` (color of the line) | `''y''`, `''m''`, `''c''`, `''r''`, `''g''`,
    `''b''`, `''w''`, `''k''` |

    | | `LineStyle` (line style) | `''-''`, `''--''`, `'':''`, `''-.''`, `''+''`,
    `''*''`, `''.''`, `''x''` |

    | | `LineWidth` (line width) | numeric value |

    | | `Visible` (visible line or not displayed.) | `on`, `off` |

    | | `Xdata`, `Ydata`, `Zdata` (coordinates.) | set of coordinates of the line
    |

    | Text | `Color` (text color) | `''y''`, `''m''`, `''c''`, `''r''`, `''g''`, `''b''`,
    `''w''`, `''k''` |

    | | `FontAngle` (angle of source) | `normal`, `italic`, `oblique` |

    | | `FontName` (name of source) | the name of the source text |

    | | `FontSize` (font size) | numeric value |

    | | `FontWeight` (weight) | `light`, `normal`, `demi`, `bold` |

    | | `HorizontalAlignment` (hor. setting.) | `left`, `center`, `right` |

    | | `VerticalAlignment` (adjust to vert.) | `top`, `cap`, `middle`, `baseline`,
    `bottom` |

    | | `Position` (position on screen) | `[x, y, z]` (text coordinates) |

    | | `Rotation` (orientation of the text) | `0`, `±90`, `±180`, `±270` |

    | | `Units` (units of measurement) | `pixels`, `inches`, `centimeters`, `points`
    |

    | | `String` (text string) | the text string |

    | Surface | `CDATA` (color of each point) | color matrix |

    | | `Edgecolor` (color grids) | `''y''`,`''m''`,…, `none`, `flat`, `interp` |

    | | `Facecolor` (color of the faces) | `''y''`,`''m''`,…, `none`, `flat`, `interp`
    |

    | | `LineStyle` (line style) | `''-''`, `''--''`, `'':''`, `''-.''`, `''+''`,
    `''*''`, `''.''`, `''x''` |

    | | `LineWidth` (line width) | numeric value |

    | | `MeshStyle` (lines in rows and col.) | `row`, `column`, `both` |

    | | `Visible` (visible line or not displayed.) | `on`, `off` |

    | | `Xdata`, `Ydata`, `Zdata` (coordinates) | set of coordinates of the surface
    |

    | Patch | `CDATA` (color of each point) | color matrix |

    | | `Edgecolor` (color of the axes) | `''y''`,`''m''`,…, `none`, `flat`, `interp`
    |

    | | `Facecolor` (color of the faces) | `''y''`,`''m''`,…, `none`, `flat`, `interp`
    |

    | | `LineWidth` (line width) | numeric value |

    | | `Visible` (visible line or not displayed.) | `on`, `off` |

    | | `Xdata`, `Ydata`, `Zdata` (coordinates) | set of coordinates of the surface
    |

    | Image | `CDATA` (color of each point) | color matrix |

    | | `Xdata`, `Ydata` (coordinates) | set of coordinates of the image |


    Here are some illustrative examples.


    ```

    >> x=linspace(0,2,30);

    y=sin(x.^2);

    plot(x,y)

    text(1,0.8, ''y=sin(x^2)'')

    hold on

    z=log(sqrt(x));

    plot(x,z)

    text(1,-0.1, ''y=log(sqrt(x))'')

    xlabel(''x-axis'');

    ylabel(''y-axis'');

    title(''Sinoidal and logarithmic graphs'');

    ```


    ![A978-1-4842-0322-4_3_Figbu_HTML.jpg](A978-1-4842-0322-4_3_Figbu_HTML.jpg)


    ```

    >> subplot(2,2,1);

    ezplot(''sin(x)'',[-2*pi 2*pi])

    subplot(2,2,2);

    ezplot(''cos(x)'',[-2*pi 2*pi])

    subplot(2,2,3);

    ezplot(''csc(x)'',[-2*pi 2*pi])

    subplot(2,2,4);

    ezplot(''sec(x)'',[-2*pi 2*pi])

    ```


    ![A978-1-4842-0322-4_3_Figbv_HTML.jpg](A978-1-4842-0322-4_3_Figbv_HTML.jpg)


    ```

    >> [X, Y] = meshgrid(-2:0.05:2);

    Z = X.^2 - Y.^2;

    subplot(2,2,1)

    surf(X,Y,Z)

    subplot(2,2,2)

    surf(X,Y,Z),view(-90,0)

    subplot(2,2,3)

    surf(X,Y,Z),view(60,30)

    subplot(2,2,4)

    surf(X,Y,Z), view (-10, 30)

    ```


    ![A978-1-4842-0322-4_3_Figbw_HTML.jpg](A978-1-4842-0322-4_3_Figbw_HTML.jpg)


    ```

    >> [X,Y]=meshgrid(-2:0.05:2);

    Z=X.^2-Y.^2;

    surf(X,Y,Z),shading interp,brighten(0.75),colormap(gray(5))

    ```


    ![A978-1-4842-0322-4_3_Figbx_HTML.jpg](A978-1-4842-0322-4_3_Figbx_HTML.jpg)


    ## Exercise 3-1


    Represent the surface defined by the equation:


    ![A978-1-4842-0322-4_3_Fig1_HTML.jpg](A978-1-4842-0322-4_3_Fig1_HTML.jpg)


    ```

    >> [x,y]=meshgrid(0:0.05:2,-2:0.05:2);

    >> z=y.^2.*(x-1).^2./(y.^2+(x-1).^2);

    >> mesh(x,y,z),view([-23,30])

    ```


    ![A978-1-4842-0322-4_3_Figby_HTML.jpg](A978-1-4842-0322-4_3_Figby_HTML.jpg)


    We could also have represented the surface in the following form:


    ```

    >> ezsurf(''y^2*(x-1)^2/(y^2+(x-1)^2)'')

    ```


    ![A978-1-4842-0322-4_3_Figbz_HTML.jpg](A978-1-4842-0322-4_3_Figbz_HTML.jpg)


    ## Exercise 3-2


    Let the function `f: R² → R` be defined by:


    ![A978-1-4842-0322-4_3_Fig2_HTML.jpg](A978-1-4842-0322-4_3_Fig2_HTML.jpg)


    Represent it graphically in a neighborhood of `(0,0)`.


    ```

    >> [x,y]=meshgrid(-1/100:0.0009:1/100,-1/100:0.0009:1/100);

    >> z=(1-cos(x)).*sin(y)./(x.^3+y.^3);

    >> surf(x,y,z)

    >> view([50,-15])

    ```


    ![A978-1-4842-0322-4_3_Figca_HTML.jpg](A978-1-4842-0322-4_3_Figca_HTML.jpg)


    ## Exercise 3-3


    Plot the following two curves, given in polar coordinates, next to each other:


    ![A978-1-4842-0322-4_3_Fig3_HTML.jpg](A978-1-4842-0322-4_3_Fig3_HTML.jpg)


    Also find the intersection of the two curves.


    ```

    >> a=0:.1:2*pi;

    >> subplot(1,2,1)

    >> r=sqrt(cos(2*a));

    >> polar(a,r)

    >> title(''r = sqrt(cos(2a))'')

    >> subplot (1,2,2)

    >> r = sin(2*a);

    >> polar (a, r)

    >> title(''r = sin(2a)'')

    ```


    ![A978-1-4842-0322-4_3_Figcb_HTML.jpg](A978-1-4842-0322-4_3_Figcb_HTML.jpg)


    To find the intersection of the two curves, we draw them both on the same axes.


    ```

    >> a = 0:.1:2*pi;

    >> r=sqrt(cos(2*a));

    >> polar(a,r)

    >> hold on;

    >> r=sin(2*a);

    >> polar(a,r)

    ```


    ![A978-1-4842-0322-4_3_Figcc_HTML.jpg](A978-1-4842-0322-4_3_Figcc_HTML.jpg)


    ## Exercise 3-4


    Represent the surface generated by rotating the cubic


    ![A978-1-4842-0322-4_3_Fig4_HTML.jpg](A978-1-4842-0322-4_3_Fig4_HTML.jpg)


    around the OX axis, between the limits


    ![A978-1-4842-0322-4_3_Fig5_HTML.jpg](A978-1-4842-0322-4_3_Fig5_HTML.jpg)


    and


    ![A978-1-4842-0322-4_3_Fig6_HTML.jpg](A978-1-4842-0322-4_3_Fig6_HTML.jpg)


    .


    The surface of revolution has equation `y²+z²=(12x−9x²+2x³)²`, and to graph it
    we use the following parameterization:


    ![A978-1-4842-0322-4_3_Fig7_HTML.jpg](A978-1-4842-0322-4_3_Fig7_HTML.jpg)


    ```

    >> t=(0:.1:5/2);

    >> u=(0:.5:2*pi);

    >> x=ones(size(u))''*t;

    >> y=cos(u)''*(12*t-9*t.^2+2*t.^3);

    >> z=sin(u)''*(12*t-9*t.^2+2*t.^3);

    >> surf(x,y,z)

    ```


    ![A978-1-4842-0322-4_3_Figcd_HTML.jpg](A978-1-4842-0322-4_3_Figcd_HTML.jpg)


    ## Exercise 3-5


    Plot the surfaces produced by rotating the ellipse


    ![A978-1-4842-0322-4_3_Fig8_HTML.jpg](A978-1-4842-0322-4_3_Fig8_HTML.jpg)


    around the OX axis and around the OY axis.


    We represent the generated figures alongside each other, but only the positive
    halves of each figure. The equation of the surface of revolution around the OX
    axis is `y²+z²=9(1−x²/4)`, and is given parametrically by:


    ![A978-1-4842-0322-4_3_Fig9_HTML.jpg](A978-1-4842-0322-4_3_Fig9_HTML.jpg)


    The equation of the surface of revolution around the OY axis is `x²+z²=4(1−y²/4)`
    and has the parametrization:


    ![A978-1-4842-0322-4_3_Fig10_HTML.jpg](A978-1-4842-0322-4_3_Fig10_HTML.jpg)


    ```

    >> t=(0:.1:2);

    >> u=(0:.5:2*pi);

    >> x=ones(size(u))''*t;

    >> y=cos(u)''*3*(1-t.^2/4).^(1/2);

    >> z=sin(u)''*3*(1-t.^2/4).^(1/2);

    >> subplot(1,2,1)

    >> surf(x,y,z)

    >> subplot(1,2,2)

    >> x=cos(u)''*3*(1-t.^2/4).^(1/2);

    >> y=ones(size(u))''*t;

    >> z=sin(u)''*3*(1-t.^2/4).^(1/2);

    >> surf(x,y,z)

    ```


    ![A978-1-4842-0322-4_3_Figce_HTML.jpg](A978-1-4842-0322-4_3_Figce_HTML.jpg)


    ## Exercise 3-6


    Represent the intersection of the paraboloid `x² + y² = 2z` with the plane `z
    = 2`.


    ```

    >> [x,y]=meshgrid(-3:.1:3);

    >> z=(1/2)*(x.^2+y.^2);

    >> mesh(x,y,z)

    >> hold on;

    >> z=2*ones(size(z));

    >> mesh(x,y,z)

    >> view(-10,10)

    ```


    ![A978-1-4842-0322-4_3_Figcf_HTML.jpg](A978-1-4842-0322-4_3_Figcf_HTML.jpg)


    ## Exercise 3-7


    Represent the volume in the first octant enclosed between the OXY plane, the plane
    `z = x + y + 2` and the cylinder `x² + y² = 16`.


    We graphically represent the enclosed volume using Cartesian coordinates for the
    plane and parametrizing the cylinder.


    ```

    >> t=(0:.1:2*pi);

    >> u=(0:.1:10);

    >> x=4*cos(t)''*ones(size(u));

    >> y=4*sin(t)''*ones(size(u));

    >> z=ones(size(t))''*u;

    >> mesh(x,y,z)

    >> hold on;

    >> [x,y]=meshgrid(-4:.1:4);

    >> z=x+y+2;

    >> mesh(x,y,z)

    >> set(gca,''Box'',''on'');

    >> view(15,45)

    ```


    ![A978-1-4842-0322-4_3_Figcg_HTML.jpg](A978-1-4842-0322-4_3_Figcg_HTML.jpg)


    ## Exercise 3-8


    Represent the volume bounded by the paraboloid `x² + 4y² = z` and laterally by
    the cylinders `y² = x` and `x² = y`.


    ```

    >> [x,y]=meshgrid(-1/2:.02:1/2,-1/4:.01:1/4);

    >> z = x.^2 + 4*y.^2;

    >> mesh(x,y,z)

    >> hold on;

    >> y=x.^2;

    >> mesh(x,y,z)

    >> hold on;

    >> x=y.^2;

    >> mesh(x,y,z)

    >> set(gca,''Box'',''on'')

    >> view(-60,40)

    ```


    ![A978-1-4842-0322-4_3_Figch_HTML.jpg](A978-1-4842-0322-4_3_Figch_HTML.jpg)


    ## Exercise 3-9


    Plot the parabolas `y² = x` and `x² = y` on the same axes. Also plot the parabola
    `y² = 4x` and the straight line `x + y = 3` on the same axes.


    ```

    >> fplot(''[x^2,sqrt(x)]'',[0,1.2])

    ```


    ![A978-1-4842-0322-4_3_Figci_HTML.jpg](A978-1-4842-0322-4_3_Figci_HTML.jpg)


    ```

    >> fplot(''[(4*x)^(1/2),3-x]'',[0,4,0,4])

