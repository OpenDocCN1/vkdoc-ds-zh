- fmt: '# 3. Curves in Explicit, Parametric and Polar Coordinates. Surfaces


    ## Introduction


    MATLAB is a scientific software that implements high-performance graphics. It
    allows to you create two and three-dimensional graphs of exploratory data, graph
    curves in explicit, implicit and polar coordinates, plot surfaces in explicit,
    implicit, or parametric coordinates, draw mesh and contour plots, represent various
    geometric objects and create other specialized graphics.


    You can freely adjust the graphics parameters, choosing such features as framing
    and positioning, line characteristics, markers, axes limits, mesh types, annotations,
    labels and legends. You can export graphics in many different formats. All of
    these features will be described in this chapter.


    ## Exploratory Graphics


    MATLAB incorporates commands that allow you to create basic exploratory graphics,
    such as histograms, bar charts, graphs, arrow diagrams, etc. The following table
    summarizes these commands. For all of them, it is necessary to first define the
    field of variation of the variable.


    | `bar(Y)` | Creates a bar chart relative to the vector of frequencies `Y`. If
    `Y` is a matrix it creates multiple bar charts for each row of `Y`. `>> x = [1
    2 5 8 4 3 4 1 2 3 2];` `>> bar (x)` ![A978-1-4842-0322-4_3_Figa_HTML.jpg](A978-1-4842-0322-4_3_Figa_HTML.jpg)
    |

    | `bar(x,Y)` | Creates a bar chart relative to the vector of frequencies `Y` where
    `x` is a vector that defines the location of the bars on the x-axis. `>> x = -2.9:0.2:2.9;`
    `>> bar (x, exp(-x.*x))` ![A978-1-4842-0322-4_3_Figb_HTML.jpg](A978-1-4842-0322-4_3_Figb_HTML.jpg)
    |

    | `bar(…,width)` | Creates a bar chart where the bars are given the specified
    width. By default, the width is 0.8. A width of 1 causes the bars to touch. |

    | `bar(…, ''style ''  )` | Creates a bar chart with the given style of bars. The
    possible styles are `''group''` (the default vertical bar style) and `''stack''`
    (stacked horizontal bars). If the matrix is m× n, the bars are grouped in m groups
    of n bars. `>> A = [1 6 12 5 7; 3 2 6 5 3];` `>> bar (A, ''stack'')` `>> bar (A,
    ''group'')` ![A978-1-4842-0322-4_3_Figc_HTML.jpg](A978-1-4842-0322-4_3_Figc_HTML.jpg)
    |

    | `bar(…, color)` | Creates a bar chart where the bars are all of the specified
    color (r = red, g = green, b = blue, c = cyan, m = magenta, y = yellow, k = black
    and w = white). |

    | `barh(…)` | Creates a horizontal bar chart. `>> barh (A, ''group'')` ![A978-1-4842-0322-4_3_Figd_HTML.jpg](A978-1-4842-0322-4_3_Figd_HTML.jpg)
    |

    | `hist(Y)` | Creates a histogram relative to the vector of frequencies `Y` using
    10 equal basis equally spaced rectangles. If `Y` is a matrix, a histogram is created
    for each of its columns. `>> Y = randn(100);` `>> hist(Y)` ![A978-1-4842-0322-4_3_Fige_HTML.jpg](A978-1-4842-0322-4_3_Fige_HTML.jpg)
    |

    | `hist(Y,x)` | Creates a histogram relative to the vector of frequencies `Y`
    where the number of bins is given by the number of elements in the vector `x`
    and the data is sorted according to vector `x` (if the entries of `x` are evenly
    spaced then these are used as the centers of the bins, otherwise the midpoints
    of successive values are used as the bin edges). |

    | `hist(Y,k)` | Creates histogram relative to the vector of frequencies `Y` using
    as many bins as indicated by the scalar `k`. `>> hist(Y, 8)` ![A978-1-4842-0322-4_3_Figf_HTML.jpg](A978-1-4842-0322-4_3_Figf_HTML.jpg)
    |

    | `[n,x] = hist(…)` | Returns the vectors `n` and `x` with the frequencies assigned
    to each bin of the histogram and the locations of the centers of each bin. |

    | `pie(X)` | Creates a pie chart relative to the vector of frequencies `X` `>>
    X = [3 5 12 4 7 10];` `>> pie(X)` ![A978-1-4842-0322-4_3_Figg_HTML.jpg](A978-1-4842-0322-4_3_Figg_HTML.jpg)
    |

    | `pie(X,Y)` | Creates a pie chart relative to the vector of frequencies `X` by
    moving out the sectors for which `Yi ≠ 0`. `>> pie(X,[0 0 1 0 1 1])` ![A978-1-4842-0322-4_3_Figh_HTML.jpg](A978-1-4842-0322-4_3_Figh_HTML.jpg)
    |

    | `errorbar(x,y,e)` | Plots the function `y` against `x` showing the error ranges
    specified by the vector `e`. To indicate the confidence intervals a vertical line
    of length `2e[i]` is drawn passing through each point `(x[i], y[i])` with center
    `(x[i], y[i])`. `>> x = - 4:.2:4;` `y = (1/sqrt(2*pi))*exp(-(x.^2)/2);` `e = rand
    (size (x)) / 10;` `errorbar(x,y,e)` ![A978-1-4842-0322-4_3_Figi_HTML.jpg](A978-1-4842-0322-4_3_Figi_HTML.jpg)
    |

    | `stem(Y)` | Plots the data sequence `Y` as stems extending from the x-axis baseline
    to the points indicated by a small circle. `>> y = randn (50.1); stem (y)` ![A978-1-4842-0322-4_3_Figj_HTML.jpg](A978-1-4842-0322-4_3_Figj_HTML.jpg)
    |

    | `stem(X,Y)` | Plots the data sequence `Y` as a stem diagram with x-axis values
    determined by `X`. |

    | `stairs(Y)` | Draws a stairstep graph of the data sequence `Y`. |

    | `stairs(X,Y)` | Plots a stairstep graph of the data `Y` where the x-values are
    determined by the vector `X`. `>> x=-3:0.1:3; stairs(x,exp(-x.^2))` ![A978-1-4842-0322-4_3_Figk_HTML.jpg](A978-1-4842-0322-4_3_Figk_HTML.jpg)
    |

    | `rose (Y)` | Creates an angle histogram showing the distribution of the data
    `Y` in 20 angle bins. The angles are given in radians. The radii reflect the number
    of elements falling into the corresponding bin. `>> y = randn (1000,1) * pi; rose
    (y)` ![A978-1-4842-0322-4_3_Figl_HTML.jpg](A978-1-4842-0322-4_3_Figl_HTML.jpg)
    |

    | `rose(Y,n)` | Plots an angle histogram of the data `Y` with `n` equally spaced
    bins. The default value of `n` is 20. |

    | `rose(Y,X)` | Plots an angle histogram of the data `Y` where `X` specifies the
    number and location (central angle) of the bins. |

    | `compass(Z)` | Plots a compass diagram of the data `Z`. For each entry of the
    vector of complex numbers `Z` an arrow is drawn with base at the origin and head
    at the point determined by the entry. `>> z=eig(randn(20,20)); compass(z)` ![A978-1-4842-0322-4_3_Figm_HTML.jpg](A978-1-4842-0322-4_3_Figm_HTML.jpg)
    |

    | `compass(X,Y)` | Equivalent to `compass(X+i*Y)`. |

    | `compass(Z, S)` or `compass(X, Y, S)` | Plots a compass diagram with arrow styles
    specified by `S`. |

    | `feather(Z)` or `feather(X,Y)` or `feather(Z,S)` or `feather(X,Y,S)` | Produces
    a plot similar to a compass plot, except the arrows now emanate from equally-spaced
    points along the x-axis instead of from the origin. `>> z=eig(randn(20,20)); feather(z)`
    ![A978-1-4842-0322-4_3_Fign_HTML.jpg](A978-1-4842-0322-4_3_Fign_HTML.jpg) |


    ## Curves in Explicit, Implicit, Parametric and Polar Coordinates


    The most important MATLAB commands for plotting curves in two dimensions in explicit,
    polar and implied coordinates are presented in the following table.'
