- fmt: '# The MATLAB Working Environment


    The following table summarizes the main components of the MATLAB working environment.


    | Tool | Description |

    | --- | --- |

    | Command History | This presents a history of the functions introduced in the
    Command Window and allows you to copy and execute them (see the lower right part
    of Figure [1-2](#A978-1-4842-0322-4_1_Chapter.html#Fig2)). |

    | Command Window | This is the window in which you execute MATLAB commands (see
    the central part of Figure [1-2](#A978-1-4842-0322-4_1_Chapter.html#Fig2)). |

    | Workspace | This shows the present contents of the workspace and allows you
    to make changes to it (see the upper right part of Figure [1-2](#A978-1-4842-0322-4_1_Chapter.html#Fig2)).
    |

    | Help | This allows you to search and read the documentation for the complete
    family of MATLAB products. |

    | Start button | This runs tools and gives you access to documentation for all
    MathWorks products currently installed on your computer (Figure [1-3](#A978-1-4842-0322-4_1_Chapter.html#Fig3)).
    |


    Figure [1-1](#A978-1-4842-0322-4_1_Chapter.html#Fig1) shows the screen in which
    you enter MATLAB programs. This is MATLAB’s primary work environment.


    ![A978-1-4842-0322-4_1_Fig3_HTML.jpg](A978-1-4842-0322-4_1_Fig3_HTML.jpg)


    Figure 1-3.


    ![A978-1-4842-0322-4_1_Fig2_HTML.jpg](A978-1-4842-0322-4_1_Fig2_HTML.jpg)


    Figure 1-2.


    ![A978-1-4842-0322-4_1_Fig1_HTML.jpg](A978-1-4842-0322-4_1_Fig1_HTML.jpg)


    Figure 1-1.


    Any MATLAB commands are entered in the Command Window to the right of the user
    input prompt `>>` and the response will appear in the lines immediately below,
    after pressing Enter. After the command has been executed the user input prompt
    will reappear, allowing you to enter more commands (Figure [1-4](#A978-1-4842-0322-4_1_Chapter.html#Fig4)).


    ![A978-1-4842-0322-4_1_Fig4_HTML.jpg](A978-1-4842-0322-4_1_Fig4_HTML.jpg)


    Figure 1-4.


    If the result of a command is not assigned to a variable, MATLAB will return the
    response using the expression `ans =`, as shown at the beginning of Figure [1-4](#A978-1-4842-0322-4_1_Chapter.html#Fig4).
    If the result is assigned to a variable then we can use that variable as an argument
    in subsequent commands. This is the case for the variable `v` in Figure [1-4](#A978-1-4842-0322-4_1_Chapter.html#Fig4),
    which is subsequently used as input for an exponential.


    To execute a MATLAB command, simply press Enter once the command is written. If
    at the end of the input we put a semicolon, the program will execute the command
    and keep the result in memory (Workspace), but it will not display the result
    on screen (see the first input in Figure [1-13](#A978-1-4842-0322-4_1_Chapter.html#Fig13)).
    The input prompt `>>` will then reappear to indicate that you can enter a new
    command.


    Like the C programming language, MATLAB is case sensitive; for example, `Sin(x)`
    is not the same as `sin(x)`. The names of all built-in functions begin with a
    lowercase character. There should be no spaces in the names of commands, variables
    or functions. In other cases, spaces are ignored, and they can be used to make
    the input more readable. Multiple entries can be entered in the same command line
    by separating them with commas, pressing Enter at the end of the last entry (see
    Figure [1-4](#A978-1-4842-0322-4_1_Chapter.html#Fig4)). If you use a semicolon
    at the end of one of the entries in the line, its corresponding output will not
    be displayed.


    ![A978-1-4842-0322-4_1_Fig5_HTML.jpg](A978-1-4842-0322-4_1_Fig5_HTML.jpg)


    Figure 1-5.


    Descriptive comments can be entered in a command input line by starting them with
    the `%` symbol. When you run the input, MATLAB ignores the comment and processes
    the rest of the code (see Figure [1-6](#A978-1-4842-0322-4_1_Chapter.html#Fig6)).


    ![A978-1-4842-0322-4_1_Fig6_HTML.jpg](A978-1-4842-0322-4_1_Fig6_HTML.jpg)


    Figure 1-6.


    To simplify the process of entering script to be evaluated by the MATLAB interpreter
    (via the Command Window prompt), you can use the arrow keys. For example, if you
    press the up arrow key once, you will recover the last entry you submitted. If
    you press the up key twice, you will recover the penultimate entry you submitted,
    and so on.


    If you type a sequence of characters in the input area and then press the up arrow
    key, you will recover the last entry you submitted that begins with the specified
    string.


    Commands entered during a MATLAB session are temporarily stored in the buffer
    (Workspace) until you end the session, at which time they can be permanently stored
    in a file or are permanently lost.


    Below is a summary of the keys that can be used in MATLAB’s input area (command
    line), together with their functions:


    | Up arrow (Ctrl-P) | Retrieves the previous entry. |

    | Down arrow (Ctrl-N) | Retrieves the following entry. |

    | Left arrow (Ctrl-B) | Moves the cursor one character to the left. |

    | Right arrow (Ctrl-F) | Moves the cursor one character to the right. |

    | CTRL-left arrow | Moves the cursor one word to the left. |

    | CTRL-right arrow | Moves the cursor one word to the right. |

    | Home (Ctrl-A) | Moves the cursor to the beginning of the line. |

    | End (Ctrl-E) | Moves the cursor to the end of the current line. |

    | Escape | Clears the command line. |

    | Delete (Ctrl-D) | Deletes the character indicated by the cursor. |

    | Backspace | Deletes the character to the left of the cursor. |

    | CTRL-K | Deletes (kills) the current line. |


    The command `clc` clears the command window, but does not delete the contents
    of the work area (the contents remain in the memory).


    ## Help in MATLAB


    You can find help for MATLAB via the help button![A978-1-4842-0322-4_1_Figa_HTML.jpg](A978-1-4842-0322-4_1_Figa_HTML.jpg)
    in the toolbar or via the Help option in the menu bar. In addition, support can
    also be obtained via MATLAB commands. The command `help` provides general help
    on all MATLAB commands (see Figure [1-7](#A978-1-4842-0322-4_1_Chapter.html#Fig7)).
    By clicking on any of them, you can get more specific help. For example, if you
    click on `graph2d`, you get support for two-dimensional graphics (see Figure [1-8](#A978-1-4842-0322-4_1_Chapter.html#Fig8)).


    ![A978-1-4842-0322-4_1_Fig8_HTML.jpg](A978-1-4842-0322-4_1_Fig8_HTML.jpg)


    Figure 1-8.


    ![A978-1-4842-0322-4_1_Fig7_HTML.jpg](A978-1-4842-0322-4_1_Fig7_HTML.jpg)


    Figure 1-7.


    You can ask for help about a specific command `command` (Figure [1-9](#A978-1-4842-0322-4_1_Chapter.html#Fig9))
    or on any topic `topic` (Figure [1-10](#A978-1-4842-0322-4_1_Chapter.html#Fig10))
    by using the command `help command` or `help topic`.


    ![A978-1-4842-0322-4_1_Fig10_HTML.jpg](A978-1-4842-0322-4_1_Fig10_HTML.jpg)


    Figure 1-10.


    ![A978-1-4842-0322-4_1_Fig9_HTML.jpg](A978-1-4842-0322-4_1_Fig9_HTML.jpg)


    Figure 1-9.


    The command `lookfor string` allows you to find all those MATLAB functions or
    commands that refer to or contain the string `string`. This command is very useful
    when there is no direct support for the specified string, or to view the help
    for all commands related to the given string. For example, if we want to find
    help for all commands that contain the sequence `inv`, we can use the command
    `lookfor inv` (Figure [1-11](#A978-1-4842-0322-4_1_Chapter.html#Fig11)).


    ![A978-1-4842-0322-4_1_Fig11_HTML.jpg](A978-1-4842-0322-4_1_Fig11_HTML.jpg)


    Figure 1-11.'
