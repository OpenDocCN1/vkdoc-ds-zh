- fmt: '### Character Variables


    A character variable (chain) is simply a character string enclosed in single quotes
    that MATLAB treats as a vector form. The general syntax for character variables
    is as follows: `c = ''string''`.


    Among the MATLAB commands that handle character variables we have the following:


    | `abs (''character_string'')` | Returns the array of ASCII characters equivalent
    to each character in the string. |

    | --- | --- |

    | `setstr (numeric_vector)` | Returns the string of ASCII characters that are
    equivalent to the elements of the vector. |

    | `str2mat (t1,t2,t3,…)` | Returns the matrix whose rows are the strings `t1`,
    `t2`, `t3`,…, respectively |

    | `str2num (''string'')` | Converts the string to its exact numeric value used
    by MATLAB. |

    | `num2str (number)` | Returns the exact number in its equivalent string with
    fixed precision. |

    | `int2str (integer)` | Converts the integer to a string. |

    | `sprintf (''format'', a)` | Converts a numeric array into a string in the specified
    format. |

    | `sscanf (''string'', ''format'')` | Converts a string to a numeric value in
    the specified format. |

    | `dec2hex (integer)` | Converts a decimal integer into its equivalent string
    in hexadecimal. |

    | `hex2dec (''string_hex'')` | Converts a hexadecimal string into its integer
    equivalent. |

    | `hex2num (''string_hex'')` | Converts a hexadecimal string into the equivalent
    IEEE floating point number. |

    | `lower (''string'')` | Converts a string to lowercase. |

    | `upper (''string'')` | Converts a string to uppercase. |

    | `strcmp (s1, s2)` | Compares the strings `s1` and `s2` and returns 1 if they
    are equal and 0 otherwise. |

    | `strcmp (s1, s2, n)` | Compares the strings `s1` and `s2` and returns 1 if their
    first `n` characters are equal and 0 otherwise. |

    | `strrep (c, ''exp1'', ''exp2'')` | Replaces `exp1` by `exp2` in the chain `c`.
    |

    | `findstr (c, ''exp'')` | Finds where `exp` is in the chain `c`. |

    | `isstr (expression)` | Returns 1 if the expression is a string and 0 otherwise.
    |

    | `ischar (expression)` | Returns 1 if the expression is a string and 0 otherwise.
    |

    | `strjust (string)` | Right justifies the string. |

    | `blanks (n)` | Generates a string of `n` spaces. |

    | `deblank (string)` | Removes blank spaces from the right of the string. |

    | `eval (expression)` | Executes the expression, even if it is a string. |

    | `disp (''string'')` | Displays the string (or array) as has been written, and
    continues the MATLAB process. |

    | `input (''string'')` | Displays the string on the screen and waits for a key
    press to continue. |


    Here are some examples:


    ```

    >> hex2dec (''3ffe56e'')

    ans =

    67102062

    ```


    Here MATLAB has converted a hexadecimal string into a decimal number.


    ```

    >> dec2hex (1345679001)

    ans =

    50356E99

    ```


    The program has converted a decimal number into a hexadecimal string.


    ```

    >> sprintf(''%f'',[1+sqrt(5)/2,pi])

    ans =

    2.118034 3.141593

    ```


    The exact numerical components of a vector have been converted to strings (with
    default precision).


    ```

    >> sscanf(''121.00012'', ''%f'')

    ans =

    121.0001

    ```


    Here a numeric string has been passed to an exact numerical format (with default
    precision).


    ```

    >> num2str (pi)

    ans =

    3.142

    ```


    The constant π has been converted into a string.


    ```

    >> str2num(''15/14'')

    ans =

    1.0714

    ```


    The string has been converted into a numeric value with default precision.


    ```

    >> setstr(32:126)

    ans =

    !"#$%`&`'' () * +, -. / 0123456789:; < = >? @ABCDEFGHIJKLMNOPQRSTUVWXYZ [\] ^
    _''abcdefghijklmnopqrstuvwxyz {|}∼

    ```


    This yields the ASCII characters associated with the whole numbers between 32
    and 126, inclusive.


    ```

    >> abs(''{]}><#¡¿?oa'')

    ans =

    123 93 125 62 60 35 161 191 63 186 170

    ```


    This yields the integers corresponding to the ASCII characters specified in the
    argument of `abs`.


    ```

    >> lower (''ABCDefgHIJ'')

    ans =

    abcdefghij

    ```


    The text has been converted to lowercase.


    ```

    >> upper(''abcd eFGHi jKlMn'')

    ans =

    ABCD EFGHI JKLMN

    ```


    The text has been converted to uppercase.


    ```

    >> str2mat (''The world'','' The country'','' Daily 16'', '' ABC'')

    ans =

    The world

    The country

    Daily 16

    ABC

    ```


    The chains comprising the arguments of `str2mat` have been converted to a text
    array.


    ```

    >> disp(''This text will appear on the screen'')

    ans =

    This text will appear on the screen

    ```


    Here the argument of the command `disp` has been displayed on the screen.


    ```

    >> c = ''This is a good example'';

    >> strrep(c, ''good'', ''bad'')

    ans =

    This is a bad example

    ```


    The string `good` has been replaced by `bad` in the chain `c`. The following instruction
    locates the initial position of each occurrence of `is` within the chain `c`.


    ```

    >> findstr (c, ''is'')

    ans =

    3 6

    ```'
  raw: '### Character Variables


    A character variable (chain) is simply a character string enclosed in single quotes
    that MATLAB treats as a vector form. The general syntax for character variables
    is as follows:


    `c = ''string''`


    Among the MATLAB commands that handle character variables we have the following:


    | abs (''character_string'') | Returns the array of ASCII characters equivalent
    to each character in the string. |

    | setstr (numeric_vector) | Returns the string of ASCII characters that are equivalent
    to the elements of the vector. |

    | str2mat (t1,t2,t3,…) | Returns the matrix whose rows are the strings t1, t2,
    t3,…, respectively |

    | str2num (''string'') | Converts the string to its exact numeric value used by
    MATLAB. |

    | num2str (number) | Returns the exact number in its equivalent string with fixed
    precision. |

    | int2str (integer) | Converts the integer to a string. |

    | sprintf (''format'', a) | Converts a numeric array into a string in the specified
    format. |

    | sscanf (''string'', ''format'') | Converts a string to a numeric value in the
    specified format. |

