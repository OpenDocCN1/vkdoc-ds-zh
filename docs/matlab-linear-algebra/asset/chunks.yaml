- fmt: "# Solving Linear Systems of Equations\n\nIn the previous sections we have\
    \ studied equations and systems in general. We will now focus on linear systems\
    \ of equations. To solve such systems we could simply use the commands we have\
    \ seen so far, however MATLAB has a selection of special commands designed especially\
    \ for linear systems. The following table lists these commands.\n\n| `X = linsolve\
    \ (A, B)` | Solves the linear system `A * X = B`. We solve the system: ![A978-1-4842-0322-4_4_Fig21_HTML.jpg](A978-1-4842-0322-4_4_Fig21_HTML.jpg)\
    \ `>> A = [2,1,1,1;1,2,1,1;1,1,2,1;1,1,1,2];B = [1,2,3,4]';` `linsolve (A, B)`\
    \ `ans =` `-1` `0` `1` `2` |\n| `[X, R] = linsolve (A, B)` | Solves the linear\
    \ system `A * X = B` and additionally returns the reciprocal of the condition\
    \ number of `A` if `A` is square, or the rank of `A` if `A` is not square. `>>\
    \ A = [2,1,1,1;1,2,1,1;1,1,2,1;1,1,1,2];B = [1,2,3,4]';` `[X, R] = linsolve (A,\
    \ B)` `X =` `-1` `0` `1` `2` `R =` `0.1429` |\n| `X = linsolve (A, B, options)`\
    \ | Solve the linear system `A * X = B` using various options for the matrix `A`\
    \ (`UT` for upper triangular, `LT` for lower triangular, `SYM` for symmetric real\
    \ or complex hermitian, `RECT` for general rectangular, `POSDEF` for positive\
    \ definite, `UHESS` for upper Hessenberg and `TRANSA` for conjugate transpose).\
    \ |\n| `rank (A)` | Rank of the matrix `A`. `>> rank (A)` `ans =` `4` |\n| `det\
    \ (A)` | Determinant of the square matrix `A`. `>> det (A)` `ans =` `5` |\n| `Z\
    \ = null (A, 'r')` | Rational basis for the null space of `A`. |\n\nSystems of\
    \ linear equations can be converted to array form and solved using calculations\
    \ with matrices. A system can be written in the form `M.X = B`, where `X` is the\
    \ vector of variables, `B` the vector of independent terms and `M` the matrix\
    \ of coefficients of the system. If `M` is a square matrix and the determinant\
    \ of the matrix `M` is non-null, `M` is invertible, and the unique solution of\
    \ the system can be written in the form: `X = M^(-1)B`. In this case, the commands\
    \ `solve`, `linsolve`, `lscov`, `bicg`, `pcg`, `lsqr`, `gmr`, `gmres`, `minres`,\
    \ `symmlq` or `M\\B`, already described above, offer the solution.\n\nIf the determinant\
    \ of `M` is zero, the system has infinitely many solutions, since there are rows\
    \ or columns in `M` that are linearly dependent. In this case, the number of redundant\
    \ equations can be calculated to find out how many variables are needed to describe\
    \ the solutions. If the matrix `M` is rectangular (not square), the system may\
    \ be undetermined (the number of equations is less than the number of variables),\
    \ overdetermined (the number of equations is greater than the number of variables)\
    \ or non-singular (the number of equations is equal to number of variables and\
    \ `M` has non-zero determinant). An indeterminate system can have infinitely many\
    \ solutions, or none, and likewise for an overdetermined system. If a system has\
    \ no solution, it is called inconsistent (incompatible), and if there is at least\
    \ one solution, it is called consistent (compatible). The system `M . X = B` is\
    \ called homogeneous when the vector `B` is the null vector, i.e. the system is\
    \ of the form `M . X= 0`. If the determinant of `M` is non-null, the unique solution\
    \ of the system is the null vector (obtained with the command `linsolve`). If\
    \ the determinant of `M` is zero, the system has infinitely many solutions. The\
    \ solutions can be found using the commands `solve`, `linsolve`, `lsqr` or other\
    \ commands described above for general linear systems.\n\nA fundamental tool in\
    \ the analysis and solution of systems of equations is the Rouche-Frobenius theorem.\
    \ This theorem says that a system of `m` equations with `n` unknowns has a solution\
    \ if, and only if, the rank of the matrix of coefficients coincides with the rank\
    \ of the array extended with the vector column of the system-independent terms.\
    \ If the two ranks are equal, and equal to the number of unknowns, the system\
    \ has a unique solution. If the two ranks are the same, but less that the number\
    \ of unknowns, the system has infinitely many solutions. If they are different,\
    \ the system has no solution.\n\nIn summary: Let `A` be the matrix of coefficients\
    \ of the system and `B` the matrix `A` augmented by the column vector of independent\
    \ terms.\n\nIf `rank(A) = rank(B)` , the system is incompatible (without solution).\n\
    \nIf `rank (A) = rank(B) < n` , the system is indefinite (has infinitely many\
    \ solutions).\n\nIf `= rank(A) = rank(B) = n` , the system has a unique solution.\n\
    \nThis theorem allows us to analyze the solutions of a system of equations before\
    \ solving it.\n\nWe have already encountered homogeneous systems. A system `A.\
    \ X = B` is said homogeneous if the vector of independent terms `B` is null, so\
    \ every homogeneous system is of the form `A. X = 0`. In a homogeneous system,\
    \ the rank of the matrix of coefficients and the rank of the matrix augmented\
    \ to include the column vector of independent terms always coincide. If we apply\
    \ the Rouche-Frobenius theorem, a homogeneous system will have a unique solution\
    \ when the determinant of the matrix `A` is non-zero. Since the null vector is\
    \ always a solution of a homogeneous system, this must be the unique solution.\
    \ A homogeneous system will have infinitely many solutions when the determinant\
    \ of the matrix `A` is zero. In this case, the solutions are calculated as for\
    \ general systems (using the command `solve`), or by using the function `null\
    \ (A)`.\n\nAs a first example we solve the system:\n\n![A978-1-4842-0322-4_4_Fig22_HTML.jpg](A978-1-4842-0322-4_4_Fig22_HTML.jpg)\n\
    \nWe will find the rank of the matrix of the system and the rank of the augmented\
    \ matrix obtained by extending the matrix by the column vector of independent\
    \ terms.\n\n```\n>> A = [2,1,1,1;1,2,1,1;1,1,2,1;1,1,1,2];\n>> B = [2,1,1,1,1;1,2,1,1,1;1,1,2,1,1;1,1,1,2,1];\n\
    >> [rank (A), rank (B)]\nans =\n4 4\n```\n\nWe note that the ranks of the two\
    \ matrices coincide with the number of unknowns. The Rouche-Frobenius theorem\
    \ then tells us that the system is compatible with a unique solution. We can calculate\
    \ the solution in the following way:\n\n```\n>> B = [1 1 1 1]';\n>> linsolve (A,\
    \ B)\nans =\n0.2000\n0.2000\n0.2000\n0.2000\n```\n\nThe solution could also have\
    \ been found using the following commands:\n\n```\n>> lscov (A, B)\nans =\n0.2000\n\
    0.2000\n0.2000\n0.2000\n\n>> bicg (A, B)\nbicg converged at iteration 1 to a solution\
    \ with relative residual 0\nans =\n0.2000\n0.2000\n0.2000\n0.2000\n\n>> pcg (A,\
    \ B)\nPCG converged at iteration 1 to a solution with relative residual 0\nans\
    \ =\n0.2000\n0.2000\n0.2000\n0.2000\n\n>> lsqr (A, B)\nlsqr converged at iteration\
    \ 1 to a solution with relative residual 0\nans =\n0.2000\n0.2000\n0.2000\n0.2000\n\
    \n>> qmr (A, B)\nQMR converged at iteration 1 to a solution with relative residual\
    \ 0\nans =\n0.2000\n0.2000\n0.2000\n0.2000\n\n>> gmres (A, B)\ngmres converged\
    \ at iteration 1 to a solution with relative residual 1.5e-016\nans =\n0.2000\n\
    0.2000\n0.2000\n0.2000\n\n>> symmlq (A, B)\nsymmlq converged at iteration 1 to\
    \ a solution with relative residual 0\nans =\n0.2000\n0.2000\n0.2000\n0.2000\n\
    ```\n\nAs a second example, we solve the system:\n\n![A978-1-4842-0322-4_4_Fig23_HTML.jpg](A978-1-4842-0322-4_4_Fig23_HTML.jpg)\n\
    \nWe find the rank of the matrix of the system and the rank of the augmented matrix.\n\
    \n```\n>> A=[1,2,3;1,3,8;2,3,1;5,6,4];\n>> B=[1,2,3,6;1,3,8,19;2,3,1,-1;5,6,4,5];\n\
    >> [rank(A), rank(B)]\nans =\n3     3\n```\n\nWe note that the ranks of the two\
    \ matrices coincide with the number of unknowns. The Rouche-Frobenius theorem\
    \ then tells us that the system is compatible with a unique solution. We can calculate\
    \ the solution in the following way:\n\n```\n>> A = [1,2,3;1,3,8;2,3,1;5,6,4];\n\
    >> B = [19-6 - 5-1]';\n>> linsolve (A, B)\nans =\n1.0000\n-2.0000\n3.0000\n```\n\
    \nAs a third example, we solve the system:\n\n![A978-1-4842-0322-4_4_Fig24_HTML.jpg](A978-1-4842-0322-4_4_Fig24_HTML.jpg)\n\
    \nAs we have a homogeneous system, we will calculate the determinant of the matrix\
    \ of coefficients of the system.\n\n```\n>> A = [1,2, - 1; 2, - 1, 1; 3,1,0];\n\
    >> det (A)\nans =\n5. 5511e-016\n```\n\nThis answer is very close to zero, in\
    \ fact the determinant is actually zero, thus the homogeneous system will have\
    \ infinitely many solutions, which are calculated with the command `solve` as\
    \ shown below.\n\n```\n>> [x, y, z] = solve('x+2*y-z, 2*x-y+z, 3*x+y', 'x,y,z')\n\
    x =\n-z1/5\ny =\n(3 * z1) / 5\nz =\nz1\n```\n\nThus the infinite set of solutions\
    \ depend on a parameter `z1` and are described as ![A978-1-4842-0322-4_4_Fig25_HTML.jpg](A978-1-4842-0322-4_4_Fig25_HTML.jpg)\n\
    \n## EXERCISE 4-1\n\nExpand the following algebraic expressions:\n\n![A978-1-4842-0322-4_4_Fig26_HTML.jpg](A978-1-4842-0322-4_4_Fig26_HTML.jpg)\n\
    \n```\n>> syms x y z b t\n>> pretty (expand ((x + 1) * (2.4.x+2)))\n2\nx + 3 x\
