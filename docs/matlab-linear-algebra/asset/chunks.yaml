    # 关系运算符


    MATLAB 还提供了关系运算符。关系运算符在两个矩阵之间执行逐元素比较，并返回一个相同大小的数组，如果对应关系为真，则该数组的元素为 1，如果对应关系为假，则为
    0。关系运算符也可以将标量与向量或矩阵进行比较，在这种情况下，标量将与数组的所有元素进行比较。以下是这些运算符的表格。


    | `<` | 小于（对于复数，仅适用于实部） |

    | `<=` | 小于或等于（仅适用于复数的实部） |

    | `>` | 大于（仅适用于复数的实部） |

    | `>=` | 大于或等于（仅适用于复数的实部） |

    | `x == y` | 等于（也适用于复数） |

    | `x ∼ = y` | 不等于（也适用于复数） |


    # 逻辑运算符


    MATLAB 提供了表示逻辑运算符的符号。下表中显示的逻辑运算符提供了一种组合或否定关系表达式的方法。


    | `∼ A` | 逻辑非（NOT）或 `A` 的补集。 |

    | `A & B` | 逻辑与（AND）或 `A` 和 `B` 的交集。 |

    | `A \| B` | 逻辑或（OR）或 `A` 和 `B` 的并集。 |

    | `XOR (A, B)` | 异或（XOR）或 `A` 和 `B` 的对称差（如果 `A` 或 `B`（但不同时为 1）为 1，则取值为 1）。 |


    以下是一些示例：


    ```

    >> A = 2:7;P =(A>3) & (A<6)

    ```


    ```

    P =


    0     0     1     1     0     0

    ```


    当 `A` 的对应元素大于 3 且小于 6 时返回 1，否则返回 0。


    ```

    >> X = 3 * ones (3.3); X >= [7 8 9; 4 5 6 ; 1 2 3]

    ```


    ```

    ans =


    0 0 0

    0 0 0

    1 1 1

    ```


    解数组中对应于 `X` 中那些大于或等于矩阵 `[7 8 9; 4 5 6; 1 2 3]` 对应元素的元素被赋值为 1。其余元素被赋值为 0。

