    以下是一些说明性示例。


    ```

    >> x=linspace(0,2,30);

    y=sin(x.²);

    plot(x,y)

    text(1,0.8, ''y=sin(x²)'')

    hold on

    z=log(sqrt(x));

    plot(x,z)

    text(1,-0.1, ''y=log(sqrt(x))'')

    xlabel(''x 轴'');

    ylabel(''y 轴'');

    title(''正弦和对数图形'');

