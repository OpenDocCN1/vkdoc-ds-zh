    `-2.2500`


    `>> det([1,-1;-1,1])`


    `ans =`


    `0`


    It turns out that the quadratic form is negative semi-definite.


    We can also obtain the classification via the eigenvalues of the matrix of the
    quadratic form.


    A quadratic form is defined to be positive if and only if all its eigenvalues
    are strictly positive. A quadratic form is defined to be negative if and only
    if all its eigenvalues are strictly negative.


    A quadratic form is positive semi-definite if and only if all its eigenvalues
    are non-negative. A quadratic form is negative semi-definite if and only if all
    its eigenvalues are non-positive.


    A quadratic form is indefinite if there are both positive and negative eigenvalues.


