- fmt: '# Complex Numbers


    Operations on complex numbers are well implemented in MATLAB. MATLAB follows the
    convention that `i` or `j` represents the key value in complex analysis, the imaginary
    number `√-1`. All the usual arithmetic operators can be applied to complex numbers,
    and there are also some specific functions which have complex arguments. Both
    the real and the imaginary part of a complex number can be a real number or a
    symbolic constant, and operations with them are always performed in exact mode,
    unless otherwise instructed or necessary, in which case an approximation of the
    result is returned. As the imaginary unit is represented by the symbol `i` or
    `j`, the complex numbers are expressed in the form `a+bi` or `a+bj`. Note that
    you don''t need to use the product symbol (asterisk) before the imaginary unit:


    ```

    >> (1-5i)*(1-i)/(-1+2i)

    ans =

    -1.6000 + 2.8000i

    >> format rat

    >> (1-5i) *(1-i) /(-1+2i)

    ans =

    -8/5 + 14/5i

    ```


    # Functions with Complex Arguments


    Working with complex variables is very important in mathematical analysis and
    its many applications in engineering. MATLAB implements not only the usual arithmetic
    operations with complex numbers, but also various complex functions. The most
    important functions are listed below.


    **Trigonometric functions**


    | Function | Inverse |

    | --- | --- |

    | `sin(z)` | `asin(z)` |

    | `cos(z)` | `acos(z)` |

    | `tan(z)` | `atan(z)` and `atan2(imag(z),real(z))` |

    | `csc(z)` | `acsc(z)` |

    | `sec(z)` | `asec(z)` |

    | `cot(z)` | `acot(z)` |


    **Hyperbolic functions**


    | Function | Inverse |

    | --- | --- |

    | `sinh(z)` | `asinh(z)` |

    | `cosh(z)` | `acosh(z)` |

    | `tanh(z)` | `atanh(z)` |

    | `csch(z)` | `acsch(z)` |

    | `sech(z)` | `asech(z)` |

    | `coth(z)` | `acoth(z)` |


    **Exponential and logarithmic functions**


    | Function | Meaning |

    | --- | --- |

    | `exp(z)` | Exponential function in base `e` (`e^z`) |

    | `log(z)` | Base `e` logarithm of `z` |

    | `log10(z)` | Base 10 logarithm of `z` |

    | `log2(z)` | Base 2 logarithm of `z` |

    | `pow2(z)` | 2 to the power `z` |

    | `sqrt(z)` | The square root of `z` |


    **Specific functions for the real and imaginary part**


    | Function | Meaning |

    | --- | --- |

    | `floor(z)` | Applies the floor function to `real(z)` and `imag(z)` |

    | `ceil(z)` | Applies the ceil function to `real(z)` and `imag(z)` |

    | `round(z)` | Applies the round function to `real(z)` and `imag(z)` |

    | `fix(z)` | Applies the fix function to `real(z)` and `imag(z)` |


    **Specific functions for complex numbers**


    | Function | Meaning |

    | --- | --- |

    | `abs(z)` | The complex modulus of `z` |

    | `angle(z)` | The argument of `z` |

    | `conj(z)` | The complex conjugate of `z` |

    | `real(z)` | The real part of `z` |

    | `imag(z)` | The imaginary part of `z` |


    Below are some examples of operations with complex numbers.


    ```

    >> round(1.5-3.4i)

    ans =

    2 - 3i

    >> real(i^i)

    ans =

    0.2079

    >> (2+2i)^2/(-3-3*sqrt(3)*i)^90

    ans =

    0.502e-085 - 1 + 7.4042e-070i

    >> sin(1 + i)

    ans =

    1.2985 + 0.6350i

    ```


    # Elementary Functions that Support Complex Vector Arguments


    MATLAB easily handles vector and matrix calculus. Indeed, its name, MAtrix LABoratory,
    already gives an idea of its power in working with vectors and matrices. MATLAB
    allows you to work with functions of a complex variable, but in addition this
    variable can even be a vector or a matrix. Below is a table of functions with
    complex vector arguments.


    | `max(V)` | The maximum component of `V`. (max is calculated for complex vectors
    as the complex number with the largest complex modulus (magnitude), computed with
    `max(abs(V))`. Then it computes the largest phase angle with `max(angle(x))`,
    if necessary.) |

    | `min(V)` | The minimum component of `V`. (min is calculated for complex vectors
    as the complex number with the smallest complex modulus (magnitude), computed
    with `min(abs(A))`. Then it computes the smallest phase angle with `min(angle(x))`,
    if necessary.) |

    | `mean(V)` | Average of the components of `V`. |

    | `median(V)` | Median of the components of `V`. |

    | `std(V)` | Standard deviation of the components of `V`. |

    | `sort(V)` | Sorts the components of `V` in ascending order. For complex entries
    the order is by absolute value and argument. |

    | `sum(V)` | Returns the sum of the components of `V`. |

    | `prod(V)` | Returns the product of the components of `V`, so, for example, `n!
    = prod(1:n)`. |

    | `cumsum(V)` | Gives the cumulative sums of the components of `V`. |

    | `cumprod(V)` | Gives the cumulative products of the components of `V`. |

    | `diff(V)` | Gives the vector of first differences of `V` (`V[t] - V[t-1]`).
    |

    | `gradient(V)` | Gives the gradient of `V`. |

    | `del2(V)` | Gives the Laplacian of `V` (5-point discrete). |

    | `fft(V)` | Gives the discrete Fourier transform of `V`. |

    | `fft2(V)` | Gives the two-dimensional discrete Fourier transform of `V`. |

    | `ifft(V)` | Gives the inverse discrete Fourier transform of `V`. |

    | `ifft2(V)` | Gives the inverse two-dimensional discrete Fourier transform of
    `V`. |


    These functions also support a complex matrix as an argument, in which case the
    result is a vector of column vectors whose components are the results of applying
    the function to each column of the matrix.


    Here are some examples:


    ```

    >> V = 2:7, W = [5 + 3i 2-i 4i]

    V =

    2     3     4     5     6     7

    W =

    2.0000 - 1.0000i   0 + 4.0000i   5.0000 + 3.0000i

    >> diff(V),diff(W)

    ans =

    1     1     1     1     1

    ans =

    -2.0000 + 5.0000i   5.0000 - 1.0000i

    >> cumprod(V),cumsum(V)

    ans =

    2           6          24         120         720        5040

    ans =

    2     5     9    14    20    27

    >> cumsum(W), mean(W), std(W), sort(W), sum(W)

    ans =

    2.0000 - 1.0000i   2.0000 + 3.0000i   7.0000 + 6.0000i

    ans =

    2.3333 + 2.0000i

    ans =

    3.6515

    ans =

    2.0000 - 1.0000i   0 + 4.0000i   5.0000 + 3.0000i

    ans =

    7.0000 + 6.0000i

    >> mean(V), std(V), sort(V), sum(V)

    ans =

    4.5000

    ans =

    1.8708

    ans =

    2     3     4     5     6     7

    ans =

    27

    >> fft(W), ifft(W), fft2(W)

    ans =

    7.0000 + 6.0000i   0.3660 - 0.1699i  -1.3660 - 8.8301i

    ans =

    2.3333 + 2.0000i  -0.4553 - 2.9434i   0.1220 - 0.0566i

    ans =

    7.0000 + 6.0000i   0.3660 - 0.1699i  -1.3660 - 8.8301i

    ```'
