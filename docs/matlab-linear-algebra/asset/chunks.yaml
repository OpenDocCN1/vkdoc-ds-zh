- fmt: '### Alternative Bases


    MATLAB allows you to work with numbers to any base, as long as the extended symbolic
    math Toolbox is available. It also allows you to express all kinds of numbers
    in different bases. This is implemented via the following functions:


    | `dec2base` (decimal, n_base) | Converts the specified decimal number to the
    new base n_base. |

    | `base2dec`(number,b) | Converts the given number in base b to a decimal number.
    |

    | `dec2bin` (decimal) | Converts the specified decimal number to base 2 (binary).
    |

    | `dec2hex` (decimal) | Converts the specified decimal number to base 16 (hexadecimal).
    |

    | `bin2dec` (binary) | Converts the specified binary number to decimal. |

    | `hex2dec` (hexadecimal) | Converts the specified base 16 number to decimal.
    |


    Below are some examples.


    Represent in base 10 the base 2 number 100101.


    ```

    >> base2dec (''100101'',2)

    ans =

    37.00

    ```


    Represent in base 10 the hexadecimal number FFFFAA00.


    ```

    >> base2dec (''FFFFAA0'', 16)

    ans =

    268434080.00

    ```


    Represent the result of the base 16 operation FFFAA2+FF-1 in base 10.


    ```

    >> base2dec (''FFFAA2'',16) + base2dec(''FF'',16)-1

    ans =

    16776096.00

    ```


    ### Real Numbers


    As is well known, the set of real numbers is the disjoint union of the set of
    rational numbers and the set of irrational numbers. A rational number is a number
    of the form p/q, where p and q are integers. In other words, the rational numbers
    are those numbers that can be represented as a quotient of two integers. The way
    in which MATLAB treats rational numbers differs from the majority of calculators.
    If we ask a calculator to calculate the sum 1/2 + 1/3 + 1/4, most will return
    something like 1.0833, which is no more than an approximation of the result.


    The rational numbers are ratios of integers, and MATLAB can work with them in
    exact mode, so the result of an arithmetic expression involving rational numbers
    is always given precisely as a ratio of two integers. To enable this, activate
    the rational format with the command `format rat`. If the reader so wishes, MATLAB
    can also return the results in decimal form by activating any other type of format
    instead (e.g. `format short` or `format long`). MATLAB evaluates the above mentioned
    sum in exact mode as follows:


    ```

    >> format rat

    >> 1/2 + 1/3 + 1/4

    ans =

    13/12

    ```


    Unlike calculators, MATLAB ensures its operations with rational numbers are accurate
    by maintaining the rational numbers in the form of ratios of integers. In this
    way, calculations with fractions are not affected by rounding errors, which can
    become very serious, as evidenced by the theory of errors. Note that, once the
    rational format is enabled, when MATLAB adds two rational numbers the result is
    returned in symbolic form as a ratio of integers, and operations with rational
    numbers will continue to be exact until an alternative format is invoked.


    A floating point number, or a number with a decimal point, is interpreted as exact
    if the rational format is enabled. Thus a floating point expression will be interpreted
    as an exact rational expression while any irrational numbers in a rational expression
    will be represented by an appropriate rational approximation.


    ```

    >> format rat

    >> 10/23 + 2.45/44

    ans =

    1183 / 2412

    ```


    The other fundamental subset of the real numbers is the set of irrational numbers,
    which have always created difficulties in numerical calculation due to their special
    nature. The impossibility of representing an irrational number accurately in numeric
    mode (using the ten digits from the decimal numbering system) is the cause of
    most of the problems. MATLAB represents the results with an accuracy which can
    be set as required by the user. An irrational number, by definition, cannot be
    represented exactly as the ratio of two integers. If ordered to calculate the
    square root of 17, by default MATLAB returns the number 5.1962.


    ```

    >> sqrt (27)

    ans =

    5.1962

    ```


    MATLAB incorporates the following common irrational constants and notions:


    | `pi` | The number π = 3.1415926… |

    | `exp (1)` | The number e = 2.7182818… |

    | `Inf` | Infinity (returned, for example, when it encounters 1/0). |

    | `NaN` | Uncertainty (returned, for example, when it encounters 0/0). |

    | `realmin` | Returns the smallest possible normalized floating-point number in
    IEEE double precision. |

    | `realmax` | Returns the largest possible finite floating-point number in IEEE
    double precision. |


    The following examples illustrate how MATLAB outputs these numbers and notions.


    ```

    >> long format

    >> pi

    ans =

    3.14159265358979


    >> exp (1)

    ans =

    2.71828182845905


    >> 1/0

    Warning: Divide by zero.

    ans =

    Inf


    >> 0/0

    Warning: Divide by zero.

    ans =

    NaN


    >> realmin

    ans =

    2.225073858507201e-308


    >> realmax

    ans =

    1.797693134862316e + 308

    ```


    ### Functions with Real Arguments


    The disjoint union of the set of rational numbers and the set of irrational numbers
    is the set of real numbers. In turn, the set of rational numbers has the set of
    integers as a subset. All functions applicable to real numbers are also valid
    for integers and rational numbers. MATLAB provides a full range of predefined
    functions, most of which are discussed in the subsequent chapters of this book.
    Within the group of functions with real arguments offered by MATLAB, the following
    are the most important:


    **Trigonometric functions**


    | Function | Inverse |

    | --- | --- |

    | `sin (x)` | `asin (x)` |

    | `cos (x)` | `acos (x)` |

    | `tan(x)` | `atan(x)` and `atan2(y,x)` |

    | `csc (x)` | `acsc (x)` |

    | `sec (x)` | `asec (x)` |

    | `cot (x)` | `acot (x)` |


    **Hyperbolic functions**


    | Function | Inverse |

    | --- | --- |

    | `sinh (x)` | `asinh (x)` |

    | `cosh(x)` | `acosh(x)` |

    | `tanh(x)` | `atanh(x)` |

    | `csch(x)` | `acsch(x)` |

    | `sech(x)` | `asech(x)` |

    | `coth (x)` | `acoth (x)` |


    **Exponential and logarithmic functions**


    | Function | Meaning |

    | --- | --- |

    | `exp (x)` | Exponential function in base e (`e ^ x`). |

    | `log (x)` | Base e logarithm of x. |

    | `log10 (x)` | Base 10 logarithm of x. |

    | `log2 (x)` | Base 2 logarithm of x. |

    | `pow2 (x)` | 2 raised to the power x. |

    | `sqrt (x)` | The square root of x. |


    **Numeric variable-specific functions**


    | Function | Meaning |

    | --- | --- |

    | `abs (x)` | The absolute value of x. |

    | `floor (x)` | The largest integer less than or equal to x. |

    | `ceil (x)` | The smaller integer greater than or equal to x. |

    | `round (x)` | The closest integer to x. |

    | `fix (x)` | Removes the fractional part of x. |

    | `rem (a, b)` | Returns the remainder of the division of a by b. |

    | `sign (x)` | Returns the sign of x (1 if x > 0, 0 if x=0, -1 if x < 0). |


    Here are some examples:


    ```

    >> sin(pi/2)

    ans =

    1


    >> asin (1)

    ans =

    1.57079632679490


    >> log (exp (1) ^ 3)

    ans =

    3.00000000000000

    ```


    The function `round` is demonstrated in the following two examples:


    ```

    >> round (2.574)

    ans =

    3


    >> round (2.4)

    ans =

    2

    ```


    The function `ceil` is demonstrated in the following two examples:


    ```

    >> ceil (4.2)

    ans =

    5


    >> ceil (4.8)

    ans =

    5

    ```


    The function `floor` is demonstrated in the following two examples:


    ```

    >> floor (4.2)

    ans =

    4


    >> floor (4.8)

    ans =

    4

    ```


    The `fix` function simply removes the fractional part of a real number:


    ```

    >> fix (5.789)

    ans =

    5

    ```'
