    5 16 2187

    ```


    上述运算均有效，因为在所有情况下变量操作数的维度都相同，因此运算可以成功逐元素执行。对于加法和减法，向量和矩阵没有区别，因为这两种情况下的运算相同。


    矩阵变量最重要的运算符具体说明如下：


    | `A + B`, `A - B`, `A * B` | 矩阵的加法、减法和乘法。 |

    | `A\B` | 如果 `A` 是方阵，则 `A\B = inv (A) * B`。如果 `A` 不是方阵，则 `A\B` 是系统 `AX = B` 在最小二乘意义上的解。
    |

    | `B/A` | 等同于 `(A '' \ B'')''`。 |

    | `A^n` | 等同于 `A * A * A *… *A n` 次（`n` 为整数）。 |

    | `p^A` | 仅当 `p` 是标量时才执行幂运算。 |


    以下是一些示例：


    ```

    >> X = [5,4,3]; Y = [1,2,7]; l = X''* Y, m = X * Y '', n = 2 * X, o = X / Y, p
