  raw: '# 4. Algebraic Expressions, Polynomials, Equations and Systems


    ## Expanding, Simplifying and Factoring Algebraic Expressions


    MATLAB incorporates a wide range of commands, including simplification, expansion
    and factorization, that allow you to work with algebraic expressions. The following
    table shows the most common commands used when working with algebraic expressions.


    | expand (expr) | Expands an algebraic expression, presenting the result as a
    sum of products and powers, applying multiple angle rules for trigonometric expressions
    and the formal properties of exponential and logarithmic functions. It also decomposes
    quotients of polynomials into sums of simpler polynomial quotients. `>> syms x
    y z t a b` `>> pretty(expand((x+2)*(x+3)))` `2` `x  + 5 x + 6` `>> pretty(expand((x+2)/(x+3)))`
    `x       2` `----- + -----` `x + 3   x + 3` `>> pretty(expand(cos(x+y)))` `cos(x)
    cos(y) - sin(x) sin(y)` |

    | factor (expr) | The reverse operation of expand. Writes an algebraic expression
    as a product of factors. `>> syms x y` `>> pretty(factor(6*x^2+18*x-24))` `6 (x
    + 4) (x - 1)` `>> pretty (factor ((x^3-y^3)/(x^4-y^4)))` `2         2` `x + x
    y + y` `-----------------` `2   2` `(x + y) (x + y )` `>> pretty(factor(x^3+y^3))`
    `2         2` (x + y) (x - x y + y ) |

    | simplify (expr) | Simplifies an algebraic expression as much as possible. `>>
    syms x y b c` `>> simplify (sin (x) ^ 2 + cos (x) ^ 2) * 2` `ans =` `2` `>> simplify
    (log (exp (a+log (exp (c)))))` `ans =` `log (exp(a + c))` |

    | simple (expr) | Searches for the simplest form of an algebraic expression. `>>
    syms a positive;` `f = (1/a^3 + 6/a^2 + 12/a + 8)^(1/3);` `>> simplify(f)` `ans
    =` `(8*a^3 + 12*a^2 + 6*a + 1)^(1/3)/a` `>> simple(f)` `simplify:` `(2*a + 1)/a`
    `radsimp:` `(12/a + 6/a^2 + 1/a^3 + 8)^(1/3)` `simplify(100):` `1/a + 2` `combine(sincos):`
    `(12/a + 6/a^2 + 1/a^3 + 8)^(1/3)` `combine(sinhcosh):` `(12/a + 6/a^2 + 1/a^3
    + 8)^(1/3)` `combine(ln):` `(12/a + 6/a^2 + 1/a^3 + 8)^(1/3)` `factor:` `(12/a
    + 6/a^2 + 1/a^3 + 8)^(1/3)` `expand:` `(12/a + 6/a^2 + 1/a^3 + 8)^(1/3)` `combine:`
    `(12/a + 6/a^2 + 1/a^3 + 8)^(1/3)` `rewrite(exp):` `(12/a + 6/a^2 + 1/a^3 + 8)^(1/3)`
    `rewrite(sincos):` `(12/a + 6/a^2 + 1/a^3 + 8)^(1/3)` `rewrite(sinhcosh):` `(12/a
    + 6/a^2 + 1/a^3 + 8)^(1/3)` `rewrite(tan):` `(12/a + 6/a ^ 2 + 1/a ^ 3 + 8) ^(1/3)`
    `mwcos2sin:` `(12/a + 6/a ^ 2 + 1/a ^ 3 + 8) ^(1/3)` `collect(a):` `(12/a + 6/a^2
    + 1/a^3 + 8)^(1/3)` `ans =` `1/a + 2` `>> g=simple(f)` `g =` `1/a + 2` |

    | collect (expr) | Groups terms of the expression together into powers of its
    variables. `>> syms x;` `f = x*(x*(x - 6) + 11) - 6;` `>> collect(f)` `ans =`
    `x^3 - 6*x^2 + 11*x – 6` `>> f = (1+x)*t + x*t;` `>> collect(f)` `ans =` `(2*t)*x
