  trans: '

    # 复数


    MATLAB 完美地实现了复数的运算。MATLAB 遵循惯例，使用 `i` 或 `j` 来表示复分析中的关键值，即虚数 `√-1`。所有常用的算术运算符都可以应用于复数，并且还有一些特定的函数可以处理复数参数。复数的实部和虚部可以是实数或符号常量，除非另有指示或必要，否则运算始终以精确模式执行，必要时会返回近似结果。由于虚数单位用符号
    `i` 或 `j` 表示，因此复数以 `a+bi` 或 `a+bj` 的形式表示。请注意，在虚数单位前不需要使用乘号（星号）：


    ```

    >> (1-5i)*(1-i)/(-1+2i)

    ans =

    -1.6000 + 2.8000i

    >> format rat

    >> (1-5i) *(1-i) /(-1+2i)

    ans =

    -8/5 + 14/5i

    ```


    # 带复数参数的函数


    处理复变量在数学分析及其在工程中的许多应用中非常重要。MATLAB 不仅实现了复数的常用算术运算，还实现了各种复数函数。以下列出了最重要的函数。


    **三角函数**


    | 函数 | 反函数 |

    | --- | --- |

    | `sin(z)` | `asin(z)` |

    | `cos(z)` | `acos(z)` |

    | `tan(z)` | `atan(z)` 和 `atan2(imag(z),real(z))` |

    | `csc(z)` | `acsc(z)` |

    | `sec(z)` | `asec(z)` |

    | `cot(z)` | `acot(z)` |


    **双曲函数**


    | 函数 | 反函数 |

    | --- | --- |

    | `sinh(z)` | `asinh(z)` |

    | `cosh(z)` | `acosh(z)` |

    | `tanh(z)` | `atanh(z)` |

    | `csch(z)` | `acsch(z)` |

    | `sech(z)` | `asech(z)` |

    | `coth(z)` | `acoth(z)` |


    **指数和对数函数**


    | 函数 | 含义 |

    | --- | --- |

    | `exp(z)` | 以 `e` 为底的指数函数 (`e^z`) |

    | `log(z)` | 以 `e` 为底的 `z` 的对数 |

    | `log10(z)` | 以 10 为底的 `z` 的对数 |

    | `log2(z)` | 以 2 为底的 `z` 的对数 |

    | `pow2(z)` | 2 的 `z` 次幂 |

    | `sqrt(z)` | `z` 的平方根 |


    **用于实部和虚部的特定函数**


    | 函数 | 含义 |

    | --- | --- |

    | `floor(z)` | 对 `real(z)` 和 `imag(z)` 应用向下取整函数 |

    | `ceil(z)` | 对 `real(z)` 和 `imag(z)` 应用向上取整函数 |

    | `round(z)` | 对 `real(z)` 和 `imag(z)` 应用四舍五入函数 |

    | `fix(z)` | 对 `real(z)` 和 `imag(z)` 应用向零取整函数 |


    **用于复数的特定函数**


    | 函数 | 含义 |

    | --- | --- |

    | `abs(z)` | `z` 的复数模 |

    | `angle(z)` | `z` 的辐角 |

    | `conj(z)` | `z` 的共轭复数 |

    | `real(z)` | `z` 的实部 |

    | `imag(z)` | `z` 的虚部 |


    以下是复数运算的一些示例。


    ```

    >> round(1.5-3.4i)

    ans =

    2 - 3i

    >> real(i^i)

    ans =

    0.2079

    >> (2+2i)²/(-3-3*sqrt(3)*i)⁹⁰

    ans =

    0.502e-085 - 1 + 7.4042e-070i

    >> sin(1 + i)

    ans =

    1.2985 + 0.6350i

    ```


    # 支持复数向量参数的初等函数


    MATLAB 轻松处理向量和矩阵计算。实际上，它的名称 MA Trix LABoratory（矩阵实验室）就已经体现了它在处理向量和矩阵方面的强大能力。MATLAB
    允许您使用复变量函数，而且这个变量甚至可以是一个向量或矩阵。以下是一个包含复数向量参数的函数表。


    | `max(V)` | `V` 的最大分量。（对于复向量，`max` 的计算方式是：先通过 `max(abs(V))` 找出复数模最大的复数，必要时再通过
    `max(angle(x))` 找出最大的相位角。） |

    | `min(V)` | `V` 的最小分量。（对于复向量，`min` 的计算方式是：先通过 `min(abs(A))` 找出复数模最小的复数，必要时再通过
    `min(angle(x))` 找出最小的相位角。） |

    | `mean(V)` | `V` 分量的平均值。 |

    | `median(V)` | `V` 分量的中位数。 |

    | `std(V)` | `V` 分量的标准差。 |

    | `sort(V)` | 对 `V` 的分量按升序排序。对于复数元素，排序依据是绝对值和辐角。 |

    | `sum(V)` | 返回 `V` 各分量的和。 |

    | `prod(V)` | 返回 `V` 各分量的乘积，例如 `n! = prod(1:n)`。 |

    | `cumsum(V)` | 给出 `V` 各分量的累积和。 |

    | `cumprod(V)` | 给出 `V` 各分量的累积乘积。 |

    | `diff(V)` | 给出 `V` 的一阶差分向量（`V[t] - V[t-1]`）。 |

    | `gradient(V)` | 给出 `V` 的梯度。 |

    | `del2(V)` | 给出 `V` 的拉普拉斯算子（5 点离散形式）。 |

    | `fft(V)` | 给出 `V` 的离散傅里叶变换。 |

    | `fft2(V)` | 给出 `V` 的二维离散傅里叶变换。 |

    | `ifft(V)` | 给出 `V` 的逆离散傅里叶变换。 |

    | `ifft2(V)` | 给出 `V` 的二维逆离散傅里叶变换。 |


    这些函数也支持将复数矩阵作为参数，在这种情况下，结果是一个列向量构成的向量，其每个分量是将该函数应用于矩阵每一列所得的结果。


    以下是一些示例：


    ```

    >> V = 2:7, W = [5 + 3i 2-i 4i]

    V =

    2     3     4     5     6     7

    W =

    2.0000 - 1.0000i   0 + 4.0000i   5.0000 + 3.0000i

    >> diff(V),diff(W)

    ans =

    1     1     1     1     1

    ans =

    -2.0000 + 5.0000i   5.0000 - 1.0000i

    >> cumprod(V),cumsum(V)

    ans =

    2           6          24         120         720        5040

    ans =

    2     5     9    14    20    27

    >> cumsum(W), mean(W), std(W), sort(W), sum(W)

    ans =

    2.0000 - 1.0000i   2.0000 + 3.0000i   7.0000 + 6.0000i

    ans =

    2.3333 + 2.0000i

    ans =

    3.6515

    ans =

    2.0000 - 1.0000i   0 + 4.0000i   5.0000 + 3.0000i

    ans =

    7.0000 + 6.0000i

    >> mean(V), std(V), sort(V), sum(V)

    ans =

    4.5000

    ans =

    1.8708

    ans =

    2     3     4     5     6     7

    ans =

    27

    >> fft(W), ifft(W), fft2(W)

    ans =

    7.0000 + 6.0000i   0.3660 - 0.1699i  -1.3660 - 8.8301i

    ans =

    2.3333 + 2.0000i  -0.4553 - 2.9434i   0.1220 - 0.0566i

    ans =

    7.0000 + 6.0000i   0.3660 - 0.1699i  -1.3660 - 8.8301i

    ```

