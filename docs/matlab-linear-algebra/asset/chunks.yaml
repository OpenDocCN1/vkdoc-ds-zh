    # 数值


    在 MATLAB 中，函数的参数可以采用多种不同形式，包括不同类型的数值和数值表达式，例如整数、有理数、实数和复数。


    MATLAB 中的算术运算按照标准数学约定定义。MATLAB 是一个交互式程序，允许您执行一系列简单的数学运算。MATLAB 支持常见的加、减、乘、除和幂运算，并遵循它们之间的一般优先级顺序：


    | `x + y` | 和 |

    | `x - y` | 差 |

    | `x * y` 或 `x y` | 积 |

    | `x / y` | 商 |

    | `x ^ y` | 幂 |


    要相加两个数字，只需输入第一个数字、加号 (`+`) 和第二个数字。可在符号前后包含空格，以确保输入更易读。


    ```

    >> 2 + 3

    ```


    ```

    ans =

    5

    ```


    我们可以直接进行幂运算。


    ```

    >> 100 ^ 50

    ```


    ```

    ans =

    1.0000e + 100

    ```


    与计算器不同，在处理整数时，即使结果位数过多而通常无法在屏幕上一行显示，MATLAB 也会显示完整结果。例如，当使用 `vpa` 函数（此处采用默认精度 32
    位有效数字）时，MATLAB 返回 `99 ^ 50` 的以下值。


    ```

    >> vpa ''99 ^ 50''

    ```


    ```

    ans =

    .60500606713753665044791996801256e100

    ```


    要在同一指令中组合多个运算，必须考虑它们之间通常的优先级标准，这些标准决定了表达式的求值顺序。例如：


    ```

    >> 2 * 3 ^ 2 + (5-2) * 3

    ```


    ```

    ans =

    27

    ```


    考虑到运算符的优先级，首先求值的表达式是幂运算 `3²`。通过将表达式分组到括号中可以改变通常的求值顺序。


    除了这些算术运算符，MATLAB 还配备了一组基本函数，您也可以定义自己的函数。MATLAB 函数和运算符可以应用于符号常量或数值。


    MATLAB 的基本应用之一是像普通计算器一样实现算术运算，但有一个重要区别：计算的精度。运算可以按照用户所需的任何精度级别执行。这种无限制的计算精度是 MATLAB
    区别于其他数值计算程序的一个特点，在其他程序中，精度由软件固有的字长决定，并且无法修改。


    可以使用仅在特定指定精度级别内精确的特殊近似技术来放宽 MATLAB 运算输出的精度。MATLAB 会精确表示结果，但即使内部始终使用精确计算以防止舍入误差传播，也可以启用不同的近似表示格式，这有时有助于解释结果。允许数值近似的命令如下：


    | `format long` | 将结果输出到 16 位有效小数位数。 |

    | `format short` | 将结果输出到 4 位小数。这是 MATLAB 的默认格式。 |

    | `format long e` | 将结果输出到 16 位小数，并附带所需的 10 的幂。 |

    | `format short e` | 将结果输出到 4 位小数，并附带所需的 10 的幂。 |

    | `format long g` | 以最佳长格式输出结果。 |

    | `format short g` | 以最佳短格式输出结果。 |

    | `bank format` | 将结果输出到 2 位小数。 |

    | `format rat` | 以有理数近似形式返回结果。 |

    | `format +` | 返回符号（`+`、`-`）并忽略复数的虚部。 |

    | `format hex` | 以十六进制格式返回结果。 |

    | `vpa ''operations'' n` | 将指定运算的结果返回到 `n` 位有效数字。 |

    | `numeric(''expr'')` | 提供表达式由当前活动格式进行数值近似后的值。 |

    | `digits(n)` | 将结果返回到 `n` 位有效数字。 |


    使用 `format` 可以按照 `format` 命令后指定的方式给出 `174/13` 的数值近似值：


    ```

    >> 174/13

    ```


    ```

    ans =

    13.3846

    ```


    ```

    >> format long; 174/13

    ```


    ```

    ans =

    13.38461538461539

    ```


    ```

    >> format long e; 174/13

    ```


    ```

    ans =

    1.338461538461539e + 001

    ```


    ```

    >> format short e; 174/13

    ```


    ```

    ans =

    1.3385e + 001

    ```


    ```

    >> format long g; 174/13

    ```


    ```

    ans =

    13.3846153846154

    ```


    ```

    >> format short g; 174/13

    ```


    ```

    ans =

    13.385

    ```


    ```

    >> format bank; 174/13

    ```


    ```

    ans =

    13.38

    ```


    ```

    >> format hex; 174/13

    ```


    ```

    ans =

    402ac4ec4ec4ec4f

    ```


    现在我们将看到如何计算 `sqrt(17)` 的值到我们想要的任意精度：


    ```

    >> vpa '' 174/13 '' 10

    ```


    ```

    ans =

    13.38461538

    ```


    ```

    >> vpa '' 174/13 '' 15

    ```


    ```

    ans =

    13.3846153846154

    ```


    ```

    >> digits (20); vpa '' 174/13 ''

    ```


    ```

    ans =

    13.384615384615384615

    ```


    ## 整数


    在 MATLAB 中，所有涉及整数的常见运算都是精确的，无论输出大小如何。如果我们希望操作结果以一定数量的有效数字显示在屏幕上，我们会使用符号计算命令 `vpa`（可变精度算术），其语法我们已经了解。


    例如，以下计算将 `6⁴⁰⁰` 计算到 450 位有效数字：


    ```

    >> ''6 vpa ^ 400'' 450

    ```


    ```

    ans =

    .

    ```


    运算结果是精确的，始终在结果末尾显示一个小数点。在这种情况下，结果位数无论如何都少于 450 位，因此解是精确的。如果您需要更少的有效数字，可以指定该数字，结果将相应地进行四舍五入。例如，将上述幂计算到仅
    50 位有效数字，我们得到：


    ```

    >> ''6 vpa ^ 400'' 50

    ```


    ```

    ans =

    .18217977168218728251394687124089371267338971528175e312

    ```


    ## 整数函数与整除性


    MATLAB 中有几个函数使用整数参数，其中大部分与整除性相关。最典型的整数参数函数如下：


    | `rem(n, m)` | 返回 `n` 除以 `m` 的余数（当 `n` 和 `m` 为实数时也有效）。 |

    | `sign(n)` | `n` 的符号（即如果 `n > 0` 为 1，如果 `n < 0` 为 -1）。 |

    | `max(n1, n2)` | `n1` 和 `n2` 中的最大值。 |

    | `min(n1, n2)` | `n1` 和 `n2` 中的最小值。 |

    | `gcd(n1, n2)` | `n1` 和 `n2` 的最大公约数。 |

    | `lcm(n1, n2)` | `n1` 和 `n2` 的最小公倍数。 |

    | `factorial(n)` | `n` 的阶乘（即 `n(n-1)(n-2)…1`） |

    | `factor(n)` | 返回 `n` 的质因数分解。 |


    以下是一些示例。


    17 除以 3 的余数：


    ```

    >> rem (17,3)

    ```


    ```

    ans =

    2

    ```


    4.1 除以 1.2 的余数：


    ```

    >> rem (4.1,1.2)

    ```


    ```

    ans =

    0.5000

    ```


    -4.1 除以 1.2 的余数：


    ```

    >> rem (-4.1,1.2)

    ```


    ```

    ans =

    -0.5000

    ```


    1000、500 和 625 的最大公约数：


    ```

    >> gcd (1000, gcd (500,625))

    ```


    ```

    ans =

    125.00

    ```


    1000、500 和 625 的最小公倍数：


    ```

    >> lcm (1000, lcm (500,625))

    ```


    ```

    ans =

    5000.00

    ```

