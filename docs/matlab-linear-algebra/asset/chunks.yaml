    plot(Y)` ![A978-1-4842-0322-4_3_Figp_HTML.jpg](A978-1-4842-0322-4_3_Figp_HTML.jpg)
    |

    | plot(X, Y, S) | Creates a plot of Y against X as described by plot(X,Y) with
    the settings defined in S. Usually S consists of two characters between single
    quotes, the first sets the color of the line graph and the second specfies the
    markeror line type. The possible values of colors and characters are, respectively,
    as follows: y (yellow), m (magenta), c (cyan), r (red), g (green), b (blue), w
    (white), k (black), . (point), o (circle), x (cross), s (square), d (diamond),
    ^ (upward pointing triangle), v (downward pointing triangle), > (right pointing
    triangle), < (left pointing triangle), p (pentagram), h (hexagram), + (plus sign),
    * (asterisk), - (solid line), -- (dashed line),: (dotted line), -. (dash-dot line).
    `>> plot([1,2,3,4,5,6,7,8,9],[1, 1/2, 1/3,1/4,1/5,1/6, 1/7,1/8,1/9],''r *'')`
    ![A978-1-4842-0322-4_3_Figq_HTML.jpg](A978-1-4842-0322-4_3_Figq_HTML.jpg) |

    | plot(X1,Y1,S1,X2,Y2,S2,…) | Combines the plots for the triples (Xi, Yi, Si).
    This is a useful way of representing various functions on the same graph. |

    | fplot(‘f’, [xmin, x max]) | Graphs the explicit function y = f (x) in the specified
    range of variation for x. `>> fplot(''x*sin(1/x)'', [0,pi/16])` ![A978-1-4842-0322-4_3_Figr_HTML.jpg](A978-1-4842-0322-4_3_Figr_HTML.jpg)
    |

    | fplot(‘f’,[xmin, x max, ymin, ymax], S) | Graphs the explicit function y = f
    (x) in the specified intervals of variation for x and y, with options for color
    and characters given by S. `>> fplot(''x^2/(x + 1)'', [-12,12,-8, 8])` ![A978-1-4842-0322-4_3_Figs_HTML.jpg](A978-1-4842-0322-4_3_Figs_HTML.jpg)
    |

    | fplot(‘f’,[xmin, x max],…,t) | Graphs the function f with relative error tolerance
    t. |

    | fplot(‘f’,[xmin, x max],…,n) | Graphs the function f with a minimum of n + 1
    points where the maximum step size is (xmax-xmin)/nt. |

    | fplot(‘[f1,f2,…,fn]’,[xmin, x max, ymin, ymax], S) | Graphs the functions f1,
    f2,…, fn on the same axes in the specified ranges of variation of x and y and
    with the color and markers given by S. `>> fplot(''[sin(x), sin(2*x), sin(3*x)]'',
    [0,2*pi])` ![A978-1-4842-0322-4_3_Figt_HTML.jpg](A978-1-4842-0322-4_3_Figt_HTML.jpg)
    `>> fplot (''[sin (x), sin(2*x), sin(3*x)]'', [0, 2 * pi],''k *'')` ![A978-1-4842-0322-4_3_Figu_HTML.jpg](A978-1-4842-0322-4_3_Figu_HTML.jpg)
    |

    | ezplot(‘f’, [xmin, x max]) | Graphs the explicit function y = f (x) or implicit
    function f(x,y) = k in the given range of variation of x. The range of variation
    of the variable can be omitted. `>> ezplot(''y*x^2 + x*y^2 = 10'',[-10,10])` ![A978-1-4842-0322-4_3_Figv_HTML.jpg](A978-1-4842-0322-4_3_Figv_HTML.jpg)
    `>> ezplot (''x^2-/(x^2-1)'')` ![A978-1-4842-0322-4_3_Figw_HTML.jpg](A978-1-4842-0322-4_3_Figw_HTML.jpg)
    |

    | ezplot(‘f’, [xmin, x max, ymin, ymax]) | Graphs the explicit function y = f
    (x) or the implicit function f(x,y) = k for the given intervals of variation of
    x and y (which can be omitted). `>> ezplot(''x^2 + y^3 = 1/2'',[-10,10,-8,8])`
    ![A978-1-4842-0322-4_3_Figx_HTML.jpg](A978-1-4842-0322-4_3_Figx_HTML.jpg) `>>
    ezplot(''x^2 - y^4 = 1'')` ![A978-1-4842-0322-4_3_Figy_HTML.jpg](A978-1-4842-0322-4_3_Figy_HTML.jpg)
    |

    | ezplot(x,y) | Graphs the planar parametric curve x = x(t) and y = y(t) for 0
    ≤ t < 2 π `>> ezplot (''4 * cos (t) - cos(4*t)'', '' 4 * sin (t) - sin(4*t)'')`
    ![A978-1-4842-0322-4_3_Figz_HTML.jpg](A978-1-4842-0322-4_3_Figz_HTML.jpg) |

    | ezplot(‘f’, [xmin x max]) | Graphs the planar parametric curve x = x(t) and
    y = y(t) for xmin < t < xmax. `>> ezplot(''t*sin(t)'', ''t*cos(t)'',[-4*pi,4*pi]`
    ![A978-1-4842-0322-4_3_Figaa_HTML.jpg](A978-1-4842-0322-4_3_Figaa_HTML.jpg) |

    | ezplot(‘f’) | Graphs the curve f where the coordinates range over the default
    domain [-2 π ,2 π ]. `>> ezplot(''y^4 - x^4 - 24*y^2 + 25*x^2 = 0'')` ![A978-1-4842-0322-4_3_Figab_HTML.jpg](A978-1-4842-0322-4_3_Figab_HTML.jpg)
    |

    | loglog(X,Y) | Produces a plot similar to plot(X,Y), but with a logarithmic scale
    on the two axes. `>> x=0:0.1:pi; y=x.*sin(x); loglog(x,y)` ![A978-1-4842-0322-4_3_Figac_HTML.jpg](A978-1-4842-0322-4_3_Figac_HTML.jpg)
    |

    | semilogx(X,Y) | Produces a plot similar to plot(X,Y), but with a logarithmic
    scale on the x-axis and a normal scale on the y-axis. `>> x=0:0.1:pi; y=x.*sin(x);
    semilogx(x,y)` ![A978-1-4842-0322-4_3_Figad_HTML.jpg](A978-1-4842-0322-4_3_Figad_HTML.jpg)
    |

    | semilogy(X,Y) | Produces a plot similar to plot(X,Y), but with a logarithmic
    scale on the y-axis and and a normal scale on the x-axis. `>> x=0:0.1:pi; y=x.*sin(x);
    semilogy(x,y)` ![A978-1-4842-0322-4_3_Figae_HTML.jpg](A978-1-4842-0322-4_3_Figae_HTML.jpg)
    |

    | polar(α, r) | Draws the curve r = r (α) given in polar coordinates. `>> t=0:0.1:2*pi;r=sin(t).*cos(t);
    polar(t,r)` ![A978-1-4842-0322-4_3_Figaf_HTML.jpg](A978-1-4842-0322-4_3_Figaf_HTML.jpg)
    |

    | polar(α, r, S) | Draws the curve r = r (α) given in polar coordinates with the
    style of lines specified by S. `>> t=0:0.05:2*pi;r=sin(t).*cos(t); polar(t,r,''*r'')`
    ![A978-1-4842-0322-4_3_Figag_HTML.jpg](A978-1-4842-0322-4_3_Figag_HTML.jpg) |

    | ezpolar(r) ezpolar(r, [a, b]) | Draws the curve r = r (α) in polar coordinates
    where the field of variation of α is given by [a,b], or if it is not stated, is
    the default range [0, 2π]. `>> ezpolar (''1 + cos (t)'')` ![A978-1-4842-0322-4_3_Figah_HTML.jpg](A978-1-4842-0322-4_3_Figah_HTML.jpg)
    |

    | fill(X, Y, C) | Draws the filled polygon whose vertices are given by the components
