- fmt: '# Numbers


    In MATLAB the arguments of a function can take many different forms, including
    different types of numbers and numerical expressions, such as integers and rational,
    real and complex numbers.


    Arithmetic operations in MATLAB are defined according to the standard mathematical
    conventions. MATLAB is an interactive program that allows you to perform a simple
    variety of mathematical operations. MATLAB assumes the usual operations of sum,
    difference, product, division and power, with the usual hierarchy between them:


    | `x + y` | Sum |

    | `x - y` | Difference |

    | `x * y` or `x y` | Product |

    | `x / y` | Division |

    | `x ^ y` | Power |


    To add two numbers simply enter the first number, a plus sign (`+`) and the second
    number. Spaces may be included before and after the sign to ensure that the input
    is easier to read.


    ```

    >> 2 + 3

    ```


    ```

    ans =

    5

    ```


    We can perform power calculations directly.


    ```

    >> 100 ^ 50

    ```


    ```

    ans =

    1.0000e + 100

    ```


    Unlike a calculator, when working with integers, MATLAB displays the full result
    even when there are more digits than would normally fit across the screen. For
    example, MATLAB returns the following value of `99 ^ 50` when using the `vpa`
    function (here to the default accuracy of 32 significant figures).


    ```

    >> vpa ''99 ^ 50''

    ```


    ```

    ans =

    .60500606713753665044791996801256e100

    ```


    To combine several operations in the same instruction one must take into account
    the usual priority criteria among them, which determine the order of evaluation
    of the expression. Consider, for example:


    ```

    >> 2 * 3 ^ 2 + (5-2) * 3

    ```


    ```

    ans =

    27

    ```


    Taking into account the priority of operators, the first expression to be evaluated
    is the power `3^2`. The usual evaluation order can be altered by grouping expressions
    together in parentheses.


    In addition to these arithmetic operators, MATLAB is equipped with a set of basic
    functions and you can also define your own functions. MATLAB functions and operators
    can be applied to symbolic constants or numbers.


    One of the basic applications of MATLAB is its use in realizing arithmetic operations
    as if it were a conventional calculator, but with one important difference: the
    precision of the calculation. Operations are performed to whatever degree of precision
    the user desires. This unlimited precision in calculation is a feature which sets
    MATLAB apart from other numerical calculation programs, where the accuracy is
    determined by a word length inherent to the software, and cannot be modified.


    The accuracy of the output of MATLAB operations can be relaxed using special approximation
    techniques which are exact only up to a certain specified degree of precision.
    MATLAB represents results with accuracy, but even if internally you are always
    working with exact calculations to prevent propagation of rounding errors, different
    approximate representation formats can be enabled, which sometimes facilitate
    the interpretation of the results. The commands that allow numerical approximation
    are the following:


    | `format long` | Delivers results to 16 significant decimal figures. |

    | `format short` | Delivers results to 4 decimal places. This is MATLAB’s default
    format. |

    | `format long e` | Provides the results to 16 decimal figures more than the power
    of 10 required. |

    | `format short e` | Provides the results to four decimal figures more than the
    power of 10 required. |

    | `format long g` | Provides the results in optimal long format. |

    | `format short g` | Provides the results in optimum short format. |

    | `bank format` | Delivers results to 2 decimal places. |

    | `format rat` | Returns the results in the form of a rational number approximation.
    |

    | `format +` | Returns the sign (`+`, `-`) and ignores the imaginary part of complex
    numbers. |

    | `format hex` | Returns results in hexadecimal format. |

    | `vpa ''operations'' n` | Returns the result of the specified operations to `n`
    significant digits. |

    | `numeric(''expr'')` | Provides the value of the expression numerically approximated
    by the current active format. |

    | `digits(n)` | Returns results to `n` significant digits. |


    Using `format` gives a numerical approximation of `174/13` in the way specified
    after the `format` command:


    ```

    >> 174/13

    ```


    ```

    ans =

    13.3846

    ```


    ```

    >> format long; 174/13

    ```


    ```

    ans =

    13.38461538461539

    ```


    ```

    >> format long e; 174/13

    ```


    ```

    ans =

    1.338461538461539e + 001

    ```


    ```

    >> format short e; 174/13

    ```


    ```

    ans =

    1.3385e + 001

    ```


    ```

    >> format long g; 174/13

    ```


    ```

    ans =

    13.3846153846154

    ```


    ```

    >> format short g; 174/13

    ```


    ```

    ans =

    13.385

    ```


    ```

    >> format bank; 174/13

    ```


    ```

    ans =

    13.38

    ```


    ```

    >> format hex; 174/13

    ```


    ```

    ans =

    402ac4ec4ec4ec4f

    ```


    Now we will see how the value of `sqrt(17)` can be calculated to any precision
    that we desire:


    ```

    >> vpa '' 174/13 '' 10

    ```


    ```

    ans =

    13.38461538

    ```


    ```

    >> vpa '' 174/13 '' 15

    ```


    ```

    ans =

    13.3846153846154

    ```


    ```

    >> digits (20); vpa '' 174/13 ''

    ```


    ```

    ans =

    13.384615384615384615

    ```


    ## Integers


    In MATLAB all common operations with whole numbers are exact, regardless of the
    size of the output. If we want the result of an operation to appear on screen
    to a certain number of significant figures, we use the symbolic computation command
    `vpa` (variable precision arithmetic), whose syntax we already know.


    For example, the following calculates `6^400` to 450 significant figures:


    ```

    >> ''6 vpa ^ 400'' 450

    ```


    ```

    ans =

    .

    ```


    The result of the operation is precise, always displaying a point at the end of
    the result. In this case it turns out that the answer has fewer than 450 digits
    anyway, so the solution is exact. If you require a smaller number of significant
    figures, that number can be specified and the result will be rounded accordingly.
    For example, calculating the above power to only 50 significant figures we have:


    ```

    >> ''6 vpa ^ 400'' 50

    ```


    ```

    ans =

    .18217977168218728251394687124089371267338971528175e312

    ```


    ## Functions of Integers and Divisibility


    There are several functions in MATLAB with integer arguments, the majority of
    which are related to divisibility. Among the most typical functions with integer
    arguments are the following:


    | `rem(n, m)` | Returns the remainder of the division of `n` by `m` (also valid
    when `n` and `m` are real). |

    | `sign(n)` | The sign of `n` (i.e. 1 if `n > 0`, -1 if `n < 0`). |

    | `max(n1, n2)` | The maximum of `n1` and `n2`. |

    | `min(n1, n2)` | The minimum of `n1` and `n2`. |

    | `gcd(n1, n2)` | The greatest common divisor of `n1` and `n2`. |

    | `lcm(n1, n2)` | The least common multiple of `n1` and `n2`. |

    | `factorial(n)` | `n` factorial (i.e. `n(n-1)(n-2)…1`) |

    | `factor(n)` | Returns the prime factorization of `n`. |


    Below are some examples.


    The remainder of division of 17 by 3:


    ```

    >> rem (17,3)

    ```


    ```

    ans =

    2

    ```


    The remainder of division of 4.1 by 1.2:


    ```

    >> rem (4.1,1.2)

    ```


    ```

    ans =

    0.5000

    ```


    The remainder of division of -4.1 by 1.2:


    ```

    >> rem (-4.1,1.2)

    ```


    ```

    ans =

    -0.5000

    ```


    The greatest common divisor of 1000, 500 and 625:


    ```

    >> gcd (1000, gcd (500,625))

    ```


    ```

    ans =

    125.00

    ```


    The least common multiple of 1000, 500 and 625:


    ```

    >> lcm (1000, lcm (500,625))

    ```


    ```

    ans =

    5000.00

    ```'
