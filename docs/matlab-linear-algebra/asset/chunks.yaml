    As a second example, we solve the system:


    ![A978-1-4842-0322-4_4_Fig23_HTML.jpg](A978-1-4842-0322-4_4_Fig23_HTML.jpg)


    We find the rank of the matrix of the system and the rank of the augmented matrix.


    `>> A=[1,2,3;1,3,8;2,3,1;5,6,4];`


    `>> B=[1,2,3,6;1,3,8,19;2,3,1,-1;5,6,4,5];`


    `>> [rank(A), rank(B)]`


    `ans =`


    `3     3`


    We note that the ranks of the two matrices coincide with the number of unknowns.
    The Rouche-Frobenius theorem then tells us that the system is compatible with
    a unique solution. We can calculate the solution in the following way:


    `>> A = [1,2,3;1,3,8;2,3,1;5,6,4];`


    `>> B = [19-6 - 5-1]'';`


    `>> linsolve (A, B)`


    `ans =`


    `1.0000`


    `-2.0000`


    `3.0000`


    As a third example, we solve the system:


    ![A978-1-4842-0322-4_4_Fig24_HTML.jpg](A978-1-4842-0322-4_4_Fig24_HTML.jpg)


    As we have a homogeneous system, we will calculate the determinant of the matrix
    of coefficients of the system.


    `>> A = [1,2, - 1; 2, - 1, 1; 3,1,0];`


    `>> det (A)`


    `ans =`


    `5\. 5511e-016`


    This answer is very close to zero, in fact the determinant is actually zero, thus
    the homogeneous system will have infinitely many solutions, which are calculated
    with the command solve as shown below.


    `>> [x, y, z] = solve(''x+2*y-z, 2*x-y+z, 3*x+y'', ''x,y,z'')`


    `x =`


    `-z1/5`


    `y =`


    `(3 * z1) / 5`


    `z =`


    `z1`


    Thus the infinite set of solutions depend on a parameter z1 and are described
