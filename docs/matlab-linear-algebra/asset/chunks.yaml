  trans: '

    # 向量空间、线性映射与二次型


    上述矩阵命令可用于处理向量空间、线性映射和二次型。利用这些命令，可以判断向量集合的线性相关性与线性无关性，进行基的变换，并处理二维和三维向量几何中的一般问题。我们在以下示例中展示这些应用。


    第一个示例是判断向量 `{{1,2, - 3, 4}, {3, - 1, 2, 1}, {1,-5.8, - 7}, {2,3,1,-1}}` 是否线性无关。


    ```

    >> A = [1,2,-3,4;3,-1,2,1;1,-5,8,-7;2,3,1,-1]

    A =

    1  2 -3 -4

    3 -1  2  1

    1 -5  8 -7

    2  3  1 -1

    >> det (A)

    ans =

    0

    ```


    由于以这些向量为行构成的矩阵的行列式为零，因此这些向量线性相关。


    第二个示例是判断 `R⁴` 中的三个向量 `{{1,2,2,1},{3,4,4,3},{1,0,0,1}}` 是否线性无关。


    ```

    >> B = [1,2,2,1;3,4,4,3;1,0,0,1]

    B =

    1 2 2 1

    3 4 4 3

    1 0 0 1

    >> rank (B)

    ans =

    2

    ```


    由于我们在 `R⁴` 中有三个向量，如果以这些向量为行构成的矩阵的秩为 3，则它们线性无关。然而，由于该秩为 2，因此这些向量线性相关。


    第三个示例是求由向量 `{{2,3,4,-1,1},{3,4,7,-2,-1},{1,3,-1,1,8},{0,5,5,-1,4}}` 生成的线性子空间的维数和一组基。


    为了求线性空间的维数，我们计算由这些生成向量构成的矩阵的秩。该秩即为所求的维数。


    ```

    >> A = [2,3,4,-1,1;3,4,7,-2,-1;1,3,-1,1,8;0,5,5,-1,4]

    A =

    2     3     4    -1     1

    3     4     7    -2    -1

    1     3    -1     1     8

    0     5     5    -1     4

    >> rank (A)

    ans =

    3

    ```


    因此线性空间的维数为 3，一组基将由矩阵 `A` 中任意一个 3 阶非奇异子式对应的行向量构成。


    ```

    >> det([3 4 7; 1 3 -1;0 5 5])

    ans =

    75

    ```


    因此，一组基由向量 `{{3,4,7,-2,-1}, {1,3, - 1, 1, 8}, {0,5,5,-1,4}}` 构成。


    第四个示例是判断向量 `{{2.3, - 1}, {0,0,1}, {2,1,0}}` 是否构成 `R³` 的一组基，并求向量 `{3,5,1}` 在该基下的坐标。


    由于这是三维空间中的三个向量，它们构成 `R³` 一组基的充分条件是以这些向量为行构成的矩阵的行列式非零。


    ```

    >> det([2,3,-1;0,0,1;2,1,0])

    ans =

    4

    ```


    这些向量构成一组基。为了求向量 `{3,5,1}` 在该基下的坐标，我们执行以下操作：


    ```

    >> inv([2,0,2;3,0,1;-1,1,0]) * [3,5,1]''

    ans =

    1.7500

    2.7500

    -0.2500

    ```


    在第五个示例中，我们考虑 `R³` 的两组基：`B = {{1,0,0}, {- 1, 1, 0}, {0,1, - 1}}` 和 `B1 = {{1,0,
    - 1}, {2,1,0}, {- 1, 1, 1}}`，求从基 `B` 到基 `B1` 的过渡矩阵，并计算 `B` 基下的向量 `{2,1,3}` 在基
    `B1` 下的坐标。


    需要执行的操作如下：


    ```

    >> B = [1,0,0;-1,1,0;0,1,-1]

    B =

    1    0    0

    -1    1    0

    1   -0   -1

    >> B1 = [1, 0, -1; 2, 1, 0; -1, 1, 1]

    B1 =

    1 0 -1

    2 1  0

    -1 1  1

    >> A = inv(B1'') * B''

    A =

    -0.5000  1.5000  2.5000

    0.5000 -0.5000 -0.5000

    -0.5000  1.5000  1.5000

    ```


    为了利用过渡矩阵 `A` 求 `B` 基下的向量 `{2,1,3}` 在 `B1` 基下的坐标，我们执行以下操作：


    ```

    >> inv(B1'') * B''* [2,1,3]''

    ans =

    8

    -1

    5

    ```


    第六个示例是求向量 `{{1,1,2},{0,1,0},{0,1,1}}` 的标量三重积，并计算顶点坐标为 `(0,0)`、`(5,1)` 和 `(3,7)`
    的三角形的面积。


    ```

    >> dot ([1,1,2], cross ([0,1,0], [0,1,1]))

    ans =

    1

    >> (1/2) * det ([0,0,1;5,1,1;3,7,1])

    ans =

    16

    ```


    第七个示例考虑一个从 `R⁵` 到 `R³` 的线性变换，该变换在标准基下的矩阵如下所示：


    ![A978-1-4842-0322-4_5_Fig2_HTML.jpg](img/A978-1-4842-0322-4_5_Fig2_HTML.jpg)


    我们求该变换核的一组基（从而得到其维数），并求向量 `{4,2,0,0,-6}` 和 `{1.2, - 1, - 2, 3}` 的像。我们还要求该变换的像空间的一组基。

    '
- fmt: "`>> A = [0,-3,-1,-3,-1;-3,3,-3,-3,-1;2,2,-1,1,2]`\n\n```\nA =\n\n   0    -3\
    \    -1    -3    -1\n  -3     3    -3    -3    -1\n   2     2    -1     1    \
    \ 2\n```\n\n`>> null(A)`\n\n```\nans =\n\n  -0.5397  -0.1251\n  -0.2787  -0.2942\n\
    \  -0.0266  -0.6948\n   0.0230   0.6021\n   0.7936  -0.2292\n```\n\nThese two\
    \ column vectors form a basis for the null space of `A`. Thus the kernel of the\
    \ transformation has dimension 2. Two previous output vectors form the core of\
    \ the nucleus and therefore the dimension of the kernel is 2.\n\nTo find the image\
    \ of any column vector `v` via the linear transformation we simply compute `A*v`.\n\
    \n`>> A*[4 2 0 0 -6]'`\n\n```\nans =\n\n   0\n   0\n   0\n```\n\n`>> A*[1 2 -1\
    \ -2 3]'`\n\n```\nans =\n\n  -2\n   9\n  11\n```\n\nThe dimension of the image\
    \ of the linear transformation is equal to the rank of `A`.\n\n`>> rank (A)`\n\
    \n```\nans =\n\n   3\n```\n\nThus the dimension of the image of the transformation\
    \ is 3, and a basis of the image will be given by any three linearly independent\
    \ columns of `A`.\n\n`>> det([0 -3 -2;-3 3 2;-1 -3 -1])`\n\n```\nans =\n\n  -9\n\
    ```\n\nTherefore, the vectors `{{0 - 3 - 2};{-3 3 2}; {- 1 -3 - 1}}` form a basis\
    \ of the image.\n\nAs an eighth example we consider the linear transformation\
    \ `f` between two vector subspaces `U` and `V` of real three-dimensional space,\
    \ such that `f (a, b, c) = (a + b, b + c, a + c)`, for `(a, b, c)` in `U`. We\
    \ find the matrices corresponding to the transformations `f`, `f⁵`, and `e^f`.\n\
    \nTo find the matrix of `f`, we find the images of the canonical basis vectors\
    \ under `f`:\n\n`>> f`\n\n```\nf =\n\n  [a + b, b + c, a + c]\n```\n\n`>> subs(f,{a,b,c},{1,0,0})`\n\
    \n```\nans =\n\n  1     0     1\n```\n\n`>> subs(f,{a,b,c},{0,1,0})`\n\n```\n\
    ans =\n\n  1     1     0\n```\n\n`>> subs(f,{a,b,c},{0,0,1})`\n\n```\nans =\n\n\
    \  0     1     1\n```\n\nThe matrix `A` associated with the linear transformation\
    \ `f` will then have as columns the images of the basis vectors found above. Thus:\n\
    \n![A978-1-4842-0322-4_5_Fig3_HTML.jpg](A978-1-4842-0322-4_5_Fig3_HTML.jpg)\n\n\
    The matrix associated to `f⁵` will be `A⁵` and the matrix associated to `e^f`\
    \ will be `e^A`.\n\n`>> A = ([1 0 1;1 1 0;0 1 1])'`\n\n```\nA =\n\n   1     1\
    \     0\n   0     1     1\n   1     0     1\n```\n\n`>> A ^ 5`\n\n```\nans =\n\
    \n  11    10    11\n  11    11    10\n  10    11    11\n```\n\n`>> expm(A)`\n\n\
    ```\nans =\n\n  3.1751  2.8321  1.3819\n  1.3819  3.1751  2.8321\n  2.8321  1.3819\
    \  3.1751\n```\n\nFor our ninth example we classify the bilinear form `f:U×V→R`\
    \ and the quadratic form `g:U→R` defined as follows:\n\n![A978-1-4842-0322-4_5_Fig4_HTML.jpg](A978-1-4842-0322-4_5_Fig4_HTML.jpg)\n\
    ![A978-1-4842-0322-4_5_Fig5_HTML.jpg](A978-1-4842-0322-4_5_Fig5_HTML.jpg)\n\n\
    `>> A = [1, - 2, 0; 0, 0, 4; - 1, 0, - 3]`\n\n```\nA =\n\n   1  -2   0\n   0 \
    \  0   4\n  -1   0  -3\n```\n\n`>> det (A)`\n\n```\nans =\n\n   8\n```\n\nAs the\
    \ determinant of the matrix of `f` is non-zero, the bilinear form is regular non-degenerate.\n\
    \n`>> B = [1, - 1, 3; - 1, 1, - 3/2; 3, - 3/2, 4]`\n\n```\nB =\n\n   1.0000  -1.0000\
    \   3.0000\n  -1.0000   1.0000  -1.5000\n   3.0000  -1.5000   4.0000\n```\n\n\
    To classify the quadratic form, we calculate its diagonal determinants.\n\n`>>\
    \ det (B)`\n\n```\nans =\n\n  -2.2500\n```\n\n`>> det([1,-1;-1,1])`\n\n```\nans\
    \ =\n\n   0\n```\n\nIt turns out that the quadratic form is negative semi-definite.\n\
    \nWe can also obtain the classification via the eigenvalues of the matrix of the\
    \ quadratic form. A quadratic form is defined to be positive if and only if all\
    \ its eigenvalues are strictly positive. A quadratic form is defined to be negative\
    \ if and only if all its eigenvalues are strictly negative. A quadratic form is\
    \ positive semi-definite if and only if all its eigenvalues are non-negative.\
    \ A quadratic form is negative semi-definite if and only if all its eigenvalues\
    \ are non-positive. A quadratic form is indefinite if there are both positive\
    \ and negative eigenvalues.\n\n`>> eig (B)`\n\n```\nans =\n\n  -0.8569\n   0.4071\n\
    \   6.4498\n```\n\nThere are positive and negative eigenvalues, so the quadratic\
    \ form is indefinite.\n\nEXERCISE 5-1\n\nConsider the following matrix:\n\n![A978-1-4842-0322-4_5_Fig6_HTML.jpg](A978-1-4842-0322-4_5_Fig6_HTML.jpg)\n\
    \nFind its transpose, its inverse, its determinant, its rank, its trace, its singular\
