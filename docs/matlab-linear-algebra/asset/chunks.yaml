    each triplet column vector (X.j, Y.j, Z.j) will be drawn. In this case, C can
    be a row vector of elements Cj determining the unique color of each polygon corresponding
    to (X.j, Y.j, Z.j). C can also be a matrix of the same dimension as X, Y and Z,
    in which case its elements determine the colors of each vertex (Xijk, Yijk, Zijk)
