    `e = rand (size (x)) / 10;` `errorbar(x,y,e)` ![A978-1-4842-0322-4_3_Figi_HTML.jpg](img/A978-1-4842-0322-4_3_Figi_HTML.jpg)
    |

    | `stem(Y)` | 将数据序列 `Y` 绘制为从 x 轴基线延伸到由小圆圈指示的点的茎状图。`>> y = randn (50.1); stem (y)`
    ![A978-1-4842-0322-4_3_Figj_HTML.jpg](img/A978-1-4842-0322-4_3_Figj_HTML.jpg)
    |

    | `stem(X,Y)` | 将数据序列 `Y` 绘制为茎状图，其中 x 轴值由 `X` 确定。 |

    | `stairs(Y)` | 绘制数据序列 `Y` 的阶梯图。 |

    | `stairs(X,Y)` | 绘制数据 `Y` 的阶梯图，其中 x 值由向量 `X` 确定。`>> x=-3:0.1:3; stairs(x,exp(-x.²))`
    ![A978-1-4842-0322-4_3_Figk_HTML.jpg](img/A978-1-4842-0322-4_3_Figk_HTML.jpg)
    |

    | `rose (Y)` | 创建一个角度直方图，显示数据 `Y` 在 20 个角度箱中的分布。角度以弧度为单位。半径反映了落入相应箱中的元素数量。`>>
    y = randn (1000,1) * pi; rose (y)` ![A978-1-4842-0322-4_3_Figl_HTML.jpg](img/A978-1-4842-0322-4_3_Figl_HTML.jpg)
    |

    | `rose(Y,n)` | 绘制数据 `Y` 的角度直方图，包含 `n` 个等间距的箱。`n` 的默认值为 20。 |

    | `rose(Y,X)` | 绘制数据 `Y` 的角度直方图，其中 `X` 指定箱的数量和位置（中心角）。 |

    | `compass(Z)` | 绘制数据 `Z` 的罗盘图。对于复数向量 `Z` 中的每个条目，绘制一个箭头，其基点在原点，头部在由该条目确定的点处。`>>
    z=eig(randn(20,20)); compass(z)` ![A978-1-4842-0322-4_3_Figm_HTML.jpg](img/A978-1-4842-0322-4_3_Figm_HTML.jpg)
    |

    | `compass(X,Y)` | 等价于 `compass(X+i*Y)`。 |

    | `compass(Z, S)` 或 `compass(X, Y, S)` | 绘制罗盘图，箭头样式由 `S` 指定。 |

    | `feather(Z)` 或 `feather(X,Y)` 或 `feather(Z,S)` 或 `feather(X,Y,S)` | 生成类似于罗盘图的图形，不同之处在于箭头现在从
