    2

    ```


    `f` 的像的维数必须等于矩阵 `A` 的秩，我们刚刚看到这个秩是 2。`A` 的任意一个包含一个非奇异 2×2 子矩阵的两列子矩阵的列将构成 `f` 的像的一组基。


    ```

    >> det([1,0;0,1])


    ans =


    1

    ```


    因此，`f` 的像的一组基由 `{{1,0,0,0},{0,0,1,0}}` 给出。


    ## 练习 5-12


    给定二次型 `g:U®R` 定义如下：


    ![A978-1-4842-0322-4_5_Fig16_HTML.jpg](img/A978-1-4842-0322-4_5_Fig16_HTML.jpg)


    对其进行分类，并求出其约化方程、秩和符号差。


    为了对二次型进行分类，我们计算其对角行列式。


    ```

    >> G = [1,0,0;0,2,2;0,2,2]


    G =


    1 0 0

    0 2 2

    0 2 2


    >> det (G)


    ans =


    0


    >> det([1,0;0,2])


    ans =


    2

    ```


    该二次型是退化的半正定二次型。


    为了求出约化方程，我们对矩阵进行对角化。


    ```

    >> J = jordan (G)


    J =


    0 0 0

    0 1 0

    0 0 4

    ```


    则二次型的约化方程为：


    ![A978-1-4842-0322-4_5_Fig17_HTML.jpg](img/A978-1-4842-0322-4_5_Fig17_HTML.jpg)


    ```

    >> rank (J)


    ans =


    2

    ```


    该二次型的秩为 2，因为矩阵的秩为 2。其符号差也为 2，因为对角矩阵中正项的个数为 2。

