    ![A978-1-4842-0322-4_3_Figcj_HTML.jpg](A978-1-4842-0322-4_3_Figcj_HTML.jpg)


    ## Exercise 3-10


    Plot the curves defined by the following implicit equations:


    `x⁵ – x²y² + y⁵ = 0`


    `x⁴ + x²y – y⁵ + y⁴ = 0`


