  trans: '

    ### 逻辑函数


    MATLAB 实现了逻辑函数，其输出可以取值为 `true`（1）或 `false`（0）。下表展示了最重要的逻辑函数。


    | `exist(A)` | 检查变量或函数是否存在（如果 `A` 不存在则返回 0；如果存在，则根据类型返回 1 到 5 之间的一个数字）。 |

    | :--- | :--- |

    | `any(V)` | 如果向量 `V` 的所有元素都为空，则返回 0；如果 `V` 的某个元素非零，则返回 1。 |

    | `any(A)` | 对于矩阵 `A` 中所有元素都为零的列，返回 0；对于 `A` 中有非零元素的列，返回 1。 |

    | `all(V)` | 如果向量 `V` 的所有元素都非空，则返回 1；如果 `V` 的某个元素为空，则返回 0。 |

    | `all(A)` | 对于矩阵 `A` 中所有元素都非空的列，返回 1；对于 `A` 中至少有一个空元素的列，返回 0。 |

    | `find(V)` | 返回向量 `V` 中非空元素所在的位置（或索引）。 |

    | `isnan(V)` | 对于 `V` 中不确定的元素，返回 1；对于非不确定的元素，返回 0。 |

    | `isinf(V)` | 对于 `V` 中为无穷大的元素，返回 1；对于非无穷大的元素，返回 0。 |

    | `isfinite(V)` | 对于 `V` 中为有限值的元素，返回 1；对于非有限值的元素，返回 0。 |

    | `isempty(A)` | 如果 `A` 是空数组，则返回 1；否则返回 0（空数组是其某个维度为 0 的数组）。 |

    | `issparse(A)` | 如果 `A` 是稀疏矩阵，则返回 1；否则返回 0。 |

    | `isreal(V)` | 如果 `V` 的所有元素都是实数，则返回 1；否则返回 0。 |

    | `isprime(V)` | 对于 `V` 中所有质数元素，返回 1；对于非质数元素，返回 0。 |

    | `islogical(V)` | 如果 `V` 是逻辑向量，则返回 1；否则返回 0。 |

    | `isnumeric(V)` | 如果 `V` 是数值向量，则返回 1；否则返回 0。 |

    | `ishold` | 如果当前图形的属性会保留到下一个图形，并且只添加新元素，则返回 1；否则返回 0。 |

    | `isieee` | 如果计算机能够执行 IEEE 标准操作，则返回 1。 |

    | `isstr(S)` | 如果 `S` 是字符串，则返回 1；否则返回 0。 |

    | `ischart(S)` | 如果 `S` 是字符串，则返回 1；否则返回 0。 |

    | `isglobal(A)` | 如果 `A` 是全局变量，则返回 1；否则返回 0。 |

    | `isletter(S)` | 如果 `S` 是字母表中的一个字母，则返回 1；否则返回 0。 |

    | `isequal(A, B)` | 如果矩阵或向量 `A` 和 `B` 相等，则返回 1；否则返回 0。 |

    | `ismember(V, W)` | 对于 `V` 中出现在 `W` 中的每个元素，返回 1；对于 `V` 中不在 `W` 中的每个元素，返回 0。 |


    以下是一些使用上述逻辑函数的示例。


    ```

    >> V = [1,2,3,4,5,6,7,8,9], isprime(V), isnumeric(V), all(V), any(V)

    V =

    1     2     3     4     5     6     7     8     9

    ans =

    0     1     1     0     1     0     1     0     0

    ans =

    1

    ans =

    1

    ans =

    1


    >> B = [Inf, -Inf, pi, NaN], isinf(B), isfinite(B), isnan(B), isreal(B)

    B =

    Inf - Inf 3.1416 NaN

    ans =

    1 1 0 0

    ans =

    0 0 1 0

    ans =

    0 0 0 1

    ans =

    1


    >> ismember ([1,2,3], [8,12,1,3]), A = [2,0,1];B = [4,0,2]; isequal (2A * B)

    ans =

    1 0 1

    ans =

    1

    ```


    ## 练习 2-1


    求从 30 个元素中无重复地选择 12 个元素的方法数、`2¹³⁴` 除以 3 的余数、18900 的质因数分解、200 的阶乘以及最小的数 `n`，使得
    `n` 分别除以 16、24、30 和 32 都余 5。


    ```

    >> factorial (30) / (factorial (12) * factorial(30-12))

    ans =

    8.6493e + 007

    ```


    使用 `vpa` 命令来显示精确结果。


    ```

    >> vpa ''factorial (30) / (factorial (12) * factorial(30-12))'' 15

    ans =

    86493225.


    >> rem(2¹³⁴,3)

    ans =

    0


    >> factor (18900)

    ans =

    2     2     3     3     3     5     5     7


    >> factorial (100)

    ans =

    9. 3326e + 157

    ```


    使用 `vpa` 命令来显示精确结果。


    ```

    >> vpa '' factorial (100)'' 160

    ans =

    93326215443944152681699238856266700490715968264381621468592963895217599993229915608941463976156518286253697920827223758251185210916864000000000000000000000000.

    ```


    `N-5` 是 16、24、30 和 32 的最小公倍数。


    ```

    >> lcm (lcm (16.24), lcm (30,32))

    ans =

    480

    ```


    那么 `N = 480 + 5 = 485`。


