    ### 其他进制


    MATLAB 允许您处理任意基数的数字，前提是安装了扩展的符号数学工具箱。它还允许您以不同进制表示各种数字。这是通过以下函数实现的：


    | `dec2base` (十进制数, n_ 进制) | 将指定的十进制数转换为新的 n_ 进制。 |

    | :--- | :--- |

    | `base2dec`(数字, b) | 将指定 b 进制数转换为十进制数。 |

    | `dec2bin` (十进制数) | 将指定的十进制数转换为 2 进制（二进制）。 |

    | `dec2hex` (十进制数) | 将指定的十进制数转换为 16 进制（十六进制）。 |

    | `bin2dec` (二进制数) | 将指定的二进制数转换为十进制。 |

    | `hex2dec` (十六进制数) | 将指定的 16 进制数转换为十进制。 |


    以下是一些示例。


    将二进制数 100101 表示成十进制。


    ```

    >> base2dec (''100101'',2)

    ans =

    37.00

    ```


    将十六进制数 FFFFAA00 表示成十进制。


    ```

    >> base2dec (''FFFFAA0'', 16)

    ans =

    268434080.00

    ```


    将十六进制运算式 FFFAA2+FF-1 的结果表示成十进制。


    ```

    >> base2dec (''FFFAA2'',16) + base2dec(''FF'',16)-1

    ans =

    16776096.00

    ```


    ### 实数


    众所周知，实数集是有理数集和无理数集的不交并。有理数是形如 p/q 的数，其中 p 和 q 是整数。换句话说，有理数是可以表示为两个整数之商的数。MATLAB
    处理有理数的方式与大多数计算器不同。如果我们要求计算器计算和式 1/2 + 1/3 + 1/4，大多数计算器会返回类似于 1.0833 的结果，这仅仅是结果的一个近似值。


    有理数是整数的比值，MATLAB 可以在精确模式下处理它们，因此涉及有理数的算术表达式的结果总是精确地以两个整数的比值形式给出。要启用此功能，请使用命令 `format
    rat` 激活有理数格式。如果读者希望如此，MATLAB 也可以通过激活任何其他格式（例如 `format short` 或 `format long`）来返回十进制形式的结果。MATLAB
    在精确模式下计算上述和式如下：


    ```

    >> format rat

    >> 1/2 + 1/3 + 1/4

    ans =

    13/12

    ```


    与计算器不同，MATLAB 通过将有理数保持为整数比值的形式，确保其运算的准确性。通过这种方式，分数的计算不会受到舍入误差的影响，而舍入误差可能会变得非常严重，如误差理论所证明的那样。请注意，一旦启用了有理数格式，当
    MATLAB 将两个有理数相加时，结果会以整数比值的符号形式返回，并且对有理数的运算将持续保持精确，直到调用另一种格式。


    如果启用了有理数格式，浮点数（或带有小数点的数字）将被解释为精确值。因此，浮点表达式将被解释为精确的有理表达式，而有理表达式中的任何无理数都将用适当的有理数近似值表示。


    ```

    >> format rat

    >> 10/23 + 2.45/44

    ans =

    1183 / 2412

    ```


    实数集的另一个基本子集是无理数集，由于其特殊性质，无理数在数值计算中一直带来困难。在数值模式下（使用十进制计数系统中的十位数字）无法精确表示无理数，这是大多数问题的根源。MATLAB
    以用户可以按要求设置的精度来表示结果。根据定义，无理数无法精确表示为两个整数的比值。如果需要计算 27 的平方根，默认情况下 MATLAB 会返回数字 5.1962。


    ```

    >> sqrt (27)

    ans =

    5.1962

    ```


    MATLAB 包含了以下常见的无理常数和概念：


    | `pi` | 圆周率 π = 3.1415926… |

    | :--- | :--- |

    | `exp (1)` | 自然常数 e = 2.7182818… |

    | `Inf` | 无穷大（例如，当遇到 1/0 时返回）。 |

    | `NaN` | 不确定值（例如，当遇到 0/0 时返回）。 |

    | `realmin` | 返回 IEEE 双精度下的最小标准化浮点数。 |

    | `realmax` | 返回 IEEE 双精度下的最大有限浮点数。 |


    以下示例说明了 MATLAB 如何输出这些数字和概念。


    ```

    >> long format

    >> pi

    ans =

    3.14159265358979


    >> exp (1)

    ans =

    2.71828182845905


    >> 1/0

    Warning: Divide by zero.

    ans =

    Inf


    >> 0/0

    Warning: Divide by zero.

    ans =

    NaN


    >> realmin

    ans =

    2.225073858507201e-308


    >> realmax

    ans =

    1.797693134862316e + 308

    ```


    ### 实参数函数


    有理数集和无理数集的不交并就是实数集。反过来，有理数集以整数集为其子集。所有适用于实数的函数也同样适用于整数和有理数。MATLAB 提供了全套预定义函数，其中的大部分将在本书后续章节中讨论。在
    MATLAB 提供的实参数函数组中，以下是最重要的几类：


    **三角函数**


    | 函数 | 反函数 |

    | :--- | :--- |

    | `sin (x)` | `asin (x)` |

    | `cos (x)` | `acos (x)` |

    | `tan(x)` | `atan(x)` 和 `atan2(y,x)` |

    | `csc (x)` | `acsc (x)` |

    | `sec (x)` | `asec (x)` |

    | `cot (x)` | `acot (x)` |


    **双曲函数**


    | 函数 | 反函数 |

    | :--- | :--- |

    | `sinh (x)` | `asinh (x)` |

    | `cosh(x)` | `acosh(x)` |

    | `tanh(x)` | `atanh(x)` |

    | `csch(x)` | `acsch(x)` |

    | `sech(x)` | `asech(x)` |

    | `coth (x)` | `acoth (x)` |


    **指数和对数函数**


    | 函数 | 含义 |

    | :--- | :--- |

    | `exp (x)` | 以 e 为底的指数函数（`e ^ x`）。 |

    | `log (x)` | x 的自然对数（以 e 为底）。 |

    | `log10 (x)` | x 的常用对数（以 10 为底）。 |

    | `log2 (x)` | x 的以 2 为底的对数。 |

    | `pow2 (x)` | 2 的 x 次幂。 |

    | `sqrt (x)` | x 的平方根。 |


    **数值变量专用函数**


    | 函数 | 含义 |

    | :--- | :--- |

    | `abs (x)` | x 的绝对值。 |

    | `floor (x)` | 小于或等于 x 的最大整数。 |

    | `ceil (x)` | 大于或等于 x 的最小整数。 |

    | `round (x)` | 最接近 x 的整数。 |

    | `fix (x)` | 去除 x 的小数部分。 |

    | `rem (a, b)` | 返回 a 除以 b 的余数。 |

    | `sign (x)` | 返回 x 的符号（如果 x > 0 返回 1，如果 x=0 返回 0，如果 x < 0 返回 -1）。 |


    以下是一些示例：


    ```

    >> sin(pi/2)

    ans =

    1


    >> asin (1)

    ans =

    1.57079632679490


    >> log (exp (1) ^ 3)

    ans =

    3.00000000000000

    ```


    下面的两个示例演示了 `round` 函数的用法：


    ```

    >> round (2.574)

    ans =

    3


    >> round (2.4)

    ans =

    2

    ```


    下面的两个示例演示了 `ceil` 函数的用法：


    ```

    >> ceil (4.2)

    ans =

    5


    >> ceil (4.8)

    ans =

    5

    ```


    下面的两个示例演示了 `floor` 函数的用法：


    ```

    >> floor (4.2)

    ans =

    4


    >> floor (4.8)

    ans =

    4

    ```


    `fix` 函数简单地去除实数的小数部分：


    ```

    >> fix (5.789)

    ans =

    5

    ```

