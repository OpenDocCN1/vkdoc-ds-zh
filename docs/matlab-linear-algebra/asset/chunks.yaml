    ### 字符变量


    字符变量（链）就是用单引号括起来的字符串，MATLAB 将其视为一种向量形式。字符变量的一般语法如下：`c = ''string''`。


    在 MATLAB 处理字符变量的命令中，我们有以下这些：


    | `abs (''character_string'')` | 返回一个 ASCII 数组，该数组与字符串中的每个字符一一对应。 |

    | --- | --- |

    | `setstr (numeric_vector)` | 返回一个 ASCII 字符串，该字符串与向量中的元素一一对应。 |

    | `str2mat (t1,t2,t3,…)` | 返回一个矩阵，其行分别是字符串 `t1`、`t2`、`t3`…… |

    | `str2num (''string'')` | 将字符串转换为其在 MATLAB 中使用的精确数值。 |

    | `num2str (number)` | 以固定精度返回该数字的等效字符串形式。 |

    | `int2str (integer)` | 将整数转换为字符串。 |

    | `sprintf (''format'', a)` | 将数值数组按指定格式转换为字符串。 |

    | `sscanf (''string'', ''format'')` | 将字符串按指定格式转换为数值。 |

    | `dec2hex (integer)` | 将十进制整数转换为十六进制格式的等效字符串。 |

    | `hex2dec (''string_hex'')` | 将十六进制字符串转换为其等效的整数。 |

    | `hex2num (''string_hex'')` | 将十六进制字符串转换为等效的 IEEE 浮点数。 |

    | `lower (''string'')` | 将字符串转换为小写。 |

    | `upper (''string'')` | 将字符串转换为大写。 |

    | `strcmp (s1, s2)` | 比较字符串 `s1` 和 `s2`，若相等则返回 1，否则返回 0。 |

    | `strcmp (s1, s2, n)` | 比较字符串 `s1` 和 `s2`，若它们的前 `n` 个字符相等则返回 1，否则返回 0。 |

    | `strrep (c, ''exp1'', ''exp2'')` | 将链 `c` 中的 `exp1` 替换为 `exp2`。 |

    | `findstr (c, ''exp'')` | 查找 `exp` 在链 `c` 中出现的位置。 |

    | `isstr (expression)` | 若表达式是字符串则返回 1，否则返回 0。 |

    | `ischar (expression)` | 若表达式是字符串则返回 1，否则返回 0。 |

    | `strjust (string)` | 将字符串右对齐。 |

    | `blanks (n)` | 生成一个包含 `n` 个空格的字符串。 |

    | `deblank (string)` | 移除字符串右侧的空格。 |

    | `eval (expression)` | 执行表达式，即使它是一个字符串。 |

    | `disp (''string'')` | 按原样显示字符串（或数组），并继续 MATLAB 进程。 |

    | `input (''string'')` | 在屏幕上显示字符串并等待按键以继续。 |


    以下是一些示例：


    ```

    >> hex2dec (''3ffe56e'')

    ans =

    67102062

    ```


    这里 MATLAB 将一个十六进制字符串转换成了一个十进制数。


    ```

    >> dec2hex (1345679001)

    ans =

    50356E99

    ```


    程序将一个十进制数转换成了一个十六进制字符串。


    ```

    >> sprintf(''%f'',[1+sqrt(5)/2,pi])

    ans =

    2.118034 3.141593

    ```


    一个向量的精确数值分量已转换为字符串（使用默认精度）。


    ```

    >> sscanf(''121.00012'', ''%f'')

    ans =

    121.0001

    ```


    这里一个数值字符串已被转换到精确的数值格式（使用默认精度）。


    ```

    >> num2str (pi)

    ans =

    3.142

    ```


    常数 π 已被转换成了一个字符串。


    ```

    >> str2num(''15/14'')

    ans =

    1.0714

    ```


    该字符串已被转换为一个具有默认精度的数值。


    ```

    >> setstr(32:126)

    ans =

    !"#$%`&`'' () * +, -. / 0123456789:; < = >? @ABCDEFGHIJKLMNOPQRSTUVWXYZ [\] ^
    _''abcdefghijklmnopqrstuvwxyz {|}∼

    ```


    这将输出与介于 32 到 126（含首尾）之间的整数相关联的 ASCII 字符。


    ```

    >> abs(''{]}><#¡¿?oa'')

    ans =

    123 93 125 62 60 35 161 191 63 186 170

    ```


    这将输出与 `abs` 参数中指定的 ASCII 字符相对应的整数。


    ```

    >> lower (''ABCDefgHIJ'')

    ans =

    abcdefghij

    ```


    文本已被转换为小写。


    ```

    >> upper(''abcd eFGHi jKlMn'')

    ans =

    ABCD EFGHI JKLMN

    ```


    文本已被转换为大写。


    ```

    >> str2mat (''The world'','' The country'','' Daily 16'', '' ABC'')

    ans =

    The world

    The country

    Daily 16

    ABC

    ```


    作为 `str2mat` 参数的各个字符串链已被转换为一个文本数组。


    ```

    >> disp(''This text will appear on the screen'')

    ans =

    This text will appear on the screen

    ```


    这里命令 `disp` 的参数已显示在屏幕上。


    ```

    >> c = ''This is a good example'';

    >> strrep(c, ''good'', ''bad'')

    ans =

    This is a bad example

    ```


    字符串 `good` 已在链 `c` 中被替换为 `bad`。以下指令定位了链 `c` 中每次出现 `is` 的起始位置。


    ```

    >> findstr (c, ''is'')

    ans =

    3 6

    ```

