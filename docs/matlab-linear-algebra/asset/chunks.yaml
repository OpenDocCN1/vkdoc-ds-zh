- fmt: "# Numerical Computation with MATLAB\n\nYou can use MATLAB as a powerful numerical\
    \ computer. While most calculators handle numbers only to a preset degree of precision,\
    \ MATLAB performs exact calculations to any desired degree of precision. In addition,\
    \ unlike calculators, we can perform operations not only with individual numbers,\
    \ but also with objects such as arrays.\n\nMost of the topics of classical numerical\
    \ analysis are treated by this software. It supports matrix calculus, statistics,\
    \ interpolation, least squares fitting, numerical integration, minimization of\
    \ functions, linear programming, numerical and algebraic solutions of differential\
    \ equations and a long list of further methods that we’ll meet as this book progresses.\n\
    \nHere are some examples of numerical calculations with MATLAB. (As we know, to\
    \ obtain the results it is necessary to press Enter once the desired command has\
    \ been entered after the prompt `>>`.)\n\nWe simply calculate `4 + 3` to obtain\
    \ the result `7`. To do this, just type `4 + 3`, and then Enter.\n\n```\n>> 4\
    \ + 3\nans =\n7\n```\n\nWe find the value of `3` to the power of `100`, without\
    \ having previously set the precision. To do this we simply enter `3 ^ 100`.\n\
    \n```\n>> 3 ^ 100\nans =\n5.1538e+047\n```\n\nWe can use the command `format long\
    \ e` to obtain results to 15 digits (floating-point).\n\n```\n>> format long e\n\
    >> 3^100\nans =\n5.153775207320115e+047\n```\n\nWe can also work with complex\
    \ numbers. We find the result of the operation raising `(2 + 3i)` to the power\
    \ `10` by typing the expression `(2 + 3i) ^ 10`.\n\n```\n>> (2 + 3i) ^ 10\nans\
    \ =\n-1.415249999999998e+005 - 1.456680000000000e+005i\n```\n\nThe previous result\
    \ is also available in short format, using the `format short` command.\n\n```\n\
    >> format short\n>> (2 + 3i)^10\nans =\n-1.4152e+005- 1.4567e+005i\n```\n\nWe\
    \ can calculate the value of the Bessel function `J[0]` at `11.5`. To do this\
    \ we type `besselj(0,11.5)`.\n\n```\n>> besselj(0,11.5)\nans =\n-0.0677\n```\n\
    \n## Symbolic Calculations with MATLAB\n\nMATLAB perfectly handles symbolic mathematical\
    \ computations, manipulating and performing operations on formulae and algebraic\
    \ expressions with ease. You can expand, factor and simplify polynomials and rational\
    \ and trigonometric expressions, find algebraic solutions of polynomial equations\
    \ and systems of equations, evaluate derivatives and integrals symbolically, find\
    \ solutions of differential equations, manipulate powers, and investigate limits\
    \ and many other features of algebraic series.\n\nTo perform these tasks, MATLAB\
    \ first requires all the variables (or algebraic expressions) to be written between\
    \ single quotes. When MATLAB receives a variable or expression in quotes, it is\
    \ interpreted as symbolic.\n\nHere are some examples of symbolic computations\
    \ with MATLAB.\n\nWe can expand the following algebraic expression: `((x + 1)(x\
    \ + 2) - (x + 2)^2)^3`. This is done by typing: `expand('((x + 1)(x + 2) - (x\
    \ + 2)^2)^3')`. The result will be another algebraic expression:\n\n```\n>> syms\
    \ x; expand(((x + 1) *(x + 2)-(x + 2) ^ 2) ^ 3)\nans =\n-x ^ 3-6 * x ^ 2-12 *\
    \ x-8\n```\n\nWe can factor the result of the calculation in the above example\
    \ by typing: `factor('((x + 1) * (x + 2) - (x + 2)^2)^3')`.\n\n```\n>> syms x;\
    \ factor(((x + 1)*(x + 2)-(x + 2)^2)^3)\nans =\n-(x + 2)^3\n```\n\nWe can find\
    \ the indefinite integral of the function `(x^2) sin(x)^2` by typing: `int('x^2\
    \ *sin(x)^ 2', 'x')`.\n\n```\n>> int('x^2*sin(x)^2', 'x')\nans =\nx ^ 2 *(-1/2\
    \ * cos(x) * sin(x) + 1/2 * x)-1/2 * x * cos(x) ^ 2 + 1/4 * cos(x) * sin(x) +\
    \ 1/4 * 1/x-3 * x ^ 3\n```\n\nWe can simplify the previous result:\n\n```\n>>\
    \ syms x; simplify(int(x^2*sin(x)^2, x))\nans =\nsin(2*x)/8 -(x*cos(2*x))/4 -(x^2*sin(2*x))/4\
    \ + x^3/6\n```\n\nWe can present the previous result using a more elegant mathematical\
    \ notation:\n\n```\n>> syms x; pretty(simplify(int(x^2*sin(x)^2, x)))\nans =\n\
    \n  sin(2 x)   x cos(2 x)   x  sin(2 x)   x\n  -------- - ---------- - -----------\
    \ + --\n     8           4             4        6\n```\n\nWe can solve the equation\
    \ `3ax - 7 x^2 + x^3 = 0` (where `a` is a parameter):\n\n```\n>> solve('3*a*x-7*x^2\
    \ + x^3 = 0', 'x')\nans =\n[                          0]\n[7/2 + 1/2 *(49-12*a)\
    \ ^(1/2)]\n[7/2-1/2 *(49-12*a) ^(1/2)]\n```\n\nOn the other hand, MATLAB can use\
    \ the Maple program libraries to work with symbolic math, and can thus extend\
    \ its field of action. In this way, MATLAB can be used to work on such topics\
    \ as differential forms, Euclidean geometry, projective geometry, statistics,\
    \ etc.\n\nAt the same time, Maple can also benefit from MATLAB's powers of numerical\
    \ calculation, which might be used, for example, in combination with the Maple\
    \ libraries (combinatorics, optimization, number theory, etc.)\n\n## Graphics\
    \ with MATLAB\n\nMATLAB can generate two- and three-dimensional graphs, as well\
    \ as contour and density plots. You can graphically represent data lists, controlling\
    \ colors, shading and other graphics features. Animated graphics are also supported.\
    \ Graphics produced by MATLAB are portable to other programs.\n\nSome examples\
    \ of MATLAB graphics are given below.\n\nWe can represent the function `xsin(1/x)`\
    \ for `x` ranging between `-π/4` and `π/4`, taking 300 equidistant points in the\
    \ interval. See Figure 1-12.\n\n```\n>> x = linspace(-pi/4,pi/4,300);\n>> y =\
    \ x.*sin(1./x);\n>> plot(x,y)\n```\n\nWe can give the above graph a title and\
    \ label the axes, and we can add a grid. See Figure 1-13.\n\n![A978-1-4842-0322-4_1_Fig12_HTML.jpg](A978-1-4842-0322-4_1_Fig12_HTML.jpg)\n\
    \nFigure 1-12.\n\n```\n>> x = linspace(-pi/4,pi/4,300);\n>> y = x.*sin(1./x);\n\
    >> plot(x,y);\n>> grid;\n>> xlabel('Independent variable X');\n>> ylabel('Dependent\
    \ variable Y');\n>> title('The function y=xsin(1/x)')\n```\n\nFigure 1-13.\n\n\
    We can generate a graph of the surface defined by the function `z = sin(sqrt(x^2\
    \ + y^2)) / sqrt(x^2 + y^2)`, where `x` and `y` vary over the interval `(-7.5,\
    \ 7.5)`, taking equally spaced points 0.5 apart. See Figure 1-14.\n\n![A978-1-4842-0322-4_1_Fig13_HTML.jpg](A978-1-4842-0322-4_1_Fig13_HTML.jpg)\n\
    \nFigure 1-13.\n\n```\n>> x = -7.5:.5:7.5;\n>> y = x;\n>> [X, Y] = meshgrid(x,y);\n\
    >> Z = sin(sqrt(X.^2+Y.^2))./sqrt(X.^2+Y.^2);\n>> surf(X, Y, Z)\n```\n\n![A978-1-4842-0322-4_1_Fig14_HTML.jpg](A978-1-4842-0322-4_1_Fig14_HTML.jpg)\n\
    \nFigure 1-14.\n\nThese 3D graphics allow you to get a clear picture of figures\
    \ in space, and are very helpful in visually identifying intersections between\
    \ different bodies, and in generating all kinds of space curves, surfaces and\
    \ volumes of revolution.\n\nWe can generate the three dimensional graph corresponding\
    \ to the helix with parametric coordinates: `x = sin(t)`, `y = cos(t)`, `z = t`.\
    \ See Figure 1-15.\n\n```\n>> t = 0:pi/50:10*pi;\n>> plot3(sin(t),cos(t),t)\n\
    ```\n\n![A978-1-4842-0322-4_1_Fig15_HTML.jpg](A978-1-4842-0322-4_1_Fig15_HTML.jpg)\n\
    \nFigure 1-15.\n\nWe can represent a planar curve given by its polar coordinates\
    \ `r = cos(2t) * sin(2t)` for `t` varying in the range between `0` and `π` by\
    \ equally spaced points 0.01 apart. See Figure 1-16.\n\n```\n>> t = 0:.1:2 * pi;\n\
    >> r = sin(2*t).* cos(2*t);\n>> polar(t,r)\n```\n\n![A978-1-4842-0322-4_1_Fig16_HTML.jpg](A978-1-4842-0322-4_1_Fig16_HTML.jpg)\n\
    \nFigure 1-16.\n\nWe can make a graph of a symbolic function using the command\
    \ `ezplot`. See Figure 1-17.\n\n```\n>> y = 'x^3/(x^2-1)';\n>> ezplot(y,[-5,5])\n\
    ```\n\n![A978-1-4842-0322-4_1_Fig17_HTML.jpg](A978-1-4842-0322-4_1_Fig17_HTML.jpg)\n\
    \nFigure 1-17.\n\nWe will go into these concepts in more detail in the chapter\
    \ on graphics."
  raw: '## Numerical Computation with MATLAB


    You can use MATLAB as a powerful numerical computer. While most calculators handle
    numbers only to a preset degree of precision, MATLAB performs exact calculations
    to any desired degree of precision. In addition, unlike calculators, we can perform
    operations not only with individual numbers, but also with objects such as arrays.


    Most of the topics of classical numerical analysis are treated by this software.
    It supports matrix calculus, statistics, interpolation, least squares fitting,
    numerical integration, minimization of functions, linear programming, numerical
    and algebraic solutions of differential equations and a long list of further methods
    that we’ll meet as this book progresses.


    Here are some examples of numerical calculations with MATLAB. (As we know, to
    obtain the results it is necessary to press Enter once the desired command has
    been entered after the prompt “>>”.)


    We simply calculate 4 + 3 to obtain the result 7\. To do this, just type 4 + 3,
    and then Enter.


    `>> 4 + 3`


    `ans =`


    `7`


    We find the value of 3 to the power of 100, without having previously set the
    precision. To do this we simply enter 3 ^ 100.


    `>> 3 ^ 100`


    `ans =`


    `5\. 1538e + 047`


    We can use the command “format long e” to obtain results to 15 digits (floating-point).


    `>> format long e`


    `>> 3^100`


    `ans =`


    `5.153775207320115e+047`


    We can also work with complex numbers. We find the result of the operation raising
    (2 + 3i) to the power 10 by typing the expression (2 + 3i) ^ 10.


    `>> (2 + 3i) ^ 10`


    `ans =`


    `-1 415249999999998e + 005 - 1\. 456680000000000e + 005i`


    The previous result is also available in short format, using the “format short”
    command.


    `>> format short`


    `>> (2 + 3i)^10`


    `ans =`


    `-1.4152e+005- 1.4567e+005i`


    We can calculate the value of the Bessel function J [0] at 11.5\. To do this we
    type besselj(0,11.5).


    `>> besselj(0,11.5)`


    `ans =`


       `-0.0677`


    ## Symbolic Calculations with MATLAB


    MATLAB perfectly handles symbolic mathematical computations, manipulating and
    performing operations on formulae and algebraic expressions with ease. You can
    expand, factor and simplify polynomials and rational and trigonometric expressions,
    find algebraic solutions of polynomial equations and systems of equations, evaluate
    derivatives and integrals symbolically, find solutions of differential equations,
    manipulate powers, and investigate limits and many other features of algebraic
    series.


    To perform these tasks, MATLAB first requires all the variables (or algebraic
    expressions) to be written between single quotes. When MATLAB receives a variable
    or expression in quotes, it is interpreted as symbolic.


    Here are some examples of symbolic computations with MATLAB.


    We can expand the following algebraic expression: ((x + 1)(x + 2) - (x + 2)^2)^3\.
    This is done by typing: expand(‘((x + 1)(x + 2) - (x + 2)^2)^3’). The result will
    be another algebraic expression:  


    `>> syms x; expand(((x + 1) *(x + 2)-(x + 2) ^ 2) ^ 3)`


    `ans =`


    `-x ^ 3-6 * x ^ 2-12 * x-8`


    We can factor the result of the calculation in the above example by typing: factor(‘((x
    + 1) * (x + 2) - (x + 2)^2)^3’)  


    `>> syms x; factor(((x + 1)*(x + 2)-(x + 2)^2)^3)`


    `ans =`


    `-(x + 2)^3`


    We can find the indefinite integral of the function (x^2) sin(x)^2 by typing:
    int(‘x^2 *sin(x)^ 2’, ‘x’)  


    `>> int(''x^2*sin(x)^2'', ''x'')`


    `ans =`


    `x ^ 2 *(-1/2 * cos(x) * sin(x) + 1/2 * x)-1/2 * x * cos(x) ^ 2 + 1/4 * cos(x)
    * sin(x) + 1/4 * 1/x-3 * x ^ 3`


    We can simplify the previous result:  


    `>> syms x; simplify(int(x^2*sin(x)^2, x))`


    `ans =`


    `sin(2*x)/8 -(x*cos(2*x))/4 -(x^2*sin(2*x))/4 + x^3/6`


    We can present the previous result using a more elegant mathematical notation:
     


    `>> syms x; pretty(simplify(int(x^2*sin(x)^2, x)))`


    `ans =`


                               `2             3`


      `sin(2 x)   x cos(2 x)   x  sin(2 x)   x`


      `-------- - ---------- - ----------- + --`


         `8           4             4        6`


    We can solve the equation 3ax - 7 x^2 + x^3 = 0 (where a is a parameter):  


    `>> solve(''3*a*x-7*x^2 + x^3 = 0'', ''x'')`


    `ans =`


    `[                          0]`


    `[7/2 + 1/2 *(49-12*a) ^(1/2)]`


    `[7/2-1/2 *(49-12*a) ^(1/2)]`


    On the other hand, MATLAB can use the Maple program libraries to work with symbolic
    math, and can thus extend its field of action. In this way, MATLAB can be used
    to work on such topics as differential forms, Euclidean geometry, projective geometry,
    statistics, etc.


    At the same time, Maple can also benefit from MATLAB’s powers of numerical calculation,
    which might be used, for example, in combination with the Maple libraries (combinatorics,
    optimization, number theory, etc.)


    ## Graphics with MATLAB


    MATLAB can generate two- and three-dimensional graphs, as well as contour and
    density plots. You can graphically represent data lists, controlling colors, shading
    and other graphics features. Animated graphics are also supported. Graphics produced
    by MATLAB are portable to other programs.


    Some examples of MATLAB graphics are given below.


    We can represent the function xsin(1/x) for x ranging between -π/4 and π/4, taking
    300 equidistant points in the interval. See Figure [1-12](#A978-1-4842-0322-4_1_Chapter.html#Fig12).
     


    `>> x = linspace(-pi/4,pi/4,300);`


    `>> y = x.*sin(1./x);`


    `>> plot(x,y)`


    We can give the above graph a title and label the axes, and we can add a grid.
    See Figure [1-13](#A978-1-4842-0322-4_1_Chapter.html#Fig13).  


    ![A978-1-4842-0322-4_1_Fig12_HTML.jpg](A978-1-4842-0322-4_1_Fig12_HTML.jpg)


    Figure 1-12.


    Figure 1-12.


    `>> x = linspace(-pi/4,pi/4,300);`


    `>> y = x.*sin(1./x);`


    `>> plot(x,y);`


    `>> grid;`


    `>> xlabel(''Independent variable X'');`


    `>> ylabel(''Dependent variable Y'');`


    `>> title(''The function y=xsin(1/x)'')`


    We can generate a graph of the surface defined by the function z = sin(sqrt(x^2
    + y^2)) /sqrt(x^2 + y^2), where x and y vary over the interval (-7.5, 7.5), taking
    equally spaced points 0.5 apart. See Figure [1-14](#A978-1-4842-0322-4_1_Chapter.html#Fig14).
     


    ![A978-1-4842-0322-4_1_Fig13_HTML.jpg](A978-1-4842-0322-4_1_Fig13_HTML.jpg)


    Figure 1-13.


    Figure 1-13.


    `>> x = -7.5:. 5:7.5;`


    `>> y = x;`


    `>> [X, Y] = meshgrid(x,y);`


    `>> Z = sin(sqrt(X.^2+Y.^2))./sqrt(X.^2+Y.^2);`


    `>> surf(X, Y, Z)`


    ![A978-1-4842-0322-4_1_Fig14_HTML.jpg](A978-1-4842-0322-4_1_Fig14_HTML.jpg)


    Figure 1-14.


    Figure 1-14.


    These 3D graphics allow you to get a clear picture of figures in space, and are
    very helpful in visually identifying intersections between different bodies, and
    in generating all kinds of space curves, surfaces and volumes of revolution.


    We can generate the three dimensional graph corresponding to the helix with parametric
    coordinates: x = sin(t), y = cos(t), z = t. See Figure [1-15](#A978-1-4842-0322-4_1_Chapter.html#Fig15).
     


    `>> t = 0:pi/50:10*pi;`


    `>> plot3(sin(t),cos(t),t)`


    We can represent a planar curve given by its polar coordinates r = cos(2t) * sin(2t)
    for t varying in the range between 0 and π by equally spaced points 0.01 apart.
    See Figure [1-16](#A978-1-4842-0322-4_1_Chapter.html#Fig16).  


    ![A978-1-4842-0322-4_1_Fig15_HTML.jpg](A978-1-4842-0322-4_1_Fig15_HTML.jpg)


    Figure 1-15.


    Figure 1-15.


    `>> t = 0:. 1:2 * pi;`


    `>> r = sin(2*t). * cos(2*t);`


    `>> polar(t,r)`


    We can make a graph of a symbolic function using the command “ezplot”. See Figure
    [1-17](#A978-1-4842-0322-4_1_Chapter.html#Fig17).  


    ![A978-1-4842-0322-4_1_Fig16_HTML.jpg](A978-1-4842-0322-4_1_Fig16_HTML.jpg)


    Figure 1-16.


    Figure 1-16.


    `>> y = ''x^3/(x^2-1)'';`


    `>> ezplot(y,[-5,5])`


    ![A978-1-4842-0322-4_1_Fig17_HTML.jpg](A978-1-4842-0322-4_1_Fig17_HTML.jpg)


    Figure 1-17.


    Figure 1-17.


    We will go into these concepts in more detail in the chapter on graphics.'
  trans: "\n# 使用 MATLAB 进行数值计算\n\n您可以将 MATLAB 用作强大的数值计算机。虽然大多数计算器只能处理预设精度的数字，但 MATLAB\
    \ 可以执行任何所需精度的精确计算。此外，与计算器不同，我们不仅可以用单个数字执行运算，还可以用数组等对象执行运算。\n\n该软件处理经典数值分析的大多数主题。它支持矩阵计算、统计学、插值、最小二乘拟合、数值积分、函数最小化、线性规划、微分方程的数值解和代数解，以及随着本书内容的深入我们将遇到的一系列其他方法。\n\
    \n以下是一些使用 MATLAB 进行数值计算的示例。（我们知道，要在提示符 `>>` 后输入所需命令后，必须按 Enter 键才能获得结果。）\n\n我们简单地计算\
    \ `4 + 3` 得到结果 `7`。为此，只需输入 `4 + 3`，然后按 Enter。\n\n```\n>> 4 + 3\nans =\n7\n```\n\
    \n我们计算 `3` 的 `100` 次幂的值，无需事先设置精度。为此，我们只需输入 `3 ^ 100`。\n\n```\n>> 3 ^ 100\nans\
    \ =\n5.1538e+047\n```\n\n我们可以使用命令 `format long e` 来获得 15 位（浮点）精度的结果。\n\n```\n\
    >> format long e\n>> 3¹⁰⁰\nans =\n5.153775207320115e+047\n```\n\n我们也可以处理复数。我们通过输入表达式\
    \ `(2 + 3i) ^ 10`，来计算 `(2 + 3i)` 的 `10` 次幂的运算结果。\n\n```\n>> (2 + 3i) ^ 10\nans\
    \ =\n-1.415249999999998e+005 - 1.456680000000000e+005i\n```\n\n前面的结果也可以使用 `format\
    \ short` 命令以短格式显示。\n\n```\n>> format short\n>> (2 + 3i)¹⁰\nans =\n-1.4152e+005-\
    \ 1.4567e+005i\n```\n\n我们可以计算贝塞尔函数 `J[0]` 在 `11.5` 处的值。为此，我们输入 `besselj(0,11.5)`。\n\
    \n```\n>> besselj(0,11.5)\nans =\n-0.0677\n```\n\n## 使用 MATLAB 进行符号计算\n\nMATLAB\
    \ 完美地处理符号数学计算，能够轻松地操作和计算公式与代数表达式。您可以展开、分解和简化多项式、有理式和三角表达式，找到多项式方程和方程组的代数解，对导数和积分进行符号求值，找到微分方程的解，处理幂运算，并研究极限以及代数级数的许多其他特性。\n\
    \n要执行这些任务，MATLAB 首先要求所有变量（或代数表达式）都写在单引号之间。当 MATLAB 接收到引号内的变量或表达式时，它会被解释为符号。\n\n\
    以下是一些使用 MATLAB 进行符号计算的示例。\n\n我们可以展开以下代数表达式：`((x + 1)(x + 2) - (x + 2)²)³`。这通过输入：`expand('((x\
    \ + 1)(x + 2) - (x + 2)²)³')` 来完成。结果将是另一个代数表达式：\n\n```\n>> syms x; expand(((x\
    \ + 1) *(x + 2)-(x + 2) ^ 2) ^ 3)\nans =\n-x ^ 3-6 * x ^ 2-12 * x-8\n```\n\n我们可以通过输入：`factor('((x\
    \ + 1) * (x + 2) - (x + 2)²)³')` 来分解上面示例计算结果。\n\n```\n>> syms x; factor(((x +\
    \ 1)*(x + 2)-(x + 2)²)³)\nans =\n-(x + 2)³\n```\n\n我们可以通过输入：`int('x² *sin(x)^\
    \ 2', 'x')` 来求函数 `(x²) sin(x)²` 的不定积分。\n\n```\n>> int('x²*sin(x)²', 'x')\nans\
    \ =\nx ^ 2 *(-1/2 * cos(x) * sin(x) + 1/2 * x)-1/2 * x * cos(x) ^ 2 + 1/4 * cos(x)\
    \ * sin(x) + 1/4 * 1/x-3 * x ^ 3\n```\n\n我们可以简化之前的结果：\n\n```\n>> syms x; simplify(int(x²*sin(x)²,\
    \ x))\nans =\nsin(2*x)/8 -(x*cos(2*x))/4 -(x²*sin(2*x))/4 + x³/6\n```\n\n我们可以使用更优雅的数学符号表示之前的结果：\n\
    \n```\n>> syms x; pretty(simplify(int(x²*sin(x)², x)))\nans =\n\n  sin(2 x)  \
    \ x cos(2 x)   x  sin(2 x)   x\n  -------- - ---------- - ----------- + --\n \
    \    8           4             4        6\n```\n\n我们可以求解方程 `3ax - 7 x² + x³ =\
    \ 0`（其中 `a` 是参数）：\n\n```\n>> solve('3*a*x-7*x² + x³ = 0', 'x')\nans =\n[     \
    \                     0]\n[7/2 + 1/2 *(49-12*a) ^(1/2)]\n[7/2-1/2 *(49-12*a) ^(1/2)]\n\
    ```\n\n另一方面，MATLAB 可以使用 Maple 程序库来处理符号数学，从而扩展其作用域。通过这种方式，MATLAB 可用于处理诸如微分形式、欧几里得几何、射影几何、统计学等主题。\n\
    \n同时，Maple 也可以利用 MATLAB 的数值计算能力，例如，可以与 Maple 库（组合学、优化、数论等）结合使用。\n\n## 使用 MATLAB\
    \ 绘图\n\nMATLAB 可以生成二维和三维图形，以及等高线和密度图。您可以图形化地表示数据列表，控制颜色、阴影和其他图形特性。同时也支持动画图形。MATLAB\
    \ 生成的图形可以移植到其他程序。\n\n下面给出了一些 MATLAB 绘图的示例。\n\n我们可以表示函数 `xsin(1/x)`，其中 `x` 的范围在\
    \ `-π/4` 和 `π/4` 之间，在该区间内取 300 个等分点。见图 1-12。\n\n```\n>> x = linspace(-pi/4,pi/4,300);\n\
    >> y = x.*sin(1./x);\n>> plot(x,y)\n```\n\n我们可以为上面的图形添加标题和轴标签，也可以添加网格。见图 1-13。\n\
    \n![A978-1-4842-0322-4_1_Fig12_HTML.jpg](img/A978-1-4842-0322-4_1_Fig12_HTML.jpg)\n\
    \n图 1-12.\n\n```\n>> x = linspace(-pi/4,pi/4,300);\n>> y = x.*sin(1./x);\n>> plot(x,y);\n\
    >> grid;\n>> xlabel('自变量 X');\n>> ylabel('因变量 Y');\n>> title('函数 y=xsin(1/x)')\n\
    ```\n\n图 1-13.\n\n我们可以生成由函数 `z = sin(sqrt(x² + y²)) / sqrt(x² + y²)` 定义的曲面图，其中\
    \ `x` 和 `y` 在区间 `(-7.5, 7.5)` 内变化，取间隔为 0.5 的等分点。见图 1-14。\n\n![A978-1-4842-0322-4_1_Fig13_HTML.jpg](img/A978-1-4842-0322-4_1_Fig13_HTML.jpg)\n\
    \n图 1-13.\n\n```\n>> x = -7.5:.5:7.5;\n>> y = x;\n>> [X, Y] = meshgrid(x,y);\n\
    >> Z = sin(sqrt(X.²+Y.²))./sqrt(X.²+Y.²);\n>> surf(X, Y, Z)\n```\n\n![A978-1-4842-0322-4_1_Fig14_HTML.jpg](img/A978-1-4842-0322-4_1_Fig14_HTML.jpg)\n\
    \n图 1-14.\n\n这些 3D 图形使您能够清晰地了解空间中的图形，并且在视觉上识别不同体之间的相交，以及生成各种空间曲线、曲面和旋转体方面非常有帮助。\n\
    \n我们可以生成参数坐标为：`x = sin(t)`，`y = cos(t)`，`z = t` 的螺旋线对应的三维图形。见图 1-15。\n\n```\n\
    >> t = 0:pi/50:10*pi;\n>> plot3(sin(t),cos(t),t)\n```\n\n![A978-1-4842-0322-4_1_Fig15_HTML.jpg](img/A978-1-4842-0322-4_1_Fig15_HTML.jpg)\n\
    \n图 1-15.\n\n我们可以表示由其极坐标 `r = cos(2t) * sin(2t)` 给出的平面曲线，其中 `t` 在 `0` 到 `π` 之间变化，取间隔为\
    \ 0.01 的等分点。见图 1-16。\n\n```\n>> t = 0:.1:2 * pi;\n>> r = sin(2*t).* cos(2*t);\n\
    >> polar(t,r)\n```\n\n![A978-1-4842-0322-4_1_Fig16_HTML.jpg](img/A978-1-4842-0322-4_1_Fig16_HTML.jpg)\n\
    \n图 1-16.\n\n我们可以使用命令 `ezplot` 绘制符号函数的图形。见图 1-17。\n\n```\n>> y = 'x³/(x²-1)';\n\
    >> ezplot(y,[-5,5])\n```\n\n![A978-1-4842-0322-4_1_Fig17_HTML.jpg](img/A978-1-4842-0322-4_1_Fig17_HTML.jpg)\n\
    \n图 1-17.\n\n我们将在关于绘图的章节中更详细地讨论这些概念。\n"
- fmt: "# General Notation\n\nAs for any program, the best way to learn MATLAB is\
    \ to use it. By practicing on examples you become familiar with the syntax and\
    \ notation peculiar to MATLAB. Each example we give consists of the header with\
    \ the user input prompt `>>` followed by the MATLAB response on the next line.\
    \ See Figure [1-18](#A978-1-4842-0322-4_1_Chapter.html#Fig18).\n\n![A978-1-4842-0322-4_1_Fig18_HTML.jpg](A978-1-4842-0322-4_1_Fig18_HTML.jpg)\n\
    \nFigure 1-18.\n\nAt other times, depending on the type of entry (user input)\
    \ given to MATLAB, the response is returned using the expression `ans =`. See\
    \ Figure [1-19](#A978-1-4842-0322-4_1_Chapter.html#Fig19).\n\n![A978-1-4842-0322-4_1_Fig19_HTML.jpg](A978-1-4842-0322-4_1_Fig19_HTML.jpg)\n\
    \nFigure 1-19.\n\nIt is important to pay attention to the use of uppercase versus\
    \ lowercase letters, parentheses versus square brackets, spaces and punctuation\
    \ (particularly commas and semicolons).\n\n## Help with Commands\n\nWe have already\
    \ seen how you can get help using MATLAB's drop down menus. But, in addition,\
    \ support can also be obtained via commands (instructions or functions), implemented\
    \ as MATLAB objects. You can use the `help` command to get immediate access to\
    \ diverse information.\n\n```\n>> help\n\nHELP topics:\n\nmatlab\\general    \
    \   -  General purpose commands.\nmatlab\\ops           -  Operators and special\
    \ characters.\nmatlab\\lang          -  Programming language constructs.\nmatlab\\\
    elmat         -  Elementary matrices and matrix manipulation.\nmatlab\\elfun \
    \        -  Elementary math functions.\nmatlab\\specfun       -  Specialized math\
    \ functions.\nmatlab\\matfun        -  Matrix functions - numerical linear algebra.\n\
    matlab\\datafun       -  Data analysis and Fourier transforms.\nmatlab\\polyfun\
    \       -  Interpolation and polynomials.\nmatlab\\funfun        -  Function functions\
    \ and ODE solvers.\nmatlab\\sparfun       -  Sparse matrices.\nmatlab\\graph2d\
    \       -  Two dimensional graphs.\nmatlab\\graph3d       -  Three dimensional\
    \ graphs.\nmatlab\\specgraph     -  Specialized graphs.\nmatlab\\graphics    \
    \  -  Handle Graphics.\nmatlab\\uitools       -  Graphical user interface tools.\n\
    matlab\\strfun        -  Character strings.\nmatlab\\iofun         -  File input/output.\n\
    matlab\\timefun       -  Time and dates.\nmatlab\\datatypes     -  Data types\
    \ and structures.\nmatlab\\winfun        -  Windows Operating System Interface\
    \ Files(DDE/ActiveX)\nmatlab\\demos         -  Examples and demonstrations.\n\
    toolbox\\symbolic     -  Symbolic Math Toolbox.\ntoolbox\\tour         -  MATLAB\
    \ Tour\ntoolbox\\local        -  Preferences.\n\nFor more help on directory/topic,\
    \ type \"help topic\".\n```\n\nAs we can see, the `help` command displays a list\
    \ of program directories and their contents. Help on any given topic topic can\
    \ be displayed using the command `help topic`. For example:\n\n```\n>> help inv\n\
    \nINV    Matrix inverse.\nINV(X) is the inverse of the square matrix X.\nA warning\
    \ message is printed if X is badly scaled or\nnearly singular.\nSee also SLASH,\
    \ PINV, COND, CONDEST, NNLS, LSCOV.\nOverloaded methods\nhelp sym/inv.m\n```\n\
    \n```\n>> help matlab\\elfun\n\nElementary math functions.\nTrigonometric.\nsin\
    \         - Sine.\nsinh        - Hyperbolic sine.\nasin        - Inverse sine.\n\
    asinh       - Inverse hyperbolic sine.\ncos         - Cosine.\ncosh        - Hyperbolic\
    \ cosine.\nacos        - Inverse cosine.\nacosh       - Inverse hyperbolic cosine.\n\
    tan         - Tangent.\ntanh        - Hyperbolic tangent.\natan        - Inverse\
    \ tangent.\natan2       - Four quadrant inverse tangent.\natanh       - Inverse\
    \ hyperbolic tangent.\nsec         - Secant.\nsech        - Hyperbolic secant.\n\
    asec        - Inverse secant.\nasech       - Inverse hyperbolic secant.\ncsc \
    \        - Cosecant.\ncsch        - Hyperbolic cosecant.\nacsc        - Inverse\
    \ cosecant.\nacsch       - Inverse hyperbolic cosecant.\ncot         - Cotangent.\n\
    coth        - Hyperbolic cotangent.\nacot        - Inverse cotangent.\nacoth \
    \      - Inverse hyperbolic cotangent.\n\nExponential.\nexp         - Exponential.\n\
    log         - Natural logarithm.\nlog10       - Common(base 10) logarithm.\nlog2\
    \        - Base 2 logarithm and dissect floating point number.\npow2        -\
    \ Base 2 power and scale floating point number.\nsqrt        - Square root.\n\
    nextpow2    - Next higher power of 2.\n\nComplex.\nabs         - Absolute value.\n\
    angle       - Phase angle.\nconj        - Complex conjugate.\nimag        - Complex\
    \ imaginary part.\nreal        - Complex real part.\nunwrap      - Unwrap phase\
    \ angle.\nisreal      - True for real array.\ncplxpair    - Sort numbers into\
    \ complex conjugate pairs.\n\nRounding and remainder.\nfix         - Round towards\
    \ zero.\nfloor       - Round towards minus infinity.\nceil        - Round towards\
    \ plus infinity.\nround       - Round towards nearest integer.\nmod         -\
    \ Modulus(signed remainder after division).\nrem         - Remainder after division.\n\
    sign        - Signum.\n```\n\nThere is a command for help on a certain sequence\
    \ of characters (`lookfor string`) which allows you to find all those functions\
    \ or commands that contain or refer to the given string string. This command is\
    \ very useful when there is no direct support for the specified string, or if\
    \ you want to view the help for all commands related to the given sequence. For\
    \ example, if we seek help for all commands that contain the sequence complex,\
    \ we can use the `lookfor complex` command to see which commands MATLAB provides.\n\
    \n```\n>> lookfor complex\n\nctranspose.m: %'   Complex conjugate transpose.\n\
    CONJ   Complex conjugate.\nCPLXPAIR Sort numbers into complex conjugate pairs.\n\
    IMAG   Complex imaginary part.\nREAL   Complex real part.\nCDF2RDF Complex diagonal\
    \ form to real block diagonal form.\nRSF2CSF Real block diagonal form to complex\
    \ diagonal form.\nB5ODE  Stiff problem, linear with complex eigenvalues(B5 of\
    \ EHL).\nCPLXDEMO Maps of functions of a complex variable.\nCPLXGRID Polar coordinate\
    \ complex grid.\nCPLXMAP Plot a function of a complex variable.\nGRAFCPLX Demonstrates\
    \ complex function plots in MATLAB.\nctranspose.m: %TRANSPOSE Symbolic matrix\
    \ complex conjugate transpose.\nSMOKE  Complex matrix with a \"smoke ring\" pseudospectrum.\n\
    ```\n\n## MATLAB and Programming\n\nBy properly combining all the objects defined\
    \ in MATLAB, according to the rules of syntax of the program, you can build useful\
    \ mathematical programming code. Programs usually consist of a series of instructions\
    \ in which values are calculated, are assigned names and are reused in further\
    \ calculations.\n\nAs in programming languages like C or FORTRAN, in MATLAB you\
    \ can write programs with loops, control flow and conditionals. MATLAB can write\
    \ procedural programs, i.e., it can define a sequence of standard steps to run.\
    \ As in C or Pascal, a `Do`, `For`, or `While` loop can be used for repetitive\
    \ calculations. The language of MATLAB also includes conditional constructs such\
    \ as `If--Then--Else`. MATLAB also supports different logical operators, such\
    \ as `AND`, `OR`, `NOT` and `XOR`.\n\nMATLAB supports procedural programming (with\
    \ iterative processes, recursive functions, loops, etc.), functional programming\
    \ and object-oriented programming. Here are two simple examples of programs. The\
    \ first generates the Hilbert matrix of order n, and the second calculates all\
    \ the Fibonacci numbers less than 1000.\n\n```\n% Generating the Hilbert matrix\
    \ of order n\nt = '1/(i+j-1)';\nfor i = 1:n\n    for j = 1:n\n        a(i,j) =\
    \ eval(t);\n    end\nend\n\n% Calculating the Fibonacci numbers\nf = [1 1]; i\
    \ = 1;\nwhile f(i) + f(i-1) < 1000\n    f(i+2) = f(i) + f(i+1);\n    i = i+1\n\
    end\n```"
  raw: '## General Notation


