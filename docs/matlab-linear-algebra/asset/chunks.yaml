    examples you become familiar with the syntax and notation peculiar to MATLAB.
    Each example we give consists of the header with the user input prompt “>>” followed
    by the MATLAB response on the next line. See Figure [1-18](#A978-1-4842-0322-4_1_Chapter.html#Fig18).


    ![A978-1-4842-0322-4_1_Fig18_HTML.jpg](A978-1-4842-0322-4_1_Fig18_HTML.jpg)


