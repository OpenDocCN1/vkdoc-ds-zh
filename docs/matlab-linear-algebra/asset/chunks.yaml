- fmt: '# Three-dimensional (3D) Curves


    MATLAB includes commands that allow you to plot space curves in three dimensions.
    The following table presents the most important commands.


    | `plot3(X, Y, Z)` | Draws a 3D line plot by joining the sequence of points determined
    by (X, Y, Z) by lines, where X, Y and Z are row vectors. X, Y and Z can also be
    parametric coordinates or matrices of the same size, in which case a graph is
    made for each triplet of rows, on the same axes. For complex values of X, Y and
    Z, the imaginary parts are ignored. `>> X = [0 1 1 2; 1 1 2 2; 0 0 1 1];` `Y =
    [1 1 1 1; 1 0 1 0; 0 0 0 0];` `Z = [1 1 1 1; 1 0 1 0; 0 0 0 0];` `>> plot3 (X,
    Y, Z)` ![A978-1-4842-0322-4_3_Figaj_HTML.jpg](A978-1-4842-0322-4_3_Figaj_HTML.jpg)
    `>> t = 0:pi/100:20 * pi; plot3 (2 * sin(2*t), 2 * cos(2*t), 4 * t)` ![A978-1-4842-0322-4_3_Figak_HTML.jpg](A978-1-4842-0322-4_3_Figak_HTML.jpg)
    |

    | `plot3(X, Y, Z, S)` | Produces the line plot `plot(X,Y,Z)` with the settings
    defined in S. S usually consists of two characters between single quotes, the
    first of which sets the color of the line graph and the second determines the
    line or marker properties. The possible settings have already been described above
    for the `plot` command. |

    | `plot3(X1,Y1,Z1,S1, X2,Y2,Z2,S2,X3, Y3, Z3, S3,…)` | Combines 3D line plots
    for the quadruples (Xi, Yi, Zi, Si) on the same axes. This is a useful way of
    representing various functions on the same graph. |

    | `fill3(X,Y,Z,C)` | Draws the filled polygon whose vertices are given by the
    triples of components (Xi, Yi, Zi) of the column vectors X, Y and Z. C is a vector
    of the same size as X, Y and Z, which specifies the colour Ci at each vertex (Xi,
    Yi, Zi)). The Ci values can be `''r''`, `''g''`, `''b''`, `''c''`, `''m''`, `''y''`,
    `''w''`, `''k''`, whose meanings we already know. If C is a single character,
    all vertices will be given this color. If X, Y and Z are matrices of the same
    size, several polygons corresponding to each triplet column vector (X.j, Y.j,
    Z.j) will be drawn. In this case, C can be a row vector of elements Cj determining
    the unique color of each polygon corresponding to (X.j, Y.j, Z.j). C can also
    be a matrix of the same dimension as X, Y and Z, in which case its elements determine
    the colors of each vertex (Xijk, Yijk, Zijk) of the set of polygons. `>> X = [0
    1 1 2; 1 1 2 2; 0 0 1 1];` `Y = [1 1 1 1; 1 0 1 0; 0 0 0 0];` `Z = [1 1 1 1; 1
    0 1 0; 0 0 0 0];` `C = [0.5000 1.0000 1.0000 0.5000;` `1.0000 0.5000 0.5000 0.1667;`
    `0.3330 0.3330 0.5000 0.5000];` `fill3(X,Y,Z,C)` ![A978-1-4842-0322-4_3_Figal_HTML.jpg](A978-1-4842-0322-4_3_Figal_HTML.jpg)
    |

    | `fill3(X1,Y1,Z1,C1, X2, Y2, Z2, C2,…)` | Draws the filled polygon whose vertices
    and colors are given by (Xi, Yi, Zi, Ci). |

    | `ezplot3(x(t), y(t), z(t))` `ezplot3(x(t),y(t),z(t), [tmin,tmax])` | Draws the
    space curve defined by the given three parametric components. Draws the space
    curve defined by the given three parametric components for the specified range
    of variation of the parameter. `>> ezplot3 (''sin (t)'', ''cos (t)'', '', [0,
    6 * pi])` ![A978-1-4842-0322-4_3_Figam_HTML.jpg](A978-1-4842-0322-4_3_Figam_HTML.jpg)
