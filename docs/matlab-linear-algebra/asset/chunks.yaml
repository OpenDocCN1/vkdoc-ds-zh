    a density plot. `>> [X, Y] = meshgrid(-2:.2:2,-2:.2:2);` `Z = X. * exp(-X.^2-Y.^2);
    meshc (X, Y, Z)` `>> pcolor (X, Y, Z)` ![A978-1-4842-0322-4_3_Figax_HTML.jpg](A978-1-4842-0322-4_3_Figax_HTML.jpg)
    |

    | trimesh(Tri, X, Y, Z, C) | Creates a triangular mesh plot. Each row of the matrix
    Tri defines a simple triangular face and C defines colors as in surf. The C argument
    is optional. |

    | trisurf(Tri,X,Y,Z,C) | Creates a triangular surface plot. Each row of the matrix
    Tri defines a simple triangular face and C defines colors as in surf. The C argument
    is optional. |


    ## Three-dimensional Geometric Forms


    The representation of cylinders, spheres, bars, sections, stems, waterfall charts
    and other three-dimensional geometric objects is possible with MATLAB. The following
    table summarizes the commands that can be used for this purpose.'
  trans: '

    | `[X, Y] = meshgrid(x, y)` | 通过将单调递增的网格向量 `x` 和 `y` 变换为指定整个网格的两个矩阵 `X` 和 `Y`，创建一个矩形网格。此类网格可用于命令
    `surf` 和 `mesh` 来生成曲面图形。 |

    | `surf(X, Y, Z, C)` | 使用 `C` 中指定的颜色表示显式曲面 `z = f(x, y)` 或参数曲面 `x = x(t, u), y
    = y(t, u), z = z(t, u)`。`C` 参数可以省略。`>> [X, Y] = meshgrid(-2:.2:2, -2:.2:2);` `Z
    = X .* exp(-X.² - Y.²); surf(X, Y, Z)`<br>![A978-1-4842-0322-4_3_Figan_HTML.jpg](img/A978-1-4842-0322-4_3_Figan_HTML.jpg)
    |

    | `surfc(X, Y, Z, C)` | 表示显式曲面 `z = f(x, y)` 或参数曲面 `x = x(t, u), y = y(t, u),
    z = z(t, u)`，并同时绘制曲面的等高线图。等高线投影到 xy 平面上。`>> [X, Y] = meshgrid(-2:.2:2, -2:.2:2);`
    `Z = X .* exp(-X.² - Y.²); surfc(X, Y, Z)`<br>![A978-1-4842-0322-4_3_Figao_HTML.jpg](img/A978-1-4842-0322-4_3_Figao_HTML.jpg)
    |

    | `surfl(X, Y, Z)` | 表示显式曲面 `z = f(x, y)` 或参数曲面 `x = x(t, u), y = y(t, u), z =
    z(t, u)`，并带有基于颜色映射的光照效果。`>> r = (0:0.1:2*pi)'';` `t = (-pi:0.1:2*pi);` `X = cos(r)
    * sin(t);` `Y = sin(r) * sin(t);` `Z = ones(size(r, 1))'' * t;` `surfl(X, Y, Z)`<br>![A978-1-4842-0322-4_3_Figap_HTML.jpg](img/A978-1-4842-0322-4_3_Figap_HTML.jpg)
    |

    | `mesh(X, Y, Z, C)` | 表示显式曲面 `z = f(x, y)` 或参数曲面 `x = x(t, u), y = y(t, u), z
    = z(t, u)`，绘制构成网格的线条，并使用 `C`（可选）指定的颜色。`>> [X, Y] = meshgrid(-2:.2:2, -2:.2:2);`
    `Z = X .* exp(-X.² - Y.²); mesh(X, Y, Z)`<br>![A978-1-4842-0322-4_3_Figaq_HTML.jpg](img/A978-1-4842-0322-4_3_Figaq_HTML.jpg)
    |

    | `meshz(X, Y, Z, C)` | 表示显式曲面 `z = f(x, y)` 或参数曲面 `x = x(t, u), y = y(t, u),
    z = z(t, u)`，并在网格周围添加一个“幕帘”。 |

    | `meshc(X, Y, Z, C)` | 表示显式曲面 `z = f(x, y)` 或参数曲面 `x = x(t, u), y = y(t, u),
    z = z(t, u)`，并同时绘制曲面的等高线图。等高线投影到 xy 平面上。`>> [X, Y] = meshgrid(-2:.2:2, -2:.2:2);`
    `Z = X .* exp(-X.² - Y.²); meshc(X, Y, Z)`<br>![A978-1-4842-0322-4_3_Figar_HTML.jpg](img/A978-1-4842-0322-4_3_Figar_HTML.jpg)
    |

    | `contour(Z)` | 绘制矩阵 `Z` 的等高线图，其中 `Z` 被解释为 xy 平面上曲面的高度。等高线的数量自动选择。`>> [X, Y]
    = meshgrid(-2:.2:2, -2:.2:2);` `Z = X .* exp(-X.² - Y.²);` `>> contour(Z)`<br>![A978-1-4842-0322-4_3_Figas_HTML.jpg](img/A978-1-4842-0322-4_3_Figas_HTML.jpg)
    |

    | `contour(Z, n)` | 使用 `n` 条等高线绘制矩阵 `Z` 的等高线图。`>> [X, Y] = meshgrid(-2:.2:2, -2:.2:2);`
    `Z = X .* exp(-X.² - Y.²);` `>> contour(Z)`<br>![A978-1-4842-0322-4_3_Figat_HTML.jpg](img/A978-1-4842-0322-4_3_Figat_HTML.jpg)
    |

    | `contour(x, y, Z, n)` | 使用 `n` 条等高线绘制矩阵 `Z` 的等高线图，并使用向量 `x` 和 `y` 指定的 x 轴和 y
    轴值。`>> r = (0:0.1:2*pi); t = (-pi:0.1:2*pi);` `X = cos(r) * cos(t); Y = sin(r)
    * sin(t); Z = ones(size(r, 1))'' * t;` `>> contour(X, Y, Z)`<br>![A978-1-4842-0322-4_3_Figau_HTML.jpg](img/A978-1-4842-0322-4_3_Figau_HTML.jpg)
    |

    | `contour3(Z)`, `contour3(Z, n)` 和 `contour3(x, y, Z, n)` | 绘制三维等高线图。`>> r =
    (0:0.1:2*pi); t = (-pi:0.1:2*pi);` `X = cos(r) * cos(t); Y = sin(r) * sin(t);
    Z = ones(size(r, 1))'' * t;` `>> contour3(X, Y, Z)`<br>![A978-1-4842-0322-4_3_Figav_HTML.jpg](img/A978-1-4842-0322-4_3_Figav_HTML.jpg)
    |

    | `contourf(...)` | 绘制等高线图并填充等值线之间的区域。`>> r = (0:0.1:2*pi); t = (-pi:0.1:2*pi);`
    `X = cos(r) * cos(t); Y = sin(r) * sin(t); Z = ones(size(r, 1))'' * t;` `>> contourf(X,
    Y, Z)`<br>![A978-1-4842-0322-4_3_Figaw_HTML.jpg](img/A978-1-4842-0322-4_3_Figaw_HTML.jpg)
    |

    | `pcolor(X, Y, Z)` | 绘制由矩阵 `(X, Y, Z)` 决定的“伪彩色”等高线图，使用基于密度的颜色表示。这通常被称为密度图。`>>
    [X, Y] = meshgrid(-2:.2:2, -2:.2:2);` `Z = X .* exp(-X.² - Y.²); meshc(X, Y, Z)`
    `>> pcolor(X, Y, Z)`<br>![A978-1-4842-0322-4_3_Figax_HTML.jpg](img/A978-1-4842-0322-4_3_Figax_HTML.jpg)
    |

    | `trimesh(Tri, X, Y, Z, C)` | 创建一个三角网格图。矩阵 `Tri` 的每一行定义了一个简单的三角形面，`C` 与 `surf`
    中的类似用于定义颜色。`C` 参数是可选的。 |

    | `trisurf(Tri, X, Y, Z, C)` | 创建一个三角曲面图。矩阵 `Tri` 的每一行定义了一个简单的三角形面，`C` 与 `surf`
    中的类似用于定义颜色。`C` 参数是可选的。 |


    ## 三维几何形状


    圆柱体、球体、条形图、切片图、茎秆图、瀑布图及其他三维几何对象的表示均可在 MATLAB 中实现。下表总结了可用于此目的的命令。

    '
- fmt: '| `bar3(Y)` | Creates a 3D bar graph relative to the vector of frequencies
    `Y`. If `Y` is a matrix, multiple bar graphs are produced on the same axes, one
    for each row of `Y`. `>> bar3(rand(4, 4))` ![A978-1-4842-0322-4_3_Figay_HTML.jpg](A978-1-4842-0322-4_3_Figay_HTML.jpg)
    |

    | `bar3(x,Y)` | Creates a 3D bar graph relative to the vector of frequencies `Y`
    where `x` is a vector that defines the x-axis positions on which the bars are
    to be located. |

    | `bar3(...,width)` | Creates a 3D bar graph with the specified bar width. By
    default, the width is 0.8, and a width of 1 causes the bars to touch. |

    | `bar3(...,''style'')` | Creates a 3D bar graph with the specified style of bars.
    The possible styles are `''detached''` (default), `''grouped''` (grouped vertical
    bars) and `''stacked''` (stacked bars, one for each row in `Y`). |

    | `bar3(...,color)` | Creates a 3D bar graph where the bars are all of the specified
    color (`r` = red, `g` = green, `b` = blue, `c` = cyan, `m` = magenta, `y` = yellow,
    `k` = black and `w` = white). |

    | `comet3(z)`, `comet3(x,y,z)` | Creates a 3D comet plot animation of the vector
    `z` or of the parametric space curve `(x(t), y(t), z(t))`. `>> t = -pi:pi/500:pi;
    comet3(sin(5*t), cos(3*t), t)` ![A978-1-4842-0322-4_3_Figaz_HTML.jpg](A978-1-4842-0322-4_3_Figaz_HTML.jpg)
    |

    | `[X, Y, Z] = cylinder`, `[X, Y, Z] = cylinder(r(t))`, `[X, Y, Z] = cylinder(r(t),
    n)`, `cylinder(...)` | Returns the coordinates of a cylinder centered at the origin
    of radius 1 and (z-axis aligned) length 1 and with 20 equally spaced points around
    its circumference. Returns the coordinates of the cylinder generated by the curve
    `r`. Returns the coordinates of the cylinder generated by the curve `r` with `n`
    points on the circumference (`n = 20` by default). The cylinders created above
    can be plotted using the command `surf` or with the command `cylinder(...)`. `>>
    t = 0:pi/10:2*pi;` `[X, Y, Z] = cylinder(2+cos(t));` `surf(X, Y, Z)` ![A978-1-4842-0322-4_3_Figba_HTML.jpg](A978-1-4842-0322-4_3_Figba_HTML.jpg)
    |

    | `sphere` | Plots the unit sphere with center the origin using 20 × 20 faces.
    |

    | `sphere(n)` | Plots a unit sphere using `n` × `n` faces. `>> sphere(100)` ![A978-1-4842-0322-4_3_Figbb_HTML.jpg](A978-1-4842-0322-4_3_Figbb_HTML.jpg)
    |

    | `[X, Y, Z] = sphere(n)` | Gives the coordinates of the sphere in three `(n+1)`
    × `(n+1)` arrays. |

    | `slice(V, sx, sy, sz)`, `slice(X, Y, Z, V, sx, sy, sz)`, `slice(V, XI, YI, ZI)`,
    `slice(X, Y, Z, V, XI, YI, ZI)`, `slice(..., ''method'')` | Draws slices along
    the x, y, z directions in the volume `V` at the points in the vectors `sx`, `sy`,
    and `sz`. `V` is an `m`-by-`n`-by-`p` volume array containing data values at the
    default location `X = 1:n`, `Y = 1:m`, `Z = 1:p`. Each element in the vectors
    `sx`, `sy`, and `sz` defines a slice plane in the x-, y-, or z-axis direction.
    Draws slices of the volume `V` where `X`, `Y`, and `Z` are monotonic orthogonally
    spaced three-dimensional arrays specifying the coordinates for `V`. The color
    at each point is determined by 3-D interpolation into the volume `V`. Draws data
    in the volume `V` for the slices defined by matrices `XI`, `YI`, and `ZI` which
    define a surface, and the volume is evaluated at the surface points. `XI`, `YI`,
    and `ZI` must all be the same size. Draws slices through the volume `V` along
    the surface defined by the arrays `XI`, `YI`, `ZI`. Specifies the interpolation
    method. The options are `''linear''`, `''cubic''`, or `''nearest''`. `>> [x, y,
    z] = meshgrid(-2:.2:2, -2:.25:2, -2:.16:2);` `v = x .* exp(-x.^2 - y.^2 - z.^2);`
    `slice(x, y, z, v, [-1.2, .8, 2], 2, [-2, 0])` ![A978-1-4842-0322-4_3_Figbc_HTML.jpg](A978-1-4842-0322-4_3_Figbc_HTML.jpg)
    |

    | `stem3(Z)`, `stem3(X, Y, Z)`, `stem3(..., ''fill'')`, `stem3(..., S)` | Plots
    `Z` as a sequence of vertical stems with bases on the xy-plane. The base positions
    are automatically generated. Plots the sequence `Z` as vertical stems with xy-plane
    base positions specified by `X` and `Y`. Fills the circles at the tips of the
    stems with color. Creates a 3D stem plot with line style, marker and colour specifications
    `S`. `>> X = linspace(0, 1, 10);` `Y = X / 2;` `Z = sin(X) + cos(Y);` `stem3(X,
    Y, Z, ''fill'')` ![A978-1-4842-0322-4_3_Figbd_HTML.jpg](A978-1-4842-0322-4_3_Figbd_HTML.jpg)
    |


    ## Specialized Graphics


    MATLAB provides commands to create various plots and charts (filled areas, comet,
    contour, mesh, surface and scatter plots, Pareto charts, stairstep graphs). You
    can also modify axes specifications, and there is an easy to use function plotter.
    The following table presents the syntax of these commands.'
