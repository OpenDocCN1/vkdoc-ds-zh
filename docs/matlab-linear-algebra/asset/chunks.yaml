  raw: '## Solving Linear Systems of Equations


    In the previous sections we have studied equations and systems in general. We
    will now focus on linear systems of equations. To solve such systems we could
    simply use the commands we have seen so far, however MATLAB has a selection of
    special commands designed especially for linear systems. The following table lists
    these commands.


    | X = linsolve (A, B) | Solves the linear system A * X = B. We solve the system:
    ![A978-1-4842-0322-4_4_Fig21_HTML.jpg](A978-1-4842-0322-4_4_Fig21_HTML.jpg) `>>
    A = [2,1,1,1;1,2,1,1;1,1,2,1;1,1,1,2];B = [1,2,3,4]'';` `linsolve (A, B)` `ans
    =` `-1` `0` `1` `2` |

    | [X, R] = linsolve (A, B) | Solves the linear system A * X = B and additionally
    returns the reciprocal of the condition number of A if A is square, or the rank
    of A if A is not square. `>> A = [2,1,1,1;1,2,1,1;1,1,2,1;1,1,1,2];B = [1,2,3,4]'';`
    `[X, R] = linsolve (A, B)` `X =` `-1` `0` `1` `2` `R =` `0.1429` |

    | X = linsolve (A, B, options) | Solve the linear system A * X = B using various
    options for the matrix A (UT for upper triangular, LT for lower triangular, SYM
    for symmetric real or complex hermitian, RECT for general rectangular, POSDEF
    for positive definite, UHESS for upper Hessenberg and TRANSA for conjugate transpose).
    |

    | rank (A) | Rank of the matrix A. `>> rank (A)` `ans =` `4` |

    | det (A) | Determinant of the square matrix A. `>> det (A)` `ans =` `5` |

    | Z = null (A, ‘r’) | Rational basis for the null space of A. |


    Systems of linear equations can be converted to array form and solved using calculations
    with matrices. A system can be written in the form M.X = B, where X is the vector
    of variables, B the vector of independent terms and M the matrix of coefficients
    of the system. If M is a square matrix and the determinant of the matrix M is
    non-null, M is invertible, and the unique solution of the system can be written
    in the form: X = M^(-1)B. In this case, the commands solve, linsolve, lscov, bicg,
    pcg, lsqr, gmr, gmres, minres, symmlq or M\B, already described above, offer the
    solution.


    If the determinant of M is zero, the system has infinitely many solutions, since
    there are rows or columns in M that are linearly dependent. In this case, the
    number of redundant equations can be calculated to find out how many variables
    are needed to describe the solutions. If the matrix M is rectangular (not square),
    the system may be undetermined (the number of equations is less than the number
    of variables), overdetermined (the number of equations is greater than the number
    of variables) or non-singular (the number of equations is equal to number of variables
    and M has non-zero determinant). An indeterminate system can have infinitely many
    solutions, or none, and likewise for an overdetermined system. If a system has
    no solution, it is called inconsistent (incompatible), and if there is at least
    one solution, it is called consistent (compatible). The system M . X = B is called
    homogeneous when the vector B is the null vector, i.e. the system is of the form
    M . X= 0\. If the determinant of M is non-null, the unique solution of the system
    is the null vector (obtained with the command linsolve). If the determinant of
    M is zero, the system has infinitely many solutions. The solutions can be found
    using the commands solve, linsolve, lsqr or other commands described above for
    general linear systems.


    A fundamental tool in the analysis and solution of systems of equations is the
    Rouche-Frobenius theorem. This theorem says that a system of m equations with
    n unknowns has a solution if, and only if, the rank of the matrix of coefficients
    coincides with the rank of the array extended with the vector column of the system-independent
    terms. If the two ranks are equal, and equal to the number of unknowns, the system
    has a unique solution. If the two ranks are the same, but less that the number
    of unknowns, the system has infinitely many solutions. If they are different,
    the system has no solution.


    In summary: Let A be the matrix of coefficients of the system and B the matrix
    A augmented by the column vector of independent terms.


    `If` `rank(A) = rank(B)` `, the system is incompatible (without solution).`


    `If` `rank (A) = rank(B) < n` `, the system is indefinite (has infinitely many
    solutions).`


    `If` `= rank(A) = rank(B) = n` `, the system has a unique solution.`


    This theorem allows us to analyze the solutions of a system of equations before
    solving it.


    We have already encountered homogeneous systems. A system A. X = B is said homogeneous
    if the vector of independent terms B is null, so every homogeneous system is of
    the form A. X = 0\. In a homogeneous system, the rank of the matrix of coefficients
    and the rank of the matrix augmented to include the column vector of independent
    terms always coincide. If we apply the Rouche-Frobenius theorem, a homogeneous
    system will have a unique solution when the determinant of the matrix A is non-zero.
    Since the null vector is always a solution of a homogeneous system, this must
    be the unique solution. A homogeneous system will have infinitely many solutions
    when the determinant of the matrix A is zero. In this case, the solutions are
    calculated as for general systems (using the command solve), or by using the function
    null (A).


    As a first example we solve the system:


    ![A978-1-4842-0322-4_4_Fig22_HTML.jpg](A978-1-4842-0322-4_4_Fig22_HTML.jpg)


    We will find the rank of the matrix of the system and the rank of the augmented
    matrix obtained by extending the matrix by the column vector of independent terms.


    `>> A = [2,1,1,1;1,2,1,1;1,1,2,1;1,1,1,2];`


    `>> B = [2,1,1,1,1;1,2,1,1,1;1,1,2,1,1;1,1,1,2,1];`


    `>> [rank (A), rank (B)]`


    `ans =`


    `4 4`


    We note that the ranks of the two matrices coincide with the number of unknowns.
    The Rouche-Frobenius theorem then tells us that the system is compatible with
    a unique solution. We can calculate the solution in the following way:


    `>> B = [1 1 1 1]'';`


    `>> linsolve (A, B)`


    `ans =`


    `0.2000`


    `0.2000`


    `0.2000`


    `0.2000`


    The solution could also have been found using the following commands:


    `>> lscov (A, B)`


    `ans =`


