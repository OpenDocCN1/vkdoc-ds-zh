    # 三维曲线


    MATLAB 包含用于绘制三维空间曲线的命令。下表列出了最重要的命令。


    | `plot3(X, Y, Z)` | 通过直线连接由 (X, Y, Z) 确定的点序列来绘制三维线图，其中 X、Y 和 Z 为行向量。X、Y 和 Z 也可以是参数坐标或相同大小的矩阵，此时将为每一组三元行在同一坐标轴上绘制图形。若
    X、Y 和 Z 为复数值，则忽略其虚部。`>> X = [0 1 1 2; 1 1 2 2; 0 0 1 1];` `Y = [1 1 1 1; 1 0 1
    0; 0 0 0 0];` `Z = [1 1 1 1; 1 0 1 0; 0 0 0 0];` `>> plot3 (X, Y, Z)` ![A978-1-4842-0322-4_3_Figaj_HTML.jpg](img/A978-1-4842-0322-4_3_Figaj_HTML.jpg)
    `>> t = 0:pi/100:20 * pi; plot3 (2 * sin(2*t), 2 * cos(2*t), 4 * t)` ![A978-1-4842-0322-4_3_Figak_HTML.jpg](img/A978-1-4842-0322-4_3_Figak_HTML.jpg)
    |

    | `plot3(X, Y, Z, S)` | 按照 S 中定义的设置生成线图 `plot(X,Y,Z)`。S 通常由单引号内的两个字符组成，第一个字符设置线图的颜色，第二个字符确定线条或标记属性。可能的设置已在上述
    `plot` 命令中描述过。 |

    | `plot3(X1,Y1,Z1,S1, X2,Y2,Z2,S2,X3, Y3, Z3, S3,…)` | 在同一坐标轴上组合四元组 (Xi, Yi, Zi,
    Si) 的三维线图。这是在同一图形上表示多个函数的有用方式。 |

    | `fill3(X,Y,Z,C)` | 绘制以列向量 X、Y、Z 的分量三元组 (Xi, Yi, Zi) 为顶点的填充多边形。C 是与 X、Y、Z 大小相同的向量，用于指定每个顶点
    (Xi, Yi, Zi) 的颜色 Ci。Ci 的值可以是 `''r''`、`''g''`、`''b''`、`''c''`、`''m''`、`''y''`、`''w''`、`''k''`，其含义我们已经了解。如果
    C 是单个字符，则所有顶点都将使用此颜色。如果 X、Y、Z 是相同大小的矩阵，则将绘制与每个三元组列向量 (X.j, Y.j, Z.j) 对应的多个多边形。此时，C
    可以是行向量，其元素 Cj 决定与 (X.j, Y.j, Z.j) 对应的每个多边形的唯一颜色。C 也可以是维度与 X、Y、Z 相同的矩阵，此时其元素决定多边形集合中每个顶点
    (Xijk, Yijk, Zijk) 的颜色。`>> X = [0 1 1 2; 1 1 2 2; 0 0 1 1];` `Y = [1 1 1 1; 1
    0 1 0; 0 0 0 0];` `Z = [1 1 1 1; 1 0 1 0; 0 0 0 0];` `C = [0.5000 1.0000 1.0000
    0.5000;` `1.0000 0.5000 0.5000 0.1667;` `0.3330 0.3330 0.5000 0.5000];` `fill3(X,Y,Z,C)`
    ![A978-1-4842-0322-4_3_Figal_HTML.jpg](img/A978-1-4842-0322-4_3_Figal_HTML.jpg)
    |

    | `fill3(X1,Y1,Z1,C1, X2, Y2, Z2, C2,…)` | 绘制顶点和颜色由 (Xi, Yi, Zi, Ci) 给出的填充多边形。
    |

    | `ezplot3(x(t), y(t), z(t))` `ezplot3(x(t),y(t),z(t), [tmin,tmax])` | 绘制由给定三个参数分量定义的空间曲线。在参数指定的变化范围内绘制由给定三个参数分量定义的空间曲线。`>>
    ezplot3 (''sin (t)'', ''cos (t)'', '', [0, 6 * pi])` ![A978-1-4842-0322-4_3_Figam_HTML.jpg](img/A978-1-4842-0322-4_3_Figam_HTML.jpg)
    |


    # 显式曲面与参数曲面。等高线图


    MATLAB 包含用于表示由 `z = f(x,y)` 形式方程定义的曲面的命令。第一步是使用命令 `meshgrid`，该命令定义了将计算函数值的点数组
    (X, Y)。然后使用命令 `surf` 来创建曲面。


    命令 `mesh` 也用于生成由函数 `z = f(x,y)` 定义的网格图，使得曲面上的点由函数 `f(x,y)` 对于平面 (x, y) 上对应点所确定的
    z 值网络来表示。网格图的外观类似于渔网，曲面点构成网络的节点。


    还可以使用命令 `contour` 表示曲面的等高线。这些曲线的特征是：平面上使得 `f(x,y)` 值为某个固定常数的点集 (x,y)。


    下表列出了可用于以显式和参数形式生成曲面网格图和等高线图的 MATLAB 命令。

    '
- fmt: '| `[X, Y] = meshgrid(x, y)` | Creates a rectangular grid by transforming the
    monotonically increasing grid vectors `x` and `y` into two matrices `X` and `Y`
    specifying the entire grid. Such a grid can be used by the commands `surf` and
    `mesh` to produce surface graphics. |

    | `surf(X, Y, Z, C)` | Represents the explicit surface `z = f(x, y)` or the parametric
    surface `x = x(t, u), y = y(t, u), z = z(t, u)`, using the colors specified in
    `C`. The `C` argument can be omitted. `>> [X, Y] = meshgrid(-2:.2:2, -2:.2:2);`
    `Z = X .* exp(-X.^2 - Y.^2); surf(X, Y, Z)`<br>![A978-1-4842-0322-4_3_Figan_HTML.jpg](A978-1-4842-0322-4_3_Figan_HTML.jpg)
    |

    | `surfc(X, Y, Z, C)` | Represents the explicit surface `z = f(x, y)` or the parametric
    surface `x = x(t, u), y = y(t, u), z = z(t, u)`, together with a contour plot
    of the surface. The contour lines are projected onto the xy-plane. `>> [X, Y]
    = meshgrid(-2:.2:2, -2:.2:2);` `Z = X .* exp(-X.^2 - Y.^2); surfc(X, Y, Z)`<br>![A978-1-4842-0322-4_3_Figao_HTML.jpg](A978-1-4842-0322-4_3_Figao_HTML.jpg)
    |

    | `surfl(X, Y, Z)` | Represents the explicit surface `z = f(x, y)` or the parametric
    surface `x = x(t, u), y = y(t, u), z = z(t, u)`, with colormap-based lighting.
    `>> r = (0:0.1:2*pi)'';` `t = (-pi:0.1:2*pi);` `X = cos(r) * sin(t);` `Y = sin(r)
    * sin(t);` `Z = ones(size(r, 1))'' * t;` `surfl(X, Y, Z)`<br>![A978-1-4842-0322-4_3_Figap_HTML.jpg](A978-1-4842-0322-4_3_Figap_HTML.jpg)
    |

    | `mesh(X, Y, Z, C)` | Represents the explicit surface `z = f(x, y)` or the parametric
    surface `x = x(t, u), y = y(t, u), z = z(t, u)`, drawing the grid lines that compose
    the mesh with the colors specified by `C` (optional). `>> [X, Y] = meshgrid(-2:.2:2,
    -2:.2:2);` `Z = X .* exp(-X.^2 - Y.^2); mesh(X, Y, Z)`<br>![A978-1-4842-0322-4_3_Figaq_HTML.jpg](A978-1-4842-0322-4_3_Figaq_HTML.jpg)
    |

    | `meshz(X, Y, Z, C)` | Represents the explicit surface `z = f(x, y)` or the parametric
    surface `x = x(t, u), y = y(t, u), z = z(t, u)` adding a ''curtain'' around the
    mesh. |

    | `meshc(X, Y, Z, C)` | Represents the explicit surface `z = f(x, y)` or the parametric
    surface `x = x(t, u), y = y(t, u), z = z(t, u)` together with a contour plot of
    the surface. The contour lines are projected on the xy-plane. `>> [X, Y] = meshgrid(-2:.2:2,
    -2:.2:2);` `Z = X .* exp(-X.^2 - Y.^2); meshc(X, Y, Z)`<br>![A978-1-4842-0322-4_3_Figar_HTML.jpg](A978-1-4842-0322-4_3_Figar_HTML.jpg)
    |

    | `contour(Z)` | Draws a contour plot of the matrix `Z`, where `Z` is interpreted
    as heights of the surface over the xy-plane. The number of contour lines is selected
    automatically. `>> [X, Y] = meshgrid(-2:.2:2, -2:.2:2);` `Z = X .* exp(-X.^2 -
    Y.^2);` `>> contour(Z)`<br>![A978-1-4842-0322-4_3_Figas_HTML.jpg](A978-1-4842-0322-4_3_Figas_HTML.jpg)
    |

    | `contour(Z, n)` | Draws a contour plot of the matrix `Z` using `n` contour lines.
    `>> [X, Y] = meshgrid(-2:.2:2, -2:.2:2);` `Z = X .* exp(-X.^2 - Y.^2);` `>> contour(Z)`<br>![A978-1-4842-0322-4_3_Figat_HTML.jpg](A978-1-4842-0322-4_3_Figat_HTML.jpg)
    |

    | `contour(x, y, Z, n)` | Draws a contour plot of the matrix `Z` with `n` contour
    lines and using the x-axis and y-axis values specified by the vectors `x` and
    `y`. `>> r = (0:0.1:2*pi); t = (-pi:0.1:2*pi);` `X = cos(r) * cos(t); Y = sin(r)
    * sin(t); Z = ones(size(r, 1))'' * t;` `>> contour(X, Y, Z)`<br>![A978-1-4842-0322-4_3_Figau_HTML.jpg](A978-1-4842-0322-4_3_Figau_HTML.jpg)
    |

    | `contour3(Z)`, `contour3(Z, n)` y `contour3(x, y, Z, n)` | Draws three-dimensional
    contour plots. `>> r = (0:0.1:2*pi); t = (-pi:0.1:2*pi);` `X = cos(r) * cos(t);
    Y = sin(r) * sin(t); Z = ones(size(r, 1))'' * t;` `>> contour3(X, Y, Z)`<br>![A978-1-4842-0322-4_3_Figav_HTML.jpg](A978-1-4842-0322-4_3_Figav_HTML.jpg)
    |

    | `contourf(...)` | Draws a contour plot and fills in the areas between the isolines.
    `>> r = (0:0.1:2*pi); t = (-pi:0.1:2*pi);` `X = cos(r) * cos(t); Y = sin(r) *
    sin(t); Z = ones(size(r, 1))'' * t;` `>> contourf(X, Y, Z)`<br>![A978-1-4842-0322-4_3_Figaw_HTML.jpg](A978-1-4842-0322-4_3_Figaw_HTML.jpg)
    |

    | `pcolor(X, Y, Z)` | Draws a ''pseudocolor'' contour plot determined by the matrix
    `(X, Y, Z)` using a color representation based on densities. This is often called
    a density plot. `>> [X, Y] = meshgrid(-2:.2:2, -2:.2:2);` `Z = X .* exp(-X.^2
    - Y.^2); meshc(X, Y, Z)` `>> pcolor(X, Y, Z)`<br>![A978-1-4842-0322-4_3_Figax_HTML.jpg](A978-1-4842-0322-4_3_Figax_HTML.jpg)
    |

    | `trimesh(Tri, X, Y, Z, C)` | Creates a triangular mesh plot. Each row of the
    matrix `Tri` defines a simple triangular face and `C` defines colors as in `surf`.
    The `C` argument is optional. |

    | `trisurf(Tri, X, Y, Z, C)` | Creates a triangular surface plot. Each row of
    the matrix `Tri` defines a simple triangular face and `C` defines colors as in
    `surf`. The `C` argument is optional. |


    ## Three-dimensional Geometric Forms


    The representation of cylinders, spheres, bars, sections, stems, waterfall charts
    and other three-dimensional geometric objects is possible with MATLAB. The following
    table summarizes the commands that can be used for this purpose.'
