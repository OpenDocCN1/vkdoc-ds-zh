    ## Matrix Notation


    We have already seen how vectors and matrices are represented in MATLAB in the
    chapter dedicated to variables, however we shall recall here the notation.


    Consider the matrix


    ![A978-1-4842-0322-4_5_Fig1_HTML.jpg](A978-1-4842-0322-4_5_Fig1_HTML.jpg)


    You can enter this in MATLAB in the following ways:


    `A = [a11,a12,...,a1n ; a21,a22,...,a2n ; ... ; am1,am2,...,amn]`


    `A = [a11 a12 ... a1n ; a21 a22 ... a2n ; ... ; am1 am2 ... amn]`


    On the other hand, a vector `V =(v1,v2,...,vn)` is introduced as a special case
    of a matrix with a single row (i.e. a matrix of dimension 1×n) in the following
    form:


    `V = [v1, v2, ..., vn]`


    `V = [v1 v2 ... vn]`


    ## Matrix Operations


    MATLAB includes commands that allow you to perform the most common symbolic and
    numerical operations with matrices. The following table shows the most important
    such operations.'
