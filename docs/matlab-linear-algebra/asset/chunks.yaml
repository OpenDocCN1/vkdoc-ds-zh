    `0`


    `0`


    `0`


    `>> A*[1 2 -1 -2 3]''`


    `ans =`


    `-2`


    `9`


    `11`


    The dimension of the image of the linear transformation is equal to the rank of
    A.


    `>> rank (A)`


    `ans =`


    `3`


    Thus the dimension of the image of the transformation is 3, and a basis of the
    image will be given by any three linearly independent columns of A.


    `>> det([0 -3 -2;-3 3 2;-1 -3 -1])`


    `ans =`


    `-9`


    Therefore, the vectors {{0 - 3 - 2};{-3 3 2}; {- 1 -3 - 1}} form a basis of the
    image.


    As an eighth example we consider the linear transformation f between two vector
    subspaces U and V of real three-dimensional space, such that f (a, b, c) = (a
    + b, b + c, a + c),  for (a, b, c) in U. We find the matrices corresponding to
    the transformations f, f ⁵, and e ^f .


    To find the matrix of f, we find the images of the canonical basis vectors under
    f :


    `>> f`


    `f =`


    `[a + b, b + c, a + c]`


    `>> subs(f,{a,b,c},{1,0,0})`


    `ans =`


    `1     0     1`


    `>> subs(f,{a,b,c},{0,1,0})`


    `ans =`


    `1     1     0`


    `>> subs(f,{a,b,c},{0,0,1})`


    `ans =`


    `0     1     1`


    The matrix A associated with the linear transformation f will then have as columns
    the images of the basis vectors found above. Thus:


    ![A978-1-4842-0322-4_5_Fig3_HTML.jpg](A978-1-4842-0322-4_5_Fig3_HTML.jpg)


    The matrix associated to f ⁵ will be A ⁵ and the matrix associated to e ^f   will
    be e ^A .


