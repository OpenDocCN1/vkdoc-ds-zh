    ![A978-1-4842-0322-4_3_Figcl_HTML.jpg](A978-1-4842-0322-4_3_Figcl_HTML.jpg)


    ## Exercise 3-11


    Plot the curve given by the following parametric equations:


    ![A978-1-4842-0322-4_3_Fig11_HTML.jpg](A978-1-4842-0322-4_3_Fig11_HTML.jpg)


