    = 10:10:30;` `wages = [150.697 199.592 187.625` `179.323 195.072 250.287` `203.212
    179.092 322.767` `226.505 153.706 426.730` `249.633 120.281 598.243];` `w = interp2(service,years,wages,15,1975)`
    `w =` `190.6288` |

    | vi = interp3(X,Y,Z,V,Xi,Yi,Zi) vi = interp3(V, Xi, Yi, Zi) vi = interp3(V,n)
    vi = interp3(…, method) | Returns interpolated values of a function of three variables
    at specific query points using linear interpolation. The results always pass through
    the original sampling of the function. X, Y, and Z contain the coordinates of
    the sample points. V contains the corresponding function values at each sample
    point. Xi, Yi, and Zi contain the coordinates of the query points. Equivalent
    to the above with ![A978-1-4842-0322-4_4_Fig7_HTML.jpg](A978-1-4842-0322-4_4_Fig7_HTML.jpg)
    where ![A978-1-4842-0322-4_4_Fig8_HTML.jpg](A978-1-4842-0322-4_4_Fig8_HTML.jpg)
    . Returns the interpolated values on a refined grid formed by repeatedly dividing
    the intervals n times in each dimension. Performs the interpolation using the
    specified method. The following example calculates and represents interpolated
    values of the MATLAB function flow by taking several slices through the data and
    displaying the interpolated data on each slice. The three axes are sampled in
    equal intervals of 0.5, for x between 0.1 and 10 and y and z between -3 and 3.
    `>> [x, y, z, v] = flow (10);` `[xi, yi, zi] = meshgrid(.1:.5:10,-3:.5:3,-3:.5:3);`
    `vi = interp3(x,y,z,v,xi,yi,zi);` `slice(xi,yi,zi,vi,[6 9.5],2,[-2 .2]), shading
    flat` ![A978-1-4842-0322-4_4_Figb_HTML.jpg](A978-1-4842-0322-4_4_Figb_HTML.jpg)
    |

    | Y = interpft(X,n) y = interpft (x, n, dim) | One-dimensional interpolation using
    the FFT method. Gives the vector containing the values of the periodic function
    X sampled at n equally spaced points. The original vector X is transformed to
    the Fourier domain via the fast Fourier transform (FFT). Operates along the specified
    dimension. Below is an example where the original points and the  interpolated
    points using the FFT method are compared. `>> y = [0:. 5:2 1.5:-. 5: - 2 - 1.5:.
    5:0]; % Equally spaced points` `factor = 5; A factor of 5% Tween` `m = length
    (y) * factor;` `x = 1:factor: m;` `XI = 1;` `Yi = interpft (y, m);` `plot(x,y,''o'',xi,yi,''*'')`
    `Legend (''original data'', ''interpolated data'')` ![A978-1-4842-0322-4_4_Figc_HTML.jpg](A978-1-4842-0322-4_4_Figc_HTML.jpg)
    |

    | Vi = interpn(X,Y,Z,…V, Xi, Yi, Zi…) Vi = interpn (V, Xi, Yi, Zi) Vi = interpn
    (V, n) Vi = interpn(…,method) | Returns interpolated values of a function of n
    variables at specific query points using linear interpolation. The results always
    pass through the original sampling of the function. X,Y,Z,… contain the coordinates
    of the sample points. V contains the corresponding function values at each sample
    point.Xi,Yi,Zi,… contain the coordinates of the query points. ![A978-1-4842-0322-4_4_Fig9_HTML.jpg](A978-1-4842-0322-4_4_Fig9_HTML.jpg)
    Equivalent to the above with where ![A978-1-4842-0322-4_4_Fig10_HTML.jpg](A978-1-4842-0322-4_4_Fig10_HTML.jpg)
    . Returns the interpolated values on a refined grid formed by repeatedly dividing
    the intervals n times in each dimension. Interpolation using the specified method.
    |

    | Yi= pchip (X, Y, Xi) pp = pchip(X,Y) | Returns a vector Yi containing elements
    corresponding to the elements of Xi and determined by piecewise cubic interpolation
    within vectors X and Y. Returns a piecewise polynomial structure for use by ppval.
    |

    | Yi = spline (X, Y, Xi) pp = spline(X,Y) | Uses a cubic spline interpolation
    to find Yi, the values of the underlying function Y at the values of the interpolant
    Xi. The simple points are determined by X. Returns the piecewise polynomial form
    of the cubic spline interpolant for later use with ppval and the spline utility
    unmkpp. In the following example the original points are compared with the interpolated
    points obtained using the the pchip and spline methods. `>> x = - 3:3;` `y = [-
    1 - 1 - 1 0 1 1 1];` `t = - 3:. 01:3;` `plot (x, y, ''o'', t, [pchip (x, y, t);
    spline(x,y,t)])` `legend(''data'',''pchip'',''spline'',4)` ![A978-1-4842-0322-4_4_Figd_HTML.jpg](A978-1-4842-0322-4_4_Figd_HTML.jpg)
    |

    | Zi = griddata(X,Y,Z,Xi,Yi) [Xi, Yi, Zi] = griddata(X,Y,Z,Xi,Yi) […] = griddata(…,method)
    | Fits a surface of the form Z = f(X,Y) to the scattered data in the vectors (X,Y,Z).
    The function interpolates the surface at the query points specified by (Xi,Yi)
    and returns the interpolated values, Zi. The surface always passes through the
    data points defined by X and Y. The method of interpolation is linear by default.
    Returns in addition to Zi the vectors Xi and Yi. Interpolation using the specified
    method. The example below interpolates scattered data over a grid. `x = rand (100.1)
    * 4-2; y = rand (100.1) * 4-2;` `z = x.*exp(-x.^2-y.^2);` `ti = -2:.25:2;` `[xi,yi]
    = meshgrid(ti,ti);` `Zi = griddata(x,y,z,xi,yi);` `mesh(xi,yi,zi), hold on, plot3(x,y,z,''o''),`
    `hold off` ![A978-1-4842-0322-4_4_Fige_HTML.jpg](A978-1-4842-0322-4_4_Fige_HTML.jpg)
    |

    | W = griddata3(X,Y,Z,V,Xi,Yi,Zi) W = griddata3(…,‘method’) | Fits a hypersurface
    of the form V = f(X,Y,Z) to the scattered data in the vectors (X,Y,Z,V). The function
    interpolates the hypersurface at the query points specified by (Xi,Yi,Zi) and
    returns the interpolated values, W. The surface always passes through the data
    points defined by X, Y and Z. The method of interpolation is linear by default.
    Interpolation using the specified method. Below is an example of fitting a hypersurface
    to scattered data by interpolation. `>>  x = 2*rand(5000,1)-1; y = 2*rand(5000,1)-1;
    z = 2*rand(5000,1)-1;` `v = x.^2 + y.^2 + z.^2;` `d = -0.8:0.05:0.8;` `[xi,yi,zi]
    = meshgrid(d,d,d);` `w = griddata3(x,y,z,v,xi,yi,zi);` `p = patch(isosurface(xi,yi,zi,w,0.8));`
    `isonormals(xi,yi,zi,w,p);` `set(p,''FaceColor'',''blue'',''EdgeColor'',''none'');`
    `view(3), axis equal, axis off, camlight, lighting phong` ![A978-1-4842-0322-4_4_Figf_HTML.jpg](A978-1-4842-0322-4_4_Figf_HTML.jpg)
    |'
