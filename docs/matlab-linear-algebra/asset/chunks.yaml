  trans: '

    # 二维和三维图形选项


    MATLAB 包含许多不同的命令，用于图形处理，包括标题、图例和坐标轴标签、向图形添加文本，以及调整颜色和着色。最重要的命令总结在下表中。


    | `title(''text'')` | 在当前坐标轴的顶部添加标题。 |

    | `xlabel(''text'')` | 添加 x 轴标签。 |

    | `ylabel(''text'')` | 添加 y 轴标签。 |

    | `zlabel(''text'')` | 添加 z 轴标签。 |

    | `clabel(C,h)` | 使用 `''+''` 标记等高线图的等高线，旋转标签使其位于等高线内侧。 |

    | `clabel(C,h,v)` | 仅标记由向量 `v` 指定层级的等高线图的等高线，旋转标签使其位于等高线内侧。 |

    | `datetick(axis)` | 为指定的坐标轴（`''x''`、`''y''` 或 `''z''`）创建日期格式的刻度标签。 |

    | `datetick(axis,date)` | 使用给定的日期格式（1 到 28 之间的整数）为指定的坐标轴（`''x''`、`''y''` 或 `''z''`）创建日期格式的刻度标签。
    |

    | `legend(''string1'',''string2'',...)` | 在当前坐标轴中使用指定的字符串标记每组数据以显示图例。 |

    | `legend(h,''string1'',''string2'',...)` | 在图形上显示图例，其中包含由向量 `h` 标识的对象，并使用指定的字符串标记相应的图形对象。
    |

    | `legend(''off'')` | 删除当前坐标轴的图例。 |

    | `text(x,y,''text'')` | 在二维图形中的点 `(x,y)` 处放置指定的文本。 |

    | `text(x,y,z,''text'')` | 在三维图形中的点 `(x,y,z)` 处放置指定的文本。 |

    | `gtext(''text'')` | 允许您在二维图形中通过鼠标选择一个点来放置文本。 |

    | `grid` | 向二维和三维图形添加网格线。`grid on` 向坐标轴添加主网格线，`grid off` 从当前坐标轴移除所有网格线。命令 `grid`
    切换主网格线的可见性。 |

    | `hold` | 控制在随后调用绘图函数时是否清除当前图形（默认行为），或者向当前图形添加新图形，同时保留现有图形及其所有属性。命令 `hold on`
    保留当前图形并向其添加另一个图形。命令 `hold off` 在绘制新图形之前重置为默认属性。 |

    | `axis([xmin,xmax,ymin,ymax,zmin,zmax])` | 设置坐标轴范围。 |

    | `axis(''auto'')` | 自动计算坐标轴范围（`xmin = min(x)`，`xmax = max(x)`）。 |

    | `axis(axis)` | 将缩放比例冻结在当前范围，这样如果 `hold` 处于开启状态，后续绘图将使用相同的范围。 |

    | `V = axis` | 返回一个行向量 `V`，其中包含 x、y 和 z 轴的缩放因子。根据图形是二维还是三维，`V` 分别有四个或六个分量。 |

    | `axis(''xy'')` | 使用笛卡尔坐标系，原点位于图形的左下角。 |

    | `axis(''tight'')` | 将坐标轴范围设置为数据的范围。 |

    | `axis(''ij'')` | 将原点置于图形的左上角。 |

    | `axis(''square'')` | 使当前坐标轴区域为正方形（三维时则为立方体）。 |

    | `axis(''equal'')` | 对两个坐标轴使用相同的缩放因子。 |

    | `axis(''normal'')` | 移除 `square` 和 `equal` 选项。 |

    | `axis(''off'')` | 关闭所有坐标轴线、刻度标记和标签，但保留图形标题和任何 `gtext` 文本。 |

    | `axis(''on'')` | 打开所有坐标轴线、刻度标记和标签。 |

    | `subplot(m,n,p)` | 将当前图形划分为 `m×n` 的网格，并在 `p` 指定的网格位置创建坐标轴。网格按行编号，因此第一个网格是第一行的第一列，第二个网格是第一行的第二列，依此类推。
    |

    | `plotyy(X1,Y1,X2,Y2)` `plotyy(X1,Y1,X2,Y2,''function'')` `plotyy(X1,Y1,X2,Y2,''function1'',''function2'')`
    | 绘制 `X1` 对 `Y1` 的图形，y 轴标签在左侧；绘制 `X2` 对 `Y2` 的图形，y 轴标签在右侧。与上一个命令相同，但使用指定的绘图函数（`plot`、`loglog`、`semilogx`、`semilogy`、`stem`
    或任何可接受的函数 `h = function(x,y)`）来绘制图形。使用 `function1(X1,Y1)` 绘制左侧轴的数据，使用 `function2(X2,Y2)`
    绘制右侧轴的数据。 |

    | `axis([xmin,xmax,ymin,ymax,zmin,zmax])` | 设置 x、y 和 z 轴的范围。也接受 `''ij''`、`''square''`、`''equal''`
    等选项，与等效的二维命令相同。 |

    | `view([x,y,z])` | 将视角方向设置为笛卡尔坐标 `x`、`y` 和 `z`。 |

    | `view([az,el])` | 设置三维图形的视角。方位角 `az` 是绕 z 轴的水平旋转角度，以从负 y 轴开始测量的度数表示。正值表示视点逆时针旋转。`el`
    是视点的垂直仰角，以度数表示。仰角正值对应于移动到对象上方；负值对应于移动到对象下方。 |

    | `hidden` | 隐藏线移除仅绘制在三维视图中未被其他对象遮挡的线条。命令 `hidden on` 隐藏此类被遮挡的线条，而 `hidden off`
    则显示它们。 |

    | `shading` | 控制使用命令 `surf`、`mesh`、`pcolor`、`fill` 和 `fill3` 创建的表面的着色类型。选项 `shading
    flat` 给出平滑着色，`shading interp` 给出密集阴影，`shading faceted`（默认）给出标准着色。 |

    | `colormap(M)` | 将颜色图设置为矩阵。`M` 必须有三列，并且仅包含介于 0 和 1 之间的值。它也可以是一个矩阵，其行是 RGB 类型的向量
    `[r g b]`。有一些预定义的数组 `M`，如下所示：`jet(p)`、`HSV(p)`、`hot(p)`、`cool(p)`、`spring(p)`、`summer(p)`、`autumn(p)`、`winter(p)`、`gray(p)`、`bone(p)`、`copper(p)`、`pink(p)`、`lines(p)`。所有数组都有
    3 列和 `p` 行。例如，语法 `colormap(hot(8))` 将 `hot(8)` 设置为当前颜色图。 |

    | `brighten(p)` | 调整图形的亮度。如果 `0 < p < 1`，图形将变亮；如果 `-1 < p < 0`，图形将变暗。 |

    | `image(A)` | 通过将矩阵中的每个元素解释为图形颜色图的索引，或根据指定的数据直接解释为 RGB 值，来创建图像图形对象。 |

    | `pcolor(A)` | 产生伪彩色图，即一个矩形单元格阵列，其颜色由 `A` 确定。`A` 的元素线性映射到当前颜色图的索引。 |

    | `caxis([cmin,cmax])` | 将颜色范围设置为指定的最小值和最大值。小于 `cmin` 或大于 `cmax` 的数据值分别映射到 `cmin`
    和 `cmax`。介于 `cmin` 和 `cmax` 之间的值线性映射到当前颜色图。 |

    | `h = figure` `figure(h)` | 创建一个名为 `h` 的图形图形对象。将由 `h` 标识的图形设为当前图形，使其可见，并尝试将其置于屏幕上所有其他图形之上。当前图形是图形输出的目标。命令
    `close(h)` 删除由 `h` 标识的图形。命令 `whitebg(h)` 补充图形 `h` 的所有颜色。`clf` 命令关闭当前图形。命令 `graymon`
    设置图形属性的默认值，以便在灰度显示器上产生更清晰的显示效果。`refresh` 命令重绘图形。 |

    | `e = axes` `axes(e)` | 创建名为 `e` 的坐标轴对象。将现有坐标轴 `e` 设为当前坐标轴，并将包含它的图形置于焦点。命令 `gca`
    返回当前坐标轴的名称。命令 `cla` 删除与当前坐标轴相关的所有对象。 |

    | `l = line(x,y)` 或 `l = line(x,y,z)` | 创建一个名为 `l` 的对象，该对象是连接平面中的点 `X`、`Y` 或空间中的点
    `X`、`Y`、`Z` 的线。 |

    | `p = patch(X,Y,C)` 或 `patch(X,Y,Z,C)` | 创建一个不透明的多边形区域 `p`，该区域由平面中的点集 `(X,Y)`
    或空间中的点集 `(X,Y,Z)` 定义，其颜色由 `C` 指定。 |

    | `s = surface(X,Y,Z,C)` | 创建由 `X`、`Y` 和 `Z` 定义的参数曲面 `s`，其颜色由 `C` 指定。 |

    | `i = image(C)` | 从矩阵 `C` 创建图像 `i`。`C` 的每个元素指定图像中一个矩形段的颜色。 |

    | `t = text(x,y,''string'')` 或 `t = text(x,y,z,''string'')` | 创建由该字符串定义的文本 `t`，位于平面中的点
    `(x,y)` 或空间中的点 `(x,y,z)`。 |

    | `set(h,''property1'',''property2'',...)` | 为对象 `h`（`gca` 用于坐标轴范围）、`gcf`、`gco`、`gcbo`、`gcbd`、颜色等设置指定的属性。
    |

    | `get(h,''property'')` | 返回对象 `h` 的给定属性的当前值。 |

    | `object = gco` | 返回当前对象的名称。 |

    | `rotate(h,v,α,[p,q,r])` | 将对象 `h` 绕由向量 `v` 描述的旋转轴（该轴经过点 `(p,q,r)`）旋转角度 `α`。
    |

    | `reset(h)` | 更新分配给对象 `h` 的所有属性，将其替换为默认值。 |

    | `delete(h)` | 删除对象 `h`。 |


