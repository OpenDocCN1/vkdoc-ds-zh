    ### 随机数


    MATLAB 可以轻松生成（伪）随机数。函数 `rand` 生成均匀分布的随机数，函数 `randn` 生成正态分布的随机数。下表介绍了 MATLAB 随机数生成器最实用的功能。


    | `rand` | 返回区间 [0,1] 中均匀分布的一个随机小数。 |

    | `rand(n)` | 返回一个 n×n 的数组，其元素是区间 [0,1] 中均匀分布的随机小数。 |

    | `rand(m, n)` | 返回一个 m×n 的数组，其元素是区间 [0,1] 中均匀分布的随机小数。 |

    | `rand(size(a))` | 返回一个与矩阵 A 同尺寸的数组，其元素是区间 [0,1] 中均匀分布的随机小数。 |

    | `rand(''seed'')` | 返回均匀随机数生成器种子的当前值。 |

    | `rand(''seed'',n)` | 将均匀随机数生成器种子的当前值赋给 n。 |

    | `randn` | 返回一个正态分布的随机小数（均值为 0，方差为 1）。 |

    | `randn(n)` | 返回一个 n×n 的数组，其元素是正态分布的随机小数（均值为 0，方差为 1）。 |

    | `randn(m, n)` | 返回一个 m×n 的数组，其元素是正态分布的随机小数（均值为 0，方差为 1）。 |

    | `randn(size(a))` | 返回一个与矩阵 A 同尺寸的数组，其元素是正态分布的随机小数（均值为 0，方差为 1）。 |

    | `randn(''seed'')` | 返回正态随机数生成器种子的当前值。 |

    | `randn(''seed'',n)` | 将正态随机数生成器种子的当前值赋给 n。 |


    以下是一些示例：


    ```

    >> [rand, rand (1), randn, randn (1)]


    ans =


    0.9501    0.2311   -0.4326   -1.6656


    >> [rand(2), randn(2)]


    ans =


    0.6068    0.8913                 0.1253   -1.1465

    0.4860    0.7621                 0.2877    1.1909


    >> [rand(2,3), randn(2,3)]


    ans =


    0.3529 0.0099 0.2028 -0.1364 1.0668 -0.0956

    0.8132 0.1389 0.1987  0.1139 0.0593 -0.8323

    ```


    ## 运算符


    MATLAB 具备算术、逻辑、关系、条件和结构运算符。

