    # 4. 代数表达式、多项式、方程与方程组


    ## 代数表达式的展开、化简与因式分解


    MATLAB 包含一系列强大的命令，可用于处理代数表达式，包括化简、展开和因式分解。下表列出了处理代数表达式时最常用的命令。


    | `expand(expr)` | 展开代数表达式，将结果显示为乘积与幂的和形式，对三角函数应用倍角公式，并应用指数函数和对数函数的形式性质。它还能将多项式分式分解为更简单的多项式分式之和。
    `>> syms x y z t a b` `>> pretty(expand((x+2)*(x+3)))` `2` `x  + 5 x + 6` `>>
    pretty(expand((x+2)/(x+3)))` `x       2` `----- + -----` `x + 3   x + 3` `>> pretty(expand(cos(x+y)))`
    `cos(x) cos(y) - sin(x) sin(y)` |

    | `factor(expr)` | `expand` 的逆运算。将代数表达式写成因式乘积的形式。 `>> syms x y` `>> pretty(factor(6*x²+18*x-24))`
    `6 (x + 4) (x - 1)` `>> pretty (factor ((x³-y³)/(x⁴-y⁴)))` `2         2` `x +
    x y + y` `-----------------` `2   2` `(x + y) (x + y )` `>> pretty(factor(x³+y³))`
    `2         2` `(x + y) (x - x y + y )` |

    | `simplify(expr)` | 尽可能地将代数表达式化简。 `>> syms x y b c` `>> simplify (sin (x) ^ 2
    + cos (x) ^ 2) * 2` `ans =` `2` `>> simplify (log (exp (a+log (exp (c)))))` `ans
    =` `log (exp(a + c))` |

    | `simple(expr)` | 搜索代数表达式的最简形式。 `>> syms a positive;` `f = (1/a³ + 6/a² + 12/a
    + 8)^(1/3);` `>> simplify(f)` `ans =` `(8*a³ + 12*a² + 6*a + 1)^(1/3)/a` `>> simple(f)`
    `simplify:` `(2*a + 1)/a` `radsimp:` `(12/a + 6/a² + 1/a³ + 8)^(1/3)` `simplify(100):`
    `1/a + 2` `combine(sincos):` `(12/a + 6/a² + 1/a³ + 8)^(1/3)` `combine(sinhcosh):`
    `(12/a + 6/a² + 1/a³ + 8)^(1/3)` `combine(ln):` `(12/a + 6/a² + 1/a³ + 8)^(1/3)`
    `factor:` `(12/a + 6/a² + 1/a³ + 8)^(1/3)` `expand:` `(12/a + 6/a² + 1/a³ + 8)^(1/3)`
    `combine:` `(12/a + 6/a² + 1/a³ + 8)^(1/3)` `rewrite(exp):` `(12/a + 6/a² + 1/a³
    + 8)^(1/3)` `rewrite(sincos):` `(12/a + 6/a² + 1/a³ + 8)^(1/3)` `rewrite(sinhcosh):`
    `(12/a + 6/a² + 1/a³ + 8)^(1/3)` `rewrite(tan):` `(12/a + 6/a ^ 2 + 1/a ^ 3 +
    8) ^(1/3)` `mwcos2sin:` `(12/a + 6/a ^ 2 + 1/a ^ 3 + 8) ^(1/3)` `collect(a):`
    `(12/a + 6/a² + 1/a³ + 8)^(1/3)` `ans =` `1/a + 2` `>> g=simple(f)` `g =` `1/a
    + 2` |

    | `collect(expr)` | 将表达式中的项按变量幂次进行合并。 `>> syms x;` `f = x*(x*(x - 6) + 11) - 6;`
    `>> collect(f)` `ans =` `x³ - 6*x² + 11*x – 6` `>> f = (1+x)*t + x*t;` `>> collect(f)`
    `ans =` `(2*t)*x + t` |

    | `Horner(expr)` | 将表达式表示为嵌套格式（霍纳形式）。 `>> syms x;` `f = x³ - 6*x² + 11*x - 6;`
    `>> horner(f)` `ans =` `x*(x*(x - 6) + 11) - 6` |


    ## 多项式


    MATLAB 提供了专门用于处理多项式的命令，例如求根、微分和插值。下表列出了其中最重要命令的语法和示例。

    '
- fmt: '| `poly2sym(vector)` | Converts a vector of coefficients into the corresponding
    symbolic polynomial (from highest to lowest power). `>> poly2sym([3 5 0 8 9])`
    `ans =` `3*x^4 + 5*x^3 + 8*x + 9` |

    | `poly2sym(vector, ''v'')` | Converts a vector of coefficients into the corresponding
    symbolic polynomial in `v` (from highest to lowest power). `>> poly2sym([3 5 0
    8 9], ''z'')` `ans =` `3*z^4 + 5*z^3 + 8*z + 9` |

    | `sym2poly(polynomial)` | Converts a symbolic polynomial into a vector of coefficients
    (the coefficient are given in decreasing order of power). `>> syms x` `>> sym2poly(x^5
    - 3*x^4 + 2*x^2 - 7*x + 12)` `ans =` `1    -3     0     2    -7    12` |

    | `q = conv(u, v)` | Gives the coefficients of the polynomial product of two polynomials
    whose coefficients are given by the vectors `u` and `v`. `>> u = [3 -1 4 2]; v
    = [2 1 4 6 8 3];` `>> p = conv(u, v)` `p =` `6     1    19    22    36    33    41    28     6`
    `>> poly2sym(p)` `ans =` `6*x^8 + x^7 + 19*x^6 + 22*x^5 + 36*x^4 + 33*x^3 + 41*x^2
    + 28*x + 6` |

    | `[q, r] = deconv(v, u)` | Gives the polynomial quotient and remainder of the
    division between polynomials `u` and `v`, so that `v = conv(u, q) + r`. `>> [q,
    r] = deconv(v, u)` `q =` `0.6667    0.5556    0.6296` `r =` `0         0         0    3.0741    4.3704    1.7407`
    `>> poly2sym(q)` `ans =` `(2*x^2)/3 + (5*x)/9 + 17/27` `>> poly2sym(r)` `ans =`
    `(83*x^2)/27 + (118*x)/27 + 47/27` |

    | `p = poly(r)` | Gives the coefficients of the polynomial `p` whose roots are
    specified by the vector `r`. `>> p = poly(u)` `p =` `1    -8    17     2   -24`
    `>> poly2sym(p)` `ans =` `x^4 - 8*x^3 + 17*x^2 + 2*x - 24` |

    | `k = polyder(p)` `k = polyder(a, b)` `[q, d] = polyder(a, b)` | Gives the coefficients
    `k` of the derivative of the polynomial `p`. Gives the coefficients `k` of the
    derivative of the product of polynomials `a` and `b`. Gives the numerator `q`
    and denominator `d` of the derivative of `a/b`. `>> polyder([1 -8 17 2 -24])`
    `ans =` `4   -24    34     2` `>> poly2sym([1 -8 17 2 -24])` `ans =` `x^4 - 8*x^3
    + 17*x^2 + 2*x - 24` `>> poly2sym(polyder([1 -8 17 2 -24]))` `ans =` `4*x^3 -
    24*x^2 + 34*x + 2` `>> u = [3 -1 4 2]; v = [2 1 4 6 8 3];` `>> k = polyder(u,
    v)` `k =` `48     7   114   110   144    99    82    28` `>> poly2sym(k)` `ans
    =` `48*x^7 + 7*x^6 + 114*x^5 + 110*x^4 + 144*x^3 + 99*x^2 + 82*x + 28` `>> [q,
    d] = polyder(u, v)` `q =` `-12     3   -30   -10     8   -29   -30    -4` `d =`
    `4     4    17    32    60    76   106   120   100    48     9` |

    | `p = polyfit(x, y, n)` `[p, S] = polyfit(x, y, n)` `[p, S, u] = polyfit(x, y,
    n)` | Finds the polynomial of degree `n` which is the best fit of the set of points
    `(x, y)`. Finds the polynomial of degree `n` which is the best fit of the set
    of points `(x, y)` and also returns structure data `S` of the fit. Finds the coefficients
    of the polynomial in `![A978-1-4842-0322-4_4_Fig1_HTML.jpg](A978-1-4842-0322-4_4_Fig1_HTML.jpg)`
    which best fits the data, and also returns the structure data `S` and the row
    vector `![A978-1-4842-0322-4_4_Fig2_HTML.jpg](A978-1-4842-0322-4_4_Fig2_HTML.jpg)`,
    where `m` is the mean and `s` is the standard deviation of the data `x`. `>> u
    = [3 -1 4 2]; v = [2 1 4 6];` `>> p = poly2sym(polyfit(u, v, 3))` `p =` `(53*x^3)/60
    - (99*x^2)/20 + (119*x)/30 + 54/5` `>> [p, S, u] = polyfit(u, v, 3)` `p =` `8.9050    1.6333   -11.3053    6.0000`
    `S =` `R: [4x4 double]` `df: 0` `normr: 1.2686e-014` `u =` `2.0000` `2.1602` |

    | `y = polyval(p, x)` `y = polyval(p, x, [], u)` `[y, delta] = polyval(p, x, S)`
    `[y, delta] = polyval(p, x, S, u)` | Evaluates the polynomial `p` at `x`. If `![A978-1-4842-0322-4_4_Fig3_HTML.jpg](A978-1-4842-0322-4_4_Fig3_HTML.jpg)`,
    evaluates the polynomial `p` at `![A978-1-4842-0322-4_4_Fig4_HTML.jpg](A978-1-4842-0322-4_4_Fig4_HTML.jpg)`.
    Uses the optional output structure `S` generated by `polyfit` to generate error
    estimates `delta`. Does the above with `![A978-1-4842-0322-4_4_Fig5_HTML.jpg](A978-1-4842-0322-4_4_Fig5_HTML.jpg)`
    in place of `x`, where `u = [m, s]`. `>> p = [2 0 -1 7 9]` `p =` `2     0    -1     7     9`
    `>> poly2sym(p)` `ans =` `2*x^4 - x^2 + 7*x + 9` `>> polyval(p, 10)` `ans =` `19979`
    |

    | `Y = polyvalm(p, X)` | For a polynomial `p` and a matrix `X`, evaluates `p(X)`
    in the matrix sense. `>> X = [1 2 3; 4 5 6; 7 8 9]` `X =` `1     2     3` `4     5     6`
    `7     8     9` `>> p = [2 0 -1 7 9]` `p =` `2     0    -1     7     9` `>> A
    = polyval(p, X)` `A =` `17         51         183` `533        1269       2607`
    `4811       8193       13113` |

    | `[r, p, k] = residue(b, a)` `[b, a] = residue(r, p, k)` | Finds the residues,
    poles and direct term of the rational expansion of `b/a`. `![A978-1-4842-0322-4_4_Fig6_HTML.jpg](A978-1-4842-0322-4_4_Fig6_HTML.jpg)`
    Converts the partial fraction expansion back into a quotient of polynomials. `>>
    u = [3 -1 4 2]; v = [2 1 4 6 8 3];` `>> [r, p, k] = residue(v, u)` `r =` `0.4751
    - 0.6032i` `0.4751 + 0.6032i` `0.0745` `p =` `0.3705 + 1.2240i` `0.3705 - 1.2240i`
    `-0.4076` `k =` `0.6667    0.5556    0.6296` `>> [v, u] = residue(r, p, k)` `v
    =` `0.6667    0.3333    1.3333    2.0000    2.6667    1.0000` `u =` `1.0000   -0.3333    1.3333    0.6667`
    |

    | `r = roots(c)` | Gives the column vector `r` of the roots of the polynomial
    with coefficients `c`. `>> v = [0.6667    0.3333    1.3333    2.0000    2.6667    1.0000];`
    `>> r = roots(v)` `r =` `0.6662 + 1.4813i` `0.6662 - 1.4813i` `-0.6662 + 0.8326i`
    `-0.6662 - 0.8326i` `-0.5000` |


    ## Polynomial Interpolation


    MATLAB implements both algebraic and graphical commands for polynomial interpolation,
    the most important of which are summarized in the following table.'
