- fmt: '# Arithmetic Operators


    There are two types of arithmetic operators in MATLAB: matrix arithmetic operators,
    which are governed by the rules of linear algebra, and arithmetic operators on
    vectors, which are performed elementwise. The operators involved are presented
    in the following table.


    | Operator | Role played |

    | --- | --- |

    | `+` | Sum of scalars, vectors, or matrices |

    | `-` | Subtraction of scalars, vectors, or matrices |

    | `*` | Product of scalars or arrays |

    | `.*` | Product of scalars or vectors |

    | `\` | `A\B = inv (A) * B`, where `A` and `B` are matrices |

    | `.\` | `A.\B = [B(i,j) /A (i, j)]`, where `A` and `B` are vectors [`dim (A)
    = dim (B)`] |

    | `/` | Quotient, or `B/A = B * inv (A)`, where `A` and `B` are matrices |

    | `./` | `A / B = [A(i,j)/b (i, j)]`, where `A` and `B` are vectors [`dim (A)
    = dim (B)`] |

    | `^` | Power of a scalar or matrix (`M^p`) |

    | `.^` | Power of vectors (`A. ^ B = [A(i,j) ^(B (i, j))]`, for vectors `A` and
    `B`) |


    Simple mathematical operations between scalars and vectors apply the scalar to
    all elements of the vector according to the defined operation, and simple operators
    between vectors are performed element by element. Below is the specification of
    these operators:


    | `a = {a1, a2,…, an}`, `b = {b1, b2,…, bn}`, `c = scalar` |

    | --- |

    | `a + c = [a1 +c, a2+ c,…, an+c]` | Sum of a scalar and a vector |

    | `a * c = [a1 * c,a2* c ,…, an * c]` | Product of a scalar and a vector |

    | `a + b = [ a1+b1 a2+b2 … an+bn]` | Sum of two vectors |

    | `a. * b = [ a1*b1 a2*b2 … an*bn]` | Product of two vectors |

    | `a. / b = [ a1/b1 a2/b2 … an/bn]` | Ratio to the right of two vectors |

    | `a. \ b = [ a1\b1 a2\b2 … an\bn]` | Ratio to the left of two vectors |

    | `a. ^ c = [a1 ^c, a2^ c ,…, an ^ c]` | Vector to the power of a scalar |

    | `c. ^ a = [c ^ a1,c ^ a2,… ,c ^ an]` | Scalar to the power of a vector |

    | `a.^b = [a1^b1 a2^b2 … an^bn]` | Vector to the power of a vector |


    It must be borne in mind that the vectors must be of the same length and that
    in the product, quotient and power the first operand must be followed by a point.


    The following example involves all of the above operators.


    ```

    >> X = [5,4,3]; Y = [1,2,7]; a = X + Y, b = X-Y, c = x * Y, d = 2\. * X,...

    ```


    ```

    e = 2/X, f = 2\. \Y, g = x / Y, h =. \X, i = x ^ 2, j = 2\. ^ X, k = X. ^ Y

    ```


    ```

    a =


    6     6    10

    ```


    ```

    b =


    4     2    -4

    ```


    ```

    c =


    5     8    21

    ```


    ```

    d =


    10     8     6

    ```


    ```

    e =


    0.4000    0.5000    0.6667

    ```


    ```

    f =


    0.5000    1.0000    3.5000

    ```


    ```

    g =


    5.0000    2.0000    0.4286

    ```


    ```

    h =


    5.0000    2.0000    0.4286

    ```


    ```

    i =


    25    16     9

    ```


    ```

    j =


    32 16 8

    ```


    ```

    k =


    5 16 2187

    ```


    The above operations are all valid since in all cases the variable operands are
    of the same dimension, so the operations are successfully carried out element
    by element. For the sum and the difference there is no distinction between vectors
    and matrices, as the operations are identical in both cases.


    The most important operators for matrix variables are specified below:


    | `A + B`, `A - B`, `A * B` | Addition, subtraction and product of matrices. |

    | `A\B` | If `A` is square, `A\B = inv (A) * B`. If `A` is not square, `A\B` is
    the solution, in the sense of least-squares, of the system `AX = B`. |

    | `B/A` | Coincides with `(A '' \ B'')''`. |

    | `A^n` | Coincides with `A * A * A *… *A n` times (`n` integer). |

    | `p^A` | Performs the power operation only if `p` is a scalar. |


    Here are some examples:


    ```

    >> X = [5,4,3]; Y = [1,2,7]; l = X''* Y, m = X * Y '', n = 2 * X, o = X / Y, p
    = Y\X

    ```


    ```

    l =


    5 10 35

    4  8 28

    3  6 21

    ```


    ```

    m =


    34

    ```


    ```

    n =


    10 8 6

    ```


    ```

    o =


    0.6296

    ```


    ```

    p =


    0         0         0

    0         0         0

    0.7143    0.5714    0.4286

    ```


    All of the above matrix operations are well defined since the dimensions of the
    operands are compatible in every case. We must not forget that a vector is a particular
    case of matrix, but to operate with it in matrix form (not element by element),
    it is necessary to respect the rules of dimensionality for matrix operations.
    For example, the vector operations `X. '' * Y` and `X.*Y''` make no sense, since
    they involve vectors of different dimensions. Similarly, the matrix operations
    `X * Y`, `2/X`, `2\Y`, `X ^ 2`, `2 ^ X` and `X ^ Y` make no sense, again because
    of a conflict of dimensions in the arrays.


    Here are some more examples of matrix operators.


    ```

    >> M = [1,2,3;1,0,2;7,8,9]

    ```


    ```

    M =


    1 2 3

    1 0 2

    7 8 9

    ```


    ```

    >> B = inv (M), C = M ^ 2, D = M ^(1/2), E = 2 ^ M

    ```


    ```

    B =


    -0.8889    0.3333    0.2222

    0.2778   -0.6667    0.0556

    0.4444    0.3333   -0.1111

    ```


    ```

    C =


    24    26    34

    15    18    21

    78    86   118

    ```


    ```

    D =


    0.5219 + 0.8432i   0.5793 - 0.0664i   0.7756 - 0.2344i

    0.3270 + 0.0207i   0.3630 + 1.0650i   0.4859 - 0.2012i

    1.7848 - 0.5828i   1.9811 - 0.7508i   2.6524 + 0.3080i

    ```


    ```

    E =


    1. 0e + 003 *


    0.8626 0.9568 1.2811

    0.5401 0.5999 0.8027

    2.9482 3.2725 4.3816

    ```


    # Relational Operators


    MATLAB also provides relational operators. Relational operators perform element
    by element comparisons between two matrices and return an array of the same size
    whose elements are zero if the corresponding relationship is true, or one if the
    corresponding relation is false. The relational operators can also compare scalars
    with vectors or matrices, in which case the scalar is compared to all the elements
    of the array. Below is a table of these operators.


    | `<` | Less than (for complex numbers this applies only to the real parts) |

    | `<=` | Less than or equal (only applies to real parts of complex numbers) |

    | `>` | Greater than (only applies to real parts of complex numbers) |

    | `>=` | Greater than or equal (only applies to real parts of complex numbers)
    |

    | `x == y` | Equality (also applies to complex numbers) |

    | `x ∼ = y` | Inequality (also applies to complex numbers) |


    # Logical Operators


    MATLAB provides symbols to denote logical operators. The logical operators shown
    in the following table offer a way to combine or negate relational expressions.


    | `∼ A` | Logical negation (NOT) or the complement of `A`. |

    | `A & B` | Logical conjunction (AND) or the intersection of `A` and `B`. |

    | `A \| B` | Logical disjunction (OR) or the union of `A` and `B`. |

    | `XOR (A, B)` | Exclusive OR (XOR) or the symmetric difference of `A` and `B`
    (takes the value 1 if `A` or `B`, but not both, are 1). |


    Here are some examples:


    ```

    >> A = 2:7;P =(A>3) & (A<6)

    ```


    ```

    P =


    0     0     1     1     0     0

    ```


    Returns 1 when the corresponding element of `A` is greater than 3 and less than
    6, and returns 0 otherwise.


    ```

    >> X = 3 * ones (3.3); X >= [7 8 9; 4 5 6 ; 1 2 3]

    ```


    ```

    ans =


    0 0 0

    0 0 0

    1 1 1

    ```


    The elements of the solution array corresponding to those elements of `X` which
    are greater than or equal to the equivalent entry of the matrix `[7 8 9; 4 5 6;
    1 2 3]` are assigned the value 1. The remaining elements are assigned the value
    0.'
