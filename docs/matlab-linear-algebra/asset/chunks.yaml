- fmt: '## The Symmetric and Non-negative Least Squares Methods


    Below are the MATLAB commands that are used to solve equations and systems of
    equations by the symmetric and non-negative least squares methods.


    | `x = symmlq(A,b)` `symmlq(A,b,tol)` `symmlq(A,b,tol,maxit)` `symmlq(A,b,tol,maxit,M)`
    `symmlq(A,b,tol,maxit,M1,M2)` `symmlq(A,b,tol,maxit,M1,M2,x0)` `[x,flag] = symmlq(A,b,…)`
    `[x,flag,relres] = symmlq(A,b,…)` `[x,flag,relres,iter] = symmlq(A,b,…)` | Tries
    to solve the system `Ax = b` by the symmetric LQ method. Solves `Ax = b` by specifying
    the tolerance. Solves `Ax = b` by specifying the tolerance and the maximum number
    of iterations. Solves the system `inv(M) * A * x = inv (M) * b`. Solves the system
    `inv(M) * A * x = inv (M) * b` with `M = M1 * M2`. Solves the system `inv(M) *
    A * x = inv (M) * b` with `M = M1 * M2` and initial value `x0`. Tries to solve
    the system and returns a convergence indicator (`0` = convergence, `1` = no-convergence,
    `2` = ill-conditioned, `3` = stagnation and `4` = very extreme numbers). Also
    returns the relative residual norm `(b-A*x) /norm (b)`. Also returns the number
    of iterations. `>> A=[pi 2*pi 3*pi -pi; 1 0 -1 2; exp(1) exp(2) exp(3) exp(4);
    i 2i 3i -i];` `>> B=[1 2 3 4]'';` `>> [x,f,r,i]=symmlq(A,B, 1e-006,1000)` `x =`
    `0.0121 - 0.0004i` `0.0035 - 0.0001i` `0.1467 - 0.0061i` `0.0001 + 0.0039i` `f
    =` `1` `r =` `0.8325` `i =` `3` |

    | `x = lsqnonneg(C,d)` `x = lsqnonneg(C,d,x0)` `x = lsqnonneg(C,d,x0,opt)` `[x,resnorm]
    = lsqnonneg(…)` `[x,resnorm,residual] = lsqnonneg(…)` `[x,resnorm,residual,f]
    = lsqnonneg(…)` `[x,resnorm,residual,f,out,lambda] = lsqnonneg(…)` | Returns the
    vector `x` that minimizes `norm(C*x-d)` subject to `x >= 0`. `C` and `d` must
    be real. Uses `x0 >= 0` as the initial value and a possible option. The options
    are `TolX` for termination tolerance on `x` and `Display` to show the output (`''off''`
    does not display output, `''final''` shows just the final output and `''notify''`
    shows the output only if there is no convergence). Returns the value of the squared
    2-norm of the residual: `norm(C*x-d)^2`. In addition returns the residual `C *
    x-d`. In addition gives a convergence indicator `f` (positive indicates convergence,
    `0` indicates non-convergence). In addition to the above, returns output data
    describing the algorithm used, iterations taken and exit message, and also the
    vector of Lagrange multipliers `lambda`. `>> A=[1 2 3;5 7 1;2 3 6]; B=[1 3 5]'';
    lsqnonneg(A,B)` `ans =` `0.4857` `0` `0.5714` |'
