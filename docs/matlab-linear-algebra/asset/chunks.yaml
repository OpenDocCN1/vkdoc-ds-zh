    # 算术运算符


    MATLAB 中的算术运算符有两种类型：一种是由线性代数规则支配的矩阵算术运算符，另一种是对向量进行逐元素运算的算术运算符。所涉及的运算符如下表所示。


    | 运算符 | 作用 |

    | --- | --- |

    | `+` | 标量、向量或矩阵的加法 |

    | `-` | 标量、向量或矩阵的减法 |

    | `*` | 标量或数组的乘法 |

    | `.*` | 标量或向量的乘法 |

    | `\` | `A\B = inv (A) * B`，其中 `A` 和 `B` 是矩阵 |

    | `.\` | `A.\B = [B(i,j) /A (i, j)]`，其中 `A` 和 `B` 是向量 [`dim (A) = dim (B)`] |

    | `/` | 除法，或 `B/A = B * inv (A)`，其中 `A` 和 `B` 是矩阵 |

    | `./` | `A / B = [A(i,j)/b (i, j)]`，其中 `A` 和 `B` 是向量 [`dim (A) = dim (B)`] |

    | `^` | 标量或矩阵的幂（`M^p`） |

    | `.^` | 向量的幂（对于向量 `A` 和 `B`，`A. ^ B = [A(i,j) ^(B (i, j))]`） |


    标量与向量之间的简单数学运算会将标量根据定义的运算应用于向量的所有元素，而向量之间的简单运算符是逐元素执行的。以下是这些运算符的详细说明：


    | `a = {a1, a2,…, an}`, `b = {b1, b2,…, bn}`, `c = 标量` |

    | --- |

    | `a + c = [a1 +c, a2+ c,…, an+c]` | 标量与向量之和 |

    | `a * c = [a1 * c,a2* c ,…, an * c]` | 标量与向量之积 |

    | `a + b = [ a1+b1 a2+b2 … an+bn]` | 两个向量之和 |

    | `a. * b = [ a1*b1 a2*b2 … an*bn]` | 两个向量之积 |

    | `a. / b = [ a1/b1 a2/b2 … an/bn]` | 两个向量的右除 |

    | `a. \ b = [ a1\b1 a2\b2 … an\bn]` | 两个向量的左除 |

    | `a. ^ c = [a1 ^c, a2^ c ,…, an ^ c]` | 向量的标量次幂 |

    | `c. ^ a = [c ^ a1,c ^ a2,… ,c ^ an]` | 标量的向量次幂 |

    | `a.^b = [a1^b1 a2^b2 … an^bn]` | 向量的向量次幂 |


    必须牢记，向量的长度必须相同，并且在乘法、除法和幂运算中，第一个操作数后面必须跟一个点。


    以下示例涉及上述所有运算符。


    ```

    >> X = [5,4,3]; Y = [1,2,7]; a = X + Y, b = X-Y, c = x * Y, d = 2\. * X,...

    ```


    ```

    e = 2/X, f = 2\. \Y, g = x / Y, h =. \X, i = x ^ 2, j = 2\. ^ X, k = X. ^ Y

    ```


    ```

    a =


    6     6    10

    ```


    ```

    b =


    4     2    -4

    ```


    ```

    c =


    5     8    21

    ```


