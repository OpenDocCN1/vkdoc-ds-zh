- fmt: '# Solving Equations and Systems of Equations


    MATLAB includes multiple commands for solving equations and systems of equations.
    The following sections present the syntax and main features of these methods.


    ## General Methods


    Below are the most common MATLAB commands used to solve equations and systems


    | `solve(''equation'',''x'')` | Solve the equation in the variable `x`. The equation
    is solved as follows: ```>> solve(''p*sin(x) = r'')``` `ans =` `asin(r/p)` `pi
    - asin(r/p)` |

    | `syms x; solve(equ(x), x)` | Solve the equation `equ` in the variable `x`. The
    equation is solved as follows: ```>> syms x r; solve(p * cos(x) - r, x)``` `ans
    =` `acos((8192*r)/1433639)` `-acos((8192*r)/1433639)` |

    | `solve(''eq1,eq2,…,eqn'', ''x1, x2,…,xn'')` | Solves the `n` simultaneous equations
    `eq1,…, eqn` (the solutions are assigned to the variables `x1,…, xn`) ```>> [x,
    y] = solve(''x^2 + x*y + y = 3'',''x^2-4*x + 3 = 0'')``` `x =` `1` `3` `y =` `1`
    `-3/2` |

    | `syms x1 x2…xn; solve(eq1,eq2,…,eqn, x1, x2,…,xn)` | Solves the `n` simultaneous
    equations `eq1,…, eqn` (the solutions are assigned to the variables `x1,…, xn`)
    ```>> syms x y; [x, y] = solve(x^2 + x*y + y-3, x^2-4*x + 3)``` `x =` `1` `3`
    `y =` `1` `-3/2` |

    | `X = linsolve(A, B)` | Solves the equation `A * X = B` where `A`,`B` and `X`
    are matrices. We solve the system: ```>> A = [2,1,1,1;1,2,1,1;1,1,2,1;1,1,1,2];
    B = [1,2,3,4]'';``` `linsolve(A, B)` `ans =` `-1` `0` `1` `2` |

    | `x = lscov(A,B)` `x = lscov(A,B,V)` | Solves the equation `A * x = B` in the
    least squares sense, i.e., `x` is the n×1 vector that minimizes the sum of squared
    errors. Solves in the least squares sense with covariance matrix proportional
    to `V`, i.e. `x` minimizes. ```>> A = [2,1,1,1;1,2,1,1;1,1,2,1;1,1,1,2]; B = [1,2,3,4]'';```
    `lscov(A, B)` `ans =` `-1` `0` `1` `2` |

    | `X = A\B` | Solves the system. ```>> A = [2,1,1,1;1,2,1,1;1,1,2,1;1,1,1,2];
    B = [1,2,3,4]'';``` `A\B` `ans =` `-1.0000` `-0.0000` `1.0000` `2.0000` |

    | `X = A/B` | Solves the system. |

    | `roots(A)` | Returns the roots of the polynomial whose coefficients are given
    by the vector `A` (from highest to lowest order). As example we find the roots
    of the polynomial. ```>> roots([1 2 3 4])``` `ans =` `-1.6506` `-0.1747 + 1.5469i`
    `-0.1747 - 1.5469i` |

    | `poly(V)` | Returns the coefficients of the polynomial whose roots are given
    by the vector `V`. ```>> poly([1 2 3 4])``` `ans =` `1 1 -10 -10 35 -50 24` |

    | `x = fzero(x0) (function)` | Returns a zero of the function near `x0`. ```>>
    X = fzero(''sin(x) - 1'', pi/2)``` `X =` `1.5708` |

    | `[x, fval] = fzero(x0, fun)` | Also returns the objective value of the function
    at `x`. ```>> [F, x] = fzero(''sin(x) - 1'', pi/2)``` `X =` `1.5708` `f =` `0`
    |


    ## The Biconjugate Gradient Method


    Below are the MATLAB commands that can be used to solve equations and systems
    of equations by the biconjugate gradient method.


    | `x = bicg(A,b)` `bicg(A,b,tol)` `bicg(A,b,tol,maxit)` `bicg(A,b,tol,maxit,M)`
    `bicg(A,b,tol,maxit,M1,M2)` `bicg(A,b,tol,maxit,M1,M2,x0)` `[x,f] = bicg(A,b,…)`
    | Tries to solve the system `Ax = b` by the method of biconjugate gradients. ```>>
    A = [2 pi * pi 3 * pi - pi; 1 0 - 1 2; exp(1) exp(2) exp(3) exp(4); i 2i 3i -
    i];``` ```>> B = [1 2 3 4]'';``` ```>> bicg(A, B)``` `bicg stopped at iteration
    4 without converging to the desired tolerance 1e-006 because the maximum number
    of iterations was reached. The iterate returned (number 0) has relative residual
    1` `ans =` `0` `0` `0` `0` Solves `Ax = b` by specifying tolerance. Solves `Ax
    = b` by specifying the tolerance and the maximum number of iterations. ```>> bicg(A,B,
