  trans: '

    | `bar3(Y)` | 根据频率向量 `Y` 创建一个三维条形图。如果 `Y` 是一个矩阵，则在同一个坐标轴上生成多个条形图，每个条形图对应 `Y` 的一行。
    `>> bar3(rand(4, 4))` ![A978-1-4842-0322-4_3_Figay_HTML.jpg](img/A978-1-4842-0322-4_3_Figay_HTML.jpg)
    |

    | `bar3(x,Y)` | 根据频率向量 `Y` 创建一个三维条形图，其中 `x` 是一个定义条形 x 轴位置的向量。 |

    | `bar3(...,width)` | 创建一个具有指定条形宽度的三维条形图。默认宽度为 0.8，宽度为 1 时条形会彼此接触。 |

    | `bar3(...,''style'')` | 创建一个具有指定条形样式的三维条形图。可能的样式有 `''detached''`（默认）、`''grouped''`（分组垂直条形）和
    `''stacked''`（堆叠条形，对应 `Y` 中的每一行）。 |

    | `bar3(...,color)` | 创建一个所有条形均为指定颜色的三维条形图（`r` = 红色，`g` = 绿色，`b` = 蓝色，`c` = 青色，`m`
    = 品红色，`y` = 黄色，`k` = 黑色，`w` = 白色）。 |

    | `comet3(z)`, `comet3(x,y,z)` | 创建向量 `z` 或参数空间曲线 `(x(t), y(t), z(t))` 的三维彗星图动画。
    `>> t = -pi:pi/500:pi; comet3(sin(5*t), cos(3*t), t)` ![A978-1-4842-0322-4_3_Figaz_HTML.jpg](img/A978-1-4842-0322-4_3_Figaz_HTML.jpg)
    |

    | `[X, Y, Z] = cylinder`, `[X, Y, Z] = cylinder(r(t))`, `[X, Y, Z] = cylinder(r(t),
    n)`, `cylinder(...)` | 返回一个位于原点、半径为 1、长度为 1（沿 z 轴对齐）且圆周上有 20 个等间距点的圆柱体坐标。返回由曲线
    `r` 生成的圆柱体坐标。返回由曲线 `r` 生成的圆柱体坐标，圆周上有 `n` 个点（默认 `n = 20`）。可以使用命令 `surf` 或 `cylinder(...)`
    绘制以上创建的圆柱体。 `>> t = 0:pi/10:2*pi;` `[X, Y, Z] = cylinder(2+cos(t));` `surf(X,
    Y, Z)` ![A978-1-4842-0322-4_3_Figba_HTML.jpg](img/A978-1-4842-0322-4_3_Figba_HTML.jpg)
