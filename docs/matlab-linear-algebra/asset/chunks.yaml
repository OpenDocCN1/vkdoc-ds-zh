    ## 多项式插值


    MATLAB 提供了用于多项式插值的代数命令和图形命令，下表中总结了其中最重要的部分。

    '
- fmt: '| `Yi = interp1(X, Y, Xi)` `Yi = interp1(Y, Xi)` `Yi = interp1(X, Y, Xi, method)`
    `Yi = interp1(X, Y, Xi, method, ext)` | Returns a vector `Yi` such that `(Xi,
    Yi)` is the total set of points found by one-dimensional linear interpolation
    of the given set of points `(X, Y)`. Equivalent to `interp1(X,Y,Xi)` with `X =
    1:n`, where `n` is the length of `Y`. Performs the interpolation using the given
    `method`, which can be `nearest` (nearest neighbor), `linear`, `cubic` (cubic
    Hermite), `v5cubic` (MATLAB 5 cubic), `spline` or `pchip` (cubic Hermite). Additionally
    specifies a strategy `ext` for evaluating points that lie outside the domain of
    `X`. In the following example, 21 points `(x,y)` are interpolated depending on
    the function `y = sin(x)` for `x` values equally spaced between 0 and 10.

