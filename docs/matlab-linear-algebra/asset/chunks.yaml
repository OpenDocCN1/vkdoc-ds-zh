    The C [i] values may be: ‘r’, ‘g’, ‘b’, ‘c’, ‘m’, ‘y’, ‘w’, ‘k’, whose meanings
    we already know. If C is a single character, all vertices of the polygon will
    be assigned the specified color. If X and Y are matrices of the same size then
    several polygons will be created, each corresponding to the columns of the matrices.
    In this case, C can be a row vector specifying the color of each polygon, or it
