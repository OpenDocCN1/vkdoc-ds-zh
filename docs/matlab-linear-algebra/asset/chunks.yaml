    0.5000;` `1.0000 0.5000 0.5000 0.1667;` `0.3330 0.3330 0.5000 0.5000];` `fill3(X,Y,Z,C)`
    ![A978-1-4842-0322-4_3_Figal_HTML.jpg](A978-1-4842-0322-4_3_Figal_HTML.jpg) |

    | fill3(X1,Y1,Z1,C1, X2, Y2, Z2, C2,…) | Draws the filled polygon whose vertices
    and colors are given by (Xi, Yi, Zi, Ci). |

    | ezplot3(x(t), y(t), z(t)) ezplot3(x(t),y(t),z(t), [tmin,tmax]) | Draws the space
    curve defined by the given three parametric components. Draws the space curve
    defined by the given three parametric components for the specified range of variation
    of the parameter. `>> ezplot3 (''sin (t)'', ''cos (t)'', '', [0, 6 * pi])` ![A978-1-4842-0322-4_3_Figam_HTML.jpg](A978-1-4842-0322-4_3_Figam_HTML.jpg)
