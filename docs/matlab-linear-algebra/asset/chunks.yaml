    `-7.1997 + 1\. 2216i` `3.2729 0\. 5553i` `-0.4360 + 0\. 0740i` Solves the system
    inv(M) * A * x = inv (M) * b. Solves the system inv(M) * A * x = inv (M) * b with
    M = M1 * M2. Solves the system inv(M) * A * x = inv (M) * b with M = M1 * M2 and
    initial value x0. Tries to solve the system and also returns a convergence indicator
    f  (0 = convergence, 1 = no-convergence, 2 = ill-conditioned, 3 = stagnation and
    4 = very extreme numbers). `>> [x, f] = bicg(A,B, 1e-009,100)` `x =` `1\. 0e +
    016 *` `4.1449 0\. 7033i` `-7.1997 + 1\. 2216i` `3.2729 0\. 5553i` `-0.4360 +
    0\. 0740i` `f =` `3` |

    | x = bicgstab(A,b) bicgstab(A,b,tol) bicgstab(A,b,tol,maxit) | Tries to solve
    the system Ax = b by the method of stabilized biconjugate gradients. `>> bicgstab
    (A, B)` `bicgstab stopped at iteration 4 without converging to the desired tolerance
    1e-006` `because the maximum number of iterations was reached.` `The iterate returned
    (number 4) has relative residual 0.88` `ans =` `1\. 0e + 011 *` `0.6696-0\. 4857i`
    `-1.1631 + 0\. 8437i` `0.5287 0\. 3835i` `-0.0704 + 0\. 0511i` Solves Ax = b by
    specifying tolerance. Solves Ax = b by specifying the tolerance and the maximum
    number of iterations. `>> bicg(A,B, 1e-009,100)` `ans =` `1\. 0e + 016 *` `4.1449
    0\. 7033i` `-7.1997 + 1\. 2216i` `3.2729 0\. 5553i` `-0.4360 + 0\. 0740i` |

    | bicgstab(A,b,tol,maxit,M) bicgstab(A,b,tol,maxit,M1,M2) bicgstab(A,b,tol,maxit,M1,M2,x0)
    [x,f] = bicgstab(A,b,…) [x,f,relres] = bicgstab(A,b,…) [x,f,relres,iter] = bicgstab(A,b,…)
    | Solves the system inv(M) * A * x = inv (M) * b. Solves the system inv(M) * A
    * x = inv (M) * b with M = M1 * M2. Solves the system inv(M) * A * x = inv (M)
    * b with M = M1 * M2 and initial value x0. Tries to solve the system and returns
    a convergence indicator f (0 = convergence, 1 = no-convergence, 2 =ill-conditioned,
    3 = stagnation and 4 = very extreme numbers). Also returns the relative residual
    norm(b-A*x) /norm (b) Also returns the number of iterations `>> [x, f, r, i] =
    bicg(A,B, 1e-006,100)` x =`1\. 0e + 016 *` `4.1449 0\. 7033i` `-7.1997 + 1\. 2216i`
    `3.2729 0\. 5553i` `-0.4360 + 0\. 0740i` `f =` `3` `r =` `26.0415` `i =` `18`
    |'
  trans: '

    # 求解方程与方程组


    MATLAB 包含多个用于求解方程和方程组的命令。以下各节将介绍这些方法的语法和主要功能。


    ## 通用方法


    以下是用于求解方程和方程组的最常用 MATLAB 命令


    | `solve(''equation'',''x'')` | 求解变量 `x` 的方程。方程求解如下： ```>> solve(''p*sin(x) =
    r'')``` `ans =` `asin(r/p)` `pi - asin(r/p)` |

    | `syms x; solve(equ(x), x)` | 求解变量 `x` 的方程 `equ`。方程求解如下： ```>> syms x r; solve(p
    * cos(x) - r, x)``` `ans =` `acos((8192*r)/1433639)` `-acos((8192*r)/1433639)`
    |

    | `solve(''eq1,eq2,…,eqn'', ''x1, x2,…,xn'')` | 求解 `n` 个联立方程 `eq1,…, eqn`（解赋给变量
    `x1,…, xn`） ```>> [x, y] = solve(''x² + x*y + y = 3'',''x²-4*x + 3 = 0'')``` `x
    =` `1` `3` `y =` `1` `-3/2` |

    | `syms x1 x2…xn; solve(eq1,eq2,…,eqn, x1, x2,…,xn)` | 求解 `n` 个联立方程 `eq1,…, eqn`（解赋给变量
    `x1,…, xn`） ```>> syms x y; [x, y] = solve(x² + x*y + y-3, x²-4*x + 3)``` `x =`
    `1` `3` `y =` `1` `-3/2` |

    | `X = linsolve(A, B)` | 求解方程 `A * X = B`，其中 `A`、`B` 和 `X` 是矩阵。求解系统： ```>> A =
    [2,1,1,1;1,2,1,1;1,1,2,1;1,1,1,2]; B = [1,2,3,4]'';``` `linsolve(A, B)` `ans =`
    `-1` `0` `1` `2` |

    | `x = lscov(A,B)` `x = lscov(A,B,V)` | 以最小二乘意义求解方程 `A * x = B`，即 `x` 是使平方误差和最小的
    n×1 向量。以最小二乘意义求解，协方差矩阵与 `V` 成比例，即 `x` 最小化。 ```>> A = [2,1,1,1;1,2,1,1;1,1,2,1;1,1,1,2];
    B = [1,2,3,4]'';``` `lscov(A, B)` `ans =` `-1` `0` `1` `2` |

    | `X = A\B` | 求解系统。 ```>> A = [2,1,1,1;1,2,1,1;1,1,2,1;1,1,1,2]; B = [1,2,3,4]'';```
    `A\B` `ans =` `-1.0000` `-0.0000` `1.0000` `2.0000` |

    | `X = A/B` | 求解系统。 |

    | `roots(A)` | 返回多项式的根，其系数由向量 `A` 给出（从最高次到最低次）。示例为求多项式的根。 ```>> roots([1 2 3 4])```
    `ans =` `-1.6506` `-0.1747 + 1.5469i` `-0.1747 - 1.5469i` |

    | `poly(V)` | 返回多项式的系数，其根由向量 `V` 给出。 ```>> poly([1 2 3 4])``` `ans =` `1 1 -10
    -10 35 -50 24` |

    | `x = fzero(x0) (function)` | 返回函数在 `x0` 附近的零点。 ```>> X = fzero(''sin(x) - 1'',
    pi/2)``` `X =` `1.5708` |

    | `[x, fval] = fzero(x0, fun)` | 还返回函数在 `x` 处的目标值。 ```>> [F, x] = fzero(''sin(x)
    - 1'', pi/2)``` `X =` `1.5708` `f =` `0` |


    ## 双共轭梯度法


    以下是可通过双共轭梯度法求解方程和方程组的 MATLAB 命令。


    | `x = bicg(A,b)` `bicg(A,b,tol)` `bicg(A,b,tol,maxit)` `bicg(A,b,tol,maxit,M)`
    `bicg(A,b,tol,maxit,M1,M2)` `bicg(A,b,tol,maxit,M1,M2,x0)` `[x,f] = bicg(A,b,…)`
    | 尝试通过双共轭梯度法求解系统 `Ax = b`。 ```>> A = [2 pi * pi 3 * pi - pi; 1 0 - 1 2; exp(1)
    exp(2) exp(3) exp(4); i 2i 3i - i];``` ```>> B = [1 2 3 4]'';``` ```>> bicg(A,
    B)``` `bicg stopped at iteration 4 without converging to the desired tolerance
    1e-006 because the maximum number of iterations was reached. The iterate returned
    (number 0) has relative residual 1` `ans =` `0` `0` `0` `0` 通过指定容差求解 `Ax = b`。通过指定容差和最大迭代次数求解
    `Ax = b`。 ```>> bicg(A,B, 1e-009,100)``` `ans =` `1.0e + 016 *` `4.1449 0.7033i`
    `-7.1997 + 1.2216i` `3.2729 0.5553i` `-0.4360 + 0.0740i` 求解系统 `inv(M) * A * x
    = inv(M) * b`。用 `M = M1 * M2` 求解系统 `inv(M) * A * x = inv(M) * b`。用 `M = M1 * M2`
    和初始值 `x0` 求解系统 `inv(M) * A * x = inv(M) * b`。尝试求解系统并返回收敛指示符 `f`（0 = 收敛，1 = 未收敛，2
    = 病态，3 = 停滞，4 = 极极端数值）。 ```>> [x, f] = bicg(A,B, 1e-009,100)``` `x =` `1.0e +
    016 *` `4.1449 0.7033i` `-7.1997 + 1.2216i` `3.2729 0.5553i` `-0.4360 + 0.0740i`
    `f =` `3` |

    | `x = bicgstab(A,b)` `bicgstab(A,b,tol)` `bicgstab(A,b,tol,maxit)` | 尝试通过稳定双共轭梯度法求解系统
    `Ax = b`。 ```>> bicgstab(A, B)``` `bicgstab stopped at iteration 4 without converging
    to the desired tolerance 1e-006 because the maximum number of iterations was reached.
    The iterate returned (number 4) has relative residual 0.88` `ans =` `1.0e + 011
    *` `0.6696-0.4857i` `-1.1631 + 0.8437i` `0.5287 0.3835i` `-0.0704 + 0.0511i` 通过指定容差求解
    `Ax = b`。通过指定容差和最大迭代次数求解 `Ax = b`。 ```>> bicg(A,B, 1e-009,100)``` `ans =` `1.0e
    + 016 *` `4.1449 0.7033i` `-7.1997 + 1.2216i` `3.2729 0.5553i` `-0.4360 + 0.0740i`
    |

    | `bicgstab(A,b,tol,maxit,M)` `bicgstab(A,b,tol,maxit,M1,M2)` `bicgstab(A,b,tol,maxit,M1,M2,x0)`
    `[x,f] = bicgstab(A,b,…)` `[x,f,relres] = bicgstab(A,b,…)` `[x,f,relres,iter]
    = bicgstab(A,b,…)` | 求解系统 `inv(M) * A * x = inv(M) * b`。用 `M = M1 * M2` 求解系统 `inv(M)
    * A * x = inv(M) * b`。用 `M = M1 * M2` 和初始值 `x0` 求解系统 `inv(M) * A * x = inv(M)
    * b`。尝试求解系统并返回收敛指示符 `f`（0 = 收敛，1 = 未收敛，2 = 病态，3 = 停滞，4 = 极极端数值）。还返回相对残差 `norm(b-A*x)
    /norm(b)`。还返回迭代次数。 ```>> [x, f, r, i] = bicg(A,B, 1e-006,100)``` `x =` `1.0e +
    016 *` `4.1449 0.7033i` `-7.1997 + 1.2216i` `3.2729 0.5553i` `-0.4360 + 0.0740i`
    `f =` `3` `r =` `26.0415` `i =` `18` |

