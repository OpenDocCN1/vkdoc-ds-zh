  生成的圆柱体坐标。返回由曲线 `r` 生成的圆柱体坐标，圆周上有 `n` 个点（默认 `n = 20`）。可以使用命令 `surf` 或 `cylinder(...)`
  绘制以上创建的圆柱体。 `>> t = 0:pi/10:2*pi;` `[X, Y, Z] = cylinder(2+cos(t));` `surf(X, Y,
  Z)` ![A978-1-4842-0322-4_3_Figba_HTML.jpg](img/A978-1-4842-0322-4_3_Figba_HTML.jpg)
  |

  | `sphere` | 绘制中心在原点的单位球体，使用 20×20 个面。 |

