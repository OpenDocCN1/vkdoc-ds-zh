  t = - pi:pi/200:pi;comet(t,tan(sin(t))-sin(tan(t)))` ![A978-1-4842-0322-4_3_Figbf_HTML.jpg](img/A978-1-4842-0322-4_3_Figbf_HTML.jpg)
