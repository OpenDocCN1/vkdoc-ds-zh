  \ -2;-3 3 2;-1 -3 -1])`\n\n```\nans =\n\n  -9\n```\n\n所以，向量组`{{0 - 3 - 2};{-3 3\
  \ 2}; {- 1 -3 - 1}}`构成了像的一组基。\n\n作为第八个例子，我们考虑实数三维空间中两个向量子空间`U`和`V`之间的线性变换`f`，对于`U`中的`(a,\
