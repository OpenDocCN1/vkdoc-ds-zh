  `plot(X,Y)` 相同，只是填充了 `0` 和 `Y` 之间的区域。指定面积填充的基准值（默认值为 `0`）。<br> `>> Y = [1, 5, 3;
  3, 2, 7; 1, 5, 3; 2, 6, 1]; area(Y)` ![A978-1-4842-0322-4_3_Figbe_HTML.jpg](img/A978-1-4842-0322-4_3_Figbe_HTML.jpg)
