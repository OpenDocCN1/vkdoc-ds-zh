  \n\n\n# 5. 矩阵、向量空间与线性变换\n\n## 矩阵符号表示\n\n在变量专用章节中我们已经了解了如何在 MATLAB 中表示向量和矩阵，但在此我们重新回顾一下表示法。\n\
  \n考虑矩阵\n\n![A978-1-4842-0322-4_5_Fig1_HTML.jpg](img/A978-1-4842-0322-4_5_Fig1_HTML.jpg)\n\
  \n你可以通过以下方式在 MATLAB 中输入该矩阵：\n\n`A = [a11,a12,...,a1n ; a21,a22,...,a2n ; ... ; am1,am2,...,amn]`\n\
  \n`A = [a11 a12 ... a1n ; a21 a22 ... a2n ; ... ; am1 am2 ... amn]`\n\n另一方面，向量 `V\
  \ =(v1,v2,...,vn)` 作为单行矩阵（即维度为 1×n 的矩阵）的特例，可按以下形式输入：\n\n`V = [v1, v2, ..., vn]`\n\
  \n`V = [v1 v2 ... vn]`\n\n## 矩阵运算\n\nMATLAB 包含多种命令，可对矩阵执行最常见的符号运算和数值运算。下表列出了其中最重要的运算操作。\n\
  \n\n\n| `A + B` | 矩阵 `A` 和 `B` 的和 |\n|--------|--------------------------|\n\n```\n\
  >> A=[-1 7 2;i -i 8; 3 1 4]\nA =\n  -1.0000             7.0000             2.0000\n\
  \  0 + 1.0000i        0 - 1.0000i             8.0000\n  3.0000             1.0000\
  \             4.0000\n>> B=[1 2 3; 1+i 1-2i 1-3i; -3 -5 -i]\nB =\n  1.0000     \
  \        2.0000                 3.0000\n  1.0000 + 1.0000i   1.0000 - 2.0000i  \
  \     1.0000 - 3.0000i\n -3.0000            -5.0000            0 - 1.0000i\n>> A+B\n\
  ans =\n  0              9.0000                 5.0000\n  1.0000 + 2.0000i   1.0000\
  \ - 3.0000i      9.0000 - 3.0000i\n  0             -4.0000      4.0000 - 1.0000i\n\
  ```\n\n| `A – B` | 矩阵 `A` 和 `B` 的差 |\n|---------|------------------------------------|\n\
  \n```\n>> A-B\nans =\n -2.0000                       5.0000                    \
  \  -1.0000\n -1.0000            -1.0000 + 1.0000i             7.0000 + 3.0000i\n\
  \  6.0000                       6.0000             4.0000 + 1.0000i\n```\n\n| `A\
  \ * B` | 矩阵 `A` 和 `B` 的积 |\n|---------|--------------------------------|\n\n```\n\
  >> A*B\nans =\n  0 + 7.0000i  -5.0000 -14.0000i   4.0000 -23.0000i\n -23.0000 -42.0000\
  \ + 1.0000i  -3.0000 - 6.0000i\n -8.0000 + 1.0000i -13.0000 - 2.0000i  10.0000 -\
  \ 7.0000i\n```\n\n| `c * A` | 标量与矩阵的乘积 |\n|---------|----------------------------------|\n\
  \n```\n>> i*A\nans =\n  0 - 1.0000i         0 + 7.0000i              0 + 2.0000i\n\
  \ -1.0000              1.0000              0 + 8.0000i\n  0 + 3.0000i         0\
  \ + 1.0000i              0 + 4.0000i\n```\n\n| `expm(A)` | 通过特征值计算的矩阵指数 `e^A` |\n\
  |-----------|---------------------------------------------------------|\n\n```\n\
  >> expm(A)\nans =\n  1.0e+003 *\n  0.5710 + 0.0674i   0.7081 - 0.0337i   1.7019\
  \ - 0.0338i\n  0.5710 + 0.0674i   0.7081 - 0.0337i   1.7018 - 0.0337i\n  0.5710\
  \ + 0.0675i   0.7082 - 0.0337i   1.7018 - 0.0337i\n```\n\n| `expm1(A)` | 通过 Padé\
  \ 近似计算的矩阵指数 `e^A` |\n|------------|---------------------------------------------------------------|\n\
  \n```\n>> expm1(A)\nans =\n  1.0e+003 *\n -0.0006             1.0956           \
  \  0.0064\n -0.0005 + 0.0008i  -0.0005 - 0.0008i   2.9800\n  0.0191            \
  \ 0.0017             0.0536\n```\n\n| `logm(A)` | `A` 的矩阵自然对数 |\n|-----------|--------------------------------------|\n\
  \n```\n>> logm(A)\nans =\n  1.3756 + 0.0063i   2.4201 + 0.4906i  -1.7163 - 0.4969i\n\
  \ -0.9903 + 0.1445i   1.7284 - 0.2954i   1.3413 + 0.1509i\n  0.6464 - 0.0412i  \
