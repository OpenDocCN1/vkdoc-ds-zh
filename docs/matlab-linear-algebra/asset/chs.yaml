  \n\n\n## 矩阵分解。特征向量与特征值\n\nMATLAB 实现了大多数已知矩阵分解的命令，并能让您轻松处理特征值与特征向量。下表展示了最常用命令的语法。\n\
  \n\n\n| `eig(A)` | 计算方阵`A`的特征值。\n```\n>> A=rand(4)\nA =\n0.8147    0.6324    0.9575\
  \    0.9572\n0.9058    0.0975    0.9649    0.4854\n0.1270    0.2785    0.1576  \
  \  0.8003\n0.9134    0.5469    0.9706    0.1419\n>> B=sym('[1, a, a²;1, a, -a;0,\
  \ 0, 1]')\nB =\n[ 1, a, a²]\n[ 1, a,  -a]\n[ 0, 0,   1]\n>> eig(A)\nans = 2.4021\
  \ -0.0346 -0.7158 -0.4400\n>> [V1,D1]=eig(B)\nV1 =\n[ -a, a², 1]\n[  1,  -a, 1]\n\
  [  0,   1, 0]\nD1 =\n[ 0, 0,     0]\n[ 0, 1,     0]\n[ 0, 0, a + 1]\n```\n| `eig(A,\
  \ B)` | 返回一个向量，包含方阵`A`和`B`的广义特征值。\n```\n>> C=randn(4)\nC =\n-0.1241    0.6715  \
  \  0.4889    0.2939\n1.4897   -1.2075    1.0347   -0.7873\n1.4090    0.7172    0.7269\
  \    0.8884\n1.4172    1.6302   -0.3034   -1.1471\n>> eig(A,C)\nans =\n0.6654 +\
  \ 0.6533i\n0.6654 - 0.6533i\n0.0259\n0.1997\n```\n| `[V, D] = eig(A, B)` | 返回对角矩阵`D`（包含`A`和`B`的广义特征值）和矩阵`V`（其列是相应的特征向量），使得`A\
  \ * V = B * V * D`。\n```\n>> [V2,D2]=eig(A,C)\nV2 =\n0.2665 - 0.0340i   0.2665 +\
  \ 0.0340i   1.0000   0.4002\n-0.3908 + 0.0213i  -0.3908 - 0.0213i   0.0953  -1.0000\n\
  -0.8463 - 0.1537i  -0.8463 + 0.1537i  -0.9489  -0.1449\n0.6062 - 0.2931i   0.6062\
  \ + 0.2931i   0.0211   0.3193\nD2 =\n0.6654 + 0.6533i                   0      \
  \    0                  0\n0    0.6654 - 0.6533i          0                  0\n\
  0                   0     0.0259                  0\n0                   0     \
  \     0             0.1997\n```\n| `[AA, BB, Q, Z, V] = qz(A, B)` | 计算上三角矩阵`AA`和`BB`以及矩阵`Q`和`Z`，使得`Q\
  \ * A * Z = AA`和`Q * B * Z = BB`，并给出`A`和`B`的广义特征向量矩阵`V`，使得`A * V * diag(BB) = B\
  \ * V * diag(AA)`。\n```\n>> [AA, CC, Q, Z, V] = qz (A, C)\nAA =\n0.6430 - 0.6312i\
  \   0.9129 - 1.0466i   1.2477 - 0.7149i  -0.1102 + 0.2576i\n0   0.9818 + 0.9639i\
  \  -0.1338 + 0.8139i   0.2874 + 0.0652i\n0                  0             0.0482\
  \             0.0822\n0                  0                  0             0.4374\n\
  CC =\n0.9663             0.1979 + 0.6630i   1.5008 - 0.7681i  -0.2960 + 0.0079i\n\
  0                       1.4756  -0.0309 + 1.0436i  -0.1974 - 0.3071i\n0        \
  \                    0             1.8638             0.1951\n0                \
  \            0                  0             2.1900\nQ =\n0.4727 - 0.0698i   0.3875\
  \ - 0.1637i   0.1251 + 0.3290i   0.4287 - 0.5358i\n0.2342 + 0.4500i   0.0410 + 0.2938i\
  \   0.5545 + 0.3640i  -0.4572 + 0.0751i\n-0.5656            -0.0713            \
  \ 0.6541             0.4972\n0.4410            -0.8544             0.0909      \
  \       0.2594\nZ =\n-0.1939 - 0.1152i   0.0800 + 0.0321i   0.8930            -0.3798\n\
  0.2939 + 0.1469i  -0.0424 - 0.0841i   0.4423             0.8292\n0.7032 + 0.1644i\
  \   0.4323 - 0.4410i   0.0188            -0.3110\n-0.3690 - 0.4283i   0.7481 - 0.2067i\
  \  -0.0812             0.2673\nV =\n-0.2235 - 0.1328i   0.1328 + 0.2235i   1.0000\
  \ + 0.0000i  -0.4002 - 0.0000i\n0.3388 + 0.1694i  -0.1694 - 0.3388i   0.0953 - 0.0000i\
  \   1.0000 + 0.0000i\n0.8106 + 0.1894i  -0.1894 - 0.8106i  -0.9489 - 0.0000i   0.1449\
  \ + 0.0000i\n-0.4253 - 0.4937i   0.4937 + 0.4253i   0.0211 - 0.0000i  -0.3193 +\
  \ 0.0000i\n```\n| `[T, B] = balance(A)` | 返回一个相似变换矩阵`T`，使得`B = T\\A*T`，并且`B`具有尽可能接近相等的行范数和列范数。矩阵`B`被称为`A`的平衡矩阵。\n\
  ```\n>> [T,B2]=balance(A)\nT =\n1.0000         0         0         0\n0    1.0000\
  \         0         0\n0         0    0.5000         0\n0         0         0  \
  \  1.0000\nB2 =\n0.8147    0.6324    0.4788    0.9572\n0.9058    0.0975    0.4824\
  \    0.4854\n0.2540    0.5570    0.1576    1.6006\n0.9134    0.5469    0.4853  \
  \  0.1419\n```\n| `balance(A)` | 计算`A`的平衡矩阵`B`。这用于在`A`的特征值难以估计时对其进行近似。我们有`eig(A)\
  \ = eig(balance(A))`。\n```\n>> balance(A)\nans =\n0.8147    0.6324    0.4788   \
  \ 0.9572\n0.9058    0.0975    0.4824    0.4854\n0.2540    0.5570    0.1576    1.6006\n\
