  同时找出两条曲线的交点。


  ```

  >> a=0:.1:2*pi;

  >> subplot(1,2,1)

  >> r=sqrt(cos(2*a));

  >> polar(a,r)

  >> title(''r = sqrt(cos(2a))'')

  >> subplot (1,2,2)

  >> r = sin(2*a);

  >> polar (a, r)

  >> title(''r = sin(2a)'')

