- "# 第 1 章：MATLAB 简介与工作环境\n\n\n\n## MATLAB 工作环境\n\n下表总结了 MATLAB 工作环境的主要组件。\n\n| 工具\
  \ | 描述 |\n| --- | --- |\n| 命令历史记录 | 显示在命令窗口中输入的函数历史记录，并允许您复制和执行它们（见图 1-2 的右下部分）。\
  \ |\n| 命令窗口 | 这是您执行 MATLAB 命令的窗口（见图 1-2 的中央部分）。 |\n| 工作区 | 显示工作区的当前内容，并允许您对其进行修改（见图\
  \ 1-2 的右上部分）。 |\n| 帮助 | 允许您搜索和阅读整个 MATLAB 产品家族的文档。 |\n| 启动按钮 | 运行工具，并允许您访问当前安装在计算机上的所有\
  \ MathWorks 产品的文档（图 1-3）。 |\n\n图 1-1 显示了您输入 MATLAB 程序的屏幕。这是 MATLAB 的主要工作环境。\n\n\
  ![A978-1-4842-0322-4_1_Fig3_HTML.jpg](img/A978-1-4842-0322-4_1_Fig3_HTML.jpg)\n\n\
  图 1-3.\n\n![A978-1-4842-0322-4_1_Fig2_HTML.jpg](img/A978-1-4842-0322-4_1_Fig2_HTML.jpg)\n\
  \n图 1-2.\n\n![A978-1-4842-0322-4_1_Fig1_HTML.jpg](img/A978-1-4842-0322-4_1_Fig1_HTML.jpg)\n\
  \n图 1-1.\n\n任何 MATLAB 命令都在命令窗口中用户输入提示符 `>>` 的右侧输入，按下 Enter 后，响应将立即显示在下面的行中。命令执行后，用户输入提示符会再次出现，允许您输入更多命令（图\
  \ 1-4）。\n\n![A978-1-4842-0322-4_1_Fig4_HTML.jpg](img/A978-1-4842-0322-4_1_Fig4_HTML.jpg)\n\
  \n图 1-4.\n\n如果命令的结果未分配给变量，MATLAB 将使用表达式 `ans =` 返回响应，如图 1-4 开头所示。如果结果分配给了一个变量，那么我们可以将该变量用作后续命令的参数。图\
  \ 1-4 中的变量 `v` 就是这种情况，它随后被用作指数运算的输入。\n\n要执行 MATLAB 命令，只需在写好命令后按 Enter 键。如果在输入末尾加上分号，程序将执行该命令并将结果保存在内存（工作区）中，但不会在屏幕上显示结果（见图\
  \ 1-13 中的第一个输入）。然后输入提示符 `>>` 会再次出现，表示您可以输入新命令。\n\n与 C 编程语言一样，MATLAB 区分大小写；例如，`Sin(x)`\
  \ 与 `sin(x)` 不同。所有内置函数的名称都以小写字符开头。命令、变量或函数的名称中不应有空格。在其他情况下，空格会被忽略，并且可以用来使输入更易读。可以通过用逗号分隔多个条目，并在最后一个条目末尾按\
  \ Enter 键来在同一命令行中输入多个条目（见图 1-4）。如果您在行中某个条目的末尾使用分号，则其对应的输出将不会显示。\n\n![A978-1-4842-0322-4_1_Fig5_HTML.jpg](img/A978-1-4842-0322-4_1_Fig5_HTML.jpg)\n\
  \n图 1-5.\n\n描述性注释可以通过以 `%` 符号开头输入到命令输入行中。当您运行输入时，MATLAB 会忽略注释并处理其余代码（见图 1-6）。\n\n\
  ![A978-1-4842-0322-4_1_Fig6_HTML.jpg](img/A978-1-4842-0322-4_1_Fig6_HTML.jpg)\n\n\
  图 1-6.\n\n为了简化提交给 MATLAB 解释器（通过命令窗口提示符）评估的脚本的输入过程，您可以使用箭头键。例如，如果您按一次上箭头键，您将恢复上次提交的条目。如果您按两次上箭头键，您将恢复倒数第二次提交的条目，依此类推。\n\
  \n如果您在输入区域键入一串字符，然后按上箭头键，您将恢复上次提交的以指定字符串开头的条目。\n\n在 MATLAB 会话期间输入的命令会临时存储在缓冲区（工作区）中，直到会话结束，届时它们可以永久存储在文件中或永久丢失。\n\
  \n以下是在 MATLAB 输入区域（命令行）中可以使用的按键及其功能摘要：\n\n| 上箭头 (Ctrl-P) | 检索上一个条目。 |\n| 下箭头 (Ctrl-N)\
  \ | 检索下一个条目。 |\n| 左箭头 (Ctrl-B) | 将光标向左移动一个字符。 |\n| 右箭头 (Ctrl-F) | 将光标向右移动一个字符。 |\n\
  | CTRL-左箭头 | 将光标向左移动一个单词。 |\n| CTRL-右箭头 | 将光标向右移动一个单词。 |\n| Home (Ctrl-A) | 将光标移动到行首。\
  \ |\n| End (Ctrl-E) | 将光标移动到当前行尾。 |\n| Escape | 清除命令行。 |\n| Delete (Ctrl-D) | 删除光标指示的字符。\
  \ |\n| Backspace | 删除光标左侧的字符。 |\n| CTRL-K | 删除（剪切）当前行。 |\n\n命令 `clc` 清除命令窗口，但不会删除工作区的内容（内容仍保留在内存中）。\n\
  \n### MATLAB 中的帮助\n\n您可以通过工具栏中的帮助按钮![A978-1-4842-0322-4_1_Figa_HTML.jpg](img/A978-1-4842-0322-4_1_Figa_HTML.jpg)或菜单栏中的“帮助”选项来查找\
  \ MATLAB 的帮助。此外，也可以通过 MATLAB 命令获取支持。命令 `help` 提供所有 MATLAB 命令的通用帮助（见图 1-7）。通过单击其中任何一个，您可以获得更具体的帮助。例如，如果您单击\
  \ `graph2d`，您将获得关于二维图形的支持（见图 1-8）。\n\n![A978-1-4842-0322-4_1_Fig8_HTML.jpg](img/A978-1-4842-0322-4_1_Fig8_HTML.jpg)\n\
  \n图 1-8.\n\n![A978-1-4842-0322-4_1_Fig7_HTML.jpg](img/A978-1-4842-0322-4_1_Fig7_HTML.jpg)\n\
  \n图 1-7.\n\n您可以通过使用命令 `help command` 或 `help topic` 来请求关于特定命令 `command`（图 1-9）或任何主题\
  \ `topic`（图 1-10）的帮助。\n\n![A978-1-4842-0322-4_1_Fig10_HTML.jpg](img/A978-1-4842-0322-4_1_Fig10_HTML.jpg)\n\
  \n图 1-10.\n\n![A978-1-4842-0322-4_1_Fig9_HTML.jpg](img/A978-1-4842-0322-4_1_Fig9_HTML.jpg)\n\
  \n图 1-9.\n\n命令 `lookfor string` 允许您查找所有引用或包含字符串 `string` 的 MATLAB 函数或命令。当没有指定字符串的直接支持，或者想查看与给定字符串相关的所有命令的帮助时，此命令非常有用。例如，如果我们想查找包含序列\
  \ `inv` 的所有命令的帮助，我们可以使用命令 `lookfor inv`（图 1-11）。\n\n![A978-1-4842-0322-4_1_Fig11_HTML.jpg](img/A978-1-4842-0322-4_1_Fig11_HTML.jpg)\n\
  \n图 1-11.\n\n\n\n## 使用 MATLAB 进行数值计算\n\n您可以将 MATLAB 用作强大的数值计算机。虽然大多数计算器只能处理预设精度的数字，但\
  \ MATLAB 可以执行任何所需精度的精确计算。此外，与计算器不同，我们不仅可以用单个数字执行运算，还可以用数组等对象执行运算。\n\n该软件处理经典数值分析的大多数主题。它支持矩阵计算、统计学、插值、最小二乘拟合、数值积分、函数最小化、线性规划、微分方程的数值解和代数解，以及随着本书内容的深入我们将遇到的一系列其他方法。\n\
  \n以下是一些使用 MATLAB 进行数值计算的示例。（我们知道，要在提示符 `>>` 后输入所需命令后，必须按 Enter 键才能获得结果。）\n\n我们简单地计算\
  \ `4 + 3` 得到结果 `7`。为此，只需输入 `4 + 3`，然后按 Enter。\n\n```\n>> 4 + 3\nans =\n7\n```\n\n\
  我们计算 `3` 的 `100` 次幂的值，无需事先设置精度。为此，我们只需输入 `3 ^ 100`。\n\n```\n>> 3 ^ 100\nans =\n\
  5.1538e+047\n```\n\n我们可以使用命令 `format long e` 来获得 15 位（浮点）精度的结果。\n\n```\n>> format\
  \ long e\n>> 3¹⁰⁰\nans =\n5.153775207320115e+047\n```\n\n我们也可以处理复数。我们通过输入表达式 `(2\
  \ + 3i) ^ 10`，来计算 `(2 + 3i)` 的 `10` 次幂的运算结果。\n\n```\n>> (2 + 3i) ^ 10\nans =\n-1.415249999999998e+005\
  \ - 1.456680000000000e+005i\n```\n\n前面的结果也可以使用 `format short` 命令以短格式显示。\n\n```\n\
  >> format short\n>> (2 + 3i)¹⁰\nans =\n-1.4152e+005- 1.4567e+005i\n```\n\n我们可以计算贝塞尔函数\
  \ `J[0]` 在 `11.5` 处的值。为此，我们输入 `besselj(0,11.5)`。\n\n```\n>> besselj(0,11.5)\nans\
  \ =\n-0.0677\n```\n\n## 使用 MATLAB 进行符号计算\n\nMATLAB 完美地处理符号数学计算，能够轻松地操作和计算公式与代数表达式。您可以展开、分解和简化多项式、有理式和三角表达式，找到多项式方程和方程组的代数解，对导数和积分进行符号求值，找到微分方程的解，处理幂运算，并研究极限以及代数级数的许多其他特性。\n\
  \n要执行这些任务，MATLAB 首先要求所有变量（或代数表达式）都写在单引号之间。当 MATLAB 接收到引号内的变量或表达式时，它会被解释为符号。\n\n\
  以下是一些使用 MATLAB 进行符号计算的示例。\n\n我们可以展开以下代数表达式：`((x + 1)(x + 2) - (x + 2)²)³`。这通过输入：`expand('((x\
  \ + 1)(x + 2) - (x + 2)²)³')` 来完成。结果将是另一个代数表达式：\n\n```\n>> syms x; expand(((x +\
  \ 1) *(x + 2)-(x + 2) ^ 2) ^ 3)\nans =\n-x ^ 3-6 * x ^ 2-12 * x-8\n```\n\n我们可以通过输入：`factor('((x\
  \ + 1) * (x + 2) - (x + 2)²)³')` 来分解上面示例计算结果。\n\n```\n>> syms x; factor(((x + 1)*(x\
  \ + 2)-(x + 2)²)³)\nans =\n-(x + 2)³\n```\n\n我们可以通过输入：`int('x² *sin(x)^ 2', 'x')`\
  \ 来求函数 `(x²) sin(x)²` 的不定积分。\n\n```\n>> int('x²*sin(x)²', 'x')\nans =\nx ^ 2 *(-1/2\
  \ * cos(x) * sin(x) + 1/2 * x)-1/2 * x * cos(x) ^ 2 + 1/4 * cos(x) * sin(x) + 1/4\
  \ * 1/x-3 * x ^ 3\n```\n\n我们可以简化之前的结果：\n\n```\n>> syms x; simplify(int(x²*sin(x)²,\
  \ x))\nans =\nsin(2*x)/8 -(x*cos(2*x))/4 -(x²*sin(2*x))/4 + x³/6\n```\n\n我们可以使用更优雅的数学符号表示之前的结果：\n\
  \n```\n>> syms x; pretty(simplify(int(x²*sin(x)², x)))\nans =\n\n  sin(2 x)   x\
  \ cos(2 x)   x  sin(2 x)   x\n  -------- - ---------- - ----------- + --\n     8\
  \           4             4        6\n```\n\n我们可以求解方程 `3ax - 7 x² + x³ = 0`（其中 `a`\
  \ 是参数）：\n\n```\n>> solve('3*a*x-7*x² + x³ = 0', 'x')\nans =\n[                 \
  \         0]\n[7/2 + 1/2 *(49-12*a) ^(1/2)]\n[7/2-1/2 *(49-12*a) ^(1/2)]\n```\n\n\
  另一方面，MATLAB 可以使用 Maple 程序库来处理符号数学，从而扩展其作用域。通过这种方式，MATLAB 可用于处理诸如微分形式、欧几里得几何、射影几何、统计学等主题。\n\
  \n同时，Maple 也可以利用 MATLAB 的数值计算能力，例如，可以与 Maple 库（组合学、优化、数论等）结合使用。\n\n## 使用 MATLAB\
  \ 绘图\n\nMATLAB 可以生成二维和三维图形，以及等高线和密度图。您可以图形化地表示数据列表，控制颜色、阴影和其他图形特性。同时也支持动画图形。MATLAB\
  \ 生成的图形可以移植到其他程序。\n\n下面给出了一些 MATLAB 绘图的示例。\n\n我们可以表示函数 `xsin(1/x)`，其中 `x` 的范围在 `-π/4`\
  \ 和 `π/4` 之间，在该区间内取 300 个等分点。见图 1-12。\n\n```\n>> x = linspace(-pi/4,pi/4,300);\n\
  >> y = x.*sin(1./x);\n>> plot(x,y)\n```\n\n我们可以为上面的图形添加标题和轴标签，也可以添加网格。见图 1-13。\n\
  \n![A978-1-4842-0322-4_1_Fig12_HTML.jpg](img/A978-1-4842-0322-4_1_Fig12_HTML.jpg)\n\
  \n图 1-12.\n\n```\n>> x = linspace(-pi/4,pi/4,300);\n>> y = x.*sin(1./x);\n>> plot(x,y);\n\
  >> grid;\n>> xlabel('自变量 X');\n>> ylabel('因变量 Y');\n>> title('函数 y=xsin(1/x)')\n\
  ```\n\n图 1-13.\n\n我们可以生成由函数 `z = sin(sqrt(x² + y²)) / sqrt(x² + y²)` 定义的曲面图，其中 `x`\
  \ 和 `y` 在区间 `(-7.5, 7.5)` 内变化，取间隔为 0.5 的等分点。见图 1-14。\n\n![A978-1-4842-0322-4_1_Fig13_HTML.jpg](img/A978-1-4842-0322-4_1_Fig13_HTML.jpg)\n\
  \n图 1-13.\n\n```\n>> x = -7.5:.5:7.5;\n>> y = x;\n>> [X, Y] = meshgrid(x,y);\n>>\
  \ Z = sin(sqrt(X.²+Y.²))./sqrt(X.²+Y.²);\n>> surf(X, Y, Z)\n```\n\n![A978-1-4842-0322-4_1_Fig14_HTML.jpg](img/A978-1-4842-0322-4_1_Fig14_HTML.jpg)\n\
  \n图 1-14.\n\n这些 3D 图形使您能够清晰地了解空间中的图形，并且在视觉上识别不同体之间的相交，以及生成各种空间曲线、曲面和旋转体方面非常有帮助。\n\
  \n我们可以生成参数坐标为：`x = sin(t)`，`y = cos(t)`，`z = t` 的螺旋线对应的三维图形。见图 1-15。\n\n```\n>>\
  \ t = 0:pi/50:10*pi;\n>> plot3(sin(t),cos(t),t)\n```\n\n![A978-1-4842-0322-4_1_Fig15_HTML.jpg](img/A978-1-4842-0322-4_1_Fig15_HTML.jpg)\n\
  \n图 1-15.\n\n我们可以表示由其极坐标 `r = cos(2t) * sin(2t)` 给出的平面曲线，其中 `t` 在 `0` 到 `π` 之间变化，取间隔为\
  \ 0.01 的等分点。见图 1-16。\n\n```\n>> t = 0:.1:2 * pi;\n>> r = sin(2*t).* cos(2*t);\n\
  >> polar(t,r)\n```\n\n![A978-1-4842-0322-4_1_Fig16_HTML.jpg](img/A978-1-4842-0322-4_1_Fig16_HTML.jpg)\n\
  \n图 1-16.\n\n我们可以使用命令 `ezplot` 绘制符号函数的图形。见图 1-17。\n\n```\n>> y = 'x³/(x²-1)';\n\
  >> ezplot(y,[-5,5])\n```\n\n![A978-1-4842-0322-4_1_Fig17_HTML.jpg](img/A978-1-4842-0322-4_1_Fig17_HTML.jpg)\n\
  \n图 1-17.\n\n我们将在关于绘图的章节中更详细地讨论这些概念。\n\n\n\n## 通用符号说明\n\n与其他程序一样，学习 MATLAB 的最佳方式就是使用它。通过实例练习，你就能熟悉\
  \ MATLAB 特有的语法和符号。我们给出的每个示例都包含带有用户输入提示符 `>>` 的标题行，以及下一行中 MATLAB 的响应。请参见图 1-18。\n\
