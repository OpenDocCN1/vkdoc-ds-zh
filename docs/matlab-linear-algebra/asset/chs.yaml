  \ = triu(A,0)`。 |\n|--------------|------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|\n\
  \n```\n>> triu([1 2 3;4 5 6; 7 8 9],1)\nans =\n  0 2 3\n  0 0 6\n  0 0 0\n>> triu([1\
