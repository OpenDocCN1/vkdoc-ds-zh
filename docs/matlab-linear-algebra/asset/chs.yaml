  1 0; 0 0 0 0];` `Z = [1 1 1 1; 1 0 1 0; 0 0 0 0];` `C = [0.5000 1.0000 1.0000 0.5000;`
  `1.0000 0.5000 0.5000 0.1667;` `0.3330 0.3330 0.5000 0.5000];` `fill3(X,Y,Z,C)`
