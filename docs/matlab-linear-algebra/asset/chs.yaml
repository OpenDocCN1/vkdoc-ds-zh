- '# 3. 显式、参数和极坐标下的曲线。曲面


  ## 引言


  MATLAB 是一款实现高性能图形功能的科学软件。它允许您创建探索性数据的二维和三维图形，在显式、隐式和极坐标下绘制曲线，在显式、隐式或参数坐标下绘制曲面，绘制网格图和等高线图，表示各种几何对象，以及创建其他专业图形。


  您可以自由调整图形参数，选择诸如边框和定位、线条特性、标记、坐标轴范围、网格类型、注释、标签和图例等功能。您可以导出多种不同格式的图形。本章将介绍所有这些功能。


  ## 探索性图形


  MATLAB 包含了一些命令，允许您创建基本的探索性图形，例如直方图、条形图、图形、箭头图等。下表总结了这些命令。对于所有这些命令，都需要首先定义变量的变化范围。


  | `bar(Y)` | 创建相对于频率向量 `Y` 的条形图。如果 `Y` 是一个矩阵，则为 `Y` 的每一行创建多个条形图。`>> x = [1 2 5 8
  4 3 4 1 2 3 2];` `>> bar (x)` ![A978-1-4842-0322-4_3_Figa_HTML.jpg](img/A978-1-4842-0322-4_3_Figa_HTML.jpg)
  |

  | `bar(x,Y)` | 创建相对于频率向量 `Y` 的条形图，其中 `x` 是一个向量，用于定义条形在 x 轴上的位置。`>> x = -2.9:0.2:2.9;`
  `>> bar (x, exp(-x.*x))` ![A978-1-4842-0322-4_3_Figb_HTML.jpg](img/A978-1-4842-0322-4_3_Figb_HTML.jpg)
  |

  | `bar(…,width)` | 创建条形图，其中条形具有指定的宽度。默认宽度为 0.8。宽度为 1 会使条形相互接触。 |

  | `bar(…, ''style ''  )` | 创建具有给定条形样式的条形图。可能的样式有 `''group''`（默认的垂直条形样式）和 `''stack''`（堆叠的水平条形）。如果矩阵是
  m× n，则条形被分组为 m 组，每组 n 个条形。`>> A = [1 6 12 5 7; 3 2 6 5 3];` `>> bar (A, ''stack'')`
  `>> bar (A, ''group'')` ![A978-1-4842-0322-4_3_Figc_HTML.jpg](img/A978-1-4842-0322-4_3_Figc_HTML.jpg)
  |

  | `bar(…, color)` | 创建条形图，其中所有条形都是指定的颜色（r = 红色，g = 绿色，b = 蓝色，c = 青色，m = 品红色，y =
  黄色，k = 黑色，w = 白色）。 |

  | `barh(…)` | 创建水平条形图。`>> barh (A, ''group'')` ![A978-1-4842-0322-4_3_Figd_HTML.jpg](img/A978-1-4842-0322-4_3_Figd_HTML.jpg)
  |

  | `hist(Y)` | 创建相对于频率向量 `Y` 的直方图，使用 10 个等距的矩形。如果 `Y` 是一个矩阵，则为每一列创建一个直方图。`>> Y =
  randn(100);` `>> hist(Y)` ![A978-1-4842-0322-4_3_Fige_HTML.jpg](img/A978-1-4842-0322-4_3_Fige_HTML.jpg)
  |

