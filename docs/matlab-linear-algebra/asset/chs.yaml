  \ `Ax = b`。 ```>> bicg(A,B, 1e-009,100)``` `ans =` `1.0e + 016 *` `4.1449 0.7033i`\
  \ `-7.1997 + 1.2216i` `3.2729 0.5553i` `-0.4360 + 0.0740i` |\n| `bicgstab(A,b,tol,maxit,M)`\
  \ `bicgstab(A,b,tol,maxit,M1,M2)` `bicgstab(A,b,tol,maxit,M1,M2,x0)` `[x,f] = bicgstab(A,b,…)`\
  \ `[x,f,relres] = bicgstab(A,b,…)` `[x,f,relres,iter] = bicgstab(A,b,…)` | 求解系统\
  \ `inv(M) * A * x = inv(M) * b`。用 `M = M1 * M2` 求解系统 `inv(M) * A * x = inv(M) *\
  \ b`。用 `M = M1 * M2` 和初始值 `x0` 求解系统 `inv(M) * A * x = inv(M) * b`。尝试求解系统并返回收敛指示符\
  \ `f`（0 = 收敛，1 = 未收敛，2 = 病态，3 = 停滞，4 = 极极端数值）。还返回相对残差 `norm(b-A*x) /norm(b)`。还返回迭代次数。\
