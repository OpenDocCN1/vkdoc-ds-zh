  \n\n## 求解线性方程组\n\n在前面的章节中，我们学习了方程和方程组的一般概念。现在我们将专注于线性方程组。求解此类方程组，我们可以简单地使用目前已学过的命令，但是\
  \ MATLAB 提供了一系列特别为线性方程组设计的专用命令。下表列出了这些命令。\n\n| `X = linsolve (A, B)` | 求解线性系统 `A\
  \ * X = B`。我们求解系统： ![A978-1-4842-0322-4_4_Fig21_HTML.jpg](img/A978-1-4842-0322-4_4_Fig21_HTML.jpg)\
  \ `>> A = [2,1,1,1;1,2,1,1;1,1,2,1;1,1,1,2];B = [1,2,3,4]';` `linsolve (A, B)` `ans\
  \ =` `-1` `0` `1` `2` |\n| `[X, R] = linsolve (A, B)` | 求解线性系统 `A * X = B`，如果 `A`\
  \ 是方阵，则额外返回 `A` 的条件数的倒数；如果 `A` 不是方阵，则返回 `A` 的秩。 `>> A = [2,1,1,1;1,2,1,1;1,1,2,1;1,1,1,2];B\
  \ = [1,2,3,4]';` `[X, R] = linsolve (A, B)` `X =` `-1` `0` `1` `2` `R =` `0.1429`\
  \ |\n| `X = linsolve (A, B, options)` | 使用矩阵 `A` 的各种选项（`UT` 表示上三角，`LT` 表示下三角，`SYM`\
  \ 表示对称实矩阵或复埃尔米特矩阵，`RECT` 表示一般矩形矩阵，`POSDEF` 表示正定矩阵，`UHESS` 表示上黑森伯格矩阵，`TRANSA` 表示共轭转置）求解线性系统\
  \ `A * X = B`。 |\n| `rank (A)` | 矩阵 `A` 的秩。 `>> rank (A)` `ans =` `4` |\n| `det\
  \ (A)` | 方阵 `A` 的行列式。 `>> det (A)` `ans =` `5` |\n| `Z = null (A, 'r')` | 矩阵 `A`\
  \ 的零空间的有理基。 |\n\n线性方程组可以转换为数组形式，并通过矩阵计算来求解。一个系统可以写成 `M.X = B` 的形式，其中 `X` 是变量向量，`B`\
  \ 是常数项向量，`M` 是系统的系数矩阵。如果 `M` 是方阵且行列式非零，则 `M` 可逆，系统的唯一解可以写成：`X = M^(-1)B`。在这种情况下，前面已经描述过的命令\
  \ `solve`、`linsolve`、`lscov`、`bicg`、`pcg`、`lsqr`、`gmr`、`gmres`、`minres`、`symmlq`\
  \ 或 `M\\B` 都可以提供解。\n\n如果 `M` 的行列式为零，则系统有无穷多解，因为 `M` 中存在线性相关的行或列。在这种情况下，可以计算冗余方程的数量，以找出描述解所需的变量个数。如果矩阵\
  \ `M` 是矩形的（非方阵），则系统可能是欠定的（方程数少于变量数）、超定的（方程数多于变量数）或非奇异的（方程数等于变量数且 `M` 的行列式非零）。欠定系统可能有无穷多解，也可能无解；超定系统也是如此。如果一个系统无解，则称为不相容（矛盾）系统；如果至少有一个解，则称为相容系统。当向量\
  \ `B` 是零向量时，系统 `M . X = B` 被称为齐次系统，即系统形式为 `M . X= 0`。如果 `M` 的行列式非零，系统的唯一解是零向量（使用命令\
  \ `linsolve` 获得）。如果 `M` 的行列式为零，则系统有无穷多解。可以使用命令 `solve`、`linsolve`、`lsqr` 或前面为一般线性系统描述的其他命令来求解。\n\
  \n分析和求解方程组的一个基本工具是 Rouche-Frobenius 定理。该定理指出，一个包含 `m` 个方程和 `n` 个未知数的系统有解，当且仅当系数矩阵的秩等于增广矩阵（将系数矩阵与系统常数项列向量拼接）的秩。如果两个秩相等，且等于未知数的个数，则系统有唯一解。如果两个秩相等，但小于未知数的个数，则系统有无穷多解。如果两个秩不相等，则系统无解。\n\
  \n总结如下：设 `A` 是系统的系数矩阵，`B` 是矩阵 `A` 增广了常数项列向量后的矩阵。\n\n如果 `rank(A) = rank(B)`，系统是不相容的（无解）。\n\
  \n如果 `rank (A) = rank(B) < n`，系统是不定的（有无穷多解）。\n\n如果 `= rank(A) = rank(B) = n`，系统有唯一解。\n\
  \n这个定理允许我们在求解之前分析方程组的解。\n\n我们已经遇到过齐次系统。如果常数项向量 `B` 为零，则系统 `A. X = B` 被称为齐次系统，因此每个齐次系统的形式都是\
  \ `A. X = 0`。在齐次系统中，系数矩阵的秩与增广了常数项列向量后的矩阵的秩总是相等。如果我们应用 Rouche-Frobenius 定理，当矩阵 `A`\
  \ 的行列式非零时，齐次系统将有唯一解。由于零向量总是齐次系统的一个解，因此它必须是唯一解。当矩阵 `A` 的行列式为零时，齐次系统将有无穷多解。在这种情况下，解的计算方法与一般系统相同（使用命令\
  \ `solve`），或者使用函数 `null (A)`。\n\n作为第一个例子，我们求解系统：\n\n![A978-1-4842-0322-4_4_Fig22_HTML.jpg](img/A978-1-4842-0322-4_4_Fig22_HTML.jpg)\n\
  \n我们将计算系统矩阵的秩和增广矩阵（通过用常数项列向量扩展矩阵得到）的秩。\n\n```\n>> A = [2,1,1,1;1,2,1,1;1,1,2,1;1,1,1,2];\n\
  >> B = [2,1,1,1,1;1,2,1,1,1;1,1,2,1,1;1,1,1,2,1];\n>> [rank (A), rank (B)]\nans\
  \ =\n4 4\n```\n\n我们注意到两个矩阵的秩等于未知数的个数。根据 Rouche-Frobenius 定理，这告诉我们系统是相容的且有唯一解。我们可以通过以下方式计算解：\n\
  \n```\n>> B = [1 1 1 1]';\n>> linsolve (A, B)\nans =\n0.2000\n0.2000\n0.2000\n0.2000\n\
  ```\n\n也可以使用以下命令找到解：\n\n```\n>> lscov (A, B)\nans =\n0.2000\n0.2000\n0.2000\n0.2000\n\
  \n>> bicg (A, B)\nbicg converged at iteration 1 to a solution with relative residual\
  \ 0\nans =\n0.2000\n0.2000\n0.2000\n0.2000\n\n>> pcg (A, B)\nPCG converged at iteration\
  \ 1 to a solution with relative residual 0\nans =\n0.2000\n0.2000\n0.2000\n0.2000\n\
  \n>> lsqr (A, B)\nlsqr converged at iteration 1 to a solution with relative residual\
  \ 0\nans =\n0.2000\n0.2000\n0.2000\n0.2000\n\n>> qmr (A, B)\nQMR converged at iteration\
  \ 1 to a solution with relative residual 0\nans =\n0.2000\n0.2000\n0.2000\n0.2000\n\
  \n>> gmres (A, B)\ngmres converged at iteration 1 to a solution with relative residual\
  \ 1.5e-016\nans =\n0.2000\n0.2000\n0.2000\n0.2000\n\n>> symmlq (A, B)\nsymmlq converged\
  \ at iteration 1 to a solution with relative residual 0\nans =\n0.2000\n0.2000\n\
  0.2000\n0.2000\n```\n\n作为第二个例子，我们求解系统：\n\n![A978-1-4842-0322-4_4_Fig23_HTML.jpg](img/A978-1-4842-0322-4_4_Fig23_HTML.jpg)\n\
  \n我们计算系统矩阵的秩和增广矩阵的秩。\n\n```\n>> A=[1,2,3;1,3,8;2,3,1;5,6,4];\n>> B=[1,2,3,6;1,3,8,19;2,3,1,-1;5,6,4,5];\n\
  >> [rank(A), rank(B)]\nans =\n3     3\n```\n\n我们注意到两个矩阵的秩等于未知数的个数。根据 Rouche-Frobenius\
  \ 定理，这告诉我们系统是相容的且有唯一解。我们可以通过以下方式计算解：\n\n```\n>> A = [1,2,3;1,3,8;2,3,1;5,6,4];\n\
  >> B = [19-6 - 5-1]';\n>> linsolve (A, B)\nans =\n1.0000\n-2.0000\n3.0000\n```\n\
  \n作为第三个例子，我们求解系统：\n\n![A978-1-4842-0322-4_4_Fig24_HTML.jpg](img/A978-1-4842-0322-4_4_Fig24_HTML.jpg)\n\
  \n由于这是一个齐次系统，我们将计算系统系数矩阵的行列式。\n\n```\n>> A = [1,2, - 1; 2, - 1, 1; 3,1,0];\n>> det\
  \ (A)\nans =\n5. 5511e-016\n```\n\n这个答案非常接近零，实际上行列式就是零，因此齐次系统将有无穷多解，可以使用命令 `solve`\
  \ 计算，如下所示。\n\n```\n>> [x, y, z] = solve('x+2*y-z, 2*x-y+z, 3*x+y', 'x,y,z')\nx =\n\
  -z1/5\ny =\n(3 * z1) / 5\nz =\nz1\n```\n\n因此，这组无穷多解依赖于一个参数 `z1`，并描述为 ![A978-1-4842-0322-4_4_Fig25_HTML.jpg](img/A978-1-4842-0322-4_4_Fig25_HTML.jpg)\n\
