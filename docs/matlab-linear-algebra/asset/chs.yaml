  \n```\n>> null (A)\n\nans =\n\n0\n1\n0\n```\n\n因此核是向量 `{0,b, 0}` 的集合，其中 `b` 可变。此外，核的维数显然为\
  \ 1，因为它以 `{0,1,0}` 为基。\n\n```\n>> rank (A)\n\nans =\n\n2\n```\n\n`f` 的像的维数必须等于矩阵\
  \ `A` 的秩，我们刚刚看到这个秩是 2。`A` 的任意一个包含一个非奇异 2×2 子矩阵的两列子矩阵的列将构成 `f` 的像的一组基。\n\n```\n>>\
  \ det([1,0;0,1])\n\nans =\n\n1\n```\n\n因此，`f` 的像的一组基由 `{{1,0,0,0},{0,0,1,0}}` 给出。\n\
  \n## 练习 5-12\n\n给定二次型 `g:U®R` 定义如下：\n\n![A978-1-4842-0322-4_5_Fig16_HTML.jpg](img/A978-1-4842-0322-4_5_Fig16_HTML.jpg)\n\
  \n对其进行分类，并求出其约化方程、秩和符号差。\n\n为了对二次型进行分类，我们计算其对角行列式。\n\n```\n>> G = [1,0,0;0,2,2;0,2,2]\n\
  \nG =\n\n1 0 0\n0 2 2\n0 2 2\n\n>> det (G)\n\nans =\n\n0\n\n>> det([1,0;0,2])\n\n\
  ans =\n\n2\n```\n\n该二次型是退化的半正定二次型。\n\n为了求出约化方程，我们对矩阵进行对角化。\n\n```\n>> J = jordan\
  \ (G)\n\nJ =\n\n0 0 0\n0 1 0\n0 0 4\n```\n\n则二次型的约化方程为：\n\n![A978-1-4842-0322-4_5_Fig17_HTML.jpg](img/A978-1-4842-0322-4_5_Fig17_HTML.jpg)\n\
  \n```\n>> rank (J)\n\nans =\n\n2\n```\n\n该二次型的秩为 2，因为矩阵的秩为 2。其符号差也为 2，因为对角矩阵中正项的个数为\
  \ 2。\n"
