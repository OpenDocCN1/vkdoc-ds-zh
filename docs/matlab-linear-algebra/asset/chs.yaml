  ## 显式曲面与参数曲面。等高线图


  MATLAB 包含用于表示由 `z = f(x,y)` 形式方程定义的曲面的命令。第一步是使用命令 `meshgrid`，该命令定义了将计算函数值的点数组 (X,
  Y)。然后使用命令 `surf` 来创建曲面。


  命令 `mesh` 也用于生成由函数 `z = f(x,y)` 定义的网格图，使得曲面上的点由函数 `f(x,y)` 对于平面 (x, y) 上对应点所确定的
  z 值网络来表示。网格图的外观类似于渔网，曲面点构成网络的节点。


  还可以使用命令 `contour` 表示曲面的等高线。这些曲线的特征是：平面上使得 `f(x,y)` 值为某个固定常数的点集 (x,y)。


  下表列出了可用于以显式和参数形式生成曲面网格图和等高线图的 MATLAB 命令。




  | `[X, Y] = meshgrid(x, y)` | 通过将单调递增的网格向量 `x` 和 `y` 变换为指定整个网格的两个矩阵 `X` 和 `Y`，创建一个矩形网格。此类网格可用于命令
  `surf` 和 `mesh` 来生成曲面图形。 |

  | `surf(X, Y, Z, C)` | 使用 `C` 中指定的颜色表示显式曲面 `z = f(x, y)` 或参数曲面 `x = x(t, u), y =
  y(t, u), z = z(t, u)`。`C` 参数可以省略。`>> [X, Y] = meshgrid(-2:.2:2, -2:.2:2);` `Z =
  X .* exp(-X.² - Y.²); surf(X, Y, Z)`<br>![A978-1-4842-0322-4_3_Figan_HTML.jpg](img/A978-1-4842-0322-4_3_Figan_HTML.jpg)
  |

  | `surfc(X, Y, Z, C)` | 表示显式曲面 `z = f(x, y)` 或参数曲面 `x = x(t, u), y = y(t, u), z
  = z(t, u)`，并同时绘制曲面的等高线图。等高线投影到 xy 平面上。`>> [X, Y] = meshgrid(-2:.2:2, -2:.2:2);`
