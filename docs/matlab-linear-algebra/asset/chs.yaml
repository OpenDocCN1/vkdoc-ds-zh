  \ (factor ((x³-y³)/(x⁴-y⁴)))` `2         2` `x + x y + y` `-----------------` `2\
  \   2` `(x + y) (x + y )` `>> pretty(factor(x³+y³))` `2         2` `(x + y) (x -\
  \ x y + y )` |\n| `simplify(expr)` | 尽可能地将代数表达式化简。 `>> syms x y b c` `>> simplify\
