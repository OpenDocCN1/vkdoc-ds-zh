  \ 1.1634i\n-1.1678 - 0.7682i        0 + 1.1752i\n\nans =\n\n1.0e+003 *\n\n1.0966\
  \    2.9810    8.1031\n0.0027    0.0074    0.0201\n0.0546    0.1484    0.4034\n\n\
  ans =\n\n-1.1312 + 2.4717i  10.8523 +16.9014i\n29.4995 +45.9428i   0.5403 + 0.8415i\n\
  \nans =\n\n0.8047 + 1.1071i   1.1513 + 0.3218i\n1.4166 + 0.2450i        0 + 1.5708i\n\
  \nans =\n\n1.2720 + 0.7862i   1.7553 + 0.2848i\n2.0153 + 0.2481i   0.7071 + 0.7071i\n\
  ```\n\n上面使用的指数函数、平方根和对数函数均按数组元素逐一应用，与下文将要介绍的矩阵指数和对数函数无关。\n\n```\n>> expm(B), logm(A),\
  \ abs(B), imag(B)\n\nans =\n\n-27.9191 +14.8698i  -20.0011 +12.0638i\n-24.7950 +\
  \ 17.6831i -17.5059 + 14.0445i\n\nans =\n\n11.9650  12.8038 -19.9093\n-21.7328 -22.1157\
  \  44.6052\n11.8921  12.1200 -21.2040\n\nans =\n\n2.2361 3.1623\n4.1231 1.0000\n\
  \nans =\n\n2     1\n1     1\n\n>> fix(sin(B)), ceil(log(A)), sign(B), rem(A,3*ones(3))\n\
  \nans =\n\n3.0000 + 1.0000i        0 - 1.0000i\n-1.0000                  0 + 1.0000i\n\
  \nans =\n\n2     3     3\n0     1     2\n2     2     2\n\nans =\n\n0.4472 + 0.8944i\
  \   0.9487 + 0.3162i\n0.9701 + 0.2425i        0 + 1.0000i\n\nans =\n\n1     2  \
  \   0\n1     2     0\n1     2     0\n```\n\n### 随机数\n\nMATLAB 可以轻松生成（伪）随机数。函数 `rand`\
  \ 生成均匀分布的随机数，函数 `randn` 生成正态分布的随机数。下表介绍了 MATLAB 随机数生成器最实用的功能。\n\n| `rand` | 返回区间\
  \ [0,1] 中均匀分布的一个随机小数。 |\n| `rand(n)` | 返回一个 n×n 的数组，其元素是区间 [0,1] 中均匀分布的随机小数。 |\n\
  | `rand(m, n)` | 返回一个 m×n 的数组，其元素是区间 [0,1] 中均匀分布的随机小数。 |\n| `rand(size(a))` | 返回一个与矩阵\
  \ A 同尺寸的数组，其元素是区间 [0,1] 中均匀分布的随机小数。 |\n| `rand('seed')` | 返回均匀随机数生成器种子的当前值。 |\n\
  | `rand('seed',n)` | 将均匀随机数生成器种子的当前值赋给 n。 |\n| `randn` | 返回一个正态分布的随机小数（均值为 0，方差为\
  \ 1）。 |\n| `randn(n)` | 返回一个 n×n 的数组，其元素是正态分布的随机小数（均值为 0，方差为 1）。 |\n| `randn(m,\
  \ n)` | 返回一个 m×n 的数组，其元素是正态分布的随机小数（均值为 0，方差为 1）。 |\n| `randn(size(a))` | 返回一个与矩阵\
  \ A 同尺寸的数组，其元素是正态分布的随机小数（均值为 0，方差为 1）。 |\n| `randn('seed')` | 返回正态随机数生成器种子的当前值。\
  \ |\n| `randn('seed',n)` | 将正态随机数生成器种子的当前值赋给 n。 |\n\n以下是一些示例：\n\n```\n>> [rand,\
  \ rand (1), randn, randn (1)]\n\nans =\n\n0.9501    0.2311   -0.4326   -1.6656\n\
  \n>> [rand(2), randn(2)]\n\nans =\n\n0.6068    0.8913                 0.1253   -1.1465\n\
  0.4860    0.7621                 0.2877    1.1909\n\n>> [rand(2,3), randn(2,3)]\n\
  \nans =\n\n0.3529 0.0099 0.2028 -0.1364 1.0668 -0.0956\n0.8132 0.1389 0.1987  0.1139\
  \ 0.0593 -0.8323\n```\n\n## 运算符\n\nMATLAB 具备算术、逻辑、关系、条件和结构运算符。\n\n\n\n### 算术运算符\n\
  \nMATLAB 中的算术运算符有两种类型：一种是由线性代数规则支配的矩阵算术运算符，另一种是对向量进行逐元素运算的算术运算符。所涉及的运算符如下表所示。\n\n\
  | 运算符 | 作用 |\n| --- | --- |\n| `+` | 标量、向量或矩阵的加法 |\n| `-` | 标量、向量或矩阵的减法 |\n| `*`\
  \ | 标量或数组的乘法 |\n| `.*` | 标量或向量的乘法 |\n| `\\` | `A\\B = inv (A) * B`，其中 `A` 和 `B`\
  \ 是矩阵 |\n| `.\\` | `A.\\B = [B(i,j) /A (i, j)]`，其中 `A` 和 `B` 是向量 [`dim (A) = dim\
  \ (B)`] |\n| `/` | 除法，或 `B/A = B * inv (A)`，其中 `A` 和 `B` 是矩阵 |\n| `./` | `A / B\
  \ = [A(i,j)/b (i, j)]`，其中 `A` 和 `B` 是向量 [`dim (A) = dim (B)`] |\n| `^` | 标量或矩阵的幂（`M^p`）\
  \ |\n| `.^` | 向量的幂（对于向量 `A` 和 `B`，`A. ^ B = [A(i,j) ^(B (i, j))]`） |\n\n标量与向量之间的简单数学运算会将标量根据定义的运算应用于向量的所有元素，而向量之间的简单运算符是逐元素执行的。以下是这些运算符的详细说明：\n\
  \n| `a = {a1, a2,…, an}`, `b = {b1, b2,…, bn}`, `c = 标量` |\n| --- |\n| `a + c =\
  \ [a1 +c, a2+ c,…, an+c]` | 标量与向量之和 |\n| `a * c = [a1 * c,a2* c ,…, an * c]` | 标量与向量之积\
  \ |\n| `a + b = [ a1+b1 a2+b2 … an+bn]` | 两个向量之和 |\n| `a. * b = [ a1*b1 a2*b2 …\
  \ an*bn]` | 两个向量之积 |\n| `a. / b = [ a1/b1 a2/b2 … an/bn]` | 两个向量的右除 |\n| `a. \\\
  \ b = [ a1\\b1 a2\\b2 … an\\bn]` | 两个向量的左除 |\n| `a. ^ c = [a1 ^c, a2^ c ,…, an ^\
  \ c]` | 向量的标量次幂 |\n| `c. ^ a = [c ^ a1,c ^ a2,… ,c ^ an]` | 标量的向量次幂 |\n| `a.^b =\
  \ [a1^b1 a2^b2 … an^bn]` | 向量的向量次幂 |\n\n必须牢记，向量的长度必须相同，并且在乘法、除法和幂运算中，第一个操作数后面必须跟一个点。\n\
  \n以下示例涉及上述所有运算符。\n\n```\n>> X = [5,4,3]; Y = [1,2,7]; a = X + Y, b = X-Y, c = x\
  \ * Y, d = 2\\. * X,...\n```\n\n```\ne = 2/X, f = 2\\. \\Y, g = x / Y, h =. \\X,\
  \ i = x ^ 2, j = 2\\. ^ X, k = X. ^ Y\n```\n\n```\na =\n\n6     6    10\n```\n\n\
  ```\nb =\n\n4     2    -4\n```\n\n```\nc =\n\n5     8    21\n```\n\n```\nd =\n\n\
  10     8     6\n```\n\n```\ne =\n\n0.4000    0.5000    0.6667\n```\n\n```\nf =\n\
  \n0.5000    1.0000    3.5000\n```\n\n```\ng =\n\n5.0000    2.0000    0.4286\n```\n\
  \n```\nh =\n\n5.0000    2.0000    0.4286\n```\n\n```\ni =\n\n25    16     9\n```\n\
  \n```\nj =\n\n32 16 8\n```\n\n```\nk =\n\n5 16 2187\n```\n\n上述运算均有效，因为在所有情况下变量操作数的维度都相同，因此运算可以成功逐元素执行。对于加法和减法，向量和矩阵没有区别，因为这两种情况下的运算相同。\n\
  \n矩阵变量最重要的运算符具体说明如下：\n\n| `A + B`, `A - B`, `A * B` | 矩阵的加法、减法和乘法。 |\n| `A\\B` |\
  \ 如果 `A` 是方阵，则 `A\\B = inv (A) * B`。如果 `A` 不是方阵，则 `A\\B` 是系统 `AX = B` 在最小二乘意义上的解。\
  \ |\n| `B/A` | 等同于 `(A ' \\ B')'`。 |\n| `A^n` | 等同于 `A * A * A *… *A n` 次（`n` 为整数）。\
  \ |\n| `p^A` | 仅当 `p` 是标量时才执行幂运算。 |\n\n以下是一些示例：\n\n```\n>> X = [5,4,3]; Y = [1,2,7];\
  \ l = X'* Y, m = X * Y ', n = 2 * X, o = X / Y, p = Y\\X\n```\n\n```\nl =\n\n5 10\
  \ 35\n4  8 28\n3  6 21\n```\n\n```\nm =\n\n34\n```\n\n```\nn =\n\n10 8 6\n```\n\n\
  ```\no =\n\n0.6296\n```\n\n```\np =\n\n0         0         0\n0         0      \
  \   0\n0.7143    0.5714    0.4286\n```\n\n上述所有矩阵运算都有明确定义，因为在每种情况下操作数的维度都是兼容的。我们绝不能忘记，向量是矩阵的一种特殊情况，但要使用向量进行矩阵形式（而非逐元素）的运算，必须遵守矩阵运算的维度规则。例如，向量运算\
  \ `X. ' * Y` 和 `X.*Y'` 没有意义，因为它们涉及不同维度的向量。同样，矩阵运算 `X * Y`、`2/X`、`2\\Y`、`X ^ 2`、`2\
  \ ^ X` 和 `X ^ Y` 也是没有意义的，这同样是由于数组维度冲突。\n\n以下是矩阵运算符的更多示例。\n\n```\n>> M = [1,2,3;1,0,2;7,8,9]\n\
  ```\n\n```\nM =\n\n1 2 3\n1 0 2\n7 8 9\n```\n\n```\n>> B = inv (M), C = M ^ 2, D\
  \ = M ^(1/2), E = 2 ^ M\n```\n\n```\nB =\n\n-0.8889    0.3333    0.2222\n0.2778\
  \   -0.6667    0.0556\n0.4444    0.3333   -0.1111\n```\n\n```\nC =\n\n24    26 \
  \   34\n15    18    21\n78    86   118\n```\n\n```\nD =\n\n0.5219 + 0.8432i   0.5793\
  \ - 0.0664i   0.7756 - 0.2344i\n0.3270 + 0.0207i   0.3630 + 1.0650i   0.4859 - 0.2012i\n\
  1.7848 - 0.5828i   1.9811 - 0.7508i   2.6524 + 0.3080i\n```\n\n```\nE =\n\n1. 0e\
  \ + 003 *\n\n0.8626 0.9568 1.2811\n0.5401 0.5999 0.8027\n2.9482 3.2725 4.3816\n\
  ```\n\n### 关系运算符\n\nMATLAB 还提供了关系运算符。关系运算符在两个矩阵之间执行逐元素比较，并返回一个相同大小的数组，如果对应关系为真，则该数组的元素为\
  \ 1，如果对应关系为假，则为 0。关系运算符也可以将标量与向量或矩阵进行比较，在这种情况下，标量将与数组的所有元素进行比较。以下是这些运算符的表格。\n\n\
  | `<` | 小于（对于复数，仅适用于实部） |\n| `<=` | 小于或等于（仅适用于复数的实部） |\n| `>` | 大于（仅适用于复数的实部） |\n\
  | `>=` | 大于或等于（仅适用于复数的实部） |\n| `x == y` | 等于（也适用于复数） |\n| `x ∼ = y` | 不等于（也适用于复数）\
  \ |\n\n### 逻辑运算符\n\nMATLAB 提供了表示逻辑运算符的符号。下表中显示的逻辑运算符提供了一种组合或否定关系表达式的方法。\n\n| `∼\
  \ A` | 逻辑非（NOT）或 `A` 的补集。 |\n| `A & B` | 逻辑与（AND）或 `A` 和 `B` 的交集。 |\n| `A \\| B`\
  \ | 逻辑或（OR）或 `A` 和 `B` 的并集。 |\n| `XOR (A, B)` | 异或（XOR）或 `A` 和 `B` 的对称差（如果 `A` 或\
  \ `B`（但不同时为 1）为 1，则取值为 1）。 |\n\n以下是一些示例：\n\n```\n>> A = 2:7;P =(A>3) & (A<6)\n```\n\
  \n```\nP =\n\n0     0     1     1     0     0\n```\n\n当 `A` 的对应元素大于 3 且小于 6 时返回\
  \ 1，否则返回 0。\n\n```\n>> X = 3 * ones (3.3); X >= [7 8 9; 4 5 6 ; 1 2 3]\n```\n\n\
  ```\nans =\n\n0 0 0\n0 0 0\n1 1 1\n```\n\n解数组中对应于 `X` 中那些大于或等于矩阵 `[7 8 9; 4 5 6;\
  \ 1 2 3]` 对应元素的元素被赋值为 1。其余元素被赋值为 0。\n\n\n\n#### 逻辑函数\n\nMATLAB 实现了逻辑函数，其输出可以取值为\
  \ `true`（1）或 `false`（0）。下表展示了最重要的逻辑函数。\n\n| `exist(A)` | 检查变量或函数是否存在（如果 `A` 不存在则返回\
  \ 0；如果存在，则根据类型返回 1 到 5 之间的一个数字）。 |\n| :--- | :--- |\n| `any(V)` | 如果向量 `V` 的所有元素都为空，则返回\
  \ 0；如果 `V` 的某个元素非零，则返回 1。 |\n| `any(A)` | 对于矩阵 `A` 中所有元素都为零的列，返回 0；对于 `A` 中有非零元素的列，返回\
  \ 1。 |\n| `all(V)` | 如果向量 `V` 的所有元素都非空，则返回 1；如果 `V` 的某个元素为空，则返回 0。 |\n| `all(A)`\
  \ | 对于矩阵 `A` 中所有元素都非空的列，返回 1；对于 `A` 中至少有一个空元素的列，返回 0。 |\n| `find(V)` | 返回向量 `V`\
  \ 中非空元素所在的位置（或索引）。 |\n| `isnan(V)` | 对于 `V` 中不确定的元素，返回 1；对于非不确定的元素，返回 0。 |\n| `isinf(V)`\
  \ | 对于 `V` 中为无穷大的元素，返回 1；对于非无穷大的元素，返回 0。 |\n| `isfinite(V)` | 对于 `V` 中为有限值的元素，返回\
  \ 1；对于非有限值的元素，返回 0。 |\n| `isempty(A)` | 如果 `A` 是空数组，则返回 1；否则返回 0（空数组是其某个维度为 0 的数组）。\
  \ |\n| `issparse(A)` | 如果 `A` 是稀疏矩阵，则返回 1；否则返回 0。 |\n| `isreal(V)` | 如果 `V` 的所有元素都是实数，则返回\
  \ 1；否则返回 0。 |\n| `isprime(V)` | 对于 `V` 中所有质数元素，返回 1；对于非质数元素，返回 0。 |\n| `islogical(V)`\
  \ | 如果 `V` 是逻辑向量，则返回 1；否则返回 0。 |\n| `isnumeric(V)` | 如果 `V` 是数值向量，则返回 1；否则返回 0。\
  \ |\n| `ishold` | 如果当前图形的属性会保留到下一个图形，并且只添加新元素，则返回 1；否则返回 0。 |\n| `isieee` | 如果计算机能够执行\
  \ IEEE 标准操作，则返回 1。 |\n| `isstr(S)` | 如果 `S` 是字符串，则返回 1；否则返回 0。 |\n| `ischart(S)`\
  \ | 如果 `S` 是字符串，则返回 1；否则返回 0。 |\n| `isglobal(A)` | 如果 `A` 是全局变量，则返回 1；否则返回 0。 |\n\
  | `isletter(S)` | 如果 `S` 是字母表中的一个字母，则返回 1；否则返回 0。 |\n| `isequal(A, B)` | 如果矩阵或向量\
  \ `A` 和 `B` 相等，则返回 1；否则返回 0。 |\n| `ismember(V, W)` | 对于 `V` 中出现在 `W` 中的每个元素，返回 1；对于\
  \ `V` 中不在 `W` 中的每个元素，返回 0。 |\n\n以下是一些使用上述逻辑函数的示例。\n\n```\n>> V = [1,2,3,4,5,6,7,8,9],\
  \ isprime(V), isnumeric(V), all(V), any(V)\nV =\n1     2     3     4     5     6\
  \     7     8     9\nans =\n0     1     1     0     1     0     1     0     0\n\
  ans =\n1\nans =\n1\nans =\n1\n\n>> B = [Inf, -Inf, pi, NaN], isinf(B), isfinite(B),\
  \ isnan(B), isreal(B)\nB =\nInf - Inf 3.1416 NaN\nans =\n1 1 0 0\nans =\n0 0 1 0\n\
  ans =\n0 0 0 1\nans =\n1\n\n>> ismember ([1,2,3], [8,12,1,3]), A = [2,0,1];B = [4,0,2];\
  \ isequal (2A * B)\nans =\n1 0 1\nans =\n1\n```\n\n## 练习 2-1\n\n求从 30 个元素中无重复地选择\
  \ 12 个元素的方法数、`2¹³⁴` 除以 3 的余数、18900 的质因数分解、200 的阶乘以及最小的数 `n`，使得 `n` 分别除以 16、24、30\
  \ 和 32 都余 5。\n\n```\n>> factorial (30) / (factorial (12) * factorial(30-12))\nans\
  \ =\n8.6493e + 007\n```\n\n使用 `vpa` 命令来显示精确结果。\n\n```\n>> vpa 'factorial (30) /\
  \ (factorial (12) * factorial(30-12))' 15\nans =\n86493225.\n\n>> rem(2¹³⁴,3)\n\
  ans =\n0\n\n>> factor (18900)\nans =\n2     2     3     3     3     5     5    \
  \ 7\n\n>> factorial (100)\nans =\n9. 3326e + 157\n```\n\n使用 `vpa` 命令来显示精确结果。\n\n\
