  \n```\n>> A=sym('[a,a+1,a+2;a,a-1,a-2;1,2,3]')\nA =\n[ a, a + 1, a + 2]\n[ a, a\
  \ - 1, a - 2]\n[ 1,     2,     3]\n>> B=sym('[b,b+1,b+2;b,b-1,b-2;1,2,3]')\nB =\n\
