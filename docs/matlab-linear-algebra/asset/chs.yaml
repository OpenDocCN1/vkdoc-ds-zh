  ### 三维曲线


  MATLAB 包含用于绘制三维空间曲线的命令。下表列出了最重要的命令。


  | `plot3(X, Y, Z)` | 通过直线连接由 (X, Y, Z) 确定的点序列来绘制三维线图，其中 X、Y 和 Z 为行向量。X、Y 和 Z 也可以是参数坐标或相同大小的矩阵，此时将为每一组三元行在同一坐标轴上绘制图形。若
  X、Y 和 Z 为复数值，则忽略其虚部。`>> X = [0 1 1 2; 1 1 2 2; 0 0 1 1];` `Y = [1 1 1 1; 1 0 1 0;
  0 0 0 0];` `Z = [1 1 1 1; 1 0 1 0; 0 0 0 0];` `>> plot3 (X, Y, Z)` ![A978-1-4842-0322-4_3_Figaj_HTML.jpg](img/A978-1-4842-0322-4_3_Figaj_HTML.jpg)
  `>> t = 0:pi/100:20 * pi; plot3 (2 * sin(2*t), 2 * cos(2*t), 4 * t)` ![A978-1-4842-0322-4_3_Figak_HTML.jpg](img/A978-1-4842-0322-4_3_Figak_HTML.jpg)
  |

  | `plot3(X, Y, Z, S)` | 按照 S 中定义的设置生成线图 `plot(X,Y,Z)`。S 通常由单引号内的两个字符组成，第一个字符设置线图的颜色，第二个字符确定线条或标记属性。可能的设置已在上述
  `plot` 命令中描述过。 |

  | `plot3(X1,Y1,Z1,S1, X2,Y2,Z2,S2,X3, Y3, Z3, S3,…)` | 在同一坐标轴上组合四元组 (Xi, Yi, Zi,
  Si) 的三维线图。这是在同一图形上表示多个函数的有用方式。 |

  | `fill3(X,Y,Z,C)` | 绘制以列向量 X、Y、Z 的分量三元组 (Xi, Yi, Zi) 为顶点的填充多边形。C 是与 X、Y、Z 大小相同的向量，用于指定每个顶点
  (Xi, Yi, Zi) 的颜色 Ci。Ci 的值可以是 `''r''`、`''g''`、`''b''`、`''c''`、`''m''`、`''y''`、`''w''`、`''k''`，其含义我们已经了解。如果
  C 是单个字符，则所有顶点都将使用此颜色。如果 X、Y、Z 是相同大小的矩阵，则将绘制与每个三元组列向量 (X.j, Y.j, Z.j) 对应的多个多边形。此时，C
  可以是行向量，其元素 Cj 决定与 (X.j, Y.j, Z.j) 对应的每个多边形的唯一颜色。C 也可以是维度与 X、Y、Z 相同的矩阵，此时其元素决定多边形集合中每个顶点
