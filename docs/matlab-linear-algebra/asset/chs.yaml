  要找出两条曲线的交点，我们将它们绘制在同一坐标轴上。


  ```

  >> a = 0:.1:2*pi;

  >> r=sqrt(cos(2*a));

  >> polar(a,r)

  >> hold on;

  >> r=sin(2*a);

  >> polar(a,r)

