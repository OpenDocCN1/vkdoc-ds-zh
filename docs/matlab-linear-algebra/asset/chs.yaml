  \n\n\n## 求解方程与方程组\n\nMATLAB 包含多个用于求解方程和方程组的命令。以下各节将介绍这些方法的语法和主要功能。\n\n### 通用方法\n\
  \n以下是用于求解方程和方程组的最常用 MATLAB 命令\n\n| `solve('equation','x')` | 求解变量 `x` 的方程。方程求解如下：\
  \ ```>> solve('p*sin(x) = r')``` `ans =` `asin(r/p)` `pi - asin(r/p)` |\n| `syms\
  \ x; solve(equ(x), x)` | 求解变量 `x` 的方程 `equ`。方程求解如下： ```>> syms x r; solve(p * cos(x)\
  \ - r, x)``` `ans =` `acos((8192*r)/1433639)` `-acos((8192*r)/1433639)` |\n| `solve('eq1,eq2,…,eqn',\
  \ 'x1, x2,…,xn')` | 求解 `n` 个联立方程 `eq1,…, eqn`（解赋给变量 `x1,…, xn`） ```>> [x, y] = solve('x²\
  \ + x*y + y = 3','x²-4*x + 3 = 0')``` `x =` `1` `3` `y =` `1` `-3/2` |\n| `syms\
  \ x1 x2…xn; solve(eq1,eq2,…,eqn, x1, x2,…,xn)` | 求解 `n` 个联立方程 `eq1,…, eqn`（解赋给变量\
  \ `x1,…, xn`） ```>> syms x y; [x, y] = solve(x² + x*y + y-3, x²-4*x + 3)``` `x =`\
  \ `1` `3` `y =` `1` `-3/2` |\n| `X = linsolve(A, B)` | 求解方程 `A * X = B`，其中 `A`、`B`\
  \ 和 `X` 是矩阵。求解系统： ```>> A = [2,1,1,1;1,2,1,1;1,1,2,1;1,1,1,2]; B = [1,2,3,4]';```\
  \ `linsolve(A, B)` `ans =` `-1` `0` `1` `2` |\n| `x = lscov(A,B)` `x = lscov(A,B,V)`\
  \ | 以最小二乘意义求解方程 `A * x = B`，即 `x` 是使平方误差和最小的 n×1 向量。以最小二乘意义求解，协方差矩阵与 `V` 成比例，即 `x`\
  \ 最小化。 ```>> A = [2,1,1,1;1,2,1,1;1,1,2,1;1,1,1,2]; B = [1,2,3,4]';``` `lscov(A,\
  \ B)` `ans =` `-1` `0` `1` `2` |\n| `X = A\\B` | 求解系统。 ```>> A = [2,1,1,1;1,2,1,1;1,1,2,1;1,1,1,2];\
  \ B = [1,2,3,4]';``` `A\\B` `ans =` `-1.0000` `-0.0000` `1.0000` `2.0000` |\n| `X\
  \ = A/B` | 求解系统。 |\n| `roots(A)` | 返回多项式的根，其系数由向量 `A` 给出（从最高次到最低次）。示例为求多项式的根。 ```>>\
  \ roots([1 2 3 4])``` `ans =` `-1.6506` `-0.1747 + 1.5469i` `-0.1747 - 1.5469i`\
  \ |\n| `poly(V)` | 返回多项式的系数，其根由向量 `V` 给出。 ```>> poly([1 2 3 4])``` `ans =` `1 1\
  \ -10 -10 35 -50 24` |\n| `x = fzero(x0) (function)` | 返回函数在 `x0` 附近的零点。 ```>> X\
  \ = fzero('sin(x) - 1', pi/2)``` `X =` `1.5708` |\n| `[x, fval] = fzero(x0, fun)`\
  \ | 还返回函数在 `x` 处的目标值。 ```>> [F, x] = fzero('sin(x) - 1', pi/2)``` `X =` `1.5708`\
  \ `f =` `0` |\n\n### 双共轭梯度法\n\n以下是可通过双共轭梯度法求解方程和方程组的 MATLAB 命令。\n\n| `x = bicg(A,b)`\
  \ `bicg(A,b,tol)` `bicg(A,b,tol,maxit)` `bicg(A,b,tol,maxit,M)` `bicg(A,b,tol,maxit,M1,M2)`\
  \ `bicg(A,b,tol,maxit,M1,M2,x0)` `[x,f] = bicg(A,b,…)` | 尝试通过双共轭梯度法求解系统 `Ax = b`。\
