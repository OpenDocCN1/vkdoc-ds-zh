  ## 讨论


  电流的流动决定了电能可提供的功率。即使是在低电压下，大电流也必须通过精心设计和测试的电路进行疏导，这些电路能够安全地耗散电流通过时产生的热量。在环境温度下，所有材料都具有一定的电阻，它会阻碍电流流动并在导体中产生热量（参见第
  7 章）。


  电能流动会在载流导体周围产生磁场，磁场强度与电流大小成正比。在启动大电流通过之前，应评估由此产生的磁场对电路周围区域的影响。


  采用机电式电流表设计的装置，可以使用 TIA、合适的反馈电阻以及方便的读数装置进行升级，以记录或显示测量的电流。


  IC 运算放大器试图使其两个输入端保持在同一电压水平。当同相输入端直接接地时，连接到反相输入端的电流源会将运算放大器视为对地的“虚拟”直接短路。一个同相输入端接地，其输出通过一个固定的、已知阻值的电阻反馈到反相输入端的运算放大器，被称为*跨阻放大器*
  (TIA)。TIA 将输入电流转换为负输出电压。如图 2-3 所示，一对级联的高输入阻抗跨阻放大器可用于测量低电流水平。


