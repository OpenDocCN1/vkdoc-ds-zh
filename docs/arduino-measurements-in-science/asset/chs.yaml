  亚环境温度也可以通过机电式气体膨胀/压缩系统以及能在热能与电能之间相互转换，从而在热隔离环境之间移动或“泵送”热量的固态半导体系统来实现。


  ## 热敏电阻：灵敏的高分辨率温度测量


  ### 过渡金属氧化物热敏电阻（-40°C 至 150°C）


  对于涉及接近环境温度或室温溶液化学的生物学、医学和热化学分析，热敏电阻是撰写本文时最灵敏的温度传感器。除了灵敏度高之外，它还采用微型珠状封装制造，坚固耐用、化学惰性、成本低廉，并且对温度变化响应迅速。当与数据处理软件配合使用，或用于测量微小或分数级别的温度变化时，热敏电阻的非线性特性并非大问题。


  意法半导体 2004 年的一份应用笔记 `AN1755` 描述了一种利用 `555` 定时器芯片、热敏电阻和微处理器来开发高分辨率温度测量系统的方法（参见 [`www.st.com/resource/en/application_note/cd00010962-a-high-resolutionprecision-thermometer-using-st7-and-ne555-stmicroelectronics.pdf`](http://www.st.com/resource/en/application_note/cd00010962-a-high-resolutionprecision-thermometer-using-st7-and-ne555-stmicroelectronics.pdf)）。该系统将热敏电阻的温度变化转换为定时器芯片输出频率的变化。


  将一个 NTC 热敏电阻和一个高质量、低漏电的电容器放置在非稳态配置的 `555` 定时器的电阻/电容定时网络中，定时器芯片输出的占空比或脉宽比将随热敏电阻的温度变化而变化。当由高速微处理器以微秒级进行多次平均读数测量时，输出脉冲的宽度提供了对热敏电阻珠温度灵敏、高分辨率的测量。微处理器数字化后的信号随后可被串流输出到计算机的串行端口，以便在基于
  PC 的 SCADA 程序中进行图形显示。


  在 `AN1755` 中，讨论了 `555` 的周期定时，并在应用笔记内的两张图中进行了展示。然而，当定时器在电源电压的三分之一到三分之二之间循环时，会输出一个由高电平和低电平脉冲组成的方波脉冲序列。热敏电阻的阻值是其温度的函数。热敏电阻的阻值部分决定了电容器充电的速率。这可以通过高电平、低电平时间间隔
  `t[1]` 和 `t[2]` 的数学表达式来证明，如下所示。


  ```

  t[1] = 0.693(R[ntc] + R[2])C--- 1

  t[2] = 0.693(R[2])C--- 2

  因此

  R[ntc] = R2/t[2]--- 3

  ```


  虽然 `C` 的值并不直接参与 `R[ntc]` 值的计算，但它确实决定了高电平和低电平时间值 `t[1]` 和 `t[2]` 的大小。如果 `t[1]` 和
  `t[2]` 之间的差值被用作温度变化的量度，并且该变化以微秒为单位进行测量，那么使用较大的 `C` 值可以显著提高温度测量的分辨率。


  在此应用中，`C` 是一个定时电容器。它应为塑料薄膜型、低漏电的器件。低漏电的塑料薄膜电容器具有极性很低的介质材料，这意味着要制造出更高电容值的器件，需要体积大且昂贵的材料封装。通常，较小的物理尺寸对应
  pF 和 nF 范围的电容值，但这些电容也可能价格昂贵且难以找到。为了最大化 `Δt` 值，应尽可能使用实际可行的、大容量的塑料薄膜电容器。我的一些开发电路曾使用
  `1 μF` 的聚苯乙烯电容器组装，其尺寸为 `5/32 × ½ × 1¾ 英寸`（4 × 10 × 45 毫米）。


  理论上，定时器循环的频率与 `1/ln(2)*(R1+R2)*C` 成正比。如果循环时间保持在 `4 Hz` 或更高，则电容器不应超过 `18 μF`。通常，当低漏电塑料薄膜电容器的值超过几微法时，其成本会开始显著增加。




  '
- '# 构建高分辨率、高灵敏度温度监测器


  为组装一个高分辨率、高灵敏度温度监测器，您需为实验选择合适的`thermistor`（热敏电阻）。为了在 555 定时器输出信号中提供合理的不对称性，RC 网络中的固定电阻应选择与传感器在其预期工作温度范围内的电阻值大致相等。固定
  RC 网络的电阻值后，只需确定电容值，以提供适合微处理器数字信号处理（DSP）能力的输出频率。RC 定时网络中的电容越大，系统的振荡频率就越低。555 定时器输出信号的频率必须足够低，以便微控制器代码能够测量高电平和低电平的脉冲宽度，然后计算脉冲宽度差值并平均该数值差值，从而提供适当的降噪水平。


  `Arduino`是一款 8 位处理器，因此使用脉冲宽度差值而非实际脉冲宽度。移动平均数字信号处理代码中的元素数量必须足够小，以避免微处理器代码中使用的长整数发生数值溢出。


  热敏电阻测量系统可通过使用干井温度参考源进行校准。典型的测温化学分析过程仅涉及几度到 8°C 至 10°C 的温度变化。热敏电阻与温度关系的线性度可在较短的高分辨率范围内进行检验和验证。


  ## 实验 A 部分：金属氧化物 NTC 热敏电阻


  为进行灵敏的高分辨率温度测量，`Arduino`或类似的微处理器板应独立使用电池或稳压电源供电，以提供几乎无噪声的+5 V 偏置电压和地线。使用合适的 NTC
  热敏电阻、电容和参考电阻构成非稳态配置定时网络后，555 定时器引脚 3 的输出可连接至`Arduino`板的数字引脚 2。`Arduino`板代码（见清单 3-1）包含一个
  n 元素移动平均程序，可为`DAQFactory`图形显示提供平滑的数据流。该代码设置为采集并平均 16 个数据点。


