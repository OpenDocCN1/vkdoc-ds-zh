  **图 1-14** 330 pF 器件的控制台输出




  ## 讨论


  对任何测量系统进行校准时，若待测值存在多个数量级的变化，都应谨慎操作，并对测量值进行严格检验。从`1 μF`电容器流出的数据是聚苯乙烯标准电容器，基于此进行了杂散泄漏估算。图
  1-14 中标称`330 pF`元件的实测值为`323 pF`。


  一台鼎阳科技`5.5`位台式万用表测得该`330 pF`元件的电容值为`0.364 nF`。


  对于如此廉价且易于获取的系统而言，Arduino–RPi 组合提供了非常出色的数据。


  当涉及极小或极大的量值时，任何测量都难以实现绝对精度。绝对精度依赖于往往无法获取的标准。如有可能，应将绝对测量需求重新表述为差分测量问题，这通常可以消除对绝对标准的需求。


  Arduino 的连续小电容监测功能提供了有用且灵敏的差分电容测量能力。


  ## 使用 Python 和树莓派测量大电容值


  在 Arduino 上运行的连续电容测量程序可以测量超过微法级的电容值，但随着电容器容量的增大，测量速度会开始减慢。当时间跨度达到分钟级或更长，且采用恒流、线性电压斜坡监测技术测量电容值时，涉及
  RPi、GPIO 阵列及相应 Python 库的计时问题就变得不那么重要了。


  较大的充电电流和更高电压的电源可以部分抵消由 RC 时间常数增大所引起的问题。用于大电容的高功率充电电源必须与 RPi GPIO 阵列和 MCP3008 ADC
  的低压、低电流电路隔离。


  在测量电容值之前，对大型电解器件中液体介质的受控预处理进行可视化记录，有助于获得更一致、可重复的数据。清单 1-4 提供了一种方法，用于对大型电解电容器充电的可重复性进行可视化验证。


  ## 实验


  创建线性电压斜坡的传统方法是用恒流源给电容器充电。电流镜可以提供恒流电源，结合`555`定时 IC，可以对大容量被测器件中的介质层进行交替充电/放电的循环修复。


  两个`2N3906`晶体管以电流镜配置连接，配合`LM555`定时器 IC 和`6 V`电池组（`4`节`12,000 mA`碱性 D 型电池），可与 RPi
  及`gpiozero`库一起使用，读取`MCP3008`ADC，以记录和显示大型电解电容器的充电历史及电容值（见图 1-7）。循环修复程序的代码见清单 1-4。


  要使用 Python RPi 的测量前预处理、数据显示或记录程序，必须通过主菜单选择在 RPi 上调用 MCP3008 串行外设接口（SPI）协议，如图 1-16
  和 1-17 所示。


