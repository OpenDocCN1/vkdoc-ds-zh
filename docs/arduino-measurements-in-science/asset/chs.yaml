  \ |\n\n## 讨论\n\n超过 125 年前，德国科学家发表了研究，探讨了电能通过不同盐类和水溶性化合物的水溶液时的传导情况。他们建立了一个理论，将溶液异常的电导率与目标物质溶于水时发生的浓度和电离度关联起来。\n\
  \n通过对不同浓度溶液的电导率进行大量测量，人们发展出了将水溶性化合物描述为强电解质、中强电解质和弱电解质的理论，并提出了一个合理的理论来解释观察到的浓强电解质溶液的异常行为。在强电解质的高浓度溶液中，带相反电荷物种之间的电吸引会导致其各自的离子电荷部分抵消，从而降低它们对外加电势的响应能力。在图\
  \ 7-18 所示的曲线中，当 NaCl 浓度升至一定水平以上时，测得的溶液电导率变化很小。\n\n关于离子溶液理论的详细定性和定量解释，可以在任何物理化学教科书中找到。\n\
  \n对于这个简单的实验，仅使用电导率-浓度曲线的线性部分或较低浓度部分进行溶液监测。\n\n本实验首先开发了一种严格、明确的溶液电导率测定方法，该方法可用于验证更简单的基于\
  \ Arduino、RPi 和 555 定时器 IC 的测量近似方案。\n\n1977 年，M. Ahmon 提出了一种现代固态电解电导率测量系统，该系统遵循传统开发的单元操作，包括低压交流测试探针激励、信号整流和直流电压读数。^(⁶)\
  \ 该电路使用了一个四运放芯片 `LM348`，其中四个放大器（`741s`）被配置为正弦波发生器、放大器、整流器和低通滤波器。\n\n在随后的几十年里，该原始电路的许多变体已被用于大量实际应用，并作为教育目的用的化学实验室仪器。\n\
  \n图 7-6 源自 Rogerio T. da Roche 等人 1997 年 5 月发表在《化学教育杂志》（第 74 卷，第 5 期，第 572–574 页）上的一篇题为“低成本高性能电导率计”的文章。\n\
  \n`741` 运算放大器现在仍可使用，但 `411` 已在许多应用中取代了它，而四运放芯片 `TL074` 和 `TL084` 是替代 `LM348` 的基于\
  \ `411` 的型号，其中 `TL074` 具有更低的噪声值。根据上述参考文献组装的模块，将一种三角波、低电压、交替极性的激励信号施加到电导率探头上。通过离子溶液的信号经过放大、整流和滤波，最终输出一个与溶液电导率成正比的直流电压。电路中提供了一个量程开关，允许输出信号获得\
  \ 100 倍的放大增益（见图 7-17）；这可以适应海水和雨水等天然水源之间巨大的电导率差异。\n\n\n\n## 排版后的内容\n\n除了电子电路模块，作者还提出了一种利用易得材料制作坚固、易组装的电导率探头的方法。该探头具有大表面积，能够为实验提供强大、稳定的信号。在图\
  \ 7-14 中，上方的电导率探头由`2 cm × 1 cm`（`¾ in × ½ in`）不锈钢板制成，并涂覆环氧树脂，正如巴西教育工作者在 1997 年 5\
  \ 月*化学教育杂志*文章中所描述的那样。下方的塑料电工胶带包裹探头由`20 ga`（`0.812 mm`，`0.0320 in`）不锈钢丝制成。每个探头都有一个`1\
  \ cm`宽的塑料核心，将电极间距设置为`1 cm`。金属丝探头简单且易于组装，无需银焊和环氧树脂涂层。\n\n尽管当前文献中描述了大量基于简单微控制器的电导率测量系统，但本书仍采用更复杂、传统的交流激励方法，原因是其鲁棒性强且适用范围广。\n\
  \n低压交流激励可避免水电解，既可用于静态、静止的样品，也可用于搅拌或流动系统，而无需担心双电层形成。该仪器围绕单个易得、低成本的集成电路构建，可轻松组装在临时原型面包板或可安装仪器的通用印刷电路板上，如图\
  \ 7-7 和图 7-12 所示。\n\n该系统可使用无害、易获得的标准盐进行校准和验证，该盐无需昂贵的实验室天平或危险的易碎玻璃器皿即可定量和稀释。\n\n\
  传统用于测定水溶液电导率的图形记录方法采用低压、施加的交流信号，该信号必须经过整流、滤波和放大，以产生适合记录的直流信号。使用`TL074`集成电路（`$0.65\
  \ USD`）开发的电路可产生`0 V`至`5 V`范围内的模拟信号，该信号可由`Arduino`微控制器或连接到`10`位或`12`位`ADC`的`RPi`直接转换为数字信号，用于连续条带图显示。\n\
  \n连续电解电导率监测仪将该技术应用于过程控制系统或化学分析程序，例如电导滴定。\n\n基于`555`定时器的连续电解电导率监测仪实现起来非常简单，如图 7-9\
  \ 所示，并提供所需的低压交流激励信号，如图 7-10 所示。频率与氯化钠（`NaCl`）浓度（`ppm`）的关系图，如图 7-18 中的图 C 所示，其形状是二元稀释盐溶液系列从稀到浓范围的预期或正常形状。\n\
  \n许多基于`Arduino`的电导率测量系统是单次读数方法，该方法在固定时间后或电极电压稳定时确定浸入式探头上的电压。使用*使用 Arduino 的环境监测*中的代码收集和绘制的数据以微西门子（`µS`）为单位报告，并由被测溶液中探头板最终显示的稳定电压推导得出。\n\
  \n直观地说，最终测量电压应与在`Arduino`输出引脚电压施加的标称`5 V`电场影响下，累积在板周围的电荷成正比。直观地说，离子浓度越高，存储在浸入电极板周围双电层中的电荷就越强。\n\
  \n在进行或使用电解电导率测量时，必须认识到几个注意事项和局限性。\n\n-   要获得成比例、可重复的数据测量或监测浓度趋势，应避免离子间相互作用可检测到的溶质水平。测量应在许多电导率与浓度关系图中曲线急剧上升或下降的部分进行。\n\
  \n-   电解电导率值只能通过与已知标准进行比较并进行适当的电池常数计算来建立和验证。\n-   使用高于`1½ V`至`2 V`电压的电导率测量系统会导致电极表面发生电化学反应，导致气体生成或电导率探头电极加速腐蚀。\n\
  -   在强酸或强碱中进行电导率测量时，可能需要使用铂电极。\n\n## 电导率：相对湿度\n\n在`100%`相对湿度下，大气中会出现薄雾、浓雾或降雨，空气被水蒸气饱和。小于`100%`的相对湿度（`RH`）值可以指示一团空气低于水蒸气饱和点的程度。\n\
  \n环境温度决定了空气理论上能容纳的水蒸气量。在寒冷气候下，低温造成干燥条件，从而产生静电积聚。靠近大型水体的炎热夏季条件会将相对湿度（`RH`）提高到几乎无法进行静电演示的程度。\n\
  \n`RH`值可以使用由湿敏金属氧化物陶瓷泡沫制成的传感器来测量。典型的探测器由一个夹在两个导电金属电极之间的湿敏板组成。传感器从空气中吸收水分，在氧化物表面，水在一个薄分子层中电离。随着氧化物表面电离水质量的变化，探测器的电导率发生变化，从而产生`RH`的测量值。\n\
  \n表 7-5 列出了两种`RH`探测器（`DHT11`和`DHT22`，价格分别为`$12`和`$22 CDN`）的特性，这两种探测器可从许多在线来源或本地电子供应商处轻松获得。\n\
  \n**表 7-5**\n\n`DHT11`和`DHT22`相对湿度传感器特性表\n\n| `DHT11` | `DHT22` |\n| :--- | :---\
  \ |\n| 特性 | 特性 |\n| `RH`范围：`20-80%` | `RH`范围：`0-100%` |\n| 精度：`±5% RH` | 精度：`±2%\
  \ RH`（在`25°C`时） |\n| 最大分辨率：`1% RH` | 最大分辨率：`0.1% RH` |\n| 采样周期：`1`秒 | 采样周期：`2`秒\
  \ |\n\n金属氧化物表面分散水膜的能力有限，过多的蒸汽或液态水会使表面饱和，从而实际上使探测器短路。饱和的探测器可以通过按照制造商的程序去除多余的水分来恢复。\n\
  \n\n\n## 实验\n\n可以将 DHT11 或 DHT22 传感器连接到 Arduino 微控制器上，以测量并显示该传感器所处气体环境的温度和相对湿度（RH）。\n\
  \n可以使用分辨率较低的 DHT11 进行环境相对湿度的测量。对于需要更高分辨率或更大相对湿度测定动态范围的实验或测量（如水分活度评估），则可以使用分辨率更高的\
  \ DHT22。\n\n读取传感器所需的库文件可以从设备制造商、供应商或 Arduino 网站下载，同时还附带了几个 Arduino 读取程序，这些程序出现在相应库文件可用代码菜单的“示例”条目中。DAQFactory\
  \ 和 RPi 计算系统可以跟踪并绘制任何通过 Arduino 串口传输的数据流。Arduino 库提供了读取传感器相对湿度和温度的代码。通过修改示例程序，将读取程序的输出改为仅向串口传输以逗号分隔的数值对，控制计算机就能读取并绘制数据。\n\
  \n所有发送到串口的描述性打印语句都应在 Arduino 代码中被注释掉。第一个数值数据通过 `Serial.print(nn.nn);` 输出，接着是 `Serial.print(“,”);`，最后是\
  \ `Serial.println(nn.nn);`。然后，串口应显示所需的数据格式，即一列由逗号分隔的双精度浮点数。\n\n相对湿度测量始于验证 Arduino\
  \ 串口输出，该输出应在串口监视器输出窗口左侧产生一列以逗号分隔的浮点数值。在我使用的 Windows 系统上，必须先启动 Arduino，验证其输出，并在启动\
  \ DAQFactory 程序之前关闭串口监视器。如果未遵循此初始化顺序，会导致其中一个程序抛出“端口使用中”的错误。\n\n为了使 DAQFactory 串口能够读取和解析逗号分隔值（CSV）数据，需将本章末尾的\
  \ I/O 数据解析代码安装到 DAQFactory 串口的“接收时”事件中。\n\n对待测材料进行水分活度测量，需要使用一个容积小、表面孔隙率低且隔热的湿度监测室。图\
  \ 7-19、7-20 和 7-21 展示了我的设备。实验开始前，先启动软件，并为空的但已关闭的室体建立稳定的基线。一旦基线稳定，将新鲜制备的硅胶干燥剂装入室体底部的抽屉，然后将抽屉插入底部隔间，固定好上下前面的挡板，并让室内相对湿度值降至稳定值。\n\
  \n当室内的水分含量达到最低值时，可以在两个腔室之间插入隔离板。通过顶部挡板的开口插入样品，然后密封取样门。\n\n接着，你可以让腔室的相对湿度以及图形显示上升至一个稳定值，该值代表了平衡相对湿度（ERH）。\n\
  \n## 平衡蒸汽压室的组装\n\n平衡相对湿度（ERH）室的组装与构造如图 7-19 至 7-24 所示。在实际应用下述 ERH 室时，很明显需要进行一项简单但重要的修改，即将接线从腔室后部引出，以避免干扰样品的放入和取出。\n\
  \n![../images/503604_1_En_7_Chapter/503604_1_En_7_Fig19_HTML.jpg](img/503604_1_En_7_Fig19_HTML.jpg)\n\
