  \ 1/10 Hz 至 3 MHz 之间的振荡器输出频率，应该可以测量 1 pF 至 10 mF（10,000 μF 或 1/1000 F）范围内的电容值。测量应基于遵循前述公式的电容-频率数据线性部分进行，这些数据是可复现且可预测的。低于\
  \ 100 pF 的低电容值可能需要使用 1 MΩ 电阻网络进行单独校准，以确保合理的精度。\n\n1 kΩ、10 kΩ、100 kΩ 和 1 MΩ 的电阻总和应能覆盖常规电路中遇到的电容范围。（注意：某些\
