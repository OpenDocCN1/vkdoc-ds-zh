  \ 23.9 V 的电势差。尽管由于云层条件而波动，它仍然能向 1200 Ω 的负载提供大约半瓦特的功率。\n\n### 步进电机磁电机/发电机的内阻\n\n\
  图 11-18 描绘了用作磁电机/发电机电源以产生电能的步进电机的多个磁极所产生的电压“纹波”。\n\n```\n![../images/503604_1_En_11_Chapter/503604_1_En_11_Fig19_HTML.jpg](img/503604_1_En_11_Fig19_HTML.jpg)\n\
  ```\n\n**图 11-18**  \n来自步进电机磁电机/发电机的整流器输出波形\n\n使用图 11-14 和图 11-15 中的双步进电机驱动器-步进电机-发电机装置进行的一系列测试测量，产生了汇总于表\
  \ 11-5 的数据。\n\n**表 11-5**  \n步进电机-发电机输出\n\n```\n| -![../images/503604_1_En_11_Chapter/503604_1_En_11_Figd_HTML.jpg](img/503604_1_En_11_Figd_HTML.jpg)\
  \ |\n```\n\n## 讨论\n\n当实验设备远离主电源供电范围或受其存在干扰时，为其供电会变得困难。对于偏远野外地点和隔绝环境，电池通常是最实用的电源。如果在偏远地区需要延长电池寿命，可以构建一个电子充电系统，从周围环境中收集能量来补充电力。\n\
  \n从电池的电化学反应中获取的电源几乎是无噪声的，并且通常适用于灵敏的实验，例如那些使用静电计的实验。\n\n\n好的，作为高级文档工程师和翻译员，我将遵循您提供的格式和注意事项，将以下英文文本翻译成中文。\n\
  \n\n### 电池\n\n一次性电池和可充电电池电源可由为消费用途商业制造的标淮规格组装而成。大多数单节或多节电池组依赖电化学反应在放电模式下产生电能，对于二次电池（可充电电池），则在充电过程中吸收电能。\n\
  \n在许多情况下，电池电芯的电化学反应是基于液体的反应，其中离子扩散到电极表面和远离电极表面的速率，决定了电能输送到或接收自连接电芯的外部电路的速率。\n\n\
  电池电芯中的电化学系统通过氧化/还原反应产生电子。在全新的锌基化学电池中，大部分化学物质处于还原的金属状态，当被氧化时，会释放电子到外部电路做功。在一次电池中，氧化过程持续进行，直到没有足够的金属来维持可用的电子流。从金属原子到氧化物基化合物的转变伴随着电芯内阻的相应升高。在许多产电的电化学电池中，内阻可以衡量系统的荷电状态。\n\
  \n如表 11-4 所示，测量内阻的两种方法得出的品质因数大小相近，但在数值上始终存在差异。在表观内阻值较低时，两种方法的差异似乎约为 20%，其中双电流测量法的结果较低。在进行开路电压（OCV）测量时，由于没有发生氧化/还原反应，电芯内部处于静态的电化学环境。当电流开始流动时，离子在电极上的扩散控制了电荷转移到外部电路的速率。可以认为，在由静态环境变为动态系统时使用欧姆定律，会使得该技术计算出的表观内阻高于在消除高开路电压后计算出的值。\n\
  \n对于使用开路电压法会导致内阻值偏高这一偏向，可以从对一个不包含电化学电池的市电供电壁挂式电源所计算出的数值中得到部分支持。\n\n这两种技术都具有相当好的可重复性，并且可以作为估算电池相对荷电状态的合理技术。当处理一种或多种类型的电池时，您应注意测量任何给定电芯表观内阻所采用的技术，以及为一次电池或刚充满电的二次电池测得的数值。使用表观内阻技术是一种比较性的操作，必须要有参考数据，该技术才有价值。\n\
  \n用于估算电化学储能介质内阻的两种数学方法的一个共同特点是，它们都消除了所使用负载的数值。虽然负载电阻的数值并未出现在计算中，但为测试电路选取的数值（见图 11-12）应尽可能高。高负载电阻值会产生低电流，因此电流表必须能够准确测量这些较低的电流。\n\
  \n两种内阻测量技术都会从储能介质中汲取电流。如果在电路故障排除过程中，被测电池是纽扣电池或昂贵的锂一次电池，则开路电压法仅汲取一次电流，而双电流法则汲取两次。如果被测的一次电池将在测试后继续使用，则首选开路电压法。\n\
  \n电池制造商使用一种自动化的压降法，因为它只需要在两个不同负载下测量电流和电压。\n\n使用压降法时必须采取预防措施。\n\n-   用作测试负载的电阻器必须按比例缩放以适应电源的电压，并且其额定功率足以处理所汲取的电流。\n\
  -   用于测量电源电压和电路电流的仪表应在其输入端具有保险丝保护，并且必须在测试期间能够承受并以其足够的精度读取电流和电压参数。\n-   电流汲取应尽可能短，以最大限度地减少电路元件的发热并避免过度消耗电池/电源的电量。二次电池在测试后可以充电，但一次电池不可以。如果电池要在测试后投入使用，则应避免汲取过大的电流。\n\
  \n可充电电池失效的主要原因是过度充电。过度充电会导致过热，从而破坏许多使电池能够循环工作的、精细分散且具有高表面积的材料和化合物。通过使用微处理器控制的充电器（如图\
  \ 11-1 中的项目 E 所示）可以避免过度充电。\n\n对施加于电芯中不同电化学反应的充电功率进行可编程控制，可以在电芯电压从其放电状态回升到满充电水平时降低所施加的功率。微处理器可以限制施加功率的时间，并测量电池积累的电量，以避免过度充电。可以通过多种不同技术将能量恢复到电芯，例如使用恒压或恒流充电，以及在电芯恢复到满充电状态时使用\
  \ PWM 来降低功率输入。\n\n微处理器可以通过脉冲式地开启和关闭充电功率，让电芯在两次电流输入之间冷却，从而避免过热。\n\n除了充电功能，微处理器控制的充电器还可以“修复”某些类型的可充电电池，特别是镍基电池。按照充电器操作手册中所描述的，循环进行受控的放电和充电，通常可以恢复许多性能衰退的镍基电池的大部分原始容量。\n\
  \n在丢弃内阻高的镍镉（NiCd）或镍氢（NiMH）电池之前，使用图 11-2 中的可变电阻装置将这些电池放电至低于一伏。然后，使用图 11-1 中所示的项目\
  \ F 的专用镍氢充电器对这些电池进行充电。通过深度放电和再充电，我成功地将几节电池恢复到了可用状态。\n\n图 11-1 中的微处理器控制单元可以通过精确的放电-充电循环自动修复镍基化学电池。\n\
  \n充电会在电池电化学过程中引起少量的副反应，这些副反应会累积并最终限制电池的充电次数。\n\n关于电池和充电器的电化学及物理特性的全面摘要，请见[`www.mpoweruk.com/index.htm`](http://www.mpoweruk.com/index.htm)。\n\
  \n恒压充电是以高于被充电电芯电动势（EMF）的电压施加直流电流。铅酸和锂离子电池使用这种简单且低成本的方法。\n\n恒流充电系统通常用于镍基化学电池，在达到满充电时会关闭。\n\
  \n渐变电流仅用于 SLI（起动、照明、点火）电池。随着电芯电压升高以匹配充电源的固定电压，充电器电流会逐渐减小。\n\n脉冲充电是以调制宽度的脉冲形式向电池施加电流。PWM\
  \ 脉冲允许电极上的化学反应继续进行、允许扩散作用补充电极表面的化学物质、允许过多的热量消散，并允许在脉冲间隔期间测量开路电压（OCV）。\n\n\n好的，作为一名高级文档工程师和翻译员，我将严格遵守您提供的注意事项和示例格式，对给定的英文文本进行准确、专业的翻译。\n\
  \n\n电池的充电或放电速率通常用`C`倍率来表示，该倍率衡量的是相对于电池容量的充电或放电速率。一个额定容量为 250 mAh 的电池，如果用 25 mA 的电流充电，其`C`倍率就是十分之一。而以\
  \ 2500 mA 的速率放电，则放电倍率为 10。对于手头电池允许的充电或放电`C`倍率，请查阅电池制造商的说明文档。\n\n使用二次电池作为电源的实验，如果能够使用基于可编程微控制器的充电器来为电池组充电，将获益良多，这尤其适用于有市电电压供电的台架或实验室环境。\n\
  \n### 光伏电池\n\n硅光电池的每个 PN 结在暴露于阳光下时，能产生 0.6 V 的电势差。串联的电池数量决定了太阳能电池板能够提供的最大电压。电流的流动取决于光子的吸收。阳光照射越强，驱动管理负载的电流就越大。\n\
  \n图 11-4 中所示的两块太阳能电池板是两种现成的单元，它们专为收集太阳能以供给“下游”稳压器或电池充电器而设计。小型 5 V 面板的设计和制造旨在直接插入\
  \ Arduino 的辅助电源接口，为微控制器提供太阳能。大型 24 V 面板主要作为铅酸电池充电器的能源来源出售，用于补充电池组的大电流消耗，并在系统闲置期间提供“涓流”充电维护。\n\
  \n图 11-17 所示的曲线是太阳能电池板的典型曲线。为了利用这些器件的最大可用功率，必须控制电流消耗，将电压保持在 I-V 曲线的“膝点”以下。从光伏面板收集的电能必须通过充电控制器进行传输，以保持最大功率传输，同时避免电池组过充。\n\
  \n在汽车配件、体育用品和家装用品供应商处，有众多适用于车辆、便携式电动工具和电子产品中几乎所有类型可充电电池的太阳能充电系统可供选择。\n\n如有需要，可以从\
  \ Adafruit Industries 和 SparkFun Inc.等多家电子套件供应商处获得适用于实验装置、能够处理亚安培级电流的小型系统太阳能电源控制器。\n\
  \n### 机械能\n\n在靠近流动水域、或缺乏阳光但能接触到流水或风力的地点进行的实验，也可以通过机械作用从环境中获取电力。水的密度是空气的 820 倍。少量的流动水就能提供巨大的力量，以有用的速度驱动涡轮机。流动的空气则需要很大的表面积才能收集到足够的力，以相同的有效速度旋转涡轮。\n\
  \n当电机用作发电机时，旋转速度决定了它所能产生的电压。利用电磁感应原理，通过驱动电机作为发电机来发电，效率较低。这种低效的转换过程，由于驱动力是易于获得且几乎免费的，因此得到了弥补。\n\
  \n由于其有限的或全旋转设计的双重用途，步进电机不适合高速连续旋转。它们主要用于分步定位旋转。将电机的用途从消耗电脉冲反转成产生电脉冲，其所能创造的能量大小受到步进电机相对较低的连续旋转速度的限制，这一点与磁电机类似。\n\
  \n图 11-18 展示了旋转的 Howard Industries 3.6°步进电机产生的电输出。多个尖峰模式是由于步进电机用于以离散旋转增量移动的大量磁极造成的。一个典型的\
  \ 7.5°步进电机有 12 个磁极，因此每旋转一周会产生 12 个电脉冲。\n\n根据表中列出的转速（RPM）和通过 1200 Ω负载的功率数据（详见表 11-5）绘制的图表如图\
  \ 11-19 所示。\n\n![../images/503604_1_En_11_Chapter/503604_1_En_11_Fig20_HTML.jpg](img/503604_1_En_11_Fig20_HTML.jpg)\n\
  \n图 11-19\n\n步进电机输出功率与转速的关系\n\n图 11-19 说明了在从实验环境中收集能量时使用步进电机必须解决的几个问题。步进电机通常有一个中档“共振”频率，在此频率下其性能会下降，并且会发生过度磨损。如果实施连续旋转应用，旋转速度应高于或低于共振频率，这在风力驱动操作中可能很困难，但在流动水环境中是可行的。\n\
  \n使用风能或水能驱动有刷电机可以产生脉动直流电，可以通过电容器进行平滑处理，以供给稳压器或电池充电电路。要从较大的无刷直流电机中获取电力，你必须向该电源施加电力，并用整流器测量其输出，以确定特定的无刷电机是否适合用作发电机。图\
  \ 11-20 展示了一种测试高速电机是否适合作为发电机的方法。\n\n![../images/503604_1_En_11_Chapter/503604_1_En_11_Fig21_HTML.jpg](img/503604_1_En_11_Fig21_HTML.jpg)\n\
  \n图 11-20\n\n测试高速电机作为发电机\n\n棘轮式绑带夹具可以将手钻和待测电机固定在实验台上，使其对齐，以便进行旋转发电测试。在图 11-20 中，电机是一个其额定转速为\
  \ 1200 RPM 的 12 V 直流有刷电机（图 11-13a 和 11-13b 中的部件 A）。\n\n在 173 RPM 的旋转速度下，电机功率输出几乎检测不到。在\
  \ 600 RPM（手钻的最大速度）时，输出上升到 1.93 V，可在 1200 Ω负载上产生 1.60 mA 的电流，功率水平为 3.1 mW。要获得更大的功率输出，电机轴上需要显著更高的转速。\n\
  \n使用新的或旧的电动机制成的发电机进行电能生产效率低下。与发电机和驱动力相关的低成本通常使得开发此类系统是值得的。\n\n## 总结\n\n对于敏感或低电平测量，首选电池内部电化学反应产生的低噪声电源。\n\
  \n目前，电池生产采用六种左右的电化学工艺之一，分为可充电和一次性使用两种类型。\n\n电池的内阻是一个重要参数，它在很大程度上决定了电池能够提供或接收电流的速率，并指示特定设备中电池的剩余使用寿命。\n\
  \n微处理器控制的充电站可以避免过充电，而过充电是可充电电池和电池组失效的主要原因。\n\n光伏电池板可以维持为孤立或偏远地区的实验或过程供电的电池的电荷状态。\n\
  \n由电机构成的风力和水力机械发电机，虽然在电力生产方面效率低下，但其驱动力来自免费的能源。\n\n许多科学测量和实验需要高电压、低电流的电源，这类电源需要小心操作，可以由低压可调电源、高频振荡器、高压变压器、倍压器和高压整流器构建而成。\n\
