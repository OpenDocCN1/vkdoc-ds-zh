  \                // 1/B * ln(R/Ro)\nsteinhart += 1.0 / (TEMPERATURENOMINAL + 273.15);\
  \ // + (1/To)\nsteinhart = 1.0 / steinhart;                 // 取倒数\nsteinhart -=\
  \ 273.15;                         // 转换为摄氏度\nSerial.print(\"Temperature #2 \");\n\
  Serial.print(steinhart);\nSerial.println(\" *C\");\ndelay(1000);\n}\n```\n清单 3-3\
