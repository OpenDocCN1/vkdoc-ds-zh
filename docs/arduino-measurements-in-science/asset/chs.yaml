  // 通过将二极管的阴极短路端从\n// OUTPUT HIGH 改为 INPUT LOW（高阻抗输入，内部上拉电阻关闭）来隔离它\npinMode(LED2_n_side,\
  \ INPUT);\ndigitalWrite(LED2_n_side, LOW);  //关闭内部上拉电阻\n// 计算将阴极短路端电荷放电至逻辑 0 的时间\n\
