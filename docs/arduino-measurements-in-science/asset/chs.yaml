  测量工作通过组装待用的 LED 光源和探测器，并将两者与合适的样品支架对准来完成。机械部件安装完毕后，即可进行电气连接。使用`Arduino IDE`配合相应的软件和电源连接，可以点亮并测试光源。当光源发出测量所需的正确颜色光后，即可关闭外壳，并检查`Arduino
  ADC`的读数。需要获得稳定的读数，并且可能需要调整`Arduino`软件所平均的读数次数，以达到所需的稳定性。在这类光强度对比测量中，因使用更大的移动平均窗口而导致探测器响应时间增加的问题并不需要特别关注。


  为了获得稳定的探测器响应，可能需要进行一定的开发调试。当装有水溶剂的样品瓶置于样品支架中时，探测器响应应尽可能接近但小于`1024`。如有必要，可以通过调整二极管功率、光源与探测器的距离，或两者同时调整，以达到稳定、可测量的`0%`吸光度/`100%`透光率的基线状态。在完成了针对低端吸光度测量的仪器配置后，可将一个不透明物体放入样品支架中，以建立`100%`吸光度/`0%`透光率的读数。


  `ADC`值之间的差异需要足够大，以便从有色标准品梯度液中测得的各个吸光度/透光率值能够在感兴趣的浓度范围内形成一条线性校准曲线。


