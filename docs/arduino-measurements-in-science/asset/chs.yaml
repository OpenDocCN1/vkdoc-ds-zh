  trigger4 = 0;\n}\nif ((photogate4==0) && (trigger4==0))\ntrigger4 = 1;\ndigitalWrite(6,\
  \ LOW);\n//\n}\n列表 6-1\n用于 5 光闸斜坡赛道的 Arduino 代码\n```\n\n## 总结\n\n长线性距离和较短的相对位移测量可以通过多种技术实现，包括雷达、GPS、激光、超声波测距仪和应变片。\n\
  \n对一段距离内的定时运动进行测量，可以导航或检测破坏性振动的存在。\n\n四百年前，伽利略使用经典的计时运动实验来测定重力加速度。\n\n采用表面贴装技术、基于压电晶体和\
  \ MEMS 的微型传感器，可以为 SCADA 系统提供传感器，用于控制多自由度运行的设备。\n\n在第 7 章中，将探讨电阻和电导率的测量。\n\n脚注 1\
  \ 2\n\n# 7. 电阻与电导率\n\n电阻是衡量材料在承受电压差时对电流流动阻碍程度的物理量。阻抗也是衡量对电能流动阻碍程度的物理量。阻抗出现在交流电路中，例如包含电容器和电感器的电路，并且取决于交流电的频率。电阻是一个线性量；阻抗则不是。\n\
  \n在一个完整的电路中，欧姆定律将电场电压（导致电流流动）与电路中阻碍电流的总电阻联系起来。对电流通过的阻力取决于许多因素，例如承载电流通过电路的材料之化学成分、横截面积、长度和温度。\n\
  \nOhmite 公司是一家电气和电子电阻元件的制造商，它发表了一篇题为“电阻器术语”和“电阻值”的论文 ([`www.ohmite.com/assets/docs/res_select.pdf`](http://www.ohmite.com/assets/docs/res_select.pdf))。该论文描述了标准化电阻值的可用性，以及在涉及电气或电子电阻的讨论中常用的术语。它包含几个有用的表格和术语，描述了分数电阻值（即，从\
  \ 1/1000 或毫欧 (`MΩ`) 到 10¹² 或太欧 (`TΩ`)）。\n\n传统的化学将元素分为金属和非金属。金属元素通常是电导体，而非金属通常是绝缘体。金属元素的特点是具有较强的阻碍电流流动的倾向。电阻率用\
  \ `ρ` (rho) 表示，单位为欧姆/米，是材料归一化电阻的数值。\n\n导体的总电阻取决于物理参数，例如导体的长度、横截面积和温度。对于给定的固定温度，\n\
  \n`R = ρ×L/A`\n\n其中 `L` 是导体长度，`A` 是横截面积，`ρ` 是金属或合金的电阻率。\n\n除了导体的物理尺寸外，观察到的电阻还取决于进行观察时的温度。电阻率数值的一部分是由于电荷载流子之间的碰撞速率造成的，并且该碰撞速率随着温度的升高而增加。用符号\
  \ `α` (alpha) 表示的量被称为*电阻率温度系数*。在有限范围内，通过经验测量的电阻率随温度变化的值如下式所示。\n\n`ρ(T) = ρ[o][1+α(T–To)]`\n\
  \n其中 `ρ(T)` 是温度 `T` 下的电阻率。`ρ[o]` 是参考温度 `T[o.]` 下的电阻率。\n\n为组装电子电路而使用的电阻器通常会指定电阻温度系数。对于阻值相同的电子电阻器，电阻温度系数\
  \ (TCR) 较低的单元往往更昂贵。\n\n电阻和电阻率通常是与导电材料（如金属和半导体）相关联的概念。\n\n电导率是电阻的倒数，它与绝缘体和导电性差的介质（如固体绝缘体或金属氧化物、碳基有机化合物、液体溶液和气体）相关联。电导率是电阻的倒数，用希腊字母\
  \ `σ` (sigma) 表示，单位为西门子/米 (`S = 1/Ω`)。\n\n\n\n电导率通常通过组装电容式装置来测量，其中导体板的物理参数定义明确，被测材料形成类似电容测量系统的电介质。当对组装后的装置施加直流电压时，电流会流过电容器和被测材料。这可以通过电流测量设备或静电计进行测量。根据电流测量值和电容器已知参数，可以计算出被测材料的电阻率（参见第\
  \ 2 章）。\n\n几种形式的电阻需要特殊技术来监控和评估。内阻和等效串联电阻就是其中两个参数。\n\n内阻是应用于电池和其他电源的术语。测量内阻的技术将在第\
  \ 11 章中讨论。\n\n等效串联电阻是用于电容器和电感器的术语。它描述了特定类型的元器件与理想欧姆电阻之间的偏差。\n\n电阻过去使用模拟伏欧表（`VOM`）测量，现在则使用数字电压表（`DVM`）测量。对于价格适中的仪表（$25–$100\
  \ 加元），其电阻测量范围通常为 200 MΩ 到 200 Ω，精度可达三到四位数字。对于低于一欧姆的电阻测量，可以使用更昂贵的仪表（> $500 加元），这些仪表能够使用两线或四线连接以及可选的输入阻抗来测量毫欧（`mΩ`）电阻值（`mΩ`\
  \ = 1/1000 Ω）。\n\n实验科学通常涉及连续记录电阻或测量超出传统`DVM`显示范围的数值。以下三节内容将分别讨论低、正常和高欧姆值的测量。\n\n\
  ## 电阻的实验测量\n\n电阻也可以视为类似于机械摩擦。如果强制电流流经导电能力中等的导电介质或材料，导体就会开始发热。极端情况下，导电介质可能会达到其熔点。热能、电阻和电流之间的关系由以下表达式描述。\n\
  \n`P = I²R`\n\n* `P`是以瓦特为单位的功率。\n* `I`是以安培为单位的流过电阻的电流。\n* `R`是以欧姆为单位的电阻值。\n\n加热导体（如铜线或精密电阻器）通常会导致材料的电导率下降，这对某些类型的测量（例如低欧姆电阻值的测定）是不利的。为了测量小电阻，可以在增加电流的同时测量被测器件（`DUT`）两端的电压，同时需注意功率-电流关系的局限性。\n\
  \n低欧姆测量采用*开尔文连接*（以开尔文勋爵命名），这种连接方式使用四根导线来评估低电阻物体上承载大电流时所产生的微小电压降。\n\n在开尔文连接中，一对导线向被测电阻提供一个激励电流。第二对导线连接到电压传感设备并跨接在电阻两端。分离的电压传感电路几乎不受承载激励电流的电路电阻的影响。\n\
  \n在图 7-1 和图 7-2 中，电路表示了流过实际设备布线的电流，以测定低电阻值。图 7-1 显示了对已知电阻引线两端进行电压测量，然后对未知电阻引线两端进行第二次测量。电位差总是在电流连接点之间或“内部”进行测量。\n\
  \n在一定限度内，`R`值越低，可以通过`DUT`的电流就越高，从而在器件两端产生更高的电压降。\n\n## 分数和低欧姆值的实验测量\n\n### 方法 1\n\
  \n通常有必要测量低电压、大电流电路元件的电阻，例如在加热器、电机或涉及电池充电或电解精炼的电化学系统中可能遇到的元件。通过使恒定电流流经两个电阻（一个已知，另一个被测），然后测量每个电阻两端的电压降，即可通过简单计算确定未知电阻值。\n\
  \n在如图 7-1 所示的两个电阻组成的分压器结构中，流过每个电阻的电流相同。欧姆定律同时适用于已知电阻和未知电阻，如下所示。\n\n`V[1] = R[1]\
  \ * I` 且 `V[2] = R[2] * I`\n\n由此可得 `V[1/]R[1] = I = V[2]/R[2]` 且 `V[1/]R[1] = V[2]/R[2]`\n\
  \n所以 `R[1] * V[2]/V[1] = R[2]`\n\n图 7-1 中的简单电路在 Robot Room（[`www.robotroom.com`](http://www.robotroom.com)）爱好者网站上有所讨论。它可以在面包板上组装，并由任何方便的稳压\
  \ 5 V 电源供电。两个可选电容器用于抑制电源上的噪声，包括一个 0.1 μF 的陶瓷电容器和一个电容值在 10 μF 范围内的较大电解电容器。\n\n为了尽量减少温度效应引起的漂移，在\
  \ 5 V 测试系统中，`R[known]`应约为 220 Ω，并尽可能具有较高的功率或瓦特额定值。\n\n低值电阻的测定是通过组装以下电路来实现的，其中`DUT`位于分压器电路的底部。在电路通电并建立稳定电流后，可以测量已知电阻和`DUT`两端的电压降。对于`DUT`的低电阻值，需要使用仪表的毫伏刻度以获得足够的分辨率来进行精确计算。`DUT`的电阻值可由之前推导出的公式确定，如下所示。\n\
  \n![../images/503604_1_En_7_Chapter/503604_1_En_7_Fig1_HTML.jpg](img/503604_1_En_7_Fig1_HTML.jpg)\n\
  \n**图 7-1**\n\n用于测量低电阻值的电路\n\n`R[Dut] = Volt drop R[Dut] / (Volt drop R[known] /\
  \ R[known])`\n\n当`VR[Dut]`以毫伏为单位测量时，计算中必须使用适当的换算系数。（对于较低的毫伏读数，可以使用图 2-3 第 2 章中所示的电压跟随静电计。）\n\
  \n## 观察结果\n\n使用面包板和来自 LabJack U3-HV 的 5.10 V 电源（无平滑电容器）以及一个标称 220 Ω、¼ 瓦的电阻器（实测电阻\
  \ 217 Ω），对一个 1 Ω、1% 的功率电阻器进行了简单的验证测试，得到以下数值。\n\n`R[known]` = 217 Ω；`VR[known]` =\
  \ 5.04 V\n\n`VR[Dut]` = 23.3 mV，由此得出 `R[Dut]` = 1.0032 Ω\n\n该数据使用中等价位的仪表测量。使用廉价故障排查仪表的重复测量得到了以下数据和电阻值。\n\
  \n`R[known]` = 217 Ω；`VR[known]` = 5.00 V 且 `VR[Dut]` = 23.1 mV，由此得出 `R[Dut]` =\
  \ 1.0025 Ω。\n\n据报道，14 号铜线每 100 英尺长度的电阻为 0.40160 Ω。因此，每英尺导线应为 0.0040 Ω。使用 5.10 V\
  \ 激励电源时，217 Ω 电阻器两端的电压降为 5.06 V，而 1 英尺长的 14 号铜线`DUT`两端的电压降为 2 mV。这 1 英尺长的铜线的实测电阻为\
  \ 0.0047 Ω。\n\n该技术的局限性取决于测量`DUT`两端电压降的仪表的毫伏分辨率。在所进行的验证测量中，若以 0.1 mV 为可读取的最小值，则可测量的最小理论电阻值为\
  \ `0.1 × 217 / 5000` 或 4 mΩ。\n\n\n\n### 方法二\n\n对于低电阻的实际台式测量，可以通过一个适当编程的稳压器（如`LM317`）将流过低电阻`DUT`的电流设定并调节为\
  \ 100 mA。关于基于运算放大器 IC 的数字电压表（DVM）低欧姆适配器的构建，在 All About Circuits 网站上有相关讨论（参见 [`www.allaboutcircuits.com/projects/build-your-own-low-resistance-meter`](http://www.allaboutcircuits.com/projects/build-your-own-low-resistance-meter)）。\n\
  \n需要一个能够提供 100 mA 电流的 5 V 电源来驱动诸如`LM317`之类的稳压器。`LM317`通过应用以下公式来编程设定电流输出：`i[out]\
  \ = 1.25 / R[adjust]`。一个 100 mA 的恒流源可以通过在稳压器芯片的“调整”端和“输出”端之间插入一个阻值合适的电阻（`R` = 12\
  \ Ω）来实现，请回忆`I²R`公式。（由于`LM317`可以调节高达 1 A 的电流，100 mA 的电流调节需要一个 12 Ω 的电阻，`1.25 / 12\
  \ = 0.1A`）。\n\n图 7-2 描绘了将 100 mA 电流通过负载电阻或被测试设备的通用接线和配置。较高的恒流电流使您能够测量被测设备中更低的电阻值。\n\
  \n![../images/503604_1_En_7_Chapter/503604_1_En_7_Fig2_HTML.jpg](img/503604_1_En_7_Fig2_HTML.jpg)\n\
  \n图 7-2  \n用于低值电阻恒流测定的电路\n\n所选组件应确保流过`DUT`的电流维持在 100 mA 范围内的一个相对恒定值。随着标称 100 mA\
  \ 的激励电流通过未知电阻，可以测量负载两端的电压降来确定`DUT`的电阻。激励电流和电压测量仪表采用开尔文配置连接。负载电压测量仪表连接在靠近`DUT`的位置，以便仅测量负载电阻电压。任何由承载激励电流的引线引起的效应都被旁路了。电源连接在电压测量触点“外部”，因此电流流动不会影响电压测量。\n\
  \n## 观察结果\n\n使用来自诸如`LabJack U12`、`U3`或插入式“墙插”电源等设备的标称 5 V 电源，以及在配置为恒流模式的`LM317`稳压器上使用一个\
  \ 12 Ω 的编程电阻，产生了 100 mA 的电流。使用`LabJack U3`的 5 V 电源产生了 105.1 mA 的激励电流，在一个 1 Ω、1%\
  \ 精度、12.5 瓦的电阻上测得 104.8 mV 的压降。该器件的表观测量电阻为 0.9971 Ω。使用一英尺长的 14 号铜线进行的类似测量显示电压降为\
  \ 0.3 mV，结合之前测得的 105.1 mA 电流，表明电阻为 0.0029 Ω。\n\n我进行了几次额外的验证实验，以论证低电平或高灵敏度测量的一个基本原理。\n\
  \n在对 1 英尺（30.5 厘米）长、0.040 英寸（1.02 毫米）18 号铜线进行电阻测量期间，使用两台价格适中的手持式数字万用表（< 150 加元）测量了导线两端的电压降。在`DMM`的\
  \ 200 mV 量程上观察到 0.3 mV 的电压降。这些万用表的输入阻抗为 10 MΩ，读数位于仪表能力极限。根据 0.3 V 的读数，计算出导线的电阻为\
  \ 0.0113 Ω。使用一台输入阻抗为 100 MΩ 的 200 mV 数字面板表重复了对 18 号铜线的测量。观察到导线两端有 0.2 mV 的压降。计算得出的导线电阻为\
  \ 0.0076 Ω。\n\n第三组测量值为 0.215 mV，使用的是输入阻抗为 10 TΩ 的静电计，这与 100 MΩ 输入阻抗时的 0.2 mV 值非常接近。\n\
  \n工程数据表表明，18 号铜线的电阻率应为 0.00636 Ω/英尺。（请记住电阻与温度相关，见讨论部分）。10 MΩ 的`DMM`读数偏高，高出 `0.0114\
  \ – 0.00636 = 0.005 Ω`，而输入阻抗更高的`DPM`也偏高，但高出 `0.0076 – 0.00636 = 0.00123 Ω`。\n\n\
  通过使用更高阻抗的电压测量仪器及其改进的毫伏测量能力，获得的导线电阻测量值得到了近五倍的改善。\n\n## 中等或中值电阻测量\n\n大多数价格合理的数字电压表可以测量从\
  \ 1 到 10 Ω 直至 1 到 10 MΩ 的电阻值，精度可达 3 或 4 位有效数字。然而，对于监测连续变化的电阻，快速变化的数字数值显示作用有限。\n\n\
  基于时间的记录电阻值图形显示通常能通过提供趋势信息，为实验系统提供更多信息。\n\n一种动态监测技术源自 S. H. Christie 于 1833 年发明的用于测量未知实体电阻的静态电阻电桥法。该方法于\
  \ 1843 年由查尔斯·惠斯通爵士改进，至今仍被广泛使用。\n\n惠斯通电桥电路可以看作是并联的两个分压器电路，如图 7-3 所示。如今电桥的主要用途是连续动态测量由各种物理传感器（以`R[x]`表示）产生的微小电阻变化。热敏电阻温度传感、磁敏磁电阻元件以及对机械结构弯曲的应变片检测，是电阻电桥电路的三种更常见的用途。\n\
  \n电桥既可用于静态模式测量未知电阻值，也可用于动态模式连续监测电阻器的微小变化。当仪表确定节点电压相等且无电流流动的零点时，利用分压器方程可以证明 `R[x]\
  \ = R[2] (R[3] / R[1])`。测量的精度取决于已知电阻值的精度。\n\n电桥的第二种使用形式是监测节点之间的电压差。当电桥两侧电阻相等时，分压节点处没有电压差，因此它们之间没有电流流动。随着未知电阻值波动，分压点处的电压也随之波动，电桥失去平衡。电压波动的符号或电流流动的方向可以提供关于电桥电阻元件所监测物理现象性质的重要信息。\n\
  \n仪器放大器中的专用集成电路 (ASIC) 可以在`R[x]`变化时测量两个电桥节点之间的电压变化。高输入阻抗的仪器放大器 IC，如`AD620`，正是为这些应用而专门设计的（参见第\
  \ 3 章中的图 3-16）。\n\n![../images/503604_1_En_7_Chapter/503604_1_En_7_Fig3_HTML.jpg](img/503604_1_En_7_Fig3_HTML.jpg)\n\
  \n图 7-3  \n惠斯通电桥电路\n\n电桥电路通常被制造成专用集成电路，例如第 5 章中描述的各向异性磁电阻和巨磁电阻磁场检测器。\n\nAnalog Devices\
  \ 的 `AD620` 是一款流行的仪器放大器，常用于监测图 7-3 所示电路的电桥节点处产生的电压差（亦参见第 3 章中的图 3-14、3-15 和 3-16\
  \ 所示的电路）。\n\n\n\n## 高电阻值的测量\n\n大多数台式及手持式伏特-欧姆表的测量能力无法覆盖两位数兆欧级别的电阻值。当需要时，可使用商用仪器，通过施加数千伏电压来驱动电流通过高值电阻。基于欧姆定律的高电阻值测量，在采用常用电池电压作为测量驱动电位时，需要对微小电流进行测量。图\
  \ 2-3 中描述的电流静电计可用于测量第二章 2 中的微小电流。\n\n第二章 2 中基于 TIA 的电路（见图 2-1 和 2-4）具有高输入阻抗，可测量\
  \ `10^(–12)` A 量级的电流；若与 `12 V` 激励电池配合使用，应能提供高达 `1.2 × 10¹²` 或吉欧姆 (`GΩ`) 量级的电阻测量能力。\n\
  \n电流静电计可测量电容器的泄漏电流。液体型电解电容的测量也是对其电介质电导率的一种度量。测量电容器漏电的相同技术，也可用于测量任何可置于两块导电板之间以构成电容器的材料的高电阻和电导率。\n\
  \n图 7-4 展示了测量被测器件（DUT）极板间材料电导率或电阻的通用配置。\n\n![../images/503604_1_En_7_Chapter/503604_1_En_7_Fig4_HTML.jpg](img/503604_1_En_7_Fig4_HTML.jpg)\n\
  \n*图 7-4* 用于低水平电流测量的 TIA 静电计配置\n\n## 讨论\n\n不寻常或特殊形状的电阻元件，可使用从多个供应商处获得的电阻丝来制作（例如，参见\
  \ [`https://jacobs-online.biz/nichrome_wire.htm`](https://jacobs-online.biz/nichrome_wire.htm)\
  \ 和 [`www.omega.com/en-us/`](http://www.omega.com/en-us/)）。\n\n在数字系统及来自模拟系统的低电压信号处理的日常工作中，所遇到的电阻值均在手持式仪表可测量的范围内。对电路板和电阻值的手工操作不会产生有害后果。当接触到高值或低值电阻对象或器件时，表面污染（来自皮肤油脂、湿气中的水分或大气污染物）会对电路性能产生不利影响。极高或极低阻值的电阻必须保持清洁，并防止一切形式的污染。\n\
  \n虽然晶体金属在其体相（bulk format）中存在自由电子，这些电子在电位差作用下可在金属内部自由移动，但其自由度因元素的原子结构以及施加电位差场的物理条件而异。在体相金属中，衡量电子流动受阻程度的可测量术语就是电阻。所有材料都具有依赖于温度的电阻。然而，某些元素在低温条件下会失去电阻，成为“超导体”，其电阻几乎降至零。用于探测弱磁场的人体全身磁共振成像（MRI）医疗诊断系统中使用的超导量子干涉仪（SQUIDS），工作于\
  \ `–269°C` 或 `4°K` 的液氦温度下。\n\n为电子电路制造使用的电阻有多种形式，采用不同的材料来产生所需的标称电阻值。碳、薄膜和金属合金丝是制造电阻常用的部分材料。通常可以从几种构造材料中选择所需的电阻值。成本和所需的电阻温度系数（`TCR`）通常是决定因素。\n\
  \n`TCR` 定义了电阻随温差变化的函数关系。\n\n`TCR = ((R2 – R1)/R1(T2 – T1)) * 10^(–6)`\n\n`TCR` 的单位是\
  \ `ppm/°C`，`R1` 是室温下的电阻值（单位为欧姆），`R2` 是工作温度下的电阻值（欧姆），`T1` 是室温，`T2` 是工作温度，两者单位均为 `°C`。\n\
  \n表 7-1 列出了多种常见材料与元素的 `TCR`。公布的数值应视为电子电路板预期工作环境温度下的合理近似值。这些系数取决于标称材料的纯度，且许多 `TCR`\
  \ 值在较宽的温度范围内并非线性。在电阻加热应用中应参考专业文献（见第 3 章）。\n\n*表 7-1* 金属与合金的 TCR 值\n\n| -![../images/503604_1_En_7_Chapter/503604_1_En_7_Figa_HTML.jpg](img/503604_1_En_7_Figa_HTML.jpg)\
  \ |\n\n## 电导率\n\n当承载电流的导电介质并非金属的晶体形式时，传统的电阻概念及欧姆定律（在用于铜、铝、铁、镍、铬、锡、铅、锌等常见金属元素的晶体形式，以及由这些元素制成的特定合金时）必须加以修正。*电导率*（Conductivity）这个术语通常用于描述电流通过非晶体金属介质时的传输。\n\
  \n在特定条件下，金属元素可以通过失去电子形成稳定的正离子（称为*阳离子*）来表现其特性。非金属元素可以获取一个电子，形成稳定的带负电粒子，称为*阴离子*。\n\
  \n完整的化合物可以失去或获得电子，形成正离子和负离子，这些离子在电场作用下，通过电荷转移来传导电流。\n\n在环境条件下，物质或材料以气体、液体或固体形式存在。每种物理形态的导电介质都有其独特的电流传导方式。金属通过电子在晶体结构的导带中移动来传导电流。溶液通过阳离子和阴离子在液相中的物理运动来传导电流。气体则通过电离粒子的迁移和扩散过程来传导电流。\n\
  \n等离子体于 `1920 年代` 被发现，是含有足够能量将电子从原子核中分离出来的电离气体。分离出来的电子靠近原子核，并在等离子体移动时通常与之相伴而行。由于等离子体由带电实体组成，因此会受到电场和磁场的影响。太阳核心、闪电以及北极光和南极光都是等离子体的例子。\n\
  \n## 固体中的电导率\n\n### 导体\n\n化学根据元素原子得失电子的倾向，将元素分为两大类：金属和非金属。银、铜、金、铝、锌、锡、铅、铁、镍、铬、铂以及碱土金属等许多元素都是优良的电导体。处于晶体形式的金属元素具有能带，电子在施加的电位差作用下可以在其中轻易移动。尽管金属之间传导电流的能力存在巨大差异，但由于其电导率非常高，通常通过它们的电阻或电阻率来比较不同金属的导电性。\n\
  \n### 绝缘体\n\n像硅和硫这类在其固体矿物形态下缺乏低能导带的元素，与几乎所有金属氧化物一样，由于导电能带已被填满，因此是绝缘体。理想的绝缘体应不显示任何导电性，但材料本身及表面杂质常常会导致其具有微小但有限的电流通过能力。\n\
  \n\n\n### 半导体\n\n通过向具有相反倾向的原子晶体中添加微量能够从其外层接受或贡献电子的元素，可以形成 PN 结。固态器件，如晶体管开关、发光二极管和光敏二极管，都可以用这些半导体材料制造（参见第\
  \ 4 章的图 4-41 和第 11 章的图 11-3）。\n\n## 液体的导电性\n\n液体是不可压缩的流体材料，其形状会随容器而改变。液体的导电性取决于构成液体的材料的化学性质。\n\
  \n### 离子电解质\n\n由原子或分子结构使其能够在常温或接近常温下解离成带正电和负电的物质组成的液体，称为**离子液体**。传统的离子化合物，如氯化钠（也称为普通食盐）和其他盐类，是固体晶体材料，它们只能在合适极性液体溶剂（如水）中解离成正负离子。然而，如今市面上有许多熔点处于常温范围的盐类，这些材料被称为离子液体。离子液体是由带正电的阳离子和带负电的阴离子组成的室温流体。\n\
  \n在含有溶解的正负离子的水溶液中，如果将两个导电电极插入溶液并施加直流电场，会在两个电极周围形成极化层。初始施加电压时，离子会迁移到相反电荷的电极上，最终覆盖整个电极表面。电流仅在离子迁移时流动。当电极表面被覆盖后，主电流流动停止。覆盖在相反电荷电极上的离子层会吸引与电极极性相同的离子。如图\
  \ 7-5 所示，两个电极上都会形成双电层。\n\n![../images/503604_1_En_7_Chapter/503604_1_En_7_Fig5_HTML.jpg](img/503604_1_En_7_Fig5_HTML.jpg)\n\
  \n*图 7-5：稀溶液和浓溶液中的双电层*\n\n正如以下实验所展示和验证的，测量溶解盐溶液的电导率并非易事。\n\n### 非离子液体\n\n水由一个氧原子与一对氢原子键合而成。它属于共价分子，因为原子仅共享部分电子。在盐中，电子的给予与接受各自由分子的一半完成，从而通过新生成的正负电荷之间的电吸引力结合在一起形成一个整体。\n\
  \n如果将两块板浸入液体中，并在离子液体中对两块板施加电压，预计液体中带正电的部分会向负极板迁移。带负电的物质则向正极板迁移。所施加的电压使离子液体中的电荷移动，从而形成电流。另一方面，如果液体是共价型分子，则不存在能被外加电压产生的带电板所吸引的离子物种。由于没有电荷迁移，该液体就像绝缘体一样。\n\
  \n可以通过向水等绝缘液体中添加可电离、水溶性的结晶盐，形成含有可移动阳离子和阴离子的液体溶液，从而将其转变为导电介质。\n\n### 电容耦合非接触电导检测法（C4D）\n\
  \n`C4D`使用高频发射电极，以大振幅电磁信号照射导电液体样品的一个区域。然后，由浸没在液体中或环绕液体的接收电极接收相应的衰减交流信号，并提取直流信号进行记录。`C4D`技术的一个优点是它是非接触技术，发射和接收电极不会与待测流体接触。由于无需接触流体，该技术可应用于小样品，并用于毛细管色谱分离技术。该技术使用复杂的高频电子设备，并应用于更高级的研究工作中。\n\
  \n### 气体的导电性\n\n气体是可压缩的材料，会膨胀以充满并适应容器的形状。\n\n大多数气体是共价或单原子实体，在正常条件下不导电。需要通过高电压或特殊条件（例如暴露于高能电离辐射）才能将气体转变为导电介质。\n\
  \n气体是一群彼此不连接、受热激发的振动分子。在大气压下，气体中产生的任何电离或带电物质必须克服与其他分子的持续碰撞，才能在电场或存在的电压差影响下发生迁移。气体的导电性取决于许多因素，例如其化学结构或组成、温度、压力以及施加电压的大小。\n\
  \n### 电弧与火花放电\n\n虽然大多数气体在电压升高时是绝缘体，但仍可能发生多种形式的导电。干冷冬季气候中的干燥大气条件会导致静电积累，最终击穿空气电阻，电弧火花使电子移动以中和静电电压不平衡（参见第\
  \ 8 章）。闪电本质上是一种大规模的电弧放电。\n\n### 火焰电离\n\n燃烧定义为一个能产生明显热和光的化学反应。燃烧仅发生在气相，并且是一种自由基化学反应机制。自由基是带有未配对电子的分子或原子，可能表现出正电荷或负电荷，因此能在电场作用下传导电流。基于氢的火焰电离检测器（`FID`）广泛用于烃类分子的气相色谱分析。\n\
  \n有机化合物中的氮、磷、硫和卤素原子可以通过向火焰电离检测方法中添加电离催化剂来检测。\n\n典型的火焰电离检测器使用静电计来测量皮安级电流，当偏压为 400V\
  \ 的电极导致离子在`FID`装置的燃烧区中迁移时会产生这种电流。\n\n### 辉光放电\n\n在高电压作用下，通常可以在 2kV 至 3kV 的电场下从气体分子中提取电子。自由电子向阳极加速移动，而带正电的离子则向阴极迁移。\n\
  \n取决于气体压力（这决定了一个称为*平均自由程*的参数），离子可能能够获得足够的动能来在撞击时产生额外的电离，从而形成能够传导电能的自持“雪崩”链，也可能无法做到。碰撞和电子撞击会激发气体原子上的电子跃迁到更高能级，当它们回落到正常能级时会辐射出光子。发出的光子是霓虹灯照明中看到的特征颜色光。氦、氖和氩等惰性气体可制成各种颜色的辉光放电发光器。\n\
  \n氖气放电有时被用作大功率电路中的稳压器。\n\n## 气体导电性在化学分析中的应用\n\n\n\n### 电感耦合氩等离子体发射光谱法与质谱法\n\n在光学发射光谱分析中，电感耦合等离子体（ICP）是在一个名为*炬管*的小型石英管出口尖端处产生的。稳定的惰性气体（通常为氩气）从管底端入口流向顶端出口，在出口上方形成垂直等离子体，因此得名*炬管*。\n\
  \n一根水冷铜管在靠近炬管出口端的石英管外部缠绕三到四圈。高频交流信号驱动铜管线圈，在线圈、石英管和氩气内部产生强大的磁场。\n\n所产生的磁场对电子施加作用力，引发碰撞、电离和束缚，理论温度可达\
  \ 6000°K 至 10,000°K 范围。通过泵将雾化的微小液滴溶液注入炬管底部，溶液中的任何原子都会使其电子受激，并在穿过等离子体时被电离。当受激电子回落到正常能级时，它们会发射出光子，这些光子具有其所在原子能级差的特征。\n\
  \n使用光谱仪分离穿过等离子体的原子所产生的各个波长的光，可以通过波长进行定性鉴别，并通过发射波长的强度提供定量信息。灵敏度范围从千分之一到十亿分之一，有时甚至更高。\n\
  \n由于等离子体炬管中产生的物质带有电荷并受电场和磁场的影响，因此可以采用质谱技术根据其原子质量进行分离。传统的离子提取、磁场偏转和静电聚焦等质量分离技术，可实现高达千万亿分之一（10¹⁵\
  \ 分之一）的灵敏度。\n\n### 离子迁移谱法（IMS）：等离子体色谱法\n\n气体在环境条件下可通过多种技术电离，其中一种方法是利用放射性元素的辐射。镍\
  \ Ni⁶³ 和镅 Am²⁴¹ 被用作 β 粒子或高能电子的源，这些粒子或电子可以电离气态分子或原子。在 IMS 中，特定的化学结构优先被电离，并在强均匀电场作用下向带相反电荷的电场板迁移或漂移。漂移时间是所研究分子的特征参数。在分离技术的早期发展阶段，该技术被称为*等离子体色谱法*，但现在使用的是现代术语*离子迁移谱法*。许多爆炸性化合物都是含氮物质，IMS\
  \ 对这些物质具有皮克（10^(–12) 克）级的灵敏度。\n\n### 光电离\n\n通过用高能紫外光子照射原子和分子可以实现气体电离。许多挥发性有机化合物的结构具有较大的光子吸收面积，从而导致高能电子的射出和分子离子的形成。通过收集短波长光电离灯产生的电离电流，可以快速检测和定量许多爆炸性和有毒气体。第\
  \ 4 章的表格 4-1 列出了光电离检测器灯（PID）中使用的能级。\n\n## 实验\n\n许多在仪器仪表中广泛用于测量大量物理化学参数的导电率应用过于复杂，难以作为本简单工作中的练习使用。在测量水或盐溶液的电解导电率以及确定大气中的相对湿度时，可以很容易地演示两种更常见、较简单的利用导电率测量的应用。\n\
  \n气体体积中水分的测量是通过测定水在催化表面上吸附的导电率来进行的。测量包含待测材料的密闭空间内的平衡相对湿度，可以确定测试样品的水分活度。水分活度是预测食品安全性的重要参数。\n\
  \n控制液体中水溶液电解导电率测量的基本概念，最好通过溶液中一种可电离电解质的适当浓度来演示。常见的食品级食盐和蒸馏水是两种容易获取的材料，可以用它们进行明确的水溶液导电率测量。\n\
  \n\n好的，作为高级文档工程师和翻译员，我将遵循您提供的注意事项和示例，将以下英文文本翻译成中文。\n\n\n### 水溶液中的电导率测量\n\n盐是酸与碱反应生成水作为副产物的产物。许多盐是水溶性的，溶解时会解离成离子。作为极性分子，水可以稳定溶液中带有正电荷或负电荷的盐组分，即阳离子或阴离子。当将电压施加到浸入含有溶解盐的水溶液中的两个导电板上时，带正电荷的盐组分被吸引到带负电荷的阴极，*阳离子*一词即由此而来。带负电荷的组分则被吸引到带正电荷的阳极。\n\
  \n当两个电极被放置于含有溶解的离子盐（如普通食盐（氯化钠））的水基溶液中，并在电极两端施加一个小型直流电压时，两个导电板之间的电流流动呈现出与电容器充电时观察到的相同类型的曲线（参见第\
  \ 1 章的图 1-1）。\n\n初始施加电压到板上会将阳离子或钠离子吸引到负阴极，将阴离子或氯离子吸引到正阳极。初始的高电流会随着离子聚集在各自电极周围而逐渐减小。最终，当电极被相反电荷的离子包围时，电流停止流动。图\
  \ 7-5 描绘了这种双电层的形成。\n\n电流停止流动的原因在于，施加到溶液上的小型直流电压没有足够的电能来释放聚集在电极上的离子。\n\n在低电压下，水是一种稳定的极性溶剂。开始水的分解或电解所需的最低理论电压是\
  \ 1.229 V。\n\n`2H[2]O + 电能 ![../images/503604_1_En_7_Chapter/503604_1_En_7_Figf_HTML.gif](img/503604_1_En_7_Figf_HTML.gif)O[2]\
  \ + 2H[2]`\n\n为了测量水基溶液或水溶液的电导率，施加的电压应保持在水分解点以下。为了避免电极周围形成绝缘的双电层，传统上使用交流激励信号。\n\n\
  被吸引离子包围的电极是*极化的*。极化的电极会再次吸引相反电荷的离子。当在两个电极上施加直流电压时，可能会形成一个电“双电层”。传统上，通过使用交流电压激励信号（通常在低频千赫兹范围内）来避免电导率测量过程中的极化和双电层形成，该信号可阻止离子向任一电极迁移。（回顾电容的讨论：电容器阻止直流电流，但能反转并导通交流信号。）\n\
  \n在使用交替极性电压测定水基盐溶液的电导率时，施加的电压不应高到足以在电极与周围离子之间引发过量的电子转移，这种电化学反应称为*电解*。电解会导致带电离子中和并形成中性原子。这些原子结合，在不同的电极上形成氢气和氧气气泡。元素氢、氧、氯、钠以及许多金属都是通过大规模工业过程批量制造，或通过电解反应在实验室规模下生产的。\n\
  \n传统上，电化学实验因其惰性而使用铂或金电极。石墨、钛和不锈钢是经济实惠的材料，可在许多电化学研究中替代贵金属。\n\n如果离子溶液暴露于低峰值电压、对称振荡极性的电信号中，预计它的行为会有点像电容器，并根据欧姆定律将电振荡传输通过电路。电阻和电容的组合称为*阻抗*，在中频下，它在基本的电流-电压关系中被当作电阻处理。\n\
  \n从理论上讲，高纯水不应含有任何杂质，因此只应存在来自水自电离的氢氧根阴离子和质子。化学文献指出，对于这种理论情况，质子和氢氧根离子浓度的乘积是一个低至`10^(–14)`的值。在水溶液中，如此少量的电离物质的存在不会传导出容易测量的电流。\n\
  \n如图 7-5 所示，盐在水介质中的溶解会产生一个电中性的溶液，其中包含单独带电的阳离子和阴离子。由于异种电荷相互吸引，同种电荷相互排斥，因此在低浓度下，当离子彼此间隔良好时，带电粒子之间的相互作用很小。在高浓度下，当带电实体紧密堆积时，预计会发生离子相互作用。离子浓度与测量电导率之间的预期线性关系可能无法观察到。\n\
  \n电导率用`G`表示，设为电阻率的倒数，这表明电阻越高，电导值越小。\n\n对非线性浓度-电导响应的补偿可以通过使用变化的“电池常数”来实现，该常数是通过测量电池或探针对已知电导率标准的响应而得出的。比电导率\
  \ (SC) 定义为测量的电导率`G`与经验电池常数`K`的乘积。电池常数通过作为电导率表达式（以`西门子/厘米`为单位）的归一化因子，来补偿电池几何形状和实验条件的变化。\n\
  \n`SC = G * k – 西门子/厘米`\n\n传统上，电导的单位（`1/r`，以欧姆计）被称为*姆欧*。它们被重新命名为*西门子*，形成了当前比电导的单位`S/cm`。西门子是一个很大的单位。更常用的是`mS`或`1/1000\
  \ S`以及`μS`或`1/1,000,000 S`。\n\n温度差异会影响水溶液中测量电导率的 4% 到 5%。为避免与温度相关的误差，电导率测量、溶液制备和标准化应在相同温度下进行。\n\
  \n生成准确的水溶液电导率测量值取决于使用在待测溶液的预期浓度范围内具有准确已知组成的盐溶液（参见表 7-3）。\n\n水溶液的电导率值范围很广。蒸馏水的典型电阻可能是`18\
  \ MΩ`，或表现出的电导率为`1 μS/cm`。自来水的典型值是`5 kΩ`或`50 μS/cm`。海水的典型值是`20 Ω`或`50 mS/cm`。\n\n\
  在工业应用中，通过对稀溶液或浓溶液的补偿，可以通过调整测量激励技术、尺寸、形状、构造材料以及电池电极的间距来进行优化。100 多年来，用于电导率测量池的简单双电极、平行板布置和低压交流激励的坚固性和实用性已得到证明和验证。对于大多数通用研究和常规实验室工作而言，本节开发的低压交流系统虽然成本较低，但具有比大多数其他已发表的测量系统更稳健的配置和可重复性以及更广泛的适用性。\n\
  \n\n\n## 实验\n\n传统的电解电导率测量采用低压正弦波激励待测溶液。变化的电压施加到溶液中的一对电极上。信号通过电极及其间的导电离子溶液所呈现的阻抗，根据欧姆定律，与液体的离子浓度成正比。通过样品的交替极性信号随后被整流，并作为条图记录仪读取的`DC`电压信号读出，该信号与溶液的电导率成正比。\n\
  \n图 7-6 描述了一个源自 1997 年 5 月《化学教育杂志》上发表的电路（本章后面将更详细地讨论）。\n\n![../images/503604_1_En_7_Chapter/503604_1_En_7_Fig6_HTML.jpg](img/503604_1_En_7_Fig6_HTML.jpg)\n\
  \n**图 7-6** 用于电解电导率测量的电路\n\n在图 7-6 中，放大器`A1`和`A2`配置为一个振荡器。`A3`放大通过测量池的信号，`A4`对信号进行整流，输出电阻电容网络是一个低通滤波器。下一节将讨论所使用的`IC`。\n\
  \n图 7-6 中的电路是在原型面包板上组装并测试的，然后硬连线到印刷电路板上，再组装到金属底座上，形成一台电导率测量仪器（参见前言和图`RE-1`，即塑料包裹的电路测试原型板`PC-102`）。组装好的仪器如图\
  \ 7-7 所示。\n\n图 7-6 所示的电路被设置为输出以伏特为单位的信号，以便用数字万用表进行可视化显示。校准系数对应普通量程下每伏特`10 mS/cm`，以及`×100`扩展量程下每伏特`100\
  \ μS/cm`。您可以使用制备好的标准氯化钠溶液来创建校准，以测量电极常数或根据需要验证仪器响应。\n\n![../images/503604_1_En_7_Chapter/503604_1_En_7_Fig7_HTML.jpg](img/503604_1_En_7_Fig7_HTML.jpg)\n\
  \n**图 7-7** 一种电解电导率测量仪器\n\n图上标明了仪器控件的标称功能，仪器由双极性`15 V`电源供电，电源连接到机箱后部可见的三个标有标识的端子上。\n\
  \n双极性电源可由两个电池组配置而成，每个电池组可以由一个`9 V`电池与四个`AA`电池串联，或者一个`12 V`电池与两个`AA`电池串联。双极性电源的组装方法是将第一个`15\
  \ V`电池组的负极输出连接到第二个电池组的正极引线。这个负-正连接点就是公共地。第一个电源的正极引线是`+15 V`电源。第二个电池组的负极引线是`-15 V`电源。请参见第\
  \ 2 章中图 2-3 的电池组配置。\n\n图 7-8 显示了一个示波器显示的施加到其中一个电导率探头极板上的激励信号。\n\n![../images/503604_1_En_7_Chapter/503604_1_En_7_Fig8_HTML.jpg](img/503604_1_En_7_Fig8_HTML.jpg)\n\
  \n**图 7-8** 电解电导率（`EC`）激励信号\n\n一个低成本的导电率探头由不锈钢制成。探头极板尺寸为`10 × 20 mm`（⅜ 英寸 × ¾ 英寸），是从一个旧不锈钢软管夹的½\
  \ 英寸（`12 mm`）宽的带束上切割下来的。通过将铜线银焊到极板的背面来制作电极的电气连接。极板的前表面使用湿碳化硅砂纸打磨至镜面光洁度，起始粒度为`400`目，并使用更细的粒度直到获得所需光泽。探头元件安装时，极板的前表面平行，间距为`1\
  \ cm`，探头所有其他外露表面和接线均涂有环氧树脂涂层（参见图 7-14 中的顶部探头）。\n\n尽管针对各种用途（例如监测自然环境中的天然水、记录水培室内园艺系统中营养液的离子强度等）已经发表了众多电解电导率探头的设计，但本书仅测试了易于组装的双电极探头。\n\
  \n\n## 离子标准溶液的配制\n\n为了能进行有用的离子电导率测量，同时避免使用昂贵且易碎的实验室玻璃量具，本文介绍了一种制备已知量溶解离子标准品的步骤。常见的食用盐是一种易于获取、成本低廉的粉状结晶标准品，可在大多数杂货店或食品供应商处购得。如果将干燥且自由流动的粉末持续添加到蒸馏水中，直至无法再溶解，并且容器底部有明显的盐晶体残留未溶解，那么就能制备出成分明确的溶液。按照上述方法制备的饱和盐或氯化钠溶液，其在给定温度下的精确成分，如表\
  \ 7-2 所规定。\n\n**表 7-2** 饱和氯化钠溶液成分的温度依赖性\n\n| 华氏温度 °F | 摄氏温度 °C | 密度 克/毫升 | 重量百分比\
  \ % |\n| --- | --- | --- | --- |\n| 50 | 10 | 1.204 | 26.35 |\n| 59 | 15 | 1.204\
  \ | 26.40 |\n| 68 | 20 | 1.200 | 26.43 |\n| 77 | 25 | 1.198 | 26.48 |\n| 86 | 30\
  \ | 1.196 | 26.56 |\n\n一旦制备出已知且固定浓度的氯化钠溶液，就可以通过按比例稀释来制备各种较低浓度的氯化钠溶液。将一份体积的饱和溶液与九份体积的蒸馏水混合，即可得到浓度为原浓缩饱和储备液十分之一的溶液。通过先按一比一的比例稀释饱和储备液，然后再将一比一的稀释液再次按一比一的比例进行稀释，就可以生成一系列基于二进制的已知浓度溶液。可以实施一种二进制稀释方案，并根据需要重复多次，以产生所需的较低浓度。\n\
  \n采用以下建议，可以在重复稀释方案中获得更好的准确性和可重复性。\n\n- 选择一个体积足够大的量具容器，以产生足够的最终稀释液，使其能够覆盖用于测定的电导池电极，并允许进行任何所需的进一步稀释。可以使用大约\
  \ 1 盎司或 30 毫升体积的塑料药瓶或调味品容器（如图 7-12 和 7-13 所示）。\n- 在二进制稀释方案中，使用相同的体积容器来量取初始浓缩液和单倍体积的蒸馏水稀释剂；在比例稀释方案中，则用于量取多倍体积的蒸馏水。通过使用与量取待稀释浓缩液相同的容器来量取稀释水，添加到最终体积溶液中的蒸馏水会将任何未转移到最终体积容器中的浓缩液残留痕迹冲洗干净。\n\
  - 为尽量减少“交叉污染”，在分配完最后一部分稀释水后，务必用蒸馏水清洗体积容器，并在量取下一份所需体积的浓缩液之前，将体积量具容器干燥。\n\n表 7-3 列出了不同浓度氯化钠溶液的比电导率。\n\
  \n**表 7-3** 氯化钠溶液的电导率\n\n| 百万分之一 (ppm) | 微西门子/厘米 (μS/cm) 或 微姆欧/厘米 (μmho/cm) | 百万分之一/百分比\
  \ (ppm/%) | 毫西门子/厘米 (mS/cm) 或 毫姆欧/厘米 (mmho/cm) |\n| --- | --- | --- | --- |\n| 1\
  \ | 2.2 | 5000 | 8.2 |\n| 3 | 6.5 | 1% | 16.0 |\n| 10 | 21.4 | 2% | 30.2 |\n| 30\
  \ | 64 | 5% | 70.1 |\n| 100 | 210 | 10% | 126 |\n| 300 | 617 | 20% | 204 |\n| 1000\
  \ | 1990 | 24% | 222 |\n| 3000 | 5690 |   |   |\n\n为避免在使用除铂电极以外的任何电导池探头进行测量时产生误差，应在每次测量单个标准品和样品之间清洗并干燥电极。\n\
  \n在测量一系列不同浓度标准品时的第二个有用技巧是：从最稀的浓度开始，逐步测量到最浓的浓度。这样可以最大限度地减少任何意外交叉污染的影响。\n\n## 电解电导率测量：555\
  \ 定时器\n\n多种应用利用 555 定时器集成电路的 RC 时间常数来监测一个物理参数，使得构成定时调节器的电路中的电阻或电容值发生变化。图 7-9 所示的电路可以产生图\
  \ 7-10 中的经典双极性激励信号，用于测量电解电导率。\n\n![../images/503604_1_En_7_Chapter/503604_1_En_7_Fig10_HTML.jpg](img/503604_1_En_7_Fig10_HTML.jpg)\n\
  \n**图 7-10** 来自 555 定时器的电导率测量激励信号\n\n![../images/503604_1_En_7_Chapter/503604_1_En_7_Fig9_HTML.jpg](img/503604_1_En_7_Fig9_HTML.jpg)\n\
  \n**图 7-9** 用于电解电导率测量的 555 定时器电路\n\n该简单电路元件数量少，易于在原型开发板上搭建。该电路属于交流双极性激励型测量，其输出的电导率数据包含在定时器振荡的频率中。该频率可以通过配置了频率读取库的\
  \ Arduino 或示波器进行测量或读取。\n\n该基于定时器的电路与之前描述的不锈钢探头配合良好。它可用于简单的对比研究，以确定电路在测量一系列已知浓度食盐溶液电导率时的性能。\n\
  \n## 电解电导率测量：微控制器\n\n已经有大量的提案和报告发表，介绍如何使用 Arduino 微控制器或类似设备来测量电解电导率。图 7-11 展示了与一个易于制作的探头（描述于\
  \ Emily Gertz 和 Patrick Di Justo 所著的《Environmental Monitoring with Arduino》一书，O'Reilly\
  \ Maker Press，2012 年出版）配合使用的电路。读取电解电导率的代码可在 GitHub 上下载（[`https://github.com/ejgertz/EMWA/tree/master/chapter-5`](https://github.com/ejgertz/EMWA/tree/master/chapter-5)）。\n\
  \n![../images/503604_1_En_7_Chapter/503604_1_En_7_Fig11_HTML.jpg](img/503604_1_En_7_Fig11_HTML.jpg)\n\
  \n**图 7-11** 使用 Arduino 测量电解电导率\n\n许多基于 Arduino 的系统在电极极化后，使用微控制器的 ADC 来读取电解池极板上的电压。本书的代码和图\
  \ 7-11 中的电路可与前面描述的不锈钢探头配合使用。通过测量一系列食盐溶液的电导率，可以在对比研究中评估该电路的性能。\n\n\n\n## 观察结果\n\n\
