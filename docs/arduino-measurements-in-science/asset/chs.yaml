- '# 使用反向偏置 LED 进行选择性色彩光感应


  为了独立测量由排列成阵列的不同颜色反向偏置二极管（见图 4-49）所感应到的光，可以组装一个遮光外壳来封装光源和传感器。图 4-45 中的光源和检测电路可以封装在一个由易得组件制成的遮光箱内，如图
  4-48 所示。


  图 4-48 中描绘的组件由易得且易于加工的材料制成，例如 1/4 英寸（6 毫米）胶合板和纤维鼓食品容器，所有这些都涂有哑光黑色丙烯酸涂料以减少内部光线反射。


  组件 1 是装置的基板，如果在实验过程中移动组装单元，它为 Arduino 微处理器提供支撑。组件 2 和 3 是垫片，为微处理器提供足够的空间，并与小矩形块一起，很大程度上阻止了杂散光渗入微处理器腔室。组件
  4 是微处理器隔间的顶板，也是圆柱形曝光室的底板。


  组件 4 和组件 5 的左半部分都有一个 1/8 英寸（3 毫米）宽、1½英寸（40 毫米）长的槽，用于容纳微处理器排针与二极管阵列之间的电气连接。组件 1、4、2、5
  和 7 由 1/4 英寸（6 毫米）胶合板切割而成。标为组件 3 的一对组件由 3/8 英寸（9 毫米）胶合板切割而成，以便为 Arduino 排针阵列提供足够的间隙。构成曝光室底座的所有木质组件均为
  4½英寸（11.5 厘米）见方。


