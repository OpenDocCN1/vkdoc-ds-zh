- '# 实验 C：电容自动量程测量


  #### 引言


  有几种技术可以使用 Arduino 微控制器作为电容计。早期的技术是通过一个精确已知的外部充电电阻对器件进行充电，然后确定电容充电达到 5 V 充电电压的 66%所需的时间，以计算`C`的值。后期版本的测量技术使用已知电容值来校准
  Arduino 板的内部上拉电阻和内部寄生电容。当使用内部寄生电阻/电容值时，无需任何外部元件即可对较小的电容器件进行相当准确的电容测量。为本书修改的原始代码的更新版本位于`https://wordpress.codewrite.co.uk/pic/2014/01/21/cap-meter-with-arduino-uno/`和`https://wordpress.codewrite.co.uk/pic/2014/01/25/capacitance-meter-mk-ii/`。



  好的，作为高级文档工程师和翻译员，我将严格按照您的要求和示例格式，将给定的英文文本翻译成中文，并保留所有 Markdown 格式。


  ---



  ### Arduino Uno 的软件代码


  清单 1-2 是根据 mk-ii 版本发布的原始程序修改而成，以便在我的 Windows 7 系统上运行。


  每个 Arduino Uno 板都不同，其内部杂散电容和实际“上拉”电阻都会有细微差异，因此需要进行设备校准才能达到合理的精度。系统校准需要使用已知精确值的电容器来评估杂散电容和内部“上拉”电阻值。图
  1-13 展示了电容器充电电路的代表性电路原理图。描述被测器件 (DUT) 电压的数学公式，以及对杂散电气效应的合理假设，可以在前面提到的网页中找到。


  ![../images/503604_1_En_1_Chapter/503604_1_En_1_Fig13_HTML.jpg](img/503604_1_En_1_Fig13_HTML.jpg)


  **图 1-13** Arduino 内部组件电容测量电路


  应使用已知电容值的低漏电介质器件（如聚酯薄膜、聚酯或聚苯乙烯电容器）来校准系统。当用于连续、自动量程电容测量的程序代码在 Arduino 上成功运行，并且将低漏电测试电容器插入
  `A0` 和 `A2` 后，串行监视器上显示电容值时，就可以开始校准实验了。


  清单 1-2 允许对杂散电容和杂散电阻进行调整。我成功地使用了杂散电阻调整，发现 35.9 到 37.0 之间的值可以使大多数实验设置达到合理的精度。您可以先使用清单
  1-2 中的默认值开始校准过程，然后少量增加或减少该值，观察这个变化对已知标准值测量结果的影响。我只调整了三到四次，就使系统达到了合理的精度。


  系统应在尽可能接近实际操作的预期点范围内进行校准。


  如果只有电解电容器可用于在您所需的操作范围内进行校准，请务必小心。


  ### 观测结果


  对一组不同标称值的电容器进行测量，结果汇总于表 1-3。


  **表 1-3** 电容测量误差


  | 电容值 | 测量值 |

  | --- | --- |

  | 10 pF | 10.5 pF |

  | 1 nF | 0.69 nF |

  | 1 μF | 0.989 μF |

  | 22 μF | 25.6 μF / 2-3 秒 |

  | 470 μF | 475.4 μF / 3 秒 |


  22 μF 和 470 μF 器件的数据在串行监视器上显示缓慢，这可能是由于电压达到测量三分之二点所需的充电时间较长。


  ## 讨论


  从 pF 到 F 的电容测量涵盖十二个数量级的动态范围。在实验工作中，跨越这个范围内 12 个数量级的测量，可能最好使用几种不同的技术来测量，这些技术更适合于较窄的关注范围。


  pF 到 nF 的范围非常适合 Arduino 的自动量程程序，因为在这个范围内，电容器充电时间可以在“一秒以内”的时限内实现。高于 1 μF 的电容值在测量过程中表现出更长的充电时间，可能通过更大的充电电流以及根据数据图形记录进行的计算来获得更精确的确定。


  诸如用于电路板中的电容器件，大致可分为固态和液态电解电介质器件两类。钽、铝和碳是主要的液态电化学电荷存储器件。来自 USB 总线或 LabJack 类型设备的可用电流不足以在合理时间内对大型电容器件充电。然而，随着电容值的增加，可以施加在电介质上的电压会降低。考虑到可以施加在其离子层上的电压有限，以及电解电介质系统可提供的大存储容量，您必须对所用电源的电压水平、用于控制充电电流的电阻器的功耗，以及器件的漏电流或电阻保持谨慎。


  ### 电容测量的校准


  如果在 555 定时器的定时网络中使用精密电阻，则测得的电容值可以预期与振荡器系统数学模型预测的值成比例或相当接近。如果没有精密元件，则可能需要使用已知电容值对系统进行校准，以建立一定的精度水平。


  测得的电容值可以以多种形式显示。可以直接从 Arduino 串行输出监视器读取数值视觉显示和相应的测量单位，以确定器件或组件的电容。然而，对于任何需要通过串行总线传输的数字信号处理或图形显示记录，测量软件的输出格式必须符合串行协议。


  ## 使用树莓派进行电容测量


  只有使用 `PIGPIO` 库及其 C 语言接口守护进程，才能通过 RPi GPIO 阵列实现精确计时。实现更精确电容测量的另一种方法是将计时职责转移到微控制器的晶振时钟上，该微控制器充当
  RPi 的“智能传感器”。在 Arduino 上运行的自动量程电容测量程序是一个健壮且完善的工具，可以将数据流式传输到 RPi 上的 Python 实现以进行显示。


  到达 Python 串行端口的 Arduino 格式化电容数据，需要转换为数值格式，以便在 Python 控制台显示数值或在监视器屏幕上进行图形显示。


  本练习代码清单中的清单 1-3 包含用于读取连接到 Arduino ADC 的 `A0` 和 `A2` 输入端之间的电容器值的 Python 代码。


  ## 实验


  为了使用 Arduino 板连续测量电容，将电容测量程序（参见清单 1-2）加载到 IDE 的微控制器上，并将用于从串行端口接收数据的 Python 程序（参见清单
  1-3）加载到 RPi 中。


  然后，将待测电容器安装到 Arduino ADC 的 `A0` 和 `A2` 输入接口。流式传输到串行端口的值在 Arduino 串行端口监视器上进行验证。在
  RPi 上启动 Python 程序之前，需要关闭端口监视器。


  ### 观测结果


  在图 1-14 和 1-15 中，来自串口读取程序的字符串、字符串长度和电容数值输出被流式传输到 Python 交互终端或控制台上，以便在终止 (`Ctrl+C`)
  前进行记录，这会触发系统以红色输出。


