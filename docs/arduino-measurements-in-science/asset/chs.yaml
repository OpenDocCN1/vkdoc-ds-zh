  \ 47 Ω 和 470 Ω 或 56 Ω 和 560 Ω 的标准规格，但必须根据所选用的 `555` 定时器类型来测试总电阻低于 1 千欧的情况。\n\n![../images/503604_1_En_1_Chapter/503604_1_En_1_Fig3_HTML.jpg](img/503604_1_En_1_Fig3_HTML.jpg)\n\
  \n**图 1-3**  \n来自 Intersil 数据手册的图 14\n\n图 1-3 中的曲线图形成了一个有点直观的概念：充电速度很快的小电容与高频振荡相关联。充电缓慢的大电容与大阻值限流电阻相关联，对应较低的振荡频率。\n\
