  \ == HIGH)\n{\nif(digitalRead(switchPin) == LOW)\n{\nbreak;  // 退出循环\n}\n}\nwhile(digitalRead(switchPin)\
  \ == LOW)\n{\nif(digitalRead(switchPin) == HIGH)\n{\nbreak;  // 退出循环以停止计时\n}\n}\n\
