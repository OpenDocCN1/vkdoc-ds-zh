  ### 硬件


  典型的 K 型热电偶器件可能会产生 `41 μV/°C` 的信号，而 J 型则产生 `55 μV/°C`。测量如此微小的信号需要一种不会从传感器汲取任何可观电流的“仪表放大器”器件。专用的高阻抗仪表放大器可在专用集成电路中获取，例如用于
  J 型和 K 型热电偶的 Analog Devices 594 和 595 芯片。


  由温度因素以及制造热电偶所用不同合金的化学性质引起的焊接问题，通过使用机械连接将传感器连接到电子器件来规避。将 Omega Engineering 公司生产的商用带插座公头的铬镍-铝镍硅
  K 型热电偶插入一个 K 型母插座中，该母插座配有一对双绞线，用于接入原型面包板。原型板承载了双列直插式封装（DIP）的 `AD595`、来自 LabJack
  的 `5 V` 电源以及 LED 连续性指示器，同时方便连接到 `U3-HV` 接口。


