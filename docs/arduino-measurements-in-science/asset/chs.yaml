  ### 硬件


  图 2-3 中的每个电路均采用了适当配置的高输入阻抗运算放大器。电压跟随器用于测量电压，跨阻放大器用于测量电流。电路应组装在电路板上，安装于金属外壳内，并遵循制造商关于“空气绝缘”输入电路的建议¹。在这两种情况下，静电计的读数均由`LabJack
