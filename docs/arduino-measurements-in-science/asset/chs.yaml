  ## 讨论


  热量可以简单分为两种形式：*显热*和*潜热*。显热是指当向某物质添加或移除能量时，导致该物质温度发生变化的能量。潜热则是为改变物质物理状态而必须向该物质添加或从中移除的能量，且不表现为温度变化。水的比热容为`4.186
  J/g °C`（80 cal/g °C），但在 0°C 时，其熔化潜热为`334 kJ/Kg`（80 cal/g）。在 100°C 时，其汽化潜热为`2260
  kJ/Kg`（540 cal/g）。我们利用潜热现象，通过测量热敏电阻浸入水/冰混合物时的电阻来校准它们。如果液体浴槽中存在冰块，温度将保持在 0°C，直到所有冰块融化，此时任何流入浴槽的热量都会导致系统温度升高（见图
  3-49）。在另一种极端情况下，当使用水作为校准流体时，一容器沸腾或冒蒸汽的水，在根据海拔或大气压进行校正后，只要容器内仍有液态水，其温度就会保持在 100°C。


  在水沸点和冰点之间的温度下，向一克水添加一卡路里热能，会使水温升高一摄氏度。比热容是将单位质量的物质升高一摄氏度所需的热能。


  水是比热容的标准参照物，其值为每摄氏度一卡路里。文献中包含了许多关于元素、化合物以及液体和固体形态建筑材料的比热容表格。气体的比热容定义则需要更加谨慎。


  除了比热容，热导率在设计控制热流系统方面也很有价值。测量加热块冷却速率的变化，可以作为衡量泡沫聚苯乙烯隔热效果以及系统封闭性的一项指标。表 3-7 列出了各种材料在室温下的热导率，其中热导率`k`的单位是瓦特每米摄氏度。


