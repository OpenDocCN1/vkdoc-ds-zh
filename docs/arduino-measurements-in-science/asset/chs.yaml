  *图 4-23：用于体积校准的常用工具*


  在利用简单有色固体引入有色材料吸收光的概念后，可以进一步探讨使用灵敏探测器测量溶液中颜色的方法。尽管目前搭建的仪器尚未涉及主动光学（即光的方向被折射），但使用装满水的圆柱形玻璃瓶作为样品池会产生透镜效应，这一效应必须被识别并加以考虑。弯曲的样品瓶必须精确放置在光学平台的中心线上，以确保最大量的折射光均匀地落在探测器上。


  在图 4-24 中，支架上盛放红色溶液的样品瓶已用黑线标记，以确保每次读取吸收/透射读数时，样品瓶都能放置在样品固定块的同一位置。每个样品瓶均装满水后放入仪器中，记录样品瓶每旋转
  45 度位置时的`ADC`值。然后对样品瓶进行标记，以确保在使用时，当指示标记指向与电气馈通相反的一侧时，各样品瓶的`ADC`值尽可能接近。


  德州仪器（Texas Instruments）生产了一款专用于可见光和近红外光强度测量的特定集成电路，芯片型号为`OPT101`（13 美元）。图 4-25 包含了来自制造商数据手册的框图，说明了构成该器件内部电路的组件。光电导模式下的光电二极管（输出电流与入射光强度成正比）与跨阻放大器配合使用，产生与落在二极管窗口上的光强度成正比的输出电压。入射光的光谱响应范围可延伸至约
  400 nm 至 10000 nm，并在近红外区 850 nm 处达到最大灵敏度峰值。


