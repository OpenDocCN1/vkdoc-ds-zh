  \n探测器和各种光源安装在螺丝端子连接器中，这些连接器固定在铝制支架上，支架上钻有孔以套在 #6 机用螺钉上。一个锁定螺母将安装柱固定在底板的所需高度上。第二个螺母旋入安装柱下方，以便光源或探测器能够与其对应组件进行共线性调整。第三个螺母将支架组件锁定到位。\n\
  \n图 4-13 展示了我在避光容器内组装光学实验台所采用的技术。钻出适合 #6 平头（3 毫米）机用螺钉的孔（#35 钻头或 7/64 英寸），并进行沉孔和攻丝，以接纳预设的螺钉，这些螺钉位于平行于中心线的两条线上，间距为\
