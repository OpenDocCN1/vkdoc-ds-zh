  \   self.ax = ax\n        self.dt = dt\n        self.maxt = maxt\n        self.tdata\
  \ = [0]\n        self.ydata = [0]\n        self.line = Line2D(self.tdata, self.ydata)\n\
  \        self.ax.add_line(self.line)\n        self.ax.set_ylim(0, 500)  # y axis\
  \ scale\n        self.ax.set_xlim(0, self.maxt)\n\n    def update(self, y):\n  \
  \      lastt = self.tdata[-1]\n        if lastt > self.tdata[0] + self.maxt: # reset\
  \ the arrays\n            self.tdata = [self.tdata[-1]]\n            self.ydata\
  \ = [self.ydata[-1]]\n            self.ax.set_xlim(self.tdata[0], self.tdata[0]\
  \ + self.maxt)\n            self.ax.figure.canvas.draw()\n        t = self.tdata[-1]\
  \ + self.dt\n        self.tdata.append(t)\n        self.ydata.append(y)\n      \
  \  self.line.set_data(self.tdata, self.ydata)\n        return self.line,\n\nser\
  \ = serial.Serial(\"/dev/ttyACM0\", 9600, timeout=1)\n\ndef rd_data():\n    while\
  \ True:\n        inPutln = ser.readline()\n        if (len(inPutln) < 6):\n    \
  \        continue\n        if (len(inPutln) == 6):               # convert Arduino\
  \ single digit output stream\n            line = float(str(inPutln)[slice(2, 6)])\n\
  \        if (len(inPutln) == 7):               # convert double digit\n        \
  \    line = float(str(inPutln)[slice(2, 7)])\n        if (len(inPutln) == 8):  \
  \             # convert triple digit output\n            line = float(str(inPutln)[slice(2,\
  \ 8)])\n        if (len(inPutln) == 9):\n            line = float(str(inPutln)[slice(2,\
  \ 9)]) # convert 4 digit output\n        print(time.asctime())                 \
  \  # time stamp data\n        print(line)                             # print data\n\
  \        print(\" \")                              # format print out with blank\
  \ line\n        yield (line)\n\nfig = plt.figure()\nfig.suptitle(\"The Scientyst's\
  \ Ayde\", fontsize = 20)\nax = fig.add_subplot(111)\nax.set_xlabel(\"Time Units\"\
  )\nax.set_ylabel(\"K Type Thermocouple Temperature\")\nscope = Scope(ax)\n## uses\
  \ rd_data() as a generator to produce data for the update func, the\n## Arduino\
  \ LDC value is read by the plotting code in 10 minute windows for\n## the animated\
  \ screen display. Software overhead limits response speed\n## of display.\nani =\
  \ animation.FuncAnimation(fig, scope.update, rd_data, interval=50, blit=False)\n\
  plt.show()\n```\n\n*代码清单 3-6 K 型热电偶（< 500°C）的 Python SCR 绘图程序*\n\n```cpp\n/*\nRead\
  \ a K type thermocouple from an AD 594 IC\nPgm reads an analog input on pin 0, converts\
  \ it to voltage and for voltages < 5.00 directly\nconverts the observed voltage\
  \ into a Celsius temperature by x100 factor.\nThermocouple voltages from temperatures\
  \ over 500 C must be scaled down.\n*/\n// the setup routine runs once when you press\
  \ reset:\nvoid setup() {\n  // initialize serial communication at 9600 bits per\
  \ second:\n  Serial.begin(9600);\n}\n\n// the loop routine runs over and over again\
  \ forever:\nvoid loop() {\n  // read the input on analog pin 0:\n  int sensorValue\
  \ = analogRead(A0);\n  // Convert the analog reading (which goes from 0 - 1023)\
  \ to a voltage (0 - 5V):\n  float voltage = sensorValue * (5.0 / 1023.0);\n  float\
  \ TempInDegC = voltage * 100;\n  // print out the temperature\n  delay(500);\n \
  \ Serial.println(TempInDegC);\n}\n```\n\n*代码清单 3-5 K 型热电偶监测的 Arduino 代码*\n\n```python\n\
