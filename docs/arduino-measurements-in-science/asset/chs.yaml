  利用反向偏置`LED`进行波长选择性感光，可用于组装一个廉价的演示装置，展示两项重要的科学概念：一项涉及理论物理学，另一项涉及天文学。感光`LED`可以选择性地监控热物体发出的量子化黑体辐射。来自加热物体的量子化辐射演示，被用作理论物理学中量子力学基本概念的支持证据之一。对恒星物体可见光颜色发射的天文观测，常被用来确定物体的温度。


  颜色通常被描述为与炽热或热黑体在特定温度（以开尔文度表示）下发出的辐射相对应。一种易于获得且能加热到特定温度的黑体，就是白炽灯泡的钨丝。


  一个易于管理、小巧、安全、便于使用的带灯丝灯泡，可以从任何汽车供应商处获得，例如 12 V 车辆尾灯，如 Sylvania/Osram 1156（加元 3 元；最大电压
  12.8，额定功率 26.9 瓦），以及相应的带引线灯座（称为`pig tail`，加元 2.50 元）。这种小灯泡在全功率下通常消耗略低于 2 A 的电流，这通常完全在大多数套件构建的
  30 V 直流稳压电源的能力范围内，并且小灯泡尺寸只需极少的屏蔽即可防止被热玻璃外壳烫伤。


  关于温度与可见光、红外和紫外范围内辐射电磁能量之间关联的研究，已通过白炽钨丝灯泡进行了广泛研究。钨丝的白炽是通过对金属元件施加`DC`或`AC`电能进行电阻加热而产生的。钨丝温度是通过将金属元件的电阻变化与已知的温度变化相关联来测量的。


  为了使用感光`LED`进行实验，用于定性和定量测量的简单仪器系统的构建和组装可分为两个阶段：光源的创建和选定光色的检测。


  ### 实验：光源组装与校准


  为了使用钨丝/电阻温度关系（表示为


  `T = T[0] + (R/R[0] – 1)/α` -- (4)


  ），必须在环境或定义的`T[0]`条件下测量的室温电阻`R[0]`，与根据钨丝收集的电流和电压数据计算出的灯丝电阻`R`值一起使用。`α`是钨的电阻温度系数，报道值为
  0.004403。


  检查用于计算钨丝温度的温度电阻关系，需要测量环境条件下的导线电阻值`R[0]`。通常，低功率 12 V 灯丝的电阻值接近半欧姆，需要仔细测量。


  该技术的低电流适应方法可用于精确测量灯丝的低质量和小分数欧姆电阻（参见[`www.semanticscholar.org/paper/The-Ohmic-Region-of-a-Lightbulb-Grasel-Mudd/38ae1fbdf536b916adbc2965e3ad93eb6c79dbf7?p2df`](http://www.semanticscholar.org/paper/The-Ohmic-Region-of-a-Lightbulb-Grasel-Mudd/38ae1fbdf536b916adbc2965e3ad93eb6c79dbf7%253Fp2df)）。


  为了最大限度地减少螺旋灯丝中低质量材料的热效应和电阻扰动，并充分利用成本合理的仪表，仅测量电路元件上的电压降。


  在图 4-43 中，一个低压电源（3 V）与一个 10 KΩ可变电阻器、一个高精度 1% 1 Ω功率电阻器以及灯泡灯丝串联。两个价格合理的仪表随后测量灯丝和精密电阻器上的电压降，同时调整可变电阻器以逐渐增加电路中的电流。在一个典型实验中，可变电阻器以
  0.1 mV 的增量进行调整，使灯丝两端的电压从 0 增至 5.0 mV，并记录每个增量下精密电阻器两端的毫伏压降。


  ![../images/503604_1_En_4_Chapter/503604_1_En_4_Fig44_HTML.jpg](img/503604_1_En_4_Fig44_HTML.jpg)


  **图 4-44** 由电流-电压曲线得出的灯丝电阻


  ![../images/503604_1_En_4_Chapter/503604_1_En_4_Fig43_HTML.jpg](img/503604_1_En_4_Fig43_HTML.jpg)


  **图 4-43** 低质量钨丝灯泡灯丝电阻测量电路


  图 4-43 和图 4-44 展示了在这些实验中，为 Sylvania 1156 灯泡灯丝供电的电路以及灯丝电阻的图形化测定方法。一台高灵敏度 Siglent
  SDM3055 数字台式仪表使用低欧姆量程测得的灯丝电阻为 0.46 Ω。低功率图形化程序得出的值为 0.4593 Ω。


