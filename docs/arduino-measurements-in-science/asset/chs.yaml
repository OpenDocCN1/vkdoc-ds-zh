  \ RPi 红外温度测量与绘图程序*\n\n\n```c\n// 一款带温差监控功能的热电功率控制器\n//\n// 本程序利用 Arduino 的#3 号 PWM\
  \ 引脚调节供给珀尔帖板的功率。\n// Arduino 控制一个高功率 MOSFET 栅极，以调节流向热传导板的电流。\n// 从串口发送 i 或 d 可增大或减小\
  \ TEC 板的功率。\n// 两个热敏电阻温度传感器分别监测 TEC 板两侧隔热腔内的热泵效应。\n//\nint peltier = 3; // N 沟道\
  \ MOSFET 的栅极连接至 Arduino 的 3 号引脚\nint power = 0;  // 功率等级从 0 变化至 99%\nint peltier_level\
  \ = map(power, 0, 99, 0, 255);  // 功率百分比与 0-255 之间的映射\n//\n////定义热敏电阻的模拟引脚连接\n#define\
  \ THERMISTORPIN A0\n#define THERMISTORPIN1 A1\n// 25 摄氏度时的电阻值\n#define THERMISTORNOMINAL\
  \ 30000\n// 标称电阻对应的温度（通常为 25°C）\n#define TEMPERATURENOMINAL 25\n// 对读数取平均可提高信噪比，改善幅度为采样数的平方根\n\
  #define NUMSAMPLES 5\n// 热敏电阻的 Beta 系数（通常为 3000-4000）\n#define BCOEFFICIENT 3899\n\
  // 分压电路中固定电阻的阻值\n#define SERIESRESISTOR 33000\nint samples[NUMSAMPLES];\nvoid setup(void)\
  \ {\nSerial.begin(9600);\nanalogReference(EXTERNAL);\npinMode(peltier, OUTPUT);\
  \ // 将珀尔帖或 MOSFET 栅极控制引脚设置为输出模式\n}\nvoid loop(void) {\nuint8_t i;\nfloat average;\n\
  float average1;\nchar option;  // 待执行的操作；\"i\"增大功率，\"d\"减小功率输入\n//\nif(Serial.available()\
  \ > 0)\n{\noption = Serial.read();\nif (option == 'i') // 从串口发送'i'可增大负载功率\npower\
  \ += 5;\nelse if(option == 'd') // 从串口发送'd'可减小负载功率\npower -= 5;\n//\nif(power >\
  \ 99) power = 99;\nif(power < 0) power = 0;\n//\npeltier_level = map(power, 0, 99,\
  \ 0, 255);\n}\n//\nSerial.print(\"Power = \");\nSerial.print(power);\nSerial.print(\"\
  \ PLevel = \");\nSerial.println(peltier_level);\n//\nanalogWrite(peltier, peltier_level);\
  \ // 将新的百分比及 0-255 对应的电平值写入端口\n//\n//\n// 采集热敏电阻#1 的数据\n//\n// 连续采集 N 个样本，每次采集间隔短暂延时\n\
  for (i=0; i< NUMSAMPLES; i++) {\nsamples[i] = analogRead(THERMISTORPIN);\ndelay(10);\n\
  }\n// 对所有样本取平均\naverage = 0;\nfor (i=0; i< NUMSAMPLES; i++) {\naverage += samples[i];\n\
  }\naverage /= NUMSAMPLES;\nSerial.print(\"Average analog reading \");\nSerial.println(average);\n\
  // 将数值转换为电阻值\naverage = (1023/average) - 1;\naverage = SERIESRESISTOR / average;\n\
  Serial.print(\"Thermistor resistance \");\nSerial.println(average);\nfloat steinhart;\n\
  steinhart = average / THERMISTORNOMINAL;     // (R/Ro)\nsteinhart = log(steinhart);\
  \                  // ln(R/Ro)\nsteinhart /= BCOEFFICIENT;                   //\
  \ 1/B * ln(R/Ro)\nsteinhart += 1.0 / (TEMPERATURENOMINAL + 273.15); // + (1/To)\n\
  steinhart = 1.0 / steinhart;                 // 取倒数\nsteinhart -= 273.15;      \
  \                   // 转换为摄氏度\nSerial.print(\"Temperature \");\nSerial.print(steinhart);\n\
  Serial.println(\" *C\");\n// 采集热敏电阻#2 的数据\n// 连续采集 N 个样本，每次采集间隔短暂延时\nfor (i=0; i<\
  \ NUMSAMPLES; i++) {\nsamples[i] = analogRead(THERMISTORPIN1);\ndelay(10);\n}\n\
  // 对第二组所有数据取平均\naverage1 = 0;\nfor (i=0; i< NUMSAMPLES; i++) {\naverage1 += samples[i];\n\
  }\naverage1 /= NUMSAMPLES;\nSerial.print(\"Average analog reading #2 \");\nSerial.println(average1);\n\
  // 将数值转换为电阻值\naverage1 = (1023 / average1) - 1;\naverage1 = SERIESRESISTOR / average1;\n\
