  ## 讨论


  为了降低本入门级工作的成本和复杂性，我们对传统的比色分析法实验室方法进行了一些改进，形成了一种没那么严格的半定量分光光度技术。将浓缩溶液通过校准的滴量体积进行分配，用于系列体积稀释或稀释至已知体积，以生成已知体积比稀释浓度颜色梯度。


  标准溶液的制备，首先需要数出所选用的分液器具填充一个已知体积所需的滴数。例如，图 4-23 和图 4-24 所示的塑料聚乙烯一体式移液管，向 10 ml 量筒中滴液至
  9 ml 刻度线处需要 350 滴。该移液管每滴为 0.025 ml。一旦分液装置校准完毕，应加标记以避免错误。从实验室购买的同一批次散装塑料移液管中取出的另一支移液管，其滴液大小为：280
  滴占据 9.6 ml 体积，即每滴为 0.034 ml。


  为配合电子吸光度测量系统的实验工作，我们制备了两个系列的彩色溶液。从工艺品商店获得了金属螺帽和窄颈软木塞密封瓶（见图 4-23 和图 4-24）。它们的内腔体积为
  12 ml。窄颈瓶更易于操作，因为瓶颈收缩处的肩部可作为恒定的填充标记，类似于实验室的容量瓶。（一系列标称体积相同的实验室级容量瓶，其窄颈上的填充标记高度也各不相同。假设这些
  12 ml 瓶子的体积相等是随机误差或系统误差的来源之一。）


  用于确定线性校准存在的浓度范围的溶液，可以通过向六个瓶中依次加入二进制递增滴数的有色浓缩液来制备。图 4-24 中的蓝色溶液代表一个浓度梯度：第一个瓶中加入 1
  滴市售食品染料，第二个瓶中加入 2 滴，第三个瓶中加入 4 滴，依此类推，直至第六个瓶中含有 32 滴染料。染料浓度与通过溶液的蓝光递减值之间的关系图，如图 4-34
  和图 4-35 所示。


  在一个如此大的浓度范围内，光透射的`ADC`值对`V/V`%的简单作图并非线性。绘制透射率倒数的对数（称为*吸光度*）与浓度的关系图可以改善线性。在某些情况下，轻微的平滑曲线也是可以接受的。对于需要线性关系的调查研究，可以使用更小的颜色梯度来进行浓度测量。


  对于稀溶液，比尔-朗伯定律被假定为吸光度、分析物浓度和溶液光程之间的线性关系模型。然而，在许多实验测量系统中，校准曲线并非线性而是略微弯曲的。如果校准结果可重现，那么只要浓度随测量的吸光度没有剧烈变化，测量参数之间相关性的形状或曲率并不重要。


  `LED`不是激光器。其光线虽然有方向性，但却是以锥形向外辐射的。对简单系统的测试表明，在光源与探测器（`OP-505`光电晶体管）之间大约 2 英寸（50mm）的距离处，绿色、蓝色和紫外光产生的功率足以将`Arduino`的`ADC`稳定在约
  900 值，这足以进行一系列吸光度测量。


  尽管`OP-505`光电晶体管的峰值光谱灵敏度（如同大多数`PN`结一样）位于红外区域（如图 4-1 所示），但高亮度输出可见光的 5 mm 直径`LED`所产生的辐射足以利用`Arduino`10
  位`ADC`的大部分范围来进行吸光度测量（见图 4-10）。


  对三种探测器类型的光谱灵敏度曲线进行考察表明，`LDR`在可见光谱的绿色区域最为敏感。基于`PN`结的器件在近红外区域具有最大灵敏度。`OPT101`可以在光谱的蓝色区域工作（见图
  4-38），并且在红色区域也相当灵敏（见图 4-40）。


  `LDR`的光敏面积为 1/4 英寸 × 5/16 英寸（6 mm × 9 mm），`OP-505`的直径为 1/8 英寸（3 mm），而`OPT101`光电导二极管的面积为
  0.090 英寸（2.29 mm）见方。使用`LED`作为光源，凭借其亮度和集中的定向输出，使得实验者可以组装一个仪器，其中各组件应对准成一直线以获得最佳性能。


  图 4-32 和图 4-33 展示了当标称波长处的光密度增加时存在的非线性现象，这会产生固体玻璃纸片效应——与液体溶液中分析物浓度增加时发生的那种偏差效应相同。


  图 4-34 至图 4-37 所示的校准曲线说明了目标有色物质浓度过高的影响。在所有四张图中，红色、绿色和蓝色的灵敏度都足以生成校准曲线，但只有绿色和蓝色两者是线性的。红色系列稀释液浓度过高，因此在透射率或吸光度数据绘图模式中均不呈现线性关系。


  图 4-38 和图 4-39 说明了通过将数据呈现模式从透射率改为吸光度可能获得的线性度改善。


  可以制备这样的溶液：其浓度梯度标准液是通过在连续的瓶中依次加入线性递增数量的滴数来创建的。尝试通过在连续的瓶中依次加入单滴和双滴来制备校准液，未能产生甜菜提取物观测到的`ADC`值的可靠、可重复的下降。当使用三滴增量时，得到了图
  4-40 所示的校准曲线。该校准曲线在浓度低至约 0.025% `V/V`时似乎仍是线性的。该红色植物提取物校准曲线的可用跨度涵盖了 20 至 250 ppm（百万分之一体积比）的浓度范围。


  尽管所组装的系统没有使用任何有源光学元件，但如果使用一个简单的手持放大镜收集通过样品的光（见图 4-31）并将其聚焦在探测器上，灵敏度应该会有显著提高。




  '
- '# 一种使用反向偏置 LED 的六波长光谱仪


  LED 是由 crystalline 硅或锗制成的首批固态信号或整流二极管的进一步发展。金属和绝缘体由那些在形成固体时，其多原子晶体结构会形成部分填充（允许电子移动）或完全填充（禁止导电）的能带的元素制成。某些元素可以混合形成在受控条件下能像金属导体一样行为的材料。


  诸如硼（`B`）、铝（`Al`）和镓（`Ga`）等元素，其最外层只有三个电子。诸如碳（`C`）、硅（`Si`）和锗（`Ge`）等元素则有四个。磷（`P`）、砷（`As`）和锑（`Sb`）则有五个。如果将硅或锗这类材料与少量硼、铝或镓混合并结晶，就会形成
  P 型半导体。P 型材料由一种体基质构成，其中由四个外层电子组成的连续原子结构会零散地被晶体原子只有三个电子的位点打断。在体晶体基质中，一个缺电子的位点可以被视为一个带正电的空穴。


  如果将一种四电子材料与少量外层有五个电子的元素混合并结晶，就会形成 N 型半导体。N 型材料由一种体基质构成，其中原子结构中由四个外层电子组成的连续结构会零散地被晶体原子有五个电子的位点打断。一个具有多余电子的位点可以被视为一个带负电的实体。


  通过将 P 型半导体材料与 N 型材料的晶体熔合在一起，就形成了一个 PN 结。


  ![../images/503604_1_En_4_Chapter/503604_1_En_4_Fig41_HTML.jpg](img/503604_1_En_4_Fig41_HTML.jpg)


  图 4-41


  一个 PN 结


  这两种晶体的熔合导致沿接触界面的空穴和多余电子相结合，从而形成一个没有可移动载流子的区域，称为*耗尽区*。只有当在结的 P 侧施加一个强度足以克服耗尽区能隙（根据制造材料的不同，在
  0.3 V 到 0.7 V 之间）的正电压时，电流才能被迫流过该结。


  作为固态电路的基本构建块，单个 PN 结形成只允许电流单向流动的二极管，仅起整流器的作用。两个 PN 结可以形成诸如 PNP 或 NPN 型晶体管来控制电流。四个
  PN 结串联形成晶闸管或可控硅整流器。反向偏置的 PN 结则形成光电池和光电二极管。


  正常电流流过 PN 结时，空穴和电子载流子越过耗尽区会以红外辐射的形式释放能量。由体半导体材料和微量元素（如镓（`Ga`）、砷（`As`）、磷（`P`）、氮（`N`）、铟（`In`）和铝（`Al`））制成的
  PN 结二极管，可以被制造为在可见光、近红外和紫外光范围内产生辐射。


  LED 在正向偏置时光致发光，在反向偏置时光电导。在光电导模式下，该器件通过的电流与照射到其 PN 结上的光量成正比，前提是光能量小于 PN 结的带隙能量。


  已经开发出一种固态比色计，它利用正向偏置的 LED 作为单色光源用于吸收测量。这些相同的二极管也可以用作光谱检测器，来测量它们自身标称颜色的强度。


  自 1988 年以来，F. W. Mimms 一直使用普通 LED 中的反向偏置 PN 结进行光感测，用于太阳监测。这是目前正在开发的可见光通信（VLS）系统的基础。M.
  Cook 博士于 2008 年提出了一种在 Arduino 上实现 LED 感测用于实验的方法（参见 [`www.thebox.myzen.co.uk/Workshop/Introduction.html`](http://www.thebox.myzen.co.uk/Workshop/Introduction.html)）。


  图 4-42 包含了三个带有标题的简单原理图，以便更好地理解将 Arduino 编程为使用普通 LED 的光传感器的算法和代码。


  ![../images/503604_1_En_4_Chapter/503604_1_En_4_Fig42_HTML.jpg](img/503604_1_En_4_Fig42_HTML.jpg)


  图 4-42


  作为颜色传感器的 LED 偏置


  通过反转 LED 上的偏置，可以使得 PN 结具备电容器的特性和能力，其结电荷由两个半导体材料面之间的绝缘体维持。该结的电容通常在皮法量级（10^(-12) F）。如果一个反向偏置的发光二极管暴露在能量大于
  PN 结带隙的入射光下，则电子被拉入导带，在原位留下空穴。放松结两端的反向偏置电压会导致空穴和电子迁移，从而产生一个与收集到的入射光强度成正比的电流。


  通过让累积的电荷流过已知电阻并测量电流流动的时间，可以测量累积电荷的量。计时计数可以用微控制器来确定，即由 PN 结形成的电容器两端的标称 5 V 偏置电压通过已知电阻衰减回标称
  0 V 或逻辑 0 所需的时间。回想一下，电压随时间变化的积分是电流或电荷的度量（参见第 1 章公式 3）。


  已有几篇发表的报告，其中来自放电二极管的定时电压衰减/电流流动已被归一化为 ADC 计数，作为环境光照的度量，方法是测量放电前后二极管两端的电压。Arduino
  草图列表 4-5 测量单个反向偏置 LED 上累积的电荷。此外，测量的放电时间已被反转，以表示为黑暗程度的度量，从而根据环境光照条件按比例表示二极管的发射情况。


  由于二极管的颜色由其 PN 结带隙的能量差决定，因此可以预期该结对其自身波长的入射光敏感。


  随着电磁辐射波长变短，光子能量增加。原本为较长波长制造的反向偏置 PN 结，应对其自身波长及更短的波长敏感。


  有两种技术使用反向偏置的 LED 作为微处理器的光传感器。这两种技术都将反向偏置的 PN 结暴露于入射光，使其收集电荷，然后通过一个电阻将二极管放电到地，测量电压差或对放电进行计时。实验表明，使用电压差作为入射光的度量适用于单个
  LED，但不适用于监测多个二极管。


  大多数微处理器都有一个 ADC 和六个或更多多路复用测量通道。当在单个 ADC 上使用多个二极管时进行的观察表明，一个通道的变化通常会在其他通道中反映出来。有人提出，多路复用器通道中的残余电荷可能是造成这种效应（通常称为*串扰*）的原因。




  在 Arduino 微处理器的两个数字引脚上串联一个`LED`和一个限流电阻，可以避免使用`ADC`多路复用器，并通过清单 4-4 中的代码独立监控各`LED`。编写一个相对简单的程序，即可测量照射到二极管结上的、波长短于其发光波长的入射光量。由于
  Arduino 拥有 12 个易于访问的数字 I/O 引脚，最多可使用清单 4-4 中的代码，通过测量放电时间来监控多达六种不同波长的`LED`。


  在图 4-10 中，`OP-505`光电晶体管对三种原色的响应各不相同。可以合理预期，制造过程中存在差异，使得同一批次中每个二极管的耗尽区尺寸略有不同，其`PN`结上的电压差也略有不同。除了微小的制造电压差异外，由于制造不同颜色`PN`结使用了不同材料，还会产生更大的数值差异。要在任何定量或定性应用中使用感光`LED`，最好在入射光收集量最小的黑暗环境中开始任何实验测量。


  表 4-3 列出了在反向偏置感光模式下，以放电时间计数作为入射照度指标时，`LED`中测得的响应变化（有色器件标为(clrd)，透明二极管标为(clr)）。


  **表 4-3** 反向偏置`LED`的定时响应变化


