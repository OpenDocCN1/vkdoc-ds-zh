  ## 软件


  根据制造商的数据手册，这些集成电路在出厂时已针对标称 25°C 下的固定增益操作进行了校准，以生成与 ANSI 值相对应的电压。为了记录 `AD595` 的热电偶温度、输出电压、面包板安装及
  USB 供电组合的情况，用于跟踪 `AD595` 输出的通道，其图形输出可以通过向图形显示器的绘图函数添加补偿值来进行调整，以符合 ANSI 标准。对于温度-电压关系的
  J 型和 K 型曲线，其线性度对大多数实验而言已经足够。如果需要更精确的温度数据，建议在感兴趣的温度范围内进行校准。


  在 `DAQFactory` 中创建了一个名为 `thrmoCplU3` 的通道，用于读取 `LabJack U3-HV` 接口上的第一个模拟输入通道。结果以黑色绘制在二维图形显示器上。右轴上以红色绘制的第二张图用于在开发阶段跟踪实际电压值。


  虽然不需要编写脚本，但在 Y 表达式框中，只需将 `AD595` 以伏特为单位的输出电压乘以 100，即可绘制热电偶温度。该通道测量的是 595 的输出电压。当转换为毫伏并除以
  `10mV/°C` 后，得出一个 100 的乘数因子，用于将观测到的放大后热电偶电压转换为摄氏度以便绘图。


