  *   C 是硅胶干燥剂。\n*   D 是装有饱和氯化钠湿度标准的样品盘。\n\n![../images/503604_1_En_7_Chapter/503604_1_En_7_Fig21_HTML.jpg](img/503604_1_En_7_Fig21_HTML.jpg)\n\
  \n图 7-21\n\n带有湿度标准溶液的 ERH 室正视图\n\n图 7-21 的标注如下。\n\n*   A 显示 Lexan 样品口盖上的毡尖笔标记。\n\
  *   B 是样品托盘中盛放的标准盐湿度溶液。\n*   C 是 Lexan 腔室隔离板。\n*   D 是样品口盖的左端。\n\n所有暴露于 ERH 室内部的木材表面都必须涂覆或清漆数层，并在每层之间打磨光滑，以密封多孔表面，最大限度地减少表面水分的吸附/解吸。\n\
  \n## 硅胶干燥剂的制备\n\n将硅胶放入传统烘箱中，在 125 至 150°C（257°F–302°F）的温度下加热，然后让吸附剂在一个密封的 125 毫升（¼\
  \ 品脱）的储存罐中冷却至室温，这样制备出的干燥剂可使 ERH 室的相对湿度值达到约 66%。将烘箱温度升至 175°C（347°F），并在配备干燥柱的储存容器中（见图\
  \ 7-22）将硅胶冷却至室温，可使 ERH 室的相对湿度值达到 35%。进一步实验，将硅胶在 225°C（437°F）下进行更高温度的处理，并在配备干燥柱的容器中冷却，能够在\
  \ 10 到 15 分钟内将 ERH 室的相对湿度降至 26.3%。\n\n![../images/503604_1_En_7_Chapter/503604_1_En_7_Fig22_HTML.jpg](img/503604_1_En_7_Fig22_HTML.jpg)\n\
  \n图 7-22\n\n硅胶干式冷却/储存容器、盐湿度标准及底部干燥剂抽屉\n\n图 7-22 的标注如下。\n\n*   A 是能够承受 225°C 高温的硅胶珠的薄壁管。\n\
  *   B 显示的是新鲜热处理过的硅胶，深度约为 ¾ 英寸到 1 英寸（20 毫米 – 25 毫米）的一层。\n*   C 是储存罐的密封圈，用于将盖子密封在罐上，并迫使冷却空气被吸入充满干燥剂的管子。\n\
  *   D 是罐盖，在干燥管中心有针孔并使用了硅酮密封胶。\n*   E 显示的是饱和氯化钠湿度标准。\n*   F 是从尺寸合适的矩形 PET 硬件泡壳包装中切割出的干燥剂抽屉。\n\
  \n\n\n## 观察结果\n\nOmega Engineering 公司根据大量经过同行评审的饱和盐溶液在不同温度下的 ERH 值发布了相关数据（参见 [`www.omega.com/temperature/z/pdj/z103.pdf`](http://www.omega.com/temperature/z/pdj/z103.pdf)）。饱和氯化钠溶液的数据表明，其在\
  \ 20°C 时的 ERH 值为 75.47，在 25°C 时为 75.29。观察到饱和盐溶液在腔体内产生的相对湿度值分别为 78.8%、79.0%和 78.6%，平均值为\
  \ 78.8%。饱和盐溶液的高 ERH 值表明测量系统存在+3.4%的系统误差。\n\n图 7-23 展示了对麸片早餐麦片进行的水活度重复测量。在每次测量之间，移除了用于将硅胶吸附剂与测量腔室隔开的隔离板，以尽可能降低腔室内的相对湿度值，从而最大程度地减少测量腔室中残留水分对被测样品\
  \ ERH 的影响。（下一节将讨论此类测试中任何可能残留水分的低量级问题。）\n\n![../images/503604_1_En_7_Chapter/503604_1_En_7_Fig23_HTML.jpg](img/503604_1_En_7_Fig23_HTML.jpg)\n\
  \n**图 7-23** 麸片水活度的重复测定\n\n首次水活度测定于 15:57 开始，于 16:07 结束。第二次测定于 16:27 开始，于 14:41\
  \ 结束。记录到的初始 ERH 值为 70.8%，第二次值为 70.0%。\n\n**表 7-7** 食品和药品的 ERH\n\n| -![../images/503604_1_En_7_Chapter/503604_1_En_7_Fige_HTML.jpg](img/503604_1_En_7_Fige_HTML.jpg)\
  \ |\n\n![../images/503604_1_En_7_Chapter/503604_1_En_7_Fig24_HTML.jpg](img/503604_1_En_7_Fig24_HTML.jpg)\n\
  \n**图 7-24** 枫糖浆和花生酱的 ERH\n\n## 讨论\n\n为了使相对湿度传感器正常工作，环境大气中的水分必须扩散到陶瓷传感器的表面。这种测量被称为*扩散控制*。在环境温度和压力下，气体扩散是一个相对缓慢的过程。这是导致传感器每次读数响应时间长达一、两秒的主要原因。因此，需要一秒钟和两秒钟的采样率来确保任何局部大气湿度变化都有时间与金属氧化物泡沫表面上的水分子层达到平衡。出于分析和趋势预测的目的，相对湿度数据最好通过计算机将生成的数据绘制成随时间变化的图形显示来进行跟踪。\n\
  \n相对湿度可以判断在监测环境中，绝缘物体上是否可能积累静电荷。罗切斯特大学电气工程系的 T. B. Jones 教授在以下网站上列出了一系列静电演示实验。列表中的最后一项描述了相对湿度对这些演示实验的影响。琼斯教授指出，在\
  \ 60%–70%的相对湿度下，大多数演示实验可能无法正常工作（参见 [`www2.ece.rochester.edu/~jones/demos/index.html`](http://www2.ece.rochester.edu/%257Ejones/demos/index.html)）。\n\
  \n相对湿度对于天气观测和预报非常重要。环境大气中的雾、薄雾和水蒸气凝结对视觉和运输系统构成危险。\n\n本书中使用的低成本相对湿度传感器适用于室内测量。它们并不坚固耐用，容易“浸水”，需要应用以下恢复程序。\n\
  \n如果传感器接触到液态水并停止工作，必须重新平衡陶瓷泡沫表面以恢复其导电催化活性。塑料结构不能承受任何持续的过热、紫外线照射或长时间暴露在直射阳光下。建议采用制造商或供应商提供的两步恢复程序：首先将检测器在低于\
  \ 10%相对湿度、50°C–60 °C（122°F–140°F）下加热 2 小时，然后在低于 70%相对湿度、20°C–30°C（68°F–86°F）下进行\
  \ 5 小时的热处理。\n\n基于聚四氟乙烯聚合物基底的相对湿度传感器可用于暴露在高湿度、阳光和实际液态水下的远程、野外气象观测站。\n\n## 水活度\n\n\
  尽管电导率型相对湿度传感器在测量环境相对湿度方面很有用，但这些设备一个鲜为人知但重要的用途是在微生物生长、食品保存和食品安全研究中的应用。食品保存依赖于阻止或严格限制微生物活动。微生物通常需要水分才能生长。限制可用于微生物生长的水量可以延长许多食品和药品的储存寿命。美国食品药品监督管理局在\
  \ [`www.fda.gov/ICEC/Inspections/InspectionGuides/InspectionTechnicalGuides/ucm072916.htm`](http://www.fda.gov/ICEC/Inspections/InspectionGuides/InspectionTechnicalGuides/ucm072916.htm)\
  \ 发布了一份在线《食品中的水活度》备忘录。M. Chaplin 教授在 [`www1.Isbu.ac.uk/water/water_activity.html`](http://www1.isbu.ac.uk/water/water_activity.html)\
  \ 讨论了水活度的理论和影响。\n\n美国食品药品监督管理局的文件定义了水活度及其与平衡相对湿度的关系。该文件提请注意这样一个事实：水活度达到或超过 0.95\
  \ 可以支持微生物生长。该文件还指出，将水分含量降低到水活度低于 0.85 的食品无法支持微生物生长，因此不受某些政府法规的约束。\n\n一篇关于将 ERH 腔室技术应用于固体药品^(⁷)的论文讨论了精心设计的\
  \ ERH 腔室所产生的误差值较低。\n\n一种传统的食品保存方法是将待储存的材料包裹在盐或其他吸湿剂（如糖）中。大量存在的盐会吸收微生物生长所需的大部分游离水。水的活度降低到微生物腐败严重受阻或几乎完全停止的程度。\n\
  \n水活度写作 `a[w]`，其标度范围为 1 到 0，其中游离纯水的活度为 1，干燥无水环境的活度为 0。水活度与水性或生物系统中水的分压具有良好的相关性。\n\
  \n从热力学角度考虑，可以证明：\n\n```\na[w] = P/P[o] = ERH(%)/100\n```\n\n`P` 是目标材料上方水的分压。`P[o]`\
  \ 是相同温度下纯水的分压。`ERH` 是以分数形式表示的平衡相对湿度。\n\n为了测量 ERH，实验者必须修改从 Arduino 库中为 DHT 传感器选择的示例数据显示程序，以便只将逗号分隔的相对湿度值和温度流式传输到串行端口。对\
  \ Arduino 串口输出的验证应导致在串口监视器输出窗口的左侧向下输出一串由两个逗号分隔的数字浮点数值。在我的 Windows 系统上，必须先启动 Arduino，验证输出，并在\
  \ DAQFactory 程序启动前关闭串口监视器。如果不遵循初始化顺序，则会抛出“端口正在使用”错误。\n\nDAQFactory 串口监视器验证了对由清单\
  \ 7-1 中的简单脚本解析的相对湿度和温度数据的接收，这些数据被解析到名为 `tempDegC` 和 `relHmdty` 的两个通道中，用于图形显示。\n\n\
  \n\n## DHT11 和 DHT22 非常适合测定环境或露天相对湿度，但 DHT22 更适合监测 ERH（平衡相对湿度）腔体以及被测材料的 ERH。\n\n\
  在图 7-23 和图 7-24 中，底部的时间刻度被放大，以记录一小时或更长时间的数据。小腔体方法和隔离技术基于被测材料减少的水分含量与探测器传感器（金属氧化物泡沫）上薄薄的水分子层之间的平衡。许多高水分活度的食品需要相当长的时间才能释放出足够的水分，使腔体内的水蒸气含量与被测材料中的水量达到平衡状态。人眼很容易在记录的模拟过渡曲线末端看到一条平直的基线。测量至此完成。\n\
  \n## DAQFactory 串口 I/O 数据解析代码\n\n我在名为 `Comm6` 的串口“接收时”事件中使用了以下代码。在 DAQFactory 的标识窗口输入中，它被定义为\
  \ `com 6`。我在通道条目表中设置了两条通道：`relHmdty` 作为通道 0，`tempDegC` 作为通道 1。以下代码解析出相对湿度值，并将条目加载到\
  \ `relHmdty[0]` 中，相应的温度值加载到 `tempDegC[0]` 中。\n\n```\nif (strIn == Chr(13))\nprivate\
  \ string datain = ReadUntil(44)\nChannel.AddValue(strDevice, 0, “Input”, 0, StrToDouble(DataIn))\n\
  Private string datain = ReadUntil(13)\nChannel.AddValue(strDevice, 0, “Input”, 1,\
  \ StrToDouble(DataIn))\nEndif\n```\n\n## 总结\n\n本文讨论了毫欧（mΩ）量级低电阻值的测量技术：对欧姆（Ω）量级常见电阻值的连续测量，以及对吉欧（GΩ\
  \ 或 10⁹）和太欧（TΩ 或 10¹²）量级高电阻值的测量。\n\n本文演示并评估了已有近两百年历史、至今仍被广泛使用的惠斯通电桥和开尔文连接概念与技术，用于进行电阻测量。\n\
  \n电阻是温度的函数。众多元素、金属、材料和合金的电阻温度系数已被测量并公布。\n\n电导率在固体、液体和气体中得到了定义和评估。\n\n本文介绍并评估了两种用于测量液体和气体电导率的具体技术和应用。\n\
  \n本文介绍了一种基于集成电路、高频交流、低电压的仪器，用于测量离子溶液的电导率，其结果可由 SCADA 系统或简单的便携式万用表读取，以供现场使用。\n\n\
  食品中的低水分含量可以通过能够测量大气水蒸气电导率的集成电路进行测量，该测量用于在 ERH 腔体中进行相对湿度（RH）测定。\n\n第 8 章将考察电压的测量，这是欧姆定律中三个变量的最后一个。\n\
  \n脚注 1   2\n\n# 8. 电压\n\n本章讨论了电压差的起源，并介绍了几种用于确定电位差大小的、成本较低且实用的技术。基于高压、低电流的电源将在第\
  \ 11 章中描述。\n\n电压通常被理解为一种势能的度量，它使电子或带电实体在电流流动中运动。它被定义为单位电荷的能量，即 `energy = E/Q`。一伏特等于一焦耳每库仑（`joule/coulomb`）。当电子从材料某个区域的原子或分子中移除并集中到另一个区域时，就会产生电场。分离电子并创造正负电荷区域所需的功，会形成一个储存了势能的电场。电压是对试图中和不平衡电荷的恢复力的度量。作为欧姆定律中的变量之一，电压可以通过测量其在已知电阻上产生的电流大小来量化（`V\
  \ = IR`）。\n\n电压可以由不同的物理化学作用产生，这些作用分离或移动电子，导致电荷不平衡，从而在分离的电荷之间产生电场。以下段落简要概述了一些比较常见的形成电压差的方法。\n\
  \n当能够释放电子的元素被放置在能够接受电子的元素附近时，可以通过导电介质中的化学作用产生电压。自发电子转移反应被用于设计和制造两种形式的电池。一次性电池由不可充电的原电池制成。可充电电池由可充电的二次电池制成。在原电池中，化学反应产生的电能只能存储和释放一次，而在二次电池中，充电循环可以重复多次。电化学现象基于电动序，该序列根据某些元素获得或失去电子时所需或产生的电压对其进行排序。电动序在能量存储与产生、腐蚀科学和分析化学中都有应用。⁽⁸⁾\
  \ 许多生物系统，例如中枢神经系统，都是通过电化学过程及相关现象运行的（见第 11 章）。\n\n通过使磁场相对于导体运动，可以产生电子流。*磁感应* 是电能和机械能可以相互转换的基础。电机和发电机被设计用于优化旋转运动与电能之间的转换，正如目前存在的各种类型电机和发电机所展示的那样。\n\
  \n交流/直流（AC/DC）电机、发电机和交流发电机均可根据服务需求投入使用。利用旋转运动来旋转磁体或线圈，会产生或消耗在每个旋转周期内改变方向的交流电能。\n\
  \n交流电压相对于直流电压有一个明显的优势：交流电压可以通过简单的变压器进行“升压”或“降压”。电力变压器使用缠绕线圈（称为*初级绕组*）中的交流电流来产生一个强度变化的磁场，该磁场在浸没于其中的另一个电气隔离线圈（称为*次级绕组*）中感应出电流。连接到变压器初级和次级绕组的电路中感应出的电压和电流与两个线圈的匝数成正比（见第\
  \ 11 章）。\n\n\n\n电压差可以通过照亮由硅基半导体材料制成的光伏电池中的 PN 结来产生。尽管每个电池产生的电压约为半伏，但可以制造大面积电池，并通过串联和并联配置连接，以从阳光中提供几乎任何所需的电流和电压（参见第\
  \ 11 章）。\n\n压电效应是指当某些极性极强的晶体或分子结构受到压力变形时产生的电压。诸如电气石、石英、黄玉和罗谢尔盐（酒石酸钠钾，`NaKC[4]H[4]O[6].4H[2]O`）等压电晶体都是电活性材料，能够在机械力作用下变形时产生电脉冲，或在受到电刺激时发生机械变形。\n\
  \n聚偏氟乙烯（PVDF）塑料是一种具有极性分子框架的有机高分子材料：`(CH[2]-CF[2])[n]` – CAS 编号 24937-79-9）。弯曲或变形这种块状聚合物材料的物理形状会迫使不同电荷区域移动，并在变形过程中产生可测量的电压差。塑料材料与刚性晶体物质相比具有诸多优势（参见第\
  \ 6 章）。\n\n当不同金属或某些半导体的结点被加热或冷却时，也会产生电压。热电电压和电流很小，但可以被放大，用于测量温度甚至泵送热量（参见第 3 章）。\n\
  \n在真空管中，当加热灯丝中电子的能量足以克服被称为*逸出功*的势垒时，就会发生热电子发射，电子从灯丝中逸出。这些电子只携带几个电子伏特的能量，并形成空间电荷。\n\
  \n真空管作为晶体管和集成电路的前身，其效用只有在施加外部电压时才能实现，这些外部电压远大于空间电荷云形成所产生的微小电压。在真空管中靠近白炽灯丝的导线上施加外部电压，可以控制通过管子的发射电流。基于真空管技术的电子学实际上局限于模拟电路。第一台计算机和运算放大器都是真空管器件，但能耗、尺寸、发热和短使用寿命限制了它们的发展。\n\
  \n前述许多电压源产生的电位差非常小，只能通过高输入阻抗的仪器系统进行测量。待测电位差的值越小，测量系统的输入阻抗就需要越高，以最大限度地减少从被测源汲取的电流（参见第\
  \ 2 章）。\n\n从第 2 章的图 2-3 开始，已经描述了几种用于低电平电子信号的测量技术。在图 2-3 中，电压跟随静电计向电位差产生源提供的输入阻抗为`10\
  \ TΩ (10¹²)`，这几乎不从被测源汲取电流。\n\n许多价格适中（< 150 加元）的数字万用表（DMM）或数字面板表（DPM）具有监测毫伏源的`200\
  \ mV`量程。要测量低毫伏或亚毫伏范围的电压，需要高输入阻抗测量系统，通常超过`10⁸ Ω`。\n\n关于可用运算放大器集成电路及其输入阻抗的简要讨论和表格总结，见第\
  \ 2 章的表 2-1。\n\n本书不考虑高压、大电流的电能。高能电学需要特殊知识、培训和设备才能安全处理，对于本简易实验工作而言过于危险。许多实验研究需要高压、小电流的电能，这些高压源的安全产生和处理将在第\
  \ 11 章中讨论。\n\n大多数模拟和数字科学测量系统工作在 50 V 以下的低电压范围。涉及分子或原子电离的生物化学研究、生物化学分析和化学分析技术都广泛使用小电流、高电压电位。静电电压（具有数百或数千伏的电位差）也包含在本节中，因为它们经常在自然界中出现，在引起测量噪声、点燃可燃气体或粉尘积聚方面至关重要，并且对集成电路具有破坏能力。\n\
  \n\n\n# 静电电荷及其测量\n\n静电电荷自古希腊哲学家时代便为人所知，约 1600 年，威廉·吉尔伯特发明了名为*versorium*的旋转指针，首次对其进行了定性研究。随着金箔验电器或木髓球验电器的发展，人们对静电现象有了半定量的认识。\n\
  \n静电电压测量与以往所有测量技术有两个不同之处：一是需要非接触式传感，二是待测电压的数值要大得多。\n\n静电现象通常由不同材料之间的摩擦力或物理接触产生，传统上通过用丝绸或动物皮毛摩擦玻璃棒或树脂类材料等绝缘体来演示。\n\
  \n摩擦学科学涉及接触表面或相对运动表面之间的相互作用。一种材料排序——即材料相互接触时会自发产生静电电荷，类似于电化学序，但如今被称为“摩擦电序”——自 18\
  \ 世纪中期就已存在。\n\n摩擦电序列出了材料在相互接触时易获得或失去电荷的特性。理解和控制静电电荷对于防火防爆安全至关重要；它是微小型集成电路的严重隐患；必须在测量电信号时加以考虑；并且对许多实际问题（如复印机设计和环境污染控制中有害粉尘的沉降）不可或缺。\n\
  \n多个大型组织必须应对静电现象，包括美国国家航空航天局（手册 8739.12）、静电放电协会和美国静电学会。这三个组织都是静电领域的权威信息来源。\n\n近期对绝缘体和导体中正负静电电荷性质的研究表明，存在多种物理化学机制在起作用。当接触体之间发生电子和实际质量的转移时，就会产生静电电压。研究还表明，电荷在绝缘体中的分布是局域化的，而在导体中则是分布式的。已有研究对摩擦电序进行了量化；AlphaLab\
  \ Inc.的结果可在`https://www.alphalabinc.com/triboelectric-series/`获取。\n\n静电积累本质上是产生局部电场的表面现象。带电实体之间以电弧或火花电流形式发生的静电放电可能导致微电路灾难性损坏，或成为爆炸或火灾的点火源。\n\
  \n传统上，通过定性观察同性电荷相斥和异性电荷相吸的非接触现象来判断是否存在静电场。传统方法包括金箔验电器和木髓球验电器。材料中的未知静电荷会导致金箔张开，或使悬挂的木髓球受到排斥/吸引。将带电材料中的电场靠近验电器即可进行检测。\n\
  \n一些传统的验电器经过改进后，通过测量金箔验电器叶片之间的角度，或悬挂在丝线上的木髓球偏离垂直方向的角度，来提供半定量的场强测量。\n\n对于从事低压数字系统和市电系统研究的实验人员或教学演示者来说，静电现象所涉及的电压值可能会有些误导。在地毯上行走就能产生数千伏的电位差，从而引起静电火花并形成电弧。传统的金箔验电器用于检测用毛发或皮毛摩擦过的玻璃管或玻璃棒上的静电电荷，可产生足够强的电场来激活场效应晶体管的栅极区域。因此，施加在有源\
  \ FET 上的电压可以调节流过器件主通道的电流，从而提供一种不干扰电场即可测量电场电压的方法。\n\n在干燥条件下，人员在室内环境中移动所产生的静电电压可能高达数千伏，如果在电路附近放电，足以破坏大多数集成电路。有意将固态器件暴露于静电场的实验必须在受控条件下进行，以免破坏器件内部的无机薄膜。\n\
  \n除了电场，人们还发现非接触式电能可以通过感应和电容耦合在两个电源或电路之间传输。顾名思义，电容耦合是通过电容器中的绝缘介质传输电能。\n\n在测量电容和电荷时，\n\
  \n```\nC = Q/V 或 C = (I × t)/V 以及 C = k × (A/d)\n```\n\n其中`C`是电容，`Q`是电荷，`V`是电压，`I`是流入电容器的电流，`t`是电流持续的时间，`A`是电容器极板的面积，`d`是极板间的距离，`k`是比例常数。\n\
  \n```\n(kA/Q) × V = d\n```\n\n表明对于一个极板面积和系统电荷恒定的系统，系统电压与带电电容器极板间的距离成正比。\n\n带有静电的物体与探测器（例如金属箔验电器）分离时，会形成一个电容器。在带电电容器中移动极板会引起电容器系统电压的变化，从而使高灵敏度验电器的测量对运动敏感。\n\
  \n早期用高输入阻抗静电计替代验电器的尝试，得益于真空管技术以及随后的固态系统技术的进步而得以实现。静电计的特点是输入阻抗高，能够对与静电相关的电场进行非接触式电压测量。\n\
  \n利用称为*结型场效应晶体管*的固态器件，研究人员使用简单电路即可检测静电产生的电场。通过监测流过与 JFET 探测器主体相连电路的电流，可以以令人印象深刻的灵敏度检测到来自静电的电场。\n\
  \n然而，尽管这种三端器件的漏源电压可高达 100 伏左右，但控制主通道电流的半导体结上的栅极电压通常限制在最大 20 伏。\n\n称为*场强计*的商用非接触式电压测量设备使用旋转的、接地的金属快门（形式为分段的旋转圆盘或圆管），通过使传感电极交替接地和暴露于被测电场，从而产生交流信号。尽管场强计产生的交流电压简化了放大测量信号所需的电子电路，但旋转电极“斩波器”的复杂性大大增加了设备的复杂性和成本。有关场磨装置的制造说明，请访问`www.precisionstrobe.com/jc/fieldmill/fieldmill.html`。\n\
  \n多家静电计制造商已经发表了大量文献，内容涉及静电表面电荷的性质与特征、摩擦电序以及能量收集应用。\n\n\n\n## 排版后的文档\n\n## 平方反比定律\n\
  \n理论研究表明，静电荷产生的引力或斥力的大小或强度遵循平方反比定律，引力、核辐射和光也是如此。平方反比定律的基本理论可以通过将辐射散发想象为从点源扩散的球形壳层来推导。\n\
  \n![../images/503604_1_En_8_Chapter/503604_1_En_8_Fig1_HTML.jpg](img/503604_1_En_8_Fig1_HTML.jpg)\n\
  \n图 8-1\n\n平方反比定律强度\n\n半径为 `r` 的球体表面积由 `4πr²` 给出。如果点源 `S` 处有一个 `Q` 库仑的静电荷，那么距离点源\
  \ `r` 处的辐射电场强度等于总发射场除以膨胀球体的面积。\n\n对于一个位于径向场线球面膨胀中心的 `Q` 库仑点源电荷，在距离 `r` 处的场强为\n\n\
  `E[r] = (Q/ɛ[0])/4π r²` （其中 `ɛ[0]` 是真空介电常数）\n\n如图 8-1 所示，电场按照场线必须穿过的膨胀面积比例向外扩散。由于球面表面积随着与点源电荷距离\
  \ `r` 的平方而增加，电场强度因此被其渗透的不断增加的面积所稀释。\n\n平方反比定律关系中所固有的一个有用的定量属性，可以通过考虑距离点源两个不同距离处的辐射强度来推导，如下所示。\n\
  \n`E[n] / E[f] = (4/3 π (r[n])²) / (4/3 π (r[f])²)`\n\n或\n\n`E[n] / E[f] = (r[n])²\
  \ / (r[f])²`\n\n其中 `E[n]` 是较近的电场强度，`E[f]` 是较远的电场强度，`r` 是两个测量位置到源点的相应距离。\n\n平方反比定律关系的图形表示可以在\
  \ `x`、`y` 坐标轴上以双曲线形式呈现，或者在 `log x` – `log y` 坐标图上以线性形式呈现。当从一个真正的点辐射源收集的理想平方反比函数数据点绘制在双对数坐标轴上时，你会发现这些数据点，尽管因实验误差而随机分散，但会聚集在一条斜率为\
  \ –2 的直线附近。线性度和预期的负斜率的偏差可能由实验效应引起，例如辐射现象的源分布在一个大表面积上，以及由实验假象引起的失真。\n\n要研究遵循平方反比定律的现象，你应该做好准备：随着与被研究辐射源距离的较小增量增加，所研究现象的强度会发生非常迅速的下降。\n\
  \n## 用于静电电压测量的固态器件\n\n自古希腊文明以来已知的静电现象，可以通过将材料分为导体和绝缘体，用现代原子理论进行定性解释。按照简单的方法，导体在其分子结构中具有导带，电子可以在其中流动，而绝缘体则没有。\n\
  \n静电荷可能源于某些材料之间的简单机械接触。机械接触允许表面电子从一个材料表面转移到另一个材料表面，导致一个表面有过剩电子，而另一个表面电子不足。带正电和带负电的表面是电子分布不平衡的结果。\n\
  \n静电荷遵循两条规则。\n\n* 累积的不平衡电荷会产生电场，其强度遵循与距离相关的平方反比定律。\n* 同种电荷相斥，异种电荷相吸。\n\n感应是这两条陈述的推论，即一个带电体可以在靠近原始带电表面的材料中感应出相反极性的电荷。感应会导致灰尘、塑料薄膜和泡沫包装珠粘在一起，并使棉绒和其他小颗粒牢牢地附着在非导电材料表面上。\n\
  \n正如在电容测量中所研究的，两个被绝缘体隔开的表面之间建立的电压或电荷差形成一个电容器。当一个表面的静电荷的电场在进入该电场的任何材料中感应出相反电荷时，该静电荷便形成了一个电容器。在带电物体附近的导体中感应出相反电荷的现象称为*电容耦合*。可以通过在一个或两个导体周围放置接地的金属屏蔽来防止电容耦合。\n\
  \n尽管被称为静电的现象是围绕导体和绝缘体被发现、发展和解释的，但现代晶体管和集成电路使用第三种称为*半导体*的材料来操纵和控制电能流。半导体的制造方式是将高纯度的硅晶体用特定的原子杂质处理，以调节\
  \ N 型半导体材料中的实际电子流。硅晶体也会在制造过程中掺入经过测量的微量原子杂质，以调节缺少平衡电学状态（称为*空穴*）的晶体结构中的流动，这些空穴可被视为\
  \ P 型半导体材料中的“正”电能流。\n\n传统上，验电器利用薄金属箔片和悬挂的木髓球的机械位移来可视化由同种电荷和异种电荷产生的排斥和吸引电场。现代技术已经开发出称为*场效应晶体管*（FET）的电子半导体器件，其功能类似于传统的验电器。自从价格低廉的\
  \ FET 和使用 FET 输入的集成运算放大器商业化以来，多年来已经发表了众多简单和复杂的“电子验电器”设计方案。\n\nFET 因其结构和操作方法而非常适合测量静电场。场效应晶体管是三端压控器件，具有高输入阻抗，并且能够根据施加在其第三端子（称为*栅极*）上的电场，调节其主输入端和输出端（称为*漏极*和*源极*）之间的电流通过。FET\
  \ 类型器件的栅极输入阻抗可达数百 MΩ。如此高的输入阻抗实际上不会从被测源汲取任何电流负载，并且满足测量静电荷积累时不会明显影响或干扰被测源的要求。\n\n\n\
  \n## FET 与 MOSFET 器件及其静电检测应用\n\n## 器件基本原理与特性\n\n`FET`以 N 型和 P 型半导体制造，其栅极对施加电场极性敏感，能够检测和测量两种形式静电积累所产生的电场。\n\
  \n`FET`器件具有极高的输入阻抗且栅极电流几乎为零，这一特性使其广泛应用于大规模集成电路、数字逻辑芯片，以及在电源控制应用中通过低压微处理器控制小电流和大电流。对基本\
  \ `FET` 器件的改进催生了金属氧化物半导体场效应晶体管（`MOSFET`），其栅极输入阻抗显著提高，且沟道能够轻松处理 25 A 至 50 A 范围内的电流。\n\
  \n`FET`和 `MOSFET`器件以不同形式制造，用于信号放大和电源控制应用。不同场效应器件的原理图符号如图 8-2 所示。（`MOSFET` 符号可能具有第四个端子，表示连接到漏极或源极的金属安装片；此外，`MOSFET`\
  \ 也制造有双控制栅极位于源漏沟道上。）\n\n![../images/503604_1_En_8_Chapter/503604_1_En_8_Fig2_HTML.jpg](img/503604_1_En_8_Fig2_HTML.jpg)\n\
  \n**图 8-2** 场效应器件的原理图符号\n\n`MOSFET`器件通过耗尽型或增强型模式来控制流过晶体管主沟道的电流。增强型 N 沟道器件是 `MOSFET`\
  \ 家族中使用最广泛的。P 沟道增强型和耗尽型器件虽有制造，但其应用远不如 N 沟道增强型晶体管常见。\n\n`FET`是电压控制器件，其典型特性与参数如图 8-3\
  \ 所示。\n\n现代场效应晶体管是三端或四端器件，由一根称为*沟道*的 P 型或 N 型半导体材料棒构成，电流可从棒的两端（称为*源极和漏极*）通过。在主沟道或导电棒的垂直方向上，有两个或多个电连接在一起的半导体材料接触区，其极性与主沟道相反，并覆盖着一层金属氧化物绝缘层。两个绝缘接触区上的电触点连接到器件的栅极或第三端子，使得施加的电压能够调节流过晶体管主沟道的电流。\n\
  \n图 8-3 是一个组合图，展示了典型 `FET` 和通用 `MOSFET` 电路符号、结构以及简单场效应晶体管（`FET`）和金属氧化物半导体场效应晶体管（`MOSFET`）器件的电压-电流特性。\n\
  \n较简单的 `FET` 是常通型器件，在没有施加栅极电压时即有电流流过。（P 型器件是 N 型材料与基极结晶体管的电性反向。）`MOSFET` 器件在未施加栅极电压时是常关型器件。（图\
  \ 8-3 中的通用 `MOSFET` 符号在实际电路图中通常呈现为图 8-2 中更具描述性的符号之一。）\n\n![../images/503604_1_En_8_Chapter/503604_1_En_8_Fig3_HTML.jpg](img/503604_1_En_8_Fig3_HTML.jpg)\n\
  \n**图 8-3** 典型的 N 沟道 FET 和 MOSFET 特性\n\n`FET`和 `MOSFET`器件均被设计和制造成放大器或功率控制元件。特别值得关注的是在这些器件的典型电压-电流曲线部分中标注的“欧姆区”。如果保持漏源电压较低，使器件不进入其设计的饱和工作范围，则流过器件的电流大小几乎由栅极与源极之间的电压线性控制。\n\
  \n特别值得关注的是：电压单独控制沟道中的电流、电流被调节的电压范围，以及这些器件的输入阻抗——对于 `FET`，输入阻抗为几百 MΩ，而 `MOSFET` 则显著更高。\n\
  \n## 静电与电场探测器相关报道\n\n场效应晶体管是电压控制器件，输入阻抗可达几百甚至几千 MΩ，应能作为非接触式电场电压传感器。在 `FET` 的高输入阻抗下，几乎没有电流从被监测的静电荷中流出。\n\
  \n互联网上讨论了两个有趣的定性电子验电器报告。第一个由 W. J. Beaty 于 1987 年提出，其电路包含一个 `FET`、一个 `LED` 和一个 9\
  \ V 电池（参见 [`http://amasci.com/emotor/chargdet.html#16`](http://amasci.com/emotor/chargdet.html%252316)）。\n\
  \n第二个由 J. Ahrens 博士于 1999 年报告（参见 [`www2.ece.rochester.edu/~jones/demos/index.html`](http://www2.ece.rochester.edu/%257Ejones/demos/index.html)）。该设备使用\
  \ `CMOS 4011 IC` 来识别电荷极性（参见图 8-7）。\n\n在过去几十年中，互联网上有大量关于检测静电荷或组装“电子验电器”方法的帖子，这些方法使用场效应晶体管和金属氧化物半导体场效应晶体管（`MOSFET`）。描述的大多数电路使用电流表偏转来可视化静电荷的存在，通过监测流过\
  \ `FET` 主导电沟道的电流来实现，通常组装成电池供电的惠斯通电桥配置。\n\n研究“电子验电器”各种电路的研究人员发现存在两种基本类型的器件：单检测器和双检测器实体。单检测器器件很简单：正电荷或负电荷在偏置的\
  \ P 沟道或 N 沟道半导体的单个 `FET` 控制栅极上前后移动电子。\n\n当正确极性的电压施加到栅极电场信号收集器或天线上时，沟道电流会发生变化。如果验电器电路包含两种不同极性的\
  \ `FET` 检测器，则必须在电路中加入某种基于二极管的逻辑来适应电荷的运动。当发出的电场在电荷接近和远离检测器件时同时包围两个栅极天线，两个检测器会在电荷运动的不同时间被激活（参见图\
  \ 8-7）。\n\n大多数电子验电器通过点亮红色或绿色 `LED` 来指示被测电场的极性，仅提供定性信息。以下的技术回顾和初步实验开发工作旨在为更简单的 `FET-MOSFET`\
  \ 定性静电荷检测方案增加至少半定量的能力。\n\n\n\n### 惠斯通电桥电路与正/负电场探测器\n\n自 1987 年 W. J. Beaty 起，对简单、高灵敏度静电探测器或*电子验电器*的定性使用便成为众多报告的主题。2005\
  \ 年，A. Yates 将 FET 晶体管器件融入惠斯通电桥型探测器，延续了该方向的研究。此后，出现了众多使用 N 沟道和 P 沟道器件的电桥变体方案。图 8-4\
  \ 和图 8-5 描绘了通用型电桥式静电场探测器。最初使用电流表描述的电路已被修改，改用跨阻放大器（TIA）运算放大器电路来替代机电式仪表。\n\n图 8-4\
  \ 描绘了一款灵敏电路，它使用了`MFP 102` FET、一个`1 MΩ`栅极保护电阻和一个鳄鱼夹作为场感应天线。图 8-5 中的`MFP 102`、`2N5116`以及图\
  \ 8-6 中的`2N3518`通常可从分销商和邮购公司获得，但有些已视为过时，制造商不再供货。\n\n我复现并验证了图 8-4、8-5 和 8-6 中电路的功能。\n\
  \n![../images/503604_1_En_8_Chapter/503604_1_En_8_Fig5_HTML.jpg](img/503604_1_En_8_Fig5_HTML.jpg)\n\
  \n图 8-5  \nP-FET 电桥型静电探测器的电路原理图\n\n![../images/503604_1_En_8_Chapter/503604_1_En_8_Fig4_HTML.jpg](img/503604_1_En_8_Fig4_HTML.jpg)\n\
  \n图 8-4  \nN-FET 电桥型静电探测器的电路原理图\n\n组装图 8-4 或图 8-5 中的任一电路时都必须小心谨慎。我使用了独立的`+/- 9 V`双极性电源为监测电桥电流的`LF411`运算放大器\
  \ TIA 供电。图 8-5 是负接地电路，而图 8-6 是正接地电路。\n\n![../images/503604_1_En_8_Chapter/503604_1_En_8_Fig6_HTML.jpg](img/503604_1_En_8_Fig6_HTML.jpg)\n\
  \n图 8-6  \n一个 555 定时器静电电荷探测器\n\n图 8-6 所示的电路将`2N3819`用作定时器 RC 网络中的可变电阻。该 IC 器件通过串联电阻对`R1\
  \ + R2`对定时电容充电。当电容电荷达到`V[cc]`的三分之二时，定时器循环工作并通过`R2`放电。FET 晶体管的数据手册指出，该器件在栅极电压为`-7\
  \ V`时沟道电阻为`100`欧姆，在`-1 V`时电阻为`400 Ω`。系统的振荡频率可通过以下公式计算。\n\n`t[1] = 0.693 × (R1 +\
  \ R2) × C` 且 `t[2] = 0.693 × R2 × C`\n\n`T = t[1] + t[2] = 0.693 × (R1+R2) × C`\n\
  \n`f = 1/T = 1.44/((R1 + R2) × C)`\n\n采用`10 kΩ`定时电阻、`47 μf`电容以及电阻变化范围为`100`至`400\
  \ Ω`的`2N3819` FET，当 FET 电阻变化处于中点时，计算出的无稳态 555 配置芯片的频率为`3.2 Hz`。\n\n据报道，人眼的平均闪烁融合阈值（FFT）为`15\
  \ Hz`。`15Hz`的 FFT 表明，大多数人会将以高于`15 Hz`频率开关的一对 LED 灯视为持续点亮状态。\n\n为了量化 555 定时器的振荡速率，并尝试将\
  \ FET 电阻与器件栅极所采样的电场强度关联起来，可以使用`LabJack U3-HV`的频率测量功能和`DAQFactory` SCADA 软件。（也可以使用配置了频率库的\
  \ Arduino 作为频率计来实现）。\n\n为了研究所报告的各种电桥型静电监测器中静电荷产生的探测器响应，我们对各种 N 型和 P 型静电探测器电桥电路中使用的电流表进行了调查。已报道的电流表显示范围从`10\
  \ μA`到`1 mA`。\n\n选择了一个能够在三个量程内显示`10 × 10–6`至`1 × 10–3 A`电流的跨阻放大器（TIA）来记录各种探测器响应。该\
  \ TIA 围绕一个`LM411` FET 输入运算放大器配置，使用`10 kΩ`、`100 kΩ`和`1 MΩ`反馈电阻，为`1 μA`、`500 μA`和`1\
  \ mA`的电流输入范围提供`0 至+/- 10 V`的输出（见图 8-8 和第 2 章）。该 TIA 用于驱动一个能够显示`+/- 10 V`的`LabJack\
  \ U3 HV`，以便在`DAQFactory`带状图记录仪上显示记录。\n\n在尝试记录电桥电路输出之前，先组装了图 8-7 所示的静电荷极性检测电路。\n\n\
  ![../images/503604_1_En_8_Chapter/503604_1_En_8_Fig7_HTML.jpg](img/503604_1_En_8_Fig7_HTML.jpg)\n\
  \n图 8-7  \n静电荷极性检测电路\n\n图 8-7 展示了一个基于 J. Ahern 博士原始设计的固态极性探测器，该设计在 Jones 教授的网站上有所讨论（[`www2.ece.rochester.edu/~jones/demos/index.html`](http://www2.ece.rochester.edu/%257Ejones/demos/index.html)）。该网站提供了一张表格，解释了根据正电荷或负电荷朝向或远离探测器天线（`CD4011`，售价\
  \ 0.81 加元）的运动，各 LED 如何点亮。\n\n使用电流表读数电路和手持静电源（如玻璃和塑料物体）可能会相当令人困惑，因为当带电物体移动时，指针会来回摆动。记录系统则能对所演示、测量或追踪的静电现象提供更易于理解的显示。一个低成本的小型手持式正、负静电场探测器的制作方法可在[`www.techandgeek.com/electrostatic-polarity-detector/`](http://www.techandgeek.com/electrostatic-polarity-detector/)找到。该设备使用一个小型塑料瓶，一块`9\
  \ V`电池为`FQP27P06`（售价 2.02 加元）和一个`HPF730`（IFR840，售价 1.69 加元）TO-220 封装格式的 MOSFET 器件对供电，以点亮一个彩色\
  \ LED，从而判断正静电场或负静电场的存在。\n\n\n\n### 累积静电荷的定量测量\n\n为了探索开发一种定量评估管道、小物体及各种材料上累积静电荷大小的方法的可能性（这些材料传统上用于演示静电现象），我们组装了一套图形记录系统来记录观察到的现象。\n\
  \n![../images/503604_1_En_8_Chapter/503604_1_En_8_Fig9_HTML.jpg](img/503604_1_En_8_Fig9_HTML.jpg)\n\
  \n图 8-9：P-FET 电桥式静电检测器电路原理图\n\n![../images/503604_1_En_8_Chapter/503604_1_En_8_Fig8_HTML.jpg](img/503604_1_En_8_Fig8_HTML.jpg)\n\
  \n图 8-8：N-FET TIA 电桥式静电检测器电路原理图\n\n在前述的几幅图中，没有描述电场探头或天线，因为这些部件的最佳确定方式是通过实验开发。探头或天线的大小决定了系统的灵敏度。如果天线太大，会拾取来自建筑物布线中的\
  \ 60 Hz 噪声；如果太小，系统则无法检测到感兴趣的电场。使用玻璃或塑料管道以及合适的毛皮/织物布料进行定性静电荷实验，可以测试并调整所用 FET 检测器的天线尺寸以及桥式电路中的循环电流大小。\n\
  \n图 8-8 原理图中的许多电阻值并未指定，而是由实验和所选 FET 的类型决定。FET 或 MOSFET 中的大多数栅极连接对静电放电敏感。根据发生足以损坏\
  \ FET 传感器的强静电放电的可能性，可以选择在栅极的输入电路上添加一个 MΩ 级别的保护性串联电阻。\n\n当使用 P 型或 N 型 FET 桥式电路时，实验者必须谨慎解读由简单定量实验产生的偏转轨迹。正如\
  \ J. Ahern 博士所述，将通过羊毛或毛皮在玻璃棒或玻璃管上摩擦产生的移动静电荷带入连接到器件栅极的探头可检测范围内，所生成的响应与电荷量和运动方向一致。\n\
  \n桥式电路中因过度灵敏以及运动引起的灵敏度问题，促使我们尝试并实现了一种更简单、更稳健的 MOSFET 场检测器，如图 8-10 所示。\n\n![../images/503604_1_En_8_Chapter/503604_1_En_8_Fig10_HTML.jpg](img/503604_1_En_8_Fig10_HTML.jpg)\n\
  \n图 8-10：N 沟道 MOSFET 电场监视器\n\n我通过反复试验的方法，凭经验开发出了图 8-10 中所示的电场监视器电路。图 8-11 中的数据是在确定了栅极/源极电压与\
  \ 9 V 电池及一个 100 kΩ 电位器（用于改变施加到栅极的电压）之间的关系之后收集的，随后使用与 6 V 漏极-源极电源串联的电流表测量各栅极-源极电压水平下的沟道电流。\n\
  \n![../images/503604_1_En_8_Chapter/503604_1_En_8_Fig11_HTML.jpg](img/503604_1_En_8_Fig11_HTML.jpg)\n\
  \n图 8-11：N 沟道 MOSFET 栅极电压与漏极-源极电流的关系\n\n使用 2N7000 N 沟道 MOSFET 收集了另一组数据，并得到了如图 8-12\
  \ 所示的 S 形曲线。在图 8-11 和 8-12 中，2N7000 在控制 60 mA 电流时表现出近一伏的电压差，而 RFP50N06 控制 250 mA\
  \ 电流所需电压不到半伏。\n\n![../images/503604_1_En_8_Chapter/503604_1_En_8_Fig12_HTML.jpg](img/503604_1_En_8_Fig12_HTML.jpg)\n\
  \n图 8-12：2N7000 (N 沟道) 栅极电压与漏极电流的关系\n\n图 8-11 和 8-12 显示，随着栅极电压的变化，漏极-源极电流的校准确立了栅极电压与流过被测器件\
  \ (DUT) 主体的电流之间的定量关系。如果栅极连接到天线，并测量 FET 器件的电流，那么就提供了一种测量天线所处电场的方法。如果测量了天线与产生电场的静电荷之间的距离，那么就可以通过平方反比定律确定静电荷的大小。\n\
  \n通过监测使用图 8-10 中电路的 LED 限流电阻两端的电压降，可以记录玻璃管或 CPVC 管上电荷状态的图形显示。在开发使用标称内径为 3/4 英寸或\
  \ 2 cm 的钠钙玻璃管和 CPVC（氯化聚氯乙烯）塑料管进行可重复的正负静电荷产生方法的初期，记录到了一条典型的静电荷衰减曲线，如图 8-13 所示。\n\n\
  图 8-13 中的 `DAQFactory` 显示器设置为记录一个 `220 Ω` 电阻两端的电压降，该电阻用作一个 5 mm 红色 LED（在 `RFP50N06`\
  \ MOSFET 电场监视电路中用作视觉监视器）的限流电阻。电阻两端的电压降通过一个可监测 0 到 10 V 信号的 `LabJack U3-HV` 接口来监测。（`DAQFactory`\
  \ 中名为 `staticVoltage` 的通道设置为记录 LED 限流电阻上 0 到 5 V 的电压降）。使用了 6 V 的漏极-源极电源，栅极则连接到一根\
  \ 3 英尺长、22 号线规（`900 × 0.64 mm`）的绝缘铜线上，该铜线被折叠成一个 6 英寸（`150 mm`）宽的扁平平行阵列。显示的曲线描绘了通过用羊毛布摩擦玻璃管产生的静电荷随时间放电的过程。充电后的管道平行放置于天线旁。在记录放电显示之前，调整天线与管道之间的距离，以使\
  \ LED 达到中等亮度。\n\n![../images/503604_1_En_8_Chapter/503604_1_En_8_Fig13_HTML.jpg](img/503604_1_En_8_Fig13_HTML.jpg)\n\
  \n图 8-13：玻璃管上静电荷的衰减\n\n开发实验最初局限于玻璃管和 N 型 MOSFET，因为基于 N 型半导体的监视器的灵敏度，或者钠钙玻璃上累积的电荷强度，远高于\
  \ P 型监视器和 CPVC 塑料管所表现出的水平。\n\n在简单的定性 LED 亮度装置上增加了一个距离测量功能，以开始开发定量测量系统。\n\n在使用玻璃管和定性视觉亮度\
  \ LED 显示器的初期实验中，我发现如果玻璃管没有被均匀摩擦，摩擦会导致局部表面电荷。一只手握着管子，在羊毛衫上摩擦，只会使管子接触到的区域带电。如果使带电的管子靠近天线并绕其纵轴旋转，当带电表面物理上正对天线时，LED\
  \ 的亮度达到最大。\n\n应采取相应措施来提高可重复性，并最小化表面电荷局部化的影响。\n\n-   天线和管状电荷载体的外表面必须相互平行，且载体的带电区域应面向天线。\n\
  -   充电完成后，应立即将管子安装到一个固定距离的定位桩上。\n\n在初步实验过程中，我发现每个电路都可以使用一个 FET 栅极传感器（具有可变电流范围、跨阻电流-电压转换放大器）来组装和测试，以记录来自静电荷的电场。使用\
  \ `LabJack U3 HV` 和 `DAQFactory` 软件组合，将迹线记录为 0 到 10 V 的信号，从而创建一个条带图记录器，显示由电荷感生电场产生的电压。\n\
  \n过去几十年来，几乎所有已发表的用于组装“电子验电器”的电路都过于灵敏，无法用于测量摩擦引起的静电荷累积。高灵敏度导致电容耦合及其他耦合效应主导了测量。带电体靠近和远离感应天线的运动引起了满量程和虚假的偏转，这些偏转既不可重复又难以解释。（参见静电演示网站上的图\
  \ 8-7 电路及二极管发光解读）。\n\n经过大量实验，我最终通过使用基于图 8-10 所示配置的更简单电路，在一定程度上控制并解释了 FET 栅极对累积静电荷、电荷运动以及天线参数的极端灵敏性。\n\
  \n\n\n\n## 实验\n\n### 场效应管与金属氧化物半导体场效应管静电场传感器\n\n理论上，任何连接到场效应管栅极的导线，只要因电场存在而感应出几伏电压，就应能在流经沟道的电流中产生可测量的变化。图\
  \ 8-3 中的电流-电压曲线通常由制造商提供，供设计人员在使用场效应管和金属氧化物半导体场效应管器件作为电流控制元件时参考。\n\n曲线中被称为*欧姆区*的小段区域，是器件在特定栅极电压下运行的有效区间。它通过测量流经器件沟道的电流来量化。\n\
  \n能产生可预测沟道电流的栅极电压范围很窄。要使用 N 沟道或 P 沟道场效应管或金属氧化物半导体场效应管器件的线性区或欧姆区，必须控制距离变量。记录电路输出结果，以直观显示场源距离探测器是过近还是过远，以至于无法在探测器栅极上感应出“量程内”或可用的信号，这将对控制距离变量大有裨益。\n\
  \n### 金属氧化物半导体场效应管校准\n\n我之所以选择金属氧化物半导体场效应管，是因为它们坚固耐用、作为功率控制器件货源充足、成本低廉、载流能力强（60\
  \ A），并且用作静电场探测器时校准简单。图 8-14 和图 8-15 展示了在栅极引线上施加电压的情况下，校准单个器件主沟道电流的电路配置。\n\n必须收集每个递增栅极电压值下的数值数据，并将其与沟道电流绘成图表，如图\
  \ 8-16 和图 8-17 所示。然后，根据数据的直线近似关系计算数值关系，从而根据测得的沟道电流为栅极或天线电压确定一个合理的值。\n\n虽然图 8-14\
  \ 仅展示了校准 N 型金属氧化物半导体场效应管的电路，但图 8-15 包含了从校准配置转换为测量配置的电路。测量电路用连接了天线的栅极替换了校准配置中的电位器、电压表和电流表。常开（NO）按钮开关在每次测量操作后将“悬浮”的栅极接地，因为栅极几乎没有任何方式来耗散测量期间器件中可能积累的任何电荷。\n\
  \n![../images/503604_1_En_8_Chapter/503604_1_En_8_Fig15_HTML.jpg](img/503604_1_En_8_Fig15_HTML.jpg)\n\
  \n图 8-15\nP 沟道金属氧化物半导体场效应管校准电路\n\n![../images/503604_1_En_8_Chapter/503604_1_En_8_Fig14_HTML.jpg](img/503604_1_En_8_Fig14_HTML.jpg)\n\
  \n图 8-14\nN 沟道金属氧化物半导体场效应管校准电路\n\n完成金属氧化物半导体场效应管的校准并将其电路转换为更简单的测量配置后，可通过连接`LabJack\
  \ U3–HV`设备来配置 DAQFactory 图形显示界面，以测量`100 Ω`负载电阻两端的电压降。（回忆一下，LabJack 是一种主要用于测量电压信号的实验室接口。）\n\
  \n公式 1 和公式 2 由 Excel 电子表格程序中的统计包生成，用于绘制数据。考虑到 N 沟道器件测量正栅极电压电场，因为流经沟道的电流受施加在栅极上的正电压值调节，所以为电压-电流相关性收集的所有数值数据均为正数。当为\
  \ P 沟道器件收集数据时，沟道中的电流受施加在栅极上的负电压调节。对于统计数据处理算法而言，数值的正负号等效，因为符号代表的是一种物理差异，而非数学差异。\n\
  \n正栅极电压 N 沟道器件的栅极电压（`x`值）与源漏电流关系（`y`值）如下所示：\n```\nY = 8.6212x – 20.174 --- (1) R²\
  \ = 0.9965\n```\n\n负栅极电压 P 沟道器件的栅极电压与源漏电流关系如下所示：\n```\nY = 7.6448x – 22.389 ---\
  \ (2) R² = 0.9871\n```\n\n如图 8-14 和图 8-15 中的电路图所示，当电路重新布线用于电场测量时，天线上的感应电场决定了流经`100\
  \ Ω`负载电阻的电流。根据欧姆定律，流过负载电阻的电流会产生`100 × I[ds]`的电压降，但`I[ds]`与栅极电压的关系由公式 1 和公式 2 决定。\n\
  \n根据观测到的负载电阻两端的电压降值（`V[lr]`），N 沟道 MOSFET 的正栅极电压（`V[g]`）由以下公式给出：\n```\nV[g] = ((V[lr]\
  \ * 10) – 20.174)/8.6212 --- (3)\n```\n\n\n\nP MOSFET 的类似公式将产生负栅极电压。\n\n![../images/503604_1_En_8_Chapter/503604_1_En_8_Fig17_HTML.jpg](img/503604_1_En_8_Fig17_HTML.jpg)\n\
  \n图 8-17  \nIRF9053 P 沟道 MOSFET 的栅极电压与漏源电流的关系\n\n![../images/503604_1_En_8_Chapter/503604_1_En_8_Fig16_HTML.jpg](img/503604_1_En_8_Fig16_HTML.jpg)\n\
  \n图 8-16  \nRFP50N06 MOSFET 的栅极电压与源漏电流的关系\n\n曲线左侧的数据表是由三组重复的栅极电压变化实验合成的。在实验误差范围内，曲线是可重复的。\n\
  \n用于开发测量技术的两个高功率 MOSFET 器件均采用大型 TO-220 封装，拥有能够处理大电流的大尺寸半导体晶片。这些器件设计用于与强大的开启信号配合使用，例如通过微处理器控制的脉宽调制技术产生的信号。制造商的\
  \ datasheet 表明，栅极可承受高达 20 V 的信号强度，并且通常需要至少 2 至 4 V 才能开启。图 8-16 和 8-17 中的数据表明，在标称\
  \ 12 V 的漏源电压下，需要 2.52 V 和 –2.89 V 的信号才能启动任何沟道电流。\n\n检测器电路可以搭建在原型板上或如 8-18 图所示的接线端子排上，用于由电池供电并使用小型笔记本电脑进行图形显示的便携式设备。\n\
  \n![../images/503604_1_En_8_Chapter/503604_1_En_8_Fig18_HTML.jpg](img/503604_1_En_8_Fig18_HTML.jpg)\n\
  \n图 8-18  \n安装在接线端子排上的正电场静态检测器\n\n8-14 和 8-15 图中的电路紧凑整洁，并且接线端子为所有连接提供了可靠的接触。负电荷检测器采用相同的机械结构组装，但遵循了图\
  \ 8-15 中的电路。\n\n使用简单的设备生成可重复的静电场是一项艰巨的任务。检查 Alpha Labs 发布的当前摩擦电序列表明，聚氨酯泡沫与动物毛皮类材料（如羊毛）摩擦时会带上正电荷。特氟龙和氯化聚氯乙烯\
  \ (CPVC) 则带有负电荷（见 [`www.alphalabinc.com/triboelectric-series/`](http://www.alphalabinc.com/triboelectric-series/)）。操作正静电场的最佳材料之一是聚氨酯泡沫保温材料。\n\
  \n通过将一层薄薄的粘合剂或绝缘聚氨酯泡沫涂抹在合适的木质表面上，可以创建一个便捷的带正电表面。适用于产生正静电的聚氨酯粘合剂和绝缘泡沫基于甲苯二异氰酸酯配方，出于安全考虑，必须遵循标签说明。图\
  \ 8-19 和 8-20 展示了一系列经典的静电演示设备，这些设备采用易得材料和常见车间工具制作而成。\n\n![../images/503604_1_En_8_Chapter/503604_1_En_8_Fig19_HTML.jpg](img/503604_1_En_8_Fig19_HTML.jpg)\n\
  \n图 8-19  \n经典静电演示设备\n\n图 8-19 中的物品 1 是组装好的金属箔验电器，它由一条 ½ 英寸 × 3 英寸（12 × 75 毫米）的镀铝聚酯薄膜箔（救生毯）条，用螺栓固定在一条\
  \ ![../images/503604_1_En_8_Chapter/503604_1_En_8_Figa_HTML.gif](img/503604_1_En_8_Figa_HTML.gif)\
  \ 英寸 × 3½ 英寸（15 × 80 毫米）的弯曲铝条上，并且聚酯薄膜的金属化侧朝向铝支架。验电器顶部有一个 3 英寸（75 毫米）的铝盘。它通过一根 ![../images/503604_1_En_8_Chapter/503604_1_En_8_Figb_HTML.gif](img/503604_1_En_8_Figb_HTML.gif)\
  \ 英寸（3 毫米）直径的黄铜螺纹杆固定，该杆穿过两个胶合板圆盘，如图 8-20 所示。上方的圆盘切割得比容纳悬挂箔片的玻璃罐的内径稍大一些。下方的圆盘则切割成能容纳在玻璃容器内部。\n\
  \n物品 5 和 6 是 ¾ 英寸（18 毫米）的钠钙玻璃管和 CPVC 管，用于产生正电荷和负电荷，而物品 4 是一个 ![../images/503604_1_En_8_Chapter/503604_1_En_8_Figc_HTML.gif](img/503604_1_En_8_Figc_HTML.gif)\
  \ 英寸（15 毫米）的木质销钉，涂有一层聚氨酯泡沫以产生正电荷。在图 8-20 中，销钉上钻有孔以插入一个 ![../images/503604_1_En_8_Chapter/503604_1_En_8_Figd_HTML.gif](img/503604_1_En_8_Figd_HTML.gif)\
  \ 英寸（3 毫米）的销钉，如图 8-19 所示。该销钉允许泡沫支架插入距离定位板上的钻孔中。\n\n![../images/503604_1_En_8_Chapter/503604_1_En_8_Fig20_HTML.jpg](img/503604_1_En_8_Fig20_HTML.jpg)\n\
  \n图 8-20  \n经典静电演示设备\n\n图 8-19 和 8-20 中自制的装置验证了固态电场检测器的功能。在图 8-20 中，验电器的顶部组件被翻过来以展示其结构。\n\
  \n物品 2 和 3 组成了一个*起电盘*，演示了感应现象并产生确定极性的静电荷。在图 8-19 中，该装置底座的内部由一层棕褐色、光滑、已固化的聚氨酯泡沫薄层组成。泡沫层涂在木质底板上，如图\
  \ 8-20 中所示的底层。泡沫层的中心部分被 ¼ 英寸（6 毫米）胶合板的边缘环绕，以将铝盘支撑在泡沫上方一个微小但固定的距离处。\n\n就位后，如图 8-20\
  \ 所示，泡沫上的正电荷会在金属盘中感应出极化，当金属盘接地时，就会在铝盘上产生负电荷。在设备制造中，木材用作绝缘体；整个组件由四个 ¼ 英寸（6 毫米）直径的木销固定在一起。\n\
  \n胶合板圆盘的对齐和定位导向件被临时移除以给起电盘充电。泡沫可以用羊毛或其他动物皮毛摩擦，从而在聚氨酯泡沫上产生正电荷。重新装上对齐导向件后，可以通过感应方式反复给铝盘充负电。\n\
  \n\n\n### 高灵敏度电场测量\n\n图 8-4、8-5 和 8-6 中的电路均经过搭建、测试，并采用运算放大器跨阻或反馈电流表进行改装，以评估其在电场定量测量中的适用性。由于存在噪声、不可预测的响应以及难以操控的灵敏度，促使我们采用一种更简单的电路，并辅以模拟/数字信号记录功能，试图阐释在桥式放大器和频率变化电路中观察到的、基于仪表且令人困惑的瞬态响应。\n\
  \n一个`Arduino`微控制器负责监测一个简单电路的输出，如图 8-21 所示。\n\n![../images/503604_1_En_8_Chapter/503604_1_En_8_Fig21_HTML.jpg](img/503604_1_En_8_Fig21_HTML.jpg)\n\
  \n**图 8-21**  \n用于高灵敏度电场测试的电路\n\n图 8-21 中的电路还与一个 P 沟道 FET `2N5460`配合使用，以测试该探测器用于检测负电荷及其相关电场的适用性。（对于\
  \ P 型 FET，电流方向是相反的。）\n\n`Arduino`测试电路产生范围为 0 到 1023 的`ADC`值的串行端口数据输出，这些数据从微控制器流式传输到主机\
  \ Windows 计算机。流式传输的串行端口数据由`DAQFactory`绘图程序的`comm 4`端口接收，用于在 0 到 1025 满屏偏转（FSD）显示上以图形方式展示正负静电探测器的响应。\n\
  \n## 观察结果\n\n对于正负电荷 FET/MOSFET 检测电路，建议使用常开（NO）按钮式接地开关，因为在进行任何测量之前，必须中和“浮置”栅极系统上累积的或意外感应的电荷。绝缘的金属氧化物栅极及其电气触点构成一个电容器，在每次电场测量之前，该电容器应有一条通往大地的路径，以将器件输入恢复到中性状态。\n\
  \n与先前实验中使用的坚固、大尺寸晶粒的简单`MOSFET`器件不同，更小、更灵敏的`FET`器件可与`Arduino`配合用于测量实验。较小的 FET 器件的高栅极灵敏度似乎并未受到其较低输入阻抗的影响，这些阻抗虽然相对较高，但不如较大的`MOSFET`器件那么高。\n\
  \n在开发一种可重复的正负静电荷产生方法的初期，使用了标称内径为¾英寸或 2 厘米的钠钙玻璃和氯化聚氯乙烯（CPVC）管材，记录下了典型的静电荷衰减曲线，如图\
  \ 8-22 和 8-23 所示。（图 8-22 在图 8-13 中再现，以便进行视觉比较。）\n\n显示的曲线描绘了用羊毛布摩擦玻璃管在其上产生的静电荷随时间放电的过程。带电的管子平行于天线放置。调整天线与管子之间的距离，以使记录迹线达到近乎满屏偏转。\n\
  \n在实验过程中，如果玻璃管未被均匀摩擦，接触会导致局部表面电荷。一只手握住管子，在羊毛衫上摩擦，只会使管子的接触区域带电。如果在天线附近绕其纵轴旋转带电管子，记录仪迹线会随着管子带电面相对于天线的位置变化而上下波动。\n\
  \n![../images/503604_1_En_8_Chapter/503604_1_En_8_Fig23_HTML.jpg](img/503604_1_En_8_Fig23_HTML.jpg)\n\
  \n**图 8-23**  \n聚氨酯泡沫沉积物上静电荷的衰减\n\n![../images/503604_1_En_8_Chapter/503604_1_En_8_Fig22_HTML.jpg](img/503604_1_En_8_Fig22_HTML.jpg)\n\
  \n**图 8-22**  \n(13) 玻璃管上静电荷的衰减\n\n通过使用距离控制来调节`MOSFET`器件感应到的静电场电压，并在固定的漏源电压差下测量通过主通道的电流，可以将观察到的电流与给定的栅极电压暴露相关联。通过测量距离静电荷已知距离处的电场值，可以应用平方反比定律计算出静电荷值。\n\
  \n为了提高电场检测方法的灵敏度，基于`Arduino`微控制器组装了一个简单电路（见图 8-21），最初使用一根 18 英寸（456 毫米）的绝缘 22 号（0.64\
  \ 毫米）铜线作为天线，末端露出半英寸（12 毫米）的裸天线，以便于手指触摸接地。请记住，MOSFET/FET 栅极是一个电容器。\n\n在原型板上组装好电路后，加载并启动了`Arduino`程序`electrometer`（见代码清单\
  \ 8-1）。图 8-21 显示，串行端口上由模数转换器（ADC）生成的数据是充当压控电阻器的`FET`两端的电压降。研究发现，手指触摸天线可以清除接近零的波动`ADC`值。`Arduino`串行绘图仪显示了`ADC`输出提供的迹线。通过调节电位器，将满屏偏转（FSD）设置为大约\
  \ 1000 个 ADC 计数。通过将天线缩短至 4½英寸（112 毫米），记录仪迹线达到了串行端口数据在基线和 FSD 或更低值之间快速变化的状态。通过进一步实验发现，如果将带静电的物体保持在天线几英尺（0.5\
  \ 米）之外，可以记录到有噪声但相对稳定的基线。\n\n为了显示电荷状态随时间的变化，数字化后的`Arduino` ADC 输出由`DAQFactory`的串行端口收集以进行显示，如图\
  \ 8-24 所示。\n\n![../images/503604_1_En_8_Chapter/503604_1_En_8_Fig24_HTML.jpg](img/503604_1_En_8_Fig24_HTML.jpg)\n\
  \n**图 8-24**  \n使用高灵敏度`2N3819` FET 探测器时，聚氨酯泡沫沉积物上静电源电荷的衰减\n\n如图 8-24 中记录的显示所示，逐渐减小的`ADC`峰值高度似乎呈指数级电荷衰减，如图\
  \ 8-22 和 8-23 所示。\n\n在明显的电荷衰减中记录的每个峰值，都是通过移动安装在圆棒上的聚氨酯泡沫沉积物产生的，该沉积物如图 8-19 和 8-20\
  \ 中的项目 4 所示。在记录到 10:20 的 FSD 峰值之前约 5 分钟，该泡沫沉积物已用羊毛布充电。从 10:21 开始的峰值是通过将水平放置的泡沫沉积物在距离垂直放置的\
  \ 4½英寸（110 毫米）天线 12 英寸（约 0.3 米）处，快速垂直移动五次而产生的。\n\n除了电子噪声之外，还有来自手臂移动材料的杂散信号干扰、移动距离的变化、手动进行电荷移动的速度变化，然而，由于远处电荷移动而在探测器栅极上感应出的电压具有显著的重复性。\n\
  \n\n## 使用 Arduino 和 Raspberry Pi 记录静电效应\n\n许多静电电荷和电磁波探测器可以与 `Arduino` 和 `RPi` 配合使用，以生成探测器响应的记录。\n\
  \n在使用工作电压为 12 伏或 9 伏的大型 MOSFET 场强指示器和小型 FET 电荷运动探测器测量和记录静电电荷效应时，请确保不要将超过 5 伏的电压施加到\
  \ `ADC` 上。需要进行一定程度的实验开发，才能将静电荷放置在足以在实验开始时为所使用的 10 位或 12 位 `ADC` 维持 `FSD`（满量程）的距离。耦合到探测器栅极的天线长度可能也需要调整，以便为静态测量记录获得可重复的起始条件。\n\
  \n一旦配置好静电压电荷的位置和天线尺寸，就可以收集数据并将其流式传输到串行端口进行绘图。可以使用简短的静电计代码片段（参见清单 8-1）对 `Arduino`\
  \ 进行编程，并将 `ADC` 值打印到串行端口。可以通过运行 Python 编码的 `Matplotlib` 带状图记录器程序（用于图形显示）的 `RPi`，从串行端口收集从微控制器流出的数据记录（参见清单\
  \ 8-2）。\n\n作为记录能力的一个示例，生成图 8-25 中所记录数据的电路，是图 8-4（Yates，2005）所示电路的 TIA 修改版本，使用 `2N3819\
  \ FET` 作为探测器。我通过快速上下移动一根水平握持的玻璃管来产生探测器响应，垂直距离大约等于短导线天线的长度（天线末端带有一个鳄鱼夹，长度为 4 英寸或\
  \ 100 毫米）。玻璃管距离天线 3 英寸（80 毫米），并且在几个小时前已用羊毛布初步充电。\n\n图 8-25 记录了用于调整绘图代码参数以接受流式数据不同数据宽度的控制台输出诊断数据。对于实际实验数据存档，可以保存\
  \ `ADC` 计数和相应的时间戳输出。\n\n![../images/503604_1_En_8_Chapter/503604_1_En_8_Fig25_HTML.jpg](img/503604_1_En_8_Fig25_HTML.jpg)\n\
  \n图 8-25  \n充电玻璃管运动的 RPi 图形记录\n\n## 讨论\n\n自远古希腊的米利都的泰勒斯（约公元前 624–546 年）时代以来，人们就开始研究由不同材料物理接触产生的静电现象。1757\
  \ 年，J. C. Wilcke 首次发表了能够可重复地产生电位静电现象的常见材料列表。由材料接触产生的静电现象被称为*摩擦起电*。用于产生静电荷的常见材料列表被称为*摩擦电序列*。\n\
  \n存在许多摩擦电序列列表。`AlphaLab Inc.` 是一家商业静电测量设备供应商，它发布了一份现代的、经过测试的列表（[`www.alphalabinc.com/triboelectric-series/`](http://www.alphalabinc.com/triboelectric-series/)）。这是一个半定量的数值数据汇编，以电荷亲和力\
  \ `nC/J`（纳库仑转移电荷/焦耳）为单位，可以解释为衡量某材料条目摩擦电效应相对强度的指标。\n\n摩擦电序列的理论基础尚未建立。现代研究方法表明，列表中各种导电和绝缘材料之间的明显带电现象取决于几种原子和分子现象。对聚合物材料中摩擦电效应的高级研究已促成了摩擦电发电机的组装。重复性地机械压缩和分离摩擦电活性材料的动作，例如汽车在路面上行驶、水体中的波浪作用以及人们在地板上行走，可以将机械动作转化为可收集的电能，为传感器供电，并可按比例放大以提供可用的能源。\n\
  \n商用静电电荷测量设备被称为“场强计”。场强计使用旋转的、接地的金属快门（形式为分段旋转圆盘或带槽的同心旋转圆柱体），通过交替地将传感电极暴露于待测电场中来产生交流信号。尽管场强计产生的交流电压简化了用于放大测量信号所需的电子设备，但创造周期性测量暴露的旋转电极或“斩波器”的复杂性却增加了设备的复杂性和成本。\n\
  \n苏塞克斯大学的研究人员开发出了超灵敏的静电场传感器，他们将这种设备命名为电位传感器（EPS），能够测量毫伏/米级的电场。EPS 传感器在医学成像或诊断、安全以及核磁共振波谱学（NMR\
  \ 波谱学）中具有广泛的应用。\n\nNASA 研究人员近期的工作开发出了一种利用静电场和电场发生器作为成像系统的方法。一系列专利申请和会议演讲描述了该系统。^(⁹)\n\
  \n研究人员最近报道了将 `FET` 用作细胞电压传感器，其中受控的漏极-源极电流可测量固定在场效应管栅极上的神经递质分子所产生的电压。^(¹⁰)\n\n对于北方气候地区的大多数居民来说，静电放电通常被视为一种主要发生在冬季的现象。在炎热的夏季，高湿度往往会在静电放电危险形成之前就将其消除。在冬季，当空气寒冷且湿度较低时，静电活动是明显可察觉的（参见\
  \ [`www2.ece.rochester.edu/~jones/demos/`](http://www2.ece.rochester.edu/%257Ejones/demos/)）。\n\
  \n\n\n橡胶底鞋摩擦尼龙地毯是两个绝缘体交换电荷的示例。行走在地毯上时，电子从地毯转移到橡胶鞋底。绝缘鞋底上积累的负电荷会在穿鞋者身体上感应出正电荷，如果此人接近大地，就会产生静电放电。\n\
  \n不同湿度水平下常见动作产生的静电积累情况列于表 8-1。\n\n**表 8-1 不同相对湿度下的常见静电积累**\n\n| 人体动作或行为 | 相对湿度水平\
  \ | | |\n| --- | --- | --- | --- |\n| | **10%** | **40%** | **55%** |\n| 穿越地毯 |\
  \ 35,000 | 15,000 | 7,500 |\n| 穿越乙烯基地板 | 12,000 | 5,000 | 3,000 |\n| 未接地人员的动作 |\
  \ 6,000 | 800 | 400 |\n| 去除气泡包装 | 26,000 | 20,000 | 7,000 |\n\n在春末某天测得的相对湿度为`74%`时，我无法产生或测量到任何静电活动。我不得不将实验推迟到湿度较低（`65%`相对湿度）的干燥天气条件下进行。\n\
  \n静电对集成电路的损害分为三类：灾难性故障、参数性故障和潜伏性故障。灾难性故障会在静电放电瞬间摧毁电路。参数性损坏是指电路在放电后仍能工作，但无法达到原有设计规格；潜伏性故障则发生在电路投入实际使用之后。\n\
  \n集成电路可能被静电放电（`ESD`）损坏，其阈值水平列于表 8-2。\n\n**表 8-2 导致集成电路损坏的静电放电电压**\n\n| 电路或器件类型 |\
  \ 静电放电电压水平 |\n| --- | --- |\n| `MOSFET` | 10 – 100 |\n| `EPROM` | + 100 |\n| `CMOS`\
  \ | 200 – 3000 |\n| `JFET` | 400 – 7000 |\n| `OP-AMP` | 190 – 2000 |\n\n人体对静电放电的感知水平列于表\
  \ 8-3。\n\n**表 8-3 静电放电与人体感官**\n\n| 感觉触到静电放电 | > 3500 伏 |\n| --- | --- |\n| 听到静电放电\
  \ | > 5000 伏 |\n| 看到静电放电 | > 8000 伏 |\n\n可以通过将导体接地、提高湿度以耗散绝缘体上的电荷以及使用空气电离器来防止静电积累。接地金属屏蔽可以保护对静电敏感的设备、区域和传感器。\n\
  \n### 检测与测量静电积累\n\n在使用`FET`和`MOSFET`器件作为静电电荷探测器进行实验时，研究人员必须意识到进行研究的周围环境。北美洲靠近海洋和五大湖的地区湿度较高，使得静电演示几乎不可能进行。高相对湿度会使摩擦产生的测试电荷在几分钟内减弱并消失。在较干燥的内陆地区，静电荷在产生时可能会无意间积累到对电子设备和集成电路有破坏性的水平。\n\
  \n小塑料封装的`TO-92 FET`晶体管（典型重量`2N3819` – 0.198 克）与相对较大的`TO-220 MOSFET`器件（典型重量`RFP05N06`\
  \ – 2.00 克）之间灵敏度的显著差异，导致了采用功率`MOSFET`作为更稳健的静电电荷探测器。除了灵敏度明显更可控外，功率控制器件还能在`20 V`的栅极输入电压范围内管理`10\
  \ A`或更大的电流。而`FET`通常限于同一栅极电压范围内的几分之一安培。\n\n高功率`MOSFET`器件的一个额外特性是“开启电压”为`2 V`到`3 V`，这在某些高电场检测应用中可能是有利的，因为该特性可能会降低对电场和噪声感应的电磁干扰的灵敏度。\n\
  \n我选择用于静电场测量的`N`沟道和`P`沟道器件取自我的功率控制器件库存。一些较小的`FET`器件难以操作，并且在用于收集图 8-16 和 8-17 数据的配置中，未能显示出线性的栅极电压与源极漏极电流关系。\n\
  \n市场上有多种功率`MOSFET`器件制造商。可以测试来自不同制造商的器件在本应用中的适用性。其他研究人员已使用`FQP27P06`和`HPF730`（或`IRF840`）作为合适的探测器。据报道，一种双`MOSFET`阵列（表面贴装技术封装的`FDS8958`）也适用于检测正负两种电场。\n\
  \n有大量已发表的电子验电器原理图，从图 8-4、8-5、8-6 和 8-10 中的简单电路，到图 8-7 中复杂的逻辑门适配电路。许多验电器电路中包含逻辑门和二极管，这似乎旨在消除探测器对带静电物体靠近和远离运动做出响应时引起的许多混淆。\n\
