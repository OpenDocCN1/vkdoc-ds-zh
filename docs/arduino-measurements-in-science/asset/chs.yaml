  \n\n\n```python\n## RPi Python Strip Chart Recorder of Arduino Output\n## SCR Plotting\
  \ of serial data from Arduino output over serial port\n## Arduino serial output\
  \ must be numerical values only.\n#\nimport matplotlib\nimport numpy as np\nfrom\
  \ matplotlib.lines import Line2D\nimport matplotlib.pyplot as plt\nimport matplotlib.animation\
  \ as animation\nimport time\nimport serial\n\nclass Scope:\n    def __init__(self,\
