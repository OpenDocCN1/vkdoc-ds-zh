- '# 比色法光强度测定


  使用图 4-20 和图 4-21 所示的仪器，可以进行一系列基于`LDR`、光电晶体管或`OPT101`单片光电二极管跨阻放大器 IC 探测器的基本比色测量。为验证该技术，可使用浓缩食用色素或由甜菜、蓝莓等高色素食物加工而成的水基制备液，配制一系列红色、绿色和蓝色溶液。


  能够滴出单滴液体的工具，例如一体式塑料滴管、分体式玻璃管橡胶球滴管或眼药水滴瓶，可用于制备一系列已知浓度的体积比有色溶液。一种简便技术是：统计填充已知体积所需的液滴数量，然后通过除法计算出每滴液体的平均体积。价格实惠的玻璃或塑料量筒以及
  3 mL 移液管（巴斯德吸管）可从在线零售商处购得，有各种尺寸和材质可选。图 4-23 展示了一个典型的 10 mL 量筒和一根塑料巴斯德吸管，这些是常用于测量药液的小体积分液工具。


  ![../images/503604_1_En_4_Chapter/503604_1_En_4_Fig24_HTML.jpg](img/503604_1_En_4_Fig24_HTML.jpg)


