- "# 电容测量与监测\n\n本次电容测量/监测练习分为四个部分。其中三个部分使用`DAQFactory`中的图形用户界面，将电容值显示为旋转模拟指针式仪表、数字万用表式数值读数或连续显示条带图记录。\n\
  \n将电容值的测量与显示划分为这些独立的部分，是由于记录和显示系统受限于电容设备宽动态范围而造成的。\n\n第四种电容测量技术使用 Arduino 微控制器及其串口读数，构成一个自动量程电容计，测量范围从微法拉到皮法拉。有两种程序可将该微控制器用作更高分辨率的连续电容测量仪表。\n\
  \n列表 1-2 中主要的连续显示程序几乎无需布线。它利用杂散输入电容校准和 Arduino 微控制器板载的内部\"上拉\"输入电阻，生成被测设备(DUT)一系列相当准确的电容值。\n\
  \n第二种连续读数程序需要一些外部元件和布线，以实现对电容 DUT 的精确连续测量，将在第 10 章中介绍。\n\n第二种程序使用精确测量的时间段和已知电阻值来确定\
  \ DUT 的电容值。通过使用微控制器芯片内部的比较器、基于晶振的定时器以及操作系统中断序列，实现了显著的计时精度，从而获得精确且可重复的时间值。\n\n使用诸如\
  \ Arduino 之类的微控制器来测量 DUT 的电容，其优势在于允许实验者在测量系统中嵌入一些数字信号处理功能（例如移动平均），以提高系统的信噪比。\n\n\
  在线论坛中有大量练习展示了电容现象在组装触摸板方面的常见用途，例如用 Arduino 微控制器激活 LED。\n\n电容器中的电荷通过描述电容与电压关系的基本公式计算得出。非电容性的静电荷在第\
  \ 8 章中讨论。\n\n## 电容器特性\n\n电容器有多种电荷存储容量和介电特性。电容器的特性主要由填充在器件导电板之间的介电材料决定。通常，高电荷存储容量的器件具有较大的漏电流，这使得它们不适用于定时应用。\n\
  \n## 漏电流\n\n理论上，电容器是一种电荷存储器件。其导电板之间具有高极化性绝缘电介质，因此可以存储更多能量，或在给定存储容量下体积更小。然而，充电时，极板间的电压会导致电流流过电介质，最终使电容器放电。电容器的漏电流主要由电介质的化学成分决定。\n\
  \n电解电容器使用金属氧化物绝缘层作为器件的电介质。氧化铝和氧化钽形成具有高介电常数的薄膜，但电解器件也表现出更高的漏电流。\n\n漏电流的测量使用基于跨阻放大器(TIA)的电流静电计，如图\
  \ 2-2（第 2 章）所述。TIA 配置也应用于第 7 章图 7-4 所述的漏电流测量。本练习仅检查低压或线电压兼容的电容器，因为高压大电流系统超出了本书的入门性质。\n\
  \n运放 TIA 静电计的高输入阻抗可以测量极低水平的电流。电容器的漏电流可以直接从测量电路的稳定电池激励电压中测得。\n\n在测量已放电电容器中非常小的漏电流时必须小心。只有当器件在电池提供的全测试电压下达到稳态平衡时，才能进行测量。\n\
  \n如第 2 章所述，测量非常小的电流需要特殊技术和仪器。\n\n第 2 章的表 2-4 显示了在不同电容器上测得的典型漏电流。\n\n漏电流有时被认为对电容器的定时应用不利。在定时电路中，漏电流应尽可能小，以确保定时操作的可重复性。使用塑料薄膜作为电介质的电容器，如聚乙烯、聚酯薄膜（聚对苯二甲酸乙二醇酯薄膜）和聚苯乙烯，因其塑料薄膜电介质的高电阻或低导电性而具有极小的漏电流。然而，大多数塑料薄膜无法存储显著的电荷。这种分子结构的非极化特性限制了在尺寸合理的器件中可制造的电容值。图\
  \ 1-2 右上角看到的蓝色大块是一个 15 μF 的聚苯乙烯电容器。\n\n用于滤除整流交流电源纹波的电容器，其漏电流比电容器所平滑的电流低数个数量级，且对平滑操作几乎没有影响。\n\
  \n陶瓷电容器是漏电流相对较低的器件，通常以微法分数和纳法数值供应。\n\n## 实验 A：低电容值（< 10 μF）的连续显示\n\n\n\n### 电路：一个基于\
  \ 555 定时器的简易电容计\n\n在大多数应用中，`555` 定时器会生成固定或可变占空比的矩形波输出。通过在非稳态工作模式下，用可变电阻或电位器替换两个固定电阻之一，即可获得可变的占空比。若两个充电电阻的阻值固定为\
  \ 10:1 的比例，则输出信号为近似 50% 占空比的方波，其频率 `f` 仅由电容值决定。\n\n```\nf = 1.44 / (Ra + 2Rb) *\
  \ C -- (5)\n```\n\n`C = 1.44 / (Ra + 2Rb) * f -- (6)`\n\n通过测量频率或一秒钟内产生的方波脉冲数量，即可确定电容值。\n\
  \n由传统双极型晶体管 `555` 定时器集成电路组装而成的非稳态振荡器，其振荡频率仅限于几百千赫或几兆赫的低频范围。采用 CMOS 工艺制造的定时器集成电路可在兆赫兹范围内振荡。三种常见器件的最大输出频率列于表\
  \ 1-1 中。\n\n**表 1-1**  \n555 定时器高频限制\n\n| 制造商 | 器件编号 | 最高振荡频率 |\n| --- | --- | ---\
  \ |\n| Intersil | `IMC7555` | 1 MHz |\n| Texas Instruments | `TLC555` | 2 MHz |\n\
  | TI (National) | `LMC555` | 3 MHz |\n\n图 1-3 与 Intersil 公司 `IMC 7555` 数据手册中的图 1-4\
