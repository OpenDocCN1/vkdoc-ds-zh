  \ 6 是 6 节镍镉电池。（电池组 5 中的每个“电池组”是分开充电的。）\n\n### 光伏板的内阻\n\n为了评估太阳能电池板通常观察到的功率收集变化，并测量负载下的电流-电压关系，我们对图\
