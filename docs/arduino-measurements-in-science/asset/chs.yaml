  \ DAQFactory 序列代码\n\n## 摘要\n\n本文介绍了电容器结构、电荷存储以及伴随恒流或恒压充电的电子流的数学理论。\n\n介绍了使用商业 SCADA\
  \ 软件以及由单板计算平台配合分立 IC 组件或微处理器组装的低成本系统进行静态和动态电容测量的技术。\n\n在第 2 章中探讨并评估了用于测定大电流和小电流的一些方法。\n\
  \n\n\n"
- '# 2. 电流


  电能包含两个动态组成部分：电压和电流。电阻是材料的一种固有属性，以电压形式储存的能量通过这些材料驱动电流移动。


  `电流` 这一术语指的是电荷的流动，通常以电子的形式，但也可能是液体、气体或等离子体中移动的离子。电流的测量单位是`安培`，表示一秒钟内通过电路参考点的电荷库仑数。（1
  库仑电荷相当于 6.24 × 10¹⁸个电子，每个电子携带 1.602 × 10^(−19)库仑的电荷。）


  1820 年，奥斯特发现通过导线的电流会在导体周围产生磁场。研究人员很快开发出可通过测量导体周围磁场引起指南针偏转，来量化导线中电流的仪器。基于磁场偏转的电流测量仪器被称为`检流计`，以纪念路易吉·伽伐尼——他发现电流能使青蛙腿的生物肌肉组织收缩。灵敏的电流测量检流计是通过将未知电流通过线圈发展而来的，这些线圈悬浮在由固定永磁体产生的磁场中。经过多次改进，尤其是达松伐耳和韦斯顿的贡献，最终形成了一种相当坚固的器件，成为从
  19 世纪末到 20 世纪末固态系统发展之前广泛使用的伏欧表（VOM）的核心部件。这种器件具有固定的永磁体，包围着一个悬浮的线圈，线圈安装在螺旋弹簧上，称为`达松伐耳/韦斯顿检流计`，可测量微安级电流。


  电流测量时，将检流计与被测电路串联。待测电流流过一根细线圈，该线圈由螺旋弹簧悬挂在永磁体产生的固定磁场中。悬浮线圈中产生的磁场与永磁体的固定磁场相互作用，使悬浮线圈的偏转角度与流过其中的电流大小成正比。在基于检流计的仪器中，连接在弹簧线圈上的指针在数值刻度上移动，从而提供定量的电流测量值。


  通过使用低阻值的并联“分流电阻器”来承担大部分电流，检流计的动态范围得以扩展，用于更高量程的测量，从而制成称为`电流表`的电流测量器件。理想情况下，电流表不应影响被测电路和电流。但是，连接导线、动圈和分流电阻器都有可测量的电阻，因此仪表需要校准。


  通过电流表的部分电流会在器件中产生电压。该电压称为`负担电压`。对于大电流值，由小的负担电压引起的损耗通常很小，不会影响被测大电流的观测值。而在测量小电流时，负担电压可能会引起显著误差。


  基于动圈检流计的电流测量是模拟 VOM 的基础，它通过欧姆定律，测量经过精密电阻的电流，并利用已知电压源，从而能够测量电阻和电压。现代电流测量仪器是基于电压的固态器件，利用欧姆定律和模数转换器来测量精确已知阻值电阻上的电压降。


  构成材料的物理特性是决定电流测量方式的限制因素。流过小电阻的极大电流会产生热量。而当测量系统中存在微小电阻时，极小的电流实际上会损失在电路中。


  在几乎所有实验中，测量过程应使对被观测现象的干扰最小化。在电流测量方面，测量仪表不应产生任何电压负担。


  微电流测量在是德科技的“低电平测量手册”中有详细讨论，手册地址为：[`www.tek.com/document/handbook/low-level-measurements-handbook`](http://www.tek.com/document/handbook/low-level-measurements-handbook)。该文档阐述了在微（10^(–6)）、纳（10^(–9)）、皮（10^(–12)）或飞（10^(–15)）安培范围内进行电流测量时存在的实际问题。低于微安级的电流测量需要使用静电计和皮安计，本文档对这些商用仪器进行了评述。


  在数码摄影、生理学、电化学反应以及光谱和色谱分析系统中，会遇到微安及更低量级的电流。这些微小的电流——由光子收集型电荷耦合器件、神经组织、溶液中痕量移动离子、火焰离子化检测器中的离子化燃烧产物，或入射到
  PN 结光电二极管上的光所释放的光电子产生——无法为普通的电阻负载供电或“驱动”，以产生可测量的信号。为了量化或测量这些微小的电流，需要特殊的仪器和技术，以最大限度地减少因试图测量这些微小电流而导致的“负载效应”影响。


  运算放大器具有多种电流控制方式，也可用于电流测量应用。


  运算放大器（op-amps）是基于理想的、理论上的直流放大器概念的集成电路。理想运算放大器具有无限大的开环增益、无限大的输入阻抗、零输出阻抗、无限大的带宽，并且当输入端子间无电压时输出电压为零。理想运算放大器有一对差分输入端，称为反相输入端和非反相输入端，它们分别将相应输入端子的电压反相或再现于器件输出端。


  现代运算放大器是[模拟计算机](https://en.wikipedia.org/wiki/Analog_computers)的后继者，这些计算机在许多线性、非线性和频率相关电路中执行数学运算。集成电路，例如
  1965 年推出的通用型`μA709`和 1968 年首次生产、至今仍在生产的`μA741`，都是理想直流放大器的合理近似。


  图 2-1 展示了一种小电流或微电流测量技术，该技术采用高质量的运算放大器，配置为`反馈电流表`或跨阻放大器（TIA）。该电路图将微小电流转换为更大的可测量电压，该电压与反馈电路中的电阻成正比。


  ![../images/503604_1_En_2_Chapter/503604_1_En_2_Fig1_HTML.jpg](img/503604_1_En_2_Fig1_HTML.jpg)


  图 2-1


  跨阻放大器


  运算放大器常被用作模拟计算机。在此例中，可以配置一个高质量的、具有高输入阻抗的集成电路（如`AD 8628`或`LMC6081`），用于测量那些易受测量仪器负载效应导致失真的小电流源。




  理论上的“运算放大器”（op-amp）是直流耦合、高增益的电子电压放大器，其输出由输出到输入的负反馈控制。负反馈是将输出的一部分耦合回来，以抵消部分输入的过程。运算放大器本质上是差分放大器，用于放大其反相输入端（inverting
  input）和非反相输入端（non-inverting input）之间的差值，在三角形放大器示意图上用 `+` 和 `–` 号表示。将输出端的条件部分反馈回反相输入端，可以改变运算放大器电路的特性，具体方式包括降低增益、改变输入和输出阻抗、改变带宽，以及减少制造差异和温度漂移的影响。


  传统上，运算放大器是直流耦合放大器，其输出电压由反相输入端和非反相输入端之间的差值乘以放大器增益决定。在图 2-2 中，非反相输入端通过分压器保持固定电压。


  ![../images/503604_1_En_2_Chapter/503604_1_En_2_Fig2_HTML.jpg](img/503604_1_En_2_Fig2_HTML.jpg)


  **图 2-2** 运算放大器恒流配置


  在用于电流控制的运算放大器恒流配置中，基极-发射极结位于负反馈回路中。它由运算放大器的输出驱动，以在反相输入端维持与非反相输入端相同的电压。非反相输入端的电压由
  `R1` 和 `R2` 创建的分压器定义，改变分压器比率即可调整通过晶体管的电流。


  在跨阻放大器（TIA）配置中，非反相输入端接地。运算放大器输出通过增益电阻反馈到反相输入端。运算放大器要求反相输入端和非反相输入端必须保持相同电位，这使得电流源将非反相输入端视为对地短路。这个看似简单的电路实现了不对被测信号产生干扰。跨阻放大器可能难以实现，并且需要高质量的运算放大器来测量低于微安和纳安级别的低电流值。


  在固态电子学发展之前，基于达松瓦尔/韦斯顿检流计机电运动的安培计是测量低电平电流最常用的仪器。固态电子学和集成电路的发展使得运算放大器芯片成为可能，例如 `LM741`
  和场效应管（FET）高阻抗输入 `LF 411`。两者都采用 TIA 配置来替代安培计作为电流测量设备。在电流-电压转换模式下，运算放大器 TIA 配置通过改变反馈电阻的值来测量毫安及更低范围的电流。


  使用运算放大器 IC 芯片测量低电平电流的灵敏度，取决于芯片对被测电流源所呈现的输入阻抗。在表 2-1 中，列出了一些运算放大器输入阻抗以作比较。


  **表 2-1** 运算放大器阻抗与成本


  | 集成电路 | 输入阻抗（欧姆） | 成本（加元） |

  | --- | --- | --- |

  | `LM741` | 2 MΩ（10⁶） | < $1 |

  | `LF411` | 1 TΩ（10¹²） | $1 到 $2 |

  | `LMC6081` | 10 TΩ（10¹³） | $4 到 $5 |

  | `OPA129` | 10T 到 100T（10¹³ 到 10¹⁵） | $12 |


  随着输入阻抗在 10¹³ 欧姆到 10¹⁵ 欧姆范围内增加，集成电路运算放大器的成本显著上升。


  当涉及电机或热传递操作时，会遇到远大于实验所得测量信号处理的微安和毫安范围的高电流测量。为了最大限度地减少对健康的危害和火灾引燃的可能性，有许多关于安全实施高压、大电流电气系统的规范。当应用需要高压、大电流电能时，应咨询相应的专家和适用的电气规范。后续章节中监测和讨论的较高电流为低电压性质。


  固态电子系统在 3 V 到 30 V 范围内工作。因此，为常见步进电机、冷却风扇、热电热传递系统和电化学操作供电所需的较高电流很少超过此范围。


  大多数手持式和台式电子测量仪器在串联连接到电流源和负载时，可测量高达 10 A 的电流。然而，涉及电解、电沉积或固态热电热传递的低压、大电流实验通常使用超过 10
  A 的低压电流，而 12 V 铅酸电池（如汽车启动应用中使用的）可按需提供 500 A。


  回顾一下，两个并联放置的电阻根据其阻值比例分配它们之间的总电流，你可以想象出修改固定刻度安培计以测量更高电流的方法。当传统的安培计（例如基于达松瓦尔/韦斯顿检流计运动且具有低内阻的安培计）需要测量更高电流时，会在仪表输入端子之间放置一个已知值的“分流”电阻，以形成一对并联电阻。分流电阻的阻值远低于仪表内部组件所显示的阻值，因此电路中已知较大比例的电流会流过分流电阻。


  商用分流电阻有多种值、精度、物理形式和成本可供选择，从表面贴装器件到带有螺钉或螺栓型电气连接的离散平板式安装单元。本练习后续部分将介绍分流器的制作以及确定电流大小的方法。


  安培定律将电流与磁场联系起来，使得通过测量连接电流源和负载的导体周围的磁场强度，能够以非接触方式测量导体电流（见第 5 章）。磁场电流确定方法称为间接测量。测量传感器与带电导体隔离。


  直接测量依赖于欧姆定律。对于直接测量，分流电阻串联放置在电流源、负载或地之间。如果分流器位于电流源和负载之间，则测量被视为“高端”测量；如果位于负载和地之间，则属于“低端”测量。


  电流分流器的高端和低端放置问题，会影响测量低阻值电流分流器上小电压降的技术。


