  有关热电偶热量测量理论与实践的更多讨论，请参阅《电子学艺术》以及访问`www.analog.com`。几乎所有主要的集成电路制造商都有专门的应用笔记，描述其可用于热电偶温度测量的电路。




  ## 实验


  当使用热电偶实现温度测量时，微信号放大和冰水参考信号的需求，最好通过专用集成电路（ASIC）和市面上现成的点焊传感器来满足，这些传感器易于获取、价格低廉、可重复且可靠。


  热电偶结经过点焊以确保完全的物理和电气接触。商用组装传感器通常配备有特制的彩色编码公插头，用于插入单个传感器系统的母连接器，或像许多工业应用那样，插入用于多传感器类型网络的集线器。（北美以外的地区颜色编码有所不同。）在本练习中，Omega
  Engineering 公司生产的商用 J 型和 K 型热电偶所附带的公头热电偶插头，连接到一个红色或黄色的母插座上，母插座再通过一对双绞线连接到原型面包板。


  插接式面包板便于轻松组装并为 AD 595 陶瓷 DIP 集成电路供电，该芯片为 K 型铬镍-铝镍硅传感器提供内部电子冰水参考电压、信号放大和高阻抗电压读数。（AD
  594 DIP 陶瓷芯片可用于 J 型热电偶。）制造商的数据手册提供了以下主题列表的信息（见图 3-23 至 3-26）：


  *   热电偶基础知识

  *   AD594 和 AD595 用于 J 型和 K 型传感器的温度标度校准

  *   所需显示温度范围和精度对应的电源要求

  *   器件输出模式及实现热电偶故障报警


  最初，本书使用了安装在原型面包板上并由 `LabJack U3-HV` 接口供电的 `AD595`。演示系统中的电气连接通过螺丝连接器和一对双绞线完成，双绞线将仪表放大器连接到行业标准的黄色
  K 型热电偶插头。为了确保可靠性，还安装了一个红色 LED 连续性故障报警器。


  验证或演示热电偶温度测量以及处理高温实验带来的材料问题中，比较困难的方面之一在于制造小型、可控的高温热源。


  图 3-28 中接近 `200°C` 的温度，是通过将一个 `15 W` 的“负载灯”灯泡封装在锡纸包裹的瓦楞纸板辐射热烤箱中实现的，如图 3-22 所示。烤箱放置在一块底板上，底板上开有孔洞，以便将负载灯灯泡拧入其灯座。必须小心确保底板紧密地安置在
  CSA 或 UL 认证灯具中包裹灯泡插座的可拆卸螺纹瓷环下方。（加拿大标准协会或美国保险商实验室——电气配件认证机构）。烤箱的壁和顶由锡箔包裹的厚重硬纸板套筒和方形锡箔覆盖的硬纸板制成。灯泡功率可以通过经认证的调光器或图
  3-23 中的电路来控制。


  如果选择使用 TRIAC 供电的交流 PWM 电路来控制施加到灯泡的功率，则定时电容器应为塑料薄膜型或接近 `1 μF` 的低漏电电容器，以使定时器 IC 输出与
  60 Hz 交流线电压波形保持同步。请记住，所有交流布线和电气配件必须符合当地电气或建筑规范。


