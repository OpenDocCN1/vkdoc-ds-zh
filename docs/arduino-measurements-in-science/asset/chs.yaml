- "# 反向偏置 LED 用作光学高温计\n\n非接触式光学高温计是目前测量高温物体温度的唯一方法。一百多年来，定量测量加热钨丝所需的功率被用于测量高达钨熔点的热表面温度。当以白炽背景为参照时，热钨丝在其温度与被测加热表面温度匹配时会变得不可见。“隐丝式”光学高温计只能用于温度足够高、能产生足够光线以供观察的表面。\n\
  \n在本节的主要和次要部分，热钨丝的温度和电阻已被标定。标定后，炽热的钨丝用于确定反向偏置 LED 看到来自灯丝发射的特定波长光时的温度。与选择性光发射检测实验相反，反向偏置\
  \ LED 的响应可以构成一个基本的光学高温计。\n\n图 4-51 展示了一个小实验的结果。图中绘制了标称颜色二极管在对应灯丝温度下的反向偏置 LED 放电时间响应。\n\
  \n除了多个 LED 的曲线图外，还绘制了红光 LED 放电时间响应与温度关系的指数拟合趋势线（见图 4-52）和自然对数拟合趋势线（见图 4-53）。从红色二极管的反向偏置放电时间可以看出，放电时间或电流的自然对数可以在二极管存储电荷与计算出的炽热灯丝温度之间形成合理的线性相关关系。\n\
  \n![../images/503604_1_En_4_Chapter/503604_1_En_4_Fig53_HTML.jpg](img/503604_1_En_4_Fig53_HTML.jpg)\n\
  \n图 4-53 – 钨丝温度 vs. 二极管放电时间的自然对数 (LN)\n\n![../images/503604_1_En_4_Chapter/503604_1_En_4_Fig52_HTML.jpg](img/503604_1_En_4_Fig52_HTML.jpg)\n\
  \n图 4-52 – 钨丝温度 vs. 红色二极管放电时间\n\n![../images/503604_1_En_4_Chapter/503604_1_En_4_Fig51_HTML.jpg](img/503604_1_En_4_Fig51_HTML.jpg)\n\
  \n图 4-51 – 钨丝温度 vs. 二极管放电时间\n\n如果反向偏置 LED 的光收集测量基于电压差技术，则 LED 可在颜色选择性光电二极管模式下工作。光电二极管的响应应与入射光量呈更线性的关系。对反向偏置\
  \ LED 上的电压差进行单通道读取，可以消除 ADC 多路复用器的“串扰”问题。这应能在热表面温度和反向偏置 PN 结感测到的定量光收集量之间提供更可用的相关性。\n\
  \n为了记录热灯丝发射与反向偏置 LED 收集的选定波长光之间的关系，可以将`Listing 4-5`（用于 Arduino 微处理器）与`DAQFactory`或`RPi`绘图程序配合使用以记录数据。每个待测二极管可以安装在小原型板中心，如图\
  \ 4-48 和 4-49 所示，并放置在 4 英寸（10.2 厘米）的曝光盒中，以 12 V Sylvania 1156 灯泡作为发射源。数据记录实验从将灯丝电压-电流设置到略低于二极管被激活的点开始，如表格\
  \ 4-5 中的数据所示。使用`DAQFactory`绘图工具进行的典型基于时间的数据记录过程如图 4-54 所示。\n\n我测试了手头库存中四种颜色的二极管，典型结果如图\
  \ 4-54 所示，该二极管为直径 5 毫米（¼ 英寸）的透明绿色高亮度器件。\n\n![../images/503604_1_En_4_Chapter/503604_1_En_4_Fig54_HTML.jpg](img/503604_1_En_4_Fig54_HTML.jpg)\n\
  \n图 4-54 – 反向偏置绿色 LED 对热钨丝 (W) 的响应\n\n为了建立灯丝温度与反向偏置绿色 LED 响应之间的相关性，电源增量电压设置和测量的灯丝电流可以确定数据记录期间在已知时刻的灯丝电阻和相应温度。为了可视化，将灯丝温度与相应的记录探测器响应绘制成图。图\
  \ 4-55 展示了观察到的反向偏置绿色、高亮度、透明、5 毫米直径 LED 的 ADC 计数与距 4 英寸（10.2 厘米）距离处炽热的 Sylvania 1156、12\
  \ V 灯泡灯丝的计算温度之间的图形相关性。为了涵盖不同的温度范围，还为老式绿色 LED、红外二极管和透明高亮度蓝色器件生成了类似的相关曲线。\n\n## 观察结果\n\
  \n表格 4-5 列出了电源值以及计算出的灯丝电阻和温度。在每个标称颜色标题下方是反向偏置 LED 从无响应 (n/r) 转变为主动测量波长比正向偏置二极管发射的光更短的光的起始时间计数。\n\
  \n![../images/503604_1_En_4_Chapter/503604_1_En_4_Fig58_HTML.jpg](img/503604_1_En_4_Fig58_HTML.jpg)\n\
  \n图 4-58 – 蓝色反向偏置 LED ADC 计数与温度的光学高温计相关性\n\n![../images/503604_1_En_4_Chapter/503604_1_En_4_Fig57_HTML.jpg](img/503604_1_En_4_Fig57_HTML.jpg)\n\
  \n图 4-57 – 反向偏置红外 (IR) LED 发射器 ADC 计数与温度的光学高温计相关性\n\n![../images/503604_1_En_4_Chapter/503604_1_En_4_Fig56_HTML.jpg](img/503604_1_En_4_Fig56_HTML.jpg)\n\
  \n图 4-56 – 绿色反向偏置 LED ADC 计数与温度的光学高温计相关性\n\n![../images/503604_1_En_4_Chapter/503604_1_En_4_Fig55_HTML.jpg](img/503604_1_En_4_Fig55_HTML.jpg)\n\
  \n图 4-55 – 绿色反向偏置 LED ADC 计数与温度的光学高温计相关性\n\n**表 4-5 – 反向偏置 LED 对热钨丝辐射发射的响应**\n\n\
  | -![../images/503604_1_En_4_Chapter/503604_1_En_4_Fige_HTML.jpg](img/503604_1_En_4_Fige_HTML.jpg)\
  \ |\n\n\n\n## 讨论\n\n我们视觉感知所利用的大部分光线来自炽热的白炽元素。对光与色的研究至少需要涉及一小部分关于热和温度的研究。白炽物体发光时的温度，只能通过非接触式光学方法，或根据测量到的导体电阻随温度的变化来近似估算功耗来确定。（大多数金属、合金和许多元素都提供了电阻温度系数\
  \ `TCR`。）\n\nK 型和 J 型热电偶可以测量 1200°C 至 1300°C 范围内的温度，但在更高温度下接近传感器的熔点。在反向偏置 LED 光学高温计项目的开发阶段，将图\
  \ 4-51 和图 4-52 所示的曲线数据转换为图 4-53 中的数据，提出了一种测量 1150°C 至 1900°C 范围内温度的方法。尽管图 4-52 中描绘的平滑曲线在\
  \ 1400°C 至 1900°C 之间是可读的，但在 1400°C 至 1150°C 之间，放电时间与温度的变化率很大且定义不清。图 4-53 中放电时间与温度的自然对数绘图则更为明确和精确。\n\
  \n代码 4-5 和 4-4 测量了一个或多个已反向偏置以收集特定颜色光的 LED 的放电时间。放电的衰减时间与收集到的光量成反比。收集的光量越大，产生的电荷越大，放电时间越短，如图\
  \ 4-51 和图 4-52 所示，放电时间和温度曲线呈向下凹形。\n\n代码 4-5 测量微处理器 ADC 电压差，即在充电的反向偏置 LED 放电过程中的差异。回顾一下，电容器上的电荷`Q`等于电容乘以电压。因此，存储在\
  \ PN 结中的电荷越大，放电时产生的 ADC 值就越大。温度与 ADC 计数的曲线呈向上凹形，如图 4-55 至图 4-58 所示。\n\n图 4-55 和图\
  \ 4-56 展示了透明 LED 和彩色 LED 略微不同的灵敏度。图 4-55 中描绘的曲线，通过将透明的绿色环氧树脂反向偏置二极管暴露在 1430°C 的加热灯丝下产生，得到了\
  \ 200 的 ADC 计数值。一个彩色的绿色反向偏置二极管在 1530°C 时产生 200 的 ADC 计数值。\n\n图 4-51、4-55、4-57 和\
  \ 4-58 中的温度标尺表明，使用反向偏置 LED 时，应采用非接触式测量方法，温度范围约为 550°C 至 2200°C。\n\n本主题的讨论中介绍了非欧姆电阻，因为它对于通过电加热白炽灯丝产生人造光至关重要。白炽钨灯丝作为灯泡中的主要光源，温度约为\
  \ 2700°C。石英碘灯也使用钨丝，并结合碘来重新沉积蒸发的钨，此时钨丝温度额外升高 250°C 至约 2950°C，以获得更亮的光线，其照明特性更接近日光。\n\
  \n在所有金属元素中，钨的熔点最高，为 3695°K、3422°C 或 6182°F。钨金属的电阻温度系数为 0.004403。其高熔点允许在感兴趣的温度范围内，根据金属电阻值进行近似的温度计算。众多数值分析技术提高了本工作中提出的简单温度-电阻近似的精度。^(³)\n\
  \n欧姆定律定义了在恒定温度下，导体中电流、导体电阻和施加在系统上的电压之间的固定关系。电阻随温度变化。在细钨丝导体中，通过加热导线可以实现电阻的较大变化。\n\
  \n在图 4-4 中，当灯丝开始发出可见的红光时，斜率发生了明显变化，这标志着可以说灯丝电阻正从欧姆行为过渡到非欧姆行为。\n\n在图 4-43 和图 4-44\
  \ 中，利用相对较冷灯丝的明显欧姆行为，仅使用低电流和低电压功率应用，来精确确定微小灯丝在环境温度下的分数欧姆电阻值，该值用于温度电阻近似。\n\n在获得了小钨丝电阻的合理数值后，可以建立受控功率输入加热下的灯丝电阻与灯丝温度之间的相关性，如表\
  \ 4-4 所示，并在图 4-46 和图 4-47 中展示。能够控制施加到灯丝上的热量，并了解该加热灯丝所发射辐射的最终温度，使得可以通过使用反向偏置 LED\
  \ 进行特定颜色光感测，来演示黑体辐射的基本辐射能量量子化解释。\n\n如图 4-45 所示布线，将不同颜色的反向偏置 LED 组装成一个阵列，如图 4-49\
  \ 所示，然后封装在如图 4-48 所示的曝光室中，演示了黑体辐射量子化。实验从环境条件开始，此时未对 Sylvania/Osram 1156 灯泡灯丝施加任何功率。此时，二极管阵列的输出应全部指示经验确定的最大\
  \ 30,000 单位时间计数。逐步增加为灯丝供电的电源电压。短时间内，当灯丝电压和电流稳定后，记录灯丝电压和电流的功率读数，以及每个二极管阵列元件上反向偏置\
  \ PN 结的放电时间计数。数据采集过程持续至灯丝达到全功率。数据缩减过程包括将记录的功率设置和各个平均二极管时间计数输入如图 4-59 配置的电子表格中。\n\
  \n![../images/503604_1_En_4_Chapter/503604_1_En_4_Fig59_HTML.jpg](img/503604_1_En_4_Fig59_HTML.jpg)\n\
  \n图 4-59\n反向偏置 LED 暴露于黑体辐射的数据缩减电子表格\n\n\n\n表 4-5 列出了在标称反向偏置二极管中，能够通过发射的黑体辐射产生光电流的温度。如果发射的辐射波长能量过低，无法激发彩色\
  \ PN 结中的电子，那么二极管就不会对灯丝辐射产生响应。随着灯丝功率增加、温度升高，二极管会根据其 PN 结导通起始电压，按照红色、橙/琥珀色、黄色、绿色和蓝色的顺序依次激活。对观测到的二极管行为的一个简单解释是：发射的辐射相对于其发射温度来说是量子化的。\n\
  \n反向偏置的红外和紫外二极管会对灯丝温度低于和高于可见光谱中红色和蓝色波段时所发射的辐射产生响应。\n\nADC 计数值与计算出的灯丝温度呈现平缓的连续曲率，这提供了一种在恒定定义条件下，通过查表法或趋势线计算法对热表面温度进行非接触测量的方法。每个用作光学温度传感器的二极管都必须进行校准，如表\
  \ 4-3 所示。\n\n需要一定量的实验才能选出最适合特定温度范围的二极管。必须针对手头的系统，通过实验来确定施加于灯丝上的电压或电流的正确增量大小，这些增量应能生成具有平缓曲率或线性度的最终相关性图，从而能够根据\
  \ ADC 响应合理准确地估算热表面温度。在标定和实验测量过程中，必须固定二极管与发射器表面的距离。请务必记住，大多数二极管都是环氧树脂封装且对热敏感的。\n\n\
  ## 荧光照明\n\n现代照明中使用的大部分人造光都依赖于荧光过程。荧光是指物质或材料在吸收光或其他电磁辐射后发出光线的现象。这种吸收能量的材料通常被称为*荧光粉*。多年来，荧光一直被用作一种更节能的人造照明方式。电流通过含有氩气和微量汞的玻璃管，会激发强烈的汞\
  \ 254 nm 辐射。这种汞辐射被玻璃管内壁的荧光粉涂层吸收，并重新发射为混合色，人眼将其感知为白光。白光 LED 也使用各种荧光粉材料，将初始的强二极管发射（例如蓝色）转换为人眼感知为白光的混合色。白炽灯、荧光灯和固态白光光源对颜色的影响均与日光不同，其中\
  \ LED 被认为最接近日光效果。\n\n## 计算机成像\n\n人类是视觉导向的。本书反复出现的一个主题是，通过可视化观察数据趋势来帮助理解现象，实时显示数值数据的图形化非常有价值。在不同时间帧内顺序采集的图像，以人类可理解的速度重放时，能揭示在“实时”中错失的事件。对构成图像的数值差异进行数学分析，可以引导计算机模拟出类似人类的视觉理解能力。\n\
  \n远程成像能够观测到人类无法亲临或无法在维持人类生存的环境中观测的事件和现象。\n\n在本基础实验中，设备仅限于易于获取且价格低廉的 RPi 计算机、简单的网络摄像头以及诸如\
  \ Python 编程语言和 CV 计算机视觉项目之类的开源软件。\n\n## 实验\n\nRPi 基于智能手机的集成电路构建。它可以连接数码相机外设。已经编写了一个\
  \ Python 库，用于直接与 Raspberry Pi 基金会的`picamera`接口，并通过软件适配与许多其他 USB 网络摄像头交互。\n\n一个关于计算机视觉的开源项目始于\
  \ 20 世纪 90 年代末。可以在 OpenCV 网站（[`opencv.org`](http://opencv.org)）上找到它。一个有用的 Python\
  \ 衍生版叫做`SimpleCV`，它可以作为图像捕获、处理和解释工具。\n\n有三个图像捕获和显示库可以轻松下载到 RPi 上。这些库分别是`fswebcam`（图\
  \ 4-60）、Raspberry Pi 基金会的`picamera`软件以及 OpenCV 项目的`SimpleCV`。\n\n所有这三个软件包都可以下载到\
  \ RPi 上。网上有教程和支持文档。这三个包在使用的难易程度、功能强大性和灵活性方面有所不同。\n\n`SimpleCV`需要下载多个依赖项。在撰写本文时，存在几种可用的安装步骤版本。在我执行常规更新和升级操作后，以下命令在\
  \ RPi 上成功运行。\n\n```\n$ sudo apt-get install ipython python-opencv python-scipy\n\
  $ sudo apt-get install python-numpy python-setuptools python pip\n$ sudo pip install\
  \ svgwrite\n然后通过以下命令安装 SimpleCV；\n$ sudo pip install https://github.com/sightmachine/SimpleCV/zipball/master\n\
  ```\n\n该软件包大约 54 MB，可能需要几分钟才能完成下载。可以将 USB 摄像头连接到系统，并通过输入`SimpleCV`命令激活软件，以调出图 4-61\
  \ 所示的控制台。\n\n`SimpleCV`教程位于 [SimpleCV.org](http://simplecv.org)。任何不熟悉计算机视觉和该软件的人都应该查看这些教程。图\
  \ 4-61 展示了用于采集和显示 USB 摄像头图像的四条命令行指令。\n\n![../images/503604_1_En_4_Chapter/503604_1_En_4_Fig61_HTML.jpg](img/503604_1_En_4_Fig61_HTML.jpg)\n\
  \n图 4-61\n\n一个 SimpleCV 控制台会话及捕获的图像\n\n![../images/503604_1_En_4_Chapter/503604_1_En_4_Fig60_HTML.jpg](img/503604_1_En_4_Fig60_HTML.jpg)\n\
  \n图 4-60\n\n一张 fswebcam 图像\n\n\n\n## 讨论\n\n`fswebcam`包是一个相对简单的软件包，用于处理与 Linux 操作系统兼容的摄像头。图\
  \ 4-60 和图 4-61 是使用罗技 VUBM46 2Mp 自动对焦摄像头拍摄的。\n\n该软件下载速度快，使用简单，且具备有限的图像编辑功能。USB 摄像头可以捕捉单张图像，如图\
  \ 4-60 所示。可以消除或编辑横幅，调整图像分辨率，并利用 Linux 的`cron`时间管理功能拍摄延时序列。\n\n`picamera`是树莓派基金会提供的一款图像采集设备和软件包。该摄像头通过一条短排线连接到\
  \ RPi 的图形处理单元（GPU）。GPU 承担了部分本应由 CPU 处理的图像处理计算负载。而 USB 摄像头的数据仅由 CPU 处理。尽管使用专用的`picamera`图像处理速度更快，但排线在物理上限制了其安装位置，而\
  \ USB 摄像头的安装位置则几乎不受限制。\n\n在完成`picamera`的机械安装后，必须重新配置 RPi，以便在 RPi 配置窗口中识别摄像头。通过 PIXEL\
  \ 桌面主菜单的“Preferences”选项，可以进入图 1-16 所示的窗口以及第 1 章图 1-17 中的摄像头选择框。如图 1-17 所示，在“Interfaces”选项卡中启用摄像头选择。启用摄像头后，必须重启\
  \ Pi。\n\nPython 摄像头控制软件支持摄像头图像捕获、录制简单的无声视频、30 毫秒延时摄影，以及静态和视频图像中的各种图像编辑效果。\n\nOpenCV\
  \ 是一个计算机视觉项目，它通过分析构成图像的数值数据文件之间的差异，使计算机能够“看见”。图像文件可能很大，分析数值差异的计算量也会很大，因此需要强大的计算能力。\n\
  \nOpenCV 是用 C 和 C++编写的。SimpleCV 是一个*Python 封装器*，它基于 OpenCV 计算机视觉代码构建。\n\n图 4-61\
  \ 是一个最小化控制台会话的截图，能够捕获并显示罗技网络摄像头的图像。[SimpleCV.org](http://simplecv.org)上的教程涵盖了以下主题：安装基础、与显示器交互、加载图像目录、宏、二值视觉、计时、监测空间或视野内的变化、操作或编辑图像、图像算术，以及叠加或分层图像。\n\
  \nSimon Monk 在《Raspberry Pi Cookbook》（O'Reilly Media，2019）的第 8 章中讨论了涉及使用 SimpleCV\
  \ 进行硬币计数、运动检测和人脸识别的一系列计算机视觉练习。\n\n## 代码清单\n\n```c\n// Single LED Light Sensor\n\
  // Light sensed with A0 voltage measurement of discharge of reverse\n// biased LED\
  \ thru 220 ohm resistor. Anode to pin 2 (long lead)\n// cathode (short lead) to\
  \ A0.\n//\n// define variables\nbyte anodePin = 2;                    // led anode\
  \ pin connection\nbyte cathodePin = 14;                 // A5 digital pin number\n\
  int vltg_s = 0;                       // starting voltage\nint vltg_f = 0;     \
  \                  // final voltage\n//\nvoid setup() {\n// global disable pull\
  \ up resistors\n_SFR_IO8(0x35) |= 0x10;\ndigitalWrite(anodePin, LOW);          //\
  \ initialize pin as low on output declaration\npinMode(anodePin, OUTPUT);      \
  \      // declare anode pin as output\npinMode(cathodePin, INPUT);           //\
  \ declare cathode as input\n//\nSerial.begin(9600);                   // start serial\
  \ port\n//\n}\nvoid loop() {\ndigitalWrite(anodePin, HIGH);       // configure pins\n\
  pinMode(cathodePin, OUTPUT);        // to turn led on\ndigitalWrite(cathodePin,\
  \ LOW);      // discharging capacitor residual\n//\n// allow led to accumulate charge\n\
  digitalWrite(cathodePin, HIGH);\ndigitalWrite(anodePin, LOW);\n// put cathode into\
  \ measuring state\npinMode(cathodePin, INPUT);\n// read initial voltage level\n\
  vltg_s = analogRead(14);\n// set led discharge time\ndelay(30);\n//\nvltg_f = analogRead(14);\
  \  // read the voltage after discharge\n//\npinMode(cathodePin, OUTPUT);\ndigitalWrite(cathodePin,\
  \ LOW);\nSerial.println(vltg_s - vltg_f);\n}\n```\n**清单 4-5**  \n一个使用放电电压差测量入射光的\
  \ Arduino 单反向偏置二极管光传感器\n\n\n\n```c\n// 一种六波长、反向偏置 LED 电磁光谱仪。\n// 6 种不同颜色的 LED 在\
