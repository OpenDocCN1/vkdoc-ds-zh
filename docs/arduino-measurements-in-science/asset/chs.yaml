  \ 脉冲宽度差值热敏电阻监视器*\n\n---\n\n## 摘要\n\n本章区分了热和温度，讨论了常规科学工作中通常遇到的极端情况，以及校准和验证温标的一些方法。\n\
  \n还介绍多种温度传感器，包括它们的灵敏度范围、输出信号和成本。\n\n介绍了使用热敏电阻、热电偶和非接触式红外传感器实现高分辨率和常规分辨率温度监测的方法。\n\
  \n对热电热传递、绝缘、数学冷却模型和红外安全应用进行了适度的详细研究。\n\n商用以及成本较低的组件组装的 SCADA 系统均可实现热与温度的监测与控制。\n\
  \n以红外辐射形式存在的热能是第 4 章的一部分，该章探讨了光、光学和光电效应的科学。\n\n\n\n"
- "# 4. 光、光学与光电效应\n\n人类的视觉在文明出现之前的白昼中进化，因此需要人工照明来在夜晚看清事物，并照亮封闭的居所。最初基于碳的不完全燃烧的人工照明，产生了木柴炊火、动物油脂和蜡烛特有的红黄色光线。后来，人们开发出了预混氧气燃料气体火焰，可以调节出更明亮、更洁净的光线。最终，电能通过电弧、白炽灯丝以及后来的电子跃迁产生的热量，生成了白光。\n\
  \n物理学建立了黑体被加热至白炽状态时发出的光线颜色与温度之间的关系，从而能够根据热辐射体的温度（以开尔文度为单位）来定义颜色。可见光的颜色介于 1000°K\
  \ 和 10,000°K 之间。\n\n尽管人工照明已经发展到使用白炽灯丝、碳弧、石英碘化学循环、气体放电激发和固态发光等技术，但所有这些照明技术都无法复现人眼在日光下所见到的颜色。\n\
  \n除了照明之外，光还可以用作科学测量工具、视觉记录介质、数据传输媒介或能源。来自太阳的光线，随着与太阳的轨道距离变化以及地球的自转，产生了季节性的气候变化和每天的天气。日光和人工光被用于农业和温室作业。光合作用将二氧化碳和水转化为生物质和氧气。\n\
  \n本章讨论光、光学和光电效应。它探讨了光在简单光谱测量应用中的使用，并介绍了基础量子物理学、简单计算机成像、计算机视觉以及能量收集与转换。\n\n关于人眼可见的电磁频谱范围（即颜色）的讨论，通常以其波长来衡量，该波长通常介于电磁频谱的\
  \ 390 nm 至 700 nm（纳米，即 `10^(–9)` 米）部分之间。在较长波长处，该电磁辐射区域被称为红外线。在较短波长处，该辐射被称为紫外线。鸟类、鱼类和夜行动物能够部分看到红外线和紫外线区域，而这些区域对于人类来说，只有通过光电光度测量仪器才能看见。\n\
  \n对电磁频谱的研究以及新技术的发展，不断推动着电磁频谱应用的进步。因此，针对电磁频谱不同部分所蕴含的能量，出现了许多不同的术语。\n\n表 4-1 列出了电磁频谱中各个已命名部分的名称，以及用于定量描述光子能量的测量单位。\n\
  \n**表 4-1**\n**电磁频谱各部分的能量表达**\n\n| -![../images/503604_1_En_4_Chapter/503604_1_En_4_Figa_HTML.jpg](img/503604_1_En_4_Figa_HTML.jpg)\
  \ |\n\n表 4-1 仅涵盖了电磁频谱的一小部分。科学与工程领域已经发展出众多技术，用于制造仪器来监测和使用所列波长的电磁辐射。当以纳米表示时，这些波长的差异可达六个数量级。\n\
  \n从可见光和紫外光的利用发展而来的定量和定性光谱学方法，传统上以其测量波长（单位为纳米，`10^(–9)` 米，写作 `nm`）来指定这些应用中使用的辐射。红外光谱及其“指纹区”（`1500\
  \ cm^(–1)` 到 `500 cm^(–1)`）使用每厘米长度内的波数作为单位，称为波数（`cm^(–1)`）。在指纹区，红外辐射会被构成有机分子的分子结构所吸收。\n\
  \n碳基有机化合物的许多结构特征都会在指纹区产生独特、可识别的红外辐射吸收模式。波数用于理解有机分子结构特征与入射红外辐射光子能量之间的物理化学相互作用。波数越高，表示能量越高。\n\
  \n通过测量红外光子吸收的能量，可以将有机分子振动模式中的伸缩、弯曲和摇摆等振动方式归属于特定的振动模式。`nm` 与 `cm^(–1)` 之间的换算系数是 `10⁷`，这使得红外光谱中一位数和两位数的波数值更易于使用。\n\
  \n质谱学、半导体物理学和固态物理学主要关注那些通过磁场或电势进行物理操控或加速的电子的能量；这些能量以电子伏特（electron-volts）为单位进行评估和衡量。以电子伏特为单位测量或评估的高能紫外光光子，会从气体分子中移除电子以产生离子，然后可以通过静电计检测这些离子，并以收集到的离子流形式进行物质质量的定量测量。超过特定阈值的收集电流可以触发警报。使用光电离检测器（`PID`）的电池供电手持式仪表，能够在极低相对丰度水平下检测和定量危险或有毒气体。\n\
  \n利用太赫兹波段辐射的仪器，正被开发为一种用于 X 射线扫描和材料识别的非电离、低能量的替代技术。\n\n对光的行为及其与物质相互作用的研究，构成了实验科学的一大部分。各种各样的固态器件可用于光能与电能之间的相互转换，从而实现对各种物理和化学参数的测量。`LED`、光电晶体管、光电二极管、光敏电阻和光电管，能够以不同的灵敏度与不同光谱波长的光进行电子交互，可用于定性和定量的光测量。\n\
  \n利用大面积固态`PN`结，可以将太阳光转化为电能，为电网补充电力，或为离网的独立电力负载供电。\n\n秉承本书简化的宗旨，我们只考察在环境条件下使用现成电子元件即可触及的电磁频谱部分。在环境条件下，有源器件的工作光谱范围从较长波长的红外线（IR），穿过可见光区的各种颜色，到较短波长的紫外线（UV）。\n\
  \n本节将简要探讨光伏电池或太阳能电池对人工光源的敏感度。它们作为太阳能电源的应用将在第 11 章中介绍。\n\n## 光电元件\n\n\n\n### 光敏电阻（LDR）\n\
  \n`LDR`（光敏电阻）是一种半导体，在黑暗环境中仅有少数自由电子可移动，因此呈现高电阻——通常为数百、数千或数兆欧姆。当有光照射时，其晶体结构会吸收光能。部分晶格电子被激发到足以挣脱束缚并移动的能级（即晶格的导带），从而降低器件电阻，降幅常达数千欧姆。\n\
  \n常见的`LDR`器件是硫化镉（`CdS`），它对波长为 545 纳米（nm）的绿光敏感。硒化镉（`CdSe`）器件则对 725 纳米的红光敏感。还可购得混合型`CdS-CdSe`器件，其对约\
  \ 640 纳米的红橙光敏感。\n\n从开始吸收光到电阻下降之间，存在约 10 毫秒的时间延迟。然而，当高强度的入射光停止后，导电电流衰减、电阻回升的过程可能长达一秒钟。光敏电阻具有温度敏感性，且光通量与电阻之间的关系是非线性的。器件电阻与光通量之间的关系可用如下指数公式描述：\n\
  \n```\nR = A × e^a-- (1)\n```\n\n其中，`R`是器件电阻。`A`是与材料受光面积成正比的常数，`e`是自然对数底数 2.718。`a`也是一个与材料有关的常数，对于`CdS`，其值在\
  \ 0.7 至 0.8 之间。（为便于设计或计算，应测量并绘制出该器件电阻对数与照度对数的关系图，并用直线近似表示。）\n\n`LDR`不适用于高速监测光照变化，且其工作范围局限于可见光和近红外辐射波段。硫化铅和硒化铅则是适用于电磁波谱中远红外波段的电阻敏感型器件。\n\
  \n### 光电二极管\n\n光电二极管具有一个反向偏置的`PN`结，在器件未被适当能量光子照射前，仅有漏电流或“暗电流”通过。暗电流或漏电流通常处于纳安级。部分光电二极管采用`PIN`结结构制造，该结构在`P`结和`N`结之间特意形成了一层厚而宽的本征区域。增大本征区域面积会降低整流性能，但会增强光敏性能。\n\
  \n撞击本征区域的光子会按入射光子数量成比例地产生电子-空穴对。所产生的电流几乎与光子通量成线性比例响应。其响应速度非常快，频率响应通常可达低两位数吉赫兹范围（1,000,000,000\
  \ 或 10⁹ Hz）。\n\n根据是否存在偏置电压，`PN`结可作为光导器件或光伏器件使用。太阳能电池就是具有大表面积的光电二极管（见第 11 章）。\n\n\
  ### 光电晶体管\n\n光电晶体管类似于普通的双极晶体管，但其基极电接触点被一个光敏表面所取代。器件受光照后，会激发基极电流，进而控制更大的集电极-发射极电流。许多光电晶体管仅有两个引脚，因为基极本身即为光敏表面。（光电晶体管的发射极引脚通常有一侧是平的，或者其引脚长度较短。）其`PN`结对可见光辐射的响应范围从\
  \ 400 纳米波长一直延伸到近红外区域，在约 840 纳米处灵敏度最高。光电晶体管利用光敏基极结构来产生与入射光强度成正比的基极电流，从而在器件内部激活普通晶体管的电流放大作用。光电晶体管对光的灵敏度比光电二极管高多个数量级。\n\
  \n图 4-1 显示了基于镉的`LDR`和光电晶体管的光谱灵敏度。硫化镉器件在可见光谱的 550 纳米范围（即绿光区域）表现出最高灵敏度。光电晶体管的最高灵敏度则在可见光谱的\
  \ 850 纳米（即红光/近红外）部分。与光电晶体管类似，光电二极管呈现出较宽的光谱灵敏度，其最大值范围在 800 纳米至 1000 纳米之间。\n\n![../images/503604_1_En_4_Chapter/503604_1_En_4_Fig1_HTML.jpg](img/503604_1_En_4_Fig1_HTML.jpg)\n\
  \n**图 4-1** 基于镉的 LDR 与光电晶体管的光谱灵敏度\n\n\n\n### 电光应用\n\n`LED`（发光二极管）通常用作视觉指示灯或光源中的耗能元件，也可用于计数和定时事件。`IR`（红外）光电二极管已被用于光学断开式光束系统，作为高速事件的指示器/探测器。`LDR`（光敏电阻）和光电二极管是安防系统的核心部件。\n\
  \n对实验科学尤其有价值的是发光二极管（LED）在多种颜色和波长能力上的发展。借助一系列体积小巧、成本低廉、易于使用且随处可得的器件，实验者能够生成并测量覆盖从近红外到紫外范围的电磁波谱离散段。许多传统的比色仪器需要棱镜或笨重的滤光片，以及沉重的大功率光源来分离所需颜色或辐射能量波段以进行实验。而`LED`、光敏电阻或光电二极管、低电压电源和简单的遮光箱体，能够利用现成的材料和组件轻松组装成低成本、可正常工作的光谱和光度测量仪器。\n\
  \n许多物质具有与可见光谱部分相互作用的分子或原子结构，从而呈现出颜色。许多与光相互作用的物质可溶解在溶剂中，形成有色液体溶液；早在 19 世纪末，人们就发现这些溶液的物理和化学性质遵循明确的数学关系。多项科学出版物最终推导出了今天被称为稀溶液比尔-朗伯定律的公式。其表达式为：\n\
  \n```\nA = ɛcl -- (2)\n```\n\n`A` 是吸光度，衡量被吸收的入射辐射量。`ɛ` 是吸收物质的摩尔消光系数。`l` 是有色溶液的光程长度。`c`\
  \ 是有色物质的浓度，单位为摩尔/升。\n\n当阳光穿过玻璃棱镜或因雨滴折射时，会分散成构成可见光的各色彩虹。如果来自单色光源（如红色`LED`）的光线穿过稀释的甜菜汁溶液，根据比尔-朗伯定律，会发生若干物理化学过程。\n\
  \n甜菜及其汁液的红色源于名为`甜菜红素`的复杂分子，它是甜菜红苷（一种红色色素）和甜菜黄素（一种黄色色素）的混合物。红色甜菜红苷可吸收波长为 535 nm 的红色光，其摩尔消光系数为\
  \ 60,000 L/(mol-cm)。（吸光度是一个无量纲概念，`ɛ`的量纲必须为`1/c-l`。）\n\n溶液中部分甜菜红苷分子位于入射红光光子的路径上，光线因此被吸收。部分入射光子则完全穿过溶液。随着单位体积溶液中甜菜红苷分子数量的增加，吸收概率成比例增加。随着光子必须穿过的溶液层厚度增加，吸收概率也会增加。\n\
  \n比尔-朗伯定律描述了溶液中光的吸光度如何受三个因素控制：溶液中有色物质的浓度、光线必须穿过的光程长度，以及由引起吸收的有色物质性质决定的常数因子。红色甜菜红苷的摩尔消光系数很大，为\
  \ 60,000 L/(mol-cm)。这个大的常数值表明该分子具有很强的红光吸收倾向。为保持该定律描述的数学关系有效，它只能应用于非常稀释的溶液。\n\n比色分析法广泛应用于众多需要定性和定量识别与测量物质的科学学科中。比色分析法最常以液体形式应用，需要设备精确称量样品、稀释溶剂体积并测量溶液吸光度。为演示溶液吸光度分析，本书设计了一个干膜固态系统和一个基于简单水体积的实验。\n\
  \n图 4-2 是光吸收实验的基本框图。\n\n![../images/503604_1_En_4_Chapter/503604_1_En_4_Fig2_HTML.jpg](img/503604_1_En_4_Fig2_HTML.jpg)\n\
  \n图 4-2\n光吸收实验\n\n对于使用可见光吸收的实验，通常需要一个环境光屏蔽箱以避免外部辐射干扰。红外和紫外实验通常在人工照明条件下进行，但可能需要避免阳光或含有长波和短波辐射的荧光灯照射。\n\
  \n在进行定性或定量光吸收实验所需的电学、光学和机械配置方面，会使用一种称为`光学平台`的装置。光学平台为安装和调节图 4-2 中的三个基本组件提供了手段，这些组件可以在桌面上或实验室工作台上于环境条件下组装，也可放置在避光、温控的封闭箱体中。\n\
  \n## 实验\n\n\n\n### 简易微型光学实验台\n\n基于图 4-2 所示通用流程配置的光吸收实验，需要使用图 4-3 所示的微型简易光学实验台，这就要求同时开发有源光源和透射光量测定方法。\n\
  \n一套基础入门级的光源与探测器组合，由恒流驱动的 LED 构成，可提供带宽极窄、近乎单色的光源。微控制器或人机界面可为光敏电阻供电或偏置，同时监测其输出来量化透射光量。下文介绍的基本装置，是一个能够测量多种电光器件实际光电特性的简易设备示例。\n\
  \n“微型光学实验台”可用一条刚性材料小条、两个螺丝接线端子排和若干导线制成，如图 4-3 所示。我的系统采用挤压铝角材制成，这种材料易得、便宜、轻质、耐腐蚀且相对易于加工。两个双连接器端子排面对面安装在实验台上，可在光源与探测器之间形成可调共线配置。\n\
  \n使用实验台时，将探测器和光源安装到相应的端子排中。通过螺丝端子固定元件并对准，调整器件使其共线。\n\n尽管装置简单，但只要仔细对准并重现光源与探测器之间的距离，它就能产生可靠且有用的数据。通过改变光源与探测器之间的距离，或控制施加给发射光源的功率，均可调节照射到探测器上的辐射光能量。\n\
  \n我制作的组装件，其 LED 光源顶端与光敏电阻光电探测器上表面之间的间距（如图所示）可延伸至约六英寸（153 毫米）。\n\n由于每个 LED 产生单一波长的可见光，且探测器响应本质上由微处理器或\
  \ `LabJack` 的 10 位模数转换器量化，因此探测器计数可作为所研究系统简单量化测量的依据。\n\n本练习中的简易装置能对可见和不可见 LED 光源生成经验性数值测量值，这些测量值展示了典型光敏电阻器件的光谱波长灵敏度，如图\
  \ 4-1 所示。\n\n![../images/503604_1_En_4_Chapter/503604_1_En_4_Fig3_HTML.jpg](img/503604_1_En_4_Fig3_HTML.jpg)\n\
  \n**图 4-3**  \n简易微型光学实验台\n\n利用图 4-2 和图 4-3 所示的基本系统，可以对 CdS 光敏电阻对入射光波长或颜色的典型灵敏度进行粗略评估。\n\
  \n一个 `DAQFactory` SCADA 软件图形用户界面程序可实现测量 LDR 颜色灵敏度的实际数据生成、采集和图形显示过程。图 4-4 展示了一个正在运行的\
  \ GUI 控制页面示例。图 4-4 所示的控制面板可通过清单 4-2 中的 `DAQFactory` 代码和一个 `U12 LabJack` 激活。（注意：所有代码清单均附于本章末尾。）`DAQFactory`\
  \ 绘图器可配置为接收 `LabJack` 或 `Arduino` 的流式数据进行绘图。\n\n在简易设置中，光源功率由 `LabJack` 上的 `AO 0`（模拟输出端子\
  \ 0）控制。探测器输出由 `Arduino` 微控制器监测，并对探测器信号应用数字信号处理（DSP）程序。清单 4-1 包含一个简单的十元素平均代码，理论上，该代码可将探测器信号流式输出到连接串口的设备时，其信噪比提升约三倍。`DAQFactory`\
  \ 图形显示程序和 `Raspberry Pi` 绘图器可进行适配，以提供基于时间的图形化显示，展示到达串口的增强数据。\n\n最初，实验台的探测器是硫化镉光敏电阻与一个\
  \ `10 kΩ`、1%精度的金属膜电阻串联。该分压器由 `Arduino` 微控制器提供 `5.0 V` 偏置，微控制器在通过串口将数据流式传输到运行速度较低的\
  \ `DAQFactory` 图形显示主机之前，运行了一个十元素平均 DSP 程序。在图 4-3 中，一个黄色 LED 安装在光源端子排中，一个 `1/8` 英寸（3\
  \ 毫米）见方的硫化镉（CdS）光敏电阻安装在探测器端子排中。\n\n### 硬件\n\n光学实验台可用任何足够坚硬的材料制成，以牢固固定端子条，使光源和探测器器件保持共线配置。金属、木材、塑料，甚至刚性较重纤维板都可使用。\n\
  \n为了在可见光测量中从所用光源和探测器获得最大灵敏度和选择性，最好用实验台盖或遮光罩排除干扰环境光。罩盖可用任何足够坚硬或刚度足够的非透明材料制成，以承受实验搭建或拆卸过程中的机械操作。无光黑色涂层有助于减少杂散光泄漏和反射的影响。\n\
  \n#### 电路原理图\n\n如果使用指示灯二极管，如 `5 mm T-1¾`（见图 4-3 中的黄色 LED）或 `3 mm T1`  LED 器件作为光源，则通过二极管的电流通常限制在\
  \ `20 mA` 至 `50 mA` 范围内。`LabJack` 或微控制器的模拟输出可编程为在 `0` 到 `5 V` 之间变化，因此应安装一个合适的限流电阻值，以确保实验过程中任何电压编程时，二极管电流仍保持在制造商规格范围内。限流电阻还能确保\
  \ `LabJack` 或微控制器不会抽取过大或启动浪涌电流（通常小于 `30` 至 `40 mA`）。一个典型的分压电路，使用硫化镉光敏电阻作为上拉电阻，并使用\
  \ `10 kΩ` 电阻接地，可为 `Arduino` 的模数转换器提供可测量的信号进行处理。\n\n\n## 软件\n\n为了进行光电测量，必须对发射源、辐射能量探测器以及控制用个人电脑进行适当的编程。\n\
  \n为演示此处介绍的光学平台的实现，我同时使用了`LabJack`和`Arduino`微控制器来提供双向交互式控制系统。光源由清单 4-2 中的`DAQFactory`脚本控制，该脚本改变`LabJack`上`AO\
  \ 0`输出的电压以驱动光源。探测器由`Arduino`提供偏置并进行监测，该`Arduino`负责模数转换（ADC），并运行一个数字信号处理（DSP）的 10\
  \ 元素移动平均程序，如清单 4-1 所示。\n\n`Arduino`通过串口将数据流式输出，以便在主机 PC 上的`DAQFactory`二维图形屏幕组件上进行采集和显示。`DAQFactory`绘图仪同时显示施加到光源的`LabJack`电压和从`Arduino`转换器接收的\
  \ ADC 值。（`LabJack`的模拟输出信号与`Arduino`的模拟输出信号之间存在显著差异。`LabJack U12`的模拟输出具有 10 位分辨率，并经过一个截止频率约为\
  \ 22 Hz 的一阶低通滤波器。\n\n`Arduino`上的`analogWrite(m,n)`指令未经滤波，微处理器会向引脚`m`施加一个频率为 488\
  \ Hz、占空比为`n`的 PWM 方波信号，其中`n`是 0 到 255 的 8 位分辨率值。在比色测量中，由`LabJack`产生的阶梯模拟信号与`Arduino`产生的脉冲方波之间的差异，可能会导致高速光电探测器测量到不稳定的数值。在某些分光光度测量中，可能需要采用信号平均\
  \ DSP 来获得稳定的读数。）\n\n图 4-4 展示了在实验模式下操作光学平台的主显示屏幕。\n\n我的光学平台主 GUI 控制面板屏幕包含以下内容。\n\n\
  -   一个基于时间的二维图形显示，其中施加到光源的电压绘制在左侧轴上，满量程偏转（FSD）范围为 0 至 5 V；探测器输出绘制在右侧轴上，满量程偏转范围为\
  \ 0 至 1025，这是由`Arduino`微控制器上的 10 位 ADC 产生的。\n-   三个编辑框，用于输入要施加到光源的电压起始值、每次迭代电压斜坡的增量值以及程序循环的重复次数。\n\
  -   一个用于启动光源功率程序的启动按钮。\n-   一个显示功率施加间隔时间的文本。\n-   一个用于手动控制施加到光源电压的旋转控件和文本。\n-  \
  \ 一个用于跟踪光源电压值的进度条。\n-   两个用于数字显示光源电压和探测器响应的变量值显示区。\n\n旋转控件、进度条和两个变量值显示组件并非原始控制面板的一部分，而是后来为其他工作添加的，并且对于评估组件电气特性很有用。\n\
  \n#### 必要的脚本编写与微控制器编程\n\n清单 4-2 是当按下`运行电压程序`按钮时启动的自动测试`DAQFactory`脚本。清单 4-1 是一个可根据需要调整以处理探测器信号的`Arduino`移动平均程序。\n\
  \n![../images/503604_1_En_4_Chapter/503604_1_En_4_Fig4_HTML.jpg](img/503604_1_En_4_Fig4_HTML.jpg)\n\
  \n**图 4-4**\n\n典型的`DAQFactory`光学平台 GUI 控制面板及数据记录\n\n### 观测结果\n\n在光源探测器距离为 1.25 英寸（32\
  \ mm）时，自动测试程序通过一个 180 Ω的金属膜 1%精度电阻将二极管电压递增至 5.0 V。硫化镉光敏电阻（LDR）信号由一个与 LDR 串联的 10\
  \ kΩ 1%精度金属膜电阻产生，该电阻由微控制器的 5 V 电压偏置，并由`Arduino`的 ADC 监测。信号经过一个十元素移动平均程序处理后，以数据流形式输出到主机\
  \ PC，主机 PC 上显示归一化的 1024 ADC 单位图形界面。各种光源二极管产生了表 4-2 中列出的数据。\n\n**表 4-2**\n\nCdS LDR\
  \ 对 LED 颜色的响应\n\n| -![../images/503604_1_En_4_Chapter/503604_1_En_4_Figb_HTML.jpg](img/503604_1_En_4_Figb_HTML.jpg)\
  \ |\n\n二极管功率的电流限制限制了器件的光输出，从而限制了可监测光束的实用距离。使用一颗明亮的纯绿色 8000 mcd LED 作为光学平台光源，以及一个正面表面积为\
  \ 1/8 英寸 × 1/8 英寸（3 mm × 3 mm）的 CdS LDR 进行的实验，为图 4-5 提供了数据。\n\n![../images/503604_1_En_4_Chapter/503604_1_En_4_Fig5_HTML.jpg](img/503604_1_En_4_Fig5_HTML.jpg)\n\
  \n**图 4-5**\n\n强度随 LED 探测器距离的衰减\n\n\n\n## 讨论\n\n为了演示如何使用现成且易于构建的机械设备，通过 SCADA 软件\
  \ GUI 实现变量的基本管理，我们测量了典型 CdS 光敏电阻在可见光光谱范围内的灵敏度。观测到的数据已整理在表 4-2 中。根据表中的数据可以看出，该探测器对可见光谱的各个成分及其上下波长的边缘区域均表现出较好的灵敏度。\n\
  \n图 4-4 中的 DAQFactory GUI 屏幕配置了手动可调的数字调节旋钮和关联的进度条，允许您在对二极管和电路（例如遮断光束中断电路等配置）进行测试时调整施加的电压。对于简单的定量测量，例如使用亮绿色\
  \ LED 测量信号随光源-探测器距离的衰减情况，可以在进行实际实验时使用遮光罩排除杂散可见光。\n\n编辑框条目允许在屏幕上方便地改变测试程序的参数。如有需要，可以修改序列代码，以改变电压斜坡循环之间的默认延时。默认时间在\
  \ AutoTest 序列（见代码清单 4-2）第 23 行的 `delay(10)` 代码中设置为 10 秒，可根据需要手动更改。\n\n控制屏幕还同时以进度条和数值的形式显示施加在被测器件（DUT）上的电压。在程序周期的任何时刻，都可以根据限流电阻的阻值和图形输出记录中的电压迹线，计算出流过\
  \ DUT 的电流。\n\n如图 4-4 显示的迹线所示，光输出-探测器响应是施加到二极管及其限流电阻上的电压的线性函数。除了良好的可重复性外，对三次重复测量的仔细检查表明，亮绿色\
  \ LED 仅在电压斜坡升至约 2.25 V 时才会点亮。LED 亮度可以通过将电压设置为与所需 LED 输出相对应的期望水平来控制，或者也可以通过 Arduino\
  \ 的 PWM 或 555 定时器电路来控制。使用 Arduino 微控制器的 PWM 控制可将功率范围划分为 255 个增量，而使用 555 IC 的电位器则可以在整个占空比范围内提供连续可变的脉冲宽度（参见\
  \ [`www.electronics-tutorials.ws/waveforms/555-circuits-part-1.html`](https://www.electronics-tutorials.ws/waveforms/555-circuits-part-1.html)）。\n\
  \nArduino 和 LabJack 上的 ADC 均为 10 位器件（2¹⁰ = 1024），理论上可提供 1/1024 的测量能力。千分之一的精度通常足以在图形显示中跟踪大多数物理现象，使观察者能够捕捉到记录信号中的任何显著变化。通过精心选择图形记录和\
  \ DSP 条件，可以实现量程扩展，从而大幅提高灵敏度，例如，可用于监测信号输出中的噪声。\n\n图 4-5 中的图形展示了大功率亮色 LED 集中的光功率。在测量的短距离内，探测器响应呈平缓的线性下降趋势，强度随分离距离的增加而降低。这种高度集中的\
  \ LED 光束是可以预料的，因为其透明透镜以及二极管阳极和阴极的物理布局设计旨在将发射的光尽可能紧密地聚焦成一束。通常，点辐射源的强度会随着光源与探测器之间距离的增加而呈平方反比指数衰减。\n\
  \n已有研究表明，LED 是不遵循欧姆定律的二极管。它们需要施加约 1.5 V 至 3 V 或 4 V 的电压才能导通电流并以特征颜色发光。同时，也已证实，通过对\
  \ LED 施加 PWM 功率技术，可以利用电源提供的全电压的可变占空比应用来克服最小激活电压。然而，某些光电探测器的响应可能会受到变化的脉冲波信号的影响。\n\
  \n对于差分比色分析，对探测器信号进行时间平均可以减轻 PWM 信号对收集到的光谱数据的影响。另一种简单易行的解决 PWM 影响探测器输出的方法是使用直流信号为\
  \ LED 光源供电。\n\n图 4-18 展示了一种使用可变电阻器来改变施加于二极管的电压的技术，调节范围介于所用有色二极管所需的导通电压与电源可提供的最大电压之间。如果在最低亮度下，二极管发出的光对于所使用的光源来说仍然太亮，则可以在光学平台上增加二极管到探测器的距离，如图\
  \ 4-5 所示，直至探测器输出恢复到可用值。虽然使用可变直流电源可以显著提高探测器输出信号的稳定性，但可能需要一些信号平均处理来减少电噪声和漂移。\n\n文献中讨论了发光度、辐射度和色温的概念，在处理可见光和不可见辐射单位时必须谨慎。表\
  \ 4-2 将所有不同波长的 LED 辐射转换为任意单位的 1024 ADC 计数。LED 强度以毫坎德拉（mcd 或 cd/1000）为单位指定，其中坎德拉是国际单位制中亮度或明度的基本单位。流明和坎德拉之间的关系并非一个简单问题。两者之间的换算需要定义视角、波长和其他因素，如果当前的实验工作需要用到这些单位，则研究人员最好查阅相关文献进行审阅。\n\
  \nLED 是典型的二极管，它们是不遵循欧姆定律的器件。通常，随着二极管颜色从红色向蓝色移动，发光的起始电压从大约 1.5 V 增加到 4 V。除非制造商另有规定，电流应限制在\
  \ 20 mA 到 30 mA 之间。\n\n带有微控制器-计算机读数与绘图仪显示的简易光学平台，是测量单个电光器件电学特性和光谱波长相对灵敏度测量的基础。通过将半透明材料放置在光源和探测器之间的光束中，该光学平台就构成了一个实验性光吸收测量仪器的框架。吸收仪器在定性和定量的理化实验测量中都扮演着重要角色。\n\
  \n\n\n"
- "# 一种采用硫化镉或光电晶体管探测器的固态比色计\n\n顾名思义，比色计是一种能够测量颜色变化的光谱设备。大量文献详细阐述了针对天文学、生物学、化学、工程学、地质学和医学领域中目标分析物的比色测量技术的发展。为了开发更灵活的比色计，可以用单个红绿蓝三色\
  \ LED 替代分立波长二极管，从而形成连续可变的颜色光源。可以为光学实验平台开发一个图形用户界面控制屏幕，将光源的三原色配置成几乎任何可见光颜色。这里开发的流程可应用于为任何实验科学研究或调查开发比色分析法。\n\
  \n能够发出红、绿、蓝三色的复合发光二极管，可以与微控制器的脉冲宽度调制功能（例如`Arduino`所具备的功能）配合使用，充当可变波长的比色光谱光源。一个已发表的视觉实验表明，当三束强度相等的彩色聚光灯斜向照射白色屏幕上的同一区域时，会形成图\
  \ 4-6 所示的三种原色重叠效果。通过生成三原色，RGB LED 可以提供广泛分布的合成色光。这些颜色可通过原色的重叠或混合获得。图 4-11 展示了将标称\
  \ 0–255 的 PWM 功率设置应用于 RGB 单个二极管元件时预期产生的近似颜色。\n\n![../images/503604_1_En_4_Chapter/503604_1_En_4_Fig6_HTML.jpg](img/503604_1_En_4_Fig6_HTML.jpg)\n\
  \n**图 4-6** 原色光组合的效果（来源：[`https://en.wikipedia.org/wiki/Image:RGB_illumination.jpg`](https://en.wikipedia.org/wiki/Image:RGB_illumination.jpg)）\n\
  \n二极管的三种原色各自由不同波长的电磁波组成。一个三色 LED 的典型 RGB 波长分别为 624 纳米、525 纳米和 470 纳米，正向电压分别为 2.25\
  \ 伏、3.5 伏和 3.5 伏，采用透明环氧树脂封装，视角为 20 度。如果在同一光源中同时产生两束或三束波长不同但振幅恒定的波，这些波会组合成独特的和，形成新的波长。图\
  \ 4-6 中的重叠区域显示了将各个原色辐射等量混合后产生的各种组合颜色。为了用肉眼看到这些不同的颜色，通常使用漫射器来“混合”颜色以便显示。从短距离观察多色\
  \ LED 时，人眼通常只能看到被点亮的单个二极管颜色。\n\n为了获得可能的全部可见光颜色范围，三种原色中的每一种强度都必须能从零变化到全亮度（见图 4-11）。\n\
  \n尽管图 4-2 中描述的概念在理论上很简单，但要制造出一台能够利用 PWM 控制光源照明、并使用光敏电阻或光电晶体管进行光探测来测量光强度的仪器，需要考虑并适应若干额外的因素。\n\
  \n`PWM`是一种成熟的控制功率技术，大多数电子学参考资料中都有讨论，包括霍洛维茨和希尔的《电子学艺术》（剑桥大学出版社，2015 年）以及《发明家实用电子学》（麦格劳-希尔出版社，2013\
  \ 年）。\n\n`Arduino`引脚的`PWM`频率为 488 赫兹。施加到 RGB 二极管引脚上的 5 伏 PWM 脉冲，远高于该器件中每个单独彩色 LED\
  \ 的最低典型“开启”电压。在 488 赫兹的频率下，二极管会在选定的脉冲宽度时间内导通，然后关闭。RGB LED 中各个颜色光源以 488 赫兹的频率循环变化，对于人眼来说太快而无法察觉，但对于光敏电阻或光电晶体管探测器则不然。\n\
  \n硫化镉/硒化镉光敏电阻的规格书通常会报告“延迟”时间。光敏电阻可能对入射光在 10 毫秒内做出响应，电阻急剧下降，但在暴露于高强度光照后，重新建立高电阻状态所需的时间要长得多。光电晶体管的频率响应特性在几千赫兹范围内，这取决于器件所驱动的负载大小。硫化镉/硒和光电晶体管器件都具有足够快的响应速度，足以受到`Arduino`的`PWM`频率影响。\n\
  \n解决光电探测器跟随脉冲宽度变化曲线的简单方法是，对探测器响应进行时间平均，或使用可调值的直流电压为光源供电。一个大型滑动平均窗口（例如列表 4-1 中通用的`Arduino`代码）可以生成平滑的探测器平均数值输出。\n\
  \n为了测量透射光强度的差异，需要两个稳定的数值来获得数值差。列表 4-1 和 4-5 是针对`Arduino`微控制器的数字信号处理代码，分别采用通用（列表\
  \ 4-1）和特定应用格式。\n\n## 实验：硫化镉或光电晶体管比色计\n\n可以使用基于 Windows 系统的`DAQFactory`图形用户界面和小型光学实验平台，或者稍加改进的封闭式仪器来进行可见光实验，所有这些都可以用现成的材料制作。在以下练习中，将为简单型和封闭型颜色测量设备开发基于\
  \ Windows 和 Linux 计算平台的软件管理系统。\n\n### 硬件：小型光学实验平台\n\n为了使用图 4-3 中的光学实验平台，并获取图 4-11\
  \ 中所有可用的颜色，可以使用红绿蓝（RGB）LED 作为仪器光源。为了适配 RGB 二极管，光学实验平台上的光源模块必须扩展，以容纳典型的四引脚共阴极器件。如果单个\
  \ LED 就能提供进行吸收实验所需的颜色，则无需对光学实验平台进行改动。可能需要调整遮光罩，以确保排除来自环境光的杂散光。\n\nLED 的每个颜色引脚都可以串联一个合适的限流电阻，并连接到`Arduino`的\
  \ PWM 输出引脚上。（或者，为了进行精度稍低的颜色强度控制，可以在公共引脚和电源地之间串联一个合适的电阻。）所需的最小限流电阻值，可根据用作光源的 RGB\
  \ 或单个 LED 数据手册中列出的安全运行推荐最大工作电流计算得出。\n\n硫化镉探测器无需对其原始的分压器配置做任何改动。如果使用诸如`OP-505`之类的光电晶体管作为探测器，则\
  \ 5 伏偏置电压必须通过一个 10 千欧的“上拉”电阻和光电晶体管降到地。光电晶体管的发射极接地，用于`Arduino` `A0`引脚的模数转换器信号从集电极与\
  \ 10 千欧电阻的连接点取出（见图 4-18）。\n\n\n\n## 软件：DAQFactory – Arduino\n\n要选择单一或复合颜色，RGB 二极管的每个元件都需要独立控制。串行通信链路在设备与主机显示屏之间来回传输控制信息和观测数据。\n\
  \nArduino 微控制器在色度计配置中扮演多重角色，既作为智能编程的源控制器、DSP 计算器，又作为串行通信终端。Arduino 的草图代码如代码清单 4-5\
  \ 所示。\n\n在完全控制每种基色强度的同时，Arduino 的 PWM 功能通过向光源施加 5V 定时宽度脉冲，避免了单个二极管的“导通电压”要求。\n\n\
  图 4-8 所示的 GUI 控制面板屏幕主区域，以条图记录仪的形式显示 CdS 或 OP505 探测器响应，显示内容从右向左移动。需注意，左侧的探测器响应量程可通过在\
  \ DAQFactory 软件的二维图形组件配置窗口的迹线选项卡中，从轴下拉列表选择所需位置来移至右侧，如图 4-7 所示。\n\n![../images/503604_1_En_4_Chapter/503604_1_En_4_Fig7_HTML.jpg](img/503604_1_En_4_Fig7_HTML.jpg)\n\
  \n**图 4-7**  \nDAQFactory 轴选择\n\n图 4-8 描绘了 DAQFactory GUI OP505 色度计控制面板屏幕。从 GUI\
  \ 控制面板的左上角开始，有三个带标签的编辑框和按钮，用于将复合 LED 光源 RGB 二极管的期望功率值输入到 DAQFactory 软件中。需注意，用于向\
  \ Arduino 传输 RGB 值的三个变量，必须在任何脚本编写中使用前声明。图 4-8 中的控制屏幕使用了编辑框、变量值显示、按钮、图形显示和静态文本显示来提供和接收信息。\n\
  \n一旦所需信息输入控制屏幕，按下“RGB 传输”按钮将激活序列代码，通过串行端口传输所需的红、绿、蓝数据值，供微控制器读取并执行所请求的功率级别。代码清单 4-2a\
  \ 包含了用于按钮激活传输的 DAQFactory 代码。\n\n![../images/503604_1_En_4_Chapter/503604_1_En_4_Fig8_HTML.jpg](img/503604_1_En_4_Fig8_HTML.jpg)\n\
  \n**图 4-8**  \n色度计 GUI 及 OP505 探测器在 RGB LED 全 PWM 功率下的响应\n\n控制面板的使用本身并不涉及脚本编写。已编写并驱动操作的脚本，在按下\
  \ RGB 传输按钮时，期望接收三个数值。所有编辑框必须包含一个从 0 到 255 的数值。必须使用脚本页面和代码的自动启动功能（类似于图 4-9），以确保变量已被声明。\n\
  \n![../images/503604_1_En_4_Chapter/503604_1_En_4_Fig9_HTML.jpg](img/503604_1_En_4_Fig9_HTML.jpg)\n\
  \n**图 4-9**  \n声明所需变量的自动运行 DAQFactory 代码\n\n图 4-8 显示了标记为“RGB 传输”和“光源关闭”的按钮，这些按钮被配置为激活代码清单\
  \ 4-2a 和 4-2b 中的序列代码。\n\n代码清单 4-5 是 Arduino 的草图代码，用于接收并执行 DAQFactory 控制面板的串行传输。\n\
  \n### 观察\n\n如果不小心忽略了自动启动选项和声明代码，使用色度计时可能会出现一些奇怪的错误。\n\n图 4-8 描绘了 OP505 探测器对标称颜色以及输入到\
  \ GUI 的 RGB 编辑框中的全 PWM 功率级别的响应。如表格 4-2 所观察到，与 CdS 探测器对明亮 LED 颜色的响应相比，不同的颜色会对 OP505\
  \ 产生不同的响应。\n\n在图 4-10 中，使用 OP-505 光电晶体管探测器获得的 ADC 计数数据已与 Arduino PWM 标称值进行了对比绘制。\n\
  \n![../images/503604_1_En_4_Chapter/503604_1_En_4_Fig10_HTML.jpg](img/503604_1_En_4_Fig10_HTML.jpg)\n\
  \n**图 4-10**  \nOP505 光电晶体管在 RGB-PWM 功率级别下的响应\n\n\n\n## 讨论\n\n`Auto-Start`复选框的作用是，当`DAQFactory`程序创建\
  \ GUI 页面时，让短序列代码自动加载并运行。几乎所有包含变量的编程语言都必须在内存中预留空间来存放数值变量。通常，在编写程序、脚本或草图时，语言中会包含用于声明和可能初始化代码中符号变量的规定。在`DAQFactory`等\
  \ SCADA 软件中，数据的主要容器是存储带时间戳数值的通道。通道通过通道表来创建和激活。脚本页面的`Auto-Start`功能允许编写和运行代码序列，在控制屏幕组件的软件代码使用变量之前，声明并初始化这些变量。\n\
  \n硫化镉探测器具有广泛的电阻值范围，从受光时的数千欧姆到黑暗中的数千万欧姆不等。请回顾，如果将传感器配置为分压器以获得最佳性能，实验者应选择一个固定电阻值，该值应近似等于传感器在其工作范围中点处的电阻值。\n\
  \n使用 PWM 进行 LED 功率控制会导致光源设备产生的光出现一定程度的“闪烁”。由供电加热引起的局部温度波动以及 USB 总线上的电子噪声，都会增加信号传输中的噪声。\n\
  \n在所有定量光谱学方法和应用中，可重复性至关重要。为了在比较光测量中获得所需的可重复性，通常需要对 ADC 信号进行时间平均，以平滑电子干扰和杂散光干扰。时间平均会增加连续监测显示的响应时间。静态比色测量不会影响实验结果。\n\
  \n一张使用成比例 PWM 功率的粗略 RGB LED 颜色生成图已经发布，该图以十六进制表示了产生相应光所需的比例，如图 4-11 所示。\n\n![../images/503604_1_En_4_Chapter/503604_1_En_4_Fig11_HTML.jpg](img/503604_1_En_4_Fig11_HTML.jpg)\n\
  \n**图 4-11** 通过对各个 RGB LED 二极管施加 PWM 功率而产生的典型颜色（参见[`en.wikipedia.org/wiki/RGB_color_model`](https://en.wikipedia.org/wiki/RGB_color_model)）\n\
  \n颜色及其感知通常严格地用黑体辐射来表示，其中色温以开尔文为单位，对于可见光来说，通常在数千开尔文量级。颜色图表和 PWM 设置并非对最终颜色的严格定义，当从图表中选取相应的数值输入`DAQFactory`控制面板时，最终颜色便得以确定。RGB\
  \ 二极管中三个发光源各自发出的光的波长和强度都可能因器件而异。\n\n在比色比较的许多实验应用中，并不要求光源的光谱与待分析样品的完全匹配。一种黄色材料或溶液，可以在略有不同的黄色色调下使用比尔-朗伯定律来检测其颜色深度。通过在略有不同的黄色色调下，对不同样品厚度或浓度进行多次测量，只要光源发出的黄色的色调或色度不改变，就能获得准确的数据。光源与样品颜色之间的任何微小差异，都会通过差分比较技术而被抵消。\n\
  \n## 使用 Raspberry Pi 和 Arduino 实现光具座技术\n\n一个 Arduino-RPi 组合可用于搭建一个装置，该装置为 LED 光源和光电探测器组合供电，这些组件可以安装在一个简单的光具座上，既可以暴露在环境光照条件下（如图\
  \ 4-3 所示），也可以封装在一个不透明的外壳内（如图 4-12 至 4-17 所示）。\n\n一个由 RPi 托管的 Arduino IDE 可以为当前的实验工作提供图形或数值显示选项。反应动力学通常通过跟踪光活性化合物的衰变速率来研究。过去\
  \ 100 年间，在生物学、化学、地质学和医学领域，已经发表了大量描述定量比色分析方法的文献。\n\n市面上有可发射窄带可见光的 LED，其波长范围从可见光谱的深红色端一直到蓝色端。各个彩色\
  \ LED 可以作为定量吸收测量的光源，用于确定溶液中以及某些半透明固相中有色材料的相对含量。\n\n将 RPi 强大的计算能力和图形数据展示能力，与 Arduino\
  \ 微控制器的光源功率控制、数据采集、转换及数字信号处理能力相结合，可以构建一个廉价、简单且易于组装的比色分析系统。\n\n请回想一下，如果有色可见光的光束穿过颜色相同的溶液或固体时，一部分光子会被吸收，另一部分则会穿过。入射光强度与穿过吸收介质后的透射光强度之比，称为*透射率*。透射率与研究介质中吸收的光量之间通过以下关系式关联。\n\
  \n```\n透射率 = I[i] / I[t] 并且 吸光度 = – log(T) = – log( I[i] / I[t] )\n```\n或\n```\n\
  吸光度 = log 1/T -- (3)\n```\n\n`I[i]` 是入射到介质上的光强度。`I[t]` 是穿过待研究介质（即透射出的）的光强度。\n\n\
  吸光度常被称为光密度，可以看出，随着吸光度的增加，穿过有色介质的光量必然减少，这导致了吸光度与透射率之间的反比对数关系。\n\n透射率可以被测量，而吸光度则必须计算得出。比尔-朗伯定律将恒定光程下稀溶液的吸光度与浓度联系起来。如果吸光度和浓度成正比，那么针对一系列已知浓度测量得到的吸光度绘制出的图形应该是一条直线。对于严格的定量分析分光光度法，必须建立吸光度与浓度之间的线性校准关系。然而，半定量的比色分析可以使用能够测量光透射的简单基础设备来实现，只需在溶液浓度与透射光强度之间建立线性关系即可。\n\
  \n一个像本项目中开发的这样简单、基础的比色分光光度计，可以测量光穿过待测样品后照射到光电探测器上的光量。监控光电探测器的微处理器的 ADC 会产生一个数字值，该值与样品透射的光量成正比，如果已经建立了线性关系，那么这个值就可以与浓度相关联。\n\
  \n对于更高级的研究人员，可以对本项目中开发的仪器中的微处理器进行编程，使其计算并显示吸光度单位，以进行更严格、更定量的研究。\n\n\n\n## 实验\n\n\
  在使用光电晶体管作为光敏探测器的光学测量系统中，为获得真实的零读数，测量实验期间必须排除环境光或杂散光。应使用不透明外壳将容纳光源和探测器组件的光学实验台完全封闭。该外壳还必须能在光源与探测器之间的光路中放置吸收样品，并允许电信号进入被封闭的系统有源组件。\n\
  \n为光强度测量提供暗室环境，我们使用了一个带铰链盖的金属糖果罐，尺寸为 3½ × 11¼ × 2½ 英寸（86 × 276 × 61 毫米）（见图 4-12\
  \ 至 4-17）。一块 3/8 英寸（9 毫米）厚的胶合板被切割成与罐底紧密配合的尺寸。底板的中心线被标记出来，同时在中心线两侧各画一条相距 ½ 英寸（12\
  \ 毫米）的平行线。外侧的两排孔从底板底部钻入。这些孔经过沉孔和攻丝处理，以接纳 1 英寸 #6 平头机用螺钉（25 × 3 毫米），这些螺钉交替分布在右侧和左侧偏离中心线\
  \ ½ 英寸（12 毫米）的线上，间距为 ½ 英寸（见图 4-13）。当将底板装回避光盒后，底板上便有了两排孔，每排孔的间距均为 ½ 英寸（12 毫米）。这种交替定位孔位的技术使得对于定位在中心线上的组件而言，安装柱的孔位间距变为\
  \ ¼ 英寸（6 毫米）。\n\n注意图 4-12 中的以下内容。\n\n![../images/503604_1_En_4_Chapter/503604_1_En_4_Fig12_HTML.jpg](img/503604_1_En_4_Fig12_HTML.jpg)\n\
  \n*图 4-12* 比色计的内部组件\n\n*   标注 1 为 LED 光源（另见图 4-17），由一个双端子螺丝连接条组成，该连接条螺栓固定在一个直角支架上，能够接彩色二极管的阳极和阴极。\n\
  *   标注 2 为安装柱，位于中心线铰链对侧那排孔中的一个孔内，其上用一对六角螺母固定了一个直角支架，以确保光源组件的高度正确，并与探测器光电管保持共线性。\n\
  *   标注 3 为探测器光电管，安装在一个双螺丝端子连接条内，同样螺栓固定在一个直角支架上，以保持与光源的共线性。\n*   标注 4 为带螺纹的安装柱，位于中心线铰链侧的那排孔内，其上装有一个直角支架，可调节至所需高度，以保持光源-探测器的共线性。\n\
