  \n**图 9-81**  \n在 72 片 1¼ x 2¼英寸等腰三角形 `MPCLC` 上的 100 毫克至 10 毫克校准\n\n\n\n## 讨论\n\n\
  使用优化后的称重传感器原型与操作任何精密科学仪器类似，操作员需要熟悉系统的特性和小毛病。\n\n1.  不要将称盘抬升到高于分离铝丝挂钩与弹簧钢轭弯头所需的高度。\n\
  2.  缓慢移动升降杆，确保弹簧钢轭始终保持在平台通孔的中心位置。\n3.  小心放置和移除砝码/样品。如果压力板受到扰动，在重新悬起称盘进行质量测定前，请仔细重新对齐所有部件。\n\
  \n图 9-79 和图 9-80 中，微处理器用于连续测量电容的单个时间常数测量程序和 555 定时器占空比变化程序，在复现重量-电容相关性方面的能力似乎没有显著差异。我更喜欢`RC-TC`测量技术实现的简洁性。\n\
  \n使用头顶式传感器技术似乎有几个优点和缺点。每个传感器在调平、静止且无额外压缩载荷时具有固定的电容，该电容由板自身重量引起的自压缩决定。随着砝码堆叠到顶部，板间距离减小。理论上，设备灵敏度应在图\
  \ 9-2 所描绘的曲线中向左移动，或者随着板间距离减小而朝向灵敏度增加的方向移动。由传感器负载增加引起的板间距减小，同时会降低被压缩传感器的动态范围，因为随着板间距离减小，曲率会趋向垂直方向。\n\
  \n较重的砝码比较轻的质量更能压缩多层板堆叠，如果电容-板间距图的曲率没有过于接近垂直方向，则会导致电容产生更大的可测量变化。\n\n为了监测较重的砝码或力，相同的矩形板易于制造和安装，并且在与压力板配合使用时，在使用过程中不易受到机械干扰。传感器和质量的头顶式配置允许使用垂直升降装置，以最小化对传感器堆叠叶片的干扰。在重量变化过程中，压缩力垂直施加方式的变化会在设备每次进行测量时重置基线。\n\
  \n对于弯曲力较小的较轻质量，最好使用由锥形、左侧和右侧带凸片的板组成的更薄、更灵敏的传感器进行监测。异形叶片更难制造和安装，但对于灵敏度更高、厚度更薄的堆叠来说，所需的叶片数量更少。\n\
  \n在图 9-82 中，微处理器的连续电容监测软件会根据输入信号值的改变，自动从测量纳法切换到皮法。从纳法切换到皮法需要重新配置`DAQFactory`显示界面。\n\
  \n我们曾尝试使用杠杆进行实验以增加灵敏度，但只取得了有限的成功。在传感器位于支点下方的正常杠杆配置中，杠杆的重量会压缩`MPCLC`，从而需要更厚的传感器。关于反转杠杆和传感器的初步实验表明，当静止时，传感器在重力作用下伸展，当重量施加到传感器长臂上时被压缩，但该设置的复杂性未被进一步发展，因为我更喜欢图\
  \ 9-75 和图 9-76 中所示的那种更灵敏、更薄的传感器。\n\n图 9-34A 和图 9-75 显示，具有更高灵敏度的 10 板锥形传感器已被切去板尖，以形成\
  \ 2 英寸（49 毫米）的均匀板长。去除单个板上弯曲和变形的尖端点，应能使它们彼此平放，从而在传感器使用过程中弯曲时产生更平滑、更可重复的弯曲动作。\n\n\
  图 9-34 中 72 板传感器的尖端在各个方向上弯曲，并在水平和垂直方向上散布超过八分之一英寸或几毫米，因此当尖端弯曲时，设备的灵敏尖端区域无法平滑地相互滑动。更多的板数产生了\
  \ 14 至 15 nF 范围内的电容，这可能掩盖了传感器尖端部分在压缩较厚板部分时的粗糙行为。\n\n在图 9-81 中，72 板设备的噪声水平约为 0.05\
  \ nF 或 50 pF。在图 9-81 中修剪过的 10 板设备中，噪声水平约为 1 pF。\n\n表 9-8 表明，使用 10 板三角形设备，对 10 mg\
  \ 质量的多次重复称重测定记录到 7 pF 的响应。对于此质量范围内的重量测定，可以通过开发程序以及`SCADA`软件的`DSP`和显示标尺扩展，来优化载荷传感器的面积、形状和厚度。可能需要开发传感器和软件优化方法，以处理和操作非常少量的材料。\n\
  \n用于优化电容式测力传感器灵敏度的实验开发程序仅受限于你可用的时间，因为测力传感器所用材料的成本很低。\n\n## 代码清单\n\n```\n// 按照发送顺序解析来自串行端口的多个值。\n\
