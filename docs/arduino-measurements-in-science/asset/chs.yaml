  要测量超过使用 `U3-HV` 提供的 `+5 V` 电源（见图 3-24 和 3-26）所施加的 `300°C` 限制的温度，必须使用如图 3-25 所示的双极性非对称电源。可以使用三个
  `9 V` 电池，方法是将一对串联电池的负极引线连接到第三个 `9 V` 电池的正极引线上。这样，公共的正-负连接就建立了比“地”或公共点高 `+18 V` 的电位，以及比地低
