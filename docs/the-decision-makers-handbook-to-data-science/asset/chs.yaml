- "# 9. 问题解决\n\n在本章中，我们将从决策者的角度来探讨如何解决问题，因为这是本书的核心内容。因此，我们不会关注数据科学家如何解决问题，而是你将如何与数据科学家协作解决问题。\n\
  \n没有人期望领域专家——也就是你——具备使用数据科学的资质。然而，你在解决问题时需要能够像数据科学家一样思考，因为这将帮助你更好地定义问题，也更容易找到合适的人选并管理他们。\n\
  \n你需要能够提出问题，并且如前所述，一个非常有效的方法是将问题转化为提问。你还需要了解解决这个问题是否有价值。任何事情都需要时间和金钱，因此你需要了解问题解决的结果是否适用于你的业务。最后，你需要了解应该聘请谁来帮助你，以及是否需要不止一个人。\n\
  \n## 理解问题是否可解\n\n要判断某个问题是否可解，首先你需要意识到所有可能出错的地方。根据我的经验，我发现企业在使用数据科学时主要面临两个问题。\n\n\
  首先，他们往往抱有错误的期望，导致实际解决方案要么比他们想象的要简单得多，要么要困难得多。其次，他们没有合适的数据。\n\n数据科学家可以帮助你了解问题是否可解、解决问题的难易程度，以及需要多少时间和资源。\n\
  \n因此，你需要做的是找到合适的人选——最好是你信任的人——并与他们一起工作。\n\n你绝对不应该在没有咨询数据科学家的情况下凭空假设！许多问题的出现都是因为人们做出了错误的假设，尤其是在技术问题上，例如项目的复杂性或涉及的时间框架。如果你对某事不确定——即使你确定——最好还是问清楚，而不是去做假设。\n\
  \n## 快速启发式判断\n\n现在我们来看几个启发式方法，帮助你判断数据科学是否可以应用于特定问题。\n\n首先，你需要确定问题是否可以表述为：\n\n- \
  \  一个统计建模问题\n-   一个假设检验\n-   一个监督学习问题\n-   一个无监督学习问题\n\n让我们看几个例子。\n\n### 统计建模问题\n\
  \n当你试图确定变量`X`对变量`Y`是否重要，以及两者之间的关系时，应该使用统计建模。统计模型可以告诉你哪些因素是显著的，以及影响的方向是什么。\n\n例如，你可能注意到年纪较大的人似乎更喜欢你的产品。因此，你可能想确定年龄是否在购买决策中起作用。在这种情况下，你需要聘请一位统计学家，因为你将使用统计建模。\n\
  \n如前所述，统计学的重点在于透明性。当你关心理解变量之间的关系时，你可能倾向于使用统计学。\n\n### 假设检验\n\n当你想要比较两组数据时，假设检验就是你想要采用的方法。如果你想弄清楚`X`和`Y`是否有差异，就可以使用它。一个例子是`A/B\
  \ 测试`。\n\n假设你想为你的产品推出一个新功能，但不确定这是否是个好主意。你所要做的就是创建两个不同的组，并将它们相互比较。\n\n同样，你可能想要比较两个已有的组。例如，你可能想研究性别的影响，而不考虑具体背景。你可能想看看性别是否对销售有影响，那么你可以创建两个组，每组一个性别，然后进行比较。\n\
  \n假设检验与统计建模密切相关，有时同一个问题可以通过不同的假设检验或模型来回答。无论是这种情况还是前一种情况，你都知道需要一位具备统计学技能的数据科学家。\n\
  \n\n\n### 监督学习\n\n这种方法稍微复杂一些。我们之前已经提到过两种场景，即分类和回归，这些显然都是可以使用监督学习的情况。你有一个数据集，并且希望利用某些输入变量来预测一个结果变量\
  \ `Y`。\n\n一个很好的经验法则是：在任何你想要自动化人类所做的事情的场景中，你都可以使用监督学习。如果有人坐在那里检测垃圾邮件或标注图像，并且你有一个数据集，你可以将这些数据连同人类的示例一起输入给机器，机器将尝试模仿人类的决策过程。\n\
  \n此外，当你想要预测未来的值时，监督学习也是一个很好的选择，这也就是预测分析——例如预测某人未来破产的风险（即他们的信用评分）、未来产品的需求，或股票的价格。\n\
  \n请注意，监督学习算法通常不太擅长解释它们是如何得出决策的。机器学习的效果很好，但它主要是一个黑盒。因此，如果你的首要任务是理解数据，你可能还需要进行探索性数据分析或创建一些统计模型，例如线性回归或逻辑回归。\n\
  \n### 无监督学习\n\n无监督学习在相当多的场景中都很有用。首先，最显而易见的是，当你知道数据中存在分组时，无监督学习非常有用。例如，客户细分就是这样一个场景。\n\
  \n降维是另一个用例。如果你有一个包含大量变量的非常复杂的数据集，并且不确定该如何处理它，那么转向降维技术，例如因子分析，是一个好主意。\n\n除了无监督学习可以帮助你更好地理解数据之外，无监督学习的输出结果还可以用作监督模型的输入，以提高其性能。\n\
  \n## 更多经验法则\n\n因此，如果你有需要分类的图像和音频，那么你应该转向深度学习。后者已经发展到相当程度上的商品化，像谷歌和 IBM 这样的科技巨头都提供深度学习即服务。\n\
  \n如果你经营的是 B2C 业务，你就需要研究推荐系统和购物篮分析。推荐系统已经成为消费者的标配。\n\n购物篮分析（或称关联规则挖掘）代表了一组算法，它们试图识别频繁出现的模式，以发现用户特征与其行为之间的关联。这些模式的形态是：如果有人购买了\
  \ `X`，那么他们很可能会购买 `Y`。\n\n如果你想开发一个聊天机器人，市面上有一些平台可以帮助你做到这一点，例如 `Dialogflow`。^(⁷¹)\
  \ 需要指出的是，尽管聊天机器人已经取得了长足的进步，但它们并没有许多人声称的那么先进。它们确实融入了一些智能和机器学习技术，但仍有很长的路要走。不过，构建它们并不困难。\n\
  \n最后，有时你需要预测一个时间序列的未来值。时间序列预测本身就是一个专门的领域。统计学中有一个子领域专门处理这类问题，但人们也会转向机器学习来回答这类问题。因此，在实践中，你可能需要融合两种方法。由于预测非常具有挑战性，而且有很多可能出错的方式，我通常建议人们尝试看看是否可以将其作为分类或回归问题来处理。\n\
  \n## 当经验法则失效时\n\n上述经验法则并非每次都有效。然而，当它们失效时，通常是由于以下原因之一。\n\n### 模糊的项目计划\n\n如果你的项目计划模糊不清或过于宏大离谱，经验法则就会失效。你经常会听到人们说他们想要构建一个能够评估商业计划并预测未来十年的人工智能，或者他们希望自己的人工智能能够预测一切。\n\
  \n显然，他们是《星际迷航》看多了，忘记了技术还没有那么先进。它当然不是能够解决任何问题的灵丹妙药，对于机器学习和人工智能也是如此。\n\n因此，制定一个重点明确、范围更窄的计划会有效得多，这在交付成果方面也更易于管理和更切合实际。\n\
  \n### 用天网去拍苍蝇\n\n另一个问题是，当你试图开发一个人工智能来消灭一只苍蝇，而它却决定动用全世界的核武库——这也被称为试图使用超级先进的机器学习来完成人类可以轻松做到的事情。\n\
  \n例如，你可能想创建一个能够理解对话并为你预约的聊天机器人。这是一个很棒的主意，但你必须考虑开发和部署它所需要的时间和资源，以及最终结果是否真的是人们会使用的东西。当然，你仍然可以继续，但你需要意识到开发这类软件所涉及的困难。\n\
  \n另一个相当复杂的想法是尝试自动化数据收集。在不同环境下尝试自动化数据收集是有意义的，但在大多数情况下，花点钱通过众包来解决会更有效。\n\n我见过不少初创公司失败，因为虽然它们的想法显然很有价值，但时间和金钱上的开发成本对于一家新成立的公司来说过于巨大。而且，它们试图解决的问题，即使成本稍高，也可以被人类更轻松地解决。\n\
  \n### 缺乏合适的数据\n\n另一个常见的问题是，企业在没有合适的数据或数据质量很差的情况下，就试图雇佣数据科学家。然后，数据科学家花费大量时间试图整理数据，而不是真正地朝着解决方案努力。\n\
  \n## 其他考虑因素\n\n你还需要考虑其他一些事情，即数据质量、数据变量数量方面的量以及数据规模。\n\n数据在很多情况下都可能出问题。例如，你可能样本量非常小，或者数据质量很差，或者你没有正确的变量。\n\
  \n有人曾让我检查他们求职平台上性别与薪酬之间的差异。不幸的是，性别是他们没有收集的变量，所以我们只能利用名字和姓氏来处理。解决方案是尝试从一个人的名字中猜测性别，但\
  \ 30% 的名字是中性的，所以我们不得不放弃这些数据。\n\n他们的方法完全没有意义。如果他们知道自己对性别差异感兴趣，为什么不直接询问人们的性别呢？这毫无道理，简直荒谬至极。\n\
  \n你绝对不想采取同样的方法。因此，请尽量遵循我们在第 2 章中讨论的原则，并在开始收集数据之前就思考你将如何使用这些数据。*不做计划就等于计划失败*。这就是为什么从一开始就拥有数据战略是件好事。^(⁷²)\n\
  \n\n\n## 你真正需要解决的是什么问题？\n\n有时候，你以为正在解决的问题，其实并不是真正需要解决的那个。比方说，你想预测比特币的价格来获利。这是一个非常困难的问题——我在这方面做过很多工作，所以很清楚。\n\
  \n然而，如果你的目标是从比特币中获利，这实际上是另一个问题。也许你感兴趣的是价格是在上涨还是下跌。或者，你可能想用强化学习来创建一个算法交易机器人，替你完成这项任务。\n\
  \n关键在于，你实际试图解决的问题会直接影响你模型的最终成功率！优秀的数据科学家知道如何明智地选择“战场”，从而最大化成功的机会。我们之前看到一个例子，数据采集的考量与商业计划相互作用。这里的情况也是一样的。\n\
  \n务必确保与数据科学家讨论这些问题。我见过数月的努力付诸东流，因为客户说他们需要做一件事（例如，回归分析），但实际情况是，如果数据科学家尝试解决一个不同的问题（例如，将回归问题转化为一个三类分类问题），问题本可以更容易地解决。\n\
  \n**示例：通往顶峰的路有千万条**\n\n有句谚语说：“通往山顶的路有千万条，但山顶的风景始终如一。”这句话在数据科学领域再正确不过了。正如本章所阐释的，有时一个问题根本就不是问题。企业混淆“想要”与“需要”的情况并不少见。\n\
  \n我曾有一位客户，问我是否知道如何编写循环神经网络的代码。我回答知道，但我很好奇他为何对这个技术如此执着。后来发现，他是想进行图像识别。关于图像识别和深度学习，首先，你极有可能用到的是卷积神经网络。其次，有许多由谷歌等大公司和研究机构发布的现成架构，直接使用其中一种或许更好。\n\
  \n最后，他做图像识别的目的是为了将其用于一个推荐系统。而事实是，对于这个特定的用例，他完全可以要求用户为图片提供标签。因此，图像识别并非该问题的关键部分，真正的问题在于向用户推荐与他们过去喜欢的物品属性相似的其他物品。\n\
  \n在尚未掌握全部事实的情况下过于具体，只会造成混乱。还有其他类似的情况。我之前已经举过金融领域的例子，另一个例子与医疗应用有关。\n\n假设你对运动损伤感兴趣，并希望预测运动员何时会受伤。有几种不同的方法可以处理这个问题：\n\
  \n*   **回归分析**——预测一名运动员能坚持多少天才受伤？\n*   **分类**——将时间划分为三或四个类别（例如，1 周、1 个月等），并将其作为分类问题来处理。\n\
  *   **生存模型**——类似于回归分析，但在此情况下会使用不同的模型和假设。\n\n这些模型的性能各不相同，并且它们可能以不同方式与你面临的问题相互作用。例如，分类方法的分辨率最差（在这种情况下，一周可能是一个很长的时间间隔），但问题更容易解决。生存模型比回归分析更适合这种情况，并且其背后的假设更为合理，但可供选择的生存模型数量远少于回归模型。\n\
  \n一如既往，天下没有免费的午餐。每一个选择都伴随着权衡，这就是为什么数据科学家必须清楚，模型的输出结果如何能被用于解决实际问题。\n\n## 10. 常见陷阱\n\
  \n现在，我们将探讨数据科学过程中一些常见的陷阱。我们会回顾当数据科学家试图解决问题时，可能出现偏差的一些情况。我们从“不该做什么”开始。\n\n## 不该做什么\n\
  \n首先，你不应该尝试独自解决问题。你可能会忍不住直接告诉数据科学家你想要的解决方案是什么，但这并非正确的做法，稍后你会明白原因。\n\n你的任务是去发现问题的本质，对其进行表述，并遵循本书前面提到的原则向数据科学家解释清楚。然后，你需要放手，将问题委派出去。\n\
  \n这在你看来可能微不足道，但其发生频率远比你想象的要高。现在，让我们看一个例子，来理解为什么这会是如此大的一个问题。\n\n\n\n## 示例：糟糕的合作\n\
  \n假设你有一款健康科技领域的应用，并希望当用户采取某些积极行动时给予奖励。但同时，你也想探究该应用是否对用户行为有真正的长期影响，以及这种影响具体是怎样的。那么，你可能会问：如果用户安装了应用，他们是否会持续增加运动量，还是最终会恢复到正常的运动水平？\n\
  \n看待这个问题有几种不同的方式。我们拥有许多可用变量，例如“之前”和“之后”的活动水平，以及一些其他因素，比如人口统计数据。你可以进行假设检验，也可以应用统计模型。在尝试解决这个问题时，两种方案都是可行的。\n\
  \n然而，经过仔细审视后，我们会意识到统计模型是更好的解决方案，因为我们拥有不同类型的变量，而且它能提供比假设检验更高的灵活性。此外，在数据收集时，并没有设置对照组，这意味着假设检验可能存在一定偏差。\n\
  \n于是，我们运行一个模型，并将应用的安装情况作为一个变量¹。我们要判断这个变量是否具有统计显著性，或者是否具有正的系数，这能表明应用安装后活动水平有所提高。\n\
  \n模型可能像这样：\n\n```\nActivityLevels = AppInstallation + DemographicFactor1 + DemographicFactor2\
  \ +...+ DemographicFactorN\n```\n\n我们发现变量`AppInstallation`具有正的系数且 p 值显著，这意味着它具有积极影响。\n\
  \n然而，这时我们就开始遇到各种问题了。第一个问题是客户不理解这个模型。他们不熟悉各种术语和概念，而且也没有准备去学习这些概念。\n\n问题是，他们之后需要基于这项研究来筹集资金，但他们却不知道如何向投资者解释清楚情况。\n\
  \n此时，情况开始变得糟糕，因为客户开始提出各种建议，实际上是在试图代替数据科学家解决问题。\n\n他们可能会建议一些已经在模型中考虑过的内容。\n\n例如，他们可能会建议也把其他因素纳入考虑，但模型已经考虑了数据中所有可用的因素。\n\
  \n然后，他们可能会建议测量相对于基线的百分比差异，但这正是模型在隐式完成的工作。\n\n好吧，他们又说。接着，他们想出了一个更绝妙的主意：我们来测量我们的应用对用户的精确影响。而这恰恰是模型中的系数所做的事情。\n\
  \n最后，他们可能建议使用图表，因为这样更容易理解——而且图表看起来总是很性感——尽管它什么也证明不了。\n\n于是，我们创建了图表，看起来就像图 9-1 所示。\n\
  \n![](img/490014_3_En_10_Fig1_HTML.jpg)\n\n一张活动量随时间变化的折线图。线条有多个明显的波动，最低点约为(55, 90)，最高点约为(145,\
  \ 150)。所有数值均为近似值。\n\n图 9-1  \n假设性应用的图表\n\n问题是这张图表并没有告诉我们多少信息。\n\n统计模型的设计就是为了考虑不同的因素。而在我们这个问题的情形中，有多个因素在相互影响。因此，当你创建图表时，效果并不总是清晰可见，因为它被其他因素所淹没了。\n\
  \n这就是进行显著性检验不失为一个好主意的原因，因为它能就当前情况给出一个确定的答案。\n\n然而，客户要么不理解进行显著性检验的必要性，要么就是根本不愿意投入精力。就在这时，我们开始陷入无休止的循环。客户继续提出类似的建议，并试图推动科学家为这个问题开发解决方案，但他们的建议在方法论上站不住脚。\n\
  \n这确实是一个糟糕的局面。首先，你有一个拒绝理解工作以有效呈现结果的客户，结果，这迫使数据科学家产出了在科学上并不严谨的工作。\n\n最有效的解决方案是将问题分解成两部分。第一部分是制作一份包含一些图表的演示文稿，客户可以用它向投资者解释情况。这可能不完全准确，但对于筹集资金可能有用。\n\
  \n接着，第二部分是创建一个方法论上严谨的模型，可以供内部使用，即使客户并不真正理解它。这未必是件坏事。虽然客户可能难以理解这个模型，但它仍然可以用于决策过程，以改进应用的某些方面。\n\
  \n这样会让每个人都满意，因为客户有了性感闪亮的东西向投资者展示，让他们看到想看到的内容；但与此同时，他们也有了一个科学上严谨的统计模型，可以作为业务决策的基础。\n\
  \n那么，这种情况下问题出在哪里呢？主要问题是客户试图通过提出各种不同的建议来取代数据科学家——实际上是在做部分数据科学家的工作。他不信任数据科学家能做好自己的工作，但同时又不懂统计检验是如何工作的，也不知道如何评估科学家的工作。\n\
  \n这些问题又因客户不愿学习任何关于模型的知识而变得更加严重，导致了一个尴尬的局面，每个人都浪费了大量时间试图确定最佳的工作方式。\n\n当然，最好的方法本来是信任数据科学家，而不是这样来回反复。真正的问题是，这一切的根源在于业务方从一开始就没有制定数据策略。\n\
  \n如果当初研究设计得当，数据本可以更有效地收集，这也将确保数据科学家拥有正确的信息来开展工作。最终的结果也会更容易被所有人理解，包括投资者。\n\n大多数与数据相关的问题都源于缺乏适当的规划。请以此为鉴，始终尽可能提前做好规划。\n\
  \n\n\n## 真正的问题\n\n数据科学可能非常复杂，并非所有人都能理解。然而，如果你试图构建人人都能理解的东西，那么你就将工作降低到了最低共同标准。最终的结果可能就像反疫苗运动那样。\n\
  \n想象一下，如果所有正在进行的医药研究都以一种人人都能理解的方式进行，会发生什么？由于信息的复杂性，这根本不可能实现。这就像把航天飞机的“钥匙”交给一个连飞机乘客都没当过的人。那架航天飞机最好的情况是哪里也去不了，最糟的情况则是在某人面前爆炸。\n\
  \n你需要专家来验证研究、理解其内容并进行审查。就像你需要经过训练的航天飞机飞行员才能让航天飞机升空一样。\n\n显然，在商业环境中，你不能期望决策者、创始人或部门主管成为数据科学专家。因此，在确保科学可靠性（以确保基于模型的决策是合理的）与打造易于解释的模型之间找到平衡至关重要。\n\
  \n然而，如前所述，如果企业从一开始就没有遵循正确的原则（例如没有制定正确的数据策略等），问题会变得更糟。另一个问题是缺乏数据科学教育，而这正是本书试图帮助解决的。\n\
  \n如果有人接受了关于数据科学流程的适当教育，哪怕只是从高维度视角了解，他们在处理模型、解读结果以及根据结果采取行动时也会更得心应手。因此，无知是件可怕的事情，尤其是在涉及人工智能和机器学习时。\n\
  \n## 解决方案是什么？\n\n尽管商业世界不一定总是数据驱动或科学驱动的，但你显然能看到数据驱动和科学驱动决策的价值，这也是你正在阅读本书的原因。\n\n\
  那么，我们该如何解决这个问题呢？首先，你不能期望每个人或每个组织都实现数据驱动，但你可以采取一些措施来最小化问题发生的可能性。\n\n当然，首要且最重要的事情是，从一开始就制定正确的数据策略。不过，你还可以做的另一件事是，确保雇佣合适的人选并信任他们。这并非总能实现，但请尽力而为。\n\
  \n此外，不要过度使用大量模型来发挥“创造力”，也不要试图指导数据科学家去做特定的事情，而是放手让他们工作。\n\n数据科学与商业的互动非常频繁，我经常看到有人因为不理解数据科学是如何被应用的而感到不安，并试图指导数据科学家去做各种事情。如果你雇佣一个信任的人并让他们各司其职，反而会节省更多金钱和时间。\n\
  \n在开始收集数据之前，你还必须考虑研究方案。考虑在数据收集开始之前就雇佣相关人员，因为他们可以解释事情应该如何进行。这样，他们就可以向你展示研究应该如何开展，从而让每个人都清楚发生了什么、如何收集数据以及数据是否能够被收集到，同时让你在理解研究并向他人展示时感到安心。\n\
  \n如前所述，在上述例子中，如果假设检验能够更容易地进行，那么大部分问题本可以得到解决。所以，不要像那些人一样，而是做一个提前思考所有可能问题的人。\n\n###\
  \ 因果推断\n\n前面提到的模型属于因果推断的范畴。因果关系是一个非常古老的问题，但在过去几年里开始变得越来越热门。**朱迪亚·珀尔**，历史上最重要的计算机科学家之一、贝叶斯网络的创建者、图灵奖（计算机界的诺贝尔奖）得主，曾呼吁一场“因果革命”。\n\
  \n根据朱迪亚·珀尔的观点，存在三个分析层次，他称之为“因果阶梯的层级”。\n\n在第一层级，我们研究关联。我们可以提出诸如“如果我观察到某个症状，这会如何改变我对某种疾病的看法？”之类的问题。\n\
  \n在第二层级，我们研究干预。例如，我们可以提出“如果我服用阿司匹林，我的头痛会痊愈吗？”这样的问题。\n\n在第三层级，我们研究反事实。我们可以提出“如果我去另一个城市上大学，我的人生会怎样？”这样的问题。\n\
  \n朱迪亚·珀尔认为，真正的智慧在于因果关系的第三层级，而人类之所以能在地球上如此成功，原因之一就是我们具备了这种思考能力。他说，尽管深度学习对许多问题来说是一种非常成功的方法，但它本质上不过是曲线拟合，基本上停留在因果关系的第一个层级。珀尔认为，除非我们能够构建出像人类一样能思考到因果关系第三层级的算法，否则真正的\
  \ AI 永远无法实现。\n\n朱迪亚·珀尔的观点既引发了批评，也激发了热情。可以肯定的是，因果关系这一话题开始受到越来越多的关注，并且它与一些最重要的问题密切相关，例如健康结果和政策干预。微软也发布了一个用于因果推断的开源库，名为\
  \ `DoWhy`，因此，我们可以肯定在未来几年内会看到越来越多的研究和软件库涌现。\n\n"
- '# 11. 雇佣与管理数据科学家


  我们已经讨论了为什么你应该雇佣数据科学家，以及它将为你的业务带来的诸多好处。我们还探讨了让他们各司其职而不试图指导他们工作的重要性。但要做到这一点，你需要雇佣一个你信任的人。


  在本章中，我们将具体探讨如何雇佣和管理数据科学家以获得最佳效果。首先，让我们试着更好地理解数据科学家。


  ## 走进数据科学家的内心


  一个称职的数据科学家需要具备广博的知识和多样的技能，但某些技能比其他技能更为重要。


  如图 11-1 所示，数据科学家需要具备黑客技能、数学与统计学知识以及领域专长。虽然每一项技能单独来看都极具价值，但如果他们只拥有其中两项，那他们就不是数据科学家——而且在某一种特定情况下，这实际上可能导致问题。


  ![](img/490014_3_En_11_Fig1_HTML.jpg)


  黑客技能、数学与统计学以及领域知识相交于数据科学的维恩图。黑客技能与数学和统计学相交于机器学习。数学与统计学和领域知识相交于传统研究。黑客技能与领域知识相交于危险区域。


  图 11-1 数据科学维恩图




  ### 代码黑客技能


  好吧，当我提到代码黑客技能时，我不是在说入侵 NASA，而是指数据科学家需要拥有出色的计算机知识和扎实的编程技能。这并不意味着他们需要计算机科学学位，因为有很多优秀的“黑客”一生从未上过任何计算机课程。


  然而，数据科学家必须能够以算法的方式思考、理解向量化操作，并在命令行中处理文本文件。没有这些技能，就不可能成为一名数据科学家。大多数情况下，数据科学家产出的代码实际质量不需要达到生产级水平。这就是为什么我们使用“代码黑客”这个术语，而不是“软件工程”，因为后者意味着代码应达到非常高的标准。数据科学家将代码作为解决问题的工具。不过，如果你能找到一位同时拥有出色编码技能的数据科学家，那自然也无妨。


  ### 数学与统计学知识


  一旦利用那些黑客技能将数据整理成型，就该进行分析并提取洞察了。为此，数据科学家需要具备数学和统计学知识，以便应用正确的方法和模型。


  同样，数据科学家不需要拥有统计学博士学位也能高效工作，但他们必须知道如何开发和使用数学与统计模型，包括如何解读结果。


  ### 领域知识


  领域知识对数据科学家来说很重要：他们需要理解主题本身，而不仅仅是其技术层面。虽然这不是硬性要求，但缺乏领域知识可能会引发各种问题（我们已经看到过一些例子，后续还会有更多）。领域专业知识使数据科学家能够将其他技能应用到数据上，从而实现预期目标。每当你转向解决一个从未接触过的领域中的问题时，数据科学家都必须自学该领域的特性。


  ### 仅有两项技能并不足够


  只拥有这三项技能/知识中的两项是不够的。一个精通数学和统计学但没有实质专业知识的熟练黑客，可能非常适合机器学习。然而，他们的技能并不能让他们成为数据科学家。


  同样，如果有人拥有实质性专业知识并懂数学和统计学，那么他们可能更偏向于传统研究。这种交叉领域基本上构成了学术界的大部分——不过应该注意的是，年轻的研究人员正在选择不断发展并学习更多技术。然而，没有那些黑客技能，他们永远成不了数据科学家。


  真正的问题出现在当某人既是熟练的黑客又拥有实质性专业知识时。这会创造出一个危险人物，因为他们知道得足够多，足以做出看似合理的分析，但却完全不清楚自己是如何得出结论的，或者自己到底创造了什么。


  从根本上说，这类人具备对某个问题应用分析技能的能力，但缺乏确保自己行为正确的理论基础。因此，他们可能会运行一个统计测试，却做出错误的假设。然而，由于他们相信自己是在基于数据做决策，便会产生一种虚假的自信心，这可能导致严重问题。


  所以，请记住，一个称职的数据科学家将是一位熟练的黑客，具备数学和统计学知识，并且在你选择的领域拥有实质性专业知识。


  ## 数据科学家的动力是什么？


  与某人高效合作意味着要了解他们是什么样的人以及他们的动力来源。不幸的是，人们往往难以理解数据科学家，正是因为他们的技能范围如此广泛，以至于无法被整齐地归入某个框框。


  数据科学家不仅仅是懂数学和统计学、能像专业人士一样操作电脑的人。他们还要具备出色的沟通和可视化技能，能够与高层管理人员有效沟通，并能生动地讲述故事。他们还对业务充满热情，对数据充满好奇。他们不断渴望学习更多，希望解决问题并产生影响，即便没有通常伴随这一角色的权威。他们是具有战略眼光、积极主动、富有创造力和创新精神的人，喜欢与他人合作。


  他们绝对热爱脑力激荡，解决问题就是他们的看家本领。他们天生具有好奇心和成长的驱动力，这意味着他们喜欢学习新事物和获取新技能。


  事实上，学习新技能是当今市场不可或缺的组成部分。这就是“红皇后假说”在现实中的体现，其核心观点是：一个有机体必须不断适应、进化和繁衍，仅仅是为了生存。


  ## 什么会让数据科学家失去工作热情？


  如果你让数据科学家做大量重复性的工作，你最终会得到一个极度缺乏工作热情的人。因此，如果他们不得不花费大量时间清理数据或做任何等同于数沙子的工作，那么你将面对一个根本不想待在这里的人。工作成果也会因此受到影响。


  同样，如果因为你要他们解决的问题过于简单而让他们感到无聊，你也讨不到任何好处。当然，有时候简单问题也需要解决，但如果你决定迈出这一步并雇佣一位数据科学家，请确保充分利用他们的能力。否则，这就像雇佣一位米其林星级大厨只为给你做一个烤芝士三明治。


  危险在于，这位大厨会因为无聊而偏离主题，给你端上一个经过解构和重构、与你想吃的那个简单三明治几乎毫无共同之处的烤芝士三明治。


  此外，另一个问题源于沟通不畅。当高层管理人员不理解数据科学家在做什么时，沟通中的摩擦往往就会出现。


  一个简单的例子是，数据科学家最终做了大量极其枯燥的数据整理工作，而这仅仅是因为与开发人员就数据应该如何存储的问题沟通不畅。


  再回到我们米其林星级大厨的类比，赫斯顿·布卢门撒尔是一位世界知名厨师，他的“招牌”是分子料理。他使用一系列在厨房中并不常见的工具和食材。假设你雇佣他为一场活动提供餐饮服务，他告诉你他需要什么，但因为你不理解他的流程，你只在厨房里备齐了所有常规工具和食材。


  当他到达准备烹饪时，他最终不得不制作一顿对他来说完全乏味的传统餐食，结果做出的食物可能还算可以，但远达不到他本应能做出的水准。


  ## 当数据科学家找工作时


  目前，对于初级以上的优秀数据科学家来说，这是一个卖方市场，数据科学家是卖方——你知道的，因为他们出售自己的技能和专业知识。事实是，对技能娴熟人才的需求很高，但供给远不能满足需求。


  例如，伦敦的一位普通数据科学家每周会收到一到十份招聘人员的信息或电话。这意味着他们在选择参与什么项目时处于主导地位。


  因此，为了提高雇佣到合适人选的几率，你需要了解数据科学家想要什么。




  ### 数据科学家想要什么？


  首要之事当然是薪酬。毕竟，数据科学家也是人——尽管他们的技能组合和稀缺性有时让他们看起来像神话中的神兽——他们不仅需要钱来生活，也希望自己的价值得到适当的回报。


  然而，仅仅提供一份令人瞠目的高薪是不够的，因为其他因素也很重要，比如他们将与之合作的团队、将要解决的问题、使用的技术栈，以及与学术界的关系。


  #### 团队


  一些数据科学家更愿意在团队中与自己喜欢的人共事。这通常意味着更极客、不那么正式的文化，甚至是在家办公。


  当然，这不一定适用于每家公司，因为你不可能为了招聘一位数据科学家而在一夜之间彻底改变整个企业文化，但你可以尽量做出让步，以改善工作关系。


  #### 问题


  虽然我们已经讨论过交给数据科学家过于简单的问题的风险，但你还会发现，许多数据科学家对特定类型的问题有偏好。例如，有些人可能更喜欢处理具有社会影响力的问题，而另一些人则可能专注于像医学这样他们喜欢的领域。


  其他时候，他们可能对问题本身有偏好。例如，有些人更喜欢处理文本数据。


  不过，你通常会看到，这与做和学习新事物紧密相关，而这正是定义数据科学家的特质。


  #### 技术栈


  所使用的技术也扮演着重要角色。一些数据科学家会更喜欢使用他们已熟悉的技术栈，而另一些人则想学习新东西。然而，你会发现大多数数据科学家会像避开瘟疫一样避开旧技术和遗留代码。


  有时，学习新技术对数据科学家来说极为重要。这可能是因为一些新兴技术正在主导领域，比如`Python`，而他们可能想要从`MATLAB`过渡到`Python`和`R`。


  或者，数据科学家可能想扩展自己的技能组合，因为某些技术（比如与深度学习相关的技术）能带来更好的薪酬，也更有趣。


  #### 与学术界的关系


  许多数据科学家出身于学术界，习惯于阅读/撰写论文和参加学术会议。这对所有人来说都是一个优势，因为参加会议可能是保持他们在领域前沿的重要一环。因此，激励数据科学家的一种方式就是提供会议津贴。


  而且，正如我所说，这对你也有好处，因为你的数据科学家会了解到数据科学领域新兴的发展动态，他们会了解到之前未曾涉足的领域或应用，并会与他们领域内的其他人交流。


  你可以预期一位博士级别的数据科学家希望参加的一些数据科学会议包括：


  - `ICML`：国际机器学习大会

  - `NeurIPS`：神经信息处理系统大会

  - `SIGKDD`：ACM SIGKDD 国际知识发现与数据挖掘会议

  - `ECML PKDD`：欧洲机器学习与数据库知识发现会议

  - `AI Stats`


  ### 避免传统限制


  招聘数据科学家时一个常见的问题是，雇主常常采取与招聘企业内其他职位相同的方法。这通常涉及询问对方是否有特定领域的经验。


  然而，许多数据科学家（包括我自己）会特意寻找他们以前没有涉足过的领域。这完全是出于学习新事物和避免无聊的动力，因为你没做过的事情肯定比你有经验的事情更有趣。


  作为潜在雇主，你需要理解的关键点是，数据科学家所使用的技术具有普遍适用性，而领域本身是次要的。换句话说，不要因为一位优秀的数据科学家没有你特定领域的经验就错过他们。


  ### 数据科学是一个通用工具箱


  数据科学中的技术可以应用于各种问题。在一个方面的经验可以转化为在其他方面的经验。例如，一位数据科学家可能用相同的算法来预测疾病爆发，也可以用它们来预测有多少人会点击广告。


  把它想象成一位糕点师。他们学习广泛的技术，包括处理不同类型的面团、制作酱料、制作奶油等等。而且他们在制作蛋糕方面经验丰富。然而，正因为他们对这些技术高度熟练，他们可以轻松地从做蛋糕切换到做馅饼。


  例如，我常见到人力资源部门犯的一个错误是：


  - “我们在寻找一位有 5 年`TensorFlow`经验的人，”人力资源部说。

  - “好吧，但是`TensorFlow`才出现两年，”候选人或招聘公司回答道。


  对于数据科学家而言，他们知识的广度通常比单纯的年限更能体现其技能。


  问题是许多雇主不了解数据科学家的技能组合——当然，你不是这样，因为你正在读这本书，对数据科学以及数据科学家的职责有了更深入的理解。结果就是，由于缺乏理解，许多数据科学家被局限在了某个特定领域。


  我们以一位在金融领域工作的数据科学家为例。在金融领域，数据科学会使用时间序列和预测建模等工具。然而，这些工具并不仅限于金融领域。它们对许多其他领域也同样有效，比如体育博彩甚至零售。例如，在零售业，你可以用时间序列来预测需求。


  然而，大量雇主看到这位数据科学家有金融经验，就会自动认为他们的技能只适用于金融领域。这意味着他们可能会错过一位出色的数据科学家。


  所以，不要犯同样的错误，给这些人一个机会，即使他们不符合你心中对完美员工的严格定义。


  ### 发现年轻人才


  数据科学有点像体育，天赋在其中扮演着巨大角色，尤其因为它需要技术技能和软技能的结合，正如我们之前讨论过的。这个人需要能够理解他人，能够建立别人看不到的联系，并且能够良好沟通，这超越了技能组合中的技术层面。他们还必须能够顺利地将软技能和技术技能结合起来，这并不总是听起来那么容易。


  所以，当你发现有人明显具备从事这项工作的天赋时，一定要牢牢抓住他们，即使他们正处于职业生涯的起步阶段。请记住，今天的一位初级数据科学家，如果你给予机会并用心培养，未来可能成为你的高级数据科学家。


  你如何能找到有才华的年轻数据科学家？首先，你想看看那些教授这门学科的顶尖大学。然后，一旦确定了潜在的候选人，就要超越他们的大学成果去寻找。你可以在`GitHub`这样的网站上查看他们做过的课外项目。


  你还应该考虑创建一个导师计划。这将让你能够识别有数据科学天赋的人，其中一些人，你可能直到与他们近距离合作后才会意识到他们有这样的潜力。




  ### 典型的数据科学家两难抉择


  对于数据科学家而言，他们在选择为谁工作时会面临一些两难抉择。选项无非是初创公司和大公司。二者各有其优缺点。


  首先说说初创公司。对于数据科学家来说，在初创公司工作无疑会更有趣。他们会接触到新技术和新问题，并且拥有更大的灵活性。然而，缺点是薪水可能较低，而且稳定性也是个问题，毕竟许多初创公司最终都以失败告终。


  然后是大公司。主要的优势在于薪资会丰厚得多，福利待遇也同样诱人。稳定性也是一个重要因素。一家大公司不太可能一夜之间倒闭，让数据科学家陷入困境。


  然而，从另一个极端来看，事实是数据科学家可能会因为工作枯燥乏味、毫无刺激感而抓狂，因为他们需要处理陈旧的技术和遗留代码，并且还得负责清理这些代码。所以，这绝对谈不上有趣，一点都没有。


  ### 立即冻结你的数据科学家招聘计划


  如果你的公司还没为数据科学做好准备，那你就该停止招聘数据科学家的尝试。什么是为数据科学做好准备好了呢？


  首先，你需要确保公司已经建立起一种数据驱动的文化。组织中的每个人都需要理解数据的价值，并且愿意有效地使用它。


  如果每个人都认为数据是浪费时间，或者觉得你只是因为这是最新的“潮流”才这么做，那么你招聘数据科学家就是在浪费金钱和时间。


  不过别担心，稍后我们会讨论如何建立数据科学文化，届时你就会清楚自己需要做什么了。


  下一个要考虑的因素是，你是否拥有可用的数据。如果你还没收集好数据，那不妨等数据到位再说。否则，你就是在花钱请一位数据科学家干坐着当摆设。这也会激怒数据科学家，因为正如我提过的，无聊是他们最讨厌的事情之一。而一个无事可做的数据科学家会感到无聊，并且很可能在你一眨眼功夫就离职了。


  最后，你需要确保数据科学家的工作能产生实际影响。如果只是雇个人把数据弄得好看点，用来炫耀一下，那就没什么其他用处，那纯粹是浪费资源。你需要确保自己心里有明确的目标——一个需要解答的重要问题——否则你既浪费了自己的时间，也浪费了数据科学家的时间。


  当你真正雇佣了一位数据科学家时，不要仅仅把他们当成一个高级的报告工具。他们的价值远不止于此，你需要听取他们的想法，并信任他们的建议。不要犯那种以为自己无所不知的错误。


  说到底，你会去教你的电工如何重新布线你的房子吗？或者你会去指导你的外科医生如何给你做手术吗？当然不会。你会让他们做自己的工作，并听取他们的建议，因为他们是专家。那么，对待你的数据科学家，你为什么就要另搞一套呢？


  你还需要让他们展翅高飞。如果他们想用全新的方法来解决某个问题，不要太惊讶。仅仅因为这与你的想法不一致，并不意味着它没有效果。事实上，尝试新事物正是找到最有效解决方案的最佳途径。


  请记住，一遍又一遍地做同样的事情却期待不同的结果，那简直是疯了。所以，你需要给予你的数据科学家尝试新事物的自由。


  为了让你更清楚地明白为什么还没准备好就不该招聘数据科学家，我想起不久前的一家公司招聘数据科学家的例子。然而，那位数据科学家仅仅两个月后就辞职了，而且离职时还很不愉快。


  事情是这样的：公司没有任何数据可供这位科学家处理。他们还在收集数据，但他们操之过急了，不知怎地认为在收集信息的同时，需要先有一位数据科学家在座充充门面。


  更糟糕的是，他们根本没有明确的目标。他们只是想要“洞察”，这个目标对于任何人都太模糊了，根本无法着手。当然，没有明确的目标，你可以想象数据收集过程也不符合标准。


  老实说，我很确定那位数据科学家辞职不仅仅是因为无聊——尽管那也是一个问题。他可能知道自己将要和一群完全不懂他在做什么的人打交道。他得先教育他们，然后强迫他们设定目标，再试图把一堆杂乱无章的数据变成他能处理的东西。这实在太费劲了，根本不值得。


  ## 数据科学部落


  现在我们来看看不同类型的数据科学家。我称他们为“部落”，因为我觉得这个词非常适合描述数据科学领域内不同的群体。你不可能只有一种类型的人，因为成为数据科学家的途径也不止一条。


  这不像成为医生那样，唯一的路径就是上医学院、做住院医师、然后获得认证。对于数据科学家来说，有好几种方式可以达到同样的最终目标。


  这就是为什么我认为我们基本上可以把数据科学家分为*三个主要部落*和*三个较小的部落*。


  就主要部落而言，我们有**计算机科学家**、**统计学家**以及来自其他领域的**定量分析专家**。


  较小的部落则包括**自学成才的数据科学家**、**软件平台用户**和**领域专家**。


  这里还有一点很重要，那就是数据科学家和数据工程师现在被认为是完全不同的角色，即便在早期这两种角色经常被混淆，也即便数据科学家通常拥有计算机科学背景但同时也具备一些数据工程技能。


  ### 主要部落


  那么，让我们快速了解一下这三个主要部落：计算机科学家、统计学家以及其他定量分析专家。




  #### 计算机科学家


  计算机科学家是那些拥有计算机科学学位，并随后攻读了机器学习硕士或博士学位的人。他们的优势在于通常具备非常优秀的编码、数据库和软件技能，但问题在于，他们通常会忽视理论上的传统统计技术，而后者在某些特定领域和问题中可能非常有用。


  计算机科学家非常擅长处理诸如预测建模这类机器学习任务中的问题。他们通常有参加 Kaggle 竞赛的经验，而 Kaggle 正是这类问题的典型代表。


  请注意，Kaggle 是一个举办预测建模和分析竞赛的平台。⁷⁸ 公司和用户上传数据集，然后统计学家、数据科学家和/或其他专家竞相创建最佳模型来预测和描述这些数据集。这是一种众包形式，依赖于这样一种理念：在预测建模任务中可以运用无数种策略，并且无法事先知道哪位分析师或哪种方法会是最好的。Kaggle
  现在是 Google Cloud 的一部分。⁷⁹


  给你一个数据集，你只需找到一个好的算法来预测某些东西。大多数计算机科学家拥有扎实的编码技能，这意味着将他们的工作与平台的其他部分集成起来更容易，特别是如果你是一家小公司或初创企业的话。他们中的大多数会使用
  Python，并且能毫无困难地编写自己的 API。所以，本质上，你可以利用他们的技能同时完成许多事情，因为他们既能编写代码，也能进行集成。


  此外，他们拥有扎实的数据库技能，因此可以完成大量的数据工程工作。即使你拥有自己的数据工程师，这也仍然很有价值，因为这些人可以轻松地检索数据、将其整理成可用的格式等等。这将为你节省开发人员的时间。他们或许还能就数据库的结构提出建议，让你的工作更加轻松。


  然而，他们缺乏适当的统计学知识，因此对于某些适合使用统计学的特定问题，比如研究设计，这些人无法真正提供帮助。


  #### 统计学家


  统计学家是通常拥有统计学学位的人。他们甚至可能拥有统计学或机器学习的硕士或博士学位。他们通常在该领域拥有良好的理论基础，但缺乏编码或数据库技能。


  统计学家拥有非常扎实的统计学和理论知识。如果你感兴趣的是研究设计或统计建模，因为你想了解某个事物背后的驱动因素，那么他们是最佳人选。


  如果你想对复杂问题建模，同时确保建模过程透明，并且你能理解正在发生的事情，他们也是最佳选择。


  由于在数学和理论方面受过严格训练，他们也非常善于批判性地审视其他数据科学家的工作。


  然而，问题在于，大多数时候，他们的编码和数据库技能并不出色。他们最可能使用的语言是 R，并将其作为一种工具。他们可能没有其他语言或数据库方面的经验，这将使他们的工作与系统集成变得更为困难和耗时。


  此外，一些统计学家在预测建模方面训练不足。就其本身而言，预测建模在统计学背景下很少被视为重要内容，而更偏向于机器学习。


  因此，要检查他们是否有 Kaggle 经验。如果你有兴趣利用他们的技能进行预测建模，确保他们熟悉某种机器学习概念（例如交叉验证）也是值得的。


  #### 其他定量专家


  最后，我们有我称之为的其他定量专家。这些人来自数学密集型学科，如物理学、数学、精算学、计量经济学等。这些人可能拥有硕士或博士学位，但并非机器学习和统计学方向。


  这些人基本上都是发现数据科学领域比他们自己的研究领域有更多（且更好）的工作机会，并试图转行的人。他们试图利用自己的数学和/或编码知识来实现这一目标。在这个群体中，你会看到技能和知识方面的巨大差异。


  这些定量专家有点特殊，因为他们通常拥有一些扎实的技能，并带来了多样化的思维方式，这在数据科学中非常重要。此外，如果你正在处理的问题属于他们的特定领域，那么雇佣他们绝对是非常棒的选择。


  然而，问题在于他们往往缺乏机器学习或统计学的严格训练，这在某些情况下可能会引发严重问题。


  因此，对于其他定量专家，这往往是主观的，因为因人而异。但主要的缺点是，这些人通常缺乏该领域的正规教育。


  他们往往是自学成才，你需要理解这一事实，并检查他们的实际效果如何。例如，你很可能在 GitHub 或 Kaggle 上找到他们工作的例子。而且你确实应该事先检查一下。请注意，自学成才并非坏事——绝无此意。但是，你需要检查以确保他们的技能符合你的需求。


  这些人通常是学习了一个领域，却发现薪水并不理想，或者找工作几乎不可能。然后他们发现数据科学家的薪水很高，所以，例如，一位化学家可能会决定创建几个小项目，上传到
  GitHub，或者参加几次 Kaggle 上的竞赛，试图找到一份数据科学家的工作。


  根据我的经验，在这些人的所有专长中，我发现最有效的是物理学家。物理学充满了应用数学，这使得他们很容易阅读机器学习论文，特别是因为这本质上是同一类型的数学。此外，物理学家需要能够自己做一些编码工作，因此其技能组合与机器学习所需的技能相似。


  需要注意到的一个重要点是，领域专家将拥有其各自领域的专业知识，这可能会对你很有帮助。例如，你可能想雇佣一位在计量经济学方面有经验并且有一点机器学习知识的人，因为你的问题在某种程度上与计量经济学相关。或者，你可能想聘用一位物理学家，因为你正在处理传感器数据或雷达数据。


  然而，你必须对这些其他定量专家保持警惕，因为有些人会试图伪装。他们可能会花两周时间学几个教程和在线课程，然后突然就认为自己已经是数据科学家了。这仅仅是因为他们想得到这份工作。你必须非常警惕这些人，因为他们可能会毁掉你的整个项目，并导致很多问题。


  这并不意味着你不应该考虑那些经验不足但为人诚实，并证明自己聪明且愿意学习的人。他们希望获得更多经验，是有潜力成为杰出数据科学家的聪明人。


  然而，在我看来，最好让这些人担任初级职位，并有一名更有经验的人来监督他们。当然，监督他们的人应该是一名高级数据科学家。如果你没有高级数据科学家，请先雇佣一位。然后，你可以作为初级人员跟踪他们的进展，看看他们如何成长。根据他们的发展情况，你可以选择是否提拔他们。




  #### 交汇点


  值得注意的是，大约五到六年的经验之后，所有群体通常会到达一个交汇点。换句话说，当一个人积累了多年经验，参与过相当多的项目（大约 10 到 30 个），并且在不同领域的多家公司工作过，他们通常已经掌握了广泛的技能。如果他们还拥有博士学位，那只是锦上添花。


  因此，他们既用`R`也用过`Python`编写代码，并且他们这里学一点，那里学一点，基本上各方面都懂一些。他们对业界的现状也有很好的认识。这意味着他们了解所有可用的方法和技术，即使自己不知道如何实现。


  这一点很重要，因为他们知道一个问题应该如何解决。即使他们不知道如何自己动手，他们也知道该找谁谈、该雇佣谁来完成任务。有时，拥有技能本身并不重要，重要的是意识到自己的局限，并了解有哪些解决方案，以及如何找到能实施这些方案的人。


  所以，如果你看到有人最初是物理学家，但在数据科学领域工作了十年，并且为众多不同领域的公司工作过，那么这种人很可能就属于这一类。


  因此，当你找到一个经验丰富的人时，不必过分担心他们的背景。更重要的是他们多年来学到了什么，以及他们是否真正拥有技能，并了解所有可用的技术和方法。


  你需要小心的是那种虽然经验丰富，但年复一年都在做同一两个项目的人。这些人并不是我指的类型。我指的是那些多年来积极尝试学习新事物的人，比如获取`R`、`Python`的经验，或许还有一些研究设计方面的知识，等等。


  ### 较小的群体


  那么，现在我们来看看较小的群体。我说较小的群体，是指这些群体中的人数不如大群体那么多。此外，这些人往往不完全是数据科学家，而主要是具备一些分析能力的人。


  因此，我们有`自学成才`这一类人。他们通常是学过某些随机专业的人，或者甚至是软件开发出身。他们可能参加过几次 Kaggle 竞赛，而这差不多就是他们经验的全部了。


  虽然来自大群体的量化专家在某些方面也可能自学成才，但他们的学科背景已经教会了他们一些可以迁移到数据科学领域的技能。


  在此特定情形下，我指的是学人文学科的人，例如。一位艺术史学家突然发现自己的领域没有太多职业机会，或者一位考古学家发现挖土并不像他们期望的那样有趣或经济回报丰厚，然后突然决定成为一名数据科学家。


  然后是`软件平台用户`，这种人只知道如何使用某个特定工具，比如仪表盘或`Weka`（见图 11-2）或`RapidMiner`这类软件。如果你的问题很简单，这些人能提供很高的性价比。例如，如果你只需要做一些报告，那么这些人是最佳选择，因为他们肯定更便宜。


