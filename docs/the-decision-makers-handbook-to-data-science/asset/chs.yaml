- '# 数据科学流程


  那么，如果我问这个问题：


  > *数据科学是关于什么的？*


  我会得到不同的答案，因为，毫不意外，不同的人有不同的看法。例如，老板可能认为数据科学实际上是一台神奇的印钞机，可以随时印出他或她想要的钱。


  对于客户来说，数据科学可能会让你看起来像一个巫师、读心者或通灵者，因为你可以了解他们很多，并解决他们的许多问题。


  软件工程师认为数据科学只是从库中导入一些东西并运行几个函数，因为当然没有人像他们一样厉害。


  然而，在现实中，数据科学就像一个由不同元素组成的管弦乐队，包括基础设施、软件、数据源和统计学。


  从实用的角度来看，数据科学生命周期有五个步骤：


  1. 收集数据

  2. 整理数据

  3. 分析数据

  4. 解释数据

  5. 传达数据发现


  我们在前面的章节已经涵盖了数据的收集和整理；因此，我们将在本章中探讨第 3 到第 5 步，并且我们会足够深入地讲解这些主题，以便你理解这一切是如何运作的。


  不过请记住，数据科学家通常是从第 3 步到第 5 步才被召入，因为收集和整理工作已经完成了。但这并不意味着这些工作总是做得妥当，只能说它们已经做过了。


  ## 定义数据科学流程


  数据科学流程包含四个步骤，即：


  * 步骤 1——定义问题

  * 步骤 2——选择正确的数据

  * 步骤 3——解决问题

  * 步骤 4——通过可操作的洞察创造价值


  该流程涉及两个主要角色，即`领域专家`和`数据科学家`。


  `领域专家`是拥有该问题的人。它可能是聘请数据科学家的企业主，也可能是必须与数据科学家合作的部门负责人。在学术环境中，它可能是一位研究人员。


  本质上，`领域专家`是负责解决问题的人，并且需要向自己（作为企业主或创业者）或向高层管理层汇报。他也是了解领域所有具体细节的人。


  因此，第一步，即定义问题，由`领域专家`负责。随后，选择正确的数据是这两个角色的共同责任，而第三步则落在`数据科学家`身上。最后，创造价值需要双方共同合作。


  那么，让我们仔细看看所有这些步骤。


  ### 步骤 1：定义问题


  `领域专家`负责定义问题，因为他们比任何人都更了解这个领域。问题在于，`领域专家`通常不了解数据科学，这可能会产生问题。


  而这正是本节要讨论的内容。它关乎理解你为什么需要数据科学，你如何使用它，以及在什么情况下它会变得相关。


  如果你的公司有一位与你共事已久的`数据科学家`，他们很可能对这个领域有很好的了解。这意味着他们可以自己定义问题。


  然而，在大多数情况下，是`领域专家`来提出问题的。例如，他们可能想预测本月的销售额，或者他们可能会说推荐系统需要改进。


  一旦问题被定义，就该进入下一步了。


  ### 步骤 2：选择正确的数据


  `领域专家`需要理解`数据收集`和`管理`，我们在上一节中讨论过这些。他们负责确保我们之前讲过的数据收集和管理原则得到遵循，从而使数据尽可能干净、标准有文档记录、数据易于使用。


  另一方面，`数据科学家`需要理解该领域及其可能存在的任何特殊性。我们在数据管理部分也提到了这一点。


  因此，每个领域都有其自身的优缺点。所以，在某些情况下，你可能会得到非常嘈杂的数据，比如处理传感器数据时。在其他情况下，数据可能不准确，例如通过民意调查和问卷调查收集的数据，因为人们对答案可能不完全诚实。而`数据科学家`需要了解这些事情。


  ### 步骤 3：解决问题


  `领域专家`在这一步的主要贡献是确保公司聘请到合适的人，我们将在本书的下一节讨论这一点。他们还负责确保公司拥有合适的文化，我们将在本书的最后一章涉及。


  实际解决问题是`数据科学家`的工作，除了提供支持之外，`领域专家`能做的不多。


  ### 步骤 4：通过可操作的洞察创造价值


  这一步是`数据科学家`和`领域专家`的共同责任。这需要双方良好的合作，因为`领域专家`需要知道如何与`数据科学家`合作，并且理解工作成果意味着什么。


  同时，`数据科学家`到这时也需要了解业务和特定领域的一些问题。


  在这一点上，如果作为`领域专家`的人（如企业主、经理或决策者）对数据科学有很好的理解，那将会带来巨大的回报。


  这也有助于建立一种`数据科学文化`，但我们将在最后一部分更深入地探讨这一点。正确的文化可以使`数据科学家`更容易了解该领域的特殊性和业务问题。这将使`数据科学家`能够采取更具创造性的方法来开发解决方案，以帮助业务发展。


  ## 使用数据科学流程解决问题


  我们来看一个例子。这是一个非常简单的问题，但却是展示如何使用数据科学流程解决问题的最佳方式。


  ### 步骤 1：定义问题


  所以，第一步是定义问题。选择你在工作中觉得有趣的事情。你甚至可以决定专注于某件让你烦恼的事情。


  我将选择一个琐碎的例子，但大多数人都能感同身受，那就是会议总是迟到开始。


  要做的第一件事是构建问题。一个很好的技巧是将问题的陈述转化为一个问题并写下来。那么，在我们的案例中，它会是


  *会议似乎总是迟到开始。这真的是事实吗？*


  你想要采用这种方法，因为虽然大多数数据科学家喜欢具体的术语，但大多数非数据科学家倾向于用更模糊的术语思考。然而，模型，无论是机器学习、统计还是任何其他类型，都有狭窄的关注点，并且只能回答一个、两个或三个具体的问题。因此，当你把问题写成一个问题时，它能帮助`数据科学家`开发出更好的模型来达成解决方案。


  ### 步骤 2：选择正确的数据


  这一步将分为两部分，即第 A 部分（你思考数据）和第 B 部分（你收集数据）。




  #### 第一部分：思考数据


  此时，你需要思考回答第一步中提出的问题需要哪些数据。然后，你必须决定如何收集相关数据。


  首先，写下所有相关定义，并思考收集数据时将要使用的协议。问题往往从这里开始出现，你会意识到，即便是简单的问题，也可能涉及一系列不同的难题。


  以我们的例子来说，我们想研究会议延迟开始的情况。但要做到这一点，我们需要定义会议实际开始的时间。起初这看似简单，但如果你仔细思考，这个定义其实并不那么明确。


  那么，会议是在有人说“该开始了”的时候开始？是日历上预定的时间？还是会议实际工作开始时——你知道的，在闲聊完老板的孩子、狗、猫、仓鼠和鳄鱼之后？又或者，最初几分钟内的那些寒暄也是会议的一部分？有些人可能认为这部分是浪费时间，而另一些人则觉得它对建立人际关系很重要。


  这看似微不足道，但所有这些都是重要的，因为事情可能会出错。主要风险在于你使用了错误的定义，从而阻碍你解决问题。


  例如，会议可能因为寒暄而经常延迟开始。然而，当你写下定义时，并没有将这种寒暄考虑进去，因此记录了不同的会议开始时间。所以，你无法解决问题，因为原因完全从数据中缺失了。结果，你不得不回去重新收集数据，从而浪费了时间、精力和资源。


  #### 第二部分：收集数据


  既然你已经定义了数据，是时候进入项目的收集阶段了。首先要考虑的是，你需要的是可以信任的数据，这可能比听起来要困难得多。


  数据可能会遇到各种问题，例如缺失值、错误条目、定义问题等等。而且这些问题相当普遍。我们在上一节中已经讨论过这些问题，以及如何预防或解决它们。


  由于这些问题，保持灵活性和适应性是个好主意。例如，如果在进展过程中事情没有按预期进行，修改你的定义和数据收集协议可能是个好主意。


  那么，回到我们的会议例子。假设你最初的定义不包括会议中的“寒暄”部分。然而，你意识到它极其相关，因为它将实际会议的开始时间延迟了大约 30 分钟。好吧，如果数据没有显示问题的存在，你就无法解决它，所以你需要回去修改定义，同时也要改变收集数据的方式。


  不过，至关重要的是，要保持完全的透明度，并对你更改了什么、如何更改、何时更改等等进行完整记录。这很重要，因为你可能会遇到这样的情况：变量含义完全不同，却使用了相同的术语来定义它们。


  例如，假设你没有记录将寒暄纳入会议部分的决定。你记录的会议开始时间变了，但没人知道，因为你没有记录这个变更。


  然后，你和数据科学家一起梳理数据，他却搞不懂为什么没有任何东西能正常工作。


  原因当然是，`start time`（开始时间）变量根据其在项目中被记录的时间点（即在你做出修改之前或之后）有两种不同的定义。


  实际上，你处理的是两个变量，而不是一个，这会严重扰乱任何统计模型。


  这只是一个例子，说明如果你不记录所做的一切，事情可能会出错。还有更多情况可能发生，导致灾难性的结果。


  由于你不是数据科学专家，你无法预见到数据可能出现哪些问题，这就是为什么你需要对正在发生的事情完全透明，并记录你做的每一件小事。


  请记住，你总是希望让数据科学家的生活*尽可能轻松*，因为这样他们就能更快地进入状态，并开发出更有效的解决方案，从而帮助你节省时间和金钱，同时大幅提升效率和生产力。


  ### 第三部分：解决问题


  在这个阶段，作为领域专家，你能做的事情不多，因为这主要是数据科学家的工作。不过，让我们快速了解一下这一步骤通常包含哪些内容，以便你对正在发生的事情有个概念。


  通常，大多数数据科学家喜欢从探索性数据分析开始。他们使用汇总指标、图表等来更好地理解问题。在某些情况下，他们甚至可能向利益相关者展示一些初步发现。


  因此，在我们的例子中，数据科学家可能会这样说：


  “在两周的时间里，有 10%的会议准时开始。平均而言，会议延迟 12 分钟开始。”


  或者他们可能会发现，当会议涉及主题 X 和 Y，并且某些人（比如喜欢事无巨细地跟大家讲他周末干了什么，而且似乎没人能让他停下来）参加会议时，会议通常会延迟开始。


  然后，数据科学家会构建一个模型来寻找解决方案，但模型主要用于回答特定问题。你可以有一个主要问题，在我们的例子中，可能是：


  人们开会通常都会迟到吗？


  但你也可以有一些次要问题。在我们的例子中，它们可能是这样的：


  -   所涉及的主题是否会影响会议时长？

  -   与会人员是否会影响会议延迟的程度？

  -   延迟的会议是否会被提前结束的会议所抵消？

  -   总的会议时间是多少？你能用分布来描述它吗？


  当然，所有这些问题都是相关的，这意味着可以回答不止一个问题。不过，请记住，当你把问题表述为一个问题时，你就是在帮助数据科学家。他们将能够更好地理解如何将模糊的数据转化为一个可用于解决问题的模型。




  ### 第四步：通过可执行的洞察创造价值


  至此，数据科学家已经构建了一个或多个模型来回答上述问题，因此我们可以进入最后一步，即从模型中提取可执行的洞察。


  本质上，如果不采取行动，模型就是无用的。采取行动的第一步是理解结果的影响。一个很好的方法是将发现转化为货币价值。换句话说，如果所研究的会议迟到时间是典型的，那么每位员工每天会损失一小时，每年给公司造成`$X`的损失。


  另一种理解结果影响的方法是找出问题背后的具体个人或“罪魁祸首”。因此，在我们的例子中，我们可以说 X 先生/女士是会议迟到的责任人，那么我们该如何解决这个问题？我们能帮助他们更好地管理时间吗？这有助于解决问题吗？


  基于你从结果中获得的这种理解，就可以采取行动了。不过，超越结果本身也是一个好主意。这种建模、转化结果、然后采取行动的循环，对你来说也是一次很好的学习经历。当你经历这个过程时，其他问题会浮现出来。这就是第三步中提到的那些次要问题出现的时候。同样，为这些次要问题建立模型也是合理的，因为数据已经存在，并且数据科学家已经获得了处理这些数据的经验。充分利用数据总是值得的。


  '
- "# 统计学简介\n\n统计学有两个分支，即描述性统计和推断性统计（图 6-1）。\n\n提及**统计学**这个词，大多数人首先想到的是描述性统计。这些内容你可能在高中就学过。它们包括收集数据、使用均值等汇总指标以及数据可视化。\n\
  \n而统计学家在想到**统计学**这个词时，脑海中浮现的通常是推断性统计。它涉及更高级的概念，如抽样和推断总体参数的值。\n\n![一张图表展示了统计学的两个分支：描述性统计和推断性统计。描述性统计下包括收集、组织、总结和呈现数据。推断性统计下包括假设检验、确定关系和统计建模。](img/490014_3_En_6_Fig1_HTML.jpg)\n\
  \n**图 6-1** 统计科学的两个分支\n\n## 描述性统计\n\n描述性统计涉及以方便且信息丰富的方式组织、总结和呈现数据。这类统计使用两类方法。\n\n\
  第一类是描述数据的数值方法。这些方法包括衡量数据位置的指标，如均值、中位数和众数。它们也包括衡量数据变异性的指标，如极差、方差和标准差。\n\n第二类方法涵盖呈现数据的图形手段，你可能对此非常熟悉，例如条形图、饼图、直方图等。\n\
  \n我喜欢将描述性统计称为“高中统计学”。原因是大多数人在高中都学过描述性统计，并且认为描述性统计代表了统计科学的整个领域。然而，事实远非如此。\n\n## 推断性统计\n\
  \n当统计学家谈论统计学时，这通常就是他们所指的内容。推断性统计比描述性统计更有趣、也更有用。它基本上代表了统计学的 90%，而描述性统计仅仅是冰山一角。\n\n\
  因此，推断性统计是一套基于样本数据，对总体的特征得出结论或进行推断的方法。推断性统计中使用的一些基本术语包括：\n\n-   数据、元素、变量和观测值\n- \
  \  总体：统计学家感兴趣的所有项目的集合\n-   样本：从总体中抽取的一组数据\n-   参数：对总体的描述性度量\n-   统计量：对样本的描述性度量\n\
  -   推断：一套方法，如估计、检验和预测，用于基于样本数据对总体的特征得出结论或进行推断\n\n那么，这一切意味着什么？推断性统计实际上做了什么？\n\n推断性统计使我们能够量化不确定性。换句话说，假设你想了解关于总体的某些信息。让我们选一个简单的例子，比如一个国家的人的平均身高。\n\
  \n要确定这个数值，你的第一个想法可能是必须测量这个国家的每一个人。当一个国家有 5000 万人口时，这可不是一件容易的事。即使对于如此简单的事情，你也需要花费大量的时间和金钱去接触每一个人。研究每一个个体，至少是不切实际的，但在大多数情况下是不可能的。\n\
  \n借助推断性统计，你可以从总体中抽取一个样本，并通过概率分布来表达不确定性。它帮助我们将不确定性转化为可量化的指标，从而让我们能够进行计算。这就是我们能够进行统计建模和假设检验的原因。\n\
  \n所以，本质上，你可以抽取一个 1000 人的样本，然后将他们的平均身高推断到整个 5000 万人口。与处理 5000 万人相比，处理 1000 人要容易得多。\n\
  \n这种利用概率分布表达不确定性的想法虽然简单，但却极为强大。人类要感谢统计学的奠基人们，如罗纳德·费希尔、耶日·内曼和卡尔·皮尔逊，他们提出了 ANOVA（方差分析）和多元线性回归等方法，并为现代统计学的大部分内容奠定了数学基础。\n\
  \n如果没有推断性统计，大多数科学领域将缺乏做出明智决策的工具。每当你听到关于医学、心理学、经济学或其他领域的研究时，你应该知道这要归功于推断性统计。\n\n\
  ## 如何使用统计学\n\n好了，现在该看看如何运用统计学了。再次强调，我们将从宏观角度出发，不是从统计学家或数据科学家的视角，而是从非技术决策者的视角来看。\n\
  \n首先，你可能已经以某种形式在使用描述性统计了。像均值和众数这样的指标，或者条形图和直方图之类的图表，大多数人都能理解。然而，了解可能出现的某些陷阱很重要，我们稍后会详细讨论这些。\n\
  \n然后是推断性统计，它在两种情况下很有用。它可用于回答关于变量重要性的特定问题，也可用于回答关于总体差异的问题。\n\n在本节结束时，你应该明白统计学总是被用来支持某个假设或故事，这涉及到描述性统计的广泛使用。虽然在分析中经常会用到推断性统计，但它往往与描述性统计相伴出现。\n\
  \n因此，作为高管、经理、创始人或决策者，你需要能够判断是否可以使用统计学来回答问题，以及这个故事的逻辑是否合理，并避免统计推断和结果呈现中可能涉及的所有陷阱和谬误。\n\
  \n\n\n### 推断性统计学示例\n\n我们先来看几个推断性统计学的例子，这样不仅能让你更深入地理解这个概念本身，还能了解如何将其应用到你的业务中。\n\n\
  `假设检验`和`统计建模`是你使用推断性统计学的两个主要领域。\n\n`预测`是另一个领域，它代表了一组用于预测未来数值的工具和方法。不过，我们不会深入探讨预测，因为它技术性更强、更进阶，并且通常可以通过机器学习来完成。\n\
  \n### 假设检验\n\n`假设检验`通常用于两个目的：一是找出总体参数的值，二是进行比较。确定总体值实质上就是找出例如某个群体的平均身高或他们的平均收入是多少。\n\
  \n另一方面，比较涉及探索相似参数之间的差异和/或相似性。例如，你可以根据性别探索差异，比较在同一工作中男性和女性谁挣得更多。\n\n`假设检验`是科学中极其重要的工具。例如，每当你听到关于新药的临床试验时，都会用到假设检验来检测是否观察到显著效果。在进行假设检验时，我们实质上是在比较两个假设：`零假设`和`备择假设`。因此，在临床试验的背景下，零假设就是新药对这种疾病没有效果。\n\
  \n假设检验会产生一个称为`p 值`的结果。这是给定数据后，零假设为真的概率。如果`p 值`很低（通常我们使用 5%的阈值），那么我们就拒绝零假设，接受备择假设。\n\
  \n在商业中，你主要在`A/B 测试`的场景下遇到假设检验。例如，当某人测试两个标题以查看哪个能产生最高的点击率时，他们就是在进行基于比较的假设检验。\n\n\
  有关统计检验的示例，请参见表 6-1。\n\n**表 6-1** 一些统计检验示例\n\n| 名称 | 用途 |\n| --- | --- |\n| `T 检验`\
  \ | 用于检验两组均值是否相等 |\n| `方差分析` | 用于检验多组均值是否相等 |\n| `比例检验` | 用于检验两组比例是否相等 |\n| `威尔科克森符号秩检验`\
  \ | `t 检验`的非参数替代方法 |\n| `斯米尔诺夫-科尔莫戈罗夫检验` | 用于检验变量是否服从正态分布 |\n| `弗里德曼检验` | `方差分析`的非参数替代方法\
  \ |\n\n#### 统计建模\n\n当你需要确定一个变量是否影响另一个变量时，主要会用到`统计建模`。\n\n例如，假设你已经针对“同一职位男性比女性挣得多”这一说法进行了假设检验，并得出结论该说法是准确的。然而，你想发现还有哪些其他变量可能影响收入。为此，你转而求助于统计建模。\n\
  \n图 6-2 展示了一个线性回归的例子，它是最著名的统计模型。\n\n![](img/490014_3_En_6_Fig2_HTML.jpg)\n\n一幅包含一条直线和散点的图表。一条直线穿过（负\
  \ 20，2）、（0，5）、（20，8）、（40，12）、（60，14）这些点。散点分布在直线周围。所有数值均为近似值。\n\n**图 6-2** 简单线性回归示例\n\
  \n所以，你将这些变量输入模型，发现收入还受到年龄、经验、先前工作经历等因素的影响。你还可以找出这些变量对响应变量（即我们感兴趣的变量，在本例中是收入水平）的影响程度。\n\
  \n你是否听说过`线性回归`、`逻辑回归`或`广义线性模型`？所有这些都是统计模型的例子。这些模型构成了其他更专门领域（如计量经济学和心理测量学）中使用模型的基础。参见表\
  \ 6-2。\n\n**表 6-2** 统计模型示例\n\n| 名称 | 用途 |\n| --- | --- |\n| `多元线性回归` | 最常见的统计模型，当响应变量为数值型时使用\
  \ |\n| `泊松回归` | 当目标变量由正整数组成时使用 |\n| `逻辑回归` | 用于二分类结果变量，例如，理解两类客户之间的差异 |\n| `生存模型`\
  \ | 当我们关心某物（例如一个机械零件）失效所需的时间时使用 |\n| `对数线性模型` | 用于检验两个以上分类变量之间关系的模型 |\n\n### 用统计误导他人\n\
  \n人们倾向于盲目信任统计数据，这可能会成为一个问题。接受看似完整的事实是很自然的，尤其当这些事实有大量数据和图表等支持时。然而，事实是统计数据可以被用来欺骗人们。也可能因为错误而导致结果偏差。\n\
  \n这一节至关重要，因为统计被滥用的情形相当普遍。我们将审视统计学被滥用的案例，认识到事物可能出错的诸多方式以及有人试图欺骗你的情况，这对于你来说非常重要。这样，你就能做出更明智的决策。\n\
  \n\n\n### 用图表说谎\n\n那么，让我们从一种我最喜欢的用统计误导他人的方式开始——公然使用包含虚假相关性的图表说谎。这些图表表面上似乎有道理，但实际上毫无意义。\n\
  \n请看图 6-3 和图 6-4。图 6-3 显示了掉进游泳池淹死的人数与尼古拉斯·凯奇出演电影数量之间的相关性。图 6-4 则将美国在科学、空间和技术上的支出与上吊、勒颈和窒息自杀的人数关联起来。\n\
  \n![](img/490014_3_En_6_Fig4_HTML.jpg)\n\n一幅折线图，展示了美国在科学、空间和技术上的支出与当年因上吊、勒颈和窒息自杀的人数之间的相关性。上吊自杀人数和美国科学支出分别在\
  \ 2009 年达到峰值，约为 275 亿美元对应 900 起自杀，以及 290 亿美元对应 9900 起自杀。数值均为近似值。\n\n**图 6-4**  \n\
  美国在科学、空间和技术上的支出与因上吊、勒颈和窒息自杀的人数相关^(⁴⁶)\n\n![](img/490014_3_En_6_Fig3_HTML.jpg)\n\n\
  一幅折线图，展示了掉进游泳池淹死的人数与尼古拉斯·凯奇出演电影数量按年份绘制的相关性。尼古拉斯·凯奇在 2007 年和 2009 年达到峰值，对应约 120 起溺亡和\
  \ 4 部电影。游泳池溺亡在 2007 年达到峰值，超过 120 起溺亡和 4 部电影。\n\n**图 6-3**  \n尼古拉斯·凯奇似乎在全球范围内推动了游泳池溺亡事件^(⁴⁵)\n\
  \n乍一看，这些可能像是很有趣的统计数据。第一张图似乎在暗示，当尼古拉斯·凯奇主演更多电影时，溺亡人数也更多。仅凭这张图，并且不了解统计数据可能具有误导性，你可能会得出结论：人们实际上可能是为了逃离尼古拉斯·凯奇的电影而自杀。\n\
  \n第二张图暗示，随着上吊、勒颈和窒息自杀人数的增加，美国在科学、空间和技术上的支出也在增加。因此，你可以得出结论：投资研发是增加总体人口死亡数的可靠方法！\n\
  \n当你把这些结论写出来时，就更容易意识到它们其实根本没什么道理。是的，这些是展示统计数据如何被用来误导的极端例子，但许多类似的例子都存在虚假相关性，即使不那么明显，这也是你需要小心的原因。\n\
  \n那么，相关性是虚假的意味着什么？这意味着两个变量存在相关性，但其背后并没有发生这种关联的理论依据。它们只是两个被关联起来、实则毫无真实联系的变量。并且我们不要忘记，相关性并不等同于因果关系。\n\
  \n换句话说，尼古拉斯·凯奇电影的数量与现实世界中游泳池溺亡人数毫无关联，因此它是一个虚假相关。相反，如果我们比较尼古拉斯·凯奇的收入和他主演的电影数量，那么这种相关性就有意义了，因为两者之间存在联系。\n\
  \n第二张图在试图欺骗人们方面更进一步，因为它的 X 轴被反转了。换句话说，数值沿轴递减而非递增，尽管 Y 轴的数值是随着高度增加而增大的。这是为了进一步强行制造相关性。\n\
  \n因此，统计学是一个很好的工具，但它不是一个无论怎样都能提供答案的魔法棒。使用统计学也不意味着你可以不必拥有正确的研究设计。在审视问题时，你还需要有正确的框架。\n\
  \n如果你想看更多虚假相关的例子，请访问 [`http://tylervigen.com/`](http://tylervigen.com/)。实际上这相当有趣，因为在所有这些相关性中，错误总是相同的，即所研究的两个变量背后缺乏理论依据。\n\
  \n记住，仅仅因为两个变量之间似乎存在很高的相关性，并不意味着它们真的相关。\n\n问题在于，尽管所有这些例子都涉及虚假相关，但在许多情况下，它并不那么显而易见。\n\
  \n例如，假设某人患有糖尿病的时间长度与 60 岁前死亡的人数之间存在很高的相关性。表面上，不作深入探究，你可能会得出结论：一个人患糖尿病的时间越长，他们在 60\
  \ 岁前死亡的可能性就越大。这可以做出漂亮的图表和一切。\n\n然而，如果你开始深入挖掘，你会发现这些死亡包括了各种各样的原因，如车祸、谋杀、自杀等等。换句话说，即使部分相关，第二个变量的另一部分也完全无关。但结果是一样的，即研究此类图表的决策者会得出错误的结论。\n\
  \n另一种用图表说谎的方式是使用不同的刻度。在图 6-5 的例子中，我们有两个图表，每个图表有两个条形，代表类型 A 和类型 B。两个图表都使用了对数刻度，但没有明确说明。通过使用不同的刻度，你可以让两个项目看起来比实际更接近。\n\
  \n![](img/490014_3_En_6_Fig5_HTML.jpg)\n\n两幅直方图。左侧，类型 A 为 50，类型 B 为 80。右侧，类型 A 略低于\
  \ 4，类型 B 大于 4。\n\n**图 6-5**  \n对数刻度如何扭曲组间差异感知的示例\n\n另一种用图表说谎的简单方法是调整坐标轴的刻度范围。例如，在图\
  \ 6-6 中，你可以看到左边的图显示出一个上升趋势，而右边的图则显示出一个大致稳定的趋势。两种情况下数据是相同的。唯一的区别是缩放的程度。\n\n![](img/490014_3_En_6_Fig6_HTML.jpg)\n\
  \n两幅折线图。左侧，线条向右延伸时依次穿过 y 值 1.5、2、3、4、3 和 4.3。右侧，线条向右延伸时依次穿过 y 值 1、2、2、4、3、4 和 5。所有数值均为近似值。\n\
  \n**图 6-6**  \n相同的数据，不同的视图\n\n\n\n### 描述性统计的误导性使用\n\n现在，让我们来看看如何利用描述性统计来误导他人。一种常用的欺骗手段是使用集中趋势度量和汇总指标。本质上，集中趋势主要有三种度量方式，即均值、中位数和众数。\n\
  \n均值是一组数字的平均值，也就是将所有数字相加，然后除以数字的个数。中位数是一组数字按大小排列后的中间值，而众数则是一组数字中出现频率最高的值。\n\n在对称分布中，均值、中位数和众数落在同一点上。然而，当数据呈正偏态时，均值小于中位数，中位数小于众数；而在负偏态分布中，情况则相反。见图\
  \ 6-7。\n\n![](img/490014_3_En_6_Fig7_HTML.jpg)\n\n三种概率分布。在正偏态中，众数位于 (1.5, 0.13)，均值位于\
  \ (3.5, 0.1)，中位数位于 (5, 0.08)。在负偏态中，众数位于 (-2, 0.13)，均值位于 (-4, 0.1)，中位数位于 (-5, 0.07)。在对称分布中，众数、均值和中位数均位于\
  \ (0, 0.4)。数值为近似值。\n\n**图 6-7** 偏度以及均值、中位数与众数之间的关系\n\n这一点很重要，因为现实生活中的许多分布都不是对称的。例如，假设一家公司，CEO\
  \ 年薪 30 万美元，而其余十名员工每人年薪 5 万美元。\n\n根据你希望呈现的形象，你可以出示不同的数据。例如，在我们的例子中，中位数是每年 5 万美元，但平均值是每年\
  \ 7.2 万美元。\n\n一家不怀好意的公司在招聘时可能会宣传平均工资为每年 7.2 万美元，但实际上，他们除了 CEO 之外，不愿意向任何员工支付超过 5\
  \ 万美元的薪水。但这样一来，他们就能诱使一些人以为自己最终能赚到每年 7.2 万美元，而他们甚至不需要直说，因为这些数字本身就暗示了这一点。\n\n### 抽样中的偏差\n\
  \n现在我们来探讨抽样中的偏差。抽样偏差有多种类型，但我们主要关注五种，即：选择偏差、区域偏差、自我选择偏差、诱导性问题偏差和社会期望偏差。这些是商业环境中最常见的几种。\n\
  \n#### 选择偏差\n\n选择偏差是最重要的一种，其他偏差可以被视为与之相关，甚至是这种偏差的子集。\n\n当样本不具有代表性，因为存在某种过程确保了样本中的受试者或项目是特殊的，而许多其他受试者或项目未被纳入时，就出现了这种偏差。\n\
  \n关于选择偏差有一个有趣的故事，主人公是统计学家亚伯拉罕·沃尔德。二战期间，政府找到他，希望他帮助提高美国飞机的生存率。沃尔德很聪明，他做的第一件事就是查看之前进行过的分析。^(⁴⁷^)\
  \ 他注意到其中存在选择偏差。\n\n之前的研究人员分析的是幸存返航的飞机，并建议在受损最严重的区域增加更多装甲，以提高防护能力。于是，飞机上弹孔最多、破损最严重的地方被装上了新的装甲。\n\
  \n结果，更多飞机被击落。额外的装甲使飞机变得更重，导致其灵活性降低、速度变慢。而返航的飞机仍然在相同区域带有损伤。\n\n问题在于，研究人员是根据那些在明显具有韧性的区域受损的飞机得出结论的。毕竟，这些飞机的那些区域虽然受损，但它们仍然返回了基地。\n\
  \n沃尔德意识到，真正需要保护的是那些没有受损且脆弱的区域。一旦在这些区域加装装甲，飞机的生存率就提高了。\n\n这是一个非常有趣的例子，展示了如何以极其睿智的方式运用统计学，甚至无需运行分析。他需要做的仅仅是意识到这种选择偏差的存在，然后将其修正。\n\
  \n#### 区域偏差\n\n区域偏差发生在你试图将一个区域的结论推广到另一个区域时，在尝试跨文化推广时这个问题尤为突出。\n\n举个例子，你在欧洲进行了市场营销研究，就自动认为同样的结果也适用于美国。不幸的是，这没有考虑到包括文化和金融因素在内的广泛因素都可能影响研究结果的可靠性。\n\
  \n#### 自我选择偏差\n\n在自我选择偏差中，一个人决定参与研究的行为可能与他们已有的、并可能影响研究的特征相关，从而使参与者成为一个非代表性样本。\n\n\
  这听起来可能很复杂，但实际上比听起来要简单得多。例如，如果你设立一个展位来询问人们的梳妆打扮习惯，那么更有可能回答问题的往往是那些注重自身形象、早上愿意花更多时间打扮的人。\n\
  \n问题在于，你需要同时与那些爱打扮的人以及早上对梳洗打扮不太感兴趣的人交谈，这样样本才具有代表性。\n\n#### 诱导性问题偏差\n\n诱导性问题偏差不仅关乎问题的措辞和提问方式，也关乎可选的答案。\n\
  \n因此，如果你问：\n\n你不觉得高中老师的薪水太低了吗？\n\n1.  是的，他们应该拿更高的薪水。\n2.  不，他们不应该拿更高的薪水。\n3.  没有意见。\n\
  \n由于问题的措辞方式，大多数人会选择 A。因此，使用诱导性问题最终会得到有偏差的结果。\n\n#### 社会期望偏差\n\n社会期望偏差发生在人们希望表现得比实际更好的时候。例如，如果你在调查中询问人们洗澡的频率或回收垃圾的频率，你的数据就会存在偏差，因为没有人愿意承认自己做了社会不认可的事情。\n\
  \n换句话说，即使某人每两周才洗一次澡，他们也会告诉你他们每天或每三天洗一次，或者随便一个他们认为更容易被社会接受的数字。无论他们说什么，都很少会是真相。\n\n\
  \n\n### 现实世界中的抽样偏差\n\n前面的例子都很简单。不过，2016 年美国总统大选的民调就是一个很好的案例，展示了这些抽样偏差如何共同影响结果。另一个例子是英国脱欧。^(⁴⁸)\n\
  \n在这两个案例中，民调机构的结果并不那么准确。大多数关于事态的解释都围绕着抽样中的偏差。关于发生了什么，有各种各样的理论。\n\n例如，皮尤研究中心陈述如下：\n\
  \n> *一个可能的罪魁祸首是民意调查专家所称的* `无应答偏差`*。这种情况发生在某些特定人群系统地不回应调查，尽管调查面向所有选民群体提供了平等的机会。我们知道，有些群体——包括受教育程度较低的选民，他们在选举日是特朗普的关键支持群体——*\
  \ `一直是民调专家难以触及的对象`*。驱动特朗普竞选的沮丧情绪和反体制情绪，可能也与* `不愿回应民调` *相关。*^(⁴⁹)\n\n另一种理论认为，在线民调中存在自我选择偏差，即倾向于回答在线民调的人，更可能支持某一位特定候选人。还有一种假设是，支持另一方的人根本不希望参与民调。\n\
  \n这再次说明，统计可能出错，并非因为数学或模型本身，而是由于我们无法控制的因素，即抽样偏差。\n\n从某种程度上说，这类似于虚假相关，因为统计学是一门应用科学，并非在真空中运行。如果你没有正确的数据，没有正确的理论，你仍然可以得出一组数字，但它们毫无意义。\n\
  \n### 用推断统计撒谎\n\n那么，虽然用推断统计撒谎可能没那么容易，但那些抱有“这根本不可能”幻想的人可能会失望，因为确实可以做到。\n\n这在研究中尤为常见。当你检验一个假设时，你会得到一个`p\
  \ 值`，你需要它低于某个阈值，才能使检验具有统计显著性。通常这个阈值是 0.05。\n\n有一种关于“`p 值`崇拜”的理论^(⁵⁰)，认为有大量研究论文的`p\
  \ 值`都非常可疑地接近 0.05。本质上来说，它们刚好略低于 0.05，以便满足统计显著性的条件。这可能会使结果显著，但也只是勉强显著。\n\n这种理论认为，这是有意为之。在学术界，竞争非常激烈，人们必须发表论文，否则就会丢掉工作。因此，许多人迫于压力，要让自己的`p\
  \ 值`看起来比实际更显著。\n\n一种方法是通过反复进行实验直到得到你想要的结果，另一种方法是对数据进行处理。不过，在某些情况下，你可能会发现一些结果显著的研究，但研究者的意图并非欺骗，而可能是模型假设没有得到满足。\n\
  \n所有的模型和统计都有一些假设，不幸的是，有很多研究论文并没有恰当考虑这些假设。\n\n### 深度探讨：贝叶斯统计 vs. 频率学派统计\n\n你可能听说过`贝叶斯`这个术语。有很多模型都包含“贝叶斯”这个词：`朴素贝叶斯`、`贝叶斯网络`、`贝叶斯推断`等等。\n\
  \n所有这些都指向统计学背后的一种思想流派。这一切都始于英国数学家*托马斯·贝叶斯牧师*，他提出了这个简单的公式：\n\n```\nP(A|B) = P(B|A)\
  \ * P(A) / P(B)\n```\n\n这个公式描述了在事件 B 已经发生的情况下，事件 A 发生的概率。后来，皮埃尔-西蒙·拉普拉斯和哈罗德·杰弗里斯爵士进一步发展了这一理论，形成了如今贝叶斯统计学的基础。\n\
  \n贝叶斯统计学背后的一个主要思想是，可以将关于某事物的*先验*知识纳入我们的分析中，无论是模型还是显著性检验。另一方面，*频率学派统计学*（这是最流行的统计理论）不允许这样做，也不容纳这种情况。\n\
  \n因此，举个例子，假设你想进行一个实验来证明鬼魂存在。你有两个假设（鬼魂存在或不存在）。一位贝叶斯统计学家可以根据常识，事先为“鬼魂不存在”的假设分配一个非常小的概率。因此，在检验具有显著性之前，实验必须找到压倒性的证据来支持鬼魂存在的假设。而频率学派统计学家则没有这个选择。\n\
  \n让我们再看另一个例子。频率学派统计是基于无限次实验的概念构建的。例如，如果你抛一枚均匀硬币很多次（数千次或更多），那么抛出国徽面的实际概率将收敛于 0.5。\n\
  \n然而，这种类比如何适用于像足球比赛或选举这样的事件呢？这些事件是独一无二的。两个球队在特定时间点的一场比赛不会重复。即使重复，其背后的参数（例如，球员的疲劳程度或政党成员）也可能会改变。我们无法无限次地重复这些事件。在这种情况下，频率学派统计学家会遇到麻烦，但对贝叶斯统计学家来说就不是问题。在贝叶斯统计学中，概率表达的是事件发生的*主观信念*，而非重复实验。\n\
  \n贝叶斯统计学已被证明非常有用，并为机器学习的部分领域提供了理论基础。在统计学界，对于哪种理论最好，仍然存在许多分歧。在实践中，频率学派统计被更频繁地使用，但也有许多基于贝叶斯统计的应用。再次强调，关键在于为任务找到合适的工具！\n\
  \n脚注  \n1 2 3 4 5 6\n\n\n\n"
- "# 7. 机器学习简介\n\n不同研究者对机器学习给出了多种定义。以下是该领域几位著名学者的定义：\n\n> *机器学习是通过示例数据或过往经验，对计算机进行编程以优化性能标准的方法。*\n\
  > \n> ——埃瑟姆·阿尔帕伊登^(⁵¹)\n\n> *机器学习的目的是开发能够自动检测数据中模式的方法，并利用这些发现的模式来预测未来数据或其他感兴趣的结果。*\n\
  > \n> ——凯文·P·墨菲^(⁵²)\n\n> *模式识别领域关注的是通过计算机算法自动发现数据中的规律，并利用这些规律采取行动。*\n> \n> ——克里斯托弗·M·毕晓普^(⁵³)\n\
  \n虽然这些定义略有不同，但都涉及通过识别模式或其他方法从经验和数据中学习的算法。然后，它们会利用所学知识采取行动。\n\n让我们看一个简单示例，以便更好地理解机器学习的工作原理。在图\
  \ 7-1 中，我向你展示了一个由猫和狗图像组成的虚构数据集。\n\n![](img/490014_3_En_7_Fig1_HTML.jpg)\n\n十五张狗和猫的单色照片。\n\
  \n图 7-1\n\n 分类示例\n\n如果我让你分辨哪些图片是狗，哪些是猫，这简直易如反掌。但这是如何发生的呢？\n\n首先，你的大脑接触过大量猫和狗的图片，也在现实生活中见过这些动物的实例。通过来自家庭、学校和电视等渠道的无数次反馈，你训练自己具备了区分这两种动物以及其他动物的能力。\n\
  \n然而，整个过程并不像看上去那么简单。你的大脑经过数千年的进化，已经优化到能轻松做出这些关联判断。即使你对猫和狗一无所知，你的大脑也能迅速发现这两个实体看起来像是不同的动物。大脑能非常快速地整合这些图像，并立即理解到尽管它们各不相同，但都属于同一个物种。\n\
  \n但对于机器而言，这要困难得多。正因如此，机器学习才如此重要——它旨在模仿这一过程，并在机器中加以复现。\n\n## 机器学习的主要优势\n\n从数据中学习对人类大脑来说非常容易，但对机器来说却很难，因为这需要正确的算法和大量数据才能实现。\n\
  \n然而，机器擅长的是实现和自动化。一旦掌握了算法，机器就能轻松处理成千上万甚至数百万张图像，且不会感到疲劳，这是人类大脑无法做到的。\n\n这意味着你可以创造出具有超强能力的东西，即使我们谈论的只是像图像分类这样的狭窄应用领域。这也正是机器学习和大数据能成为如此强大组合的原因。\n\
  \n## 机器学习的类型\n\n现在，我们快速了解一下机器学习的不同领域（表 7-1）。机器学习的主要领域是监督学习和无监督学习。强化学习正在兴起，而推荐系统等相关领域也与机器学习有关联，但它们更为专业，不在本书的讨论范围之内。\n\
  \n表 7-1\n\n 机器学习的类型\n\n| 名称 | 用途 |\n| --- | --- |\n| 监督学习 | 使用模型 `M` 从输入 `X` 预测目标变量\
  \ `Y`。 |\n| 无监督学习 | 在变量 `X` 中寻找模式（聚类是最常见的例子）。 |\n| 强化学习 | 教会智能体如何优化环境中奖励函数。例如，一个视频游戏\
  \ AI 可以采取十种不同的行动，这些行动需要作为对环境的响应，以最大化达成目标（如最大化分数或击败人类玩家）。 |\n| 主动学习 | 带有人类主动反馈的监督学习。\
  \ |\n| 半监督学习 | 监督学习，其中部分示例没有标签。例如，一个包含 10,000 张图片的数据集，其中 1000 张没有标签，可以通过半监督学习技术进行分析。\
  \ |\n| 推荐系统 | 寻找一组用户可能喜欢的项目推荐给用户（例如，要看的电影、要买的产品、要听的歌曲）。与监督学习密切相关。 |\n\n### 监督学习\n\
  \n监督学习可分为分类和回归，两者非常相似。在监督学习中，算法会受到某种形式的监督。我们向算法提供原始数据集，同时也提供目标变量。后者可以是单个变量或多个变量。\n\
  \n然后，算法尝试理解如何将输入与输出匹配。例如，你向算法提供客户数据，然后它尝试判断某人是否会进行购买。\n\n监督者（Supervisor）监控算法的运行。每当算法犯错时，监督者会尝试纠正它。这基本上就像算法在老师的指导下学习。\n\
  \n### 无监督学习\n\n在机器学习的语境中，无监督学习通常指聚类。在这种情况下，我们向算法提供原始数据，但不提供目标变量，而是让算法自行其事，在提供的数据中识别模式。它试图寻找任何看起来有意义的规律，但不涉及监督。\n\
  \n这类学习是一个非常困难的问题，因为它定义不明确，并且几乎总是需要人工在流程的最终阶段进行解释。例如，算法可能会识别出与你试图解决的问题无关的模式，这就是为什么你需要深入分析结果并尝试更好地定义它们。\n\
  \n相比之下，监督学习则稍微容易一些，因为你可以运行算法并立即判断其工作效果。例如，你可以分析客户数据，并以 80% 的准确率预测留存率。这使得监督学习成为机器学习家族中最流行的领域之一。\n\
  \n值得注意的是，我们使用的某些术语，如分类、回归和聚类，在统计学和机器学习中都会用到。然而，即使这些术语指代的内容几乎相同，仍然存在一些差异。\n\n在统计学中，可解释性很重要，而在机器学习中则不太重要。同样，在机器学习中，我们关注算法的预测性能，而在统计学中这一点也很重要。\n\
  \n当比较统计学和机器学习的术语时，可能会觉得有点混乱，因为有些模型，如逻辑回归模型，属于分类模型，在机器学习的语境下也被视为分类模型。这些差异主要是两个领域发展历史不同造成的，所以如果你听到不同背景的人以略有不同的方式使用这些术语，不必感到困惑。\n\
  \n\n\n### 深入探究监督学习\n\n监督学习分为**分类**和**回归**两大类。两者之间的区别很简单。分类任务中，我们试图判断某个事物是否属于特定类别；而回归任务中，我们则试图预测一个实数。\n\
  \n分类模型的一个简单例子是判断一封电子邮件是否为垃圾邮件。这是每本机器学习入门教材中都会出现的经典任务。另一个常见的任务是图像识别或物体识别，例如“这是一张动物的图片吗？”或“这张图片中有人吗？”或“在这张图片的哪个位置可以找到人脸？”\n\
  \n分类也可以应用于其他领域。判断某只股票是上涨还是下跌就是其中一个应用，这通常被称为二元分类，因为只有两种类别——上涨或下跌。另一个应用是判断某人是否会点击广告，或者温度是否会升至零度以上。\n\
  \n在某些问题中，你也可以有多个类别。例如，如果你要预测选举结果，在大多数情况下，参与选举的政党会超过两个。在这种情况下，你可能会有四五个类别，每个类别代表一个参选的政党。\n\
  \n而回归则试图预测一个实数。因此，相比询问股票价格是涨是跌，我们试图确定两周后股票的价格。或者，如果我们试图预测客户对特定产品的需求，我们可以尝试推算出五天后的需求情况。又或者，与其判断某人是否会点击广告，我们更想知道会有多少人点击广告——这可能是相关的问题，但仍然是不同的问题。\n\
  \n温度也是如此。仅仅知道温度是否会上升这样模糊的概念可能无法满足你的需求，因此你可能会试图确定三周后的确切温度。\n\n这两种问题——分类和回归——出现在许多领域和不同的场景中。\n\
  \n需要注意的是，同一个问题可以用不同的方法来解决。假设我们为一家对冲基金工作，想要预测股票价格，以便从中获利。\n\n这个问题可以通过统计预测、机器学习回归、甚至分类（后者试图判断价格走势的方向，即上涨或下跌）来解决。\n\
  \n然而，每种方法的性能上限（即你能获得的最佳性能）是不同的。这会对你的策略产生不同的影响，具体取决于你想要达成的目标。\n\n例如，你可能首先尝试使用分类模型来预测股票价格。但你会意识到，这样一来你只能知道价格是涨还是跌。这并不适合直接交易，所以你可能会考虑差价合约交易作为替代方案。然而，你可能会决定采用难度稍高的回归模型，因为更高的利润值得你付出更多努力。\n\
  \n关键在于要理解，一个问题往往不是一个单一的问题，而是你主要问题中包含的一系列其他问题。可以把它想象成乐高模型。每个模型都是一个整体——一座城堡、一架直升机、一艘太空船——但它们是由独立的积木块搭建而成的。在这个语境下，问题就是由子问题或积木块构成的城堡。\n\
  \n同时，尝试多种方法以确定哪种对你的需求最有效，也是值得投入的。这再次如同那些多模型的乐高套装。你可以用不同的方式使用相同的积木，来达成你需要的成果。\n\n\
  唯一的区别是，与乐高套装不同，你没有说明书，甚至没有启发灵感的图片来指引你的旅程——你必须不断测试不同的组装方法，直到最终得到你需要的结果。\n\n不过，如果你身边有一位富有创造力的数据科学家来帮助你，那就好比手里有了乐高说明书和图片，会让事情变得轻松得多。\n\
  \n明智地选择你的“战场”也很重要。如果你发现回归模型能产生更好的性能，即使它更难实现，并且不是你最初的选择，切换到它以确保更好的结果仍然是个好主意。\n\n\
  ### 更好地理解无监督学习\n\n无监督学习是在没有任何指导的情况下从数据中学习模式。其主要应用是聚类，这是一种自动创建分组的方法，就像图 7-1 中的图像所示。\n\
  \n因此，你可以将一堆动物图片输入无监督学习算法，它可以在没有任何额外反馈的情况下自动将它们分成两类（猫和狗）。\n\n无监督学习算法在商业中最突出的应用之一是客户细分。因此，将客户数据输入算法，它会识别模式并相应地细分你的客户群。\n\
  \n另一个应用是异常检测，有些人认为这属于一个独立的类别，因为它不仅使用无监督学习，还借鉴了监督学习的一些技术。不过，我把它放在这里，是因为了解它的存在是很有必要的。\n\
  \n降维是另一个应用，它涉及将大量变量缩减为所谓的“因子”或超级变量。例如，你可以取 20 个变量，并将它们归入一个因子之下。这有点像聚类，但针对的是变量。这样做的主要原因是它能让数据更容易理解。\n\
  \n#### 聚类示例\n\n如前所述，无监督学习和聚类从根本上说都是非常困难的问题，主要是因为它们定义不明确。那么，假设我们得到了图 7-2 中的物体来进行聚类。\n\
  \n![一张包含不同水果和蔬菜的单色照片。](img/490014_3_En_7_Fig2_HTML.jpg)\n\n**图 7-2** 聚类示例\n\n问题在于聚类方法有很多种。你可以根据颜色进行聚类。或者，你可以根据类型聚类，即根据物体是水果还是蔬菜来划分。或者你可能想根据形状进行聚类。\n\
  \n然而，如果你想要根据颜色进行聚类，这并不意味着其他方法是错误的。所有模式都是有效的。问题在于它们是否有用，而答案取决于你的目标是什么。\n\n因此，聚类算法试图识别这些模式，但有时结果并不那么有用，或者与你需要的无关。这就是为什么你总是需要做一些实验才能得到正确结果。不过说到底，如果你知道自己在做什么，并尝试几种不同的算法，你最终会找到一种有效的算法。\n\
  \n无监督学习已经存在了几十年，因此有各种各样的非常强大的算法，如果数据中存在模式，它们就能识别出来。然而，重要的是要记住，仅仅因为你认为物体应该以某种方式聚类，并不意味着你尝试的第一个算法就会得出相同的结果。\n\
  \n\n\n#### 异常检测示例\n\n异常检测关注的是不同情境下的异常或反常行为。图 7-3 是一个时间序列图，通过运行异常检测算法，我们可以看到“puppy”一词的搜索量每年一月份都会出现峰值。\n\
  \n![](img/490014_3_En_7_Fig3_HTML.jpg)\n\n2010 年至 2015 年“puppy”一词搜索量的折线图。线条上下波动，每年都有高点标记。2014\
  \ 年搜索量最高。\n\n**图 7-3** 时间序列上的异常检测示例^(⁵⁴)\n\n这有什么用呢？如果你经营一家宠物店或一家狗收容所，你就可以知道什么时候是帮小狗寻找新家庭或增加小狗相关库存的最佳时机。\n\
  \n同样，这种分析被广泛应用于各种场景。它可以用于零售业中各类产品的分析，也可以用于分析社交媒体活动，以了解人们是否在谈论特定话题，以及某个话题是否引发了搜索量激增。\n\
  \n异常检测还广泛用于网络安全领域，用于检测黑客入侵。因此，如果发往服务器的流量中有 99%是正常的，而有 1%表现出异常行为，异常检测算法就会标记出可疑行为，以便采取相应措施。\n\
  \n#### 降维示例\n\n在图 7-4 中，你可以看到大五人格特质的概要。这是心理学领域最成功的理论之一。\n\n![](img/490014_3_En_7_Fig4_HTML.jpg)\n\
  \n一个列出了 5 种人格特质的图表：外向性、宜人性、尽责性、神经质和对经验的开放性。每种特质都有示例。\n\n**图 7-4** 大五人格特质概要\n\n那么，大五人格理论与降维有什么关系呢？这个理论是通过进行因子分析推导出来的，因子分析是最重要的降维技术之一。\n\
  \n该人格理论是人们在回答问卷中大量问题后，应用因子分析将这些因素归纳为五个整体因素的结果。如你所见，根据这一理论，人格被分解为：\n\n- 外向性\n- 宜人性\n\
  - 尽责性\n- 神经质\n- 对经验的开放性\n\n这是一个说明降维技术用途的绝佳例子。它有时也用于监督学习中，因为它可以去除数据中的噪声，但这更多是一个技术性问题。然而，它也可以应用于任何其他拥有大量变量的场景。\n\
  \n例如，在我的博士论文中，我研究了托特纳姆热刺足球俱乐部训练课中的 GPS 数据。我们使用的 GPS 设备收集了超过 100 个不同的变量，这让运动科学团队感到非常难以解读。因此，我采用了监督主成分分析，将它们减少到与伤病相关的五到六个因子，^(⁵⁵)这使得结果更容易理解。\n\
  \n如你所见，它可以应用于许多领域。没有什么能阻止你对用户人口统计数据或客户数据等进行同样的操作。\n\n#### 可解释机器学习\n\n机器学习常被称为黑箱，这并非没有道理。不仅算法对外行人来说可能难以理解，而且算法通常是为性能和预测能力而设计的，而不是为了可解释性。\n\
  \n然而，机器学习领域出现了一个新的细分方向，旨在改变这一切：可解释机器学习。\n\n可解释机器学习专注于提出技术和方法，以使机器学习模型更加透明。例如，一种简单的技术称为“代理模型”技术。将一个决策树拟合到更复杂模型（例如深度神经网络）的预测结果上。这个决策树即使不是数据科学家的人也能轻松解读，并且可以迅速帮助你找出最重要的变量以及它们之间的相互作用。\n\
  \n另外两种更先进的技术是`LIME`和 Shapley 值解释。`LIME`代表局部可解释的模型无关解释，是一种可以用来解释任何结果的技术。Shapley 值解释则是一种受博弈论启发的技术，用于理解每个变量的重要性以及它们在模型内部如何相互作用，从而得出特定结论。\n\
  \n在图 7-5 中，你可以看到例如`LIME`如何为文本分类器识别出最重要的单词。该文本分类器试图区分讨论无神论和讨论基督教的帖子。该算法可以生成不同单词的重要性列表，这些单词随后在文本中被高亮显示。\n\
  \n![](img/490014_3_En_7_Fig5_HTML.jpg)\n\nLIME 解释的截图。预测概率分别为：无神论 0.58，基督教 0.42。在无神论一栏中，posting\
  \ 为 0.15，host 为 0.14，N N P P 为 0.11，edu 为 0.04，have 为 0.01，there 为 0.01。在下一部分中，文本中的\
  \ edu、N N T P、posting、host、there 和 have 被高亮。\n\n**图 7-5** `LIME`如何检查特征重要性的示例^(⁵⁶)\n\
  \n随着算法越来越多地被用于我们生活的方方面面来做决策，可解释机器学习方法将变得越来越重要。你可以通过以下链接了解更多信息：[`https://thedatascientist.com/interpretable-machine-learning/`](https://thedatascientist.com/interpretable-machine-learning/)\n\
  \n脚注 1 2 3 4 5 6\n\n"
- "# 8. 人工智能导论\n\n人工智能（AI）是一个总括性术语，涵盖了一个非凡的计算机科学领域，致力于创建能够执行此前需要人类智能才能完成的任务的系统。从古代自动机的神话，到驱动我们数字世界的现代算法，创造智能机器的追求一直是人类雄心的一部分。\n\
  \n自诞生以来，AI 的概念已经发生了显著的演变。它始于模拟人类智能的大胆梦想，如今已成为日常技术中不可或缺的一部分。无论是流媒体服务的微妙推荐、虚拟助手的动态响应，还是补全我们句子的预测性文本，AI\
  \ 已将自己编织进我们日常生活的结构中。\n\nAI 的发展历程既有振奋人心的突破，也有被称为“AI 寒冬”的停滞期。然而，每一次解冻，都伴随着人类突破机器能力边界的执着追求，带来了新的活力和进步。\n\
  \n今天，AI 处于创新的前沿。先进算法的发展和计算能力的指数级增长，使 AI 迅速从学术论文走向实际应用。我们现在正目睹 AI 执行着曾经被认为机器不可能完成的任务，从诊断疾病到驾驶汽车。\n\
  \n随着 AI 的持续进化，它挑战着我们对机器和工作的传统理解，既引发了敬畏，也促使我们对它所塑造的未来进行反思。本章旨在揭开 AI 的神秘面纱，追溯其历史根源，解释其基本原理，并展示它为我们未来带来的变革性影响。\n\
  \n## AI 的演变\n\n\n\n### 早期岁月：基础与图灵测试\n\n人工智能的基础奠定于 20 世纪中期，那是一个充满乐观精神、渴望复制人类认知的时代。被誉为现代计算机之父的数学家艾伦·图灵，于\
  \ 1950 年提出了`图灵测试`，用以衡量机器展现出与人类等同或无法区分的智能行为的能力。图灵的工作为后来的人工智能研究注入了动力，而 1956 年的达特茅斯会议则正式标志着\
  \ AI 作为一个研究领域的诞生。早期 AI 研究聚焦于问题求解和符号主义方法，致力于将人类知识和推理编码为基于逻辑和规则的系统。\n\n### AI 寒冬：失落的时期\n\
  \nAI 的发展历程并非一帆风顺。该领域经历了数次“寒冬”，这些时期以预期未达成导致的资金和兴趣大幅下滑为特征。第一次寒冬发生在 20 世纪 70 年代，起因于詹姆斯·莱特希尔爵士发布的一份报告，该报告批评了\
  \ AI 领域过于雄心勃勃的承诺，导致研究经费削减和整个领域普遍感到失望。第二次寒冬紧随其后，发生在 80 年代末至 90 年代初，当时现有技术的局限性日益凸显，资金再次枯竭。\n\
  \n### 复兴：互联网、算力与大数据\n\n随着互联网的出现和大数据的爆发，AI 的命运开始扭转。海量可用数据成为了新机器学习算法的燃料，这些算法不再需要手工编写规则，而是可以直接从数据中学习。与此同时，计算能力的飞速提升，尤其是图形处理单元（GPU）的问世，使得更复杂的模型能够更快地得到训练。\n\
  \n这些技术进步，加上神经网络和深度学习的突破，促成了 21 世纪 AI 的复兴。这次复兴不仅重燃了人们的兴趣，还让 AI 系统在特定任务上达到了甚至在某些情况下超越了人类水平的表现，将我们带入了一个\
  \ AI 应用似乎无边无际的时代，从自动化日常任务到推动量子计算研究，无不涉及。\n\n## AI 中的基础概念\n\n### 机器学习：现代 AI 的核心\n\
  \n机器学习（简称 ML）是当代 AI 的基石，其核心理念是系统可以从数据中学习、识别模式并在最少人工干预下做出决策。这种从显式编程到数据驱动学习的范式转变，对\
  \ AI 的成功至关重要。通过使用能够从数据中迭代学习的算法，ML 使得 AI 能够开发出预测模型，这些模型广泛应用于从电子邮件过滤到医疗保健中复杂诊断的无数场景。\n\
  \n### 深度学习：神经网络在行动\n\n深度学习是 ML 的一个子集，其灵感来源于人脑中信息处理的模式。它利用被称为神经网络的算法，这些算法由类似于神经元的层级结构组成。这些网络能够自主学习并做出智能决策。深度学习对于推动\
  \ AI 发展至关重要，它使机器能够识别图像、理解口语，甚至生成类似人类的文本。这些网络的深度（通常由许多层组成）使其能够以前所未有的复杂性和抽象程度处理数据，从而推动了计算机视觉和语音识别等领域的进步。\n\
  \n### 自然语言处理（NLP）：理解人类语言\n\n自然语言处理是 AI 发展历程的见证，它处理的是计算机与人类语言之间的交互。`NLP`结合了计算语言学（对人类语言的基于规则的建模）与统计模型、机器学习和深度学习模型。这些技术使计算机能够处理和分析大量的自然语言数据。其结果是能够执行诸如文本翻译、回答问题以及文档摘要等任务。`NLP`是\
  \ Siri 和 Alexa 等虚拟助手以及谷歌翻译等翻译服务的核心，它们与人类用户的交互正变得日益无缝。\n\n`NLP`领域因大型语言模型（LLM）的出现而发生了变革。LLM\
  \ 是一种深度学习模型，旨在以高度复杂的方式理解、生成并有时翻译人类语言。像 GPT（生成式预训练 Transformer）和 BERT（来自 Transformer\
  \ 的双向编码器表示）这样的 LLM，利用海量的文本数据来学习语言模式、细微差别和上下文关系。这些模型能够执行各种复杂任务，包括语言翻译、问答、文本摘要甚至内容创作，其精细程度日益接近人类水平。\n\
  \n## AI 中 Transformer 的到来\n\n人工智能从早期阶段发展到今天复杂的系统，是技术史上非凡的一章。随着 2017 年研究论文《注意力就是一切》的发表而诞生的\
  \ Transformer 网络，是自然语言处理（NLP）领域的一大步。它采用了并行数据处理和注意力机制，有助于更好地理解和生成语言。\n\n这种注意力机制是一项关键特性，它允许模型聚焦于数据的不同部分并赋予其不同的重要性权重。它改进了机器理解语言上下文的能力（图\
  \ 8-1）。\n\n![](img/490014_3_En_8_Fig1_HTML.jpg)\n\n以查询词为纵轴、关键词为横轴绘制的句子“`the quick\
  \ brown fox jumps over the lazy dog`”的概率得分矩阵。`(the, the)`、`(fox, fox)`和`(jumps,\
  \ jumps)`的值为 0.9。`(dog, dog)`的值为 0.8。\n\n**图 8-1** 实践中的注意力机制\n\n在 Transformer 网络的基础上，像\
  \ OpenAI 的 GPT 和谷歌的 BERT 这样的大型语言模型（LLM）扩展了文本生成和解释的范围。这些模型能够生成从文章到代码的文本，展示了其广泛的适用性。特别是`BERT`，它提升了搜索引擎和机器人理解查询并做出回应的方式。\n\
  \n其他模型，包括`RoBERTa`、`DistilBERT`和`T5`，已经改进或重新构想了 Transformer 模型，使其更高效或更通用。`XLNet`在`BERT`的基础上进行了构建，以提升在一系列语言任务上的性能。\n\
  \n在对话式 AI 领域，`ChatGPT`做出了显著贡献，特别是通过利用人类反馈来生成更自然的对话。谷歌 Bard 虽然在其公开描述中细节较少，但预计将借助谷歌的`LaMDA`把广泛的知识带入对话语境中。\n\
  \n这些 Transformer 模型的引入开启了人工智能与人类智能合作的新篇章，AI 在创造性和智力追求中扮演着更积极的角色。这种伙伴关系预计将在各个领域带来重大变革，提升我们应对复杂挑战的方式。\n\
  \n\n\n## 生成式 AI 的崛起\n\n让我们探索生成式模型的复杂世界，特别是生成对抗网络（`GANs`），并深入探讨它们在图像处理和人工智能中的作用。\n\
  \n在图像处理领域，卷积神经网络（`CNNs`）已成为模式识别的基础。这些网络擅长对图像和视频中的物体进行分类和识别，这项技能对于从社交媒体滤镜到医疗诊断等众多应用至关重要。`CNNs`\
  \ 利用卷积运算来过滤和解读视觉数据，提取对准确分析至关重要的显著特征。\n\n生成对抗网络（`GANs`）由伊恩·古德费洛及其团队于 2014 年提出^(⁵⁸)，代表了一类革命性的机器学习框架，其原始论文已被引用超过\
  \ 6 万次。它由两个神经网络——生成器和判别器——组成，它们进行一场竞技博弈，从而促进生成越来越逼真的合成数据。生成器负责创造新的数据实例，而判别器则评估其真实性，推动数据生成的持续改进和完善。\n\
  \n`GANs` 的 versatility 在各个领域都显而易见。例如，艺术界受益于 `GANs` 通过分析现有艺术品海量数据集来合成新作品的能力。时尚和广告行业利用\
  \ `GANs` 构思新颖的设计和图像。值得注意的是，`GANs` 还催生了深度伪造技术，即通过逼真的视频或图像将一个人的肖像叠加到另一个人身上，这既引发了人们的兴趣，也带来了伦理担忧。\n\
  \n### 稳定扩散与 DALL-E：图像生成的演进\n\n`Stable Diffusion` 模型标志着 AI 图像生成的另一个重要里程碑。`Stable\
  \ Diffusion` 及其同类模型（如 `DALL-E 2`）以生成细节和品质出众的图像而闻名，它们建立并超越了 `GANs` 的能力。`DALL-E 2`\
  \ 是其前身（最初采用 `GANs`）的演进版本，采用了稳定扩散方法，在 OpenAI 对扩散模型有效性的广泛研究以及 `CLIP` 的基础上，创造了更加多样化和高保真度的图像。\n\
  \n`DALL-E 2` 及其同代模型，如 `Mid-Journey` 和 `Stability.ai`，通过实现从文本提示合成图像，彻底改变了创意 AI 领域。这些模型为艺术家和设计师提供了工具，使他们能够以前所未有的精度和艺术性来构思和渲染视觉概念。\n\
  \n扩散模型的工作原理是通过一个逆转扩散的过程，逐步将样本从简单分布（如高斯噪声）转化为复杂的数据分布（如自然图像的分布）。扩散过程通常涉及在多个步骤中向数据添加噪声，直到数据完全随机化。然后，模型学习逆转这一过程，有效地进行“去噪”，从而从噪声中生成新的数据样本。\n\
  \n`GANs`、`CNNs` 以及 `Stable Diffusion` 和 `DALL-E 2` 等先进模型的融合，展示了 AI 在生成和完善视觉内容方面取得的显著进展。随着这些技术的持续发展，它们有望重塑众多行业，提供新颖的解决方案，并增强人类创造力与\
  \ AI 创新之间的协同作用。\n\n![一幅 AI 生成的插画，描绘了一条河流，河中有陆地动物站在水下，鸟儿飞翔，山脉覆盖着冰雪，树木以及日落时的一轮巨大月亮。](img/490014_3_En_8_Fig2_HTML.jpg)\n\
  \n**图 8-2**\n`Stable Diffusion` 可以创建非常逼真且多变的图像。上图是使用 `DALL-E` 创建的。\n\n## AI 的应用\n\
  \n### 医疗保健\n*   AI 辅助诊断^(⁵⁹)：`IBM Watson for Oncology` 是一个革命性的 AI 系统，通过分析医学图像和患者数据，提供个性化的癌症治疗建议。其在癌症诊断方面的准确性可与人类肿瘤学家相媲美。\n\
  \n    `IBM Watson for Oncology` AI 系统\n\n*   AI 驱动的药物发现^(⁶⁰)：AI 公司 `BenevolentAI`\
  \ 利用机器学习技术识别新的药物靶点，并开发新的疾病治疗方法。他们已与制药公司合作，以更快、更有效的方式将新药推向市场。\n\n### 金融\n*   欺诈检测^(⁶¹)：领先的金融服务公司\
  \ `Mastercard` 采用 AI 分析交易数据，以 99%的准确率识别欺诈活动。其 AI 系统显著减少了欺诈损失，并增强了持卡人的安全性。\n\n  \
  \  `Mastercard` AI 系统\n\n*   风险评估^(⁶²)：知名的金融信息和分析提供商 `S&P Global` 利用 AI 评估公司和借款人的信用状况，其表现优于传统的信用评级方法。其\
  \ AI 系统提高了风险评估的准确性，并降低了金融风险。\n\n### 零售\n*   产品推荐^(⁶³)：亚马逊的 AI 系统由机器学习算法驱动，根据客户的购买和浏览历史向其推荐商品。这种个性化方法提升了客户参与度，增加了销售额，并改善了整体购物体验。\n\
  \n    亚马逊 AI 系统\n\n*   需求预测^(⁶⁴)：全球零售巨头 `Walmart` 利用 AI 预测其门店的产品需求。这种预测能力改善了库存管理，降低了成本，并确保了产品的可供性。\n\
  \n### 交通运输\n*   自动驾驶汽车^(⁶⁵)：自主车辆技术先驱 `Waymo` 开发的自动驾驶汽车已在公共道路上行驶了数百万英里，证明了其安全性和可靠性。他们的自动驾驶汽车有潜力彻底改变交通运输，提供更安全、更高效、更便捷的出行方式。\n\
  \n    `Waymo` 自动驾驶汽车\n\n*   交通优化^(⁶⁶)：全球技术领导者 `IBM` 开发了一款 AI 系统，用于分析交通数据并推荐交通信号灯配时调整。这种方法可将拥堵程度降低高达\
  \ 10%，从而改善交通流量，减少出行时间，并节省燃料。\n\n### 农业\n*   精准农业^(⁶⁷)：领先的农业设备制造商 `John Deere` 开发了诸如\
  \ `See & Spray` 技术等 AI 驱动工具。这一创新系统使农民能够将除草剂喷洒精准靶向特定植物，将除草剂使用量减少高达 90%，从而最大限度减少对环境的影响，并促进可持续农业实践。\n\
  \n*   作物产量优化^(⁶⁸)：由 `Agrible` 开发的 AI 系统 `AgribleFarmhand` 分析天气模式、土壤质量和作物健康数据。该综合分析为最佳种植时间、灌溉需求和虫害管理提供了见解，从而提高了作物产量和质量，并提升了农业生产力。\n\
  \n### 制造业\n*   预测性维护^(⁶⁹)：工业巨头 `GE` 开发了诸如 `Predix` 等 AI 驱动系统。这一预测性维护工具能够监控设备性能并预测潜在故障。这种主动方法能够实现预防性维护，减少停机时间，最小化生产中断，并优化制造流程。\n\
  \n    `GE Predix` AI 系统\n\n*   质量控制^(⁷⁰)：领先的机器人公司 `ABB` 和 `FANUC` 开发了具备 AI 能力的机器人，能够对制造产品进行视觉检查和缺陷检测。这些智能机器人确保了产品质量和一致性，维持了高制造标准，并减少了产品缺陷。\n\
  \n## AI 发展时间线\n\n\n\n* 2000 年代初—机器学习的兴起：对机器学习的兴趣重新燃起，`SVM`（支持向量机）和`Random Forest`（随机森林）等算法在分类和回归任务中广受欢迎。\n\
  * 2006 年—深度学习崛起：“深度学习”概念被提出，标志着向深层架构神经网络的转变。\n* 2009 年—ImageNet 与计算机视觉的进步：`ImageNet`数据集发布，极大地推动了计算机视觉领域的发展。\n\
  * 2012 年—深度学习的突破：`AlexNet`在 ImageNet 挑战赛中获胜，展示了深度学习在图像识别方面的强大能力。\n* 2014 年—序列学习与\
  \ LSTM 网络：`LSTM`网络的改进提升了语音识别和机器翻译的性能。\n* 2015 年—AlphaGo：谷歌 DeepMind 的`AlphaGo`于\
  \ 2016 年击败一位职业围棋选手，展示了人工智能的战略能力。\n* 2016-2017 年—人工智能产业化：人工智能开始更深入地融入各行各业，应用领域广泛。\n\
  * 2018 年—人工智能伦理与偏见：人们对人工智能伦理的关注度提高，包括算法中的偏见和公平性问题。\n* 2019 年—GPT-2 与 NLP 进步：`GPT-2`的发布，是自然语言处理领域的一次重大进步。\n\
  * 2020 年—GPT-3 与人工智能的广泛采用：`GPT-3`的发布，展示了大型语言模型的潜力。\n* 2020 年—AlphaFold 2：谷歌 DeepMind\
  \ 的`AlphaFold 2`是计算生物学领域的重大突破，能够高精度预测蛋白质的三维结构。\n* 2021 年—人工智能在疫苗研发中的应用：人工智能在新冠疫苗的快速研发中发挥了关键作用，通过分析海量数据来设计靶向疫苗。\n\
  * 2021 年—自动驾驶与机器人出租车的进展：自动驾驶技术趋于成熟，行业开始测试无人驾驶汽车并推出机器人出租车服务。\n* 2022 年—ChatGPT：`ChatGPT`推出，将`GPT-3`集成到对话式\
  \ AI 框架中，实现了复杂的对话系统。\n* 2023 年—GPT-4：`GPT-4`发布，增强了理解和生成复杂文本的能力，进一步推动了自然语言处理的发展。\n\
