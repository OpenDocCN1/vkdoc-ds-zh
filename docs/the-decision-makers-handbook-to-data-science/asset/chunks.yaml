  raw: '#### Understanding and Using Dark Data


    Dark data is operational data that is not being used, such as log files, notes
    from sales calls or emails, and similar information.


    This type of data is relevant because there’s a lot of it and it’s sitting there
    gathering dust. Deloitte reports that by 2020 we’re going to have 44ZB of data.^([^(85)](#fn85))
    This figure might not be 100% accurate, but it’s still a huge amount of data.
    Note that many of the sources of data aren’t specified; it includes audio, notes,
    video, image files, and so on.


    Also, Deloitte has a special mention for the Internet of Things and other non-traditional
    sources. This type of data is easy to collect but it’s not always used. So, it
    very quickly becomes dark data and just sits in a data warehouse waiting for someone
    to make sense of it.


    ##### What Can Dark Data Do for You?


    There are a number of things dark data can do for you, but it’s not easy to provide
    a general set of guidelines that will apply in every situation. However, here
    are a few examples.


    So, you might have some email address. In some cases, you can extract gender and
    age from email addresses or visitor behavior from log files or sentiment from
    customer calls. Then, you can create predictive models for user retention from
    the usage logs or customer logs, for example. This is just one example and there
    are countless possibilities.


    Keep in mind that the unstructured nature of data can make it difficult to use.
    However, if you can do it, it can be very rewarding.


    ### Other Steps to Take to Become More Data Driven


    As mentioned, you need to create an open culture that promotes strategy and innovation.
    A champion can be a vital asset as they help motivate employees.


    There are a number of ways you can create this kind of culture. You can, for example,
    organize internal hackathons once or twice a month or allow employees to play
    around with an idea of their own. Other companies have done this successfully,
    and it works because it keeps people happy and engaged.


    Another interesting approach is to use Kaggle to create internal competitions.
    This works if you have a very large number of data scientists within your company.
    It gives people an opportunity to have some fun and learn something new.


    Finally, if you can, open up your data and allow your employees to invite other
    people to take part in small projects. Of course, this doesn’t apply for every
    company. However, if you can, it can be a great way to find new talent.


    ### Rewarding Good Behavior


    When it comes to rewarding good behavior, employees with good ideas need some
    form of recognition. Maybe you publish their results on a blog, or you make libraries
    and software open source and attribute the developers. This is what large organizations
    in the field are doing.


    For example, Google^([^(86)](#fn86)) and Facebook^([^(87)](#fn87)) have their
    own research blogs. Facebook also has a forecasting library called Prophet^([^(88)](#fn88))
    when you can read an article written by the people within the company who created
    the library.


    This is an excellent approach because everyone wants to be rewarded for their
    contribution to something new and amazing. And there’s no reason for them to be
    anonymous. Their names are right there. Plus, data scientists like to look into
    the future. If they want to get another job, it’s good for them to know that a
    new employer can easily find them and their work online. This is why data scientists
    and software developers also have GitHub accounts.


    So, it’s not just about the bonuses, it can also be about the ego.


    ### Create an Embedded Culture


    Finally, one of the most important things to do when trying to build the right
    culture for data science is to create an embedded culture. This means that you
    want the data scientist to work closely with other divisions and you want to have
    good communication between all parties, as well as full transparency.


    Stand-ups where people share what they are working on are a pretty standard way
    of promoting communication and transparency. However, be careful, because daily
    stand-ups can get irritating because of the slow nature of a data scientist’s
    work. It isn’t incremental, and the last thing you want is to have a bunch of
    introverts feeling uncomfortable because they have no results to show. This is
    why weekly stand-ups might be a better option.


    You also should consider mentorship programs for new data scientists. Junior data
    scientists can be very enthusiastic, and sometimes you can find amazing talent
    from some good universities who might be a bit inexperienced. This might be their
    first real job, so it’s a good idea to have a senior data scientist educate them
    and mentor them, which will allow them to become great.


