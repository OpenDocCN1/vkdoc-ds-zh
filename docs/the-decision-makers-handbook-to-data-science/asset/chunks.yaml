    # 别被夸大的宣传冲昏头脑！


    这一点至关重要。在计算机科学领域，新技术层出不穷，每隔几年就会有新奇闪亮的东西冒出来。例如，在大数据领域，我们见证了 NoSQL 数据库的发展，而机器学习则催生了深度学习。


    尽管这些技术极为强大，但它们的诞生是为了解决特定问题。问题在于，有些公司希望你购买他们全新的闪亮产品和服务，他们会想尽一切办法说服你你需要它们，即使你压根不需要那么尖端的技术。


    这是一个相当普遍的问题。例如，有太多公司明明并不需要，却在使用 NoSQL 解决方案。当然，这并不意味着你永远不该使用这些技术。它只是提醒你应该三思而后行，确保自己真的需要它们。


    举例来说，NoSQL 通常假设你需要存储海量数据，并且很难用表格结构来表达这些数据。因此，如果你的数据量并非大得离谱，那么采用 NoSQL 可能就不太明智。此外，选择合适的
    NoSQL 数据库也并非易事。只需上网搜索一下^(⁴¹)，就能找到十多种不同的选择，而且新的还在不断涌现。在某些情况下，使用 NoSQL 解决方案是完全合理的（例如图数据，或者当你需要存储社交媒体帖子时），但不要不经思考就直接采用。在大多数情况下，使用一些简单的
    SQL 实现，例如 `MySQL` ^(⁴²)，就完全足够了。


    深度学习的例子也是如此。它是项伟大的技术，但只应在特定场景下应用，比如处理图像、音频和视频。否则，它会消耗大量的计算资源，这意味着开发和训练一个深度神经网络既昂贵又耗时。


    换句话说，不要仅仅因为某项技术新颖闪亮，或者某个口齿伶俐的销售代表花了大量时间说服你非用不可，就去使用它。相反，你应该退一步，客观地审视自己是否真的需要这类技术。


    如果不需要，更好的选择是采用一个经过更长时间检验的、值得信赖的解决方案，因为它已经过全面测试并证明确实有效。另外，聘请掌握这类技术的人才也会更容易，因为拥有相关专业经验的人更多。


    ## 提前设定目标


    *没有计划就等于计划失败*。这是我在谈论数据策略时最喜欢用的短语之一。


    如果之前我还没把这点说清楚，那么我再说一遍：提前思考你未来可能想用这些数据做什么，是至关重要的。


    提前想清楚解决一个问题可能需要哪些数据，这绝非易事，而且需要时间。然而，静下心来认真思考是绝对值得的。


    例如，为了给你的应用打造一个出色的推荐系统，你可能需要 20 个变量。如果你没有花时间去思考，你可能只收集到了其中 3 个变量。反过来，如果你确实坐下来提前规划，你可能能收集到
    15 个变量。虽然没到完整的 20 个，因为没人能预测一切，但这依然比只有 3 个要好得多。


    如果你真的毫无头绪，或者没有时间进行这项功课，那么在开始收集数据之前，雇一位数据科学家来咨询一下。采取这种方法也至关重要，因为数据收集和数据科学可能会与你业务和商业模式的其它部分相互作用。这只会占用数据科学家几天的时间（这意味着你不需要花太多钱），而且绝对物有所值。


    ## 数据科学与数据收集对业务影响的实例


    在本节中，我们将看一些例子，了解数据收集和数据科学如何影响你的用户界面，甚至催生出截然不同的商业模式。


    ### 数据科学与在线约会


    假设你有一个面向消费者的约会类应用，并且需要为你的应用创建一个推荐系统^(⁴³)。


    想想看流行的约会应用 Tinder 和流行的约会网站 OkCupid。如果你不熟悉这些应用也没关系，但它们是非常好的例子。


    从数据科学或机器学习的角度来看，在线约会的核心问题就是确保系统做出正确的推荐。


    例如，Tinder 采取了一种相当简单的方法。你可以在某个人的个人资料页面上向左或向右滑动，以此告诉系统你是否喜欢对方。然而，你能获取的数据并不多。你可以看到他们的照片、名字、年龄，可能还有几张其他照片，但仅此而已。


    另一方面，OkCupid 则采取了一种深入得多的方法。他们设计了一份包含大量问题的问卷。当我说大量时，我指的是真的非常多的问题。这份问卷深入挖掘你的偏好、观点和个性。然后，他们利用问卷的答案将人们相互匹配。


    如果你是一名数据科学家，想为婚恋匹配创建一个推荐系统，你可能会做类似 OkCupid 所做的事情。


    但是，你必须考虑到一个事实：OkCupid 的使用难度要大得多。这个网站会问你上百个问题，你需要花不少时间才能全部答完。所以，从数据科学的角度来看，OkCupid
    是数据科学家的梦想。OkCupid 拥有的数据是如此详尽，以至于他们还发表了关于人类性取向和浪漫偏好的研究论文。^(⁴⁴) 然而，这并不一定能带来最流畅的用户体验。


    相反，Tinder 可能永远无法拥有一个优秀的推荐系统，因为他们没有收集到足够的数据来开发它，但他们确实提供了出色的用户体验。他们的重点就在这里，这一点很容易看出来，因为用户只需花费很少的时间就能筛选大量个人资料。


    两者之间并非必然孰优孰劣，只是路径不同。但重要的是，这两个系统清晰地展示了数据科学和数据收集如何影响用户界面、用户体验，甚至整个商业模式。


    而且需要指出的是，OkCupid 和 Tinder 都取得了巨大的成功。所以，这不是谁对谁错的问题；关键在于你是否愿意花时间去思考，在你的业务中，这套逻辑是如何运作的。

    '
- fmt: '### Data Science and Entertainment


    Another example is of B2C apps in the entertainment space, more specifically,
    concert-finding apps. Recommender systems make it easy to demonstrate how all
    the different elements interact, which is why we are focusing on them.


    With a concert finder, you can scroll through the list of local shows. You tap
    on a specific show; you have a number of options. You can state that you’re attending,
    you can say maybe you’re attending, you can get tickets, or you can share on Facebook
    or Twitter.


    From a user perspective, this might not seem like important information. But for
    a data scientist, it’s a wealth of data—it’s like hitting the jackpot.


    Every action demonstrates a different kind of involvement. Someone who clicks
    “I’m attending” is definitely more interested and involved than someone who only
    says “Maybe.” And then there is the combination of actions.


    Someone might state they are attending and then also share the concert on Facebook,
    which clearly shows that they really, really love that music and/or performer.


    So, the important part is that all this data is stored in a database and can be
    analyzed to garner important and valuable insights. A data scientist will be able
    to see all these actions and combination of actions and draw conclusions that
    will benefit how the recommender system works.


    For example, if someone states they will be attending a Beyoncé concert, gets
    tickets, and shares on both Facebook and Twitter, then they’re going to want to
    know about every possible Beyoncé concert—in some cases, even if it’s not a local
    concert.


    However, someone else who simply says they might attend and eventually does get
    tickets but doesn’t share might not be as interested. While you will definitely
    include local Beyoncé concerts in their recommended list, it might not make sense
    to tell them about concerts outside their area because they aren’t such an avid
    fan.


    So, this information could help a data scientist understand how important the
    different actions are, for example. This can, of course, be used to later improve
    the recommendations the system provides.


    It can also be used to understand how to convert those who said “Maybe” into ticket
    buyers. A company could send them offers or rewards or use different methods to
    change their mind.


    This shows how certain aspects of a UI might mean very little to the end user
    but can be a treasure chest of vital information for a data scientist and can
    have a significant impact on the success of your business.


