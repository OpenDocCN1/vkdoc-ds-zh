- fmt: '`# Deep Learning`


    Deep learning is the field of research that studies *deep neural networks*, which
    is a neural network with multiple layers. A neural network will have one or two
    layers, whereas deep neural networks have many more (Figure [1-2](#490014_3_En_1_Chapter.xhtml#Fig2)).


    ![](images/490014_3_En_1_Chapter/490014_3_En_1_Fig2_HTML.jpg)


    A diagram of simple neural and deep learning neural networks. Simple neural network
    has 1 input layer, 1 hidden layer, and 1 output layer. Deep learning neural network
    has 1 input layer, 4 hidden layers, and 1 output layer.


    Figure 1-2


    Example of a regular neural network vs. a deep neural network


    Geoffrey Hinton, a British cognitive psychologist and computer scientist, who
    is regarded as the “Godfather of Deep Learning,” discovered it was impossible
    to get his research into neural networks published, so he had to devise a new
    term that was “cooler.”^([^(23)](#fn23))


    Neural networks consist of neurons and the pathways that connect them in the human
    brain. Since the brain is the most powerful computing machine known to man, it
    makes sense to attempt to emulate its architecture, which led to the creation
    of artificial neural networks.


    Neural networks have traditionally consisted of three layers: an input layer,
    a middle layer, and an output layer. The middle layer is what provided the neural
    networks with the power to perform non-linear computations and turned them into
    powerful learning machines.


    The idea behind deep learning had been around for decades.^([^(24)](#fn24)) However,
    it was believed that adding more layers was not really useful. Furthermore, it
    was difficult to train these networks.


    Deep learning takes advantage of artificial neural networks to enable machines
    to learn faster, more accurately, and at scale. Thus, it is used to help develop
    solutions to many issues that were previously unsolvable, such as speech recognition,
    computer vision, and natural language processing.


    For example, applications like Siri or Cortana are able to understand what you
    want thanks to deep learning. Image recognition, for example, can help you find
    furniture you see in the real world. Just take a picture of the piece and the
    app will find it online for you.


    Thanks to deep learning, machines can also identify different subjects in a photo—like
    differentiating between a human, a horse, a cat, or a dog. It can also be used
    to automatically color photos, and, more recently, to automatically remove the
    background of a photo, which many designers will be extremely grateful for.


    It is also being used to generate text automatically. In other words, thanks to
    deep learning, your computer can listen to what you’re saying and turn your words
    into text.


    Basically, deep learning can do a lot of really cool stuff!


    But how does it do that and why it works so well? The multiple layers of a deep
    neural network allow it to extract *hierarchical features*. Our visual system
    is organized hierarchically. Our brain picks up simple blobs and edges, before
    it picks up shapes (such as squares and circles) and then moves on to facial features
    or other more advanced concepts. Deep neural networks essentially mimic this functionality.
    If we take a look at the kind of processing that the middle layers of deep neural
    network are doing, then we can see that they extract a hierarchy of features.
    This is why deep neural networks have been so successful in computer vision and
    language applications. These are domains which, by nature, are dominated by hierarchical
    features. ConvNet Playground^([^(25)](#fn25)) has a model explorer that allows
    you to see how the different layers of Inception (a famous deep neural network)
    create more and more complicated representations of an image as the network gets
    deeper.


    However, deep neural networks are not a cure-all.^([^(26)](#fn26)) If the domain
    is not characterized by multiple interacting variables, or by hierarchies of features,
    or there is not enough data, then deep neural networks are probably an overkill.
    So, if, for example, you have a dataset of 1000 rows and ten variables, you are
    much better off using a simpler model (e.g., linear regression), since this model
    will train faster, and it is less likely to *overfit*.


    Overfitting^([^(27)](#fn27)) is the bane of all machine learning algorithms, and
    refers to a situation where the performance in the real world is much worse than
    during training. More complicated models can suffer from this problem. This is
    why deep neural networks require excessive tuning and testing to make sure they
    work well.


    ## Statistics


    The other core field of data science, statistics, is a branch of mathematics that
    started around the 18th century and was the first attempt to systematically analyze
    data. It produced the cornerstones of all modern data analysis, including summary
    statistics, regression and classification, significant testing, forecasting, and
    more.


    ### What Makes Statistics Unique?


    Statistics generally deals with smaller samples, in large part due to historical
    reasons. The Internet makes it possible to collect a lot of data nowadays, but
    in the “olden” days, data usually had to be collected in person, which is why
    sample sizes were so small.


    The results were then extrapolated to the entire population with a margin of error.
    Also, consider that it was developed in the 17th century, which meant everything
    had to be calculated by hand.^([^(28)](#fn28)) Solving a model would take days
    or weeks.


    Statistics is also very strict on model assumptions and development, because it
    is rooted in math. It’s almost like classic AI in this sense. This gap did narrow
    after parts of machine learning were founded on Bayesian statistics.


    However, the mentality still differs. In machine learning, it’s all about getting
    it done and asking questions later. In statistics, though, assumptions must be
    validated and verified before anything else can be done.


    While statistics offers a higher degree of transparency and interpretability,
    machine learning has led to incredible performance. This amazing performance has
    allowed us to perform tasks previously thought impossible!


    Of course, one has to remember that machine learning is the product of the computer
    era, which means much faster calculations. Instead of it taking days of work for
    a single model, it takes minutes—if that—and multiple approaches can be tried
    in a single day.


    ### The Battle: Statistics vs. Machine Learning


    Some statisticians are incredibly opposed to machine learning.^([^(29)](#fn29))
    Religiously opposed. Sometimes, it’s actually a bit worrisome. Their problem is
    the lack of transparency in machine learning as well as a lack of theory.


    However, in reality, statistics and machine learning are two sides of the same
    coin. Furthermore, they are tools in a data scientist’s toolbox and can be applied
    as the situation requires. So, if you are looking for interpretability, then statistics
    is your best bet, while predictive power will be better served by machine learning.'
  raw: '##### Deep Learning


    Deep learning is the field of research that studies *deep neural networks*, which
    is a neural network with multiple layers. A neural network will have one or two
    layers, whereas deep neural networks have many more (Figure [1-2](#490014_3_En_1_Chapter.xhtml#Fig2)).


    ![](images/490014_3_En_1_Chapter/490014_3_En_1_Fig2_HTML.jpg)


    A diagram of simple neural and deep learning neural networks. Simple neural network
    has 1 input layer, 1 hidden layer, and 1 output layer. Deep learning neural network
    has 1 input layer, 4 hidden layers, and 1 output layer.


    Figure 1-2


    Example of a regular neural network vs. a deep neural network


    Geoffrey Hinton, a British cognitive psychologist and computer scientist, who
    is regarded as the “Godfather of Deep Learning,” discovered it was impossible
    to get his research into neural networks published, so he had to devise a new
    term that was “cooler.”^([^(23)](#fn23))


    Neural networks consist of neurons and the pathways that connect them in the human
    brain. Since the brain is the most powerful computing machine known to man, it
    makes sense to attempt to emulate its architecture, which led to the creation
    of artificial neural networks.


    Neural networks have traditionally consisted of three layers: an input layer,
    a middle layer, and an output layer. The middle layer is what provided the neural
    networks with the power to perform non-linear computations and turned them into
    powerful learning machines.


    The idea behind deep learning had been around for decades.^([^(24)](#fn24)) However,
    it was believed that adding more layers was not really useful. Furthermore, it
    was difficult to train these networks.


    Deep learning takes advantage of artificial neural networks to enable machines
    to learn faster, more accurately, and at scale. Thus, it is used to help develop
    solutions to many issues that were previously unsolvable, such as speech recognition,
    computer vision, and natural language processing.


    For example, applications like Siri or Cortana are able to understand what you
    want thanks to deep learning. Image recognition, for example, can help you find
    furniture you see in the real world. Just take a picture of the piece and the
    app will find it online for you.


    Thanks to deep learning, machines can also identify different subjects in a photo—like
    differentiating between a human, a horse, a cat, or a dog. It can also be used
    to automatically color photos, and, more recently, to automatically remove the
    background of a photo, which many designers will be extremely grateful for.


    It is also being used to generate text automatically. In other words, thanks to
    deep learning, your computer can listen to what you’re saying and turn your words
    into text.


    Basically, deep learning can do a lot of really cool stuff!


    But how does it do that and why it works so well? The multiple layers of a deep
    neural network allow it to extract *hierarchical features*. Our visual system
    is organized hierarchically. Our brain picks up simple blobs and edges, before
    it picks up shapes (such as squares and circles) and then moves on to facial features
    or other more advanced concepts. Deep neural networks essentially mimic this functionality.
    If we take a look at the kind of processing that the middle layers of deep neural
    network are doing, then we can see that they extract a hierarchy of features.
    This is why deep neural networks have been so successful in computer vision and
    language applications. These are domains which, by nature, are dominated by hierarchical
    features. ConvNet Playground^([^(25)](#fn25)) has a model explorer that allows
    you to see how the different layers of Inception (a famous deep neural network)
    create more and more complicated representations of an image as the network gets
    deeper.


    However, deep neural networks are not a cure-all.^([^(26)](#fn26)) If the domain
    is not characterized by multiple interacting variables, or by hierarchies of features,
    or there is not enough data, then deep neural networks are probably an overkill.
    So, if, for example, you have a dataset of 1000 rows and ten variables, you are
    much better off using a simpler model (e.g., linear regression), since this model
    will train faster, and it is less likely to *overfit*.


    Overfitting^([^(27)](#fn27)) is the bane of all machine learning algorithms, and
    refers to a situation where the performance in the real world is much worse than
    during training. More complicated models can suffer from this problem. This is
    why deep neural networks require excessive tuning and testing to make sure they
    work well.


    #### Statistics


    The other core field of data science, statistics, is a branch of mathematics that
    started around the 18th century and was the first attempt to systematically analyze
    data. It produced the cornerstones of all modern data analysis, including summary
    statistics, regression and classification, significant testing, forecasting, and
    more.


    ##### What Makes Statistics Unique?


    Statistics generally deals with smaller samples, in large part due to historical
    reasons. The Internet makes it possible to collect a lot of data nowadays, but
    in the “olden” days, data usually had to be collected in person, which is why
    sample sizes were so small.


    The results were then extrapolated to the entire population with a margin of error.
    Also, consider that it was developed in the 17th century, which meant everything
    had to be calculated by hand.^([^(28)](#fn28)) Solving a model would take days
    or weeks.


    Statistics is also very strict on model assumptions and development, because it
    is rooted in math. It’s almost like classic AI in this sense. This gap did narrow
    after parts of machine learning were founded on Bayesian statistics.


    However, the mentality still differs. In machine learning, it’s all about getting
    it done and asking questions later. In statistics, though, assumptions must be
    validated and verified before anything else can be done.


    While statistics offers a higher degree of transparency and interpretability,
    machine learning has led to incredible performance. This amazing performance has
    allowed us to perform tasks previously thought impossible!


    Of course, one has to remember that machine learning is the product of the computer
    era, which means much faster calculations. Instead of it taking days of work for
    a single model, it takes minutes—if that—and multiple approaches can be tried
    in a single day.


    ##### The Battle: Statistics vs. Machine Learning


    Some statisticians are incredibly opposed to machine learning.^([^(29)](#fn29))
    Religiously opposed. Sometimes, it’s actually a bit worrisome. Their problem is
    the lack of transparency in machine learning as well as a lack of theory.


    However, in reality, statistics and machine learning are two sides of the same
    coin. Furthermore, they are tools in a data scientist’s toolbox and can be applied
    as the situation requires. So, if you are looking for interpretability, then statistics
    is your best bet, while predictive power will be better served by machine learning.'
