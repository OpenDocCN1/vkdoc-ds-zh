- fmt: '# Examples of Anomaly Detection


    Anomaly detection is about anomalous or unusual behavior in different contexts.
    Figure [7-3](#490014_3_En_7_Chapter.xhtml#Fig3) is a time series, and by running
    an anomaly detection algorithm, we can see that the search volume for the term
    ‘puppy’ spikes every January.


    ![](images/490014_3_En_7_Chapter/490014_3_En_7_Fig3_HTML.jpg)


    A line graph of search volume for the term puppy from 2010 to 2015. The line fluctuates
    with high points marked in every year. The year 2014 has the highest search volume.


    **Figure 7-3** Anomaly detection example over a time series^([^(54)](#fn54))


    How is this useful? Well, if you own a pet shop or if you run a dog shelter, you’ll
    know when is the best time to match puppies with new families or to increase your
    puppy-related inventory.


    Likewise, this kind of analysis is used for a wide range of applications. It can
    be used in retail for a wide range of products, or it can be used to analyze social
    media activity to understand whether people talk about particular subjects and
    if a topic has created a spike.


    Anomaly detection is extensively used in cyber-security to detect hackers. So,
    if 99% of the traffic going to a server is normal and then you have 1% that is
    exhibiting anomalous behavior, anomaly detection algorithms will flag the suspicious
    behavior so action can be taken accordingly.


    # Examples of Dimensionality Reduction


    In Figure [7-4](#490014_3_En_7_Chapter.xhtml#Fig4), you can see a summary of the
    Big Five personality traits. It is one of the most successful theories in psychology.


    ![](images/490014_3_En_7_Chapter/490014_3_En_7_Fig4_HTML.jpg)


    A chart lists 5 personality traits, extraversion, agreeableness, conscientiousness,
    neuroticism, and openness to experience. Each trait has examples.


    **Figure 7-4** Summary of the Big Five personality traits


    So, what does the Big Five personality theory have to do with dimensionality reduction?
    Well, this theory was derived by running factor analysis, one of the most prominent
    dimensionality reduction techniques.


    This personality theory was the result of people answering a large number of questions
    in a questionnaire and then applying factor analysis to group these questions
    into five overall factors. As you can see, according to this theory, personality
    is broken down into:


    - Extraversion

    - Agreeableness

    - Conscientiousness

    - Neuroticism

    - Openness to experience


    This is an excellent example of where dimensionality reduction can be used. It
    is also sometimes used in supervised learning because it can de-noise data, but
    this is more of a technical issue. However, it can also be used in any other context
    where you have a large number of variables.


    For example, in my PhD thesis, I worked with GPS data from the training sessions
    of the Tottenham Hotspur football club. The GPS units we used collected over 100
    different variables, which the sports science team found very difficult to interpret.
    So, I resorted to supervised principal component analysis and reduced them down
    to five or six factors that correlated with injury,^([^(55)](#fn55)) which made
    the results much easier to understand.


    As you can see, it can be applied to many things. There’s nothing that says you
    can’t do the same with user demographics or customer data and so on.


    # Interpretable Machine Learning


    Machine learning has often been called a black box, and rightly so. Not only the
    algorithms can seem difficult to understand to the uninitiated, but also the algorithms
    are usually designed for performance, and predictive power, but not interpretability.


    However, there is a new niche in machine learning that is set to change all that:
    interpretable machine learning.


    Interpretable machine learning is focused on coming up with techniques and methods
    in order to make machine learning models more transparent. For example, one such
    simple technique to use is called the “surrogate model” technique. A decision
    tree is fit on the predictions of a more complicated model (e.g., a deep neural
    network). The decision tree can be easily interpreted, even by someone who is
    not a data scientist, and can very quickly help you spot out the most important
    variables and how they interact.


    Two other more advanced techniques are `LIME` and Shapley value explanations.
    `LIME` stands for Local Interpretable Model-Agnostic Explanations and is a technique
    that can be used to explain any outcome. Shapley value explanation is a technique
    inspired by game theory, which can be used to understand the importance of variables
    and how they interact within a model for it to reach a particular conclusion.


    In Figure [7-5](#490014_3_En_7_Chapter.xhtml#Fig5), you can see how, for example,
    `LIME` can spot the most important words for text classifier. The text classifier
    is trying to discriminate between posts that are talking about atheism and posts
    that are talking about Christianity. The algorithm can produce a list of importance
    of the different words, which are then highlighted in the text.


    ![](images/490014_3_En_7_Chapter/490014_3_En_7_Fig5_HTML.jpg)


    A screenshot of LIME explanation. The prediction probabilities are atheism with
    0.58 and Christian with 0.42. In the column for atheism, posting is 0.15, host
    0.14, N N P P 0.11, edu 0.04, have 0.01, and there 0.01. In the next portion,
    texts edu, N N T P, posting, host, there, and have are highlighted.


    **Figure 7-5** Example of how `LIME` can examine feature importance^([^(56)](#fn56))


    Interpretable machine learning methods will become more and more important as
    algorithms are being used more and more often to make decisions in all parts of
    our lives. You can read more at [`https://thedatascientist.com/interpretable-machine-learning/`](https://thedatascientist.com/interpretable-machine-learning/)


