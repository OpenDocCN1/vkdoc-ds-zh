    Also, supervised learning is a great option when you want to predict future values,
    that is, predictive analytics—predicting someone’s risk of bankruptcy in the future
    (i.e., their credit score), demand for products in the future, or the price of
    a stock.


    Note that supervised learning algorithms are usually not very good in explaining
    how they reached a decision. Machine learning works well, but it is mainly a black
    box. Hence, if understanding your data is of paramount importance, you might have
    to perform exploratory data analysis or create some statistical models as well,
    such as linear or logistic regression.


    ### Unsupervised Learning


    Unsupervised learning can be useful in quite a few scenarios. First, the obvious
    one is that unsupervised learning is useful when you know there are groups in
    your data. For example, customer segmentation is such a scenario.


    Dimensionality reduction is another use case. If you have a very complicated dataset
    with a lot of variables and you aren’t sure what to do with it, then turning to
    dimensionality reduction techniques, such as factor analysis, is a good idea.


    Besides the fact that unsupervised learning can help you understand the data better,
    the outputs of unsupervised learning can also be used as inputs to supervised
    models to improve performance.


    ## A Few More Heuristics


    So, if you have images and audio that need to be classified, then you will turn
    to deep learning. The latter has been commoditized to a significant degree and
    tech giants like Google and IBM offer deep learning as a service.


    If you have a B2C business, you will have to look into recommender systems and
    market basket analysis. Recommender systems have become the norm for consumers.


    Market basket analysis (or association rule mining) represents a set of algorithms
    that try to identify frequent patterns in order to find associations between the
    features of a user and their behavior. These are patterns of the form; if someone
    buys X, then they are likely to buy Y.


    If you want to develop a chatbot, there are platforms out there to help you do
    that, such as Dialogflow.^([^(71)](#fn71)) It should be noted that while chatbots
    have come a long way, they aren’t as advanced as many people claim them to be.
    Some intelligence and machine learning go into them, but they still have a long
    way to go. However, they aren’t difficult to build.


    Finally, sometimes you want to forecast future values of a time series. Forecasting
    time series is a special field on its own. Statistics has a subfield that deals
    with these types of problems, but people also turn to machine learning to answer
    these types of questions. So, in practice, you might need a blend of two approaches.
    Because forecasting is very challenging and there are many ways to make mistakes,
    I usually advise people to try and see whether the same problem can be treated
    as classification or regression.


    ## When Heuristics Fail


    The aforementioned heuristics don’t work every time. However, when they don’t
    work, it’s usually because of one of the following.


    ### A Vague Project Plan


    Heuristics will fail if your project plan is vague or ridiculously grandiose.
    You hear people saying things like they want to build an AI capable of evaluating
    business plans with forecasts ten years into the future and so on, or that they
    want their AI to be able to predict everything.


    Clearly, they’ve watched one too many episodes of *Star Trek* and have forgotten
    that technology isn’t quite that advanced yet. It’s certainly not a magic bullet
    capable of fixing any and every problem, and this holds true for machine learning
    and AI too.


    So, it’s much more effective to have a plan with a narrow focus, which also keeps
    things more manageable and realistic in terms of deliverables.


    ### Developing Skynet to Kill a Fly


    Another problem is when you try to develop an AI to get rid of a fly and it decides
    to use the entire world’s nuclear arsenal to do so, also known as trying to use
    super advanced machine learning to do something a human can do easily.


    For example, maybe you want to create a chatbot that understands conversation
    and books your appointments. It’s a great idea, but you have to consider the time
    and resources it would take to develop and if the end result is something people
    would actually use. You can still go ahead, of course, but you need to be aware
    of the difficulties involved in developing this type of software.


    Another fairly complicated idea is trying to automate data collection. It makes
    sense to try to automate data collection in different contexts, but in most cases,
    it’s more effective to spend a little money to crowdsource it.


    I’ve seen quite a few startups fail because though their idea clearly had value,
    the development costs in terms of time and money were too large for a newly founded
    company. And they were trying to solve problems that can be solved more easily
    by humans, even if it is slightly more expensive.


    ### Lack of the Right Data


    Another common problem is that businesses try to hire data scientists when they
    don’t have the right data or the data is in very poor shape. Then the data scientists
    spend an inordinate amount of time trying to whip the data into shape instead
    of actually working toward a solution.


    ## Other Considerations


    There are a few other things you need to consider, namely, data quality, data
    volume in terms of number of variables, and data size.


    Data can go wrong in many situations. You might not have a very small sample,
    for example, or maybe the quality is bad, or maybe you don’t have the right variables.


    Someone once asked me to examine the differences between gender and pay on their
    job platform. Unfortunately, gender was a variable they didn’t collect so we only
    had first and last names to work with. The solution was to attempt to guess gender
    from someone’s first name, but 30% of the names were unisex, so we had to scrap
    the data.


    Their approach didn’t make sense at all. If they knew they were interested in
    differences between genders, why not ask people their gender? It makes no sense
    at all and is downright ridiculous.


    You definitely don’t want to take the same approach. So, try to follow the principles
    we discussed in Chapter [2](#490014_3_En_2_Chapter.xhtml) and try to think about
    how you will be using your data before you start collecting it. *Failing to plan
    is planning to fail*. That’s why it’s good to have a data strategy from day 0.^([^(72)](#fn72))'
