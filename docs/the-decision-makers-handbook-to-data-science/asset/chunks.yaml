    ## How to Keep Data Tidy


    Dirty data refers to data that can suffer from all sorts of problems, including,
    but not limited to, things such as erroneous or conflicting entries, missing values,
    and outdated data. Tidy data is the opposite, data that is in a nice format, with
    no inconsistencies or other issues.


    Dirty data can cause all sorts of problems. First, it makes consolidation of different
    data sources difficult or sometimes outright impossible. Second, many of the data
    points might not be usable. This can reduce the effective size of your data. You
    might be holding 5GB of data, but only 1 gigabyte might be usable.


    There is another tricky problem that can show up with dirty data. If you create
    models based on dirty data, then the model will produce results that might not
    correspond to reality, but you might not be aware that this is happening until
    it is too late.


    For example, you might have deployed a machine learning system in the real world
    (e.g., a recommender system, or a price optimization tool, or a demand forecasting
    tool), and it might take you some time before you realize the results do not correspond
    to reality. However, in the meantime, you have been recommending products (or
    adjusting prices, or something else) in the wrong way!


    This is one of the trickiest parts behind data science models. A wrong model will
    not fail to compile (like in software development). It will work fine until you
    realize that the results do not make much sense. This is why planning in advance
    is so crucial (as we stressed on in the previous section), and keeping your data
    tidy is part of this plan which you must follow.


    In terms of causes, most problems with dirty data are usually caused by


    1. Different departments handling the datasets


    2. Lack of documentation


    3. Lack of communication between different parts of the company


    The easiest way to understand dirty data and its potential impact on your organization
    is to look at a real-world example. This actually did happen like all the examples
    woven throughout the book.


    Let’s say you are dealing with data collection and data management in a football
    club (or soccer club if you’re from North America). So, within a football club,
    you have a medical department, football training, weight training, and the coach.


    However, there is no centralized system for collecting or storing the data. All
    data is collected manually and stored in Excel files, which is very problematic.
    It’s very difficult to format, use, and consolidate the data.


    Different people have different files and different datasets. Essentially, the
    data is all over the place and everyone has bits of it.


    There’s also a lack of supervision, which means that there is no certainty the
    variables recorded are accurate.


    Then you have a limited communication between departments. For example, a player
    might come back to train after suffering an injury, but might not let the medical
    department know he’s back. So, the medical department believes he’s still injured
    and has him recorded as such in their data.


    The departments also have different goals. The medical department wants to protect
    the player to ensure he is fully healed and won’t end up even more hurt if he
    comes back too soon. Conversely, the coach just wants the player back on the field.
    So, the medical department could have an incentive to make the injury seem more
    serious than it actually is, while the coach wants to minimize the importance
    of the injury.'
