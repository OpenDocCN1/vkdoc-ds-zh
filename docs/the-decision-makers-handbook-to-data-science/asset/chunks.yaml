  trans: '

    ### 早期岁月：基础与图灵测试


    人工智能的基础奠定于 20 世纪中期，那是一个充满乐观精神、渴望复制人类认知的时代。被誉为现代计算机之父的数学家艾伦·图灵，于 1950 年提出了`图灵测试`，用以衡量机器展现出与人类等同或无法区分的智能行为的能力。图灵的工作为后来的人工智能研究注入了动力，而
    1956 年的达特茅斯会议则正式标志着 AI 作为一个研究领域的诞生。早期 AI 研究聚焦于问题求解和符号主义方法，致力于将人类知识和推理编码为基于逻辑和规则的系统。


    ### AI 寒冬：失落的时期


    AI 的发展历程并非一帆风顺。该领域经历了数次“寒冬”，这些时期以预期未达成导致的资金和兴趣大幅下滑为特征。第一次寒冬发生在 20 世纪 70 年代，起因于詹姆斯·莱特希尔爵士发布的一份报告，该报告批评了
    AI 领域过于雄心勃勃的承诺，导致研究经费削减和整个领域普遍感到失望。第二次寒冬紧随其后，发生在 80 年代末至 90 年代初，当时现有技术的局限性日益凸显，资金再次枯竭。


    ### 复兴：互联网、算力与大数据


    随着互联网的出现和大数据的爆发，AI 的命运开始扭转。海量可用数据成为了新机器学习算法的燃料，这些算法不再需要手工编写规则，而是可以直接从数据中学习。与此同时，计算能力的飞速提升，尤其是图形处理单元（GPU）的问世，使得更复杂的模型能够更快地得到训练。


    这些技术进步，加上神经网络和深度学习的突破，促成了 21 世纪 AI 的复兴。这次复兴不仅重燃了人们的兴趣，还让 AI 系统在特定任务上达到了甚至在某些情况下超越了人类水平的表现，将我们带入了一个
    AI 应用似乎无边无际的时代，从自动化日常任务到推动量子计算研究，无不涉及。


    ## AI 中的基础概念


    ### 机器学习：现代 AI 的核心


    机器学习（简称 ML）是当代 AI 的基石，其核心理念是系统可以从数据中学习、识别模式并在最少人工干预下做出决策。这种从显式编程到数据驱动学习的范式转变，对
    AI 的成功至关重要。通过使用能够从数据中迭代学习的算法，ML 使得 AI 能够开发出预测模型，这些模型广泛应用于从电子邮件过滤到医疗保健中复杂诊断的无数场景。


    ### 深度学习：神经网络在行动


    深度学习是 ML 的一个子集，其灵感来源于人脑中信息处理的模式。它利用被称为神经网络的算法，这些算法由类似于神经元的层级结构组成。这些网络能够自主学习并做出智能决策。深度学习对于推动
    AI 发展至关重要，它使机器能够识别图像、理解口语，甚至生成类似人类的文本。这些网络的深度（通常由许多层组成）使其能够以前所未有的复杂性和抽象程度处理数据，从而推动了计算机视觉和语音识别等领域的进步。


    ### 自然语言处理（NLP）：理解人类语言


    自然语言处理是 AI 发展历程的见证，它处理的是计算机与人类语言之间的交互。`NLP`结合了计算语言学（对人类语言的基于规则的建模）与统计模型、机器学习和深度学习模型。这些技术使计算机能够处理和分析大量的自然语言数据。其结果是能够执行诸如文本翻译、回答问题以及文档摘要等任务。`NLP`是
    Siri 和 Alexa 等虚拟助手以及谷歌翻译等翻译服务的核心，它们与人类用户的交互正变得日益无缝。


    `NLP`领域因大型语言模型（LLM）的出现而发生了变革。LLM 是一种深度学习模型，旨在以高度复杂的方式理解、生成并有时翻译人类语言。像 GPT（生成式预训练
    Transformer）和 BERT（来自 Transformer 的双向编码器表示）这样的 LLM，利用海量的文本数据来学习语言模式、细微差别和上下文关系。这些模型能够执行各种复杂任务，包括语言翻译、问答、文本摘要甚至内容创作，其精细程度日益接近人类水平。


    ## AI 中 Transformer 的到来


    人工智能从早期阶段发展到今天复杂的系统，是技术史上非凡的一章。随着 2017 年研究论文《注意力就是一切》的发表而诞生的 Transformer 网络，是自然语言处理（NLP）领域的一大步。它采用了并行数据处理和注意力机制，有助于更好地理解和生成语言。


    这种注意力机制是一项关键特性，它允许模型聚焦于数据的不同部分并赋予其不同的重要性权重。它改进了机器理解语言上下文的能力（图 8-1）。


    ![](img/490014_3_En_8_Fig1_HTML.jpg)


    以查询词为纵轴、关键词为横轴绘制的句子“`the quick brown fox jumps over the lazy dog`”的概率得分矩阵。`(the,
    the)`、`(fox, fox)`和`(jumps, jumps)`的值为 0.9。`(dog, dog)`的值为 0.8。


    **图 8-1** 实践中的注意力机制


    在 Transformer 网络的基础上，像 OpenAI 的 GPT 和谷歌的 BERT 这样的大型语言模型（LLM）扩展了文本生成和解释的范围。这些模型能够生成从文章到代码的文本，展示了其广泛的适用性。特别是`BERT`，它提升了搜索引擎和机器人理解查询并做出回应的方式。


    其他模型，包括`RoBERTa`、`DistilBERT`和`T5`，已经改进或重新构想了 Transformer 模型，使其更高效或更通用。`XLNet`在`BERT`的基础上进行了构建，以提升在一系列语言任务上的性能。


    在对话式 AI 领域，`ChatGPT`做出了显著贡献，特别是通过利用人类反馈来生成更自然的对话。谷歌 Bard 虽然在其公开描述中细节较少，但预计将借助谷歌的`LaMDA`把广泛的知识带入对话语境中。


    这些 Transformer 模型的引入开启了人工智能与人类智能合作的新篇章，AI 在创造性和智力追求中扮演着更积极的角色。这种伙伴关系预计将在各个领域带来重大变革，提升我们应对复杂挑战的方式。

