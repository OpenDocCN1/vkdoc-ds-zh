- fmt: '# Automated Planning


    Planning is a vital component of rational behavior. Automated planning and scheduling
    is an area of artificial intelligence that involves the creation of a system that
    is capable of selecting and organizing actions to achieve a certain outcome.


    An example is the Missionaries and Cannibals problem,^([^(12)](#fn12)) which is
    a classic AI puzzle. It is defined as follows:


    > *On one bank of a river are three missionaries and three cannibals. They all
    wish to cross to the other side of the river. There is one boat available that
    can hold up to two people. However, if the cannibals ever outnumber the missionaries
    on either of the river’s banks, the missionaries will get eaten.*


    > *How can the boat be used to safely carry all the missionaries and cannibals
    across the river?*


    It’s a little gruesome and might also seem trivial, but a similar approach can
    be used for schedule planning.


    Other similar problems in that area are the towers of Hanoi^([^(13)](#fn13)) and
    the traveling salesman problem. The traveling salesman problem is a legendary
    benchmark in optimization, where the objective is to find a path for a salesman
    to go across all the cities in a country (or some other geographical region).
    This path should never go through the same city twice, and at the same time, it
    should be as short as possible. It is easy to see how this relates to vehicle
    routing in real life. In Figure [1-1](#490014_3_En_1_Chapter.xhtml#Fig1), you
    can see an example of the traveling salesman for all major cities in Germany.


    ![](images/490014_3_En_1_Chapter/490014_3_En_1_Fig1_HTML.jpg)


    A map of Germany has a closed polygon passing through Berlin, Dresden, Nurnberg,
    Munchen, Stuttgart, Frankfurt am Main, Koln, Dusseldorf, Essen, Hannover, Bremen,
    and Hamburg.


    Figure 1-1


    Example of the traveling salesman problem


    Essentially, what the computer does is analyze each possibility, discarding the
    one that doesn’t fulfill the parameters, while presenting all the options that
    do.


    # The AI Winters


    Artificial intelligence would likely be much further along now were it not for
    the “winters” it experienced. The term `AI winter` refers to periods when interest
    in artificial intelligence was diminished, and, as a result, funding was limited.


    In 1967, Marvin Minsky predicted that “within a generation the problem of creating
    ‘artificial intelligence’ will be substantially solved.” However, by 1982, he
    admitted that “the AI problem is one of the hardest science has ever undertaken.”^([^(14)](#fn14))


    The first major AI winter started in 1974 and ended in 1980, while the second
    one started in 1987 and ended in 1993. There were other smaller issues, such as:


    *   1966: the failure of machine translation

    *   1970: the abandonment of connectionism

    *   1971–1975: DARPA’s frustration with the Speech Understanding Research program
    at Carnegie Mellon University

    *   1973: the large decrease in AI research in the United Kingdom in response
    to the Lighthill report

    *   1973–1974: DARPA’s cutbacks to academic AI research in general

    *   1987: the collapse of the Lisp machine market

    *   1988: the cancellation of new spending on AI by the Strategic Computing Initiative

    *   1993: expert systems slowly reaching the bottom

    *   1990s: the quiet disappearance of the fifth-generation computer project’s
    original goals


    The first winter was caused, in large part, by three major elements. First, it
    was the Lighthill report, in which professor Sir James Lighthill concluded that
    other sciences could do everything being done in AI, implying that many of the
    most successful AI algorithms would be incapable of solving real world problems.^([^(15)](#fn15))


    Though contested, the report still resulted in the complete shutdown of AI research
    in the UK, with only a few universities continuing the research. The result was
    funding cuts for this research all across Europe.^([^(16)](#fn16))


    In 1969, the Mansfield Amendment was passed in the USA, requiring DARPA to fund
    research that had a clear mission rather than basic projects with no clear direction.
    Essentially, researchers had to prove their projects would quickly produce technology
    that would be useful to the military.


    In concert with Lighthill’s report, which was used as proof that AI research was
    unlikely to provide anything useful in the foreseeable future, DARPA stopped funding
    this type of research. By 1974, funding for AI was virtually impossible to find.^([^(17)](#fn17))


    Another issue was the Speech Understanding Research program at Carnegie Mellon.
    DARPA wanted a system that could respond to spoken commands from a pilot, and
    while the team had developed a system that understood spoken English, the words
    had to be spoken in a certain order.


    DARPA felt they had been misled and cancelled the grant in 1974.^([^(18)](#fn18))
    Interestingly enough, by 2001, the speech recognition market reached $4 billion
    and used the technology the team from Carnegie Mellon developed.^([^(19)](#fn19))


    In 1980, the commercial success of expert systems rekindled interest in the field
    of AI. By 1985, over a billion dollars was being spent on AI and an industry developed
    to support the field. Specialized computers dubbed Lisp machines were built to
    better process the programming language that was preferred for AI.


    Unfortunately, the LISP machine market collapsed because companies like Sun Microsystems
    developed more efficient alternatives. These general workstations had much better
    performance, which LISP machines were incapable of matching. This led to the second
    AI winter.


    # What We Learned from AI Research


    Despite all the issues, research into artificial intelligence discovered many
    beneficial things. For example, if it weren’t for AI research, we would not have
    algorithms that work with logical rules.


    An early example of such an algorithm was the Prolog language. One of the first
    logic-based programming languages, it’s still one of the most popular even today.
    It has been used to prove theorems in expert systems, in type inference, and for
    automated planning.


    And that’s another area where AI has helped us. Automated planning and scheduling,
    which is used to drive things like automated robots in manufacturing, would not
    exist otherwise. Neither would expert systems or knowledge representation.


    Of course, all these things have evolved significantly since then, and we are
    getting closer and closer to creating true AI, but we still have a long way to
    go before we have a truly intelligent machine.


    Another interesting aspect is that cognitive science borrows from AI as much as
    the reverse is true. The desire to develop a smart machine that can think like
    a human required a better understanding of the human mind. This led to research
    into memory, perception, and much more.'
