  trans: '

    # 数据知情与数据驱动


    首先，我们来探讨一下**数据知情**与**数据驱动**之间的区别。当我们说一个组织或个人是数据知情的，意味着他们确实将数据及其背景作为输入，融入到讨论和决策过程中。


    例如，如果你使用仪表盘和关键绩效指标（KPI）这类工具，那么你就是数据知情的。如今，成为数据知情非常容易。你可以使用`Excel`或其他简单工具，制作一些简易图表来了解组织内部情况，这并不困难。


    而数据驱动则意味着更上一层楼。它指的是你开始运用更智能的算法和方法来获取数据。然后，你通过使用算法为你做决策，或者将算法的输出纳入考量，来转变决策过程。


    那么，与此相反的做法是什么呢？与数据知情或数据驱动相对的，就是凭直觉做决策。或者凭传统经验，这在准确性或有效性方面也好不了多少。


    我们再来看几个例子。


    当你是**数据知情**时，你可能会使用仪表盘或`Excel`来收集来自多个来源的数据。当然，正如我们之前在第 2 章中讨论过的，你已经适当地组织了数据，并且确保记录了整个过程以避免任何问题。这些数据是可访问的，你所有的员工都知道它，并且了解在哪里可以找到数据以及如何使用它。


    而**数据驱动**则意味着将事情*向前推进一步*。这是大多数公司未来应该努力达到的状态。当你达到这个阶段，意味着你允许数据和数据科学帮助你做出潜在的颠覆性决策。在某些情况下，它们甚至可能完全取代人类的决策。


    所以，例如，如果你使用算法进行交易，那么你就是数据驱动的。如果你的应用或网站使用了推荐系统，那么你也是数据驱动的。


    显然，数据驱动并不意味着每一个决策都需要由算法来做，但它确实意味着你在组织的某些部分以及决策过程中，会使用算法输出。


    那么，为什么你要这样做呢？数据驱动能提高效率，并且确实可以改善决策。例如，在预测客户可能想要什么方面，推荐系统可以比人类做出更好的决策。此外，如果你希望进行大规模销售，在达到某个临界点后，你就需要有一种算法，在推荐商品或策展内容时，能够真正替代人工。这只是一个例子，但在不同行业还有很多其他例子。


    **警告！**


    埃里克·彼得森引用了埃森哲首席科学家基肖尔·斯瓦米纳坦关于“高层管理者需要了解的关于分析学”的讨论。^(⁸⁴)


    > `数据`是一把双刃剑。如果使用得当，它能带来合理且充分知情的决策。如果使用不当，同样的数据不仅会导致糟糕的决策，还会导致那些在高度自信下做出的糟糕决策，这反过来又可能引发错误且代价高昂的行动。


    换句话说，如果你正确使用数据和数据科学，你会看到效率提升和利润空间改善。然而，如果你没有以正确的方式使用数据，那么很容易就会落入图 12-2（上一章已出现过）所示的危险区。


    ![](img/490014_3_En_12_Fig2_HTML.jpg)


    一个维恩图，展示了黑客技能、数学与统计学、以及领域知识在数据科学处交汇。黑客技能与数学和统计学在机器学习处交汇。数学与统计学和领域知识在传统研究处交汇。黑客技能与领域知识在危险区处交汇。


    **图 12-2** 数据科学家维恩图


    问题在于，你最终处于一种状态：你在决策过程中使用了数据，但由于你没有正确的理论，或者没有进行正确的测试，导致决策是错误的。然而，你仍然信心满满，因为你认为自己采用了科学方法。


    降低这种风险的最简单方法是，聘请覆盖图中数学和统计学圆圈的数据科学家，他们会使用正确的理论和流程来进行数据科学工作。当然，你还需要建立正确的文化，以便数据科学家能与其他部门互动，并且每个人都能相互审视彼此的工作。


    ## 为数据科学家营造友好环境


    在员工层面，你需要为数据科学家营造一个友好的环境。我们在上一章关于招聘数据科学家的内容中已经讨论了很多这方面。本质上，你需要记住，数据科学家追求的不只是金钱回报。他们还希望有合适的文化，希望获得智力上的刺激，希望感受到自己在进步、在学习新事物，以及自己的工作能产生影响。


    同时，要记住数据科学家通常性格内向。让每个人都能与他们喜欢的人组成团队，并在正确的文化中工作，这对所有员工都很重要，但对这类人来说，这可能比普通人更为关键。


    牢记这一切是拥有快乐员工的关键，而这将转化为更高的生产力。


    ## 在组织层面以数据为中心


    当一个组织以数据科学为核心时，它就是**以数据为中心**的，这包含几层不同的意思。


    首先，这意味着你对数据和数据科学领域的状况拥有 360 度的全局视角。数据科学是一个独立的部门，这意味着数据科学家拥有更多的自由和许可去探索新事物，即使这些事物可能具有颠覆性。他们承担了更多责任，这能给予他们更强的激励，但也带来了更大的风险。


    然而，正因为你拥有这种 360 度的全局视角，你可以化解这种风险。在所有重要部门之间，特别是在开发人员与数据科学家之间，以及数据科学家与管理层之间，建立了恰当的沟通和汇报渠道。


    这很重要，因为你需要确保数据科学家的工作能产生影响，并且你也需要清楚地了解正在收集哪些数据、这些数据如何被使用、以及它们是如何被实施的——这些信息非常容易被忽略。


    为了澄清这一点，当我们谈论数据收集时，决策者需要注意两个重大问题。


    一个是法律问题，由于欧盟和英国的《通用数据保护条例》，这在当今变得非常重要。涉及数据隐私的问题多种多样，对于不了解数据如何被使用和收集，真的没有任何借口可言。


    其次，重要的是要了解数据科学家在研究什么，并确保研究成果能以积极的方式在组织内实施和使用。因此，建立有效的沟通渠道就变得至关重要。一个部门可以审查另一个部门的工作，以确保所做的事情与组织相关。


    让我们来看几个可能出错的例子。

    '
- fmt: '#### Example 1: When Data Is Not at the Core


    Let’s start with an example of what happens when data science is not at the core.
    This tends to happen in small or medium enterprises that are trying to reduce
    costs because they’re short on cash.


    When a company wants to do data science, but they don’t want to hire a new person,
    they might turn to their own personnel to do data science. They might hire a developer
    to do machine learning, but that’s about it.


    It’s not a bad idea as someone supervises the software developer. Otherwise, someone
    might run a model that they got from a library and they don’t know how to properly
    test this model. They might use a cross-validation scheme, for example. The model
    goes into production and you end up with disastrous results because you’re in
    the danger zone. In other words, you’re using a person who has the hacking skills
    and the domain expertise, but they don’t have the theoretical knowledge to back
    it up.


    So, you make decisions that you’re very confident in, but they’re actually wrong.
    Technically, it’s worse to be wrong and be confident in your mistakes than it
    is to just be wrong.


    #### Example 2: Things Don’t Get Implemented


    Another common example that happens mainly in big organizations where there are
    personnel issues and communication problems is when you hire data scientists and
    things do not get implemented.


    While there are a few ways things might not get implemented, let’s look at the
    case of a data scientist who is not familiar with a domain. So, you hire someone
    who looks really good on paper. You also really believe in data science, and you
    give them the freedom and the resources to do whatever they want.


    The problem is that it’s very easy to create silos in these cases, especially
    when data scientists speak another language in a sense to other departments. A
    common mistake is that a data scientist spends months working on something and
    then it can’t be implemented because they were not familiar with the domain. They
    couldn’t understand that what they were creating couldn’t be implemented because
    of real work constraints or due to lack of relevancy from a business perspective.


    This tends to happen a lot with people who recently finished their PhDs, and they’re
    still in this very academic mindset of trying to do complicated and fancy things
    instead of simple things that have an impact.


    Thus, having the right culture in data science is not just about being data informed
    but about transforming creativity into results. It’s about giving the data scientist
    freedom and resources but also making sure the proper checks are in place to ensure
    the work is relevant and can and will be implemented.


    #### Example 3: Poor Communication


    Another example of when things can go wrong is when you have poor communication,
    which happens quite frequently.


    Let’s say that there’s no one to oversee the communication between the software
    developer and the data scientist. Even though they are both technical people,
    they speak a different language most of the time. The result is the creation of
    silos, which are then difficult to break down. And silos lead to bad practices
    and increase development times.


    First, the problem is the different styles of communication. For example, does
    the data scientist like to speak a lot using math and different expressions compared
    to the developers? Also, lack of knowledge of each other’s practices is an issue.


    Developers like things to be well documented and they like to run tests. Data
    scientists, on the other hand, can have different approaches. They might even
    use different programming languages, which can also be an issue.


    A solution, in this case, would be to try to make people work in pairs. Another
    option would be to hire people who have machine language experience, and they
    can compensate for the poor communication between the data scientist and the developer.


    Or you might want to do the opposite and hire a data scientist with some software
    development experience.


    Others have proposed trying to enforce particular software development methodologies
    across all departments.


    The problem is that these don’t always work mainly because data science is a bit
    different to software development and sometimes you can find yourself in an awkward
    situation. So, the main difference is that progress in data science is not incremental
    as it usually is in software development. It’s a bit more all or nothing.


    You might spend a few weeks doing research and then you suddenly get results.
    Conversely, in software development you might add a new feature every day.


    So, even if it’s not a bad idea to have stand-ups, for example, where people can
    share what they’re working on every day, don’t take into account all the suggestions
    for software methodologies. You can, of course, think about them, but then adapt
    them to your specific situation.


    ## *MONEYBALL*: A STORY ABOUT DATA SCIENCE CULTURE


    The world of sports used to be very detached from the world of technology and
    statistics. Most sports professionals would probably find a discussion about databases
    or machine learning algorithms pretty boring. Sports was an entirely different
    world, and Billy Beane’s approach seemed alien to the baseball establishment.


    Billy Beane had the insight that most of the metrics that were being used in the
    game were outdated. Players were chosen by scouts who used to be coaches or players
    themselves. Billy Beane figured out that statistics like the on-base percentage
    (how often a batter reaches base) were better predictors of success than other
    statistics that had been traditionally used.


    This way, Oakland A’s were able to create completely different valuations than
    the ones that had been used in the past and compete with a budget of around $44
    million with teams that were spending nearly three times as much. This approach
    was called "sabermetrics." The term is derived from the acronym SABR, which stands
    for Society for American Baseball Research.


    Unfortunately, Oakland A’s didn’t manage to win the championship (even if they
    got very close to winning it), and then they lost their advantage, once other
    clubs started copying their approach.


    Since then the world of sports has been invaded by data science, with devices
    and algorithms ruling many aspects of the game. There are conferences in sports
    analytics being held, with the biggest taking place in MIT''s Sloan School of
    Management (`www.sloansportsconference.com`).


    I have also done research in sports analytics, having worked on the prediction
    of sports injuries and sports outcomes (like which team will win a game). You
    can read more on my blog `http://thedatascientist.com`.


    ## Steps to Build a Data Science Culture


    Let’s take a look at the steps you need to take to build a culture that is conducive
    to data science.


    ### Why Do You Need Data Science in the First Place?


    First, you need to ask yourself why you need data science. There are three common
    scenarios in businesses:


    1. Data science is an integral part of your business: maybe you’re an AI or robotics
    company, or you’re in deep tech in some way, in which case you usually have to
    have the knowledge yourself.


    2. You run a company and want to improve efficiency, so maybe you want to improve
    operations, for example.


    3. You want to improve sales so maybe you want to build your recommender system
    to improve your B2C offer.


    It’s unlikely that you fall into the first category or you wouldn’t be reading
    this book. So, you’re either in two or three, and obviously these can be combined.


    At this point, you need to ask yourself why you need data science, so you know
    where you’re going next. Now, let’s look at resistance to change.'
