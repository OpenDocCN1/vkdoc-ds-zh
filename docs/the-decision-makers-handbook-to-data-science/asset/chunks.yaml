    A simple example is that the data scientist ends up doing a lot of data wrangling,
    which is utterly boring, because of bad communication with the developer in terms
    of how the data should have been stored.


    To return to our Michelin star chef analogy, Heston Blumenthal is a world-renowned
    chef and his main “thing” is molecular gastronomy. He uses a range of tools and
    ingredients that are not always the norm in a kitchen. Say you hire him to cater
    for an event and he tells you what he needs, but because you don’t understand
    his process, you just stock the kitchen with all the usual tools and ingredients.


    When he arrives to do the cooking, he ends up having to cook a traditional meal
    that is completely boring for him, resulting in food that might be decent but
    nowhere near the quality of what he could have done.


    ## When a Data Scientist Is Looking for a Job


    Right now it’s a seller’s market for good data scientists above junior level where
    the data scientists are the sellers—you know, seeing as they sell their skills
    and expertise. The fact is that there is a high demand for skilled people but
    the supply is nowhere near sufficient to meet it.


    For example, an average data scientist in London will receive between one and
    ten recruiter messages or calls every week. This means they are in a position
    of power when choosing what projects to work on.


    So, to improve your chances of hiring the right person, you need to understand
    what data scientists want.'
  trans: '

    ### 代码黑客技能


    好吧，当我提到代码黑客技能时，我不是在说入侵 NASA，而是指数据科学家需要拥有出色的计算机知识和扎实的编程技能。这并不意味着他们需要计算机科学学位，因为有很多优秀的“黑客”一生从未上过任何计算机课程。


    然而，数据科学家必须能够以算法的方式思考、理解向量化操作，并在命令行中处理文本文件。没有这些技能，就不可能成为一名数据科学家。大多数情况下，数据科学家产出的代码实际质量不需要达到生产级水平。这就是为什么我们使用“代码黑客”这个术语，而不是“软件工程”，因为后者意味着代码应达到非常高的标准。数据科学家将代码作为解决问题的工具。不过，如果你能找到一位同时拥有出色编码技能的数据科学家，那自然也无妨。


    ### 数学与统计学知识


    一旦利用那些黑客技能将数据整理成型，就该进行分析并提取洞察了。为此，数据科学家需要具备数学和统计学知识，以便应用正确的方法和模型。


    同样，数据科学家不需要拥有统计学博士学位也能高效工作，但他们必须知道如何开发和使用数学与统计模型，包括如何解读结果。


    ### 领域知识


    领域知识对数据科学家来说很重要：他们需要理解主题本身，而不仅仅是其技术层面。虽然这不是硬性要求，但缺乏领域知识可能会引发各种问题（我们已经看到过一些例子，后续还会有更多）。领域专业知识使数据科学家能够将其他技能应用到数据上，从而实现预期目标。每当你转向解决一个从未接触过的领域中的问题时，数据科学家都必须自学该领域的特性。


    ### 仅有两项技能并不足够


    只拥有这三项技能/知识中的两项是不够的。一个精通数学和统计学但没有实质专业知识的熟练黑客，可能非常适合机器学习。然而，他们的技能并不能让他们成为数据科学家。


    同样，如果有人拥有实质性专业知识并懂数学和统计学，那么他们可能更偏向于传统研究。这种交叉领域基本上构成了学术界的大部分——不过应该注意的是，年轻的研究人员正在选择不断发展并学习更多技术。然而，没有那些黑客技能，他们永远成不了数据科学家。


    真正的问题出现在当某人既是熟练的黑客又拥有实质性专业知识时。这会创造出一个危险人物，因为他们知道得足够多，足以做出看似合理的分析，但却完全不清楚自己是如何得出结论的，或者自己到底创造了什么。


    从根本上说，这类人具备对某个问题应用分析技能的能力，但缺乏确保自己行为正确的理论基础。因此，他们可能会运行一个统计测试，却做出错误的假设。然而，由于他们相信自己是在基于数据做决策，便会产生一种虚假的自信心，这可能导致严重问题。


    所以，请记住，一个称职的数据科学家将是一位熟练的黑客，具备数学和统计学知识，并且在你选择的领域拥有实质性专业知识。


    ## 数据科学家的动力是什么？


    与某人高效合作意味着要了解他们是什么样的人以及他们的动力来源。不幸的是，人们往往难以理解数据科学家，正是因为他们的技能范围如此广泛，以至于无法被整齐地归入某个框框。


    数据科学家不仅仅是懂数学和统计学、能像专业人士一样操作电脑的人。他们还要具备出色的沟通和可视化技能，能够与高层管理人员有效沟通，并能生动地讲述故事。他们还对业务充满热情，对数据充满好奇。他们不断渴望学习更多，希望解决问题并产生影响，即便没有通常伴随这一角色的权威。他们是具有战略眼光、积极主动、富有创造力和创新精神的人，喜欢与他人合作。


    他们绝对热爱脑力激荡，解决问题就是他们的看家本领。他们天生具有好奇心和成长的驱动力，这意味着他们喜欢学习新事物和获取新技能。


    事实上，学习新技能是当今市场不可或缺的组成部分。这就是“红皇后假说”在现实中的体现，其核心观点是：一个有机体必须不断适应、进化和繁衍，仅仅是为了生存。


    ## 什么会让数据科学家失去工作热情？


    如果你让数据科学家做大量重复性的工作，你最终会得到一个极度缺乏工作热情的人。因此，如果他们不得不花费大量时间清理数据或做任何等同于数沙子的工作，那么你将面对一个根本不想待在这里的人。工作成果也会因此受到影响。


    同样，如果因为你要他们解决的问题过于简单而让他们感到无聊，你也讨不到任何好处。当然，有时候简单问题也需要解决，但如果你决定迈出这一步并雇佣一位数据科学家，请确保充分利用他们的能力。否则，这就像雇佣一位米其林星级大厨只为给你做一个烤芝士三明治。


    危险在于，这位大厨会因为无聊而偏离主题，给你端上一个经过解构和重构、与你想吃的那个简单三明治几乎毫无共同之处的烤芝士三明治。


    此外，另一个问题源于沟通不畅。当高层管理人员不理解数据科学家在做什么时，沟通中的摩擦往往就会出现。


    一个简单的例子是，数据科学家最终做了大量极其枯燥的数据整理工作，而这仅仅是因为与开发人员就数据应该如何存储的问题沟通不畅。


    再回到我们米其林星级大厨的类比，赫斯顿·布卢门撒尔是一位世界知名厨师，他的“招牌”是分子料理。他使用一系列在厨房中并不常见的工具和食材。假设你雇佣他为一场活动提供餐饮服务，他告诉你他需要什么，但因为你不理解他的流程，你只在厨房里备齐了所有常规工具和食材。


    当他到达准备烹饪时，他最终不得不制作一顿对他来说完全乏味的传统餐食，结果做出的食物可能还算可以，但远达不到他本应能做出的水准。


    ## 当数据科学家找工作时


    目前，对于初级以上的优秀数据科学家来说，这是一个卖方市场，数据科学家是卖方——你知道的，因为他们出售自己的技能和专业知识。事实是，对技能娴熟人才的需求很高，但供给远不能满足需求。


    例如，伦敦的一位普通数据科学家每周会收到一到十份招聘人员的信息或电话。这意味着他们在选择参与什么项目时处于主导地位。


    因此，为了提高雇佣到合适人选的几率，你需要了解数据科学家想要什么。

    '
- fmt: '### What Does a Data Scientist Want?


    The first thing is compensation, of course. After all, data scientists are human—even
    if their skillset and availability can make them seem akin to a mythological beast
    at times—and they not only need money to live, but they want their value to be
    appropriately compensated.


    However, offering a mind-blowing paycheck alone will not be enough because other
    things matter too, such as the team they’ll be working with, the problem they’ll
    be tackling, the technology stack they’ll be using, and the relationship to academia.


    #### The Team


    Some data scientists prefer to work in a team where they like the people they
    are working with. This usually means a geekier, less formal culture or even working
    from home.


    Of course, this won’t necessarily work for every company as you can’t exactly
    change your whole culture overnight for the data scientist you are hiring, but
    you can try to make concessions where possible to improve the working relationship.


    #### The Problem


    While we’ve already discussed the dangers of giving to a data scientist problems
    that are too simple, you’ll also find that many data scientists have a bias for
    particular types of problems. For example, some might prefer working on problems
    that have a social impact, while others might stick to problems in fields they
    like, such as medicine.


    Other times, they might have preferences related to the problem itself. For example,
    some people prefer working with text data.


    Often, though, you will find that it is closely connected to doing and learning
    something new, which is a trait that defines data scientists.


    #### The Technology Stack


    The technology being used will also play an important role. Some data scientists
    will prefer working with stacks they are already familiar with, while others will
    want to learn new things. However, you will find that most data scientists will
    avoid old technologies and legacy code like the plague.


    Sometimes learning new technologies can be extremely important to a data scientist.
    It could be because some up-and-coming technologies are dominating the landscape,
    like `Python`, and they might want to transition from `MATLAB` to `Python` and
    `R`, for example.


    Or maybe the data scientist wants to expand their skillset because some technologies
    offer better pay and are more interesting, such as those to do with deep learning.


    #### Relationship to Academia


    Many data scientists come out of academia and are used to reading/writing papers
    and going to conferences. This is an advantage for everyone because conferences
    can be an essential part of being on top of their game. So, one way to motivate
    a data scientist is to provide a stipend for conferences.


    And, as I already said, it will help you too because your data scientist will
    learn about the up-and-coming developments in data science, they will learn about
    fields or applications they weren’t previously aware of, and they will catch up
    with other people in their field.


    Some of the data science conferences you can expect a PhD-level data scientist
    to want to attend include:


    - `ICML`: The International Conference on Machine Learning

    - `NeurIPS`: Neural Information Processing Systems

    - `SIGKDD`: ACM SIGKDD International Conference on Knowledge Discovery and Data
    Mining

    - `ECML PKDD`: European Conference on Machine Learning and Knowledge Discovery
    in Databases

    - `AI Stats`


    ### Avoiding Traditional Limitations


    One frequent problem with hiring data scientists is that employers often take
    the same approach they would with hiring for any other role in the business. And
    that usually involves asking if the person has experience in a particular domain.


    However, many data scientists, myself included, specifically seek out domains
    they have not worked in before. It’s all about the drive to learn new things and
    stave off boredom because something you haven’t done before will certainly prove
    more interesting than something you are experienced in.


    The important thing that you, as a potential employer, need to understand is that
    the techniques a data scientist uses have general applicability and the domain
    itself is of secondary importance. In other words, don’t miss out on hiring a
    great data scientist because they don’t have experience in your particular domain.


    ### Data Science Is a General Toolbox


    The techniques in data science can be applied to a variety of problems. Experience
    in one thing can translate to experience in something else. So, for example, a
    data scientist might be able to use the same algorithms to predict disease outbreaks
    but also how many people might click on an ad.


    Think of it like a pastry chef. They learn a wide range of techniques, including
    working with different kinds of dough, working with sauces, making creams, and
    so on. And they have a lot of experience making cakes. However, because they are
    highly experienced with the techniques, they can easily switch from making cakes
    to making pies.


    For example, a common mistake I see made by human resources goes along the lines
    of:


    - “We’re looking for someone who has 5 years of experience in `TensorFlow`,” says
    the HR department.

    - “Okay, but `TensorFlow` has only been around for 2 years,” replies the candidate
    or even the recruitment firm.


    When it comes to data scientists, their breadth of knowledge is generally a better
    indicator of their skills rather than just experience.


    The problem is that many employers don’t understand a data scientist’s skillset—not
    you, of course, because you’re reading this book and now have a much greater understanding
    of data science and what a data scientist does. The result is that many data scientists
    get stuck in a particular domain because of this lack of understanding.


    Let’s look at a data scientist who works in finance as an example. In finances,
    data science would employ tools like time series and predictive modeling. However,
    these tools aren’t limited just to finances. They are equally effective for a
    number of other fields, such as in sports bettering or even retail. In retail,
    for example, you can use a time series to predict demand.


    However, a large number of employers will see that the data scientist has experience
    in finance and will automatically assume their skillset is only applicable to
    finances. And this means they could be missing out on an amazing data scientist.


    So, don’t make the same mistake and give these people a chance, even if they don’t
    conform to the strict model you have in your head of what the perfect hire would
    be.


    ### Discovering Young Talent


    Data science is a little like sports in that talent plays a huge role, especially
    because it requires a combination of technical skills and soft skills, as we’ve
    previously discussed. This person needs to be able to read other people, to make
    connections others can’t see, and to communicate well, beyond the technical aspects
    of their skillset. They also have to be able to smoothly integrate their soft
    and technical skills, which isn’t always as easy as it sounds.


    So, when you find someone with a clear talent for this work, grab onto them with
    both hands, even if they are at the beginning of their career. Remember, someone
    who is a junior data scientist today can be your future senior data scientist
    if you give them a chance and nurture them.


    How can you find young data scientists with talent? First, you want to check out
    the top universities teaching the subject. Then, once you’ve identified potential
    candidates, look beyond their university work. You can look on sites like `GitHub`
    to discover any outside work they’ve done.


    You should also consider creating a mentorship program. This will allow you to
    identify people with the talent for data science, some of whom you might not have
    realized have the aptitude for it until you work with them up close and personal.'
