  trans: '

    ### 数据科学家想要什么？


    首要之事当然是薪酬。毕竟，数据科学家也是人——尽管他们的技能组合和稀缺性有时让他们看起来像神话中的神兽——他们不仅需要钱来生活，也希望自己的价值得到适当的回报。


    然而，仅仅提供一份令人瞠目的高薪是不够的，因为其他因素也很重要，比如他们将与之合作的团队、将要解决的问题、使用的技术栈，以及与学术界的关系。


    #### 团队


    一些数据科学家更愿意在团队中与自己喜欢的人共事。这通常意味着更极客、不那么正式的文化，甚至是在家办公。


    当然，这不一定适用于每家公司，因为你不可能为了招聘一位数据科学家而在一夜之间彻底改变整个企业文化，但你可以尽量做出让步，以改善工作关系。


    #### 问题


    虽然我们已经讨论过交给数据科学家过于简单的问题的风险，但你还会发现，许多数据科学家对特定类型的问题有偏好。例如，有些人可能更喜欢处理具有社会影响力的问题，而另一些人则可能专注于像医学这样他们喜欢的领域。


    其他时候，他们可能对问题本身有偏好。例如，有些人更喜欢处理文本数据。


    不过，你通常会看到，这与做和学习新事物紧密相关，而这正是定义数据科学家的特质。


    #### 技术栈


    所使用的技术也扮演着重要角色。一些数据科学家会更喜欢使用他们已熟悉的技术栈，而另一些人则想学习新东西。然而，你会发现大多数数据科学家会像避开瘟疫一样避开旧技术和遗留代码。


    有时，学习新技术对数据科学家来说极为重要。这可能是因为一些新兴技术正在主导领域，比如`Python`，而他们可能想要从`MATLAB`过渡到`Python`和`R`。


    或者，数据科学家可能想扩展自己的技能组合，因为某些技术（比如与深度学习相关的技术）能带来更好的薪酬，也更有趣。


    #### 与学术界的关系


    许多数据科学家出身于学术界，习惯于阅读/撰写论文和参加学术会议。这对所有人来说都是一个优势，因为参加会议可能是保持他们在领域前沿的重要一环。因此，激励数据科学家的一种方式就是提供会议津贴。


    而且，正如我所说，这对你也有好处，因为你的数据科学家会了解到数据科学领域新兴的发展动态，他们会了解到之前未曾涉足的领域或应用，并会与他们领域内的其他人交流。


    你可以预期一位博士级别的数据科学家希望参加的一些数据科学会议包括：


    - `ICML`：国际机器学习大会

    - `NeurIPS`：神经信息处理系统大会

    - `SIGKDD`：ACM SIGKDD 国际知识发现与数据挖掘会议

    - `ECML PKDD`：欧洲机器学习与数据库知识发现会议

    - `AI Stats`


    ### 避免传统限制


    招聘数据科学家时一个常见的问题是，雇主常常采取与招聘企业内其他职位相同的方法。这通常涉及询问对方是否有特定领域的经验。


    然而，许多数据科学家（包括我自己）会特意寻找他们以前没有涉足过的领域。这完全是出于学习新事物和避免无聊的动力，因为你没做过的事情肯定比你有经验的事情更有趣。


    作为潜在雇主，你需要理解的关键点是，数据科学家所使用的技术具有普遍适用性，而领域本身是次要的。换句话说，不要因为一位优秀的数据科学家没有你特定领域的经验就错过他们。


    ### 数据科学是一个通用工具箱


    数据科学中的技术可以应用于各种问题。在一个方面的经验可以转化为在其他方面的经验。例如，一位数据科学家可能用相同的算法来预测疾病爆发，也可以用它们来预测有多少人会点击广告。


    把它想象成一位糕点师。他们学习广泛的技术，包括处理不同类型的面团、制作酱料、制作奶油等等。而且他们在制作蛋糕方面经验丰富。然而，正因为他们对这些技术高度熟练，他们可以轻松地从做蛋糕切换到做馅饼。


    例如，我常见到人力资源部门犯的一个错误是：


    - “我们在寻找一位有 5 年`TensorFlow`经验的人，”人力资源部说。

    - “好吧，但是`TensorFlow`才出现两年，”候选人或招聘公司回答道。


    对于数据科学家而言，他们知识的广度通常比单纯的年限更能体现其技能。


    问题是许多雇主不了解数据科学家的技能组合——当然，你不是这样，因为你正在读这本书，对数据科学以及数据科学家的职责有了更深入的理解。结果就是，由于缺乏理解，许多数据科学家被局限在了某个特定领域。


    我们以一位在金融领域工作的数据科学家为例。在金融领域，数据科学会使用时间序列和预测建模等工具。然而，这些工具并不仅限于金融领域。它们对许多其他领域也同样有效，比如体育博彩甚至零售。例如，在零售业，你可以用时间序列来预测需求。


    然而，大量雇主看到这位数据科学家有金融经验，就会自动认为他们的技能只适用于金融领域。这意味着他们可能会错过一位出色的数据科学家。


    所以，不要犯同样的错误，给这些人一个机会，即使他们不符合你心中对完美员工的严格定义。


    ### 发现年轻人才


    数据科学有点像体育，天赋在其中扮演着巨大角色，尤其因为它需要技术技能和软技能的结合，正如我们之前讨论过的。这个人需要能够理解他人，能够建立别人看不到的联系，并且能够良好沟通，这超越了技能组合中的技术层面。他们还必须能够顺利地将软技能和技术技能结合起来，这并不总是听起来那么容易。


    所以，当你发现有人明显具备从事这项工作的天赋时，一定要牢牢抓住他们，即使他们正处于职业生涯的起步阶段。请记住，今天的一位初级数据科学家，如果你给予机会并用心培养，未来可能成为你的高级数据科学家。


    你如何能找到有才华的年轻数据科学家？首先，你想看看那些教授这门学科的顶尖大学。然后，一旦确定了潜在的候选人，就要超越他们的大学成果去寻找。你可以在`GitHub`这样的网站上查看他们做过的课外项目。


    你还应该考虑创建一个导师计划。这将让你能够识别有数据科学天赋的人，其中一些人，你可能直到与他们近距离合作后才会意识到他们有这样的潜力。

    '
- fmt: '### A Few Typical Data Scientist Dilemmas


    When it comes to data scientists, they are faced with a few dilemmas in terms
    of whom to work for. The options are a startup vs. a bigger company. Each comes
    with its own set of pros and cons.


    First of all, there''s the startup. When it comes to a startup, things will certainly
    be more interesting for a data scientist. They''ll be dealing with new technologies
    and new problems, and they''ll have a lot more flexibility. However, the downside
    is that they''ll likely get paid less and stability can be an issue because, after
    all, many startups don''t succeed.


    Then you have big companies. The main advantages are that the paycheck will be
    much more impressive, as will the benefits package. There''s also the matter of
    stability. A big company is unlikely to go belly up overnight and leave a data
    scientist in the lurch.


    On the opposite end of the spectrum, though, the fact is that a data scientist
    might end up pulling out their hair in frustration because the work will be boring
    and as far from stimulating as you can get because they''ll be dealing with old
    technology and legacy code, which they''ll have to clean up. So, no, it''s not
    going to be fun. At all.


    ### Freeze Your Data Scientist Recruitment Drive Now


    If your company isn''t ready for data science, you need to stop trying to hire
    a data scientist. What does it mean to be ready for data science?


    Well, first of all, you need to make sure your company has a data-driven culture
    in place. Everyone in your organization needs to understand the value of data,
    and they need to be willing to use it effectively.


    If everyone thinks data is a waste of time or just something you''re doing because
    it''s the latest "fad," then you are going to waste your money and time hiring
    a data scientist.


    Don''t worry though, because a little later we''re going to talk about how to
    build a data science culture and you''ll know exactly what you need to do.


    The next consideration is whether or not you have the data available. If you haven''t
    collected the data, then you might as well wait until you have it. Otherwise,
    you''ll be paying a data scientist to sit around and look pretty. It will also
    antagonize the data scientist because, as I''ve already mentioned, boredom is
    one of the things they hate the most. And a data scientist with nothing to work
    is a bored data scientist who will likely end up leaving your company faster than
    you can blink.


    Lastly, you need to make sure the data scientist''s work will have an impact.
    Just hiring someone to make data look pretty so you can show off but that''s about
    it is a waste of resources. You need to make sure that you have a clear goal in
    mind—an important question that needs answering—or you''ll be wasting your time
    and that of the data scientist''s too.


    When you do hire a data scientist, don''t use them just as a highly sophisticated
    reporting tool. They are a lot more than that and you need to listen to their
    ideas and trust their recommendations. Don''t make the mistake of thinking you
    know it all.


    After all, would you tell your electrician how to rewire your house? Or would
    you tell your surgeon how to operate on you? Of course not. You''d let them do
    their jobs and take their advice, because they''re the experts. So, why would
    you do anything differently with your data scientist?


    You also need to let them spread their wings. Don''t freak out if they want to
    tackle the problem using a completely new approach. Just because it''s not in
    line with what you had in mind doesn''t mean it''s not effective. In fact, trying
    something new is the best way to find the most effective solution.


    Remember, doing the same thing over and over again and expecting different results
    is the definition of insanity. So, you need to give your data scientist the freedom
    to try something new.


    Just put things a little more in perspective for you regarding why you shouldn''t
    be hiring a data scientist if you''re not ready; I remember a situation a while
    ago where a company hired a data scientist. However, the data scientist resigned
    after only two months, and they weren''t happy when they did so.


    What happened was that the company didn''t have any data for the scientist to
    work on. They were still collecting it, but they jumped the gun, somehow thinking
    they needed a data scientist on board to look pretty while they were still gathering
    the information.


    Even worse, though, was the fact that they didn''t have a clear goal. They just
    wanted insights, which is way too vague a goal for anyone to do anything with.
    Of course, with no clear goal, you can imagine that the data collection process
    was also not up to standards.


    To be honest, I''m pretty sure the data scientist didn''t quit just out of boredom—though
    that was an issue. He probably knew he''d have to deal with people who had no
    understanding of what he did. He''d have to educate them, then force them to set
    a goal, and then try to turn a bunch of random data into something he could work
    with. It would have been more hassle than it was worth.


    ## Data Science Tribes


    Now we''re going to look at the different types of data scientists. I call them
    tribes because I feel it''s a very good word to describe the different groups
    of people within data science. You don''t have just one type of person because
    you don''t have just one way to become a data scientist.


    It''s not like becoming a doctor where your only path is to go to med school,
    then do your residency, and get certified. When it comes to data scientists, there
    are several ways to get to the same end result.


    This is why I believe we can basically split data scientists into *three major
    tribes* and *three smaller tribes*.


    In terms of the major tribes, we have the **computer scientist**, the **statistician**,
    and the **quantitative specialist** who hails from some other field.


    The smaller tribes consist of the **self-taught data scientist**, the **software
    platform user**, and the **domain specialist**.


    It''s also important to note here that data scientists and data engineers are
    now considered to be completely different things, even if in the early days the
    two roles were frequently mixed up and even if data scientists usually have a
    computer science background but also have some data engineering skills.


    ### The Major Tribes


    So, let''s take a quick look at the three major tribes, namely, computer scientists,
    statisticians, and other quantitative specialists.'
  raw: '### A Few Typical Data Scientist Dilemmas


    When it comes to data scientists, they are faced with a few dilemmas in terms
    of whom to work for. The options are a startup vs. a bigger company. Each comes
    with its own set of pros and cons.


    First of all, there’s the startup. When it comes to a startup, things will certainly
    be more interesting for a data scientist. They’ll be dealing with new technologies
    and new problems, and they’ll have a lot more flexibility. However, the downside
    is that they’ll likely get paid less and stability can be an issue because, after
    all, many startups don’t succeed.


    Then you have big companies. The main advantages are that the paycheck will be
    much more impressive, as will the benefits package. There’s also the matter of
    stability. A big company is unlikely to go belly up overnight and leave a data
    scientist in the lurch.


    On the opposite end of the spectrum, though, the fact is that a data scientist
    might end up pulling out their hair in frustration because the work will be boring
    and as far from stimulating as you can get because they’ll be dealing with old
    technology and legacy code, which they’ll have to clean up. So, no, it’s not going
    to be fun. At all.


    ### Freeze Your Data Scientist Recruitment Drive Now


    If your company isn’t ready for data science, you need to stop trying to hire
    a data scientist. What does it mean to be ready for data science?


    Well, first of all, you need to make sure your company has a data-driven culture
    in place. Everyone in your organization needs to understand the value of data,
    and they need to be willing to use it effectively.


    If everyone thinks data is a waste of time or just something you’re doing because
    it’s the latest “fad,” then you are going to waste your money and time hiring
    a data scientist.


    Don’t worry though, because a little later we’re going to talk about how to build
    a data science culture and you’ll know exactly what you need to do.


    The next consideration is whether or not you have the data available. If you haven’t
    collected the data, then you might as well wait until you have it. Otherwise,
    you’ll be paying a data scientist to sit around and look pretty. It will also
    antagonize the data scientist because, as I’ve already mentioned, boredom is one
    of the things they hate the most. And a data scientist with nothing to work is
    a bored data scientist who will likely end up leaving your company faster than
    you can blink.


    Lastly, you need to make sure the data scientist’s work will have an impact. Just
    hiring someone to make data look pretty so you can show off but that’s about it
    is a waste of resources. You need to make sure that you have a clear goal in mind—an
    important question that needs answering—or you’ll be wasting your time and that
    of the data scientist’s too.


    When you do hire a data scientist, don’t use them just as a highly sophisticated
    reporting tool. They are a lot more than that and you need to listen to their
    ideas and trust their recommendations. Don’t make the mistake of thinking you
    know it all.


    After all, would you tell your electrician how to rewire your house? Or would
    you tell your surgeon how to operate on you? Of course not. You’d let them do
    their jobs and take their advice, because they’re the experts. So, why would you
    do anything differently with your data scientist?


    You also need to let them spread their wings. Don’t freak out if they want to
    tackle the problem using a completely new approach. Just because it’s not in line
    with what you had in mind doesn’t mean it’s not effective. In fact, trying something
    new is the best way to find the most effective solution.


    Remember, doing the same thing over and over again and expecting different results
    is the definition of insanity. So, you need to give your data scientist the freedom
    to try something new.


    Just put things a little more in perspective for you regarding why you shouldn’t
    be hiring a data scientist if you’re not ready; I remember a situation a while
    ago where a company hired a data scientist. However, the data scientist resigned
    after only two months, and they weren’t happy when they did so.


    What happened was that the company didn’t have any data for the scientist to work
    on. They were still collecting it, but they jumped the gun, somehow thinking they
    needed a data scientist on board to look pretty while they were still gathering
    the information.


    Even worse, though, was the fact that they didn’t have a clear goal. They just
    wanted insights, which is way too vague a goal for anyone to do anything with.
    Of course, with no clear goal, you can imagine that the data collection process
    was also not up to standards.


    To be honest, I’m pretty sure the data scientist didn’t quit just out of boredom—though
    that was an issue. He probably knew he’d have to deal with people who had no understanding
    of what he did. He’d have to educate them, then force them to set a goal, and
    then try to turn a bunch of random data into something he could work with. It
    would have been more hassle than it was worth.


    ## Data Science Tribes


    Now we’re going to look at the different types of data scientists. I call them
    tribes because I feel it’s a very good word to describe the different groups of
    people within data science. You don’t have just one type of person because you
    don’t have just one way to become a data scientist.


    It’s not like becoming a doctor where your only path is to go to med school, then
    do your residency, and get certified. When it comes to data scientists, there
    are several ways to get to the same end result.


    This is why I believe we can basically split data scientists into *three major
    tribes* and *three smaller tribes*.


    In terms of the major tribes, we have the **computer scientist**, the **statistician**,
    and the **quantitative specialist** who hails from some other field.


    The smaller tribes consist of the **self-taught data scientist**, the **software
    platform user**, and the **domain specialist**.


    It’s also important to note here that data scientists and data engineers are now
    considered to be completely different things, even if in the early days the two
    roles were frequently mixed up and even if data scientists usually have a computer
    science background but also have some data engineering skills.


    ### The Major Tribes


    So, let’s take a quick look at the tree major tribes, namely, computer scientists,
    statisticians, and other quantitative specialists.'
  trans: '

    ### 典型的数据科学家两难抉择


    对于数据科学家而言，他们在选择为谁工作时会面临一些两难抉择。选项无非是初创公司和大公司。二者各有其优缺点。


    首先说说初创公司。对于数据科学家来说，在初创公司工作无疑会更有趣。他们会接触到新技术和新问题，并且拥有更大的灵活性。然而，缺点是薪水可能较低，而且稳定性也是个问题，毕竟许多初创公司最终都以失败告终。


    然后是大公司。主要的优势在于薪资会丰厚得多，福利待遇也同样诱人。稳定性也是一个重要因素。一家大公司不太可能一夜之间倒闭，让数据科学家陷入困境。


    然而，从另一个极端来看，事实是数据科学家可能会因为工作枯燥乏味、毫无刺激感而抓狂，因为他们需要处理陈旧的技术和遗留代码，并且还得负责清理这些代码。所以，这绝对谈不上有趣，一点都没有。


    ### 立即冻结你的数据科学家招聘计划


    如果你的公司还没为数据科学做好准备，那你就该停止招聘数据科学家的尝试。什么是为数据科学做好准备好了呢？


    首先，你需要确保公司已经建立起一种数据驱动的文化。组织中的每个人都需要理解数据的价值，并且愿意有效地使用它。


    如果每个人都认为数据是浪费时间，或者觉得你只是因为这是最新的“潮流”才这么做，那么你招聘数据科学家就是在浪费金钱和时间。


    不过别担心，稍后我们会讨论如何建立数据科学文化，届时你就会清楚自己需要做什么了。


    下一个要考虑的因素是，你是否拥有可用的数据。如果你还没收集好数据，那不妨等数据到位再说。否则，你就是在花钱请一位数据科学家干坐着当摆设。这也会激怒数据科学家，因为正如我提过的，无聊是他们最讨厌的事情之一。而一个无事可做的数据科学家会感到无聊，并且很可能在你一眨眼功夫就离职了。


    最后，你需要确保数据科学家的工作能产生实际影响。如果只是雇个人把数据弄得好看点，用来炫耀一下，那就没什么其他用处，那纯粹是浪费资源。你需要确保自己心里有明确的目标——一个需要解答的重要问题——否则你既浪费了自己的时间，也浪费了数据科学家的时间。


    当你真正雇佣了一位数据科学家时，不要仅仅把他们当成一个高级的报告工具。他们的价值远不止于此，你需要听取他们的想法，并信任他们的建议。不要犯那种以为自己无所不知的错误。


    说到底，你会去教你的电工如何重新布线你的房子吗？或者你会去指导你的外科医生如何给你做手术吗？当然不会。你会让他们做自己的工作，并听取他们的建议，因为他们是专家。那么，对待你的数据科学家，你为什么就要另搞一套呢？


    你还需要让他们展翅高飞。如果他们想用全新的方法来解决某个问题，不要太惊讶。仅仅因为这与你的想法不一致，并不意味着它没有效果。事实上，尝试新事物正是找到最有效解决方案的最佳途径。


    请记住，一遍又一遍地做同样的事情却期待不同的结果，那简直是疯了。所以，你需要给予你的数据科学家尝试新事物的自由。


    为了让你更清楚地明白为什么还没准备好就不该招聘数据科学家，我想起不久前的一家公司招聘数据科学家的例子。然而，那位数据科学家仅仅两个月后就辞职了，而且离职时还很不愉快。


    事情是这样的：公司没有任何数据可供这位科学家处理。他们还在收集数据，但他们操之过急了，不知怎地认为在收集信息的同时，需要先有一位数据科学家在座充充门面。


    更糟糕的是，他们根本没有明确的目标。他们只是想要“洞察”，这个目标对于任何人都太模糊了，根本无法着手。当然，没有明确的目标，你可以想象数据收集过程也不符合标准。


    老实说，我很确定那位数据科学家辞职不仅仅是因为无聊——尽管那也是一个问题。他可能知道自己将要和一群完全不懂他在做什么的人打交道。他得先教育他们，然后强迫他们设定目标，再试图把一堆杂乱无章的数据变成他能处理的东西。这实在太费劲了，根本不值得。


    ## 数据科学部落


    现在我们来看看不同类型的数据科学家。我称他们为“部落”，因为我觉得这个词非常适合描述数据科学领域内不同的群体。你不可能只有一种类型的人，因为成为数据科学家的途径也不止一条。


    这不像成为医生那样，唯一的路径就是上医学院、做住院医师、然后获得认证。对于数据科学家来说，有好几种方式可以达到同样的最终目标。


    这就是为什么我认为我们基本上可以把数据科学家分为*三个主要部落*和*三个较小的部落*。


    就主要部落而言，我们有**计算机科学家**、**统计学家**以及来自其他领域的**定量分析专家**。


    较小的部落则包括**自学成才的数据科学家**、**软件平台用户**和**领域专家**。


    这里还有一点很重要，那就是数据科学家和数据工程师现在被认为是完全不同的角色，即便在早期这两种角色经常被混淆，也即便数据科学家通常拥有计算机科学背景但同时也具备一些数据工程技能。


    ### 主要部落


    那么，让我们快速了解一下这三个主要部落：计算机科学家、统计学家以及其他定量分析专家。

    '
- fmt: '# Computer Scientists


    Computer scientists are the people who have degrees in computer science and then
    did a master’s or PhD in machine learning. The advantages are that they usually
    have very good skills in coding, databases, and software, but the issue is that
    they usually ignore traditional statistical techniques in theory, which can be
    useful in some particular domains and problems.


    Computer scientists are very good for issues in machine learning tasks such as
    predictive modeling. Quite often they’ll have experience in Kaggle competitions,
    which is a prime example of this kind of problem.


    Note that Kaggle is a platform that runs predictive modeling and analytics competitions.^(78)
    Companies and users upload datasets and then statisticians, data scientists, and/or
    other specialists compete to create the best possible models for predicting and
    describing those datasets. It’s a form of crowdsourcing and relies on the idea
    that countless strategies can be employed in a predictive modeling task and one
    can’t know ahead of time which analyst or approach will be the best. Kaggle is
    now part of Google Cloud.^(79)


    You’re given a dataset and you just want to find a good algorithm to predict something.
    The fact that most computer scientists have solid coding skills means it’s easier
    to integrate their work with the rest of the platform, especially if you’re a
    small company or a startup. The majority will be using Python and won’t have any
    problem writing their own APIs. So, essentially, you can use their skills to do
    many things at once, as they can write the code and integrate it as well.


    Also, they have solid database skills, so they can do a lot of data engineering
    work. If you have your own data engineers, it’s still worth it because it’s easy
    for these people to retrieve the data, wrangle it into something usable, and so
    on. This will save your developers time. They might also be able to make suggestions
    pertaining to the structure of the database, making your life even easier.


    However, they have a lack of proper knowledge of statistics so, for some particular
    problems where statistics is appropriate, such as research design, these people
    can’t really help you.


    # Statisticians


    Statisticians are people who usually have a degree in statistics. They might even
    have a master’s or PhD, which can be in statistics or machine learning. They generally
    have a good theoretical grounding in the field, but they don’t have the coding
    or database skills.


    Statisticians have very solid knowledge of statistics and theory. They are the
    best people if what you are interested in is research design or statistical modeling
    because you want to know the driving factors behind something.


    They’re also the best option if you want to model advanced complicated problems
    while at the same time making sure that the modeling process is transparent, and
    you understand what’s happening.


    They are also excellent at taking a critical look at the work of other data scientists
    because of the rigorous training in math and theory.


    The problem is, though, that most of the time they don’t really have very good
    skills in coding and databases. The most likely language they’ll be using is R,
    which they will use as a tool. They probably don’t have any experience in other
    languages or in databases, which will make it more difficult and time-consuming
    to integrate their work within the system.


    Also, some statisticians don’t have much training in predictive modeling. On its
    own, predictive modeling is rarely considered to be important in the context of
    statistics and is more aligned with machine learning.


    So, check if they have any Kaggle experience. It also pays to ensure that they’re
    familiar with some sort of machine learning notions, such as cross-validation,
    if you’re interested in using their skills for predictive modeling.


    # Other Quantitative Specialists


    Finally, we have what I call other quantitative specialists. These are people
    who come from disciplines heavy in math, such as physics, mathematics, actuarial
    science, econometrics, and so on. These people might have a master’s degree or
    PhD degree, but this won’t be in machine learning or statistics.


    These are basically people who figured out that there are more (and better jobs)
    in data science than in their field of study, and they are trying to change careers.
    They are trying to capitalize their knowledge in math and/or coding in order to
    make that happen. You will see a huge variation in terms of skills and knowledge
    in this tribe.


    These quantitative specialists are a bit special because they often have some
    solid skills and bring a diversity of thinking that’s very important in data science.
    Furthermore, if the problem you’re dealing with is in their specific domain, they
    are definitely amazing people to hire.


    However, the problem is that they often lack rigorous training in machine learning
    or statistics, which can pose a serious problem in certain situations.


    So, when it comes to other quantitative specialists, it tends to be subjective
    in the sense that it depends on the person. However, the main drawback is that
    these people often lack formal education in the field.


    They tend to be self-taught and you need to understand this fact and check to
    see how effective they are. You can likely find examples of their work on GitHub
    or Kaggle, for example. And you really want to check beforehand. Please note that
    being self-taught is not a bad thing—far from it. However, you need to check to
    ensure their skills are on par with your needs.


    These are often people who studied one field and discovered the pay isn’t that
    brilliant or finding a job was virtually impossible. Then they discover being
    a data scientist comes with a hefty paycheck, so a chemist might decide, for example,
    to create a few mini projects, upload them to GitHub, or take part in a few competitions
    on Kaggle in an attempt to find a job as a data scientist.


    In my experience, of all the specialties these people have, I’ve found that the
    people who are the most effective are physicists. Physics is full of applied math,
    which makes it easy for them to read machine learning papers, especially since
    it’s, in essence, the same type of math. Furthermore, physicists need to be able
    to do a little coding themselves, so the skillset is similar to the one required
    in machine learning.


    Something important to note is that domain specialists will have expertise in
    their respective fields, which might prove useful to you. For example, you might
    want to hire someone who has some experience in econometrics and a little bit
    of machine learning knowledge because your problem is related to econometrics
    in some way. Or, you might want to hire a physicist because you are working with
    sensor data or radar data.


    However, you have to be careful with these other quantitative specialists because
    some of them will try to fake it. They’ll go through a few tutorials and online
    courses for two weeks and, suddenly, they believe they’re data scientists. And
    that’s just because they want to get the job. You have to be really cautious of
    these people because they can derail your whole project and cause a lot of problems.


    This doesn’t mean that you shouldn’t consider people who have little experience
    but are honest about it and prove they are smart and willing to learn. They want
    to gain more experience and are intelligent people who have the potential to become
    outstanding data scientists.


    However, in my opinion, it’s best to take these people on in a junior position
    with someone more experienced to oversee them. Of course, the person overseeing
    them should be a senior data scientist. If you don’t have a senior data scientist,
    hire one first. Then, you can follow their progress as a junior and see how they
    grow. Depending on their evolution, you can choose to promote them or not.'
