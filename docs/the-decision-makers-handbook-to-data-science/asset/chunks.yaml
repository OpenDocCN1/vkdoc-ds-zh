  trans: '

    ## AI 的新前沿：大型语言模型与 Transformer 网络


    随着大型语言模型（`LLMs`）和 Transformer 网络的引入，人工智能领域已发生变革。这些进步代表了从传统计算方法的重要演变，为理解和生成人类语言提供了精妙的方法。


    ### 大型语言模型：复杂任务的精妙工具


    大型语言模型因其能以高度接近人类语言能力的精度解释和生成文本，已成为 AI 领域的核心。这些模型经过海量互联网文本的严格训练，使其具备处理多样化语言任务的能力。`LLMs`
    不仅限于文本生成，还在撰写专业邮件、综合报告合成，甚至软件开发流程的自动化等专业应用中展现出高超水平。


    `LLMs` 最显著的特性之一是其适应性。基础训练完成后，它们可针对特定行业或任务进行微调，从而成为通用与专业场景中的多用途工具。


    大型语言模型（`LLMs`）在主流技术领域的发展轨迹，深受 OpenAI 推出的 `ChatGPT` 影响。这款开创性模型展示了 `LLMs` 的实用性与潜力，点燃了各领域的广泛兴趣。OpenAI
    的举措证明了此类模型能进行对话、回答问题，甚至执行传统上由人类完成的任务。此后，谷歌推出了 `Bard`，这项 AI 服务旨在对话场景中利用语言理解与生成的力量。这些科技巨头的入局标志着一个关键转折点，预示着
    `LLMs` 大规模应用的到来。


    因此，该领域正见证着越来越多的发展。新模型不断涌现，不断突破 AI 的可能性边界，拓展其在日常技术中的应用前景。这种快速演进凸显了 AI 的变革时期，更复杂的模型正被推向消费者和企业技术的最前沿。


    ### Transformer 网络：现代 AI 的架构基石


    Transformer 网络正是这些强大语言模型的核心。这种创新架构通过实现数据并行处理，彻底革新了学习过程。凭借独特的注意力机制，Transformer
    网络能优先处理数据中的相关片段，有效模仿人类聚焦关键信息的能力。


    其应用已超越文本数据，Transformer 网络在图像和音频处理任务中也展现出卓越能力。这种适应性凸显了其作为应对多种 AI 挑战的通用架构的潜力。


    ### 由 LLMs 驱动的新一代 AI 应用


    以 Transformer 网络为支撑的 `LLMs` 能力，为新一代 AI 应用打开了大门。在客户服务领域，聊天机器人已变得更加响应灵敏且具备语境意识，为用户提供无缝体验。创意产业正利用
    AI 增强艺术创作过程，而企业则运用这些工具进行数据分析和战略规划。


    在医疗领域，`LLMs` 开始辅助分析医学文献，提供有助于诊断和治疗规划的总结与见解。跨行业来看，这些 AI 模型正被整合以提升生产力和创新能力。


    在我们拥抱 `LLMs` 与 Transformer 网络的潜力时，必须以热情与伦理考量并重的方式推进。确保负责任地使用这些技术，对于继续探索 AI 能力边界及其社会影响至关重要。

    '
- fmt: '### Data Science and AI: The Skills Needed


    `Data science` makes it much easier to explain everything, unless one wants to
    spend half an hour explaining all the fields and subfields. Even then, most people
    aren’t going to understand, especially if they’re not in related fields.


    It’s much simpler to say one is a data scientist who does stuff with data. It’s
    certainly a lot better than going into a lengthy litany about knowing machine
    learning, data mining, statistics, and so on.


    However, even data science is not an infallible term and can cause a little confusion.
    Some might think that data engineering, databases, big data, and data analysts
    are pretty much the same thing. But they aren’t. So, what are the differences?
    Well, let’s take a look at what these terms mean.


    - **Data Scientist**: A data scientist is someone who works with data. However,
    this term has been expanded lately to refer to someone who analyzes data, but
    who also has some form of advanced training in a related field, such as a PhD
    in Machine Learning, or a master’s in Statistics.


    - **Data Engineer**: A data engineer is someone who designs, builds, and manages
    the infrastructure for the information of big data. This the person who develops
    the architecture that helps to analyze and process data. To make a cooking analogy,
    the data scientist is the chef, while the data engineer encompasses all the tool
    manufacturers (knives, pots, pans, stoves, etc.) and ingredient vendors who provide
    the chef with everything they need to create a dish.


    - **Big Data**: Big data is a buzzword as it simply refers to massive data sets
    that are so large and complicated, traditional data processing application software
    simply can’t handle them. It relates to NoSQL databases, cloud computing, Hadoop,
    and so on. However, it is not used as much any longer.


    - **MLOps**: MLOps stands for Machine Learning Operations, the crucial bridge
    between developing a machine learning model and bringing it into the real-world
    where it can provide value. MLOps experts are the conductors of the machine learning
    orchestra, ensuring each section —development, deployment, and maintenance plays
    in harmony. They utilize tools like `Kubernetes` for orchestration, `Docker` for
    containerization, and `Jenkins` or `GitLab` for continuous integration and delivery,
    creating seamless workflows that transform a model from a prototype into a production-grade
    asset. The professionals that focus on MLOps often go by the title of “machine
    learning engineer.”


    - **Deep Learning**: Deep Learning is the cutting-edge subset of machine learning,
    drawing inspiration from the human brain’s neural networks. Their domain involves
    developing models that process and interpret intricate patterns within large data
    sets, a task that requires proficiency with deep learning frameworks such as `TensorFlow`
    and `PyTorch`. These professionals possess a deep understanding of neural network
    theory and are adept at employing computational resources, including GPUs, to
    train models capable of tasks ranging from image recognition to natural language
    processing.


    Table [1-1](#490014_3_En_1_Chapter.xhtml#Tab1) shows the important skills for
    the different categories of data professionals.


    **Table 1-1** Important skills for different categories of data professionals,
    ranked out of 3


    | | Data analyst | Machine learning engineer | Data engineer | Data scientist
    |

    | --- | --- | --- | --- | --- |

    | **Programming Tools** | **3/3** | 1/3 | **3/3** | **3/3** |

    | **Data Intuition** | **3/3** | **3/3** | 1/3 | **3/3** |

    | **Data Visualization** | **3/3** | 2/3 | 1/3 | **3/3** |

    | **Statistics** | 2/3 | 2/3 | 0/3 | **3/3** |

    | **Machine Learning** | 0/3 | **3/3** | 0/3 | **3/3** |

    | **Software Engineering** | 0/3 | 2/3 | **3/3** | 2/3 |

    | **Data Wrangling** | 0/3 | **3/3** | **3/3** | **3/3** |

    | **Mathematics** | 0/3 | **3/3** | 0/3 | 2/3 |

    | **Databases** | 0/3 | 1/3 | **3/3** | 2/3 |


    #### What Does a Data Scientist Need to Know?


    We will delve much more into data scientists later on in this book, but here is
    a quick overview.


    While data scientists can come from varied backgrounds, you will usually find
    three types.


    First you have the statisticians, some of which don’t like to be called data scientists.


    Then you have people with computer science backgrounds who studied machine learning
    and have either master’s degrees or PhDs in the field.


    Lastly, you have people coming from other disciplines, like physics, who learned
    to use data science tools and migrated to the field.


    ### GENERAL AI VS. NARROW AI


    One the hottest trending topics of our times is “general artificial intelligence.”
    This term refers to the creation of artificial intelligence that can be just as
    smart as we are. People who believe that this is achievable in the foreseeable
    future, also believe in the concept of a “singularity.” A singularity in physics
    is defined as a moment when the physical models break down (e.g., a situation
    that exists in the center of a black hole). A technological singularity is a situation
    where everything we know about society and technology will break down, and something
    new and unpredictable will show up.


    This is based on the following kind of reasoning. While we, humans, possess intelligence,
    we are limited in our cognitive capacity. We can’t hold an infinite size of information
    in our brain. We can think fast, but not faster than a computer makes calculations.
    Also, we can get tired, and we need to sleep.


    A general artificial intelligence will have our own ability to think, but none
    of our limitations. Hence, if a machine had the intelligence of a gifted mathematician,
    then, in theory, it could come up with a huge number of mathematical theorems
    within seconds. It could develop capabilities, and make inventions that would
    take humans many lifetimes to achieve.


    There are people, like Elon Musk, who have described AI as a threat to humanity.
    On the other hand, other people are more optimistic about the potential of General
    AI to change life for the better.


    Irrespective of which side is true, there are a few things that all experts agree
    on now:


    1. We don’t have a clear path to general AI. There is not a single method or technology
    that is guaranteed to achieve this result.


    2. Based on the current technological progress, it is very likely that we will
    see general AI being achieved within our century.


    3. While the results of general AI might not be as dramatic as some people expect,
    everyone agrees that there will be huge disruption in multiple areas: from health
    research to military.


    Narrow AI, also known as Weak AI, refers to AI systems that are designed to handle
    specific tasks. They operate within a set framework of capabilities and are adept
    at executing particular functions. For instance, language translation programs,
    facial recognition software, and recommendation engines all fall under the umbrella
    of Narrow AI. These systems are highly efficient within their scope but lack the
    ability to perform beyond their predefined tasks.


    1. **Virtual Personal Assistants**: Siri, Alexa, and Google Assistant respond
    to voice commands, perform Internet searches, manage schedules, and control smart
    home devices, but they are programmed to function within a certain range of capabilities.


    2. **Recommendation Systems**: Netflix, Spotify, and Amazon use Narrow AI to analyze
    your past behavior and preferences to recommend movies, songs, and products.


    3. **Fraud Detection**: Financial institutions employ Narrow AI to monitor transactions.
    These systems can flag unusual patterns indicative of fraudulent activity, based
    on predefined rules and historical data.


    4. **Traffic Navigation**: Apps like Google Maps and Waze analyze vast amounts
    of traffic data in real-time to suggest the quickest routes to drivers.'
