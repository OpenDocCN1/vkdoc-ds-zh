- fmt: '## What Problem Do You Really Need to Solve?


    Sometimes the problem you think you are solving is not the one you need to solve.
    Let’s say you want to predict the price of Bitcoin to make a profit. This is a
    very difficult problem—I’ve done a lot of work on it so I should know.


    However, if your goal is to profit from Bitcoin, this is actually a different
    problem. Maybe you’re interested in whether the price is climbing or falling.
    Or maybe you want to use reinforcement learning to create an algorithm trading
    bot to do it for you.


    The important bit here is that the actual problem you are trying to solve will
    influence the final success of your model! Good data scientists know how to pick
    their battles wisely, so as to maximize success. We saw an example earlier where
    the data acquisition considerations interact with the business plan. The same
    holds here.


    Always make sure to discuss these issues with the data scientist. I’ve seen months
    being wasted, because the client said they needed to do one thing (e.g., regression),
    but in reality the problem would have been solved more easily if the data scientist
    had tried to solve a different problem (e.g., turn the regression problem into
    a three-class classification problem).


    **EXAMPLE: THERE ARE MANY WAYS TO REACH THE TOP**


    A proverb says “there are many ways to the top of the mountain, but the view from
    the top is always the same.” This couldn’t be truer than for the case of data
    science. As it was explained in the chapter, sometimes a problem is not a problem.
    It’s not uncommon for a business to confuse what they want with what they need.


    I had a client once who asked me if I knew how to code a recurrent neural network.
    I answered yes, but I was curious to see why he was so specific about it. It looks
    like he wanted to do image recognition. The thing with image recognition and deep
    learning is that, first, you are most likely to use convolutional neural networks.
    Second, there are many architectures published by big companies, such as Google,
    and research groups and you might be better of using one of these.


    Finally, he wanted the image recognition in order to use it in a recommender system.
    The truth is that for this particular use case, he could have asked the users
    to provide tags about images. Hence, image recognition was not an essential part
    of the problem, which was about suggesting objects to users with similar properties
    to the ones they liked in the past.


    Being too specific when you are not in possession of the full facts can only cause
    confusion. There are other cases where the same thing can happen. I already gave
    an example in finance. Another example relates to medical applications.


    Let’s say that you are interested in sports injuries and you are interested in
    predicting when a player will get injured. There are different ways to approach
    the problem:


    *   **Regression**—How many days someone will play until they get injured?

    *   **Classification**—Break time down in three or four categories (e.g., 1 week,
    1 month, etc.) and try to treat this as a classification problem.

    *   **Survival modeling**—Similar to regression, but different models and assumptions
    are used in this case.


    The performance of each one of those models will be different, and they might
    interact in different ways with your problem. For example, classification has
    the worst resolution (one week can be a lengthy interval in this case), but easier
    to solve. Survival modeling is more suited than regression in this case and has
    more sound assumptions behind it, but there are much fewer survival models than
    models for regression.


    As always, there is no free lunch. Every choice has trade-offs, that’s why it
    is important for a data scientist to be aware of how the results from the models
    can be used to solve the actual problem.


    ## 10. Pitfalls


    Now, we’re going to look at some of the pitfalls in the data science process.
    We’ll go over some of the things that can go wrong when a data scientist is trying
    to solve a problem. We’re going to start with what you shouldn’t do.


    ### What Not to Do


    The first thing you should not try to do is solve a problem by yourself. You might
    be tempted to try to tell the data scientist what solution you’re looking for,
    but this is not the right approach and you’ll see why in a moment.


    Your job is to discover what the problem is, phrase it, and explain it to a data
    scientist following the principles mentioned earlier in the book. Then, you need
    to take your hands off the problem and delegate.


    It might seem trivial to you, but it happens much more often than you’d think.
    Now, let’s take a look at an example to see why this is such an issue.'
