    # 10. Pitfalls


    Now, we’re going to look at some of the pitfalls in the data science process.
    We’ll go over some of the things that can go wrong when a data scientist is trying
    to solve a problem. We’re going to start with what you shouldn’t do.


    ## What Not to Do


    The first thing you should not try to do is solve a problem by yourself. You might
    be tempted to try to tell the data scientist what solution you’re looking for,
    but this is not the right approach and you’ll see why in a moment.


    Your job is to discover what the problem is, phrase it, and explain it to a data
    scientist following the principles mentioned earlier in the book. Then, you need
    to take your hands off the problem and delegate.


    It might seem trivial to you, but it happens much more often than you’d think.
    Now, let’s take a look at an example to see why this is such an issue.'
