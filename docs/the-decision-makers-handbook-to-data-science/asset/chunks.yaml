  trans: '

    # 自动规划


    规划是理性行为的重要组成部分。自动规划与调度是人工智能的一个领域，涉及创建能够选择并组织行动以实现特定结果的系统。


    一个例子是传教士与食人魔问题^(¹²)，这是一个经典的 AI 谜题。定义如下：


    > *在河的一岸有三个传教士和三个食人魔。他们都想过河到对岸。有一艘最多可载两人的船。但如果河的任何一岸食人魔数量超过传教士，传教士就会被吃掉。*


    > *如何利用这艘船安全地将所有传教士和食人魔运送过河？*


    这个问题有点残酷，看似简单，但类似的方法也可用于行程规划。


    该领域的其他类似问题包括汉诺塔问题^(¹³)和旅行商问题。旅行商问题是优化领域的经典标杆，其目标是找到一条路径，让商人走遍一个国家（或其他地理区域）的所有城市。这条路径不能重复经过同一城市，同时要尽可能短。很容易看出这与现实生活中的车辆路线规划有何关联。在图
    1-1 中，你可以看到针对德国所有主要城市的旅行商问题示例。


    ![](img/490014_3_En_1_Fig1_HTML.jpg)


    一幅德国地图上有一个闭合多边形，依次经过柏林、德累斯顿、纽伦堡、慕尼黑、斯图加特、法兰克福、科隆、杜塞尔多夫、埃森、汉诺威、不莱梅和汉堡。


    图 1-1


    旅行商问题示例


    本质上，计算机所做的就是分析每一种可能性，舍弃那些不符合参数要求的情况，同时呈现所有符合要求的选项。


    # AI 寒冬


    如果没有经历“寒冬”，人工智能现在的发展可能会更快。`AI winter` 这个术语指的是人工智能领域兴趣减退，进而导致资金受限的时期。


    1967 年，马文·明斯基预测“在一代人的时间内，‘创造人工智能’的问题将基本得到解决”。然而，到了 1982 年，他承认“AI 问题是科学界有史以来面临的最困难的问题之一”。^(¹⁴)


    第一次重大 AI 寒冬始于 1974 年，结束于 1980 年；第二次始于 1987 年，结束于 1993 年。期间还有其他一些较小的事件，例如：


    *   1966 年：机器翻译失败

    *   1970 年：联结主义的放弃

    *   1971–1975 年：DARPA 对卡内基梅隆大学语音理解研究项目的失望

    *   1973 年：因莱特希尔报告，英国人工智能研究大幅缩减

    *   1973–1974 年：DARPA 普遍削减学术性 AI 研究经费

    *   1987 年：Lisp 机器市场崩溃

    *   1988 年：战略计算倡议取消 AI 新支出

    *   1993 年：专家系统逐渐触底

    *   1990 年代：第五代计算机项目的原始目标悄然消失


    第一次寒冬很大程度上由三个主要因素造成。首先是莱特希尔报告，詹姆斯·莱特希尔爵士教授在该报告中得出结论，其他科学可以完成 AI 领域所做的一切工作，这意味着许多最成功的
    AI 算法无法解决现实世界的问题。^(¹⁵)


    尽管存在争议，这份报告仍然导致英国人工智能研究全面停滞，只有少数几所大学继续研究。其结果是整个欧洲地区用于这项研究的经费被削减。^(¹⁶)


    1969 年，美国通过了《曼斯菲尔德修正案》，要求 DARPA 资助那些有明确使命的研究，而不是没有明确方向的基础项目。本质上，研究人员必须证明他们的项目能很快产生对军方有用的技术。


    结合莱特希尔报告（该报告被视为证明 AI 研究在可预见的未来不太可能提供任何有用成果的证据），DARPA 停止资助这类研究。到 1974 年，几乎不可能找到
    AI 研究的资金。^(¹⁷)


    另一个问题是卡内基梅隆大学的语音理解研究项目。DARPA 想要一个能够响应飞行员语音命令的系统，虽然团队开发了一个能理解英语口语的系统，但单词必须以特定顺序说出。


    DARPA 认为受到了误导，并于 1974 年取消了资助。^(¹⁸) 有趣的是，到了 2001 年，语音识别市场达到了 40 亿美元，并且使用了卡内基梅隆大学团队开发的技术。^(¹⁹)


    1980 年，专家系统在商业上的成功重新点燃了人们对 AI 领域的兴趣。到 1985 年，AI 领域投入超过十亿美元，并形成了一个支持该领域的产业。专门用于更好地处理
    AI 首选编程语言的计算机，被称为 Lisp 机器，被制造出来。


    不幸的是，由于 Sun Microsystems 等公司开发了更高效的替代品，LISP 机器市场崩溃了。这些通用工作站的性能要好得多，LISP 机器无法匹敌。这导致了第二次
    AI 寒冬。


    # 我们从 AI 研究中获得的启示


    尽管存在种种问题，人工智能的研究还是发现了许多有益的东西。例如，如果不是因为 AI 研究，我们不会有处理逻辑规则的算法。


    这类算法的一个早期例子是 Prolog 语言。作为最早基于逻辑的编程语言之一，即使在今天它仍然是最流行的语言之一。它被用于专家系统中的定理证明、类型推断以及自动规划。


    AI 帮助我们的另一个领域也与此相关。自动规划与调度（用于驱动制造业中的自动机器人等事物）否则就不会存在。专家系统或知识表示也是如此。


    当然，所有这些事物自那时起都经历了显著发展，我们离创造真正的人工智能越来越近，但在拥有真正智能的机器之前，我们还有很长的路要走。


    另一个有趣的方面是，认知科学从 AI 中借鉴了很多，反之亦然。开发能够像人类一样思考的智能机器的愿望，需要更好地理解人类思维。这引发了对记忆、感知等更多方面的研究。

    '
- fmt: '#### The Next Step: Enter Machine Learning


    作为术语，“机器学习”由亚瑟·塞缪尔（Arthur Samuel）于1959年在IBM工作期间创造，他是计算机游戏和人工智能领域的先驱。^([^(20)](#fn20))


    他将其定义如下：


    > *“机器学习是关于赋予计算机无需显式编程即可学习的能力。”*


    由于对基于逻辑的知识型方法的关注，机器学习与人工智能之间产生了裂痕。到20世纪80年代，专家系统主导了人工智能领域，统计学不再受到关注。


    随后，机器学习被重组为一个独立领域，并在20世纪90年代开始获得显著发展。它不再专注于创造人工智能，而是转向解决更实际的问题。因此，它不再采用人工智能中盛行的符号方法论，而是开始使用来自统计学和概率论的模型。


    虽然机器学习在概念上是人工智能的一个子领域，但其方法实际上与迄今为止的研究方向相反。^([^(21)](#fn21))


    因此，“经典AI”或“老派AI”采用基于规则的自顶向下方法。本质上，这意味着给计算机提供必须遵循的规则，以达到期望的结果。这种方法的问题在于需要大量的人工输入。


    系统设计者必须能够预测每一种可能性，并为其创建一套规则。此外，由于机器以“如果/那么”（`IF/THEN`）模式思考，不确定性难以处理。


    不幸的是，世界并非总是如此清晰。在现实世界中，`IF`（事件A）发生，并不总是意味着`THEN`（采取行动B）就是解决方案。例如，`IF`（晴天）并不总是导致`THEN`（穿轻薄衣物）。外面可能是冬天，你可能需要穿厚外套。此外，系统只知道提供这个答案，因为它被事先告知该怎么做。


    另一方面，机器学习采用自底向上、数据驱动的方法。因此，机器学习不是用必须遵循的规则来编程计算机，而是使用数据来教计算机该做什么。


    除了提供数据之外，几乎不需要人工输入。这使得机器能更自然地处理不确定性，使其成为一种更有效的方法，因为世界本质上更倾向于概率性而非确定性。


    用我们的下雨类比来说，机器学习的工作方式大致如下：系统被输入大量数据，并分析在某种天气下会发生什么。所以，当天气晴朗时，它看到人们穿着轻薄和厚重的衣物外出。当它意识到温度也很重要时，它会学到更多。本质上，它识别出模式：晴天
    + 寒冷温度 = 更暖和的衣物。机器通过分析并学习所给的数据，自主完成这一过程。


    机器学习在很长一段时间内的问题是，它需要大量数据才能有效工作。幸运的是，随着互联网和廉价存储等技术进步，数据驱动的方法变得越来越流行。它不仅更有效，而且从经济和技术角度来看也更具可行性。


    ##### 机器学习的问题


    当然，机器学习和其他事物一样，也有其缺点。首先，机器学习无法直接处理逻辑规则，如何将机器学习与推理相结合是一个未解决的问题。


    以重力为例。机器学习可以得出结论：如果你松手，物体掉落的概率是0.99。然而，这基于过去的数据，它无法做出逻辑上的飞跃：因为重力，`任何`物体松手后都会掉落。它可以根据过去的事件给出概率，但无法得出以下结论：`IF`（重力）`THEN`（物体掉落）。这种逻辑飞跃连婴儿都能做到，这表明尽管机器学习非常强大，但它远非AI发明者所设想的那种智能。


    另一个问题是，机器学习并非完全透明。大多数算法是一个“黑箱”，输入从一端进入，结果从另一端输出。然而，我们看不到箱子内部发生了什么。想想谷歌著名的搜索算法。我们知道输入搜索字符串，能得到“最”相关的结果，但我们不知道这如何发生。


    可解释的机器学习现在是一个非常活跃的研究领域。^([^(22)](#fn22))'
  raw: '#### The Next Step: Enter Machine Learning


    As a term, machine learning was coined by Arthur Samuel, who was a pioneer in
    computer gaming and AI, in 1959 while working at IBM.^([^(20)](#fn20))


    He defined it as follows:


    > *“Machine learning is about giving computers the ability to learn without being
    explicitly programmed.”*


    A rift caused by the focus on logical, knowledge-based approaches developed between
    machine learning and AI. By the 1980s, expert systems dominated AI, and statistics
    was no longer of interest.


    Machine learning was then reorganized as a separate field and began to gain serious
    traction in the 1990s. Instead of focusing on creating artificial intelligence,
    machine learning shifted its approach and concentrated on solving more practical
    problems. Thus, instead of employing the symbolic methodologies so prevalent in
    AI, it began to employ models taken from statistics and probability theory.


    While machine learning as a concept is a subfield of artificial intelligence,
    its approach was practically opposite to research that had been done so far.^([^(21)](#fn21))


    Thus, “classic AI” or “good-old-fashioned AI” took a ruled-based, top-down approach.
    Essentially, it meant giving computers rules that they had to follow to reach
    the desired outcome. The problem with this approach is that it requires a lot
    of human input.


    The designer of the system must be able to predict every possibility and create
    a set of rules for it. Furthermore, uncertainty is not easily handled because
    the machine thinks in an IF/THEN pattern.


    Unfortunately, the world isn’t always so clear-cut. In the real world, IF (EVENT
    A) takes place, THEN (ACTION B) isn’t always the solution. For example, IF (SUNNY)
    doesn’t always result in THEN (WEAR LIGHT CLOTHING). It could be winter out and
    you could need a heavy coat. Furthermore, the system only knows to provide this
    answer because it’s been told what to do.


    Machine learning, on the other hand, takes a bottom-up, data-driven approach.
    So, instead of programming a computer with rules it must follow, machine learning
    uses data to teach the computer what to do.


    There is very little human input involved, other than providing the data. This
    allows the machine to handle uncertainty more naturally, making it a more effective
    approach since the world is fundamentally more probabilistic than certain.


    With our rain analogy, machine learning would work a little like this. The system
    is fed a ton of data and it analyzes what happens when there is a certain type
    of weather. So, when it’s sunny, it sees people going out in both light and heavy
    clothing. It learns even more when it makes the connection that temperature also
    matters. Essentially, it recognizes patterns: sun + cold temperature = warmer
    clothing. The machine does this on its own by analyzing and learning from data
    it has been given.


    The problem with machine learning for a while was that it required a lot of data
    to work effectively. Thankfully, with technological progress like the development
    of the Internet and cheap storage, the data-driven approach has become more popular.
    Not only is it more effective, but it’s also more feasible from an economic and
    technological viewpoint too.


    ##### The Problem with Machine Learning


    Of course, machine learning has its drawbacks, just like anything else. First
    of all, machine learning can’t handle logic rules directly and how we can integrate
    machine learning with reasoning is an open question.


    Let’s take gravity as an example. Machine learning can come to the conclusion
    that there is a 0.99 probability of an object falling if you let it go. This,
    however, is based on past data and it cannot make the logical leap that “any”
    object will fall if you let it go because of gravity. It can give probabilities
    based on past events, but it cannot come to the conclusion: IF (GRAVITY) THEN
    (OBJECT FALL). This logical leap is something that even babies can do, demonstrating
    that while machine learning can be very powerful, it is far from intelligent the
    way the inventors of AI envisioned it.


    Another issue is that machine learning isn’t all that transparent. Most algorithms
    are a “black box,” with input going in on one side and the results being spat
    out on the other side. However, we don’t see what’s happening inside the box.
    Think of Google’s famous search algorithm. We know we enter a search string and
    we get the “most” relevant results, but we don’t see how that happens.


    Interpretable machine learning is now a very active field of investigation.^([^(22)](#fn22))'
