  trans: '

    #### 获取成本


    获取成本也是一个关键因素，并且与时间需求密切相关。你想要获取数据的速度越快，成本就越高。虽然在某些情况下，增加的成本是值得的，但在其他情况下，为了加快数据采集速度而支付高额费用则完全没有意义。在某些情况下，无论你花多少钱，都无法让数据采集变得更快。


    ## 案例研究：数据采集问题


    上述几点并非孤立存在，它们常常相互影响。问题在于，如果你没有全面考虑这些因素，最终可能会得到一个难以落地的商业模式。


    例如，假设你有一个绝妙的创业想法。你想通过开发一个预测分析模型，从体育博彩中赚钱。虽然市面上已经有公司在做这件事，但你希望将这一模式提升到全新高度 —— 在足球比赛进行时实时预测比赛结果。


    因此，你打算开发机器学习模型，实时分析数据，以确定谁能获胜、下半场会有多少个角球等等。然后，你可以根据这些预测下注，并希望能赚大钱。


    然而，要实现这一目标，你需要数据。于是你向数据供应商咨询，看看他们提供哪些预定义的数据包。针对每一个数据包，你都需要考虑上述几点。


    因此，你首先需要考虑数据的*适宜性*。你必须确保从供应商那里获得的数据包含做出准确预测所需的变量。


    第二点是数据的*性质*。在体育领域，数据错误非常常见，尤其是当你需要实时数据时。你输送到预测模型中的错误越多，预测结果出错的几率就越大。


    第三点是*时间需求*因素。例如，某事件发生后，你可能需要十分钟才能获取到数据。也就是说，你实际上无法获取实时数据，甚至无法在几分钟内获得数据。十分钟听起来可能不算长，但如果你试图在比赛进行时预测各种结果，十分钟的延迟会严重影响结果的时效性。毕竟，在比赛结束后才得到预测结果，对你毫无帮助。


    最后但同样重要的是*获取成本*问题。要更快地获取数据，你可以支付更多费用，但你必须考虑额外成本是否值得。考虑到赛后数据与实时数据的成本差异可能高达五倍，这一点就更为重要了。此外，实时数据出现错误的几率也更高，这可能会导致结果出现偏差，从而进一步放大数据的成本。


    当你将上述因素都考虑进去后，就必须思考下一步该怎么做。例如，购买赛后数据，而不是试图实时预测结果，可能是一个更好的选择。这不仅在购买数据的实际成本上更具性价比，还能降低结果出现偏差的可能性。赛后数据总是更准确，因为它经过了反复核对以确保准确性。


    然而，如果你选择这条路，那么你必须考虑是否还值得进入这个行业，因为已经有太多其他公司在做同样的事情了。


    你之所以得出这个结论，正是因为考虑了数据采集的各项要素，而它们表明：你那个实时体育博彩预测的想法，成功几率并不大。当然，好处在于，你是在实际亏损之前就发现了这些问题，而不必在一个在当前环境下无法运行的模式上赔钱。


    ## 定量研究与定性研究


    数据采集中的另一个重要区别是定量研究与定性研究。不过，这两个领域不仅仅关乎数据的收集方式，还涉及数据类型以及数据分析方法。


    ### 定量研究


    定量研究完全与数字相关。顾名思义，它涉及将一切量化。例如，如果你想了解有多少人喜欢一部电影，那么你应该采用定量研究。如果你想了解有多少人网购杂货以及他们的购买频率，你也应该使用定量研究。


    因此，定量研究用于量化态度、观点、行为以及其他已定义的变量。其优势在于，由于数据收集方法的结构化特性，可以调查更大的样本群体。


    这些方法包括：


    *   调查（在线、纸质、移动端、自助服务终端调查）

    *   使用现有数据库（人口普查数据）

    *   在线投票

    *   应用程序中的自动数据采集


    定量研究非常适合验证假设和获取数字。然而，它在发现新的见解方面并不擅长。


    即使在定量研究中使用开放式问题，你也无法像定性研究那样深入探究。


    假设你设计了一个新广告，想看看人们对此有何看法。你可能会问一个开放式问题，比如：


    > 如果你不喜欢这个广告，具体是哪里不喜欢？


    你会从人们那里得到许多不同的答案，但你能做的也就到此为止了。举个简单的例子，可能会有人说他们不喜欢广告的颜色。由于定量研究的性质，你只能继续问下一个问题，而无法深入探究他们为什么不喜欢这些颜色。有时，深度挖掘所能获得的见解可能非常有启发性，并且往往与你的预想不同。

    '
- fmt: '### Qualitative Research


    Qualitative research doesn’t involve numbers or numerical data and is much more
    free-form. It’s all about words and language, but also pictures and photographs.
    This is the type of research you turn to when you want to understand people’s
    underlying motivations, reasons, and opinions.


    Data collection methods tend to be unstructured or semi-structured, such as:


    - Individual interviews or group discussions

    - Participation/observation

    - Pictures, photographs, videos, and so on


    With qualitative research, the sample size tends to be smaller and respondents
    are selected to fulfill a given quota. Traditionally, it wasn’t convenient to
    go with a larger sample size though things are changing thanks to the Internet.


    Before, the most common approach to gathering qualitative data was through interviews
    and group discussions with a trained interviewer. So, to even be able to come
    close to the sample size of a quantitative project, you’d need a lot of qualified
    and experienced personnel, as well as a lot of time, making it unfeasible.


    Nowadays, though, there are many other options to gather qualitative data because
    of the Internet. Thus, this data can be gathered via social media and pretty much
    through everything your target market posts online, making it easier to use a
    larger sample size.


    **Debunking the Myth that Quantitative Data is Better than Qualitative Data**


    A common assumption is that quantitative research is better than qualitative research
    because it is quantifiable and can use larger sample sizes. Some also believe
    this because they think that the structured nature of the collection methods makes
    the data easier to analyze and less biased.


    Nothing could be further from the truth.


    First of all, as we’ve already discussed, sample sizes are no longer as limited
    as they used to be. Secondly, qualitative data can also be analyzed quite easily
    nowadays thanks to natural language processing for text data and computer vision
    for images and video.


    For example, you can use deep neural networks to extract emotions from thousands
    of images and videos or use topic modeling to find the most common process of
    conversation in a corpus of text (e.g., articles mined from the Web). This process
    is no longer as subjective as it used to be in the past (when a human had to do
    all the work), since it is done through machine learning algorithms.


    Also, it’s very important to note that quantitative data can still be biased or
    noisy. Questionnaires with Likert scales or ones that include leading questions,
    for example, can lead to a glut of quantitative data that is completely biased.
    Sometimes, respondents to questions deliberately lie. Measurements from devices
    can be noisy.


    Therefore, the lesson is: don’t always trust quantitative data, and don’t always
    consider qualitative data to be worthless!


    Footnotes [1](#490014_3_En_2_Chapter.xhtml#Fn1_source)


    ## 3. Data Collection Problems


    Like with any task, data collection comes with its share of problems that can
    lead to issues further down the line. While the following list of issues is by
    no means exhaustive, it does encompass the most common problems that arise in
    data collection.


    First of all, there’s the issue of data not being recorded properly. This could
    be owed to anything from human error when inputting data to noisy sensors, depending
    on the field. This, of course, causes problems because of the garbage in–garbage
    out principle.


    Another issue is that the data collection isn’t supervised by the appropriate
    principal investigator. When no one who knows the ultimate objective of the project
    is there to check how and what data is being collected, it can lead to noise and
    mistakes. If there is monitoring and verification, the potential for mistakes
    is reduced significantly.


    Data isn’t always documented, meaning that there are no clear explanations for
    what each field represents. This makes it difficult for new entrants into the
    project to understand what’s going on and to get up to speed quickly. The delays
    then slow the whole project down and can even lead to skewed results if the new
    entrants make the wrong assumptions.


    Then there are the legal requirements involved. In many cases, data isn’t held
    in a way that is compliant with the law, such as `GDPR` that is huge in the United
    Kingdom and in Europe. This could potentially cause huge problems later down the
    line.


    Another common problem is when the data is kept only by a specific person rather
    than being in a centralized system. For example, let’s say that the project leader
    is the only one with the data but his laptop is stolen. The result is all that
    data is lost, which wouldn’t have been an issue if it was stored in a centralized
    system.


    Finally, we get to data being stored in multiple places from different sources,
    which makes consolidation virtually impossible. This is why an integrated system
    is so important because it makes consolidation much easier and much cheaper.


    ## Data Collection Examples


    Now, let’s take a look at some data collection examples. We’re going to look at
    six different areas and how data is collected in each, and we’ll also look at
    the advantages and disadvantages of each approach.


    ### B2C Apps


    So, let’s start with B2C apps, namely, apps created by businesses for the general
    consumer. The data collected from these apps is usually from registered users
    and also from how these users interact with the app.


    With data collection via B2C apps, the main advantage is that the data is accurate
    because no humans are involved, which eliminates the potential for human error.


    Of course, there is an exception and that is when users have to register. When
    users enter their information, there is the potential not just for error but also
    for users lying. Some users simply don’t want to tell you too much about themselves
    and they have been known to make up things, which can skew your results.


    Now, the disadvantage is that the data is only semi-structured, like `JSON` and
    `XML`. The problem is that while the data might follow a pattern, it’s not very
    strictly structured, like having it in a table format. This creates an issue for
    data scientists because it’s not always easy to figure out how to manipulate the
    data or even what variables should be collected.


    For example, a data scientist would have to figure out if every button press and
    swipe is relevant and should be collected. This is important because the more
    data you collect, the longer it takes to wrangle it into something that can be
    analyzed and converted into valuable insights. It can take days or even weeks
    to get the data under control and translate it into something useful.


    ### Sales


    In sales, data is often collected using a `CRM`, that is, a customer relationship
    management tool. While some companies might have a different type of tool—or they
    at least call it something different—in essence, it’s still the same thing. In
    other words, it’s a system where customer data is recorded.


    There’s also company data obtained from various databases or other sources, such
    as UK Companies House or databases like `Orbis`.


    The advantage to sales data is that it is generally easy to interpret. You have
    things like number of units sold, number of calls, average transaction value,
    and so on. It’s pretty straightforward.


    However, the problem is that it isn’t always clear how the data can be used to
    provide answers to questions. For example, in your `CRM` you might have notes
    on each client, and it might not always be clear how to turn those notes into
    something useful. It’s not impossible by any stretch of the imagination, but it
    isn’t always as straightforward as it might seem.'
  raw: '#### Qualitative Research


    Qualitative research doesn’t involve numbers or numerical data and is much more
    free-form. It’s all about words and language, but also pictures and photographs.
    This is the type of research you turn to when you want to understand people’s
    underlying motivations, reasons, and opinions.


    Data collection methods tend to be unstructured or semi-structured, such as


    *   Individual interviews or group discussions


    *   Participation/observation


    *   Pictures, photographs, videos, and so on


    With qualitative research, the sample size tends to be smaller and respondents
    are selected to fulfill a given quota. Traditionally, it wasn’t convenient to
    go with a larger sample size though things are changing thanks to the Internet.


    Before, the most common approach to gathering qualitative data was through interviews
    and group discussions with a trained interviewer. So, to even be able to come
    close to the sample size of a quantitative project, you’d need a lot of qualified
    and experienced personnel, as well as a lot of time, making it unfeasible.


    Nowadays, though, there are many other options to gather qualitative data because
    of the Internet. Thus, this data can be gathered via social media and pretty much
    through everything your target market posts online, making it easier to use a
    larger sample size.


    DEBUNKING THE MYTH THAT QUANTITATIVE DATA IS BETTER THAN QUALITATIVE DATA


    A common assumption is that quantitative research is better than qualitative research
    because it is quantifiable and can use larger sample sizes. Some also believe
    this because they think that the structured nature of the collection methods makes
    the data easier to analyze and less biased.


    Nothing could be further from the truth.


    First of all, as we’ve already discussed, sample sizes are no longer as limited
    as they used to be. Secondly, qualitative data can also be analyzed quite easily
    nowadays thanks to natural language processing for text data and computer vision
    for images and video.


    For example, you can use deep neural networks to extract emotions from thousands
    of images and videos or use topic modeling to find the most common process of
    conversation in a corpus of text (e.g., articles mined from the Web). This process
    is no longer as subjective as it used to be in the past (when a human had to do
    all the work), since it is done through machine learning algorithms.


    Also, it’s very important to note that quantitative data can still be biased or
    noisy. Questionnaires with Likert scales or ones that include leading questions,
    for example, can lead to a glut of quantitative data that is completely biased.
    Sometimes, respondents to questions deliberately lie. Measurements from devices
    can be noisy.


    Therefore, the lesson is: don’t always trust quantitative data, and don’t always
    consider qualitative data to be worthless!


