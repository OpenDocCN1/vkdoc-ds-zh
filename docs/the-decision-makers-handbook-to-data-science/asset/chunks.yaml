    through reinforcement learning. This is one of the most esoteric types of machine
    learning.


    **Statistics** is an essential tool in the arsenal of any data scientist because
    it helps to develop and study methods to collect, analyze, interpret, and present
    data. The numerous methodologies it uses enable data scientists to


    *   Design experiments and interpret results to improve product decision-making


    *   Build signal-predicting models


    *   Transform data into insights


    *   Understand engagement, conversions, retention, leads, and more


    *   Make intelligent estimations


    *   Use data to tell the story


    Let’s take a closer look at all three.


    #### Artificial Intelligence: A Little History


    In 1954, the field of AI research came into being at a workshop at Dartmouth College.
    There, the attendees discussed topics that would influence the field for years
    to come.


    As we’ve already explained, the goal of artificial intelligence is to create a
    “thinking machine,” that is, one that emulates human brain function. To do this,
    of course, one needs to understand the human mind, which is why AI is closely
    related to the field of cognitive science.


    Cognitive science involves studying the human mind and its processes, including
    intelligence and behavior. Memory, language, perception, attention, emotion, and
    reasoning are all studied, and to gain greater understanding of these faculties,
    scientists borrow from other fields, including


    *   Linguistics


    *   Psychology


    *   Philosophy


    *   Neuroscience


    *   Anthropology


    *   Artificial Intelligence


    Artificial intelligence played a key part in the development of cognitive science,
    and there was a large interplay between cognitive psychology and AI. The understanding
    of human cognition helped us improve our understanding of how to transfer this
    inside machines. Vice versa, the computational theory of the mind^([⁷](#fn7))
    was one of the dominant paradigms in cognitive science. According to this theory,
    the mind works like a computer, with processes and limited memory. While this
    is now considered outdated, it drove research for decades.


    ##### The AI Dream


    It all started with a grand vision. Marvin Minsky, the head of the artificial
    laboratory at MIT who was considered the father of AI, stated that “artificial
    intelligence is the science of making machines do things that would require intelligence
    if done by men.”^([⁸](#fn8)) In other words, the dream was to create an intelligent
    machine.


    So, how would one go about doing it? First, we start with intuition, that is,
    the human’s distinct ability for logical reasoning.


    Logical reasoning is, essentially, the capacity to reason based on various premises
    to reach a conclusion that has logical certainty. For example:


    > *“If all men are mortal, and Socrates is a man, then Socrates is mortal.”*


    Or:


    > *“If it’s raining outside and I don’t have an umbrella, I will get wet if I
    go out.”*


    To translate this logical deduction ability to a machine, a rule-based or symbolic
    approach is used. This involves humans constructing a system of rules with which
    the computer is programmed. Using these rules, reasoning algorithms are capable
    of deriving logical conclusions.


    A good example is MYCIN,^([⁹](#fn9)) which was an early successful working system
    based on reasoning algorithms. It was used to diagnose infections and determine
    the type of bacteria that was causing the problem. It was never used in a clinical
    setting but is an excellent example of an expert system and a predecessor to machine
    learning.


    The system was developed in the 1970s at Stanford University and had approximately
    600 rules.^([^(10)](#fn10)) Users were required to provide answers to various
    questions and the program would then provide a list of potential bacteria that
    could be causing the problem, sorted from high to low probability. It would also
    provide its confidence in the probability of each diagnosis as well as how it
    came to the conclusion. Finally, it would provide the recommended course of treatment.


    It had a 69% accuracy rate and it was claimed that the program was more effective
    than junior doctors and on the same level as some experts.^([^(11)](#fn11))


    The program was created by interviewing a large number of experts who provided
    their expertise and experience. It used rules of the IF (condition) THEN (conclusion)
    form. For example, IF (sneezing and coughing or headache) THEN (flu).


    One limitation the program had was computing power. It took approximately 30 minutes
    to go through the system, which was too much wasted time in a real-world clinical
    setting.


    Another issue was also raised, namely, that of ethics and legal issues. Thus,
    the question arose of who would be held responsible if the program made the wrong
    diagnosis or recommended the wrong treatment.


    Though it was never used, MYCIN still had a very important role in bringing us
    to where we are today as it was one of the early successes of AI, proving what
    is possible.'
  trans: '

    ### 数据科学的核心领域


    数据科学有三个核心领域，分别是人工智能、机器学习和统计学。


    - **人工智能**旨在机器中复制人脑的功能。人工智能应执行的主要功能包括逻辑推理、自我修正和学习。虽然其应用范围广泛，但由于要让机器变得智能需要大量数据和计算能力，因此它也是一项高度复杂的技术。

    - **机器学习**指计算机在编程范围之外进行学习和改进的能力。因此，它依赖于创建能够从所给数据中学习的算法。这些算法还被设计用于收集洞察，并对之前未分析过的数据进行预测。


    机器学习有三种方法，即监督学习、无监督学习和强化学习，此外还有一些子领域（例如半监督学习）。在此，我们只讨论监督学习和无监督学习，因为这是商业中主要使用的方法。


    假设你想根据内容对所有的照片进行分类。在监督学习中，你会向计算机提供带有标签的示例。因此，你会给它一张狗的照片并将其标记为“动物”，然后给它一张人的照片并标记为“人类”。之后，机器会对所有剩余的照片进行分类。


    在无监督学习中，你只需将所有照片交给机器，让它自行找出不同的特征并整理你的照片。


    在强化学习中，机器基于错误和奖励来学习。因此，机器会分析其行为及其结果。强化学习的一个很好的例子是迷宫中的老鼠需要找到路径到达一块奶酪。帮助老鼠实现这一目标的学习过程可以通过强化学习在机器中实现。这是最深奥的机器学习类型之一。


    **统计学**是任何数据科学家武器库中的必备工具，因为它有助于开发和研究收集、分析、解释和呈现数据的方法。它使用的众多方法论使数据科学家能够：


    - 设计实验并解释结果，以改进产品决策

    - 构建信号预测模型

    - 将数据转化为洞察

    - 理解用户参与度、转化率、留存率、潜在客户等指标

    - 进行智能估算

    - 利用数据讲述故事


    让我们更详细地了解这三个领域。


    ### 人工智能：一段简史


    1954 年，在达特茅斯学院的一次研讨会上，人工智能研究领域应运而生。会上，与会者讨论了将在未来多年影响该领域的主题。


    正如我们已经解释过的，人工智能的目标是创造一台“能思考的机器”，即模仿人脑功能的机器。当然，要做到这一点，需要理解人类思维，这就是人工智能与认知科学领域紧密相关的原因。


    认知科学涉及研究人类思维及其过程，包括智力和行为。记忆、语言、感知、注意力、情感和推理都是研究的对象，为了更深入地理解这些能力，科学家借鉴了其他领域，包括：


    - 语言学

    - 心理学

    - 哲学

    - 神经科学

    - 人类学

    - 人工智能


    人工智能在认知科学的发展中发挥了关键作用，认知心理学与人工智能之间存在着大量的相互影响。对人类认知的理解帮助我们改进了如何将其迁移到机器中的认知。反之亦然，心智计算理论^(⁷)曾是认知科学中的主导范式之一。根据该理论，心智像计算机一样工作，具有处理过程和有限的记忆。虽然这现在被认为已经过时，但它推动了数十年的研究。


    #### 人工智能之梦


    一切都始于一个宏伟的愿景。麻省理工学院人工智能实验室的负责人、被誉为人工智能之父的马文·明斯基曾指出：“人工智能是让机器完成那些需要人类智能才能完成的事情的科学。”^(⁸)
    换句话说，梦想是创造一台智能机器。


    那么，如何着手实现呢？首先，我们从直觉开始，即人类独特的逻辑推理能力。


    逻辑推理，本质上，是基于各种前提进行推理，以得出具有逻辑确定性的结论的能力。例如：


    > “如果所有人都会死，而苏格拉底是人，那么苏格拉底也会死。”


    或者：


    > “如果外面正在下雨，而我没有伞，我出去就会淋湿。”


    为了将这种逻辑演绎能力转移到机器上，采用了基于规则或符号的方法。这涉及人类构建一套规则系统，并用这些规则对计算机进行编程。利用这些规则，推理算法能够推导出逻辑结论。


    一个很好的例子是 `MYCIN`，^(⁹) 这是一个早期基于推理算法的成功运行系统。它被用于诊断感染并确定导致问题的细菌类型。它从未在临床环境中使用，但却是专家系统的一个绝佳例子，也是机器学习的前身。


    该系统于 20 世纪 70 年代在斯坦福大学开发，拥有大约 600 条规则。^(¹⁰) 用户需要回答各种问题，程序随后会提供一份可能导致问题的潜在细菌列表，按概率从高到低排序。它还会提供其对每种诊断概率的置信度，以及它是如何得出该结论的。最后，它会提供推荐的疗程。


    它的准确率达到 69%，据称该程序比初级医生更有效，与某些专家的水平相当。^(¹¹)


    该程序是通过采访大量专家，并利用他们提供的专业知识和经验创建的。它使用了 `IF (条件) THEN (结论)` 形式的规则。例如，`IF (打喷嚏和咳嗽或头痛)
    THEN (流感)`。


    该程序的一个局限性是计算能力。完成整个系统诊断大约需要 30 分钟，这在真实的临床环境中浪费了太多时间。


    另一个问题也被提了出来，即伦理和法律问题。因此，问题出现了：如果程序做出了错误的诊断或推荐了错误的治疗，谁应该负责？


    尽管从未投入使用，`MYCIN` 在将我们带到今天的技术水平方面仍然发挥了非常重要的作用，因为它是人工智能早期的成功案例之一，证明了其可行性。

