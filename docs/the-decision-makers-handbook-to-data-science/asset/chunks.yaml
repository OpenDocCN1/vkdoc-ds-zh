    \ these definitions are slightly different, but in one way or another, they involve\
    \ algorithms that can learn from experience and data by identifying patterns or\
    \ using other methods. They then use what they have learned to take action.\n\n\
    Let’s take a look at a simple example to gain a better understanding of how machine\
    \ learning works. In Figure [7-1](#490014_3_En_7_Chapter.xhtml#Fig1), I’m showing\
    \ you a fictional dataset that consists of images of cats and dogs.\n\n![](images/490014_3_En_7_Chapter/490014_3_En_7_Fig1_HTML.jpg)\n\
    \nFifteen monochrome photos of dogs and cats.\n\nFigure 7-1\n\n Classification\
    \ example\n\nIf I ask you which images depict dogs and which ones cats, it is\
    \ ridiculously easy to do. But how does it happen?\n\nFirst of all, your brain\
    \ has been exposed to a huge number of images of cats and dogs, but also examples\
    \ of those animals in real life. You have trained yourself to be able to discriminate\
    \ between these two and other animals through countless rounds of feedback from\
    \ sources like your family, school, and TV.\n\nHowever, this whole process isn’t\
    \ quite as simple as it seems. Your brain has been optimized through thousands\
    \ and thousands of years of evolution to make these associations easily. Even\
    \ if you knew nothing about cats and dogs, your brain would quickly figure out\
    \ that these two entities look like different animals. Your brain can aggregate\
    \ these images very quickly and it immediately understands that while they are\
    \ different, they all refer to the same species.\n\nFor a machine, though, this\
    \ is much more difficult, which is why machine learning is so important because\
    \ it’s about imitating this process and replicating it within a machine.\n\n##\
    \ The Main Advantage of Machine Learning\n\nLearning from data is very easy for\
    \ the human brain to do but difficult for a machine to do because it requires\
    \ the right algorithms and lots of data to achieve.\n\nHowever, what is easy for\
    \ a machine is implementation and automation. Once you’ve got the algorithm, it’s\
    \ easy for a machine to go through thousands or even millions of images without\
    \ experiencing any fatigue, which is impossible for a human brain to do.\n\nIt\
    \ means you can create something very powerful with superhuman capabilities, even\
    \ if we’re talking about a narrow field of application, such as image classification.\
    \ And this is exactly what makes machine learning and big data such a powerful\
    \ combination.\n\n## Types of Machine Learning\n\nNow, we’re going to take a quick\
    \ look at the different fields in machine learning (Table [7-1](#490014_3_En_7_Chapter.xhtml#Tab1)).\
    \ The main fields in machine learning are **supervised** and **unsupervised learning**.\
    \ Reinforcement learning has been gaining ground and related fields such as recommender\
    \ systems can also be linked to machine learning, but they are more niche and\
    \ not within the scope of this book.\n\nTable 7-1\n\n Types of machine learning\n\
    \n| Name | Use |\n| --- | --- |\n| Supervised learning | Use a model *M* to predict\
    \ target variable *Y* from input *X*. |\n| Unsupervised learning | Find patterns\
    \ in variable *X* (clustering is the most common example). |\n| Reinforcement\
    \ learning | Teach an agent how to optimize a reward function over the environment.\
    \ For example, a video game AI can take ten different actions, which need to be\
    \ done as a response to the environment in order to maximize to reach a goal (e.g.,\
    \ maximize a score or beat a human player). |\n| Active learning | Supervised\
    \ learning with active feedback from a human. |\n| Semi-supervised learning |\
    \ Supervised learning, where some examples are unlabeled. For example, a dataset\
    \ of 10,000 images, where 1000 do not have a label, can be analyzed through semi-supervised\
    \ learning techniques. |\n| Recommender systems | Find a set of items to offer\
    \ to a user that the user is likely to like (e.g., movies to watch, products to\
    \ buy, songs to listen). Heavily related to supervised learning. |\n\n### Supervised\
    \ Learning\n\nSupervised learning can be classified into classification and regression,\
    \ which are both quite similar. In supervised learning, there is some form of\
    \ supervision of the algorithm. We provide the algorithm with a raw dataset, but\
    \ then we also provide it with a target. The latter can be a single variable or\
    \ multiple variables.\n\nThen, the algorithm attempts to understand how to match\
    \ the input to the output. For example, you provide the algorithm with customer\
    \ data and then it tries to determine if someone will make a purchase or not.\n\
    \nThe supervisor oversees what the algorithm is doing. Every time the algorithm\
    \ makes a mistake, the supervisor tries to correct it. It’s basically like the\
    \ algorithm is learning under the guidance of a teacher.\n\n### Unsupervised Learning\n\
    \nUnsupervised learning, in the context of machine learning, usually refers to\
    \ clustering. In this case, we provide the algorithm with raw data, but instead\
    \ of providing a target, the algorithm is allowed to do its own thing essentially\
    \ and identify patterns in the data provided. It tries to find any regularities\
    \ that seem significant, but there is no supervision involved.\n\nThis type of\
    \ learning is a very difficult problem because it’s ill-defined and almost always\
    \ requires a human to interpret usually toward the final stage of the pipeline.\
    \ For example, the algorithm might identify patterns that are irrelevant to what\
    \ you are trying to do, which is why you need to drill down into the results and\
    \ try to define them a little better.\n\nSupervised learning, on the other hand,\
    \ is a bit easier because you can run an algorithm and you can immediately determine\
    \ how it works. You can analyze customer data, for example, and predict retention\
    \ rates with an 80% accuracy. This is what makes supervised learning one of the\
    \ most popular fields in the machine learning family.\n\nIt’s important to note\
    \ that some of the terms we are using such as classification, regression, and\
    \ clustering are used in statistics as well as machine learning. However, even\
    \ if the terminology refers to almost the same thing, there are still some differences.\n\
    \nIn statistics, interpretability is important, whereas it is of little consequence\
    \ in machine learning. Likewise, in machine learning, we are interested in the\
    \ predictive performance of the algorithm, while in statistics this is important.\n\
    \nThe terminology might seem a little confusing when comparing the terms from\
    \ statistics to machine learning because there are some models like logistics\
    \ regression models that are classification models and are treated as classification\
    \ models within the context of machine learning. The differences are mainly the\
    \ result of different histories to the fields, so don’t be confused if you hear\
    \ people with different backgrounds using these terms in slightly different ways."
  trans: "\n# 7. 机器学习简介\n\n不同研究者对机器学习给出了多种定义。以下是该领域几位著名学者的定义：\n\n> *机器学习是通过示例数据或过往经验，对计算机进行编程以优化性能标准的方法。*\n\
    > \n> ——埃瑟姆·阿尔帕伊登^(⁵¹)\n\n> *机器学习的目的是开发能够自动检测数据中模式的方法，并利用这些发现的模式来预测未来数据或其他感兴趣的结果。*\n\
    > \n> ——凯文·P·墨菲^(⁵²)\n\n> *模式识别领域关注的是通过计算机算法自动发现数据中的规律，并利用这些规律采取行动。*\n> \n> ——克里斯托弗·M·毕晓普^(⁵³)\n\
    \n虽然这些定义略有不同，但都涉及通过识别模式或其他方法从经验和数据中学习的算法。然后，它们会利用所学知识采取行动。\n\n让我们看一个简单示例，以便更好地理解机器学习的工作原理。在图\
    \ 7-1 中，我向你展示了一个由猫和狗图像组成的虚构数据集。\n\n![](img/490014_3_En_7_Fig1_HTML.jpg)\n\n十五张狗和猫的单色照片。\n\
    \n图 7-1\n\n 分类示例\n\n如果我让你分辨哪些图片是狗，哪些是猫，这简直易如反掌。但这是如何发生的呢？\n\n首先，你的大脑接触过大量猫和狗的图片，也在现实生活中见过这些动物的实例。通过来自家庭、学校和电视等渠道的无数次反馈，你训练自己具备了区分这两种动物以及其他动物的能力。\n\
    \n然而，整个过程并不像看上去那么简单。你的大脑经过数千年的进化，已经优化到能轻松做出这些关联判断。即使你对猫和狗一无所知，你的大脑也能迅速发现这两个实体看起来像是不同的动物。大脑能非常快速地整合这些图像，并立即理解到尽管它们各不相同，但都属于同一个物种。\n\
    \n但对于机器而言，这要困难得多。正因如此，机器学习才如此重要——它旨在模仿这一过程，并在机器中加以复现。\n\n## 机器学习的主要优势\n\n从数据中学习对人类大脑来说非常容易，但对机器来说却很难，因为这需要正确的算法和大量数据才能实现。\n\
    \n然而，机器擅长的是实现和自动化。一旦掌握了算法，机器就能轻松处理成千上万甚至数百万张图像，且不会感到疲劳，这是人类大脑无法做到的。\n\n这意味着你可以创造出具有超强能力的东西，即使我们谈论的只是像图像分类这样的狭窄应用领域。这也正是机器学习和大数据能成为如此强大组合的原因。\n\
    \n## 机器学习的类型\n\n现在，我们快速了解一下机器学习的不同领域（表 7-1）。机器学习的主要领域是监督学习和无监督学习。强化学习正在兴起，而推荐系统等相关领域也与机器学习有关联，但它们更为专业，不在本书的讨论范围之内。\n\
    \n表 7-1\n\n 机器学习的类型\n\n| 名称 | 用途 |\n| --- | --- |\n| 监督学习 | 使用模型 `M` 从输入 `X` 预测目标变量\
    \ `Y`。 |\n| 无监督学习 | 在变量 `X` 中寻找模式（聚类是最常见的例子）。 |\n| 强化学习 | 教会智能体如何优化环境中奖励函数。例如，一个视频游戏\
    \ AI 可以采取十种不同的行动，这些行动需要作为对环境的响应，以最大化达成目标（如最大化分数或击败人类玩家）。 |\n| 主动学习 | 带有人类主动反馈的监督学习。\
    \ |\n| 半监督学习 | 监督学习，其中部分示例没有标签。例如，一个包含 10,000 张图片的数据集，其中 1000 张没有标签，可以通过半监督学习技术进行分析。\
    \ |\n| 推荐系统 | 寻找一组用户可能喜欢的项目推荐给用户（例如，要看的电影、要买的产品、要听的歌曲）。与监督学习密切相关。 |\n\n### 监督学习\n\
    \n监督学习可分为分类和回归，两者非常相似。在监督学习中，算法会受到某种形式的监督。我们向算法提供原始数据集，同时也提供目标变量。后者可以是单个变量或多个变量。\n\
    \n然后，算法尝试理解如何将输入与输出匹配。例如，你向算法提供客户数据，然后它尝试判断某人是否会进行购买。\n\n监督者（Supervisor）监控算法的运行。每当算法犯错时，监督者会尝试纠正它。这基本上就像算法在老师的指导下学习。\n\
    \n### 无监督学习\n\n在机器学习的语境中，无监督学习通常指聚类。在这种情况下，我们向算法提供原始数据，但不提供目标变量，而是让算法自行其事，在提供的数据中识别模式。它试图寻找任何看起来有意义的规律，但不涉及监督。\n\
    \n这类学习是一个非常困难的问题，因为它定义不明确，并且几乎总是需要人工在流程的最终阶段进行解释。例如，算法可能会识别出与你试图解决的问题无关的模式，这就是为什么你需要深入分析结果并尝试更好地定义它们。\n\
    \n相比之下，监督学习则稍微容易一些，因为你可以运行算法并立即判断其工作效果。例如，你可以分析客户数据，并以 80% 的准确率预测留存率。这使得监督学习成为机器学习家族中最流行的领域之一。\n\
    \n值得注意的是，我们使用的某些术语，如分类、回归和聚类，在统计学和机器学习中都会用到。然而，即使这些术语指代的内容几乎相同，仍然存在一些差异。\n\n在统计学中，可解释性很重要，而在机器学习中则不太重要。同样，在机器学习中，我们关注算法的预测性能，而在统计学中这一点也很重要。\n\
    \n当比较统计学和机器学习的术语时，可能会觉得有点混乱，因为有些模型，如逻辑回归模型，属于分类模型，在机器学习的语境下也被视为分类模型。这些差异主要是两个领域发展历史不同造成的，所以如果你听到不同背景的人以略有不同的方式使用这些术语，不必感到困惑。\n"
- fmt: '### A Closer Look at Supervised Learning


    Supervised learning is broken down into **classification** and **regression**.
    The difference between the two is quite simple. In classification, we try to identify
    if something belongs in a specific category, while in regression, we try to predict
    a real number.


    An easy example of a classification model is one where we attempt to determine
    whether an email is spam or not. It’s a task that’s found in every introductory
    machine learning textbook. Another popular task is image recognition or object
    identification, such as “is this an image of an animal?” or “does this image contain
    a human?” or “where in this picture can you find human faces?”


    Classification can also be about other things. Determining whether a stock will
    rise or fall is one such application, and it’s usually referred to as binary classification
    because there are two categories—rising or falling. Another application is to
    determine whether someone will click on an ad or will the temperature rise above
    0 degree.


    You can have multiple categories too in some problems. For example, if you want
    to predict elections, in most cases, you have more than two election parties.
    In that case, you might have four or five classes, with each class representing
    one of the political parties running in the election.


    Regression, on the other hand, attempts to predict a real number. So, instead
    of asking whether the price of a stock will rise or fall, we attempt to determine
    what the price of the stock will be in two weeks. Or, if we are attempting to
    determine customer demand for a particular product, we could attempt to figure
    out what demand will be like in five days, for example. Maybe instead of attempting
    to understand if someone will click on an ad, we want to find out how many people
    will click on an ad—it might be a related problem, but it’s still a different
    problem.


    Likewise with temperature. A vague idea of whether it will rise or not might not
    be sufficient for your needs, so you might attempt to determine what the exact
    temperature will be in three weeks.


    These two types of problems—classification and regression—can be found in many
    fields and in many different contexts.


    It’s important to note that the same problem can be tackled using different approaches.
    Let’s say that we work for a hedge fund and we want to predict the price of stocks
    so we can make a nice profit.


    This problem can be tackled using statistical forecasting, machine learning regression,
    or even classification with the latter attempting to determine the direction price
    will head in, that is, either up or down.


    The performance ceiling—or the best performance you can get—for each approach,
    though, will be different. This can have different effects on your strategy, depending
    on what you want to achieve.


    For example, you might first attempt to use a classification model to predict
    the price of stock. But you realize then that you’ll only know whether the price
    will rise or fall. This doesn’t lend itself well to straight trading, so you might
    consider spread betting as an alternative. However, you might decide to take the
    slightly more difficult approach of a regression model because the increased profits
    will make it worth your while.


    The key is to understand that a problem is often not just a single problem but
    a series of other problems within your main problem. Think of it a bit like a
    LEGO model. Each model is a whole—a castle, a helicopter, a spaceship—but it’s
    built from separate blocks. In this case, the problem is the castle made up of
    sub-problems or blocks.


    It also pays off to try multiple approaches to determine which one is the most
    effective for your needs. Again, it’s like one of those multi-model LEGO sets.
    You can use the same bricks in different ways to achieve the outcome you need.


    Except that, unlike with a LEGO set, you don’t have instructions or even inspirational
    pictures to help you on your journey—you have to keep testing different assembly
    approaches until you end up with what you need.


    However, if you have a creative data scientist around to help you, it’ll be like
    having those LEGO instructions and pictures on hand, making life much easier.


    It’s also important to choose your battles wisely. If you find that a regression
    model will generate better performance, even if it’s more difficult to do and
    wasn’t your initial choice, it’s still a good idea to switch to ensure better
    results.


    ### A Better Understanding of Unsupervised Learning


    Unsupervised learning is about learning patterns from data without any kind of
    guidance. The main application is clustering, which is an automated way of creating
    groups, like with the images in Figure [7-1](#490014_3_En_7_Chapter.xhtml#Fig1).


    So, you can feed a bunch of animal pictures into an unsupervised learning algorithm,
    and it could group them automatically into two categories (cats and dogs) without
    any additional feedback.


    One of the most prominent uses for unsupervised learning algorithms in business
    is for customer segmentation. So, you feed the algorithm customer data, and it
    identifies patterns and segments your customer base accordingly.


    Another application is anomaly detection, which some consider to be its own separate
    category because it doesn’t use just unsupervised learning but also borrows some
    techniques from supervised learning. However, I’ve included it here because it’s
    good to know that it exists.


    Dimensionality reduction is another application which involves reducing a large
    number of variables into what are called “factors” or super variables. So, you
    can take 20 variables, for example, and group them under one factor. It’s a little
    like clustering, but for variables. The main reason to do this is because it makes
    it easier to understand the data.


    #### Examples of Clustering


    As already stated, unsupervised learning and clustering are fundamentally very
    difficult problems, mainly because they are ill-defined. So, let’s say we are
    given the objects in Figure [7-2](#490014_3_En_7_Chapter.xhtml#Fig2) to cluster.


    ![A monochrome photo of different fruits and vegetables.](images/490014_3_En_7_Chapter/490014_3_En_7_Fig2_HTML.jpg)


    **Figure 7-2** Clustering example


    The problem is that there are numerous approaches. You could cluster according
    to color. Or, you could cluster by type, namely, based on whether the object is
    a fruit or vegetable. Or maybe you want to cluster based on shape.


    However, if you want to cluster, for example, based on color, this doesn’t mean
    that the other approaches are wrong. All the patterns are valid. The question
    is whether they are useful, and the answer depends on what your goal is.


    Thus, clustering algorithms attempt to identify these patterns, but sometimes
    the results aren’t that useful or aren’t relevant to what you need. It’s why you
    always need a bit of experimentation before you can get it right. At the end of
    the day, though, if you know what you’re doing and you try a few different algorithms,
    you will eventually find one that works.


    Unsupervised learning has been around for decades so there are a wide range of
    very powerful algorithms that can identify patterns in data if they exist. However,
    it’s important to keep in mind that just because you think objects should be clustered
    in a certain way doesn’t mean the first algorithm you try will come up with the
    same result.'
