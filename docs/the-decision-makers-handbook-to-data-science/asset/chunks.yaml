    # 9. Problem Solving


    In this chapter, we’re going to look at solving a problem from the decision maker’s
    point of view, as this is what this book is about. So, we aren’t going to look
    at how data scientists solve problems but how you will solve the problem working
    alongside a data scientist.


    No one expects the domain expert—a.k.a. you—to be qualified in using data science.
    However, you need to be able to think like a data scientist when solving a problem,
    because it will help you improve how you define the problem, as well as making
    it easier for you to find the right people and to manage them.


    You need to be able to pose a problem and, as previously mentioned, one highly
    effective approach is to turn the problem into a question. You also need to understand
    whether there’s any value in solving the problem. Everything takes time and money,
    so you need to understand whether the results of the problem will be applicable
    to your business. Lastly, you need to understand who you should hire to help you
    and if you need more than one person.


    ## Understanding Whether a Problem Can Be Solved


    To figure out if something can be solved, you first need to be aware of everything
    that can go wrong. From experience, I’ve discovered that businesses face two main
    issues when they want to use data science.


    First, they often have the wrong expectations, so the actual solution can turn
    out to be either much easier or much more difficult than they think. Secondly,
    they don’t have the right data.


    A data scientist can help you understand whether the problem can be solved at
    all, whether the problem is difficult or easy to solve, and how much time and
    resources will be required.


    So, what you need to do is to find the right person—preferably someone you trust—and
    work alongside them.


    What you should never ever do is make assumptions without consulting a data scientist!
    Many issues arise because people make erroneous assumptions, especially around
    technical matters, such as the complexity of the project or the time frames involved.
    It’s better to ask if you are uncertain about something—and even when you’re not—than
    to make assumptions.


    ## Quick Heuristics


    We’re now going to look at a few heuristics to help you determine if data science
    can be applied to a specific problem.


    First of all, you need to determine if the problem can be phrased as:


    - A statistical modeling problem

    - A hypothesis test

    - A supervised learning problem

    - An unsupervised learning problem


    Let’s take a look at some examples.


    ### Statistical Modeling Problem


    Statistical modeling should be used when you have a situation in which you are
    trying to determine whether variable `X` is important for variable `Y` and what
    the relationship between the two is. Statistical models can tell you which factors
    are significant and what the direction of effect is.


    So, for example, you might have noticed that older people seem to like your product
    more. Thus, you might want to determine if age plays a role in the purchasing
    decision. In this case, you’ll want to hire a statistician since you will be using
    statistical modeling.


    As it was mentioned before, the focus of statistics is on transparency. When you
    care about understanding the relationships between variables, you are probably
    going for statistics.


    ### Hypothesis Testing


    Hypothesis testing is the approach you want to turn to when you want to compare
    two groups. This is if you want to figure out if `X` and `Y` differ. An example
    of this is `A/B testing`.


    Let’s say you want to roll out a new feature for your product and you don’t know
    if it’s a good idea. All you need to do is create two different groups and compare
    them with each other.


    Likewise, you might want to compare two existing groups. For example, you might
    want to study gender, regardless of context. You might want to see if gender has
    an impact on sales, so you would create two groups, one of each gender, and make
    the comparison.


    Hypothesis testing is closely related to statistical modeling, and sometimes the
    same problems can be answered through different hypothesis tests or models. In
    both this case and the previous one, you know you need a data scientist with skills
    in statistics.'
