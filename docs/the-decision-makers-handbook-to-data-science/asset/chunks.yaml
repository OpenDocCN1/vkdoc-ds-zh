    to adopt the best practices will gain a significant advantage. The rest might
    just perish. The situation is to a large extent equivalent to a paradigm shift
    in the means of production, like the one that was experienced through the industrial
    revolution, making many people talk about a fourth industrial revolution.


    The history of data science is not linear. Its roots are in mathematics and philosophy,
    in the vision of the AI fathers to create a thinking machine, in computational
    intelligence and data mining, and in many other fields and ideas as to how we
    can extrapolate from a simple piece of information to describe a universe of concepts.
    After centuries, the science, engineering, and availability in data and computing
    power have created a perfect storm, and this storm is only going to get stronger.


    I hope this book provided you with enough insights as to how data science can
    be applied in business. Data management, data strategy, choosing the right algorithms,
    hiring data scientists, and having the right culture all these factors are interleaved
    when a company attempts to extract insights from data. Doing data science is more
    complicated than simply hiring a data scientist, but, at the same time, it can
    be much easier than creating a novel algorithm from scratch.


    Being aware of these facts is the first step toward building a data-centric organization.
    This book has provided you with enough material, examples, and case studies to
    be aware of the opportunities, but also the pitfalls that may arise. Maybe you’ve
    not absorbed all the lessons now, but that’s fine. Not everything might resonate
    at first instance. After you start working with data, you will revisit some of
    the chapters, and then they will make more sense, as you will be able to attach
    your experiences to the teachings inside this book.


    What’s important is that you’ve decided to stay and be part of this revolution
    by learning how to use data science and AI in your company.


    I wish you success on this journey.'
  trans: '

    ## 哲学问题与社会影响


    通用人工智能的出现，尤其是与量子计算相结合时，引发了深刻的哲学和社会问题。在一个 AGI 可能自动化大多数工作的时代，工作的意义是什么？这一技术飞跃可能重新定义劳动的概念，将重点从常规和体力任务转向更具创造性和战略性的角色。然而，这也引出了哪些工作会受到影响以及如何受影响的问题。其影响可能是不均衡的，一些行业经历快速转型，而另一些行业则保持相对不变。


    这种转变对社会的影响是深远的。这些变化将如何影响人口格局，尤其是在城市和农村地区？随着农村地区的传统工作被自动化，是否会出现向城市的大规模迁移，还是技术会促成更去中心化、分布式的劳动力？


    这些变化渗透社会的速度是另一个关键的考量因素。向 AGI 在我们日常生活中扮演核心角色的世界过渡，可能会在几十年内逐渐发生，也可能在几年内迅速转变，这取决于技术进步和社会适应的速度。


    此外，AGI 的发展挑战了我们对智能和意识的理解。如果 AGI 达到了与人类智能相当或超越的水平，这对我们作为智能生物的独特地位意味着什么？当我们创造的机器不再是单纯的工具，而是能够独立思考和学习的实体时，我们与技术的关系将如何演变？


    ## 应对风险，确保合乎道德的 AI 发展


    走向通用人工智能（AGI）的旅程不仅仅是一次技术追求，也是一次道德探索。随着 AGI 变得越来越复杂，其可能对社会造成深刻破坏和导致工作岗位流失的潜力也在增长，这迫使我们必须重新评估开发及部署此类技术所依据的道德框架。考虑这种技术变革对人类的影响至关重要，特别是工作的性质、人类贡献的价值，以及在机器执行曾经只有人类才能完成的任务的时代，社会规范的重构。


    AGI 发展的道德版图包含一系列关键问题。安全风险，特别是量子计算可能破解当前加密方法背景下凸显的风险，构成了重大挑战。乔治城大学安全与技术中心发布的报告《人工智能的恶意使用：预测、预防与缓解》强调了解决
    AI 在诸如网络攻击、自主武器和社会操纵等领域可能被滥用的紧迫性 [Center for Security and Technology, 2018]。


    该报告以及 John Danaher 在《人工智能伦理学》中的见解，强调了采取主动措施来减轻这些风险并确保负责任的 AI 开发的必要性 [Danaher,
    2018]。道德原则必须指导 AGI 的开发和部署，以确保其对社会产生有益影响。这包括创建公平、透明和负责任的 AGI 系统，以维护公众信任，并避免可能导致歧视或社会不公的偏见。


    在我们向 AGI 迈进的过程中，采用一种将技术创新与道德远见和社会准备相结合的方法至关重要。科学家、伦理学家、政策制定者和公众之间的协作对于引导 AGI 的发展方向至关重要。开放的讨论、国际合作以及对道德原则的承诺，将在确保
    AGI 造福人类同时应对潜在风险方面发挥关键作用。


    总之，通往 AGI 的道路是技术进步与哲学探索之间复杂的相互作用。它挑战我们重新思考与技术的关系、我们智能的本质以及我们社会的未来。通过以道德责任为重点来驾驭这片领域，我们可以塑造一个
    AGI 符合更广泛人类价值观和愿景的未来，为一个更光明、更公平的全体未来做出贡献。


    # 15. 尾声：数据科学与 AI 统治世界


    数据正以前所未有的规模被创造和消费。数据科学的发展甚至更快，进一步加速了数据创造和消费的速度。过去几年 AI 的引入重塑了这一领域，进一步加快了进步的步伐。


    很明显，数据科学和 AI 正在所有行业和社会各层级中纵向和横向扩展。那些率先采用最佳实践的公司将获得显著优势。其余的公司则可能消亡。这种情况在很大程度上相当于生产方式的一次范式转变，类似于工业革命期间所经历的转变，这使得许多人谈论第四次工业革命。


    数据科学的历史并非线性发展。它的根源在于数学和哲学，在于 AI 之父们创造思考机器的愿景，在于计算智能和数据挖掘，也在于许多其他领域和思想，即我们如何从一条简单的信息推断出概念的全貌。经过几个世纪，数据与计算能力方面的科学、工程和可用性创造了一场完美风暴，而且这场风暴只会愈演愈烈。


    我希望本书能为您提供足够的见解，让您了解如何将数据科学应用于商业。数据管理、数据战略、选择正确的算法、招聘数据科学家以及拥有合适的文化——当一个公司试图从数据中提取洞察时，所有这些因素都是相互交织的。做数据科学比简单地招聘一个数据科学家更复杂，但同时，它也可能比从头创建一个全新算法要容易得多。


    意识到这些事实是构建以数据为中心的组织的第一步。本书为您提供了足够的材料、示例和案例研究，让您了解其中的机遇，也可能存在的陷阱。也许您现在还没有吸收所有的课程，但这没关系。并非所有内容都能立刻引起共鸣。当您开始处理数据后，您会重新阅读某些章节，届时它们将更有意义，因为您能将自身经验与本书中的教导联系起来。


    重要的是，您已经决定通过学习如何在公司中使用数据科学和 AI，留下来并成为这场革命的一部分。


    祝您在这段旅程中取得成功。

