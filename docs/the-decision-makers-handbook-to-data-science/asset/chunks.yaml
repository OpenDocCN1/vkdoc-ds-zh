    ## 你真正需要解决的是什么问题？


    有时候，你以为正在解决的问题，其实并不是真正需要解决的那个。比方说，你想预测比特币的价格来获利。这是一个非常困难的问题——我在这方面做过很多工作，所以很清楚。


    然而，如果你的目标是从比特币中获利，这实际上是另一个问题。也许你感兴趣的是价格是在上涨还是下跌。或者，你可能想用强化学习来创建一个算法交易机器人，替你完成这项任务。


    关键在于，你实际试图解决的问题会直接影响你模型的最终成功率！优秀的数据科学家知道如何明智地选择“战场”，从而最大化成功的机会。我们之前看到一个例子，数据采集的考量与商业计划相互作用。这里的情况也是一样的。


    务必确保与数据科学家讨论这些问题。我见过数月的努力付诸东流，因为客户说他们需要做一件事（例如，回归分析），但实际情况是，如果数据科学家尝试解决一个不同的问题（例如，将回归问题转化为一个三类分类问题），问题本可以更容易地解决。


    **示例：通往顶峰的路有千万条**


    有句谚语说：“通往山顶的路有千万条，但山顶的风景始终如一。”这句话在数据科学领域再正确不过了。正如本章所阐释的，有时一个问题根本就不是问题。企业混淆“想要”与“需要”的情况并不少见。


    我曾有一位客户，问我是否知道如何编写循环神经网络的代码。我回答知道，但我很好奇他为何对这个技术如此执着。后来发现，他是想进行图像识别。关于图像识别和深度学习，首先，你极有可能用到的是卷积神经网络。其次，有许多由谷歌等大公司和研究机构发布的现成架构，直接使用其中一种或许更好。


    最后，他做图像识别的目的是为了将其用于一个推荐系统。而事实是，对于这个特定的用例，他完全可以要求用户为图片提供标签。因此，图像识别并非该问题的关键部分，真正的问题在于向用户推荐与他们过去喜欢的物品属性相似的其他物品。


    在尚未掌握全部事实的情况下过于具体，只会造成混乱。还有其他类似的情况。我之前已经举过金融领域的例子，另一个例子与医疗应用有关。


    假设你对运动损伤感兴趣，并希望预测运动员何时会受伤。有几种不同的方法可以处理这个问题：


    *   **回归分析**——预测一名运动员能坚持多少天才受伤？

    *   **分类**——将时间划分为三或四个类别（例如，1 周、1 个月等），并将其作为分类问题来处理。

    *   **生存模型**——类似于回归分析，但在此情况下会使用不同的模型和假设。


    这些模型的性能各不相同，并且它们可能以不同方式与你面临的问题相互作用。例如，分类方法的分辨率最差（在这种情况下，一周可能是一个很长的时间间隔），但问题更容易解决。生存模型比回归分析更适合这种情况，并且其背后的假设更为合理，但可供选择的生存模型数量远少于回归模型。


    一如既往，天下没有免费的午餐。每一个选择都伴随着权衡，这就是为什么数据科学家必须清楚，模型的输出结果如何能被用于解决实际问题。


    ## 10. 常见陷阱


    现在，我们将探讨数据科学过程中一些常见的陷阱。我们会回顾当数据科学家试图解决问题时，可能出现偏差的一些情况。我们从“不该做什么”开始。


    ### 不该做什么


    首先，你不应该尝试独自解决问题。你可能会忍不住直接告诉数据科学家你想要的解决方案是什么，但这并非正确的做法，稍后你会明白原因。


    你的任务是去发现问题的本质，对其进行表述，并遵循本书前面提到的原则向数据科学家解释清楚。然后，你需要放手，将问题委派出去。


    这在你看来可能微不足道，但其发生频率远比你想象的要高。现在，让我们看一个例子，来理解为什么这会是如此大的一个问题。

    '
- fmt: "### Example: Bad Collaboration\n\nLet’s say that you have an app in the health-tech\
    \ space and you want to reward users if they take some positive action. However,\
    \ you also want to see if the app has any real long-term impact on behavior and\
    \ what that impact is. So, you might ask if someone installs the app, do they\
    \ keep exercising more or do they eventually go back to a normal level of exercise?\n\
    \nThere are a few different ways to look at this problem. We have a number of\
    \ variables available to us, such as “before” and “after” activity levels and\
    \ some other factors, such as demographics. You can either conduct hypothesis\
    \ testing or you can apply a statistical model. Both options are viable in attempting\
    \ to tackle this problem.\n\nHowever, upon closer inspection we realize that the\
    \ statistical model is a better solution because we have different kinds of variables\
    \ and it will provide us with a higher level of flexibility than the hypothesis\
    \ test. Additionally, when the data was collected, there wasn’t a control in place\
    \ which means hypothesis testing might be a bit biased.\n\nSo, we run a model\
    \ and use the installation of the app as a variable.¹ We want to determine whether\
    \ this variable has any significance or if it has a positive coefficient, which\
    \ would indicate that the activity levels are higher after the app was installed.\n\
    \nThe model might look something like this:\n\n```\nActivityLevels = AppInstallation\
    \ + DemographicFactor1 + DemographicFactor2 +...+ DemographicFactorN\n```\n\n\
    We find that the variable `AppInstallation` has a positive coefficient and a significant\
    \ p-value, which means it has a positive effect.\n\nHowever, that’s when we start\
    \ running into a variety of issues. The first problem is that the client doesn’t\
    \ understand the model. There are all sorts of terms and concepts they aren’t\
    \ familiar with, and they aren’t prepared to learn those concepts.\n\nThe thing\
    \ is that they then need to raise funds based on the research, but they don’t\
    \ really know how to explain what’s going on to investors.\n\nAt this point, things\
    \ start to go wrong because the client starts making all sorts of recommendations\
    \ and effectively tries to solve the problem for the data scientist.\n\nThey might\
    \ start making suggestions for things that have already been taken into account\
    \ in the model.\n\nFor example, they might recommend taking into account other\
    \ factors as well, but the model already takes into account all the factors that\
    \ are available from the data.\n\nThen, they might suggest measuring the percentage\
    \ difference against a baseline, but that’s something the model is implicitly\
    \ doing.\n\nOkay, they say. Then, they come up with an even more brilliant idea:\
    \ let’s measure the exact effect our app has on users. Well, that’s precisely\
    \ what the coefficient in the model does.\n\nAnd finally, they might suggest using\
    \ a graph because it makes things easier to understand—and graphs always look\
    \ sexy—even though it doesn’t prove anything.\n\nSo, we create the graph and it\
    \ looks like Figure [9-1](#490014_3_En_10_Chapter.xhtml#Fig1).\n\n![](images/490014_3_En_10_Chapter/490014_3_En_10_Fig1_HTML.jpg)\n\
    \nA line graph of activity versus time. The line has a series of significant fluctuations,\
    \ with lowest point at (55, 90), and highest point at (145, 150). All values are\
    \ approximate.\n\nFigure 9-1  \nGraph of the hypothetical app\n\nThe problem is\
    \ that the graph isn’t telling us much.\n\nStatistical models are built to take\
    \ different factors into account. And in the case of our problem, we have multiple\
    \ factors interacting with each other. So, when you create a graph, the effect\
    \ isn’t always clear because it’s being drowned out by the other factors.\n\n\
    This is why it’s a good idea to run a significance test because it can give you\
    \ a definite answer as to what’s happening.\n\nHowever, the client either doesn’t\
    \ understand the need for a significance test or simply isn’t willing to put in\
    \ the effort. That’s when we start going round in circles. The client continues\
    \ to make similar recommendations and attempts to push the scientist into developing\
    \ a solution for the problem, but their recommendations aren’t methodologically\
    \ sound.\n\nIt’s a bad situation to be sure. First, you have a client who refuses\
    \ to understand the work to present it effectively and, as a result, is forcing\
    \ the data scientist to produce work that is not scientifically sound.\n\nThe\
    \ most effective solution is to break the problem down into two parts. The first\
    \ part would involve creating a presentation with some graphs that the client\
    \ can use to explain the situation to the investors. It might not be completely\
    \ accurate but it can be useful to raise funds.\n\nThen, the second part would\
    \ involve creating a methodologically sound model that can be used internally,\
    \ even if the client doesn’t really understand it. That’s not necessarily a bad\
    \ thing. While the client might have trouble understanding the model, it can still\
    \ be used in the decision-making process to improve certain aspects of the app.\n\
    \nIt will make everyone happy because the client has something sexy and shiny\
    \ to present to investors and to show them what they want to see, but at the same\
    \ time, they have a scientifically sound statistical model on which business decisions\
    \ can be based.\n\nSo, what was the issue in this situation? The main problem\
    \ was that the client was trying to replace the data scientist—effectively doing\
    \ part of their job—by coming up with different recommendations. He didn’t trust\
    \ the data scientist to do their job, but at the same time didn’t understand how\
    \ statistical testing works or how to evaluate the scientist’s work.\n\nThese\
    \ issues were then compounded by the client’s unwillingness to learn anything\
    \ about the model, leading to an awkward situation where everyone lost a lot of\
    \ time trying to determine the best way to work.\n\nThe best approach would have\
    \ been, of course, to trust in the data scientist without doing this back and\
    \ forth. The real problem is that this all started because the business didn’t\
    \ have a data strategy in place from day 0.\n\nHad the study been designed properly\
    \ in the first place, the data would have been collected in a more effective fashion,\
    \ and that would have ensured the data scientist had the right information to\
    \ work with. The result would have been one that would have been much easier for\
    \ everyone to understand, including the investors.\n\nMost data-related problems\
    \ are due to lack of proper planning. Take this as a lesson and always try to\
    \ plan in advance as best as you can."
  raw: '### Example: Bad Collaboration


    Let’s say that you have an app in the health-tech space and you want to reward
    users if they take some positive action. However, you also want to see if the
    app has any real long-term impact on behavior and what that impact is. So, you
    might ask if someone installs the app, do they keep exercising more or do they
    eventually go back to a normal level of exercise?


    There are a few different ways to look at this problem. We have a number of variables
    available to us, such as “before” and “after” activity levels and some other factors,
    such as demographics. You can either conduct hypothesis testing or you can apply
    a statistical model. Both options are viable in attempting to tackle this problem.


    However, upon closer inspection we realize that the statistical model is a better
    solution because we have different kinds of variables and it will provide us with
    a higher level of flexibility than the hypothesis test. Additionally, when the
    data was collected, there wasn’t a control in place which means hypothesis testing
    might be a bit biased.


    So, we run a model and use the installation of the app as a variable.¹ We want
    to determine whether this variable has any significance or if it has a positive
    coefficient, which would indicate that the activity levels are higher after the
    app was installed.


    The model might look something like this:


    *   *ActivityLevels* = *AppInstallation* + *DemographicFactor1* + *DemographicFactor2*
    +...+ *DemographicFactorN*


    We find that the variable *AppInstallation* has a positive coefficient and a significant
    p-value, which means it has a positive effect.


    However, that’s when we start running into a variety of issues. The first problem
    is that the client doesn’t understand the model. There are all sorts of terms
    and concepts they aren’t familiar with, and they aren’t prepared to learn those
    concepts.


    The thing is that they then need to raise funds based on the research, but they
    don’t really know how to explain what’s going on to investors.


    At this point, things start to go wrong because the client starts making all sorts
    of recommendations and effectively tries to solve the problem for the data scientist.


    They might start making suggestions for things that have already been taken into
    account in the model.


    For example, they might recommend taking into account other factors as well, but
    the model already takes into account all the factors that are available from the
    data.


    Then, they might suggest measuring the percentage difference against a baseline,
    but that’s something the model is implicitly doing.


    Okay, they say. Then, they come up with an even more brilliant idea: let’s measure
    the exact effect our app has on users. Well, that’s precisely what the coefficient
    in the model does.


    And finally, they might suggest using a graph because it makes things easier to
    understand—and graphs always look sexy—even though it doesn’t prove anything.


    So, we create the graph and it looks like Figure [9-1](#490014_3_En_10_Chapter.xhtml#Fig1).


    ![](images/490014_3_En_10_Chapter/490014_3_En_10_Fig1_HTML.jpg)


    A line graph of activity versus time. The line has a series of significant fluctuations,
    with lowest point at (55, 90), and highest point at (145, 150). All values are
    approximate.


    Figure 9-1


    Graph of the hypothetical app


    The problem is that the graph isn’t telling us much.


    Statistical models are built to take different factors into account. And in the
    case of our problem, we have multiple factors interacting with each other. So,
    when you create a graph, the effect isn’t always clear because it’s being drowned
    out by the other factors.


    This is why it’s a good idea to run a significance test because it can give you
    a definite answer as to what’s happening.


    However, the client either doesn’t understand the need for a significance test
    or simply isn’t willing to put in the effort. That’s when we start going round
    in circles. The client continues to make similar recommendations and attempts
    to push the scientist into developing a solution for the problem, but their recommendations
    aren’t methodologically sound.


    It’s a bad situation to be sure. First, you have a client who refuses to understand
    the work to present it effectively and, as a result, is forcing the data scientist
    to produce work that is not scientifically sound.


    The most effective solution is to break the problem down into two parts. The first
    part would involve creating a presentation with some graphs that the client can
    use to explain the situation to the investors. It might not be completely accurate
    but it can be useful to raise funds.


    Then, the second part would involve creating a methodologically sound model that
    can be used internally, even if the client doesn’t really understand it. That’s
    not necessarily a bad thing. While the client might have trouble understanding
    the model, it can still be used in the decision-making process to improve certain
    aspects of the app.


    It will make everyone happy because the client has something sexy and shiny to
    present to investors and to show them what they want to see, but at the same time,
    they have a scientifically sound statistical model on which business decisions
    can be based.


    So, what was the issue in this situation? The main problem was that the client
    was trying to replace the data scientist—effectively doing part of their job—by
    coming up with different recommendations. He didn’t trust the data scientist to
    do their job, but at the same time didn’t understand how statistical testing works
    or how to evaluate the scientist’s work.


    These issues were then compounded by the client’s unwillingness to learn anything
    about the model, leading to an awkward situation where everyone lost a lot of
    time trying to determine the best way to work.


    The best approach would have been, of course, to trust in the data scientist without
    doing this back and forth. The real problem is that this all started because the
    business didn’t have a data strategy in place from day 0.


    Had the study been designed properly in the first place, the data would have been
    collected in a more effective fashion, and that would have ensured the data scientist
    had the right information to work with. The result would have been one that would
    have been much easier for everyone to understand, including the investors.


    Most data-related problems are due to lack of proper planning. Take this as a
    lesson and always try to plan in advance as best as you can.'
  trans: "\n### 示例：糟糕的合作\n\n假设你有一款健康科技领域的应用，并希望当用户采取某些积极行动时给予奖励。但同时，你也想探究该应用是否对用户行为有真正的长期影响，以及这种影响具体是怎样的。那么，你可能会问：如果用户安装了应用，他们是否会持续增加运动量，还是最终会恢复到正常的运动水平？\n\
    \n看待这个问题有几种不同的方式。我们拥有许多可用变量，例如“之前”和“之后”的活动水平，以及一些其他因素，比如人口统计数据。你可以进行假设检验，也可以应用统计模型。在尝试解决这个问题时，两种方案都是可行的。\n\
    \n然而，经过仔细审视后，我们会意识到统计模型是更好的解决方案，因为我们拥有不同类型的变量，而且它能提供比假设检验更高的灵活性。此外，在数据收集时，并没有设置对照组，这意味着假设检验可能存在一定偏差。\n\
    \n于是，我们运行一个模型，并将应用的安装情况作为一个变量¹。我们要判断这个变量是否具有统计显著性，或者是否具有正的系数，这能表明应用安装后活动水平有所提高。\n\
    \n模型可能像这样：\n\n```\nActivityLevels = AppInstallation + DemographicFactor1 + DemographicFactor2\
    \ +...+ DemographicFactorN\n```\n\n我们发现变量`AppInstallation`具有正的系数且 p 值显著，这意味着它具有积极影响。\n\
    \n然而，这时我们就开始遇到各种问题了。第一个问题是客户不理解这个模型。他们不熟悉各种术语和概念，而且也没有准备去学习这些概念。\n\n问题是，他们之后需要基于这项研究来筹集资金，但他们却不知道如何向投资者解释清楚情况。\n\
    \n此时，情况开始变得糟糕，因为客户开始提出各种建议，实际上是在试图代替数据科学家解决问题。\n\n他们可能会建议一些已经在模型中考虑过的内容。\n\n例如，他们可能会建议也把其他因素纳入考虑，但模型已经考虑了数据中所有可用的因素。\n\
    \n然后，他们可能会建议测量相对于基线的百分比差异，但这正是模型在隐式完成的工作。\n\n好吧，他们又说。接着，他们想出了一个更绝妙的主意：我们来测量我们的应用对用户的精确影响。而这恰恰是模型中的系数所做的事情。\n\
    \n最后，他们可能建议使用图表，因为这样更容易理解——而且图表看起来总是很性感——尽管它什么也证明不了。\n\n于是，我们创建了图表，看起来就像图 9-1\
    \ 所示。\n\n![](img/490014_3_En_10_Fig1_HTML.jpg)\n\n一张活动量随时间变化的折线图。线条有多个明显的波动，最低点约为(55,\
    \ 90)，最高点约为(145, 150)。所有数值均为近似值。\n\n图 9-1  \n假设性应用的图表\n\n问题是这张图表并没有告诉我们多少信息。\n\
    \n统计模型的设计就是为了考虑不同的因素。而在我们这个问题的情形中，有多个因素在相互影响。因此，当你创建图表时，效果并不总是清晰可见，因为它被其他因素所淹没了。\n\
    \n这就是进行显著性检验不失为一个好主意的原因，因为它能就当前情况给出一个确定的答案。\n\n然而，客户要么不理解进行显著性检验的必要性，要么就是根本不愿意投入精力。就在这时，我们开始陷入无休止的循环。客户继续提出类似的建议，并试图推动科学家为这个问题开发解决方案，但他们的建议在方法论上站不住脚。\n\
    \n这确实是一个糟糕的局面。首先，你有一个拒绝理解工作以有效呈现结果的客户，结果，这迫使数据科学家产出了在科学上并不严谨的工作。\n\n最有效的解决方案是将问题分解成两部分。第一部分是制作一份包含一些图表的演示文稿，客户可以用它向投资者解释情况。这可能不完全准确，但对于筹集资金可能有用。\n\
    \n接着，第二部分是创建一个方法论上严谨的模型，可以供内部使用，即使客户并不真正理解它。这未必是件坏事。虽然客户可能难以理解这个模型，但它仍然可以用于决策过程，以改进应用的某些方面。\n\
    \n这样会让每个人都满意，因为客户有了性感闪亮的东西向投资者展示，让他们看到想看到的内容；但与此同时，他们也有了一个科学上严谨的统计模型，可以作为业务决策的基础。\n\
    \n那么，这种情况下问题出在哪里呢？主要问题是客户试图通过提出各种不同的建议来取代数据科学家——实际上是在做部分数据科学家的工作。他不信任数据科学家能做好自己的工作，但同时又不懂统计检验是如何工作的，也不知道如何评估科学家的工作。\n\
    \n这些问题又因客户不愿学习任何关于模型的知识而变得更加严重，导致了一个尴尬的局面，每个人都浪费了大量时间试图确定最佳的工作方式。\n\n当然，最好的方法本来是信任数据科学家，而不是这样来回反复。真正的问题是，这一切的根源在于业务方从一开始就没有制定数据策略。\n\
    \n如果当初研究设计得当，数据本可以更有效地收集，这也将确保数据科学家拥有正确的信息来开展工作。最终的结果也会更容易被所有人理解，包括投资者。\n\n大多数与数据相关的问题都源于缺乏适当的规划。请以此为鉴，始终尽可能提前做好规划。\n"
- fmt: '### The Real Problem


    Data science can be very complex and not everyone will understand it. However,
    if you try to build something everyone will understand, then you are reducing
    your work to the lowest common denominator. This is when you end up with something
    like the anti-vaccine movement.


    Imagine what would happen if all the pharmaceutical studies being conducted were
    run in such a way that everyone could understand them. It simply wouldn’t be possible
    because of the complexity of the information. It would be like handing over the
    “keys” of a space shuttle to someone who’s never even flown as a passenger in
    a plane. That space shuttle would *not* be going anywhere in the best case scenario,
    and in the worst, it would blow up in someone’s face.


    You need people who are experts to validate the study and understand what’s going
    on and to review it. Just as you need a pilot trained in flying space shuttles
    to get one off the ground.


    Clearly, within the context of a business, you don’t expect the decision-maker,
    the founder, or the head of a division to be an expert in data science. That’s
    why it’s important to find a balance between satisfying the science, so that you
    know that the model-based decisions are sound, but at the same time making models
    which are easily interpretable.


    As previously mentioned, though, the problems will get worse if a business doesn’t
    follow the right principles from the start, such as not following the right data
    strategy and so on. Another problem is the lack of data science education, which
    is what this book is trying to help with.


    If someone is properly educated in the process of data science, even if it’s only
    from a high-level perspective, then they will feel more comfortable handling models,
    interpreting results, and taking action on those results. So, ignorance is a terrible
    thing, especially when it comes to artificial intelligence and machine learning.


    ## What’s the Solution?


    While the world of business may not always be data- or science-driven, you clearly
    see the value of data- and science-driven decision-making, which is why you’re
    reading this book.


    So, how can we solve this problem? Well, first of all, you can’t expect every
    person or organization to be data-driven, but there are a few measures you can
    take to minimize the likelihood of this problem occurring.


    Of course, the first and most important thing is to have the right data strategy
    in place from the very beginning. Something else you can do, though, is to make
    sure you hire the right people and have faith in them. It’s not always going to
    be possible, but try your best.


    Furthermore, don’t get overly creative with lots of models and don’t try to guide
    the data scientist into doing specific things instead of letting them work.


    Data science interacts with business quite often, and I’ve frequently seen people
    feel insecure because they don’t understand how data science is being used and
    they try to guide the data scientist into doing all sorts of things. You will
    waste less money and time if you just hire someone you trust and let them do their
    job.


    You also have to consider the study before you start collecting data. Consider
    hiring someone even before you start data collection because they can explain
    how things should be done. So, they can show you how the study should be conducted
    so that everyone understands what’s going on, how to collect the data and that
    it can be collected in the first place, and that you feel comfortable with the
    study in terms of understanding it and presenting it to someone else.


    As previously stated, in the aforementioned example, most of the problems would
    have been solved if it would have been easy to carry out a hypothesis test. So,
    don’t be like these people and instead be the person who thinks about all the
    issues that might come up in advance.


    ### CAUSAL INFERENCE


    The model mentioned previously falls under the domain of causal inference. Causality
    is a very old problem, which has started to become more and more popular in the
    last few years. Judea Pearl, one of the most important computer scientists in
    history, creator of Bayesian networks, and Turing award winner (the Turing award
    is the Nobel Prize of computer science), called for a “causal revolution.”


    According to Judea Pearl, there are three levels of analysis, which he calls the
    “rungs of the Ladder of Causation.”


    In the first rung, we are studying association. We can ask questions such as “if
    I observed a symptom, how would this change my belief about a disease?”


    In the second rung, we are studying intervention. For example, we can ask questions
    like “if I take aspirin, will my headache be cured?”


    In the third rung, we are studying counterfactuals. We can ask questions like
    “how would my life have been if I had gone to college in a different city?”


    Judea Pearl believes that true intelligence lies in the third rung of causation,
    and one of the reasons that humans have become so successful on our planet is
    our ability to think in this way. He says that deep learning, while it has been
    a very successful approach for many problems, is nothing more than curve fitting,
    essentially being stuck on the first rung of causation. According to Pearl, true
    AI will never be achieved unless we build algorithms that can think up to the
    third rung of causation much like we do.


    Judea Pearl’s views have caused criticism and enthusiasm alike. What is certain
    is that the topic of causality has started to get more and more attention, and
    it is closely linked to some of the most important questions, such as health outcomes
    and policy interventions. Microsoft has also released an open source library for
    causal inference called `DoWhy`, so we are certain to see more and more research
    and software libraries coming up in the next few years.


    # 11. Hiring and Managing Data Scientists


    We’ve talked about why you should hire a data scientist and the numerous benefits
    it will bring your business. We’ve also looked at why it’s important to let them
    do their job without you trying to guide them. But to do that, you need to hire
    someone you can trust.


    In this chapter, we’ll be looking at precisely how to hire and manage a data scientist
    to get the best possible results. First, let’s try to understand data scientists
    a little better.


    ## Into the Mind of a Data Scientist


