    ## About the Author


    # 1. Demystifying Data Science and All the Other Buzzwords


    In the business world, data has become a big thing. You hear all sorts of buzzwords
    being thrown around left, right, and center. Things like `big data`, `artificial
    intelligence`, `machine learning`, `data mining`, `deep learning`, and so on.
    This can get confusing, leaving you paralyzed as to what is the best technology
    to use and under what circumstances. In this chapter, we are going to demystify
    all these buzzwords, by taking a short stroll through the history of data science.
    You will understand how the history of data analysis gave birth to different schools
    of thought and disciplines, which have now all come together under the umbrella
    of the term **data science**.


    ## What Is Data Science?


    In 2017, we generated more data than we did over the previous 5000 years of our
    history.^([¹](#fn1)) That’s a lot of data. And it’s not surprising. Every device
    we own generates data, and all our interactions with said devices generate even
    more data.


    So, you take a picture with your smartphone? You’ve generated data. You read the
    news on your tablet? You’re generating data. You listen to a podcast on your laptop?
    You’re generating data. You go on Facebook to update your status? You’ve generated
    data.


    You get the point. There’s a good chance that the only thing we do that doesn’t
    generate data is breathe, but even that is debatable considering all the wearable
    devices that are available and which can track everything from heart rate to calories
    burned.^([²](#fn2))


    What happens to all this data? It must have some use or things wouldn’t be set
    up so that we generate it in the first place.


    At the moment, some of it does and some of it doesn’t. In fact, some studies have
    discovered that less than 0.5% of data is being analyzed and turned into actionable
    insights.^([³](#fn3)) But more on that later.


    The important thing is that all data *can* be used. We just need to figure out
    better ways of doing so.


    And this is where data science comes in. There are many definitions of data science.
    One such definition is


    > Data science is a “concept to unify statistics, data analysis, machine learning
    and their related methods” in order to “understand and analyze actual phenomena”
    with data.^([⁴](#fn4))


    Okay, so those are a lot of big and fancy words, which can get confusing. Let’s
    boil it down to the simplest definition:


    > Data science is about using data to do useful stuff.


    Short and to the point. That’s exactly what data science is all about. The methods
    we use are important, of course, but the essence of this discipline is that it
    allows us to take data and transform it so we can use it to do useful things.


    For example, let’s say someone visits a doctor because they are short of breath.
    They are experiencing heartburn and they have chest pains. The doctor will run
    the basic tests, including measuring blood pressure, but nothing seems out of
    the ordinary.


    Since the patient is overweight, the doctor immediately assumes the symptoms are
    caused by the patient’s size and recommends a healthier diet and exercise.


    Three months later, the same patient is brought into the emergency room and ends
    up dying on the table because of a heart defect.


    This might sound like an episode on your favorite medical show, that is, a work
    of fiction, but it happens much more often than you might think. In fact, in the
    USA, 5% of patients are misdiagnosed, while misdiagnosis cost the UK over £197
    million in the 2014/2015 fiscal year.^([⁵](#fn5))


    However, this situation can be avoided thanks to data science. The analysis of
    similar cases reveals that the symptoms our patient exhibited aren’t just caused
    by obesity but also by some cardiovascular conditions.


    Having access to systems that can analyze data and compare it with new data inputs
    could have helped the doctor identify the problem sooner without relying solely
    on their own personal experience and knowledge.


    So, data science can be used to save lives, among many other applications, which
    is pretty useful.


    ### Data Science Is Multidisciplinary


    Data science involves multiple disciplines, which is why finding someone with
    the necessary skills to be a data scientist can be difficult.


    Thus, data science involves everything from statistics and pattern recognition
    to business analysis and communication. It requires creative thinking as much
    as it requires analytical thinking.^([⁶](#fn6))


    So, data science involves discovering which data is useful as well as effective
    ways of managing it. It also requires determining how the data should be processed
    and what types of insights can be garnered from the massive amounts of data available.


    Data science requires knowledge of programming and computing, but also visualization
    so that the insights can be presented in a way that everyone can understand.


    Furthermore, business acumen is also a necessity because while data science can
    be applied to any field of business, it is critical to know what types of answers
    the business needs and how to present said insights so leadership can understand
    them.'
