  trans: '

    # 变革的阻力


    如果你是一家初创公司，那么你很可能灵活性较强，因此变革的阻力不会成为问题。然而，如果你身处大型组织，下面这些内容就会非常相关。


    变革的三种阻力类型是：文化阻力、个人阻力和智力阻力（图 12-3）。


    ![](img/490014_3_En_12_Fig3_HTML.jpg)


    图表顶部有一个三角形，标注为“智力阻力”，并附有引述“我就是搞不懂”。其下方是两个梯形，分别标注为“个人阻力”，引述“看不到对我有什么好处”，以及“文化阻力”，引述“我们一直都是这么做的”。


    **图 12-3** 变革的阻力类型


    ## 文化阻力


    文化阻力在《点球成金》中有所体现。我们面对的是一个庞大而古老的组织，或是多层级的管理层，或是那些与数学、统计学或数据关联甚少的领域。体育与金融的对比就是一个很好的例子。


    正如《点球成金》所示，体育界仍在努力深入分析领域，但尚未真正实现。即使在《点球成金》事件发生的年代，比利·比恩试图在奥克兰运动家队推行的那些做法，在通常处于数据分析前沿的金融领域，也算不上什么特别之处。


    ## 个人阻力


    个人阻力在较小的公司中也会出现，指的是员工不喜欢这种变革。


    举一个我亲身经历的例子：我曾与一位客户合作，等待了两个月才有人给我指派一位数据库专家。然后，我不得不给主管打电话，又等了一个月。


    可能发生的情况是，员工们已经超负荷工作，结果又被分配了更多任务。因此，员工们根本看不到做任何事——比如导出数据库或尝试实施某个算法——能带来什么好处。


    ## 智力阻力


    最后，还有一种情况是人们对他们不理解的事物感到恐惧。想想电影《终结者》中的“天网”，就像人们害怕机器会接管世界一样。


    在组织中，智力阻力并不常见，因为大多数人都明白数据是有用的，它可以提高效率和销售额。然而，如果智力阻力的迹象哪怕只露出一丝端倪，那么聘请一位优秀的数据主管就是一个好的开始。这个人能够掌控数据，向人们展示数据，并展示数据如何能够改善公司内部的几乎一切事物。


    # 变革之路


    谈到你的变革之路，有三点需要记住。首先，你必须确定数据科学家将如何带你实现变革。这意味着要创造一个数据科学友好的环境，让他们能够畅所欲言，并尝试运营那些具有巨大潜在影响的项目。变革是缓慢的，但如果人们开始看到结果，他们就会因为理解了其中的好处而慢慢改变想法。


    在某些情况下，找到一位支持者也非常重要。这个人能够为这个新方向注入热情。这位支持者真心相信这种新方法，并且拥有足够的热情和地位，能够真正推动公司其他成员朝着这个新目标前进。


    这通常是一位深受欢迎的高层员工。既可能是你，也可能是某位数据科学家或首席数据官。


    通常，最佳选择是那些已经在组织中且人缘很好的人，是大家无论其谈论什么都会尊重并倾听的人。这也有助于员工将这次变革视为一次学习经历，以及对公司（因此也是对他们自己）更有益的事情。


    在变革之路上要记住的最后一点是，关注员工的利益至关重要，因为没有人喜欢在没有回报的情况下做更多的工作。然而，那些有求知欲和进取心的员工会看到学习和帮助组织的好处，因为这最终能转化为他们自己的成果。


    # 如何开始


    谈到实施数据科学文化，我见过两种方法。第一种是“小步快跑”法，第二种是“用例驱动”法。


    在小步快跑法中，你收集大量数据，决策者则自我学习数据科学知识。然后，他们尝试使用简单的图表和统计数据，从而变得更具数据洞察力。一旦他们对数据感到得心应手，就会采取下一步行动：聘请专人来解读数据。


    用例驱动法则更像是一种自上而下的方法。当公司遇到某种特定类型的问题时，他们会制定一个计划，并可能首先聘请人来帮忙设计计划并解决这个特定问题。然后，他们再考虑这些发现如何与其他用例相关联。


    小步快跑法最为常见，因为在 Excel 或仪表盘中收集和可视化数据很容易。当一家公司对数据感兴趣，是因为听说其他人都在收集和使用数据，但数据本身并非优先事项时，就会采用这种方法。


    因此，当公司解决了主要问题并实现盈利时，他们可能会决定聘请某人，因为他们手头有所有这些数据，并希望能利用这些数据做些事情。这种方法之所以合理，是因为它不会对当前运营造成太大干扰，而且如果数据收集不是你优先考虑的事情，你也不必把事情推得太快、太远。


    然而，这种方法也可能引发各种问题。这是一种较慢地采用数据科学的方式，但同时你也会遇到我们在第 2 章中讨论过的所有问题。换句话说，在事先没有考虑或没有目标的情况下收集了一大堆数据，最终演变成一场灾难。


    用例驱动法则不太常见，通常用于公司有明确用例的情况。其优势在于，通过更有针对性的方法，可以提供更直接的结果。然而，这需要公司具备一定程度的数据意识，并且需要能够接触到值得信赖的数据科学家。


    请注意，公司不必在两种方法中二选一。很多时候，他们可能会先采用第一种方法，最终却转向了后一种。


    # 从何处着手


    “何处”与“如何”同样重要。因此，你首先要梳理你的组织对数据的使用情况。你需要理解从数据收集到使用的整个流程，并发现你可能拥有的任何“暗数据”。


    同时，要强调战略和创新，并努力帮助员工理解这为什么重要。奖励良好行为，这对数据科学家来说至关重要。许多数据科学家渴望得到认可，并希望感觉自己正在对世界或公司产生影响。因此，在博客和社交媒体上推广优秀的工作成果会大有裨益，同时也要在公司内部与所有人分享最佳用例。


    最后，创建一种嵌入式文化是打破各自为政、改善沟通的途径。你希望数据科学家与开发者、产品负责人以及管理者密切合作。


    这是确保研究具有相关性、成果得到实施，并且能在公司内部产生影响的唯一途径。

    '
- fmt: '# Understanding and Using Dark Data


    Dark data is operational data that is not being used, such as log files, notes
    from sales calls or emails, and similar information.


    This type of data is relevant because there’s a lot of it and it’s sitting there
    gathering dust. Deloitte reports that by 2020 we’re going to have 44ZB of data.
    This figure might not be 100% accurate, but it’s still a huge amount of data.
    Note that many of the sources of data aren’t specified; it includes audio, notes,
    video, image files, and so on.


    Also, Deloitte has a special mention for the Internet of Things and other non-traditional
    sources. This type of data is easy to collect but it’s not always used. So, it
    very quickly becomes dark data and just sits in a data warehouse waiting for someone
    to make sense of it.


    ## What Can Dark Data Do for You?


    There are a number of things dark data can do for you, but it’s not easy to provide
    a general set of guidelines that will apply in every situation. However, here
    are a few examples.


    So, you might have some email address. In some cases, you can extract gender and
    age from email addresses or visitor behavior from log files or sentiment from
    customer calls. Then, you can create predictive models for user retention from
    the usage logs or customer logs, for example. This is just one example and there
    are countless possibilities.


    Keep in mind that the unstructured nature of data can make it difficult to use.
    However, if you can do it, it can be very rewarding.


    # Other Steps to Take to Become More Data Driven


    As mentioned, you need to create an open culture that promotes strategy and innovation.
    A champion can be a vital asset as they help motivate employees.


    There are a number of ways you can create this kind of culture. You can, for example,
    organize internal hackathons once or twice a month or allow employees to play
    around with an idea of their own. Other companies have done this successfully,
    and it works because it keeps people happy and engaged.


    Another interesting approach is to use Kaggle to create internal competitions.
    This works if you have a very large number of data scientists within your company.
    It gives people an opportunity to have some fun and learn something new.


    Finally, if you can, open up your data and allow your employees to invite other
    people to take part in small projects. Of course, this doesn’t apply for every
    company. However, if you can, it can be a great way to find new talent.


    # Rewarding Good Behavior


    When it comes to rewarding good behavior, employees with good ideas need some
    form of recognition. Maybe you publish their results on a blog, or you make libraries
    and software open source and attribute the developers. This is what large organizations
    in the field are doing.


    For example, Google and Facebook have their own research blogs. Facebook also
    has a forecasting library called `Prophet` when you can read an article written
    by the people within the company who created the library.


    This is an excellent approach because everyone wants to be rewarded for their
    contribution to something new and amazing. And there’s no reason for them to be
    anonymous. Their names are right there. Plus, data scientists like to look into
    the future. If they want to get another job, it’s good for them to know that a
    new employer can easily find them and their work online. This is why data scientists
    and software developers also have GitHub accounts.


    So, it’s not just about the bonuses, it can also be about the ego.


    # Create an Embedded Culture


    Finally, one of the most important things to do when trying to build the right
    culture for data science is to create an embedded culture. This means that you
    want the data scientist to work closely with other divisions and you want to have
    good communication between all parties, as well as full transparency.


    Stand-ups where people share what they are working on are a pretty standard way
    of promoting communication and transparency. However, be careful, because daily
    stand-ups can get irritating because of the slow nature of a data scientist’s
    work. It isn’t incremental, and the last thing you want is to have a bunch of
    introverts feeling uncomfortable because they have no results to show. This is
    why weekly stand-ups might be a better option.


    You also should consider mentorship programs for new data scientists. Junior data
    scientists can be very enthusiastic, and sometimes you can find amazing talent
    from some good universities who might be a bit inexperienced. This might be their
    first real job, so it’s a good idea to have a senior data scientist educate them
    and mentor them, which will allow them to become great.


    # CASE STUDY: BOOKING.COM DOES DATA SCIENCE THE RIGHT WAY


    Booking.com is a company that does data science right. They sell over 1.5 million
    hotel rooms every 24 hours, and millions of people browse the site constantly,
    which means they have massive amounts of data. They are continuously using that
    data to improve their services and develop new ones.


    Booking.com has over 120 data scientists with different profiles, backgrounds,
    and working preferences. The culture is clearly data driven and has been developed
    in such a way that the company offers the perfect venue for data scientists. From
    challenging them with different projects that require them to constantly learn
    new things to helping with their education through workshops and presentations
    held by their peers, there is little opportunity for a data scientist to get bored
    at Booking.com.


    The structure is also one you want to emulate as it’s embedded, like we previously
    discussed. Their data scientists are an integral part of the business. They are
    part of teams that include developers, product owners, and various other specialists.
    The team is formed in such a way that they can take an idea from concept to the
    implementation stage.


    On a daily basis, they follow what they call the booking agile essentials recipe,
    which means they have daily stand-ups, backlog, retrospectives, KPIs and objectives
    and key results, team purpose, and more. This approach allows their teams to move
    forward or to fail and learn from their failure as quickly as possible.


    For this reason, data scientists at Booking.com are expected to have excellent
    communication skills as well as commercial awareness. In other words, technical
    skills aren’t enough.


    However, data scientists are happy at Booking.com because they are constantly
    working on new projects and learning new things. They don’t have to wait around
    for data to show up, their advice and recommendations are taken into account,
    they are allowed to take new approaches, and they are treated like the data scientists
    they are.


    So, you could do worse than to emulate the Booking.com model in terms of creating
    a data-centric culture. Of course, you don’t have to do everything they do. It
    is a huge company after all. Maybe, in your case, you don’t care so much about
    communication, but are more interested in the technical aspect.


    However, if you want to create an embedded culture, then definitely look into
    how Booking.com is doing it.


