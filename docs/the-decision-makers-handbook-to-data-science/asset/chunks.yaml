- fmt: '# The Data Science Process


    So, if I ask the question


    > *What is data science about?*


    I’ll receive different answers because, no surprise, different people have different
    opinions. For example, the boss might think that data science is actually a magical
    money machine that can print money whenever he or she wants it to.


    To customers, data science might make you seem like a wizard or a telepath or
    psychic because you can tell so much about them and solve so many of their problems.


    Software engineers think that data science is just importing some stuff from libraries
    and running a few functions, because of course no one is quite as awesome as they
    are.


    In reality, though, data science is like an orchestra made up of different elements,
    including infrastructure, software, data sources, and statistics.


    From a pragmatic point of view, there are five steps of a data science life cycle:


    1. Collecting data

    2. Organizing data

    3. Analyzing data

    4. Interpreting data

    5. Communicating findings from data


    We already covered collection and organization of data in the previous chapters;
    therefore, we’re going to look at steps 3–5 in this chapter and we’ll cover the
    topics in enough depth so that you understand how it all works.


    Keep in mind, though, that data scientists are often called in from step 3 to
    step 5, because the collection and organization has already been done. Now, that
    doesn’t mean it’s always been done properly, but it has been done.


    ## Defining the Data Science Process


    The data science process has four steps, namely:


    * Step 1—Defining the problem

    * Step 2—Choosing the right data

    * Step 3—Solving the problem

    * Step 4—Creating value through actionable insights


    The process involves two main actors, namely, the `domain expert` and the `data
    scientist`.


    The `domain expert` is the person who owns the problem. It could be the business
    owner who hired the data scientist, but it could also be the head of a department
    that has to work with the data scientist. In an academic setting, it could be
    a researcher.


    Essentially, the `domain expert` is the person who is responsible for solving
    the problem and who has to report either to himself (as a business owner or entrepreneur)
    or to upper management. It’s also the person who knows all the specifics of the
    domain.


    Thus, the first step, namely, defining the problem, lies with the `domain expert`.
    Subsequently, choosing the right data is the responsibility of both actors, while
    the third step falls to the `data scientist`. Finally, creating value involves
    both actors working together.


    So, let’s take a closer look at all of these.


    ### Step 1: Defining the Problem


    The `domain expert` is in charge of defining the problem because they are the
    ones who understand the domain better than anyone else. The issue is that `domain
    expert`s often don’t know data science, which can create problems.


    And that’s exactly what this section is about. It’s about understanding why you
    need data science, how you can use it, and under what circumstances it becomes
    relevant.


    If you have a `data scientist` in your company who has been working with you for
    a long time, they likely have a good knowledge of the domain. This means they
    can define their own problems.


    However, in most cases, it’s the `domain expert` who lays out the problem. They
    might want to forecast sales for the month, or they might say that the recommender
    system needs to be improved, for example.


    Once the problem has been defined, it’s time to move on to the next step.


    ### Step 2: Choosing the Right Data


    The `domain expert` needs to understand `data collection` and `management`, which
    we discussed in the previous section. They are responsible for making sure the
    principles on data collection and management we covered previously are being followed
    so that the data is as clean as possible, the standards are documented, and the
    data is easy to use.


    The `data scientist`, on the other hand, needs to understand the domain and any
    peculiarities it might have. We touched on this in the data management section
    too.


    So, each domain has its own set of pros and cons. Thus, in some cases, you can
    have very noisy data, like if you work with sensor data. In other cases, data
    might be inaccurate, such as the data collected through polling and surveys as
    people might not be completely honest with their answers. And the `data scientist`
    needs to know these things.


    ### Step 3: Solving the Problem


    The `domain expert`’s main contribution to this step is ensuring they hire the
    right person, which we will discuss in the next section of the book. They’re also
    responsible for ensuring that the company has the right culture, which we will
    cover in the last chapter of the book.


    The actual solving of the problem is the `data scientist`’s job, and there is
    little that the `domain expert` can do other than provide support.


    ### Step 4: Creating Value Through Actionable Insights


    This step is the responsibility of both the `data scientist` and the `domain expert`.
    It requires a good collaboration between the two parties because the `domain expert`
    needs to know how to work with the `data scientist` and also to understand what
    the result of the work entails.


    At the same time, the `data scientist` also needs to understand by now some of
    the issues of the business and of the particular field.


    At this point, it really pays off if the person who is the `domain expert`, such
    as the business owner, the manager, or the decision-maker, has a good understanding
    of data science.


    It also helps build a `data science culture`, but we’ll cover this more in depth
    in the final section. The right culture can make it easier for the `data scientist`
    to learn the peculiarities of the field and the issues of the business. This leads
    to a `data scientist` who can take a more creative approach to developing solutions
    to help the business.


    ## Solving a Problem Using the Data Science Process


    We’re going to look at an example. It’s a very simple issue, but it is the best
    way to show how a problem can be solved using the data science process.


    ### Step 1: Defining the Problem


    So, the first step is to define the problem. Take something you find interesting
    at work. You could even decide to focus on something that bothers you.


    I’m going to choose a trivial example, but one that most people can relate to,
    namely, meetings that consistently start late.


    The first thing to do is to frame the problem. A great trick is to turn the statement
    of the problem into a question and write it down. So, in our case, it would be


    *Meetings always seem to start late. Is that really true?*


    You want to take this approach because while most data scientists like concrete
    terms, most non-data scientists tend to think in terms that are vaguer. However,
    models, be they machine learning, statistical, or any other type, have a narrow
    focus and can answer one, two, or three specific questions. So, when you write
    down the problem as a question, it helps the `data scientist` develop a better
    model to reach the solution.


    ### Step 2: Choosing the Right Data


    This step will have two parts, namely, Part A, where you think about the data,
    and Part B, where you collect the data.'
