  trans: '

    # 人工智能与自动化


    人工智能在社会中最显著的影响之一将体现在自动化领域。


    麦肯锡公司^(⁹²)的报告《生成式人工智能与美国未来的工作》描绘了一幅未来图景：人工智能将在各行各业的任务自动化中发挥重要作用。该报告预测，到 2030 年，人工智能可自动化美国
    45%的工作活动，在某些行业甚至可达 80%。


    这种自动化有可能提高生产力和效率，但也引发了对岗位替代以及劳动者需要再培训与技能提升的担忧。基辛格等人（2023 年）认为，人工智能带来的颠覆应与创造就业机会相平衡。他们相信，其直接影响更可能体现在自动化工作内的任务，而非取代整个岗位，并且预计它还将创造新的职业类型。与那些可能被逐步淘汰的现有岗位相比，这些新兴岗位的性质更难预测。


    虽然人工智能有望降低各种商品和服务的成本，从而有可能提高整体生活水平，但基辛格等人（2023 年）认为，应将人工智能视为一种不同的财富创造机制。因此，我们既可以将人工智能视为赋能者，也可以将其视为一项真正具有变革性的技术。


    # 人工智能在教育领域的个性化与创造性革命


    人工智能正在彻底改变教育，它提供个性化教学，培养创造力，并重新定义传统学习方式。由人工智能驱动的工具能够帮助教育工作者打造引人入胜的体验，并让学生发现自身的创造能力。这些工具会根据学生的个体需求调整教学，从而提高学习效果和自信心（Liu
    等人，2022；McKinsey & Company，2022；Ng，2023）。


    人工智能还在各学科培养学生的创造力。它能生成创意提示、提供艺术反馈，并协助创作原创艺术、音乐和文学作品。这项技术有助于克服创作瓶颈、鼓励风格实验，并拓展创造性的表达方式（Obermeyer
    等人，2019）。此外，人工智能促进协作学习，提供项目合作、想法分享和相互学习的平台（世界经济论坛，2022）。人工智能工具可以分配任务、跟踪进度并提供反馈，从而加强团队协作并帮助实现目标。


    更进一步，人工智能将游戏化引入教育，使学习更具吸引力和互动性。基于游戏的平台会根据学生的表现调整挑战难度，并提供激励性奖励和反馈（Obermeyer 等人，2019；世界经济论坛，2022）。最后，人工智能弥合了由地理和语言障碍造成的教育差距。翻译工具使学生能够以母语获取资料，而虚拟导师则在偏远或服务不足的地区提供个性化支持（Ng，2023；世界经济论坛，2022）。


    # 人工智能与创造力


    自从生成对抗网络出现以来，人工智能与创造力的领域呈指数级增长。人工智能驱动的工具可以协助艺术家、作家和作曲家产生新的想法、探索创作可能性，并创作出创新作品。


    2018 年 10 月，纽约市佳士得拍卖行成为首家拍卖使用人工智能创作的艺术品的主要拍卖行。这件名为《埃德蒙·贝拉米肖像》（图 14-1）的艺术品由一家名为
    Obvious 的巴黎艺术团体创作。该人工智能使用了一个包含 17、18 和 19 世纪 15000 幅肖像画的数据集来创作这幅作品。


    ![](img/490014_3_En_14_Fig1_HTML.jpg)


    一幅细节模糊的男子肖像画。


    图 14-1


    人工智能生成的埃德蒙·德·贝拉米肖像


    该作品以 43.25 万美元的落槌价成交，是其预售估价 7000 至 10000 美元的 40 多倍。此次拍卖是人工智能艺术的一个重要里程碑，标志着人工智能作为一种合法艺术形式正被日益接受。


    如前所述，人工智能可以帮助作家克服写作瓶颈，为情节发展、角色创作和对话提供建议。由人工智能驱动的写作助手能够分析大量文本数据以识别模式和关系，帮助作家产生新想法并探索新的创作方向。通过使用
    ChatGPT 和 Google Bard 等工具，这已经成为现实。然而，这也引发了关于整个编剧行业未来的问题，这些问题在 2023 年的好莱坞罢工中扮演了重要角色。^(⁹³)


    人工智能也正在影响音乐行业，为音乐家提供作曲、制作和个性化方面的先进工具。像 MuseNet、Boomy、Humming.ai 和 AIVA 这样的人工智能驱动应用正处于这场革命的前沿，促进了原创作品和新形式音乐表达的产生。这些工具擅长根据流派或情绪等参数生成音乐，正在重塑艺术家创作和观众体验音乐的方式（AIVA,
    2023；MuseNet, 2023；Boomy, 2023；Humming.ai, 2023）。


    人工智能在音乐中的作用远不止作曲。它有助于探索多样化的声音景观，帮助艺术家尝试和声、节奏和风格。这种创新催生了诸如人工智能生成音乐和算法音乐等新颖流派，反映了人工智能在创意领域日益扩大的影响力（AI-Generated
    Music, 2023；Algorithmic Music, 2023）。


    在制作和表演方面，人工智能辅助声音设计、混音、母带处理，甚至在现场演出中提供实时伴奏和自适应反馈。这些由人工智能驱动的工具提升了音乐表演的质量和动态特性（Bostrom
    & Yudkowsky, 2016）。


    此外，人工智能极大地个性化了个人的音乐体验。通过推荐引擎，人工智能分析用户偏好以推荐新音乐，促进发现和更广泛的音乐探索。它还能促成艺术家之间的合作，促进共享项目和思想交流（Mittelstadt,
    Wachter, & Floridi, 2019）。


    总之，人工智能不仅是音乐领域任务自动化的工具，更是创造力和创新的催化剂。随着人工智能的发展，它有望加深对音乐创作、表演和分享的影响，彻底改变我们与这种艺术形式互动和欣赏它的方式。


    # 人工智能变革医疗：诊断、治疗与个性化护理


    世界经济论坛的报告《重新定义医疗健康的十大新兴技术》强调了人工智能在医疗保健领域巨大的变革潜力（世界经济论坛，2020）。人工智能算法能够以更高的精度分析医学影像，辅助诊断疾病，制定个性化治疗方案，甚至执行复杂的外科手术。


    这些进步可以带来疾病的早期发现、更有效的治疗以及改善的患者预后。然而，确保基于人工智能的医疗系统在实施过程中保持透明度、公平性并充分考虑伦理因素至关重要。从诊断、治疗到个性化护理和患者监测，人工智能算法即将彻底改变医疗保健的各个方面（Topol,
    2019）。

    '
- fmt: '### Enhancing Diagnosis and Treatment Accuracy


    `AI` algorithms have demonstrated remarkable capabilities in analyzing medical
    images, such as X-rays, CT scans, and MRIs, with greater accuracy and speed compared
    to traditional human-based methods (Esteva et al., 2019). This enhanced ability
    to interpret medical images can lead to earlier and more accurate diagnoses of
    diseases, allowing for timely interventions and improved patient outcomes (Gulshan
    et al., 2016).


    `AI` is also being applied to develop personalized treatment plans by analyzing
    vast amounts of patient data, including medical history, genetic information,
    and lifestyle factors (Weng et al., 2020). This data-driven approach enables healthcare
    providers to tailor treatment strategies to individual patient needs, potentially
    leading to more effective treatments and reduced side effects (Janssens et al.,
    2017).


    ### Revolutionizing Surgical Procedures


    `AI`-powered robotic surgical systems are emerging as game changers in the field
    of surgery (Cattaneo et al., 2020). These systems offer enhanced precision, dexterity,
    and control, enabling surgeons to perform complex procedures with greater accuracy
    and minimal invasiveness (Van den Brink et al., 2018). This can lead to shorter
    recovery times, reduced complications, and improved patient satisfaction (Azami
    et al., 2021).


    ### Personalized Care and Patient Monitoring


    `AI` is enabling the development of personalized care management systems that
    can provide tailored support to patients throughout their healthcare journey (Amin
    et al., 2020). These systems can monitor patient health data, provide medication
    reminders, and offer personalized educational resources, empowering patients to
    take an active role in managing their health (Chowdhury et al., 2017).


    `AI`-powered patient monitoring systems are also transforming the way healthcare
    providers track and manage patient conditions (De Vos & Bos, 2021). These systems
    can continuously collect and analyze patient data, providing real-time insights
    into their health status (Kourou et al., 2019). This enables early detection of
    potential complications, allowing for prompt interventions and improved patient
    outcomes (Hodge et al., 2019).


    Artificial intelligence (`AI`) is rapidly transforming the manufacturing industry,
    bringing about a new era of automation, efficiency, and innovation. `AI` is being
    applied in a wide range of manufacturing processes, from product design and development
    to production and supply chain management.


    ## Advancing Manufacturing Through AI: A Comprehensive Insight


    Artificial Intelligence (`AI`) is rapidly transforming the manufacturing sector,
    offering innovative solutions and efficiencies in various aspects of production.
    From product design to quality control, `AI`’s capabilities are reshaping how
    manufacturers approach production, maintenance, and supply chain management.


    `AI`’s integration into the manufacturing sector is a clear indicator of the technology’s
    potential to revolutionize industries. By enhancing product design, predictive
    maintenance, quality control, and supply chain management, `AI` is not only improving
    efficiencies but also driving innovation.


    Padovano and Veneziani’s study on `AI` in digital manufacturing highlights how
    these technological advancements are reshaping the industry, leading to more efficient
    and creative design processes [Padovano & Veneziani, 2018].


    One of the most important applications in this is predictive maintenance. Manufacturers
    are increasingly using `AI` algorithms to analyze data from machinery sensors,
    allowing for the early detection of potential issues. This predictive approach
    to maintenance helps in preempting equipment failures, ensuring timely interventions.
    As a result, there’s a substantial reduction in unplanned downtime and a boost
    in production efficiency.


    Wu and colleagues provide an extensive review of the literature on predictive
    maintenance, underscoring the significant role `AI` plays in maintaining and extending
    the life of rotating machinery [Wu et al., 2015].


    `AI` is also being used in the realm of quality control. The research by Lu et
    al. delves into how deep learning, a subset of `AI`, is being applied for defect
    detection and classification, marking a significant advancement in maintaining
    quality standards in manufacturing [Lu et al., 2019].


    `AI` is also making a substantial impact on supply chain management. It’s automating
    key tasks such as demand forecasting, inventory management, and logistics planning.
    By analyzing historical sales data, market trends, and real-time demand signals,
    `AI` algorithms can optimize supply chain operations. This leads to a reduction
    in costs and an improvement in customer satisfaction. Ivanov and colleagues discuss
    the impact of digital technologies, including `AI`, on supply chain management,
    illustrating how these advancements are leading to more efficient and responsive
    supply chains [Ivanov et al., 2019].


    ## The Promise and Potential of AGI


    Artificial General Intelligence (`AGI`), often conceptualized as “strong AI,”
    stands at the crossroads of philosophical inquiry and technological innovation.
    This form of `AI`, aspiring to perform a wide range of intellectual tasks akin
    to human cognition, promises a paradigm shift in our interaction with technology.
    `AGI`’s potential extends beyond mere computational efficiency; it offers a vision
    of machines that can understand, learn, and create, akin to human intelligence.


    While there is still a debate as to whether such machines will be conscious or
    not, no one can debate the fact that such types of intelligence will be, in many
    ways, indistinguishable to human cognition.


    Current advancements in machine learning, particularly in transformers and large
    language models (`LLMs`), have already shown remarkable capabilities in processing
    and understanding natural language. While they cannot yet be considered as `AGI`,
    they do demonstrate some of the potential; of what’s coming next.


    A technology that can be a game changer in this area is quantum computing.


    The role of quantum computing in the development of `AGI` will be pivotal. Quantum
    computers, with their ability to handle immense amounts of data and perform complex
    calculations at speeds unattainable by classical computers, present a groundbreaking
    tool in the pursuit of `AGI`. The integration of quantum computing could provide
    the necessary computational power to process the vast and complex datasets required
    for developing `AGI`, pushing the boundaries of what’s currently achievable with
    traditional computing methods.


    The synergy of existing technologies, like `LLMs`, with quantum computing could
    be the key to unlocking `AGI`. Quantum computing’s ability to rapidly process
    and analyze large-scale data could enable these `AI` systems to learn and adapt
    at an unprecedented pace, potentially bridging the gap between narrow `AI` and
    `AGI`.'
