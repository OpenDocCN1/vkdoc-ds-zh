- fmt: '### Code Hacking Skills


    Okay, so when I say code hacking skills, I’m not talking about breaking into NASA,
    but the fact is that a data scientist needs to have excellent computer knowledge
    and decent programming skills. This doesn’t mean that they need a computer science
    degree as there are plenty of excellent “hackers” out there who have never taken
    a single computer course in their life.


    However, a data scientist needs to be able to think algorithmically, understand
    vectorized operations, and work with text files at the command line. Without these
    skills, it’s not possible to be a data scientist. In most cases, the actual quality
    of the code that data scientists produce does not have to be production level.
    That’s why we are using the term code hacking, instead of software engineering,
    as the latter means the code should be of very high standard. Data scientists
    use the code as a tool in order to reach solutions to problems. However, it won’t
    hurt if you find a data scientist who might also have very good coding skills.


    ### Mathematical and Statistics Knowledge


    Once those hacking skills have been used to get the data into shape, it’s time
    to analyze it and extract insights. For this, a data scientist needs to have math
    and statistics knowledge so they can apply the right methods and models.


    Again, a data scientist doesn’t need a PhD in statistics to be effective at their
    job, but they must know how to develop and work with mathematical and statistical
    models, including how to interpret the results.


    ### Domain Knowledge


    Domain knowledge is important for a data scientist: the need to understand the
    subject matter and not just the technical aspects of it. While this is not a hard
    requirement, lack of domain knowledge can cause all sorts of issues (we’ve already
    seen some examples, and more will follow). Domain expertise allows data scientists
    to apply the other skills to the data in such a way that they reach the desired
    goal. Data scientists have to teach themselves the peculiarities of a domain,
    every time they move to solving problems in a field they’ve not encountered before.


    ### Two Is Not Enough


    Only having two of these skills/knowledge is insufficient. A capable hacker with
    knowledge of math and statistics but no substantive expertise would be ideally
    suited for machine learning. However, their skills won’t make them a data scientist.


    Likewise, if someone has substantive expertise and knows math and statistics,
    then they are probably looking at traditional research. This intersection is basically
    what much of academia is made up of—though it should be noted that young researchers
    are choosing to evolve and learn more about tech. However, without those hacking
    skills, they will never be a data scientist.


    The real problem arises when you have someone who is a skilled hacker and has
    substantive expertise. It creates a dangerous person because they know just enough
    to create what seems to be a legitimate analysis but they have no clue how they
    reached their conclusions or what they’ve actually created.


    Essentially, these are people who have the skills to apply analytics on a problem,
    but lack the theoretical foundation to make sure they are doing the right thing.
    So, they might run a statistical test, but could be making erroneous assumptions.
    However, since they believe they are basing their decisions on data, they have
    a false sense of confidence which can lead to serious problems.


    So, remember, a competent data scientist will be a skilled hacker, have math and
    statistics knowledge, and also have substantive expertise in your chosen field.


    ## What Motivates a Data Scientist?


    Working effectively with someone means understanding who they are and what motivates
    them. Unfortunately, it can be difficult for people to understand data scientists,
    precisely because they have such a wide range of skills that they can’t be neatly
    slotted in a box.


    A data scientist isn’t just someone who knows math and statistics and can work
    a computer like a pro. These are people who also have great communication and
    visualization skills, enabling them to communicate well with senior management
    as well as to tell a story effectively. They are also passionate about the business
    and curious about data. They constantly want to learn more and they want to solve
    problems and influence things without the authority that might usually accompany
    this role. They are strategic, proactive, creative, and innovative people who
    like to collaborate with others.


    They definitely love to be mentally stimulated, and solving problems is their
    bread and butter. And they have an innate curiosity and drive to grow, which means
    they love learning new things and acquiring new skills.


    The fact is that learning new skills is an integral component of today’s market.
    It’s the Red Queen’s race or hypothesis in action, which essentially says that
    an organism must constantly adapt, evolve, and proliferate just to survive.


    ## What Will Disengage a Data Scientist?


    If you give your data scientist a lot of repetitive work, you are going to end
    up with a very disengaged person on your hands. So, if they have to spend ridiculous
    amounts of time cleaning up data or doing anything else that is the equivalent
    of counting grains of sand, you are going to be dealing with someone who really
    doesn’t want to be there. And the results will suffer.


    Likewise, if they get bored because the problems you are asking them to solve
    are too simple, you aren’t going to win any points. Of course, sometimes simple
    problems need to be solved, but if you are going to make the leap and hire a data
    scientist, make sure to take full advantage of their capabilities. Otherwise,
    it would be like hiring a Michelin star chef to make you a grilled cheese sandwich.


    The peril is that the chef, out of boredom, will go off on a tangent and serve
    you a grilled cheese sandwich that’s been deconstructed and reconstructed until
    it has little in common with that simple sandwich that you wanted.


    Also, another problem stems from communication problems. Friction in communication
    often arises when upper management doesn’t understand what the data scientist
    is doing.


    A simple example is that the data scientist ends up doing a lot of data wrangling,
    which is utterly boring, because of bad communication with the developer in terms
    of how the data should have been stored.


    To return to our Michelin star chef analogy, Heston Blumenthal is a world-renowned
    chef and his main “thing” is molecular gastronomy. He uses a range of tools and
    ingredients that are not always the norm in a kitchen. Say you hire him to cater
    for an event and he tells you what he needs, but because you don’t understand
    his process, you just stock the kitchen with all the usual tools and ingredients.


    When he arrives to do the cooking, he ends up having to cook a traditional meal
    that is completely boring for him, resulting in food that might be decent but
    nowhere near the quality of what he could have done.


    ## When a Data Scientist Is Looking for a Job


    Right now it’s a seller’s market for good data scientists above junior level where
    the data scientists are the sellers—you know, seeing as they sell their skills
    and expertise. The fact is that there is a high demand for skilled people but
    the supply is nowhere near sufficient to meet it.


    For example, an average data scientist in London will receive between one and
    ten recruiter messages or calls every week. This means they are in a position
    of power when choosing what projects to work on.


    So, to improve your chances of hiring the right person, you need to understand
    what data scientists want.'
