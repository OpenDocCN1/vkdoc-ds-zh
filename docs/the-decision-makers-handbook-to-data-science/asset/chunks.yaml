    using an external provider, such as OPTA^([^(38)](#fn38)) or STATS.^([^(39)](#fn39))


    While sports data is structured and relatively easy to interpret, the main problem
    is that it is entered manually. In other words, people sit and watch the game
    and then record the data. This, of course, can result in mistakes and often does
    as humans are prone to error.


    ### Social Media


    Last but not least, we have social media.^([^(40)](#fn40)) As you can imagine,
    this is data sourced from platforms like Facebook, Twitter, Instagram, Pinterest,
    and so on.


    The advantage to social media is that data collection is automated. All you have
    to do, basically, is plug in an API and off you go. However, the problem arises
    when you try to make sense of all the data you collected. It’s completely unstructured
    and really, really noisy and messy.


    If you’ve ever worked with any form of social media data, like Facebook posts,
    tweets, and even blog comments, you’ve likely seen a wide range of issues. You
    have grammar issues, different languages, special characters and emoticons, and
    so on. As you can imagine, this can make it very difficult to wrangle the data
    into something useful and easily analyzed. It definitely takes a lot of time to
    do so.


    ## Data Management Practices


    Now, let’s take a closer look at data management. There are both good and bad
    practices in data collection and storage, and we’ll be looking at some of these.


    However, it’s important to note that we aren’t going to be looking at good and
    bad practices from a technical standpoint as this isn’t a book about data engineering.
    We’ll be analyzing these practices from a business viewpoint, and once we’re done,
    we’ll also take a look at some examples of bad practices and good practices.


    ### Good Practices for Data Collection and Organization


    Good practices in data collection and organization mainly revolve around having
    an objective before you start, being aware of how data collection affects the
    rest of your business, and creating a standard. Let’s examine each one of these
    elements.


    #### Establish a Goal First


    When it comes to data collection and organization from a business perspective,
    it is essential to first establish at least one goal or have one question to answer.
    Otherwise, you will end up collecting data that you might not need or the wrong
    data.


    So, before you do anything, you need to establish an objective. Before you ask,
    “let’s collect some data because that’s what everyone seems to be doing” is not
    an objective. On the other hand, “why do 35% of our customers not go through with
    the purchases in their cart?” is a good objective/question to start with.


    #### Awareness of How Data Collection Affects the Rest of Your Business


    It’s also essential to be aware of how data collection interacts with other parts
    of the business, such as the user interface. We’ll be talking more about this
    later.


    #### Establish a Data Standard


    You also want to use a data standard and document everything that is happening.
    By creating a data standard everyone can easily understand, new project entrants
    can quickly get up to speed, saving you significant amounts of time and resources
    in the long run.


    ### Bad Practices for Data Collection and Organization


    Bad practices are pretty much the exact opposite of the good practices I described
    earlier. Let’s take a closer look at each.


    #### No Clear Objective


    Having no clear objective from the start means you just collect data for the sake
    of it with no clear direction and take the “we’ll store the data now and think
    about it later” approach. This is pretty much a waste of time and resources.


    #### Ignoring the Connection Between Data Collection and the Rest of Your Business


    The next issue is not taking into account the connection between data and business.
    You might think that the data won’t affect the business at all, but this is completely
    erroneous. For example, if you want to build a better recommender system and to
    collect data to this end, you might have to completely rebuild the UI. Nothing
    in your business exists in a vacuum, including and especially data collection.


    #### No Documentation or Data Standard


    Finally, the most common bad practice is having no documentation or data standard
    in place, which makes it difficult for anyone new to the project to understand
    what’s going on.


    ## Examples of Bad Practices or What You Shouldn’t Do!


    In this first example, we’ll take a look at how lacking a clear objective can
    derail your efforts and cost you money.


    ### Lack of Clear Objective


    Let’s take a B2C app that helps users find restaurants in their country or city
    as an example. You run and manage this app and you decide to collect data from
    users. You have no idea what you’re going to use the data for, but you figure
    that it will be useful at some point in the future.


    You decide to register the information in a NoSQL database in JSON format. You
    collect their name and age, like {“name”: John, “age”: 23}. However, you decide
    to collect the data generated by user interactions in the same format, such as
    {{“21-10-2017”:{“opened_the_app”:“yes”, “paid_through_the_app”:”yes”}}}.


    Thus, you now have their name and age, and you also have their app interactions,
    like when they open the app, scroll through it, make a selection, and so on.


    One day, a year after you launched the B2C app, you decide you should find a data
    scientist to help you with the data. So, you hand over the data you’ve collected
    to the data scientist and ask them to extract general insights.


    You might be wondering what’s wrong with this approach—it doesn’t seem to be problematic,
    does it? Well, there are actually quite a few issues.


    This is one of the most frustrating situations to be in when someone is a data
    scientist. Why is that? Well, first off, you haven’t optimized the data to achieve
    any particular goal, which means that data scientist will waste a lot of time
    trying to figure out what they can do with the data and how they can do it.


    The data wrangling will also take a really, really long time. And this will be
    time that costs you money, whether you are outsourcing to an independent data
    scientist or have hired a full-time person for the position.


    Finally, you opted to use NoSQL as the format for data storage, and this might
    not necessarily be the best option depending on what you want to do with the data.
    So, this will make it even harder for the data scientist to wrangle the data and
    it will certainly take a lot longer.'
  trans: '

    ### 零售业


    接着我们来看零售业，这里有销售数据——本质上是从交易中收集的数据——以及客户数据。


    其主要优势在于，与之前提到的销售数据类似，这些数据非常直接且易于解读。例如，你可以得到销售数量、交易金额等信息。


    然而，处理零售数据时需要考虑法律因素。对于零售商而言，数据越多越好。但要将数据精确到个人层面却可能很困难。这在很大程度上是由于法律框架限制了零售商使用所收集数据的方式。


    ### 金融业


    在金融领域，有股票市场数据。这可能是数据收集的最佳领域，因为其过程是自动化的，数据干净整洁，且获取速度快。这是少数几个几乎不可能发现数据收集问题的领域之一。


    ### 体育行业


    接下来是体育领域收集的数据，这些可能是通过外部供应商（例如`OPTA`或`STATS`）获取的运动员数据。


    虽然体育数据是结构化的，且相对容易解读，但主要问题在于数据是手动输入的。换句话说，是由人员观看比赛并记录数据。这当然可能导致错误，而且由于人类容易犯错，这种情况经常发生。


    ### 社交媒体


    最后但同样重要的一点是社交媒体。正如你所想，这是来自`Facebook`、`Twitter`、`Instagram`、`Pinterest`等平台的数据。


    社交媒体的优势在于数据收集是自动化的。基本上，你只需要接入一个`API`就可以开始了。然而，问题出现在你试图理解所收集的所有数据时。这些数据完全是**非结构化**的，而且非常、非常杂乱和混乱。


    如果你曾经处理过任何一种社交媒体数据，比如`Facebook`帖子、推文，甚至博客评论，你很可能见过各种各样的问题。比如语法问题、不同语言、特殊字符和表情符号等等。正如你所料，这使得将数据整理成有用且易于分析的形式变得非常困难。这无疑需要花费大量时间。


    ## 数据管理实践


    现在，让我们更仔细地看看数据管理。在数据收集和存储方面，既有好的实践，也有不好的实践，我们将探讨其中的一些。


    然而，需要注意的是，我们不会从技术角度来审视好与坏的实践，因为这不是一本关于数据工程的书。我们将从商业视角来分析这些实践，完成后，我们还会看一些坏实践和好实践的例子。


    ### 数据收集与组织的好实践


    数据收集与组织的好实践主要围绕着：在开始前设定目标、意识到数据收集如何影响业务的其余部分，以及创建标准。让我们逐一审视这些要素。


    #### 首先确立目标


    从商业角度来看，在进行数据收集和组织时，首先至少确立一个目标或有一个需要回答的问题至关重要。否则，你最终可能会收集到不需要的数据或错误的数据。


    因此，在你做任何事情之前，需要确立一个目标。在你开始之前，问一句“我们收集些数据吧，因为好像大家都这么做”，这并不能算是一个目标。另一方面，“为什么我们 35%的客户最终没有完成购物车里的购买？”才是一个好的起点目标/问题。


    #### 意识到数据收集如何影响业务的其余部分


    同样重要的是，要意识到数据收集如何与业务的其他部分（如用户界面）相互影响。我们稍后会对此进行更多讨论。


    #### 建立数据标准


    你还应该使用数据标准，并记录发生的所有事情。通过建立一个每个人都能轻松理解的数据标准，新加入项目的人员可以快速上手，从长远来看，这将为你节省大量的时间和资源。


    ### 数据收集与组织的坏实践


    坏实践基本上与我之前描述的好实践完全相反。让我们更仔细地逐一了解。


    #### 没有清晰的目标


    从一开始就没有清晰的目标意味着你只是为了收集数据而收集，没有明确方向，并采取“先把数据存起来，以后再说”的方法。这基本上是在浪费时间和资源。


    #### 忽略数据收集与业务其余部分的联系


    下一个问题是未考虑数据与业务之间的联系。你可能认为数据完全不会影响业务，但这完全是错误的。例如，如果你想构建一个更好的推荐系统并为此收集数据，你可能需要完全重建用户界面。你业务中的任何事物都不是孤立存在的，数据收集尤其如此。


    #### 没有文档或数据标准


    最后，最常见的坏实践是没有建立文档或数据标准，这使得任何新加入项目的人都难以理解当前状况。


    ## 坏实践示例（或你不该做的事！）


    在第一个示例中，我们将看看缺乏清晰目标如何破坏你的努力并让你花费金钱。


    ### 缺乏清晰目标


    让我们以一款帮助用户在其国家或城市寻找餐馆的 B2C 应用为例。你运营并管理这款应用，并决定从用户那里收集数据。你不知道要用这些数据做什么，但你认为将来某个时候它们会派上用场。


    你决定以 JSON 格式将信息存储在 NoSQL 数据库中。你收集他们的姓名和年龄，比如`{"name": John, "age": 23}`。然而，你决定用相同的格式收集用户交互产生的数据，例如`{{"21-10-2017":{"opened_the_app":"yes",
    "paid_through_the_app":"yes"}}}`。


    因此，你得到了他们的姓名和年龄，还有他们的应用交互数据，比如他们何时打开应用、浏览应用、做出选择等等。


    一天，在你推出这款 B2C 应用一年后，你决定应该找一位数据科学家来帮你处理这些数据。于是，你把收集到的数据交给数据科学家，并要求他们提取总体见解。


    你可能会想这种做法有什么问题——看起来没什么大碍，不是吗？实际上，问题不少。


    对于数据科学家来说，这是最令人沮丧的情况之一。为什么呢？首先，你没有为了让数据实现任何特定目标而对其进行优化，这意味着数据科学家会浪费大量时间试图弄清楚他们能用这些数据做什么以及如何做。


    数据整理也会花费非常、非常长的时间。无论你是外包给独立数据科学家，还是全职聘请了相关人员，这段时间都在消耗你的资金。


    最后，你选择使用 NoSQL 作为数据存储格式，但这可能未必是最佳选择，具体取决于你想用数据做什么。这将使数据科学家更难整理这些数据，而且无疑会耗费更长时间。

    '
- fmt: '### But I Have an Objective!


    Okay, so let’s take the same B2C app from the previous example and assume you
    have an objective. That should make it easier to wrangle all that data into something
    useful, right? Well, not really.


    Let’s say that your goal is to build a recommender system so you hand the data
    over to the data scientist who should be pleased that you have a specific goal
    you want to achieve. What’s wrong now?


    While it’s certainly a little better than the previous example because you do
    have an objective you want to achieve, issues will still arise. First of all,
    the data might not be in a format that is optimized to develop a recommender system.
    This means that the data scientist will have to try to wrangle the data into submission
    to get it in a format that is usable.


    Furthermore, if you collected data willy-nilly without knowing the objective in
    advance, you might not even have the right variables available. You have `age`,
    `name`, and `interactions`, but what about `gender`? Does `gender` even matter
    in recommending a restaurant? Of course it does.


    Here’s a really extreme example. Say, you have a number of “restaurants” registered
    that provide adult entertainment for women, a.k.a. male strippers. How happy would
    you be if you were searching for a family-friendly restaurant and saw a strip
    club “restaurant” in the list of recommendations? Not exactly overly pleased,
    right?


    And yes, we know that a lot of other variables would be important in the previous
    example, but it just goes to further prove the point that you need to collect
    a lot more data to create an effective recommender system.


    Another variable you’d definitely need is `location`. What’s the point of recommending
    a restaurant in New York to someone who lives in Austin? A recommendation like
    that isn’t of much use, and it will also alienate your users because they’ll quickly
    realize your recommender system is a complete waste of time.


    Yes, a number of these variables can be inferred, but it is very time-consuming
    and prone to errors. So, it would have been a much better option to collect this
    information from the start.


    The conclusion is that a little advanced planning can save you lots of pain in
    the long run. Remember, as with everything, failing to plan is planning to fail
    when it comes to data collection.


    ### CASE STUDY: BAD PRACTICES IN DATA MANAGEMENT


    Some of the things discussed in this chapter might seem too obvious. However,
    the kind of problem you can encounter in your daily professional life might surprise.
    Here’s an example from personal experience—just in case you think stuff like this
    doesn’t happen in the real world.


    A few years ago, a client wanted me to study the difference between male and female
    behavior on their platform. Do males take more actions X than females? Or do females
    consume more than males on the platform?


    This is a relatively straightforward problem which can be answered through simple
    statistical means such as hypothesis tests. However, things were not so simple
    as it would have been expected.


    `Gender` wasn’t a variable that was collected and stored in the database. So,
    the objective of the study was to do understand the differences between genders,
    but this variable was non-existent!


    The solution that was devised was to infer `gender` from the names of the users.
    However, in a multicultural place such as London (where this company was based),
    this is much harder than it sounds. There are so many nationalities living in
    London, which made it impossible to cover all the names by using a simple name
    registry.


    Unfortunately, even after using name registries from multiple countries (ranging
    from the United Kingdom, to the United States, to Nigeria, to India, and more)
    we still had to throw 30% of the data. The reason was that some names could not
    be found in the registries and that some names are used by both males and females.


    Therefore, what should have been a straightforward piece of research suddenly
    turned into something very complicated. And the root of all these causes was the
    lack of planning and the lack of a data strategy. *Failing to plan is planning
    to fail.*


    So, whatever you do, do *not* be like this client. Plan your needs in advance
    so you don’t waste your time and resources or end up with unusable data and skewed
    results.


    ### Examples of Good Practice or What You Should Do!


    This is the perfect time to discuss what you should do. Coming back to our restaurant
    B2C app, it would have made life easier for everyone if the data strategy had
    been established from the beginning.


    So, whatever app or business you run, you need to think in advance of what you
    might need. With the restaurant B2C app, it would have been clear from the start
    that a recommender system would be necessary at some point. And the same holds
    true for most of these apps.


    If you have no idea what you might need in the future, you can just hire a data
    scientist to consult. It might cost you a few hours of consultation, but it’s
    going to save you a significant amount of pain down the line. It’ll also definitely
    be cheaper because setting everything up right from the start will always be cheaper
    than fixing the problems in the future.


    Another issue is with the technology being used. Why choose NoSQL if for certain
    things SQL is much easier to deploy and use, like for user registration data?
    It’s like using a grenade to kill a fly instead of a fly swatter or fly spray.
    It might get the job done but it’s definitely overkill and will create a much
    bigger mess.


    Finally, you need to be aware of all the variables you might need in the future.
    Storage is cheap and it’s better to have more information than you need rather
    than omitting data and not recording variables that might be critical to future
    projects.


    Obviously, you can’t think of everything in advance, but it’s still a good exercise
    to try to do as much as possible.'
