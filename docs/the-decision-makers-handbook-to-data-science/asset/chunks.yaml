- fmt: '# Being Data Informed and Data Driven


    Let’s start off by looking at the difference between being **data informed** and
    **data driven**. When we say that an organization or a person is data informed,
    it means that they are actually using data and the context of data as inputs into
    their conversation and decision-making process.


    So, if you’re using things such as dashboards and KPIs, for example, then you
    are data informed. Nowadays, it’s very easy to be data informed. You can use `Excel`
    or another simple tool and it’s not that difficult to make a few simple charts
    to see what’s happening within your organization.


    Being data driven means taking it to the next level. This is when you start using
    more intelligent algorithms and methods to get the data. Then you transform the
    decision-making process by using the algorithm to make the decision for you or
    by taking the algorithm’s output into account.


    What’s the opposite of this approach? Well, the opposite of being data informed
    or data driven is when you use your guts to make a decision. Or tradition, which
    isn’t much better in terms of accuracy or effectiveness.


    Let’s take a look at a few more examples.


    When you are **data informed**, you might be using a dashboard or `Excel` to collect
    data from multiple sources. You’ve, of course, organized the data appropriately
    as we’ve previously discussed in Chapter [2](#490014_3_En_2_Chapter.xhtml) and
    have made sure to document the process to avoid any issues. The data is also accessible,
    and all your employees know about it and are aware of where it can be located
    and how they can use it.


    Being **data driven** means taking things *a step further*. This is where most
    companies should strive to be in the future. When you get to this point, it means
    that you are allowing the data and data science to help you make potentially disruptive
    decisions. In some cases, they might even completely replace human decision-making.


    So, if you trade using algorithms, for example, then you are data driven. If your
    app or website uses a recommender system, then you are data driven.


    Obviously, being data driven does not mean that an algorithm needs to make every
    decision, but it does mean that you use algorithmic outputs in some parts of the
    organization and in the decision-making process.


    So, why would you want to do this? Being data driven improves efficiency and can
    actually improve decision-making. For example, a recommender system can make better
    decisions than humans as to what the client might want. Also, if you want to sell
    at a massive scale, after a certain point you need to have an algorithm that can
    actually replace humans when recommending items or curating content. This is just
    one example, but there are many others in different industries.


    **WARNING!**


    Eric Peterson calls out a discussion on “What the C-suite should know about analytics”
    from Kishore Swaminathan, Accenture’s chief scientist.^([^(84)](#fn84))


    > `Data` is a double-edged sword. When properly used, it can lead to sound and
    well-informed decisions. When improperly used, the same data can lead not only
    to poor decisions but to poor decisions made with high confidence that, in turn,
    could lead to actions that could be erroneous and expensive.


    In other words, if you use data and data science right, you’ll see improved efficiency
    and better margins. However, if you don’t use data in the right way, then it’s
    very easy to end up in the danger zone in Figure [12-2](#490014_3_En_12_Chapter.xhtml#Fig2),
    repeated from the previous chapter.


    ![](images/490014_3_En_12_Chapter/490014_3_En_12_Fig2_HTML.jpg)


    A Venn diagram of hacking skills, math and statistics, and domain knowledge intersect
    at data science. Hacking skills and math and statistics intersect at machine learning.
    Math and statistics and domain knowledge intersect at traditional research. Hacking
    skills and domain knowledge intersect at danger.


    **Figure 12-2** The data scientist Venn diagram


    The problem is that you end up in a position where you use data in the decision-making
    process, and because you don’t have the right theory, or you didn’t run the right
    tests, the decisions are wrong. However, you’re still fully confident because
    you think you used a scientific approach.


    The easiest way to mitigate this risk is to hire data scientists who cover the
    mathematics and statistics circle in the diagram and will use the right theory
    and processes to do data science. Of course, you need the right culture so that
    the scientists can interact with other divisions and everyone can scrutinize everyone
    else’s work.


    ## Creating a Friendly Environment for Data Scientists


    At the employee level, you want to create a friendly environment for data scientists.
    We’ve already covered a lot of this in the previous chapter on hiring data scientists.
    In essence, you need to remember that data scientists are not only after monetary
    rewards. They also want the right culture, they want to be mentally stimulated,
    and they want to feel that they are making progress, that they are learning new
    things, and that their work has an impact.


    Also, keep in mind that data scientists tend to be introverts. It’s important
    for everyone to work in teams with people they like and the right culture, but
    for these people, it can be even more important than the average person.


    Keeping all this in mind is the key to having happy employees, which translates
    into increased productivity.


    ## Being Data-Centric on an Organizational Level


    An organization is **data-centric** when data science is at the core, which means
    a few different things.


    First of all, it means that you have a 360-degree view of what is happening in
    terms of data and data science. Data science is a separate division, meaning the
    data scientist has more freedom and the license to explore new things, even if
    they are potentially disruptive. They have more responsibility, which can motivate
    them more but also carry a greater degree of risk.


    However, because you have this 360-degree view, you can mitigate this risk. The
    right communication and reporting channels exist between all important divisions,
    especially between the developers and the data scientist, but also between the
    data scientist and the management.


    This is important because you want to make sure that the work the data scientist
    does has an impact and also because you need to be aware of the data that’s being
    collected, how it gets used, and how it’s all implemented, which is very easy
    to get lost in.


    To clarify, when we talk data collection, there are two large issues decision-makers
    need to be aware of.


    One is legal issues, which have become very important nowadays because of the
    GDPR in the EU and the United Kingdom. There are all kinds of issues with data
    privacy, and there’s really no excuse not to be aware of how data is being used
    and how it’s collected.


    Secondly, it’s important to be aware of what the data scientist is researching
    and also to make sure it’s implemented and used in the organization in a positive
    way. So, this is where having effective communication channels becomes very important.
    One department can scrutinize the work of another to make sure that what’s being
    done is relevant to the organization.


    Let’s look at a few examples of how things can go wrong.'
