    # 2. Data Management


    Data management includes all the disciplines involved in working with data and
    treating it as the valuable resource that it is. A more formal definition is provided
    by DAMA International,^([^(34)](#fn34)) which is the professional organization
    for the profession of data management. Thus, their definition is as follows:


    > *Data Resource Management is the development and execution of architectures,
    policies, practices and procedures that properly manage the full data lifecycle
    needs of an enterprise.*


    So, to talk of data management, we must start at the beginning, and that is understanding
    where data comes from.


    ## Understanding Where Data Comes From


    As previously mentioned, we generate a lot of data. Pretty much everything you
    do generates some form of data.


    Companies, for example, collect data from internal sources such as transactions,
    log data, and emails, but also from external sources such as social media, audio
    sources, as well as photos and videos.


    Other sources of data include:


    * Published data from credible sources such as government agencies, firms, and
    industrial associations

    * Designed experiments conducted in controlled environments

    * Surveys

    * Observations

    * Automatic, such as user interactions with applications

    * Manual entry, which is effectively people inputting information into the system


    These sources of data can be further classified by collection methods.


    ## Data Collection Methods


    There are two main types of data collection, namely, *observational* and *experimental*.


    **Observational** data collection means that data is gathered *passively* with
    no attempt to control the variables involved. For example, collecting customer
    feedback for a book and a retailer analyzing customer behavior are observational
    collection methods as there is no attempt to control any variable. In fact, the
    majority of the data collected by companies is done via observational methods.


    **Experimental** data collection involves designing and conducting an experiment
    where certain variables are controlled while you study other variables. This is
    most common in academic circles but also in clinical settings.


    A perfect example of it is when a pharmaceutical company tests a new drug. They
    set up experiments where they control certain variables, like the people involved
    in the study, and they test other variables, such as the effectiveness of the
    drug and potential side effects.


    In business, experimental data gathering is less prevalent. A/B testing is one
    example of this type of data collection where two variables are tested against
    each other. For example, a company might test the headline of an article against
    a different headline to see which is more effective at drawing in traffic.


    ### Data Acquisition Considerations


    When it comes to data acquisition, there are certain considerations that you need
    to take into account. Each one is essential and, as you will see later, they can
    go so far as to affect your whole business model. These are:


    1. Appropriateness of the data

    2. Nature of the data

    3. Time requirement

    4. Cost of acquisition


    So, let’s take a look at each of these and what they mean.


    #### Appropriateness of the Data


    If you study machine learning, one of the first sayings you will learn is "garbage
    in, garbage out." In other words, no matter how amazing your algorithm is, if
    you don’t have the right data, then you aren’t going to get the right results.


    So, let’s say you’re a retailer and you want to determine the average transaction
    size per customer for a particular store, which means you need to analyze the
    transactions for that store. If you enter the data for the wrong store or input
    customer feedback instead, then you aren’t going to get the results you are looking
    for. This is a bit of a simplistic and extreme example, but the point is that
    if you put garbage into your model, the algorithm can’t turn it into gold and
    you will get garbage out the other end.


    Now, it might not seem like a big deal, but this happens more often than you realize
    in the sense that problems are often difficult or impossible to solve because
    the right data isn’t available. This is why it’s so essential to keep this point
    in mind.


    #### Nature of the Data


    In some fields, data collection is inherently noisy or biased. For example, consumer
    surveys and election polling usually deliver biased results. This can be caused
    by the respondents, but also by the design of the survey, leading to noisy data
    that’s biased from both sides.


    Even in more rigid fields, like robotics, there can still be noise when it comes
    to the measurements made. Of course, this bias and noise can impact the results,
    which is why it’s important to be aware of them. If you don’t realize they exist,
    you won’t correct them and the results will be skewed.


    #### Time Requirement


    Time requirement refers to how long it takes to collect the data. This is more
    important in some fields than others, as data collection can be time-consuming.
    The problem is that in certain situations, it can take so long to collect the
    data that once you do get it, it might not be useful anymore.'
