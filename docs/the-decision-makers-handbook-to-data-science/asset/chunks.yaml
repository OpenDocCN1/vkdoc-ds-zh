    convert text or speech from one language to another, focusing solely on the task
    of translation.


    6. **Customer Service Chatbots**: Many websites use chatbots to handle customer
    inquiries, providing quick responses to common questions based on a predefined
    interaction script.


    7. **Facial Recognition Systems**: Used for security and identification purposes,
    these systems can match a face to a database of images with high accuracy.


    8. **Healthcare Diagnostics**: Certain AI applications assist doctors by analyzing
