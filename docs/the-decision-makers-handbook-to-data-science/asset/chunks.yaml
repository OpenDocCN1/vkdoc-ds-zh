- fmt: "### Lying with Charts\n\nSo, let’s start with one of my favorite ways to mislead\
    \ with statistics which is to blatantly lie using charts that contain spurious\
    \ correlations and seem to make sense on the surface, but in reality, they don’t\
    \ make any sense at all.\n\nTake a look at Figures [6-3](#490014_3_En_6_Chapter.xhtml#Fig3)\
    \ and [6-4](#490014_3_En_6_Chapter.xhtml#Fig4). Figure [6-3](#490014_3_En_6_Chapter.xhtml#Fig3)\
    \ shows a correlation between the number of people who drowned by falling into\
    \ a pool and the number of films Nicolas Cage appeared in. Figure [6-4](#490014_3_En_6_Chapter.xhtml#Fig4)\
    \ correlates US spending on science, space, and technology with suicides by hanging,\
    \ strangulation, and suffocation.\n\n![](images/490014_3_En_6_Chapter/490014_3_En_6_Fig4_HTML.jpg)\n\
    \nA line graph of U S spending on science, space, and technology correlates with\
    \ suicides by hanging, strangulation, and suffocation in the year. Hanging suicides\
    \ and U S spending on science peaks at 27.5 billion, 900 suicides, and 29 billion\
    \ and 9900 suicides in 2009, respectively. Values are approximate.\n\n**Figure\
    \ 6-4**  \nUS spending on science, space, and technology correlates with suicides\
    \ by hanging, strangulation, and suffocation^([^(46)](#fn46))\n\n![](images/490014_3_En_6_Chapter/490014_3_En_6_Fig3_HTML.jpg)\n\
    \nA line graph of the number of people who drowned by falling into a pool correlates\
    \ with films Nicolas Cage appeared in plotted in the year. Nicolas Cage has peaks\
    \ at 120 drownings, 4 films in 2007 and 2009. Swimming pool drowning peaks at\
    \ more than 120 drownings and 4 films in 2007.\n\n**Figure 6-3**  \nNicolas Cage\
    \ seems to be driving swimming pool drownings worldwide^([^(45)](#fn45))\n\nNow,\
    \ at first glance, these might look like interesting statistics. The first chart\
    \ seems to imply that more people drowned when Nicolas Cage starred in more films.\
    \ Based on this chart alone and without the understanding that statistics can\
    \ be misleading, you might conclude that people may have actually killed themselves\
    \ to get away from Nicolas Cage movies.\n\nThe second chart implies that US spending\
    \ on science, space, and technology has increased as the number of suicides by\
    \ hanging, strangulation, and suffocation increased. So, you could draw the conclusion\
    \ that investing in R&D is a sure way to increase deaths in the overall population!\n\
    \nWhen you write out the conclusions, it’s easier to realize that they really\
    \ don’t make a lot of sense. And yes, these are extreme examples to show how statistics\
    \ can be used to mislead, but many similar examples exist where the correlations\
    \ are spurious, even if it’s not that obvious, which is why you need to be careful.\n\
    \nSo, what does it mean that the correlations are spurious? It means that two\
    \ variables are correlated but the underlying theory as to what’s happening doesn’t\
    \ exist. They are simply two variables with no real connection that have been\
    \ correlated. And let’s not forget that correlation does not imply causation.\n\
    \nIn other words, the number of Nicolas Cage movies has absolutely no connection\
    \ with pool drownings in the real world, making it a spurious correlation. Conversely,\
    \ if we were to compare Nicolas Cage’s earnings with the number of movies he starred\
    \ in, then the correlation would make sense because there is a connection between\
    \ the two.\n\nThe second chart goes even further in its attempt to trick people\
    \ because the X-axis has been reversed. In other words, the numbers decrease along\
    \ the axis instead of increasing, despite the fact that the Y-axis has values\
    \ that increase as you go higher. This is an attempt to further force a correlation.\n\
    \nSo, statistics is a great tool, but it isn’t a magic wand that can provide answers\
    \ no matter what. Using statistics also doesn’t mean that you can get away with\
    \ not having the right research design. You also need to have the right framework\
    \ when looking into problems.\n\nIf you want to see more examples of spurious\
    \ correlations, visit [`http://tylervigen.com/`](http://tylervigen.com/). It’s\
    \ actually quite funny because in all these correlations, the mistake is always\
    \ the same, namely, that the theory behind the two variables being studied is\
    \ not there.\n\nRemember, just because there seems to be a high correlation between\
    \ the two variables, it doesn’t actually mean that the two are related.\n\nThe\
    \ problem is that while all these examples have spurious correlations, there are\
    \ many situations where it isn’t quite as obvious.\n\nFor example, let’s say that\
    \ there’s a high correlation between the amount of time someone has lived with\
    \ diabetes and the number of people who die before they turn 60. On the surface,\
    \ without digging deep, you might conclude that the longer someone has had diabetes,\
    \ the more likely they are to die before they turn 60. It makes for a pretty chart\
    \ and everything.\n\nHowever, if you start digging deeper, you discover that the\
    \ deaths include a wide range of causes, including car crashes, murders, suicides,\
    \ and so on. In other words, part of the second variable is completely unrelated,\
    \ even if a part is. The result is the same though, namely, that the decision-maker\
    \ studying a chart like that will come to the wrong conclusion.\n\nAnother way\
    \ to lie with charts is to use different kinds of scales. In the example in Figure\
    \ [6-5](#490014_3_En_6_Chapter.xhtml#Fig5), we have two charts with two bars each,\
    \ representing type A and type B. Both charts use log scales without explicitly\
    \ stating they are doing so. Now, by using different scales, you can make two\
    \ items appear closer to each other than they actually are.\n\n![](images/490014_3_En_6_Chapter/490014_3_En_6_Fig5_HTML.jpg)\n\
    \nTwo histograms. Left, type A has 50 and type B has 80. Right, type A has a little\
    \ less than 4, and type B has greater than 4.\n\n**Figure 6-5**  \nExample of\
    \ how a logarithmic scale can skew perception of the differences between groups\n\
    \nAnother easy way to lie with charts is to play around with the scale. For example,\
    \ in Figure [6-6](#490014_3_En_6_Chapter.xhtml#Fig6), you can see how the image\
    \ on the left shows a rising trend and the image on the right shows a more or\
    \ less stable trend. The data is the same in both cases. The only difference is\
    \ the degree of zoom.\n\n![](images/490014_3_En_6_Chapter/490014_3_En_6_Fig6_HTML.jpg)\n\
    \nTwo line graphs. Left, the line passes through y values 1.5, 2, 3, 4, 3, and\
    \ 4.3 as it goes to the right. Right, the line passes through y values 1, 2, 2,\
    \ 4, 3, 4, and 5 as it goes to the right. All values are approximate.\n\n**Figure\
    \ 6-6**  \nSame data, different view"
  raw: '### Lying with Charts


    So, let’s start with one of my favorite ways to mislead with statistics which
    is to blatantly lie using charts that contain spurious correlations and seem to
    make sense on the surface, but in reality, they don’t make any sense at all.


    Take a look at Figures [6-3](#490014_3_En_6_Chapter.xhtml#Fig3) and [6-4](#490014_3_En_6_Chapter.xhtml#Fig4).
    Figure [6-3](#490014_3_En_6_Chapter.xhtml#Fig3) shows a correlation between the
    number of people who drowned by falling into a pool and the number of films Nicolas
    Cage appeared in. Figure [6-4](#490014_3_En_6_Chapter.xhtml#Fig4) correlates US
    spending on science, space, and technology with suicides by hanging, strangulation,
    and suffocation.


    ![](images/490014_3_En_6_Chapter/490014_3_En_6_Fig4_HTML.jpg)


    A line graph of U S spending on science, space, and technology correlates with
    suicides by hanging, strangulation, and suffocation in the year. Hanging suicides
    and U S spending on science peaks at 27.5 billion, 900 suicides, and 29 billion
    and 9900 suicides in 2009, respectively. Values are approximate.


    Figure 6-4


    US spending on science, space, and technology correlates with suicides by hanging,
    strangulation, and suffocation^([^(46)](#fn46))


    ![](images/490014_3_En_6_Chapter/490014_3_En_6_Fig3_HTML.jpg)


    A line graph of the number of people who drowned by falling into a pool correlates
    with films Nicolas Cage appeared in plotted in the year. Nicolas Cage has peaks
    at 120 drownings, 4 films in 2007 and 2009. Swimming pool drowning peaks at more
    than 120 drownings and 4 films in 2007.


    Figure 6-3


    Nicolas Cage seems to be driving swimming pool drownings worldwide^([^(45)](#fn45))


    Now, at first glance, these might look like interesting statistics. The first
    chart seems to imply that more people drowned when Nicolas Cage starred in more
    films. Based on this chart alone and without the understanding that statistics
    can be misleading, you might conclude that people may have actually killed themselves
    to get away from Nicolas Cage movies.


    The second chart implies that US spending on science, space, and technology has
    increased as the number of suicides by hanging, strangulation, and suffocation
    increased. So, you could draw the conclusion that investing in R&D is a sure way
    to increase deaths in the overall population!


    When you write out the conclusions, it’s easier to realize that they really don’t
    make a lot of sense. And yes, these are extreme examples to show how statistics
    can be used to mislead, but many similar examples exist where the correlations
    are spurious, even if it’s not that obvious, which is why you need to be careful.


    So, what does it mean that the correlations are spurious? It means that two variables
    are correlated but the underlying theory as to what’s happening doesn’t exist.
    They are simply two variables with no real connection that have been correlated.
    And let’s not forget that correlation does not imply causation.


    In other words, the number of Nicolas Cage movies has absolutely no connection
    with pool drownings in the real world, making it a spurious correlation. Conversely,
    if we were to compare Nicolas Cage’s earnings with the number of movies he starred
    in, then the correlation would make sense because there is a connection between
    the two.


    The second chart goes even further in its attempt to trick people because the
    X-axis has been reversed. In other words, the numbers decrease along the axis
    instead of increasing, despite the fact that the Y-axis has values that increase
    as you go higher. This is an attempt to further force a correlation.


    So, statistics is a great tool, but it isn’t a magic wand that can provide answers
    no matter what. Using statistics also doesn’t mean that you can get away with
    not having the right research design. You also need to have the right framework
    when looking into problems.


    If you want to see more examples of spurious correlations, visit [`http://tylervigen.com/`](http://tylervigen.com/).
    It’s actually quite funny because in all these correlations, the mistake is always
    the same, namely, that the theory behind the two variables being studied is not
    there.


    Remember, just because there seems to be a high correlation between the two variables,
    it doesn’t actually mean that the two are related.


    The problem is that while all these examples have spurious correlations, there
    are many situations where it isn’t quite as obvious.


    For example, let’s say that there’s a high correlation between the amount of time
    someone has lived with diabetes and the number of people who die before they turn
    60\. On the surface, without digging deep, you might conclude that the longer
    someone has had diabetes, the more likely they are to die before they turn 60\.
    It makes for a pretty chart and everything.


    However, if you start digging deeper, you discover that the deaths include a wide
    range of causes, including car crashes, murders, suicides, and so on. In other
    words, part of the second variable is completely unrelated, even if a part is.
    The result is the same though, namely, that the decision-maker studying a chart
    like that will come to the wrong conclusion.


    Another way to lie with charts is to use different kinds of scales. In the example
    in Figure [6-5](#490014_3_En_6_Chapter.xhtml#Fig5), we have two charts with two
    bars each, representing type A and type B. Both charts use log scales without
    explicitly stating they are doing so. Now, by using different scales, you can
    make two items appear closer to each other than they actually are.


    ![](images/490014_3_En_6_Chapter/490014_3_En_6_Fig5_HTML.jpg)


    Two histograms. Left, type A has 50 and type B has 80\. Right, type A has a little
    less than 4, and type B has greater than 4.


    Figure 6-5


    Example of how a logarithmic scale can skew perception of the differences between
    groups


    Another easy way to lie with charts is to play around with the scale. For example,
    in Figure [6-6](#490014_3_En_6_Chapter.xhtml#Fig6), you can see how the image
    on the left shows a rising trend and the image on the right shows a more or less
    stable trend. The data is the same in both cases. The only difference is the degree
    of zoom.


    ![](images/490014_3_En_6_Chapter/490014_3_En_6_Fig6_HTML.jpg)


    Two line graphs. Left, the line passes through y values 1.5, 2, 3, 4, 3, and 4.3
    as it goes to the right. Right, the line passes through y values 1, 2, 2, 4, 3,
    4, and 5 as it goes to the right. All values are approximate.


    Figure 6-6


    Same data, different view'
  trans: "\n### 用图表说谎\n\n那么，让我们从一种我最喜欢的用统计误导他人的方式开始——公然使用包含虚假相关性的图表说谎。这些图表表面上似乎有道理，但实际上毫无意义。\n\
    \n请看图 6-3 和图 6-4。图 6-3 显示了掉进游泳池淹死的人数与尼古拉斯·凯奇出演电影数量之间的相关性。图 6-4 则将美国在科学、空间和技术上的支出与上吊、勒颈和窒息自杀的人数关联起来。\n\
    \n![](img/490014_3_En_6_Fig4_HTML.jpg)\n\n一幅折线图，展示了美国在科学、空间和技术上的支出与当年因上吊、勒颈和窒息自杀的人数之间的相关性。上吊自杀人数和美国科学支出分别在\
    \ 2009 年达到峰值，约为 275 亿美元对应 900 起自杀，以及 290 亿美元对应 9900 起自杀。数值均为近似值。\n\n**图 6-4**\
    \  \n美国在科学、空间和技术上的支出与因上吊、勒颈和窒息自杀的人数相关^(⁴⁶)\n\n![](img/490014_3_En_6_Fig3_HTML.jpg)\n\
    \n一幅折线图，展示了掉进游泳池淹死的人数与尼古拉斯·凯奇出演电影数量按年份绘制的相关性。尼古拉斯·凯奇在 2007 年和 2009 年达到峰值，对应约 120\
    \ 起溺亡和 4 部电影。游泳池溺亡在 2007 年达到峰值，超过 120 起溺亡和 4 部电影。\n\n**图 6-3**  \n尼古拉斯·凯奇似乎在全球范围内推动了游泳池溺亡事件^(⁴⁵)\n\
    \n乍一看，这些可能像是很有趣的统计数据。第一张图似乎在暗示，当尼古拉斯·凯奇主演更多电影时，溺亡人数也更多。仅凭这张图，并且不了解统计数据可能具有误导性，你可能会得出结论：人们实际上可能是为了逃离尼古拉斯·凯奇的电影而自杀。\n\
    \n第二张图暗示，随着上吊、勒颈和窒息自杀人数的增加，美国在科学、空间和技术上的支出也在增加。因此，你可以得出结论：投资研发是增加总体人口死亡数的可靠方法！\n\
    \n当你把这些结论写出来时，就更容易意识到它们其实根本没什么道理。是的，这些是展示统计数据如何被用来误导的极端例子，但许多类似的例子都存在虚假相关性，即使不那么明显，这也是你需要小心的原因。\n\
    \n那么，相关性是虚假的意味着什么？这意味着两个变量存在相关性，但其背后并没有发生这种关联的理论依据。它们只是两个被关联起来、实则毫无真实联系的变量。并且我们不要忘记，相关性并不等同于因果关系。\n\
    \n换句话说，尼古拉斯·凯奇电影的数量与现实世界中游泳池溺亡人数毫无关联，因此它是一个虚假相关。相反，如果我们比较尼古拉斯·凯奇的收入和他主演的电影数量，那么这种相关性就有意义了，因为两者之间存在联系。\n\
    \n第二张图在试图欺骗人们方面更进一步，因为它的 X 轴被反转了。换句话说，数值沿轴递减而非递增，尽管 Y 轴的数值是随着高度增加而增大的。这是为了进一步强行制造相关性。\n\
    \n因此，统计学是一个很好的工具，但它不是一个无论怎样都能提供答案的魔法棒。使用统计学也不意味着你可以不必拥有正确的研究设计。在审视问题时，你还需要有正确的框架。\n\
    \n如果你想看更多虚假相关的例子，请访问 [`http://tylervigen.com/`](http://tylervigen.com/)。实际上这相当有趣，因为在所有这些相关性中，错误总是相同的，即所研究的两个变量背后缺乏理论依据。\n\
    \n记住，仅仅因为两个变量之间似乎存在很高的相关性，并不意味着它们真的相关。\n\n问题在于，尽管所有这些例子都涉及虚假相关，但在许多情况下，它并不那么显而易见。\n\
    \n例如，假设某人患有糖尿病的时间长度与 60 岁前死亡的人数之间存在很高的相关性。表面上，不作深入探究，你可能会得出结论：一个人患糖尿病的时间越长，他们在\
    \ 60 岁前死亡的可能性就越大。这可以做出漂亮的图表和一切。\n\n然而，如果你开始深入挖掘，你会发现这些死亡包括了各种各样的原因，如车祸、谋杀、自杀等等。换句话说，即使部分相关，第二个变量的另一部分也完全无关。但结果是一样的，即研究此类图表的决策者会得出错误的结论。\n\
    \n另一种用图表说谎的方式是使用不同的刻度。在图 6-5 的例子中，我们有两个图表，每个图表有两个条形，代表类型 A 和类型 B。两个图表都使用了对数刻度，但没有明确说明。通过使用不同的刻度，你可以让两个项目看起来比实际更接近。\n\
    \n![](img/490014_3_En_6_Fig5_HTML.jpg)\n\n两幅直方图。左侧，类型 A 为 50，类型 B 为 80。右侧，类型 A\
    \ 略低于 4，类型 B 大于 4。\n\n**图 6-5**  \n对数刻度如何扭曲组间差异感知的示例\n\n另一种用图表说谎的简单方法是调整坐标轴的刻度范围。例如，在图\
    \ 6-6 中，你可以看到左边的图显示出一个上升趋势，而右边的图则显示出一个大致稳定的趋势。两种情况下数据是相同的。唯一的区别是缩放的程度。\n\n![](img/490014_3_En_6_Fig6_HTML.jpg)\n\
    \n两幅折线图。左侧，线条向右延伸时依次穿过 y 值 1.5、2、3、4、3 和 4.3。右侧，线条向右延伸时依次穿过 y 值 1、2、2、4、3、4 和\
    \ 5。所有数值均为近似值。\n\n**图 6-6**  \n相同的数据，不同的视图\n"
- fmt: '### Misleading Using Descriptive Statistics


    Now, let’s take a look at how you can mislead someone using descriptive statistics.
    One way to easily lie is by using measures of centrality and summary metrics.
    There are, in essence, three main measures of centrality, namely, the mean, the
    median, and the mode.


    The mean is the average of a set of numbers, namely, where you add all the numbers
    together and divide by how many numbers there are. The median is the middle value
    in a list of numbers, while the mode is the value that occurs most frequently
    in a list.


    Now, in a symmetrical distribution, the mean, median, and mode fall on the same
    point. However, when we have a positive skew, the mean is lighter than the median,
    and the median is lighter than the mode, and the opposite happens in a negatively
    skewed distribution. See Figure [6-7](#490014_3_En_6_Chapter.xhtml#Fig7).


    ![](images/490014_3_En_6_Chapter/490014_3_En_6_Fig7_HTML.jpg)


    Three probability distributions. In positive skew, the mode is at (1.5, 0.13),
    mean (3.5, 0.1), and median (5, 0.08). In negative skew, the mode is at (negative
    2, 0.13), mean (negative 4, 0.1), and median (negative 5, 0.07). In symmetric,
    mode, mean, and median are at (0, 0.4). Values are approximate.


    **Figure 6-7** Skewness and the relationship between the mean, the median, and
    the mode


    This is important because many distributions in real life are not symmetrical.
    For example, let’s say there is a company where the CEO earns $300K per year,
    while the rest of the employees—a total of ten—earn $50K per year.


    Depending on the image you want to project, you can present different figures.
    For example, in our situation, the median is $50K per year, but the mean is $72K
    per year.


    A malicious company might advertise the mean salary as being $72K per year when
    looking to hire someone, but in reality, they aren’t willing to pay employees
    other than the CEO anything over $50K. But this way, they could trick somebody
    into thinking they could eventually make $72K per year, and they wouldn’t even
    have to come out and say it like that as the figures imply it.


    ### Biases in Sampling


    Now we’re going to look at biases in sampling. There are a number of sampling
    biases, but we are going to focus on five, namely, selection bias, area bias,
    self-selection bias, leading question bias, and social desirability bias. These
    are the most common in a business setting.


    #### Selection Bias


    Selection bias is the most important, and the other biases can be considered related
    or even seen as subsets of this type of bias.


    This type of bias exists when the sample is not representative because there is
    some kind of process taking place that makes sure the subjects or the items in
    the sample are special. Many other subjects or items are not included.


    An interesting story about selection bias is the one of Abraham Wald, who was
    a statistician. During World War II, the government reached out to him to ask
    him to improve the survival rate of US aircraft. Wald was smart, and the first
    thing he did was to look at the prior analyses that had been conducted.^([^(47)](#fn47))
    And he noticed that selection bias was taking place.


    The previous investigators had been analyzing aircraft that survived and recommended
    that more armor should be added to the areas that had received the most damage,
    thereby increasing their protection. So, where the planes were most shot and torn
    up, new armor was mounted to protect those areas.


    The result was that even more planes went down. The additional armor made the
    planes heavier, leading to them being less agile and slower. And the planes still
    returned with damage in the same areas.


    The problem was that the investigators had based their conclusions on planes that
    had been damaged in areas that were clearly resilient. After all, they had taken
    damage in those areas and still returned to base.


    Wald realized that what needed to be protected was the areas that had not taken
    damage and were sensitive. Once armor was added to those areas, survivability
    increased.


    It’s a very interesting example of using statistics in a highly intelligent way
    without even running an analysis. All he had to do was realize that this selection
    bias was in play and then he fixed it.


    #### Area Bias


    Area bias occurs when you try to generalize results from one area to another area,
    and this is especially problematic when attempting to cross cultures.


    So, for example, you conduct marketing research in Europe and you automatically
    assume the same results will hold for the United States. Unfortunately, this doesn’t
    take into account that a wide range of factors, including cultural and financial,
    could affect the validity of the results.


    #### Self-Selection Bias


    In self-selection bias, a person’s decision to take part in a study could be correlated
    with traits they already have and which could affect the study, making the participants
    a non-representative sample.


    This might sound complicated, but it’s actually a lot simpler than it sounds.
    For example, if you were to set up a booth to ask people about their grooming
    habits, the people who respond are more likely to be people who like taking care
    of themselves and spend more time primping in the mornings.


    The problem is that you need to talk to both people who primp and also those who
    are less interested in grooming in the mornings for the sample to be representative.


    #### Leading Question Bias


    Leading question bias is about how questions are phrased and asked, but also what
    the answer options are.


    So, if you were to ask


    Don’t you think high school teachers are paid too little?


    1.  Yes, they should earn more.

    2.  No, they should not earn more.

    3.  No opinion.


    Most people would answer A because of the way the question was phrased. Thus,
    with leading questions, you end up with biased results.


    #### Social Desirability Bias


    Social desirability bias occurs when people want to seem better than they are.
    For example, if you ask people in survey about how often they shower or how frequently
    they recycle, your data will be biased because no one wants to admit to doing
    something that is socially undesirable.


    In other words, even if someone showers every two weeks, they’re going to tell
    you they do it once a day or every three days or whatever they think is a more
    socially acceptable number. Whatever it is, it’s rarely going to be the truth.'
