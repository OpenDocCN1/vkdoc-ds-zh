    # 数据科学流程


    那么，如果我问这个问题：


    > *数据科学是关于什么的？*


    我会得到不同的答案，因为，毫不意外，不同的人有不同的看法。例如，老板可能认为数据科学实际上是一台神奇的印钞机，可以随时印出他或她想要的钱。


    对于客户来说，数据科学可能会让你看起来像一个巫师、读心者或通灵者，因为你可以了解他们很多，并解决他们的许多问题。


    软件工程师认为数据科学只是从库中导入一些东西并运行几个函数，因为当然没有人像他们一样厉害。


    然而，在现实中，数据科学就像一个由不同元素组成的管弦乐队，包括基础设施、软件、数据源和统计学。


    从实用的角度来看，数据科学生命周期有五个步骤：


    1. 收集数据

    2. 整理数据

    3. 分析数据

    4. 解释数据

    5. 传达数据发现


    我们在前面的章节已经涵盖了数据的收集和整理；因此，我们将在本章中探讨第 3 到第 5 步，并且我们会足够深入地讲解这些主题，以便你理解这一切是如何运作的。


    不过请记住，数据科学家通常是从第 3 步到第 5 步才被召入，因为收集和整理工作已经完成了。但这并不意味着这些工作总是做得妥当，只能说它们已经做过了。


    ## 定义数据科学流程


    数据科学流程包含四个步骤，即：


    * 步骤 1——定义问题

    * 步骤 2——选择正确的数据

    * 步骤 3——解决问题

    * 步骤 4——通过可操作的洞察创造价值


    该流程涉及两个主要角色，即`领域专家`和`数据科学家`。


    `领域专家`是拥有该问题的人。它可能是聘请数据科学家的企业主，也可能是必须与数据科学家合作的部门负责人。在学术环境中，它可能是一位研究人员。


    本质上，`领域专家`是负责解决问题的人，并且需要向自己（作为企业主或创业者）或向高层管理层汇报。他也是了解领域所有具体细节的人。


    因此，第一步，即定义问题，由`领域专家`负责。随后，选择正确的数据是这两个角色的共同责任，而第三步则落在`数据科学家`身上。最后，创造价值需要双方共同合作。


    那么，让我们仔细看看所有这些步骤。


    ### 步骤 1：定义问题


    `领域专家`负责定义问题，因为他们比任何人都更了解这个领域。问题在于，`领域专家`通常不了解数据科学，这可能会产生问题。


    而这正是本节要讨论的内容。它关乎理解你为什么需要数据科学，你如何使用它，以及在什么情况下它会变得相关。


    如果你的公司有一位与你共事已久的`数据科学家`，他们很可能对这个领域有很好的了解。这意味着他们可以自己定义问题。


    然而，在大多数情况下，是`领域专家`来提出问题的。例如，他们可能想预测本月的销售额，或者他们可能会说推荐系统需要改进。


    一旦问题被定义，就该进入下一步了。


    ### 步骤 2：选择正确的数据


    `领域专家`需要理解`数据收集`和`管理`，我们在上一节中讨论过这些。他们负责确保我们之前讲过的数据收集和管理原则得到遵循，从而使数据尽可能干净、标准有文档记录、数据易于使用。


    另一方面，`数据科学家`需要理解该领域及其可能存在的任何特殊性。我们在数据管理部分也提到了这一点。


    因此，每个领域都有其自身的优缺点。所以，在某些情况下，你可能会得到非常嘈杂的数据，比如处理传感器数据时。在其他情况下，数据可能不准确，例如通过民意调查和问卷调查收集的数据，因为人们对答案可能不完全诚实。而`数据科学家`需要了解这些事情。


    ### 步骤 3：解决问题


    `领域专家`在这一步的主要贡献是确保公司聘请到合适的人，我们将在本书的下一节讨论这一点。他们还负责确保公司拥有合适的文化，我们将在本书的最后一章涉及。


    实际解决问题是`数据科学家`的工作，除了提供支持之外，`领域专家`能做的不多。


    ### 步骤 4：通过可操作的洞察创造价值


    这一步是`数据科学家`和`领域专家`的共同责任。这需要双方良好的合作，因为`领域专家`需要知道如何与`数据科学家`合作，并且理解工作成果意味着什么。


    同时，`数据科学家`到这时也需要了解业务和特定领域的一些问题。


    在这一点上，如果作为`领域专家`的人（如企业主、经理或决策者）对数据科学有很好的理解，那将会带来巨大的回报。


    这也有助于建立一种`数据科学文化`，但我们将在最后一部分更深入地探讨这一点。正确的文化可以使`数据科学家`更容易了解该领域的特殊性和业务问题。这将使`数据科学家`能够采取更具创造性的方法来开发解决方案，以帮助业务发展。


    ## 使用数据科学流程解决问题


    我们来看一个例子。这是一个非常简单的问题，但却是展示如何使用数据科学流程解决问题的最佳方式。


    ### 步骤 1：定义问题


    所以，第一步是定义问题。选择你在工作中觉得有趣的事情。你甚至可以决定专注于某件让你烦恼的事情。


    我将选择一个琐碎的例子，但大多数人都能感同身受，那就是会议总是迟到开始。


    要做的第一件事是构建问题。一个很好的技巧是将问题的陈述转化为一个问题并写下来。那么，在我们的案例中，它会是


    *会议似乎总是迟到开始。这真的是事实吗？*


    你想要采用这种方法，因为虽然大多数数据科学家喜欢具体的术语，但大多数非数据科学家倾向于用更模糊的术语思考。然而，模型，无论是机器学习、统计还是任何其他类型，都有狭窄的关注点，并且只能回答一个、两个或三个具体的问题。因此，当你把问题写成一个问题时，它能帮助`数据科学家`开发出更好的模型来达成解决方案。


    ### 步骤 2：选择正确的数据


    这一步将分为两部分，即第 A 部分（你思考数据）和第 B 部分（你收集数据）。

    '
- fmt: '### Part A: Think About the Data


    At this point, you need to consider what data you will require to answer the question
    you framed in Step 1. And then you have to decide how you will collect the relevant
    data.


    You start by writing down all the relevant definitions and thinking about the
    protocol you will use to collect the data. This is when the problems start, and
    you realize that even for simple problems, there might be a wide range of different
    issues.


    So, in our example, we want to study meetings that start late. To do this, though,
    we need to define when the meeting actually starts. It might seem simple at first,
    but if you really think about it, the definition isn’t all that clear.


    Thus, does the meeting start when someone says it’s time to get started? Or is
    it the time the meeting was scheduled for in the calendar? Or is it when the actual
    work of the meeting starts—you know, after all the chitchat and enquiring about
    the boss’ kids, dog, cat, hamster, and crocodile? Or is all that small talk that
    takes place in the first few minutes part of the meeting too? Some might think
    that bit is a waste of time, while others might find it important for relationship
    building.


    It might seem pretty trivial, but all these things are important because things
    can go wrong. The main risk is that you use the wrong definitions and they prevent
    you from solving the problem.


    For example, meetings might consistently start late because of small talk. However,
    when you wrote down the definition, you didn’t factor in this small talk and,
    therefore, recorded a different time for the start of the meeting. So, you can’t
    solve the problem because the cause is completely missing from the data. As a
    result, you have to go back and collect data again, thereby wasting time, energy,
    and resources.


    ### Part B: Collect the Data


    Now that you’ve defined your data, it’s time to move on to the collection part
    of the project. The first thing to consider is that you need data you can trust,
    which can be more difficult than it sounds.


    Data can suffer from a wide range of issues such as missing values, erroneous
    entries, definition issues, and much more. And these are pretty frequent problems.
    We covered this in the previous section as well as how to prevent or fix these
    problems.


    Due to these problems, it’s a good idea to be flexible and adaptable. For example,
    it could be a good idea to modify your definition and the data collection protocol
    as you go along if things aren’t progressing as they should.


    So, come back to our meeting example. Let’s say your initial definition doesn’t
    include the “small talk” portion of the meeting. However, you realize it’s extremely
    relevant since it delays the start of the actual meeting by approximately 30 minutes.
    Well, you can’t solve the problem if the data doesn’t show it exists, so you go
    back and change the definition but also how you collect the data.


    What is vital, though, is that there is complete transparency and everything is
    documented regarding what you changed, how you changed, when you changed it, and
    so on. This is important because you could end up with situations like variables
    meaning completely different things but using the same terms to define them.


    For example, let’s say you don’t document your decision to include small talk
    as part of the meeting. The time you record as the start time changes, but no
    one knows about it because you didn’t document the change.


    Then, you comb through the data with the data scientist, who can’t figure out
    why nothing works properly.


    The reason is, of course, that the `start time` variable has two different definitions
    depending on when it was recorded during the project, namely, before or after
    you made the change.


    Effectively, you’re dealing with two variables and not one, which can seriously
    mess up any statistical model.


    This is just one example of how things can go wrong when you don’t document everything
    you are doing. Many more things can occur, leading to disastrous results.


    As you aren’t a data science expert, there’s no way for you to foresee what problems
    might arise with the data, which is why you want to be fully transparent regarding
    what’s going on and to document every tiny little thing that you do.


    Remember, you always want to make the data scientist’s life *as easy as possible*
    because it will take them less time to get up to speed and it will enable them
    to develop a more effective solution, helping you save time and money while greatly
    improving efficiency and productivity.


    ### Step 3: Solving the Problem


    In this phase, there’s not a lot you can do as the domain expert since it’s mainly
    the data scientist’s job. However, let’s take a quick look at what this step usually
    entails anyway just so you can get an idea of what’s going on.


    Usually, most data scientists like to start by performing exploratory data analysis.
    They use summary metrics, graphs, and so on to gain a better understanding of
    the problem. In some cases, they might even present some early findings to the
    stakeholders.


    So, in our example, a data scientist might say something like:


    “Over a two-week period, 10% of the meetings started on time. On average, meetings
    started 12 minutes late.”


    Or they might discover that meetings usually started late when they covered topics
    X and Y and when certain people attended, like the manager who loves to tell everyone
    what he did over the weekend in minute detail and no one can seem to get him to
    stop talking.


    The data scientist will then build a model to find a solution, but models are
    mainly used to answer specific questions. You can have a primary question, which,
    in our example, could be:


    Are people usually late for meetings?


    But you can also have a number of secondary ones. In our example, they could be
    along the lines of:


    - Does the subject being covered affect how long a meeting runs?

    - Do the people in attendance have an effect on how late the meeting is?

    - Are late meetings counterbalanced by meetings that finish early?

    - What is the overall meeting time? Can you describe this in terms of a distribution?


    Of course, all these questions are related and that means more than one can be
    answered. Keep in mind, though, that when you frame your problem as a question,
    you are helping the data scientist. They will be better able to understand how
    to convert vague data into a model that can be used to solve the problem.'
