  trans: '

    ### 描述性统计的误导性使用


    现在，让我们来看看如何利用描述性统计来误导他人。一种常用的欺骗手段是使用集中趋势度量和汇总指标。本质上，集中趋势主要有三种度量方式，即均值、中位数和众数。


    均值是一组数字的平均值，也就是将所有数字相加，然后除以数字的个数。中位数是一组数字按大小排列后的中间值，而众数则是一组数字中出现频率最高的值。


    在对称分布中，均值、中位数和众数落在同一点上。然而，当数据呈正偏态时，均值小于中位数，中位数小于众数；而在负偏态分布中，情况则相反。见图 6-7。


    ![](img/490014_3_En_6_Fig7_HTML.jpg)


    三种概率分布。在正偏态中，众数位于 (1.5, 0.13)，均值位于 (3.5, 0.1)，中位数位于 (5, 0.08)。在负偏态中，众数位于 (-2,
    0.13)，均值位于 (-4, 0.1)，中位数位于 (-5, 0.07)。在对称分布中，众数、均值和中位数均位于 (0, 0.4)。数值为近似值。


    **图 6-7** 偏度以及均值、中位数与众数之间的关系


    这一点很重要，因为现实生活中的许多分布都不是对称的。例如，假设一家公司，CEO 年薪 30 万美元，而其余十名员工每人年薪 5 万美元。


    根据你希望呈现的形象，你可以出示不同的数据。例如，在我们的例子中，中位数是每年 5 万美元，但平均值是每年 7.2 万美元。


    一家不怀好意的公司在招聘时可能会宣传平均工资为每年 7.2 万美元，但实际上，他们除了 CEO 之外，不愿意向任何员工支付超过 5 万美元的薪水。但这样一来，他们就能诱使一些人以为自己最终能赚到每年
    7.2 万美元，而他们甚至不需要直说，因为这些数字本身就暗示了这一点。


    ### 抽样中的偏差


    现在我们来探讨抽样中的偏差。抽样偏差有多种类型，但我们主要关注五种，即：选择偏差、区域偏差、自我选择偏差、诱导性问题偏差和社会期望偏差。这些是商业环境中最常见的几种。


    #### 选择偏差


    选择偏差是最重要的一种，其他偏差可以被视为与之相关，甚至是这种偏差的子集。


    当样本不具有代表性，因为存在某种过程确保了样本中的受试者或项目是特殊的，而许多其他受试者或项目未被纳入时，就出现了这种偏差。


    关于选择偏差有一个有趣的故事，主人公是统计学家亚伯拉罕·沃尔德。二战期间，政府找到他，希望他帮助提高美国飞机的生存率。沃尔德很聪明，他做的第一件事就是查看之前进行过的分析。^(⁴⁷^)
    他注意到其中存在选择偏差。


    之前的研究人员分析的是幸存返航的飞机，并建议在受损最严重的区域增加更多装甲，以提高防护能力。于是，飞机上弹孔最多、破损最严重的地方被装上了新的装甲。


    结果，更多飞机被击落。额外的装甲使飞机变得更重，导致其灵活性降低、速度变慢。而返航的飞机仍然在相同区域带有损伤。


    问题在于，研究人员是根据那些在明显具有韧性的区域受损的飞机得出结论的。毕竟，这些飞机的那些区域虽然受损，但它们仍然返回了基地。


    沃尔德意识到，真正需要保护的是那些没有受损且脆弱的区域。一旦在这些区域加装装甲，飞机的生存率就提高了。


    这是一个非常有趣的例子，展示了如何以极其睿智的方式运用统计学，甚至无需运行分析。他需要做的仅仅是意识到这种选择偏差的存在，然后将其修正。


    #### 区域偏差


    区域偏差发生在你试图将一个区域的结论推广到另一个区域时，在尝试跨文化推广时这个问题尤为突出。


    举个例子，你在欧洲进行了市场营销研究，就自动认为同样的结果也适用于美国。不幸的是，这没有考虑到包括文化和金融因素在内的广泛因素都可能影响研究结果的可靠性。


    #### 自我选择偏差


    在自我选择偏差中，一个人决定参与研究的行为可能与他们已有的、并可能影响研究的特征相关，从而使参与者成为一个非代表性样本。


    这听起来可能很复杂，但实际上比听起来要简单得多。例如，如果你设立一个展位来询问人们的梳妆打扮习惯，那么更有可能回答问题的往往是那些注重自身形象、早上愿意花更多时间打扮的人。


    问题在于，你需要同时与那些爱打扮的人以及早上对梳洗打扮不太感兴趣的人交谈，这样样本才具有代表性。


    #### 诱导性问题偏差


    诱导性问题偏差不仅关乎问题的措辞和提问方式，也关乎可选的答案。


    因此，如果你问：


    你不觉得高中老师的薪水太低了吗？


    1.  是的，他们应该拿更高的薪水。

    2.  不，他们不应该拿更高的薪水。

    3.  没有意见。


    由于问题的措辞方式，大多数人会选择 A。因此，使用诱导性问题最终会得到有偏差的结果。


    #### 社会期望偏差


    社会期望偏差发生在人们希望表现得比实际更好的时候。例如，如果你在调查中询问人们洗澡的频率或回收垃圾的频率，你的数据就会存在偏差，因为没有人愿意承认自己做了社会不认可的事情。


    换句话说，即使某人每两周才洗一次澡，他们也会告诉你他们每天或每三天洗一次，或者随便一个他们认为更容易被社会接受的数字。无论他们说什么，都很少会是真相。

    '
- fmt: "### Sampling Bias in the Real World\n\nThe previous examples were all quite\
    \ simple. However, the polling for the 2016 American Presidential Election is\
    \ a good case where these sampling biases combined to affect the results. Another\
    \ example is Brexit.^([^(48)](#fn48))\n\nIn both cases, the pollsters’ results\
    \ weren’t that accurate. Most of the explanations of what happened revolved around\
    \ biasing in sampling. There are all sorts of theories regarding what happened.\n\
    \nFor example, the Pew Research Center stated the following:\n\n> *One likely\
    \ culprit is what pollsters refer to as* `nonresponse bias`*. This occurs when\
    \ certain kinds of people systematically do not respond to surveys despite equal\
    \ opportunity outreach to all parts of the electorate. We know that some groups—including\
    \ the less educated voters who were a key demographic for Trump on Election Day—are*\
    \ `consistently hard for pollsters to reach`. *It is possible that the frustration\
    \ and anti-institutional feelings that drove the Trump campaign may also have\
    \ aligned with an* `unwillingness to respond to polls`.*^([^(49)](#fn49))\n\n\
    Another theory was that there was self-selection in online polling, saying that\
    \ people who tend to answer online polls were more likely to support a certain\
    \ candidate over another. There was also the assumption that people who supported\
    \ the other party wanted to avoid polls altogether.\n\nIt once again shows how\
    \ statistics can also go wrong not because of the math or the models but due to\
    \ factors outside of our control, namely, sampling biases.\n\nThis is similar\
    \ to spurious correlations in a way, because statistics is an applied science\
    \ and doesn’t happen in a vacuum. If you don’t have the right data, if you don’t\
    \ have the right theory, you will still come up with a set of numbers, but they\
    \ won’t mean anything.\n\n### Lying with Inferential Statistics\n\nSo, while it\
    \ might not be that easy to lie with inferential statistics, those of you who\
    \ might have harbored the illusion that it’s not possible at all will be disappointed\
    \ because it can be done.\n\nIt happens in large part in research. When you test\
    \ a hypothesis, you get a `p-value`, which you want to be below a certain threshold\
    \ for the test to have statistical significance. Usually this threshold is 0.05.\n\
    \nThere’s a theory about the cult of the `p-value`^([^(50)](#fn50)) that says\
    \ there are a very large number of research papers out there with `p-values` suspiciously\
    \ close to 0.05. Essentially, they’re just below 0.05 so they can meet the condition\
    \ of statistical significance. This might make the results significant, but only\
    \ marginally so.\n\nThe theory is that this is being done on purpose. In academia,\
    \ the environment is very competitive and people have to publish or they’ll lose\
    \ their job. Thus, many people are under pressure to make their `p-values` look\
    \ more significant than they might actually be.\n\nOne way to do this is to run\
    \ multiple experiments until you get the results you want, and another way is\
    \ to massage the data. In some cases, though, you might find research where the\
    \ results are significant but the researcher’s intent is not to deceive, but it\
    \ could be that the model assumptions are not being met.\n\nAll models and statistics\
    \ have some assumptions, and, unfortunately, there are many research papers out\
    \ there where these assumptions are not being properly accounted for.\n\n### IN-DEPTH:\
    \ BAYESIAN VS. FREQUENTIST STATISTICS\n\nMaybe you have heard of the term `Bayesian`.\
    \ There are many models that include the word “Bayes”: `Naïve Bayes`, `Bayesian\
    \ networks`, `Bayesian inference`, and so on.\n\nAll these refer to a school of\
    \ thought behind statistics. It all started with the British mathematician *Reverend\
    \ Thomas Bayes*, who came up with this simple formula:\n\n```\nP(A|B) = P(B|A)\
    \ * P(A) / P(B)\n```\n\nThis formula describes the probability of event A taking\
    \ place, given that B has taken place as well. This was later developed further\
    \ by Pierre-Simon Laplace and Sir Harold Jeffreys into what is now forming the\
    \ foundations of Bayesian statistics.\n\nOne of the main ideas behind Bayesian\
    \ statistics is that it is possible to incorporate *prior* knowledge about something\
    \ into our analysis, be it a model or a significance test. On the other hand,\
    \ *frequentist statistics* (which is the most popular statistical theory) do not\
    \ accommodate that, neither do they allow it.\n\nSo, for example, let’s say that\
    \ you want to run some experiment to prove that ghosts exist. You have two hypotheses\
    \ (ghosts exist or not). A Bayesian statistician can pre-assign a very small probability\
    \ to the hypothesis that ghosts do not exist based on common sense. Hence, the\
    \ experiment should find overwhelming evidence in favor of the ghost hypothesis\
    \ before the test is significant. A frequentist doesn’t have this choice.\n\n\
    Let’s see another example. Frequentist statistics are formulated under the concept\
    \ of an infinite number of experiments. For example, if you flip a fair coin a\
    \ large number of times (thousands or more), then the actual probability of flipping\
    \ heads will converge to 0.5.\n\nHowever, how can this analogy work for events\
    \ such as football games or elections? These events are unique. A game between\
    \ two teams in a specific point in time is not going to be repeated. Even if it\
    \ were, the parameters underlying it (e.g., how tired the players are or the members\
    \ of a political party) might change. We can’t perform an infinite number of these\
    \ events. A frequentist is in trouble in this case, but this is not a problem\
    \ for a Bayesian. In Bayesian statistics, probabilities express *subjective beliefs*\
    \ of events happening, not repeated experiments.\n\nBayesian statistics have proven\
    \ to be very useful and to also provide a theoretical framework for parts of machine\
    \ learning. There are still many disagreements in the statistics community as\
    \ to which theory is the best. In practice, frequentist statistics are used more\
    \ often, but there are also many applications based on Bayesian statistics. Once\
    \ again, it’s about finding the right tool for the job!\n\nFootnotes  \n[1](#490014_3_En_6_Chapter.xhtml#Fn1_source)\
    \ [2](#490014_3_En_6_Chapter.xhtml#Fn2_source) [3](#490014_3_En_6_Chapter.xhtml#Fn3_source)\
    \ [4](#490014_3_En_6_Chapter.xhtml#Fn4_source) [5](#490014_3_En_6_Chapter.xhtml#Fn5_source)\
    \ [6](#490014_3_En_6_Chapter.xhtml#Fn6_source)"
  raw: '#### Sampling Bias in the Real World


    The previous examples were all quite simple. However, the polling for the 2016
    American Presidential Election is a good case where these sampling biases combined
    to affect the results. Another example is Brexit.^([^(48)](#fn48))


    In both cases, the pollsters’ results weren’t that accurate. Most of the explanations
    of what happened revolved around biasing in sampling. There are all sorts of theories
    regarding what happened.


    For example, the Pew Research Center stated the following:


    > *One likely culprit is what pollsters refer to as* ***nonresponse bias****.
    This occurs when certain kinds of people systematically do not respond to surveys
    despite equal opportunity outreach to all parts of the electorate. We know that
    some groups—including the less educated voters who were a key demographic for
    Trump on Election Day—are* ***consistently hard for pollsters to reach**. It is
    possible that the frustration and anti-institutional feelings that drove the Trump
    campaign may also have aligned with an* ***unwillingness to respond to polls**.*^([^(49)](#fn49))


    Another theory was that there was self-selection in online polling, saying that
    people who tend to answer online polls were more likely to support a certain candidate
    over another. There was also the assumption that people who supported the other
    party wanted to avoid polls altogether.


    It once again shows how statistics can also go wrong not because of the math or
    the models but due to factors outside of our control, namely, sampling biases.


    This is similar to spurious correlations in a way, because statistics is an applied
    science and doesn’t happen in a vacuum. If you don’t have the right data, if you
    don’t have the right theory, you will still come up with a set of numbers, but
    they won’t mean anything.


    ### Lying with Inferential Statistics


    So, while it might not be that easy to lie with inferential statistics, those
    of you who might have harbored the illusion that it’s not possible at all will
    be disappointed because it can be done.


    It happens in large part in research. When you test a hypothesis, you get a p-value,
    which you want to be below a certain threshold for the test to have statistical
    significance. Usually this threshold is 0.05.


    There’s a theory about the cult of the p-value^([^(50)](#fn50)) that says there
    are a very large number of research papers out there with p-values suspiciously
    close to 0.05\. Essentially, they’re just below 0.05 so they can meet the condition
    of statistical significance. This might make the results significant, but only
    marginally so.


    The theory is that this is being done on purpose. In academia, the environment
    is very competitive and people have to publish or they’ll lose their job. Thus,
    many people are under pressure to make their p-values look more significant than
    they might actually be.


    One way to do this is to run multiple experiments until you get the results you
    want, and another way is to massage the data. In some cases, though, you might
    find research where the results are significant but the researcher’s intent is
    not to deceive, but it could be that the model assumptions are not being met.


    All models and statistics have some assumptions, and, unfortunately, there are
    many research papers out there where these assumptions are not being properly
    accounted for.


    IN-DEPTH: BAYESIAN VS. FREQUENTIST STATISTICS


    Maybe you have heard of the term “*Bayesian*.” There are many models that include
    the word “Bayes”: “Naïve Bayes,” “Bayesian networks,” “Bayesian inference,” and
    so on.


    All these refer to a school of thought behind statistics. It all started with
    the British mathematician *Reverend Thomas Bayes*, who came up with this simple
    formula:


    ![$$ P\left({A}^{\ast }B\right)=\frac{P\left({B}^{\ast }A\right)P(A)}{P(B)} $$](images/490014_3_En_6_Chapter/490014_3_En_6_Chapter_TeX_Equa.png)


    This formula describes the probability of event A taking place, given that B has
    taken place as well. This was later developed further by Pierre-Simon Laplace
    and Sir Harold Jeffreys into what is now forming the foundations of Bayesian statistics.


    One of the main ideas behind Bayesian statistics is that it is possible to incorporate
    *prior* knowledge about something into our analysis, be it a model or a significance
    test. On the other hand, *frequentist statistics* (which is the most popular statistical
    theory) do not accommodate that, neither do they allow it.


    So, for example, let’s say that you want to run some experiment to prove that
    ghosts exist. You have two hypotheses (ghosts exist or not). A Bayesian statistician
    can pre-assign a very small probability to the hypothesis that ghosts do not exist
    based on common sense. Hence, the experiment should find overwhelming evidence
    in favor of the ghost hypothesis before the test is significant. A frequentist
    doesn’t have this choice.


    Let’s see another example. Frequentist statistics are formulated under the concept
    of an infinite number of experiments. For example, if you flip a fair coin a large
    number of times (thousands or more), then the actual probability of flipping heads
    will converge to 0.5.


    However, how can this analogy work for events such as football games or elections?
    These events are unique. A game between two teams in a specific point in time
    is not going to be repeated. Even if it were, the parameters underlying it (e.g.,
    how tired the players are or the members of a political party) might change. We
    can’t perform an infinite number of these events. A frequentist is in trouble
    in this case, but this is not a problem for a Bayesian. In Bayesian statistics,
    probabilities express *subjective beliefs* of events happening, not repeated experiments.


    Bayesian statistics have proven to be very useful and to also provide a theoretical
    framework for parts of machine learning. There are still many disagreements in
    the statistics community as to which theory is the best. In practice, frequentist
    statistics are used more often, but there are also many applications based on
    Bayesian statistics. Once again, it’s about finding the right tool for the job!


    Footnotes [1](#490014_3_En_6_Chapter.xhtml#Fn1_source)   [2](#490014_3_En_6_Chapter.xhtml#Fn2_source)
      [3](#490014_3_En_6_Chapter.xhtml#Fn3_source)   [4](#490014_3_En_6_Chapter.xhtml#Fn4_source)
      [5](#490014_3_En_6_Chapter.xhtml#Fn5_source)   [6](#490014_3_En_6_Chapter.xhtml#Fn6_source)'
  trans: "\n### 现实世界中的抽样偏差\n\n前面的例子都很简单。不过，2016 年美国总统大选的民调就是一个很好的案例，展示了这些抽样偏差如何共同影响结果。另一个例子是英国脱欧。^(⁴⁸)\n\
    \n在这两个案例中，民调机构的结果并不那么准确。大多数关于事态的解释都围绕着抽样中的偏差。关于发生了什么，有各种各样的理论。\n\n例如，皮尤研究中心陈述如下：\n\
    \n> *一个可能的罪魁祸首是民意调查专家所称的* `无应答偏差`*。这种情况发生在某些特定人群系统地不回应调查，尽管调查面向所有选民群体提供了平等的机会。我们知道，有些群体——包括受教育程度较低的选民，他们在选举日是特朗普的关键支持群体——*\
    \ `一直是民调专家难以触及的对象`*。驱动特朗普竞选的沮丧情绪和反体制情绪，可能也与* `不愿回应民调` *相关。*^(⁴⁹)\n\n另一种理论认为，在线民调中存在自我选择偏差，即倾向于回答在线民调的人，更可能支持某一位特定候选人。还有一种假设是，支持另一方的人根本不希望参与民调。\n\
    \n这再次说明，统计可能出错，并非因为数学或模型本身，而是由于我们无法控制的因素，即抽样偏差。\n\n从某种程度上说，这类似于虚假相关，因为统计学是一门应用科学，并非在真空中运行。如果你没有正确的数据，没有正确的理论，你仍然可以得出一组数字，但它们毫无意义。\n\
    \n### 用推断统计撒谎\n\n那么，虽然用推断统计撒谎可能没那么容易，但那些抱有“这根本不可能”幻想的人可能会失望，因为确实可以做到。\n\n这在研究中尤为常见。当你检验一个假设时，你会得到一个`p\
    \ 值`，你需要它低于某个阈值，才能使检验具有统计显著性。通常这个阈值是 0.05。\n\n有一种关于“`p 值`崇拜”的理论^(⁵⁰)，认为有大量研究论文的`p\
    \ 值`都非常可疑地接近 0.05。本质上来说，它们刚好略低于 0.05，以便满足统计显著性的条件。这可能会使结果显著，但也只是勉强显著。\n\n这种理论认为，这是有意为之。在学术界，竞争非常激烈，人们必须发表论文，否则就会丢掉工作。因此，许多人迫于压力，要让自己的`p\
    \ 值`看起来比实际更显著。\n\n一种方法是通过反复进行实验直到得到你想要的结果，另一种方法是对数据进行处理。不过，在某些情况下，你可能会发现一些结果显著的研究，但研究者的意图并非欺骗，而可能是模型假设没有得到满足。\n\
    \n所有的模型和统计都有一些假设，不幸的是，有很多研究论文并没有恰当考虑这些假设。\n\n### 深度探讨：贝叶斯统计 vs. 频率学派统计\n\n你可能听说过`贝叶斯`这个术语。有很多模型都包含“贝叶斯”这个词：`朴素贝叶斯`、`贝叶斯网络`、`贝叶斯推断`等等。\n\
    \n所有这些都指向统计学背后的一种思想流派。这一切都始于英国数学家*托马斯·贝叶斯牧师*，他提出了这个简单的公式：\n\n```\nP(A|B) = P(B|A)\
    \ * P(A) / P(B)\n```\n\n这个公式描述了在事件 B 已经发生的情况下，事件 A 发生的概率。后来，皮埃尔-西蒙·拉普拉斯和哈罗德·杰弗里斯爵士进一步发展了这一理论，形成了如今贝叶斯统计学的基础。\n\
    \n贝叶斯统计学背后的一个主要思想是，可以将关于某事物的*先验*知识纳入我们的分析中，无论是模型还是显著性检验。另一方面，*频率学派统计学*（这是最流行的统计理论）不允许这样做，也不容纳这种情况。\n\
    \n因此，举个例子，假设你想进行一个实验来证明鬼魂存在。你有两个假设（鬼魂存在或不存在）。一位贝叶斯统计学家可以根据常识，事先为“鬼魂不存在”的假设分配一个非常小的概率。因此，在检验具有显著性之前，实验必须找到压倒性的证据来支持鬼魂存在的假设。而频率学派统计学家则没有这个选择。\n\
    \n让我们再看另一个例子。频率学派统计是基于无限次实验的概念构建的。例如，如果你抛一枚均匀硬币很多次（数千次或更多），那么抛出国徽面的实际概率将收敛于 0.5。\n\
    \n然而，这种类比如何适用于像足球比赛或选举这样的事件呢？这些事件是独一无二的。两个球队在特定时间点的一场比赛不会重复。即使重复，其背后的参数（例如，球员的疲劳程度或政党成员）也可能会改变。我们无法无限次地重复这些事件。在这种情况下，频率学派统计学家会遇到麻烦，但对贝叶斯统计学家来说就不是问题。在贝叶斯统计学中，概率表达的是事件发生的*主观信念*，而非重复实验。\n\
    \n贝叶斯统计学已被证明非常有用，并为机器学习的部分领域提供了理论基础。在统计学界，对于哪种理论最好，仍然存在许多分歧。在实践中，频率学派统计被更频繁地使用，但也有许多基于贝叶斯统计的应用。再次强调，关键在于为任务找到合适的工具！\n\
    \n脚注  \n1 2 3 4 5 6\n"
- fmt: "# 7. A Short Introduction to Machine Learning\n\nMachine learning has been\
    \ defined in many ways by different researchers. The following are definitions\
    \ from some of the most prominent researchers in the field:\n\n> *Machine learning\
    \ is programming computers to optimize a performance criterion using example data\
    \ or past experience.*\n> \n> —Ethem Alpaydin^([^(51)](#fn51))\n\n> *The goal\
    \ of machine learning is to develop methods that can automatically detect patterns\
    \ in data, and then to use the uncovered patterns to predict future data or other\
    \ outcomes of interest.*\n> \n> —Kevin P. Murphy^([^(52)](#fn52))\n\n> *The field\
    \ of pattern recognition is concerned with the automatic discovery of regularities\
    \ in data through the use of computer algorithms and with the use of these regularities\
    \ to take actions.*\n> \n> —Christopher M. Bishop^([^(53)](#fn53))\n\nSo, while\
    \ these definitions are slightly different, but in one way or another, they involve\
    \ algorithms that can learn from experience and data by identifying patterns or\
    \ using other methods. They then use what they have learned to take action.\n\n\
    Let's take a look at a simple example to gain a better understanding of how machine\
    \ learning works. In Figure [7-1](#490014_3_En_7_Chapter.xhtml#Fig1), I'm showing\
    \ you a fictional dataset that consists of images of cats and dogs.\n\n![](images/490014_3_En_7_Chapter/490014_3_En_7_Fig1_HTML.jpg)\n\
    \nFifteen monochrome photos of dogs and cats.\n\nFigure 7-1\n\n Classification\
    \ example\n\nIf I ask you which images depict dogs and which ones cats, it is\
    \ ridiculously easy to do. But how does it happen?\n\nFirst of all, your brain\
    \ has been exposed to a huge number of images of cats and dogs, but also examples\
    \ of those animals in real life. You have trained yourself to be able to discriminate\
    \ between these two and other animals through countless rounds of feedback from\
    \ sources like your family, school, and TV.\n\nHowever, this whole process isn't\
    \ quite as simple as it seems. Your brain has been optimized through thousands\
    \ and thousands of years of evolution to make these associations easily. Even\
    \ if you knew nothing about cats and dogs, your brain would quickly figure out\
    \ that these two entities look like different animals. Your brain can aggregate\
    \ these images very quickly and it immediately understands that while they are\
    \ different, they all refer to the same species.\n\nFor a machine, though, this\
    \ is much more difficult, which is why machine learning is so important because\
    \ it's about imitating this process and replicating it within a machine.\n\n##\
    \ The Main Advantage of Machine Learning\n\nLearning from data is very easy for\
    \ the human brain to do but difficult for a machine to do because it requires\
    \ the right algorithms and lots of data to achieve.\n\nHowever, what is easy for\
    \ a machine is implementation and automation. Once you've got the algorithm, it's\
    \ easy for a machine to go through thousands or even millions of images without\
    \ experiencing any fatigue, which is impossible for a human brain to do.\n\nIt\
    \ means you can create something very powerful with superhuman capabilities, even\
    \ if we're talking about a narrow field of application, such as image classification.\
    \ And this is exactly what makes machine learning and big data such a powerful\
    \ combination.\n\n## Types of Machine Learning\n\nNow, we're going to take a quick\
    \ look at the different fields in machine learning (Table [7-1](#490014_3_En_7_Chapter.xhtml#Tab1)).\
    \ The main fields in machine learning are supervised and unsupervised learning.\
    \ Reinforcement learning has been gaining ground and related fields such as recommender\
    \ systems can also be linked to machine learning, but they are more niche and\
    \ not within the scope of this book.\n\nTable 7-1\n\n Types of machine learning\n\
    \n| Name | Use |\n| --- | --- |\n| Supervised learning | Use a model `M` to predict\
    \ target variable `Y` from input `X`. |\n| Unsupervised learning | Find patterns\
    \ in variable `X` (clustering is the most common example). |\n| Reinforcement\
    \ learning | Teach an agent how to optimize a reward function over the environment.\
    \ For example, a video game AI can take ten different actions, which need to be\
    \ done as a response to the environment in order to maximize to reach a goal (e.g.,\
    \ maximize a score or beat a human player). |\n| Active learning | Supervised\
    \ learning with active feedback from a human. |\n| Semi-supervised learning |\
    \ Supervised learning, where some examples are unlabeled. For example, a dataset\
    \ of 10,000 images, where 1000 do not have a label, can be analyzed through semi-supervised\
    \ learning techniques. |\n| Recommender systems | Find a set of items to offer\
    \ to a user that the user is likely to like (e.g., movies to watch, products to\
    \ buy, songs to listen). Heavily related to supervised learning. |\n\n### Supervised\
    \ Learning\n\nSupervised learning can be classified into classification and regression,\
    \ which are both quite similar. In supervised learning, there is some form of\
    \ supervision of the algorithm. We provide the algorithm with a raw dataset, but\
    \ then we also provide it with a target. The latter can be a single variable or\
    \ multiple variables.\n\nThen, the algorithm attempts to understand how to match\
    \ the input to the output. For example, you provide the algorithm with customer\
    \ data and then it tries to determine if someone will make a purchase or not.\n\
    \nThe supervisor oversees what the algorithm is doing. Every time the algorithm\
    \ makes a mistake, the supervisor tries to correct it. It's basically like the\
    \ algorithm is learning under the guidance of a teacher.\n\n### Unsupervised Learning\n\
    \nUnsupervised learning, in the context of machine learning, usually refers to\
    \ clustering. In this case, we provide the algorithm with raw data, but instead\
    \ of providing a target, the algorithm is allowed to do its own thing essentially\
    \ and identify patterns in the data provided. It tries to find any regularities\
    \ that seem significant, but there is no supervision involved.\n\nThis type of\
    \ learning is a very difficult problem because it's ill-defined and almost always\
    \ requires a human to interpret usually toward the final stage of the pipeline.\
    \ For example, the algorithm might identify patterns that are irrelevant to what\
    \ you are trying to do, which is why you need to drill down into the results and\
    \ try to define them a little better.\n\nSupervised learning, on the other hand,\
    \ is a bit easier because you can run an algorithm and you can immediately determine\
    \ how it works. You can analyze customer data, for example, and predict retention\
    \ rates with an 80% accuracy. This is what makes supervised learning one of the\
    \ most popular fields in the machine learning family.\n\nIt's important to note\
    \ that some of the terms we are using such as classification, regression, and\
    \ clustering are used in statistics as well as machine learning. However, even\
    \ if the terminology refers to almost the same thing, there are still some differences.\n\
    \nIn statistics, interpretability is important, whereas it is of little consequence\
    \ in machine learning. Likewise, in machine learning, we are interested in the\
    \ predictive performance of the algorithm, while in statistics this is important.\n\
    \nThe terminology might seem a little confusing when comparing the terms from\
    \ statistics to machine learning because there are some models like logistics\
    \ regression models that are classification models and are treated as classification\
    \ models within the context of machine learning. The differences are mainly the\
    \ result of different histories to the fields, so don't be confused if you hear\
    \ people with different backgrounds using these terms in slightly different ways."
