  trans: '

    #### 示例 1：当数据并非核心时


    我们先来看一个案例，了解当数据科学不处于核心位置时会发生什么。这种情况往往发生在试图削减成本、资金短缺的中小型企业中。


    当一家公司想做数据科学，却又不想招聘新人时，他们可能会让内部员工去做数据科学。他们可能会雇佣一个开发人员来做机器学习，但也仅此而已。


    如果有人能监管这个软件开发人员，这倒不失为一个主意。否则，有人可能会直接运行一个从代码库获取的模型，却不知道如何正确地测试这个模型。例如，他们可能会使用交叉验证。模型上线后，最终结果却惨不忍睹，因为你已经身处危险区域。换句话说，你用了这样一个人：他具备黑客技能和领域知识，但却缺乏支撑这些工作的理论知识。


    因此，你会做出一些自己非常有信心的决策，但这些决策实际上是错误的。从技术上讲，对自己的错误充满信心，比仅仅犯错更糟糕。


    #### 示例 2：项目无法落地


    另一个常见例子主要出现在存在人员问题或沟通问题的大型组织中：你招聘了数据科学家，但他们的工作成果却无法落地。


    虽然无法落地的原因多种多样，让我们来看看其中一种情况：数据科学家不熟悉所在领域。你雇佣了一个看起来履历非常优秀的人。你也非常相信数据科学，并给予他们充分的自由和资源去做想做的事。


    问题在于，这种情况下很容易形成“信息孤岛”，尤其是当数据科学家与其它部门沟通时，某种程度上像是在说另一门语言。一个常见的错误是，数据科学家花了数月时间研发某个项目，却因为不熟悉业务领域而无法实施。他们没有意识到，由于实际工作条件的约束或缺乏商业角度的相关性，他们创造的东西根本无法落地。


    这种情况在刚毕业的博士中非常常见，他们仍然处于那种非常学术化的思维模式中，倾向于做复杂花哨的东西，而不是做那些能产生影响的简单事情。


    因此，建立正确的数据科学文化，不仅仅是基于数据做决策，更是要将创造力转化为成果。这意味着既要给予数据科学家自由和资源，又要确保有适当的检查机制，以保障其工作具有相关性，并且能够且将会被实施。


    #### 示例 3：沟通不畅


    另一个可能导致问题发生的例子是沟通不畅，这相当常见。


    假设没有人在软件开发人员和数据科学家之间负责沟通协调。尽管他们同为技术人员，但大部分时间他们讲的是不同的语言。结果就形成了“信息孤岛”，这些孤岛随后又难以打破。而信息孤岛会导致不良实践并延长开发周期。


    首先，问题在于沟通风格的差异。例如，与开发人员相比，数据科学家是否更喜欢大量使用数学和不同的表达方式？此外，对彼此工作方式缺乏了解也是一个问题。


    开发人员喜欢文档齐全，也喜欢进行测试。另一方面，数据科学家可能有不同的方法。他们甚至可能使用不同的编程语言，这也可能成为问题。


    在这种情况下，一种解决方案是尝试让人们成对工作。另一种选择是雇佣有机器学习经验的人，他们可以弥补数据科学家和开发人员之间沟通不畅的问题。


    或者，你也可以反其道而行之，雇佣一位拥有软件开发经验的数据科学家。


    还有人提议，尝试在所有部门强制执行特定的软件开发方法。


    问题在于，这些方法并不总是有效，主要是因为数据科学与软件开发有些不同，有时你可能会陷入尴尬的境地。所以，主要区别在于，数据科学的进展通常不像软件开发那样是渐进式的。它更像是“要么全有，要么全无”。


    你可能花几周时间做研究，然后突然就得到了结果。相反，在软件开发中，你可能每天都会增加一个新功能。


    因此，即便每天召开站会让大家分享工作进展并不是个坏主意，但也不要全盘照收所有关于软件方法的建议。当然，你可以借鉴这些思路，但要根据自己的具体情况进行调整。


    ## 《点球成金》：一个关于数据科学文化的故事


    体育界曾经与科技和统计的世界非常脱节。大多数体育专业人士可能会觉得讨论数据库或机器学习算法相当无聊。体育是一个完全不同的世界，而比利·比恩的方法在棒球界看来格格不入。


    比利·比恩洞察到，当时比赛中使用的大多数指标都已经过时了。球员是由那些曾担任教练或球员的球探挑选的。比利·比恩发现，像上垒率这样的统计数据比传统上使用的其他统计数据能更好地预测成功。


    通过这种方式，奥克兰运动家队能够创造出与过去完全不同的价值评估，并以大约 4400 万美元的预算与那些花费近三倍资金的球队竞争。这种方法被称为“赛伯计量学”。该术语源于缩写
    SABR，代表美国棒球研究学会。


    遗憾的是，奥克兰运动家队最终未能赢得冠军（尽管他们非常接近胜利），并且一旦其他俱乐部开始效仿他们的方法，他们就失去了优势。


    自那以后，体育界被数据科学所渗透，设备和算法主导了比赛的许多方面。体育分析会议定期举行，其中最大型的在麻省理工学院斯隆管理学院举办（`www.sloansportsconference.com`）。


    我也做过体育分析方面的研究，涉及预测运动损伤和比赛结果（例如哪支队伍会赢）。你可以在我的博客 `http://thedatascientist.com` 上了解更多。


    ## 建立数据科学文化的步骤


    让我们看看建立一种有利于数据科学的文化所需的步骤。


    ### 首先，你为什么需要数据科学？


    首先，你需要问问自己为什么需要数据科学。企业中通常有三种常见情况：


    1. 数据科学是你业务的核心组成部分：也许你是一家人工智能或机器人公司，或者你以某种方式处于深度科技领域。在这种情况下，你通常必须自己掌握相关知识。


    2. 你经营一家公司并希望提高效率，例如，你可能想要优化运营。


    3. 你想提高销售额，那么你可能想要构建推荐系统来改善面向消费者的产品/服务。


    你不太可能属于第一种情况，否则你就不会读这本书了。所以，你很可能处于第二或第三种情况，当然，这两种情况也可以结合。


    此时，你需要问问自己为什么需要数据科学，这样才能明确下一步的方向。现在，让我们来看看变革的阻力。

    '
- fmt: '# Resistance to Change


    If you’re a startup, then you’re most likely flexible so resistance to change
    won’t be an issue. If you are part of a big organization, though, the following
    will be very relevant.


    The three types of resistance to change are cultural, personal, and intellectual
    (Figure [12-3](#490014_3_En_12_Chapter.xhtml#Fig3)).


    ![](images/490014_3_En_12_Chapter/490014_3_En_12_Fig3_HTML.jpg)


    A chart has a triangle at the top, labeled intellectual, with a quote "I just
    don''t get it". 2 trapezoids below it are labeled personal, with a quote "don''t
    see what''s in it for me", and cultural, with a quote "we''ve always been doing
    things".


    **Figure 12-3** Types of resistance to change


    ## Cultural Resistance to Change


    Cultural resistance to change is what we see in *Moneyball*. We have a big and
    old organization or multiple layers of management or fields that haven’t had much
    to do with math, statistics, or data. A good example is the comparison between
    sports and finance.


    As shown in *Moneyball*, the world of sports is still trying to get deeper into
    analytics, but it’s just not there yet. Even back when the events of *Moneyball*
    took place, the kind of things that Billy Beane tried to implement in Oakland
    Athletics are nothing special in finance, which is usually one of the fields at
    the forefront of data analysis.


    ## Personal Resistance to Change


    Personal resistance to change also occurs in smaller companies and is when employees
    don’t like the change.


    To give you an example from personal experience, I worked with a client and waited
    two months for someone to give me a database expert. Then, I had to call the supervisor
    and wait another month.


    What may have happened is that the employees could have been over-worked and they
    were handed even more work. So, the employees don’t really see any benefit out
    of doing anything, like exporting a database or trying to implement an algorithm.


    ## Intellectual Resistance to Change


    Finally, we have the case where people are afraid of what they don’t understand.
    Think Skynet in *The Terminator* movie, as in when people are terrified that machines
    will take over the world.


    There isn’t a lot of intellectual resistance to change in organizations because
    most understand that data can be useful since it can improve efficiency and sales.
    However, if there’s the slightest hint of intellectual resistance to change, this
    is where hiring a good data officer can be a good start. This is someone who can
    own the data and can show it to people, as well as showing how it can improve
    pretty much everything within a company.


    # The Journey to Change


    When it comes to your journey to change, there are three important points to remember.
    First, you have to determine how data scientists will get you there. This means
    creating a data science–friendly environment where they can talk about it and
    trying to run projects with a large potential impact. Change is slow, but if people
    start seeing results, then they’ll slowly change their minds because they will
    understand the benefits.


    It’s very important to also find a champion in some cases. This is someone who
    can create enthusiasm in this new direction. The champion is someone who truly
    believes in this new approach, and they have the enthusiasm and the status to
    actually push the rest of the company toward this new goal.


    It’s usually a high-ranking employee who is also well liked. It could be you or
    it could be a data scientist or the chief data officer.


    Generally, the best option is for it to be someone who is already in the organization
    and is popular, someone people respect and listen to regardless of what they’re
    talking about. This could also help employees see this as a learning experience
    and something more positive for the company and hence for themselves.


    The final point to remember on your journey to change is that it’s important to
    focus on benefits for the employees because everyone hates having to do more work
    with no reward. However, employees who are intellectually curious and driven will
    see the benefits of learning and also helping the organization since this can
    translate into results for themselves.


    # How to Start


    When it comes to implementing a data science culture, I’ve seen two approaches.
    The first is the baby steps approach, and the second is the use case approach.


    In the baby steps approach, you collect lots of data and the decision-makers educate
    themselves in data science. Then, they try to use simple graphs and stats, so
    they become more data informed. Once they feel comfortable with the data, they
    take the next step and hire someone to make sense of the data.


    The use case approach is more of a top-down approach. This is when a company has
    a certain type of problem, and they set up a plan and might start by hiring someone
    to help them design the plan and solve the particular problem. Then, they’ll consider
    how the findings are relevant to other use cases.


    The baby steps approach is the most common because it’s easy to collect and visualize
    data in Excel or maybe a dashboard. This happens when a company is interested
    in data because they hear that everyone else is collecting and using data, but
    it’s not really a priority.


    So, at one point, the company has solved its main problems and is profitable,
    and they decide to hire someone because they have all this data and want to do
    something with it. This approach makes sense because it’s not too disruptive to
    current operations, and if data collection is not your priority, you don’t have
    to push things too far, too fast.


    However, it can also cause all sorts of problems. It’s a slower way of adopting
    data science, but then you also get all the issues we talked about in Chapter
    [2](#490014_3_En_2_Chapter.xhtml). In other words, a bunch of data is collected
    with no prior thought or goal, and it turns into a disaster.


    The use case approach is less common, and it happens when the company has a clear
    use case. The advantage is that it can provide more immediate results using a
    more targeted approach. However, it requires some level of data awareness and
    the company needs to have access to a data scientist they can trust.


    Note that a company doesn’t have to choose one approach over another. Quite often
    they might start with the first approach and end up with the latter.


    # Where to Start


    The where is just as important as the *how*. So, you first want to map your organization’s
    use of data. You need to understand the flow of data from collection to usage
    and discover any dark data you might have.


    Also, emphasize strategy and innovation and try to help employees understand why
    this is important. Reward good behavior, which is very important for data scientists.
    Many data scientists want recognition and to feel as if they are making an impact
    on the world or in their company. Thus, promoting good work on a blog and social
    media will help a lot, as well as sharing the best use cases with everyone in
    the company.


    Finally, creating an embedded culture is the way to break down silos and improve
    communication. You want data scientists to work closely with developers, the product
    owners, and the managers.


    This is the only way to make sure that the research is relevant, that the results
    are implemented, and that they have an impact within the company.'
