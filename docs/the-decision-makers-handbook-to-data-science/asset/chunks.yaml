    we use a 5% threshold), then we reject the null hypothesis and accept the alternative
    hypothesis.


    In business you mainly encounter hypothesis testing in the context of A/B testing.
    So, when someone is testing two headlines against each other to see which generates
    the highest click-through rate, for example, they are conducting a comparison-based
    hypothesis test.


    See Table [6-1](#490014_3_En_6_Chapter.xhtml#Tab1) for examples of statistical
    tests.


    Table 6-1


     Some examples of statistical tests


    | Name | Use |

    | --- | --- |

    | T-test | Used to test the equality of the means between two groups |

    | ANOVA | Used to test the equality of the means of multiple groups |

    | Test of proportions | Used to test the equality of proportions in two groups
    |

    | Wilcoxon signed rank test | Non-parametric alternative to the t-test |

    | Smirnov-Kolmogorov test | Used to test whether a variable is normally distributed
    |

    | Friedman test | Non-parametric alternative to ANOVA |


    #### Statistical Modeling


    Statistical modeling is used mainly when you are interested to determine whether
    one variable influences another.


    For example, let’s say that you’ve conducted the hypothesis test regarding men
    earning more money than women in the same position and have come to the conclusion
    that the statement is accurate. However, you want to discover what other variables
    might affect income. To achieve this, you turn to statistical modeling.


    Figure [6-2](#490014_3_En_6_Chapter.xhtml#Fig2) shows an example of linear regression,
    the most famous statistical model.


    ![](images/490014_3_En_6_Chapter/490014_3_En_6_Fig2_HTML.jpg)


    A line and dot plot. A line passes through (negative 20, 2), (0, 5), (20, 8),
    (40, 12), (60, 14). Dots surround the line. All values are approximate.


    Figure 6-2


     Example of simple linear regression


    So, you enter these variables into the model and discover that income is also
    affected by age, experience, previous employment, and more. You can also find
    out to what degree these variables affect the response variable—or the variable
    of interest—which is income level in our case.


    Have you ever heard of *linear regression*, *logistic regression*, or the *generalized
    linear model*? All these are examples of statistical models. These models form
    the basis of models used in other more specialized fields such as econometrics
    and psychometrics. See Table [6-2](#490014_3_En_6_Chapter.xhtml#Tab2).


    Table 6-2


     Examples of statistical models


    | Name | Use |

    | --- | --- |

    | Multiple linear regression | Most common statistical model, used when the response
    variable is numerical |

    | Poisson regression | Used when the target variable consists of positive integers
    |

    | Logistic regression | Used for binary outcome variables, for example, understanding
    the differences between two types of customers |

    | Survival modeling | Used when we care about the time something will take until
    it fails, for example, a mechanical part |

    | Log-linear model | Model used to examine the relationship between more than
    two categorical variables |


    ## Misleading with Statistics


    People tend to trust statistics blindly and this can be a problem. It’s natural
    to be accepting of what seems like complete facts, especially when they are supported
    with lots of figures and charts and so on. However, the fact is that statistics
    can be used to deceive people. They can also lead to skewed results because of
    mistakes.


    This section is essential because statistics is used in the wrong way quite often.
    We’ll look at cases where statistics are being abused, and it’s important for
    you to become aware of the many ways things can go wrong and also of the cases
    when people are trying to deceive you. This way, you’ll be in a position to make
    better informed decisions.'
  trans: '

    ### 推断性统计学示例


    我们先来看几个推断性统计学的例子，这样不仅能让你更深入地理解这个概念本身，还能了解如何将其应用到你的业务中。


    `假设检验`和`统计建模`是你使用推断性统计学的两个主要领域。


    `预测`是另一个领域，它代表了一组用于预测未来数值的工具和方法。不过，我们不会深入探讨预测，因为它技术性更强、更进阶，并且通常可以通过机器学习来完成。


    #### 假设检验


    `假设检验`通常用于两个目的：一是找出总体参数的值，二是进行比较。确定总体值实质上就是找出例如某个群体的平均身高或他们的平均收入是多少。


    另一方面，比较涉及探索相似参数之间的差异和/或相似性。例如，你可以根据性别探索差异，比较在同一工作中男性和女性谁挣得更多。


    `假设检验`是科学中极其重要的工具。例如，每当你听到关于新药的临床试验时，都会用到假设检验来检测是否观察到显著效果。在进行假设检验时，我们实质上是在比较两个假设：`零假设`和`备择假设`。因此，在临床试验的背景下，零假设就是新药对这种疾病没有效果。


    假设检验会产生一个称为`p 值`的结果。这是给定数据后，零假设为真的概率。如果`p 值`很低（通常我们使用 5%的阈值），那么我们就拒绝零假设，接受备择假设。


    在商业中，你主要在`A/B 测试`的场景下遇到假设检验。例如，当某人测试两个标题以查看哪个能产生最高的点击率时，他们就是在进行基于比较的假设检验。


    有关统计检验的示例，请参见表 6-1。


    **表 6-1** 一些统计检验示例


    | 名称 | 用途 |

    | --- | --- |

    | `T 检验` | 用于检验两组均值是否相等 |

    | `方差分析` | 用于检验多组均值是否相等 |

    | `比例检验` | 用于检验两组比例是否相等 |

    | `威尔科克森符号秩检验` | `t 检验`的非参数替代方法 |

    | `斯米尔诺夫-科尔莫戈罗夫检验` | 用于检验变量是否服从正态分布 |

    | `弗里德曼检验` | `方差分析`的非参数替代方法 |


    #### 统计建模


    当你需要确定一个变量是否影响另一个变量时，主要会用到`统计建模`。


    例如，假设你已经针对“同一职位男性比女性挣得多”这一说法进行了假设检验，并得出结论该说法是准确的。然而，你想发现还有哪些其他变量可能影响收入。为此，你转而求助于统计建模。


    图 6-2 展示了一个线性回归的例子，它是最著名的统计模型。


    ![](img/490014_3_En_6_Fig2_HTML.jpg)


    一幅包含一条直线和散点的图表。一条直线穿过（负 20，2）、（0，5）、（20，8）、（40，12）、（60，14）这些点。散点分布在直线周围。所有数值均为近似值。


    **图 6-2** 简单线性回归示例


    所以，你将这些变量输入模型，发现收入还受到年龄、经验、先前工作经历等因素的影响。你还可以找出这些变量对响应变量（即我们感兴趣的变量，在本例中是收入水平）的影响程度。


    你是否听说过`线性回归`、`逻辑回归`或`广义线性模型`？所有这些都是统计模型的例子。这些模型构成了其他更专门领域（如计量经济学和心理测量学）中使用模型的基础。参见表
    6-2。


    **表 6-2** 统计模型示例


    | 名称 | 用途 |

    | --- | --- |

    | `多元线性回归` | 最常见的统计模型，当响应变量为数值型时使用 |

    | `泊松回归` | 当目标变量由正整数组成时使用 |

    | `逻辑回归` | 用于二分类结果变量，例如，理解两类客户之间的差异 |

    | `生存模型` | 当我们关心某物（例如一个机械零件）失效所需的时间时使用 |

    | `对数线性模型` | 用于检验两个以上分类变量之间关系的模型 |


    ### 用统计误导他人


    人们倾向于盲目信任统计数据，这可能会成为一个问题。接受看似完整的事实是很自然的，尤其当这些事实有大量数据和图表等支持时。然而，事实是统计数据可以被用来欺骗人们。也可能因为错误而导致结果偏差。


    这一节至关重要，因为统计被滥用的情形相当普遍。我们将审视统计学被滥用的案例，认识到事物可能出错的诸多方式以及有人试图欺骗你的情况，这对于你来说非常重要。这样，你就能做出更明智的决策。

