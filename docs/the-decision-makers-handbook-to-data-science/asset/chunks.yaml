  trans: '

    ### 第一部分：思考数据


    此时，你需要思考回答第一步中提出的问题需要哪些数据。然后，你必须决定如何收集相关数据。


    首先，写下所有相关定义，并思考收集数据时将要使用的协议。问题往往从这里开始出现，你会意识到，即便是简单的问题，也可能涉及一系列不同的难题。


    以我们的例子来说，我们想研究会议延迟开始的情况。但要做到这一点，我们需要定义会议实际开始的时间。起初这看似简单，但如果你仔细思考，这个定义其实并不那么明确。


    那么，会议是在有人说“该开始了”的时候开始？是日历上预定的时间？还是会议实际工作开始时——你知道的，在闲聊完老板的孩子、狗、猫、仓鼠和鳄鱼之后？又或者，最初几分钟内的那些寒暄也是会议的一部分？有些人可能认为这部分是浪费时间，而另一些人则觉得它对建立人际关系很重要。


    这看似微不足道，但所有这些都是重要的，因为事情可能会出错。主要风险在于你使用了错误的定义，从而阻碍你解决问题。


    例如，会议可能因为寒暄而经常延迟开始。然而，当你写下定义时，并没有将这种寒暄考虑进去，因此记录了不同的会议开始时间。所以，你无法解决问题，因为原因完全从数据中缺失了。结果，你不得不回去重新收集数据，从而浪费了时间、精力和资源。


    ### 第二部分：收集数据


    既然你已经定义了数据，是时候进入项目的收集阶段了。首先要考虑的是，你需要的是可以信任的数据，这可能比听起来要困难得多。


    数据可能会遇到各种问题，例如缺失值、错误条目、定义问题等等。而且这些问题相当普遍。我们在上一节中已经讨论过这些问题，以及如何预防或解决它们。


    由于这些问题，保持灵活性和适应性是个好主意。例如，如果在进展过程中事情没有按预期进行，修改你的定义和数据收集协议可能是个好主意。


    那么，回到我们的会议例子。假设你最初的定义不包括会议中的“寒暄”部分。然而，你意识到它极其相关，因为它将实际会议的开始时间延迟了大约 30 分钟。好吧，如果数据没有显示问题的存在，你就无法解决它，所以你需要回去修改定义，同时也要改变收集数据的方式。


    不过，至关重要的是，要保持完全的透明度，并对你更改了什么、如何更改、何时更改等等进行完整记录。这很重要，因为你可能会遇到这样的情况：变量含义完全不同，却使用了相同的术语来定义它们。


    例如，假设你没有记录将寒暄纳入会议部分的决定。你记录的会议开始时间变了，但没人知道，因为你没有记录这个变更。


    然后，你和数据科学家一起梳理数据，他却搞不懂为什么没有任何东西能正常工作。


    原因当然是，`start time`（开始时间）变量根据其在项目中被记录的时间点（即在你做出修改之前或之后）有两种不同的定义。


    实际上，你处理的是两个变量，而不是一个，这会严重扰乱任何统计模型。


    这只是一个例子，说明如果你不记录所做的一切，事情可能会出错。还有更多情况可能发生，导致灾难性的结果。


    由于你不是数据科学专家，你无法预见到数据可能出现哪些问题，这就是为什么你需要对正在发生的事情完全透明，并记录你做的每一件小事。


    请记住，你总是希望让数据科学家的生活*尽可能轻松*，因为这样他们就能更快地进入状态，并开发出更有效的解决方案，从而帮助你节省时间和金钱，同时大幅提升效率和生产力。


    ### 第三部分：解决问题


    在这个阶段，作为领域专家，你能做的事情不多，因为这主要是数据科学家的工作。不过，让我们快速了解一下这一步骤通常包含哪些内容，以便你对正在发生的事情有个概念。


    通常，大多数数据科学家喜欢从探索性数据分析开始。他们使用汇总指标、图表等来更好地理解问题。在某些情况下，他们甚至可能向利益相关者展示一些初步发现。


    因此，在我们的例子中，数据科学家可能会这样说：


    “在两周的时间里，有 10%的会议准时开始。平均而言，会议延迟 12 分钟开始。”


    或者他们可能会发现，当会议涉及主题 X 和 Y，并且某些人（比如喜欢事无巨细地跟大家讲他周末干了什么，而且似乎没人能让他停下来）参加会议时，会议通常会延迟开始。


    然后，数据科学家会构建一个模型来寻找解决方案，但模型主要用于回答特定问题。你可以有一个主要问题，在我们的例子中，可能是：


    人们开会通常都会迟到吗？


    但你也可以有一些次要问题。在我们的例子中，它们可能是这样的：


    -   所涉及的主题是否会影响会议时长？

    -   与会人员是否会影响会议延迟的程度？

    -   延迟的会议是否会被提前结束的会议所抵消？

    -   总的会议时间是多少？你能用分布来描述它吗？


    当然，所有这些问题都是相关的，这意味着可以回答不止一个问题。不过，请记住，当你把问题表述为一个问题时，你就是在帮助数据科学家。他们将能够更好地理解如何将模糊的数据转化为一个可用于解决问题的模型。

    '
- fmt: '### Step 4: Creating Value Through Actionable Insights


    By this point, the data scientist has built one or more models to answer the aforementioned
    questions, so we can move on to the final step, namely, to extract actionable
    insights from the models.


    Essentially, the models are useless if you don’t act on them. The first step to
    taking action is to understand the impact of the results. A good way to do that
    is to translate the findings into monetary terms. In other words, if the time
    period studied for late meetings is typical, then each employee loses an hour
    per day, which costs the company `$X` per year.


    Another approach to understanding the impact of the results is by identifying
    specific individuals or culprits behind the problem. So, in our example, we could
    say that person X is responsible for late meetings, so what can we do to solve
    the issue? Could we help them manage their time better? Would that help fix the
    problem?


    Based on this understanding you gain from the results, you can then take action.
    It’s also a good idea to go beyond the results, though. This cycle of modeling,
    translating the results, and then taking action can also be a very good learning
    experience for you. When you go through this process, other questions pop up.
    This is the point when some of those secondary questions mentioned in step 3 arise.
    It also makes sense to build models for these secondary questions too since the
    data is already there and the data scientist has gained experience with the data.
    It pays to make the most out of the data.


    # A Short Introduction to Statistics


    Statistics has two branches, namely, descriptive statistics and inferential statistics
    (Figure [6-1](#490014_3_En_6_Chapter.xhtml#Fig1)).


    Descriptive statistics is what most people associate with the word **statistics**.
    These are things that you’ve probably done in high school. They include things
    like collecting data, using summary metrics such as the mean, and visualizing
    data.


    Inferential statistics is what most statisticians think of when they think of
    the word **statistics**. It involves more advanced concepts such as sampling and
    inferring the values of the parameters of the population.


    ![A chart presents branches of statistics as descriptive and inferential. Under
    descriptive are collecting, organizing, summarizing, and presenting data. Under
    inferential are hypothesis testing, determining relationships, and statistical
    modeling.](images/490014_3_En_6_Chapter/490014_3_En_6_Fig1_HTML.jpg)


    **Figure 6-1** The two branches of the science of statistics


    ## Descriptive Statistics


    Descriptive statistics deals with organizing, summarizing, and presenting data
    in a convenient and informative way. Two sets of methods are used in this type
    of statistics.


    First, there are numerical methods for describing the data. These include measures
    for the location of the data, like mean, median, and mode. They also include measures
    of the variability of the data, such as the range, variance, and standard deviation.


    The second set of methods cover graphical means of presenting data, which you
    probably know quite well, such as bar charts, pie charts, histograms, and so on.


    I like to refer to descriptive statistics as “high school statistics.” The reason
    is that most people are taught descriptive statistics in high school and they
    think that descriptive statistics are representative of the overall field of statistical
    science. However, the truth is much different.


    ## Inferential Statistics


    When a statistician is talking about statistics, this is usually what they refer
    to. Inferential statistics is much more interesting and useful than descriptive
    statistics. It basically represents 90% of statistics, with descriptive statistics
    representing merely the tip of the iceberg.


    Thus, inferential statistics is a body of methods used to draw conclusions or
    inferences about the characteristics of a population based on sample data. Some
    of the fundamental terminology used in inferential statistics includes:


    - Data, elements, variables, and observations

    - Population: The group of all the items a statistician is interested in

    - Sample: A set of data drawn from the population

    - Parameter: A descriptive measure of a population

    - Statistic: A descriptive measure of a sample

    - Inference: A set of methods, such as estimation, testing, and prediction, used
    to draw conclusions or inferences about the traits of a population based on data
    from a sample


    So, what does this all mean? What does inferential statistics actually do?


    Inferential statistics allows us to quantify uncertainty. In other words, let’s
    say you want to find out something about a population. Let’s go with something
    simple, like the average height of the people in a country.


    Now, to determine this figure, the first thought would be that you have to take
    every person in that country to determine their height. Or, measure every person.
    When a country has a population of 50 million, that isn’t going to be an easy
    undertaking. Even for something so simple, you are going to be spending a lot
    of time and money trying to talk to every person. Studying every individual is,
    at the very least, impractical, but in most cases impossible.


    With inferential statistics, you can take a sample of the population and express
    uncertainty through a probability distribution. It helps us turn the uncertainty
    into a quantifiable metric, which then allows us to run calculations. This is
    what allows us to do statistical modeling and hypothesis testing.


    So, essentially, what happens is that you can take a sample of 1000 people, for
    example, and extrapolate their average height to the entire population of 50 million.
    And working with a thousand people is much, much easier than trying to work with
    50 million.


    This idea of expressing uncertainty using a probability distribution is a simple
    but extremely powerful idea. Humanity owes a lot to the founding fathers of statistics,
    people such as Ronald Fischer, Jerzy Neyman, and Karl Pearson, who came up with
    methods such as ANOVA and multiple linear regression and built up the mathematical
    foundations of much of modern statistics.


    Without inferential statistics, most sciences would lack the tools to make informed
    decisions. Every time you hear about a study in medicine, psychology, economics,
    or otherwise, you should know this is possible due to inferential statistics.


    ## How to Use Statistics


    Okay, so now it’s time to look at how you can use statistics. Once again, we’ll
    be taking a high-level view and won’t be looking at it from a statistician’s or
    data scientist’s perspective, but from a non-technical decision-maker’s perspective.


    First of all, it’s likely that you’re already using descriptive statistics in
    some shape or form. Metrics like the mean and the median or plots and graphs like
    bar charts and histograms are something that most people can relate to. However,
    it’s important to be aware of some of the pitfalls that could pop up, which we
    will discuss in greater detail a little later.


    Then you have inferential statistics, which is useful in two situations. It can
    be used to answer particular questions about variable importance, but also to
    answer questions about differences in population.


    By the end of the section, you should understand that statistics is always used
    to make a case supporting a hypothesis or story, and this involves the extensive
    use of descriptive statistics. While inferential statistics will often be employed
    in the analysis, it tends to be with descriptive statistics.


    Thus, you as an executive, manager, founder, or decision-maker need to be able
    to understand whether you can use statistics to answer a question and whether
    the story makes sense and to avoid all the pitfalls and fallacies that can be
    involved in statistical inference and the presentation of results.'
  raw: '### Step 4: Creating Value Through Actionable Insights


    By this point, the data scientist has built one or more models to answer the aforementioned
    questions, so we can move on to the final step, namely, to extract actionable
    insights from the models.


    Essentially, the models are useless if you don’t act on them. The first step to
    taking action is to understand the impact of the results. A good way to do that
    is to translate the findings into monetary terms.


    In other words, if the time period studied for late meetings is typical, then
    each employee loses an hour per day, which costs the company $X per year.


    Another approach to understanding the impact of the results is by identifying
    specific individuals or culprits behind the problem.


    So, in our example, we could say that person X is responsible for late meetings,
    so what can we do to solve the issue? Could we help them manage their time better?
    Would that help fix the problem?


    Based on this understanding you gain from the results, you can then take action.


    It’s also a good idea to go beyond the results, though. This cycle of modeling,
    translating the results, and then taking action can also be a very good learning
    experience for you. When you go through this process, other questions pop up.
    This is the point when some of those secondary questions mentioned in step 3 arise.


    It also makes sense to build models for these secondary questions too since the
    data is already there and the data scientist has gained experience with the data.
    It pays to make the most out of the data.


