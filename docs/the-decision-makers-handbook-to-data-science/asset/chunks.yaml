    `# 深度学习`


    深度学习是研究*深度神经网络*的领域，这是一种包含多个层的神经网络。普通神经网络通常只有一两个层，而深度神经网络的层数则要多得多（图 1-2）。


    ![](img/490014_3_En_1_Fig2_HTML.jpg)


    简单神经网络与深度学习神经网络示意图。简单神经网络包含 1 个输入层、1 个隐藏层和 1 个输出层。深度学习神经网络包含 1 个输入层、4 个隐藏层和 1
    个输出层。


    图 1-2


    常规神经网络与深度神经网络的对比示例


    被誉为“深度学习之父”的英国认知心理学家和计算机科学家杰弗里·辛顿发现，他关于神经网络的研究成果难以发表，于是不得不发明一个“更酷”的新术语。^(²³)


    神经网络由神经元及其在大脑中连接的路径构成。由于人脑是人类已知最强大的计算设备，模仿其架构的做法自然合情合理，这便催生了人工神经网络的诞生。


    传统上神经网络由三个层组成：输入层、中间层和输出层。中间层赋予神经网络执行非线性计算的能力，使其成为强大的学习机器。


    深度学习的概念已经存在了几十年。^(²⁴) 然而，人们曾认为增加更多层数并无实际用处。此外，训练这些网络也相当困难。


    深度学习利用人工神经网络使机器能够更快、更准确且大规模地学习。因此，它被用来帮助开发解决许多此前无法解决的问题的方案，例如语音识别、计算机视觉和自然语言处理。


    例如，得益于深度学习，Siri 或 Cortana 等应用能够理解你的需求。图像识别功能可以帮助你找到现实中看到的家具。只需拍下家具的照片，应用程序就能在线为你找到它。


    借助深度学习，机器还能识别照片中的不同主体——比如区分人类、马、猫或狗。它还可以用于自动为照片着色，最近甚至能自动移除照片背景，这让许多设计师感激不尽。


    它还被用于自动生成文本。换句话说，得益于深度学习，你的电脑可以听写你的话语，并将其转化为文字。


    基本上，深度学习能做很多很酷的事情！


    但它究竟是如何做到的，又为何如此有效？深度神经网络的多个层使其能够提取*层次化特征*。我们的视觉系统在结构上就是分层的。大脑先识别简单的斑点和边缘，然后识别形状（如正方形和圆形），进而识别面部特征或其他更高级的概念。深度神经网络本质上模仿了这种功能。如果我们观察深度神经网络中间层所做的处理，就会发现它们提取了特征的层级结构。这正是深度神经网络在计算机视觉和语言应用中如此成功的原因。这些领域本质上都由层次化特征主导。ConvNet
    Playground^(²⁵)提供了一个模型探索器，让你能够看到 Inception（一个著名的深度神经网络）的不同层如何随着网络加深，为图像创建越来越复杂的表征。


    然而，深度神经网络并非万能灵药。^(²⁶) 如果领域特征并非由多个交互变量或特征层级结构构成，或者数据量不足，那么使用深度神经网络可能适得其反。例如，如果你有一个包含
    1000 行数据和十个变量的数据集，使用更简单的模型（如线性回归）会好得多，因为这种模型训练更快，且更不容易*过拟合*。


    过拟合^(²⁷)是所有机器学习算法的祸根，指的是模型在现实世界中的表现远差于训练时的表现。更复杂的模型更容易出现这个问题。这就是为什么深度神经网络需要大量的调优和测试来确保其良好运行。


    ## 统计学


    数据科学的另一个核心领域——统计学，是数学的一个分支，大约起源于 18 世纪，是首次系统分析数据的尝试。它为所有现代数据分析奠定了基础，包括描述性统计、回归与分类、显著性检验、预测等。


    ### 统计学的独特之处何在？


    统计学通常处理较小的样本，这在很大程度上是历史原因造成的。互联网使得如今收集大量数据成为可能，但在“古代”，数据通常需要人工收集，因此样本量非常小。


    随后，结果会在一定误差范围内外推至整个总体。此外，考虑到它诞生于 17 世纪，这意味着所有计算都必须手工完成。^(²⁸) 求解一个模型可能需要数天或数周。


    统计学在模型假设和开发方面也非常严格，因为它根植于数学。从这个意义上说，它几乎类似于经典人工智能。在机器学习的部分内容建立在贝叶斯统计学基础之上后，这种差距确实有所缩小。


    然而，两者的思维方式仍然不同。在机器学习中，重点是先完成任务，之后再提出问题。而在统计学中，必须先验证和确认假设，然后才能进行其他工作。


    虽然统计学提供了更高的透明度和可解释性，但机器学习却带来了令人难以置信的性能。这种惊人的性能使我们能够完成以前认为不可能的任务！


    当然，必须记住，机器学习是计算机时代的产物，意味着计算速度快得多。一个模型不再需要数天的工作，只需几分钟——甚至更短——并且一天之内可以尝试多种方法。


    ### 对决：统计学 vs. 机器学习


    一些统计学家对机器学习极为排斥。^(²⁹) 近乎宗教般的排斥。有时，这甚至有点令人担忧。他们的问题在于机器学习缺乏透明度和理论支撑。


    然而，实际上，统计学和机器学习是同一枚硬币的两面。而且，它们都是数据科学家工具箱中的工具，可以根据实际情况加以应用。因此，如果你追求可解释性，统计学是最佳选择；而若想要更强的预测能力，机器学习则更胜一筹。

    '
- fmt: '### Subfields of Data Science


    In parallel to the development of the aforementioned core fields of data science,
    other fields were also being developed. These were all related in some way to
    data analysis, artificial intelligence, and so on. Such fields include cybernetics
    developed by Norbert Wiener in 1947, artificial neural networks thanks to McCulloch
    and Pitts in 1943, computational intelligence developed in 1990, machine learning
    developed in 1959, and data mining and knowledge discovery in databases thanks
    to Gregory Piatetsky-Shapiro in 1990.^([^(30)](#fn30))


    The problem with all these terms is that not everyone perceives them in the same
    way necessarily, or the relationship between them. In some cases, there are conceptual
    differences between them, but sometimes it’s a matter of who the person talking
    about them is and what their research background is. There’s also the matter of
    marketing, which can also give a different spin to a particular subfield.


    For example, some people consider AI as the core field with natural language processing,
    expert systems, neural networks, fuzzy logic, and robotics as satellite fields.
    Others consider that AI is part of computer science, while curated knowledge,
    machine learning, and reverse engineering the brain are essential to AI. Yet others
    believe machine learning, deep learning, and representation learning to be contained
    within AI.


    In other words, people have different interpretations of what all these technical
    terms mean and how they relate to each other, which can make it very confusing.
    To further prove my point, the following is a definition for computational intelligence
    at the 11th UK Workshop on Computational Intelligence.


    > *Computational Intelligence (CI) is an offshoot of artificial intelligence in
    which the emphasis is placed on heuristic algorithms such as* **fuzzy systems,
    neural networks** *and* **evolutionary computation**. *It is usually contrasted
    with ‘traditional’, ’symbolic’ or ‘* **good old fashioned artificial intelligence
    (GOFAI)** *’. The IEEE Computational Intelligence Society uses the tag-line ‘*
    **Mimicking Nature for Problem Solving** *’ to describe Computational Intelligence,
    although mimicking nature is not a necessary element.*

    >

    > *In addition to the three main pillars of CI (fuzzy systems, neural networks
    and evolutionary computation), Computational Intelligence also encompasses elements
    of* **learning, adaptation, heuristic** *and* **meta-heuristic optimization**,
    *as well as any hybrid methods which use a combination of one or more of these
    techniques. More recently, emerging areas such as artificial immune systems,*
    **swarm intelligence, chaotic systems**, *and others, have been added to the range
    of Computational Intelligence techniques. The term ‘* **Soft Computing** *’ is
    sometimes used almost interchangeably with Computational Intelligence.*^([^(31)](#fn31))


    Now, let’s take a look at the definition for Knowledge Discovery in Databases.


    > *The term Knowledge Discovery in Databases**, or KDD for short, refers to the
    broad process of finding knowledge in data, and emphasizes the “high-level” application
    of particular data mining methods. It is of interest to researchers in* **machine
    learning, pattern recognition, databases, statistics, artificial intelligence,
    knowledge acquisition for expert systems, and data visualization**. *The unifying
    goal of the KDD process is to extract knowledge from data in the context of large
    databases.*^([^(32)](#fn32))


    The bolded terms show the overlap between all the fields and subfields, to the
    point where some of the core fields are considered subfields of the subfields.
    Yes, it’s confusing and that’s exactly the point.


    All these fields are interdisciplinary in the sense that they borrow tools from
    each other, and though they might sometimes take a different approach, there is
    still so much overlap that it is incredibly problematic. It’s even confusing for
    the people who study these fields.


    Take *Pattern Recognition and Machine Learning* by Christopher M. Bishop,^([^(33)](#fn33))
    which was one of the most important textbooks for machine learning. Everyone has
    read it and yet, one has to wonder at the difference between pattern recognition
    and machine learning. However, once you get into it, you realize that it gets
    into statistical theory and, generally, just makes things much more complicated.


    And that’s not even close to the end of the matter. There are many other related
    popular buzzwords and fields, such as:


    * Natural Language Processing, which is a subfield of machine learning focused
    solely on language—generally it relies on text but can also include speech.

    * Recommender systems, which is a field dedicated to the study of recommendation
    engines like the ones used by Amazon and Netflix.

    * Predictive analytics, which isn’t a sub-discipline but a term that refers mainly
    to the development of predictive models, that is, algorithms that can predict
    the future. The latter can be developed using either machine learning or statistics.


    In other words, it’s all really, really confusing, which is where the term “Data
    Science” comes in.'
