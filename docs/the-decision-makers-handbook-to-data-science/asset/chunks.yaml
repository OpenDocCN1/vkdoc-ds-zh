  raw: 'So, you have to be careful because if they fall in the danger zone, these
    domain specialists could cause more problems than you realize. It’s really a good
    time to keep in mind the saying that if all you have is a hammer, then everything
    looks like a nail. For example, someone who is an expert in deep learning and
    has been doing it their whole life might believe that they can solve every problem
    using deep learning, which is not accurate. This is why you need to be careful.
    After all, sometimes you just need a fly swatter to get rid of that pesky buzzing.


    However, as I previously mentioned, you should consider being more open to people
    who are aware of their limitations and are looking beyond their usual domains
    because they want to try something new. These people know it will take them a
    few months to learn the particulars of the new field, but they are more than willing
    to put the work in. Sometimes, taking this route pays off in more ways than one
    because you’ll also earn their loyalty in the process as there aren’t as many
    employers out there who are as enlightened as you and willing to give them a chance.


    EXAMPLE: HOW TO EVALUATE A DATA SCIENTIST?


    Whom would you rather hire to become your data scientist?


    1.  Someone who has finished in a top 10 university with an MSc in Machine Learning?


    2.  A developer who taught himself how to do data science?


    3.  Someone with a degree in statistics and 10+ years of experience?


    The truth is that there is no correct answer. Job performance can depend on multiple
    factors. A quick search on Google Scholar returns a huge number of results. For
    example, the search term “IQ and job performance” returns more than 200,000 studies,
    most of them citing a correlation between IQ and job performance of around 0.5,
    which is significant. The term “years of experience and job performance” returns
    more than 4 million results, and the term “job performance predictors” returns
    more than 1 million results, with papers citing factors from emotional intelligence
    to personality.


    The truth is that in every case it is different. In data science and technology,
    it is easy to find cases of employees with great credentials, who fail to perform
    on their role. Cultural fit, personality factors, and personal circumstances can
    all play a role in an employee’s performance.


    However, what you can do in order to make sure that employees perform at their
    best is to create the right environment. This is why in the appendix you are going
    to find some tools that can help you structure a data science project in a way
    that you can define clear outcomes and understand what skills someone should have
    to help you out with this project.


    As a rule of thumb, when you are hiring for projects that are non-time critical,
    then cognitive abilities, IQ, and drive might be the most important factors.^([^(82)](#fn82))
    If, for example, you have a data science team in place that can help nurture someone
    with the right drive, then you might be able to get someone on a not very high
    salary, who will grow alongside the rest of your data science team.


    On the other hand, when you are under time constraints, the best approach is to
    hire someone with lots of experience and credentials. If the challenge you are
    facing is very well-defined, then hiring someone who has solved this exact challenge
    in the past can be a great idea.


