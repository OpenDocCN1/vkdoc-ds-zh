  raw: '### The Real Problem


    Data science can be very complex and not everyone will understand it. However,
    if you try to build something everyone will understand, then you are reducing
    your work to the lowest common denominator. This is when you end up with something
    like the anti-vaccine movement.


    Imagine what would happen if all the pharmaceutical studies being conducted were
    run in such a way that everyone could understand them. It simply wouldn’t be possible
    because of the complexity of the information. It would be like handing over the
    “keys” of a space shuttle to someone who’s never even flown as a passenger in
    a plane. That space shuttle would *not* be going anywhere in the best case scenario,
    and in the worst, it would blow up in someone’s face.


    You need people who are experts to validate the study and understand what’s going
    on and to review it. Just as you need a pilot trained in flying space shuttles
    to get one off the ground.


    Clearly, within the context of a business, you don’t expect the decision-maker,
    the founder, or the head of a division to be an expert in data science. That’s
    why it’s important to find a balance between satisfying the science, so that you
    know that the model-based decisions are sound, but at the same time making models
    which are easily interpretable.


    As previously mentioned, though, the problems will get worse if a business doesn’t
    follow the right principles from the start, such as not following the right data
    strategy and so on. Another problem is the lack of data science education, which
    is what this book is trying to help with.


    If someone is properly educated in the process of data science, even if it’s only
    from a high-level perspective, then they will feel more comfortable handling models,
    interpreting results, and taking action on those results. So, ignorance is a terrible
    thing, especially when it comes to artificial intelligence and machine learning.


    ## What’s the Solution?


    While the world of business may not always be data- or science-driven, you clearly
    see the value of data- and science-driven decision-making, which is why you’re
    reading this book.


    So, how can we solve this problem? Well, first of all, you can’t expect every
    person or organization to be data-driven, but there are a few measures you can
    take to minimize the likelihood of this problem occurring.


    Of course, the first and most important thing is to have the right data strategy
    in place from the very beginning. Something else you can do, though, is to make
    sure you hire the right people and have faith in them. It’s not always going to
    be possible, but try your best.


    Furthermore, don’t get overly creative with lots of models and don’t try to guide
    the data scientist into doing specific things instead of letting them work.


    Data science interacts with business quite often, and I’ve frequently seen people
    feel insecure because they don’t understand how data science is being used and
    they try to guide the data scientist into doing all sorts of things. You will
    waste less money and time if you just hire someone you trust and let them do their
    job.


    You also have to consider the study before you start collecting data. Consider
    hiring someone even before you start data collection because they can explain
    how things should be done. So, they can show you how the study should be conducted
    so that everyone understands what’s going on, how to collect the data and that
    it can be collected in the first place, and that you feel comfortable with the
    study in terms of understanding it and presenting it to someone else.


    As previously stated, in the aforementioned example, most of the problems would
    have been solved if it would have been easy to carry out a hypothesis test. So,
    don’t be like these people and instead be the person who thinks about all the
    issues that might come up in advance.


    CAUSAL INFERENCE


    The model mentioned previously falls under the domain of causal inference. Causality
    is a very old problem, which has started to become more and more popular in the
    last few years. Judea Pearl, one of the most important computer scientists in
    history, creator of Bayesian networks, and Turing award winner (the Turing award
    is the Nobel Prize of computer science), called for a “causal revolution.”


    According to Judea Pearl, there are three levels of analysis, which he calls the
    “rungs of the Ladder of Causation.”


    In the first rung, we are studying association. We can ask questions such as “if
    I observed a symptom, how would this change my belief about a disease?”


    In the second rung, we are studying intervention. For example, we can ask questions
    like “if I take aspirin, will my headache be cured?”


    In the third rung, we are studying counterfactuals. We can ask questions like
    “how would my life have been if I had gone to college in a different city?”


    Judea Pearl believes that true intelligence lies in the third rung of causation,
    and one of the reasons that humans have become so successful on our planet is
    our ability to think in this way. He says that deep learning, while it has been
    a very successful approach for many problems, is nothing more than curve fitting,
    essentially being stuck on the first rung of causation. According to Pearl, true
    AI will never be achieved unless we build algorithms that can think up to the
    third rung of causation much like we do.


    Judea Pearl’s views have caused criticism and enthusiasm alike. What is certain
    is that the topic of causality has started to get more and more attention, and
    it is closely linked to some of the most important questions, such as health outcomes
    and policy interventions. Microsoft has also released an open source library for
    causal inference called DoWhy, so we are certain to see more and more research
    and software libraries coming up in the next few years.


    # 11. Hiring and Managing Data Scientists


    We’ve talked about why you should hire a data scientist and the numerous benefits
    it will bring your business. We’ve also looked at why it’s important to let them
    do their job without you trying to guide them. But to do that, you need to hire
    someone you can trust.


    In this chapter, we’ll be looking at precisely how to hire and manage a data scientist
    to get the best possible results. First, let’s try to understand data scientists
    a little better.


    ## Into the Mind of a Data Scientist


    A competent data scientist needs to have a lot of knowledge and a wide range of
    skills, but certain skills are more important than others.


    As you can see in Figure [11-1](#490014_3_En_11_Chapter.xhtml#Fig1), a data scientist
    needs hacking skills, math and statistics knowledge, and substantive expertise.
    While each of the skills is highly valuable individually, if they only have two
    of the three, they are not a data scientist—and in one particular case, it can
    actually lead to problems.


    ![](images/490014_3_En_11_Chapter/490014_3_En_11_Fig1_HTML.jpg)


    A Venn diagram of hacking skills, math and statistics, and domain knowledge intersecting
    at data science. Hacking skills and math and statistics intersect at machine learning.
    Math and statistics and domain knowledge at traditional research. Hacking skills
    and domain knowledge intersect at danger.


    Figure 11-1


    The data science Venn diagram'
  trans: '

    ### 真正的问题


    数据科学可能非常复杂，并非所有人都能理解。然而，如果你试图构建人人都能理解的东西，那么你就将工作降低到了最低共同标准。最终的结果可能就像反疫苗运动那样。


    想象一下，如果所有正在进行的医药研究都以一种人人都能理解的方式进行，会发生什么？由于信息的复杂性，这根本不可能实现。这就像把航天飞机的“钥匙”交给一个连飞机乘客都没当过的人。那架航天飞机最好的情况是哪里也去不了，最糟的情况则是在某人面前爆炸。


    你需要专家来验证研究、理解其内容并进行审查。就像你需要经过训练的航天飞机飞行员才能让航天飞机升空一样。


    显然，在商业环境中，你不能期望决策者、创始人或部门主管成为数据科学专家。因此，在确保科学可靠性（以确保基于模型的决策是合理的）与打造易于解释的模型之间找到平衡至关重要。


    然而，如前所述，如果企业从一开始就没有遵循正确的原则（例如没有制定正确的数据策略等），问题会变得更糟。另一个问题是缺乏数据科学教育，而这正是本书试图帮助解决的。


    如果有人接受了关于数据科学流程的适当教育，哪怕只是从高维度视角了解，他们在处理模型、解读结果以及根据结果采取行动时也会更得心应手。因此，无知是件可怕的事情，尤其是在涉及人工智能和机器学习时。


    ## 解决方案是什么？


    尽管商业世界不一定总是数据驱动或科学驱动的，但你显然能看到数据驱动和科学驱动决策的价值，这也是你正在阅读本书的原因。


    那么，我们该如何解决这个问题呢？首先，你不能期望每个人或每个组织都实现数据驱动，但你可以采取一些措施来最小化问题发生的可能性。


    当然，首要且最重要的事情是，从一开始就制定正确的数据策略。不过，你还可以做的另一件事是，确保雇佣合适的人选并信任他们。这并非总能实现，但请尽力而为。


    此外，不要过度使用大量模型来发挥“创造力”，也不要试图指导数据科学家去做特定的事情，而是放手让他们工作。


    数据科学与商业的互动非常频繁，我经常看到有人因为不理解数据科学是如何被应用的而感到不安，并试图指导数据科学家去做各种事情。如果你雇佣一个信任的人并让他们各司其职，反而会节省更多金钱和时间。


    在开始收集数据之前，你还必须考虑研究方案。考虑在数据收集开始之前就雇佣相关人员，因为他们可以解释事情应该如何进行。这样，他们就可以向你展示研究应该如何开展，从而让每个人都清楚发生了什么、如何收集数据以及数据是否能够被收集到，同时让你在理解研究并向他人展示时感到安心。


    如前所述，在上述例子中，如果假设检验能够更容易地进行，那么大部分问题本可以得到解决。所以，不要像那些人一样，而是做一个提前思考所有可能问题的人。


    ### 因果推断


    前面提到的模型属于因果推断的范畴。因果关系是一个非常古老的问题，但在过去几年里开始变得越来越热门。**朱迪亚·珀尔**，历史上最重要的计算机科学家之一、贝叶斯网络的创建者、图灵奖（计算机界的诺贝尔奖）得主，曾呼吁一场“因果革命”。


    根据朱迪亚·珀尔的观点，存在三个分析层次，他称之为“因果阶梯的层级”。


    在第一层级，我们研究关联。我们可以提出诸如“如果我观察到某个症状，这会如何改变我对某种疾病的看法？”之类的问题。


    在第二层级，我们研究干预。例如，我们可以提出“如果我服用阿司匹林，我的头痛会痊愈吗？”这样的问题。


    在第三层级，我们研究反事实。我们可以提出“如果我去另一个城市上大学，我的人生会怎样？”这样的问题。


    朱迪亚·珀尔认为，真正的智慧在于因果关系的第三层级，而人类之所以能在地球上如此成功，原因之一就是我们具备了这种思考能力。他说，尽管深度学习对许多问题来说是一种非常成功的方法，但它本质上不过是曲线拟合，基本上停留在因果关系的第一个层级。珀尔认为，除非我们能够构建出像人类一样能思考到因果关系第三层级的算法，否则真正的
    AI 永远无法实现。


    朱迪亚·珀尔的观点既引发了批评，也激发了热情。可以肯定的是，因果关系这一话题开始受到越来越多的关注，并且它与一些最重要的问题密切相关，例如健康结果和政策干预。微软也发布了一个用于因果推断的开源库，名为
    `DoWhy`，因此，我们可以肯定在未来几年内会看到越来越多的研究和软件库涌现。


    # 11. 雇佣与管理数据科学家


    我们已经讨论了为什么你应该雇佣数据科学家，以及它将为你的业务带来的诸多好处。我们还探讨了让他们各司其职而不试图指导他们工作的重要性。但要做到这一点，你需要雇佣一个你信任的人。


    在本章中，我们将具体探讨如何雇佣和管理数据科学家以获得最佳效果。首先，让我们试着更好地理解数据科学家。


    ## 走进数据科学家的内心


    一个称职的数据科学家需要具备广博的知识和多样的技能，但某些技能比其他技能更为重要。


    如图 11-1 所示，数据科学家需要具备黑客技能、数学与统计学知识以及领域专长。虽然每一项技能单独来看都极具价值，但如果他们只拥有其中两项，那他们就不是数据科学家——而且在某一种特定情况下，这实际上可能导致问题。


    ![](img/490014_3_En_11_Fig1_HTML.jpg)


    黑客技能、数学与统计学以及领域知识相交于数据科学的维恩图。黑客技能与数学和统计学相交于机器学习。数学与统计学和领域知识相交于传统研究。黑客技能与领域知识相交于危险区域。


    图 11-1 数据科学维恩图

