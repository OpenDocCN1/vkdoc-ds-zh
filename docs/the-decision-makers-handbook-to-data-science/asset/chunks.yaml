- fmt: '# AI and Automation


    One the most prominent effects of AI in society will be around automation.


    McKinsey & Company^([^(92)](#fn92))’s report “Generative AI and the future of
    work in America” paints a picture of a future where AI plays a significant role
    in automating tasks across various industries. The report predicts that AI could
    automate 45% of all work activities in the United States by 2030, and 80% of activities
    in some industries.


    This automation has the potential to increase productivity and efficiency, but
    it also raises concerns about job displacement and the need for reskilling and
    upskilling workers. Kissinger et al. (2023) make the case that AI disruption should
    be balanced off with job creation. They believe that its immediate impact will
    more likely be on automating tasks within jobs, rather than replacing entire jobs,
    and it’s expected to create new job types as well. The nature of these emerging
    jobs is less predictable compared to the current roles that might be phased out.


    While AI is set to reduce the costs of various goods and services, thereby potentially
    improving overall living standards, Kissinger et al. (2023) believe that AI should
    be considered a different wealth creation mechanism. Therefore, we can see AI
    as both an enabler, but also a truly transformational technology.


    # AI’s Personalized and Creative Revolution in Education


    Artificial intelligence (AI) is revolutionizing education, offering personalized
    instruction, fostering creativity, and redefining traditional learning. AI-powered
    tools help educators create engaging experiences and allow students to discover
    their creative abilities. These tools adapt instruction to individual students’
    needs, enhancing learning effectiveness and confidence (Liu et al., 2022; McKinsey
    & Company, 2022; Ng, 2023).


    AI also nurtures student creativity across various subjects. It generates creative
    prompts, provides artistic feedback, and aids in creating original art, music,
    and literature. This technology helps overcome creative blocks, encourages style
    experimentation, and expands creative expression (Obermeyer et al., 2019). Additionally,
    AI facilitates collaborative learning, offering platforms for project cooperation,
    idea sharing, and mutual learning (World Economic Forum, 2022). AI tools can assign
    tasks, track progress, and give feedback, enhancing team collaboration and goal
    achievement.


    Furthermore, AI introduces gamification in education, making learning more engaging
    and interactive. Game-based platforms adjust challenges to student performance,
    offering motivating rewards and feedback (Obermeyer et al., 2019; World Economic
    Forum, 2022). Finally, AI bridges educational gaps caused by geographic and language
    barriers. Translation tools enable access to materials in native languages, and
    virtual tutors offer personalized support in remote or underserved areas (Ng,
    2023; World Economic Forum, 2022).


    # AI and creativity


    Ever since the advent of GANs, the space of AI and creativity has grown exponentially.
    AI-powered tools could assist artists, writers, and composers in generating new
    ideas, exploring creative possibilities, and producing innovative works.


    In October 2018, Christie’s auction house in New York City became the first major
    auction house to sell an artwork created using artificial intelligence (AI). The
    artwork, titled Portrait of Edmond Belamy (Figure [14-1](#490014_3_En_14_Chapter.xhtml#Fig1)),
    was created by a Paris-based art collective called Obvious. The AI used a dataset
    of 15,000 portraits from the 17th, 18th, and 19th centuries to create the work.


    ![](images/490014_3_En_14_Chapter/490014_3_En_14_Fig1_HTML.jpg)


    A portrait of a man with blurred details.


    Figure 14-1


    AI-generated portrait of Edmond de Belamy


    The work was sold for a hammer price of $432,500, which was more than 40 times
    its pre-sale estimate of $7000 to $10,000. The sale was a major milestone for
    AI art and signaled the growing acceptance of AI as a legitimate art form.


    AI can assist writers in overcoming writer’s block, providing suggestions for
    plot development, character creation, and dialogue, as suggested. AI-powered writing
    assistants can analyze vast amounts of text data to identify patterns and relationships,
    helping writers generate fresh ideas and explore new creative directions. This
    is already taking place through the use of tools like ChatGPT and Google Bard.
    However, this raises questions around the future of the script-writing industry
    as a whole, which also played an important role in the 2023 strikes in Hollywood.^([^(93)](#fn93))


    Artificial intelligence (AI) is also impacting the music industry, offering musicians
    advanced tools for composition, production, and personalization. AI-driven applications
    like MuseNet, Boomy, Humming.ai, and AIVA are at the forefront of this revolution,
    facilitating original compositions and new forms of musical expression. These
    tools, adept at generating music based on parameters like genre or mood, are reshaping
    how artists create and audiences experience music (AIVA, 2023; MuseNet, 2023;
    Boomy, 2023; Humming.ai, 2023).


    AI’s role in music extends beyond composition. It aids in exploring diverse sonic
    landscapes, helping artists experiment with harmonies, rhythms, and styles. This
    innovation leads to novel genres like AI-generated and algorithmic music, reflecting
    AI’s expanding influence in creative fields (AI-Generated Music, 2023; Algorithmic
    Music, 2023).


    In production and performance, AI assists in sound design, mixing, mastering,
    and even in live settings, offering real-time accompaniment and adaptive feedback.
    These AI-powered tools enhance the quality and dynamic nature of musical performances
    (Bostrom & Yudkowsky, 2016).


    Additionally, AI significantly personalizes music experiences. Through recommendation
    engines, AI analyzes user preferences to suggest new music, fostering discovery
    and broader musical exploration. It also enables collaboration among artists,
    facilitating shared projects and idea exchange (Mittelstadt, Wachter, & Floridi,
    2019).


    In conclusion, AI is not just a tool for task automation in music; it’s a catalyst
    for creativity and innovation. As AI evolves, it’s poised to deepen its impact
    on music creation, performance, and sharing, revolutionizing how we interact with
    and appreciate this art form.


    # AI Transforming Healthcare: Diagnosis, Treatment, and Personalized Care


    The World Economic Forum’s report “The Top 10 Emerging Technologies Redefining
    Healthcare” highlights the immense transformative potential of AI in the healthcare
    sector (World Economic Forum, 2020). AI algorithms could analyze medical images
    with greater accuracy, assist in diagnosing diseases, develop personalized treatment
    plans, and even perform complex surgeries.


    These advancements could lead to earlier detection of diseases, more effective
    treatments, and improved patient outcomes. However, it is crucial to ensure that
    AI-powered healthcare systems are implemented with transparency, fairness, and
    ethical considerations. AI algorithms are poised to revolutionize various aspects
    of healthcare, from diagnosis and treatment to personalized care and patient monitoring
    (Topol, 2019).'
