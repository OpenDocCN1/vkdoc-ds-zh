  trans: '

    # 计算机科学家


    计算机科学家是那些拥有计算机科学学位，并随后攻读了机器学习硕士或博士学位的人。他们的优势在于通常具备非常优秀的编码、数据库和软件技能，但问题在于，他们通常会忽视理论上的传统统计技术，而后者在某些特定领域和问题中可能非常有用。


    计算机科学家非常擅长处理诸如预测建模这类机器学习任务中的问题。他们通常有参加 Kaggle 竞赛的经验，而 Kaggle 正是这类问题的典型代表。


    请注意，Kaggle 是一个举办预测建模和分析竞赛的平台。⁷⁸ 公司和用户上传数据集，然后统计学家、数据科学家和/或其他专家竞相创建最佳模型来预测和描述这些数据集。这是一种众包形式，依赖于这样一种理念：在预测建模任务中可以运用无数种策略，并且无法事先知道哪位分析师或哪种方法会是最好的。Kaggle
    现在是 Google Cloud 的一部分。⁷⁹


    给你一个数据集，你只需找到一个好的算法来预测某些东西。大多数计算机科学家拥有扎实的编码技能，这意味着将他们的工作与平台的其他部分集成起来更容易，特别是如果你是一家小公司或初创企业的话。他们中的大多数会使用
    Python，并且能毫无困难地编写自己的 API。所以，本质上，你可以利用他们的技能同时完成许多事情，因为他们既能编写代码，也能进行集成。


    此外，他们拥有扎实的数据库技能，因此可以完成大量的数据工程工作。即使你拥有自己的数据工程师，这也仍然很有价值，因为这些人可以轻松地检索数据、将其整理成可用的格式等等。这将为你节省开发人员的时间。他们或许还能就数据库的结构提出建议，让你的工作更加轻松。


    然而，他们缺乏适当的统计学知识，因此对于某些适合使用统计学的特定问题，比如研究设计，这些人无法真正提供帮助。


    # 统计学家


    统计学家是通常拥有统计学学位的人。他们甚至可能拥有统计学或机器学习的硕士或博士学位。他们通常在该领域拥有良好的理论基础，但缺乏编码或数据库技能。


    统计学家拥有非常扎实的统计学和理论知识。如果你感兴趣的是研究设计或统计建模，因为你想了解某个事物背后的驱动因素，那么他们是最佳人选。


    如果你想对复杂问题建模，同时确保建模过程透明，并且你能理解正在发生的事情，他们也是最佳选择。


    由于在数学和理论方面受过严格训练，他们也非常善于批判性地审视其他数据科学家的工作。


    然而，问题在于，大多数时候，他们的编码和数据库技能并不出色。他们最可能使用的语言是 R，并将其作为一种工具。他们可能没有其他语言或数据库方面的经验，这将使他们的工作与系统集成变得更为困难和耗时。


    此外，一些统计学家在预测建模方面训练不足。就其本身而言，预测建模在统计学背景下很少被视为重要内容，而更偏向于机器学习。


    因此，要检查他们是否有 Kaggle 经验。如果你有兴趣利用他们的技能进行预测建模，确保他们熟悉某种机器学习概念（例如交叉验证）也是值得的。


    # 其他定量专家


    最后，我们有我称之为的其他定量专家。这些人来自数学密集型学科，如物理学、数学、精算学、计量经济学等。这些人可能拥有硕士或博士学位，但并非机器学习和统计学方向。


    这些人基本上都是发现数据科学领域比他们自己的研究领域有更多（且更好）的工作机会，并试图转行的人。他们试图利用自己的数学和/或编码知识来实现这一目标。在这个群体中，你会看到技能和知识方面的巨大差异。


    这些定量专家有点特殊，因为他们通常拥有一些扎实的技能，并带来了多样化的思维方式，这在数据科学中非常重要。此外，如果你正在处理的问题属于他们的特定领域，那么雇佣他们绝对是非常棒的选择。


    然而，问题在于他们往往缺乏机器学习或统计学的严格训练，这在某些情况下可能会引发严重问题。


    因此，对于其他定量专家，这往往是主观的，因为因人而异。但主要的缺点是，这些人通常缺乏该领域的正规教育。


    他们往往是自学成才，你需要理解这一事实，并检查他们的实际效果如何。例如，你很可能在 GitHub 或 Kaggle 上找到他们工作的例子。而且你确实应该事先检查一下。请注意，自学成才并非坏事——绝无此意。但是，你需要检查以确保他们的技能符合你的需求。


    这些人通常是学习了一个领域，却发现薪水并不理想，或者找工作几乎不可能。然后他们发现数据科学家的薪水很高，所以，例如，一位化学家可能会决定创建几个小项目，上传到
    GitHub，或者参加几次 Kaggle 上的竞赛，试图找到一份数据科学家的工作。


    根据我的经验，在这些人的所有专长中，我发现最有效的是物理学家。物理学充满了应用数学，这使得他们很容易阅读机器学习论文，特别是因为这本质上是同一类型的数学。此外，物理学家需要能够自己做一些编码工作，因此其技能组合与机器学习所需的技能相似。


    需要注意到的一个重要点是，领域专家将拥有其各自领域的专业知识，这可能会对你很有帮助。例如，你可能想雇佣一位在计量经济学方面有经验并且有一点机器学习知识的人，因为你的问题在某种程度上与计量经济学相关。或者，你可能想聘用一位物理学家，因为你正在处理传感器数据或雷达数据。


    然而，你必须对这些其他定量专家保持警惕，因为有些人会试图伪装。他们可能会花两周时间学几个教程和在线课程，然后突然就认为自己已经是数据科学家了。这仅仅是因为他们想得到这份工作。你必须非常警惕这些人，因为他们可能会毁掉你的整个项目，并导致很多问题。


    这并不意味着你不应该考虑那些经验不足但为人诚实，并证明自己聪明且愿意学习的人。他们希望获得更多经验，是有潜力成为杰出数据科学家的聪明人。


    然而，在我看来，最好让这些人担任初级职位，并有一名更有经验的人来监督他们。当然，监督他们的人应该是一名高级数据科学家。如果你没有高级数据科学家，请先雇佣一位。然后，你可以作为初级人员跟踪他们的进展，看看他们如何成长。根据他们的发展情况，你可以选择是否提拔他们。

    '
- fmt: '#### Convergence Point


    It’s important to note that after about five or six years of experience, there’s
    usually a convergence point in all the tribes. In other words, when someone has
    gained a lot of years of experience and has participated in quite a few projects—let’s
    say between 10 and 30—and they’ve worked for different companies in various fields,
    they’ve usually picked up a wide range of skills. If they have a PhD, that’s just
    an added bonus.


    So, they’ll have done some coding in both `R` and `Python`, and they’ll have picked
    up a little of this, a little of that, and, pretty much, a little of everything.
    They also have a very good awareness of what’s out there. This means that they
    know all the methods and techniques that are available, even if they don’t know
    how to implement them themselves.


    This is important because they know how a problem should be solved. And even if
    they don’t know how to do it themselves, they’ll know who to speak to and who
    to hire to get the work done. Sometimes, it’s not important to have the skill
    per se, but to be aware of one’s limitations and have the knowledge of what solutions
    are available and how to access the people who can implement them.


    So, if you see someone who started out as a physicist but has been in data science
    for ten years and has worked for a lot of companies in a wide range of fields,
    then this is the type of person who will likely fall in this category.


    Thus, when you find someone who has a lot of experience, you shouldn’t worry too
    much about their background. What’s more important is what they’ve learned over
    the years and whether they actually have the skills and the awareness of all the
    techniques and methods that are available.


    What you do need to be careful about is when someone has a lot of experience,
    but they’ve worked on the same one or two projects for years and years. These
    are not the type of people I’m referring to. I’m talking about people who have
    actively tried to learn new things over the years, such as gaining experience
    with `R`, with `Python`, maybe a little research design, and so on and so forth.


    ### The Smaller Tribes


    So, now let’s take a look at the smaller tribes. When I say smaller tribes, I’m
    referring to the fact that there aren’t as many people in these tribes as there
    are in the larger tribes. Also, these people tend not to really be data scientists
    but mainly people with some analytical skills.


    Thus, we have the `self-taught` people. These are usually people who studied something
    random or maybe even software development. They might have participated in a few
    Kaggle competitions and that’s about the limit of their experience.


    While the quantitative specialists from the larger tribes might also be self-taught
    in certain respects, their discipline will have already taught them some skills
    which carry over to data science.


    In this particular situation, I’m referring to someone who studied humanities,
    for example. An art historian who suddenly discovers their field doesn’t offer
    a lot of professional opportunities or an archaeologist who’s discovered that
    digging through the dirt isn’t quite as fun or financially rewarding as they had
    hoped, and then they suddenly decide to become a data scientist.


    Then we have the `software platform user`, which is someone who just knows how
    to use a specific tool, such as a dashboard, or a software like `Weka` (which
    you see in Figure 11-2) or `RapidMiner`. These people can offer real value for
    money if you only have a simple problem. For example, if all you need is some
    reporting, then these people are the best option because they’ll definitely be
    cheaper.


    ![](images/490014_3_En_11_Chapter/490014_3_En_11_Fig2_HTML.jpg)


    A screenshot of Weka 3.5.5 explorer interface has tabs preprocess, classify, cluster,
    associate, select attributes, and visualize. Below are tables of number and name,
    and selected attributes with statistics and value, and a histogram of class.


    Figure 11-2 The Weka Explorer graphical user interface


    They’ll also be a lot happier with the work you give them compared to someone
    with a PhD in deep learning, for example. Otherwise, it would be like hiring a
    master chef to fry two eggs when a line cook can do just as good a job without
    being irritated by the work.


    However, someone like this won’t be able to help you with more complicated problems
    because they might actually fall into the danger zone we discussed previously
    and is shown in the Venn diagram at the beginning of this chapter. In other words,
    they lack a proper background in math and statistics, so they’ll be able to apply
    the tool to certain situations, but they aren’t the people you want to trust with
    building a model or predictive tool.


    Last but certainly not least, we have the `domain specialist`. This is someone
    who has very advanced knowledge of machine learning but limited to a very small
    niche. One of the most common examples is someone who is specialized in deep learning
    and computer vision. These are people who have done undergrad work in computer
    vision or have a master’s or PhD in computer vision.


    Now, if your problem is computer vision-related, then they are definitely the
    ones to hire because they will be amazing. But if you have a different issue,
    these aren’t always the best people to turn to. Obviously, it won’t be difficult
    for them to pick up new skills if they are doing machine learning or statistics
    on an advanced level. However, it might take them a few months to get up to speed
    with the knowledge required to solve different types of problems.'
  raw: '#### Convergence Point


    It’s important to note that after about five or six years of experience, there’s
    usually a convergence point in all the tribes. In other words, when someone has
    gained a lot of years of experience and has participated in quite a few projects—let’s
    say between 10 and 30—and they’ve worked for different companies in various fields,
    they’ve usually picked up a wide range of skills. If they have a PhD, that’s just
    an added bonus.


    So, they’ll have done some coding in both R and Python, and they’ll have picked
    up a little of this, a little of that, and, pretty much, a little of everything.
    They also have a very good awareness of what’s out there. This means that they
    know all the methods and techniques that are available, even if they don’t know
    how to implement them themselves.


    This is important because they know how a problem should be solved. And even if
    they don’t know how to do it themselves, they’ll know who to speak to and who
    to hire to get the work done. Sometimes, it’s not important to have the skill
    per se, but to be aware of one’s limitations and have the knowledge of what solutions
    are available and how to access the people who can implement them.


    So, if you see someone who started out as a physicist but has been in data science
    for ten years and has worked for a lot of companies in a wide range of fields,
    then this is the type of person who will likely fall in this category.


    Thus, when you find someone who has a lot of experience, you shouldn’t worry too
    much about their background. What’s more important is what they’ve learned over
    the years and whether they actually have the skills and the awareness of all the
    techniques and methods that are available.


    What you do need to be careful about is when someone has a lot of experience,
    but they’ve worked on the same one or two projects for years and years. These
    are not the type of people I’m referring to. I’m talking about people who have
    actively tried to learn new things over the years, such as gaining experience
    with R, with Python, maybe a little research design, and so on and so forth.


    ### The Smaller Tribes


    So, now let’s take a look at the smaller tribes. When I say smaller tribes, I’m
    referring to the fact that there aren’t as many people in these tribes as there
    are in the larger tribes. Also, these people tend not to really be data scientists
    but mainly people with some analytical skills.


    Thus, we have the **self-taught** people. These are usually people who studied
    something random or maybe even software development. They might have participated
    in a few Kaggle competitions and that’s about the limit of their experience.


    While the quantitative specialists from the larger tribes might also be self-taught
    in certain respects, their discipline will have already taught them some skills
    which carry over to data science.


    In this particular situation, I’m referring to someone who studied humanities,
    for example. An art historian who suddenly discovers their field doesn’t offer
    a lot of professional opportunities or an archaeologist who’s discovered that
    digging through the dirt isn’t quite as fun or financially rewarding as they had
    hoped, and then they suddenly decide to become a data scientist.


    Then we have the **software platform user**, which is someone who just knows how
    to use a specific tool, such as a dashboard, or a software like Weka^([^(80)](#fn80))
    (which you see in Figure [11-2](#490014_3_En_11_Chapter.xhtml#Fig2)) or RapidMiner.^([^(81)](#fn81))
    These people can offer real value for money if you only have a simple problem.
    For example, if all you need is some reporting, then these people are the best
    option because they’ll definitely be cheaper.


    ![](images/490014_3_En_11_Chapter/490014_3_En_11_Fig2_HTML.jpg)


    A screenshot of Weka 3.5.5 explorer interface has tabs preprocess, classify, cluster,
    associate, select attributes, and visualize. Below are tables of number and name,
    and selected attributes with statistics and value, and a histogram of class.


    Figure 11-2


    The Weka Explorer graphical user interface


    They’ll also be a lot happier with the work you give them compared to someone
    with a PhD in deep learning, for example. Otherwise, it would be like hiring a
    master chef to fry two eggs when a line cook can do just as good a job without
    being irritated by the work.


    However, someone like this won’t be able to help you with more complicated problems
    because they might actually fall into the danger zone we discussed previously
    and is shown in the Venn diagram at the beginning of this chapter. In other words,
    they lack a proper background in math and statistics, so they’ll be able to apply
    the tool to certain situations, but they aren’t the people you want to trust with
    building a model or predictive tool.


    Last but certainly not least, we have the **domain specialist**. This is someone
    who has very advanced knowledge of machine learning but limited to a very small
    niche. One of the most common examples is someone who is specialized in deep learning
    and computer vision. These are people who have done undergrad work in computer
    vision or have a master’s or PhD in computer vision.


    Now, if your problem is computer vision-related, then they are definitely the
    ones to hire because they will be amazing. But if you have a different issue,
    these aren’t always the best people to turn to. Obviously, it won’t be difficult
    for them to pick up new skills if they are doing machine learning or statistics
    on an advanced level. However, it might take them a few months to get up to speed
    with the knowledge required to solve different types of problems.'
  trans: '

    #### 交汇点


    值得注意的是，大约五到六年的经验之后，所有群体通常会到达一个交汇点。换句话说，当一个人积累了多年经验，参与过相当多的项目（大约 10 到 30 个），并且在不同领域的多家公司工作过，他们通常已经掌握了广泛的技能。如果他们还拥有博士学位，那只是锦上添花。


    因此，他们既用`R`也用过`Python`编写代码，并且他们这里学一点，那里学一点，基本上各方面都懂一些。他们对业界的现状也有很好的认识。这意味着他们了解所有可用的方法和技术，即使自己不知道如何实现。


    这一点很重要，因为他们知道一个问题应该如何解决。即使他们不知道如何自己动手，他们也知道该找谁谈、该雇佣谁来完成任务。有时，拥有技能本身并不重要，重要的是意识到自己的局限，并了解有哪些解决方案，以及如何找到能实施这些方案的人。


    所以，如果你看到有人最初是物理学家，但在数据科学领域工作了十年，并且为众多不同领域的公司工作过，那么这种人很可能就属于这一类。


    因此，当你找到一个经验丰富的人时，不必过分担心他们的背景。更重要的是他们多年来学到了什么，以及他们是否真正拥有技能，并了解所有可用的技术和方法。


    你需要小心的是那种虽然经验丰富，但年复一年都在做同一两个项目的人。这些人并不是我指的类型。我指的是那些多年来积极尝试学习新事物的人，比如获取`R`、`Python`的经验，或许还有一些研究设计方面的知识，等等。


    ### 较小的群体


    那么，现在我们来看看较小的群体。我说较小的群体，是指这些群体中的人数不如大群体那么多。此外，这些人往往不完全是数据科学家，而主要是具备一些分析能力的人。


    因此，我们有`自学成才`这一类人。他们通常是学过某些随机专业的人，或者甚至是软件开发出身。他们可能参加过几次 Kaggle 竞赛，而这差不多就是他们经验的全部了。


    虽然来自大群体的量化专家在某些方面也可能自学成才，但他们的学科背景已经教会了他们一些可以迁移到数据科学领域的技能。


    在此特定情形下，我指的是学人文学科的人，例如。一位艺术史学家突然发现自己的领域没有太多职业机会，或者一位考古学家发现挖土并不像他们期望的那样有趣或经济回报丰厚，然后突然决定成为一名数据科学家。


    然后是`软件平台用户`，这种人只知道如何使用某个特定工具，比如仪表盘或`Weka`（见图 11-2）或`RapidMiner`这类软件。如果你的问题很简单，这些人能提供很高的性价比。例如，如果你只需要做一些报告，那么这些人是最佳选择，因为他们肯定更便宜。


    ![](img/490014_3_En_11_Fig2_HTML.jpg)


    Weka 3.5.5 资源管理器界面截图，其选项卡包括预处理、分类、聚类、关联、选择属性和可视化。下方是编号和名称的表格，以及带有统计数据和值的选定属性，以及一个分类直方图。


    图 11-2  Weka 资源管理器图形用户界面


    与雇佣一个拥有深度学习博士学位的专家相比，他们对你分配的工作也会满意得多。否则，就像聘请一位主厨去煎两个鸡蛋，而一个普通厨师就能做得同样好，还不会因工作而感到厌烦。


    然而，这种人无法帮助你解决更复杂的问题，因为他们可能恰好陷入了我们之前讨论过的危险区域，即本章开头维恩图所示的情况。换句话说，他们缺乏扎实的数学和统计学基础，所以能够将工具应用于某些场景，但你不是那些可以信任他们来构建模型或预测工具的人。


    最后但同样重要的是`领域专家`。这类人对机器学习有非常深入的了解，但仅限于一个非常小的细分领域。最常见的例子之一就是专门从事深度学习和计算机视觉的人。这些人本科阶段学习的就是计算机视觉，或者拥有计算机视觉的硕士或博士学位。


    现在，如果你的问题是计算机视觉相关的，那么他们绝对是你要雇佣的人，因为他们会非常出色。但如果你有不同的问题，他们就不一定是最佳人选。显然，如果他们是在高级水平上从事机器学习或统计学，那么学习新技能对他们来说并不难。然而，他们可能需要几个月的时间才能掌握解决不同类型问题所需的知识。

