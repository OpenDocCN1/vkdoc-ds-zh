- fmt: '# Don’t Buy the Hype!


    This is a very important point. In computer science, new technology is being developed
    constantly, and something new and shiny pops up every few years. For example,
    for big data, we saw the development of NoSQL databases, while machine learning
    gave us deep learning.


    While these technologies are extremely powerful, they’ve been created to deal
    with specific issues. The problem is that there are companies out there that want
    you to buy their brand new shiny products and services and will say just about
    anything to convince you that you need them, even when you don’t need tech that
    advanced.


    This is quite a common issue. There are so many companies out there using NoSQL
    solutions, for example, when they don’t really need it. Of course, this doesn’t
    mean you should never use these technologies. It just means that you should think
    about it twice and make sure you really do need them.


    For example, NoSQL generally assumes that you want to store big amounts of data
    and it’s difficult to express the structure in a table format. So, if you don’t
    have ridiculous amounts of data, it might not make sense to go with NoSQL. Also,
    choosing the right NoSQL database is not an easy task. Just by searching the Internet,^([^(41)](#fn41))
    you can find more than ten different options, with more coming. There are some
    cases where using a NoSQL solution makes perfect sense (e.g., graph data or when
    you are storing posts from social media), but don’t just do it without thinking.
    In most cases, you are just fine with some simple implementation of SQL, such
    as `MySQL`.^([^(42)](#fn42))


    Deep learning is another example. It’s great technology but should only be applied
    in certain situations, like for images, audio, and video. Otherwise, it requires
    a lot of computational resources, which means it can get expensive and time-consuming
    to develop a deep neural network.


    In other words, don’t use technology just because it’s new and shiny and a slick
    sales rep has spent an inordinate amount time convincing you that you absolutely
    need it. Instead, take a step back and take an objective look at if you really
    need that type of tech.


    If you don’t, it’s better to go with a trusted solution that has been available
    for a longer period of time because it’s been thoroughly tested and proven to
    work effectively. Plus, it will also be easier to hire people to work with said
    technology because there are more people who have expertise working with it.


    ## Setting Goals in Advance


    *Failing to plan is planning to fail*. This is one of my favorite phrases when
    it comes to data strategy.


    If I haven’t yet made my point, I’ll say it again: it’s essential to think about
    what you might want to do with the data in the future.


    It’s definitely not easy to think in advance of all the types of data you might
    need to solve a problem, and it can take time. However, it more than pays off
    to sit down and think about it.


    For example, you might need 20 variables to create an outstanding recommender
    system for your app. If you didn’t take time to think about it, you might have
    three of these variables. Conversely, if you did sit down and plan in advance,
    you might have 15 variables. It’s not the full 20 because no one can predict everything
    in advance, but it’s still much better than only three.


    If you really have no clue or don’t have the time to engage in this exercise,
    then hire a data scientist to consult before you start collecting data. Taking
    this approach is also essential because data collection and data science can interact
    with other parts of your business and business model. It’s not going to take more
    than a couple of days of the data scientist’s time (which means you won’t have
    to spend much money), and it is well worth it.


    ## Examples of the Impact of Data Science and Collection on Your Business


    In this section, we’re going to look at some examples of how data collection and
    data science can affect your user interface and can even lead to completely different
    business models.


    ### Data Science and Dating


    So, let’s say you have a B2C app in the dating space and you need to create a
    recommender system^([^(43)](#fn43)) for your app.


    Consider Tinder, a popular dating app, and OkCupid, which is a popular dating
    website. It’s not important if you aren’t familiar with these apps, but they are
    excellent examples.


    From a data science or machine learning perspective, the whole problem with dating
    is ensuring the system makes the right recommendations.


    Tinder, for example, takes a pretty simplistic approach. You can swipe left or
    right on someone’s profile, which tells the system whether you like them or not.
    However, you don’t have a lot of data. You can see their picture, first name,
    and age, and maybe a few other photos, but that’s about it.


    OkCupid, on the other hand, has taken a much more in-depth approach. They’ve created
    a questionnaire that has a lot of questions. And when I say a lot, I really mean
    a lot of questions. This questionnaire really digs into your preferences, opinions,
    and personality. They then use the answers from the questionnaire to match people
    with each other.


    If you’re a data scientist and you want to create a recommender system for matchmaking,
    you’re probably going to do something similar to what OkCupid has done.


    However, you have to consider the fact that OkCupid is much more difficult to
    use. The site asks you over a hundred questions, and it’s going to take you a
    while to get through them. So, in terms of data science, OkCupid is a data scientist’s
    dream. The data that OkCupid possesses is so detailed that they have even published
    research on human sexuality and romantic preferences.^([^(44)](#fn44)) However,
    this does not necessarily make for the smoothest user experience.


    Conversely, Tinder might never have a great recommender system because they don’t
    collect enough data to develop one, but they do provide a great user experience.
    That’s where their focus has been and it can be seen quite easily because it takes
    very little time for users to screen a large number of profiles.


    One is not necessarily better than the other. They’re just different. But what
    is important is that these two systems clearly show how data science and data
    collection affect the user interface, the user experience, and even the whole
    business model.


    And it should be noted that both OkCupid and Tinder are wildly successful. So,
    it’s not a matter of which one is right; it’s simply a matter of you taking the
    time to think about how this works in your own business.'
