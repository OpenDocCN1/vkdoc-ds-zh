- fmt: '#### Cost of Acquisition


    The cost of acquisition is also an essential component, and it also ties in with
    the time requirement. The faster you want to get your hands on the data, the more
    it will cost you. While in some situations, the added cost is worth it, in some
    cases, it simply doesn’t make sense to pay a lot more to speed up data collection.
    In some situations, no matter how much you pay, there’s no way to make data collection
    faster.


    ## Case Study: Data Acquisition Problems


    The aforementioned points don’t exist in isolation and often interact with each
    other. The problem is that if you don’t take them all into account, you could
    end up with a business model that doesn’t work.


    For example, let’s say that you’ve got a brilliant idea for a startup. You want
    to make money from sports betting by developing a predictive analytics model.
    While there are companies around already doing this, you want to take it to a
    whole new level by predicting football outcomes in real time while the game is
    being played.


    So, you want to develop machine learning models to analyze data in real time to
    determine who will win, how many corners will be won in the second half, and so
    on. Then, you can bet accordingly and hopefully make a ton of cash.


    To achieve this, though, you need data so you check around with vendors to see
    what pre-defined packages they offer. For each one, you need to consider the aforementioned
    points.


    Thus, you start with *appropriateness of the data*. You have to make sure that
    the data you are getting from your vendor includes the variables you need to make
    the appropriate predictions.


    The second point is the *nature of the data*. In sports, data mistakes are very
    common, especially if you want real-time data. The more mistakes you plug into
    your predictive model, the bigger the chances will be that the forecasted outcomes
    are wrong.


    Third is the factor of *time requirement*. It could take, for example, ten minutes
    to get the data after something happened. So, you can’t actually get the data
    in real time or even within a few minutes. Ten minutes might not sound like much,
    but if you are trying to predict the various outcomes of a game while it is being
    played, a ten-minute delay could seriously impact the timeliness of your results.
    After all, getting your prediction after the game is concluded will not help you
    in any way.


    And last but not least is the issue of *cost of acquisition*. To get data faster,
    you can pay more, but you have to consider whether the additional cost is worth
    it or not. This is even more important when you consider that the difference in
    costs can be as much as five times between post-game data and real-time data.
    Furthermore, real-time data also has an increased chance of introducing errors,
    which can further magnify the cost of the data by generating skewed results.


    When you take the preceding into account, you have to consider what your next
    step will be. For example, it might be a better idea to purchase data post game
    instead of trying to predict outcomes in real time. Not only is this more cost-effective
    in terms of the actual cost of buying the data, but it also reduces the chances
    of skewed results. Post-game data is always more accurate because it is double
    and triple-checked to ensure accuracy.


    However, if you do take this route, then you have to consider whether it’s still
    worth getting into this business because there are so many other companies doing
    the same thing.


    And you arrived at this conclusion because you took into account data acquisition
    considerations, which have shown you that there’s a good chance you won’t be successful
    with your idea of real-time sports betting predictions. The advantage is, of course,
    that you discover these issues before you actually lose money on a model that
    won’t work in the current climate.


    ## Quantitative vs. Qualitative Research


    Another important distinction in data acquisition is quantitative and qualitative
    research. However, these two areas aren’t just about how the data is collected
    but also the type of data and how it is analyzed.


    ### Quantitative Research


    Quantitative research is all about numbers. As the name implies, it involves quantifying
    everything. If you want to know how many people liked a movie, for example, then
    you turn to quantitative research. If you want to discover how many people buy
    their groceries online and the frequency with which they do it, then you use quantitative
    research.


    So, quantitative research is used to quantify attitudes, opinions, behaviors,
    and other defined variables. The advantage is that because of the structured nature
    of the methods used to collect the data, a larger sample population can be used.


    These methods include things like:


    * Surveys (online, paper, mobile, kiosk surveys)

    * Using pre-existing databases (census data)

    * Online polls

    * Automatic data collection in apps


    Quantitative research is great for testing assumptions and getting numbers. However,
    it’s not as good at discovering new insights.


    Even when you use open-ended questions in quantitative research, you still can’t
    delve deeper like you can with qualitative research.


    Let’s say you’ve designed a new ad and you want to see what people think of it.
    You might ask an open-ended question like:


    > If you don’t like the ad, what is that you don’t like specifically?


    You’ll get lots of different answers from people, but that’s pretty much how far
    you can go. Someone might say they don’t like the colors as a simple example.
    Because of the nature of quantitative research, you have to move on to the next
    question and can’t dig deeper to find out what they dislike about the colors.
    Sometimes, the insights you can glean from digging really deep can be very enlightening
    and not always what you thought they would be.'
