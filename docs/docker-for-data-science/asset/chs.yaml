  \ `LogisticRegression` 还是 `SVC`（支持向量分类器）都无法处理更大的数据量。\n\n\n\n## 总结\n\n在本章中，我介绍了本文的核心主题——`Docker`\
  \ 和 `Jupyter`，并讨论了学习本文时推荐的一种实践方法，即在亚马逊云服务上使用一次性 Linux 实例。我提供了配置、启动和配置此类实例的详细说明。启动实例后，你使用\
  \ `Docker` 和 `Jupyter` 探索了一个玩具级的大数据示例，在使用 `scikit-learn` 生成的合成分类数据集加载和拟合模型时，诊断了内存性能。我并不期望本章能让你彻底掌握如何使用\
  \ `Docker` 和 `Jupyter` 构建执行数据科学的系统。相反，我希望它能作为对该主题的实质性介绍。与其简单陈述 `Docker` 和 `Jupyter`\
  \ 是什么，我更希望你能通过使用它们来了解这两项技术。在接下来的章节中，你将探索 `Docker` 和 `Jupyter` 生态系统的许多方面。之后，你将了解开源数据存储\
  \ `Redis`、`MongoDB` 和 `PostgreSQL`，以及如何将它们集成到基于 Docker 的应用程序中。最后，你将学习 `Docker Compose`\
