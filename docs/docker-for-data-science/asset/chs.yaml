  \ -m SimpleHTTPServer` 运行 Python 模块。该服务器在容器内的默认端口 8000 上运行。你将其链接到主机上的端口 5000，并能够通过浏览器（图\
  \ 2-5）在 `http://localhost:8000` 访问文件服务器。\n\n![A439726_1_En_2_Fig5_HTML.jpg](img/A439726_1_En_2_Fig5_HTML.jpg)\
