  \ intermediate container 6e3605df5b68\nSuccessfully built 02b8f5d04aeb\n```\n\n\
  **清单 5-36.** 运行构建\n\n#### 提交更改到本地仓库\n\n在清单 5-37 中，你再次将更改提交到本地仓库。\n\n```\n$ git add\
  \ Dockerfile\n$ git commit -m 'MINICONDA3 IMAGE. Install miniconda3.'\n```\n\n**清单\
  \ 5-37.** 提交更改\n\n### tini\n\n我认为在目前这个进度下，开始讨论 PID 1 “僵尸”进程问题有点为时过早。简单来说就是：Docker\
  \ 的最佳实践是，在运行容器时不要运行不必要的进程。这包括通常由操作系统运行来处理进程和信号的 `systemd` 或 `sysvinit`。这可能导致容器无法优雅地停止，或者本应终止的僵尸容器持续存在。现在，我们就像\
  \ Continuum 开发团队那样处理这种情况，使用 `tini`。`tini` 是解决这个问题的一个轻量级方案，没有额外的依赖。它可以回收僵尸进程，生成一个单一进程（该进程将作为\
  \ PID 1 运行），并且当 `tini` 的第一个子进程退出时，`tini` 也会退出。在清单 5-38 中，你将 `tini` 包含到容器中。\n\n```\n\
  RUN apt-get install -y curl grep sed dpkg && \\\n    TINI_VERSION=`curl https://github.com/krallin/tini/releases/latest\
  \ | grep -o \"/v.*\\\"\" | sed 's:^..\\(.*\\).$:\\1:'` && \\\n    curl -L \"https://github.com/krallin/tini/releases/download/v${TINI_VERSION}/tini_${TINI_VERSION}.deb\"\
  \ > tini.deb && \\\n    dpkg -i tini.deb && \\\n    rm tini.deb && \\\n    apt-get\
  \ clean\n```\n\n**清单 5-38.** `miniconda3/Dockerfile`\n\n#### 运行构建\n\n在清单 5-39 中，你运行构建来安装\
  \ `tini`。\n\n```\n$ docker build -t miniconda3 miniconda3\nSending build context\
  \ to Docker daemon  2.56 kB\n...\nStep 6/6 : RUN apt-get install -y curl grep sed\
  \ dpkg &&     TINI_VERSION=`curl https://github.com/krallin/tini/releases/latest\
  \ | grep -o \"/v.*\\\"\" | sed 's:^..\\(.*\\).$:\\1:'` &&     curl -L \"https://github.com/krallin/tini/releases/download/v${TINI_VERSION}/tini_${TINI_VERSION}.deb\"\
  \ > tini.deb &&     dpkg -i tini.deb &&     rm tini.deb &&     apt-get clean\n --->\
  \ Running in b6fa6f29121c\n...\nSuccessfully built ce5eb4345473\n```\n\n**清单 5-39.**\
  \ 运行构建\n\n#### 提交更改到本地仓库\n\n在清单 5-40 中，你再次将更改提交到本地仓库。\n\n```\n$ git add Dockerfile\n\
  $ git commit -m 'MINICONDA3 IMAGE. Install tini.'\n```\n\n**清单 5-40.** 提交更改\n\n\
  #### 使用 ENV 配置环境变量\n\n为了确保容器正常运行，你需要配置一些环境变量。在清单 5-41 中，你使用 `ENV` 指令来完成此操作。你首先指定了一些语言相关的变量，⁶\
  \ 然后确保 `conda` 二进制文件在 `PATH` 中。\n\n```\nENV LANG=C.UTF-8 LC_ALL=C.UTF-8\nENV PATH\
  \ /opt/conda/bin:$PATH\n```\n\n**清单 5-41.** `miniconda3/Dockerfile`\n\n\n\n### `ENTRYPOINT`\n\
  \n最终，你需要为容器提供一个`ENTRYPOINT`。`ENTRYPOINT`指令指定了当镜像被实例化时要启动的进程。在清单 5-42 中，你告诉 Docker\
  \ 将 `tini` 作为 PID 1 运行。`ENTRYPOINT [ \"/usr/bin/tini\", \"--\" ]` 清单 5-42. miniconda3/Dockerfile\n\
  \n#### 运行构建\n\n在清单 5-43 中，你运行构建来设置环境变量和`ENTRYPOINT`。\n\n```\n$ docker build -t miniconda3\
  \ miniconda3\nSending build context to Docker daemon 3.072 kB\n...\nStep 7/9 : ENV\
  \ LANG C.UTF-8 LC_ALL C.UTF-8\n...\nStep 8/9 : ENV PATH /opt/conda/bin:$PATH\n...\n\
  Step 9/9 : ENTRYPOINT /usr/bin/tini --\n ---> Running in 3c3776056958\n ---> 014cc8d97486\n\
  Removing intermediate container 3c3776056958\nSuccessfully built 014cc8d97486\n\
  Successfully tagged miniconda3:latest\n```\n\n清单 5-43. 运行构建\n\n#### 将更改提交到本地仓库\n\
  \n在清单 5-44 中，你再次将更改提交到本地仓库。由于这标志着你的`miniconda3`镜像的完成，你还需要将更改推送到 GitHub。\n\n```\n\
  $ git add Dockerfile\n$ git commit -m 'MINICONDA3 IMAGE. Set env and entrypoint.'\n\
  $ git push\n```\n\n清单 5-44. 提交更改\n\n### 设计`ipython`镜像\n\n你的`miniconda3`镜像比 Jupyter\
  \ 堆栈中的大多数其他镜像要小得多，正是因为它几乎预装了任何东西。如果你想运行`ipython`，你需要安装这个库。让我们再次使用`FROM`指令，基于你刚刚设计的`miniconda3`镜像来构建一个`ipython`镜像。\n\
  \n#### 创建`ipython`源目录\n\n首先，你为这个特定的镜像创建一个目录，并实例化你的`Dockerfile`（清单 5-45）。\n\n```\n\
  $ mkdir ipython\n$ touch ipython/Dockerfile\n```\n\n清单 5-45. 为包含空`Dockerfile`的`ipython`镜像创建一个目录\n\
  \n#### 定义`ipython`镜像\n\n让我们定义`ipython`镜像，使用三个命令定义的三层，如清单 5-46 所示。\n\n```\nFROM miniconda3\n\
  LABEL maintainer=@joshuacook\nRUN conda update conda && \\\n    conda install --quiet\
  \ --yes ipython && \\\n    conda clean -tipsy\n```\n\n清单 5-46. ipython/Dockerfile\n\
  \n#### 使用`conda`安装`ipython`\n\n这里唯一的新命令是使用`conda`来安装`ipython`。`conda`是一个类似于`apt`的包管理器，但它专为管理\
  \ Python 包而设计。在这里，你使用`conda`来安装`ipython`。敏锐的 Python 开发者会注意到，我们避开了配置任何类型的虚拟环境。\n\n\
  #### 定义默认运行时命令\n\n你在`ipython` `Dockerfile`中的最后一条指令是通过`CMD` ⁷ 指令为镜像提供一个默认的运行时命令。每个`Dockerfile`可以包含一个`CMD`指令，尽管这个指令不是必需的。根据\
  \ Dockerfile 最佳实践，⁸ `CMD`指令应用于运行镜像中包含的软件，并且应始终以`CMD [\"executable\", \"param1\"\
  , \"param2\"...]`的形式使用。在清单 5-47 中，你向`Dockerfile`添加了一条指令，以便在运行时执行`ipython`。\n\n```\n\
  FROM miniconda3\nLABEL maintainer=@joshuacook\nRUN conda update conda && \\\n    conda\
  \ install --quiet --yes ipython && \\\n    conda clean -tipsy\nCMD [\"ipython\"\
  ]\n```\n\n清单 5-47. ipython/Dockerfile\n\n#### 构建`ipython`镜像\n\n在清单 5-48 中，使用`Dockerfile`定义了镜像后，你使用`docker\
  \ build`命令构建镜像，再次命名镜像并提供`ipython`目录作为上下文。\n\n```\n$ docker build -t ipython ipython\n\
  Sending build context to Docker daemon 2.048 kB\nStep 1/4 : FROM jupyter-base\n\
   ---> 014cc8d97486\nStep 2/4 : LABEL maintainer @joshuacook\n ---> Using cache\n\
   ---> 938a406795a2\nStep 3/4 : RUN conda update conda &&     conda install --quiet\
  \ --yes ipython &&     conda clean -tipsy\n ---> Running in 64910e75091f\nFetching\
  \ package metadata .........\nSolving package specifications: .\nPackage plan for\
  \ installation in environment /opt/conda:\nThe following packages will be UPDATED:\n\
      conda: 4.3.11-py36_0 --> 4.3.14-py36_0\n...\n ---> f9a032f0a9a5.\nRemoving intermediate\
  \ container 64910e75091f\nStep 4/4 : CMD ipython\n ---> Running in 5839183d3d00\n\
   ---> 98f0b133173e\nRemoving intermediate container 5839183d3d00\nSuccessfully built\
  \ 98f0b133173e\nSuccessfully tagged ipython:latest\n```\n\n清单 5-48. 运行 Docker 构建\n\
  \n#### 将更改提交到 GitHub\n\n在清单 5-49 中，你提交这个新镜像并将更改推送到 GitHub。\n\n```\n$ git add ipython/Dockerfile\n\
  $ git commit -m 'IPYTHON. Initial build'\n$ git push\n```\n\n清单 5-49. 提交更改并推送到 GitHub\n\
  \n### 将`ipython`镜像作为新容器运行\n\n最后，在完成设计并构建了你的`ipython`镜像之后，让我们将该镜像作为新容器运行。在清单 5-50\
  \ 中，你将`ipython`作为一个交互式终端容器化进程运行。你可以通过`Ctrl+D`终止该进程。\n\n```\n$ docker run -it ipython\n\
  Python 3.6.0 |Continuum Analytics, Inc.| (default, Dec 23 2016, 12:22:00)\nType\
  \ \"copyright\", \"credits\" or \"license\" for more information.\n\nIPython 5.3.0\
  \ -- An enhanced Interactive Python.\n?         -> Introduction and overview of\
  \ IPython's features.\n%quickref -> Quick reference.\nhelp      -> Python's own\
  \ help system.\nobject?   -> Details about 'object', use 'object??' for extra details.\n\
  \nIn [1]: import requests\n\nIn [2]: resp = requests.get('http://google.com')\n\n\
  In [3]: resp.status_code\nOut[3]: 200\n\nIn [4]: Do you really want to exit ([y]/n)?\n\
  ```\n\n清单 5-50. 将`ipython`镜像作为新的交互式终端容器化进程运行\n\n## 总结\n\n在本章中，我介绍了`Dockerfile`，这是在\
  \ Docker 生态系统中用于定义镜像的文件类型。你探索了在定义`Dockerfiles`时使用的几个常见指令。你还定义了三个镜像，第三个是使用第二个作为基础镜像构建的。阅读本章后，你应该熟悉使用\
  \ Docker 最佳实践来定义新镜像。\n\n脚注\n1 [`en.wikipedia.org/wiki/Microservices`](https://en.wikipedia.org/wiki/Microservices)\
