  \  API version:  1.27\n  Go version:   go1.7.5\n  Git commit:   c6d412e\n  Built:\
  \        Mon Mar 27 17:14:09 2017\n  OS/Arch:      linux/amd64\nServer:\n  Version:\
  \      17.03.1-ce\n  API version:  1.27 (minimum version 1.12)\n  Go version:  \
  \ go1.7.5\n  Git commit:   c6d412e\n  Built:        Mon Mar 27 17:14:09 2017\n \
  \ OS/Arch:      linux/amd64\n  Experimental: false\n```\n\n清单 2-12. 显示 Docker 版本\n\
  \n**注意：** 运行此命令会显示 Docker 客户端和服务器上运行的 Docker 版本信息。\n\n```\n$ docker help\nUsage:\
  \ docker COMMAND\nA self-sufficient runtime for containers\n...\n```\n\n清单 2-13.\
