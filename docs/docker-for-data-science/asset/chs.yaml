  \ 图 6-5. `joshuacook/numpy` Docker Hub 页面\n\n## 总结\n\n在本章中，你了解了如何使用 Docker Hub 作为你构建的镜像的云端存储。你学习了镜像的多个版本，了解了如何使用标签来跟踪\
  \ Python 社区镜像的多个版本。你创建了一个新镜像，用于使用以 `jupyter/base-notebook` 镜像为基础构建的 `numpy` 库，用当前版本的\
  \ `numpy` 为其打上标签，并将其推送到你的 Docker Hub 账户。学完本章后，我希望你已经熟悉了从 `Dockerfile` 创建新镜像的过程，并知道如何将你创建的镜像推送到\
  \ Docker Hub。\n\n脚注 1 [`hub.docker.com/`](http://hub.docker.com/) 2 [`quay.io/`](http://quay.io/)\
