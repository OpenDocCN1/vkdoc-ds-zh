- "# 处理后的文本\n\n在第 8 章中，你学习了如何将`numpy`向量序列化以插入`Redis`和`PostgreSQL`。现在，在将序列化的`numpy`向量插入`MongoDB`之前，你需要在此过程中增加一个额外步骤。此前，这些向量仅仅是演示向量，没有任何意义。现在，你将使用`spacy.nlp`英文模型将收集到的推文编码为表示推文的`numpy`向量，即文档向量。\n\
  \n在代码清单 9-44 中，你加载了`spacy.nlp`英文模型。这次加载成功了。请注意，我特意避免深入讨论`spaCy`库，因为这超出了本书的范围。感兴趣的读者可参考该库的文档：[`spacy.io`](http://spacy.io)。\n\
  \n```\nIn [9]: import spacy\n        nlp = spacy.load('en')\n```\n\n**代码清单 9-44.**\
  \ 导入`spacy`并加载英文模型\n\n在代码清单 9-45 中，你执行了对所有推文文档的搜索。搜索返回的不是结果本身，而是一个游标，你可以用它逐个遍历文档。这非常有用，因为任何时候内存中最多只会有一个文档。你使用`.next()`类函数来检索第一条推文。\n\
  \n```\nIn [10]: cursor = mongo_server.twitter.tweets.find()\n         stored_tweet\
  \ = cursor.next()\n```\n\n**代码清单 9-45.** 创建搜索所有推文的游标并检索单条推文\n\n在代码清单 9-46 中，你显示了推文的文本。\n\
  \n```\nIn [11]: stored_tweet['text']\nOut[11]: 'Amazing day exploring the Sunken\
  \ City.  #California is unbelievable....\n         https://t.co/INl0o1znc7'\n```\n\
  \n**代码清单 9-46.** 显示单条推文的文本\n\n在代码清单 9-47 中，你使用`spacy.nlp`英文模型，根据推文文本创建了一个文档对象。该文档对象包含关联的文档向量，作为属性`.vector`。在代码清单\
  \ 9-48 中，你使用`.shape`属性显示了该向量的维度。\n\n```\nIn [12]: doc = nlp(stored_tweet['text'])\n\
  ```\n\n**代码清单 9-47.** 从推文文本创建文档向量\n\n```\nIn [13]: doc.vector.shape\nOut[13]: (300,)\n\
  ```\n\n**代码清单 9-48.** 显示文档向量的形状\n\n在代码清单 9-49 中，你更新了`MongoDB`中的推文文档。`.update_one()`函数接受两个字典参数。第一个参数是用于搜索要更新文档的字典。这里，你指定要更新`_id`与`stored_tweet`匹配的文档。第二个参数指定要更新的值。在这种情况下，你希望将键`'document_vector'`设置为文档向量的序列化值。请注意，你使用`.tostring()`函数来序列化文档向量以便存储。\n\
  \n```\nIn [14]: mongo_server.twitter.tweets.update_one(\n             {'_id': stored_tweet['_id']},\n\
  \             {'$set': {'document_vector': doc.vector.tostring()}})\nOut[14]: <pymongo.results.UpdateResult\
  \ at 0x7f2796c6d750>\n```\n\n**代码清单 9-49.** 使用序列化的文档向量更新`MongoDB`中的推文文档\n\n然后，你对第二条推文重复此过程。在代码清单\
  \ 9-50 中，你检索了第二条推文并显示其文本。在代码清单 9-51 中，你创建了文档向量。在代码清单 9-52 中，你更新了`MongoDB`中的推文文档。\n\
  \n```\nIn [15]: stored_tweet = cursor.next()\n         stored_tweet['text']\nOut[15]:\
  \ \"Idk what's so soothing about their fingers changing\"\n```\n\n**代码清单 9-50.**\
  \ 检索下一条推文并显示文本\n\n```\nIn [16]: doc = nlp(stored_tweet['text'])\n```\n\n**代码清单 9-51.**\
  \ 从推文文本创建文档向量\n\n```\nIn [17]: mongo_server.twitter.tweets.update_one(\n       \
  \      {'_id': stored_tweet['_id']},\n             {'$set': {'document_vector':\
  \ doc.vector.tostring()}})\nOut[17]: <pymongo.results.UpdateResult at 0x7f2796c48fc0>\n\
  ```\n\n**代码清单 9-52.** 使用序列化的文档向量更新`MongoDB`中的推文文档\n\n## 将 AWS 实例类型切换为`t2.micro`\n\
  \n完成两条推文的编码后，你已经完成了任务中资源密集型的部分，不再需要`spacy.nlp`英文模型。这意味着你可以将 AWS 实例类型切换回`t2.micro`。操作方式与切换到`t2.medium`完全相同。由于你已经将结果写入`MongoDB`，并使用\
  \ Docker 卷持久化`MongoDB`中的数据，你的工作将在切换过程中保持不变。要进行切换，你需要：\n\n1.  停止 Docker Compose 应用程序。\n\
  2.  关闭 AWS 实例。\n3.  将 AWS 实例的实例类型更改回`t2.micro`。\n4.  重新启动 AWS 实例，注意生成的新 IP 地址。\n\
  5.  重新启动 Docker Compose 应用程序。\n\n### 从 MongoDB 检索推文并进行比较\n\n使用你的`t2.micro`实例，你可以对推文向量进行一些比较。为此，你需要创建一个新的\
  \ Jupyter Notebook。在代码清单 9-53 中，你连接到了`MongoDB`。\n\n```\nIn [1]: import pymongo\n\
  \        mongo_server = pymongo.MongoClient('this_mongo')\n```\n\n**代码清单 9-53.**\
  \ 连接到`MongoDB`\n\n在代码清单 9-54 中，你使用`.find()`搜索`MongoDB`中的所有推文。这次，你不使用游标，而是将返回的游标转换为列表。不过多深入\
  \ Python 的具体操作，效果是创建了一个从`MongoDB`拉取的推文列表。因为你使用了关键字参数`projection`来请求`document_vector`，所以该列表将只包含每条推文的`_id`和`document_vector`。\n\
  \n```\nIn [2]: tweet_vectors = list(mongo_server.twitter.tweets.find(projection=['document_vector']))\n\
  ```\n\n**代码清单 9-54.** 从`MongoDB`检索文档向量列表\n\n在代码清单 9-55 中，你将字节流文档向量反序列化为`numpy`向量，以便用于计算。你像在第\
  \ 8 章中那样，使用`.fromstring()`函数完成此操作。\n\n```\nIn [3]: import numpy as np\n        tweet_vectors_np\
  \ = [tw['document_vector'] for tw in tweet_vectors]\n        tweet_vectors_np =\
  \ [np.fromstring(tw) for tw in tweet_vectors_np]\n```\n\n**代码清单 9-55.** 创建`numpy`文档向量列表\n\
  \n在代码清单 9-56 中，你对两个推文文档向量执行了余弦相似度计算。结果显示，这两条推文非常相似，至少根据`spacy.nlp`英文模型编码是如此。\n\n\
  ```\nIn [4]: from sklearn.metrics.pairwise import cosine_similarity\n        cosine_similarity(tweet_vectors_np[0].reshape(1,\
  \ -1),\n                          tweet_vectors_np[1].reshape(1, -1))\nOut[4]: array([[\
  \ 0.99992551]])\n```\n\n**代码清单 9-56.** 计算两条推文的余弦相似度\n\n\n\n"
- "# Docker Compose 网络\n\n在第 8 章中，你通过手动配置 Docker 网络，在 Jupyter Notebook 服务器所在的同一系统上启动并配置了一个\
  \ PostgreSQL 数据库。虽然这个过程并不简单，但完成该章节的学习可以让你深入了解 Docker 如何配置其内部网络，供容器之间相互连接。而使用 Docker\
  \ Compose 则有一种更简单的方法。请注意，对于使用版本 2 或更高版本的 `docker-compose.yml` 文件，Docker Compose\
  \ 中的网络配置有显著不同。我仍然推荐使用版本 3，并在此说明以保持完整性。也就是说，我将继续假设你使用的是版本 3，但你应该了解 Docker Compose\
  \ 中从版本 1 到版本 2 在网络方面的重大升级。在运行时，Docker Compose 会自动为应用程序设置一个单一网络。在 `docker-compose.yml`\
  \ 文件中定义的服务容器默认会加入此网络，并立即对应用程序中的其他容器可用，且可通过定义服务时使用的名称进行发现。请参考清单 9-57 中示例 `docker-compose.yml`\
  \ 文件定义的应用程序，假设该文件位于名为 `ch_9_sample` 的目录中。\n\n```\nversion: \"3\"\nservices:\n  this_jupyter:\n\
  \    image: jupyter/scipy-notebook\n    ports:\n      - \"8888:8888\"\n  this_redis:\n\
  \    image: redis:alpine\n  this_posstgres:\n    image: postgres:alpine\n```\n\n\
  清单 9-57. 示例 `docker-compose.yml` 文件\n\n当你运行 `docker-compose up` 时，`docker-compose`\
  \ 会指示 Docker 引擎执行以下操作：\n\n1.  创建一个名为 `ch9sample_default` 的网络。\n2.  创建一个名为 `ch9sample_this_jupyter`\
  \ 的容器，并将容器内的端口 `8888` 暴露到主机的端口 `8888` 上。\n3.  指示 `ch9sample_this_jupyter` 使用名称 `this_jupyter`\
  \ 加入 `ch9sample_default` 网络。\n4.  创建一个名为 `ch9sample_this_redis` 的容器。\n5.  指示 `ch9sample_this_redis`\
  \ 使用名称 `this_redis` 加入 `ch9sample_default` 网络。\n6.  创建一个名为 `ch9sample_this_postgres`\
  \ 的容器。\n7.  指示 `ch9sample_this_postgres` 使用名称 `this_postgres` 加入 `ch9sample_default`\
  \ 网络。\n\n现在，应用程序中的每个容器都可以使用容器在网络上的名称（例如 `this_jupyter`、`this_redis` 或 `this_postgres`）来访问其他所有容器（图\
  \ 9-10）。\n\n![A439726_1_En_9_Fig10_HTML.jpg](img/A439726_1_En_9_Fig10_HTML.jpg)\n\
  \n图 9-10. 一个示例的默认 Docker Compose 网络配置\n\n"
- "# 带持久化存储的 Jupyter 和 Postgres\n\n在本章的最后一个应用中，你将构建一个 Jupyter Notebook 和 PostgreSQL\
  \ 应用程序（图 9-11）。你将配置 PostgreSQL 使用数据卷以实现持久化存储。你还会设置 Postgres 使用构建方式而非直接使用镜像。\n\n\
  ![A439726_1_En_9_Fig11_HTML.jpg](img/A439726_1_En_9_Fig11_HTML.jpg)\n\n图 9-11. 一个包含两个服务和一个数据卷的\
  \ Docker Compose 应用程序\n\n在第 8 章中，我提到 PostgreSQL 天生擅长处理 CSV 文件。此外，PostgreSQL 的公共镜像包含多个构建钩子，有助于在运行时初始化数据库。根据\
  \ Docker Hub 上的 postgres 文档¹¹：\n\n> 在入口点调用 `initdb` 创建默认的 `postgres` 用户和数据库后，它会运行该目录中找到的任何\
  \ `*.sql` 文件，并执行任何 `*.sh` 脚本，以在启动服务之前进行进一步的初始化。\n\n这意味着你可以将 SQL 文件和 shell 脚本作为镜像构建过程的一部分添加进去，这些文件将在运行时自动执行，并为你设置好数据库。同样，你首先创建一个目录来存放你的项目（清单\
  \ 9-58）。在清单 9-59 中，你创建新的 `docker-compose.yml` 文件（清单 9-60）。\n\n```\n$ mkdir ch_9_jupyter_postgres\n\
  $ cd ch_9_jupyter_postgres\n```\n\n清单 9-58. 创建项目目录\n\n```\n$ vim docker-compose.yml\n\
  ```\n\n清单 9-59. 创建 `docker-compose.yml` 文件\n\n```\nversion: '3'\nservices:\n  this_jupyter:\n\
  \    build: docker/jupyter\n    ports:\n      - \"8888:8888\"\n    volumes:\n  \
  \    - .:/home/jovyan\n  this_postgres:\n    build: docker/postgres\n    volumes:\n\
  \      - postgres_data:/var/lib/postgresql/data\nvolumes:\n  postgres_data:\n```\n\
  \n清单 9-60. `ch_9_jupyter_postgres/docker-compose.yml` 文件\n\n\n\n### 指定构建上下文\n\n\
  读者会注意到，这里定义的两个服务都使用了 `build:` 关键字，而不是 `image:` 关键字。这意味着你的项目将需要两个构建上下文，每个镜像一个。在代码清单\
  \ 9-61 中，你创建了两个构建上下文，然后使用 `tree` 命令显示当前项目。\n\n```\n$ mkdir -p docker/jupyter\n$\
  \ mkdir -p docker/postgres\n$ tree .\n├── docker\n│   ├── jupyter\n│   └── postgres\n\
  └── docker-compose.yml\n```\n\n代码清单 9-61. 创建两个构建上下文\n\n接下来，在代码清单 9-62 中，你为 `this_jupyter`\
  \ 服务创建了第一个 `Dockerfile`（代码清单 9-63）。你使用这个 `Dockerfile` 仅仅是为了安装将要用于访问 PostgreSQL 的\
  \ `psycopg2` 模块。\n\n```\n$ vim docker/jupyter/Dockerfile\n```\n\n代码清单 9-62. 创建 `docker/jupyter/Dockerfile`\n\
  \n```\nFROM jupyter/scipy-notebook\nUSER root\nRUN conda install --yes --name root\
  \ psycopg2\nUSER jovyan\n```\n\n代码清单 9-63. `docker/jupyter/Dockerfile`\n\n在代码清单\
  \ 9-64 中，你为 `this_postgres` 服务创建了第二个 `Dockerfile`（代码清单 9-65）。在这个 `Dockerfile` 中，你使用\
  \ `postgres:alpine` 镜像作为基础镜像，并将构建上下文中的两个文件 `get_data.sh`（代码清单 9-66）和 `initdb.sql`（代码清单\
  \ 9-67）复制到镜像中。如上所述，由于你将这两个文件添加到了 `/docker-entrypoint-initdb.d/` 目录下，因此在运行时，shell\
  \ 脚本将由 `bash` 执行，SQL 文件将由 PostgreSQL 执行。你将利用这一点在数据库中创建一个表并填充数据。\n\n```\n$ vim docker/postgres/Dockerfile\n\
  ```\n\n代码清单 9-64. 创建 `docker/postgres/Dockerfile`\n\n```\nFROM postgres:alpine\n\
  COPY get_data.sh /docker-entrypoint-initdb.d/get_data.sh\nCOPY initdb.sql /docker-entrypoint-initdb.d/initdb.sql\n\
  ```\n\n代码清单 9-65. `docker/postgres/Dockerfile`\n\n**注意：** 你用于填充数据库的 CSV 文件来自 UCI\
  \ 机器学习库。¹² 该数据存在一个问题，即某些值缺失，并被替换为 `?` 字符。为了解决这个问题，我使用了流编辑器工具 `sed`¹³ 将所有 `?` 字符替换为空（即从文件中完全移除\
  \ `?` 字符）。\n\n```\n#!/bin/bash\nwget -P /tmp/ http://archive.ics.uci.edu/ml/machine-learning-databases/breast-cancer-wisconsin/breast-cancer-wisconsin.data\n\
  sed 's/?//' /tmp/breast-cancer-wisconsin.data > /tmp/bcdata-clean.csv\n```\n\n代码清单\
  \ 9-66. `docker/postgres/get_data.sh`\n\n```\nCREATE TABLE bc_data (\n    sample_id\
  \ INTEGER UNIQUE PRIMARY KEY,\n    clump_thickness INTEGER,\n    uniformity_of_cell_size\
  \ INTEGER,\n    uniformity_of_cell_shape INTEGER,\n    marginal_adhesion INTEGER,\n\
  \    single_epithelial_cell_size INTEGER,\n    bare_nuclei INTEGER,\n    bland_chromatin\
  \ INTEGER,\n    normal_nucleoli INTEGER,\n    mitoses INTEGER,\n    class INTEGER\n\
  );\nCOPY bc_data FROM /tmp/bcdata-clean.csv DELIMITER ',' CSV;\n```\n\n代码清单 9-67.\
  \ `docker/postgres/initdb.sql`\n\n在代码清单 9-68 中，你使用 `tree` 工具展示了项目的最终状态。\n\n```\n\
  $ tree .\n├── docker\n│   ├── jupyter\n│   │   └── Dockerfile\n│   └── postgres\n\
  │       ├── Dockerfile\n│       ├── get_data.sh\n│       └── initdb.sql\n└── docker-compose.yml\n\
  ```\n\n代码清单 9-68. 使用 `tree` 显示应用程序目录\n\n### 使用 Compose 构建并运行应用程序\n\n在准备运行应用程序时，你使用\
  \ `docker-compose build` 来构建用于定义服务的两个镜像（代码清单 9-69）。\n\n```\n$ docker-compose build\n\
  Building this_jupyter\nStep 1/4 : FROM jupyter/scipy-notebook\n...\nStep 2/4 : USER\
