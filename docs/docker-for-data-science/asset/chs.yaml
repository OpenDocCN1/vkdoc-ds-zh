- "# 使用 Docker 桥接网络实现容器通信\n\n要使用桥接网络连接到另一个 Docker 容器，你需要识别该容器在桥接网络上的 IP 地址，这是一个相当复杂的过程。出于你的目的，创建一个额外的网络并将容器连接到该网络可能会更简单。\n\
  \n如果你一直按照步骤操作到这里，现在应该有两个正在运行的容器：一个 `jupyter/scipy-notebook` 容器和一个 Postgres 容器，如代码清单\
  \ 8-63 所示。\n\n```\n$ docker ps\nCONTAINER ID   IMAGE                 COMMAND   \
  \               CREATED          ...  NAMES\nf9751d99f09d   postgres           \
  \   \"docker-entrypoint.sh\"   22 minutes ago   ...  this_postgres\ncce1148863a2\
  \   jupyter/scipy-notebook \"tini -- start-notebo\"  2 minutes ago    ...  hungry_cray\n\
  ```\n\n**代码清单 8-63.** 显示正在运行的容器\n\n使用 `docker network` 工具，可以创建一个网络，并将这些正在运行的容器连接到该网络。一旦将这些容器连接到新网络，你就可以通过名称（`this_postgres`\
  \ 和 `hungry_cray`）连接到它们。\n\n首先，使用 `docker network create` 命令创建一个新的桥接网络，供你的容器使用（代码清单\
  \ 8-64）。\n\n```\n$ docker network create jupyter_bridge\nb8146c1af3a91abe4c123b9234d372e098fd71f1f0facd3e8251da2e864253ee\n\
  ```\n\n**代码清单 8-64.** 创建一个新的桥接网络\n\n你可以使用 `docker network inspect` 命令检查新网络，如代码清单\
  \ 8-65 所示。\n\n```\n$ docker network inspect jupyter_bridge\n[\n    {\n        \"\
  Name\": \"jupyter_bridge\",\n        \"Id\": \"b8146c1af3a91abe4c123b9234d372e098fd71f1f0facd3e8251da2e864253ee\"\
  ,\n        \"Scope\": \"local\",\n        \"Driver\": \"bridge\",\n        \"EnableIPv6\"\
  : false,\n        \"IPAM\": {\n            \"Driver\": \"default\",\n          \
  \  \"Options\": {},\n            \"Config\": [\n                {\n            \
  \        \"Subnet\": \"172.18.0.0/16\",\n                    \"Gateway\": \"172.18.0.1\"\
  \n                }\n            ]\n        },\n        \"Internal\": false,\n \
  \       \"Containers\": {},\n        \"Options\": {},\n        \"Labels\": {}\n\
  \    }\n]\n```\n\n**代码清单 8-65.** 检查新的桥接网络\n\n这里你看到了刚刚创建的新网络。可以看到它当前没有连接任何容器。在代码清单\
  \ 8-66 中，你将 `jupyter/scipy-notebook` 容器（`hungry_cray`）和 Postgres 容器（`this_postgres`）连接到刚刚创建的新网络，之后再次检查该网络。\n\
  \n```\n$ docker network connect jupyter_bridge hungry_cray\n$ docker network connect\
  \ jupyter_bridge this_postgres\n$ docker network inspect jupyter_bridge\n[\n   \
  \ {\n        \"Name\": \"jupyter_bridge\",\n    ...\n        \"Containers\": {\n\
  \            \"cce1148863a22d11272ca031ded06139b2f0372d92aca269fd0d50234a30cf1c\"\
  : {\n                \"Name\": \"hungry_cray\",\n                \"EndpointID\"\
  : \"e01136684ea417200178a0afaaf634f39cd92f332cb91b34a81dd7f7fcbbfc43\",\n      \
  \          \"MacAddress\": \"02:42:ac:19:00:02\",\n                \"IPv4Address\"\
  : \"172.25.0.2/16\",\n                \"IPv6Address\": \"\"\n            },\n  \
  \          \"f9751d99f09d691dc3f04d246c502f1fa4ff3ae059632428a65affa3e5307f17\"\
  : {\n                \"Name\": \"this_postgres\",\n                \"EndpointID\"\
  : \"ae9a95c157092da3adbcb251ff9c370820f6b7ad9f20a8df44cb971352af4cc9\",\n      \
  \          \"MacAddress\": \"02:42:ac:19:00:03\",\n                \"IPv4Address\"\
