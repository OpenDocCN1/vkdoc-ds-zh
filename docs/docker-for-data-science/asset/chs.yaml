  \ 中，你打开浏览器，使用与主机系统关联的 IP 地址访问 Jupyter。\n\n![A439726_1_En_9_Fig4_HTML.jpg](img/A439726_1_En_9_Fig4_HTML.jpg)\n\
  \n**图 9-4.** 在 t2.micro 上运行的 Jupyter\n\n为了测试你的系统，你将再次使用基于位置的过滤器来流式传输推文。与第 8 章一样，你将把收集到的每条推文插入\
  \ MongoDB。为了增加一点复杂性，在将推文插入 MongoDB 之前，你将使用 spaCy 库将该推文文本编码为 numpy 向量。为了将向量存储在 MongoDB\
  \ 中，你需要将向量序列化为二进制字节流。你在第 8 章中使用 Redis 完成了此操作，这里你使用 MongoDB 执行相同的操作。\n\n你首先配置 Twitter\
  \ 身份验证。你从 `os` 模块导入 `environ` 对象，并从 `twitter` 模块导入 `OAuth` 类。`environ` 对象⁸ 是一个映射⁹对象，表示操作系统的字符串环境。它在导入时被捕获。在这里，你将使用它来引用包含你凭据的环境变量，这些变量定义在\
  \ `docker-compose.yml` 和 `config/jupyter.env` 文件中；请参见代码清单 9-30。\n\n```\nIn [1]:\
  \ from os import environ\n        from twitter import OAuth\n```\n\n**代码清单 9-30.**\
  \ 导入配置 Twitter 身份验证所需的模块\n\n在代码清单 9-31 中，你使用存储的凭据实例化一个 `OAuth` 对象。请注意，每个值都像字典一样通过其键来访问。\n\
  \n```\nIn [2]: oauth = OAuth(environ['ACCESS_TOKEN'],\n                      environ['ACCESS_SECRET'],\n\
  \                      environ['CONSUMER_KEY'],\n                      environ['CONSUMER_SECRET'])\n\
  ```\n\n**代码清单 9-31.** 实例化 `OAuth` 对象\n\n在代码清单 9-32 中，你导入 `TwitterStream` 类，并使用你定义的身份验证实例化该类的对象。\n\
  \n```\nIn [3]: from twitter import TwitterStream\n        los_angeles_bbox = \"\
  -118.55, 33.97, -118.44, 34.05\"\n        twitterator = (TwitterStream(auth=oauth)\n\
  \                       .statuses\n                       .filter(locations=los_angeles_bbox))\n\
  ```\n\n**代码清单 9-32.** 实例化 `TwitterStream`\n\n最后，在代码清单 9-33 中，你从流中拉取一条推文，然后显示其键。\n\
  \n```\nIn [4]: this_tweet = next(twitterator)\n        this_tweet.keys()\n```\n\n\
  **代码清单 9-33.** 拉取一条推文并显示其 `keys`\n\n现在你内存中有一条推文，可以将其插入 MongoDB。在插入之前，你将使用 spaCy\
  \ 库将推文编码为向量。你将把编码后的向量作为二进制字节流添加到包含推文的字典中。首先（代码清单 9-34），你导入 `spacy` 并加载 `en` 模型。在\
  \ t2.micro 上执行此操作时，你会收到一个内存错误。\n\n```\nIn [5]: import spacy\n        nlp = spacy.load('en')\n\
  \        --------------------------------------------------------------------\n\
  \        MemoryError                        Traceback (most recent call last)\n\
  \        <ipython-input-8-e0448d429293> in <module>()\n              1 import spacy\n\
  \              2\n        ----> 3 nlp = spacy.load('en')\n```\n\n**代码清单 9-34.**\
  \ 导入 `spacy` 并加载 `en` 语言模型\n\n好吧，起初这样的错误可能令人烦恼甚至令人生畏，但能够有效处理此类问题正是你首先学习这项技术的主要原因。在代码清单\
  \ 9-35 中，你使用 `docker stats` 工具来诊断你的错误。请注意，`docker-compose` 没有自己的 `docker stats`\
  \ 工具，因此你只需使用之前一直在使用的标准工具。\n\n```\nCONTAINER     CPU %   MEM USAGE / LIMIT     MEM\
  \ %\n698ba3322462  0.02%   539.2MiB / 990.7MiB   54.43%\na37b17785360  0.37%   49.77MiB\
  \ / 990.7MiB   5.02%\nNET I/O           BLOCK I/O         PIDS\n1.26MB / 1.88MB\
  \   89.1GB / 1.42MB   15\n21.8kB / 28.9kB   184GB / 15.5MB    22\n```\n\n**代码清单\
  \ 9-35.** 使用 `docker stats` 诊断内存错误\n\n值得注意的是，你的系统上运行着两个容器，而 `docker stats` 没有给它们提供人类可读的名称。你可以从内存使用情况推断出\
  \ `698ba3322462` 是 Jupyter 容器。你可以使用 `Ctrl+C` 终止 `docker stats` 工具，并使用 `docker ps`\
  \ 来验证这一点，如代码清单 9-36 所示。\n\n```\nCONTAINER ID IMAGE                        ... NAMES\n\
  698ba3322462 ch9jupytermongo_this_jupyter ... ch9jupytermongo_this_jupyter_1\na37b17785360\
  \ mongo                        ... ch9jupytermongo_this_mongo_1\n```\n\n**代码清单 9-36.**\
  \ 使用 `docker ps` 诊断内存错误\n\n果然，是 Jupyter 容器使用了超过一半的系统内存……并且处于失败状态！它甚至没有完成加载模型。根据\
  \ spaCy 关于其特定模型的文档，¹⁰ 加载英语模型似乎需要 1GB 的 RAM。考虑到这是你 t2.micro 上的全部 RAM，你将无法在 t2.micro\
  \ 上加载 spaCy 英语模型。\n\n让我们暂时搁置这个问题的解决方案。首先，你像在第 8 章中那样，将推文插入 MongoDB（代码清单 9-37）。你通过导入\
  \ `pymongo` 模块并实例化一个数据库客户端，然后使用该客户端插入 `this_tweet` 来完成此操作。在代码清单 9-38 中，你统计 `tweet_collection`\
