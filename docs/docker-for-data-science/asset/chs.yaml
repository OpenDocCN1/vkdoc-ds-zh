  \ 7-26. 验证库安装\n\n\n\n### 维护对镜像的半持久化更改\n\n具有 DevOps 思维的读者无疑会对在运行的 Jupyter 容器中安装库感到困扰。到目前为止，您一直坚持这样的理念：使用容器的最佳实践是，它们可以随时关闭、移除和重启，而不会对工作流程造成任何损失。如果您要删除\
