- "# 7. 固执己见的 Jupyter 堆栈\n\nJoshua Cook (1) (1) 美国加利福尼亚州圣莫尼卡\n\n> Jupyter Notebook\
  \ 基于一套用于交互式计算的开放标准。——Project Jupyter¹\n\nProject Jupyter 源于学术环境，该项目不仅产生了一款突破性的应用程序，还为一套交互式计算范式定义了一套完善的协议。就\
  \ Notebook 而言，这些协议包括 Notebook 文档格式、交互式计算协议和内核。这些协议以及其他定义 Jupyter 生态系统的协议由一个公开管理的指导委员会维护。²\
  \ 除了定义通过 Jupyter 进行交互式计算的协议以及维护构成生态系统的众多项目之外，Project Jupyter 还维护着一个 GitHub 仓库，其中包含许多定义明确的\
  \ Jupyter Docker 镜像：固执己见的 Jupyter 堆栈。³\n\n在 Docker 容器中启动 Jupyter Notebook 服务器是一件轻而易举的事情。在清单\
  \ 7-1 中，你使用 `-P`（发布所有）标志来执行此操作，该标志会将所有暴露的端口发布到主机上的随机端口。\n\n```\n$ docker run -d\
  \ -P jupyter/scipy-notebook\n72da8ca9ac9d4c694477350c500e9d793769788a26148a144e6c29448b5b4840\n\
  ```\n\n清单 7-1. 启动 Jupyter `scipy-notebook` 服务器\n\n要使用此容器，你需要知道容器中的端口 8888 已发布到主机系统上的哪个端口（清单\
  \ 7-2），并且需要获取 Notebook 服务器的安全令牌（清单 7-3）。在清单 7-2 中，你使用 `docker port` 命令来获取容器的端口映射，使用启动容器时返回的容器\
  \ ID `72da8ca9ac9d4...` 的前四个字符 `72da`。\n\n> **注意：** 只要能够建立唯一的容器引用，就可以使用尽可能少的字符来引用\
  \ Docker 容器。如果其他容器 ID 不以 `7` 开头，则容器 `72da8ca9ac9d4c694477350c500e9d793769788a26148a144e6c29448b5b4840`\
  \ 可以用 `7` 来引用。\n\n```\n$ docker port 72da\n8888/tcp -> 0.0.0.0:32769\n```\n\n清单\
  \ 7-2. 获取容器的端口映射\n\n在清单 7-3 中，你使用 `docker exec` 命令向正在运行的 Docker 容器内的 Jupyter Notebook\
  \ 服务器发送命令。你再次使用容器 ID 的前四个字符来引用容器，然后向容器发送命令 `jupyter notebook list`。这会产生打开一个容器 shell、在\
  \ shell 中运行此命令、显示结果并关闭 shell 的效果。\n\n```\n$ docker exec 72da jupyter notebook list\n\
  Currently running servers:\nhttp://localhost:8888/?token=61d6ead40b05daea402d9843ad7932bc937da41841575765\
  \ :: /home/jovyan\n```\n\n清单 7-3. 获取正在运行的 Jupyter Notebook 服务器的安全令牌\n\n请记住，此处提供的\
  \ URL 指的是可以在 Docker 容器内访问 Notebook 服务器的 URL。实际位置是使用你的 Docker 机器的 IP（`localhost`\
  \ 或你的 AWS 实例的 IP，或你运行 Docker 的虚拟机）以及你在上一条命令中获得的端口。清单 7-4 显示了在 Linux 版 Docker、Mac\
  \ 版 Docker 或 Windows 版 Docker 下使用的 URL。清单 7-5 显示了在 Docker Toolbox 下最可能使用的 URL。（请参阅第\
  \ 1 章的清单 1-10，回顾如何在 AWS 上访问你的 Jupyter 系统。）\n\n```\nhttp://localhost:32769/?token=61d6ead40b05daea402d9843ad7932bc937da41841575765\n\
  ```\n\n清单 7-4. 如果使用 Linux/Mac/Windows 版 Docker，当前的 Jupyter URL\n\n```\nhttp://192.168.99.100:32769/?token=61d6ead40b05daea402d9843ad7932bc937da41841575765\n\
  ```\n\n清单 7-5. 如果使用 Docker Toolbox，可能的当前 Jupyter URL\n\n## 高级概述\n\nProject Jupyter\
  \ Docker 堆栈提供了八个 Notebook 镜像，从所有后续镜像所依赖的 `base-notebook` 镜像开始：\n\n1. `base-notebook`\n\
  2. `minimal-notebook`\n3. `scipy-notebook`\n4. `r-notebook`\n5. `tensorflow-notebook`\n\
  6. `datascience-notebook`\n7. `pyspark-notebook`\n8. `all-spark-notebook`\n\n每个镜像在\
  \ GitHub 的 [jupyter/docker-stacks](https://github.com/jupyter/docker-stacks) 项目中都有一个同名的文件夹，并且在\
  \ Docker Hub 上 [jupyter](http://hub.docker.com/u/jupyter/) 用户命名空间下也有一个等效的仓库。图 7-1\
  \ 显示了这些镜像的依赖关系。![A439726_1_En_7_Fig1_HTML.jpg](img/A439726_1_En_7_Fig1_HTML.jpg)\
  \ 图 7-1. Jupyter Docker 堆栈依赖关系图\n\n> **注意：** `base-notebook` 使用 Debian “jesse”⁴，因此为每个\
  \ Notebook 镜像提供容器操作系统。\n\n\n\n### `jupyter/base-notebook`\n\n`jupyter/base-notebook`\
  \ 镜像定义了一个极简的 Jupyter Notebook 服务器。它仅预装了适用于 Python 3 的 Miniconda，并未预装 Python 2 或任何科学计算包（从\
  \ `numpy` 开始）。但它定义了贯穿整个技术栈用于构建 Jupyter 镜像的基本模式：使用 init 二进制文件 `tini`、添加非特权用户 `jovyan`，以及包含用于运行服务器的各种启动脚本。在实践中你很少会直接使用\
  \ `base-notebook` 镜像，但会将其中的开发模式视为最佳实践。你对下游镜像所做的任何修改都需要考虑这些实践。在第 2 章中，当你将本地文件卷挂载到容器中运行的服务器时，就已经遵循了这些实践。你使用\
  \ `-v pwd:/home/jovyan` 标志将工作目录中的文件挂载到容器目录 `/home/jovyan`，如代码清单 7-6 所示。\n\n```\n\
  $ docker run -d -v `pwd`:/home/jovyan -P jupyter/scipy-notebook\n```\n\n**代码清单 7-6.**\
  \ 将主机目录挂载到容器\n\n将 `/home/jovyan` 目录作为 notebook 根目录的定义，位于定义 `base-notebook` 镜像的 Dockerfile\
  \ 中（代码清单 7-7）。\n\n```\n...\nENV NB_USER jovyan\n...\nWORKDIR /home/$NB_USER/work\n\
  ...\n```\n\n**代码清单 7-7.** `base-notebook` Dockerfile\n\n### Notebook 安全性\n\n将 notebook\
  \ 服务器作为可通过开放网络公开访问的服务器来运行并不罕见。此外，notebook 服务器能够运行任意代码。因此，限制对 notebook 服务器的访问是一种最佳实践。Opinionated\
  \ Jupyter Stacks 定义了一系列安全最佳实践，这些实践主要定义在 `base-notebook` 镜像的 Dockerfile 中。默认情况下，在容器中运行的\
  \ notebook 服务器要求在通过浏览器访问时，将随机生成的安全令牌作为查询参数传递。你之前已经看到，可以通过 `docker exec` 向运行中的容器发送\
  \ `jupyter notebook list` 命令来获取此令牌（代码清单 7-3）。`base-notebook` 镜像定义了 `start-notebook.sh`\
  \ 脚本，该脚本作为运行时传递给 `tini` 的默认命令。此脚本可用于定义替代的身份验证方法，但**不推荐**这样做。\n\n在能够保证安全性的安装环境中（或者你愿意放宽限制，例如临时\
  \ AWS 实例），你可能希望授予 `jovyan` 用户 `sudo` 权限。这可以通过传递环境变量 `GRANT_SUDO=yes` 来实现。此外，容器必须由\
  \ root 用户运行。代码清单 7-8 展示了运行 notebook 服务器并授予 `jovyan` 用户无密码 `sudo` 权限的完整命令。\n\n```\n\
  $ docker run -d -e GRANT_SUDO=yes --user root jupyter/scipy-notebook\na811689f2e09737e2c9686849320a424889b2ac9eeb57e0f3df2940edc600628\n\
  ```\n\n**代码清单 7-8.** 运行 Notebook 服务器并授予 `jovyan` 用户无密码 `sudo` 权限\n\n在探索性工作中，授予 `jovyan`\
  \ 用户 `sudo` 权限非常有用。你可能希望快速安装不属于镜像的 Linux 二进制文件，而无需经历完整的镜像构建周期。授予 `sudo` 权限后，这便成为可能。如果你通过\
  \ `docker exec` 连接到运行中的容器，可以看到 `tini` 已由 root 用户启动（代码清单 7-9）。`GRANT_SUDO` 标志的作用是通过\
  \ `su jupyter notebook` 启动由 `jovyan` 拥有的 `jupyter notebook` 进程。\n\n```\n$ docker\
  \ exec -it a811 ps aux\nUSER    PID  %CPU  %MEM VSZ    RSS    TTY  STAT  START \
  \ TIME  COMMAND\nroot    1    1.0   0.0  4224   668    ?    Ss    23:41  0:00  tini\
  \ -- start-notebook.sh\nroot    6    0.4   0.1  46360  3084   ?    S     23:41 \
  \ 0:00  su jovyan -c env ...\njovyan  9    33.2  2.4  183488 50612  ?    Ss    23:41\
  \  0:01  /opt/conda/bin/python ...\nroot    13   0.0   0.1  19100  2556   ?    Rs\
  \    23:41  0:00  ps aux\n```\n\n**代码清单 7-9.** 以 `root` 身份连接到运行中的容器并查看运行进程\n\n未使用此标志运行的\
  \ notebook 服务器（代码清单 7-10）将如代码清单 7-11 所示。请注意，`tini` 由 `jovyan` 启动，并且没有运行 `su` 命令来授予\
  \ `jovyan` `sudo` 权限。\n\n```\n$ docker run -d jupyter/base-notebook\ne900cbb66babb23f8b7764506482e32e300b8ad351e4ea15a0260266ca517738\n\
  ```\n\n**代码清单 7-10.** 运行 Notebook 服务器\n\n```\n$ docker exec e900 ps aux\nUSER  \
  \   PID  %CPU  %MEM   VSZ    RSS   TTY STAT  START  TIME  COMMAND\njovyan   1  \
  \  0.0   0.0    4224   656   ?   Ss    23:35  0:00  tini -- start-notebook.sh\n\
  jovyan   5    1.1   2.4    183404 50576 ?   S     23:35  0:01  /opt/conda/bin/python\
  \ ...\njovyan   2    0.0   0.1    19100  2436  ?   Rs    23:37  0:00  ps aux\n```\n\
  \n**代码清单 7-11.** 以 `jovyan` 身份连接到运行中的容器并查看运行进程\n\n### 默认环境\n\n`base-notebook` Dockerfile\
  \ 安装了 `miniconda3` 和最新稳定版的 Python 3。它还定义了默认的 conda 环境 `root`，该环境将用于管理你的 Python 3\
  \ 安装。你可以通过向 `base-notebook` 容器运行交互式 `bash` shell 来查看 `miniconda` 版本和 Python 3 环境的名称（代码清单\
  \ 7-12）。请注意，`ipython`、`python`、`pip`、`easy_install` 和 `conda` 在此环境中均可用，并且它们引用的是\
  \ `base-notebook` Dockerfile 中安装的 conda/python 版本。\n\n```\n$ docker run -it --rm\
  \ jupyter/base-notebook bash\njovyan@c9fb2312c5b8:~$ conda info -a\nCurrent conda\
  \ install:\n\n               platform : linux-64\n          conda version : 4.2.12\n\
  \       conda is private : False\n      conda-env version : 4.2.12\n    conda-build\
  \ version : not installed\n         python version : 3.5.2.final.0\n...\n# conda\
  \ environments:\n#\nroot                  *  /opt/conda\n```\n\n**代码清单 7-12.** 识别\
  \ Python 3 `conda` 环境\n\n值得注意的是，你也可以在已运行的容器中执行相同的命令，如代码清单 7-13 所示。代码清单 7-13 通过 shell（而非\
  \ `bash` shell）运行命令，并在命令执行完毕后关闭 shell。此处，`wizardly_hawking` 指的是运行中容器的随机生成名称。\n\n\
  ```\n$ docker exec wizardly_hawking conda info -a\nCurrent conda install:\n...\n\
  ```\n\n**代码清单 7-13.** 另一种识别 Python 3 `conda` 环境的方法\n\n这里可以看到你正在运行 Python 3.5.2，并且只有一个\
  \ Python 环境 `root`。你可以通过激活 `root` 环境并检查 Python 版本来验证 `root` 环境是否运行的是 3.5.2（代码清单\
  \ 7-14）。`source activate` 命令的作用是配置全局 `python`，使其使用位于 `/opt/conda/bin/python` 的 `python`\
  \ 二进制文件。\n\n```\njovyan@ c9fb2312c5b8:~$ source activate root\n(root) jovyan@ c9fb2312c5b8:~$\
  \ python --version\nPython 3.5.2 :: Continuum Analytics, Inc.\n(root) jovyan@ c9fb2312c5b8:~$\
  \ which python\n/opt/conda/bin/python\n```\n\n**代码清单 7-14.** 检查 `root` 环境的 Python\
  \ 版本\n\n\n\n### 管理 Python 版本\n\n随着 `IPython` 6 的发布以及对 Python 2 支持的终止，笔者认为，在 Docker\
  \ 镜像中已无需显式地管理环境。完全可以为运行最新稳定版 Python 分配一个 Docker 镜像，为运行某个有用但无需更新的旧版 Python 应用程序分配另一个镜像，再为在同一系统上运行\
  \ Python 的最新 alpha 版本分配第三个镜像。事实上，这正是 Docker 的完美用例。当每个实现运行在各自的容器中时，其依赖项彼此完全隔离。然而，就目前而言，随着社区继续从\
  \ Python 2 向 Python 3 进行有计划的迁移，我们仍需继续显式管理容器内运行的环境，主要目的是为了同时维护 `py2` 和 `py3` 环境。为此，我们将使用\
  \ `conda` 原生的环境管理能力。⁷ 在深入探讨环境实现的细节之前，值得注意的一点是，在运行中的笔记本或创建新笔记本时切换环境是一项非常简单的任务。我们研究环境是为了理解添加默认未安装的新库的最佳方式。图\
  \ 7-2 展示了如何创建使用不同 Python 内核的新笔记本。图 7-3 展示了如何为正在运行的笔记本切换内核。\n\n![A439726_1_En_7_Fig2_HTML.jpg](img/A439726_1_En_7_Fig2_HTML.jpg)\
  \  \n图 7-2. 创建新笔记本时选择内核\n\n![A439726_1_En_7_Fig3_HTML.jpg](img/A439726_1_En_7_Fig3_HTML.jpg)\
  \  \n图 7-3. 在运行中的笔记本里切换内核\n\n#### 使用 Dockerfile 简单扩展 Jupyter 镜像\n\n在大部分工作中，您会从 Jupyter\
  \ Docker 堆栈中获取一个镜像，然后根据需要使用第 4 章描述的构建过程添加您工作所需的特定库。例如，假设您希望使用 Python 机器学习库 `scikit-learn`\
  \ 对 Twitter 数据进行语义分析项目，并将数据存储在 MongoDB 数据库中。`scikit-learn` 默认包含在 `jupyter/scipy-notebook`\
  \ 镜像中，但 Python 的 MongoDB 接口库 `pymongo` 并不包含。构建此镜像的一种简单方法可能使用清单 7-15 中描述的 `Dockerfile`。\n\
  \n```\nFROM jupyter/scipy-notebook\nRUN pip install pymongo\n```\n\n清单 7-15. 为语义分析扩展\
  \ `jupyter/scipy-notebook` 的 Dockerfile\n\n然后，您可以使用 `docker build` 命令（清单 7-16）构建镜像，并使用\
  \ `docker run`（清单 7-17）运行由此镜像定义的容器。\n\n```\n$ docker build -t semantic_analysis\
  \ .\n```\n\n清单 7-16. 构建 `semantic_analysis` 镜像\n\n```\n$ docker run -d -P semantic_analysis\n\
  67cf8215ed6ad75c3709455bcdfffb72fb92df2abae3627962ba63677e06c45a\n$ docker port\
  \ 67cf\n8888/tcp -> 0.0.0.0:32776\n$ docker exec 67cf jupyter notebook list\nCurrently\
  \ running servers:\nhttp://localhost:8888/?token=d57ccd98004c383215c03ce25a7df85ec7796e04f8ca4723\
  \ :: /home/jovyan\n```\n\n清单 7-17. 运行 `semantic_analysis` 容器\n\n现在，您可以使用 URL `http://localhost:32776/?token=d57ccd98004c383215c03ce25a7df85ec7796e04f8ca4723`\
  \ 访问您的 `semantic_analysis` 容器。\n\n### 使用 conda 环境扩展 Jupyter 镜像\n\n管理 Python 环境的原始工具是\
  \ [virtualenv 工具](https://virtualenv.pypa.io/en/stable/)，至今仍被广泛使用。`virtualenv` 和\
  \ `conda` 环境都允许用户在同一系统上创建隔离的 Python 环境，类似于 Ruby 编程的 [Bundler](http://bundler.io/)\
  \ 工具。Jupyter Docker 堆栈使用 `conda` 环境来管理环境，您将利用现有环境为 Python 2 内核安装包，独立于为 Python 3\
  \ 内核安装包，反之亦然。您可以使用 `source activate` 命令手动在两者之间来回切换。在必要时，笔记本服务器会在内核启动时自动完成此操作。在清单\
  \ 7-18 中，您检查了 `jupyter/scipy-notebook` 镜像上的 `conda` 环境。请注意，`base-notebook` 和 `minimal-notebook`\
  \ 只有 Python 3，但 `scipy-notebook` 及其所有子镜像同时包含 Python 2 和 Python 3。\n\n```\n$ docker\
  \ run -it --rm jupyter/scipy-notebook bash\njovyan@83a2aec2da92:∼$ which python\n\
  /opt/conda/bin/python\njovyan@83a2aec2da92:∼$ python --version\nPython 3.5.2 ::\
  \ Continuum Analytics, Inc.\njovyan@83a2aec2da92:∼$ source activate root\n(root)\
  \ jovyan@83a2aec2da92:∼$ python --version\nPython 3.5.2 :: Continuum Analytics,\
  \ Inc.\n(root) jovyan@83a2aec2da92:∼$ source activate python2\n(python2) jovyan@83a2aec2da92:∼$\
  \ python --version\nPython 2.7.12\n```\n\n清单 7-18. 显示默认、`root` 和 `python2` 环境中 `python`\
  \ 二进制文件的位置和版本\n\n对基础 Jupyter 镜像进行正确的扩展，应该针对镜像上可用的每个 `conda` 环境进行，如清单 7-19 所示。在这里，您正在为两个\
  \ `conda` 环境安装 `pymongo` 库。\n\n```\nFROM jupyter/scipy-notebook\nUSER root\n# python\
  \ 3 环境名为 root\nRUN conda install --name root \\\n    pymongo\n# python 2 环境名为 python2\n\
