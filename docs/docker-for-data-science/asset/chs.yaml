  在本文中，你只会用到 `bridge` 网络。这是新容器在运行时默认连接的网络。你可以在类 Unix 主机上运行 `ifconfig` 命令来查看此网络，如清单\
  \ 8-55 所示。\n\n```\n$ ifconfig\n...\ndocker0   Link encap:Ethernet  HWaddr 02:42:e4:f6:31:5a\
