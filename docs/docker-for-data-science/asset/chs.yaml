  \ Docker\n\n在 Linux 系统上，Docker 引擎绑定到一个 Unix 端口，而不是 TCP 端口。此端口通常由 `root` 拥有，并且必须通过\
  \ `sudo` 访问才能接收来自 Docker 客户端的命令。Linux 系统上 Docker 用户的一种常见模式是创建一个 `docker` 组并将用户添加到该组，如清单\
  \ 2-10 所示。当 Docker 守护进程重启时，它会使绑定到 Docker 引擎的端口对 `docker` 组可读/写。结果是用户能够向引擎发出命令，而无需在其命令前加上\
  \ `sudo`。请注意，严格来说，这不是必需的。\n\n```\n$ sudo groupadd docker\n$ sudo usermod -aG docker\
  \ $USER\n```\n\n清单 2-10. 在 Linux 系统上创建 `docker` 组\n\n注销并重新登录以查看更改生效。此时，用户将能够通过 `docker`\
  \ 向引擎发出命令，而无需使用 `sudo`。\n\n### Docker for Mac\n\nDocker for Mac 使用 HyperKit⁴ 虚拟机运行\
  \ Docker。它通过 `bash` 或类似的 shell 从命令行驱动。详细说明以及具体的系统要求可在 [`docs.docker.com/docker-for-mac/`](https://docs.docker.com/docker-for-mac/)\
  \ 找到。建议使用稳定版渠道进行安装。用于 `bash` 补全的脚本已预装在 Docker for Mac 应用程序中。要激活 `bash` 补全，只需将这些文件符号链接到你的\
  \ `bash_completion.d/` 目录（参见清单 2-11）。\n\n```\n$ ln -s /Applications/Docker.app/Contents/Resources/etc/docker.bash-completion\
  \ /usr/local/etc/bash_completion.d/docker\n$ ln -s /Applications/Docker.app/Contents/Resources/etc/docker-machine.bash-completion\
  \ /usr/local/etc/bash_completion.d/docker-machine\n$ ln -s /Applications/Docker.app/Contents/Resources/etc/docker-compose.bash-completion\
  \ /usr/local/etc/bash_completion.d/docker-compose\n```\n\n清单 2-11. 在 Mac OS X 上符号链接\
  \ Bash 补全文件\n\n### Docker for Windows\n\nDocker for Windows 使用 Microsoft Hyper-V\
  \ 运行。它通过 PowerShell 从命令行驱动。详细说明以及具体的系统要求可在 [`docs.docker.com/docker-for-windows/`](https://docs.docker.com/docker-for-windows/)\
  \ 找到。安装 Docker for Windows 可能有些挑战。需要注意的是，Docker for Windows 只能在 Windows 10 专业版或企业版\
  \ 64 位操作系统上使用，并且需要：\n\n*   支持二级地址转换 (SLAT) 的 64 位处理器\n*   至少 4GB 系统内存\n*   BIOS\
  \ 级别的硬件虚拟化支持\n\n以下注意事项在以往的安装过程中很有帮助：\n\n*   如果在 Docker 安装过程中提示启用 Hyper-V，请务必按“确定”。\n\
  *   从 Docker 设置中选择“共享驱动器”，并确保共享 `C:` 盘。这可以通过 Docker 设置完成（图 2-4）。![A439726_1_En_2_Fig4_HTML.jpg](img/A439726_1_En_2_Fig4_HTML.jpg)\
  \ 图 2-4. 访问 Docker 设置\n*   如有必要，请禁用防火墙或创建例外。\n*   确保使用 Windows PowerShell 来访问并向引擎发出命令。\n\
  \n### Docker Toolbox\n\nDocker Toolbox 适用于不满足更原生实现的 Docker for Mac 或 Docker for\
  \ Windows 要求的较旧 Mac 或 Windows 系统。Docker Toolbox 包含几个工具：\n\n*   Docker Machine，用于运行\
  \ `docker-machine` 命令\n*   Docker Engine，用于运行 `docker` 命令\n*   Docker Compose，用于运行\
  \ `docker-compose` 命令\n*   Kitematic，Docker 图形用户界面\n*   一个为 Docker 命令行环境预配置的 shell\n\
  *   Oracle VirtualBox\n\n安装说明可在此处找到：[`docs.docker.com/toolbox/overview/`](https://docs.docker.com/toolbox/overview/)。Docker\
  \ Toolbox 用户需要使用 Docker Quickstart Terminal 命令行环境来向 Docker 引擎发出命令。安装 Docker Toolbox\
  \ 将使用 VirtualBox 创建一个本地的 `docker-machine`，作为主机。\n\n\n\n"
- "# 你好，Docker！\n\n使用 Docker 运行代码，最基本的方式包括以下步骤：\n\n1. 拉取预编译的镜像，或根据 Dockerfile 构建镜像。\n\
  2. 将镜像作为新容器运行。\n\n如果你是首次安装 Docker，可以尝试一些简单的命令来验证 Docker 客户端是否正确安装并已添加到系统路径中。清单 2-12、2-13\
  \ 和 2-14 展示了三种验证方法：`docker version`、`docker help` 或 `which docker` 都是很好的简单测试命令。\n\
