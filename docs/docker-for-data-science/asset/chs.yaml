  \ GitHub）同步，文件必须小于 100MB 才能上传到 GitHub。从 `git` 提交中移除文件（尤其是当它不是最近一次提交时）可能颇具挑战性，并且即使已从最近一次提交中移除，其存在也会导致同步失败。如果需要云备份，建议使用\
  \ `bash` 工具 `split` ⁶ 将 CSV 文件拆分为小于 100MB 的较小文件。\n\n## 向应用程序添加数据库\n\n你最初使用基本的 Jupyter\
  \ 服务启动了应用程序，以便对数据集进行初步分析。完成此操作后，让我们利用所学知识，使用适当的模式将此数据集填充到 PostgreSQL 数据库中。图 10-9\
  \ 显示了系统下一次迭代的示意图。\n\n![A439726_1_En_10_Fig9_HTML.jpg](img/A439726_1_En_10_Fig9_HTML.jpg)\n\
  \n图 10-9. 应用程序的第二次迭代\n\n为此，你需要在 `docker-compose.yml` 文件中添加几项内容（代码清单 10-27）：\n\n\
  - 使用构建的镜像而非现有镜像来定义 Jupyter Notebook 服务，以便包含你的数据库接口库 `psycopg2`。\n- 定义一个 PostgreSQL\
  \ 服务，利用你在第 9 章中看到的构建钩子。\n- 创建一个数据卷供 PostgreSQL 服务使用。\n\n\n\n```yaml\nversion: '3'\n\
  services:\n  this_jupyter:\n    build: docker/jupyter\n    ports:\n      - \"8888:8888\"\
  \n    volumes:\n      - .:/home/jovyan\n  this_postgres:\n    build: docker/postgres\n\
  \    volumes:\n      - postgres_data:/var/lib/postgresql/data\nvolumes:\n  postgres_data:\n\
  ```\n\n*清单 10-27. `docker-compose.yml` 的下一个版本*\n\n这里，你使用了之前见过的几种模式，但特别需要注意的是，你必须将新的数据卷挂载到\
  \ `this_postgres` 容器内的正确位置。\n\n接下来，为两个新的构建上下文创建目录（清单 10-28），并创建一个 `Dockerfile`（清单\
  \ 10-30）来定义你的 `this_jupyter` 服务（清单 10-29）。此时，你只做了一项更改：在 Python 3 环境中添加 `psycopg2`。\n\
  \n```\n$ mkdir docker/jupyter docker/postgres\n```\n\n*清单 10-28. 创建新的构建上下文*\n\n\
  ```\n$ vim docker/jupyter/Dockerfile\n```\n\n*清单 10-29. 创建 `docker/jupyter/Dockerfile`*\n\
  \n```\nFROM jupyter/scipy-notebook\nUSER root\nRUN conda install --yes --name root\
  \ psycopg2\nUSER jovyan\n```\n\n*清单 10-30. `docker/jupyter/Dockerfile`*\n\n然后，定义\
  \ `this_postgres` 服务的构建上下文。与第 9 章一样，PostgreSQL 的构建上下文要复杂得多，包含多个文件：一个 `Dockerfile`（清单\
  \ 10-31 和 32）；一个用于获取和清理数据的 bash 脚本 `get_data.sh`（清单 10-34）；以及一个用于初始化数据库的 SQL 文件\
  \ `initdb.sql`（清单 10-36）。\n\n> **注意**  \n> 从 UCI 机器学习库获取的数据 CSV 文件末尾包含一个空行。PostgreSQL\
  \ 无法容忍任何异常行为，如果不特殊处理这个空行，它会拒绝 `docker/postgres/initdb.sql` 文件（清单 10-35）中的数据复制操作。与第\
  \ 9 章一样，我在 `get_data.sh` 文件中使用 `sed` 工具处理了这个问题（清单 10-33）。这里，我使用了模式 `/^\\s*$/d`。它的作用是匹配仅由空白字符组成的任何行，包括空行（`^\\\
  s*$`），并使用 `d` 命令将其删除。\n\n```\n$ vim docker/postgres/Dockerfile\n```\n\n*清单 10-31.\
  \ 创建 `docker/postgres/Dockerfile`*\n\n```\nFROM postgres:alpine\nCOPY get_data.sh\
  \ /docker-entrypoint-initdb.d/get_data.sh\nCOPY initdb.sql /docker-entrypoint-initdb.d/initdb.sql\n\
  ```\n\n*清单 10-32. `docker/postgres/Dockerfile`*\n\n```\n$ vim docker/postgres/get_data.sh\n\
