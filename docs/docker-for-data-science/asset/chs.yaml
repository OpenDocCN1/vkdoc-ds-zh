  \ [63.1 kB]\n...\n```\n\n*代码清单 5-8. 运行 Docker 构建*\n\n\n\n##### 来自 gcc\n\n第一层使用 `FROM`\
  \ 指令来定义构建镜像的基础镜像。一个有效的 Dockerfile 必须始终以 `FROM` 指令开头。最佳实践建议，除高级用例之外，所有镜像都应从 Docker\
  \ [公共仓库](https://docs.docker.com/engine/tutorials/dockerrepos/)中拉取 `FROM` 基础镜像。重申一下，`FROM`\
  \ 必须是 Dockerfile 中第一个非注释指令。此处，你正在从 [gcc 镜像](https://hub.docker.com/_/gcc/) 中拉取。`FROM`\
  \ 可以使用以下三种语法：\n\n*   `FROM <image>`\n*   `FROM <image>:<tag>`\n*   `FROM <image>@<digest>`\n\
  \n**注意：** `tag` 或 `digest` 的使用是可选的。如果两者都未提供，则 `tag` 默认为 `latest`，对应于 Docker Hub\
  \ 上最新的可用构建版本。\n\n##### LABEL maintainer=@joshuacook\n\n第二层使用 `LABEL` 指令来定义与镜像关联的元数据。每个\
  \ `LABEL` 都是一个键值对。在此例中，你将键 `maintainer`（镜像的维护者）与值（Docker Hub 用户）`joshuacook` 关联起来。镜像可以有多个\
  \ `LABEL`。要查看镜像的 `LABEL`，可以使用 `docker inspect` 命令。在清单 5-9 中，你对刚刚构建的 `joshuacook/gsl`\
  \ 镜像执行了此操作。\n\n```\n$ docker inspect joshuacook/gsl\n...\n   \"Labels\": {\n   \
  \    \"maintainer\": \"@joshuacook\"\n   }\n...\n```\n\n**清单 5-9.** 检查 `joshuacook/gsl`\
  \ 镜像\n\n##### RUN apt-get update && apt-get install\n\n镜像的最后一层使用了 `RUN` 指令，在此例中用于安装使用\
  \ GNU 科学库所需的库。`RUN` 指令使用 `/bin/sh` 在当前镜像之上的新层中执行任何提供的命令。执行的结果成为新的镜像。\n\n**注意：**\
  \ 我们使用 `\\`（反斜杠）来将单个指令延续到多行。因此，清单 5-10 和清单 5-11 中的指令在功能上是等效的。\n\n```\nRUN apt-get\
  \ update && \\\n      apt-get install -y \\\n      gsl-bin \\\n      libgsl0-dbg\
  \ \\\n      libgsl0-dev \\\n      libgsl0ldbl\n```\n\n**清单 5-10.** `apt` 跨多行安装\n\
  \n```\nRUN apt-get update && apt-get install -y gsl-bin libgsl0-dbg libgsl0-dev\
  \ libgsl0ldbl\n```\n\n**清单 5-11.** `apt` 单行安装\n\n#### 提交更改到 GitHub\n\n在继续之前，你应该\
  \ `git commit` 对 Dockerfile 所做的更改，并将更改推送到 GitHub（参见清单 5-12）。\n\n```\n$ git add gsl/Dockerfile\n\
  $ git commit -m 'GSL IMAGE - initial build'\n$ git push\n```\n\n**清单 5-12.** 提交更改并推送到\
  \ GitHub\n\n### Docker 构建缓存\n\n回想一下，Docker 镜像的结构被定义为一堆镜像，每个镜像定义了对镜像的一个无状态更改。由于每个镜像都是作为单独的抽象层构建的，因此在重建镜像时，对\
  \ Docker 镜像的更改是从上到下进行的。如果你只对位于最顶层的代码进行了更改，那么这将是镜像中唯一会被重建的层。\n\n你可以通过向 GSL 镜像添加一个新层来检查构建缓存。让我们向镜像添加一个新层，其中包含你可能感兴趣的用于在\
  \ C 语言中执行数据科学任务的另一个库。将清单 5-13 中的行添加到你的 Dockerfile 中。\n\n```\nRUN apt-get update\
  \ && \\\n    apt-get install -y gdb\n```\n\n**清单 5-13.** 向 `joshuacook/gsl` 添加额外的依赖层\n\
  \n在清单 5-14 中，你重建了镜像。\n\n```\n$ docker build -t joshuacook/gsl gsl\nSending build\
  \ context to Docker daemon 2.048 kB\nStep 1/4 : FROM gcc\n ---> 408d218617ca\nStep\
  \ 2/4 : LABEL maintainer @joshuacook\n ---> Using cache\n ---> ba0d6482c28a\nStep\
  \ 3/4 : RUN apt-get update &&       apt-get install -y       gsl-bin       libgsl0-dbg\
  \       libgsl0-dev       libgsl0ldbl\n ---> Using cache\n ---> 8706282586fc\nStep\
  \ 4/4 : RUN apt-get install -y gdb\n ---> Running in c491003e5a95\n...\n ---> 53111721b96a\n\
  Removing intermediate container c491003e5a95\nSuccessfully built 53111721b96a\n\
  ...\n```\n\n**清单 5-14.** 重新运行 `joshuacook/gsl` 镜像构建\n\n**注意：** 在此构建过程中，步骤 1-3 并未像之前那样执行。在执行每个步骤之前，Docker\
  \ 守护进程会将该步骤与本地缓存中同一镜像的现有实例的各个层进行比较。如果匹配，构建将使用现有层（即 Docker 构建缓存）来构建镜像。因此，没有更改的构建是幂等的，这意味着初始命令会构建镜像，但后续构建不会产生额外影响。\n\
  \n清单 5-15 演示了 `docker build` 过程的幂等性。\n\n```\n$ docker build -t joshuacook/gsl gsl\n\
