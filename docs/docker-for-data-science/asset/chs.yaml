- "# 临时容器扩展\n\n最后，让我们讨论一下使用 `jovyan` 用户向运行中的容器添加库的最佳实践。不过在此之前，我应该提一下对运行中的容器进行更改所产生的影响。在第\
  \ 2 章中，你探讨了容器中的持久化问题，但当时仅针对使用 Jupyter 时可能正在处理的文件。你希望确保对文件的更改在容器的生命周期结束后仍然存在。然而，我并未讨论你可能安装的库的持久化问题，无论是使用\
  \ `base-notebook` 的操作系统 Debian 所青睐的 `apt` 包管理器在系统层面进行安装，还是使用任何包含的 Python 包管理器在 Python\
  \ 层面进行安装。在实践中，你将面临完全相同的挑战。然而，对于系统和 Python 库，我建议按照上述最佳实践，通过 Dockerfile 进行这些更改。话虽如此，将\
  \ Python 代码的编写与 Docker 镜像的维护分离开来也是一种最佳实践。毫无疑问，在开发过程中，你会遇到希望快速安装某个库的情况。最佳实践当然是快速安装所需的库并继续开发。但是，你应该意识到你所做操作的影响。一旦你停止并移除进行了这些更改的容器，这些更改就会消失。这是设计使然。你还必须防止自己因为希望保留对容器所做的更改，而在其生命周期结束后仍长期保留老旧的容器。考虑到这一点，我发现以下方法是在运行中的容器上安装临时包的最佳实践。`ipython`\
  \ 的魔法命令 `sx`⁸（`!`（感叹号）是其简写形式）可用于在 notebook 中向底层系统的 shell 运行命令。通过这种方式，你可以即时通过 `conda`（清单\
