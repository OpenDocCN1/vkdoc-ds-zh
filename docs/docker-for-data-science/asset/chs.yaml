  \ `t2.medium`。\n4.  重启 AWS 实例，并记下生成的新 IP 地址。\n5.  重启 Docker Compose 应用。\n6.  执行你的计算任务。\n\
  \n在代码清单 9-39 中，你通过关闭应用来准备对 AWS 实例进行更改。因为你只执行了基本的 `docker-compose down` 命令，所以你的 Docker\
  \ 卷将在整个过程中保持不变，并且你不会丢失 MongoDB 中的推文数据。它只包含一条推文，但这足以用于演示目的。\n\n```\n$ docker-compose\
