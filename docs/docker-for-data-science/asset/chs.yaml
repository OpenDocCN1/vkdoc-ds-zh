- "# 什么是 docker-compose？\n\nDocker Compose 是一款用于管理多容器 Docker 应用的工具。Compose 通过一个 `docker-compose.yml`\
  \ 文件来定义应用。开发者维护一个包含应用源代码的目录，该目录可能包含 Python 或 C 语言文件库、零个或多个定义容器的 Dockerfile、CSV、feather\
  \ 或 JSON 等原始数据文件，以及诸如 Python 项目的 `requirements.txt` 文件等其他配置脚本。`docker-compose.yml`\
  \ 文件位于此目录的顶层。通过单个 `docker-compose` 命令即可构建、运行、停止和移除应用。`docker-compose` 工具在与 Docker\
  \ 引擎通信时会引用该文件，就好像整个应用是一个单独的 Docker 容器一样。\n\n## Docker Compose 版本\n\nDocker Compose\
  \ 文件语法目前为第 3 版。对于新项目，Docker 建议使用最新版本。尽管如此，所有版本都是向后兼容的，并且互联网上许多 `docker-compose.yml`\
  \ 文件仍在使用早期版本。版本号在 `docker-compose.yml` 文件中作为第一个值指定，如清单 9-4 所示。如果未指定版本，则将使用第 1 版。\n\
  \n```\nversion: '3'\nservices:\n  db:\n    image: postgres\n    volumes:\n     \
  \ - data:/var/lib/postgresql/data\nvolumes:\n  data:\n    driver: mydriver\n```\n\
  \n清单 9-4. 显示版本规范的 `docker-compose.yml` 文件\n\n"
- "# 构建一个简单的 Docker Compose 应用\n\n你将构建第一个 Docker Compose 应用，它是一个与 Redis 服务器协同运行的 Jupyter\
  \ Notebook 服务器（图 9-1）。\n\n![A439726_1_En_9_Fig1_HTML.jpg](img/A439726_1_En_9_Fig1_HTML.jpg)\n\
  \n图 9-1. 一个简单的 Docker Compose 应用\n\n首先，你需要创建一个目录来存放项目（清单 9-5）。\n\n```\n$ mkdir ch_9_jupyter_redis\n\
  $ cd ch_9_jupyter_redis\n```\n\n清单 9-5. 创建目录以存放项目\n\n接下来（清单 9-6），你将使用命令行文本编辑器 `vim`\
  \ 创建一个 `docker-compose.yml` 文件（清单 9-7）来定义此应用。\n\n```\n$ vim docker-compose.yml\n\
  ```\n\n清单 9-6. 创建 `docker-compose.yml`\n\n```\nversion: '3'\nservices:\n  this_jupyter:\n\
  \    image: jupyter/scipy-notebook\n    ports:\n     - 8888:8888\n    volumes:\n\
  \      - .:/home/jovyan\n  this_redis:\n    image: redis:alpine\n```\n\n清单 9-7.\
  \ `jupyter_redis` 的 `docker-compose.yml` 文件\n\n你使用 Compose 文件定义了两个服务：`this_jupyter`\
  \ 和 `this_redis`。`this_jupyter` 服务：\n\n- 使用 Docker Hub 仓库中的 `jupyter/scipy-notebook`\
  \ 镜像，由 `image:` 关键字指定。\n- 将本地目录（`.`）挂载到（希望你已经熟悉的）jupyter 工作目录 `/home/jovyan`，由 `volumes:`\
  \ 关键字指定。\n- 将暴露的端口 `8888` 转发到主机上的端口 `8888`，由 `ports:` 关键字指定。\n- 将容器链接到 Redis 容器，由\
  \ `links:` 参数指定。\n\n`redis` 服务使用 Docker Hub 仓库中标签为 `alpine` 的 `redis` 镜像。\n\n**注意：**\
  \ 在 `docker-compose.yml` 文件中定义的每个容器，其定义必须以 `image:` 参数或 `build:` 参数开头。我将在本章下一节讨论\
  \ `build:` 参数。\n\n## 使用 Compose 运行你的应用\n\n你已使用 `docker-compose.yml` 文件定义了应用。现在（清单\
  \ 9-8），使用 `docker-compose` 命令行工具启动应用。你将使用 `-d` 参数指定以分离模式启动应用。\n\n```\n$ docker-compose\
  \ up\nCreating network \"ch9jupyterredis_default\" with the default driver\nCreating\
  \ ch9jupyterredis_this_redis_1\nCreating ch9jupyterredis_this_jupyter_1\n```\n\n\
  清单 9-8. 启动 Compose 应用 `jupyter_redis`\n\n`docker-compose up` 命令首先指示 Docker 引擎执行以下操作之一：\n\
  \n1. 如果容器定义以 `image:` 关键字开头，则检查本地镜像缓存中是否存在指定的镜像。\n2. 如果容器定义以 `build:` 关键字开头，则从引用的\
  \ Dockerfile 构建镜像。\n\n\n\n在这里，你为两个容器传递了同一个镜像的关键词。在这种情况下，你正在使用的两个镜像当前都位于镜像缓存中。如果它们不在缓存中，Docker\
  \ 引擎会从 Docker Hub 拉取它们。接下来，`docker-compose up` 命令指示 Docker 引擎创建一个网络，应用程序的容器可以通过该网络进行通信。这里创建了一个名为\
  \ `ch9jupyterredis_default` 的网络。清单 9-14 展示了如何使用这个网络。最后，`docker-compose up` 命令指示\
  \ Docker 引擎创建 `docker-compose.yml` 文件中定义的容器。这相当于运行清单 9-9 中的两个命令，但有一个例外：`docker-compose`\
