  \ Compose 应用\n\n在图 9-5 中，你导航到 EC2 控制面板并关闭正在运行的实例。为此，你从“操作”菜单的“实例状态”菜单项中选择“停止”。这是更改实例类型的第一步。必须停止实例才能进行更改。\n\
