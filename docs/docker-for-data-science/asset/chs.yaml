  406306ca7a80: Mounted from jupyter/base-notebook\ncff5883220e6: Mounted from jupyter/base-notebook\n\
  d17d48b2382a: Mounted from jupyter/base-notebook\n1.13.0: digest: sha256:ccd8f21923c7538ae7a4d0606e203dce072d601494e570cf4c3d1d08ca7a84e2\
  \ size: 3246\n```\n\n*列表 6-18. 将 ipython 镜像推送到 Docker Hub*\n\n### 从 Docker Hub 拉取镜像\n\
  \n\n\n你可以通过从 Docker Hub 拉取镜像来验证推送是否成功。当然，如果你本地已有该镜像，那么在请求该镜像时会使用本地缓存的镜像。为了测试是否成功，你首先使用\
  \ `docker inspect` 命令检查本地镜像的内容，以便用于验证（列表 6-19）。你需要关注 `inspect` 命令返回的 JSON 中的 `\"\
  RootFS\"` 键，因为它提供了与镜像关联的每个层的 sha256 描述¹⁰。\n\n```\n$ docker inspect joshuacook/numpy:1.13.0\n\
