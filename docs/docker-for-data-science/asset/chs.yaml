  \  | /usr/local/bin/docker-entrypoint.sh: running /docker-entrypoint-initdb.d/initdb.sql\n\
  this_postgres_1  | CREATE TABLE\nthis_postgres_1  | COPY 699\n...\n```\n\n代码清单 9-72.\
  \ 显示 `this_postgres` 的日志\n\n你希望在这里看到的是数据的成功收集和插入。你还可以通过 `docker exec`（代码清单 9-73）连接到正在运行的服务，以验证是否插入了正确数量的行。这里你使用了名为\
  \ `wc`¹⁴ 的字数统计工具来统计下载文件中的行数。\n\n```\n$ docker exec -it ch9jupyterpostgres_this_postgres_1\
  \ bash\nbash-4.3# wc -l /tmp/breast-cancer-wisconsin.data\n699 /tmp/breast-cancer-wisconsin.data\n\
  ```\n\n代码清单 9-73. 通过 `docker exec` 连接到 `this_postgres`\n\n最后，你连接到 Jupyter 来测试一些代码。在代码清单\
  \ 9-74 中，你对 `bc_data` 表中的行数进行了简单计数。\n\n```\nIn [1]: import psycopg2 as pg2\nIn [2]:\
  \ con = pg2.connect(host='this_postgres', user='postgres', database='postgres')\n\
  \        cur = con.cursor()\n        cur.execute(\"SELECT COUNT(*) FROM bc_data;\"\
  )\n        cur.fetchall()\nOut[2]: [(699,)]\n```\n\n代码清单 9-74. 统计 `bc_data` 表中的行数\n\
  \n请注意，你通过将主机指定为 `'this_postgres'`，利用了为你创建的网络。\n\n\n\n## 总结\n\n在本章中，我介绍了 `Docker\
  \ Compose` 工具。随后，你运用目前讨论的所有技术与工具，使用该工具构建了多服务数据应用。你构建了一个简单的 `Jupyter-Redis` 应用，又构建了一个更复杂的\
  \ `Jupyter-MongoDB` 应用，并探索了如何使用 `Docker Compose` 配置数据持久化。在使用 `Jupyter-MongoDB` 应用的过程中，你学会了如何在以\
  \ AWS 实例运行时切换应用的底层虚拟硬件。最后，你构建了一个 `Jupyter-PostgreSQL` 应用。在构建该应用时，你了解了如何利用 `postgres`\
  \ Docker 镜像中定义的构建钩子，在运行时将数据加载到数据库中。完成本章学习后，希望你能够运用 `Jupyter` 以及我所介绍的任何或全部数据存储，设计出属于自己的简单多服务应用。在下一章中，我将重新探讨交互式编程范式，并介绍以该范式为核心构建软件的理念。你将使用\
  \ `Docker Compose` 来构建此软件。\n\n脚注 1 [`github.com/docker/compose`](https://github.com/docker/compose)\
