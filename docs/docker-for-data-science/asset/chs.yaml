  \ 配置 `miniconda3` 镜像\n\n最终，你的 Jupyter 应用程序将运行在一个容器化的 Debian 机器上。与任何应用程序一样，它会有许多依赖项，或者说系统级应用程序，Debian\
  \ 系统必须能够执行这些程序才能正常运行。如果你手动构建这个系统（即不使用 Docker），你会使用适合你操作系统的命令行包管理器（Ubuntu 或 Debian\
  \ 使用 `apt`，CentOS 使用 `yum`，Mac OS X 使用 `brew`），这个过程称为配置。Docker 守护进程本身没有配置的方法，但它有一种机制，可以通过\
  \ `RUN` 指令来利用基础系统的包管理器（清单 5-27）。\n\n```\nRUN <command>\n```\n\n清单 5-27. `RUN` 指令\n\
  \n这相当于在镜像的 shell 中运行 `<command>`（即 `/bin/sh -c <command>`）。与在 shell 语言中编写脚本类似，你可以在行尾添加反斜杠（`\\\
