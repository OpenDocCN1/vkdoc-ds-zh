- "# 4. Docker 引擎\n\nJoshua Cook^(1 )  \n(1) 美国加利福尼亚州圣莫尼卡\n\nDocker 引擎是你开展工作的核心技术。就你的目的而言，你可以将\
  \ Docker 引擎视为 Docker 守护进程和你用来向守护进程发出指令的 Docker 客户端。Docker 整体上由引擎和 Hub 组成，后者用于存储镜像。如果我没有充分强调这一点，那么奇迹之所以发生，是因为无论底层硬件（或虚拟硬件）和操作系统如何，我们都可以信赖\
  \ Docker 引擎以相同的方式工作。我们使用 Docker 引擎构建它，使用 Docker 引擎测试它，并使用 Docker 引擎部署它。\n\n## 检查\
  \ Docker 工作站\n\nDocker 是一项快速变化的技术。因此，最好参考 Docker 最新的安装说明。基础安装包括我们将要使用的每项核心技术：`docker`、`docker-machine`\
  \ 和 `docker-compose`。单独运行 `docker` 命令会返回用法。如果你不确定哪些命令可以运行以及它们需要哪些参数，请尝试不带参数运行该命令（参见清单\
  \ 4-1）。\n\n```\n$ docker\nUsage:  docker COMMAND\nA self-sufficient runtime for\
  \ containers\n...\n```\n\n清单 4-1. 显示 Docker 用法\n\n你可以使用 `docker info` 命令显示系统范围的信息（清单\
  \ 4-2）。`docker` 或 `docker info` 也可以作为 Docker 安装是否正常工作的最小验证。\n\n```\n$ docker info\n\
  Containers: 12\n Running: 2\n Paused: 0\n Stopped: 10\nImages: 23\nServer Version:\
  \ 17.06.0-ce\n...\n```\n\n清单 4-2. 显示 Docker 系统信息\n\n在清单 4-3 中，你将最小的 Docker 镜像 [alpine](https://hub.docker.com/_/alpine/)\
  \ 拉取到本地镜像集合中。`alpine` 是\n\n> 一个基于 Alpine Linux 的最小 Docker 镜像，拥有完整的软件包索引，大小仅为 5MB！\n\
  \n\n\n`$ docker pull alpine`\n```\nUsing default tag: latest\nlatest: Pulling from\
  \ library/alpine\n0a8490d0dfd3: Pull complete\nDigest: sha256:dfbd4a3a8ebca874ebd2474f044a0b33600d4523d03b0df76e5c5986cb02d7e8\n\
  Status: Downloaded newer image for alpine:latest\n```\n代码清单 4-3. 拉取 alpine Docker\
  \ 镜像\n\n当你拉取 `hello-world` 或 `ubuntu` 镜像时，实际上是作为 `docker run` 命令的一部分隐式完成的（见图 4-1）。在代码清单\
  \ 4-3 中，你显式地拉取了镜像。由于没有指定拉取的标签，Docker 引擎默认使用名为 `latest` 的标签。然后 Docker 引擎在 Docker\
  \ Hub 上按名称找到最新的 `alpine` 镜像，并将其下载到本地镜像缓存中（见图 4-1）。`alpine` 镜像由单个层组成。如果它包含多个层，这些层会被并行拉取。\n\
  \n![A439726_1_En_4_Fig1_HTML.gif](img/A439726_1_En_4_Fig1_HTML.gif)\n图 4-1. 从 Docker\
  \ 注册表隐式与显式拉取镜像\n\n如果你希望为下载的 `alpine` 镜像运行一个交互式 shell，可以通过 `run` 命令实现（见代码清单 4-4）。你将收到一个附加到\
  \ `alpine` 镜像的 shell 提示符。按 `Ctrl+D` 可终止 shell 进程并返回主机系统。\n\n```\n$ docker run -it\
  \ alpine /bin/sh\n/ # ls\nbin    etc    lib    mnt    root   sbin   sys    usr\n\
  dev    home   media  proc   run    srv    tmp    var\n/ # whoami\nroot\n/ # ps\n\
  PID   USER     TIME   COMMAND\n1     root     0:00   /bin/sh\n7     root     0:00   ps\n\
  / # ps aux\nPID   USER     TIME   COMMAND\n1     root     0:00   /bin/sh\n8     root     0:00   ps\
  \ aux\n```\n代码清单 4-4. 为 alpine 容器运行交互式 Shell\n\n在代码清单 4-4 中，`-i` 标志启动了一个交互式容器。`-t`\
  \ 标志分配了一个伪 TTY 命令行解释器或 shell，用于连接 `stdin` 和 `stdout`。你运行了 `ls` 命令，显示了正在运行的 Docker\
  \ 容器根目录（`/`）中的目录。然后运行了 `ps` 和 `ps aux`，分别显示附加到当前 shell 的进程和所有进程。\n\n你究竟做了什么？嗯，这有点抽象。你启动了一个\
  \ `alpine` 镜像的实例。然后 Docker 引擎在该镜像之上创建了一个临时层，供你与之交互。底层镜像及其之上的读/写层共同构成了一个 Docker 容器。Docker\
  \ 引擎随后通过一个通用 shell 将你连接到该容器。在这里，你对正在运行的容器拥有 root 访问权限。通过 shell 连接时执行的任何操作的结果都会写入顶部的读/写层。\n\
  \n如第 2 章所述，Docker 容器可以被视为一个虚拟化进程。我们将继续沿用这种思维方式，并且我会在一定程度上互换使用“进程”和“容器”这两个术语。\n\n\
  到目前为止，你已经使用 `docker ps` 来显示当前由 Docker 守护进程管理的进程（即当前正在运行的容器）。在代码清单 4-5 中，你通过 `docker\
  \ ps -a` 显示了所有进程/容器，包括已终止的。这里，`-a` 标志表示应显示所有容器，包括已退出的。\n\n```\n$ docker ps -a\n\
  CONTAINER ID  IMAGE   COMMAND   CREATED         STATUS     PORTS    NAMES\nb04dfee8fc1c  alpine  \"\
  /bin/sh\" 49 minutes ago  Exited ... clever_khorana\n```\n代码清单 4-5. 显示所有 Docker\
  \ 进程\n\n这里你看到了刚刚终止的进程。为运行该进程而创建的容器的容器 ID 为 `b04dfee8fc1c`。当你终止 shell 时，Docker 引擎会停止该容器。由\
  \ `alpine` 镜像定义的容器以及在运行时创建的读/写层会继续存在于你的缓存中。然而，读/写层与该容器关联，而非底层镜像。如果你再次运行相同的命令来启动一个新容器，Docker\
  \ 引擎会在基础镜像之上创建一个新的读/写层，作为新容器。\n\n在代码清单 4-6 中，你创建了一个新容器，将其关闭，并再次列出所有进程。你可以看到，现在有两个已退出的容器与\
  \ `alpine` 镜像关联。\n\n```\n$ docker run -it alpine /bin/sh\n/ #^d\n$ docker ps -a\n\
  CONTAINER ID  IMAGE   COMMAND   CREATED         STATUS     PORTS    NAMES\nb04dfee8fc1c  alpine  \"\
  /bin/sh\" 49 minutes ago  Exited ... clever_khorana\n4d3cc1c5471d  alpine  \"/bin/sh\"\
  \ 59 minutes ago  Exited ... suspicious_ritchie\n```\n代码清单 4-6. 创建第二个 alpine 容器，终止，并显示所有进程\n\
  \n## 容器中的 Hello, World\n\n`docker run` 用于将应用程序作为容器运行。让我们逐步了解这个过程。首先，显示当前正在运行的 Docker\
  \ 进程（见代码清单 4-7）。\n\n```\n$ docker ps\nCONTAINER ID     IMAGE    COMMAND     CREATED     STATUS     PORTS     NAMES\n\
  ```\n代码清单 4-7. 显示 Docker 进程\n\n你应该会看到一个空表的表头，表示当前没有正在运行的容器/进程。你可能会看到其他进程，这没关系。\n\
  \n你可以查看当前镜像缓存中的镜像。可以通过 `docker images` 命令来实现，如代码清单 4-8 所示。\n\n```\n$ docker images\n\
  REPOSITORY          TAG            IMAGE ID            CREATED          SIZE\nalpine             latest         88e169ea8f46       7\
  \ weeks ago     3.98 MB\nubuntu             latest         b549a9959a66       31\
  \ hours ago    188 MB\nhello-world        latest         690ed74de00f       4 weeks\
  \ ago     960 B\n```\n代码清单 4-8. 显示 Docker 镜像\n\n如果你一直跟着操作，应该有三个镜像。这三个镜像的意义在于它们存储在本地。你可以立即运行其中任何一个镜像定义的容器；也就是说，在运行容器之前，无需隐式拉取镜像。\n\
  \n在代码清单 4-9 中，你运行了 `hello-world` 镜像。\n\n```\n$ docker run hello-world\nHello from\
  \ Docker.\nThis message shows that your installation appears to be working correctly.\n\
  ```\n代码清单 4-9. 运行 hello-world 镜像\n\n为了生成此消息，Docker 执行了以下步骤：\n\n1. Docker 客户端联系了\
  \ Docker 守护进程。\n2. Docker 守护进程从 Docker Hub 拉取了“hello-world”镜像。\n3. Docker 守护进程从该镜像创建了一个新容器，该容器运行可执行文件，并产生你正在阅读的输出。\n\
  4. Docker 守护进程将该输出流式传输到 Docker 客户端，然后客户端将其发送到你的终端。\n\n之前，你运行此命令时，必须等待镜像从注册表拉取。现在它立即运行并显示相同的响应。\n\
  \n在代码清单 4-10 中，你显示了当前由 Docker 管理的进程；同样，你应该看不到本章中你一直在操作的任何进程。这意味着 `hello-world` 镜像启动后，显示了其消息，然后再次关闭。\n\
  \n```\n$ docker ps\nCONTAINER ID     IMAGE     COMMAND     CREATED     STATUS     PORTS     NAMES\n\
  ```\n代码清单 4-10. 显示当前正在运行的容器/进程\n\n\n\n"
- "# 将 Echo 作为服务运行\n\n接下来，让我们将短语“Hello, World!”作为一项服务来运行。在 Docker 生态系统中，服务是一个被“容器化”的进程。你可能已经注意到，我一直将\
  \ `docker run` 命令的结果称为容器/进程。这个想法对于我们正在尝试做的事情至关重要。我们将一个进程封装在容器中，就像“Hello World!”一样，你向容器传递一个要执行的命令（清单\
  \ 4-11）。\n\n```\n$ docker run alpine /bin/echo 'Hello, World!'\nHello World!\n```\n\
  \n清单 4-11. 将 Echo “Hello, World!” 作为服务运行\n\n再次，你显示当前正在运行的容器/进程，以确认 alpine 容器已再次关闭（清单\
  \ 4-12）。同样，你之前操作的所有进程都没有在运行。alpine 镜像启动，使用 `echo` 命令输出“Hello World!”，然后关闭。\n\n```\n\
  $ docker ps\nCONTAINER ID     IMAGE     COMMAND     CREATED     STATUS     PORTS\
  \     NAMES\n```\n\n清单 4-12. 显示当前正在运行的容器/进程\n\n这件事的重要性可能并不明显。为了完全理解正在发生的事情，让我们对整个流程进行计时。让我们使用内置的\
  \ `time` 命令来查看将字符串作为服务输出需要多长时间。在清单 4-13 中，你通过运行 `time` 命令，然后运行之前执行过的命令来完成此操作。\n\n\
  ```\n$ time docker run alpine /bin/echo 'Hello World!'\nHello World!\nreal    0m1.300s\n\
  user    0m0.019s\nsys     0m0.030s\n```\n\n清单 4-13. 对 Echo 服务的执行进行计时\n\n现在，你使用内置的\
  \ `time` 命令来查看在本地（即直接在您的机器上）执行相同操作需要多长时间；请参见清单 4-14。\n\n```\n$ time echo 'Hello\
  \ World!'\nHello World!\nreal  0m0.006s\nuser  0m0.000s\nsys   0m0.001s\n```\n\n\
  清单 4-14. 对 `echo` 在本地执行进行计时\n\n这是一个相当大的跳跃。在 Docker 实例中运行该命令使任务耗时增加了 200 倍。但请从另一个角度考虑这个问题。相反，请考虑这样一个事实：启动整个\
  \ alpine 实例仅增加了大约一秒钟的处理时间。\n\n## 隔离启动时间\n\n在清单 4-15 中，你尝试隔离启动时间。首先，你运行一个硬休眠并对其进行计时，同样使用\
  \ `time` 命令。`sleep` 命令只是让 shell 休眠指定的时间。这将允许你显式地控制时间。\n\n```\n$ time sleep 2\nreal\
  \    0m2.012s\nuser    0m0.001s\nsys     0m0.003s\n```\n\n清单 4-15. 在本地对硬休眠进行计时\n\
  \n在清单 4-16 中，你将此硬休眠作为服务运行并对其执行进行计时。花点时间看看这是如何完成的是很有用的。在清单 4-16 中，你运行 `time docker\
  \ run alpine /bin/sleep 2`。你正在对使用 Docker 管理在 alpine 镜像定义的容器中运行的 2 秒休眠进行计时。\n\n```\n\
  $ time docker run alpine /bin/sleep 2\nreal    0m3.061s\nuser    0m0.014s\nsys \
  \    0m0.013s\n```\n\n清单 4-16. 将硬休眠作为服务进行计时\n\n请注意，你看到了大致相同的增长。在你的初步测试中，你可以将此理解为“容器化”你的服务会增加大约一秒钟的运行时间。这在输出“Hello\
  \ World!”或执行 2 秒的硬休眠时是显著的。但在运行 Jupyter 服务器或使用 NumPy 执行长时间计算时，这完全可以忽略不计。\n\n## 守护化的\
  \ Hello World\n\n你最终会希望将 Docker 容器守护化（即，将它们设置为作为后台进程无限期运行）。你可以通过 `-d` 标志以分离模式运行容器来实现这一点。让我们以分离模式运行\
  \ alpine（即，将镜像作为容器运行，并使其在后台保持运行）。为了让它保持运行，你需要给它分配一个任务，即无限期地每秒输出“hello world”。或者，你可以给它分配一个更复杂的任务，例如执行一个长的算术运算或监听\
  \ Web 请求，但出于演示目的，这个任务就足够了（清单 4-17）。\n\n```\n$ docker run -d alpine /bin/sh -c \"\
  while true; do echo hello world; sleep 1; done\"\n```\n\n清单 4-17. 以分离模式运行 Alpine\
  \ 镜像\n\n在清单 4-18 中，你再次显示正在运行的容器/进程。因为你向 `run` 命令传递了用于分离模式的 `-d` 标志，所以它仍在运行。\n\n\
  ```\n$ docker ps\nCONTAINER ID  IMAGE   COMMAND        CREATED         STATUS  PORTS\
  \   NAMES\n9201755545d1  alpine  \"/bin/sh ...\"  51 seconds ago  Up ...  upbeat_easley\n\
  ```\n\n清单 4-18. 显示当前正在运行的容器/进程\n\n但是，你如何确认它正在执行分配给它的任务呢？你可以通过 `docker logs` 命令来实现。在清单\
  \ 4-19 中，你请求与名为 `upbeat_easley` 的 alpine 容器关联的日志。\n\n```\n$ docker logs upbeat_easley\n\
  hello world\nhello world\n...\n```\n\n清单 4-19. 显示分离容器的日志\n\n在这里，你查看当前以分离模式运行的容器的日志。虽然不是最令人兴奋的日志，但足以确认你的容器正在执行其任务。让我们让它休息一下，使用\
  \ `stop` 命令将其关闭。在清单 4-20 中，你停止了 alpine 容器 `upbeat_easley`。\n\n```\n$ docker stop\
  \ upbeat_easley\n```\n\n清单 4-20. 停止一个分离容器\n\n## 总结\n\n本章是本书迄今为止最短的一章。在本章中，你探讨了要求\
  \ Docker 将进程作为 Docker 容器进行管理的几个方面。本章的内容有些抽象。严格来说，透彻理解这些材料对于掌握本书中的宏观概念并非必需。鼓励有兴趣深入探究\
  \ Docker 引擎细微差别的读者查阅 [`docs.docker.com`](http://docs.docker.com) 上提供的优秀且深入的文档。\n\
  \n© Joshua Cook 2017  \nJoshua Cook  \n*Docker for Data Science*  \n`doi.org/10.1007/978-1-4842-3012-1_5`\n\
  \n"
- "# 5. Dockerfile\n\nJoshua Cook¹  \n(1) 美国加利福尼亚州圣莫尼卡\n\n每个 Docker 镜像都被定义为一组层，每一层都定义了镜像的基本、无状态更改。第一层可能是虚拟机的操作系统（Debian\
  \ 或 Ubuntu Docker 镜像），下一层是应用程序运行所需的依赖项的安装，一直到应用程序的源代码。利用此系统的最佳方式是通过 `Dockerfile`。\n\
  \n## 最佳实践\n\n`Dockerfile` 是一种编写构建镜像脚本的方式。此脚本使用领域特定语言来告诉 Docker 守护进程如何顺序构建 Docker\
  \ 镜像。当守护进程被指示构建镜像时，它会通过从 `Dockerfile` 中读取必要的指令来完成。Docker 将以下内容视为创建 `Dockerfile`\
  \ 时的最佳实践：\n\n- 容器应该是短暂的或无状态的，即它们可以通过最少的设置和配置重新实例化。\n- 使用 `.dockerignore` 文件，类似于\
  \ `.gitignore`。\n- 避免安装不必要的包。\n- 每个容器应该只关注一件事。\n- 最小化层数。\n- 对多行参数进行排序。\n\n\n\n###\
  \ 无状态容器\n\n现代软件开发的最佳实践之一是软件以隔离进程的方式运行，彼此之间不共享任何内容，这通常被称为微服务¹。虽然一个应用可能同时运行多个进程，但这些进程应该是无状态的。如果任何信息需要在进程终止后持久保存，则应将其写入有状态的后端服务，例如数据库（如\
  \ MongoDB 或 Postgres）或键值存储（如 Redis）。我们将 Docker 容器视为系统进程的抽象，实际上，可以将 Docker 容器视为由\
  \ Docker 守护进程管理的进程。因此，最佳实践也是将我们的 Docker 镜像及其定义的运行容器定义为完全无状态的。我们应该能够关闭一个容器并将其从系统中移除，然后使用相同的镜像启动一个相同的容器，并运行命令，而不会对我们的工作产生任何影响。\n\
  \n### 单一职责容器\n\n早期版本的 Dockerfile 最佳实践遵循“每个容器一个进程”的原则。随着 Docker 的成熟，坚持每个容器只运行一个进程已被证明是不可行的。Jupyter\
  \ 实际上就是一个无法通过单个进程来定义的容器的典型例子。尽管如此，最佳实践仍然认为每个容器应被定义为具有单一职责。Jupyter 可能需要多个进程才能正常运行，但我们会用一个单独的容器来专门运行\
  \ Jupyter。如果我们希望与 Postgres 数据库交互，我们会使用另一个专门负责该数据库的容器。最终目标是保持应用职责的分离和模块化。\n\n## 项目：一个\
  \ Docker 镜像仓库\n\n在本章中，你将开发一个 Dockerfile 仓库，每个 Dockerfile 定义了一个你工作中可能用到的独立镜像。在通过\
  \ Dockerfile 开发和维护这些镜像的过程中，你将探索定义镜像的语法以及构建和维护镜像的最佳实践。你的最终目标是创建一套镜像，这些镜像将成为你开发模块化系统以执行数据科学家工作的主要构建块。\n\
  \n### 准备本地开发环境\n\n首先，你将准备好本地机器以进行后续的开发工作。在代码清单 5-1 中，你通过为项目创建一个目录并将其初始化为 git 仓库来完成此操作。\n\
  \n```\n$ mkdir ch_5_dockerfiles && cd ch_5_dockerfiles\n$ git init\n$ touch README.md\n\
  $ git add README.md\n$ git commit -m 'init'\n```\n\n*代码清单 5-1. 准备本地开发环境*\n\n###\
  \ 配置 GitHub\n\n在 GitHub 上，创建一个名为 `Dockerfiles` 的仓库。创建好仓库后，将你的本地目录连接到远程 GitHub 仓库（代码清单\
  \ 5-2）。\n\n**注意：** 你需要配置你的 GitHub 账户以通过 SSH 进行连接。相关文档可在 [`help.github.com/articles/connecting-to-github-with-ssh/`](https://help.github.com/articles/connecting-to-github-with-ssh/)\
  \ 找到。\n\n```\n$ git remote add origin git@github.com:<username>/dockerfiles.git\n\
  $ git push -u origin master\n```\n\n*代码清单 5-2. 将本地仓库连接到 GitHub*\n\n### 使用 Dockerfile\
  \ 构建镜像\n\nDockerfile 与构建（编译）后的 Docker 镜像之间的连接是通过 `docker build` 命令实现的。该构建命令告诉 Docker\
  \ 守护进程使用指定的上下文和一个 Dockerfile 来构建一个镜像。上下文指的是用于构建特定镜像的文件集合。上下文将通过包含的 PATH 来指定。你可以查看\
  \ `docker build` 的要求来了解其具体形式（代码清单 5-3）。\n\n```\n$ docker build\n\"docker build\"\
  \ requires exactly 1 argument(s).\nSee 'docker build --help'.\n\nUsage:  docker\
  \ build [OPTIONS] PATH | URL | -\n```\n\n*代码清单 5-3. 显示 docker build 帮助信息*\n\n如你所见，`docker\
  \ build` 需要一个 PATH 或 URL 作为最终参数。这就是上下文。\n\n### Dockerfile 语法\n\nDockerfile 使用一种简单的领域特定语言构建（见代码清单\
  \ 5-4）。指令不区分大小写，但按惯例通常全部大写。指令按顺序执行，Dockerfile 应被视为传递给 Docker 守护进程的脚本。\n\n```\n#\
  \ Comment\nINSTRUCTION arguments\n```\n\n*代码清单 5-4. Dockerfile 语法*\n\n### 设计 gsl\
  \ 镜像\n\n你将构建的第一个镜像与你在第 3 章中使用的镜像相同，即 GSL 镜像。此镜像用于使用 GNU 科学库（GSL）编译代码，GSL 是一套用于计算数学的\
  \ C 语言工具，尤其在使用 BLAS 生态系统时。你使用 `gcc`² 镜像作为基础镜像来构建此镜像，这样做可以确保你拥有编译 C 代码所需的所有工具。\n\n\
  #### 创建 gsl 源码目录\n\n首先，你为这个特定的镜像创建一个目录，并实例化你的 Dockerfile（代码清单 5-5）。\n\n```\n$ mkdir\
  \ gsl\n$ touch gsl/Dockerfile\n```\n\n*代码清单 5-5. 为 gsl 镜像创建一个包含空 Dockerfile 的目录*\n\
  \n在代码清单 5-6 中，为了构建 `gsl` 镜像，你使用了 `docker build` 命令，并将相对引用的文件夹 `gsl` 作为上下文。`-t` 标志告诉守护进程将该镜像命名为\
  \ `joshuacook/gsl`。你最初的构建尝试失败了，因为你还没有向 Dockerfile 中添加任何命令。\n\n```\n$ docker build\
  \ -t joshuacook/gsl gsl\nsending build context to Docker daemon 53.25 kB\nError\
  \ response from daemon: The Dockerfile (Dockerfile) cannot be empty\n```\n\n*代码清单\
  \ 5-6. 运行 Docker 构建*\n\n#### 定义 gsl 镜像\n\n让我们像在第 3 章中那样定义 `gsl` 镜像，使用三个命令定义三个层，如代码清单\
  \ 5-7 所示。\n\n```\nFROM gcc\nLABEL maintainer=@joshuacook\nRUN apt-get update &&\
  \ \\\n      apt-get install -y \\\n      gsl-bin \\\n      libgsl0-dbg \\\n    \
  \  libgsl0-dev \\\n      libgsl0ldbl\n```\n\n*代码清单 5-7. gsl/Dockerfile*\n\n####\
  \ 构建 gsl 镜像\n\n在代码清单 5-8 中，使用 Dockerfile 定义了镜像后，你使用 `docker build` 命令构建该镜像，再次命名镜像并将\
  \ `gsl` 目录作为上下文提供。\n\n```\n$ docker build -t joshuacook/gsl gsl\nsending build context\
  \ to Docker daemon 14.85 kB\nStep 1 : FROM gcc\nlatest: Pulling from library/gcc\n\
  693502eb7dfb: Pull complete\n...\ne6a66f7b6a7a: Pull complete\nDigest: sha256:c1fa0b3eeba33a7b9da5ab7de7fa2c520760f778b5e5d1db38791d0da7b841b9\n\
  Status: Downloaded newer image for gcc:latest\n ---> 408d218617ca\nStep 2 : LABEL\
  \ maintainer @joshuacook\n ---> Running in 723583dd01d6\n ---> 20bbe26b8b8a\nRemoving\
  \ intermediate container 723583dd01d6\nStep 3 : RUN apt-get update &&     apt-get\
