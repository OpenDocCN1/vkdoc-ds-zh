  \n现在，你将迭代你的应用程序，使其达到最终状态。你将在现有应用程序中添加一个 Redis 服务，以及两个基于 Jupyter 镜像变体定义的其他服务。在第 9\
  \ 章中，我讨论了如何使用 Redis 缓存中间结果。在这里，你将探索 Redis 的另一个用途，即作为延迟作业处理系统的骨干。除了 Redis，延迟作业处理系统还将使用一个\
  \ Worker 服务（用于执行延迟作业）和一个 Monitor 服务（用于通过 Web 浏览器监控延迟作业的状态）。图 10-13 显示了最终应用程序的示意图。\n\
  \n![A439726_1_En_10_Fig13_HTML.jpg](img/A439726_1_En_10_Fig13_HTML.jpg)  \n图 10-13.\
  \ 最终应用程序示意图\n\n为此，你需要在 `docker-compose.yml` 文件中添加一些内容（清单 10-56）：\n\n*   使用 `image:`\
  \ 关键字定义一个 Redis 服务。\n*   创建一个供 Redis 服务使用的数据卷。\n*   使用与 Jupyter 服务相同的构建上下文定义一个 Worker\
  \ 服务。\n*   使用与 Jupyter 服务相同的构建上下文定义一个 Monitor 服务。\n\n虽然 Worker 服务和 Monitor 服务都将使用\
  \ `docker/jupyter` 构建上下文来定义，但你将在运行时使用 `entrypoint:` 关键字扩展这些镜像。此关键字指定了镜像启动时应执行的命令（换句话说，即定义容器行为的核心进程）。Worker\
  \ 服务将使用 `rqworker` 工具与 Redis 交互，以获取并执行排队的作业。你使用 `entrypoint:` 关键字的 exec 形式，并利用 yaml\
  \ 列表来指定实例化进程。入口点包括：\n\n*   `tini`\n    *   第 5 章中提到的 PID 1 工具，Jupyter 用它来实例化所有容器\n\
  *   `--`\n    *   使用 `tini` 实例化容器的最佳实践 ⁷\n*   `rqworker`\n    *   你将用来运行 Worker\
  \ 服务的进程\n*   `-u`\n    *   URL 标志\n*   `redis://this_redis:6379`\n    *   Redis\
  \ 可用的 URL\n    *   使用 Redis 服务在 Docker Compose 创建的网络上的名称\n\nMonitor 服务将使用 `rq-dashboard`\
  \ 工具，以提供一个基于 Web 的仪表板，用于监控排队作业的状态。你使用 `entrypoint:` 关键字的 exec 形式，并利用 yaml 列表来指定实例化进程。入口点包括：\n\
  \n*   `tini`\n*   `--`\n*   `rq-dashboard`\n    *   你将用来运行 Monitor 服务的进程\n*   `-H`\n\
  \    *   主机标志\n*   `this_redis`\n    *   Redis 服务在 Docker Compose 创建的网络上的名称\n* \
  \  `-p`\n    *   端口标志\n*   `5000`\n    *   你的 Monitor 服务可用的端口\n\n\n\n与之前一样，你无需显式指定容器之间的链接，让\
  \ Docker Compose 为你建立链接。你需要确保将 `redis_data` 卷挂载到 `this_redis` 容器内的正确位置。\n\n```\n\
  version: '3'\nservices:\n  this_jupyter:\n    build: docker/jupyter\n    ports:\n\
  \      - \"8888:8888\"\n    volumes:\n      - .:/home/jovyan\n  this_postgres:\n\
  \    build: docker/postgres\n    volumes:\n      - postgres_data:/var/lib/postgresql/data\n\
  \  this_redis:\n    image: redis\n    volumes:\n      - redis_data:/data\n  this_worker:\n\
  \    build: docker/jupyter\n    volumes:\n      - .:/home/jovyan\n    entrypoint:\n\
  \      - \"tini\"\n      - \"--\"\n      - \"rqworker\"\n      - \"-u\"\n      -\
  \ \"redis://this_redis:6379\"\n  this_monitor:\n    build: docker/jupyter\n    volumes:\n\
  \      - .:/home/jovyan\n    ports:\n      - \"5000:5000\"\n    entrypoint:\n  \
  \    - \"tini\"\n      - \"--\"\n      - \"rq-dashboard\"\n      - \"-H\"\n    \
  \  - \"this_redis\"\n      - \"-p\"\n      - \"5000\"\nvolumes:\n  postgres_data:\n\
  \  redis_data:\n```\n\n清单 10-56. 你的 `docker-compose.yml` 的下一版本\n\n接下来（清单 10-57），你将更新\
