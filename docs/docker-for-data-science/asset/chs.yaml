  \ 显示 Docker 二进制文件的位置\n\n确认 Docker 客户端已正确安装后，就可以继续运行经典的 \"Hello, World!\" 示例，如清单\
  \ 2-15 所示。\n\n```\n$ docker run hello-world\nUnable to find image 'hello-world:latest'\
