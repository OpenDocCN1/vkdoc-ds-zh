  \ 行中`target`尚未编码的行的`_id`。对于每一行，你使用`.enqueue()`函数将`encode_target`函数及其关联的`_id`添加到作业队列中。请注意，要传递的参数（即运行时传递给`encode_target`的`_id`）作为第二个参数传递给`.enqueue()`。\n\
  \n```\nIn [4]: con, cur = connect_to_postgres()\n        for _ in range(100):\n\
