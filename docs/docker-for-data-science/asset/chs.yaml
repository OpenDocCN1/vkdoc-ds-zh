  Status: Downloaded newer image for hello-world:latest\nHello from Docker!\n```\n\
  \n清单 2-15. 运行 hello-world 镜像\n\n这条消息表明你的安装似乎工作正常。为了生成这条消息，Docker 执行了以下步骤：\n\n1.\
  \ Docker 客户端联系了 Docker 守护进程。\n2. Docker 守护进程从 Docker Hub 拉取了 `hello-world` 镜像。\n\
  3. Docker 守护进程基于该镜像创建了一个新容器，该容器运行了可执行文件，并产生了你当前正在阅读的输出。\n4. Docker 守护进程将该输出流式传输到\
  \ Docker 客户端，然后由客户端发送到你的终端。\n\n如果想尝试更复杂的操作，你可以使用 `$ docker run -it ubuntu bash`\
  \ 命令运行一个 Ubuntu 容器。通过 [`cloud.docker.com/`](https://cloud.docker.com/) 上的免费 Docker\
  \ ID，你可以共享镜像、自动化工作流以及实现更多功能。更多示例和想法，请访问 [`docs.docker.com/engine/userguide/`](https://docs.docker.com/engine/userguide/)。\n\
  \n至此，你已经验证了 Docker 已正确安装并能正常运行。当你执行此命令时，Docker 客户端会将 `run hello-world` 命令发送给 Docker\
  \ 引擎。Docker 引擎随后执行以下操作：\n\n1. 在本地镜像缓存中检查 `hello-world` 镜像。\n2. 如果本地不存在该镜像，则从 Docker\
  \ Hub 下载。\n3. 使用该镜像创建一个新容器。\n4. 分配文件系统，并在镜像顶层添加一个可读写层。\n5. 为系统设置一个 IP 地址。\n6. 执行镜像\
  \ Dockerfile 中指定的 shell 命令 `/hello`。\n7. 该进程完成后，终止容器并关闭。\n\n清单 2-16 展示了一个基本的 Docker\
  \ 命令：运行最新的 Ubuntu 镜像（`run ubuntu`）并通过 bash shell（`-i -t /bin/bash`）连接到它。当你执行此命令时，Docker\
  \ 客户端将命令发送给 Docker 引擎。Docker 引擎执行以下操作：\n\n1. 在本地镜像缓存中检查 `ubuntu` 镜像。\n2. 从 Docker\
  \ Hub 下载镜像（除非本地已存在）。\n3. 使用该镜像创建一个新容器。\n4. 分配文件系统，并在镜像顶层添加一个可读写层。\n5. 为系统设置一个 IP\
  \ 地址。\n6. 在容器内执行 `/bin/bash` 进程。\n7. 通过你当前的终端连接到正在运行的 `/bin/bash` 进程。\n\n```\n$\
  \ docker run -it ubuntu  /bin/bash\nroot@eb5f4278d040:/#\n```\n\n清单 2-16. 运行基础 ubuntu\
