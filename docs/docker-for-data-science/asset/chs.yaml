  \ 9-37.** 将单条推文插入 MongoDB\n\n```\nIn [6]: (mongo_cli\n         .twitter_database\n\
  \         .tweets_collection.count())\nOut[6]: 1\n```\n\n**代码清单 9-38.** 统计 `tweet_collection`\
  \ 中的推文数量\n\n\n\n"
- "# 通过实例类型扩展 AWS 应用\n\n在第 1 章中，你探讨了不同规模数据集、模型和模型拟合过程的内存使用情况。其目的是检查 AWS `t2.micro`\
  \ 实例上的内存限制，这是本书推荐使用的系统。当时，这项检查完全是学术性的。而现在，你遇到了实际的系统限制。你希望加载一个通过 `spaCy` 库提供的语言模型，但它根本无法在你的\
  \ `t2.micro` 实例上运行。你将使用 Docker、Docker-Compose 和 AWS 创建一个高效的方法来解决这个问题。为此，你需要：\n\n\
