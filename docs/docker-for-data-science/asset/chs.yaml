  在第 8 章中，你配置了一个由 Jupyter 容器和 MongoDB 容器组成的双容器系统，这两个容器运行在 AWS 上的两个独立主机系统中。在这里，你将使用\
  \ Docker Compose 创建功能等效的系统。使用 Docker Compose 构建系统的一个优势是，你能够在同一台主机上运行这两个服务，而无需投入大量精力管理网络配置。你之前配置简单的\
  \ Compose 应用时已经看到，只需使用你在 `docker-compose.yml` 文件中为服务指定的名称，就能访问 Redis。你将利用这种简单的网络配置方法，并采用两种新的\
  \ Docker Compose 技术：数据卷的配置和环境变量的定义。图 9-3 展示了你将配置的系统的示意图。\n\n![A439726_1_En_9_Fig3_HTML.jpg](img/A439726_1_En_9_Fig3_HTML.jpg)\n\
  \n**图 9-3.** 包含两个服务和一个数据卷的 Docker Compose 应用\n\n再次，你首先创建一个目录来存放你的项目（清单 9-17）。回想一下，`docker-compose`\
  \ 使用 `docker-compose.yml` 文件与 Docker 引擎通信，因此最佳实践是为每个项目创建一个新目录，并为其提供独立的 `docker-compose.yml`\
  \ 文件。在清单 9-18 中，你创建了新的 `docker-compose.yml` 文件（清单 9-19）。\n\n```\n$ mkdir ch_9_jupyter_mongo\n\
  $ cd ch_9_jupyter_mongo\n```\n\n**清单 9-17.** 创建存放项目的目录\n\n```\n$ vim docker-compose.yml\n\
  ```\n\n**清单 9-18.** 创建 `docker-compose.yml` 文件\n\n```\nversion: '3'\nservices:\n\
  \  this_jupyter:\n    build: docker/jupyter\n    ports:\n      - \"8888:8888\"\n\
  \    volumes:\n      - .:/home/jovyan\n    env_file:\n      - config/jupyter.env\n\
  \  this_mongo:\n    image: mongo\n    volumes:\n      - mongo_data:/data/db\nvolumes:\n\
  \  mongo_data:\n```\n\n**清单 9-19.** `ch_9_jupyter_mongo/docker-compose.yml` 文件\n\
  \n虽然你再次使用 Compose 文件定义了两个服务 `this_jupyter` 和 `this_mongo`，但与之前的应用相比，你对这个文件做了更多操作。首先，`this_jupyter`\
  \ 服务不是通过 `image:` 关键字定义的，而是使用了 `build:` 关键字。清单 9-22 展示了你将用于构建的 Dockerfile。此外，你添加了\
  \ `env_file:` 关键字。清单 9-24 展示了你将使用的环境文件。在 `this_mongo` 的定义中，你添加了一个 `volumes:` 关键字，该关键字引用了稍后在\
  \ Compose 文件中定义的 `mongo_data` 卷。\n\n### 指定构建上下文\n\n在这里，你通过提供一个指向所需构建上下文的路径字符串来指定\
  \ `build` 关键字。在第 5 章中，你了解到构建上下文指的是用于构建特定镜像的文件集合。换句话说，构建上下文是一个目录，其中包含要使用的 Dockerfile\
  \ 以及构建所需的其他任何文件。在这里，你指定了一个构建上下文 `docker/jupyter`。在清单 9-20 中，你相对于 `docker-compose.yml`\
  \ 文件的位置创建了这个目录。请注意，传递给 `mkdir` 命令的 `-p` 标志允许你创建嵌套的目录结构。在这种嵌套目录结构中，你采用了一种最佳实践，这将在第\
  \ 10 章中讨论。\n\n```\n$ mkdir -p docker/jupyter\n$ tree .\n├── docker\n│   └── jupyter\n\
  └── docker-compose.yml\n```\n\n**清单 9-20.** 创建 `this_jupyter` 构建上下文\n\n接下来（清单 9-21），你需要创建\
  \ Dockerfile（清单 9-22），该文件将定义你的新镜像。在定义 Dockerfile 时，你采用了第 7 章中定义的最佳实践。\n\n```\n$\
  \ vim docker/jupyter/Dockerfile\n```\n\n**清单 9-21.** 创建 `docker/jupyter/Dockerfile`\n\
  \n```\nFROM jupyter/scipy-notebook\nUSER root\nRUN conda install --yes --name root\
  \ spacy pymongo\nRUN [\"bash\", \"-c\", \"source activate root && pip install twitter\"\
  ]\nRUN python -m spacy download en\nUSER jovyan\n```\n\n**清单 9-22.** `docker/jupyter/Dockerfile`\n\
  \n> **注意：** 由于你不打算使用 Python 2 内核运行任何代码，因此无需在 `python2` 环境中安装这些库。相反，你只安装到 `root`\
  \ 环境，正如你在第 6 章中回忆的那样，这是 Python 3 环境。\n\n### 指定环境文件\n\n在第 8 章中，你获得了一组 OAuth 凭据，可用于直接从\
  \ Twitter 的流式 API 中流式传输推文。从安全角度来看，最佳实践是将这些凭据存储在单独的文件中。在这里，你将把这些凭据存储在一个名为 `jupyter.env`\
  \ 的环境文件中。你已使用 `env_file:` 关键字告诉 Docker Compose 使用此文件。在清单 9-23 中，你创建了 `config` 目录来存放此文件，然后创建了清单\
  \ 9-24 中所示的新文件。和之前一样，将环境文件中的虚拟字符串替换为你的实际 API 凭据。\n\n```\n$ mkdir config\n$ vim config/jupyter.env\n\
  ```\n\n**清单 9-23.** 创建 `config` 目录和 `config/jupyter.env`\n\n```\nCONSUMER_KEY=dummy_consumer_key\n\
  CONSUMER_SECRET=dummy_consumer_secrete\nACCESS_TOKEN=dummy_access_token\nACCESS_SECRET=dummy_access_secret\n\
  ```\n\n**清单 9-24.** `config/jupyter.env`\n\n> **警告：** `config/jupyter.env` 文件应被视为\
  \ bash 脚本。这意味着变量定义在等号两侧不能有空格。在 bash 中，`var=1` 是变量赋值，⁶ 而 `var = 1` 是一个布尔比较，它会首先尝试执行\
  \ `var1`。⁷\n\n在清单 9-25 中，你使用 `tree` 工具来展示应用目录的最终状态。\n\n```\n$ tree .\n├── config\n\
  │   └── jupyter.env\n├── docker\n│   └── jupyter\n│       └── Dockerfile\n└── docker-compose.yml\n\
  ```\n\n**清单 9-25.** 使用 `tree` 展示应用目录\n\n### 数据持久化\n\n在第 8 章中，你使用了 Docker 数据卷来在容器的生命周期之外持久化数据。你是通过\
  \ `docker volume` 工具实现的，在基础设施即代码的背景下，你应该将其视为一种手动方法。使用 `docker-compose.yml` 文件，可以像定义服务一样定义卷（即，使用代码指定卷的创建）。此外，你可以定义应用将如何使用该卷（即，你可以指定将其挂载到特定服务）。在清单\
  \ 9-19 中，你定义了一个名为 `mongo_data` 的卷，然后将该卷链接到你的 `mongo` 服务。\n\n### 使用 Compose 构建你的应用\n\
  \n\n\n"
- "# 构建并运行应用程序\n\n在运行应用程序之前，你需要先构建它。这是因为你定义的至少一个服务使用了 `build:` 关键字（而非 `image:` 关键字）来定义用于实例化其容器的镜像。在代码清单\
  \ 9-26 中，你将执行此构建。值得注意的是，该命令只会影响那些使用 `build:` 关键字定义的服务。你可以看到构建过程跳过了 `this_mongo`，因为它使用的是镜像。\n\
  \n```\n$ docker-compose build\nthis_mongo uses an image, skipping\nBuilding this_jupyter\n\
  Step 1/6 : FROM jupyter/scipy-notebook\n ---> 3dc12029099d\nStep 2/6 : USER root\n\
  \ ---> Using cache\n ---> d0fe6db71e0b\nStep 3/6 : RUN conda install --yes --name\
  \ root spacy pymongo\n ---> Running in 26e516e316c3\n...\nStep 4/6 : RUN bash -c\
  \ source activate root && pip install twitter\n ---> Running in 5a07f7033056\n...\n\
  Step 5/6 : RUN python -m spacy download en\n ---> Running in 319588ae94c6\n...\n\
  Step 6/6 : USER jovyan\n ---> Running in 5c0f78fd96f2\n ---> d928c6dcf4fd\nRemoving\
  \ intermediate container 5c0f78fd96f2\nSuccessfully built d928c6dcf4fd\nSuccessfully\
  \ tagged ch9jupytermongo_this_jupyter:latest\n```\n\n**代码清单 9-26.** 使用 `docker-compose\
  \ build` 构建应用程序\n\n> **警告**\n> 当运行 `docker-compose up` 时，Docker 客户端会检查本地镜像缓存，看每个定义的服务关联的镜像是否存在于缓存中。对于使用\
  \ `build:` 关键字定义的服务，如果镜像不在缓存中，则会构建该镜像。也就是说，`docker-compose build` 会被隐式调用。但这仅在镜像不在本地镜像缓存中时才会发生。这意味着，如果对\
  \ Dockerfile 或其他应用程序文件进行了更改，`docker-compose up` 命令无法检测到这些更改并触发构建。对于不熟悉的人来说，可能觉得\
  \ `docker-compose up` 会隐式调用构建，但实际上这只在镜像不在缓存中时才会发生。因此，建议的最佳实践是在运行 `docker-compose\
  \ up` 之前始终运行 `docker-compose build`。\n\n最后，完成构建后，你再次使用 `docker-compose up` 命令运行应用程序（代码清单\
  \ 9-27）。\n\n```\n$ docker-compose up -d\nStarting ch9jupytermongo_this_mongo_1\n\
  Starting ch9jupytermongo_this_jupyter_1\nubuntu@LOCAL:∼/ch_9_jupyter_mongo\n```\n\
  \n**代码清单 9-27.** 启动 Compose 应用程序 `jupyter_mongo`\n\n在代码清单 9-28 中，你再次使用 `docker-compose\
  \ ps` 工具来显示当前应用程序关联容器的进程信息。\n\n```\n$ docker-compose ps\nName                  \
  \         Command\n-----------------------------------------------------------\n\
  ch9jupytermongo_this_jupyter_1 tini -- start-notebook.sh\nch9jupytermongo_this_mongo_1\
  \   docker-entrypoint.sh mongod\nState      Ports\n-----------------------------------------------------------\n\
  Up         0.0.0.0:8888->8888/tcp\nUp         27017/tcp\n```\n\n**代码清单 9-28.** 显示当前\
  \ `docker-compose.yml` 的容器\n\n接下来（代码清单 9-29），你获取 Jupyter 容器的安全令牌，以便能够通过浏览器访问 Jupyter。\n\
  \n```\n$ docker exec ch9jupytermongo_this_jupyter_1 jupyter notebook list\nCurrently\
