  \       libgsl0-dev       libgsl0ldbl\n ---> Using cache\n ---> 8706282586fc\nStep\
  \ 4/4 : RUN apt-get install -y gdb\n ---> Using cache\n ---> 53111721b96a\nSuccessfully\
  \ built 53111721b96a\n```\n\n**清单 5-15.** 再次运行相同的构建\n\n一个更有趣且更有用的结果是，构建将只运行在你做出更改的第一个步骤之后的步骤，如清单\
  \ 5-15 所示。\n\n### Anaconda\n\nAnaconda 是 Python 和 R 编程语言的免费增值发行版，用于大规模数据处理、预测分析和科学计算。你将使用\
  \ Anaconda 来驱动你的 Jupyter 平台。`conda` 命令是管理 Anaconda 安装的主要接口。Miniconda 是一个小的“引导”版本，仅包含\
  \ `conda` 和 `conda-build`，并安装 Python。然而，作为练习，你将设计自己的 miniconda 镜像，该镜像模仿 Continuum\
  \ Analytics 分发的 miniconda 镜像，可用于最小化地运行 IPython。\n\n### 设计 miniconda3 镜像\n\n在第 3\
  \ 章中，你使用了 `jupyter/scipy-notebook` 镜像来使用 `scipy` 库运行 IPython。这是对该镜像的完全合理的使用。它包含了你需要的所有库。此外，为了拥有单一用途的镜像而存储两个独立定义的镜像（一个用于运行带有\
  \ `scipy` 的 Jupyter，另一个用于运行带有 `scipy` 的 IPython）会消耗不必要的磁盘空间。最后，从 `jupyter` 镜像运行\
  \ IPython 是 IPython 团队推荐的最佳实践。³ 最终，你也会这样做。\n\n#### 创建 miniconda3 源码目录\n\n同样，在清单\
  \ 5-16 中，你首先创建一个目录来存放与此镜像关联的源代码。\n\n```\n$ mkdir miniconda3\n$ touch miniconda3/Dockerfile\n\
