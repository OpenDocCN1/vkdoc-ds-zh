- "# 10. 交互式软件开发\n\nJoshua Cook¹  \n(1) 美国加利福尼亚州圣莫尼卡\n\n数据科学家进行软件开发的方式与传统软件工程不同，且远未被充分理解。对于传统软件开发者而言，无论使用何种语言，都存在围绕复用性、可扩展性和稳定性构建的框架。其中最著名的可能是\
  \ Ruby 语言的 `Rails` 框架。`Rails` 从其底层架构开始，就围绕其所采用的范式——模型-视图-控制器（Model-View-Controller）设计模式进行编写，该模式在面向用户的软件实现中备受青睐。清单\
  \ 10-1 展示了新 `Rails` 应用的创建过程及其默认文件结构。请注意，新应用根据其使用模式创建了清晰的目录。\n\n```\n$ rails new\
  \ myapp\n      create\n      ...\n$ tree -L 1 myapp/app\nmyapp/app/\n├── assets\n\
  ├── channels\n├── controllers\n├── helpers\n├── jobs\n├── mailers\n├── models\n\
  └── views\n```\n\n**清单 10-1.** 一个默认的 Rails 应用\n\n数据科学领域的软件开发并没有这样的设计模式，可以围绕其构建类似的框架。在第三章中，我介绍了交互式计算作为传统编程替代方案的理念。在本章中，我提议将交互式计算本身作为潜在框架的基石理念。你将开发一个项目框架，其基础设施由\
  \ `docker-compose.yml` 定义，并围绕作为交互式计算驱动器的 `Jupyter` 构建。该框架的目标与交互式计算项目的目标一致。该框架应便于实现以下方面：\n\
  \n- 迭代\n- 硬件的扩展与分发\n- 工作的共享与文档化\n\n## 计算生物学项目组织快速指南\n\n为了给这个框架寻找灵感，让我们看看华盛顿大学 William\
  \ Noble 的工作。¹ Noble 的工作描述了“执行计算实验的一种良好策略”，重点关注“诸如组织文件目录和记录进度等相对平凡的问题”。Noble 专注于构建项目的几个关键原则：\n\
  \n- 文件和目录组织\n- 工作文档化\n- 工作执行\n- 版本控制\n\n图 10-1 展示了 Noble 为一个名为 `msms` 的示例项目设计的文件和目录组织图。\n\
  \n![A439726_1_En_10_Fig1_HTML.jpg](img/A439726_1_En_10_Fig1_HTML.jpg)\n\n**图 10-1.**\
  \ Noble 的示例项目 `msms`\n\n## 交互式开发的项目框架\n\n你将直接借鉴这项工作来开发你的框架。你将使用按顺序编号的 `Jupyter Notebooks`，作为记录和执行工作的方法。这些笔记本既成为活动的详细记录，也成为驱动这些活动的手段。此外，你将展示一个围绕使用\
  \ `Jupyter Notebook` 作为工作驱动器而设计的目录层次结构。图 10-2 展示了一个为交互式开发构建的目录层次结构。\n\n![A439726_1_En_10_Fig2_HTML.jpg](img/A439726_1_En_10_Fig2_HTML.jpg)\n\
  \n**图 10-2.** 为交互式开发构建的目录层次结构\n\n你将使用以下目录来构建项目的目录层次结构：\n\n- `data`\n    - 包含原始数据文件\n\
  - `docker`\n    - 包含一个子目录，用于存放每个需要通过构建来定义的镜像\n    - 每个子目录将成为相应镜像的构建上下文\n- `ipynb`\n\
  \    - 包含所有 `Jupyter Notebook` 文件\n    - 替代 `bin`、`doc` 和 `results` 目录\n    - 笔记本是驱动器、脚本、文档和演示文稿\n\
  \    - 笔记本以日期和活动命名，以便原地排序\n- `lib`\n    - 包含项目特定的代码模块，在项目开发过程中定义\n\n\n\n"
- "# 项目根目录设计模式\n\n在第 3 章中，我曾提出：\n\n> Jupyter 并不能取代 vim、Sublime Text 或 PyCharm。Jupyter\
  \ 取代的是 `if __name__ == \"__main__\":`。\n\n`if __name__ == \"__main__\":` 设计模式为运行\
  \ Python 程序提供了一个启动钩子。我在此提出的项目框架并非围绕这种代码运行方式构建，因此也不需要这样的启动钩子。相反，你是以 Jupyter Notebook\
  \ 作为驱动器来构建这个框架的。你需要的是一个将模块导入到 notebook 中的模式。维护清晰的项目目录结构要求你将 notebook 和 Python 模块分别存放在不同的目录中。此外，我认为将两者嵌套放置也不够美观。这会在导入时引发问题。给定如代码清单\
  \ 10-2 所示的目录结构，你无法将 `lib/` 中的模块（例如代码清单 10-3 所示的 `some_module.py`）直接导入到 `ipynb/`\
  \ 中的 Jupyter Notebook 模块里。\n\n```\n$ tree .\n├── ipynb\n│   └── some_notebook.ipynb\n\
  └── lib\n    ├── __init__.py\n    ├── some_module.py\n```\n\n代码清单 10-2. 示例项目结构\n\
  \n```\n#!/bin/python\ndef say_hello ():\n    print(\"Hello!\")\n```\n\n代码清单 10-3.\
  \ 一个演示用的 Python 模块 `some_module.py`\n\n让我们通过使用我称之为项目根目录设计模式（代码清单 10-4）来解决这个问题。\n\
  \n```\nIn [1]: from os import chdir\n        chdir('/home/jovyan')\n```\n\n代码清单\
  \ 10-4. 项目根目录设计模式\n\n项目根目录设计模式会将 Python 内核的当前工作目录更改为项目的根目录。这由 `docker-compose.yml`\
