  \ 1GB 的 `spaCy` 模型。\n\n在图 9-7 中，你更改了 AWS 实例类型。从“操作”菜单的“实例设置”菜单项中选择“更改实例类型”。\n\n\
  ![A439726_1_En_9_Fig6_HTML.jpg](img/A439726_1_En_9_Fig6_HTML.jpg)\n\n图 9-6. 美国西部（俄勒冈）区域的按需实例定价和规格\n\
