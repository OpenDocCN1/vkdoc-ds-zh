- "# 带标签的镜像\n\n在 Python 社区中，Python 2 和 Python 3 之间存在着活跃、知名且友好的分歧。这意味着任何 Python 技术都必须能够同时在两个主要\
  \ Python 版本上运行。在你的个人电脑上，这是一项艰巨的任务，需要支持 Python 2 和 3 的包管理器，以及诸如 `virtualenv` 或 `conda`\
  \ 提供的虚拟环境系统。使用 Docker，这项任务可以通过 Docker 镜像标签轻松管理。镜像标签定义了在单一命名空间和仓库组合下镜像定义的变体。标签没有语义含义，你的\
  \ Docker ID 或仓库名称也没有。它们仅用于区分对镜像所做的细微更改。可以通过以下三种方式之一为镜像添加标签：\n\n1.  在构建时，只需将 `:<tag>`\
  \ 附加到镜像名称的末尾即可为镜像添加标签（清单 6-6）。使用此方法，带标签的镜像将与特定的 Dockerfile 关联。\n2.  之后可以使用 `docker\
  \ tag` 命令为镜像添加标签（清单 6-7）。使用此方法，带标签的镜像将与特定的 Dockerfile 关联。\n3.  可以使用 `docker commit`\
  \ 命令将对容器所做的临时更改持久化为新镜像（清单 6-8）。使用此方法，将不存在描述对镜像所做临时更改的 Dockerfile。\n\n```\n$ docker\
  \ build -t <namespace>/<repository_name>:<tag>\n```\n清单 6-6. 在构建期间为镜像添加标签\n\n```\n\
  $ docker tag <existing_image> <namespace>/<repository_name>:<tag>\n```\n清单 6-7.\
  \ 为现有本地镜像重新打标签\n\n```\n$ docker commit <existing_container> <namespace>/<repository_name>:<tag>\n\
  ```\n清单 6-8. 将容器的更改提交为带标签的镜像\n\n你将在下一章中重新审视最后一点，作为维护镜像半持久性更改的最佳实践。\n\n## Python\
  \ 镜像上的标签\n\nPython 镜像可以在 Python 的官方仓库页面上找到。访问“标签”选项卡，你可以看到与 Python 仓库关联的数十个标签的具体信息。Python\
  \ 仓库使用镜像标签不仅管理 Python 2 和 Python 3 的分歧，还管理四个不同版本的 Python 3。从官方仓库页面，你可以链接到用于定义 Python\
  \ 仓库中各个带标签镜像的 Dockerfile（见图 6-2）。\n\n![A439726_1_En_6_Fig2_HTML.jpg](img/A439726_1_En_6_Fig2_HTML.jpg)\n\
  \n图 6-2. Python 官方仓库页面\n\n## 官方仓库\n\nDocker 为主要开源技术维护了一套精选的 Docker 镜像。这些官方仓库是使用编写\
  \ Dockerfile 的既定最佳实践设计的（并且很可能由 tianon 维护）。你在 Python 官方仓库中看到了第一个官方仓库。除了 `jupyter`\
  \ 镜像（你将其视为官方仓库）之外，你几乎总是使用官方仓库作为你的基础镜像。\n\n## 推送到 Docker Hub\n\n为了演示推送到 Docker Hub\
  \ 的过程，你将创建一个新镜像 `numpy-notebook`。此镜像将使用 `jupyter/base-notebook` 镜像作为基础，并添加 `numpy`。回想一下，`jupyter/base-notebook`\
  \ 镜像仅包含 Python 3。你只会为 Python 3 添加 `numpy`。\n\n注意：在第 5 章中，你通过设置一个通过 git 和 GitHub\
  \ 跟踪的项目来配置系统进行本地开发。这是一个最佳实践。在本章中，你不会为创建镜像而遵循此实践。这并非因为这不是一个好习惯，而是因为我希望强调使用 Docker\
  \ Hub 与使用 git 是独立的。\n\n在清单 6-9 中，你创建了一个新的本地目录来存放你的项目，以及一个子目录来作为新镜像的上下文。\n\n```\n\
  $ mkdir ch_6_dockerfiles && cd ch_6_dockerfiles\n$ mkdir numpy\n```\n清单 6-9. 创建新的本地目录和上下文子目录\n\
  \n在清单 6-10 中，你创建了一个新的 Dockerfile（如清单 6-11 所示）。新镜像是使用 `jupyter/base-notebook` 镜像作为基础来定义的。为了安装\
  \ `numpy`，你短暂地将镜像的 `USER` 切换为 `root`。你使用 `conda` 安装 `numpy`，然后切换回 `USER jovyan`。\n\
  \n注意：你切换到用户 `root` 来安装库，并在完成后切换回用户 `jovyan`。这被认为是最佳实践，并确保你不会以过多的系统权限运行笔记本服务器。更多内容请参见第\
  \ 7 章。\n\n```\n$ vi numpy/Dockerfile\n```\n清单 6-10. 创建新的 Dockerfile\n\n```\nFROM\
  \ jupyter/base-notebook\nUSER root\nRUN conda install --yes numpy\nUSER jovyan\n\
  ```\n清单 6-11. numpy 的 Dockerfile\n\n在清单 6-12 中，你使用 `docker build` 命令构建 `numpy` 镜像。请注意，术语\
  \ `numpy` 在命令中出现了两次。第一个（`-t numpy`）指的是你赋予镜像的标签或名称。第二个，即命令中的最后一个词，指的是相对引用的构建上下文，在本例中是名为\
  \ `numpy` 的子目录。\n\n```\n$ docker build -t numpy numpy\nSending build context to\
  \ Docker daemon  2.048kB\nStep 1/4 : FROM jupyter/base-notebook\n...\nStep 2/4 :\
  \ USER root\n...\nStep 3/4 : RUN conda install numpy\n...\nStep 4/4 : USER jovyan\n\
  ...\nSuccessfully built 2570ccf8069f\nSuccessfully tagged numpy:latest\n```\n清单\
  \ 6-12. 构建 numpy 镜像\n\n在清单 6-13 中，你使用刚构建的 `numpy` 镜像运行 `ipython` REPL，作为测试安装的一种方式。在完成一个简单的计算后，你使用\
  \ `Ctrl+D` 退出容器化进程。\n\n```\n$ docker run -it numpy ipython\nPython 3.6.1 | packaged\
  \ by conda-forge | (default, May 23 2017, 14:16:20)\nType 'copyright', 'credits'\
  \ or 'license' for more information\nIPython 6.1.0 -- An enhanced Interactive Python.\
  \ Type '?' for help.\n\nIn [1]: import numpy as np\n\nIn [2]: u = np.array((1,2))\n\
  \nIn [3]: np.linalg.norm(u)\nOut[3]: 2.2360679774997898\n\nIn [4]: Do you really\
  \ want to exit ([y]/n)?\n```\n清单 6-13. 从 numpy 镜像运行 ipython\n\n### 创建新仓库\n\n可以通过\
  \ Docker Hub 用户配置文件创建新仓库（见图 6-3）。系统将提示你为仓库指定名称、简短描述和完整描述。你还会被问到仓库应该是公开的还是私有的。默认情况下，新仓库将是公开的。\n\
  \n![A439726_1_En_6_Fig3_HTML.jpg](img/A439726_1_En_6_Fig3_HTML.jpg)\n\n图 6-3. 创建新仓库\n\
  \n再次强调，赋予仓库的名称没有语义含义。关于描述，你应该记得，在描述中输入的关键字会被 `docker search` 功能找到。\n\n注意：你也可以选择在你拥有适当权限的任何组织中创建仓库。\n\
  \n你创建一个名为 `numpy` 的新仓库，其简短描述为“数值 Python”，完整描述为“基于 `jupyter/base-notebook` 构建”。新仓库如图\
  \ 6-4 所示。\n\n![A439726_1_En_6_Fig4_HTML.jpg](img/A439726_1_En_6_Fig4_HTML.jpg)\n\
  \n图 6-4. 新的 `joshuacook/numpy` 仓库\n\n\n\n### 推送镜像\n\n你可能希望推送你在 `numpy` 镜像上所做的工作。按照第\
  \ 5 章讨论的方式创建的本地镜像，只要其命名符合 `<命名空间>/<仓库名称>:<标签>` 模式，就可以轻松推送到 Docker Hub。为了推送你的工作，首先通过\
  \ `docker images` 命令（列表 6-14）重新查看系统上的镜像状态，特别是检查你刚刚创建的 `numpy` 镜像。\n\n```\n$ docker\
  \ images\nREPOSITORY       TAG       IMAGE ID        CREATED           SIZE\nnumpy\
  \            latest    2570ccf8069f    33 minutes ago    925MB\njupyter/       \
  \  latest    161472bc6c75    2 weeks ago       657MB\nbase-notebook\ndebian    \
  \       latest    47af6ca8a14a    2 weeks ago       125.1 MB\nminiconda3       latest\
  \    5865a6cfa8c2    2 weeks ago       1.64 GB\n```\n\n*列表 6-14. 显示本地镜像*\n\n注意：你的镜像都没有命名空间或标签。同样，有三种方式可以为镜像添加标签：1)\
  \ 构建时使用 `docker build`，2) 构建后使用 `docker tag`，3) 通过 `docker commit` 将容器的更改提交为镜像。在列表\
  \ 6-15 中，你使用 `docker tag` 命令为 `numpy` 镜像添加了标签和命名空间。\n\n```\n$ docker tag numpy joshuacook/numpy:1.13.0\n\
  ```\n\n*列表 6-15. 为镜像添加标签*\n\n在列表 6-16 中，你再次显示本地镜像。\n\n```\n$ docker images\nREPOSITORY\
  \     TAG        IMAGE ID        CREATED           SIZE\nnumpy          latest \
  \    2570ccf8069f    34 minutes ago    925MB\njoshuacook/    1.13.0     2570ccf8069f\
  \    34 minutes ago    925MB\nnumpy\njupyter/       latest     161472bc6c75    2\
  \ weeks ago       657MB\nbase-notebook\ndebian         latest     47af6ca8a14a \
  \   2 weeks ago       125.1MB\nminiconda3     latest     5865a6cfa8c2    2 weeks\
  \ ago       1.64GB\n```\n\n*列表 6-16. 显示本地镜像*\n\n现在你有了一个镜像，其命名空间/仓库组合为 `joshuacook/numpy`，标签为\
  \ `1.13.0`。注意它与 `numpy` 镜像具有相同的镜像 ID。Docker 并没有存储两个相同的镜像，而是维护了指向同一镜像的两个引用。为了推送到\
  \ Docker Hub，你必须通过 Docker CLI 使用 `docker login` 登录（列表 6-17）。\n\n```\n$ docker login\n\
  Login with your Docker ID to push and pull images from Docker Hub. If you don't\
  \ have a Docker ID, head over to https://hub.docker.com to create one.\nUsername\
  \ (joshuacook):\nPassword:\nLogin Succeeded\n```\n\n*列表 6-17. 登录 Docker Hub*\n\n\
  一旦你正确标记了镜像并登录，就可以使用 `docker push` 命令（列表 6-18）。\n\n```\n$ docker push joshuacook/numpy:1.13.0\n\
  The push refers to a repository [docker.io/joshuacook/numpy]\n2bcb5be18c74: Pushed\n\
  72c56d765cf2: Mounted from jupyter/base-notebook\n317e6c337ef3: Mounted from jupyter/base-notebook\n\
