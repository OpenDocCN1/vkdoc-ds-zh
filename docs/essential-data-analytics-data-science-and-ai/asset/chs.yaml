- "# 获取数据\n\n数据是数据分析、数据科学和人工智能中最基本的工具之一。数据可以通过多种不同的方式呈现给你。大多数数据都是杂乱无章的，需要在使用前进行清理。\n\
  \n本章将深入探讨数据的多元化世界，揭示其各种类型，并探索获取数据的多种途径。我们将剖析从网络提取数据的复杂性，熟悉公共数据集这个“宝库”，并揭开应用程序编程接口（API）的神秘面纱。我们还将涉及通过调查和问卷收集数据这一传统而又至关重要的方法。最后，我们将讨论数据收集中的伦理和责任。\n\
  \n## 理解不同类型的数据\n\n让我们讨论不同类型数据之间的关键区别，以便在你的项目中有效指导数据的收集与分析过程。\n\n### 结构化数据\n\n结构化数据是经过组织的数据，人和机器都能轻松读取。这类数据通常存在于你常见的工具中，如电子表格和关系型数据库。数据被分配了列，每一行代表该数据的一个实例。这类数据通常被称为表格数据。表格数据以包含行和列的表的形式组织。\n\
  \n结构化数据的优点在于，可以通过各种工具和技术轻松地搜索和分析它。而且，任何人即使没有特殊工具也能更容易地阅读它。这类数据非常适合商业智能、数据分析和人工智能应用。\n\
  \n## 非结构化数据\n\n非结构化数据是指没有特定格式或结构的数据。现实世界中的大多数数据都处于这种形式。非结构化数据包括发票、图像、音频、视频和电子邮件。这类数据的一些示例可见于图\
  \ 2-1。\n\n![](img/613832_1_En_2_Fig1_HTML.jpg)\n\n图 2-1 — 非结构化数据示例图片\n\n结构化数据与非结构化数据之间的区别在于对其所能进行的分析类型。结构化数据采用严格的格式，确保了数据的一致性。相比之下，非结构化数据则不具有一致性。图\
  \ 2-2 直观地展示了这两种数据类型之间的差异。\n\n![](img/613832_1_En_2_Fig2_HTML.jpg)\n\n图 2-2 — 结构化数据与非结构化数据对比示例图片\n\
  \n### 定量数据\n\n定量数据是指具有数值属性的任何数据。这类数据可以被计数或测量。你可以利用这种类型的数据来回答诸如“有多少”、“多少量”或“多频繁”之类的问题。\n\
  \n### 定性数据\n\n定性数据是无法用数字进行计数、测量或表达的信息。你可以利用它来回答诸如“为什么”、“如何”或“发生了什么”之类的问题。\n\n在图\
  \ 2-3 中，我提供了一些思考定性数据与定量数据差异的方式。\n\n![](img/613832_1_En_2_Fig3_HTML.jpg)\n\n图 2-3\
  \ — 如何理解定性数据与定量数据的示例图片\n\n### 时间序列数据\n\n时间序列数据是在不同时间段收集的数据。这种类型的数据有助于理解趋势和季节性。趋势显示了数据的方向，揭示数据在特定时期内是增长、下降还是保持不变。例如，电子商务趋势显示了过去一年销售额的增长或下降，这可以帮助你为下一个财年做出调整。季节性则显示了定期出现的模式——例如，周六香草冰淇淋销售额的激增。\n\
  \n### 截面数据\n\n截面数据是在某个单一时间点收集的数据。这种类型的数据有助于理解特定时刻不同项目之间的关系。\n\n\n\n### 空间数据\n\n\
  空间数据或地理空间数据是指引用地球上特定位置的数据。例如，你能在数据的每一行中看到经纬度。这类数据通常使用地理信息系统（GIS）进行分析，常用的软件工具是 ArcGIS。\n\
  \n## 获取数据的方法\n\n让我们探索各种收集数据的方法，从传统调查、网络爬取，甚至访问提供可下载数据集的流行网站，来为你的分析提供素材。\n\n### 网络爬取：从网页中提取数据\n\
  \n简单来说，网络爬取就是从网站提取内容的过程。你可以从网站上复制/粘贴数据。然而，取决于你想要获取的数据量，这个过程可能会非常繁琐。通过使用编程语言等工具，你可以将时间从几小时缩短到几秒钟，还能再给自己续杯咖啡来度过工作日。注意，不要侵犯个人或公司的版权。\n\
  \n### API：应用程序编程接口\n\nAPI 是两个或多个软件之间进行通信的一种方式，无需了解应用程序内部的所有细节。它作为处理数据传输的中间层，能够节省开发者的时间，并促进不同应用程序之间的协作。API\
  \ 附带有文档，可视为代表双方协议的契约。它会告诉你，如果甲方以预定义的方式发送远程请求，那么甲方可以预期从乙方得到特定的输出。这使得公司能够与第三方开发者和商业伙伴共享其数据和功能。这就像在餐厅按照特定菜单点餐：你点某个特定菜品，就期望能收到它，而无需知道它是如何制作出来的。\n\
  \n### 问卷调查与调查\n\n问卷是用于向个人或群体提问的书面问题集。调查是一种研究方法，它使用问卷来帮助人们通过评估数据和得出结论来了解全局。你可以使用\
  \ Google Forms 和 Typeform 等工具来创建调查。\n\n## 热门网站与数据集\n\n我有几个最喜欢的网站愿意与你分享，你可以用它们来获取数据。这些网站可以作为获取所需数据的宝贵资源。在数据分析、数据科学和人工智能的广阔领域中，数据集的可用性对于有意义的分析和模型开发至关重要。以下网站提供了访问各种数据集的途径，涵盖不同领域和兴趣。\n\
  \n## Kaggle\n\nKaggle 是一个面向数据科学和机器学习爱好者的在线平台。它由 Anthony Goldbloom 和 Jeremy Howard\
  \ 于 2010 年创立，并于 2017 年被谷歌收购。该平台的用户可以与其他用户协作、上传数据集，并相互竞争以解决数据科学挑战。Kaggle 是获取免费数据集和练习技能的好地方。来自全球各地、背景各异的用户在这个平台上单独或共同学习并挑战自我。\n\
  \n在本章中，我多次提到表格数据。然而，在像 Kaggle 这样的平台上，你可以找到各种类型的数据——例如，图像。\n\n面部表情识别 2013（FER2013）数据集包含\
  \ 35,887 张 48x48 的灰度图像。其中有七种情绪：愤怒、厌恶、恐惧、快乐、悲伤、惊讶和中性。这可用于人工智能中执行情绪检测等任务。图 2-4 展示了该数据集中部分图像类型的示例。\n\
  \n![](img/613832_1_En_2_Fig4_HTML.jpg)\n\n图 2-4 FER2013 中随机选取的面部表情图像\n\n## Hugging\
  \ Face\n\nHugging Face 是另一个面向数据科学和机器学习爱好者的在线平台。Kaggle 和 Hugging Face 之间的一个显著区别是，这里没有竞赛。它为成员提供了查找数据集以及发现、训练和部署模型的方法。它由\
  \ Clement Delangue、Julien Chaumond 和 Thomas Wolf 于 2016 年创立。\n\n### 带代码的示例\n\n我接下来会提及的网站都附带使用\
  \ Python 的示例。你可以使用 Jupyter Notebooks、Google Colab 甚至 Visual Studio Code 等软件应用程序来跟着操作，这些软件都是免费的。\n\
  \n## Jupyter Notebook\n\nJupyter Notebook 是一个交互式网络应用程序，可用于共享代码、方程式和可视化内容。它支持多种语言，包括\
  \ R、Python 和 Scala。Notebook 通常以 `.ipynb` 格式保存，但也可以转换为 `.py` 等格式。数据科学家使用它进行数据探索、机器学习建模和实验。\n\
  \n## Google Colab\n\nGoogle Colab 是一个托管在云端的免费 Jupyter Notebook 环境。如果你已经有 Google\
  \ 账户，则无需设置。在下面的示例中，我将使用 Google Colab。\n\n## Visual Studio Code\n\nVisual Studio\
  \ Code 是另一种可用于相同任务的应用程序。它更常见，因为你可以用它来完成其他软件工程任务。\n\n## 热门网站与数据集\n\n### Yahoo Finance\n\
  \n雅虎自 1994 年以来就一直存在，所以我假设我们都知道它是什么。该公司创建了一个 API，可以让你免费访问大量数据。你可以获取实时和历史金融数据。这些数据可以是货币、股票、债券、加密货币、市场分析，甚至新闻！\n\
  \n我将向你演示如何使用一个名为 `yfinance` 的流行 Python 包来使用它。\n\n首先，我们将安装 Python 包 `yfinance`。\n\
  \n```\n!pip3 install yfinance\n```\n\n接下来，我们将导入获取数据所需的必要库。我们需要导入 `yfinance`。为了编写代码更简单快捷，我们会将其导入为\
  \ `yf`。\n\n```\nimport yfinance as yf\n```\n\n在这个示例中，我们将关注苹果股票。我们下载从 2020 年 1 月\
  \ 1 日到 2022 年 12 月 31 日的股票数据。然后，我们将这些数据保存在 `apple_data` 中，并在后续步骤中使用它。\n\n```\napple_data\
  \ = yf.download(\"AAPL\",\nstart = \"2020-01-01\",\nend = \"2022 – 12 -31\")\n```\n\
  \n可以想象，两年内的数据很多，因此通过调用 `.head()`，你可以看到数据的前五行，如图 2-5 所示。\n\n![](img/613832_1_En_2_Fig5_HTML.jpg)\n\
  \n图 2-5 数据的前五行\n\n```\napple_data.head()\n```\n\n现在，我们可以绘制这些数据以查看任何趋势或模式。在这个示例中，我们将查看图\
  \ 2-5 中 `Adj Close` 列的调整收盘价。\n\n![](img/613832_1_En_2_Fig6_HTML.jpg)\n\n图 2-6 股票价格图输出\n\
  \n```\napple_data[\"Adj Close\"].plot(title = \"Apple Stock Price 2020 -2022\")\n\
  ```\n\n\n\n### `Quandl`\n\n`Quandl` 是一个为用户提供金融和替代数据集的平台。替代数据集包括券商研报和公司申报文件等数据。它由\
  \ Tammer Kamel 于 2011 年创立，并于 2017 年被纳斯达克收购。用户可使用超过 2000 万个数据集，其中部分免费，部分需付费。你可以通过两种方式下载数据：一种是以时间序列形式，另一种是通过表格。下面，我将演示如何检索数据。这次，我们将使用\
  \ API 来获取数据。要获取 API 密钥，你需要在 [`https://data.nasdaq.com/`](https://data.nasdaq.com/)\
  \ 创建一个账户。\n\n首先，我们将安装 Python 包 `Nasdaq Data Link`。\n\n```\n!pip3 install nasdaq-data-link\n\
  ```\n\n接下来，我们将导入必要的库来获取数据。我们只需要导入 `Nasdaq data link`。\n\n```\nimport nasdaqdatalink\n\
  ```\n\n最后，我们将获取 `NSE/OIL` 的所有数据，并使用我们的 API 密钥输出。如图 2-7 所示，我们可以访问从 2009 年 9 月 30\
  \ 日到 2019 年 1 月 4 日的石油数据。\n\n![](img/613832_1_En_2_Fig7_HTML.jpg)\n\n图 2-7\n\n`NSE/OIL`\
  \ 提供的可用数据列表\n\n```\nnasdaqdatalink.get(\"NSE/OIL\", api_key = \"YOUR_API_KEY\")\n\
  ```\n\n## 合成数据\n\n合成数据模仿现实世界中的数据。它通常在真实数据因成本高昂或包含敏感信息而难以获取时创建。这类数据可以通过不泄露个人身份信息来缓解企业对数据隐私的担忧。客户信息泄露可能引发诉讼并影响品牌声誉，损害公司的利润。根据情况，生成合成数据有助于加快产品测试和原型开发的速度。合成数据生成是自动化或手动创建这些虚假数据的过程。这些数据可以使用\
  \ Excel 手动创建，或使用 Python 等工具通过计算机算法生成。\n\n数据集可以是完全合成的，也可以是部分合成的。当数据集是完全合成时，它与现实世界毫无关联。然而，当数据是部分合成时，只有部分数据是假的。例如，在一个关于\
  \ 2013 年至 2023 年购房情况的电子表格中，可能只有姓名、地址和电话号码会填入虚假数据。\n\n有时也会遇到数据不足的情况。机器学习模型，尤其是深度学习模型，需要海量数据进行训练。在缺乏所需数据时，可能有必要使用合成数据扩充数据集。\n\
  \n尽管这类数据很有用，但应仅在必要时使用。你正在构建的东西最终会处理现实世界的事件，因此如果你能获取真实数据，就应该使用它。\n\n让我们快速演示一个使用 Python\
  \ 生成合成数据的例子。在此示例中，我将创建虚构的收入数据。\n\n首先，我们将安装 Python 包 `Faker`。`Faker` 是一个可以生成姓名、地址、电话号码、电子邮件地址等信息的\
  \ Python 库！\n\n```\n!pip3 install faker\n```\n\n接下来，我们将导入创建样本数据所需的库。如前所述，`Faker`\
  \ 生成虚假数据。`Pandas` 是一个帮助我们组织和清洗数据的库。我们将其导入为 `pd`，以使代码编写更简单快捷。`Random` 是一个生成随机数的库。我们需要它来生成随机收入。\n\
  \n```\nfrom faker import Faker\nimport pandas as pd\nimport random\n```\n\n`Faker`\
  \ 可以生成多种语言的数据。我特意添加了 `en_US`，以确保生成的信息与美国相关。这将使电话号码和人名的格式为美国人所熟知。\n\n```\nfake_data\
  \ = Faker(\"en_US\")\n```\n\n现在，我们将生成数据。我们将创建三个列表。`people` 列表将包含随机姓名，`phonenumbers`\
  \ 列表将包含随机电话号码，`incomes` 列表将包含随机收入。\n\n```\npeople = []\nphonenumbers = []\nincomes\
  \ = []\n```\n\n在此示例中，我们将通过生成一个循环来创建一个包含十人、收入各异的列表。\n\n```\nfor i in range(10):\n\
  \    person_name = fake_data.name()\n    phone_number = fake_data.phone_number()\n\
  \    income = random.randrange(40000, 200000)\n    people.append(person_name)\n\
  \    phonenumbers.append(phone_number)\n    incomes.append(income)\n```\n\n最后，我们将数据放入一个结构化格式中，以便读取，方法是将数据放入\
  \ `DataFrame`。`DataFrame` 将数据组织成一个类似电子表格的表格，包含行和列。\n\n```\nsample_data = pd.DataFrame()\n\
  sample_data[\"People\"] = people\nsample_data[\"Phone Number\"] = phonenumbers\n\
  sample_data[\"Income\"] = incomes\n```\n\n以下是数据输出的示例。如图 2-8 所示，数据以类似电子表格的结构化形式呈现。\n\
  \n![](img/613832_1_En_2_Fig8_HTML.jpg)\n\n图 2-8\n\n`DataFrame` 中合成数据的输出\n\n你也可以将\
  \ `DataFrame` 转换为实际的电子表格。下面，我使用 `.to_csv` 将 `DataFrame` 转换为 CSV 文件。\n\n```\nsample_data.to_csv(\"\
  synthetic_data.csv\", index = False)\n```\n\n### 遥测数据\n\n遥测数据是指从设备或应用程序实时采集的原始数据。遥测数据的例子包括来自航天器的监测数据、来自汽车以获取车速的传感器数据，以及用户在移动/网络应用上的活动数据。\n\
  \n由于这些数据是原始的，我们需要以一种便于后续分析的方式对数据进行清洗和结构化处理。我们将在下一章讨论实现这一目标的方法。清洗完成后，这些数据可以显示在仪表盘上，用于监控设备或应用程序在生产环境中的运行状况。这些数据也可以反馈回系统，以随着时间的推移进一步改进系统。\n\
  \n## 案例研究与实际应用示例\n\n让我们深入探讨一些例子，展示不同的数据收集方法（包括使用真实数据和合成数据）如何在各个行业中得以应用。\n\n### 获取真实世界数据\n\
  \n让我们探索一些获取真实世界数据的实际例子，以理解如何利用这些数据进行分析并为决策提供信息。\n\n#### 零售销售预测\n\n场景：一家零售连锁企业旨在改进库存管理和销售预测。\n\
  \n数据收集方法：该公司收集历史销售数据、客户交易记录以及经济指标和天气模式等外部因素。\n\n成果：通过分析这些数据，零售商可以预测未来的销售趋势，优化库存水平，并更有效地规划营销活动。\n\
  \n## 金融欺诈检测\n\n场景：一家银行希望增强其欺诈检测系统以保护客户。\n\n数据收集方法：实时收集包含用户行为、位置和交易记录在内的交易数据。\n\n\
  成果：通过分析数据中的模式，银行可以识别异常、检测潜在欺诈，并加强安全措施，以在未来保障客户账户的安全。\n\n## 供应链优化\n\n场景：一家制造公司希望优化其供应链，使其更具效率和成本效益。\n\
  \n数据收集方法：从供应商、生产线和分销网络收集数据。\n\n成果：通过分析数据，公司可以识别任何瓶颈，缩短接到订单后的交付时间，并提升整体供应链绩效。\n\n\
  \n\n### 获取合成数据\n\n我们来探讨一些生成合成数据以补充和增强真实世界数据集的实践案例。\n\n#### 在医疗领域保护隐私\n\n**场景**：研究人员需要在确保患者隐私的前提下共享医疗数据以进行合作研究。\n\
  \n**使用合成数据的理由**：不共享真实的患者记录，而是生成合成数据来模拟逼真的患者数据，以保护个人隐私。\n\n**结果**：研究人员可以在合作分析中使用合成数据，同时维护患者的机密性并遵守隐私法规。\n\
  \n#### 图像识别\n\n**场景**：一家公司正在开发图像识别模型，但缺乏足够多样化的数据集。\n\n**使用合成数据的理由**：为了增强他们现有的真实数据集，生成合成图像以模拟光照条件、角度和背景的变化。\n\
  \n**结果**：在真实数据与合成数据组合上训练的模型表现出更优的性能，并且对未见过的全新场景具有更好的泛化能力。\n\n## 伦理与责任\n\n在本章中，我向你展示了获取数据的各种方法。然而，以合乎伦理且负责任的方式获取数据至关重要。你应当始终遵守数据保护法规，考虑所有隐私问题，并在可能时获得用户同意。以下是需要注意的几项法律。\n\
  \n### CCPA：加州消费者隐私法案\n\nCCPA 是一项法律，允许加州任何居民查看公司所保存的关于他们的所有信息。居民还可以看到与哪些第三方共享了他们的数据清单。如果隐私准则遭到违反，该法律还允许居民起诉公司，即使公司尚未遭到黑客攻击。公司无需位于美国境内才会受到影响。年收入至少\
  \ 2500 万美元、拥有至少 5 万用户、或有一半销售额来自出售用户数据的公司均受此法律约束。\n\n### GDPR：通用数据保护条例\n\nGDPR 是一项法律，规定了如何处理和传输欧盟\
  \ (EU) 内个人的个人数据。在欧盟任何国家内收集或从这些国家传输的所有数据均受其影响。如果违反该法律，罚款非常高。你将需要支付 2000 万欧元或全球年收入\
  \ 4% 两者中的较高者。\n\n### HIPAA：健康保险流通与责任法案\n\nHIPAA 是一项联邦法律，旨在保护敏感的健康信息，防止其在未经同意或不知情的情况下被披露。这涵盖了任何形式或媒介中的所有可识别个人身份的健康信息。\n\
  \n## 使用数据集卡片增强透明度与理解\n\n数据集卡片（也称为数据卡片）是记录和了解数据集特征的重要工具。它们提供了一种结构化格式来捕捉数据集的关键信息，使人们更容易评估其对于各种用例的适用性。数据集卡片是一份简洁的摘要，提供关于数据集的详细信息，包括其能力、局限性和预期用途。它通常包括但不限于以下关键部分：\n\
  \n*   **摘要**：对数据集、其目的以及其支持的任务（例如，摘要等）的简要概述。\n*   **语言**：数据集中所包含语言的信息（例如，英语、法语等）。\n\
  *   **结构**：关于数据如何结构化概述，包括数据字段的示例和描述。\n*   **创建**：关于数据集如何被整理和收集的信息。\n*   **源数据**：关于原始数据来源的详细信息，包括收集方法和来源。\n\
  *   **注意事项**：使用数据的伦理和社会影响、偏差、已知局限性以及潜在风险。\n\n### 为什么数据集卡片很重要？\n\n数据集卡片通过提供清晰的文档来增强透明度，帮助人们理解他们正在处理的数据。通过包含数据集卡片，你可以确保数据被恰当使用，并节省人们大量理解如何使用数据的时间。数据集卡片对于任何参与数据分析、数据科学和机器学习的人都很有价值。它提供了一种标准化方式来传达重要信息。我鼓励大家在共享数据时创建数据集卡片。像\
  \ Hugging Face 和 Kaggle 这样的网站通常都包含此类文档。\n\n## 结论\n\n总而言之，显而易见，数据是数据分析、数据科学和人工智能的基础支柱。我们探讨了多种多样的数据类型以及各种获取方法，从网络抓取、访问公共数据集、利用\
  \ API 的力量，到创建你自己的数据。\n\n理解数据、其类型以及如何获取数据，构成了你旅程中至关重要的第一步。你在本章中获得的知识和技能为你进一步探索数据分析、数据科学和人工智能世界的激动人心的冒险奠定了基础。\n\
  \n我们强调了伦理考量的重要性，这提醒我们，负责任的数据收集和使用是不容商榷的。重要要记住，数据的格局是不断演变的，因此，在你的数据实践中保持好奇心、恪守伦理并勤勉不懈，将确保你始终处于这个充满活力领域的前沿。拥抱复杂性，庆祝数据的多样性，让你对发现的热情引导你穿越数据分析、数据科学和人工智能错综复杂的织锦。\n\
  \n当你进入下一章时，请带着你已获得的见解和理解，准备好在实际的真实世界场景中应用它们。数据的世界广阔无边，充满潜力——有了知识、好奇心以及强烈的伦理指南针，你现在已准备好自信地航行。\n\
  \n"
- "# 3. ETL 管道\n\n确保机器学习模型的能力依赖于提供高质量的培训数据。预测的准确性和有效性直接取决于模型训练阶段所使用的数据集的质量。一个构建良好且经过精心整理的数据集是机器学习算法识别模式、掌握复杂关系并理解细微信息的基础。因此，由此产生的模型能更好地做出与数据内在复杂性一致的预测。\n\
  \n此外，高质量数据的重要性并不仅限于初始训练阶段。随着机器学习的演进并遇到新数据，持续预测的可靠性和相关性内在地与准确且有代表性的数据的持续可用性相关。维护一个健壮的数据基础设施可确保机器学习模型能够适应并响应环境变化，产生反映最新见解和模式的预测。\n\
  \n本质上，机器学习模型与高质量数据之间的共生关系，凸显了数据质量在这些智能系统的效能、适应性和持续成功中所扮演的关键角色。\n\n\n\n## ETL 简介\n\
  \nETL（提取、转换和加载）是创建高效机器学习算法的基础。ETL 是一个三步数据集成过程（如图 3-1 所示），其中数据从一个或多个数据源提取，经过转换（清洗、整理、格式化），然后加载到数据库中。\n\
  \n![](img/613832_1_En_3_Fig1_HTML.jpg)\n\n图 3-1\n\nETL 管道的示意图\n\n市面上有多种具备友好用户界面的\
  \ ETL 工具可供选择，帮助你完成这些任务。不过，Python 也有许多开源 ETL 工具同样能胜任这些工作。其中，数据科学家社区中一个非常流行的工具是 `Pandas`。\n\
  \n在 ETL 的转换步骤中，探索性数据分析（EDA）和数据清洗是需要执行的重要任务，用于识别并移除诸如错误、损坏、重复或不一致的数据。\n\n### ETL\
  \ 的重要性\n\nETL 过程在确保数据（通常来自各种不同且不相关的源头）被统一成一致结构方面发挥着关键作用。随着企业从不同渠道、系统和应用积累信息，这些数据可能以不同的格式和结构存在。ETL\
  \ 是一座桥梁，它将这种异构数据标准化，解决不一致性，并将其转换为标准格式。通过实施一致的结构，公司可以消除因不同数据源而产生的冗余、错误和差异。这种标准化不仅促进了无缝集成，还提高了整个组织内信息的可访问性。\n\
  \n此外，ETL 通过将来自不同部门或系统的信息整合到集中的数据仓库或数据库中，帮助企业打破数据孤岛。这种整合简化了数据检索和分析，提供了组织运营的全面统一视图。因此，不同部门的团队都依赖一个单一、可靠的信息源，从而促进协作并实现更高效的决策流程。\n\
  \n通过 ETL 过程获得的标准化和集中化数据，构成了数据驱动决策的基础。借助格式一致的整合数据集，企业能够提取有意义的见解、识别趋势并获得可操作的智能。这种新获得的清晰度使利益相关者能够依据准确、最新的信息做出明智的决策。从战略规划到运营调整，公司都能基于对数据的更深理解来调整其行动，从而培养一种基于证据决策的文化。\n\
  \n此外，ETL 便于进行历史数据追踪，使公司能够监控和评估其随时间推移的绩效。通过分析历史趋势和模式，企业可以识别需要改进的领域，评估战略举措的影响，并优化其运营。数据提取、转换和加载的持续循环不仅支持日常决策，也为长期业务优化奠定了基础，确保在不断变化的商业环境中保持适应性。本质上，ETL\
  \ 使组织不仅能够理解其当前状态，还能在数据驱动的未来中发展和繁荣。以下是 ETL 带来的一些关键价值的总结：\n\n*   **单一视角**\n\n在当今的商业环境中，数据通常分散在各个系统和应用中，因此要全面了解你的业务是一项挑战。认识到\
  \ ETL 在数据集成中的重要性，可以使你利用 ETL，促进来自不同来源数据的整合和分析，从而对你的业务获得更全面的视图。\n\n*   **流程自动化**\n\
  \nETL 简化了重复性的数据处理任务，以提高分析效率。ETL 工具能够自动化数据迁移，并集成定期或按需的数据更新。这使得数据工程师能够将更少的时间花在数据移动和转换等日常任务上。\n\
  \n*   **数据治理**\n\n数据治理关注数据的有效性、可访问性、一致性、完整性和安全性。ETL 通过在源系统和目标系统之间引入一个抽象层，从而在支持数据治理方面发挥作用，进而维护数据的安全性和血统。数据治理的重要性日益凸显，因为它促进了数据民主，提高了数据可访问性，并使所有利益相关者都能将其用于业务分析。\n\
  \n*   **可扩展性**\n\n随着数据量和数据复杂性的增加，ETL 在数据集成中的重要性对于旨在保持竞争力的公司变得越来越关键。能够扩展 ETL 管道可确保海量数据的顺利提取、转换和加载。因此，公司能够有效处理不断增长的数据流入，而无需频繁升级系统，确保数据及时可用于分析和报告，并维持系统的功能性。可扩展性可以通过多种方法实现，包括分布式处理、并行处理、数据分区以及利用云解决方案。\n\
  \n*   **快速检索**\n\n作为业务用户，高效地检索大量集成且精炼的数据，以支持决策制定。由于 ETL 工具在数据转换过程中处理了大部分工作，导入的数据在进入数据存储时已经是可用的格式。凭借清晰定义的视图，你的商业智能应用可以更快速地生成报告，因为在查询数据库时无需处理复杂的合并、连接记录或维护格式化标准问题。\n\
  \n*   **最大限度减少人为错误**\n\n尽管付出努力，但手动管理数据会让你面临错误风险。数据处理早期阶段的一个小疏忽可能会导致重大后果。这是因为一个错误可能引发一连串更大的错误，形成恶性循环。认识到\
  \ ETL 解决方案的重要性后，许多组织已采用自动化来减少人工干预及相关的错误风险，确保提供高质量的数据。\n\n*   **提升质量与统一性**\n\nETL\
  \ 利用数据清洗和转换技术，帮助检测并纠正错误、不一致性及其他数据问题。这提升了决策所需的数据质量、可靠性、准确性和可信赖度。\n\n\n\n## ETL 工具与技术\n\
  \n多年来，受数据源日益增长的复杂性和多样性，以及对高效数据集成解决方案日益增长的需求驱动，ETL 领域经历了一场显著的演进。最初，ETL 流程通常是定制编码的，这需要大量的开发工作和专业知识。然而，随着对更具可扩展性、用户友好性和适应性的解决方案的需求出现，各种专门的\
  \ ETL 工具进入了市场。\n\n这些工具的功能差异很大，可满足不同的业务需求和技术要求。企业级 ETL 解决方案提供全面的特性和强大的支持，使其适用于大规模数据集成项目。这些工具通常具备高级功能，如数据质量管理和实时数据集成，以应对现代数据环境所带来的复杂挑战。\n\
  \n与此同时，开源 ETL 工具的兴起使数据集成领域更加大众化，提供了成本效益高的替代方案，并拥有强大的社区驱动开发模式。像 `Apache Kafka` 和\
  \ `Keboola` 这样的工具，体现了开源解决方案所带来的灵活性和定制可能性。这些工具不仅提供强大的 ETL 能力，还鼓励社区内的协作与创新。\n\n此外，对定制化解决方案的需求催生了自定义\
  \ ETL 解决方案的开发，企业构建内部工具以精确满足其独特需求。当企业拥有现成工具无法轻易解决的特定数据集成需求或工作流时，这种方法尤其常见。虽然自定义解决方案提供了高度的定制性，但它们也需要持续的维护，并且可能缺少商业\
  \ ETL 工具中一些开箱即用的特性。\n\n本质上，当今可用的各种 ETL 工具反映了数据集成领域的动态特性。无论企业选择企业级解决方案以获得全面支持，利用开源工具的协作力量，还是为专门需求开发自定义解决方案，不断演进的\
  \ ETL 工具生态系统都在帮助企业释放其数据的未来潜力方面持续发挥着关键作用。\n\n### 企业级 ETL 软件\n\n在广阔的数据集成领域，许多公司提供商业\
  \ ETL 软件，这些软件以其用户友好的图形用户界面而著称。这些 GUI 旨在简化设计和执行 ETL 管道的复杂性，提供直观的拖放界面，从而无需繁琐的编码。\n\
  \n这种可视化方法不仅使 ETL 流程大众化，让更广泛的专业人员能够积极参与，而且还增强了对整个工作流的理解。带有 GUI 的商业 ETL 工具通常配备预构建的连接器和转换，加速了管道开发，并便于快速适应不断变化的数据需求。\n\
  \n凭借诸如调度和监控等功能，这些工具简化了数据集成，有助于组织在管理多样且复杂的数据生态系统时提高整体效率。以下是企业级 ETL 解决方案的示例：\n- `Informatica\
  \ PowerCenter`\n- `IBM InfoSphere DataStage`\n- `Oracle Data Integrator`\n\n## 开源\
  \ ETL\n\n商业 ETL 软件通常价格不菲，对于寻求高级数据集成能力的组织来说是一项可观的投资。然而，相比之下，开源工具提供了成本效益高的替代方案，因为它们可以免费使用。这种可及性使得\
  \ ETL 能力的运用更加大众化，使得预算有限的企业也能受益于强大的数据集成工具。开源 ETL 工具的一个关键优势在于其固有的灵活性。具备编程专业知识的用户可以深入源代码，根据特定需求进行定制和调整。这种适应性对于具有独特数据处理需求的组织尤其有利，因为它使他们能够根据其数据环境的复杂性来微调\
  \ ETL 流程。源代码的开放性促进了协作社区的形成，鼓励知识共享和创新，用户可以为工具特性和功能的增强做出贡献。总的来说，开源 ETL 工具的可用性和适应性不仅减轻了财务限制，还使用户能够更好地控制其数据集成工作流的定制和优化。以下是开源\
  \ ETL 解决方案的示例：\n- `Keboola`\n- `Talend Open Studio for Data Integration`\n- `Apache\
  \ Kafka`\n\n## 自定义 ETL\n\n对于那些在其数据集成流程中寻求无与伦比的灵活性的人来说，创建专门满足特定需求的自定义 ETL 工具的想法变得颇具吸引力。利用像\
  \ `Python` 这样的编程语言，个人和组织可以着手创建与自身独特需求精确契合的定制解决方案。这种方法虽然提供了最大的适应性，但需要投入大量的精力。构建一个自定义\
  \ ETL 工具不仅包括初始编码，还包括创建全面的文档，以确保未来的用户和开发人员能够清晰理解并使用。责任并不止于初始开发；持续的维护对于应对不断变化的数据环境和需求至关重要。严格的测试对于保证工具的可靠性、可扩展性和性能变得不可或缺。尽管需要付出努力，但创建自定义\
  \ ETL 工具提供了无与伦比的控制和定制水平，允许以与组织数据生态系统的目标和复杂性精确一致的方式进行无缝数据集成。以下是可以用来创建自定义 ETL 解决方案的编程语言示例：\n\
  - `SQL`\n- `Spark`\n- `Python`\n\n### ETL 云服务工具\n\n云服务（如 `Amazon Web Services (AWS)`、`Azure`\
  \ 或 `Google Cloud Platform (GCP)`）内的数据，都附带了这些平台原生内置的强大且集成的 ETL 工具。这些基于云的 ETL 解决方案提供了在云环境中处理数据工作流的无缝且全面的方法。例如，在\
  \ `AWS` 中，像 `AWS Glue` 这样的服务使用户能够高效地提取、转换和加载数据，不仅提供了可扩展的无服务器架构，还提供了自动化的数据发现和模式演化。`Azure`\
  \ 的 ETL 产品，包括 `Azure Data Factory`，简化了跨各种服务的数据移动，为分析、报告和机器学习等不同场景创建数据管道提供了便利。类似地，`GCP`\
  \ 提供了像 `Cloud Dataflow` 这样的工具，提供了使用 `Apache Beam` 进行 ETL 处理的完全托管服务，支持并行数据处理扩展。利用这些云服务内部的集成\
  \ ETL 工具，可以简化数据工作流的编排，优化性能，并利用云计算环境固有的弹性可扩展性，最终促成更高效、更精简的数据管理流程。以下是云 ETL 解决方案的示例：\n\
  - `AWS Glue`\n- `Azure Data Factory`\n- `Google Cloud Dataflow`\n\n### 带代码的示例\n\n\
  下面的示例将使用 `Python` 完成。要跟着操作，你可以使用像 `Jupyter Notebooks`、`Google Colab`，甚至 `Visual\
  \ Studio Code` 这样的软件应用程序，它们都是免费的。\n\n`Pyjanitor` 是一个用于清理数据集的 `Python` 开源工具。这个工具的优势在于它为常见的\
  \ `Pandas` 程序提供了一个更易读、基于动词的方法链 API。这有助于使编写代码更清晰、更容易记忆。\n\n#### 安装\n\n通过运行以下命令安装\
  \ `pyjanitor`：\n\n```\n!pip3 install pyjanitor==0.28.1\n!pip3 install pandas==2.2.2\n\
  ```\n\n#### 实现\n\n1. 导入所需库。\n\n我们将导入 `pandas` 来提取数据并帮助进行数据分析。`Pyjanitor` 用于清理数据。\n\
  \n```\nimport pandas as pd\nimport janitor\n```\n\n2. 提取。\n\n在此示例中，目标是为电影推荐系统的机器学习模型提供高质量数据，以便它能预测给用户的相关推荐。可以使用多种类型的信息。然而，为了简化此示例，我们将仅使用包含我们系统中现有用户对电影评分的数据。这些数据位于一个名为\
  \ `ratings.csv` 的 CSV 文件中。\n\n我们将从 CSV 文件中提取数据，并将其放入一个 `pandas` `DataFrame` 中，以便使用\
  \ `pyjanitor` 开始转换过程。\n\n```\nrating_data = pd.read_csv(\"ratings.csv\", skipinitialspace\
  \ = True, header = None)\n```\n\n我们的初始数据包含来自用户在不同时间对不同电影的 14,051,752 条评分，如图 [3-2]\
  \ 所示。\n\n![](img/613832_1_En_3_Fig2_HTML.jpg)\n\n图 3-2\n\n初始电影评分图像\n\n```\nrating_data\n\
  ```\n\n3. 转换。\n\n现在让我们对数据进行一些分析和清理。\n\n首先，我们将使用 `pyjanitor` 的 `rename_column` 函数更改列名，使其更易于阅读。`Pyjanitor.rename_column()`\
  \ 一次只能更改一列，因此我们将使用方法链来更改所有四列。\n\n```\nrating_data = (rating_data\n.rename_column(0,\
  \ 'date/time')\n.rename_column(1, 'user_id')\n.rename_column(2, 'movie_id')\n.rename_column(3,\
  \ 'rating'))\n```\n\n我们预期评分是 1 到 5 之间的整数。然而，通过初步分析，我们发现数据中有 28 个唯一的评分值，如图 [3-3]\
  \ 中最后一列的第二行所示。\n\n![](img/613832_1_En_3_Fig3_HTML.jpg)\n\n图 3-3\n\n数据列摘要图像\n\n```\n\
  rating_data.describe()\n`\n\n进一步分析显示，文件中混合了字符串和整数，如图 [3-4] 所示。例如，`5` 既作为数字输入，也作为文本输入。此文件中明显存在一些损坏数据，应予以删除。\n\
  \n! [](images/613832_1_En_3_Chapter/613832_1_En_3_Fig4_HTML.jpg)\n\n图 3-4\n\n唯一评分值图像\n\
  \n```\nrating_data[\"rating\"].unique()\n```\n\n在图 [3-5] 中，我们看到不同评分值出现的次数。评分为 `E`\
  \ 的出现了 332 次。\n\n![](img/613832_1_En_3_Fig5_HTML.jpg)\n\n图 3-5\n\n数据中评分出现次数图像\n\n\
  进一步分析显示，`user_id` 列混合了整数和文本，如图 [3-7] 所示。我们预期 `user_id` 仅为整数。我们还希望每条评分输入的日期和时间采用日期时间格式，而不是文本格式，如图\
  \ [3-6] 所示。\n\n![](img/613832_1_En_3_Fig6_HTML.jpg)\n\n图 3-6\n\n数据日期时间的摘要类型\n\n\
  ```\nrating_data[\"date/time\"].apply(type).value_counts()\n```\n\n![](img/613832_1_En_3_Fig7_HTML.jpg)\n\
  \n图 3-7\n\n用户 ID 数据摘要类型\n\n```\nrating_data[\"user_id\"].apply(type).value_counts()\n\
  ```\n\n![](img/613832_1_En_3_Fig8_HTML.jpg)\n\n图 3-8\n\n电影 ID 数据摘要类型\n\n```\nrating_data[\"\
  movie_id\"].apply(type).value_counts()\n```\n\n![](img/613832_1_En_3_Fig9_HTML.jpg)\n\
  \n图 3-9\n\n评分数据摘要类型\n\n```\nrating_data[\"rating\"].apply(type).value_counts()\n\
  ```\n\n`user_id` 和 `rating` 列需要转换为整数。我们可以使用 `pyjanitor.change_type()` 函数来实现。我们还将把日期和时间的格式从字符串更改为日期时间格式。任何无法转换的内容将变为\
  \ `NaN`，并会从文件中删除。\n\n所有这些步骤将使用方法链完成。\n\n```\nrating_data = (rating_data\n.change_type(\"\
  rating\", dtype=int, ignore_exception=\"fillna\")\n.change_type(\"user_id\", dtype=int,\
  \ ignore_exception=\"fillna\")\n.to_datetime(\"date/time\", format=\" ISO8601\"\
  , errors=\"coerce\")\n.dropna()\n.reset_index(drop = True))\n```\n\n让我们看看完成上述步骤后评分列中的值。像\
  \ `E`、`F`、`G` 和 `Q4` 这样的评分已从我们的数据中删除。像 `1` 这样的评分则增加了。最初我们有数字版本的 `1` 出现了 8195 次，文本版本出现了\
  \ 1312 次。现在只有一个版本，出现了 9507 次。这表明我们能够将文本转换为数字。任何不是数字的内容，如 `E` 或 `Q4`，都被删除了。\n\n让我们查看数据的前五行（图\
  \ [3-10]），看看其他列是如何重新格式化的。`Rating` 和 `user_id` 被转换为数字，`date/time` 被转换为日期时间格式。\n\n\
  ![](img/613832_1_En_3_Fig10_HTML.jpg)\n\n图 3-10\n\n电影推荐数据图像\n\n```\nrating_data.head(5)\n\
  ```\n\n你可能注意到 `user_id` 和 `rating` 现在是小数值（即浮点数），而不是整数。这是因为在前面的步骤中将文本转换成整数时，`NaN`值没有对应的整数版本，导致整个列的数据都变成了浮点数。这与\
  \ `pandas.to_numeric()` 函数的工作方式类似。要修复这两个列，我们可以再次使用 `change_type` 和方法链。\n\n```\n\
  rating_data = (rating_data\n.change_type(\"rating\", dtype=int, ignore_exception=\"\
  fillna\")\n.change_type(\"user_id\", dtype=int, ignore_exception=\"fillna\")\n.dropna()\n\
  .reset_index(drop = True))\n```\n\n现在，如果我们查看前五行（图 [3-11]），可以看到 `user_id` 和 `rating`\
  \ 列中的数据现在是整数格式。\n\n![](img/613832_1_En_3_Fig11_HTML.jpg)\n\n图 3-11\n\n电影推荐数据图像\n\
  \n```\nrating_data.head(5)\n```\n\n4. 加载。\n\n这会将转换后的数据导出到一个新的 `.csv` 文件中，该文件可用于机器学习算法。\n\
  \n```\nrating_data.to_csv(\"clean_rating_data.csv\")\n```\n\n\n\n### 案例研究与实际应用\n\
  \n## 零售分析\n\n场景：某零售公司希望分析销售数据，以优化库存并提升整体业务绩效。\n\nETL 流程：从多种来源（销售点系统、在线平台）提取销售数据，通过清洗和标准化格式进行转换，然后加载到集中式数据仓库中。\n\
  \n成果：公司现在能够执行高级分析，例如预测需求趋势、识别热销产品以及优化库存水平。\n\n#### 医疗数据整合\n\n场景：某医疗机构旨在通过整合电子健康记录（`EHR`）、化验结果和患者反馈数据来提升患者护理质量。\n\
  \nETL 流程：从不同系统提取数据，通过确保数据一致性和隐私合规性进行转换，然后加载到统一数据库中。\n\n成果：使医疗专业人员能够访问全面的患者病史，从而提升诊断准确性和个性化治疗方案。\n\
  \n## 社交媒体\n\n场景：某社交媒体分析公司希望分析舆情趋势，帮助企业了解客户对其产品或服务的看法。\n\nETL 流程：从社交媒体平台提取数据，通过应用自然语言处理（`NLP`）技术分析情感倾向进行转换，然后将结果加载到数据存储中以供报告使用。\n\
  \n成果：企业能够深入了解客户满意度，识别改进领域，并据此调整营销策略。\n\n## 金融交易欺诈检测\n\n场景：某金融机构希望实时检测欺诈活动，以保障交易安全并保护客户利益。\n\
  \nETL 流程：从多种渠道提取交易数据，通过应用异常检测算法进行转换，然后将标记的交易加载到欺诈监控系统中。\n\n成果：有助于防范欺诈交易，减少经济损失，并维护客户信任。\n\
  \n## 智能家居自动化\n\n场景：某物联网（IoT）领域的公司旨在创建一个智能家居平台，该平台能够学习用户行为并相应地调整家居自动化设置。\n\nETL 流程：从各种传感器和设备提取数据，通过识别使用模式进行转换，然后将洞察结果加载到中央系统中以控制家居设备自动化。\n\
  \n成果：用户可根据自身习惯体验个性化且自动化的家居环境，从而优化能源消耗并提升便利性。\n\n## 结论\n\n总之，数据的获取与管理是数据分析、数据科学和人工智能领域成功的关键基础。从探索各类数据源到利用\
  \ ETL 工具的强大功能，本章着重强调了制定稳健策略以获取真实世界数据和合成数据的重要性。无论是使用界面友好的商业 ETL 软件、利用开源工具实现经济高效的灵活性，还是涉足定制化\
  \ ETL 解决方案的领域，从业者都有多种选择来满足自身特定需求。此外，集成内置 ETL 工具的云服务进一步提升了数据工作流的效率。在我们应对不断变化的数据格局时，本章揭示了多样化的途径和可用的工具，使读者能够自信、富有创造力地以战略性的方式驾驭数据领域，迎接数据驱动事业所带来的独特挑战与机遇。\n\
  \n# 4. 探索性数据分析\n\n在上一章中，我们讨论了什么是 ETL 流水线、其重要性以及如何实现它。一旦我们将数据加载到目标位置，接下来该做什么呢？有时，数据量可能非常庞大，令人难以确定从何处着手或结束。起初，你可能很难看出这些数据如何帮助你的组织。想象一下，你从过去继承了一个装满众多日志的宝箱。每本日志里都记载着故事、神秘的符号和地图。当你翻阅这些宝藏时，你意识到解开箱中秘密的关键在于理解并连接那些你发现的隐藏模式。同样，探索性数据分析就像翻阅一个数据宝库——每个数据集都是一组数字、变量和观测值的集合。正如你会仔细检查日志以破译其内容，从而拼凑出原作者的故事脉络一样，探索性数据分析涉及揭开层层表象，以获取隐藏于表面之下的洞察、趋势和异常。\n\
  \n\n\n## 探索性数据分析简介\n\n在数据分析、数据科学和人工智能的广阔领域中，有一个关键步骤既像指南针又像放大镜——那就是探索性数据分析（`EDA`）。就如同经验丰富的探险家在勘测未知领域一般，`EDA`\
  \ 深入数据集，挖掘隐藏的洞察与理解的瑰宝。在本章中，我们将踏上一段穿越数据探索领域的旅程，理解其重要性和变革力量。\n\n探索性数据分析的本质在于其揭示数据褶皱中隐藏故事的能力。它是一种深入表面、仔细审视的艺术，旨在寻找潜伏其中的模式、异常和趋势。通过创建一个包含多样化统计分析技术、可视化工具和领域知识的工具箱，你能够为那些表面看似缺乏活力的数据集注入生机。你将把行与列转化为关于发现与启发的叙事。从消费者行为的奇特习性到金融市场的复杂动态，`EDA`\
  \ 充当着数据诉说真相的管道。\n\n此外，探索性数据分析不仅仅是通向更复杂分析的技术序曲，更是一段验证与发现的重要旅程。它是锻造假设、挑战假设、提炼洞察的熔炉。通过对数据质量和变量间关系的批判性观察，`EDA`\
  \ 提供了基于证据的基础，数据分析和数据科学以及人工智能的稳健工具正是在此之上构建的。从本质上讲，它是在不确定性的汹涌海洋中指引你的灯塔，照亮通往知识和理解的道路。\n\
  \n数据分布描述了数据点在一个数据集中的散布方式。这可以显著影响在 `EDA` 过程中所使用的方法。常见的分布包括但不限于：\n\n-   **正态分布**：正态分布也称为高斯分布，它是对称的，大多数数据聚集在均值附近。它形成一条钟形曲线，其中远离均值的值在数据中越来越罕见。在这种情况下，使用计算均值或标准差等标准技术来概括数据是有效的。\n\
  \n-   **偏态分布**：当数据不是对称分布时，它要么是右偏态，要么是左偏态。这种偏斜会影响如何选择汇总数据的方法。例如，在偏态分布中，均值可能具有误导性。因此，应使用中位数来更准确地代表中心值。直方图或箱线图等可视化方法可以突出显示这些模式。\n\
  \n-   **均匀分布**：在均匀分布中，每个结果出现的概率均等，因此在可视化时呈现矩形形状。传统技术可能不适用于这类数据，因为数据的任何单独区域都不占主导地位。\n\
  \n通过识别数据分布，你可以定制你的方法。那些对正态分布数据效果良好的技术可能不适用于偏态或均匀数据。\n\n### 探索性数据分析的重要性\n\n探索性数据分析之所以重要，有以下几个原因。下面，我将列出几个值得考虑的原因：\n\
  \n#### 1. 理解数据\n\n它有助于科学家和分析师理解一个或多个数据集的结构、内容和关系。`EDA` 通过揭示模式、趋势和潜在偏差，为进一步的分析奠定了基础。它指导着分析的方向和提出的问题，从而驱动可操作的见解。\n\
  \n`EDA` 的一个关键要素是理解相关系数，它衡量两个变量之间关系的强度和方向。例如，皮尔逊相关系数衡量两个变量遵循线性关系的紧密程度。当两个变量具有线性关系时，意味着随着一个变量的增加或减少，另一个变量会以恒定速率增减，在图形上形成一条直线。皮尔逊相关系数的取值范围为\
  \ -1 到 1，其中越接近 1 的值表示越强的正线性关系，越接近 -1 的值表示越强的负线性关系，而 0 表示没有关系。正关系是指当一个变量增加或减少时，另一个变量朝相同方向移动。负关系是指当一个变量增加或减少时，另一个变量朝相反方向移动。\n\
  \n并非变量间的所有关系都是线性的。在某些情况下，变量可能仍然彼此相对地朝一致的方向移动，但并非以恒定速率。这被称为单调关系。在单调关系中，随着一个变量增加，另一个变量可以增加或减少，但不一定以恒定速率。例如，关系可能是弯曲的。在处理单调关系时，皮尔逊相关系数可能无法准确捕捉到关联的强度，这时就可以使用斯皮尔曼等级相关系数。斯皮尔曼相关系数衡量的是关系的一致性，而非其严格的线性。\n\
  \n`EDA` 允许分析师验证统计模型和方法所依据的假设。通过检查数据分布、相关性和其他属性，科学家可以确保他们的分析是适当且值得信赖的。\n\n#### 2.\
  \ 数据质量评估\n\n评估数据质量使我们有机会发现任何额外的异常值、错误的数据条目、缺失值以及在 ETL 管道的转换部分可能遗漏的不一致性。这确保了所处理的数据对于分析和解释来说是可靠且准确的。\n\
  \n#### 3. 沟通与数据可视化\n\n这使得您能够清晰、简洁地向领导层和利益相关者传达数据信息。对复杂数据的可视化展示，使其对公众和领导层来说更易于接触和理解。\n\
  \n#### 4. 特征选择与工程\n\n在你完全理解你的数据之后，就更容易理解哪些数据对于下一步是必要的。在模型开发方面，并非所有模型都需要你的全部数据。你的数据越精简，你的模型就越能专注于分析那些你交给它解决的任务中真正重要的内容。即使作为人类，如果你只获得与问题相关的信息，而不是提供过多的信息，也更容易解决问题。\n\
  \n`EDA` 有助于识别用于预测建模和决策任务的相关特征或变量。它还通过对数据进行转换或组合来激发新特征的创建，从而增强模型的预测能力。\n\n`EDA` 主要有三种类型：\n\
