  \ `price`\n- `bedrooms`\n- `yr_built`\n- `floors`\n- `waterfront`\n- `sqft_living`\n\
  \n你可以使用其他变量，但可能需要清理数据并重新格式化才能使用它们。\n\n![](img/613832_1_En_4_Fig5_HTML.jpg)\n\n**图\
  \ 4-5** 显示房价数据集中几个变量之间关系的相关矩阵\n\n```\ncorrelation_matrix = housing_data[[\"price\"\
  ,\"bedrooms\",\"yr_built\",\"floors\",\"waterfront\",\"sqft_living\"]].corr()\n\
  sns.heatmap(correlation_matrix, annot=True)\nplt.show()\n```\n\n在这个相关矩阵中，接近 1 的变量具有强相关性，接近\
  \ 0 的变量具有弱相关性。在这里，我们可以在第一行看到，与其他变量相比，`price` 受 `sqft_living` 的影响最大。它受 `yr_built`\
  \ 的影响最小。这对某些人来说可能是一个令人惊讶的发现，因为人们可能会认为房屋的建造年份对购买意愿有更大的影响。`price` 与 `sqft_living`\
  \ 之间的相关关系为 0.42，而 `price` 与 `yr_built` 之间的相关关系为 0.027。\n\n## 为探索性数据分析选择合适的可视化方法\n\
  \n为在探索性数据分析期间有效解读数据，选择正确的可视化技术至关重要。不同的可视化方法突出显示数据的不同方面，使您更易于提取见解并发现模式。\n\n- **箱线图**：箱线图有助于理解数据集的分布。它们显示中位数、四分位数和潜在异常值。这在比较多个组或类别之间的分布时非常有用。\n\
  \n- **直方图**：直方图是可视化单个变量频率分布的理想选择，允许分析师快速查看数据的形态（例如，是正态分布还是偏斜分布）。\n\n- **热力图**：热力图可有效可视化多个变量之间的关系，特别是通过相关矩阵，如图\
  \ 4-5 所示。这种可视化类型使用颜色渐变来表示变量对之间相关性的强度，使得一眼便能轻易发现强或弱的相关性。\n\n- **散点图**：散点图通常用于检查两个数值变量之间的关系。它们通常有助于发现趋势、模式以及可能的线性或非线性关系。\n\
  \n- **条形图**：条形图是一种简单但功能强大的工具，用于比较不同类别。它们既适用于分类数据也适用于离散数据，允许分析师比较不同组别或时间段的数量。例如，条形图可以显示不同产品类别或地区的销售数据。\n\
  \n- **饼图**：当您想要表示整体的各部分比例时，饼图非常有用。饼图的每一部分代表一个类别占总量的贡献。然而，饼图在类别数量有限且类别之间差异显著时效果最佳；否则将难以解读。\n\
  \n- **折线图**：折线图通常用于追踪随时间的变化和趋势。它们在处理时间序列数据（如股票价格、天气模式或跨月销售业绩）时特别有效。折线图使可视化连续数据以及检测随时间上升和下降的趋势变得容易。\n\
  \n每种可视化都有不同的用途，选择合适的可视化取决于数据的性质以及所提出的问题。例如，箱线图是用于比较分布的理想工具，而热力图更适合于评估多个变量之间的相关性。条形图和饼图非常适用于比较分类数据，折线图则非常适合基于时间的趋势。通过选择合适的可视化方法，您可以更有效地探索数据并发现可操作的见解。\n\
  \n## 探索性数据分析在业务中的应用案例\n\n关于如何实施探索性数据分析的实际例子，为探索性数据分析如何在各个领域实际应用提供了宝贵的见解。以下是一些例子，用以说明探索性数据分析的重要性和有效性。\n\
  \n\n\n### 零售行业\n\n在零售行业，`EDA`可用于分析客户购买行为、优化产品布局和识别趋势。例如，像梅西百货这样的零售公司可以对销售数据进行`EDA`，以发现季节性模式、识别畅销产品，并根据购买习惯对客户进行细分。这些信息可以为库存管理策略和营销活动提供参考。\n\
  \n*   **步骤 1：收集数据**\n    像梅西百货这样的零售公司会收集销售交易数据，包括客户人口统计信息、产品购买情况、交易日期和总销售金额。\n*\
  \   **步骤 2：数据清洗**\n    你可以通过处理缺失值、删除重复条目以及确保产品名称和客户人口统计信息等数据的一致性来清洗数据。\n*   **步骤\
  \ 3：探索**\n    你可以创建描述性统计和可视化图表（如条形图）来了解各产品类别的销售分布，并使用直方图来探索跨季节的购买频率。\n    通过时间序列分析和折线图，你可以识别销售中的季节性模式（例如，假期季节的销售高峰）。你还可以使用箱线图来分析按地区或客户年龄组划分的销售数据变化。\n\
  \    聚类技术可用于根据购买行为对客户进行分组。可以使用散点图和热力图来可视化人口统计信息（例如年龄、收入）与购买频率之间的关系。\n*   **步骤 4：可操作洞察**\n\
  \    基于这些洞察，梅西百货可以优化旺季时高需求产品的库存，并为不同的客户群创建有针对性的营销活动。\n\n### 医疗保健\n\n`EDA`在分析患者数据、识别风险因素和改善患者预后的过程中可以发挥关键作用。例如，一家医院可以对电子健康记录进行`EDA`，以识别患者人口统计信息、病史和治疗结果之间的相关性。这种分析可以帮助医疗保健提供者为个体患者量身定制治疗和干预措施。他们还可以利用`EDA`来分析每年入院患者数量。这种分析有助于医院了解全年所需的员工配置。\n\
  \n*   **步骤 1：收集数据**\n    医院收集患者数据，包括人口统计信息（例如年龄、性别）、病史、诊断和治疗结果。\n*   **步骤 2：数据清洗**\n\
  \    医院通过删除重复项并适当填充缺失值来确保数据的准确性。\n*   **步骤 3：探索**\n    分析人员使用相关矩阵和热力图来检查各种患者人口统计信息与治疗结果之间的关系，从而识别出哪些因素（例如年龄、既往病史）与恢复时间强相关。\n\
  \    可以使用散点图和箱线图来探索不同风险因素（例如高血压、吸烟）在不同治疗结果的患者中的分布情况，揭示哪些群体面临更高风险。\n    医院还可以使用折线图和直方图分析每年的入院率，以预测全年的人员配置需求和资源分配。\n\
  *   **步骤 4：可操作洞察**\n    医院可以利用这些分析的部分结果为患者风险状况定制治疗计划。例如，具有某些风险因素的患者可能会接受更广泛的监测或预防性护理。\n\
  \n### 金融\n\n在金融行业，`EDA`可用于风险管理、欺诈检测和投资分析。投资公司可以对金融市场数据进行`EDA`，以识别可能影响投资决策的趋势、相关性和异常情况。同样，银行可以使用`EDA`技术来检测可疑交易并防止欺诈活动。\n\
  \n*   **步骤 1：收集数据**\n    银行收集交易数据，包括交易金额、账户详情、地点和时间戳。\n*   **步骤 2：数据清洗**\n    通过去除任何不一致之处来清洗数据。\n\
  *   **步骤 3：探索**\n    使用箱线图和散点图，你可以查找交易金额或频率中的异常值。活动异常激增或地理位置相距遥远的交易可能预示着欺诈。\n  \
  \  热力图用于分析交易特征（如交易频率和地点）之间的相关性，以检测偏离常规的可疑模式。\n*   **步骤 4：可操作洞察**\n    银行可以将异常情况标记出来以进行进一步调查，并使用基于`EDA`洞察训练的机器学习模型来协助实时自动化欺诈检测。\n\
  \n### 制造业\n\n在制造业中，`EDA`可用于优化生产流程、改进质量控制和减少停机时间。例如，一家制造公司可以分析来自生产设备的传感器数据，以识别导致机器故障或缺陷的因素。这种分析有助于确定维护任务的优先级、最大限度地减少生产中断并提高整体效率。\n\
  \n*   **步骤 1：收集数据**\n    制造公司收集机器的传感器数据，包括温度、振动水平和速度。\n*   **步骤 2：数据清洗**\n    你清洗数据，确保各台机器之间的时间戳和传感器数据是对齐的。\n\
  *   **步骤 3：探索**\n    使用折线图，你可以追踪一段时间内的性能表现，以识别机器性能何时以及为何偏离常态（例如，在发生故障前温度逐渐升高）。\n\
  \    使用散点图和热力图来寻找机器故障事件与特定传感器读数之间的相关性。此分析可能揭示，超过某个温度阈值的机器更有可能发生故障。\n*   **步骤 4：可操作洞察**\n\
  \    基于这些发现，公司可以实施预测性维护计划，在机器发生故障前维修或更换部件，从而最大限度地减少停机时间并提高生产效率。\n\n## 结论\n\n总之，`EDA`是数据分析、数据科学和人工智能中的一个重要步骤。它有助于揭示数据集中的模式、趋势和关系。`EDA`涉及多种技术，包括数据可视化和统计分析，这些技术共同使你能更深入地理解数据。诸如`Python`、`R`和`Power\
  \ BI`之类的工具提供了有效执行`EDA`所需的功能。这为更复杂的可视化和预测性分析奠定了基础。\n\n通过利用`EDA`，我们可以识别异常并理解变量之间的相关性。在此阶段获得的洞察对于做出明智的决策、完善假设以及确保后续分析的准确性和相关性来说是无价的。\n\
  \n通过`EDA`，数据揭示了一个故事。这引导分析师、科学家、工程师和利益相关者走向有意义且可操作的洞察，这些洞察推动了更好的商业决策、科学发现以及跨领域的创新解决方案。随着我们向前发展，拥抱`EDA`的原则和实践将继续对于释放数据的全部潜力至关重要。接下来，我们将讨论机器学习模型。\n\
  \n\n\n# 5. 机器学习模型\n\n人工智能（AI）旨在让计算机系统足够智能，以完成通常需要人类思考的任务，例如理解语音、做出决策和识别模式。AI 是一个总称，涵盖了机器学习、自然语言处理等不同技术。\n\
  \n![](img/613832_1_En_5_Fig1_HTML.jpg)\n\n图 5-1\n\n图片来源于 LinkedIn Pulse 上的博客文章《“AI-ML-DML-GEN\
  \ AI - 根据价格排序”》，展示了人工智能（AI）、机器学习（ML）、深度学习（DL）和大语言模型（LLM）之间的层级关系（[人工智能、机器学习与深度学习关系图]，2024\
  \ 年 4 月 23 日）\n\n本章我们将聚焦于机器学习。机器学习模型是人工智能领域的关键组成部分。这些模型使系统能够从数据中学习、识别模式，并在最少人工干预的情况下做出决策。它们通过提供前所未有的自动化和预测能力，彻底改变了各个行业。自动化复杂流程并从海量数据集中获取可操作洞察的能力，已经革新了从医疗、金融到零售和交通等众多领域。\n\
  \n机器学习与数据分析和数据科学领域紧密相连，后两者的重点是收集、处理和分析数据，如前面章节所述。数据科学提供了从原始数据中提取有意义洞察的工具和技术，而机器学习则利用这些洞察进行预测并推动决策制定。在分析大型数据集、识别趋势以及确保我们在训练阶段拥有模型将在现实世界中遇到的代表性数据时，数据分析的作用尤为明显。这有助于创建不仅能进行预测，还能理解数据内部复杂关系的模型。\n\
  \n从这个意义上说，数据科学、数据分析和机器学习是相辅相成的：数据分析和数据科学帮助我们理解和解读数据，而机器学习则通过进行预测和自动化决策，帮助我们基于数据采取行动。\n\
  \n确保机器学习模型的高效性取决于训练数据的质量。一个构建良好且经过精心整理的数据集，是机器学习算法识别模式、把握复杂关系以及理解细微信息的基石。因此，由此产生的模型能更好地做出与数据内在复杂性相符的预测。\n\
  \n## 机器学习模型简介\n\n机器学习模型是现代数据科学的基石。它们通过使组件能够从数据中学习，并在无需显式编程的情况下做出决策或预测，推动了众多行业的进步。这些模型能够随着经验的增加自动提升性能，使其成为解决复杂问题的强大工具。\n\
  \n在继续之前，让我解释一下机器学习模型与算法之间的区别。机器学习算法和模型这两个术语常被错误地互换使用，这可能会让初学者感到困惑。\n\n算法是为完成某项任务而设计的一系列步骤。在机器学习中，算法是在数据集上运行以识别模式和规则的程序。可以把算法看作过程，而模型则是这个过程所产生的最终产物。模型利用算法从数据集中学习。换句话说，模型是对数据集进行拟合。所有这些过程的输出就是一个捕捉了这些模式的机器学习模型。你可以将模型视为一个应用程序或程序，你可以用它输入数据来进行预测或做出决策。算法是实现模型学习的关键，但一旦学习完成，模型就独立存在，成为对新的、未见过的数据进行未来预测或决策的工具。\n\
  \n这些模型生成的预测有助于你为业务做出数据驱动的决策。\n\n`机器学习模型 = 数据 + 算法`\n\n其核心在于，机器学习涉及使用算法在数据集上训练模型，以识别数据中的模式和关系。这个过程使模型在面对新的、未见过的数据时，能够做出预测或决策。根据模型训练的好坏程度，模型会以一定的准确度和置信度进行预测。机器学习算法有多种类型，每种类型适用于不同类型的任务：\n\
  \n## 监督学习\n\n机器学习模型使用带标签的数据进行训练。这意味着数据被标记了正确答案。可以把这种情况想象成模型在有老师指导的情况下学习。数据包含输入和正确的输出，以帮助模型更快地学习。\n\
  \n假设你想训练一个机器学习模型来预测一辆二手兰博基尼的价值。\n\n你会有一个数据集，其中包含已知的输入和输出值，用于训练模型。例如，数据可能包括：\n\n\
  - 里程数\n- 车型（例如轿车、SUV 等）\n- 颜色\n- 燃料类型（例如柴油、混合动力、电动、汽油）\n- 价格\n\n模型的输入将是里程数、车型、颜色和燃料类型，而输出将是价格。\n\
  \n一旦模型对数据集进行了拟合，或者说从这个数据集中学习完毕，就会输出一个使用监督算法训练好的机器学习模型。你可以向这个模型提供它从未见过的新数据，并获得关于汽车价格的预测。监督学习算法有多种类型。\n\
  \n#### 监督学习算法的类型\n\n**回归**\n\n回归算法预测连续变量，例如价格或温度。\n\n用于回归的监督学习算法示例：\n- `线性回归`\n\
  - `随机森林回归`\n- `决策树回归`\n- `支持向量回归`\n\n**分类**\n\n分类算法预测离散变量，例如：\n- 是或否\n- 0 和 1\n\
  - 红色、紫色、蓝色\n- 真或假\n\n预测结果被归类到一组不同的选项中。\n\n用于分类的监督学习算法示例：\n- `支持向量分类`\n- `K-近邻算法\
  \ (KNN)`\n- `逻辑回归`\n- `决策树分类`\n- `随机森林分类`\n\n#### 监督学习的应用场景\n\n- 时间序列市场分析\n- 客户分析\n\
  - 人力资源分配\n\n## 无监督学习\n\n\n\n### 机器学习算法\n\n机器学习算法接收未标记的数据集，在不事先了解数据的情况下，寻找信息中的相似性和差异性。例如，如果你正在查看一个二手兰博基尼的数据集，算法可以根据车型或颜色等相似性自动对汽车进行分组。这样，就能识别出数据中的聚类，例如将相同车型的汽车归为一组。\n\
  \n## 无监督学习算法的类型\n\n### 聚类\n\n聚类算法通过在你的数据集中寻找模式来对数据进行分组。相似度最高的项目将被归入同一组。\n\n####\
  \ 一些使用聚类的无监督学习算法\n\n- `高斯混合模型`\n- `K 均值`\n- `孤立森林`\n\n### 关联规则\n\n该算法找出数据集中数据点之间的关系。它能找到经常同时出现的项目集合。例如，买花的人往往也会买巧克力。\n\
  \n#### 一些使用关联规则的无监督学习算法\n\n- `Apriori`\n- `Eclat`\n\n### 无监督学习的一些用例\n\n- 确定客户画像\n\
  - 异常检测\n- 对象识别\n\n## 半监督学习\n\n机器学习算法接收包含标记和未标记数据混合的数据集作为输入。通常，标记数据量很小，而未标记数据量很大。\n\
  \n#### 工作原理\n\n1.  使用标记数据训练模型。\n2.  使用步骤 1 中部分训练的模型，对未标记数据进行训练以预测输出，这些输出被视为伪标签，因为它们可能不准确。\n\
  3.  将标记数据模型的预测输出与未标记数据模型的预测输出关联起来。\n4.  将标记训练数据的数据输入与未标记训练数据的数据输入关联起来。\n5.  再次训练模型以获得更准确的预测。\n\
  \n### 半监督学习的一些用例\n\n- 在搜索结果中标记和排列网页\n- 图像和音频分析\n\n## 强化学习\n\n机器学习算法被训练用于做出系列决策。其中存在一个主体（算法），以及伴随许多障碍的奖励。与有监督和无监督学习不同，强化学习没有预先提供的外部训练数据集。主体通过采取行动生成自己的训练数据。它通过试错来学习解决问题。主体会根据其做出的决定获得奖励或惩罚。目标是最大化奖励的数量。\n\
  \n### 强化学习的一些用例\n\n- 视频游戏\n- 自动驾驶汽车\n- 定制化训练系统\n\n## 深度学习模型\n\n深度学习是机器学习的一个子集。它专注于具有多个层（因此称为“深度”）的神经网络，这些网络试图模仿人脑的结构和功能。这些层由相互连接的节点（也称为神经元）组成，这些节点协同工作以处理信息并做出决策。\n\
  \n`神经网络`：一种人工智能技术，通过模仿人脑的结构和功能使计算机能够处理数据。这种被称为深度学习的机器学习方法，涉及多层相互连接的节点或神经元，类似于大脑的神经通路。它形成了一个自适应系统，使计算机能够从错误中学习并随时间不断改进。\n\
  \n深度学习模型有很多层。最基本的神经网络有三个层。一个简单的神经网络如图 5-2 所示。\n\n![](img/613832_1_En_5_Fig2_HTML.jpg)\n\
  \n**图 5-2** 简单的神经网络可视化表示\n\n1.  输入层：接收数据的第一层\n2.  隐藏层：处理来自输入层输入的中间层\n3.  输出层：产生预测或决策的最终层\n\
  \n深度学习网络具有多个隐藏层，其中多个节点相互连接，如图 5-3 所示。\n\n![](img/613832_1_En_5_Fig3_HTML.jpg)\n\n\
  **图 5-3** 深度神经网络的可视化表示\n\n与传统的机器学习方法（需要数据科学家选择和创建帮助模型从数据中学习的重要特征）不同，深度学习方法可以自动独立地找出这些重要特征。它直接从原始数据中发现模式和细节，无需额外帮助。这使得它们非常擅长理解复杂信息。然而，如果你对当前的任务和数据具备一些领域知识，事先进行一些初步的特征选择和工程处理，以让模型“轻松一点”，也并无坏处！深度学习模型还需要更多的计算能力和更多的数据来进行训练。\n\
  \n\n\n### 关键概念与术语\n\n- **前馈（Feed Forward）**：前馈神经网络是一种基础类型的神经网络，其特点是信息流方向单一。数据仅朝一个方向传输，从输入节点经过隐藏节点，最终到达输出节点。每个节点处理输入信息后将其传递至下一层。\n\
  - **反向传播（Backpropagation）**：反向传播是一种神经网络的学习方法。它好比教网络从错误中学习，通过计算输出与正确答案的偏差，然后调整网络参数，使其输出结果更接近正确值，从而帮助改进神经网络。\n\
  - **循环神经网络（RNN）**：RNN 是一种经过训练、能够处理序列数据（如一系列随时间发生的事件）的神经网络。这使得 RNN 能够根据输入的顺序做出预测或决策。例如，RNN\
  \ 可通过分析历史价格和市场趋势来预测股价的变动幅度。RNN 的独特之处在于其具备“记忆”能力，这意味着它会利用早期输入的信息来帮助理解当前输入，从而产生正确的输出。与其他将每个输入单独处理的神经网络类型不同，RNN\
  \ 依赖于序列的顺序。想象一下烤蛋糕的过程，步骤的顺序至关重要。如果不按顺序混合配料，就无法烤出蛋糕。同样，RNN 会记住步骤的顺序，并利用这些信息来预测接下来会发生什么。\n\
  - **长短期记忆网络（LSTM）**：LSTM 是一种特殊的 RNN，旨在解决常规 RNN 存在的问题。常规 RNN 在处理长序列信息时，难以记住细节。这使得将之前发生的事情与当前情况联系起来变得困难。LSTM\
  \ 通过其自身结构设计解决了这个问题，它能够长期记住信息。事实上，长期保留重要细节正是 LSTM 所擅长的！\n- **卷积神经网络（CNN）**，又名 ConvNets：CNN\
  \ 通常用于目标检测和图像分类任务。\n- **生成对抗网络（GAN）**：GAN 由两个神经网络组成：一个称为生成器，另一个称为判别器。生成器的任务是创建与训练数据集相似的新样本，而判别器的任务是区分真实样本和生成器生成的样本。“对抗”一词源于这两个网络被设置为相互竞争的关系。GAN\
  \ 可用于基于现有图像集合创建新图像，或通过学习歌曲数据库生成新音乐。GAN 还可用于根据文本描述生成逼真的图像，或改进现有照片。此外，它们也能用于生成具有与真实数据相同特性的新合成数据。\n\
  - **Transformer**：Transformer 是一种神经网络，它通过理解序列中各部分之间的上下文和关系，将输入序列（如一个句子）转换为输出序列。与\
  \ RNN 和 CNN 等其他神经网络不同，Transformer 一次性处理整个序列，而非逐步处理，因此速度更快、效率更高。这意味着它们需要的训练时间更少，运行速度也更快。Transformer\
  \ 有两个重要特性，使其在文本预测等任务中表现出色：\n    1.  **位置编码（Positional Encoding）**：Transformer 并非仅仅按照单词出现的顺序读取它们，而是为每个单词分配一个唯一的编号。这有助于模型理解句子中单词的顺序，这对于理解句意至关重要。\n\
  \    2.  **自注意力机制（Self-attention）**：此特性允许模型同时关注句子中所有单词之间的关系。模型学习哪些单词彼此重要，这有助于预测序列中接下来可能出现的内容。例如，Transformer\
  \ 可以通过分析单词通常如何组合在一起，“学习”语法规则。\n- **大型多模态模型（LMM）**：一种结合了大型语言模型（LLM）和多模态（MM）的深度学习模型。\n\
  - **检索增强生成（RAG）**：RAG 是一种通过从外部来源获取事实信息来提高机器学习模型准确性的技术。LLM 和 LMM 功能强大，可以执行问答、文档文本提取或语言翻译等任务，但它们也存在一些局限性。例如，它们只能使用被训练过的信息，这些信息可能过时或不完整。有时，如果模型不了解某件事，甚至可能给出错误答案。RAG\
  \ 通过允许模型在给出答案前查询可靠的信息源来帮助解决这些问题。这使得模型能够提供更准确、更新的响应，而无需重新训练或微调。\n- **生成式人工智能（GEN\
  \ AI）**：一种能够根据用户的请求或提示创建新内容的深度学习模型。\n- **大型语言模型（LLM）**：一种只能理解和生成文本数据的深度学习模型。\n-\
  \ **多模态模型（MM）**：一种能够处理不同模态（例如文本、音频或图像）的深度学习模型。模型是多模态的可能意味着以下一种或多种情况：\n    1.  输入和输出的模态不同（例如，图像到文本）。\n\
  \    2.  模型的输入是多模态的（即模型可以同时接受文本和图像）。\n    3.  模型的输出是多模态的（即模型可以同时生成文本和图像）。\n\n![](img/613832_1_En_5_Fig4_HTML.jpg)\n\
  \n**图 5-4** 来自 `scikit-learn` 网站的指南，用于根据数据集大小、特征数量和解决的问题类型来帮助选择机器学习算法，如分类、聚类和回归（`scikit-learn`\
  \ 算法速查表，无日期）\n\n机器学习模型形式多样，各有优劣。模型的选择取决于具体问题、数据性质以及期望的结果。\n\n## 机器学习模型的重要性\n\n机器学习模型在各行各业都可能至关重要。\n\
  \n### 医疗保健\n\n在医疗保健领域，ML 模型有助于提高诊断准确性、个性化治疗方案、预测患者结果以及辅助教育推广。例如，可利用深度学习模型分析医学影像，检测身体中的异常情况，如骨折和病变。模型在识别患有糖尿病、心脏病等慢性疾病风险的患者方面可发挥关键作用，从而实现早期干预，改善患者的生活预后。模型还可以加速从手写和扫描文档中提取患者信息的过程。\n\
  \n### 金融\n\n金融领域可以通过多种方式应用机器学习模型，例如欺诈检测和预测。欺诈检测模型通过分析模式来识别欺诈行为，保护金融机构及其客户。在预测方面，机器学习模型可以分析市场趋势并预测潜在风险，帮助金融机构做出明智的决策。\n\
  \n\n\n### 零售业\n\n机器学习可通过推荐系统、预测和库存管理来提升零售业的客户体验。通过分析客户行为与购买历史，推荐引擎能推荐符合个人偏好的商品，从而提高销售额和客户满意度。预测模型则可预测未来销售趋势，使零售商能够优化库存，减少因库存积压而产生的成本。\n\
  \n### 交通运输业\n\n自动驾驶汽车和交通管理系统体现了人工智能在交通运输领域的变革性影响。无人驾驶汽车利用机器学习模型进行导航、物体检测和决策，旨在提升道路安全与效率。交通管理系统可通过分析实时数据，运用预测模型优化车流，从而缓解拥堵、缩短出行时间。该模型还可用于事件检测与管理。例如，可检测事故、逆行车辆以及酒后驾驶等异常行驶行为。这些信息可用于向相关部门发出警报。\n\
  \n### 市场营销\n\n机器学习模型可用于分析消费者数据，以定位广告、细分市场并预测客户流失。这能帮助企业根据个人偏好与行为定制营销策略，从而提高活动效果与转化率。通过了解客户终身价值并识别潜在流失者，企业可主动实施留存策略，以维护忠诚的客户基础。\n\
  \n## 机器学习模型的工具与技术\n\n## 编程语言\n\nPython 是机器学习领域最流行的语言之一，以其可读性和丰富的库（例如 `TensorFlow`、`Keras`、`scikit-learn`、`PyTorch`\
  \ 和 `Hugging Face Transformers`）而闻名。Python 的简洁性与多功能性使其成为初学者和经验丰富的从业者的理想选择。该语言支持快速原型设计与开发，使数据科学家和机器学习工程师能够快速高效地尝试不同算法与技术。\n\
  \n#### 框架与库\n\n## TensorFlow\n\n`TensorFlow` 是由谷歌开发的开源框架，用于构建和部署机器学习模型。它提供了灵活且全面的机器学习开发生态系统，包括模型训练、评估和部署工具。\n\
  \n## PyTorch\n\n由 Meta 开发的 `PyTorch` 以其在研究与开发中的易用性而著称。`PyTorch` 深受研究人员和开发者的喜爱，常用于新想法的原型设计与实验。\n\
  \n## Keras\n\n`Keras` 是一个用 Python 编写的高级神经网络 API，可运行在 `TensorFlow` 和 `PyTorch` 之上。它通过提供用户友好的\
  \ API 和完善的文档，简化了构建和训练深度学习模型的过程。对于希望快速开发与实验神经网络的初学者及从业者而言，`Keras` 非常有用。\n\n#####\
  \ scikit-learn\n\n`scikit-learn` 是一个用于回归、分类和聚类等经典机器学习算法的库。它提供了简单高效的数据分析与建模工具，在教育场景和实际应用中广受欢迎。`scikit-learn`\
  \ 文档完善的 API 及其丰富的算法集合，使其成为实现标准机器学习任务的首选库。\n\n##### Transformers\n\n`Hugging Face\
  \ Transformers` 是一个开源库，简化了最先进机器学习模型的使用。它提供大量预训练模型，用于图像分类、命名实体识别和问答等任务。该库构建于 `PyTorch`\
  \ 和 `TensorFlow` 之上，提供了便捷的接口来利用这些强大模型，使开发者和研究人员能轻松地将高级机器学习功能集成到项目中。\n\n#### 集成开发环境\n\
  \n## Jupyter Notebook\n\n`Jupyter Notebook` 是一个开源网络应用程序，支持交互式编码、可视化和机器学习模型的共享。它支持多种编程语言，并能与各类数据科学库无缝集成。`Jupyter\
  \ Notebook` 使数据科学家能够记录工作流程、可视化结果，并以可重复的方式与他人协作。\n\n\n\n## Google Colab\n\nGoogle\
  \ Colab 是一个免费的云服务，支持 Jupyter Notebook，并提供免费的 GPU 访问权限，因此非常适合进行机器学习实验。它提供了一个便捷的平台，用于开发和测试机器学习模型，无需复杂的设置或硬件资源。Google\
  \ Colab 与 Google Drive 的集成功能，让笔记本和数据的存储与共享变得轻松。\n\n其他可用于机器学习开发的 IDE 包括 Visual Studio\
  \ Code 和 PyCharm。\n\n#### 代码示例\n在此示例中，我们将使用一个机器学习模型，根据工作年限来预测薪资。\n\n1.  导入所需的库。\n\
  \n    ```python\n    import pandas as pd\n    from sklearn.model_selection import\
  \ train_test_split\n    from sklearn.linear_model import LinearRegression\n    import\
  \ matplotlib.pyplot as plt\n    import pickle\n    ```\n\n2.  加载数据集。此数据集可在 Kaggle\
  \ 上找到：[`https://www.kaggle.com/datasets/abhishek14398/salary-dataset-simple-linear-regression`](https://www.kaggle.com/datasets/abhishek14398/salary-dataset-simple-linear-regression).\n\
  \n    ![](img/613832_1_En_5_Fig5_HTML.jpg)\n\n    **图 5-5**：本示例所用数据集中的数据样本。这是数据集中的前几行。\n\
  \n    ```python\n    examp1_data = pd.read_csv(\"salary_dataset.csv\")\n    examp1_data.head(5)\n\
  \    ```\n\n3.  我们将使用工作年限作为模型的输入，薪资作为模型的输出。\n\n    ```python\n    x = examp1_data[[\"\
  YearsExperience\"]]\n    y = examp1_data[[\"Salary\"]]\n    ```\n\n4.  我们首先需要分割数据集，以确保有足够的数据来训练和测试模型。通常，数据按照\
  \ 80% 用于训练，20% 用于测试的比例分割。\n\n    我们将使用`x_train`和`y_train`进行训练，使用`x_test`和`y_test`测试模型。\n\
  \n    `random_state`是一个参数，用于确保数据分割的可重复性。这意味着每次运行这行代码时，`x_train`、`x_test`、`y_train`、`y_test`\
  \ 中分配的数据都是相同的，而不是随机的。\n\n    ```python\n    x_train, x_test, y_train, y_test = train_test_split(x,\
  \ y, train_size=.8, random_state=42)\n    model = LinearRegression()\n    model.fit(x_train,\
  \ y_train)\n    ```\n\n5.  现在，让我们使用模型，根据模型从未见过的“工作年限”数据来预测薪资。这些数据已保存在变量`x_test`中。接下来，将预测结果保存在`lr_predictions`中，并将其绘制成图表。\n\
  \n    ```python\n    lr_predictions = model.predict(x_test)\n    ```\n\n6.  现在，绘制数据图表。\n\
  \n    ![](img/613832_1_En_5_Fig6_HTML.jpg)\n\n    **图 5-6**：展示模型对未来十年薪资预测的图表。\n\n\
  \    ```python\n    plt.scatter(x_test, y_test)\n    plt.plot(x_test, lr_predictions)\n\
  \    plt.xlabel(\"Years\")\n    plt.ylabel(\"Salary\")\n    plt.title(\"Title: Predicted\
  \ Salary Based on Years of Experience\")\n    ```\n\n7.  现在，保存模型以便后续使用。我们将其保存为一个\
  \ pickle 文件，命名为`lr_salary_determinator_model.pkl`。\n\n    ```python\n    lr_model_pickle_file\
  \ = \"lr_salary_determinator_model.pkl\"\n    with open(lr_model_pickle_file, \"\
  wb\") as file:\n        pickle.dump(model, file)\n    ```\n\n8.  现在，加载 pickle 文件，并再次使用之前`x_test`中的数据来运行模型。\n\
  \n    ```python\n    with open(\"lr_salary_determinator_model.pkl\",\"rb\") as file:\n\
  \        model = pickle.load(file)\n    predictions = model.predict(x_test)\n  \
  \  ```\n\n在此示例中，我们将使用一个深度学习模型来识别图像中的动物。\n\n1.  导入所需的库。\n\n    ```python\n    from\
  \ transformers import pipeline\n    from PIL import Image\n    ```\n\n2.  在此示例中，我们将使用一张动物图片。\n\
  \n    ```python\n    image = Image.open(\"ostrich.jpg\")\n    ```\n\n3.  我们将使用 Hugging\
  \ Face 上一个名为`google/vit-base-patch16-224`的模型。\n\n    ```python\n    model_name=\
  \ \"google/vit-base-patch16-224\"\n    image_classifier = pipeline(\"image-classification\"\
  , model=model_name)\n    ```\n\n4.  将图像输入模型，等待其预测结果。\n\n    ```python\n    image_classification_prediction\
  \ = image_classifier(image)\n    ```\n\n5.  以下是模型的输出结果。它按置信度从高到低输出了五个预测。置信度最高的是鸵鸟，置信度为\
  \ 0.99。模型的置信度得分范围通常是 0 到 1 或 0 到 100%。\n\n    ```python\n    [{'label': 'ostrich,\
  \ Struthio camelus', 'score': 0.9992263317108154},\n    {'label': 'bustard', 'score':\
  \ 9.642778604757041e-05},\n    {'label': 'black stork, Ciconia nigra', 'score':\
  \ 4.994613482267596e-05},\n    {'label': 'zebra', 'score': 1.568139487062581e-05},\n\
  \    {'label': 'flamingo', 'score': 1.4048618140805047e-05}]\n    ```\n\n### 特征选择与特征工程\n\
  \n特征选择是从数据集中挑选出最重要的信息（特征），并剔除那些可能混淆模型的不必要内容。另一方面，特征工程则是创建数据集中原本不存在但可能有助于模型做出更好预测的新数据。\n\
  \n当我们训练一个机器学习模型时，通常从大量数据开始，但并非所有数据都有用。有些数据可能包含噪声、不相关，或者只是增加了模型训练负担的额外信息。通过只选择最佳特征，我们可以帮助模型运行得更快，并做出更好的预测。\n\
  \n例如，假设你要构建一个机器学习模型来预测哪些学生会在数学竞赛中表现出色。你的数据集中包含了学生的数学成绩、拥有数学书的数量以及他们最喜欢的电视节目。成绩和数学书数量可能有帮助，但他们最喜欢的电视节目可能无助于预测竞赛表现。因此，你会移除电视节目数据，专注于更相关的特征来构建模型。然而，你也可以通过特征工程创建一个新特征。例如，利用他们最喜欢的电视节目，创建一个特征来识别哪些节目具有浓厚的数学主题，并创建一个二元特征（例如，Math-Focused-Show\
  \ = 1 或 0），以观察这是否会影响学生在竞赛中的表现。\n\n### 预训练模型与微调模型\n\n**预训练模型**：一个已经在大量数据上训练过以执行特定任务的模型。它可以按原样使用，也可以通过微调等方法进行调整，以适应不同行业和用例的各种需求。我们第二个代码示例中的模型就是一个预训练模型。\n\
  \n**微调模型**：微调是获取一个预训练模型，并通过使用一个更小、更专注的数据集对其进行调整，使其能更好地完成特定任务的过程。这有助于模型精炼其技能，并在手头的具体任务上表现得更好。\n\
  \n## 提示工程\n\n提示（Prompt）是要求机器学习模型执行特定操作的文本，例如回答问题或完成任务。提示工程（Prompt Engineering）则是精心设计和调整这些提示，以使模型给出你想要的精确回复。这就像你给出指示或向某人提问的方式。在人工智能领域，模型从大量数据中学习，恰当的提示对于模型能否正确理解你的请求至关重要。\n\
  \n\n\n## 结论\n\n机器学习模型通过自动化复杂任务、从海量数据集中发掘洞察并提供数据驱动决策，已深刻变革了各行各业。本章讨论的工具和技术为构建与部署机器学习模型奠定了全面基础。通过大量示例，我们展示了这些模型在解决实际问题中的实际应用和有效性。随着机器学习的持续演进，它将在不同领域解锁新机遇、推动创新。\n\
  \n机器学习模型凭借提供数据分析、预测和自动化的强大工具，彻底改变了众多领域。通过利用先进技术和稳健工具，这些模型能够解决复杂问题，并在各行业中推动显著进步。理解机器学习模型的重要性、工具、技术及潜在应用，对于充分发挥其潜力至关重要。\n\
  \n# 6. 评估模型\n\n评估机器学习模型就像检查食谱是否达到了预期效果。想象一下你在烤饼干，希望它们是我最喜欢的——柔软又有嚼劲！烤完后，你尝一口看看是否恰到好处。如果饼干太硬或太软，你就知道出了问题。同样地，当我们构建机器学习模型时，需要测试它以确保它按我们的预期运行。这种测试（即评估）能帮助我们判断模型是否做出了准确预测，或者是否需要调整\"\
  配料\"以获得更好结果。\n\n没有正确的评估，我们可能会信赖一个表现不佳的模型，就像端出味道不好的饼干。这可能导致错误的决策，尤其是当模型用于医疗等关键领域时。因此，评估模型有助于确保其可靠性，并值得信赖地做出正确决策。根据任务的不同，可以使用多种指标来评估机器学习模型。\n\
  \n## 评估模型简介\n\n构建模型只是机器学习世界的起点。评估这些模型对于确保其在实际应用中的有效性和可靠性至关重要。模型评估涉及使用各种指标和技术来衡量机器学习模型在给定数据集上的表现。\n\
  \n## 评估模型的重要性\n\n评估机器学习模型至关重要，原因如下：\n\n1.  **性能评估**\n\n    这有助于理解模型在未见过的数据上的表现，确保模型不仅记住了训练数据，而且能很好地泛化到新的、未知的信息。\n\
  \n2.  **模型比较**\n\n    评估指标允许比较不同模型或算法，以便为特定任务选择性能最优的模型。\n\n3.  **识别过拟合与欠拟合**\n\n\
  \    过拟合发生在机器学习模型从训练数据中学习过多，近乎将其记住时。这意味着模型在处理熟悉数据时表现良好，但面对新信息时会遇到困难。就像学生死记硬背了考试的所有答案，却无法回答新问题一样。\n\
  \n    过拟合可能发生的一些原因：\n    *   训练过程过长。\n    *   训练数据不够多样化。\n    *   模型对于数据过于复杂。\n\n\
  \    欠拟合发生在机器学习模型没有从数据中学到足够知识，导致其在训练数据和测试数据上都表现不佳时。就像学生只粗略浏览了教科书，错过了关键概念。\n\n  \
  \  欠拟合可能发生的一些原因：\n    *   训练时间不够长。\n    *   模型对于数据过于简单。\n    *   数据包含过多不必要的细节。\n\
  \n    找到过拟合与欠拟合之间的平衡点，是确保模型能处理好熟悉数据和新数据的关键。\n\n4.  **超参数调优**\n\n    假设你想教一个机器人识别猫。超参数就像你为机器人设定的学习规则。它们告诉机器人学习的速度（学习率）以及查看同一张图片的次数（轮次）。\n\
  \n    这与模型参数不同。模型参数是机器人从图片中学到的内容。它们就像机器人记住的关于猫的具体细节，比如耳朵的形状和毛色。\n\n    超参数帮助机器人学习，而模型参数是机器人实际学到的东西。\n\
  \n    另一个类比是烤蛋糕。超参数就像你遵循的食谱。它们告诉你每种材料用多少（例如，两杯面粉）、蛋糕要烤多久（例如，30 分钟）以及烤箱的温度（例如，350°F）。这些是你在烤蛋糕之前做出的选择。\n\
  \n    而蛋糕本身就像模型参数。它们是遵循食谱的结果。蛋糕的具体风味、质地和外观取决于你遵循食谱的程度和食材的质量。\n\n    所以，超参数指导了烘焙过程，而模型参数代表了最终成品。\n\
  \n    超参数的例子包括：\n    *   **学习率**：决定算法在学习过程中更新其预测的速度。\n    *   **权重衰减**：随着时间的推移逐渐降低学习率，以帮助模型更有效地学习。\n\
  \    *   **轮次**：模型在学习过程中完整遍历整个训练数据集的次数。\n\n5.  **部署就绪性**\n\n    全面的评估能确保模型在部署到生产环境之前，达到必要的准确性和可靠性标准。\n\
  \n\n\n## 评估模型时的工具与技术\n\n模型评估采用多种工具和技术，每种方法都适用于不同的问题类型与数据。下文将讨论机器学习模型评估中最常用的一些方法与指标。其中部分技术我曾在前几篇博客中讨论过，此处将继续补充定义和相关论述。\n\
  \n![](img/613832_1_En_6_Fig1_HTML.jpg)\n\n图 6-1：五折交叉验证的可视化表示\n\n### 训练-测试集分割\n\n\
  训练-测试集分割是一种基础方法，将数据集分为两部分：训练集和测试集。模型在训练集上训练，并在测试集上进行评估以检验其性能。\n\n### 交叉验证\n\n交叉验证是将数据集分成多个子集，并在不同子集上训练模型，同时在剩余子集上进行评估。这有助于预估模型性能，并防止模型过拟合。该技术常用于确定模型的超参数。\n\
  \n交叉验证有多种类型。本书中将讨论 k 折交叉验证。\n\nk 折交叉验证是指将数据集分成 K 组，利用这些组对模型进行 K 次训练和测试。每次迭代中，用于训练和测试模型的数据部分会轮换，直到完成第\
  \ K 次迭代。\n\n#### 工作原理\n\n1.  为 K 选取一个值，常用值为 10。\n2.  将数据集分成 K 组。\n3.  使用 K-1 组作为训练数据来训练模型，剩余\
  \ 1 组作为测试数据评估模型。\n4.  在训练数据集上训练模型，并在测试数据集上评估模型。\n5.  使用评估指标（如`RMSE`、`MAE`、`accuracy`等）评估模型。本章后续将详细讨论这些指标。评估模型后，保存评估分数。\n\
  6.  重复步骤 1-5 共 K 次。但下一轮需使用不同的子集作为测试数据集。\n7.  最后，计算评估分数的平均值。\n\n在图 6-1 中，我展示了五折交叉验证的可视化表示。幸运的是，我们不必手动操作。已有诸如\
  \ Python 包等工具可用，有助于在划分数据集时减少错误。\n\n## 混淆矩阵\n\n混淆矩阵提供了模型预测的详细分解，展示了真正例、真负例、假正例和假负例。它通过表格形式呈现结果，直观展示模型预测的准确性。表格的行代表期望输出，列代表模型的预测输出。\n\
  \n![](img/613832_1_En_6_Fig2_HTML.jpg)\n\n图 6-2：混淆矩阵的可视化表示\n\n假设你想创建一个预测汽车是否为兰博基尼的模型。在该数据集中，正例指汽车是兰博基尼，负例指其他任何汽车。使用此方法评估模型时，需牢记四个术语。\n\
  \n### 指标\n\n根据机器学习问题的类型，会使用不同的指标。你可以用这些指标评估模型，并比较多个模型的性能。以下是一些需考虑的指标列表：\n\n####\
  \ 分类指标\n\n**准确率**\n\n利用上述混淆矩阵的解释，准确率是正确预测数除以总预测数。该数值介于 0 和 1 之间，0 表示模型未做出任何正确预测，1\
  \ 表示所有预测都正确。业务相关人员喜欢这个指标，因为它简单易用。\n\n假设你想让模型判断一个花篮中是否装有玫瑰。使用验证数据集，模型准确率将由它正确识别为玫瑰和正确识别为非玫瑰的数量之和除以总花朵数决定。\n\
  \n该指标仅在数据集平衡时有效。平衡数据集意味着每个类别都有同等数量的样本。如果一个类别的样本数量远多于其他类别，模型可能会始终预测数量多的类别，即使识别少数类别同样重要。这可能导致高准确率，但在识别不常见类别时性能较差，在需要识别这些少数类别的实际应用中可能会出现问题。\n\
  \n**精确率**\n\n在模型所有预测为正例的结果中，有多少是真正的正例。该指标衡量模型正确识别的数量除以正确识别的总数与错误识别的总数之和。\n\n这追踪了模型错误识别的项目。以我们的花为例，它追踪了被我们归类为玫瑰但实际上是向日葵的数量。\n\
  \n**召回率**\n\n在所有真实的正例中，模型正确预测出了多少。该度量是模型正确识别的次数除以样本总数。它考虑了模型忽略的项目数量。它追踪了我们在花朵数据集中可能遗漏的玫瑰总数。\n\
  \n**F1 分数**\n\nF1 分数综合考虑了精确率和召回率。它衡量了模型误分类的项目数量以及模型完全遗漏的正例数量。\n\n**ROC-AUC**\n\n\
  -   接收者操作特征（ROC）：一个以不同阈值为基准，绘制真正例率与假正例率关系的图表。\n-   真正例（TP）：数据集中为正例，且模型预测也为正例的数据点。\n\
  -   真负例（TN）：数据集中为负例，且模型预测也为负例的数据点。\n-   假负例（FN）：数据集中为正例，但模型预测为负例的数据点。\n-   假正例（FP）：数据集中为负例，但模型预测为正例的数据点。\n\
  \n![](img/613832_1_En_6_Fig3_HTML.jpg)\n\n图 6-3：ROC 曲线示例\n\n-   曲线下面积（AUC）：衡量 ROC\
  \ 曲线下的面积。AUC 越高，模型预测能力越好。\n-   真正例率（TPR）：验证数据集中为正例，且模型预测结果也为正例的数据点的概率。\n-   假正例率（FPR）：验证数据集中为负例，但模型预测结果为正例的数据点的概率。\n\
  \n![](img/613832_1_En_6_Fig4_HTML.jpg)\n\n图 6-4：AUC 示例\n\n有时 AUC 和 ROC 会被合称为 AUROC（接收者操作特征曲线下面积）曲线。\n\
  \n#### 回归指标\n\n**均方误差（MSE）**\n\n`MSE`衡量模型预测的数据点与验证数据集中数据点的接近程度。它是残差平方的平均值。残差是指模型预测的数据点与验证数据集中数据点之间的差异，也常被称为误差。`MSE`的取值范围为\
  \ 0 到无穷大。`MSE`越接近 0，模型性能越好。换言之，`MSE`应尽可能低。\n\n**均方根误差（RMSE）**\n\n\n\n`RMSE` 是 `MSE`\
  \ 的平方根，用于衡量模型预测的数据点与验证数据集中数据点的接近程度。与 `MSE` 类似，其取值范围为 0 到无穷大。`RMSE` 越接近 0，模型性能越好。相比\
  \ `MSE`，`RMSE` 更受青睐，因为其单位未经平方，因此更易于解释模型的性能。\n\n## 平均绝对误差（`MAE`）\n\n`MAE` 衡量模型预测的数据点与验证数据集中数据点之间的平均差异。它是模型预测值与验证数据集之间绝对误差的平均值。`MAE`\
  \ 越接近 0，模型性能越好。\n\n## R 平方\n\nR 平方也称为决定系数。它衡量验证数据集中实际数据与拟合线（也称为回归线）的接近程度。\n\n回归线是一条直线，表示目标变量如何随解释变量的变化而变化。目标变量是您希望模型预测的变量，而解释变量是作为输入帮助模型进行预测而选择的变量。\n\
  \n![](img/613832_1_En_6_Fig5_HTML.jpg)\n\n**图 6-5** R 平方的可视化表示\n\nR 平方也衡量模型预测的数据点与验证数据集中数据点的接近程度。最好将\
  \ R 平方用于线性回归机器学习模型。其取值范围为 0 到 1。该值越接近 1，模型性能越好。\n\n让我们回到第 5 章中的示例，我们使用机器学习模型来预测薪水。在上一章中，我们创建了一个模型但没有对其进行评估。既然我们已经学习了一些评估指标，让我们使用\
  \ R 平方来评估该模型。\n\n导入所需的库。\n\n```python\nimport pandas as pd\nfrom sklearn.model_selection\
  \ import train_test_split\nfrom sklearn.linear_model import LinearRegression\nimport\
  \ matplotlib.pyplot as plt\n```\n\n加载数据集。此数据集可在 Kaggle 上找到：[`https://www.kaggle.com/datasets/abhishek14398/salary-dataset-simple-linear-regression`](https://www.kaggle.com/datasets/abhishek14398/salary-dataset-simple-linear-regression)。\n\
  \n```python\nexamp1_data = pd.read_csv(\"salary_dataset.csv\")\nexamp1_data.head(5)\n\
  ```\n\n![](img/613832_1_En_6_Fig6_HTML.jpg)\n\n**图 6-6** 我们为此示例使用的数据集中数据的样本\n\n\
  我们将把工作经验年限作为模型的输入，把薪水作为我们希望模型输出的目标。\n\n```python\nx = examp1_data[[\"YearsExperience\"\
  ]]\ny = examp1_data[[\"Salary\"]]\n```\n\n我们首先应拆分数据集，以确保有足够的数据用于训练模型，并有足够的数据用于测试模型。通常，数据按\
  \ 80% 用于训练，20% 用于测试进行拆分。\n\n我们将使用 `x_train` 和 `y_train` 进行训练，使用 `x_test` 和 `y_test`\
  \ 来测试模型。\n\n`random_state` 是一个参数，用于确保数据拆分的可重复性。因此，每次运行这行代码时，相同的数据将被设置到 `x_train`、`x_test`、`y_train`、`y_test`\
  \ 中，而不是每次运行时使用数据集中的随机数字。\n\n```python\nx_train, x_test, y_train, y_test = train_test_split(x,\
  \ y, train_size=.8, random_state=42)\n```\n\n让我们使用我们的数据训练一个线性回归模型。\n\n```python\n\
  model = LinearRegression()\nmodel.fit(x_train, y_train)\n```\n\n现在，让我们使用训练好的模型，利用模型未见过的经验年限数据来预测薪水。这些数据保存在变量\
  \ `x_test` 中。接下来，让我们将这些结果保存在 `lr_predictions` 中并进行绘图。\n\n```python\nlr_predictions\
