    ### API: Application Programming Interface


    APIs are a way for two or more software to communicate without knowing all the
    details within the application. It acts as an intermediary layer that processes
    data transfers. This saves developers time and encourages collaboration between
    different applications. APIs come with documentation that can be considered a
    contract representing an agreement between two parties. It will tell you if Party
    A sends a remote request structured in a predefined way, then Party A can expect
    a particular output from Party B. This allows companies to share their data and
    functionalities with third-party developers and business partners. It is like
    ordering food from a specific menu at a restaurant. When you request a particular
    item, you expect to receive it without knowing how it was created.


    ### Questionnaires and Surveys


    Questionnaires are written sets of questions used to ask individuals or a group.
    Surveys are a research method that uses questionnaires to help people understand
    the bigger picture by evaluating the data and drawing conclusions. You can use
    tools like Google Forms and Typeform to create surveys.


    ## Popular Sites and Datasets


    I have a few favorite sites I will share with you that you can use to access data.
    These sites can serve as valuable resources for obtaining the data you need. In
    the vast landscape of data analytics, data science, and artificial intelligence,
    the availability of datasets is very important for meaningful analysis and model
    development. The following websites provide access to a diverse range of datasets,
    catering to various domains and interests.


    ### Kaggle


    Kaggle is an online platform for data science and machine learning enthusiasts.
    It was founded by Anthony Goldbloom and Jeremy Howard in 2010\. It was acquired
    by Google in 2017\. Users on this platform can collaborate with other users, upload
    datasets, and compete against one another to solve data science challenges. Kaggle
    is a great place to get free datasets and practice your skills. People worldwide
    with varying backgrounds on this platform learn and challenge themselves individually
    and together.


    Throughout this chapter, I have spoken a lot about tabular data. However, on platforms
    like Kaggle, you can find various types of data `–` for example, images.


    The Facial Expression Recognition 2013 (FER2013) dataset has 35,887 grayscale
    images that are 48x48\. There are seven emotions: anger, disgust, fear, happiness,
    sadness, surprise, and neutral. This can be used in artificial intelligence to
    perform tasks like emotion detection. Figure [2-4](#613832_1_En_2_Chapter.xhtml#Fig4)
    shows some examples of the types of images within this dataset.


    ![](images/613832_1_En_2_Chapter/613832_1_En_2_Fig4_HTML.jpg)


    Figure 2-4


    Random images of facial expressions in FER2013


    ### Hugging Face


    Hugging Face is another online platform for data science and machine learning
    enthusiasts. One of the significant differences between Kaggle and Hugging Face
    is that there are no competitions. It provides members with a way to find datasets
    as well as a way for members to discover, train, and deploy models. It was founded
    by Clement Delangue, Julien Chaumond, and Thomas Wolf in 2016.


    EXAMPLE WITH CODE


    The following sites I will mention will come with examples using Python. To follow
    along, you can use software applications like Jupyter Notebooks, Google Colab,
    or even Visual Studio Code, which are all free.


