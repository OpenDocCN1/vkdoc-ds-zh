- fmt: "# Introduction to Adversaries and Abuse\n\nAdversaries in machine learning\
    \ refer to entities, whether individuals, groups, or organizations, that intentionally\
    \ manipulate or exploit machine learning models to achieve malicious objectives.\
    \ These adversaries aim to disrupt or deceive models for personal, financial,\
    \ or strategic gain. For example, an adversary could manipulate an email spam\
    \ filter by slightly altering phishing emails to avoid detection, allowing them\
    \ to bypass security systems.\n\nAbuse encompasses various activities in which\
    \ adversaries compromise, deceive, or manipulate systems. Abuse also encompasses\
    \ various attacks or unethical uses of machine learning systems, resulting in\
    \ unintended consequences. For example, adversaries might abuse a recommendation\
    \ system by using bots to artificially boost certain content, deceiving the system\
    \ to prioritize irrelevant or harmful materials.\n\n## Types of Adversaries\n\n\
    *   **Data Poisoning Attacks:** Intentionally putting misleading or incorrect\
    \ data into training datasets, causing the model to learn incorrect patterns.\
    \ This type of attack happens in the training phase. This can be done in several\
    \ ways:\n    *   Deleting portions of the data\n    *   Modifying the existing\
    \ data to the wrong answers\n    *   Adding fake data\n\n    Example: An attacker\
    \ might alter training data for a facial recognition system by injecting false\
    \ images, leading the model to misidentify people.\n\n*   **Evasion Attacks:**\
    \ Modify input data to evade detection by models. This happens in the testing/production\
    \ phase by adding small changes to the data. Figures [10-1](#613832_1_En_10_Chapter.xhtml#Fig1)\
    \ to [10-4](#613832_1_En_10_Chapter.xhtml#Fig4) show many examples of this.\n\n\
    \    Example: An attacker could slightly alter an image of a stop sign, as seen\
    \ in Figures [10-3](#613832_1_En_10_Chapter.xhtml#Fig3) and [10-4](#613832_1_En_10_Chapter.xhtml#Fig4),\
    \ so that an autonomous vehicle’s recognition system fails to identify it correctly,\
    \ posing serious safety risks.\n\n*   **Model Inversion Attacks:** Reconstruct\
    \ data that was used to train it using model outputs.\n\n    Example: A model\
    \ trained on sensitive health data could be exploited by adversaries to reverse-engineer\
    \ personal medical information from the model’s predictions, compromising patient\
    \ privacy.\n\nThe motivations behind these attacks are diverse. They range from\
    \ financial gain to causing harm. Adversaries can be malicious actors seeking\
    \ to exploit vulnerabilities, like an angry ex, or competitors aiming to harm\
    \ a rival’s system.\n\n## Importance of Understanding Adversaries and Abuse in\
    \ Machine Learning\n\n### Impact on Security and Privacy\n\nSome machine learning\
    \ models handle sensitive data, making them prime targets for adversaries. Understanding\
    \ the potential for abuse is crucial for safeguarding user privacy and maintaining\
    \ data integrity. To mitigate these risks, various safeguards can be implemented:\n\
    \n*   **Encryption:** Encryption helps protect data at rest and in transit. Data\
    \ can be encrypted before it’s used for training, ensuring that even if the data\
    \ is intercepted or accessed by unauthorized individuals, it remains unreadable.\
    \ For example, financial institutions can encrypt transaction data before feeding\
    \ it into machine learning models to prevent unauthorized access to sensitive\
    \ information.\n\n*   **Access Control:** Implementing strict access control ensures\
    \ that only authorized personnel have access to sensitive data and the machine\
    \ learning models. Role-based access controls can limit who can view, modify,\
    \ or train models with sensitive information. For example, healthcare organizations\
    \ can enforce access controls so that only approved medical staff have access\
    \ to patient records used in predictive health models.\n\n*   **Anonymization\
    \ Techniques:** Anonymization involves removing or masking personally identifiable\
    \ information (PII) from datasets before they are used in machine learning models.\
    \ Techniques like data masking, differential privacy, and k-anonymity can help\
    \ protect user privacy by making it difficult to trace back to an individual.\
    \ For example, anonymizing health records by removing or masking patient identifiers\
    \ allows researchers to use the data for analysis while maintaining privacy.\n\
    \n### Economic and Operational Implications\n\nExploiting machine learning systems\
    \ can lead to significant financial losses and operational disruptions. For example,\
    \ adversarial attacks on financial models can lead to incorrect predictions, resulting\
    \ in substantial economic consequences.\n\n### Trust in Machine Learning Systems\n\
    \nMaintaining trust in machine learning systems is essential for their widespread\
    \ adoption. Addressing adversaries and abuse is key to ensuring these systems\
    \ are reliable and secure.\n\n## Ways Adversarial Attacks Can Be Used\n\n### Data\
    \ Poisoning in Autonomous Vehicles\n\nAutonomous vehicles rely heavily on machine\
    \ learning models for navigation. Data poisoning could involve manipulating sensor\
    \ data to cause incorrect decision-making.\n\n### Model Inversion in Healthcare\n\
    \nMachine learning models in healthcare can be targeted for model inversion attacks\
    \ to extract sensitive patient information.\n\n### Evasion Attacks Using Adversarial\
    \ Images\n\nLet’s look at some practical examples. Adversarial images are images\
    \ specifically designed to trick neural networks into making incorrect judgments\
    \ about the content they are seeing.\n\nConvolutional neural networks and vision\
    \ transformers are commonly used to recognize objects in images. We, as humans,\
    \ recognize objects by looking at abstract features. For example, for a panda,\
    \ we would look for features like black eyes and fur. Machine learning models\
    \ recognize these objects differently, which makes them susceptible to adversarial\
    \ images. Below are various examples of these types of images.\n\n![](images/613832_1_En_10_Chapter/613832_1_En_10_Fig4_HTML.jpg)\n\
    \nFigure 10-4\n\nIn this example, subtle changes cause the machine learning model\
    \ to classify stop signs as a speed limit of 45 and right turn signs as stop signs\n\
    \n![](images/613832_1_En_10_Chapter/613832_1_En_10_Fig3_HTML.jpg)\n\nFigure 10-3\n\
    \nIn this example, art stickers and graffiti with camouflage caused a machine\
    \ learning model to classify stop signs as a speed limit of 45 sign and yield\
    \ sign\n\n![](images/613832_1_En_10_Chapter/613832_1_En_10_Fig2_HTML.jpg)\n\n\
    Figure 10-2\n\nThe image on the left is a cat but has been changed to include\
    \ some boxiness. This causes the model used to identify this as a computer. The\
    \ image on the right is clearly a banana, but the image has been changed to include\
    \ an object on the left of it, which causes the model to identify this image as\
    \ a toaster\n\n![](images/613832_1_En_10_Chapter/613832_1_En_10_Fig1_HTML.jpg)\n\
    \nFigure 10-1\n\nAn example of an adversarial input tricking AI to misidentify\
    \ a panda as gibbon. This image has been slightly changed by adding a noise"
