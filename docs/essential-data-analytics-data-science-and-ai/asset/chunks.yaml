  raw: 'RMSE is the square root of MSE. It measures how close the data points a model
    predicts are to the data points in your validation dataset. Similarly to MSE,
    the values range from 0 to infinity. The closer the RMSE is to 0, the better the
    model is performing. There is a higher preference for RMSE over MSE because the
    units are not squared, so it’s easier to interpret the performance of the model.


    Mean Absolute Error (MAE)


    MAE measures the average difference between the data points predicted by a model
    and the data points in your validation dataset. It is the average absolute error
    between the predicted values from the model and the validation dataset. The closer
    the MAE is to 0, the better the model is performing.


    R Squared


    R squared is also called the coefficient of determination. It measures how close
    the actual data within your validation dataset is to the fitted line, also known
    as the regression line.


    The regression line is a straight line that represents how the target variable
    changes as the explanatory variables change. The target variable is what you want
    your model to predict, and the explanatory variables are the variables chosen
    as input to help your model make the predictions.


    ![](images/613832_1_En_6_Chapter/613832_1_En_6_Fig5_HTML.jpg)


    Figure 6-5


    A visual representation on R squared


    R squared also measures how close the data points predicted by a model are from
    the data points in your validation dataset. It is best to use R squared for linear
    regression machine learning models. The values range from 0 to 1. The closer the
    value is to 1, the better the model is performing.


    Let’s go back to our example in Chapter 5, where we used a machine learning model
    to predict salaries. In the last chapter, we created a model without evaluating
    it. Now that we have learned some evaluation metrics, let’s evaluate the model
    using R squared.


    Import required libraries.


