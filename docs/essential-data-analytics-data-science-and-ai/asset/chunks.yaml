  trans: "\n# 结论\n\n机器学习模型通过自动化复杂任务、从海量数据集中发掘洞察并提供数据驱动决策，已深刻变革了各行各业。本章讨论的工具和技术为构建与部署机器学习模型奠定了全面基础。通过大量示例，我们展示了这些模型在解决实际问题中的实际应用和有效性。随着机器学习的持续演进，它将在不同领域解锁新机遇、推动创新。\n\
    \n机器学习模型凭借提供数据分析、预测和自动化的强大工具，彻底改变了众多领域。通过利用先进技术和稳健工具，这些模型能够解决复杂问题，并在各行业中推动显著进步。理解机器学习模型的重要性、工具、技术及潜在应用，对于充分发挥其潜力至关重要。\n\
    \n# 6. 评估模型\n\n评估机器学习模型就像检查食谱是否达到了预期效果。想象一下你在烤饼干，希望它们是我最喜欢的——柔软又有嚼劲！烤完后，你尝一口看看是否恰到好处。如果饼干太硬或太软，你就知道出了问题。同样地，当我们构建机器学习模型时，需要测试它以确保它按我们的预期运行。这种测试（即评估）能帮助我们判断模型是否做出了准确预测，或者是否需要调整\"\
    配料\"以获得更好结果。\n\n没有正确的评估，我们可能会信赖一个表现不佳的模型，就像端出味道不好的饼干。这可能导致错误的决策，尤其是当模型用于医疗等关键领域时。因此，评估模型有助于确保其可靠性，并值得信赖地做出正确决策。根据任务的不同，可以使用多种指标来评估机器学习模型。\n\
    \n## 评估模型简介\n\n构建模型只是机器学习世界的起点。评估这些模型对于确保其在实际应用中的有效性和可靠性至关重要。模型评估涉及使用各种指标和技术来衡量机器学习模型在给定数据集上的表现。\n\
    \n## 评估模型的重要性\n\n评估机器学习模型至关重要，原因如下：\n\n1.  **性能评估**\n\n    这有助于理解模型在未见过的数据上的表现，确保模型不仅记住了训练数据，而且能很好地泛化到新的、未知的信息。\n\
    \n2.  **模型比较**\n\n    评估指标允许比较不同模型或算法，以便为特定任务选择性能最优的模型。\n\n3.  **识别过拟合与欠拟合**\n\
    \n    过拟合发生在机器学习模型从训练数据中学习过多，近乎将其记住时。这意味着模型在处理熟悉数据时表现良好，但面对新信息时会遇到困难。就像学生死记硬背了考试的所有答案，却无法回答新问题一样。\n\
    \n    过拟合可能发生的一些原因：\n    *   训练过程过长。\n    *   训练数据不够多样化。\n    *   模型对于数据过于复杂。\n\
    \n    欠拟合发生在机器学习模型没有从数据中学到足够知识，导致其在训练数据和测试数据上都表现不佳时。就像学生只粗略浏览了教科书，错过了关键概念。\n\n\
    \    欠拟合可能发生的一些原因：\n    *   训练时间不够长。\n    *   模型对于数据过于简单。\n    *   数据包含过多不必要的细节。\n\
    \n    找到过拟合与欠拟合之间的平衡点，是确保模型能处理好熟悉数据和新数据的关键。\n\n4.  **超参数调优**\n\n    假设你想教一个机器人识别猫。超参数就像你为机器人设定的学习规则。它们告诉机器人学习的速度（学习率）以及查看同一张图片的次数（轮次）。\n\
    \n    这与模型参数不同。模型参数是机器人从图片中学到的内容。它们就像机器人记住的关于猫的具体细节，比如耳朵的形状和毛色。\n\n    超参数帮助机器人学习，而模型参数是机器人实际学到的东西。\n\
    \n    另一个类比是烤蛋糕。超参数就像你遵循的食谱。它们告诉你每种材料用多少（例如，两杯面粉）、蛋糕要烤多久（例如，30 分钟）以及烤箱的温度（例如，350°F）。这些是你在烤蛋糕之前做出的选择。\n\
    \n    而蛋糕本身就像模型参数。它们是遵循食谱的结果。蛋糕的具体风味、质地和外观取决于你遵循食谱的程度和食材的质量。\n\n    所以，超参数指导了烘焙过程，而模型参数代表了最终成品。\n\
    \n    超参数的例子包括：\n    *   **学习率**：决定算法在学习过程中更新其预测的速度。\n    *   **权重衰减**：随着时间的推移逐渐降低学习率，以帮助模型更有效地学习。\n\
    \    *   **轮次**：模型在学习过程中完整遍历整个训练数据集的次数。\n\n5.  **部署就绪性**\n\n    全面的评估能确保模型在部署到生产环境之前，达到必要的准确性和可靠性标准。\n"
- fmt: '# Tools and Techniques When Evaluating Models


    Model evaluation employs a variety of tools and techniques, each suited for different
    types of problems and data. Below, we discuss some of the most common methods
    and metrics used in the evaluation of machine learning models. I discussed some
    of these techniques in a few blogs and will add the definitions and discussions
    here.


    ![](images/613832_1_En_6_Chapter/613832_1_En_6_Fig1_HTML.jpg)


    Figure 6-1: A visual representation of five-fold cross-validation


    ## Train-Test Split


    The train-test split is a fundamental method where the dataset is divided into
    two parts: the training set and the testing set. The model is trained on the training
    set and evaluated on the testing set to assess its performance.


    ## Cross-Validation


    Cross-validation involves dividing the dataset into multiple folds and training
    the model on different folds while evaluating it on the remaining fold(s). This
    helps estimate how the model will perform and prevents the model from overfitting.
    This technique is used to help identify a model’s hyperparameters.


    There are various types of cross-validation techniques. In this book, we will
    discuss k-fold cross-validation.


    K-fold cross-validation is when the dataset is split into K number of groups.
    These groups are used to train and test the model, K number of times. The portions
    used to train and test the model are changed once during each iteration until
    you reach the K-ith iteration.


    ### How It Works


    1. Select a value for K. A commonly used value is 10.

    2. Split your dataset into K number of groups.

    3. K-1 groups will be used as training data to train your model, and the rest
    will be used as testing data to evaluate your model.

    4. Train your model on the training dataset and evaluate your model on the testing
    dataset.

    5. Evaluate your model using evaluation metrics, such as `RMSE`, `MAE`, `accuracy`,
    etc. These metrics will be discussed further in this chapter. After evaluating
    the model, save your evaluation score.

    6. Repeat steps 1–5 K times. However, in the next round, use a different section
    as your testing dataset.

    7. Finally, take the average of the evaluation scores.


    In Figure 6-1, I show a visual representation of five-fold cross-validation. Luckily,
    we do not have to do this manually. There are tools available for this like Python
    packages, which can help minimize mistakes when dividing the dataset.


    ## Confusion Matrix


    A confusion matrix provides a detailed breakdown of the model’s predictions, showing
    the true positives, true negatives, false positives, and false negatives. It visually
    represents how well the model is at making predictions by displaying the results
    in a table. The rows of the table represent the expected output, and the columns
    represent the predicted output from the model.


    ![](images/613832_1_En_6_Chapter/613832_1_En_6_Fig2_HTML.jpg)


    Figure 6-2: A visual representation of a confusion matrix


    Let’s say you wanted to create a model that predicts whether a car is a Lamborghini.
    A positive case in this dataset means that the car is a Lamborghini, and a negative
    case is any other car. There are four terms to keep in mind when assessing the
    model using this.


    ## Metrics


    Different metrics are used depending on the type of machine learning problem.
    You can use these metrics to evaluate the model and compare performances between
    multiple models. Below is a list of some metrics to consider:


    ### Classification Metrics


    **Accuracy**


    Using the explanation from the confusion matrix above, accuracy is the number
    of correct predictions divided by the total number of predictions. This number
    ranges between 0 and 1, where zero means the model did not get any predictions
    correct and one means all the predictions were correct. Business stakeholders
    love this metric because of its simplicity of use.


    Let’s say you wanted your model to determine if a flower basket contains roses.
    Using your validation dataset, the accuracy of your model would be determined
    by how many items it correctly identified as roses and how many items it correctly
    identified as not being roses, divided by the total number of flowers.


    This metric is only effective if your dataset is balanced. A balanced dataset
    means that every group is equally represented. If one group has way more examples
    than others, the model might always predict the bigger groups, even though figuring
    out the smaller groups is just as important. This can lead to high accuracy but
    poor performance in recognizing the less common groups, which can be problematic
    in real-world applications where identifying those minority groups is crucial.


    **Precision**


    Out of all the positive predictions that the model outputted, how many were actually
    positive. This measures how many items the model correctly identified divided
    by the total number of items it correctly identified and the total number it incorrectly
    identified.


    This keeps track of items the model incorrectly identified. Using our flower example,
    it keeps track of how many of our classified roses were actually sunflowers.


    **Recall**


    Out of all the actual positive predictions, how many did the model predict correctly.
    This measure is the number of times the model correctly identified divided by
    the total number of items present. This takes into consideration the number of
    items that the model ignored. It keeps track of the total number of roses we may
    have missed in the flower dataset.


    **F1 Score**


    The F1 score takes into account precision and recall. It measures how many items
    were misclassified by the model and how many positives were completely missed
    by the model.


    **ROC-AUC**


    - Receiver Operating Characteristic (ROC): A graph that shows a plot of the True
    Positive Rate vs. the False Positive Rate at different thresholds

    - True Positives (TP): Data points within the dataset that are positive AND the
    predictions from the model are also positive

    - True Negatives (TN): Data points within the dataset that are negative AND the
    predictions from the model are also negative

    - False Negatives (FN): Data points within the dataset that are positive BUT the
    predictions from the model are negative

    - False Positives (FP): Data points within the dataset that are negative BUT the
    predictions from the model are positive


    ![](images/613832_1_En_6_Chapter/613832_1_En_6_Fig3_HTML.jpg)


    Figure 6-3: An example of the ROC curve


    - Area Under the Curve (AUC): Measures the area under the ROC curve. The higher
    the AUC, the better the model is predicting.

    - True Positive Rate (TPR): Probability that data points within the validation
    dataset were positive AND the predictions from the model also outputted positive

    - False Positive Rate (FPR): Probability that data points within the validation
    dataset were negative BUT the predictions from the model outputted positive


    ![](images/613832_1_En_6_Chapter/613832_1_En_6_Fig4_HTML.jpg)


    Figure 6-4: An example of AUC


    Sometimes AUC and ROC are referred together as AUROC (Area Under the Receiver
    Operating Characteristic) curve.


    ### Regression Metrics


    **Mean Squared Error (MSE)**


    `MSE` measures how close the data points predicted by the model are to the data
    points in your validation dataset. It is the average of the square of the residuals.
    Residuals are the difference between the data points predicted by a model and
    the data points in the validation dataset. Residuals are also known as the errors.
    `MSE` ranges from 0 to infinity. The closer the `MSE` is to zero, the better the
    model is performing. In other words, `MSE` should be as low as possible.


    **Root Mean Squared Error (RMSE)**'
