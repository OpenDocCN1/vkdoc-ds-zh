  trans: "\n### 成功 AI 产品的关键条件\n\n机器学习模型很少完美无缺，它们会犯错。关键在于，它们提供的价值要足以弥补其错误。对于一个可行的机器学习模型而言，它应当提供显著的好处，这些好处要超过其错误所造成的成本。例如，一个为顾客优化杂货购物的模型，偶尔可能会犯些小错，导致轻微延误。只要这些错误不常发生，并且系统总体上能为用户节省时间，它就可以被认为是有价值的。\n\
    \n相比之下，用于关键任务的模型，例如控制手术机器人或直升机，就必须可靠得多，因为错误可能带来严重后果。即使在这种高风险的情况下，模型也无需完美无缺，但必须显著优于其他备选方案。关键在于，一个机器学习模型必须能提供足够多的积极成果，以保证其被使用是合理的，即便它并不完美。\n\
    \n对于一个机器学习模型而言，若要被视为最高效，它必须能够直接影响预期结果。这意味着它要么能自动化处理流程，要么能提供信息和选项，以帮助用户实现其目标。当模型能够采取对产品目标产生清晰、即时影响的行动时，其效果最佳。如果模型的行动带来了积极结果，那么模型表现良好这一点应当是显而易见的；反之，如果结果不佳，那么模型性能的欠缺也应当是清晰的。影响结果的外部因素越少，机器学习模型就能越有效。\n\
    \n在部署机器学习模型时，找到恰当的平衡点很重要——目标过于宽泛，会使模型的行动与结果之间的关联难以建立。在庞大、复杂的产品中，可以为不同的任务使用多个机器学习模型。你也可以用一个模型处理多个任务，但用户提供的反馈与机器学习模型为了改进所需的特定决策之间的关联性就不够直接了。\n\
    \n### 利用交互数据优化你的模型\n\n机器学习模型会通过从最终用户与它们的交互方式中学习，从而随着时间的推移不断改进。当用户与你的产品（其中嵌入了机器学习模型）互动时，产品应收集关于用户行为、他们所体验的结果以及他们的反馈数据。这是遥测数据的一部分，这部分内容将在第\
    \ 9 章中讨论。这些数据至关重要，因为它能帮助机器学习模型变得更智能、更高效，从而为最终用户创造更大价值。\n\n例如，为了改进机器学习模型，记录用户交互的详细信息至关重要。这涉及到追踪以下内容：\n\
    \n-   用户看到了什么\n-   他们如何回应\n-   以及他们的体验是正面的还是负面的\n\n通过分析这些数据，可以持续优化机器学习模型，以更好地满足最终用户的需求。这将提升你和你的公司的声誉及财务前景。\n\
    \n### AI 产品的成本考量\n\n与 AI 产品相关的成本不同于传统方法。这些成本包含三个主要组成部分：\n\n-   **机器学习模型**：产品中负责做出决策并确定最佳行动方案的组成部分。\n\
    -   **实施**：涵盖后端系统、模型以及任何其他组件（包括用户界面）的实际开发和集成工作。\n-   **编排**：涉及在产品整个生命周期内对其进行管理，以确保其持续满足目标并处理错误。\n\
    \n通常，AI 产品的机器学习模型部分成本较低，因为这些模型可以自动生成产品输出，取代了人工，并且它可以通过用户交互产生必要的训练数据。这减少了对人工数据收集的需求，总体上可以节省资金。然而，由于创建、集成和组织这些组件的复杂性增加，机器学习模型的实施成本可能与传统方法相当或略高。编排成本也往往更高，因为它们涉及持续的维护任务，如调优、更新和纠正错误。\n\
    \n### 何时考虑其他方案\n\n有时，你可能会遇到涉及用户、数据和决策制定的情况，但不确定是否需要机器学习模型。这种不确定性可能源于多种原因：你可能怀疑你的问题是否复杂到需要机器学习模型；你可能质疑实施这样一个模型所付出的努力和成本是否值得；或者你倾向于逐步解决问题，而不是从一开始就致力于研究和开发机器学习模型。\n\
    \n探索其他方法来解决棘手问题完全没问题，机器学习模型并非唯一的解决方案。\n\n## 判断何时使用机器学习模型的工具与技巧\n\n![](img/613832_1_En_7_Fig1_HTML.jpg)\n\
    \n图 7-1\n\n评估 AI 项目可行性的样本检查清单\n\n**在你决定是否将机器学习模型应用于产品或系统时，更多可供使用的关键指标**\n\n1.\
    \  **大规模且复杂的数据集**\n\n    当数据量庞大且包含传统方法难以捕捉的复杂模式时，机器学习是一种有价值的工具。\n\n2.  **预测性分析**\n\
    \n    如果目标是根据历史数据预测未来趋势。\n\n3.  **模式识别**\n\n    涉及模式识别的任务，如图像识别、异常检测和聚类分析，是机器学习的主要应用场景。\n\
    \n4.  **重复性任务自动化**\n\n    当重复性任务需要自动化时，例如在制造业或数据提取中，机器学习可以提供高效的解决方案。\n\n5.  **适应与学习**\n\
    \n    如果系统需要根据新数据随时间进行调整和改进，机器学习模型具备从数据中学习的能力，这使得它非常适合。\n"
- fmt: "### Techniques and Tools\n\nIn [Chapter 5](#613832_1_En_5_Chapter.xhtml),\
    \ we learned about different machine learning algorithms and techniques. Below\
    \ are some things to consider when deciding which algorithm to use.\n\n1.  **Supervised\
    \ Learning**  \n    Used when the outcome variable is known. Techniques include\
    \ linear regression, logistic regression, decision trees, and support vector machines.\n\
    \n2.  **Unsupervised Learning**  \n    Applied when the outcome variable is not\
    \ known. Techniques include clustering (k-means, hierarchical) and association\
    \ rules.\n\n3.  **Reinforcement Learning**  \n    It is used in dynamic environments\
    \ where the model learns from actions and their outcomes. Applications include\
    \ automotive vehicles and game play.\n\n4.  **Deep Learning**  \n    A subset\
    \ of machine learning focusing on neural networks with many layers. It is particularly\
    \ useful for tasks involving image, speech, and text processing.\n\n5.  **Natural\
    \ Language Processing (NLP)**  \n    Techniques for understanding and generating\
    \ human language are crucial for applications like chatbots, sentiment analysis,\
    \ and language translation.\n\n#### Example with Code\n\nHere is an example where\
    \ machine learning would be unnecessary.\n\nA company wants to assign unique employee\
    \ ID numbers to new hires. The ID numbers can be simple numbers that increase\
    \ sequentially, starting from 10001. The numbers would increase by 1 for each\
    \ new employee that joins the company.\n\nThis is unnecessary because assigning\
    \ sequential ID numbers is a straightforward task. Each new employee will get\
    \ the next available number in the sequence.\n\nHere is an example using Python.\n\
    \nLet’s say you have the ID saved in a database or Excel spreadsheet; you would\
    \ begin with the last employee ID assigned, which, in this example, is 10001:\n\
    \n```\nlast_employee_id = 10001\n```\n\nCreate a function to increment the ID\
    \ number based on the previous one assigned:\n\n```\ndef generate_employee_id(last_id):\n\
    \    return last_id + 1\n```\n\nUse the function to generate the next employee\
    \ ID for your new hire:\n\n```\nnew_hire_id = generate_employee_id(last_employee_id)\n\
    ```\n\nEven using Python to implement this may be overdoing it, but since this\
    \ is a technical book, I decided to show you a code implementation!\n\nHere is\
    \ an example where machine learning can be useful.\n\nLet’s say you have a wine\
    \ store and have a dataset of customer information. You want to group customers\
    \ into segments based on their purchasing behaviors to target them with personalized\
    \ market strategies. The data we will be working with in this example has a little\
    \ over 2000 rows.\n\nImport required libraries.\n\n```\nimport pandas as pd\n\
    from sklearn.cluster import KMeans\nfrom sklearn.preprocessing import StandardScaler\n\
    import matplotlib.pyplot as plt\nimport seaborn as sns\n```\n\nLoad the dataset.\
    \ This dataset can be found on Kaggle: [`https://www.kaggle.com/datasets/imakash3011/customer-personality-analysis/data`](https://www.kaggle.com/datasets/imakash3011/customer-personality-analysis/data)\n\
    \n```\ndata = pd.read_csv(\"marketing_campaign.csv\", sep=\"\\t\")\n```\n\nThis\
    \ data has 29 columns that describe the customer, for example, marital status,\
    \ income, number of kids, amount spent on wine, etc.\n\n```\ndata.columns\n```\n\
    \nAfter typing the code above, you will see a list of column names as seen below\
    \ in the brackets.\n\n```\nIndex(['ID', 'Year_Birth', 'Education', 'Marital_Status',\
    \ 'Income', 'Kidhome', 'Teenhome', 'Dt_Customer', 'Recency', 'MntWines', 'MntFruits',\
    \ 'MntMeatProducts', 'MntFishProducts', 'MntSweetProducts', 'MntGoldProds', 'NumDealsPurchases',\
    \ 'NumWebPurchases', 'NumCatalogPurchases', 'NumStorePurchases', 'NumWebVisitsMonth',\
    \ 'AcceptedCmp3', 'AcceptedCmp4', 'AcceptedCmp5', 'AcceptedCmp1', 'AcceptedCmp2',\
    \ 'Complain', 'Z_CostContact', 'Z_Revenue', 'Response'],\n      dtype='object')\n\
    ```\n\nIn this example, we will focus on grouping the customers by their income\
    \ (`Income`) and the amount of wine they purchased in the last two years (`MntWines`).\
    \ Like most datasets you will encounter in the real world, this data needs to\
    \ be cleaned. For this example, we will keep it simple by filling any empty values\
    \ within the `Income` and `MntWines` columns with a 0.\n\n```\nfeatures = data[[\"\
    Income\",\"MntWines\"]].fillna(0)\n```\n\nAs you can see in [Figure 7-2](#613832_1_En_7_Chapter.xhtml#Fig2),\
    \ some values are significantly different from each other. Here, we will transform\
    \ the values to have a common scale. This will allow the k-means algorithm to\
    \ focus more on the patterns of the data as opposed to the size, especially since\
    \ this is a distance-based algorithm.\n\n```\nscaler = StandardScaler()\nscaled_features\
    \ = scaler.fit_transform(features)\n```\n\n![Figure 7-2](images/613832_1_En_7_Chapter/613832_1_En_7_Fig2_HTML.png)\n\
    \nSample of data within the two columns\n\nIn this example, we will group the\
    \ customers in five groups.\n\n```\nkmeans = KMeans(n_clusters=5)\nclusters =\
    \ kmeans.fit_predict(scaled_features)\n```\n\nAfter identifying the clusters,\
    \ we will place those values back in our table for further analysis. Here we are\
    \ putting the values of the clusters in a new column called `Clusters`. The clusters\
    \ range from 0 to 4.\n\n![Figure 7-3](images/613832_1_En_7_Chapter/613832_1_En_7_Fig3_HTML.jpg)\n\
    \nSample of dataset after adding cluster values in the last column\n\n```\ndata[\"\
    Clusters\"] = clusters\n```\n\nNow, let’s analyze our data based on the clusters.\n\
    \n![Figure 7-4](images/613832_1_En_7_Chapter/613832_1_En_7_Fig4_HTML.jpg)\n\n\
    Bar chart displaying the number of wines purchased based on the clusters\n\n```\n\
    sns.barplot(data = data, x=\"MntWines\", hue=\"Clusters\")\n```\n\nHere we can\
    \ see the people in cluster 1 bought the most wine.\n\n![Figure 7-5](images/613832_1_En_7_Chapter/613832_1_En_7_Fig5_HTML.jpg)\n\
    \nBar chart displaying the number of kids each cluster has\n\n```\nsns.countplot(data\
    \ = data, x=\"Kidhome\", hue=\"Clusters\")\n```\n\nFurther analysis shows that\
    \ most people in cluster 1 do not have kids. So when creating a marketing campaign\
    \ to increase wine sales from your store, you would probably want to steer away\
    \ from campaigns encouraging customers to relax with a bottle of wine while their\
    \ kids are at the babysitter because that will not resonate with your most paying\
    \ customer group.\n\n### Examples Where Machine Learning Models Can Be Useful\n\
    \n#### Finance: Fraud Detection\n\nIn the financial sector, machine learning models\
    \ can be crucial for detecting fraudulent transactions. By analyzing transaction\
    \ patterns, these models can identify anomalies that suggest fraudulent activity.\
    \ Financial institutions can use these insights to prevent fraud and safeguard\
    \ assets.\n\n#### Retail: Personalized Recommendations\n\nRetailers can leverage\
    \ machine learning models to provide personalized recommendations to customers.\
    \ By analyzing purchase history, browsing behavior, and customer preferences,\
    \ these models can enhance the shopping experience and increase sales.\n\n###\
    \ Conclusion\n\nMachine learning models have immense potential to transform various\
    \ industries by providing advanced solutions to complex problems. However, the\
    \ decision to use machine learning should be based on a thorough understanding\
    \ of the problem at hand, the availability of data, and the potential benefits.\
    \ By recognizing the appropriate context for machine learning development and\
    \ deployment, you can harness its power to drive innovation, efficiency, and competitive\
    \ advantage."
  raw: "### Techniques and Tools\n\nIn Chapter [5](#613832_1_En_5_Chapter.xhtml),\
    \ we learned about different machine learning algorithms and techniques. Below\
    \ are some things to consider when deciding which algorithm to use.\n\n1.  Supervised\
    \ Learning\n\n    Used when the outcome variable is known. Techniques include\
    \ linear regression, logistic regression, decision trees, and support vector machines.\n\
    \n2.  Unsupervised Learning\n\n    Applied when the outcome variable is not known.\
    \ Techniques include clustering (k-means, hierarchical) and association rules.\n\
    \n3.  Reinforcement Learning\n\n    It is used in dynamic environments where the\
    \ model learns from actions and their outcomes. Applications include automotive\
    \ vehicles and game play.\n\n4.  Deep Learning\n\n    A subset of machine learning\
    \ focusing on neural networks with many layers. It is particularly useful for\
    \ tasks involving image, speech, and text processing.\n\n5.  Natural Language\
    \ Processing (NLP)\n\n    Techniques for understanding and generating human language\
    \ are crucial for applications like chatbots, sentiment analysis, and language\
    \ translation.\n\nEXAMPLE WITH CODE\n\nHere is an example where machine learning\
    \ would be unnecessary.\n\nA company wants to assign unique employee ID numbers\
    \ to new hires. The ID numbers can be simple numbers that increase sequentially,\
    \ starting from 10001\\. The numbers would increase by 1 for each new employee\
    \ that joins the company.\n\nThis is unnecessary because assigning sequential\
    \ ID numbers is a straightforward task. Each new employee will get the next available\
    \ number in the sequence.\n\nHere is an example using Python.\n\nLet’s say you\
    \ have the ID saved in a database or Excel spreadsheet; you would begin with the\
    \ last employee ID assigned, which, in this example, is 10001:\n\n```\nlast_employee_id\
    \ = 10001\n```\n\nCreate a function to increment the ID number based on the previous\
    \ one assigned:\n\n```\ndef generate_employee_id(last_id):\nreturn last_id + 1\n\
    ```\n\nUse the function to generate the next employee ID for your new hire:\n\n\
    ```\nnew_hire_id = generate_employee_id(last_employee_id)\n```\n\nEven using Python\
    \ to implement this may be overdoing it, but since this is a technical book, I\
    \ decided to show you a code implementation!\n\nHere is an example where machine\
    \ learning can be useful.\n\nLet’s say you have a wine store and have a dataset\
    \ of customer information. You want to group customers into segments based on\
    \ their purchasing behaviors to target them with personalized market strategies.\
    \ The data we will be working with in this example has a little over 2000 rows.\n\
    \nImport required libraries.\n\n```\nimport pandas as pd\nfrom sklearn.cluster\
    \ import KMeans\nfrom sklearn.preprocessing import StandardScaler\nimport matplotlib.pyplot\
    \ as plt\nimport seaborn as sns\n```\n\nLoad the dataset. This dataset can be\
    \ found on Kaggle: [`https://www.kaggle.com/datasets/imakash3011/customer-personality-analysis/data`](https://www.kaggle.com/datasets/imakash3011/customer-personality-analysis/data)\n\
    \n```\ndata = pd.read_csv(\"marketing_campaign.csv\", sep=\"\\t\")\n```\n\nThis\
    \ data has 29 columns that describe the customer, for example, marital status,\
    \ income, number of kids, amount spent on wine, etc.\n\n```\ndata.columns\n```\n\
    \nAfter typing the code above, you will see a list of column names as seen below\
    \ in the brackets.\n\n```\nIndex(['ID', 'Year_Birth', 'Education', 'Marital_Status',\
    \ 'Income', 'Kidhome', 'Teenhome', 'Dt_Customer', 'Recency', 'MntWines', 'MntFruits',\
    \ 'MntMeatProducts', 'MntFishProducts', 'MntSweetProducts', 'MntGoldProds', 'NumDealsPurchases',\
    \ 'NumWebPurchases', 'NumCatalogPurchases', 'NumStorePurchases', 'NumWebVisitsMonth',\
    \ 'AcceptedCmp3', 'AcceptedCmp4', 'AcceptedCmp5', 'AcceptedCmp1', 'AcceptedCmp2',\
    \ 'Complain', 'Z_CostContact', 'Z_Revenue', 'Response'],\ndtype='object')\n```\n\
    \nIn this example, we will focus on grouping the customers by their income (`Income`)\
    \ and the amount of wine they purchased in the last two years (`MntWines`). Like\
    \ most datasets you will encounter in the real world, this data needs to be cleaned.\
    \ For this example, we will keep it simple by filling any empty values within\
    \ the Income and MntWines columns with a 0.\n\n```\nfeatures = data[[\"Income\"\
    ,\"MntWines\"]].fillna(0)\n```\n\nAs you can see in Figure [7-2](#613832_1_En_7_Chapter.xhtml#Fig2),\
    \ some values are significantly different from each other. Here, we will transform\
    \ the values to have a common scale. This will allow the k-means algorithm to\
    \ focus more on the patterns of the data as opposed to the size, especially since\
    \ this is a distance-based algorithm.\n\n```\nscaler = StandardScaler()\nscaled_features\
    \ = scaler.fit_transform(features)\n```\n\n![](images/613832_1_En_7_Chapter/613832_1_En_7_Fig2_HTML.png)\n\
    \nFigure 7-2\n\nSample of data within the two columns\n\nIn this example, we will\
    \ group the customers in five groups.\n\n```\nkmeans = KMeans(n_clusters=5)\n\
    clusters = kmeans.fit_predict(scaled_features)\n```\n\nAfter identifying the clusters,\
    \ we will place those values back in our table for further analysis. Here we are\
    \ putting the values of the clusters in a new column called `Clusters.` The clusters\
    \ range from 0 to 4.\n\n![](images/613832_1_En_7_Chapter/613832_1_En_7_Fig3_HTML.jpg)\n\
    \nFigure 7-3\n\nSample of dataset after adding cluster values in the last column\n\
    \n```\ndata[\"Clusters\"] = clusters\n```\n\nNow, let’s analyze our data based\
    \ on the clusters.\n\n![](images/613832_1_En_7_Chapter/613832_1_En_7_Fig4_HTML.jpg)\n\
    \nFigure 7-4\n\nBar chart displaying the number of wines purchased based on the\
    \ clusters\n\n```\nsns.barplot(data = data, x=\"MntWines\", hue=\"Clusters\")\n\
    ```\n\nHere we can see the people in cluster 1 bought the most wine.\n\n![](images/613832_1_En_7_Chapter/613832_1_En_7_Fig5_HTML.jpg)\n\
    \nFigure 7-5\n\nBar chart displaying the number of kids each cluster has\n\n```\n\
    sns.countplot(data = data, x=\"Kidhome\", hue=\"Clusters\")\n```\n\nFurther analysis\
    \ shows that most people in cluster 1 do not have kids. So when creating a marketing\
    \ campaign to increase wine sales from your store, you would probably want to\
    \ steer away from campaigns encouraging customers to relax with a bottle of wine\
    \ while their kids are at the babysitter because that will not resonate with your\
    \ most paying customer group.\n\n## Examples Where Machine Learning Models Can\
    \ Be Useful\n\n### Finance: Fraud Detection\n\nIn the financial sector, machine\
    \ learning models can be crucial for detecting fraudulent transactions. By analyzing\
    \ transaction patterns, these models can identify anomalies that suggest fraudulent\
    \ activity. Financial institutions can use these insights to prevent fraud and\
    \ safeguard assets.\n\n### Retail: Personalized Recommendations\n\nRetailers can\
    \ leverage machine learning models to provide personalized recommendations to\
    \ customers. By analyzing purchase history, browsing behavior, and customer preferences,\
    \ these models can enhance the shopping experience and increase sales.\n\n## Conclusion\n\
    \nMachine learning models have immense potential to transform various industries\
    \ by providing advanced solutions to complex problems. However, the decision to\
    \ use machine learning should be based on a thorough understanding of the problem\
    \ at hand, the availability of data, and the potential benefits. By recognizing\
    \ the appropriate context for machine learning development and deployment, you\
