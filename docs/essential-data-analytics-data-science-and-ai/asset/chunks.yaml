    ![](images/613832_1_En_6_Chapter/613832_1_En_6_Fig7_HTML.jpg)


    **Figure 6-7** A graph displaying the model’s predictions of salary in the next
    ten years


    Let’s calculate R squared using `r2_score` from `scikit-learn`.


    ```python

    r2_score(y_test, lr_predictions)

    ```


    Our result is `0.9024461774180497`, which is very close to 1.


    ## Learning Curves


    Learning curves plot the model’s performance on the training and evaluation sets
    over successive training interactions, helping in diagnosing whether the model
