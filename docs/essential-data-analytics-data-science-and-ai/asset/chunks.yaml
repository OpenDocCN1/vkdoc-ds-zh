    # 5. 机器学习模型


    人工智能（AI）旨在让计算机系统足够智能，以完成通常需要人类思考的任务，例如理解语音、做出决策和识别模式。AI 是一个总称，涵盖了机器学习、自然语言处理等不同技术。


    ![](img/613832_1_En_5_Fig1_HTML.jpg)


    图 5-1


    图片来源于 LinkedIn Pulse 上的博客文章《“AI-ML-DML-GEN AI - 根据价格排序”》，展示了人工智能（AI）、机器学习（ML）、深度学习（DL）和大语言模型（LLM）之间的层级关系（[人工智能、机器学习与深度学习关系图]，2024
    年 4 月 23 日）


    本章我们将聚焦于机器学习。机器学习模型是人工智能领域的关键组成部分。这些模型使系统能够从数据中学习、识别模式，并在最少人工干预的情况下做出决策。它们通过提供前所未有的自动化和预测能力，彻底改变了各个行业。自动化复杂流程并从海量数据集中获取可操作洞察的能力，已经革新了从医疗、金融到零售和交通等众多领域。


    机器学习与数据分析和数据科学领域紧密相连，后两者的重点是收集、处理和分析数据，如前面章节所述。数据科学提供了从原始数据中提取有意义洞察的工具和技术，而机器学习则利用这些洞察进行预测并推动决策制定。在分析大型数据集、识别趋势以及确保我们在训练阶段拥有模型将在现实世界中遇到的代表性数据时，数据分析的作用尤为明显。这有助于创建不仅能进行预测，还能理解数据内部复杂关系的模型。


    从这个意义上说，数据科学、数据分析和机器学习是相辅相成的：数据分析和数据科学帮助我们理解和解读数据，而机器学习则通过进行预测和自动化决策，帮助我们基于数据采取行动。


    确保机器学习模型的高效性取决于训练数据的质量。一个构建良好且经过精心整理的数据集，是机器学习算法识别模式、把握复杂关系以及理解细微信息的基石。因此，由此产生的模型能更好地做出与数据内在复杂性相符的预测。


    ## 机器学习模型简介


    机器学习模型是现代数据科学的基石。它们通过使组件能够从数据中学习，并在无需显式编程的情况下做出决策或预测，推动了众多行业的进步。这些模型能够随着经验的增加自动提升性能，使其成为解决复杂问题的强大工具。


    在继续之前，让我解释一下机器学习模型与算法之间的区别。机器学习算法和模型这两个术语常被错误地互换使用，这可能会让初学者感到困惑。


    算法是为完成某项任务而设计的一系列步骤。在机器学习中，算法是在数据集上运行以识别模式和规则的程序。可以把算法看作过程，而模型则是这个过程所产生的最终产物。模型利用算法从数据集中学习。换句话说，模型是对数据集进行拟合。所有这些过程的输出就是一个捕捉了这些模式的机器学习模型。你可以将模型视为一个应用程序或程序，你可以用它输入数据来进行预测或做出决策。算法是实现模型学习的关键，但一旦学习完成，模型就独立存在，成为对新的、未见过的数据进行未来预测或决策的工具。


    这些模型生成的预测有助于你为业务做出数据驱动的决策。


    `机器学习模型 = 数据 + 算法`


    其核心在于，机器学习涉及使用算法在数据集上训练模型，以识别数据中的模式和关系。这个过程使模型在面对新的、未见过的数据时，能够做出预测或决策。根据模型训练的好坏程度，模型会以一定的准确度和置信度进行预测。机器学习算法有多种类型，每种类型适用于不同类型的任务：


    ### 监督学习


    机器学习模型使用带标签的数据进行训练。这意味着数据被标记了正确答案。可以把这种情况想象成模型在有老师指导的情况下学习。数据包含输入和正确的输出，以帮助模型更快地学习。


    假设你想训练一个机器学习模型来预测一辆二手兰博基尼的价值。


    你会有一个数据集，其中包含已知的输入和输出值，用于训练模型。例如，数据可能包括：


    - 里程数

    - 车型（例如轿车、SUV 等）

    - 颜色

    - 燃料类型（例如柴油、混合动力、电动、汽油）

    - 价格


    模型的输入将是里程数、车型、颜色和燃料类型，而输出将是价格。


    一旦模型对数据集进行了拟合，或者说从这个数据集中学习完毕，就会输出一个使用监督算法训练好的机器学习模型。你可以向这个模型提供它从未见过的新数据，并获得关于汽车价格的预测。监督学习算法有多种类型。


    #### 监督学习算法的类型


    **回归**


    回归算法预测连续变量，例如价格或温度。


    用于回归的监督学习算法示例：

    - `线性回归`

    - `随机森林回归`

    - `决策树回归`

    - `支持向量回归`


    **分类**


    分类算法预测离散变量，例如：

    - 是或否

    - 0 和 1

    - 红色、紫色、蓝色

    - 真或假


    预测结果被归类到一组不同的选项中。


    用于分类的监督学习算法示例：

    - `支持向量分类`

    - `K-近邻算法 (KNN)`

    - `逻辑回归`

    - `决策树分类`

    - `随机森林分类`


    #### 监督学习的应用场景


    - 时间序列市场分析

    - 客户分析

    - 人力资源分配


    ### 无监督学习

