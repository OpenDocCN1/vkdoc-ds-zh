  trans: '

    `RMSE` 是 `MSE` 的平方根，用于衡量模型预测的数据点与验证数据集中数据点的接近程度。与 `MSE` 类似，其取值范围为 0 到无穷大。`RMSE`
    越接近 0，模型性能越好。相比 `MSE`，`RMSE` 更受青睐，因为其单位未经平方，因此更易于解释模型的性能。


    ## 平均绝对误差（`MAE`）


    `MAE` 衡量模型预测的数据点与验证数据集中数据点之间的平均差异。它是模型预测值与验证数据集之间绝对误差的平均值。`MAE` 越接近 0，模型性能越好。


    ## R 平方


    R 平方也称为决定系数。它衡量验证数据集中实际数据与拟合线（也称为回归线）的接近程度。


    回归线是一条直线，表示目标变量如何随解释变量的变化而变化。目标变量是您希望模型预测的变量，而解释变量是作为输入帮助模型进行预测而选择的变量。


    ![](img/613832_1_En_6_Fig5_HTML.jpg)


    **图 6-5** R 平方的可视化表示


    R 平方也衡量模型预测的数据点与验证数据集中数据点的接近程度。最好将 R 平方用于线性回归机器学习模型。其取值范围为 0 到 1。该值越接近 1，模型性能越好。


    让我们回到第 5 章中的示例，我们使用机器学习模型来预测薪水。在上一章中，我们创建了一个模型但没有对其进行评估。既然我们已经学习了一些评估指标，让我们使用
    R 平方来评估该模型。


    导入所需的库。


    ```python

    import pandas as pd

    from sklearn.model_selection import train_test_split

    from sklearn.linear_model import LinearRegression

    import matplotlib.pyplot as plt

    ```


    加载数据集。此数据集可在 Kaggle 上找到：[`https://www.kaggle.com/datasets/abhishek14398/salary-dataset-simple-linear-regression`](https://www.kaggle.com/datasets/abhishek14398/salary-dataset-simple-linear-regression)。


    ```python

    examp1_data = pd.read_csv("salary_dataset.csv")

    examp1_data.head(5)

    ```


    ![](img/613832_1_En_6_Fig6_HTML.jpg)


    **图 6-6** 我们为此示例使用的数据集中数据的样本


    我们将把工作经验年限作为模型的输入，把薪水作为我们希望模型输出的目标。


    ```python

    x = examp1_data[["YearsExperience"]]

    y = examp1_data[["Salary"]]

    ```


    我们首先应拆分数据集，以确保有足够的数据用于训练模型，并有足够的数据用于测试模型。通常，数据按 80% 用于训练，20% 用于测试进行拆分。


    我们将使用 `x_train` 和 `y_train` 进行训练，使用 `x_test` 和 `y_test` 来测试模型。


    `random_state` 是一个参数，用于确保数据拆分的可重复性。因此，每次运行这行代码时，相同的数据将被设置到 `x_train`、`x_test`、`y_train`、`y_test`
    中，而不是每次运行时使用数据集中的随机数字。


    ```python

    x_train, x_test, y_train, y_test = train_test_split(x, y, train_size=.8, random_state=42)

    ```


    让我们使用我们的数据训练一个线性回归模型。


    ```python

    model = LinearRegression()

    model.fit(x_train, y_train)

    ```


    现在，让我们使用训练好的模型，利用模型未见过的经验年限数据来预测薪水。这些数据保存在变量 `x_test` 中。接下来，让我们将这些结果保存在 `lr_predictions`
    中并进行绘图。


    ```python

    lr_predictions = model.predict(x_test)

    ```


    最后，让我们绘制数据。


    ```python

    plt.scatter(x_test, y_test)

    plt.plot(x_test, lr_predictions)

    plt.xlabel("Years")

    plt.ylabel("Salary")

    plt.title("Title: Predicted Salary Based on Years of Experience")

    ```


    如图 6-7 所示，我们模型中的回归线与实际数据（即散点）非常接近。


    ![](img/613832_1_En_6_Fig7_HTML.jpg)


    **图 6-7** 显示模型对未来十年薪水的预测图表


    让我们使用 `scikit-learn` 中的 `r2_score` 计算 R 平方。


    ```python

    r2_score(y_test, lr_predictions)

    ```


    我们的结果是 `0.9024461774180497`，非常接近 1。


    ## 学习曲线


    学习曲线会绘制模型在连续训练迭代过程中在训练集和评估集上的性能，有助于诊断模型是过拟合还是欠拟合。

