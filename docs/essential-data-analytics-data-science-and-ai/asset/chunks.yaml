- fmt: '# What to Expect?


    We will cover various topics in this book to strengthen your understanding of
    how all these things work individually and together. We will start by discussing
    how to obtain data. Data is your most essential tool, whether what you are building
    is just for practice or real-world situations. Some people pay to get data, but
    there are ways to get this data for free. Sometimes, you may encounter situations
    where you must create the data yourself. This is called synthetic data creation.
    I will show you ways you can do that as well. There are pros and cons to all these
    methods.


    After you obtain data, you will need to go through a process called ETL. This
    is an essential process when dealing with data. ETL stands for Extract, Transform,
    and Load. There are commercial tools that can do this for you. However, you can
    also create this pipeline on your own using tools I have mentioned earlier, like
    `Python` or `R`. Once you have loaded the data to whatever destination you would
    like, you should explore and understand the data you now have in your possession.
    People in the data world call this EDA, which stands for exploratory data analysis.
    There are commercial tools that can help you with this. For example, you may have
    heard of `Tableau`! This is a popular tool but can be expensive for some people
    to get access to, so there are free ways to get this done.


    Next comes what some people may think is the fun part after you have loaded your
    data and cleaned it! It is essential to feed your model clean data. Algorithms
    are only as good as the data used to train them. You can use different algorithms
    to create models depending on the tasks you are trying to accomplish. After training
    the model, you need to evaluate it. Do not deploy a model without testing it does
    what you want it to do. There are various techniques for assessing a model. Not
    all evaluation techniques work or are necessary for the same model.


    As you can imagine from some of the examples I mentioned earlier, AI can live
    in many different places. Once you have decided you are ready to deploy your model,
    it is time to determine where it will live. It can be placed in the cloud or on
    a device like your mobile phone, fridge, or even your car! Depending on where
    it is placed will determine how fast or slow it takes to make a prediction or
    a decision.


    After giving your model a home, that is not the end. It is never the end! You
    must continue to nurture your model and keep it safe from bad actors. We will
    discuss some different adversarial attacks to look out for. We will discuss how
    to keep your model up to date using something called telemetry.


    It is important to note that not all tasks require the use of AI. Depending on
    the tasks, the use of AI can be overkill. You should take into consideration things
    like cost, size, and other stuff I will discuss in later chapters.


    Finally, there is an understandable fear of the power of AI. Unfortunately, I
    do not believe AI is going anywhere, so you should embrace it and find ways to
    work with it instead of against it. Of course, laws should be in place to limit
    how far we can take it so we do not all end up zombies submissive to the AI gods.
    However, many things have changed and will continue to change. It is not as scary
    as people think. No. The nerds will not kill us all. Let’s learn more about it
    and see how we can use it to help us grow in our daily lives to be more efficient
    with our time and routine.


    It is important to note that the field of data analytics, data science, and AI
    is rapidly evolving. While there may be new developments that are not covered
    in this book, the foundational principles discussed will remain relevant. These
    core concepts will continue to serve as a valuable guide, even as technologies
    and methods evolve.


    # Obtaining Data


    Data is one of the most essential tools in data analytics, data science, and artificial
    intelligence. There are different types of ways data can be presented to you.
    Most data are messy and need to be cleaned before being used.


    This chapter will delve into the multifaceted world of data, unraveling its various
    types and exploring the many avenues it can be acquired. We will navigate the
    intricacies of extracting data from the Web, acquaint ourselves with the treasure
    troves of public datasets, and demystify application programming interfaces (APIs).
    We will also touch upon the traditional yet vital method of collecting data through
    surveys and questionnaires. Finally, we will discuss ethics and responsibilities
    in data collection.


    ## Understanding the Different Types of Data


    Let’s discuss the key distinctions between different types of data to effectively
    guide the process of gathering and analyzing data in your projects.


    ### Structured Data


    Structured data is organized data that is easily readable by both humans and machines.
    This type of data is usually found in tools you are used to seeing, like spreadsheets
    and relational databases. The data is assigned a column, and each row refers to
    an instance of that data. This type of data is usually called tabular. Tabular
    data is organized in a table with columns and rows.


    Structured data is beneficial because various tools and techniques can easily
    search and analyze it. It is also easier for any person to read without any special
    tools. This type of data is ideal for business intelligence, data analytics, and
    artificial intelligence applications.


    ### Unstructured Data


    Unstructured data is data that is not in a specific format or structure. Most
    data in the real world are in this form. Unstructured data include invoices, images,
    audio, video, and email. Some examples of this kind of data can be seen in Figure
    [2-1](#613832_1_En_2_Chapter.xhtml#Fig1).


    ![](images/613832_1_En_2_Chapter/613832_1_En_2_Fig1_HTML.jpg)


    Figure 2-1 — Images of examples of unstructured data


    The difference between structured and unstructured data is the type of analysis
    that can be done with it. Structured data is in a rigid format that ensures consistency.
    Unstructured data, on the other hand, is not uniform. Figure [2-2](#613832_1_En_2_Chapter.xhtml#Fig2)
    shows a visual of the difference between the two types of data.


    ![](images/613832_1_En_2_Chapter/613832_1_En_2_Fig2_HTML.jpg)


    Figure 2-2 — Image of examples of structured data vs. unstructured data


    ### Quantitative Data


    Quantitative data is anything with numerical properties. This data can be counted
    or measured. You can answer questions like how many, how much, or how often with
    this type of data.


    ### Qualitative Data


    Qualitative data is information that cannot be counted, measured, or expressed
    using numbers. You can answer questions like why, how, or what happened.


    In Figure [2-3](#613832_1_En_2_Chapter.xhtml#Fig3), I provide some ways to think
    of qualitative vs. quantitative data.


    ![](images/613832_1_En_2_Chapter/613832_1_En_2_Fig3_HTML.jpg)


    Figure 2-3 — Image of examples of how to think of qualitative data vs. quantitative
    data


    ### Time Series Data


    Time series data is data collected in different time periods. This type of data
    helps with understanding trends and seasonality. Trends show the directions of
    the data. It reveals that data is increasing, declining, or remaining the same
    over a specific period. For example, e-commerce trends show a growth or decline
    in sales in the last year, which can help you adjust for the next fiscal year.
    Seasonality shows patterns that occur regularly — for example, a spike in vanilla
    ice cream sales on Saturdays.


    ### Cross-Sectional Data


    Cross-sectional data is data collected in one single moment in time. This type
    of data helps understand the relationship between items at a specific time.'
  raw: '## What to Expect?


    We will cover various topics in this book to strengthen your understanding of
    how all these things work individually and together. We will start by discussing
    how to obtain data. Data is your most essential tool, whether what you are building
    is just for practice or real-world situations. Some people pay to get data, but
    there are ways to get this data for free. Sometimes, you may encounter situations
    where you must create the data yourself. This is called synthetic data creation.
    I will show you ways you can do that as well. There are pros and cons to all these
    methods.


    After you obtain data, you will need to go through a process called ETL. This
    is an essential process when dealing with data. ETL stands for Extract, Transform,
    and Load. There are commercial tools that can do this for you. However, you can
    also create this pipeline on your own using tools I have mentioned earlier, like
    Python or R. Once you have loaded the data to whatever destination you would like,
    you should explore and understand the data you now have in your possession. People
    in the data world call this EDA, which stands for exploratory data analysis. There
    are commercial tools that can help you with this. For example, you may have heard
    of Tableau! This is a popular tool but can be expensive for some people to get
    access to, so there are free ways to get this done.


    Next comes what some people may think is the fun part after you have loaded your
    data and cleaned it! It is essential to feed your model clean data. Algorithms
    are only as good as the data used to train them. You can use different algorithms
    to create models depending on the tasks you are trying to accomplish. After training
    the model, you need to evaluate it. Do not deploy a model without testing it does
    what you want it to do. There are various techniques for assessing a model. Not
    all evaluation techniques work or are necessary for the same model.


    As you can imagine from some of the examples I mentioned earlier, AI can live
    in many different places. Once you have decided you are ready to deploy your model,
    it is time to determine where it will live. It can be placed in the cloud or on
    a device like your mobile phone, fridge, or even your car! Depending on where
    it is placed will determine how fast or slow it takes to make a prediction or
    a decision.


    After giving your model a home, that is not the end. It is never the end! You
    must continue to nurture your model and keep it safe from bad actors. We will
    discuss some different adversarial attacks to look out for. We will discuss how
    to keep your model up to date using something called telemetry.


    It is important to note that not all tasks require the use of AI. Depending on
    the tasks, the use of AI can be overkill. You should take into consideration things
    like cost, size, and other stuff I will discuss in later chapters.


    Finally, there is an understandable fear of the power of AI. Unfortunately, I
    do not believe AI is going anywhere, so you should embrace it and find ways to
    work with it instead of against it. Of course, laws should be in place to limit
    how far we can take it so we do not all end up zombies submissive to the AI gods.
    However, many things have changed and will continue to change. It is not as scary
    as people think. No. The nerds will not kill us all. Let’s learn more about it
    and see how we can use it to help us grow in our daily lives to be more efficient
    with our time and routine.


    It is important to note that the field of data analytics, data science, and AI
    is rapidly evolving. While there may be new developments that are not covered
    in this book, the foundational principles discussed will remain relevant. These
    core concepts will continue to serve as a valuable guide, even as technologies
    and methods evolve.


