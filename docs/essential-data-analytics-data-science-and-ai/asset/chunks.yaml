    \ needing to be retrained or fine-tuned.\n\n*   Generative Artificial Intelligence\
    \ (GEN AI): A deep learning model that has the ability to create new content based\
    \ on a user’s request or prompt.\n\n*   Large Language Model (LLM): A deep learning\
    \ model that is only able to understand and generate text data.\n\n*   Multimodal\
    \ Models (MM): A deep learning model that is capable of handling different modalities.\
