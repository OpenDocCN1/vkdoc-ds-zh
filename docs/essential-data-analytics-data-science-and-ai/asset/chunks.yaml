    ## Foreword


    With breakthrough innovations in artificial intelligence and the ensuing hype,
    everybody is now talking about AI – and that’s whether they know what they are
    talking about or not. And the topic is important as the ability to understand
    and leverage data is more critical than ever. Yet, with so much technology, jargon,
    and code, exploring AI can be intimidating and overwhelming. This book aims to
    break down those barriers, offering an approachable and concise guide to the world
    of data science and machine learning.


    This book takes readers step by step through the entire data science process –
    from obtaining, preparing, and processing data to performing exploratory data
    analysis and training and evaluating models. Crucially, it doesn’t stop at model
    training. The book also covers the essential next steps: deploying and monitoring
    models, improving them through experimentation with live data, and addressing
    key considerations like security, trust, and how to make models work effectively
    in practical, real-world scenarios.


    Focused on what truly matters, the book avoids bogging readers down with excessive
    code while providing numerous examples and illustrations. Again and again, it
    discusses multiple practical use cases and the decision-making involved.


    For anyone eager to cut through the AI hype and gain a real understanding of data
    science and machine learning, this book serves as a concise, practical, and accessible
    companion – empowering you to confidently navigate the fast-changing world of
    AI.


    ![](images/613832_1_En_BookFrontmatter_Figb_HTML.jpg)


    Christian Kästner, Associate Professor and Director of the Software Engineering
    PhD Program, Carnegie Mellon University, School of Computer Science


    ## About the Author


    ## About the Technical Reviewers


    # 1. Introduction


    Have you ever wondered how Netflix knows what show you will binge next? Or how
    Siri, Alexa, and ChatGPT always have an answer to your weirdest questions? What
    about when you wake up in the morning and order something online or check your
    newsfeed on your favorite social media app? Have you ever wondered how all these
    personalized experiences came to be?


    The three magicians behind the curtain are data analytics, data science, and artificial
    intelligence. The key behind all these three is data! Every click, every swipe,
    and just about every action leaves a trail that gives you a unique experience.
    This book will help guide you to understand these three concepts and how data
    is used to shape the world we live in.


    ## Data Analytics


    Imagine you are a detective, and your task is to solve mysteries. However, instead
    of relying on a magnifying glass like Daphne from Scooby-Doo, you have a more
    powerful tool – data! Now, you can perform data analytics. Data analytics turns
    raw data into insightful stories. Just like a detective looks for clues, data
    analysts sift through data to find patterns. With the power of data analytics,
    questions become answers. They can answer questions like “Why did sales drop in
    July?”, “Which song will be a hit next summer?”, or “Why do we keep running out
    of vanilla ice cream so quickly on Saturdays?”.


    ## Data Science


    Data analysts help find patterns, but now that you have uncovered the patterns,
    what is next? Data scientists help predict the future. They have a crystal ball
    that predicts the future by understanding the past and the present. They are the
    bridge between data patterns and meaningful actions. When your favorite shopping
    app suggested those pairs of shoes or your email service provider removed that
    spam email from your primary inbox before you could see it, that was all the work
    of a data scientist. Imagine predicting the next big fashion trend or forecasting
    stock prices. You must wonder how they must get this done.


    Have you heard of Python? No, not the snake. Have you heard of R? No, we are not
    going to sing our ABCs. Python and R are programming languages. Data scientists
    have multiple programming languages within their toolbox. These tools make other
    tools, like neural networks and random forests, which are used to make predictions.
    Don’t worry; by the end of this book, you will better understand these concepts
    and how to use them.


    ## Artificial Intelligence


    Neural networks and random forests are part of artificial intelligence (AI). Data
    scientists use AI to make predictions. AI teaches machines to think and learn.
    It’s like having a device as a virtual assistant. It can do more than forecast
    stocks or predict the next fashion trend. AI is used in software that paints like
    Picasso. It is in some software that composes music. It’s in automated cars and
    can be used to create a chatbot that answers your queries. There are many subdomains
    of AI.


    Nonetheless, with great power comes great responsibility. Some questions need
    to be answered: Does my software need AI? Should machines make decisions for us?
    What if it goes rogue? The world of AI is fascinating, but there are many issues
    to consider as well.


    We will explore real-world applications of AI across various industries, illustrating
    both current and potential use cases. Additionally, societal impacts and ethical
    considerations will be thoroughly discussed in later chapters of this book.


    ## The Dream Team


    Data analytics, data scientists, and AI together make a super team. Together,
    they shape how we live, work, play, and dream. We now live in a world where your
    fridge can let you know when your milk is running low, and you can get a personalized
    playlist generated based on your mood.


    The world is data-driven, and it’s time to embrace it. Whether you’re interested
    in becoming a data detective, a data science sorcerer, or an AI aficionado, there
    is a place for everyone on this stage. Remember, as this chapter comes to an end,
    every click, every swipe, and just about every action you make leads us to another
    step into the future. Embrace it, enjoy it, and watch the magic unfold.'
