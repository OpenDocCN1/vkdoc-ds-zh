- fmt: "### Retail Industry\n\n在零售行业，`EDA`可用于分析客户购买行为、优化产品布局和识别趋势。例如，像梅西百货这样的零售公司可以对销售数据进行`EDA`，以发现季节性模式、识别畅销产品，并根据购买习惯对客户进行细分。这些信息可以为库存管理策略和营销活动提供参考。\n\
    \n*   **步骤 1：收集数据**\n    像梅西百货这样的零售公司会收集销售交易数据，包括客户人口统计信息、产品购买情况、交易日期和总销售金额。\n\
    *   **步骤 2：数据清洗**\n    你可以通过处理缺失值、删除重复条目以及确保产品名称和客户人口统计信息等数据的一致性来清洗数据。\n*   **步骤\
    \ 3：探索**\n    你可以创建描述性统计和可视化图表（如条形图）来了解各产品类别的销售分布，并使用直方图来探索跨季节的购买频率。\n    通过时间序列分析和折线图，你可以识别销售中的季节性模式（例如，假期季节的销售高峰）。你还可以使用箱线图来分析按地区或客户年龄组划分的销售数据变化。\n\
    \    聚类技术可用于根据购买行为对客户进行分组。可以使用散点图和热力图来可视化人口统计信息（例如年龄、收入）与购买频率之间的关系。\n*   **步骤\
    \ 4：可操作洞察**\n    基于这些洞察，梅西百货可以优化旺季时高需求产品的库存，并为不同的客户群创建有针对性的营销活动。\n\n### Healthcare\n\
    \n`EDA`在分析患者数据、识别风险因素和改善患者预后的过程中可以发挥关键作用。例如，一家医院可以对电子健康记录进行`EDA`，以识别患者人口统计信息、病史和治疗结果之间的相关性。这种分析可以帮助医疗保健提供者为个体患者量身定制治疗和干预措施。他们还可以利用`EDA`来分析每年入院患者数量。这种分析有助于医院了解全年所需的员工配置。\n\
    \n*   **步骤 1：收集数据**\n    医院收集患者数据，包括人口统计信息（例如年龄、性别）、病史、诊断和治疗结果。\n*   **步骤 2：数据清洗**\n\
    \    医院通过删除重复项并适当填充缺失值来确保数据的准确性。\n*   **步骤 3：探索**\n    分析人员使用相关矩阵和热力图来检查各种患者人口统计信息与治疗结果之间的关系，从而识别出哪些因素（例如年龄、既往病史）与恢复时间强相关。\n\
    \    可以使用散点图和箱线图来探索不同风险因素（例如高血压、吸烟）在不同治疗结果的患者中的分布情况，揭示哪些群体面临更高风险。\n    医院还可以使用折线图和直方图分析每年的入院率，以预测全年的人员配置需求和资源分配。\n\
    *   **步骤 4：可操作洞察**\n    医院可以利用这些分析的部分结果为患者风险状况定制治疗计划。例如，具有某些风险因素的患者可能会接受更广泛的监测或预防性护理。\n\
    \n### Finance\n\n在金融行业，`EDA`可用于风险管理、欺诈检测和投资分析。投资公司可以对金融市场数据进行`EDA`，以识别可能影响投资决策的趋势、相关性和异常情况。同样，银行可以使用`EDA`技术来检测可疑交易并防止欺诈活动。\n\
    \n*   **步骤 1：收集数据**\n    银行收集交易数据，包括交易金额、账户详情、地点和时间戳。\n*   **步骤 2：数据清洗**\n   \
    \ 通过去除任何不一致之处来清洗数据。\n*   **步骤 3：探索**\n    使用箱线图和散点图，你可以查找交易金额或频率中的异常值。活动异常激增或地理位置相距遥远的交易可能预示着欺诈。\n\
    \    热力图用于分析交易特征（如交易频率和地点）之间的相关性，以检测偏离常规的可疑模式。\n*   **步骤 4：可操作洞察**\n    银行可以将异常情况标记出来以进行进一步调查，并使用基于`EDA`洞察训练的机器学习模型来协助实时自动化欺诈检测。\n\
    \n### Manufacturing\n\n在制造业中，`EDA`可用于优化生产流程、改进质量控制和减少停机时间。例如，一家制造公司可以分析来自生产设备的传感器数据，以识别导致机器故障或缺陷的因素。这种分析有助于确定维护任务的优先级、最大限度地减少生产中断并提高整体效率。\n\
    \n*   **步骤 1：收集数据**\n    制造公司收集机器的传感器数据，包括温度、振动水平和速度。\n*   **步骤 2：数据清洗**\n   \
    \ 你清洗数据，确保各台机器之间的时间戳和传感器数据是对齐的。\n*   **步骤 3：探索**\n    使用折线图，你可以追踪一段时间内的性能表现，以识别机器性能何时以及为何偏离常态（例如，在发生故障前温度逐渐升高）。\n\
    \    使用散点图和热力图来寻找机器故障事件与特定传感器读数之间的相关性。此分析可能揭示，超过某个温度阈值的机器更有可能发生故障。\n*   **步骤 4：可操作洞察**\n\
    \    基于这些发现，公司可以实施预测性维护计划，在机器发生故障前维修或更换部件，从而最大限度地减少停机时间并提高生产效率。\n\n### 结论\n\n\
    总之，`EDA`是数据分析、数据科学和人工智能中的一个重要步骤。它有助于揭示数据集中的模式、趋势和关系。`EDA`涉及多种技术，包括数据可视化和统计分析，这些技术共同使你能更深入地理解数据。诸如`Python`、`R`和`Power\
    \ BI`之类的工具提供了有效执行`EDA`所需的功能。这为更复杂的可视化和预测性分析奠定了基础。\n\n通过利用`EDA`，我们可以识别异常并理解变量之间的相关性。在此阶段获得的洞察对于做出明智的决策、完善假设以及确保后续分析的准确性和相关性来说是无价的。\n\
    \n通过`EDA`，数据揭示了一个故事。这引导分析师、科学家、工程师和利益相关者走向有意义且可操作的洞察，这些洞察推动了更好的商业决策、科学发现以及跨领域的创新解决方案。随着我们向前发展，拥抱`EDA`的原则和实践将继续对于释放数据的全部潜力至关重要。接下来，我们将讨论机器学习模型。"
  raw: '### Retail Industry


    In the retail sector, EDA can be used to analyze customer purchase behavior, optimize
    product placement, and identify trends. For instance, a retail company like Macy’s
    may perform EDA on sales data to uncover seasonal patterns, identify bestselling
    products, and segment customers based on purchasing habits. This information can
    inform inventory management strategies and marketing campaigns.


    *   Step 1: Collect Data


    *   A retail company like Macy’s collects data on sales transactions, including
    customer demographics, product purchases, dates of transactions, and total sales
    amounts.


    *   Step 2: Data Cleaning


    *   You can clean the data by handling missing values, removing duplicate entries,
    and ensuring consistency like product names and customer demographics.


    *   Step 3: Exploration


    *   You can create descriptive statistics and visualizations such as bar charts
    to understand the sales distribution across product categories and histograms
    to explore the frequency of purchases across seasons.


    *   Using time series analysis and line charts, you can identify seasonal patterns
    in sales (e.g., peak sales during holiday seasons). You can also use box plots
    to analyze variations in sales data by region or customer age group.


    *   Clustering techniques can be used to group customers based on purchasing behavior.
    Scatter plots and heatmaps can be used to visualize relationships between demographics
    (e.g., age, income) and purchasing frequency.


    *   Step 4: Actionable Insights


    *   Based on the insights, Macy’s can optimize inventory for high-demand products
    during peak seasons and create targeted marketing campaigns for different customer
    segments.


    ### Healthcare


    EDA can be key in analyzing patient data, identifying risk factors, and improving
    patient outcomes. For example, a hospital can conduct EDA on electronic health
    records to identify correlations between patient demographics, medical history,
    and treatment outcomes. This analysis can help healthcare providers tailor treatments
    and interventions to individual patient needs. They can also use EDA to analyze
    the number of patients admitted to the hospital annually. This analysis can help
    hospitals understand the staffing requirements needed throughout the year.


    *   Step 1: Collect Data


    *   A hospital collects patient data, including demographics (e.g., age, gender),
    medical history, diagnosis, and treatment outcomes.


    *   Step 2: Data Cleaning


    *   The hospital ensures the data is accurate by removing duplicates and filling
    in missing values where appropriate.


    *   Step 3: Exploration


    *   Using correlation matrices and heatmaps, analysts examine how various patient
    demographics correlate with treatment outcomes, identifying which factors (e.g.,
    age, preexisting conditions) are strongly associated with recovery times.


    *   Scatter plots and box plots can be used to explore how different risk factors
    (e.g., high blood pressure, smoking) are distributed among patients with different
    outcomes, revealing which groups are at higher risk.


    *   The hospital can also analyze yearly admission rates, using line charts and
    histograms to forecast staffing needs and resource allocation throughout the year.


    *   Step 4: Actionable Insights


    *   The hospital can use some of this analysis to tailor treatment plans to patient
    risk profiles. For example, patients with certain risk factors may receive more
    extensive monitoring or preventative care.


    ### Finance


    EDA can be utilized in the finance industry for risk management, fraud detection,
    and investment analysis. Investment firms can perform EDA on financial market
    data to identify trends, correlations, and anomalies that could impact investment
    decisions. Similarly, banks can use EDA techniques to detect suspicious transactions
    and prevent fraudulent activities.


    *   Step 1: Collect Data


    *   A bank collects transaction data, including transaction amounts, account details,
    locations, and timestamps.


    *   Step 2: Data Cleaning


    *   The data is cleaned by removing any inconsistencies.


    *   Step 3: Exploration


    *   Using box plots and scatter plots, you can look for outliers in transaction
    amounts or frequency. Unusual spikes in activity or geographically distant transactions
    may signal fraud.


    *   Heatmaps are used to analyze correlations between transaction characteristics,
    such as transaction frequency and location, to detect suspicious patterns that
    deviate from the norm.


    *   Step 4: Actionable Insights


    *   The bank can flag anomalies for further investigation and use machine learning
    models trained on the insights from EDA to assist in automating fraud detection
    in real time.


    ### Manufacturing


    In manufacturing, EDA can be used to optimize production processes, improve quality
    control, and reduce downtime. For example, a manufacturing company may analyze
    sensor data from production equipment to identify factors contributing to machine
    failures or defects. This analysis can help prioritize maintenance tasks, minimize
    production disruptions, and enhance overall efficiency.


    *   Step 1: Collect Data


    *   A manufacturing company collects sensor data from machines, including temperature,
    vibration levels, and speed.


    *   Step 2: Data Cleaning


    *   You clean the data, ensuring that timestamps and sensor data are aligned across
    machines.


    *   Step 3: Exploration


    *   Using line charts, you can track performance over time to identify when and
    why a machine’s performance deviates from the norm (e.g., gradual increase in
    temperature before failing).


    *   Scatter plots and heatmaps are used to find correlations between machine failure
    events and specific sensor readings. This analysis might reveal that machines
    that exceed a certain temperature threshold are more likely to fail.


    *   Step 4: Actionable Insights


    *   Based on these findings, the company can implement predictive maintenance
    schedules, repairing or replacing parts before machines fail, minimizing downtime,
    and improving production efficiency.


    ## Conclusion


    In conclusion, EDA is an important step in data analytics, data science, and artificial
    intelligence. It helps uncover patterns, trends, and relationships within a dataset.
    EDA involves various techniques, including data visualizations and statistical
    analysis, which together enable you to gain a deeper understanding of the data.
    Tools such as Python, R, and Power BI provide the necessary functionality to effectively
    perform EDA. This sets the stage for sophisticated visualizations and predictive
    analysis.


    By utilizing EDA, we can identify anomalies and understand correlations between
    variables. The insights gained during this phase are invaluable for making informed
    decisions, refining hypotheses, and ensuring the accuracy and relevance of subsequent
    analysis.


    Through EDA, data reveals a story. This guides analysts, scientists, engineers,
    and stakeholders toward meaningful and actionable insights that drive better business
    decisions, scientific discoveries, and innovative solutions across various fields.
    As we move forward, embracing the principles and practices of EDA will continue
    to be essential in unlocking the full potential of data. Next, we will talk about
    machine learning models.'
  trans: "\n### 零售行业\n\n在零售行业，`EDA`可用于分析客户购买行为、优化产品布局和识别趋势。例如，像梅西百货这样的零售公司可以对销售数据进行`EDA`，以发现季节性模式、识别畅销产品，并根据购买习惯对客户进行细分。这些信息可以为库存管理策略和营销活动提供参考。\n\
    \n*   **步骤 1：收集数据**\n    像梅西百货这样的零售公司会收集销售交易数据，包括客户人口统计信息、产品购买情况、交易日期和总销售金额。\n\
    *   **步骤 2：数据清洗**\n    你可以通过处理缺失值、删除重复条目以及确保产品名称和客户人口统计信息等数据的一致性来清洗数据。\n*   **步骤\
    \ 3：探索**\n    你可以创建描述性统计和可视化图表（如条形图）来了解各产品类别的销售分布，并使用直方图来探索跨季节的购买频率。\n    通过时间序列分析和折线图，你可以识别销售中的季节性模式（例如，假期季节的销售高峰）。你还可以使用箱线图来分析按地区或客户年龄组划分的销售数据变化。\n\
    \    聚类技术可用于根据购买行为对客户进行分组。可以使用散点图和热力图来可视化人口统计信息（例如年龄、收入）与购买频率之间的关系。\n*   **步骤\
    \ 4：可操作洞察**\n    基于这些洞察，梅西百货可以优化旺季时高需求产品的库存，并为不同的客户群创建有针对性的营销活动。\n\n### 医疗保健\n\
    \n`EDA`在分析患者数据、识别风险因素和改善患者预后的过程中可以发挥关键作用。例如，一家医院可以对电子健康记录进行`EDA`，以识别患者人口统计信息、病史和治疗结果之间的相关性。这种分析可以帮助医疗保健提供者为个体患者量身定制治疗和干预措施。他们还可以利用`EDA`来分析每年入院患者数量。这种分析有助于医院了解全年所需的员工配置。\n\
    \n*   **步骤 1：收集数据**\n    医院收集患者数据，包括人口统计信息（例如年龄、性别）、病史、诊断和治疗结果。\n*   **步骤 2：数据清洗**\n\
    \    医院通过删除重复项并适当填充缺失值来确保数据的准确性。\n*   **步骤 3：探索**\n    分析人员使用相关矩阵和热力图来检查各种患者人口统计信息与治疗结果之间的关系，从而识别出哪些因素（例如年龄、既往病史）与恢复时间强相关。\n\
    \    可以使用散点图和箱线图来探索不同风险因素（例如高血压、吸烟）在不同治疗结果的患者中的分布情况，揭示哪些群体面临更高风险。\n    医院还可以使用折线图和直方图分析每年的入院率，以预测全年的人员配置需求和资源分配。\n\
    *   **步骤 4：可操作洞察**\n    医院可以利用这些分析的部分结果为患者风险状况定制治疗计划。例如，具有某些风险因素的患者可能会接受更广泛的监测或预防性护理。\n\
    \n### 金融\n\n在金融行业，`EDA`可用于风险管理、欺诈检测和投资分析。投资公司可以对金融市场数据进行`EDA`，以识别可能影响投资决策的趋势、相关性和异常情况。同样，银行可以使用`EDA`技术来检测可疑交易并防止欺诈活动。\n\
    \n*   **步骤 1：收集数据**\n    银行收集交易数据，包括交易金额、账户详情、地点和时间戳。\n*   **步骤 2：数据清洗**\n   \
    \ 通过去除任何不一致之处来清洗数据。\n*   **步骤 3：探索**\n    使用箱线图和散点图，你可以查找交易金额或频率中的异常值。活动异常激增或地理位置相距遥远的交易可能预示着欺诈。\n\
    \    热力图用于分析交易特征（如交易频率和地点）之间的相关性，以检测偏离常规的可疑模式。\n*   **步骤 4：可操作洞察**\n    银行可以将异常情况标记出来以进行进一步调查，并使用基于`EDA`洞察训练的机器学习模型来协助实时自动化欺诈检测。\n\
    \n### 制造业\n\n在制造业中，`EDA`可用于优化生产流程、改进质量控制和减少停机时间。例如，一家制造公司可以分析来自生产设备的传感器数据，以识别导致机器故障或缺陷的因素。这种分析有助于确定维护任务的优先级、最大限度地减少生产中断并提高整体效率。\n\
    \n*   **步骤 1：收集数据**\n    制造公司收集机器的传感器数据，包括温度、振动水平和速度。\n*   **步骤 2：数据清洗**\n   \
    \ 你清洗数据，确保各台机器之间的时间戳和传感器数据是对齐的。\n*   **步骤 3：探索**\n    使用折线图，你可以追踪一段时间内的性能表现，以识别机器性能何时以及为何偏离常态（例如，在发生故障前温度逐渐升高）。\n\
    \    使用散点图和热力图来寻找机器故障事件与特定传感器读数之间的相关性。此分析可能揭示，超过某个温度阈值的机器更有可能发生故障。\n*   **步骤 4：可操作洞察**\n\
    \    基于这些发现，公司可以实施预测性维护计划，在机器发生故障前维修或更换部件，从而最大限度地减少停机时间并提高生产效率。\n\n### 结论\n\n\
    总之，`EDA`是数据分析、数据科学和人工智能中的一个重要步骤。它有助于揭示数据集中的模式、趋势和关系。`EDA`涉及多种技术，包括数据可视化和统计分析，这些技术共同使你能更深入地理解数据。诸如`Python`、`R`和`Power\
    \ BI`之类的工具提供了有效执行`EDA`所需的功能。这为更复杂的可视化和预测性分析奠定了基础。\n\n通过利用`EDA`，我们可以识别异常并理解变量之间的相关性。在此阶段获得的洞察对于做出明智的决策、完善假设以及确保后续分析的准确性和相关性来说是无价的。\n\
    \n通过`EDA`，数据揭示了一个故事。这引导分析师、科学家、工程师和利益相关者走向有意义且可操作的洞察，这些洞察推动了更好的商业决策、科学发现以及跨领域的创新解决方案。随着我们向前发展，拥抱`EDA`的原则和实践将继续对于释放数据的全部潜力至关重要。接下来，我们将讨论机器学习模型。\n"
- fmt: '# 5. Machine Learning Models


    Artificial intelligence (AI) is about making computer systems smart enough to
    do tasks that usually require human thinking, like understanding speech, making
    decisions, and spotting patterns. AI is an umbrella term that includes different
    technologies, such as machine learning and natural language processing.


    ![](images/613832_1_En_5_Chapter/613832_1_En_5_Fig1_HTML.jpg)


    Figure 5-1


    Image from the [“AI-ML-DML-GEN AI - LLM sorting according to prices” blog in LinkedIn
    Pulse](https://www.linkedin.com/pulse/ai-ml-dml-gen-ai-llm-sorting-according-prices-moselhy-ibrahim-bakr-7mz2f/),
    showing the hierarchical relationship between artificial intelligence (AI), machine
    learning (ML), deep learning (DL), and large language models (LLMs) ([Untitled
    photograph of relationship between AI, ML, and DL], 2024, April 23)


    In this chapter, we will focus on machine learning. Machine learning models represent
    a pivotal component in the realm of artificial intelligence. These models empower
    systems to learn from data, identify patterns, and make decisions with minimal
    human intervention. They have transformed industries by providing unprecedented
    capabilities in automation and prediction. The ability to automate complex processes
    and derive actionable insights from vast datasets has revolutionized numerous
    sectors, from healthcare and finance to retail and transportation.


    Machine learning is connected with the fields of data analytics and data science,
    which focus on collecting, processing, and analyzing data, as discussed in the
    previous chapters. Data science provides the tools and techniques to extract meaningful
    insights from raw data, while machine learning leverages these insights to make
    predictions and drive decision-making. The role of data analytics becomes particularly
    evident when analyzing large datasets, identifying trends, and ensuring that we
    have representative data that the model will encounter in the real world during
    the training phase. This helps in creating models that not only predict but also
    understand the intricate relationships within the data.


    In this sense, data science, data analytics, and machine learning go hand in hand:
    data analytics and data science help us understand and interpret the data, while
    machine learning helps us act on it by making predictions and automating decisions.


    Ensuring the proficiency of machine learning models is contingent upon the quality
    of the training data. A well-constructed and curated dataset serves as the bedrock
    for machine learning algorithms to discern patterns, grasp intricate relationships,
    and comprehend nuance information. Consequently, the resultant models are better
    equipped to make predictions that align with the underlying complexities inherent
    in the data.


    ## Introduction to Machine Learning Models


    Machine learning models are the cornerstone of modern data science. They drive
    advancements across a wide range of industries by enabling components to learn
    from data and make decisions or predictions without being explicitly programmed.
    These models can automatically improve their performance with experience, making
    them compelling tools for complex problems.


    Before we continue, let me explain the difference between machine learning models
    and algorithms. Machine learning algorithms and models are incorrectly used interchangeably,
    which can be confusing for beginners.


    An algorithm is a set of steps designed to accomplish a task. In machine learning,
    algorithms are procedures that run on datasets to recognize patterns and rules.
    Think of the algorithm as the process and the model as the final product that
    results from the process. The model learns from the dataset using the algorithm.
    Another way of saying it is the model is fitted to the dataset. The output of
    all of this is a machine learning model that captures these patterns. You can
    think of a model like an application or program that you can use to input data
    to make predictions or decisions. The algorithm is what enables the model to learn,
    but once the learning is done, the model stands alone as the tool for making future
    predictions or decisions on new, unseen data.


    These models create predictions that can help make data-driven decisions for your
    business.


    `Machine Learning Model = Data + Algorithm`


    At its core, machine learning involves training models on a dataset using algorithms
    to recognize patterns and relationships within the data. This process enables
    the model to make predictions or decisions when presented with new, unseen data.
    Depending on how well the model was trained, the model will make predictions with
    a certain level of accuracy and confidence. There are several types of machine
    learning algorithms, each suited to different kinds of tasks:


    ### Supervised Learning


    Machine learning models are trained using labeled data. This means the data is
    tagged with the correct answers. Think of this like the model is learning with
    a teacher. The data contains the inputs and the correct outputs to help the model
    learn faster.


    Let’s say you want to train a machine learning model to predict the value of a
    used Lamborghini.


    You would have a dataset used to train the model with known input and output values.
    For example, the data could include:


    - Mileage

    - Model (e.g., Sedan, SUV, etc.)

    - Color

    - Fuel Type (e.g., Diesel, Hybrid, Electric, Gasoline)

    - Pricing


    The inputs to the model would be mileage, model, color, and fuel type, and the
    output would be pricing.


    Once the model has been fitted to the dataset or, in other words, has learned
    from this dataset, a trained machine learning model using the supervised algorithm
    is outputted. You can give this model new data that it has not seen before and
    get a prediction on what the pricing of the car would be. There are various types
    of supervised learning algorithms.


    #### Types of Supervised Learning Algorithms


    **Regression**


    Regression algorithms predict continuous variables such as pricing or temperature.


    Examples of Supervised Learning Algorithms for Regression:

    - `Linear Regression`

    - `Random Forest Regression`

    - `Decision Tree Regression`

    - `Support Vector Regression`


    **Classification**


    Classification algorithms predict discrete variables such as:

    - Yes or No

    - 0 and 1

    - Red, Purple, Blue

    - True or False


    The prediction is categorized into a distinct set of choices.


    Examples of Supervised Learning Algorithms for Classification:

    - `Support Vector Classification`

    - `K-Nearest Neighbors (KNN)`

    - `Logistic Regression`

    - `Decision Tree Classification`

    - `Random Forest Classification`


    #### Use Cases of Supervised Learning


    - Time Series Market Analysis

    - Customer Analytics

    - Human Resource Allocation


    ### Unsupervised Learning'
