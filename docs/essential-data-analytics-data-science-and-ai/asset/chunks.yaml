  trans: '

    # ETL 简介


    ETL（提取、转换和加载）是创建高效机器学习算法的基础。ETL 是一个三步数据集成过程（如图 3-1 所示），其中数据从一个或多个数据源提取，经过转换（清洗、整理、格式化），然后加载到数据库中。


    ![](img/613832_1_En_3_Fig1_HTML.jpg)


    图 3-1


    ETL 管道的示意图


    市面上有多种具备友好用户界面的 ETL 工具可供选择，帮助你完成这些任务。不过，Python 也有许多开源 ETL 工具同样能胜任这些工作。其中，数据科学家社区中一个非常流行的工具是
    `Pandas`。


    在 ETL 的转换步骤中，探索性数据分析（EDA）和数据清洗是需要执行的重要任务，用于识别并移除诸如错误、损坏、重复或不一致的数据。


    ## ETL 的重要性


    ETL 过程在确保数据（通常来自各种不同且不相关的源头）被统一成一致结构方面发挥着关键作用。随着企业从不同渠道、系统和应用积累信息，这些数据可能以不同的格式和结构存在。ETL
    是一座桥梁，它将这种异构数据标准化，解决不一致性，并将其转换为标准格式。通过实施一致的结构，公司可以消除因不同数据源而产生的冗余、错误和差异。这种标准化不仅促进了无缝集成，还提高了整个组织内信息的可访问性。


    此外，ETL 通过将来自不同部门或系统的信息整合到集中的数据仓库或数据库中，帮助企业打破数据孤岛。这种整合简化了数据检索和分析，提供了组织运营的全面统一视图。因此，不同部门的团队都依赖一个单一、可靠的信息源，从而促进协作并实现更高效的决策流程。


    通过 ETL 过程获得的标准化和集中化数据，构成了数据驱动决策的基础。借助格式一致的整合数据集，企业能够提取有意义的见解、识别趋势并获得可操作的智能。这种新获得的清晰度使利益相关者能够依据准确、最新的信息做出明智的决策。从战略规划到运营调整，公司都能基于对数据的更深理解来调整其行动，从而培养一种基于证据决策的文化。


    此外，ETL 便于进行历史数据追踪，使公司能够监控和评估其随时间推移的绩效。通过分析历史趋势和模式，企业可以识别需要改进的领域，评估战略举措的影响，并优化其运营。数据提取、转换和加载的持续循环不仅支持日常决策，也为长期业务优化奠定了基础，确保在不断变化的商业环境中保持适应性。本质上，ETL
    使组织不仅能够理解其当前状态，还能在数据驱动的未来中发展和繁荣。以下是 ETL 带来的一些关键价值的总结：


    *   **单一视角**


    在当今的商业环境中，数据通常分散在各个系统和应用中，因此要全面了解你的业务是一项挑战。认识到 ETL 在数据集成中的重要性，可以使你利用 ETL，促进来自不同来源数据的整合和分析，从而对你的业务获得更全面的视图。


    *   **流程自动化**


    ETL 简化了重复性的数据处理任务，以提高分析效率。ETL 工具能够自动化数据迁移，并集成定期或按需的数据更新。这使得数据工程师能够将更少的时间花在数据移动和转换等日常任务上。


    *   **数据治理**


    数据治理关注数据的有效性、可访问性、一致性、完整性和安全性。ETL 通过在源系统和目标系统之间引入一个抽象层，从而在支持数据治理方面发挥作用，进而维护数据的安全性和血统。数据治理的重要性日益凸显，因为它促进了数据民主，提高了数据可访问性，并使所有利益相关者都能将其用于业务分析。


    *   **可扩展性**


    随着数据量和数据复杂性的增加，ETL 在数据集成中的重要性对于旨在保持竞争力的公司变得越来越关键。能够扩展 ETL 管道可确保海量数据的顺利提取、转换和加载。因此，公司能够有效处理不断增长的数据流入，而无需频繁升级系统，确保数据及时可用于分析和报告，并维持系统的功能性。可扩展性可以通过多种方法实现，包括分布式处理、并行处理、数据分区以及利用云解决方案。


    *   **快速检索**


    作为业务用户，高效地检索大量集成且精炼的数据，以支持决策制定。由于 ETL 工具在数据转换过程中处理了大部分工作，导入的数据在进入数据存储时已经是可用的格式。凭借清晰定义的视图，你的商业智能应用可以更快速地生成报告，因为在查询数据库时无需处理复杂的合并、连接记录或维护格式化标准问题。


    *   **最大限度减少人为错误**


    尽管付出努力，但手动管理数据会让你面临错误风险。数据处理早期阶段的一个小疏忽可能会导致重大后果。这是因为一个错误可能引发一连串更大的错误，形成恶性循环。认识到
    ETL 解决方案的重要性后，许多组织已采用自动化来减少人工干预及相关的错误风险，确保提供高质量的数据。


    *   **提升质量与统一性**


    ETL 利用数据清洗和转换技术，帮助检测并纠正错误、不一致性及其他数据问题。这提升了决策所需的数据质量、可靠性、准确性和可信赖度。

    '
- fmt: '# ETL Tools and Techniques


    Over the years, the landscape of ETL has gone a remarkable evolution, driven by
    the increasing complexity and diversity of data sources as well as the growing
    demand for efficient data integration solutions. Initially, ETL processes were
    often custom coded, which required significant development effort and expertise.
    However, as the need for more scalable, user-friendly, and adaptable solutions
    emerged, a variety of specialized ETL tools entered the market.


    These tools vary widely in their functionalities, catering to different business
    needs and technical requirements. Enterprise ETL solutions provide comprehensive
    features and robust support, making them suitable for large-scale data integration
    projects. These tools often come with advanced capabilities such as data quality
    management and real-time data integration addressing the intricate challenges
    posed by modern data environments.


    In parallel, the rise of open source ETL tools has democratized the data integration
    landscape, offering cost-effective alternatives with a strong community-driven
    development model. Tools like `Apache Kafka` and `Keboola` exemplify the flexibility
    and customization possibilities that open source solutions bring to the table.
    These tools not only provide powerful ETL capabilities but also encourage collaboration
    and innovation within the community.


    Additionally, the demand for tailored solutions led to the development of custom
    ETL solutions, where organizations build in-house tools to precisely fit their
    unique requirements. This approach is particularly common when businesses have
    specific data integration needs or workflows that are not readily addressed by
    off-the-shelf solutions. While custom solutions offer a high degree of customization,
    they also require ongoing maintenance and may lack some of the out-of-the-box
    features present in commercial ETL tools.


    In essence, the diverse array of ETL tools available today reflects the dynamic
    nature of the data integration landscape. Whether organizations opt for enterprise
    solutions for comprehensive support, leverage the collaborative power of open
    source tools, or develop custom solutions for specialized needs, the evolving
    ecosystem of ETL tools continues to play a crucial role in helping businesses
    unlock the future potential of their data.


    ## Enterprise Software ETL


    In the expansive domain of data integration, numerous companies offer commercial
    ETL software, distinguished by their user-friendly Graphical User Interfaces (GUIs).
    These GUIs are designed to simplify the complexity of designing and executing
    ETL pipelines, providing an intuitive drag-and-drop interface that eliminates
    the need for intricate coding.


    This visual approach not only democratizes the ETL process, enabling a broader
    range of professionals to actively participate, but also enhances the comprehension
    of the entire workflow. Commercial ETL tools with GUIs often come equipped with
    pre-built connectors and transformations, accelerating pipeline development and
    facilitating swift adaptations to evolving data requirements.


    With features such as scheduling and monitoring, these tools streamline data integration,
    contributing to the overall efficiency of organizations in managing diverse and
    complex data ecosystems. Below are examples of enterprise software ETL solutions:

    - `Informatica PowerCenter`

    - `IBM InfoSphere DataStage`

    - `Oracle Data Integrator`


    ## Open Source ETL


    Commercial ETL software often comes with a significant price tag, making it a
    considerable investment for organizations seeking advanced data integration capabilities.
    However, in contrast, open source tools provide cost-effective alternatives as
    they are freely available to use. This accessibility democratizes the utilization
    of ETL capabilities, allowing businesses with budget constraints to benefit from
    powerful data integration tools. One of the key advantages of open source ETL
    tools lies in their inherit flexibility. Users with programming expertise can
    delve into the source code, customizing and tailoring the tool to meet specific
    requirements. This level of adaptability is particularly advantageous for organizations
    with unique data processing needs, as it enables them to fine-tune the ETL processes
    according to the intricacies of their data landscape. The open nature of the source
    code fosters a collaborative community, encouraging knowledge sharing and innovation
    as users contribute to the enhancement of the tool’s features and functionalities.
    Overall, the availability and the adaptability of open source ETL tools not only
    mitigate financial constraints but also empower users to have greater control
    over the customization and optimization of their data integration workflows. Below
    are examples of open source ETL solutions:

    - `Keboola`

    - `Talend Open Studio for Data Integration`

    - `Apache Kafka`


    ## Custom ETL


    For those seeking unparalleled flexibility in their data integration processes,
    the option of creating custom ETL tools tailored to specific needs becomes an
    enticing concept. Leveraging programming languages like `Python`, individuals
    and organizations can embark on the creation of bespoke solutions that precisely
    align with their unique requirements. This approach, while offering the utmost
    adaptability, demands a substantial investment of effort. Building a custom ETL
    tool entails not only the initial coding but also the creation of comprehensive
    documentation to ensure clarity and accessibility for future users and developers.
    The responsibility doesn’t end with the initial development; ongoing maintenance
    is crucial to address evolving data landscapes and changing requirements. Rigorous
    testing becomes imperative to guarantee the tool’s reliability, scalability, and
    performance. Despite the efforts involved, the creation of custom ETL tools provides
    unmatched level of control and customization, allowing for seamless integration
    of data in a manner that aligns precisely with the objectives and intricacies
    of the organization’s data ecosystem. Below are examples of programming languages
    you can use to create custom ETL solutions:

    - `SQL`

    - `Spark`

    - `Python`


    ## ETL Cloud Service Tools


    Data within cloud services, such as `Amazon Web Services (AWS)`, `Azure`, or `Google
    Cloud Platform (GCP)`, is accompanied by robust and integrated ETL tools native
    to these platforms. These cloud-based ETL solutions offer seamless and comprehensive
    approach to handling data workflows within the cloud environment. In `AWS`, for
    instance, services like `AWS Glue` empower users to extract, transform, and load
    data efficiently, providing not only a scalable and serverless architecture but
    also automated data discovery and schema evolution. `Azure`’s ETL offerings, including
    `Azure Data Factory`, streamline the movement of data across various services,
    facilitating the creation of data pipelines for diverse scenarios such as analytics,
    reporting, and machine learning. Similarly, `GCP` offers tools like `Cloud Dataflow`,
    providing a fully managed service for ETL processing with `Apache Beam`, enabling
    parallel data processing scale. Leveraging these integrated ETL tools within cloud
    services simplifies the orchestration of data workflows, optimizes performance,
    and takes advantage of the scalability elastically inherent in cloud computing
    environments, ultimately contributing to a more efficient and streamlined data
    management process. Below are examples of cloud ETL solutions:

    - `AWS Glue`

    - `Azure Data Factory`

    - `Google Cloud Dataflow`


    ## EXAMPLE WITH CODE


    The following example I will do using `Python`. To follow along, you can use software
    applications like `Jupyter Notebooks`, `Google Colab`, or even `Visual Studio
    Code`, which are all free.


    `Pyjanitor` is an open source tool in `Python` used to clean datasets. The advantage
    of this tool is that it provides an easier-to-read, verb-based method chaining
    API for common `Pandas` routines. This helps to make writing code cleaner and
    easier to remember.


    ### Installation


    Install `pyjanitor` by running the command below:


    ```

    !pip3 install pyjanitor==0.28.1

    !pip3 install pandas==2.2.2

    ```


    ### Implementation


    1. Import required libraries.


    We will import `pandas` to extract the data and help with data analysis. `Pyjanitor`
    is used to clean data.


    ```

    import pandas as pd

    import janitor

    ```


    2. Extract.


    In this example, the goal is to provide quality data to a machine learning model
    of a movie recommendation system so that it can predict relevant recommendations
    for a user. There are many types of information that can be used. However, to
    keep this example simple, we will use data that only contains ratings on movies
    from existing users in our system. This data is in a CSV file called `ratings.csv`.


    We are going to extract the data from the CSV file and put it into a `pandas`
    `DataFrame` so that we can start the transformation process using `pyjanitor`.


    ```

    rating_data = pd.read_csv("ratings.csv", skipinitialspace = True, header = None)

    ```


    Our initial data contains 14,051,752 ratings from users on different movies at
    different times, as seen in Figure [3-2](#613832_1_En_3_Chapter.xhtml#Fig2).


    ![](images/613832_1_En_3_Chapter/613832_1_En_3_Fig2_HTML.jpg)


    Figure 3-2


    Image of initial movie ratings


    ```

    rating_data

    ```


    3. Transform.


    Now let’s do some analysis and cleaning of the data.


    First, we will change the column names to make it easier to read by using the
    `pyjanitor` `rename_column` function. `Pyjanitor.rename_column()` can only change
    one column at a time so we will be using method chaining to change all four columns.


    ```

    rating_data = (rating_data

    .rename_column(0, ''date/time'')

    .rename_column(1, ''user_id'')

    .rename_column(2, ''movie_id'')

    .rename_column(3, ''rating''))

    ```


    We are only expecting ratings to be an integer between 1 and 5. However, through
    our initial analysis, we see there are 28 unique ratings in our data, as seen
    in Figure [3-3](#613832_1_En_3_Chapter.xhtml#Fig3) in the second row of the last
    column.


    ![](images/613832_1_En_3_Chapter/613832_1_En_3_Fig3_HTML.jpg)


    Figure 3-3


    Image of the summary of columns in data


    ```

    rating_data.describe()

    ```


    Further analysis shows there is a mix of strings and integers that are in the
    file, as seen in Figure [3-4](#613832_1_En_3_Chapter.xhtml#Fig4). For example,
    `5` was entered as a number and a text. There are clearly some corrupt data within
    this file that should be removed.


    ![](images/613832_1_En_3_Chapter/613832_1_En_3_Fig4_HTML.jpg)


    Figure 3-4


    Image of unique ratings


    ```

    rating_data["rating"].unique()

    ```


    In Figure [3-5](#613832_1_En_3_Chapter.xhtml#Fig5), we see the number of times
    different ratings appeared. A rating of `E` was entered 332 times.


    ![](images/613832_1_En_3_Chapter/613832_1_En_3_Fig5_HTML.jpg)


    Figure 3-5


    Image of the number of times ratings are shown in data


    More analysis shows that the `user_id` column has a mixture of integers and text,
    as seen in Figure [3-7](#613832_1_En_3_Chapter.xhtml#Fig7). We are expecting `user_id`s
    to be only integers. We would also like to have the date and time each rating
    was entered to be in a datetime format as opposed to text, as seen in Figure [3-6](#613832_1_En_3_Chapter.xhtml#Fig6).


    ![](images/613832_1_En_3_Chapter/613832_1_En_3_Fig6_HTML.jpg)


    Figure 3-6


    Summary type of data date and time is in


    ```

    rating_data["date/time"].apply(type).value_counts()

    ```


    ![](images/613832_1_En_3_Chapter/613832_1_En_3_Fig7_HTML.jpg)


    Figure 3-7


    Summary type of data user id is in


    ```

    rating_data["user_id"].apply(type).value_counts()

    ```


    ![](images/613832_1_En_3_Chapter/613832_1_En_3_Fig8_HTML.jpg)


    Figure 3-8


    Summary type of data movie id is in


    ```

    rating_data["movie_id"].apply(type).value_counts()

    ```


    ![](images/613832_1_En_3_Chapter/613832_1_En_3_Fig9_HTML.jpg)


    Figure 3-9


    Summary type of ratings is in


    ```

    rating_data["rating"].apply(type).value_counts()

    ```


    The `user_id` and `rating` columns will need to be converted into integers. We
    can do this using the `pyjanitor.change_type()` function. We will also change
    the format of the date and time from a string to a datetime format. Anything that
    cannot be converted will be turned into a `NaN` and will be removed from the file.


    All these steps will be completed using method chaining.


    ```

    rating_data = (rating_data

    .change_type("rating", dtype=int, ignore_exception="fillna")

    .change_type("user_id", dtype=int, ignore_exception="fillna")

    .to_datetime("date/time", format=" ISO8601", errors="coerce")

    .dropna()

    .reset_index(drop = True))

    ```


    Let’s look at the values within the rating column after completing the step above.
    Ratings like `E`, `F`, `G`, and `Q4` have been removed from our data. Ratings
    like `1` have increased. Initially we had a number version of `1` that appeared
    8195 times and text version that appeared 1312 times. Now there is only one version
    that appears 9507 times. This indicates we were able to convert text to numbers.
    Anything that was not a number, like `E` or `Q4`, was removed.


    Let’s look at the first five rows (Figure [3-10](#613832_1_En_3_Chapter.xhtml#Fig10))
    of our data to see how the other columns were reformatted. `Rating` and `user_id`
    were converted to numbers, and `date/time` was converted to a datetime format.


    ![](images/613832_1_En_3_Chapter/613832_1_En_3_Fig10_HTML.jpg)


    Figure 3-10


    Image of movie recommendation data


    ```

    rating_data.head(5)

    ```


    You may have noticed that `user_id` and `rating` are decimals (i.e., floats) instead
    of whole numbers (i.e., integers). This is because while we were converting text
    to integers in the previous steps, `NaN` values do not have an integer version
    so the data in the entire column are changed in floats. This is similar to how
    the `pandas.to_numeric()` function works. To fix this for both columns, we can
    use `change_type` and method chaining again.


    ```

    rating_data = (rating_data

    .change_type("rating", dtype=int, ignore_exception="fillna")

    .change_type("user_id", dtype=int, ignore_exception="fillna")

    .dropna()

    .reset_index(drop = True))

    ```


    Now if we look at the first five rows (Figure [3-11](#613832_1_En_3_Chapter.xhtml#Fig11)),
    we can see that data in `user_id` and `rating` columns are now in integer format.


    ![](images/613832_1_En_3_Chapter/613832_1_En_3_Fig11_HTML.jpg)


    Figure 3-11


    Image of movie recommendation data


    ```

    rating_data.head(5)

    ```


    4. Load.


    This exports the transformed data into a new `.csv` file which can be used in
    a machine learning algorithm.


    ```

    rating_data.to_csv("clean_rating_data.csv")

    ```'
