- fmt: "# AI Enhancing Human Capabilities\n\nAI’s true strength lies in its ability\
    \ to augment human intelligence and decision-making. By handling repetitive and\
    \ mundane tasks, AI frees up a person’s capacity for creativity, strategic thinking,\
    \ and problem-solving. For example, in business, AI can help identify patterns\
    \ in markets and products, enabling more informed decision-making. In healthcare,\
    \ AI can analyze and extract texts from documents to assist healthcare providers\
    \ in making decisions faster. In law, AI can assist in finding relevant legal\
    \ documents for their case in a sea of information.\n\nFurthermore, AI enhances\
    \ productivity across various sectors. In creative fields like design and music,\
    \ AI tools can assist artists in generating new ideas and overcoming creative\
    \ blocks. In research, AI can assist in accelerating discoveries by analyzing\
    \ complex datasets and identifying patterns that lead to breakthroughs. By augmenting\
    \ human capabilities, AI assists in fostering innovation and driving progress.\n\
    \nHowever, there are also downsides. Overreliance on AI for decision-making could\
    \ lead to a reduction of critical thinking and problem-solving skills, as people\
    \ may become too reliant on AI systems to perform tasks that require human judgment.\
    \ This is particularly concerning in areas like healthcare or law, where human\
    \ oversight is crucial to ensuring ethical decisions. Addressing these risks involves\
    \ ensuring that AI serves as a tool to complement, rather than replace, human\
    \ intelligence.\n\n# Successful AI Integration\n\n## Healthcare\n\n`Flo` is an\
    \ app focused on women’s health. It tracks menstrual cycles, ovulation, symptoms,\
    \ and more. The app uses a machine learning algorithm that leverages a person’s\
    \ previously recorded information, like age, period dates, and symptoms, to estimate\
    \ cycle length predictions. It also offers personalized content like videos and\
    \ articles to educate its end users. This content is reviewed by health and well-being\
    \ experts to ensure the information in that personalized content is trustworthy.\n\
    \n## Finance\n\n`Betterment` is a financial investment platform that uses AI to\
    \ create tailored profiles based on their financial plan. It uses algorithms to\
    \ automate trading, transactions, and portfolio management. It was founded in\
    \ 2008.\n\n## Consumer Goods\n\n`iRobot` is a consumer robot company. They created\
    \ an autonomous vacuum called the `Roomba`. It uses machine learning algorithms\
    \ to create maps of the owner’s property. This helps the vacuums avoid obstacles\
    \ while cleaning. The end users can also label points within the generated maps\
    \ in the app as “cleaning zones” to tell the `Roomba` to clean those specific\
    \ points. For example, if your employees had lunch in office room `HC`, you could\
    \ tell the `Roomba` to “clean under table `HC`.”\n\n# Addressing Common Fears\
    \ and Misconceptions\n\n## AI As a Threat to Privacy: Balancing Innovation with\
    \ Ethical Considerations\n\nAnother common concern is that AI poses a threat to\
    \ privacy. Data collection and analysis can lead to privacy issues if not managed\
    \ properly. However, it is crucial to balance innovation with ethical considerations.\
    \ Implementing robust data protection measures, cybersecurity requirements, and\
    \ transparent data usage policies can mitigate privacy risks. Moreover, ongoing\
    \ advancements in AI ethics, such as those mentioned in Chapter [10](#613832_1_En_10_Chapter.xhtml),\
    \ aim to ensure that AI systems respect user privacy and operate within ethical\
    \ boundaries.\n\n## The Myth of AI As an Uncontrollable Force\n\nEnsuring proper\
    \ oversight and regulation of AI development can help prevent unintended consequences\
    \ over AI systems. The EU AI Act and US Executive Order on AI are frameworks and\
    \ standards that are examples of regulations put in place to address AI-related\
    \ risks.\n\nAdditionally, the AI Alliance – an international community of researchers,\
    \ developers, and organizations – is actively working on building a community\
    \ to drive responsible AI innovation. Their efforts emphasize maintaining scientific\
    \ rigor while ensuring trust, safety, and diversity.\n\n# Responsible AI\n\nResponsible\
    \ AI is the approach of creating and deploying AI systems to ensure they align\
    \ with ethical principles, legal requirements, and societal values.\n\n# Understanding\
    \ Bias\n\nFigures [11-1](#613832_1_En_11_Chapter.xhtml#Fig1) to [11-6](#613832_1_En_11_Chapter.xhtml#Fig6)\
    \ shows some examples where AI systems have gotten it wrong … very wrong.\n\n\
    ![](images/613832_1_En_11_Chapter/613832_1_En_11_Fig6_HTML.jpg)\n\nFigure 11-6\n\
    \nAn image highlighting the dangers of relying on algorithms, demonstrating how\
    \ these systems can perpetuate loss of opportunities, economic loss, and social\
    \ stigmatization. This can increase inequality and social harm\n\n![](images/613832_1_En_11_Chapter/613832_1_En_11_Fig5_HTML.jpg)\n\
    \nFigure 11-5\n\nAn image showing the social injustice of a false facial recognition\
    \ match leading to the wrongful imprisonment of an innocent Black man. This emphasizes\
    \ the issues of racial bias in AI systems\n\n![](images/613832_1_En_11_Chapter/613832_1_En_11_Fig4_HTML.jpg)\n\
    \nFigure 11-4\n\nAn image showing Joy Buolamwini demonstrating the racial bias\
    \ in AI systems. This facial recognition technology failed to see her face until\
    \ she wore a white mask\n\n![](images/613832_1_En_11_Chapter/613832_1_En_11_Fig3_HTML.jpg)\n\
    \nFigure 11-3\n\nAn image illustrating how Twitter’s automatic cropping of images\
    \ did so in a biased manner. It consistently displayed white faces over black\
    \ faces\n\n![](images/613832_1_En_11_Chapter/613832_1_En_11_Fig2_HTML.jpg)\n\n\
    Figure 11-2\n\nAn image capturing David Heinemeier Hansson accusing Apple Card\
    \ of gender discrimination, sparking a debate over biased credit limits based\
    \ on gender\n\n![](images/613832_1_En_11_Chapter/613832_1_En_11_Fig1_HTML.jpg)\n\
    \nFigure 11-1\n\nThis image depicts Amazon’s decision to scrap an AI recruiting\
    \ tool due to bias. This highlights concerns over unfair treatment in hiring practices,\
    \ which can be exacerbated\n\n# Mitigating Bias – Human in the Loop Approach\n\
    \nHuman in the Loop is a collaborative method that incorporates human expertise\
    \ and input throughout the life cycle of the AI system. Humans play an active\
    \ role in things like training, evaluating, and managing the system. This offers\
    \ crucial guidance, feedback, data labeling, and transparency. The purpose of\
    \ having humans in the loop is to increase the accuracy, reliability, and adaptability\
    \ of AI systems by leveraging the strengths of both humans and machine learning\
    \ models. Human involvement will be necessary to ensure decisions made from machine\
    \ learning models are ethically sound as models become more complex and increasingly\
    \ adopted by society. The goal is to avoid having AI systems make harmful decisions,\
    \ as showcased in the “Understanding Bias” section above.\n\n## Ways Humans Can\
    \ Be in the Loop but Not Limited To\n\n*   Providing data labeling and data quality\
    \ and assurance before and after datasets are fed into the machine learning algorithm\n\
    *   Providing feedback to machine learning models\n\n## Benefits of Humans in\
    \ the Loop\n\n*   Enhanced Reliability\n    *   Human supervision is important\
    \ for assisting in ensuring the models are reliable.\n*   Transparency\n    *\
    \   The human would have to have some understanding of each process that they\
    \ are involved in within the machine learning process.\n*   Mitigation of Bias\n\
    \    *   Humans become part of the decision process. This helps identify and mitigate\
    \ potential biases outputted by the model and in the training dataset.\n*   Employment\
    \ Opportunities\n    *   This could bring new job opportunities for people, emphasizing\
    \ that although this technology may take away some jobs, it could also bring forth\
    \ new job opportunities for people."
