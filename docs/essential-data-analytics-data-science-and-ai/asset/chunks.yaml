    \ model is learning with a teacher. The data contains the inputs and the correct\
    \ outputs to help the model learn faster.\n\nLet’s say you want to train a machine\
    \ learning model to predict the value of a used Lamborghini.\n\nYou would have\
    \ a dataset used to train the model with known input and output values. For example,\
    \ the data could include\n    *   Mileage\n\n*   Model (e.g., Sedan, SUV, etc.)\n\
    \n*   Color\n\n*   Fuel Type (e.g., Diesel, Hybrid, Electric, Gasoline)\n\n* \
    \  Pricing\n\nThe inputs to the model would be mileage, model, color, and fuel\
    \ type, and the output would be pricing.\n\nOnce the model has been fitted to\
    \ the dataset or, in other words, has learned from this dataset, a trained machine\
    \ learning model using the supervised algorithm is outputted. You can give this\
    \ model new data that it has not seen before and get a prediction on what the\
    \ pricing of the car would be. There are various types of supervised learning\
    \ algorithms.\n\nTypes of Supervised Learning Algorithms\n\nRegression\n\nRegression\
    \ algorithms predict continuous variables such as pricing or temperature.\n\n\
    Examples of Supervised Learning Algorithms for Regression\n    *   Linear Regression\n\
    \n*   Random Forest Regression\n\n*   Decision Tree Regression\n\n*   Support\
    \ Vector Regression\n\nClassification\n\nClassification algorithms predict discrete\
    \ variables such as\n    *   Yes or No\n\n*   0 and 1\n\n*   Red, Purple, Blue\n\
    \n*   True or False\n\nThe prediction is categorized into a distinct set of choices.\n\
    \nExamples of Supervised Learning Algorithms for Classification\n    *   Support\
    \ Vector Classification\n\n*   K-Nearest Neighbors (KNN)\n\n*   Logistic Regression\n\
    \n*   Decision Tree Classification\n\n*   Random Forest Classification\n\nUse\
    \ Cases of Supervised Learning\n    *   Time Series Market Analysis\n\n*   Customer\
    \ Analytics\n\n*   Human Resource Allocation\n\n2.  Unsupervised Learning"
