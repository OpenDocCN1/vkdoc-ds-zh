- fmt: 'This includes ones that use cutting-edge AI and that let AI systems be trained
    while preserving the privacy of the training data.


    **Strengthen privacy-preserving research and technologies.**


    For example, cryptographic tools that preserve individuals’ privacy, by funding
    a Research Coordination Network to advance rapid breakthroughs and development.
    The National Science Foundation will also work with this network to promote the
    adoption of leading-edge privacy-preserving technologies by federal agencies (The
    White House 2023).


    Similarly, the European Union created something similar called the EU AI Act,
    which are regulations on artificial intelligence.


    As stated in the High Level Summary of the Act provided by the Future of Life
    Institute, majority of the rules apply to AI systems that are considered high
    risk. High-risk systems are involved in the following areas: biometrics, critical
    infrastructure, educational and vocational training, employment, law enforcement,
    migration, administration of justice and democratic processes, and access to and
    enjoyment of essential private services and essential public services and benefits.
    In it, high-risk AI providers must


    - Establish a risk management system through the high-risk AI systems’ life cycle

    - Conduct data governance, ensuring that training, validation, and testing datasets
    are relevant, sufficiently representative, and, to the best extent possible, free
    of errors and complete according to the intended purpose

    - Design their high-risk AI systems to allow deployers to implement human oversight

    - Design their high-risk AI system to achieve appropriate levels of accuracy,
    robustness, and cybersecurity (EU Artificial Intelligence Act)


    This is only a few of the rules mentioned in this document. For this chapter,
    I focused on the rules that I felt could help with preventing adversaries and
    abuse within artificial intelligence. (EU Artificial Intelligence Act)


    Other countries have implemented rules and considerations aside from those of
    the United States and the EU. China aims to be the leading artificial intelligence
    center by 2030. The Chinese Cybersecurity Law and the New Generation AI Development
    Plan outline data protection and cybersecurity strategies in AI, focusing on compliance
    and proactive risk management. Canada has created programs such as the Pan-Canadian
    AI Strategy and the Canadian AI Council to promote the responsible development
    of AI and tackle ethical concerns within the AI sector.


    ## Conclusion


    Adversarial attacks seriously threaten the reliability and security of machine
    learning models. As AI becomes integrated into our lives, the potential consequences
    of adversarial attacks become more severe. To mitigate these risks, a multifaceted
    approach is necessary. This involves robust defense mechanisms and continuous
    research. The potential consequences of these attacks make employing a multilayered
    defense strategy essential. Throughout this chapter, we have discussed several
    defense measures that can mitigate the risk created by adversaries and give you
    better safeguards for your models against adversaries. The importance of continuous
    research and improvement in security practices cannot be overstated – new attack
    methods are constantly evolving, requiring ongoing adaptation and innovation.
    Understanding adversaries and abuse is crucial for developing robust and secure
    systems. By studying the tools, techniques, and examples, we can better anticipate
    potential threats and develop mitigation strategies that create more resilient
    and trustworthy artificial intelligence systems.


    # 11. Working with Models


    ## Introduction


    Artificial intelligence (AI) is no longer a concept confined to the realms of
    science fiction; it has become an integral part of our daily lives and various
    industries. AI’s presence is penetrating and ever-growing, from voice assistants
    like Siri and Alexa to advanced machine learning models driving innovation in
    healthcare and consumer products. However, alongside this rapid advancement, a
    spectrum of fear and misconceptions exists. Some worry about AI taking over jobs,
    invading privacy, or even surpassing human intelligence to a point of no return.
    This chapter aims to address these concerns, highlighting the reasons why we should
    embrace AI rather than fear it.


    ## The Historical Context of Technological Advancement


    Looking back at history, significant technological innovation has been met with
    a degree of skepticism and fear. The Industrial Revolution, for instance, sparked
    concerns about job displacement as machines began to replace manual labor. Similarly,
    the advent of the Internet brought about fears of privacy invasion, job loss,
    and data security. Yet, over time, these technologies proved to be transformative,
    driving economic growth, enhancing quality of life, and creating new job opportunities
    that previously did not exist.


    AI represents one of the next leaps in technological advancement, poised to bring
    substantial benefits. The rise of AI is sparking concerns about job displacement,
    rightfully so, especially in fields that involve routine, repetitive tasks. However,
    AI has the potential to generate new roles that did not exist before, for example,
    AI maintenance, ethics management, AI security engineer, AI art director, and
    prompt engineers. While certain jobs may be automated, others will shift to focus
    on human skills that are harder to replicate.


    Understanding this historical context helps to allay fears and provides a perspective
    on how societies can adapt and thrive with new technologies. AI can be a transformative
    tool that can enhance productivity, create new roles, and improve quality of life
    – if managed with foresight, ethical oversight, and balance.


    ## The Benefits of AI: Transformative Potential Across Industries


    ### Healthcare: Improved Diagnostics and Personalized Medicine


    AI has revolutionized healthcare by improving diagnostic accuracy and enabling
    personalized treatment plans. Machine learning algorithms can analyze medical
    images with higher precision than human radiologists, catching early signs of
    diseases like Alzheimer’s. AI-driven predictive models assists doctors in tailoring
    treatments to individual patients, enhancing the effectiveness of medical interventions
    and reducing adverse effects.


    ### Education: Personalized Learning


    In education, AI facilitates personalized learning experiences for students. Intelligent
    tutoring systems adapt to individual learning styles and paces, providing customized
    resources and feedback. An example of this is Duolingo. Duolingo is an app used
    to learn different languages. It provides listening, speaking, and reading exercises
    at a pace and level according to the student’s performance.


    ### Manufacturing: Automation and Predictive Maintenance


    AI enhances manufacturing processes by automating repetitive tasks and enabling
    predictive maintenance. Robotics powered by AI increase production efficiency
    and consistency, while predictive maintenance models anticipate equipment failures,
    reducing downtime and maintenance costs. Examples of these are Amazon’s fleet
    of robots that work with the employees within their fulfillment centers to transport
    goods and IBM’s Maximo Application Suite. This suite is used to do things like
    asset monitoring, predictive maintenance, and reliability planning.


    ### Everyday Life: Personal Assistants and Smart Home Devices


    In our everyday lives, AI manifests in the form of personal assistants like Siri,
    Alexa, and Google Assistant, making our lives more convenient by managing schedules,
    setting reminders, and controlling smart home devices. These advancements underscore
    AI’s potential to improve daily living through automation and intelligent assistance.'
