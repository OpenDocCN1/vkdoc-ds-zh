- fmt: '## Examples with Code


    ### Example with Code


    In this example, we will use a machine learning model to predict the quality of
    wine. There are 1600 rows in this dataset. The quality of wine ranges from 3 to
    8, where 8 is good and 3 is bad.


    Import required libraries.


    ```python

    import pandas as pd

    from sklearn.ensemble import RandomForestClassifier

    from sklearn.model_selection import train_test_split, GridSearchCV

    from sklearn.metrics import accuracy_score, classification_report

    import matplotlib.pyplot as plt

    ```


    Load the dataset. This dataset can be found on Kaggle:


    [`https://www.kaggle.com/datasets/uciml/red-wine-quality-cortez-et-al-2009/data`](https://www.kaggle.com/datasets/uciml/red-wine-quality-cortez-et-al-2009/data)


    ```python

    wine_data = pd.read_csv("wine-quality-data.csv")

    wine_data.head(5)

    ```


    We will use `quality` of the wine as what we want our model to output and the
    other columns as input to the model to help make its predictions. That is the
    last column seen in Figure [6-8](#613832_1_En_6_Chapter.xhtml#Fig8).


    ```python

    x = wine_data.drop(["quality"], axis =1)

    y = wine_data["quality"]

    ```


    For this example, we will use a Random Forest Classification algorithm to create
    a model to make the wine quality predictions.


    ```python

    model = RandomForestClassifier(random_state =42)

    ```


    ![](images/613832_1_En_6_Chapter/613832_1_En_6_Fig8_HTML.jpg)


    **Figure 6-8** – A sample of the data within the dataset we are using for this
    example. Here are the first five rows.


    For this example, we will use a Random Forest Classification algorithm to create
    a model to make the wine quality predictions.


    Let''s use `GridSearchCV` to help us pick hyperparameters for training. `GridSearchCV`
    is a tool used to automate the process of finding the best combination of hyperparameters
    for a machine learning model.


    ```python

    hyper_params = {''criterion'':[''gini'', ''entropy'',''log_loss''],

    ''max_depth'':[5, 25, 50,100,200,300, None],

    ''n_estimators'':[50,100,200, 500]}

    grid = GridSearchCV(estimator = model, param_grid = hyper_params, scoring="accuracy",
    cv =10)

    grid.fit(x, y)

    ```


    Let''s see what it came up with.


    ```python

    print(grid.best_params_)

    print(grid.best_score_)

    ```


    Our print statements outputted:


    ```python

    {''criterion'': ''gini'', ''max_depth'': 5, ''n_estimators'': 200}

    0.5922680817610062

    ```


    So out of the list of options we gave `GridSearchCV`, the best parameters for
    the model should have the criterion set to `''gini''`, `max_depth` set to `5`,
    and `n_estimators` set to `200`. This will give us an estimated accuracy score
    of `0.59`.


    We will now split the dataset to ensure we have enough data to train the model
    and enough to test the model. Typically, the data is split with 80 percent of
    the data used for training and 20 percent of the data used for testing.


    We will use `x_train` and `y_train` for training and `x_test` and `y_test` for
    testing the model.


    `random_state` is a parameter set to ensure the reproducibility of the split in
    data. So every time you run this line of code, the same data will be set to `x_train`,
    `x_test`, `y_train`, `y_test` instead of random numbers.


    ```python

    x_train, x_test, y_train, y_test = train_test_split(x, y, train_size = .8, random_state
    = 42)

    ```


    Now, we will use the parameters found using `GridSearchCV` as our hyperparameters
    to train our model.


    ```python

    model = RandomForestClassifier(criterion="gini", max_depth=5, n_estimators = 200,  random_state=42)

    model.fit(x_train,y_train)

    ```


    We will use our new model to predict the quality of wine using the features from
    our testing dataset.


    ```python

    predictions = model.predict(x_test)

    accuracy_score(y_test, predictions)

    ```


    The accuracy score is `0.56875`.


    We can also see which features are really important to the model when making its
    predictions, which can be seen in Figure [6-9](#613832_1_En_6_Chapter.xhtml#Fig9).


    ![](images/613832_1_En_6_Chapter/613832_1_En_6_Fig9_HTML.jpg)


    **Figure 6-9** – A chart showing the features the model found most important when
    making its predictions.


    ```python

    feature_importances = model.feature_importances_

    feature_names = wine_data.columns

    sorted_importance = feature_importances.argsort()

    plt.barh(range(len(feature_importances)), feature_importances[sorted_importance])

    plt.yticks(range(len(feature_importances)), [feature_names[i] for i in sorted_importance])

    plt.ylabel("Features")

    plt.xlabel("Importance")

    plt.title("Title: Model Feature Importance")

    ```


    ## Monitoring Your Model


    Machine learning pipelines automate the process, from data preprocessing to model
    training, evaluation, and deployment. This ensures that each step is carried out
    consistently and efficiently, which is vital for reliable model evaluation.


    Pipelines streamline the evaluation process by keeping track of metrics used to
    evaluate your model. This makes it easier to track and compare the performance
    of different models you deploy over time. By systematically applying the same
    evaluation criteria to each model, pipelines help identify the best performing
    model more reliably.


    `MLflow` is an example of a platform that integrates these principles, among others,
    into a comprehensive solution for managing machine learning projects.


    ## Examples Where Machine Learning Models Can Be Useful


    1.  **Credit Card Fraud Detection** – In a credit card fraud detection scenario,
    evaluating the model''s performance is critical due to the imbalance in the dataset
    (few fraudulent transactions compared to legitimate ones). Techniques like precision,
    recall, F1 score, and ROC-AUC can be used to measure the model''s effectiveness
    in identifying fraud.


    2.  **Predicting Housing Prices** – In regression tasks like predicting housing
    prices, metrics such as MAE, MSE, and R squared can be used to evaluate model
    performance. These metrics can help in understanding the accuracy of predictions.


    ## Conclusion


    Evaluating machine learning models is crucial to ensure their reliability, accuracy,
    and generalizability to new data. We can get a comprehensive understanding of
    a model''s performance by using various tools and techniques such as train-test-split,
    cross-validation, and a range of evaluation metrics. Through examples and use
    cases, we''ve seen how these methods can be applied to different types of problems.
    Proper evaluation is not just a best practice but a necessity for deploying robust
    machine learning solutions.


    # 7. When to Use Machine Learning Models


    Machine learning models have become a powerful tool for solving complex problems
    in various fields. These days, it seems that everyone is looking for ways to add
    machine learning either for personal reasons or in an attempt to advance their
    business. However, applying machine learning models to every problem is unnecessary.
    While machine learning can offer powerful solutions, it''s important to recognize
    not all challenges require such advanced techniques. Sometimes, simpler, rule-based
    systems or other traditional methods might be more efficient and effective. Overcomplicating
    a solution with machine learning can lead to unnecessary complexity without delivering
    the desired value.


    Imagine you have a problem to solve – perhaps optimizing an existing system, launching
    a new business, or enhancing customer experience. You might consider a machine
    learning model, but assessing whether this approach is the best fit is essential.'
