    ### Tableau


    `Tableau` 是一款用于报告和分析大量数据的流行工具。它使用户能够创建各种图表、图形、地图、仪表板和故事，以实现全面的数据可视化和分析。`Tableau`
    强大的数据发现和探索功能允许用户快速回答重要问题并做出明智的业务决策。它不需要任何编程知识，使得无论技术经验如何，任何人都能立即上手使用。


    ### Power BI


    `Power BI` 是另一款不需要编程知识的流行工具。与 `Tableau` 类似，它也用于报告和分析数据。它提供了一套业务分析工具，用于创建数据可视化并在组织内共享见解。


    ### 带代码的示例


    我将在以下示例中使用 `Python`。你可以使用免费软件应用程序（如 `Jupyter Notebooks`、`Google Colab` 甚至 `Visual
    Studio Code`）进行同步操作。


    #### 安装


    1.  导入所需的库。


    ```

    import pandas as pd

    import seaborn as sns

    ```


    2.  查看数据。


    我们在此示例中使用的数据是关于美国房价的。该数据包含超过 4000 行。该数据集可在 Kaggle 上找到：[`https://www.kaggle.com/datasets/fratzcan/usa-house-prices`](https://www.kaggle.com/datasets/fratzcan/usa-house-prices)。


    让我们通过运行以下代码，使用 `pandas` 加载数据集：


    ```

    pip install pandas

    ```


    ![](img/613832_1_En_4_Fig3_HTML.jpg)


    **图 4-3** 数据集中随机样本的图像


    ```

    housing_data = pd.read_csv("USA Housing Dataset.csv")

    ```


    数据的时间范围是从 2014 年 5 月到 2014 年 7 月。该数据集中有 18 列：


    ![](img/613832_1_En_4_Fig4_HTML.jpg)


    **图 4-4** 全国房价最贵城市列表及其对应价格房屋数量的图像


    3.  探索数据。


    我们可以创建许多图表、表格和图形来帮助我们更好地可视化数据以理解它。让我们通过查看哪些城市的房价超过 150 万美元来探索数据。


    ```

    housing_data[housing_data["price"]>1500000][["city"]].value_counts()

    ```


    在这里，我们可以看到在我们的数据集中，有 17 个城市有售价超过 150 万美元的房屋。在这份列表中，西雅图的房屋数量最多，有 37 套。


    该数据集包含以下列：


    - `date`：房产售出日期

    - `price`：房产的售价

    - `bedrooms`：房屋的卧室数量

    - `bathrooms`：房屋的浴室数量

    - `sqft_living`：生活区的平方英尺面积

    - `sqft_lot`：地块的平方英尺面积

    - `floors`：房产的楼层数

    - `waterfront`：一个二元指标，表明房产是否有水景

    - `view`：对房产景观质量的 0–4 等级评分

    - `condition`：对房产状况的 1–5 等级评分

    - `sqft_above`：地下室以上部分的平方英尺面积

    - `sqft_basement`：地下室的平方英尺面积

    - `yr_built`：房产建造的年份

    - `yr_renovated`：房产最近一次装修的年份

    - `street`：房产的街道地址

    - `city`：房产所在的城市

    - `statezip`：房产所在的州和邮政编码

    - `country`：房产所在的国家


    4.  查看变量之间的相关性。


    这个表格中有 18 列，但为了保持示例简单，我们只关注其中六个：


    - `price`

    - `bedrooms`

    - `yr_built`

    - `floors`

    - `waterfront`

    - `sqft_living`


    你可以使用其他变量，但可能需要清理数据并重新格式化才能使用它们。


    ![](img/613832_1_En_4_Fig5_HTML.jpg)


    **图 4-5** 显示房价数据集中几个变量之间关系的相关矩阵


    ```

    correlation_matrix = housing_data[["price","bedrooms","yr_built","floors","waterfront","sqft_living"]].corr()

    sns.heatmap(correlation_matrix, annot=True)

    plt.show()

    ```


    在这个相关矩阵中，接近 1 的变量具有强相关性，接近 0 的变量具有弱相关性。在这里，我们可以在第一行看到，与其他变量相比，`price` 受 `sqft_living`
    的影响最大。它受 `yr_built` 的影响最小。这对某些人来说可能是一个令人惊讶的发现，因为人们可能会认为房屋的建造年份对购买意愿有更大的影响。`price`
    与 `sqft_living` 之间的相关关系为 0.42，而 `price` 与 `yr_built` 之间的相关关系为 0.027。


    ## 为探索性数据分析选择合适的可视化方法


    为在探索性数据分析期间有效解读数据，选择正确的可视化技术至关重要。不同的可视化方法突出显示数据的不同方面，使您更易于提取见解并发现模式。


    - **箱线图**：箱线图有助于理解数据集的分布。它们显示中位数、四分位数和潜在异常值。这在比较多个组或类别之间的分布时非常有用。


    - **直方图**：直方图是可视化单个变量频率分布的理想选择，允许分析师快速查看数据的形态（例如，是正态分布还是偏斜分布）。


    - **热力图**：热力图可有效可视化多个变量之间的关系，特别是通过相关矩阵，如图 4-5 所示。这种可视化类型使用颜色渐变来表示变量对之间相关性的强度，使得一眼便能轻易发现强或弱的相关性。


    - **散点图**：散点图通常用于检查两个数值变量之间的关系。它们通常有助于发现趋势、模式以及可能的线性或非线性关系。


    - **条形图**：条形图是一种简单但功能强大的工具，用于比较不同类别。它们既适用于分类数据也适用于离散数据，允许分析师比较不同组别或时间段的数量。例如，条形图可以显示不同产品类别或地区的销售数据。


    - **饼图**：当您想要表示整体的各部分比例时，饼图非常有用。饼图的每一部分代表一个类别占总量的贡献。然而，饼图在类别数量有限且类别之间差异显著时效果最佳；否则将难以解读。


    - **折线图**：折线图通常用于追踪随时间的变化和趋势。它们在处理时间序列数据（如股票价格、天气模式或跨月销售业绩）时特别有效。折线图使可视化连续数据以及检测随时间上升和下降的趋势变得容易。


    每种可视化都有不同的用途，选择合适的可视化取决于数据的性质以及所提出的问题。例如，箱线图是用于比较分布的理想工具，而热力图更适合于评估多个变量之间的相关性。条形图和饼图非常适用于比较分类数据，折线图则非常适合基于时间的趋势。通过选择合适的可视化方法，您可以更有效地探索数据并发现可操作的见解。


    ## 探索性数据分析在业务中的应用案例


    关于如何实施探索性数据分析的实际例子，为探索性数据分析如何在各个领域实际应用提供了宝贵的见解。以下是一些例子，用以说明探索性数据分析的重要性和有效性。

