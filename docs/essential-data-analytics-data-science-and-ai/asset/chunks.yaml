    ## 1. Univariate Analysis


    Univariate analysis implies what the name suggests. When conducting this analysis,
    you explore one variable at a time. When dealing with data, it can be overwhelming
    to understand what is going on, so one approach can be to look at each variable
    separately. Univariate analysis allows you to summarize and identify patterns
    in a large quantity of data. You can describe data found in this variable using
    graphs and charts (e.g., bar charts or frequency distribution tables).


    Let’s say you are tasked with reviewing your company’s inventory database and
    need to find a better way to modernize its data management process. In order to
    do this, you need to understand what is already in the data. This first dataset
    you find looks like the table below.


    At first glance, it may be difficult to identify key insights from this data to
    understand its usefulness to the company. We can use univariate analysis to dissect
    this data to get a better understanding. You can focus on any of these columns,
    but for this example, let’s focus on the variable `Category`.


    | Category |

    | --- |

    | Electronics |

    | Clothing |

    | Electronics |

    | Sports, Fitness, and Outdoors |

    | Entertainment |

    | Toys |

    | Health |

    | School & Office |

    | Pets |

    | Electronics |


    We can take this variable to see the frequency distribution of the categories.


    | Category | Frequency |

    | --- | --- |

    | Electronics | 4 |

    | Clothing | 2 |

    | Sports, Fitness, and Outdoors | 1 |

    | Entertainment | 1 |

    | Toys | 1 |

    | Health | 1 |

    | School & Office | 1 |

    | Pets | 1 |


    Here, we can see that there are more electronic products in our inventory. Next,
    we can add this information to a bar chart to visualize the data more easily.


    ![](images/613832_1_En_4_Chapter/613832_1_En_4_Fig1_HTML.png)


    **Figure 4-1** Bar chart showing the number of categories in the dataset


    Then, we can continue the same individual analysis for each variable within the
    table above to get an understanding of the data.


    ## 2. Bivariate Analysis


    Bivariate analysis is the analysis of two variables to determine the relationship
    between them. Using the example in the table above, we can analyze how the category
    and quantity left in stock are related. We can also analyze how the product and
    price are related. For other examples, we can see the relationship between having
    a pet and emotional well-being. We can also analyze the relationship between money
    and happiness.


    ![](images/613832_1_En_4_Chapter/613832_1_En_4_Fig2_HTML.png)


    **Figure 4-2** Bar chart showing the number of categories currently in stock within
    our inventory


    ## 3. Multivariate Analysis


    Multivariate analysis involves analyzing more than two variables to determine
    their relationship. It identifies patterns between multiple variables and offers
    the benefit of considering multiple factors. It examines different aspects of
    the data that affect the main outcome.


    ## Steps in EDA


    The first three steps relate to the ETL process.


    ### 1. Gathering Data


    In today’s world, vast amounts of data are produced across numerous sectors such
    as healthcare, sports, manufacturing, and more. Recognizing the value of leveraging
    data through thorough analysis is a common understanding among businesses. Yet,
    the effectiveness of this analysis hinges on gathering necessary data from diverse
    sources like surveys, social media, and data specific to your industry, like medical
    records. Without acquiring ample and pertinent data, subsequent endeavors cannot
    commence.


    ### 2. Identifying and Comprehending All Variables


    As the analysis journey commences, the spotlight illuminates the trove of available
    data, brimming with insights waiting to be unearthed. Within the data landscape
    lie dynamic values encapsulating myriad features or patterns, serving as the bedrock
    for understanding and enlightenment. The crucial first step involves identifying
    the key variables that wield influence over outcomes and discerning their potential
    impact. This pivotal step sets the stage for realizing the ultimate goals of any
    analysis endeavor.


    ### 3. Dataset Cleansing


    This step entails refining the dataset, a task that involves eliminating null
    values and irrelevant data. This refinement ensures that the data retains only
    the information essential to the desired analysis. Not only does it save time,
    but it also reduces the computational resources needed when creating a budget
    for your project. Preprocessing tackles an array of issues, from flagging null
    values to identifying outliers and anomalies, ensuring the dataset is primed for
    analysis.


    ### 4. Detecting Correlated Variables


    Discovering correlations between variables provides insights into the relationship
    between them. A correlation matrix shows the correlation coefficients between
    variables in your dataset. The values range from -1 to 1, where -1 is considered
    a weak relationship between variables, 0 is a neutral relationship, and 1 is considered
    a strong relationship. The correlation matrix offers a comprehensive view of these
    connections, aiding in the comprehension of crucial interrelationships among variables.
    This is not always needed in the EDA process but can be useful when selecting
    what variables to pick when training a machine learning algorithm.


