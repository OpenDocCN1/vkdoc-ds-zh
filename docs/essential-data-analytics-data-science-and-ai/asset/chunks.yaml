    # 你会学到什么？


    本书将涵盖多个主题，以加深你对这些技术如何独立运作及协同工作的理解。我们将从探讨如何获取数据开始。数据是你最重要的工具，无论你正在构建的内容仅用于练习还是应用于现实场景。有些人会花钱购买数据，但也有免费获取数据的途径。有时，你可能会遇到必须自行创建数据的情况，这被称为合成数据生成。我也会展示如何实现这一方法。所有这些方法都各有利弊。


    获取数据后，你需要经历一个称为 ETL 的过程。这是处理数据时必不可少的环节。ETL 代表提取（Extract）、转换（Transform）和加载（Load）。虽然有商业工具可以为你完成这些操作，但你也可以使用我之前提到的`Python`或`R`等工具自行构建这个管道。一旦将数据加载到你希望的任何目的地，你就应该探索并理解你所拥有的数据。数据领域的人将这一过程称为
    EDA，即探索性数据分析。有商业工具可以帮助你完成这项工作。例如，你可能听说过`Tableau`！这是一个流行的工具，但对某些人来说可能成本高昂，因此也有免费的方法来实现这一目标。


    接下来，在数据加载并清洗完毕后，就进入了某些人认为最有趣的阶段！向模型输入干净的数据至关重要。算法的优劣完全取决于训练它们所使用的数据。根据你要完成的任务，你可以使用不同的算法来创建模型。训练模型后，你需要对其进行评估。未经测试就部署模型，以确保它能按你的预期运行，是不可取的。评估模型有多种技术，但并非所有评估技术都适用于同一模型，也并非都是必要的。


    从我之前提到的例子中你可以想象，人工智能可以存在于许多不同的地方。一旦你确定准备好部署模型，就需要决定它的“栖身之所”。它可以放置在云端，也可以放在你的手机、冰箱甚至汽车等设备上！模型放置的位置将决定其做出预测或决策的速度快慢。


    为模型找到安身之处后，这并非终点。这永远不是终点！你必须持续维护你的模型，并保护它免受恶意攻击者的侵害。我们将讨论一些需要警惕的不同对抗性攻击。我们还将讨论如何通过一种称为遥测的方法来保持模型的最新状态。


    需要注意的是，并非所有任务都需要使用人工智能。根据任务的不同，使用人工智能可能有些大材小用。你应该考虑成本、规模以及其他我将在后续章节讨论的因素。


    最后，对于人工智能的力量存在着一种可以理解的恐惧。不幸的是，我认为人工智能不会消失，所以你应该拥抱它，并找到与之合作而非对抗的方法。当然，应当制定相关法律来限制其发展边界，以免我们都变成屈从于人工智能神祇的僵尸。然而，许多事情已经并将继续改变。这并不像人们想象的那么可怕。不，书呆子们不会毁灭我们所有人。让我们更多地了解它，看看如何利用它帮助我们在日常生活中成长，让我们的时间和日程安排更高效。


    同样重要的是，数据分析、数据科学和人工智能领域正在快速发展。虽然本书可能未涵盖所有新的发展，但所讨论的基础原理将始终保持其相关性。即使技术和方法不断演变，这些核心概念仍将继续作为有价值的指南。


    # 获取数据


    数据是数据分析、数据科学和人工智能中最基本的工具之一。数据可以通过多种不同的方式呈现给你。大多数数据都是杂乱无章的，需要在使用前进行清理。


    本章将深入探讨数据的多元化世界，揭示其各种类型，并探索获取数据的多种途径。我们将剖析从网络提取数据的复杂性，熟悉公共数据集这个“宝库”，并揭开应用程序编程接口（API）的神秘面纱。我们还将涉及通过调查和问卷收集数据这一传统而又至关重要的方法。最后，我们将讨论数据收集中的伦理和责任。


    ## 理解不同类型的数据


    让我们讨论不同类型数据之间的关键区别，以便在你的项目中有效指导数据的收集与分析过程。


    ### 结构化数据


    结构化数据是经过组织的数据，人和机器都能轻松读取。这类数据通常存在于你常见的工具中，如电子表格和关系型数据库。数据被分配了列，每一行代表该数据的一个实例。这类数据通常被称为表格数据。表格数据以包含行和列的表的形式组织。


    结构化数据的优点在于，可以通过各种工具和技术轻松地搜索和分析它。而且，任何人即使没有特殊工具也能更容易地阅读它。这类数据非常适合商业智能、数据分析和人工智能应用。


    ### 非结构化数据


    非结构化数据是指没有特定格式或结构的数据。现实世界中的大多数数据都处于这种形式。非结构化数据包括发票、图像、音频、视频和电子邮件。这类数据的一些示例可见于图
    2-1。


    ![](img/613832_1_En_2_Fig1_HTML.jpg)


    图 2-1 — 非结构化数据示例图片


    结构化数据与非结构化数据之间的区别在于对其所能进行的分析类型。结构化数据采用严格的格式，确保了数据的一致性。相比之下，非结构化数据则不具有一致性。图 2-2
    直观地展示了这两种数据类型之间的差异。


    ![](img/613832_1_En_2_Fig2_HTML.jpg)


    图 2-2 — 结构化数据与非结构化数据对比示例图片


    ### 定量数据


    定量数据是指具有数值属性的任何数据。这类数据可以被计数或测量。你可以利用这种类型的数据来回答诸如“有多少”、“多少量”或“多频繁”之类的问题。


    ### 定性数据


    定性数据是无法用数字进行计数、测量或表达的信息。你可以利用它来回答诸如“为什么”、“如何”或“发生了什么”之类的问题。


    在图 2-3 中，我提供了一些思考定性数据与定量数据差异的方式。


    ![](img/613832_1_En_2_Fig3_HTML.jpg)


    图 2-3 — 如何理解定性数据与定量数据的示例图片


    ### 时间序列数据


    时间序列数据是在不同时间段收集的数据。这种类型的数据有助于理解趋势和季节性。趋势显示了数据的方向，揭示数据在特定时期内是增长、下降还是保持不变。例如，电子商务趋势显示了过去一年销售额的增长或下降，这可以帮助你为下一个财年做出调整。季节性则显示了定期出现的模式——例如，周六香草冰淇淋销售额的激增。


    ### 截面数据


    截面数据是在某个单一时间点收集的数据。这种类型的数据有助于理解特定时刻不同项目之间的关系。

