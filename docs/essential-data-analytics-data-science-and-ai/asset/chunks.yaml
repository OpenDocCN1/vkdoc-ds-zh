    we will use an API to get the data. To receive an API key, you will need to create
    an account at [`https://data.nasdaq.com/`](https://data.nasdaq.com/).


    First, we will install the Python package `Nasdaq Data Link`.


    ```

    !pip3 install nasdaq-data-link

    ```


    Next, we will import the necessary libraries to get our data. We will only need
    to import `Nasdaq data link`.


    ```

    import nasdaqdatalink

    ```


    Finally, we will get all the data for `NSE/OIL` and output it using our API key.
    As you can see in Figure [2-7](#613832_1_En_2_Chapter.xhtml#Fig7), we have access
    to oil data from September 30, 2009, to January 4, 2019.


    ![](images/613832_1_En_2_Chapter/613832_1_En_2_Fig7_HTML.jpg)


    Figure 2-7


    List of available data from `NSE/OIL`


    ```

    nasdaqdatalink.get("NSE/OIL", api_key = "YOUR_API_KEY")

    ```


    ### Synthetic Data


    Synthetic data mimics data in the real world. It is usually created when the actual
    data is difficult to access because it is expensive or contains sensitive information.
    This type of data can alleviate business concerns about data privacy by not revealing
    personally identifiable information. Data leaks of customer information can cause
    lawsuits and affect brand reputation, hurting a company’s bottom line. Generating
    synthetic data can help create faster turnaround times for product testing and
    developing prototypes, depending on the situation. Synthetic data generation is
    the process used to automate or manually create this fake data. This data can
    be created manually using Excel or a computer algorithm using tools like Python.


    A dataset can be fully or partially synthetic. When a dataset is fully synthetic,
    it has no relation to the real world. However, when the data is partially synthetic,
    only some of the data is fake. For example, only the name, address, and phone
    number would be filled with fake data in a spreadsheet regarding home purchases
    from 2013 to 2023.


    There are also situations when there is not enough data. Machine learning models,
    especially deep learning models, need vast amounts of data to train on. Adding
    on to a dataset using synthetic data may be necessary when there is a lack of
    the required data.


    Though this type of data is useful, it should only be used when necessary. What
    you are building will eventually deal with real-world events so you should use
    real data if you have access to it.


    Let’s do a quick example of generating synthetic data using Python. In this example,
    I will create fake income data.


    First, we will install the Python package `Faker`. `Faker` is a Python library
    that can generate names, addresses, phone numbers, email addresses, and more!


    ```

    !pip3 install faker

    ```


    Next, we will import the necessary libraries to create our sample data. As mentioned,
    `Faker` generates fake data. `Pandas` is a library that helps us organize and
    clean data. We will import it as `pd` to make it simpler and faster to write the
    code. `Random` is a library that generates random numbers. We need this to generate
    random incomes.


    ```

    import faker import Faker

    import pandas as pd

    import random

    ```


    `Faker` can generate data in various languages. I am specifically making sure
    the information generated is related to the United States by adding `en_US`. This
    will make phone numbers and names of people in formats known to people in the
    United States.


    ```

    fake_data = Faker("en_US")

    ```


    Now, we will generate the data. We will create three lists. The `people` list
    will contain random names, the `phonenumbers` list will contain random numbers,
    and the `income` list will contain random incomes.


    ```

    people = []

    phonenumbers = []

    incomes = []

    ```


    In this example, we will create a list of ten people with varying incomes by generating
    a loop.


    ```

    for i in range(10):

    person_name = fake_data.name()

    phone_number = fake_data.phone_number()

    income = random.randrange(40000, 200000)

    people.append(person_name)

    phonenumbers.append(phone_number)

    incomes.append(income)

    ```


    Finally, we will put the data into a structured format so that we can read it
    by placing the data into a `DataFrame`. A `DataFrame` organizes data into a table
    with rows and columns like a spreadsheet.


    ```

    sample_data = pd.DataFrame()

    sample_data["People"] = people

    sample_data["Phone Number"] = phonenumbers

    sample_data["Income"] = incomes

    ```


    Below is an output of what the data looks like. As you can see from Figure [2-8](#613832_1_En_2_Chapter.xhtml#Fig8),
    the data is structured like a spreadsheet.


    ![](images/613832_1_En_2_Chapter/613832_1_En_2_Fig8_HTML.jpg)


    Figure 2-8


    Output of the synthetic data in a `DataFrame`


    You can also convert the `DataFrame` into an actual spreadsheet. Below, I have
    converted the `DataFrame` into a CSV using `.to_csv`.


    ```

    sample_data.to_csv("synthetic_data.csv", index = False)

    ```


    ### Telemetry


    Telemetry is the collection of raw data in real time from a device or application.
    Examples of telemetry are monitoring data from space crafts, sensory data from
    your car to get the speed of your vehicle, and user activity on mobile/web applications.


    Since this data is raw, we will have to clean and structure the data in a way
    that will be useful for us to analyze. We will discuss ways to do that in the
    next chapter. Once this data is cleaned, it can be viewed on a dashboard to monitor
    how a device or application is working in production. This data can also be fed
    back to the system to improve it further with time.


    ## Case Studies and Real-World Examples


    Let’s delve into examples that showcase how different data collection methods,
    including the use of real and synthetic data, can be applied in different industries.


    ### Obtaining Real-World Data


    Let’s explore practical examples of sourcing real-world data to understand how
    it can be used to do analysis and inform decision-making.


    #### Retail Sales Forecasting


    Scenario: A retail chain aims to improve inventory management and sales forecasting.


    Data Collection Method: The company collects historical sales data, customer transactions,
    and external factors such as economic indicators and weather patterns.


    Outcome: By analyzing this data, the retailer can predict future sales trends,
    optimize inventory levels, and better strategically plan marketing campaigns.


    #### Financial Fraud Detection


    Scenario: A bank wants to enhance its fraud detection system to protect customers.


    Data Collection Method: Transaction data, including user behavior, location, and
    transaction history, is collected in real time.


    Outcome: By analyzing patterns in the data, the bank can identify anomalies, detect
    potential fraud, and enhance security measures to safeguard customer accounts
    in the future.


    #### Supply Chain Optimization


    Scenario: A manufacturing company wants to optimize its supply chain to make it
    more efficient and cost-effective.


    Data Collection Method: Data is collected from suppliers, production lines, and
    distribution networks.


    Outcome: By analyzing the data, the company can identify any bottlenecks, reduce
    the time it takes to deliver an order after receiving it, and enhance the overall
    supply chain performance.'
