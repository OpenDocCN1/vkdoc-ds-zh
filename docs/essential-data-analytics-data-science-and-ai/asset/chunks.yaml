  trans: "\n# 人工智能增强人类能力\n\n人工智能真正的优势在于其增强人类智能和决策的能力。通过处理重复性和常规性任务，人工智能释放了人类的创造力、战略思维和问题解决能力。例如，在商业领域，AI\
    \ 可以帮助识别市场和产品中的模式，从而支持更明智的决策；在医疗领域，AI 可以分析并提取文档中的文本，协助医疗专业人员更快地做出决策；在法律领域，AI 可以在海量信息中协助寻找与案件相关的法律文件。\n\
    \n此外，人工智能在各行各业提升了生产力。在设计和音乐等创意领域，AI 工具可以协助艺术家激发新想法、突破创作瓶颈。在科研领域，AI 能够通过分析复杂数据集、识别有助于突破的模式，来加速发现进程。通过增强人类能力，AI\
    \ 有助于促进创新、推动进步。\n\n然而，也存在负面影响。过度依赖 AI 进行决策可能导致批判性思维和解决问题能力的下降，因为人们可能会过于依赖 AI 系统来完成需要人类判断的任务。这在医疗或法律等领域尤其令人担忧，因为人类的监督对于确保合乎伦理的决策至关重要。应对这些风险的措施包括确保\
    \ AI 作为一种补充而非替代人类智能的工具。\n\n# 成功的人工智能整合\n\n## 医疗健康\n\n`Flo`是一款专注于女性健康的应用程序。它追踪月经周期、排卵、症状等信息。该应用使用机器学习算法，根据个人先前记录的信息（如年龄、经期日期和症状）来预测周期长度。它还提供个性化内容，如视频和文章，以教育最终用户。这些内容由健康和保健专家审核，以确保信息可靠。\n\
    \n## 金融\n\n`Betterment`是一个金融投资平台，利用 AI 根据用户的财务计划创建个性化档案。它使用算法实现交易、交易执行和投资组合管理的自动化。该公司成立于\
    \ 2008 年。\n\n## 消费品\n\n`iRobot`是一家消费级机器人公司。他们创造了一款名为`Roomba`的自主吸尘器。它使用机器学习算法绘制用户房产的地图。这有助于吸尘器在清洁时避开障碍物。最终用户还可以在应用中将生成的地图中的点标记为“清洁区域”，指示`Roomba`清洁这些特定点。例如，如果你的员工在办公室的`HC`房间用过午餐，你可以告诉`Roomba`“清洁`HC`桌下”。\n\
    \n# 应对常见的恐惧与误解\n\n## 人工智能对隐私的威胁：平衡创新与伦理考量\n\n另一个常见担忧是人工智能对隐私构成威胁。如果管理不当，数据收集和分析可能导致隐私问题。然而，在创新与伦理考量之间取得平衡至关重要。实施强大的数据保护措施、网络安全要求以及透明的数据使用政策可以降低隐私风险。此外，如第\
    \ 10 章所述，人工智能伦理方面的持续进步旨在确保 AI 系统尊重用户隐私并在伦理边界内运行。\n\n## 人工智能不可控力量的神话\n\n确保对人工智能开发进行适当的监督和监管，有助于防止\
    \ AI 系统产生意外后果。《欧盟人工智能法案》和美国《关于人工智能的行政命令》是应对 AI 相关风险的监管框架和标准范例。\n\n此外，人工智能联盟——一个由研究人员、开发者和组织组成的国际社区——正积极建设一个推动负责任\
    \ AI 创新的社区。他们的努力强调在保持科学严谨性的同时，确保信任、安全与多样性。\n\n# 负责任的人工智能\n\n负责任的人工智能是一种创建和部署 AI\
    \ 系统的方法，旨在确保其符合伦理原则、法律要求和社会价值观。\n\n# 理解偏见\n\n图 11-1 至 11-6 展示了一些 AI 系统出错……非常严重出错的例子。\n\
    \n![](img/613832_1_En_11_Fig6_HTML.jpg)\n\n图 11-6\n\n一张突显依赖算法危险性的图片，展示了这些系统如何导致机会丧失、经济损失和社会污名化，从而加剧不平等和社会危害。\n\
    \n![](img/613832_1_En_11_Fig5_HTML.jpg)\n\n图 11-5\n\n一张展示因虚假面部识别匹配导致一名无辜黑人男子被错误监禁的社会不公图片。这强调了\
    \ AI 系统中的种族偏见问题。\n\n![](img/613832_1_En_11_Fig4_HTML.jpg)\n\n图 11-4\n\n一张展示乔伊·布奥兰维尼演示\
    \ AI 系统种族偏见的图片。该面部识别技术直到她戴上白色面具才识别出她的脸。\n\n![](img/613832_1_En_11_Fig3_HTML.jpg)\n\
    \n图 11-3\n\n一张展示 Twitter 自动裁剪图片存在偏见的图片。它始终优先显示白种人的面孔而非黑种人面孔。\n\n![](img/613832_1_En_11_Fig2_HTML.jpg)\n\
    \n图 11-2\n\n一张记录大卫·海涅迈尔·汉森指控 Apple Card 存在性别歧视的图片，由此引发了关于信用额度基于性别存在偏见的讨论。\n\n\
    ![](img/613832_1_En_11_Fig1_HTML.jpg)\n\n图 11-1\n\n这张图片描述了亚马逊因偏见问题而放弃了一款 AI 招聘工具。这凸显了对招聘实践中不公平待遇的担忧，这种情况可能会加剧。\n\
    \n# 缓解偏见——人在回路方法\n\n人在回路是一种协作方法，在 AI 系统的整个生命周期中融入人类的专业知识和输入。人类在训练、评估和管理系统等方面扮演着积极角色。这提供了关键的指导、反馈、数据标注和透明度。让人参与其中的目的是通过利用人类和机器学习模型的优势，提高\
    \ AI 系统的准确性、可靠性和适应性。随着模型变得越来越复杂并被社会广泛采用，人类的参与对于确保机器学习模型做出的决策在伦理上合理至关重要。目标是避免 AI\
    \ 系统做出有害决策，正如上文“理解偏见”部分所示。\n\n## 人类参与回路的方式（包括但不限于）\n\n*   在数据集输入机器学习算法前后，提供数据标注、数据质量保证。\n\
    *   向机器学习模型提供反馈。\n\n## 人在回路的好处\n\n*   增强可靠性\n    *   人类监督对于协助确保模型的可靠性至关重要。\n*\
    \   透明性\n    *   人类需要对其在机器学习过程中参与的每个步骤有一定理解。\n*   缓解偏见\n    *   人类成为决策过程的一部分，这有助于识别和缓解模型输出及训练数据集中潜在的偏见。\n\
    *   就业机会\n    *   这可以为人们带来新的工作机会，强调尽管这项技术可能会取代一些工作，但它也能为人们带来新的就业机遇。\n"
- fmt: '### Challenges of Humans in the Loop


    It’s important to look at all angles of a problem to understand the trade-offs
    before making a decision. One major challenge that arises in this process is speed.
    The process is no longer fully automated. However, the system outputs become more
    reliable. This process can reduce scale and increase expenses. However, your system
    reliability and trust from the clients/end users have the potential to increase.
    Depending on the tasks, another challenge is humans can also come with their own
    set of biases. However, one way to mitigate that is having a diverse set of people
    with an agreed-upon set of rules/requirements to consider when evaluating, providing
    feedback, and labeling datasets.


    ## Mitigating Bias – Why Diversity Matters


    Diversity in data science and machine learning teams is crucial for identifying
    and addressing potential biases. Along with having people with different educational
    backgrounds, individuals from various genders, ethnicities, and life experiences
    bring unique perspectives and observations, enabling the team to anticipate and
    mitigate challenges that might otherwise be overlooked in developing AI systems.
    This can save a company the harm to reputation and avoid potentially getting sued.


    ## Building Trust and Transparency – Ethical AI: Ensuring Fairness, Accountability,
    and Transparency


    The ethical deployment of AI is paramount to its acceptance and success. Ethical
    AI includes principles of fairness, accountability, and transparency. Fairness
    ensures that AI systems do not discriminate against individuals or groups, while
    accountability holds developers and organizations responsible for the outcomes
    of their AI systems. Transparency involves making the workings of AI systems understandable
    to users and stakeholders. This will foster trust and informed decision-making.


    Several initiatives and frameworks have been developed to promote ethical AI.
    For instance, in Chapter [10](#613832_1_En_10_Chapter.xhtml), the Executive Order
    for AI was released in the United States by President Biden in 2023; the EU AI
    Act and other geographies all over the world provide a comprehensive set of requirements
    for developing AI systems. These guidelines emphasize technical robustness, privacy,
    and transparency, ensuring that AI systems benefit society while minimizing risk.


    ## The Role of Education and Public Engagement


    Educating the public about AI and its benefits is crucial for dispelling fears
    and fostering acceptance. Public engagement initiatives can demystify AI, addressing
    misconceptions and highlighting positive potential. Partnerships with community
    organizations, local governments, and non-profits can play a key role in reaching
    diverse populations, ensuring that everyone has access to accurate information
    and feels included in the conversation. Collaboration between technologists, policymakers,
    and the public is essential to ensure that AI development aligns with societal
    values and needs.


    `Transparent` communication about AI advancements and their implications fosters
    trust and informed decision-making. Publicly available webinars, online courses,
    and AI literacy campaigns can further spread knowledge in accessible ways, allowing
    people to learn at their own pace. Engaging in open dialogue with stakeholders
    helps address concerns and ensures that AI systems are designed in ways that benefit
    society as a whole.


    ## The Future AI: Opportunities and Challenges


    The future of AI holds immense promise, with emerging trends and applications
    poised to revolutionize various fields. For example, AI-driven advancements in
    autonomous vehicles, natural language processing, and robotics are set to transform
    transportation, communication, retail, education, manufacturing, and other areas.


    A great example of the future possibilities of AI, as of the writing of this book,
    is Apple Intelligence.


    In June 2024, Apple announced Apple Intelligence, a suite of AI features the company
    plans to implement in its products. They plan to implement many features. I will
    mention a few. One of the features they introduced was the Math Notes calculator.
    One of the capabilities of this calculator would allow people to solve math equations
    as they write them down in the Math Notes application. Another feature of Apple
    Intelligence is Smart Script. This will assist in increasing the legibility of
    handwritten notes using the Apple Pencil by straightening text in real time. This
    could tremendously help those who have gotten the compliment that they write like
    doctors.


    However, alongside these opportunities, there are challenges that need to be addressed.
    Ensuring the ethical use of AI, mitigating biases in AI models, and managing the
    societal impact of AI adoption are critical areas of focus. For example, the development
    of autonomous weapons raises ethical concerns. Additionally, the automation of
    jobs in industries has the potential to displace large segments of the workforce.
    By proactively addressing these challenges, we can harness the full potential
    of AI for the betterment of humanity. These include implementing ethical regulation,
    as discussed in Chapter [10](#613832_1_En_10_Chapter.xhtml), and preparing the
    workforce for new roles in an AI-driven economy.


    ## Conclusion


    In conclusion, AI represents a powerful tool with the potential to transform industries
    and enhance human capabilities. By embracing AI and addressing common fears and
    misconceptions, we can unlock its full potential while ensuring ethical and responsible
    development. The historical context of technological advancement, the tangible
    benefits of AI, and ongoing efforts to promote ethical AI provide a compelling
    case for embracing AI with a balanced perspective. As we move forward, it is essential
    to foster public engagement, educate stakeholders, and ensure transparency in
    AI development. By doing so, we can create a future where AI benefits all of humanity,
    driving progress and improving quality of life.'
