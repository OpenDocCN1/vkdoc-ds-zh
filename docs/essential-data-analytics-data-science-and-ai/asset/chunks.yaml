- fmt: '# Machine Learning Algorithms


    Machine learning algorithms take unlabeled datasets and find similarities and
    differences in the information without knowing the data beforehand. For example,
    if you are looking at a dataset of used Lamborghinis, the algorithm can automatically
    group the cars based on similarities like model or color. This way, clusters in
    the data can be identified, such as by grouping cars with models together.


    ## Types of Unsupervised Learning Algorithms


    ### Clustering


    Clustering algorithms group your data by finding patterns in your dataset. The
    items with the most similarities will be placed in the same group.


    #### Some Unsupervised Learning Algorithms Using Clustering


    - `Gaussian Mixture`

    - `K-Means`

    - `Isolation Forest`


    ### Association Rule


    This finds the relationship between data points within your dataset. It finds
    the set of items that happen together. For instance, people who buy flowers often
    tend to buy chocolate.


    #### Some Unsupervised Learning Algorithms Using Association Rule


    - `Apriori`

    - `Eclat`


    ### Some Use Cases of Unsupervised Learning


    - Figuring out customer personas

    - Anomaly detection

    - Object recognition


    ## Semi-supervised Learning


    Machine learning algorithms take datasets with a mixture of labeled and unlabeled
    data as input. Typically, there is a small amount of labeled data and a large
    amount of unlabeled data.


    ### How It Works


    1. Train the model with labeled data.

    2. Train the partially trained model in step 1 with the unlabeled data to predict
    outputs, which are considered pseudo labels since it may not be accurate.

    3. Link the predicted output from the model of the labeled data with the predicted
    output from the model of the unlabeled data.

    4. Link the data inputs of the labeled training data to the data inputs of the
    unlabeled training data.

    5. Train the model again to get more accurate predictions.


    ### Some Use Cases of Semi-supervised Learning


    - Label and Rank Web Pages in Search Results

    - Image and Audio Analysis


    ## Reinforcement Learning


    Machine learning algorithms are trained to make a sequence of decisions. There
    is an agent (the algorithm) and rewards with many obstacles throughout. Unlike
    supervised and unsupervised learning, there is no external training dataset provided
    beforehand. The agent generates its own training data by taking action. It learns
    from trial and error to solve a problem. The agents are rewarded or penalized
    depending on the decision it makes. The goal is to maximize the number of rewards.


    ### Some Use Cases of Reinforcement Learning


    - Video Games

    - Autonomous Vehicles

    - Customized Training Systems


    # Deep Learning Models


    Deep learning is a subset of machine learning. It focuses on neural networks with
    many layers (hence “deep”) that attempt to mimic the human brain’s structure and
    function. These layers are composed of interconnected nodes, also known as neurons,
    that work together to process information and make decisions.


    `Neural Networks`: An AI technique that enables computers to process data by mimicking
    the structure and function of the human brain. This machine learning approach,
    known as deep learning, involves layers of interconnected nodes or neurons that
    resemble the brain’s neural pathways. It forms an adaptive system that allows
    computers to learn from errors and improve over time.


    Deep learning models have many layers. The most basic neural network has three
    layers. A simple neural network can be seen in Figure [5-2](#613832_1_En_5_Chapter.xhtml#Fig2).


    ![](images/613832_1_En_5_Chapter/613832_1_En_5_Fig2_HTML.jpg)


    **Figure 5-2** A visual representation of a simple neural network


    1. Input Layer: The first layer that receives the data

    2. Hidden Layer: Intermediate layer that processes input from the input layer

    3. Output Layer: The final layer that produces the prediction or decision


    Deep learning networks have several hidden layers with several nodes linked together,
    as seen in Figure [5-3](#613832_1_En_5_Chapter.xhtml#Fig3).


    ![](images/613832_1_En_5_Chapter/613832_1_En_5_Fig3_HTML.jpg)


    **Figure 5-3** A visual representation of a deep neural network


    Unlike traditional machine learning methods, where data scientists have to choose
    and create the important features that help the model learn from the data, deep
    learning methods can automatically figure out these important features independently.
    It discovers patterns and details directly from the raw data without needing extra
    help. This makes them really good at understanding complex information. However,
    it doesn’t hurt to do some initial feature selection and engineering beforehand
    to give the model a break if you have some domain knowledge on the tasks and data
    at hand! Deep learning models also require more computational power and more data
    to train it.'
