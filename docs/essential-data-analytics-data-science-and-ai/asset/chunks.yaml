    back to the system to improve it further with time.


    ## Case Studies and Real-World Examples


    Let’s delve into examples that showcase how different data collection methods,
    including the use of real and synthetic data, can be applied in different industries.


    ### Obtaining Real-World Data


    Let’s explore practical examples of sourcing real-world data to understand how
    it can be used to do analysis and inform decision-making.


    #### Retail Sales Forecasting


    Scenario: A retail chain aims to improve inventory management and sales forecasting.


    Data Collection Method: The company collects historical sales data, customer transactions,
    and external factors such as economic indicators and weather patterns.


    Outcome: By analyzing this data, the retailer can predict future sales trends,
    optimize inventory levels, and better strategically plan marketing campaigns.


    #### Financial Fraud Detection


    Scenario: A bank wants to enhance its fraud detection system to protect customers.


    Data Collection Method: Transaction data, including user behavior, location, and
    transaction history, is collected in real time.


    Outcome: By analyzing patterns in the data, the bank can identify anomalies, detect
    potential fraud, and enhance security measures to safeguard customer accounts
    in the future.


    #### Supply Chain Optimization


    Scenario: A manufacturing company wants to optimize its supply chain to make it
    more efficient and cost-effective.


    Data Collection Method: Data is collected from suppliers, production lines, and
    distribution networks.


    Outcome: By analyzing the data, the company can identify any bottlenecks, reduce
    the time it takes to deliver an order after receiving it, and enhance the overall
    supply chain performance.'
  trans: "\n### `Quandl`\n\n`Quandl` 是一个为用户提供金融和替代数据集的平台。替代数据集包括券商研报和公司申报文件等数据。它由\
    \ Tammer Kamel 于 2011 年创立，并于 2017 年被纳斯达克收购。用户可使用超过 2000 万个数据集，其中部分免费，部分需付费。你可以通过两种方式下载数据：一种是以时间序列形式，另一种是通过表格。下面，我将演示如何检索数据。这次，我们将使用\
    \ API 来获取数据。要获取 API 密钥，你需要在 [`https://data.nasdaq.com/`](https://data.nasdaq.com/)\
    \ 创建一个账户。\n\n首先，我们将安装 Python 包 `Nasdaq Data Link`。\n\n```\n!pip3 install nasdaq-data-link\n\
    ```\n\n接下来，我们将导入必要的库来获取数据。我们只需要导入 `Nasdaq data link`。\n\n```\nimport nasdaqdatalink\n\
    ```\n\n最后，我们将获取 `NSE/OIL` 的所有数据，并使用我们的 API 密钥输出。如图 2-7 所示，我们可以访问从 2009 年 9 月 30\
    \ 日到 2019 年 1 月 4 日的石油数据。\n\n![](img/613832_1_En_2_Fig7_HTML.jpg)\n\n图 2-7\n\n\
    `NSE/OIL` 提供的可用数据列表\n\n```\nnasdaqdatalink.get(\"NSE/OIL\", api_key = \"YOUR_API_KEY\"\
    )\n```\n\n### 合成数据\n\n合成数据模仿现实世界中的数据。它通常在真实数据因成本高昂或包含敏感信息而难以获取时创建。这类数据可以通过不泄露个人身份信息来缓解企业对数据隐私的担忧。客户信息泄露可能引发诉讼并影响品牌声誉，损害公司的利润。根据情况，生成合成数据有助于加快产品测试和原型开发的速度。合成数据生成是自动化或手动创建这些虚假数据的过程。这些数据可以使用\
    \ Excel 手动创建，或使用 Python 等工具通过计算机算法生成。\n\n数据集可以是完全合成的，也可以是部分合成的。当数据集是完全合成时，它与现实世界毫无关联。然而，当数据是部分合成时，只有部分数据是假的。例如，在一个关于\
    \ 2013 年至 2023 年购房情况的电子表格中，可能只有姓名、地址和电话号码会填入虚假数据。\n\n有时也会遇到数据不足的情况。机器学习模型，尤其是深度学习模型，需要海量数据进行训练。在缺乏所需数据时，可能有必要使用合成数据扩充数据集。\n\
    \n尽管这类数据很有用，但应仅在必要时使用。你正在构建的东西最终会处理现实世界的事件，因此如果你能获取真实数据，就应该使用它。\n\n让我们快速演示一个使用\
    \ Python 生成合成数据的例子。在此示例中，我将创建虚构的收入数据。\n\n首先，我们将安装 Python 包 `Faker`。`Faker` 是一个可以生成姓名、地址、电话号码、电子邮件地址等信息的\
    \ Python 库！\n\n```\n!pip3 install faker\n```\n\n接下来，我们将导入创建样本数据所需的库。如前所述，`Faker`\
    \ 生成虚假数据。`Pandas` 是一个帮助我们组织和清洗数据的库。我们将其导入为 `pd`，以使代码编写更简单快捷。`Random` 是一个生成随机数的库。我们需要它来生成随机收入。\n\
    \n```\nfrom faker import Faker\nimport pandas as pd\nimport random\n```\n\n`Faker`\
    \ 可以生成多种语言的数据。我特意添加了 `en_US`，以确保生成的信息与美国相关。这将使电话号码和人名的格式为美国人所熟知。\n\n```\nfake_data\
    \ = Faker(\"en_US\")\n```\n\n现在，我们将生成数据。我们将创建三个列表。`people` 列表将包含随机姓名，`phonenumbers`\
    \ 列表将包含随机电话号码，`incomes` 列表将包含随机收入。\n\n```\npeople = []\nphonenumbers = []\nincomes\
    \ = []\n```\n\n在此示例中，我们将通过生成一个循环来创建一个包含十人、收入各异的列表。\n\n```\nfor i in range(10):\n\
    \    person_name = fake_data.name()\n    phone_number = fake_data.phone_number()\n\
    \    income = random.randrange(40000, 200000)\n    people.append(person_name)\n\
    \    phonenumbers.append(phone_number)\n    incomes.append(income)\n```\n\n最后，我们将数据放入一个结构化格式中，以便读取，方法是将数据放入\
    \ `DataFrame`。`DataFrame` 将数据组织成一个类似电子表格的表格，包含行和列。\n\n```\nsample_data = pd.DataFrame()\n\
    sample_data[\"People\"] = people\nsample_data[\"Phone Number\"] = phonenumbers\n\
    sample_data[\"Income\"] = incomes\n```\n\n以下是数据输出的示例。如图 2-8 所示，数据以类似电子表格的结构化形式呈现。\n\
    \n![](img/613832_1_En_2_Fig8_HTML.jpg)\n\n图 2-8\n\n`DataFrame` 中合成数据的输出\n\n你也可以将\
    \ `DataFrame` 转换为实际的电子表格。下面，我使用 `.to_csv` 将 `DataFrame` 转换为 CSV 文件。\n\n```\nsample_data.to_csv(\"\
    synthetic_data.csv\", index = False)\n```\n\n### 遥测数据\n\n遥测数据是指从设备或应用程序实时采集的原始数据。遥测数据的例子包括来自航天器的监测数据、来自汽车以获取车速的传感器数据，以及用户在移动/网络应用上的活动数据。\n\
    \n由于这些数据是原始的，我们需要以一种便于后续分析的方式对数据进行清洗和结构化处理。我们将在下一章讨论实现这一目标的方法。清洗完成后，这些数据可以显示在仪表盘上，用于监控设备或应用程序在生产环境中的运行状况。这些数据也可以反馈回系统，以随着时间的推移进一步改进系统。\n\
    \n## 案例研究与实际应用示例\n\n让我们深入探讨一些例子，展示不同的数据收集方法（包括使用真实数据和合成数据）如何在各个行业中得以应用。\n\n###\
    \ 获取真实世界数据\n\n让我们探索一些获取真实世界数据的实际例子，以理解如何利用这些数据进行分析并为决策提供信息。\n\n#### 零售销售预测\n\n\
    场景：一家零售连锁企业旨在改进库存管理和销售预测。\n\n数据收集方法：该公司收集历史销售数据、客户交易记录以及经济指标和天气模式等外部因素。\n\n成果：通过分析这些数据，零售商可以预测未来的销售趋势，优化库存水平，并更有效地规划营销活动。\n\
    \n#### 金融欺诈检测\n\n场景：一家银行希望增强其欺诈检测系统以保护客户。\n\n数据收集方法：实时收集包含用户行为、位置和交易记录在内的交易数据。\n\
    \n成果：通过分析数据中的模式，银行可以识别异常、检测潜在欺诈，并加强安全措施，以在未来保障客户账户的安全。\n\n#### 供应链优化\n\n场景：一家制造公司希望优化其供应链，使其更具效率和成本效益。\n\
    \n数据收集方法：从供应商、生产线和分销网络收集数据。\n\n成果：通过分析数据，公司可以识别任何瓶颈，缩短接到订单后的交付时间，并提升整体供应链绩效。\n"
- fmt: '### Obtaining Synthetic Data


    Let’s explore practical examples of reasons to generate synthetic data to complement
    and enhance real-world datasets.


    #### Preserving Privacy in Healthcare


    **Scenario**: Researchers need to share healthcare data for collaborative studies
    while ensuring patient privacy.


    **Reason for Utilizing Synthetic Data**: Instead of sharing actual patient records,
    synthetic data is generated to simulate realistic patient data to protect the
    privacy of individuals.


    **Outcome**: Researchers can use synthetic data for collaborative analysis, maintaining
    the confidentiality of patients and complying with privacy regulations.


    #### Image Recognition


    **Scenario**: A company is developing an image recognition model but lacks a sufficient
    diverse dataset.


    **Reason for Utilizing Synthetic Data**: In order to augment the real-world dataset,
    they currently have, synthetic images are generated to simulate variations in
    lighting conditions, angles, and backgrounds.


    **Outcome**: The model trained on a combination of real and synthetic data demonstrates
    improved performance and generalization to new unseen scenarios.


    ## Ethics and Liabilities


    In this chapter, I have shown you various ways to obtain data. However, it is
    essential to obtain data ethically and responsibly. You should always follow data
    protection regulations, consider all privacy issues, and get user consent when
    possible. Below are a few laws to keep in mind.


    ### CCPA: California Consumer Privacy Act


    The CCPA is a law that allows any resident in California to see all the information
    a company has saved on them. Residents can also see a list of third parties with
    whom their data is being shared. This also allows residents to sue companies if
    there is a violation of privacy guidelines, even if the company has not been hacked.
    The company does not need to be in the United States to be affected. Companies
    that make at least 25 million dollars in revenue, have at least 50,000 users,
    or collect half of their sales from selling user data are vulnerable to this law.


    ### GDPR: General Data Protection Regulation


    GDPR is a law that governs how the personal data of individuals in the European
    Union (EU) may be processed and transferred. Any data that is collected within
    or transferred from any of the countries in the EU is affected. If the laws are
    violated, the fees are very high. You will have to pay whichever is highest, between
    20 million euros or 4% of global revenue.


    ### HIPAA: Health Insurance Portability and Accountability Act


    HIPAA is a federal law that protects sensitive health information from being disclosed
    without consent or knowledge. This covers all individually identifiable health
    information in any form or media.


    ## Enhancing Transparency and Understanding Using Dataset Cards


    Dataset cards, also known as Data Cards, are an essential tool for documenting
    and understanding the characteristics of datasets. They offer a structured format
    to capture critical information about a dataset, making it easier for people to
    assess its suitability for various use cases. A dataset card is a concise summary
    that provides detailed information about a dataset, including its capabilities,
    limitations, and intended use. It typically includes, but not limited to, key
    sections such as:


    *   **Summary**: A brief overview of the dataset, its purpose, and what tasks
    it supports (e.g., summarization, etc.)

    *   **Languages**: Information about the languages represented in the dataset
    (e.g., English, French, etc.)

    *   **Structure**: Overview of how the data is structured, including examples
    and descriptions of the fields in the data

    *   **Creation**: Information on how the dataset was curated and collected

    *   **Source Data**: Details on where the original data came from, including collection
    methods and sources

    *   **Considerations**: Ethical and social impacts, biases, known limitations,
    and potential risks of using the data


    ### Why Are Data Cards Important?


    Dataset cards enhance transparency by providing clear documentation that helps
    people understand the data they are working with. By including dataset cards,
    you ensure that data is being used appropriately and save people a lot of time
    when trying to understand how to use the data. Dataset cards are valuable for
    anyone involved in data analysis, data science, and machine learning. It offers
    a standardized way to communicate important information. I encourage you all to
    create dataset cards when sharing data. Sites like Hugging Face and Kaggle usually
    have this documentation.


    ## Conclusion


    To conclude, it is evident that data is the foundational pillar for data analytics,
    data science, and artificial intelligence. We have explored the diverse types
    of data and the various acquisition methods, from web scraping, accessing public
    datasets, tapping into the power of APIs, and creating your own data.


    Understanding data, its type, and how to acquire it forms the crucial first step
    in your journey. The skills and knowledge you have gained in this chapter lay
    the groundwork for the exciting adventures ahead as you venture further into the
    world of data analytics, data science, and artificial intelligence.


    We have highlighted the importance of ethical considerations, which should remind
    us that responsible data collection and usage are non-negotiable. It is important
    to remember that the landscape of data is ever-evolving, so staying curious, ethical,
    and diligent in your data practices will ensure that you remain at the forefront
    of this dynamic field. Embrace the complexity, celebrate the diversity of data,
    and let your passion for discovery guide you through the intricate tapestry of
    data analytics, data science, and artificial intelligence.


    As you enter the next chapter, carry forward the insights and understanding you
    have gained, ready to apply them in practical, real-world scenarios. The world
    of data is vast and full of potential – armed with knowledge, curiosity, and a
    strong ethical compass, you are now ready to navigate confidently.


    # 3. ETL Pipeline


    Ensuring the proficiency of machine learning models is contingent upon the provision
    of high-quality training data. The accuracy and effectiveness of predictions directly
    hinge on the caliber of the dataset used during the model’s training phase. A
    well-constructed and maliciously curated dataset serves as the bedrock for machine
    learning algorithms to discern patterns, grasp intricate relationships, and comprehend
    nuance information. Consequently, the resultant models are better equipped to
    make predictions that align with the underlying complexities inherent in the data.


    Furthermore, the significance of good quality data extends beyond the initial
    training phase. As machine learning evolves and encounters new data, the reliability
    and relevance of ongoing predictions are intrinsically tied to the continuous
    availability of accurate and representative data. Maintaining a robust data infrastructure
    ensures that machine learning models remain adaptable and responsive to changes
    in the environment, yielding predictions that reflect the most current insights
    and patterns.


    In essence, the symbiotic relationship between machine learning models and high-quality
    data underscores the pivotal role that data quality plays in the efficacy, adaptability,
    and ongoing success of these intelligent systems.'
