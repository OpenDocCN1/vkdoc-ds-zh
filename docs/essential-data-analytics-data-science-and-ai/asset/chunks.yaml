    # 评估模型时的工具与技术


    模型评估采用多种工具和技术，每种方法都适用于不同的问题类型与数据。下文将讨论机器学习模型评估中最常用的一些方法与指标。其中部分技术我曾在前几篇博客中讨论过，此处将继续补充定义和相关论述。


    ![](img/613832_1_En_6_Fig1_HTML.jpg)


    图 6-1：五折交叉验证的可视化表示


    ## 训练-测试集分割


    训练-测试集分割是一种基础方法，将数据集分为两部分：训练集和测试集。模型在训练集上训练，并在测试集上进行评估以检验其性能。


    ## 交叉验证


    交叉验证是将数据集分成多个子集，并在不同子集上训练模型，同时在剩余子集上进行评估。这有助于预估模型性能，并防止模型过拟合。该技术常用于确定模型的超参数。


    交叉验证有多种类型。本书中将讨论 k 折交叉验证。


    k 折交叉验证是指将数据集分成 K 组，利用这些组对模型进行 K 次训练和测试。每次迭代中，用于训练和测试模型的数据部分会轮换，直到完成第 K 次迭代。


    ### 工作原理


    1.  为 K 选取一个值，常用值为 10。

    2.  将数据集分成 K 组。

    3.  使用 K-1 组作为训练数据来训练模型，剩余 1 组作为测试数据评估模型。

    4.  在训练数据集上训练模型，并在测试数据集上评估模型。

    5.  使用评估指标（如`RMSE`、`MAE`、`accuracy`等）评估模型。本章后续将详细讨论这些指标。评估模型后，保存评估分数。

    6.  重复步骤 1-5 共 K 次。但下一轮需使用不同的子集作为测试数据集。

    7.  最后，计算评估分数的平均值。


    在图 6-1 中，我展示了五折交叉验证的可视化表示。幸运的是，我们不必手动操作。已有诸如 Python 包等工具可用，有助于在划分数据集时减少错误。


    ## 混淆矩阵


    混淆矩阵提供了模型预测的详细分解，展示了真正例、真负例、假正例和假负例。它通过表格形式呈现结果，直观展示模型预测的准确性。表格的行代表期望输出，列代表模型的预测输出。


    ![](img/613832_1_En_6_Fig2_HTML.jpg)


    图 6-2：混淆矩阵的可视化表示


    假设你想创建一个预测汽车是否为兰博基尼的模型。在该数据集中，正例指汽车是兰博基尼，负例指其他任何汽车。使用此方法评估模型时，需牢记四个术语。


    ## 指标


    根据机器学习问题的类型，会使用不同的指标。你可以用这些指标评估模型，并比较多个模型的性能。以下是一些需考虑的指标列表：


    ### 分类指标


    **准确率**


    利用上述混淆矩阵的解释，准确率是正确预测数除以总预测数。该数值介于 0 和 1 之间，0 表示模型未做出任何正确预测，1 表示所有预测都正确。业务相关人员喜欢这个指标，因为它简单易用。


    假设你想让模型判断一个花篮中是否装有玫瑰。使用验证数据集，模型准确率将由它正确识别为玫瑰和正确识别为非玫瑰的数量之和除以总花朵数决定。


    该指标仅在数据集平衡时有效。平衡数据集意味着每个类别都有同等数量的样本。如果一个类别的样本数量远多于其他类别，模型可能会始终预测数量多的类别，即使识别少数类别同样重要。这可能导致高准确率，但在识别不常见类别时性能较差，在需要识别这些少数类别的实际应用中可能会出现问题。


    **精确率**


    在模型所有预测为正例的结果中，有多少是真正的正例。该指标衡量模型正确识别的数量除以正确识别的总数与错误识别的总数之和。


    这追踪了模型错误识别的项目。以我们的花为例，它追踪了被我们归类为玫瑰但实际上是向日葵的数量。


    **召回率**


    在所有真实的正例中，模型正确预测出了多少。该度量是模型正确识别的次数除以样本总数。它考虑了模型忽略的项目数量。它追踪了我们在花朵数据集中可能遗漏的玫瑰总数。


    **F1 分数**


    F1 分数综合考虑了精确率和召回率。它衡量了模型误分类的项目数量以及模型完全遗漏的正例数量。


    **ROC-AUC**


    -   接收者操作特征（ROC）：一个以不同阈值为基准，绘制真正例率与假正例率关系的图表。

    -   真正例（TP）：数据集中为正例，且模型预测也为正例的数据点。

    -   真负例（TN）：数据集中为负例，且模型预测也为负例的数据点。

    -   假负例（FN）：数据集中为正例，但模型预测为负例的数据点。

    -   假正例（FP）：数据集中为负例，但模型预测为正例的数据点。


    ![](img/613832_1_En_6_Fig3_HTML.jpg)


    图 6-3：ROC 曲线示例


    -   曲线下面积（AUC）：衡量 ROC 曲线下的面积。AUC 越高，模型预测能力越好。

    -   真正例率（TPR）：验证数据集中为正例，且模型预测结果也为正例的数据点的概率。

    -   假正例率（FPR）：验证数据集中为负例，但模型预测结果为正例的数据点的概率。


    ![](img/613832_1_En_6_Fig4_HTML.jpg)


    图 6-4：AUC 示例


    有时 AUC 和 ROC 会被合称为 AUROC（接收者操作特征曲线下面积）曲线。


    ### 回归指标


    **均方误差（MSE）**


    `MSE`衡量模型预测的数据点与验证数据集中数据点的接近程度。它是残差平方的平均值。残差是指模型预测的数据点与验证数据集中数据点之间的差异，也常被称为误差。`MSE`的取值范围为
    0 到无穷大。`MSE`越接近 0，模型性能越好。换言之，`MSE`应尽可能低。


    **均方根误差（RMSE）**

    '
- fmt: '`RMSE` is the square root of `MSE`. It measures how close the data points
    a model predicts are to the data points in your validation dataset. Similarly
    to `MSE`, the values range from 0 to infinity. The closer the `RMSE` is to 0,
    the better the model is performing. There is a higher preference for `RMSE` over
    `MSE` because the units are not squared, so it’s easier to interpret the performance
    of the model.


    ## Mean Absolute Error (`MAE`)


    `MAE` measures the average difference between the data points predicted by a model
    and the data points in your validation dataset. It is the average absolute error
    between the predicted values from the model and the validation dataset. The closer
    the `MAE` is to 0, the better the model is performing.


    ## R Squared


    R squared is also called the coefficient of determination. It measures how close
    the actual data within your validation dataset is to the fitted line, also known
    as the regression line.


    The regression line is a straight line that represents how the target variable
    changes as the explanatory variables change. The target variable is what you want
    your model to predict, and the explanatory variables are the variables chosen
    as input to help your model make the predictions.


    ![](images/613832_1_En_6_Chapter/613832_1_En_6_Fig5_HTML.jpg)


    **Figure 6-5** A visual representation on R squared


    R squared also measures how close the data points predicted by a model are from
    the data points in your validation dataset. It is best to use R squared for linear
    regression machine learning models. The values range from 0 to 1. The closer the
    value is to 1, the better the model is performing.


    Let’s go back to our example in Chapter 5, where we used a machine learning model
    to predict salaries. In the last chapter, we created a model without evaluating
    it. Now that we have learned some evaluation metrics, let’s evaluate the model
    using R squared.


    Import required libraries.


    ```python

    import pandas as pd

    from sklearn.model_selection import train_test_split

    from sklearn.linear_model import LinearRegression

    import matplotlib.pyplot as plt

    ```


    Load the dataset. This dataset can be found on Kaggle: [`https://www.kaggle.com/datasets/abhishek14398/salary-dataset-simple-linear-regression`](https://www.kaggle.com/datasets/abhishek14398/salary-dataset-simple-linear-regression).


    ```python

    examp1_data = pd.read_csv("salary_dataset.csv")

    examp1_data.head(5)

    ```


    ![](images/613832_1_En_6_Chapter/613832_1_En_6_Fig6_HTML.jpg)


    **Figure 6-6** A sample of the data within the dataset we are using for this example


    We will use years of experience as the input to the model and salary as what we
    want our model to output.


    ```python

    x = examp1_data[["YearsExperience"]]

    y = examp1_data[["Salary"]]

    ```


    We should first split the dataset to ensure we have enough data to train the model
    and enough to test the model. Typically, the data is split with 80 percent of
    the data used for training and 20 percent of the data used for testing.


    We will use `x_train` and `y_train` for training and `x_test` and `y_test` for
    testing the model.


    `random_state` is a parameter set to ensure the reproducibility of the split in
    data. So every time you run this line of code, the same data will be set to `x_train`,
    `x_test`, `y_train`, `y_test` instead of random numbers within the dataset each
    time you run.


    ```python

    x_train, x_test, y_train, y_test = train_test_split(x, y, train_size=.8, random_state=42)

    ```


    Let’s train a Linear Regression model using our data.


    ```python

    model = LinearRegression()

    model.fit(x_train, y_train)

    ```


    Now, let’s use our trained model to predict salaries using the years of experience
    data the model has not seen. This data was saved in the variable `x_test`. Next,
    let’s save those results in `lr_predictions` and plot them.


    ```python

    lr_predictions = model.predict(x_test)

    ```


    Finally, let’s plot the data.


    ```python

    plt.scatter(x_test, y_test)

    plt.plot(x_test, lr_predictions)

