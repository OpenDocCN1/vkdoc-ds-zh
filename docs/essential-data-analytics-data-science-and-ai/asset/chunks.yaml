    \ Kaggle 上找到：[`https://www.kaggle.com/datasets/abhishek14398/salary-dataset-simple-linear-regression`](https://www.kaggle.com/datasets/abhishek14398/salary-dataset-simple-linear-regression).\n\
    \n    ![](img/613832_1_En_5_Fig5_HTML.jpg)\n\n    **图 5-5**：本示例所用数据集中的数据样本。这是数据集中的前几行。\n\
    \n    ```python\n    examp1_data = pd.read_csv(\"salary_dataset.csv\")\n    examp1_data.head(5)\n\
    \    ```\n\n3.  我们将使用工作年限作为模型的输入，薪资作为模型的输出。\n\n    ```python\n    x = examp1_data[[\"\
    YearsExperience\"]]\n    y = examp1_data[[\"Salary\"]]\n    ```\n\n4.  我们首先需要分割数据集，以确保有足够的数据来训练和测试模型。通常，数据按照\
    \ 80% 用于训练，20% 用于测试的比例分割。\n\n    我们将使用`x_train`和`y_train`进行训练，使用`x_test`和`y_test`测试模型。\n\
    \n    `random_state`是一个参数，用于确保数据分割的可重复性。这意味着每次运行这行代码时，`x_train`、`x_test`、`y_train`、`y_test`\
    \ 中分配的数据都是相同的，而不是随机的。\n\n    ```python\n    x_train, x_test, y_train, y_test =\
    \ train_test_split(x, y, train_size=.8, random_state=42)\n    model = LinearRegression()\n\
    \    model.fit(x_train, y_train)\n    ```\n\n5.  现在，让我们使用模型，根据模型从未见过的“工作年限”数据来预测薪资。这些数据已保存在变量`x_test`中。接下来，将预测结果保存在`lr_predictions`中，并将其绘制成图表。\n\
    \n    ```python\n    lr_predictions = model.predict(x_test)\n    ```\n\n6.  现在，绘制数据图表。\n\
    \n    ![](img/613832_1_En_5_Fig6_HTML.jpg)\n\n    **图 5-6**：展示模型对未来十年薪资预测的图表。\n\
    \n    ```python\n    plt.scatter(x_test, y_test)\n    plt.plot(x_test, lr_predictions)\n\
    \    plt.xlabel(\"Years\")\n    plt.ylabel(\"Salary\")\n    plt.title(\"Title:\
    \ Predicted Salary Based on Years of Experience\")\n    ```\n\n7.  现在，保存模型以便后续使用。我们将其保存为一个\
    \ pickle 文件，命名为`lr_salary_determinator_model.pkl`。\n\n    ```python\n    lr_model_pickle_file\
    \ = \"lr_salary_determinator_model.pkl\"\n    with open(lr_model_pickle_file,\
    \ \"wb\") as file:\n        pickle.dump(model, file)\n    ```\n\n8.  现在，加载 pickle\
    \ 文件，并再次使用之前`x_test`中的数据来运行模型。\n\n    ```python\n    with open(\"lr_salary_determinator_model.pkl\"\
    ,\"rb\") as file:\n        model = pickle.load(file)\n    predictions = model.predict(x_test)\n\
    \    ```\n\n在此示例中，我们将使用一个深度学习模型来识别图像中的动物。\n\n1.  导入所需的库。\n\n    ```python\n  \
    \  from transformers import pipeline\n    from PIL import Image\n    ```\n\n2.\
    \  在此示例中，我们将使用一张动物图片。\n\n    ```python\n    image = Image.open(\"ostrich.jpg\"\
    )\n    ```\n\n3.  我们将使用 Hugging Face 上一个名为`google/vit-base-patch16-224`的模型。\n\n\
    \    ```python\n    model_name= \"google/vit-base-patch16-224\"\n    image_classifier\
    \ = pipeline(\"image-classification\", model=model_name)\n    ```\n\n4.  将图像输入模型，等待其预测结果。\n\
    \n    ```python\n    image_classification_prediction = image_classifier(image)\n\
    \    ```\n\n5.  以下是模型的输出结果。它按置信度从高到低输出了五个预测。置信度最高的是鸵鸟，置信度为 0.99。模型的置信度得分范围通常是\
    \ 0 到 1 或 0 到 100%。\n\n    ```python\n    [{'label': 'ostrich, Struthio camelus',\
    \ 'score': 0.9992263317108154},\n    {'label': 'bustard', 'score': 9.642778604757041e-05},\n\
    \    {'label': 'black stork, Ciconia nigra', 'score': 4.994613482267596e-05},\n\
    \    {'label': 'zebra', 'score': 1.568139487062581e-05},\n    {'label': 'flamingo',\
    \ 'score': 1.4048618140805047e-05}]\n    ```\n\n### 特征选择与特征工程\n\n特征选择是从数据集中挑选出最重要的信息（特征），并剔除那些可能混淆模型的不必要内容。另一方面，特征工程则是创建数据集中原本不存在但可能有助于模型做出更好预测的新数据。\n\
    \n当我们训练一个机器学习模型时，通常从大量数据开始，但并非所有数据都有用。有些数据可能包含噪声、不相关，或者只是增加了模型训练负担的额外信息。通过只选择最佳特征，我们可以帮助模型运行得更快，并做出更好的预测。\n\
    \n例如，假设你要构建一个机器学习模型来预测哪些学生会在数学竞赛中表现出色。你的数据集中包含了学生的数学成绩、拥有数学书的数量以及他们最喜欢的电视节目。成绩和数学书数量可能有帮助，但他们最喜欢的电视节目可能无助于预测竞赛表现。因此，你会移除电视节目数据，专注于更相关的特征来构建模型。然而，你也可以通过特征工程创建一个新特征。例如，利用他们最喜欢的电视节目，创建一个特征来识别哪些节目具有浓厚的数学主题，并创建一个二元特征（例如，Math-Focused-Show\
    \ = 1 或 0），以观察这是否会影响学生在竞赛中的表现。\n\n### 预训练模型与微调模型\n\n**预训练模型**：一个已经在大量数据上训练过以执行特定任务的模型。它可以按原样使用，也可以通过微调等方法进行调整，以适应不同行业和用例的各种需求。我们第二个代码示例中的模型就是一个预训练模型。\n\
    \n**微调模型**：微调是获取一个预训练模型，并通过使用一个更小、更专注的数据集对其进行调整，使其能更好地完成特定任务的过程。这有助于模型精炼其技能，并在手头的具体任务上表现得更好。\n\
    \n### 提示工程\n\n提示（Prompt）是要求机器学习模型执行特定操作的文本，例如回答问题或完成任务。提示工程（Prompt Engineering）则是精心设计和调整这些提示，以使模型给出你想要的精确回复。这就像你给出指示或向某人提问的方式。在人工智能领域，模型从大量数据中学习，恰当的提示对于模型能否正确理解你的请求至关重要。\n"
- fmt: "# Conclusion\n\nMachine learning models have transformed various industries\
    \ by automating complex tasks, uncovering insights from vast datasets, and enabling\
    \ data-driven decision-making. The tools and techniques discussed in this chapter\
    \ provide a comprehensive foundation for building and deploying ML models. Through\
    \ many examples, we have demonstrated the practical applications and effectiveness\
    \ of these models in solving real-world problems. As machine learning continues\
    \ to evolve, it will unlock new opportunities and drive innovation across diverse\
    \ domains.\n\nMachine learning models have revolutionized numerous fields by providing\
    \ powerful tools for data analysis, prediction, and automation. By leveraging\
    \ advanced techniques and robust tools, these models can solve complex problems\
    \ and drive significant improvements across industries. Understanding the importance,\
    \ tools, techniques, and potential applications of ML models is essential for\
    \ harnessing their full potential.\n\n# 6. Evaluating Models\n\nEvaluating machine\
    \ learning models is like checking to see if a recipe turned out the way you wanted.\
    \ Imagine you are baking cookies and want them to be my favorite type, soft and\
    \ chewy! After baking, you take a bite to see if they are just right. If they’re\
    \ too hard or soft, you know something went wrong. In the same way, when we build\
    \ a machine learning model, we need to test it to ensure it is doing what we want.\
    \ This testing, or evaluation, helps us determine if the model is making accurate\
    \ predictions or if we need to adjust the “ingredients” to get better results.\n\
    \nWithout proper evaluation, we might end up trusting a model that doesn’t work\
    \ well, just like serving cookies that do not taste good. This could lead to bad\
    \ decisions, especially if the model is used in important areas like healthcare.\
    \ So evaluating models helps ensure they are reliable and can be trusted to make\
    \ the right decisions. Various metrics can be used to evaluate machine learning\
    \ models, depending on their task.\n\n## Introduction to Evaluating Models\n\n\
    Building models is just the beginning in the world of machine learning. Evaluating\
    \ these models is critical to ensuring their effectiveness and reliability in\
    \ real-world applications. Model evaluation involves using various metrics and\
    \ techniques to assess how well a machine learning model performs on a given dataset.\n\
    \n## Importance of Evaluating Models\n\nEvaluating machine learning models is\
    \ vital for several reasons:\n\n1.  **Performance Assessment**\n\n    It helps\
    \ understand how well a model performs on unseen data, ensuring that the model\
    \ does not just memorize the training data but generalizes well to new, unseen\
    \ information.\n\n2.  **Model Comparison**\n\n    Evaluation metrics allow for\
    \ the comparison of different models or algorithms to select the one that performs\
    \ best for a specific task.\n\n3.  **Identifying Overfitting and Underfitting**\n\
    \n    Overfitting happens when a machine learning model learns too much from its\
    \ training data, almost memorizing it. This means it does well with familiar data\
    \ but struggles when given new information. It’s like a student who memorizes\
    \ all the answers for a test but can’t answer new questions.\n\n    Some reasons\
    \ why overfitting can happen:\n    *   The training process is too long.\n   \
    \ *   The training data is not diverse enough.\n    *   The model is too complex\
    \ for the data.\n\n    Underfitting happens when a machine learning model does\
    \ not learn enough from the data, leading to poor performance on both the training\
    \ and testing data. It’s like a student who only skimmed the textbook and missed\
    \ key concepts.\n\n    Some reasons why underfitting can happen:\n    *   The\
    \ training is not long enough.\n    *   The model is too simple for the data.\n\
    \    *   The data has too many unnecessary details.\n\n    Finding the right balance\
    \ between overfitting and underfitting is key to making sure a model can handle\
    \ both familiar and new data.\n\n4.  **Hyperparameter Tuning**\n\n    Let’s say\
    \ you wanted to teach a robot how to identify cats. Hyperparameters are like the\
    \ rules you set for the robot to learn. They tell the robot how fast to learn\
    \ (learning rate) and how many times to look at the same pictures (epochs).\n\n\
    \    This is different from model parameters. Model parameters are what the robot\
    \ learns from the pictures. These are like the specific details the robot remembers\
    \ about cats, like the shape of their ears and their fur color.\n\n    Hyperparameters\
    \ help the robot learn, while the model parameters are what the robot actually\
    \ learns.\n\n    Another way to think about it is baking a cake. Hyperparameters\
    \ are like the recipe you follow. They tell you how much of each to use (e.g.,\
    \ two cups of flour), how long to bake the cake (e.g., 30 minutes), and the temperature\
    \ of the oven (e.g., 350 °F). These are choices you make before baking the cake.\n\
    \n    The actual cake itself would be the model parameters. They are the result\
    \ of following the recipe. The cake’s specific flavors, texture, and appearance\
    \ depend on how well you followed the recipe and the quality of your ingredients.\n\
    \n    So hyperparameters guide the baking process, while model parameters represent\
    \ the final product.\n\n    Examples of hyperparameters are:\n    *   **Learning\
    \ Rate**: Determines how quickly the algorithm updates its predictions as it learns\n\
    \    *   **Weight Decay**: Gradual reduction of the learning rate over time to\
    \ help the model learn more effectively\n    *   **Epochs**: The number of times\
    \ the model goes through the entire training data set during the learning process\n\
    \n5.  **Deployment Readiness**\n\n    Thorough evaluation ensures that a model\
    \ meets the necessary accuracy and reliability standards before it is deployed\
    \ in a production environment."
