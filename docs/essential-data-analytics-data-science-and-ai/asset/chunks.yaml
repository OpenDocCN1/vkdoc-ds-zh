  trans: '

    ### 获取合成数据


    我们来探讨一些生成合成数据以补充和增强真实世界数据集的实践案例。


    #### 在医疗领域保护隐私


    **场景**：研究人员需要在确保患者隐私的前提下共享医疗数据以进行合作研究。


    **使用合成数据的理由**：不共享真实的患者记录，而是生成合成数据来模拟逼真的患者数据，以保护个人隐私。


    **结果**：研究人员可以在合作分析中使用合成数据，同时维护患者的机密性并遵守隐私法规。


    #### 图像识别


    **场景**：一家公司正在开发图像识别模型，但缺乏足够多样化的数据集。


    **使用合成数据的理由**：为了增强他们现有的真实数据集，生成合成图像以模拟光照条件、角度和背景的变化。


    **结果**：在真实数据与合成数据组合上训练的模型表现出更优的性能，并且对未见过的全新场景具有更好的泛化能力。


    ## 伦理与责任


    在本章中，我向你展示了获取数据的各种方法。然而，以合乎伦理且负责任的方式获取数据至关重要。你应当始终遵守数据保护法规，考虑所有隐私问题，并在可能时获得用户同意。以下是需要注意的几项法律。


    ### CCPA：加州消费者隐私法案


    CCPA 是一项法律，允许加州任何居民查看公司所保存的关于他们的所有信息。居民还可以看到与哪些第三方共享了他们的数据清单。如果隐私准则遭到违反，该法律还允许居民起诉公司，即使公司尚未遭到黑客攻击。公司无需位于美国境内才会受到影响。年收入至少
    2500 万美元、拥有至少 5 万用户、或有一半销售额来自出售用户数据的公司均受此法律约束。


    ### GDPR：通用数据保护条例


    GDPR 是一项法律，规定了如何处理和传输欧盟 (EU) 内个人的个人数据。在欧盟任何国家内收集或从这些国家传输的所有数据均受其影响。如果违反该法律，罚款非常高。你将需要支付
    2000 万欧元或全球年收入 4% 两者中的较高者。


    ### HIPAA：健康保险流通与责任法案


    HIPAA 是一项联邦法律，旨在保护敏感的健康信息，防止其在未经同意或不知情的情况下被披露。这涵盖了任何形式或媒介中的所有可识别个人身份的健康信息。


    ## 使用数据集卡片增强透明度与理解


    数据集卡片（也称为数据卡片）是记录和了解数据集特征的重要工具。它们提供了一种结构化格式来捕捉数据集的关键信息，使人们更容易评估其对于各种用例的适用性。数据集卡片是一份简洁的摘要，提供关于数据集的详细信息，包括其能力、局限性和预期用途。它通常包括但不限于以下关键部分：


    *   **摘要**：对数据集、其目的以及其支持的任务（例如，摘要等）的简要概述。

    *   **语言**：数据集中所包含语言的信息（例如，英语、法语等）。

    *   **结构**：关于数据如何结构化概述，包括数据字段的示例和描述。

    *   **创建**：关于数据集如何被整理和收集的信息。

    *   **源数据**：关于原始数据来源的详细信息，包括收集方法和来源。

    *   **注意事项**：使用数据的伦理和社会影响、偏差、已知局限性以及潜在风险。


    ### 为什么数据集卡片很重要？


    数据集卡片通过提供清晰的文档来增强透明度，帮助人们理解他们正在处理的数据。通过包含数据集卡片，你可以确保数据被恰当使用，并节省人们大量理解如何使用数据的时间。数据集卡片对于任何参与数据分析、数据科学和机器学习的人都很有价值。它提供了一种标准化方式来传达重要信息。我鼓励大家在共享数据时创建数据集卡片。像
    Hugging Face 和 Kaggle 这样的网站通常都包含此类文档。


    ## 结论


    总而言之，显而易见，数据是数据分析、数据科学和人工智能的基础支柱。我们探讨了多种多样的数据类型以及各种获取方法，从网络抓取、访问公共数据集、利用 API 的力量，到创建你自己的数据。


    理解数据、其类型以及如何获取数据，构成了你旅程中至关重要的第一步。你在本章中获得的知识和技能为你进一步探索数据分析、数据科学和人工智能世界的激动人心的冒险奠定了基础。


    我们强调了伦理考量的重要性，这提醒我们，负责任的数据收集和使用是不容商榷的。重要要记住，数据的格局是不断演变的，因此，在你的数据实践中保持好奇心、恪守伦理并勤勉不懈，将确保你始终处于这个充满活力领域的前沿。拥抱复杂性，庆祝数据的多样性，让你对发现的热情引导你穿越数据分析、数据科学和人工智能错综复杂的织锦。


    当你进入下一章时，请带着你已获得的见解和理解，准备好在实际的真实世界场景中应用它们。数据的世界广阔无边，充满潜力——有了知识、好奇心以及强烈的伦理指南针，你现在已准备好自信地航行。


    # 3. ETL 管道


    确保机器学习模型的能力依赖于提供高质量的培训数据。预测的准确性和有效性直接取决于模型训练阶段所使用的数据集的质量。一个构建良好且经过精心整理的数据集是机器学习算法识别模式、掌握复杂关系并理解细微信息的基础。因此，由此产生的模型能更好地做出与数据内在复杂性一致的预测。


    此外，高质量数据的重要性并不仅限于初始训练阶段。随着机器学习的演进并遇到新数据，持续预测的可靠性和相关性内在地与准确且有代表性的数据的持续可用性相关。维护一个健壮的数据基础设施可确保机器学习模型能够适应并响应环境变化，产生反映最新见解和模式的预测。


    本质上，机器学习模型与高质量数据之间的共生关系，凸显了数据质量在这些智能系统的效能、适应性和持续成功中所扮演的关键角色。

    '
- fmt: '# Introduction to ETL


    ETL (Extract, Transform, and Load) is the foundation of creating efficient machine
    learning algorithms. ETL is a three-step data integration process (as seen in
    Figure [3-1](#613832_1_En_3_Chapter.xhtml#Fig1)) where data is extracted from
    one or multiple data sources, transformed (cleaned, scrubbed, formatted), and
    loaded into a database.


    ![](images/613832_1_En_3_Chapter/613832_1_En_3_Fig1_HTML.jpg)


    Figure 3-1


    Image of the ETL pipeline


    There are various types of ETL tools available with nice user-friendly interfaces
    that you can use to complete these tasks. However, Python has many open source
    ETL tools that can get the job done as well. One very popular tool within the
    data scientist community is `Pandas`.


    Within the transformation step of ETL, exploratory data analysis (EDA) and data
    cleaning are important tasks to be performed to identify and remove things such
    as incorrect, corrupted, or duplicate and inconsistent data.


    ## Importance of ETL


    The ETL process plays a pivotal role in ensuring that data, often originating
    from diverse and disparate sources, is harmonized into a uniform structure. As
    businesses accumulate information from various channels, systems, and applications,
    the data may exist in different formats and structures. ETL serves as the bridge
    that normalizes this heterogenous data, resolving inconsistencies and transforming
    it into a standardized format. By enforcing a consistent structure, companies
    can eliminate redundancies, errors, and discrepancies that may arise from disparate
    data sources. This standardization not only facilitates seamless integration but
    also enhances the accessibility of information across the organization.


    Moreover, ETL empowers businesses to break down data silos by consolidating information
    from different departments or systems into a centralized data warehouse or database.
    The consolidation simplifies data retrieval and analysis, providing a comprehensive
    and unified view of the organization’s operations. As a result, teams across various
    departments rely on a single, reliable source of truth, fostering collaboration
    and enabling more efficient decision-making processes.


    The standardized and centralized data obtained through ETL processes serves as
    the foundation for data-driven decision-making. With a consolidated dataset in
    a consistent format, businesses gain the ability to extract meaningful insights,
    identify trends, and derive actionable intelligence. This newfound clarity enables
    stakeholders to make informed decisions, backed by accurate and up-to-date information.
    From strategic planning to operational adjustments, companies can align their
    actions with a deeper understanding of their data, fostering a culture of evidence-based
    decision-making.


    Furthermore, ETL facilitates historical data tracking, allowing companies to monitor
    and evaluate their performance over time. By analyzing historical trends and patterns,
    businesses can identify areas for improvement, assess the impact of strategic
    initiatives, and refine their operations. The continuous loop of data extraction,
    transformation, and loading not only supports day-to-day decision-making but also
    provides a foundation for long-term business optimization, ensuring adaptability
    in an ever-evolving business landscape. In essence, ETL empowers organizations
    to not only understand their current state but also to evolve and thrive in a
    data-driven future. Below is a summarization of some key values ETL brings:


    *   **Singular Perspective**


    Obtaining a comprehensive understanding of your business presents a challenge
    in today’s business environment, as data is often dispersed across various systems
    and applications. Recognizing the significance of ETL in data integration enables
    you to utilize ETL, facilitating the consolidation and analysis of data from diverse
    sources to achieve a more holistic view of your business.


    *   **Automated Processes**


    ETL streamlines repetitive data processing tasks to enhance analysis efficiency.
    ETL tools have the capability to automate data migration and integrate regular
    or on-demand data updates. This enables data engineers to allocate less time to
    routine tasks such as data movement and transformation.


    *   **Data Governance**


    Data governance focuses on the effectiveness, accessibility, consistency, integrity,
    and security of the data. ETL plays a role in supporting data governance by introducing
    a layer of abstraction between the source and target systems, thereby preserving
    data security and lineage. The significance of data governance is becoming more
    evident as it fosters data democracy, enhancing data accessibility and making
    it available to all stakeholders for business analysis.


    *   **Scalability**


    With the escalation in both data volume and complexity, the significance of ETL
    in data integration becomes progressively crucial for companies aiming to maintain
    competitiveness. The ability to scale up ETL pipelines ensures the seamless extraction,
    transformation, and loading of substantial data volumes. Consequently, the company
    can effectively handle the growing influx of data without necessitating frequent
    upgrades, ensuring timely availability for analysis and reporting and maintaining
    system functionality. Scalability can be attained through various methods, including
    distributed processing, parallel processing, data partitioning, and the utilization
    of cloud solutions.


    *   **Rapid Retrieval**


    Efficiently retrieve a multitude of integrated and refined data as a business
    user to support decision-making. As ETL tools handle the bulk of processing during
    data transformation, the imported data is already in a usable format upon entering
    the data store. With a well-defined perspective, your business intelligence applications
    can generate reports more swiftly, as they are spared the need for intricate complications,
    joining records, or the maintenance of formatting standards when querying the
    database.


    *   **Minimization of Human Errors**


    Despite diligent efforts, manually managing data exposes you to risk of errors.
    A small oversight in the early stages of data processing can lead to significant
    consequences. This is because a single mistake can trigger a chain reaction of
    larger errors, perpetuating a continuous cycle. Recognizing the significance of
    ETL solutions, many organizations have embraced automation to minimize manual
    involvement and associated risk of errors, ensuring the delivery of high-quality
    data.


    *   **Enhanced Quality and Uniformity**


    ETL aids in the detection and correction of errors, inconsistencies, and other
    data issues using data cleaning and transformation techniques. This enhances the
    quality, reliability, accuracy, and dependability of decision-making.'
