- fmt: '# Introduction to Exploratory Data Analysis


    In the vast landscape of data analytics, data science, and artificial intelligence,
    a crucial step serves as both a compass and a magnifying glass – exploratory data
    analysis (`EDA`). Much like a seasoned explorer surveying unchartered territory,
    `EDA` delves into datasets and uncovers hidden gems of insight and understanding.
    In this chapter, we embark on a journey through the realms of data exploration,
    understanding its significance and transformative power.


    The essence of exploratory data analysis lies in its capacity to unveil the stories
    concealed within the data folds. It is the art of looking closely beyond the surface,
    seeking patterns, anomalies, and trends that lurk beneath. Creating a toolbox
    with a diverse arsenal of statistical techniques, visualizations, and domain knowledge
    allows you to breathe life into datasets that look like it lacks vigor on the
    surface. You transform rows and columns into narratives of discovery and enlightenment.
    From the quaint quirks of consumer behavior to the intricate dynamics of financial
    markets, `EDA` serves as the conduit through which data speaks its truth.


    Moreover, exploratory data analysis is not merely a technical preamble to more
    sophisticated analysis but an essential voyage of validation and discovery. It
    is the crucible in which hypotheses are forged, assumptions are challenged, and
    insights are distilled. Through critical observation of the quality of the data
    and relationships between variables, `EDA` provides the evidence-based grounding
    upon which robust tools for data analytics, data science, and artificial intelligence
    are constructed. In essence, it is the lighthouse that guides you through the
    tumultuous seas of uncertainty, illuminating the path toward knowledge and understanding.


    Data distributions describe how data points are spread across a dataset. This
    can significantly influence the methods used during `EDA`. Common distributions
    include but are not limited to:


    - **Normal Distribution**: A normal distribution is also known as a Gaussian distribution
    and is symmetrical, with most data clustered around the mean. It forms a bell-shaped
    curve, where values away from the mean become increasingly rare to see in the
    data. In cases like this, standard techniques like getting the mean or standard
    deviation to summarize data are effective.


    - **Skewed Distribution**: When data is not symmetrically distributed, it is either
    right-skewed or left-skewed. This skewness affects the choice of how to summarize
    the data. For example, the mean can be misleading in skewed distributions. So
    getting the median should be used to represent the central value more accurately.
    Visualization methods like histograms or box plots can highlight these patterns.


    - **Uniform Distribution**: In a uniform distribution, every outcome has an equal
    chance of occurring, leading to a rectangular shape when visualized. Traditional
    techniques may not be relevant with this type of data because no single area of
    the data dominates.


    By identifying the data distribution, you can tailor your methods. Techniques
    that work well for normally distributed data might not be suitable for skewed
    or uniform data.


    ## Importance of Exploratory Data Analysis


    Exploratory data analysis is important for several reasons. Below, I will list
    a few reasons to consider:


    ### 1. Understanding the Data


    It helps scientists and analysts comprehend the structure, content, and relationships
    within one or more datasets. `EDA` provides a foundation for further analysis
    by revealing patterns, trends, and potential biases. It guides the direction of
    analysis and questions, driving actionable insights.


    One key element of `EDA` is understanding correlation coefficients, which measure
    the strength and direction between two variables. For example, Pearson’s correlation
    coefficient measures how closely two variables follow a linear relationship. When
    two variables have a linear relationship, it means that as one variable increases
    or decreases, the other does so at a constant rate, forming a straight line when
    plotted on a graph. A Pearson correlation coefficient ranges from -1 to 1, where
    values closer to 1 indicate a strong positive linear relationship and values closer
    to -1 indicate a strong negative linear relationship. A value of 0 suggests no
    relationship. A positive relationship would be when one variable increases or
    decreases, the other variable moves in the same direction. A negative relationship
    is when one variable increases or decreases, the other variable moves in the opposite
    direction.


    Not all relationships between variables are linear. In some cases, variables may
    still move in a consistent direction relative to one another, but not at a constant
    rate. This is called a monotonic relationship. In a monotonic relationship, as
    one variable increases, the other can either increase or decrease, but not necessarily
    at a constant rate. For example, the relationship might curve. When dealing with
    monotonic relationships, Pearson’s correlation may not capture the strength of
    association accurately, which is where Spearman’s rank correlation can be used.
    Spearman’s measures the consistency of the relationship rather than its strict
    linearity.


    `EDA` allows analysts to validate assumptions underlying statistical models and
    methods. By examining data distributions, correlations, and other properties,
    scientists can ensure that their analyses are appropriate and trustworthy.


    ### 2. Data Quality Assessment


    Assessing the quality of the data grants us the opportunity to find any additional
    outliers, incorrect data entries, missing values, and inconsistencies we may have
    missed during the Transformation portion of the ETL pipeline. This ensures the
    data being dealt with is reliable and accurate for analysis and interpretation.


    ### 3. Communication and Data Visualization


    This allows you to communicate the data clearly and concisely to leadership and
    stakeholders. Visual demonstrations of complex data make it more accessible and
    understandable to the general public and leadership.


    ### 4. Feature Selection and Engineering


    After you have a full understanding of your data, it is easier to understand what
    data will be necessary for the next step. When it comes to model development,
    not all models need all your data. The leaner your data is, the more your model
    can focus on what is important to analyze for whatever you have given it to solve.
    Even as humans, it is easier to solve a problem if you are only provided information
    related to your problem instead of giving excess information.


    `EDA` aids in identifying relevant features or variables for predictive modeling
    and decision-making tasks. It also inspires the creation of new features through
    transformations or combinations of the data, which enhances the models’ predictive
    power.


    There are three main types of `EDA`:'
