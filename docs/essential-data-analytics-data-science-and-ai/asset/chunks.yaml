    ## 1. 单变量分析


    单变量分析顾名思义。在进行这种分析时，您一次只探索一个变量。处理数据时，理解数据的内容可能会让人不知所措，因此一种方法可以是分别查看每个变量。单变量分析允许您总结并识别大量数据中的模式。您可以使用图表（例如条形图或频率分布表）来描述该变量中的数据。


    假设您负责审查公司的库存数据库，并需要找到一种更好的方法来现代化其数据管理流程。为此，您需要了解数据中已经包含了什么。您找到的第一个数据集如下表所示。


    乍一看，可能很难从这个数据中识别出关键见解，以了解其对公司的价值。我们可以使用单变量分析来剖析这些数据，以便更好地理解。您可以关注这些列中的任何一列，但对于此示例，让我们关注变量`Category`。


    | 类别 |

    | --- |

    | 电子产品 |

    | 服装 |

    | 电子产品 |

    | 运动、健身与户外 |

    | 娱乐 |

    | 玩具 |

    | 健康 |

    | 学校与办公 |

    | 宠物 |

    | 电子产品 |


    我们可以通过这个变量来观察各类别的频率分布。


    | 类别 | 频率 |

    | --- | --- |

    | 电子产品 | 4 |

    | 服装 | 2 |

    | 运动、健身与户外 | 1 |

    | 娱乐 | 1 |

    | 玩具 | 1 |

    | 健康 | 1 |

    | 学校与办公 | 1 |

    | 宠物 | 1 |


    在这里，我们可以看到我们的库存中有更多电子产品。接下来，我们可以将此信息添加到条形图中，以便更直观地展示数据。


    ![](img/613832_1_En_4_Fig1_HTML.png)


    **图 4-1** 条形图显示数据集中各类别的数量


    然后，我们可以针对上表中的每个变量继续进行相同的单独分析，以理解数据。


    ## 2. 双变量分析


    双变量分析是对两个变量进行分析，以确定它们之间的关系。使用上表中的例子，我们可以分析类别和库存剩余数量之间的关系。我们也可以分析产品和价格之间的关系。其他例子包括，我们可以观察养宠物与情绪健康之间的关系。我们还可以分析金钱与幸福之间的关系。


    ![](img/613832_1_En_4_Fig2_HTML.png)


    **图 4-2** 条形图显示我们库存中各类别的当前库存数量


    ## 3. 多变量分析


    多变量分析涉及分析两个以上的变量，以确定它们之间的关系。它能够识别多个变量间的模式，并提供考虑多种因素的优点。它检查数据中影响主要结果的不同方面。


    ## EDA 的步骤


    前三个步骤与 ETL 过程相关。


    ### 1. 数据收集


    在当今世界，医疗、体育、制造业等诸多领域产生了海量数据。通过深入分析来利用数据价值的认识，在商业界已成为共识。然而，这种分析的有效性取决于从各种来源（如调查、社交媒体以及特定行业数据，如医疗记录）收集必要的数据。没有获取充足且相关的数据，后续工作便无法启动。


    ### 2. 识别并理解所有变量


    随着分析之旅的开启，焦点便落在了可用数据宝库上，这些数据蕴藏着等待发掘的见解。数据环境中存在着代表无数特征或模式的动态数值，它们构成了理解与启发的基石。关键的第一步是识别那些对结果有影响的主要变量，并辨别它们潜在的影响。这一关键步骤为任何分析工作实现最终目标奠定了基础。


    ### 3. 数据集清洗


    此步骤涉及精炼数据集，包括剔除空值和不相关数据。这种精炼确保数据只保留与分析目标相关的信息。这不仅节省了时间，还能在制定项目预算时减少计算资源的需求。数据预处理处理一系列问题，从标记空值到识别离群值和异常值，确保数据集为分析做好准备。


    ### 4. 检测相关变量


    发现变量之间的相关性可以洞悉它们之间的关系。相关性矩阵显示了数据集中变量之间的相关系数。其值范围从 -1 到 1，其中 -1 表示变量间关系较弱，0 表示无关系，1
    表示关系较强。相关性矩阵全面展示了这些联系，有助于理解变量间关键的内在关系。这在 EDA 过程中并非总是必需，但在选择用于训练机器学习算法的变量时可能有用。


    ### 5. 选择合适的统计技术


    根据数据的性质（是分类数据还是数值数据）、数据量、变量类型以及分析目标，会使用各种统计工具。虽然应用于数值数据的统计公式很有价值，但图形化表示通常更吸引人，也更容易解释。


    ### 6. 结果的可视化与检查


    完成分析后，必须彻底审查研究结果，以确保解释的准确性。观察数据趋势和变量间的相关性，为对数据参数和业务决策进行必要调整提供了宝贵见解。一位精通所有相关分析技术的技能娴熟的数据分析师或数据科学家，对此过程至关重要。


    ## 探索性数据分析（EDA）的工具与技术


    有几种常用工具用于执行 EDA。这些工具使得检测模式、发现异常、检验假设和检查假设变得更容易。


    ### Python


    在上一章中，我们提供了一些使用`Python`的例子。`Python`目前是完成人工智能和数据科学任务最流行的编程语言之一。这是因为其语法易于阅读、拥有丰富的库、跨平台兼容性强以及强大的社区支持。这使得初学者和经验丰富的程序员都能更轻松地编写和理解代码，并促进了更快的开发与协作。


    ### R


    `R`是另一种流行的编程语言。它主要用于统计分析和数据可视化。它提供了广泛的数据处理、可视化和统计建模工具。对于统计学家和数据科学家来说，它是一种必不可少的工具。

    '
- fmt: '### Tableau


    `Tableau` is a popular tool for reporting and analyzing large volumes of data.
    It enables users to create a wide range of charts, graphs, maps, dashboards, and
    stories for comprehensive data visualizations and analysis. `Tableau`’s robust
    data discovery and exploration features allow users to quickly answer important
    questions and make informed business decisions. It requires no prior programming
    knowledge, making it easier for anyone regardless of technical experience to get
    started using it immediately.


    ### Power BI


    `Power BI` is another popular tool that requires no prior programming language.
    Similar to `Tableau`, it is used for reporting and analyzing data. It provides
    a suite of business analytics to create data visualizations and share insights
    across organizations.


    ### Example with Code


    I will use `Python` for the following example. You can follow along using free
    software applications like `Jupyter Notebooks`, `Google Colab`, or even `Visual
    Studio Code`.


    #### Installation


    1.  Import required libraries.


    ```

    import pandas as pd

    import seaborn as sns

    ```


    2.  View the data.


    The data we are using for this example is on USA housing prices. There are over
    4000 rows in this data. The dataset can be found on Kaggle: [`https://www.kaggle.com/datasets/fratzcan/usa-house-prices`](https://www.kaggle.com/datasets/fratzcan/usa-house-prices).


    Let’s load the dataset using `pandas` by running the code below:


    ```

    pip install pandas

    ```


    ![](images/613832_1_En_4_Chapter/613832_1_En_4_Fig3_HTML.jpg)


    **Figure 4-3** Image of random samples in the dataset


    ```

    housing_data = pd.read_csv("USA Housing Dataset.csv")

    ```


    The data ranges from May 2014 to July 2014. There are 18 columns within this dataset:


    ![](images/613832_1_En_4_Chapter/613832_1_En_4_Fig4_HTML.jpg)


    **Figure 4-4** Image of lists of cities with the most expensive houses in the
    country and the number of houses in that city with that price


    3.  Explore the data.


    There are many charts, tables, and graphs we can create to help us visualize the
    data better to understand it. Let’s explore the data by viewing what cities have
    houses over 1.5 million dollars.


    ```

    housing_data[housing_data["price"]>1500000][["city"]].value_counts()

    ```


    Here we can see there are 17 cities within our dataset that have homes sold for
    over 1.5 million dollars. Out of this list, Seattle has the most houses, which
    is 37.


    The dataset contains the following columns:


    - `date`: The date the property was sold

    - `price`: The selling price of the property

    - `bedrooms`: Number of bedrooms in the house

    - `bathrooms`: Number of bathrooms in the house

    - `sqft_living`: The square footage of the living area

    - `sqft_lot`: The square footage of the lot

    - `floors`: The number of floors in the property

    - `waterfront`: A binary indicator stating whether the property has a waterfront
    view

    - `view`: A 0–4 rating of the quality of the views the property has

    - `condition`: A 1–5 rating of the condition of the property

    - `sqft_above`: The square footage of the property above the basement

    - `sqft_basement`: The basement square footage

    - `yr_built`: The year when the property was built

    - `yr_renovated`: The year of the most recent renovation of the property

    - `street`: The property’s street address

    - `city`: The city where the property is located

    - `statezip`: The state and zip code of the property

    - `country`: The country of where the property is located


    4.  View the correlation between variables.


    There are 18 columns in this table, but to keep this example simple, we will only
    focus on six:


    - `price`

    - `bedrooms`

    - `yr_built`

    - `floors`

    - `waterfront`

    - `sqft_living`


    You can use other variables, but you may need to clean the data and reformat it
    to be able to use them.


    ![](images/613832_1_En_4_Chapter/613832_1_En_4_Fig5_HTML.jpg)


    **Figure 4-5** Correlation matrix showing the relationship between a few variables
    within the housing dataset


    ```

    correlation_matrix = housing_data[["price","bedrooms","yr_built","floors","waterfront","sqft_living"]].corr()

    sns.heatmap(correlation_matrix, annot=True)

    plt.show()

    ```


    In this correlation matrix, variables closer to 1 have a strong relationship,
    and variables closer to 0 have a weak relationship. Here we can see on the first
    row that `price` is most affected by `sqft_living` compared to the other variables.
    It is least impacted by `yr_built`. This may be a surprising find to some since
    one could assume that the year a house was built would have a higher influence
    on a person’s willingness to buy the property. The relationship between `price`
    and `sqft_living` is 0.42, while the relationship between `price` and `yr_built`
    is 0.027.


    ## Choosing the Right Visualizations for EDA


    Choosing the right visualization technique is crucial for effectively interpreting
    data during EDA. Different visualizations highlight various aspects of data, making
    it easier for you to draw insights and detect patterns.


    - **Box Plots**: Box plots are helpful in understanding the distribution of a
    dataset. They display the median, quartiles, and potential outliers. This is helpful
    when comparing distributions across multiple groups or categories.


    - **Histograms**: These are ideal for visualizing the frequency distributions
    of a single variable, allowing analysts to quickly see the shape of the data (e.g.,
    whether it’s normally distributed or skewed).


    - **Heatmaps**: Heatmaps are effective for visualizing relationships between multiple
    variables, particularly through a correlation matrix, as seen in Figure [4-5](#613832_1_En_4_Chapter.xhtml#Fig5).
    This type of visualization uses color gradients to indicate the strength of correlation
    between pairs of variables, making it easy to detect strong or weak relationships
    at a glance.


    - **Scatter Plots**: Scatter plots are typically used to examine relationships
    between two numeric variables. They are typically helpful in spotting trends,
    patterns, and possible linear or nonlinear relationships.


    - **Bar Charts**: Bar charts are a simple yet powerful tool for comparing different
    categories. They work well for both categorical and discrete data, allowing analysts
    to compare quantities across groups or time periods. For example, bar charts can
    show sales data across various product categories or regions.


    - **Pie Charts**: Pie charts are useful when you want to represent the proportions
    of a whole. Each slice of the pie represents a category’s contribution to the
    total. However, pie charts work best when there are a limited number of categories,
    and the differences between them are significant; otherwise, it will be hard to
    interpret.


    - **Line Charts**: Line charts are commonly used for tracking changes and trends
    over time. They are particularly effective when working with time series data,
    such as stock prices, weather patterns, or sales performance across months. Line
    charts make it easy to visualize continuous data and detect upward and downward
    trends over time.


    Each visualization serves a different purpose, and selecting the right one depends
    on the nature of the data and the questions being asked. For example, box plots
    are ideal for comparing distributions, and heatmaps are better suited for assessing
    correlations across multiple variables. Bar charts and pie charts are great for
    comparing categorical data, and line charts are great for time-based trends. By
    choosing the appropriate visualization, you can more effectively explore the data
    and uncover actionable insights.


    ## Use Cases of EDA for Business


    Practical examples of how EDA can be implemented provide invaluable insights into
    how EDA can be applied in practice across various domains. Below are a few examples
    to illustrate the importance and effectiveness of EDA.'
