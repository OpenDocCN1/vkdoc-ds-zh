- fmt: "### Google Colab\n\nGoogle Colab 是一个免费的云服务，支持 Jupyter Notebook，并提供免费的 GPU\
    \ 访问权限，因此非常适合进行机器学习实验。它提供了一个便捷的平台，用于开发和测试机器学习模型，无需复杂的设置或硬件资源。Google Colab 与 Google\
    \ Drive 的集成功能，让笔记本和数据的存储与共享变得轻松。\n\n其他可用于机器学习开发的 IDE 包括 Visual Studio Code 和 PyCharm。\n\
    \n#### 代码示例\n在此示例中，我们将使用一个机器学习模型，根据工作年限来预测薪资。\n\n1.  导入所需的库。\n\n    ```python\n\
    \    import pandas as pd\n    from sklearn.model_selection import train_test_split\n\
    \    from sklearn.linear_model import LinearRegression\n    import matplotlib.pyplot\
    \ as plt\n    import pickle\n    ```\n\n2.  加载数据集。此数据集可在 Kaggle 上找到：[`https://www.kaggle.com/datasets/abhishek14398/salary-dataset-simple-linear-regression`](https://www.kaggle.com/datasets/abhishek14398/salary-dataset-simple-linear-regression).\n\
    \n    ![](images/613832_1_En_5_Chapter/613832_1_En_5_Fig5_HTML.jpg)\n\n    **图\
    \ 5-5**：本示例所用数据集中的数据样本。这是数据集中的前几行。\n\n    ```python\n    examp1_data = pd.read_csv(\"\
    salary_dataset.csv\")\n    examp1_data.head(5)\n    ```\n\n3.  我们将使用工作年限作为模型的输入，薪资作为模型的输出。\n\
    \n    ```python\n    x = examp1_data[[\"YearsExperience\"]]\n    y = examp1_data[[\"\
    Salary\"]]\n    ```\n\n4.  我们首先需要分割数据集，以确保有足够的数据来训练和测试模型。通常，数据按照 80% 用于训练，20%\
    \ 用于测试的比例分割。\n\n    我们将使用`x_train`和`y_train`进行训练，使用`x_test`和`y_test`测试模型。\n\n\
    \    `random_state`是一个参数，用于确保数据分割的可重复性。这意味着每次运行这行代码时，`x_train`、`x_test`、`y_train`、`y_test`\
    \ 中分配的数据都是相同的，而不是随机的。\n\n    ```python\n    x_train, x_test, y_train, y_test =\
    \ train_test_split(x, y, train_size=.8, random_state=42)\n    model = LinearRegression()\n\
    \    model.fit(x_train, y_train)\n    ```\n\n5.  现在，让我们使用模型，根据模型从未见过的“工作年限”数据来预测薪资。这些数据已保存在变量`x_test`中。接下来，将预测结果保存在`lr_predictions`中，并将其绘制成图表。\n\
    \n    ```python\n    lr_predictions = model.predict(x_test)\n    ```\n\n6.  现在，绘制数据图表。\n\
    \n    ![](images/613832_1_En_5_Chapter/613832_1_En_5_Fig6_HTML.jpg)\n\n    **图\
    \ 5-6**：展示模型对未来十年薪资预测的图表。\n\n    ```python\n    plt.scatter(x_test, y_test)\n\
    \    plt.plot(x_test, lr_predictions)\n    plt.xlabel(\"Years\")\n    plt.ylabel(\"\
    Salary\")\n    plt.title(\"Title: Predicted Salary Based on Years of Experience\"\
    )\n    ```\n\n7.  现在，保存模型以便后续使用。我们将其保存为一个 pickle 文件，命名为`lr_salary_determinator_model.pkl`。\n\
    \n    ```python\n    lr_model_pickle_file = \"lr_salary_determinator_model.pkl\"\
    \n    with open(lr_model_pickle_file, \"wb\") as file:\n        pickle.dump(model,\
    \ file)\n    ```\n\n8.  现在，加载 pickle 文件，并再次使用之前`x_test`中的数据来运行模型。\n\n    ```python\n\
    \    with open(\"lr_salary_determinator_model.pkl\",\"rb\") as file:\n       \
    \ model = pickle.load(file)\n    predictions = model.predict(x_test)\n    ```\n\
    \n在此示例中，我们将使用一个深度学习模型来识别图像中的动物。\n\n1.  导入所需的库。\n\n    ```python\n    from transformers\
    \ import pipeline\n    from PIL import Image\n    ```\n\n2.  在此示例中，我们将使用一张动物图片。\n\
    \n    ```python\n    image = Image.open(\"ostrich.jpg\")\n    ```\n\n3.  我们将使用\
    \ Hugging Face 上一个名为`google/vit-base-patch16-224`的模型。\n\n    ```python\n    model_name=\
    \ \"google/vit-base-patch16-224\"\n    image_classifier = pipeline(\"image-classification\"\
    , model=model_name)\n    ```\n\n4.  将图像输入模型，等待其预测结果。\n\n    ```python\n    image_classification_prediction\
    \ = image_classifier(image)\n    ```\n\n5.  以下是模型的输出结果。它按置信度从高到低输出了五个预测。置信度最高的是鸵鸟，置信度为\
    \ 0.99。模型的置信度得分范围通常是 0 到 1 或 0 到 100%。\n\n    ```python\n    [{'label': 'ostrich,\
    \ Struthio camelus', 'score': 0.9992263317108154},\n    {'label': 'bustard', 'score':\
    \ 9.642778604757041e-05},\n    {'label': 'black stork, Ciconia nigra', 'score':\
    \ 4.994613482267596e-05},\n    {'label': 'zebra', 'score': 1.568139487062581e-05},\n\
    \    {'label': 'flamingo', 'score': 1.4048618140805047e-05}]\n    ```\n\n### 特征选择与特征工程\n\
    \n特征选择是从数据集中挑选出最重要的信息（特征），并剔除那些可能混淆模型的不必要内容。另一方面，特征工程则是创建数据集中原本不存在但可能有助于模型做出更好预测的新数据。\n\
    \n当我们训练一个机器学习模型时，通常从大量数据开始，但并非所有数据都有用。有些数据可能包含噪声、不相关，或者只是增加了模型训练负担的额外信息。通过只选择最佳特征，我们可以帮助模型运行得更快，并做出更好的预测。\n\
    \n例如，假设你要构建一个机器学习模型来预测哪些学生会在数学竞赛中表现出色。你的数据集中包含了学生的数学成绩、拥有数学书的数量以及他们最喜欢的电视节目。成绩和数学书数量可能有帮助，但他们最喜欢的电视节目可能无助于预测竞赛表现。因此，你会移除电视节目数据，专注于更相关的特征来构建模型。然而，你也可以通过特征工程创建一个新特征。例如，利用他们最喜欢的电视节目，创建一个特征来识别哪些节目具有浓厚的数学主题，并创建一个二元特征（例如，Math-Focused-Show\
    \ = 1 或 0），以观察这是否会影响学生在竞赛中的表现。\n\n### 预训练模型与微调模型\n\n**预训练模型**：一个已经在大量数据上训练过以执行特定任务的模型。它可以按原样使用，也可以通过微调等方法进行调整，以适应不同行业和用例的各种需求。我们第二个代码示例中的模型就是一个预训练模型。\n\
    \n**微调模型**：微调是获取一个预训练模型，并通过使用一个更小、更专注的数据集对其进行调整，使其能更好地完成特定任务的过程。这有助于模型精炼其技能，并在手头的具体任务上表现得更好。\n\
    \n### 提示工程\n\n提示（Prompt）是要求机器学习模型执行特定操作的文本，例如回答问题或完成任务。提示工程（Prompt Engineering）则是精心设计和调整这些提示，以使模型给出你想要的精确回复。这就像你给出指示或向某人提问的方式。在人工智能领域，模型从大量数据中学习，恰当的提示对于模型能否正确理解你的请求至关重要。"
  raw: '##### Google Colab


    Google Colab is a free cloud service that supports Jupyter Notebooks and provides
    free access to GPUs, making it suitable for ML experiments. It offers a convenient
    platform for developing and testing machine learning models without the need for
    complex setup or hardware resources. Google Colab’s integration with Google Drive
    allows for easy storage and sharing of notebooks and data.


    Other IDEs that can be used for machine learning development include Visual Studio
    Code and PyCharm.


    EXAMPLE WITH CODE


    In this example, we will use a machine learning model to predict salaries based
    on the number of years of work experience.


    Import required libraries.


    ```

    import pandas as pd

    from sklearn.model_selection import train_test_split

    from sklearn.linear_model import LinearRegression

    import matplotlib.pyplot as plt

    import pickle

    ```


    Load the dataset. This dataset can be found on Kaggle: [`https://www.kaggle.com/datasets/abhishek14398/salary-dataset-simple-linear-regression`](https://www.kaggle.com/datasets/abhishek14398/salary-dataset-simple-linear-regression).


    ![](images/613832_1_En_5_Chapter/613832_1_En_5_Fig5_HTML.jpg)


    Figure 5-5


    A sample of the data within the dataset we are using for this example. This is
    the first rows in the dataset


    ```

    examp1_data = pd.read_csv("salary_dataset.csv")

    examp1_data.head(5)

    ```


    We will use years of experience as the input to the model and salary as what we
    want our model to output.


    ```

    x = examp1_data[["YearsExperience"]]

    y = examp1_data[["Salary"]]

    ```


    We should first split the dataset to ensure we have enough data to train the model
    and enough to test the model. Typically, the data is split with 80 percent of
    the data used for training and 20 percent of the data used for testing.


    We will use `x_train` and `y_train` for training and `x_test` and `y_test` for
    testing the model.


    `random_state` is a parameter set to ensure the reproducibility of the split in
    data. So every time you run this line of code, the same data will be set to `x_train,
    x_test, y_train, y_test` instead of random numbers`.`


    ```

    x_train, x_test, y_train, y_test = train_test_split(x, y, train_size=.8, random_state=42)

    model = LinearRegression()

    model.fit(x_train, y_train)

    ```


    Let’s use our model to predict salaries using the years of experience data the
    model has not seen. This data was saved in the variable `x_test`. Next, let’s
    save those results in `lr_predictions` and plot them.


    ```

    lr_predictions = model.predict(x_test)

    ```


    Now, let’s plot the data.


    ![](images/613832_1_En_5_Chapter/613832_1_En_5_Fig6_HTML.jpg)


    Figure 5-6


    A graph displaying the model’s predictions of salary in the next ten years


    ```

    plt.scatter(x_test, y_test)

    plt.plot(x_test, lr_predictions)

    plt.xlabel("Years")

    plt.ylabel("Salary")

    plt.title("Title: Predicted Salary Based on Years of Experience")

    ```


    Now, let’s save the model so that we can use it later. We save it in a pickle
    file and name it `lr_salary_determinator_model.pkl`


    ```

    lr_model_pickle_file = "lr_salary_determinator_model.pkl"

    with open(lr_model_pickle_file, "wb") as file:

    pickle.dump(model, file)

    ```


    Now, let’s load our pickle file and use the model with the same data in `x_test`
    we used previously.


    ```

    with open("lr_salary_determinator_model.pkl","rb") as file:

    model = pickle.load(file)

    predictions = model.predict(x_test)

    ```


    In this example, we will use a deep learning model to identify animals in an image.


    Import required libraries.


    ```

    from transformers import pipeline

    from PIL import Image

    ```


    In this example, we will use an image of an animal.


    ```

    image = Image.open("ostrich.jpg")

    ```


    We will use a model from Hugging Face called `google/vit-base-patch16-224`.


    ```

    model_name= "google/vit-base-patch16-224"

    image_classifier = pipeline("image-classification", model=model_name)

    ```


    Here, we input the image into the model and wait for its predictions.


    ```

    image_classification_prediction = image_classifier(image)

    ```


    Below are the outputs from the model. It outputted five predictions in order of
    how confident it is. The first is an ostrich with .99 confidence. The confidence
    scores for models typically range from 0 to 1 or 0 to 100%.


    ```

    [{''label'': ''ostrich, Struthio camelus'', ''score'': 0.9992263317108154},

    {''label'': ''bustard'', ''score'': 9.642778604757041e-05},

    {''label'': ''black stork, Ciconia nigra'', ''score'': 4.994613482267596e-05},

    {''label'': ''zebra'', ''score'': 1.568139487062581e-05},

    {''label'': ''flamingo'', ''score'': 1.4048618140805047e-05}]

    ```


    ## Feature Selection and Engineering


    Feature selection is about picking out the most important pieces of information
    (features) from a dataset and getting rid of the unnecessary stuff that could
    confuse the model. On the other hand, feature engineering involves creating new
    pieces of data that aren’t initially in the dataset but could help the model make
    better predictions.


    When we train a machine learning model, we start off with a lot of data, but not
    all of it is useful. Some data might be noisy, irrelevant, or just extra information
    that just slows down the model’s training. By selecting only the best features,
    we can help the model work faster and make better predictions.


    For example, imagine you are building a machine learning model to predict which
    students will do well in a math competition. You have a dataset that includes
    the students’ grades in math, the number of math books they own, and their favorite
    TV shows. The grades and the number of math books might be helpful, but their
    favorite TV shows probably won’t help predict how well they will do in the competition.
    So you would remove the TV show data and focus on the more relevant features to
    build the model. However, you could create a new feature through feature engineering.
    For example, you could take their favorite TV shows and use that to create a feature
    that identifies which TV shows have a strong math theme and create a binary feature
    (e.g., Math-Focused-Show = 1 or 0) to see if that plays a role in how good a student
    will be in the competition.


    ## Pre-trained vs. Fine-Tuned Models


    Pre-trained Model: A model already trained on large amounts of data to perform
    a task. It can be used as it is or tailored to fit different needs across various
    industries and use cases using methods like fine-tuning. The model in our second
    code example is a pre-trained model.


    Fine-Tuned Model: Fine-tuning is the process of taking a pre-trained model and
    adjusting it to work better for a specific task by using a smaller, more focused
    dataset. This helps the model refine its skills and perform better on the particular
    task at hand.


    ## Prompt Engineering


    A prompt is a text that asks a machine learning model to do something specific,
    like answering a question or completing a task. Prompt engineering is carefully
    crafting and adjusting these prompts to get the model to give the exact responses
    you want. It’s like the way you give instructions or ask a person questions. In
    the world of AI, where the models learn from a lot of data, the right prompt can
    make a big difference in whether the model understands your request or gets it
    wrong.'
