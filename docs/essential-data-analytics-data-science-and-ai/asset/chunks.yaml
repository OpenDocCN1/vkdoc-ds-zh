- fmt: "### Key Concepts and Terminology\n\n- **Feed Forward**: A feed forward neural\
    \ network is a basic type of neural network characterized by its straightforward\
    \ information flow. Data travels in only one direction, from input nodes to hidden\
    \ nodes and ultimately to the output nodes. Each node processes the input and\
    \ passes it to the next layer.\n- **Backpropagation**: Backpropagation is a learning\
    \ method for neural networks. It’s like teaching the network to learn from its\
    \ mistakes. It helps improve neural networks by figuring out how far off it was\
    \ and then makes adjustments to its settings to get closer to the correct answer.\n\
    - **Recurrent Neural Network (RNN)**: RNN is a type of neural network that is\
    \ trained to handle data that comes in a sequence, like a series of events over\
    \ time. This allows the RNN to make predictions or decisions based on the order\
    \ of the inputs. For example, an RNN may be used to predict how much a stock price\
    \ will change by looking at past prices and market trends. RNNs are unique because\
    \ they have “memory.” This means they use information from earlier inputs to help\
    \ understand the current input to help produce the correct output. Unlike other\
    \ types of neural networks, which treat each input separately, RNNs rely on the\
    \ order of the sequence. Imagine you are trying to bake a cake. The order of the\
    \ steps is essential. You can’t bake the cake without mixing the ingredients in\
    \ order. Similarly, an RNN remembers the sequences of steps and uses that to predict\
    \ what comes next.\n- **Long Short-Term Memory (LSTM)**: LSTMs are special types\
    \ of RNNs designed to fix a problem that regular RNNs have. Regular RNNs can struggle\
    \ to remember details when they are dealing with long sequences of information.\
    \ This makes it difficult to connect things that happened a while ago to what’s\
    \ happening now. LSTMs solve this issue because they are built to remember information\
    \ over long periods. In fact, holding onto important details for a long period\
    \ of time is what they are really good at!\n- **Convolutional Neural Network (CNN)**,\
    \ a.k.a. ConvNets: CNNs are typically used for object detection and image classification\
    \ tasks.\n- **Generative Adversarial Network (GAN)**: GANs are made up of two\
    \ neural networks: one is called the generator, and the other is called the discriminator.\
    \ The generator’s job is to create new samples that resemble the training dataset,\
    \ while the discriminator’s job is to tell the difference between the real samples\
    \ and the ones the generator makes. The term “adversarial” comes from how the\
    \ two networks are set up to compete. A GAN could be used to create new images\
    \ based on a collection of existing images or to generate new music by learning\
    \ from a database of songs. GANs can be used to create realistic images from text\
    \ descriptions or to improve existing photos. They can also be used to make new\
    \ synthetic data that has the same characteristics as real data.\n- **Transformers**:\
    \ Transformers are a type of neural network that changes an input sequence, like\
    \ a sentence, into an output sequence by understanding the context and relationships\
    \ between the parts of the sequence. Unlike other neural networks like RNNs and\
    \ CNNs, transformers are faster and more efficient because they process sequences\
    \ all at once, rather than one step at a time. This means they need less training\
    \ time and can work more quickly. Transformers have two important features that\
    \ make them powerful for tasks like predicting text:\n    1.  **Positional Encoding**:\
    \ Instead of just reading words in the order they appear, transformers assign\
    \ a unique number to each word. This helps the model understand the order of the\
    \ words in a sentence, which is important for making sense of the meaning.\n \
    \   2.  **Self-attention**: This feature allows the model to focus on the relationships\
    \ between all the words in a sentence at the same time. It learns which words\
    \ are important to each other, helping the model predict what comes next in a\
    \ sequence. For example, transformers can “learn” grammar rules by figuring out\
    \ how words usually fit together.\n- **Large Multimodal Model (LMM)**: A deep\
    \ learning model that is a combination of a LLM and MM.\n- **Retrieval Augmented\
    \ Generation (RAG)**: RAG is a technique used to make machine learning models\
    \ more accurate by pulling in facts from outside sources. LLMs and LMMs are powerful,\
    \ and they can do things like answer questions, extract texts from documents,\
    \ or translate languages, but they have some limits. For example, they can only\
    \ use the information they were trained on, which might be outdated or incomplete.\
    \ Sometimes, they might even give wrong answers if they don’t know something.\
    \ RAG helps solve these problems by allowing the model to check a reliable source\
    \ of information before giving an answer. This allows the model to provide more\
    \ accurate and up-to-date responses without needing to be retrained or fine-tuned.\n\
    - **Generative Artificial Intelligence (GEN AI)**: A deep learning model that\
    \ has the ability to create new content based on a user’s request or prompt.\n\
    - **Large Language Model (LLM)**: A deep learning model that is only able to understand\
    \ and generate text data.\n- **Multimodal Models (MM)**: A deep learning model\
    \ that is capable of handling different modalities. Examples of this can be text,\
    \ audio, or images. A model being multimodal can mean one or more of the following:\n\
    \    1.  The modalities of the input and output are different (i.e., image – to\
    \ - text).\n    2.  The inputs to the model are multimodal (i.e., the model can\
    \ accept both text and images).\n    3.  The outputs of the model are multimodal\
    \ (i.e., the model can generate both text and images).\n\n![](images/613832_1_En_5_Chapter/613832_1_En_5_Fig4_HTML.jpg)\n\
    \n**Figure 5-4** A guide from the `scikit-learn` website to help in the selection\
    \ of machine learning algorithms, such as classification, clustering, and regression,\
    \ based on dataset size, number of features, and types of issues addressed (`sckit-learn`\
    \ algorithm cheat-sheet, n.d.)\n\nMachine learning models come in various forms,\
    \ each with strengths and weaknesses. The choice of model depends on the specific\
    \ problem, the nature of the data, and the desired outcome.\n\n## Importance of\
    \ Machine Learning Models\n\nMachine learning models have the potential to be\
    \ crucial across various sectors.\n\n### Healthcare\n\nIn healthcare, ML models\
    \ can be instrumental in enhancing diagnostic accuracy, personalizing treatment\
    \ plans, predicting patient outcomes, and assisting in educational outreach. For\
    \ instance, deep learning models can be utilized to analyze medical images and\
    \ detect anomalies in your body, such as fractures and pathologies. Models can\
    \ assist in playing a crucial role in identifying patients at risk of developing\
    \ chronic conditions such as diabetes and heart disease, enabling early interventions\
    \ that can improve patient outcomes in life. Models can also play a role in accelerating\
    \ the process of extracting patient information from handwritten and scanned documents.\n\
    \n### Finance\n\nThe financial sector can use machine learning models in many\
    \ ways, such as fraud detection and forecasting. Fraud detection models analyze\
    \ patterns to identify fraudulent behavior, protecting financial institutions\
    \ and their customers. In forecasting, a machine learning model can analyze market\
    \ trends and predict potential risks, helping financial institutions make informed\
    \ decisions."
  raw: "### Key Concepts and Terminology\n\n*   Feed Forward: A feed forward neural\
    \ network is a basic type of neural network characterized by its straightforward\
    \ information flow. Data travels in only one direction, from input nodes to hidden\
    \ nodes and ultimately to the output nodes. Each node processes the input and\
    \ passes it to the next layer.\n\n*   Backpropagation: Backpropagation is a learning\
    \ method for neural networks. It’s like teaching the network to learn from its\
    \ mistakes. It helps improve neural networks by figuring out how far off it was\
    \ and then makes adjustments to its settings to get closer to the correct answer.\n\
    \n*   Recurrent Neural Network (RNN): RNN is a type of neural network that is\
    \ trained to handle data that comes in a sequence, like a series of events over\
    \ time. This allows the RNN to make predictions or decisions based on the order\
    \ of the inputs. For example, an RNN may be used to predict how much a stock price\
    \ will change by looking at past prices and market trends.\n\n    RNNs are unique\
    \ because they have “memory.” This means they use information from earlier inputs\
    \ to help understand the current input to help produce the correct output. Unlike\
    \ other types of neural networks, which treat each input separately, RNNs rely\
    \ on the order of the sequence.\n\n    Imagine you are trying to bake a cake.\
    \ The order of the steps is essential. You can’t bake the cake without mixing\
    \ the ingredients in order. Similarly, an RNN remembers the sequences of steps\
    \ and uses that to predict what comes next.\n\n*   Long Short-Term Memory (LSTM):\
    \ LSTMs are special types of RNNs designed to fix a problem that regular RNNs\
    \ have. Regular RNNs can struggle to remember details when they are dealing with\
    \ long sequences of information. This makes it difficult to connect things that\
    \ happened a while ago to what’s happening now. LSTMs solve this issue because\
    \ they are built to remember information over long periods. In fact, holding onto\
    \ important details for a long period of time is what they are really good at!\n\
    \n*   Convolutional Neural Network (CNN), a.k.a. ConvNets: CNNs are typically\
    \ used for object detection and image classification tasks.\n\n*   Generative\
    \ Adversarial Network (GAN): GANs are made up of two neural networks: one is called\
