  trans: "\n# 何时使用机器学习模型简介\n\n机器学习通过赋予系统无需显式编程即可从经验中学习和改进的能力，彻底改变了各个领域。从医疗保健和金融到零售和娱乐，机器学习是推动创新和效率的核心力量。在第\
    \ 5 章中，我们讨论了不同类型的机器学习模型。然而，是否采用机器学习应审慎决策，因为它涉及复杂的算法、大量的数据和计算资源。本章将深入探讨机器学习模型能够发挥作用的判断标准和适用场景，确保其应用能产生最佳效果。本章将探讨何时选择机器学习模型是合适的，并提供指导方案以及其他可能更符合需求的替代选择。\n\
    \n# 理解何时使用机器学习模型的重要性\n\n理解何时部署机器学习模型至关重要，原因如下：\n\n1. **资源优化**  \n   机器学习项目需要在数据收集、处理和算法研发方面进行大量投入。正确判断是否需要机器学习，能确保资源得到有效利用。\n\
    \n2. **问题适用性**  \n   并非所有问题都适合用机器学习解决。有些问题可能更适合通过简单的统计方法或基于规则的体系来处理。误用会导致效率低下、效果不佳以及不必要的开支。\n\
    \n3. **性能与可扩展性**  \n   机器学习模型能够利用其处理海量数据和自动化决策等能力，为涉及大规模数据集和复杂问题的情况提供可扩展的解决方案。了解何时使用机器学习，有助于确保这些优势被用来提升性能。随着规模扩大，监控模型性能变得至关重要。在第\
    \ 6 章中，我们讨论了各种类型的模型性能指标。这些指标有助于清晰了解模型的运行状况，帮助识别模型漂移或性能下降等问题，同时也能用于比较不同模型，以便为您的业务需求选择最合适的模型。\n\
    \n4. **创新与竞争优势**  \n   合理运用机器学习能催生创新解决方案，从而在市场中占据竞争优势。它可以实现流程自动化、挖掘洞察并增强决策能力。\n\
    \n# 评估机器学习模型的必要性与价值\n\n## 识别合适的问题\n\n有时，用最简单的方式解决问题才是上策。在决定是否使用机器学习模型时，必须考虑问题的复杂性以及模型所需的更新频率。如果一个问题能用直接的一次性解决方案解决（例如简单的计算），那么机器学习模型可能并非必要。机器学习模型最适合需要持续学习和频繁更新的场景，而这并非所有问题都具备。\n\
    \n机器学习模型在需要不断进化和适应的场景中表现出色。这些场景包括：需要持续调整的重大复杂问题、随时间推移而不断演进的开放式挑战、正确答案频繁变化的情况，以及本质上极其困难、挑战人类能力极限的问题。如果你的问题属于这些类别之一，那么机器学习模型可能是正确的选择。\n\
    \n## 应对开放式挑战\n\n有些挑战规模庞大且具有开放性，这意味着它们没有单一的固定解决方案。这些问题会持续演变，需要长期投入且没有明确的终点。例如，为流媒体服务策划推荐内容就涉及每天处理新信息。\n\
    \n在这种情况下，设置好便不再过问的一次性解决方案很难奏效。相反，这些场景需要能够随时间适应和成长的机器学习模型，它能随着新数据的出现持续学习和更新。如果你的问题定义明确且范围有限，则可能不需要机器学习模型。然而，对于庞大且持续存在的挑战，机器学习模型可能是跟上不断变化的环境的正确选择。\n\
    \n我们在第 5 章中讨论过的模型类型中，有一个非常适合应对开放式挑战的例子——强化学习模型。这类模型通过与环境的互动进行学习，非常适合那些需要持续改进的任务，例如优化电商平台或流媒体服务的推荐系统，以及管理自动驾驶车辆。\n\
    \n## 适应动态环境中的变化\n\n涉及变化的问题可能比较棘手，因为今天有效的方法明天可能就不灵了。当处理条件频繁或不可预测地变化的问题时，机器学习模型会非常有用。这些模型能够快速学习并适应新情况，确保它们随着事物的发展而保持有效。如果你的领域变化缓慢或遵循可预测的模式，那么更简单的方案可能就足够了。然而，如果你面临快速或出乎意料的变化，机器学习模型可能是跟上节奏、保持相关性的最佳方式。\n\
    \n## 解决棘手问题\n\n有些问题极其复杂，甚至连人类也难以完美解决。例如，在复杂游戏中表现出色或理解外语。机器学习模型在解决这些挑战性问题方面取得了显著进展，但这需要多年的开发和数据积累。在需要处理海量数据或从复杂信息中提取模式等特定任务中，机器学习模型具有优势。通过持续整合用户反馈并优化模型，这些先进的解决方案可以在应对更本质的难题方面取得实际进展。\n\
    \n不过，有些领域仍然需要人类的直觉和专业知识，例如需要创造力、情商或深层上下文理解的任务。\n\n## 成功部署机器学习模型的关键条件\n\n要让机器学习有效发挥作用，不仅仅需要有挑战性的问题。该问题还需满足几个关键条件：\n\
    \n*   模型必须能够从长期使用过程中生成的数据中收集信息并进行学习。\n*   模型应力求实现一个重要的目标。\n*   总体投入应值得其投资。\n"
- fmt: "### Critical Conditions for Successful AI Products\n\nMachine learning models\
    \ are rarely perfect and make mistakes. What’s crucial is that they provide enough\
    \ value to outweigh their errors. For a machine learning model to be viable, it\
    \ should offer significant benefits that surpass the costs of its mistakes. For\
    \ example, a model that optimizes grocery shopping for customers might occasionally\
    \ make small errors that cause slight delays. As long as these errors are infrequent\
    \ and the system overall saves users time, it can be considered valuable.\n\n\
    In contrast, a model used for critical tasks, like controlling surgical robots\
    \ or helicopters, must be much more reliable since mistakes can have severe consequences.\
    \ Even in such high-stakes situations, the model doesn’t need to be flawless but\
    \ should be significantly better than alternatives. The key is that a machine\
    \ learning model must offer enough positive outcomes to justify its use, even\
    \ if it’s not perfect.\n\nFor a machine learning model to be seen as most effective,\
    \ it must be able to directly influence the desired outcome. This means it should\
    \ either automate processes or provide information and options that help users\
    \ achieve their goals. The model works best when it can make actions that have\
    \ a clear and immediate impact on the product’s goal. If the model’s actions lead\
    \ to positive results, it should be evident that the model performed well, and\
    \ if the outcomes are negative, it should be clear that the model’s performance\
    \ was lacking. The fewer external factors that affect the results, the more effective\
    \ the machine learning model can be.\n\nWhen deploying machine learning models,\
    \ it’s important to find the right balance – too broad a goal can make it difficult\
    \ to connect a model’s actions to its outcomes. In large, complex products, multiple\
    \ machine learning models can be used for different tasks. You could use one model\
    \ for multiple tasks, but the feedback from users would not relate directly enough\
    \ to the specific decisions the machine learning model needs to make to get better.\n\
    \n### Enhancing Your Model by Leveraging the Data from Interactions with It\n\n\
    Machine learning models improve over time by learning from how end users interact\
    \ with them. When users engage with your product that incorporates a machine learning\
    \ model, it should collect data about their actions, the results they experience,\
    \ and their feedback. This is part of telemetry data, which is discussed in Chapter\
    \ [9](#613832_1_En_9_Chapter.xhtml). This data is crucial because it helps the\
    \ machine learning model become smarter and more effective, making it more valuable\
    \ for the end users.\n\nFor example, to enhance the machine learning model, it’s\
    \ essential to record detailed information about user interactions. This involves\
    \ tracking things like:\n\n- What users see\n- How they respond\n- And whether\
    \ their experience is positive or negative\n\nBy analyzing this data, machine\
    \ learning models can be continuously refined to better meet the end users’ needs.\
    \ This will enhance your reputation and financial prospects overall for you and\
    \ your company.\n\n### Cost Considerations for AI Products\n\nThe costs associated\
    \ with AI products differ from those of traditional methods. There are three main\
    \ components of these costs:\n\n- **Machine Learning Model**: The component of\
    \ the product that makes decisions and determines the best actions\n- **Implementation**:\
    \ Covers the actual development and integration of the backend system, model,\
    \ and any other components, including the user interfaces\n- **Orchestration**:\
    \ Involves managing the product throughout its life cycle to ensure it continues\
    \ to meet goals and handle errors\n\nIn general, the machine learning model component\
    \ of the AI product is often less expensive because these models can automatically\
    \ generate the output of the product instead of a human and it can produce the\
    \ necessary training data through user interactions. This reduces the need for\
    \ manual data collection and can overall save money. However, implementation costs\
    \ for machine learning models can be comparable to or slightly higher than traditional\
    \ methods due to the added complexity of creating, integrating, and organizing\
    \ these components. The orchestration costs also tend to be higher, as they involve\
    \ ongoing management tasks like tuning, updating, and correcting errors.\n\n###\
    \ When to Consider Alternatives\n\nSometimes, you might have a situation involving\
    \ users, data, and decision-making, but you’re unsure if a machine learning model\
    \ is necessary. This uncertainty can stem from several reasons: you may doubt\
    \ whether your problem is complex enough to require a machine learning model,\
    \ you may question whether the effort and costs of implementing such a model are\
    \ justified, or you prefer to address issues incrementally rather than committing\
    \ to researching and developing machine learning models from the start.\n\nIt’s\
    \ perfectly fine to explore other methods for solving challenging problems, and\
    \ machine learning models aren’t the only solutions.\n\n## Tools and Techniques\
    \ of When to Use Machine Learning Models\n\n![](images/613832_1_En_7_Chapter/613832_1_En_7_Fig1_HTML.jpg)\n\
    \nFigure 7-1\n\nSample checklist of evaluating an AI project’s viability\n\n**More\
    \ Key Indicators You Can Use for Deciding on Employing Machine Learning Models\
    \ in Your Product or Systems**\n\n1.  **Large and Complex Datasets**\n\n    When\
    \ the data size is substantial and contains intricate patterns that are not easily\
    \ captured by traditional methods, machine learning is a valuable tool.\n\n2.\
    \  **Predictive Analysis**\n\n    If the goal is to predict future trends based\
    \ on historical data.\n\n3.  **Pattern Recognition**\n\n    Tasks involving pattern\
    \ recognition, such as image recognition, anomaly detection, and clustering, can\
    \ be prime candidates for machine learning.\n\n4.  **Automation of Repetitive\
    \ Tasks**\n\n    When repetitive tasks need automation, such as in manufacturing\
    \ or data extraction, machine learning can provide efficient solutions.\n\n5.\
    \  **Adaptation and Learning**\n\n    If the system needs to adapt and improve\
    \ over time based on new data, a machine learning model’s ability to learn from\
    \ data makes it suitable."
