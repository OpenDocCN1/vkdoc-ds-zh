  trans: "\n### 技术与工具\n\n在第 5 章中，我们学习了不同的机器学习算法与技术。以下是选择算法时需要考虑的一些因素。\n\n1.  **监督学习**\
    \  \n    当结果变量已知时使用。相关技术包括线性回归、逻辑回归、决策树以及支持向量机。\n\n2.  **无监督学习**  \n    当结果变量未知时应用。相关技术包括聚类（k-means、层次聚类）和关联规则。\n\
    \n3.  **强化学习**  \n    用于动态环境，模型通过动作及其结果进行学习。其应用包括自动驾驶汽车和游戏对弈。\n\n4.  **深度学习**\
    \  \n    机器学习的一个子集，专注于具有多层结构的神经网络。它特别适用于涉及图像、语音和文本处理的任务。\n\n5.  **自然语言处理**  \n\
    \    理解和生成人类语言的技术对于聊天机器人、情感分析和语言翻译等应用至关重要。\n\n#### 代码示例\n\n以下是一个无需使用机器学习的例子。\n\
    \n某公司希望为新员工分配唯一的员工 ID。这些 ID 可以是简单的递增数字，从 10001 开始。每入职一位新员工，ID 数字就增加 1。\n\n之所以无需使用机器学习，是因为分配顺序\
    \ ID 是一个简单的任务。每位新员工将获得序列中下一个可用的数字。\n\n以下是一个使用 Python 的示例。\n\n假设您已将 ID 保存在数据库或\
    \ Excel 电子表格中；您将从上一次分配的员工 ID 开始，在此示例中为 10001：\n\n```\nlast_employee_id = 10001\n\
    ```\n\n创建一个函数，根据前一个分配的 ID 来递增 ID 数字：\n\n```\ndef generate_employee_id(last_id):\n\
    \    return last_id + 1\n```\n\n使用该函数为您的新员工生成下一个员工 ID：\n\n```\nnew_hire_id = generate_employee_id(last_employee_id)\n\
    ```\n\n即使使用 Python 来实现这一点可能也是多此一举，但因为这是一本技术书籍，我决定向您展示一个代码实现！\n\n以下是一个可以使用机器学习的例子。\n\
    \n假设您经营一家葡萄酒商店，并且拥有客户信息数据集。您希望根据客户的购买行为将其分组，以便通过个性化营销策略来精准定位。我们在此示例中使用的数据有 2000\
    \ 多行。\n\n导入所需的库。\n\n```\nimport pandas as pd\nfrom sklearn.cluster import KMeans\n\
    from sklearn.preprocessing import StandardScaler\nimport matplotlib.pyplot as\
    \ plt\nimport seaborn as sns\n```\n\n加载数据集。此数据集可在 Kaggle 上找到：[`https://www.kaggle.com/datasets/imakash3011/customer-personality-analysis/data`](https://www.kaggle.com/datasets/imakash3011/customer-personality-analysis/data)\n\
    \n```\ndata = pd.read_csv(\"marketing_campaign.csv\", sep=\"\\t\")\n```\n\n该数据有\
    \ 29 列，用于描述客户信息，例如婚姻状况、收入、孩子数量、在葡萄酒上的花费等。\n\n```\ndata.columns\n```\n\n输入上述代码后，您将看到如下方括号中所示的列名列表。\n\
    \n```\nIndex(['ID', 'Year_Birth', 'Education', 'Marital_Status', 'Income', 'Kidhome',\
    \ 'Teenhome', 'Dt_Customer', 'Recency', 'MntWines', 'MntFruits', 'MntMeatProducts',\
    \ 'MntFishProducts', 'MntSweetProducts', 'MntGoldProds', 'NumDealsPurchases',\
    \ 'NumWebPurchases', 'NumCatalogPurchases', 'NumStorePurchases', 'NumWebVisitsMonth',\
    \ 'AcceptedCmp3', 'AcceptedCmp4', 'AcceptedCmp5', 'AcceptedCmp1', 'AcceptedCmp2',\
    \ 'Complain', 'Z_CostContact', 'Z_Revenue', 'Response'],\n      dtype='object')\n\
    ```\n\n在此示例中，我们将重点根据客户的收入（`Income`）和他们在过去两年内购买的葡萄酒数量（`MntWines`）进行分组。与您在现实世界中遇到的大多数数据集一样，该数据需要进行清洗。为简化此示例，我们将把\
    \ `Income` 和 `MntWines` 列中的任何空值填充为 0。\n\n```\nfeatures = data[[\"Income\",\"MntWines\"\
    ]].fillna(0)\n```\n\n正如您在图 7-2 中所看到的，一些值彼此相差很大。在这里，我们将对这些值进行转换，使其具有通用的尺度。这将使 k-means\
    \ 算法更多地关注数据的模式而非大小，尤其是考虑到这是一个基于距离的算法。\n\n```\nscaler = StandardScaler()\nscaled_features\
    \ = scaler.fit_transform(features)\n```\n\n![图 7-2](img/613832_1_En_7_Fig2_HTML.png)\n\
    \n两列中的数据示例\n\n在此示例中，我们将客户分为五个组。\n\n```\nkmeans = KMeans(n_clusters=5)\nclusters\
    \ = kmeans.fit_predict(scaled_features)\n```\n\n识别出聚类后，我们将这些值放回表格中进行进一步分析。在这里，我们将聚类的值放入一个名为\
    \ `Clusters` 的新列中。聚类的取值范围是从 0 到 4。\n\n![图 7-3](img/613832_1_En_7_Fig3_HTML.jpg)\n\
    \n在最后一列添加聚类值后的数据集示例\n\n```\ndata[\"Clusters\"] = clusters\n```\n\n现在，让我们根据聚类结果来分析数据。\n\
    \n![图 7-4](img/613832_1_En_7_Fig4_HTML.jpg)\n\n显示基于聚类的葡萄酒购买数量的条形图\n\n```\nsns.barplot(data\
    \ = data, x=\"MntWines\", hue=\"Clusters\")\n```\n\n在这里，我们可以看到聚类 1 中的人购买了最多的葡萄酒。\n\
    \n![图 7-5](img/613832_1_En_7_Fig5_HTML.jpg)\n\n显示每个聚类孩子数量的条形图\n\n```\nsns.countplot(data\
    \ = data, x=\"Kidhome\", hue=\"Clusters\")\n```\n\n进一步的分析表明，聚类 1 中的大多数人没有孩子。因此，在策划一项旨在提高您店铺葡萄酒销量的营销活动时，您可能应该避开那些鼓励顾客在孩子由保姆照看时享受一瓶葡萄酒的活动，因为这不会引起您最重要客户群体的共鸣。\n\
    \n### 机器学习模型可发挥作用的示例\n\n#### 金融：欺诈检测\n\n在金融领域，机器学习模型对于检测欺诈交易至关重要。通过分析交易模式，这些模型可以识别出表明欺诈活动的异常情况。金融机构可以利用这些洞察来预防欺诈并保护资产。\n\
    \n#### 零售：个性化推荐\n\n零售商可以利用机器学习模型向客户提供个性化推荐。通过分析购买历史、浏览行为和客户偏好，这些模型可以提升购物体验并增加销售额。\n\
    \n### 结论\n\n机器学习模型通过为复杂问题提供高级解决方案，具有变革各个行业的巨大潜力。然而，是否使用机器学习，应基于对当前问题的透彻理解、数据的可用性以及潜在的收益来决定。通过识别适合机器学习和开发的恰当场景，您可以利用其力量来推动创新、提高效率并获得竞争优势。\n"
- fmt: "# Where Machine Learning Models Live\n\nWhen creating an AI-driven product,\
    \ you need to decide where the machine learning model and information needed to\
    \ make predictions or decisions will come together and then how you will send\
    \ those outputs back to the end user. One option is to have the machine learning\
    \ model live directly on the user’s device. If you do this, you will need to think\
    \ about how to keep the model updated for all users. Another option is to have\
    \ the model work in the cloud. In this case, you will need to figure out how to\
    \ send the necessary data from the user’s device to the cloud quickly and in an\
    \ inexpensive manner that works smoothly.\n\nThis chapter explains some things\
    \ to keep in mind when deciding where a machine learning model should live. It\
    \ discusses important factors and why they matter for different types of AI-driven\
    \ products.\n\n## Introduction to Where Machine Learning Models Live\n\nMachine\
    \ learning has significantly transformed various industries by providing AI-driven\
    \ products to complex challenges. However, the effectiveness of these solutions\
    \ is heavily influenced by the specific environment where the machine learning\
    \ models are deployed and executed. To ensure optimal performance, scalability,\
    \ and reliability, it is essential to comprehend the various environments that\
    \ can host these models. This chapter explores the different types of environments,\
    \ including cloud services, on-premise options, and hybrid systems, each providing\
    \ unique advantages and considerations for deploying machine learning models within\
    \ them.\n\n## Key Considerations to Think About When Deciding Where Your Machine\
    \ Learning Models Should Live\n\nThe environment where a machine learning model\
    \ is deployed can significantly impact its performance and usability. When figuring\
    \ out where to put machine learning models in an AI-driven product, here are some\
    \ important points to keep in mind:\n\n* **Timely Updates**\n\n  How long will\
    \ it take to update the machine learning model?\n  * Machine learning models need\
    \ to be updated regularly to ensure users benefit from the latest improvements.\
    \ When these updates can be implemented directly on the device users are interacting\
    \ with, they can experience the benefits much more quickly. However, if the model\
    \ is hosted remotely and updates require Internet access, the process may be slower,\
    \ potentially leading to significant issues if the delays result in costly errors.\n\
    \  \n    For example, if you launch a product that gains popularity, it’s essential\
    \ to capture user feedback and interaction data to refine your model. In such\
    \ cases, being able to rapidly update the model for all users is crucial to maintaining\
    \ momentum and delivering a high-quality experience. This is especially true in\
    \ fast-changing scenarios, such as combating cybersecurity threats, where delays\
    \ in updates could render the model ineffective.\n  \n    Conversely, in situations\
    \ where the problem is evolving more slowly, such as when constructing a new building,\
    \ delays in updates may not be as critical. A GPS can still function adequately\
    \ during the construction period without immediate updates.\n  \n    The urgency\
    \ of updates becomes apparent when a lack of timely changes can lead to costly\
    \ mistakes. If you find yourself receiving frequent customer complaints but are\
    \ unable to address them promptly due to slow model updates, this could damage\
    \ your reputation and financial standing and even cause significant stress.\n\
    \  \n  **Strategies for Updating Models**\n  \n  Below are a few different strategies\
    \ to help ensure timely updates:\n  \n  * **Continuous Integration/Continuous\
    \ Deployment (CI/CD) Pipelines**\n  \n    This approach allows developers to automatically\
    \ test, build, and deploy model updates to production environments. CI/CD pipelines\
    \ ensure rapid updates and minimize errors by automating much of the update process.\n\
    \  \n  * **Over-the-Air (OTA) Updates for Edge Devices**\n  \n    For models running\
    \ on edge devices, OTA updates allow changes to be pushed directly to the device\
    \ with minimal user intervention. This method ensures that even devices typically\
    \ running offline can stay up to date when they periodically connect to the Internet,\
    \ minimizing security risks and improving functionality without much delays.\n\
    \  \n  * **Cloud-Based Training**\n  \n    In cloud environments, models can be\
    \ retrained and redeployed quickly as new data becomes available. Cloud platforms\
    \ offer scalability, allowing updates to be applied simultaneously across multiple\
    \ locations or users.\n\n* **Latency**\n\n  The physical proximity of the deployment\
    \ environment to the end user can affect the response time of the model. This\
    \ can affect how quickly the model will generate a response when it is needed.\n\
    \  * Your AI-driven product must gather the required data, perform preprocessing,\
    \ and extract the necessary features to serve as input for your machine learning\
    \ model. After the model generates a response, you may need to apply postprocessing\
    \ before delivering the final output to the end user. Each of these steps can\
    \ take time.\n  \n    If all processing happens on the same device, the delay\
    \ is minimal. However, the process can take longer if the machine learning model\
    \ is hosted elsewhere, such as in the cloud. This latency can be particularly\
    \ problematic in situations where the correct response needs to be generated rapidly,\
    \ such as during an emergency. For example, consider an autonomous helicopter\
    \ that suddenly encounters an obstacle. If there’s a delay in processing, the\
    \ helicopter may not be able to avoid the obstacle in time, leading to potentially\
    \ dangerous consequences.\n\n* **Cost**\n\n  The cost of deploying and maintaining\
    \ machine learning models varies with the chosen environment. Running an AI-driven\
    \ product requires utilizing resources, which all cost money. Here are some key\
    \ points to consider:\n  * **Cost of Distributing the Machine Learning Model**\n\
    \    * Distributing machine learning models involves sending updates to users,\
    \ which costs money for both you and your customer. The cost depends on how many\
    \ customers need the update, the size of the update, and how often updates are\
    \ sent.\n    * For users with Wi-Fi, this might not be a big deal. However, for\
    \ those using mobile devices or who have limited data, the cost of downloading\
    \ updates can be significant.\n  \n  * **Cost of Executing Machine Learning Models**\n\
    \    * Running the machine learning model has costs, especially if it needs to\
    \ send and receive data from the cloud. The size and frequency of these data exchanges\
    \ can add up.\n    * Machine learning models on an end user’s device use their\
    \ resources, such as the CPU, RAM, and GPUs. While this can save you money as\
    \ the product developer, some machine learning tasks can be too demanding for\
    \ smaller devices, such as mobile phones. In these cases, having the model on\
    \ the cloud might be more efficient.\n\n* **Offline Mode**\n\n  What happens if\
    \ the end user is not connected to the Internet? You should also consider if the\
    \ model should work even if there is no Internet connection.\n  \n  Sometimes\
    \ it’s okay if the model doesn’t work offline. However, in some cases, like life-saving\
    \ equipment, it is crucial the product works without an Internet connection. Some\
    \ portion of the machine learning capabilities should live on the end user’s device.\
    \ It can be the full version or a back-up version to keep the product working\
    \ until the Internet connection is back on.\n\n* **Scalability**\n\n  Cloud environments\
    \ often offer scalable resources that can be adjusted based on demand, while on-premise\
    \ solutions might require more upfront investment and maintenance.\n\n* **Security**\n\
    \n  Different environments provide varying levels of security. For instance, sensitive\
    \ data might be better protected in a private on-premise setup compared to a public\
    \ cloud.\n\n## Deciding Where the Machine Learning Should Live"
  raw: "# 8. Where Machine Learning Models Live\n\nWhen creating an AI-driven product,\
    \ you need to decide where the machine learning model and information needed to\
    \ make predictions or decisions will come together and then how you will send\
    \ those outputs back to the end user. One option is to have the machine learning\
    \ model live directly on the user’s device. If you do this, you will need to think\
    \ about how to keep the model updated for all users. Another option is to have\
    \ the model work in the cloud. In this case, you will need to figure out how to\
    \ send the necessary data from the user’s device to the cloud quickly and in an\
    \ inexpensive manner that works smoothly.\n\nThis chapter explains some things\
    \ to keep in mind when deciding where a machine learning model should live. It\
    \ discusses important factors and why they matter for different types of AI-driven\
    \ products.\n\n## Introduction to Where Machine Learning Models Live\n\nMachine\
    \ learning has significantly transformed various industries by providing AI-driven\
    \ products to complex challenges. However, the effectiveness of these solutions\
    \ is heavily influenced by the specific environment where the machine learning\
    \ models are deployed and executed. To ensure optimal performance, scalability,\
    \ and reliability, it is essential to comprehend the various environments that\
    \ can host these models. This chapter explores the different types of environments,\
    \ including cloud services, on-premise options, and hybrid systems, each providing\
    \ unique advantages and considerations for deploying machine learning models within\
    \ them.\n\n## Key Considerations to Think About When Deciding Where Your Machine\
    \ Learning Models Should Live\n\nThe environment where a machine learning model\
    \ is deployed can significantly impact its performance and usability. When figuring\
    \ out where to put machine learning models in an AI-driven product, here are some\
    \ important points to keep in mind:\n\n*   Timely Updates\n\n    How long will\
    \ it take to update the machine learning model?\n    *   Machine learning models\
    \ need to be updated regularly to ensure users benefit from the latest improvements.\
    \ When these updates can be implemented directly on the device users are interacting\
    \ with, they can experience the benefits much more quickly. However, if the model\
    \ is hosted remotely and updates require Internet access, the process may be slower,\
    \ potentially leading to significant issues if the delays result in costly errors.\n\
    \n        For example, if you launch a product that gains popularity, it’s essential\
    \ to capture user feedback and interaction data to refine your model. In such\
    \ cases, being able to rapidly update the model for all users is crucial to maintaining\
    \ momentum and delivering a high-quality experience. This is especially true in\
    \ fast-changing scenarios, such as combating cybersecurity threats, where delays\
    \ in updates could render the model ineffective.\n\n        Conversely, in situations\
    \ where the problem is evolving more slowly, such as when constructing a new building,\
    \ delays in updates may not be as critical. A GPS can still function adequately\
    \ during the construction period without immediate updates.\n\n        The urgency\
    \ of updates becomes apparent when a lack of timely changes can lead to costly\
    \ mistakes. If you find yourself receiving frequent customer complaints but are\
    \ unable to address them promptly due to slow model updates, this could damage\
    \ your reputation and financial standing and even cause significant stress.\n\n\
    \        Strategies for Updating Models\n\n        Below are a few different strategies\
    \ to help ensure timely updates:\n\n    *   Continuous Integration/Continuous\
    \ Deployment (CI/CD) Pipelines\n\n        This approach allows developers to automatically\
    \ test, build, and deploy model updates to production environments. CI/CD pipelines\
    \ ensure rapid updates and minimize errors by automating much of the update process.\n\
    \n    *   Over-the-Air (OTA) Updates for Edge Devices\n\n        For models running\
    \ on edge devices, OTA updates allow changes to be pushed directly to the device\
    \ with minimal user intervention. This method ensures that even devices typically\
    \ running offline can stay up to date when they periodically connect to the Internet,\
    \ minimizing security risks and improving functionality without much delays.\n\
    \n    *   Cloud-Based Training\n\n        In cloud environments, models can be\
    \ retrained and redeployed quickly as new data becomes available. Cloud platforms\
    \ offer scalability, allowing updates to be applied simultaneously across multiple\
    \ locations or users.\n\n*   Latency\n\n    The physical proximity of the deployment\
    \ environment to the end user can affect the response time of the model. This\
    \ can affect how quickly the model will generate a response when it is needed.\n\
    \    *   Your AI-driven product must gather the required data, perform preprocessing,\
    \ and extract the necessary features to serve as input for your machine learning\
    \ model. After the model generates a response, you may need to apply postprocessing\
    \ before delivering the final output to the end user. Each of these steps can\
    \ take time.\n\n        If all processing happens on the same device, the delay\
    \ is minimal. However, the process can take longer if the machine learning model\
    \ is hosted elsewhere, such as in the cloud. This latency can be particularly\
    \ problematic in situations where the correct response needs to be generated rapidly,\
    \ such as during an emergency. For example, consider an autonomous helicopter\
    \ that suddenly encounters an obstacle. If there’s a delay in processing, the\
    \ helicopter may not be able to avoid the obstacle in time, leading to potentially\
    \ dangerous consequences.\n\n*   Cost\n\n    The cost of deploying and maintaining\
    \ machine learning models varies with the chosen environment. Running an AI-driven\
    \ product requires utilizing resources, which all cost money. Here are some key\
    \ points to consider:\n    *   Cost of Distributing the Machine Learning Model\n\
    \        *   Distributing machine learning models involves sending updates to\
    \ users, which costs money for both you and your customer. The cost depends on\
    \ how many customers need the update, the size of the update, and how often updates\
    \ are sent.\n\n        *   For users with Wi-Fi, this might not be a big deal.\
    \ However, for those using mobile devices or who have limited data, the cost of\
    \ downloading updates can be significant.\n\n    *   Cost of Executing Machine\
    \ Learning Models\n        *   Running the machine learning model has costs, especially\
    \ if it needs to send and receive data from the cloud. The size and frequency\
    \ of these data exchanges can add up.\n\n        *   Machine learning models on\
    \ an end user’s device use their resources, such as the CPU, RAM, and GPUs. While\
    \ this can save you money as the product developer, some machine learning tasks\
    \ can be too demanding for smaller devices, such as mobile phones. In these cases,\
    \ having the model on the cloud might be more efficient.\n\n*   Offline Mode\n\
    \n    What happens if the end user is not connected to the Internet? You should\
    \ also consider if the model should work even if there is no Internet connection.\n\
    \n    Sometimes it’s okay if the model doesn’t work offline. However, in some\
    \ cases, like life-saving equipment, it is crucial the product works without an\
    \ Internet connection. Some portion of the machine learning capabilities should\
    \ live on the end user’s device. It can be the full version or a back-up version\
    \ to keep the product working until the Internet connection is back on.\n\n* \
    \  Scalability\n\n    Cloud environments often offer scalable resources that can\
    \ be adjusted based on demand, while on-premise solutions might require more upfront\
    \ investment and maintenance.\n\n*   Security\n\n    Different environments provide\
    \ varying levels of security. For instance, sensitive data might be better protected\
    \ in a private on-premise setup compared to a public cloud.\n\n## Deciding Where\
    \ the Machine Learning Should Live"
  trans: "\n# 机器学习模型的部署位置\n\n打造一款 AI 驱动产品时，你需要决定在何处整合机器学习模型及做出预测或决策所需的信息，以及如何将这些输出结果发送给最终用户。一种选择是将机器学习模型直接部署在用户设备上。如果这样做，你需要考虑如何为所有用户保持模型更新。另一种选择是让模型在云端运行。这种情况下，你需要找出如何快速、经济且流畅地将必要数据从用户设备发送到云端的方法。\n\
    \n本章将解释在决定机器学习模型部署位置时需要注意的一些事项，并探讨其关键因素以及这些因素对不同类型 AI 驱动产品的重要性。\n\n## 机器学习模型部署位置简介\n\
    \n机器学习通过为复杂挑战提供 AI 驱动的解决方案，极大地改变了各行各业。然而，这些解决方案的有效性在很大程度上受到部署和执行机器学习模型的具体环境的影响。为了确保最佳性能、可扩展性和可靠性，理解能够托管这些模型的各种环境至关重要。本章将探讨不同类型的环境，包括云服务、本地部署选项和混合系统，每种环境在部署机器学习模型时都具有独特的优势和考量。\n\
    \n## 决定机器学习模型部署位置时需考虑的关键因素\n\n机器学习模型部署的环境会显著影响其性能和可用性。在确定 AI 驱动产品中机器学习模型的放置位置时，需要牢记以下几点：\n\
    \n*   **及时更新**\n\n    更新机器学习模型需要多长时间？\n    *   机器学习模型需要定期更新，以确保用户受益于最新的改进。当这些更新可直接在用户交互的设备上实施时，他们能更快地体验到好处。然而，如果模型托管在远程且更新需要互联网访问，这个过程可能会更慢，如果延迟导致代价高昂的错误，则可能引发重大问题。\n\
    \n        例如，如果你发布了一款广受欢迎的产品，收集用户反馈和交互数据来优化模型至关重要。在这种情况下，能够为所有用户快速更新模型对于保持发展势头和提供高质量体验至关重要。这在快速变化的场景中尤其如此，例如应对网络安全威胁，更新延迟可能导致模型失效。\n\
    \n        相反，在问题演变较慢的情况下，例如建造新建筑时，更新的延迟可能不那么关键。在施工期间，没有即时更新的 GPS 仍能正常工作。\n\n \
    \       当缺乏及时的更新可能导致代价高昂的错误时，更新的紧迫性就显现出来了。如果你发现频繁收到客户投诉，却因模型更新缓慢而无法及时处理，这可能会损害你的声誉和财务状况，甚至造成巨大压力。\n\
    \n    **模型更新的策略**\n\n    以下是一些有助于确保及时更新的不同策略：\n\n    *   **持续集成/持续部署（CI/CD）管道**\n\
    \n        这种方法允许开发人员自动测试、构建模型更新并将其部署到生产环境中。CI/CD 管道通过自动化大部分更新过程来确保快速更新并最大限度地减少错误。\n\
    \n    *   **边缘设备的空中（OTA）更新**\n\n        对于在边缘设备上运行的模型，OTA 更新允许在用户几乎不干预的情况下直接将更改推送到设备。这种方法确保了即使通常离线运行的设备，在定期连接到互联网时也能保持最新状态，最大限度地降低安全风险并在不大幅延迟的情况下改进功能。\n\
    \n    *   **基于云的训练**\n\n        在云环境中，随着新数据的出现，模型可以快速重新训练和重新部署。云平台提供可扩展性，允许同时跨多个地点或用户应用更新。\n\
    \n*   **延迟**\n\n    部署环境与最终用户的物理距离会影响模型的响应时间。这会影响模型在需要时生成响应的速度。\n    *   你的 AI\
    \ 驱动产品必须收集所需数据，执行预处理，并提取必要的特征作为机器学习模型的输入。模型生成响应后，你可能需要应用后处理，然后再将最终输出交付给最终用户。这些步骤中的每一步都可能耗费时间。\n\
    \n        如果所有处理都在同一设备上完成，则延迟最小。但是，如果机器学习模型托管在其他地方（例如云端），这个过程可能需要更长时间。在需要快速生成正确响应的情况下（例如在紧急情况下），这种延迟尤其成问题。例如，考虑一架自动驾驶直升机突然遇到障碍物。如果处理出现延迟，直升机可能无法及时避开障碍物，从而导致潜在危险后果。\n\
    \n*   **成本**\n\n    部署和维护机器学习模型的成本因所选环境而异。运行 AI 驱动产品需要利用资源，这都需要花钱。以下是需要考虑的一些关键点：\n\
    \    *   **分发机器学习模型的成本**\n        *   分发机器学习模型涉及向用户发送更新，这对你和你的客户来说都需要花钱。成本取决于需要更新的客户数量、更新的大小以及发送更新的频率。\n\
    \        *   对于使用 Wi-Fi 的用户来说，这可能不是什么大问题。然而，对于那些使用移动设备或数据流量有限的用户来说，下载更新的成本可能相当高。\n\
    \n    *   **执行机器学习模型的成本**\n        *   运行机器学习模型会产生成本，尤其是在需要从云端发送和接收数据的情况下。这些数据交换的大小和频率会累积起来。\n\
    \        *   最终用户设备上的机器学习模型会使用其资源，例如 CPU、RAM 和 GPU。虽然这可以为你（产品开发者）节省成本，但某些机器学习任务对于较小的设备（如手机）来说可能要求过高。在这种情况下，将模型放在云端可能更有效率。\n\
    \n*   **离线模式**\n\n    如果最终用户没有连接到互联网会发生什么？你还应该考虑模型是否应该在无互联网连接的情况下也能工作。\n\n   \
    \ 有时模型离线无法工作也是可以接受的。然而，在某些情况下，例如救生设备，产品在没有互联网连接的情况下工作至关重要。机器学习能力的部分功能应存在于最终用户的设备上。可以是完整版本，也可以是备用版本，以便在互联网连接恢复之前保持产品运行。\n\
    \n*   **可扩展性**\n\n    云环境通常提供可根据需求调整的可扩展资源，而本地部署解决方案可能需要更多的前期投资和维护。\n\n*   **安全性**\n\
    \n    不同的环境提供不同级别的安全性。例如，与公共云相比，敏感数据在私有的本地设置中可能得到更好的保护。\n\n## 决定机器学习模型的部署位置\n"
- fmt: '# Built-In Machine Learning Model


    You can include a machine learning model directly in your product without any
    extra setup. You can collect training data, create the model, add it to your software,
    and then release it.


    ## Advantages


    - It can be cheaper and simpler to set up.

    - It can be good enough for many problems that do not change a lot and are not
    very complex.

    - It can be updated through traditional software updating methods.

    - You could get feedback through reviews and other methods.


    ## Disadvantage


    - Updating the model is more challenging.


    # Cloud-Based Machine Learning Model


    Cloud-based machine learning means the model runs in the cloud, not on the user''s
    device. When a user needs something, the application sends the information to
    the cloud, which processes it and returns the results.


    ## Advantages


    - The model can be updated easily and quickly.

    - It is easier to track and log data.


    ## Disadvantage


    - As more people use it, the cloud will need to handle many requests quickly.
    If many people are using it at the same time, the system has to be powerful enough
    to keep up.


    # Stored Machine Learning Results


    Stored machine learning results involve figuring things out ahead of time and
    saving those results for later.


    **Example:** Imagine a book recommendations service that figures out which books
    in a finite list or slow-updating list are best for different genres and readers.
    It does this detailed analysis and stores the results. When a new reader looks
    for book suggestions, the application quickly uses the stored recommendations
    without having to redo all the analysis.


    ## Advantages


    - It can run complex models that would be too slow if done in real time.

    - It can quickly provide results since they are already prepared and stored.


    ## Disadvantages


    - It works best if the results can be looked up based on clear information, like
    specific location or product.

    - It is not effective if the correct answer can change quickly.


    # Mixing Different Approaches


    Sometimes, combining different methods to get the best results is helpful. Here
    are some examples:


    - One machine learning model can be used to do a deep analysis on a specific task,
    while another model on the device can handle other things.

    - An application can use a machine learning model on the device most of the time
    but double-check with a more powerful model in the cloud when making very important
    decisions.


    Combining methods can help balance out their individual weaknesses. However, it
    can also make the application more complicated. If there is a mistake, it can
    be tricky to know which part caused it. It could be the model on the device, the
    model in the cloud, or a combination of things.


    # Tools and Techniques


    ## Cloud Services


    Cloud platforms like Amazon Web Services (`AWS`), Google Cloud Platform (`GCP`),
    and Microsoft Azure provide robust environments for deploying machine learning
    models. These platforms offer various services, such as:


    - **Managed Machine Learning Services:** `AWS SageMaker`, `AWS Bedrock`, `Google
    AI Platform`, and `Azure Machine Learning` provide end-to-end solutions for building,
    training, and deploying models.

    - **Serverless Computing:** `AWS Lambda` and `Azure Functions` allow for running
    code in response to events without managing servers.

    - **Containerization:** Tools like `Docker` and `Kubernetes` enable scalable and
    flexible deployment of machine learning models in containerized environments.


    ## On-Premise Options


    For organizations with specific requirements, on-premise deployment offers control
    over the hardware and software environment. Key tools and techniques include:


    - **Virtual Machines:** Creating isolated environments using `VMware`, for example.

    - **Dedicated Hardware:** Using specialized hardware.

    - **Custom Infrastructure:** Building and maintaining a tailored infrastructure
    to meet specific performance and security needs.


    ## Edge Devices


    Deploying machine learning models on edge devices like smartphones and IoT devices
    can minimize latency and reduce data transfer costs. Techniques for edge deployment
    include:


    - **Model Compression:** Techniques like quantization and pruning to reduce the
    model size and computation requirements.

    - **Frameworks for Edge Deployment:** `TensorFlow Lite` and `PyTorch Mobile` are
    designed for running models.


    ## Hybrid Systems


    Combining different environments to leverage the strengths of each can be a strategic
    approach. For example, initial model training could occur in the cloud, while
    inference might take place on edge devices. Key considerations for hybrid systems
    include:


    - **Data Synchronization:** Ensuring that data is consistent across environments.

    - **Network Architecture:** Designing robust and secure communication channels
    between different deployment environments.


    # Examples of Machine Learning Deployment Strategies for Industry Needs


    ## Retail: Cloud-Based Recommendation Systems


    Retailers can leverage cloud services to deploy recommendation systems that analyze
    customer data and provide personalized shopping experiences.


    **Updates and Monitoring:** In a cloud-based system, models can be continuously
    retrained and redeployed without impacting the customer experience. Cloud environments
    also allow retailers to monitor how well the recommendations system performs across
    regions, adjusting models as needed for varying preferences or market conditions.


    **Effectiveness:** Cloud deployment enables scalability, allowing the system to
    handle large customer bases and real-time data analysis. However, latency can
    impact effectiveness during peak shopping periods if the cloud infrastructure
    isn''t optimized to handle surges.


    ## Healthcare: Edge AI for Real-Time Diagnostics


    In the healthcare sector, deploying machine learning models on edge devices such
    as portable diagnostic equipment can provide real-time analysis and reduce the
    need for Internet connectivity. For instance, a company developing a portable
    ultrasound device with embedded AI capabilities to assist in diagnosing conditions
    on the spot.


    ## Manufacturing: Hybrid Systems for Predictive Maintenance


    Manufacturers can use hybrid systems where data from sensors on equipment is processed
    locally to detect anomalies in real time, while more extensive analysis and model
    retraining can occur in the cloud. This approach would balance the need for low-latency
    monitoring with the computational power of cloud resources.


    **Updates and Monitoring:** On-site models can be updated through `OTA`, while
    the cloud component ensures the models are retrained with the latest data from
    all the equipment. Monitoring these systems involves tracking both the performance
    of the local anomaly detection models and the more complex cloud models used for
    deeper analysis.


    **Effectiveness:** A hybrid approach balances the need for low-latency anomaly
    detection with the computational power of cloud resources. The local model ensures
    real-time monitoring, while cloud-based retraining keeps the overall system adaptive
    to changing conditions. However, balancing synchronization between edge and cloud
    systems is crucial to ensure smooth operations without data bottlenecks.


    # Conclusion


    The deployment environment for machine learning models is a critical factor influencing
    their effectiveness, performance, and cost-efficiency. Understanding the strengths
    and limitations of various environments — cloud, on-premise, and hybrid systems
    — allows organizations to make informed decisions tailored to their specific needs.
    By leveraging appropriate tools and techniques, businesses can optimize the deployment
    of their machine learning models to achieve the best possible outcomes.


