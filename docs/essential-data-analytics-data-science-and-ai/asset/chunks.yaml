  trans: "\n# 对手与滥用行为简介\n\n机器学习中的对手是指有意操纵或利用机器学习模型以实现恶意目标的实体，可以是个人、团体或组织。这些对手试图通过扰乱或欺骗模型来获取个人、财务或战略利益。例如，对手可以通过略微修改钓鱼邮件来操控电子邮件垃圾邮件过滤器，使其无法被检测到，从而绕过安全系统。\n\
    \n滥用行为涵盖对手破坏、欺骗或操控系统的各种活动。滥用也指对机器学习系统的各类攻击或不道德用途，导致意外后果。例如，对手可能通过使用机器人人为地提升某些内容，欺骗推荐系统优先推送不相关或有害的材料。\n\
    \n## 对手的类型\n\n*   **数据投毒攻击：** 有意将误导性或错误数据放入训练数据集中，导致模型学习到错误的模式。这种攻击发生在训练阶段。可以通过以下几种方式进行：\n\
    \    *   删除部分数据\n    *   将现有数据修改为错误答案\n    *   添加虚假数据\n\n    示例：攻击者可能通过注入虚假图像来更改面部识别系统的训练数据，导致模型认错人员。\n\
    \n*   **规避攻击：** 修改输入数据以逃避模型检测。这发生在测试/生产阶段，通过对数据进行微小改动来实现。图 10-1 至 10-4 展示了许多此类示例。\n\
    \n    示例：攻击者可以略微修改停车标志的图像，如图 10-3 和 10-4 所示，使自动驾驶汽车的识别系统无法正确识别，从而造成严重的安全风险。\n\n\
    *   **模型逆向攻击：** 利用模型输出重建用于训练它的数据。\n\n    示例：一个基于敏感健康数据训练的模型可能会被对手利用，从模型的预测中逆向还原出个人医疗信息，从而侵犯患者隐私。\n\
    \n这些攻击背后的动机多种多样。从获取经济利益到造成伤害，不一而足。对手可能是寻求利用漏洞的恶意行为者，例如心怀不满的前任，也可能是旨在破坏竞争对手系统的竞争者。\n\
    \n## 理解机器学习中的对手与滥用行为的重要性\n\n### 对安全与隐私的影响\n\n一些机器学习模型处理敏感数据，使其成为对手的主要目标。了解滥用行为的可能性对于保护用户隐私和维护数据完整性至关重要。为了减轻这些风险，可以实施多种防护措施：\n\
    \n*   **加密：** 加密有助于保护静态和传输中的数据。数据在用于训练之前可以进行加密，确保即使数据被未经授权的人员截获或访问，也仍然不可读。例如，金融机构可以在将交易数据输入机器学习模型之前对其进行加密，以防止对敏感信息的未授权访问。\n\
    \n*   **访问控制：** 实施严格的访问控制确保只有授权人员才能访问敏感数据和机器学习模型。基于角色的访问控制可以限制谁能够查看、修改或用敏感信息训练模型。例如，医疗机构可以强制执行访问控制，使得只有获批的医务人员才能访问用于预测健康模型的患者记录。\n\
    \n*   **匿名化技术：** 匿名化是指在数据集用于机器学习模型之前，从中移除或掩盖个人身份信息（PII）。数据脱敏、差分隐私和 k-匿名性等技术可以通过使其难以追溯到个人来帮助保护用户隐私。例如，通过移除或掩盖患者标识符来匿名化健康记录，使研究人员能够在不泄露隐私的情况下将数据用于分析。\n\
    \n### 经济与运营影响\n\n利用机器学习系统的漏洞可能导致巨大的经济损失和运营中断。例如，对金融模型的对抗性攻击可能导致错误的预测，从而产生重大的经济后果。\n\
    \n### 对机器学习系统的信任\n\n维护对机器学习系统的信任对于其广泛采用至关重要。应对对手和滥用行为是确保这些系统可靠和安全的关键。\n\n## 对抗性攻击可能的使用方式\n\
    \n### 自动驾驶车辆中的数据投毒\n\n自动驾驶车辆严重依赖机器学习模型进行导航。数据投毒可能涉及操纵传感器数据以导致错误的决策。\n\n### 医疗领域的模型逆向攻击\n\
    \n医疗领域的机器学习模型可能成为模型逆向攻击的目标，以提取敏感的患者信息。\n\n### 使用对抗性图像的规避攻击\n\n让我们看一些实际例子。对抗性图像是专门设计用来欺骗神经网络，使其对其所看到的内容做出错误判断的图像。\n\
    \n卷积神经网络和视觉变换器通常用于识别图像中的物体。作为人类，我们通过观察抽象特征来识别物体。例如，对于熊猫，我们可能会寻找黑眼圈和皮毛等特征。机器学习模型以不同的方式识别这些物体，这使得它们容易受到对抗性图像的影响。以下是这些类型图像的多个示例。\n\
    \n![](img/613832_1_En_10_Fig4_HTML.jpg)\n\n图 10-4\n\n在此示例中，微小的变化导致机器学习模型将停车标志分类为\
    \ 45 英里/小时的限速标志，并将右转标志分类为停车标志\n\n![](img/613832_1_En_10_Fig3_HTML.jpg)\n\n图 10-3\n\
    \n在此示例中，带有迷彩效果的艺术贴纸和涂鸦导致机器学习模型将停车标志分类为 45 英里/小时的限速标志，并将让行标志分类为错误类型\n\n![](img/613832_1_En_10_Fig2_HTML.jpg)\n\
    \n图 10-2\n\n左侧的图像是一只猫，但已被修改得带有一些方块感。这导致用于识别该图像的模型将其判断为电脑。右侧的图像显然是一根香蕉，但该图像已被修改，在其左侧添加了一个物体，这导致模型将该图像识别为一个烤面包机\n\
    \n![](img/613832_1_En_10_Fig1_HTML.jpg)\n\n图 10-1\n\n一个对抗性输入欺骗人工智能将熊猫误认为长臂猿的示例。该图像通过添加噪声被略微改变\n"
- fmt: '## Mitigating Risk


    Using a machine learning model to find abusive activity could be seen as a good
    idea. However, it may be cheaper and faster for an attacker to change their approach
    to harm a machine learning model than for you to update your training dataset
    and model to fight against this new attack.


    Here is a list of recommendations and precautions to mitigate the risk associated
    with and promote the responsible development and use of machine learning models.


    - **Training and Testing**: Integrate strong adversarial training techniques during
    the model development phase. This process involves exposing the model to various
    adversarial examples within the training dataset to strengthen its defenses against
    evasion attacks. Rigorous testing should also be used to assess the model’s robustness
    before deployment. This can ensure the model can effectively withstand those potential
    attacks. Red team testing, which will be mentioned in the “Ethical Considerations”
    section, is an interactive way of testing machine learning models to simulate
    the tactics an attacker would use to expose vulnerabilities like leaking sensitive
    data. The goal of this is to enhance the model’s robustness.


    - **Data Sanitization and Validation**: During the training phase, it is crucial
    to sanitize and validate the data to reduce the risks of poisoning attacks. This
    includes implementing rigorous data validation rules and mechanisms to detect
    and eliminate inappropriate data. Regular audits of training datasets can help
    identify and remove any compromised data that could undermine the model’s integrity.


    - **Adaptive Security Measures**: Employ adaptive security measures that continuously
    monitor and analyze model behavior during model deployment to detect unusual activities
    indicative of adversarial attacks. Use anomaly detection algorithms and intrusion
    detection systems to identify and respond to threats in real time.


    - **Collaboration and Information Sharing**: Educate people within your organization
    about the risks associated with artificial intelligence and the various types
    of adversarial attacks. Emphasize the importance of cybersecurity awareness by
    encouraging proactive measures, regular software updates, security patches, and
    adherence to best practices in AI development and deployment.


    - **Education and Awareness**: Encourage collaboration and information sharing
    within the AI community to spread knowledge about emerging adversarial threats
    and effective countermeasures.


    ## Ethical Considerations


    Establishing ethical guidelines for adversarial research and promoting responsible
    disclosure practices is crucial.


    As stated by the White House, on October 20, 2023, President Biden issued an executive
    order to manage the risk of AI. In this order, AI systems with significant implications
    on national and economic security or public health and safety must undergo stringent
    safety testing and government supervision. With this executive order, the President
    directs the most sweeping actions ever to protect Americans from the potential
    risks of AI systems. Here are a few actions:


    - **Developers of the most powerful AI systems are required to share their safety
    test results and other critical information with the US government.**


    In accordance with the Defense Production Act, the Order will require the companies
    developing any foundation model that poses serious risks to national security,
    national economic security, or national public health and safety to notify the
    federal government when training the model and to share the results of all red-team
    safety tests. These measures will ensure AI systems are safe, secure, and trustworthy
    before companies make them public.


    - **Develop standards, tools, and tests to help ensure that AI systems are safe,
    secure, and trustworthy.**


    The National Institute of Standards and Technology will set rigorous standards
    for extensive red-team testing to ensure safety before public release. The Department
    of Homeland Security will apply those standards to critical infrastructure sectors
    and establish the AI Safety and Security Board. The Departments of Energy and
    Homeland Security will also address AI systems’ threat to critical infrastructure,
    as well as chemical, biological, radiological, nuclear, and cybersecurity risks.
    Together, these are the most significant actions ever taken by any government
    to advance the field of AI safety.


    - **Protect against the risks of using AI to engineer dangerous biological materials.**


    Develop strong standards for biological synthesis screening. Agencies that fund
    life science projects will establish these standards as a condition of federal
    funding. This creates powerful incentives to ensure appropriate screening and
    manage risks potentially made worse by AI.


    - **Protect Americans from AI-enabled fraud and deception by establishing standards
    and best practices for detecting AI-generated content and authenticating official
    content.**


    The Department of Commerce will develop guidance for content authentication and
    watermarking to clearly label AI-generated content. Federal agencies will use
    these tools to make it easier for Americans to know that the communications they
    receive from the government are authentic – and set an example for the private
    sector and governments around the world.


    - **Establish an advanced cybersecurity program to develop AI tools to find and
    fix vulnerabilities in critical software.**


    This builds on the Biden-Harris Administration’s ongoing AI Cyber Challenge. Together,
    these efforts will harness AI’s potentially game-changing cyber capabilities to
    make software and networks more secure.


    - **Order the development of a National Security Memorandum that directs further
    actions on AI and security.**


    This is to be developed by the National Security Council and White House Chief
    of Staff. This document will ensure that the US military and intelligence community
    use AI safely, ethically, and effectively in their missions. It will direct actions
    to counter adversaries’ military use of AI.


    To better protect Americans’ privacy, including the risks posed by AI, the President
    calls on Congress to pass bipartisan data privacy legislation to protect all Americans,
    especially kids. Below are a few of the actions directed:


    - **Protect Americans’ privacy by prioritizing federal support for accelerating
    the development and use of privacy-preserving techniques.**'
  raw: '## Mitigating Risk


    Using a machine learning model to find abusive activity could be seen as a good
    idea. However, it may be cheaper and faster for an attacker to change their approach
    to harm a machine learning model than for you to update your training dataset
    and model to fight against this new attack.


    Here is a list of recommendations and precautions to mitigate the risk associated
    with and promote the responsible development and use of machine learning models.


    *   Training and Testing: Integrate strong adversarial training techniques during
    the model development phase. This process involves exposing the model to various
    adversarial examples within the training dataset to strengthen its defenses against
    evasion attacks. Rigorous testing should also be used to assess the model’s robustness
    before deployment. This can ensure the model can effectively withstand those potential
    attacks. Red team testing, which will be mentioned in the “Ethical Considerations”
    section, is an interactive way of testing machine learning models to simulate
    the tactics an attacker would use to expose vulnerabilities like leaking sensitive
    data. The goal of this is to enhance the model’s robustness.


    *   Data Sanitization and Validation: During the training phase, it is crucial
    to sanitize and validate the data to reduce the risks of poisoning attacks. This
    includes implementing rigorous data validation rules and mechanisms to detect
    and eliminate inappropriate data. Regular audits of training datasets can help
    identify and remove any compromised data that could undermine the model’s integrity.


    *   Adaptive Security Measures: Employ adaptive security measures that continuously
    monitor and analyze model behavior during model deployment to detect unusual activities
    indicative of adversarial attacks. Use anomaly detection algorithms and intrusion
    detection systems to identify and respond to threats in real time.


    *   Collaboration and Information Sharing: Educate people within your organization
    about the risks associated with artificial intelligence and the various types
    of adversarial attacks. Emphasize the importance of cybersecurity awareness by
    encouraging proactive measures, regular software updates, security patches, and
    adherence to best practices in AI development and deployment.


    *   Education and Awareness: Encourage collaboration and information sharing within
