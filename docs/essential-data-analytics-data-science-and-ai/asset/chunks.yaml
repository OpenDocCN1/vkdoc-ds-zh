  trans: "\n### 关键概念与术语\n\n- **前馈（Feed Forward）**：前馈神经网络是一种基础类型的神经网络，其特点是信息流方向单一。数据仅朝一个方向传输，从输入节点经过隐藏节点，最终到达输出节点。每个节点处理输入信息后将其传递至下一层。\n\
    - **反向传播（Backpropagation）**：反向传播是一种神经网络的学习方法。它好比教网络从错误中学习，通过计算输出与正确答案的偏差，然后调整网络参数，使其输出结果更接近正确值，从而帮助改进神经网络。\n\
    - **循环神经网络（RNN）**：RNN 是一种经过训练、能够处理序列数据（如一系列随时间发生的事件）的神经网络。这使得 RNN 能够根据输入的顺序做出预测或决策。例如，RNN\
    \ 可通过分析历史价格和市场趋势来预测股价的变动幅度。RNN 的独特之处在于其具备“记忆”能力，这意味着它会利用早期输入的信息来帮助理解当前输入，从而产生正确的输出。与其他将每个输入单独处理的神经网络类型不同，RNN\
    \ 依赖于序列的顺序。想象一下烤蛋糕的过程，步骤的顺序至关重要。如果不按顺序混合配料，就无法烤出蛋糕。同样，RNN 会记住步骤的顺序，并利用这些信息来预测接下来会发生什么。\n\
    - **长短期记忆网络（LSTM）**：LSTM 是一种特殊的 RNN，旨在解决常规 RNN 存在的问题。常规 RNN 在处理长序列信息时，难以记住细节。这使得将之前发生的事情与当前情况联系起来变得困难。LSTM\
    \ 通过其自身结构设计解决了这个问题，它能够长期记住信息。事实上，长期保留重要细节正是 LSTM 所擅长的！\n- **卷积神经网络（CNN）**，又名 ConvNets：CNN\
    \ 通常用于目标检测和图像分类任务。\n- **生成对抗网络（GAN）**：GAN 由两个神经网络组成：一个称为生成器，另一个称为判别器。生成器的任务是创建与训练数据集相似的新样本，而判别器的任务是区分真实样本和生成器生成的样本。“对抗”一词源于这两个网络被设置为相互竞争的关系。GAN\
    \ 可用于基于现有图像集合创建新图像，或通过学习歌曲数据库生成新音乐。GAN 还可用于根据文本描述生成逼真的图像，或改进现有照片。此外，它们也能用于生成具有与真实数据相同特性的新合成数据。\n\
    - **Transformer**：Transformer 是一种神经网络，它通过理解序列中各部分之间的上下文和关系，将输入序列（如一个句子）转换为输出序列。与\
    \ RNN 和 CNN 等其他神经网络不同，Transformer 一次性处理整个序列，而非逐步处理，因此速度更快、效率更高。这意味着它们需要的训练时间更少，运行速度也更快。Transformer\
    \ 有两个重要特性，使其在文本预测等任务中表现出色：\n    1.  **位置编码（Positional Encoding）**：Transformer\
    \ 并非仅仅按照单词出现的顺序读取它们，而是为每个单词分配一个唯一的编号。这有助于模型理解句子中单词的顺序，这对于理解句意至关重要。\n    2.  **自注意力机制（Self-attention）**：此特性允许模型同时关注句子中所有单词之间的关系。模型学习哪些单词彼此重要，这有助于预测序列中接下来可能出现的内容。例如，Transformer\
    \ 可以通过分析单词通常如何组合在一起，“学习”语法规则。\n- **大型多模态模型（LMM）**：一种结合了大型语言模型（LLM）和多模态（MM）的深度学习模型。\n\
    - **检索增强生成（RAG）**：RAG 是一种通过从外部来源获取事实信息来提高机器学习模型准确性的技术。LLM 和 LMM 功能强大，可以执行问答、文档文本提取或语言翻译等任务，但它们也存在一些局限性。例如，它们只能使用被训练过的信息，这些信息可能过时或不完整。有时，如果模型不了解某件事，甚至可能给出错误答案。RAG\
    \ 通过允许模型在给出答案前查询可靠的信息源来帮助解决这些问题。这使得模型能够提供更准确、更新的响应，而无需重新训练或微调。\n- **生成式人工智能（GEN\
    \ AI）**：一种能够根据用户的请求或提示创建新内容的深度学习模型。\n- **大型语言模型（LLM）**：一种只能理解和生成文本数据的深度学习模型。\n\
    - **多模态模型（MM）**：一种能够处理不同模态（例如文本、音频或图像）的深度学习模型。模型是多模态的可能意味着以下一种或多种情况：\n    1. \
    \ 输入和输出的模态不同（例如，图像到文本）。\n    2.  模型的输入是多模态的（即模型可以同时接受文本和图像）。\n    3.  模型的输出是多模态的（即模型可以同时生成文本和图像）。\n\
    \n![](img/613832_1_En_5_Fig4_HTML.jpg)\n\n**图 5-4** 来自 `scikit-learn` 网站的指南，用于根据数据集大小、特征数量和解决的问题类型来帮助选择机器学习算法，如分类、聚类和回归（`scikit-learn`\
    \ 算法速查表，无日期）\n\n机器学习模型形式多样，各有优劣。模型的选择取决于具体问题、数据性质以及期望的结果。\n\n## 机器学习模型的重要性\n\n\
    机器学习模型在各行各业都可能至关重要。\n\n### 医疗保健\n\n在医疗保健领域，ML 模型有助于提高诊断准确性、个性化治疗方案、预测患者结果以及辅助教育推广。例如，可利用深度学习模型分析医学影像，检测身体中的异常情况，如骨折和病变。模型在识别患有糖尿病、心脏病等慢性疾病风险的患者方面可发挥关键作用，从而实现早期干预，改善患者的生活预后。模型还可以加速从手写和扫描文档中提取患者信息的过程。\n\
    \n### 金融\n\n金融领域可以通过多种方式应用机器学习模型，例如欺诈检测和预测。欺诈检测模型通过分析模式来识别欺诈行为，保护金融机构及其客户。在预测方面，机器学习模型可以分析市场趋势并预测潜在风险，帮助金融机构做出明智的决策。\n"
- fmt: '### Retail


    Machine learning can enhance customer experience in retail through recommendation
    systems, forecasting, and inventory management. By analyzing customer behavior
    and purchase history, recommendation engines can suggest products that align with
    individual preferences, thereby increasing sales and customer satisfaction. Forecasting
    models can predict future sales and trends, enabling retailers to optimize their
    inventory and reduce costs associated with overstocking.


    ### Transportation


    Autonomous vehicles and traffic management systems exemplify the ways AI can have
    a transformative impact in the transportation sector. Self-driving cars leverage
    machine learning models for navigation, object detection, and decision-making.
    This aims to improve safety and efficiency on the roads. Traffic management systems
    can use predictive models to optimize traffic flow, which can reduce congestion
    and minimize travel times by analyzing real-time data. The model can be used for
    incident detection and management. For example, it can be used to detect accidents,
    wrong-way drivers, and irregular driving like drunk drivers swerving. This information
    can be used to alert the authorities.


    ### Marketing


    Machine learning models can be used to analyze consumer data to target advertisements,
    segment markets, and predict customer churn. This can help businesses tailor their
    marketing strategies to individual preferences and behaviors. This can lead to
    more effective campaigns and higher conversion rates. Companies can proactively
    implement retention strategies to maintain a loyal customer base by understanding
    customer lifetime value and identifying potential churners.


    ## Machine Learning Models’ Tools and Techniques


    ### Programming Languages


    Python is one of the most popular languages for machine learning. It is known
    for its readability and extensive libraries, such as `TensorFlow`, `Keras`, `scikit-learn`,
    `PyTorch`, and `Hugging Face Transformers`. Python’s simplicity and versatility
    make it an ideal choice for beginners and experienced practitioners. The language
    supports rapid prototyping and development, enabling data scientists and machine
    learning engineers to experiment with different algorithms and techniques quickly
    and efficiently.


    #### Frameworks and Libraries


    ##### TensorFlow


    `TensorFlow` is an open source framework developed by Google, used for building
    and deploying ML models. It provides a flexible and comprehensive ecosystem for
    machine learning development, including tools for model training, evaluation,
    and deployment.


    ##### PyTorch


    Developed by Meta, `PyTorch` is known for its ease of use in research and development.
    `PyTorch` is a favorite among researchers and developers for prototyping and experimenting
    with new ideas.


    ##### Keras


    `Keras` is a high-level neural network API written in Python and capable of running
    on top of `TensorFlow` and `PyTorch`. It simplifies the process of building and
    training deep learning models by providing a user-friendly API and good documentation.
    `Keras` is beneficial for beginners and practitioners who want to develop and
    experiment with neural networks quickly.


    ##### scikit-Learn


    `scikit-learn` is a library for classical ML algorithms like regression, classification,
    and clustering. It provides simple and efficient tools for data analysis and modeling.
    It is a popular choice for educational purposes and real-world applications. `scikit-learn`’s
    well-documented API and extensive collection of algorithms make it a go-to library
    for implementing standard machine learning tasks.


    ##### Transformers


    `Hugging Face Transformers` is an open source library that simplifies the use
    of state-of-the-art machine learning models. It provides a wide range of pre-trained
    models for tasks such as image classification, named entity recognition, and question
    answering, among others. Built on top of `PyTorch` and `TensorFlow`, the library
    offers an accessible interface for leveraging these powerful models, enabling
    developers and researchers to integrate advanced machine learning capabilities
    into their projects with ease.


    #### Integrated Development Environments


    ##### Jupyter Notebook


    `Jupyter Notebook` is an open source web application that allows for interactive
    coding, visualization, and sharing of ML models. It supports multiple programming
    languages and integrates seamlessly with various data science libraries. `Jupyter
    Notebook`s enable data scientists to document their workflow, visualize results,
    and collaborate with others in a reproducible manner.'
