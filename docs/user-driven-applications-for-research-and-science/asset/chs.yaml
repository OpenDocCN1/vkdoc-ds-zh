  \n\n## Arc\n\n- 文件：`Form_Arc.cs`\n- 菜单位置：`简单对象 ➤ 圆弧`\n\n让我们再次转向一个带有弯曲边缘的对象。在我的书[2]中，你可以找到各种宽窄圆弧的例子，以及一些看似宽圆弧的环形扇区示例。在此，我尝试将所有情况统一到一个类中。此外，`Arc`类还展示了两个有趣的特性。\n\
  \n-   通常，大节点形状与其所关联的对象形状相似。这虽常见，但并非铁律；有时大节点的形状与对象本身毫无相似之处，但这类节点在封面设计中却很有用。\n-  \
  \ 有些情况下，节点形状会动态变化，并取决于对象的某些参数。\n\n在深入探讨 `Arc` 类的细节之前，我们先提一下设计思路。圆弧，尤其是宽圆弧，看起来像圆环的一部分，因此需要具备一些相同的参数，例如中心点、内半径和外半径。此外，还有描述弧线两端的两个角度。\n\
  \n当你观察任何一段圆弧时，无法看出其两端有何区别。同样地，我们也看不出矩形的四个角有何不同，但当你按下任意一个角时，移动器因为每个角都被一个带有独立编号的节点覆盖，所以能准确知道按下了哪个。为了使圆弧的两端可移动，它们被节点覆盖；这些节点拥有自己的编号，因此移动器能知道按下的是哪一端。在代码中，一端被称为*头*，从中心点到这一端的角度称为`angleHead`。圆弧的另一端称为*尾*；从头部到尾部之间的角度称为`angleArc`。我想提醒你，逆时针方向的角度为正。圆弧的头部可以用字母\
  \ *H* 标记（图 2-39）。\n\n![../images/501148_1_En_2_Chapter/501148_1_En_2_Fig47_HTML.jpg](img/501148_1_En_2_Fig47_HTML.jpg)\n\
  \n图 2-39\n\n`Arc` 类的几个对象\n\n```\npublic Arc (Form frm, Mover mvr, PointF ptC, float\
  \ rIn, float rOut,\ndouble angleHead_Degree, double angleArc_Degree, Color clr)\n\
  ```\n\n该类的圆弧具有可移动的端点；通过移动一端或另一端，可以改变圆弧角度。此角度只能在某个范围内更改。最小角度限制（`minDegree_Arc = 10`）防止圆弧消失。最大角度限制（`maxDegree_Arc\
  \ = 350`）防止圆弧变成完整的圆环；图 2-39 中的黄色圆弧展示了接近最大允许角度的情形。\n\n圆弧的内外边界是可移动的。理论上，圆弧的宽度可以减小到单个像素，从而将圆弧变成一条曲线，但这样做会导致沿着一条边界的感应环被另一条边界的类似感应环所阻挡。35\
  \ 页前讨论的 `Ring_Adh` 类的覆盖层包含从最小到最大的同轴圆形节点。`Arc` 类覆盖层中的节点顺序相同，这在圆弧很薄的情况下可能导致死锁。\n\n\
  假设你将圆弧内边界压缩至最小尺寸，然后开始压缩外边界。如果允许圆弧主体的宽度被压缩至一个像素，你这样做并释放外边界后，将无法再更改或移动这个圆弧。内边界上的节点会阻挡主体和外边界上的节点，但内边界本身无法移动，因为它已经达到了允许的最小半径。为避免这种情况，对圆弧的最小允许宽度设置了限制（`minWidth\
  \ = 10`）。这样的限制保证了在任何时候都可以在屏幕上移动圆弧并移动其外边界。\n\n```\npublic class Arc : GraphicalObject\n\
