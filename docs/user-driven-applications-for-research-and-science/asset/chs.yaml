  \n图 2-37c\n\n不可重新配置多边形的覆盖\n\n![../images/501148_1_En_2_Chapter/501148_1_En_2_Fig42_HTML.jpg](img/501148_1_En_2_Fig42_HTML.jpg)\n\
  \n图 2-37b\n\n完全覆盖\n\n![../images/501148_1_En_2_Chapter/501148_1_En_2_Fig41_HTML.jpg](img/501148_1_En_2_Fig41_HTML.jpg)\n\
  \n图 2-37a\n\n多边形\n\n图 2-37a 展示了您在屏幕上看到的一个多边形。在实际应用中，这些覆盖层从不显示，但它们的可视化有助于解释和分析，因此图\
  \ 2-37b 展示了当所有节点都具有实际尺寸时同一多边形的覆盖层；图 2-37c 展示了该多边形被声明为不可重新配置时的覆盖层。如您所见，在这种情况下，所有圆形节点都被压缩为零尺寸。图\
  \ 2-37d 和 2-37e 标记了一些需要讨论的有趣位置。\n\n出现一些奇怪情况的原因在于，我们（用户）和移动器对同一对象有着不同的视角。无论其所有参数如何，我们在图\
  \ 2-37a 中看到的是同一个重新配置后的多边形。对于移动器来说，没有颜色和绘制，只有覆盖层，因此，根据声明的 Reconfiguration 属性，移动器在图\
  \ 2-37b 或 2-37c 中只看到节点。这还不是全部，因为后续的一些移动器操作还取决于当前声明的可调整大小属性。（我想提醒您，在 `Polygon_Elastic`\
  \ 类中，带状节点的大小不依赖于可调整大小属性，因此无法通过覆盖视图来判断图 2-37c 中的多边形是否可调整大小。）\n\n默认情况下，多边形是可移动的，并且在这种情况下，它应该可以通过任何内部点移动。您将光标移过此多边形，几乎所有地方光标都显示为十字形。但在图\
  \ 2-37d 中由黑线端点标记的两个小区域上方，十字形会变为手形。移动器会持续寻找节点，并根据第一个检测到的节点的参数改变光标形状。对于我们的眼睛来说，这些是颜色平滑变化且没有任何特殊特征的地方，但对于移动器来说，这些是圆形节点的位置，因此光标形状会改变。如果您移动光标的速度不是太快，就能捕捉到这种变化。如果此时停止并按下光标，那么您将移动的不是整个多边形，而是被抓取的那个顶点。是否打算这样做取决于您，但您需要了解存在这种可能性。该顶点对用户来说可能是不可见的，因为它被多边形的某个部分遮挡了视线，但\
  \ `Polygon_Elastic` 对象的圆形节点在其覆盖层中排在首位，因此会首先被移动器分析和抓取 (!)。\n\n这些多边形中的圆形节点很小，意外移动某个顶点的概率微乎其微。带状节点从不消失，它们的面积更大，但按下某个隐藏边界部分的效果可能会有所不同。带状节点上的光标形状也会从十字形变为手形。如果您按下了图\
  \ 2-37e 中由黑线端点标记的区域之一，并且该多边形是可调整大小的（默认情况下是可调整大小的），那么您将开始调整大小。如果您对不可调整大小的多边形执行相同操作，光标则会吸附在按下的点上。\n\
  \n有两种方法可以将新多边形添加到当前示例中。一种是通过其菜单中的命令复制现有多边形。另一种是在任意空白位置调用菜单，并使用“添加多边形”命令，该命令会调用一个辅助窗体\
  \ `Form_NewElasticPolygon.cs`（图 2-38）。来自示例 `Form_Polygon_Elastic.cs` 的弹性多边形可以任意变换，因此我认为没有必要在辅助窗体中定义新多边形的形状。此辅助窗体的目的是定义一个具有所需顶点数量以及所有特殊点所需颜色的新多边形。在此辅助窗体中使用的多边形可以调整大小和旋转，但它始终是一个正多边形，其顶点附近放置有额外的小圆圈。\n\
  \n![../images/501148_1_En_2_Chapter/501148_1_En_2_Fig46_HTML.jpg](img/501148_1_En_2_Fig46_HTML.jpg)\n\
  \n图 2-38\n\n此处定义了新多边形的顶点数量和颜色集\n\n```csharp\npublic class Polygon_RegChat_withCircles\
  \ : GraphicalObject\n{\nPointF m_center;\ndouble m_angle;\ndouble radiusVertices,\
  \ fRadiusToCenters;\nint nVertices;\nColor clrCenter;\nColor [] clrVertices;\nfloat\
  \ fSpaceToCircles, fRadiusSmall;\nbool bResizable, bRotatable;\n```\n\n`Polygon_RegChat_withCircles`\
  \ 类的对象演示了在其他屏幕对象中很少见的一个特性。通常，屏幕对象是作为一个整体显示的。一个对象可以是任意形状，但它通常是一个单一的整体，因此通常有一个由重叠节点组成的覆盖层。对于这个多边形来说，构成单个对象的几个完全分离的部分。例如，您可以通过任何内部点旋转此多边形，也可以通过任何小圆圈进行同样的旋转。\n\
  \n小圆圈放置在距离顶点固定距离（`fSpaceToCircles`）的位置，并位于从多边形中心点穿过顶点的射线上，因此多边形的几何形状以及这些圆圈已知的距离和半径（`fRadiusSmall`）完美地描述了这些小部分的位置。圆圈不能单独移动。一个具有\
  \ N 个顶点的多边形的覆盖层由 N + 2 个节点组成。该对象的主要部分是一个正多边形，因此两个节点提供其移动和调整大小功能；N 个圆形节点覆盖这些小圆圈。\n\
  \n```csharp\npublic override void DefineCover ()\n{\nCoverNode [] nodes = new CoverNode\
  \ [VerticesNumber + 2];\nPointF [] ptCircles = Auxi_Geometry .RegularPolygon (Center,\n\
  fRadiusToCenters, VerticesNumber, Angle);\nfor (int i = 0; i < VerticesNumber; i++)\n\
  {\nnodes [i] = new CoverNode (i, ptCircles [i], fRadiusSmall);\n}\nint k0 = VerticesNumber;\n\
  if (Resizable)\n{\nnodes [k0] = new CoverNode (k0, VerticesMinus);\nnodes [k0 +\
  \ 1] = new CoverNode (k0 + 1, VerticesPlus, Cursors .Hand);\n}\nelse\n{\nnodes [k0]\
  \ = new CoverNode (k0, Vertices);\nnodes [k0 + 1] = new CoverNode (k0 + 1, m_center,\
  \ 0f);\n}\ncover = new Cover (nodes);\n... ...\n```\n\n在不同位置（节点）按下多边形会产生什么反应？\n\n\
  对于*鼠标左键按下*：\n\n*   如果在多边形内部按下，则移动整个对象。\n*   如果在边界上按下，则调整多边形大小。\n*   如果在任何圆圈上按下，则光标固定在按下的点上。\n\
