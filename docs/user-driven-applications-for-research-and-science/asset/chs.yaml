  \    ColorStr .NUMBER_COMA_SPACE));\n}\n... ...\n```\n\n在矩形或其注释发生任何更改时，通过调用同一个 `PrepareListString_listRect()`\
  \ 方法来刷新整个列表并非难事，但我更倾向于展示其他几种可能性。在此示例中，我们只有一个带注释的矩形；因此，对于矩形本身，无需额外的标识。与此矩形关联的注释数量可以变化，因此点击任何注释都需要进行注释标识。\n\
  \n```csharp\nprivate void OnMouseDown (object sender, MouseEventArgs e)\n{\n   \
  \ ptMouse_Down = e .Location;\n    if (mover .Catch (e .Location, e .Button, bShowAngle))\n\
  \    {\n        GraphicalObject grobj = mover .CaughtSource;\n        ... ...\n\
  \        else if (grobj is Comment_ToRectangle)\n        {\n            cmntPressed\
  \ = grobj as Comment_ToRectangle;\n            CommentIdentification ();\n     \
  \       cmntPressed .Press (e .Location, e .Button, iNode);\n        }\n       \
  \ ... ...\n```\n\n这个简单的标识功能会给出被点击注释在矩形所有注释中的序号 (`jCmntRWC`)；同时也决定了 `listRect` 中显示该注释数据的行。\n\
  \n```csharp\nprivate void CommentIdentification ()\n{\n    jCmntRWC = -1;\n    if\
  \ (cmntPressed .ParentID == rectWithComments .ID)\n    {\n        for (int j = 0;\
  \ j < rectWithComments .Comments .Count; j++)\n        {\n            if (cmntPressed\
  \ .ID == rectWithComments .Comments [j] .ID)\n            {\n                jCmntRWC\
  \ = j;\n                break;\n            }\n        }\n    }\n}\n```\n\n对矩形或其被点击注释的大多数更改都需要更改特定单元格中的数据，这通过\
  \ `ListView_GR.Subitem()` 方法完成。例如，下面是被点击注释的字体更改。\n\n```csharp\nprivate void Click_miFont_Cmnt\
  \ (object sender, EventArgs e)\n{\n    ... ...\n    if (jCmntRWC >= 0)\n    {\n\
  \        listRect .Subitem (3 + 5 + jCmntRWC * 7, 1,\n        Auxi_Convert .FontInDetails\
  \ (cmntPressed .Font));\n        ... ...\n```\n\n可以通过菜单命令添加新的注释。新注释被添加到关联注释的头部；列表中必须包含相应数量的行，因此刷新整个列表更为简便。为了方便数据读取，每个注释关联的行之间会用线条分隔，因此每当注释数量发生变化（添加或删除）时，都会通过\
  \ `ListRect_HorLines()` 方法计算带下划线项目的数组。\n\n```csharp\nprivate void Click_miAddComment\
  \ (object sender, EventArgs e)\n{\n    double xCoef, yCoef;\n    Auxi_Geometry .CoefficientsByLocation\
  \ (rectWithComments .MainElementArea,\n    ptMouse_Up, out xCoef, out yCoef);\n\
  \    rectWithComments .InsertComment (0, xCoef, yCoef,\n    \"Comment-\" + rectWithComments\
  \ .Comments .Count);\n    string [] strs = PrepareListStrings_listRect ();\n   \
  \ listRect .RenewTexts (strs);\n    ListRect_HorLines ();\n    RenewMover ();\n\
  }\n```\n\n### 单选按钮\n\n在界面设计中，三种按钮类型被广泛使用：普通按钮、复选框和单选按钮。我们已经有了前两种的图形化对应物；现在轮到单选按钮了。有一件事使其不仅与其他按钮不同，也与所有其他控件不同：单选按钮从不单独使用，而是仅在组中使用。拥有一个单独的单选按钮毫无意义，因为这些控件的唯一目的是在\
  \ N 个可能性中组织单一选择。普通的 `RadioButton` 控件通常通过 `GroupBox` 组合成组，尽管也可以通过 `Panel` 来实现。单选按钮的图形化对应物也仅在组中使用，但当然不会为此使用控件。在深入探讨图形化单选按钮的细节之前，我们先聊聊普通\
  \ `RadioButton` 和 `GroupBox` 控件的一些特性。\n\n*   文件：`Form_RadioBtnsLight.cs`\n*   菜单位置：图形控件\
  \ ➤ 单选按钮（轻量版）\n*   `RadioButton` 对象由一个小圆圈和关联文本组成。可以组织它们相对位置的不同类型，但除了两者均位于同一水平线上且文本在圆圈右侧之外，我从未见过其他布局。我认为对于从右到左书写规则的国家，将圆圈放置在文本右侧可能更合适，但我从未处理过此类应用程序。\n\
  *   `RadioButton` 对象仅在组中使用。在组内，这些按钮可以任意放置，但标准做法是将其圆圈严格排列在一条垂直线上。在一个程序中，我见过一个组中将单选按钮放置在多列中，但这是我几十年来印象中唯一的案例。在我的另一本书\
  \ [2] 中，有一个例子将普通单选按钮沿着倾斜的直线放置，但这仅表明严格的垂直放置并非强制要求。\n*   `RadioButton` 对象通常以相等的间距放置。在我另一本书\
  \ [2] 的同一个例子中，还有一组单选按钮的相邻间距是不均匀的。这些单选按钮与表单中位于组外的其他元素相关联。那些“外部”对象类型和大小各异，因此我采用了组内单选按钮的不均匀分布，以便将每个按钮放置在其关联的外部元素对面。这种按钮布局使得关联性更加明显。按钮之间设置不同的间距并无不妥，但我从未在其他程序中见过这种做法。\n\
  \n让我们从一个轻量版开始我们的图形化单选按钮工作，该版本提供了我们在程序中通常看到的按钮类型。在这个轻量版中，圆圈和文本始终位于同一水平线上，且文本在圆圈右侧。此类单选按钮可以组织成一个轻量版的组——`Group_RadioBtnsLight`\
  \ 类——其中所有圆圈都位于同一条垂直线上，按钮只能上下移动。\n\n```csharp\npublic class RadioButton_Light : GraphicalObject\n\
  {\n    PointF ptCenter;\n    string m_text;\n    Font m_font;\n    Color m_color;\n\
  \    bool bSwitched;\n    bool bEnabled = true;\n    static float rBig = 8;\n  \
  \  RectangleF rcText;\n```\n\n按钮文本并非紧挨着圆圈放置，而是向旁边偏移了半个圆半径的距离（`rBig`）。`RadioButton_Light`\
  \ 对象的覆盖区域由三个节点组成。第一个节点覆盖圆圈，第二个节点覆盖文本，第三个节点覆盖圆圈和文本之间的间隙。\n\n\n```csharp\npublic override\
  \ void DefineCover()\n{\n    PointF[] pts = new PointF[] {\n        new PointF(ptCenter.X,\
  \ ptCenter.Y - rBig),\n        new PointF(rcText.Left,\n            Math.Max(ptCenter.Y\
  \ - rBig, rcText.Top)),\n        new PointF(rcText.Left,\n            Math.Min(ptCenter.Y\
  \ + rBig, rcText.Bottom)),\n        new PointF(ptCenter.X, ptCenter.Y + rBig) };\n\
  \    CoverNode[] nodes = new CoverNode[] {\n        new CoverNode(0, ptCenter, rBig),\n\
  \        new CoverNode(1, rcText, Cursors.SizeNS),\n        new CoverNode(2, pts,\
  \ Cursors.SizeNS) };\n    if (!Movable)\n    {\n        nodes[1].Cursor = Cursors.NoMove2D;\n\
  \        nodes[2].Cursor = Cursors.NoMove2D;\n    }\n    cover = new Cover(nodes);\n\
  \    ... ...\n```\n\n按钮的选中操作通过点击任意点完成；最后两个节点也可用于上下移动按钮。无论按下按钮的哪个点，该点都会被记录下来（`ptPressed`）。鼠标按下时不做其他操作。\n\
  \n```csharp\npublic void Press(...)\n{\n    ptPressed = ptMouse;\n}\n```\n\n可能的移动行为由\
  \ `MoveNode()` 方法描述。\n\n- 单选按钮的圆形部分不可移动；当按下圆形区域时（`iNode == 0`），禁止任何移动，光标将保持在同一位置直至鼠标释放。\n\
  - 当可移动按钮的非圆形部分被按下时，光标仅允许垂直移动，按钮随光标同步移动。\n- 当不可移动按钮的非圆形部分被按下时，光标将保持在同一位置直至鼠标释放。\n\
  \n光标通过熟悉的 `AdjustCursorPosition()` 方法被控制在按下点或直线上。\n\n```csharp\npublic override\
  \ bool MoveNode(...)\n{\n    bool bRet = false;\n    if (catcher == MouseButtons.Left)\n\
  \    {\n        if (iNode == 0)\n        {\n            AdjustCursorPosition(ptPressed);\n\
  \        }\n        else\n        {\n            if (Movable)\n            {\n \
  \               Move(0, dy);\n                bRet = true;\n                AdjustCursorPosition(new\
  \ Point(ptPressed.X, ptMouse.Y));\n            }\n            else\n           \
  \ {\n                AdjustCursorPosition(ptPressed);\n            }\n        }\n\
  \    }\n    return (bRet);\n}\n```\n\n单选按钮仅在组内使用。此示例（图 5-25）展示了 `Group_RadioBtnsLight`\
  \ 类的三个组。这些组的设计理念与 `Group_ArbitraryElements` 类相同。\n\n![../images/501148_1_En_5_Chapter/501148_1_En_5_Fig26_HTML.jpg](img/501148_1_En_5_Fig26_HTML.jpg)\n\
  \n**图 5-25** — `Form_RadioBtnsLight.cs`\n\n- 包含一组内部元素；在本例中，所有元素均属于 `RadioButton_Light`\
  \ 类。\n- 内部元素可移动。可将其声明为不可移动以防止意外移动，但这需由用户决定。所有内部元素均可无限制地上下移动，因此用户可自由调整元素间距、按视觉子组排列位置或改变顺序。\n\
  - 组区域可通过框架、不同背景色或两者组合进行标记。组区域会根据内部元素的任何变化自动调整。\n- 组可带标题或不带标题使用。组宽度由两个元素中较宽者决定：标题（若存在）与最长按钮。若组宽度允许，标题可左右移动；此类移动使用粘附鼠标技术。用户可调节标题的可移动性。\n\
  \n```csharp\npublic class Group_RadioBtnsLight : GraphicalObject\n{\n    RectangleF\
  \ m_rcFrame, m_rcBigNode, m_rcTitle;\n    List m_elements = new List();\n    string\
  \ m_title;\n    bool bTitleMovable = true;\n    Font fntTitle;\n    Color clrTitle;\n\
  \    Pen penFrame;\n```\n\n此类组的覆盖层由两个节点构成。第一个节点覆盖标题矩形区域（`m_rcTitle`）；对于无标题的组，该节点尺寸被压缩为零。第二个节点也为矩形，覆盖框架区域（`m_rcBigNode`）。\n\
  \n```csharp\npublic override void DefineCover()\n{\n    m_rcBigNode = RectangleF.FromLTRB(m_rcFrame.Left,\
  \ m_rcFrame.Top,\n        m_rcFrame.Right + 1, m_rcFrame.Bottom);\n    CoverNode[]\
  \ nodes = new CoverNode[2];\n    if (TitleExist)\n    {\n        nodes[0] = new\
  \ CoverNode(0, m_rcTitle);\n        if (bTitleMovable)\n        {\n            nodes[0].SetBehaviourCursor(Behaviour.Moveable,\
  \ Cursors.SizeWE);\n        }\n    }\n    else\n    {\n        nodes[0] = new CoverNode(0,\
  \ m_rcFrame.Location, 0f);\n    }\n    nodes[1] = new CoverNode(1, m_rcBigNode);\n\
  \    cover = new Cover(nodes);\n    ... ...\n```\n\n组及其按钮的可见性参数必须由用户控制。对于单选按钮的轻量版，使用轻量版调优，因此本示例中某些次要参数不可调。所有调优通过菜单命令组织（图\
  \ 5-26）。要更改特定按钮的参数或将其参数应用于所有同级按钮，需在按钮上调用菜单（图 5-26a）。\n\n![../images/501148_1_En_5_Chapter/501148_1_En_5_Fig28_HTML.jpg](img/501148_1_En_5_Fig28_HTML.jpg)\n\
  \n**图 5-26b** — 组上的菜单\n\n![../images/501148_1_En_5_Chapter/501148_1_En_5_Fig27_HTML.jpg](img/501148_1_En_5_Fig27_HTML.jpg)\n\
  \n**图 5-26a** — 单选按钮上的菜单\n\n组菜单（图 5-26b）可在组内任意空白处调用。该菜单允许您定义标题外观、调节框架绘制、为所有按钮设置参数、将上方按钮间距作为所有相邻按钮间距的样本，以及设置组背景。此外还有恢复组默认视图和调节标题及按钮可移动性的命令。\n\
  \n“修改组”行包含一个含有大量命令的子菜单（图 5-26b）。在这种情况下，包含所有这些功能的调优表单更为便利。我决定为组的轻量版和标准版采用不同的调优方式，因此组的标准版会在本章稍后部分介绍其预期的调优表单。\n\
  \n用户可以轻松更改组内单选按钮的顺序，因此选择仅基于按下按钮的 `ID`。按钮的 `ID` 在按钮构造时一次性设定，并且不依赖于后续的任何移动或参数更改。\n\
  \n```csharp\nprivate void OnMouseUp(object sender, MouseEventArgs e)\n{\n    ptMouse_Up\
  \ = e.Location;\n    double fDist = Auxi_Geometry.Distance(ptMouse_Down, ptMouse_Up);\n\
  \    int iObj, iNode;\n    if (mover.Release(out iObj, out iNode))\n    {\n    \
  \    GraphicalObject grobj = mover.ReleasedSource;\n        if (e.Button == MouseButtons.Left)\n\
  \        {\n            if (grobj is RadioButton_Light && radiobtnPressed.Enabled)\n\
  \            {\n                if (fDist <= 3)\n                {\n           \
  \         groupAround.SelectButton(\n                        groupAround.ButtonSearch(radiobtnPressed.ID));\n\
  \                }\n                ... ...\n```\n\n组菜单（图 5-26b）包含一个用于调节所有按钮可移动性的命令。选择与调优功能与此可移动性无关。\n\
  \n组菜单中的“随机排序”命令仅对 Rainbow 组启用。此命令使用当前按钮的坐标，但改变其顺序。Rainbow 组还有一个有趣特性：若按钮按正确的彩虹顺序排列，您即可发现该特性。\n\
  \n- 文件：`Form_RadioButtons.cs`\n- 菜单位置：图形控件 ➤ 单选按钮\n\n单选按钮及其组的轻量版在设计时遵循以下三条限制：\n\n\
  | • `按钮视图` | 文本位于圆形右侧，且中心点位于同一水平线。 |\n| • `组视图` | 组内所有按钮的圆形沿同一垂直线排列。 |\n| • `移动`\
  \ | 按钮仅可上下移动。 |\n\n\n### 排版后的文本\n\n多年来你在所有应用程序中见过的几乎所有单选按钮都具有这样的视图，因此你会认为这是预期的显示方式，而不会觉得这三条规则是任何限制。然而，普通的`RadioButton`类允许你，例如，将圆圈放置在其关联文本的上方，并能够以任意方式在`GroupBox`内放置单选按钮。开发者可以利用普通的`RadioButton`控件做一些有趣的事情，但无论设计者有何想法，用户都必须接受给定的样式，无法自行更改任何内容。在用户驱动的应用程序中，完全的控制权交给了用户，因此新版单选按钮必须能在没有任何前述限制的情况下工作，并且新的类必须实现简便的方法，来更改圆圈-文本对内的相对位置以及组内按钮的位置。因为在大多数应用程序中，上述限制看起来根本不像限制，我决定在新类中包含一种简便的方法，用于在受限移动和无限移动两种变体之间切换。新单选按钮的变体由`RadioButtonType`枚举描述；从这些变体的名称中可以看出，自由的无限移动和新单选按钮的任意定位被视为正常模式。\n\
  \n```\npublic enum RadioButtonType { Normal, Light };\n```\n\n单选按钮从不作为独立对象使用，而是仅在组内使用。`RadioButton_GR`类的按钮被组织成`Group_RadioButtons`类的组；当前示例中演示了两个这样的组（图\
  \ 5-27）。在同一组内不可能同时使用受限移动和无限移动的按钮，因为这会产生如同同时使用可移动和不可移动对象一样的混乱。因此，如果用户决定更改任何组内的按钮行为，则该更改将同时应用于该组的所有按钮。\n\
  \n![../images/501148_1_En_5_Chapter/501148_1_En_5_Fig29_HTML.jpg](img/501148_1_En_5_Fig29_HTML.jpg)\n\
  \n**图 5-27** `Group_RadioButtons` 类的对象\n\n对于任何单选按钮，文本相对于圆圈的位置描述方式与复选框相同，因此文本可以放置在圆圈的任意一侧，并且每一侧都有三种圆圈-文本对齐方式。\n\
  \n```\npublic class RadioButton_GR : GraphicalObject\n{\nRadioButtonType typeBtn\
  \ = RadioButtonType .Normal;\nPointF ptCenter;\nSide sideText;\nSideAlignment alignParts;\n\
  string m_text;\nFont m_font;\nColor m_color;\nbool bSwitched;\nbool bEnabled = true;\n\
  ```\n\n`RadioButton_GR` 类的覆盖层设计方式与精简版相同：一个节点位于圆圈之上，另一个节点位于文本之上，还有一个附加节点位于两者之间的空间。这第三个节点总是多边形，但其具体形状取决于圆圈和文本的大小及相对位置。计算这个节点很容易，但这部分代码过于冗长，此处不予展示。\n\
  \n```\npublic override void DefineCover ()\n{\nCoverNode [] nodes = new CoverNode\
  \ [3];\nnodes [0] = new CoverNode (0, ptCenter, rBig);\nPointF [] pts = new PointF\
  \ [4];\nif (typeBtn == RadioButtonType .Normal)\n{\nnodes [1] = new CoverNode (1,\
  \ rcText, Cursors .Hand);\n... ...\nnodes [2] = new CoverNode (2, pts, Cursors .Hand);\n\
  }\nelse\n{\nnodes [1] = new CoverNode (1, rcText, Cursors .SizeNS);\n... ...\nnodes\
  \ [2] = new CoverNode (2, pts, Cursors .SizeNS);\n}\nif (!Movable)\n{\nnodes [1]\
  \ .Cursor = Cursors .NoMove2D;\nnodes [2] .Cursor = Cursors .NoMove2D;\n}\ncover\
  \ = new Cover (nodes);\n... ...\n```\n\n组（`Group_RadioButtons` 类）和内部单选按钮（`RadioButton_GR`\
  \ 类）的覆盖层设计没有什么新意；只是单选按钮上的鼠标光标形状从默认值进行了更改。当鼠标光标在组区域内移动时，它会经过内部元素和组的空白区域。在这两种情况下，鼠标下方都会有一个多边形节点，因此无需任何额外更改，光标将保持相同的默认形状，而不会提示可能的移动。为了在视觉上区分移动组或内部元素的可能性，必须更改其中一个的光标。我尝试了两种变体，并决定为组本身保留标准光标（`Cursors.SizeAll`），同时将按钮的光标更改为\
  \ `Cursors.Hand`。\n\n一个带有星期几名称的简单组可以演示使用此类组可以完成的许多事情。对于许多读者（我认为是大多数）来说，图 5-27 中显示的天数顺序看起来很奇怪，但根据传统，有些国家/地区的第一个工作日是星期日或星期一；还有一些国家/地区（或者至少不久前还有）一周从星期六开始，因此星期列表的第一行可能不同。此应用程序无需检查其启动国家/地区的传统；如果你需要更改起始日，只需将第一行移到列表底部，反之亦然。\n\
  \n假设你想要在视觉上（通过字体和颜色）区分工作日和周末。在许多国家/地区，有五个工作日，而在其他国家/地区，人们每周工作六天。这些都是常规情况，但也可能有个人要求。你可能按照特殊的时间表工作，只有两个、三个或四个工作日；你可能某几天的早上有课，而另外几天晚上有课。对于所有这些情况，你都可以为此组组织一个特殊的视图。图\
  \ 5-28 展示了几种变体，但可能还有许多其他变体。所有更改都可在数秒内完成，并且可以在任何需要的时候进行。即使你决定将星期五放在星期二和星期三之间，这也是允许的。\n\
  \n![../images/501148_1_En_5_Chapter/501148_1_En_5_Fig30_HTML.jpg](img/501148_1_En_5_Fig30_HTML.jpg)\n\
  \n**图 5-28** 通过更改单选按钮的参数、更改其中某些按钮中圆圈和文本的相对位置以及更改按钮的顺序，组织了同一组的几种视图\n\n巧合的是，在该组的所有四种变体中，按钮都排列在一列中。当然，组内按钮的位置没有任何限制，并且每个圆圈-文本对内的相对位置也有多种变体。图\
  \ 5-29 在本示例的另一个组中展示了这一点。\n\n![../images/501148_1_En_5_Chapter/501148_1_En_5_Fig32_HTML.jpg](img/501148_1_En_5_Fig32_HTML.jpg)\n\
  \n**图 5-29b** 左列的按钮关联自然图片，而右列的按钮关联建筑\n\n![../images/501148_1_En_5_Chapter/501148_1_En_5_Fig31_HTML.jpg](img/501148_1_En_5_Fig31_HTML.jpg)\n\
  \n**图 5-29a** 两列的按钮分别代表北美和欧洲\n\n\n\n该组共有七个按钮。选择一个按钮会显示关联的图片；这是我作为开发者必须提供的内容。无论用户如何调整该组及其按钮，此选择功能都必须正常工作。该组按钮的默认位置（如图\
  \ 5-27 所示）类似于世界地图上对应地点的位置。用户可以根据完全不同的理念重新组织该组。例如，图 5-29a 中的两列按钮分别关联了来自北美和欧洲的图片。在图\
  \ 5-29b 的变体中，左侧的按钮打开自然景色的图片，而右侧的按钮显示建筑物的图片。中间放置了一个按钮，因为虽然缺少建筑物，但主要元素是道路。\n\n即使通过如此简单的示例，我也试图强调用户驱动应用的一个核心理念。程序员只负责应用程序的正确运行，因此每个单选按钮在被选中时，无论程序视图发生任何变化，都必须显示关联的照片。程序的呈现方式则由用户决定。\n\
  \n组参数的调节有两种不同方式。移动性及其他一些通用属性通过上下文菜单中的命令来调节，而所有可见性参数则可在特殊的配置表单（如图 5-29 所示）中更改。`Group_RadioButtons`\
  \ 类的设计与 `Group_ArbitraryElements` 类类似，因此它们的配置表单以相似的方式设计也就不足为奇了。\n\n![../images/501148_1_En_5_Chapter/501148_1_En_5_Fig33_HTML.jpg](img/501148_1_En_5_Fig33_HTML.jpg)\n\
  \n图 5-30\n\n`Group_RadioButtons` 的配置\n\n## 结论\n\n本章讨论了最常用控件的图形化对应物。在将讨论焦点从元素转向用户驱动应用的整体设计之前，让我们先审视一些真正复杂且常用的元素的设计。\n\
  \n"
- "# 6. 数据可视化元素\n\n分析那些由参与不同运动的部件构成、且具有许多需要调节的特性的复杂对象的设计，是颇有裨益的。金融应用中使用的某些对象最适合用于此类讨论。\n\
  \n屏幕对象的可移动性可以应用于许多不同领域的程序中，但有一条通用规则：开发者能够预先决定的应用程序未来所需视图越小，转向用户驱动应用的优势就越大。在下一章中，我将通过从一个功能有限的简单程序，过渡到用户工作场景完全无法预测的应用来阐述这一规则。\n\
  \n假设某个应用程序获取了一些需要以不同方式展示的数据。数据可视化只是分析前的预备步骤，但根据所使用的可视化方式，它可能隐藏或完美地展示数据中隐含的某些特征，因此分析结果在很大程度上取决于数据的视图。这不仅取决于视图本身，还取决于数据视图与特定用户的期望和偏好的契合度。由于流行应用拥有大量用户，开发者无法为每个用户提供最佳的视图。用户驱动应用的主要目标并非为所有人准备最佳视图（这不可能实现），而是提供一种易于使用的工具，使每个用户都能以最符合自身偏好和优势的方式查看数据。\n\
  \n从过去几个世纪到现代，科学家们是如何分析数据的？研究人员在纸上绘制图表，然后查看这些纸张，试图理解图表背后的过程。可以是一张纸一个图表，也可以是一张纸上多组图表。图表的大小可以不同；线条的样式、颜色和类型也可以各异。数据可能非常庞大，而分析结果往往取决于纸张的摆放方式，邻近图表的视图能为后续分析提供线索。当你将纸张替换为电脑屏幕时，并没有任何本质上的创新。你拥有图表区域和线条，但失去了在桌面上随意但以最优方式绘制线条和摆放纸张的简便性，取而代之的是一套必须学习的命令系统，以及在屏幕上看图表时面临的诸多限制。通常（几乎总是如此），你能同时看到的绘图区域数量有限，图表的定位和视图也受到限制。科学家们始终不得不在应用开发者们认为已足够满足研究需求的界限内工作。\n\
  \n数据可视化应用于众多领域。我对屏幕对象可移动性的研究，正是受科学与工程应用领域的需求所启发。在这个广阔的领域中，最常用的是带刻度的矩形图形区域；这类图表的讨论将在下一章中展开。金融和经济领域的研究与分析不仅涉及同样的标准图表类型，还涉及特殊的数据视图。对我来说，将可移动性应用于一些我原本永远不会接触的屏幕对象是一件有趣的事。我无意设计金融领域使用的所有不同类型图表的可移动版本，因此这里仅讨论两个流行的元素：柱状图和饼图。我的另一本书\
  \ [2] 对两者均有详细论述。在此需要强调的是，无论新旧书中的示例存在多少相似之处，这些示例中使用的类是不同的。\n\n\n\n## 条形图\n\n- 文件：`Form_BarChart.cs`\n\
  - 菜单位置：复杂对象 ➤ 条形图\n\n通常，条形图包含一个用于绘图的矩形区域和一对刻度（图 6-1）。\n\n![../images/501148_1_En_6_Chapter/501148_1_En_6_Fig1_HTML.jpg](img/501148_1_En_6_Fig1_HTML.jpg)\n\
  \n图 6-1\n\n具有不同条形方向的 `BarChart_Adh` 类对象\n\n数据可以以不同方式展示，但最常见的是带有彩色条形的情况。条形的长度可以由数据决定从而固定不变，也可以是可变的。在某些版本中，条形可以通过两端进行改变，但最流行的是条形基于绘图区域某一边界的情况，而条形的另一端可以移动。条形沿着带数字的刻度拉伸；这使得估算更加容易。正交刻度包含对主要区域不同部分（分段）的文字说明。主绘图区域和刻度可以与注释相关联。图\
  \ 6-2 更好地展示了一个单独的 `BarChart_Adh` 对象。通常情况下，每个刻度的主刻度线正好位于绘图区域的边界上（图 6-1），但为了更好地查看某些细节，图\
  \ 6-2 中的一个刻度被稍微移开了一些。\n\n![../images/501148_1_En_6_Chapter/501148_1_En_6_Fig2_HTML.jpg](img/501148_1_En_6_Fig2_HTML.jpg)\n\
  \n图 6-2\n\n带有刻度的条形图\n\n在第 3 章中，我们讨论了一个由带有刻度的矩形绘图区域组成的对象。我们还讨论了当刻度沿边界放置时，它们会遮挡主要区域角节点所导致的调整大小问题；该问题通过使用一个额外的不可见元素来解决，该元素在绘图区域的四个角上放置了圆形节点。`BarChart_Adh`\
  \ 类也存在同样的问题，并通过使用 `RectCorners_Adh` 类的额外元素以相同方式解决。\n\n条形图是一个复杂对象，由不同部分组成，并拥有大量可调参数。刻度本身也是复杂对象，具有大量可调节参数。带数字的刻度属于\
  \ `Scale_Numbers` 类；带文字的刻度属于 `Scale_Texts` 类；而注释，无论它们是与主绘图区域还是与某个刻度一起使用，都属于 `CommentToRect`\
  \ 类。\n\n```\npublic class BarChart_Adh : GraphicalObject\n{\nPointF [] ptsCorner;\n\
  RectCorners_Adh rectCorners;\nbool bResizable = true;\nScale_Texts scaleTexts;\n\
  Scale_Numbers scaleNumbers;\nTextsDrawingDirection dirDrawing;\nSide sideBase; \
  \        // 所有条形不可移动边所在的矩形边\nList m_comments = new List ();\n```\n\n所有注释、刻度和主要区域的可见性参数都通过辅助调谐窗体进行修改。通常，一个更复杂的对象拥有更多可调节参数，因此需要具有更多元素的更复杂的调谐窗体。所有这些调谐窗体都由普通控件的图形模拟构件构成，因此你会反复看到前一章讨论过的相同元素。用户驱动应用程序的规则必须在所有级别应用，因此调谐窗体内部的所有元素也是可调谐的；它们的调谐窗体也在前一章中讨论过。\n\
  \n这种元素系统，其调谐窗体又由拥有自身调谐窗体的元素构成，听起来像是一个难以理解和记忆的复杂系统。实际上，它很简单，因为一切都基于几条简单的设计规则。\n\n\
  - 任何元素都是可调谐的。\n- 调谐从来不是强制性的，并且总是只在用户请求时启动。\n- 所有调谐结果都会被保存，并在你下次启动应用程序或再次调用调谐窗体时恢复。\n\
  \n本章中的示例并非真正的应用程序（这将是下一章示例的情况），但这些示例是像真实应用程序一样开发的。这意味着屏幕每个元素的任何参数都受用户控制。用户无需阅读和学习每个新示例的说明，因为它们对所有示例都是相同的。\n\
  \n条形图是一个拥有大量可调谐参数的复杂对象，但移动/调整条形图大小确实很简单。主要区域是一个矩形，可以通过任意内部点移动，并通过其边界调整大小；其覆盖层很简单，与第\
  \ 3 章中讨论的绘图模拟相同。任何刻度都是一个不可调整大小的矩形，因为其大小只能随着主绘图区域调整大小而间接改变。一个不可调整大小的矩形对象拥有最简单的覆盖层，仅由一个矩形节点组成。此外，刻度只能正交于其主刻度线移动。所有移动都与绘图模拟示例中讨论的相同。当前条形图示例中令人感兴趣的不是覆盖层设计或移动，而是这个示例的整体设计，包括所有调谐窗体和菜单。\n\
  \n菜单可以在示例的任何位置调用，无论该位置是元素还是空白处。如果在元素上调用菜单，则第一个命令允许你为按下的元素调用调谐窗体。（菜单将在本节后面显示和讨论。）带文字的刻度在设计上比带数字的刻度简单，因此让我们从较简单的对象开始。\n\
  \n图 6-3 展示了一个 `Scale_Texts` 对象及其调谐窗体；这样的定位使解释和理解更加容易。\n\n![../images/501148_1_En_6_Chapter/501148_1_En_6_Fig3_HTML.jpg](img/501148_1_En_6_Fig3_HTML.jpg)\n\
  \n图 6-3\n\n`Scale_Texts` 对象及其调谐窗体\n\n刻度由三部分组成：主刻度线、主刻度线一侧标示分段边界的刻度标记，以及与分段相关的文字。线条和文字的绘制基于完全不同的、不相关的参数，因此它们的调谐在两个不同的组内进行组织。\n\
  \n主刻度线、刻度标记和文字可以以任何组合出现，仅禁止所有三者同时消失；因此，程序不允许你同时关闭所有三个复选框。如果需要隐藏刻度，则通过其菜单命令来完成。\n\
  \n**线条**组中的调谐。主刻度线和刻度标记始终具有一个像素的宽度，并以相同颜色显示。刻度标记可以出现在主刻度线的任一侧；所有刻度标记的长度相同，取值范围为\
  \ [3, 20]。\n\n**文字**组中的调谐。文字以相同的字体和颜色显示。\n\n\n\n“文本样本（Sample for texts）”是一种特殊元素，允许你对齐和旋转所有文本。该对象由一条短线段和一个`SAMPLE`单词构成。（图\
  \ 6-3 展示了水平刻度的调谐表单；对于垂直刻度，你会看到一个几乎相同的表单，但配有一条用于样本的垂直线段。）刻度上的每个文本都定位到对应区段的中心点；在调谐表单中，该中心点由短线段中间的蓝色点标记。`SAMPLE`单词代表文本。在第\
  \ 2 章关于注释的示例中，曾解释过任意文本的九个特殊点。同样的九个点也标记在`SAMPLE`上。当前用于对齐和作为旋转中心的点显示为红色；其余八个点为紫色。这对元素——线段\
  \ + `SAMPLE`——可以通过移动短线段来同步移动。当`SAMPLE`被移动或旋转时，刻度上的所有文本都会以相同方式移动和旋转。通过点击`SAMPLE`上的某个特殊标记，你可以更改所有刻度文本的对齐和旋转中心。\n\
  \n沿刻度分布的文本长度各不相同，且与`SAMPLE`的长度不同。当你在`SAMPLE`上选择另一个基点时，该单词本身不会移动，只有两个小点互换颜色。与此同时，沿刻度的所有文本也会发生相同的基点变化，但由于文本长度不同，并且它们从`SAMPLE`复制了基点与锚点之间的偏移，因此沿刻度的所有文本都会随之移动。将文本沿刻度定位的最佳方法是移动和旋转`SAMPLE`单词，同时观察文本的位置。\n\
  \n在本节稍后部分，我将演示一个用于准备新条形图的辅助表单。该表单为刻度文本提供了几种变体，但实际的条形图可能需要其他文本。在刻度调谐表单中，你会看到当前使用的文本列表以及一个用于输入所需文本的文本框。选择你想要更改的文本，输入新文本，然后按`Enter`键。\n\
  \n图 6-4 展示了一个`Scale_Numbers`对象及其调谐表单，该表单比用于带文本刻度的调谐表单复杂得多。\n\n![../images/501148_1_En_6_Chapter/501148_1_En_6_Fig4_HTML.jpg](img/501148_1_En_6_Fig4_HTML.jpg)\n\
  \n*图 6-4*  \n*垂直`Scale_Numbers`对象的调谐表单*\n\n这里的`Lines`（线条）组更复杂。除了主线之外，还有显示在主线一侧的主刻度线和子刻度线。三个不同的部分——主线、主刻度线和子刻度线——是独立显示的，因此有三个复选框来控制它们的显示。相邻主刻度线之间的子区间数量可以更改；子刻度线的数量比子区间数量少一。主刻度线和子刻度线的长度可单独调节，但在这两者中，主刻度线的长度总是更大。主线、主刻度线和子刻度线始终以同一种颜色显示，并且所有线条的宽度始终为一个像素。\n\
  \n`Values`（数值）组是导致此调谐表单复杂性的主要原因。出于绘图（和调谐）的目的，所有数字被分为三组，其中两组代表边界值，第三组代表所有内部值。这三个组的数字是独立调谐的；它们可以以任意组合出现，也可以完全不出现；这由三个复选框控制。\n\
  \n内部值的数量由相邻数值之间的步长决定，或者由与数值对应的所需内部线条数量决定。在后一种情况下，程序要么使用声明的数量，要么略微增加该数量以提供更规整的步长，这对于视觉评估更有利。（如果你不喜欢对刻度线数量提出的更改，可以设置所需的步长值。）\n\
  \n如果边界上的值与最近的内部值略有差异，则屏幕上的两个数字可能会重叠，从而难以阅读。一种解决方案是关闭边界值的显示。另一种解决方案是将边界值调整到网格步长；可以对两个端点值独立进行此操作。\n\
  \n`Values`组内的几个按钮允许你更改显示数字的字体和颜色、交换端点值，以及更改所有数字的显示格式。\n\n条形图上的菜单允许你将选中的对象按一个方向或另一个方向旋转\
  \ 90 度。每次旋转都会将垂直刻度转换为水平刻度，反之亦然。这种带文本刻度的转换只需要对其调谐表单进行最小的更改，即只需更改`Lines`组中辅助线的方向（参见图\
  \ 6-3）。带数字刻度的调谐表单则需要更多更改，因为现在需要调谐的是左值和右值，而不是顶部和底部的值。此外，设置一个良好的调谐表单默认视图也更为适宜，这样不会让用户感到困惑，并能清晰地指示被调谐刻度的方向。因此，水平数字刻度的调谐表单具有相同的一组元素，但默认视图不同（图\
  \ 6-5）。\n\n![../images/501148_1_En_6_Chapter/501148_1_En_6_Fig5_HTML.jpg](img/501148_1_En_6_Fig5_HTML.jpg)\n\
  \n*图 6-5*  \n*水平`Scale_Numbers`对象的调谐表单*\n\n`Lines`组内的三个复选框控制线条的显示；`Values`组内的三个`Show`复选框控制沿刻度数字的显示。将这六个复选框切换为\
  \ ON/OFF，可以选择你希望看到的精确部分。唯一被禁止的组合是所有六个复选框都处于 OFF 模式，因此表单不允许你这样操作；其他所有组合都是可能的。\n\n\
  调谐表单的默认视图（图 6-4 和 6-5）看起来有点复杂，并占据了宝贵的屏幕空间的一大部分，但用户并非被迫只处理这些表单的默认视图。假设你设置了首选的主刻度线和子刻度线长度、首选的子区间数量以及沿刻度数字所需的显示外观。如果你在近期内不需要调谐这些参数，你可以隐藏调谐表单的许多元素，只将你真正需要的元素留在视图中。图\
  \ 6-6 中的红色椭圆标记了可以通过其菜单隐藏的元素。我想强调一下，你并非必须隐藏全部或全部不隐藏；你可以隐藏这 13 个标记元素中的任意组合，但如果你将它们全部隐藏，那么原始调谐表单（图\
  \ 6-5）可以缩小为更小的东西（图 6-7）。该调谐表单是根据用户驱动应用程序的标准规则设计的。如果有任何内容被隐藏，可以通过上一级菜单将其显示出来，因此`Lines`组的元素可以通过该组的菜单显示。`Left`（左）、`Inner`（内部）和`Right`（右）组的元素可以通过相应组的菜单显示，而`Values`组的所有元素则可以通过其菜单显示。\n\
  \n![../images/501148_1_En_6_Chapter/501148_1_En_6_Fig7_HTML.jpg](img/501148_1_En_6_Fig7_HTML.jpg)\n\
  \n*图 6-7*  \n*同一调谐表单的不同视图*\n\n![../images/501148_1_En_6_Chapter/501148_1_En_6_Fig6_HTML.jpg](img/501148_1_En_6_Fig6_HTML.jpg)\n\
  \n*图 6-6*  \n*标记的元素可以通过其菜单命令隐藏。*\n\n\n\n我们已经完成了两种刻度尺的调优，现在可以来看条形图主体区域的调优（图 6-8）。令人惊讶的是，它看起来可能比某些刻度尺的调优更简单。\n\
  \n![../images/501148_1_En_6_Chapter/501148_1_En_6_Fig8_HTML.jpg](img/501148_1_En_6_Fig8_HTML.jpg)\n\
  \n**图 6-8** *条形图主体区域调优*\n\n-   绘图区的框架以及来自两个刻度尺的网格是独立但以类似方式调优的。每个元素都可以选择显示或不显示；如果显示，则可以选取线的颜色和样式。网格线的位置由刻度尺上刻度线的位置决定，但刻度线和网格的外观是独立的，并且通过不同的调优表单进行调节。\n\
  -   背景的调优采用标准方式，与之前为不同分组和控件展示的方式相同（图 4-2、5-9 和 5-30）。\n-   “颜色与填充”分组允许您调节主体区域被条形填充的方式，并选择条形颜色。该分组内部水平条形的左右端点可以移动，从而改变条形图每个分段的填充。作为一名研究人员，我更喜欢分段之间留有一定间距的条形图，所以我总是将这个水平条形的端点从极端位置向中心移动。是移动一端还是两端，以及移动多少，通常取决于特定条形图的填充情况。\n\
  \n该分组内的另一个区域包含条形颜色的样本。样本数量不能少于数据集数量，但可以更多；颜色从左端开始使用。可以通过在该区域内直接移动样本，并将抓住的样本拖放到其他位置来改变顺序。也可以更改任何样本的颜色（从而更改关联条形的颜色）。为此，您需要在样本上调用菜单。同样的菜单允许您删除已按下的样本，但前提是样本数量超过条形图中的数据集数量。要添加更多颜色，请在样本区域内的空白位置调用菜单。如果您想在不改变现有顺序的情况下添加更多颜色，请在最后一个样本的右侧调用菜单来添加新颜色。\n\
  \n调优表单处理可见性参数，从而改变屏幕上对象的外观；其他参数则通过菜单命令来更改。每种使用的元素类别都有对应的菜单，空白位置也有菜单（图 6-9d）。绘图区的菜单拥有最多的命令（图\
  \ 6-9a）。刻度尺属于不同的类别，但它们的菜单是相同的（图 6-9b）。最简单的元素——注释——拥有最简单的菜单（图 6-9c）。可以在信息区域调用的菜单只包含一条启动该区域调优的命令，因此我决定甚至不展示这个极小的菜单。\n\
  \n![../images/501148_1_En_6_Chapter/501148_1_En_6_Fig12_HTML.jpg](img/501148_1_En_6_Fig12_HTML.jpg)\n\
  \n**图 6-9d** *空白位置菜单*\n\n![../images/501148_1_En_6_Chapter/501148_1_En_6_Fig11_HTML.jpg](img/501148_1_En_6_Fig11_HTML.jpg)\n\
  \n**图 6-9c** *注释菜单*\n\n![../images/501148_1_En_6_Chapter/501148_1_En_6_Fig10_HTML.jpg](img/501148_1_En_6_Fig10_HTML.jpg)\n\
  \n**图 6-9b** *刻度尺菜单*\n\n![../images/501148_1_En_6_Chapter/501148_1_En_6_Fig9_HTML.jpg](img/501148_1_En_6_Fig9_HTML.jpg)\n\
  \n**图 6-9a** *绘图区菜单*\n\n对于经济和金融程序的专业人员来说，本示例中使用的一些菜单命令可能看起来有点奇怪，这些命令的出现有两个原因。首先，我更熟悉科学应用的需求，许多命令就是直接从那个领域复制过来的。我在为科学/工程应用开发类系统上花了很多时间。这些类将在下一章中演示，但绘制\
  \ `Y(x)` 函数和条形图之间存在很多相似性，因此一些参数和相关命令从一个领域复制到了另一个领域。其次，我使用当前示例来检查所涉及的类及其特性。\n\n注释上的菜单会调用一个标准调优表单来修改被按下的注释。该菜单还允许您固定/取消固定被按下的注释，隐藏它，或删除它。每个注释都可以通过同一个菜单的命令进行固定或取消固定，但对于已固定的注释，第二个命令的文本会有所不同。无法在隐藏元素上调用菜单，因此隐藏的注释可以通过其父级菜单（可以是刻度尺或条形图主体区域）来显示。\n\
  \n刻度尺上的菜单允许您隐藏、显示和删除注释；这三个命令会同时应用于与该刻度尺关联的所有注释。对于带有数字的刻度尺，数字和注释之间存在明显区别；对于带有文本的刻度尺，区别不那么明显，因为所有内容都显示为文本，并且可以使用相同的字体和颜色。区别在于调优和移动。文本在刻度尺调优表单中同步调优和移动，而注释则通过另一个调优表单单独修改。当点击“添加注释”命令时，会使用相同的表单。\n\
  \n“翻转刻度尺”命令存在一个有趣的情况。想象一条平行于刻度尺主线并穿过绘图区中心点的直线。“翻转刻度尺”命令必须将刻度尺镜像到这条线的另一侧。对于刻度尺线和刻度线来说，这很容易实现，但文本（和数字）会出现问题。还记得您试图理解展窗中镜像文本的尝试吗？我们没有学过阅读这类文本，并且当刻度尺翻转时，我们期望看到正常的文本，但这样某些参数就必须改变。当刻度尺翻转时，文本的原始矩形区域被镜像，文本会以使其可读的方式绘制在新的矩形内。对于任何刻度尺翻转，所有文本的角度和基准点都会改变（图\
  \ 6-10 和 6-11）。对于严格水平的文本，其角度不变，但在任何其他情况下，阅读方向（从上到下或从下到上）会变为相反方向。\n\n![../images/501148_1_En_6_Chapter/501148_1_En_6_Fig14_HTML.jpg](img/501148_1_En_6_Fig14_HTML.jpg)\n\
  \n**图 6-11** *水平刻度尺的翻转*\n\n![../images/501148_1_En_6_Chapter/501148_1_En_6_Fig13_HTML.jpg](img/501148_1_En_6_Fig13_HTML.jpg)\n\
  \n**图 6-10** *垂直刻度尺的翻转*\n\n让我们来看看本例中最大的菜单——条形图菜单（图 6-9a）。\n\n\n\n| *将条形图保存到文件* |\
  \ 该命令与另一命令配合使用，后者可在空白区域菜单中找到。当你处理大量图表时，总有可能在某些时刻看到的图表数量超出预期。你不想丢失之后可能需要的图表，因此必须有一种方法，通过将图表保存到某个存储中（可随时从中恢复），从而删除图表。针对这种额外存储和临时从屏幕移除的问题，有不同解决方案；其中一种方案在下一章将要讨论的函数查看器（Function\
  \ Viewer）程序中演示。在当前示例中，演示了一种简单解决方案。使用此命令，被点击的条形图可以保存到一个二进制文件中。不需要的条形图可通过同一菜单的另一命令删除（图\
  \ 6-9a）。之后，可在任意空白位置调用另一个菜单，并通过该菜单中的命令从文件中恢复条形图（图 6-9d）。 |\n\n![../images/501148_1_En_6_Chapter/501148_1_En_6_Fig16_HTML.jpg](img/501148_1_En_6_Fig16_HTML.jpg)\n\
  \n**图 6-13** 绘制方向的改变会影响带文本的刻度以及条形图的外观\n\n| *数字刻度*/*文本刻度* | 两个命令用于控制刻度的可见性。 |\n|\
  \ *翻转绘制方向* | 图 6-13 演示了此命令的效果，它仅影响主绘图区域和带文本的刻度，但影响方式不同。条形图围绕绘图区域的中心线镜像翻转。文本必须与相同的区段关联，因此文本的位置也围绕同一条线镜像翻转，但文本的角度不变。准备此图时，让我有机会演示前一个命令的用法，通过该命令可以隐藏或显示刻度。改变绘制方向不影响数字刻度，因此在翻转绘制方向后，我简单地关闭了它的可视化显示。\
  \ |\n\n![../images/501148_1_En_6_Chapter/501148_1_En_6_Fig15_HTML.jpg](img/501148_1_En_6_Fig15_HTML.jpg)\n\
  \n**图 6-12** 原始条形图逐步顺时针旋转。通过逆时针旋转可以获得相同的视图，但顺序不同\n\n| *可更改的条形* | 复选框指示条形图是否可以直接更改。稍后我将演示一个辅助表单，在其中组织新的条形图。在该表单中，任何条形都可以更改，并且在此过程中会显示条形的值，因此可以精确设置数值。在当前示例的主表单中，没有包含条形值的指示，尽管添加起来很容易。条形图可以通过绘图区域的任意点在屏幕上移动。有可能出现这种情况：当用户在主矩形区域内按下时，可能会按到某个条形的可移动末端，从而启动不必要的更改。为避免这种情况，用户可以将条形切换为不可更改模式。此命令仅应用于被点击的条形图。如果需要为所有条形图设置相同模式，则必须在空白区域调用的菜单中添加类似命令。\
  \ |\n| *逆时针旋转*/*顺时针旋转* | 两个命令用于旋转条形图。图 6-12 演示了顺时针旋转，尽管相同的图形可以重新排序，然后它们将演示逆时针旋转。原始条形图（左图）的文本可以是水平、垂直或倾斜的。在后续的旋转步骤中，部分文本的阅读效果不佳，并且在每一步旋转中，如何调整它们以获得更好的视图是显而易见的。是否可以将这类改进包含到`BarChart_Adh.Rotate()`方法中？可以，这很容易做到，但这将是一个巨大的错误，我不打算这样做。用户驱动应用程序的规则\
  \ 3 指出：“用户关于移动和调整大小的命令……必须完全按照原样执行；不允许开发人员添加或扩展解释。”如果你想展示在旋转后改进条形图的技巧，可以通过添加另一个命令如“带调整的旋转”来实现。然后用户可以尝试两种变体，比较结果，并选择自己偏好的那种。选择将完全是用户自己的决定，对应用程序的控制权仍将掌握在用户手中。不要试图强迫用户使用他们未曾要求的功能。\
  \ |\n\n条形图菜单上的其余命令不言自明，无需解释。让我们来看一下空白位置菜单中的一些命令（图 6-9d）。\n\n![../images/501148_1_En_6_Chapter/501148_1_En_6_Fig18_HTML.jpg](img/501148_1_En_6_Fig18_HTML.jpg)\n\
  \n**图 6-15** 准备新的条形图\n\n![../images/501148_1_En_6_Chapter/501148_1_En_6_Fig17_HTML.jpg](img/501148_1_En_6_Fig17_HTML.jpg)\n\
  \n**图 6-14** 关于条形图区域当前尺寸和位置的临时信息\n\n\n\n| *显示移动区域尺寸* | 用户可以移动和调整条形图的大小；在此过程中，任何区域的确切尺寸和位置并不重要。但正如我之前提到的，此示例中的某些命令是直接从科学应用程序中复制而来的，因此对这些命令的需求也源于此。科学家们经常将屏幕图像作为插图放入他们的文章中。为了获得所需图形的最佳视图，他们希望绘图区域具有特定的尺寸或比例，或者希望在不产生任何不必要偏移的情况下，将多个相同尺寸的图表并排放置。有些人看不到微小的偏移，而另一些人则能轻易捕捉到哪怕一个像素的偏移并因此感到烦恼。为了便于准备图形，我添加了临时显示当前正在移动或调整大小的绘图区域尺寸的功能（图\
  \ 6-14）。在应用程序的正常使用中，并不需要这些信息，因此其显示通过菜单命令进行控制。 |\n| *临时信息的字体* | 此命令是对上一个命令的补充。每当用户想要更改某个对象的字体时，就在该对象上调用菜单，菜单中的相应命令允许使用标准字体选择对话框。在按下鼠标选择条形图的瞬间，会显示一个包含尺寸和位置信息的小区域，当鼠标释放时，该区域消失。因此，无法按下这个临时信息来更改其字体。空白处的菜单命令允许您为此临时信息选择字体，但选择的结果仅在下次按下条形图时才能看到。\
  \ |\n| *添加条形图* | 此命令允许您组织一个新的条形图，这将在辅助窗口 `Form_NewBarChart.cs` 中完成（图 6-15）。此窗口允许您设置主要的重要参数：数据集数量、分段数量以及所有条形的值。任何条形的值都可以通过移动其顶部来更改；在此移动过程中，[0,\
  \ 1] 范围内的当前值会显示在移动线条旁边的一个小区域内。刻度的文本选择有限。仅使用标准颜色，并且可以选择第一个颜色。 |\n\n新条形图是否不需要拥有完整调谐就足够了呢？是的，因为这是一个辅助窗口，用于准备所需条形图的草图。当您单击“确定”按钮时，主窗口中会出现一个新的条形图，新条形图可以像其他任何条形图一样进行调谐。\n\
  \n出于同样的原因，此辅助窗口中的条形图区域和唯一可见的刻度是不可调谐的，而此窗口中的所有其他元素都可以修改。\n\n### 饼图\n\n- 文件：`Form_PieChart.cs`\n\
  - 菜单位置：复杂对象 ➤ 饼图\n\n在第 3 章中，我们已经讨论了带两种注释类型的圆形。一种注释类型与整个圆形关联；此类注释仅对圆形的大小调整做出反应，忽略圆形的旋转，而它们在屏幕上的移动不受任何限制。圆形被划分为扇区，其他注释则与这些扇区关联。该类注释中的每个元素都放置在关联扇区的角平分线上，并且只能沿着该线移动。当前部分讨论的\
  \ `PieChart_Adh` 类的元素具有类似的设计。对扇区注释的这种移动限制并非强制性的；在我的另一本书[2]中，我演示了 `PieChart` 类，其中扇区注释可以在屏幕内自由移动。当前示例的饼图（图\
  \ 6-16）与第 3 章中讨论的带注释的圆形类似，但它们在扇区注释方面的行为略有不同。\n\n![../images/501148_1_En_6_Chapter/501148_1_En_6_Fig19_HTML.jpg](img/501148_1_En_6_Fig19_HTML.jpg)\n\
  \n图 6-16\n\n`PieChart_Adh` 类的对象\n\n```\npublic class PieChart_Adh : GraphicalObject\n\
  {\nPointF m_center;\nfloat m_radius;\nDrawingDirection dirDrawing;\nbool bResizable,\
  \ bRotatable, bMovablePartitions;\nList m_clrs = new List ();      // 每个扇区一种颜色\n\
  CommentToPieChartSector [] commentsForSectors;\nList commentsForCircle = new List\
  \ ();\n```\n\n饼图是一个复杂对象，由主导的圆形部分和从属的两种不同类型注释组成。默认情况下，主要部分是可调整大小、可旋转且分区可移动的，但所有这些属性都可以通过菜单命令轻松调节。无论注释类型如何，每个注释都可以围绕其中心点旋转。\n\
  \n-   与整个圆形关联的注释称为*通用注释*。这些是 `CommentToCircle` 类的元素。任何饼图都可以关联任意数量的通用注释。当圆形移动时，此类注释会同步移动；当圆形调整大小时，它会保持其相对位置；并且它会忽略圆形的旋转。\n\
  -   `CommentToPieChartSector` 类的注释与扇区关联；每个扇区都有一个此类注释。此类注释的中心点位于关联扇区的角平分线上，并且注释只能沿此线移动。扇区注释不会同步移动，但可以通过使用菜单命令将它们放置在相同的距离上。\n\
  \n两种类型的注释都是纯文本字符串，因此只能更改其字体、颜色和文本内容。这些操作在一个小巧的辅助窗口中进行，该窗口对两种注释类型都是相同的。从视觉上看，这两种类型的注释是无法区分的，但它们的菜单中有不同的命令集。\n\
  \n通用注释可以被修改、隐藏或删除。\n\n扇区注释可以隐藏但不能删除，因为此类注释的数量始终等于扇区的数量。这种类型的注释可以通过多种不同的方式显示。\n\n\
  饼图关联着某个通过扇区分配的值，因此每个扇区都与一个较小的值以及占总额的百分比相关联。扇区上的注释可以包含纯文本、值和百分比的组合；有选项可以将它们显示在一行或两行中。所有变体如图\
  \ 6-17 所示，从带有注释“January”的黄色扇区开始，按逆时针方向排列。\n\n![../images/501148_1_En_6_Chapter/501148_1_En_6_Fig20_HTML.jpg](img/501148_1_En_6_Fig20_HTML.jpg)\n\
  \n图 6-17\n\n扇区注释的不同视图\n\n\n\n### 排版后的内容\n\n虽然一般评论的数量没有限制，但我怀疑此类评论不会超过一个。另一方面，扇区评论的数量至少是两个（扇区的最小数量），但也可能非常大。每条评论都可以单独修改，但用户也有可能希望将某个扇区评论的参数传播到其所有同级评论；这可以通过菜单完成。\n\
  \n一般评论和扇区评论看起来相似；它们都可以移动和旋转，但为了正确组织所有这些移动，只需在 `OnMouseDown()` 方法中提及它们的某个类。为什么？一般评论属于\
  \ `CommentToCircle` 类，该类派生自 `TextRotatable` 类。移动器知道如何移动和旋转该类的元素，无需任何指令。另一方面，扇区评论属于\
  \ `CommentToPieChartSector` 类，该类并非派生自 `TextRotatable` 类，因此必须调用 `CommentToPieChartSector.Press()`\
  \ 方法。\n\n```\nprivate void OnMouseDown (object sender, MouseEventArgs e)\n{\nptMouse_Down\
  \ = e .Location;\nif (mover .Catch (e .Location, e .Button))\n{\nGraphicalObject\
  \ grobj = mover .CaughtSource;\n... ...\nelse if (grobj is CommentToPieChartSector)\n\
  {\nsectorcmntPressed = grobj as CommentToPieChartSector;\nsectorcmntPressed .Press\
  \ (e .Location, e .Button, iNode);\n}\n... ...\n```\n\n图 6-18 显示了 `PieChart_Adh`\
  \ 对象的调整表单。颜色可以单独更改，也可以全部一起更改。要进行单独更改，您必须在特定颜色样本上调用菜单，然后使用标准对话框。您还可以通过将任何样本移动到其他位置来更改颜色的顺序。样本只能在带框的矩形区域内移动，但该区域本身大小可调，因此如果您需要处理大量颜色（如图\
  \ 6-16 中最大的饼图那样），可以轻松放大该区域。样本数量可以大于扇区数量，但实际使用的颜色始终从左侧开始选取。\n\n![../images/501148_1_En_6_Chapter/501148_1_En_6_Fig21_HTML.jpg](img/501148_1_En_6_Fig21_HTML.jpg)\n\
  \n图 6-18\n\n饼图的调整表单\n\n“颜色”组内的两个按钮允许您同时更改所有颜色。一个按钮设置颜色的彩虹顺序；如果需要超过七种颜色，则会重复使用。另一个按钮设置颜色从左样本到右样本的平滑变化。\n\
  \n“扇区文本”组同时处理所有扇区评论。可以为值和百分比选择不同的格式，这些值和百分比会显示在评论中。两个复选框允许您调整扇区评论的角度。\n\n当组织一个新的饼图时，其所有扇区评论都是水平的（图\
  \ 6-19a），并且位于与圆心相同距离的位置。每条评论都可以单独移动和旋转（图 6-19b）。默认情况下，扇区评论的角度在整个饼图旋转过程中是固定的；图 6-18\
  \ 中的“旋转时固定角度”复选框显示为选中状态，这会自动禁用另一个复选框。当评论角度在整个旋转过程中固定时，每条评论都保持其角度，无论扇区位置如何（图 6-19c）。因此，图\
  \ 6-19b 到 6-19c 的变化是当扇区评论的角度固定时旋转的结果。\n\n![../images/501148_1_En_6_Chapter/501148_1_En_6_Fig25_HTML.jpg](img/501148_1_En_6_Fig25_HTML.jpg)\n\
  \n图 6-19d\n\n每个评论的角度随饼图角度同步变化\n\n![../images/501148_1_En_6_Chapter/501148_1_En_6_Fig24_HTML.jpg](img/501148_1_En_6_Fig24_HTML.jpg)\n\
  \n图 6-19c\n\n饼图已旋转\n\n![../images/501148_1_En_6_Chapter/501148_1_En_6_Fig23_HTML.jpg](img/501148_1_En_6_Fig23_HTML.jpg)\n\
  \n图 6-19b\n\n评论已移动和旋转\n\n![../images/501148_1_En_6_Chapter/501148_1_En_6_Fig22_HTML.jpg](img/501148_1_En_6_Fig22_HTML.jpg)\n\
  \n图 6-19a\n\n默认情况下，新饼图的所有扇区评论均为水平\n\n现在将饼图旋转回图 6-19b 所示的状态，打开调整表单，并关闭旋转时固定角度的选项。第二个复选框变为可用，但它仍处于选中状态。现在将饼图旋转到图\
  \ 6-19d 所示的视图。当评论角度在旋转时未固定时，它会以与饼图角度相同的方式改变，因此 *Thursday* 沿着角平分线显示，而 *Wednesday*\
  \ 则与角平分线正交。*Monday* 发生了一件有趣的事情。在图 6-19b 中，*Tuesday* 和 *Monday* 的角度几乎相同，而在图 6-19d\
  \ 中，这两个评论看起来方向几乎相反。这是因为调整表单中的第二个复选框被勾选，这不允许任何评论上下颠倒显示。取消该勾选，评论就会在饼图旋转使其上下颠倒时显示为颠倒。图\
  \ 6-19b 到 6-19d 的变化是当扇区评论的角度未固定时旋转的结果。\n\n图 6-16 中最大的饼图展示了另一种可以改变扇区评论角度的方法。可以通过在饼图上使用菜单中的“扇区评论朝向中心”命令来获得这种视图。\n\
  \n某些用于调节评论角度的命令可以一起使用，而另一些则不能。例如，“扇区评论朝向中心”命令允许您使用“易于阅读”角度复选框的任何模式，但该命令会自动关闭旋转时固定角度的选项。\n\
  \n新饼图通过一个辅助表单（图 6-20）来组织。该表单允许您设置一些参数，但主要的调整还是在主表单中当新饼图出现时完成的。\n\n![../images/501148_1_En_6_Chapter/501148_1_En_6_Fig26_HTML.jpg](img/501148_1_En_6_Fig26_HTML.jpg)\n\
  \n图 6-20\n\n用于准备新饼图的辅助表单\n\n## 结论\n\n本章仅涉及两个众所周知的复杂对象，但通过它们展示了在所有用户驱动应用程序中处理复杂对象的标准方法。\n\
  \n所有参数都需要调整，因此必须有一个与复杂对象不同部分相关联的菜单系统。每类复杂对象都需要一个特殊表单，用户可以在其中组织新元素。可以在准备过程中使用一定程度的调整，因为当组织新对象时，可以在其使用的任何地方对其进行全面调整。\n\
  \n\n\n"
- "# 7. 示例\n\n用户驱动的应用程序只能建立在完全可移动性的基础上，因此前几章主要讨论的是设计各种完全不同的可移动对象。我们循序渐进，从最常用形状（矩形、圆形、多边形、环形等）的简单对象，过渡到可包含任意类型对象的复杂对象和组。我认为前几章的示例已经充分展示了如何将截然不同的对象转变为可移动对象，以及如何在新类型的应用程序中使用它们。几乎所有之前的示例都以展示所提算法的最重要特性及其实现方式为目的而开发。\n\
  \n本章不再讨论可移动性尚未涉及的方面，而是聚焦于具有明确用途的真实用户驱动应用程序的整体设计。以下示例最初是作为独立应用程序开发的，后来才被收录为本书配套程序的一部分。\n\
  \n## 计算器\n\n我只有在极少数需要计算两个大数相除，且懒得用纸笔计算时，才会使用标准的 Windows 计算器。也许是因为我很少用这个程序，但每次使用时，我都很难找到印有正确数字的按钮，因为这些按钮的位置绝对不像我会作为设计师摆放的那样。我从小（并且至今仍）被教导从左到右、从上到下阅读和书写，考虑到从\
  \ 0 到 9 的数字顺序几个世纪以来从未改变，而计算器的设计者也受教于同样的规则，我实在搞不懂为什么 Windows 计算器中的相同数字却是从底部开始向上排列的（图\
  \ 7-1a）。这种布局背后肯定有某种伟大的想法，但我无法理解。每次使用这个程序，我都要花额外的时间寻找需要的按键。最终找到它们，得出结果，然后就会忘记这次搜索，直到下次再犯。\n\
  \n多年前，在我将普通控件纳入我的可移动性算法后，我一直在思考一个能展示这部分算法的好例子。这时我想到了计算器程序，它是一个绝佳的演示候选，因为它完全由控件构建，并且每个人都熟悉它。我的第一个计算器版本功能有限，但重现了原始程序的界面，并完美展示了所有元素的可移动性（图\
  \ 7-1）。\n\n![../images/501148_1_En_7_Chapter/501148_1_En_7_Fig2_HTML.jpg](img/501148_1_En_7_Fig2_HTML.jpg)\n\
  \n图 7-1b\n\n可移动性允许每位用户组织自己偏好的视图\n\n![../images/501148_1_En_7_Chapter/501148_1_En_7_Fig1_HTML.jpg](img/501148_1_En_7_Fig1_HTML.jpg)\n\
  \n图 7-1a\n\n原始计算器程序的默认视图\n\n我本无意再用这个计算器做其他事，但几年后，在与一位同事交谈时，我听到了抱怨：这位同事视力不佳，使用标准计算器程序时遇到很大麻烦，因为即便数位专家共同努力，也未能找到任何方法来增大该应用程序使用的字体。于是，我坐下来开发了另一个同事能用的计算器。由于不是为自己开发，这个程序必须能作为一个具有运算和功能的普通计算器运行。当然，改变字体并非我在该程序中允许用户做的唯一事情；它是按照用户驱动应用程序的所有规则来设计的。\n\
  \n我的第二个计算器版本外观与图 7-2 所示相同；只是简短信息的文本略有不同，因为我的第二个计算器版本仍然使用普通控件设计。又过了几年，在下一个版本的计算器中，不再保留任何普通控件。图\
  \ 7-2 展示的就是这个程序，也是我现在想讨论的程序。\n\n![../images/501148_1_En_7_Chapter/501148_1_En_7_Fig3_HTML.jpg](img/501148_1_En_7_Fig3_HTML.jpg)\n\
  \n图 7-2\n\n最新计算器的默认视图\n\n*   文件：`Form_Calculator.cs`\n*   菜单位置：Applications ➤ Calculator\n\
  \n我无意设计一个能与 Windows 同类程序竞争的程序。这个新计算器是为特定个人使用的；此人从未使用过原始程序的存储操作，所以我的程序中没有用于存储操作的按钮。\n\
  \n在进一步说明之前，有一点需要注意：在下文中，术语*所有元素*指的是除信息元素之外的所有元素。\n\n\n\n### 排版后内容\n\n新应用程序的所有元素中，除了两个之外，其余都是\
  \ `Button_Text` 类的按钮。这些按钮被分为四组；在图 7-2 中，它们通过不同的文本颜色被轻易区分。\n\n*   带有数字的按钮文本显示为蓝色。从数学角度来看，小数点和符号绝对不是数字，但它们在书写数字时被用作记法的一部分，因此在这个程序中，这两个按钮被归入*数字*组。\n\
  \n```\nButton_Text btn_0, btn_1, btn_2, btn_3, btn_4, btn_5, btn_6, btn_7, btn_8,\
  \ btn_9, btnSign, btnDot;                   // 数字\n```\n\n*   带有运算符号的按钮显示为红色。\n\n\
  ```\nButton_Text btnPlus, btnMinus, btnMultiply, btnDivide, btnDegree, btnEqual;\n\
  ```\n\n*   *函数*按钮的文本显示为紫色。我可以很容易地添加更多函数，但为我设计这个程序的人说这组函数已经够用了。你可以在此程序中添加更多函数，但请仔细检查代码，并在使用此组的所有位置进行修改。\n\
  \n```\nButton_Text btnLn, btnLog, btnExp, btnSin, btnCos,\nbtnTg, btnInverse, btnSqrt;\n\
  ```\n\n*   三个绿色文本的按钮被归为一组*清除器*，因为它们用于删除部分或全部已准备的数据。\n\n```\nButton_Text btnBackspace,\
  \ btnClearAll, btnClearEdit;\n```\n\n为了更好地展示结果，这里有两个辅助区域；一个用于显示当前数值，另一个用于显示整个表达式。\n\
  \n```\nLabel_GR labelValue, labelExpression;\n```\n\n计算器旨在实现其主要目的，但这是一个用户驱动的应用程序，具备移动、调整大小、调优、保存和恢复等所有功能。让我们从移动开始。\n\
  \n移动可以应用于单个对象、三个预定义组（数字、运算和函数）的元素以及临时组元素。元素的单独移动以标准方式组织：用左键按下它，然后移动到另一个位置。\n\n数字、运算或函数组（图\
  \ 7-3）可以通过菜单命令来组织；我稍后会介绍菜单。因此，组织好的“标准”组只包含该预定义集合中的元素，不包含其他任何元素，即使当调用该组时，有其它对象恰好位于框架内。因此，函数组始终恰好包含八个具有函数名称的按钮；图\
  \ 7-3 中框架内的另外两个元素（一个带有数字，另一个带有等号）不属于此组。\n\n![../images/501148_1_En_7_Chapter/501148_1_En_7_Fig4_HTML.jpg](img/501148_1_En_7_Fig4_HTML.jpg)\n\
  \n图 7-3\n\n函数组包含八个按钮\n\n临时组可以包含任意元素集合。在任何空白位置按下左键，并在不释放按钮的情况下移动鼠标光标。在此移动过程中，您将看到一个矩形框架；该矩形的两个对角分别是初始按下点和当前鼠标位置。如果在释放鼠标时，该矩形内包含多于一个对象，则会组织一个由这些圆角对象组成的临时组。例如，图\
  \ 7-4 中的临时组包含数字组中的八个按钮、运算组中的三个按钮、清除器组中的一个按钮以及一个标签。\n\n![../images/501148_1_En_7_Chapter/501148_1_En_7_Fig5_HTML.jpg](img/501148_1_En_7_Fig5_HTML.jpg)\n\
  \n图 7-4\n\n临时组\n\n任何组，无论是预定义组还是临时组，都属于 `Group_ArbitraryElements` 类，因此可以通过其内部的任何点进行移动。框架会根据内部元素的任何变化调整其大小和位置。我想说的是，在计算器中组织的任何组都类似于临时组，仅用于移动某些元素集合的目的；这就是为什么没有修改组的命令。\n\
  \n在 `Form_Calculator.cs` 文件中（图 7-2），排除信息区域后，共有 31 个元素。这 31 个对象被分配到两个 `List` 中。这些\
  \ `List` 的名称清楚地表明，其中一个包含当前存在的组中的所有元素；其余元素则进入另一个 `List`。\n\n```\nList elemsInGroup\
  \ = new List ();\nList elemsSingle = new List ();\n```\n\n元素在两个 `List` 之间的分配，要么在调用“设置”菜单中适当的命令时（图\
  \ 7-5）进行，要么在视图内绘制矩形后释放鼠标时进行。在这两种情况下，都会调用 `SetGroup()` 方法，但参数不同。\n\n![../images/501148_1_En_7_Chapter/501148_1_En_7_Fig6_HTML.jpg](img/501148_1_En_7_Fig6_HTML.jpg)\n\
  \n图 7-5\n\n“设置”菜单\n\n当调用菜单命令并命令标记某个预定义组时，`SetGroup()` 方法会获取一个参数，即要框选的特定元素类型。作为初步步骤，所有元素会按预定顺序被包含到\
  \ `elemsSingle` 中，同时清空 `elemsInGroup`。\n\n```\nprivate void ElemsDefaultOrder ()\n\
  {\nelemsSingle .Clear ();\nelemsSingle .Add (new CalcElem (labelValue));\nelemsSingle\
  \ .Add (\nnew CalcElem (labelExpression));\n... ...\nelemsInGroup .Clear ();\n}\n\
  ```\n\n现在，指定类型的所有元素都会从 `elemsSingle` 移动到 `elemsInGroup`。\n\n```\nprivate void SetGroup\
  \ (CalcElemType elem_type)\n{\nElemsDefaultOrder ();\nfor (int i = elemsSingle .Count\
  \ - 1; i >= 0; i--)\n{\nif (elemsSingle [i] .ElemType == elem_type)\n{\nelemsInGroup\
  \ .Insert (0, elemsSingle [i]);\nelemsSingle .RemoveAt (i);\n}\n}\n... ...\n```\n\
  \n当鼠标绘制一个矩形然后释放时，会调用另一个版本的 `SetGroup()` 方法。这种情况下，矩形会被用作参数。\n\n```\nprivate void\
  \ OnMouseUp (object sender, MouseEventArgs e)\n{\nptMouse_Up = e .Location;\ndouble\
  \ fDist = Auxi_Geometry .Distance (ptMouse_Down, ptMouse_Up);\nint iObj, iNode;\n\
  if (mover .Release (out iObj, out iNode))\n{\n... ...\n}\nelse\n{\nif (e .Button\
  \ == MouseButtons .Left)\n{\nif (bRectInView)\n{\nSetGroup (new Rectangle (Math\
  \ .Min (ptMouse_Down .X, e .X),\nMath .Min (ptMouse_Down .Y, e .Y),\nMath .Abs (e\
  \ .X - ptMouse_Down .X),\nMath .Abs (e .Y - ptMouse_Down .Y)));\nbRectInView = false;\n\
  }\n}\n... ...\n```\n\n所有元素都会被检查是否在此矩形内部；任何位于内部的元素都会被包含到 `elemsInGroup` 中。\n\n```\n\
  private void SetGroup (RectangleF rc)\n{\nelemsInGroup .Clear ();\ngroup = null;\n\
  ElemsDefaultOrder ();\nif (MoreThanOneInside (rc))\n{\nfor (int i = elemsSingle\
  \ .Count - 1; i >= 0; i--)\n{\nif (rc .Contains (elemsSingle [i] .RectAround))\n\
  {\nelemsInGroup .Insert (0, elemsSingle [i]);\nelemsSingle .RemoveAt (i);\n}\n}\n\
  ... ...\n```\n\n如果最终 `elemsInGroup` 中有多于一个元素，那么这些元素就构成一个组。\n\n```\nprivate void\
  \ SetGroup (CalcElemType elem_type)\n{\n... ...\nRectangleF rcElems = ElemsArea_group\
  \ ();\nPointF ptLT =\nnew PointF (rcElems .Left - GroupParameters .DefaultFrameSpaces\
  \ [0],\nrcElems .Top - GroupParameters .DefaultFrameSpaces [1]);\ngroup = new Group_ArbitraryElements\
  \ (this, mover, ptLT, grparams, strTitle,\nElemsArea_group, DrawElems_group,\nSynchroMove_group,\
  \ IntoMover_group);\nGroupMovability ();\n}\n```\n\n\n\n一个组可以通过使用“Delete frame”命令（图\
  \ 7-5）来消除，但组中拥有多个元素的条件还提供了另一种方法。只需绘制一个不包含任何元素或只包含单个元素的新矩形即可。在这些情况下，都不会组织成组，但如果此时有某个组显示出来，它将会消失。甚至不需要绘制矩形；只需在任意空白位置单击左键就足够了。\n\
  \n还有另一种重新排列元素位置的方法，但此方法仅适用于三个预定义的组。图 7-6 中的子菜单显示了可应用于 Numbers 组的三个命令；当选择 Operations\
  \ 或 Functions 菜单时，会打开相同的子菜单。\n\n![../images/501148_1_En_7_Chapter/501148_1_En_7_Fig7_HTML.jpg](img/501148_1_En_7_Fig7_HTML.jpg)\n\
  \nFigure 7-6\n\n`Standard positioning`菜单命令会打开一个辅助窗口，允许您为该预定义组选择一些标准元素定位。\n\n`Settings\
  \ ➤ Numbers ➤ Standard positioning`命令会打开`Form_BtnPlaces_Numbers.cs`文件（图 7-7a）；此窗口允许您为\
  \ Numbers 组选择标准元素定位。Functions 和 Operations 组也有类似的窗口来选择它们的标准视图，但这些组的元素更少，可供选择的组合也更少（图\
  \ 7-7b 和 7-7c）。\n\n![../images/501148_1_En_7_Chapter/501148_1_En_7_Fig10_HTML.jpg](img/501148_1_En_7_Fig10_HTML.jpg)\n\
  \nFigure 7-7c\n\nOperations 组标准定位的选择\n\n![../images/501148_1_En_7_Chapter/501148_1_En_7_Fig9_HTML.jpg](img/501148_1_En_7_Fig9_HTML.jpg)\n\
  \nFigure 7-7b\n\nFunctions 组标准定位的选择\n\n![../images/501148_1_En_7_Chapter/501148_1_En_7_Fig8_HTML.jpg](img/501148_1_En_7_Fig8_HTML.jpg)\n\
  \nFigure 7-7a\n\nNumbers 组标准定位的选择\n\n每个标准定位变体都显示为一个草图，并带有一个用于选择该变体的附加复选框。每个草图由一组代表实际控件的矩形组成。这些小矩形通过线条连接，这些线条显示了组中元素的顺序。否则，将无法区分元素按行或按列排列的相似变体。当通过单击`OK`按钮关闭`Form_BtnPlaces_Numbers.cs`文件时，Calculator\
  \ 中 Numbers 组的按钮将根据所选变体进行排列。此时 Number 组是否有框架并不重要；标准定位始终有效。\n\n每个用于选择标准定位的辅助窗口都包含一个小型组，其中包含两个`NumericUpDown_GR`元素；在图\
  \ 7-7 中，这些组以不同颜色显示。更改这些元素内的值对草图视图没有影响，因此当这些值更改时，辅助窗口内不会有任何反应。但是，如果选择了任何标准定位并按下`OK`按钮，则\
  \ Calculator 中组的元素将根据所选情况放置，并且元素之间的距离由这两个值确定。我们继续讨论 Calculator，但之后，我将回到对图 7-7 中草图的讨论。\n\
  \nCalculator 中的任何元素都可以单独调整大小。现在，假设您想要更改 Numbers 组中按钮的大小；您尝试一个按钮并设置合适的大小。接下来您要做什么？您是希望这个按钮与组中的其他按钮保持不同，还是以相同的方式更改\
  \ Numbers 组中其他 11 个按钮的大小？您打算一个一个手动操作吗？有些人可能喜欢让按钮的尺寸根据其上的数字稳定增长，或者组织其他非凡的视图（在用户驱动的应用程序中，没有任何限制！），但我感觉大多数用户更倾向于为组内所有按钮设置相同的大小。我还认为，在一个大组中手动逐个标准化按钮不会是一种受欢迎的操作。\n\
  \n当然，有一种更好的方法：一个元素可以作为其所有兄弟元素的样本。变化仅在于选择传播的参数以及决定将所选参数传播到哪个按钮组。\n\n图 7-8 显示了可以在\
  \ Numbers 组的任何按钮上调用的菜单。第一个命令打开一个用于调整此类按钮的辅助窗口（参见图 5-5）；第二个命令的子菜单允许您将参数传播到组中的其他按钮；最后一个命令允许您为两个组的按钮设置相同大小。Numbers\
  \ 和 Operations 组的按钮最初具有相同大小；最后一个命令允许您保持这种大小相等性。\n\n![../images/501148_1_En_7_Chapter/501148_1_En_7_Fig11_HTML.jpg](img/501148_1_En_7_Fig11_HTML.jpg)\n\
  \nFigure 7-8\n\nNumbers 组按钮上的菜单\n\n几乎相同的菜单可以在 Operations 和 Functions 组的按钮上调用。类似的但更小的菜单可以在\
  \ Cleaners 组的按钮上调用。\n\n通常，应用程序由不同类的元素构建而成，并通过分析被点击元素的类来选择相应的菜单。在这个 Calculator 中，仅通过类来选择元素是不够的，因为大多数元素都属于同一个`Button_Text`类，因此需要额外的`ID`检查。\n\
  \n```csharp\nprivate void OnMouseUp (object sender, MouseEventArgs e)\n{\nptMouse_Up\
  \ = e .Location;\ndouble fDist = Auxi_Geometry .Distance (ptMouse_Down, ptMouse_Up);\n\
  int iObj, iNode;\nif (mover .Release (out iObj, out iNode))\n{\nGraphicalObject\
  \ grobj = mover .ReleasedSource;\nlong id = grobj .ID;\nif (e .Button == MouseButtons\
  \ .Left)\n{\n... ...\n}\nelse if (e .Button == MouseButtons .Right && fDist <= 3)\n\
  {\nif (grobj is Button_Text)\n{\nif (id == btn_0 .ID || id == btn_1 .ID || id ==\
  \ btn_2 .ID ||\nid == btn_3 .ID || id == btn_4 .ID || id == btn_5 .ID ||\nid ==\
  \ btn_6 .ID || id == btn_7 .ID || id == btn_8 .ID ||\nid == btn_9 .ID || id == btnSign\
  \ .ID || id == btnDot .ID)\n{\nContextMenuStrip = menuOnNumbers;\n}\nelse if (id\
  \ == btnPlus .ID || id == btnMinus .ID ||\nid == btnMultiply .ID || id == btnDivide\
  \ .ID ||\nid == btnDegree .ID || id == btnEqual .ID)\n{\nContextMenuStrip = menuOnOperations;\n\
  }\nelse if (id == btnLn .ID || id == btnLog .ID ||\nid == btnExp .ID || id == btnSin\
  \ .ID ||\nid == btnCos .ID || id == btnTg .ID ||\nid == btnInverse .ID || id ==\
  \ btnSqrt .ID)\n{\nContextMenuStrip = menuOnFunctions;\n}\nelse\n{\nContextMenuStrip\
  \ = menuOnCleaners;\n}\n}\n... ...\n```\n\n完全可移动性是改变我们使用应用程序方式的功能，但这种可移动性，如同任何其他功能一样，也受用户控制。假设在移动和调整对象大小后，您组织了一个您喜欢的\
  \ Calculator 视图，并且不希望因意外移动任何元素而破坏此视图。您可以通过将元素设置为不可移动来保留此视图。在 Calculator 中，可移动性通过空白位置的菜单同步更改所有元素。\n\
  \n\n\n```csharp\nprivate void Click_miFixUnfixAll (object sender, EventArgs e)\n\
  {\nbMovable = !bMovable;\nResizing resize = bMovable ? Resizing .Any : Resizing\
  \ .None;\nfor (int i = 0; i < elemsSingle .Count; i++)\n{\nelemsSingle [i] .Movable\
  \ = bMovable;\nelemsSingle [i] .Resizing = resize;\n}\nif (group != null)\n{\nGroupMovability\
  \ ();\n}\ninfo .Movable = bMovable;\ninfo .Resizing = resize;\nRenewMover ();\n\
  }\n```\n\n相同的可移动性声明应用于组内的内部元素、组本身以及组标题。\n\n```csharp\nprivate void GroupMovability\
  \ ()\n{\nResizing resize = bMovable ? Resizing .Any : Resizing .None;\nfor (int\
  \ i = 0; i < elemsInGroup .Count; i++)\n{\nelemsInGroup [i] .Movable = bMovable;\n\
  elemsInGroup [i] .Resizing = resize;\n}\ngroup .Movable = bMovable;\ngroup .TitleMovable\
  \ = bMovable;\n}\n```\n\n现在让我们回到对草图的讨论，这些草图用于三种辅助表单（图 7-7）。这些表单中的所有元素都是可移动的，因此你可以通过任意方式定位这些草图来重新排列它们的视图。不必担心任何操作：表单的默认视图可以随时通过空白位置的菜单进行重置。\n\
  \n每当你开发用户驱动的应用程序时，都需要不时地设计具有一些有趣且非标准特性的可移动对象，因为需求本身就是非标准的。我认为，当你需要思考一些不平凡的问题时，这是编程中最有趣的部分。\n\
  \n这三种表单中的草图属于 `ButtonsSketch` 类。草图是一个图形对象，其大多数字段用于描述其几何形状。\n\n```csharp\npublic\
  \ class ButtonsSketch : GraphicalObject\n{\n    bool bSelected;                \
  \     // 草图选中指示器\n    Rectangle m_rc;                     // 对象的整个区域\n    Rectangle\
  \ rcSelect;                 // 虚构复选框的矩形\n    Point [] ptBtn;                   \
  \  // 草图上所有“按钮”的位置\n    int w = 16;                         // “按钮”的尺寸\n    int\
  \ h = 8;\n    int spaceInside = 4;                // “按钮”之间的间距\n    int spaceOnBorders\
  \ = 6;             // 边缘的间距\n    int sideSelectSquare = 14;\n}\n```\n\n每个辅助表单中的草图展示了特定分组按钮的定位变体。每个标准分组都有固定数量的按钮，因此一个辅助表单中的所有草图都展示了相同数量按钮的定位变体；让我们将这个数量称为\
  \ N。图 7-9 展示了 N = 12 时的一些变体。\n\n![../images/501148_1_En_7_Chapter/501148_1_En_7_Fig12_HTML.jpg](img/501148_1_En_7_Fig12_HTML.jpg)\n\
  \n**图 7-9** N = 12 情况下的几个草图\n\n- 每个按钮由一个小的深色矩形表示；其尺寸为 `16*8` 像素（`w * h`）。\n- 草图中相邻小矩形之间的距离始终相同，等于\
  \ `4` 像素（`spaceInside`）。\n- 草图有一个圆角边框；此边框与内部元素之间的距离为 `6` 像素（`spaceOnBorders`）。\n\
  - 要选择分组按钮所需的定位，必须标记所需的草图；这通过框架内的一个小复选框来完成。这个特殊复选框占据一个边长为 `14` 像素（`sideSelectSquare`）的矩形。\n\
  - 通过行和列来定位 N 个按钮可以有多种方式，但有两种边界变体：所有按钮在一行和所有按钮在一列。为了描述草图上“按钮”的位置，我使用了一个大小为 `N*N`\
  \ 的矩阵。位置的编号从左上角开始为 `0`，沿上行向右；然后逐行向下；在每一行中，编号从左位置开始，向右递增。因此，第二行的左位置编号为 N；矩阵右下角的位置编号为最大的\
  \ `N*N-1`。图 7-9 中的所有草图都是为 `N = 12` 的情况设计的。位置数组是草图初始化的参数之一。接下来你可以看到图 7-9 左下角被选中草图的初始化代码。\n\
