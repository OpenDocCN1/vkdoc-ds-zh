  \ CoverNode (1, m_rc, Cursors .SizeAll) };\n    cover = new Cover (nodes);\n}\n\
  ```\n\n仅当按下较大的节点（编号 1）时，才会执行草图移动操作。\n\n```csharp\npublic override bool MoveNode\
