  ## 结论


  在本章中，我们了解了如何让最常用形状的对象变得可移动。这些对象可以被移动、调整大小和旋转。所讨论的对象之所以被称为简单对象，是因为每个对象都拥有自己的覆盖层，并且能够参与所有必要的移动操作，而无需关注屏幕上的其他对象。然而，在实际应用中，除了独立的移动之外，各元素也常常会与其他元素一同参与同步或关联移动。这类复杂对象的设计将在下一章中讨论。


