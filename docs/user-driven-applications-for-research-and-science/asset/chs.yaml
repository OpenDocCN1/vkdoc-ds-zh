  \n```\npublic override bool MoveNode (...)\n{\nbool bRet = false;\nif (catcher ==\
  \ MouseButtons .Left)\n{\n... ...\nelse if (iNode == Node_ArrowUp || iNode == Node_ArrowDown)\
  \    // 按钮\n{\nAdjustCursorPosition (ptFixed);\nbRet = false;\n}\n... ...\n```\n\
  \n对于任何可移动元素，其 `Press()` 方法在鼠标按下时被调用。`NumericUpDown_GR` 类属于少数几个需要在左键释放对象时使用其 `Release()`\
  \ 方法的类之一。严格来说，只有在释放两个带箭头按钮之一时才需要使用此方法，但由于释放按钮和滑块时所需的操作相同，将三种情况统一处理更简便。\n\n```\n\
  private void OnMouseUp (object sender, MouseEventArgs e)\n{\nptMouse_Up = e .Location;\n\
  double fDist = Auxi_Geometry .Distance (ptMouse_Down, ptMouse_Up);\nint iObj, iNode;\n\
  if (mover .Release (out iObj, out iNode))\n{\nGraphicalObject grobj = mover .ReleasedSource;\n\
  long id = grobj .ID;\nif (e .Button == MouseButtons .Left)\n{\nif (grobj is NumericUpDown_GR\
  \ && numericPressed .Enabled)\n{\nif (iNode == NumericUpDown_GR .Node_Slider ||\n\
  iNode == NumericUpDown_GR .Node_ArrowUp ||\niNode == NumericUpDown_GR .Node_ArrowDown)\n\
  {\n... ...\nnumericPressed .Release ();\n}\nInvalidate ();\n}\n... ...\n```\n\n\
  任何 `NumericUpDown_GR` 对象的参数都可以在专门的调谐表单中更改（图 5-12）。\n\n![../images/501148_1_En_5_Chapter/501148_1_En_5_Fig12_HTML.jpg](img/501148_1_En_5_Fig12_HTML.jpg)\n\
  \n图 5-12\n\n`NumericUpDown_GR` 对象的调谐表单\n\n\n\n## 轨道条\n\n- 文件：`Form_Trackbar.cs`\n\
  - 菜单位置：图形控件 ➤ 轨道条\n\n轨道条是界面设计中广为人知的元素。在一个细长条上滑动小滑块，从而在某个范围内选择任意值的对象设计理念，在许多场景下都很有用。遗憾的是，Visual\
  \ Studio 中该控件的实现过于笨拙，以至于每次尝试使用普通的`TrackBar`控件后，我都不得不放弃它。但轨道条的核心思想非常完美，而一个好的同类元素又时常令人向往，因此不得不使用它。我设计了几类轨道条；在此我要演示`Trackbar_GR`类。你已经熟悉此类对象的使用，因为它被用于所有通过改变背景颜色进行调整的表单中（图\
  \ 2‑4、4‑2 和 5‑9）。\n\n```\npublic class Trackbar_GR : GraphicalObject\n{\nRectangleF\
  \ rcTicks;\nPointF ptLT_rail_axis, ptRB_rail_axis, ptSliderAnchor;\nRectangleF rcRail;\
  \        // 窄矩形\nRectangleF rcFrame;       // 包含 rcTicks 和可移动滑块覆盖的区域\nbool bEnabled\
  \ = true;\nbool bResizable = true;\n```\n\n图 5‑13 中的轨道条以经典样式展示，所有部件均可见。然而，唯一必须展示的部件是细轨道和可沿其移动的滑块。\n\
  \n![../images/501148_1_En_5_Chapter/501148_1_En_5_Fig13_HTML.jpg](img/501148_1_En_5_Fig13_HTML.jpg)\n\
  \n**图 5‑13** `Trackbar_GR`类的元素\n\n轨道条可以是垂直或水平方向；方向由轨道决定。每种情况下，滑块都有两种可能的朝向。滑块形状有两种变体（三角形或五边形），尺寸也有多种变化。\n\
  \n`Trackbar_GR`类有两个构造函数。其中一个需要若干参数来定义滑块和刻度线的外观，而另一个构造函数中这些参数多数取默认值。在当前的示例中，两个水平轨道条都使用了带完整参数列表的构造函数，而垂直轨道条则以最少参数构建。这组最少参数包括滑块朝向、轨道左上角坐标、轨道长度以及滑块系数。所有其他参数取默认值，但滑块颜色和刻度线数量可通过某些属性进行更改。\n\
  \n```\nvoid DefaultView ()\n{\n... ...\ntrackbars .Add (new Trackbar_GR (this, mover,\
  \ Side .S, new PointF (60, 60),\n200, 0.3, SharpSlider .Triangle, 12, 4,\ntrue,\
  \ 6, 8, 11));\nTrackbar_GR elem = new Trackbar_GR (this, mover, Side .N,\nnew PointF\
  \ (40, 200), 300, 0.14,\nSharpSlider .Pentagon, 12, 8, true, 2, 8, 5);\nelem .SliderColor\
  \ = Color .Blue;\n... ...\nelem = new Trackbar_GR (this, mover, Side .W,\nnew PointF\
  \ (440, 50), 200, 0.3);\nelem .SliderColor = Color .Red;\nelem .TicksNumber = 8;\n\
  ... ...\n```\n\n轨道条的覆盖层由四个节点组成。\n\n- 一个节点覆盖滑块；如果轨道条被禁用，则该节点尺寸压缩为零。\n- 两个节点覆盖轨道条区域的相对两侧，允许更改轨道条长度。轨道条只能沿轨道方向调整大小。对于不可调整大小的轨道条，两侧的这两个节点尺寸均压缩为零。\n\
  - 最后一个节点覆盖元素的整个区域。\n\n```\npublic override void DefineCover ()\n{\nCoverNode []\
  \ nodes = new CoverNode [4];\nfloat wHalf = bResizable ? 3 : 0;\nif (sideHead ==\
  \ Side .N || sideHead == Side .S)       // 水平轨道\n{\nnodes [0] = new CoverNode (0,\
  \ ptsSlider, Cursors .SizeWE);\nnodes [1] = new CoverNode (1, rcFrame .Location,\n\
  new PointF (rcFrame .Left, rcFrame .Bottom),\nwHalf, Cursors .SizeWE);\nnodes [2]\
  \ = new CoverNode (2, new PointF (rcFrame.Right, rcFrame .Top),\nnew PointF (rcFrame.Right,\
  \ rcFrame .Bottom),\nwHalf, Cursors .SizeWE);\n}\nelse\n{\nnodes [0] = new CoverNode\
  \ (0, ptsSlider, Cursors .SizeNS);\nnodes [1] = new CoverNode (1, rcFrame .Location,\n\
  new PointF (rcFrame .Right, rcFrame .Top),\nwHalf, Cursors .SizeNS);\nnodes [2]\
  \ = new CoverNode (2,\nnew PointF (rcFrame .Left, rcFrame .Bottom),\nnew PointF\
  \ (rcFrame.Right, rcFrame .Bottom),\nwHalf, Cursors .SizeNS);\n}\nnodes [3] = new\
  \ CoverNode (3, m_rcFrame, Cursors .SizeAll);\nif (!Enabled)\n{\nnodes [0] = new\
  \ CoverNode (0, ptSliderAnchor, 0f);\n}\nif (!Movable)\n{\nnodes [3] .Cursor = Cursors\
  \ .NoMove2D;\n}\ncover = new Cover (nodes);\n... ...\n```\n\n令人惊讶的是，这样一个简单的对象竟有大量可调节的参数；所有调节都在一个特殊表单中完成（图\
  \ 5‑14）。我之前提到过，细轨道和可沿其移动的滑块总是会显示。刻度线和框架的外观则通过此调节表单进行控制。\n\n![../images/501148_1_En_5_Chapter/501148_1_En_5_Fig14_HTML.jpg](img/501148_1_En_5_Fig14_HTML.jpg)\n\
  \n**图 5‑14** 轨道条的调节表单\n\n\n\n## 列表框\n\n- 文件：`Form_ListBox.cs`\n- 菜单位置：图形控件 ➤ 列表框\n\
  \n列表框包含一组字符串。普通的 `ListBox` 控件可用于单选或多选；而本方案中的 `ListBox_GR` 类仅允许单选（或完全不选）。\n\n通常情况下，`ListBox_GR`\
  \ 元素的高度与所含字符串的总高度并不相关。如果区域高度不足以显示所有字符串，则右侧边框旁会出现滚动条。如果区域高度超过所有字符串的总高度，则底部会出现空白区域。图\
  \ 5-15 展示了所有变体情况。\n\n![../images/501148_1_En_5_Chapter/501148_1_En_5_Fig15_HTML.jpg](img/501148_1_En_5_Fig15_HTML.jpg)\n\
  \n图 5-15 — `ListBox_GR` 对象\n\n```\npublic class ListBox_GR :\nGraphicalObject\n\
  {\nPointF [] ptsCorner;\nResizing resize;\nint m_iSel;\nList m_strs = new List ();\n\
  Font m_font;\nbool bEnabled = true;\nfloat minWidth = SystemInformation .VerticalScrollBarWidth\
  \ * 2;\nfloat minHeight = 22;\n```\n\n列表的最小允许宽度（`minWidth`）和最小允许高度（`minHeight`）可防止因调整大小而意外消失。一般情况下没有上限尺寸限制，但如需设置也可设定。覆盖层对于所有矩形对象来说几乎是标准的（四个角为圆形节点，四条边为带状节点，整个区域有一个大节点），但顶部额外包含一个用于滚动条的节点。当不需要滚动条时，该节点会被压缩至零尺寸。\n\
  \n```\npublic override void DefineCover ()\n{\nfloat rCorner = (resize == Resizing\
  \ .Any) ? 5 : 0;\nfloat wHalf_WE = (resize == Resizing.Any || resize == Resizing.WE)\
  \ ? 3 : 0;\nfloat wHalf_NS = (resize == Resizing.Any || resize == Resizing.NS) ?\
  \ 3 : 0;\nCoverNode [] nodes = new CoverNode [] {\nnew CoverNode (0, ptsCorner [1],\
  \ 0f, Cursors .SizeNS),\nnew CoverNode (1, ptsCorner [0], rCorner, Cursors .SizeNWSE),\n\
  new CoverNode (2, ptsCorner [1], rCorner, Cursors .SizeNESW),\nnew CoverNode (3,\
  \ ptsCorner [2], rCorner, Cursors .SizeNWSE),\nnew CoverNode (4, ptsCorner [3],\
  \ rCorner, Cursors .SizeNESW),\nnew CoverNode (5, ptsCorner [0], ptsCorner [3],\
  \ wHalf_WE,\nCursors .SizeWE),\nnew CoverNode (6, ptsCorner [1], ptsCorner [2],\
  \ wHalf_WE,\nCursors .SizeWE),\nnew CoverNode (7, ptsCorner [0], ptsCorner [1],\
  \ wHalf_NS,\nCursors .SizeNS),\nnew CoverNode (8, ptsCorner [3], ptsCorner [2],\
  \ wHalf_NS,\nCursors .SizeNS),\nnew CoverNode (9, ptsCorner, Cursors .Hand) };\n\
  if (m_hStrings > Height)\n{\nnodes [0] = new CoverNode (0, rcSlider, Cursors .SizeNS);\n\
  }\nif (!Movable)\n{\nnodes [9] .Cursor = Cursors .NoMove2D;\n}\ncover = new Cover\
  \ (nodes);\n... ...\n```\n\n列表框的初始化参数包括初始矩形区域、一组字符串、字体以及选中的行。\n\n```\npublic ListBox_GR\
  \ (Form frm, Mover mvr, RectangleF rc, string [] txts,\nFont fnt, int iSel)\n```\n\
  \n字体大小决定了所有字符串的总高度（`m_hStrings`）。如果总高度小于矩形的声明高度，则整个列表下方会出现空白区域。在当前示例中，`listboxMonths`\
  \ 就出现了这种情况，如图 5-15 左侧所示。\n\n```\nprivate void DefaultView ()\n{\n... ...\nlistboxMonths\
  \ = new ListBox_GR (this, mover,\nnew RectangleF (20, 50, 100, 280),\nAuxi_Common\
  \ .strMonths, fntSelected, 5);\n... ...\n```\n\n构造函数中的最后一个参数是选中行的编号。当不需要选中时，选中行声明为\
  \ `-1`；颜色名称列表即属此情况。\n\n```\nlistboxColors = new ListBox_GR (this, mover, new RectangleF\
  \ (...),\nAuxi_Colours .strRainbowColorNames,\nfntSelected, -1);\n```\n\n`ListBox_GR`\
  \ 对象的向前移动通过在任何内部点按下鼠标左键启动。列表框不仅用于展示一组字符串，还用于从中进行选择。选择操作通过点击所需字符串的左键完成，因此两种不同的动作在同一位置以相同方式启动。决定执行哪种动作的依据是鼠标按下与释放点之间距离的估算。如果该距离可忽略不计（`fDist\
  \ <= 3`），则视为选择被按下行的命令；选择操作由 `ListBox_GR.SelectByPoint()` 方法执行。\n\n```\nprivate void\
  \ OnMouseUp (object sender, MouseEventArgs e)\n{\nptMouse_Up = e .Location;\ndouble\
  \ fDist = Auxi_Geometry .Distance (ptMouse_Down, ptMouse_Up);\nint iObj, iNode;\n\
  if (mover .Release (out iObj, out iNode))\n{\nGraphicalObject grobj = mover .ReleasedSource;\n\
  if (e .Button == MouseButtons .Left)\n{\nif (grobj is ListBox_GR)\n{\nif (fDist\
  \ <= 3 && listPressed .Enabled &&\niNode == ListBox_GR .Node_FullArea)\n{\nlistPressed\
  \ .SelectByPoint (e .Location);\n... ...\n```\n\n如果按下了列表框中的某个字符串，则会计算该字符串的编号。如果按下了最后一个字符串之外的空白区域，则不会进行选择，但某些情况下不允许出现空白区域，完美的解决方案是使用一个没有空白区域的列表框。这很容易实现，只需将矩形的最大允许高度设置为所有字符串的总高度即可。\n\
  \n默认情况下，任何 `ListBox_GR` 对象的高度都是无限的，但可以通过 `ListBox_GR.MaxHeightLimit` 属性进行更改。最优列表高度指所有字符串同时可见的尺寸；可通过\
  \ `OptimalHeight()` 方法设置此类高度。包含颜色名称的列表框演示了这两种情况。\n\n```\nprivate void DefaultView\
  \ ()\n{\n... ...\nlistboxColors = new ListBox_GR (...);\nlistboxColors .MaxHeightLimit\
  \ = ListBoxMaxHeight .Optimal;\nlistboxColors .OptimalHeight ();\n... ...\n```\n\
  \n包含颜色名称的列表框是可调整大小的。它可以被压缩，随后右侧边框旁会出现滚动条，但其最后一个字符串之后永远不会出现空白区域，因此在 `listboxColors`\
  \ 内部任意点击都会选中一种颜色。\n\n用户驱动应用程序的规则之一规定，可见性参数的更改不得影响元素的尺寸。然而，此处我们特意将列表框的最大允许尺寸与字符串的总高度相关联。由于该总高度取决于字体大小，我们为此规则设置了可被打破的条件。\n\
  \n调出 `listboxColors` 的菜单，如图 5-15 所示，并增大字体。列表框的尺寸不会改变，但每个字符串会变大，部分字符串将超出矩形范围，矩形右侧会出现滚动条。尝试增大列表框的高度。它起初会增大，但当达到新的最大允许尺寸时，便会停止增长，滚动条也会消失。你将看到所有字符串可见，但字体更大的类似图形。现在再次调出菜单并减小字体。新的最大允许高度也会减小，为避免底部出现空白区域，列表框的实际高度会相应减小。如你所见，可见性参数（字体）的更改仅在绝对必要且列表框被要求按“无空白区域”规则限制其高度时，才会影响对象尺寸。对于所有其他列表框，没有此类要求，字体大小与列表框最大高度之间也不存在关联。\n\
  \n`ListBox_GR` 类使用 `SystemColors` 类中的标准颜色。字体是唯一可更改的参数，因此这是图形控件中唯一没有自带调整表单的类。所需字体的选择通过菜单命令来组织。\n\
  \n\n\n### 组合框\n\n-   文件：`Form_ComboBox.cs`\n-   菜单位置：图形控件 ➤ 组合框\n\n组合框将文本框与列表框结合在一起。文本框可以是可编辑或不可编辑的；列表可以始终可见，也可以在选中某个字符串后下拉并再次隐藏。在普通的\
  \ `ComboBox` 控件中，这四种变体中有三种得到体现；所需的变体由 `ComboBoxStyle` 枚举中的值决定。我的图形组合框使用了一个不可编辑的文本框，因此这对应于\
  \ `DropDownList` 样式；新类的名称中也已提及这一点。由于新对象中没有文本框，因此最好将其两个部分称为*头部*和*列表*。\n\n当列表隐藏时，剩余可见部分仅能水平调整大小。当列表下拉时，`ComboBox_DDList`\
  \ 对象的矩形区域可通过其边角和边以标准方式调整大小。如果列表框的高度不足以显示所有字符串，则右侧会出现一个滚动条。新元素的最大高度受所有字符串总高度的限制，因此底部永远不会显示空白。\n\
  \n在 `Form_ComboBox.cs` 示例中，`ComboBox_DDList` 类的元素在有或没有注释的情况下使用；其中既有独立对象，也有组合成一组的整套组合框（图\
  \ 5-16）。\n\n![../images/501148_1_En_5_Chapter/501148_1_En_5_Fig16_HTML.jpg](img/501148_1_En_5_Fig16_HTML.jpg)\n\
  \n**图 5-16** `ComboBox_DDList` 类的对象\n\n```\npublic class ComboBox_DDList : GraphicalObject\n\
  {\nPointF [] ptsCorner;\nResizing resize;\nbool bDroppedDown, bArrowPressed, bAutoHideOnClickSelect;\n\
  int m_iSel;\nstring [] m_strs;\nFont fntHead, fntList;\nbool bEnabled = true;\n\
  float wBtn = SystemInformation .VerticalScrollBarWidth;\nfloat minWidth = SystemInformation\
  \ .VerticalScrollBarWidth * 5 / 2;\nfloat minListHeight = 30;\n```\n\n列表部分的颜色取自标准\
  \ `SystemColors` 类。新的组合框类允许为头部和列表使用两种不同的字体；依我之见，增大的头部字体可能很有用。也可以为头部字符串使用不同的颜色。\n\
  \n组合框的几何形状由其四个角 (`PointF [] ptsCorner`) 描述；点的编号从左上角开始，顺时针进行。头部右侧有一个特殊的箭头方块。该区域 (`wBtn`)\
  \ 的宽度由 `SystemInformation` 类中的一个值确定。该区域的高度不能小于宽度，但如果为头部使用了大字体，则高度会增加。\n\n一个 `ComboBox_DDList`\
  \ 对象的覆盖层由 12 个节点组成。\n\n-   如果滚动条可见，则它由矩形节点 0 覆盖；否则，该节点会被压缩为零尺寸。\n-   矩形节点 1 覆盖箭头方块。\n\
  -   四个角上的圆形节点 (2–5) 和沿边的四个条状节点 (6–9) 覆盖整个边框，用于调整大小。有四种标准的调整大小变体，因此根据所选类型，这八个节点中的部分或全部可被压缩为零尺寸。\n\
  -   当列表可见时，节点 10 覆盖列表区域。\n-   最后一个节点（节点 11）覆盖对象的整个区域。当然，当列表可见时，该节点的大部分区域会被前一个节点遮挡。\n\
  \n```\npublic override void DefineCover ()\n{\nfloat wHalf_WE = (resize == Resizing.Any\
  \ || resize == Resizing.WE) ? 3 : 0;\nCoverNode [] nodes;\nif (bDroppedDown)\n{\n\
  float rCorner = (resize == Resizing .Any) ? 5 : 0;\nfloat wHalf_NS =\n(resize ==\
  \ Resizing .Any || resize == Resizing .NS) ? 3 : 0;\nnodes = new CoverNode [] {\n\
  new CoverNode (0, ptsCorner [1], 0f, Cursors .SizeNS),\nnew CoverNode (1, ArrowSquare,\
  \ Cursors .Hand),\nnew CoverNode (2, ptsCorner [0], rCorner, Cursors .SizeNWSE),\n\
  new CoverNode (3, ptsCorner [1], rCorner, Cursors .SizeNESW),\nnew CoverNode (4,\
  \ ptsCorner [2], rCorner, Cursors .SizeNWSE),\nnew CoverNode (5, ptsCorner [3],\
  \ rCorner, Cursors .SizeNESW),\nnew CoverNode (6, ptsCorner [0], ptsCorner [3],\
  \ wHalf_WE,\nCursors .SizeWE),\nnew CoverNode (7, ptsCorner [1], ptsCorner [2],\
  \ wHalf_WE,\nCursors .SizeWE),\nnew CoverNode (8, ptsCorner [0], ptsCorner [1],\
  \ wHalf_NS,\nCursors .SizeNS),\nnew CoverNode (9, ptsCorner [3], ptsCorner [2],\
  \ wHalf_NS,\nCursors .SizeNS),\nnew CoverNode (10, new PointF [] {\nnew PointF (ptsCorner\
  \ [0] .X, ptsCorner [0] .Y + hHead),\nnew PointF (ptsCorner [1] .X, ptsCorner [0]\
  \ .Y + hHead),\nnew PointF (ptsCorner [2] .X, ptsCorner [2] .Y),\nnew PointF (ptsCorner\
  \ [3] .X, ptsCorner [3] .Y)},\nCursors .Hand),\nnew CoverNode (11, ptsCorner, Cursors\
  \ .SizeAll) };\nif (hStrings > Height_listpart - 2)\n{\nnodes [0] = new CoverNode\
  \ (0, rcSlider, Cursors .SizeNS);\n}\n}\n...\n```\n\n以上是下拉列表情况下覆盖层设计的代码（图 5-17）。当列表隐藏时，节点数量不变，但其中三分之二会被压缩为零尺寸。在剩余的四个节点中，如果禁止水平调整大小，则还有两个节点会被压缩为零尺寸。\n\
  \n![../images/501148_1_En_5_Chapter/501148_1_En_5_Fig17_HTML.jpg](img/501148_1_En_5_Fig17_HTML.jpg)\n\
  \n**图 5-17** `ComboBox_DDList` 覆盖层的节点编号\n\n```\nelse\n{\n// only four nodes are\
  \ used (1, 6, 7, 11)\nnodes = new CoverNode [] {\nnew CoverNode (0, ptsCorner [0],\
  \ 0f, Cursors .Hand),\nnew CoverNode (1, ArrowSquare, Cursors .Hand),\nnew CoverNode\
  \ (2, ptsCorner [0], 0f, Cursors .Hand),\nnew CoverNode (3, ptsCorner [1], 0f, Cursors\
  \ .Hand),\nnew CoverNode (4, ptsCorner [2], 0f, Cursors .Hand),\nnew CoverNode (5,\
  \ ptsCorner [3], 0f, Cursors .Hand),\nnew CoverNode (6, ptsCorner [0], ptsCorner\
  \ [3], wHalf_WE,\nCursors .SizeWE),\nnew CoverNode (7, ptsCorner [1], ptsCorner\
  \ [2], wHalf_WE,\nCursors .SizeWE),\nnew CoverNode (8, ptsCorner [0], 0f, Cursors\
  \ .Hand),\nnew CoverNode (9, ptsCorner [0], 0f, Cursors .Hand),\nnew CoverNode (10,\
  \ ptsCorner [0], 0f, Cursors .Hand),\nnew CoverNode (11, ptsCorner, Cursors .SizeAll)\
  \ };\n}\nif (!Movable)\n{\nnodes [10] .Cursor = Cursors .NoMove2D;\nnodes [11] .Cursor\
  \ = Cursors .NoMove2D;\n}\ncover = new Cover (nodes);\n...\n```\n\n有时节点编号可能会改变，因此最好依赖关键节点的名称：`Node_Slider`、`Node_Arrow`\
  \ 和 `Node_List`。\n\n与普通 `ComboBox` 控件相比，`ComboBox_DDList` 对象的绘制有两个主要变化；这两个变化都是由缺少焦点引起的。\n\
  \n-   当 `ComboBox` 控件的列表隐藏且该组合框拥有焦点时，文本框中的文本会被高亮显示。在 `ComboBox_DDList` 对象中，头部始终以标准颜色显示。\n\
  -   当鼠标在 `ComboBox` 控件的列表上移动时，光标下的当前行会被高亮显示；这在 `ComboBox_DDList` 对象中没有被复制，因为我更倾向于始终高亮显示当前选中的行。\n\
  \n\n\n当一个对象被按下时，会调用`ComboBox_DDList.Press()`方法。通过角部和边部进行大小调整的方式与其他矩形对象相同。组合框可以通过内部任意一点（箭头小按钮区域除外）进行移动。这个小的箭头区域仅用于切换列表视图（显示或隐藏），因此当该按钮被按下时，光标会固定在按下点。当按钮被按下时，会发生两件有趣的事情。\n\
  \n- `ArrowPressed`属性获得相反的值，箭头方块的背景会变为不同的外观。（该区域看起来像一个带有颜色渐变的按钮。当方块被按下时，相同的颜色会以相反的顺序使用。）\n\
  - `DroppedDown`属性获得相反的值，列表要么出现，要么消失。\n\n```\npublic void Press (Point ptMouse ,\
  \ MouseButtons catcher, int iNode)\n{\n... ...\nif (Enabled)\n{\nif (iNode == ComboBox_DDList\
  \ .Node_Arrow)\n{\nArrowPressed = !ArrowPressed;\nDroppedDown = !DroppedDown;\n\
  }\n}\n... ...\n```\n\n按下组合框时的反应取决于释放的节点。\n\n- 如果释放的是箭头方块，那么`ComboBox_DDList.ArrowPressed`属性获得`false`值，箭头方块的背景恢复为正常外观。\n\
  - 如果释放的是列表区域，且这并非移动结束，而是一次选择（`fDist <= 3`），那么选中的行将由`ComboBox_DDList.SelectByPoint()`方法确定。在普通的`ComboBox`控件中，选择行后列表会自动隐藏。在新类中，列表隐藏行为通过`ComboBox_DDList.AutoHideOnClickSelect`属性来控制；其值可以在调谐表单中更改。对选中行的变化可能会有某种“外部”反应；在当前示例中，仅对`comboColors`对象发生——辅助矩形会用选中的颜色进行绘制。\n\
  \n```\nprivate void OnMouseUp (object sender, MouseEventArgs e)\n{\n... ...\nint\
  \ iObj, iNode;\nif (mover .Release (out iObj, out iNode))\n{\nGraphicalObject grobj\
  \ = mover .ReleasedSource;\nif (e .Button == MouseButtons .Left)\n{\nif (grobj is\
  \ ComboBox_DDList && comboPressed.Enabled && fDist <= 3)\n{\nif (iNode == ComboBox_DDList\
  \ .Node_Arrow)\n{\ncomboPressed .ArrowPressed = false;\nInvalidate ();\n}\n```\n\
  \n```\nelse if (iNode == ComboBox_DDList .Node_List)\n{\ncomboPressed .SelectByPoint\
  \ (e .Location);\nif (comboPressed .AutoHideOnClickSelect)\n{\ncomboPressed .DroppedDown\
  \ = false;\n}\nif (comboPressed .ID == comboColors .ID)\n{\nSetSampleColor ();\n\
  }\nInvalidate ();\n}\n}\n... ...\n```\n\n阻止列表自动隐藏可能看起来是一个小特性，但在某些情况下它可能非常有帮助。每次选择都会改变屏幕上的某些内容，在做出最终决定之前，您希望查看并直观地比较（或评估）所有可能性，这种情况并不少见。如果每次都必须先点击箭头才能看到列表，那么这个过程会变得非常繁琐。这个新功能的实用性通过一组组合框得到了演示。\n\
  \n在当前示例中，我们有一组组合框被组合成一个组（图 5-16）。在我的另一本书 [2] 的一个示例中，也展示过类似外观的组，当时那个旧示例使用的是普通的`ComboBox`控件。我对那个变体的主要不满在于无法同时看到所有组合框的所有可能变体。一个普通的`DropDownList`样式的`ComboBox`在选择后会自动隐藏其列表，因此在任何时刻都只能看到一个`ComboBox`的列表。对于`ComboBox_DDList`对象，在选择时关闭列表并非强制要求。通过菜单命令，您可以同时打开所有组合框（或仅打开所需的那些）的列表，进行所有选择，然后通过一个菜单命令关闭所有列表。\n\
  \n现在让我们注意一下在`ComboBox_DDList`类中使用注释的一个不寻常方面。所有控件都是矩形形状，因此所有普通控件的图形模拟都使用`Comment_ToRectangle`类的注释。在为此类添加注释时，我原本没有预料到会有什么问题，因为完成此操作的方式与其矩形元素的其他类完全相同，但后来我意识到存在一个问题。\n\
  \n在此之前，任何注释都用于*手动调整大小的矩形*。注释的相对位置由两个系数决定，当通过移动其边界来改变矩形大小时，注释的位置会利用这两个系数进行重新计算。手动调整大小意味着矩形尺寸的平滑变化，因此注释的锚点也会平滑移动。在过去的版本中，从未出现过父矩形突然变化的情况，因此也从未有过注释从一个位置跳到另一个位置的情况。组合框区域可能会突然变化，因此必须为组合框的注释设计不同的方案。区别不在于使用不同的注释类；而在于响应主导矩形突然变化时注释位置的计算方式。\n\
  \n当一个`ComboBox_DDList`对象被移动或调整大小时，其区域会平滑变化。在这些情况下，可以通过其`ParentRect`属性通知关联的注释发生了更改，一切都能正常工作。\n\
  \n```\npublic override void Move (int dx, int dy)\n{\nfor (int i = 0; i < 4; i++)\n\
  {\nptsCorner [i] .X += dx;\nptsCorner [i] .Y += dy;\n}\n... ...\nInformComment ();\n\
  }\npublic void InformComment ()\n{\nif (CommentExist)\n{\nm_cmnt .ParentRect = MainElementArea;\n\
  }\n}\n```\n\n但组合框还有一种改变其几何形状的可能性，即通过显示或隐藏字符串列表。根据列表中字符串的数量，这种变化可能是突然的。如果列表中有`N`个字符串，那么高度变化可以用比率\
  \ `1 : (N + 1)` 来描述，在此类变化中一直使用相同的`ParentRect`属性可能会导致问题。\n\n组合框的视图由`ComboBox_DDList.DroppedDown`属性控制；关联的注释通过此属性获知主要部分的矩形区域。将主矩形及其注释的位置关联起来有两种方式；在每种情况下，注释都会获得新的矩形，但反应有所不同。\n\
  \n- 当使用`CommentToRect.ParentRect`属性时，会利用两个现有的系数来改变注释的位置。\n- 当使用`CommentToRect.SetParentRect()`方法时，注释的位置不会改变，但会计算新的系数。\n\
  \n起初，我对组合框区域的任何更改都使用`InformComment()`，因此所有情况下都调用了`ParentRect`属性；有些情况我对结果满意，而有些则不。最后我意识到，在某些情况下`SetParentRect()`方法效果更好，而在这两种情况之间进行选择必须基于注释的初始位置（即其锚点的位置）。图\
  \ 5-18 显示了两个区域（以红线为边界），对于这些区域会调用`SetParentRect()`方法；在所有其他情况下，会调用`InformComment()`方法，而该方法使用了`ParentRect`属性。\n\
  \n![../images/501148_1_En_5_Chapter/501148_1_En_5_Fig18_HTML.jpg](img/501148_1_En_5_Fig18_HTML.jpg)\n\
  \n图 5-18\n\n`SetParentRect()`方法用于注释最初位于两个标记区域之一内部的情况；在所有其他情况下，使用`ParentRect`属性。\n\
  \n\n\n```csharp\npublic bool DroppedDown\n{\nget { return (bDroppedDown); }\nset\n\
  {\n... ...\nPointF ptA = m_cmnt .AnchorPoint;\nif ((ptA.X < MainElementArea.Left\
  \ || MainElementArea.Right < ptA.X) &&\nptA .Y <= MainElementArea .Top + hHead)\n\
  {\nm_cmnt .SetParentRect (MainElementArea);\n}\nelse\n{\nInformComment ();\n}\n\
  ... ...\n```\n`ComboBox_DDList` 对象可以借助一个专用调谐窗体（图 5-19）与其注释一起进行调节。同时，用户无需感知类体系，如果希望更改注释，只需调用此注释上的菜单，通过该菜单的命令执行相同的更改。\n\
  \n![../images/501148_1_En_5_Chapter/501148_1_En_5_Fig19_HTML.jpg](img/501148_1_En_5_Fig19_HTML.jpg)\n\
  \n**图 5-19** `ComboBox_DDList` 对象的调谐窗体\n\n### 复选框\n\n- 文件：`Form_CheckBox.cs`\n-\
  \ 菜单位置：图形控件 ➤ 复选框\n\n对于初学者而言，普通的 `CheckBox` 控件多用于双状态（选中或未选中）变体，但也有三状态选项。虽然设计一个三状态图形副本并非难事，但当前演示的\
  \ `CheckBox_GR` 类仅有双状态版本。\n\n```csharp\npublic class CheckBox_GR : GraphicalObject\n\
  {\nRectangleF rcCheck, rcText;\nfloat m_space;\nSide sideText;\nSideAlignment alignParts;\n\
  string m_text;\nFont m_font;\nColor m_color;\nbool bChecked = true;\nbool bEnabled\
  \ = true;\nbool bFixMouseOnUnmovable = true;\n```\n\n每个复选框由两个完全不同的部分组成：一个小方块和文本。普通的\
  \ `CheckBox` 控件允许更改这些部分的相对位置，但除了文本位于方块右侧的情况外，我从未见过其他变体。`CheckBox_GR` 类提供了 12 种相对位置变体；此参数及其他若干参数可通过调谐窗体进行调节。\n\
  \n关于 `sideText` 字段含义的一个重点说明是：该字段决定了方块和文本的相对位置，其中方块较小，而文本要么较大，要么显著更大（见图 5-20）。无论尺寸差异如何，方块始终是任何复选框的锚定部分，因此\
  \ `sideText` 字段定义了*文本相对于方块的边所放置的位置*。图 5-20 中除一个复选框外，其余均展示了文本位于方块右侧这种最常用的情形；在此情况下，`sideText\
  \ = Side.E`。当在 `CheckBox_GR` 构造函数中省略相应参数时，这也是 `sideText` 字段的默认值。\n\n![../images/501148_1_En_5_Chapter/501148_1_En_5_Fig20_HTML.jpg](img/501148_1_En_5_Fig20_HTML.jpg)\n\
  \n**图 5-20** 复选框由一个小方块和文本组成\n\n复选框由两个明确的部分组成。每个部分都是一个不可调整大小的矩形，因此看似在覆盖层中有两个节点就足够了，但实际上有三个。为了更好观察对象，两个部分之间留有一点间隙，但我不喜欢通过这个间隙捕捉另一个对象的想法，因此该间隙被一个额外的多边形节点覆盖。方块的大小是固定的（`nSquare\
  \ = 18`），而文本的大小则变化不定。根据这两种尺寸的比例，额外节点要么是矩形，要么是梯形。计算该节点的角点（`PointF [] pts`）虽然简单，但由于篇幅过长，此处不再赘述。\n\
  \n```csharp\npublic override void DefineCover ()\n{\nPointF [] pts = new PointF\
  \ [4];\n... ...\nCoverNode [] nodes = new CoverNode [] {\nnew CoverNode (0, rcCheck,\
  \ Cursors .Hand),\nnew CoverNode (1, rcText),\nnew CoverNode (2, pts) };\nif (!Movable)\n\
  {\nnodes [1] .Cursor = Cursors .NoMove2D;\nnodes [2] .Cursor = Cursors .NoMove2D;\n\
  }\ncover = new Cover (nodes);\n... ...\n```\n\n选中或取消选中复选框是通过点击对象的任意点完成的，因此对于更改勾选状态的目的而言，方块和文本这两个部分的作用完全相同。移动对象只允许通过文本进行，而鼠标光标在方块内按下时会被固定，直至鼠标松开。复选框的覆盖层及其工作逻辑非常简单，因此对复选框按下的唯一反应是存储按下点的位置。\n\
  \n```csharp\npublic void Press (...)\n{\nptPressed = ptMouse;\n}\n```\n\n对元素按下的反应是在鼠标松开时刻确定的，并取决于鼠标按下点和松开点之间的距离。如果距离可忽略不计（`fDist\
  \ <= 3`），则视为更改勾选状态，此操作通过 `Checked` 属性完成。由于光标位置是固定的，且鼠标只能在同一点松开，因此这是对方块内点击唯一可能的反应。\n\
  \n\n```csharp\nprivate void OnMouseUp(object sender, MouseEventArgs e)\n{\n    ptMouse_Up\
  \ = e.Location;\n    double fDist = Auxi_Geometry.Distance(ptMouse_Down, ptMouse_Up);\n\
  \    int iObj, iNode;\n    if (mover.Release(out iObj, out iNode))\n    {\n    \
  \    GraphicalObject grobj = mover.ReleasedSource;\n        if (e.Button == MouseButtons.Left)\n\
  \        {\n            if (grobj is CheckBox_GR && checkPressed.Enabled && fDist\
  \ <= 3)\n            {\n                checkPressed.Checked = !checkPressed.Checked;\n\
  \                ButtonsVisibililty();\n                RenewMover();\n        \
  \    }\n            ...\n        }\n    }\n}\n```\n\n对象的移动由其类的`MoveNode()`方法描述。如果被按下的节点用于移动整个对象，则对所有对象存在一个标准做法，且代码简单。\n\
  \n- 对于可移动对象，调用其`Move()`方法。\n- 对于不可移动对象，光标固定在按下点。\n\n对于`CheckBox_GR`类，如果按下发生在小方块内部，光标始终固定，但以下代码几乎是标准的：\n\
  \n```csharp\npublic override bool MoveNode(...)\n{\n    bool bRet = false;\n   \
  \ if (catcher == MouseButtons.Left)\n    {\n        if (Movable)\n        {\n  \
  \          if (iNode == 0)\n            {\n                AdjustCursorPosition(ptPressed);\n\
  \            }\n            else\n            {\n                Move(dx, dy);\n\
  \                bRet = true;\n            }\n        }\n        ...\n    }\n}\n\
  ```\n\n如上代码所示，对于可移动复选框实现了标准反应，而对于不可移动元素则有所不同。在查看按下不可移动复选框的情况之前，我们先提出一个更一般的问题：按下*不可移动元素*时，你期望得到什么反应？\n\
  \n可移动和不可移动元素在视觉上没有区别，因此任何元素的当前可移动状态只能通过鼠标按下并尝试移动时的反应来揭示。可移动元素会随鼠标移动，但按下不可移动对象时，可能有两种完全不同的反应：\n\
  \n- 光标固定在按下点，在鼠标释放前不允许任何鼠标移动。\n- 光标可自由移动，但没有任何元素跟随移动。\n\n我更喜欢第一种方案，因此在大多数演示类中，实现了鼠标在不可移动元素上固定的想法。然而，形成个人观点的最佳方式是比较两种方案。为方便比较，在`CheckBox_GR`类中两种反应都是可能的。\n\
  \n`CheckBox_GR.MoveNode()`方法中的额外几行代码让你拥有两种变体：\n\n```csharp\npublic override bool\
  \ MoveNode(...)\n{\n    bool bRet = false;\n    if (catcher == MouseButtons.Left)\n\
  \    {\n        if (Movable)\n        {\n            ...\n        }\n        else\n\
  \        {\n            if (bFixMouseOnUnmovable)\n            {\n             \
  \   AdjustCursorPosition(ptPressed);\n            }\n        }\n    }\n    return\
  \ (bRet);\n}\n```\n\n在当前示例中，组内的复选框以其标准方式使用，因此如果此处所有可显示的图片均可用，则所有这些复选框都是启用的。为演示一些特殊情况，组外的复选框有一个不同的菜单。该菜单的命令允许你比较不可移动复选框在固定光标和自由光标两种情况下的表现，并查看复选框变为禁用时视图的变化。\n\
  \n`CheckBox_GR`对象的调优通过特殊窗体`Form_Tuning_CheckBox.cs`（图 5-21）进行组织。复选框在视觉上很简单，因此其调优形式也很简单。方块和文本的相对位置通过在小矩形内移动小方块来设置，矩形周围带有*Text*字样。\n\
  \n![../images/501148_1_En_5_Chapter/501148_1_En_5_Fig21_HTML.jpg](img/501148_1_En_5_Fig21_HTML.jpg)\n\
  \n图 5-21  \n`CheckBox_GR`对象的调优窗体\n\n请注意一点：在调优窗体中，围绕一个更大的矩形移动小方块更为方便，但在正在调优的原始复选框中，小方块充当锚定元素的角色，因此方块将保持不动，而其文本会移动到新位置。\n\
  \n本章的第一个示例使用了多张图片来演示`Button_Image`类。按钮对所有带有边和角节点的矩形使用近乎标准的覆盖方式。这种沿边界的节点系统允许你以任意方式调整矩形大小。对于许多矩形来说，这是最佳的调整大小方式，但对于图片而言，这种任意调整大小是多余的。照片有不同的宽高比，但对于每张特定图片，该比例是固定的，并且在调整大小的过程中无需更改。在当前示例中，`Rectangle_Image`类的对象用于图片演示。这些矩形仅通过角点调整大小，且在此过程中其宽高比保持不变，因此矩形始终具有适合特定图片演示的最佳尺寸。矩形上的菜单允许你改变它们在屏幕上的显示顺序。\n\
  \n\n## 列表视图\n\n-   文件：`Form_ListView.cs`\n-   菜单位置：图形控件 ➤ 列表视图\n\n前面我们讨论了列表框和组合框；这些对象使用单列字符串，可从中选择任意项。列表视图允许你显示由多部分组成的更复杂的数据。为此，列表视图以行和列的形式呈现这些数据，每个单元格以字符串形式显示部分数据。列表视图是显示大量数据的一种紧凑方式。见图\
  \ 5-22。\n\n![../images/501148_1_En_5_Chapter/501148_1_En_5_Fig22_HTML.jpg](img/501148_1_En_5_Fig22_HTML.jpg)\n\
  \n图 5-22\n\n`ListView_GR` 对象的外观与展开列表的 `ComboBox_DDList` 对象相似，它们的覆盖层之间也有很多相似之处；比较图\
  \ 5-23a 和图 5-17。`ListView_GR` 类的覆盖层有一个不同于其他图形控件覆盖层的特性：新覆盖层中的节点数量不是固定的。节点数量取决于列数；对于\
  \ N 列的列表，节点数为 9 + N。\n\n![../images/501148_1_En_5_Chapter/501148_1_En_5_Fig24_HTML.jpg](img/501148_1_En_5_Fig24_HTML.jpg)\n\
  \n图 5-23b\n\n![../images/501148_1_En_5_Chapter/501148_1_En_5_Fig23_HTML.jpg](img/501148_1_En_5_Fig23_HTML.jpg)\n\
  \n图 5-23a\n\n-   滚动条由矩形节点 0 覆盖；如果不需要滚动条，则该节点会被压缩到零大小。\n-   四个角上的圆形节点 (1–4) 和沿着边的四个条状节点\
  \ (5–8) 覆盖整个边框，用于调整大小。有四种标准的大小调整变体，因此根据所选类型，这八个节点中的部分或全部可以被压缩到零大小。\n-   数据以列的形式显示。这些列的标题始终由细线分隔，而列表主体区域中垂直网格的外观由用户决定。这些垂直线由节点覆盖，但这些节点的长度取决于网格外观；图\
  \ 5-23 展示了两种变体。这些节点的数量取决于列数；在图 5-23a 中，它们是节点 9–12。\n-   最后一个节点覆盖列表视图的整个区域。在我们的五列列表中，它的编号是\
  \ 13。\n\n`ListView_GR` 和 `ComboBox_DDList` 对象在外观上的相似性意味着使用相同的参数，这也意味着在调优表单上的相似性。`ListView_GR`\
  \ 对象的调优表单（图 5-24）与组合框的调优表单（图 5-19）几乎相同。\n\n在我看来，为标题和列表主体部分使用不同的字体可以让对象的外观更好，因此可以从构建时就进行组织。所有单元格的字符串都放在一个数组中；字符串的顺序是从上到下，每一行内从左到右。\n\
  \n```\npublic ListView_GR (Form frm, Mover mvr, RectangleF rc,\nstring [] strHeads,\
  \ Font fntHead,\nstring [] strInner, Font fntList, int iSel)\n```\n\n`ListView_GR`\
  \ 对象与周围表单的其他元素之间可以有不同类型的交互。\n\n-   完全没有交互。\n-   列表中的选择变更可能导致其他元素发生变化。\n-   元素的变化可能导致\
  \ `ListView_GR` 对象发生变化。\n\n当前示例中的三个 `ListView_GR` 对象演示了这三种不同的情况。\n\n![../images/501148_1_En_5_Chapter/501148_1_En_5_Fig25_HTML.jpg](img/501148_1_En_5_Fig25_HTML.jpg)\n\
  \n图 5-24\n\n包含州及其首府信息的列表 —— `listStates` —— 演示了最简单的无任何交互的情况。此列表在构建时获取数据，此后数据不再更改。此列表的标题使用与主体部分相同类型的字体，但略微放大。\n\
  \n```\nprivate void DefaultView_listStates (PointF ptLT)\n{\nlistStates = new ListView_GR\
  \ (this, mover,\nnew RectangleF (ptLT .X, ptLT .Y, 200, 210),\nnew string [] { \"\
  State\", \"Abr.\", \"Statehood\", \"Capital (since)\" },\nAuxi_Common .FontZoomed\
  \ (fntSelected, 1.1),\nAuxi_Common .strStatesCapitals, fntSelected, -1);\nlistStates\
  \ .MaxHeightLimit = ListMaxHeight .Optimal;\nlistStates .OptimalWidth ();\nlistStates\
  \ .UnderlinedItems = new int [] { 9, 19, 29, 39 };\n... ...\n```\n\n这段代码提到了 `ListView_GR`\
  \ 类的几个重要特性。\n\n-   默认情况下，对象的高度可以更改，而不管行数及其总高度如何，因此最后一行之外可能出现空白区域。但是，如果（通过鼠标单击）选择特定行会导致进一步的操作，那么单击空白区域则毫无意义。为了避免出现空白区域，可以借助\
  \ `MaxHeightLimit` 属性将列表高度限制在最后一行。\n-   用户可以在任何时刻更改任何列的宽度，而 `ListView_GR.OptimalWidth()`\
  \ 方法则根据每列中最长的字符串确定其宽度，并额外增加几个像素的空白空间以获得更好的视图效果。\n\n```\nlistStates .MaxHeightLimit\
  \ = ListMaxHeight .Optimal;\n```\n\n-   当列表中有大量行时，为某些行添加下划线可以使阅读更容易。有一个工具可以在列表中组织任意行的下划线。在此列表中，每第\
  \ 10 行都有下划线。\n\n```\nlistStates .OptimalWidth ();\n```\n\n```\nlistStates .UnderlinedItems\
  \ = new int [] { 9, 19, 29, 39 };\n```\n\n`listStates` 仅显示预先准备好的数据，而 `listColors`\
  \ 则代表在列表中选择更改会导致表单中其他元素发生变化的情况。选择更改由 `ListView_GR.SelectByPoint()` 方法完成。当前列表中选中的更改会导致关联矩形的颜色发生变化。\n\
  \n```\nprivate void OnMouseUp (object sender, MouseEventArgs e)\n{\nptMouse_Up =\
