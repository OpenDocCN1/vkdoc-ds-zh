  \n\n\n```csharp\npublic class Button_Drawing : Button_GR\n{\n    Delegate_DrawInRect\
  \ m_draw = null;\n```\n\n最简单的 `Button_Drawing` 构造函数包含基类的三个参数，外加所需的绘图方法。\n\n```csharp\n\
  public Button_Drawing (Form frm, Mover mvr, RectangleF rc,\n    Delegate_DrawInRect\
  \ drawmethod)\n    : base (frm, mvr, rc)\n{\n    m_draw = drawmethod;\n}\n```\n\n\
  初始化时传递的绘图方法有两个参数。第二个参数是不含边框的按钮区域。绘图结果显示在该区域内，但这绝不意味着您的绘图方法必须严格限定在该矩形内部完成。通常情况下确实如此，例如在按钮顶部绘制箭头这类简单场景，在提供的矩形内绘制即可，一切看起来都很好。但有时按钮上的绘图需要是一幅更大画面中的一部分。在这种情况下，您可以计算大画面相对于传入矩形的位置，并绘制完整画面，无需考虑任何限制；裁剪是自动完成的，因此只有适合该声明矩形的部分才会显示在屏幕上。这样一来，不仅绘图更简单，而且绘图可以取决于按钮的位置、按钮与其他屏幕元素的相对位置，以及其他许多因素。按钮的大小也可以取决于其位置（例如，不需要的按钮可以移到窗体一侧并缩小），绘图可以取决于按钮大小，并在更大区域中显示更多细节。使用\
  \ `Button_Drawing` 对象可以实现许多有趣的功能。\n\n用于调用字体和颜色选择标准对话框的小按钮通常声明为不可调整大小，但这仅仅是为了避免它们变得过小。默认情况下，所有\
  \ `Button_Drawing` 元素都是可调整大小的。在 `Form_FillHoles.cs`（图 2-43）中，使用一组按钮来选择所需的插头。在第二章末尾讨论该示例时，尚不宜关注该组或其中所用按钮的某些特性。现在很容易理解，内部\
  \ `Button_Drawing` 元素的移动/调整大小会自动改变 `Group_ArbitraryElements` 类的组，因此组的原始视图可以在几秒钟内改变。如果某些用户在原始组中订购七边形或八边形的插头时遇到问题，那么在稍加更改的组（图\
  \ 5-6）中就不应再出现此类问题。每个按钮的大小和位置由用户决定，因此可以有无数种变体。\n\n![../images/501148_1_En_5_Chapter/501148_1_En_5_Fig6_HTML.jpg](img/501148_1_En_5_Fig6_HTML.jpg)\n\
