  \n首先是当捕获到圆弧端点进行移动时的光标轨迹。在撰写关于任何对象旋转的文章时，我始终强调，为了获得更高的精度，必须将光标移离旋转中心更远，这就是为什么在整个旋转过程中光标的移动半径从不固定。然而，如果从美学或任何其他角度出发，你希望让光标保持在同一个圆形轨迹上，这很容易实现；当前示例就展示了这一点。当按下圆弧端点时，会计算圆弧中心与按下点之间的距离（`rCursor`）。\n\
