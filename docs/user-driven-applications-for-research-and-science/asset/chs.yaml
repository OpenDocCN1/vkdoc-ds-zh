  \n**图 5-5** `Button_Text`元素的调整\n\n此示例中`Button_Text`元素的小菜单包括一个命令，用于在启用/禁用模式之间切换按下的按钮。在任何实际应用程序中，这仅由程序逻辑控制，但我特意添加了此命令以演示`Button_Text.Draw()`方法的所有可能性。\n\
