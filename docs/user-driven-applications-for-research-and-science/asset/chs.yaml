  \ &&\n        busPressed.ID_OnHead == busFound.ID) ||\n        id == busFound.ID_OnHead\
  \ ||\n        id == busFound.ID_OnTail)\n    {\n        // 两端不能连接到同一条总线\n      \
  \  // 两条总线不能相互连接\n    }\n    else\n    {\n```\n\n看起来我们成功地避开了所有陷阱，释放的总线端可以连接到释放点找到的另一条总线。此操作需要一些计算，并更改两个对象的几个参数。\n\
  \n- 计算精确的连接点（`ptOnBus`）。\n- 释放的总线端（头端或尾端）必须采用此计算出的位置。\n- 在计算出的点处组织新的连接（`con`）。\n\
  - 这是一个到找到的总线的新连接。每条总线都保存着所有连接的信息，因此必须使用 `Bus.AddConnection()` 方法更新找到的总线中的信息。\n-\
  \ 新连接被包含在完整的连接 `List` 中。\n- 屏幕上会出现新的可移动对象，因此必须更新移动器队列。\n\n```\n    PointF ptOnBus\
  \ =\n    Auxi_Geometry.Polyline_NearestPoint (\n    ptMouse_Up, busFound.Points);\n\
  \    if (end_type == EndType.Head)\n    {\n        busPressed.HeadPoint = ptOnBus;\n\
  \    }\n    else\n    {\n        busPressed.TailPoint = ptOnBus;\n    }\n    BusConnection\
  \ con = new BusConnection (this, mover, ptOnBus, busPressed,\n    end_type, busFound);\n\
  \    busFound.AddConnection (con);\n    m_connections.Add (con);\n    RenewMover\
  \ ();\n    }\n    break;\n}\nelse if (objFound is Person)\n    ... ...\n```\n\n\
  家谱应用程序提供了多种设计树状图的命令。这些命令的命名方式使其更易于从人际关系角度理解（例如 `new couple` 或 `new siblings`），但实际上，组织的元素内部并没有关于这些声明关系的任何信息，也没有构造元素所使用命令的痕迹。只有以不同方式相互链接的\
  \ `Bus`、`Person` 和 `BusConnection` 元素。同一个树状图可以通过多种不同的方式构建，并且三个列表（`m_people`、`m_buses`\
  \ 和 `m_connections`）中元素的顺序可能不同。无论你是喜欢使用将连接元素组放置在屏幕上的命令，还是喜欢使用每次添加一条总线或一个人的其他命令，这都无关紧要。\n\
  \n例如，前面几页讨论过的 `New couple` 命令可以用以下命令和操作序列替代：\n\n1.  在一个点使用 `New person` 命令，然后在稍偏一点的地方再次使用相同命令；屏幕上将出现两个独立的\
  \ `Person` 对象。\n2.  使用 `New bus` 命令在屏幕上放置一条新总线；初始化时，此总线未连接到任何东西。\n3.  移动新总线的一端，并将其释放在某个\
  \ `Person` 对象内部；该总线将连接到该对象（视觉上连接到该对象的边界）。\n4.  移动总线的另一端，并将其释放在第二个 `Person` 对象内部；该总线端将连接到该对象的边界。\n\
  \n此序列比单个 `New couple` 命令长得多，但对于所设计树状图的工作而言，这并不重要。\n\n如果需要断开总线连接，该怎么办？在连接点处调用菜单，并选择此菜单上唯一的命令——`Delete\
  \ connection`（图 7-37a）。总线将被断开，并且在大多数情况下，其端点将移开，以在两个元素之间形成视觉间隔。如果总线长度减小会导致其变得过小，则不会移动端点，也不会形成间隔。无论是否形成间隔，总线都将被断开。具有自由端的总线是一种异常情况，因此在断开连接后，总线会使用警告颜色绘制（图\
  \ 7-37b）。\n\n![../images/501148_1_En_7_Chapter/501148_1_En_7_Fig43_HTML.jpg](img/501148_1_En_7_Fig43_HTML.jpg)\n\
  \n图 7-37b\n\n断开连接后，两个对象之间存在间隔，并且总线使用警告颜色\n\n![../images/501148_1_En_7_Chapter/501148_1_En_7_Fig42_HTML.jpg](img/501148_1_En_7_Fig42_HTML.jpg)\n\
  \n图 7-37a\n\n连接点上的菜单只有一个命令\n\n可以在家谱元素上调用多个菜单。其中一些菜单很小，只有一两个命令，但 `Person` 对象和总线段上的菜单非常大，包含修改现有家谱和添加新部分的命令。\n\
  \n总线段上的菜单（图 7-38）可以在任何总线上调用，无论这条总线是否连接到任何东西，或者完全是自由的，这都无关紧要。和往常一样，菜单在按下总线的位置处被调用。如果所选菜单命令带来新的元素到屏幕上，则此新部分将在同一点连接到被按下的总线。以下四幅图展示了将新元素放置到屏幕上的命令，被按下的总线以宽蓝线显示。\n\
  \n![../images/501148_1_En_7_Chapter/501148_1_En_7_Fig44_HTML.jpg](img/501148_1_En_7_Fig44_HTML.jpg)\n\
  \n图 7-38\n\n总线段上的菜单\n\n| *Modify (bus)* | 此命令打开辅助窗体（图 7-21），允许你更改被按下总线的外观。 |\n|\
  \ *Movable (bus)* | 此命令允许你更改被按下总线的可移动性，但此命令只能应用于两端都自由的总线。这对于真实的族谱来说是一种极其罕见和奇怪的情况，但它是有可能的，所以我决定在菜单中保留此命令。\
  \ |\n| *Use this bus as sample for all* | 假设你花了一些时间构建家谱，然后决定更改所有总线的外观。你可以通过使用其调整窗体单独更改任何总线的外观，但在大型树状图中对每条总线都重复此过程将花费太长时间。相反，你可以将一条总线的外观更改成你喜欢的任何样式，然后使用此命令；所有总线都将根据此样本更改其外观。\
  \ |\n| *Add parents* | 一对带有它们之间一条总线的 `Person` 对象代表一对夫妇；父母之间的总线与被按下的总线相链接（图 7-39）。这对新的\
  \ `Person` 元素与图 7-35 中的一对完全相同；结果中的唯一区别在于这一对元素与被按下总线之间的链接。 |\n\n\n\n![../images/501148_1_En_7_Chapter/501148_1_En_7_Fig45_HTML.jpg](img/501148_1_En_7_Fig45_HTML.jpg)\n\
  \n**图 7-39** “添加父母”命令的结果\n\n| *添加单亲* | 如果有关于一位家长的信息，或者用户只想在家谱中包括一对夫妇中的一个人，那么用户可以使用“添加单亲”命令。因为屏幕上只会出现一个新的`Person`对象（图\
  \ 7-40），并且这个新对象至少需要更改一些信息，因此系统会自动在该新对象上调用一个用于调整`Person`对象的辅助表单。 |\n|---|---|\n\n\
  ![../images/501148_1_En_7_Chapter/501148_1_En_7_Fig46_HTML.jpg](img/501148_1_En_7_Fig46_HTML.jpg)\n\
  \n**图 7-40** 添加单亲\n\n| *添加孩子* | 此命令与前一个命令类似，但新的`Person`对象出现在被点击的连接线下方（图 7-41）。使用此命令有两种标准情况：某对夫妇只有一个孩子，或者有超过六个兄弟姐妹的情况。六个兄弟姐妹的屏幕元素可以通过一个命令来组织；如果需要更多兄弟姐妹，可以在此兄弟姐妹上方的连接线上使用此命令来添加。\
  \ |\n|---|---|\n\n![../images/501148_1_En_7_Chapter/501148_1_En_7_Fig47_HTML.jpg](img/501148_1_En_7_Fig47_HTML.jpg)\n\
  \n**图 7-41** 添加单个孩子\n\n| *添加多个孩子* | 有一个子菜单可以在屏幕上放置 2 到 6 个兄弟姐妹；图 7-42 显示了两个兄弟姐妹的变体。如果有超过六个兄弟姐妹，你可以用一个命令放置六个，然后根据需要在兄弟姐妹上方的连接线上反复应用“添加孩子”命令。我已经解释过添加多个兄弟姐妹的步骤顺序。一切始于一条由三段折线设计的连接线；然后第一个和最后一个兄弟姐妹连接到这条连接线的两端。为了更好理解，图\
  \ 7-42 中的连接点以特殊方式进行了标记。 |\n|---|---|\n\n![../images/501148_1_En_7_Chapter/501148_1_En_7_Fig48_HTML.jpg](img/501148_1_En_7_Fig48_HTML.jpg)\n\
  \n**图 7-42** “添加多个孩子”的结果：两个兄弟姐妹\n\n| *连接新总线* | 新的短连接线连接到被点击的连接线上；新连接线的另一端是自由的。你可以重新配置新连接线，移动其自由端，并将其连接到任何所需的对象（连接线或人物）。\
  \ |\n|---|---|\n\n家谱的构建不仅可以将一组新元素连接到连接线，还可以连接到任何`Person`对象；这通过可以在该类对象上调用的菜单命令来完成（图\
  \ 7-43）。从可用添加新元素命令列表可以看出，这些命令与空白位置菜单的命令（图 7-33）以及连接线段菜单的命令（图 7-38）类似。\n\n![../images/501148_1_En_7_Chapter/501148_1_En_7_Fig49_HTML.jpg](img/501148_1_En_7_Fig49_HTML.jpg)\n\
  \n**图 7-43** 人物对象上的菜单\n\n`Person`对象菜单中的第一个命令会调用其调整表单，这在 40 页前已经演示过（参见图 7-29），但在真实的家庭树应用程序中，用户需要编辑所有信息片段，因此所有三个文本框都允许此类编辑（图\
  \ 7-44）。\n\n![../images/501148_1_En_7_Chapter/501148_1_En_7_Fig50_HTML.jpg](img/501148_1_En_7_Fig50_HTML.jpg)\n\
  \n**图 7-44** 人物对象的调整表单\n\n如果你清除了出生和死亡文本框中的信息，那么这些注释将不会出现在`Person`对象中。如果你尝试对姓名字段进行同样的操作，那么*未知*这个词将代替姓名出现。此调整表单允许你单独更改每个注释的字体和颜色，尽管我认为用户可能希望在家谱中对元素有更标准化的视图。我假设此调整表单主要用于更改注释文本。按照这种优先使用方式，组内的六个小按钮就变得多余了，因此它们的外观通过空白位置菜单的命令来调节。\n\
  \n`Person`对象菜单的主要部分包含六个不同的命令，用于为被点击的人添加一些亲属；其中四个命令会添加一个新的`Person`对象。我想再次强调，菜单中的命令是按照现有人员与新人之间的关系来表述的，但这些关系并未存储在家谱中的任何地方。家谱中只有`Bus`、`Person`和`BusConnection`类的元素。\n\
  \n图 7-45 演示了使用这四个添加单个`Person`对象的命令的结果。该对象会与调整表单一起出现在屏幕上；其发生方式与图 7-34 所示完全相同。在图 7-45\
  \ 的所有版本中，黄色矩形代表调用菜单的现有`Person`对象；青色矩形则是使用某个命令后出现的结果。如你所见，这四个不同的命令将新矩形放置在现有矩形的一侧或另一侧，这也是这四个命令之间的唯一区别。\n\
  \n![../images/501148_1_En_7_Chapter/501148_1_En_7_Fig54_HTML.jpg](img/501148_1_En_7_Fig54_HTML.jpg)\n\
  \n**图 7-45d** “添加孩子”命令\n\n![../images/501148_1_En_7_Chapter/501148_1_En_7_Fig53_HTML.jpg](img/501148_1_En_7_Fig53_HTML.jpg)\n\
  \n**图 7-45c** “添加单亲”命令\n\n![../images/501148_1_En_7_Chapter/501148_1_En_7_Fig52_HTML.jpg](img/501148_1_En_7_Fig52_HTML.jpg)\n\
  \n**图 7-45b** “添加配偶”(右侧) 命令\n\n![../images/501148_1_En_7_Chapter/501148_1_En_7_Fig51_HTML.jpg](img/501148_1_En_7_Fig51_HTML.jpg)\n\
  \n**图 7-45a** “添加配偶”(左侧) 命令\n\n一个变体可以通过以下三个简单步骤转换为另一个变体：\n\n- 将青色矩形移动到黄色矩形的另一侧。\n\
  - 将黄色矩形上的连接线端点移动到青色矩形当前所在的那一侧。\n- 移动青色矩形上的连接线端点，使得连接线显示为两个矩形之间的最短直线。\n\n其他几个命令需要一些说明。\n\
  \n| *连接新总线* | 此菜单在矩形内部某处调用。执行此命令后，新连接线将连接到距菜单调用点最近的边界点。如果需要，可以轻松地围绕边界移动新的连接点。 |\n\
  |---|---|\n| *设置标准参数* | 此命令有一个子菜单，提供更改部分或全部可见性参数的选项。我之前提到过存在保持标准视图的`Bus`和`Person`元素，也提到用户可以在一定程度上更改这些视图。\
  \ |\n\n在“家庭树”应用程序的主菜单中，有一个“设置”项；如果你点击此菜单命令，将打开`Form_FamilyTree_NewElemParams.cs`（图\
  \ 7-46）。\n\n![../images/501148_1_En_7_Chapter/501148_1_En_7_Fig55_HTML.jpg](img/501148_1_En_7_Fig55_HTML.jpg)\n\
  \n**图 7-46** 一个专门的表单允许你设置用于设计所有新元素的参数\n\n\n\n`Bus` 组允许您设置所有新总线的参数，因此该组中的元素与总线调谐表单（图\
  \ 7-21）中显示的相同。\n\n`Distances` 组允许您定义通过不同菜单命令添加到家谱中的多个 `Person` 对象之间的标准距离。调节值为配偶及兄弟姐妹之间矩形的水平间距，以及父母与子女之间的垂直间距。\n\
  \n`Person` 组中的元素允许您为未来的 `Person` 对象设置所有字体和颜色。此表单左上角有一个 `Person` 对象。所需的大小通过调整此示例来设置；所有三个注释（名称、出生和死亡）的定位系数通过移动注释来设置。\n\
  \n我想强调的是，当您关闭此辅助表单并返回家谱应用程序的主表单时，此表单中的所有更改不会立即生效。这些设置仅在您开始向家谱添加新元素时使用。您可以将这些设置应用于现有家谱，但由于此操作可能会破坏精心准备的大树视图，从而造成有害影响，因此在更改整体视图的操作中，我特意加入了几个中间步骤。\n\
  \n首先，在某个 `Person` 对象上调用菜单，并使用子菜单中的命令 `设置标准参数`。我建议不要只对一个 `Person` 对象执行此操作，而是对多个 `Person`\
  \ 对象执行，并且可能使用子菜单中的不同命令。如果您对结果满意，并希望进行全局更改，则在同一 `Person` 对象上调用菜单，并使用命令 `用作样本`。\n\n\
  更改总线不会导致灾难性后果，但最好也分两步进行全局更改。首先，在某个总线上调用菜单，并使用 `修改（总线）` 命令。如果您对结果满意，则调用同一菜单，并将此总线用作其他所有总线的样本。\n\
  \n让我们回到主家谱。`Form_FamilyTree.cs` 的主菜单中有两个有用的命令。`文件 ➤ 另存为` 命令允许您将家谱保存为二进制文件，而 `文件\
  \ ➤ 打开` 命令允许您从文件中恢复家谱。\n\n真实的家族树可能很大，您极有可能需要比屏幕更大的空间来显示它。您可以轻松地以任意方式滚动整棵树；只需在任意空白处按下左键并开始移动即可。这种滚动整棵家谱的方法在之前的示例中已经解释过。\n\
  \n不要害怕在设计中进行任何操作或犯错，因为此家谱应用程序中实施了若干规则。\n\n- 任何用户的操作都不会对家谱设计造成致命影响。如果您放置了错误的元素，可以通过上下文菜单中的命令删除它；如果您放置了错误的元素组合，可以对每个元素使用\
  \ `删除` 命令。如果总线连接到了错误的元素，只需断开连接（通过在错误连接处的菜单中使用命令），然后继续您的设计。\n\n- 设计中有一些限制：总线不能连接到自身；总线两端不能连接到同一总线；两条总线不能通过相互连接形成环路。除此之外，其他操作都是允许的。\n\
  \n- 通过调整可见性参数，您可以添加从您的角度看可能重要的个人信息，但这些信息不会在任何标准命令系统中提及。例如，如果您想用两条总线突出显示配偶之间的联系，您可以这样做。没有人会阻止您尝试这样做，也不允许您在相同的两个\
  \ `Person` 对象之间组织两条并行的总线。或者，您可以在总线中为宗教婚姻和民事婚姻标记不同的方式。\n\n- 不仅可以更改元素的视觉参数，甚至一些标准的家族联系也可以与之前描述的命令系统所建议的方式不同。图\
  \ 7-47a 显示了使用几页前讨论的两个命令的结果：首先设置了一对夫妇；然后在他们之间的总线上使用另一个命令添加了三个孩子。同一个由父母和三个孩子组成的家庭可以用不同的方式表示（图\
  \ 7-47b）。第一个命令是相同的；然后，将添加单个孩子的命令应用到上方总线三次。\n\n![../images/501148_1_En_7_Chapter/501148_1_En_7_Fig57_HTML.jpg](img/501148_1_En_7_Fig57_HTML.jpg)\n\
  \n图 7-47b\n\n父母矩形作为标准命令的结果出现，而孩子则通过在上方总线上调用命令逐个添加\n\n![../images/501148_1_En_7_Chapter/501148_1_En_7_Fig56_HTML.jpg](img/501148_1_En_7_Fig56_HTML.jpg)\n\
  \n图 7-47a\n\n此视图是使用两个标准命令的结果\n\n这是一个标准的用户驱动型应用程序。这是您的应用程序，您是主导者，您可以完全按照自己的意愿组织视图。\n\
  \n\n\n## 函数查看器：一窥科学应用\n\n在本示例的描述中，你将看到一些简短的代码片段，因为所有元素及其工作方式我们都已经讨论过了。本节要演示的主要内容，是一个相对复杂、用户操作和请求无法预测的应用的总体设计。所有科学应用都必须遵循一条简单规则来开发：“用户能做一切。”作为开发人员，我必须按照这条规则来提供程序。许多读者可能会觉得，开发允许用户为所欲为的应用会给程序员带来巨大的、不堪重负的负担，所以我想证明这种看法并不正确。设计者不需要对一切能想象到和无法想象的情况都做出响应，而是应该基于那些完全由用户控制的元素来开发程序。\n\
  \n在 2001 年至 2004 年间，我参与开发了一个成功销往全球的大型工程程序。该程序用于分析大型电网，包含数十个对话框，允许熟练的用户操控数百个参数，以分析不同的场景和情况。与这类程序的常规做法一样，许多计算的结果不仅要通过数字和填充的表格来展示，还需要绘制成图表。（人们以图形形式查看数据时，理解和评估数据的效果要好得多。）2004\
  \ 年年中，我们这些该程序的开发者在讨论新版本的想法。其中一个想法是增加结果的图形化展示，并赋予用户对此展示的一定控制权，例如，让用户决定显示的绘图区域数量。\n\
  \n这个程序是以经典方式设计的。当时还没有人谈论屏幕对象的可移动性。整个应用是自适应界面的一个经典例子，因此未来的所有工作场景都必须提前构思好并编入代码。我一直在思考一种简便的工具（对用户而言），让用户能够声明所需的绘图数量及其位置。按照当时的惯常做法，所有对话框都基于普通控件来设计。无论我尝试何种方案，声明绘图位置和大小的机制看起来都不够优雅，但至少能工作，我也希望在过程中能想出更好的办法。然而，有一个小问题我甚至找不到一个稍微靠谱的解决方案。\n\
  \n在科学文章中，你经常会看到一个绘图区域中，几条曲线以不同颜色和线型显示。曲线之间的差异是由某个参数的变化引起的，因此曲线需要附上注释，说明其关联的参数。当文章作者准备此类图片用于发表时，要显示的曲线是已知的，为曲线附近的注释选择最佳位置也不是问题，因此在科学期刊中，整张图看起来总是很美观。\n\
  \n当你开发一个需要展示此类绘图区域的应用时，你事先并不知道内部会呈现什么样的曲线，因此你不得不将所需的注释放在绘图区域内部之外的某个地方。你能为它们在绘图区域下方或侧面预留一些空间吗？可以，但是：\n\
  \n*   注释会占用大量宝贵的屏幕空间。\n*   注释会远离曲线，从而难以将曲线与注释关联起来（尤其是在同一区域有多条曲线时）。\n*   还有围绕绘图区域的坐标轴刻度问题。可能存在多个坐标轴及其自身的注释，因此刻度位置与不同注释之间会有各种能想象到和无法预测的冲突。\n\
  *   如果一个视图中有多个绘图，那么问题会远远超过线性增长的速度。\n\n总结所有这些需求，这界面本身已经因要放置所有所需绘图区域的几个控件而变得复杂，现在又得用一个额外的工具来放置所有需要的注释，这会使界面复杂得多。即使所有这些都以某种方式组织起来，看起来也非常笨拙（这是最客气的说法）。此类程序的用户是高素质的专家，他们试图解决非常严肃的工程/科学问题，不需要把时间浪费在与糟糕的界面设计作斗争上。这个需要快速、准确、简便地在带有未知曲线的绘图区域任意位置放置所需注释的问题，在设计一个庞大且非常复杂的科学应用时，可能看起来并非首要问题。因此许多人认为它总能用某种方式解决，但在标准设计下，这个问题无解。而这并非科学应用中此类问题的孤例。\n\
  \n在 2006 年至 2007 年间，我设计了一种屏幕对象可移动性算法，研究此算法的主要动力正是工程/科学程序的需求。2008 年初，当我的算法已准备好用于真实的科学程序时，我开始在传热传质研究所的数学建模系工作。来自该系及其他系的这些科学家是热力学领域的高素质专家，其中许多人也擅长编程，因此他们非常清楚界面的局限性。他们向我提出了一系列开发任务，这些任务需要开发成可工作的程序，但在标准设计的范畴内却无法实现。任务各不相同，但有一个共同特点：每个任务都必须处理来自实验和计算的数据不确定性。第一阶段这种不可预测性使得在标准界面下进一步工作几乎不可能。如果你试图设计一个能应对所有可能变体的程序，那么标准界面会变得极其笨拙，以至于根本无法使用该程序。每个程序都需要对屏幕元素进行手动操作，而这与用户驱动应用的理念和可能性完美契合。我逐一为这些任务设计了程序，每一次用户获得的功能都超出了他们最初的预期（或要求）。这些程序在研究工作中很有帮助，于是我收到了一个疑问：能否将所有旧程序重新设计成用户驱动应用？\n\
  \n通常，工程和科学程序规模庞大且复杂。每个程序都有许多特殊功能和细节，需要冗长的解释，并且只对特定领域的专家有较高价值，但对于该领域之外的人则毫无意义。同时，这些程序在设计上又有许多相似之处，因此多年来，我一直在为彼此相距甚远的知识领域设计应用。演示任何一个此类程序都需要解释其特定领域的问题和细节，这远非我在这本书中想讨论的内容。这就是为什么我更愿意演示一个包含科学应用所有特性，但又能被任何读者轻松理解的示例。我想演示和讨论一个函数查看器程序，它允许你输入`Y(x)`函数的表达式或`{X(p),\
  \ Y(p)}`类型的参数方程，并对其进行操作。这个程序有助于学校的数学教学，同时它也展示了大量可用于设计复杂、专业科学应用的内容。\n\n*   文件：`Form_FunctionViewer.cs`\n\
  *   菜单位置：应用 ➤ 函数查看器\n\n\n\n"
- '# Function Viewer 的设计与实现


  #### 核心算法的历史背景


  本函数查看器所依赖的核心工具本身并无新奇之处。您可以找到多种能将数学表达式转换为图形的程序，这些程序都基于相同的数学工具。20 世纪 20 年代，波兰数学家扬·卢卡西维茨发明了一种表示法，其中省略了所有括号，并将运算符置于操作数之前；为纪念其发明者，这种表示法被称为波兰表示法。20
  世纪 50 年代末，澳大利亚计算机科学家查尔斯·汉布林改变了操作数与运算符的顺序，从而发明了逆波兰表示法。如今，任何数学表达式解释器都基于此类表示法。在三十多年前出版的一些书籍中，您能找到这类解释器的说明，并附有演示汽车在火车站调头的插图。每辆汽车都承载着原始表达式中的一个元素，根据元素顺序，汽车可以直接穿过车站，或暂时驶入死胡同，只在恰当的时刻再被取出。通过这种方式，原始表达式中元素的顺序被改变，最终输出同样以逆波兰表示法形式呈现的表达式。编写这样一个解释器，是那些刚学习队列和栈的编程课程学生的标准练习，因此我不打算详述编写此类解释器的细节，而是直接使用
  `MoveGraphLibrary.dll` 中提供的 `FunctionInterpreter` 类。


  ## `FunctionInterpreter` 类的核心方法


  该类方法不多，但已足够使用。解释过程始终始于对待转换字符串的分析，该字符串需被转换为 `Elem` 类元素的 `List`，因此第一个要使用的方法是 `FunctionInterpreter.Analyse()`
  方法。


  ```

  bool Analyse (string strIn, ref List elems, out int iError,

  out int kErrPlace)

  ```


  原始函数文本可以包含不同的元素。


  *   标准函数名称：`{ sin, cos, tg, sh, ch, th, ln, lg, exp, sqrt, mod, arcsin, arccos,
  arctg }`。


  *   二元运算：`{ +, –, *, /, ^ }`。符号 `^` 用于表示幂运算。


  *   一元运算：`–`


  *   括号：`(` 和 `)`


  *   变量：`{ x, p, r, X, P, R }`


  *   数字。


  如果函数文本中存在任何错误，则会返回错误类型和位置。如果文本正确，它将被转换为一种特殊视图——元素集合 `List<Elem>`；此 `List` 可用于计算。计算由
  `FunctionInterpreter` 类的另一个方法完成。


  ```

  bool Calculate (List PolishForm, double fArg, ref double fVal)

  ```


  此方法返回的布尔值仅指示计算是否正确；计算结果通过其中一个参数（`fVal`）获取。


  #### 设计理念的创新


  虽然函数查看器的主旨思想并无新奇之处，但其使用方式却是全新的。开发者需要提供一个无误的解释器，并将其与一个近乎无限的功能演示工具相结合。只有用户才需决定查看哪些函数以及所有可见性参数。我将此函数查看器与我多年前设计的旧版科学程序中的类似模块进行比较，之前提到的那些没有解决方案的问题就此消失了。


  不再有笨拙的工具来设置新绘图的数量、位置和大小，也没有完美的工具来完成所有这些设置。这样的工具已不再需要。用户可随时添加或删除绘图区域，为单个或多个图形创建区域，移动和调整绘图区域大小，并轻松更改所有可想象的可见性参数。用户并非被迫这样做，而是可以随心所欲地随时操作。开发者不会干预这些操作，只负责提供一个易于使用的工具来完成所有操作。


  多年前，存在一个无法解决的注释定位问题；现在，你无需考虑任何解决方案，因为问题本身已不复存在。用户自行决定注释文本的显示与隐藏。注释可以随时移动、旋转、隐藏、显示和修改，因此用户能轻松为任意图形决定所需的注释。


  所有更改都会被保存和恢复；用户可以组织不同的变体，并在它们之间轻松切换。


  这并非我多年来展示的函数查看器的第一个版本，它被收录在我的一本大部头专著[2]的示例中。^(¹⁰) 虽然当前版本与旧版高度相似，但新版使用了不同的绘图类，并具备一些不同的特性。


  #### 科学绘图中的通用需求


  科学和工程应用可能有取决于特定领域的特殊绘图需求，但同时，许多领域的绘图都具有大量共同特征。大多数情况下，科学家处理的是 `Y(x)` 函数，这些函数通过在带有两个正交坐标轴的矩形区域中绘图来展示。通常，这些是线性坐标轴，尽管在某些领域，对数坐标轴也很常用。在大多数情况下，拥有一个水平和一个垂直坐标轴就足够了，但有时为了更好的视觉对比，同一区域内的多个图形必须在完全不同的范围内显示，这时就需要多个不同的坐标轴。旧的
  `Plot` 类支持多坐标轴工作，而当前版本的 `Plot_Adh` 类在每个方向上仅使用一个坐标轴。


  ```

  public class Plot_Adh : GraphicalObject

  {

  Scale_Numbers scaleHor, scaleVer;

  List m_comments = new List ();

  ```


  `Plot_Adh` 类使用了熟悉的注释类和坐标轴类；这些坐标轴在第 6 章讨论条形图、其坐标轴及其调整时已经演示过（图 6-4–6-7）。`Plot_Adh`
  类主区域的调整在一个特殊的窗体（图 7-48）中完成，该窗体包含了在条形图区域调整中已展示过的几个熟悉部分和元素（参见图 6-8）。


  ![../images/501148_1_En_7_Chapter/501148_1_En_7_Fig58_HTML.jpg](img/501148_1_En_7_Fig58_HTML.jpg)


  图 7-48


  用于调整绘图区域的辅助窗体


  #### 绘图区域的可视化定制


  *   背景通常设置为与周围窗体（或 `TabControl` 的页面）相同，尽管也可以轻松选择任何所需背景色及其透明度。


  *   绘图区域的边框和两个方向的网格线以相似方式独立调整。它们每个都可以选择显示或不显示；如果显示，则可以选择线条颜色和样式。网格线的位置由坐标轴上数字（和刻度）的位置决定，但刻度线和网格的外观是独立的，并在不同的窗体中分别对坐标轴和主区域进行调整。




  ### 排版后内容


  颜色的选择也与条形图的颜色选择类似。一个矩形区域包含颜色样本。所使用的颜色从最左边的样本开始选择，因此可以通过更改这些样本的顺序（按住并移动样本到另一个位置）、更改样本（在要更改的样本上调用菜单）或添加更多样本（在样本区域的空白处调用菜单）来改变函数的视图。


  任何图形都显示为连接计算点的线段序列。线段的端点可以在绘图区域内部或外部；“要显示的线段”组允许您选择要显示的线段。通常，要显示的函数足够平滑，此组中的选择不会改变图形的视图。对于`Y(x)`函数，为绘图区域内的每个水平像素计算值，生成的线是每对后续值之间的线段序列。当图形线接近垂直且相邻水平点的值差异巨大时，不同变体之间的差异就变得明显。最糟糕的情况发生在垂直渐近线的情况下。在这种情况下，最好选择第一个选项（两端都在视野内），而最后一个选项（全部）可能会在渐近线位置显示垂直线。


  为了更好地理解函数查看器，让我们将其用于一个足够简单的任务，该任务不需要对其数学方面进行大量解释。假设您想与某人讨论多项式函数的特性以及此类函数随多项式次数的变化。为了进行此讨论，您需要准备几个函数，并为它们选择不同的视图以便更好地演示。


  首次启动函数查看器时，您只会看到一个包含空函数列表的组，并且所有按钮都处于禁用状态（图 7-49）。函数查看器允许您处理两种类型的函数。多项式函数属于`Y(x)`类型，因此主菜单的相应命令会打开所需的辅助窗体（图
  7-50）。


  ![../images/501148_1_En_7_Chapter/501148_1_En_7_Fig60_HTML.jpg](img/501148_1_En_7_Fig60_HTML.jpg)


  图 7-50

  定义`Y(x)`函数的辅助窗体


  ![../images/501148_1_En_7_Chapter/501148_1_En_7_Fig59_HTML.jpg](img/501148_1_En_7_Fig59_HTML.jpg)


  图 7-49

  开始时，既没有函数也没有绘图


  多年来，我对我程序的描述经常包含诸如“在左边你看到……”之类的短语。对于用户驱动的应用程序，解释中的此类词语会变得令人困惑，因为用户可以以任何可能的方式更改程序视图，而正在运行的程序的视图可能与设计师精心构思和准备的原始视图毫无共同之处。`Form_FuncYx.cs`有一个绘图区域、用于函数定义的组和信息。信息可以阅读一次，之后就不再需要，因此它可以被压缩到很小的尺寸。所有元素都可以移动和调整大小，因此每个用户都可以在几秒钟内组织他偏好的视图。


  此窗体中的大多数元素都是图形对象，这些对象已在前面章节中讨论过。还有两个普通控件，与所有其他元素一样，它们也是可移动和可调整大小的。普通控件的移动和调整大小将在附录
  A 中讨论，因此在此我只想简要提一下。


  所有元素都必须可移动和可调整大小。通常，图形元素通过边框调整大小，并通过任意内部点移动。这对于普通控件是不可能的，因为单击其区域内的任何位置都会触发用户预定义和期望的某些操作。因此，对于控件，移动和调整大小都从边框开始。调整大小从角点和边的中间部分开始；移动从所有其他边框部分开始。


  在设计任何窗体时，我尝试以对实际工作最佳的方式进行组织，但这只是我对“最佳”的看法。每个用户都可以自由组织自己的视图。用户不仅可以按照自己的意愿更改视图，而且我的主要努力是使这个更改过程对用户尽可能简单。


  对于纸质插图，我会更改程序视图，使其与纸张格式匹配；偶尔我不得不考虑纸张文本中几个相邻图形的定位。因此，在进入`Form_FuncYx.cs`时，您将看到的视图与图
  7-50 中显示的视图不同，但我保证，无论您如何更改它们，这些元素都将完全按照它们应该做的去做。


  当用户首次打开`Form_FuncYx.cs`时，要定义的函数是不可预测的，并且显示此函数的最佳范围是未知的，因此比例尺以这样的方式组织。


  ```csharp

  private void DefaultView ()

  {

  plot = new Plot_Adh (this, mover, new Rectangle (50, 30, 400, 280),

  Side .S, 0, 100, GridOrigin .ByStep, 20,

  Side .W, 10, -10, GridOrigin .ByStep, 5);

  ... ...

  ```


  对于任何`Y(x)`函数，您需要定义函数表达式；您还需要为该函数指定一个唯一的名称，以便将其与其他函数区分开来。函数表达式和名称在“函数”组中包含的两个控件内输入。与所有普通控件一样，这两个元素通过其边框进行移动和调整大小；所有其他元素通过内部点移动并通过边框调整大小。


  我们开始研究多项式函数，从一次函数开始，并输入一个简单函数`x–3`的文本。要查看其图形，请单击“显示”按钮。水平和垂直刻度的结束值是在绘图区域初始化时设置的。对于我们当前的函数，X
  刻度的默认范围 [0, 100] 不太合适，因此最好更改它。用于`Scale_Numbers`类的水平和垂直刻度的调优窗体已经讨论过（图 6-4 和图 6-5）。通过使用水平和垂直刻度的调优窗体，我们可以为我们的函数获得更好的视图（图
  7-51）。在辅助窗体中准备函数的过程中，不仅可以设置刻度范围，还可以设置许多其他参数。通常，每当您需要更改某个对象时，您可以在该对象上调用菜单；将会有用于更改特定参数的命令或用于调用调优窗体的命令。


  ![../images/501148_1_En_7_Chapter/501148_1_En_7_Fig61_HTML.jpg](img/501148_1_En_7_Fig61_HTML.jpg)


  图 7-51

  经过一些刻度调优后的`Form_FuncYx.cs`


  必须声明函数的名称。名称只是文本，因此您的想象力有广阔的空间。


  当一切准备就绪后，我们可以单击“添加”按钮，并将这个准备好的函数返回到函数查看器的主窗体。函数名称出现在列表中，而函数本身通过`NewPlotForSingleFunction()`方法显示在新的绘图区域中（图
  7-52）。


  ```csharp

  private void Click_miNewFunc_Yx (object sender, EventArgs e)

  {

  Form_FuncYx form = new Form_FuncYx (m_functions, -1);

  form .ShowDialog ();

  if (form .FunctionReady)

  {

  ... ...

  NewPlotForSingleFunction (iNew);

  }

  }

