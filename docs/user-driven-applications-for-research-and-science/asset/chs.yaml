  ## 结论


  屏幕元素可以是简单的或复杂的；这些独立的元素也可以组合成组。这三种情况在前面的章节中已经讨论过。所有演示的对象都是图形化的，并且它们都非常适合可移动性算法。然而，从
  PC 时代开始，大多数严肃的程序都是基于控件开发的，许多程序员无法想象没有控件的程序设计。同样的可移动性算法允许你使用标准控件；这在附录 A 中讨论。对于用户驱动的应用程序，使用图形化的控件替代标准控件会更好。它们将在下一章中讨论。




  '
- "# 5. 普通控件的图形化模拟\n\n如果标准控件能够替换为具有模拟功能的图形化对象，那将极大地推动用户驱动型应用程序的发展。本章将讨论最常用控件的这类图形化模拟方案。\n\
  \n多年来，标准控件一直是程序设计的基石，因此大多数开发者无法想象没有这些元素的程序设计。控件设计得非常出色，但……操作系统将它们作为高级元素来处理，这给用户驱动型应用程序带来了诸多问题，甚至掩盖了其宣称的优势。\n\
  \n我主张程序完全由用户控制，因此我不喜欢让操作系统主要控制一类特殊对象的想法。控件总是显示在所有图形对象的上层，所以如果屏幕上有控件，用户甚至无法改变元素的排列顺序。控件具有实用的功能，因此如果它们能像其他元素一样行为，并且用户能以与图形对象完全相同的方式控制它们，我就喜欢在我的程序中使用它们。“山不来就穆罕默德，穆罕默德就去就山。”普通控件是否会按照我的观点改变尚存疑虑，因此唯一的方法是设计行为类似于所需控件的图形元素。表\
  \ 5-1 列出了本章讨论的最常用的普通控件及其图形化模拟。\n\n**表 5-1：常用普通控件及其图形化模拟**\n\n| Visual Studio 中的控件\
  \ | `MoveGraphLibrary.dll` 中的模拟控件 | 说明 |\n| --- | --- | --- |\n| `Button` | `Button_GR`,\
  \ `Button_Text`, `Button_Drawing`, `Button_Image` | `Button_GR` 是抽象类；三个派生类代表按钮顶部信息类型不同的变体。\
  \ |\n| `Label` | `Label_GR` |   |\n| `NumericUpDown` | `NumericUpDown_GR` |   |\n\
  | `TrackBar` | `Trackbar_GR` |   |\n| `ListBox` | `ListBox_GR` | 最多只能选择一个元素。 |\n\
  | `ComboBox` | `ComboBox_DDList` | 经典组合框有三种变体；图形化模拟仅演示了具有 `DropDownList` 样式的一种。\
  \ |\n| `CheckBox` | `CheckBox_GR` |   |\n| `ListView` | `ListView_GR` | 最多只能选择一个元素。\
  \ |\n| `RadioButton`, `GroupBox` | `RadioButton_GR`, `Group_RadioButtons` | 单选按钮仅成组使用，因此有一个按钮类和一个用于其分组的类。\
  \ |\n\n图 5-1 显示了这些普通控件的视图。在我多年使用的所有标准控件中，只有 `TextBox` 没有对应的图形化模拟。\n\n![../images/501148_1_En_5_Chapter/501148_1_En_5_Fig1_HTML.jpg](img/501148_1_En_5_Fig1_HTML.jpg)\n\
  \n**图 5-1：普通控件视图**\n\n在开始讨论它们的模拟控件之前，我想先提一下图形化控件的一些通用特性。之后我将只讨论图形化控件，因此可以省略“图形化”这个词，并将所有新元素简单地称为控件。如果我必须提及经典控件，我会称它们为“普通控件”。\n\
  \n控件可以是简单的或复杂的；控件需要像任何其他图形对象一样调节可移动性和可调整大小性，因此所有这些内容都将与新的类一起讨论。但控件有一个特性，使它们与之前讨论的所有图形对象不同。许多控件具有某种状态（例如，控件可以被选中或取消选中），根据工作应用程序的参数，这种状态的更改是被允许还是被阻止。因此，控件可以声明为启用或禁用。启用和禁用控件之间的区别必须是可见的。\n\
  \n以下是为所有控件实现的几条规则：\n\n- 控件可以使用或不使用附加注释；由于所有控件都是矩形的，因此它们都使用 `Comment_ToRectangle`\
  \ 类的注释。有些控件将文本作为重要组成部分，并且该文本传达了关于元素用途的足够信息。这些是复选框和单选按钮，因此 `CheckBox_GR` 和 `RadioButton_GR`\
  \ 类的对象没有注释。`Button_Text` 类的按钮顶部有文本，通常这提供了关于此类按钮的充分信息。如果需要额外信息，此类按钮可以带注释使用。每个控件最多只有一个注释；唯一的例外是\
  \ `Trackbar_GR` 类，它允许有无限数量的注释。\n\n- 任何控件都可以是启用或禁用的；唯一的例外是 `Label_GR` 类。禁用意味着与对象关联的某些状态或值无法更改；标签没有此类值，因此\
  \ `Label_GR` 类没有 `Enabled` 属性。禁用状态不影响对象的可移动性，因此启用和禁用的对象以相同的方式移动和调整大小。基本的 `GraphicalObject`\
  \ 类不包含用于调节启用/禁用状态的字段和属性，因此这在每个控件类中实现。\n\n- 类的 `Enabled` 属性在三个不同的地方使用。\n  - 在类的 `Draw()`\
  \ 方法中，因为启用和禁用的对象必须看起来不同。\n  - 在 `OnMouseDown()` 方法中，用于阻止对禁用对象的那些以其状态（值）更改开始的点击。注意不要阻止开始调整大小或移动，因为这两种操作对于禁用对象都是允许的。\n\
  \  - 在 `OnMouseUp()` 方法中，用于阻止对禁用对象的状态（值）更改。\n\n\n\n## 按钮\n\n- 文件：`Form_Button.cs`\n\
  - 菜单位置：*图形控件 ➤ 按钮*\n\n本示例中的大部分元素都是按钮（图 5-2），但它们分属于三个不同的类。\n\n![../images/501148_1_En_5_Chapter/501148_1_En_5_Fig2_HTML.jpg](img/501148_1_En_5_Fig2_HTML.jpg)\n\
  \n图 5-2\n\n本示例中使用了所有三种类型的按钮——带文本、绘图或图像的按钮\n\n```\nButton_Drawing btnCover;\nButton_Image\
  \ btnOpen, btnImage;\nButton_Text btnCanada,\nbtnUSA1, btnUSA2,\nbtnLithuania,\n\
  btnGermany, btnFrance;\n```\n\n如图 5-2 所示，按钮表面可带有文本、绘图或图像。这些按钮之间的唯一区别就在于此，因此它们都派生自抽象类\
  \ `Button_GR`，该类包含了它们的主要特性，例如封面设计、移动和允许的缩放类型。\n\n```\npublic abstract class Button_GR\n\
  : GraphicalObject\n{\nPointF [] ptsCorner;\nResizing resize;\nbool bEnabled;\nbool\
  \ bPressed;\nComment_ToRectangle m_cmnt = null;\n```\n\n按钮有一个用于矩形对象的标准封面：四个角上的圆形节点、四条边上的条形节点，以及一个用于整个区域的矩形节点（图\
  \ 5-3）。边上的条形节点具有默认宽度（六个像素），而角上的圆形节点则稍微放大。当按钮被声明为不可移动时，其大节点上的光标形状会从标准的 `Cursors.SizeAll`\
