  第三个列表 —— `listRect` —— 也与一个矩形相关联，但此矩形是 `Rectangle_withComments` 类的一个元素，并且此矩形或其关联注释的更改会导致列表中的数据更改。不仅列表单元格内的字符串会改变，甚至列表中的行数也取决于关联矩形的参数。\n\
