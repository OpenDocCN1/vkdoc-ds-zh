  \ 结论\n\n在本章中，我们讨论了复杂对象的设计。此类对象的每个部分都有自己的覆盖层，因此每个部分都可以参与独立的移动，但同时各部分也参与关联移动，因此在其整体设计上存在一些考量。多个对象联合处理某个子任务的情况并不少见，因此这样一组对象必须作为一个组来移动和工作。这将在下一章中讨论。\n\
