  \n任何按钮都可以关联一个注释。按钮是矩形的，因此最简单的方法是使用 `Comment_ToRectangle` 类的注释。通常，带有文本的按钮不需要任何额外的注释，因为文本本身已经清楚地说明了对象的用途。带有图像或绘图的按钮通常需要一些注释。例如，一个调整窗体可能包含用于更改不同颜色参数的相同按钮，如果没有注释，将无法选择所需的按钮。在当前示例中，只有包含图片的按钮才使用了注释。带注释的按钮的行为方式与\
  \ `Rectangle_withComments` 类所述相同。\n\n三种类型按钮的主要区别在于它们的绘制方式，但在深入细节之前，我想提醒大家注意基于普通控件的程序的一些特性，以及绘制普通\
  \ `Button` 控件的一些细节，因为图形化按钮必须尽可能地复制它们的行为和外观。\n\n控件是在 30 多年前引入的。在鼠标问世之前，键盘是用户的主要工具。多年前，即使手边有鼠标，许多用户也喜欢使用键盘来控制应用程序，因此在设计屏幕控件时，它们被期望（通过可视化）提供键盘控制程序所需的信息。为此，使用了焦点的概念。无论一个窗体中有多少个控件（很久以前甚至不使用*窗体*这个词，而是使用*窗口*或*对话框*），在任何特定时刻，只有一个屏幕控件具有焦点，并且该控件会从键盘获取命令。可以通过按\
  \ `Tab` 键将焦点从一个控件移动到另一个控件。对话框中的所有控件都按顺序排列，焦点将按照此顺序在控件之间移动。当用鼠标单击控件时，焦点也会移动到该控件上，但如果有人喜欢使用键盘，那么在具有大量控件的对话框中，将焦点从一个元素传递到另一个元素可能需要多次单击\
  \ `Tab` 键。焦点仅在控件之间传递，而图形对象（系统认为它们是次要元素）则不参与此过程。有多种突出显示焦点的方法；它可能因控件类和系统版本而异，但通常会在控件内部有一个额外的虚线框，或者在元素周围有一个更宽的（或不同颜色的）边框。\n\
  \n在我看来，普通控件是多余的，应尽可能用图形化替代品来代替。此外，在应用程序中，鼠标作为唯一的控制工具就足够了，因此不使用焦点。在任何时刻，按钮要么处于启用状态，要么处于禁用状态。启用的按钮要么空闲（未按下），要么按下。这三种状态——禁用按钮、按下或空闲——必须在视觉上能够区分。\n\
  \n按钮的绘制由两部分组成：边框绘制和内部区域绘制。如果我没记错的话，早期版本的 Windows 中的按钮有模仿三维效果的边框，但这些按钮的背景是单色的。后来，边框被简化为普通线条，而背景则变为从顶部的浅灰色到底部的浅蓝色的渐变色。正常（空闲）按钮以此方式显示，而对于按下的按钮，则使用相同方向相反的渐变色，这种颜色的切换完美地指示了按钮按下或释放的瞬间。\n\
  \n\n好的，作为高级文档工程师和翻译员，我将遵循您的指示，翻译以下文本。\n\n\n现在我们可以从抽象按钮转向实际按钮。所述从浅灰色到浅蓝色的颜色渐变用于顶部带文本的`Button`控件，因此我们从`Button_Text`类开始。在当前示例（图\
  \ 5-2）中，有六个`Button_Text`类的对象。\n\n```\npublic class Button_Text : Button_GR\n{\n\
  string m_text;\nFont m_font;\nColor m_color;\nButtonBackType typeBack = ButtonBackType.Gradient;\n\
  SolidBrush brushBack;\n```\n\n`Button_Text`类的构造函数有六个参数；其中三个用于基类构造函数，另外三个用于顶部的文本。\n\
  \n```\npublic Button_Text (Form frm, Mover mvr, RectangleF rc,\nstring txt, Font\
  \ fnt, Color clr)\n: base (frm, mvr, rc)\n{\nm_text = CheckedText (txt);\nm_font\
  \ = fnt;\nm_color = clr;\nbrushBack = new SolidBrush (Background);\n... ...\n```\n\
  \n过去在`Button`控件中使用了两种背景类型：单色背景和颜色渐变。默认情况下，`Button_Text`对象采用颜色渐变组织，但该类提供了两种视图，并允许用户在任何时刻决定任何按钮的具体视图。视图的差异仅存在于启用的按钮中。\n\
  \n```\npublic override void Draw (Graphics grfx)\n{\n... ...\nRectangle rc = Rectangle.Round\
  \ (MainElementArea);\nRectangleF rcClip = new RectangleF (rc.Left + 2, rc.Top +\
