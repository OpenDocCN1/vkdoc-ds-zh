  \ [i] .X + w / 2, ptBtn [i] .Y + h / 2,\n                    ptBtn [i - 1] .X +\
  \ w / 2, ptBtn [i - 1] .Y + h / 2);\n            }\n        }\n    }\n    ControlPaint\
  \ .DrawCheckBox (grfx, rcSelect,\n        bSelected ? ButtonState .Checked : ButtonState\
  \ .Normal);\n}\n```\n\n草图可通过其任何内部点（复选框区域除外）进行移动，因此 `ButtonsSketch` 的覆盖区域由两个矩形节点组成。通常，覆盖复选框矩形（`rcSelect`）的较小节点必须位于负责移动整个对象的较大节点之前。\n\
  \n```csharp\npublic override void DefineCover ()\n{\n    CoverNode [] nodes = new\
