  - 几何光学示例
- - '###'
  - 2019年，我撰写了一本名为《几何光学图解》[3]的小书，其中包含一个涵盖所有主题示例的程序。本节收录了该书中的三个示例。这本提到的书分为两部分：第一部分从光学角度进行解释，第二部分则涉及所有示例的编程。在本节中，几何光学的解释被精简到最低必要水平，而我则着重强调新设计对程序用户带来的优势。让我们从平面镜开始；这个示例完美地展示了所有示例的设计。
