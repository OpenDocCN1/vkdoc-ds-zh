  ### 机器问题诊断


  影响 1 号生产线的问题在第三班次开始时已得到纠正，此后生产性能恢复正常。然而，在之前的两个班次期间，操作员曾尝试自行解决问题，但未能成功。第三班次的班组长注意到仪表板上的下行趋势，并召来了维护人员。


  一名维护技术员确定问题在于传送带上一个齿轮箱的润滑油位异常偏低。（稍后我们将看到，该维护技术员使用了在 Wave Analytics 中开发的仪表板来精确定位问题。）简单解释一下，齿轮箱连接在电机上，电机又连接到一个用于控制其速度的驱动器上。该驱动器连接到一个设备级网络。由可编程控制器从驱动器收集诊断信息，数据最终存储在
  SCADA 系统中。对于每条传送带，都有一个用于重置可编程控制器中的控制逻辑并清除任何驱动器故障的按钮。图 5-8 描绘了 1 号生产线上一条传送带的这些组件。


  ![A978-1-4842-1203-5_5_Fig8_HTML.jpg](img/A978-1-4842-1203-5_5_Fig8_HTML.jpg)

  *图 5-8. 1 号生产线传送带的机械和控制设备*


  操作员倾向于使用重置按钮来快速清除故障，他们并不总是确定传送带停止的原因。因此，故障常常被归咎于一个可能并不存在的错误原因。然而，追踪此类故障对于改进性能至关重要；优化维护实践有助于解决这类反复出现的问题。对于因齿轮箱润滑油位低而导致的
  1 号生产线驱动器故障，预防性维护应包括检查这些润滑油位。


  然而，在这个实例中，维护人员能够利用从 1 号生产线驱动器收集的数据（这些数据可在仪表板中获取）诊断出此问题。其原理如下：为每个驱动器维护一个平均电流读数，该读数基于过去三个月内根据经验收集的数据。SCADA
  系统还会计算每个班次的平均电流，以及最高和最低电流读数。图 5-9 描绘了为每条传送带收集的数据流。


  ![A978-1-4842-1203-5_5_Fig9_HTML.jpg](img/A978-1-4842-1203-5_5_Fig9_HTML.jpg)

  *图 5-9. 传送带运行监控的数据流*


  收集到的电气数据被整合到图 5-10 所示的仪表板中。该仪表板显示了为所有三个班次收集的所有电流数据。因此，仪表板可以轻松识别出任何电流过高的驱动器。气泡图会精确标出任何电流持续高于正常值的驱动器。（解释一下，电流高差值是指驱动器的平均电流与某个班次记录的最高电流之间的差值。）左侧的气泡表示正常运行中的驱动器；右侧的气泡显示异常，应进行调查。


  在此案例中，气泡图提供了三个班次的数据，如图 5-10 所示。维护技术员看到了右侧的两个气泡，并选择查看与之相关的附加信息。这两个气泡都显示传送带 12 的电流读数较高，这引导该维护技术员去检查与传送带
  12 相关的机械系统，并最终发现了齿轮箱润滑油位过低的问题。


  ![A978-1-4842-1203-5_5_Fig10_HTML.jpg](img/A978-1-4842-1203-5_5_Fig10_HTML.jpg)

