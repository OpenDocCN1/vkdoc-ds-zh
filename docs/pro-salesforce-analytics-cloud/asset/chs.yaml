  \ Nathaniel Grimes 表现最佳的领域，如图 6-24 所示。\n\n![A978-1-4842-1203-5_6_Fig24_HTML.jpg](img/A978-1-4842-1203-5_6_Fig24_HTML.jpg)\n\
  \n图 6-24.\n西南地区“Mountain”产品线的最佳销售经理\n\n如果我们在产品线切换控件上选择“Road”产品线，我们会发现 Nathaniel\
  \ Grimes 在这个领域并非主导；相反，另一位销售经理 Sayaka Ito 是表现最佳的。如图 6-25 所示。\n\n![A978-1-4842-1203-5_6_Fig25_HTML.jpg](img/A978-1-4842-1203-5_6_Fig25_HTML.jpg)\n\
  \n图 6-25.\n西南地区“Road”产品线的最佳销售经理\n\n\n\n### 分析其他维度：经销商\n\n为了展示 Salesforce 分析云的通用性，我们将介绍最后一个仪表板，其中包含不同的维度和不同的数据选择器。\n\
  \n渥太华县自行车公司使用三种类型的渠道来销售和分销其产品，这些信息包含在`经销商类型`维度中。经销商分为三种类型：专业自行车店、增值经销商和仓库。数据集还包含`经销商名称`维度中各个经销商名称的信息。图\
  \ 6-26 展示了一个仪表板，旨在分析经销商、经销商类型以及最畅销产品，其中包含销售经理、产品类型和地理区域。该仪表板很好地说明了 Salesforce 分析云中各组件的通用性。对于产品类型和地理区域，使用了环形图而不是切换开关。\n\
  \n![A978-1-4842-1203-5_6_Fig26_HTML.jpg](img/A978-1-4842-1203-5_6_Fig26_HTML.jpg)\n\
