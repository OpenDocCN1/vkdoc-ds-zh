- "# 仪表盘开发周期\n\n渥太华县自行车公司是一家跨国公司，负责制造和分销销往美国、加拿大、英国、德国、澳大利亚和法国市场的产品。北美是该公司最大的市场，因此我们在此处开发的第一个仪表盘将以该业务部门为重点。利用前文所述方式创建的数据集，我们现在可以基于该数据集创建可用于构建仪表盘的透镜。\n\
  \n为了开始分析销售数据，我们使用`Sales Amount`度量值，并根据需要应用维度来了解业绩表现。为了评估北美地区的业绩，我们向`Sales Territory—Country`维度应用一个筛选器，选择美国和加拿大。该数据集包含\
  \ 2013 年、2014 年和 2015 年的销售数据。其中 2015 年的数据仅有第三和第四季度的部分信息，因此该年度的销售数据并不完整，这很可能会在仪表盘中有所体现。\n\
  \n对于本仪表盘的主图表，我们选择了两个时间维度：`Calendar Year`和`Calendar Quarter`。用于在`Sales Territory—Country`上设置两个筛选器以及这两个维度的界面如图\
  \ 6-11 所示。\n\n![A978-1-4842-1203-5_6_Fig11_HTML.jpg](img/A978-1-4842-1203-5_6_Fig11_HTML.jpg)\n\
  \n图 6-11. 筛选加拿大和美国，并按`Calendar Year`和`Calendar Quarter`度量值进行分组\n\n通过将这两个维度与水平条形图结合使用，我们可以创建一个出色的季度业绩可视化图表。该条形图的初始版本如图\
  \ 6-12 所示。\n\n![A978-1-4842-1203-5_6_Fig12_HTML.jpg](img/A978-1-4842-1203-5_6_Fig12_HTML.jpg)\n\
  \n图 6-12. 季度业绩初始条形图\n\n数据发现工具的真正强大之处在于能够随意应用细化条件，并展示数据随之发生的变化。对于本仪表盘，我们使用切换控件来应用此类细化条件。\n\
  \n我们使用切换控件设置了三个细化条件：`Product Line`、`Sales Territory—Region`和`Product Category`。集成了该控件的仪表盘如图\
  \ 6-13 所示。\n\n![A978-1-4842-1203-5_6_Fig13_HTML.jpg](img/A978-1-4842-1203-5_6_Fig13_HTML.jpg)\n\
  \n图 6-13. 带有顶部控件的销售业绩仪表盘\n\n这些控件使得只需点击即可对仪表盘应用任何细化条件。同时，这些控件还能通过显示该维度对`Sales Data`度量值的相对贡献来提供额外的洞察。例如，在不使用任何控件应用细化条件的情况下，仅通过查看`Sales\
  \ Region`控件，我们就可以发现西南地区是领先的销售区域，销售额为 18,272,915 美元，其次是加拿大，销售额为 14,272,776 美元。类似地，`Product\
  \ Lines`选择器控件显示，在 Mountain、Road 和 Touring 三条产品线中，Road 产品线明显领先，销售额约为 3000 万美元，紧随其后的是\
  \ Mountain 产品线，销售额约为 2900 万美元。请注意，在移动界面上，切换控件可以通过向左或向右滑动来“滚动”查看其他值。例如，如果我们向右滑动`Sales\
  \ Region`切换控件，将会看到其他地区。\n\n让我们回到季度销售额的条形图。通过此图表，可以轻松比较特定季度逐年间的业绩表现。以第一季度为例，从 2013\
  \ 年到 2015 年呈现出稳步增长的趋势：2013 年销售额为 410 万美元，2014 年为 480 万美元，2015 年为 510 万美元。\n\n不过，要深入了解业绩细节，我们可以点击条形图的某个区段，该季度即可被用作一个细化条件。例如，如果我们点击\
  \ 2013 年条形图的第一季度区段，仪表盘上的其他控件会随之变化以反映该细化条件。点击 2014 年的第一季度区段则会改变细化条件——同样，仪表盘上的其他控件也会随之变化以反映此新细化条件。图\
  \ 6-14 和 6-15 展示了这种变化。\n\n![A978-1-4842-1203-5_6_Fig15_HTML.jpg](img/A978-1-4842-1203-5_6_Fig15_HTML.jpg)\n\
  \n图 6-15. 选中 2014 年第一季度\n\n![A978-1-4842-1203-5_6_Fig14_HTML.jpg](img/A978-1-4842-1203-5_6_Fig14_HTML.jpg)\n\
  \n图 6-14. 选中 2013 年第一季度\n\n\n\n### 深入探究\n\n此时，仅通过使用仪表板就可能会产生一些问题。例如，我们已确定第一季度业绩稳步提升，但尚未了解其原因。幸运的是，借助\
  \ Salesforce Analytics Cloud，我们可以快速开发一个新的仪表板来解答这个问题！但在着手开发另一个仪表板之前，让我们更详细地审视这个问题。销售增长是由于特定区域的业绩提升？是由于特定产品线？还是由于特定产品类别？正如您将看到的，我们可以轻松找到这些问题的答案。\n\
  \n为此，我们开发了一个包含四个柱状图的仪表板。第一个柱状图是每年的第一季度数据，作为其他三个堆叠柱状图的参考。这些堆叠柱状图分别对应销售区域、产品线和产品类别。这个仪表板名为“第一季度增长研究”，如图\
  \ 6-16 所示。\n\n![A978-1-4842-1203-5_6_Fig16_HTML.jpg](img/A978-1-4842-1203-5_6_Fig16_HTML.jpg)\n\
  \n图 6-16.\n第一季度增长研究\n\n左上角的柱状图显示了三年间第一季度的销售增长情况，这是我们在销售业绩仪表板（图 6-15）中已经看到的信息。另外三个堆叠柱状图分别按区域（右上角）、产品线（左下角）和产品类别（右下角）进行分段。要检查这些堆叠柱状图，我们点击图表右上角带有四个向外箭头的图标。右上角的销售区域堆叠柱状图如图\
  \ 6-17 所示。\n\n![A978-1-4842-1203-5_6_Fig17_HTML.jpg](img/A978-1-4842-1203-5_6_Fig17_HTML.jpg)\n\
  \n图 6-17.\n第一季度，销售区域-地区，堆叠柱状图\n\n从这个柱状图来看，西南地区在过去三年中呈现稳步增长。切换图表类型很容易，并且这样做有时会带来好处。在本例中，当我们更改为折线图时，数据背后的故事更加明显：西南地区的折线在该时间段内稳步上升——显然是表现最好的区域，如图\
  \ 6-18 所示。\n\n![A978-1-4842-1203-5_6_Fig18_HTML.jpg](img/A978-1-4842-1203-5_6_Fig18_HTML.jpg)\n\
  \n图 6-18.\n第一季度，销售区域-地区，折线图\n\n对于另外两个柱状图，我们也看到了有趣的趋势。图 6-19 显示了产品线的堆叠柱状图。\n\n![A978-1-4842-1203-5_6_Fig19_HTML.jpg](img/A978-1-4842-1203-5_6_Fig19_HTML.jpg)\n\
  \n图 6-19.\n第一季度，产品线，堆叠柱状图\n\n在图 6-19 中，我们看到山地车产品线的销售额下降，公路车产品线在 2014 年出现激增，但在 2015\
  \ 年又遭遇下滑。2015 年推出的旅行车产品线帮助维持了销售额，弥补了山地车和公路车销售额的下滑。\n\n最后一个堆叠柱状图是针对产品类别的，如图 6-20\
  \ 所示。公司在所有领域都实现了增长，其中自行车和零部件的增长最为显著。\n\n![A978-1-4842-1203-5_6_Fig20_HTML.jpg](img/A978-1-4842-1203-5_6_Fig20_HTML.jpg)\n\
  \n图 6-20.\n第一季度，产品线，堆叠柱状图\n\n图 6-16 中显示的四个柱状图是在 iPad 上几分钟内完成的，它们立即揭示了第一季度销售额背后的增长趋势洞察。通过检查所有图表，我们能够得出结论：美国西南部是表现最强的地区，而\
  \ 2015 年旅行车产品线的推出，抵消了 2014 年曾激增的公路车产品线的下滑。\n\n鉴于本章的主题是移动使用，让我们看看“第一季度增长研究”在 iPhone\
