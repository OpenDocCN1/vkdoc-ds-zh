  \n图 3-28\n\n带有柱状图组件的仪表板\n\n使用配有 Salesforce Analytics 的移动设备创建仪表板既快速又简单。我们上面的快速示例从加载数据到生成仪表板只需不到\
  \ 15 分钟。该界面直观且功能强大，业务分析师可以完全通过手机探索数据集并设计可视化。如需保存仪表板，请按右上角的“保存”按钮，并为仪表板命名。\n\n##\
  \ 高级仪表板\n\n除了拖放功能外，Salesforce Analytics Cloud 还提供了丰富的功能，用于更高级的仪表板设计和开发。在本节中，我们将探讨这些高级功能及其使用方法。首先，我们来分析一下\
  \ Salesforce Analytics 仪表板的组成。\n\n### 仪表板的解剖结构\n\nSalesforce Analytics Cloud 仪表板本质上是一个\
  \ JSON 文档，其中包含仪表板各个组件的定义以及它们之间的连接方式。它由两类信息组成：\n\n- **系统元数据**：包括诸如 `UID`、仪表板名称和描述等信息。\n\
  - **仪表板状态**：这是存储仪表板设计重要信息的地方，包括`步骤`、`组件`和`布局`。\n\n您可以通 JSON 文件配置和修改仪表板的不同方面。但是，**不建议**您通过\
  \ JSON 文件修改任何系统元数据。\n\n如本章前面部分所述，创建和修改仪表板最便捷的方法是通过 Web 交互或在移动设备上使用仪表板设计器。但是，如需创建具有数据联接或选择绑定等功能的更高级仪表板，则可能需要修改仪表板定义的\
  \ JSON 文件。\n\n#### 仪表板状态\n\n位于仪表板 JSON 文件中标签名 `state` 下的部分即为仪表板状态。它包含我们之前提到的子部分，包括`步骤`、`组件`和`布局`。`步骤`部分包含了通过仪表板资源管理器从透镜中剪裁出的所有查询。每个`步骤`通过\
  \ `name` 字段链接到一个`组件`或绑定到另一个`步骤`。`组件`部分定义了仪表板内的所有组件。`布局`部分包含了页面和列布局的定义。\n\n#### 组件\n\
  \n动态组件类型通常代表每个查询步骤。不同的组件类型包括`图表`、`原始数据表`、`比较表`、`数字`、`范围`、`列表`、`日期`、`切换`和`全局筛选器`。\n\
  \n还有一些静态组件，如`文本`、`方框`、`YouTube` 和`链接`，这些可由仪表板作者配置。诸如 `size`、`position` 和 `name`\
  \ 等参数可以在设计器/生成器界面右侧面板的组件属性中设置。\n\n#### 步骤\n\n`步骤`包含查询，这些查询可以是来自资源管理器的剪裁，也可以是手动编写的\
  \ `SAQL`，或者是通过静态步骤生成的。步骤上的选择可以分面化，也可以绑定到仪表板内的其他步骤。我们将在本章下一节介绍一个选择绑定的示例。选择模式、起始值、是否分面化以及使用全局筛选器都可以作为步骤属性的一部分进行设置。\n\
  \n#### 布局画布\n\n当前仪表板中布局画布的实现是固定大小的，在一个页面上使用绝对定位。未来的增强功能将包括响应式网格、移动设备布局和模板。\n\n####\
  \ JSON 文件的使用\n\n以下是您可能需要更新 JSON 文件的一些场景示例：\n\n- 指定一个 `SAQL` 查询，并指定该查询与其他步骤之间的关系\n\
  - 使用指定的值列表填充选择器，而不是从查询中获取\n- 使用手动绑定覆盖默认的分面，手动指定步骤之间的关系\n- 设置查询限制\n- 为值表指定列\n\n有关\
  \ JSON 文件的更多信息，请参考“Analytics Cloud 仪表板 JSON 参考指南”。\n\n### 使用 SAQL 的高级仪表板\n\n`SAQL`\
  \ 脚本由一系列语句组成，这些语句由关键字（如 `filter`、`group` 和 `order`）、标识符、字面量或特殊字符构成。语句可以跨越多行，并且必须以分号结尾。`SAQL`\
  \ 是声明式的，这意味着您描述您想要从查询中获得什么。然后，查询引擎将决定如何高效地提供这些信息。`SAQL` 是可组合的。每个语句都有一个结果，您可以将语句链接在一起。`SAQL`\
  \ 受到了 Pig Latin 编程语言的影响，但是它们的实现有所不同。\n\n在下一节中，我们将向您展示一个使用 JSON 和 `SAQL` 进行高级仪表板开发的示例。\n\
  \n\n\n### 在 Designer 中创建仪表板\n\n本示例使用的数据集名为“消费者支出”，如果你想跟着操作，可以从 [`www.apress.com/9781484212042`](http://www.apress.com/9781484212042)\
  \ 下载。我们将首先使用透镜探索器和 Designer 裁剪功能创建一个仪表板。然后，我们创建以下三个透镜：`Age`、`Category` 以及按 `Item`\
  \ 分组、按 `Sum of Value` 降序排列的 `Sum of Value`。我们将它们裁剪到 Designer，并添加到 2 个列表组件和 1 个图表组件中。图\
  \ 3-30 展示了仪表板的设计视图。请务必保存仪表板，以免丢失工作成果。\n\n![A978-1-4842-1203-5_3_Fig30_HTML.jpg](img/A978-1-4842-1203-5_3_Fig30_HTML.jpg)\n\
  \n**图 3-30.** 消费者支出仪表板设计视图\n\n我们的目标是仅显示基于年龄选择的前 5 个类别。为了实现这一目标，我们将按照以下步骤修改仪表板的 JSON\
  \ 定义。\n\n1.  **获取 SAQL 语句**：使用“消费者支出”数据集创建一个透镜。定义一个度量，对“Value”进行“Sum”求和，并按“Category”分组，然后降序排列。使用“Age”维度创建一个筛选器，并选择两个随机年龄组。点击“List”图标，然后选择“</>\
  \ Edit SAQL Query”。请注意，Salesforce 目前正在修订编辑 SAQL 查询的方法。如果你在编辑 SAQL 查询时遇到困难，应联系 Wave\
  \ 支持部门以获取帮助（参见图 3-31）。\n\n    ![A978-1-4842-1203-5_3_Fig31_HTML.jpg](img/A978-1-4842-1203-5_3_Fig31_HTML.jpg)\n\
  \n    **图 3-31.** SAQL 语句窗口\n\n2.  将 SAQL 语句复制并粘贴到一个文本文件中。删除换行符（或断行），使语句成为一行，如下所示：\n\
  \    ```\n    q = load \"0Fb1a000000PB6QCAW/0Fc1a000000PBrfCAG\";q = filter q by\
  \ 'Age' == \"0 to 25\";q = group q by 'Category';q = foreach q generate 'Category'\
  \ as 'Category', sum('Value') as 'sum_Value', count() as 'count';q = order q by\
  \ 'sum_Value' desc;q = limit q 2000;\n    ```\n    保存文本文件以备后用。\n\n3.  通过将 URL 中的“explore”替换为“lens”，导航到透镜配置页面，如下所示：\n\
  \    `https://[domain].salesforce.com/analytics/wave/web/explore.apexp` ➤ `https://[domain].salesforce.com/analytics/wave/web/lens.apexp`\n\
  \n4.  选择仪表板透镜，你的仪表板 JSON 文件将显示在右侧的文本框中（参见图 3-32）。\n\n    ![A978-1-4842-1203-5_3_Fig32_HTML.jpg](img/A978-1-4842-1203-5_3_Fig32_HTML.jpg)\n\
  \n    **图 3-32.** 配置窗口\n\n5.  选中 JSON 文本，将其复制并粘贴到你选择的 JSON 编辑器中。我们将使用 Sublime Text。在\
  \ JSON 文件的“state”部分中，找到“steps”。找到名为“Catogory_1”的步骤及其下方的“query”部分。添加以下行（pigql 文本来自我们在步骤\
  \ 2 中复制并粘贴到文本文件中的 SAQL 语句）。\n    ```\n    \"pigql\":\"q = load \\\"0Fb1a000000PB6QCAW/0Fc1a000000PBrfCAG\\\
  \";q = filter q by 'Age' == \\\"0 to 25\\\";q = group q by 'Category';q = foreach\
  \ q generate 'Category' as 'Category', sum('Value') as 'sum_Value', count() as 'count';q\
  \ = order q by 'sum_Value' desc;q = limit q 2000;\",\n    ```\n\n6.  将整个 JSON 文件复制并粘贴到\
  \ Analytics Cloud 屏幕的透镜文本框中，然后点击“Update Lens”。返回 Analytics 主页并刷新仪表板，以确保 pigql 语句正常工作。\n\
  \n7.  返回 JSON 文件并进行以下更新：\n    - 将 `'Age' == \"0 to 25\"` 更改为 `'Age' in {{selection(Age_2)}}`。这称为选择绑定。它本质上告诉\
  \ pigql 使用“Age_2”步骤的选择结果作为类别选择中 Age 的筛选条件。\n    - 将 `limit q 2000` 更改为 `limit q\
  \ 5`。这是为了将结果数量限制为基于年龄组选择的消费者支出金额最高的前 5 个类别。\n\n8.  替换为新 JSON 文件，然后点击“Update Lens”。\n\
  \n9.  刷新仪表板，你应该能够看到年龄组选择将更新类别列表组件，如图 3-33 所示。\n\n    ![A978-1-4842-1203-5_3_Fig33_HTML.jpg](img/A978-1-4842-1203-5_3_Fig33_HTML.jpg)\n\
  \n    **图 3-33.** 动态选择绑定\n\n### 总结\n\n虽然数据很重要，但如果没有分析，其价值就微乎其微。在这个新的数据时代，人们常常会对收集和共享的数据量呈爆炸式增长感到震惊。理解关键的业务驱动因素和痛点有助于业务分析师评估需要哪些洞察。阿尔伯特·爱因斯坦曾说过，我们不可能总是衡量我们想要计算的东西，但这并不妨碍我们不断探索获取所需数据的新方法，他这话颇有道理。\n\
  \n分析解决方案的成功在很大程度上依赖于人类的直觉以及提出明智问题的能力，无论是针对业务利益相关者，还是在分析方法中针对数据本身。恰当地提出业务问题对于避免有缺陷的分析和错误的结论至关重要。\n\
  \nSalesforce Analytics Cloud 是一款独特的基于云的分析工具，它使你的知识工作者能够探索数据、设计有效的可视化并生成洞察。\n\n##\
  \ 4. Salesforce Analytics 平台\n\n> 知己知彼，百战不殆。 ——孙子，《孙子兵法》\n\n在孙子不朽的巨著《孙子兵法》中，最看重的是了解自身能力和即将面临的挑战。对于商业组织及其分析软件而言也是如此。如果你了解自己的软件和数据，就能最大限度地利用它来解决特定的问题。在前三章中，我们介绍了将数据加载到\
  \ Salesforce Analytics Cloud 中最简单的、用户可操作的方法。现在，我们将探讨将数据从不同来源移动到 Salesforce Analytics\
  \ Cloud 数据集的方法。\n\n本书介绍的大部分内容涉及日常业务用户感兴趣的功能，使他们能够创建分析仪表板。然而，本章将解释 Salesforce Analytics\
  \ Cloud 提供的一些高级功能，这些功能通常属于开发人员和 IT 专业人员的领域。这里描述的功能相对较新，当然有些可能会发生变化；尽管如此，这或许有助于你审视自己的选项。\n\
  \n**注意：** 所提供的信息基于目前可用的内容。它不是一份深入的技术指南，而是一张帮助你概览这些技术的路线图。有关完整的技术细节，读者应查阅相应的技术文档和媒体资料。\n\
  \n\n\n### 数据集成方法\n\n顶尖技术研究公司的分析师认为，数据集成是大多数分析软件面临的一项挑战。然而，将数据（包括数据发现产品中的数据）导入分析软件，对于高效使用该软件至关重要。幸运的是，`Salesforce\
  \ Analytics` 引擎允许通过桌面客户端或移动界面，以及标准的用户可访问方法，实现数据集成。\n\n向 `Salesforce Analytic Cloud`\
  \ 写入数据有两种方法，读取数据则有一种方法。`External Data API` 和`提取-转换-加载` (ETL) 工具用于写入数据；`Wave REST\
  \ API` 用于读取数据。每种方法服务于不同的需求，因此在决定使用哪种方法之前，理解其特性至关重要。图 4-1 概述了这些方法。\n\n-   **`External\
  \ Data API`**：`External Data API` 用于创建数据集。对于希望在不使用 ETL 工具等企业软件的情况下加载大量数据的公司来说，它是首选。例如，这可能是开发特定产品的公司采用的方法；他们拥有自定义软件开发能力，并且员工中有熟悉常规\
  \ `REST API` 开发的软件开发者。\n-   **ETL 工具**：`提取-转换-加载` (ETL) 工具通过图形界面、调度功能以及对几乎所有类型数据源连接的支持，使数据集成更加容易。它们通常具有连接到\
  \ `SAP` 或 `NetSuite` 等企业软件平台的预构建连接器，从而简化了数据访问。其优点是开发时间短；然而，ETL 工具可能成本高昂。仅为了与 `Salesforce\
  \ Analytics Cloud` 集成数据而购买 ETL 工具，其合理性难以证明。组织应检查其现有的 `Salesforce partner` ETL 工具，以确定它们是否原生支持\
  \ `Salesforce Analytics Cloud`。\n-   **`Wave REST API`**：`Wave REST API` 用于从 `Salesforce\
  \ Analytics Cloud` 读取数据（相较于 ETL 工具和 `External Data API` 作为获取数据的方式）。开发使用 `Salesforce\
  \ Analytics Cloud` 产品的公司会使用 `Wave REST API`。这些产品可以是具备商业智能能力的移动应用程序或桌面产品。具有自定义软件开发能力的公司可以使用\
  \ `Wave REST API` 构建从 `Salesforce Analytics Cloud` 检索数据的应用程序。\n\n![A978-1-4842-1203-5_4_Fig1_HTML.jpg](img/A978-1-4842-1203-5_4_Fig1_HTML.jpg)\n\
  \n图 4-1. Salesforce Analytics Cloud 的数据集成方法\n\n现在，让我们更详细地看看每种方法。\n\n### 外部数据 API\n\
  \n`External Data API` 提供了将外部数据集成到 `Salesforce Analytics Cloud` 中的能力。外部数据直接加载到数据集中，然后可用于查询，或用于移动端或桌面端使用\
  \ `Salesforce Analytics Cloud`。为使用 `External Data API`，需遵循以下步骤，如图 4-2 所示。\n\n![A978-1-4842-1203-5_4_Fig2_HTML.jpg](img/A978-1-4842-1203-5_4_Fig2_HTML.jpg)\n\
  \n图 4-2. 使用 External Data API 进行数据集成的步骤\n\n### 第 1 步：创建 .CSV 文件\n\n无论来源如何，所有数据都需转换为\
  \ `.csv` 格式并写入文件，以便使用 `External Data API` 加载到 `Salesforce Analytics Cloud` 中。作为一项编程任务，这通常很容易，但必须注意确保创建的文件不要太大（请参阅下面的“使用限制”）。如果数据源包含逗号或\
  \ `CR/LF`，则还必须注意使用引号标识符。任何被引号标识符包围的字段值中的引号都需要用另一组引号进行转义；例如，`“Don't ““quote”” me.”`。\n\
