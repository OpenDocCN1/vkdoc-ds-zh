  \n## 仪表板设计美学\n\n现在我们已经熟悉了如何在 Salesforce Analytics Cloud 中创建简单仪表板并探索数据。在下一节中，我们将探讨仪表板设计的基本原理。\n\
  \n### 设计美观仪表板的步骤\n\nSalesforce 以打造卓越的客户体验为傲。Salesforce Analytics Cloud 也不例外。正如我们在之前的多个示例中所见，Salesforce\
  \ Analytics Cloud 的可视化能力极具吸引力，而与系统交互时的动画效果更是令人赞叹。然而，仅有可视化效果并不能成就优秀的仪表板和分析解决方案。在本节中，我们将介绍一些关于设计有效且有意义的分析输出的技巧和最佳实践。\n\
  \n#### 理解用户问题\n\nBI 开发人员和分析师在确定其应用程序的使用场景时，常犯的错误是关注那些缺乏相关性或分析价值的指标。好消息是，Salesforce\
  \ Analytics Cloud 本质上是自助服务式的。业务分析师可以通过直观的用户界面探索数据集、设计可视化效果并分享输出。不过，在某些情况下，您可能需要为团队成员设计仪表板。\n\
  \n为了设计有效的输出，第一步是理解业务驱动因素，并确定您的用户关心什么。不要猜测用户认为什么重要，而是直接询问他们，以找出关键的信息需求。许多现代社交网络网站（如\
  \ Facebook）都使用这种策略来了解其广告商的需求，并根据反馈发布用户界面更新。\n\n#### 用户目标\n\n用户体验设计不应采用静态方法，因为人类对信息的需求以及消费所呈现信息的方式各不相同。对一个人有效的方法可能对另一个人无效。最有效的方法是预测特定的体验并塑造某些行为。此外，一个深思熟虑的设计必须针对不同角色或用户群体的目标、价值观和决策过程进行调整。\n\
  \n#### 可用性\n\n用户体验和可用性经常被混为一谈，但它们是两个不同的概念。用户体验关注的是用户在使用系统时的感受，而可用性则关乎界面的用户友好性和效率。\n\
  \n可用性和用户体验也并非完全无关。可用性是用户体验的重要组成部分，在创造有效且愉悦的体验中发挥着重要作用。除可用性外，人因工程、心理学、信息架构以及以用户为中心的设计原则通常也会对用户体验产生重大影响。\n\
  \n\n\n## 设计原则\n\n以下是为分析解决方案设计出色用户体验时需要考虑的一些基本设计原则。\n\n**原则一：确保可读性。** 文本和背景应使用高对比度。例如，白色或浅黄色背景上的黑色文本更易于阅读。此外，字体大小应足够大，以便在标准显示器上清晰可读。\n\
  \n**原则二：考虑设备形态。** 字体和图表显示的大小应基于设备而定。针对 iPad、iPhone 和网页端，要设计不同的可视化和显示方案，并定义其默认及首选的布局。\n\
  \n**原则三：用视觉元素突出重点。** 对于您打算展示的实际数据，应使用特别大的字符，而非标签和说明文字。我们处理信息的方式取决于信息呈现给我们的方式。有效利用粗体、字号、密度和动态效果，来激发我们的视觉敏感度。尽量使用图表而非数字表格。记住，一图胜千言，而每一个词也是一幅图画。\n\
  \n**原则四：考虑年龄因素。** 避免使用年轻用户来评估尺寸和对比度决策。相反，应在您可能预期到的年龄最大的用户群体上测试所有设计。老花眼是一种眼睛逐渐丧失聚焦近处物体能力的自然现象，通常是衰老过程中令人烦恼的一部分。老花眼通常在\
  \ 40 岁出头到中期开始变得明显，并持续恶化直到大约 65 岁。要留意不同年龄在视觉消费需求上的差异。\n\n**原则五：选择简洁的字体。** 虽然手写体被认为具有美学价值，但往往缺乏可读性。人眼对锐利的边缘反应更佳。因此，应避免使用边缘柔化的抗锯齿字体，尤其是在小字号情况下。\n\
  \n**原则六：合理规划布局与显示顺序。** 聚焦关键指标，然后逐步深入到更高级别的细节。将相似的图表对齐以便于比较。平衡自上而下与自下而上的思维方式：在顶部放置关键绩效指标的概览，并巧妙使用警报来推动行动。\n\
  \n**原则七：避免常见错误**，比如在未理解实际需求之前就急于选择工具。另一个常见陷阱是局限于传统 BI 工具的思维框架，从而限制了数据探索和发现的能力。\n\
  \n**原则八：选择优质照片或图片。** 图片讲述故事的能力胜过千言万语，因此为仪表板选择一张好图片至关重要。使用连贯、单一的画面，不要使用由其他小照片拼贴而成的照片。此外，尽量使用颜色和色调不超过\
  \ 3-4 种的图片。否则，它就会分散注意力。使用清晰的图像。示例仪表板上的标题图像尺寸为 1420 像素 x 150 像素，分辨率为 300 ppi。避免使用分辨率较低的图像。不要拉伸图像，因为会导致图像变形和视觉干扰。如果您要在这些图像上添加文本或数字，请提供具有足够对比度的背景，以确保文字清晰可读。\n\
  \n## Mobile Dashboard Designer\n\n在了解了这些设计原则之后，让我们来看看移动仪表板设计器。Salesforce Analytics\
  \ Cloud 从第一天起就支持移动端。通过简单的页面布局配置，Lenses 和仪表板即可在 iPad、iPhone 和 Apple Watch 等移动设备上使用。此外，移动设备不仅仅是可视化工具。您还可以使用移动设备执行构建和设计功能，包括数据集上传和仪表板设计。在本节中，我们将通过一个分步用例，向您展示如何使用移动设备通过数据集创建仪表板。\n\
