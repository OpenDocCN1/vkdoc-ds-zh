  ### 评估工厂经理绩效


  在大多数大型企业中，工厂经理负责制造设施，而企业领导层会持续评估这些工厂经理的绩效。通常，一整年的关键绩效指标（KPI）被用来评估他们的表现。`Salesforce
  Analytics Cloud`使得这项任务变得简单。


