  ## 用例中使用的数据


  我们已经介绍了数据集的创建，现在来看看为渥太华县自行车公司提取的数据，以及用户如何通过使用 Salesforce Analytics Cloud 来获取洞察。


  此用例中的数据涉及销售业绩。渥太华县自行车公司销售各类自行车、配件和自行车零部件，以及骑行服装。其销售通过三种类型的实体进行：专业自行车店、增值经销商和仓库。数据集中的每一行数据都记录了单个交易以及与这些交易相关的销售功能。此数据集中的列包括以下可在
  Salesforce Analytics Cloud 中使用的数据。


  ### 销售金额数据


  - **银行名称**：处理交易的金融机构。

  - **运费**：运费成本。

  - **折扣金额**：给予的折扣。

  - **产品总成本**：产品总成本。

  - **销售金额**：销售额。

  - **税额**：与销售相关的税款金额。


  ### 日期数据


  - **订单日期**：一个或多个产品的订购日期。

  - **日历季度**：订单日期所在的年份季度。

  - **日历年份**：订单数据所在的年份。


  ### 产品数据


  - **产品名称**：所售产品的名称。

  - **产品线**：三个值之一：山地车、公路车或旅行车。

  - **产品类别**：四个值之一：自行车、组件、配件或服装。

  - **产品子类别**：众多值之一，用于更精确地标识产品。可能的几个值包括链条、刹车、帽子、头盔和山地车。


  ### 经销商数据


  - **全名**：渥太华县自行车公司中负责此次销售的销售代表。

  - **经销商名称**：发起销售的公司的名称。

  - **经销商类型**：三个值之一：专业自行车店、增值经销商和仓库。

  - **销售区域-国家**：销售区域所在的国家。

  - **销售区域-地区**：销售区域国家内的地区。

  - **州/省名称**：州或省的名称。

  - **城市**：州或省内的城市。




