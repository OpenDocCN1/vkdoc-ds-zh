  ### 第三步 – 修改元数据并创建数据集


  第三步涉及在 Salesforce Analytics Cloud 中实际创建数据集。在图 6-7 中，消息框右上角有一个“下一步”按钮。按下此按钮将打开元数据编辑器。在此编辑器中，`OttawaCountyBikes.csv`
  中的每一列都被映射到三种数据类型之一。让我们快速介绍这三种数据类型：


  *   **度量** 是定量数据，在 Salesforce Analytics Cloud 中，用户可以针对一个或多个维度分析这些数据。度量必须为数值型数据，因为在
  Salesforce Analytics Cloud 中，会对度量执行数学运算。

  *   **维度** 由描述性数据组成，我们通过维度来评估度量。例如，对于总销售额这一度量，其一个维度可能是地理区域，例如州或省。

  *   **日期** 代表时间，其格式必须能被 Salesforce Analytics Cloud 识别为时间数据。通常，从企业软件数据库提取的数据格式是正确的。通常，此数据类型仅包含日期信息，不包含时间信息。


  通常，导入过程能正确判断数据类型。但在某些情况下，用户可能希望修改数据类型。以 `OttawaCountyBikes.csv` 文件中的数据为例，其中包含完全由数字组成的季度数字。导入过程会将其分配为度量，但我们实际上希望将其用作维度。当导入过程发现字段纯粹是数字时，它会自动将该字段设为度量。由于季度数字是数据的属性，并为数据中的度量增加意义，因此需要将其更改为维度。使用图
  6-8 所示的元数据编辑器，我们可以通过单击向右箭头并选择“度量”，将“日历季度”更改为度量。


