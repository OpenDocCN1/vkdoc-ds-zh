  用户只需将光标放在任何一个方块上，就可以获得热力图上相关 KPI 的值。显示的数据包括年份和月份、KPI 以及工厂编号。例如，在图 5-15 中，显示了 22
  号工厂的吞吐量 KPI。


  ![A978-1-4842-1203-5_5_Fig15_HTML.jpg](img/A978-1-4842-1203-5_5_Fig15_HTML.jpg)


  图 5-15. 2014 年 7 月 22 号工厂的吞吐量数据


  当所生产玻璃的某个方面发生改变时，工厂就会进行产品换产。这些换产记录在仪表盘右下角的热力图中。通常，换产涉及玻璃厚度或颜色的改变，并且往往意味着生产停机。普遍认为换产可能不利于工厂的生产目标，然而，有些工厂，如
  22 号工厂，尽管换产次数很多，却依然表现出色。这是怎么回事呢？


  2014 年 7 月，发生了五次换产，都是关于玻璃厚度的改变；不过，其吞吐量和良率数据表现良好，吞吐量达到了 98%，良率达到了 93%。这些积极的结果在仪表盘上一目了然——这清楚地证明了
  22 号工厂的工厂经理表现卓越。这位工厂经理非但没有惧怕产品换产，反而向他的团队发起挑战，要求他们找到管理换产的创造性方法，并为达到卓越生产数据提供了奖金形式的激励。这一策略取得了成效，22
  号工厂成为整个公司效仿的榜样。


  传统上，企业管理层依赖电子表格来分析绩效，但这种方法没有`Salesforce Analytics Cloud`那样的灵活性。后者的仪表盘提供了紧凑、全面的视图，可以动态更新，并且具备细化数据的能力。图
  5-16 展示了当管理者点击热力图中的一个方块时，如何细化此仪表盘上的数据。


  ![A978-1-4842-1203-5_5_Fig16_HTML.jpg](img/A978-1-4842-1203-5_5_Fig16_HTML.jpg)


  图 5-16. 选择 2014 年 3 月数据时，17 号工厂的低良率数据


  在此期间，尽管图 5-16 中选定的工厂运行时间为 94%，吞吐量为 97%，但其良率仅为 81%。当然，这些数字并非总是管理不善的指标；有时是玻璃熔炉的使用寿命即将结束或需要重建。17
  号工厂的玻璃熔炉上次重建是在 1994 年，因此这里存在这种可能性。无论如何，这类数字令人担忧，并将引发企业管理层的进一步深入研究，但很可能正是因为仪表盘的可读性，这些问题才得以引起注意。


  在本章前面，我们讨论了认知偏见以及数据驱动决策如何能够消除这种认知偏见。对工厂绩效和工厂管理的评估常常会受到这种认知偏见的影响。例如，一位最近在换产总是导致生产数据下降的工厂工作过的管理者，往往会倾向于制定避免换产的排程，以确保生产数据得以维持。这是近因偏差的一个例子。当然，避免换产的缺点是无法灵活地满足市场对产品的需求，导致客户寻找其他供应商。看看
  22 号工厂的高绩效，可以推断出换产是可以管理的，这已在数据中得到证实。


  ## 结论


  正如本章所讨论的，认知偏见可能导致管理层基于不完整或不准确的数据做出不合逻辑的决策；这些决策满足了情感需求或实现了证明自己正确的愿望。每个人都会做出一些错误的决定，或者基于不完整或不准确的信息做出决策；我们都受到认知偏见的影响，却没有意识到它的存在。


  然而，`Salesforce Analytics Cloud`几乎有能力消除认知偏见。我们以一家玻璃公司为例，展示了如何通过快速简便的方式呈现数据，帮助管理者正确诊断设备故障和生产放缓的原因。我们对比了该公司两个工厂的情况，数据揭示了一家工厂成功应对了换产挑战，而另一家工厂的生产数据则不那么令人满意。每个案例的数据都呈现在仪表盘中，便于轻松获取更多细节进行评估和比较。


  我们还看到了`Salesforce Analytics Cloud`如何更高级地应用于组织内部的人员绩效评估。这展示了`Salesforce Analytics
  Cloud`的多功能性，尤其是它在任何情况下都能发挥作用的能力，以及使用户能够在坚实数据的支持下，创造性地做出日常决策的能力。




