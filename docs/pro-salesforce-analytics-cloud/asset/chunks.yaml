    设定事件数量 >= 100 图 3-13 展示了应用所有筛选器后透镜的显示效果。


    ![A978-1-4842-1203-5_3_Fig13_HTML.jpg](img/A978-1-4842-1203-5_3_Fig13_HTML.jpg)


    图 3-13.


    野生动物种类透镜图表


    到目前为止，您应该已经熟悉如何修改透镜以添加新维度并裁剪透镜，具体操作如步骤 7 和 8 所示。重复此过程，为飞行器和飞行员信息添加透镜和图表小组件，如图
    3-14 所示。请注意，您应该使用水平条形图，而不是透镜构建器中的环形图。为以下度量创建全部四个垂直图表：


    *   平均速度（`IAS`），单位：节

    *   最大速度（`IAS`），单位：节

    *   距机场的平均英里数

    *   距机场的最大英里数


    以及以下维度：


    *   飞行员是否收到鸟类或野生动物警告？

    *   高度区间


    透镜构建完成后，将其裁剪并添加至仪表板底部。请注意，所有四个水平图表均被裁剪。在仪表板设计器中，仅需一个图表小组件即可包含这些内容。这种在透镜构建器中组合多个小组件的方法，是构建仪表板时一种有用的分组技巧。


    ![A978-1-4842-1203-5_3_Fig14_HTML.jpg](img/A978-1-4842-1203-5_3_Fig14_HTML.jpg)


    图 3-14.


    飞行器和飞行员信息的图表小组件


    现在，仪表板设计器的布局如图 3-15 所示。在仪表板设计器的右侧，选中任意小组件时都会出现属性选择器。使用“显示图例”选择器为每个环形图显示图例。


    ![A978-1-4842-1203-5_3_Fig15_HTML.jpg](img/A978-1-4842-1203-5_3_Fig15_HTML.jpg)


    图 3-15.


    鸟击仪表板设计器视图


    点击绿色的“运行”按钮，图 3-16 将展示“鸟击”仪表板的最终成品。


    ![A978-1-4842-1203-5_3_Fig16_HTML.jpg](img/A978-1-4842-1203-5_3_Fig16_HTML.jpg)


    图 3-16.


    鸟击仪表板视图


    对于熟悉所用数据的人来说，整个仪表板的创建不超过 15 分钟。如果您不熟悉数据集包含的内容，还可以使用透镜界面中的分组和度量功能来探索数据。这些易于使用的方法非常直观，有助于发现数据的隐藏趋势，包括高阶基数、属性分布以及意想不到的关联。


    ## 仪表板设计美学


    现在我们已经熟悉了如何在 Salesforce Analytics Cloud 中创建简单仪表板并探索数据。在下一节中，我们将探讨仪表板设计的基本原理。


    ### 设计美观仪表板的步骤


    Salesforce 以打造卓越的客户体验为傲。Salesforce Analytics Cloud 也不例外。正如我们在之前的多个示例中所见，Salesforce
    Analytics Cloud 的可视化能力极具吸引力，而与系统交互时的动画效果更是令人赞叹。然而，仅有可视化效果并不能成就优秀的仪表板和分析解决方案。在本节中，我们将介绍一些关于设计有效且有意义的分析输出的技巧和最佳实践。


    #### 理解用户问题


    BI 开发人员和分析师在确定其应用程序的使用场景时，常犯的错误是关注那些缺乏相关性或分析价值的指标。好消息是，Salesforce Analytics Cloud
    本质上是自助服务式的。业务分析师可以通过直观的用户界面探索数据集、设计可视化效果并分享输出。不过，在某些情况下，您可能需要为团队成员设计仪表板。


    为了设计有效的输出，第一步是理解业务驱动因素，并确定您的用户关心什么。不要猜测用户认为什么重要，而是直接询问他们，以找出关键的信息需求。许多现代社交网络网站（如
    Facebook）都使用这种策略来了解其广告商的需求，并根据反馈发布用户界面更新。


    #### 用户目标


    用户体验设计不应采用静态方法，因为人类对信息的需求以及消费所呈现信息的方式各不相同。对一个人有效的方法可能对另一个人无效。最有效的方法是预测特定的体验并塑造某些行为。此外，一个深思熟虑的设计必须针对不同角色或用户群体的目标、价值观和决策过程进行调整。


    #### 可用性


    用户体验和可用性经常被混为一谈，但它们是两个不同的概念。用户体验关注的是用户在使用系统时的感受，而可用性则关乎界面的用户友好性和效率。


    可用性和用户体验也并非完全无关。可用性是用户体验的重要组成部分，在创造有效且愉悦的体验中发挥着重要作用。除可用性外，人因工程、心理学、信息架构以及以用户为中心的设计原则通常也会对用户体验产生重大影响。

