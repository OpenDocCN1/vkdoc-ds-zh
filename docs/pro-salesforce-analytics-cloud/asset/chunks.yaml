- fmt: '### Diagnosis of Machine Problem


    The problem affecting line 1 was corrected at the start of the third shift, and
    at that point the production performance returned to normal. During the course
    of those two earlier shifts, though, operators attempted to correct the problem
    themselves, but were not successful. The shift foreman for the third shift noticed
    the downward trend on the dashboard and called in maintenance personnel.


    A maintenance technician determined that the problem was an abnormally low lubricant
    level in a gearbox on a conveyor. (As we will see later, the maintenance technician
    used a dashboard developed in Wave Analytics to zero in on the problem.) By way
    of explanation, know that the gearbox is attached to a motor, which is in turn
    connected to a drive, which controls its speed. The drive is connected to a device-level
    network. Diagnostic information is collected from the drive by a programmable
    controller, with data ultimately stored in a SCADA system. For each conveyor,
    there is a button that resets the control logic in the programmable controller
    and clears any drive faults. Figure [5-8](#A978-1-4842-1203-5_5_Chapter.html#Fig8)
    depicts these components for one conveyor on line 1.


    ![A978-1-4842-1203-5_5_Fig8_HTML.jpg](A978-1-4842-1203-5_5_Fig8_HTML.jpg)

    *Figure 5-8. Mechanical and control equipment for conveyor on line 1*


    Operators tend to use the reset button to clear faults quickly, and they do not
    always determine the reason a conveyor has stopped. Faults are often attributed,
    therefore, to an incorrect cause that may not have existed. Yet tracking such
    faults is critical to improving performance; refining the maintenance practices
    can help address such recurring problems. In the case of the drive fault that
    occurred on line 1 because of a low gearbox lubricant level, preventive maintenance
    should include checking these lubricant levels.


    However, in this instance, the maintenance worker was able to diagnose this problem
    with data collected from the line 1 drives, made available in the dashboard. Here’s
    how: An average reading of electric current is maintained for each drive, and
    it is based on empirically collected data gathered over the last three months.
    The average current for each shift is also calculated by the SCADA system, as
    is the highest and lowest current readings. Figure [5-9](#A978-1-4842-1203-5_5_Chapter.html#Fig9)
    depicts the flow for data collected for each conveyor.


    ![A978-1-4842-1203-5_5_Fig9_HTML.jpg](A978-1-4842-1203-5_5_Fig9_HTML.jpg)

    *Figure 5-9. Data flow for conveyor operational monitoring*


    The collected electrical data is incorporated into a dashboard shown in Figure
    [5-10](#A978-1-4842-1203-5_5_Chapter.html#Fig10). This dashboard reveals all of
    the data on electric current collected for all three shifts. The dashboard thus
    readily identifies any drive with overly high electrical current conditions. A
    bubble chart pinpoints any drives having consistently higher current than normal.
    (By way of explanation, the delta high current is the difference between the average
    current for the drive and the highest current recorded for a shift.) The bubbles
    on the left indicate normally running drives; the bubbles on the right show an
    anomaly and should be investigated.


    In this case, the bubble chart provided data for the three shifts, as shown in
    Figure [5-10](#A978-1-4842-1203-5_5_Chapter.html#Fig10). The maintenance technician
    saw the two bubbles on the right and selected to view additional information associated
    with them. Both of the bubbles show high current readings for conveyor 12, which
    led that maintenance technician to investigate the mechanical system associated
    with conveyor 12, and ultimately to find the low gearbox lubrication level.


    ![A978-1-4842-1203-5_5_Fig10_HTML.jpg](A978-1-4842-1203-5_5_Fig10_HTML.jpg)

    *Figure 5-10. Dashboard for line 1, shift 1 current use*


    ### Eliminating Cognitive Bias with Data


    This use case shows how data can be used to thwart cognitive bias in resolving
    problems of machine failure. Production workers have a strong incentive to keep
    their lines running, so they tend to clear the faults quickly and “guess” why
    a failure occurred. Their guesses, though, are often based on most recent experience,
    perhaps on other production lines, and thus are a good example of the recency
    bias mentioned earlier. Understandably, plant management is quick to defend this
    practice because of its desire to keep the production lines running, but ultimately
    the approach is detrimental to performance. In this example, data was used to
    find the true cause of the problem.


    ## Corporate-Level Reporting


    Now let’s look at some examples involving corporate-level data use. As shown in
    Figure [5-3](#A978-1-4842-1203-5_5_Chapter.html#Fig3), there is a corporate hierarchy
    in our glass company at both the facility level and corporate headquarters. Turnover
    in these leadership positions is normal, so having a quick reference for managers
    who are “ramping up” makes these transitions easier. Rather that put this information
    into a published manual, the glass company has a dashboard that presents a quick
    summary of the float glass manufacturing facilities, based on the tonnage of glass
    produced per day.


    What is compelling about this summary is its versatility. On the desktop client,
    there is a dashboard that allows refinement based on country, glass product type,
    and plant number. Figure [5-11](#A978-1-4842-1203-5_5_Chapter.html#Fig11) shows
    this desktop web browser dashboard.


    ![A978-1-4842-1203-5_5_Fig11_HTML.jpg](A978-1-4842-1203-5_5_Fig11_HTML.jpg)

    *Figure 5-11. Dashboard for float glass capacity*


    When a manager selects USA as the country, the dashboard changes to the one shown
    in Figure [5-12](#A978-1-4842-1203-5_5_Chapter.html#Fig12).


    ![A978-1-4842-1203-5_5_Fig12_HTML.jpg](A978-1-4842-1203-5_5_Fig12_HTML.jpg)

    *Figure 5-12. Dashboard for USA float glass capacity*


    This dashboard is also available on the Apple iPhone and the Apple Watch, as shown
    in Figure [5-13](#A978-1-4842-1203-5_5_Chapter.html#Fig13).


    ![A978-1-4842-1203-5_5_Fig13_HTML.jpg](A978-1-4842-1203-5_5_Fig13_HTML.jpg)

    *Figure 5-13. Dashboard for float glass capacity, on iPhone (left) and Apple Watch
    (right)*


    This simple dashboard showing production capacity can be created from a dataset
    based on an Excel spreadsheet, and it can be done in minutes. This speed makes
    the Salesforce Analytics Cloud the most expeditious way to make valuable information
    available, with a user interface that allows the data to be refined easily on
    either a desktop or mobile device. But let’s look at some examples of this.'
