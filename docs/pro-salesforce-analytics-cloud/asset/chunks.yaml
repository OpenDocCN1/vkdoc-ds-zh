- fmt: '# Design Principles


    Here are some of the basic design principles to consider when designing great
    user experience for analytics solutions.


    **Principle #1: Ensure readability.** Use high contrast for text and background.
    For example, black text on white or pale yellow backgrounds makes it more consumable.
    In addition, font sizes should be large enough to be readable on standard displays.


    **Principle #2: Consider form factor.** The size of the font and chart display
    should be based on the device. Design visualization and display differently and
    define default and preferred layout for an iPad, iPhone, and web.


    **Principle #3: Emphasize with visuals.** Favor particularly large characters
    for the actual data you intend to display as opposed to labels and instructions.
    The way we process information is guided by how it’s presented to us. Use boldface,
    size, density, and movement effectively to activate our visual sensitivity. Try
    to use charts instead of tables of numbers. Remember, a picture is worth a thousand
    words and every word is a picture.


    **Principle #4: Consider age factor.** Avoid using younger audience to make size
    and contrast decisions. Instead, test all designs on the oldest user population
    you might be expecting. Presbyopia, a condition of gradual loss of our eyes''
    ability to focus on nearby objects, is a natural, often annoying part of aging.
    Presbyopia usually becomes noticeable in our early to mid-40s and continues to
    worsen until around age 65. Be mindful of age differences in visual consumption
    needs.


    **Principle #5: Choose simple fonts.** Cursive Fonts that are considered aesthetically
    pleasing suffers lack of readability. Human eyes tend to respond better to sharp
    edges. As a result, anti-aliasing fonts with softened edge should be avoided,
    especially in smaller font sizes.


    **Principle #6: Be smart with layout and display order.** Focus on key metrics
    and gradually descend into higher level of details. Align similar charts for comparison
    purposes. Balance top down vs. bottom up thinking with overviews of KPI on top
    and smart use of alerts to drive actions.


    **Principle #7: Avoid common mistakes** of jumping to tools first without understanding
    actual requirements. Another common pitfall is to think within the constraints
    of traditional BI tools thus limiting the power of data exploration and discovery
    capabilities.


    **Principle #8: Choose a good photo or image.** Pictures tell a story better than
    a thousand words, so it is important that you choose a good image for your dashboards.
    Use cohesive, single image and don’t use photos that are collages of other small
    photos. In addition, try to use an image that has maximum 3-4 colors and shades.
    Otherwise, it becomes a distraction. Use crisp images. Header image on the sample
    dashboard is 1420 px by 150 px with 300 ppi resolution. Avoid using images with
    less resolution. Don’t stretch an image, as it’ll create distortion and distraction.
    If you are adding text or numbers on these images, provide a background with sufficient
    contrast so that the text is legible.


    ## Mobile Dashboard Designer


    With these design principles in mind, let’s take a look at the mobile dashboard
    designer. Salesforce Analytics Cloud is mobile-ready on day one. Lenses and dashboards
    are available on mobile devices such as iPad, iPhone, and Apple Watch with simple
    page layout configurations. In addition, mobile devices are not just visualization
    vehicles. You can also perform build and design functions using mobile devices
    including dataset upload and dashboard design. In this section, we’ll walk you
    through a step-by-step use case of using mobile device to create dashboard through
    datasets.


    ### Upload Dataset Through Mobile Device


    There are a number of ways you can upload a dataset into Analytics Cloud using
    your mobile device. It can be done through email attachment, files in cloud services
    such as Dropbox or Salesforce Files. We’ll show you how to use Dropbox to upload
    a dataset into Analytics Cloud in our example.


    Open “Dropbox” App on your iPhone, and navigate to folder with `“Infant Mortality.csv”`
    (see Figure [3-17](#A978-1-4842-1203-5_3_Chapter.html#Fig17)).


    ![A978-1-4842-1203-5_3_Fig17_HTML.jpg](A978-1-4842-1203-5_3_Fig17_HTML.jpg)


    **Figure 3-17.** Dropbox application with files used in this chapter


    In the Dropbox display screen shown in Figure [3-17](#A978-1-4842-1203-5_3_Chapter.html#Fig17),
    select the file named `“Infant Mortality”`. The file info screen will be displayed
    (see Figure [3-18](#A978-1-4842-1203-5_3_Chapter.html#Fig18)).


    ![A978-1-4842-1203-5_3_Fig18_HTML.jpg](A978-1-4842-1203-5_3_Fig18_HTML.jpg)


    **Figure 3-18.** File info view


    In the file info screen shown in Figure [3-18](#A978-1-4842-1203-5_3_Chapter.html#Fig18),
    tap the icon ![A978-1-4842-1203-5_3_Figb_HTML.jpg](A978-1-4842-1203-5_3_Figb_HTML.jpg)
    in the upper right corner of the screen and select “Copy to Wave Analytics” icon
    as shown in Figure [3-19](#A978-1-4842-1203-5_3_Chapter.html#Fig19).


    ![A978-1-4842-1203-5_3_Fig19_HTML.jpg](A978-1-4842-1203-5_3_Fig19_HTML.jpg)


    **Figure 3-19.** Upload file into Salesforce Analytics Cloud


    A data connector popup appears as shown in Figure [3-20](#A978-1-4842-1203-5_3_Chapter.html#Fig20).
    You can scroll indicate that you do not want to see this again. On Figure [3-20](#A978-1-4842-1203-5_3_Chapter.html#Fig20),
    press “next.”


    ![A978-1-4842-1203-5_3_Fig20_HTML.jpg](A978-1-4842-1203-5_3_Fig20_HTML.jpg)


    **Figure 3-20.** Data connector popup


    Change the Field Type to `“Dimension”` for `“Year”` attribute. See Figure [3-21](#A978-1-4842-1203-5_3_Chapter.html#Fig21).


    ![A978-1-4842-1203-5_3_Fig21_HTML.jpg](A978-1-4842-1203-5_3_Fig21_HTML.jpg)


    **Figure 3-21.** Change year from measure to dimension


    Set the name of the dataset to `“Infant Mortality”` and tap on `“Import”` (see
    Figure [3-21](#A978-1-4842-1203-5_3_Chapter.html#Fig21)). Import process begins,
    as shown in Figure [3-22](#A978-1-4842-1203-5_3_Chapter.html#Fig22). Tap done
    when import completes.


    ![A978-1-4842-1203-5_3_Fig22_HTML.jpg](A978-1-4842-1203-5_3_Fig22_HTML.jpg)


    **Figure 3-22.** Import complete


    After you press “Done” you will see the dataset created (see Figure [3-23](#A978-1-4842-1203-5_3_Chapter.html#Fig23)).
    Press the `“i”` next to the dataset name to see options to open a lens by pressing
    `“Open”` or `“Create”` to start the dashboard designer. Press `“Create”` to prepare
    for the next exercise in this chapter which involves creating a mobile dashboard.


    ![A978-1-4842-1203-5_3_Fig23_HTML.jpg](A978-1-4842-1203-5_3_Fig23_HTML.jpg)


    **Figure 3-23.** Dataset ready for use, press create to start dashboard designer'
