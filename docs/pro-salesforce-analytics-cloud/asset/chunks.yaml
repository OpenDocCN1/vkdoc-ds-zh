    be performed with data discovery tools. With the capabilities of these data discovery
    tools, the data is “democratized” and users can become “citizen data scientists.”


    To understand how this is possible, let’s examine some of the most prominent features
    of data discovery tools, focusing on the Salesforce Analytics Cloud. Figure [1-3](#A978-1-4842-1203-5_1_Chapter.html#Fig3)
    shows a simple logical diagram of a data discovery platform.


    ![A978-1-4842-1203-5_1_Fig3_HTML.jpg](A978-1-4842-1203-5_1_Fig3_HTML.jpg)


    Figure 1-3.


    Logical diagram of data discovery platform


    ### Self-Service Application Development and Analytic Interface


    The Salesforce Analytics Cloud features a self-service portal that allows users
    to provision their own datasets and then to create analytic applications that
    use those datasets. For more complex data sources, programmers can create datasets
    and make them available to the portal users.


    The analytic capability of the Salesforce Analytics Cloud relies on its visualization
    tools to give users the ability to easily understand data; they can also apply
    refinements by clicking on part of visualization and observing the changes that
    occur in other visualizations or table components. In this way, the Salesforce
    Analytics Cloud is capable of performing descriptive analytics, answering the
    question “What happened?”; it excels at diagnostic analytics, also answering the
    question “Why did it happen?”


    ### A Data Server


    The Salesforce Analytics Cloud features a data server that is specially designed
    to facilitate analytics and data discovery. This data server should not be confused
    with relational database servers; it has a much different way of storing data
    and establishing relationships between data.


    The design of this data server is based on a faceted data model, whereby each
    record captured from a source is stored as an independent record, and each column
    in the record becomes an attribute, or “facet,” of the record. Indexes are built
    on each facet, allowing rapid retrieval.


    The Salesforce Analytics Cloud allows real-time exploration of data, which involves
    navigating all the records in a dataset in real time. When data is queried from
    the data server during such real-time exploration, the records are held in memory.
    This in-memory aspect of data discovery data servers is critical for achieving
    performance in real-time data exploration.


    ### Data-Loading Interfaces and APIs


    The Salesforce Analytics Cloud provides a variety of methods for loading data.
    End users can create datasets and load data into them from a web user interface.
    The Salesforce Analytics Cloud also provides web services to load the data. Specifically,
    the Salesforce Analytics Cloud supports both the venerable XML-based Simple Object
    Access Protocol, also known as SOAP, and the Representational State Transfer,
    also known as REST.


    Support for Extract Transfer Load, or ETL, tools is provided primarily through
    the web services to load data into the Wave data server. Many other data discovery
    products require customers to purchase and use ETL tools that have been developed
    specifically for their data discovery products. Because Salesforce fosters partnerships
    with other IT product companies, a wide range of ETL products support the Salesforce
    Analytics Cloud.


    The Salesforce Analytics Cloud is a complete technical solution for capturing
    and storing data, as well as deriving analytic value from it. The Salesforce Analytics
    Cloud is agnostic to the variety of source data, and is adept at processing both
    structured data and unstructured data. Compare this to the technologies associated
    with Big Data like HDFS, which only provide a storage solution, and it is not
    difficult to see why data discovery products like the Salesforce Analytics Cloud
    are enjoying a high adoption rate. According to Gartner Inc., the leading technology
    research firm, data discovery products now dominate all new spending on BI and
    analytic tools.'
  trans: '

    ### 数据不确定性


    图 1-2 展示了向数据湖演进的历程。从大数据中获取价值的第一个障碍是数据不确定性，它源于数据的“多样性”方面。在 2010 年左右`HDFS`诞生的早期，人们倾向于关注大数据的容量和速度特性，因为当时的首要挑战仅仅是如何存储大量快速生成的数据。事实证明，数据的多样性充满了问题，也是导致数据不确定性的根源。大多数组织都习惯于与数据仓库相关的范式，在数据仓库中，通常只有少数几个高价值数据源。这些数据源是已知的，并且通常有完善的文档记录。相比之下，大多数数据湖拥有来自数百个数据源的数据。


    从数据分析师或用户的角度来看，关于哪些数据可用以及正在聚合的数据的价值存在高度的不确定性。对于传统的商业智能和数据仓库解决方案而言，解决这种不确定性所需时间的
    80%都花在了前期任务上（例如，需求收集、数据建模、数据清理和构建数据仓库）。当我们考虑到数据湖中将包含数百个数据源（其中大部分产生非结构化数据）时，所需的时间只会增加。大量数据源的影响，再乘以前期任务所花费的时间，使得数据不确定性成为一个长期问题。


    ![A978-1-4842-1203-5_1_Fig2_HTML.jpg](img/A978-1-4842-1203-5_1_Fig2_HTML.jpg)


    图 1-2.


    数据湖的演进过程


    ### 人才稀缺


    从大数据中获取价值的第二个障碍是缺乏能够处理这些数据源的专业人员。精通大数据工作的数据科学家和程序员供不应求。从`HDFS`中提取信息所需的工具和编程知识的复杂性相当高，因此，有人倡议使用像`SQL`这样不那么复杂的工具来访问大数据。然而，这种方法在使大数据更易于访问或解决数据不确定性的挑战方面，基本上收效甚微。这个人才问题不容易解决，因为我们不能指望数据科学家或程序员的供给能在短期内增加。鉴于这两个障碍，更好的策略是重新思考当前处理大数据的方法，并重新考虑我们如何处理非结构化数据。


    ## 数据发现


    为了摆脱对数据科学家和开发人员的依赖，一个显而易见的解决方案是提供能够让用户克服数据不确定性障碍的界面。业务分析师、数据分析师和领域专家习惯于使用工具，而不是命令行界面或代码编辑器，因此这些界面必须是图形化且直观的。


    这些工具的总体目标是让用户能够执行一些原本由数据科学家完成的基本任务。查看数据源记录计数、检查数据随时间或其它维度的分布情况、以及确定数据的整体质量，这些都是可以使用数据发现工具完成的基本任务。借助这些数据发现工具的能力，数据得以“民主化”，用户也能成为“公民数据科学家”。


    要理解这是如何实现的，让我们以`Salesforce Analytics Cloud`为重点，检视一下数据发现工具的一些最显著的特性。图 1-3 展示了一个数据发现平台的简单逻辑图。


    ![A978-1-4842-1203-5_1_Fig3_HTML.jpg](img/A978-1-4842-1203-5_1_Fig3_HTML.jpg)


    图 1-3.


    数据发现平台的逻辑图


    ### 自助式应用开发和分析界面


    `Salesforce Analytics Cloud`配备了一个自助服务门户，允许用户配置自己的数据集，然后创建使用这些数据集的分析应用。对于更复杂的数据源，程序员可以创建数据集并将其提供给门户用户使用。


    `Salesforce Analytics Cloud`的分析能力依赖于其可视化工具，这些工具使用户能够轻松理解数据；用户还可以通过点击可视化的某一部分并观察其它可视化或表格组件发生的变化来进行细化调整。通过这种方式，`Salesforce
    Analytics Cloud`能够执行描述性分析，回答“发生了什么？”的问题；它更擅长于诊断性分析，同样也能回答“为什么会发生？”的问题。


    ### 数据服务器


    `Salesforce Analytics Cloud`配备了一个专为促进分析和数据发现而设计的数据服务器。不要将此数据服务器与关系型数据库服务器混淆；它在存储数据以及建立数据间关系的方式上截然不同。


    该数据服务器的设计基于分面数据模型，即从源捕获的每条记录都作为独立记录存储，记录中的每一列都成为该记录的一个属性或“分面”。每个分面都建立了索引，从而支持快速检索。


    `Salesforce Analytics Cloud`支持数据的实时探索，这涉及到实时浏览数据集中的所有记录。在此类实时探索期间，当从数据服务器查询数据时，记录会保存在内存中。数据发现数据服务器的这种内存特性对于在实时数据探索中实现高性能至关重要。


    ### 数据加载接口与 API


    `Salesforce Analytics Cloud`提供了多种加载数据的方法。终端用户可以通过 Web 用户界面创建数据集并将数据加载其中。`Salesforce
    Analytics Cloud`也提供了用于加载数据的 Web 服务。具体来说，`Salesforce Analytics Cloud`既支持经典的基于`XML`的简单对象访问协议（也称`SOAP`），也支持表述性状态转移（也称`REST`）。


    对提取转换加载（`ETL`）工具的支持主要通过用于将数据加载到`Wave`数据服务器中的 Web 服务提供。许多其他数据发现产品要求客户购买和使用专门为其数据发现产品开发的`ETL`工具。由于`Salesforce`与其他
    IT 产品公司建立了合作关系，因此广泛的`ETL`产品都支持`Salesforce Analytics Cloud`。


    `Salesforce Analytics Cloud`是一个完整的技术解决方案，用于捕获和存储数据，并从中获取分析价值。`Salesforce Analytics
    Cloud`对源数据的多样性没有要求，并且擅长处理结构化和非结构化数据。将此与像`HDFS`这样仅提供存储解决方案的大数据相关技术进行比较，就不难理解为什么像`Salesforce
    Analytics Cloud`这样的数据发现产品能够获得如此高的采用率了。根据领先的技术研究公司`Gartner Inc.`的数据，数据发现产品现在主导着商业智能和分析工具的所有新支出。

