    # 关键决策与认知偏差


    在深入探讨具体用例之前，我们先来审视关键决策的本质，并思考为何如此多的人在这方面表现欠佳。在探讨关键决策这一话题时，思想领袖们指出，做出正确决策的最大障碍在于**偏见**。作为独立的决策者，我们都会受到认知偏差的影响——即我们固守的某些假设，这些假设会变成阻碍我们理性决策的思维模式。认知偏差有多种表现形式，以下列举几例。


    -   **近因偏差** 这种偏差是指我们倾向于过度受最近经历的影响。例如，许多人认为 2007 年的金融危机是银行系统历史上最严重的失败；然而，对`FDIC`而言，20
    世纪 80 年代末的储贷危机造成的损失要惨重得多。这一事实可以通过查阅`FDIC`公开可得的数据轻易得到证实。

    -   **沉没成本偏差** 这种偏差源于我们倾向于在错误投资上追加投入。公司常常投资于最终被证明存在缺陷的技术，然后耗费过多的人力资本去试图让这些技术运作起来。

    -   **过度自信偏差** 那些通过运气或特殊情境获得成功，而未曾经历逆境的人，往往会表现出过度自信。这导致他们在决策时忽略应有的审慎和风险评估。例如，`IBM`曾一度在计算机行业占据主导地位，以至于人们难以想象该公司会失去其地位。当`IBM`推出个人电脑时，它采用了任何人都能复制的开放式架构，使用了`Intel`提供的微处理器，并安装了`Microsoft`提供的操作系统。`IBM`相信其市场主导地位能阻止他人竞争，但短时间内，`Compaq`就生产出了第一台与`IBM
    PC`兼容的机器（或称克隆机）。`IBM`的过度自信最终帮助`Microsoft`和`Intel`成为个人电脑时代最大的两家科技公司。在谈到`IBM`决定制造开放式架构个人电脑这一重大决策时，`Microsoft`创始人`比尔·盖茨`将成功描述为一种威胁，这种威胁会愚弄聪明人，让他们相信自己不可能失败。


    像`Salesforce Analytics Cloud`这样的数据发现产品，通过让我们最大程度地利用数据来避免偏见，从而助力关键决策。这些产品消除了导致我们在决策中犯错的种种因素，并帮助我们避免像认知偏差这样的陷阱。在本章的用例中，我们将看到如何利用这样的工具来更好地管理制造运营，并在多个层面评估人员绩效。


    ## 用例中的制造商


    我们的制造业示例包含多个不同的数据域，我们将详细探讨其中两个。第一个域涉及与监控和控制生产过程相关的仪表与控制数据。第二个域涉及制造设施的性能，包括设施层面和整个公司层面。我们重点介绍这两个不同的域，以说明`Salesforce
    Analytics Cloud`如何轻松处理从工厂车间到董事会的任何数据。


    由于部分读者可能不熟悉制造工艺，或与典型制造相关的仪表与控制数据，这里有必要提供一些背景信息。例如，您可能听说过被大肆宣传的术语`物联网`，或称`IoT`。这指的是拥有以太网连接能力的大量设备，从空调到飞机，无所不包。在推广大数据相关技术的应用时，供应商和技术布道者指出，`IoT`产生的数据速度比历史上任何时候都快。那些已涉足制造业的人可能对此数据产生速率已有切身体会，因为制造设施几十年来一直在其关系型数据库中积累此类数据。


    为了介绍这个领域，让我们以玻璃制造工艺为例，重点关注其中涉及的仪表与控制数据。图`5-1`是该工艺的历史概述。最终，我们将利用这些背景信息来介绍玻璃制造设施的类型及其相关的运营数据，以及`Salesforce
    Analytics Cloud`如何在这两个领域中运作，为决策提供更完善的依据。


    ![A978-1-4842-1203-5_5_Fig1_HTML.jpg](img/A978-1-4842-1203-5_5_Fig1_HTML.jpg)


    **图 5-1.** 玻璃制造数据与控制简史


    ### 早期玻璃制造


    早在公元前 3500 年，古埃及和美索不达米亚就开始制造玻璃，而中国则在公元前 1600 年就开始制作瓷器。在那个时代，没有机器；工艺涉及手工熔化并成型二氧化硅，由玻璃工匠调节热量强度并控制气流。早期的玻璃制造依赖于工匠监控的技能——这些技能是通过多年的学徒生涯习得的。这些工匠依靠对材料模式的识别能力，在直觉层面做出决定。如今，艺术玻璃仍以这种方式生产，但大部分商业玻璃制品是工业化生产的。


    ### 早期仪表化与增强的统计过程控制


    几个世纪以来，对模式识别的依赖让位于现代制造工艺，这不仅仅发生在玻璃制造领域，而是涵盖了所有类型的生产。人们使用仪表来测量工艺过程中材料的基本物理属性，如温度、压力和气流，使工厂工人能够通过简单的开关设备（如电机），或通过打开/关闭阀门来控制温度，从而手动改变工艺输入。


    到了 20 世纪 50 年代，来自制造业仪表的物理测量值与统计分析相结合，产生了监控系统，从而对产品质量施加了更多控制。这一创新最著名的例子是`统计过程控制`，或称`SPC`，由`W.
    爱德华兹·戴明`在战后的日本率先倡导。到 20 世纪 80 年代，美国制造商也采用了`SPC`。它代表了 20 世纪制造业最重要的变革之一，开创了制造业质量的新纪元。`SPC`也是数据如何驱动决策的一个早期典范。

