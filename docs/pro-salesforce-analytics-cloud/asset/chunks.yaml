    ### 深入探究


    此时，仅通过使用仪表板就可能会产生一些问题。例如，我们已确定第一季度业绩稳步提升，但尚未了解其原因。幸运的是，借助 Salesforce Analytics
    Cloud，我们可以快速开发一个新的仪表板来解答这个问题！但在着手开发另一个仪表板之前，让我们更详细地审视这个问题。销售增长是由于特定区域的业绩提升？是由于特定产品线？还是由于特定产品类别？正如您将看到的，我们可以轻松找到这些问题的答案。


    为此，我们开发了一个包含四个柱状图的仪表板。第一个柱状图是每年的第一季度数据，作为其他三个堆叠柱状图的参考。这些堆叠柱状图分别对应销售区域、产品线和产品类别。这个仪表板名为“第一季度增长研究”，如图
    6-16 所示。


    ![A978-1-4842-1203-5_6_Fig16_HTML.jpg](img/A978-1-4842-1203-5_6_Fig16_HTML.jpg)


