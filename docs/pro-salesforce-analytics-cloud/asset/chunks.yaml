  trans: '

    # 数据湖的替代方案


    对于正在寻找策略来管理其 80%到 90%的半结构化或非结构化数据（这些数据可以与来自结构化来源的数据共存）的组织来说，`Salesforce Analytics
    Cloud` 是一个替代方案。没有任何数据发现解决方案具备`HDFS`那样的容量，因此它不适合捕获海量数据。然而，对于那些不具有高数据量或高速度特性的非结构化数据，`Salesforce
    Analytics Cloud` 可以作为将这些数据倾倒进数据湖的一种替代方案。


    这种方案的优势在于，许多数据源可以加载到`Salesforce Analytics Cloud`的数据集中，而几乎不需要 IT 人员的参与。通过`Salesforce
    Analytics Cloud`，用户可以创建应用程序来提供图形和表格查看工具，这些工具的开发周期很短，通常只需几个小时。


    `Salesforce Analytics Cloud` 还可以用于针对完全事务性的数据源开发仪表板和快速报表。使用数据发现工具，比使用传统的商业智能和报表工具更容易“完成最后一英里”。用户不再那么倾向于通过在`Microsoft
    Excel`等办公工具中运行即席查询来创建“不合规”的业务流程以进行分析，而是会转而使用`Salesforce Analytics Cloud`。


    ## Salesforce Analytics Cloud 简介


    让我们更仔细地了解一下`Salesforce Analytics Cloud`，并看看它的两个主要平台：移动端和桌面端。请记住，这些信息仅仅是功能的概述，更详细的内容将在第
    2 章、第 3 章和第 4 章中介绍。


    ### 移动端平台


    `Salesforce Analytics Cloud`强调移动优先，提供了“随时随地的分析”。现在，分析功能触手可及。在 2007 年`苹果 iPhone`发布的激动人心的日子里，`史蒂夫·乔布斯`强调，`iPhone`是你能够塞进牛仔裤后兜里的东西，一个始终可用的移动计算平台，距离你不会比你的钱包或钥匙更远。


    自`iPhone`发布以来，移动访问一直是云计算最引人注目的应用之一，它利用触摸显示屏提供连接到基于云的基础设施的丰富界面——然而这个基础设施对用户来说是透明的。智能手机及其直系后代平板电脑，主要用于消费数据，这主要是因为在小屏幕和屏幕键盘上创建内容很困难。然而，随着用户开始将这些设备视为数字生活中的主要界面，软件设计师们通过提供具有复杂内容创建能力的移动应用程序来响应这一趋势。`Salesforce
    Analytics Cloud`顺应了这一趋势，允许用户上传数据、创建数据视图，然后将这些视图整合到仪表板中。


    通过`Salesforce Analytics Cloud`移动应用，用户可以从逗号分隔值（`.csv`）文件、制表符分隔值文件（`TSV`）、`Microsoft
    Excel`文件以及包含这些文件类型的压缩包中配置数据集。这些文件可以从移动设备上访问，包括来自网站、电子邮件附件以及诸如`Dropbox`和`Salesforce`文件等文件存储库服务的文件。创建数据集后，用户可以创建“透镜”，即通过过滤器和排序形成的视图。这些透镜包含图形或表格组件，可在移动设备上查看。在移动设备上也可以访问和创建仪表板；它们是透镜的集合，提供数据的多种或组合视图。用户可以通过截取图形元素屏幕截图或从表格组件发送`.csv`提取文件来与他人分享他们的发现。


    2015 年 4 月，`苹果`发布了`苹果手表`，`苹果`称其为“有史以来最个性化的设备”。`Salesforce Analytics Cloud`有一个适用于`苹果手表`的应用，可以访问仪表板或透镜，允许用户使用手表的触摸屏界面和数码表冠来浏览数据。


    图 1-4 展示了`Salesforce Analytics Cloud`用于移动分析体验的主要组件。


    ![A978-1-4842-1203-5_1_Fig4_HTML.jpg](img/A978-1-4842-1203-5_1_Fig4_HTML.jpg)


    图 1-4.


    `Salesforce Analytics Cloud`用于移动端的组件


    ### 桌面端平台


    图 1-5 展示了`Salesforce Analytics Cloud`桌面端功能的组件。


    ![A978-1-4842-1203-5_1_Fig5_HTML.jpg](img/A978-1-4842-1203-5_1_Fig5_HTML.jpg)


    图 1-5.


    `Salesforce Analytics Cloud`用于桌面端的组件


    `Salesforce Analytics Cloud`桌面端界面是`Analytics Cloud Explorer`，它允许用户创建和使用数据发现应用程序及仪表板。它可以通过网页浏览器访问，提供了移动端界面具备的所有功能，以及在组织和开发能力方面的额外特性。`Analytics
    Cloud Explorer`拥有与移动应用相同的功能，此外还能从`Salesforce`对象创建数据集。创建数据集后，可以对其进行探索，允许用户深入挖掘和过滤数据。在探索数据的过程中，用户可以创建透镜，这些透镜也可以在移动应用上使用。


    `Analytics Cloud Explorer`的额外功能包括使用带有图形和表格元素的编辑器，以及用于创建文本框、其他图形元素和超链接的小部件从透镜创建仪表板。在仪表板内部，当用户对其中一个组件的数据集进行深入挖掘时，仪表板中的所有其他组件都会随之更新。换句话说，如果用户精炼了任何数据，仪表板中的所有其他组件都会更改以反映这种精炼。这个强大的功能允许使用仪表板内的所有控件对数据进行协调探索，并促进数据发现。


    `Analytics Cloud Explorer`中最高级别的抽象是应用（apps），它可以包含许多仪表板、透镜和数据集。应用可以被视为所有这些对象的容器，主要用作分组或打包机制。应用内部可以包含仪表板、透镜和数据集。应用的内容由用户自行决定。例如，围绕气象数据开发数据发现分析的用户，可能会在应用中包含来自`NOAA`的数据集，以及相关的仪表板和透镜，但也可以包含来自学术来源的数据集或由美国境外气象机构收集的数据。


    ## Salesforce Analytics Cloud 的优势


    如今，数据发现产品对于分析和商业智能领域来说当然并不新鲜，当`Salesforce Analytics Cloud`于 2014 年进入一个已经拥挤的市场时，这可能被视为一个劣势。然而，由于入市较晚，`Salesforce
    Analytics Cloud`反而避免了早期数据发现产品所经历的陷阱和局限性。

    '
- fmt: '### The Cloud Architecture


    The Salesforce Analytics Cloud has some unique features that set it apart from
    other data discovery products. For instance, since its introduction it has been
    100 percent cloud based. Many other data discovery products have complex and elaborate
    infrastructures oriented toward “on-premise” installations; they must be installed
    and maintained by systems administrators. Similarly, patches and upgrades to add
    new features or fix bugs require a planned outage, and they must be thoroughly
    tested before installation on older production systems. If the data discovery
    system is mission critical, then a secondary system must be installed and maintained
    to provide high availability, and this can involve complex network components
    like load balancers.


    The cloud-based Salesforce Analytics Cloud eliminates the complex on-premise infrastructure
    and with it, the added complexities of high availability. Patches and updates
    are continuously applied to the Salesforce Analytics Cloud, so you are always
    using the most up-to-date version.


    ### Mobile First


    A unique feature of the Salesforce Analytics Cloud is its mobile-first approach.
    The Salesforce Analytics Cloud was designed with mobile users in mind, using both
    smartphones and tablet computers. Mobile users can create datasets and applications
    entirely on these mobile devices. The Salesforce Analytics Cloud also makes graphics
    and data discovery available on the Apple Watch, and is currently the only data
    discovery product with this capability.


    ### Integration with the Salesforce Ecosystem


    Datasets can easily be constructed from Salesforce objects for organizations that
    use the Salesforce sales and service cloud—and these can be combined with any
    other data source. Users can share data discovery applications with other users
    in the Salesforce ecosystem, including Chatter, the Salesforce social-enterprise
    cloud. This medium allows rapid and seamless sharing of results and eliminates
    the need to take screenshots of graphics or make extracts to share results.


    Salesforce has a wide network of technology firms in its partnership ecosystem.
    This ecosystem enables those organizations that have already invested in analytics
    tools and infrastructure to enhance their investments with the Salesforce Analytics
    Cloud. Contrast this situation with other data discovery vendors who require the
    use of proprietary ETL tools for their products.


    ## Conclusion


    In this introductory chapter we have defined and described data discovery, and
    showed why it is an attractive alternative to forming data lakes for certain types
    of data. We explored the general features of data discovery and then looked at
    how the Salesforce Analytics Cloud offers expanded discovery tools. We are now
    ready to examine the Salesforce Analytics Cloud in detail in the next three chapters.
    Those chapters will then be followed by others with industry-specific use cases
    that demonstrate how the Salesforce Analytics Cloud can be applied to deliver
    analytic value efficiently and effectively.


    Here are the chapters in this book, grouped into two parts.


    **Part 1: A Complete Guide to the Salesforce Analytics Cloud**


    Part 1 comprises [Chapters 1](#A978-1-4842-1203-5_1_Chapter.html) through [4](#A978-1-4842-1203-5_4_Chapter.html).
    [Chapter 1](#A978-1-4842-1203-5_1_Chapter.html) offers a brief overview and introduction.
    [Chapter 2](#A978-1-4842-1203-5_2_Chapter.html) covers the Analytics Cloud Explorer,
    while [Chapter 3](#A978-1-4842-1203-5_3_Chapter.html) provides an in-depth tutorial
    on the Analytics Cloud Builder, and covers the creation of datasets, lenses, dashboards,
    and apps. [Chapter 4](#A978-1-4842-1203-5_4_Chapter.html) is intended for developers
    who will be using integration tools to create analytical applications in the Salesforce
    Analytics Cloud Wave platform.


    **Part 2: Business Analytics Solutions Using the Salesforce Analytics Cloud**


    Part 2 comprises [Chapters 5](#A978-1-4842-1203-5_5_Chapter.html) through [7](#A978-1-4842-1203-5_7_Chapter.html).
    [Chapter 5](#A978-1-4842-1203-5_5_Chapter.html) starts with a discussion on critical
    decision making and data discovery, then moves on to a manufacturing use case.
    [Chapter 6](#A978-1-4842-1203-5_6_Chapter.html) focuses on mobile data discovery
    and looks at a company with a mature sales operation. [Chapter 7](#A978-1-4842-1203-5_7_Chapter.html)
    covers advanced data acquisition and data processing, including concepts like
    data wrangling and cleansing and concluding with examples of using the Python
    programming language to perform data processing.


    # 2. The Salesforce Analytics Cloud Explorer


    > What I hear I forget, what I see I remember, what I do I know. —Confucius


    The ancient Chinese philosopher Confucius counsels us to be doers, that this is
    the way to acquire knowledge. If you have read this far, then you likely have
    more than just a passing interest in the Salesforce Analytics Cloud and data discovery.
    You may be considering trying the Salesforce Analytics Cloud. The good news is
    that becoming a doer with the Salesforce Analytics Cloud is not difficult. In
    fact, using the Salesforce Analytics Cloud Explorer is exactly what is covered
    in this chapter.


    ## What Is Cloud Explorer?


    The Salesforce Analytics Cloud Explorer—or as we call it, Cloud Explorer—is the
    user interface. Basically, it is the user experience for the Salesforce Analytics
    Cloud. It allows users to create data discovery applications by uploading data,
    creating graphics and dashboards, and bundling these into applications.


    Cloud Explorer has two primary server methods for users to access it. The first
    is a desktop client that runs in a web browser; the second runs via a mobile device.
    The mobile device can be an Apple iPhone or an Apple iPad. In fact, Apple iPhone
    users can even use Cloud Explorer on a limited basis on the Apple Watch. And users
    are not required to employ any of these devices exclusively; a Cloud Explorer
    user can also create items on the desktop client and view them on an iPhone or
    iPad.


    In this chapter, we examine the Cloud Explorer in detail, explaining its major
    elements and the capabilities it delivers. In the process, we use Wave with a
    simple dataset, and we show some presentations of the data with Cloud Explorer.
    This will give you the best sense of what is possible with Cloud Explorer, and
    by extension the entire Salesforce Analytics Cloud. We wrap up this chapter with
    a discussion of Cloud Explorer capabilities to help you decide if the Salesforce
    Analytics Cloud is right for your uses.'
