    为了覆盖全系列移动设备，让我们看看“第一季度增长研究”在 Apple Watch 上的显示效果。正如您所料，小屏幕提供了压缩视图，但仍然易于理解，并且界面允许深入挖掘数据以查看图表背后的实际数字。对于那些需要参加冗长会议，而在会议上使用智能手机可能不合适的人来说，Apple
    Watch 提供了一种谨慎访问数据的替代方式。图 6-22 展示了在 Apple Watch 上显示的“第一季度增长研究”。


    ![A978-1-4842-1203-5_6_Fig22_HTML.jpg](img/A978-1-4842-1203-5_6_Fig22_HTML.jpg)


    图 6-22.

    在 Apple Watch 上显示的“第一季度增长研究”


    ### 添加其他维度：评估个人贡献者


    我们可以通过添加其他度量来提高销售业绩仪表板的实用性。例如，每个区域内都有销售经理，他们的职责是维护和增长其所在区域的销售额。大多数仪表板用户希望了解“玩家”——哪些是表现最好的销售经理。通过添加一个柱状图，显示销售经理的姓名及其业绩（以他们对销售额度量的贡献表示），可以轻松地将此信息添加到我们的仪表板中。查看这个度量的柱状图，我们可以看到，在北美，Nathaniel
    Grimes 是最佳销售经理，其次是 Aki Hamanishi。如图 6-23 所示。


    ![A978-1-4842-1203-5_6_Fig23_HTML.jpg](img/A978-1-4842-1203-5_6_Fig23_HTML.jpg)


    图 6-23.

    最佳销售经理


    通过将这个柱状图添加到销售业绩仪表板，我们可以应用筛选条件，从而观察销售经理的业绩如何变化。这就是 Salesforce Analytics Cloud 的优势：它允许我们只需向仪表板添加新的度量，就能更深入地挖掘数据。当我们使用产品线和销售区域-地区的切换控件应用筛选条件时，我们可以更好地了解各个销售经理的表现。如果我们选择表现最佳的西南地区“Mountain”产品线，我们会看到这是
    Nathaniel Grimes 表现最佳的领域，如图 6-24 所示。


    ![A978-1-4842-1203-5_6_Fig24_HTML.jpg](img/A978-1-4842-1203-5_6_Fig24_HTML.jpg)


    图 6-24.

    西南地区“Mountain”产品线的最佳销售经理


    如果我们在产品线切换控件上选择“Road”产品线，我们会发现 Nathaniel Grimes 在这个领域并非主导；相反，另一位销售经理 Sayaka Ito
    是表现最佳的。如图 6-25 所示。


    ![A978-1-4842-1203-5_6_Fig25_HTML.jpg](img/A978-1-4842-1203-5_6_Fig25_HTML.jpg)


    图 6-25.

    西南地区“Road”产品线的最佳销售经理

