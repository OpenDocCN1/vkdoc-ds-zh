- fmt: '### Create Dashboard Using Mobile Designer


    Now that the dataset is created, it’s time to create the dashboard.


    You can close out the exploration screen and navigate to the “Infant Mortality”
    dataset. Press and hold the dataset for a second or two, the dashboard designer
    screen will be displayed (see Figure [3-24](#A978-1-4842-1203-5_3_Chapter.html#Fig24)
    ). Press down on the “+” sign in the middle of the screen to add widgets to your
    dashboard (see Figure [3-25](#A978-1-4842-1203-5_3_Chapter.html#Fig25) ).


    ![A978-1-4842-1203-5_3_Fig25_HTML.jpg](A978-1-4842-1203-5_3_Fig25_HTML.jpg)


    Figure 3-25.


    Select a widget type


    ![A978-1-4842-1203-5_3_Fig24_HTML.jpg](A978-1-4842-1203-5_3_Fig24_HTML.jpg)


    Figure 3-24.


    Dashboard designer


    In the widget selection screen, first select a “Toggle” field and pick the dimension
    “Year” (see Figure [3-26](#A978-1-4842-1203-5_3_Chapter.html#Fig26) ).


    ![A978-1-4842-1203-5_3_Fig26_HTML.jpg](A978-1-4842-1203-5_3_Fig26_HTML.jpg)


    Figure 3-26.


    Toggle Field for Year Dimension


    Add 3 “Single Number” widgets using the `avg`, `max`, and `min` functions of measure
    called “Infant Death” (see Figure [3-27](#A978-1-4842-1203-5_3_Chapter.html#Fig27)
    ).


    ![A978-1-4842-1203-5_3_Fig27_HTML.jpg](A978-1-4842-1203-5_3_Fig27_HTML.jpg)


    Figure 3-27.


    Single number widgets


    Continue to add a “V-bar Chart” to display Infant Mortality information grouped
    by “Community Area Name.” Save the dashboard, then view the dashboard, as shown
    in Figure [3-28](#A978-1-4842-1203-5_3_Chapter.html#Fig28) . You can also change
    the view from a bar chart to a donut display using the `view` function, as seen
    in the graph in Figure [3-29](#A978-1-4842-1203-5_3_Chapter.html#Fig29) .


    ![A978-1-4842-1203-5_3_Fig29_HTML.jpg](A978-1-4842-1203-5_3_Fig29_HTML.jpg)


    Figure 3-29.


    Explore new view with donut chart


    ![A978-1-4842-1203-5_3_Fig28_HTML.jpg](A978-1-4842-1203-5_3_Fig28_HTML.jpg)


    Figure 3-28.


    Dashboard with bar chart widget


    Creating dashboard using mobile devices with Salesforce Analytics is fast and
    simple. Our quick example above takes less than 15 minutes from data load to dashboard.
    The interface is intuitive yet powerful for business analysts to explore a dataset
    and design visualizations, all using a mobile phone. In order to save the dashboard,
    press “Save” in the upper right corner and provide a name for the dashboard.


    ## Advanced Dashboards


    In addition to drag and drop features, Salesforce Analytics Cloud provides rich
    capabilities for more advanced dashboard design and development. In this section,
    we’ll take a look at these advanced features and how to use them. We’ll first
    start by taking a look at the composition of a Salesforce Analytics dashboard.


    ### Anatomy of a Dashboard


    A Salesforce Analytics Cloud dashboard is in essence a JSON document containing
    definitions of the various components of a dashboard and how they are connected
    together. It is composed of two types of information:


    - **System Metadata**: It includes information such as `UID`, Dashboard Name,
    and Description.

    - **Dashboard State**: This is where the important information of the dashboard
    design is stored including `Steps`, `Widgets`, and `Layouts`.


    You can configure and modify different aspects of your dashboard through the JSON
    file. It is recommended, however, that you do not modify any System Metadata through
    the JSON file.


    As described in earlier sections of this chapter, the most convenient method to
    create and modify a dashboard is through the Dashboard designer either with web
    interact or your mobile device. However, to create a more advanced dashboard with
    capabilities such as data join or selection binding, it might be necessary to
    modify the dashboard definition JSON file.


    #### Dashboard State


    The Dashboard State section of dashboard JSON file is under the tag name `state`.
    It contains sub-sections including `Steps`, `Widgets`, and `Layouts`, as we mentioned
    earlier. The `Steps` portion is composed of all the queries clipped from the lenses
    through the Dashboard Explorer. Each of these `Steps` links to a `Widget` or binds
    it to another `Step` through the `name` field. The `Widget` section is where all
    the widgets within the dashboard are defined. The `Layout` section contains definitions
    of the page and column layout.


    #### Widgets


    The dynamic widget types typically represent each of the query steps. The different
    widget types include `Chart`, `Raw Data Table`, `Compare table`, `Number`, `Range`,
    `List`, `Date`, `Toggle`, and `Global filter`.


    There are also a number of Static widgets such as `Text`, `Box`, `YouTube`, and
    `Link`, which can be configured by the dashboard author. Parameters including
    `size`, `position`, and `name` can be set as part of the widget properties in
    the right panel of the Designer/Builder screen.


    #### Steps


    `Steps` contains queries, which have either been clipped from the Explorer, or
    hand coded `SAQL`, or through static steps. Selections on steps can be faceted
    or bound to other steps within the dashboard. We’ll cover a selection-binding
    example in the next section of this chapter. Select mode, start values, is faceted
    and use global filters can be set as part of step properties.


    #### Layout Canvas


    Current implementation of layout canvas in dashboards is fixed in size with absolute
    positioning on a single page. Future enhancements will include responsive grid,
    mobile layouts, and templates.


    #### Use of JSON File


    Here are the some examples of when you’ll be updating the JSON files:


    - Specify a `SAQL` query, and specify relationships between the query and other
    steps

    - Populate a selector with a specified list of values instead of from a query

    - Use manual bindings to override the default faceting and manually specify the
    relationships between the steps

    - Set query limits

    - Specify columns for a values table


    For more information about the JSON file, please refer to the “Analytics Cloud
    Dashboard JSON Reference Guide.”


    ### Advanced Dashboard with SAQL


    A `SAQL` script consists of a sequence of statements that are made up of keywords
    (such as `filter`, `group`, and `order`), identifiers, literals, or special characters.
    Statements can span multiple lines and must end with a semicolon. `SAQL` is declarative,
    which means that you describe what you want to get from your query. Then, the
    query engine will decide how to efficiently serve it. `SAQL` is compositional.
    Every statement has a result, and you can chain statements together. `SAQL` is
    influenced by the Pig Latin programming language, however, their implementations
    differ.


    In the next section, we’ll show you an example of advanced dashboard development
    using JSON and `SAQL`.'
