  trans: '

    ### 使用移动设计器创建仪表板


    数据集创建完成后，接下来就是创建仪表板了。


    您可以关闭探索界面，导航至“婴儿死亡率”数据集。长按该数据集一两秒，仪表板设计器界面将会显示（见图 3-24）。按下屏幕中央的“+”号，即可向仪表板添加组件（见图
    3-25）。


    ![A978-1-4842-1203-5_3_Fig25_HTML.jpg](img/A978-1-4842-1203-5_3_Fig25_HTML.jpg)


    图 3-25


    选择组件类型


    ![A978-1-4842-1203-5_3_Fig24_HTML.jpg](img/A978-1-4842-1203-5_3_Fig24_HTML.jpg)


    图 3-24


    仪表板设计器


    在组件选择界面，首先选择“切换”字段，并选取维度“年份”（见图 3-26）。


    ![A978-1-4842-1203-5_3_Fig26_HTML.jpg](img/A978-1-4842-1203-5_3_Fig26_HTML.jpg)


    图 3-26


    年份维度的切换字段


    使用名为“婴儿死亡”的度量指标的 `avg`、`max` 和 `min` 函数，添加 3 个“单数值”组件（见图 3-27）。


    ![A978-1-4842-1203-5_3_Fig27_HTML.jpg](img/A978-1-4842-1203-5_3_Fig27_HTML.jpg)


    图 3-27


    单数值组件


    继续添加一个“V 形柱状图”，以显示按“社区区域名称”分组的婴儿死亡率信息。保存仪表板，然后查看仪表板，如图 3-28 所示。您也可以使用 `view` 功能将视图从柱状图更改为环形图显示，如图
    3-29 中的图表所示。


    ![A978-1-4842-1203-5_3_Fig29_HTML.jpg](img/A978-1-4842-1203-5_3_Fig29_HTML.jpg)


    图 3-29


    使用环形图探索新视图


    ![A978-1-4842-1203-5_3_Fig28_HTML.jpg](img/A978-1-4842-1203-5_3_Fig28_HTML.jpg)


    图 3-28


    带有柱状图组件的仪表板


    使用配有 Salesforce Analytics 的移动设备创建仪表板既快速又简单。我们上面的快速示例从加载数据到生成仪表板只需不到 15 分钟。该界面直观且功能强大，业务分析师可以完全通过手机探索数据集并设计可视化。如需保存仪表板，请按右上角的“保存”按钮，并为仪表板命名。


    ## 高级仪表板


    除了拖放功能外，Salesforce Analytics Cloud 还提供了丰富的功能，用于更高级的仪表板设计和开发。在本节中，我们将探讨这些高级功能及其使用方法。首先，我们来分析一下
    Salesforce Analytics 仪表板的组成。


    ### 仪表板的解剖结构


    Salesforce Analytics Cloud 仪表板本质上是一个 JSON 文档，其中包含仪表板各个组件的定义以及它们之间的连接方式。它由两类信息组成：


    - **系统元数据**：包括诸如 `UID`、仪表板名称和描述等信息。

    - **仪表板状态**：这是存储仪表板设计重要信息的地方，包括`步骤`、`组件`和`布局`。


    您可以通 JSON 文件配置和修改仪表板的不同方面。但是，**不建议**您通过 JSON 文件修改任何系统元数据。


    如本章前面部分所述，创建和修改仪表板最便捷的方法是通过 Web 交互或在移动设备上使用仪表板设计器。但是，如需创建具有数据联接或选择绑定等功能的更高级仪表板，则可能需要修改仪表板定义的
    JSON 文件。


    #### 仪表板状态


    位于仪表板 JSON 文件中标签名 `state` 下的部分即为仪表板状态。它包含我们之前提到的子部分，包括`步骤`、`组件`和`布局`。`步骤`部分包含了通过仪表板资源管理器从透镜中剪裁出的所有查询。每个`步骤`通过
    `name` 字段链接到一个`组件`或绑定到另一个`步骤`。`组件`部分定义了仪表板内的所有组件。`布局`部分包含了页面和列布局的定义。


    #### 组件


    动态组件类型通常代表每个查询步骤。不同的组件类型包括`图表`、`原始数据表`、`比较表`、`数字`、`范围`、`列表`、`日期`、`切换`和`全局筛选器`。


    还有一些静态组件，如`文本`、`方框`、`YouTube` 和`链接`，这些可由仪表板作者配置。诸如 `size`、`position` 和 `name`
    等参数可以在设计器/生成器界面右侧面板的组件属性中设置。


    #### 步骤


    `步骤`包含查询，这些查询可以是来自资源管理器的剪裁，也可以是手动编写的 `SAQL`，或者是通过静态步骤生成的。步骤上的选择可以分面化，也可以绑定到仪表板内的其他步骤。我们将在本章下一节介绍一个选择绑定的示例。选择模式、起始值、是否分面化以及使用全局筛选器都可以作为步骤属性的一部分进行设置。


    #### 布局画布


    当前仪表板中布局画布的实现是固定大小的，在一个页面上使用绝对定位。未来的增强功能将包括响应式网格、移动设备布局和模板。


    #### JSON 文件的使用


    以下是您可能需要更新 JSON 文件的一些场景示例：


    - 指定一个 `SAQL` 查询，并指定该查询与其他步骤之间的关系

    - 使用指定的值列表填充选择器，而不是从查询中获取

    - 使用手动绑定覆盖默认的分面，手动指定步骤之间的关系

    - 设置查询限制

    - 为值表指定列


    有关 JSON 文件的更多信息，请参考“Analytics Cloud 仪表板 JSON 参考指南”。


    ### 使用 SAQL 的高级仪表板


    `SAQL` 脚本由一系列语句组成，这些语句由关键字（如 `filter`、`group` 和 `order`）、标识符、字面量或特殊字符构成。语句可以跨越多行，并且必须以分号结尾。`SAQL`
    是声明式的，这意味着您描述您想要从查询中获得什么。然后，查询引擎将决定如何高效地提供这些信息。`SAQL` 是可组合的。每个语句都有一个结果，您可以将语句链接在一起。`SAQL`
    受到了 Pig Latin 编程语言的影响，但是它们的实现有所不同。


    在下一节中，我们将向您展示一个使用 JSON 和 `SAQL` 进行高级仪表板开发的示例。

    '
- fmt: "### Creating Dashboard in Designer\n\nThe dataset we are using for this example\
    \ is called “Consumer Spending”, which you can download from [`www.apress.com/9781484212042`](http://www.apress.com/9781484212042)\
    \ if you’d like to follow along. We’ll first create a dashboard using the lens\
    \ explorer and designer clipping. We then create the following three lenses: `Age`,\
    \ `Category`, and `Sum of Value` grouped by `Item`, sorted descending on `Sum\
    \ of Value`. We clip them to the designer and add them to 2 list widgets and 1\
    \ chart widget. Figure [3-30](#A978-1-4842-1203-5_3_Chapter.html#Fig30) depicts\
    \ the design view of the dashboard. Be sure to save the dashboard so you do not\
    \ lose your work.\n\n![A978-1-4842-1203-5_3_Fig30_HTML.jpg](A978-1-4842-1203-5_3_Fig30_HTML.jpg)\n\
    \n**Figure 3-30.** Consumer spending dashboard design view\n\nOur objective is\
    \ to only display the top 5 categories based on the age selection. In order to\
    \ accomplish that, we’ll follow these steps to modify the JSON definition of the\
    \ dashboard.\n\n1.  **Obtain SAQL Statement**: Create a lens with the “Consumer\
    \ Spending” dataset. Define a measure with “Sum” of “Value” grouped by “Category”\
    \ and sort with descending order. Create a filter using the “Age” dimension and\
    \ select 2 random age groups. Click on the “List” icon and select “</> Edit SAQL\
    \ Query”. Note that Salesforce is currently revising the methodology for editing\
    \ SAQL queries. If you have difficulty in editing the SAQL queries, you should\
    \ contact Wave support for assistance (see Figure [3-31](#A978-1-4842-1203-5_3_Chapter.html#Fig31)).\n\
    \n    ![A978-1-4842-1203-5_3_Fig31_HTML.jpg](A978-1-4842-1203-5_3_Fig31_HTML.jpg)\n\
    \n    **Figure 3-31.** SAQL statement window\n\n2.  Copy and paste the SAQL statement\
    \ into a text file. Remove the newline characters (or line breaks) and make the\
    \ statement into one line as follows:\n    ```\n    q = load \"0Fb1a000000PB6QCAW/0Fc1a000000PBrfCAG\"\
    ;q = filter q by 'Age' == \"0 to 25\";q = group q by 'Category';q = foreach q\
    \ generate 'Category' as 'Category', sum('Value') as 'sum_Value', count() as 'count';q\
    \ = order q by 'sum_Value' desc;q = limit q 2000;\n    ```\n    Save the text\
    \ file for later use.\n\n3.  Navigate to the lens configuration page by replacing\
    \ in the URL “explore” with “lens” as follows:\n    `https://[domain].salesforce.com/analytics/wave/web/explore.apexp`\
    \ ➤ `https://[domain].salesforce.com/analytics/wave/web/lens.apexp`\n\n4.  Select\
    \ the dashboard lens and your dashboard JSON file will show up on the text box\
    \ on the right (see Figure [3-32](#A978-1-4842-1203-5_3_Chapter.html#Fig32)).\n\
    \n    ![A978-1-4842-1203-5_3_Fig32_HTML.jpg](A978-1-4842-1203-5_3_Fig32_HTML.jpg)\n\
    \n    **Figure 3-32.** Configuration window\n\n5.  Select the JSON text. Copy\
    \ and paste it into a JSON editor of your choice. We’ll be using Sublime Text.\
    \ Within the “state” section of the JSON file, locate “steps.” Find the step called\
    \ “Catogory_1” and the “query” section underneath it. Add the following line (the\
    \ pigql text came from the SAQL statement we copied and pasted into the text file\
    \ in step 2).\n    ```\n    \"pigql\":\"q = load \\\"0Fb1a000000PB6QCAW/0Fc1a000000PBrfCAG\\\
    \";q = filter q by 'Age' == \\\"0 to 25\\\";q = group q by 'Category';q = foreach\
    \ q generate 'Category' as 'Category', sum('Value') as 'sum_Value', count() as\
    \ 'count';q = order q by 'sum_Value' desc;q = limit q 2000;\",\n    ```\n\n6.\
    \  Copy and paste the entire JSON file into the lens textbox in the Analytics\
    \ Cloud screen and click on “Update Lens.” Go back to the Analytics home page\
    \ and refresh the dashboard to ensure the pigql statement is working properly.\n\
    \n7.  Go back to the JSON file and update the following:\n    - Change `'Age'\
    \ == \"0 to 25\"` to `'Age' in {{selection(Age_2)}}`. This is called selecting\
    \ binding. It basically tells the pigql to use the selection result of the “Age_2”\
    \ step as the filter for Age in the category selection.\n    - Change `limit q\
    \ 2000` to `limit q 5`. This is to limit number of result to the top 5 categories\
    \ of highest amount of consumer spending based on the age group selection.\n\n\
    8.  Replace with the new JSON file and click on “Update Lens.”\n\n9.  Refresh\
    \ the dashboard and you should be able to see the age group selection will update\
    \ the category list widget as shown in Figure [3-33](#A978-1-4842-1203-5_3_Chapter.html#Fig33).\n\
    \n    ![A978-1-4842-1203-5_3_Fig33_HTML.jpg](A978-1-4842-1203-5_3_Fig33_HTML.jpg)\n\
    \n    **Figure 3-33.** Dynamic selection binding\n\n### Summary\n\nWhile data\
    \ is important, without analysis, it is of little value. It’s common in this new\
    \ data era to feel astounded by the explosive amounts of data being collected\
    \ and shared. Understanding key business drivers and pain points helps business\
    \ analysts to evaluate what insights are needed. Albert Einstein was on to something\
    \ when he said we can’t always track what we want to count, but that doesn’t stop\
    \ us from constantly exploring new ways to get the data we need.\n\nThe success\
