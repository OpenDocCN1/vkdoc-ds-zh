    第一季度，销售区域-地区，折线图


    对于另外两个柱状图，我们也看到了有趣的趋势。图 6-19 显示了产品线的堆叠柱状图。


    ![A978-1-4842-1203-5_6_Fig19_HTML.jpg](img/A978-1-4842-1203-5_6_Fig19_HTML.jpg)


    图 6-19.

    第一季度，产品线，堆叠柱状图


    在图 6-19 中，我们看到山地车产品线的销售额下降，公路车产品线在 2014 年出现激增，但在 2015 年又遭遇下滑。2015 年推出的旅行车产品线帮助维持了销售额，弥补了山地车和公路车销售额的下滑。


    最后一个堆叠柱状图是针对产品类别的，如图 6-20 所示。公司在所有领域都实现了增长，其中自行车和零部件的增长最为显著。


    ![A978-1-4842-1203-5_6_Fig20_HTML.jpg](img/A978-1-4842-1203-5_6_Fig20_HTML.jpg)


    图 6-20.

    第一季度，产品线，堆叠柱状图


    图 6-16 中显示的四个柱状图是在 iPad 上几分钟内完成的，它们立即揭示了第一季度销售额背后的增长趋势洞察。通过检查所有图表，我们能够得出结论：美国西南部是表现最强的地区，而
    2015 年旅行车产品线的推出，抵消了 2014 年曾激增的公路车产品线的下滑。


    鉴于本章的主题是移动使用，让我们看看“第一季度增长研究”在 iPhone 5S 上的显示效果，如图 6-21 所示。


    ![A978-1-4842-1203-5_6_Fig21_HTML.jpg](img/A978-1-4842-1203-5_6_Fig21_HTML.jpg)


    图 6-21.

    在 iPhone 5S 上显示的“第一季度增长研究”


