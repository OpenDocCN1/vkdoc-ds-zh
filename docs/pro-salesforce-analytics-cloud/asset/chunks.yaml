    # 加载数据集


    我们使用的数据集是一个来自美国联邦航空局（FAA）公共数据库的 `.csv` 文件，记录了鸟击统计数据。它包含了每一起记录的鸟击事件信息，包括事故机场、海拔高度、飞机制造商和型号、位置、飞行日期和时间、损坏情况、航空公司、始发州、飞行阶段、天气条件、野生动物体型以及物种等。


    图 3-1 是原始数据集在 Microsoft Excel 中的屏幕截图。请注意，并非所有数据列都已显示。


    ![A978-1-4842-1203-5_3_Fig1_HTML.jpg](img/A978-1-4842-1203-5_3_Fig1_HTML.jpg)


    图 3-1. 原始鸟击数据集


    我们使用 Analytics Cloud 的数据加载器用户界面（UI）将数据集上传到系统。步骤如下：


    从 Analytics Explorer 主页点击屏幕右上角的“创建”（Create）按钮。按“应用”（App），创建一个名为“图书应用”（Book Apps）的应用。然后再次点击“创建”按钮并选择“数据集”（Dataset）（参见图
    3-2）。


    ![A978-1-4842-1203-5_3_Fig2_HTML.jpg](img/A978-1-4842-1203-5_3_Fig2_HTML.jpg)


    图 3-2. 创建应用和数据集


    点击“选择数据源”（Select a Data Source）菜单下的“CSV”按钮（参见图 3-3）。


    ![A978-1-4842-1203-5_3_Fig3_HTML.jpg](img/A978-1-4842-1203-5_3_Fig3_HTML.jpg)


    图 3-3. 选择数据源


    在“数据集名称”（Dataset Name）文本框中输入“鸟击”（Bird Strike）。从下拉列表中选择希望数据集所在的应用名称。在本例中，我们已经创建了一个名为“图书应用”的应用。回顾一下，我们在第
    2 章中介绍了如何使用“创建”按钮来创建应用。点击“选择文件或将文件拖拽至此”（Select file or drag files here）并导航到数据集位置。系统将自动生成一个
    JSON 格式的元数据文件，您可以下载并根据需要修改。或者，您也可以上传自己的元数据文件作为数据集定义（参见图 3-4）。


    ![A978-1-4842-1203-5_3_Fig4_HTML.jpg](img/A978-1-4842-1203-5_3_Fig4_HTML.jpg)


    图 3-4. 输入数据集元数据


    点击“创建数据集”（Create Dataset）按钮，您的数据集将被上传到 Analytics Cloud。数据集通常会立即创建，但通常会有一条消息显示“您的数据集将在
    1 小时内创建完成”。


    一旦系统完成数据加载过程，您的数据集将出现在 Analytics Cloud Explorer 中供使用。您可以通过创建数据集时所在的应用包装器，或者点击顶部的“数据集”（DATASETS）选项卡来导航到数据集。点击“鸟击”数据集以查看新数据集（参见图
    3-5）。


    ![A978-1-4842-1203-5_3_Fig5_HTML.jpg](img/A978-1-4842-1203-5_3_Fig5_HTML.jpg)


    图 3-5. 选择“鸟击”数据集进行查看


    # 创建仪表盘


    现在数据集已上传，是时候通过创建我们的仪表盘来探索数据了。第一步是创建将构成我们仪表盘的透镜。以下是关于如何创建透镜以及如何将其包含在仪表盘设计器中的分步说明。


    我们首先点击本章上一节中创建的数据集“鸟击”。我们点击“+分组”（+Group）按钮，并从维度列表中选择“天气状况：天空”（Conditions: Sky）（参见图
    3-6）。


    ![A978-1-4842-1203-5_3_Fig6_HTML.jpg](img/A978-1-4842-1203-5_3_Fig6_HTML.jpg)


    图 3-6. 按条件创建分组：天空


    图 3-7 中的图表将根据“天气状况：天空”维度中的唯一值数量显示。


    ![A978-1-4842-1203-5_3_Fig7_HTML.jpg](img/A978-1-4842-1203-5_3_Fig7_HTML.jpg)


    图 3-7. 按天空条件分组的透镜


    点击屏幕右上角的相机按钮 ![A978-1-4842-1203-5_3_Figa_HTML.jpg](img/A978-1-4842-1203-5_3_Figa_HTML.jpg)。您刚刚创建的透镜将被“剪裁”到仪表盘设计器中。


    在仪表盘设计器屏幕（图 3-8）中，您会在左侧面板看到您剪裁的透镜。点击顶部小部件栏上的“切换”（Toggle）小部件类型，然后点击左侧的透镜，将 `Conditions_Sky_1`
    透镜添加到切换小部件中。


    ![A978-1-4842-1203-5_3_Fig8_HTML.jpg](img/A978-1-4842-1203-5_3_Fig8_HTML.jpg)


    图 3-8. 天空状况切换小部件


    返回透镜选项卡（图 3-9），点击“天气状况：天空”分组并将其替换为“时间：一天中的时段”（When: Time of Day）维度。通过移除“天气状况：天空”分组来完成此操作。将鼠标悬停在分组上，点击分组右上角的“x”。然后点击“+分组”按钮并添加“时间：一天中的时段”。


    ![A978-1-4842-1203-5_3_Fig9_HTML.jpg](img/A978-1-4842-1203-5_3_Fig9_HTML.jpg)


    图 3-9. 按一天中的时段分组的透镜


    重复步骤 3 和 4，将新透镜 `When_Time_of_Day_2` 剪裁到设计器中。将其添加到一个新的切换小部件中，该小部件位于第一个切换按钮的右侧。请注意，新剪裁的透镜始终位于仪表盘设计器左侧显示的透镜堆栈顶部。


    返回透镜选项卡，点击分组按钮并将其替换为“野生动物：体型”（Wildlife: Size）。将可视化类型更改为环形图（参见图 3-10）。


    ![A978-1-4842-1203-5_3_Fig10_HTML.jpg](img/A978-1-4842-1203-5_3_Fig10_HTML.jpg)


    图 3-10. 野生动物体型的透镜图表


    重复步骤 3 和 4，将透镜剪裁到仪表盘设计器中。这次选择一个“图表”（Chart）小部件类型，并将其放置在“天气状况：天空”切换按钮下方。


    重复步骤 7 和 8，创建另一个环形图以显示“野生动物：物种”（Wildlife: Species）细分。定义过滤器以排除“未知”（unknown）类型的动物物种。要创建排除过滤器，请点击过滤器“野生动物：物种”，然后滚动到列表底部。您会在列表底部看到“更多”（more）。点击更多以列出更多物种。再次滚动到列表底部，然后点击更多。重复滚动并点击更多，直到到达列表末尾。在过滤器顶部，有一个用于选择“全部”（All）项目的控件。点击它，以选择所有物种。滚动到物种并取消选择所有以“unknown”开头的项目。如图
    3-11 所示。


    ![A978-1-4842-1203-5_3_Fig11_HTML.jpg](img/A978-1-4842-1203-5_3_Fig11_HTML.jpg)


    图 3-11. 过滤未知物种


    定义另一个过滤器，以包含发生次数超过 100 次的物种。按下过滤器按钮，选择行数（count of rows），以及“大于或等于”（Greater Than
    Or Equal To）。然后输入 100，并点击“添加”（Add）。（参见图 3-12）。


    ![A978-1-4842-1203-5_3_Fig12_HTML.jpg](img/A978-1-4842-1203-5_3_Fig12_HTML.jpg)


    图 3-12。

