  trans: '

    ### 计算机技术实现的自动化控制


    20 世纪 80 年代，计算机技术开始在多个不同领域对制造流程控制产生影响。这些技术使得制造流程的控制更加精确。仪器仪表与基本控制装置（如电磁阀，一种磁性开关）或更复杂的控制装置（如可变流量控制阀）相结合，利用基于微处理器的小型控制器实现了“闭环控制”。这里的“回路”指的是由控制器的输入和输出形成的环路，以控制器为一端，工艺设备为另一端构成一个循环。这些控制器实现了对制造流程前所未有的控制。


    20 世纪 80 年代，可编程控制器问世，为制造流程控制提供了一个灵活、易编程的平台。这些可编程控制器最初旨在提供一种基于计算机的方法，来复制工程师和电工用于执行离散控制的逻辑图，其中制造流程中仅有数字输入和输出。后来的可编程控制器版本复制了回路控制器的功能，但也能控制具有数百个输入和输出的系统。


    ### 数据网络实现更高集成度


    20 世纪 90 年代，出现了用于仪器仪表的网络，作为配置和监控这些仪器的一种方式。这些仪器网络还简化了仪表的接线，只需在生产线上所有仪表之间铺设一根数据通信电缆。仪表不仅能指示物理属性，还能报告其“健康状况”，并允许更改设备的运行参数。例如，光电传感器通常需要调整，以确保当物体经过其前方时能正确感应。而现在，可以通过仪器数据网络对该光电传感器进行调整。


    电动机是制造过程中最关键的元素之一，电机控制器通常被称为“驱动器”。（我们将在本章后面讨论驱动器。）设备网络也用于这些驱动器，允许通过网络进行配置，并提供完整的运行数据，包括转速、电流以及电机是否及何时会发生故障。


    20 多年来，来自仪器仪表和可编程控制器的数据一直被收集并存储在数据库中，利用称为监控与数据采集（SCADA）系统和制造执行系统（MES）的监控系统来实现。图
    5-2 展示了 SCADA 和 MES 系统如何与刚刚讨论的控制器和仪器仪表联网。


    ![A978-1-4842-1203-5_5_Fig2_HTML.jpg](img/A978-1-4842-1203-5_5_Fig2_HTML.jpg)


    图 5-2. SCADA 和 MES 网络


    SCADA 系统获取并存储仪器仪表和控制器数据，以便日后审查，从而确定任何问题的根本原因或故障发生的时间。SCADA 和 MES 系统都获取数据，使其能够显示制造流程的性能、跟踪产品批次以及记录原材料消耗情况。


    ## 公司结构与设施


    让我们来考察一些制造公司以及这些公司中常见的设施类型。参与制造的组织通常拥有许多包含主要制造流程的设施。例如，我们案例中的玻璃公司拥有三种类型的设施：浮法玻璃厂、玻璃加工厂和汽车包边厂。让我们逐一考察这些设施。


    ### 浮法玻璃厂


    浮法玻璃厂是从原材料制造玻璃的设施。这些工厂将硅砂和纯碱在大型熔炉中熔化，生产出巨大的连续玻璃带，然后切割成矩形片材。之后将其运往其他设施，用于制造汽车车窗以及住宅和建筑用的玻璃窗。这些浮法玻璃厂通常拥有一两条长达数百码的熔炉生产线。浮法玻璃厂因其生产玻璃的制造工艺而得名。在该工艺中，熔融玻璃从熔炉中流出，进入熔融锡槽冷却，从而确保玻璃两面清澈平坦。


    浮法玻璃厂比加工厂大很多倍，并且消耗大量用于熔化原材料的天然气。工厂必须每天 24 小时连续运行，以维持工艺的稳定性。当生产线上发生设备故障时，玻璃生产继续进行，玻璃被压碎并重新送入熔炉，直到维修完成。这里的正常运行时间指标是生产线生产出可用玻璃的时间百分比。设备停机时间会降低这个百分比，但其他事件，例如产品换型，也会降低它。也就是说，有时需要改变所生产玻璃的厚度或色调。进行这些生产变更可能会使生产线不稳定数小时甚至数天，导致停机以及产生过于易碎而无法切割的回收玻璃。因此，限制换型次数可以最大化工厂的正常运行时间。


    ### 玻璃加工厂


    在我们示例制造商的一些玻璃加工厂中，通过将玻璃板切割成特定形状、磨平边缘并将玻璃弯曲以匹配目标汽车车型的轮廓来制造汽车车窗。其运营重点与浮法玻璃厂截然不同。不是单一的大型工序，而是有许多小型生产线，每条生产线通常执行单一任务。其中一条生产线上发生设备故障不仅会影响该生产线的正常运行时间，还会影响整个工厂的产量。


    加工厂必须关注产品质量，因为用于汽车的玻璃必须没有缺陷。在浮法玻璃厂中，质量问题是显而易见的——通常是气泡或可见缺陷，很容易通过激光检测发现；有缺陷的片材会立即报废。然而，在加工厂中，质量问题可能更难发现。通常只有在汽车玻璃片生产完成后才能发现。如果有缺陷的汽车玻璃片到达客户手中，工厂将面临退单以及可能的质量声誉损失，最终导致失去该客户。


    ### 汽车包边厂


    我们示例制造商的第三种设施类型操作简单：将汽车玻璃用聚合物包边，以增加强度并便于在汽车装配线上安装。本章不涉及此类设施。'
- fmt: '### The Organization of the Company’s Plants


    Figure [5-3](#A978-1-4842-1203-5_5_Chapter.html#Fig3) shows the organizational
    structure of our use case glass company.


    ![A978-1-4842-1203-5_5_Fig3_HTML.jpg](A978-1-4842-1203-5_5_Fig3_HTML.jpg)


    Figure 5-3. Organizational structure of the glass company


    As Figure [5-3](#A978-1-4842-1203-5_5_Chapter.html#Fig3) shows, there are seven
    float glass plants, producing glass for automotive and architectural uses. Automative
    glass is tinted for use in automobiles, and some glass has properties that block
    ultraviolet light to protect automotive interiors. This glass is tinted for use
    in automobiles, and some glass has properties that block ultraviolet light to
    protect automotive interiors. There are also four glass fabrication plants and
    two automotive encapsulation plants.


    In the sections that follow, we examine the data from these facilities and use
    the Salesforce Analytics Cloud to create dashboards that provide useful data visualizations.
    Recall from [Chapter 1](#A978-1-4842-1203-5_1_Chapter.html) that there are two
    basic types of analytics enabled by the Salesforce Analytics Cloud: descriptive
    analytics (answering the question “What happened?”) and diagnostic analytics (answering
    the question “Why did it happen?”). Let’s look at some real data and learn how
    the descriptive and prescriptive analytics can be performed.


    ## Key Performance Indicators


    In our use case, there is a leadership team focused on management of all manufacturing
    facilities. This team consists of the plant management at each facility and the
    managers at the company’s headquarters. The team focuses on operations and planning,
    and it monitors the facilities on a daily basis, making critical decisions to
    maximize performance and profitability, and then communicating the results. The
    monitoring is based on data that is categorized as key performance indicators
    (KPIs), among which are throughput, yield, and uptime.


    - **Throughput:** The throughput KPI is the number of parts or amount of material
    that passes through a production line. Production lines often have bottlenecks,
    and making improvements to avoid these bottlenecks can be profitable if the cost
    of instituting them is low enough. If the equipment on a production line experiences
    frequent downtime, the result is decreased throughput, obviously. For any production
    line, the capability with regard to throughput is well understood, based on design
    and operational history.

    - **Yield:** The yield KPI is the percentage of usable product made. A yield of
    100 percent on most production lines is impossible; manufacturing processes always
    produce some scrap product. At the end of a production line is the quality inspection,
    done by machines or humans. For example, a production line producing automotive
    windows will end with inspection for visual problems, especially scratches. Any
    window with a scratch must be discarded, thereby decreasing the yield of that
    production line. To calculate the yield, we perform the following computation:
    `Yield % = number of quality parts produced / throughput`. The percentage of product
    that is discarded due to quality problems is sometimes referred to as the scrap
    rate.

    - **Uptime:** Ideally, the equipment on a production line never stops operating,
    but of course this is not possible. Invariably, equipment does fail and must be
    repaired. Manufacturing facilities have maintenance personnel charged with repairing
    equipment that has failed, as well as performing preventative maintenance on equipment
    to lessen the probability of failure.


    Now, let’s a look at a dashboard created in the Salesforce Analytics Cloud to
    report these throughput, yield, and uptime parameters.


    ## Facility-Level Reporting


    Plant 35, shown in Figure [5-3](#A978-1-4842-1203-5_5_Chapter.html#Fig3), is a
    glass fabrication facility that uses the glass from the float glass plants to
    produce windows for automobiles. The plant operates continuously, and a production
    management team is responsible for monitoring performance. There are three shifts
    in a 24-hour period, with the first shift starting at 8:00 am, second at 4:00
    pm, and third at 12:00 midnight.


    There are four production lines running. A shift foreman who is part of the production
    management team is the frontline manager who makes critical, minute-to-minute
    decisions that ensure all four lines are running optimally. The SCADA system performs
    extensive data acquisition on the programmable controllers that operate the four
    production lines. With this information, SCADA is able to report the yield, throughput,
    and uptime for each line. On any day, the production management team uses a dashboard
    in the Salesforce Analytics Cloud to see what happened during the previous three
    shifts. A screenshot from the dashboard is shown in Figure [5-4](#A978-1-4842-1203-5_5_Chapter.html#Fig4).


    ![A978-1-4842-1203-5_5_Fig4_HTML.jpg](A978-1-4842-1203-5_5_Fig4_HTML.jpg)


    Figure 5-4. Daily Production Report for Plant 35


    Figures [5-5](#A978-1-4842-1203-5_5_Chapter.html#Fig5) and [5-6](#A978-1-4842-1203-5_5_Chapter.html#Fig6)
    show more readable views of the left and right sides, respectively of the Figure
    [5-4](#A978-1-4842-1203-5_5_Chapter.html#Fig4) dashboard.


    ![A978-1-4842-1203-5_5_Fig6_HTML.jpg](A978-1-4842-1203-5_5_Fig6_HTML.jpg)


    Figure 5-6. Right side of Daily Production Report for Plant 35


    ![A978-1-4842-1203-5_5_Fig5_HTML.jpg](A978-1-4842-1203-5_5_Fig5_HTML.jpg)


    Figure 5-5. Left side of Daily Production Report for Plant 35


    At this plant, lines 1 and 3 are identical, as are lines 2 and 4. Therefore, the
    production reporting for lines 1 and 3 should be close to identical if both lines
    are running at optimum. The dashboard shows “standard” numbers for the yield,
    throughput, and uptime KPIs; these are minimum performance numbers that the production
    lines should be able to achieve every day. However, Figure [5-6](#A978-1-4842-1203-5_5_Chapter.html#Fig6)
    shows that line 1 had difficulties during first and second shifts.


    The dashboard has toggle widgets so the user can select the production line for
    closer viewing. Since line 1 had the problems, we press the line 1 toggle widget;
    the result is shown in Figure [5-7](#A978-1-4842-1203-5_5_Chapter.html#Fig7).


    ![A978-1-4842-1203-5_5_Fig7_HTML.jpg](A978-1-4842-1203-5_5_Fig7_HTML.jpg)


    Figure 5-7. Line 1 view, selected using toggle widget'
