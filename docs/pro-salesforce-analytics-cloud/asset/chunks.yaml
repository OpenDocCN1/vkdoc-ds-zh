  raw: '## The Use Case Architecture


    While it is possible to integrate nearly any data source with the Salesforce Analytics
    Cloud using extract-transform-load (ETL) tools, a key feature of the Salesforce
    Analytics Cloud is its ability to get productive immediately, without complex
    and costly integration. In our example, the Ottawa County Bike Company IT department
    schedules an extract process from its data warehouse into a company Dropbox folder.
    The extract process writes a .csv (comma separated value) file to a Dropbox folder.
    Users with the Dropbox application on their mobile device can then access this
    .csv file and create their own applications.


    Note


    Dropbox is a popular cloud-based file system that can be accessed from Macs, PCs,
    and mobile devices. There are even drivers for the major Linux distributions.
    Dropbox is one of several products in this class, including Google Drive and Microsoft
    OneDrive. Any of these applications is capable of serving files to the Salesforce
    Analytics Cloud.


    The workflow for users at Ottawa County Bike Company to create their own applications
    is shown in Figure [6-2](#A978-1-4842-1203-5_6_Chapter.html#Fig2).


    ![A978-1-4842-1203-5_6_Fig2_HTML.jpg](A978-1-4842-1203-5_6_Fig2_HTML.jpg)


    Figure 6-2.


    Workflow for loading the use case data


    Let’s take a closer look at each of these steps.


    ### Step 1 – Output to .CSV File


    This is the only step that is the domain of the IT department. Most IT departments
    typically maintain scheduling systems that run batch processes after hours. Scheduling
    systems provide the capability of running programs or processes associated with
    enterprise software in a set order, at a specific time. Scheduling systems also
    have the capability of running custom-developed processes. These can be processes
    developed on any platform, including extract-transform-load (ETL) software packages,
    or in a programming language like COBOL, Microsoft Visual Basic, Java, or Python.
    Figure [6-3](#A978-1-4842-1203-5_6_Chapter.html#Fig3) illustrates step one in
    this process.


    ![A978-1-4842-1203-5_6_Fig3_HTML.jpg](A978-1-4842-1203-5_6_Fig3_HTML.jpg)


    Figure 6-3.


    Batch processing steps to produce extract file


    Batch processing involves the bulk processing of data for the ERP system and includes
    data from payroll, finance, and accounts receivable. When the batch processing
    is completed, reporting system databases, such as data warehouses, are updated
    with the latest data. The reporting system databases are updated and the reports
    are generated, so that users can view them the next business day. Also, extract
    files are created in common formats like .csv and JSON. In our example, this is
    when the file `BikeCoSalesData.csv` is created for our use case.


    ### Step 2 – User Access of .CSV File on Dropbox


    Step 2 involves users at the Ottawa County Bike Company accessing the Dropbox
    app on their mobile devices to extract the file `BikeCoSalesData.csv`. This is
    similar to the dataset creation that was shown in [Chapter 2](#A978-1-4842-1203-5_2_Chapter.html),
    but it differs in that here we are using the Dropbox iPad app as the starting
    point of dataset creation. On the Dropbox shared file system, there is a folder
    named “Extracts.” In this folder is the `BikeCoSalesData.csv` file. Users select
    this file, then tap the “Open In…” button. This button lists all the apps that
    are capable of opening the `BikeCoSalesData.csv` data file. The list of apps appears
    above the “Open In…” button, and it includes a button for “Copy to Wave Analytics.”
    Users then select this button to load the .csv file in the Salesforce Analytics
    Cloud iPad app.


    The screenshots shown in Figures [6-4](#A978-1-4842-1203-5_6_Chapter.html#Fig4),
    [6-5](#A978-1-4842-1203-5_6_Chapter.html#Fig5), [6-6](#A978-1-4842-1203-5_6_Chapter.html#Fig6),
    and [6-7](#A978-1-4842-1203-5_6_Chapter.html#Fig7) show the series of steps involved.


    ![A978-1-4842-1203-5_6_Fig7_HTML.jpg](A978-1-4842-1203-5_6_Fig7_HTML.jpg)


    Figure 6-7.


    The first screen that appears in the Salesforce Analytics Cloud during file Load


    ![A978-1-4842-1203-5_6_Fig6_HTML.jpg](A978-1-4842-1203-5_6_Fig6_HTML.jpg)


    Figure 6-6.


    The message indicating that the file is being exported


    ![A978-1-4842-1203-5_6_Fig5_HTML.jpg](A978-1-4842-1203-5_6_Fig5_HTML.jpg)


    Figure 6-5.


    The “Copy to Wave Analytics” button


    ![A978-1-4842-1203-5_6_Fig4_HTML.jpg](A978-1-4842-1203-5_6_Fig4_HTML.jpg)


    Figure 6-4.


    The “Open In…” button'
  trans: '

    # 用例架构


    虽然可以使用提取-转换-加载（ETL）工具将几乎任何数据源与 Salesforce Analytics Cloud 集成，但 Salesforce Analytics
    Cloud 的一个关键特性是能够立即投入使用，无需复杂且昂贵的集成。在我们的示例中，渥太华县自行车公司的 IT 部门安排从其数据仓库中提取数据到公司 Dropbox
    文件夹的进程。该提取进程将一个 `.csv`（逗号分隔值）文件写入 Dropbox 文件夹。在其移动设备上安装了 Dropbox 应用程序的用户随后可以访问此
    `.csv` 文件并创建自己的应用程序。


    > **注意**：Dropbox 是一种流行的基于云的文件系统，可以从 Mac、PC 和移动设备访问。甚至还有针对主要 Linux 发行版的驱动程序。Dropbox
    是此类产品中的一员，其他产品还包括 Google Drive 和 Microsoft OneDrive。这些应用程序中的任何一个都能够向 Salesforce
    Analytics Cloud 提供文件。


    渥太华县自行车公司的用户创建自己应用程序的工作流程如图 6-2 所示。


    ![A978-1-4842-1203-5_6_Fig2_HTML.jpg](img/A978-1-4842-1203-5_6_Fig2_HTML.jpg)


    *图 6-2. 加载用例数据的工作流程*


    让我们仔细看看这些步骤中的每一步。


    ## 步骤 1 – 输出到 `.CSV` 文件


    这是唯一属于 IT 部门职责范围的步骤。大多数 IT 部门通常维护着在非工作时间运行批处理进程的调度系统。调度系统能够按特定顺序、在特定时间运行与企业软件相关的程序或进程。调度系统还能够运行自定义开发的进程。这些进程可以在任何平台上开发，包括提取-转换-加载（ETL）软件包，或者使用
    COBOL、Microsoft Visual Basic、Java 或 Python 等编程语言开发。图 6-3 展示了此过程中的第一步。


    ![A978-1-4842-1203-5_6_Fig3_HTML.jpg](img/A978-1-4842-1203-5_6_Fig3_HTML.jpg)


    *图 6-3. 生成提取文件的批处理步骤*


    批处理涉及 ERP 系统数据的大批量处理，包括来自薪资、财务和应收账款的数据。批处理完成后，报告系统数据库（如数据仓库）会使用最新数据进行更新。报告系统数据库更新后，会生成报告，以便用户能在下一个工作日查看。此外，还会以常见格式（如
    `.csv` 和 JSON）创建提取文件。在我们的示例中，此时会为我们的用例创建 `BikeCoSalesData.csv` 文件。


    ## 步骤 2 – 用户在 Dropbox 上访问 `.CSV` 文件


    步骤 2 涉及渥太华县自行车公司的用户在其移动设备上访问 Dropbox 应用程序以提取 `BikeCoSalesData.csv` 文件。这类似于 第 2
    章 中展示的数据集创建，但不同之处在于，这里我们使用 Dropbox iPad 应用程序作为数据集创建的起点。在 Dropbox 共享文件系统中，有一个名为
    `Extracts` 的文件夹。此文件夹中包含 `BikeCoSalesData.csv` 文件。用户选择此文件，然后点击 `在...中打开` 按钮。此按钮会列出所有能够打开
    `BikeCoSalesData.csv` 数据文件的应用程序。应用程序列表出现在 `在...中打开` 按钮上方，其中包含一个 `复制到 Wave Analytics`
    按钮。用户随后选择此按钮，将 `.csv` 文件加载到 Salesforce Analytics Cloud iPad 应用程序中。


    图 6-4、6-5、6-6 和 6-7 所示的屏幕截图展示了所涉及的一系列步骤。


    ![A978-1-4842-1203-5_6_Fig7_HTML.jpg](img/A978-1-4842-1203-5_6_Fig7_HTML.jpg)


    *图 6-7. 文件加载期间 Salesforce Analytics Cloud 中出现的第一个屏幕*


    ![A978-1-4842-1203-5_6_Fig6_HTML.jpg](img/A978-1-4842-1203-5_6_Fig6_HTML.jpg)


    *图 6-6. 指示文件正在导出的消息*


    ![A978-1-4842-1203-5_6_Fig5_HTML.jpg](img/A978-1-4842-1203-5_6_Fig5_HTML.jpg)


    *图 6-5. `复制到 Wave Analytics` 按钮*


    ![A978-1-4842-1203-5_6_Fig4_HTML.jpg](img/A978-1-4842-1203-5_6_Fig4_HTML.jpg)


    *图 6-4. `在...中打开` 按钮*

