- fmt: '# Part I

    A Complete Guide to the Salesforce Analytics Cloud


    # 1. An Overview of the Salesforce Analytics Cloud


    Electronic supplementary material The online version of this chapter (doi:`10.​1007/​978-1-4842-1203-5_​1`)
    contains supplementary material, which is available to authorized users.


    > Know where to find information and how to use it; that is the secret of success.
    —Albert Einstein


    Einstein’s sentiment, expressed in this concise quotation, captures our innate
    need to acquire and comprehend information. This is because information enables
    us to make decisions that are not impaired by bias or poor judgment. One could
    argue that this thought gave rise to computers, which were first developed to
    perform mathematical calculations faster. As computers have evolved, innovative
    strategies and technologies have also evolved to allow information in those computers
    to be more readily used in decision making. These strategies range from statistical
    methods to technologies that facilitate the storage of data for rapid retrieval,
    as well as visualization technologies.


    In this book, we cover the Salesforce Analytics Cloud, one of the latest technologies
    to enable the productive use of information. The Salesforce Analytics Cloud belongs
    to a class of products known as “data discovery” products; this is the term that
    is usually used by research firms dealing with this technology. The Salesforce
    Analytics Cloud features a high-performance storage infrastructure that facilitates
    rapid data retrieval and advanced visualizations allowing information to be quickly
    understood, all delivered from the cloud infrastructure that underpins the success
    of Salesforce products. Before we delve into the Salesforce Analytics Cloud, though,
    let’s set the context for this product and survey the data discovery products
    with a discussion of computers and technology in reporting and analytics.


    ## Evolution of Business Intelligence and Reporting Systems


    As computers evolved into systems to manage information, they were increasingly
    utilized in business and commerce. These early computers stored data in simple
    flat files. With increasing volumes of data, a more efficient and organized means
    of storing the data became necessary, which led to the creation of relational
    databases. Relational databases were capable of storing transactional data efficiently,
    but not in a manner that is easily queried or mined. The need to analyze information
    in transactional databases easily and quickly for reporting and analysis summoned
    into existence data warehouses and business intelligence (BI) tools. For over
    20 years, these warehouses and tools have delivered reliable answers to typical
    questions, and they will continue to be used for the foreseeable future.


    During this time, computer technology progressed at an astonishing rate, owing
    to increases in the power of microprocessors, the central “brain” of all computers.
    The 1980s marked the beginning of personal computer usage in business, with the
    introduction of the IBM personal computer in 1981, utilizing an Intel 8088 microprocessor
    with a total of 29,000 transistors (transistors are the electronic switches used
    in microprocessors). By the end of the 1980s, Intel Corporation had introduced
    the 80486, its first microprocessor having more than 1 million transistors. By
    2014, the transistor count in Intel microprocessors exceeded 5.5 billion. Figure
    `1-1` illustrates the incredible rate of increase in transistor use since the
    first personal computer.


    `![A978-1-4842-1203-5_1_Fig1_HTML.jpg](A978-1-4842-1203-5_1_Fig1_HTML.jpg)`


    Figure 1-1. Transistor count of Intel microprocessors from 1981 to 2014


    Intel has shipped over 200 million microprocessors whose collective transistor
    count is over 50 quadrillion, or put another way, more than 7 million CPU transistors
    for every person on earth. Microprocessors have long since left the confines of
    the personal computer, however, and have invaded nearly every aspect of our lives—in
    personal devices like smartphones and wearable health-monitoring devices, automotive
    control features, and “smart” meters monitoring the electric usage of our homes.
    It comes as no surprise, then, that this staggering amount of computing power
    produces an equally staggering amount of data.


    Computer networking on a global scale has led to information sharing on an unprecedented
    scale, primarily through the Internet. The Internet has enabled communication
    media that command considerable attention in our daily lives: email, social media,
    and informative or sales websites. One commonality of all of this data is that
    it lies outside the transactional databases we mentioned earlier, and it is not
    easily accessible to BI tools for reporting and analysis. The growth of this data
    in the last decade has meant that 80 to 90 percent of the data relevant to individuals
    and organizations lies outside the transactional databases—and to a large extent,
    out of our reach.


    Most of this data is classified as unstructured or semi-structured data because
    it lacks the strongly defined data types and well-defined data models found in
    structured data sources, like relational databases. Unstructured and semi-structured
    data does not have the static fields or organizational features of structured
    data sources. Table `1-1` lists examples of data sources that fall into each classification.


    Table 1-1. Data Types, Characteristics, and Examples


    | Data Type | Characteristics | Example(s) |

    | --- | --- | --- |

    | Structured data | Data model that has defined rectangular tables containing
    rows and columns, and referential integrity between tables | Relational databases
    (RDBMS) |

    | Semi-structured data | Loosely defined data model, internal structure | XML,
    CSV, spreadsheet files (Excel), JSON |

    | Unstructured data | No data model | Documents, email, social media, blogs, customer
    reviews, media files including image files and video |


    ## The Challenge of Data Variety


    This unstructured and semi-structured data from many disparate sources has created
    a data management problem because the quantity of data and rate at which it is
    produced are beyond the processing capabilities of relational databases. Data
    having these attributes is known as “Big Data,” and the most important attributes
    of Big Data are commonly referred to as “the three Vs,” meaning the unusually
    high volume of the data, the velocity at which the data is produced, and the wide
    variety of sources of this data. To meet the challenges presented by Big Data,
    there has been strong interest in a class of clustered file-system technologies
    designed to store Big Data. By far the best known of these technologies is the
    Hadoop Distributed File System or HDFS, which is available through the Apache
    Foundation as Apache Hadoop; it is capable of coping with the volume and velocity
    problem of Big Data.


    HDFS can be deployed on low-cost hardware, and the low upfront cost has created
    an incentive for HDFS to be used to aggregate all data—not just Big Data but also
    data originating in transactional systems like ERP and CRM systems, and even data
    from data warehouses. These large collections of data are sometimes referred to
    as “data lakes,” since the data is simply “thrown” into them to be used later.


    This brings us to the present-day challenge facing organizations that have created
    data lakes: it is difficult to get analytic value from data lakes at a speed that
    meets the needs and expectations of stakeholders and customers. There are two
    barriers impeding organizations from getting value from their Big Data investments.'
  raw: '# Part I

    A Complete Guide to the Salesforce Analytics Cloud


    # 1. An Overview of the Salesforce Analytics Cloud


    Electronic supplementary material The online version of this chapter (doi:[10.​1007/​978-1-4842-1203-5_​1](http://dx.doi.org/10.1007/978-1-4842-1203-5_1))
    contains supplementary material, which is available to authorized users.


    > Know where to find information and how to use it; that is the secret of success.
    —Albert Einstein


    Einstein’s sentiment, expressed in this concise quotation, captures our innate
    need to acquire and comprehend information. This is because information enables
    us to make decisions that are not impaired by bias or poor judgment. One could
    argue that this thought gave rise to computers, which were first developed to
    perform mathematical calculations faster. As computers have evolved, innovative
    strategies and technologies have also evolved to allow information in those computers
    to be more readily used in decision making. These strategies range from statistical
    methods to technologies that facilitate the storage of data for rapid retrieval,
    as well as visualization technologies.


    In this book, we cover the Salesforce Analytics Cloud, one of the latest technologies
    to enable the productive use of information. The Salesforce Analytics Cloud belongs
    to a class of products known as “data discovery” products; this is the term that
    is usually used by research firms dealing with this technology. The Salesforce
    Analytics Cloud features a high-performance storage infrastructure that facilitates
    rapid data retrieval and advanced visualizations allowing information to be quickly
    understood, all delivered from the cloud infrastructure that underpins the success
    of Salesforce products. Before we delve into the Salesforce Analytics Cloud, though,
    let’s set the context for this product and survey the data discovery products
    with a discussion of computers and technology in reporting and analytics.


    ## Evolution of Business Intelligence and Reporting Systems


    As computers evolved into systems to manage information, they were increasingly
    utilized in business and commerce. These early computers stored data in simple
    flat files. With increasing volumes of data, a more efficient and organized means
    of storing the data became necessary, which led to the creation of relational
    databases. Relational databases were capable of storing transactional data efficiently,
    but not in a manner that is easily queried or mined. The need to analyze information
    in transactional databases easily and quickly for reporting and analysis summoned
    into existence data warehouses and business intelligence (BI) tools. For over
    20 years, these warehouses and tools have delivered reliable answers to typical
    questions, and they will continue to be used for the foreseeable future.


    During this time, computer technology progressed at an astonishing rate, owing
    to increases in the power of microprocessors, the central “brain” of all computers.
    The 1980s marked the beginning of personal computer usage in business, with the
    introduction of the IBM personal computer in 1981, utilizing an Intel 8088 microprocessor
    with a total of 29,000 transistors (transistors are the electronic switches used
    in microprocessors). By the end of the 1980s, Intel Corporation had introduced
    the 80486, its first microprocessor having more than 1 million transistors. By
    2014, the transistor count in Intel microprocessors exceeded 5.5 billion. Figure
    [1-1](#A978-1-4842-1203-5_1_Chapter.html#Fig1) illustrates the incredible rate
    of increase in transistor use since the first personal computer.


    ![A978-1-4842-1203-5_1_Fig1_HTML.jpg](A978-1-4842-1203-5_1_Fig1_HTML.jpg)


    Figure 1-1.


    Transistor count of Intel microprocessors from 1981 to 2014


    Intel has shipped over 200 million microprocessors whose collective transistor
    count is over 50 quadrillion, or put another way, more than 7 million CPU transistors
    for every person on earth. Microprocessors have long since left the confines of
    the personal computer, however, and have invaded nearly every aspect of our lives—in
    personal devices like smartphones and wearable health-monitoring devices, automotive
    control features, and “smart” meters monitoring the electric usage of our homes.
    It comes as no surprise, then, that this staggering amount of computing power
    produces an equally staggering amount of data.


    Computer networking on a global scale has led to information sharing on an unprecedented
    scale, primarily through the Internet. The Internet has enabled communication
    media that command considerable attention in our daily lives: email, social media,
    and informative or sales websites. One commonality of all of this data is that
    it lies outside the transactional databases we mentioned earlier, and it is not
    easily accessible to BI tools for reporting and analysis. The growth of this data
    in the last decade has meant that 80 to 90 percent of the data relevant to individuals
    and organizations lies outside the transactional databases—and to a large extent,
    out of our reach.


    Most of this data is classified as unstructured or semi-structured data because
    it lacks the strongly defined data types and well-defined data models found in
    structured data sources, like relational databases. Unstructured and semi-structured
    data does not have the static fields or organizational features of structured
    data sources. Table [1-1](#A978-1-4842-1203-5_1_Chapter.html#Tab1) lists examples
    of data sources that fall into each classification.


    Table 1-1.


    Data Types, Characteristics, and Examples


    | Data Type | Characteristics | Example(s) |

    | --- | --- | --- |

    | Structured data | Data model that has defined rectangular tables containing
    rows and columns, and referential integrity between tables | Relational databases
    (RDBMS) |

    | Semi-structured data | Loosely defined data model, internal structure | XML,
    CSV, spreadsheet files (Excel), JSON |

    | Unstructured data | No data model | Documents, email, social media, blogs, customer
    reviews, media files including image files and video |


    ## The Challenge of Data Variety


    This unstructured and semi-structured data from many disparate sources has created
    a data management problem because the quantity of data and rate at which it is
    produced are beyond the processing capabilities of relational databases. Data
    having these attributes is known as “Big Data,” and the most important attributes
    of Big Data are commonly referred to as “the three Vs,” meaning the unusually
    high volume of the data, the velocity at which the data is produced, and the wide
    variety of sources of this data. To meet the challenges presented by Big Data,
    there has been strong interest in a class of clustered file-system technologies
    designed to store Big Data. By far the best known of these technologies is the
    Hadoop Distributed File System or HDFS, which is available through the Apache
    Foundation as Apache Hadoop; it is capable of coping with the volume and velocity
    problem of Big Data.


    HDFS can be deployed on low-cost hardware, and the low upfront cost has created
    an incentive for HDFS to be used to aggregate all data—not just Big Data but also
    data originating in transactional systems like ERP and CRM systems, and even data
    from data warehouses. These large collections of data are sometimes referred to
    as “data lakes,” since the data is simply “thrown” into them to be used later.


    This brings us to the present-day challenge facing organizations that have created
    data lakes: it is difficult to get analytic value from data lakes at a speed that
    meets the needs and expectations of stakeholders and customers. There are two
    barriers impeding organizations from getting value from their Big Data investments.'
  trans: "\n# 第一部分  \nSalesforce 分析云完全指南\n\n# 第 1 章 Salesforce 分析云概述\n\n电子补充材料：本章在线版本（doi:`10.​1007/​978-1-4842-1203-5_​1`）包含补充材料，仅供授权用户使用。\n\
    \n> 知道去哪里寻找信息并懂得如何利用它——这就是成功的秘诀。 ——阿尔伯特·爱因斯坦\n\n爱因斯坦在这句简洁引文中表达的观点，揭示了我们与生俱来获取和理解信息的需求。这是因为信息能帮助我们做出不受偏见或错误判断影响的决策。可以说，正是这种思想催生了计算机——最初发明计算机就是为了更快地进行数学计算。随着计算机的发展，创新策略和技术也不断演进，使计算机中的信息能更便捷地用于决策。这些策略涵盖从统计方法到促进数据快速检索的存储技术，以及可视化技术。\n\
    \n本书将介绍 Salesforce 分析云——这项能高效利用信息的最新科技之一。Salesforce 分析云属于被称为\"数据发现\"产品的类别；这是研究该技术领域的调研机构常用的术语。Salesforce\
    \ 分析云拥有高性能存储基础设施，可实现快速数据检索和高级可视化，让信息能被迅速理解——所有这些都依托于支撑 Salesforce 产品成功的云端基础设施。但在深入探讨\
    \ Salesforce 分析云之前，我们先来了解该产品的背景，并通过讨论报告与分析中的计算机及技术，来审视数据发现产品。\n\n## 商业智能与报告系统的演进\n\
    \n随着计算机演变为信息管理系统，它们在商业领域的应用日益广泛。早期的计算机将数据存储在简单的平面文件中。随着数据量不断增长，需要更高效、更有组织的数据存储方式，这催生了关系型数据库。关系型数据库能够高效存储事务型数据，但不易于查询或挖掘。为了能轻松、快速分析事务型数据库中的信息以用于报告和分析，数据仓库和商业智能（BI）工具应运而生。20\
    \ 多年来，这些数据仓库和工具为典型问题提供了可靠的答案，并且在可预见的未来仍将继续使用。\n\n在此期间，随着微处理器（所有计算机的中央\"大脑\"）性能的提升，计算机技术以惊人速度发展。20\
    \ 世纪 80 年代标志着个人计算机在商业领域的应用开端：1981 年 IBM 推出个人计算机，采用 Intel 8088 微处理器，总共有 29,000\
    \ 个晶体管（晶体管是微处理器中使用的电子开关）。到 80 年代末，英特尔公司推出了 80486，这是其首款晶体管数量超过 100 万个的微处理器。到 2014\
    \ 年，英特尔微处理器的晶体管数量已超过 55 亿。图`1-1`展示了自第一台个人计算机问世以来晶体管使用量的惊人增长速率。\n\n`![A978-1-4842-1203-5_1_Fig1_HTML.jpg](img/A978-1-4842-1203-5_1_Fig1_HTML.jpg)`\n\
    \n图 1-1. 1981 年至 2014 年英特尔微处理器晶体管数量\n\n英特尔已交付超过 2 亿颗微处理器，其晶体管总数超过 5 京，换句话说，地球上每个人对应的\
    \ CPU 晶体管数量超过 700 万个。然而，微处理器早已不再局限于个人计算机，而是渗透到我们生活的几乎方方面面——智能手机和可穿戴健康监测设备等个人设备、汽车控制功能、以及监测家庭用电的\"\
    智能\"电表。因此，如此惊人的计算能力产生同样惊人的数据量也就不足为奇了。\n\n全球范围内的计算机网络主要通过互联网实现了前所未有的信息共享。互联网催生了在我们日常生活中占据重要地位的通信媒介：电子邮件、社交媒体、以及信息性或销售类网站。所有这些数据的一个共同点是它们位于我们之前提到的事务型数据库之外，BI\
    \ 工具难以对其进行报告和分析。过去十年间这类数据的增长意味着，与个人和组织相关的数据中有 80%到 90%位于事务型数据库之外——在很大程度上超出了我们的触及范围。\n\
    \n这些数据大多被归类为非结构化或半结构化数据，因为它们缺乏结构化数据源（如关系型数据库）中那种严格定义的数据类型和明确的数据模型。非结构和半结构化数据不具备结构化数据源的静态字段或组织特征。表`1-1`列出了属于各类别的数据源示例。\n\
    \n表 1-1. 数据类型、特征及示例\n\n| 数据类型 | 特征 | 示例 |\n| --- | --- | --- |\n| 结构化数据 | 具有包含行和列的矩形表定义，以及表之间参照完整性的数据模型\
    \ | 关系型数据库（RDBMS） |\n| 半结构化数据 | 松散定义的数据模型，内部结构 | XML、CSV、电子表格文件（Excel）、JSON |\n\
    | 非结构化数据 | 无数据模型 | 文档、电子邮件、社交媒体、博客、客户评论、包括图像文件和视频在内的媒体文件 |\n\n## 数据多样性的挑战\n\n\
    来自众多不同来源的这些非结构化和半结构化数据造成了数据管理难题，因为数据量及其产生速率已超出关系型数据库的处理能力。具备这些属性的数据被称为\"大数据\"\
    ，而大数据最重要的属性通常被称为\"3V\"：即异常庞大的数据量（Volume）、数据产生的速度（Velocity）以及数据来源的广泛多样性（Variety）。为应对大数据带来的挑战，一类旨在存储大数据的集群文件系统技术引起了广泛关注。其中最为人熟知的技术是\
    \ Hadoop 分布式文件系统（HDFS），可通过 Apache 基金会获取为 Apache Hadoop；它能够应对大数据的容量和速度问题。\n\nHDFS\
    \ 可部署在低成本硬件上，低廉的前期成本促使人们使用 HDFS 来聚合所有数据——不仅包括大数据，还包括来自 ERP 和 CRM 等事务系统的数据，甚至数据仓库中的数据。这些庞大的数据集合有时被称为\"\
    数据湖\"，因为数据只是被简单\"投入\"其中以供后续使用。\n\n这就引出了当前创建数据湖的组织面临的挑战：很难从数据湖中获得分析价值，且速度难以满足利益相关者和客户的需求与期望。有两个障碍阻碍着组织从其大数据投资中获取价值。\n"
- fmt: '### Data Uncertainty


    Figure [1-2](#A978-1-4842-1203-5_1_Chapter.html#Fig2) illustrates the progression
    to data lakes. The first barrier to getting value from Big Data is data uncertainty,
    and it derives from the “variety” aspect of the data. In the early days of `HDFS`,
    around 2010, there was a tendency to focus on the volume and velocity characteristics
    of Big Data, since the primary challenge was simply to store large amounts of
    rapidly produced data. The variety of data has proved to be full of problems and
    is the cause of data uncertainty. Most organizations are accustomed to the paradigm
    associated with data warehouses, for which typically there have been a small number
    of high-value data sources. These data sources are well understood and often well
    documented. By contrast, most data lakes have data from hundreds of data sources.


    From the perspective of data analysts or users, there is a high degree of uncertainty
    as to what data is available and what the value is of the data that is being aggregated.
    With traditional BI and data warehouse solutions, 80 percent of the time needed
    to develop solutions to this uncertainty involves upfront tasks (e.g., requirements
    gathering, data modeling, data cleansing, and building the data warehouse). When
    we take into consideration the hundreds of data sources that would be represented
    in a data lake, much of them producing unstructured data, this time requirement
    only promises to increase. The impact of the large number of data sources, multiplied
    by the time involved for upfront tasks, makes data uncertainty a chronic problem.


    ![A978-1-4842-1203-5_1_Fig2_HTML.jpg](A978-1-4842-1203-5_1_Fig2_HTML.jpg)


    Figure 1-2.


    The evolution of data lakes


    ### The Scarcity of Personnel


    The second barrier to getting value from Big Data involves a shortage of professionals
    who can work with these data sources. Data scientists and programmers who are
    skilled in working with Big Data are in short supply. The complexity of tools
    and programming knowledge required to extract information from `HDFS` are considerable,
    and as a result there are initiatives to access Big Data by using less complex
    tools like `SQL`. However, this approach has been largely ineffective at making
    Big Data more accessible, or at addressing the challenge of data uncertainty.
    This personnel problem is not easily addressed, as we cannot expect the supply
    of data scientists or programmers to increase anytime soon. In view of these two
    barriers, a better strategy is to rethink the current approach to Big Data and
    reconsider how we can work with unstructured data.


    ## Data Discovery


    To get past the need for data scientists and developers, an obvious solution is
    to provide interfaces that allow users to overcome the barrier of data uncertainty.
    Business analysts, data analysts, and subject-matter experts are accustomed to
    working with tools, and not command-line interfaces or code editors, so the interfaces
    must be of a graphic and intuitive nature.


    The overall goal of these tools is to enable users to perform some of the basic
    tasks that would be performed by data scientists. Looking at the data-source record
    count, examining the distribution of the data versus time or other dimensions,
    and determining to the overall quality of the data are all basic tasks that can
    be performed with data discovery tools. With the capabilities of these data discovery
    tools, the data is “democratized” and users can become “citizen data scientists.”


    To understand how this is possible, let’s examine some of the most prominent features
    of data discovery tools, focusing on the `Salesforce Analytics Cloud`. Figure
    [1-3](#A978-1-4842-1203-5_1_Chapter.html#Fig3) shows a simple logical diagram
    of a data discovery platform.


    ![A978-1-4842-1203-5_1_Fig3_HTML.jpg](A978-1-4842-1203-5_1_Fig3_HTML.jpg)


    Figure 1-3.


    Logical diagram of data discovery platform


    ### Self-Service Application Development and Analytic Interface


    The `Salesforce Analytics Cloud` features a self-service portal that allows users
    to provision their own datasets and then to create analytic applications that
    use those datasets. For more complex data sources, programmers can create datasets
    and make them available to the portal users.


    The analytic capability of the `Salesforce Analytics Cloud` relies on its visualization
    tools to give users the ability to easily understand data; they can also apply
    refinements by clicking on part of visualization and observing the changes that
    occur in other visualizations or table components. In this way, the `Salesforce
    Analytics Cloud` is capable of performing descriptive analytics, answering the
    question “What happened?”; it excels at diagnostic analytics, also answering the
    question “Why did it happen?”


    ### A Data Server


    The `Salesforce Analytics Cloud` features a data server that is specially designed
    to facilitate analytics and data discovery. This data server should not be confused
    with relational database servers; it has a much different way of storing data
    and establishing relationships between data.


    The design of this data server is based on a faceted data model, whereby each
    record captured from a source is stored as an independent record, and each column
    in the record becomes an attribute, or “facet,” of the record. Indexes are built
    on each facet, allowing rapid retrieval.


    The `Salesforce Analytics Cloud` allows real-time exploration of data, which involves
    navigating all the records in a dataset in real time. When data is queried from
    the data server during such real-time exploration, the records are held in memory.
    This in-memory aspect of data discovery data servers is critical for achieving
    performance in real-time data exploration.


    ### Data-Loading Interfaces and APIs


    The `Salesforce Analytics Cloud` provides a variety of methods for loading data.
    End users can create datasets and load data into them from a web user interface.
    The `Salesforce Analytics Cloud` also provides web services to load the data.
    Specifically, the `Salesforce Analytics Cloud` supports both the venerable `XML`-based
    Simple Object Access Protocol, also known as `SOAP`, and the Representational
    State Transfer, also known as `REST`.


    Support for Extract Transfer Load, or `ETL`, tools is provided primarily through
    the web services to load data into the `Wave` data server. Many other data discovery
    products require customers to purchase and use `ETL` tools that have been developed
    specifically for their data discovery products. Because `Salesforce` fosters partnerships
    with other IT product companies, a wide range of `ETL` products support the `Salesforce
    Analytics Cloud`.


    The `Salesforce Analytics Cloud` is a complete technical solution for capturing
    and storing data, as well as deriving analytic value from it. The `Salesforce
    Analytics Cloud` is agnostic to the variety of source data, and is adept at processing
    both structured data and unstructured data. Compare this to the technologies associated
    with Big Data like `HDFS`, which only provide a storage solution, and it is not
    difficult to see why data discovery products like the `Salesforce Analytics Cloud`
    are enjoying a high adoption rate. According to `Gartner Inc.`, the leading technology
    research firm, data discovery products now dominate all new spending on BI and
    analytic tools.'
