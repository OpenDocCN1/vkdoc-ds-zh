- fmt: '### Digging Deeper


    At this point, questions may arise just from using the dashboard. For instance,
    we established that first-quarter performance has steadily improved, but we have
    not learned the reason. Fortunately, with the Salesforce Analytics Cloud, we can
    quickly develop a new dashboard that allows us to answer this question! But before
    proceeding to develop a different dashboard, let’s examine the question in more
    detail. Was the sales improvement due to increased performance for a particular
    region? For a particular product line? Or for a particular product category? As
    you will see, we can easily arrive at the answers to each of these questions.


    To address this, we develop a dashboard with four bar charts. The first bar chart
    is quarter 1 for each year, which serves as a reference for the three other stacked
    bar charts. The stacked bar charts are for Sales Territory-Region, Product Line,
    and Product Category. This dashboard is titled “First Quarter Growth Study,” and
    it is shown in Figure [6-16](#A978-1-4842-1203-5_6_Chapter.html#Fig16).


    ![A978-1-4842-1203-5_6_Fig16_HTML.jpg](A978-1-4842-1203-5_6_Fig16_HTML.jpg)


    Figure 6-16.

    First Quarter Growth Study


    The upper left bar chart shows the sales growth for the first quarters over a
    period of three years, and this is information we saw on the Sales Performance
    dashboard (Figure [6-15](#A978-1-4842-1203-5_6_Chapter.html#Fig15)). The other
    three stacked bar charts have segments based on region in the upper right, product
    line in the lower left, and product category in the lower right. To examine each
    of these stacked bar charts, we press the icon in the upper right corner of the
    chart with four outward-directed arrows. The upper right bar chart, for Sales
    Territory-Region, is shown in Figure [6-17](#A978-1-4842-1203-5_6_Chapter.html#Fig17).


    ![A978-1-4842-1203-5_6_Fig17_HTML.jpg](A978-1-4842-1203-5_6_Fig17_HTML.jpg)


    Figure 6-17.

    Sales Territory-Region, Quarter 1, stacked bar chart


    From this bar chart it would appear that the Southwest region has seen steady
    growth over three years. It is easy to switch to another chart type, and sometimes
    there is an advantage to doing this. In this case, when we change to a line chart,
    the story behind the numbers is more obvious, with the line for the Southwest
    increasing steadily over the period—clearly the best performing region, as shown
    in Figure [6-18](#A978-1-4842-1203-5_6_Chapter.html#Fig18).


    ![A978-1-4842-1203-5_6_Fig18_HTML.jpg](A978-1-4842-1203-5_6_Fig18_HTML.jpg)


    Figure 6-18.

    Sales Territory-Region, Quarter 1, line chart


    For the other two bar charts, we also see interesting trends. Figure [6-19](#A978-1-4842-1203-5_6_Chapter.html#Fig19)
    shows the stacked bar chart for Product Line.


    ![A978-1-4842-1203-5_6_Fig19_HTML.jpg](A978-1-4842-1203-5_6_Fig19_HTML.jpg)


    Figure 6-19.

    Product Line, Quarter 1, stacked bar chart


    In figure [6-19](#A978-1-4842-1203-5_6_Chapter.html#Fig19), we see that the mountain
    bike line experienced declining sales, and the road bike line experienced a surge
    in 2014, only to decline in 2015. The touring line, introduced in 2015, helped
    to maintain sales and offset the decline in mountain and road bike sales.


    The last stacked bar chart is for Product Category, and is shown in Figure [6-20](#A978-1-4842-1203-5_6_Chapter.html#Fig20).
    The company saw growth in all areas, with bikes and components seeing the most
    growth.


    ![A978-1-4842-1203-5_6_Fig20_HTML.jpg](A978-1-4842-1203-5_6_Fig20_HTML.jpg)


    Figure 6-20.

    Product Line, Quarter 1, stacked bar chart


    The four bar charts shown in Figure [6-16](#A978-1-4842-1203-5_6_Chapter.html#Fig16)
    were developed in a matter of minutes on an iPad, and they immediately revealed
    insights into the growth trends underlying the first quarter sales. From examining
    all the charts, we were able to conclude that the Southwestern United States was
    the strongest-performing region, and the introduction of the touring product line
    in 2015 helped to offset declines in the road bike line that had surged in 2014.


    Since the theme of this chapter is mobile uses, let’s look at how the First Quarter
    Growth Study appears on the iPhone 5S; it is shown in Figure [6-21](#A978-1-4842-1203-5_6_Chapter.html#Fig21).


    ![A978-1-4842-1203-5_6_Fig21_HTML.jpg](A978-1-4842-1203-5_6_Fig21_HTML.jpg)


    Figure 6-21.

    First Quarter Growth Study, on iPhone 5S


    The iPhone’s smaller screen requires scrolling, but it provides the same level
    of interaction as the iPad, allowing drilling into charts and modification of
    chart types.


    To cover the full range of mobile devices, let’s look at how the First Quarter
    Growth Study appears on the Apple Watch. As you would expect, the small screen
    provides a compressed view, but it is nevertheless understandable and the interface
    allows for drilling into data to view the actual numbers behind the charts. For
    those who sit through long meetings where smartphone use might be inappropriate,
    the Apple Watch allows an alternative way to access data discreetly. Figure [6-22](#A978-1-4842-1203-5_6_Chapter.html#Fig22)
    shows the First Quarter Growth Study on an Apple Watch.


    ![A978-1-4842-1203-5_6_Fig22_HTML.jpg](A978-1-4842-1203-5_6_Fig22_HTML.jpg)


    Figure 6-22.

    First Quarter Growth Study, displayed on Apple Watch


    ### Adding Other Dimensions: Evaluating Individual Contributors


    We can increase the utility of the sales performance dashboard by adding other
    measures. For instance, within each region, there are sales managers whose responsibility
    is maintaining and growing sales within their regions. Most users of the dashboard
    want to know the “players”—who are the best-performing sales managers. Adding
    this information to our dashboard is easily accomplished with a bar chart showing
    the names of the sales managers and their performance, as indicated by their contributions
    to the Sales Amount measure. Examining the bar chart with this measure, we can
    see that in North America, Nathaniel Grimes is the top sales manager, followed
    by Aki Hamanishi. This is shown in Figure [6-23](#A978-1-4842-1203-5_6_Chapter.html#Fig23).


    ![A978-1-4842-1203-5_6_Fig23_HTML.jpg](A978-1-4842-1203-5_6_Fig23_HTML.jpg)


    Figure 6-23.

    Top sales managers


    By adding this bar chart to the Sales Performance dashboard, we can apply refinements,
    and thereby observe how sales manager performance changes. This is the advantage
    of the Salesforce Analytics Cloud: it allows us to dig deeper into data simply
    by adding new measures to a dashboard. As we apply refinements with the toggle
    widgets for Product Line and Sales Territory-Region, we can better understand
    the performance of the individual sales managers. If we select the top-performing
    Southwest region and the Mountain product line, we see that this is an area where
    Nathaniel Grimes performs best, as is evidenced in Figure [6-24](#A978-1-4842-1203-5_6_Chapter.html#Fig24).


    ![A978-1-4842-1203-5_6_Fig24_HTML.jpg](A978-1-4842-1203-5_6_Fig24_HTML.jpg)


    Figure 6-24.

    Top sales manager for Mountain product line in Southwest region


    If we select the road line on the Product Line toggle widget, we see that Nathaniel
    Grimes does not dominate this area; instead, another sales manager, Sayaka Ito,
    is the top performer. This is shown in Figure [6-25](#A978-1-4842-1203-5_6_Chapter.html#Fig25).


    ![A978-1-4842-1203-5_6_Fig25_HTML.jpg](A978-1-4842-1203-5_6_Fig25_HTML.jpg)


    Figure 6-25.

    Top sales manager for Road product line in Southwest region'
