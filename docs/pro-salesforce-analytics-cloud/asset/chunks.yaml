- fmt: '### Automatic Control via Computer Technology


    Computer technology began making an impact on the control of manufacturing processes
    in the 1980s, in several different areas. As a result, these technologies enabled
    more precise control of manufacturing processes. Instrumentation, when combined
    with basic control devices such as solenoids (a type of magnetic on/off switch)
    or more sophisticated control devices (like variable-flow control valves) enabled
    “closed loop control” using small microprocessor-based controllers. Here, the
    term “loop” refers to the loop formed by the inputs to and outputs from a controller,
    forming a circle with the controller at one end and the process equipment at the
    other. These controllers allowed unprecedented control over manufacturing processes.


    Programmable controllers were introduced in the 1980s, providing a flexible, easy-to-program
    platform for control of manufacturing processes. These programmable controllers
    were initially designed to offer a computer-based method of replicating the logic
    diagrams used by engineers and electricians to perform discrete control, whereby
    there are only digital inputs and outputs in a manufacturing process. Later versions
    of programmable controllers replicated the function of loop controllers but were
    also capable of controlling systems with hundreds of inputs and outputs.


    ### Data Networks Offer Increased Integration


    In the 1990s, there emerged networks for instrumentation as a way to configure
    and monitor the instruments. These instrumentation networks also simplified the
    wiring of the instruments, requiring only a single data communications cable to
    be run among all the instruments on a production line. The instruments could not
    only indicate a physical property but also report on their “health” and allow
    operational parameters of the devices to be changed. For example, a photoelectric
    sensor often needs to be adjusted to ensure it is properly sensing objects as
    they pass in front of it. Now, adjustments could be made to that photoelectric
    sensor using the instrument data network.


    Electric motors are one of the most critical elements of a manufacturing process,
    and motor controllers are usually called “drives.” (We will discuss drives later
    in this chapter.) Device networks are also used for these drives, allowing them
    to be configured across the network and providing complete operational data, which
    includes speed of rotation, electric current, and if and when a motor is going
    to fail.


    The data from instrumentation and programmable controllers has been collected
    and stored in databases for over 20 years, utilizing supervisory systems known
    as Supervisory Control and Data Acquisition (SCADA) systems and in Manufacturing
    Execution Systems (MES). Figure [5-2](#A978-1-4842-1203-5_5_Chapter.html#Fig2)
    shows how SCADA and MES systems are networked with the controllers and instrumentation
    just discussed.


    ![A978-1-4842-1203-5_5_Fig2_HTML.jpg](A978-1-4842-1203-5_5_Fig2_HTML.jpg)


    Figure 5-2. SCADA and MES network


    SCADA systems acquire and store instrumentation and controller data for later
    review to determine the root cause of any problems or the timing of a failure.
    Both SCADA and MES systems acquire data that enables them to show the performance
    of manufacturing processes, track product lots, and record raw material consumption.


    ## Company Structure and Facilities


    Let’s examine some manufacturing companies and the types of facilities usually
    found in these companies. Organizations that are involved in manufacturing often
    have many facilities that contain major manufacturing processes. For example,
    the glass company in our use case has three types of facilities: float glass plants,
    glass fabrication plants, and automotive encapsulation facilities. Let’s examine
    each of these.


    ### Float Glass Plants


    Float glass plants are facilities involved in the manufacture of glass from raw
    materials. These facilities melt silica sand and soda ash in a large furnace to
    produce a massive, continuous ribbon of glass that is cut into rectangular pieces.
    It is then shipped to other facilities to make things like automotive windows
    and glass windows for homes and buildings. These float glass facilities usually
    have one or two furnace lines that are hundreds of yards long. Float glass plants
    are so named because of the manufacturing process used to produce the glass. In
    this process, the molten glass is drawn out of the furnace into a bath of molten
    tin to cool, thereby ensuring that both sides of the glass are clear and flat.


    A float glass plant is many times larger than a fabrication facility, and it consumes
    substantial amounts of natural gas, used to melt the raw materials. The plant
    must run continuously 24 hours per day so as to maintain the stability of the
    process. When an equipment failure occurs on a production line, the glass production
    continues and the glass is crushed and refed into the furnace until the repairs
    are completed. The uptime metric here is the percentage of time the line is producing
    usable glass. An equipment outage drives this percentage down, but so do other
    events, such as product changeovers. That is, sometimes there has to be a change
    in the thickness or tint of the glass being produced. Making these production
    changes can destabilize the line for hours or even days, resulting in downtime
    and refed glass that is too brittle to cut. Limiting the number of changeovers
    thus maximizes the facility’s uptime.


    ### Glass Fabrication Plants


    Some of the glass fabrication facilities in our example manufacturer make automotive
    windows by cutting a sheet of glass into particular shapes, smoothing the edges,
    and bending the glass to match the contour of the automobile model for which it
    is intended. The operational focus is vastly different from the float glass plant.
    Instead of one major operation, there are many small production lines, each of
    which often performs a single task. An equipment failure on one of these production
    lines can affect uptime, not only for the line with the equipment failure but
    also for the overall plant output.


    Fabrication facilities must be cognizant of product quality, as the glass that
    goes into automobiles must be free of defects. In the float glass plants, the
    quality issues are obvious—usually bubbles or visible defects that are easily
    detected with laser inspection; the defective pieces are scrapped immediately.
    In the fabrication facility, however, quality issues can be harder to detect.
    They are usually found only after production of a piece of automotive glass has
    been completed. If a defective piece of automotive glass reaches a customer, there
    are chargebacks to the facility and possible loss of quality reputation, which
    ultimately results in loss of that customer.


    ### Automotive Encapsulation Facilities


    The third facility type for our example manufacturer has a simple operation: encapsulating
    the automotive glass in a polymer for strength and ease of installation on an
    automobile assembly line. We don’t cover this type of facility in this chapter.'
