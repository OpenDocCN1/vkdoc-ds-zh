  trans: '

    ### 云架构


    Salesforce 分析云具有一些独特的功能，使其有别于其他数据发现产品。例如，自推出以来，它一直是 100% 基于云的。许多其他数据发现产品拥有复杂且精细的基础设施，面向“本地”安装；它们必须由系统管理员安装和维护。同样，用于添加新功能或修复错误的补丁和升级需要计划停机，并且在安装到旧的生产系统之前必须进行彻底测试。如果数据发现系统是关键任务系统，则必须安装和维护一个辅助系统以提供高可用性，这可能涉及负载均衡器等复杂的网络组件。


    基于云的 Salesforce 分析云消除了复杂的本地基础设施，以及随之而来的高可用性的额外复杂性。补丁和更新会持续应用到 Salesforce 分析云，因此您始终使用的是最新版本。


    ### 移动优先


    Salesforce 分析云的一个独特功能是其移动优先的方法。Salesforce 分析云在设计时就考虑到了移动用户，支持使用智能手机和平板电脑。移动用户可以完全在这些移动设备上创建数据集和应用程序。Salesforce
    分析云还能让用户在 Apple Watch 上使用图形和数据发现功能，并且是目前唯一具备此功能的数据发现产品。


    ### 与 Salesforce 生态系统的集成


    对于使用 Salesforce 销售和服务云的组织，可以轻松地从 Salesforce 对象构建数据集——并且这些数据集可以与任何其他数据源结合。用户可以与
    Salesforce 生态系统中的其他用户共享数据发现应用程序，包括 Salesforce 社交企业云 Chatter。这种媒介允许快速无缝地共享结果，并消除了截取图形屏幕截图或提取数据以共享结果的需要。


    Salesforce 在其合作伙伴生态系统中拥有广泛的技术公司网络。这个生态系统使那些已经投资了分析工具和基础设施的组织能够通过 Salesforce 分析云增强其投资。这与其他需要为其产品使用专有
    ETL 工具的数据发现供应商形成了对比。


    ## 结论


    在本介绍性章节中，我们定义并描述了数据发现，并展示了为什么对于某些类型的数据，它是构建数据湖的一个有吸引力的替代方案。我们探讨了数据发现的通用特性，然后研究了
    Salesforce 分析云如何提供扩展的发现工具。现在，我们准备在接下来的三章中详细研究 Salesforce 分析云。这些章节之后，将是一些包含特定行业用例的章节，演示如何应用
    Salesforce 分析云高效且有效地提供分析价值。


    以下是本书的章节，分为两部分。


    **第一部分：Salesforce 分析云完全指南**


    第一部分包括第 1 章到第 4 章。第 1 章提供了简要的概述和介绍。第 2 章涵盖了分析云资源管理器，而第 3 章提供了关于分析云构建器的深入教程，并涵盖了数据集、透镜、仪表板和应用程序的创建。第
    4 章面向将使用集成工具在 Salesforce 分析云 Wave 平台中创建分析应用程序的开发人员。


    **第二部分：使用 Salesforce 分析云的业务分析解决方案**


    第二部分包括第 5 章到第 7 章。第 5 章首先讨论了关键决策制定和数据发现，然后转向一个制造业用例。第 6 章侧重于移动数据发现，并研究了一家拥有成熟销售运营的公司。第
    7 章涵盖了高级数据获取和数据处理，包括数据整理和清洗等概念，并以使用 Python 编程语言执行数据处理的示例作为结尾。


    # 2. Salesforce 分析云资源管理器


    > 我听到的我会忘记，我看到的我会记住，我做到的我会理解。——孔子


    中国古代哲学家孔子教导我们要做行动者，这是获取知识的途径。如果你已经读到这里，那么你很可能对 Salesforce 分析云和数据发现不仅仅是有兴趣而已。你可能正在考虑尝试使用
    Salesforce 分析云。好消息是，使用 Salesforce 分析云成为一名行动者并不困难。事实上，本章所涵盖的正是如何使用 Salesforce 分析云资源管理器。


    ## 什么是云资源管理器？


    Salesforce 分析云资源管理器——或者我们称之为云资源管理器——是用户界面。基本上，它是 Salesforce 分析云的用户体验。它允许用户通过上传数据、创建图形和仪表板，并将这些内容打包成应用程序来创建数据发现应用程序。


    云资源管理器有两种主要的服务器访问方式供用户使用。第一种是在 Web 浏览器中运行的桌面客户端；第二种是通过移动设备运行。移动设备可以是 Apple iPhone
    或 Apple iPad。事实上，Apple iPhone 用户甚至可以在 Apple Watch 上有限制地使用云资源管理器。用户无需专门使用任何一种设备；云资源管理器用户也可以在桌面客户端上创建项目，然后在
    iPhone 或 iPad 上查看。


    在本章中，我们将详细研究云资源管理器，解释其主要元素及其提供的功能。在此过程中，我们将使用一个简单的数据集和 Wave，并展示一些使用云资源管理器进行数据呈现的例子。这将让您最好地了解云资源管理器能实现什么，进而了解整个
    Salesforce 分析云的能力。我们将以对云资源管理器功能的讨论来结束本章，以帮助您决定 Salesforce 分析云是否适合您的用途。

    '
- fmt: '### The Two Versions of the Salesforce Analytics Cloud


    There are two versions of the Salesforce Analytics Cloud, each targeted to a different
    audience. Pricing is not being covered here, as prices are subject to change;
    you should contact your sales representative for answers to questions about pricing.
    The two versions are as follows.


    #### The Wave Analytics App


    This “lite” version of the Salesforce Analytics Cloud allows users to perform
    data exploration only on Salesforce data. It does not allow users to upload their
    own data to the Salesforce Analytics Cloud into datasets. This simpler version
    is intended for sales managers and individuals who only want to use the Salesforce
    Analytics Cloud with Salesforce data. It is billed as “ready to go” and is very
    easy to use.


    Users of this version are limited to total datasets of 25 million rows. They are,
    however, permitted to customize their dashboards and share data from Cloud Explorer
    to Salesforce Chatter, or via email.


    #### The Wave Analytics Platform


    This version of the Salesforce Analytics Cloud essentially offers full use of
    the Salesforce Analytics Cloud. Users upload their own data into datasets using
    either`.csv`files or a wide array of other methods, including ETL tools. (We will
    cover ETL tools in[Chapter 4](#A978-1-4842-1203-5_4_Chapter.html).) Programmers
    can access the application program interfaces (APIs) to load data into the Salesforce
    Analytics Cloud, and this has a more general data discovery capability; in essence,
    it can be considered an alternative to data discovery products offered by other
    vendors. The Wave Analytics Platform is the focus of this book, and all the use
    cases and examples illustrate how to create items from non-Salesforce data sources.


    There is a limit of 100 million total rows of data per user for this platform.
    Salesforce has bundled 24/7 support with the platform, along with unlimited free
    training and an assigned “success representative” to ensure customers have a good
    experience.


    ### Getting Started with Cloud Explorer


    Salesforce makes it relatively easy to try Wave, even if you are evaluating the
    Salesforce CRM on a trial basis. To sample Wave, you must create a permissions
    group with Wave Analytics privileges, and then assign this permission set to users.
    This procedure is detailed in Salesforce Wave online help, so we do not cover
    the steps here.


    #### Launching Cloud Explorer


    As soon as permission sets are in place, users can launch Wave Analytics from
    the Salesforce Applications menu in the upper right corner of the console. This
    is shown in Figure[2-1](#A978-1-4842-1203-5_2_Chapter.html#Fig1).


    ![A978-1-4842-1203-5_2_Fig1_HTML.jpg](A978-1-4842-1203-5_2_Fig1_HTML.jpg)


    Figure 2-1. Launching Cloud Explorer from the Salesforce console


    Once the Cloud Explorer starts, you’ll see the main screen and can begin using
    the features of this product. These possibilities are shown in Figure[2-2](#A978-1-4842-1203-5_2_Chapter.html#Fig2).


    ![A978-1-4842-1203-5_2_Fig2_HTML.jpg](A978-1-4842-1203-5_2_Fig2_HTML.jpg)


    Figure 2-2. Main screen for Cloud Explorer


    In the middle of the main screen is a box that allows you to search for objects
    by name. Below the search bar are tabs for the four major objects in Cloud Explorer:
    datasets, lens, dashboards, and apps.


    Datasets are created first. From datasets, lenses are created; the lenses are
    used to create views of data that are manipulated in the dashboard editor. Be
    aware that the views of the data will change if the underlying data changes. In
    the upper right corner of the main screen are two buttons, as shown in closeup
    view in Figure[2-3](#A978-1-4842-1203-5_2_Chapter.html#Fig3).


    ![A978-1-4842-1203-5_2_Fig3_HTML.jpg](A978-1-4842-1203-5_2_Fig3_HTML.jpg)


    Figure 2-3. Buttons from upper right corner of main Cloud Explorer screen


    The button on the left switches to a compact list view of all objects in Cloud
    Explorer; this list is useful for users with a large number of objects. The button
    also can be used to switch back to the thumbnail view.


    The button on the right is used to create datasets and apps, as shown in Figure[2-4](#A978-1-4842-1203-5_2_Chapter.html#Fig4).


    ![A978-1-4842-1203-5_2_Fig4_HTML.jpg](A978-1-4842-1203-5_2_Fig4_HTML.jpg)


    Figure 2-4. Create button for Cloud Explorer, used for apps or datasets


    Creating a dataset is the first step in using Cloud Explorer and in creating objects.
    When this button is pressed, you see the screen shown in Figure[2-5](#A978-1-4842-1203-5_2_Chapter.html#Fig5).


    ![A978-1-4842-1203-5_2_Fig5_HTML.jpg](A978-1-4842-1203-5_2_Fig5_HTML.jpg)


    Figure 2-5. Screen for creating a dataset


    We’ll talk more about actually creating a dataset in[Chapter 3](#A978-1-4842-1203-5_3_Chapter.html).
    For now, let’s move on to examine each of the objects types in Cloud Explorer.
    We begin with datasets.


    ### Datasets


    Datasets are the containers for data. All the data used in the Salesforce Analytics
    Cloud are kept in datasets. These datasets reside on a cloud-based server that
    operates behind the scenes to provide the data to the Cloud Explorer application.
    The Wave data server is key to performance; it is capable of quickly ingesting
    data that consists of thousands of rows—in mere minutes, as it happens. Once a
    dataset is created, Wave quickly performs the aggregations, filtering, sorting,
    and rending of that data in real time and supplies it to the Wave user interface.


    The data put into the Wave data server is stored in a “faceted” database, whose
    sole purpose is to support the rapid retrieval of data; above all, it is a responsive
    user interface. The data put into the Wave server cannot be accessed by any means
    other than the Wave user interface or APIs. That is, records cannot be modified
    in the data server. Actually, there are only three operations that can be performed
    on the Wave data server: creating a dataset, updating a dataset, and deleting
    a dataset.


    Also, data going into Wave has a “one-way ticket.” The Wave server is not intended
    to be of a general-purpose nature; there is really no practical way to run queries
    against the Wave data server in the same manner as you might with a conventional
    database server.


    #### Row-Level Security for Datasets


    Securing one’s data is always a concern regarding databases. Some records might
    be sensitive and should not be viewed by everyone, for instance. By default, users
    have access to all the data in a dataset, but Cloud Explorer has a capability
    for row-level security as a way of restricting access to some records.


    To implement row-level security, you define a predicate, or filter, for each dataset
    on which you want to limit access. We won’t cover security predicates in this
    chapter, but we will touch upon them in[Chapter 4](#A978-1-4842-1203-5_4_Chapter.html).


    ### Lenses


    Lenses are views of the data in datasets. Developing views is a multistep process
    performed within the Cloud Builder, and it is covered in[Chapter 3](#A978-1-4842-1203-5_3_Chapter.html).
    Once a lens is complete, it can be used alone or can be bundled into a dashboard.
    To better understand lenses, let’s cover the elements of views in some detail.'
  raw: '### The Two Versions of the Salesforce Analytics Cloud


    There are two versions of the Salesforce Analytics Cloud, each targeted to a different
    audience. Pricing is not being covered here, as prices are subject to change;
    you should contact your sales representative for answers to questions about pricing.
    The two versions are as follows.


    #### The Wave Analytics App


    This “lite” version of the Salesforce Analytics Cloud allows users to perform
    data exploration only on Salesforce data. It does not allow users to upload their
    own data to the Salesforce Analytics Cloud into datasets. This simpler version
    is intended for sales managers and individuals who only want to use the Salesforce
    Analytics Cloud with Salesforce data. It is billed as “ready to go” and is very
    easy to use.


    Users of this version are limited to total datasets of 25 million rows. They are,
    however, permitted to customize their dashboards and share data from Cloud Explorer
    to Salesforce chatter, or via email.


    #### The Wave Analytics Platform


    This version of the Salesforce Analytics Cloud essentially offers full use of
    the Salesforce Analytics Cloud. Users upload their own data into datasets using
    either `.csv` files or a wide array of other methods, including ETL tools. (We
    will cover ETL tools in [Chapter 4](#A978-1-4842-1203-5_4_Chapter.html).) Programmers
    can access the application program interfaces (APIs) to load data into the Salesforce
    Analytics Cloud, and this has a more general data discovery capability; in essence,
    it can be considered an alternative to data discovery products offered by other
    vendors. The Wave Analytics Platform is the focus of this book, and all the use
    cases and examples illustrate how to create items from non-Salesforce data sources.


    There is a limit of 100 million total rows of data per user for this platform.
    Salesforce has bundled 24/7 support with the platform, along with unlimited free
    training and an assigned “success representative” to ensure customers have a good
    experience.


