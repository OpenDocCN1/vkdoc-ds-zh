- fmt: '### Step 1. Connect to Source


    Most ETL packages boast connectivity to many hundreds of types of data sources.
    This step is to connect to one of those sources, and usually all that is needed
    is the hostname for the source, username, and password.


    ### Step 2. Extract Data


    The key to success in this step is having a developer or analyst who understands
    the source data and knows which tables or other entities to use. For this step
    to succeed, the step 1 username must have access or security privileges for the
    source tables or entities.


    ### Step 3. Sort, Filter, and Transform


    Most ETL packages provide graphic means to map source data to target columns,
    transform the data, and filter out ranges of values that are not needed. For the
    Salesforce Analytics Cloud, this is where you ensure the data types for each column
    are correct and you select the column names in the dataset.


    ### Step 4. Determine the Dataset


    You select the dataset in the Salesforce Analytics Cloud that is to receive the
    data. If the dataset does not exist, it will be created. In this step, you specify
    the write method for the data, which could include deleting existing data and
    then writing data or appending to an existing dataset.


    ### Step 5. Write the Dataset


    You write the data to the Salesforce Analytics Cloud. But before you do so, you
    authenticate into Salesforce. When the ETL tool has been authenticated, the ETL
    tool writes directly to the Salesforce Analytics Cloud. This step assumes that
    you are using an ETL tool with native support for the Salesforce Analytics Cloud.
    To ensure native support, select from one of the ETL vendors that supports the
    Salesforce Analytics Cloud. One of the easiest ways to find these vendors is on
    the dataset creation page of the Salesforce Analytics Cloud; this is shown in
    Figure [4-4](#A978-1-4842-1203-5_4_Chapter.html#Fig4).


    ![A978-1-4842-1203-5_4_Fig4_HTML.jpg](A978-1-4842-1203-5_4_Fig4_HTML.jpg)


    Figure 4-4.


    Partners listing on dataset creation page


    Of the companies shown in Figure [4-4](#A978-1-4842-1203-5_4_Chapter.html#Fig4),
    Informatica, Mulesoft, Jitterbit, Dell Boomi, Snaplogic, and Talend all have a
    strong ETL product line with a focus on this area of technology. IBM has a number
    of products that integrate with the Salesforce Analytics Cloud, above and beyond
    ETL tools.


    One of the advantages of the Salesforce Analytics Cloud is that Salesforce ensures
    its products are partnered with the products of other IT companies. Many of these
    partners have white papers, demo videos, and interactive websites that demonstrate
    how their products integrate with the Salesforce Analytics Cloud.


    ## Wave REST API


    As mentioned earlier, the Wave REST API is a tool for retrieving data from the
    Salesforce Analytics Cloud. As of this writing, the Wave REST API is a pilot project
    of Salesforce, not generally available to the public. Those interested in participating
    in the Wave REST API pilot program should contact Salesforce.


    You might be wondering about the acronym REST. It stands for "representational
    state transfer" and is a distributed computing standard method for exposing APIs
    on the World Wide Web. REST is gradually replacing an older distributed computing
    method known as SOAP.


    ## Conclusion


    This chapter presented two technologies for moving data from different sources
    outside of Salesforce into the Salesforce Analytics Cloud datasets. The first
    technology we looked at was the External Data API, primarily targeted at customer
    solution development. The second technology was the ETL tools that have native
    support for the Salesforce Analytics Cloud. ETL tools are the easiest path to
    getting your data into the Salesforce Analytics Cloud, but they require investment.
    Also, ETL tools require expertise to be used correctly, and this is also a consideration.


    We also looked at a technology for retrieving data from the Salesforce Analytics
    Cloud, the Wave REST API. Though not currently available to the general public,
    organizations can apply to participate in a pilot program.


    # Part II


    # 5. Critical Decision Making and the Salesforce Analytics Cloud


    > Without data, anyone who does anything is free to claim success. —Angus Deaton,
    The Great Escape


    In the preface to his 2015 book The Great Escape: Health, Wealth, and the Origins
    of Inequality, Nobel Prize–winning economist Angus Deaton notes that claiming
    success in the absence of supporting data is an all too common occurrence in our
    world today, and it often causes a lack of confidence in the agencies and institutions
    charged with maintaining and protecting the welfare of our society. To support
    the conclusions and statements in his book, Deaton always provides the data, the
    sources of that data, and a view of how credible (or incredible) those sources
    are.


    Using data to support decisions and reach conclusions is the foundation for critical
    decision making. Companies that make better, faster decisions—and act on them
    effectively—will almost always outpace their competitors. For making big, high-value
    choices, this fact is obvious. The critical decisions likely include introducing
    a new product or moving a manufacturing base to Asia, since these choices involve
    sizable resources and significant risk.


    Less obvious are decisions made week in and week out that are equally important
    but less dramatic. These types of decisions are most often operational, and they
    are made and executed by those on or near the frontline. The net effect of these
    equally important decisions can amount to spending or saving thousands or even
    millions of dollars. Yet we are in a data-rich era of information technology,
    in which we aim to capture as much information as possible and utilize analytics
    to facilitate this data-driven decision making. How do we meet this challenge?


    With so many decisions to be made, and a shortage of data scientists to perform
    the necessary analyses, there''s a trend toward using data-discovery products
    that enable everyday users—mere mortals—to perform data analysis. In this chapter,
    we focus on a use case to demonstrate how such tools can be used to make many
    of these day-to-day decisions. Our use case is a company that both manufactures
    glass itself and makes various products from that glass.'
