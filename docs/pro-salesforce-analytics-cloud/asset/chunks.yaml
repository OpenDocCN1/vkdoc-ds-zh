    bar charts. The stacked bar charts are for Sales Territory-Region, Product Line,
    and Product Category. This dashboard is titled “First Quarter Growth Study,” and
    it is shown in Figure [6-16](#A978-1-4842-1203-5_6_Chapter.html#Fig16).


    ![A978-1-4842-1203-5_6_Fig16_HTML.jpg](A978-1-4842-1203-5_6_Fig16_HTML.jpg)


    Figure 6-16.


    First Quarter Growth Study


    The upper left bar chart shows the sales growth for the first quarters over a
    period of three years, and this is information we saw on the Sales Performance
    dashboard (Figure [6-15](#A978-1-4842-1203-5_6_Chapter.html#Fig15)). The other
    three stacked bar charts have segments based on region in the upper right, product
    line in the lower left, and product category in the lower right. To examine each
    of these stacked bar charts, we press the icon in the upper right corner of the
    chart with four outward-directed arrows. The upper right bar chart, for Sales
    Territory- Region, is shown in Figure [6-17](#A978-1-4842-1203-5_6_Chapter.html#Fig17).


    ![A978-1-4842-1203-5_6_Fig17_HTML.jpg](A978-1-4842-1203-5_6_Fig17_HTML.jpg)


    Figure 6-17.


    Sales Territory-Region, Quarter 1, stacked bar chart


    From this bar chart it would appear that the Southwest region has seen steady
    growth over three years. It is easy to switch to another chart type, and sometimes
    there is an advantage to doing this. In this case, when we change to a line chart,
    the story behind the numbers is more obvious, with the line for the Southwest
    increasing steadily over the period—clearly the best performing region, as shown
    in Figure [6-18](#A978-1-4842-1203-5_6_Chapter.html#Fig18).


    ![A978-1-4842-1203-5_6_Fig18_HTML.jpg](A978-1-4842-1203-5_6_Fig18_HTML.jpg)


    Figure 6-18.


    Sales Territory-Region, Quarter 1, line chart


    For the other two bar charts, we also see interesting trends. Figure [6-19](#A978-1-4842-1203-5_6_Chapter.html#Fig19)
    shows the stacked bar chart for Product Line.


    ![A978-1-4842-1203-5_6_Fig19_HTML.jpg](A978-1-4842-1203-5_6_Fig19_HTML.jpg)


    Figure 6-19.


    Product Line, Quarter 1, stacked bar chart


    In figure [6-19](#A978-1-4842-1203-5_6_Chapter.html#Fig19), we see that the mountain
    bike line experienced declining sales, and the road bike line experienced a surge
    in 2014, only to decline in 2015\. The touring line, introduced in 2015, helped
    to maintain sales and offset the decline in mountain and road bike sales.


    The last stacked bar chart is for Product Category, and is shown in Figure [6-20](#A978-1-4842-1203-5_6_Chapter.html#Fig20).
    The company saw growth in all areas, with bikes and components seeing the most
    growth.


    ![A978-1-4842-1203-5_6_Fig20_HTML.jpg](A978-1-4842-1203-5_6_Fig20_HTML.jpg)


    Figure 6-20.


    Product Line, Quarter 1, stacked bar chart


    The four bar charts shown in Figure [6-16](#A978-1-4842-1203-5_6_Chapter.html#Fig16)
    were developed in a matter of minutes on an iPad, and they immediately revealed
    insights into the growth trends underlying the first quarter sales. From examining
    all the charts, we were able to conclude that the Southwestern United States was
    the strongest-performing region, and the introduction of the touring product line
    in 2015 helped to offset declines in the road bike line that had surged in 2014.


