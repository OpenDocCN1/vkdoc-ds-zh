    Sky condition toggle widget   Go back to the lens tab (Figure [3-9](#A978-1-4842-1203-5_3_Chapter.html#Fig9)
    ), click on “Condition: Sky” grouping and replace it with “When: Time of Day”
    dimension. This is done by removing the “Condition: Sky” grouping. Hover over
    the grouping, and click the “x” in the upper right corner of the grouping. Then
    click the “+Group” button and add “When: Time of Day.”


    ![A978-1-4842-1203-5_3_Fig9_HTML.jpg](A978-1-4842-1203-5_3_Fig9_HTML.jpg)


    Figure 3-9.


    Lens group by time of day   Repeat steps 3 and 4 to clip the new lens “When_Time_of_Day_2”
    into the designer. Add it to a new Toggle widget to the right of the first Toggle
    button. Note that newly clipped lenses are always at the top of the lens stack
    shown on the left side of the dashboard designer.   Go back to the lens tab, click
    on the grouping button and replace it with “Wildlife: Size.” Change the visualization
    type to a donut chart (see Figure [3-10](#A978-1-4842-1203-5_3_Chapter.html#Fig10)
    ).


    ![A978-1-4842-1203-5_3_Fig10_HTML.jpg](A978-1-4842-1203-5_3_Fig10_HTML.jpg)


    Figure 3-10.


    Lens chart for wildlife size   Repeat steps 3 and 4 to clip the lens into dashboard
    designer. Choose a “Chart” widget type this time and place it under the “Condition:
    Sky” toggle button.   Repeat steps 7 and 8 to create another donut chart to display
    “Wildlife: Species” breakdown. Define filters to exclude “unknown” types of animal
    species. To create the exclude filter, click on filter “Wildlife: Species”, and
    scroll to the bottom of the list. You will see “more” at the bottom of the list.
    Click on more to list more species. Scroll to the bottom of the list again, and
    click more. Repeat scrolling and clicking more, until you are at the end of the
    list. At the top of the filter this is a control that is used to select “All”
    items. Click this, to select all species. Scroll to the species and deselect all
    items that begin with “unknown.” This is shown in Figure [3-11](#A978-1-4842-1203-5_3_Chapter.html#Fig11)
    .


