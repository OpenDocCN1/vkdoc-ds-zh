- fmt: '### Measures


    The Salesforce Analytics Cloud is oriented toward performing analytics on numeric
    data. Measures, then, are numeric data that can be aggregated. To get started
    creating a lens, you first select a measure of interest from your datasets, along
    with an aggregation. The available aggregations for measures are sum, average,
    maximum value, minimum value, and unique values. You also have the ability to
    create a measure based on record count for any measure or dimension.


    Measures are created in lenses with the `+Measure` button, as shown in Figure
    [2-6](#A978-1-4842-1203-5_2_Chapter.html#Fig6). To create the measure, the user
    selects a measure from the dataset and one of the aggregations.


    ![A978-1-4842-1203-5_2_Fig6_HTML.jpg](A978-1-4842-1203-5_2_Fig6_HTML.jpg)


    Figure 2-6.


    Adding a measure to a lens


    When at least one measure has been selected, you can add dimensions to that lens.
    Dimensions are covered in the next section.


    ### Dimensions


    Dimensions are qualities of the measures; they provide a means for refining and
    grouping the measures. Dimensions can consist of text or numeric data. When a
    dataset is created, Cloud Builder will designate all purely numeric columns as
    measures, but it is possible to change these to dimensions. When a column has
    been designated as a dimension, it cannot be changed back to a measure, however.
    Because of this irrevocability, if you want to use a column as both a dimension
    and a measure, you need to duplicate the column and designate one as a dimension
    and one as a measure.


    To apply a dimension to a lens, you use the `+Group` button, as shown in Figure
    [2-7](#A978-1-4842-1203-5_2_Chapter.html#Fig7).


    ![A978-1-4842-1203-5_2_Fig7_HTML.jpg](A978-1-4842-1203-5_2_Fig7_HTML.jpg)


    Figure 2-7.


    Adding a dimension to a lens


    When dimensions are added to a lens, you can specify a filter by clicking on the
    Filter button on the right side of the selector message box. Cloud Builder shows
    the possible values for the filter. For example, a month number filter is shown
    in Figure [2-8](#A978-1-4842-1203-5_2_Chapter.html#Fig8), with months 1 and 2
    (January and February) selected.


    ![A978-1-4842-1203-5_2_Fig8_HTML.jpg](A978-1-4842-1203-5_2_Fig8_HTML.jpg)


    Figure 2-8.


    Add a month dimension to a lens


    ### Dates


    Dates are used in a manner similar to dimensions when creating lenses. However,
    dates are a special data type in Cloud Explorer. When you select a date to use
    in grouping your data, you can select a level of granularity. This is illustrated
    in Figure [2-9](#A978-1-4842-1203-5_2_Chapter.html#Fig9).


    ![A978-1-4842-1203-5_2_Fig9_HTML.jpg](A978-1-4842-1203-5_2_Fig9_HTML.jpg)


    Figure 2-9.


    Selecting date options for a lens


    ### Bringing It All Together


    Now let’s look at an example of a graphic presentation as it is created in Cloud
    Builder. The dataset used to build this example graphic is a list of all nuclear
    power plants in the United States, gathered from a publicly available source.
    We have chosen the horizontal bar chart, one of the most common graphic presentations.
    There are two dimensions to the bar chart. The first is the date that the construction
    permit was issued for the plant to be built. This dataset contains the full date,
    but for purposes of illustration we have selected just the month and year, indicated
    by the first three characters of the dimension. There are two three-character
    values: `pwr` for pressurized water reactor and `bwr` for boiling water reactor.
    The measure we have chosen is `Licensed Mwt`, which indicates the total output
    power of the power plant in megaWatts. This finished bar chart is shown in Figure
    [2-10](#A978-1-4842-1203-5_2_Chapter.html#Fig10).


    ![A978-1-4842-1203-5_2_Fig10_HTML.jpg](A978-1-4842-1203-5_2_Fig10_HTML.jpg)


    Figure 2-10.


    Options for presenting data on nuclear power plants


    If you want to see only the plants that have pressurized water reactors (`pwr`),
    you can apply a filter to the Reactor and Containment type, as shown in Figure
    [2-11](#A978-1-4842-1203-5_2_Chapter.html#Fig11).


    ![A978-1-4842-1203-5_2_Fig11_HTML.jpg](A978-1-4842-1203-5_2_Fig11_HTML.jpg)


    Figure 2-11.


    Filter applied to dimension for reactor type


    Now, the graphic will display only a listing of plants with `pwr` as their dimension,
    shown in Figure [2-12](#A978-1-4842-1203-5_2_Chapter.html#Fig12).


    ![A978-1-4842-1203-5_2_Fig12_HTML.jpg](A978-1-4842-1203-5_2_Fig12_HTML.jpg)


    Figure 2-12.


    Presentation of data with filter applied for reactor type


    ### Learn by Doing


    Remember the quote from Confucius at the start of this chapter, advising us to
    be “doers”? Wave makes it easy to experiment with graph types in a lens, and it
    is instructive to experiment with these types to find the one that best suits
    your needs. There are also table types, including a raw dump of data, comparison
    tables, and pivot tables. An example of the comparison table is shown in Figure
    [2-13](#A978-1-4842-1203-5_2_Chapter.html#Fig13). This presentation allows you
    to change the column names so different measures can be shown together, one as
    values and one as a graph.


    ![A978-1-4842-1203-5_2_Fig13_HTML.jpg](A978-1-4842-1203-5_2_Fig13_HTML.jpg)


    Figure 2-13.


    Comparison table


    ### Lens Modification History, Undo, and Replay


    While you are experimenting with a lens, you can always undo your changes or view
    the history of your modifications to a lens by using the buttons in the upper
    left of the Cloud Builder screen. For instance, Figure [2-14](#A978-1-4842-1203-5_2_Chapter.html#Fig14)
    shows the History, Backward, and Forward buttons. Notice that there is a list
    of all the changes made when you press the History button, and a thumbnail shows
    the version of the lens associated with the change if you locate your cursor over
    one of the history items.


    ![A978-1-4842-1203-5_2_Fig14_HTML.jpg](A978-1-4842-1203-5_2_Fig14_HTML.jpg)


    Figure 2-14.


    Backward, Forward, and History buttons, as well as the lens history thumbnail


    ### Exploring the Data


    When you are using a lens, be aware that you can usually click on any value in
    a chart to reveal a submenu labeled `Drill Into This By…`. With this feature,
    as shown in Figure [2-15](#A978-1-4842-1203-5_2_Chapter.html#Fig15), you can select
    another dimension and further refine your data. Clicking any of the dimensions
    opens a new version of the lens. Of course, you can return to the prior version
    by using the Backward button, as mentioned earlier.


    ![A978-1-4842-1203-5_2_Fig15_HTML.jpg](A978-1-4842-1203-5_2_Fig15_HTML.jpg)


    Figure 2-15.


    Data exploration using the `Drill Into This By…` screen


    ### Mobile Lens Creation


    You can create lenses on the iPhone and iPad applications, with capabilities similar
    to those of the desktop client. This includes the ability to drill into data.
    [Chapter 6](#A978-1-4842-1203-5_6_Chapter.html) features a use case that shows
    how to exploit the mobile capabilities of the Salesforce Analytics Cloud.


    ## Dashboards


    Cloud Explorer’s dashboards enable you to combine multiple graphs or other visualizations
    of data into a single view. The dashboards include a grid editor focused on aesthetics,
    thereby enabling you to make presentations that are visually appealing and useful
    in presentations to customers.


    You can also use the dashboards to facilitate any exploration of data. When you
    make a selection on a widget of a dashboard, it enables you to refine the data,
    and this change is reflected on all other dashboard widgets. This feature is demonstrated
    at several points in this book, so you’ll be able to see this feature in action.
    Now let’s examine some of the widgets that are available on the dashboards.'
  raw: '### Measures


    The Salesforce Analytics Cloud is oriented toward performing analytics on numeric
    data. Measures, then, are numeric data that can be aggregated. To get started
    creating a lens, you first select a measure of interest from your datasets, along
    with an aggregation. The available aggregations for measures are sum, average,
    maximum value, minimum value, and unique values. You also have the ability to
    create a measure based on record count for any measure or dimension.


    Measures are created in lenses with the +Measure button, as shown in Figure [2-6](#A978-1-4842-1203-5_2_Chapter.html#Fig6).
    To create the measure, the user selects a measure from the dataset and one of
    the aggregations.


    ![A978-1-4842-1203-5_2_Fig6_HTML.jpg](A978-1-4842-1203-5_2_Fig6_HTML.jpg)


    Figure 2-6.


    Adding a measure to a lens


    When at least one measure has been selected, you can add dimensions to that lens.
    Dimensions are covered in the next section.


    ### Dimensions


    Dimensions are qualities of the measures; they provide a means for refining and
    grouping the measures. Dimensions can consist of text or numeric data. When a
    dataset is created, Cloud Builder will designate all purely numeric columns as
    measures, but it is possible to change these to dimensions. When a column has
    been designated as a dimension, it cannot be changed back to a measure, however.
    Because of this irrevocability, if you want to use a column as both a dimension
    and a measure, you need to duplicate the column and designate one as a dimension
    and one as a measure.


    To apply a dimension to a lens, you use the +Group button, as shown in Figure
    [2-7](#A978-1-4842-1203-5_2_Chapter.html#Fig7).


    ![A978-1-4842-1203-5_2_Fig7_HTML.jpg](A978-1-4842-1203-5_2_Fig7_HTML.jpg)


    Figure 2-7.


    Adding a dimension to a lens


    When dimensions are added to a lens, you can specify a filter by clicking on the
    Filter button on the right side of the selector message box. Cloud Builder shows
    the possible values for the filter. For example, a month number filter is shown
    in Figure [2-8](#A978-1-4842-1203-5_2_Chapter.html#Fig8), with months 1 and 2
    (January and February) selected.


    ![A978-1-4842-1203-5_2_Fig8_HTML.jpg](A978-1-4842-1203-5_2_Fig8_HTML.jpg)


    Figure 2-8.


    Add a month dimension to a lens


    ### Dates


    Dates are used in a manner similar to dimensions when creating lenses. However,
    dates are a special data type in Cloud Explorer. When you select a date to use
    in grouping your data, you can select a level of granularity. This is illustrated
    in Figure [2-9](#A978-1-4842-1203-5_2_Chapter.html#Fig9).


    ![A978-1-4842-1203-5_2_Fig9_HTML.jpg](A978-1-4842-1203-5_2_Fig9_HTML.jpg)


    Figure 2-9.


    Selecting date options for a lens


    ### Bringing It All Together


    Now let’s look at an example of a graphic presentation as it is created in Cloud
    Builder. The dataset used to build this example graphic is a list of all nuclear
    power plants in the United States, gathered from a publicly available source.
    We have chosen the horizontal bar chart, one of the most common graphic presentations.
    There are two dimensions to the bar chart. The first is the date that the construction
    permit was issued for the plant to be built. This dataset contains the full date,
    but for purposes of illustration we have selected just the month and year, indicated
    by the first three characters of the dimension. There are two three-character
    values: “pwr” for pressurized water reactor and “bwr” for boiling water reactor.
    The measure we have chosen is “Licensed Mwt,” which indicates the total output
    power of the power plant in megaWatts. This finished bar chart is shown in Figure
    [2-10](#A978-1-4842-1203-5_2_Chapter.html#Fig10).


    ![A978-1-4842-1203-5_2_Fig10_HTML.jpg](A978-1-4842-1203-5_2_Fig10_HTML.jpg)


    Figure 2-10.


    Options for presenting data on nuclear power plants


    If you want to see only the plants that have pressurized water reactors (“pwr”),
    you can apply a filter to the Reactor and Containment type, as shown in Figure
    [2-11](#A978-1-4842-1203-5_2_Chapter.html#Fig11).


    ![A978-1-4842-1203-5_2_Fig11_HTML.jpg](A978-1-4842-1203-5_2_Fig11_HTML.jpg)


    Figure 2-11.


    Filter applied to dimension for reactor type


    Now, the graphic will display only a listing of plants with “pwr” as their dimension,
    shown in Figure [2-12](#A978-1-4842-1203-5_2_Chapter.html#Fig12).


    ![A978-1-4842-1203-5_2_Fig12_HTML.jpg](A978-1-4842-1203-5_2_Fig12_HTML.jpg)


    Figure 2-12.


    Presentation of data with filter applied for reactor type


    ### Learn by Doing


    Remember the quote from Confucius at the start of this chapter, advising us to
    be “doers”? Wave makes it easy to experiment with graph types in a lens, and it
    is instructive to experiment with these types to find the one that best suits
    your needs. There are also table types, including a raw dump of data, comparison
    tables, and pivot tables. An example of the comparison table is shown in Figure
    [2-13](#A978-1-4842-1203-5_2_Chapter.html#Fig13). This presentation allows you
    to change the column names so different measures can be shown together, one as
    values and one as a graph.


    ![A978-1-4842-1203-5_2_Fig13_HTML.jpg](A978-1-4842-1203-5_2_Fig13_HTML.jpg)


    Figure 2-13.


    Comparison table


    ### Lens Modification History, Undo, and Replay


    While you are experimenting with a lens, you can always undo your changes or view
    the history of your modifications to a lens by using the buttons in the upper
    left of the Cloud Builder screen. For instance, Figure [2-14](#A978-1-4842-1203-5_2_Chapter.html#Fig14)
    shows the History, Backward, and Forward buttons. Notice that there is a list
    of all the changes made when you press the History button, and a thumbnail shows
    the version of the lens associated with the change if you locate your cursor over
    one of the history items.


    ![A978-1-4842-1203-5_2_Fig14_HTML.jpg](A978-1-4842-1203-5_2_Fig14_HTML.jpg)


    Figure 2-14.


    Backward, Forward, and History buttons, as well as the lens history thumbnail


    ### Exploring the Data


    When you are using a lens, be aware that you can usually click on any value in
    a chart to reveal a submenu labeled “Drill Into This By….” With this feature,
    as shown in Figure [2-15](#A978-1-4842-1203-5_2_Chapter.html#Fig15), you can select
    another dimension and further refine your data. Clicking any of the dimensions
    opens a new version of the lens. Of course, you can return to the prior version
    by using the Backward button, as mentioned earlier.


    ![A978-1-4842-1203-5_2_Fig15_HTML.jpg](A978-1-4842-1203-5_2_Fig15_HTML.jpg)


    Figure 2-15.


    Data exploration using the “Drill Into This By…” screen


    ### Mobile Lens Creation


    You can create lenses on the iPhone and iPad applications, with capabilities similar
    to those of the desktop client. This includes the ability to drill into data.
    [Chapter 6](#A978-1-4842-1203-5_6_Chapter.html) features a use case that shows
    how to exploit the mobile capabilities of the Salesforce Analytics Cloud.


    ## Dashboards


    Cloud Explorer’s dashboards enable you to combine multiple graphs or other visualizations
    of data into a single view. The dashboards include a grid editor focused on aesthetics,
    thereby enabling you to make presentations that are visually appealing and useful
    in presentations to customers.


    You can also use the dashboards to facilitate any exploration of data. When you
    make a selection on a widget of a dashboard, it enables you to refine the data,
    and this change is reflected on all other dashboard widgets. This feature is demonstrated
    at several points in this book, so you’ll be able to see this feature in action.
    Now let’s examine some of the widgets that are available on the dashboards.'
  trans: '

    ### 度量


    Salesforce Analytics Cloud 主要针对数值数据执行分析。因此，**度量**（Measures）是可聚合的数值数据。要开始创建透镜，您首先需要从数据集中选择一个感兴趣的度量，并同时选择一种聚合方式。度量可用的聚合方式包括：求和、平均值、最大值、最小值和唯一值。您还可以根据任何度量或维度的**记录计数**来创建度量。


    度量是通过透镜中的 `+Measure` 按钮创建的，如图 2-6 所示。创建度量时，用户需从数据集中选择一个度量，并指定一种聚合方式。


    ![A978-1-4842-1203-5_2_Fig6_HTML.jpg](img/A978-1-4842-1203-5_2_Fig6_HTML.jpg)


    图 2-6.


    向透镜添加度量


    当至少选中一个度量后，您就可以向该透镜添加维度了。维度将在下一节中介绍。


    ### 维度


    维度是度量的属性；它们提供了一种细化和分组度量的方法。维度可以由文本或数值数据组成。创建数据集时，Cloud Builder 会将所有纯数值列指定为度量，但您可以将其更改为维度。不过，当一个列被指定为维度后，就无法再改回度量。由于这种不可逆性，如果您希望将同一列同时用作维度和度量，则需要复制该列，并将其一个副本指定为维度，另一个指定为度量。


    要将维度应用于透镜，请使用 `+Group` 按钮，如图 2-7 所示。


    ![A978-1-4842-1203-5_2_Fig7_HTML.jpg](img/A978-1-4842-1203-5_2_Fig7_HTML.jpg)


    图 2-7.


    向透镜添加维度


    当维度被添加到透镜后，您可以通过点击选择器消息框右侧的“筛选器”按钮来指定一个筛选条件。Cloud Builder 会显示该筛选器可能的取值。例如，图 2-8
    展示了一个月份数字筛选器，其中选中了月份 1 和 2（一月和二月）。


    ![A978-1-4842-1203-5_2_Fig8_HTML.jpg](img/A978-1-4842-1203-5_2_Fig8_HTML.jpg)


    图 2-8.


    向透镜添加月份维度


    ### 日期


    在创建透镜时，日期的使用方式与维度类似。然而，日期是 Cloud Explorer 中的一种特殊数据类型。当您选择一个日期用于数据分组时，可以选择一个粒度级别。如图
    2-9 所示。


    ![A978-1-4842-1203-5_2_Fig9_HTML.jpg](img/A978-1-4842-1203-5_2_Fig9_HTML.jpg)


    图 2-9.


    为透镜选择日期选项


    ### 综合运用


    现在，让我们看一个在 Cloud Builder 中创建图表演示文稿的示例。用于构建此示例图形的数据集是从公开来源收集的美国所有核电站列表。我们选择了**水平条形图**，这是最常见的图表演示类型之一。该条形图有两个维度。第一个是核电站建设许可证的**签发日期**。此数据集包含完整日期，但出于演示目的，我们只选择了月份和年份，由维度的前三个字符表示。还有两个三字符值：`pwr`
    代表压水反应堆，`bwr` 代表沸水反应堆。我们选择的度量是 `Licensed Mwt`，它表示核电站的总输出功率（单位是兆瓦）。这个完成的条形图如图 2-10
    所示。


    ![A978-1-4842-1203-5_2_Fig10_HTML.jpg](img/A978-1-4842-1203-5_2_Fig10_HTML.jpg)


    图 2-10.


    展示核电站数据的选项


    如果您只想查看拥有压水反应堆（`pwr`）的电站，可以对“反应堆和安全壳类型”应用一个筛选器，如图 2-11 所示。


    ![A978-1-4842-1203-5_2_Fig11_HTML.jpg](img/A978-1-4842-1203-5_2_Fig11_HTML.jpg)


    图 2-11.


    对反应堆类型维度应用筛选器


    现在，图形将只显示维度为 `pwr` 的电站列表，如图 2-12 所示。


    ![A978-1-4842-1203-5_2_Fig12_HTML.jpg](img/A978-1-4842-1203-5_2_Fig12_HTML.jpg)


    图 2-12.


    应用反应堆类型筛选器后的数据展示


    ### 边做边学


    还记得本章开头那句引用的孔子箴言，告诫我们要做“践行者”吗？ Wave 使得在透镜中尝试不同的图表类型变得非常容易，并且通过实验找到最适合您需求的图表类型是很有启发性的。还有表格类型，包括原始数据转储、对比表格和数据透视表。图
    2-13 展示了一个对比表格的示例。这种展示方式允许您更改列名，从而可以将不同的度量放在一起显示，一个作为数值，一个作为图形。


    ![A978-1-4842-1203-5_2_Fig13_HTML.jpg](img/A978-1-4842-1203-5_2_Fig13_HTML.jpg)


    图 2-13.


    对比表格


    ### 透镜修改历史、撤销和重放


    在您试用透镜时，可以通过使用 Cloud Builder 屏幕左上角的按钮来随时撤销您的更改或查看透镜的修改历史。例如，图 2-14 显示了“历史”、“后退”和“前进”按钮。请注意，当您按下“历史”按钮时，会列出所有已进行的更改；如果将光标悬停在某个历史记录项上，则会显示与该更改关联的透镜版本的缩略图。


    ![A978-1-4842-1203-5_2_Fig14_HTML.jpg](img/A978-1-4842-1203-5_2_Fig14_HTML.jpg)


    图 2-14.


    前进、后退和历史按钮，以及透镜历史缩略图


    ### 探索数据


    当您使用透镜时，请注意您通常可以点击图表中的任何值，以显示一个标记为 `Drill Into This By…` 的**子菜单**。利用此功能，如图 2-15
    所示，您可以选择另一个维度，从而进一步细化您的数据。点击任何一个维度都会打开透镜的一个新版本。当然，您可以使用前面提到的“后退”按钮返回到先前版本。


    ![A978-1-4842-1203-5_2_Fig15_HTML.jpg](img/A978-1-4842-1203-5_2_Fig15_HTML.jpg)


    图 2-15.


    使用 `Drill Into This By…` 屏幕进行数据探索


    ### 移动端透镜创建


    您可以在 iPhone 和 iPad 应用程序上创建透镜，其功能与桌面客户端类似。这包括深入探索数据的能力。第 6 章 将展示一个利用 Salesforce
    Analytics Cloud 移动端功能的用例。


    ## 仪表板


    Cloud Explorer 的仪表板使您能够将多个图形或其他数据可视化内容组合到单个视图中。仪表板包含一个专注于美学的**网格编辑器**，从而使您能够制作视觉上吸引人且在对客户演示中有用的展示文稿。


    您还可以使用仪表板来促进任何数据探索。当您在仪表板的某个小组件上做出选择时，它会允许您细化数据，并且此更改会反映在所有其他仪表板小组件上。本书将在多个地方演示此功能，因此您将能够看到它的实际应用。现在，让我们来看看仪表板上可用的一些小组件。

    '
- fmt: '### Widgets


    By way of explanation, widgets of various types are the tools of a dashboard.
    Figure [2-16](#A978-1-4842-1203-5_2_Chapter.html#Fig16) shows the widgets that
    can be found in Cloud Builder.


    ![A978-1-4842-1203-5_2_Fig16_HTML.jpg](A978-1-4842-1203-5_2_Fig16_HTML.jpg)


    Figure 2-16. Widgets available in Cloud Builder


    There are three basic types of widgets: those for data display, for selector choice,
    and for display.


    ### Data Display Widgets


    These widgets are all used to display data that originates in a lens. They have
    differing capabilities based on their purpose, so some widgets work with many
    measures while others work with only one measure.


    #### Chart Widget


    The chart widget has the same array of chart types as are available when you build
    lenses. You can change the chart type at any time when you are building a dashboard,
    so you are not restricted to the chart type used to build the lens.


    When you select a widget, a properties window appears on the right side of the
    Cloud Builder screen. There is a default property labeled `"faceted"`. If you
    de-select `"faceted"` for a widget, the data on the widget will not change as
    you apply any refinements with other widgets. The faceted property is shown in
    Figure [2-17](#A978-1-4842-1203-5_2_Chapter.html#Fig17).


    ![A978-1-4842-1203-5_2_Fig17_HTML.jpg](A978-1-4842-1203-5_2_Fig17_HTML.jpg)


    Figure 2-17. The faceted property is selected by default


    #### Raw Data Widget


    As its name implies, this widget allows you to view a spreadsheet-style table
    of data from a lens. You can remove columns as desired, change the position of
    the columns, and sort the table with data from a column. To use the raw data widget
    in a dashboard, you must first create a lens with the raw data widget.


    #### Compare Table Widget


    An example of a comparison table was shown in Figure [2-13](#A978-1-4842-1203-5_2_Chapter.html#Fig13).
    Be aware that the comparison table has the same requirement as the raw data widget.
    You must first create a compare data widget in a lens before it can be used in
    a dashboard.


    #### Number Widget


    The number widget is used to display a single value on a dashboard. To use the
    number widget, you must create a lens with a measure and aggregation, and with
    no groups or dimensions applied. Numbers are useful to display summary data like
    total sales or some other grand total.


    #### Toggle Widget


    The toggle widget is both a selector for a dimension and a display widget for
    a measure. It can be used to apply a refinement to a dimension, and it can also
    display aggregated data associated with the dimension. The toggle widget is one
    of the most versatile and powerful widgets, used extensively in the examples given
    in this book.


    ### Selector Widgets


    The following widgets provide intuitive methods to refine data, based on the data
    type.


    #### Date Widget


    Date widgets are used to select a date range, and they must be used with date
    data from a lens. The date widget is a powerful selection tool because it allows
    many different ways to select a date, as can be seen in Figure [2-18](#A978-1-4842-1203-5_2_Chapter.html#Fig18),
    including by quarter, month, or week.


    ![A978-1-4842-1203-5_2_Fig18_HTML.jpg](A978-1-4842-1203-5_2_Fig18_HTML.jpg)


    Figure 2-18. Date Widget


    #### Range Widget


    The range widget is shown in Figure [2-19](#A978-1-4842-1203-5_2_Chapter.html#Fig19).
    It is used to select a numeric range to refine a measure. To use the range widget,
    you must create a lens with a measure and aggregation, and no groups or dimensions
    applied.


    ![A978-1-4842-1203-5_2_Fig19_HTML.jpg](A978-1-4842-1203-5_2_Fig19_HTML.jpg)


    Figure 2-19. Range widget


    ### Display Widgets


    These widgets are for display only and can only be modified at design time.


    #### Scope Widget


    The scope widget displays filters applied on lens data. It does not allow filter
    criteria to be changed, and is only a display mechanism. Figure [2-20](#A978-1-4842-1203-5_2_Chapter.html#Fig20)
    shows the scope widget, with a filter applied to date data to select quarter 1,
    and a filter applied to a region dimension to select only the United States and
    Canada.


    ![A978-1-4842-1203-5_2_Fig20_HTML.jpg](A978-1-4842-1203-5_2_Fig20_HTML.jpg)


    Figure 2-20. Scope widget


    #### Text Widget


    The text widget allows you to add a title to a dashboard, instructions, or comments
    on the data. You can use this widget to change the font size and the text color.


    #### Box Widget


    The box widget allows you to add a shaded area to a dashboard and to visually
    group widgets together, or to highlight some aspect of the dashboard.


    ### The Dashboard Development Cycle


    All dashboards are built on lens data, and you must first develop a lens to produce
    a view of the data before it can be used by a dashboard widget. This workflow
    is demonstrated in [Chapter 3](#A978-1-4842-1203-5_3_Chapter.html), but we will
    quickly summarize it here.


    When you have found your data in Cloud Builder, you use the button in the upper
    right corner of the Cloud Builder screen to `"clip"` the data and make it available
    to a dashboard. This button is shown in Figure [2-21](#A978-1-4842-1203-5_2_Chapter.html#Fig21).


    ![A978-1-4842-1203-5_2_Fig21_HTML.jpg](A978-1-4842-1203-5_2_Fig21_HTML.jpg)


    Figure 2-21. The Clip and Save buttons


    Note that both the dashboard and the lens builders have a `Save` button. You should
    use it frequently to save your changes to your dashboards or lenses. Be aware
    that changes in Cloud Builder are not automatically saved, so if you do not use
    the `Save` button frequently, you could lose work. Also, be aware that saving
    a lens only saves the query associated with the lens; it does not preserve a snapshot
    of the data.


    Once you have clipped your lens, you proceed to the dashboard editor to use the
    lens data. When you clip a lens, if a dashboard associated with the lens does
    not already exist, then a new dashboard will be created. You can view all of the
    lens data in a dashboard with the control on the left side of the dashboard, as
    shown in Figure [2-22](#A978-1-4842-1203-5_2_Chapter.html#Fig22). From this control,
    you can delete any lens data that is not used by a widget, and you can select
    the lens data to be used by a widget.


    ![A978-1-4842-1203-5_2_Fig22_HTML.jpg](A978-1-4842-1203-5_2_Fig22_HTML.jpg)


    Figure 2-22. Lens data browser in dashboard builder


    To use the lens data, select a widget from tool bar; it will appear on the dashboard
    builder. Lenses whose data can be used with the widget will be highlighted in
    the lens data browser. You select the lens whose data you would like to use and
    drag it to the widget. This is illustrated in Figure [2-23](#A978-1-4842-1203-5_2_Chapter.html#Fig23)
    and is also described in more detail in [Chapter 3](#A978-1-4842-1203-5_3_Chapter.html).


    ![A978-1-4842-1203-5_2_Fig23_HTML.jpg](A978-1-4842-1203-5_2_Fig23_HTML.jpg)


    Figure 2-23. Associating the lens data with a widget


    ### Link Back to Lens


    On dashboards, widgets have a button that allows you to link back to the lens
    used with the widget. This button is shown in Figure [2-24](#A978-1-4842-1203-5_2_Chapter.html#Fig24).
    Clicking this button immediately opens the lens for review. It is a useful tool
    when creating a new lens, based on the same lens used in a dashboard.


    ![A978-1-4842-1203-5_2_Fig24_HTML.jpg](A978-1-4842-1203-5_2_Fig24_HTML.jpg)


    Figure 2-24. Lens button for reviewing previous lens


    You can disable the `Lens` button, and there are several reasons for doing so.
    For example, you may want to prevent users from inadvertently clicking it or from
    perusing the lens data. The disable attribute for the `Lens` button is shown in
    Figure [2-25](#A978-1-4842-1203-5_2_Chapter.html#Fig25).


    ![A978-1-4842-1203-5_2_Fig25_HTML.jpg](A978-1-4842-1203-5_2_Fig25_HTML.jpg)


    Figure 2-25. Enable/disable Lens button


    You may have noticed the button with an `"i"` in Figure [2-23](#A978-1-4842-1203-5_2_Chapter.html#Fig23).
    You use this button to display information about the lens for a widget.'
  raw: '### Widgets


    By way of explanation, widgets of various types are the tools of a dashboard.
    Figure [2-16](#A978-1-4842-1203-5_2_Chapter.html#Fig16) shows the widgets that
    can be found in Cloud Builder.


    ![A978-1-4842-1203-5_2_Fig16_HTML.jpg](A978-1-4842-1203-5_2_Fig16_HTML.jpg)


    Figure 2-16.


    Widgets available in Cloud Builder


    There are three basic types of widgets: those for data display, for selector choice,
    and for display.


    ### Data Display Widgets


    These widgets are all used to display data that originates in a lens. They have
    differing capabilities based on their purpose, so some widgets work with many
    measures while others work with only one measure.


    #### Chart Widget


    The chart widget has the same array of chart types as are available when you build
    lenses. You can change the chart type at any time when you are building a dashboard,
    so you are not restricted to the chart type used to build the lens.


    When you select a widget, a properties window appears on the right side of the
    Cloud Builder screen. There is a default property labeled “faceted.” If you de-select
    “faceted” for a widget, the data on the widget will not change as you apply any
    refinements with other widgets. The faceted property is shown in Figure [2-17](#A978-1-4842-1203-5_2_Chapter.html#Fig17).


    ![A978-1-4842-1203-5_2_Fig17_HTML.jpg](A978-1-4842-1203-5_2_Fig17_HTML.jpg)


    Figure 2-17.


    The faceted property is selected by default


    #### Raw Data Widget


    As its name implies, this widget allows you to view a spreadsheet-style table
    of data from a lens. You can remove columns as desired, change the position of
    the columns, and sort the table with data from a column. To use the raw data widget
    in a dashboard, you must first create a lens with the raw data widget.


    #### Compare Table Widget


    An example of a comparison table was shown in Figure [2-13](#A978-1-4842-1203-5_2_Chapter.html#Fig13).
    Be aware that the comparison table has the same requirement as the raw data widget.
    You must first create a compare data widget in a lens before it can be used in
    a dashboard.


    #### Number Widget


    The number widget is used to display a single value on a dashboard. To use the
    number widget, you must create a lens with a measure and aggregation, and with
    no groups or dimensions applied. Numbers are useful to display summary data like
    total sales or some other grand total.


    #### Toggle Widget


    The toggle widget is both a selector for a dimension and a display widget for
    a measure. It can be used to apply a refinement to a dimension, and it can also
    display aggregated data associated with the dimension. The toggle widget is one
    of the most versatile and powerful widgets, used extensively in the examples given
    in this book.


    ### Selector Widgets


    The following widgets provide intuitive methods to refine data, based on the data
    type.


    #### Date Widget


    Date widgets are used to select a date range, and they must be used with date
    data from a lens. The date widget is a powerful selection tool because it allows
    many different ways to select a date, as can be seen in Figure [2-18](#A978-1-4842-1203-5_2_Chapter.html#Fig18),
    including by quarter, month, or week.


    ![A978-1-4842-1203-5_2_Fig18_HTML.jpg](A978-1-4842-1203-5_2_Fig18_HTML.jpg)


    Figure 2-18.


    Date Widget


    #### Range Widget


    The range widget is shown in Figure [2-19](#A978-1-4842-1203-5_2_Chapter.html#Fig19).
    It is used to select a numeric range to refine a measure. To use the range widget,
    you must create a lens with a measure and aggregation, and no groups or dimensions
    applied.


    ![A978-1-4842-1203-5_2_Fig19_HTML.jpg](A978-1-4842-1203-5_2_Fig19_HTML.jpg)


    Figure 2-19.


    Range widget


    ### Display Widgets


    These widgets are for display only and can only be modified at design time.


    #### Scope Widget


    The scope widget displays filters applied on lens data. It does not allow filter
    criteria to be changed, and is only a display mechanism. Figure [2-20](#A978-1-4842-1203-5_2_Chapter.html#Fig20)
    shows the scope widget, with a filter applied to date data to select quarter 1,
    and a filter applied to a region dimension to select only the United States and
    Canada.


    ![A978-1-4842-1203-5_2_Fig20_HTML.jpg](A978-1-4842-1203-5_2_Fig20_HTML.jpg)


    Figure 2-20.


    Scope widget


    #### Text Widget


    The text widget allows you to add a title to a dashboard, instructions, or comments
    on the data. You can use this widget to change the font size and the text color.


    #### Box Widget


    The box widget allows you to add a shaded area to a dashboard and to visually
    group widgets together, or to highlight some aspect of the dashboard.


    ### The Dashboard Development Cycle


    All dashboards are built on lens data, and you must first develop a lens to produce
    a view of the data before it can be used by a dashboard widget. This workflow
    is demonstrated in [Chapter 3](#A978-1-4842-1203-5_3_Chapter.html), but we will
    quickly summarize it here.


    When you have found your data in Cloud Builder, you use the button in the upper
    right corner of the Cloud Builder screen to “clip” the data and make it available
    to a dashboard. This button is shown in Figure [2-21](#A978-1-4842-1203-5_2_Chapter.html#Fig21).


    ![A978-1-4842-1203-5_2_Fig21_HTML.jpg](A978-1-4842-1203-5_2_Fig21_HTML.jpg)


    Figure 2-21.


    The Clip and Save buttons


    Note that both the dashboard and the lens builders have a Save button. You should
    use it frequently to save your changes to your dashboards or lenses. Be aware
    that changes in Cloud Builder are not automatically saved, so if you do not use
    the Save button frequently, you could lose work. Also, be aware that saving a
    lens only saves the query associated with the lens; it does not preserve a snapshot
    of the data.


    Once you have clipped your lens, you proceed to the dashboard editor to use the
    lens data. When you clip a lens, if a dashboard associated with the lens does
    not already exist, then a new dashboard will be created. You can view all of the
    lens data in a dashboard with the control on the left side of the dashboard, as
    shown in Figure [2-22](#A978-1-4842-1203-5_2_Chapter.html#Fig22). From this control,
    you can delete any lens data that is not used by a widget, and you can select
    the lens data to be used by a widget.


    ![A978-1-4842-1203-5_2_Fig22_HTML.jpg](A978-1-4842-1203-5_2_Fig22_HTML.jpg)


    Figure 2-22.


    Lens data browser in dashboard builder


    To use the lens data, select a widget from tool bar; it will appear on the dashboard
    builder. Lenses whose data can be used with the widget will be highlighted in
    the lens data browser. You select the lens whose data you would like to use and
    drag it to the widget. This is illustrated in Figure [2-23](#A978-1-4842-1203-5_2_Chapter.html#Fig23)
    and is also described in more detail in [Chapter 3](#A978-1-4842-1203-5_3_Chapter.html).


    ![A978-1-4842-1203-5_2_Fig23_HTML.jpg](A978-1-4842-1203-5_2_Fig23_HTML.jpg)


    Figure 2-23.


    Associating the lens data with a widget


    ### Link Back to Lens


    On dashboards, widgets have a button that allows you to link back to the lens
    used with the widget. This button is shown in Figure [2-24](#A978-1-4842-1203-5_2_Chapter.html#Fig24).
    Clicking this button immediately opens the lens for review. It is a useful tool
    when creating a new lens, based on the same lens used in a dashboard.


    ![A978-1-4842-1203-5_2_Fig24_HTML.jpg](A978-1-4842-1203-5_2_Fig24_HTML.jpg)


    Figure 2-24.


    Lens button for reviewing previous lens


    You can disable the Lens button, and there are several reasons for doing so. For
    example, you may want to prevent users from inadvertently clicking it or from
    perusing the lens data. The disable attribute for the Lens button is shown in
    Figure [2-25](#A978-1-4842-1203-5_2_Chapter.html#Fig25).


    ![A978-1-4842-1203-5_2_Fig25_HTML.jpg](A978-1-4842-1203-5_2_Fig25_HTML.jpg)


    Figure 2-25.


    Enable/disable Lens button


    You may have noticed the button with an “i” in Figure [2-23](#A978-1-4842-1203-5_2_Chapter.html#Fig23).
    You use this button to display information about the lens for a widget.'
  trans: '好的，作为一名高级文档工程师和翻译员，我已经理解了您的格式要求。以下是英文文本的中文翻译：



    ### 组件


    通俗来说，各种类型的组件是构成仪表盘的工具。图 2-16 展示了在 Cloud Builder 中可以找到的组件。


    ![A978-1-4842-1203-5_2_Fig16_HTML.jpg](img/A978-1-4842-1203-5_2_Fig16_HTML.jpg)


    图 2-16. Cloud Builder 中可用的组件


    组件有三种基本类型：数据展示类、选择器类和显示类。


    ### 数据展示组件


    这些组件都用于展示来自数据透镜的数据。它们根据各自用途具有不同的能力，因此有些组件适用于多个度量，而另一些则只适用于单个度量。


    #### 图表组件


    图表组件提供的图表类型与您构建数据透镜时可用的图表类型相同。在构建仪表盘时，您可以随时更改图表类型，因此不受构建数据透镜时所用图表类型的限制。


    当您选择一个组件时， Cloud Builder 屏幕的右侧会弹出一个属性窗口。其中有一个默认属性标记为 `"faceted"`。如果您取消选择某个组件的
    `"faceted"` 属性，那么当您使用其他组件应用任何细化筛选时，该组件上的数据将不会随之变化。`faceted` 属性如图 2-17 所示。


    ![A978-1-4842-1203-5_2_Fig17_HTML.jpg](img/A978-1-4842-1203-5_2_Fig17_HTML.jpg)


    图 2-17. `faceted` 属性默认被选中


    #### 原始数据组件


    顾名思义，该组件允许您查看来自数据透镜的电子表格样式的数据表。您可以根据需要移除列、调整列的位置，以及根据某一列的数据对表格进行排序。要在仪表盘中使用原始数据组件，您必须先使用原始数据组件创建一个数据透镜。


    #### 比较表组件


    图 2-13 中展示了一个比较表的示例。请注意，比较表与原始数据组件有同样的要求：您必须先在一个数据透镜中创建一个比较数据组件，然后才能在仪表盘中将其使用。


    #### 数值组件


    数值组件用于在仪表盘上显示单个数值。要使用数值组件，您必须创建一个包含度量和聚合、且未应用任何分组或维度的数据透镜。数值对于显示汇总数据（如总销售额或其他合计总数）非常有用。


    #### 切换组件


    切换组件既是维度的选择器，也是度量的展示组件。它可用于对维度应用细化筛选，也可展示与该维度关联的聚合数据。切换组件是功能最强大、用途最广的组件之一，在本书提供的示例中被广泛使用。


    ### 选择器组件


    以下组件基于数据类型提供了直观的数据细化方法。


    #### 日期组件


    日期组件用于选择日期范围，并且必须与来自数据透镜的日期数据一起使用。日期组件是一个强大的选择工具，因为它提供了许多不同的日期选择方式，如图 2-18 所示，包括按季度、月份或周选择。


    ![A978-1-4842-1203-5_2_Fig18_HTML.jpg](img/A978-1-4842-1203-5_2_Fig18_HTML.jpg)


    图 2-18. 日期组件


    #### 范围组件


    范围组件如图 2-19 所示。它用于选择一个数值范围来细化度量。要使用范围组件，您必须创建一个包含度量和聚合、且未应用任何分组或维度的数据透镜。


    ![A978-1-4842-1203-5_2_Fig19_HTML.jpg](img/A978-1-4842-1203-5_2_Fig19_HTML.jpg)


    图 2-19. 范围组件


    ### 显示组件


    这些组件仅用于显示，且只能在设计时进行修改。


    #### 范围指示组件


    范围指示组件展示应用于数据透镜数据的筛选器。它不允许更改筛选条件，仅是一种展示机制。图 2-20 展示了范围指示组件，其中对日期数据应用了筛选以选择第一季度，并对区域维度应用了筛选以仅选择美国和加拿大。


    ![A978-1-4842-1203-5_2_Fig20_HTML.jpg](img/A978-1-4842-1203-5_2_Fig20_HTML.jpg)


    图 2-20. 范围指示组件


    #### 文本组件


    文本组件允许您向仪表盘添加标题、说明或关于数据的注释。您可以使用此组件更改字体大小和文本颜色。


    #### 方框组件


    方框组件允许您向仪表盘添加一个阴影区域，用于在视觉上将组件分组，或突出显示仪表盘的某些方面。


    ### 仪表盘开发周期


    所有仪表盘都基于数据透镜的数据构建，您必须首先开发一个数据透镜以生成数据视图，然后才能被仪表盘组件使用。此工作流将在第 3 章中演示，但此处我们进行简要总结。


    当您在 Cloud Builder 中找到数据后，可以使用 Cloud Builder 屏幕右上角的按钮来“`clip`”数据，使其可供仪表盘使用。此按钮如图
    2-21 所示。


    ![A978-1-4842-1203-5_2_Fig21_HTML.jpg](img/A978-1-4842-1203-5_2_Fig21_HTML.jpg)


    图 2-21. Clip 和 Save 按钮


    请注意，仪表盘和数据透镜构建器都有一个 `Save` 按钮。您应经常使用它来保存对仪表盘或数据透镜的更改。请注意，Cloud Builder 中的更改不会自动保存，因此如果您不经常使用
    `Save` 按钮，可能会丢失工作成果。另外，保存数据透镜仅保存与该数据透镜关联的查询；它不会保留数据快照。


    一旦您裁剪了数据透镜，就可以进入仪表盘编辑器来使用数据透镜的数据。当您裁剪一个数据透镜时，如果与该数据透镜关联的仪表盘尚不存在，则会创建一个新的仪表盘。您可以通过仪表盘左侧的控件查看仪表盘中的所有数据透镜数据，如图
    2-22 所示。通过此控件，您可以删除任何未被组件使用的数据透镜数据，并选择要由组件使用的数据透镜数据。


    ![A978-1-4842-1203-5_2_Fig22_HTML.jpg](img/A978-1-4842-1203-5_2_Fig22_HTML.jpg)


    图 2-22. 仪表盘构建器中的数据透镜数据浏览器


    要使用数据透镜数据，请从工具栏中选择一个组件；它将出现在仪表盘构建器上。其数据可与此组件一起使用的数据透镜将在数据透镜数据浏览器中高亮显示。您选择要使用其数据的数据透镜，并将其拖拽到组件上。如图
    2-23 所示，并在第 3 章中有更详细的描述。


    ![A978-1-4842-1203-5_2_Fig23_HTML.jpg](img/A978-1-4842-1203-5_2_Fig23_HTML.jpg)


    图 2-23. 将数据透镜数据与组件关联


    ### 链接回数据透镜


    在仪表盘上，组件有一个按钮，允许您链接回与该组件一起使用的数据透镜。此按钮如图 2-24 所示。单击此按钮将立即打开数据透镜以供查看。当基于仪表盘中使用的同一数据透镜创建新的数据透镜时，这是一个有用的工具。


    ![A978-1-4842-1203-5_2_Fig24_HTML.jpg](img/A978-1-4842-1203-5_2_Fig24_HTML.jpg)


    图 2-24. 用于查看先前数据透镜的数据透镜按钮


    您可以禁用 `Lens` 按钮，这样做的原因有多种。例如，您可能希望防止用户无意中单击它，或者防止他们浏览数据透镜的数据。`Lens` 按钮的禁用属性如图
    2-25 所示。


    ![A978-1-4842-1203-5_2_Fig25_HTML.jpg](img/A978-1-4842-1203-5_2_Fig25_HTML.jpg)


    图 2-25. 启用/禁用 Lens 按钮


    您可能已经注意到图 2-23 中带有一个 `"i"` 的按钮。您可以使用此按钮显示组件的相关数据透镜信息。

    '
- fmt: '### Dashboard Wrap-Up


    With the information covered in this section, you should be able to begin creating
    your own dashboards. There’s more information on the dashboards in [Chapter 3](#A978-1-4842-1203-5_3_Chapter.html).
    [Chapters 5](#A978-1-4842-1203-5_5_Chapter.html) and [6](#A978-1-4842-1203-5_6_Chapter.html)
    have use cases that show the use of dashboards.


    ## Apps


    The final major element of Cloud Explorer is its apps. The apps allow you to bundle
    the dashboards, lenses, and datasets. These apps do not have inherent features
    beyond their container function, so there are no editors for them. Apps are created
    with the `Create` button, shown earlier in Figure [2-4](#A978-1-4842-1203-5_2_Chapter.html#Fig4).


    When you use the `Save` button for objects, you can associate them with an app.
    Datasets can be associated with an app by editing them, then changing their app.
    An app can contain any number of datasets, dashboards, and lenses.


    ### My Private App


    There is a default app in Cloud Explorer called `My Private App`. As its name
    implies, no other users can see anything in this app. This is the default `Save`
    location for all objects, and it’s a staging area or scratchpad that you should
    use to store objects before they are ready for public consumption.


    ### The Share Button


    Apps, lenses, and dashboards all have a `Share` button that you have no doubt
    noticed by now. The `Share` button is used to share objects with others who have
    Salesforce logins. The `Share` button for apps is shown in Figure [2-26](#A978-1-4842-1203-5_2_Chapter.html#Fig26).


    ![A978-1-4842-1203-5_2_Fig26_HTML.jpg](A978-1-4842-1203-5_2_Fig26_HTML.jpg)


    Figure 2-26. The `Share` button for apps


    The `Share` button will open the message box shown in Figure [2-27](#A978-1-4842-1203-5_2_Chapter.html#Fig27).
    The features of this message box are common means for sharing and collaborating,
    allowing you to select individual users for sharing or levels of persons in your
    organization. For example, you can post to your Salesforce feed, take a screenshot,
    and get a URL that you can share with those you have allowed to view the app.
    This collaborative capability makes sharing your data discovery work in the Salesforce
    Analytics Cloud quite simple. Note that sharing a screenshot creates a graphic
    snapshot that can be shared with those who are not Salesforce Analytics Cloud
    users. Sharing a dashboard or lens with these users is not possible, however.


    ![A978-1-4842-1203-5_2_Fig27_HTML.jpg](A978-1-4842-1203-5_2_Fig27_HTML.jpg)


    Figure 2-27. Sharing options for an app


    ### Playground Data


    Cloud Explorer has access to “playground data” on mobile devices that you can
    use to get familiar with Cloud Explorer. This data consists of different applications,
    so you see good examples of all of its elements.


    ## What Wave Lacks


    You may be in the process of evaluating Wave as a data discovery product, so it
    is important to point out aspects that may be deal breakers.


    ### Text Processing and Analysis


    Wave is a product that at its core is capable of performing only basic aggregations
    on numeric data. It has no capability to perform text processing and it lacks
    visualizations for text analysis, like tag clouds. Wave can use text as a dimension
    in its visualizations, but in this context its purpose is only to provide meaning
    to numeric data.


    To illustrate this point, if you have a simple spreadsheet that ranks cars on
    their quarter-mile times by make and model, then the names of the cars would simply
    be present as a legend or axis label on a graph against numeric data. Wave has
    no capability of performing presentations with the names of the cars. Wave also
    lacks the capability of performing a search on text data. So if your dataset is
    a huge list of cars produced over sixty years, you will not have an ability to
    search for the name for any car. However, you can filter on text, and in some
    circumstances this may suit your needs.


    ### Map and Geospatial Data


    Wave has no means of handling geospatial data in its visual controls or widgets.
    If you are looking for a data discovery product with a map component that allows
    selection and refinement of data by clicking on a map, then you might want to
    consider a different data discovery product.


    ### Advanced Math and Statistical Functions


    Advanced math functions are not available in Wave. This capability is not featured
    in data discovery products in general, so if you are designing an application
    or workflow that needs a more complex mathematical function, like standard deviations
    or moving averages, you should compute these on data before loading it into Wave.


    ## Conclusion


    This chapter has examined the most user-facing part of the Salesforce Analytics
    Cloud, which is Cloud Explorer. Presented here were the major elements of Cloud
    Explorer, which are datasets, lenses, dashboards, and apps. Also provided was
    information to help the beginner get started using Cloud Explorer, followed by
    a review of the sharing capabilities of Cloud Explorer and some of its limitations.


    Remember the advice of Confucius to be a “doer” to gain knowledge. With the information
    presented in this chapter, you can take the first step toward being a doer with
    Cloud Explorer.


    # 3. Analytics Cloud Builder


    > Intuition becomes increasingly valuable in the new information society precisely
    because there is so much data. — [John Naisbitt](http://en.wikipedia.org/wiki/John_Naisbitt#_blank%23John%20Naisbitt%20wiki)


    American author and speaker John Naisbitt is highly recognized in his studies
    of future trends. He extended Einstein’s conclusion that “The only real valuable
    thing is intuition” by emphasizing the importance of human intuition in the era
    of data explosion and abundance. An intuitive user interface to explore data and
    develop visualization is of critical value, and that’s one of key benefits of
    Salesforce Analytics Cloud.


    In [Chapter 2](#A978-1-4842-1203-5_2_Chapter.html), we covered various visualizations
    available in Salesforce Analytics Cloud. In this chapter, we will focus on designing
    dashboards using the Analytics Cloud Builder.


    We will first create a step-by-step dashboard from scratch with one simple dataset.
    We will then cover topics concerning best practices to design visualization. Creating
    dataset and dashboard through mobile device will also be demonstrated, followed
    by advanced dashboard development using SAQL.


    ## Building a Simple Dashboard


    In this section, we will first go through a step-by-step dashboard building exercise.
    All datasets and JSON templates can be downloaded from [`www.apress.com/9781484212042`](http://www.apress.com/9781484212042)
    and clicking on the `Source Code` tab. You can follow along the examples as we
    step through.'
  raw: '### Dashboard Wrap-Up


    With the information covered in this section, you should be able to begin creating
    your own dashboards. There’s more information on the dashboards in [Chapter 3](#A978-1-4842-1203-5_3_Chapter.html).
    [Chapters 5](#A978-1-4842-1203-5_5_Chapter.html) and [6](#A978-1-4842-1203-5_6_Chapter.html)
    have use cases that show the use of dashboards.


    ## Apps


    The final major element of Cloud Explorer is its apps. The apps allow you to bundle
    the dashboards, lenses, and datasets. These apps do not have inherent features
    beyond their container function, so there are no editors for them. Apps are created
    with the Create button, shown earlier in Figure [2-4](#A978-1-4842-1203-5_2_Chapter.html#Fig4).


    When you use the Save button for objects, you can associate them with an app.
    Datasets can be associated with an app by editing them, then changing their app.
    An app can contain any number of datasets, dashboards, and lenses.


    ### My Private App


    There is a default app in Cloud Explorer called My Private App. As its name implies,
    no other users can see anything in this app. This is the default Save location
    for all objects, and it’s a staging area or scratchpad that you should use to
    store objects before they are ready for public consumption.


    ### The Share Button


    Apps, lenses, and dashboards all have a Share button that you have no doubt noticed
    by now. The Share button is used to share objects with others who have Salesforce
    logins. The Share button for apps is shown in Figure [2-26](#A978-1-4842-1203-5_2_Chapter.html#Fig26).


    ![A978-1-4842-1203-5_2_Fig26_HTML.jpg](A978-1-4842-1203-5_2_Fig26_HTML.jpg)


    Figure 2-26.


    The Share button for apps


    The Share button will open the message box shown in Figure [2-27](#A978-1-4842-1203-5_2_Chapter.html#Fig27).
    The features of this message box are common means for sharing and collaborating,
    allowing you to select individual users for sharing or levels of persons in your
    organization. For example, you can post to your Salesforce feed, take a screenshot,
    and get a URL that you can share with those you have allowed to view the app.
    This collaborative capability makes sharing your data discovery work in the Salesforce
    Analytics Cloud quite simple. Note that sharing a screenshot creates a graphic
    snapshot that can be shared with those who are not Salesforce Analytics Cloud
    users. Sharing a dashboard or lens with these users is not possible, however.


    ![A978-1-4842-1203-5_2_Fig27_HTML.jpg](A978-1-4842-1203-5_2_Fig27_HTML.jpg)


    Figure 2-27.


    Sharing options for an app


    ### Playground Data


    Cloud Explorer has access to “playground data” on mobile devices that you can
    use to get familiar with Cloud Explorer. This data consists of different applications,
    so you see good examples of all of its elements.


    ## What Wave Lacks


    You may be in the process of evaluating Wave as a data discovery product, so it
    is important to point out aspects that may be deal breakers.


    ### Text Processing and Analysis


    Wave is a product that at its core is capable of performing only basic aggregations
    on numeric data. It has no capability to perform text processing and it lacks
    visualizations for text analysis, like tag clouds. Wave can use text as a dimension
    in its visualizations, but in this context its purpose is only to provide meaning
    to numeric data.


    To illustrate this point, if you have a simple spreadsheet that ranks cars on
    their quarter-mile times by make and model, then the names of the cars would simply
    be present as a legend or axis label on a graph against numeric data. Wave has
    no capability of performing presentations with the names of the cars. Wave also
    lacks the capability of performing a search on text data. So if your dataset is
    a huge list of cars produced over sixty years, you will not have an ability to
    search for the name for any car. However, you can filter on text, and in some
    circumstances this may suit your needs.


    ### Map and Geospatial Data


    Wave has no means of handling geospatial data in its visual controls or widgets.
    If you are looking for a data discovery product with a map component that allows
    selection and refinement of data by clicking on a map, then you might want to
    consider a different data discovery product.


    ### Advanced Math and Statistical Functions


    Advanced math functions are not available in Wave. This capability is not featured
    in data discovery products in general, so if you are designing an application
    or workflow that needs a more complex mathematical function, like standard deviations
    or moving averages, you should compute these on data before loading it into Wave.


    ## Conclusion


    This chapter has examined the most user-facing part of the Salesforce Analytics
    Cloud, which is Cloud Explorer. Presented here were the major elements of Cloud
    Explorer, which are datasets, lenses, dashboards, and apps. Also provided was
    information to help the beginner get started using Cloud Explorer, followed by
    a review of the sharing capabilities of Cloud Explorer and some of its limitations.


    Remember the advice of Confucius to be a “doer” to gain knowledge. With the information
    presented in this chapter, you can take the first step toward being a doer with
    Cloud Explorer.


    # 3. Analytics Cloud Builder


    > Intuition becomes increasingly valuable in the new information society precisely
    because there is so much data. — [John Naisbitt](http://en.wikipedia.org/wiki/John_Naisbitt#_blank%23John%20Naisbitt%20wiki)


    American author and speaker John Naisbitt is highly recognized in his studies
    of future trends. He extended Einstein’s conclusion that “The only real valuable
    thing is intuition” by emphasizing the importance of human intuition in the era
    of data explosion and abundance. An intuitive user interface to explore data and
    develop visualization is of critical value, and that’s one of key benefits of
    Salesforce Analytics Cloud.


    In [Chapter 2](#A978-1-4842-1203-5_2_Chapter.html), we covered various visualizations
    available in Salesforce Analytics Cloud. In this chapter, we will focus on designing
    dashboards using the Analytics Cloud Builder.


    We will first create a step-by-step dashboard from scratch with one simple dataset.
    We will then cover topics concerning best practices to design visualization. Creating
    dataset and dashboard through mobile device will also be demonstrated, followed
    by advanced dashboard development using SAQL.


    ## Building a Simple Dashboard


    In this section, we will first go through a step-by-step dashboard building exercise.
    All datasets and JSON templates can be downloaded from [`www.apress.com/9781484212042`](http://www.apress.com/9781484212042)
    and clicking on the Source Code tab. You can follow along the examples as we step
    through.'
