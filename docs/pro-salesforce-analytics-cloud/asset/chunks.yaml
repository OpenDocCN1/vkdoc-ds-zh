  trans: '

    ### 简单性


    多数编程语言会随时间不断扩展和演变，并提供了多种完成任务的方式。PERL 编程语言就是一个很好的例子。PERL 的设计哲学可以用一句话概括：“总有不止一种方法去实现它”（TMTOWTDI）。而
    Python 的哲学则拒斥这种方式。相反，Python 的核心理念是：“应该有一种——并且最好只有一种——显而易见的方式去做事。”这一哲学让 Python
    比 PERL 等语言更易于学习和使用。


    ### 可移植性


    Python 在 Red Hat 和 SUSE 等常用的企业级 Linux 操作系统上默认安装。它预装在 Mac OSX 上，也可以轻松安装在 Microsoft
    Windows 上。它同样是 Solaris（Sun 公司的 Unix 版本）的标准组件，并能方便地安装在 IBM AIX UNIX 上。凭借这种可移植性，Python
    代码可以在工作站上开发和原型设计，然后迁移至企业级服务器。


    ### 设计与调试


    Python 配备了一个命令行解释器，可以轻松测试和调试任何单个命令或命令序列。这消除了完全在编辑器中开发代码的必要，允许在解释器中逐行测试简单程序。


    ### 多功能性


    曾几何时，需要电池才能工作的产品会用“电池已附”来表明产品开箱即用、百分之百就绪。你可以将 Python 视为“电池已附”的编程语言。它有丰富的功能库，能够满足任何类型的编程需求，包括数据处理。本章稍后会介绍其中一部分，但可以确信的是，Python
    拥有连接任何数据源并执行几乎任何计算或数据操作活动的库。这很大程度上得益于 Python 强大的用户社区，这个社区包括开源软件开发者、大学以及私营企业。


    Python 在顶尖软件开发者中获得了广泛认可。部分原因在于 Python 遵循了计算机语言设计的正确计算机科学原理。这促使麻省理工学院（MIT）在其“计算机科学与编程导论”课程中采用
    Python。此外，许多大型机构广泛使用 Python，包括 Google、NASA 和 CERN。Python 既被高技能开发者用于庞大复杂的项目，又让业余程序员也能轻松掌握。


    ### 教学资源可获得性


    有许多免费且提供出色教学的 Python 学习网站和视频。上述 MIT 的课程提供了在线视频。Google 也提供在线 Python 教学。如果你考虑使用
    Python，不妨先看看这些资源。


    ### 成本


    如前所述，成本常常是组织避免使用 ETL 工具进行数据处理的原因。Python 的许可和使用完全免费。Python 功能丰富的库同样免费使用。你可以使用任何编辑器（包括许多免费编辑器）来开发
    Python 代码。一些优秀的 Python 编辑器提供更全面的语法高亮功能，每用户成本不到 100 美元。


    ## 两个 Python 使用实例


    下面来看两个使用 Python 进行数据处理——更具体地说，数据清洗——的例子。Python 同样适用于数据处理的其他方面，例如数据整理，但为了保持示例简洁，我们聚焦于数据清洗。注意：如果你对代码或编程不感兴趣，可能会觉得这些例子不适合你。然而，每位读者至少应浏览一下这些示例，以感受如何用极少的
    Python 代码完成大量工作。


    ### 数据清洗示例 1


    第 6 章 展示了渥太华县自行车公司的数据。使用的数据是从 ERP 系统中提取的销售数据，保存在一个 `.csv` 文件中，该文件被加载到苹果 iPad 上的
    Dropbox 中，随后再加载到 Salesforce 分析云中。如果文件中存在重复记录，将会是一个问题，因为它会打乱仪表盘上计算的所有汇总值。为消除这一潜在问题，我们使用一个
    Python 脚本来检测并删除重复行。该脚本如下面的程序清单所示。图 7-3 是该程序的流程图。


    ```

    1       #!/usr/bin/python

    2       inputFile="/u01/import/csv/OttawaCountyBikes_dirty.csv"

    3       outputFile="/u01/export/csv/OttawaCountyBikes.csv"

    4       #  清理脏 ERP 数据

    5       lines_read = set() # 保存已“见过”的行

    6       # 打开输出文件用于写入

    7       outfile = open(outputFile, "w")

    8       # 打开包含脏数据的文件用于读取

    9       for line_just_read in open(inputFile, "r"):

    10

    11              # 判断刚读取的行是否不在 lines_read 集合中

    12          if line_just_read not in lines_read:

    13

    14              # 如果行未被见过，则将其写入输出文件

    15                      outfile.write(line_just_read)

    16

    17                      # 将刚读取的行添加到 lines_seen 集合

    18                      lines_seen.add(line_just_read)

    19

    20      outfile.close()

    ```


    ![A978-1-4842-1203-5_7_Fig3_HTML.jpg](img/A978-1-4842-1203-5_7_Fig3_HTML.jpg)


    **图 7-3.** Python 示例 1 数据清洗流程图


    在示例 1 中，有一个包含脏数据的文件，因为该文件可能存在重复行。数据来源于渥太华县自行车公司的 ERP 系统，且该公司拥有确保 ERP 中数据质量的标准，因此我们只需担心重复记录。程序中，`inputFile`
    变量指向包含未经清洗数据的文件 `OttawaCountyBikes_dirty.csv`。下表逐行追踪了该程序的工作方式。


    | 行号 | 说明 |

    | --- | --- |

    | 2 | 变量 `inputFile` 是包含脏数据的输入文件名。 |

    | 3 | 变量 `outputFile` 是清洗后数据的输出文件名。 |

    | 4 | 声明一个 `set()` 类型的变量 `lines_read`。`set` 类型会保留每一行处理过的记录，并用于与新行进行比较。 |

    | 7 | 打开输出文件用于写入。 |

    | 9 | 打开输入文件读取待清洗的数据，并循环遍历文件中所有行，将每一行存储在变量 `line` 中。 |

    | 12 | 判断刚读取的 `line` 是否在集合 `last_read` 中。如果该行在 `last_read` 中，则说明是重复行，不会写入输出文件；如果不在
    `last_read` 中，则说明是唯一的，将其写入输出文件。 |

    | 20 | 处理完成后关闭输出文件。 |


    这个相对简单的程序利用了 Python 的高级数据类型（如 `set`）以及以紧凑形式进行这些类型比较的能力。声明为 `set` 的变量是 `lines_read`，它包含了每一行已被检查过的记录。`set`
    数据类型包含一个 `.add` 方法，在我们的示例中用于添加行。忽略注释，该程序仅包含九行可执行代码，并高效地完成了删除重复记录的任务。'
- fmt: "### Data Cleansing Example 2\n\nIn this example, we use data from the Ottawa\
    \ County Bike Company that was also used in example 1. Recall from [Chapter 6](#A978-1-4842-1203-5_6_Chapter.html)\
    \ that the Ottawa County Bike Company’s products fall into four categories: bikes,\
    \ bike components, clothing, and accessories. For two of these categories—clothing\
    \ and accessories—the product distribution can include secondary distributors.\
    \ Secondary distributors purchase the products from the warehouses, and then distribute\
    \ them to resellers. Some of these resellers are online storefronts who can sell\
    \ anywhere in the United States. Increasingly, this alternative channel has resulted\
    \ in surging sales. However, information on products being sold online has been\
    \ difficult to process.\n\nA retail intelligence service provides a feed file\
    \ that has information on product names and geographic information regarding the\
    \ purchases that includes city, state, and zipcode. The online vendors often change\
    \ product names inadvertently, and the city, state and zipcode information can\
    \ be of varying format. To make sense of the data, we use an open-source library\
    \ that performs fuzzy logic comparisons between the two datasets. The library\
    \ is called Fuzzywuzzy, but before we use it, let’s see how easy it is to install\
    \ new libraries for Python.\n\n#### Installing New Libraries\n\nA compelling aspect\
    \ of Python is the ease with which new libraries can be installed to perform a\
    \ new function. In this example, we want to install the library Fuzzywuzzy, which\
    \ performs fuzzy logic comparisons. To do this, we use the Python package manager\
    \ `pip`. `Pip` is a package manager that allows packages to be easily installed.\n\
    \nThe syntax for installing new packages is simple:\n\n```\n$ pip install <package\
    \ name>\n```\n\nShown below is the command used to install Fuzzywuzzy, followed\
    \ by the output:\n\n```\n$ pip install fuzzywuzzy\nCollecting fuzzywuzzy\n  Downloading\
    \ fuzzywuzzy-0.8.0.tar.gz\nInstalling collected packages: fuzzywuzzy\n  Running\
    \ setup.py install for fuzzywuzzy\nSuccessfully installed fuzzywuzzy-0.8.0\n```\n\
    \nThis was executed on Red Hat Linux, but it also works on Mac OSX. `Pip` is not\
    \ installed by default with Python, but installing it is easy—simply by running\
    \ the following command:\n\n```\nsudo easy_install pip\n```\n\n#### Data Matching\
    \ with Fuzzy Logic\n\nFuzzywuzzy compares two values and returns a percentage\
    \ match. Let’s see how it works, with a few commands executed through the Python\
    \ command line.\n\nWe start Python and simply type the values shown, so as to\
    \ experiment and prototype our use of the fuzzy logic match. We start by declaring\
    \ two variables. The first variable, `prodNameRef`, contains the product name\
    \ from the Ottawa County Bike Company database. The second variable, `prodNameComp`,\
    \ contains the product name from the retail intelligence service mentioned earlier.\n\
    \nThe Fuzzywuzzy library has a namespace called `fuzz` that is used to access\
    \ all its methods. A namespace is the name used to reference a library in Python\
    \ code.\n\nThere is a method called `token_sort_ratio` that we use to compare\
    \ the two variables. In the first test, the two variables contain identical data\
    \ and a value of 100 is returned, meaning the data in the two variables is a 100\
    \ percent match.\n\n```\n>>> prodNameRef=\"ML Road Frame-W - Yellow\"\n>>> prodNameComp=\"\
    ML Road Frame-W - Yellow\"\n>>> fuzz.token_sort_ratio(prodNameRef, prodNameComp)\n\
    100\n```\n\nAnother value from the retail intelligence service for product name\
    \ is not as close to the value from the Ottawa County Bike Company database:\n\
    \n```\n>>> prodNameRef=\"ML Road Frame-W - Yellow\"\n>>> prodNameComp =\"Road\
    \ Frame-W - Yel\"\n>>> fuzz.token_sort_ratio(prodNameRef,prodNameComp)\n84\n```\n\
    \nFor this value, we have a value of 84, which indicates an 84 percent match.\
    \ In the next test, there is no indication of color:\n\n```\n>>> prodNameRef=\"\
    ML Road Frame-W - Yellow\"\n>>> prodNameComp =\"Road Frame-W\"\n>>> fuzz.token_sort_ratio(prodNameRef,prodNameComp)\n\
    71\n```\n\nA 71 percent match is not a reliable match, since there are other colors\
    \ like black and silver for these product descriptions. A match above 80 percent\
    \ indicates a strong match. Armed with this knowledge, we can read each row of\
    \ data from the retail intelligence service, and compare it to every value from\
    \ the Ottawa County Bike Company database until a match is found."
  raw: '### Data Cleansing Example 2


    In this example, we use data from the Ottawa County Bike Company that was also
    used in example 1\. Recall from [Chapter 6](#A978-1-4842-1203-5_6_Chapter.html)
    that the Ottawa County Bike Company’s products fall into four categories: bikes,
    bike components, clothing, and accessories. For two of these categories—clothing
    and accessories—the product distribution can include secondary distributors. Secondary
    distributors purchase the products from the warehouses, and then distribute them
    to resellers. Some of these resellers are online storefronts who can sell anywhere
    in the United States. Increasingly, this alternative channel has resulted in surging
    sales. However, information on products being sold online has been difficult to
    process.


    A retail intelligence service provides a feed file that has information on product
    names and geographic information regarding the purchases that includes city, state,
    and zipcode. The online vendors often change product names inadvertently, and
    the city, state and zipcode information can be of varying format. To make sense
    of the data, we use an open-source library that performs fuzzy logic comparisons
    between the two datasets. The library is called Fuzzywuzzy, but before we use
    it, let’s see how easy it is to install new libraries for Python.


    #### Installing New Libraries


    A compelling aspect of Python is the ease with which new libraries can be installed
    to perform a new function. In this example, we want to install the library Fuzzywuzzy,
    which performs fuzzy logic comparisons. To do this, we use the Python package
    manager “pip.” Pip is a package manager that allows packages to be easily installed.


    The syntax for installing new packages is simple:


    `$ pip install <package name>`


    Shown below is the command is used to install Fuzzywuzzy, followed by the output:


    `$ pip install fuzzywuzzy`


    `Collecting fuzzywuzzy`


      `Downloading fuzzywuzzy-0.8.0.tar.gz`


    `Installing collected packages: fuzzywuzzy`


      `Running setup.py install for fuzzywuzzy`


    `Successfully installed fuzzywuzzy-0.8.0`


    This was executed on Red Hat Linux, but it also works on Mac OSX. Pip is not installed
    by default with Python, but installing it is easy—simply by running the following
    command:


    `sudo easy_install pip`


    #### Data Matching with Fuzzy Logic


    Fuzzwuzzy compares two values and returns a percentage match. Let’s see how it
    works, with a few commands executed through the Python command line.


    We start Python and simply type the values shown, so as to experiment and prototype
    our use of the fuzzy logic match. We start by declaring two variables. The first
    variable, `prodNameRef`, contains the product name from the Ottawa County Bike
    Company database. The second variable, `prodNameComp`, contains the product name
    from the retail intelligence service mentioned earlier.


    The Fuzzywuzzy library has a namespace called “fuzz” that is used to access all
    its methods. A namespace is the name used to reference a library in Python code.


    There is a method called `token_sort_ratio` that we use to compare the two variables.
    In the first test, the two variables contain identical data and a value of 100
    is returned, meaning the data in the two variables is a 100 percent match.


    `>>> prodNameRef="ML Road Frame-W - Yellow"`


    `>>> prodNameComp="ML Road Frame-W - Yellow"`


    `>>> fuzz.token_sort_ratio(prodNameRef, prodNameComp)`


    `100`


    Another value from the retail intelligence service for product name is not as
    close to the value from the Ottawa County Bike Company database:


    `>>> prodNameRef="ML Road Frame-W - Yellow"`


    `>>> prodNameComp ="Road Frame-W - Yel"`


    `>>> fuzz.token_sort_ratio(prodNameRef,prodNameComp)`


    `84`


    For this value, we have a value of 84, which indicates an 84 percent match. In
    the next test, there is no indication of color:


    `>>> prodNameRef="ML Road Frame-W - Yellow"`


    `>>> prodNameComp ="Road Frame-W"`


    `>>> fuzz.token_sort_ratio(prodNameRef,prodNameComp)`


    `71`


    A 71 percent match is not a reliable match, since there are other colors like
    black and silver for these product descriptions. A match above 80 percent indicates
    a strong match. Armed with this knowledge, we can read each row of data from the
    retail intelligence service, and compare it to every value from the Ottawa County
    Bike Company database until a match is found.'
  trans: "\n### 数据清洗示例 2\n\n在本示例中，我们将使用示例 1 中同样用到的渥太华县自行车公司的数据。回顾第 6 章的内容可知，渥太华县自行车公司的产品分为四类：自行车、自行车零部件、服装和配件。其中，服装和配件这两类产品的分销可能涉及二级分销商。二级分销商从仓库采购产品，然后再分销给转售商。部分转售商是在线店铺，其销售范围可覆盖全美各地。这种非传统渠道日益兴起，导致销售额大幅增长。然而，有关在线销售产品的信息处理起来一直很困难。\n\
    \n一家零售情报服务商提供了一个数据源文件，其中包含产品名称以及购买地的地理信息，包括城市、州和邮政编码。在线商家时常会不经意地更改产品名称，而城市、州和邮政编码信息的格式也往往不统一。为了理解这些数据，我们使用一个开源库来对两个数据集进行模糊逻辑比对。这个库名为\
    \ Fuzzywuzzy，但在使用它之前，我们先来看看在 Python 中安装新库有多简单。\n\n#### 安装新库\n\nPython 的一个吸引人之处在于，可以轻松安装新库来实现新功能。在本示例中，我们要安装用于执行模糊逻辑比对的\
    \ Fuzzywuzzy 库。为此，我们使用 Python 包管理器 `pip`。`Pip` 是一个能让包轻松安装的包管理器。\n\n安装新包的语法很简单：\n\
    \n```\n$ pip install <包名>\n```\n\n下面展示了用于安装 Fuzzywuzzy 的命令及其输出结果：\n\n```\n$ pip\
    \ install fuzzywuzzy\n正在收集 fuzzywuzzy\n  下载 fuzzywuzzy-0.8.0.tar.gz\n正在安装已收集的包：fuzzywuzzy\n\
    \  正在运行 setup.py 以安装 fuzzywuzzy\n已成功安装 fuzzywuzzy-0.8.0\n```\n\n该操作是在 Red Hat\
    \ Linux 上执行的，但在 Mac OSX 上同样有效。`Pip` 在 Python 中默认并未安装，但安装它很容易——只需运行以下命令：\n\n```\n\
    sudo easy_install pip\n```\n\n#### 使用模糊逻辑进行数据匹配\n\nFuzzywuzzy 可以比对两个值并返回一个百分比匹配度。让我们通过\
    \ Python 命令行执行几个命令，来看看它是如何工作的。\n\n我们启动 Python 并直接输入展示的值，以便试验和原型化我们使用模糊逻辑匹配的方法。首先，声明两个变量。第一个变量\
    \ `prodNameRef` 包含渥太华县自行车公司数据库中的产品名称。第二个变量 `prodNameComp` 包含前面提到的零售情报服务商提供的产品名称。\n\
    \nFuzzywuzzy 库有一个名为 `fuzz` 的命名空间，用于访问其所有方法。命名空间是在 Python 代码中引用库时使用的名称。\n\n我们使用一个名为\
    \ `token_sort_ratio` 的方法来比较这两个变量。在第一次测试中，两个变量包含完全相同的数据，返回值为 100，这意味着两个变量中的数据完全匹配。\n\
    \n```\n>>> prodNameRef=\"ML Road Frame-W - Yellow\"\n>>> prodNameComp=\"ML Road\
    \ Frame-W - Yellow\"\n>>> fuzz.token_sort_ratio(prodNameRef, prodNameComp)\n100\n\
    ```\n\n零售情报服务商提供的另一个产品名称值与渥太华县自行车公司数据库中的值并不十分接近：\n\n```\n>>> prodNameRef=\"ML\
    \ Road Frame-W - Yellow\"\n>>> prodNameComp =\"Road Frame-W - Yel\"\n>>> fuzz.token_sort_ratio(prodNameRef,prodNameComp)\n\
    84\n```\n\n对于这个值，我们得到了 84，表示 84% 的匹配度。在接下来的测试中，没有出现颜色信息：\n\n```\n>>> prodNameRef=\"\
    ML Road Frame-W - Yellow\"\n>>> prodNameComp =\"Road Frame-W\"\n>>> fuzz.token_sort_ratio(prodNameRef,prodNameComp)\n\
    71\n```\n\n71% 的匹配度并不可靠，因为该产品的描述中还有黑色和银色等其他颜色。80% 以上的匹配度表明匹配度很高。掌握了这一点之后，我们可以读取零售情报服务商数据中的每一行数据，并将其与渥太华县自行车公司数据库中的每个值进行比对，直到找到匹配项。\n"
- fmt: '# Data Matching Program


    To find matches in the retail intelligence service data, a `.csv` file with the
    correct names of products is compared to a `.csv` file with the product names
    from the retail intelligence service. The first ten lines of the `.csv` file with
    correct product names are shown below:


    ```

    HL Mountain Frame - Black,Components

    HL Mountain Frame - Silver,Components

    ML Road Frame - Red,Components

    LL Road Frame - Red,Components

    LL Road Frame - Black,Components

    HL Road Frame - Red,Components

    LL Mountain Front Wheel,Components

    ML Mountain Front Wheel,Components

    LL Mountain Handlebars,Components

    ML Mountain Handlebars,Components

    ```


    The first ten lines of the file with the retail intelligence data are shown next:


    ```

    Mountain Frame - Bl,Harrison Bike Company,Gibsonbug,OH,43431

    HL Mountain Frame - Silver,Harrison Bike Company,Scottsdale,AZ,85252

    ML Road Frme - R,Harrison Bike Company,Chicago,IL,60662

    LL Road Frame - Red,Harrison Bike Company,Davenport,IA,52801

    Road Frame - Blk,Harrison Bike Company,Chenoa,IL,61726

    HL Road Frame - Red,All Star Bicycle,Cincinnati,OH,45205

    Mountain Front ,All Star Bicycle,Durango,CO,81301

    ML Mountain Front Wheel,All Star Bicycle,Catskill,NY,12414

    Mountain Handbars,All Star Bicycle,Carey,NC,27511

    ML Mountain Handbars,All Star Bicycle,Lake Tahoe,CA,96150

    ```


    This is dirty data; it has product names that may not be correct. It also contains
    a city name, state abbreviation, and zipcode of where each item was sold. For
    this example, though, we are only cleansing the product names.


    Notice that the dirty data has names that appear to be truncated or altered from
    the original, like "Mountain Frame – Bl," where "Bl" is usually black. Using fuzzy
    matching, we are able to pair records like this with the correct product name.
    The program below loops through the retail intelligence data and the reference
    data, and uses the `fuzz.token_sort_ratio` to perform a comparison between the
    two sets of data. The variable `strongMatch` is used to store the minimum match
    criteria, and is set to 80 percent.


    This is a longer program than the last example, so we won''t go through a line-by-line
    explanation. The output from the program is to the screen or console instead of
    to a file. This is so that we can check to see if the program is in fact finding
    good matches between the two datasets. Once this is verified, the program can
    be modified to write to a `.csv` file that can be used to create a dataset in
    the Salesforce Analytics Cloud.


    ```

    1 #!/usr/bin/python

    2 from fuzzywuzzy import fuzz

    3 from fuzzywuzzy import process

    4 inputFileRef="/u01/import/csv/listComponents.csv"

    5 inputFileCompare="/u01/import/csv/compareProductsList.csv"

    6 outputFile="/u01/output/OttawaCountyBikesProductsList.txt"

    7 strongMatch = 80

    8 # open scrape file and put in a list

    9 fp = open(inputFileRef, ''Ur'')

    10 ref_data_list = []

    11 for line in fp:

    12    ref_data_list.append(line.strip().split('',''))

    13      # open

    14      fp = open(inputFileCompare, ''Ur'')

    15      comp_data_list = []

    16      for line in fp:

    17              comp_data_list.append(line.strip().split('',''))

    18      outfile = open(outputFile, "w")

    19      for l in ref_data_list:

    20              a_list = str(l).split(",")

    21              prodNameRef=a_list[0]

    22              for line in comp_data_list:

    23                      #print(line)

    24                      comp_data_list = str(line).split(",")

    25                      prodNameComp=comp_data_list[0]

    26                      prodComp = fuzz.token_sort_ratio(prodNameRef,prodNameComp)

    27                      if prodComp >= strongMatch:

    28                              print "----------------------------------------------"

    29                              print "Ref   %s " % prodNameRef.strip(''['')

    30                              print "Comp  %s  " % prodNameComp.strip(''['')

    31                              print "Match %s " % prodComp

    32 outfile.close()

    ```


    The output from the program is shown next:


    ```

    ----------------------------------------------

    Ref   ''HL Mountain Frame - Black''

    Comp  ''Mountain Frame - Bl''

    Match 85

    ----------------------------------------------

    Ref   ''HL Mountain Frame - Silver''

    Comp  ''HL Mountain Frame - Silver''

    Match 100

    ----------------------------------------------

    Ref   ''ML Road Frame - Red''

    Comp  ''ML Road Frme - R''

    Match 90

    ----------------------------------------------

    Ref   ''ML Road Frame - Red''

    Comp  ''LL Road Frame - Red''

    Match 94

    ----------------------------------------------

    Ref   ''ML Mountain Frame - Black''

    Comp  ''Mountain Frame - Bl''

    Match 85

    ----------------------------------------------

    Ref   ''HL Mountain Front Wheel''

    Comp  ''ML Mountain Front Wheel''

    Match 96

    ----------------------------------------------

    Ref   ''LL Mountain Frame - Black''

    Comp  ''Mountain Frame - Bl''

    Match 85

    ----------------------------------------------

    Ref   ''LL Mountain Frame - Silver''

    Comp  ''HL Mountain Frame - Silver''

    Match 96

    ----------------------------------------------

    Ref   ''ML Mountain Frame-W - Silver''

    Comp  ''HL Mountain Frame - Silver''

    Match 92

    ```


    This example shows the capabilities of Python for prototyping with a library like
    Fuzzywuzzy using the Python command line, followed by development of a program
    to validate the basic approach. Creating a dataset from the cleansed data into
    the Salesforce Analytics Cloud would then be the next step, by writing to a `.csv`
    file.


    ## Python Resources


    Python is already in widespread use by IT professionals because of its versatility
    and ease of use. If you''re interested in learning more about Python, visit the
    website [`http://www.learnpython.org`](http://www.learnpython.org/), which has
    free online tutorials where you can run Python code in a web browser. The instructional
    resources mentioned earlier in this chapter are also excellent for beginners.


    One of the reasons Python is a great language for data processing is the rich
    set of code examples and libraries available on the Internet. If you are faced
    with a particular data processing task, you can easily find a Python code example
    or a Python library that meets your needs simply by using an Internet search engine.
    The best resource for finding Python libraries is the Python Package Index, or
    the PyPI. The PyPI is also referred to as the "Cheeseshop" among Python programmers.
    You can find the PyPI at the following URL: [`https://pypi.python.org/pypi`](https://pypi.python.org/pypi).


    The PyPI contains a listing of over 70,000 packages that is curated and broken
    into categories. There are over 2,000 libraries available for text processing.
    The PyPI also has a powerful search feature. In the second example, we used a
    library called Fuzzywuzzy to perform fuzzy logic data matching. Search for "fuzzy"
    on the PyPI, and you can find other Python libraries that are based on fuzzy logic.


    ## Conclusion


    This chapter examined three types of software tools that deliver three types of
    capabilities related to data acquisition. An example dashboard in the Salesforce
    Analytics Cloud was shown to highlight two of the software tools. We also discussed
    data processing and defined terms used to describe three data processing activities:
    data wrangling, data processing, and data standards enforcement.


    The second half of the chapter was an introduction to the Python programming language,
    followed by two examples of data cleansing using Python. Equipped with the tools
    presented in this chapter, you can acquire data from web sources and file systems,
    and perform data processing on the data to bring it into the Salesforce Analytics
    Cloud.'
