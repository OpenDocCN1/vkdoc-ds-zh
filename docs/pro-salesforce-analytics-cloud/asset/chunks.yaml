  trans: '

    ### Salesforce 分析云的两种版本


    Salesforce 分析云有两个版本，各自面向不同的受众。此处不涉及定价，因为价格随时可能变动；如有定价相关问题，请联系您的销售代表。这两个版本如下所述。


    #### Wave 分析应用


    这是 Salesforce 分析云的“轻量”版本，仅允许用户在 Salesforce 数据上执行数据探索。它不允许用户将自己的数据上传至 Salesforce
    分析云的数据集中。这个较简单的版本面向那些只想将 Salesforce 分析云与 Salesforce 数据结合使用的销售经理和个人用户。它被宣传为“即开即用”，并且非常易于使用。


    此版本的用户被限制在总数据集为 2500 万行以内。不过，他们可以自定义仪表板，并从 Cloud Explorer 将数据共享到 Salesforce Chatter，或通过电子邮件共享。


    #### Wave 分析平台


    此版本的 Salesforce 分析云本质上提供了 Salesforce 分析云的完整功能。用户可以使用`.csv`文件或包括 ETL 工具在内的多种其他方法，将自己的数据上传到数据集中。（我们将在第
    4 章中介绍 ETL 工具。）程序员可以通过应用程序编程接口（API）将数据加载到 Salesforce 分析云中，并且它具有更通用的数据发现能力；本质上，它可以被视为其他供应商提供的数据发现产品的替代方案。Wave
    分析平台是本书的重点，所有的用例和示例都说明了如何从非 Salesforce 数据源创建项目。


    此平台对每位用户的总数据行数限制为 1 亿行。Salesforce 为该平台提供了 24/7 全天候支持，以及无限的免费培训和专属的“成功代表”，以确保客户获得良好体验。


    ### Cloud Explorer 入门


    即使您只是在试用评估 Salesforce CRM，Salesforce 也使得尝试 Wave 相对容易。要试用 Wave，您必须创建一个具有 Wave 分析权限的权限组，然后将此权限集分配给用户。此过程在
    Salesforce Wave 联机帮助中有详细说明，因此我们在此不赘述步骤。


    #### 启动 Cloud Explorer


    权限集配置好后，用户即可从控制台右上角的 Salesforce 应用程序菜单启动 Wave 分析。如图 2-1 所示。


    ![A978-1-4842-1203-5_2_Fig1_HTML.jpg](img/A978-1-4842-1203-5_2_Fig1_HTML.jpg)


    图 2-1. 从 Salesforce 控制台启动 Cloud Explorer


    一旦 Cloud Explorer 启动，您将看到主屏幕，并可以开始使用此产品的功能。这些可能性如图 2-2 所示。


    ![A978-1-4842-1203-5_2_Fig2_HTML.jpg](img/A978-1-4842-1203-5_2_Fig2_HTML.jpg)


    图 2-2. Cloud Explorer 主屏幕


    主屏幕中间是一个允许您按名称搜索对象的框。搜索栏下方是 Cloud Explorer 中四个主要对象的选项卡：数据集、透镜、仪表板和应用程序。


    首先创建数据集。从数据集中创建透镜；透镜用于创建在仪表板编辑器中操作的数据视图。请注意，如果底层数据发生变化，数据视图也会随之改变。主屏幕右上角有两个按钮，如图
    2-3 的特写视图所示。


    ![A978-1-4842-1203-5_2_Fig3_HTML.jpg](img/A978-1-4842-1203-5_2_Fig3_HTML.jpg)


    图 2-3. Cloud Explorer 主屏幕右上角的按钮


    左侧按钮切换到 Cloud Explorer 中所有对象的紧凑列表视图；此列表对于拥有大量对象的用户非常有用。该按钮也可用于切换回缩略图视图。


    右侧按钮用于创建数据集和应用程序，如图 2-4 所示。


    ![A978-1-4842-1203-5_2_Fig4_HTML.jpg](img/A978-1-4842-1203-5_2_Fig4_HTML.jpg)


    图 2-4. Cloud Explorer 的创建按钮，用于创建应用程序或数据集


    创建数据集是使用 Cloud Explorer 和创建对象的第一步。按下此按钮后，您将看到如图 2-5 所示的屏幕。


    ![A978-1-4842-1203-5_2_Fig5_HTML.jpg](img/A978-1-4842-1203-5_2_Fig5_HTML.jpg)


    图 2-5. 创建数据集的屏幕


    我们将在第 3 章中详细讨论实际创建数据集的过程。现在，让我们继续检查 Cloud Explorer 中的每种对象类型。我们从数据集开始。


    ### 数据集


    数据集是数据的容器。Salesforce 分析云中使用的所有数据都保存在数据集中。这些数据集驻留在基于云的服务器上，该服务器在后台运行，为 Cloud Explorer
    应用程序提供数据。Wave 数据服务器是性能的关键；它能够快速摄取包含数千行数据的数据——事实上，只需几分钟。一旦创建了数据集，Wave 会实时快速执行该数据的聚合、过滤、排序和呈现，并将其提供给
    Wave 用户界面。


    放入 Wave 数据服务器的数据存储在一个“分面”数据库中，其唯一目的是支持数据的快速检索；最重要的是，它是一个响应迅速的用户界面。除了 Wave 用户界面或
    API 之外，无法通过任何其他方式访问放入 Wave 服务器的数据。也就是说，不能在数据服务器中修改记录。实际上，可以对 Wave 数据服务器执行的操作只有三个：创建数据集、更新数据集和删除数据集。


    此外，进入 Wave 的数据是“单向”的。Wave 服务器并非通用目的；实际上，没有实用的方法可以像对传统数据库服务器那样对 Wave 数据服务器运行查询。


    #### 数据集的行级安全


    保护数据安全始终是数据库方面的一个关注点。例如，某些记录可能很敏感，不应被所有人查看。默认情况下，用户可以访问数据集中的所有数据，但 Cloud Explorer
    具有行级安全功能，可以限制对某些记录的访问。


    要实现行级安全，您需要为您希望限制访问的每个数据集定义一个谓词或过滤器。我们不会在本章中介绍安全谓词，但将在第 4 章中提及它们。


    ### 透镜


    透镜是数据集中数据的视图。开发视图是在 Cloud Builder 内执行的多步骤过程，这在第 3 章中会介绍。一旦透镜完成，它可以单独使用，也可以集成到仪表板中。为了更好地理解透镜，我们更详细地介绍视图的要素。

