    ### 第三步 – 修改元数据并创建数据集


    第三步涉及在 Salesforce Analytics Cloud 中实际创建数据集。在图 6-7 中，消息框右上角有一个“下一步”按钮。按下此按钮将打开元数据编辑器。在此编辑器中，`OttawaCountyBikes.csv`
    中的每一列都被映射到三种数据类型之一。让我们快速介绍这三种数据类型：


    *   **度量** 是定量数据，在 Salesforce Analytics Cloud 中，用户可以针对一个或多个维度分析这些数据。度量必须为数值型数据，因为在
    Salesforce Analytics Cloud 中，会对度量执行数学运算。

    *   **维度** 由描述性数据组成，我们通过维度来评估度量。例如，对于总销售额这一度量，其一个维度可能是地理区域，例如州或省。

    *   **日期** 代表时间，其格式必须能被 Salesforce Analytics Cloud 识别为时间数据。通常，从企业软件数据库提取的数据格式是正确的。通常，此数据类型仅包含日期信息，不包含时间信息。


    通常，导入过程能正确判断数据类型。但在某些情况下，用户可能希望修改数据类型。以 `OttawaCountyBikes.csv` 文件中的数据为例，其中包含完全由数字组成的季度数字。导入过程会将其分配为度量，但我们实际上希望将其用作维度。当导入过程发现字段纯粹是数字时，它会自动将该字段设为度量。由于季度数字是数据的属性，并为数据中的度量增加意义，因此需要将其更改为维度。使用图
    6-8 所示的元数据编辑器，我们可以通过单击向右箭头并选择“度量”，将“日历季度”更改为度量。


    ![A978-1-4842-1203-5_6_Fig8_HTML.jpg](img/A978-1-4842-1203-5_6_Fig8_HTML.jpg)


    图 6-8. 用于更改数据类型的表单


    有时谨慎审查度量要使用的小数位数是明智的。注意这一点可以使数据更具可读性，如图 6-9 中“标价”所示。我们选择了两位小数，因为标价总是以元和分的金额表示。


    ![A978-1-4842-1203-5_6_Fig9_HTML.jpg](img/A978-1-4842-1203-5_6_Fig9_HTML.jpg)


    图 6-9. 更改度量的小数位数


    字段类型选择的另一个有趣之处在于它能防止用户做出错误选择。例如，在图 6-10 中，我们尝试将“标价”更改为日期类型，但导入过程提示此操作可能不正确。


    ![A978-1-4842-1203-5_6_Fig10_HTML.jpg](img/A978-1-4842-1203-5_6_Fig10_HTML.jpg)


    图 6-10. 显示了日期字段类型选择错误的提示


    在此消息框中还可以修改数据集的名称。例如，`.csv` 文件的名称是数据集的默认名称，但用户可以自由选择其他名称。


    一旦我们对数据类型满意，就可以通过按下消息框右上角的“导入”按钮来启动导入过程。在导入数据集时，会依次出现一个指示正在进行的消息框，随后是一个指示数据集创建成功的消息框。小型数据集通常可以立即使用，但较大的数据集可能需要一个小时才能就绪。


    ### 第四步 – 创建透镜和仪表板


    数据集创建完成后，用户可以立即开始探索数据，首先创建透镜。本书的第 2 章已对此内容进行了介绍，因此此处不再讨论。


    ## 用例中使用的数据


    我们已经介绍了数据集的创建，现在来看看为渥太华县自行车公司提取的数据，以及用户如何通过使用 Salesforce Analytics Cloud 来获取洞察。


    此用例中的数据涉及销售业绩。渥太华县自行车公司销售各类自行车、配件和自行车零部件，以及骑行服装。其销售通过三种类型的实体进行：专业自行车店、增值经销商和仓库。数据集中的每一行数据都记录了单个交易以及与这些交易相关的销售功能。此数据集中的列包括以下可在
    Salesforce Analytics Cloud 中使用的数据。


    ### 销售金额数据


    - **银行名称**：处理交易的金融机构。

    - **运费**：运费成本。

    - **折扣金额**：给予的折扣。

    - **产品总成本**：产品总成本。

    - **销售金额**：销售额。

    - **税额**：与销售相关的税款金额。


    ### 日期数据


    - **订单日期**：一个或多个产品的订购日期。

    - **日历季度**：订单日期所在的年份季度。

    - **日历年份**：订单数据所在的年份。


    ### 产品数据


    - **产品名称**：所售产品的名称。

    - **产品线**：三个值之一：山地车、公路车或旅行车。

    - **产品类别**：四个值之一：自行车、组件、配件或服装。

    - **产品子类别**：众多值之一，用于更精确地标识产品。可能的几个值包括链条、刹车、帽子、头盔和山地车。


    ### 经销商数据


    - **全名**：渥太华县自行车公司中负责此次销售的销售代表。

    - **经销商名称**：发起销售的公司的名称。

    - **经销商类型**：三个值之一：专业自行车店、增值经销商和仓库。

    - **销售区域-国家**：销售区域所在的国家。

    - **销售区域-地区**：销售区域国家内的地区。

    - **州/省名称**：州或省的名称。

    - **城市**：州或省内的城市。

    '
- fmt: '# Dashboard Development Cycle


    Ottawa County Bike Company is a multinational company that makes and distributes
    products sold in U.S. markets, Canada, The United Kingdom, Germany, Australia,
    and France. North American is the biggest market for the company, and this business
    unit is the focus of the first dashboards we develop here. With the dataset created
    as described in the previous sections, we can now create lenses on the dataset
    that can be used to build dashboards.


    To begin analysis of the sales data, we use the `Sales Amount` measure, and apply
    dimensions as needed to understand performance. To evaluate North American performance,
    we apply a filter to the `Sales Territory—Country` dimension, selecting United
    States and Canada. The dataset includes sales data for 2013, 2014, and 2015. The
    2015 data has partial information for the third and fourth quarters, so the sales
    data for this year is incomplete, and this will likely be reflected in the dashboards.


    For the primary chart on this dashboard, we select two time dimensions: `Calendar
    Year` and `Calendar Quarter`. The interface used to set the two filters on `Sales
    Territory—Country` and the two dimensions is shown in Figure [6-11](#A978-1-4842-1203-5_6_Chapter.html#Fig11).


    ![A978-1-4842-1203-5_6_Fig11_HTML.jpg](A978-1-4842-1203-5_6_Fig11_HTML.jpg)


    Figure 6-11. Filter on Canada, United States, and group by measures of `Calendar
    Year` and `Calendar Quarter`


    Using these two dimensions with a horizontal bar chart, we develop an excellent
    visualization for quarterly performance. The initial version of the bar graph
    is shown in Figure [6-12](#A978-1-4842-1203-5_6_Chapter.html#Fig12).


    ![A978-1-4842-1203-5_6_Fig12_HTML.jpg](A978-1-4842-1203-5_6_Fig12_HTML.jpg)


    Figure 6-12. Initial bar chart for quarterly performance


    The real power of the data discovery tools lies in their ability to apply refinements
    at will and display how the data changes. For this dashboard, we use the toggle
    widget to apply such refinements.


    There are three refinements we use with the toggle widgets: `Product Line`, `Sales
    Territory—Region`, and `Product Category`. The dashboard with the widget in place
    is shown in Figure [6-13](#A978-1-4842-1203-5_6_Chapter.html#Fig13).


    ![A978-1-4842-1203-5_6_Fig13_HTML.jpg](A978-1-4842-1203-5_6_Fig13_HTML.jpg)


    Figure 6-13. Sales Performance dashboard with widgets near top


    The widgets provide the ability to apply any refinement to the dashboard simply
    by pressing them. The widgets offer additional insight by indicating the relative
    contribution to the `Sales Data` measure for the dimension. For example, with
    no refinements applied using any of the widgets, and by simple inspection of the
    `Sales Region` widget, we can see that the Southwest region was the leading sales
    area, with $18,272,915 in sales, followed by Canada with $14,272,776. In similar
    fashion, the `Product Lines` selector widget shows that of the three product lines—Mountain,
    Road, and Touring—the Road product line is the clear leader, with approximately
    $30 million in sales, followed closely by Mountain, with approximately $29 million
    in sales. Note that on the mobile interface, the toggle control is “scrollable”
    by swiping either left or right to view other values. For example, if we scroll
    right on the `Sales Region` toggle, we will see other regions.


    Let’s get back to the bar chart for quarterly sales. With this chart, comparing
    performance from year to year for a particular quarter is easy. In the case of
    the first quarter, steady improvement is shown from 2013 through 2015, with sales
    of $4.1 million in 2013, $4.8 million in 2014, and $5.1 million in 2015.


    To go inside the performance, though, we can click on a bar chart segment, and
    this quarter can be used as a refinement. For example, if we click on quarter
    1 of the 2013 bar chart segment, we see the other widgets on the dashboard change
    to reflect the refinement. Clicking on quarter 1 or the 2014 segment changes the
    refinement—and again, the other widgets on the dashboard change to reflect this
    refinement. Figures [6-14](#A978-1-4842-1203-5_6_Chapter.html#Fig14) and [6-15](#A978-1-4842-1203-5_6_Chapter.html#Fig15)
    show this change.


    ![A978-1-4842-1203-5_6_Fig15_HTML.jpg](A978-1-4842-1203-5_6_Fig15_HTML.jpg)


    Figure 6-15. Quarter 1 of 2014 is selected


    ![A978-1-4842-1203-5_6_Fig14_HTML.jpg](A978-1-4842-1203-5_6_Fig14_HTML.jpg)


    Figure 6-14. Quarter 1 of 2013 is selected'
