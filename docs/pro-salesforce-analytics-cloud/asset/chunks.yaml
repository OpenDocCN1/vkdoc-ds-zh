- fmt: '# An Alternative to the Data Lake


    For organizations working to find a strategy for managing the 80 to 90 percent
    of their data that is semi-structured or unstructured, which can co-exist with
    data originating from structured sources, the `Salesforce Analytics Cloud` is
    an alternative. No data discovery solution has the capacity of `HDFS`, so is not
    appropriate for the capture of massive volumes of data. However, for data that
    is unstructured, that does not have high volume or velocity, the `Salesforce Analytics
    Cloud` can be an alternative to dumping the data into a data lake.


    The advantage of this scenario is that many data sources can be loaded into the
    `Salesforce Analytics Cloud` datasets with little or no involvement from IT personnel.
    With the `Salesforce Analytics Cloud`, users can create applications to provide
    graphics and tabular viewing tools that have short development cycles, often only
    a few hours.


    The `Salesforce Analytics Cloud` can also be used to develop dashboards and quick
    reports against sources that are entirely transactional. With data discovery tools,
    it is far easier to “go the last mile” than with traditional BI and reporting
    tools. Users have less inclination to create “rogue” business processes by running
    ad hoc queries into office tools like `Microsoft Excel` to perform analysis, and
    will instead use the `Salesforce Analytics Cloud`.


    ## Introduction to the Salesforce Analytics Cloud


    Let’s take a closer look at the `Salesforce Analytics Cloud` and see its two major
    platforms: mobile and desktop. Keep in mind that this information is merely an
    overview of features that are covered in more detail in [Chapters 2](#A978-1-4842-1203-5_2_Chapter.html),
    [3](#A978-1-4842-1203-5_3_Chapter.html), and [4](#A978-1-4842-1203-5_4_Chapter.html).


    ### The Mobile Platform


    The `Salesforce Analytics Cloud` provides “analytics to go,” with its mobile-first
    emphasis. Now, analytics are no farther away than your back pocket. During the
    heady days of the `Apple iPhone` release in 2007, `Steve Jobs` stressed that the
    `iPhone` was something you would slip into the back pocket of your blue jeans,
    a mobile computing platform always available, no farther away than your wallet
    or keys.


    Since the release of the `iPhone`, mobile access has been one of the most compelling
    applications of cloud computing, using its touch display to provide a rich interface
    connecting to a cloud-based infrastructure—yet one that remains hidden from the
    user. Smartphones and their direct descendants, tablet computers, have been primarily
    used for consuming data, mostly owing to the difficulty of creating content on
    a small screen and an onscreen keyboard. However, as users have begun considering
    these devices as the primary interface in their digital lives, software designers
    have responded by providing mobile applications that have sophisticated capabilities
    for creating content. The `Salesforce Analytics Cloud` follows this trend, allowing
    users to upload data, create views on the data, then incorporate those views into
    dashboards.


    With the `Salesforce Analytics Cloud` mobile app, users can provision datasets
    from comma-separated value (`.csv`) files, tab separated-value files (`TSV`),
    `Microsoft Excel` files, and zip files containing these file types. The files
    are accessed from a mobile device, including files from websites, email attachments,
    and file repository services like `Dropbox` and `Salesforce` files. Once a dataset
    is created, users can create “lenses,” which are views of the data using filters
    and sortation. The lenses have either a graphic or a tabular component, viewable
    on the mobile device. Dashboards can be accessed and created on mobile devices
    as well; they are collections of lenses that provide multiple or combined views
    of the data. Users can share their findings with others by taking screenshots
    of graphic elements or sending the `.csv` extracts from tabular components.


    In April 2015, `Apple` released the `Apple Watch`, a device that `Apple` calls
    its “most personal device ever.” The `Salesforce Analytics Cloud` has an application
    for the `Apple Watch` that provides access to dashboards or lens, allowing users
    to navigate their data using the watch’s touch screen interface and digital crown.


    Figure [1-4](#A978-1-4842-1203-5_1_Chapter.html#Fig4) shows the major components
    of the `Salesforce Analytics Cloud` for the mobile analytics experience.


    ![A978-1-4842-1203-5_1_Fig4_HTML.jpg](A978-1-4842-1203-5_1_Fig4_HTML.jpg)


    Figure 1-4.


    Components of the `Salesforce Analytics Cloud` for mobile use


    ### The Desktop Platform


    Figure [1-5](#A978-1-4842-1203-5_1_Chapter.html#Fig5) shows the components of
    the `Salesforce Analytics Cloud` desktop capabilities.


    ![A978-1-4842-1203-5_1_Fig5_HTML.jpg](A978-1-4842-1203-5_1_Fig5_HTML.jpg)


    Figure 1-5.


    Components of the `Salesforce Analytics Cloud` for desktop use


    The `Salesforce Analytics Cloud` desktop interface is the `Analytics Cloud Explorer`
    that allows users to create and use data discovery applications and dashboards.
    It can be accessed from a web browser, and it provides all the capabilities available
    from mobile interfaces, as well as additional features with regard to organizational
    and development capabilities. The `Analytics Cloud Explorer` has the same capabilities
    as described for the mobile app, but also the ability to create datasets from
    `Salesforce` objects. Once the datasets are created, they can be explored, allowing
    users to drill into and filter the data. During this exploration of data, users
    can create lenses, and these lenses can be used on the mobile app as well.


    Additional functionality of the `Analytics Cloud Explorer` includes creating dashboards
    from lenses using an editor with graphic and tabular elements, along with widgets
    for creating text boxes, other graphic elements, and hyperlinks. Inside the dashboards,
    when a user drills into a dataset on one component, all the other components in
    the dashboard are updated. Put another way, if a user refines any data, all the
    other components in the dashboard are changed to reflect this refinement. This
    powerful feature allows coordinated exploration of data with all controls in a
    dashboard, as well as facilitating data discovery.


    The highest level of abstraction in the `Analytics Cloud Explorer` is its apps,
    which can include many dashboards, lenses, and datasets. The apps can be thought
    of as containers for all of those objects, serving primarily as a grouping or
    bundling mechanism. Within the apps can be dashboards, lenses, and datasets. The
    contents of an app are left to the discretion of the users. For example, a user
    developing data discovery analytics around meteorological data might include a
    dataset from `NOAA`, along with dashboards and lenses within the app, but could
    also include datasets with data from an academic source or data collected by meteorological
    agencies outside the United States.


    ## Advantages of the Salesforce Analytics Cloud


    Now data discovery products are not new to the world of analytics and business
    intelligence, of course, and when the `Salesforce Analytics Cloud` was introduced
    in 2014, into an already crowded market, this may have been viewed as a disadvantage.
    However, by coming in later the `Salesforce Analytics Cloud` has avoided the pitfalls
    and limitations experienced with earlier data discovery products.'
