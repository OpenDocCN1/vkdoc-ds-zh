- fmt: "### Text Analytics Processors\n\nText analytic processors are standalone applications\
    \ that receive text from any source and locate specific entities in the text,\
    \ like people, places, and things. They take the effort out of analyzing large\
    \ amounts of text data. Many text analytic processors also provide sentiment analysis,\
    \ or an overview of the positive, neutral, or negative status for a body of text.\
    \ This feature is commonly applied when processing consumer comments on products.\
    \ Text analytics processors can also summarize the output from both web scrapers\
    \ and web crawlers.\n\n### Applications of These Tools\n\nSo, how are these tools\
    \ applied to the acquisition of data? Let’s examine a design pattern, with our\
    \ example being some consumer research on data from a web retailer. The tools\
    \ just described are used to extract data that can then be incorporated into the\
    \ `Salesforce Analytics Cloud`, thereby showing overall ratings of the company’s\
    \ product, along with its price. This design pattern is shown in Figure [7-1](#A978-1-4842-1203-5_7_Chapter.html#Fig1).\n\
    \n![A978-1-4842-1203-5_7_Fig1_HTML.jpg](A978-1-4842-1203-5_7_Fig1_HTML.jpg)\n\n\
    Figure 7-1. Design pattern for web scraper and text analytics processor\n\nAlthough\
    \ the `Salesforce Analytics Cloud` is oriented toward numeric data, it can still\
    \ be used to analyze data from web scrapers. The web scraper extracts price and\
    \ numeric ratings, which are numeric. The text analytics processor uses sentiment\
    \ analysis to determine whether a product review is positive, neutral, or negative.\
    \ The query consumed by the `.csv` extract processor contains one record for each\
    \ review.\n\nFigure [7-2](#A978-1-4842-1203-5_7_Chapter.html#Fig2) shows a dashboard\
    \ that is created in the `Salesforce Analytics Cloud` with this customer review\
    \ data.\n\n![A978-1-4842-1203-5_7_Fig2_HTML.jpg](A978-1-4842-1203-5_7_Fig2_HTML.jpg)\n\
    \nFigure 7-2. Dashboard created from customer review data\n\nThe dashboard provides\
    \ a clear overview of the data. Customers who had paid more than $40 for the product\
    \ left negative reviews. It is clear, however, that there is no correlation between\
    \ sentiment and rating. Positive and neutral sentiments differ only by 0.1 in\
    \ the average rating values. Ultimately, the raw data tells a story that confirms\
    \ the correlations among negative sentiments, low ratings, and price, with terms\
    \ extracted like “overpriced,” “expensive,” and even “criminal.”\n\nNote that\
    \ rating and price were used as both dimension and measure in the dataset. This\
    \ is because sometimes a numeric measure can often give insight about a different\
    \ numeric measure when it is used as a dimension. In this case, price as both\
    \ a dimension and a measure provides insight into rating.\n\n## Data Processing—Terms\
    \ and Concepts\n\nAs mentioned at the start of this chapter, it is valuable to\
    \ understand the nature of data processing and how a particular technology can\
    \ be used. Simply put, data processing is the manipulation of data to make it\
    \ useful. The `Salesforce Analytics Cloud` and other tools cannot use data unless\
    \ there has already been data processing done on the data. As we know from [Chapter\
    \ 4](#A978-1-4842-1203-5_4_Chapter.html), the `Salesforce Analytics Cloud` can\
    \ only consume data that is in `.csv` format. But there is other data processing\
    \ that must also occur to ensure that the lenses and dashboards in the `Salesforce\
    \ Analytics Cloud` have meaningful and accurate data.\n\nTo better understand\
    \ data processing, let’s review some terms and concepts associated with it. These\
    \ concepts include data wrangling, data standards, data quality and data cleansing,\
    \ and enforcement of data standards.\n\n### Data Wrangling\n\nData wrangling refers\
    \ to the conversion of data from one format to another so as to make the data\
    \ usable. It often starts as a manual prototyping phase and leads to a well-defined\
    \ sequence of steps. For example, Twitter makes data available about Tweets in\
    \ a JSON document. If you want to put data originating in Twitter into the `Salesforce\
    \ Analytics Cloud`, you need to extract the fields available within Twitter into\
    \ a `.csv` file before it can be put into a dataset.\n\n### Data Standards\n\n\
    Data standards are rules regarding the format of data in an organization or held\
    \ by governing agencies. Data standards ensure that the data in any system will\
    \ be consistent with regard to formatting and content. Thus, data standards are\
    \ usually enforced before the data is consumed and occurs when users enter the\
    \ data or when the data is received from an outside source.\n\nFor example, many\
    \ sources of data from suppliers or vendors use varying abbreviations for things\
    \ like state names or road types. To ensure consistency, every occurrence of a\
    \ road name in the address data might be changed to `\"Rd.\"` and every occurrence\
    \ of a street name is converted to `\"St.\"`.\n\n### Data Quality\n\nData quality\
    \ is the extent to which data complies with data standards and is free of corrupt\
    \ or incomplete records. Data that is fragmented and incomplete is considered\
    \ low data quality and has a low level of compliance with data standards.\n\n\
    ### Data Cleansing\n\nData cleansing is the process of detecting and removing\
    \ corrupt or incomplete records from data. Data cleansing may be performed in\
    \ conjunction with data wrangling (see above). Data cleansing can also involve\
    \ removal of duplicated records and enforcement of data standards. Data cleansing\
    \ produces data with high data quality. Before data cleansing can be done on data,\
    \ the data is usually called “dirty data.” Dirty data is made “clean” by data\
    \ cleansing.\n\n## Python: A Programming Language for Data Processing\n\nSit through\
    \ enough conference presentations, and you will realize that not every task associated\
    \ with data processing can be accomplished within the confines of the ETL tools\
    \ discussed in [Chapter 4](#A978-1-4842-1203-5_4_Chapter.html), or with database\
    \ server side programming or Java. Python has emerged as the golden thread stitching\
    \ together many data-centric applications. It is the choice for many IT professionals,\
    \ as it is a technology that can be used for data cleansing and wrangling.\n\n\
    At the 2015 Business Intelligence, Warehousing, and Analytics Summit, many thought\
    \ leaders delivered presentations that involved Python being used to load or transform\
    \ data. In the presentations at this conference, Python did not function in place\
    \ of ETL tools, or database server-side programming, but instead provided the\
    \ functionality or connectivity that is lacking in these other platforms. With\
    \ so many popular programming languages like Java and Microsoft Visual Basic,\
    \ why has Python become so popular for the tasks associated with data processing?\
    \ When you look at the advantages of Python, it’s not hard to understand.\n\n\
    ### Readability and Ease of Use\n\nMany programming languages use special characters\
    \ as delimiters for code blocks and statements. For example, in the “C” programming\
    \ language, curly brackets (`\"{\"` and `\"}\"`) are used to designate code blocks,\
    \ and semicolons are used to designate the ends of lines. You can’t get away from\
    \ these special characters, even in the most basic “Hello, World” type program,\
    \ like the one shown below:\n\n```\n{\n    printf(\"Hello,\nWorld\");\n}\n```\n\
    \nIt is a common practice for programmers to use indentation to organize their\
    \ code. Python avoids the use of special characters and uses indentation to designate\
    \ code blocks, since most programmers already use indentation to organize their\
    \ code. In Python, the “Hello, World” example simply becomes the version shown\
    \ below, free of special characters.\n\n```\nprint \"Hello, World!\"\n```\n\n\
    This readability makes Python easy to learn and use, especially by those who do\
    \ not work as full-time programmers, but who need to perform data processing tasks—people\
    \ like business analysts and database administrators."
  raw: '### Text Analytics Processors


    Text analytic processors are standalone applications that receive text from any
    source and locate specific entities in the text, like people, places, and things.
    They take the effort out of analyzing large amounts of text data. Many text analytic
    processors also provide sentiment analysis, or an overview of the positive, neutral,
    or negative status for a body of text. This feature is commonly applied when processing
    consumer comments on products. Text analytics processors can also summarize the
    output from both web scrapers and web crawlers.


    ### Applications of These Tools


    So, how are these tools applied to the acquisition of data? Let’s examine a design
    pattern, with our example being some consumer research on data from a web retailer.
    The tools just described are used to extract data that can then be incorporated
    into the Salesforce Analytics Cloud, thereby showing overall ratings of the company’s
    product, along with its price. This design pattern is shown in Figure [7-1](#A978-1-4842-1203-5_7_Chapter.html#Fig1).


    ![A978-1-4842-1203-5_7_Fig1_HTML.jpg](A978-1-4842-1203-5_7_Fig1_HTML.jpg)


    Figure 7-1.


    Design pattern for web scraper and text analytics processor


    Although the Salesforce Analytics Cloud is oriented toward numeric data, it can
    still be used to analyze data from web scrapers. The web scraper extracts price
    and numeric ratings, which are numeric. The text analytics processor uses sentiment
    analysis to determine whether a product review is positive, neutral, or negative.
    The query consumed by the .csv extract processor contains one record for each
    review.


    Figure [7-2](#A978-1-4842-1203-5_7_Chapter.html#Fig2) shows a dashboard that is
    created in the Salesforce Analytics Cloud with this customer review data.


    ![A978-1-4842-1203-5_7_Fig2_HTML.jpg](A978-1-4842-1203-5_7_Fig2_HTML.jpg)


    Figure 7-2.


    Dashboard created from customer review data


    The dashboard provides a clear overview of the data. Customers who had paid more
    than $40 for the product left negative reviews. It is clear, however, that there
    is no correlation between sentiment and rating. Positive and neutral sentiments
    differ only by 0.1 in the average rating values. Ultimately, the raw data tells
    a story that confirms the correlations among negative sentiments, low ratings,
    and price, with terms extracted like “overpriced,” “expensive,” and even “criminal.”


    Note that rating and price were used as both dimension and measure in the dataset.
    This is because sometimes a numeric measure can often give insight about a different
    numeric measure when it is used as a dimension. In this case, price as both a
    dimension and a measure provides insight into rating.


    ## Data Processing—Terms and Concepts


    As mentioned at the start of this chapter, it is valuable to understand the nature
    of data processing and how a particular technology can be used. Simply put, data
    processing is the manipulation of data to make it useful. The Salesforce Analytics
    Cloud and other tools cannot use data unless there has already been data processing
    done on the data. As we know from [Chapter 4](#A978-1-4842-1203-5_4_Chapter.html),
    the Salesforce Analytics Cloud can only consume data that is in .csv format. But
    there is other data processing that must also occur to ensure that the lenses
    and dashboards in the Salesforce Analytics Cloud have meaningful and accurate
    data.


    To better understand data processing, let’s review some terms and concepts associated
    with it. These concepts include data wrangling, data standards, data quality and
    data cleansing, and enforcement of data standards.


    ### Data Wrangling


    Data wrangling refers to the conversion of data from one format to another so
    as to make the data usable. It often starts as a manual prototyping phase and
    leads to a well-defined sequence of steps. For example, Twitter makes data available
    about Tweets in a JSON document. If you want to put data originating in Twitter
    into the Salesforce Analytics Cloud, you need to extract the fields available
    within Twitter into a .csv file before it can be put into a dataset.


    ### Data Standards


    Data standards are rules regarding the format of data in an organization or held
    by governing agencies. Data standards ensure that the data in any system will
    be consistent with regard to formatting and content. Thus, data standards are
    usually enforced before the data is consumed and occurs when users enter the data
    or when the data is received from an outside source.


    For example, many sources of data from suppliers or vendors use varying abbreviations
    for things like state names or road types. To ensure consistency, every occurrence
    of a road name in the address data might be changed to “Rd.” and every occurrence
    of a street name is converted to “St.”


    ### Data Quality


    Data quality is the extent to which data complies with data standards and is free
    of corrupt or incomplete records. Data that is fragmented and incomplete is considered
    low data quality and has a low level of compliance with data standards.


    ### Data Cleansing


    Data cleansing is the process of detecting and removing corrupt or incomplete
    records from data. Data cleansing may be performed in conjunction with data wrangling
    (see above). Data cleansing can also involve removal of duplicated records and
    enforcement of data standards. Data cleansing produces data with high data quality.
    Before data cleansing can be done on data, the data is usually called “dirty data.”
    Dirty data is made “clean” by data cleansing.


    ## Python: A Programming Language for Data Processing


    Sit through enough conference presentations, and you will realize that not every
    task associated with data processing can be accomplished within the confines of
    the ETL tools discussed in [Chapter 4](#A978-1-4842-1203-5_4_Chapter.html), or
    with database server side programming or Java. Python has emerged as the golden
    thread stitching together many data-centric applications. It is the choice for
    many IT professionals, as it is a technology that can be used for data cleansing
    and wrangling.


    At the 2015 Business Intelligence, Warehousing, and Analytics Summit, many thought
    leaders delivered presentations that involved Python being used to load or transform
    data. In the presentations at this conference, Python did not function in place
    of ETL tools, or database server-side programming, but instead provided the functionality
    or connectivity that is lacking in these other platforms. With so many popular
    programming languages like Java and Microsoft Visual Basic, why has Python become
    so popular for the tasks associated with data processing? When you look at the
    advantages of Python, it’s not hard to understand.


    ### Readability and Ease of Use


    Many programming languages use special characters as delimiters for code blocks
    and statements. For example, in the “C” programming language, curly brackets (“{“
    and “}”) are used to designate code blocks, and semicolons are used to designate
    the ends of lines. You can’t get away from these special characters, even in the
    most basic “Hello, World” type program, like the one shown below:


    `{`


        `printf("Hello`


    World");


    `}`


    It is a common practice for programmers to use indentation to organize their code.
    Python avoids the use of special characters and uses indentation to designate
    code blocks, since most programmers already use indentation to organize their
    code. In Python, the “Hello, World” example simply becomes the version shown below,
    free of special characters.


    `print "Hello, World!"`


    This readability makes Python easy to learn and use, especially by those who do
    not work as full-time programmers, but who need to perform data processing tasks—people
    like business analysts and database administrators.'
  trans: "\n### 文本分析处理器\n\n文本分析处理器是独立的应用软件，能够接收来自任何来源的文本，并定位文本中特定实体，例如人物、地点和事物。它们省去了分析大量文本数据的繁琐工作。许多文本分析处理器还提供情感分析功能，或是对一段文本的正面、中性或负面状态进行概述。此功能在处理消费者对产品的评论时通常会被应用。文本分析处理器还可以汇总来自网页抓取程序和网络爬虫的输出结果。\n\
    \n### 这些工具的应用\n\n那么，这些工具是如何应用于数据采集的呢？让我们探讨一个设计模式，以我们对某网络零售商数据进行的消费者研究为例。前述工具用于提取数据，这些数据随后可被整合到\
    \ `Salesforce Analytics Cloud` 中，从而显示公司产品的总体评分及其价格。这个设计模式如图 7-1 所示。\n\n![A978-1-4842-1203-5_7_Fig1_HTML.jpg](img/A978-1-4842-1203-5_7_Fig1_HTML.jpg)\n\
    \n图 7-1. 网页抓取程序和文本分析处理器的设计模式\n\n尽管 `Salesforce Analytics Cloud` 主要面向数值数据，但它仍可用于分析来自网页抓取程序的数据。网页抓取程序提取价格和数值评分，这些数据都是数字。文本分析处理器则使用情感分析来确定产品评论是正面、中性还是负面的。由\
    \ `.csv` 提取处理器处理的查询包含每条评论的一条记录。\n\n图 7-2 显示了一个在 `Salesforce Analytics Cloud` 中使用这些客户评论数据创建的仪表盘。\n\
    \n![A978-1-4842-1203-5_7_Fig2_HTML.jpg](img/A978-1-4842-1203-5_7_Fig2_HTML.jpg)\n\
    \n图 7-2. 根据客户评论数据创建的仪表盘\n\n该仪表盘提供了数据的清晰概览。支付超过 40 美元购买该产品的客户留下了负面评论。然而，很明显，情感倾向与评分之间没有相关性。正面和中性情感的平均评分值仅相差\
    \ 0.1。最终，原始数据揭示了一个故事，证实了负面情绪、低评分和价格之间的相关性，并提取了诸如“价格过高”、“昂贵”，甚至“可恶”等词汇。\n\n请注意，评分和价格在数据集中既被用作维度，也被用作度量。这是因为，当一个数值度量被用作维度时，它有时可以揭示关于另一个不同数值度量的洞察。在此案例中，价格同时作为维度和度量，为评分提供了洞察。\n\
    \n## 数据处理——术语与概念\n\n如本章开头所述，理解数据处理的本质以及特定技术的使用方法非常有价值。简而言之，数据处理是对数据的操作，使其变得有用。`Salesforce\
    \ Analytics Cloud` 和其他工具只有在数据经过处理后才能使用数据。正如我们从第 4 章中所知，`Salesforce Analytics Cloud`\
    \ 只能使用 `.csv` 格式的数据。但是，还必须进行其他数据处理，以确保 `Salesforce Analytics Cloud` 中的透镜和仪表盘包含有意义且准确的数据。\n\
    \n为了更好地理解数据处理，让我们回顾一些与之相关的术语和概念。这些概念包括数据整理、数据标准、数据质量和数据清洗，以及数据标准的强制执行。\n\n###\
    \ 数据整理\n\n数据整理是指将数据从一种格式转换为另一种格式，以使数据可用。它通常从一个手动原型设计阶段开始，并最终形成一套定义明确的步骤序列。例如，Twitter\
    \ 以 JSON 文档的形式提供推文数据。如果你想把来自 Twitter 的数据放入 `Salesforce Analytics Cloud`，你需要先将\
    \ Twitter 中的可用字段提取到 `.csv` 文件中，然后才能将其放入数据集。\n\n### 数据标准\n\n数据标准是关于组织内部或管理机构持有的数据格式的规则。数据标准确保任何系统中的数据在格式和内容上保持一致。因此，数据标准通常在数据被使用之前，在用户输入数据或从外部来源接收数据时执行。\n\
    \n例如，来自供应商或卖家的许多数据源使用不同的缩写来表示州名或道路类型等事物。为了确保一致性，地址数据中的所有路名都可能被更改为 `\"Rd.\"`，而所有街名都被转换为\
    \ `\"St.\"`。\n\n### 数据质量\n\n数据质量是数据符合数据标准的程度，并且没有损坏或不完整的记录。碎片化且不完整的数据被认为是低数据质量的，其对数据标准的合规性水平也较低。\n\
    \n### 数据清洗\n\n数据清洗是检测并从数据中移除损坏或不完整记录的过程。数据清洗可以与数据整理（见上文）结合进行。数据清洗还可能涉及删除重复记录和执行数据标准。数据清洗产生高质量的数据。在对数据进行数据清洗之前，这些数据通常被称为“脏数据”。通过数据清洗，脏数据变得“干净”。\n\
    \n## Python：一种用于数据处理的编程语言\n\n如果你参加了足够多的会议演讲，你就会意识到，并非所有与数据处理相关的任务都能在第 4 章讨论的 ETL\
    \ 工具、数据库服务器端编程或 Java 的范围内完成。Python 已成为连接众多以数据为中心的应用程序的金线。它成为许多 IT 专业人士的选择，因为它是一种可用于数据清洗和整理的技术。\n\
    \n在 2015 年商业智能、仓储与分析峰会上，许多思想领袖发表了涉及使用 Python 加载或转换数据的演讲。在此次会议的演讲中，Python 并未取代\
    \ ETL 工具或数据库服务器端编程的功能，而是提供了其他平台所缺乏的功能或连接性。在 Java 和 Microsoft Visual Basic 等众多流行编程语言中，为什么\
    \ Python 在与数据处理相关的任务中变得如此受欢迎？当你审视 Python 的优势时，就不难理解了。\n\n### 可读性与易用性\n\n许多编程语言使用特殊字符作为代码块和语句的分隔符。例如，在“C”编程语言中，花括号（`\"\
    {\"` 和 `\"}\"`）用于指定代码块，分号用于指定行尾。即使是在最基本的“Hello, World”类型的程序中，你也无法摆脱这些特殊字符，如下所示：\n\
    \n```\n{\n    printf(\"Hello,\nWorld\");\n}\n```\n\n程序员通常使用缩进来组织代码。Python 避免使用特殊字符，而是使用缩进来指定代码块，因为大多数程序员已经使用缩进来组织代码。在\
    \ Python 中，“Hello, World”示例简化为如下版本，没有特殊字符。\n\n```\nprint \"Hello, World!\"\n```\n\
    \n这种可读性使得 Python 易于学习和使用，尤其是对于那些并非全职程序员，但需要执行数据处理任务的人——例如业务分析师和数据库管理员。\n"
- fmt: '### Simplicity


    Most programming languages expand and grow over time, and provide many different
    ways to accomplish programming tasks. A good example of this is the PERL programming
    language. The PERL programming language has been designed around a philosophy
    epitomized by the phrase “There is more than one way to do it,” or TMTOWTDI. Python’s
    philosophy rejects this approach. Instead, the Python approach is "There should
    be one—and preferably only one—obvious way to do it." This philosophy helps makes
    Python easier to learn and use than languages like PERL.


    ### Portability


    Python is installed by default on commonly used enterprise versions of the Linux
    operating systems, like Red Hat and SUSE. It comes installed on Mac OSX, and it
    can easily be installed on Microsoft Windows. It is also standard on Solaris,
    the Sun version of Unix, and can be easily installed on the IBM AIX UNIX. Because
    of this portability, Python code can be developed and prototyped on a workstation
    and then moved to an enterprise server.


    ### Design and Debugging


    Python features a command-line interpreter that allows easy testing and debugging
    of any command or series of commands. This eliminates the need for code to be
    developed entirely in editors. It allows simple programs to be tested line by
    line in the interpreter.


    ### Versatility


    There was a time when products that required batteries to operate would use the
    phrase “batteries included” to indicate the product was 100 percent ready to use,
    out of the box. Think of Python as the programming language that has “batteries
    included.” There are feature-rich libraries that address any type of programming
    need, including data processing. We cover a few of these later in this chapter,
    but be assured that Python has libraries to connect to any data source and perform
    nearly any type of computation or data manipulation activity. A major reason for
    this is the strong user community that surrounds Python. This community includes
    open-source software developers, universities, and the private sector.


    Python has broad acceptance among the best software developers. This is in part
    because of Python’s adherence to proper computer science principles of computer
    language design. It has led Massachusetts Institute of Technology (MIT) to use
    Python in its course “Introduction to Computer Science and Programming.” Additionally,
    many large organizations use Python extensively, including Google, NASA, and CERN.
    Python is a language used by highly skilled developers for massive, complex projects,
    while still being easy for more casual programmers to master.


    ### Availability of Instructional Material


    There are many instructional websites and videos for learning Python that are
    free and provide outstanding instruction. The aforementioned MIT course is available
    in online videos. Google also offers online Python instruction. If you consider
    using Python, check these out first.


    ### Cost


    Cost is often a reason organizations avoid ETL tools for data processing, as was
    mentioned before. Python costs nothing to license and use. Python’s feature-rich
    libraries cost nothing to use, either. You can use any editor to develop Python
    code, including many free editors. There are good Python editors that provide
    more extensive syntax highlighting for less than $100 per user.


    ## Two Examples Using Python


    Let’s examine two examples in which Python was used for data processing—or specifically,
    for data cleansing. Python is also well suited to other aspects of data processing
    like data wrangling, but we focus on data cleansing to keep the examples concise.
    Note: If you are not into code or coding, then you are likely to think these examples
    might not be for you. However, every reader should at least peruse these examples
    to get a sense for how much can be accomplished with very little Python code.


    ### Data Cleansing Example 1


    [Chapter 6](#A978-1-4842-1203-5_6_Chapter.html) featured the data for Ottawa County
    Bike Company. The data used was extracted from an ERP system for sales data. The
    data was contained in a `.csv` file that was loaded into Dropbox on an Apple iPad,
    and then subsequently loaded into the Salesforce Analytics Cloud. Having a duplicate
    record in this file would be a problem, because it would throw off all of the
    aggregations calculated on the dashboards. To eliminate this potential problem,
    a Python script is used to detect and remove duplicate rows. This script is shown
    in the following program listing. Figure [7-3](#A978-1-4842-1203-5_7_Chapter.html#Fig3)
    is a flowchart for this program.


    ```

    1       #!/usr/bin/python

    2       inputFile="/u01/import/csv/OttawaCountyBikes_dirty.csv"

    3       outputFile="/u01/export/csv/OttawaCountyBikes.csv"

    4       #  Clean up dirty ERP data

    5       lines_read = set() # holds lines already "seen"

    6       # Open output file for writing

    7       outfile = open(outputFile, "w")

    8       # Open file with dirty data for reading

    9       for line_just_read in open(inputFile, "r"):

    10

    11              # Determine if line just read is NOT in lines_read set

    12          if line_just_read not in lines_read:

    13

    14              # If line was NOT seen, write it to the output file

    15                      outfile.write(line_just_read)

    16

    17                      # Add line just read to lines_seen set

    18                      lines_seen.add(line_just_read)

    19

    20      outfile.close()

    ```


    ![A978-1-4842-1203-5_7_Fig3_HTML.jpg](A978-1-4842-1203-5_7_Fig3_HTML.jpg)


    **Figure 7-3.** Flowchart for Python example 1 data cleansing


    In example 1, there is a file with dirty data because the file could have duplicate
    rows. The data originated from the Ottawa County Bike Company ERP system, and
    the company has data standards that ensure data quality in the ERP, so we need
    only worry about duplicate records. In the program, the `inputFile` variable refers
    to the file `OttawaCountyBikes_dirty.csv` that contains data which has not been
    cleansed. The table below traces how this program works, line by line.


    | Line(s) | Comments |

    | --- | --- |

    | 2 | Variable `inputFile` is the name of the input file with dirty data. |

    | 3 | Variable `outputFile` is the name of the output for cleansed data. |

    | 4 | Declare a variable of type `set()`, `lines_read`. The `set` type retains
    every line processed and is used to compare new lines. |

    | 7 | Open output file for writing. |

    | 9 | Open input file to read data to be cleansed, and loop through all lines
    in file, storing each line in variable `line`. |

    | 12 | Determine if the `line` just read is in the set `last_read`. If the line
    is in `last_read`, then it is a duplicate and will not be written to the output
    file. If it is NOT in `last_read`, then write it to the outputfile because it
    is unique. |

    | 20 | Close the output file, as processing is complete. |


    This relatively simple program takes advantage of Python’s sophisticated data
    types, like `set` and its ability to perform comparisons with these types in a
    compact form. The variable declared as a `set` is `lines_read` and contains each
    of the rows that have been examined. The `set` data type includes a method `.add`
    that is used to add lines in our example. Without comments, this program contains
    only nine lines of executable code, and efficiently accomplishes the task of removing
    duplicate records.'
