- fmt: '# Critical Decision Making and Cognitive Bias


    Before we jump into the use case, though, let’s examine the nature of critical
    decision making and consider why so many of us are so bad at it. In approaching
    the topic of critical decision making, thought-leaders point out that the biggest
    barrier to making the right or correct decision is bias. As individual decision
    makers we are all subject to cognitive bias—assumptions that we hold that become
    mental modes of action impeding us from making decisions in a rational manner.
    Cognitive bias takes many forms; here are a few examples.


    - **Recency Bias** This bias is our tendency to be affected disproportionately
    by our most recent experiences. For example, many people believe that the financial
    crisis that occurred in 2007 is the greatest failure in the history of our banking
    system; yet the savings and loan crisis of the late 1980s was a far more costly
    event for the `FDIC`. This fact is easily verified by examining the publicly available
    data from the `FDIC`.

    - **Sunk Cost Bias** This bias stems from our tendency to throw good money after
    bad. Companies will often invest in technologies that turn out to be faulty, and
    then expend a disproportionate amount of human capital to make the technologies
    work.

    - **Overconfidence Bias** A feeling of overconfidence characterizes those who
    experience success through luck or unusual circumstances, without having faced
    adversity. This causes them to neglect due diligence and risk assessment in making
    their decisions. For instance, `IBM` once so dominated the computer industry that
    it was inconceivable the company would ever relinquish its position. When `IBM`
    created their personal computer, they based it on an open architecture that could
    be copied by anyone, they used a microprocessor supplied by `Intel`, and they
    installed an operating system supplied by `Microsoft`. `IBM` believed their market
    dominance would prevent others from competing, but in a short time `Compaq` produced
    the first `IBM PC`–compatible machine, or clone. `IBM`’s overconfidence helped
    `Microsoft` and `Intel` to ultimately become two of the largest technology companies
    in the PC age. In speaking about IBM''s epic decision to make an open-architecture
    PC, `Microsoft` founder `Bill Gates` described success as a menace, something
    that fools smart people into believing they can’t lose.


    Data-discovery products like the `Salesforce Analytics Cloud` enable critical
    decision making by empowering us to use data to the greatest extent possible,
    thereby avoiding bias. These products eliminate factors that cause us to make
    errors in our decision making and help us avoid pitfalls like cognitive bias.
    In this chapter’s use case, we see how such a tool can be used to better manage
    manufacturing operations and evaluate personnel performance at many levels.


    ## The Use Case Manufacturer


    Our manufacturing example has a number of distinct data domains, and we examine
    two of them in some detail. The first domain we cover relates to the instrument
    and control data associated with monitoring and controlling production processes.
    The second domain concerns the performance of manufacturing facilities, both at
    a facility level and for the entire corporation. We feature these two different
    domains to illustrate how the `Salesforce Analytics Cloud` can easily handle any
    data, from the plant floor to the boardroom.


    As some readers may not be familiar with manufacturing processes, or the instrument
    and control data associated with typical manufacturing, a little background information
    is in order. For instance, you may be familiar with the much-hyped term `Internet
    of Things`, or `IoT`. This refers to the vast array of devices that have Ethernet
    connectivity, including everything from air conditioners to aircraft. In making
    the case for adoption of technologies associated with Big Data, vendors and technical
    evangelists point out that `IoT` produces data faster than at any other time in
    history. Those involved in manufacturing already probably have first-hand experience
    with this rate of data production, as manufacturing facilities have been amassing
    such data for decades in their relational databases.


    However, to introduce this domain, let’s look at the process of glass manufacturing,
    focusing on the instrument and control data involved. Figure `5-1` is a historical
    overview of the process. Eventually, we will employ this background information
    to cover the types of glass manufacturing facilities and the operational data
    associated with them, as well as how the `Salesforce Analytics Cloud` operates
    in these two domains to provide improved bases for decision making.


    ![A978-1-4842-1203-5_5_Fig1_HTML.jpg](A978-1-4842-1203-5_5_Fig1_HTML.jpg)


    **Figure 5-1.** A brief history of glass manufacturing data and control


    ### Early Glass Making


    Glass was made in ancient Egypt and Mesopotamia as early as 3500 bce, and porcelain
    was made in China as early as 1600 bce. In these times, there were no machines;
    the process involved melting and shaping the silica by hand, with the glass maker
    regulating the intensity of the heat and controlling the flow of air. Early glass
    making relied on the skill of that craftsman to monitor—skills that were acquired
    over many years of apprenticeship. These craftsmen relied on their ability to
    recognize patterns in the material and make decisions on an intuitive level. Art
    glass is still produced in this manner today, but the bulk of our commercial glass
    production is manufactured industrially.


    ### Early Instrumentation and Increased Statistical Process Control


    Over the centuries, reliance on pattern recognition gave way to modern manufacturing
    processes in all types of production, not just glass making. Instruments were
    used to measure basic physical properties of the materials during the process,
    like temperature, pressure, and airflow, allowing factory workers to manually
    change process inputs with simple on/off devices such as motors, or by opening
    or closing a value to control temperature.


    By the 1950s, physical measurements from instruments used in manufacturing were
    combined with statistical analysis, producing systems of monitoring and thereby
    imposing more control of product quality. The best known example of this innovation
    is `Statistical Process Control`, or `SPC`, pioneered by `W. Edwards Deming` in
    postwar Japan. By the 1980s, `SPC` was adopted by U.S. manufacturers as well.
    It represents one of the most important manufacturing changes of the twentieth
    century, ushering in a new era of quality in manufacturing. `SPC` is also an early
    excellent example of how data can be used to drive decision making.'
