    ### 公司工厂的组织结构


    图 5-3 展示的是我们案例中玻璃公司的组织结构。


    ![A978-1-4842-1203-5_5_Fig3_HTML.jpg](img/A978-1-4842-1203-5_5_Fig3_HTML.jpg)


    图 5-3. 玻璃公司的组织结构


    如图 5-3 所示，共有七家浮法玻璃厂，生产用于汽车和建筑用途的玻璃。汽车玻璃经过着色处理用于汽车，部分玻璃还具备阻挡紫外线以保护汽车内饰的特性。此外，还有四家玻璃加工厂和两家汽车包边厂。


    在接下来的章节中，我们将审视这些工厂的数据，并使用 **Salesforce 分析云**创建仪表板，以提供有用的数据可视化展示。回顾 第 1 章 可知，Salesforce
    分析云支持两种基本类型的分析：描述性分析（回答“发生了什么？”的问题）和诊断性分析（回答“为什么发生？”的问题）。让我们看看一些真实数据，并了解如何执行描述性和诊断性分析。


    ## 关键绩效指标


    在我们的案例中，有一个专注于管理所有制造工厂的领导团队。该团队由各工厂的管理层和公司总部的经理组成。团队专注于运营与规划，每天监控各工厂的运营情况，做出关键决策以最大化绩效和盈利能力，并沟通结果。监控基于被归类为关键绩效指标（**KPI**）的数据，其中包括吞吐量、良品率和正常运行时间。


    -   **吞吐量：** 吞吐量 KPI 是流经生产线的零件数量或物料量。生产线通常存在瓶颈，如果改进成本足够低，那么避免这些瓶颈的改进措施可以带来盈利。如果生产线上的设备频繁停机，显然会导致吞吐量下降。对于任何生产线而言，其吞吐能力都基于设计和运营历史而被充分了解。

    -   **良品率：** 良品率 KPI 是制造出的可用产品的百分比。在大多数生产线上，实现 100% 的良品率是不可能的；制造过程总会产生一些废品。生产线的末端是质量检验环节，由机器或人工完成。例如，生产汽车车窗的生产线，其末端会进行外观问题检验，尤其是划痕。任何有划痕的车窗都必须被废弃，从而降低了该生产线的良品率。为了计算良品率，我们执行以下计算：`良品率
    % = 生产的合格零件数 / 吞吐量`。因质量问题而被废弃的产品百分比有时被称为废品率。

    -   **正常运行时间：** 理想情况下，生产线上的设备从不停止运行，但这当然是不可能的。设备总是会出故障并需要维修。制造工厂配备有维修人员，负责维修发生故障的设备，并对设备进行预防性维护以降低故障概率。


    现在，让我们看一个在 **Salesforce 分析云**中创建的仪表板，用于报告这些吞吐量、良品率和正常运行时间参数。


    ## 工厂级报告


    图 5-3 中所示的 35 号工厂是一家玻璃加工厂，使用来自浮法玻璃厂的玻璃生产汽车车窗。该工厂连续运转，由生产管理团队负责监控绩效。一个 24 小时周期内有三个班次，第一班从早上
    8:00 开始，第二班从下午 4:00 开始，第三班从午夜 12:00 开始。


    共有四条生产线在运行。作为生产管理团队一员的轮班领班是现场管理者，负责做出关键的、每分钟的决策，以确保所有四条生产线都能以最佳状态运行。**SCADA**
    系统对操作四条生产线的可编程控制器进行大量数据采集。利用这些信息，**SCADA** 能够报告每条生产线的良品率、吞吐量和正常运行时间。每天，生产管理团队都会使用
    **Salesforce 分析云**中的仪表板查看前三个班次发生的情况。仪表板的屏幕截图如图 5-4 所示。


    ![A978-1-4842-1203-5_5_Fig4_HTML.jpg](img/A978-1-4842-1203-5_5_Fig4_HTML.jpg)


    图 5-4. 35 号工厂的每日生产报告


    图 5-5 和 5-6 分别展示了图 5-4 仪表板左侧和右侧更易读的视图。


    ![A978-1-4842-1203-5_5_Fig6_HTML.jpg](img/A978-1-4842-1203-5_5_Fig6_HTML.jpg)


    图 5-6. 35 号工厂每日生产报告（右侧）


    ![A978-1-4842-1203-5_5_Fig5_HTML.jpg](img/A978-1-4842-1203-5_5_Fig5_HTML.jpg)


    图 5-5. 35 号工厂每日生产报告（左侧）


    在这个工厂，1 号线和 3 号线是相同的，2 号线和 4 号线也是相同的。因此，如果两条生产线都以最佳状态运行，那么 1 号线和 3 号线的生产报告应该非常接近。仪表板显示了良品率、吞吐量和正常运行时间这些
    **KPI** 的“标准”数字；这些是生产线每天应能达到的最低绩效数字。然而，图 5-6 显示 1 号线在第一班和第二班期间遇到了困难。


    仪表板设有切换小部件，以便用户可以选择生产线进行更仔细的查看。由于 1 号线出现了问题，我们按下 1 号线的切换小部件；结果显示在图 5-7 中。


    ![A978-1-4842-1203-5_5_Fig7_HTML.jpg](img/A978-1-4842-1203-5_5_Fig7_HTML.jpg)


    图 5-7. 使用切换小部件选择的 1 号线视图

