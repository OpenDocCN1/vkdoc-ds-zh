    To demonstrate the versatility of the Salesforce Analytics Cloud, we will cover
    one last dashboard, with different dimensions and different data selectors.


    The Ottawa County Bike Company uses three types of channels to sell and distribute
    its products, and this information is in the `Reseller Type` dimension. There
    are three possible types of resellers: specialty bike shops, value-added resellers,
    and warehouses. The dataset also includes information on the names of individual
    resellers in the `Reseller Name` dimension. Figure [6-26](#A978-1-4842-1203-5_6_Chapter.html#Fig26)
    shows a dashboard designed to analyze resellers, reseller types, and the top-selling
    products, which includes the sales managers, product types, and geographic regions.
    This dashboard is a good illustration of the versatility of the widgets in the
    Salesforce Analytics Cloud. For the product type and geographic region, a donut
    graph is used instead of a toggle.


    ![A978-1-4842-1203-5_6_Fig26_HTML.jpg](A978-1-4842-1203-5_6_Fig26_HTML.jpg)


    **Figure 6-26.** North America Resellers dashboard


    In Figure [6-26](#A978-1-4842-1203-5_6_Chapter.html#Fig26), we have selected the
    Southwest region on the donut graph, and the other graphs have updated to reflect
    this selection. With this dashboard, it is easy to determine the top-selling products
    by geography, sales manager, or reseller type. This can assist with development
    of future sales strategies, because it can lead to an understanding of what products
    should be developed and promoted in particular markets.


    ### Security and Shared Public File Services


    Before we conclude this chapter, the topic of security and file-sharing services
    should be covered because it is integral to the architecture of the Salesforce
    Analytics Cloud. Earlier in this chapter, the popular cloud service Dropbox was
    used to make the `.csv` extract file available to Salesforce Analytics Cloud users
    in the Ottawa County Bike Company. While Dropbox provides password-based security,
    it does not offer any encryption of the files it stores. This makes it inappropriate
    for data that must be encrypted in accordance with regulation, such as is the
    case with HIPPA data. Dropbox is one of many possible file-sharing products that
    can be used for the Salesforce Analytics Cloud, and other file-sharing services
    should be evaluated for achieving an acceptable level of security.


    ### Conclusion


    The focus of this chapter was on the mobile capability of the Salesforce Analytics
    Cloud, and how it can be used to quickly develop dashboards that can be viewed
    on any mobile device, including the Apple iPad, iPhone, and even the Apple Watch.
    Using this mobile capability, users and stakeholders can develop their own reports
    and analytics solutions, bypassing the long development cycle of the traditional
    paradigm for producing reports. The use case showed how quickly and inexpensively
    this solution can be deployed. It also showed how new questions arise from the
    exploration of data presented via the Salesforce Analytics Cloud, and how these
    new questions can be quickly answered simply by developing new dashboards with
    new dimensions. The developers of the Salesforce Analytics Cloud have emphasized
    this mobile strategy, and this chapter demonstrates the benefits of this service.


    ## 7. Advanced Data Acquisition and Processing


    > Know the smallest things and the biggest things. The shallowest things and the
    deepest things. —Miyamoto Mushashi, The Book of Five Rings


    Miyamoto Mushashi was a Japanese master of sword fighting who was undefeated after
    60 matches. Mushashi’s success was rooted in a deep philosophy of striving for
    complete knowledge of all things large and small. The same is true of information
    technology. Developing and maintaining an understanding of technical subjects
    across a broad range of areas means that you will have more knowledge and skills
    to attack problems when they appear and formulate innovative solutions to those
    problems.


    With this philosophy in mind, we depart from a discussion focused strictly on
    the Salesforce Analytics Cloud in this chapter, and carry out a survey of some
    tools and technologies useful for acquiring data. This is followed by a discussion
    of data processing and the tools for data processing that make data available
    to analytics products like the Salesforce Analytics Cloud. The purpose of these
    tools is to make data available to analytics products like the Salesforce Analytics
    Cloud. The primary objective of this chapter is to raise awareness of these alternatives
    so that you can use them if the need arises.


    The second half of the chapter introduces the Python language and presents two
    examples of its use in cleansing data for possible use in the Salesforce Analytics
    Cloud.


    ### Data Acquisition—Tools and Technologies


    There are three types of tools that deliver three different capabilities. We describe
    these tools in a general sense, without looking at specific vendor offerings,
    as there are too many to consider here.


    #### Web Scrapers


    Web scrapers are used to harvest information from websites. There are both commercial
    and open-source web scrapers available. Some commercial web scrapers have an additional
    capability of collecting information from documents like Microsoft Excel spreadsheets
    or `.pdf` forms.


    Web scrapers use the document structure of web pages to extract specific items.
    Some advanced commercial web scrapers have a visual interface that allows scraping
    automations to be developed with little or no programming. These web scrapers
    can discover the document structure of web pages and show the fields as an overlay
    on the website.


    Web scrapers are good for extracting information from websites whose structure
    does not change as the content changes. A common use of web scrapers is to extract
    reviews and comments on products from online retailers like Amazon. For example,
    a web scraper could extract all the opinion data for each product in an entire
    category, including customer comments and satisfaction ratings.


    After web scrapers harvest the selected information, they save that information
    in a variety of formats, including `.csv` files. Many commercial web scrapers
    can write to relational databases.


    #### Web Crawlers


    Web crawlers programmatically collect information from a website. They can follow
    hyperlinks on web pages, navigating many levels into a website. They can be used
    to investigate a company’s website, and are well suited to competitive research.
    Some commercial crawlers also offer the capability of crawling file systems and
    `ftp` servers to find office documents types like `.pdf` files, Word documents,
    and Excel spreadsheets, and then to extract information from them.


    Web crawlers differ from web scrapers in that all text information is collected
    from a website instead of just specific items. Most web crawlers have depth settings
    that specify the extent of hyperlink navigation. A higher number set for the crawl
    depth means you collect more data—but it also requires more time to run. Web crawlers
    usually have a “politeness” setting that limits the rate at which requests are
    sent to the websites being crawled, so that the crawler does not overwhelm those
    web servers.


    Crawlers tend to extract significant amounts of information from websites, so
    they can be difficult to manage without using other tools as well. Text analytics
    processors (described next) are commonly used to process the data acquired by
    web crawlers.'
