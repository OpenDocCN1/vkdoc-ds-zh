- fmt: '### Step 3 – Modifying the Metadata and Creating the Dataset


    Step 3 involves the actual creation of the dataset in the Salesforce Analytics
    Cloud. In Figure [6-7](#A978-1-4842-1203-5_6_Chapter.html#Fig7), there is a “Next”
    button on the upper right corner of the message box. Pressing this button reveals
    the metadata editor. From this editor, each of the columns in the `OttawaCountyBikes.csv`
    is mapped to one of three data types. Let’s quickly cover these three data types:


    *   **Measures** are quantitative data, and within the Salesforce Analytics Cloud,
    users can analyze this data against one or more dimensions. Measures must be numeric
    data because within the Salesforce Analytics Cloud, mathematical operations are
    performed on the measures.

    *   **Dimensions** consist of descriptive data, and we evaluate measures against
    dimensions. For example, with a measure of total sales, one of the dimensions
    could be geographic region, such as state or province.

    *   **Dates** represent time, and they must be in a format that is recognized
    by the Salesforce Analytics Cloud as time data. Usually, data extracted from enterprise
    software databases is in the correct format. Often with this data type, only date
    information is present, with no time information.


    Usually, the import process correctly determines the data types. However, in some
    cases, users may want to modify the data types. In the case of the data in the
    `OttawaCountyBikes.csv` file, there are quarterly numbers consisting of data that
    is entirely numeric. The import process assigns this to be a measure, but we actually
    want to use it as a dimension. When the import process finds a field that is purely
    numeric, it automatically makes the field a measure. Since quarterly numbers are
    attributes of data and add meaning to the measures in the data, they need to be
    changed to a dimension. Using the metadata editor shown in Figure [6-8](#A978-1-4842-1203-5_6_Chapter.html#Fig8),
    we can change “Calendar Quarter” to a measure simply by clicking the right arrow
    and selecting “Measure.”


    ![A978-1-4842-1203-5_6_Fig8_HTML.jpg](A978-1-4842-1203-5_6_Fig8_HTML.jpg)


    Figure 6-8. The form to change data types


    It is sometimes prudent to review the number of decimal places to be used for
    measures. Noting this can make the data more readable, as in the case of “List
    Price” shown in Figure [6-9](#A978-1-4842-1203-5_6_Chapter.html#Fig9). We have
    selected two decimal places, since list prices are always expressed as an amount
    in dollars and cents.


    ![A978-1-4842-1203-5_6_Fig9_HTML.jpg](A978-1-4842-1203-5_6_Fig9_HTML.jpg)


    Figure 6-9. Changing the decimal places for a measure


    One other interesting aspect of the field type selection is that it prevents users
    from making incorrect choices. For example, in Figure [6-10](#A978-1-4842-1203-5_6_Chapter.html#Fig10),
    we have tried to change “List Price” to a date type, but the import process has
    indicated that this action may not be correct.


    ![A978-1-4842-1203-5_6_Fig10_HTML.jpg](A978-1-4842-1203-5_6_Fig10_HTML.jpg)


    Figure 6-10. Error shown for incorrect date field type selection


    The name of the dataset can also be modified on this message box. For example,
    the name of the `.csv` file is the default name for the dataset, but users are
    free to choose a different name.


    Once we are satisfied that the data types are correct, we can start the import
    process by pressing the “Import” button in the upper right corner of the message
    box. As the dataset is imported, a message box appears indicating it is underway,
    followed by a message box indicating successful dataset creation. Small datasets
    are usually available immediately, but larger datasets may require up to an hour
    to be available.


    ### Step 4 – Creating Lenses and Dashboards


    Once the dataset has been created, users can immediately begin to explore the
    data, starting with the creation of a lens. This was covered in [Chapter 2](#A978-1-4842-1203-5_2_Chapter.html)
    of this book, so it will not be discussed here.


    ## Data Used in Our Use Case


    Now that we have covered the creation of the dataset, let’s examine the data extracted
    for the Ottawa County Bike Company and how users can gain insight by using the
    Salesforce Analytics Cloud.


    The data in this use case concerns sales performance. The Ottawa County Bike Company
    sells a wide range of bicycles, accessories, and components for bikes, as well
    as biking clothing. Its sales are through three types of entities: specialty bike
    shops, value-added resellers, and warehouses. Each row of data in the dataset
    tracks individual transactions and the sales function associated with those transactions.
    The columns in this dataset include the following that can be used in the Salesforce
    Analytics Cloud.


    ### Sales Amount Data


    - **Bank name**: The financial institution handling the transaction.

    - **Freight**: The freight cost.

    - **Discount amount**: The discount given.

    - **Total product cost**: The total product cost.

    - **Sales amount**: The amount of the sale.

    - **Tax amount**: The amount for taxes associated with the sale.


    ### Date Data


    - **Order date**: The date of the order of one or more products.

    - **Calendar quarter**: The year’s quarter for the order date.

    - **Calendar year**: The year for the order data.


    ### Product Data


    - **Product name**: The name of the product sold.

    - **Product line**: One of three values: mountain, road, or touring bike.

    - **Product category**: One of four values: bikes, components, accessories, or
    clothing.

    - **Product subcategory**: One of many values that more precisely identify a product.
    A few possible values include chains, brakes, caps, helmets, and mountain bikes.


    ### Reseller Data


    - **Full name**: The sales representative in Ottawa County Bike Company responsible
    for the sale.

    - **Reseller name**: The name of the company originating the sale.

    - **Reseller type**: One of three values: specialty bike shops, value-added resellers,
    and warehouses.

    - **Sales territory-country**: The country of the sales territory.

    - **Sales territory-region**: The region within the sales territory country.

    - **State/province name**: The name of the state or province.

    - **City**: The city within the state or province.'
