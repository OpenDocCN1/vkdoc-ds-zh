    capability, with software developers on staff who are familiar with REST API development
    in general.

    *   ETL Tools. Extract Transform Load (ETL) tools make data integration easier
    with graphic interfaces, scheduling capability, and support for connection to
    nearly any type of data source. They usually have pre-built connectors to enterprise
    software platforms like SAP or NetSuite, which makes data access easier. The upside
    is their short development time; however, ETL tools can be costly. Purchasing
    an ETL tool solely to integrate data with the Salesforce Analytics Cloud would
    be difficult to justify. Organizations should examine their Salesforce partner
    ETL tools to determine if they have native support for the Salesforce Analytics
    Cloud.

    *   The Wave REST API. The Wave REST API is used for reading data from the Salesforce
    Analytics Cloud (versus obtaining data, as in the case of ETL Tools and the External
    Data API). Companies developing products that use the Salesforce Analytics Cloud
    would then use the Wave REST API. These products could be mobile applications
    or desktop computer products that are BI capable. Companies with custom software
    development capability can use the Wave REST API to build applications that retrieve
    data from the Salesforce Analytics Cloud.


    ![A978-1-4842-1203-5_4_Fig1_HTML.jpg](A978-1-4842-1203-5_4_Fig1_HTML.jpg)


    Figure 4-1.


    Data integration methods for the Salesforce Analytics Cloud


    Now, let’s take a closer look at each of these.


    ## External Data API


    The External Data API provides the capability of integrating external data into
    the Salesforce Analytics Cloud. The external data is loaded directly into datasets,
    and is then available for queries or for mobile or desktop use of the Salesforce
    Analytics Cloud. The following steps, shown in Figure [4-2](#A978-1-4842-1203-5_4_Chapter.html#Fig2),
    are followed so as to use the External Data API.


    ![A978-1-4842-1203-5_4_Fig2_HTML.jpg](A978-1-4842-1203-5_4_Fig2_HTML.jpg)


    Figure 4-2.


    Steps for data integration using External Data API


    ### Step 1\. Create .CSV File


    All data is put into .csv format and written to a file to load into the Salesforce
    Analytics Cloud using the External Data API, regardless of the source. As a programming
    task, this is generally easy, but care must be taken to ensure the file created
    is not too large. (See “Restrictions on Use” that follows.) Care also must be
    taken to use quoted identifiers if the source has a comma or CR/LF. Any quotes
    in a value surrounded by quoted identifiers need to be escaped by another set
    of quotes; for example, “Don’t ““quote”” me.”


    ### Step 2\. Create JSON Metadata


    The JSON metadata file describes the data so that when each row is loaded, the
    Salesforce Analytics Cloud is able to determine the data type for each column.
    To create this file, you identify as a date, number, or string each of the fields
    of the .csv file created in step 1. This file also determines what, if any, security
    is applied to each row. The Salesforce Analytic Cloud maintains a document specifically
    to record this metadata, so developers should refer to this document to fully
    understand the JSON format.


    ### Step 3\. Upload Files


    This step is twofold. The first part is to connect to Salesforce. There are a
    variety of methods for authenticating into Salesforce and any will suffice. According
    to Salesforce, the venerable SOAP-based authentication methods or the newer REST-based
    can be used to establish connectivity.


    The second part involves uploading the files by using an object known as the InsightsExternalData
    object. Salesforce requires that files larger than 10MB be broken into 10MB “chunks,”
    then uploaded with the InsightsExternalData object.


    ### Step 4\. System Job Is Created and Run


    This job is created automatically after the uploading is completed; it does not
    need to be initiated by the developer. The system job-processes the .csv file
    data and the JSON metadata.


    ### Step 5\. Dataset Is Created


    The dataset creation occurs as a result of step 4, and thus is not initiated by
    the developer, either. Once the dataset is created, it is ready for use in the
    Salesforce Analytics Cloud.


    ### Restrictions on Use


    Certain restrictions are placed on the External Data API, based on information
    current as of this writing and they are subject to change. If you need to extend
    your use of the External Data API, contact Salesforce. The restrictions are as
    follows:


    A maximum of 50 files per day can be uploaded, with all external data uploads
    occurring in a rolling 24-hour period.   Each file can have a maximum file size
    of 40G.   The maximum number of characters in a field is 32K.   For each record,
    the maximum number of fields is 5K.   The maximum number of characters for all
    fields in a record is 400K.  


    The first two limits are the most restrictive, especially item 1\. The others
    are not likely to be of concern in most circumstances.


    ### Supporting Documents


    Salesforce provides a number of documents for developers to review so as to implement
    the External Data API. These documents provide a high level of detail and are
    as follows:


    *   Analytics Cloud External Data API Developer’s Guide. Describes the overall
    process and provides some code examples in the “C” programming language. Includes
    information on the InsightsExternalData object.

    *   Analytics Cloud External Data Format Reference. Describes the JSON format
    needed, discussed in step 2.

    *   Security Implementation Guide for Analytics Cloud. Explanation of the various
    modes of security for the Salesforce Analytics Cloud. A long document that is
    somewhat nuanced and many details shown are more relevant to Salesforce data loaded
    in the Salesforce Analytics Cloud.


    ## Extract Transform Load Tools


    The Extract Transform Load (ETL) tools have seen widespread use in information
    technology and are one of the most commonly used classes of IT software. Many
    companies provide ETL tools, and most are feature-rich and capable of connecting
    to nearly any type of data source, including back-office enterprise software,
    relational databases, flat files, and data provided via APIs. ETL tools also are
    able to achieve data transformation without needing software developers. Figure
    [4-3](#A978-1-4842-1203-5_4_Chapter.html#Fig3) shows the general flow when an
    ETL tool is used with the Salesforce Analytics Cloud.


    ![A978-1-4842-1203-5_4_Fig3_HTML.jpg](A978-1-4842-1203-5_4_Fig3_HTML.jpg)


    Figure 4-3.


    Steps in using an ETL tool to write data to the Salesforce Analytics Cloud


    Configuring the ETL software is a relatively simple task for most users. Let’s
    discuss a few details.'
