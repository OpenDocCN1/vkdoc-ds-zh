    and thereby observe how sales manager performance changes. This is the advantage
    of the Salesforce Analytics Cloud: it allows us to dig deeper into data simply
    by adding new measures to a dashboard. As we apply refinements with the toggle
    widgets for Product Line and Sales Territory-Region, we can better understand
    the performance of the individual sales managers. If we select the top-performing
    Southwest region and the Mountain product line, we see that this is an area where
    Nathaniel Grimes performs best, as is evidenced in Figure [6-24](#A978-1-4842-1203-5_6_Chapter.html#Fig24).


