    ### 分析其他维度：经销商


    为了展示 Salesforce 分析云的通用性，我们将介绍最后一个仪表板，其中包含不同的维度和不同的数据选择器。


    渥太华县自行车公司使用三种类型的渠道来销售和分销其产品，这些信息包含在`经销商类型`维度中。经销商分为三种类型：专业自行车店、增值经销商和仓库。数据集还包含`经销商名称`维度中各个经销商名称的信息。图
    6-26 展示了一个仪表板，旨在分析经销商、经销商类型以及最畅销产品，其中包含销售经理、产品类型和地理区域。该仪表板很好地说明了 Salesforce 分析云中各组件的通用性。对于产品类型和地理区域，使用了环形图而不是切换开关。


    ![A978-1-4842-1203-5_6_Fig26_HTML.jpg](img/A978-1-4842-1203-5_6_Fig26_HTML.jpg)


    **图 6-26.** 北美经销商仪表板


    在图 6-26 中，我们在环形图上选择了西南区域，其他图表已更新以反映此选择。利用此仪表板，可以轻松确定按地理位置、销售经理或经销商类型划分的最畅销产品。这有助于制定未来的销售策略，因为它可以引导人们了解应该在特定市场开发和推广哪些产品。


    ### 安全与共享的公共文件服务


    在结束本章之前，应该涵盖安全和文件共享服务的主题，因为它对 Salesforce 分析云的架构至关重要。在本章前面部分，使用了流行的云服务 Dropbox
    来为渥太华县自行车公司的 Salesforce 分析云用户提供可访问的`.csv`提取文件。虽然 Dropbox 提供基于密码的安全性，但它不提供对其存储文件的任何加密。这使得它不适合必须按照法规（例如
    HIPPA 数据的情况）进行加密的数据。Dropbox 是可以用于 Salesforce 分析云的众多可能的文件共享产品之一，应评估其他文件共享服务以达到可接受的安全级别。


    ### 结论


    本章的重点是 Salesforce 分析云的移动端能力，以及如何使用它快速开发可在任何移动设备（包括 Apple iPad、iPhone，甚至 Apple
    Watch）上查看的仪表板。利用这种移动端能力，用户和利益相关者可以绕过传统报告生产模式的漫长开发周期，自行开发报告和分析解决方案。用例展示了这种解决方案能够以多快、多低的成本进行部署。它还展示了在探索通过
    Salesforce 分析云呈现的数据时如何产生新的问题，以及如何通过简单地开发具有新维度的新仪表板来快速回答这些新问题。Salesforce 分析云的开发者强调了这种移动端策略，本章展示了该服务的优势。


    ## 7. 高级数据采集与处理


    > 知晓最小之事与最大之事。最浅之事与最深之事。——宫本武藏，《五轮书》


    宫本武藏是一位日本剑术大师，在 60 场决斗中未尝败绩。武藏的成功植根于一种深刻的哲学思想，即力求对大小事物有完整的认知。信息技术亦是如此。培养并维持对广泛技术主题的理解，意味着当问题出现时，你将拥有更多的知识和技能来攻克它们，并为这些问题制定创新的解决方案。


    本着这种理念，本章我们将脱离严格局限于 Salesforce 分析云的讨论，对用于采集数据的一些工具和技术进行概述。随后将讨论数据处理以及使数据可用于诸如
    Salesforce 分析云等分析产品的数据处理工具。这些工具的目的在于使数据可供像 Salesforce 分析云这样的分析产品使用。本章的主要目标是提高对这些替代方案的认识，以便你在需要时可以使用它们。


    本章的后半部分将介绍 Python 语言，并提供两个使用 Python 清理数据以供可能在 Salesforce 分析云中使用的示例。


    ### 数据采集——工具与技术


    有三种类型的工具可提供三种不同的能力。我们将从一般意义上描述这些工具，而不关注具体的供应商产品，因为可供考虑的供应商实在太多。


    #### 网络爬虫（Web Scrapers）


    网络爬虫用于从网站收集信息。既有商业版也有开源版的网络爬虫可用。一些商业网络爬虫还具有从诸如 Microsoft Excel 电子表格或`.pdf`表单等文档中收集信息的附加功能。


    网络爬虫利用网页的文档结构来提取特定项目。一些先进的商业网络爬虫拥有可视化界面，允许在很少或无需编程的情况下开发自动化抓取程序。这些网络爬虫可以发现网页的文档结构，并在网站上以覆盖层的形式显示字段。


    网络爬虫非常适合从结构不随内容变化而变化的网站中提取信息。网络爬虫的一个常见用途是从像亚马逊这样的在线零售商处提取产品的评论和反馈。例如，网络爬虫可以提取整个类别中每个产品的所有意见数据，包括客户评论和满意度评级。


    网络爬虫收集选定的信息后，会将其保存为各种格式，包括`.csv`文件。许多商业网络爬虫可以写入关系数据库。


    #### 网络爬虫（Web Crawlers）


    网络爬虫以编程方式从网站收集信息。它们可以跟踪网页上的超链接，深入网站的多层页面。它们可用于调查公司的网站，非常适合进行竞争研究。一些商业爬虫还提供爬取文件系统和`ftp`服务器的能力，以查找诸如`.pdf`文件、Word
    文档和 Excel 电子表格等办公文档类型，然后从中提取信息。


    网络爬虫与网络抓取工具的不同之处在于，它会从网站收集所有文本信息，而不仅仅是特定项目。大多数网络爬虫都有深度设置，用于指定超链接导航的程度。为爬取深度设置更高的数值意味着你会收集更多的数据——但也需要更长的运行时间。网络爬虫通常有一个“礼貌”设置，用于限制向被抓取网站发送请求的速度，以免使这些网络服务器不堪重负。


    爬虫往往从网站提取大量信息，因此如果不使用其他工具，可能难以管理。文本分析处理器（如下所述）通常用于处理网络爬虫获取的数据。

