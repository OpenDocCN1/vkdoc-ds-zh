- fmt: '# 6. Mobile Enterprise Data Discovery


    > A good plan today is better than a perfect plan tomorrow. —General George Smith
    Patton


    One of the most famous generals of World War II was George Patton, and the above
    quote is attributed to him. The statement reflects what Patton was best known
    for: taking action with the best possible information, instead of excessively
    analyzing situations. Patton was ardently opposed to digging in or establishing
    fixed fortifications, and he demanded of his troops constant forward movement.
    Given Patton’s core values, he would certainly feel right at home with the mobile
    computing capabilities that are available to today’s professionals through smartphones
    and tablet computers. Mobile devices allow these professionals to be productive
    away from their offices, as these devices no longer need to be tethered to a desk
    to be useful. In this chapter, we examine a moderate-size cycle company, the Ottawa
    County Bike Company, and how the Salesforce Analytics Cloud enables that company’s
    personnel to use its existing decision support system data with their mobile devices
    to achieve greater insight into the company sales performance.


    Data discovery enables key business stakeholders to use data in their decision
    making; this point has been emphasized in the preceding chapters and will be throughout
    this book. In today’s business climate, staying on top of performance has never
    been easier with popular mobile devices and the Salesforce Analytics Cloud. Because
    of the “mobile first” approach of the Salesforce Analytics Cloud, users can access
    data discovery from their tablets, smartphones, and even from the Apple watch.
    Moreover, users can easily create their own applications, entirely via the mobile
    interface. In this chapter, all of the visualizations discussed are from the tablet
    or smartphone version of the Salesforce Analytics Cloud.


    ## Overview of Our Use Case


    Our use case for the Ottawa County Bike Company shows how a company that has followed
    a traditional approach to reporting can benefit from the Salesforce Analytics
    Cloud. The Ottawa County Bike Company has followed a disciplined, standard approach
    to enterprise computing since its founding some 15 years ago. The company has
    an enterprise resource planning (ERP) system to manage all aspects of the business,
    including basic business functions like human resources, payroll, and finance.
    The ERP system also has functionality that allows the company to manage sales
    operations, logistics, and channel management. Data from the ERP system is coalesced
    into a data warehouse. The data warehouse provides a comprehensive view of historic
    data, which is stored in indexed, de-normalized tables to facilitate rapid retrieval.
    Data tables in the data warehouse are the resource for many reports that the company
    uses for operational reporting. These reports were developed by business analysts
    using a reporting tool to arrange and format the reports.


    ### The Traditional Approach to Reporting


    The approach used by the Ottawa County Bike Company is one that has been used
    for many years to get reports into the hands of its business users and stakeholders.
    This venerable approach produces reliable reports through collaboration among
    business analysts, report writers, and stakeholders. The business analysts and
    report writers are part of a centralized report development team that resides
    in the information technology department. This department often has lengthy backlogs
    of requests for new reports or modifications to existing reports. Key decision
    makers can often get their requests fast-tracked, “cutting into the line” ahead
    of managers who may have been waiting for some time. Occasionally, to break up
    the logjam of report-generation requests, departments will hire their own report
    writers and analysts to address their needs. These dedicated report writers and
    analysts are sometimes the start of a “shadow IT” movement by these same departments,
    when those department continue to hire more IT resources such as developers, DBAs,
    and cloud app administrators. This fragmentation can be harmful in the long term,
    and can detract from overall corporate IT objectives of data standards, security,
    and architectural governance.


    Often, companies that have already invested in many reporting or analytic tools
    are reluctant to consider any new investment in this area. Reporting and analytic
    tools have high annual support costs, ranging from 20 to 25 percent of the original
    costs of the product. Some companies have inadvertently acquired many reporting
    tools, either through mergers or because a tool was part of a bundled purchase
    of an ERP system or other enterprise software. It is not unusual for some of these
    tools to be abandoned when companies have many reporting tools, thereby squandering
    the original capital investment made in them.


    ### An Alternative to the Traditional Approach


    Figure [6-1](#A978-1-4842-1203-5_6_Chapter.html#Fig1) illustrates the traditional
    approach to reporting and analytics solutions, and shows how the Salesforce Analytics
    Cloud provides an alternative approach.


    ![A978-1-4842-1203-5_6_Fig1_HTML.jpg](A978-1-4842-1203-5_6_Fig1_HTML.jpg)


    Figure 6-1. Traditional reporting approach with Salesforce Analytics Cloud as
    an alternative


    Even for companies with a painful past relationship with reporting and business
    intelligence tools, the decision to adopt the Salesforce Analytics Cloud is an
    easy one to make. The Salesforce Analytics Cloud is 100 percent subscription based,
    requiring no upfront capital investment. The subscription allows for individual
    licenses to be purchased in two categories, which makes it easy to keep costs
    under control, with the company paying only for the capability that is required.


    Most business intelligence platforms require desktop computers for development
    and viewing of reports. Desktop computers are expensive to purchase and can be
    difficult to maintain. They also represent a security threat from viruses and
    malware, which is not a desirable situation when potentially sensitive data is
    involved. Additionally, report-viewing applications are often browser based, and
    they can have compatibility issues with different browsers, running on different
    versions of operating systems. This can result in high support costs and dissatisfied
    users when they cannot access their reports. With the mobile-first approach of
    the Salesforce Analytics Cloud, mobile devices like tablet computers and smartphones
    can be used to create reports and business intelligence applications. Mobile devices
    are inherently more secure than desktop computers because of the isolation of
    their operating systems from their applications. Mobile devices are well understood
    by nearly everyone from a usability standpoint, and the familiar gestures used
    on mobile devices are common to all applications, including the Salesforce Analytics
    Cloud. In general, the training required for mobile applications is on an order
    of magnitude less than desktop applications, and it can often be accomplished
    with online videos or tutorials. Tablet computers and smartphones also have the
    advantage of portability, especially for devices that have cellular network connectivity.


    Perhaps the biggest advantage of the Salesforce Analytics Cloud is the ability
    to explore data. With the traditional reporting tools there is no capability to
    explore data, and alterations to any reports to reveal a new facet of data require
    that a request be made to business analysts or report developers. With the Salesforce
    Analytics Cloud, however, users are in complete control of their reporting and
    business intelligence experience, and they can drill into the data at will, as
    well as filter and organize the data.'
