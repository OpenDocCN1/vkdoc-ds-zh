    献给 Nathaniel G. Smith\n\n## 引言\n\n数据发现产品是一类分析和商业智能软件，随着组织努力用数据驱动决策，它主导了新投资并日益流行。其流行原因不难理解。通过数据发现软件，普通用户可以创建前所未有的强大应用。用户不再依赖\
    \ IT 部门满足报告和数据分析需求。数据发现用户成为“公民数据科学家”，执行基础数据分析并发现相关性，这以前只有通过高端统计分析包才能实现。\n\nSalesforce\
    \ Analytics Cloud 是 2014 年在 Salesforce 大会 Dreamforce 上推出的数据发现产品，其特性使其成为考虑投资这一激动人心技术领域的组织的理想选择。它\
    \ 100%基于云，遵循 Salesforce“移动优先”战略，提供功能完善的移动平台用于创建和使用数据发现应用。Salesforce Analytics\
    \ Cloud 的定价模式允许组织无需资本投入即可采用。Analytics Cloud 采用固定费用订阅制，不涉及数据传输成本。尽管 Salesforce\
    \ Analytics Cloud 面向普通用户，但它也具备高级功能，使程序员能够开发复杂的应用。部分订阅包中包含全天候支持服务。\n\nSalesforce\
    \ Analytics Cloud 内置了使用 Salesforce 数据构建应用的能力。它还能利用源自 Salesforce 外部的数据创建应用。这种使用外部数据创建应用的能力正是本书的重点。\n\
    \n本书第一部分指导如何使用 Salesforce Analytics Cloud，先介绍基本概念，再探讨更高级的用法。\n\n第二部分聚焦两个用例。第一个用例涉及一家制造业公司的数据，其数据来源广泛，从工厂车间到高管层。第二个用例章节展示了如何将\
    \ Salesforce Analytics Cloud 用于销售绩效数据，并完全在 Salesforce Analytics Cloud 移动界面上开发。最后一章涵盖高级数据采集与处理，介绍如何使用网络爬虫和抓取工具收集数据以供\
    \ Salesforce Analytics Cloud 使用。接着概述数据处理，并讨论 Python 编程语言及其在数据处理中的应用。\n\n## 致谢\n\
    \n我们衷心感谢朋友兼同事 Paul Carlstoem 介绍我们认识 Apress 的专业人士。我们向 Apress 的 Susan McDermott\
