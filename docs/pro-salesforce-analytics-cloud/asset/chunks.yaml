    The entire dashboard requires no more than 15 minutes to create for someone familiar
    with the data used. You can also use grouping and measure features in lens screens
    to explore the data in the case you are not familiar with what’s contained in
    the dataset. These easy-to-use methods are very intuitive to discover hidden trends
    of the data including the high-level cardinality, distribution of attributes,
    and unexpected correlations.


    ## Dashboard Design Aesthetics


    We are now familiar with how to create a simple dashboard and explore data in
    Salesforce Analytics Cloud. In the following section, we will examine dashboard
    design fundamentals.


    ### Steps to Design Aesthetic Dashboards


    Salesforce prides itself on creating superb customer experience. The Salesforce
    Analytics Cloud is no exception. As we have seen in various examples so far, the
    visualization capabilities of the Salesforce Analytics Cloud are appealing and
    the animation when you interact with the system is simply stunning. However, visualizations
    alone do not make great dashboard and analytics solutions. In this section, we’ll
    cover some tips and best practices on designing effective and meaningful analytics
    output.


    #### Understand the User Problems


    BI developers and analysts frequently make mistakes in determining usage scenarios
    for their applications, and focusing on metrics that lack relevance or analytic
    value. The good news is that Salesforce Analytics Cloud is primarily self-servicing
    in nature. Business analysts can explore datasets, design visualization, and share
    output all through an intuitive user interface. However, there are circumstances
    you might be designing a dashboard for use by members of your team.


    In order to design effective output, the first step is to understand the business
    drivers and determine what your users care about. Instead of guessing about what
    your users will find important, poll them directly to find out the key information
    needs. Many modern social network sites such as Facebook used this strategy to
    understand the needs of their advertisers and release UI updates based on the
    feedback.


    #### User Goals


    User experience design should not take on a static method, as human beings are
    different in what information we need and how we consume what’s presented to us.
    What works for one person might not work for another. The most effective approach
    is to anticipate specific experiences and to shape certain behaviors. In addition,
    a well-throughout design must be tailored to the goals, values, and decision process
    of different personas or user groups.


    #### Usability


    User experience and usability have become synonymous, but they are two different
    concepts. User experience addresses how a user feels when using a system, while
    usability is about the user-friendliness and efficiency of the interface.


    Usability and user experience are not completely unrelated either. Usability is
    a big part of the user experience and plays an important role in experiences that
    are effective and pleasant. In addition to usability, human factors, psychology,
    information architecture and user-centered design principles also have significant
    impact on the user experience in general.'
