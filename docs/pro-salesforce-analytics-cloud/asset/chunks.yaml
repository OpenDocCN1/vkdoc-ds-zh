    their assistance, this book would not have been possible. We wish to extend our
    thanks to our technical editors, Mike Martin and Carl Brundage. We would like
    to acknowledge the assistance of Ciolek Ltd, Attorneys at Law in legal matters
    associated with our efforts as authors. Last, but not least, we wish to acknowledge
