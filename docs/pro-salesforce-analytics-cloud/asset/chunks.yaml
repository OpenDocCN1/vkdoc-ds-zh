    \ `orders-ny@springer-sbm.com`, or visit `www.springer.com`. Apress Media, LLC\
    \ is a California LLC and the sole member (owner) is Springer Science + Business\
    \ Media Finance Inc (SSBM Finance Inc). SSBM Finance Inc is a Delaware corporation.\n\
    \nFor Nathaniel G. Smith\n\n## Introduction\n\nData discovery products are a category\
    \ of analytics and business intelligence software that dominates new investment\
    \ and has been gaining popularity, as organizations strive to enable decision-making\
    \ with data. The reason for this popularity is not hard to understand. With data\
    \ discovery software, everyday users can create applications that empower them\
    \ as never before. Users are no longer dependent on their IT departments for reporting\
    \ and data analysis needs. Data discovery users become \"citizen data scientists,\"\
    \ performing basic data analysis and finding correlations. This was previously\
    \ possible only with high-end statistical analysis packages.\n\nThe Salesforce\
    \ Analytics Cloud is a data discovery product introduced at the Salesforce conference\
    \ Dreamforce in 2014, and has features that make it a compelling offering for\
    \ organizations considering an investment in this exciting area of technology.\
    \ It is 100% cloud-based, and adheres to Salesforce's strategy of \"mobile first,\"\
    \ with a fully functional mobile platform for creating and using data discovery\
    \ applications. The pricing model for Salesforce Analytics Cloud allows organizations\
    \ to adopt it with no capital investment. The Analytics Cloud is flat-fee subscription\
    \ based, and is not subject to data transfer costs. Although the Salesforce Analytics\
    \ Cloud is oriented towards everyday users, it also has advanced features that\
    \ enable sophisticated applications to be developed by programmers. Support is\
    \ available on a 24/7 basis and is included in some of the subscription packages.\n\
    \nSalesforce Analytics Cloud has built-in integration capabilities for building\
    \ Salesforce Analytics Cloud applications with Salesforce data. It also has the\
    \ capability of creating applications with data originating outside of Salesforce.\
    \ This capability—creating applications with outside data—is the focus of this\
    \ title.\n\nPart 1 of this title provides guidance on using the Salesforce Analytics\
    \ Cloud, introducing basic concepts, followed by more sophisticated usage.\n\n\
    Part II focuses on two use cases. The first use case features data from a corporation\
    \ engaged in manufacturing. It has data from a wide variety of venues, from the\
    \ factory floor to the executive suite. The second use case chapter illustrates\
    \ how Salesforce Analytics Cloud is used with sales performance data, and is entirely\
    \ developed on the Salesforce Analytics Cloud mobile interface. The final chapter\
    \ covers advanced data acquisition and data processing, and covers how web scrapers\
    \ and crawlers can be used to harvest data for use in Salesforce Analytics Cloud.\
    \ This is followed by an overview of data processing, with a discussion on the\
    \ Python programming language and how it can be used for data processing.\n\n\
    ## Acknowledgments\n\nWe wish to gratefully acknowledge the assistance of our\
    \ friend and colleague Paul Carlstoem in introducing us to the professionals at\
    \ Apress. We would like to extend our gratitude to Susan McDermott and Rita Fernando\
    \ at Apress for working so diligently on this title. Working with the team at\
    \ Apress has been a pleasure and without their assistance, this book would not\
    \ have been possible. We wish to extend our thanks to our technical editors, Mike\
    \ Martin and Carl Brundage. We would like to acknowledge the assistance of Ciolek\
    \ Ltd, Attorneys at Law in legal matters associated with our efforts as authors.\
    \ Last, but not least, we wish to acknowledge the support of family and friends\
    \ in their support our efforts as authors, especially our longtime friend and\
    \ mentor Dr. Mesbeh Ahmed."
