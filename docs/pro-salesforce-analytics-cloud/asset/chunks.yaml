    ### 仪表盘小结


    通过本节涵盖的信息，您应该能够开始创建自己的仪表盘了。关于仪表盘的更多信息，请参阅第 3 章。第 5 章和第 6 章提供了展示仪表盘使用的用例。


    ## 应用程序


    Cloud Explorer 的最后一个主要元素是其应用程序。应用程序允许您将仪表盘、透镜和数据集打包在一起。除了容器功能外，这些应用程序本身没有其他固有特性，因此也没有对应的编辑器。应用程序是通过前面图
    2-4 中显示的 `Create` 按钮创建的。


    当您为对象使用 `Save` 按钮时，可以将其与某个应用程序关联。数据集可以通过编辑并更改其关联的应用程序来与应用程序关联。一个应用程序可以包含任意数量的数据集、仪表盘和透镜。


    ### 我的私有应用程序


    Cloud Explorer 中有一个默认应用程序，名为 `My Private App`。顾名思义，其他用户无法看到此应用程序中的任何内容。这是所有对象的默认
    `Save` 位置，也是一个暂存区域或草稿本，您应在对象准备就绪供公开使用之前，将它们存储在此处。


    ### 共享按钮


    应用程序、透镜和仪表盘都有一个 `Share` 按钮，您应该已经注意到了。`Share` 按钮用于与拥有 Salesforce 登录凭据的其他用户共享对象。应用程序的
    `Share` 按钮如图 2-26 所示。


    ![A978-1-4842-1203-5_2_Fig26_HTML.jpg](img/A978-1-4842-1203-5_2_Fig26_HTML.jpg)


    图 2-26. 应用程序的 `Share` 按钮


    点击 `Share` 按钮将打开图 2-27 所示的消息框。此消息框的功能是共享和协作的常用方式，允许您选择要共享的单个用户或您组织中的特定人员级别。例如，您可以发布到
    Salesforce 动态、截取屏幕截图，并获取一个 URL，以便与您允许查看该应用程序的用户共享。这种协作功能使得在 Salesforce Analytics
    Cloud 中共享您的数据发现工作变得非常简单。请注意，共享屏幕截图会创建一个图形快照，可以与非 Salesforce Analytics Cloud 用户共享。但是，无法与这些用户共享仪表盘或透镜。


    ![A978-1-4842-1203-5_2_Fig27_HTML.jpg](img/A978-1-4842-1203-5_2_Fig27_HTML.jpg)


    图 2-27. 应用程序的共享选项


    ### 演练数据


    Cloud Explorer 可以在移动设备上访问“演练数据”，您可以用它来熟悉 Cloud Explorer。这些数据由不同的应用程序组成，因此您可以看到其所有元素的良好示例。


    ## Wave 的不足之处


    您可能正在评估 Wave 是否适合作为数据发现产品，因此指出可能构成障碍的方面非常重要。


    ### 文本处理与分析


    Wave 本质上是一个只能对数值数据执行基本聚合的产品。它不具备执行文本处理的能力，并且缺乏用于文本分析的可视化（例如标签云）。Wave 可以将文本用作其可视化中的维度，但在此上下文中，其目的仅是为数值数据提供意义。


    为了说明这一点，假设您有一个简单的电子表格，按品牌和型号对汽车的四分之一英里时间进行排名，那么汽车的名称将简单地作为图表上的图例或轴标签呈现在数值数据旁边。Wave
    无法对汽车名称执行演示。Wave 也缺乏对文本数据执行搜索的能力。因此，如果您的数据集是一个包含六十多年生产的汽车的长长列表，您将无法搜索任何汽车的名称。但是，您可以对文本进行筛选，在某些情况下这可能会满足您的需求。


    ### 地图与地理空间数据


    Wave 在其可视化控件或小部件中无法处理地理空间数据。如果您正在寻找一款带有地图组件、允许通过点击地图来选择和细化数据的数据发现产品，那么您可能需要考虑其他数据发现产品。


    ### 高级数学与统计函数


    高级数学函数在 Wave 中不可用。通常，数据发现产品并不普遍具备此功能，因此，如果您正在设计需要更复杂数学函数（如标准差或移动平均值）的应用程序或工作流，则应在将数据加载到
    Wave 之前对这些数据进行计算。


    ## 结论


    本章探讨了 Salesforce Analytics Cloud 中最面向用户的部分，即 Cloud Explorer。这里介绍了 Cloud Explorer
    的主要元素，包括数据集、透镜、仪表盘和应用程序。同时提供了帮助初学者开始使用 Cloud Explorer 的信息，随后回顾了 Cloud Explorer
    的共享能力及其一些局限性。


    请记住孔子的建议：要成为一名“践行者”以获取知识。凭借本章提供的信息，您可以迈出成为 Cloud Explorer 践行者的第一步。


    # 3. Analytics Cloud 构建器


    > 在新的信息社会中，正因为数据如此之多，直觉才变得愈发有价值。 — [约翰·奈斯比特](http://en.wikipedia.org/wiki/John_Naisbitt#_blank%23John%20Naisbitt%20wiki)


    美国作家兼演讲家约翰·奈斯比特在其未来趋势研究中备受推崇。他延伸了爱因斯坦的结论——“唯一真正有价值的东西是直觉”，强调了在数据爆炸和丰富的时代，人类直觉的重要性。一个直观的用户界面来探索数据和开发可视化至关重要，而这正是
    Salesforce Analytics Cloud 的关键优势之一。


    在第 2 章中，我们介绍了 Salesforce Analytics Cloud 中提供的各种可视化。在本章中，我们将重点介绍如何使用 Analytics
    Cloud 构建器设计仪表盘。


    我们将首先使用一个简单的数据集，从头开始逐步创建一个仪表盘。然后，我们将讨论关于设计可视化的最佳实践主题。还将演示如何通过移动设备创建数据集和仪表盘，随后介绍使用
    SAQL 进行的高级仪表盘开发。


    ## 构建一个简单仪表盘


    在本节中，我们将首先进行一个逐步的仪表盘构建练习。所有数据集和 JSON 模板都可以从 [`www.apress.com/9781484212042`](http://www.apress.com/9781484212042)
    下载，并点击 `Source Code` 选项卡。您可以跟随我们逐步讲解的示例进行操作。

