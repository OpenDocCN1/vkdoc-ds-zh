    ### 步骤 1：连接数据源


    大多数 ETL 软件包都宣称能够连接数百种类型的数据源。此步骤旨在连接其中一种数据源，通常只需提供数据源的主机名、用户名和密码即可。


    ### 步骤 2：提取数据


    此步骤成功的关键在于，需要有一位熟悉源数据、了解应使用哪些表或其他实体的开发人员或分析师。要成功完成此步骤，步骤 1 中的用户名必须具有访问源表或实体的权限或安全特权。


    ### 步骤 3：排序、筛选和转换


    大多数 ETL 软件包都提供了图形化方式，用于将源数据映射到目标列、转换数据以及过滤掉不需要的值范围。对于 Salesforce Analytics Cloud，在此步骤中，您需要确保每列的数据类型正确，并选择数据集中的列名称。


    ### 步骤 4：确定数据集


    您在 Salesforce Analytics Cloud 中选择将要接收数据的数据集。如果该数据集不存在，则会创建它。在此步骤中，您需要指定数据的写入方法，其中可能包括先删除现有数据再写入，或追加到现有数据集。


    ### 步骤 5：写入数据集


    您将数据写入 Salesforce Analytics Cloud。但在执行此操作之前，您需要先验证身份登录到 Salesforce。当 ETL 工具通过身份验证后，它便会直接写入
    Salesforce Analytics Cloud。此步骤假设您使用的 ETL 工具原生支持 Salesforce Analytics Cloud。为确保获得原生支持，请从支持
    Salesforce Analytics Cloud 的 ETL 供应商中选择一个。查找这些供应商最简单的方法之一是在 Salesforce Analytics
    Cloud 的数据集创建页面上，如图 4-4 所示。


    ![A978-1-4842-1203-5_4_Fig4_HTML.jpg](img/A978-1-4842-1203-5_4_Fig4_HTML.jpg)


    图 4-4.

    数据集创建页面上的合作伙伴列表


    在图 4-4 所示的公司中，Informatica、Mulesoft、Jitterbit、Dell Boomi、Snaplogic 和 Talend 都拥有强大的
    ETL 产品线，并专注于该技术领域。IBM 拥有多款产品可与 Salesforce Analytics Cloud 集成，其功能远不止 ETL 工具。


    Salesforce Analytics Cloud 的优势之一在于，Salesforce 确保其产品与其他 IT 公司的产品建立合作关系。许多合作伙伴都提供了白皮书、演示视频和交互式网站，用以展示其产品如何与
    Salesforce Analytics Cloud 集成。


    ## Wave REST API


    如前所述，Wave REST API 是一种从 Salesforce Analytics Cloud 检索数据的工具。截至撰写本文时，Wave REST API
    仍是 Salesforce 的一个试点项目，尚未向公众普遍开放。有意参与 Wave REST API 试点项目的人士应联系 Salesforce。


    您可能想知道 REST 这个缩写词的含义。它代表“表述性状态转移”，是一种用于在万维网上公开 API 的分布式计算标准方法。REST 正逐步取代一种称为 SOAP
    的较旧的分布式计算方法。


    ## 本章小结


    本章介绍了两种技术，用于将来自 Salesforce 之外不同源的数据移动到 Salesforce Analytics Cloud 的数据集中。我们首先探讨的技术是外部数据
    API，其主要针对客户解决方案开发。第二种技术是原生支持 Salesforce Analytics Cloud 的 ETL 工具。ETL 工具是将数据导入
    Salesforce Analytics Cloud 的最简单途径，但它们需要投入成本。此外，正确使用 ETL 工具需要专业知识，这也是一个需要考虑的因素。


    我们还研究了一种用于从 Salesforce Analytics Cloud 检索数据的技术，即 Wave REST API。虽然目前尚未向公众开放，但组织可以申请参与试点项目。


    # 第二部分


    # 第 5 章 关键决策制定与 Salesforce Analytics Cloud


    > 没有数据，任何人所做任何事都可以自由宣称成功。 ——安格斯·迪顿，《大逃离》


    在其 2015 年出版的著作《大逃离：健康、财富与不平等的起源》的前言中，诺贝尔奖得主、经济学家安格斯·迪顿指出，在缺乏支持性数据的情况下宣称成功，在我们当今世界司空见惯，这常常导致人们对负责维护和保护我们社会福利的机构和组织缺乏信心。为了支持其书中的结论和陈述，迪顿总是提供数据、数据的来源，并说明这些来源的可信度（或不可信度）。


    利用数据来支持决策和得出结论是进行关键决策制定的基础。能够做出更好、更快决策并有效执行的公司，几乎总能超越竞争对手。对于做出重大、高价值的选择而言，这一事实显而易见。关键决策可能包括推出新产品或将生产基地迁往亚洲，因为这些决策涉及大量资源和显著风险。


    不那么明显的是那些周复一周做出的、同样重要但没那么引人注目的决策。这类决策通常是运营性的，由一线或接近一线的员工制定和执行。这些同等重要的决策所产生的净影响可能等同于花费或节省数千甚至数百万美元。然而，我们身处信息技术的数据丰富时代，我们的目标是尽可能多地捕获信息，并利用分析来促进这种数据驱动的决策制定。我们如何应对这一挑战？


    由于需要做出的决策如此之多，而能够执行必要分析的数据科学家又短缺，因此出现了一种趋势，即使用数据发现产品，让普通用户——凡夫俗子——也能执行数据分析。在本章中，我们聚焦于一个用例，来演示如何使用此类工具来制定许多日常决策。我们的用例是一家既自行制造玻璃，又用该玻璃制造各种产品的公司。

