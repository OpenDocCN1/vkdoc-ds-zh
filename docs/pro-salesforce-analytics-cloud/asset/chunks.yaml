- fmt: '### 评估工厂经理绩效


    在大多数大型企业中，工厂经理负责制造设施，而企业领导层会持续评估这些工厂经理的绩效。通常，一整年的关键绩效指标（KPI）被用来评估他们的表现。`Salesforce
    Analytics Cloud`使这项任务变得简单。


    例如，我们玻璃公司浮法玻璃工厂的良率、运行时间和吞吐量等绩效数据被收集到一个仪表盘中，如图[5-11](#A978-1-4842-1203-5_5_Chapter.html#Fig11)所示。这些数据通过使用日历热力图小部件获得，这是一种强大的可视化工具，允许一眼查看大量数据。在此仪表盘上，显示了浮法玻璃工厂的良率、运行时间和吞吐量KPI，以及换产次数。小部件上的深色方块表示更高的数值和更好的性能。每个小部件的上方是该KPI在整个公司的平均值。


    ![A978-1-4842-1203-5_5_Fig14_HTML.jpg](A978-1-4842-1203-5_5_Fig14_HTML.jpg)


    图5-14. 2014年工厂绩效仪表盘，使用日历热力图小部件


    用户只需将光标放在任何一个方块上，就可以获得热力图上相关KPI的值。显示的数据包括年份和月份、KPI以及工厂编号。例如，在图[5-15](#A978-1-4842-1203-5_5_Chapter.html#Fig15)中，显示了22号工厂的吞吐量KPI。


    ![A978-1-4842-1203-5_5_Fig15_HTML.jpg](A978-1-4842-1203-5_5_Fig15_HTML.jpg)


    图5-15. 2014年7月22号工厂的吞吐量数据


    当所生产玻璃的某个方面发生改变时，工厂就会进行产品换产。这些换产记录在仪表盘右下角的热力图中。通常，换产涉及玻璃厚度或颜色的改变，并且往往意味着生产停机。普遍认为换产可能不利于工厂的生产目标，然而，有些工厂，如22号工厂，尽管换产次数很多，却依然表现出色。这是怎么回事呢？


    2014年7月，发生了五次换产，都是关于玻璃厚度的改变；不过，其吞吐量和良率数据表现良好，吞吐量达到了98%，良率达到了93%。这些积极的结果在仪表盘上一目了然——这清楚地证明了22号工厂的工厂经理表现卓越。这位工厂经理非但没有惧怕产品换产，反而向他的团队发起挑战，要求他们找到管理换产的创造性方法，并为达到卓越生产数据提供了奖金形式的激励。这一策略取得了成效，22号工厂成为整个公司效仿的榜样。


    传统上，企业管理层依赖电子表格来分析绩效，但这种方法没有`Salesforce Analytics Cloud`那样的灵活性。后者的仪表盘提供了紧凑、全面的视图，可以动态更新，并且具备细化数据的能力。图[5-16](#A978-1-4842-1203-5_5_Chapter.html#Fig16)展示了当管理者点击热力图中的一个方块时，如何细化此仪表盘上的数据。


    ![A978-1-4842-1203-5_5_Fig16_HTML.jpg](A978-1-4842-1203-5_5_Fig16_HTML.jpg)


    图5-16. 选择2014年3月数据时，17号工厂的低良率数据


    在此期间，尽管图[5-16](#A978-1-4842-1203-5_5_Chapter.html#Fig16)中选定的工厂运行时间为94%，吞吐量为97%，但其良率仅为81%。当然，这些数字并非总是管理不善的指标；有时是玻璃熔炉的使用寿命即将结束或需要重建。17号工厂的玻璃熔炉上次重建是在1994年，因此这里存在这种可能性。无论如何，这类数字令人担忧，并将引发企业管理层的进一步深入研究，但很可能正是因为仪表盘的可读性，这些问题才得以引起注意。


    在本章前面，我们讨论了认知偏见以及数据驱动决策如何能够消除这种认知偏见。对工厂绩效和工厂管理的评估常常会受到这种认知偏见的影响。例如，一位最近在换产总是导致生产数据下降的工厂工作过的管理者，往往会倾向于制定避免换产的排程，以确保生产数据得以维持。这是近因偏差的一个例子。当然，避免换产的缺点是无法灵活地满足市场对产品的需求，导致客户寻找其他供应商。看看22号工厂的高绩效，可以推断出换产是可以管理的，这已在数据中得到证实。


    ### 结论


    正如本章所讨论的，认知偏见可能导致管理层基于不完整或不准确的数据做出不合逻辑的决策；这些决策满足了情感需求或实现了证明自己正确的愿望。每个人都会做出一些错误的决定，或者基于不完整或不准确的信息做出决策；我们都受到认知偏见的影响，却没有意识到它的存在。


    然而，`Salesforce Analytics Cloud`几乎有能力消除认知偏见。我们以一家玻璃公司为例，展示了如何通过快速简便的方式呈现数据，帮助管理者正确诊断设备故障和生产放缓的原因。我们对比了该公司两个工厂的情况，数据揭示了一家工厂成功应对了换产挑战，而另一家工厂的生产数据则不那么令人满意。每个案例的数据都呈现在仪表盘中，便于轻松获取更多细节进行评估和比较。


    我们还看到了`Salesforce Analytics Cloud`如何更高级地应用于组织内部的人员绩效评估。这展示了`Salesforce Analytics
    Cloud`的多功能性，尤其是它在任何情况下都能发挥作用的能力，以及使用户能够在坚实数据的支持下，创造性地做出日常决策的能力。'
  raw: '### Assessing Plant Manager Performance


    Within most major corporations, the plant managers are in charge of the manufacturing
    facilities, and corporate leadership is constantly assessing the performance of
    those plant managers. The KPIs for an entire year are typically used to assess
    their performance. The Salesforce Analytics Cloud makes this task easy.


    For example, the performance numbers for yield, uptime, and throughput for of
    our glass company’s float glass facilities are collected into one dashboard, shown
    in Figure [5-11](#A978-1-4842-1203-5_5_Chapter.html#Fig11). This data is obtained
    by using the calendar heat map widget, a powerful visualization tool that allows
    considerable data to be viewed at one glance. On this dashboard, the yield, uptime,
    and throughput KPIs for the float glass facilities are shown along with changeovers.
    The darker squares on the widget indicate a higher number and better performance.
    Above each of the widgets is the average for the entire corporation for each KPI.


    ![A978-1-4842-1203-5_5_Fig14_HTML.jpg](A978-1-4842-1203-5_5_Fig14_HTML.jpg)


    Figure 5-14.


    2014 facilities performance dashboard, using calendar heat map widgets


    Simply by locating the cursor on any one of these squares, the user obtains the
    value for the relevant KPI on the heat map. The data shown is for year and month,
    the KPI, and the plant number. In Figure [5-15](#A978-1-4842-1203-5_5_Chapter.html#Fig15),
    the throughput KPI for Plant 22 is shown, for example.


    ![A978-1-4842-1203-5_5_Fig15_HTML.jpg](A978-1-4842-1203-5_5_Fig15_HTML.jpg)


    Figure 5-15.


    Throughput data for July 2014, Plant 22


    A product changeover in a facility occurs when some aspect of the glass being
    produced is changed. These changeovers are tracked on the heat map in the lower
    right of the dashboard. Usually, changeovers involve alterations in glass thickness
    or color, and they often mean production downtime. It is a common belief that
    changeovers can be detrimental to a facility’s production goals, yet some plants,
    like Plant 22, flourish despite a high number of changeovers. But how so?


    In July 2014, there were five changeovers, consisting of glass thickness changes;
    however, the throughput and yield numbers were good, with throughput of 98 percent
    and yield of 93 percent. These positive results are easily seen in the dashboard—it’s
    clear evidence that the plant manager at Plant 22 is performing at an exemplary
    level. Instead of fearing product changeovers, this plant manager issued a challenge
    to his team to find creative ways to manage the changeovers, and he provided incentives
    in the form of bonuses for reaching superior production numbers. The strategy
    paid off, and Plant 22 became an example for the rest of the corporation to emulate.


    Traditionally, corporate management has relied on spreadsheets to analyze performance,
    but this approach does not come with the flexibility of the Salesforce Analytics
    Cloud, with its dashboards providing compact, comprehensive views that are updated
    dynamically, as well as the ability to refine the data. Figure [5-16](#A978-1-4842-1203-5_5_Chapter.html#Fig16)
    shows how managers could refine the data on this dashboard when they click one
    of the squares in the heat map.


    ![A978-1-4842-1203-5_5_Fig16_HTML.jpg](A978-1-4842-1203-5_5_Fig16_HTML.jpg)


    Figure 5-16.


    Lower yield numbers for Plant 17 when March 2014 data is selected


    During this time, despite having uptime of 94 percent and throughput of 97 percent,
    the plant selected in Figure [5-16](#A978-1-4842-1203-5_5_Chapter.html#Fig16)
    was able to yield only 81 percent. Of course, these numbers are not always an
    indicator of poor management; sometimes a glass furnace is nearing the end of
    its life or needs a rebuild. The last rebuild of the glass furnace for Plant 17
    was in 1994, so this is a strong possibility here. In any case, numbers like these
    are cause for concern and will initiate a deeper study by corporate management,
    but they were likely brought to attention because of the dashboard’s readability.


    Earlier in this chapter we discussed cognitive bias and how data-driven decision
    making can eliminate such cognitive bias. Assessment of plant performance and
    plant management is often susceptible to such cognitive bias. For example, a manager
    whose recent experience included working at a plant where changeovers consistently
    resulted in lower production numbers would tend to lean toward schedules that
    avoid changeovers so as to ensure production numbers are maintained. This is an
    example of recency bias. The downside to avoiding changeovers, of course, is a
    lack of flexibility in meeting market demands for product, leaving customers to
    find other suppliers. Looking at the high performance of Plant 22, one can conclude
    that changeovers can be managed, evidenced in the data.


    ## Conclusion


    As discussed in this chapter, cognitive bias can lead management to make illogical
    decisions based on incomplete or inaccurate data; these are decisions that satisfy
    an emotion need or fulfill a desire to be right. Everyone makes some wrong decisions
    or has incomplete or inaccurate information on which to base a decision; we are
    all subject to cognitive bias, without being aware that it exists.


    The Salesforce Analytics Cloud, however, has the capability of nearly eliminating
    cognitive bias. We used the example of a glass company to show how presenting
    data in a quick and easy way can help managers to correctly diagnose the causes
    of equipment failures and production slowdowns. We contrasted the cases of two
    of the company’s plants, with data revealing successful coping with changeovers
    for one and less satisfying production numbers for the other. The data in each
    case was presented in dashboards that offered easy access to additional details
    for evaluation and comparison.


    We also saw how the Salesforce Analytics Cloud can be used higher up in an organization
    for personnel performance evaluation. This demonstrates the versatility of the
    Salesforce Analytics Cloud, especially its ability to perform in any situation
    and to enable users to be creative in making day-to-day decisions backed by solid
    data.'
