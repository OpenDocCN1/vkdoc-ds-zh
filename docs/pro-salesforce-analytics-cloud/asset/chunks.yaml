  raw: '#### Creating Dashboard in Designer


    The dataset we are using for this example is called “Consumer Spending”, which
    you can download from [`www.apress.com/9781484212042`](http://www.apress.com/9781484212042)
    if you’d like to follow along. We’ll first create a dashboard using the lens explorer
    and designer clipping. We then create the following three lenses: Age, Category,
    and Sum of Value grouped by Item, sorted descending on Sum of Value. We clip them
    to the designer and add them to 2 list widgets and 1 chart widget. Figure [3-30](#A978-1-4842-1203-5_3_Chapter.html#Fig30)
    depicts the design view of the dashboard. Be sure to save the dashboard so you
    do not lose your work.


    ![A978-1-4842-1203-5_3_Fig30_HTML.jpg](A978-1-4842-1203-5_3_Fig30_HTML.jpg)


    Figure 3-30.


    Consumer spending dashboard design view


    Our objective is to only display the top 5 categories based on the age selection.
    In order to accomplish that, we’ll follow these steps to modify the JSON definition
    of the dashboard.


    Obtain SAQL Statement: Create a lens with the “Consumer Spending” dataset. Define
    a measure with “Sum” of “Value” grouped by “Category” and sort with descending
    order. Create a filter using the “Age” dimension and select 2 random age groups.
    Click on the “List” icon and select “</> Edit SAQL Query” Note that Salesforce
    is currently revising the methodology for editing SAQL queries. If you have difficulty
    in editing the SAQL queries, you should contact Wave support for assistance (see
    Figure [3-31](#A978-1-4842-1203-5_3_Chapter.html#Fig31) ).


    ![A978-1-4842-1203-5_3_Fig31_HTML.jpg](A978-1-4842-1203-5_3_Fig31_HTML.jpg)


    Figure 3-31.


    SAQL statement window   Copy and paste the SAQL statement into a text file. Remove
    the newline characters (or line breaks) and make the statement into one line as
    follows: `q = load "0Fb1a000000PB6QCAW/0Fc1a000000PBrfCAG";q = filter q by ''Age''
    == "0 to 25";q = group q by ''Category'';q = foreach q generate ''Category'' as
    ''Category'', sum(''Value'') as ''sum_Value'', count() as ''count'';q = order
    q by ''sum_Value'' desc;q = limit q 2000;` Save the text file for later use.  
    Navigate to the lens configuration page by replacing in the URL “explore” with
    “lens” as follows: https://[domain].salesforce.com/analytics/wave/web/explore.apexp
    ➤ https://[domain].salesforce.com/analytics/wave/web/lens.apexp   Select the dashboard
    lens and your dashboard JSON file will show up on the text box on the right (see
    Figure [3-32](#A978-1-4842-1203-5_3_Chapter.html#Fig32) ).


    ![A978-1-4842-1203-5_3_Fig32_HTML.jpg](A978-1-4842-1203-5_3_Fig32_HTML.jpg)


    Figure 3-32.


    Configuration window   Select the JSON text. Copy and paste it into a JSON editor
    of your choice. We’ll be using Sublime Text. Within the “state” section of the
    JSON file, locate “steps.” Find the step called “Catogory_1” and the “query” section
    underneath it. Add the following line (the pigql text came from the SAQL statement
    we copied and pasted into the text file in step 2. `"pigql":"q = load \"0Fb1a000000PB6QCAW/0Fc1a000000PBrfCAG\";q
    = load "0Fb1a000000PB6QCAW/0Fc1a000000PBrfCAG";q = filter q by ''Age'' == "0 to
    25";q = group q by ''Category'';q = foreach q generate ''Category'' as ''Category'',
    sum(''Value'') as ''sum_Value'', count() as ''count'';q = order q by ''sum_Value''
    desc;q = limit q 2000;",`   Copy and paste the entire JSON file into the lens
    textbox in the Analytics Cloud screen and click on “Update Lens.” Go back to the
    Analytics home page and refresh the dashboard to ensure the pigql statement is
    working properly.   Go back to the JSON file and update the following: Change
    ''Age'' == "0 to 25" to ''Age'' in {{selection(Age_2)}} This is called selecting
    binding. It basically tells the pigql to use the selection result of the “Age_2”
    step as the filter for Age in the category selection.   Change limit q 2000 to
    limit q 5 This is to limit number of result to the top 5 categories of highest
    amount of consumer spending based on the age group selection.     Replace with
    the new JSON file and click on “Update Lens.”   Refresh the dashboard and you
    should be able to see the age group selection will update the category list widget
    as shown in Figure [3-33](#A978-1-4842-1203-5_3_Chapter.html#Fig33) .


    ![A978-1-4842-1203-5_3_Fig33_HTML.jpg](A978-1-4842-1203-5_3_Fig33_HTML.jpg)


    Figure 3-33.


    Dynamic selection binding


    ## Summary


    While data is important, without analysis, it is of little value. It’s common
    in this new data era to feel astounded by the explosive amounts of data being
    collected and shared. Understanding key business drivers and pain points helps
    business analysts to evaluate what insights are needed. Albert Einstein was on
    to something when he said we can’t always track what we want to count, but that
    doesn’t stop us from constantly exploring new ways to get the data we need.


    The success of analytics solution is largely dependent upon human intuition and
    the ability to ask intelligent questions, both of the business stakeholders and
    of the data in your analysis approach. Framing a business question properly is
    essential to avoid flawed analysis and erroneous conclusions.


    Salesforce Analytics Cloud is a unique cloud-based analytics tool that gives your
    knowledge workers the ability to explore data, design effective visualization,
    and generate insights.


    # 4. Salesforce Analytics Platform


    > If you know the enemy and know yourself, you need not fear the result of a hundred
    battles. —Sun Tzu, The Art of War


    In Sun Tzu’s timeless epic The Art of War, the highest value is placed on understanding
    one’s own capabilities and the challenges that lie ahead. The same can be said
    of a business organization and its analytics software. If you understand your
    software and your data, you can maximize it to solve your particular problems.
    In the first three chapters we covered the simplest, user-enabled methods of loading
    data into the Salesforce Analytics Cloud. Now we look at methods to move data
    from different sources into the Salesforce Analytics Cloud datasets.


    Much of the material presented in this book concerns features of interest to everyday
    business users, allowing them to create analytics dashboards. This chapter, however,
    explains some advanced capabilities available with the Salesforce Analytics Cloud,
    usually the domain of developers and IT professionals. The capabilities described
    here are relatively new, and certainly some are subject to change; nevertheless,
    this may be helpful in reviewing your options.


    Note


    The information presented is based on what is available at present. It is not
    an in-depth technical guide; rather, it’s a roadmap that helps you survey these
    technologies. For full technical details, readers should consult the applicable
    technical documentation and media.'
  trans: "\n### 在 Designer 中创建仪表板\n\n本示例使用的数据集名为“消费者支出”，如果你想跟着操作，可以从 [`www.apress.com/9781484212042`](http://www.apress.com/9781484212042)\
    \ 下载。我们将首先使用透镜探索器和 Designer 裁剪功能创建一个仪表板。然后，我们创建以下三个透镜：`Age`、`Category` 以及按 `Item`\
    \ 分组、按 `Sum of Value` 降序排列的 `Sum of Value`。我们将它们裁剪到 Designer，并添加到 2 个列表组件和 1 个图表组件中。图\
    \ 3-30 展示了仪表板的设计视图。请务必保存仪表板，以免丢失工作成果。\n\n![A978-1-4842-1203-5_3_Fig30_HTML.jpg](img/A978-1-4842-1203-5_3_Fig30_HTML.jpg)\n\
    \n**图 3-30.** 消费者支出仪表板设计视图\n\n我们的目标是仅显示基于年龄选择的前 5 个类别。为了实现这一目标，我们将按照以下步骤修改仪表板的\
    \ JSON 定义。\n\n1.  **获取 SAQL 语句**：使用“消费者支出”数据集创建一个透镜。定义一个度量，对“Value”进行“Sum”求和，并按“Category”分组，然后降序排列。使用“Age”维度创建一个筛选器，并选择两个随机年龄组。点击“List”图标，然后选择“</>\
    \ Edit SAQL Query”。请注意，Salesforce 目前正在修订编辑 SAQL 查询的方法。如果你在编辑 SAQL 查询时遇到困难，应联系\
    \ Wave 支持部门以获取帮助（参见图 3-31）。\n\n    ![A978-1-4842-1203-5_3_Fig31_HTML.jpg](img/A978-1-4842-1203-5_3_Fig31_HTML.jpg)\n\
    \n    **图 3-31.** SAQL 语句窗口\n\n2.  将 SAQL 语句复制并粘贴到一个文本文件中。删除换行符（或断行），使语句成为一行，如下所示：\n\
    \    ```\n    q = load \"0Fb1a000000PB6QCAW/0Fc1a000000PBrfCAG\";q = filter q\
    \ by 'Age' == \"0 to 25\";q = group q by 'Category';q = foreach q generate 'Category'\
    \ as 'Category', sum('Value') as 'sum_Value', count() as 'count';q = order q by\
    \ 'sum_Value' desc;q = limit q 2000;\n    ```\n    保存文本文件以备后用。\n\n3.  通过将 URL\
    \ 中的“explore”替换为“lens”，导航到透镜配置页面，如下所示：\n    `https://[domain].salesforce.com/analytics/wave/web/explore.apexp`\
    \ ➤ `https://[domain].salesforce.com/analytics/wave/web/lens.apexp`\n\n4.  选择仪表板透镜，你的仪表板\
    \ JSON 文件将显示在右侧的文本框中（参见图 3-32）。\n\n    ![A978-1-4842-1203-5_3_Fig32_HTML.jpg](img/A978-1-4842-1203-5_3_Fig32_HTML.jpg)\n\
    \n    **图 3-32.** 配置窗口\n\n5.  选中 JSON 文本，将其复制并粘贴到你选择的 JSON 编辑器中。我们将使用 Sublime\
    \ Text。在 JSON 文件的“state”部分中，找到“steps”。找到名为“Catogory_1”的步骤及其下方的“query”部分。添加以下行（pigql\
    \ 文本来自我们在步骤 2 中复制并粘贴到文本文件中的 SAQL 语句）。\n    ```\n    \"pigql\":\"q = load \\\"\
    0Fb1a000000PB6QCAW/0Fc1a000000PBrfCAG\\\";q = filter q by 'Age' == \\\"0 to 25\\\
    \";q = group q by 'Category';q = foreach q generate 'Category' as 'Category',\
    \ sum('Value') as 'sum_Value', count() as 'count';q = order q by 'sum_Value' desc;q\
    \ = limit q 2000;\",\n    ```\n\n6.  将整个 JSON 文件复制并粘贴到 Analytics Cloud 屏幕的透镜文本框中，然后点击“Update\
    \ Lens”。返回 Analytics 主页并刷新仪表板，以确保 pigql 语句正常工作。\n\n7.  返回 JSON 文件并进行以下更新：\n  \
    \  - 将 `'Age' == \"0 to 25\"` 更改为 `'Age' in {{selection(Age_2)}}`。这称为选择绑定。它本质上告诉\
    \ pigql 使用“Age_2”步骤的选择结果作为类别选择中 Age 的筛选条件。\n    - 将 `limit q 2000` 更改为 `limit\
    \ q 5`。这是为了将结果数量限制为基于年龄组选择的消费者支出金额最高的前 5 个类别。\n\n8.  替换为新 JSON 文件，然后点击“Update\
    \ Lens”。\n\n9.  刷新仪表板，你应该能够看到年龄组选择将更新类别列表组件，如图 3-33 所示。\n\n    ![A978-1-4842-1203-5_3_Fig33_HTML.jpg](img/A978-1-4842-1203-5_3_Fig33_HTML.jpg)\n\
    \n    **图 3-33.** 动态选择绑定\n\n### 总结\n\n虽然数据很重要，但如果没有分析，其价值就微乎其微。在这个新的数据时代，人们常常会对收集和共享的数据量呈爆炸式增长感到震惊。理解关键的业务驱动因素和痛点有助于业务分析师评估需要哪些洞察。阿尔伯特·爱因斯坦曾说过，我们不可能总是衡量我们想要计算的东西，但这并不妨碍我们不断探索获取所需数据的新方法，他这话颇有道理。\n\
    \n分析解决方案的成功在很大程度上依赖于人类的直觉以及提出明智问题的能力，无论是针对业务利益相关者，还是在分析方法中针对数据本身。恰当地提出业务问题对于避免有缺陷的分析和错误的结论至关重要。\n\
    \nSalesforce Analytics Cloud 是一款独特的基于云的分析工具，它使你的知识工作者能够探索数据、设计有效的可视化并生成洞察。\n\n\
    ## 4. Salesforce Analytics 平台\n\n> 知己知彼，百战不殆。 ——孙子，《孙子兵法》\n\n在孙子不朽的巨著《孙子兵法》中，最看重的是了解自身能力和即将面临的挑战。对于商业组织及其分析软件而言也是如此。如果你了解自己的软件和数据，就能最大限度地利用它来解决特定的问题。在前三章中，我们介绍了将数据加载到\
    \ Salesforce Analytics Cloud 中最简单的、用户可操作的方法。现在，我们将探讨将数据从不同来源移动到 Salesforce Analytics\
    \ Cloud 数据集的方法。\n\n本书介绍的大部分内容涉及日常业务用户感兴趣的功能，使他们能够创建分析仪表板。然而，本章将解释 Salesforce Analytics\
    \ Cloud 提供的一些高级功能，这些功能通常属于开发人员和 IT 专业人员的领域。这里描述的功能相对较新，当然有些可能会发生变化；尽管如此，这或许有助于你审视自己的选项。\n\
    \n**注意：** 所提供的信息基于目前可用的内容。它不是一份深入的技术指南，而是一张帮助你概览这些技术的路线图。有关完整的技术细节，读者应查阅相应的技术文档和媒体资料。\n"
- fmt: "# Methods of Data Integration\n\nAnalysts at the leading technology research\
    \ firms regard data integration as a challenge for most analytics software. Yet\
    \ getting the data into the analytics software, including data discovery products,\
    \ is essential for using it productively. Luckily, the `Salesforce Analytics`\
    \ engine permits data integration through the desktop client or mobile interface,\
    \ as well as standard user-accessible methods.\n\nThere are two methods of data\
    \ writing to the `Salesforce Analytic Cloud` and one method for reading the data.\
    \ The `External Data API` and `Extract Transform Load` (ETL) tools are for data\
    \ writing; the `Wave REST API` is for reading the data. Each of these methods\
    \ serves a different need, so it is important to understand their features before\
    \ deciding which you might use. Figure [4-1](#A978-1-4842-1203-5_4_Chapter.html#Fig1)\
    \ presents an overview of the methods.\n\n- The `External Data API`. The `External\
    \ Data API` is used to create datasets. It is the choice for companies that want\
    \ to load large amounts of data without using enterprise software, like ETL tools.\
    \ For example, this is likely the approach for companies who develop particular\
    \ products; they have their custom software-development capability, with software\
    \ developers on staff who are familiar with `REST API` development in general.\n\
    - ETL Tools. `Extract Transform Load` (ETL) tools make data integration easier\
    \ with graphic interfaces, scheduling capability, and support for connection to\
    \ nearly any type of data source. They usually have pre-built connectors to enterprise\
    \ software platforms like `SAP` or `NetSuite`, which makes data access easier.\
    \ The upside is their short development time; however, ETL tools can be costly.\
    \ Purchasing an ETL tool solely to integrate data with the `Salesforce Analytics\
    \ Cloud` would be difficult to justify. Organizations should examine their `Salesforce\
    \ partner` ETL tools to determine if they have native support for the `Salesforce\
    \ Analytics Cloud`.\n- The `Wave REST API`. The `Wave REST API` is used for reading\
    \ data from the `Salesforce Analytics Cloud` (versus obtaining data, as in the\
    \ case of ETL Tools and the `External Data API`). Companies developing products\
    \ that use the `Salesforce Analytics Cloud` would then use the `Wave REST API`.\
    \ These products could be mobile applications or desktop computer products that\
    \ are BI capable. Companies with custom software development capability can use\
    \ the `Wave REST API` to build applications that retrieve data from the `Salesforce\
    \ Analytics Cloud`.\n\n![A978-1-4842-1203-5_4_Fig1_HTML.jpg](A978-1-4842-1203-5_4_Fig1_HTML.jpg)\n\
    \nFigure 4-1. Data integration methods for the Salesforce Analytics Cloud\n\n\
    Now, let’s take a closer look at each of these.\n\n## External Data API\n\nThe\
    \ `External Data API` provides the capability of integrating external data into\
    \ the `Salesforce Analytics Cloud`. The external data is loaded directly into\
    \ datasets, and is then available for queries or for mobile or desktop use of\
    \ the `Salesforce Analytics Cloud`. The following steps, shown in Figure [4-2](#A978-1-4842-1203-5_4_Chapter.html#Fig2),\
    \ are followed so as to use the `External Data API`.\n\n![A978-1-4842-1203-5_4_Fig2_HTML.jpg](A978-1-4842-1203-5_4_Fig2_HTML.jpg)\n\
    \nFigure 4-2. Steps for data integration using External Data API\n\n### Step 1\\\
    . Create .CSV File\n\nAll data is put into `.csv` format and written to a file\
    \ to load into the `Salesforce Analytics Cloud` using the `External Data API`,\
    \ regardless of the source. As a programming task, this is generally easy, but\
    \ care must be taken to ensure the file created is not too large. (See “Restrictions\
    \ on Use” that follows.) Care also must be taken to use quoted identifiers if\
    \ the source has a comma or `CR/LF`. Any quotes in a value surrounded by quoted\
    \ identifiers need to be escaped by another set of quotes; for example, “Don’t\
    \ ““quote”” me.”\n\n### Step 2\\. Create JSON Metadata\n\nThe `JSON` metadata\
    \ file describes the data so that when each row is loaded, the `Salesforce Analytics\
    \ Cloud` is able to determine the data type for each column. To create this file,\
    \ you identify as a date, number, or string each of the fields of the `.csv` file\
    \ created in step 1. This file also determines what, if any, security is applied\
    \ to each row. The `Salesforce Analytic Cloud` maintains a document specifically\
    \ to record this metadata, so developers should refer to this document to fully\
    \ understand the `JSON` format.\n\n### Step 3\\. Upload Files\n\nThis step is\
    \ twofold. The first part is to connect to `Salesforce`. There are a variety of\
    \ methods for authenticating into `Salesforce` and any will suffice. According\
    \ to `Salesforce`, the venerable `SOAP`-based authentication methods or the newer\
    \ `REST`-based can be used to establish connectivity.\n\nThe second part involves\
    \ uploading the files by using an object known as the `InsightsExternalData` object.\
    \ `Salesforce` requires that files larger than 10MB be broken into 10MB “chunks,”\
    \ then uploaded with the `InsightsExternalData` object.\n\n### Step 4\\. System\
    \ Job Is Created and Run\n\nThis job is created automatically after the uploading\
    \ is completed; it does not need to be initiated by the developer. The system\
    \ job-processes the `.csv` file data and the `JSON` metadata.\n\n### Step 5\\\
    . Dataset Is Created\n\nThe dataset creation occurs as a result of step 4, and\
    \ thus is not initiated by the developer, either. Once the dataset is created,\
    \ it is ready for use in the `Salesforce Analytics Cloud`.\n\n### Restrictions\
    \ on Use\n\nCertain restrictions are placed on the `External Data API`, based\
    \ on information current as of this writing and they are subject to change. If\
    \ you need to extend your use of the `External Data API`, contact `Salesforce`.\
    \ The restrictions are as follows:\n\n- A maximum of 50 files per day can be uploaded,\
    \ with all external data uploads occurring in a rolling 24-hour period.  \n- Each\
    \ file can have a maximum file size of 40G.  \n- The maximum number of characters\
    \ in a field is 32K.  \n- For each record, the maximum number of fields is 5K.\
    \  \n- The maximum number of characters for all fields in a record is 400K.  \n\
    \nThe first two limits are the most restrictive, especially item 1. The others\
    \ are not likely to be of concern in most circumstances.\n\n### Supporting Documents\n\
    \n`Salesforce` provides a number of documents for developers to review so as to\
    \ implement the `External Data API`. These documents provide a high level of detail\
    \ and are as follows:\n\n- `Analytics Cloud External Data API Developer’s Guide`.\
    \ Describes the overall process and provides some code examples in the “C” programming\
    \ language. Includes information on the `InsightsExternalData` object.\n- `Analytics\
    \ Cloud External Data Format Reference`. Describes the `JSON` format needed, discussed\
    \ in step 2.\n- `Security Implementation Guide for Analytics Cloud`. Explanation\
    \ of the various modes of security for the `Salesforce Analytics Cloud`. A long\
    \ document that is somewhat nuanced and many details shown are more relevant to\
    \ `Salesforce` data loaded in the `Salesforce Analytics Cloud`.\n\n## Extract\
    \ Transform Load Tools\n\nThe `Extract Transform Load` (ETL) tools have seen widespread\
    \ use in information technology and are one of the most commonly used classes\
    \ of IT software. Many companies provide ETL tools, and most are feature-rich\
    \ and capable of connecting to nearly any type of data source, including back-office\
    \ enterprise software, relational databases, flat files, and data provided via\
    \ APIs. ETL tools also are able to achieve data transformation without needing\
    \ software developers. Figure [4-3](#A978-1-4842-1203-5_4_Chapter.html#Fig3) shows\
    \ the general flow when an ETL tool is used with the `Salesforce Analytics Cloud`.\n\
    \n![A978-1-4842-1203-5_4_Fig3_HTML.jpg](A978-1-4842-1203-5_4_Fig3_HTML.jpg)\n\n\
    Figure 4-3. Steps in using an ETL tool to write data to the Salesforce Analytics\
    \ Cloud\n\nConfiguring the ETL software is a relatively simple task for most users.\
    \ Let’s discuss a few details."
