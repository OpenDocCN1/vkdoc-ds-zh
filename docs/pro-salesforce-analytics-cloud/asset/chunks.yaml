    6-17 所示。


    ![A978-1-4842-1203-5_6_Fig17_HTML.jpg](img/A978-1-4842-1203-5_6_Fig17_HTML.jpg)


    图 6-17.

    第一季度，销售区域-地区，堆叠柱状图


    从这个柱状图来看，西南地区在过去三年中呈现稳步增长。切换图表类型很容易，并且这样做有时会带来好处。在本例中，当我们更改为折线图时，数据背后的故事更加明显：西南地区的折线在该时间段内稳步上升——显然是表现最好的区域，如图
    6-18 所示。


