  trans: '

    # 设计原则


    以下是为分析解决方案设计出色用户体验时需要考虑的一些基本设计原则。


    **原则一：确保可读性。** 文本和背景应使用高对比度。例如，白色或浅黄色背景上的黑色文本更易于阅读。此外，字体大小应足够大，以便在标准显示器上清晰可读。


    **原则二：考虑设备形态。** 字体和图表显示的大小应基于设备而定。针对 iPad、iPhone 和网页端，要设计不同的可视化和显示方案，并定义其默认及首选的布局。


    **原则三：用视觉元素突出重点。** 对于您打算展示的实际数据，应使用特别大的字符，而非标签和说明文字。我们处理信息的方式取决于信息呈现给我们的方式。有效利用粗体、字号、密度和动态效果，来激发我们的视觉敏感度。尽量使用图表而非数字表格。记住，一图胜千言，而每一个词也是一幅图画。


    **原则四：考虑年龄因素。** 避免使用年轻用户来评估尺寸和对比度决策。相反，应在您可能预期到的年龄最大的用户群体上测试所有设计。老花眼是一种眼睛逐渐丧失聚焦近处物体能力的自然现象，通常是衰老过程中令人烦恼的一部分。老花眼通常在
    40 岁出头到中期开始变得明显，并持续恶化直到大约 65 岁。要留意不同年龄在视觉消费需求上的差异。


    **原则五：选择简洁的字体。** 虽然手写体被认为具有美学价值，但往往缺乏可读性。人眼对锐利的边缘反应更佳。因此，应避免使用边缘柔化的抗锯齿字体，尤其是在小字号情况下。


    **原则六：合理规划布局与显示顺序。** 聚焦关键指标，然后逐步深入到更高级别的细节。将相似的图表对齐以便于比较。平衡自上而下与自下而上的思维方式：在顶部放置关键绩效指标的概览，并巧妙使用警报来推动行动。


    **原则七：避免常见错误**，比如在未理解实际需求之前就急于选择工具。另一个常见陷阱是局限于传统 BI 工具的思维框架，从而限制了数据探索和发现的能力。


    **原则八：选择优质照片或图片。** 图片讲述故事的能力胜过千言万语，因此为仪表板选择一张好图片至关重要。使用连贯、单一的画面，不要使用由其他小照片拼贴而成的照片。此外，尽量使用颜色和色调不超过
    3-4 种的图片。否则，它就会分散注意力。使用清晰的图像。示例仪表板上的标题图像尺寸为 1420 像素 x 150 像素，分辨率为 300 ppi。避免使用分辨率较低的图像。不要拉伸图像，因为会导致图像变形和视觉干扰。如果您要在这些图像上添加文本或数字，请提供具有足够对比度的背景，以确保文字清晰可读。


    ## Mobile Dashboard Designer


    在了解了这些设计原则之后，让我们来看看移动仪表板设计器。Salesforce Analytics Cloud 从第一天起就支持移动端。通过简单的页面布局配置，Lenses
    和仪表板即可在 iPad、iPhone 和 Apple Watch 等移动设备上使用。此外，移动设备不仅仅是可视化工具。您还可以使用移动设备执行构建和设计功能，包括数据集上传和仪表板设计。在本节中，我们将通过一个分步用例，向您展示如何使用移动设备通过数据集创建仪表板。


    ### 通过移动设备上传数据集


    您可以通过多种方式使用移动设备将数据集上传到 Analytics Cloud。可以通过电子邮件附件、云服务（如 Dropbox 或 Salesforce Files）中的文件来完成。在我们的示例中，我们将演示如何使用
    Dropbox 将数据集上传到 Analytics Cloud。


    在您的 iPhone 上打开“Dropbox”应用，并导航到包含`“Infant Mortality.csv”`的文件夹（见图 3-17）。


    ![A978-1-4842-1203-5_3_Fig17_HTML.jpg](img/A978-1-4842-1203-5_3_Fig17_HTML.jpg)


    **图 3-17.** 包含本章所用文件的 Dropbox 应用


    在图 3-17 所示的 Dropbox 显示界面中，选择名为`“Infant Mortality”`的文件。将显示文件信息界面（见图 3-18）。


    ![A978-1-4842-1203-5_3_Fig18_HTML.jpg](img/A978-1-4842-1203-5_3_Fig18_HTML.jpg)


    **图 3-18.** 文件信息视图


    在图 3-18 所示的文件信息界面中，点击屏幕右上角的图标 ![A978-1-4842-1203-5_3_Figb_HTML.jpg](img/A978-1-4842-1203-5_3_Figb_HTML.jpg)，然后选择“Copy
    to Wave Analytics”图标，如图 3-19 所示。


    ![A978-1-4842-1203-5_3_Fig19_HTML.jpg](img/A978-1-4842-1203-5_3_Fig19_HTML.jpg)


    **图 3-19.** 将文件上传到 Salesforce Analytics Cloud


    将出现一个数据连接器弹出窗口，如图 3-20 所示。您可以滚动，并指示不希望再次看到此窗口。在图 3-20 中，按下“next”。


    ![A978-1-4842-1203-5_3_Fig20_HTML.jpg](img/A978-1-4842-1203-5_3_Fig20_HTML.jpg)


    **图 3-20.** 数据连接器弹出窗口


    将`“Year”`属性的字段类型更改为`“Dimension”`。见图 3-21。


    ![A978-1-4842-1203-5_3_Fig21_HTML.jpg](img/A978-1-4842-1203-5_3_Fig21_HTML.jpg)


    **图 3-21.** 将年份从度量更改为维度


    将数据集的名称设置为`“Infant Mortality”`，然后点击`“Import”`（见图 3-21）。导入过程开始，如图 3-22 所示。当导入完成时，点击“Done”。


    ![A978-1-4842-1203-5_3_Fig22_HTML.jpg](img/A978-1-4842-1203-5_3_Fig22_HTML.jpg)


    **图 3-22.** 导入完成


    点击“Done”后，您将看到创建的数据集（见图 3-23）。按下数据集名称旁边的`“i”`，即可看到相关选项：通过按`“Open”`打开一个 Lens，或按`“Create”`启动仪表板设计器。按`“Create”`，为本章的下一项练习（涉及创建移动仪表板）做好准备。


    ![A978-1-4842-1203-5_3_Fig23_HTML.jpg](img/A978-1-4842-1203-5_3_Fig23_HTML.jpg)


    **图 3-23.** 数据集已就绪，按“Create”启动仪表板设计器

