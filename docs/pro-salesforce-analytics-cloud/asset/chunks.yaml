- fmt: '# Loading Dataset


    The dataset we are using is a `.csv` file from a FAA public database recording
    bird strikes statistics. It contains information on each recorded bird strike
    including accident airport, altitude, aircraft make and model, location, flight
    date and time, damage, airline, origin state, phase of flight, weather condition,
    wildlife size, and species, etc.


    Figure [3-1](#A978-1-4842-1203-5_3_Chapter.html#Fig1) is a screenshot of the raw
    dataset in Microsoft Excel. Note that not all columns of data are shown.


    ![A978-1-4842-1203-5_3_Fig1_HTML.jpg](A978-1-4842-1203-5_3_Fig1_HTML.jpg)


    Figure 3-1. Raw Bird Strike dataset


    We use Analytics Cloud’s data loader User Interface (UI) to upload the dataset
    into the system. Here are the steps:


    Click on “Create” button on the top right corner of screen from the Analytics
    Explorer homepage. Press “App” and create an app called “Book Apps.” Then press
    the “Create” button again and select “Dataset” (see Figure [3-2](#A978-1-4842-1203-5_3_Chapter.html#Fig2).)


    ![A978-1-4842-1203-5_3_Fig2_HTML.jpg](A978-1-4842-1203-5_3_Fig2_HTML.jpg)


    Figure 3-2. Create app and dataset


    Click on the “CSV” button under the “Select a Data Source” menu (see Figure [3-3](#A978-1-4842-1203-5_3_Chapter.html#Fig3).)


    ![A978-1-4842-1203-5_3_Fig3_HTML.jpg](A978-1-4842-1203-5_3_Fig3_HTML.jpg)


    Figure 3-3. Select data source


    Enter “Bird Strike” in the textbox for “Dataset Name.” Select the name of the
    app in the dropdown list where you want the dataset to reside. In this case, we
    have created an app called “Book Apps.” Recall that we covered using the “create”
    button to create apps in [Chapter 2](#A978-1-4842-1203-5_2_Chapter.html). Click
    on “Select file or drag files here” and navigate to the dataset location. The
    system will automatically generate a metadata file in JSON format, which you can
    download and modify as needed. Or you can upload your own metadata file as the
    definition of the dataset (see Figure [3-4](#A978-1-4842-1203-5_3_Chapter.html#Fig4).)


    ![A978-1-4842-1203-5_3_Fig4_HTML.jpg](A978-1-4842-1203-5_3_Fig4_HTML.jpg)


    Figure 3-4. Enter metadata for dataset


    Click on “Create Dataset” button and your dataset will be uploaded into the Analytics
    Cloud. Datasets are usually created immediately, but there is usually a message
    that reads “Your dataset will be created within the hour.”


    Once the system finishes data loading process, your dataset will show up on the
    Analytics Cloud Explorer for use. You can navigate to the dataset either through
    the application wrapper you’ve created it under or by clicking on the “DATASETS”
    tab on the top. Click on the “Bird Strikes” dataset to view the new dataset (see
    Figure [3-5](#A978-1-4842-1203-5_3_Chapter.html#Fig5).)


    ![A978-1-4842-1203-5_3_Fig5_HTML.jpg](A978-1-4842-1203-5_3_Fig5_HTML.jpg)


    Figure 3-5. Select “Bird Strikes” dataset to view dataset


    # Creating a Dashboard


    Now that the dataset is uploaded, it’s time to explore the data by creating our
    dashboard. The first step is to create lenses that will build up our dashboard.
    Below are the step-by-step instructions on how to create a lens and how to include
    it in the dashboard designer.


    We start with clicking on the dataset “Bird Strikes” we created in the last section
    of this chapter. We click on the “+Group” button and select “Conditions: Sky”
    from the Dimensions list (see Figure [3-6](#A978-1-4842-1203-5_3_Chapter.html#Fig6).)


    ![A978-1-4842-1203-5_3_Fig6_HTML.jpg](A978-1-4842-1203-5_3_Fig6_HTML.jpg)


    Figure 3-6. Create group by condition: sky


    The chart shown in Figure [3-7](#A978-1-4842-1203-5_3_Chapter.html#Fig7) will
    be displayed based on the number of unique values in the “Conditions: Sky” dimension.


    ![A978-1-4842-1203-5_3_Fig7_HTML.jpg](A978-1-4842-1203-5_3_Fig7_HTML.jpg)


    Figure 3-7. Lens group by sky condition


    Click on the camera button ![A978-1-4842-1203-5_3_Figa_HTML.jpg](A978-1-4842-1203-5_3_Figa_HTML.jpg)
    on the top right corner of the screen. The lens you just created will be “clipped”
    into the dashboard designer.


    In the dashboard designer screen (Figure [3-8](#A978-1-4842-1203-5_3_Chapter.html#Fig8)),
    you’ll see the lens you clipped on the left panel. Click on the “Toggle” widget
    type on the top widget bar, and then click on the lens on the left side to add
    `Conditions_Sky_1` lens into the Toggle widget.


    ![A978-1-4842-1203-5_3_Fig8_HTML.jpg](A978-1-4842-1203-5_3_Fig8_HTML.jpg)


    Figure 3-8. Sky condition toggle widget


    Go back to the lens tab (Figure [3-9](#A978-1-4842-1203-5_3_Chapter.html#Fig9)),
    click on “Condition: Sky” grouping and replace it with “When: Time of Day” dimension.
    This is done by removing the “Condition: Sky” grouping. Hover over the grouping,
    and click the “x” in the upper right corner of the grouping. Then click the “+Group”
    button and add “When: Time of Day.”


    ![A978-1-4842-1203-5_3_Fig9_HTML.jpg](A978-1-4842-1203-5_3_Fig9_HTML.jpg)


    Figure 3-9. Lens group by time of day


    Repeat steps 3 and 4 to clip the new lens `When_Time_of_Day_2` into the designer.
    Add it to a new Toggle widget to the right of the first Toggle button. Note that
    newly clipped lenses are always at the top of the lens stack shown on the left
    side of the dashboard designer.


    Go back to the lens tab, click on the grouping button and replace it with “Wildlife:
    Size.” Change the visualization type to a donut chart (see Figure [3-10](#A978-1-4842-1203-5_3_Chapter.html#Fig10).)


    ![A978-1-4842-1203-5_3_Fig10_HTML.jpg](A978-1-4842-1203-5_3_Fig10_HTML.jpg)


    Figure 3-10. Lens chart for wildlife size


    Repeat steps 3 and 4 to clip the lens into dashboard designer. Choose a “Chart”
    widget type this time and place it under the “Condition: Sky” toggle button.


    Repeat steps 7 and 8 to create another donut chart to display “Wildlife: Species”
    breakdown. Define filters to exclude “unknown” types of animal species. To create
    the exclude filter, click on filter “Wildlife: Species”, and scroll to the bottom
    of the list. You will see “more” at the bottom of the list. Click on more to list
    more species. Scroll to the bottom of the list again, and click more. Repeat scrolling
    and clicking more, until you are at the end of the list. At the top of the filter
    this is a control that is used to select “All” items. Click this, to select all
    species. Scroll to the species and deselect all items that begin with “unknown.”
    This is shown in Figure [3-11](#A978-1-4842-1203-5_3_Chapter.html#Fig11).


    ![A978-1-4842-1203-5_3_Fig11_HTML.jpg](A978-1-4842-1203-5_3_Fig11_HTML.jpg)


    Figure 3-11. Filter unknown species


    Define another filter to include the species that have more than 100 occurrences
    of incidents. Press the filter button, select count of rows, and “Greater Than
    Or Equal To.” Then enter 100, and click “Add.” (See Figure [3-12](#A978-1-4842-1203-5_3_Chapter.html#Fig12).)


    ![A978-1-4842-1203-5_3_Fig12_HTML.jpg](A978-1-4842-1203-5_3_Fig12_HTML.jpg)


    Figure 3-12.'
