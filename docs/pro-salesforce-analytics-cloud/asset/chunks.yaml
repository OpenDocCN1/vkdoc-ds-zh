    # 6. 移动企业数据发现


    > 今天的好计划胜过明天的完美计划。 ——小乔治·史密斯·巴顿将军


    二战期间最著名的将领之一便是乔治·巴顿，上述引言出自他之口。这句话反映了巴顿最被世人熟知的特点：基于尽可能充分的信息采取行动，而非过度分析局势。巴顿强烈反对固守阵地或建立固定防御工事，他要求部队持续向前推进。鉴于巴顿的核心价值观，他若置身当今，定会对专业人士通过智能手机和平板电脑获得的移动计算能力感到如鱼得水。移动设备使这些专业人士能够在办公室以外的地方高效工作，因为这些设备不再需要被束缚在办公桌上才能发挥作用。在本章中，我们将考察一家中等规模的自行车公司——渥太华县自行车公司，并探讨
    Salesforce 分析云如何使其员工能够通过移动设备使用现有的决策支持系统数据，从而更深入地洞察公司的销售业绩。


    数据发现使关键业务利益相关者能够在决策中使用数据；这一点在前面的章节中已强调过，并将贯穿本书始终。在当今的商业环境中，借助流行的移动设备和 Salesforce
    分析云，掌握绩效状况从未如此简单。由于 Salesforce 分析云采用“移动优先”的方法，用户可以通过平板电脑、智能手机乃至 Apple Watch 访问数据发现功能。此外，用户还可以完全通过移动界面轻松创建自己的应用程序。在本章中，讨论的所有可视化内容均来自
    Salesforce 分析云的平板电脑或智能手机版本。


    ## 用例概述


    我们关于渥太华县自行车公司的用例展示了，一家遵循传统报告方法的公司如何从 Salesforce 分析云中受益。渥太华县自行车公司自大约 15 年前成立以来，一直采用规范化、标准化的企业计算方法。该公司拥有一套企业资源规划（ERP）系统来管理业务的各个方面，包括人力资源、薪资和财务等基本业务功能。该
    ERP 系统还具备管理销售运营、物流和渠道管理的功能。来自 ERP 系统的数据被汇集到一个数据仓库中。该数据仓库提供了历史数据的全面视图，这些数据存储在经过索引、反规范化的表中，以便于快速检索。数据仓库中的数据表是公司用于运营报告的许多报告的数据来源。这些报告由业务分析师使用报告工具进行编排和格式化。


    ### 传统报告方法


    渥太华县自行车公司所采用的方法，是多年来让报告能够送达业务用户和利益相关者手中的常用方法。这种历史悠久的方法通过业务分析师、报告编写者和利益相关者之间的协作，生成可靠的报告。业务分析师和报告编写者隶属于信息技术部门内的一个集中式报告开发团队。该部门经常积压大量关于新报告或修改现有报告的请求。关键决策者往往能够使他们的请求获得“优先处理”，“插队”到可能已经等待了一段时间的管理人员前面。有时，为了打破报告生成请求的僵局，各部门会雇佣自己的报告编写者和分析师来满足自身需求。当这些部门继续雇佣更多的
    IT 资源，如开发人员、数据库管理员和云应用管理员时，这些专属的报告编写者和分析师有时会成为该部门“影子 IT”运动的开端。从长远来看，这种碎片化可能是有害的，并且可能偏离公司整体的
    IT 目标，如数据标准、安全和架构治理。


    通常，已经在报告或分析工具上投入了大量资金的公司不愿考虑在这方面进行新的投资。报告和分析工具的年支持成本很高，占产品原始成本的 20% 到 25%。一些公司可能通过并购，或者因为某个工具是
    ERP 系统或其他企业软件捆绑购买的一部分，无意中获得了许多报告工具。当公司拥有过多报告工具时，其中一些工具被弃用而浪费了最初的资本投资，这并不罕见。


    ### 传统方法的替代方案


    图 6-1 展示了报告和分析解决方案的传统方法，并显示了 Salesforce 分析云如何提供一种替代方案。


    ![A978-1-4842-1203-5_6_Fig1_HTML.jpg](img/A978-1-4842-1203-5_6_Fig1_HTML.jpg)


    图 6-1. 传统报告方法及作为替代方案的 Salesforce 分析云


    即使对于那些过去与报告和商业智能工具有过痛苦经历的公司来说，决定采用 Salesforce 分析云也是轻而易举的。Salesforce 分析云百分之百基于订阅，无需前期资本投资。订阅允许按两个类别购买个人许可证，这使得成本易于控制，公司只需为其所需的功能付费。


    大多数商业智能平台都需要台式计算机来开发和查看报告。台式计算机购买成本高昂，且维护困难。它们还面临着来自病毒和恶意软件的安全威胁，这在处理潜在敏感数据时是不理想的。此外，报告查看应用程序通常基于浏览器，并且可能与在不同操作系统版本上运行的不同浏览器存在兼容性问题。这可能导致高昂的支持成本，并在用户无法访问其报告时引发不满。借助
    Salesforce 分析云的移动优先方法，平板电脑和智能手机等移动设备可用于创建报告和商业智能应用程序。移动设备本质上比台式计算机更安全，因为其操作系统与应用程序是隔离的。从可用性的角度来看，几乎每个人都很熟悉移动设备，并且移动设备上常用的手势，如点击、滑动和捏合，在所有应用程序（包括
    Salesforce 分析云）中都很常见。通常，移动应用程序所需的培训量比桌面应用程序少一个数量级，并且通常可以通过在线视频或教程完成。平板电脑和智能手机还具有便携性的优势，尤其是那些具有蜂窝网络连接功能的设备。


    也许 Salesforce 分析云最大的优势在于探索数据的能力。使用传统的报告工具，无法探索数据，要修改任何报告以揭示数据的新方面，都需要向业务分析师或报告开发人员提出请求。然而，使用
    Salesforce 分析云，用户可以完全掌控自己的报告和商业智能体验，并且可以随意钻取数据，以及过滤和组织数据。

    '
- fmt: '# The Use Case Architecture


    While it is possible to integrate nearly any data source with the Salesforce Analytics
    Cloud using extract-transform-load (ETL) tools, a key feature of the Salesforce
    Analytics Cloud is its ability to get productive immediately, without complex
    and costly integration. In our example, the Ottawa County Bike Company IT department
    schedules an extract process from its data warehouse into a company Dropbox folder.
    The extract process writes a `.csv` (comma separated value) file to a Dropbox
    folder. Users with the Dropbox application on their mobile device can then access
    this `.csv` file and create their own applications.


    > **Note**: Dropbox is a popular cloud-based file system that can be accessed
    from Macs, PCs, and mobile devices. There are even drivers for the major Linux
    distributions. Dropbox is one of several products in this class, including Google
    Drive and Microsoft OneDrive. Any of these applications is capable of serving
    files to the Salesforce Analytics Cloud.


    The workflow for users at Ottawa County Bike Company to create their own applications
    is shown in Figure [6-2](#A978-1-4842-1203-5_6_Chapter.html#Fig2).


    ![A978-1-4842-1203-5_6_Fig2_HTML.jpg](A978-1-4842-1203-5_6_Fig2_HTML.jpg)


    *Figure 6-2. Workflow for loading the use case data*


    Let’s take a closer look at each of these steps.


    ## Step 1 – Output to `.CSV` File


    This is the only step that is the domain of the IT department. Most IT departments
    typically maintain scheduling systems that run batch processes after hours. Scheduling
    systems provide the capability of running programs or processes associated with
    enterprise software in a set order, at a specific time. Scheduling systems also
    have the capability of running custom-developed processes. These can be processes
    developed on any platform, including extract-transform-load (ETL) software packages,
    or in a programming language like COBOL, Microsoft Visual Basic, Java, or Python.
    Figure [6-3](#A978-1-4842-1203-5_6_Chapter.html#Fig3) illustrates step one in
    this process.


    ![A978-1-4842-1203-5_6_Fig3_HTML.jpg](A978-1-4842-1203-5_6_Fig3_HTML.jpg)


    *Figure 6-3. Batch processing steps to produce extract file*


    Batch processing involves the bulk processing of data for the ERP system and includes
    data from payroll, finance, and accounts receivable. When the batch processing
    is completed, reporting system databases, such as data warehouses, are updated
    with the latest data. The reporting system databases are updated and the reports
    are generated, so that users can view them the next business day. Also, extract
    files are created in common formats like `.csv` and JSON. In our example, this
    is when the file `BikeCoSalesData.csv` is created for our use case.


    ## Step 2 – User Access of `.CSV` File on Dropbox


    Step 2 involves users at the Ottawa County Bike Company accessing the Dropbox
    app on their mobile devices to extract the file `BikeCoSalesData.csv`. This is
    similar to the dataset creation that was shown in [Chapter 2](#A978-1-4842-1203-5_2_Chapter.html),
    but it differs in that here we are using the Dropbox iPad app as the starting
    point of dataset creation. On the Dropbox shared file system, there is a folder
    named `Extracts`. In this folder is the `BikeCoSalesData.csv` file. Users select
    this file, then tap the `Open In…` button. This button lists all the apps that
    are capable of opening the `BikeCoSalesData.csv` data file. The list of apps appears
    above the `Open In…` button, and it includes a button for `Copy to Wave Analytics`.
    Users then select this button to load the `.csv` file in the Salesforce Analytics
    Cloud iPad app.


    The screenshots shown in Figures [6-4](#A978-1-4842-1203-5_6_Chapter.html#Fig4),
    [6-5](#A978-1-4842-1203-5_6_Chapter.html#Fig5), [6-6](#A978-1-4842-1203-5_6_Chapter.html#Fig6),
    and [6-7](#A978-1-4842-1203-5_6_Chapter.html#Fig7) show the series of steps involved.


    ![A978-1-4842-1203-5_6_Fig7_HTML.jpg](A978-1-4842-1203-5_6_Fig7_HTML.jpg)


    *Figure 6-7. The first screen that appears in the Salesforce Analytics Cloud during
    file Load*


    ![A978-1-4842-1203-5_6_Fig6_HTML.jpg](A978-1-4842-1203-5_6_Fig6_HTML.jpg)


    *Figure 6-6. The message indicating that the file is being exported*


    ![A978-1-4842-1203-5_6_Fig5_HTML.jpg](A978-1-4842-1203-5_6_Fig5_HTML.jpg)


    *Figure 6-5. The `Copy to Wave Analytics` button*


    ![A978-1-4842-1203-5_6_Fig4_HTML.jpg](A978-1-4842-1203-5_6_Fig4_HTML.jpg)


