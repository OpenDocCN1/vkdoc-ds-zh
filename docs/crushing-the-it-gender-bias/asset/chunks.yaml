- fmt: '# The Lesson


    Opal Alapat


    I’ve been a technologist for nearly 2 decades. During this time, I’ve learned
    many valuable lessons. The first lesson that I’ll share is the educational journey
    I took to interact appropriately with men. There were times when I was the lone
    woman on a project and felt singled out and not included. I was not the type of
    woman who wanted to blend in by laughing at sexist jokes and tagging along with
    the team to gentleman’s clubs, so I had to make inroads with male coworkers in
    different ways. I proved myself technically and hung out with them in appropriate
    venues. I was not a “popular” coworker and endured much negative criticism for
    not being loyal to the “boys club.” It bothered me at the time. Today, I’m proud
    of my actions, and I wouldn’t take them back. I don’t think any person should
    feel pressure to fit into an environment where they don’t feel comfortable.


    The second lesson is how I learned to better interact with women. The lowest lows
    in my career involve women pitted against women. Living in a man’s world for so
    long, I had developed blind spots. I learned the hard way about how my actions,
    and words could be incorrectly perceived and misjudged. I had to reeducate myself
    on how to communicate with women. This helped broaden my perspective on how to
    communicate with people of various backgrounds, including race and generation.
    Some days, this still feels like an uphill battle, but I’m a better woman for
    it.


    The last lesson that I’ll share is about finding my voice in an industry where
    women can still be neglected. Early on in my career, one of my promotions was
    skipped because my manager forgot to submit the paperwork. It’s hard to say if
    this had anything to do with gender, but I do not recall my male peers in this
    group having any issues. I asked to change managers and then flourished under
    the new mentorship. I’ve also witnessed the anguish of female coworkers who found
    out that they were being paid less than male peers or passed over for raises that
    went to their male counterparts. One of my friends was passed over for promotion,
    and she was told that her male peer would “bring more credibility” to the role
    although she had many more years of experience. I think many women in my generation
    and before were brought up to believe that they should not speak up, should be
    nice to others (even if it means sacrificing themselves), and should not rock
    the boat. It’s still a challenge for me to overcome my core upbringing, but I’ve
    learned to fight for myself, stand up for myself, and speak with more confidence
    to compete. Things have gotten better in the past 2 decades, and I have more hope
    now for future generations of women, but this industry has a long way to go.


    The woman that I am today is not the same woman that I was one, or even two, decades
    ago. Today, I try not to let others get me down. Today, I fight for what I believe
    in. Today, I lead by example. There is a reason why I present often, regularly
    promote women in technology on social media, am outspoken about inequality, and
    volunteer for leadership roles. If I can do it, so can others. If I’m out there,
    the next generation of women will see it and know that women technologists are
    important. I’ll keep fighting the good fight.


    It can be daunting to look back and see how we are today *vs.* how we were when
    we started. We can identify our naïve nature or our passion and energy *vs.* what
    it is today, but the most important thing we should gain as other traits become
    less pronounced is wisdom. We should feel we’ve become more confident and accept,
    even if we don’t understand, human nature more than when we started.


    I follow Opal’s story with one from another Oracle ACE Director and incredibly
    impressive woman in the industry, Michele Kolbe-Hardwick. When I approached Michele
    about sharing a story for this book, I also shared with her that I felt I had
    let her down earlier on in her career. I’d been advised that if I sponsored her
    for an award, others would simply think it was because she was a woman and not
    because she had so obviously earned it. I backed down, thinking I was protecting
    her opportunity, and it wasn’t until years later when I stepped up to demand she
    be finally awarded the recognition that I realized worrying about others thinking
    I only supported her because she was a fellow woman instead of standing up no
    matter what anyone thought because it was the right thing to do and was what I
    should have done in the first place.


    # The Sponsor


    Michelle Kolbe-Hardwick


    I always thought that I was somehow never affected by bias in our industry. I
    felt that I’ve always had great support from the men and women that I worked with
    and earned respect by proving I know my stuff, but I was always given the opportunity
    to prove it.


    A few days ago, I caught up with my first manager and realized I was naive in
    thinking that. She told me that when I was interviewing for my first position
    out of school, her male manager wanted to hire another candidate, a guy. His reason
    was that he felt I wasn''t technical enough. She asked him to look past my young
    age, blonde hair, enthusiasm, and gender because she felt I was very technical,
    especially since I had a computer science degree that the other candidate didn’t
    possess. She convinced her boss that they should give us both a technical test.


    I aced it, where the other candidate didn’t. It resulted in me being hired and
    leading to a fantastic career. Without my manager standing up to the bias of her
    manager and pushing that I was the right candidate to hire, I would not be where
    I am today.


    I owe so much to her support of me during the hiring process and not simply listening
    to her own manager’s view.'
