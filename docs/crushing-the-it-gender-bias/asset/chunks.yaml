    \ [23](#469679_1_En_4_Chapter.xhtml#Fn23_source) [24](#469679_1_En_4_Chapter.xhtml#Fn24_source)\
    \ [25](#469679_1_En_4_Chapter.xhtml#Fn25_source) [26](#469679_1_En_4_Chapter.xhtml#Fn26_source)\
    \ [27](#469679_1_En_4_Chapter.xhtml#Fn27_source) [28](#469679_1_En_4_Chapter.xhtml#Fn28_source)\
    \ [29](#469679_1_En_4_Chapter.xhtml#Fn29_source) [30](#469679_1_En_4_Chapter.xhtml#Fn30_source)\
    \ [31](#469679_1_En_4_Chapter.xhtml#Fn31_source)\n\n# 5. How to Find Mentors and\
    \ Secure Sponsorship\n\nAlthough advice may not be the best for finding your path,\
    \ mentors can offer help in avoiding pitfalls, introduce networking opportunities,\
    \ and, if they’re a great mentor, sponsorship. Sponsorship’s importance is often\
    \ misunderstood, and the term can be confused with mentorship, but they can be\
    \ two separate things, as not all mentors are going to sponsor.\n\n> “Mentorship\
    \ is being invited to the party; sponsorship is being asked to dance,”\n> \n>\
    \ — Verna Myers\n\n## Let Me Guide You\n\nMen are offered guidance from a young\
    \ age, with a focus on preparation for the real world.^([^(87)](#fn87)) As I’ve\
    \ mentioned before, team sports can offer some of the first preparation for teamwork,\
    \ leadership, and how to be competitive in a team environment. As girls’ sports\
    \ are treated more like boys’ sports always have, you find women gaining confidence,\
    \ a competitive spirit, and learning how to be part of a team.^([^(88)](#fn88))\n\
    \nAs a child of the 1970s and early 1980s, I remember only a few girls putting\
    \ themselves all into the sports when they were in a team. There seemed to be\
    \ an underlying concern about how they would be viewed by their male peers as\
    \ unfeminine, both physically and in being a threat to the boy’s own masculinity.\
    \ Many toxic masculinity traits are taught at a very young age in our society,\
    \ and it’s expected of boys by both genders. If we view “toxic masculinity”^([^(89)](#fn89))\
    \ as simply the extreme demand of being masculine (along with limiting to boys),\
    \ just as expecting women only to be extremely feminine is limiting to girls,\
    \ we should get a clearer view on how we are all part of the problem and how we\
    \ can all be part of the solution. The “be like a man,” also referred to as “the\
    \ man box,” push of toxic masculinity is pushed everywhere, telling women to be\
    \ deemed “good,” we should “man up,” while men when they’re not at their best\
    \ are often called women’s body parts or asked if they’re going to cry like a\
    \ little girl.^([^(90)](#fn90))\n\nGuidance feeds into this, while mentoring women,\
    \ and in previous years, I was often telling women that they needed to act more\
    \ like the men while around them, simply accept “locker room” talk, and not to\
    \ say anything if they experienced an uncomfortable situation. If you wanted to\
    \ “play with the big boys,” this was to be expected. There was a definite bias\
    \ toward what made men comfortable, not just in the workplace, but in the world.^([^(91)](#fn91))\n\
    \nTimes are changing, and young women have found increased support as they reach\
    \ adulthood on how to be themselves at work, and how to work and still address\
    \ family challenges. We still seem to fail many around what is required when mentoring\
    \ ambitious women. When I was in school, although quite independent, the idea\
    \ was still imposed upon me that to be complete, you were to be married; even\
    \ if you decided to work, I was made to feel it was secondary to finding a mate.\
    \ Generations since then, we still judge women on their personal relationships\
    \ more than what they’ve accomplished professionally when talking with the women\
    \ I mentor and when talking to my own children. Where a majority of questions\
    \ toward my sons will be about what they are doing in their spare time and their\
    \ plans for education and career, they’re still asking my daughter about her appearance\
    \ and relationships."
  raw: "#### Be Recognized\n\nSociety has raised us that a humility is attractive.\
    \ Where men are told the successful are confident, women who are shy and soft\
    \ spoken are often displayed as appealing.^([^(85)](#fn85)) Women who own who\
    \ they are and are confident about it can be viewed as unattractive, untrustworthy,\
    \ or worse. Due to this, we’re less likely to discuss our accomplishments and\
    \ may even be viewed as intimidating.\n\nWomen who are looking to advance to leadership\
    \ positions must be willing to lead by example, recognizing their accomplishments\
    \ and those of their team. As much as we hear that a manager who identifies their\
    \ team’s accomplishments is a true leader, if the woman isn’t visible enough to\
    \ gain the management position to begin with, its all for naught. Unlike your\
    \ male counterparts, you will have to highlight your contributions more or face\
    \ the undeniable issue of invisibility.\n\nDon’t allow others to remove your course\
    \ by adding negatives to your path. Women who are natural leaders will be called\
    \ “bossy” or instead of being assertive will be referred to as “aggressive.”\n\
    \n1.  Correct these negative terms for women who are performing no different than\
    \ their male peers.\n\n2.  Don’t let it deter you from your course toward a position\
    \ of leadership.\n\nAs you begin to succeed and move up, remember to pay it all\
    \ forward. The best way to have more women in leadership positions and to make\
    \ women the norm in leadership is to lift as you rise. Reach out and sponsor or\
    \ mentor the women around you. Help them to achieve what you are achieving so\
    \ that we all do better.\n\nWomen make up 50% of the workplace, yet their numbers\
    \ aren’t showing in technology or leadership (Figure [4-1](#469679_1_En_4_Chapter.xhtml#Fig1)).^([^(86)](#fn86))\n\
    \n![../images/469679_1_En_4_Chapter/469679_1_En_4_Fig1_HTML.jpg](images/469679_1_En_4_Chapter/469679_1_En_4_Fig1_HTML.jpg)\n\
    \nFigure 4-1\n\nWomen in the workplace study, 2018 corporate pipeline\n\nTo make\
    \ this change, we need to take more risks and prepare them for more challenging\
    \ demands. As much as I have offered in recommendations for women to change, it\
    \ also requires a change in our world, too. Anyone will tell you, culture is one\
    \ of the most difficult things to change. We need to continue to raise our voice\
    \ and the women around us, and this means ALL OF US. Women can’t do it alone,\
    \ and this means that the men in our world are part of this solution, too.\n\n\
    Footnotes [1](#469679_1_En_4_Chapter.xhtml#Fn1_source)   [2](#469679_1_En_4_Chapter.xhtml#Fn2_source)\
    \   [3](#469679_1_En_4_Chapter.xhtml#Fn3_source)   [4](#469679_1_En_4_Chapter.xhtml#Fn4_source)\
