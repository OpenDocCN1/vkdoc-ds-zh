  trans: '

    # 老大哥


    匿名


    在我担任 DBA 期间，曾在一家公司工作，当时有一位男同事，尽管我的资历更胜一筹，但系统运维团队却更愿意听从他的意见。这位男同事几乎没接受过 SQL Server
    培训，而我已经使用该平台五年，并获得了 MCDBA 认证。在职期间，我花了大量时间培训这位男同事。这家公司的男性比例尤其高，即便是在以男性为主导的 IT 部门，情况也是如此。公司的文化，甚至管理层，都以男性为主，IT
    管理层中甚至没有一位女性。


    有一次，我因被指控在某个应用服务器上卸载并安装了某个关键软件的旧版本而引发事端，但我甚至都没有登录过那台服务器。我的经历告诉我，系统运维团队对我的技能怀有敌意。当我为
    SQL Server 申请硬件（内存、存储，*等等*）时，即使我提供了统计数据证明其必要性，他们也会认为这不必要。相反，如果我的男同事提出同样的要求，就会被批准。他不需要提供任何证据来证明他的要求合理，也不需要我那种技术数据，因为他们会很快否定我的。尽管我向老板反馈了这种行为，但从未采取任何措施来制止这种情况继续发生。


    在我专业领域拥有 15 年经验后，主管会把最困难、最重要的项目交给我们的团队经理，而团队经理又会把这些项目分配给我。我的男同事当时在做一个 DevOps 方面的项目，这个项目不在常规项目之内，几乎要脱离我们部门。


    为了掌握和了解我们对公司的价值，领导层建立了一个排名系统，由经理们定期更新。我的经理离职后，他告诉我，由于我能够按时完成那些被认为最重要的项目，并且对分配的任务更加专注，我一直排名第一。经理离职后，公司正在寻找他的继任者，并征求他对其团队内部人选的建议，他推荐了我和我的男同事。虽然我在主要技术领域经验丰富得多，但最终这个职位还是给了我的男同事。我要求与上级管理层会面，当被问及为什么我没有被考虑时，他们表示我在公司内部不够“高调”，意思是他们觉得我与同事的沟通和协作不够。考虑到我在值班时的投入程度以及在办公室的敬业程度，这个说法很奇怪。


    更矛盾的是，同一批管理层又表示，担心我在外部社区进行演讲和撰写文章，让我显得过于“高调”。尽管我的男同事也在社区会议上演讲，但我的外部志愿工作和作品却被认为对我本职工作构成了威胁。这让他们认为我有离职的风险。


    在这件事以及其他类似事件之后，我认定这种严重的偏见影响了我像男性同事一样发展职业生涯的能力，于是我离开了，去寻找更好的机会。


    前面这个故事让我深有感触。我一直能够观察我的同事，了解哪些方法能推动职业发展，并试图效仿。但我非常困惑，当我和男性同事付出同样的努力时，所得到的体验却如此不同。我甚至去对比了各自的笔记和经历，当我们谈到所受待遇的差异时，他们和我一样困惑。


    经常是我因同样的行为受到惩罚，而他们却因此获得回报。待遇差别就是如此巨大，而针对为何我要被区别对待，只有一些站不住脚、含糊其辞的解释。这通常始于一些矛盾信号，因为始作俑者试图找出他们面对女性成就时感到不适的原因，但如果这种不适转为敌意，那通常就是个信号，表明是时候到别处寻找新的机会了。


    ## 忍气吞声


    匿名


    如果有人问起，我会把自己描述成一个内向的人，却想像那些外向的人一样成为注意力的中心，但又没有勇气做出什么惊人或出格的事来吸引眼球。我有些有趣的故事，但它们内容很深，需要时间和讨论才能理解透彻，就像我处理的数据和系统一样。我无疑是数据方面的专家，知道数据来源、发生过的转换以及最终是如何存储的。


    公司里有一位年长的男性合同工，他存在的全部意义似乎就是获取我的数据，对数据进行处理，然后创建柱状图。那些图表糟糕透顶，除了显示一些计数之外，什么也说明不了。他还使用“非常复杂”的流程来获取这些计数。这是胡说八道。我有一些报表精确地统计了他所做的工作，但他的数字却“比我的更好”，尽管他无法解释自己是如何得出这些数字的，而我可以为自己的计算过程和流程提供详细文档。


    然后他声称我们的数字对不上，到处嚷嚷说我的系统“有问题”。我们花了数百个人工时和数千美元来证明我的系统没有问题。问题在于他不理解业务流程，因此对数据做了错误的假设。他也无法解释计数上的差异，因为他解释不了他自己所做的处理，所以我根本无法匹配他的数字。


    在会议期间，他经常打断我、贬低我（现在我不被允许和他一起开会了，所以他不能再这样了）。同事们会后会过来问我，他是不是一直这样对我。由于他在高层有影响力，而且我老板指示我不要与他冲突，我不得不忍气吞声。


    我们付给这位合同工大量的纳税人钱，让他“制作”那些本可以自动生成的图表。分析师们花费数百小时与他分享专业知识，以便他能制作出这些图表，而这些图表分析师们能做得更好、更快。我不确定是什么让他如此特别，以至于我们花了这么多钱，还允许一个外部人员来掌控对我们数据的理解以及数据呈现方式，但我相信我开始产生影响。组织内部越来越多的人来找我寻求指导，帮助构建他们想要解答的问题，并找到回答这些问题的数据。


    作为一名科技领域的女性，我不得不在一个男性主导的行业中摸爬滚打了 20 年。再加上我目前工作的执法领域也由男性主导，要克服这种偏见带来的障碍非常困难，但我将坚持不懈。

    '
- fmt: '# The Question


    Anonymous


    Here we were, at the morning stand up, and it was my turn to ask a question, like
    always, and have it ignored, like always. I’m told I need to speak up and demand
    to have an answer, but when I do, the guys just look at each other and smirk or
    point at the clock.


    They act like I should know all the answers to these questions, but it never fails.
    The next day, we’re sitting in the next stand up explaining who did something
    wrong because they assumed what they should be doing instead of asking the same
    questions that I did the day before.


    It’s infuriating and I’m at a loss as to how to address it. On the advice of mentors,
    I started to have a follow up e-mail after the stand up, documenting my questions
    and then documenting each day what went wrong the day before. No one seems to
    read them, but they should at least come in handy when the end user asks why the
    project failed.


    It’s always the same thing when we’re in our teams working, too. I see there’s
    something missing in the process, and the response is always very condescending
    to me. Like I’m just being foolish, but the percentage of time it comes to light
    that I was right is kind of mind boggling.


    They never hear me out or listen to my suggestions until it’s too late and I don’t
    feel like a valued member of any team.


    # Is This Thing On?


    Anonymous


    While I honestly LOVE being a DBA, I struggle constantly. When I speak up, I’m
    seen as aggressive. My male counterparts talk over me. I’ve been asked to hold
    my tongue by my direct supervisor. I feel like I have to fight twice as hard to
    be held to half the opinion of my male peers. I don’t have a degree, but I have
    a number of years experience in Oracle, SQL Server, and Ingres databases.


    I really enjoyed working with Oracle but then unexpectedly was asked to stop.
    I was kicking ass and taking names, doing 12c setups, installed OEM 13c, tuning
    and collaborating with my team, or so I thought. I was told that my senior lead
    male was complaining that he didn’t have enough work and was bored. In response,
    my manager asked me to stop working in Oracle altogether and then gave it solely
    to my lead to manage. Since then, I haven’t been allowed to touch it and was told
    to work with mostly SQL Server, and the other databases. These databases are viewed
    as “less technically demanding” by my lead. Recently, I started to work more deeply
    with MySQL and Community Server. I was asked to train my senior lead on the MySQL
    environment, so he could act as my backup. I was immediately surprised, as we
    have no backup for our Oracle environments.


    Upon guidance, I’ve now learned that I’m not aggressive, but just being assertive.
    I began to ask my manager some direct questions about my concerns regarding the
    lack of cross-training in other platforms and agreed to training my lead on the
    MySQL environment if he was to allow me to back him up and work on the Oracle
    environment. Recognizing my value to the company was an important first step in
    me standing up and expecting a change in my company to improve my satisfaction
    with my career and offering more value to the company at the same time.


    Along with missing opportunities for promotion, I often hear from women about
    lost opportunities at top projects and technical training. There’s an odd bias
    that men need more technical challenges and mental stimulation than women on the
    job. There’s also data that demonstrated women leaving technology over other industries
    because they wanted more challenging work.^([^(135)](#fn135))


    # The Misstep


    There was a time that I worked in healthcare and then moved over to IT after taking
    a yearlong training course focused on technology. I was a young, single parent
    of three at the time and quite naive to office politics and culture. So naive
    that I almost immediately broke an unwritten rule of not dating a coworker.


    There was a single dad a few offices away. Cute, quiet, and well liked. We shared
    the same circle of friends, or at least, new friends for me and old buddies for
    him. He had been working at my new employer for over 8 years.


    Our steamy office romance continued for about 9 months, attending many social
    functions together with our coworkers and friends. There was always an unspoken
    smugness about him, and he had a way of making me feel “not good enough” in the
    relationship which set off red flags considering we were professional peers. He
    would cut me off mid-sentence when speaking and embarrassing me by telling me
    to hush in front of others.


    One day, I noticed his pay stub was sitting out, and I caught a quick glimpse
    of it. He was only one level above me in our work structure, and although he had
    an 8-year head start over me, was making $25,000 more a year than I was. This
    was a large pay difference in the roles we held at that time.


    Eventually, the romance fizzled as boredom with his behavior and I grew tired
    of always feeling like he was “settling.” I can tell you that working in that
    office surrounded by his friends, who may have been my new work friends and who
    were all male, was intimidating and uncomfortable. He once advised me that perhaps
    I should just leave.


    I took responsibility for this situation since I was the one who chose to break
    the rules. This was the best job I had ever had up to that point in my life. This
    was my new IT career, and I was determined to turn the situation around and not
    let this all-boys club run me out of town.


    I kept my nose down and worked hard. I made new friends, and eventually, the old
    friends began to warm up to me again, and the ex and I were able to coexist in
    the same office, and our relationship returned to a comfortable professional one.


    Fast forward some 18 years later, we both moved on in our personal lives, we’re
    both still in the same office, and I was promoted to a position above him.


    The moral of the story is this—don’t give up. Don’t ever give up. Even if you
    make a terrible mistake or do something that could be career-ending, try your
    best to be transparent and own up to the mistake or failure. Also, don’t let office
    politics steal your career from you.


    Rise above the fray.


    I can only imagine what the author above went through to get where she is now.
    It’s rarely easy to foresee the future when we have hopes in the present situation.
    As discussed in an earlier chapter, there is research that demonstrates how askew
    the power distribution can become when romance is the topic between a man and
    woman in the office.


    Although I’d known my husband for 8 years before we ever considered a romantic
    relationship, it was one of the most trying decisions of my life. I’d admired
    him professionally for the entire time I’d known him, but suddenly, our peers
    on the board we served together and the technical community we were part of would
    know that we were romantically involved. Tim’s behavior was exemplary. He was
    patient and respectful, knowing that I would be judged by both men and women in
    the community.


    As the previous author shared, it’s not just about if the relationship lasts for
    the long run, but what if it doesn’t? How does that impact your career and how
    others in your field perceive you? The author was persistent and knew that she
    could change her future to correct the mistake she felt she made in her past.


    # Diversity Isn’t Just About Women


    As discussed, I wanted to demonstrate how similar and confusing bias can be for
    all diversity groups. I reached out to a couple friends who’ve been open about
    their challenges to me and asked them to contribute.


    The first story comes from Doug Gault. Doug and I have known each other for quite
    some time and worked together at Enkitec. I’m the proud mother to a gay son, and
    although Doug is my age, I couldn’t help but hope my son finds the same confidence
    and satisfaction in life that I see in Doug’s.'
