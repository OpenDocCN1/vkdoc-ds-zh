- fmt: '# Steps to Your Path


    It’s easy to be distracted from your path by those around you—family, friends,
    advisors, and peers. Our family may mean well, but they may also view us not as
    who we are, but who we WERE. I still have to remind myself that my children are
    now adults and try to remember myself at their age. What were my dreams? What
    resources did I have or was I discovering in myself? I often ask my kids to always
    be thinking ahead. What do they want for their future? What are their goals? Can
    they break them down into small tasks and step-by-step achievements? Having a
    clear list of steps and goals can help ensure you’re able to achieve in the long
    run what may seem impossible when you look at it as a whole.


    Start out by making an outline and break it down into three categories:


    * Professional

    * Personal

    * Above and beyond


    The list should be kept at a higher level to not bog yourself down in too many
    details or make it impossible to feel you’ve achieved those little wins. Know
    to reward yourself for the small wins, too. As I’ve stated before, there’s power
    in the simple act of doing, but if you aren’t giving yourself credit for those
    little successes, you won’t have the energy to make it through the big hurdles.


    As you begin to build out that list, remember there’s no such thing as the ideal
    work/life balance that we hear about on TV shows and in books, to feel personally
    successful. Even the CEO of Amazon, Jeff Bezos, claims that the phrase work/life
    balance is debilitating.^([^(59)](#fn59)) For some, success may mean that they
    get to consistently pick up their kids from school each day. For others, it may
    be time for a daily workout at the gym or a training budget to further their professional
    knowledge or any combination of things. You’ll notice that I didn’t mention my
    own list of what others might consider what made me successful (speaking, authoring,
    and career). Your path means that this balance will result in a personalized set
    of requirements for your career, for your personal life, and beyond. It has nothing
    to do with what’s important to me, and this is a key factor as you search out
    guidance and mentors, too.


    When considering the professional list, I’m going to ask you to not consider the
    standard workplace perks or benefits you’ve heard from an HR representative, but
    think about what would make your life easier/more productive/more satisfying.
    Think outside the box when recognizing what is important to you and would ensure
    you can meet professional and personal responsibilities. Needs are not the same
    as wants, but that doesn’t mean you won’t care about those as we progress into
    building our path:


    * I need a flexible work schedule/part-time schedule/contract position.

    * I need to have a hands-off manager/clear expectation from the leadership.

    * I need to have a collaborative team/work independently.

    * I need to be able to be there for my family if and when they need me.

    * I need a career that is technically challenging and focuses on data science/coding/project
    management.

    * I need a remote/onsite office.


    The list of your wants should append as a second list and the future of your path.


    * What do you want to do? **Build it out by 5 months, 2 years, 5 years from now**.

    * Where do you want to go? **Do you want a technical path, management path, a
    different industry, or maybe entrepreneur?**

    * What do you want to accomplish? **Are you one who desires to lead the pack or
    are you more collaborative and/or supportive?**

    * What is your idea of professional success? **Don’t let magazines or media tell
    you what success is. Success is satisfaction with your personal and professional
    life. This idea can change, too, so don’t punish yourself if your idea of success
    changes over time.**


    ## This Is Personal


    We’re told so often that our personal and professional must be separate, but with
    the advancement in technology and demands from our careers, it is only natural
    that professional would bleed into our personal lives. As women, we still perform
    [more of the responsibilities for the home](https://www.bls.gov/news.release/atus.nr0.htm)
    and family.^([^(60)](#fn60)) In the most recent data from the Bureau of Labor
    Statistics, the numbers were still displaying on an average day: 49% of women
    did housework of some kind *vs.* only 19% of men.^([^(61)](#fn61)) Research also
    still shows that who will perform household responsibilities are still the number
    one topic that couples fight over and found that we naturally assign less value
    to household chores that are more traditionally aligned with women than men’s
    responsibilities in the household.^([^(62)](#fn62))


    This can greatly affect a woman’s path, as personal demands on her time can be
    an excuse (in some minds) to justify paying a woman less salary. I have debated
    the topic openly with trusted colleagues, and I end up having to build out the
    following formula:


    ![../images/469679_1_En_4_Chapter/469679_1_En_4_Figa_HTML.jpg](images/469679_1_En_4_Chapter/469679_1_En_4_Figa_HTML.jpg)


    The real formula is much more complicated, but to break it down as simple as possible:


    ![../images/469679_1_En_4_Chapter/469679_1_En_4_Figb_HTML.jpg](images/469679_1_En_4_Chapter/469679_1_En_4_Figb_HTML.jpg)


    which results in


    ![../images/469679_1_En_4_Chapter/469679_1_En_4_Figc_HTML.jpg](images/469679_1_En_4_Chapter/469679_1_En_4_Figc_HTML.jpg)


    I’ve had coworkers that spent 10+ hours at the office and produced little to no
    value to the business. They performed rudimentary tasks but performed no improvements
    to processes that provided increased revenue or made significant enhancements
    to the team. Sitting in front of a desk 50 hours or more a week while providing
    little value shouldn’t make someone a better employee than another who is present
    40 hours per week but is performing at a higher than average performance on tasks,
    taking initiative, and/or introducing improvements to the team. Companies are
    beginning to realize this and realigning what they deem a valuable team member
    due to this research.^([^(63)](#fn63))


    With all this realization, there is still a significant amount of bias that working
    mothers are under pressure with. It’s not just the demands of personal responsibilities
    that are impacting how we view professional women.^([^(64)](#fn64)) Culture, as
    a whole, consider working women less capable, less dedicated, and less hardworking
    than their male peers.^([^(65)](#fn65)) As we enter into this conversation, I
    must first establish that the goal is to rid ourselves of bias and focus on equality
    *vs.* making women appear to be better employees than their male peers.'
