    # 2. 女性在科技领域面临挑战背后的复杂性


    我当年在为多家公司工作、推进职业生涯时，丝毫未曾预料到 15 年后自己会为甲骨文效力。我的职业生涯带来了绝佳机遇，让我能与业界优秀的人才、导师以及我崇拜的偶像共事。它教会我如何避免早年经历过的某些陷阱，而我所学到的坚韧、导师的指引以及他人的赞助支持，正是我能在科技领域持续成功、而他人却错失机遇的关键所在。我的亲身经历、他人愿与我分享自身故事的能力，以及我收集的数据，让我对女性在科技领域（WIT）面临的挑战与机遇有了极为宏观的认知。


    我从所有经历中学到的是：万事皆有因，每个挑战都蕴含着益处，而单纯的“行动”本身就蕴藏着巨大的力量。


    我本人有着奇特的病史和非传统的科技领域入行经历，这也从多方面说明了为何这些故事需要被分享。该领域的大多数人并非拥有计算机科学学位的大学毕业生。事实上，他们更可能来自多元背景，或是被发现对科技有天然亲和力，又或是出于需求满足而成为了“意外踏入科技领域的人”。每个人都是复杂的生命体，要理解他们各自是谁，需要围绕性别、成长背景和文化进行深入探讨，并且必须包含研究数据。我在此的目标是坦诚探讨这些话题，讨论我们是成长背景、经历和所获机遇的产物，以及这些因素如何决定成功与失败之间的差异。


    脚注 ¹ ² ³


    ## 女性在科技领域面临挑战背后的复杂性


    我很想说，我们对科技领域女性及信息问题所有挫败感的简单根源在于性别，但实际情况比这更复杂。一部分人会告诉你，男性和女性在生理上存在差异，这就能解释一切。尽管他们关于差异存在的观点是正确的，但研究表明，考虑到所有差异，最终数据并不足以解释我们今天所看到的巨大排斥鸿沟。


    科学研究已证实，男性比女性拥有更多的灰质。同时，这些研究也证明女性比男性拥有更多的白质。^(⁴) 灰质用于从视觉、肌肉控制到决策等一切功能，而白质则用于加速突触间的连接。这导致女性的神经连接比男性传导更快，尽管男性拥有更大量的灰质——科学家用此来解释为什么男性和女性的平均智商总体相当。神经回路图谱显示，女性左右半球的连接远比男性更紧密，而男性的前后连接则更紧密。虽然男性在协调和感知任务上通常优于女性，但女性在复杂的社交情境和多任务处理中能更有效地互动。对于男性大脑优越的每一个领域，科学家都在女性大脑中发现了相应的补偿性平衡特征。


    ### 失调还是动态？


    以注意力缺陷障碍（ADD/ADHD）为例，[研究](https://www.understood.org/en/learning-attention-issues/child-learning-disabilities/add-adhd/adhd-in-girls)^(⁵)表明，男孩和女孩受到的影响不同，因为颞叶活动低下的影响非常显著。问题不在于医学专业人士认为女孩患
    ADD 的可能性更小，而是由于大脑生理差异对症状的影响以及文化期望，导致女孩被诊断的频率较低。


    我在家中三个女孩中排行老大，也是我们这一代第一个出生的女孩。任何熟悉出生顺序研究的人或许更能理解，是什么在驱动我、让我较少受到多动症（ADHD）挑战或行业其他女性经历的影响。


    长子/女更可能模仿父母，并对自己抱有很高的期望。^(⁶) 我从一开始就表现出多动症倾向，高度活跃且容易分心。我提出很多问题，当答案不能满足我时（我的母亲经常被我无休止的问题惹恼），我会无畏地自己去寻找答案。


    ### 男孩更有趣


    我记得和我的年长表哥们一起玩耍，努力跟上他们的节奏。他们和我妹妹们一样，身材高大，浅棕色头发，蓝色眼睛。而我身材娇小，坐不住，渴望做他们正在做的任何事情。我们在密歇根湖沿岸的密歇根上半岛乡村长大，夏季有大量时间在户外活动。如果男孩们要挑战对方站在小溪里，看谁能在冰冷的水中坚持最久，那我也会加入。这种竞争性游戏和其他冒险活动，常常让大人们为我——一个在这些大男孩中的小女孩——担心。我记得他们忧心忡忡地喊我，不让我跟着男孩们干那些事。我会不停地问为什么我不能玩和他们一样的游戏，直到他们被问烦了，丢下一句“因为你是个小女孩。”
    这种情况频繁发生，让我将“女孩”与“受限制”联系在了一起。到五岁时，我记得我想成为一个男孩，因为那似乎就是自由和乐趣的代名词。


    ### 邻家女孩


    作为三姐妹中的老大，我有两个妹妹，很幸运，但中间的妹妹是邻家女孩的理想形象。我的妹妹克丽丝蒂留着金色长卷发，蓝色大眼睛，她周围的成年人很快就将她视为女孩应有的完美典范。她是一个甜美随和的孩子，比她那个精力旺盛、留着深色精灵短发、充满好奇心的姐姐更坐得住。我很快注意到大人们如何称赞她漂亮的金色卷发和随和的性格。我意识到她在成长过程中有多么轻松——她仅仅通过自己的外貌和行为就满足了他们的期望。她是我们的《小妇人》中的艾米，^(⁷)
    随着我们长大，我对她得到的关注愈发羡慕。


    事实是，草总是那边更绿。文化可能对我们抱有期望，有些人自然更能适应，但这也有其弊端。克丽丝蒂在 43 岁时被诊断出癌症。她从一个健康快乐的母亲（有两个孩子）和妻子（有一位爱她的丈夫），迅速意识到她原本设想孩子离巢后实现梦想的承诺，很快就被这种毁灭性疾病扼杀了。我们深入谈过她对未来的期望，尽管她的未来正在迅速消逝。她告诉我，有一个出版过不止一本书的姐姐和另一个正在攻读硕士学位的妹妹，让她意识到，无论她多么热爱自己的生活和家庭，她有一些梦想被搁置了，因为文化教育她要把一切置于自己的欲望之前。


    正如她身边如此多的女性一样，她只是在许多方面遵循着文化对我们的教导。我们听到，自己的梦想常被视为自私，而我们要做的是照顾周围的人。“Carpe diem”（抓住当下）这句格言，在意外降临时变成了未兑现的承诺。克丽丝蒂在确诊后仅仅
    100 天就去世了，她永远不会被遗忘，但梦想却未能实现。她的离世，让我找到了更强大的内心力量，也让我对童年时代不肯安坐、驱使我竭尽全力取得成就这件事，再无任何遗憾。

    '
- fmt: '# The Overachiever Non-Lead


    My inability to find satisfaction in being stationary also drove me to handle
    a heavier workload than many of my peers. I wasn’t competing with anyone other
    than myself, but for some, it was difficult to view me other than competitive.
    I enjoy being busy and am a terrible bored person. I prefer to do a tedious task
    over no task at all, but having ADHD means that I enjoy challenging work whenever
    it’s offered. What employer doesn’t want an employee that wants to be productive
    and busy? It’s essential that management be aware of each employee’s workload,
    but our patriarchal work environments can leave weaker leaders to pit employees
    against each other. This creates some of the most common complaints from women
    about working in the industry.


    Along with their ideas or work being taken credit for, most women in tech are
    performing at higher levels than their peers, while their peers are still more
    likely to be rewarded with promotions, raises, and titles.^([⁸](#fn8)) One of
    the women I’ve mentored likes to say, “There’s no place for mediocre women.” I
    can attest to the incredible skill of the women in the industry around me. Even
    I, as direct as I am, have served more than once as “the lead” in every way but
    with the official title and salary. It was eye-opening to me how often the more
    I mentored women in the industry; this wasn’t an odd occurrence, but a common
    practice for other women, too.


    Even though these women were performing the tasks of the role and often performing
    it beyond their male peers, when it came time to promoting someone into a leadership
    position, they were overlooked or bypassed. The stories demonstrated clear bias,
    as the management making the decision either didn’t view the women in a leadership
    position or assumed that the women weren’t interested in overseeing people.


    Another form of this bias is the idea that women are willing to “volunteer” to
    do more, or an assumption that they want to do more without recognition, and men
    are more likely to set boundaries unless some type of expected promotion or financial
    reward is given.^([⁹](#fn9)) Due to our discomfort with women’s ambition, even
    if a woman does set those expectations, backlash can occur in the form of resentment
    or views that the woman is “unlikeable or unmanageable.”^([^(10)](#fn10))


    As important as it is for women to set expectations and to recognize when unfair
    responsibilities outside of your role are occurring, it’s a double-edged sword
    when they attempt to do so. It’s a tightrope that we need to carefully navigate,
    ensuring that we don’t trip anyone’s bias and experience the backlash of resentment
    when we do set those boundaries. Once it’s been established management is open
    to having an honest discussion, it’s important to identify if the difference in
    demands is due to bias when performing a comparison to what is expected of you
    *vs.* your male peers. Following are some polite yet direct questions you might
    pose to your management in such situations:


    *   “I have the same title as XXXX and should be performing similar tasks, correct?”


    *   “Would you assign <administrative task> to XXXX?”


    *   “Is there constructive feedback you can offer me why I wasn’t offered the
    <technical or high profile> project?”


    Ask the manager, without accusations, to honestly review what he is assigning
    you *vs.* other team members. If your feelings might give away how distressing
    the discussion is, find a trusted friend or colleague to role-play the discussion
    before you approach your manager.


    If discussing a promotion where you are performing the role, but a male peer is
    being considered, the following could be beneficial:


    1.  Do preliminary research to find out if you were being considered at any step
    in the process. If not, ask what changed. It may be a simple oversight, and yes,
    it could be due to bias.


    2.  Find out why your male peer is being considered. The explanation may shed
    light for management on the oversight by just having a discussion. Having a calm
    conversation with the management may help them recognize you as a candidate.


    3.  As always, the goal is ever to be about education and reaching your goal,
    not about persecution. If you feel you’re becoming overly frustrated, consider
    thanking them for their time and revisit the conversation after you’ve had time
    to collect your thoughts.'
