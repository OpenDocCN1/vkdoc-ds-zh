- fmt: '*   You can export your LinkedIn CV/resume as a PDF or Word document.

    *   Update your profile link from the default to your name (`http://linkedin.com/first.last`).

    *   If you’re looking for a job, consider having a link to your profile on your
    blog, twitter, and even on your business cards.

    *   As you can blog on LinkedIn, consider writing a few, professional posts on
    key topics in your industry.


    For those of you that would like to blog but unsure about starting a blog, I wrote
    my first blog post in 2008 as a guest blogger on the recommendation of Chet Justice
    of ORACLENERD.^([^(109)](#fn109)) I started my own blog soon after, and, in the
    years since, it’s either shortened my technical interview time (the interviewer
    reads my blog then possessing the answers about my knowledge level before we even
    meet) or it’s opened job opportunities because people came across my blog.


    Starting a blog is easy:


    1.  Start with an open/free platform. Consider blogging on LinkedIn or open a
    blog site on Blogspot.

    2.  This is part of your online brand, so the pictures you’re incorporating in
    your social media presence should also be pulled into your blog, as well.

    3.  If you’re scared, you have nothing to say. Everyone has something valuable
    to give. Some of my top blog posts are on topics I didn’t think anyone but me
    would care about. Don’t be afraid to share.

    4.  Blogs serve as self-documentation, too. I don’t know how often I’ve ended
    up referring to my own content for help, even years later.

    5.  You can refer to blog posts on forums, to customers, and even to potential
    employers.

    6.  Blogging can lead to opportunities to write articles in publications, white
    papers, and authoring on technical books.

    7.  Once you get your blog going, consider connecting it to your social media
    accounts to reach a larger audience and add your blog site to blog aggregators
    that readers use to find content.


    After starting your own blog, you might even consider presenting. Presenting is
    one of the ways that women can smash through the glass ceiling. It means you must
    reach outside your comfort zone, but if you enjoy sharing your knowledge and want
    to take the next step in your career, presenting to groups can be one of the most
    beneficial steps in your career.


    If you want to start small, you can present at your local user group, Toastmasters,
    or even in front of your peers at work. As you become more comfortable with presenting,
    you can then submit abstracts for events in your city, state, or even internationally.
    Acceptance as a speaker to a technical conference grants the speaker a free pass
    to the event (most often), and that means access to training sessions and networking
    opportunities.


    When discussions of how to break through the glass ceiling is broached with me,
    I can’t tell you how powerful blogging and public speaking are to achieving this.
    Both of these platforms give voice to women that are less impacted by the invisibility
    that seems to occur to women in the workplace. It grants credibility and validation
    that you possess expertise in your field.


    ## Rising Above


    As you begin to build up speed, with your professional activities, social media,
    etc., you may receive some backlash from others. Again, I’ll state, we’re uncomfortable
    with women’s ambition,^([^(110)](#fn110)) and if you’re doing well, expect some
    people to test you a bit, just in a bid to understand how you are able to accomplish
    what you are doing. Realize that this is their problem, not yours, and don’t let
    them distract you from your goals or waste your time.


    You may have some people who come to you, claiming to be concerned about you,
    but derailing you from your goals. They may claim that you have received special
    treatment to have received all that you have, even when you know it was your own
    hard work. Don’t let them—Leveling the playing field isn’t the same as lowering
    the bar. What you accomplish is to no one’s credit but your own.


    To recap what I’ve stated in this chapter:


    *   Consider blogging, either on a free blogging site or on LinkedIn, to start.
    Getting your content and voice out there is a great way to share what you know
    with lesser gender impact.

    *   Blogging can lead to other opportunities—articles, books, and speaking.

    *   Presenting is a great way to take your career to the next level and can help
    you break through the glass ceiling.

    *   Know when to not listen to criticism—if it’s not constructive and if you can’t
    take anything away from it to move forward, it’s rarely going to be helpful.


    ## Dressing the Part


    Work attire is another area of the tech industry that can be challenging. Many
    offices are becoming more casual, and some tech offices have dress codes that
    would be barely acceptable at the park. Dress code in the IT industry is a common
    topic in articles. To promote increased collaboration and agile work environments,
    attire became more relaxed. Information Technology perks, as we’ve already discussed,
    often include standing desks and gym memberships on site. This is less supportive
    of a traditional women’s business attire, such as the pencil skirt, dress, or
    heels.


    Historically, women’s dress was based on attraction *vs.* function.^([^(111)](#fn111))
    Over the last century, this has changed, but our culture will bleed into our work
    life, and this includes dress code.^([^(112)](#fn112)) Women are more identified
    by their clothing, and with the level of attractiveness, than men, and as we’ve
    discussed earlier, how a woman is dressed is a means for women to connect with
    each other. Men’s clothes are looser, their fashion changes less dramatically,
    and we judge men less on physical attractiveness.^([^(113)](#fn113)) I believe
    that a woman should wear whatever she wants, but there is research involving a
    sensor monitoring the amount of times a man or women adjusted their clothing on
    a given hour. The women in the tests adjusted their clothing ten times more often
    than the average man. Of the 112 individuals surveyed (70 men, 42 women), the
    men adjusted their clothing an average of four times per hour. The women, on average,
    adjusted their clothing 40 times per hour.


    We straighten our blazer, smooth our skirt, and check our nylons for runs and
    shoes for scuffs that often. As we’re judged more critically on our appearance,
    we’ve learned to be hypervigilant of how we present ourselves.^([^(114)](#fn114))


    Let’s just assume that each time a woman adjusts her clothing (smooths her skirt,
    checks her nylons, straightens her necklace, *etc.*) takes 2 seconds each occurrence.
    We’ll decrease the number from the average to just adjusting clothing 10 times
    per hour, and there’s 24 hours per day, with an average of 8 hours sleeping. The
    numbers tell us that a woman will spend 5 minutes per day adjusting her clothing.
    This isn’t counting the loss in concentration from what she’s doing at the moment
    she breaks from the task to adjust. I know it sounds like a bizarre detail, but
    I’m all about efficiency and removing white noise (wasted time from valuable life),
    and this to me was wasted time.


    So why do women adjust their clothing so often? Humans can be a very judgmental
    bunch, and we receive these fine details on how others are attired by a process
    called thin-slicing. This is the process of millisecond judgements we make on
    new stimulus, and society performs thin-slicing on women’s attire at an excessive
    level.'
