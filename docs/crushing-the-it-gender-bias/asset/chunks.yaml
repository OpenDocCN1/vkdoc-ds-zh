  raw: '### Gasoline and Advice


    So why is this discussion pertinent to mentors and sponsors? Workplace bullies
    can impact your sense of self-worth and ability to attain either one. It’s not
    just the cost of a good employee, but the cost of a successful career. A workplace
    bully, especially one who is keen on gaslighting (a strategy of making the target
    or those around them believe it’s in their imagination or they are the ones with
    the problem, also referred to as “gas lighting”), can impact your reputation and
    your professional standing.


    My first experience with a workplace bully was in the beginning of my database
    administration career. This person had management believing that I was technically
    incompetent and threatened my employment with the company numerous times. Although
    my peers knew otherwise, they feared becoming her next target or getting involved,
    so I was left to fend for myself until someone finally stepped up and let my manager
    know what was going on. Gaslighting can be incredibly detrimental to a woman’s
    career, more so than to a man’s.^([^(105)](#fn105)) When we doubt a man’s word,
    it can be a very serious act, but as we’ve discussed, we are less likely to believe
    or trust women, making gaslighting a woman easier to do.


    This is where documenting interactions and having a third party involved in all
    formal discussions will deter gaslighting situations. A bully is less likely to
    do this with a witness present. Many times, having a strong manager that holds
    the bully accountable for their behavior, can eliminate the behavior long term.


    If an experience with a bully has impacted your opportunity to attain either sponsorship
    or mentoring, there are remedies you can take that will help to gain a second
    chance. If it’s a potential mentor, consider asking them to go for coffee or a
    similar, relaxed meeting. Don’t accuse the bully, but rather choose no sides,
    and apologize for the unwelcome situation. The potential mentor will be more open
    to listening to you and recognize that you’ve chosen to take a higher road, which
    is attractive in a mentee. Examples of this might be:


    “I know the unfortunate interaction with John the other day hasn’t put me in an
    attractive light, but I would like to apologize and thank you for taking the time
    to have coffee with me today. I’m really interested in growing my career and would
    love the opportunity to pick your brain on how you’ve been able to navigate so
    successfully, even in challenging situations.”


    “Thank you for taking time out of your busy day to sit down with me. I was really
    disappointed in the meeting the other day and was wondering if you could provide
    me any feedback on how I could handle myself better when faced with that kind
    of situation in the future?”


    The second piece of advice I’ll offer is this: Communicate.


    I was often able to get ahead of workplace bullies and difficult people by communicating
    and connecting with others around me. By having open communication and being accessible,
    they were likely to feel more connected to me than the bullies, who were often
    difficult to get along with. This doesn’t mean you become a door mat. Being accessible
    and communicating have nothing to do with giving up your ideas, objectives, or
    ambition. When in meetings, I was able to clearly discuss my ideas and how they
    involved other goals they wanted to achieve as part of my goals. I was only able
    to do this by having a continual dialogue with others around me, discovering what
    was important to individuals and team.


    The one thing that doesn’t impact the ability to gain sponsors or mentors is changes
    in positions. I’ve had a few people ask me if they have switched jobs too often,
    having left a job after 3 or 4 years. A mentor rarely is looking at your resume
    to see how long you’ve worked somewhere. A mentor is looking toward your future
    and where you want to go. A sponsor is going to look at what you want to achieve
    and whether you have the motivation to complete the opportunity they’ve recommended
    you for.


