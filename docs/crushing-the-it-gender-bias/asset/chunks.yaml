    \ [9](#469679_1_En_5_Chapter.xhtml#Fn9_source) [10](#469679_1_En_5_Chapter.xhtml#Fn10_source)\
    \ [11](#469679_1_En_5_Chapter.xhtml#Fn11_source) [12](#469679_1_En_5_Chapter.xhtml#Fn12_source)\
