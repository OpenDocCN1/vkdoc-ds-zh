- fmt: '# Social Safety Net


    The question arises: how do you navigate this valuable networking without getting
    in over your head?


    1. Attend social events where there are groups of three or more.


    2. Interact with the men as men interact with each other. Research has shown that
    some men will incorrectly gauge a woman’s interest, so be friendly, but keep your
    distance. Refrain from touching a man’s arm or playing with your hair. These are
    signals that are used in the media as examples of interest. Show interest in your
    male peers’ wives and children and always show their wives respect, treating them
    as you would want to be treated.


    3. All events should be in public locations, such as group lunches, a happy hour,
    or team event.


    4. If you are the only woman and uncomfortable attending events with all male
    colleagues, ask your manager if it’s acceptable to have one of your female peers
    from another group join you.


    5. If you’re feeling isolated from networking events by a specific male peer,
    find a second male peer who you and the other person trusts to help support including
    you.


    6. If a male peer acts inappropriately toward you, it may take you a bit to absorb
    what happened. Not all of us are instantly reactive. Although I’ve always admired
    those that have an instant and excellent response to a slight, I’m not built that
    way. I prefer to take in what happened, consider why something happened, if I
    misunderstood or what were the intentions of the other person and then think through
    how best to deal with the situation. Ask to speak to the offender one on one if
    you feel it’s productive or ask a third party to sit in as a mediator. Explain
    that you were uncomfortable with the interaction, what behavior was the reason
    for the discomfort, and then set a clear boundary of how the person should interact
    with you in the future. Keep calm and stay focused on the goal of resolution.


    Company-sponsored events should be acceptable for any gender, race, or religion.
    If they aren’t, consider asking HR to enact a department policy with the goal
    of inclusion. Events that were acceptable 20 years ago could be costly to a company
    with today’s discrimination laws, and it’s worth it to the business for you to
    work with them to resolve out-of-date social practices than to have a lawsuit
    on their hands.


