    find out that it’s unique for everyone. For me, my pregnancy with my first son,
    born at the very end of 1994, offered a large part of the answer by putting me
    into remission, and once my autoimmune returned in 2004, it was first joint related
    (similar to rheumatoid arthritis) and then settled into a connective tissue disorder
    by 2014 but has never returned to the debilitating vascular condition it once
    was.


    I’d still suffered significant damage from the years of strokes. I was missing
    almost 9 years of memories; 48% of my left visual field required speech and physical
    therapy and could no longer perform the duties of my previous position as an auditor.
    While my brain was healing, I needed to continue to make a living, so I worked
    at Kinney Shoes. Yes, I sold shoes in a retail store. I was slowly recovering
    as I went through physical therapy, and my speech patterns were impacted, so speech
    therapy was required, too. Most don’t realize it today, as I am a professional
    speaker, but I still have some issues with “the thesaurus of my brain” and will
    falter to pronounce some words. Just be patient with me—it’s no big deal considering
    how far I’ve come. Outside of this and my missing visual field, not many signs
    of what I went through over two decades ago.


    It wasn’t a simple recovery though. I recall working at the shoe store 25 years
    ago and sitting in front of a pile of shoes that I was to organize by size on
    a set of shoe racks. It took me a couple days to perform this simple task. I was
    incredibly frustrated as my brain simply couldn’t figure out how to put the size
    five first, then the five and a ½, then the six, and so on and so forth. The thing
    was, I’ve always been incredibly persistent. I’ve had bosses call me stubborn
    and sometimes a bit obsessive, but it served me well as I recovered from my strokes.
    I just simply refused to give up and just kept trying until I worked my way through
    the shoe rack and placed all the shoes in order. I approached every challenge
    this way as my brain healed, succeeding rarely the first time, but refusing to
    give up and persevering in the end.


    I had a long way to go, too. I no longer had any of the knowledge I had acquired
    as a young adult. I had to relearn how to drive, and my sense of direction had
    been impacted. We won’t discuss how many times I found myself on the opposite
    side of the city *vs.* where I was going, and if there’s one thing you learn about
    Denver, it is that it’s quite a simple city to navigate. There’re mountains only
    on the west side, and you can see them from almost any location. It’s hard for
    me to recall how I couldn’t tell which direction I was heading. I no longer knew
    how to balance a check book or other basic skills I’d learned. As with the shoe
    rack, I continued to make an attempt until I finally succeeded.


    With the loss in memory, about 6 months after my last stroke, my brain fog began
    to lift. I discovered myself married to a man that I didn’t really remember dating,
    let alone marrying, and I was 5 months pregnant with my first child. I worked
    to heal, become independent, and became a single parent less than a year after
    my last stroke. It should have been a terrifying prospect, but I think I was too
    busy working toward succeeding at little things daily to think too much about
    the risk I was taking. I look back now and can say, without a doubt, that nothing
    seems as daunting as where I was then, and it may be why I seem so fearless now.


    As my brain healed, I went from selling shoes to selling computers at Circuit
    City. The company discovered that I had a knack for software, and I began doing
    desktop support. I had married the father of my two younger children, and he advised
    me to become a desktop support specialist for US West (now Centurylink). He made
    it clear that I was ready, as he had “guys making $40K a year that can’t load
    Microsoft Windows at a C:/ prompt.” I started as a desktop support person with
    no experience working in a networked or office environment. As is the case now,
    I took on the challenges no one else would touch, which turned out to be database
    applications. Few appeared to have expertise in the area, but I read whatever
    I could find and worked hard to figure out what I could on my own. Oracle was
    16 bit at the time, version 7.3.4 had just been released, and I found it ridiculous
    that those using more than one Oracle application with different versions were
    expected to run each application on a separate workstation. I figured out a way
    to switch the win.ini file in Windows 95 to allow a change to the path to the
    Oracle directory, allowing users to do what they said shouldn’t be possible—one
    workstation/multiple Oracle applications. Oracle asked if they could send a representative
    to come in and review my scripts and configuration and upon completing the review
    advised the Chief Technical Manager at US West to “make a DBA” of me.'
  trans: '

    # 意外踏入技术之路


    我在近 30 岁时才进入技术领域，那是 20 世纪 90 年代末，正值数据库职业发展的黄金时期。我毫不羞赧地承认，自己并没有计算机科学学位。由于一种疾病影响了我
    20 多岁头几年的生活，我几乎没有什么大学学历可以倚仗。


    22 岁那年，我开始出现奇怪的偏头痛，这与我从十几岁起就患有的偏头痛模式不同。这些新的“偏头痛”大约每六个月发作一次，带来一种碾压般的剧痛，常常像刀割一样从大脑右后侧向上蔓延，并伴有麻木和视力丧失。视力丧失主要在左侧，活动能力也同样受损。疼痛会持续几个小时，一旦消退，我便无精打采，会睡上一两天。由于看医生费用高昂，而当时我是一名审计员，经济上并不稳定，而且保险对许多项目都有免责条款，除非万不得已，我都不愿就医。


    经历了数次这样的偏头痛和两天的昏睡后，我意识到左眼视野仍缺失了大约 10%，这足以让我去寻求专业医疗帮助。我被转诊给一位神经科医生，他为我做了核磁共振后，告知我患过中风，而且这已经不是第一次了。那
    10%的视力缺失是永久性的，但我的“中风”并非典型类型。大多数中风是由高血压和血管堵塞引起的，然而血液检测显示我存在出血问题，而且血压极低。进一步的血液检测发现我自身免疫抗体呈阳性，于是风湿免疫科医生也加入进来开始研究。


    在接下来的四年里，我经历了五次确诊的中风。到 1993 年，医生告诉我，最好的情况是到 40 岁时失明，最坏的情况则是死亡。我立即寻求了第二诊疗意见，幸运地找到了一位对查明病因感兴趣的神经科医生。而自身免疫性疾病的特点就是，每个人的病因都独一无二。对我来说，1994
    年底生下第一个儿子的孕期，在很大程度上给出了答案——它让我进入了缓解期。当我的自身免疫问题在 2004 年再次出现时，起初与关节有关（类似类风湿性关节炎），到
    2014 年则定型为结缔组织病，但再也没有回到过去那种使人衰弱的血管疾病状态。


    不过，那些年来的中风还是对我造成了严重损伤。我缺失了近 9 年的记忆；左眼视野失去 48%，需要接受语言和物理治疗，并且再也无法胜任之前的审计员工作。在脑子恢复期间，我仍需谋生，于是去了
    Kinney 鞋店工作。是的，我在零售店卖鞋。我在接受物理治疗的同时慢慢康复，而我的语言模式也受到了影响，所以还需要进行语言治疗。如今大多数人看不出来，因为我是一名专业演讲者，但我的“大脑词库”仍有些问题，有时会念错一些单词。请对我多一点耐心——考虑到我已经取得了多大的进步，这根本不算什么。除了这一点和我的视野缺失外，几乎看不出二十多年前我经历过什么。


    然而，康复之路并不简单。我记得 25 年前在鞋店工作时，坐在一堆鞋子前，需要按尺码把它们整理到鞋架上。这个简单的任务花了我好几天。我非常沮丧，因为我脑子里就是想不明白怎么先把
    5 码放好，然后是 5.5 码，接着是 6 码，如此类推。关键在于，我向来非常执着。有老板说我固执，有时甚至有点偏执，但这在我中风康复过程中帮了大忙。我只是拒绝放弃，不断尝试，最终把整个鞋架的鞋子都按顺序放好了。在我大脑恢复的过程中，我以这种方式应对每一个挑战，虽然第一次很少成功，但拒绝放弃，坚持到底。


    我前面的路还很长。我年轻时学到的所有知识都荡然无存。我必须重新学习开车，方向感也受到了影响。我们就不提有多少次我发现自己到了城市*相反*的一边，而不是我要去的地方了——如果你对丹佛有所了解，就会知道这是一座非常容易辨认方向的城市。只有西边有山，而且几乎在任何地方都能看到它们。我很难回忆起自己当时为什么连方向都分不清。我也不会再记账或使用其他学过的基本技能了。就像整理鞋架一样，我不断尝试，直到最终成功。


    伴随记忆的丧失，在最后一次中风大约六个月后，我的脑雾开始散去。我发现自己嫁给了一个我几乎不记得曾约会过的男人，更别提结婚了，而且我当时已怀第一个孩子五个月。我努力康复，变得独立，并在最后一次中风后不到一年就成了单亲妈妈。这本该是一个令人恐惧的前景，但我想我当时太忙于每天在小事上取得成功，以至于无暇过多考虑自己冒的风险。现在回顾过去，我敢肯定地说，没有什么比当时的情况更令人望而生畏了，这可能也是我现在看起来如此无所畏惧的原因。


    随着大脑的恢复，我从卖鞋转而到 Circuit City 卖电脑。公司发现我有软件天赋，于是我开始做桌面支持。我后来与两个年幼孩子的父亲结了婚，他建议我去
    US West（现为 Centurylink）做一名桌面支持专家。他明确表示我已经准备好了，因为他手下的“一些人年薪 4 万美元，却连在`C:/`提示符下加载微软
    Windows 都不会。”我以一名桌面支持人员的身份开始了工作，毫无网络或办公室环境的工作经验。与现在一样，我接手了别人都不愿碰的挑战，而这些挑战恰好是数据库应用程序。似乎很少有人具备这方面的专业知识，但我阅读了所有能找到的资料，并努力靠自己解决问题。当时
    Oracle 还是 16 位版本，7.3.4 版刚刚发布。我发现一个荒唐的现象：如果使用不同版本的多个 Oracle 应用程序，用户居然需要在不同的工作站上运行每个程序。我找到了一种方法，通过切换
    Windows 95 中的`win.ini`文件来改变 Oracle 目录的路径，从而实现了他们声称不可能做到的事——一个工作站运行多个 Oracle 应用程序。Oracle
    公司询问能否派代表来审查我的脚本和配置，审查完成后，他们向 US West 的首席技术经理建议“把她培养成 DBA”。

    '
- fmt: '# 2. The Complexities Behind the Challenges for Women in Technology


    Little did I know, as I worked for multiple companies, progressing my career,
    that I would end up working for Oracle 15 years later. My career delivered incredible
    opportunities to work with fantastic individuals, mentors, and people I idolized
    in the industry. It taught me how to avoid some of the pitfalls that I experienced
    earlier on, and my learned persistence, mentors, and sponsorship were the difference
    between my continued success in technology and missed opportunity for others.
    My own experience, my ability to have others share their own experiences with
    me, and the data that I’ve collected have provided me an incredibly big picture
    of the challenges and opportunities for women in technology (WIT).


    What I learned from all my experiences is that everything happens for a reason,
    every challenge has a benefit, and that there is incredible power in the simple
    act of doing.


    My own journey, with bizarre medical history and nontraditional path into technology,
    also relates in many ways to why these stories need to be shared. A majority in
    the field aren’t college graduates with Computer Science degrees. In fact, it’s
    more likely that they’ve come from diverse backgrounds, were discovered to have
    a natural affinity to technology, or fulfilled a need and became an “accidental
    technologist.” Each is a complex life form, and understanding who each of them
    are requires a deep discussion around gender, upbringing, and culture and must
    include research data. My goal here is to broach topics honestly and discuss that
    we’re a product of our upbringing, our experiences, and the opportunities we’ve
    been given and how it can make the difference between success and failure.


    Footnotes [1](#469679_1_En_1_Chapter.xhtml#Fn1_source) [2](#469679_1_En_1_Chapter.xhtml#Fn2_source)
    [3](#469679_1_En_1_Chapter.xhtml#Fn3_source)


    ## The Complexities Behind the Challenges for Women in Technology


    I’d like to say the simple source of all our frustration around women and information
    in technology is gender, but it’s more complicated than that. A percentage of
    individuals would tell you that men and women are biologically different and that
    this explains it all. Although they are correct that differences exist, research
    shows that with all the differences, in the end, the data doesn’t add up to the
    gulf of exclusion we see today.


    Scientific studies have confirmed that men have more gray matter than women. At
    the same time, they also prove that women have more white matter than men.^([⁴](#fn4))
    Gray matter is used for everything from vision, muscle control to decision making,
    but white matter is used to speed up the connections between synapsids. This results
    in women’s connections firing faster than men’s even though they possess larger
    quantities of gray matter, which scientists use to explain why overall, men and
    women have the same average IQ. Maps of neural circuitry have shown that women’s
    left and right hemispheres are far more connected than men’s, while men’s were
    more connected front to back. While men were often able to outperform women on
    coordinated and perception tasks, women were able to interact more effectively
    in complex social situations and multitask. For every area that men’s brains are
    superior, scientists have identified an equalizing feature in women’s brains that
    compensate.


    ### Disorder or Dynamic?


    In the case of Attention Deficit Disorder (ADD/ADHD), [research](https://www.understood.org/en/learning-attention-issues/child-learning-disabilities/add-adhd/adhd-in-girls)^([⁵](#fn5))
    has shown that boys and girls are impacted differently as low activity in the
    temporal lobes is highly affected. It isn’t that medical professionals view girls
    as less likely to have ADD but due to how physical brain differences impact symptoms
    and cultural expectations allow girls to be diagnosed less often.


    I grew up the oldest of three girls and the first girl of my generation. Anyone
    familiar with birth order research might then understand one more reason behind
    what drives me and has made me less impacted by the challenges of my ADHD or what
    other women experience in the industry.


    An oldest child is more likely to emulate their parents and have significant expectations
    of oneself.^([⁶](#fn6)) I demonstrated ADHD tendencies from the beginning, being
    highly active and easily distracted. I asked a lot of questions and when answers
    weren’t enough (my mother was often exasperated with my incessant questions),
    I would fearlessly search out the answers on my own.


    ### Boys Have More Fun


    I recall spending time with my older male cousins and trying to keep up. They,
    like my younger sisters, were tall, sandy haired, and blue eyed. I was small framed,
    with an inability to sit still and a desire to do whatever they were doing. We
    grew up on the shores of Lake Michigan in the rural Upper Peninsula and spent
    a considerable amount of time outside during the summer months. If the boys were
    going to challenge each other to standing in the creek to see who would last the
    longest in the icy waters, then I was going to, too. This kind of competitive
    games and others of risk created situations where the adults would worry about
    me, a small girl among these larger boys. I remember concerned voices calling
    me back from what the boys were doing. I would incessantly ask why I couldn’t
    play the same games as they were until exasperation would leave them relying on
    the answer of, “Because you’re a little girl.” This occurred often enough to make
    me identify being a girl with being limited. By the time I was five, I remember
    wanting to be a boy, as it seemed synonymous with freedom and fun.


    ### The Girl Next Door


    As the oldest of three girls, I was blessed with two sisters, but the middle child
    was the ideal image of the girl next door. With long blonde curls and big blue
    eyes, my sister Kristi was quickly identified by the adults around her as a perfect
    example of what a girl should be. She was a sweet easy-going child that was more
    likely to sit still than her rambunctious older sister with the dark pixie cut
    and curious nature. I quickly noted how the adults would comment on her pretty
    blond curls and agreeable manner. I recognized how much easier it was for her
    while we were growing up—she fulfilled their expectations of her just by how she
    looked and what she did. She was the Amy of our Little Women,^([⁷](#fn7)) and
    as we grew up, I grew envious of the attention she received.


    The truth is the grass always looks greener on the other side. Culture may have
    expectations for us that some naturally are more comfortable with, but there is
    a drawback to this. Kristi was diagnosed with cancer at the age of 43. She quickly
    went from a healthy, happy mother of two children and a wife to a loving husband
    to realizing that the commitment she’d made with the idea that her dreams would
    be realized after her family left the nest was quickly snuffed out by the destructive
    disease. We talked at length about what she hoped for in her future, even as her
    future quickly disappeared. She told me that having a sister who’d authored more
    than one book and another finishing her masters made her realize that no matter
    how much she loved her life and her family, she had dreams she’d put on the back
    burner because culture had raised her to put everything in front of her own desires.


    Just as so many women around her, she was only following what our culture tells
    us in so many ways. We hear that our own dreams are often viewed as selfish and
    to be a caregiver to those around us. The saying of carpe diem, “seize the day,”
    becomes a promise unfulfilled as the unexpected takes hold. Kristi died a mere
    100 days after her diagnosis, never to be forgotten, but with dreams unfulfilled.
    With her death, I found greater inner strength and diminished any regret for not
    sitting still as a child that drove me to achieve as much as I possibly could.'
