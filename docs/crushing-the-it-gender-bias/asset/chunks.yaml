- fmt: '# Be Direct, but Not Too Direct


    My Mother has softened as she’s aged and is quick to tell us that she loves us
    now, but I think I did exhaust her more often than amuse her when I was a child.
    The benefit of her no-nonsense communication style was a philosophy that one “felt
    with your heart, thought with your mind, said what you mean and not to confuse
    any two.” Although she felt I needed to say what I mean, my mother seemed hesitant
    to give her opinion on most subjects, which left me to figure out things on my
    own. What it did teach me was that my intuition was correct more often than any
    person around me and to trust myself—a great strength when you’re a minority on
    your professional team.


    The term “intuition” creates interesting responses in the professional world.
    I’ve never veered from the fact that I have a strong intuition but would often
    ponder why, when discussing men, we’d be more likely to say they’re “trusting
    their gut,” yet we use a word that describes the same, more honed skill in women
    as something imaginary. My intuition is just my ability to be highly observant
    of situations and people. I take information and can see the big picture, but
    when individuals wish to downgrade this skill, they will deem it my “intuition”
    and when they wish to prioritize the similar skill in a male peer, then it’s “gut
    instinct.” This is often due to us not trusting women. It’s important to point
    these types of bias out to people—not in a combative way, but as a discussion,
    recognizing that the contributor’s value is being categorized differently.


    We really don’t trust women, and there’re [articles](https://www.huffingtonpost.com/damon-young/men-just-dont-trust-women_b_6714280.html)^([^(19)](#fn19))
    discussing the phenomenon by those now collecting data and documenting it. We
    too often tell girls that, from a young age, they’re overreacting or being overemotional.
    While boys are told to suppress their emotions, we explain to women that they
    are wired to be emotional *versus* analytical or logical and their emotions are
    assumed to be exaggerated for any situation.


    While men are raised to stand up for what they believe in and what they say, there
    is a hold over from days gone of “taking a man at his word.” On the other hand,
    women are asked to analyze and second-guess themselves regularly:


    * “Do you think you may have overreacted?”

    * “Do you think you misunderstood what he/she meant?”

    * “Why won’t you give him/her a chance?” (Often stated after a woman has decided
    about a person they’re interacting with.)

    * “Are you sure you heard them correctly?”


    There is absolutely no doubt in my mind this is why studies find that women suffer
    from imposter syndrome more often than men and why they are viewed as less decisive.^([^(20)](#fn20))
    We tell girls to doubt so much of what they think and their decisions, it’s no
    wonder why women second-guess themselves.


    ## Trusting Oneself


    As I’ve stated, I was a loner by nature. I tend to march to my own drummer, and
    my intuition is keen to let me know when something is someone else’s problem *vs.*
    blaming myself. As I honed these skills, it helped me greatly as I grew up and
    I began to trust myself over anyone else. This also required enough self-reliance
    to go it alone. I learned to enjoy my own company more than desire the company
    of others that might question what I already trusted about myself. There’s an
    interesting side effect to this—I was much more resilient to bullying and tended
    to stand up for those around me.


    Putting me in front of individuals that had deeper bias than others would quickly
    uncover their discomfort as I would ambitiously work to accomplish the same things
    as my male peers. A company had a choice to address it constructively or have
    it degraded into a bullying situation. I’ve experienced both. There was no intention
    on my part to instigate a combative situation with the bully; I would simply be
    performing at the level I thought was required for the company to get the most
    value out of me, but by the time the bully’s tendencies would be discovered, it
    would often be too late to divert the confrontation. Keep in mind—I am purposeful
    in my intent and expect others to react in kind. The truth is bias is unconscious
    and can often be as frustrating to the person demonstrating it as the person it’s
    targeting. The offender is often aware that something with their behavior isn’t
    quite fair or correct, but as bias is more subtle and upbringing may tell them
    that the bias is acceptable (such as families are better off with stay-at-home
    mothers or that women aren’t as capable as men in technical fields) *vs.* what
    they’ve experienced, it can cause the offender to lash out at the target than
    look internally for a solution.


    This is part of the answer to this problem though. It’s not a complete solution,
    but how you approach the problem may help you find resolution:


    1. When you are asked to analyze or second guess yourself, first investigate the
    motives of the person who’s made the request of you. It’s often unintentional,
    but you may note reasons stemming from personal insecurities and discomfort with
    women’s ambition to other bias.

    2. With this knowledge, you can then gain closure that the problem is the other
    person’s and not yours, making an educated decision on if you wish to go forward.
    Just because you know it’s the other person’s problem doesn’t automatically result
    in you proceeding, but it should require you to ask if there is a valid reason
    for you not to achieve the next step in your path.

    3. Don’t be afraid to have open conversation about the challenge you’re having
    with the individual. You should be able to gauge rather quickly if there is an
    opportunity for education or if the person is closed to growth.

    4. If a third party is required as a mediator, consider one that is focused on
    the goal of evolving and a resolution, not on taking sides.

    5. As your career grows and matures, you may find that you care less and must
    care less about what other’s think. It’s much easier for Sheryl Sandberg to do
    what she knows is right, even when there is a majority against her, than it is
    for Jane who just started her first year at a tech company. Doing has power, and
    the more you do and the more you become, the easier going for what is right *vs.*
    what others expect of you becomes.

    6. Know when to walk away, too. People don’t leave companies, they leave managers,
    and if your manager’s bias is limiting your growth, look for a new company with
    a manager that will foster your growth.'
