- fmt: '## A New Leaf


    About 6 months ago, I undertook a new challenge and a new area of technology,
    having started at Microsoft as a Data Platform Architect , focusing on Analytics
    and Artificial Intelligence. I chose to pull away from the current path that had
    put me into a hybrid technical evangelist/strategic advisor with the C-level back
    to a more deeply technical pursuit. There was this fascinating limbo I was caught
    in—developers and DBAs would consistently assume I was no longer truly technical,
    and for those in the C-level, I was deemed too technical. While many of senior
    management desired a high-level perspective with lots of buzzwords, they felt
    I had a more narrow niche of database technology and stressed little else. I felt
    strangely constrained, and even more so, I was bored.


    Although I’m more known for Oracle technology and gained significant success in
    the Oracle community, I’ve always been a multiplatform technologist and branched
    out to other technical platform conferences for speaking engagements. It really
    wasn’t any surprise; after all, the first database I managed was Microsoft SQL
    Server (both versions 6.5 and 7.0), closely followed by my first Oracle and Sybase
    databases at my first database administration job. I had a knack for taking on
    challenging situations, so I was quick to take on numerous database platforms,
    operating systems and scripting languages. Those that were often the most challenging
    systems were those that didn’t give individuals time to get comfortable on multiple
    environments, but the one-off oddities, and I became the owner of these types,
    wherever I was employed (Figure [8-1](#469679_1_En_8_Chapter.xhtml#Fig1)).


    ![../images/469679_1_En_8_Chapter/469679_1_En_8_Fig1_HTML.jpg](images/469679_1_En_8_Chapter/469679_1_En_8_Fig1_HTML.jpg)


    Figure 8-1.


    I have diversity in technology platform experience, not just in workplace


    I also found that as I was willing to take on the lost causes and biggest challenges
    at companies, people were willing to support me when I needed help. I would exhaust
    my own resources and could reach out to others, and as thankful as they were when
    I would take on the environments no one else wanted, they would, in turn, go out
    of their way for me, too. In some cases, this matured into mentoring and sponsorship
    I received over the years. My skills and technical knowledge were secondary to
    the value provided by my initiative and persistence.


    No matter how often I’ve experienced bias (since we covered in earlier chapters
    that research has shown possess bias), I continually work to be honest and fair
    about the technical world we live in. As so many of the women I knew left the
    same career I loved and couldn’t imagine living without, in the beginning, it
    seemed a minor footnote as my career advanced. Although I humbly respect the luck,
    the determination, and the skill that helped me achieve what I have in my career,
    I simply didn’t identify with what I was going through as bias and thought it
    was my personal experience. For an extended period of time, I chalked it up to
    my own personality and my makeup, not identifying my gender as central to it.


    Only after years of research, matching my experiences to many other’s experiences
    and then studies performed in ever-increasing amounts by universities and researchers,
    I discovered how significant bias is and how much it has to do with the culture
    we’re raised in. The deepest impact often came from the bias surrounding women
    with ambition. How people reacted to their bias toward women with ambition often
    fell into three categories:


    * Those who perceived the bias and were supportive of change.

    * Those that were indifferent or oblivious to the bias, unsure if it exists.

    * The last group, who experience distinct discomfort around women that have ambition
    and are often adversarial.


    This last group often display clear insecurities and are more often workplace
    bullies, and their interactions with ambitious women may degrade to the point
    some point of intervention is required. I’ve mentored women who have peers who
    viewed these women’s ambition as a personal and professional attack on them—simply
    by acting and accomplishing the same achievements as their male peers. As we were
    consistently told until recently it was a topic to avoid discussing, many individuals
    in the supportive and indifferent groups had a difficult time understanding the
    impact this group of adversarial individuals had on retaining women in the industry.
    The women around me whispered about it among themselves but dared not to say anything
    out loud, in fear of being viewed as unworthy, uncool, or rejected by the community
    that was important to them and their career.


    When working in a male-dominated industry, it can also appear to be directed solely
    to men, since the percentage that it will be a male peer involved will be much
    higher. Although it isn’t so, the idea that it’s directed toward one gender can
    be easily misconstrued.


    I read a great quote from social media the other day:


    > *“When discussing toxic behavior, we often view it as an attack on men, when
    in fact, we need to think of toxicity like we do with frogs. There aren’t many
    toxic frogs, but the ones that do exist, are really toxic and are very dangerous
    without looking it.”*


    I don’t know who had said it, and I can’t locate the original presenter, but it
    was a twist on an original quote focused on toxic masculinity. With this quote
    as a focus, it’s obvious that it’s up to all to be part of the solution. The first
    group we discussed must become allies of change. This group will not just be made
    up of the women in technology, but men, too. As discussed in earlier chapters,
    we all benefit as inclusion becomes a more important part of companies, resulting
    in improved policies around diversity and inclusion. The second group of those
    that are indifferent or have trouble empathizing with the challenges will turn
    from sympathy or indifference to accepting the change in representation, which
    simply wasn’t impacting to them, no matter the outcome. We didn’t have their buy-in,
    but as I hopefully explained, they weren’t against it, either. The third group,
    the toxic group consisting of men and women who have bias against women in technology,
    will have two choices—either evolve or continue to feel an impact to their careers
    as they impact those around them and the business’ bottom line.


    Recent HR policies are beginning to demonstrate changes where this type of toxicity
    is no longer acceptable in the workplace. This was evident even in recent interactions
    I’ve experienced with those I mentor and sponsor.


    One woman in the Microsoft community, who we’ll call Jane had been employed with
    her current company for over a year, having been welcomed and guided by a male
    peer, who we’ll call John. Jane credited John with helping her onboard quickly
    and bringing her up to speed in her new role. She greatly appreciated John’s assistance,
    but after the first 6 months, it became clear that John viewed her more than a
    coworker, and Jane noticed a distinct change in his attitude toward her once she
    began dating a gentleman outside of work who is now her boyfriend. John was first
    simply aloof and avoided her, but then he became belligerent and then openly hostile,
    to the point of sabotaging her most recent project. She reached out to her management,
    hoping for guidance, but was told that she must be imagining it or that she had
    just bruised his ego and not to worry about it.'
