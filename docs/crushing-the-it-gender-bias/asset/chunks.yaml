  trans: '

    # 数字中的力量


    数据（图 1-2）显示，有色人种在科技行业中的占比极低。不分性别来看，黑人在科技岗位中仅占不到 3%，而西班牙裔占比不到 5%。^(¹) 美国国家科学基金会统计了那些拥有技术学位但从事非技术领域工作（或持有技术学位却处于失业状态）的人群数据，发现有色人种男性和女性的比例远高于白人男性。^(²)


    ![../images/469679_1_En_1_Chapter/469679_1_En_1_Fig2_HTML.jpg](img/469679_1_En_1_Fig2_HTML.jpg)


    图 1-2. 有色人种在科技行业中的未被充分利用


    我们科技界的许多人都已注意到缺乏多样性的问题，而不仅仅是行业中的女性人数稀少。当我开始在技术活动中演讲时，我注意到有色人种之间会相互联系，并且无论旨在促进多元与包容的举措看起来多么有力，有色人种似乎始终难以真正突破并实现代表性。


    这一挑战可能部分源于经济因素以及我们资助学校的方式（图 1-3）。除了有色人种面临更高的贫困风险外，学校的资金依赖于当地学区的房产税。如果一名学生已经身处低收入家庭，并且所属学区也属于低收入地区，那么该学区的学生人均教育支出从当地企业和房产税中获得的资金，将远少于那些税收资金更为充裕的学区。


    ![../images/469679_1_En_1_Chapter/469679_1_En_1_Fig3_HTML.jpg](img/469679_1_En_1_Fig3_HTML.jpg)


    图 1-3. 美国各学区学生人均支出


    学校资源有限，以及教育侧重点与劳动力需求之间的脱节（图 1-4），进一步加剧了这一挑战。1980 年我上高中时，学校提供了学习`Basic`编程语言的课程，以及计算机体系结构课程。三十年后，我的孩子们正在上学，然而仍有
    41 个州不要求高中文凭必须完成任何技术教育。


    ![../images/469679_1_En_1_Chapter/469679_1_En_1_Fig4_HTML.png](img/469679_1_En_1_Fig4_HTML.png)


    图 1-4. 空缺技术岗位 vs. 计算机科学毕业生


    在学校能接触到计算机课程的孩子，更可能学习的是办公软件技术（电子表格、文字处理文档和演示文稿），*而非*实际的批判性思维或编程教育。科罗拉多州是美国大学受教育人口比例最高的州之一，但我的孩子若想参加`Java`编程课程，就必须去职业学校学习。我所在学区的职业学校已经背负着“学业困难学生才会去”的污名，这对技术的未来意味着什么？


    美国劳工统计局预计，到 2020 年将有 140 万个新的技术岗位需要由熟练劳动力来填补，但根据计算机科学教育统计，美国届时大约只有 40 万计算机科学毕业生能填补这些岗位。^(³)
    教育的目的是为年轻人未来做准备，但如果我们继续将中等教育（读写算）的重点放在文学、历史和生物上，并将技术视为“社团”或“课后活动”，那么我们永远无法将技术作为未来就业核心来教授。有多少英语文学专业和历史专业的学生目前正在从事本领域工作或处于失业状态？我们教授文学、历史和生物，是认为学生可能有热情和机会将其作为职业。难道我们不应用同样的投入去教授技术，使之成为毕业的基石吗？鉴于未来十年我们对技术人才的需求比例，我们看待技术教育的方式必须改变。


    因此，我支持许多将技术带给公立学校系统之外孩子的草根项目。`Black Girls Code`广为人知，但亚特兰大由 Jeremy Harms 运营的`Vine
    City Code Crew`也是一个绝佳范例，它将编程带入城市中心的孩子中间——这些孩子可能因家庭低收入而无法在家中培养对编程的热爱，或因学校资源匮乏而错失机会。创始人
    Kira Wetzel 创办了`Girls + Data`（我最初是通过 Mindy Curnett 了解到的），该项目为女孩们提供了在更轻松的环境中学习编程的机会，培养未来的技术人才。寻找这些能让原本无缘接触技术的孩子了解技术的草根组织并不难。只需要在`meetup.com`上注册一个账号并进行搜索；随着越来越多人认识到培养技术创造者（而不仅仅是消费者）的重要性，这样的组织每天都在涌现。

    '
- fmt: '## Tech—A Woman’s Place


    As the years progressed, I found myself migrating from my first team of all female
    Database Administrators to practically the only female DBA in a team of senior
    DBAs (Figure [1-5](#469679_1_En_1_Chapter.xhtml#Fig5)).


    ![../images/469679_1_En_1_Chapter/469679_1_En_1_Fig5_HTML.png](images/469679_1_En_1_Chapter/469679_1_En_1_Fig5_HTML.png)


    Figure 1-5. Number of women peers on my teams, past and present


    Due to financial and personal demands, it fell to me to provide for my children
    financially, and a career as a DBA allowed me a flexible work schedule with comp
    time and remote work to address days when kids were home ill, parent teacher meetings,
    or other demands on my time as the sole-custodial parent.


    When the average person thinks of a technical professional, the image that appears
    is often of two conflicting appearances:


    - The first is of a guy, mid-40s with long hair, sloppy dress, sitting in the
    dark, in front of a gaming screen with a bag of Cheetos and an energy drink.

    - The second is the traditional “nerd” with his neat but outdated apparel, pocket
    protector, and dark-framed glasses.


    Neither of these “stereotypes” are true to form, as there is significant diversity
    coming into technology and more so every day, but due to this, technical jobs
    might not sound like the place for a young mother with children. The truth is,
    I found my database administration job more supportive of the demands of a working
    mother than most of my nursing and realtor friends had. If I had to work on a
    weekend or at night, I was often working from home. If I needed to take my child
    to the doctors or for a parent/teacher meeting, it was easy to do, as was staying
    home with a sick child and working from there. As technology advances, it gets
    easier to do so, too. I’ve been able to telecommute for the last decade, making
    the most of my hours and less in traffic, which allows me to be more productive
    for both the company and my family.


    For those that see the old-school tech jobs of working 60–80 hours a week and
    needing to be in the office the first one in and the last one out, this is not
    because technology is a poor career choice but because the examples are a poor
    work environment and have poor leadership. It’s not that it doesn’t happen, but
    as my career matured, I found that I learned it’s not so much about work/life
    balance as it is about your balance needs.


    I’ve been judged harshly by peers and managers that questioned my dedication to
    my role when I’d need to work remotely or take time off to take a kid to the doctors,
    but I’d remind them to focus on what I accomplished in productivity and how accessible
    I was, even while maintaining my family responsibilities. That’s what’s important
    and what will correlate from work performed and the bottom line. There is a clear
    bias that correlates value to hours spent per week on the job, but it’s a huge
    fallacy in the workplace. If you can do in 40–45 what another employee can do
    in 60–90 per week, which employee is more valuable? Is staying till 7–9 p.m. each
    night really providing any value if an employee that works from home can be available
    whenever needed? Are we assigning value for the productivity *vs.* busy work?
    We all need to learn how to interview companies to find out which they value,
    as it will decide how satisfied you are with your job, your career, and in the
    end, the company’s bottom line.


    As you guessed, I’m a strong proponent for flexible work schedules, especially
    those that can incorporate telecommuting. Although there is incredible value in
    face-to-face time between peers, managers, and customers, for technical jobs,
    there’s considerable isolated work time that doesn’t require an employee to be
    in an office setting. For these types of times, the employee was hired as a professional
    and should be treated as such, allowing for telecommuting opportunities. There
    is significant savings to companies by doing so (in the way of workman’s compensation
    insurance, office space, and resources); the benefit is not one way. There are
    differences in how each gender is received when requesting flexible work schedules
    though.


    In 2017, Furman University performed a survey of 600 work age adults, when presented
    what they thought was a conversation between an employee and HR, changing the
    conversation to include different requests for flexible work schedules or none
    at all, but would change the gender on the requests. Some of the requests were
    nonfamily, others were due to childcare constraints, but the reviewers were asked
    to judge the request or on likability, dedication to their job, dependability,
    and if they were the HR representative, would they approve the request. The reviewers
    scored the men as more likable by an average of 70% while the women only 57%.
    They deemed the men more dedicated and dependable, even though the requests were
    the same and only the gender had been changed.


    As obvious as the research has shown greater potential for men to receive flexible
    work schedules without the same negative judgment, I’ve rarely experienced my
    male peers requesting the time off. I was more likely to observe them delegating
    family responsibilities to their wives, so they could avoid having to ask the
    boss for flexibility. I understood why they did so—it’s uncomfortable to have
    to ask for time off. As a divorced parent, I rarely had that luxury until I received
    a flexible work schedule as part of my employment. My ex-husband tended to be
    unavailable, so I admit, to avoid a disagreement with him, I found it easier to
    seek out companies that were supportive of flexible work schedules.


    Along with flexible schedules, pay was important, but it is for most people. As
    I stated, I was the financially responsible parent, along with custodial one,
    so it rated high on requirements for a potential position.


    It took me years to learn how to demand what I needed to be successful in tech.
    I first started with asking for what I needed to be more productive in a given
    day, then worked toward how to ask for what I needed to be more successful with
    my life and then from there, my career. Many of these changes to what is commonly
    offered us has to be sold to the company. Making the business see that investing
    in an employee can provide value to them should be a distinct and highly sought-after
    skill on any resume.'
