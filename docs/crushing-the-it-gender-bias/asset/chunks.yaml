  trans: '

    # 审判日


    无论男女，评判他人的方式或许不同，但这件事我们都在做。男性常常因能力被评判，而女性却往往仍因外貌被评判。^(¹¹⁵) 如果单看衣着，男性会被指责以异性吸引力为标准审视女性穿着，而女性则会以认同度来评判同性的着装。整体而言，女性服饰限制更多、舒适度更低，并且更容易受到时尚变迁的冲击——这一切叠加起来，催生了价值数十亿美元的时装品牌、杂志和在线内容产业。


    我之所以关注这个话题，是因为如果一位科技行业的女性每小时要花时间整理衣服十次，这些消耗的精力本可用于创造价值，而且累计下来每天会浪费五分钟。我本人极易分心，并发现当自己穿着更舒适时，注意力能更集中。自从脚部患上关节炎后，我再也穿不了高跟鞋，于是欣然换上了作战靴。我并不想穿传统的“护士鞋”（不是说它不好，只是不符合我的个人风格），但我下定决心不再让双脚受苦。从那时起，我开始找出那些让我分心的衣物，并将它们从衣橱中替换掉。


    * 会滑落的袜子被换成了能稳稳贴住脚踝的款式。

    * 任何让人不适的衣物——勒肉、紧绷、过窄或限制活动——都被替换成舒适合身、无需反复调整的服装。

    * 在裙子里穿上自行车短裤，这样我就不必在意走楼梯时楼下的人会看到什么。

    * 选用品质顶尖的鞋靴，但绝不碰带跟或尖头的款式。

    * 我学会了分层穿衣，这样无论温度如何变化，都更有可能保持舒适。


    所有这些着装选择都是为了支持我的个人风格——面料耐洗耐穿，但原则是：我必须感到舒适，并且真心喜爱这件衣服。从调整衣物和因不适而分心中节省下来的额外时间，便可以用于继续专注于手头的任务。我敬佩那些在会议/活动中穿着四英寸高跟鞋（而且居然还能站稳！）的女性，但任何在科技领域与男性竞争的女性，本就承受着更高水平表现的压力，而要做到这一点，你需要利用一切可以利用的优势。^(¹¹⁶)
    这可能是你未曾意识到的另一个消耗精力的领域——为了在极其苛刻的衣着中维持形象，每小时都要调整衣物。


    做你自己，但要找到一个舒适的自己，才能成就最好的自己。


    # 加速前行


    当女性开始不再畏惧自己的抱负，并渴望在技术职业生涯中成就更多时，她们便开始超越仅仅做好技术工作的范畴。正如她们的男性同行已经做到的——写作、面向观众演讲、在董事会中谋得一席之地——女性也应当如此。正如许多人发现的那样，她们可能会从那些先行一步的女性先驱那里收到相互矛盾的信号，而且这背后有充分的理由。我们仍不自觉地让一位女性上位，同时期待另一位女性退下来为她腾出空间。这是持续阻碍女性职场晋升的复杂因素之一。除非我们认识到这一点并加以解决，同时将科技领域的女性视为技术人员，否则我看不到改变的希望。


    我也建议竞选董事会职位。可以从本地社区或技术团体开始，然后逐步走向更高职位。这不仅对你的职业生涯有益，对那些敢于创新并主动寻找女性的董事会来说更是如此。女性董事会成员必须获得与男性同行同等的尊重和机会。由于女性不太可能将董事会职位视为“简历上的一项成就”，而是一个需要自己全身心投入的位置，因此女性董事会成员对任何董事会而言都可能卓有成效。^(¹¹⁷)
    借用蒂娜·菲的话来说：“彪悍的女人能成事。”


    对于那些想要做更多事情的人来说，董事会职位是一次绝佳的机会，但行业内的会议活动、专题讨论会以及活动组织也是如此。积极参与变革、支持本地组织，可以让你结识本地的人脉。许多人面临的疑问是如何获得引荐，并融入像会议这样的团体和活动。


    随着多元化和包容性对技术会议越来越重要，会议组织者常常对女性参会者和演讲者参与率低感到困惑。鉴于参会人数对任何活动成功的重要性，向行业内的女性伸出援手以改善这一状况是个绝佳的主意。如果你选择参加某个活动，可以看看有哪些社交活动和会后活动可供参与者选择。你可能会吃惊地发现，这些活动以及供应商的展品有多么以男性为导向，但我相信，随着多元化程度的提高，这种情况是可以改变的。


    我承认，我认识的所有女性，几乎都曾在技术会议上因过度饮酒、展台女郎和以男性为中心的噱头而遭遇过尴尬的互动。对于那些希望提高女性演讲者提交摘要数量的活动，不妨考虑向潜在的演讲者和往届参会者发出提交摘要的邀请。将摘要提交从竞争性的提案改为邀请性的，并不会改变摘要的录取方式，但确实会改变提交者的心理感受。


    如果我们希望技术会议能更多包容女性，就必须改变对“成功活动”的定义，使其惠及每一位参会者。只有一小部分女性会对以男性为导向的技术活动表达不满。^(¹¹⁸fn118)
    另一小部分女性会声称这并不困扰她们，因为早已习以为常，而大多数女性只会默默忍受这种不适，直到她们决定去做更有意义的事情。这就造成了一种无法自我维持、也永远无法改善的局面。


    我们还需要对下一代进行大量投资。不仅要改变现状，更要塑造未来。我们看到针对科学、技术、工程和数学（STEM）教育已经涌现出大量举措。除此之外，我们还需要在文化观念上推动变革，改变我们看待女孩的方式——这不仅是在关键的年龄节点^([¹¹⁹)（5
    岁、8 岁、12 岁和 15 岁），更要从文化视角在她们出生之前就开始转变。

    '
- fmt: '# 性别偏见与技术领域的挑战


    近期出现了一个令人不安的趋势——为准父母举办性别揭晓派对。表面上看，这似乎是对即将诞生的孩子的一种良性庆祝，但对我来说，这是对孩子性别的一种令人不安的痴迷。这完全沉浸在粉色和蓝色的性别世界里，将男性和女性分隔开来，而不是让孩子们成为他们最可能成为的人。我在1970年代长大，那是在嬉皮运动之后，我的衣服在今天看来是不分性别的——很少穿连衣裙，大多是灯芯绒裤子和衬衫，颜色与男孩穿的相同。我不是说穿带有亮片的粉紫色褶边连衣裙和套装是错误的。我要说的是，衣服不应该是性别标识物，我们不应该再用颜色来标识孩子两腿之间的性别。这些物品经常被用来判断一个孩子能做什么或不能做什么。由于游戏对于确定一个人以后对社会的潜在贡献至关重要，我们正在用性别偏见阻碍下一代的发展。我们用性别来决定哪些玩具是孩子可以玩的，这影响了我们未来一代成为最具生产力的社会成员的能力。


    这不仅仅是让女孩参加体育运动、引导她们接触STEM活动。这还在于识别偏见如何影响你自己的育儿方式。我们从很小的时候就被灌输偏见，这为我们的决策形成了一个无意识的层面。在玩具店里，一个男孩挑选了一个洋娃娃，父母倾向于引导他选择不同的玩具，因为他们知道洋娃娃被认为是女孩的玩具。这似乎无伤大雅，但这可能对一个男孩产生长期影响，让他认为育儿是女人的事，而不是男人的事。同样，当一个女孩想要一套科学实验套装，但玩具被放在标有蓝色的通道（被认为是男孩的通道）时，这传递了一个明确的信息：科学被视为男性的领域，这将影响她投入时间在科学上的方式，即使她对这一领域有真诚的兴趣。


    对大多数人来说，我们已经超越了意识到这些微小而有影响的问题的阶段。我们忙于养家糊口和谋生，但我们都在同一条船上，应该关心下一代。为了继续发展，我们需要充分利用我们所拥有的一切，这意味着需要全社会每个人的贡献。让学校里的所有人——女性以及所有有色人种——都能更多地接触STEM，意味着这些领域将有来自我们世界各个群体的代表。亚马逊最近关闭了一个大型人工智能实验，因为数据模型中存在偏见。^([^(120)](#fn120))
    我在亚马逊有很多朋友，他们有一个非常成熟的多元化和包容性项目，但这个项目仍然受到了偏见的影响。这是一个极好的例子，说明为什么所从事的工作必须由我们生活世界的各个群体共同完成，我们不能期望那些没有亲身经历的人去理解它。偏见是我们所有人天性的一部分，它太强大了——它过度地渲染了我们的世界，塑造了我们的思维。


    因此，我们继续努力改变未来，识别偏见，并公开讨论，对所有相关人员抱有同情心。我们拒绝简单地接受它，然后得出结论：“哦，事情就是这样。”当我刚开始工作时，有一种强烈的压力要我成为“哥们中的一员”，但这根本不可能。正如我们讨论过的，我们的社会根据性别将个体区分得如此鲜明，以至于对某些女性来说，这就像脖子上挂着一个标签。


    ## 引领变革


    如果我们有雄心壮志，希望在企业阶梯上向上攀登，数据显示，人口统计数据严重偏向于男性抢先晋升。^([^(121)](#fn121)) 那些希望看到改变的男性盟友可能会受到周围人的明显审视，而如果我们试图变得更像我们的男性同事，我们实际上只会变得不那么像自己。


    这就是我们拥抱自己本色的地方——不是作为女性，而是作为技术专家。“ME”原则开始发挥作用，我们成为社会、家庭和工作团队的一部分。它让我们成为最好的自己。如果我们不喜欢体育，我们拒绝假装喜欢；但如果真的喜欢，我们也不害怕去热爱。我们明确要求与同事做同样的工作。我们拥抱自己的爱好、兴趣和重要的事情，而不受男性主导环境的潜台词影响——那个环境暗示我们，因为不男性化就不酷。我们礼貌地拒绝去倒咖啡或做笔记，而是要求团队中的每一位成员轮流去做。女性必须有自由完全做自己——在技术领域展现自己的优势、技能和观点。我们必须停止认为，如果不符合那些掌控利益的男性所规定的兴趣，就不酷。我们必须突破偏见的边界，当偏见出现时，要求那些限制我们的人进行公开的对话。当我们看到女性同行或有色人种经历偏见时，要大声说出来，因为袖手旁观就是沉默的接受。


    许多女性不敢发声，害怕被贴上抱怨的标签。人们将女性的抱怨贬称为“发牢骚”和“唠叨”并非毫无缘由。尽管男性和女性抱怨的频率相同，但在文化上，女性的抱怨被认为更令人反感。由于这种区别，女性更倾向于把负面印象藏在心里，害怕受到评判。^([^(122)](#fn122))


    对于那些在男性主导行业工作的人来说，当脱衣舞娘出现在活动中，或者当团队建设活动又是一轮梦幻足球或体育赛事，并且显得不像一个团队合作者时，咬住舌头是有些影响的。大声说出来是推动变革以光速发生的不可或缺的一部分。虽然这可能会让人不舒服，但沉默等同于接受，如果什么都不说，没有人会知道有问题存在。他们只会继续挠头，然后对为什么技术领域的女性数量如此之少做出各种假设。^([^(123)](#fn123))


    我们必须致力于改变世界，或者至少改变我们身边的一小部分。我们的声音有力量，作为女性，影响变革的最大方式之一就是大声说出来。自古以来，我们的声音一直是被动的，找到自己的声音对我们所有人来说都是一段坎坷的历史。要进入技术领域，就需要更大胆地闯入这个不成比例的男性竞技场。我们需要相信自己，因为我们往往不太相信**自己**。正如埃莉诺·罗斯福^([^(124)](#fn124))所说：“女人就像茶包，不放到热水里，你永远不知道她们有多强大。”


    除非我们做到这一点，否则我们实现全部潜力的机会就会减少。不要害怕未知、风险和雄心，我们需要拥抱它们，迎接风暴的到来。一旦你渡过了难关，你就会认识到自己的价值，并且知道自己比社会曾经给予或将会给予你的认可要强大得多。'
  raw: 'There’s been a disturbing trend, as of late, to have gender reveal parties
    for parents to be. On the surface, this can appear to be a benign celebration
    of the upcoming birth of a child, but to me, it was a disturbing fascination with
    a child’s gender. It’s complete submersion into the pink and blue world of gender
    that isolates what is male and what is female *vs.* letting children be the most
    they can be. I was raised in the 1970s. It was post the hippie movement, and my
    clothes would stand out today as nongender specific, with much fewer dresses and
    a lot of corduroy pants and shirts offered in the same colors as they did to the
    boys. I’m not saying it wrong to have frilly dresses and outfits in pink and purple
    with sparkles. What I’m stating is that clothing shouldn’t be a gender identifier
    and quit using colors to identify what is between a child’s legs. These items
    are used too often to determine what a child is or isn’t capable of. As play is
    essential to identifying potential contribution to society later on, we hinder
    our next generation with gender bias. We use gender to decide what toys are acceptable
    for children to play with, impacting the ability for our future generation to
    be the most productive members of society.


    It’s not just letting girls play sports and introducing them to STEM activities.
    It’s identifying how bias affects your own parenting. We’re taught bias from very
    early on, creating an unconscious layer to our decision making. In a toy store,
    a boy picks out a doll, and a parent is inclined to influence him to choose a
    different toy, knowing that dolls are identified with girls. This may seem benign,
    but this can have a long-lasting impact on a boy that child-rearing is for women,
    not men. The same can be said when a girl wants a science set, but the toy’s been
    placed in an aisle that’s identified in blue, designating it the boy’s aisle.
    This sends a clear message that science is viewed as the realm of men and shapes
    how she will invest her time in science, even if she has a sincere interest in
    the field.


    For most people, we’re past being aware of these small, impacting issues. We are
    busy raising our families and making a living, but we are all in this together
    and should be concerned about the future generation. To continue to grow, we need
    to make the most of the best that we have, and to do so means that we have the
    contributions of everyone in society. More access to STEM for everyone in schools,
    women, and all people of color means that we have the contributions to these fields
    from a representation of our world. Amazon recently shut down an extensive artificial
    intelligence experiment due to bias being built into the data model.^([^(120)](#fn120))
    I have numerous friends who work at Amazon, and they have a phenomenally mature
    diversity and inclusion program, yet this project was still impacted by bias.
    It’s an excellent example of understanding why work performed must be done by
    a representation of the world we live in and we can’t expect those who aren’t
    living it to understand it. Bias is a natural part of all of us, and it’s too
    strong—it colors our world and shapes our mind too much.


    So we continue to work to change the future, identify, and discuss bias openly
    and with compassion for all involved. We refuse to simply accept it and come to
    the conclusion, “Oh, that’s just the way it is.” There was a strong push when
    I started to just be “one of the guys,” but it’s simply not possible. As we’ve
    discussed, our society identifies individuals so distinctly by their gender, that
    it can feel like a sign around some women’s necks.


    ## Taking the Lead


    If we are ambitious and hope to move up the corporate ladder, data demonstrates
    the demographics are weighed too heavily toward men advancing before us.^([^(121)](#fn121))
    Our male allies who wish to see a change can come under clear scrutiny by those
    around them and if we attempt to be more like our male peers, we really only come
    up as less of ourselves.


    This is where we embrace who we are—not as women, but as technologists. The ME
    principal comes into play, and we become part of our society, our family, and
    our teams at work. It allows us to be the most that we can be. We refuse to pretend
    to get sports if we don’t, but also don’t fear loving them if we do. We clearly
    request to perform the same work as our peers. We embrace our hobbies, our interests,
    and what is important to us, without a more male-dominated environment subliminally
    telling us that it’s uncool because it’s not male focused. We politely refuse
    to get coffee or take notes but ask that each and every member of the team take
    turns doing so. Women must be free to be fully themselves—their own strengths,
    skills, and perspectives in technology. We must stop thinking that if it’s not
    cool by the men dictating their own interests, then it’s not cool. We must push
    the boundaries of bias and ask those limiting us to have open conversations when
    bias comes into the picture. We speak up when a female peer or a person of color
    is experiencing bias, because standing idly by is silent acceptance.


    Many women don’t speak up in fear of being labeled as complaining. They don’t
    call it “bitching” and “nagging” for nothing. Although men complain as often as
    women, its women’s complaining that culturally is deemed more distasteful. With
    this distinction, women are more inclined to keep negative impressions to themselves
    in fear of judgment. ^([^(122)](#fn122))


    There is some influence for those working in a male-dominated industry to bite
    their tongue when the go-go dancers show up at an event or when the team-building
    exercise involves another round of fantasy football or sporting event or appears
    as a non–team player. Speaking up is an integral part of moving the change at
    the speed of light. Although it can be uncomfortable, silence is akin to acceptance,
    and nobody is going to know there’s a problem if nothing is said. They’ll just
    continue to scratch their head and make assumptions as to why the number of women
    in technology is so low.^([^(123)](#fn123))


    We must commit ourselves to changing the world, or at least our little corner
    of it. Our voice has power, and as women, one of the biggest ways we can influence
    change is by speaking up. Our voices have been made passive since the beginning
    of time, and finding our voice is a change that has a bumpy history for us all.
    To be in technology requires a more fearless push into this disproportionately
    male arena. We need to trust ourselves, knowing that we’re less likely to trust
    **in** ourselves. It was Eleanor Roosevelt^([^(124)](#fn124)) who said, “Women
    are like tea bags, you never know how strong they are until they’re in hot water.”


    Until we do this, we decrease our chances to achieve our full potential. Instead
    of fearing the unknown, the risky, and the ambitious, we need to embrace it and
    weather the coming of the storm. Once on the other side, you recognize your metal
    and that you are much more capable than society ever gave or will give you credit
    for.'
