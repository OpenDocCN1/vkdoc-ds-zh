- fmt: '### Benefits for All


    Flexible work schedules and remote work are two of the biggest enhancements to
    the technology sector.^([^(70)](#fn70)) It isn’t just for women, either. The best
    fathers I know work remote, and after working remote for the last 10 years for
    five companies, and working primarily with all-male teams, I’ve worked with quite
    a few work-from-home fathers. The flexible schedules, less time commuting, and
    more time bonding have built stronger connections with their children by being
    present more and, due to this connection, are more likely to take on household
    responsibilities, not just child-rearing ones. As beneficial as I see this to
    the children involved,^([^(71)](#fn71)) it’s also beneficial to their significant
    others. Women who work and have more equal partnerships with their spouses/partners
    have less demands and less stress in their lives. They have more satisfaction
    in life and in their relationships.^([^(72)](#fn72)) As strange as it might sound,
    this is also true for divorced couples with more equal share in family duties.
    I always had the impression that, even if I divorced, there was a valid reason
    I had loved my ex-spouse at one time and to treat them as I would want to be treated.
    I’m very aware that it takes two to tango, and in a break up, it’s the same—even
    if you are passive and the other is aggressive, you both played a part in the
    reason the relationship didn’t last. Those parents who are no longer together,
    who take the time to treat the other with respect, focusing on the fact that each
    is important to the child, should put their own feelings aside. Putting the child
    ahead of their own emotions whenever possible should be a priority. By eliminating
    these challenges and being able to productively coparent, the working mother is
    able to focus on providing for her family.


    Now with that focus in mind, this falls to how women do better in relationships
    where this type of mature co-parenting exists. Women with supportive coparenting
    and division of responsibilities do better in their careers.^([^(73)](#fn73))
    Consider how the removal of one, major demand each day would help you be more
    successful. As women are 49% more likely to perform household duties on a given
    day (*vs*. 19% of men), the removal of one daily demand can make a huge difference
    in their schedule.^([^(74)](#fn74)) If you can identify this difference and create
    a more equalized division of duties, it can make a significant difference in the
    success women have in their career, not just life.


    As dedicated as I was to my career, until 2010, I was still incredibly overextended.
    I was raising three children and dealing with a partner that was experiencing
    what some might call a “midlife crisis.” We’d made the promise that if we discovered
    we were making each other unhappy, we’d set each other free, and I was quick to
    do so. In his 40s, he realized he wanted to have children of his own, and being
    in my 40s, I was adamant to watch the three biological children from my previous
    marriage grow and leave the nest. By 2011, I’d been reintroduced to Tim Gorman,
    my first mentor, and over time, both divorced, we began the great romance and
    partnership we have today.


    ### Essential Support


    The research around women’s successful careers and supportive spouses has become
    better known.^([^(75)](#fn75)) Culture can make it extremely difficult for men
    when a woman is more successful than her spouse. As women are offered the opportunity
    to work or stay at home, men are still offered a single path—provider.^([^(76)](#fn76))
    Until we’re more accepting of men falling back into what is traditionally, a woman’s
    role in the household, then we will continue to hold women back in the workplace,
    too. Equality isn’t equal until all parties are able to contribute the same. ^([^(77)](#fn77))


    The decision of a woman’s career path is impacted by her partner’s wishes, too.
    It isn’t just asking your significant other if he/she is alright with you diving
    into your career, but how will they react if you make more money than they do?
    If there are children, who will take time off when one is ill/picked up from school/activities?
    Will you take turns or will one be responsible? What about those household chores?


    I can’t fathom how much less I would have accomplished if it wasn’t for the support
    from my spouse, Tim Gorman. His unwavering support has made a significant difference
    in how much I was able to invest in my career and my family. Having less to worry
    and be stressed about, knowing he was there to support me made a huge difference
    in taking on challenges that I may not have been able to otherwise.


    Many women I’ve mentored complain that their spouse says they’ll be happy to help,
    but then they lost patience with asking them to do something and end up doing
    it in their stead, having wasted more time asking the spouse to help. Is the spouse
    willing to take on 50% of the chores without being asked to do tasks or reminded?


    Some couples (men and women) view the spouse that makes less money as expected
    to take on more chores at home…as long as it’s the wife. ^([^(78)](#fn78)) This
    is important to understand, as it could put pressure on the woman when she’s starting
    out (with gender pay gap and women starting back into the workplace after children
    are in school, this is often going to impact women more) to be successful at all
    in her career if she’s handling more of the load at home.'
