- fmt: '# Navigating Networking


    You spend 40–50 hours a week at work and naturally will bond with those around
    you. For a lone woman in a group, this can be a difficult situation to navigate.
    It’s a common discussion among women behind closed doors who work in male-dominated
    industries—how do we keep a professional distance and still create friendships
    with our male peers? How do we ensure that we’re taking advantage of the same
    networking in social events that our male peers are that are essential for many
    of us to move ahead, to be seen by management?


    Why is this so important? When discussing the role of networking and professional
    socializing, it was discovered how often that women weren’t considered for promotions
    and management positions. Not because they were viewed as not having management
    potential but since they weren’t seen by management often enough to be known.


    Studies have demonstrated that women believe that if they just do the work, they
    will receive the promotions and raises they deserve.^([^(53)](#fn53)) Data proves
    that it’s more often a combination between competency and presence. If you aren’t
    present for social events that are part of a company or department, you won’t
    be present in leaders’ minds when they are making decisions.


    There are various ways that social gatherings at work can make a huge difference
    in your career. Over beers and over lunch, peers discuss salaries—salary data
    more valuable than what you’ll find on `Glassdoor` or other sites that display
    income data by region and field. It’s become more out of date to not discuss salary
    since the introduction of salary transparency in newer organizations. To know
    what your peers, in your location, are making in a role that you hold at the same
    company can provide vital data that we all need. It can impact gender pay gap
    in ways no other discussion can. I recall the first time I began discussions with
    my male peers about what they were making. I have more years’ experience and supported
    more platforms, but they were making a higher salary. When I asked how they had
    determined the salary to negotiate for, they admitted that they’d heard from male
    peers what they’d made while socializing and I began to do the same. The conversations
    were casual and never rushed—just simple conversations in groups about what was
    fair and what others earned. It was eye opening for me how different salaries
    could be, not just from one company to another, but from peers in the same role.
    It made me realize how much value I had and how little value sites like `Glassdoor`
    could provide to me.


    # Getting the Goods


    There’s significant data that proves that the average American income isn’t increasing
    with the cost of living,^([^(54)](#fn54)) and yet the stock market is booming
    and unemployment levels, especially in the tech sector, are low. As we acknowledge
    the pay gap for women of 74 cents earned for every dollar a man makes,^([^(55)](#fn55))
    it’s essential that women make the most of networking that benefits your future
    career in income and positions.


    I also realized how often, not just position placement, but promotions were decided
    over department lunches and social events. If women aren’t part of these group
    events, they may be bypassed for consideration. The challenge is how to socialize
    without receiving backlash of criticism or rumor. As much as men and women want
    to be treated the same for the same behavior, there are still the challenges of
    it not occurring in common society. My husband and I are in the same professional
    and social circles. We dated for over 6 months before we went public, but as expected,
    while Tim received “atta-boys” and pats on the back, I also received several unwelcome
    responses. I was asked by one man if he had a chance after “Tim was done with
    me.” Some of the inappropriate response were from men I respected greatly, and
    for a short while I distanced myself from the community as I dealt with the idea
    that I wasn’t simply respected by these men for my technical contributions.


    As a mentor, I’ve been challenged with this, too. I discovered that one of the
    women I’d been mentoring had gone out socializing with male peers that I’d socialized
    with multiple times myself in the past. The difference was that she is an attractive
    young woman, and being in sales, she was unaware that her joking was taken to
    be flirting. Although she and the male peer she believed she was joking with were
    both married, she received the majority of negative judgment regarding her behavior
    and the male peer benefited in status from her perceived attention. The young
    woman stopped socializing in any after events from that point on and left the
    database community soon after.


    When anyone asks me why jokes of a sexual nature and rumors of person relationships
    between peers are something I find unacceptable in the workplace, the previous
    discussion is an excellent example. If you were to line up six individuals, three
    male and three females, and for each of the couples, one set is said to be in
    a casual relationship, the second couple has been dating for less than a month,
    and the third is married. How do we view each with the idea of each individual
    having had a sexual encounter the next morning?


    First Couple: Male—Stud


    * Female-—Slut


    Second Couple: Male—He tapped that


    * Female—Walk of Shame


    Third Couple: Male—Got lucky


    * Female—She gave it up


    The overall descriptions showed that the men achieved a gain in status and positive
    responses, but the women declined in status and acquired negative connotations.
    Due to this dichotomy in most cultures (more in some than others), it’s important
    to recognize that any sexual discussion, even “locker room talk” about women peers,
    those reporting up to or even bosses, should be considered unacceptable. Hopefully,
    the preceding example demonstrates how culture disproportionately degrades the
    status of the professional woman you’re discussing and artificially inflates the
    man’s.'
  raw: '## Navigating Networking


    You spend 40–50 hours a week at work and naturally will bond with those around
    you. For a lone woman in a group, this can be a difficult situation to navigate.
    It’s a common discussion among women behind closed doors who work in male-dominated
    industries—how do we keep a professional distance and still create friendships
    with our male peers? How do we ensure that we’re taking advantage of the same
    networking in social events that our male peers are that are essential for many
    of us to move ahead, to be seen by management?


    Why is this so important? When discussing the role of networking and professional
    socializing, it was discovered how often that women weren’t considered for promotions
    and management positions. Not because they were viewed as not having management
    potential but since they weren’t seen by management often enough to be known.


    Studies have demonstrated that women believe that if they just do the work, they
    will receive the promotions and raises they deserve.^([^(53)](#fn53)) Data proves
    that it’s more often a combination between competency and presence. If you aren’t
    present for social events that are part of a company or department, you won’t
    be present in leaders’ minds when they are making decisions.


    There are various ways that social gatherings at work can make a huge difference
    in your career. Over beers and over lunch, peers discuss salaries—salary data
    more valuable than what you’ll find on Glassdoor or other sites that display income
    data by region and field. It’s become more out of date to not discuss salary since
    the introduction of salary transparency in newer organizations. To know what your
    peers, in your location, are making in a role that you hold at the same company
    can provide vital data that we all need. It can impact gender pay gap in ways
    no other discussion can. I recall the first time I began discussions with my male
    peers about what they were making. I have more years’ experience and supported
    more platforms, but they were making a higher salary. When I asked how they had
    determined the salary to negotiate for, they admitted that they’d heard from male
    peers what they’d made while socializing and I began to do the same. The conversations
    were casual and never rushed—just simple conversations in groups about what was
    fair and what others earned. It was eye opening for me how different salaries
    could be, not just from one company to another, but from peers in the same role.
    It made me realize how much value I had and how little value sites like Glassdoor
    could provide to me.


    ## Getting the Goods


    There’s significant data that proves that the average American income isn’t increasing
    with the cost of living,^([^(54)](#fn54)) and yet the stock market is booming
    and unemployment levels, especially in the tech sector, are low. As we acknowledge
    the pay gap for women of 74 cents earned for every dollar a man makes,^([^(55)](#fn55))
    it’s essential that women make the most of networking that benefits your future
    career in income and positions.


    I also realized how often, not just position placement, but promotions were decided
    over department lunches and social events. If women aren’t part of these group
    events, they may be bypassed for consideration. The challenge is how to socialize
    without receiving backlash of criticism or rumor. As much as men and women want
    to be treated the same for the same behavior, there are still the challenges of
    it not occurring in common society. My husband and I are in the same professional
    and social circles. We dated for over 6 months before we went public, but as expected,
    while Tim received “atta-boys” and pats on the back, I also received several unwelcome
    responses. I was asked by one man if he had a chance after “Tim was done with
    me.” Some of the inappropriate response were from men I respected greatly, and
    for a short while I distanced myself from the community as I dealt with the idea
    that I wasn’t simply respected by these men for my technical contributions.


    As a mentor, I’ve been challenged with this, too. I discovered that one of the
    women I’d been mentoring had gone out socializing with male peers that I’d socialized
    with multiple times myself in the past. The difference was that she is an attractive
    young woman, and being in sales, she was unaware that her joking was taken to
    be flirting. Although she and the male peer she believed she was joking with were
    both married, she received the majority of negative judgment regarding her behavior
    and the male peer benefited in status from her perceived attention. The young
    woman stopped socializing in any after events from that point on and left the
    database community soon after.


    When anyone asks me why jokes of a sexual nature and rumors of person relationships
    between peers are something I find unacceptable in the workplace, the previous
    discussion is an excellent example. If you were to line up six individuals, three
    male and three females, and for each of the couples, one set is said to be in
    a casual relationship, the second couple has been dating for less than a month,
    and the third is married. How do we view each with the idea of each individual
    having had a sexual encounter the next morning?


    First Couple: Male—Stud


    *   Female-—Slut


    Second Couple: Male—He tapped that


    *   Female—Walk of Shame


    Third Couple: Male—Got lucky


    *   Female—She gave it up


    The overall descriptions showed that the men achieved a gain in status and positive
    responses, but the women declined in status and acquired negative connotations.
    Due to this dichotomy in most cultures (more in some than others), it’s important
    to recognize that any sexual discussion, even “locker room talk” about women peers,
    those reporting up to or even bosses, should be considered unacceptable. Hopefully,
    the preceding example demonstrates how culture disproportionately degrades the
    status of the professional woman you’re discussing and artificially inflates the
    man’s.'
