    I should have trusted myself as much as others trusted me. However, in the immediacy
    of a situation, I found myself focusing on my most insecure feelings instead of
    my strengths. And as I’ve discussed my experiences with other women who’ve followed
    a similar path, I’ve discovered that overcoming these feelings is a challenge
    that many women continue to face in their careers.


    In Ruth’s experience, she noted, although in skills, both men and women managers
    were equally qualified, they were treated differently. She discovered those that
    were trusting of her abilities and didn’t disqualify her because of her gender
    were able to offer her opportunities to benefit the company and the teams she
    worked with. This is a powerful statement to how more representation could provide
    more consistent experiences like this and deter from those less productive due
    to gender bias.


    Like Ruth, Opal Alapat is another person I find incredibly dedicated, positive,
    and endearing. She’s an impressive technologist and recognized in her field by
    her peers, having been awarded Oracle ACE Director. Her intelligence is wrapped
    in warmth, and her calm exterior should lead people to trust her instinctively.
    I’m aware it hasn’t always been so, and I’m sorry for those that have missed out
    on the opportunity to let her achieve the great things she’s always demonstrated
    she’s capable of in every venture she takes on.


    We often joke about women being tuned out by the men around them, but there is
    a more challenging problem of men (and I’m aware of women who do this to fellow
    women), not believing women until a man validates what she’s said.


    I have experienced this first hand, where I’ve made a statement, and only after
    my husband has agreed with me or repeated it do people accept it. I have numerous
    topics I’ve spoken or written on, that once duplicated by a male peer, then goes
    from opinion to fact. Even with research and references, some simply aren’t satisfied
    and won’t listen to a woman’s ideas, suggestions, or answers unless a male peer
    validates it.


    Rie Irish is the Co-Leader for the PASS Women in Technology group and has graciously
    gone out of her way since my introduction to the community to both mentor and
    sponsor me (along with large numbers of women I know.) Her passionate and deep
    dedication to the Microsoft community is a pertinent part of why this initiative
    continues to succeed. She possesses extensive experience in database technology
    and serves as the Director of Database Management with her current employer, but
    that doesn’t mean she doesn’t still experience the challenges with bias.


    ## Is This Thing On?


    Rie Irish


    I distinctly remember the first time I realized a man wasn’t listening to me simply
    because I was a woman. Looking back, I’m sure it had happened many times before.
    This time, in the moment, I knew. I was in my mid-20s and coteaching a university
    class with a full professor, Tom Petee. I’d completed everything I needed for
    my master’s degree, and this wasn’t the first class I’d taught over the years.
    A young man asked a complex question that I easily answered. My answer was in-depth
    and required a diagram on the board and a significant amount of percentages that
    I threw in from memory. When I was finished, I asked if he understood. He said
    nothing to me but turned to the male professor and repeated his question, verbatim.
    I stood there, slack jawed. To my amazement, the professor instantly recognized
    what this young man was doing. He was having none of it. Tom stared silently at
    the young man for a moment and then said “She just answered the question better
    than I could have. Were you just not listening, or do you not get it?”


    Fast forward 10 years and I’m a senior DBA on a team at a large company. I work
    closely with a few all-male development teams for a large corporation. I have
    full production access and the right to stop any deployment. On this particular
    day, I’m standing with John, our sole male DBA, discussing an issue we’re having
    with an upcoming code push. I’m approached by the team lead for my dev team with
    a SQL Server question specific to our setup. I answer, in detail and without hesitation.
    The team lead pauses, turns to John, and repeats the question, verbatim. My colleague
    looks at me, incredulous. This time, we’re both slack-jawed. John repeats my answer
    to him, as best he can remember and then said “She just answered you. Were you
    confused?” Team lead mutters something about wanting to be sure and wanders off.


    Years apart, in different settings with different amounts of power and influence,
    I was treated with the same level of disregard and invisibility. It took me years
    to come to the realization that it wasn’t me. It had nothing to do with who I
    was, how confident I appeared, or how much seniority I had (or didn’t have). It
    had everything to do with them, with who they were as men and how little respect
    they hold for women. In both cases, I was lucky enough to work with a man who
    was aware of the issues I’d face as a woman in the workplace—Men who called themselves
    Feminists because they realized that equality isn’t pie, that my having more doesn’t
    mean they have less. Those experiences taught me to not wait for the man to answer
    but to instead say “I just answered you. Weren’t you listening?”


    Previous chapter content went into the fact that we often leave women unheard
    yet tell them they need to speak up. What do you do when the experience leaves
    you either “slack-jawed” or if response will only lessen the goal of furthering
    education on the topic?


    I’ve been asked to guess why women made the choices they made in certain situations
    and I’m always hesitant. I was most likely not present, and I wasn’t in the other
    woman’s mind, so any thing said would be an assumption on my part. Having allies,
    as Rie did in the two experiences she described, helped back up what she was experiencing
    and why the offender had made a poor choice of not listening to the knowledge
    a woman was willing to share.'
