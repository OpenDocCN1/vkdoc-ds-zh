    对大多数人来说，我们已经超越了意识到这些微小而有影响的问题的阶段。我们忙于养家糊口和谋生，但我们都在同一条船上，应该关心下一代。为了继续发展，我们需要充分利用我们所拥有的一切，这意味着需要全社会每个人的贡献。让学校里的所有人——女性以及所有有色人种——都能更多地接触
    STEM，意味着这些领域将有来自我们世界各个群体的代表。亚马逊最近关闭了一个大型人工智能实验，因为数据模型中存在偏见。^(¹²⁰) 我在亚马逊有很多朋友，他们有一个非常成熟的多元化和包容性项目，但这个项目仍然受到了偏见的影响。这是一个极好的例子，说明为什么所从事的工作必须由我们生活世界的各个群体共同完成，我们不能期望那些没有亲身经历的人去理解它。偏见是我们所有人天性的一部分，它太强大了——它过度地渲染了我们的世界，塑造了我们的思维。


