  trans: '

    # 导师，先疗愈自己


    这引出了寻找受指导和赞助对象的问题。关于如何成为导师，已有大量资源，但关于如何找到值得指导的对象却鲜有提及。这对我而言是一个学习过程：从寻找那些我认为被忽视的人开始，并在实践中不断学习。是的，我的指导风格更偏向同伴互助。我在此提供建议和赞助，但同时也展现自己不过是凡人。如果一位导师过于完美、过于自我保护，从不显露自身缺点，可能会让受指导者觉得他们取得的成就遥不可及。导师最宝贵的技能之一便是保持真实和人性。接纳自身缺陷，并展示我们每天为变得更好而付出的努力，对于希望追随我们脚步的人来说，是更有力的榜样。


    在完成多次成功程度各异的指导后，以下是总结出的最有效的方法。


    1.  进行“两位受指导者+一位导师”的模式，而非一对一指导。这提供了机会：若导师忙碌，同伴可提供支持。


    2.  寻找那些“渴望”成功的人。没有雄心，便无法成功。


    3.  导师必须希望受指导者最终比自己更成功。业内许多年长女性面临的挑战之一在于，她们被告知：女性若想成功，就必须让出自己已获得的位置。我们必须摒弃这种陈旧的偏见，推动女性在领导力和成功方面获得更多平等。


    4.  寻找受指导对象时，要将不安全感纳入考量。随着突然的成功、头衔和公众认可，一些人在晋升过程中可能会陷入内心挣扎。这场战斗最终无人是赢家。如果渴望成功的人更关注他人的成就而非自身，那么与其赞助他们，不如在专注力和自信方面加以指导。我经历过太多因内心深受不安全感折磨而造成的破坏。花时间去了解你正考虑的指导对象。


    5.  无需制定正式的指导会议日程——有些人需要更多时间，另一些人只需被指明方向或获得一些赞助，便能充分利用机会。给予人们恰好需要的东西。


    6.  要求你指导过的人将善意传递下去。除非你做到这一点，否则指导与赞助便无法持续。让你支持和给予机会的人，将这份善意传递给他人并加以发扬。


    对于那些有长期指导协议的人来说，你可能会面临如何解决女性在科技领域面临的问题，以及如何为她们提供建议的挑战。我们大多数人发现，女性导师能提供的最大益处是支持。当我们身处男性主导的工作环境时，理解对于克服有影响力的经历至关重要。尽管我们可能渴望理解，但要做到这一点却极具挑战。这并非削弱男性盟友的力量，而是让我们明白，亲身体验某事会显著影响我们与受指导者建立联系的方式。


    ## 快乐、光鲜的人们


    你指导得越多，就越会意识到如此多的女性正经历着同样的偏见和挑战。你与她们交谈得越多，希望你不会变得沮丧或愤怒，而是更清楚地意识到解决问题的方法，并想出若不与他人交谈就永远不会想到的解决方案。我认为，这是我与那些“为什么非要谈论我们面临的挑战？”、只想谈论科技女性世界积极变化的人之间最大的挑战。有一次，我描述自己如何被指示在一个活动上只能谈论科技女性的“积极”方面，而组织者不会容忍任何关于偏见、歧视或女性离开科技行业比例的讨论。听到这些，我极为敬佩的一位女性——Equili
    的创始人伊莱恩·穆拉诺^(⁹⁸^)打趣道：“哦，你是说那些‘快乐光鲜’的人！”我用这个词来形容那些要求我避免坦诚讨论、只坚持积极话题的人。我认为我们迫切需要鼓励和积极的话语，但当我们回避进行真诚的、带着敏感性的对话，而每个人都有各自的经历时，这会阻碍我们搭建桥梁、寻求解决方案来应对所面临的现状。


    我发现，我在甲骨文公司支持的许多科技女性议题，都源于坦诚的讨论——有时并不令人舒适，但因为建立在相互尊重的基础上，结果总是向好的方向发展。我愿意倾听并共情那些可能与我观点相左的人的经历，但毫无疑问，我们结束对话时的情况，远比未曾发生对话时要好。我在此传达的信息是：不要放弃，不要回避艰难的对话。这并不意味着你要放弃立场，而是意味着要寻求共同立场进行公开讨论。能通过他人的眼睛看世界，力量无比强大，往往能帮助你解决那些你曾认为不可能解决的问题。


    什么是共同立场？


    -   进入对话前，首先要认定所有参与者都能贡献有价值的东西。


    -   展现尊重，并期望对方同样给予尊重。


    -   聚焦于对话的目标。如何最好地分享你的观点，让对方理解你的出发点。


    -   记住，“正确”并不等同于“做正确的事”。


    -   带着让双方都能从对话中获益的目标参与其中。


    -   无论别人怎么说女性道歉太多，永远准备好道歉，并请对方澄清或详细说明他们所说的话，*而非*将其视为针对个人。


    这种方法在许多不同情境下都能奏效，而不仅限于科技女性议题。在讨论任何困难问题（无论是个人还是职业冲突）时，持有这种心态，可以使对话更富有成效。


    ## 霸凌者


    我确信你们中有人想知道，这种方法对职场霸凌者或那个对任何人都毫无尊重可言的人是否有效。工作场所总会有难缠的人——有些是“一视同仁”的霸凌者，有些则对女性或其他少数群体抱有偏见。如何应对难缠的人，是我职业生涯和个人生活中多次面临的挑战。

    '
- fmt: 'Let’s start by stating something we’ve already covered—society is uncomfortable
    with women that don’t fit traditional roles and traits. Some of it is hard-wiring
    survival methods built into humanity, but much of it is designed into our culture.
    The research^([^(99)](#fn99)) is out that proves that our gender is more controlled
    by our brain than our physical body, but I’m not here to debate that topic. What
    I am here to do is discuss the challenges that women face when they work in a
    male-dominated industry and may possess less traditional traits identified with
    a woman.


    Per research performed by the Australian Government and Comcare, workers reported
    that 20% of them encountered bullying in the workplace.^([^(100)](#fn100)) Of
    the data it collected, it discovered that 1 in 30 workers are serial bullies and
    that the bullying can continue for years, in some cases. With these high numbers,
    it’s no surprise that they also documented that 84% of workers will encounter
    bullying in their careers. Bullying also resulted in the workers judging their
    workplace as oppressive and 65% wouldn’t report incidents out of fear. The most
    alarming numbers from this study were around violence and threats. Twenty-three
    percent of workers stated that they had come across “threatening behavior” in
    their workplace, and 15% were on the receiving end of physical assault.


    As bullying can involve leadership, the research documented that 66% of the respondents
    reported workplace bullies that were managers or supervisors.


    When we come into conflict with someone who is uncomfortable with women who demonstrate
    less culturally acceptable traits in ambition, behavior, or interests, it can
    create an out-of-control situation. I’ve always said I brought the worst out in
    workplace bullies. This type is often doing their best to hide their insecurities
    and trying to be on their best behavior, and then I come in and really outperform
    without even trying. Even when I screw up, I’m quite comfortable in my weaknesses,
    so I take full responsibility for it and even have the tendency to make something
    positive of it. This can turn the workplace bully’s world upside down. They are
    suddenly facing their insecurities they don’t have a handle on (it’s the real
    reason they’re a bully to begin with), and the behavior that was occasional begins
    to escalate, and this is often the time they begin to target me. It often starts
    so suddenly, I’m left with this horrible feeling in my gut, knowing that I’ve
    triggered them and that I need to start working strategically to deescalate their
    behavior. The amount of energy that is allocated by both the bully and by me,
    as the target, to do this is considerable and leaves less time for productivity,
    something I’m painfully aware of. As someone who doesn’t like to waste time, you
    can imagine as stressful as it might be for most people, it’s considerably worse
    so for me.


    We’re all raised that work isn’t supposed to be fun, that’s why it’s called work,
    but there are numerous research studies that have been done recently to calculate
    the costs to companies by workplace bullies.^([^(101)](#fn101)) The cost in productivity
    and turnover is substantial and has been the key to me gaining the upper hand
    in these situations. I must add, I was younger when these situations occurred
    and at this time in my life. That may seem unimportant, but today, I neither have
    the energy nor the desire to stay in a job with a company that would keep a workplace
    bully that causes significant turnover or damage. With extensive experience as
    both a target and as an advisor, I strongly suggest leaving a workplace if the
    situation becomes unbearable. Women may be raised with less of an ability to separate
    ourselves from our workplace and not have it impact our health when a workplace
    bully is present. So yes, work won’t always be fun, but it also shouldn’t make
    you miserable or sick.


    There’re also those detail-centric individuals that will wonder what classifies
    a workplace bully?


    A bully is someone who uses demeaning, abusive, and/or antisocial practices to
    impact the ability for others to be productive in the workplace. They may try
    to mask it behind policy or procedure but show preferential treatment to a large
    group and often choose one person at a time to target. The bullying is often aimed
    at easier targets in our culture—women and minorities. The most interesting thing
    I’ve noticed is if a bully does empty a workplace of all the women and the minorities,
    they will then strike out on those that are left, almost addicted to having a
    target and getting a high from having an adversary.


    If you’re working in an office with a workplace bully, here is my advice:


    1.  If the behavior has just begun, see if it can be strategically deescalated
    and if there is a way you can work with the person or be moved to another department/team
    so you lessen the need to collaborate with them or work for the bully.


    2.  Find another job. Get out quick and get out fast if the bullying is intolerable
    or has the potential to impact your career.


    If you’re still set on fighting the good fight, then here are the facts—it’s a
    very time-consuming and an energy-draining battle. A workplace bully lives in
    a world where they have an adversary and you’re the one they’ve placed that target
    on. You can strategically try to avoid them, have them forget about you for a
    while as they take on other battles, but sooner or later, they will most likely
    refocus their negative attentions back to you. If it’s your manager, then you’re
    in an additionally weakened position of reporting to the bully. Employees leave
    bosses, they don’t leave companies, so this unfortunate combination can create
    a situation that’s rather difficult to overcome.


    I have taken on two bullies I reported to in previous jobs. The first one was
    experiencing skill set challenges and was threatened by my natural leadership
    and technical skills. She had survived by reporting solely in a lead position
    to the upper management and those who reported to her were unaware that they were
    taking blame for her technical mistakes until 6 months or more after the problem
    had occurred. At that point, it seemed petty for anyone to ask for it to be addressed
    and the behavior continued.


    The situation changed after I came back from heading up two large projects, to
    take over organizing our group and implemented a task management system that electronically
    recorded and historically tracked who was responsible for work in our group. Once
    she started to blame me and others, for her mistakes, I went to the manager above
    us and asked him to address it with her. He said he couldn’t and wouldn’t explain
    further. I explained to him, if he wouldn’t, I would go to HR and he said, “Please,
    please do.” Confused by his behavior, I printed out all the proof that she was
    the one in charge of the tasks which had been performed incorrectly and took it
    to HR. I calmly and carefully explained the loss in revenue and productivity to
    the company and told them very clearly that I just wanted it to be addressed.
    I explained to them it was unfair to her not to have proper leadership and support
    in becoming a better technical specialist.


    I had met with HR on Thursday at the end of the day. The next Monday morning they
    walked her out. I remember being frustrated that the problem hadn’t been addressed
    proactively from the beginning so it required a more severe outcome when I went
    to HR in the end. Lacking leadership is one of the biggest instigators of workplace
    bully behavior.^([^(102)](#fn102)) If you don’t have a strong leader, expectations
    are often left unset and positive interaction between teams and individuals degrade.
    A strong leader may have strategically mentored this lead and held her accountable
    before the situation ended up out of control, hopefully resulting in a different
    outcome than termination.'
