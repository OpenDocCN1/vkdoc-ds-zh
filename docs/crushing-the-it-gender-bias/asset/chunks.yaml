  trans: '

    # 跟我“男式说教”？


    对大多数女性而言，“男式说教”（Mansplaining）是一种令人恼火的体验。“男式说教”的官方定义是：“男性以居高临下或屈尊俯就的态度，（通常）向女性解释某事。”^(⁴⁷)
    如果女性花时间解释为什么不应该这样做，我们往往又会显得像“五十步笑百步”。你很难发现有强大领导力的人会进行“男式说教”。这种行为的根源源于某些人格特质，而这些特质与强大领导力并不相符，因为它们源于不安全感。


    研究还指出，“男式说教”源于男性和女性看待人际网络的方式不同。^(⁴⁸) 女性可能会排斥与自己竞争的另一个女性，而男性则会试图“压倒”另一个男性，因为他们将竞争视为一个阶梯，挑战在于证明谁是最聪明的顶端者。这种相互较劲、证明自己更聪明的需求，可能会在他们与其他男性竞争的同时，也蔓延到向女性证明自己的价值上，导致他们解释各种事实数据，即使对方——他们正在解释的对象——可能在该话题上受过更专业的教育。


    我也没少遭遇“男式说教”。最近就发生了一件有趣的事。我在魁北克的一个会议上演讲。一位同为演讲者的人开始向我详细解释，作为法裔加拿大人意味着什么。他说他自己并非法裔加拿大人，但我需要知道加拿大裔和法裔加拿大人之间的怨恨都源于某个特定的历史事件。他花了
    20 多分钟不断强调这一点，我注意到餐桌旁的其他演讲者要么戴上了耳机，要么忙于手头事务，要么看着我翻白眼。注意到他们的行为，我确信自己不是唯一一个觉得这位老兄解释得有点过头、而且他试图给我留下超过必要印象的人。是的，他并非刻意“男式说教”，但他确实在这么做。他从没问过我的国籍，而且说实话，他早就表明自
    2009 年起就认识我了。我几乎插不上嘴，本想通过解释我的家族在 18 世纪末从新斯科舍省来到安大略省来引导话题。最后我得出结论，一定是我没能很好地说明自己是法裔加拿大人，于是便让他说完，然后他离开了。


    之前戴着耳机的那位演讲者摘下耳机，摇摇头笑了。他说：“好个老兄（插入名字），他是个顾问，他签的每一份咨询合同上都有你的名字。他本该知道不应该向你解释什么是法裔加拿大人！”我的娘家姓
    `PotVin`，直接翻译自法语，意思是“一瓶酒”，但在魁北克，它是贿赂的俚语。我当时不知道的是，每份合同都是法语的，并要求你签字同意不接受任何“贿赂”。这属于行为准则的一部分，但就像俚语已成为美式标准英语的一部分一样，它也已融入魁北克法语。魁北克是美洲最古老的定居点之一，在旧时代，甚至在皮毛贸易之前，酒精就是货币。在新泽西，你可能常听到用“grease
    money（润滑钱）”这个俚语指代贿赂；在魁北克，他们用 `potvin`。


    当你遭遇“男式说教”时，重要的是找到一种方式，通过理解这种行为的根源或需求来实现内心的平静。“男式说教”源于一种文化——一种期望男性知道所有问题的答案和解决方案，以便超越周围人的文化。是详细解释，还是礼貌地先确认对方是否已经了解相关信息，这种需求上的差异实际上是无关紧要的。“男式说教”有时也是一种弥补不安全感的方式——一种显得自己更聪明的需求，尤其是在试图给面前的女性或群体留下深刻印象的时候。请记住，单纯的紧张或焦虑也可能导致他们选择这种行为。虽然这很令人沮丧，但如果这个人并非以这种行为著称（或者这是你第一次遇到），我建议尽量表现得大度，放过这位冒犯者。如果这种情况持续很长时间，或者影响了你的工作效率或任务完成，比方说在一次只有一次机会的会面中，你的第一印象或表现至关重要，那么就不要犹豫，打断这位“男式说教者”。我个人倾向于选择“不造成伤害”的原则，但当太多女性因为这类行为而在晋升、头衔和展示自我的机会面前被忽视时，这些就是我们制止这种行为、站出来发声的理由。


    用一句简单的“正如我刚才说的……”或“请让我说完……”来打断对方，可能是一种更温和的方式，让你能表达自己的意见，而无需直接指出对方在“男式说教”。如果我必须指出“男式说教”正在发生，我会试着开个玩笑：“请继续，再向我详细解释一下我的职责……”或者“真的吗？？我的产品是那样的吗？？”对于“偶然的男式说教者”，他们会很快意识到错误，不仅会停止这种行为，而且之后很少会再犯。


    而对于屡教不改者，他们可能在缺乏安全感和自我意识之外，还伴随着对女性的不尊重。这种极少数情况可能需要不同的方法。找到一位对此情况敏感且冒犯者尊重的男性同伴是最好的选择之一。冒犯者更有可能听从男性同伴的话，而且正如我们讨论过的，我们要时刻牢记目标，是为了教育，而非惩罚。我们都是解决方案的一部分，让男性帮助其他男性克服偏见和局限，与我们帮助女性超越自身偏见的作用同样重要。

    '
- fmt: '# Bully for You


    At times, men explaining basic concepts or hoping to prove their knowledge at
    a woman’s expense has to do with the recent changes in equality in the workplace.
    This isn’t isolated to men though. When we talk about workplace bullies, it was
    found that women were more likely to become a bully than men.^([^(49)](#fn49))
    A level of frustration may have built up in the individual, insecurities may have
    driven them to be directly competitive, and there may be some behavioral concerns
    from management, but no one is able to understand the source of the person’s anger.
    There’s a great saying that was shared with me that I often fall back on when
    I come across this type of anger:


    **“Equality can look like oppression to those that have always been privileged.”**


    The explanation behind this quote is for those that always received preferential
    treatment due to race, religion, or gender, suddenly find with rising equality,
    they no longer have privilege. Privilege is not the same as equality, and equality
    doesn’t mean granting privilege. A great example is the use case of passengers
    about to board for a flight. The passengers, just before boarding, are informed
    that there’s been a reorganization of the boarding zones to place passengers in
    equal numbers between each zone group.


    Some of the customers who were zone 1 and 2 are adjusted to zone 3 and 4, even
    though the number and order of those boarding haven’t changed and simply the title
    of a number of passengers from the 1 and 2 zones to 3 and 4 has changed. If you
    were a customer that was changed to the higher zones, even though you aren’t boarding
    any differently outside of the number that now is on your boarding pass and the
    number zone called, you may feel a sense of oppression. It is natural that some
    will demand for more equality. They must be oppressed even if the data doesn’t
    support it, because there’s been a change in status. It’s important for those
    that feel this way to stress that equality for others doesn’t mean less rights
    for you—it’s not like a plane with only so much overhead storage to fill before
    there’s none left. That’s not how equality works.


    This frustration from those that feel oppressed by encroaching equality deserves
    our empathy but not justification for their actions that are inappropriate or
    antisocial. The more common inappropriate behaviors demonstrated are as follows:


    - Gas lighting

    - Project sabotage

    - Withholding information

    - Bullying

    - Blaming others for their own mistakes

    - Instigating arguments

    - Isolating

    - Spreading rumors


    For those new to the term in the previous first bulleted item, the definition
    of gas lighting is a “form of psychological manipulation that seeks to sow seeds
    of doubt in a targeted individual or in members of a targeted group, making them
    question their own memory, perception, or even, sanity. Using persistent denial,
    misdirection, contradiction, and lying, it attempts to destabilize the target
    and delegitimize the target''s belief.”


    Women who are workplace bullies are often less direct than male ones.^([^(50)](#fn50))
    Some of the bullying goes back to the token quota discussed earlier, but for men,
    it can be a redirect from this feeling of misdirected oppression.


    In a worst-case scenario, the individual may make threats or even become violent.
    The last group often requires Human Resources and legal, along with security or
    police. These are not the type of individuals to try to reason with. With more
    workplace violence incidents occurring, it’s essential to accept the danger or
    those who act out inappropriately in the workplace. It’s common for them to lash
    out first at the women and diverse groups first.^([^(51)](#fn51)) If their behavior
    is more inconspicuous, they may simply drive out diverse groups from the workplace,
    but they most likely require an outlet for their anger and will start targeting
    those left. The most likely targets are those employees that are most productive
    and capable to satisfy their insecurities.


    Dealing with this type of personality is difficult, but it’s important to try
    to only meet with them in groups vs. any private meetings. Ask for interaction
    in writing; for example, “I’m really busy here, could you do me a favor and follow
    that up with an email?” If you’ve experienced a difficult interaction in the past,
    you might consider asking a manager to mediate. Document everything you can, as
    again, data is important when those around you may not realize how serious the
    situation is. A good manager will deal with the problem constructively and make
    it clear that the bullying behavior is unacceptable.


    # HR is Torn


    As a last resort, bringing HR into the situation may be required, but it’s often
    the only option if you wish to stay at the place of employment. If the company
    is unable to address the problem head on and the inappropriate behavior continues
    (bias is less straight forward for them to address like discrimination or harassment),
    then do consider looking for a new employment opportunity. Ensure to get references
    from the company and your peers before leaving and minimize any contact with the
    aggressor until you’re able to depart. Always identify these types of situations
    as poor leadership, not the normal behavior in technology. I’ve had the opportunity
    to work with some incredible people, and they’ve outweighed the negative ten-fold.


    I quickly discovered as I’ve mentored both women and men with bully situations
    that Human Resources has a fine line they try not to cross. Not only do they need
    to take responsibility for most everything for the company’s personnel, but they’re
    expected to manage situations in a black and white fashion when they involve humans
    that almost always make it gray.


    I’ve only experienced a couple of HR situations to end well when bias was involved,
    and I’m glad to say both were recent, so it tells you how far we’ve come in recent
    years when it comes to the topic of bias. I’ve been aware of numerous incidents
    of male peers or managers stalking women at work. In almost all of them, the woman
    either quit the company or was paid off by HR. Most of the time, the company policies
    weren’t adequate enough to deal with this type of problem, and as HR needed to
    protect the company, it was easier to just let the problem solve itself. The #MeToo
    movement has made significant changes, most of them good, but as with any change,
    some extremes exist. As there’s a chapter on social networking with peers, there
    are men who now state they won’t socialize at all with female peers in fear of
    false accusations.^([^(52)](#fn52)) As a woman who went through a stalking situation
    with a male peer, I don’t know why anyone would want to make up a stalking scenario.
    Policies aren’t present that will make it easy to address with any company and
    even more difficult to locate a job in the industry afterward.


    As with bullying behavior, similar tactics should be taken when a peer or manager
    displays obsessive behavior:


    1. Document everything. Tell them that you’re very busy and would greatly appreciate
    their requests via e-mail. If you have phone calls, use a system that has a record
    and same with web meetings. Retain the recording offsite from work, stored locally,
    and retain them for as long as you’re employed with the company that you’ve experienced
    it with. Your job is `CYA` (Cover Your Ass).


    2. Find out what the policy is against bullying, stalking, and harassment. These
    are newer policies taken on by HR, and if you have a progressive HR department,
    they will know how to address it in a manner focused on a solution for everyone
    involved.


    3. If you’re in a role that can move to another group, find a reason to move you
    that doesn’t have to address the behavior directly but will document it. Addressing
    it directly, especially aggressively, can escalate the behavior on the victim.'
