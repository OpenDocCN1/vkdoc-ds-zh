    way, find a trusted male peer to send the requests and see if their experience
    is different. It’s infuriating and if you’re incredibly busy, you don’t have time
    for this kind of bias to cost valuable time from you.


    ## He Said, She Said


    In the beginning of this chapter, we discussed HOW we communicate is as important
    as what we say.


    There are biological differences in communication between men and women. We’re
    not going to deny that research.^([^(32)](#fn32)) We also learn to communicate
    differently depending on our gender. As an example, when women nod their head,
    they are letting the person speaking know they hear them. When a man nods his
    head as another speaks to him, he is stating he agrees with them. It’s easy to
    see how this difference would create some confusion in mixed gender discussions.
    When speaking to a largely male attendance at a conference (OK, that’s almost
    all my sessions), I keep nodding at a minimum, but when at a WIT event, I will
    nod often, letting the audience, primarily consisting of women, know I hear them.


    There are also significant studies on upspeak ,^([^(33)](#fn33)) which is a term
    used when someone raises the tone of their voice at the end of a statement. It
    makes the sentence sound like a question and can remove the strength of a statement.
    It’s a communication style often identified with women and with a recommendation
    to avoid it. As women are instructed to be more direct and upspeak at the end
    of their sentences less, the recommendations can appear overly critical. As women’s
    voices are often higher pitched, even this can be a focus of criticism in a professional
    world that desires a commanding presence as a path to promotion.


    Simply changing a few things about the way, we converse can make a huge impact.


    *   Make statements—Instead of “Can I count on this by EOD tomorrow?” Say, “I’ll
    expect this from you by EOD tomorrow.”


    *   Write down an important idea or conversation point for every meeting or conversation
    you wish to have. Make a pact with yourself to contribute and be heard.


    *   Write down notes to keep you on task and focus on the goal of the talk. Men
    tend to not think out loud and would like to get to the point. If you want to
    discuss at length or multiple topics, schedule a meeting and put an agenda so
    expectations are set.


    *   Take a deep breath before you speak. It can keep your voice from being higher
    and keep from significant vocal inflections that can detract from the focus of
    your point.


    *   Your physical presence can have an impact on your vocal one. Don’t be afraid
    to take up space. If it’s important to have your point heard, find ways to stand
    while speaking, with your feet even with your shoulders and even when sitting,
    sit up straight and consider putting your hands on your thighs, elbows out.


    ## Uncomfortable Ambition


    When it comes to the topic of women and ambition, many people will tell you that
    they haven’t a problem with the combination, but upon viewing comments online
    about women in politics, those at the C-level, and any women challenging traditional
    roles, you’ll quickly realize that we have a long way to go. I’ve been part of
    extensive discussions on the discomfort people feel when women embrace their ambition.
    I have worked primarily with men in my career, and just as when we’re young, we
    emulate what the adults around us are doing, we take this learned skill with us
    into the business world, emulating those around us. As my career prospered in
    a male-dominated field, it shouldn’t be surprising that I began to emulate the
    strategies and approaches taken by my male peers. I quickly noticed a pattern
    in how different people responded to me approaching situations like the men around
    me. For years, I chalked it up to specifics about me that caused others to respond
    less than enthusiastically *vs.* when my male peers did the same. It wasn’t until
    I started speaking to other women, who described the same response, that I realized
    it was so often due to my gender.


    If you’re picturing men as the offenders of this response, as with other areas
    of bias, I discovered it’s all genders that are uncomfortable with women’s ambition.
    Other women were just as likely to react negatively to other women as men were.
    Women are almost as likely to be bullies in a workplace as their male peers.^([^(34)](#fn34))
    There’s a lot of data that identifies this as a response to bias^([^(35)](#fn35))—the
    women were advised to be tough or act more like men and have chosen a path of
    abusive behavior to demonstrate what they think that means. I’ve never found any
    research to substantiate if there’s upbringing or bias involved, but those that
    I’ve known to behave in bully behavior did fit a certain pattern.


    There does exist historical data that demonstrates that in most cultures women
    are raised to “police” other women.^([^(36)](#fn36)) When this policing occurs
    with a demonstrated bias, it can be difficult for us to call out because this
    is a woman being biased against their own gender. When bias is displayed against
    the opposite gender, it’s much simpler for society to know how to react. We prefer
    to use slang terms, such as “cat fight,” and I’ve often heard successful women
    policing the other women around them referred to as “Queen Bees.”


    Women who are designated as Queen Bees have a difficult role in society. I discovered
    that they often were pioneers in their career and professional groups. There was
    no doubt in my mind that they possessed strong leadership skills but often admitted
    to me that they were accused of being “bossy.” They’d commonly experienced more
    significant challenges than women who came after them, as they were the ones to
    pave the way. Due to overwhelming experiences with bias and previous discrimination,
    they may have made concessions to get where they are, as less was opportunities
    were presented to them and less representation present for them to challenge the
    expected role these women would play.


    A few of the women who came before us in my technical community built up defenses
    to ensure survival in an environment that wasn’t as welcoming to them and didn’t
    have the policies that are in place today. As these stories were shared with me,
    I recognize how far we’ve come in just recent years. Due to this history, these
    women react to bias a bit differently than their younger counterparts. They’re
    more likely to view an inappropriate situation or being bypassed for an opportunity
    by shrugging it off and/or claim it doesn’t affect them.'
