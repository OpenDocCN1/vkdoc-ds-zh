  trans: '

    ## 科技——女性的舞台


    随着岁月的流逝，我发现自己从最初全是女性数据库管理员（DBA）的团队，逐渐变成了一个高级 DBA 团队中几乎唯一的女性 DBA（图 1-5）。


    ![../images/469679_1_En_1_Chapter/469679_1_En_1_Fig5_HTML.png](img/469679_1_En_1_Fig5_HTML.png)


    图 1-5. 我历任团队成员中的女性同龄人数量


    由于经济和个人需求，我需要独自承担抚养孩子的责任。而 DBA 这份职业，以其灵活的工作时间、补休制度和远程办公的可能性，正好能够应对孩子生病在家、家长会，以及作为单亲监护人所需处理的其他事务。


    当普通人想到技术专业人士时，脑海中往往会浮现两种相互矛盾的刻板印象：


    -   第一种是四十多岁、长发、衣着邋遢的男性，坐在黑暗里，面前摆着游戏屏幕、一袋奇多和一瓶功能饮料。

    -   第二种则是传统意义上的“书呆子”，穿着整洁但过时的衣服，胸前口袋插着笔，戴着一副黑框眼镜。


    这两种“刻板印象”都不符合实际情况。科技领域的多样性正在日益增长，并且与日俱增。也正因如此，技术工作听起来可能不像是一个有孩子的年轻母亲该待的地方。然而事实上，我发现我的数据库管理员工作，比大多数做护士或房产经纪的朋友，更能支持职场母亲的需求。如果我需要在周末或晚上工作，我通常可以在家办公。如果需要带孩子去看医生或参加家长会，也很容易安排，同样，待在家里照顾生病的孩子并同时工作也并非难事。随着技术的进步，这一切也变得越来越容易。在过去的十年里，我得以远程办公，最大限度地利用我的时间，减少了通勤，从而能更高效地服务于公司，也更好地照顾家庭。


    对于那些认为科技行业的工作就是每周工作 60-80 小时、必须第一个到办公室、最后一个离开的人，我想说，这并非因为技术本身是个糟糕的职业选择，而是因为这些例子代表了糟糕的工作环境和糟糕的领导力。这种情况并非不存在，但随着我职业生涯的成熟，我发现，与其说是追求工作与生活的平衡，不如说是找到适合自己的平衡点。


    我曾因需要远程办公或请假带孩子看医生，而受到同事和经理的严厉评判，他们质疑我对工作的投入。但我会提醒他们，关注我的工作产出效率，以及我（即使在承担家庭责任时）的**可联系性**。这才是重要的，这才是衡量工作表现和最终业绩的关键。有一种明显的偏见，将价值与每周的工作时长挂钩，但这是职场中一个巨大的谬误。如果你能在
    40-45 小时内完成另一个员工需要 60-90 小时才能完成的工作，那么哪个员工更有价值？如果一个在家办公的员工可以随时待命，那么每晚待到晚上 7-9 点又真的能提供什么价值呢？我们是在为生产力**与**“瞎忙活”赋予价值吗？我们都需要学会如何“面试”公司，弄清楚他们看重的是什么，因为这决定了你对工作、对职业、最终对公司业绩的满意程度。


    正如你所猜到的，我是弹性工作制的坚定支持者，特别是那些允许远程办公的。虽然面对面的交流对于同事、经理和客户来说价值巨大，但对于技术工作，有相当一部分是无需在办公室进行的独立工作时间。在这种时候，员工是被当作专业人士聘用的，也应该被如此对待，允许他们远程办公。这样做能为公司节省大量成本（比如工伤保险、办公空间和资源方面），好处并非单向的。不过，男女在申请弹性工作制时，所受到的对待存在差异。


    2017 年，福尔曼大学对 600 名工作年龄的成年人进行了一项调查。研究人员向受访者展示了一段他们认为是员工与人力资源部门之间的对话，并改变了对话内容，使其包含或不包含对弹性工作制的不同请求，同时改变了提出请求者的性别。有些请求与家庭无关，有些则是因为育儿需要。受访者需要根据“讨喜度”、“对工作的投入度”、“可靠性”来评判这些请求，并且假设自己是人力资源代表，是否会批准该请求。结果显示，受访者给男性的“讨喜度”平均打分为
    70%，而女性仅为 57%。他们认为男性更投入、更可靠，尽管请求的内容完全相同，只是性别被改变了。


    尽管研究清楚地表明，男性更有可能获得弹性工作制而不受同样的负面评价，但我却很少见到我的男性同事申请休假。相反，我更多是看到他们将家庭责任推给妻子，这样他们就能避免向老板申请弹性。我理解他们为什么这么做——开口请假确实令人不快。作为一个离异的家长，在我获得作为雇佣条件之一的弹性工作制之前，我很少能享受到这种“奢侈”。我的前夫往往指望不上，所以我承认，为了避免和他发生争执，我更倾向于寻找那些支持弹性工作制的公司。


    除了弹性工作制，薪酬也很重要，这对大多数人来说都是如此。正如我所说，我既是有经济责任的家长，也是监护家长，因此薪酬在潜在职位的考量中占据很高的比重。


    我花了很多年才学会如何争取在科技行业取得成功所需的条件。我先是学着争取让工作日更高效所需的条件，然后努力学会如何争取让生活更成功所需的条件，再之后才是我的职业生涯。我们通常能被赋予的许多改变，都必须“推销”给公司。让企业明白，投资于员工能为他们带来价值，这应该成为每份简历上突出且备受追捧的技能。

    '
- fmt: '# The STEM Challenge


    2011 was a significant year for me. After the departure of “Ann,” I began to reach
    out to numerous women that I’d discovered had left the industry. I was able to
    have some open and honest conversations with them, gathering answers to my questions
    to understand why, as well as document cultural patterns when they existed. Some
    of these peers were ready to talk with me about bias, seemingly relieved of the
    burden of silence, while others were more private about why they’d left. More
    often, I found they had; just like me, we were taught not to discuss topic of
    bias, and it wasn’t something we acknowledged. Society had taught us to be skilled
    in creating excuses to justify what had occurred and if we did raise our voices
    to the reality would risk deemed being “uncool.”


    Many women in technology don’t fit into the traditional mold of the girl next
    door. We may have odd traits, interests, and behaviors that make people try to
    understand what makes us tick. To combat this, we still fall into an expected
    behavior. We become the “cool girl” instead of simply embracing who we are, and
    we may pretend to like sports, juvenile humor, and traditional male pastimes.
    As we like STEM (Science, Technology, Engineering, and Math), our more traditional
    female peers may have refused to accept us into their groups. Everyone wants to
    be liked, so it’s natural for us to try to find a group to be accepted into. If
    those of our gender won’t accept us, we will make concessions to be viewed as
    “not like other girls” in the cool image most accepted by the men around us. We
    often choose more masculine type pastimes and adopt less feminine traits which
    offer some protection from unwanted advances. No matter how far we stray from
    it all, we are still products of culture and bias. As much as we like to claim
    we are our own person, we’re shaped from the time we are delivered from the womb—placed
    in blue or pink clothing, given boy or girl toys, while boys are told not to cry
    and girls are told how pretty they are, all before we are even crawling.


    The numbers are astounding and will be built upon as we proceed through the chapters
    in this book. Between culture and bias, there is an ongoing challenge of acceptance,
    but with the initiatives of the last few years, I’ve gone from one of the few
    to speak out loud to one of thousands who speak up regularly. With all the initiatives,
    many worry that the numbers aren’t increasing as they expected, but when it’s
    grown stagnant, I haven’t been that surprised. I have been very successful with
    the mentoring that I’ve offered to others, but it’s never been traditional mentoring,
    and with the low numbers we began with, it simply wasn’t self-sustaining at this
    point. Similar to a small seedling, it requires care and feeding to build into
    something more until it has the roots and strong base to support itself.


    I hope the book will offer the insight to others on how to mentor women in the
    way they need to succeed but also demonstrate how important sponsorship, networking,
    and giving women options that often are so unspoken by everyone around us. Culturally,
    boys are raised with “skills,” but also these important opportunities, where girls
    are left to figure it out and traverse this on our own. Women have little idea
    how to gain sponsorship from a professional peer, having more likely been taught
    how to flirt. We are instructed how to gain someone attention, but not how to
    network and build our contacts in a way that will promote our career. We are rewarded
    for being seen, but not heard, and are taught how to actively listen while others
    talk in a business world, those same individuals that wonder why we don’t speak
    up more often, without the upbringing to teach us how to succeed in so many unknown
    areas of business and at the same time often told that some of our greatest strengths
    are drawbacks in the business world.


    Lucky for me, I’ve always been an individual to respect data over opinion. It’s
    not that I don’t hold value in experiences, quite the contrary. I have an incredibly
    observant and accurate gut instinct about situations but have always used data
    to ensure that my observations aren’t blinded by my own or other’s bias. This
    skill in observation has served me and those that search me out for this insight
    well. It’s a skill that is also used to inspect technical environments—leaving
    nothing off the table and gathering all data to understand complex situations.
    As bias is often unconscious, my own upbringing, gender, and experiences could
    cloud my view, so it’s important to collect data and research before making decisions,
    creating a plan of attack or creating a solution.


    As I stated, when I first started noticing how many female peers were departing
    the industry, I began to do research. There was surprisingly limited data back
    in 2011. I often wasn’t positive what to research, but I knew patterns were evolving
    in my observations, and there had to be reasons for them.


    The Stanford gender studies site and subsequent Ted Talks from Sherry Cornell
    offered the first data that explained the patterns I was privy to. The site articles
    were some of the first documented findings on gender bias in a scientific manner,
    providing the numbers that matched the patterns I’d started to document. Sherry’s
    talks were well received by me as she viewed the data with a scientific approach
    based on educating everyone. Her talks are enlightening, and the data is difficult
    to ignore, even if there are many who have trouble accepting it. This is an overwhelming
    topic, so I’m not one to push but always open to discuss. One of the most positive
    aspects of focusing on education and open conversation is the number of people
    who want to have these conversations.


    There are significant differences in the challenges that not only depends on culture,
    but location. I live in Colorado, which has a significantly high percentage of
    women leaving the industry over the national average, even though we have one
    of the highest percentages of college educated residents. While the national average
    is women will leave the technical industry within 4 years in a career, Colorado
    is less than four. The state of Utah is our neighbor, yet due to location and
    culture, a fellow president for a user group there isn’t as worried about retaining
    women in tech. Her biggest challenge is to get women into secondary education,
    as many of them are expected to marry right out of college. The difference is
    cultural, as there isn’t just an educational difference between the two states,
    but a religious one.'
  raw: '## The STEM Challenge


    2011 was a significant year for me. After the departure of “Ann,” I began to reach
    out to numerous women that I’d discovered had left the industry. I was able to
    have some open and honest conversations with them, gathering answers to my questions
    to understand why, as well as document cultural patterns when they existed. Some
    of these peers were ready to talk with me about bias, seemingly relieved of the
    burden of silence, while others were more private about why they’d left. More
    often, I found they had; just like me, we were taught not to discuss topic of
    bias, and it wasn’t something we acknowledged. Society had taught us to be skilled
    in creating excuses to justify what had occurred and if we did raise our voices
    to the reality would risk deemed being “uncool.”


    Many women in technology don’t fit into the traditional mold of the girl next
    door. We may have odd traits, interests, and behaviors that make people try to
    understand what makes us tick. To combat this, we still fall into an expected
