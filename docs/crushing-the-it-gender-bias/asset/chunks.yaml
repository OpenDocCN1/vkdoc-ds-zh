    ## 新的篇章


    大约六个月前，我接受了新的挑战，踏足了一个全新的技术领域，开始在微软担任数据平台架构师，专注于分析与人工智能。我选择脱离原有的职业路径——那个让我陷入混合型技术布道者/面向高管的战略顾问的角色——转向更深层次的技术追求。我曾陷入一种奇妙的困境：开发人员和数据库管理员总是认为我不再真正懂技术，而高管们又觉得我过于技术化。尽管许多高层管理者希望听到充满时髦术语的宏观视角，但他们认为我的专长狭窄地局限于数据库技术，对其他方面几乎不重视。我感到一种莫名的束缚，更糟糕的是，我感到无聊。


    虽然我更以 Oracle 技术闻名，并在 Oracle 社区取得了显著成功，但我一直是一名跨平台技术专家，并拓展到其他技术平台会议上进行演讲。这并不令人意外；毕竟，我管理的第一个数据库就是微软
    SQL Server（6.5 和 7.0 版本），紧随其后的是我第一份数据库管理工作中的 Oracle 和 Sybase 数据库。我擅长应对挑战性的局面，因此很快掌握了众多数据库平台、操作系统和脚本语言。那些最具挑战性的系统往往是那些不让人有闲暇适应多种环境的系统，而是些古怪的个例，无论我在哪里工作，我都成了这类系统的负责人（图
    8-1）。


    ![../images/469679_1_En_8_Chapter/469679_1_En_8_Fig1_HTML.jpg](img/469679_1_En_8_Fig1_HTML.jpg)


    图 8-1.


    我的技术平台经验具有多样性，而不仅仅是在工作场所中


    我还发现，当我愿意接手公司里那些被认为无望解决的最大难题时，人们也愿意在我需要帮助时支持我。我会用尽自己的资源，并向他人求助，而他们也很感激我接手了别人都不愿处理的环境，反过来，他们也会不遗余力地帮助我。在某些情况下，这演变成了我多年来获得的支持和指导。我的技能和知识，相比我主动性和坚持所提供的价值，反而退居其次。


    无论我经历了多少次偏见（正如我们在前几章所讨论的，研究表明偏见是存在的），我始终努力对我们所处的技术世界保持诚实和公正。由于我认识的许多女性离开了同样是我热爱且无法想象失去的职业生涯，起初，这在我职业发展的进程中似乎只是一个微不足道的注脚。尽管我谦逊地尊重那些帮助我在职业生涯中取得成就的运气、决心和技能，但我并没有将自己经历的事情归结为偏见，而是认为这是我个人的独特经历。在很长一段时间里，我将此归因于自己的个性和特质，而没有将性别视为核心因素。


    只有在经过多年的研究，将自己的经历与许多其他人的经历以及大学和研究人员日益增多的研究进行比对之后，我才发现偏见有多么显著，以及它与我们成长的文化环境有多么密切的关系。最深的影响常常来自围绕有抱负的女性所产生的偏见。人们对有抱负女性持有的偏见的反应，通常可以分为三类：


    *   那些察觉到偏见并支持改变的人。

    *   那些对偏见漠不关心或视而不见，不确定其是否存在的人。

    *   最后一类人，他们对有抱负的女性感到明显不适，并且常常带有敌意。


    这最后一类人通常表现出明显的不安全感，并且更常是职场霸凌者。他们与有抱负的女性的互动可能会恶化，以至于需要某种程度的干预。我曾指导过一些女性，她们的同龄男性同事将这些女性的抱负视为对他们个人和职业上的攻击——仅仅因为这些女性采取了与男性同事相同的行动并取得了相同的成就。直到最近，我们一直被告知这是一个避而不谈的话题，因此许多属于支持和漠不关心群体的人很难理解，这群敌对个体对留住行业中的女性产生了怎样的影响。我周围的女性私下里窃窃私语，却不敢大声说出来，唯恐被视为不够格、不合群，或被对她们及其职业至关重要的社群所排斥。


    当在一个男性主导的行业工作时，问题也可能看起来只针对男性，因为涉及男性同行的比例会高得多。尽管事实并非如此，但这种针对单一性别的印象很容易被误解。


    前几天我在社交媒体上读到一句很棒的话：


    > *“在讨论有毒行为时，我们常常将其视为对男性的攻击，而实际上，我们需要像看待青蛙一样看待有毒行为。有毒的青蛙并不多，但那些确实存在的青蛙，毒性极强，而且外表看起来并不危险。”*


    我不知道这是谁说的，也找不到原作者，但它是对原话的一个变体，原话聚焦于有毒的男子气概。以这句话为焦点，很明显，每个人都需要参与其中，成为解决方案的一部分。我们讨论的第一类人必须成为变革的盟友。这个群体不仅由女性科技从业者组成，也包括男性。正如前几章所讨论的，当包容成为公司更重要的一部分时，我们都能从中受益，从而改善有关多元化和包容性的政策。第二类那些漠不关心或难以同情这些挑战的人，将从同情或漠不关心转变为接受代表性方面的变化——无论结果如何，这原本对他们毫无影响。我们并没有赢得他们的支持，但正如我希望解释的那样，他们也不反对。第三类，即由对科技行业女性持有偏见的男性和女性组成的有毒群体，将面临两个选择——要么改变，要么继续承受对其职业生涯的影响，因为他们会影响到周围的人以及企业的利润底线。


    最近的人力资源政策开始显示出变化，这种类型的有毒行为在职场上已不再被容忍。即使在我近期的互动中，与我所指导和支持的人交流时，这一点也很明显。


    微软社区中有一位女性，我们暂且称她为简。她在当前公司工作已超过一年，期间受到一位男性同事（我们称他为约翰）的欢迎和指导。简认为约翰帮助她快速入职并跟上新角色的步伐。她非常感激约翰的帮助，但在最初的六个月后，事情变得明朗起来：约翰对她的看法已超出同事范畴。一旦她开始与一位工作外的男士约会（现在已是她的男友），简注意到约翰对她的态度发生了明显变化。起初约翰只是态度冷淡并回避她，但后来变得好斗，甚至公开敌对，以至于破坏了她最近的项目。她向管理层寻求指导，却被告知一定是她想多了，或者她只是伤了他的自尊心，不必担心。

    '
- fmt: '# When she reached out to me...


    When she reached out to me to confide in me what was happening, it wasn’t the
    first time I had heard or even experienced this myself. I’d been a single woman
    in technology and had to cautiously and strategically guide a male peer from having
    a personal interest in me. If the rejection was taken personally in the professional
    setting, it could escalate into an awkward situation for most managers to deal
    with (not counting how uncomfortable it is for the woman). As her mentor, I was
    able to advise her on how to positively address the situation in hopes it could
    be resolved.


    After her most recent technical review, it became apparent that he’d taken credit
    for her work, given credit to other people on her team, and that his sabotage
    of two projects had impacted her standing in her management’s eyes. I had already
    instructed her how to track and document what he was doing with a focus on resolution,
    not blame. As her manager wasn’t aware of how destructive the behavior was to
    her career and the company as a whole, I recommended she escalate to HR. As I’ve
    stated before, I recommend only going to HR if you have documentation and a clear
    goal of education over persecution. Many times, HR is restrained in how much help
    they can offer. Jane did a great job with HR, focusing on the loss in revenue
    and addition in resources/time required by his inappropriate behavior. The confrontations
    with HR were quite uncomfortable, but upon review, it was found that he had cost
    the company over $820K in lost revenue and HR made the decision to let him go
    for falsifying documents as part of processing and for harassment.


    During the meetings, Jane had let it slip that I was the one advising her on how
    to interact with John on how to resolve the situation. Post his termination, John
    proceeded to one of my blog sites, located a vulnerability (he was a `.Net Developer`),
    and hacked the site, bringing both my blogs down for 4 days. Although I have multiple
    backups of my blogs, the hack was focused on the images on my sites (as I have
    a lot of screenshots for instructional support with interfaces), and it demonstrates
    that behavior like John’s, where someone feels their destructive is warranted,
    almost cost me 8 years of technical content.


    You begin to realize the brevity of situation. The pettiness of John’s behavior
    because the world didn’t grant or doesn’t react the way he wanted it to is often
    difficult for most to comprehend. Although John did a great job of hacking my
    blog site because I didn’t know enough about PHP versions, he didn’t know enough
    to hide his tracks effectively and lucky for me, my host provider is pursuing
    the matter.


    I will also stress again that these types of individuals are not divided along
    gender, as it’s not just men who mistreat women in the workplace. Women can be
    biased against other women just as easily as men can be biased against women.
    Although I may not approve of those that fall into the adversarial group, we’ve
    already discussed why bias occurs and know only firm boundaries and policies will
    eliminate the cost they incur in productivity, revenue, and turnover for the business
    and in careers. It’s also important to support those that are impacted by this
    destructive behavior by offering them a supportive ear and options for how to
    productively deal with it. I can’t tell you how often just talking with me about
    an impacting situation has helped the women I’ve mentored over the years.


    I still receive many contacts per week from women searching out support, mentoring,
    and sponsorship, and I try to always be there for each and every one of them.
    I also am aware that the numbers have declined this last year. I also know why
    the decline has occurred, and much of it goes into a proof of concept that is
    continually a work in progress in the community that I’m now part of.


    ## It’s the Little Things


    I attended and spoke at my first regional Microsoft database event (SQL Saturday),
    back in Denver, 2012. As I entered the venue and looked around, I was dumbstruck
    by the ratio of women *vs.* men. I’d been speaking at Oracle events for 4 years
    previously, and I was accustomed to less than 10% women at any event I presented
    at. As I began to take inventory, I was able to quickly assess that there were
    40% women at the Microsoft event. I promptly asked the organizer in the speaker
    ready room, “Where’d you get all the women from?!?” I had just started to build
    Women in Technology (WIT) for two Oracle user groups (Rocky Mountain Oracle User
    Group, RMOUG and Oracle Developer Tools User Group, ODTUG). I was learning on
    my own and was intrigued when two speakers, Jen and Sean McCown (aka MidnightDBA
    on Twitter), offered me some insight of how the Microsoft PASS (Professional Association
    of SQL Server) group had built out their WIT community. Their decision in the
    community to have men as allies from the beginning, that the women were part of
    the community as technical professionals first, women second, and to have honest
    discussions as a way to resolve challenges resonated with me. I gathered all the
    information I could from this meeting and took it back to put to action.


    Although I did receive some push back in my more traditional, Oracle community,
    it was also welcomed by just as many and saw significant success by duplicating
    their efforts on a smaller scale. I was aware and understood the Oracle community
    was, on average, a decade older than the members of the Microsoft one. I recognized,
    while the women in the Oracle community were still dressing up for events and
    conferences, the Microsoft community had chosen to dress down, often showing up
    in more casual attire, offering less suggestive clothing than a stricter dress
    code might. The Microsoft events were free to the community, and time was donated
    by the speakers and volunteers, granting it the opportunity to push the volunteerism
    avenue and demanding more inclusiveness. Where the honest conversation that PASS
    had from the beginning resulted in the adoption of a code of conduct for all PASS
    and became common place among other conference events, they also possessed an
    800 harassment reporting number and diversity/inclusion sessions to promote education,
    something the Oracle community still lacks at a large majority of its events.
    As the PASS organization offers a very centralized management style for their
    regional user groups, they are more inclined to share and collaborate. They have
    a deeper, vested interest from the community, including when the community demands
    change. Nothing is perfect, but it’s a strong platform to drive change by its
    members.


    At any Microsoft event, I was more likely to be asked technical questions by fellow
    attendees, had technical conversations, and was more likely to be treated as a
    technologist. Where it was commonplace to be asked where my children were while
    I presented at an Oracle event, it rarely if ever happened at Microsoft ones.
    There was strong interaction on a technical level on social media, email, and
    at events, including open, less restrictive discussions on what changes would
    benefit the community. Men were often the ones to ask how the community and events
    could be more inclusive, and I noted that they were more likely to ask questions
    than to assume what would benefit diversity and inclusion.'
