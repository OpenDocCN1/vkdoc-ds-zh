- fmt: '# Confidence


    We hear how women are less confident than men, and it’s not surprising with how
    often we’re asked to second-guess our thinking and how little we’re asked to take
    on risks as we grow up. Take the time to teach yourself to take calculated risks.
    The more you overcome these risks, the more confident you’ll become in yourself.
    Dedicate yourself to making one solid contribution in every meeting. Take on a
    new project each quarter, and take on the one that no one else wants or the most
    challenging one. The effort will be worth it, and your confidence will be the
    icing on the cake. Learn to fail gracefully. As you will hear me say over and
    over, the only difference between those who succeed and those who fail is persistence.
    Learn how to “fake it till you make it.” Working with 95% men in my career, I
    was always in awe by how often guys would have 10% of the knowledge they required
    to perform a task but would act like they were experts. It’s not being scared
    to fail, it’s knowing you could fail, but the opportunity to learn and succeed
    is greater. It’s a valuable lesson women should learn from our male counterparts.
    They’re offered this from early on, and it’s incredibly beneficial in the business
    world.


    # Be Fearless


    To lead, people must want to follow. Women can’t fear the sound of their own voices.
    Learn to speak confidently and to speak well. Drop the “up-tick” that makes statements
    sound like questions. When speaking to a group while standing, take up space—place
    your feet at shoulder width, and don’t be afraid to use your hands while talking.
    Don’t try to make yourself “small,” as women have been culturally taught to do
    by crossing their legs. Learn to annunciate your words when you speak. Women,
    especially those attracted to varying technology, are more inclined to talk fast.
    To help the listener, learn to clearly annunciate your words to dispel miscommunication.


    Before entering a meeting or speaking in front of a group, always have key talking
    points researched and data clearly identified. Men have been raised to identify
    and debate details, which can be very frustrating for women, who have been taught
    to accept and translate details to make the speaker feel accepted. Be prepared
    to explain your point of view fully and also take advantage of the opportunity
    to ask the debater to take the discussion offline with you to allow you to achieve
    your original goal. Don’t let the individual take you “down the rabbit hole” into
    a side conversation that derails you.


    If you find your own perfectionism is impacting your ability to be more fearless,
    consider finding ways to address it. There is a saying, “Everything you want is
    on the other side of fear.” Fearing to be imperfect is often sourced from our
    fear of criticism. Women receive criticism from so many directions; it can be
    difficult to feel confident enough to throw it all to the wind and just take on
    what may seem impossible. This is where reaching out to a confidant, taking up
    meditation/yoga, or another outlet to soothe these fears comes into play.


    If discouraged by “your own demons,” in other words, your own negative thoughts
    or actions, consider keeping a record of these thoughts and actions in a journal.
    This will grant you the time to come up with an action plan of how to respond
    to them when they do happen and then put that action into motion. Start to jot
    down ways to counteract negative thoughts. An example would be


    *“I’ll never be able to speak in front of the share holders.”*


    Begin to list ways that you could improve your speaking skills. Join the local
    Toastmasters to find peers to help you improve and have a safe environment to
    hone your presentation skills.


    It will also give you the ability to track your progress, as well as the opportunities
    that are ongoing.


    # Sponsors and Mentors


    Both of these are even more important to those in the C-level. Social media platforms
    like `LinkedIn` and `Twitter` give you ready access to individuals that can make
    a huge difference in the success of your career. Reach out to them, no matter
    how scary that can be. Establish a strong, personal brand that aligns with your
    career and what you want to achieve. Ensure to have advocates who can not only
    offer guidance but will be there for you in times of trouble to offer support
    from the sidelines when you’re not around.


    Along with mentoring challenges, women at the leadership level also have difficulty
    with achieving the same in salary as their male counterparts.^([^(84)](#fn84))
    Unlike distinct technical positions, leadership roles can differ widely on range.
    There isn’t a clear salary expectation, and this is where your network is incredibly
    valuable. We need to be fearless about asking those around us what they make and
    also about for asking what we’re worth.


    While negotiating with my last position, the hiring representative asked me if
    I was “married” to my previous salary, as my new one would have a significant
    sales bonus as part of it. Without thinking, I responded, “I think if I didn’t
    stick to my guns on my salary, I’d be letting down women in technology everywhere.”
    There was a laugh on the other end of the phone, but no further questioning. They
    came back 2 weeks later matching my previous salary and adding on the 30% bonus
    raise. It was a split-second response on my part, but by already deciding I was
    sticking to my salary expectations, I was able to retain my expected salary increase
    from one position to the next. We are professionals, and we are as worthy of being
    paid for our time just as our male peers.'
