  trans: '

    ## 当机会来敲门


    在我撰写第一本由我主编的书籍时，我希望至少有一位女性合著者。当时，监控和自动化领域中有一些技艺超群的女性。我毫不犹豫地联系了其中几位，询问她们是否有兴趣撰写一个章节。寻找男性合著者毫无困难，也有几位主动提出撰写章节的人在该领域技术专长有限。而我联系并甚至邀请成为合著者的女性，对我的合作请求反应却截然不同。


    她们对自己的资质心存疑虑，对接受机会犹豫不决。我接触的两位女性都要求给她们时间，以确认自己能否满足书籍写作的要求。对于这两位女性，我等了几个月才收到回复，而到了那时，成为作者的机会早已消失。正如我们许多人已知的，这些女性希望确保自己具备
    110%的资格和可用性来完成她们签约的任务，最终却因犹豫不决，在确认自己是合适人选的过程中错失了良机。^(⁴³) 男性作者似乎没有这个难题。他们中许多人立即回复了我，而且我经常被告知我的反应像大多数男人——先答应，之后再应对挑战。我信任自己，能毫不迟疑地判断自己能否完成某事。


    在指导那些对降临的机会感兴趣的年轻女性时，我常告诉她们不要过度思考机会，直接答应就好。细节问题之后自然会解决。我们过于担心所有人和事，却把自己放在了最后。我的父母曾告诉我，他们必须把自己放在第一位。如果他们不这样做，就无法照顾我们这些孩子。小时候，我对此感到相当冒犯。难道不应该把我放在第一位吗？随着年龄增长，我领悟到了其中的智慧。如果照顾者不先照顾好自己，他们就会变得虚弱，无法为所照顾的人提供支持。这对我们所有人都是一个教训。


    此外，你能为孩子做的最好的事情莫过于树立一个好榜样。我们可以希望孩子“照你说的做”，而不是“照你做的做”，但孩子们都非常善于观察。你的所作所为和生活方式会对我们的孩子产生巨大的影响。当我最小的孩子乔什和我一起参加“带孩子上班日”时，他第一次来大约是
    6 岁。乔什和我长得不太像，他金发碧眼，但精力水平绝对像我。工作人员把他和其他孩子分开，让他们和负责引导孩子们度过一天的人一起做项目。他们最终让他安分下来，把他放到一把办公椅上，他快速转着椅子，并让他画出自己心目中
    IT 人士的样子。虽然我儿子父母双方都是技术人员，但他画了一个女人。商业智能经理看着画说：“我知道你妈妈是谁！”尽管他的父母都是技术人员，但他看到的是我经常在用电脑工作，我成了
    IT 人员的代表。通过树立榜样、拥有强烈的职业道德和为生活中的一切设定优先级，我塑造了女性在科技领域的形象。


    ## 矛盾的信息


    那么，为什么机会敲门时，男性比女性更少犹豫？男性（以及受更多男性影响的女性）被教导要敢于冒险，少关注细节。他们被教育说，如果机会敲门时不接受，别人肯定会接手。他们被教导要更多地相信自己，而不是前方的挑战。正如我们之前讨论的，男孩更倾向于用冒犯性言语交流并相互挑战。因此，不难理解为什么男孩比女孩更早开始相信自己的能力。当他们成年后，男性收到的矛盾信息更少，而且说实话——他们一开始会在意这些信息吗？可能性小得多。


    让我们聚焦于女性收到的矛盾信息数量。女性从很早就开始听到这些信息，远多于男性。从穿什么、吃什么，到和谁交朋友、和谁约会。直到我观察到给我的女儿和儿子们传递的信息差异时，我才意识到问题有多严重。亲戚们似乎只关心我儿子的恋爱情况。如果他们对某人有好感，亲戚们似乎就只在意这个，然后就不再过问。而我的女儿则不同：她应该化妆，应该比现在更瘦；但当她化了妆，又说化得太浓了；她太瘦了需要增重，这样才能吸引男孩。在她青春期前，他们希望她穿裙子；可当她开始成熟并更喜欢穿裙子时，他们又告诫她不要穿得太性感。他们总是密切关注某个时刻她露出了多少皮肤。他们一会儿想要她永远是他们的“小女孩”，下一刻又谈起“在她这个年纪”，我婆婆已经生下了我丈夫。她刚毕业，就被祖母的评论吓到了：说她班上所有女孩都穿得很暴露，她需要多遮住一些；可接着又评论街上一个穿着和她同款裙子的年轻女子多么吸引人。就像家庭聚餐一样，她回到家时既焦虑又沮丧，因为我在养育她的方式和家人那套她无法满足的期望之间存在着天壤之别。


    由于偏见通常是习得的，我也记得当我给女儿剪了个短短的波波头时，我前夫有多么生气。他生硬地告诉我，他想能给她梳头，扎马尾辫和编辫子。我提醒他，她的头发又细又直，每天早上都会缠成一个巨大的结，而每天早上听着她哭喊梳理的人也不是他。他坚持说他想要一个孩子是为了实现这个做父亲的幻想。我告诉他，我们最小的儿子乔什有一头可爱的金色卷发，我们可以为了这个目的把他的头发留长。从那以后，我很少再听到他抱怨，但这提醒了我们，在日常琐事中，我们与传统的联系以及对性别认同的执着是多么紧密。

    '
- fmt: '# Too Direct for Direction


    My direct communication style has served me as well as it’s caused me difficulties.
    Research discusses the benefits that could be had if women were more direct,^([^(44)](#fn44))
    but as I was more likely to interact with men as a child and didn’t have many
    girls for friends growing up, I am more direct and possess a masculine communication
    style. I can tell you it’s not so and the research proves this.^([^(45)](#fn45))
    I have experienced managers who’ve gone to HR, complaining that I’m too aggressive,
    and luckily, I’ve had HR representatives that have corrected them and said, “No,
    she’s not aggressive, she’s assertive and that’s not her problem, but yours.”


    Some managers will quickly face their bias, as it often is unconscious, and move
    forward to have a productive professional relationship with me as their employee.
    As I’m forthcoming with feedback (some would say assertive about feedback), I’ve
    been known to grow a manager in ways most employees won’t offer. I always try
    to be constructive and sensitive to a manager’s needs from me. Many times, it
    will only become apparent to me after a couple of conversations that they’re uncomfortable
    with my direct communication style, and I then need to adjust to help them acclimate
    to it. It’s only gracious to try to meet in the middle somewhere. It’s not about
    being less me but to keep my eye on the goal and try to achieve the most productivity
    I can.


    As people rarely leave companies, but commonly leave managers, I’ve been asked
    by those I’ve mentored what is the single most common red flag I’ve noticed that
    has been an indicator of a manager that I won’t be able to succeed with. When
    a manager says to me, “You hurt my feelings” or “My feelings were hurt,” this
    is the red flag that makes me cringe. I know upon hearing this that I’m in troubled
    waters. If a peer says this, you can often work around them and hopefully come
    to an understanding. You’re on equal ground, and it might be a nuisance, but you
    hopefully will make it work. When it’s a manager, then it has the real makings
    of a serious problem:


    1. This is a statement that a male manager or peer won’t say to another man.

    2. The response stems from an inability for the manager or peer to view you in
    the same light as a male in the same role.

    3. They are interacting with women as they interact with their mother or romantic
    partner, responding only with emotion and most likely had few female friends that
    they weren’t connected to romantically.

    4. It will be difficult to resolve disagreements or fulfill your potential with
    a manager that only sees you in a limited light.


    I’ve experienced this red flag on multiple occasions, and every woman I’ve mentored
    or experienced this described it as one of the most difficult management situations
    they’ve gone through.


    ## Failed Launch


    I was always attracted to technology, but as I was a child of the 1970s, there
    wasn’t the opportunity or the technology we have today to call it that. I lived
    for my Legos and tended to take apart and re-assemble small electronics. No one
    saw it as a future career at that time, and we were just getting into the “blue
    and pink aisles” of the 1980s, so my parents weren’t set on getting me girl’s
    toys, but I also didn’t get chemistry sets or the first computers available. I
    was a loner by nature, and once I received a small, electronic Spelling Bee with
    a monochrome calculator display, I was happy for hours, upon hours playing with
    it.


    Due to my loner status, I was rarely part of a group, so I had to take opportunities
    when they came, as others were more likely to choose their friends. These experiences
    lead me to trust myself more, and many teased me, stating that I would fail at
    whatever I was doing. I worked twice as hard to prove everyone wrong.


    ## Misdirection


    My experience with my own communication style is an excellent reminder of the
    mixed messages we send women in a quest to be more direct. The men I married were
    often thrilled that I “wasn’t like other women.” I spoke in a direct manner and
    was clear about my needs. It wasn’t until after my second divorce that I noticed
    something interesting. My children’s father had repeatedly stated that I had left
    him unexpectedly and that he was unprepared. After hearing this, I asked him if
    he remembered the weekly discussions where I sat him down and explained the frustrations
    I was experiencing. I would calmly state how I needed things to change in our
    marriage, as I was close to filing for divorce. He remembered the talks but didn’t
    seem to correlate it with my ending the relationship. Upon my last divorce, I
    heard very similar comments by my other ex-husband. When asked about why my consistent
    discussions with him about my frustrations and dissatisfaction hadn’t made him
    realize I wasn’t getting what I needed to continue our marriage, he disclosed
    that he hadn’t felt a need to take the discussions seriously. Like my ex-husband
    before him, because I was calm and direct, he’d underestimated my level of dissatisfaction
    and frustration. As much as we read articles on men desiring a woman who is direct
    and says what she means, in my own experience, I found that bias required me to
    be emotionally charged and hysterical, otherwise I wasn’t taken seriously.


    This goes back to a lack of trust, too. Although I was quite clear about my intentions
    to divorce if some type of compromise couldn’t be put in place, both ex-husbands
    claimed they thought I wasn’t seriously considering divorce due to my calm demeanor.


    The next time you hear that a woman just reacted without any discussion on her
    part, ask her if she’s spoken to anyone about the problem. We tend to assume that
    women overreact when they’re upset and then under estimate their statements when
    they are calm like society requests of them.


    You may discover that there’s evidence that she was very clear, and I ask that
    if she states that she did speak up, BELIEVE HER. Nothing calls out to us that
    there’s no reason to speak up than to be second guessed. We need to learn to listen
    to the words that women use. The more often we’re dealing with women in male-dominated
    fields or have more masculine communication styles, the more likely that they
    won’t fall into traditionally feminine expected behavior when in discussions,
    so it is essential to leave stereotypes outside the workplace as much as possible.'
