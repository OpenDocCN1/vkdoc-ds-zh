    them for ideas, or view women at leadership levels, we’re also less likely to
    consider them when considering who would be a good mentor.


    Similar situations were experienced by those in my network that resonated with
    my own experiences. There were numerous times where I wasn’t credited as someone’s
    mentor, even after years of formal mentoring. These same individuals were more
    likely to identify my spouse as their mentor, even if he had very limited contact
    with them, almost as if having me as a mentor meant that Tim and I came as a package,
    crediting one was no different than crediting the other. Why did this situation
    continue to occur? For many, when introducing themselves and discussing their
    technical history with someone they were hoping to make an impression on, having
    an older male as a mentor had more prestige in their view than the woman who’d
    actually mentored them. Again, this isn’t any different from the occurrence of
    a woman not being given credit for ideas she’s had or work she’s performed. It
    continues the invisibility of women not recognized for their contributions and
    capabilities.


    As you reach out and accept mentoring, ensure to give credit where credit is due.
    Squash the unconscious bias we have that what women do is volunteered versus when
    men do the same, it must be recognized and credited. Paying this forward will
    hopefully return to you once you’re successful and sought out as a mentor to others.'
  trans: '

    # 寻找我的导师


    找到卓有成效的导师来帮助你继续走向成功可能是一项挑战。^(⁹²) 首先要做的是将寻找导师的过程**正式化**。当我丈夫最初听到我称他为我的第一位导师时，他很惊讶，因为我们从未进行过正式的谈话，我去找他并要求他指导我。导师制是指有人帮助指导你的职业生涯并提供建议，而最好的导师还会为你提供机会上的支持。总会有人自然而然地伸出援手，想要帮助周围的人做得更好。这些人就是天生的导师，应该因其作为导师的贡献而被认可。他们凭借这样一个简单的事实赢得这个头衔：即使没有正式请求，他们也会进行指导（图
    5-1）。


    ![../images/469679_1_En_5_Chapter/469679_1_En_5_Fig1_HTML.jpg](img/469679_1_En_5_Fig1_HTML.jpg)


    图 5-1


    在请求导师/支持者方面缺乏信心，毕马威


    我曾正式指导过数十位男性和女性，但我有更多的指导关系是在我们之间没有正式协议的情况下进行的。从未有过正式的讨论，个人问我是否愿意指导他们，或者我同意指导。这种情况只是在我们交谈中自然发展，最终结果是双方都获得了成长。直到后来在讨论、社交媒体或书面交流中，当他们以这个头衔来称呼我时，我才意识到自己是他们的导师。


    尽管并非有意，但大多数支持者和导师会倾向于那些让他们想起自己的人。^(⁹³) 由于这些人中绝大多数是白人男性，这让我们处于不利地位^(⁹⁴)——你需要期望自己拥有不止一位导师，并且因为你是女性，可能需要一个群体来提升你职业生涯的成功率，这比你的男性同行更需要。


    尽管我很幸运有出色的导师，但我发现不同性别的导师能提供给我的东西存在明显差异。男性能够提供更多机会，而女性则能帮助我增强能力，并教会我如何获得更多职业满足感。与男性相比，这些女性更倾向于支持我的决定和我所走的道路（请记住，我今年五十多岁，比许多会阅读这本书的读者年长一代）。当我讨论自己想要实现的目标时，女性导师会仔细倾听。我自然而然地与那些不太可能评判我或被我雄心壮志吓到的女性产生共鸣。


    关于这个话题——请记住我们对女性雄心的不适感，这可能会影响导师关系。拥有那些不受此影响或能够克服这一点的导师至关重要，这很重要。有一些明显的迹象可以让你知道导师关系是否不合适，但寻找导师的女性也必须相信自己的直觉，来判断是否匹配不当。


    寻找导师可以从专业团体和会员组织开始。虽然在当前工作场所寻找导师看起来很吸引人，但如果指导进展不如预期，可能会造成尴尬的局面。^(⁹⁵) 如果导师无法兑现承诺，或者将失败归咎于个人，这可能会增加复杂性。由于可能出现这些问题，我建议在工作场所之外寻找指导。


    # 制定计划


    计划以拥有多样化的导师为目标——那些可能在个人生活、职业发展以及人脉拓展方面指导你的人，尽管我强调了寻找女性导师，但也不要回避两种性别的导师。男女导师的主要区别在于，男性最有可能与你分享**他们**是如何取得现有成就的。可能会要求一套严格的步骤和目标。对女性而言，最成功的指导情况是帮助引导她们了解自己想要实现什么，并帮助她们制定实现这一目标的步骤。一位好的导师不会回避艰难的决定，也不会回避要求个人反思可能阻碍自己的因素。这一切都应该在开放和支持性的对话中完成。包含前进选项的建设性反馈也应该是目标的一部分。


    导师的反馈应尽可能包括前进的选项。这并不是说导师会拥有所有答案，但他们应该对讨论持开放态度，以帮助你找到你独自可能无法发现的克服困难的机会。


    当你处理自己的挑战和目标清单时，也要单独列出那些你面临更大困难的挑战。把它们视为正在进行的工作，并归入第三类。我们都不是完美的，很多时候，接受弱点并寻找变通方法，是持续成长且不被一个挑战困住的最佳途径。


    # 女性导师——你在哪里？


    当你在寻找导师时，尤其是在技术领域，你可能会很难找到女性导师。也许我们需要改变看待导师的方式。正如我们不太可能考虑女性晋升、认可她们的想法，或视女性为领导层一样，我们在考虑谁会是好导师时，也不太可能考虑她们。


    我人脉圈中那些与我有相似经历的人也经历了类似的情况。有无数次，即使经过多年的正式指导，我也没有被认可为某人的导师。同一个人更可能将我的配偶视为他们的导师，即使我与他们的接触非常有限，几乎就好像有我作为导师意味着蒂姆和我是捆绑在一起的，认可一个人与认可另一个人没有区别。为什么这种情况会持续发生？对许多人来说，当他们介绍自己并向他们希望留下印象的人讨论自己的技术背景时，拥有一位年长男性作为导师在他们看来比那位实际指导过他们的女性更有威望。同样，这与女性提出想法或完成工作却不被认可的情况并无不同。它继续使女性因贡献和能力而被忽视的情况持续存在。


    当您寻求并接受指导时，请确保给予应有的认可。消除那种无意识的偏见，即认为女性所做的是自愿行为，而男性做同样的事情则必须被认可和赞誉。将这种认可传递下去，希望当你成功并成为他人寻求的导师时，它最终会回馈给你。

    '
- fmt: '# Sponsor Me


    The next tier above mentoring is sponsorship. To sponsor someone is to introduce,
    network, and recommend an individual for opportunities. Research has shown that
    women are three times less likely to receive sponsorship than their male peers.^([^(96)](#fn96))
    As your sponsor will most likely be someone much higher up, maybe even in the
    C-level who will advocate for you and your promotions, it’s important to choose
    wisely. This is an essential part of your growth, as women with sponsors are more
    likely to be considered for stretch assignments that would be out of reach without
    the advocacy of their mentor. Once you’ve created a strong record of achievement
    in your career and have the beginning benefits of a mentor, it should be time
    to consider sponsorship. This could be with your mentor or it could be with a
    separate individual. With women being less visible due to bias, this shouldn’t
    be a surprising statistic. It’s not that women aren’t trying, they just are less
    often recalled when a list is formed to make recommendations resulting in sponsorship.


    An article recently discussed how one of the reasons women were sponsored less
    than men was that there was a bias against women, often by the women themselves,
    around sponsorship.^([^(97)](#fn97)) When they were offered sponsorship, a high
    percentage of women viewed it as “cheating.” This was a profound concept, and
    I realized that I fell into this category. I’ve always been one to attempt to
    do everything on my own, often the hard way. Even when others have offered to
    assist me or sponsor me. It took me considerable time to learn to accept sponsorship
    and not view it as an easy way to an end goal. As I pondered the complexity of
    my view on receiving sponsorship in my own career, it was easy to see why I felt
    this way. How often are successful women insulted by someone, crediting her success
    to someone else—a mentor or male team member, even when they may have performed
    little or none of the work? How often when discussing an attractive, successful,
    young woman are there whispers of “she slept her way to the top”, even now?


    This type of cultural bias is going to create anxiety in most any woman and drive
    her to do everything, anything on her own, and I strongly resonated with the discussion
    that sponsorship could be viewed as cheating. I strongly understood why women
    would avoid it and miss out on opportunities to advance in a more efficient manner.
    You must be stronger than this fear and realize by not taking advantage of sponsorship,
    it will impact your growth and your ability to advance as fast as your male peers.


    Recently, a female peer was lamenting about the lack of women sponsoring women.
    Although I’m aware that I’m one of the few doing significant sponsorship of those
    around me, I also know the difficulty surrounding it. The “token woman” situation
    results in a woman sponsoring another woman and losing her place because society
    replaces women instead of adding women as we promote. It’s the repeat problem
    of viewing only so many seats at the table for women, and if one rises, the others
    often fall instead of rising up, too. The second challenge is that there is so
    much pressure on women in the workplace already and so few women in technology
    and senior management, that having men sponsor women is, in my opinion, the key
    to making the sponsorship of women self-sustaining.


    # The Next Step


    Once we’ve moved beyond the need for sponsorship and the complexities around it,
    the next focus is how to gain sponsors by becoming more visible. As we’ve discussed
    in previous chapters, it’s essential that women find ways to network in safe and
    productive ways. Social media is still one of the best ways if you’re not speaking
    or presenting at events. Online forums, Twitter, and LinkedIn/LinkedIn Groups
    and Meetups are some of the best ways to make yourself more visible and to build
    your network.


    Twitter is a highly social network, but as vast as the platform covers, there
    are small groups that form involving interests, business, and specialty or focus.
    Follower count doesn’t equal success of the platform, either. Understanding how
    to connect with those who are providing great content and can connect you with
    others in your industry is key. Learn what hashtags (`#`) are connected to your
    industry and interests. Using them can make a difference in connecting with the
    right people. Once you follow the right people, interacting with them and sharing
    information may lead you to the right mentor or sponsor.


    As I recommend in a previous chapter, LinkedIn provides a safer social media platform
    to network through. Take the time after any meeting to connect with everyone in
    the meeting on LinkedIn. Consider joining LinkedIn groups that specialize in your
    field or specialty. Post insight, share what you’ve accomplished, and respond
    to posts of those you consider potential mentors or sponsors.


    Meetup is another platform that has a wide area coverage. Starting an account
    is easy on `meetup.com` as is searching for groups that are in your area of interest.
    All required is to type the topic in the search bar of the application and click
    the search button. Meetups often occur after work or on the weekends and provide
    a membership, as well as events with potential mentors and sponsors in attendance.
    A quick introduction, with a follow-up connection on LinkedIn, is a great way
    to make an impression with someone from one of these events.


    The format allows you to build out a professional brand that represents your skills
    and be authenticate. The biggest hurdle is swallowing your fear and beginning
    to respond or post. Take the time to think through your responses/posts, and don’t
    be afraid to ask questions. Potential sponsors are always on the look out for
    those individuals that are good at their jobs, are open to learning, and have
    a voice. Don’t be afraid to use yours.


    Although there is some overlap in sponsors and mentors, you’ll begin to recognize
    the difference as a sponsor will reach out to you and let you know they have an
    opportunity for you. It may be in the form of a job, a chance to contribute to
    something unique in your field of expertise, or a chance to do more with your
    career. Mentoring tells you where the doors are, and when there’s a knock, sponsorship
    opens doors for you.


    A sponsor is well connected, and, in my case, I became a sponsor after being recommended
    for too many opportunities. It was in everyone’s best interest to recommend someone
    else for the opportunity that was available than to say no. This helped guarantee
    that opportunities continued to be made available to me (removing more of the
    invisibility problem that women have). As some may be hesitant to share their
    opportunities with others, this is a great way to get potential sponsors to sponsor
    others. I recommend, as your own opportunities start to build, begin to sponsor
    those that have potential. It’s always about paying it forward, and you will,
    sooner or later, find that it pays back to you if you do.


    Opportunities that you may want to consider depends on your path. If you’re looking
    to advance in your career, a sponsorship to meet someone who works at your dream
    job or company may be important to you. If you are looking to write, consider
    writing a blog, which can then turn into articles, and consider reviewing a book
    before taking on writing a chapter on a book or two.


    Sponsorship can come in a nontraditional form, too—someone could be looking to
    work a more flexible schedule and knowing you are, too, may find an opportunity
    to share a full-time role. Sponsorship sometimes requires looking outside the
    box and building out opportunities that may not be present in more traditional
    ideas of what success looks like.'
