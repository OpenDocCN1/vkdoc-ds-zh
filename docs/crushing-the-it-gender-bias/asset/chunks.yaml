- fmt: '# Schooling


    Society still looks to women to be the main caregivers.^([^(79)](#fn79)) As my
    ex-husband, when at school with one of the kids, would be asked when I could come
    in, as if he was a lesser substitute. It could be very frustrating for him, and
    I understand why he gave up at times. Mothers and fathers must make it clear that
    both parents are responsible for the child’s upbringing to the society around
    them, and if they both work, only one may attend a school function or other responsibility.
    Our school system still has a challenge with dual income and single parent families,
    and from what I’ve experienced, most still do.


    In recent years, there’s been a change in school schedules, too. Some schools
    have now added a fall break to the previous spring break, while some schools go
    all year with extended breaks throughout the year. With breaks stagnated between
    school districts, it can be heavily impactful to a working parent’s career and
    considering the parent with the higher expectation to accommodate the schedule
    shift, more likely a woman’s. This added pressure and with changes in the younger
    generation regarding parental responsibility results in both parents experiencing
    a possible impact to their career goals.


    I’ve had school administrator’s chide me for not taking my responsibility to my
    children serious enough because I worked. Another one informed my ex-husband that
    I was going to have to quit my job and start to come to school with one of my
    children, even after she was told I was the larger source of family income. My
    ex-husband was furious with her and joked, “Do you have any idea how much child
    support I’d have to pay if she did that??”


    There are charter and online schools that are more understanding of parents limited
    time and either limit homework to school hours or offer after-school programs
    to ensure that kids make the most of their time there, so they can spend quality
    time with their parents at the end of the day.


    There is a silver lining though. Younger generations, especially men who had working
    mothers, are more likely to be supportive of their own wive’s careers.^([^(80)](#fn80))
    They are more involved in their children’s lives and are less restricted in their
    role of just being the provider. We’re seeing diversity and inclusion initiatives
    in companies that are making salaries transparent so the complex situation of
    gender pay gap can be addressed.


    In [a study](http://econgrads.berkeley.edu/emilianohuet-vaughn/files/2012/11/JMP_e.pdf)
    conducted through [Amazon’s Mechanical Turk platform](https://www.mturk.com/mturk/welcome)
    (an online platform for small-scale tasks), they included 2000 participants and
    asked them to complete two rounds of data entry where they were paid for each
    correct entry. The study demonstrated the difference in work performance between
    the first round, where a group of participants were shown their own earnings and
    a second group test who were shown not just their earnings, but also the earnings
    of the other participants.


    The second group test, armed with salary information, “worked harder and significantly
    increased their performance.” What’s more, he continues, high performers in the
    first round who learned of their earnings worked harder to maintain or exceed
    their level of performance in the second round.^([^(81)](#fn81))


    Companies like SumAll (a social media managing company), WholeFoods (now owned
    by Amazon), and GrantTree (a London-based startup for lending) are all part of
    the new trend of salary transparency. One of my favorite social media tools, Buffer,
    a social media content management tool, has complete salary transparency—from
    its CEO down to its latest hire. The company is so sold on the transparent salary
    model; they’ve added a salary formula calculator that can set up everyone’s salary,
    for any business.


    All of these changes add up little by little to make a difference in women’s success
    in the workplace and, in doing so, in technology. This results in an easier time
    finding your own path as you decide if you want to be a technical marvel a technical
    specialist with a flexible schedule, on your way to the C-level, or as the owner
    of your own business.


    ## Setting The Mark


    There are going to be those women in technology that want more than just to be
    an employee in an IT environment. Their ambition says, “You will be more.” They’ve
    already pinpointed a C-level position or have sights set on starting their own
    company.


    Even though the world is still evolving and we’re working to increasing the number
    of women in technology, the C-level is still having a trying time. There are more
    CEOs with the name David than there are women in Fortune 500 companies.^([^(82)](#fn82))
    It’s not different for Fortune 100 companies, either, so it’s not just when women
    are “playing with the big boys.” Viewing comparisons that there are fewer women
    in a role than men with a single name can be a very sobering statistic.^([^(83)](#fn83))
    Women are still lagging significantly in leadership roles in companies, and although
    diversity and inclusion is the new buzzword around most offices, as we’ve discussed
    in the book already, it may not signify change at the upper levels in many companies.


    I’ve been lucky enough to bend an ear or two of male CEOs, and I’m interested
    in how little they understand the challenges that prevent women from achieving
    what they have come by, in my observations, so easily. The underlying challenge
    that deters women from achieving the C-level is it diminishes their ability to
    achieve life-long dreams and ambitions.


    As I’ve spent my career avoiding the corner office and happily walked toward the
    server room, I wanted to understand the unique challenges these women were facing
    and how I could help them when approached with these questions. I couldn’t be
    an effective mentor unless I immersed myself in the data, and there were some
    clear similarities, as well as some distinct differences.


    ### Becoming Visible


    As with women in tech, women heading toward leadership and C-level positions have
    difficulty being recognized and heard. Women won’t be offered opportunities their
    male counterparts will if they aren’t heard when they speak up in meetings and
    in projects. If their name doesn’t come up with considering who might be a good
    fit for a promotion, they can be looked over, too. Attaining sponsorship from
    senior management to get their names out there and recognize their contributions
    was essential. This is just as important for women in technology, but it was even
    more so when moving up the ladder.


    ### Networking


    One of the women I mentored, Komal Goyal, has done an incredible job building
    her network. As a senior partner, she’s also asked women leaders to support each
    other by ensuring when they can’t take an opportunity or need to recommend someone
    else, to recommend another woman FIRST. As we just discussed, women are often
    invisible, so to make a planned effort to direct success to other women first
    can make an incredible difference. This may appear to be special treatment, but
    how many of you have heard of the “ol’ boys club”? It’s key to leveling the playing
    field until women get to a point they don’t have to anymore.


    ### Focus


    If you speak to any CEO, they know their business, and they know how to drive
    revenue. They keep their “eye on the ball.” This is crucial for women who are
    driving toward these positions, too. Find out what is important to the company—goals,
    both short and long term. Find out how you can help the company achieve those
    goals, and you will become more visible to senior management and be more likely
    to achieve your own goals. Find ways to even make your activities outside of work
    pay forward to your end goal. Any time you can achieve more than one goal with
    a task is a win.'
