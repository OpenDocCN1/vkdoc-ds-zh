    for my Legos and tended to take apart and re-assemble small electronics. No one
    saw it as a future career at that time, and we were just getting into the “blue
    and pink aisles” of the 1980s, so my parents weren’t set on getting me girl’s
    toys, but I also didn’t get chemistry sets or the first computers available. I
    was a loner by nature, and once I received a small, electronic Spelling Bee with
    a monochrome calculator display, I was happy for hours, upon hours playing with
    it.


    Due to my loner status, I was rarely part of a group, so I had to take opportunities
    when they came, as others were more likely to choose their friends. These experiences
    lead me to trust myself more, and many teased me, stating that I would fail at
    whatever I was doing. I worked twice as hard to prove everyone wrong.


    ## Misdirection


    My experience with my own communication style is an excellent reminder of the
    mixed messages we send women in a quest to be more direct. The men I married were
    often thrilled that I “wasn’t like other women.” I spoke in a direct manner and
    was clear about my needs. It wasn’t until after my second divorce that I noticed
    something interesting. My children’s father had repeatedly stated that I had left
    him unexpectedly and that he was unprepared. After hearing this, I asked him if
    he remembered the weekly discussions where I sat him down and explained the frustrations
    I was experiencing. I would calmly state how I needed things to change in our
    marriage, as I was close to filing for divorce. He remembered the talks but didn’t
    seem to correlate it with my ending the relationship. Upon my last divorce, I
    heard very similar comments by my other ex-husband. When asked about why my consistent
    discussions with him about my frustrations and dissatisfaction hadn’t made him
    realize I wasn’t getting what I needed to continue our marriage, he disclosed
    that he hadn’t felt a need to take the discussions seriously. Like my ex-husband
    before him, because I was calm and direct, he’d underestimated my level of dissatisfaction
    and frustration. As much as we read articles on men desiring a woman who is direct
    and says what she means, in my own experience, I found that bias required me to
    be emotionally charged and hysterical, otherwise I wasn’t taken seriously.


    This goes back to a lack of trust, too. Although I was quite clear about my intentions
    to divorce if some type of compromise couldn’t be put in place, both ex-husbands
    claimed they thought I wasn’t seriously considering divorce due to my calm demeanor.


    The next time you hear that a woman just reacted without any discussion on her
    part, ask her if she’s spoken to anyone about the problem. We tend to assume that
    women overreact when they’re upset and then under estimate their statements when
    they are calm like society requests of them.


    You may discover that there’s evidence that she was very clear, and I ask that
    if she states that she did speak up, BELIEVE HER. Nothing calls out to us that
    there’s no reason to speak up than to be second guessed. We need to learn to listen
    to the words that women use. The more often we’re dealing with women in male-dominated
    fields or have more masculine communication styles, the more likely that they
    won’t fall into traditionally feminine expected behavior when in discussions,
    so it is essential to leave stereotypes outside the workplace as much as possible.'
  trans: '

    # 过于直接的方向


    我的直接沟通风格既让我受益，也给我带来了困难。研究探讨了女性如果更直接可能带来的好处，^(⁴⁴)但由于我在童年时期更常与男性互动，成长过程中女性朋友也不多，我因此变得更为直接，并拥有一种男性化的沟通风格。我可以告诉你事实并非如此，而且研究也证明了这一点。^(⁴⁵)我曾遇到过一些经理，他们向人力资源部投诉，说我过于咄咄逼人；幸运的是，人力资源代表纠正了他们，并说道：“不，她不是咄咄逼人，她是坚定自信，这不是她的问题，而是你的问题。”


    有些经理会很快面对自己的偏见（这通常是无意识的），并继续与我这位员工建立富有成效的职业关系。因为我乐于提供反馈（有人会说是对反馈很坚定），所以我知道自己能在大多数员工不愿尝试的方面帮助经理成长。我总是努力做到建设性，并体察经理对我的需求。很多时候，要经过几次交谈我才会意识到，他们对我的直接沟通风格感到不适，然后我需要调整，帮助他们适应这种风格。在中间地带寻求妥协才是一种得体的方式。这并不是要削弱自我，而是让我专注于目标，并尽可能实现最高的工作效率。


    员工很少是因为离开公司，而通常是因为离开经理。那些我曾指导过的人问我，在我注意到的最常见、最能预示我无法与某个经理成功合作的红旗信号是什么。当经理对我说“你伤害了我的感情”或“我的感情受到了伤害”时，这就是让我不寒而栗的红旗信号。听到这句话，我就知道陷入了困境。如果同事这么说，你通常可以绕开他们，并希望能达成理解。你们处于平等地位，这可能会很麻烦，但你有可能设法解决。但当对方是经理时，这就真正构成了严重问题的隐患：


    1. 这句话是男性经理或同事不会对另一个男人说的。

    2. 这种反应源于经理或同事无法用看待同岗位男性的眼光来看待你。

    3. 他们与女性互动的方式，就像与母亲或浪漫伴侣互动一样，仅仅基于情感回应，而且很可能除了浪漫关系外，几乎没有女性朋友。

    4. 与一个只用狭隘眼光看待你的经理相处，将很难解决分歧或发挥你的潜力。


    我曾多次遇到这种红旗信号，而我指导过的每一位经历过此事的女性，都将其描述为自己经历过的最困难的管理处境之一。


    ## 失败的起步


    我一直对科技很着迷，但作为上世纪 70 年代出生的孩子，那时没有如今这样的机会或科技来称之为“科技”。我痴迷于乐高积木，还喜欢拆解并重新组装小型电子产品。当时没人把这看作未来的职业，而我们也正步入
    20 世纪 80 年代那种“蓝色和粉色分道”的年代，所以我的父母并非刻意给我买女孩玩具，但我同样也没得到化学套装或最早的电脑。我天性孤僻，自从得到一台带单色计算器显示的小型电子拼字游戏机后，我便能开心地一连玩上好几个小时。


    因为我的独处状态，我很少加入群体，所以当机会来临时，我必须抓住它，而其他人则更倾向于选择自己的朋友。这些经历让我更相信自己，也有很多人取笑我，说我无论做什么都会失败。我加倍努力，向所有人证明他们是错的。


    ## 误导


    我个人在沟通风格上的经历，很好地提醒了我们，在追求更直接的表达时，向女性传递的往往是混杂的信息。我嫁过的那些男人常常很高兴，说我“不像其他女人”。我说话直接，对自己的需求也很明确。直到第二次离婚后，我才注意到一些有趣的事情。我孩子的父亲反复声称我出乎意料地离开了他，让他毫无准备。听到这些后，我问他是否还记得那些周复一周的谈话——我让他坐下来，向他解释我感受到的沮丧。我会平静地陈述，我需要我们的婚姻做出改变，因为我已接近要提出离婚的程度了。他记得那些谈话，但似乎并没有把这些话与我结束婚姻联系起来。在我最后一次离婚时，我从另一位前夫那里听到了非常相似的评论。当被问及为什么我与他就我的沮丧和不满进行的持续讨论，没有让他意识到我无法从婚姻中得到继续维持所需的东西时，他坦言他觉得没必要认真对待这些讨论。就像我之前的那个前夫一样，因为我冷静而直接，他低估了我的不满和沮丧程度。尽管我们读到很多文章都说男性渴望一个直接、言出必行的女性，但根据我自己的经验，我发现偏见要求我情绪激动、歇斯底里，否则就不会被认真对待。


    这同样也回到了信任缺失的问题上。尽管我非常清楚地表明，如果无法达成某种妥协，我就会离婚，但两位前夫都声称，由于我平静的态度，他们认为我并未认真考虑离婚。


    下次你听到某个女性在没有任何讨论的情况下就做出反应时，问问她是否曾与任何人谈及这个问题。我们往往倾向于认为，女性在情绪低落时会反应过度，而当她们像社会要求的那样保持冷静时，我们又低估了她们所说的话。


    你可能会发现，有证据表明她表达得非常清楚，我恳请如果她声明自己确实说过，那么请相信她。没有什么比被怀疑更能让我们觉得没有必要发声了。我们需要学会倾听女性使用的词语。我们越多地与身处男性主导领域或拥有更男性化沟通风格的女性打交道，她们在讨论中就越不可能落入传统上预期的女性行为模式，因此，尽可能将刻板印象留在工作场所之外至关重要。

    '
- fmt: '## Happy, Shiny People


    Over 98% of Women in Tech panels that I seek are populated with women who seem
    to have it all. Creating a WIT panel should be a logical process, but often, they
    leave the attendees to sit in front of representatives whose achievements seem
    unattainable or the audience feels like failures upon the end of the event. A
    panel should inspire but also resonate with the attendees. The panel must also
    be relatable, so if the panel seems unauthentic, this can cause the session to
    just as easily fail. Sheryl Sandburg, as relatable as she was in her book, *Lean
    In*, still received incredible amounts of criticism.^([^(46)](#fn46)) We’ve been
    discussing how incredibly critical of women we can be. Someone will question why
    a woman has chosen to work, if they stay home, if they lean in, or if they stand
    back. For Sheryl, there was so little representation at that tier in management
    that for those who didn’t have dreams of a C-level position (`CEO`, `COO`, `CIO`,
    etc.), she was still a woman they wouldn’t relate to.


    Every WIT panel I’ve designed I’ve attempted to have one C-level, but I would
    include myself as a woman who had a distinct technical career path. Then, I’d
    try to also have someone mid-level in their career, someone who was just starting
    to grow, and then one man. As I often state, we’re all part of the solution, and
    I have always deterred from being part of a WIT panel that didn’t include one
    man. You don’t want to have a WIT panel that was all men—that makes no sense whatsoever,
    but the only way you can include men in the conversation is to make them also
    feel welcome, and to do that, a man on the panel who can explain how they can
    be more of an ally toward inclusion makes a huge difference.


    Women in Technology initiatives, when part of Diversity and Inclusion, have come
    a long way, but many of them, in my opinion, don’t have “teeth.” In other words,
    they simply discuss women’s technical career challenges but forget to follow through
    to create processes and policies to change the numbers. You’ll recognize these
    types of programs when women and people of color aren’t moving up into management
    positions. They aren’t able to represent and impact the bias that is part of the
    reason for the status quo. The initiatives in place must mature past just talking
    about the problems but doing something about them. We must be able to view a clear
    path for women and people of color to be promoted to management and leadership
    positions. I’ve also found that these programs shy away from authentic conversation.
    There’s consistently a request to only promote positive, feel-good statements.
    These groups are great for anyone who wants to avoid uncomfortable conversations
    about gender and bias. They are great for networking events, but if a woman’s
    technical career is stalling because of any of the challenges that we’ve discussed
    in this book, these events will most likely not provide them options for how to
    address them constructively. One of the women I collaborate with on numerous projects
    refers to these groups as “the shiny/happy people.” To know the difference and
    that these groups provide value, just a different value as groups that address
    bias and challenges, is important. We’re all part of the solution.


    ## Title Wave


    Our culture often underestimates what women are capable of, even with sayings
    like, “Behind every great man, there’s a great woman,” but we still credit what
    the man accomplishes to him. When the situation is reversed, it’s very common
    for the man to be credited still. As my husband and I are in the same business
    and serve in the same groups, my husband becomes exasperated with how often people
    thank or congratulate him for work I’m doing that has nothing to do with him.
    I recognize that this must be happening to women in technology with their male
    peers, too. It’s not just for those women that may be hesitant to speak up about
    their accomplishments but also for those that clearly have done the work, but
    the credit still goes without concern to their male coworkers.


    I’ve received numerous emails, more than I can count, from women who’ve felt that
    credit for their work has gone to others. They’ve recognized the impact to their
    career in the way of bypassed promotions and missed project opportunities. It’s
    difficult for a manager to award appropriately when they believe that an achievement
    has been accomplished by someone other than the technologist who performed it.
    This is where our allies come in and when everyone is part of the solution. They
    step up and correct misinformation crediting another with an accomplishment performed
    by a woman in technology. Every small accomplishment credited to another is a
    step backward in their career path.


    ### Step by Step


    To attract the best applicants, the title will need to match the opportunity.
    I have a very rare combination of technical, speaking, and management skills.
    This has allowed me to create my own title that helps direct my career in the
    manner I wish. Upon hiring me to replace someone, a previous employer had combined
    two positions. Although I wouldn’t be part of marketing, the position had the
    dreaded “marketing” as part of the title. I carefully and strategically negotiated
    as part of my offer, letting the manager know that the title was the one thing
    deterring me from signing on the dotted line. I was able to immediately use my
    preferred title on `LinkedIn`, and within 6 months, the official title was changed
    internally with `HR`, too.


    If someone states that titles aren’t important at a company, the first thing is
    to identify that title of the person stating it. There may be a natural response
    for those that have achieved to protect that standing and deter others from achieving
    it and remove the view that it’s difficult to attain. We all want to be special.
    There’s nothing wrong with that, unless it is used to impact the path of another.
    Once you identify the individual’s title and determine if the fact they’ve already
    achieved a title was a factor, then focus on this aspect of having a title and
    request it again. There are certain words used to describe them which come up
    repeatedly when women discuss their failed requests for titles:


    *   Too ambitious

    *   Power hungry

    *   Aggressive

    *   Political (a hierarchy can be viewed this way)

    *   Non–team player


    Titles aren’t just important to the job you hold or are going to hold. It also
    leads you to better salaries and opportunities down the road. You will receive
    a higher salary and larger bonus with the title of “Lead” than you will without.
    “Acting Lead” means very little when someone is validating your employment history
    with `HR`. Few companies are using professional references in this day and again,
    the person collecting this information rarely will know you were the “acting lead,”
    nor will they care, and simply wants to know if you performed the tasks of the
    title you held.'
