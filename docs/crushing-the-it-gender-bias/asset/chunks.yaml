  trans: '

    我们先从已经讨论过的一个观点开始——社会对那些不符合传统角色和特质的女性感到不适。其中一部分是人类与生俱来的生存本能，但很大程度上是文化构建的结果。已有研究^(⁹⁹)证明，我们的性别更多由大脑而非身体决定，但我并非要在此争论这个议题。我在此要讨论的是，女性在以男性为主导的行业中工作时所面临的挑战，尤其是当她们可能不具备某些更传统的女性特质时。


    根据澳大利亚政府和 Comcare 公司的研究，员工报告称其中 20% 的人曾在职场遭遇过欺凌。^(¹⁰⁰) 收集的数据显示，每 30 名员工中就有 1 人是惯犯欺凌者，在某些情况下，这种欺凌可能持续数年。鉴于如此高的数字，也就不难理解为何他们同时记录到
    84% 的员工会在职业生涯中遭遇欺凌。欺凌还导致员工认为其工作环境具有压迫性，并且 65% 的人出于恐惧不会举报事件。这项研究中最令人震惊的数字是关于暴力和威胁的。23%
    的员工表示他们在职场中曾遭遇过“威胁行为”，15% 的人曾遭受过人身攻击。


    由于欺凌可能涉及领导层，该研究记录显示，66% 的受访者报告称其职场欺凌者是经理或主管。


    当我们与那些对女性在抱负、行为或兴趣方面表现出较不符合文化特质而感到不适的人发生冲突时，可能会引发失控局面。我一直说，我能激发出职场欺凌者最恶劣的一面。这类人往往竭尽全力隐藏自己的不安全感，试图表现出最好的一面，而当我出现，不费吹灰之力就表现得比他们出色时，情况就变了。即使我搞砸了，我也能坦然面对自己的弱点，因此我会承担全部责任，甚至倾向于从中找到积极的一面。这会让职场欺凌者的世界天翻地覆。他们突然直面自己无法掌控的不安全感（这才是他们成为欺凌者的真正原因），而那种偶发的行为开始升级，通常这时他们就会开始针对我。这种情况往往来得如此突然，让我内心涌起一种可怕的感觉，我知道自己触发了他们，必须开始策略性地行动，以缓和他们的行为。作为目标，欺凌者和我要耗费巨大的精力来处理这件事，这大大减少了用于提高生产力的时间——这一点我深有体会。作为一个不喜欢浪费时间的人，你可以想象，这件事对大多数人来说可能已经压力很大，但对我来说更是糟糕得多。


    我们从小就被灌输工作不应该是快乐的，所以才叫“工作”，但最近有许多研究计算了职场欺凌给公司带来的成本。^(¹⁰¹) 生产力和人员流动方面的损失是巨大的，这也是我在这些情况下能够占据上风的关键。我必须补充一点，当这些情况发生时，我还比较年轻，正处于那个阶段。这或许看起来无关紧要，但如今，我既没有精力也没有意愿，留在一家纵容职场欺凌者、导致严重人员流失或损害的公司里工作。无论是作为目标还是作为顾问，我都拥有丰富的经验，我强烈建议，如果情况变得无法忍受，就离开那个工作场所。女性成长过程中，可能较难将自己与工作场所分开，在职场欺凌者存在时不至于影响健康。所以，是的，工作不会总是充满乐趣，但它也不应该让你痛苦或生病。


    还有那些注重细节的人会想知道，什么才算是职场欺凌者？


    欺凌者是指那些使用贬低、辱骂和/或反社会行为，影响他人在工作场所发挥生产力的人。他们可能会试图将其掩盖在政策或规程背后，但对大部分人群表现出偏袒，并且通常每次只选择一个人作为目标。欺凌行为往往针对我们文化中更容易下手的对象——女性和少数群体。我注意到最有趣的一点是，如果一个欺凌者赶走了工作场所中所有的女性和少数群体，他们接下来就会对留下的人下手，几乎像上瘾一样需要一个目标，并从拥有对手中获得快感。


    如果你在办公室里与一个职场欺凌者共事，以下是我的建议：


    1.  如果这种行为刚开始，看看是否有可能策略性地缓和它，并且是否有办法让你与这个人合作，或者被调到另一个部门/团队，从而减少你与他们合作或为其工作的必要。


    2.  寻找另一份工作。如果欺凌行为无法忍受，或者有可能影响你的职业生涯，那就尽快离开。


    如果你仍然决心打这场正义之战，那么事实是这样的——这是一场极其耗时耗力的战斗。职场欺凌者生活在一个他们拥有对手的世界里，而你正是他们锁定目标的那个人。你可以策略性地试图避开他们，让他们在挑起其他争端时暂时忘掉你，但迟早，他们很可能会再次将负面注意力集中到你身上。如果欺凌者就是你的经理，那么你的处境就更糟了，因为你必须向欺凌者汇报工作。员工离开的是老板，而不是公司，所以这种不幸的组合可能会造成一个相当难以克服的局面。


    我曾与两位在我之前工作中向我汇报的欺凌者交过手。第一位欺凌者在技能方面存在不足，并对我天生的领导能力和技术能力感到威胁。她通过仅仅向高层管理人员汇报领导职位的情况而得以幸存，而那些向她汇报工作的人，直到问题发生六个月或更久之后，才知道自己替她背了技术错误的责任。到那时，任何人提出要处理这个问题似乎都显得斤斤计较，于是这种行为持续了下去。


    在我负责完成两个大型项目后回来接管我们团队的整理工作，并实施了一个任务管理系统，该系统以电子方式记录并历史追踪我们团队中谁负责哪项工作之后，情况发生了变化。当她开始将她的错误归咎于我和其他人时，我去找了我们上一级的经理，请他处理此事。他说他不能，也不愿进一步解释。我向他说明，如果他不管，我就去找人力资源部。他说：“请便，请尽管去。”
    我对他的行为感到困惑，于是打印了所有证据，证明她才是那些执行有误的任务的负责人，并把这些证据带到了人力资源部。我冷静而仔细地向他们解释了这给公司带来的收入和生产力损失，并非常明确地告诉他们，我只是希望这个问题得到处理。我向他们说明，不给她适当的领导和支持来帮助她成为更好的技术专家，对她也是不公平的。


    我在周四下班前与人力资源部会面。接下来的周一早上，他们就让那位欺凌者走人了。我记得自己当时很沮丧，因为问题没有从一开始就积极主动地得到解决，以至于最终我去找人力资源部时，导致了更严重的后果。缺乏领导力是职场欺凌行为最大的诱因之一。^(¹⁰²)
    如果没有强有力的领导者，期望往往无法设定，团队和个人之间的积极互动也会退化。一个强有力的领导者，也许会在事态失控之前，策略性地指导这位负责人，并让她承担责任，从而有望得到除解雇之外的不同结果。

    '
- fmt: '# 第二次面对职场霸凌：一场团队之战


    第二次面对职场霸凌时，这是团队共同努力的结果。数据库组向开发经理汇报，而我担任首席数据库管理员（Lead Database Administrator）。这位开发经理在安全感方面存在严重问题。这些不安全感到了他会在分配任务给开发人员时故意遗漏关键需求的程度，这样他就能在功能发布到生产环境后“拯救局面”，并感觉自己完成了工作。这是一个恶性循环，在我入职前已经持续了多年，而我是被雇来试图改变这一局面的。


    在全面审查各环境并目睹数月因这种做法导致的数据损坏后，`DBA`团队准备切断除读取之外的所有生产环境访问权限，并将所有开发活动隔离到开发团队自己新建的环境中。在锁定生产环境后，这位开发经理的行为出现了明显的断裂。他要求拥有生产环境的访问权限，并对我和数据库团队公开表现出敌意。我得到了运营经理的支持，网络和服务器管理员向他汇报，但生产数据库团队没有。在与他商议并获得支持后，我带着一份完整记录的计划去了人力资源部，计划是将`DBA`团队转移到运营部门下汇报，并清晰说明了为什么`DBA`团队向开发部门汇报存在利益冲突。


    `DBA`团队在接下来的两周内被转移到了运营部门，并得以在接下来的两年里正式推行变更控制和代码审查。


    从这次胜利中有两点教训需要牢记：


    1.  是的，你可以赢得这场战斗，但你可能无法赢得整场战争。多年后，在我厌倦了保护数据、数据库以及受这位经理影响的`DBA`之后，我离开了公司，去了更好的地方，而组织架构又回到了开发经理的管理之下。


    2.  一旦团队重新回到这位开发经理的管理下，团队中最优秀的人很快便离职另寻新职。如果一家公司不认真对待职场霸凌带来的成本，那么无论是对收入还是员工流失率，这种成本都会持续产生。


    随着年龄增长，*咳咳*，也更明智了，我做出了决定。尽管我很想参与这些斗争，但它们常常让我远离那些我可以对个人产生更大影响的事。当需要做出改变的是公司时，这浪费了我太多自己的宝贵资源。我学会了将时间和精力重新导向去影响更广泛的受众。这并不是我不在乎，但如果公司在乎，他们就会自己解决问题，意识到其中的成本。


    那么，当我仍然遇到职场霸凌时，这意味着什么呢？在知道自己已经惹到他们之前，我可能仍然会激发出他们最恶劣的一面。我逐渐意识到，在任何一家公司工作的两年间，我（至少）会遇到一个职场霸凌者。我也知道，他们要么是一个我可以直接忽略的小麻烦，要么是能影响我职业生涯的人，我需要策略性地绕开他们，避免围绕他们的混乱。


    多年来，我学会了如何与难相处的人打交道，以下是我提供的一些应对建议：


    *   **记录你们的会面频率**——确保将所有的非正式会议和谈话转为正式安排的会议。如果你能进行可以录制的网络会议，那就去做。你会发现大多数霸凌者都有些偏执，尤其是针对女性和少数群体；如果事态升级，他们与你会面的次数之多可能会成为人力资源部门的警示信号。


    *   **获取书面记录**——会后，以你难以记住会议所有内容为由，请“霸凌者”通过邮件向你记录重要的讨论点。让他们知道你通过这种方式能更好地吸收信息。


    *   **盯准目标**——你的目标是让他们不再干扰你，让你做好自己的工作。如果你能不被察觉地调到另一个不影响你工作目标的团队，那就与一个值得信赖的人合作来实现这一点。


    *   **不要发泄**——成为目标后感到沮丧是难免的，但不要向周围的人发泄。如果这些话传到霸凌者耳中，可能会激化他们的行为，因为他们的不安全感会增强。他们可能已经说服自己这是在为你着想（提供指导、辅导），所以只向工作以外的人发泄。


    *   **霸凌行为一开始就不要等到事态失控**。你应该一直在自己的人脉网络中寻找新的机会。继续维护这些关系，这样如果情况开始升级，你将有机会跳槽到一个有前景的新工作，而不是随便找到的第一个职位——那个职位可能让你在很长一段时间内都感到不快乐，或者需要你接受降薪或职位降低。


    *   **如果霸凌者过度解读你所说或所写的内容，并认为这些是针对他们的，不要感到惊讶。** 既然霸凌者把你当作他们的对手，他们可能也会认为你也同样把他们当作对手。在你被指责让他们看起来或感觉不好之后，你可能需要小心地解释。正如我们所讨论的，如果你是一名科技女性，没有什么比男性经理或同事说“你伤害了他们的感情”更危险的了。到那时，你需要非常小心且策略性地行事，以避开他们的注意。


    霸凌行为，类似于虐待行为，也可能导致霸凌者试图孤立他们的目标。就像施虐者经常要求受害者停止与家人和朋友联系一样，职场霸凌的一个危险信号包括要求你断开与社交网络和媒体的联系，并断绝任何可以支持或建议你的职业关系。不要允许这样做——你的人脉网络是你应对职场霸凌最强大的盟友之一。


    最后但同样重要的是——不要因为被霸凌而自责。在文化上，女性更倾向于从自身找原因来解释他人的不良行为。^([^(103)](#fn103))


    女性在科技领域面临的最大障碍之一，是多年来社会要求我们反复质疑自己，而事实上，问题很可能出在别人身上。^([^(104)](#fn104)) 开始学会辨别这种差异，相信自己的直觉。'
  raw: 'The second time I was faced with a workplace bully, it was a group effort.
    The database group reported up to the development manager, with me as the Lead
    Database Administrator. This development manager experienced significant challenges
    with insecurities. These insecurities were to a point he would delegate tasks
    to developers but leave out key requirements so he’d be able to come in after
    it was released to production to “save the day” and feel like he had done his
    job. It was a vicious cycle that had gone on for years before my arrival, and
    I was hired in hopes of changing it.


    After a full review of the environments and months of continued data corruption
    due to this practice, the DBA team was ready to cut off anything but read access
    to production and isolate all of development to development’s own, newly built
    out, environments. After locking down production, there was a clear break with
    this development manager. He demanded to have access to production and was openly
    hostile to me and the database team. I had the support of the operations manager,
    who the network and server administrators reported to, but production database
    team did not. After conferring with him and receiving his support, I went to Human
    Resources with a fully documented plan to move the DBA team to report under operations
    and clear description of why it was a conflict of interest for the DBA team to
    report to development.


    The DBA team was moved to operations in the following 2 weeks and were able to
    proceed with formalizing change control and code reviews for the next 2 years.


    There are two lessons from this win to keep in mind.


    1.  Yes, you can win this battle, but you may not win the war. Years later, after
    I’d left the company and gone onto green pastures, tired of protecting the data,
    the databases, and the DBAs impacted by this manager, the organization model returned
    under the development manager.


    2.  Once the team returned under this development manager, the best of the team
    quickly departed for new employment. If a company doesn’t take the cost of workplace
    bullies seriously, the cost continues to be incurred, to both revenue and in employee
    turnover.


    As I’ve grown older and *ahem*, wiser, I made the decision. As much as I wanted
    to take on these battles, they often pulled me away from those that I could make
    a larger impact individually to. It wasted too many of my own valuable resources
    when it was the company that needed to make the change. I learned to redirect
    my time and energy to reach a larger audience. It wasn’t that I didn’t care, but
    if companies care, then they will address the problem themselves, realizing the
    cost.


    What does that mean for those instances when I still come across a workplace bully?
    I’m still likely to bring out the worst in them before I know I’ve crossed them.
    I have come to the realization that I will interact with (at least) one workplace
    bully in the course of 2 years at any company. I also know they will either be
    a minor nuisance I can simply ignore, or they are someone who can impact my career,
    and I need to strategically work around them and avoid the chaos surrounding them.


    I’ve learned how to navigate difficult people over the years and the tips I can
    offer for dealing with them are as follows:


    *   Document how often your meet—Ensure to move all informal meetings and talks
    to formally scheduled ones. If you can do web meetings where you’re able to record
    them, DO IT. You’ll find that most bullies are a bit obsessive, especially with
    women and minorities, and the sheer amount of times they meet with you can be
    a red flag to HR if it escalates.


    *   Get it in writing—Once you’re done meeting, make it your problem that you’re
    having a challenge remembering all that was covered in the meeting and ask the
    “bully” to document what were the important talking points in an e-mail to you.
    Let them know that you’re better able to absorb that way.


    *   Keep your eye on the goal—Your goal is for them to leave you to do your job.
    If you can inconspicuously be moved to another team that won’t affect your goal
    at your job, work with a trusted individual to help you achieve this.


    *   Don’t vent—It’s difficult to not feel frustration at being a target, but don’t
    vent to those around you. If it gets back to the bully, it can escalate the behavior
    as their insecurities will be raised. As they may have convinced themselves that
    they’re doing this for your benefit (offering guidance, mentoring), only vent
    to those that are outside of the workplace.


    *   As the bullying begins, don’t wait till it gets out of hand. You should always
    be searching your network for new opportunities. Continue to grow these relationship
    so if the situation does start to escalate, you will have the chance to move to
    a promising new job and not the first offer that just comes up in a position that
    you won’t be happy in for a long time or that will require you to take a pay cut/position
    drop.


    *   Don’t be surprised if the bully reads into things you say or write and assumes
    they’re about them. As a bully has focused on you as their adversary, they may
    assume that you have also done the same toward them. You may be required to carefully
    explain after you’re accused of making them look or feel bad. As we’ve discussed,
    if you are a woman in tech, there’s no greater red flag than when a male manager
    or peer says you’ve hurt their feelings. At that point, you’ll need to very carefully
    and strategically work to stay out of their radar.


    Bully behavior, similar to abusive behavior, may also lead the bully in attempts
    to isolate their target. Just as an abuser often demands that their victim stop
    communicating with family and friends, a red flag with a workplace bully will
    involve demands to disconnect from your network and social media and eliminate
    any professional connections that could support or advise you. Don’t allow this—your
    network is one of your most powerful allies to overcoming a workplace bully.


    Last, but not least—don’t blame yourself for the bullying. Women are culturally
    more likely to look internally for the reasons of poor behavior in others.^([^(103)](#fn103))


    One of the biggest hurdles for women in tech to get beyond is the years of society
    asking us to second-guess ourselves when in fact, it may very well be someone
    else’s problem.^([^(104)](#fn104)) Begin to recognize the difference to trust
    your instincts.'
