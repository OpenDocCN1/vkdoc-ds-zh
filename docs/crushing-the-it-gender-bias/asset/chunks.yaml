  trans: '

    # 房间里唯一的女性


    作者：露丝·丘普林斯基


    音乐剧《汉密尔顿》中有一首歌唱的是“在事情发生的那个房间里”。在我的职业生涯中，我常常是那个房间里唯一的女性。尽管许多女性对能在那张会议桌旁获得一席之地求之不得，但我却并非其中之一。这篇叙述将解释我为何会有那样的感受，以及我从那些经历中学到了什么。


    在我的职业生涯中，有多次我都是会议室里唯一的女性、项目团队中唯一的女性，或是管理岗位上唯一的女性。在所有这些情境下，我常常被恐惧、不安全感和自我怀疑的情绪所淹没。我脑海中盘踞的主要问题是：


    -   我能否清晰有力地表达我的想法？

    -   会有人倾听我并重视我的意见吗？

    -   我的想法对我的同事来说是否有意义？

    -   如果我的想法被选中实施，它会成功吗？还是会因失败而受到指责？

    -   我被选来参加这些会议或项目，是因为我的能力，还是仅仅为了充当“象征性”的女性代表？


    我在过去四十年里的职业生涯，恰好与许多美国女性首次大规模进入职场担任主管和管理职位的时期重叠，因此这确实是一段混杂的经历：


    ## 20 世纪 80 年代：无形之墙


    我 20 多岁时开始为一家医疗保健企业集团工作，但在 30 岁出头时，我发现自己担任了一个新的主管职务。我并非主动寻求这个领导职位，而是我的男上司认为我有能力胜任提拔。那些年，我是管理层中唯一的女性，领导着一个约
    40 名员工的测试实验室团队。我发现这个角色虽具挑战性但尚可应对，然而，当我身处一个满是其他男性管理者的房间时，我的内心告诉我自己能力不足。我很沉默，除非被点名，否则不会主动发表意见。在团队环境中，我常常觉得自己像隐形人。


    我的男上司从未真正指导过我在会议或其他男性主导的场合中该如何表现或回应；他似乎不知道如何当一名导师。我试图观察他人并通过模仿来学习，但我内心始终有一种挥之不去的感觉，认为我的任何贡献都不值一提。我也犹豫着是否要寻求指导，因为我觉得既然自己已被提升到这个职位，就应该已经知道该做什么、该如何表现。在年度考核会议上，我收到了一些反馈，但都不够详细，更像是“你做得不错”。我觉得公司里没有人能让我坦诚地倾诉自己的挣扎。我知道如果让自我怀疑控制自己，我无法成功，但我不知道如何克服这些感受。我错过了让自己变得更果断的机会，因为我不确定如果那样做会得到什么反应。


    ## 1990 年：朝九晚八


    我在同一家企业集团内转到了不同的部门，但担任了一个全新的角色——质量经理——与主要是男性的医疗器械工程师打交道。我经常参加与这些工程师的会议，但我的经理（也是男性）对如何成功地与工程师沟通完全没有提供*任何*指导或反馈。他是那种典型只与自己同级别或更高级别经理打交道的管理者，而让我们这些与他同级别的经理去做所有与工程师沟通的具体工作，并通过试错来确定哪些方法可行、哪些不可行。


    我常常觉得自己的意见不受尊重，因为我不具备他们那样深入的技术知识。我甚至无意中听到两位工程师的谈话，说我“人挺好”但不理解他们所做的工作。结果，我感觉工程师们只是在面对面时合作，背地里却并不尊重我。不用说，这令人极度沮丧。我掌握着愿意与团队分享的质量保证和流程管理技能；然而，由于公司里的许多项目都是日期驱动的，我想实施的大部分流程都被视为按时完成工作的障碍。


    我们团队内部也存在冲突，而我们的经理不想处理。我的同级经理中包括另外两位女性和一位男性。其中一位女性控制欲很强，并且总是待在经理办公室里。有一次我出差在外，她告诉经理我的工作方法不够好。我回来后不得不为自己的工作向经理辩护。最终，我的经理送我们这批经理去参加团队建设培训，试图解决冲突。不用说，这次培训对改善我们的工作关系收效甚微。由于我知道自己不受男性工程师尊重，加上团队内部的矛盾，我意识到是时候开始寻找其他工作了。


    在这十年的后期，我终于有机会从事我梦想的工作：在一家兽医医药公司工作。因为我攻读生物学理学士学位的初衷就是成为兽医，但未能完成相关教育，这已经是最接近梦想的工作了。我终于有机会监督动物研究，并应用我的质量保证和学历技能。但仅仅两年后，公司就被出售，我也被裁员了。我再次发现自己站在了十字路口。


    ## 21 世纪初：没有龙纹身的女孩


    我决定尝试一些完全不同的事情：我的丈夫作为一名信息技术领域的承包商/顾问做得相当成功，他鼓励我将质量管理技能转移到这个行业。我全身心投入其中，开始以合同工的身份做软件测试员。


    令人惊讶的是，我确实在大多数是男性的开发者中找到了一些盟友——他们中的大多数人都想与我合作，以提高他们正在构建的软件质量，因此他们愿意讨论我的测试方法和发现的任何缺陷。在我的职业生涯中，这几乎是第一次，我感到自己受到了尊重。我与开发者们进行了开放的对话，他们会主动向我征求意见。我们彼此紧密合作，这意味着我们交付了高质量的成果。


    几份这样的合同工作让我扩展了技能，不仅限于软件测试。例如，在一份合同中，我学会了如何构建部署包并将新代码部署到生产环境。教我这些技能的首席数据库管理员是位女性；尽管她是正式员工而我是合同工，她仍然非常乐意将知识传授给我。在
    21 世纪初，正式员工常常觉得不应该与合同工合作或分享知识，因为合同工最终会带着所有知识离开，他们常常感到自己的工作受到威胁。但我在与正式员工合作时并未遇到这种态度。所有的合同工都在同一个房间里工作，尽管我是那个房间里唯一的女性，但我感受到了工作中的同志情谊。


    在作为合同工取得几次成功后，现实给了我一击：互联网泡沫破裂了。我决定重新转为全职员工模式，在一家国际保险公司担任高级质量保证职务。这最终引领我走向了另一个新的职业生涯：负责公司一些最关键
    IT 项目的项目经理。


    ## 2010 年：还是老样子

    '
- fmt: '# As a Project Manager


    As a project manager I worked with predominantly male developers, but when the
    company decided to outsource their information technology department, I found
    myself with a new set of challenges: running large projects staffed with outsourced
    contractors. Initially, most of the resources were from Canada, but as cost demands
    tightened, more and more I found myself dealing with offshored resources in India.


    That was a completely different experience, as it required a major upgrade to
    my abilities to glean the true state of project tasks. The majority of the offshore
    resources were male. Not only were there communication issues, but there were
    some resources who quite obviously would have preferred working with a male leader.
    I often found this to be true especially if the male offshore resource was at
    a management level or higher. I witnessed them seeking out other males on the
    team and ignoring me. After so many years of experiencing this type of attitude,
    I was amazed that I still had to deal with it and that attitudes toward women
    leaders had not evolved. I was eventually able to earn their respect despite the
    fact that some of the resources were not used to reporting to a female manager.
    I had to prove to them that I could make the right decisions about a project’s
    direction and that my judgment was sound. As with most of my career, it seemed
    I was constantly having to prove myself to others in this way.


    The other frustrating part of this time period was that some of the offshore resources
    did not have the technical skills to do the work. I felt that so many times I
    had to “spoon feed” them. For example, they frequently did not know how to do
    root cause analysis on a problem, and I had to lead them by questioning their
    conclusions. Some of the resources did learn and evolve over time, but it seemed
    like I spent much of my time training them in these areas. My manager at the time
    continued to tell me that my expectations of the resources were too high and that
    I needed to lower them so that I would not be disappointed. While I was eventually
    able to lead this team of offshore contractors effectively, I still had to accept
    that it would take more time and effort on my part to do so.


    One experience I had during this time was particularly demanding. After a minor
    change in organization structure, I found myself reporting directly to a male
    manager from India. He had recently relocated to our US headquarters in the Chicago
    suburbs, so he was new to the organization I worked in. I talked with others who
    worked with him in the past; they had vouched for him as very helpful and friendly.
    However, he had never worked in project management, he didn’t know anything about
    our organization’s project management processes, and most disconcertingly, he
    had never had any direct reports. I couldn’t understand why he was promoted to
    this position but tried to work with him and help to educate him about our organization
    and its processes.


    On several occasions, he made blunders in important project meetings which resulted
    in our department head complaining about his abilities. I often ended up repairing
    the damage that he created with either our systems’ end users or upper level management.
    I had several discussions with his manager (a woman) about his inability to learn
    even the basic skills of managing highly qualified technical resources.


    Her response? She told me that I must continue to be supportive of him and train
    him in any way I could because I shouldn’t let a fellow colleague down. After
    all, she surmised, he had relocated his entire family halfway across the United
    States to pursue this role. She assured me that she would also send him to classes
    to help him enhance his skills. I was amazed that she continued to support him
    when it was obvious to everyone at all levels in our organization that his skill
    sets simply didn’t render him capable of being a project manager, much less lead
    a team of project managers.


    Fortunately, another organizational change eventually removed me from directly
    reporting to him. I was surprised that the organization had invested so much time,
    effort, and training in a futile attempt to mold him to take on a role for which
    he was so clearly unsuited. Ironically, when he was eventually removed from his
    position, he simply returned home to India, ostensibly to run his father’s business.


    ## 2016: [Not] Throwing Away My Shot


    In 2016, I finally had had my fill of working in IT. Although there had been some
    good experiences (mostly independent contracts), they were often outweighed by
    the bad ones. I felt that the companies I worked for had similar business outlooks
    especially during the “outsourcing” craze. Companies were looking to save money
    on resources and did so by eliminating full-time IT positions and replacing them
    with offshored resources. Not all of these resources were unqualified, of course,
    but *so* many of them were; it often fell to me to find ways to deal with those
    situations. While it tapped into my creativity to think of ways to make my teams
    successful, it proved to also be a drain on my time and morale. As a female project
    manager, I recognized that the team’s efforts together would spell success or
    failure for a project. I felt that this outlook was sometimes unique to me but
    was vital to the health of the project team.


    My final project involved evaluating automated tools to be used for insurance
    claim analysis. The project was high profile and a favorite of the CEOs. The mostly
    male team of managers reporting to the CEO had no background in Information Technology;
    disturbingly, they had simply been given a date to complete the project, and their
    only concern was meeting that date. It was my responsibility to explain to them
    the project management obligations that had to be met, but they often viewed those
    obligations as roadblocks, so of course, I was the person creating those roadblocks.
    One of the younger recently minted MBAs on the team even commented, “I’m really
    glad you’re dealing with all that regulatory bullshit—it’s not worth my time.”


    I do think that this type of behavior is encouraged and displayed by higher level
    management. These types of male managers are led to believe time and again that
    time and cost savings are the critical aspects of a project. They are rewarded
    for meeting a date that was based on a line item in the CEO’s MBOs rather than
    on whether the product they delivered was high quality and met the organization’s
    needs. They typically receive a bonus or are promoted for meeting the date and
    then just move on to the next project.


    I did not back off the requirements that I knew would benefit the project but
    continued to push for adhering to procedures. One action I did take was to bring
    in other department leaders (information security, other project management leads)
    to reinforce my communications to the team of managers.


    As in so many other instances throughout my career, I was left wondering in this
    situation if a male colleague had been in my position would they have been treated
    differently and if my being the only woman on the team was the reason my opinions
    were being brushed aside. I found myself questioning after so many years why there
    really had been very little evolution of behaviors in the workplace and how little
    control I had over making a positive change to it.


    After almost 40 years in the workforce, I was exhausted—and not just from the
    long days I’d spent attempting to deliver the highest quality in everything I’d
    worked on. The constant nagging thought in the back of my mind that if I had just
    been part of the “boy’s club” my career would’ve gone differently had worn me
    down. Fortunately, my husband and I had saved and invested well enough over the
    years to enable me to move on to the next phase of my life.


    ## Now: Fulfillment'
  raw: 'As a project manager I worked with predominantly male developers, but when
    the company decided to outsource their information technology department, I found
    myself with a new set of challenges: running large projects staffed with outsourced
    contractors. Initially, most of the resources were from Canada, but as cost demands
    tightened, more and more I found myself dealing with offshored resources in India.


    That was a completely different experience, as it required a major upgrade to
    my abilities to glean the true state of project tasks. The majority of the offshore
    resources were male. Not only were there communication issues, but there were
    some resources who quite obviously would have preferred working with a male leader.
    I often found this to be true especially if the male offshore resource was at
    a management level or higher. I witnessed them seeking out other males on the
    team and ignoring me. After so many years of experiencing this type of attitude,
    I was amazed that I still had to deal with it and that attitudes toward women
    leaders had not evolved. I was eventually able to earn their respect despite the
    fact that some of the resources were not used to reporting to a female manager.
    I had to prove to them that I could make the right decisions about a project’s
    direction and that my judgment was sound. As with most of my career, it seemed
    I was constantly having to prove myself to others in this way.


    The other frustrating part of this time period was that some of the offshore resources
    did not have the technical skills to do the work. I felt that so many times I
    had to “spoon feed” them. For example, they frequently did not know how to do
    root cause analysis on a problem, and I had to lead them by questioning their
    conclusions. Some of the resources did learn and evolve over time, but it seemed
    like I spent much of my time training them in these areas. My manager at the time
    continued to tell me that my expectations of the resources were too high and that
    I needed to lower them so that I would not be disappointed. While I was eventually
    able to lead this team of offshore contractors effectively, I still had to accept
    that it would take more time and effort on my part to do so.


    One experience I had during this time was particularly demanding. After a minor
    change in organization structure, I found myself reporting directly to a male
    manager from India. He had recently relocated to our US headquarters in the Chicago
    suburbs, so he was new to the organization I worked in. I talked with others who
    worked with him in the past; they had vouched for him as very helpful and friendly.
    However, he had never worked in project management, he didn’t know anything about
    our organization’s project management processes, and most disconcertingly, he
    had never had any direct reports. I couldn’t understand why he was promoted to
    this position but tried to work with him and help to educate him about our organization
    and its processes.


    On several occasions, he made blunders in important project meetings which resulted
    in our department head complaining about his abilities. I often ended up repairing
    the damage that he created with either our systems’ end users or upper level management.
    I had several discussions with his manager (a woman) about his inability to learn
    even the basic skills of managing highly qualified technical resources.


    Her response? She told me that I must continue to be supportive of him and train
    him in any way I could because I shouldn’t let a fellow colleague down. After
    all, she surmised, he had relocated his entire family halfway across the United
    States to pursue this role. She assured me that she would also send him to classes
    to help him enhance his skills. I was amazed that she continued to support him
    when it was obvious to everyone at all levels in our organization that his skill
    sets simply didn’t render him capable of being a project manager, much less lead
    a team of project managers.


    Fortunately, another organizational change eventually removed me from directly
    reporting to him. I was surprised that the organization had invested so much time,
    effort, and training in a futile attempt to mold him to take on a role for which
    he was so clearly unsuited. Ironically, when he was eventually removed from his
    position, he simply returned home to India, ostensibly to run his father’s business.


