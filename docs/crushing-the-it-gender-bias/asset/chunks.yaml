- fmt: '# Playing the Role *vs.* Working the Role


    Events are not the only difference in how to gauge the success of an area of technology.
    I’d observed so many of my peers leave at a certain stage in their career—often
    in early management their careers would come to a standstill. Their male peers
    would continue to progress, but they would become stagnant. They often wouldn’t
    know who to emulate when so many of those in leadership roles were men (Figure
    [8-2](#469679_1_En_8_Chapter.xhtml#Fig2)).


    ![../images/469679_1_En_8_Chapter/469679_1_En_8_Fig2_HTML.png](images/469679_1_En_8_Chapter/469679_1_En_8_Fig2_HTML.png)


    Figure 8-2. Leadership vs. technical roles in the top technical companies in the
    US^([^(136)](#fn136))


    When I started at Microsoft, I was presented with numerous women who hold leadership
    roles in my own group. Kate Johnson, the CVP over all public and private sectors
    of business for Microsoft, who was gracious enough to connect with me on `LinkedIn`
    and even respond to my message to her, is one example of representation of women
    in leadership at the company I now work for. Another that we hear from regularly
    and I greatly admire is Toni Townes-Whitley, the President of the US Regulated
    Industries. She’s incredibly comfortable with what she brings to the table and
    when speaking to a large audience soon has them connected to her at an extraordinary
    level. There are others in leadership positions, such as Jenny Lay-Flurrie, Microsoft’s
    Chief Accessibility Officer, who you might not first consider, but have also impressed
    me since learning of them soon after joining. If you’re curious why Jenny is such
    an inspiration to me, she’s profoundly deaf and has been a pivotal force in Microsoft’s
    AI focused on inclusion for those with disabilities. These projects have included
    a plug-in for `PowerPoint` that automatically translates a presenter’s words into
    captions and can even translate them into different languages using automatic
    translation technology, also developed by Microsoft. This is just another example
    of how technology can be part of the solution toward diversity and inclusion,
    making it possible for everyone to become more involved in the world around us.


    I was also impressed to see that Microsoft’s board members are made up of 30%
    women, which isn’t as common as we might like it to be.^([^(137)](#fn137))


    President Microsoft’s CEO, Satya Nadella, spends significant time recognizing
    them in meetings, promotions, and in our groups. Microsoft, to help diverge from
    learned bias in hiring practices, have tied executive bonuses to diversity goals
    after data showed that there had been a decline in diversity in the company.^([^(138)](#fn138))
    To assist in making the company attractive to candidates, there is a clear and
    defined career management path and even a way to self-propel your career. At Oracle,
    I was incredibly proud of our co-CEO, Safra Katz, but there wasn’t a global vision
    that diversity was important. Occasionally you would overhear jokes made by peers
    that Mark Hurd was the real CEO and Safra Katz couldn’t have achieved the role
    on her own. No amount of comparison in capability or knowledge was going to clear
    the bias that was impacting her reputation inside the company, and although the
    view was carried by only a few, as we discussed earlier in the chapter, this type
    of toxicity can be deathly, and the silence that allowed those opinions to be
    heard made a deafening noise about impact of bias on leadership.


    Although working at Oracle, you became familiar with the lack of diversity in
    leadership, outside of a few common stereotypical expectations, there weren’t
    any numbers posted publicly that would confirm what was experienced or demonstrate
    a desire for change. Recently, a lawsuit^([^(139)](#fn139)) was filed on salary
    inconsistencies due to gender bias filed by over 4000 employees at Oracle. Only
    time and the courts will decide the fate of this case, but it is, nevertheless,
    difficult when you read about a company you admire going through this type of
    experience. Many companies have experienced similar challenges in court, even
    my own company I currently work for. One way to help move the needle away from
    these types of challenges is to build transparency around everything you do when
    it comes to diversity and inclusion.


    Microsoft, like Google, Apple, and other tech giants, post about its diversity
    and their diversity initiatives and strive to stress the importance of it. The
    2018 results already have articles from `Forbes`^([^(140)](#fn140)) and other
    major media, discussing the increases and why they are important to the company.
    Considering the size of the company, making an impact in diversity is not a simple
    task. There were gains of just over 1% in each area, from interns to leadership,
    but when you recognize that interns are often the technologists of tomorrow, the
    new numbers, up over 2%, to 42.5% of 2018 interns, are promising.


    The biggest win was one of the biggest challenges and that’s with race diversity
    in technology (Figure [8-3](#469679_1_En_8_Chapter.xhtml#Fig3)). The report shows
    that there was a 33% increase in black and Latinx employees in the last 4 years.
    Although the numbers are still in the single digits for percentage of all employees,
    this is an increase they can be proud of and hopefully will continue in the years
    to come.


    ![../images/469679_1_En_8_Chapter/469679_1_En_8_Fig3_HTML.png](images/469679_1_En_8_Chapter/469679_1_En_8_Fig3_HTML.png)


    Figure 8-3. Diversity in technology in the United States^([^(141)](#fn141))


    Possessing this type of public information gives me hope and helps to solidify
    my understanding of how important diversity and inclusion initiatives are that
    create results *vs.* those that just check off a box. You must see real change
    in a company, even if it’s a small change. This change must show not just in women
    in technology gains but also in leadership representation. If you can’t see it,
    you may not agree that you can’t be it, but it definitely makes it more difficult
    to forge your own path without any idea of the path you’re on.


    When I accomplished what I did in the Microsoft community, so quickly *vs.* what
    it took me in the Oracle one, it wasn’t about my experience, but as we discussed,
    it was often about sponsorship. While at any Microsoft event, I’m approached by
    2–3 times as many people asking me if I would come speak at another event, contribute
    an article, or be part of a professional group’s social gathering. I’m regularly
    a witness to other women being asked if they would consider submitting abstracts
    to speak at conferences or to write on books or be part of a special event. The
    more sponsorship of others that I witness, the more I recognize that I, in turn,
    can be sponsored more, too. It is a “pay it forward” initiative with a focus on
    a united front—everyone is part of the “family,” and everyone should do her or
    his best to support one another.


    It’s difficult to imagine with everything that I’ve experienced and everyone I’ve
    mentored and sponsored that anything could dissuade me from continuing to build
    women in technology initiatives, but I’ve realized that there is a side effect
    of being part of a diverse and inclusive community.


    Two scenarios commonly exist in communities with Diversity and Inclusion initiatives:


    1.  Diversity and Inclusion is a hushed topic outside of empty initiatives and
    provides little results.'
  raw: '## Playing the Role *vs.* Woking the Role


    Events are not the only difference in how to gauge the success of an area of technology.
    I’d observed so many of my peers leave at a certain stage in their career—often
    in early management their careers would come to a standstill. Their male peers
    would continue to progress, but they would become stagnant. They often wouldn’t
    know who to emulate when so many of those in leadership roles were men (Figure
    [8-2](#469679_1_En_8_Chapter.xhtml#Fig2)).


    ![../images/469679_1_En_8_Chapter/469679_1_En_8_Fig2_HTML.png](images/469679_1_En_8_Chapter/469679_1_En_8_Fig2_HTML.png)


    Figure 8-2.


    Leadership vs. technical roles in the top technical companies in the US^([^(136)](#fn136))


    When I started at Microsoft, I was presented with numerous women who hold leadership
    roles in my own group. Kate Johnson, the CVP over all public and private sectors
    of business for Microsoft, who was gracious enough to connect with me on LinkedIn
    and even respond to my message to her, is one example of representation of women
    in leadership at the company I now work for. Another that we hear from regularly
    and I greatly admire is Toni Townes-Whitley, the President of the US Regulated
    Industries. She’s incredibly comfortable with what she brings to the table and
    when speaking to a large audience soon has them connected to her at an extraordinary
    level. There are others in leadership positions, such as Jenny Lay-Flurrie, Microsoft’s
    Chief Accessibility Officer, who you might not first consider, but have also impressed
    me since learning of them soon after joining. If you’re curious why Jenny is such
    an inspiration to me, she’s profoundly deaf and has been a pivotal force in Microsoft’s
    AI focused on inclusion for those with disabilities. These projects have included
    a plug-in for PowerPoint that automatically translates a presenter’s words into
    captions and can even translate them into different languages using automatic
    translation technology, also developed by Microsoft. This is just another example
    of how technology can be part of the solution toward diversity and inclusion,
    making it possible for everyone to become more involved in the world around us.


    I was also impressed to see that Microsoft’s board members are made up of 30%
    women, which isn’t as common as we might like it to be.^([^(137)](#fn137))


    President Microsoft’s CEO, Satya Nadella, spends significant time recognizing
    them in meetings, promotions, and in our groups. Microsoft, to help diverge from
    learned bias in hiring practices, have tied executive bonuses to diversity goals
    after data showed that there had been a decline in diversity in the company.^([^(138)](#fn138))
    To assist in making the company attractive to candidates, there is a clear and
    defined career management path and even a way to self-propel your career. At Oracle,
    I was incredibly proud of our co-CEO, Safra Katz, but there wasn’t a global vision
    that diversity was important. Occasionally you would overhear jokes made by peers
    that Mark Hurd was the real CEO and Safra Katz couldn’t have achieved the role
    on her own. No amount of comparison in capability or knowledge was going to clear
    the bias that was impacting her reputation inside the company, and although the
    view was carried by only a few, as we discussed earlier in the chapter, this type
    of toxicity can be deathly, and the silence that allowed those opinions to be
    heard made a deafening noise about impact of bias on leadership.


    Although working at Oracle, you became familiar with the lack of diversity in
    leadership, outside of a few common stereotypical expectations, there weren’t
    any numbers posted publicly that would confirm what was experienced or demonstrate
    a desire for change. Recently, a lawsuit^([^(139)](#fn139)) was filed on salary
    inconsistencies due to gender bias filed by over 4000 employees at Oracle. Only
    time and the courts will decide the fate of this case, but it is, nevertheless,
    difficult when you read about a company you admire going through this type of
    experience. Many companies have experienced similar challenges in court, even
    my own company I currently work for. One way to help move the needle away from
    these types of challenges is to build transparency around everything you do when
    it comes to diversity and inclusion.


    Microsoft, like Google, Apple, and other tech giants, post about its diversity
    and their diversity initiatives and strive to stress the importance of it. The
    2018 results already have articles from Forbes^([^(140)](#fn140)) and other major
    media, discussing the increases and why they are important to the company. Considering
    the size of the company, making an impact in diversity is not a simple task. There
    were gains of just over 1% in each area, from interns to leadership, but when
    you recognize that interns are often the technologists of tomorrow, the new numbers,
    up over 2%, to 42.5% of 2018 interns, are promising.


    The biggest win was one of the biggest challenges and that’s with race diversity
    in technology (Figure [8-3](#469679_1_En_8_Chapter.xhtml#Fig3)). The report shows
    that there was a 33% increase in black and Latinx employees in the last 4 years.
    Although the numbers are still in the single digits for percentage of all employees,
    this is an increase they can be proud of and hopefully will continue in the years
    to come.


    ![../images/469679_1_En_8_Chapter/469679_1_En_8_Fig3_HTML.png](images/469679_1_En_8_Chapter/469679_1_En_8_Fig3_HTML.png)


    Figure 8-3.


    Diversity in technology in the United States^([^(141)](#fn141))


    Possessing this type of public information gives me hope and helps to solidify
    my understanding of how important diversity and inclusion initiatives are that
    create results *vs.* those that just check off a box. You must see real change
