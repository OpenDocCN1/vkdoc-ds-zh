    YOU best. The media and our society spend an incredible amount of time and money
    telling us what is preferred in behavior and attractiveness, but there are significant
    changes in demands by women in broadening what it means to be a woman. Our society
    is beginning to embrace and view women of history that were once invisible, such
    as Ada Lovelace, the prophet of the computer age, and Grace Hopper, who now has
    an annual event for women in tech that has an attendance cap for 2018 at 20,000.^([^(56)](#fn56))
    Recently, the human computers of NASA, Katherine Johnson, Dorothy Vaughan, and
    Mary Jackson, had their own movie, “Hidden Figures.” It’s not just in technology
    that we’re experiencing a change, but even another male-dominated industry, politics.
    In the mid-elections of 2018, over 2200 women ran for office.^([^(57)](#fn57))
    Recognizing this change in our world, what they have started referring to as the
    third wave of Women’s Liberation is upon us. Embrace this and make your career
    and life part of the total view of what women are and can be.


    Trust your ideas, your plans, and your instinct about what’s right for you and
    those important to you. Become strong in your resolve when an idea, a plan, and
    your instincts all align and those around you attempt to influence you to do what
    they want instead. So often the difference between failure and success is having
    the vision to know when to stick to your guns. Building trust in yourself will
    help build your path and know when to accept feedback or advice and when to forge
    your own path. Declining advice can be done graciously and without personal attack.
    It’s agreeing to a simple understanding that what works for one person may not
    be the right path for you.


    The other challenge with those around you will be what they deem constructive
    feedback and/or criticism. Rarely are people trained on how to give constructive
    feedback.^([^(58)](#fn58)) This results in so many I speak to receiving feedback
    that has little value or no options they’re able to move forward with. Even when
    open-ended questions were asked, the individual requesting the advice received
    little to know constructive feedback.


    If someone continues to provide little to no value in their feedback, learn to
    avoid searching them out when constructive feedback is required. For those that
    respond only with negative feedback or pessimism, this can only impact your initiative,
    and unless it’s done in an open communication style where something positive can
    be the take away, you may want to avoid this type of negativity.'
