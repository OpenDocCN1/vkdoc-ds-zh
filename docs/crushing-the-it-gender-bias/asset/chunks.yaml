  trans: '

    # 问题


    匿名


    早上站会时，和往常一样，轮到我提问，也一如既往地被忽视。有人告诉我应该大声说出来，要求得到回答，但当我真的这么做时，那些家伙只是互相看看，要么 smirk（假笑），要么指指时钟。


    他们表现得好像我应该知道所有问题的答案，但事实从未改变。第二天，我们坐在下一次站会上，解释谁因为假设自己应该做什么，而没有像我前一天那样提出同样的问题，从而做错了事。


    这很令人恼火，我不知道该如何应对。根据导师的建议，我开始在站会后发送一封跟进邮件，记录我的问题，然后每天记录前一天出错的状况。似乎没人读这些邮件，但至少当最终用户问起项目为何失败时，它们应该能派上用场。


    我们在团队中工作时也总是遇到同样的情况。我发现流程中缺少了什么，得到的回应却总是居高临下。好像我很愚蠢一样，但事实证明我是正确的次数比例，简直令人难以置信。


    他们从不听我把话说完，也不采纳我的建议，直到为时已晚。我感觉自己不被任何团队视为有价值的成员。


    # 这玩意儿有声音吗？


    匿名


    虽然我真的很喜欢当 DBA（数据库管理员），但我一直在挣扎。当我发言时，被视为有攻击性。我的男性同僚会打断我的话。我的直接主管要求我保持缄默。我觉得我必须付出双倍的努力，才能获得男性同僚一半的重视。我没有学位，但在
    Oracle、SQL Server 和 Ingres 数据库方面有多年经验。


    我真的很喜欢处理 Oracle 的工作，但后来意外地被要求停止。我当时正表现出色，大杀四方，进行 12c 设置，安装 OEM 13c，调整和与团队协作——至少我是这么认为的。我被告知，我的高级男性主管抱怨说他的工作不够多，很无聊。作为回应，我的经理让我完全停止处理
    Oracle 的工作，然后把它全部交给我的主管管理。从那以后，我就不准碰 Oracle 了，被告知主要处理 SQL Server 和其他数据库。这些数据库被我的主管视为“技术要求较低”。最近，我开始更深入地研究
    MySQL 和 Community Server。我被要求培训我的高级主管使用 MySQL 环境，以便他能作为我的后备。我立刻感到惊讶，因为我们的 Oracle
    环境根本没有后备人员。


    在指导下，我现在明白了，我不是有攻击性，只是在坚持主张。我开始向我的经理直接询问我对其他平台缺乏交叉培训的担忧，并同意培训我的主管使用 MySQL 环境，前提是他允许我作为他的后备并处理
    Oracle 环境。认识到自己对公司的价值，是我站出来并期望公司做出改变的重要第一步，这既能提升我对职业的满意度，同时也能为公司提供更多价值。


    除了错失晋升机会，我还经常听到女性谈论在顶级项目和技术培训方面失去的机会。存在一种奇怪的偏见，认为男性在工作中比女性更需要技术挑战和精神刺激。也有数据显示，女性离开技术行业而非其他行业，是因为她们想要更有挑战性的工作。^(¹³⁵)


    # 失策


    我曾经在医疗保健行业工作，后来参加了一年的技术培训课程后转到 IT 行业。那时候，我是一个有三个孩子的年轻单亲家长，对办公室政治和文化非常天真。天真到几乎立刻就打破了一条不成文的规矩：不和同事约会。


    隔了几个办公室，有个单亲爸爸。他英俊、安静，人缘很好。我们共享同一个朋友圈，至少对我来说是新朋友，对他来说是老朋友。他在我的新雇主那里已经工作了八年多。


    我们火热的办公室恋情持续了大约 9 个月，和同事朋友们一起参加了很多社交活动。他总有一种不言自明的优越感，而且有办法让我在这段关系中感到“不够好”，考虑到我们是专业上的同级，这引起了警报。他会在说话时打断我，并在别人面前叫我闭嘴，让我难堪。


    有一天，我注意到他的工资单放在外面，我快速瞥了一眼。在我们的工作架构中，他仅比我高一级，尽管他比我早工作 8 年，但年薪比我多 25,000 美元。在我们当时担任的职位上，这是巨大的薪酬差异。


    最终，随着对他的行为感到厌倦，以及我越来越觉得他总是在“将就”，这段恋情无疾而终。我可以告诉你，在那个办公室里，周围都是他的朋友——可能也是我的新工作朋友，而且全都是男性——这令人感到畏惧和不适。他曾建议我，也许我应该离开。


    我为此承担了责任，因为是我选择了打破规则。那是我一生中迄今为止最好的工作。那是我新的 IT 职业生涯，我决心扭转局面，不让这个“纯男性俱乐部”把我赶出这里。


    我埋头苦干。我交了新朋友，最终，那些老朋友又开始对我友好起来，我和前男友也能在同一间办公室共处，我们的关系恢复到舒适的专业状态。


    快进到大约 18 年后，我们的个人生活都有了新的发展，我们仍在同一间办公室，而我已经升职到了比他高的职位。


    这个故事的寓意是——不要放弃。永远不要放弃。即使你犯了一个可怕的错误，或者做了可能终结职业生涯的事情，也要尽力保持透明并承认错误或失败。同时，不要让办公室政治窃取你的职业生涯。


    超脱于纷争之上。


    我只能想象上面那位作者为了达到现在的位置经历了什么。当我们对现状抱有希望时，很难预知未来。正如前文所讨论的，有研究表明，当办公室里男女之间的话题涉及浪漫关系时，权力分配会变得多么失衡。


    虽然我在和丈夫考虑恋爱关系之前就认识他八年了，但这仍然是我一生中最艰难的决定之一。在我认识他的整个过程中，我一直在专业上钦佩他，但突然间，我们共同服务的董事会同僚以及我们所属的技术社区都会知道我们陷入了恋情。蒂姆的行为堪称典范。他耐心而尊重，深知我会受到社区中男性和女性的评判。


    正如前一位作者分享的那样，问题不仅在于这段关系能否长久，还在于如果不能长久会怎样？这会如何影响你的职业生涯以及你所在领域的其他人对你的看法？这位作者很坚持，她知道她可以改变自己的未来，以纠正她认为自己过去犯下的错误。


    # 多样性不仅仅关乎女性


    如前所述，我想展示偏见对于所有多元化群体来说是多么相似和令人困惑。我联络了几位对我坦诚聊过自身挑战的朋友，请他们贡献故事。


    第一个故事来自道格·高尔特。道格和我认识很久了，曾在 Enkitec 共事。我是一个同性恋儿子的骄傲母亲，虽然道格和我是同龄人，但我还是忍不住希望我的儿子能像我在这位朋友道格身上看到的那样，在生活中找到同样的自信和满足感。

    '
- fmt: '# Silence is Golden


    Doug Gault


    I came out in 1987, though I knew long before that I was gay. Since then I''ve
    been very open with pretty much everyone I''ve interacted with, whether it be
    family, friends, or work colleagues.


    I moved to Dallas Texas in 1990 and had started working for one of the “Big 4”
    consulting firms. I was young and relished the chance to travel the country doing
    some cool things with cutting edge technology.


    Each Monday morning, employees would convene, no matter our background, to compare
    stories of our weekend. At the time, I thought it was amazing and wonderful that
    I had such an open and accepting group of work friends. I didn’t understand why
    my gay friends cautioned me to be careful.


    After 2 years as a recognized asset and contributor, I was called into my local
    branch manager’s office and told that I was being let go. This manager was quite
    conservative, and he stated the reason for my dismissal was, “Your choice of lifestyle
    does not coincide with the values of this company.”


    I was devastated and feared what I’d been warned about living an open and honest
    life wasn’t a possibility and it would be impactful to my career. This was a horrible
    realization that I refused to accept. I found a new position with a much smaller
    consulting company and discovered they valued their employees for their diverse
    personal traits as much as their hard skills. I was still wary about sharing too
    much of my personal life after my previous experience but over the years became
    close to many of those employed there.


    By 1994, I’d been on a consulting opportunity for several months and had lost
    my fear of separating my personal and work life. This local corporate property
    management company had a fairly open office design where I sat with the full-time
    employees and there was little privacy.


    One afternoon I received a phone call from my consulting company’s office manager,
    someone I’d known significant amount of time, asking if I’d be attending the Christmas
    party and would I be bringing a guest. She assured me that I was welcome to bring
    my boyfriend and the call was quite short. Later that day, I was called into the
    client Director’s office, where I was informed that someone had overheard my phone
    call and come to him with concern. He cautioned me to keep my private life private,
    as well as advising me to take calls on my personal time.


    My old fears came back, concerned that I would be held accountable for what was
    [perceived] behavior that would put me or my contract company at risk. I imagined
    being walked out the door at any moment but instead heard nothing until the night
    of my own company’s Christmas party.


    I related the story to the owner of the company and the office manager. Neither
    had heard from the Director of the property management firm, and both said that
    if they had, they would have supported me without question.


    What struck me about the conversation that night was not what was said but how.
    They matter-of-factly made me understand that I should never have worried about
    such a thing and that they would have my back in any such confrontations in the
    future.


    That small yet extraordinarily meaningful gesture has stayed with me throughout
    my career.


    Having allies when times become difficult is important. It can make the difference
    between a situation becoming one of the reasons for dissatisfaction with our career
    and instead being a reason we’re dedicated to it. Allies build our trust in team
    members and our leadership. It creates loyalty to companies and strengthens the
    belief in a company vision when individuals feel they have the support and respect
    of those around them.


    I have always highly valued those in the community that are willing to stand up
    in an uncomfortable situation and support another as an ally. It requires significant
    internal strength and demonstrates character. When someone goes out of their way
    to be your ally, it’s a gesture not easily forgotten.


    Another wonderful person in my community is Randolph West. I remember how he welcomed
    me immediately to the Microsoft community, and his intelligence shines through
    when he converses with anyone in his presence. Part of his charm is his ability
    to make you feel immediately accepted, but as he stresses in his contribution,
    we all have times where we take ourselves by surprise.


    # The Bias in All of Us


    Randolph West


    I’m white and present as male. About a decade ago, I worked on something I liked
    to refer to as the “Project from Hell” and eventually left the company.


    After a few months, I returned to visit a colleague, who introduced me to a black
    woman sitting in my previous desk. My immediate reaction was surprise, but that
    quickly turned to embarrassment. I''m supposed to be a paragon of equal rights,
    and for a fleeting moment I had a stereotypical reaction caused by implicit bias,
    that a black woman couldn’t be in the position I once held. To cover for my red
    face, I apologized out loud for my mistake. I''d like to apologize today for my
    initial reaction, too.


    I think self-examination is one of the most powerful skills we can possess. I’ve
    had to assess my own bias over the years as I realized that I couldn’t expect
    to be treated as an equal if I expected a man to pay on dates or didn’t take responsibilities
    that were expected of my male peers, such as lifting heavy equipment, etc. It’s
    not easy to hold ourselves to the accountability that we expect of the world,
    but it’s the first step to a more fair and just society that lives in it.'
