    \n本书通过 Springer Science+Business Media New York 在全球图书贸易中发行，地址：233 Spring Street,\
    \ 6th Floor, New York, NY 10013。电话：1-800-SPRINGER，传真：(201) 348-4505，电子邮件：`orders-ny@springer-sbm.com`，或访问\
    \ `www.springeronline.com`。Apress Media, LLC 是一家加利福尼亚有限责任公司，其唯一成员（所有者）是 Springer\
    \ Science + Business Media Finance Inc (SSBM Finance Inc)。SSBM Finance Inc 是一家特拉华州公司。\n\
    \n*谨以此书献给下一代技术。愿你们放眼世界，并塑造它，以服务于我们生活的这个更广阔的世界。*  \n*我也将撰写本书所花费的时间、投入其中的精力和心血，献给我的孩子们——他们是我在这个世界上做一切事情的原因，也是我留下的传承。*\n\
    \n## 引言\n\n当我职业生涯刚刚开始时，我所在的团队由五位女数据库管理员组成。在九个月内，其中一位与我同时入职的五人之一离开了这个行业。她年轻、单身，拥有计算机科学学位，主攻数据库技术，并且没有孩子。我很难理解，如果我这样一个离婚、带着三个孩子、还有一个年幼婴儿、且没有计算机科学学位的人都能坚持下去，她为什么却不能。\n\
    \n在接下来的六年里，我忙于自己的事业和抚养孩子，以至于没有注意到，我已经从全女性的数据库管理员团队变成了团队中唯一的女性。随着我职业生涯的不断推进，我原先认为女性是数据库管理员、男性从事网络和服务器管理的传统观念发生了变化，以至于男性从事信息技术、女性在这个行业中是少数派的文化常态，变成了我周围的现实。\n\
    \n直到一位同行遭遇的令人不安的情况迫使我审视真正的罪魁祸首，我才发现大多数关于歧视和骚扰的政策很少能够有效遏制影响多元化的性别偏见。我觉得有必要发声，但显然我需要开始研究以理解这一切。偏见是一种复杂的生物学机制，历史上作为启发式思维的一部分发展而来，并由经验和文化教养塑造而成。历史上，启发式特质被构建出来，是为了保护我们避免食用与已知有毒植物相似的植物，或避免类似之前使我们陷入危险的環境情境。我们通过经验和榜样学习，但为了做到这一点，人类会简化和分类周围环境，以减轻对安全问题深入探究的需求。举一个危险性较低的启发式思维例子：如果我递给你一个青柠，你会预期拿到一个小的、圆的、绿色的柑橘类水果。相反，如果我递给你一个红色的指橙，一种原产于澳大利亚、形似香蕉的青柠家族少数派，那么会有一定比例的人很难接受它是一个青柠的事实。它不符合他们对青柠外观的预期。这种偏见来源的保護機制虽然有着重要的目的，即用于识别环境危险，如有毒食物和物理威胁，但也会在这种无害的情况下出现，导致一定比例的个体拒绝不符合他们预期标准的青柠。我们都受启发式思维的影响，无论男女，尽管某些人格类型更依赖于他们的启发式倾向。他们不喜欢走出舒适区，不喜欢打破传统，也不喜欢接受改变。\n\
    \n本书的总体目标是：如果我们不知道有问题，又如何去解决它？由于我们对启发式思维的使用是一種保護措施，它可能是无意识的，并且由于偏见的一部分建立在文化和教养之上，启发式思维可以无缝地融入我们的社会。本书的第二个目标是分享见解、知识和支持，以帮助行业中的女性取得成功。\n\
    \n我自己的旅程让我意识到文化和偏见是多么难以解决，更不用说改变了。但变化可以带来巨大的成长和惠及每个人的益处。没有这种变化，科技行业的增长就会受阻；它无法充分发展和发挥其潜力。由缺乏多样性的科技行业生产的产品，其满足其所应代表的客户需求的能力将是有限的。\n\
    \n## 致谢\n\n我要感谢我出色的丈夫蒂姆·戈尔曼，感谢他巨大的支持和爱。拥有一位真正重视婚姻平等的伴侣，在这个世界上能产生令人难以置信的变化。蒂姆，你是我在这场我们称之为生活、爱与科技的旅程中的伴侣。我无法奢求有更好的人与我分享这段旅程。\n\
    \n我还要感谢微软，它证明了无论多样性和包容性面临多少挑战，它都证明了微小而真实的改变能带来不同。当我开始意识到改变需要从我身边的人做起，并且我无法改变世界时，微软选择了专注于他们能在公司内部改变的事情，而这已经显现出成效。\n\
    \n如今，我在微软工作已有一年，在行业里也已有 20 年经验。我正在一个拥有两名以上女性的团队中工作。这是 15 年多来的第一次。在一个五人的团队中，有三位是女性，其中两位担任深度技术岗位。微软是我经历过的唯一一家将多样性和包容性作为每天更高优先级事项并融入每个目标的公司。这不仅仅是为了在检查清单上打勾。这种改变科技行业现状并致力于带来改变的政策，甚至能为我这样身经百战的“女战士”带来和平与和谐。\n\
    \n### 关于作者\n\n# 1. 故事背后的数字\n\n事实是由证据和数据支持的信息，而观点则基于个人经验和看法。由于偏见源于个人的经历和观点，一些读者怀疑其存在也是很自然的。本章将涵盖一些亲身经历以及背后的数据，以帮助我们在这段旅程中前行。\n"
- fmt: '# My Realization of Bias


    After I’d been in the industry for a decade, I had one of the last opportunities
    to work with a female peer, who we’ll call “Ann.” Ann had been my lead DBA back
    in 2004, and I had a great respect for her technical skills, as well as her capabilities
    as a leader. After I’d been a witness to her previous year filled with challenges
    and confusing management decisions, she was forced to leave the company we were
    employed at. A conflict had arisen between her and a male peer, “George,” and
    continued to escalate without relief from management or HR until she finally resigned.
    I felt helpless on how to assist her as I was friends with both individuals involved
    and had recommended both to their roles which lead to their employment at the
    company. I knew, without a doubt, I was observing George’s insecurities around
    Ann’s natural leadership skills.


    A database administrator’s job is often high stress, and the company we worked
    for was more so than the average due to the demands. When disaster struck, Ann
    was calm and thoughtful, while George, no matter how technically skilled, was
    short-tempered and tended to lash out at others around him. As frustrated as I
    was with George’s behavior, I was more frustrated with the management who couldn’t
    see Ann’s leadership skills and had promoted George over her just a month after
    hiring them both. When I’d made my recommendation to hire them, I’d clearly recommended
    Ann for the lead role and George to take on the demand of duties, as he was what
    I deemed, “a workhorse” (a role I relate myself to, so it’s easy for me to recognize
    the type).


    As the situation between Ann and George degraded, Human Resources had little ability
    to manage the situation, and Ann left the company, retiring from the technical
    world shortly after. I took Ann’s departure hard as I attempted to decipher how
    I could have helped more. I departed the company in the coming months, losing
    both two peers and losing one friend. I lost Ann as a peer because I felt I had
    let her down, and I lost George as both because I wasn’t sure who had let all
    of us down.


    I soon after reached out to Ann and asked her to lunch. Upon our first meeting,
    the reasons she gave for leaving technology appeared valid, but the way she spoke,
    the sadness in her voice, and from my own knowledge of what she went through told
    me there was a lot more to it.


    Ann was first hesitant to say more, but as I stressed, I was conflicted about
    what had happened; she seemed to feel relieved to have someone to confide in.
    I admitted that I had my own failure in helping her with what transpired, uncertain
    of how I could have better supported her at our previous company. I continued
    to speak with her at length, and in numerous conversations during the next few
    months, she described decades of frustrations and small, consistent challenges
    that had hindered her career. None of the situations were outright discrimination
    but were clear bias that were difficult to pin down. She’d attempted to address
    it but repeatedly found she failed miserably due to the gray area these situations
    fell into, and the more she confided in me, the more I realized I’d experienced
    many of the same challenges myself. Like Ann, I hadn’t identified them as being
    gender related but simply thought it was something only I was experiencing. At
    this stage in my career, bias was a term used rarely, if ever, and here we were
    voicing what so many other women were silently cursing.


    ## The Disappearance of Female Peers


    My experience with Ann happened in 2011 and two years before Sheryl Sandberg published
    her successful book *Lean In*. There was significant little being published about
    the challenges of women in technology in print or on the Web. As I discovered
    more and more women at risk, I started to take a deeper look into the challenges
    to understand the source of bias in our world. At this time and in my own professional
    circle, I’d worked with over 50 men and 13 women as Database Administrators (DBA).
    With some quick research (Figure [1-1](#469679_1_En_1_Chapter.xhtml#Fig1)), I
    discovered that one of my previous male peers had left the database administration
    industry, having retired, but for the women, there was a drastic difference. Eight
    of the thirteen women I’d worked with had left the technical industry. Three had
    retired but retired early (in their 50s), while the rest had left to pursue different
    industries, often with more diversity. These were intriguing numbers, and I realized
    I needed to dig in and understand why.


    ![../images/469679_1_En_1_Chapter/469679_1_En_1_Fig1_HTML.png](images/469679_1_En_1_Chapter/469679_1_En_1_Fig1_HTML.png)


    Figure 1-1. Peer history in the industry and the disappearance of female peers
    in my database career


    My natural curiosity makes me an acute observer, but even your own bias can put
    blinders on you. I suddenly faced this truth, realizing that my own bias had been
    present since my first job as a Database Administrator. I’d been hired, along
    with another woman, “Debbie,” as a DBA, but neither of us had previous experience.
    Debbie had just graduated with a Computer Science (CS) degree specializing in
    database technology. She was single and didn’t have any children, while I was
    married with three children, including a newborn, and I possessed no degree or
    certification in database technology. While she seemed to quickly acclimate with
    years of formal education, I was surviving on my natural knack and intelligence,
    in hopes no one would notice how little knowledge I possessed about databases.
    Debbie had skills, and I was the one “faking it until you make it.”


    Nine months into our employment, Debbie came to me and said, “Kellyn, I’m a black
    woman working in technology. It’s just not working, and I’ve decided to go over
    to the project management team.” Although surprised, I understood why she was
    leaving. We had poor leadership for our team, while the project management team
    was led by an incredibly gifted woman who was a natural leader. I remember thinking
    to myself, “If she can’t make it with all this going for her, how the heck am
    I going to?” I accepted why she was leaving from a high level but didn’t correlate
    how much the impact of bias, women in technology, and diversity was part of the
    equation. My own bias told me that it was just her unique decision and my own
    white privilege or similar challenges had nothing to do with my own successes
    and failures.'
  raw: '## My Realization of Bias


    After I’d been in the industry for a decade, I had one of the last opportunities
    to work with a female peer, who we’ll call “Ann.” Ann had been my lead DBA back
    in 2004, and I had a great respect for her technical skills, as well as her capabilities
    as a leader. After I’d been a witness to her previous year filled with challenges
    and confusing management decisions, she was forced to leave the company we were
    employed at. A conflict had arisen between her and a male peer, “George,” and
    continued to escalate without relief from management or HR until she finally resigned.
    I felt helpless on how to assist her as I was friends with both individuals involved
    and had recommended both to their roles which lead to their employment at the
    company. I knew, without a doubt, I was observing George’s insecurities around
    Ann’s natural leadership skills.


    A database administrator’s job is often high stress, and the company we worked
    for was more so than the average due to the demands. When disaster struck, Ann
    was calm and thoughtful, while George, no matter how technically skilled, was
    short-tempered and tended to lash out at others around him. As frustrated as I
    was with George’s behavior, I was more frustrated with the management who couldn’t
    see Ann’s leadership skills and had promoted George over her just a month after
    hiring them both. When I’d made my recommendation to hire them, I’d clearly recommended
    Ann for the lead role and George to take on the demand of duties, as he was what
    I deemed, “a workhorse” (a role I relate myself to, so it’s easy for me to recognize
    the type).


    As the situation between Ann and George degraded, Human Resources had little ability
    to manage the situation, and Ann left the company, retiring from the technical
    world shortly after. I took Ann’s departure hard as I attempted to decipher how
    I could have helped more. I departed the company in the coming months, losing
    both two peers and losing one friend. I lost Ann as a peer because I felt I had
    let her down, and I lost George as both because I wasn’t sure who had let all
    of us down.


    I soon after reached out to Ann and asked her to lunch. Upon our first meeting,
    the reasons she gave for leaving technology appeared valid, but the way she spoke,
    the sadness in her voice, and from my own knowledge of what she went through told
    me there was a lot more to it.


    Ann was first hesitant to say more, but as I stressed, I was conflicted about
    what had happened; she seemed to feel relieved to have someone to confide in.
    I admitted that I had my own failure in helping her with what transpired, uncertain
    of how I could have better supported her at our previous company. I continued
    to speak with her at length, and in numerous conversations during the next few
    months, she described decades of frustrations and small, consistent challenges
    that had hindered her career. None of the situations were outright discrimination
    but were clear bias that were difficult to pin down. She’d attempted to address
    it but repeatedly found she failed miserably due to the gray area these situations
    fell into, and the more she confided in me, the more I realized I’d experienced
    many of the same challenges myself. Like Ann, I hadn’t identified them as being
    gender related but simply thought it was something only I was experiencing. At
    this stage in my career, bias was a term used rarely, if ever, and here we were
    voicing what so many other women were silently cursing.


    ## The Disappearance of Female Peers


    My experience with Ann happened in 2011 and two years before Sheryl Sandberg published
    her successful book *Lean In*. There was significant little being published about
    the challenges of women in technology in print or on the Web. As I discovered
    more and more women at risk, I started to take a deeper look into the challenges
    to understand the source of bias in our world. At this time and in my own professional
    circle, I’d worked with over 50 men and 13 women as Database Administrators (DBA).
