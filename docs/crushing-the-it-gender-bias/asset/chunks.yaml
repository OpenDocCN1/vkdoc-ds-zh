  trans: '

    # 年轻与“无畏”


    新西兰


    作为一名年近三十的女性科技从业者，你可能会认为我亲身体验过不少性别偏见。但令人惊讶的是，我个人从未遇到过这种情况。然而，我常常需要证明自己的价值，因为几乎每个遇见我的人都觉得我看起来太年轻，无法承担那些本该比至少年长十岁的人负责的项目。信不信由你，作为职场中的千禧一代女性，且外表比实际年龄年轻得多，有时会陷入一些尴尬的处境。


    我 21 岁时获得技术学位毕业，随后立即在一家跨国公司开始了职业生涯。每当出现棘手的业务问题时，我总是乐于伸出援手。再加上我与各层级、各职能部门的人沟通，理解他们担忧根源的天赋，我很快就晋升到了高曝光度的职位。在与经验丰富的同事合作时，我始终秉持包容、尊重和同理心的风格，同时对自己的能力充满信心。这种方法帮助我应对了这种独特的年龄偏见。


    最近，当我申请加入一个技术用户组的管理委员会时，我立刻被告知：尽管我有很多宝贵的想法能让社区受益，但我实在过于年轻和热情，无法将组织的未来以及财务交由我信任。而事实上，我是大型金融
    IT 团队中负责管理数百万美元预算的两人之一。我必须承认，当时我确实怀疑过自己，甚至差点放弃追求这个机会。


    让我重拾信心继续前行的是几位导师的建议和支持。当你年轻时，依靠一个经验丰富的导师网络来评估你的决定至关重要，他们会毫不犹豫地根据自身经历直言相告。而在听取各方意见后，最终决定什么值得追求，则取决于你自己。


    新西兰在她的故事中所描述的是一种基于年龄的偏见。我们常常听到“年龄歧视”这个词被用于年长者身上，我也曾目睹过这种现象，尤其是在那些非常时髦、痴迷年轻的硅谷，但我指导过不止一个才华横溢、雄心勃勃且智慧过人的年轻人，他们却因“太年轻”而无法像年长的同龄人那样凭自身优点被评判。


    作者经历的第二个部分涉及些许“冒名顶替综合症”（我们中许多人难道不都有这种感受吗），并认识到当我们偶尔自我怀疑时，要看清自己和自己的真实能力是多么困难。我自己年轻时也曾有过这种感觉，觉得自己非常普通、愚蠢又无知。我花了一些时间才意识到，我需要相信自己，不要过分相信他人的话语，并明白克服怀疑的最大方法就是去尝试。“跌倒七次，爬起来八次。”在别人放弃的地方爬起来并取得成功，正是失败与成功的区别。我毫不怀疑，我们都会从上述作者身上看到伟大的成就——她将为技术行业贡献出巨大的力量！


    现在我们来看一些要求匿名的女性提交的故事。她们选择匿名的原因与其经历一样五花八门。有些人意识到讨论这些挑战很重要，但又不愿让相关人士或其所在公司难堪。有些人希望当初能直接指责肇事者，却又担心影响自己的工作和职业前途等。


    来自我们匿名投稿者的第一个故事是关于女性在晋升中被忽略的挑战——即使她们是更符合条件的候选人。我不知道听过多少次，女性是“职能负责人”或“代理经理”，却从未真正拥有过正式头衔。她们往往对非正式的职位感到相当满意，直到一个通常技能或经验较差的男性候选人被引入，却获得了职位、头衔和相应的薪资。如果她们询问为何自己未被考虑或被忽略，得到的常常是矛盾的理由，或者被反问为什么不能安于现状。


    这种情况对女性职业生涯、薪资和机会的持续损害是显而易见的。任何不了解这些处境，并疑惑为何女性会接受这些责任或不要求对自己的角色给予认可的人，都没有意识到，如果她们真的提出要求，许多人会陷入怎样的风险之中。许多人仅仅是对女性的抱负感到不适，而谈判本身就足以引发一些不安。

    '
- fmt: '# The Bro-Leader


    Anonymous


    During my time as a DBA, I experienced one job where I had a male colleague where
    systems operations team would listen to him even though I had more qualifications.
    My male colleague had little to no training in SQL Server, while I had been working
    with the platform for five years and had obtained my MCDBA certification. I was
    spending lot of time training this male colleague over the years I worked at the
    job. This particular company had a significantly high ratio of men, even for a
    male-dominated IT department. This company culture, even management, was primarily
    men, with not even one woman in IT management.


    I once had an incident where I was accused of uninstalling and installing an older
    version of a critical piece of software on an application server that I hadn’t
    even a log on to. Everything I experienced told me that the systems operation
    team had a chip on their shoulder toward my skills. When I would ask for hardware
    (memory, storage, *etc.*) for a SQL Server, they would assume it wasn’t necessary
    even when I provided statistics proving otherwise. On the other hand, if my male
    colleague made the same request, it would be granted. He didn’t have to provide
    anything to prove his case, nor did he require the technical data I had since
    they’d be quick to dismiss it. Despite informing my boss of the behavior, nothing
    was ever done to deter it from continuing.


    After 15 years of experience in my field of expertise, the most difficult and
    important projects that the director would assign to our team manager he would,
    in turn, assign to me. My male colleague was working on a flavor of DevOps, that
    outside of a project and almost out of our department.


    To capture and understand our value to the company, leadership had created a ranking
    system that the managers updated regularly. After my manager had departed the
    company, he shared with me that I was always ranked number one due to my ability
    to complete projects that were considered the most important in the timeframe
    and stay more focused on assigned projects. With my manager’s departure, the company
    was looking for his replacement and asked his recommendation from within his team,
    and he’d recommended both my male colleague and me for the position. Although
    I had significantly more experience with our main technical areas, the position
    was offered to my male colleague instead. I asked to meet with upper management,
    and when asked why I hadn’t been considered for the position, they stated that
    I wasn’t high profile enough in the company, as in they didn’t feel I communicated
    or worked with my peers enough. It was an odd statement considering how involved
    I was when on call or how dedicated I was when in the office.


    What created more conflict was the same management stated there was a concern
    that I was presenting and authoring in the outside community, making me too “high
    profile.” Although my male colleague was also presenting at community conferences,
    my outside volunteerism and work was deemed a threat to my day job. This led them
    to believe that I was a risk to depart the company.


    After this incident, among others, I determined that the overwhelming bias was
    impacting my ability to progress my career in the same way as my male peers and
    I departed for greener pastures.


    The preceding story resonated with me strongly. I’ve always been able to observe
    my peers, see what has worked to progress forward in one’s career, and tried to
    replicate it. I became heavily confounded by how different my experience was to
    my male peers when duplicating their efforts. I would go so far as to compare
    notes and experiences, with them as confused as I was when it came to the differences
    in how we were treated.


    Often, I would be punished for the same actions that they were rewarded for. It
    would be that drastically different and with only flimsy, vague explanations as
    to why I should be treated differently. It often starts with mixed signals, as
    the culprit is attempting to isolate what the reason for their discomfort over
    the woman’s accomplishments, but if it turned to hostility, that would often be
    a sign that it was time to look for a new opportunity elsewhere.


    ## Biting My Tongue


    Anonymous


    If asked, I would describe myself as an introvert who wants to be the center of
    attention like all those extroverts but not brave enough to do something extravagant
    or outrageous to get the attention. I have stories that are interesting but are
    in depth and hard to get through without time and discussion, just like the data
    and systems that I work with. I am undoubtedly the expert on the data, where it
    comes from, the transformations that occur and how it is ultimately stored.


    There is an older male contractor whose entire purpose seems to be to take my
    data, manipulate it, and create bar charts. They are horrendous charts. They don’t
    show anything but counts. He also performs “very complicated” processes to get
    these counts. This is a lie. I have reports that count exactly what he does, but
    his numbers are “better” than mine even though he is unable to explain how he
    came up with them, and I can give detailed documentation on my calculations and
    processes.


    He then claims that our numbers don’t match and runs around claiming my system
    is “wrong.” Hundreds of man hours and thousands of dollars have been spent showing
    that there is nothing wrong with my system. The problem is he doesn’t understand
    the business processes and therefore makes incorrect assumptions about the data.
    He also cannot explain the discrepancies between the counts and because he can’t
    explain the manipulations he has done, there is no way I can match his numbers.


    During meetings, he would constantly interrupt me and belittle me (I am no longer
    allowed to be in meetings with him, so he can’t do that now). Coworkers would
    come up to me afterward asking if he always treated me like that. Because of his
    influence in the upper management and my boss’ instructions to not engage with
    him, I had to bite my tongue.


    We pay this contractor a lot of taxpayer money to “create” charts that could be
    automated. Analysts spend hundreds of hours sharing their expertise with him so
    that he can create these charts that they could do better and more quickly. I
    am not sure what makes him so special that we can spend all this money and allow
    an external agent to have control over understanding of our data and how to present
    it, but I believe that I am starting to have an effect. More and more people within
    the organization are coming to me looking for guidance in forming the questions
    they are looking to answer and coming up with the data to answer them.


    As a Woman in Technology, I have had to deal with a male-dominated industry for
    20 years. Add to that the male-dominated law enforcement industry that I am currently
    working in, it is difficult to overcome the obstacles that this bias presents
    but I will persist.'
