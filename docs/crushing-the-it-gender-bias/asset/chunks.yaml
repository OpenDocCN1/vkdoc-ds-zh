  trans: '

    # 孤独之地


    根据任何一份特定女性科技从业者调查所涵盖的岗位，女性仅占技术职位的 13% 至 26%。^(¹¹) 由于团队通常由四到五人组成，这往往让女性技术专家成为团队中唯一的女性。作为群体中的少数派，一般的科技工作氛围比其他大多数部门显得更缺乏吸引力。在我们努力让更多女性进入科技领域的同时，这一现实目前可能让这个地方对女性而言显得格外孤独。我非常感激我的男性同事，但我发现，拥有女性同事能提供男性同事很少能给予的互动。对一个全男性团队而言，工作场所中的同事情谊优势是任何福利都无法弥补的。


    由于我们处在一个父权社会，女性的需求历来由他人决定，而当我们今天成为某个行业的少数派时，这种影响仍有所残留。许多人声称女性天生不倾向于科技领域，但如果我们回顾早期的
    STEM 教育，就会知道这并不成立。如果我们想理性地看待这个问题，还需要审视家用电脑曾经的营销方式以及科技职场氛围。


    大量数据表明，在企业计算兴起之初，计算机工作被视为“行政性”工作，因此由女性承担。即便当时女性在劳动力中所占比例极低，1960 年仍有 27% 的女性从事该行业。这一切在
    20 世纪 80 年代发生了改变，随着家用电脑成为现实，电视上开始出现面向男孩推销电脑的广告。到 1990 年，计算机科学领域的女性比例约为 35%^(¹²)；而
    20 年内，这一比例下降至如今的不足 20%。图 2-1 展示了 STEM 职业中女性比例随时间的变化。


    ![../images/469679_1_En_2_Chapter/469679_1_En_2_Fig1_HTML.png](img/469679_1_En_2_Fig1_HTML.png)


    图 2-1. 1965-2014 年女性在主要职业中的增长情况。数据来自 [`https://www.npr.org/sections/money/2014/10/21/357629765/when-women-stopped-coding`](https://www.npr.org/sections/money/2014/10/21/357629765/when-women-stopped-coding)


    当科技席卷全国并纳入教育体系时，它并未被分解为批判性思维、语言和电子学，而是被捆绑成一个复杂的学科。女孩从小就被教导，聪明是一种竞争，而男孩不喜欢与她们所吸引的对象竞争。^(¹³)
    到八九岁时，这一点便体现在年轻女孩对其 STEM 教育技能的看法上，表现为否认自身能力并犹豫不决。问题不在于她们做不到，而在于“女孩不擅长数学”这一观念的积极强化和持续反馈。这种反馈常被认为是导致女孩尽管在多项研究中数学和科学成绩优于男孩，却仍声称自己能力较弱的原因。


    与此同时，有科学数据显示，女孩在学习新语言时表现优于男孩，但几乎没有研究解释为何她们在计算机语言学习方面同样不出众。^(¹⁴) 我们也可以从先前女孩在数学教育中取得成功的相关数据推断，由于该语言被归类为科学或数学的一部分，因此对成功可能性的预期会影响最终结果。


    关于女孩如何学习以及我们如何教授编程的研究，促使像“女孩编程”（Girls Develop It）和“黑人女孩编程”（Black Girls Code）这样的团体致力于改变文化对女孩接触编程的影响，以及计算机语言的教学方式。它们更新了“女孩不擅长数学或科学”的陈旧偏见，重新思考
    STEM 教育的授课方式，并时常消除其中的文化偏见。这些项目的[成功](https://www.wraltechwire.com/2014/04/15/girl-develop-it-rdu-is-a-huge-and-growing-success-14415/)^(¹⁵)
    不言自明。“黑人女孩编程”的创始人[金伯利·布莱恩特](http://www.blackgirlscode.com/about-bgc.html)^(16))
    不断分享着与我自身经历以及我认识的几乎所有科技女性相似的故事，这些故事正是该项目的推动力。这些项目旨在以更符合女孩学习方式的方式教授技术，项目更注重协作，而不是将孤立编程作为初始学习方法。“女孩不擅长数学”之类的偏见在这些团体中不被接受，因为所有参与者本身性别相同，性别因素便被排除在方程之外。


    我曾注意到许多来自中东和印度国家的女性，她们的 STEM 技能远超美国女性。当我质疑这些国家的教育体系是否远胜于美国时，却找不到相关数据。一个持续出现的趣闻是，即便在她们祖国存在强烈的针对女性外出工作的文化偏见，这些女性也常常在与男性同伴分开的学校就读——这让我想起了“女孩编程”和“黑人女孩编程”项目的成功。那些在性别隔离环境中长大的人推测，这消除了课堂上与男性同伴的竞争挑战，使她们只需与女性同伴竞争。我注意到，她们专注于高等数学和科学导向的中等教育，更少担心男性同学对她们的看法，而更多关注如何作为成年人从教育中获益最大化。当男孩们正在形成自身竞争天性时，移除他们早期竞争方式带来的文化影响，似乎促使这些女性在成为年轻成人后更加坚定自信。这证明了我们不同文化之间的偏见差异，以及这些差异如何影响女性的教育质量。'
- fmt: '# The Perks Department


    A teaching position may advertise perks and benefits that are attractive for a
    working parent, knowing that most teachers are women and are of child-bearing
    age. If you were to ask the average Silicon Valley professional what a desired
    perk for a tech job would be, you’d more likely hear the following:


    - Casual Fridays

    - Game room

    - Happy hour or craft beer time

    - Bean bags or other casual sitting area

    - Snack foods and drinks


    The preceding list reads like a gamer’s dream but not for the average working
    mother. Around 2009, this was a list for any company hoping to attract top technical
    talent. Human Resources has started to evolve past this type of stereotype, but
    many times, IT management and IT teams have not. With the dominance of men in
    the field, it’s only natural that perks for the majority would prevail. My last
    company’s local office still has the snack room, a beer fridge, and the game room.
    The guys go and play frisbee golf at least once per week. The team atmosphere
    is excellent, but the few women in the office are almost always separate from
    these activities. I was a regular odd “woman” out, as I had learned after two
    decades in tech to understand the importance of this type of networking. I also
    admit to confusing the tech support manager for an office manager upon starting
    because I only received e-mails from her informing us of what snacks she’d ordered
    or the office administration tasks she’d completed. I felt terrible as my own
    bias and knowledge hadn’t shielded me from the problem. I didn’t understand why
    these tasks had fallen to her, but as we know, these types of tasks can be viewed
    as administrative and a woman will most likely have the task assigned to her,
    even when her title should grant differently.


    Companies are beginning to see the value of gender diversity in their technical
    staff and to attract more women with perks and benefits that are no longer limited.^([^(17)](#fn17))
    Snacks are moving from the stereotype coder/gamer type of Cheetos and energy drinks
    to healthy alternatives (thankfully, the guys are just as onboard with this change).
    Group outings are designed to be more inclusive of everyone involved, and we’re
    seeing gym memberships, diversity groups, lactations rooms, and such.


    We are seeing more flexible work schedules and identifying productivity toward
    reviews instead of how many hours someone has been present in the office. The
    biggest challenge was getting management on board, as male peers discovered that
    they appreciated a better work/life balance and healthier options as much as women
    do. It was never about taking away from those that are there but offering welcome
    to those that should be from the beginning.


    # From the Beginning


    Although I’ve already touched on upbringing and gender, do we realize how much
    we’re identified by our gender, even before birth? Parents rarely leave the gender
    of their child to a surprise with the advances in medicine. With this information,
    we decorate nurseries in pinks and blues, we buy gender distinct toys, and we
    interact with a child differently depending on the outcome of what gender our
    baby will be.


    There was a great [video](https://www.youtube.com/watch%253Fv%253DnWu44AqF0iI%2526feature%253Dshare),^([^(18)](#fn18))
    where two children were dressed in the opposite clothing that would be identified
    with their gender. No mention of the young toddler’s gender was mentioned to the
    adults who interacted with them. The children were placed in the room with various
    toys, and repeatedly, they found the adults handing the “boy” cars and trucks,
    as well as interacting with “him” with more physical play. The “girl” was offered
    dolls, and the play was more nurturing. They spoke in a much softer tone to the
    child they thought was a “girl,” too. If the “boy” toddler fell down, the adult
    would advise him to get up and brush himself off, where the “girl” was often assisted
    and offered soothing.


    The adults were noticeably surprised when informed of the true gender of the children
    and how different they had interacted with each. They were unaware of the gender
    bias and choices they made depending on the gender they *thought* the children
    were. I recalled the amount of attention my middle sister received while growing
    up. I was skinny with short dark hair. I behaved like more of the boys, more likely
    not to sit still, the ADHD representative I was. My younger sister was the epitome
    of little girl preferred behavior. She had long, blond hair and big blue eyes
    and could sit still without being constantly scolded. People would come up to
    us when we were out with our mother and quickly fixate on Kristi, telling her
    what a pretty little girl she was, often followed by someone stating how my mother
    had been “blessed with variety.” It was a kind way of saying that one child fit
    their expectations for female gender, while not insulting the other for not.


    It was interesting that my mother spent most of her time with her father growing
    up. I understood her connection to him, as he was my favorite, my Grandpa Joseph.
    Her best friend was a little girl who also wanted to be a boy, dressing as a boy
    whenever the chance came. Her upbringing created a woman who exhibited a more
    masculine communication style. If you’re asking how gender can be assigned to
    communication, we’ll start with the quote,


    > **Men insult each other and don’t mean it. Women compliment each other and don’t
    mean it.**


    The preceding statement describes how men and women network and connect with each
    other in different ways. While a man will discuss sports, as they become friends,
    they will teasingly insult each other in ways that women often will not. My husband
    is the middle child of three boys. He talks about some of the pranks they played
    on each other. After hearing these stories, I’m unsure how most boys make it to
    adulthood. There are numerous stories of pranks, insults, and challenges made
    to one another. Some of them would make his mother worry, but as the saying goes,
    “boys will be boys.” How much of this behavior is created from the differences
    in how we raise them?


    When a woman meets another woman, a traditional feminine communicator will compliment
    the other women regarding her appearance or her attire. “I love your shoes!” Or
    “Your hairstyle is incredible.” I also have a masculine communication style, and
    when women compliment me about my appearance, I still give awkward responses.
    I meekly say thank you, but this type of feminine networking isn’t something I
    grew up with. I’d been an awkward child, didn’t have many female friends growing
    up, and as stated earlier, my mother doesn’t communicate or network with other
    women this way. Compliments from my mother are fleeting and few. These compliments
    are how most women are raised to connect with each other. If a guy approached
    another guy and said, “Love your hair,” the response from the other guy would
    more often be quite awkward. The communication style also results in women more
    accustomed to hearing compliments but less prepared to receive criticism in interactions.
    Critical feedback, when done nonconstructively, can be a sign to women that someone
    doesn’t want to connect or network with them, hence why we hear women are more
    sensitive. The truth may be more complicated, as we’re culturally inclined to
    use compliments as a form of networking. On the other hand, men may not learn
    from valuable constructive criticism when they should but are more likely to roll
    with the punches when they’re in an adversarial position. This is a communication
    area that we could both learn from the other gender.'
