    *This book is dedicated to the next generation of technology. May you look like
    the world and shape it to serve more of the world we live in.*


    *I also dedicate the time it took to write, my energy, and my heart that went
    into this book to my children—they are the reason I do everything in this world
    and are my legacy.*


    Introduction


    When my career first began, I was on a team of five women Database Administrators
    (DBAs). Within 9 months, one of the five who was hired at the same time as I was
    left the industry. She was young, single, had a degree in Computer Science (CS)
    with a focus on database technology, and had no children. I had difficulty understanding
    how I, a divorced mother of three, with a young baby and no CS degree, would make
    it if she couldn’t.


    Over the next 6 years, I was too busy with my own career and raising children
    to notice that I’d gone from an all-female DBA team to the lone woman on the team.
    As my career continued to advance, my traditional idea that women were Database
    Administrators and men were in networking and server administration changed to
    a point where the cultural norm that men were in IT and women were a rarity in
    the industry became the reality around me.


    It wasn’t until an unsettling situation experienced by a peer forced me to examine
    what the real culprit was, and I discovered most policies around discrimination
    and harassment were rarely capable of deterring from gender bias impacting diversity.
    I felt the need to speak out, but it was clear that I needed to begin research
    to understand it all. Bias is a complex biological mechanism that developed historically
    as part of heuristics and is built out of experiences and cultural upbringing.
    Historically, heuristic traits are built to protect us from consuming plants that
    look similar to those we already know are poisonous or avoid similar environment
    situations that previously put us in danger. We learn by experience and example,
    but to do so, a human will simplify and categorize their surroundings to ease
    the demand for deep investigation of safety concerns. To give you a less dangerous
    example of how heuristics works, if I were to give you a lime, you expect to be
    handed a small, round, green citrus. If instead you were offered a red, fingerling
    lime, a banana-shaped minority of the lime family originally from Australia, a
    percentage of people will have great difficulty accepting the fact that it’s a
    lime. It doesn’t fit within their expectation of a what a lime looks like. This
    protective process that bias sources from has a significant purpose though, as
    it is used to identify environmental dangers, such as poisonous foods and physical
    threats, will also arise in this benign situation, resulting in a percentage of
    individuals rejecting the lime that doesn’t meet their expected criteria. We are
    all subject to heuristics, both men and women, although some personality types
    are more dependent upon their heuristic tendencies. They don’t like to be outside
    their comfort zone, breaking with tradition or open to change.


    The overall goal of this book is If we don’t know there’s a problem, how can we
    fix it? As our use of heuristics is with a protective measure, it can be unconscious,
    and as part of bias is built off of culture and upbringing, heuristics can be
    integrated into our society seamlessly. A second goal of this book is to share
    with women in the industry insight, knowledge, and support to help them succeed.


    My own journey has led me to realize how difficult culture and bias are to address,
    let alone change, but with change can come great growth and benefits for everyone.
    Without this change, the tech industry’s growth is stunted; it’s unable to evolve
    and develop to its full potential. The products produced by a nondiverse technical
    industry will be limited in the ability to fulfill the needs of the customers
    they’re expected to represent.


    Acknowledgments


    I’d like to thank my wonderful husband, Tim Gorman, for his immense support and
    love. Having a partner who truly values equality in a marriage makes an incredible
    difference in this world. Tim, you are my partner in this trip we call life, love,
    and in tech. I couldn’t ask for a better person to share this journey with.


    I also want to thank Microsoft for demonstrating no matter how many challenges
    there are for diversity and inclusion, they are proof that small and real changes
    can make a difference. As I had started to realize that change needed to be done
    with those around me and no way could I change the world, Microsoft has chosen
    to focus on what they could change inside the company and it shows.


    Now that I’ve been employed with Microsoft a year and after 20 years in the industry,
    I’m working on a team with more than two women. It’s the first time in over 15
    years. In a team of five, three are women, and two of us are in deeply technical
    roles. Microsoft is the one company I’ve experienced where diversity and inclusion
    are a higher priority everyday and part of every goal. It’s not just a check in
    a box. This policy to change the status quo in tech and a dedication to making
    a difference can bring, even for a war-worn, battle maiden like me, peace and
    harmony.


    ### About the Author


    # 1. The Numbers Behind the Stories


    A fact is a piece of information backed by evidence and data, unlike an opinion,
    which is based on personal experience and views. As bias is sourced from a person’s
    experiences and point of view, it is only natural that some readers may doubt
    its existence. This chapter will include experiences, as well as the data behind
    them, to help us along on our journey.'
