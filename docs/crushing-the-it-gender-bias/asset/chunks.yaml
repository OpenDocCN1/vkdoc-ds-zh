- fmt: '# A Lonely Place


    Depending on the roles included in any given women in tech surveys, women only
    comprise 13–26% of the technical positions.^([^(11)](#fn11)) With the average
    team comprising four to five individuals, this often leaves the female technologist
    as the sole woman on the team. As a minority in the group, the average tech workplace
    atmosphere can look less appealing than most other departments. As we work to
    get more women into tech, this fact can currently make it look like a very lonely
    place for a woman. I greatly appreciate my male peers, but I learned having female
    peers offers interaction that male peers can rarely offer. There is a camaraderie
    perk to a workplace that no amount of benefits can compensate for on an all-male
    team.


    As we have a patriarchal society, women''s needs have historically been decided
    for them, and there''s some carryover that still impacts us when we''re the minority
    in an industry today. Many claim that it''s natural women don''t gravitate to
    technology, but if we look at early STEM education, we know this doesn''t hold
    true. If we want to be logical about it, we also need to look at how home computers
    were once marketed and the tech workplace atmosphere.


    There''s considerable data demonstrating the dawn of enterprise computing; computer
    work was viewed as "administrative," so women were the ones to perform it. Even
    with much lower percentage of women in the workforce, 27% of women were found
    in the industry in 1960. This all changed in the 1980s as home computers became
    a reality and commercials began to appear on TV promoting computers to boys. As
    of 1990, there was approximately 35% of [women](https://www.gamasutra.com/view/news/228130/Did_80s_computer_marketing_push_women_out_of_video_games.php)
    in CS fields; within 20 years, it dropped to less than 20% today.^([^(12)](#fn12))
    Figure [2-1](#469679_1_En_2_Chapter.xhtml#Fig1) shows women in STEM careers over
    time.


    ![../images/469679_1_En_2_Chapter/469679_1_En_2_Fig1_HTML.png](images/469679_1_En_2_Chapter/469679_1_En_2_Fig1_HTML.png)


    Figure 2-1. Growth of women in top occupations, 1965-2014. Data from [`https://www.npr.org/sections/money/2014/10/21/357629765/when-women-stopped-coding`](https://www.npr.org/sections/money/2014/10/21/357629765/when-women-stopped-coding)


    As technology swept the nation and was added to education, instead of breaking
    it down into critical thinking, language, and electronics, it was bundled together
    as a complex science. Girls are routinely taught from early on that being smart
    is competitive and that boys don''t want to compete with which they are attracted
    to.^([^(13)](#fn13)) By the age of eight or nine, this is demonstrated in young
    girls'' [views](https://www.sciencedaily.com/releases/2008/09/080905153807.htm)
    of their skills in STEM education, with a denial of skills and hesitation to perform.
    It isn''t that they can''t do it but that positive reinforcement and consistent
    feedback that girls are "not good at maths." This feedback is often asserted to
    be the reason girls, although outperforming boys in math and science in numerous
    [studies](https://www.techtimes.com/articles/29010/20150127/girls-outperform-boys-academically-worldwide-even-in-math-and-science.htm),
    yet still claim to be less skilled.


    At the same time, there is a scientific data that shows that girls outperform
    boys when learning a new language, yet very little research as to why they don''t
    also excel in computer language education.^([^(14)](#fn14)) We can also assume
    from previous data on girls'' success with math education that the expectation
    of how successful one will be due to the language being labeled as part of science
    or math could impact the outcome.


    Research on how girls learn and how we teach programming has lead groups like
    Girls Develop It and Black Girls Code to work to change both the cultural impact
    to girls'' introduction to programming and how computer languages are taught.
    They''ve updated the old bias that girls aren''t good at math or science to rethink
    the way STEM education is taught and, at times, remove the cultural bias. The
    [success](https://www.wraltechwire.com/2014/04/15/girl-develop-it-rdu-is-a-huge-and-growing-success-14415/)^([^(15)](#fn15))
    of these programs speaks for themselves. Black Girls Code founder, [Kimberly Bryant](http://www.blackgirlscode.com/about-bgc.html),^([^(16)](#fn16))
    continually shares similar stories I''ve experienced myself and with almost every
    woman I know in tech, as the driver for the program. These programs are designed
    to teach technology in a way that is more supportive of the way girls learn, with
    projects that are more collaborative than with isolated coding as initial learning
    methods. The idea that girls "aren''t good at maths" or other bias statements
    aren''t accepted by these groups, as all participants are of the same gender to
    begin with. Gender is taken out of the equation.


    I had noticed many women from Middle Eastern and Indian countries whose STEM skills
    far surpassed those in the United States. When questioning if the education system
    were far superior in these countries, no data could be found. One interesting
    fact that continued to trend, even with strong cultural bias against women working
    outside the home in their native country, was that women often attended a school
    separate from their male peers, which reminded me of the success with the Girls
    Develop It and Black Girls Code programs. Those raised in the gender segregated
    environments surmised that it removed the competitive challenge with male peers
    in class and offered them only female peers to compete with. I noted that they
    studied advanced maths and science centric secondary education and had less concern
    with what male students'' impression of them and more about getting the most out
    of their education as adults. Removing this cultural impact of how boys competed
    early on as they were forming their own competitive natures appeared to drive
    them to be more assertive once they became young adults. This demonstrated the
    bias differences between our cultures and how they impacted women''s quality of
    education.'
  raw: '## A Lonely Place


    Depending on the roles included in any given women in tech surveys, women only
    comprise 13–26% of the technical positions.^([^(11)](#fn11)) With the average
    team comprising four to five individuals, this often leaves the female technologist
    as the sole woman on the team. As a minority in the group, the average tech workplace
    atmosphere can look less appealing than most other departments. As we work to
    get more women into tech, this fact can currently make it look like a very lonely
    place for a woman. I greatly appreciate my male peers, but I learned having female
    peers offers interaction that male peers can rarely offer. There is a camaraderie
    perk to a workplace that no amount of benefits can compensate for on an all-male
    team.


    As we have a patriarchal society, women’s needs have historically been decided
    for them, and there’s some carryover that still impacts us when we’re the minority
    in an industry today. Many claim that it’s natural women don’t gravitate to technology,
    but if we look at early STEM education, we know this doesn’t hold true. If we
    want to be logical about it, we also need to look at how home computers were once
    marketed and the tech workplace atmosphere.


    There’s considerable data demonstrating the dawn of enterprise computing; computer
    work was viewed as “administrative,” so women were the ones to perform it. Even
    with much lower percentage of women in the workforce, 27% of women were found
    in the industry in 1960\. This all changed in the 1980s as home computers became
    a reality and commercials began to appear on TV promoting computers to boys. As
    of 1990, there was approximately 35% of [women](https://www.gamasutra.com/view/news/228130/Did_80s_computer_marketing_push_women_out_of_video_games.php)
    in CS fields; within 20 years, it dropped to less than 20% today.^([^(12)](#fn12))
    Figure [2-1](#469679_1_En_2_Chapter.xhtml#Fig1) shows women in STEM careers over
    time.


    ![../images/469679_1_En_2_Chapter/469679_1_En_2_Fig1_HTML.png](images/469679_1_En_2_Chapter/469679_1_En_2_Fig1_HTML.png)


    Figure 2-1.


    Growth of women in top occupations, 1965-2014\. Data from [`https://www.npr.org/sections/money/2014/10/21/357629765/when-women-stopped-coding`](https://www.npr.org/sections/money/2014/10/21/357629765/when-women-stopped-coding)


    As technology swept the nation and was added to education, instead of breaking
    it down into critical thinking, language, and electronics, it was bundled together
    as a complex science. Girls are routinely taught from early on that being smart
    is competitive and that boys don’t want to compete with which they are attracted
    to.^([^(13)](#fn13)) By the age of eight or nine, this is demonstrated in young
    girls’ [views](https://www.sciencedaily.com/releases/2008/09/080905153807.htm)
    of their skills in STEM education, with a denial of skills and hesitation to perform.
    It isn’t that they can’t do it but that positive reinforcement and consistent
    feedback that girls are “not good at maths.” This feedback is often asserted to
    be the reason girls, although outperforming boys in math and science in numerous
    [studies](https://www.techtimes.com/articles/29010/20150127/girls-outperform-boys-academically-worldwide-even-in-math-and-science.htm),
    yet still claim to be less skilled.


    At the same time , there is a scientific data that shows that girls outperform
    boys when learning a new language, yet very little research as to why they don’t
    also excel in computer language education.^([^(14)](#fn14)) We can also assume
    from previous data on girls’ success with math education that the expectation
    of how successful one will be due to the language being labeled as part of science
    or math could impact the outcome.


    Research on how girls learn and how we teach programming has lead groups like
    Girls Develop It and Black Girls Code to work to change both the cultural impact
    to girls’ introduction to programming and how computer languages are taught. They’ve
    updated the old bias that girls aren’t good at math or science to rethink the
    way STEM education is taught and, at times, remove the cultural bias. The [success](https://www.wraltechwire.com/2014/04/15/girl-develop-it-rdu-is-a-huge-and-growing-success-14415/)^([^(15)](#fn15))
    of these programs speaks for themselves. Black Girls Code founder, [Kimberly Bryant](http://www.blackgirlscode.com/about-bgc.html),^([^(16)](#fn16))
    continually shares similar stories I’ve experienced myself and with almost every
    woman I know in tech, as the driver for the program. These programs are designed
    to teach technology in a way that is more supportive of the way girls learn, with
    projects that are more collaborative than with isolated coding as initial learning
    methods. The idea that girls “aren’t good at maths” or other bias statements aren’t
    accepted by these groups, as all participants are of the same gender to begin
    with. Gender is taken out of the equation.


    I had noticed many women from Middle Eastern and Indian countries whose STEM skills
    far surpassed those in the United States. When questioning if the education system
    were far superior in these countries, no data could be found. One interesting
    fact that continued to trend, even with strong cultural bias against women working
    outside the home in their native country, was that women often attended a school
    separate from their male peers, which reminded me of the success with the Girls
    Develop it and Black Girls Code programs. Those raised in the gender segregated
    environments surmised that it removed the competitive challenge with male peers
    in class and offered them only female peers to compete with. I noted that they
    studied advanced maths and science centric secondary education and had less concern
    with what male students’ impression of them and more about getting the most out
    of their education as adults. Removing this cultural impact of how boys competed
