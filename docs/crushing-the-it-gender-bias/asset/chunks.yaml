- fmt: '# 3. Turning Good Intentions into Positive Changes


    As we navigate roles, companies, and our technical career, the topic of communication
    is going to come up. Communication is not just about how we speak, but about how
    we listen and observe. As I just started with Microsoft, I was given Satya Nadella’s
    new book, *Hit Refresh*.^([^(24)](#fn24)) In it, he says, “Those who actively
    listen are more likely to be heard.” Active listening is a trait that you might
    think women excel at, but in truth, we have as many challenges with it as men.
    Where men speak and are less likely to listen, women listen, but don’t do so actively.^([^(25)](#fn25))
    A recent study by scholars from Brigham Young discovered that we’re either less
    likely to interact with the person speaking or fearful to speak up when we should.^([^(26)](#fn26))
    We nod our head, stating, “We hear you,” but, we’re shaking our head to offer
    the speaker comfort and acceptance than to actively listen and interact with what
    is being said.^([^(27)](#fn27)) When we do ask questions, we often ask the wrong
    ones (most likely knowing the answer, but attempting to assure the speaker that
    we were listening), while men then go into unnecessary detail and valuable time
    into an answer we already know, wasting the time on what really needs to be discussed.
    Women’s strong observations skills note when someone is closed to continued discussion
    and will avoid a direct approach even when one is needed (which falls into that
    trust and upbringing once again).


    It’s already been established by research that communication has less to do with
    what we say and more about how we say it (Figure [3-1](#469679_1_En_3_Chapter.xhtml#Fig1)).^([^(28)](#fn28))
    Micro-expressions, full facial expressions, inflections in our voice, and how
    the people around us respond says more than the words. In a world becoming more
    dependent upon email, social media and other forms of nonverbal communication,
    even with the debunked [theory](https://ubiquity.acm.org/article.cfm%253Fid%253D2043156)^([^(29)](#fn29))
    of nonverbal communication encompassing over 90%, we still should expect challenges.


    ![../images/469679_1_En_3_Chapter/469679_1_En_3_Fig1_HTML.jpg](images/469679_1_En_3_Chapter/469679_1_En_3_Fig1_HTML.jpg)


    Figure 3-1


    Nonverbal communication


    ## Mentoring to Partnering


    Women empowerment tells us that we should be more direct in written communication^([^(30)](#fn30)),
    but I also possess deep insight on this topic due to the complex and intriguing
    relationship with my spouse. My husband, Tim, was my first mentor in the database
    world. When I first met him, I was working for a company that was challenged with
    weak leadership. Tim was brought in to help smooth over the relationship between
    one of his contract Database Administrators (`DBA`) and my Lead `DBA`. His `DBA`
    was threatening to walk out of the contract, and Tim hoped to negotiate common
    ground between them. I remember the first meeting with him and was thoroughly
    impressed with his technical skills and the diplomatic way he dealt with everyone
    in the room.


    Afterward, the company hired Tim to teach the `DBA` team some advanced database
    skills we would need, and classes with him began immediately. This was my first
    `DBA` position, and I was considering leaving the database team to join the other
    Jr. `DBA` who’d departed for the project management team. There were stronger
    leadership and female mentors on that team, which was incredibly appealing, but
    I was torn due to my attraction to a deeper technical position. Upon finishing
    up the database backup and recovery class with Tim, he asked my manager if it
    was true that I’d be leaving the Database Administration team. After my boss confirmed,
    he advised him not to let that happen, as I’d surpassed anyone else in the class
    and had strong, natural skills, something we still call, “the knack.” Yes, the
    man that I ended up dating and marrying 8 years later was an essential sponsor
    that retained me in the technical industry.


    ## Insider Information


    Over the years, our mentoring relationship has changed to one of professional
    partnership. Recently, there was a story^([^(31)](#fn31)) that was circulating
    about two team members, one male and one female, who shared an e-mail account.
    The only thing different was their signature. The male peer was under the impression
    he was more efficient at his job and hadn’t really considered there were differences
    in how customers interacted with him *vs.* his female peer until a period he experienced
    a frustrated time of unnecessary questions, pushback, and roadblocks. It wasn’t
    until he realized he was sending all his emails with his female peer’s signature
    that he began to realize what might be occurring. He wanted to take the experiment
    further to gather more data, not believing what was happening. He asked his female
    peer, and she agreed to further the test, and they went a week with each sending
    emails with the other’s signature. The male coworker experienced one of the most
    frustrating weeks in his career. He found it took him twice as long to get anything
    done. People questioned him at every turn and wasted his time with unimportant
    details. He even had one customer try to ask him out. All the while, his female
    peer stated she had the easiest week of her career. People didn’t argue with him
    and just did what she requested of “him,” even offering to go the extra mile.
    This was a highly publicized story, but for my husband and I, it wasn’t anything
    we didn’t already know.


    There are only a few “known” couples in the Oracle community. For Tim and me,
    it was a partnership made in heaven. We work extremely well together, are part
    of the same groups, public and private, have served on boards together, and even
    worked for the same company until recently. There have been several instances
    where Tim has advised me to communicate as he commonly would. In just about every
    instance, when I’ve taken his advice, we’ve both regretted it. It wasn’t that
    I needed to adhere strictly to what is expected of a woman or “act like a man,”
    but that success depended on careful, small changes that bridged what would be
    an acceptable, direct approach by him with what was expected of a woman addressing
    the situation.


    In one situation, Tim felt I wasn’t being as direct with my manager as I needed
    to be. He knew this manager professionally for years and asked if I wouldn’t mind
    him rewriting my proposed email draft I planned to send. He had concerned about
    my manager bypassing professional boundaries and limitations he was putting around
    my professional endeavors. Tim wrote the email and although I was hesitant, I
    also didn’t have any data that said Tim was incorrect about me not being direct
    enough. I had been using careful diplomacy in hopes of coming to a compromise.
    Tim felt that because I hadn’t set clear boundaries and expectations in writing
    with him, this was the reason I was experiencing this challenge, and he assumed
    that the problem fell more in my approach. I chose to send the email he authored,
    and a prompt response from my manager was received. My manager stated that he
    was quite dissatisfied with how direct I was and felt that maybe I needed to consider
    looking for an opportunity with a new company.


    I want to make it clear—there was no doubt that I was performing at an exceptional
    level and had received excellent previous reviews. Although there was always another
    lead who carried the official title, I was the one that mentored and was accessible
    by the team of DBAs when they needed assistance. I was also performing a considerable
    amount outside my normal role, not only benefiting my career, but benefitting
    the company. I was speaking at conferences, writing articles, locating new talent,
    and doing webinars.'
  raw: '# 3. Turning Good Intentions into Positive Changes


    As we navigate roles, companies, and our technical career, the topic of communication
    is going to come up. Communication is not just about how we speak, but about how
    we listen and observe. As I just started with Microsoft, I was given Satya Nadella’s
    new book, *Hit Refresh*.^([^(24)](#fn24)) In it, he says, “Those who actively
    listen are more likely to be heard.” Active listening is a trait that you might
    think women excel at, but in truth, we have as many challenges with it as men.
    Where men speak and are less likely to listen, women listen, but don’t do so actively.^([^(25)](#fn25))
    A recent study by scholars from Brigham Young discovered that we’re either less
    likely to interact with the person speaking or fearful to speak up when we should.^([^(26)](#fn26))
    We nod our head, stating, “We hear you,” but, we’re shaking our head to offer
    the speaker comfort and acceptance than to actively listen and interact with what
    is being said.^([^(27)](#fn27)) When we do ask questions, we often ask the wrong
    ones (most likely knowing the answer, but attempting to assure the speaker that
    we were listening), while men then go into unnecessary detail and valuable time
    into an answer we already know, wasting the time on what really needs to be discussed.
    Women’s strong observations skills note when someone is closed to continued discussion
    and will avoid a direct approach even when one is needed (which falls into that
    trust and upbringing once again).


    It’s already been established by research that communication has less to do with
    what we say and more about how we say it (Figure [3-1](#469679_1_En_3_Chapter.xhtml#Fig1)).^([^(28)](#fn28))
    Micro-expressions, full facial expressions, inflections in our voice, and how
    the people around us respond says more than the words. In a world becoming more
    dependent upon email, social media and other forms of nonverbal communication,
    even with the debunked [theory](https://ubiquity.acm.org/article.cfm%253Fid%253D2043156)^([^(29)](#fn29))
    of nonverbal communication encompassing over 90%, we still should expect challenges.


    ![../images/469679_1_En_3_Chapter/469679_1_En_3_Fig1_HTML.jpg](images/469679_1_En_3_Chapter/469679_1_En_3_Fig1_HTML.jpg)


    Figure 3-1


    Nonverbal communication


    ## Mentoring to Partnering


    Women empowerment tells us that we should be more direct in written communication^([^(30)](#fn30)),
    but I also possess deep insight on this topic due to the complex and intriguing
    relationship with my spouse. My husband, Tim, was my first mentor in the database
    world. When I first met him, I was working for a company that was challenged with
    weak leadership. Tim was brought in to help smooth over the relationship between
    one of his contract Database Administrators (DBA) and my Lead DBA. His DBA was
    threatening to walk out of the contract, and Tim hoped to negotiate common ground
    between them. I remember the first meeting with him and was thoroughly impressed
    with his technical skills and the diplomatic way he dealt with everyone in the
    room.


    Afterward, the company hired Tim to teach the DBA team some advanced database
    skills we would need, and classes with him began immediately. This was my first
    DBA position, and I was considering leaving the database team to join the other
    Jr. DBA who’d departed for the project management team. There were stronger leadership
    and female mentors on that team, which was incredibly appealing, but I was torn
    due to my attraction to a deeper technical position. Upon finishing up the database
    backup and recovery class with Tim, he asked my manager if it was true that I’d
    be leaving the Database Administration team. After my boss confirmed, he advised
    him not to let that happen, as I’d surpassed anyone else in the class and had
    strong, natural skills, something we still call, “the knack.” Yes, the man that
    I ended up dating and marrying 8 years later was an essential sponsor that retained
    me in the technical industry.


    ## Insider Information


    Over the years, our mentoring relationship has changed to one of professional
    partnership. Recently, there was a story^([^(31)](#fn31)) that was circulating
    about two team members, one male and one female, who shared an e-mail account.
    The only thing different was their signature. The male peer was under the impression
    he was more efficient at his job and hadn’t really considered there were differences
    in how customers interacted with him *vs.* his female peer until a period he experienced
    a frustrated time of unnecessary questions, pushback, and roadblocks. It wasn’t
    until he realized he was sending all his emails with his female peer’s signature
    that he began to realize what might be occurring. He wanted to take the experiment
    further to gather more data, not believing what was happening. He asked his female
    peer, and she agreed to further the test, and they went a week with each sending
    emails with the other’s signature. The male coworker experienced one of the most
    frustrating weeks in his career. He found it took him twice as long to get anything
    done. People questioned him at every turn and wasted his time with unimportant
    details. He even had one customer try to ask him out. All the while, his female
    peer stated she had the easiest week of her career. People didn’t argue with him
    and just did what she requested of “him,” even offering to go the extra mile.
    This was a highly publicized story, but for my husband and I, it wasn’t anything
    we didn’t already know.


    There are only a few “known” couples in the Oracle community. For Tim and me,
    it was a partnership made in heaven. We work extremely well together, are part
    of the same groups, public and private, have served on boards together, and even
    worked for the same company until recently. There have been several instances
    where Tim has advised me to communicate as he commonly would. In just about every
    instance, when I’ve taken his advice, we’ve both regretted it. It wasn’t that
    I needed to adhere strictly to what is expected of a woman or “act like a man,”
