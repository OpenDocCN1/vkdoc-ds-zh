- fmt: "### In Us We Trust\n\nThat brings us to our next demographic, which are the\
    \ women who have only experienced gender bias a few times, due to the industry\
    \ they’re in or because they work with really “woke” individuals. I get it, I’m\
    \ there right now at Microsoft. I feel the weight off my shoulders where I’m able\
    \ to just BE ME. Just be the best me there is without this continual bias chipping\
    \ away at what I’m trying to accomplish each day. The thing is, if we’re accomplished,\
    \ if we have power to make a change, we should lift while we rise. We women need\
    \ to recognize just because another woman has chosen to live her life differently\
    \ than us or to walk a different path, it’s not an expectation for us to do so.\
    \ We should be supportive and happy for what she is bringing to the world, find\
    \ out how we can support her, and then ask her to pay it forward to others.\n\n\
    As I touched on the last paragraph, I recognize my satisfaction at Microsoft and\
    \ its community and how it affects my drive for change. It’s not that I care less;\
    \ on the contrary, I am very aware of my privileged position in a community that\
    \ is driving for change and doing well at it. Change does require a level of drive,\
    \ often driven by dissatisfaction, of being offended, insulted, degraded, and\
    \ denied. What happens when a majority of us are satisfied with what we have?\
    \ Do we forget about those that are part of the have not? This is where I perform\
    \ a self-check and monitor not just my outlook but continue to reach out to those\
    \ who have less diversity and inclusion. It builds the passion which can change\
    \ the fight or flight response to one of continued sentry.\n\nWithout that fight\
    \ response, as well as surrounding myself with a community that had more mature\
    \ women in technology initiative, it’s important to use this; there was more sponsorship\
    \ and mentoring to go around. Other women and men allies picked up the proverbial\
    \ sword, and it didn’t rely on me so often (and rarely required my time at all!).\n\
    \nThe numbers won’t change overall until representation becomes the norm across\
    \ a majority of technical industries (Figure [8-4](#469679_1_En_8_Chapter.xhtml#Fig4)).\
    \ This is not a demand, but just an observation. Just as we’ve seen in other fields,\
    \ such as medical fields where women doctors are no longer a rarity, we must change\
    \ how culture views technologists in our media, career recommendations for our\
    \ next generation, and in public events. This is how bias is changed long term,\
    \ making women and minorities an expected and significant part of the equation.\
    \ This is when we stop saying and hearing, “We need to hire a woman for this position,”\
    \ but that by hiring the best person, a woman is chosen as often as a man because\
    \ there the chances of a man or a woman candidate are ever closing in on 50/50\
    \ odds^([^(145)](#fn145)).\n\n![../images/469679_1_En_8_Chapter/469679_1_En_8_Fig4_HTML.png](images/469679_1_En_8_Chapter/469679_1_En_8_Fig4_HTML.png)\n\
    \nFigure 8-4.  \nPercentage of men and women in the workplace, by employment status\
    \ of part-time or full-time. Source: Department of Labor Statistics, 2018\n\n\
    When the day comes that we ask children to draw a computer technician or an engineer\
    \ and a significant percentage draw a woman or a person of color, the change to\
    \ bias isn’t complete. The next generation is our gauge to how successful we are\
    \ in this battle for change. Our next generation and the percentage that decide\
    \ technology is not just a great field of study for their future career, but one\
    \ that they are satisfied to stay in, are all factors on how successful we’ve\
    \ been in changing how technology is viewed by the world.\n\nUntil that day, it’s\
    \ important that we continue to question terms like “brogrammers” and why so many\
    \ tech companies are now just collecting, rarely publishing their diversity numbers.\
    \ We are engineers, and without data, the rest is only conjecture and opinion.\n\
    \nIt was important to me to become a part of a company that understood the importance\
    \ of diversity and inclusion. When I joined Microsoft, I was aware of the significant\
    \ changes that Microsoft, now lead by the amazing Satya Nadella, had placed a\
    \ focus on. Upon my first day, I was introduced to a company that had interweaved\
    \ diversity and inclusion into every aspect of the company’s vision. It was a\
    \ sublime experience to have inclusive wording in all aspects of the company literature\
    \ and training.\n\nWhen I arrived for my official on-boarding at headquarters\
    \ in Redmond, I was left in awe by the diversity of my peers. I say in welcome\
    \ meetings, physically counting the women in the room and left dumbstruck by a\
    \ company that the representation in the room was just the same as what I would\
    \ expect to see in the city streets of Seattle. I was a woman who was accustomed\
    \ to sitting in a room of techies and often being the only woman. I might find\
    \ one or two minority in a room of 20–50 people, and here I was at the on-boarding\
    \ with Microsoft, in a room of 300 people with only 30% visibly white. I was giddy\
    \ with the diversity and inclusion, along with the potential this presented for\
    \ my new company.\n\nUnlike the Silicon Valley companies, I’d departed, Microsoft’s\
    \ leadership was more diverse, and I was presented with significant women in leadership\
    \ roles. Kate Johnson, the President and CVP at Microsoft, is ever present and\
    \ interacting with those around her. I was so impressed with her after first joining,\
    \ that I reached out on LinkedIn and asked to connect. She quickly accepted and\
    \ responded back how she was looking forward to my contributions and congratulated\
    \ me on joining the company.\n\nI’ve seen comments on message boards and forums\
    \ complaining that Microsoft is too diverse and that there is reverse bias against\
    \ white males applying, but from what I’ve experienced, it may be summed up to\
    \ how jarring it would be to feel the pressure of equal competition among a truly\
    \ diverse group of candidates when previously one was privileged and had less\
    \ to feel threatened by when one was the preferred candidate for a position. As\
    \ a white woman, equality also means that those who had greater bias than I experienced\
    \ also have more equality and I’ll attain the position if I’m the best candidate,\
    \ less often because of bias. I know it will benefit us all in the end with increased\
    \ quality of products, more well-rounded benefits and leadership that reflects\
    \ the world at large. No matter what any negative comments on forums or other\
    \ sites state, as stated in the 2018 diversity report, there was marginal change\
    \ to diversity over this last year, and the numbers make it difficult to validate\
    \ the reverse bias some have accused companies with diversity and inclusion initiatives\
    \ of.\n\nTechnology needs this change for the future of all kind. It can’t just\
    \ serve “mankind”—literally and figuratively. Technology is part of almost all\
    \ aspects of our daily lives, and with the advances in machine learning, IoT,\
    \ and AI, it is starting to creep into our appliances, our automobiles, our personal\
    \ devices, and even our clothing. It must represent all of us, not just a view\
    \ of what we think technology is.\n\nThe Boston Consulting Group (BCG) performed\
    \ research involving over 1700 companies, focused on answering this one question—“Did\
    \ diversity create greater revenue”?^([^(146)](#fn146)) The research involved\
    \ both developed and developing countries, collecting information on leadership\
    \ diversity and how it impacted the company’s bottom line.\n\nBCG had already\
    \ surmised that companies with greater diversity in their leadership would result\
    \ in backgrounds of diverse experience which would result in a wider view of how\
    \ to address challenges and an ability to adapt more efficiently."
  raw: '## In Us We Trust


    That brings us to our next demographic, which are the women who have only experienced
    gender bias a few times, due to the industry they’re in or because they work with
    really “woke” individuals. I get it, I’m there right now at Microsoft. I feel
    the weight off my shoulders where I’m able to just BE ME. Just be the best me
    there is without this continual bias chipping away at what I’m trying to accomplish
    each day. The thing is, if we’re accomplished, if we have power to make a change,
    we should lift while we rise. We women need to recognize just because another
    woman has chosen to live her life differently than us or to walk a different path,
    it’s not an expectation for us to do so. We should be supportive and happy for
    what she is bringing to the world, find out how we can support her, and then ask
    her to pay it forward to others.


    As I touched on the last paragraph, I recognize my satisfaction at Microsoft and
    its community and how it affects my drive for change. It’s not that I care less;
    on the contrary, I am very aware of my privileged position in a community that
    is driving for change and doing well at it. Change does require a level of drive,
    often driven by dissatisfaction, of being offended, insulted, degraded, and denied.
    What happens when a majority of us are satisfied with what we have? Do we forget
    about those that are part of the have not? This is where I perform a self-check
    and monitor not just my outlook but continue to reach out to those who have less
    diversity and inclusion. It builds the passion which can change the fight or flight
    response to one of continued sentry.


    Without that fight response, as well as surrounding myself with a community that
    had more mature women in technology initiative, it’s important to use this; there
    was more sponsorship and mentoring to go around. Other women and men allies picked
    up the proverbial sword, and it didn’t rely on me so often (and rarely required
    my time at all!).


    The numbers won’t change overall until representation becomes the norm across
    a majority of technical industries (Figure [8-4](#469679_1_En_8_Chapter.xhtml#Fig4)).
    This is not a demand, but just an observation. Just as we’ve seen in other fields,
    such as medical fields where women doctors are no longer a rarity, we must change
    how culture views technologists in our media, career recommendations for our next
    generation, and in public events. This is how bias is changed long term, making
    women and minorities an expected and significant part of the equation. This is
    when we stop saying and hearing, “We need to hire a woman for this position,”
    but that by hiring the best person, a woman is chosen as often as a man because
    there the chances of a man or a woman candidate are ever closing in on 50/50 odds^([^(145)](#fn145)).


    ![../images/469679_1_En_8_Chapter/469679_1_En_8_Fig4_HTML.png](images/469679_1_En_8_Chapter/469679_1_En_8_Fig4_HTML.png)


    Figure 8-4.


    Percentage of men and women in the workplace, by employment status of part-time
    or full-time. Source: Department of Labor Statistics, 2018


    When the day comes that we ask children to draw a computer technician or an engineer
    and a significant percentage draw a woman or a person of color, the change to
    bias isn’t complete. The next generation is our gauge to how successful we are
    in this battle for change. Our next generation and the percentage that decide
    technology is not just a great field of study for their future career, but one
    that they are satisfied to stay in, are all factors on how successful we’ve been
    in changing how technology is viewed by the world.


    Until that day, it’s important that we continue to question terms like “brogrammers”
    and why so many tech companies are now just collecting, rarely publishing their
    diversity numbers. We are engineers, and without data, the rest is only conjecture
    and opinion.


    It was important to me to become a part of a company that understood the importance
    of diversity and inclusion. When I joined Microsoft, I was aware of the significant
    changes that Microsoft, now lead by the amazing Satya Nadella, had placed a focus
    on. Upon my first day, I was introduced to a company that had interweaved diversity
    and inclusion into every aspect of the company’s vision. It was a sublime experience
    to have inclusive wording in all aspects of the company literature and training.


    When I arrived for my official on-boarding at headquarters in Redmond, I was left
    in awe by the diversity of my peers. I say in welcome meetings, physically counting
    the women in the room and left dumbstruck by a company that the representation
    in the room was just the same as what I would expect to see in the city streets
    of Seattle. I was a woman who was accustomed to sitting in a room of techies and
    often being the only woman. I might find one or two minority in a room of 20–50
    people, and here I was at the on-boarding with Microsoft, in a room of 300 people
    with only 30% visibly white. I was giddy with the diversity and inclusion, along
    with the potential this presented for my new company.


    Unlike the Silicon Valley companies, I’d departed, Microsoft’s leadership was
    more diverse, and I was presented with significant women in leadership roles.
    Kate Johnson, the President and CVP at Microsoft, is ever present and interacting
    with those around her. I was so impressed with her after first joining, that I
    reached out on LinkedIn and asked to connect. She quickly accepted and responded
    back how she was looking forward to my contributions and congratulated me on joining
    the company.


    I’ve seen comments on message boards and forums complaining that Microsoft is
    too diverse and that there is reverse bias against white males applying, but from
    what I’ve experienced, it may be summed up to how jarring it would be to feel
    the pressure of equal competition among a truly diverse group of candidates when
    previously one was privileged and had less to feel threatened by when one was
    the preferred candidate for a position. As a white woman, equality also means
    that those who had greater bias than I experienced also have more equality and
    I’ll attain the position if I’m the best candidate, less often because of bias.
    I know it will benefit us all in the end with increased quality of products, more
    well-rounded benefits and leadership that reflects the world at large. No matter
    what any negative comments on forums or other sites state, as stated in the 2018
    diversity report, there was marginal change to diversity over this last year,
    and the numbers make it difficult to validate the reverse bias some have accused
    companies with diversity and inclusion initiatives of.


    Technology needs this change for the future of all kind. It can’t just serve “mankind”—literally
    and figuratively. Technology is part of almost all aspects of our daily lives,
    and with the advances in machine learning, IoT, and AI, it is starting to creep
    into our appliances, our automobiles, our personal devices, and even our clothing.
    It must represent all of us, not just a view of what we think technology is.


    The Boston Consulting Group (BCG) performed research involving over 1700 companies,
    focused on answering this one question—“Did diversity create greater revenue”?^([^(146)](#fn146))
    The research involved both developed and developing countries, collecting information
    on leadership diversity and how it impacted the company’s bottom line.


    BCG had already surmised that companies with greater diversity in their leadership
    would result in backgrounds of diverse experience which would result in a wider
    view of how to address challenges and an ability to adapt more efficiently.'
  trans: "\n### 我们信赖自己人\n\n接下来要谈到的是下一个群体，即那些仅因所处行业或与真正“觉醒”的同事共事，而只经历过少数几次性别偏见的女性。我理解，因为我现在就在微软，我能感受到肩上的重担卸下了，我可以**做自己**。做最好的自己，不再有持续不断的偏见来侵蚀我每天努力想要达成的事情。问题是，如果我们已经有所成就，如果我们有能力做出改变，就应该在崛起时伸出援手。我们女性需要认识到，另一个女性选择了与我们不同的生活方式或走上不同的道路，这并不意味着我们也必须这样做。我们应该支持她，为她带给世界的东西感到高兴，找出我们支持她的方式，然后请她将这份善意传递给其他人。\n\
    \n正如我在上一段提到的，我认识到自己在微软及其社区中的满足感，以及这如何影响了推动变革的动力。这并不是说我不再那么关心了；恰恰相反，我很清楚自己在一个正在推动变革并做得不错的社区中处于特权地位。变革确实需要一定的动力，而这种动力往往源于不满、被冒犯、被侮辱、被贬低和被拒绝。当我们中的大多数人对现状感到满足时，会发生什么？我们会忘记那些仍在“一无所有”群体中的人吗？这就是我进行自我检查的地方，不仅要监控自己的世界观，还要继续接触那些在多元化和包容性方面处于弱势的人。这能点燃激情，将“战或逃”的反应转变为持续守望的状态。\n\
    \n没有了那种战斗反应，再加上我身边有一个由科技领域更成熟的女性组成的社区，利用这一点很重要；这里有更多的赞助和指导机会。其他女性和男性盟友拿起了那柄众所周知的“剑”，不再那么频繁地依赖我（而且几乎不需要占用我的时间！）。\n\
    \n除非在大多数科技行业中，代表性成为常态，否则整体数字不会改变（图 8-4）。这不是一个要求，只是一个观察。正如我们在其他领域所看到的，比如女医生已不再罕见，我们必须改变文化在媒体、对下一代的职业建议以及公共活动中看待技术专家的方式。这就是长期改变偏见的方法，让女性和少数族裔成为方程式中预期且重要的组成部分。到那时，我们将不再听到或说出“我们需要为这个职位招聘一名女性”，而是通过招聘最合适的人，女性被选中的频率与男性一样高，因为男女候选人的机率正无限接近\
    \ 50/50^(¹⁴⁵)。\n\n![../images/469679_1_En_8_Chapter/469679_1_En_8_Fig4_HTML.png](img/469679_1_En_8_Fig4_HTML.png)\n\
    \n图 8-4.  \n按兼职或全职就业状态划分，职场中男性和女性的百分比。来源：美国劳工统计局，2018 年\n\n当有一天，我们让儿童画一名计算机技术员或工程师时，有相当大比例的孩子画的是女性或有色人种，偏见仍未完全改变。下一代是衡量我们在变革之战中成功与否的标尺。我们的下一代以及他们认为技术不仅是一个适合未来职业的优秀学习领域，而且是一个他们愿意留在这个领域的满意度，这些都是衡量我们在改变世界对技术看法方面取得多大成功的因素。\n\
    \n在那一天到来之前，重要的是我们要继续质疑诸如“兄弟程序员”这样的术语，以及为什么这么多科技公司现在只是在收集，却很少发布他们的多元化数据。我们是工程师，没有数据，剩下的只是猜测和意见。\n\
    \n成为一家理解多元化和包容性重要性的公司的一员，对我来说至关重要。当我加入微软时，我就意识到由杰出的萨提亚·纳德拉领导的微软已将重点放在重大变革上。入职第一天，我就被介绍给一家将多元化和包容性融入到公司愿景方方面面的公司。在所有公司文件和培训中都包含包容性用语，这是一种非凡的体验。\n\
    \n当我抵达雷德蒙德总部进行正式入职培训时，同伴们的多元性让我惊叹不已。在欢迎会上，我数了数房间里的女性人数，然后被这家公司惊呆了，因为房间里的代表性比例完全符合我在西雅图街头所期望看到的景象。我是一个习惯了坐在科技从业者房间里，并且常常是唯一女性的女性。在\
    \ 20-50 人的房间里，我可能只能找到一两个少数族裔，而在微软的入职培训中，在一个 300 人的房间里，只有 30% 是明显的白人。我对这种多元化和包容性，以及这为我这家新公司带来的潜力，感到欣喜若狂。\n\
    \n与我离开的硅谷公司不同，微软的领导层更加多元化，我看到了众多女性担任领导职务。微软的总裁兼 CVP 凯特·约翰逊，总是活跃在现场并与周围的人互动。刚加入公司时，我对她印象非常深刻，于是我在\
    \ LinkedIn 上联系她并请求添加好友。她很快接受了，并回复说她期待我的贡献，祝贺我加入公司。\n\n我在留言板和论坛上看到有人抱怨微软过于多元化，存在对白人男性申请者的反向偏见。但根据我的经历，这可能可以归结为：当一个人以前享有特权，在作为某一职位的首选候选人时感觉受到的威胁较少，现在却要在一个真正多元化的候选人群中感受到平等竞争的压力时，这种冲击感该有多大。作为一个白人女性，平等也意味着那些曾经历过比我更大偏见的人现在也获得了更多平等，而我将因为我是否是最佳候选人（而非因为偏见）而获得职位。我知道，最终这将惠及我们所有人，带来更高质量的产品、更全面的福利以及能反映整个世界面貌的领导层。无论论坛或其他网站上的负面评论说什么，正如\
    \ 2018 年多元化报告所述，过去一年多元化几乎没有变化，这些数字很难证实一些人指责那些推行多元化和包容性举措的公司存在反向偏见。\n\n技术需要这种变革，是为了全人类的未来。它不能仅仅服务“人类”（字面意义和象征意义上都是）。技术几乎是我们日常生活方方面面的组成部分，随着机器学习、物联网和人工智能的进步，它正开始渗透到我们的家电、汽车、个人设备甚至服装中。它必须代表我们所有人，而不仅仅是我们认为技术应该是什么样子的单一视角。\n\
    \n波士顿咨询集团进行了一项涉及 1700 多家公司的研究，专注于回答一个问题——“多元化是否创造了更高的收入？”^(¹⁴⁶) 这项研究涵盖了发达国家和发展中国家，收集了关于领导层多元化及其如何影响公司利润的信息。\n\
    \nBCG 已经推断出，领导层更多元化的公司会带来多样化的经验背景，从而产生更广阔的视角来应对挑战，并具备更高效适应的能力。\n"
- fmt: 'BCG spent significant time with the 1700 company’s employees, inspecting the
    perceptions of diversity in management across six “dimensions.” These dimensions
    included age, gender, industry background, education, and even if the employee
    came from a different country than where they were working. They discovered that
    many developing nations were embracing diversity more than developed ones and
    succeeding due to it.


    Innovation through diversity resulted in revenue of 19 points higher than companies
    with below-average leadership diversity. These numbers might not look that impressive
    on their own, but when you view the overall numbers of 45% of the total revenue
    was in this area *vs.* 26% for those who had lesser diversity initiatives, you
    can understand why companies are beginning to focus on diversity as a revenue
    increase opportunity.


    ## The Diversity Gist


    What this all comes down to is why women stay and why they leave technology. It’s
    often not what we identify as the big things—like discrimination and sexual harassment.
    Those are easier to identify as impacting and wrong, so we have attempted to put
    in policies and laws to address them and move them out of the previously normal
    behaviors in society.


    It’s really about the little things—the offenses that cause the death by a thousand
    pin pricks of women in technology.


    It’s about women thinking it’s their choice in words why no one is answering their
    e-mails or collaborating with them. It’s about women focusing on the blame on
    their personality as the reason they didn’t get a promotion *vs.* their male peer
    with less experience and education. It’s about her boss justifying denying a raise
    to her because her male coworker has a family to care for, even though she may
    be a single parent. It’s about the mixed signals she receives in reviews that
    say she needs to speak up more in meetings and then accusing her of being aggressive
    and too blunt if she does.


    We have a ton of books telling women what to change, but we forget that the world
    is as much a part of the problem as it is a part of the solution. We forget that
    unless we discuss what the problem is, you can’t fix it. The rallying cry of Women
    in Technology isn’t “you are to blame” or “I am to blame,” but “we can change
    this.”


