- fmt: '2.  **Successful Diversity and Inclusion with strong, successful results,
    offering solid change.**


    In my experience, when a D&I initiative isn’t discussing the real problems, the
    participants rarely experience any change outside of the check boxes being marked.
    Women and diverse groups will continue to depart/transition, continuing a decline
    or simply stagnant numbers. There are rarely, if ever, women or anyone who isn’t
    a white male in leadership roles. As opportunities for advancement become available,
    the representation of what bias shows us should be in the role (often while white
    male peers) will continue to fill the positions. It is rarely intentional, simply
    bias that leaves the women and people of color out of the candidate list. The
    cost to the team or company is as significant as we’ve already discussed.


    In my experience, the first D&I option will continue on, confused over why the
    numbers aren’t improving and often blaming topic complexity to why they aren’t
    experiencing the improvement they hoped. They wish for change, but culture and
    those around them that have convinced them the more vital topics aren’t worth
    investigating will persist. These teams will be less likely to possess satisfying
    work environments to diverse candidates, and product will suffer from less creative
    ideas and diverse thinking.


    The second type of diversity and inclusion initiative, benefiting from honest
    conversation and effective change, I observe to have increases in women and diversity
    involvement. Satisfaction in the workplace increases and is stressed by those
    I converse with. The increase in satisfaction can be seen in surveys,^([^(142)](#fn142))
    along with a desire for more initiatives and improvement. As impressive as the
    overall improvement is, I recognize without continued dedication to diversity
    and inclusion initiatives, none of the technical communities appear to be at a
    point where their diversity and inclusion initiatives are self-sustaining. I am
    constantly performing a self-diagnosis to gauge how woke I am—how sensitive I
    am to the current state of diversity (women in technology, as I won’t pretend
    to be part of any other group of diversity).


    Being part of the second type, I recognize that I feel less in touch with the
    challenges of women in technology in those communities that have the first type
    of initiative. The peace and satisfaction I have calms the fire in one’s belly
    for change. As often as women apologize for reaching out to me for guidance, I
    am happy for it, as it stokes those fires and keeps me focused on the road ahead.


    ## It Takes a Village


    As much as we ask women to do to succeed in technology, I have to again stress
    that we’re all part of the solution. Women can change and do and be everything,
    and it still won’t change the bias that is ever present in our society today.


    Along with all the changes and initiatives we ask from women, we also need to
    reach out and change how men interact with each other, not just women. It’s about
    the clear separation between physical and emotional relationships *vs.* professional
    ones.


    Karamo Brown, from TV’s Queer Eye, states, “The biggest threat to men is toxic
    male behavior that stops them from fully respecting themselves and others. It’s
    time that men start understanding we are stronger as humans when we support and
    respect each other. And that ‘gender norms’ or ‘idealized gender specific behavior’
    is destructive to us all because it’s limiting. Men can and should be expressive,
    emotional, vulnerable, respectful, strong, and providers… as women are all those
    things as well.^([^(143)](#fn143))”


    What Karamo is stating here is not only the importance that men evolve how they
    interact with each other but also to accept that women are and should be respectful,
    strong, and providers, along with the assumed quantities of expressive, emotional,
    and vulnerable. This can be achieved by understanding that men are all of these
    things, too.


    Cory Booker is a well-known and outspoken senator from the state of New Jersey
    that has made numerous headlines about the importance of men as allies in the
    fight for equality. He said even if it isn’t popular or comfortable, it is important
    for me to stand up for women and to really listen to what they’re saying.^([^(144)](#fn144))
    I can honestly say the men that I’ve respected the most in the industry are those
    that have listened to me and grasped when there was value to the business at large.
    There wasn’t any “lip service” (a term I like to use when someone is just acknowledging
    that I’m talking but not really hearing anything that’s being said to them) from
    those I place in this category, and I recognize these individuals often with much
    stronger leadership skills because they did take the time to really listen.


    Recognizing the risk to career and at times, personal risk, by speaking up about
    bias in the workplace is important. It’s been brought to my attention that I’ve
    been passed over for recognitions, board positions, and promotions because I agreed
    to speak up. Being a voice of change isn’t easy and if you’re the one that requires
    the change (as in you’re the target of the bias), it’s even more difficult. Allies
    in the workplace and the industry is incredibly powerful, and men can help build
    upon what women are hoping to accomplish in the industry and help solidify it.


    We all need to stop viewing it as gender bias and approach it as bias that is
    deterring the human race from achieving its potential. We use the symbol of yin
    and yang all the time, but do we really comprehend what it means? If we view as
    they did in Chinese philosophy, it’s described as contrary forces that are truly
    complementary, interconnected, and interdependent in the natural world. Does this
    not describe how most view men and women? No matter how different they may view
    each other, they are part of the same whole, interrelate to one another, and are
    at their best when the strengths of both are used toward human goals. When we
    decide that one half of the whole deserves less rights, less pay, and less support
    of what will make them the most productive toward the goal of the whole, it hurts
    everyone.'
