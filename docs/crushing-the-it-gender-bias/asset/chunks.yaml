  trans: '

    ## 亲临其境


    詹·斯特拉普


    女性需要为彼此创造并维护安全的空间。女性需要成为彼此的盟友，并主动建立盟友关系；如果我们自己都做不到这一点，又怎能指望男性成为我们的盟友？我们如何对待彼此，正是向整个行业传递的信号。


    举个例子：我之所以公开讲述自己的`#MeToo`经历，部分原因在于围绕我散播的谣言。我曾告诉过几个我信任的人，结果突然之间似乎所有人都知道了——我的信任被错付了。这些谣言具有毒害性，我担心它们会阻碍我参与技术社区和专业工作。我还担心人们会发现我遭受的侵害，视我为污损或破碎之人。因此，我决定掌控自己的故事，勇敢发声。这些谣言被男性和女性不断重复，对我自身的疗愈造成了极大伤害。


    我公开讲话的动机之一就是为了对抗这些谣言。在我发声之后，起初我发现人们是抱有同情的。许多女性主动联系我，分享她们自己的故事，或表达同情。我成了女性倾诉故事的避雷针，在承受公开讲述自己`#MeToo`故事带来的冲击波的同时，也吸收着她们的痛苦。


    但随后：一片沉默。问题在于，我们总被要求“大声说出来”，对自身遭遇要“勇敢”。在我发声之后，没有一个人来关心我是否安好。没有所谓的“盟友情谊”，这一切都被遗忘了。我也被遗忘了。


    我确实减少了谣言对我生活的影响，但却用其他问题替代了它。我认为`#MeToo`故事有两种：一种是人们能够承受的较轻微的故事，另一种则几乎恐怖到令人无法忍受。不幸的是，我所遭受的侵害属于后一类，我认为这对无论男女而言都太过沉重，难以承受。如今，我会听到一些男性询问我的近况，他们想聊聊我的故事如何帮助他们更好地理解自己的伴侣。我也确实听到少数女性的声音，但不多。既然它帮助了人们，无论男女，那么我讲述故事的价值就没有白费。


    我战胜了那些带有强烈性别偏见的谣言；没有任何男性会遭受我所经历的那种痛苦。我通过掌控自己的故事，并私下帮助其他女性谈论它，做到了这一点。未来，我希望为那些与我分享故事和痛苦的其他女性做得更好。我还想指出，技术社区并非完美无瑕，它也可能包含竞争和仇恨。这与其他任何与人相关的事物并无二致。


    归根结底，力量必须源自你自身。没有人会来拯救你。但最终，你能挺过去。它可以成为你的一部分，但不能定义你；你可以专注于你的职业成就，让你的光芒比以往任何时候都更加耀眼。就像一盏碎裂的灯，因为你破碎了，光芒反而能更明亮地透射出来，你还能在沿途帮助其他女性。成为你希望为你撑腰的那种盟友。成为那个更包容、更伟大的人。


    詹是一位了不起的人，也是微软数据科学社区的技术专家。她在性侵犯这一痛苦话题及其中对女性的偏见问题上所表现出的坦诚和开放，无比勇敢。阅读她的文章激励我尝试写下我自己关于`#MeToo`故事的亲身经历，然而，这却是我反复尝试却总也无法完整诉诸笔端的主题。


    正如詹在她的经历中所讨论的，她的受侵害事实并未被质疑，但那些妄加评判或凭空臆测的人，*而非*信任她的声音、允许她掌握自己故事的人，却让谣言持续流传。这让我深有共鸣，因为我经历了非常类似的事情，但来自一个非常意想不到的群体——我的家人。我没有经历“他说/她说”的拉扯，或者与警方打交道的可怕经历。发生的事情从未有疑问；医生、护士和警察都非常友善且支持我。我的攻击者被定罪并为其罪行服刑。对我来说最大的挑战是，必须面对一个事实：社会不知道该如何应对我们所认识的强奸犯。大多数文化仍然描绘着后巷里戴着滑雪面罩、手持凶器的陌生人形象，¹³³
    等待着女性不自觉地落入陷阱。数据¹³⁴ 表明情况并非如此，而我们最终面对的是一个只能无奈沦为窃窃私语、臆测、评判和偏见的话题。


    多年来，我很少回家，与家人联系也不多，而我的家人都是好人。我的童年很幸福，有着出色的父母，但我却找不到合适的语言向他们解释，关于那个他们以为我会共度一生的男人所发生的一切。我也无法忍受家中墙上、家庭相册里还留有他照片，或是在日常谈话中听到他的名字突然被提起——那痛苦异常。直到现在，我在家人身边时仍然焦虑，时刻等待着有人无意中在谈话里提到他的名字，或遭遇其他无法回避的冲击。对我来说，与孩子和未来的丈夫共同建立新生活，比重温过去要容易得多。


    正如詹所认识和指出的那样，女性要说出一个令人不适的话题充满挑战。她们的勇敢、坦诚和同情心不仅应当被相信，更应当被**接纳**。没有评判，没有谣言，更不会有对女性职业生涯的冲击。`#MeToo`运动最终证实了大多数进行过此类公开讨论的女性早已知道的事实——曾遭受攻击、侵犯或虐待的女性数量远超我们想象，因为我们往往选择沉默。这是一个第
    22 条军规式的困境。说出来，它可能会影响你的生活、你与周围人的关系，甚至你的事业。随着这个话题得以公开讨论，我对于未来几代人能更好地处理这一切抱有希望，相信情况会向好的方向转变。

    '
- fmt: '# The Young and the Needless


    N.Z.


    As a woman in tech in her late 20s, you''d think that I might have experienced
    my share of gender bias. Surprisingly, that has never been the case for me personally.
    However, I often find myself having to prove my worth, since almost everyone I
    meet thinks I look very young to be responsible for initiatives that probably
    people at least 10 years older than me should be leading. Believe it or not, being
    a millennial woman in today''s workplace, and also looking much younger than one
    actually is, can lead to some uncomfortable situations.


    I graduated with a technical degree at 21, and right after I started my career
    in a multinational corporation. I''ve always loved to help out when challenging
    business problems crept up. Add to that mix a natural ability to connect with
    people of all org levels and functions in understanding the root cause of their
    concerns, I found myself being promoted into high exposure roles early on. In
    collaborating with experienced colleagues, I always followed a style of inclusion,
    respect, and empathy while being confident in my abilities. This approach helped
    me deal with this unique type of age bias.


    When I recently applied for a seat in the board of a technical user group, I was
    immediately told that even though I had many valuable ideas that would benefit
    the community, I was way too young and enthusiastic to be trusted with the future
    of the organization, and its finances. Meanwhile, I am one of the two people in
    a large Finance IT team responsible to manage a considerable multi-million-dollar
    budget. I must be honest, I did doubt myself, and I almost stepped down from pursuing
    that opportunity.


    What helped me proceed with confidence was the advice, and support of several
    of my mentors. When you’re young, it is important to assess your decisions by
    relying on a network of seasoned mentors that will not hesitate to speak truthfully
    based on their experience. It is up to you to then decide what is reasonable to
    pursue after evaluating all opinions.


    What NZ describes in her story is a form of bias, one based on age. We often hear
    ageism identified with those who are older, and I have witnessed it, especially
    in the very hip, young-obsessed, silicon valley, but I have mentored more than
    one individual who showed immense skill, ambition, and intelligence, yet came
    up against the bias that they were too young to be judged on their merits than
    their peers older than them.


    The second part of the author’s experience revolves around a bit of imposter syndrome
    (don’t so many of us experience this) and recognizing how difficult it is to view
    ourselves, our true capabilities when we may have those times of doubting ourselves.
    I experienced this myself, while young, feeling very homely, foolish, and stupid.
    It took me some time to realize that I needed to trust myself, to not put so much
    faith in other’s words and learning that the biggest way to overcome doubt was
    to try. “Fall down seven times, get up eight.” Getting up and succeeding, where
    others have given up is the difference between failure and success. I have no
    doubt that we will all see great things come from the preceding author—she has
    an incredible amount to give to the technical industry!


    We’re now getting into the stories submitted by women who requested to remain
    anonymous. The reasons to do so are as various as the experiences they’ve had.
    Some realize how important it is to discuss these challenges, but not to embarrass
    those involved or the companies they work for. Some wish they’d taken on the culprit
    directly, but feared for their jobs, the future of their careers, etc.


    The first story from our anonymous writers surrounds the challenges of women being
    passed up for promotions, even when they’re the more qualified candidate. I don’t
    know how often I’ve heard that women were the “functional lead” or the “acting
    manager” but never the one to hold the official title. They were often quite satisfied
    with the unofficial role until a male candidate was brought in, often less skilled
    or experienced, yet awarded the role, the title, and the salary. If they asked
    why they weren’t considered or why they were passed over, there was often conflicting
    reasons given or they’re asked why they can’t just be satisfied with what they’d
    been given.


    The continual cost to women’s careers, salary, and loss in opportunity is evident.
    Anyone who lacks comprehension of these situations and ponders why a woman would
    accept the responsibility or not demand to be recognized for the role they are
    filling hasn’t realized the jeopardy many of them end up in if they do make demands.
    Many simply aren’t comfortable with women’s ambition, and negotiating is enough
    to cause some discomfort.'
  raw: '## The Young and the Needless


    N.Z.


