    ## The Bias in All of Us


    Randolph West


    I’m white and present as male. About a decade ago, I worked on something I liked
    to refer to as the “Project from Hell” and eventually left the company.


    After a few months, I returned to visit a colleague, who introduced me to a black
    woman sitting in my previous desk. My immediate reaction was surprise, but that
    quickly turned to embarrassment. I''m supposed to be a paragon of equal rights,
    and for a fleeting moment I had a stereotypical reaction caused by implicit bias,
    that a black woman couldn’t be in the position I once held. To cover for my red
    face, I apologized out loud for my mistake. I''d like to apologize today for my
    initial reaction, too.


    I think self-examination is one of the most powerful skills we can possess. I’ve
    had to assess my own bias over the years as I realized that I couldn’t expect
    to be treated as an equal if I expected a man to pay on dates or didn’t take responsibilities
    that were expected of my male peers, such as lifting heavy equipment, etc. It’s
    not easy to hold ourselves to the accountability that we expect of the world,
    but it’s the first step to a more fair and just society that lives in it.'
  trans: '

    # 沉默是金


    道格·高特


    我于 1987 年出柜，尽管在那之前很久我就知道自己是同性恋。从那时起，我就对我接触到的几乎所有人——无论是家人、朋友还是同事——都非常坦诚。


    1990 年，我搬到了德克萨斯州的达拉斯，并开始为一家"四大"咨询公司工作。我当时很年轻，也很享受能借出差机会游历全国、用前沿技术做些酷事的机遇。


    每个周一早上，无论背景如何，员工们都会聚在一起，分享各自的周末趣闻。当时，我觉得能有如此开放包容的一群工作伙伴真是棒极了。我不明白为什么我的同性恋朋友们都告诫我要小心。


    在我被公认为公司的重要资产和贡献者两年后，我被叫到当地分公司经理的办公室，并被告知我被解雇了。这位经理相当保守，他给出的解雇理由是："你的生活方式选择与公司的价值观不符。"


    我深受打击，并开始害怕：我被告诫过，公开、诚实的生活是不现实的，而且这会对我的职业生涯产生严重影响。这是一个可怕的醒悟，但我拒绝接受。我在一家规模小得多的咨询公司找到了新职位，并发现他们不仅看重员工的硬技能，也同样重视他们多元化的个人特质。在经历了上一份工作后，我仍对分享太多个人生活心存戒备，但多年来，我与那里的许多员工都变得亲近了。


    到了 1994 年，我已经做了几个月的咨询项目，并且克服了将个人生活与工作分开的恐惧。这家本地的企业物业管理公司采用相当开放式的办公设计，我与他们的全职员工坐在一起，几乎没有隐私可言。


    一天下午，我接到了我咨询公司办公室经理的电话——一位我认识很久的人——问我是否参加圣诞派对，以及是否会带同伴。她向我保证，我非常欢迎带男朋友来，通话很简短。那天晚些时候，我被叫到客户主管的办公室，得知有人偷听到了我的电话，并向他表达了担忧。他告诫我要保持私生活的私密性，并建议我利用个人时间接听电话。


    我的旧日恐惧再次袭来，担心我会为那些被认为会危及我或我合同公司的行为而负责。我曾想象自己随时可能被扫地出门，但最后却风平浪静，直到我所在公司举办圣诞派对的当晚。


    我把这件事告诉了我所在公司的老板和办公室经理。他们都没有接到那家物业管理公司主管的任何消息，并且两人都表示，即使对方联系了他们，他们也会毫无保留地支持我。


    那天晚上的谈话让我印象深刻的不是说了什么，而是怎么说的。他们以一种理所当然的方式让我明白，我根本不应该为此担心，而且将来在任何类似的冲突中，他们都会支持我。


    这个微小却意义非凡的举动，在我整个职业生涯中都一直伴随着我。


    在困难时期拥有盟友至关重要。这能让一个情境从成为我们对职业不满的原因之一，转变为促使我们投身于事业的理由。盟友能建立我们对团队成员和领导层的信任。当个人感受到身边人的支持与尊重时，这会激发对公司的忠诚，并加深对公司愿景的信念。


    我一直非常珍视那些愿意在处境尴尬时挺身而出、作为盟友支持他人的社区成员。这需要巨大的内在力量，并彰显了品格。当有人不辞辛劳地成为你的盟友时，这是一个难以忘怀的举动。


    我所在社区中的另一位杰出人物是伦道夫·韦斯特。我记得他如何立即欢迎我加入微软社区，以及他在与任何人交谈时流露出的智慧。他的魅力之一在于能让你立刻感到被接纳，但正如他在他的文章中所强调的那样，我们都有让自己大吃一惊的时候。


    # 我们每个人心中的偏见


    伦道夫·韦斯特


    我是白人，外表呈现为男性。大约十年前，我曾参与一个我称之为"地狱项目"的工作，并最终离开了那家公司。


    几个月后，我回去看望一位同事，他把我介绍给了一位坐在我原先座位上的黑人女性。我的第一反应是惊讶，但很快变成了尴尬。我本该是平等权利的典范，但在那一瞬间，由于内隐偏见，我产生了一种刻板印象——以为一位黑人女性不可能胜任我曾担任的职位。为了掩饰我通红的脸，我大声地为我自己的错误道歉。今天，我也想为我最初的反应道歉。


    我认为自我审视是我们所能拥有的最强大的技能之一。多年来，我不得不评估自己的偏见，因为我意识到，如果我期望约会由男方买单，或者不承担那些通常期望男性同龄人承担的责任（比如搬运重物等），那么我就不能指望自己被平等对待。用我们期望世界所拥有的标准来要求自己并不容易，但这是迈向一个更加公平公正的社会所必须的第一步。

    '
- fmt: '# The Color of Technology


    Anonymous


    I know we joke about the reality of this, but presenting at technical events can
    be wrought with anxiety when you’re the only black person in the room. You know
    there’s a few people out in the audience that are already assuming you grew up
    in the ghetto and not that you’re from a middle-class family in the suburbs. You
    sometimes feel like you’re caught between two cultures, since if there is another
    black person in the room, they will undoubtedly come up to you and try to bond,
    even if you don’t have anything in common.


    Don’t get me wrong, I have my black friends, those few and far between, that also
    attend. We come up to each other, greet each other, and discuss how it’s not getting
    any better. We lament about all the women in technology events and how little
    anyone cares about people of color.


    The truth is, we are part of the world and the more we become part of tech, the
    better technology is. How many founders in Silicon Valley are immigrants? Pretty
    impressive numbers when you look at those from China, India and others, but a
    lot fewer blacks, like Charles Hudson, Tristan Walker, and Kimberly Bryant. We
    can count them on our hands, making the numbers in our favor of succeeding in
    tech based on representation downright dismal.


    The good news is, there are friends I know that are trying to change this. I have
    a friend who runs a great volunteer group in Atlanta, bringing tech to inner city
    kids. There are groups like Kimberly Bryant’s “Black Girls Code” and others that
    are introducing tech to the next generation of technology that might not have
    had the opportunity due to demographic, quality of life, or education resources.


    It gives me hope for the future I’m no longer searching for the one other black
    person in the room.


    I remember the first time this friend shared this story with me after I prodded
    him with my concerns over diversity being presented as women in technology and
    being sadly aware that was not the whole case that needed solving. I’d experienced
    him coming up to a black woman friend of mine, giving her a hug and after a fist
    bump, saying, “fellow black person.” I was alarmed by the truth of it all. As
    impressive as the women in technology initiative is in the Microsoft community,
    in the speaking circuit, I’d noticed that the number of people of color wasn’t
    significantly higher than that of the Oracle one and asked one of the few black
    men I’d become friends with about it. He confirmed what I’d observed and said
    there was considerable room for improvement.


    This is one of the hurdles that we need to overcome. How would changing education
    curriculum so that everyone learned technology on equal footing with core subjects
    (reading, writing and arithmetic) do for diversity in technology for people of
    color?


    Would increased representation, not only in tech, but in leadership, for people
    of color help impact the never-ending cycle of poverty that is experienced by
    greater percentage that should exist? Would it help to change the bias we see
    in how people of color are portrayed in the media and treated by law enforcement?
    How much could we change by just introducing technology to the masses instead
    of the privileged few?


    Could this change impact the dismal numbers of blacks and Latinas in technology?


    The preceding stories are just a few that I requested from the community. I could
    have reached out to a large group but chose to keep it to this group, as I felt
    it covered a diverse number of topics and included people that came from numerous
    backgrounds and countries, not just the United States.


    I’d like to publicly thank everyone who wrote a story for this chapter. I believe
    by experiencing this from many voices, more ears shall hear them.


    Footnotes [1](#469679_1_En_7_Chapter.xhtml#Fn1_source) [2](#469679_1_En_7_Chapter.xhtml#Fn2_source)
    [3](#469679_1_En_7_Chapter.xhtml#Fn3_source)


    # Closure and New Beginning


    With all that we’ve discussed in the previous chapters, early career, advancement,
    women in technology, and the stories of those women who’ve overcome challenges
    and how they’ve succeeded, there remains the question “Where do we go from here?”'
