  trans: '

    # 我对偏见的认识


    在这个行业摸爬滚打了十年后，我迎来了与一位女性同僚合作的最后机会之一，我们称她为"安"。早在 2004 年，安曾是我的首席数据库管理员，我非常尊重她的技术能力及其领导才能。在目睹了她前一年充满挑战和混乱管理决策的遭遇后，她被迫离开了我们共同任职的公司。她与一位男性同僚"乔治"之间产生了冲突，矛盾持续升级，却未得到管理层或人力资源部门的调解，最终她选择辞职。我对自己无法提供帮助感到无力，因为我和这两位当事人都是朋友，并且当初推荐了他们各自的职位，使他们得以入职这家公司。我确信无疑地意识到，我亲眼目睹了乔治因安的天然领导力而产生的不安全感。


    数据库管理员的工作往往压力巨大，而我们所在公司由于业务需求，压力更甚于平均水平。当灾难降临时，安表现得冷静而深思熟虑；而乔治，无论技术多么精湛，却总是脾气暴躁，动辄对周围的人发火。虽然对乔治的行为感到失望，但更让我沮丧的是管理层——他们看不到安的领导才能，反而在雇佣两人仅仅一个月后，就让乔治晋升到了安之上。当初我推荐雇佣他们时，明确建议让安担任领导角色，让乔治承担执行任务，因为他正如我所评价的那样，是一匹"老黄牛"——我自己也属于这种类型，所以很容易识别。


    随着安和乔治之间的矛盾激化，人力资源部门几乎无力掌控局面。安离开了公司，并在不久后从技术界退休。安的离职对我打击很大，我试图弄明白当初如何才能帮上更多忙。几个月后，我也离开了这家公司，失去了两位同僚，也失去了一位朋友。我失去了安这位同僚，因为我觉得自己辜负了她；也失去了乔治这个朋友兼同僚，因为我不确定究竟是谁辜负了我们所有人。


    不久后，我联系了安并约她共进午餐。初次见面时，她给出的离开技术行业的理由听起来合情合理，但从她说话的方式、语气中的伤感，以及我对她经历的了解来看，我知道事情远不止如此。


    安起初不愿多说，但当我强调自己为所发生的一切感到困扰时，她似乎因找到倾诉对象而松了口气。我承认自己在应对整个事件时存在失误，不确定当初如何能在前公司更好地支持她。我与她进行了长谈，并在接下来的几个月里多次交流。她描述了数十年来阻碍她职业发展的种种挫折以及持续不断的小挑战。这些情况中没有一件是明目张胆的歧视，但全都是难以明确界定的显性偏见。她曾试图解决，却屡屡惨败，因为这些情况都处于灰色地带。而她向我倾诉得越多，我越意识到自己也曾经历过许多类似的挑战。和安一样，我过去并未将这些归为性别问题，只是单纯以为只有自己遇到这种情况。在我职业生涯的这个阶段，"偏见"这个词很少被提及（即便有也很少）。而此时此刻，我们正在说出无数女性默默诅咒却不敢言说的心声。


    ## 女性同僚的消失


    我与安的经历发生在 2011 年，比谢丽尔·桑德伯格出版其畅销书《向前一步》早了两年。当时无论是纸质媒体还是网络上，关于女性在科技行业面临挑战的报道都少之又少。当我发现越来越多女性处于岌岌可危的境地时，我开始深入探究这些挑战，试图理解我们世界中偏见的根源。那时，在我自己的职业圈子里，我曾与
    50 多位男性和 13 位女性数据库管理员共事。经过快速研究（图 1-1），我发现我的一位前男性同僚已退休离开数据库管理行业，但女性同僚的情况则截然不同。与我共事的十三位女性中，有八位已经离开了技术行业。三人虽然退休，但都属于提前退休（五十多岁），其余人则转行进入了其他通常更多元化的领域。这些数字引人深思，我意识到自己必须深入挖掘，了解背后的原因。


    ![../images/469679_1_En_1_Chapter/469679_1_En_1_Fig1_HTML.png](img/469679_1_En_1_Fig1_HTML.png)


    图 1-1. 我数据库职业生涯中的同行业同僚史及女性同僚的消失


    天生的好奇心使我成为敏锐的观察者，但即使是自己的偏见也会蒙蔽你的双眼。我突然面对这个事实，意识到从我第一份数据库管理员工作起，偏见就已存在。当时我与另一位女性"黛比"同时被聘为数据库管理员，但我们两人都没有相关经验。黛比刚毕业，拥有计算机科学学位并专攻数据库技术。她单身未婚，没有孩子；而我已婚，有三个孩子（包括一个新生儿），并且没有任何数据库技术的学位或认证。她似乎凭借多年的正规教育迅速适应了工作，而我则全靠自己的天分和才智艰难支撑，希望没人注意到我对数据库知之甚少。黛比拥有技能，而我则是那个"假装直到成功"的人。


    入职九个月后，黛比找到我说："凯琳，我是一名在科技行业工作的黑人女性。这行真的干不下去，我决定转到项目管理团队去。"虽然感到惊讶，但我理解她离开的原因。我们的团队领导能力很差，而项目管理团队则由一位极具天赋且天生具备领导才能的女性领导。我记得自己当时想："如果她拥有所有这些优势都无法坚持，那我又怎么可能做得到？"我从宏观层面接受了她离开的原因，但并未将偏见的影响、女性在科技行业的处境以及多元化等因素纳入考量。我自己的偏见告诉我，这只是她个人的决定，而我的白人特权或类似的挑战与我的成功和失败毫无关系。

    '
- fmt: '# Power in Numbers


    The numbers (Figure [1-2](#469679_1_En_1_Chapter.xhtml#Fig2)) show how people
    of color are some of the least found in technology. Undistinguishing by gender,
    blacks only make up less than 3% of tech positions, while Hispanics make up less
    than 5%.^([¹](#fn1)) The National Science Foundation calculated data on people
    who were employed in fields outside their tech degree (or unemployed with a technical
    degree) and found that the percentage of men and women of color were much higher
    than for white men. ^([²](#fn2))


    ![../images/469679_1_En_1_Chapter/469679_1_En_1_Fig2_HTML.jpg](images/469679_1_En_1_Chapter/469679_1_En_1_Fig2_HTML.jpg)


    Figure 1-2. Underutilization of people in color in the technical industry


    Many of us in the technical community have already noticed the lacking diversity,
    not just how few women there were in the industry. As I began to present at technical
    events, I noted how the few people of color would connect and that no matter the
    strength of initiatives for Diversity and Inclusion appeared to be, the ability
    to break through and have a true representation from people of color hasn’t occurred.


    The challenge may partly lie in economics and how we fund schools (Figure [1-3](#469679_1_En_1_Chapter.xhtml#Fig3)).
    Along with increased risk of poverty for people of color, schools are funded based
    on property taxes for a local district. If a student is already in a low-income
    family and belongs to a district that’s low income, the school district will receive
    less funds in the way of local business and property taxes toward per student
    education expenditures than a district that has a larger influx of tax dollars.


    ![../images/469679_1_En_1_Chapter/469679_1_En_1_Fig3_HTML.jpg](images/469679_1_En_1_Chapter/469679_1_En_1_Fig3_HTML.jpg)


    Figure 1-3. Spending per student, by school district in the United States


    Adding to the challenge are the limited resources schools have and how education
    is focused *vs.* the workforce (Figure [1-4](#469679_1_En_1_Chapter.xhtml#Fig4)).
    When I was in high school in 1980, I was offered programming classes to learn
    `Basic`, as well as computer architecture. My children are attending school 30
    years later, yet we have 41 states that still don’t require any technical education
    toward a high school diploma.


    ![../images/469679_1_En_1_Chapter/469679_1_En_1_Fig4_HTML.png](images/469679_1_En_1_Chapter/469679_1_En_1_Fig4_HTML.png)


    Figure 1-4. Open technical positions vs. Computer Science graduates


    Kids who are offered computer classes in school are more likely to be taught office
    technology (spreadsheets, word processing documents, and presentations) *vs.*
    actual critical thinking or programming education. Colorado has one of the highest
    average college educated populations in the United States, yet for my children
    to attend a class on `Java` programming, they would need to attend a vocational
    school. The vocational school in my district already has the stigma of attendance
    by those who can’t graduate with the average population, so what does this say
    about the future of technology?


    The Bureau of Labor and Statistics has estimated 1.4 million new technical jobs
    by 2020 that we will require a skilled workforce to fill, but per CS Education
    Statistics, the United States will have approximately 400,000 graduates in Computer
    Science to fill them.^([³](#fn3)) The goal of education is to prepare young adults
    for the future, but if we continue to focus the bulk of secondary education (reading,
    writing, and arithmetic) on literature, history, and biology and still see technology
    as a “club” or “after school meetup,” we will fail to ever teach technology as
    the center of our job industry future. How many English Lit majors and History
    majors are currently working in their field or without a job? We teach literature,
    history, and biology with the idea that a student may have the opportunity and
    passion to make a career of it. Shouldn’t we be teaching technology with the same
    investment toward graduation? With the percentage of technologists that we’ll
    require in the next decade, the way we view technical education has to change.


    Therefore, I support many of the grassroots programs to bring technology to kids
    outside of the public-school system. `Black Girls Code` is well known, but Atlanta’s
    Jeremy Harms, who runs `Vine City Code Crew`, is an incredible example of bringing
    code to inner city kids that may not have the opportunity to gain a passion from
    code at home, due to low income, or in schools due to lacking resources. Founder
    Kira Wetzel brought us `Girls + Data`, which I was first introduced to by Mindy
    Curnett, which offers girls the opportunity to learn in an environment that teaches
    code in a less intimidating way, finding the technologists of tomorrow. Locating
    these grassroots organizations who introduce technology to kids who might not
    otherwise get the chance isn’t too difficult. Just open an account on `meetup.com`
    and do a search; more are being created every day as more realize how important
    it is to create builders of tech, not just consumers.'
