    # 那一课


    Opal Alapat


    我在科技领域摸爬滚打了近二十年。在此期间，我学到了许多宝贵的经验。想分享的第一课，是关于我如何学会与男性恰当相处的成长历程。有些时候，我是项目中唯一的女性，感到被孤立、不被接纳。我不是那种会靠附和低俗笑话、跟着团队去绅士俱乐部来融入的女性，因此我不得不另辟蹊径，与男性同事建立关系。我用技术证明自己，并在合适的场合与他们交往。我不是一个“受欢迎”的同事，因为不忠于“兄弟会”而承受了许多负面批评。当时这让我很困扰。如今，我为自己的行为感到骄傲，也绝不后悔。我认为任何人都不该有压力去适应一个让自己不自在的环境。


    第二课，是我学会如何更好地与女性相处。我职业生涯中最灰暗的时刻，莫过于女性之间的相互倾轧。在男性主导的世界里待得太久，我形成了许多盲点。我付出了惨痛的代价才明白，自己的言行可能会被错误地理解与评判。我必须重新学习如何与女性沟通。这帮助我拓宽了视角，学会与不同背景的人交流，包括不同种族和代际的人。有时候，这依然像一场艰苦的战斗，但正因如此，我成为了一个更好的女性。


    最后要分享的一课，是关于在一个女性仍可能被忽视的行业里，找到自己的声音。在我职业生涯早期，有一次升职机会被错过，因为我的经理忘了提交相关文件。很难说这是否与性别有关，但我记得所在团队里的男性同事从未遇到过这类问题。我申请更换了经理，并在新的指导下蓬勃发展。我也目睹了女性同事的痛苦：她们发现自己薪水低于男同事，或者加薪机会被转给了对应的男性同事。我的一位朋友在升职中被忽略，被告知她的男同事会给这个职位“带来更多可信度”，尽管她拥有多年更丰富的经验。我认为，我们这一代以及更早一代的许多女性，从小被教育要相信：不应该大声说话，要对别人好（即使这意味着牺牲自己），不要制造麻烦。克服根深蒂固的教养对我而言仍是一个挑战，但我已经学会为自己奋斗，为自己挺身而出，以更自信的姿态发声去竞争。过去二十年里，情况已经有所好转，我对未来的女性世代抱有更多希望，但这个行业仍有很长的路要走。


    今天的我，已不同于十年前、甚至二十年前的自己。如今，我努力不让别人打倒我。如今，我为我所信仰的而战。如今，我以身作则。我频繁演讲、在社交媒体上定期宣传技术领域的女性、直言不讳地谈论不平等问题，并自愿担任领导角色——这一切都有其原因。如果我能做到，其他人也能。如果我在那里，下一代女性会看到，并明白女性技术专家很重要。我会继续为正义而战。


    回首往事，对比现在的自己与初入行时的模样，可能会让人心生畏惧。我们能识别出当年的天真，或是激情与干劲，与今日的自己所拥有的一切。但随着其他特质逐渐淡化，我们最应获得的，是智慧。我们应该感到自己变得更加自信，并且能够接受——即便无法理解——人性，这比初入行时要好得多。


    在讲述 Opal 的故事之后，我再分享另一位 Oracle ACE 总监、业界令人钦佩的女性——Michele Kolbe-Hardwick 的故事。当我联系
    Michele，请她为本书分享一个故事时，我也向她坦白，我觉得自己在她职业生涯早期辜负了她。曾有人建议我，如果我为她提名一个奖项，别人会以为只是因为她是个女人，而不是因为她显然当之无愧。我退缩了，以为是在保护她的机会。直到多年后，我站出来要求她最终获得认可时，我才意识到，我一直在担心别人认为我支持她仅仅因为她是女性，而不是不顾他人看法、坚持做正确的事——而这本就是我最初就该做的。


    # 那个赞助人


    Michelle Kolbe-Hardwick


    我一直以为自己从未受到过行业偏见的任何影响。我觉得自己一直得到共事男女同事的巨大支持，并且通过证明自己的专业能力赢得了尊重，而且我总能获得证明自己的机会。


    几天前，我和我的第一任经理叙旧，才意识到自己在这个想法上有多天真。她告诉我，在我面试毕业后的第一份工作时，她的男经理想录用另一位候选人——一个男性。他的理由是，他觉得我技术不够强。她请他不要被我的年轻、金发、热情和性别所迷惑，因为她觉得我技术非常扎实，尤其是我拥有计算机科学学位，而另一位候选人没有。她说服了自己的上司，应该让我们俩都做一次技术测试。


    我表现出色，而另一位候选人则没有。这让我最终被录用，并开启了一段辉煌的职业生涯。如果没有我的经理顶住她上司的偏见，坚持认为我是合适的候选人，我就不会有今天的成就。


    我深深地感激她在招聘过程中给予我的支持，而不是仅仅听从她上司的意见。

    '
- fmt: '## Being There


    Jen Stirrup


    Women need to create and maintain safe spaces for one another. Women need to create,
    and be, allies for one another; if we can’t do that for ourselves, then why would
    we expect men to be our allies? How we treat one another is a message to the industry.


    Here’s an example: one reason I spoke out about my own `#MeToo` story is because
    of the rumors being spread around about me. I had told a few people whom I trusted,
    and suddenly everyone seemed to know about it; my trust had been misplaced. The
    rumors were pernicious, and I was concerned that the rumors were preventing me
    from participating in technical community and professional work. I was also concerned
    that people would find out about my assault and would regard me as tainted or
    broken. So, I decided to own my story, and I spoke out. These rumors were being
    repeated by men and women, and it was very damaging to my own healing.


    I was partially driven to speak out to combat these rumors. After I did speak
    out, I found that people were sympathetic—at first. Many women reached out, with
    their own stories, or to offer sympathy. I became a lightning conductor for women
    with their stories, and I was absorbing their pain while working through the shockwaves
    of telling my own `#MeToo` story publicly.


    But then: silence. The issue is that we are asked so often to “speak out” and
    be “brave” about our issues. After I spoke out, nobody checked in to see if I
    was ok. There was no “ally ship,” and it was forgotten about. I was forgotten
    about.


    I had decreased the impact that the rumors were having on my life, but I had replaced
    it with other problems. I think that there are two types of `#MeToo` stories;
    the lesser ones that people can stomach, and the ones that are almost too horrific
    for people to bear. Unfortunately for me, my assault was in the latter category
    and I think that it just was too much for people, both men and women, to bear.
    Now, I hear from men who ask how I’m doing, and they want to talk about how my
    story has helped them to understand their partners a lot better. I do hear from
    a few women, but not many. Since it helped people, both men and women, the value
    in telling my story wasn’t lost.


    I overcame the rumors that were very gendered; no man would have been subject
    to the pain that I was being put through. I did it by owning my story, and helping
    other women talk about it privately. I want to do better in future for other women
    who share their stories and their pain with me. I also want to point out that
    the technical community isn’t perfect, and it can involve competition, and hate.
    It’s just like anything else involving people.


    Fundamentally the strength has to come from you. Nobody is coming to rescue you.
    Ultimately, though, you’ve got this. It can be part of you, but not define you,
    and you can focus on your professional successes so that your light shines out
    more brightly than ever. Like a shattered lamp, your light can shine out more
    brightly because you are broken, and you can help other women along the way. Be
    the ally who you’d like to have your back. Be the bigger person.


    Jen is an amazing person and a technologist in the Microsoft data science community.
    Her honesty and openness about the painful topic of sexual assault and the bias
    toward women involved is immensely brave. Reading her articles has inspired me
    to attempt to write up my own experience with my own `#MeToo` story, and yet it’s
    the one topic I repeatedly fail to put completely to paper and ink.


    As Jen discussed in her own experience, her assault was not questioned, yet rumors
    persisted from those that were passing judgment or making assumptions *vs.* trusting
    her voice and allowing her to own her story. This resonates with me, as I experienced
    something quite similar, but from a very unexpected group—my family. I didn’t
    have the `he said/she said` or horrendous experience with the police. There was
    never a question of what happened; the doctors, nurses, and police were kind and
    supportive. My attacker was convicted and served time for his crime. The biggest
    challenge for me was dealing with the fact that society doesn’t understand how
    to deal with the rapist we know. Most cultures still picture the stranger in the
    back alley,[^(133)](#fn133) ski mask and weapon, waiting for a woman to unwittingly
    fall into his trap. Data[^(134)](#fn134) demonstrates that isn’t the case and
    what we’re left with is a topic that is unwittingly left to whispers, assumptions,
    judgements, and bias.


    I didn’t visit home or keep as much contact with my family for many years and
    my family are good people. I had a good childhood, with wonderful parents, but
    I couldn’t find the words to explain to them everything that happened with a guy
    that they thought I would spend the rest of my life with. I also couldn’t bear
    the pictures with him included on the walls, in family albums, or his name popping
    up in casual conversation—it was immensely painful. I’m still anxious around my
    family, waiting for someone to obliviously bring up his name in a conversation
    or other unavoidable shock. For me, it was easier to just build my life with my
    children and future husband than it was to revisit the past.


    As Jen recognized and addressed, for women to speak up about an uncomfortable
    topic is challenging, and her bravery, her honesty, and compassion must not just
    be believed, but **ACCEPTED**. No judgements, no rumors or worse, impact to a
    woman’s career. The `#MeToo` movement has finally verified what most women who
    have these open discussions already knew—the numbers of women who were attacked
    and assaulted or targets of abuse is far wider than we ever imagined because we
    are so often silent. It’s a catch-22 situation. Speak up about it, and it can
    impact your life, your relationships with those around you, and even your career.
    With the change to open up this topic, I have hope to change for the better on
    how generations to come will better deal with it all.'
