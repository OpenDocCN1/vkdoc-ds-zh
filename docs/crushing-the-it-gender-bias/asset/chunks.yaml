- fmt: '# The Only Woman in the Room


    Ruth Czuprynski


    There is a song in the musical *Hamilton* about being in “the room where it happens.”
    In my career, I was often the only woman in that room. While many women jump at
    the chance to have a seat at that table, I was not one of them. This narrative
    explains why I felt that way and what I learned from those experiences.


    There have been times in my career where I was the only woman in a meeting, working
    on a project, or in a management role. In all of these situations, I was often
    overwhelmed with feelings of intimidation, insecurity, and self-doubt. Questions
    predominant in my mind were:


    - Would I be able to voice my ideas cogently?

    - Would anyone listen to me and value my opinions?

    - Would my ideas make sense to those I worked with?

    - If my idea was selected for implementation, would it be successful, or would
    I be blamed for failure?

    - Was I chosen to participate in those meetings or projects not for my abilities
    but to represent the “token” woman?


    My career over the last four decades spans the same timeframe that saw many American
    women enter the workforce in supervisory and managerial positions *en masse* for
    the first time, so it’s really been a polyglot of experiences:


    ## 1980s: The Wall


    I started working for a health care conglomerate in my 20s, but in my early 30s
    I found myself in a new supervisory role. I didn’t actively seek that position
    of leadership, but my male boss saw me as capable enough to be promoted. In those
    years, I was the only female working in a management level, leading a group of
    about 40 employees in a testing lab environment. I found that role challenging
    but doable, but when I found myself in a room full of other male managers, my
    mind told me that I was not capable. I was quiet and didn’t volunteer opinions
    unless I was asked. I often felt invisible in a group setting.


    My male manager never really provided any coaching as to how to act or respond
    in meetings or in other male-dominated situations; he didn’t seem to know how
    to be a mentor. I tried to watch others and learn by observation, but I still
    had these nagging feelings that any contributions I made would not be worthy.
    I was also hesitant to ask for guidance as I had the feeling that since I had
    been promoted to this position, I should already know what to do and how to act.
    I received some feedback at annual review meetings, but it was not detailed and
    was more of a “you’re doing fine.” I didn’t feel that there was anyone in the
    organization that I could be frank with about my struggles. I knew that I could
    not be successful if I let self-doubt control me, but I didn’t know how to overcome
    those feelings. I let the opportunity pass by to be more assertive as I was unsure
    of the reaction I would get if I behaved that way.


    ## 1990: Working 9 to 8


    I shifted my career to a different division in the same conglomerate but a whole
    new role—Quality Manager—engaging with medical device engineers who were predominantly
    male. I often attended meetings with these engineers, but my manager (also male)
    provided absolutely *no* guidance or feedback on how to successfully engage with
    the engineers. He was the type of manager that typically interfaced with managers
    at his level or higher, leaving managers at my level to do all the legwork with
    the engineers and to determine what worked and what didn’t by trial and error.


    I often felt that my opinions were not respected as I didn’t have the in-depth
    technical knowledge that they did. I even overheard a conversation between two
    engineers that I was “a nice person” but didn’t understand the work they were
    doing. As a result, I felt that the engineers were cooperating on a face-to-face
    basis but did not respect me behind my back. Needless to say, this was extremely
    frustrating. I had developed quality assurance skills and process management skills
    that I was willing to share with the team; however, since many of the projects
    in the organization were date driven, most of the processes I wanted to implement
    were viewed as barriers to getting the work done on time.


    There was also conflict within our group that our manager didn’t want to deal
    with. My peer managers included two other women and one man. One of the women
    was very controlling and was constantly in the manager’s office. While I was away
    from the office one time, she told my manager that my approach to the work was
    insufficient. I had to defend my work to my manager when I returned to the office.
    Eventually, my manager sent our group of managers to team building training in
    an effort to resolve the conflicts. Needless to say, the training did little to
    improve our working relationships. Between knowing I was not respected by the
    male engineers and the conflict within our team, I realized it was time to begin
    looking for other work.


    Later that decade, I finally had a shot at my dream job: working with a veterinary
    medical company. Since I had pursued my BS in Biology with the original goal of
    becoming a veterinarian but was unable to complete the education, this was as
    good as it could get. I finally had the chance to oversee animal studies and apply
    both my quality assurance and degreed skills, but after just 2 years, the company
    was sold, and I was packaged out. I found myself at another crossroads.


    ## 2000s: The Girl With(out) the Dragon Tattoo


    I decided to try something completely different: My husband was doing quite well
    as a contractor/consultant in Information Technology, and he encouraged me to
    transfer my quality management skill set into that industry. I jumped in with
    both feet and started working as a software tester in contract positions.


    Surprisingly, I did find some allies among the mostly male developers—most of
    them wanted to work with me to improve the quality of the software they were building,
    so they were willing to discuss my testing approach and any defects I found. For
    one of the first times in my career, I felt that I was respected. I had open dialogues
    with the developers, and they sought me out for my opinions. We worked hand in
    hand with each other, and that meant we produced quality deliverables.


    Several of these contract positions allowed me to expand beyond just my software
    testing skills. For example, at one contract, I learned how to build deployment
    packages and deploy new code to production. The lead DBA who taught me these skills
    was female; even though she was an employee and I was a contractor, she was more
    than willing to transfer knowledge to me. During the early 2000s, employees often
    felt that they should not work with or share knowledge with contractors as eventually
    the contractor would leave taking all that knowledge with them, and they often
    felt their jobs were threatened. I did not experience this type of attitude when
    working with employees. All of the contractors worked in one room together, and
    although I was the only woman in that room, I felt comradeship in the work effort.


    After several successes as a contract employee, reality struck: The internet bubble
    popped, and I decided to transition back into full-time employee mode in a senior
    quality assurance role at an international insurance company. That eventually
    led me to yet another new career: project manager for some of the company’s most
    crucial IT projects.


    ## 2010: Same aS It Ever Was'
