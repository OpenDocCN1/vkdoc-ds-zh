  trans: '

    # 赞助我


    在指导之上，下一个层级便是赞助。赞助某人意味着介绍、建立人脉并推荐个人获得机会。研究表明，女性获得赞助的可能性比男性同行低三倍。^(⁹⁶) 由于你的赞助者很可能是职位更高的人，甚至可能是
    C-level 高管，他们会为你和你的晋升发声，因此明智地选择至关重要。这是你成长中必不可少的一部分，因为有赞助者的女性更有可能被考虑承担那些如果没有导师的推荐就无法企及的拓展性任务。一旦你在职业生涯中取得了坚实的成就记录，并初步获得了导师的益处，就应考虑寻求赞助。赞助者可以是你的导师，也可以是另一个人。鉴于偏见使女性不那么显眼，这个统计数据并不令人意外。并非女性不努力，只是在形成推荐名单以促成赞助时，她们被想起的频率往往更低。


    最近一篇文章讨论了女性获得赞助少于男性的原因之一，即围绕赞助存在一种对女性的偏见，这种偏见常常来自女性自身。^(⁹⁷) 当被提供赞助时，很大比例的女性将其视为“作弊”。这是一个深刻的概念，我意识到自己也属于这一类。我一直是那种试图独自完成所有事情的人，常常选择艰难的道路。即使别人主动提出要帮助我或赞助我，也是如此。我花了相当长的时间才学会接受赞助，而不是将其视为达成最终目标的捷径。当我思考自己在职业生涯中接受赞助的复杂看法时，不难理解我为何会有这种感觉。有多少次，成功的女性被人侮辱，将她的成功归功于别人——可能是导师或男性团队成员，即使他们可能根本没做什么工作？又有多少次，在讨论一位有魅力、成功的年轻女性时，会有“她靠睡上位”的窃窃私语，即使是现在？


    这种文化偏见会给大多数女性带来焦虑，驱使她们独自去做所有事情，我强烈认同将赞助视为作弊的观点。我十分理解为什么女性会回避赞助，从而错失更高效晋升的机会。你必须比这种恐惧更强大，并认识到，如果不利用赞助，它会影响你的成长以及你与男性同行一样快速晋升的能力。


    最近，一位女性同行哀叹女性之间相互赞助的匮乏。虽然我知道自己是少数积极赞助周围人的人之一，但我也深知其困难所在。“象征性女性”的情况导致一位女性赞助另一位女性后，自己却失去了位置，因为社会在我们晋升时倾向于用新女性替换原有女性，而不是增加女性名额。这是一个反复出现的问题：人们认为女性在会议桌前只有有限的席位，如果一个人上升，其他人往往会跌落，而不是一起上升。第二个挑战是，女性在职场上已经承受了巨大压力，而科技领域和高级管理层中的女性寥寥无几，因此，在我看来，让男性赞助女性是使女性赞助变得可持续的关键。


    # 下一步


    当我们超越了赞助的需求及其复杂性之后，下一个重点就是如何通过提高自身可见度来获得赞助。正如我们在前几章讨论过的，女性找到安全且高效的方式来建立人脉至关重要。如果你不在活动中演讲或展示，社交媒体仍然是最好的方式之一。在线论坛、Twitter、LinkedIn/LinkedIn
    群组和 Meetup 是让你提高可见度并构建人脉网络的最佳途径之一。


    Twitter 是一个高度社交化的网络，但尽管平台覆盖范围广阔，其中也会形成一些小团体，围绕兴趣爱好、商业、专业或特定领域。粉丝数量并不等同于在该平台上的成功。理解如何与那些提供优质内容、并能为你引荐行业内其他人的人建立联系至关重要。了解哪些话题标签（`#`）与你的行业和兴趣相关。使用它们可以有效地与正确的人建立联系。一旦关注了合适的人，与他们互动并分享信息，就可能为你带来合适的导师或赞助者。


    正如我在前一章中推荐的，LinkedIn 提供了一个更安全的社交媒体平台来建立人脉。每次会议后，花点时间在 LinkedIn 上与所有参会者建立联系。考虑加入与你专业领域相关的
    LinkedIn 群组。发表见解，分享你的成就，并对那些你视为潜在导师或赞助者的人的帖子进行回复。


    Meetup 是另一个覆盖范围广泛的平台。在`meetup.com`上创建账号很容易，搜索你感兴趣的群组也同样简单。只需在应用的搜索栏中输入主题并点击搜索按钮即可。Meetup
    活动通常在工作后或周末举行，提供会员资格以及参与活动的潜在导师和赞助者。进行简短的自我介绍，随后在 LinkedIn 上跟进连接，是给活动中某人留下印象的好方法。


    这种形式让你能打造出代表你技能并保持真实性的专业品牌。最大的障碍是克服恐惧，开始回复或发帖。花点时间仔细思考你的回复和帖子，不要害怕提问。潜在的赞助者总是在寻找那些工作出色、乐于学习且有自己的声音的人。不要害怕发出你的声音。


    尽管赞助者和导师存在一些重叠，但你会开始注意到区别：赞助者会主动联系你，告诉你他们有一个适合你的机会。这可能是一份工作、一个在你专业领域为独特项目做贡献的机会，或是一个让你的职业生涯更进一步的机会。导师会告诉你门在哪里，而当有人敲门时，赞助者会为你打开那扇门。


    一个赞助者人脉广泛。在我的情况下，我在被推荐了太多机会之后，自己也成为了一名赞助者。与其拒绝，不如把可用的机会推荐给别人，这对大家都有好处。这有助于保证机会能持续向我敞开（进一步消除女性面临的不被看见的问题）。有些人可能不愿与他人分享机会，但这是让潜在赞助者去赞助他人的好方法。我建议，随着你自身的机会开始增多，开始赞助那些有潜力的人。这始终是关于传递善意，并且如果你这样做，迟早会发现它会回报给你。


    你应该考虑哪些机会，取决于你的发展路径。如果你希望在职业生涯中晋升，赞助可能意味着结识一位在你梦想工作或公司任职的人，这对你来说可能很重要。如果你希望写作，考虑先写博客，然后可以转化为文章，或者先写书评，再尝试撰写一两本书的章节。


    赞助也可以以非传统的形式出现——比如有人希望工作时间更灵活，而得知你也有此意，可能会找到一个分享全职工作角色的机会。赞助有时需要跳出框框思考，去构建那些在传统的成功观念中可能不存在的机遇。

    '
- fmt: '# Mentor, Heal Thyself


    That leads us to finding those to mentor and sponsor. There’s significant content
    available on how to be a mentor, but very little on how to find those you should
    mentor. It was a learning process for me, starting with locating those I thought
    were being overlooked and then learning as I went along. Yes, my mentoring is
    more peer-to-peer style. I’m there to advise and sponsor, but I’m also there to
    show that I’m only human. If a mentor is too perfect and too self-protective,
    never showing their own flaws, it can appear what they’ve achieved is out of reach
    for those they are guiding. One of the most valuable skills of a mentor is to
    be authentic and human. Embracing our flaws and demonstrating that we work daily
    to be better is a more powerful example to those that wish to follow in our footsteps.


    As I completed mentoring with different levels of success, these are the things
    I found most successful.


    1. Instead of one-on-one mentoring, do two mentees and a mentor. This offers the
    opportunity; if the mentor is busy, a peer is available to offer support.


    2. Find those that are “hungry” to succeed. You can’t succeed if you don’t have
    ambition.


    3. The mentor must want the mentee to be more successful than they are in the
    end. One of the challenges many older women in the industry have is that they’re
    told for a woman to succeed will require her to give up her spot she’s achieved.
    We must discard this old bias and move for more equality of women in leadership
    and success.


    4. When searching out those to mentor, take insecurities into consideration. With
    sudden success, titles, and public recognition, it can become an inner battle
    for some as they move up the ladder. This is a battle that no one is the winner
    in the end. If the individual desiring to be successful is more focused on other’s
    accomplishments more so than their own, it may be better to mentor them in focus
    and self-confidence than sponsoring. I’ve experienced a great amount of destruction
    resulting from those with great internal battles from insecurities. Take the time
    to get to know the person you’re considering mentoring.


    5. There is no need for a formal schedule of mentoring sessions—some individuals
    will need more time, others will just need to be pointed in a direction or offered
    some sponsorship and will make the most of it. Give people just what they need.


    6. Ask those that you’ve mentored to pay it forward. No other way is mentoring
    and sponsorship self-sustaining unless you do this one thing. Let those you’ve
    supported and granted opportunities to take it to others and build upon it.


    For those that have an extended mentoring agreement, you may be challenged on
    how to address the problems that women in technology face and how to advise them.
    What most of us found, the biggest benefit that a women mentor offers us is support.
    Understanding can be so essential to moving past an impacting experience when
    there is a high chance that we are surrounded with those in a male-dominated work
    environment. Although we may want to understand, it is a significant challenge
    doing so. This doesn’t diminish the power of male allies but leads us to understand
    that to experience something first-hand makes a significant difference in how
    we’re able to connect with those we advise.


    ## The Happy, Shiny People


    The more you mentor, the more you realize that so many women are experiencing
    the same bias and challenges. The more you speak with them, hopefully it’s not
    that you become frustrated or angrier but more aware of options to work through
    the problems and come up with solutions that you never would have if you hadn’t
    spoken with others. I think this is my biggest challenge with the “why do you
    have to talk about the challenges we’re facing?” topic of those who just want
    to talk about the positive changes in the world of women in technology. Once,
    I was describing how I was instructed that I could only talk about “positive”
    aspects of women in technology at an event and the organizers wouldn’t tolerate
    any discussion around bias, discrimination, or the percentage of women leaving
    tech. Upon hearing this, a woman I greatly admire, Elaine Murano, who runs Equili,
    ^(^(98)^) quipped, “Oh, you mean the happy/shiny people!” I’ve used the term to
    describe those that would ask me to deter from honest discussions and to only
    stick to positive talking points. I think we strongly need the words of encouragement
    and positivity, but when we avoid having real conversations, those done with sensitivity,
    and all have our own experiences, it deters us from building bridges and solutions
    to what we’re facing.


    I found that many of the support I garnered in the Oracle arena on women in tech
    issues came from honest discussions, sometimes uncomfortable, but because they
    were done with mutual respect, the outcome was one for the better. I was willing
    to listen and empathize with the experiences of the person who might have an opposition
    on my point of view, but we undoubtedly left the conversation better than it ever
    would have been if the conversation hadn’t occurred. My message here is don’t
    give up and don’t shrink away from the tough conversations. This doesn’t mean
    you give up ground, but it does mean you come to a common ground to openly discuss.
    Being able to see the world through another person’s eyes is incredibly powerful
    and can often help you solve problems you’d never thought possible.


    What is common ground?


    - First decide coming into the conversation that all involved have something valuable
    to offer to it.


    - Show respect and expect respect to be given in return.


    - Focus on the goal of the conversation. How best to share your point of view
    that the other person will see where you’re coming from.


    - Remember that being right isn’t the same as doing the right thing.


    - Be there with the goal of you both coming out the other side of the conversation
    better for it.


    - No matter what anybody says about women apologizing too much, always be ready
    to apologize and ask the other person to clarify or elaborate on something they’ve
    said *vs.* taking it personally.


    This approach can help in many different circumstances, not just on the topic
    of women in technology. Having this mindset when discussing anything difficult,
    in personal and professional conflicts, can make for a more productive conversation.


    ## The Bully


    I’m sure some of you are wondering if this is going to work with the workplace
    bully or that one guy that shows nobody any respect. There are going to be difficult
    people in the workplace that are “equal opportunity” bullies and then those that
    have a bias against women or other minorities. How we deal with difficult people
    has been a challenge I’ve been faced with many times in my career and personal
    life.'
