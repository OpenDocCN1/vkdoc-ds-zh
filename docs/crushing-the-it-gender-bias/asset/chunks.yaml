- fmt: '# Increasing Our Value


    Workplace bullies come in many forms and they cost companies more money in poor
    decisions than we often consider.^([^(42)](#fn42)) A common theme, as discussed,
    is that employees don’t leave companies; they leave bosses, and no more is this
    prevalent than when control issues have been confused with leadership skills.


    One of the most important things to remember when approaching a negotiation is
    that it’s not just about your value as an employee, but what it will cost the
    company to replace you.


    - What will be the salary expectations of a new candidate for your position?

    - What is the cost of training, transition, and on boarding?

    - What will it cost the company in lost time, productivity, and tribal knowledge?


    As we determine our true value to our employers, we need to take these all into
    consideration. The cost to the industry because managers didn’t consider this
    is astronomical, and it’s in everyone’s best interest to politely but directly
    discuss this with your manager as you broach the topic of negotiation. My experience
    was an outlier, and it’s important to know that everything happens for a reason.
    No matter what your faith (spiritual or religious), you need to believe in yourself
    and that something better will come along.


    Knowing how to broach the topic of salary increases is an area that wasn’t discussed
    in my career. Before I entered my first salary negotiation, I did a lot of research
    to educate myself on not just tactics, but the basic steps. One of the things
    I learned is that women must approach the topic, often pointing out how the negotiation
    could be more beneficial to the company than for themselves.


    "I would appreciate the opportunity to negotiate an increase in my current pay/a
    title change/etc. with the company. I know the incredible cost increases with
    the loss of employee expertise, the hiring process, including candidate search
    and interviewing, then transition. I would be negligent if I didn’t approach this
    in a professional manner and ask that we consider a promotion/salary increase
    *vs.* simply searching out a new position with a new company."


    This preceding approach and language demonstrated exactly how the company, not
    just you, can benefit from giving you a raise. When hoping for a pay increase,
    this is a common way to distract from bias and focus on a common benefit.


    In negotiations, a woman doesn’t have to go through it alone. In a previous chapter,
    we discussed the often-lacking benefit if technical professionals remain at one
    company for an extended period beyond 3 or 4 years. Any company that is looking
    to have an employee, especially a technical one, for over 5 years isn’t looking
    at the reality of a career in the present-day arena. This signals the important
    aspect of putting individuals with strong leadership skills in place to make the
    most of the technical professionals you have. Investing in their future helps
    drive the company’s future. I believe an employee won’t leave a company which
    continues to challenge the employee technically, provides technical career advancement,
    and treats the employee well professionally, personally, and financially. Even
    if you are hired with a great manager, you may find that there is a change in
    leadership at some point and the natural course is to change groups or change
    companies.


    Hopefully, we all have worked at companies where the manager exceeded our expectations,
    we had great team members, and the work was challenging. This should only make
    you strive to have this type of workplace as often as possible. The idea that
    work must be miserable and that we should dread it goes against why we went into
    our technical careers in the first place. We hopefully had a passion for tech,
    and our goal is to be productive and grow with our career. That’s not to say that
    we won’t have days we’d like to forget; it’s just saying that the good days should
    far outweigh the bad.


    # Ask and Ye Shall Receive


    As women are stereotypically poor at negotiating for themselves, I learned one
    trick that has served me well all my career. In my experience, women will negotiate
    for other women with a fervor that simply can’t be found anywhere with male mentors
    or peers. It may be due to women being raised as care givers we’re more likely
    to provide insight and tell another woman where she is being shorted in an offer.
    Some of the women who have provided this incredible value to my negotiations stressed
    that they wanted me to have the information they wish they’d had when they’d started
    with the company.


    No matter male or female, inside resources with a potential employer to review
    your offer can put you at a significant advantage. When I was reviewing my offers
    at Oracle back in 2014, my mentor Mary Melgaard reviewed my offers, and with her
    internal knowledge from working at Oracle for over 2 decades offered me valuable
    advice about the department management health, any changes that should be made
    to the offer, and even the organization level I should come in at.


    Since then, I’ve always tried to network inside a company before working for them,
    finding trusted resources that can offer valuable insights to salary, internal
    organization levels that may be cryptic to those outside of the organization and
    provide what benefits and perks can be negotiated into the offer.


    # Salary Is Not the Only Negotiation


    When an offer is put on the table, if you aren’t jumping to sign it, then ask
    yourself why? What are the sticking points?


    1. Is there a new technical area that you’ll have responsibility for? Ask for
    a training class to be part of the offer.

    2. Insurance lapse between the previous and new position? Let the hiring manager
    know that you are sincerely interested, but that you, (or your family) can’t go
    without insurance and ask if they can cover the cost of cobra. One company offered
    a mentee a signing bonus that paid for hers.

    3. Loss in sick days? See if you can gain more float or vacation days to compensate.

    4. Going from a team to working on your own? The loss of technical team learning
    can be significant. Ask for time to attend user groups or technical conferences
    to help support your learning.

    5. Flex time, either to work hours that are more supportive of personal demands
    or work from home.


    Severance packages are one more income area that needs to be considered. As technology
    moves fast, severance should be viewed as an opportunity and not a failure. I
    accepted voluntary severance after consolidating a company’s data center due to
    an acquisition. I started another opportunity without any time off, but if you
    find yourself in this situation, you should consider a negotiation just like any
    other.


    1. Often, you’ll find out there is some negotiating room for severance packages.
    Find out what others are receiving and then decide what are the important goals
    for your own.

    2. Consider paid cobra or training classes as part of your severance if there
    isn’t the option to increase the financial payout.

    3. Again, reach out to trusted confidants and ask them to review and give you
    honest feedback of the package. A mentor may have insight that you didn’t consider.


    What if the company can’t come up with the salary you were hoping for? Take the
    time to find out the schedule for yearly reviews. Ensure that you won’t go more
    than a year with a review, and even better, see if you can schedule a special
    review 3 or 6 months in, with an opportunity to increase your salary at that time.


    Make a list of what is important to you and the future of your career. No, money
    isn’t everything, but if you aren’t getting paid what you’re worth, you’re likely
    to leave. Turnover is costly to any company due to loss in productivity, training,
    signing bonuses, and the likes. It’s worth it not just to you, but the company
    you’d considering that they are making an offer that is worth it to you to stay.'
