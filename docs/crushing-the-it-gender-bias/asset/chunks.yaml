    \ [9](#469679_1_En_4_Chapter.xhtml#Fn9_source) [10](#469679_1_En_4_Chapter.xhtml#Fn10_source)\
    \ [11](#469679_1_En_4_Chapter.xhtml#Fn11_source) [12](#469679_1_En_4_Chapter.xhtml#Fn12_source)\
    \ [13](#469679_1_En_4_Chapter.xhtml#Fn13_source) [14](#469679_1_En_4_Chapter.xhtml#Fn14_source)\
    \ [15](#469679_1_En_4_Chapter.xhtml#Fn15_source) [16](#469679_1_En_4_Chapter.xhtml#Fn16_source)\
    \ [17](#469679_1_En_4_Chapter.xhtml#Fn17_source) [18](#469679_1_En_4_Chapter.xhtml#Fn18_source)\
