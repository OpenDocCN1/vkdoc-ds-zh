    如今我已退休，却涉足了各种全新的机遇。我曾担任选举设备经理，负责芝加哥西北郊区一个选区的投票设备设置与维护；也曾协助一场重要的美国国会竞选，而我的候选人最终胜出——这主要归功于其他像我一样充满活力的郊区女性选民的影响力。我甚至回归了生物学老本行，在当地植物园担任志愿者，从事公民支持的科学项目。没有什么比恢复原生草原更令人振奋的了，尤其是当我与几位世界知名的植物学博士携手合作时。


    在迎接这些新挑战的过程中，我发现自己常常回顾职业生涯。我逐渐意识到，当我曾是唯一女性时，那种不愿参与的抵触情绪，很大程度上源于我对情境的解读和自我怀疑，而非情境本身的事实。作为一名职场女性，我必须比男性同事更努力、更优秀，这始终是常态。虽然这不公平，却往往是现实。担任管理职位的女性在职场中常受到不同对待，原因并非能力，而是性别。最终，大多数时候，我是房间里唯一的女性这一事实，真的*并*没有带来什么不同。


    很多时候，是有人（经理或同事）足够信任我的判断，才让我进入那些会议室，并相信我能做出有益的贡献。我本应像他人信任我一样信任自己。然而，在事情的当下，我发现自己总是聚焦于最不安的感受，而非自身优势。而当我与走上相似道路的其他女性讨论这些经历时，我发现克服这些感受是许多女性在职业生涯中持续面临的挑战。


    根据露丝的经验，她指出，尽管男女经理在技能上同样合格，但他们受到的待遇却截然不同。她发现，那些信任她的能力、不因性别而否定她的人，能够为她提供机会，让她为公司和她所带领的团队带来利益。这是一个有力的说明：更多的代表性如何能提供更多这样一致的体验，并减少因性别偏见而导致的低效。


    像露丝一样，奥帕尔·阿拉帕特也是我眼中无比专注、积极且可爱的人。她是一位令人印象深刻的技术专家，在同领域内获得同行认可，荣获了甲骨文 ACE 总监称号。她的智慧包裹着温暖，冷静的外表让人本能地信任她。我知道事情并非总是如此，我为那些错过机会、未能让她在她所承担的每一份事业中展现其卓越能力的人感到遗憾。


    我们常开玩笑说女性被身边的男性忽视，但还有一个更具挑战性的问题：男性（我也知道有些女性也会这样对待其他女性）在女性所说的话得到男性认可之前，不会相信她。


    我亲身经历过：当我发表一个观点后，只有当我丈夫赞同或重复了我的话，人们才会接受。我演讲或撰写过无数话题，一旦被男性同行重复，就会从“观点”变成“事实”。即便带着研究和参考文献，一些人就是不满足，不愿倾听女性的想法、建议或答案，除非有男性同行给予认可。


    莉·艾里什是 PASS 女性科技小组的联合负责人，自从我被介绍到社区以来，她一直热心地指导并支持我（以及我认识的大量女性）。她对微软社区充满激情和深沉的热爱，是这项倡议持续成功的关键原因。她在数据库技术领域拥有丰富的经验，现任数据库管理总监一职，但这并不意味着她不再经历偏见带来的挑战。


    ## 这玩意儿有人听吗？


    莉·艾里什


    我清楚地记得第一次意识到一个男人仅仅因为我是女性而不听我说话的时刻。回想起来，我确信这之前已经发生过很多次了。但这一次，在那一刻，我明白了。我当时二十多岁，与正教授汤姆·皮蒂共同执教一门大学课程。我已经完成了硕士学位所需的一切，而且这也不是我多年来第一次授课。一个年轻男生问了一个复杂的问题，我轻松地回答了。我的回答很深入，需要用到黑板上的图表，以及我凭记忆脱口而出的不少百分比数据。讲完后，我问他是否理解了。他什么也没对我说，却转向那位男教授，逐字重复了他的问题。我站在那里，目瞪口呆。令我惊讶的是，教授立刻意识到这个年轻人在做什么。他完全不买账。汤姆沉默地看了那个年轻人一会儿，然后说：“她刚才的回答比我能做到的更好。你是根本没听，还是没听懂？”


    十年后，我是一家大公司团队里的高级数据库管理员。我为一家大型企业与几个全男性开发团队紧密合作。我拥有完全的生产环境访问权限和叫停任何部署的权力。在那特别的一天，我和我们唯一的男性数据库管理员约翰站在一起，讨论即将进行的代码推送中遇到的一个问题。我所在开发团队的组长走过来，问了一个针对我们配置的`SQL
    Server`问题。我毫不犹豫地详细回答了。组长停顿了一下，转向约翰，逐字重复了那个问题。我的同事难以置信地看着我。这一次，我们俩都目瞪口呆。约翰尽他所能回忆着复述了我的答案，然后说：“她刚才回答你了。你是不明白吗？”团队组长咕哝了几句关于想要确认的话，然后就溜走了。


    时隔多年，在不同场合，拥有不同权力和影响力的情况下，我遭到了同样程度的忽视和视而不见。我花了很多年才意识到，问题不在我。这与我是谁、我表现得多么自信、或者我拥有多少资历（或没有资历）毫无关系。这完全在于他们，在于他们作为男性的身份，以及他们对女性抱有多少尊重。在这两次经历中，我都很幸运地与那些意识到作为女性在职场会面临何种问题的男性共事——那些自称女权主义者的男性，因为他们明白，平等不是一张饼，我的拥有更多并不意味着他们就更少。那些经历教会了我，不要等着男人来回答，而是直接说：“我刚才回答你了。你没在听吗？”


    前一章的内容探讨了我们常让女性被忽视，却又告诉她们要大声说话这一事实。当经历让你要么“目瞪口呆”，要么你的回应只会削弱进一步教育这一目标时，你该怎么办？


    我曾被要求猜测女性在某些情况下做出某些选择的原因，但我总是犹豫。我大多不在现场，也并非身处那些女性的内心，所以任何说法都只是我的猜测。拥有盟友，就像莉在她所描述的两次经历中那样，有助于佐证她所经历的事情，以及为什么冒犯者做出了不倾听女性愿意分享的知识这一错误选择。

