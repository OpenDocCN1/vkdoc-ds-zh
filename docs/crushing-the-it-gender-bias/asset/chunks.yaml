    kids. There are groups like Kimberly Bryant’s “Black Girls Code” and others that
    are introducing tech to the next generation of technology that might not have
    had the opportunity due to demographic, quality of life, or education resources.


    It gives me hope for the future I’m no longer searching for the one other black
    person in the room.


    I remember the first time this friend shared this story with me after I prodded
    him with my concerns over diversity being presented as women in technology and
    being sadly aware that was not the whole case that needed solving. I’d experienced
    him coming up to a black woman friend of mine, giving her a hug and after a fist
    bump, saying, “fellow black person.” I was alarmed by the truth of it all. As
    impressive as the women in technology initiative is in the Microsoft community,
    in the speaking circuit, I’d noticed that the number of people of color wasn’t
    significantly higher than that of the Oracle one and asked one of the few black
    men I’d become friends with about it. He confirmed what I’d observed and said
    there was considerable room for improvement.


    This is one of the hurdles that we need to overcome. How would changing education
    curriculum so that everyone learned technology on equal footing with core subjects
    (reading, writing and arithmetic) do for diversity in technology for people of
    color?


    Would increased representation, not only in tech, but in leadership, for people
    of color help impact the never-ending cycle of poverty that is experienced by
    greater percentage that should exist? Would it help to change the bias we see
    in how people of color are portrayed in the media and treated by law enforcement?
    How much could we change by just introducing technology to the masses instead
    of the privileged few?


    Could this change impact the dismal numbers of blacks and Latinas in technology?


    The preceding stories are just a few that I requested from the community. I could
    have reached out to a large group but chose to keep it to this group, as I felt
    it covered a diverse number of topics and included people that came from numerous
    backgrounds and countries, not just the United States.


    I’d like to publicly thank everyone who wrote a story for this chapter. I believe
    by experiencing this from many voices, more ears shall hear them.


    Footnotes [1](#469679_1_En_7_Chapter.xhtml#Fn1_source)   [2](#469679_1_En_7_Chapter.xhtml#Fn2_source)
      [3](#469679_1_En_7_Chapter.xhtml#Fn3_source)


    # 8. Closure and New Beginning


    With all that we’ve discussed in the previous chapters, early career, advancement,
    women in technology, and the stories of those women who’ve overcome challenges
    and how they’ve succeeded, there remains the question “Where do we go from here?”'
  trans: '

    # 科技的色彩


    匿名


    我知道我们对此现实状况会加以调侃，但当你作为房间里唯一的黑人时，在技术活动上演讲可能会充满焦虑。你知道观众中总有那么几个人，已经先入为主地认为你在贫民窟长大，而非出身于郊区的中产阶级家庭。你有时会感觉自己夹在两种文化之间，因为如果房间里还有另一个黑人，他们无疑会走过来试图与你亲近，即使你们毫无共同之处。


    别误会，我有自己的黑人朋友，他们虽然寥寥无几，但也会参加这些活动。我们彼此走近、打招呼，并讨论着情况并未好转。我们感叹技术活动中的女性数量，以及有多少人真正关心有色人种。


    事实是，我们是世界的一部分，而我们越深入地融入科技领域，科技就会变得越好。硅谷有多少创始人是移民？当你看到来自中国、印度和其他地区的移民时，这个数字相当可观，但像查尔斯·哈德森、特里斯坦·沃克和金伯利·布莱恩特这样的黑人却少得多。我们屈指可数，这使得我们基于代表性在科技领域成功的几率低得令人沮丧。


    好消息是，我认识一些正努力改变这一现状的朋友。我有一位朋友在亚特兰大运营着一个很棒的志愿者团体，为城市里的贫困儿童带去科技知识。还有像金伯利·布莱恩特的“黑人女孩编程”这样的组织，它们正在向下一代介绍科技，这些孩子可能因为人口统计、生活质量或教育资源等原因，原本没有机会接触科技。


    这让我对未来充满希望——我不用再在房间里寻找另一个黑人了。


    我记得这位朋友第一次与我分享这个故事时，是我向他表达了对“多元化”被简单地等同于“科技界的女性”这一现象的担忧，并悲哀地意识到这并非需要解决的全部问题。我曾见过他走向我的一位黑人女性朋友，拥抱她，然后碰拳并说道：“同胞黑人”。我对这一切背后的真相感到震惊。尽管微软社区和演讲圈中“科技界的女性”倡议令人印象深刻，但我注意到，有色人种的数量并没有比甲骨文社区显著增加，于是我向我成为朋友的少数黑人之一询问了这件事。他证实了我的观察，并说还有很大的改进空间。


    这是我们需要克服的障碍之一。如果教育改革能让每个人在与核心学科（阅读、写作和算术）同等重要的基础上学习科技，这对于科技领域中有色人种的多元化会有什么影响呢？


    不仅是在科技领域，而且在领导层中，增加有色人种的代表性，是否有助于影响本应更少的贫困群体所经历的恶性循环？是否有助于改变我们在媒体描绘有色人种方式以及执法部门对待他们方式中看到的偏见？仅仅通过向大众而非少数特权阶层介绍科技，我们又能改变多少？


    这种改变能否影响科技领域中黑人和拉丁裔女性少得可怜的人数？


    前面这些故事只是我向社区征集的几个例子。我本可以向更多人寻求帮助，但选择保持在这个群体范围内，因为我觉得它涵盖了广泛的主题，并且包括了来自众多背景和国家的人，而不仅仅是美国。


    我想公开感谢每一位为本章撰写故事的人。我相信通过来自众多人的声音，更多的人会听到它们。


    脚注 1 2 3


    # 结束与新的开始


    综合我们在前几章讨论的所有内容——早期职业生涯、晋升、科技界的女性，以及那些克服挑战并取得成功的女性的故事，仍然存在一个问题：“我们该何去何从？”

