  trans: '

    # 提升自身价值


    职场霸凌者形式多样，而他们因决策失误给公司造成的损失，往往比我们通常认为的更为巨大。^(⁴²) 正如我们讨论过的，一个普遍现象是，员工并非离开公司，而是离开上司；当控制问题被误认为领导技能时，这种现象尤为常见。


    在进行谈判时，最重要的一点是记住：这不仅关乎你作为员工的价值，也关乎公司替换你需要付出的成本。


    -   一个接替你职位的新候选人对薪资的期望是多少？

    -   培训、交接与入职的成本是多少？

    -   公司会因时间损失、生产力下降以及内隐知识流失而付出多少代价？


    当我们确定自己对雇主的真正价值时，需要将这些因素全部考虑在内。由于管理者未考虑这些因素而给行业造成的成本是天文数字，而在你开启谈判话题时，礼貌但直接地与你的经理讨论这一点，符合所有人的最佳利益。我的经历是个特例，但重要的是要明白，凡事皆有因。无论你信仰什么（精神上或宗教上），你都需要相信自己，并相信更好的机会终会到来。


    如何开启加薪谈判的话题，是我职业生涯中未曾讨论过的领域。在进入第一次薪资谈判前，我做了大量研究，不仅学习策略，还掌握了基本步骤。我学到的一件事是，女性在开启这个话题时，常常需要指出谈判如何对公司比对自身更有利。


    “我希望有机会与公司就当前薪资/职位变更等进行谈判。我知道，失去员工专长、招聘流程（包括候选人搜索和面试）以及后续交接会带来巨大的成本增加。如果我不以专业的方式提出此事，并请求我们考虑晋升/加薪，*而非*简单地寻找新公司的新职位，那将是我的失职。”


    上述的表达方式和措辞准确地展示了公司——而不仅仅是你——如何能从给你加薪中获益。在期望加薪时，这是一种常见的做法，用以转移偏见，聚焦于共同利益。


    在谈判中，女性不必孤军奋战。在前一章中，我们讨论了如果技术专业人士在一家公司停留超过 3 到 4 年，往往会缺乏益处。任何希望留住员工（尤其是技术员工）超过
    5 年的公司，都没有正视当今职场的现实。这突显了一个重要方面：将具有强大领导力的人才安排到位，以充分发挥你拥有的技术专业人员的作用。投资于他们的未来有助于推动公司的未来。我相信，如果一家公司能持续在技术上挑战员工、提供技术职业发展，并在职业、个人和经济上善待员工，员工就不会离开。即使你入职时遇到了一位优秀的经理，你也可能会在某个时候遇到领导层变动，而自然的做法就是换团队或换公司。


    希望我们都曾在这样的公司工作过：经理超出我们的期望，我们有优秀的团队成员，工作也充满挑战。这只会激励你尽可能多地拥有这样的工作环境。认为工作必然痛苦、我们应当害怕它的想法，与我们最初投身技术职业的初衷背道而驰。我们本应对技术充满热情，我们的目标是高效工作并在职业生涯中成长。这并非说我们不会有想忘记的日子；而是说，好日子应该远多于坏日子。


    # 开口，你就会得到


    由于女性在为自己谈判方面存在刻板印象的劣势，我学到了一个技巧，在我的整个职业生涯中都受益匪浅。根据我的经验，女性会以男性导师或同伴中难以找到的热情为其他女性进行谈判。这可能是因为女性作为照顾者成长起来的缘故，我们更倾向于提供见解，并告诉另一位女性她在某个录用条件中吃了亏。一些在谈判中给予我巨大帮助的女性强调，她们希望我能拥有她们当初入职公司时希望自己拥有的信息。


    无论男女，如果能在潜在雇主内部找到资源来审视你的录用条件，都能让你占据显著优势。2014 年我在审查甲骨文公司的录用条件时，我的导师玛丽·梅尔加德帮我审阅了录用通知，凭借她在甲骨文工作二十多年的内部经验，她为我提供了关于部门管理健康状况、录用条件中应做的调整，甚至我应以何种组织级别入职的宝贵建议。


    从那以后，我总是在为一家公司工作之前，先在公司内部建立人脉网络，寻找值得信赖的资源，他们能提供关于薪资、对外人而言可能晦涩难懂的内部组织级别的宝贵见解，并告知有哪些福利和津贴可以争取纳入录用条件。


    # 薪资并非唯一的谈判筹码


    当一份录用通知摆在桌面上时，如果你并非急于签字，那么问问自己为什么？卡点在哪里？


    1.  你是否将负责一个新的技术领域？要求将培训课程作为录用条件的一部分。

    2.  前后职位之间是否存在保险空档期？告知招聘经理你对此职位的诚意，但你（或你的家人）不能没有保险，询问他们能否承担 COBRA 保险的费用。一家公司曾向一位受指导者提供签约奖金，用以支付她的
    COBRA 费用。

    3.  病假天数有损失？看看能否争取更多的浮动假或年假作为补偿。

    4.  从团队协作变成独立工作？技术团队学习的损失可能很大。要求时间参加用户组或技术会议，以支持你学习。

    5.  弹性工作制，无论是为了满足个人需求调整工作时间，还是在家工作。


    遣散费是另一个需要考虑的收入领域。由于技术发展迅速，遣散费应被视为一个机会，而非失败。在一次因收购而整合公司数据中心后，我接受了自愿遣散。我没有休息一天就开始了新的工作机会，但如果你发现自己处于这种情况，你应该像对待其他任何谈判一样来考虑。


    1.  通常，你会发现遣散费包存在一定的谈判空间。了解其他人获得了什么，然后决定你自己的重要目标是什么。

    2.  如果无法增加经济补偿，考虑将付费的 COBRA 保险或培训课程作为遣散费的一部分。

    3.  再次，联系你信赖的知己，请他们审视并给出关于这个遣散费包的诚实反馈。导师可能有你未曾考虑到的见解。


    如果公司无法提供你期望的薪资怎么办？花点时间了解年度绩效考核的时间表。确保你的绩效考核间隔不超过一年，更好的是，看看能否在入职 3 个月或 6 个月时安排一次特别考核，并在那时有机会加薪。


    列出一份对你和你职业未来重要的事项清单。没错，钱不是万能的，但如果你没有得到与你价值相符的报酬，你很可能会离开。员工流失对任何公司来说代价高昂，原因是生产力损失、培训成本、签约奖金等。这不仅仅对你而言值得考虑，对你正在考虑的公司而言，他们也值得提供一个足以让你留下的、有价值的录用条件。

    '
- fmt: '## When Opportunity Knocks


    When I was writing my first book I was lead author on, I wanted at least one female
    coauthor. There were some incredibly skilled women in the field of monitoring
    and automation at that time. I didn’t hesitate to reach out to a few of them and
    ask if they were interested in writing a chapter. I hadn’t had any difficulty
    finding male coauthors and found a few that volunteered to write chapters that
    had very little technical expertise in the area. The women I reached out to and
    even invited to be a coauthor reacted very differently to my request to author
    with me.


    There was doubt about if they were qualified and hesitation to accept the opportunity,
    and the two women I approached asked to be given time to verify that they could
    meet the demands of writing on a book. For these two women, it was a couple of
    months before I heard back from them, and by then, the opportunity to be an author
    was gone. As many of us already know, the women wanted to ensure that they were
    110% qualified and available to complete the task they were signing up for yet
    ended up missing out due to hesitation to ensure that they were the right individuals
    for the task.^([^(43)](#fn43)) The male authors didn’t seem to have this challenge.
    Many of them answered me immediately and I’ve often been told that I respond like
    most men—I say yes and work through the challenges afterward. I trust myself to
    know if I can accomplish something without a lot of hesitation.


    When mentoring women who are interested in opportunities coming their way, I’ll
    often tell them not to overthink the opportunity and simply say yes. The details
    will work themselves out later. We worry so much about everything and everyone
    else that we put ourselves last. My parents once told me that they had to come
    first. If they didn’t, there was no way for them to then be there for us children.
    As a child, I was first quite insulted by this. Shouldn’t I come first? As I grew
    older, I realized the wisdom. If caretakers don’t care for themselves first, they
    are weakened and aren’t able to be there for those they are caring for. There
    is a lesson for all of us here.


    There is also no better thing you can do for your children than to set a good
    example. We can hope that children do as you say, not as you do, but children
    are very observant. What you do and how you live can have an incredible impact
    on our children. When my youngest, Josh, came with me for “bring your child to
    work day,” he was approximately 6 years old the first time he came with me. Josh
    doesn’t look a lot like me, with his blond hair and blue eyes, but he sure has
    my energy level. They’d separated off and were doing projects with those assigned
    to navigate the kids through the day. They finally slowed him down enough by putting
    him into one of the office chairs, which he spun in fast circles and tasked him
    to draw what they thought an IT person looked like. Although both my son’s parents
    are techies, he drew a woman. The Business Intelligence Manager looked at the
    picture, and said, “I know who your mother is!!” Even though he has two parents
    that are techies, it was me he saw working on a PC regularly, and I was the representation
    of what an IT person was. Setting an example, having a strong work ethic and setting
    priorities for everything in my life created representation of what a woman in
    tech is.


    ## Mixed Messages


    So why do men hesitate less than women when opportunity knocks? Men (and women
    who are raised with more male influence) are taught to take risks and to be concerned
    less with the details. They are taught that if they don’t accept when opportunity
    knocks, someone else will surely answer the call. They are taught to trust themselves
    more *vs.* the challenges ahead. As we discussed earlier, boys are more likely
    to communicate with insults and challenge each other. Due to this, it’s easy to
    understand why boys begin to trust themselves at a much earlier age than girls.
    Once they are adults, there are less mixed messages given to men and really—are
    they going to listen to them to begin with? Much less likely.


    Let’s focus on the number of mixed messages women receive. Women start hearing
    these messages, much more so than men, from early on. From what we wear, to what
    we eat, to who we’re friends with and who we date. I didn’t realize how much until
    I observed the messages given to my daughter *vs.* my sons. Relatives would only
    seem to be worried about my sons’ dating. If they were interested in someone,
    that was all they seemed to care about, and they left it be. My daughter, on the
    other hand, she should wear makeup and be thinner than she already was, and then
    when she did wear makeup, it was too much, and she was too thin and needed to
    gain weight so she would attract the boys. They’d want her to wear a dress when
    she was a pre-teen, but then as she started to mature and appreciate dresses more,
    they cautioned her not to dress too sexy. They were very focused on much skin
    she was showing at a given time. There would be a desire for her to stay their
    “little girl” and at the next moment discussions about how “at her age” my mother-in-law
    had already given birth to her father. She just graduated and was alarmed at her
    grandmother’s comments about how all the girls in her class were dressed skimpy
    and that she needed to cover up more, yet then commented on how attractive a young
    woman was on the street that was dressed in the same dress she had on. As with
    family dinners, she returned anxious and frustrated by the stark difference in
    how I was raising her and the expectations that she couldn’t meet with them.


    As bias is often learned, I also recall how frustrated my ex-husband was when
    I cut my daughter’s hair into a short, bob cut. He curtly told me that he wanted
    to be able to brush her hair and put it in ponytails and braids. I reminded him
    that she had fine, straight hair that tangled into a massive knot every morning,
    and he wasn’t the one to hear her cry each brushing. He demanded that he have
    a child so that he could fulfill this parental fantasy. I told him that our youngest,
    Josh, had lovely, blond curls, and we could grow his hair out for this purpose.
    I rarely heard a complaint after that, but it reminds us how tied we are to traditions
    and gender identification in daily routines.'
  raw: '## When Opportunity Knocks


    When I was writing my first book I was lead author on, I wanted at least one female
    coauthor. There were some incredibly skilled women in the field of monitoring
    and automation at that time. I didn’t hesitate to reach out to a few of them and
    ask if they were interested in writing a chapter. I hadn’t had any difficulty
    finding male coauthors and found a few that volunteered to write chapters that
    had very little technical expertise in the area. The women I reached out to and
    even invited to be a coauthor reacted very differently to my request to author
    with me.


    There was doubt about if they were qualified and hesitation to accept the opportunity,
    and the two women I approached asked to be given time to verify that they could
    meet the demands of writing on a book. For these two women, it was a couple of
    months before I heard back from them, and by then, the opportunity to be an author
    was gone. As many of us already know, the women wanted to ensure that they were
    110% qualified and available to complete the task they were signing up for yet
