    # 性别偏见与技术领域的挑战


    近期出现了一个令人不安的趋势——为准父母举办性别揭晓派对。表面上看，这似乎是对即将诞生的孩子的一种良性庆祝，但对我来说，这是对孩子性别的一种令人不安的痴迷。这完全沉浸在粉色和蓝色的性别世界里，将男性和女性分隔开来，而不是让孩子们成为他们最可能成为的人。我在
    1970 年代长大，那是在嬉皮运动之后，我的衣服在今天看来是不分性别的——很少穿连衣裙，大多是灯芯绒裤子和衬衫，颜色与男孩穿的相同。我不是说穿带有亮片的粉紫色褶边连衣裙和套装是错误的。我要说的是，衣服不应该是性别标识物，我们不应该再用颜色来标识孩子两腿之间的性别。这些物品经常被用来判断一个孩子能做什么或不能做什么。由于游戏对于确定一个人以后对社会的潜在贡献至关重要，我们正在用性别偏见阻碍下一代的发展。我们用性别来决定哪些玩具是孩子可以玩的，这影响了我们未来一代成为最具生产力的社会成员的能力。


