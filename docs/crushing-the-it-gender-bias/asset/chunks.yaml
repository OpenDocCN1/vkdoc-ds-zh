  trans: '

    ### 局限偏见依旧存在


    在一项得到高度支持的皮尤研究中，54%拥有 17 岁以下子女的男性认为，全职母亲是养育孩子最理想的情况。^(⁶⁶) 当女性被纳入研究后，这一比例的增加无疑更为显著，因为这既是一种文化观念，也是一种自然认知。


    作为 2006 年发布的一篇论文^(⁶⁷)的组成部分，由我的`玛丽埃塔学院`进行，并由`凯莉·麦金托什`和`威廉·鲍尔博士`撰写的研究表明，职场母亲和全职母亲对孩子的成长影响差异甚微。不工作的父母在孩子年幼时能提供更多个人时间，并在活动期间给予支持；而职场父母的孩子在学校表现更佳，也更为独立。随着女性受教育程度和职业发展的提升，她们的薪资也随之增长，从而增加了子女所能获得的照料与服务。我们常听到“养育一个孩子需要举全村之力”，对于那些没有家人或朋友支持体系的父母来说，这些服务能让家庭中的每个人都受益。这项研究的核心结论是：无论你是全职母亲还是职场母亲，两者对孩子来说并无优劣之分，这应该是一个家庭的选择。研究还表明，美国文化对于女性外出工作仍然存在显著的偏见和争论，尽管数据证明事实并非如此。


    ### 没有“儿童席”


    接着我们进入另一个常令人不适的领域，那就是不想要自己孩子的职场女性所面临的挑战。尽管逻辑告诉我们，这与男性不想要孩子没什么不同，但针对女性的次级偏见让她们不被人信任或相信，这使她们处于一个非常艰难的境地。^(⁶⁸)
    在面试工作机会或晋升机会时，这些女性被问及将来是否打算生孩子的情况并不少见。尽管这与同事或雇主毫无关系，但她们不生育的决定仍受到质疑，并常被告知“你会改变主意的”。同样，选择不要孩子的女性常被指责为“自私”，而作为一个母亲，我认为恰恰相反。当一个人决定要孩子时，常见的原因是他们想要一个孩子去爱，以延续血脉，或满足其他欲望。选择生孩子并非一种无私的行为。无私体现在后来你（但愿）向孩子展现的爱，以及你如何将孩子培养成社会中有价值的一员。一旦你做到了这一点，你就完成了心愿之外的责任，但这个决定很少是没有想要满足的欲望而做出的。我们甚至读到过文章，称从未生育的女性更可能感到不满足。正如我们已经明确指出的，认为只有传统选择才能带来满足感的想法是一种迷思——每个女性都有自己的道路，而决定她一生是否成功的标准清单，就像她本人一样独特。


    我最小的妹妹`金柏莉`是一个觉得自己当姑姑更快乐、并决定不生孩子的女性。她令人无比振奋，拥有法学硕士学位，在一家很棒的公司从事知识内容工作，并在湾区享受着她的生活。如果她当初选择成为母亲，我看不出她能给世界带来更多价值。她极其独立，生活充实，拥有忙碌而成功的职业生涯，一有机会就去旅行。而我的二妹则不同，她一生大部分时间都做兼职工作，将母亲身份放在首位。`克里斯蒂`在更传统的人生选择中找到了满足感，我认为她如果走`金柏莉`的道路，不会感到同样满足。关键在于掌握我们各自的旅程，我们所有人都应该有机会选择那条最适合自己独特个性的道路，而不仅仅是遵循传统规范或媒体所定义的“成功”。


    我自己在为人母方面的抉择则介于我姐妹之间。我是三个亲生子女和两个年长继子女的母亲。虽然我比二妹孩子多，但我一直在工作，每次休完短暂的产假后便立即返岗。当我很忙碌的时候，我最为快乐，这在我作为职场母亲的身份上体现得淋漓尽致。我爱我的孩子们，甚至在孩子们很小的时候请了住家保姆（这并不像听起来那么光鲜，而且当你有了三个孩子，这通常比传统的日托更便宜）。我的孩子们年幼时，我是一位单身母亲，请住家保姆为我的孩子们提供了更传统的成长环境，同时我得以发展自己的事业，以最好的方式供养他们。这是我的道路——我自己的旅程。15
    年后，我的第二位保姆成了我最好的朋友之一。我雇用她做住家保姆时，她是一位单身的新手母亲，这种安排虽然并非传统（通常保姆没有孩子），但效果很好。她可以和她自己的孩子待在家里，而我也有人能在家里陪伴我的三个孩子。直到所有孩子都到了上学的年纪，我才选择换成标准的课后托管班。

    '
- fmt: '# Not Your Secretary


    The biggest challenge I found as a working mother was the ability for the men
    around me to have the option to offload the responsibilities to their family to
    address work challenges, while I was continually finding ways to manage both.
    When I started out, managers had little experience with employees working remote
    on after-hours projects or working from home when a child was ill. As much as
    my managers tried to empathize with the demands on me, it was the early 2000s,
    and there was still many of that generation still possessing a transparent dependency
    on their wives and family members to perform the duties that I only had myself
    to rely on. My ex-husband had grown up with a traditional stay-at-home mother,
    so he was still coming to terms with the idea that he needed to do more for the
    kids, and I didn’t have any family living near me to help out, either. I made
    a conscious decision in 2010 that I would only pursue remote work positions going
    forward. Technology had progressed enough to simplify working as a technical telecommuter.


    As others are quick to judge, it wasn’t due to difficulties performing duties
    as well as my male peers. I consistently outperformed those around me, but it
    removed a lot of unnecessary stress to no longer have to explain when I needed
    to take 15 minutes away from the office to pick up a child from school or stay
    home to work remote while a child nursed a fever. While my peers might destress
    during the day spending considerable time chatting in the office kitchen or goofing
    off, I had a tendency to make the most of my time at the office, and it was just
    the same when I worked from home. My productivity was off the charts, but since
    my teams were primarily all male, my requirements to ensure my responsibilities
    were addressed in all aspects of my life were different than theirs. Even though
    it was less than two decades ago, there was less identification of the imbalance
    I dealt with as a single, working mother. One of the biggest promises of the future
    is how often I hear male peers now stress the importance of picking up their kids
    from school, attending to sick kids or other challenges. This is all the made
    easier for everyone by the telecommuting opportunities of today. It’s no longer
    just a perk that women search out, but one that benefits the demands on men, too.


    In the last research on the topic, only 46% of Americans work from home at some
    point during the work week.^([^(69)](#fn69)) With all our advances, the percentage
    of those employees working from home has stayed flat from 2009 to 2017\. The reasons
    the number has stayed flat partially have to do with companies changing remote
    working policies back to in-office and it’s a discouraging trait. Remote work
    isn’t for everyone, but for those that it is a viable option, creates a harmony,
    and with technical advances, becomes more similar to the office every day.


    # The Telecommuter Question


    If you’re considering how to broach the topic of flexible work schedules for yourself,
    keep in mind telecommuting is easier for certain technical roles than others.
    A database administrator or developer will have less challenges than a project
    manager who may require face-to-face meetings or access to a less tech savvy business
    user on a regular basis. Before any discussion can be proposed with your manager
    or peers, ensure that you have the technology in place to support the transition
    to a remote workplace.


    Questions you’ll have to answer:


    1. Do you have a dedicated office—separate from home and family distractions?

    2. What is the quality of your cell phone and Wi-Fi reception?

    3. If you have an outage, are you able to work in the office or have a secondary
    option to compensate?

    4. Will you need to migrate from a desktop workstation to a laptop?

    5. How often does your team meet in person? With customers/users?


    Software for communication may include:


    * `Slack`

    * `Teams`

    * Web meeting software, such as `Webex`, `Skype`, etc.


    Software for task assignment:


    * `Jira`

    * `MS Project`


    For anyone working in technology that has versioning requirements on code or scripts,
    additional repository and tracking software will be required, such as `Subversion`,
    `Github`, `Git`, etc. A centralized location for documentation is beneficial to
    ensure that vital information isn’t retained on local workstations.


    You will need to make sure that you’re easy to access remotely via phone and computer.
    Your cellphone and Wi-Fi should both have excellent reception and service in the
    location you plan on working from. You may want to invest in a “MiFi,” a small
    device to use for a hot spot connection for devices to a cell provider. Many have
    asked me how this is different than toggling to your cell phone, and the benefit
    is that your PC won’t be competing for bandwidth with all the applications and
    services on your cell phone if you have a dedicated hotspot.


    Once you’ve done the research and verified that you have the technology to support
    a remote workplace, document your case to present to your management. The conversation
    should begin as an informal conversation to “gauge” the reception from those who
    make the decision. If you’re the first person to ask for a remote work or flexible
    schedule, it may not be easy to bring up the topic, but if you have good leadership
    in place, he/she should be receptive to the conversation. Once it’s agreed to
    have a formal discussion, ensure that there is a meeting invitation to track the
    conversation going forward and follow up at the end of each talk to continue to
    progress toward a decision.


    Focusing on the data surrounding telecommuting can be a hit or miss—there are
    always going to be those sources that have a negative view of remote workers.
    Yahoo and Hewlett Packard are two companies who recently recalled all remote workers
    to the office. Although Yahoo has continued to dissuade telecommuting, HP quickly
    became aware that they weren’t able to support the 300K remote workers in their
    existing office space and moved to a flexible schedule to accommodate everyone.
    If either one is brought up as a reason to not consider remote work options for
    you, focusing on the stock values of these companies and lacking diversity can
    assist in rebuking the talking points. Both Yahoo (Altaba) and HP suffered a significant
    loss during the 3 years following the recall of remote workers, along with employee
    turnover.


    If you’re successful in your proposal to telecommute, the move to a remote work
    environment may involve a transition period with partial days still in the office.
    If you’ve been in your role for a period and have a track record of above average
    performance, the trial period shouldn’t be more than a few months and agreed upon
    with management. A request to attain a flexible work schedule, testing it out
    with 2–3 days remote should be all that is required to prove out a remote work
    option and plan on keeping track of successes, along with lessons learned.'
  raw: '#### Not Your Secretary


    The biggest challenge I found as a working mother was the ability for the men
    around me to have the option to offload the responsibilities to their family to
    address work challenges, while I was continually finding ways to manage both.
    When I started out, managers had little experience with employees working remote
    on after-hours projects or working from home when a child was ill. As much as
    my managers tried to empathize with the demands on me, it was the early 2000s,
    and there was still many of that generation still possessing a transparent dependency
    on their wives and family members to perform the duties that I only had myself
    to rely on. My ex-husband had grown up with a traditional stay-at-home mother,
    so he was still coming to terms with the idea that he needed to do more for the
    kids, and I didn’t have any family living near me to help out, either. I made
    a conscious decision in 2010 that I would only pursue remote work positions going
    forward. Technology had progressed enough to simplify working as a technical telecommuter.


    As others are quick to judge, it wasn’t due to difficulties performing duties
    as well as my male peers. I consistently outperformed those around me, but it
    removed a lot of unnecessary stress to no longer have to explain when I needed
    to take 15 minutes away from the office to pick up a child from school or stay
    home to work remote while a child nursed a fever. While my peers might destress
    during the day spending considerable time chatting in the office kitchen or goofing
    off, I had a tendency to make the most of my time at the office, and it was just
    the same when I worked from home. My productivity was off the charts, but since
    my teams were primarily all male, my requirements to ensure my responsibilities
    were addressed in all aspects of my life were different than theirs. Even though
    it was less than two decades ago, there was less identification of the imbalance
    I dealt with as a single, working mother. One of the biggest promises of the future
    is how often I hear male peers now stress the importance of picking up their kids
    from school, attending to sick kids or other challenges. This is all the made
    easier for everyone by the telecommuting opportunities of today. It’s no longer
    just a perk that women search out, but one that benefits the demands on men, too.


    In the last research on the topic, only 46% of Americans work from home at some
    point during the work week.^([^(69)](#fn69)) With all our advances, the percentage
    of those employees working from home has stayed flat from 2009 to 2017\. The reasons
    the number has stayed flat partially have to do with companies changing remote
    working policies back to in-office and it’s a discouraging trait. Remote work
    isn’t for everyone, but for those that it is a viable option, creates a harmony,
    and with technical advances, becomes more similar to the office every day.


    #### The Telecommuter Question


    If you’re considering how to broach the topic of flexible work schedules for yourself,
    keep in mind telecommuting is easier for certain technical roles than others.
    A database administrator or developer will have less challenges than a project
    manager who may require face-to-face meetings or access to a less tech savvy business
    user on a regular basis. Before any discussion can be proposed with your manager
    or peers, ensure that you have the technology in place to support the transition
    to a remote workplace.


    Questions you’ll have to answer:


    1.  Do you have a dedicated office—separate from home and family distractions?


    2.  What is the quality of your cell phone and Wi-Fi reception?


    3.  If you have an outage, are you able to work in the office or have a secondary
    option to compensate?


    4.  Will you need to migrate from a desktop workstation to a laptop?


    5.  How often does your team meet in person? With customers/users?


    Software for communication may include


    *   Slack


    *   Teams


    *   Web meeting software, such as Webex, Skype, etc.


    Software for task assignment:


    *   Jira


    *   MS Project


    For anyone working in technology that has versioning requirements on code or scripts,
    additional repository and tracking software will be required, such as Subversion,
    Github, Git, etc. A centralized location for documentation is beneficial to ensure
    that vital information isn’t retained on local workstations.


    You will need to make sure that you’re easy to access remotely via phone and computer.
    Your cellphone and Wi-Fi should both have excellent reception and service in the
    location you plan on working from. You may want to invest in a “MiFi,” a small
    device to use for a hot spot connection for devices to a cell provider. Many have
    asked me how this is different than toggling to your cell phone, and the benefit
    is that your PC won’t be competing for bandwidth with all the applications and
    services on your cell phone if you have a dedicated hotspot.


    Once you’ve done the research and verified that you have the technology to support
    a remote workplace, document your case to present to your management. The conversation
    should begin as an informal conversation to “gauge” the reception from those who
    make the decision. If you’re the first person to ask for a remote work or flexible
    schedule, it may not be easy to bring up the topic, but if you have good leadership
    in place, he/she should be receptive to the conversation. Once it’s agreed to
    have a formal discussion, ensure that there is a meeting invitation to track the
    conversation going forward and follow up at the end of each talk to continue to
    progress toward a decision.


    Focusing on the data surrounding telecommuting can be a hit or miss—there are
    always going to be those sources that have a negative view of remote workers.
    Yahoo and Hewlett Packard are two companies who recently recalled all remote workers
    to the office. Although Yahoo has continued to dissuade telecommuting, HP quickly
    became aware that they weren’t able to support the 300K remote workers in their
    existing office space and moved to a flexible schedule to accommodate everyone.
    If either one is brought up as a reason to not consider remote work options for
    you, focusing on the stock values of these companies and lacking diversity can
    assist in rebuking the talking points. Both Yahoo (Altaba) and HP suffered a significant
    loss during the 3 years following the recall of remote workers, along with employee
    turnover.


    If you’re successful in your proposal to telecommute, the move to a remote work
    environment may involve a transition period with partial days still in the office.
    If you’ve been in your role for a period and have a track record of above average
    performance, the trial period shouldn’t be more than a few months and agreed upon
    with management. A request to attain a flexible work schedule, testing it out
    with 2–3 days remote should be all that is required to prove out a remote work
    option and plan on keeping track of successes, along with lessons learned.'
  trans: '

    # 不是你的秘书


    作为一名职场母亲，我面临的最大挑战是：我身边的男性可以将家庭责任转嫁给家人以应对工作难题，而我却要不断寻找平衡两者的方法。在我刚步入职场时，管理者们几乎没有处理员工在非工作时间远程工作或孩子生病时在家办公的经验。尽管我的上司们尽力体谅我的处境，但那时是
    21 世纪初，那一代人中的许多人仍然明显依赖妻子和家人来承担那些我只能依靠自己的职责。我的前夫成长于一个传统的全职母亲家庭，所以他还在慢慢接受自己需要为孩子付出更多的观念，而且我身边也没有任何亲人可以帮忙。2010
    年，我下定决心今后只寻求远程工作岗位。当时技术已经足够成熟，让技术型远程办公变得便捷。


    正如其他人容易评判的那样，这并非因为我在履行职责上不如男性同事。我的表现一直优于周围的人，但远程工作让我不再需要解释为什么需要离开办公室 15 分钟去接孩子放学，或是在孩子发烧时居家办公，这大大减轻了不必要的压力。当我的同事们可能白天在办公室厨房闲聊或偷懒来减压时，我往往充分利用在办公室的时间，而在家办公时也同样如此。我的工作效率极高，但由于我的团队几乎全是男性，我在生活中各方面确保责任落实的需求与他们是不同的。尽管这还不到二十年前的事，但当时对我作为一名单身职场母亲所面临的不平衡处境，人们的认识还很少。未来最大的希望之一在于，我经常听到男性同事现在强调接送孩子、照顾生病的孩子或其他挑战的重要性。当今的远程办公机会让这一切对每个人都变得更加容易。这不再仅仅是女性寻求的福利，也惠及了男性面临的责任需求。


    根据最近关于该话题的研究，只有 46%的美国人在工作周的某个时段在家办公。^(⁶⁹) 尽管我们取得了诸多进步，但从 2009 年到 2017 年，在家办公的员工比例一直持平。这一比例持平的部分原因在于一些公司将远程办公政策改回坐班制，这是一个令人沮丧的趋势。远程工作并不适合所有人，但对于那些可行的人来说，它能创造一种和谐，并且随着技术进步，它日益接近在办公室工作的体验。


    # 远程办公之问


    如果你正在考虑如何为自己提出弹性工作制的话题，请记住远程办公对于某些技术岗位比其他岗位更容易实现。数据库管理员或开发者面临的挑战会比项目经理少，后者可能需要定期进行面对面会议或接触不太懂技术的业务用户。在与上司或同事进行任何讨论之前，请确保你已具备支持过渡到远程工作场所的技术条件。


    你需要回答的问题：


    1.  你是否有独立的办公室——远离家庭和家人的干扰？

    2.  你的手机和 Wi-Fi 信号质量如何？

    3.  如果出现网络中断，你是否能去办公室工作，或者有备选方案来弥补？

    4.  你是否需要从台式工作站更换为笔记本电脑？

    5.  你的团队多久进行一次面对面会议？与客户/用户的会议呢？


    用于沟通的软件可能包括：


    *   `Slack`

    *   `Teams`

    *   网络会议软件，例如 `Webex`、`Skype` 等。


    用于任务分配的软件：


    *   `Jira`

    *   `MS Project`


    对于任何从事技术工作且对代码或脚本有版本控制需求的人来说，还需要额外的代码仓库和跟踪软件，例如 `Subversion`、`Github`、`Git` 等。一个集中的文档存放位置非常有益，可以确保重要信息不会只保留在本地工作站上。


    你需要确保自己可以通过电话和计算机轻松远程访问。你计划工作的地点，手机和 Wi-Fi 都应有出色的信号和服务。或许你可以考虑投资一个“MiFi”，这是一种小型设备，可为设备提供连接到移动运营商的移动热点。很多人问我这与切换到手机热点有何不同，其优势在于，如果你有一个专用热点，你的电脑就不需要与手机上的所有应用和服务争夺带宽。


    一旦你做好研究并确认拥有支持远程工作的技术，就整理好你的案例提交给管理层。谈话应以非正式的方式开始，以“试探”决策者的态度。如果你是第一个提出远程工作或弹性工作制要求的人，提出这个话题可能并不容易，但如果你有一位好的领导，他/她应该会乐于接受这样的对话。一旦同意进行正式讨论，请确保安排一个会议邀请来记录后续的对话，并在每次会谈后跟进，以继续推动决策。


    关注远程办公的相关数据可能效果不一——总会有一些来源对远程工作者持负面看法。雅虎和惠普是最近两家要求所有远程员工回到办公室的公司。尽管雅虎继续劝阻远程办公，但惠普很快意识到他们无法在现有办公空间容纳
    30 万远程员工，于是转而采用弹性工作制来适应所有人。如果有人拿这两家公司作为理由反对你考虑远程工作的选项，那么强调这两家公司的股价以及缺乏多样性，有助于反驳这些观点。在召回远程员工后的三年内，雅虎和惠普都遭受了重大损失，同时伴随着员工流失。


    如果你成功获得了远程工作的提议，过渡到远程工作环境可能涉及一个过渡期，在此期间部分天数仍要在办公室办公。如果你已经在现任职位上工作了一段时间，并且有高于平均水平的绩效记录，那么试用期不应超过几个月，并且需要与管理层达成一致。要获得弹性工作制，先尝试每周远程工作
    2-3 天就足以证明远程工作选项的可行性，并计划记录下成功经验以及经验教训。

