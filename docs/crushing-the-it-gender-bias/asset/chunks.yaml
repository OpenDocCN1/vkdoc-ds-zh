    \  \n© Kellyn Pot'Vin-Gorman 2019  \n\n本作品受版权保护。出版商保留所有权利，无论涉及全部或部分材料，具体包括翻译权、重印权、插图复用权、朗诵权、广播权、以缩微胶片或其他任何物理方式复制权，以及传输或信息存储与检索、电子改编、计算机软件，或当前已知或未来开发的类似或不同方法的权利。本书中可能出现商标名称、标识和图像。我们不会在每次出现商标名称、标识或图像时都使用商标符号，而是仅以编辑方式使用这些名称、标识和图像，以维护商标所有者的利益，且无意侵犯商标权。本出版物中对商号、商标、服务标记及类似术语的使用（即使未明确标示）也不应被视为对其是否受专有权利保护的看法表达。\n\
