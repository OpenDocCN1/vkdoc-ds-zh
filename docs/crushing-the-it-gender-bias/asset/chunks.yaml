- fmt: 'This requires significant patience to get to this point in your career. Patience
    is a virtue and for women in tech, patience can be mandatory—patience and persistence
    to keep trying when others have given up. I have an old Hebrew proverb attached
    to my bulletin board, “Fall down seven times, get up eight.” This sums up the
    difference between failure and success. Many of those we admire for their success
    will tell you that persistence is the key. It’s not that they did so much right
    and won but that they persevered and continued when others gave up. The more women
    that do this in tech, *vs.* leaving it for an easier path, will lead the way to
    making women the norm in technology.


    The challenges we face in the women in tech space may seem overwhelming, but to
    break it down into bite size chunks and just do something to change a little of
    it every day is the way to make the biggest impact. Being gracious and showing
    compassion to those as we do will guarantee that we don’t lose our humanity while
    we’re at it.


    ## For the Love of Tech


    With so many chapters on the challenges and what we need to change, someone might
    ask why we’re in it at all. I am all about evolving and ever bettering the world
    around me. With that, I have to say that I’ve had an incredible career in tech.
    Working in technology has granted me the ability to do what most working women
    haven’t had the chance to do. I’ve been the bread winner for my family while working
    the last decade from home to care for those that need me and now have the salary
    to put all three of my children through college, debt free. There aren’t many
    careers outside of technology that will offer you that kind of opportunity.


    I work in an industry that is changing as fast as my brain moves. I am practically
    the spokesperson for women with ADHD. I need a fast-paced career with a variety
    of interesting tasks and challenges. I appreciate the ability to hyperfocus on
    a task, and feeling the loss of focus, I can switch to another different and engaging
    challenge.


    I need a flexible schedule that allows me to be more than just an employee. I’ve
    been able to find mentors and sponsors to provide me outlets to build more of
    my career outside of my day job. I’ve been able to contribute and share my knowledge
    with the wider world online and in person at conferences and events. I’ve been
    able to travel throughout the world, at the level I wanted to invest, to share
    what I’ve learned. I have friends all over the world that I wouldn’t have met
    if I wasn’t in technology.


    My career lets me spread my wings and reach into other technical areas than just
    the one I’ve been hired to do. I’ve had the opportunity to volunteer my time to
    STEM education and worthy causes. I have discovered other like-minded individuals
    to build communities that do more than just do a job; we build solutions for companies
    that required the thought leadership of a large community. I’ve been able to work
    with some of the biggest Oracle and Microsoft databases in my day job and then
    go to a user group event and present with one of the smallest computers, working
    with Raspberry Pi. As these small, single ARM computers weren’t around when I
    was young, it allowed me to relive my childhood and get the opportunity to work
    with the technology that I never had the chance to when I was a kid.


    With all our children grown, my husband and I have shifted into the next phase
    of our life. We’re not ready for retirement, but we didn’t want to let life pass
    us by, either. We sold our home in the Denver area, and as I now work for Microsoft,
    we moved into a luxury RV. We travel the United States while working remote, immersing
    ourselves in the towns and cities we think might be potential next homes. There
    aren’t a lot of career choices that would allow for that kind of freedom and stability.


    As I’ve progressed through my career, I made clear notes of what worked to keep
    me on my own path and what didn’t. My current position with Microsoft is by far,
    my favorite. I have the freedom to be as technical as I want and the demand to
    keep me busy like I like. Although I’m still on a team with all guys, the strong
    diversity and inclusion education at the company have helped to ensure that I’m
    truly treated as an equal. If unconscious bias does arise, there are straightforward
    methods to address it openly and without repercussions. I think this is a goal
    for most people in my industry—be happy, be productive, and be more than you were
    yesterday.


    Being part of technology is important, as technology keeps me connected to my
    mobile life, family, and job. My children (as the last two are still in college)
    live far away from me with the travels. If they need anything, I’m instantly accessible
    and connected.'
  raw: 'This requires significant patience to get to this point in your career. Patience
    is a virtue and for women in tech, patience can be mandatory—patience and persistence
    to keep trying when others have given up. I have an old Hebrew proverb attached
    to my bulletin board, “Fall down seven times, get up eight.” This sums up the
    difference between failure and success. Many of those we admire for their success
    will tell you that persistence is the key. It’s not that they did so much right
    and won but that they persevered and continued when others gave up. The more women
    that do this in tech, *vs.* leaving it for an easier path, will lead the way to
    making women the norm in technology.


    The challenges we face in the women in tech space may seem overwhelming, but to
    break it down into bite size chunks and just do something to change a little of
    it every day is the way to make the biggest impact. Being gracious and showing
    compassion to those as we do will guarantee that we don’t lose our humanity while
    we’re at it.


    ## For the Love of Tech


    With so many chapters on the challenges and what we need to change, someone might
    ask why we’re in it at all. I am all about evolving and ever bettering the world
    around me. With that, I have to say that I’ve had an incredible career in tech.
    Working in technology has granted me the ability to do what most working women
    haven’t had the chance to do. I’ve been the bread winner for my family while working
    the last decade from home to care for those that need me and now have the salary
    to put all three of my children through college, debt free. There aren’t many
    careers outside of technology that will offer you that kind of opportunity.


    I work in an industry that is changing as fast as my brain moves. I am practically
    the spokesperson for women with ADHD. I need a fast-paced career with a variety
    of interesting tasks and challenges. I appreciate the ability to hyperfocus on
    a task, and feeling the loss of focus, I can switch to another different and engaging
    challenge.


    I need a flexible schedule that allows me to be more than just an employee. I’ve
    been able to find mentors and sponsors to provide me outlets to build more of
    my career outside of my day job. I’ve been able to contribute and share my knowledge
    with the wider world online and in person at conferences and events. I’ve been
    able to travel throughout the world, at the level I wanted to invest, to share
    what I’ve learned. I have friends all over the world that I wouldn’t have met
    if I wasn’t in technology.


    My career lets me spread my wings and reach into other technical areas than just
    the one I’ve been hired to do. I’ve had the opportunity to volunteer my time to
    STEM education and worthy causes. I have discovered other like-minded individuals
    to build communities that do more than just do a job; we build solutions for companies
    that required the thought leadership of a large community. I’ve been able to work
    with some of the biggest Oracle and Microsoft databases in my day job and then
    go to a user group event and present with one of the smallest computers, working
    with Raspberry Pi. As these small, single ARM computers weren’t around when I
    was young, it allowed me to relive my childhood and get the opportunity to work
    with the technology that I never had the chance to when I was a kid.


    With all our children grown, my husband and I have shifted into the next phase
    of our life. We’re not ready for retirement, but we didn’t want to let life pass
    us by, either. We sold our home in the Denver area, and as I now work for Microsoft,
    we moved into a luxury RV. We travel the United States while working remote, immersing
    ourselves in the towns and cities we think might be potential next homes. There
    aren’t a lot of career choices that would allow for that kind of freedom and stability.


    As I’ve progressed through my career, I made clear notes of what worked to keep
    me on my own path and what didn’t. My current position with Microsoft is by far,
    my favorite. I have the freedom to be as technical as I want and the demand to
    keep me busy like I like. Although I’m still on a team with all guys, the strong
    diversity and inclusion education at the company have helped to ensure that I’m
    truly treated as an equal. If unconscious bias does arise, there are straightforward
    methods to address it openly and without repercussions. I think this is a goal
    for most people in my industry—be happy, be productive, and be more than you were
    yesterday.


    Being part of technology is important, as technology keeps me connected to my
    mobile life, family, and job. My children (as the last two are still in college)
    live far away from me with the travels. If they need anything, I’m instantly accessible
    and connected.'
  trans: '

    要在职业生涯中达到这一阶段，需要极大的耐心。耐心是一种美德，而对于科技领域的女性来说，耐心几乎是必备品质——当其他人已经放弃时，需要耐心和坚持继续尝试。我的公告板上贴着一句古老的希伯来谚语：“跌倒七次，爬起来八次。”这句话概括了失败与成功的区别。许多我们钦佩的成功人士会告诉你，坚持是关键。并非他们做对了那么多事而获胜，而是当别人放弃时，他们坚持不懈、继续前行。在科技领域，越多的女性这么做，*而不是*选择一条更轻松的道路，就能引领女性成为科技领域的常态。


    我们在科技领域女性所面临的挑战可能看似巨大，但将其分解成小块，每天做一点点改变，才是产生最大影响的方式。在此过程中，待人谦和、富有同情心，将确保我们在努力的同时不会失去人性。


    ## 热爱科技


    鉴于书中用了大量篇幅讨论挑战以及我们需要改变什么，有人可能会问，我们为何还要置身其中。我始终致力于不断发展并让周围的世界变得更好。正因如此，我必须说，我在科技领域拥有了一段非凡的职业生涯。从事科技工作让我得以做到大多数职业女性没有机会做的事情。过去十年里，我一直在家工作，既能照顾需要我的人，又能成为家庭的经济支柱。如今，我的薪水足以让我的三个孩子完成大学学业，且无需背负债务。在科技领域之外，没有多少职业能为你提供这样的机会。


    我所在的行业变化之快，几乎与我的思维速度同步。我几乎是患有注意力缺陷多动症（ADHD）的女性的代言人。我需要一种快节奏的职业，其中包含各种有趣的任务和挑战。我欣赏能够高度专注于一项任务的能力，一旦感到注意力涣散，我可以转而投入另一个不同且吸引人的挑战。


    我需要灵活的工作安排，让我不仅仅是一名员工。我能够找到导师和赞助人，为我提供渠道，让我在正职之外发展自己的职业生涯。我能够在线以及在线下会议和活动中，向更广阔的世界贡献并分享我的知识。我能按照自己期望的投入程度环游世界，分享我所学到的东西。我在世界各地都有朋友，如果不是因为从事科技行业，我根本不会遇到他们。


    我的职业生涯让我能够展翅高飞，涉足我被聘用领域之外的其它技术领域。我有机会将时间志愿奉献给 STEM 教育和有价值的事业。我发现了其他志同道合的人，共同建立社区，其意义远不止于完成一份工作；我们为那些需要大型社区思想领导力的公司构建解决方案。在我的日常工作中，我曾与一些最大的
    Oracle 和 Microsoft 数据库打交道；而到了用户组活动中，我又能用最小的计算机（如树莓派）进行演示。由于我年轻时这种小型单 ARM 计算机并不存在，这让我得以重温童年，有机会接触我小时候从未有机会使用的技术。


    随着孩子们都已长大成人，我和丈夫进入了人生的下一个阶段。我们还没准备好退休，但也不想让生活就这样从身边溜走。我们卖掉了丹佛地区的房子，由于我现在为微软工作，我们搬进了一辆豪华房车。我们一边远程工作，一边在美国各地旅行，沉浸在我们认为可能成为下一个家的城镇和城市中。没有多少职业选择能提供这样的自由和稳定。


    在我的职业生涯中，我清楚地记录了哪些方法有助于我坚持自己的道路，哪些则没有。我在微软的现任职位是我迄今为止最喜欢的。我拥有随心所欲钻研技术的自由，以及我所喜欢的足以让我保持忙碌的工作需求。尽管我仍然在一个全是男性的团队中，但公司强大的多元化和包容性教育确保了我在真正意义上被平等对待。如果无意识的偏见确实出现，也有直接的方法可以公开处理，而无需担心后果。我想这是行业里大多数人的目标——快乐、高效，并且比昨天的自己更出色。


    成为科技领域的一部分很重要，因为科技让我与移动生活、家人和工作保持联系。由于旅行，我的孩子们（最后两个还在上大学）离我很远。如果他们需要什么，我能立即联系上他们。

    '
- fmt: "# 远程工作的技术与多样性\n\n有些人对我能如此远程工作感到困惑，但随着近期的技术发展，我能够通过一个专用的移动热点在线工作，这让我比那些使用住宅WiFi连接的同行拥有更好的连接性。我通过网络会议与客户会面，支持他们使用Microsoft数据平台和AI技术栈，如果他们需要我到现场，我只需找一个附近的机场飞过去，这种情况并不常见。我的办公室实际上可以装进一个小背包，而且众所周知，技术正变得越来越小、越来越便携。\n\
    \n这就是技术为我提供的生活，我希望无论从事哪个行业，其他人也能获得这种满足感。但在谈到技术时，我也想要指出我们一直失败的地方。我拥有技能、运气、毅力和巨大支持的组合，从而成就了非凡的职业生涯，我希望其他人也能如此。梦想是，当我到达一所学校时，有30%或更多的女孩对学习技术职业感兴趣。如果我们努力，技术部门能够紧密代表我们所生活的现实世界的那一天是可以实现的。\n\
    \n对于女性和有色人种来说，在技术领域存在大量的机会，每个人都应该有途径获得这些机会。当他们拥有这些机会时，我们所有人都能从中受益。除了那些不恰当的评论、隐形、晋升跳过和性别薪酬差距之外，还有包容性和多样性的招聘实践倡议。即使由于女性或有色人种候选人数量有限，被雇佣者中男性比例仍然更高，但这些男性更倾向于以开放的心态思考包容性和多样性。他们不太可能限制身边的女性和有色人种，因为招聘流程已经改变，包含了这些重要方面，无论他们雇佣谁。这不仅仅关乎被雇佣者的种族或性别，还关乎此人如何看待包容性和多样性。\n\
    \n这是一个改变游戏规则的因素，因为我们认识到，**我们所有人都是解决方案的一部分**。当每个人都专注于多样性（图[6-2](#469679_1_En_6_Chapter.xhtml#Fig2)）是产品和收入成功的关键这一目标时，女性和有色人种也会随之成功。偏见减少了，我们会有更多女性担任技术和领导职位。\n\
    \n![../images/469679_1_En_6_Chapter/469679_1_En_6_Fig2_HTML.png](images/469679_1_En_6_Chapter/469679_1_En_6_Fig2_HTML.png)\n\
    \n图6-2. 技术行业的整体多样性，TechCrunch 2018\n\n当男性试图驾驭这个领域并超越我们从小被灌输的偏见时，他们可能想知道如何成为女性和有色人种的成功倡导者。以下是一些可靠的方法，可以赋能你身边的人变得更好。\n\
    \n1.  注意你是否可能对身边的人表现出居高临下或屈尊俯就的态度。这是疏远技术领域女性最快的方式之一。\n\n2.  除非一位女性**直接**请求你解释某件事，否则**不要**解释。“男性说教”这个说法并不令人愉快，但它确实经常发生。\n\
    \n3.  当你目睹偏见时，要发声。\n    1.  如果女性的想法或工作成果被归功于他人，请指出来。\n    2.  如果一位女性难以插话，请通过打断那个或那群人，说“我们还没听到XXXX的意见，我想听听她怎么说”来帮助她。\n\
    \    3.  当讨论晋升或任务分配时，注意是否有女性同事被推荐。如果没有，推荐一位。\n    4.  如果一位男同事在与女性同事互动时遇到困难，考虑把他拉到一边私下讨论。如果他倾向于反击，你的介入如果让他难堪，可能会加剧这种行为。\n\
    \    5.  “更衣室”谈话对女性在团队中的地位或职业生涯具有极大的破坏性。要指出来，并要求停止这种行为。\n\n男性在这些情况下处于特权地位，作为盟友，他们在行业中拥有巨大的变革力量。成为身边人的倡导者可以创造更好的工作场所、更好的团队，以及更成功的业务。^([^(125)](#fn125))\n\
    \n技术变得以男性为中心的主要驱动力之一是20世纪80年代面向男孩的电脑营销。不仅仅是广告，连游戏也都是针对男性兴趣设计的。^([^(126)](#fn126))\
    \ 想想这个决定让占人口50%的年轻女性失去了多少收入。我相信这是历史上的一个关键错误，既损失了收入，也损失了来自杰出技术人才的数十年的贡献。为了让我们真正以光速前进，我们需要将整个社会的全面代表带入技术的设计和开发中。任何由孤立群体完成的事情都只会继续产生有缺陷的结果，并且永远无法发挥其全部潜力。\n\
    \n在当今市场，多样性对企业的好处是更大的竞争优势，女性做出85%的购买决策，企业开始意识到这一人群要求产品反映他们需求的诉求。^([^(127)](#fn127))\
    \ 最令人惊讶的是，大多数是30岁以下的女性。这很少是技术创造者的面孔，这种情况需要改变。\n\n有趣的是，已有研究证明——这不仅仅是理论。斯坦福大学^([^(128)](#fn128))和哈佛大学^([^(129)](#fn129))都表明，当技术人员更能代表最终用户时，就会产生更高质量的产品。这导致收入增加、公司更成功，以及企业如果没有多元化基础就无法获得的竞争优势。拥有更多元化的技术劳动力的第二个好处是，工资会上升，性别薪酬差距会缩小。^([^(130)](#fn130))\
    \ 软件开发、项目管理和计算机系统是我们当今劳动力市场中需求量最大的三个岗位，更多的代表是让更多女孩早期对这些领域产生兴趣的关键。\n\n由于当前学校体系缺乏技术教育，导致计算机科学毕业生数量有限（图[6-3](#469679_1_En_6_Chapter.xhtml#Fig3)），这可能要求我们严重依赖“意外技术人员”。^([^(131)](#fn131))\
    \ 这类技术专业人士，即非科班出身但因需求而入行的人，目前约占我所在数据库行业从业人员的50%。这些人要么拥有计算机科学以外的学位，要么来自军队，或者有些人只是不适应标准的学校课程但精通技术，而劳动力的匮乏让他们获得了足够多的经验，以至于学位已不再是必要条件。\n\
    \n![../images/469679_1_En_6_Chapter/469679_1_En_6_Fig3_HTML.png](images/469679_1_En_6_Chapter/469679_1_En_6_Fig3_HTML.png)\n\
    \n图6-3. 专注于CS职业的学生比例与劳动力需求对比。来源：[`https://code.org`](https://code.org)\n\n考虑到未来两年我们将需要的技术人员数量庞大，我相信我们会看到越来越多的“意外技术人员”进入行业的新岗位。这需要培训，他们通常从以前更有资格的岗位开始，然后发现自己被引导去发现技术技能，从而在新的技术岗位上取得成功。我不认为这是一个缺陷，因为它最终会让技术行业变得更加全面。"
  raw: "It baffles some people how I can work remote as I do, but with recent technical\
    \ developments, I’m able to work online with a dedicated mobile hotspot that allows\
    \ me better connectivity than my peers with a residential WiFi connection. I meet\
    \ with customers via web meetings to support them in the Microsoft Data Platform\
    \ and AI stack, and if they need me on-site, I just need an airport close to fly\
    \ out, which isn’t very often. My office practically fits in a small backpack,\
    \ and as we all know, technology is getting smaller and more mobile every day.\n\
    \nThis is the life that technology provides me, and I want this type of satisfaction\
    \ for others, no matter what industry serves them, but when it comes to tech,\
    \ I want to address where we’ve been failing, too. I’ve had a combination of skill,\
    \ luck, persistence, and great support to make for an incredible career, and I\
    \ want that for others. The dream where I arrive at a school and 30% or more of\
    \ the girls are interested in learning about a career in tech is out there. The\
    \ day when a tech department closely represents the real world we live in is achievable\
    \ if we try.\n\nThere is a litany of opportunities that are out there for women\
    \ and people of color in technology that everyone should have access to. We all\
    \ benefit from it when they have them. Beyond the slew of inappropriate comments,\
    \ invisibility, bypass of promotions, and gender pay gap, there are the initiatives\
    \ of hiring practices of inclusion and diversity. Even when those hired are more\
    \ likely still to be male due to limited numbers of female or candidates of color,\
    \ these men are more inclined to think openly about inclusion and diversity. They\
    \ are less likely to limit the women and people of color around them because the\
    \ hiring process has changed to include these important aspects in anyone they\
    \ hire. It’s not just about the race or gender of who they hire, but how the person\
    \ thinks about inclusion and diversity.\n\nThis is a game changer, as we embrace\
    \ that we ALL are part of the solution. With everyone focused on the goal that\
    \ diversity (Figure [6-2](#469679_1_En_6_Chapter.xhtml#Fig2)) is key to success\
    \ in product and revenue, women and people of color succeed along with. Bias diminishes,\
    \ and we have more women in tech and leadership positions.\n\n![../images/469679_1_En_6_Chapter/469679_1_En_6_Fig2_HTML.png](images/469679_1_En_6_Chapter/469679_1_En_6_Fig2_HTML.png)\n\
    \nFigure 6-2.\n\nOverall diversity in the technical industry, TechCrunch 2018\n\
    \nAs men try to navigate this space and move past the bias that we’re all raised\
    \ with, they may wonder how to be a successful advocate for women and people of\
    \ color. There are some surefire ways to empower those around you to be better.\n\
    \n1.  Be aware when you might patronize or be condescending to those around you.\
    \ This is one of the quickest ways to alienate women in technology.\n\n2.  Unless\
    \ a woman DIRECTLY asks you to explain something, DON’T. The term “mansplaining”\
    \ isn’t pleasant, and it does happen too often.\n\n3.  Speak up when you witness\
    \ bias.\n    1.  Point out if a woman’s idea or work has been credited to someone\
    \ else.\n\n2.  If a woman is having difficulty getting a word in edgewise, assist\
    \ her by interrupting the person or group by saying, “We haven’t heard from XXXX,\
    \ I’d like to hear what she has to say.”\n\n3.  When discussion arises on promotions\
    \ or assignment of tasks, note if female peers were recommended. If not, recommend\
    \ one.\n\n4.  If a male colleague is having difficulty interacting with women\
    \ peers, consider taking him aside and discussing it privately. If he’s inclined\
    \ to backlash, your intrusion, if embarrassing, could escalate the behavior.\n\
    \n5.  “Locker room” talk is incredibly destructive to women’s standing on a team\
    \ or her career. Call it out, and request it stop.\n\nMen, coming from a place\
    \ of privilege in these situations, have incredible power of change in the industry\
    \ as allies. Being advocates for those around you can make for a better work place,\
    \ better team, and a more successful business.^([^(125)](#fn125))\n\nOne of the\
    \ great drivers of technology becoming male centric was the marketing in the 1980s\
    \ of computers to boys. Not just the commercials, but the games were designed\
    \ toward male interests.^([^(126)](#fn126)) Consider the lost revenue to young\
    \ women, 50% of the population, by this decision. I believe this was a critical\
    \ mistake in history costing both revenue and decades of contribution from phenomenal\
    \ potential technologists. For us to truly move at the speed of light, we need\
    \ to bring a full representation of our society into the design and development\
    \ of our technology. Having anything done by an isolated group is only going to\
    \ continue to produce a flawed outcome and never achieve its full potential.\n\
    \nThe benefit of diversity to business is a larger competitive advantage in today’s\
    \ market, with women making 85% of the buying decisions and business is beginning\
    \ to realize the demand of the demographic to have products that reflect the needs\
    \ of this segment.^([^(127)](#fn127)) The biggest surprise is that a majority\
    \ are women under 30 years old. This is rarely the face of the creators of technology,\
    \ and this needs to change.\n\nInteresting enough, studies have been done—it’s\
    \ not just a theory. Both Stanford^([^(128)](#fn128)) and Harvard^([^(129)](#fn129))\
    \ have shown that when the technologists are a stronger representation of the\
    \ end users, better quality products are the outcome. This results in increased\
    \ revenue, more successful companies, and a competitive advantage the business\
    \ wouldn’t have without a diversified base. A secondary proponent of having a\
    \ more diverse tech workforce is that salaries rise and the gender pay gap diminishes.^([^(130)](#fn130))\
    \ Software development, project management, and computer systems are three of\
    \ the top growing demand positions in our workforce today, and more representation\
    \ is a key to getting more girls interested in these fields early on.\n\nDue to\
    \ lacking technical education in our current school system which is resulting\
    \ in a limited number of Computer Science graduates (Figure [6-3](#469679_1_En_6_Chapter.xhtml#Fig3)),\
    \ this may require us to lean heavily on “accidental technologists.”^([^(131)](#fn131))\
    \ This type of technical professional, the ones that came by it without a degree,\
    \ but due to a need, currently makes up about 50% of those in the database industry\
    \ that I work in. These individuals either have degrees in fields other than computer\
    \ science, came in from the military, or for some, just weren’t comfortable in\
    \ standard schooling curriculum but were technically savvy, and the lacking workforce\
    \ allowed them to gain more than enough experience where a degree was no longer\
    \ warranted.\n\n![../images/469679_1_En_6_Chapter/469679_1_En_6_Fig3_HTML.png](images/469679_1_En_6_Chapter/469679_1_En_6_Fig3_HTML.png)\n\
    \nFigure 6-3.\n\nPercentage of students focused on CS careers vs. the workforce\
    \ demand. Source: [`https://code.org`](https://code.org)\n\nWith the sheer number\
    \ of technologists, we’ll require in the next 2 years, I believe we’ll see increasing\
    \ numbers of accidental technologists working into new careers in the industry.\
    \ It will require training, often working from a role they previously were more\
    \ qualified for, but then lead to the discovery of technical skills lending them\
    \ to succeed in a new technical role. I don’t see this as a deficit, as it will\
    \ result in a more well-rounded technical industry in the end."
  trans: "\n# 远程工作的技术与多样性\n\n有些人对我能如此远程工作感到困惑，但随着近期的技术发展，我能够通过一个专用的移动热点在线工作，这让我比那些使用住宅\
    \ WiFi 连接的同行拥有更好的连接性。我通过网络会议与客户会面，支持他们使用 Microsoft 数据平台和 AI 技术栈，如果他们需要我到现场，我只需找一个附近的机场飞过去，这种情况并不常见。我的办公室实际上可以装进一个小背包，而且众所周知，技术正变得越来越小、越来越便携。\n\
    \n这就是技术为我提供的生活，我希望无论从事哪个行业，其他人也能获得这种满足感。但在谈到技术时，我也想要指出我们一直失败的地方。我拥有技能、运气、毅力和巨大支持的组合，从而成就了非凡的职业生涯，我希望其他人也能如此。梦想是，当我到达一所学校时，有\
    \ 30%或更多的女孩对学习技术职业感兴趣。如果我们努力，技术部门能够紧密代表我们所生活的现实世界的那一天是可以实现的。\n\n对于女性和有色人种来说，在技术领域存在大量的机会，每个人都应该有途径获得这些机会。当他们拥有这些机会时，我们所有人都能从中受益。除了那些不恰当的评论、隐形、晋升跳过和性别薪酬差距之外，还有包容性和多样性的招聘实践倡议。即使由于女性或有色人种候选人数量有限，被雇佣者中男性比例仍然更高，但这些男性更倾向于以开放的心态思考包容性和多样性。他们不太可能限制身边的女性和有色人种，因为招聘流程已经改变，包含了这些重要方面，无论他们雇佣谁。这不仅仅关乎被雇佣者的种族或性别，还关乎此人如何看待包容性和多样性。\n\
    \n这是一个改变游戏规则的因素，因为我们认识到，**我们所有人都是解决方案的一部分**。当每个人都专注于多样性（图 6-2）是产品和收入成功的关键这一目标时，女性和有色人种也会随之成功。偏见减少了，我们会有更多女性担任技术和领导职位。\n\
    \n![../images/469679_1_En_6_Chapter/469679_1_En_6_Fig2_HTML.png](img/469679_1_En_6_Fig2_HTML.png)\n\
    \n图 6-2. 技术行业的整体多样性，TechCrunch 2018\n\n当男性试图驾驭这个领域并超越我们从小被灌输的偏见时，他们可能想知道如何成为女性和有色人种的成功倡导者。以下是一些可靠的方法，可以赋能你身边的人变得更好。\n\
    \n1.  注意你是否可能对身边的人表现出居高临下或屈尊俯就的态度。这是疏远技术领域女性最快的方式之一。\n\n2.  除非一位女性**直接**请求你解释某件事，否则**不要**解释。“男性说教”这个说法并不令人愉快，但它确实经常发生。\n\
    \n3.  当你目睹偏见时，要发声。\n    1.  如果女性的想法或工作成果被归功于他人，请指出来。\n    2.  如果一位女性难以插话，请通过打断那个或那群人，说“我们还没听到\
    \ XXXX 的意见，我想听听她怎么说”来帮助她。\n    3.  当讨论晋升或任务分配时，注意是否有女性同事被推荐。如果没有，推荐一位。\n    4.\
    \  如果一位男同事在与女性同事互动时遇到困难，考虑把他拉到一边私下讨论。如果他倾向于反击，你的介入如果让他难堪，可能会加剧这种行为。\n    5.  “更衣室”谈话对女性在团队中的地位或职业生涯具有极大的破坏性。要指出来，并要求停止这种行为。\n\
    \n男性在这些情况下处于特权地位，作为盟友，他们在行业中拥有巨大的变革力量。成为身边人的倡导者可以创造更好的工作场所、更好的团队，以及更成功的业务。^(¹²⁵)\n\
    \n技术变得以男性为中心的主要驱动力之一是 20 世纪 80 年代面向男孩的电脑营销。不仅仅是广告，连游戏也都是针对男性兴趣设计的。^(¹²⁶) 想想这个决定让占人口\
    \ 50%的年轻女性失去了多少收入。我相信这是历史上的一个关键错误，既损失了收入，也损失了来自杰出技术人才的数十年的贡献。为了让我们真正以光速前进，我们需要将整个社会的全面代表带入技术的设计和开发中。任何由孤立群体完成的事情都只会继续产生有缺陷的结果，并且永远无法发挥其全部潜力。\n\
    \n在当今市场，多样性对企业的好处是更大的竞争优势，女性做出 85%的购买决策，企业开始意识到这一人群要求产品反映他们需求的诉求。^(¹²⁷) 最令人惊讶的是，大多数是\
    \ 30 岁以下的女性。这很少是技术创造者的面孔，这种情况需要改变。\n\n有趣的是，已有研究证明——这不仅仅是理论。斯坦福大学^(¹²⁸)和哈佛大学^(¹²⁹)都表明，当技术人员更能代表最终用户时，就会产生更高质量的产品。这导致收入增加、公司更成功，以及企业如果没有多元化基础就无法获得的竞争优势。拥有更多元化的技术劳动力的第二个好处是，工资会上升，性别薪酬差距会缩小。^(¹³⁰)\
    \ 软件开发、项目管理和计算机系统是我们当今劳动力市场中需求量最大的三个岗位，更多的代表是让更多女孩早期对这些领域产生兴趣的关键。\n\n由于当前学校体系缺乏技术教育，导致计算机科学毕业生数量有限（图\
    \ 6-3），这可能要求我们严重依赖“意外技术人员”。^(¹³¹) 这类技术专业人士，即非科班出身但因需求而入行的人，目前约占我所在数据库行业从业人员的 50%。这些人要么拥有计算机科学以外的学位，要么来自军队，或者有些人只是不适应标准的学校课程但精通技术，而劳动力的匮乏让他们获得了足够多的经验，以至于学位已不再是必要条件。\n\
    \n![../images/469679_1_En_6_Chapter/469679_1_En_6_Fig3_HTML.png](img/469679_1_En_6_Fig3_HTML.png)\n\
    \n图 6-3. 专注于 CS 职业的学生比例与劳动力需求对比。来源：[`https://code.org`](https://code.org)\n\n\
    考虑到未来两年我们将需要的技术人员数量庞大，我相信我们会看到越来越多的“意外技术人员”进入行业的新岗位。这需要培训，他们通常从以前更有资格的岗位开始，然后发现自己被引导去发现技术技能，从而在新的技术岗位上取得成功。我不认为这是一个缺陷，因为它最终会让技术行业变得更加全面。\n"
- fmt: 'As products are more representative to the end users they represent, greater
    interest results in technology, which also drives more diversity in technical
    careers. It would only be natural for this representation to result in more Computer
    Science degrees and technical schools to drive our tech industry.^([^(132)](#fn132))
    These kinds of changes could create a wave even greater than that of Silicon Valley,
    and with the technical advances we already have in place, it could encompass more
    than just a location but be driven throughout the country and move out to envelope
    the world.


