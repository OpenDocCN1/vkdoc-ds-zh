- fmt: '# As the younger generation begins to navigate into their arena and they feel
    threatened


    I experienced less direct attacks by these women against their competition as
    a way to solidify their standing or in misdirected self-defense. There was no
    doubt that they had worked hard to get where they are, and they viewed a younger,
    competent woman as a viable threat in a world dominated by men. I found that identifying
    ways to deescalate the situation without giving up my goal or agenda was important
    to overcoming the situation. One of the best ways to win them over to your side
    is to be there to defend them when these women that made targets of you are the
    targets of bias themselves.


    ## The Token Woman


    There’s significant discussion on the advantages and disadvantages of having set
    quotas of women in tech.^([^(37)](#fn37)) Some feel the representation by having
    a quota will inoculate those that aren’t used to seeing women in the industry,
    helping to build it to the norm. Others feel it is the wrong way to introduce
    women, and that by having quotas, the men already present will be sidelined, as
    well as bias unaddressed. A “token quota” occurs when a group, board, event, etc.
    locates a woman in the industry and involves her, either as the “token female”
    ignoring all other women or having a woman involved, but not contributing in her
    area of specialty. When I first started presenting in the technical community,
    I discovered that the few women already present were often bypassed for me, as
    I was the new woman to fill the quota. These peers would be told, “We already
    have a woman keynote/on the panel/speaking,” and this created some resentment
    toward me. It gives the impression that there’s only one seat at the table for
    a woman to be part of the group and creates competition between the women present.
    It deters them from supporting each other and improving representation. As I started
    to understand this (and experienced it for myself as some of the women I was mentoring
    started to get noticed and replaced my “seat at the table”), I truly understood
    the complexities of this bias.


    When we were asked to do Women in Tech events that didn’t highlight our technical
    skills or just have us contribute our time toward “feel good” events, I made the
    decision to decline. Representation is important, but it must be done correctly.
    When women around me were ignored while I continued to be recognized, I tried
    to highlight their accomplishments and have them receive the same recognition
    as I had. It was as important to sponsor the women already present in the industry
    as it was to support those coming in.


    ## Being There for Each Other


    When I experience a situation where bias is evident from a female peer, it can
    be very difficult to understand, let alone know how to react. Over the years,
    I’ve had to face it subliminally in myself, as we need to remember, bias can be
    very unconscious. I would be forced to ask myself, “How would I respond if it
    was a male peer that was involved?” It can be very humbling to realize that we
    are exposed to bias as part of sociably acceptable behavior from the very beginning
    of our lives and to be honest with ourselves creates personal growth.


    If I’m the target of the bias, I take the situation apart and try to see if through
    the other person’s eyes. I do what I can to diffuse the situation that is the
    cause. Now, this is not to say that I accept poor treatment from someone. As we’ve
    discussed earlier, you can be sensitive to other’s feelings and still stand your
    ground. When a fellow woman mistreats me in person or online, I’ll try to give
    them the benefit of the doubt but expect the incident to be a one-time situation.
    If it occurs more than once, I’ve been known to remove myself from their circle
    of influence. As I don’t like to have my time wasted, I also don’t have a lot
    of patience for what I consider foolishness.


    ## Just Say It


    Bias dictates that women are expected to be kinder with their words.^([^(38)](#fn38))
    We’ve all heard that if you don’t have anything nice to say, don’t say it at all.
    I, instead, became quite skilled in saying what needed to be said in a way that
    people wanted to hear it. The goal is to remember what you wish to get out of
    the conversation, no matter if it’s an apology, an agreement, or a compromise,
    say what will help everyone come to that goal.


    Even with this goal, I hear descriptions of interactions with me that are far
    different from what occurred. We can be very uncomfortable with women who are
    direct, and due to this, women have developed ways of saying things that can be
    interpreted to mean different things depending on vocal tone, inflection, and
    facial expressions.^([^(39)](#fn39)) When this happens, it’s good to discuss directly
    with the person who is misinformed and clear up situations before they become
    unmanageable. Ignoring it won’t make it go away. If the person seems unreasonable,
    you may have no other choice. Remember to recognize your effort. Karma has a way
    of showing that person’s true colors to those involved, and you get to save time
    and valuable energy.


    ## Bless Her Heart


    Women are highly skilled in communication, and nothing is more evident of this
    than how Southern women are recognized for the multiple meanings behind the saying,
    “Bless your heart.” Uttering those three words can mean:


    1.  They admire you.

    2.  They feel sorry for you.

    3.  They are fed up with you.

    4.  They think you’re an idiot.

    5.  They may be planning on how to poison you at dinner.


    Hopefully, #5 isn’t the case, but I have no doubt that each of you were hearing
    a lovely, southern drawl in your head, repeatedly saying, “Bless your heart” with
    different inflections and meaning something completely different each time. As
    we’ve discussed in other chapters, communication is a complex skill.


    Women in turn need to keep in mind that although their intent and the inflection
    in their voice may say one thing, the receiver may take offense to a woman using
    the same direct communication style a man would. It’s worth the time to ask the
    listener to repeat what you’ve said and verify that everyone is on the same page
    and the message was received in the way it was intended.'
